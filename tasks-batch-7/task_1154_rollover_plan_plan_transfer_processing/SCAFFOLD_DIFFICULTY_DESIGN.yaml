            - "day-61 deposit rejected: error_id == ERR_DEPOSIT_PAST_DEADLINE (${err_late})"

      - name: age_714_month_boundary
        grounds:
          - calculations.eligibility_determination
          - errors[ERR_NOT_ELIGIBLE]
        distinguishing_aspect: |
          Metric: age in complete calendar months; endpoint: POST
          /v1/rollover-cases/{caseId}/submit (distinct from the sibling's redeposits
          endpoint). At clock 2026-05-01 a participant born 1966-11-01 has age_months == 714
          (eligible, >=), while 1966-11-02 yields 713 -> ERR_NOT_ELIGIBLE.
        test_recipe:
          setup:
            - "Plan A, clock 2026-05-01"
            - "P_ok dob 1966-11-01 ACTIVE SINGLE; P_no dob 1966-11-02 ACTIVE SINGLE; each with a PRE_TAX 500,000 account and an INDIRECT case (acknowledged)"
          setup_api_calls:
            - { call: "POST /v1/plans", payload: { plan_name: "Plan A", plan_type: "PLAN_401K" }, as: PlanSponsorAdmin, captures: { plan_a: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: OperationsAgent }
            - { call: "POST /v1/participants", payload: { full_name: "Ok Boundary", date_of_birth: "1966-11-01", employment_status: "ACTIVE", marital_status: "SINGLE" }, as: PlanSponsorAdmin, captures: { p_ok: "$.data.id" } }
            - { call: "POST /v1/participants", payload: { full_name: "No Boundary", date_of_birth: "1966-11-02", employment_status: "ACTIVE", marital_status: "SINGLE" }, as: PlanSponsorAdmin, captures: { p_no: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { participant_id: "${p_ok}", plan_id: "${plan_a}", initial_balances: [ { source_type: "PRE_TAX", balance_cents: 500000, basis_cents: 0, vested_pct: 100 } ] }, as: PlanSponsorAdmin, captures: { a_ok: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { participant_id: "${p_no}", plan_id: "${plan_a}", initial_balances: [ { source_type: "PRE_TAX", balance_cents: 500000, basis_cents: 0, vested_pct: 100 } ] }, as: PlanSponsorAdmin, captures: { a_no: "$.data.id" } }
            - { call: "POST /v1/rollover-cases", payload: { case_type: "INDIRECT_ROLLOVER_OUT", source_account_id: "${a_ok}", receiving_institution_name: "External IRA Trust", withholding_acknowledged: true }, as: Participant, as_user_id: "${p_ok}", captures: { c_ok: "$.data.id" } }
            - { call: "POST /v1/rollover-cases", payload: { case_type: "INDIRECT_ROLLOVER_OUT", source_account_id: "${a_no}", receiving_institution_name: "External IRA Trust", withholding_acknowledged: true }, as: Participant, as_user_id: "${p_no}", captures: { c_no: "$.data.id" } }
          trigger:
            - { call: "POST /v1/rollover-cases/${c_ok}/submit", payload: {}, as: Participant, as_user_id: "${p_ok}", captures: { qe_ok: "$.data.qualifying_event", st_ok: "$.data.status" } }
            - { call: "POST /v1/rollover-cases/${c_no}/submit", payload: {}, as: Participant, as_user_id: "${p_no}", captures: { err_no: "$.data.error_id" } }
          assert:
            - "age_months == 714 exactly: submit succeeds, qualifying_event == AGE_59_HALF (${qe_ok}), status == DOCS_PENDING (${st_ok})"
            - "age_months == 713 (one day younger): submit rejected ERR_NOT_ELIGIBLE (${err_no})"

      - name: withholding_zero_when_fully_basis
        grounds:
          - calculations.indirect_withholding
          - calculations.source_allocation
        distinguishing_aspect: |
          Metric: zero-quantity withholding; endpoint: issue-disbursement (distinct from
          both siblings). An account whose ONLY source is AFTER_TAX with basis == balance
          (600,000/600,000) produces taxable_cents == 0, and the mandatory 20% withholding
          collapses to exactly 0 — net == gross, no negative or fractional residue.
        test_recipe:
          setup:
            - "Plan A, clock 2026-06-01; P1 SEPARATED SINGLE; account A1 single source AFTER_TAX 600,000 balance / 600,000 basis"
            - "Full INDIRECT case approved by proc-1"
          setup_api_calls:
            - { call: "POST /v1/plans", payload: { plan_name: "Plan A", plan_type: "PLAN_401K" }, as: PlanSponsorAdmin, captures: { plan_a: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: OperationsAgent }
            - { call: "POST /v1/participants", payload: { full_name: "Pat One", date_of_birth: "1960-06-15", employment_status: "SEPARATED", marital_status: "SINGLE", separation_date: "2026-04-15" }, as: PlanSponsorAdmin, captures: { p1: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { participant_id: "${p1}", plan_id: "${plan_a}", initial_balances: [ { source_type: "AFTER_TAX", balance_cents: 600000, basis_cents: 600000, vested_pct: 100 } ] }, as: PlanSponsorAdmin, captures: { a1: "$.data.id" } }
            - { call: "POST /v1/rollover-cases", payload: { case_type: "INDIRECT_ROLLOVER_OUT", source_account_id: "${a1}", receiving_institution_name: "External IRA Trust", withholding_acknowledged: true }, as: Participant, as_user_id: "${p1}", captures: { c1: "$.data.id" } }
            - { call: "POST /v1/rollover-cases/${c1}/submit", payload: {}, as: Participant, as_user_id: "${p1}" }
            - { call: "GET /v1/rollover-cases/${c1}/documents", as: RolloverProcessor, captures: { d0: "$.data[0].id", d1: "$.data[1].id" } }
            - { call: "POST /v1/documents/${d0}/submit", payload: {}, as: Participant, as_user_id: "${p1}" }
            - { call: "POST /v1/documents/${d1}/submit", payload: {}, as: Participant, as_user_id: "${p1}" }
            - { call: "POST /v1/documents/${d0}/review", payload: { decision: "ACCEPTED" }, as: RolloverProcessor, as_user_id: "proc-1" }
            - { call: "POST /v1/documents/${d1}/review", payload: { decision: "ACCEPTED" }, as: RolloverProcessor, as_user_id: "proc-1" }
            - { call: "POST /v1/rollover-cases/${c1}/decide-eligibility", payload: { decision: "APPROVE" }, as: RolloverProcessor, as_user_id: "proc-1" }
          trigger:
            - { call: "POST /v1/rollover-cases/${c1}/issue-disbursement", payload: { method: "ACH" }, as: RolloverProcessor, as_user_id: "proc-2", captures: { g: "$.data.gross_cents", w: "$.data.withholding_cents", n: "$.data.net_cents" } }
          assert:
            - "gross_cents == 600000 (${g}) and basis covers it entirely (basis_portion_cents == 600000)"
            - "taxable_cents == 0 -> withholding_cents == 0 (${w}) — 20% of zero is exactly zero, never negative"
            - "net_cents == gross_cents == 600000 (${n})"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: direct_issue_requires_verification_verified
        grounds:
          - state_machines.RolloverCase.ELIGIBLE_to_DISBURSED
          - state_machines.SourcePlanVerification.PENDING_to_VERIFIED
          - errors[ERR_VERIFICATION_NOT_VERIFIED]
        distinguishing_aspect: |
          Entity pair RolloverCase x SourcePlanVerification: a DIRECT_ROLLOVER_OUT case in
          ELIGIBLE cannot assemble its disbursement while the OUTBOUND verification is
          PENDING (ERR_VERIFICATION_NOT_VERIFIED); flipping the verification to VERIFIED
          (a different entity's state change) unblocks the identical request.
        test_recipe:
          setup:
            - "Plan A, clock 2026-06-01; P1 SEPARATED SINGLE; canonical A1"
            - "DIRECT_ROLLOVER_OUT case (external institution) approved by proc-1; OUTBOUND verification opened, still PENDING"
          setup_api_calls:
            - { call: "POST /v1/plans", payload: { plan_name: "Plan A", plan_type: "PLAN_401K" }, as: PlanSponsorAdmin, captures: { plan_a: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: OperationsAgent }
            - { call: "POST /v1/participants", payload: { full_name: "Pat One", date_of_birth: "1960-06-15", employment_status: "SEPARATED", marital_status: "SINGLE", separation_date: "2026-04-15" }, as: PlanSponsorAdmin, captures: { p1: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { participant_id: "${p1}", plan_id: "${plan_a}", initial_balances: [ { source_type: "PRE_TAX", balance_cents: 500000, basis_cents: 0, vested_pct: 100 } ] }, as: PlanSponsorAdmin, captures: { a1: "$.data.id" } }
            - { call: "POST /v1/rollover-cases", payload: { case_type: "DIRECT_ROLLOVER_OUT", source_account_id: "${a1}", receiving_institution_name: "External IRA Trust" }, as: Participant, as_user_id: "${p1}", captures: { c1: "$.data.id" } }
            - { call: "POST /v1/rollover-cases/${c1}/submit", payload: {}, as: Participant, as_user_id: "${p1}" }
            - { call: "GET /v1/rollover-cases/${c1}/documents", as: RolloverProcessor, captures: { d0: "$.data[0].id", d1: "$.data[1].id" } }
            - { call: "POST /v1/documents/${d0}/submit", payload: {}, as: Participant, as_user_id: "${p1}" }
            - { call: "POST /v1/documents/${d1}/submit", payload: {}, as: Participant, as_user_id: "${p1}" }
            - { call: "POST /v1/documents/${d0}/review", payload: { decision: "ACCEPTED" }, as: RolloverProcessor, as_user_id: "proc-1" }
            - { call: "POST /v1/documents/${d1}/review", payload: { decision: "ACCEPTED" }, as: RolloverProcessor, as_user_id: "proc-1" }
            - { call: "POST /v1/rollover-cases/${c1}/decide-eligibility", payload: { decision: "APPROVE" }, as: RolloverProcessor, as_user_id: "proc-1" }
            - { call: "POST /v1/rollover-cases/${c1}/verifications", payload: { direction: "OUTBOUND", method: "PLAN_LETTER" }, as: RolloverProcessor, as_user_id: "proc-1", captures: { ver: "$.data.id" } }
          trigger:
            - { call: "POST /v1/rollover-cases/${c1}/issue-disbursement", payload: { method: "WIRE" }, as: RolloverProcessor, as_user_id: "proc-2", captures: { err_blocked: "$.data.error_id" } }
            - { call: "POST /v1/verifications/${ver}/complete", payload: { outcome: "VERIFIED" }, as: RolloverProcessor, as_user_id: "proc-1" }
            - { call: "POST /v1/rollover-cases/${c1}/issue-disbursement", payload: { method: "WIRE" }, as: RolloverProcessor, as_user_id: "proc-2", captures: { disb: "$.data.id", disb_status: "$.data.status" } }
          assert:
            - "while SourcePlanVerification.${ver} is PENDING: issue-disbursement -> ERR_VERIFICATION_NOT_VERIFIED (${err_blocked})"
            - "after VERIFIED: identical request succeeds, Disbursement.${disb} created PENDING (${disb_status})"
            - "DIRECT case withholding will be 0 (direct_exempt variant) when issued"

      - name: transfer_completion_requires_loans_resolved
        grounds:
          - state_machines.RolloverCase.ACCEPTANCE_PENDING_to_COMPLETED
          - state_machines.Loan.ACTIVE_to_TRANSFERRED
          - errors[ERR_LOANS_OUTSTANDING]
        distinguishing_aspect: |
          Entity pair RolloverCase x Loan (distinct from the sibling's
          RolloverCase x SourcePlanVerification): execute-transfer on a PLAN_TRANSFER case
