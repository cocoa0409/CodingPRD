- rule_id: compensating_invariant
  instances:
  - name: invoice_then_reverse_restores_the_client_balance_exactly
    grounds: calculations.client_receivable_balance (append-only fold, invariant); state_machines.FeeMilestone.INVOICED
      -> REVERSED; entities.LedgerEntry.balance_after_cents
    mechanism: The ledger is append-only, so a reversal is a new row of equal magnitude and opposite sign rather than
      an edit or a delete. Invoicing the ENGAGEMENT milestone appends +1004850 and reversing it appends -1004850,
      so the refolded balance returns to its exact prior value and each row keeps the balance_after_cents it was stamped
      with at append time.
    naive_implementation: Delete or mutate the original FEE_INVOICED row on reversal (the ledger then has one row
      and no audit trail), or recompute balance_after_cents on every existing row so the history is rewritten.
    distinguishing_aspect: After the round trip outstanding_balance_cents is exactly 0 again while the ledger holds
      three rows whose balance_after_cents read 0, 1004850 and 0 in append order.
