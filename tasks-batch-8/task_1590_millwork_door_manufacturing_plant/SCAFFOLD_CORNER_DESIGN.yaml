  # ==================================================================
  # Section: endpoints
  # ==================================================================
  - section: endpoints
    instances:
      - name: invoice_summary_computed_read_matches_order
        claim_type: computed_read
        grounds: ["endpoints[GET /millwork/orders/{id}/invoice-summary]", "calculations.order_pricing"]
        distinguishing_aspect: "The invoice-summary computed read agrees with the order's stored contract fields after approval: merchandise 160670, freight 25000, contract 185670, budget 173895, line_count 2."
        test_recipe:
          setup: ["MAPLE TEMPLATE_PREP MIN_20 order (openings 2xMIN_20 + 1xNONE) CONFIGURED and drawing-approved — identical inputs to the pinned pricing literals."]
          setup_api_calls:
            - { call: "POST /millwork/projects", payload: { name: "P", site_address: "1 Main St", contract_code: "CE-1" }, as: PlantManager, captures: { proj_id: $.data.id } }
            - { call: "POST /millwork/hardware-templates", payload: { template_code: "T-E1", manufacturer: "ACME", fire_rated_compatible: true }, as: PlantManager, captures: { tmpl_id: $.data.id } }
            - { call: "POST /millwork/orders", payload: { project_id: "${proj_id}", order_code: "O-E1", species: "MAPLE", profile_code: "PR-7", finish_system: "STAIN", sheen_target: "SATIN", hardware_prep_mode: "TEMPLATE_PREP", hardware_template_id: "${tmpl_id}", fire_rating_required: "MIN_20" }, as: Estimator, captures: { ord_id: $.data.id } }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_id}", opening_no: "101", width_in: 36, height_in: 84, leaf_count: 2, fire_rating: "MIN_20", required_on_site_date: "2026-10-01" }, as: Estimator }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_id}", opening_no: "102", width_in: 30, height_in: 80, leaf_count: 1, fire_rating: "NONE", required_on_site_date: "2026-10-01" }, as: Estimator }
            - { call: "PUT /millwork/orders/${ord_id}/status", payload: { target_status: "CONFIGURED" }, as: Estimator }
            - { call: "GET /millwork/orders/${ord_id}", as: Any, captures: { ord_v: $.data.version } }
            - { call: "POST /millwork/shop-drawings", payload: { order_id: "${ord_id}", expected_order_version: "${ord_v}" }, as: Estimator, captures: { drw_id: $.data.id } }
            - { call: "PUT /millwork/shop-drawings/${drw_id}/status", payload: { target_status: "SUBMITTED" }, as: Estimator, as_user_id: "est-1" }
            - { call: "PUT /millwork/shop-drawings/${drw_id}/status", payload: { target_status: "APPROVED" }, as: Architect, as_user_id: "arch-1" }
          trigger:
            - { call: "GET /millwork/orders/${ord_id}/invoice-summary", as: Any, captures: { merch: $.data.merchandise_total_cents, freight: $.data.freight_fee_cents, contract: $.data.contract_price_cents, budget: $.data.budget_quote_cents, lines: $.data.line_count } }
          assert:
            - "captured ${merch} == 160670 and captured ${freight} == 25000 and captured ${contract} == 185670"
            - "captured ${budget} == 173895 and captured ${lines} == 2"
      - name: batch_gates_and_invalid_batch_transition
        claim_type: conditional_action
        grounds: ["endpoints[POST /millwork/finishing-batches/{id}/measure]", "errors[ERR_BATCH_NOT_CURED]", "errors[ERR_ORDER_NOT_FINISHING]", "errors[ERR_INVALID_BATCH_STATUS_TRANSITION]"]
        distinguishing_aspect: "Batch action gating: creating a non-rework batch before FINISHING fails ERR_ORDER_NOT_FINISHING; skipping SPRAYED (MIXED->CURED) is an invalid transition; measuring a SPRAYED batch fails ERR_BATCH_NOT_CURED."
        test_recipe:
          setup: ["MAPLE order IN_PRODUCTION with one MACHINED opening; booth exists."]
          setup_api_calls:
            - { call: "POST /millwork/projects", payload: { name: "P", site_address: "1 Main St", contract_code: "CE-2" }, as: PlantManager, captures: { proj_id: $.data.id } }
            - { call: "POST /millwork/orders", payload: { project_id: "${proj_id}", order_code: "O-E2", species: "MAPLE", profile_code: "PR-2", finish_system: "STAIN", sheen_target: "SATIN", hardware_prep_mode: "INSTALLER_PREP", fire_rating_required: "NONE" }, as: Estimator, captures: { ord_id: $.data.id } }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_id}", opening_no: "1", width_in: 36, height_in: 84, fire_rating: "NONE", required_on_site_date: "2026-10-01" }, as: Estimator, captures: { op1: $.data.id } }
            - { call: "PUT /millwork/orders/${ord_id}/status", payload: { target_status: "CONFIGURED" }, as: Estimator }
            - { call: "GET /millwork/orders/${ord_id}", as: Any, captures: { ord_v: $.data.version } }
            - { call: "POST /millwork/shop-drawings", payload: { order_id: "${ord_id}", expected_order_version: "${ord_v}" }, as: Estimator, captures: { drw_id: $.data.id } }
            - { call: "PUT /millwork/shop-drawings/${drw_id}/status", payload: { target_status: "SUBMITTED" }, as: Estimator, as_user_id: "est-1" }
            - { call: "PUT /millwork/shop-drawings/${drw_id}/status", payload: { target_status: "APPROVED" }, as: Architect, as_user_id: "arch-1" }
            - { call: "POST /millwork/machining-programs", payload: { drawing_id: "${drw_id}", order_id: "${ord_id}", estimated_minutes: 30 }, as: ProductionLead, captures: { prog_id: $.data.id } }
            - { call: "POST /millwork/moulder-machines", payload: { machine_code: "M-E2", supported_species: ["MAPLE"] }, as: PlantManager, captures: { mach_id: $.data.id } }
            - { call: "POST /millwork/moulder-setup-slots", payload: { program_id: "${prog_id}", machine_id: "${mach_id}", start_hour: 8, end_hour: 9 }, as: ProductionLead, captures: { slot_id: $.data.id } }
            - { call: "PUT /millwork/moulder-setup-slots/${slot_id}/status", payload: { target_status: "COMPLETED" }, as: ProductionLead }
            - { call: "PUT /millwork/machining-programs/${prog_id}/status", payload: { target_status: "RELEASED" }, as: ProductionLead }
            - { call: "PUT /millwork/orders/${ord_id}/status", payload: { target_status: "IN_PRODUCTION" }, as: ProductionLead }
            - { call: "PUT /millwork/openings/${op1}/status", payload: { target_fab_status: "MACHINED" }, as: ProductionLead }
            - { call: "POST /millwork/spray-booths", payload: { booth_code: "B-E2" }, as: PlantManager, captures: { booth_id: $.data.id } }
          trigger:
            - { call: "POST /millwork/finishing-batches", payload: { order_id: "${ord_id}", booth_id: "${booth_id}", cure_start_hour: 10, cure_end_hour: 14 }, as: ProductionLead, captures: { err_fin: $.data.error_id } }
            - { call: "PUT /millwork/orders/${ord_id}/status", payload: { target_status: "FINISHING" }, as: ProductionLead }
            - { call: "POST /millwork/finishing-batches", payload: { order_id: "${ord_id}", booth_id: "${booth_id}", cure_start_hour: 10, cure_end_hour: 14 }, as: ProductionLead, captures: { b1: $.data.id } }
            - { call: "PUT /millwork/finishing-batches/${b1}/status", payload: { target_status: "CURED" }, as: ProductionLead, captures: { err_skip: $.data.error_id } }
            - { call: "PUT /millwork/finishing-batches/${b1}/status", payload: { target_status: "SPRAYED" }, as: ProductionLead }
            - { call: "POST /millwork/finishing-batches/${b1}/measure", payload: { sheen_measured_gu: 35 }, as: QAInspector, captures: { err_meas: $.data.error_id } }
          assert:
            - "captured ${err_fin} == ERR_ORDER_NOT_FINISHING"
            - "captured ${err_skip} == ERR_INVALID_BATCH_STATUS_TRANSITION (MIXED->CURED skips SPRAYED)"
            - "captured ${err_meas} == ERR_BATCH_NOT_CURED (measure requires CURED)"
      - name: trip_depart_gates
        claim_type: conditional_action
        grounds: ["state_machines.DeliveryTrip", "errors[ERR_NO_OPENINGS_ASSIGNED]", "errors[ERR_INVALID_TRIP_STATUS_TRANSITION]"]
        distinguishing_aspect: "A PLANNED trip with no assigned openings cannot depart (ERR_NO_OPENINGS_ASSIGNED), and PLANNED->DELIVERED is an undeclared pair (ERR_INVALID_TRIP_STATUS_TRANSITION)."
        test_recipe:
          setup: ["Project exists; empty PLANNED trip."]
          setup_api_calls:
            - { call: "POST /millwork/projects", payload: { name: "P", site_address: "1 Main St", contract_code: "CE-3" }, as: PlantManager, captures: { proj_id: $.data.id } }
            - { call: "POST /millwork/delivery-trips", payload: { project_id: "${proj_id}", trip_code: "T-E3", truck_capacity_leaves: 4, departure_date: "2026-10-02", site_arrival_date: "2026-10-03" }, as: PlantManager, captures: { trip_id: $.data.id } }
          trigger:
            - { call: "PUT /millwork/delivery-trips/${trip_id}/status", payload: { target_status: "DELIVERED" }, as: ShippingCoordinator, captures: { err_skip: $.data.error_id } }
            - { call: "PUT /millwork/delivery-trips/${trip_id}/status", payload: { target_status: "DEPARTED" }, as: ShippingCoordinator, captures: { err_empty: $.data.error_id } }
          assert:
            - "captured ${err_skip} == ERR_INVALID_TRIP_STATUS_TRANSITION"
            - "captured ${err_empty} == ERR_NO_OPENINGS_ASSIGNED"
            - "DeliveryTrip.${trip_id}.status == PLANNED"
      - name: full_order_lifecycle_happy_path
        claim_type: action_endpoint
        grounds: ["state_machines.MillworkOrder", "state_machines.Project", "errors[ERR_NO_OPENINGS]", "errors[ERR_OPENINGS_NOT_MACHINED]", "errors[ERR_OPENINGS_NOT_STAGED]", "errors[ERR_OPENINGS_NOT_SHIPPED]", "errors[ERR_OPENINGS_NOT_ACCEPTED]", "errors[ERR_ORDERS_NOT_TERMINAL]", "errors[ERR_PROJECT_NOT_OPEN]", "errors[ERR_INVALID_PROJECT_STATUS_TRANSITION]"]
        distinguishing_aspect: "End-to-end lifecycle drives an unrated order DRAFT->CONFIGURED->SUBMITTED->APPROVED->IN_PRODUCTION->FINISHING->READY_TO_SHIP->SHIPPED->CLOSED and its project OPEN->COMPLETED->ARCHIVED, hitting each forward gate's rejection exactly once before satisfying it."
