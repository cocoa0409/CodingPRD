    roles: [FieldTech, Dispatcher]
    code: 200
    input: []
    output: Visit
    side_effects: ["sets departed_at and tech_user_id from X-User-ID"]
    gates: [G1, G2, G3, G5, G6, G7]
  - method: POST
    path: "/property-care/visits/{id}/arrive"
    description: "Marks arrival and freezes the after-hours flag."
    roles: [FieldTech]
    code: 200
    input: []
    output: Visit
    side_effects: ["sets arrived_at", "runs calculation after_hours_flag"]
    gates: [G1, G2, G3, G5]
  - method: POST
    path: "/property-care/visits/{id}/complete"
    description: "Completes the visit, submits the checklist, prices the visit and fires the deepest cascade in the system."
    roles: [FieldTech]
    code: 200
    input: [completed_item_codes, failed_item_codes, "interior_temp_f?"]
    output: Visit
    side_effects:
      - "CASCADE HOP 1: Visit -> COMPLETED, billing_cycle_id stamped"
      - "runs calculations entitlement_consumption, visit_billable_amount, checklist_completion_pct"
      - "CASCADE HOP 2: creates a CRITICAL Finding per failed critical item code"
      - "CASCADE HOP 3: a CRITICAL Finding on a STORM_ASSESS visit auto-triages to TRIAGED and creates a WorkOrder with work_type STORM_MITIGATION, storm_event_id bound, estimated_labour_hours AUTO_STORM_WO_LABOUR_HOURS (2.0) and estimated_parts_cents AUTO_STORM_WO_PARTS_CENTS (25000), submitted to PENDING_APPROVAL"
      - "CASCADE HOP 4: a STORM-pipeline WorkOrder whose total_cents is at or below STORM_EMERGENCY_APPROVAL_CEILING_CENTS (250000) auto-approves with approved_by_user_id 'system' and auto-dispatches over the window [logical clock, logical clock + AUTO_DISPATCH_WINDOW_HOURS (24) hours], creating a VendorAssignment with status OFFERED"
      - "CASCADE HOP 5: the assignment creates a KeyIssuance on the KeyAsset chosen by calculation key_selection"
      - "CASCADE HOP 6: the issuance creates an AccessGrant"
      - "CASCADE HOP 7: the grant rotates the LOCKBOX code, incrementing KeyAsset.code_rotation_count"
      - "CASCADE HOP 8: the rotation invalidates every AccessGrant whose rotation_index_at_grant is strictly less than the new code_rotation_count"
      - "stamps Property.last_interior_temp_f and re-runs freeze_risk_score / property_risk_posture when interior_temp_f is supplied"
      - "creates a FREEZE_ALARM SecurityIncident when calculation temp_breach_detection returns true"
      - "settles the bound StormResponse to SECURED or SECURED_LATE on a STORM_SECURE visit"
    gates: [G1, G2, G3, G5, G9, G10]
  - method: POST
    path: "/property-care/visits/{id}/defer"
    description: "Defers a scheduled visit; billing-neutral branch of the turnover fork."
    roles: [Dispatcher, AccountManager]
    code: 200
    input: [defer_reason]
    output: Visit
    side_effects: ["increments deferral_count", "billable_amount_cents stays 0 and no entitlement unit is consumed"]
    gates: [G1, G2, G3, G5, G10]
  - method: POST
    path: "/property-care/visits/{id}/reschedule"
    description: "Returns a deferred visit to SCHEDULED at a new window."
    roles: [Dispatcher, AccountManager]
    code: 200
    input: [scheduled_start_at, scheduled_end_at]
    output: Visit
    side_effects: ["clears defer_reason", "re-runs calculation turnover_overlap_detection"]
    gates: [G1, G2, G3, G5, G10]
  - method: POST
    path: "/property-care/visits/{id}/convert-to-turnover"
    description: "Absorbs an overlapping watch visit into a rental turnover inspection; the charged branch of the turnover fork."
    roles: [Dispatcher]
    code: 200
    input: [rental_turnover_id]
    output: Visit
    side_effects: ["status CONVERTED", "sets RentalTurnover.absorbed_visit_id", "runs calculation turnover_branch_billing, CONVERTED variant, writing billable_amount_cents 3250", "entitlement_applied stays false"]
    gates: [G1, G2, G3, G5, G10]
  - method: POST
