        distinguishing_aspect: "48h cooling window is inclusive: refund at exactly paid_at+48h succeeds (full 9000, REFUNDED); one second later fails ERR_REFUND_WINDOW_CLOSED."
        test_recipe:
          setup: ["Edition INTAKE_OPEN; two NARRATIVE_FEATURE films by one submitter, both paid at clock 2026-08-01T00:00:00Z (EARLY 9000), both still SUBMITTED"]
          setup_api_calls:
