          assert:
            - "error_id == ERR_FORBIDDEN_ROLE (${r2_err}), HTTP 403 — the role gate fires before the SoD check"

      - name: repair_forbidden_for_operator
        claim_type: role_denied
        grounds: ["roles[RepairSpecialist]", "endpoints[POST /wire-ops/wires/{wireId}/repair]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Repair is exclusive to RepairSpecialist: the WireOperator who owns the wire's lifecycle still cannot repair it."
