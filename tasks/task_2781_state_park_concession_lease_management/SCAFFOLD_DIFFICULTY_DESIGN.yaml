# =============================================================================
# §1.8 SCAFFOLD DIFFICULTY DESIGN — State Park Concession & Lease Management
# Test-targeting index for SCAFFOLD.yaml (§1.1–§1.7). Nine §0.5 rule_ids,
# two instances each = 18 instances. Every grounds ref resolves into
# SCAFFOLD.yaml; every setup_api_calls chain drives empty-DB -> precondition
# using only §1.5 endpoints; every money/score literal was computed with
# Decimal ROUND_HALF_UP against the §1.3 formulas and their constants.
#
# Canonical bootstrap (reused verbatim by most instances) reaches an ACTIVE
# lease on 2027-02-02 with: base_fee_pct 5.00, MAG 6,000,000,
# capital obligation 30,000,000, term 2027-03-01..2037-02-28,
# required bond 3,000,000 (posted), insurance to 2028-06-30.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: annual_tiered_ladder_diverges_from_period_remittance_sum
        grounds:
          - calculations.annual_fee_reconciliation
          - calculations.period_franchise_fee
          - entities.Lease.fields.remitted_fee_ytd_cents
          - entities.FeeReconciliation.fields.base_delta_cents
          - entities.FeeReconciliation.fields.mag_applied_cents
          - concurrency_rules[reconciliation-create-stale-lease]
        distinguishing_aspect: |
          The two variants of annual_fee_reconciliation price the SAME 120,000,000 of
          lease-year receipts differently: annual_tiered_blended runs the marginal tier
          ladder over the annual total and yields 7,750,000, while
          sum_of_period_remittances adds the four flat category rates period by period
          and yields 6,450,000; the reconciliation must persist both figures and invoice
          the 1,300,000 gap rather than agreeing with either one alone.
        test_recipe:
          setup:
            - "A park, an eligible offeror, an approved opportunity and an ISSUED prospectus (minimum fee 4.00, MAG 6,000,000, 10-year term, PER_CRITERION_ROUNDING, min technical 70.00)."
            - "One proposal offering 5.00% and 30,000,000 of capital, scored by two panelists, awarded; the bond is posted at 3,000,000 and the lease executed by a second officer, so contract_status is ACTIVE with base_fee_pct 5.00 and term 2027-03-01..2037-02-28."
            - "An APPROVED operating plan covering the 2027-03-01..2027-12-31 season."
            - "Three ACCEPTED monthly reports (April, May, June 2027), each 40,000,000 of receipts split 10,000,000 lodging / 20,000,000 food-beverage / 8,000,000 retail / 2,000,000 activity, each remitting its 2,150,000 assessed period fee."
            - "The logical clock is moved to 2028-03-05, one day past the end of lease year 1 (2028-02-29), so the year may be reconciled."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /parks"
              payload: { name: "Cedar Hollow State Park", region_code: "NW", annual_visitation: 480000, comparable_lodging_rate_cents: 20000, comparable_meal_rate_cents: 3000, comparable_activity_rate_cents: 9000 }
              as: ProgramAdministrator
              captures: { park_id: $.data.id }
            - call: "POST /offerors"
              payload: { legal_name: "Cedar Hollow Hospitality LLC", contact_email: "ops@cedarhollow.example", bond_capacity_cents: 50000000 }
              as: ProgramAdministrator
              captures: { offeror_id: $.data.id }
            - call: "POST /concession-opportunities"
              payload: { park_id: "${park_id}", title: "Cedar Hollow Lodge Concession", service_category: "LODGING", required_capital_investment_cents: 30000000 }
              as: ConcessionSpecialist
              captures: { opp_id: $.data.id }
            - call: "POST /concession-opportunities/${opp_id}/market-analysis"
              payload: { comparable_gross_receipts_cents: 200000000, market_capture_pct: 80.00, analyst_note: "Regional lodging comparables at 80 percent capture." }
              as: ConcessionSpecialist
            - call: "POST /concession-opportunities/${opp_id}/approve-solicitation"
              payload: {}
              as: ContractingOfficer
              as_user_id: "officer-award-01"
            - call: "POST /prospectuses"
              payload: { opportunity_id: "${opp_id}", minimum_franchise_fee_pct: 4.00, minimum_annual_guarantee_cents: 6000000, term_years: 10, submission_deadline: "2027-02-01T00:00:00Z", weight_experience: 20, weight_operating_plan: 25, weight_capital_investment: 20, weight_financial_capacity: 15, weight_fee_offer: 20, scoring_mode: "PER_CRITERION_ROUNDING", min_technical_score: 70.00 }
              as: ConcessionSpecialist
              captures: { pros_id: $.data.id }
            - call: "POST /prospectuses/${pros_id}/issue"
              payload: {}
              as: ConcessionSpecialist
            - call: "POST /proposals"
              payload: { prospectus_id: "${pros_id}", offeror_id: "${offeror_id}", offered_franchise_fee_pct: 5.00, proposed_capital_investment_cents: 30000000, proposed_annual_guarantee_cents: 6000000, experience_years: 12, financial_capacity_ratio: 1.80 }
              as: Concessionaire
              as_user_id: "${offeror_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /proposals/${prop_id}/begin-review"
              payload: {}
              as: ConcessionSpecialist
            - call: "POST /proposals/${prop_id}/evaluations"
              payload: { score_experience: 81, score_operating_plan: 86, score_capital_investment: 91, score_financial_capacity: 76, score_fee_offer: 71 }
              as: EvaluationPanelist
              as_user_id: "panelist-01"
            - call: "POST /proposals/${prop_id}/evaluations"
              payload: { score_experience: 82, score_operating_plan: 85, score_capital_investment: 90, score_financial_capacity: 75, score_fee_offer: 70 }
              as: EvaluationPanelist
              as_user_id: "panelist-02"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-02-02T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /prospectuses/${pros_id}/close"
              payload: {}
              as: ConcessionSpecialist
            - call: "POST /prospectuses/${pros_id}/award"
              payload: { term_start: "2027-03-01" }
              as: ContractingOfficer
              as_user_id: "officer-award-01"
              captures: { lease_id: $.data.id, bond_id: $.data.performance_bond_id }
            - call: "POST /performance-bonds/${bond_id}/post"
              payload: { penal_sum_cents: 3000000, surety_name: "Granite Surety Co." }
              as: Concessionaire
              as_user_id: "${offeror_id}"
            - call: "POST /leases/${lease_id}/execute"
              payload: { insurance_expires_on: "2028-06-30", carrier_name: "Northline Mutual", agency_maintenance_scope: "STRUCTURAL_ONLY" }
              as: ContractingOfficer
              as_user_id: "officer-exec-02"
            - call: "GET /leases/${lease_id}"
              payload: {}
              as: Concessionaire
              as_user_id: "${offeror_id}"
              captures: { lease_v_plan: $.data.version }
            - call: "POST /operating-plans"
              payload: { lease_id: "${lease_id}", expected_lease_version: "${lease_v_plan}", season_start: "2027-03-01", season_end: "2027-12-31", service_level: "FULL", max_lodging_rate_cents: 22000, max_meal_rate_cents: 3400, max_activity_rate_cents: 10000 }
              as: Concessionaire
              as_user_id: "${offeror_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /operating-plans/${plan_id}/approve"
              payload: {}
              as: ContractingOfficer
              as_user_id: "officer-exec-02"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-07-02T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /gross-receipts-reports"
              payload: { lease_id: "${lease_id}", period_start: "2027-04-01", period_end: "2027-05-01", lodging_receipts_cents: 10000000, food_beverage_receipts_cents: 20000000, retail_receipts_cents: 8000000, activity_receipts_cents: 2000000 }
              as: Concessionaire
              as_user_id: "${offeror_id}"
              captures: { rpt1_id: $.data.id }
            - call: "POST /gross-receipts-reports/${rpt1_id}/accept"
              payload: { remittance_received_cents: 2150000 }
              as: ContractingOfficer
              as_user_id: "officer-exec-02"
            - call: "POST /gross-receipts-reports"
              payload: { lease_id: "${lease_id}", period_start: "2027-05-01", period_end: "2027-06-01", lodging_receipts_cents: 10000000, food_beverage_receipts_cents: 20000000, retail_receipts_cents: 8000000, activity_receipts_cents: 2000000 }
              as: Concessionaire
              as_user_id: "${offeror_id}"
              captures: { rpt2_id: $.data.id }
            - call: "POST /gross-receipts-reports/${rpt2_id}/accept"
              payload: { remittance_received_cents: 2150000 }
              as: ContractingOfficer
              as_user_id: "officer-exec-02"
            - call: "POST /gross-receipts-reports"
              payload: { lease_id: "${lease_id}", period_start: "2027-06-01", period_end: "2027-07-01", lodging_receipts_cents: 10000000, food_beverage_receipts_cents: 20000000, retail_receipts_cents: 8000000, activity_receipts_cents: 2000000 }
              as: Concessionaire
              as_user_id: "${offeror_id}"
              captures: { rpt3_id: $.data.id }
            - call: "POST /gross-receipts-reports/${rpt3_id}/accept"
              payload: { remittance_received_cents: 2150000 }
              as: ContractingOfficer
              as_user_id: "officer-exec-02"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2028-03-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "GET /leases/${lease_id}"
              payload: {}
              as: ContractingOfficer
              as_user_id: "officer-exec-02"
              captures: { lease_v_recon: $.data.version }
          trigger:
            - call: "POST /fee-reconciliations"
              payload: { lease_id: "${lease_id}", expected_lease_version: "${lease_v_recon}", lease_year_start: "2027-03-01", lease_year_end: "2028-02-29" }
              as: ContractingOfficer
              as_user_id: "officer-exec-02"
              captures: { recon1_id: $.data.id }
          assert:
            - "HTTP 201"
            - "FeeReconciliation.${recon1_id}.lease_year_number == 1"
            - "FeeReconciliation.${recon1_id}.annual_gross_receipts_cents == 120000000"
            - "FeeReconciliation.${recon1_id}.annual_fee_due_cents == 7750000"
            - "FeeReconciliation.${recon1_id}.mag_applied_cents == 6000000"
            - "FeeReconciliation.${recon1_id}.remitted_total_cents == 6450000"
            - "FeeReconciliation.${recon1_id}.base_delta_cents == 1300000"
            - "FeeReconciliation.${recon1_id}.penalty_cents == 0"
            - "FeeReconciliation.${recon1_id}.interest_cents == 0"
            - "FeeReconciliation.${recon1_id}.additional_fee_due_cents == 1300000"
            - "FeeReconciliation.${recon1_id}.due_date == 2028-03-30"
            - "FeeReconciliation.${recon1_id}.status == PENDING_PAYMENT"
            - "GrossReceiptsReport.${rpt1_id}.assessed_fee_cents == 2150000"
            - "Lease.${lease_id}.outstanding_fee_balance_cents == 1300000"
            - "Lease.${lease_id}.contract_status == ACTIVE"

      - name: composite_score_rounding_location_shifts_evaluation_result
        grounds:
          - calculations.proposal_composite_score
          - entities.Prospectus.fields.scoring_mode
          - entities.Proposal.fields.composite_score
          - state_machines.Proposal.UNDER_REVIEW_to_SCORED
        distinguishing_aspect: |
          Two prospectuses on the same park differ ONLY in scoring_mode, and the two
          proposals underneath them receive byte-identical score sheets from the same two
          panelists; per_criterion_rounding rounds each criterion contribution to 2dp
          before summing and yields 81.21, while final_rounding sums the exact rational
          contributions and rounds once, yielding 81.20 — a one-hundredth divergence that
          only the rounding LOCATION explains.
        test_recipe:
          setup:
            - "One park and one eligible offeror."
            - "Opportunity A and opportunity B, both analysed and approved for solicitation on the same park."
            - "Prospectus A carries scoring_mode PER_CRITERION_ROUNDING; prospectus B carries scoring_mode FINAL_ROUNDING. Every other field is identical (minimum fee 4.00, MAG 6,000,000, 10-year term, weights 20/25/20/15/20, min technical 70.00)."
            - "The same offeror submits one proposal to each prospectus, both offering 5.00% and 30,000,000 of capital; both are moved to UNDER_REVIEW."
            - "Panelist 01 files the score sheet 81/86/91/76/71 on each proposal; both proposals still have evaluation_count 1 and composite_score null."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /parks"
              payload: { name: "Cedar Hollow State Park", region_code: "NW", annual_visitation: 480000, comparable_lodging_rate_cents: 20000, comparable_meal_rate_cents: 3000, comparable_activity_rate_cents: 9000 }
              as: ProgramAdministrator
              captures: { park_id: $.data.id }
            - call: "POST /offerors"
              payload: { legal_name: "Cedar Hollow Hospitality LLC", contact_email: "ops@cedarhollow.example", bond_capacity_cents: 50000000 }
              as: ProgramAdministrator
              captures: { offeror_id: $.data.id }
            - call: "POST /concession-opportunities"
              payload: { park_id: "${park_id}", title: "Cedar Hollow Lodge Concession", service_category: "LODGING", required_capital_investment_cents: 30000000 }
              as: ConcessionSpecialist
              captures: { opp_a_id: $.data.id }
            - call: "POST /concession-opportunities/${opp_a_id}/market-analysis"
              payload: { comparable_gross_receipts_cents: 200000000, market_capture_pct: 80.00 }
              as: ConcessionSpecialist
            - call: "POST /concession-opportunities/${opp_a_id}/approve-solicitation"
              payload: {}
              as: ContractingOfficer
              as_user_id: "officer-award-01"
            - call: "POST /prospectuses"
              payload: { opportunity_id: "${opp_a_id}", minimum_franchise_fee_pct: 4.00, minimum_annual_guarantee_cents: 6000000, term_years: 10, submission_deadline: "2027-02-01T00:00:00Z", weight_experience: 20, weight_operating_plan: 25, weight_capital_investment: 20, weight_financial_capacity: 15, weight_fee_offer: 20, scoring_mode: "PER_CRITERION_ROUNDING", min_technical_score: 70.00 }
              as: ConcessionSpecialist
              captures: { pros_a_id: $.data.id }
            - call: "POST /prospectuses/${pros_a_id}/issue"
              payload: {}
              as: ConcessionSpecialist
            - call: "POST /concession-opportunities"
              payload: { park_id: "${park_id}", title: "Cedar Hollow Marina Concession", service_category: "MARINA", required_capital_investment_cents: 30000000 }
              as: ConcessionSpecialist
              captures: { opp_b_id: $.data.id }
            - call: "POST /concession-opportunities/${opp_b_id}/market-analysis"
              payload: { comparable_gross_receipts_cents: 200000000, market_capture_pct: 80.00 }
              as: ConcessionSpecialist
            - call: "POST /concession-opportunities/${opp_b_id}/approve-solicitation"
              payload: {}
              as: ContractingOfficer
              as_user_id: "officer-award-01"
            - call: "POST /prospectuses"
              payload: { opportunity_id: "${opp_b_id}", minimum_franchise_fee_pct: 4.00, minimum_annual_guarantee_cents: 6000000, term_years: 10, submission_deadline: "2027-02-01T00:00:00Z", weight_experience: 20, weight_operating_plan: 25, weight_capital_investment: 20, weight_financial_capacity: 15, weight_fee_offer: 20, scoring_mode: "FINAL_ROUNDING", min_technical_score: 70.00 }
              as: ConcessionSpecialist
              captures: { pros_b_id: $.data.id }
            - call: "POST /prospectuses/${pros_b_id}/issue"
              payload: {}
              as: ConcessionSpecialist
            - call: "POST /proposals"
              payload: { prospectus_id: "${pros_a_id}", offeror_id: "${offeror_id}", offered_franchise_fee_pct: 5.00, proposed_capital_investment_cents: 30000000, proposed_annual_guarantee_cents: 6000000, experience_years: 12, financial_capacity_ratio: 1.80 }
              as: Concessionaire
              as_user_id: "${offeror_id}"
              captures: { prop_a_id: $.data.id }
            - call: "POST /proposals"
              payload: { prospectus_id: "${pros_b_id}", offeror_id: "${offeror_id}", offered_franchise_fee_pct: 5.00, proposed_capital_investment_cents: 30000000, proposed_annual_guarantee_cents: 6000000, experience_years: 12, financial_capacity_ratio: 1.80 }
              as: Concessionaire
              as_user_id: "${offeror_id}"
              captures: { prop_b_id: $.data.id }
            - call: "POST /proposals/${prop_a_id}/begin-review"
              payload: {}
              as: ConcessionSpecialist
            - call: "POST /proposals/${prop_b_id}/begin-review"
              payload: {}
              as: ConcessionSpecialist
            - call: "POST /proposals/${prop_a_id}/evaluations"
              payload: { score_experience: 81, score_operating_plan: 86, score_capital_investment: 91, score_financial_capacity: 76, score_fee_offer: 71 }
              as: EvaluationPanelist
              as_user_id: "panelist-01"
            - call: "POST /proposals/${prop_b_id}/evaluations"
              payload: { score_experience: 81, score_operating_plan: 86, score_capital_investment: 91, score_financial_capacity: 76, score_fee_offer: 71 }
              as: EvaluationPanelist
              as_user_id: "panelist-01"
          trigger:
            - call: "POST /proposals/${prop_a_id}/evaluations"
              payload: { score_experience: 82, score_operating_plan: 85, score_capital_investment: 90, score_financial_capacity: 75, score_fee_offer: 70 }
              as: EvaluationPanelist
              as_user_id: "panelist-02"
            - call: "POST /proposals/${prop_b_id}/evaluations"
              payload: { score_experience: 82, score_operating_plan: 85, score_capital_investment: 90, score_financial_capacity: 75, score_fee_offer: 70 }
              as: EvaluationPanelist
              as_user_id: "panelist-02"
          assert:
            - "HTTP 201 on both evaluation submissions"
            - "Proposal.${prop_a_id}.evaluation_count == 2"
            - "Proposal.${prop_a_id}.status == SCORED"
            - "Proposal.${prop_a_id}.composite_score == 81.21"
            - "Proposal.${prop_b_id}.evaluation_count == 2"
            - "Proposal.${prop_b_id}.status == SCORED"
            - "Proposal.${prop_b_id}.composite_score == 81.20"
            - "Proposal.${prop_a_id}.composite_score != Proposal.${prop_b_id}.composite_score"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: period_fee_rounds_each_category_before_summing
        grounds:
          - calculations.period_franchise_fee
          - calculations.maintenance_reserve_accrual
          - entities.GrossReceiptsReport.fields.assessed_fee_cents
          - entities.GrossReceiptsReport.fields.maintenance_reserve_due_cents
          - entities.Lease.fields.base_fee_pct
        distinguishing_aspect: |
          Mode (b) — pinned rounding ORDER. period_franchise_fee rounds each of the four
          category products to whole cents first and then adds the four rounded values,
          producing 1,146,913 on receipts of 12,345,760 / 3,333,328 / 2,222,120 /
          1,111,120; summing the raw products and rounding once at the end produces
          1,146,915, so the two cents of difference falsify any implementation that
          reorders the round and the sum.
        test_recipe:
