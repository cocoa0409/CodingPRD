            - call: "POST /delivery-slots"
              payload: { courier_id: "${cr}", subscription_id: "${sub1}", kind: "DELIVERY", window_start_iso: "2026-04-01T09:00:00Z", window_end_iso: "2026-04-01T10:00:00Z" }
              as: FleetOperator
