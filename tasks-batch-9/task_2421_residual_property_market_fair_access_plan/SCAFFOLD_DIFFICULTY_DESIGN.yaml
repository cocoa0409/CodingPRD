              as: RateAnalyst
              as_user_id: "ra-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "RateFiling.${filing_at_floor_id}.differential_pct == 0.1000"
            - "RateFiling.${filing_at_floor_id}.status == FILED"
            - "RateFiling.${filing_at_floor_id}.filed_by_user_id == ra-1"
            - "trigger response status == 422"
            - "response.error_id == ERR_RATE_BELOW_VOLUNTARY_FLOOR"
            - "count(RateFiling where cat_zone_id == ${zone_id}) == 1"

      - name: assessable_amount_must_exceed_zero_by_at_least_one_cent
        grounds:
          - calculations.assessment_assessable_amount
          - calculations.assessment_allocation_shares
          - validations[priority=44]
          - entities.AssessmentEvent.fields.assessable_amount_cents
        distinguishing_aspect: |
          Metric: the assessable-amount zero boundary in whole cents, exercised on
          POST /fair-plan/assessment-events/{id}/allocation-run — a third distinct metric and endpoint:
          losses of exactly 50000000 against reserves of 50000000 give assessable_amount_cents 0 and are
          rejected with ERR_LOSSES_WITHIN_RESERVES, while 50000001 against the same reserves gives
          exactly 1 cent, allocates, and the single cent lands entirely on the greatest-weight member as
          the remainder.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z; three ACTIVE member insurers at market_share_pct 30.00 / 30.00 / 40.00; one HURRICANE zone."
            - "Event EQ in DRAFT with trigger_loss 50000000 and reserves 50000000 (assessable 0)."
            - "Event PLUS in DRAFT with trigger_loss 50000001 and reserves 50000000 (assessable 1)."
          setup_api_calls:
            - call: "POST /fair-plan/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /fair-plan/member-insurers"
              payload: { name: "Carrier One", naic_code: "10001", market_share_pct: 30.00, written_premium_share_pct: 10.00 }
              as: PlanAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /fair-plan/member-insurers"
              payload: { name: "Carrier Two", naic_code: "10002", market_share_pct: 30.00, written_premium_share_pct: 10.00 }
              as: PlanAdmin
              captures: { m2_id: $.data.id }
            - call: "POST /fair-plan/member-insurers"
              payload: { name: "Carrier Three", naic_code: "10003", market_share_pct: 40.00, written_premium_share_pct: 80.00 }
              as: PlanAdmin
              captures: { m3_id: $.data.id }
            - call: "POST /fair-plan/cat-zones"
              payload: { code: "HUR-01", peril: "HURRICANE", exposure_cap_cents: 100000000 }
              as: PlanAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /fair-plan/assessment-events"
              payload: { cat_zone_id: "${zone_id}", trigger_loss_cents: 50000000, reserve_balance_cents_at_trigger: 50000000, allocation_basis: "MARKET_SHARE" }
              as: PlanAdmin
              captures: { ev_eq_id: $.data.id, ev_eq_v: $.data.version }
            - call: "POST /fair-plan/assessment-events"
              payload: { cat_zone_id: "${zone_id}", trigger_loss_cents: 50000001, reserve_balance_cents_at_trigger: 50000000, allocation_basis: "MARKET_SHARE" }
              as: PlanAdmin
              captures: { ev_plus_id: $.data.id, ev_plus_v: $.data.version }
          trigger:
            - call: "POST /fair-plan/assessment-events/${ev_eq_id}/allocation-run"
              payload: { expected_assessment_event_version: "${ev_eq_v}" }
              as: PlanAdmin
              captures: { err_id: $.data.error_id }
            - call: "POST /fair-plan/assessment-events/${ev_plus_id}/allocation-run"
              payload: { expected_assessment_event_version: "${ev_plus_v}" }
              as: PlanAdmin
          assert:
            - "AssessmentEvent.${ev_eq_id}.assessable_amount_cents == 0"
            - "first trigger response status == 422"
            - "response.error_id == ERR_LOSSES_WITHIN_RESERVES"
            - "AssessmentEvent.${ev_eq_id}.status == DRAFT"
            - "AssessmentEvent.${ev_eq_id}.allocation_run_count == 0"
            - "count(AssessmentAllocation where assessment_event_id == ${ev_eq_id}) == 0"
            - "AssessmentEvent.${ev_plus_id}.assessable_amount_cents == 1"
            - "AssessmentEvent.${ev_plus_id}.status == ALLOCATED"
            - "AssessmentEvent.${ev_plus_id}.allocated_total_cents == 1"
            - "AssessmentEvent.${ev_plus_id}.remainder_cents == 1"
            - "AssessmentAllocation(assessment_event_id=${ev_plus_id}, member_insurer_id=${m3_id}).gross_share_cents == 1"
            - "AssessmentAllocation(assessment_event_id=${ev_plus_id}, member_insurer_id=${m1_id}).gross_share_cents == 0"
            - "AssessmentAllocation(assessment_event_id=${ev_plus_id}, member_insurer_id=${m2_id}).gross_share_cents == 0"

