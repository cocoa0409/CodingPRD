# §1.9 Scaffold Corner Design — breadth probe over SCAFFOLD.yaml §1.1-§1.7.
#
# Taxonomy: references/claim-extraction-guide.md. The nine `section:` values and
# their `claim_type:` rows are fixed by that guide; nothing is invented here.
# Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml carry an
# `excluded_because:` stub and NO test_recipe.
#
# Fixture models reused verbatim from §1.8 (same payloads, same literals):
#   FP10-IN   1 module / cabinet   cabinet_pixel_count 1024   cabinet_area 0.1024
#             required_load 100.00  dead_pixel_ppm_limit 976.56  burn_in 24h
#   FP16-STD  2 modules / cabinet  cabinet_pixel_count 4096   cabinet_area 0.1024
#             required_load 150.00  dead_pixel_ppm_limit 500.00 burn_in 24h
#   FP25-OUT  4 modules / cabinet  cabinet_pixel_count 32768  cabinet_area 0.2048
#             required_load 100.10  dead_pixel_ppm_limit 122.07 burn_in 48h
#
# Actor ids: PlantAdmin adm-1, DesignEngineer eng-1, StructuralReviewer rev-1,
# ProductionOperator op-1, QAEngineer qa-1, ServiceManager svc-1,
# FieldEngineer ${crew} (identity: entity_backed:CommissioningCrew).
scaffold_corner_design:

  - section: entities
    instances:
      - name: display_model_creation_returns_all_derived_geometry
        claim_type: creation
        grounds:
          - endpoints.POST_display_models
          - entities.DisplayModel
          - calculations.model_geometry_derivation
        distinguishing_aspect: |
          A single POST must return the whole derived geometry block, each field
          at its declared precision: areas at 4 decimals, viewing distance at 1,
          required load at 2 with round_half_up (20.5 / 0.2048 = 100.09765625
          becomes 100.10, not 100.09 and not 100.098).
        test_recipe:
          setup:
            - "Empty database; logical clock parked at 2026-08-01T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
          trigger:
            - call: "POST /display-models"
              payload: { name: "FP25-OUT", pixel_pitch_mm: 2.5, rated_brightness_nits: 5000, environmental_rating: "IP65_FRONT_IP54_REAR", module_width_mm: 320, module_height_mm: 160, module_pixel_cols: 128, module_pixel_rows: 64, cabinet_width_mm: 640, cabinet_height_mm: 320, modules_per_cabinet: 4, cabinet_weight_kg: 20.5, price_per_sqm_cents: 1234567, dead_pixel_ppm_limit: 122.07, module_dead_pixel_max: 3, module_cluster_max: 1, reference_color_x: 0.3128, reference_color_y: 0.3290, burn_in_hours_required: 48, max_drive_pct: 90 }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { dm: $.data.id }
          assert:
            - "trigger -> 201"
            - "DisplayModel.${dm}.module_area_sqm == 0.0512"
            - "DisplayModel.${dm}.cabinet_area_sqm == 0.2048"
            - "DisplayModel.${dm}.module_pixel_count == 8192"
            - "DisplayModel.${dm}.cabinet_pixel_count == 32768"
            - "DisplayModel.${dm}.recommended_min_viewing_distance_m == 2.5"
            - "DisplayModel.${dm}.required_load_kg_per_sqm == 100.10   # 20.5 / 0.2048 = 100.09765625, round_half_up at 2 dp"
            - "DisplayModel.${dm}.version == 1 and DisplayModel.${dm}.id is a non-empty string"
            - "response envelope: meta.api_request_id present, response_type == 'object'"

      - name: display_model_retrieval_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - endpoints.GET_display_models_display_model_id
          - entities.DisplayModel
        distinguishing_aspect: |
          A GET after the POST must return byte-identical input fields and the
          same derived block — nothing is recomputed with different rounding on
          read, and version stays 1 because a read is not a write.
        test_recipe:
          setup:
            - "One FP16-STD DisplayModel exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /display-models"
              payload: { name: "FP16-STD", pixel_pitch_mm: 5.0, rated_brightness_nits: 5000, environmental_rating: "IP65_FULL", module_width_mm: 320, module_height_mm: 160, module_pixel_cols: 64, module_pixel_rows: 32, cabinet_width_mm: 320, cabinet_height_mm: 320, modules_per_cabinet: 2, cabinet_weight_kg: 15.36, price_per_sqm_cents: 1000000, dead_pixel_ppm_limit: 500.00, module_dead_pixel_max: 3, module_cluster_max: 1, reference_color_x: 0.3128, reference_color_y: 0.3290, burn_in_hours_required: 24, max_drive_pct: 90 }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { dm: $.data.id }
          trigger:
            - call: "GET /display-models/${dm}"
              as: QAEngineer
              as_user_id: "qa-1"
          assert:
            - "trigger -> 200"
            - "DisplayModel.${dm}.name == 'FP16-STD' and DisplayModel.${dm}.pixel_pitch_mm == 5.0"
            - "DisplayModel.${dm}.module_area_sqm == 0.0512 and DisplayModel.${dm}.cabinet_area_sqm == 0.1024"
            - "DisplayModel.${dm}.cabinet_pixel_count == 4096   # 2 modules x (64 x 32)"
            - "DisplayModel.${dm}.recommended_min_viewing_distance_m == 5.0"
            - "DisplayModel.${dm}.required_load_kg_per_sqm == 150.00   # 15.36 / 0.1024"
            - "DisplayModel.${dm}.version == 1   # a GET does not bump version"

      - name: display_model_listing_paginates_and_filters_by_environmental_rating
        claim_type: listing
        grounds:
          - endpoints.GET_display_models
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          limit/offset and the environmental_rating filter must compose: the
          filter narrows the set BEFORE pagination, so total_count reports the
          filtered population (2), not the table size (3), and has_more flips on
          the filtered count.
        test_recipe:
          setup:
            - "Three DisplayModels exist: FP10-IN (IP43_INDOOR), FP16-STD (IP65_FULL) and FP16-STD-B (IP65_FULL)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /display-models"
              payload: { name: "FP10-IN", pixel_pitch_mm: 10.0, rated_brightness_nits: 5000, environmental_rating: "IP43_INDOOR", module_width_mm: 320, module_height_mm: 320, module_pixel_cols: 32, module_pixel_rows: 32, cabinet_width_mm: 320, cabinet_height_mm: 320, modules_per_cabinet: 1, cabinet_weight_kg: 10.24, price_per_sqm_cents: 1000000, dead_pixel_ppm_limit: 976.56, module_dead_pixel_max: 3, module_cluster_max: 1, reference_color_x: 0.3128, reference_color_y: 0.3290, burn_in_hours_required: 24, max_drive_pct: 90 }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /display-models"
              payload: { name: "FP16-STD", pixel_pitch_mm: 5.0, rated_brightness_nits: 5000, environmental_rating: "IP65_FULL", module_width_mm: 320, module_height_mm: 160, module_pixel_cols: 64, module_pixel_rows: 32, cabinet_width_mm: 320, cabinet_height_mm: 320, modules_per_cabinet: 2, cabinet_weight_kg: 15.36, price_per_sqm_cents: 1000000, dead_pixel_ppm_limit: 500.00, module_dead_pixel_max: 3, module_cluster_max: 1, reference_color_x: 0.3128, reference_color_y: 0.3290, burn_in_hours_required: 24, max_drive_pct: 90 }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /display-models"
              payload: { name: "FP16-STD-B", pixel_pitch_mm: 5.0, rated_brightness_nits: 5000, environmental_rating: "IP65_FULL", module_width_mm: 320, module_height_mm: 160, module_pixel_cols: 64, module_pixel_rows: 32, cabinet_width_mm: 320, cabinet_height_mm: 320, modules_per_cabinet: 2, cabinet_weight_kg: 15.36, price_per_sqm_cents: 1000000, dead_pixel_ppm_limit: 500.00, module_dead_pixel_max: 3, module_cluster_max: 1, reference_color_x: 0.3128, reference_color_y: 0.3290, burn_in_hours_required: 24, max_drive_pct: 90 }
              as: PlantAdmin
              as_user_id: "adm-1"
          trigger:
            - call: "GET /display-models?limit=2&offset=0"
              as: ServiceManager
              as_user_id: "svc-1"
            - call: "GET /display-models?environmental_rating=IP65_FULL&limit=1&offset=0"
              as: ServiceManager
              as_user_id: "svc-1"
            - call: "GET /display-models?environmental_rating=IP65_FULL&limit=1&offset=1"
              as: ServiceManager
              as_user_id: "svc-1"
          assert:
            - "trigger call 1 -> 200 with total_count == 3, limit == 2, offset == 0, has_more == true, and 2 rows"
            - "trigger call 2 -> 200 with total_count == 2, has_more == true, and 1 row whose environmental_rating == 'IP65_FULL'"
            - "trigger call 3 -> 200 with total_count == 2, offset == 1, has_more == false, and 1 row"
            - "the FP10-IN row never appears in trigger calls 2 or 3"
            - "response_type == 'array' on all three"

      - name: display_model_get_unknown_id_returns_reference_not_found
        claim_type: not_found
        grounds:
          - validations.priority_4_ERR_REFERENCE_NOT_FOUND
          - errors.ERR_REFERENCE_NOT_FOUND
        distinguishing_aspect: |
          The catalogue entities (DisplayModel, BurnInChamber, CommissioningCrew)
          share ERR_REFERENCE_NOT_FOUND rather than owning per-entity 404 codes,
          so a bad DisplayModel id must NOT surface ERR_PROJECT_NOT_FOUND or a
          bare 500.
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
          trigger:
            - call: "GET /display-models/00000000-0000-0000-0000-000000000404"
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { err: $.data.error_id }
          assert:
            - "trigger -> 404 with ${err} == 'ERR_REFERENCE_NOT_FOUND'"
            - "response_type == 'error' and data.message is a non-empty string"

      - name: display_model_create_missing_required_field_rejected
        claim_type: required_fields
        grounds:
          - endpoints.POST_display_models
          - validations.priority_3_ERR_VALIDATION_FAILED
        distinguishing_aspect: |
          rated_brightness_nits has source: input and no default, so omitting it
          is a 400 at priority 3 — it must not be silently defaulted to 0, which
          would then poison BRIGHTNESS_BIN_1_FRACTION and every warranty
          degradation percentage computed from it.
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
          trigger:
            - call: "POST /display-models"
              payload: { name: "FP10-IN", pixel_pitch_mm: 10.0, environmental_rating: "IP43_INDOOR", module_width_mm: 320, module_height_mm: 320, module_pixel_cols: 32, module_pixel_rows: 32, cabinet_width_mm: 320, cabinet_height_mm: 320, modules_per_cabinet: 1, cabinet_weight_kg: 10.24, price_per_sqm_cents: 1000000, dead_pixel_ppm_limit: 976.56, reference_color_x: 0.3128, reference_color_y: 0.3290, burn_in_hours_required: 24, max_drive_pct: 90 }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { err: $.data.error_id }
          assert:
            - "trigger -> 400 with ${err} == 'ERR_VALIDATION_FAILED'"
            - "GET /display-models returns total_count == 0   # nothing was persisted"

      - name: display_model_omitted_pixel_limits_apply_declared_defaults
        claim_type: defaults
        grounds:
          - entities.DisplayModel.fields.module_dead_pixel_max
          - entities.DisplayModel.fields.module_cluster_max
          - endpoints.POST_display_models
        distinguishing_aspect: |
          module_dead_pixel_max and module_cluster_max are the only optional
          inputs on the model, defaulting to 3 and 1. The defaults must be
          materialised on the row (not left null), because the pixel-test
          pass/fail comparison reads them directly.
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
          trigger:
            - call: "POST /display-models"
              payload: { name: "FP10-IN", pixel_pitch_mm: 10.0, rated_brightness_nits: 5000, environmental_rating: "IP43_INDOOR", module_width_mm: 320, module_height_mm: 320, module_pixel_cols: 32, module_pixel_rows: 32, cabinet_width_mm: 320, cabinet_height_mm: 320, modules_per_cabinet: 1, cabinet_weight_kg: 10.24, price_per_sqm_cents: 1000000, dead_pixel_ppm_limit: 976.56, reference_color_x: 0.3128, reference_color_y: 0.3290, burn_in_hours_required: 24, max_drive_pct: 90 }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { dm: $.data.id }
          assert:
            - "trigger -> 201"
            - "DisplayModel.${dm}.module_dead_pixel_max == 3   # declared default"
            - "DisplayModel.${dm}.module_cluster_max == 1      # declared default"
            - "neither field is null in the response body"

      - name: module_create_ignores_client_supplied_system_and_computed_fields
        claim_type: system_fields
        grounds:
          - endpoints.POST_modules
          - entities.Module.fields.module_state
          - entities.Module.fields.rework_cycles
        distinguishing_aspect: |
          POST /modules declares exactly two inputs. Everything else on Module is
          computed or system, so a client that also posts module_state,
          rework_cycles and dead_pixel_count must not be able to seed a module
          straight into CALIBRATED with a clean rework history.
        test_recipe:
          setup:
            - "One FP10-IN DisplayModel exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /display-models"
              payload: { name: "FP10-IN", pixel_pitch_mm: 10.0, rated_brightness_nits: 5000, environmental_rating: "IP43_INDOOR", module_width_mm: 320, module_height_mm: 320, module_pixel_cols: 32, module_pixel_rows: 32, cabinet_width_mm: 320, cabinet_height_mm: 320, modules_per_cabinet: 1, cabinet_weight_kg: 10.24, price_per_sqm_cents: 1000000, dead_pixel_ppm_limit: 976.56, module_dead_pixel_max: 3, module_cluster_max: 1, reference_color_x: 0.3128, reference_color_y: 0.3290, burn_in_hours_required: 24, max_drive_pct: 90 }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { dm: $.data.id }
          trigger:
            - call: "POST /modules"
              payload: { display_model_id: "${dm}", serial_no: "M-SYS", module_state: "CALIBRATED", rework_cycles: 0, dead_pixel_count: 0, id: "11111111-1111-1111-1111-111111111111", version: 9 }
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { err: $.data.error_id }
          assert:
            - "trigger -> 400 with ${err} == 'ERR_VALIDATION_FAILED'   # unknown body keys are rejected, not silently absorbed"
            - "GET /modules returns total_count == 0"
            - "no Module carries id 11111111-1111-1111-1111-111111111111"

      - name: module_create_defaults_state_counter_and_nullable_measurements
        claim_type: defaults
        grounds:
          - entities.Module.fields.module_state
          - entities.Module.fields.rework_cycles
          - entities.Module.fields.color_bin
        distinguishing_aspect: |
          A freshly manufactured module carries the initial state MANUFACTURED,
          a zeroed monotonic rework counter, and NULL (not 0, not 'A1')
          measurement fields — a 0-valued measured_brightness_nits would later
          read as a 100% degradation claim.
        test_recipe:
          setup:
            - "One FP10-IN DisplayModel exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /display-models"
              payload: { name: "FP10-IN", pixel_pitch_mm: 10.0, rated_brightness_nits: 5000, environmental_rating: "IP43_INDOOR", module_width_mm: 320, module_height_mm: 320, module_pixel_cols: 32, module_pixel_rows: 32, cabinet_width_mm: 320, cabinet_height_mm: 320, modules_per_cabinet: 1, cabinet_weight_kg: 10.24, price_per_sqm_cents: 1000000, dead_pixel_ppm_limit: 976.56, module_dead_pixel_max: 3, module_cluster_max: 1, reference_color_x: 0.3128, reference_color_y: 0.3290, burn_in_hours_required: 24, max_drive_pct: 90 }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { dm: $.data.id }
          trigger:
            - call: "POST /modules"
              payload: { display_model_id: "${dm}", serial_no: "M-1" }
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { m1: $.data.id }
          assert:
            - "trigger -> 201"
            - "Module.${m1}.module_state == MANUFACTURED"
            - "Module.${m1}.rework_cycles == 0"
            - "Module.${m1}.color_bin is null and Module.${m1}.color_bin_rank is null"
            - "Module.${m1}.dead_pixel_count is null and Module.${m1}.measured_brightness_nits is null"
            - "Module.${m1}.cabinet_id is null, slot_index is null, reserved_service_contract_id is null"
            - "Module.${m1}.version == 1"

      - name: project_creation_derives_counts_area_and_both_initial_state_fields
        claim_type: computed_fields
        grounds:
          - entities.DisplayProject.fields.cabinet_count
          - entities.DisplayProject.fields.module_count
          - entities.DisplayProject.fields.total_area_sqm
          - entities.DisplayProject.fields.engineering_state
          - entities.DisplayProject.fields.production_state
        distinguishing_aspect: |
          The project's fan-out fields are derived from the grid and the pinned
          model, not supplied: 2 x 1 cabinets of a 2-module model is 2 cabinets
          and 4 modules over 0.2048 sqm. Both independent state dimensions start
          at their own initial values, and the service posture starts NORMAL
          even though no contract exists yet.
        test_recipe:
          setup:
            - "One FP16-STD DisplayModel exists (2 modules per cabinet, cabinet_area_sqm 0.1024, recommended_min_viewing_distance_m 5.0)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /display-models"
              payload: { name: "FP16-STD", pixel_pitch_mm: 5.0, rated_brightness_nits: 5000, environmental_rating: "IP65_FULL", module_width_mm: 320, module_height_mm: 160, module_pixel_cols: 64, module_pixel_rows: 32, cabinet_width_mm: 320, cabinet_height_mm: 320, modules_per_cabinet: 2, cabinet_weight_kg: 15.36, price_per_sqm_cents: 1000000, dead_pixel_ppm_limit: 500.00, module_dead_pixel_max: 3, module_cluster_max: 1, reference_color_x: 0.3128, reference_color_y: 0.3290, burn_in_hours_required: 24, max_drive_pct: 90 }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { dm: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { customer_name: "Airport Concourse", install_environment: "RETAIL", site_region_code: "NA-W", display_model_id: "${dm}", cabinet_grid_cols: 2, cabinet_grid_rows: 1, min_viewing_distance_m: 5.0, target_brightness_nits: 5000, redundancy_mode: "NONE", output_port_count: 1, port_bandwidth_mbps: 1000, color_depth_bits: 10, refresh_rate_hz: 60, player_count: 1 }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { pj: $.data.id }
          assert:
            - "trigger -> 201"
            - "DisplayProject.${pj}.cabinet_count == 2   # 2 cols x 1 row"
            - "DisplayProject.${pj}.module_count == 4    # 2 cabinets x 2 modules"
            - "DisplayProject.${pj}.total_area_sqm == 0.2048"
            - "DisplayProject.${pj}.engineering_state == DRAFT"
            - "DisplayProject.${pj}.production_state == NOT_STARTED"
            - "DisplayProject.${pj}.service_posture == NORMAL"
            - "DisplayProject.${pj}.approved_revision_number is null"
            - "DisplayProject.${pj}.qa_passed_cabinet_count == 0 and mounted_cabinet_count == 0 and quarantined_cabinet_count == 0"
            - "DisplayProject.${pj}.contract_amount_cents == 215040   # round_half_up(0.1024 * 1000000 * 1.05) = 107520, x 2 cabinets"
            - "DisplayProject.${pj}.required_data_mbps == 15   # ceil(2 x 4096 x 10 x 3 x 60 / 1000000) = ceil(14.7456)"
            - "DisplayProject.${pj}.effective_capacity_mbps == 1000 and data_load_pct == 1.50"

      - name: display_model_geometry_inconsistent_modules_per_cabinet_rejected
        claim_type: type_constraints
        grounds:
          - entities.DisplayModel.fields.modules_per_cabinet
          - calculations.model_geometry_derivation
          - validations.priority_3_ERR_VALIDATION_FAILED
        distinguishing_aspect: |
          Geometry is validated, never repaired: modules_per_cabinet must equal
          the exact product of the two integer divisions. A 640x320 cabinet of
          320x160 modules is 4, so 3 is a 400 — the server must not helpfully
          overwrite the caller's 3 with its own 4.
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
          trigger:
            - call: "POST /display-models"
              payload: { name: "FP25-BAD", pixel_pitch_mm: 2.5, rated_brightness_nits: 5000, environmental_rating: "IP65_FRONT_IP54_REAR", module_width_mm: 320, module_height_mm: 160, module_pixel_cols: 128, module_pixel_rows: 64, cabinet_width_mm: 640, cabinet_height_mm: 320, modules_per_cabinet: 3, cabinet_weight_kg: 20.5, price_per_sqm_cents: 1234567, dead_pixel_ppm_limit: 122.07, module_dead_pixel_max: 3, module_cluster_max: 1, reference_color_x: 0.3128, reference_color_y: 0.3290, burn_in_hours_required: 48, max_drive_pct: 90 }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { err: $.data.error_id }
            - call: "POST /display-models"
              payload: { name: "FP25-BAD2", pixel_pitch_mm: 2.5, rated_brightness_nits: 5000, environmental_rating: "IP65_FRONT_IP54_REAR", module_width_mm: 300, module_height_mm: 160, module_pixel_cols: 128, module_pixel_rows: 64, cabinet_width_mm: 640, cabinet_height_mm: 320, modules_per_cabinet: 4, cabinet_weight_kg: 20.5, price_per_sqm_cents: 1234567, dead_pixel_ppm_limit: 122.07, module_dead_pixel_max: 3, module_cluster_max: 1, reference_color_x: 0.3128, reference_color_y: 0.3290, burn_in_hours_required: 48, max_drive_pct: 90 }
              as: PlantAdmin
              as_user_id: "adm-1"
          assert:
            - "trigger call 1 -> 400 with ${err} == 'ERR_VALIDATION_FAILED'   # 3 != (640/320) * (320/160) = 4"
            - "trigger call 2 -> 400 ERR_VALIDATION_FAILED   # 640 / 300 is not an exact division"
            - "GET /display-models returns total_count == 0"

      - name: project_invalid_color_depth_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.DisplayProject.fields.color_depth_bits
          - entities.DisplayProject.fields.redundancy_mode
          - validations.priority_3_ERR_VALIDATION_FAILED
        distinguishing_aspect: |
          color_depth_bits is an enumerated integer (8 | 10 | 12), not a free
          range, and redundancy_mode is a closed enum. 9 bits sits inside a
          naive 8..12 range check but is not a member, and it would silently
          change required_data_mbps if accepted.
        test_recipe:
          setup:
            - "One FP10-IN DisplayModel exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /display-models"
              payload: { name: "FP10-IN", pixel_pitch_mm: 10.0, rated_brightness_nits: 5000, environmental_rating: "IP43_INDOOR", module_width_mm: 320, module_height_mm: 320, module_pixel_cols: 32, module_pixel_rows: 32, cabinet_width_mm: 320, cabinet_height_mm: 320, modules_per_cabinet: 1, cabinet_weight_kg: 10.24, price_per_sqm_cents: 1000000, dead_pixel_ppm_limit: 976.56, module_dead_pixel_max: 3, module_cluster_max: 1, reference_color_x: 0.3128, reference_color_y: 0.3290, burn_in_hours_required: 24, max_drive_pct: 90 }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { dm: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { customer_name: "Nine Bit Wall", install_environment: "RETAIL", site_region_code: "NA-W", display_model_id: "${dm}", cabinet_grid_cols: 1, cabinet_grid_rows: 1, min_viewing_distance_m: 10.0, target_brightness_nits: 5000, redundancy_mode: "NONE", output_port_count: 1, port_bandwidth_mbps: 1000, color_depth_bits: 9, refresh_rate_hz: 60, player_count: 1 }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { err: $.data.error_id }
            - call: "POST /projects"
              payload: { customer_name: "Bad Redundancy", install_environment: "RETAIL", site_region_code: "NA-W", display_model_id: "${dm}", cabinet_grid_cols: 1, cabinet_grid_rows: 1, min_viewing_distance_m: 10.0, target_brightness_nits: 5000, redundancy_mode: "TRIPLE_LINK", output_port_count: 1, port_bandwidth_mbps: 1000, color_depth_bits: 10, refresh_rate_hz: 60, player_count: 1 }
              as: DesignEngineer
              as_user_id: "eng-1"
            - call: "POST /projects"
              payload: { customer_name: "Grid Too Wide", install_environment: "RETAIL", site_region_code: "NA-W", display_model_id: "${dm}", cabinet_grid_cols: 41, cabinet_grid_rows: 1, min_viewing_distance_m: 10.0, target_brightness_nits: 5000, redundancy_mode: "NONE", output_port_count: 1, port_bandwidth_mbps: 1000, color_depth_bits: 10, refresh_rate_hz: 60, player_count: 1 }
              as: DesignEngineer
              as_user_id: "eng-1"
          assert:
            - "trigger call 1 -> 400 with ${err} == 'ERR_VALIDATION_FAILED'   # 9 is not in {8, 10, 12}"
            - "trigger call 2 -> 400 ERR_VALIDATION_FAILED   # unknown redundancy_mode member"
            - "trigger call 3 -> 400 ERR_VALIDATION_FAILED   # cabinet_grid_cols above the declared 1..40 range"
            - "GET /projects returns total_count == 0"

      - name: project_create_unknown_display_model_returns_reference_not_found
        claim_type: parent_relationships
        grounds:
          - entities.DisplayProject.fields.display_model_id
          - validations.priority_4_ERR_REFERENCE_NOT_FOUND
        distinguishing_aspect: |
          The flat topology means the model is pinned by FK, not by URL nesting,
          so the FK must still be resolved before any geometry is derived — a
          missing model cannot produce a project with null computed fields.
        test_recipe:
          setup:
            - "Empty database apart from the logical clock; no DisplayModel exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
          trigger:
            - call: "POST /projects"
              payload: { customer_name: "Orphan Project", install_environment: "RETAIL", site_region_code: "NA-W", display_model_id: "00000000-0000-0000-0000-000000000404", cabinet_grid_cols: 1, cabinet_grid_rows: 1, min_viewing_distance_m: 10.0, target_brightness_nits: 5000, redundancy_mode: "NONE", output_port_count: 1, port_bandwidth_mbps: 1000, color_depth_bits: 10, refresh_rate_hz: 60, player_count: 1 }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { err: $.data.error_id }
          assert:
            - "trigger -> 404 with ${err} == 'ERR_REFERENCE_NOT_FOUND'"
            - "GET /projects returns total_count == 0"

      - name: cabinet_create_unknown_project_returns_project_not_found
        claim_type: parent_relationships
        grounds:
          - entities.Cabinet.fields.project_id
          - validations.priority_5_ERR_PROJECT_NOT_FOUND
        distinguishing_aspect: |
          DisplayProject owns a dedicated 404 code, distinct from the catalogue's
          ERR_REFERENCE_NOT_FOUND. A bad project_id on POST /cabinets must
          surface ERR_PROJECT_NOT_FOUND so the caller can tell a missing project
          from a missing model.
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
          trigger:
            - call: "POST /cabinets"
              payload: { project_id: "00000000-0000-0000-0000-000000000404", grid_row: 1, grid_col: 1 }
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { err: $.data.error_id }
          assert:
            - "trigger -> 404 with ${err} == 'ERR_PROJECT_NOT_FOUND'"
            - "GET /cabinets returns total_count == 0"

      - name: module_listing_filters_by_state_and_cabinet_fk
        claim_type: listing
        grounds:
          - endpoints.GET_modules
          - entities.Module.fields.cabinet_id
          - complexity_profile.entity_topology
        distinguishing_aspect: |
          Flat topology puts FK reverse-reachability on the filtered list rather
          than a nested route: GET /modules?cabinet_id=... is the only way to
          enumerate a cabinet's modules, and it must compose with module_state so
          an INSTALLED-only query never returns the spare sitting at CALIBRATED.
        test_recipe:
          setup:
            - "An FP16-STD project (1x1) is engineering APPROVED with cabinet ${cab} holding both modules INSTALLED, and a third CALIBRATED module ${spare} left on the shelf."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /display-models"
              payload: { name: "FP16-STD", pixel_pitch_mm: 5.0, rated_brightness_nits: 5000, environmental_rating: "IP65_FULL", module_width_mm: 320, module_height_mm: 160, module_pixel_cols: 64, module_pixel_rows: 32, cabinet_width_mm: 320, cabinet_height_mm: 320, modules_per_cabinet: 2, cabinet_weight_kg: 15.36, price_per_sqm_cents: 1000000, dead_pixel_ppm_limit: 500.00, module_dead_pixel_max: 3, module_cluster_max: 1, reference_color_x: 0.3128, reference_color_y: 0.3290, burn_in_hours_required: 24, max_drive_pct: 90 }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { dm: $.data.id }
            - call: "POST /projects"
              payload: { customer_name: "Filter Wall", install_environment: "RETAIL", site_region_code: "NA-W", display_model_id: "${dm}", cabinet_grid_cols: 1, cabinet_grid_rows: 1, min_viewing_distance_m: 5.0, target_brightness_nits: 5000, redundancy_mode: "NONE", output_port_count: 1, port_bandwidth_mbps: 1000, color_depth_bits: 10, refresh_rate_hz: 60, player_count: 1 }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { pj: $.data.id }
            - call: "POST /drawing-revisions"
              payload: { project_id: "${pj}", structural_load_kg_per_sqm: 150.00, wind_load_kph: 100, mounting_type: "WALL", service_access_side: "FRONT" }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { rev: $.data.id }
            - call: "POST /drawing-revisions/${rev}/review"
              payload: { decision: "APPROVE" }
              as: StructuralReviewer
              as_user_id: "rev-1"
            - call: "POST /cabinets"
              payload: { project_id: "${pj}", grid_row: 1, grid_col: 1 }
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { cab: $.data.id }
            - call: "POST /modules"
              payload: { display_model_id: "${dm}", serial_no: "M-A" }
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { ma: $.data.id }
            - call: "POST /modules/${ma}/pixel-test"
              payload: { dead_pixel_count: 1, max_cluster_size: 1 }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "POST /modules/${ma}/calibrate"
              payload: { measured_brightness_nits: 4900, measured_color_x: 0.3130, measured_color_y: 0.3292 }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "POST /modules"
              payload: { display_model_id: "${dm}", serial_no: "M-B" }
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { mb: $.data.id }
            - call: "POST /modules/${mb}/pixel-test"
              payload: { dead_pixel_count: 1, max_cluster_size: 1 }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "POST /modules/${mb}/calibrate"
              payload: { measured_brightness_nits: 4950, measured_color_x: 0.3128, measured_color_y: 0.3291 }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "POST /modules"
              payload: { display_model_id: "${dm}", serial_no: "S-1" }
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { spare: $.data.id }
            - call: "POST /modules/${spare}/pixel-test"
              payload: { dead_pixel_count: 1, max_cluster_size: 1 }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "POST /modules/${spare}/calibrate"
              payload: { measured_brightness_nits: 4850, measured_color_x: 0.3124, measured_color_y: 0.3287 }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "GET /cabinets/${cab}"
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { cabv1: $.data.version }
            - call: "POST /cabinets/${cab}/modules"
              payload: { module_id: "${ma}", slot_index: 1, expected_cabinet_version: "${cabv1}" }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "GET /cabinets/${cab}"
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { cabv2: $.data.version }
            - call: "POST /cabinets/${cab}/modules"
              payload: { module_id: "${mb}", slot_index: 2, expected_cabinet_version: "${cabv2}" }
              as: ProductionOperator
              as_user_id: "op-1"
          trigger:
            - call: "GET /modules?cabinet_id=${cab}"
              as: QAEngineer
              as_user_id: "qa-1"
            - call: "GET /modules?module_state=CALIBRATED"
              as: QAEngineer
              as_user_id: "qa-1"
            - call: "GET /modules?cabinet_id=${cab}&module_state=CALIBRATED"
              as: QAEngineer
              as_user_id: "qa-1"
          assert:
            - "trigger call 1 -> 200 with total_count == 2 and the rows are ${ma} and ${mb}"
            - "trigger call 2 -> 200 with total_count == 1 and the single row is ${spare}"
            - "trigger call 3 -> 200 with total_count == 0 and has_more == false   # filters intersect, they do not union"
            - "GET /modules (unfiltered) returns total_count == 3"

  - section: state_machines
    instances:
      - name: cabinet_created_starts_in_planned_with_empty_slot_map
        claim_type: initial_state
        grounds:
          - state_machines.Cabinet.initial_state
          - entities.Cabinet.fields.occupied_slot_indexes
        distinguishing_aspect: |
          A cabinet is planned before it is built: the row exists at PLANNED with
          an empty (not null) slot map and no uniformity scores, so the first
          install is what moves it to IN_ASSEMBLY. Creating a cabinet does not
          require engineering approval — only installing into it does.
        test_recipe:
          setup:
            - "An FP10-IN project (1x1) exists in engineering_state DRAFT; no drawing revision has been submitted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /display-models"
              payload: { name: "FP10-IN", pixel_pitch_mm: 10.0, rated_brightness_nits: 5000, environmental_rating: "IP43_INDOOR", module_width_mm: 320, module_height_mm: 320, module_pixel_cols: 32, module_pixel_rows: 32, cabinet_width_mm: 320, cabinet_height_mm: 320, modules_per_cabinet: 1, cabinet_weight_kg: 10.24, price_per_sqm_cents: 1000000, dead_pixel_ppm_limit: 976.56, module_dead_pixel_max: 3, module_cluster_max: 1, reference_color_x: 0.3128, reference_color_y: 0.3290, burn_in_hours_required: 24, max_drive_pct: 90 }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { dm: $.data.id }
            - call: "POST /projects"
              payload: { customer_name: "Planned Only", install_environment: "RETAIL", site_region_code: "NA-W", display_model_id: "${dm}", cabinet_grid_cols: 1, cabinet_grid_rows: 1, min_viewing_distance_m: 10.0, target_brightness_nits: 5000, redundancy_mode: "NONE", output_port_count: 1, port_bandwidth_mbps: 1000, color_depth_bits: 10, refresh_rate_hz: 60, player_count: 1 }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { pj: $.data.id }
          trigger:
            - call: "POST /cabinets"
              payload: { project_id: "${pj}", grid_row: 1, grid_col: 1 }
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { cab: $.data.id }
          assert:
            - "trigger -> 201"
            - "Cabinet.${cab}.cabinet_state == PLANNED"
            - "Cabinet.${cab}.installed_module_count == 0 and Cabinet.${cab}.occupied_slot_indexes == []"
            - "Cabinet.${cab}.as_built_uniformity_score is null and Cabinet.${cab}.baseline_uniformity_score is null"
            - "Cabinet.${cab}.baseline_module_ids == [] and Cabinet.${cab}.qa_approved_by_user_id is null"
            - "Cabinet.${cab}.version == 1"
            - "DisplayProject.${pj}.engineering_state == DRAFT and DisplayProject.${pj}.production_state == NOT_STARTED   # planning a cabinet moves neither dimension"

      - name: drawing_revision_created_starts_submitted_and_snapshots_required_load
        claim_type: initial_state
        grounds:
          - state_machines.DrawingRevision.initial_state
          - entities.DrawingRevision.fields.revision_number
          - entities.DrawingRevision.fields.required_load_kg_per_sqm
        distinguishing_aspect: |
          The revision opens at SUBMITTED with revision_number 1 and freezes the
          model's required_load_kg_per_sqm onto itself, so a later catalogue
          change cannot retroactively invalidate an approved drawing. The same
          call drives the project's engineering dimension DRAFT -> UNDER_REVIEW.
        test_recipe:
          setup:
            - "An FP25-OUT project (1x1 STADIUM) exists in engineering_state DRAFT. FP25-OUT.required_load_kg_per_sqm is 100.10 and STADIUM demands wind_load_kph >= 160."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /display-models"
              payload: { name: "FP25-OUT", pixel_pitch_mm: 2.5, rated_brightness_nits: 5000, environmental_rating: "IP65_FRONT_IP54_REAR", module_width_mm: 320, module_height_mm: 160, module_pixel_cols: 128, module_pixel_rows: 64, cabinet_width_mm: 640, cabinet_height_mm: 320, modules_per_cabinet: 4, cabinet_weight_kg: 20.5, price_per_sqm_cents: 1234567, dead_pixel_ppm_limit: 122.07, module_dead_pixel_max: 3, module_cluster_max: 1, reference_color_x: 0.3128, reference_color_y: 0.3290, burn_in_hours_required: 48, max_drive_pct: 90 }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { dm: $.data.id }
            - call: "POST /projects"
              payload: { customer_name: "Stadium End Zone", install_environment: "STADIUM", site_region_code: "NA-W", display_model_id: "${dm}", cabinet_grid_cols: 1, cabinet_grid_rows: 1, min_viewing_distance_m: 2.5, target_brightness_nits: 5000, redundancy_mode: "NONE", output_port_count: 1, port_bandwidth_mbps: 1000, color_depth_bits: 10, refresh_rate_hz: 60, player_count: 1 }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { pj: $.data.id }
          trigger:
            - call: "POST /drawing-revisions"
              payload: { project_id: "${pj}", structural_load_kg_per_sqm: 120.00, wind_load_kph: 160, mounting_type: "GANTRY", service_access_side: "REAR" }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { rev: $.data.id }
          assert:
            - "trigger -> 201"
            - "DrawingRevision.${rev}.revision_state == SUBMITTED"
            - "DrawingRevision.${rev}.revision_number == 1"
            - "DrawingRevision.${rev}.required_load_kg_per_sqm == 100.10   # snapshot of the model, not the submitted 120.00"
            - "DrawingRevision.${rev}.submitted_by_user_id == 'eng-1'"
            - "DrawingRevision.${rev}.reviewed_by_user_id is null and DrawingRevision.${rev}.rejection_reason is null"
            - "DisplayProject.${pj}.engineering_state == UNDER_REVIEW"
            - "DisplayProject.${pj}.production_state == NOT_STARTED   # the other dimension does not move"
            - "DisplayProject.${pj}.approved_revision_number is null"

      - name: pixel_test_moves_module_manufactured_to_pixel_tested
        claim_type: valid_transition
        grounds:
          - state_machines.Module.MANUFACTURED_to_PIXEL_TESTED
          - endpoints.POST_modules_module_id_pixel_test
        distinguishing_aspect: |
          A pass at exactly the declared maxima (3 dead pixels, cluster 1) is a
          pass, not a failure: the comparison is <=, so rework_cycles must stay 0
          and the measurements must be stored on the way to PIXEL_TESTED.
        test_recipe:
          setup:
            - "One FP10-IN DisplayModel (module_dead_pixel_max 3, module_cluster_max 1) and one MANUFACTURED module ${m1}."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /display-models"
              payload: { name: "FP10-IN", pixel_pitch_mm: 10.0, rated_brightness_nits: 5000, environmental_rating: "IP43_INDOOR", module_width_mm: 320, module_height_mm: 320, module_pixel_cols: 32, module_pixel_rows: 32, cabinet_width_mm: 320, cabinet_height_mm: 320, modules_per_cabinet: 1, cabinet_weight_kg: 10.24, price_per_sqm_cents: 1000000, dead_pixel_ppm_limit: 976.56, module_dead_pixel_max: 3, module_cluster_max: 1, reference_color_x: 0.3128, reference_color_y: 0.3290, burn_in_hours_required: 24, max_drive_pct: 90 }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { dm: $.data.id }
            - call: "POST /modules"
              payload: { display_model_id: "${dm}", serial_no: "M-1" }
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { m1: $.data.id }
          trigger:
            - call: "POST /modules/${m1}/pixel-test"
              payload: { dead_pixel_count: 3, max_cluster_size: 1 }
              as: ProductionOperator
              as_user_id: "op-1"
          assert:
            - "trigger -> 200"
            - "Module.${m1}.module_state == PIXEL_TESTED   # 3 <= 3 and 1 <= 1 both pass on the boundary"
            - "Module.${m1}.dead_pixel_count == 3 and Module.${m1}.max_cluster_size == 1"
            - "Module.${m1}.rework_cycles == 0"
            - "Module.${m1}.color_bin is null   # binning happens at calibrate, not at pixel-test"
            - "Module.${m1}.version == 2"

      - name: revision_reject_then_resubmit_returns_project_to_under_review
        claim_type: valid_transition
        grounds:
          - state_machines.DisplayProject.engineering_state.UNDER_REVIEW_to_REJECTED
          - state_machines.DisplayProject.engineering_state.REJECTED_to_UNDER_REVIEW
          - entities.DrawingRevision.fields.rejection_reason
        distinguishing_aspect: |
          The engineering dimension is cyclic: REJECTED is not terminal for the
          project (only APPROVED is), and the second revision must number 2 while
          the first stays REJECTED with its reason. approved_revision_number is
          only written by an APPROVE, and it records the number of the revision
          that was actually approved (2), never 1.
        test_recipe:
          setup:
            - "An FP10-IN project (1x1 RETAIL) has one SUBMITTED revision ${rev1} by eng-1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /display-models"
              payload: { name: "FP10-IN", pixel_pitch_mm: 10.0, rated_brightness_nits: 5000, environmental_rating: "IP43_INDOOR", module_width_mm: 320, module_height_mm: 320, module_pixel_cols: 32, module_pixel_rows: 32, cabinet_width_mm: 320, cabinet_height_mm: 320, modules_per_cabinet: 1, cabinet_weight_kg: 10.24, price_per_sqm_cents: 1000000, dead_pixel_ppm_limit: 976.56, module_dead_pixel_max: 3, module_cluster_max: 1, reference_color_x: 0.3128, reference_color_y: 0.3290, burn_in_hours_required: 24, max_drive_pct: 90 }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { dm: $.data.id }
            - call: "POST /projects"
              payload: { customer_name: "Cycle Wall", install_environment: "RETAIL", site_region_code: "NA-W", display_model_id: "${dm}", cabinet_grid_cols: 1, cabinet_grid_rows: 1, min_viewing_distance_m: 10.0, target_brightness_nits: 5000, redundancy_mode: "NONE", output_port_count: 1, port_bandwidth_mbps: 1000, color_depth_bits: 10, refresh_rate_hz: 60, player_count: 1 }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { pj: $.data.id }
            - call: "POST /drawing-revisions"
              payload: { project_id: "${pj}", structural_load_kg_per_sqm: 100.00, wind_load_kph: 100, mounting_type: "WALL", service_access_side: "FRONT" }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { rev1: $.data.id }
          trigger:
            - call: "POST /drawing-revisions/${rev1}/review"
              payload: { decision: "REJECT", reason: "Anchor spacing does not clear the sprinkler main" }
              as: StructuralReviewer
              as_user_id: "rev-1"
            - call: "POST /drawing-revisions"
              payload: { project_id: "${pj}", structural_load_kg_per_sqm: 110.00, wind_load_kph: 110, mounting_type: "WALL", service_access_side: "FRONT" }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { rev2: $.data.id }
            - call: "POST /drawing-revisions/${rev2}/review"
              payload: { decision: "APPROVE" }
              as: StructuralReviewer
