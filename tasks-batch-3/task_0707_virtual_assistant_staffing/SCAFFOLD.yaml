# =============================================================================
# task_0707_virtual_assistant_staffing — SCAFFOLD.yaml (§1.0–§1.7)
# Virtual Assistant & Outsourced-Admin Staffing platform
# Difficulty band: EXPERT (§0.4)
# Topology: FLAT (peer collections under one prefix, FK references in bodies)
# =============================================================================

scenario: |
  Virtual Assistant & Outsourced-Admin Staffing: client intake & task scope, VA matching & onboarding, hour-bank/retainer & rollover, task queue & SLA, time tracking & approval, escalation/replacement, add-on (specialized skill), billing & utilization

domain_name: va-staffing
api_prefix: /va-staffing

# =============================================================================
# Complexity Profile (§0.3) — EXPERT band (§0.4)
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation          # finite hour-bank competed for by tasks/time entries
  secondary_archetype: workflow_orchestration  # task queue + SLA + escalation/replacement pipelines
  complexity_layers:
    - dual_variant_calculation     # provisional vs final utilization billing; cap-binding vs cap-slack rollover
    - cascading_side_effects       # replacement cascade, client-close cascade
    - rate_threshold_triggers      # SLA breach + overage-rate breakpoints
    - scheduled_deferred_actions   # logical clock drives SLA due/breach + cycle rollover
    - optimistic_concurrency       # OCC on RetainerCycle.version for hour-bank debit/close race

  entity_topology: flat            # peer collections under /va-staffing; FK references carried in bodies, not URL nesting
  state_machine_shape: branching   # Task/Engagement fork-join + revert; Escalation branches; RetainerCycle cycles OPEN->CLOSED->new OPEN
  relationship_patterns:
    - one_to_many                  # Client -> Engagement, RetainerCycle, Task, Invoice
    - many_to_many                 # Task required-skill set <-> SkillTag; VA skill set <-> SkillTag
    - cross_aggregate              # Task references VA via Engagement; AddOn references SkillTag
    - self_referential             # Engagement.superseded_by_engagement_id points to another Engagement

  role_model: peer_roles           # Client owns intake/approval; StaffingManager owns matching/escalation; VA owns task work + time logging
  consistency_model: immediate     # all mutations atomic within a single request; OCC resolves the one true race

# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table  (13 entities)
# =============================================================================
entities:
  # ---- Configuration entities -------------------------------------------------
  - name: SkillTag
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID (identity only; never a business-decision input)" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC, three fractional digits" }
      - { name: code, type: string, source: input, description: "Stable skill code, e.g. BOOKKEEPING, CRM_ADMIN", constraints: "unique across SkillTag; uppercase snake" }
      - { name: name, type: string, source: input, description: "Human-readable skill name" }
      - { name: is_specialized, type: boolean, source: input, description: "If true, a Task requiring this tag needs a matching ACTIVE AddOn before assignment", default: false }

  - name: SlaPolicy
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID (identity only; never a business-decision input)" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC, three fractional digits" }
      - { name: tier, type: enum, source: input, description: "Priority tier this policy applies to", constraints: "one of STANDARD | PRIORITY | URGENT; unique across SlaPolicy" }
      - { name: response_minutes, type: integer, source: input, description: "Minutes from task ASSIGNED until first action is due", constraints: ">= 1" }
      - { name: resolution_hours, type: integer, source: input, description: "Hours from task ASSIGNED until task must reach DONE", constraints: ">= 1" }
      - { name: breach_penalty_pct, type: number, source: input, description: "Fraction of a breached task's billed charge credited back to the client", constraints: "0.0 <= x <= 1.0" }

  # ---- Core aggregate root ----------------------------------------------------
  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: company_name, type: string, source: input, description: "Client company name" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email", constraints: "unique across Client" }
      - { name: status, type: enum, source: system, description: "Intake lifecycle", constraints: "one of PENDING | SCOPED | ACTIVE | SUSPENDED | CLOSED" }
      - { name: scope_summary, type: string, source: input, description: "Free-text scope of admin work requested", default: null }
      - { name: required_skill_tag_ids, type: array, source: input, description: "SkillTag ids this client's work needs; each element references SkillTag.id, validated on scope", default: "[]" }
      - { name: monthly_retainer_hours, type: number, source: input, description: "Contracted hour-bank size per cycle, in hours", constraints: ">= 1.0; set at scope time" }
      - { name: base_rate_cents, type: integer, source: input, description: "Per-hour cents charged for billed hours within the bank in a cycle", constraints: ">= 0" }
      - { name: overage_rate_cents, type: integer, source: input, description: "Per-hour cents charged for billed hours beyond the bank in a cycle", constraints: ">= 0" }
      - { name: rollover_cap_hours, type: number, source: input, description: "Max unused hours that may roll into the next cycle", default: 0 }
      - { name: active_engagement_id, type: string, source: computed, description: "Back-pointer to the single Engagement currently ACTIVE (Engagement.id), else null; not a discovery FK" }
      - { name: open_task_count, type: integer, source: computed, description: "Count of this client's Tasks not in a terminal state (DONE, CANCELLED)" }

  # ---- VA pool ----------------------------------------------------------------
  - name: VirtualAssistant
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "VA full name" }
      - { name: email, type: string, source: input, description: "VA email", constraints: "unique across VirtualAssistant" }
      - { name: status, type: enum, source: system, description: "Availability lifecycle", constraints: "one of AVAILABLE | ENGAGED | BENCHED" }
      - { name: skill_tag_ids, type: array, source: input, description: "SkillTag ids this VA holds; each element references SkillTag.id, validated on create", default: "[]" }
      - { name: weekly_capacity_hours, type: number, source: input, description: "Hours/week this VA can take on", constraints: ">= 1.0" }
      - { name: rating, type: number, source: input, description: "Quality rating 0.0–5.0 used in match ranking", constraints: "0.0 <= x <= 5.0", default: 3.0 }
      - { name: active_engagement_count, type: integer, source: computed, description: "Number of this VA's Engagements currently ACTIVE" }

  # ---- Engagement: matching + onboarding lifecycle ----------------------------
  - name: Engagement
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; the engaged client" }
      - { name: va_id, type: string, source: input, description: "FK -> VirtualAssistant.id; the matched VA (auto-selected if omitted)" }
      - { name: status, type: enum, source: system, description: "Onboarding/active lifecycle", constraints: "one of PROPOSED | ONBOARDING | ACTIVE | ENDED | REJECTED" }
      - { name: match_score, type: number, source: computed, description: "Computed VA-to-Client fit score at proposal time (calc va_match_score)" }
      - { name: superseded_by_engagement_id, type: string, source: system, description: "Back-pointer to the replacement Engagement.id when superseded; null otherwise; not a discovery FK", default: null }
      - { name: onboarding_checklist_done, type: boolean, source: input, description: "Whether onboarding checklist was completed before activation", default: false }

  # ---- RetainerCycle: hour-bank / rollover ------------------------------------
  - name: RetainerCycle
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> Client.id; the owning client" }
      - { name: sequence_no, type: integer, source: system, description: "1-based monotonically increasing cycle index per client" }
      - { name: status, type: enum, source: system, description: "Cycle lifecycle", constraints: "one of OPEN | CLOSED" }
      - { name: granted_hours, type: number, source: system, description: "Client.monthly_retainer_hours captured when this cycle opened" }
      - { name: rolled_in_hours, type: number, source: system, description: "Unused hours carried in from the prior cycle (post-cap)", default: 0 }
      - { name: consumed_hours, type: number, source: computed, description: "Sum of APPROVED TimeEntry.billable_hours charged to this cycle" }
      - { name: available_hours, type: number, source: computed, description: "max(0, granted_hours + rolled_in_hours - consumed_hours)" }
      - { name: overage_hours, type: number, source: computed, description: "max(0, consumed_hours - (granted_hours + rolled_in_hours))" }
      - { name: opened_at_iso, type: datetime, source: system, description: "Logical-clock time when this cycle opened" }
      - { name: closed_at_iso, type: datetime, source: system, description: "Logical-clock time when this cycle closed; null while OPEN", default: null }

  # ---- Task queue + SLA -------------------------------------------------------
  - name: Task
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; the owning client" }
      - { name: engagement_id, type: string, source: system, description: "FK -> Engagement.id; the engagement whose VA owns this task; null until assigned", default: null }
      - { name: title, type: string, source: input, description: "Task title" }
      - { name: priority, type: enum, source: input, description: "SLA tier selector", constraints: "one of STANDARD | PRIORITY | URGENT", default: STANDARD }
      - { name: required_skill_tag_id, type: string, source: input, description: "FK -> SkillTag.id; the skill the task requires", default: null }
      - { name: status, type: enum, source: system, description: "Queue/work lifecycle", constraints: "one of QUEUED | ASSIGNED | IN_PROGRESS | BLOCKED | DONE | CANCELLED" }
      - { name: estimated_hours, type: number, source: input, description: "Client estimate of effort, in hours", constraints: ">= 0", default: 0 }
      - { name: assigned_at_iso, type: datetime, source: system, description: "Logical-clock time the task entered ASSIGNED; null until assigned", default: null }
      - { name: first_action_at_iso, type: datetime, source: system, description: "Logical-clock time the task first left ASSIGNED (start or block); null until then", default: null }
      - { name: completed_at_iso, type: datetime, source: system, description: "Logical-clock time the task reached DONE; null otherwise", default: null }
      - { name: response_due_iso, type: datetime, source: computed, description: "assigned_at_iso + SlaPolicy.response_minutes; null until assigned" }
      - { name: resolution_due_iso, type: datetime, source: computed, description: "assigned_at_iso + SlaPolicy.resolution_hours; null until assigned" }
      - { name: sla_state, type: enum, source: computed, description: "SLA standing", constraints: "one of ON_TRACK | RESPONSE_BREACHED | RESOLUTION_BREACHED" }
      - { name: billed_hours, type: number, source: computed, description: "Sum of APPROVED TimeEntry.billable_hours on this task" }
      - { name: blocked_reason, type: string, source: input, description: "Reason captured when task moves to BLOCKED", default: null }

  # ---- TimeEntry: time tracking + approval ------------------------------------
  - name: TimeEntry
    parent: null
    common_fields: true
    fields:
      - { name: task_id, type: string, source: input, description: "FK -> Task.id; the worked task" }
      - { name: cycle_id, type: string, source: system, description: "FK -> RetainerCycle.id; the OPEN cycle pinned when the entry is created/approved" }
      - { name: va_id, type: string, source: system, description: "FK -> VirtualAssistant.id; the VA who logged it (the task's engagement VA)" }
      - { name: status, type: enum, source: system, description: "Approval lifecycle", constraints: "one of LOGGED | APPROVED | REJECTED" }
      - { name: raw_minutes, type: integer, source: input, description: "Wall-time minutes logged for this entry", constraints: ">= 1" }
      - { name: billable_hours, type: number, source: computed, description: "raw_minutes rounded UP to the nearest 0.25 h (15-min increment), in hours" }
      - { name: note, type: string, source: input, description: "Work note", default: null }
      - { name: approved_at_iso, type: datetime, source: system, description: "Logical-clock time of approval; null unless APPROVED", default: null }

  # ---- AddOn: specialized-skill add-on ----------------------------------------
  - name: AddOn
    parent: null
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: input, description: "FK -> Engagement.id; the engagement this add-on augments" }
      - { name: skill_tag_id, type: string, source: input, description: "FK -> SkillTag.id; the specialized skill being added (must have is_specialized=true)" }
      - { name: status, type: enum, source: system, description: "Add-on lifecycle", constraints: "one of REQUESTED | ACTIVE | REVOKED" }
      - { name: surcharge_rate_cents, type: integer, source: input, description: "Per-hour cents surcharge for billed hours on tasks requiring this specialized skill", constraints: ">= 0" }

  # ---- Escalation: escalation / replacement -----------------------------------
  - name: Escalation
    parent: null
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: system, description: "FK -> Engagement.id; the engagement under escalation" }
      - { name: client_id, type: string, source: system, description: "FK -> Client.id; the owning client (denormalized for scoping & listing)" }
      - { name: reason, type: enum, source: input, description: "Escalation cause", constraints: "one of SLA_BREACH | QUALITY | AVAILABILITY | OTHER" }
      - { name: status, type: enum, source: system, description: "Escalation lifecycle", constraints: "one of OPEN | RESOLVED | REPLACED" }
      - { name: replacement_engagement_id, type: string, source: system, description: "Back-pointer to the new Engagement.id minted on replacement; null otherwise; not a discovery FK", default: null }

  # ---- Invoice: billing + utilization -----------------------------------------
  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> Client.id; the billed client" }
      - { name: cycle_id, type: string, source: input, description: "FK -> RetainerCycle.id; the cycle this invoice bills" }
      - { name: variant, type: enum, source: input, description: "Which billing algorithm produced this invoice", constraints: "one of PROVISIONAL | FINAL" }
      - { name: status, type: enum, source: system, description: "Invoice lifecycle", constraints: "one of ISSUED | VOID" }
      - { name: base_charge_cents, type: integer, source: computed, description: "Charge for billed hours within the bank (calc invoice_total)" }
      - { name: overage_charge_cents, type: integer, source: computed, description: "Charge for billed hours beyond the bank at overage_rate_cents" }
      - { name: surcharge_cents, type: integer, source: computed, description: "Specialized-skill add-on surcharge total" }
      - { name: sla_credit_cents, type: integer, source: computed, description: "Credits for SLA-breached tasks in the cycle (subtracted from total)" }
      - { name: total_cents, type: integer, source: computed, description: "max(0, base + overage + surcharge - sla_credit)" }
      - { name: utilization_pct, type: number, source: computed, description: "billed-hour numerator / (granted_hours + rolled_in_hours), as a fraction (calc invoice_total)" }

  # ---- Test-driving logical clock --------------------------------------------
  - name: Clock
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Singleton id (identity only)" }
      - { name: created_at, type: datetime, source: system, description: "ISO8601 UTC, three fractional digits" }
      - { name: current_utc, type: datetime, source: system, description: "Current logical clock value; startup default 2026-03-01T00:00:00Z" }

# =============================================================================
# §1.2 State Machine Table  (6 state machines)
# =============================================================================
state_machines:
  # --- 1. Client intake lifecycle (linear w/ suspend revert + close cascade) --
  - entity: Client
    initial_state: PENDING
    terminal_states: [CLOSED]
    transitions:
      - from: PENDING
        to: SCOPED
        trigger: "PATCH /va-staffing/clients/{client_id}/scope"
        actor: Client
        preconditions:
          - "monthly_retainer_hours, base_rate_cents, overage_rate_cents provided"
          - "every required_skill_tag_ids element resolves to an existing SkillTag"
        side_effects:
          - "scope_summary, required_skill_tag_ids, rates, rollover_cap_hours persisted"
      - from: SCOPED
        to: ACTIVE
        trigger: "system: an Engagement for this client transitions ONBOARDING->ACTIVE"
        actor: system
        preconditions:
          - "client has an Engagement transitioning to ACTIVE"
        side_effects:
          - "opens RetainerCycle sequence_no=1 (granted_hours=monthly_retainer_hours, rolled_in_hours=0, status=OPEN, opened_at_iso=clock)"
          - "sets Client.active_engagement_id to the activating engagement"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /va-staffing/clients/{client_id}/suspend"
        actor: StaffingManager
        preconditions:
          - "client is ACTIVE"
        side_effects:
          - "all QUEUED and ASSIGNED Tasks for this client -> BLOCKED with blocked_reason='CLIENT_SUSPENDED'"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /va-staffing/clients/{client_id}/resume"
        actor: StaffingManager
        preconditions:
          - "client is SUSPENDED"
        side_effects:
          - "Tasks BLOCKED with blocked_reason='CLIENT_SUSPENDED' revert: those that had been assigned -> ASSIGNED, never-assigned -> QUEUED; blocked_reason cleared"
      - from: [SCOPED, ACTIVE, SUSPENDED]
        to: CLOSED
        trigger: "POST /va-staffing/clients/{client_id}/close"
        actor: StaffingManager
        preconditions:
          - "no Task in IN_PROGRESS"
        side_effects:
          - "all non-terminal Tasks -> CANCELLED (cascade hop 1)"
          - "each cancelled Task's LOGGED TimeEntries -> REJECTED (cascade hop 2, triggered by the Task->CANCELLED transition)"
          - "the OPEN RetainerCycle (if any) -> CLOSED, closed_at_iso=clock; NO successor minted because client is CLOSED"
          - "ACTIVE Engagement (if any) -> ENDED; its VA active_engagement_count decremented; VA -> AVAILABLE if it reaches 0"

  # --- 2. Engagement matching/onboarding (branching + revert) -----------------
  - entity: Engagement
    initial_state: PROPOSED
    terminal_states: [ENDED, REJECTED]
    transitions:
      - from: PROPOSED
        to: ONBOARDING
        trigger: "POST /va-staffing/engagements/{engagement_id}/accept"
        actor: Client
        preconditions:
          - "engagement is PROPOSED"
          - "the VA status is AVAILABLE or ENGAGED (not BENCHED)"
        side_effects:
          - "VirtualAssistant.status -> ENGAGED"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /va-staffing/engagements/{engagement_id}/reject"
        actor: Client
        preconditions:
          - "engagement is PROPOSED"
        side_effects: []
      - from: ONBOARDING
        to: PROPOSED
        trigger: "POST /va-staffing/engagements/{engagement_id}/return-to-proposed"
        actor: StaffingManager
        preconditions:
          - "engagement is ONBOARDING"
          - "onboarding_checklist_done is false"
        side_effects:
          - "if no other ACTIVE engagement holds this VA, VirtualAssistant.status -> AVAILABLE"
        note: "revert edge — ONBOARDING cycles back to PROPOSED (non-linear shape)"
      - from: ONBOARDING
        to: ACTIVE
        trigger: "POST /va-staffing/engagements/{engagement_id}/activate"
        actor: StaffingManager
        preconditions:
          - "engagement is ONBOARDING"
          - "onboarding_checklist_done is true (provided on activate)"
          - "client status is SCOPED or ACTIVE"
        side_effects:
          - "Client.active_engagement_id = this engagement; VirtualAssistant.active_engagement_count += 1"
          - "if client was SCOPED, client -> ACTIVE which opens RetainerCycle #1 (cross-entity cascade)"
      - from: ACTIVE
        to: ENDED
        trigger: "POST /va-staffing/engagements/{engagement_id}/end, or system on Escalation REPLACED / Client close"
        actor: "StaffingManager or system"
        preconditions:
          - "engagement is ACTIVE"
        side_effects:
          - "VirtualAssistant.active_engagement_count -= 1; VA -> AVAILABLE if it reaches 0"
          - "Client.active_engagement_id cleared if it pointed here"
          - "non-terminal Tasks (QUEUED/ASSIGNED/IN_PROGRESS/BLOCKED) on this engagement that are not reassigned by a replacement -> QUEUED with engagement_id cleared and SLA timers reset"

  # --- 3. RetainerCycle hour-bank (cyclic OPEN->CLOSED->new OPEN) --------------
  - entity: RetainerCycle
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /va-staffing/cycles/{cycle_id}/close"
        actor: StaffingManager
        preconditions:
          - "cycle is OPEN"
          - "no LOGGED (un-approved) TimeEntry charges this cycle"
          - "expected_cycle_version matches RetainerCycle.version (OCC)"
        side_effects:
          - "status -> CLOSED, closed_at_iso=clock"
          - "increments RetainerCycle.version by 1"
          - "if Client is not CLOSED: opens a successor RetainerCycle (sequence_no+1, status=OPEN, granted_hours=Client.monthly_retainer_hours, rolled_in_hours = rollover carry, opened_at_iso=clock) — cyclic OPEN->CLOSED->OPEN edge (calc rollover_carry)"
        note: "cyclic edge — closing a cycle mints the next OPEN cycle of the same entity type (revision loop)"

  # --- 4. Task queue + SLA + work (branching, fork to BLOCKED, revert) --------
  - entity: Task
    initial_state: QUEUED
    terminal_states: [DONE, CANCELLED]
    transitions:
      - from: QUEUED
        to: ASSIGNED
        trigger: "POST /va-staffing/tasks/{task_id}/assign"
        actor: StaffingManager
        preconditions:
          - "client status is ACTIVE and Client.active_engagement_id is set"
          - "an SlaPolicy exists for the task's priority tier"
          - "if required_skill_tag_id is specialized, an ACTIVE AddOn for that skill exists on the active engagement"
        side_effects:
          - "engagement_id = Client.active_engagement_id"
          - "assigned_at_iso=clock; response_due_iso and resolution_due_iso computed (calc sla_due); sla_state=ON_TRACK"
      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "POST /va-staffing/tasks/{task_id}/start"
        actor: VA
        preconditions:
          - "task is ASSIGNED"
          - "the acting VA is the engagement's VA"
        side_effects:
          - "first_action_at_iso=clock if still null"
      - from: [ASSIGNED, IN_PROGRESS]
        to: BLOCKED
        trigger: "POST /va-staffing/tasks/{task_id}/block"
        actor: VA
        preconditions:
          - "task is ASSIGNED or IN_PROGRESS"
          - "the acting VA is the engagement's VA"
        side_effects:
          - "blocked_reason captured from request"
          - "first_action_at_iso=clock if still null"
      - from: BLOCKED
        to: IN_PROGRESS
        trigger: "POST /va-staffing/tasks/{task_id}/unblock"
        actor: VA
        preconditions:
          - "task is BLOCKED"
          - "client status is ACTIVE (not SUSPENDED)"
          - "the acting VA is the engagement's VA"
        side_effects:
          - "blocked_reason cleared"
        note: "revert edge back from BLOCKED into the work loop (non-linear shape)"
      - from: IN_PROGRESS
        to: DONE
        trigger: "POST /va-staffing/tasks/{task_id}/complete"
        actor: VA
        preconditions:
          - "task is IN_PROGRESS"
          - "at least one APPROVED TimeEntry exists on the task"
        side_effects:
          - "completed_at_iso=clock; sla_state latched (RESOLUTION_BREACHED if completed_at_iso > resolution_due_iso)"
          - "Client.open_task_count recomputed"
      - from: [QUEUED, ASSIGNED, IN_PROGRESS, BLOCKED]
        to: CANCELLED
        trigger: "POST /va-staffing/tasks/{task_id}/cancel, or system on client close"
        actor: "Client or StaffingManager or system"
        preconditions:
          - "task not already terminal"
        side_effects:
          - "LOGGED TimeEntries on the task -> REJECTED (they never charge a cycle)"
          - "Client.open_task_count recomputed"

  # --- 5. TimeEntry approval (branching approve/reject) -----------------------
  - entity: TimeEntry
    initial_state: LOGGED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: LOGGED
        to: APPROVED
        trigger: "POST /va-staffing/time-entries/{entry_id}/approve"
        actor: Client
        preconditions:
          - "entry is LOGGED"
          - "the task's client has an OPEN RetainerCycle"
          - "the acting Client owns the task"
        side_effects:
          - "approved_at_iso=clock; cycle_id pinned to the client's current OPEN RetainerCycle"
          - "RetainerCycle.consumed_hours, available_hours, overage_hours recomputed (calc cycle_balance)"
          - "increments RetainerCycle.version by 1"
          - "Task.billed_hours recomputed"
      - from: LOGGED
        to: REJECTED
        trigger: "POST /va-staffing/time-entries/{entry_id}/reject, or system on task cancel"
        actor: "Client or system"
        preconditions:
          - "entry is LOGGED"
        side_effects:
          - "entry never charges a cycle"

  # --- 6. Escalation -> replacement (branching with divergent side-effects) ---
  - entity: Escalation
    initial_state: OPEN
    terminal_states: [RESOLVED, REPLACED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /va-staffing/escalations/{escalation_id}/resolve"
        actor: StaffingManager
        preconditions:
          - "escalation is OPEN"
        side_effects:
          - "no engagement change; the original engagement keeps running"
      - from: OPEN
        to: REPLACED
        trigger: "POST /va-staffing/escalations/{escalation_id}/replace"
        actor: StaffingManager
        preconditions:
          - "escalation is OPEN"
          - "a replacement va_id is supplied and that VA status is AVAILABLE or ENGAGED (not BENCHED)"
          - "the original engagement is ACTIVE"
        side_effects:
          - "mints a new Engagement(status=ACTIVE) for the same client with the replacement VA; sets it as Client.active_engagement_id; new VA active_engagement_count += 1 (cascade hop 1)"
          - "the new ACTIVE engagement causes the original Engagement -> ENDED (cascade hop 2): old VA active_engagement_count -= 1, old VA -> AVAILABLE if 0; original.superseded_by_engagement_id = new engagement id"
          - "the original engagement's ENDED transition re-points its non-terminal Tasks to the new engagement_id and resets their SLA timers (cascade hop 3, triggered by the engagement-end side-effect)"
          - "escalation.replacement_engagement_id = new engagement id"

# =============================================================================
# §1.2.1 Concurrency Rules  (OCC on RetainerCycle.version — the one true race)
# =============================================================================
concurrency_rules:
  - rule_id: cycle-close-stale-version
    parent_entity: RetainerCycle
    write_endpoint: "POST /va-staffing/cycles/{cycle_id}/close"
    occ_field: "expected_cycle_version"
    description: |
      Closing a RetainerCycle whose version has advanced since the client last
      observed it is rejected. Approving a TimeEntry against the cycle legitimately
      bumps RetainerCycle.version (it recomputes consumed/available/overage); a
      close request still carrying the pre-approval version is operating on a stale
      view of the bank balance and must be rejected so the operator re-reads the
      true consumed_hours before sealing the cycle for invoicing.
    error_id: ERR_STALE_CYCLE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table  (7 calculations; multiple variants)
# =============================================================================
calculations:
  # --- A. Cycle hour-bank balance (aggregation; status-filtered input set) -----
  - name: cycle_balance
    trigger: "TimeEntry LOGGED->APPROVED; TimeEntry->REJECTED via task cancel; RetainerCycle close"
    algorithm: aggregation
    formula: |
      consumed_hours = sum(te.billable_hours for te in TimeEntry
                           where te.cycle_id == cycle.id AND te.status == APPROVED)
      bank = cycle.granted_hours + cycle.rolled_in_hours
      available_hours = max(0, bank - consumed_hours)
      overage_hours   = max(0, consumed_hours - bank)
    input_set: "Only APPROVED TimeEntry rows pinned to this cycle_id. LOGGED and REJECTED entries excluded."
    constants: {}
    precision: "hours to 2 decimals, round_half_up; computed AFTER per-entry billable_hours rounding (calc time_entry_billable)"

  # --- B. Per-entry billable rounding (ceil to 15-min grid; boundary metric) ---
  - name: time_entry_billable
    trigger: "TimeEntry create (LOGGED)"
    algorithm: threshold
    formula: |
      # round raw wall-time UP to the next 15-minute (0.25 h) increment
      quarter_hours  = ceil(raw_minutes / 15)
      billable_hours = quarter_hours * 0.25
    input_set: "Single TimeEntry's raw_minutes."
    constants:
      GRID_MINUTES: 15
    precision: "exact multiples of 0.25 h; ceil at the 15-minute grid (1 min -> 0.25 h; 15 min -> 0.25 h; 16 min -> 0.5 h)"

  # --- C. Invoice total — DUAL VARIANT (provisional vs final), tiered ----------
  - name: invoice_total
    trigger: "POST /va-staffing/invoices (variant in {PROVISIONAL, FINAL})"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is PINNED:
      #   (1) determine billed_hours set per variant,
      #   (2) split into within-bank vs overage tiers,
      #   (3) price each tier (round per tier BEFORE summing),
      #   (4) add specialized surcharge, (5) subtract SLA credit, (6) floor at 0.
      bank = cycle.granted_hours + cycle.rolled_in_hours
      within_bank_hours = min(billed_hours, bank)
      overage_hours     = max(0, billed_hours - bank)
      base_charge_cents    = round_half_up(within_bank_hours * client.base_rate_cents)
      overage_charge_cents = round_half_up(overage_hours * client.overage_rate_cents)
      # surcharge_hours = sum of billable_hours of the counted TimeEntries whose Task.required_skill_tag_id
      #   equals an ACTIVE AddOn.skill_tag_id on the engagement; priced at that AddOn.surcharge_rate_cents
      surcharge_cents      = round_half_up(sum over such entries of (entry.billable_hours * addon.surcharge_rate_cents))
      sla_credit_cents     = sla_breach_credit (calc sla_breach_credit)
      total_cents = max(0, base_charge_cents + overage_charge_cents + surcharge_cents - sla_credit_cents)
      utilization_pct = round_half_up(billed_hours / bank, 4)
    input_set: "TimeEntry rows charged to cycle_id; which rows count depends on variant (see variants)."
    constants: {}
    precision: "money in integer cents, round_half_up per tier BEFORE summing (round-per-tier-then-sum is PINNED); utilization to 4 decimals"
    variants:
      - name: PROVISIONAL
        when: "Issued mid-cycle (cycle still OPEN) to project the bill"
        difference: |
          billed_hours = sum(te.billable_hours for te on this cycle where te.status IN {LOGGED, APPROVED})
          — counts not-yet-approved LOGGED entries optimistically. With any LOGGED entry present,
          PROVISIONAL total >= FINAL total for identical data.
      - name: FINAL
        when: "Issued after the cycle is CLOSED to bill the client"
        difference: |
          billed_hours = sum(te.billable_hours for te on this cycle where te.status == APPROVED)
          — excludes LOGGED; only approved hours are billed.

  # --- D. Rollover carry — DUAL VARIANT, different entity domain (Cycle) -------
  - name: rollover_carry
    trigger: "RetainerCycle OPEN->CLOSED (computes successor cycle's rolled_in_hours)"
    algorithm: waterfall_allocation
    formula: |
      unused = max(0, (cycle.granted_hours + cycle.rolled_in_hours) - cycle.consumed_hours)
      rolled_in_next = min(unused, client.rollover_cap_hours)
    input_set: "The closing cycle's granted+rolled_in vs consumed (APPROVED entries only)."
    constants: {}
    precision: "hours to 2 decimals, round_half_up"
    variants:
      - name: CAP_BINDING
        when: "unused > client.rollover_cap_hours"
        difference: "rolled_in_next = client.rollover_cap_hours; the surplus above the cap is forfeited (does NOT carry)."
      - name: CAP_SLACK
        when: "unused <= client.rollover_cap_hours"
        difference: "rolled_in_next = unused; the entire remainder carries, nothing forfeited."

  # --- E. VA match score (weighted scoring; selector with explicit tie-break) --
  - name: va_match_score
    trigger: "POST /va-staffing/engagements with va_id omitted (auto-match); ranks candidate VAs"
    algorithm: weighted_scoring
    formula: |
      # candidate set (eligibility filter):
      #   VirtualAssistant.status IN {AVAILABLE, ENGAGED}
      #   AND every id in client.required_skill_tag_ids is in va.skill_tag_ids (full coverage)
      skill_coverage = (count of client.required_skill_tag_ids present in va.skill_tag_ids)
                       / max(1, count(client.required_skill_tag_ids))     # fraction 0..1 (=1.0 for eligible)
      rating_norm   = va.rating / 5.0
      capacity_norm = min(1.0, va.weekly_capacity_hours / 40.0)
      match_score = round_half_up(W_SKILL*skill_coverage + W_RATING*rating_norm + W_CAPACITY*capacity_norm, 4)
      # selector: pick MAX match_score; tie-break VirtualAssistant.created_at ASC (earliest registered wins).
      # NEVER use id. Empty candidate set -> ERR_NO_ELIGIBLE_VA.
    input_set: "All VirtualAssistants in {AVAILABLE, ENGAGED} fully covering the client's required skills."
    constants:
      W_SKILL: 0.5
      W_RATING: 0.3
      W_CAPACITY: 0.2
    precision: "score to 4 decimals, round_half_up; selection tie-break = created_at ASC; id forbidden in decisions"

  # --- F. SLA due + breach detection (threshold over logical clock) ------------
  - name: sla_due
    trigger: "Task QUEUED->ASSIGNED (and re-stamp on replacement re-point); evaluated on read and on transitions"
    algorithm: threshold
    formula: |
      policy = SlaPolicy where tier == task.priority
      response_due_iso   = assigned_at_iso + policy.response_minutes minutes
      resolution_due_iso = assigned_at_iso + policy.resolution_hours hours
      # sla_state evaluated against clock.current_utc, in PRIORITY ORDER, boundary STRICT '>':
      if task.status == DONE:
        sla_state = RESOLUTION_BREACHED if completed_at_iso > resolution_due_iso else ON_TRACK   # latched
      elif clock.current_utc > resolution_due_iso:
        sla_state = RESOLUTION_BREACHED
      elif first_action_at_iso is null AND clock.current_utc > response_due_iso:
        sla_state = RESPONSE_BREACHED
      else:
        sla_state = ON_TRACK
      # Boundary is STRICT '>': clock exactly == due is ON_TRACK; due + 1 second is breached.
    input_set: "Single Task + its SlaPolicy + clock.current_utc."
    constants:
      BOUNDARY: "strict greater-than; equal is ON_TRACK"
    precision: "datetime arithmetic in whole minutes/hours; comparison strict '>'"

  # --- G. SLA breach credit (aggregation feeding invoice) ---------------------
  - name: sla_breach_credit
    trigger: "Invoice create (both variants)"
    algorithm: aggregation
    formula: |
      sla_credit_cents = round_half_up(
        sum over Task t where (t.client_id == client.id
                               AND t has >=1 APPROVED TimeEntry charged to the billed cycle
                               AND t.sla_state == RESOLUTION_BREACHED)
            of (t.billed_hours * client.base_rate_cents * sla_policy(t.priority).breach_penalty_pct)
      )
    input_set: "Tasks whose sla_state == RESOLUTION_BREACHED among those whose APPROVED time entries charged the billed cycle."
    constants: {}
    precision: "integer cents, round_half_up after the sum"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a recognized role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role permitted for this operation per §1.7; entity-backed roles must own the targeted resource"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every path id resolves (left-to-right): client/va/engagement/cycle/task/entry/escalation/addon/invoice/skill-tag/sla-policy"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all id-scoped endpoints

  - priority: 4
    category: existence
    check: "FK bodies resolve: client_id, va_id, required_skill_tag_id, skill_tag_id, cycle_id, task_id, each required_skill_tag_ids element exist"
    error_id: ERR_REFERENCED_ENTITY_NOT_FOUND
    http_status: 422
    applies_to: "engagement create, task create, addon create, time-entry create, invoice create, client scope"

  - priority: 5
    category: business_constraint
    check: "Body well-formed: required fields present, numeric fields within declared ranges (raw_minutes>=1, hours>=0, rates>=0)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all create/scope endpoints

  - priority: 6
    category: business_constraint
    check: "Range guards: breach_penalty_pct in [0,1], rollover_cap_hours>=0, weekly_capacity_hours>=1.0, rating in [0,5]"
    error_id: ERR_VALIDATION_RANGE
    http_status: 422
    applies_to: "sla-policy create, client scope, va create"

  - priority: 7
    category: business_constraint
    check: "Pagination: limit in [1,100], offset >= 0"
    error_id: ERR_PAGINATION_INVALID
    http_status: 422
    applies_to: all list endpoints

  - priority: 8
    category: state
    check: "Target resource is in a state from which the requested transition is defined (§1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all transition endpoints

  - priority: 9
    category: state
    check: "Cross-entity gate: task assign requires Client.status==ACTIVE and a non-null active_engagement_id"
    error_id: ERR_CLIENT_NOT_ACTIVE
    http_status: 409
    applies_to: "task assign"

  - priority: 10
    category: business_constraint
    check: "Task assign requires an SlaPolicy to exist for the task's priority tier"
    error_id: ERR_SLA_POLICY_MISSING
    http_status: 409
    applies_to: "task assign"

  - priority: 11
    category: business_safety
    check: "Specialized-skill gate: assigning a task whose required_skill_tag_id.is_specialized is true requires an ACTIVE matching AddOn on the active engagement"
    error_id: ERR_ADDON_REQUIRED
    http_status: 409
    applies_to: "task assign"

  - priority: 12
    category: business_referential
    check: "AddOn skill_tag_id must reference a SkillTag with is_specialized==true"
    error_id: ERR_NOT_SPECIALIZED
    http_status: 422
    applies_to: "addon create"

  - priority: 13
    category: business_constraint
    check: "Selector: at least one VA satisfies the eligibility filter (status in {AVAILABLE,ENGAGED} and full skill coverage)"
    error_id: ERR_NO_ELIGIBLE_VA
    http_status: 422
    applies_to: "engagement create (auto-match)"

  - priority: 14
    category: business_referential
    check: "TimeEntry may only be logged on a task in {ASSIGNED, IN_PROGRESS} by the VA of that task's ACTIVE engagement"
    error_id: ERR_TASK_NOT_WORKABLE
    http_status: 409
    applies_to: "time-entry create"

  - priority: 15
    category: business_temporal
    check: "TimeEntry create requires the client to have an OPEN RetainerCycle to pin cycle_id"
    error_id: ERR_CYCLE_NOT_OPEN
    http_status: 409
    applies_to: "time-entry create"

  - priority: 16
    category: business_temporal
    check: "A TimeEntry can only be APPROVED while the client has an OPEN RetainerCycle"
    error_id: ERR_NO_OPEN_CYCLE
    http_status: 409
    applies_to: "time-entry approve"

  - priority: 17
    category: business_constraint
    check: "A RetainerCycle cannot be CLOSED while any LOGGED (un-approved) TimeEntry charges it"
    error_id: ERR_CYCLE_HAS_PENDING_ENTRIES
    http_status: 409
    applies_to: "cycle close"

  - priority: 18
    category: business_constraint
    check: "OCC: expected_cycle_version must equal RetainerCycle.version on cycle close"
    error_id: ERR_STALE_CYCLE_VERSION
    http_status: 412
    applies_to: "cycle close"

  - priority: 19
    category: business_constraint
    check: "FINAL invoice requires the cycle to be CLOSED; PROVISIONAL requires it OPEN"
    error_id: ERR_INVOICE_VARIANT_STATE
    http_status: 409
    applies_to: "invoice create"

  - priority: 20
    category: business_constraint
    check: "Task complete requires at least one APPROVED TimeEntry on the task"
    error_id: ERR_NO_APPROVED_TIME
    http_status: 409
    applies_to: "task complete"

  - priority: 21
    category: business_constraint
    check: "Replacement requires replacement va_id AVAILABLE or ENGAGED (not BENCHED) and an ACTIVE original engagement"
    error_id: ERR_REPLACEMENT_INELIGIBLE
    http_status: 409
    applies_to: "escalation replace"

  - priority: 22
    category: business_constraint
    check: "Uniqueness: Client.contact_email, VirtualAssistant.email, SkillTag.code, SlaPolicy.tier"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "client create, va create, skill-tag create, sla-policy create"

# =============================================================================
# §1.5 API Endpoint Table  (45 endpoints)
# =============================================================================
endpoints:
  # ---- Logical clock (test-driving) ------------------------------------------
  - method: POST
    path: "/va-staffing/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [StaffingManager]
    code: 200
    input: [to_iso8601]
    output: Clock
    side_effects: ["clock.current_utc = to_iso8601; Task.sla_state is re-evaluated against the new clock on subsequent reads"]

  - method: GET
    path: "/va-staffing/_clock"
    description: "Read the current logical clock value"
    roles: [StaffingManager, Client, VA]
    code: 200
    input: []
    output: Clock
    side_effects: []

  # ---- SkillTag config -------------------------------------------------------
  - method: POST
    path: "/va-staffing/skill-tags"
    description: "Create a skill tag (specialized or not)"
    roles: [StaffingManager]
    code: 201
    input: [code, name, "is_specialized?"]
    output: SkillTag
    side_effects: []

  - method: GET
    path: "/va-staffing/skill-tags/{skill_tag_id}"
    description: "Get a skill tag"
    roles: [StaffingManager, Client, VA]
    code: 200
    input: []
    output: SkillTag
    side_effects: []

  - method: GET
    path: "/va-staffing/skill-tags"
    description: "List skill tags"
    roles: [StaffingManager, Client, VA]
    code: 200
    input: ["is_specialized?", "limit?", "offset?"]
    output: SkillTag[]
    side_effects: []

  # ---- SlaPolicy config ------------------------------------------------------
  - method: POST
    path: "/va-staffing/sla-policies"
    description: "Create an SLA policy for a priority tier"
    roles: [StaffingManager]
    code: 201
    input: [tier, response_minutes, resolution_hours, breach_penalty_pct]
    output: SlaPolicy
    side_effects: []

  - method: GET
    path: "/va-staffing/sla-policies/{sla_policy_id}"
    description: "Get an SLA policy"
    roles: [StaffingManager, Client, VA]
    code: 200
    input: []
    output: SlaPolicy
    side_effects: []

  - method: GET
    path: "/va-staffing/sla-policies"
    description: "List SLA policies"
    roles: [StaffingManager, Client, VA]
    code: 200
    input: ["tier?", "limit?", "offset?"]
    output: SlaPolicy[]
    side_effects: []

  # ---- VirtualAssistant ------------------------------------------------------
  - method: POST
    path: "/va-staffing/virtual-assistants"
    description: "Register a VA in the pool"
    roles: [StaffingManager]
    code: 201
    input: [full_name, email, "skill_tag_ids?", weekly_capacity_hours, "rating?"]
    output: VirtualAssistant
    side_effects: ["status=AVAILABLE; active_engagement_count=0"]

  - method: GET
    path: "/va-staffing/virtual-assistants/{va_id}"
    description: "Get a VA"
    roles: [StaffingManager, Client, VA]
    code: 200
    input: []
    output: VirtualAssistant
    side_effects: []

  - method: GET
    path: "/va-staffing/virtual-assistants"
    description: "List VAs; filter by skill and status; supports pagination"
    roles: [StaffingManager, Client]
    code: 200
    input: ["skill_tag_id?", "status?", "limit?", "offset?"]
    output: VirtualAssistant[]
    side_effects: []

  # ---- Client intake ---------------------------------------------------------
  - method: POST
    path: "/va-staffing/clients"
    description: "Create a client (intake, PENDING)"
    roles: [StaffingManager, Client]
    code: 201
    input: [company_name, contact_email]
    output: Client
    side_effects: ["status=PENDING; open_task_count=0"]

  - method: GET
    path: "/va-staffing/clients/{client_id}"
    description: "Get a client"
    roles: [StaffingManager, Client]
    code: 200
    input: []
    output: Client
    side_effects: []

  - method: GET
    path: "/va-staffing/clients"
    description: "List clients"
    roles: [StaffingManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Client[]
    side_effects: []

  - method: PATCH
    path: "/va-staffing/clients/{client_id}/scope"
    description: "Scope a client (PENDING->SCOPED): retainer, rates, rollover cap, required skills"
    roles: [Client]
    code: 200
    input: [scope_summary, "required_skill_tag_ids?", monthly_retainer_hours, base_rate_cents, overage_rate_cents, "rollover_cap_hours?"]
    output: Client
    side_effects: ["status PENDING->SCOPED; persists scope fields"]

  - method: POST
    path: "/va-staffing/clients/{client_id}/suspend"
    description: "Suspend an ACTIVE client"
    roles: [StaffingManager]
    code: 200
    input: []
    output: Client
    side_effects: ["status ACTIVE->SUSPENDED; QUEUED/ASSIGNED tasks -> BLOCKED(CLIENT_SUSPENDED)"]

  - method: POST
    path: "/va-staffing/clients/{client_id}/resume"
    description: "Resume a SUSPENDED client"
    roles: [StaffingManager]
    code: 200
    input: []
    output: Client
    side_effects: ["status SUSPENDED->ACTIVE; CLIENT_SUSPENDED-blocked tasks revert (ASSIGNED or QUEUED)"]

  - method: POST
    path: "/va-staffing/clients/{client_id}/close"
    description: "Close a client (cascade cancels tasks, closes cycle, ends engagement)"
    roles: [StaffingManager]
    code: 200
    input: []
    output: Client
    side_effects:
      - "status -> CLOSED"
      - "non-terminal tasks -> CANCELLED (their LOGGED entries -> REJECTED)"
      - "OPEN cycle -> CLOSED (no successor minted because client is CLOSED)"
      - "ACTIVE engagement -> ENDED; VA active_engagement_count decremented; VA -> AVAILABLE if 0"

  # ---- Engagement (matching + onboarding) ------------------------------------
  - method: POST
    path: "/va-staffing/engagements"
    description: "Propose an engagement for a client; if va_id omitted the server auto-matches the best eligible VA (calc va_match_score) and sets match_score"
    roles: [StaffingManager]
    code: 201
    input: [client_id, "va_id?"]
    output: Engagement
    side_effects: ["status=PROPOSED; if va_id omitted, auto-match selects the VA; match_score computed"]

  - method: GET
    path: "/va-staffing/engagements/{engagement_id}"
    description: "Get an engagement"
    roles: [StaffingManager, Client]
    code: 200
    input: []
    output: Engagement
    side_effects: []

  - method: GET
    path: "/va-staffing/engagements"
    description: "List engagements (reverse-reachability for Client->Engagement via client_id and VirtualAssistant->Engagement via va_id)"
    roles: [StaffingManager, Client]
    code: 200
    input: ["client_id?", "va_id?", "status?", "limit?", "offset?"]
    output: Engagement[]
    side_effects: []

  - method: POST
    path: "/va-staffing/engagements/{engagement_id}/accept"
    description: "Client accepts a proposed engagement (PROPOSED->ONBOARDING)"
    roles: [Client]
    code: 200
    input: []
    output: Engagement
    side_effects: ["VA -> ENGAGED"]

  - method: POST
    path: "/va-staffing/engagements/{engagement_id}/reject"
    description: "Client rejects a proposed engagement (PROPOSED->REJECTED)"
    roles: [Client]
    code: 200
    input: []
    output: Engagement
    side_effects: []

  - method: POST
    path: "/va-staffing/engagements/{engagement_id}/return-to-proposed"
    description: "Send an ONBOARDING engagement back to PROPOSED (revert)"
    roles: [StaffingManager]
    code: 200
    input: []
    output: Engagement
    side_effects: ["VA -> AVAILABLE if no other ACTIVE engagement holds it"]

  - method: POST
    path: "/va-staffing/engagements/{engagement_id}/activate"
    description: "Activate an onboarded engagement (ONBOARDING->ACTIVE); opens cycle #1 if client was SCOPED"
    roles: [StaffingManager]
    code: 200
    input: [onboarding_checklist_done]
    output: Engagement
    side_effects:
      - "engagement -> ACTIVE; Client.active_engagement_id set; VA.active_engagement_count += 1"
      - "client SCOPED -> ACTIVE; opens RetainerCycle #1 (granted=monthly_retainer_hours, rolled_in=0, OPEN)"

  - method: POST
    path: "/va-staffing/engagements/{engagement_id}/end"
    description: "End an ACTIVE engagement"
    roles: [StaffingManager]
    code: 200
    input: []
    output: Engagement
    side_effects: ["engagement -> ENDED; VA.active_engagement_count -= 1; VA -> AVAILABLE if 0; non-terminal tasks re-queued (engagement_id cleared, QUEUED, SLA reset)"]

  # ---- AddOn (specialized skill) ---------------------------------------------
  - method: POST
    path: "/va-staffing/addons"
    description: "Request a specialized-skill add-on on an engagement"
    roles: [Client]
    code: 201
    input: [engagement_id, skill_tag_id, surcharge_rate_cents]
    output: AddOn
    side_effects: ["status=REQUESTED"]

  - method: GET
    path: "/va-staffing/addons/{addon_id}"
    description: "Get an add-on"
    roles: [StaffingManager, Client]
    code: 200
    input: []
    output: AddOn
    side_effects: []

  - method: GET
    path: "/va-staffing/addons"
    description: "List add-ons (reverse-reachability for Engagement->AddOn via engagement_id and SkillTag->AddOn via skill_tag_id)"
    roles: [StaffingManager, Client]
    code: 200
    input: ["engagement_id?", "skill_tag_id?", "status?", "limit?", "offset?"]
    output: AddOn[]
    side_effects: []

  - method: POST
    path: "/va-staffing/addons/{addon_id}/activate"
    description: "Activate a requested add-on (REQUESTED->ACTIVE)"
    roles: [StaffingManager]
    code: 200
    input: []
    output: AddOn
    side_effects: ["status -> ACTIVE; the engagement can now take tasks requiring that specialized skill"]

  # ---- RetainerCycle ---------------------------------------------------------
  - method: GET
    path: "/va-staffing/cycles/{cycle_id}"
    description: "Get a retainer cycle with computed balances"
    roles: [StaffingManager, Client]
    code: 200
    input: []
    output: RetainerCycle
    side_effects: []

  - method: GET
    path: "/va-staffing/cycles"
    description: "List retainer cycles (reverse-reachability for Client->RetainerCycle via client_id)"
    roles: [StaffingManager, Client]
    code: 200
    input: ["client_id?", "status?", "limit?", "offset?"]
    output: RetainerCycle[]
    side_effects: []

  - method: POST
    path: "/va-staffing/cycles/{cycle_id}/close"
    description: "Close an OPEN cycle (OCC-guarded); mints successor cycle with rolled-in carry unless client is CLOSED"
    roles: [StaffingManager]
    code: 200
    input: [expected_cycle_version]
    output: RetainerCycle
    side_effects:
      - "status OPEN->CLOSED; closed_at_iso=clock; increments RetainerCycle.version by 1"
      - "mints successor RetainerCycle (sequence_no+1, OPEN, rolled_in_hours = calc rollover_carry) unless client is CLOSED"

  # ---- Task ------------------------------------------------------------------
  - method: POST
    path: "/va-staffing/tasks"
    description: "Create a task in the queue (QUEUED)"
    roles: [Client, StaffingManager]
    code: 201
    input: [client_id, title, "priority?", "required_skill_tag_id?", "estimated_hours?"]
    output: Task
    side_effects: ["status=QUEUED; Client.open_task_count recomputed"]

  - method: GET
    path: "/va-staffing/tasks/{task_id}"
    description: "Get a task (sla_state re-evaluated against clock)"
    roles: [StaffingManager, Client, VA]
    code: 200
    input: []
    output: Task
    side_effects: ["sla_state recomputed on read (calc sla_due)"]

  - method: GET
    path: "/va-staffing/tasks"
    description: "List tasks (reverse-reachability for Client->Task via client_id, Engagement->Task via engagement_id, SkillTag->Task via required_skill_tag_id)"
    roles: [StaffingManager, Client, VA]
    code: 200
    input: ["client_id?", "engagement_id?", "required_skill_tag_id?", "status?", "priority?", "limit?", "offset?"]
    output: Task[]
    side_effects: []

  - method: POST
    path: "/va-staffing/tasks/{task_id}/assign"
    description: "Assign a QUEUED task to the client's active engagement (QUEUED->ASSIGNED)"
    roles: [StaffingManager]
    code: 200
    input: []
    output: Task
    side_effects: ["engagement_id set; assigned_at_iso=clock; SLA due computed; sla_state=ON_TRACK"]

  - method: POST
    path: "/va-staffing/tasks/{task_id}/start"
    description: "VA starts an assigned task (ASSIGNED->IN_PROGRESS)"
    roles: [VA]
    code: 200
    input: []
    output: Task
    side_effects: ["first_action_at_iso stamped if null"]

  - method: POST
    path: "/va-staffing/tasks/{task_id}/block"
    description: "VA blocks a task (ASSIGNED/IN_PROGRESS->BLOCKED)"
    roles: [VA]
    code: 200
    input: [blocked_reason]
    output: Task
    side_effects: ["blocked_reason captured; first_action_at_iso stamped if null"]

  - method: POST
    path: "/va-staffing/tasks/{task_id}/unblock"
    description: "VA unblocks a task (BLOCKED->IN_PROGRESS)"
    roles: [VA]
    code: 200
    input: []
    output: Task
    side_effects: ["blocked_reason cleared"]

  - method: POST
    path: "/va-staffing/tasks/{task_id}/complete"
    description: "VA completes a task (IN_PROGRESS->DONE)"
    roles: [VA]
    code: 200
    input: []
    output: Task
    side_effects: ["status->DONE; completed_at_iso=clock; sla_state latched; Client.open_task_count recomputed"]

  - method: POST
    path: "/va-staffing/tasks/{task_id}/cancel"
    description: "Cancel a non-terminal task"
    roles: [Client, StaffingManager]
    code: 200
    input: []
    output: Task
    side_effects: ["status->CANCELLED; LOGGED entries -> REJECTED; Client.open_task_count recomputed"]

  # ---- TimeEntry -------------------------------------------------------------
  - method: POST
    path: "/va-staffing/time-entries"
    description: "VA logs time on an assigned/in-progress task (LOGGED); pins cycle_id to client's OPEN cycle"
    roles: [VA]
    code: 201
    input: [task_id, raw_minutes, "note?"]
    output: TimeEntry
    side_effects: ["status=LOGGED; billable_hours computed (calc time_entry_billable); cycle_id pinned to client's OPEN cycle; va_id = engagement VA"]

  - method: GET
    path: "/va-staffing/time-entries/{entry_id}"
    description: "Get a time entry"
    roles: [StaffingManager, Client, VA]
    code: 200
    input: []
    output: TimeEntry
    side_effects: []

  - method: GET
    path: "/va-staffing/time-entries"
    description: "List time entries (reverse-reachability for Task->TimeEntry via task_id, RetainerCycle->TimeEntry via cycle_id, VirtualAssistant->TimeEntry via va_id)"
    roles: [StaffingManager, Client, VA]
    code: 200
    input: ["task_id?", "cycle_id?", "va_id?", "status?", "limit?", "offset?"]
    output: TimeEntry[]
    side_effects: []

  - method: POST
    path: "/va-staffing/time-entries/{entry_id}/approve"
    description: "Client approves a logged entry (LOGGED->APPROVED); charges the OPEN cycle"
    roles: [Client]
    code: 200
    input: []
    output: TimeEntry
    side_effects:
      - "status->APPROVED; approved_at_iso=clock; cycle_id pinned to client's OPEN cycle"
      - "RetainerCycle balances recomputed (calc cycle_balance); RetainerCycle.version += 1"
      - "Task.billed_hours recomputed"

  - method: POST
    path: "/va-staffing/time-entries/{entry_id}/reject"
    description: "Client rejects a logged entry (LOGGED->REJECTED)"
    roles: [Client]
    code: 200
    input: []
    output: TimeEntry
    side_effects: ["status->REJECTED; never charges a cycle"]

  # ---- Escalation / replacement ----------------------------------------------
  - method: POST
    path: "/va-staffing/escalations"
    description: "Open an escalation on a client's active engagement"
    roles: [Client, StaffingManager]
    code: 201
    input: [client_id, reason]
    output: Escalation
    side_effects: ["status=OPEN; engagement_id = Client.active_engagement_id"]

  - method: GET
    path: "/va-staffing/escalations/{escalation_id}"
    description: "Get an escalation"
    roles: [StaffingManager, Client]
    code: 200
    input: []
    output: Escalation
    side_effects: []

  - method: GET
    path: "/va-staffing/escalations"
    description: "List escalations (reverse-reachability for Client->Escalation via client_id and Engagement->Escalation via engagement_id)"
    roles: [StaffingManager, Client]
    code: 200
    input: ["client_id?", "engagement_id?", "status?", "limit?", "offset?"]
    output: Escalation[]
    side_effects: []

  - method: POST
    path: "/va-staffing/escalations/{escalation_id}/resolve"
    description: "Resolve an escalation without replacement (OPEN->RESOLVED)"
    roles: [StaffingManager]
    code: 200
    input: []
    output: Escalation
    side_effects: ["status->RESOLVED; engagement unchanged"]

  - method: POST
    path: "/va-staffing/escalations/{escalation_id}/replace"
    description: "Replace the VA (OPEN->REPLACED): mint new ACTIVE engagement, end the old one, re-point tasks"
    roles: [StaffingManager]
    code: 200
    input: [va_id]
    output: Escalation
    side_effects:
      - "new Engagement(ACTIVE) minted with replacement VA; Client.active_engagement_id updated; new VA active_engagement_count += 1"
      - "original Engagement -> ENDED (old VA active_engagement_count -= 1, -> AVAILABLE if 0); superseded_by_engagement_id set"
      - "non-terminal tasks re-pointed to new engagement; ASSIGNED/IN_PROGRESS re-stamp SLA due; replacement_engagement_id set"

  # ---- Invoice (billing + utilization) ---------------------------------------
  - method: POST
    path: "/va-staffing/invoices"
    description: "Generate an invoice for a cycle in PROVISIONAL (OPEN cycle) or FINAL (CLOSED cycle) variant"
    roles: [StaffingManager]
    code: 201
    input: [client_id, cycle_id, variant]
    output: Invoice
    side_effects: ["status=ISSUED; base/overage/surcharge/sla_credit/total/utilization computed (calc invoice_total, sla_breach_credit)"]

  - method: GET
    path: "/va-staffing/invoices/{invoice_id}"
    description: "Get an invoice"
    roles: [StaffingManager, Client]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: GET
    path: "/va-staffing/invoices"
    description: "List invoices (reverse-reachability for Client->Invoice via client_id and RetainerCycle->Invoice via cycle_id)"
    roles: [StaffingManager, Client]
    code: 200
    input: ["client_id?", "cycle_id?", "variant?", "status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog  (22 error codes)
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or unrecognized X-User-Role header"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for the operation, or entity-backed role does not own the targeted resource"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path-scoped resource (client/va/engagement/cycle/task/entry/escalation/addon/invoice/skill-tag/sla-policy) does not exist"
  - id: ERR_REFERENCED_ENTITY_NOT_FOUND
    http: 422
    condition: "A body FK (client_id, va_id, required_skill_tag_id, skill_tag_id, cycle_id, task_id, required_skill_tag_ids element) references a non-existent entity"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Malformed body, missing required field, or numeric field out of declared range (raw_minutes>=1, hours>=0, rates>=0)"
  - id: ERR_VALIDATION_RANGE
    http: 422
    condition: "breach_penalty_pct outside [0,1], rollover_cap_hours negative, weekly_capacity_hours below 1.0, or rating outside [0,5]"
  - id: ERR_PAGINATION_INVALID
    http: 422
    condition: "limit outside [1,100] or offset negative on a list endpoint"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition is not defined from the resource's current state"
  - id: ERR_CLIENT_NOT_ACTIVE
    http: 409
    condition: "Task assign attempted while client is not ACTIVE or has no active engagement"
  - id: ERR_SLA_POLICY_MISSING
    http: 409
    condition: "Task assign attempted but no SlaPolicy exists for the task's priority tier"
  - id: ERR_ADDON_REQUIRED
    http: 409
    condition: "Assigning a task requiring a specialized skill without an ACTIVE matching AddOn on the active engagement"
  - id: ERR_NOT_SPECIALIZED
    http: 422
    condition: "AddOn created against a SkillTag whose is_specialized is false"
  - id: ERR_NO_ELIGIBLE_VA
    http: 422
    condition: "Auto-match found no VA satisfying the eligibility filter (status in {AVAILABLE,ENGAGED} with full skill coverage)"
  - id: ERR_TASK_NOT_WORKABLE
    http: 409
    condition: "Time logged on a task not in {ASSIGNED, IN_PROGRESS}, or by a VA other than the engagement VA"
  - id: ERR_CYCLE_NOT_OPEN
    http: 409
    condition: "TimeEntry create attempted while the client has no OPEN cycle to pin cycle_id"
  - id: ERR_NO_OPEN_CYCLE
    http: 409
    condition: "TimeEntry approval attempted while the client has no OPEN RetainerCycle"
  - id: ERR_CYCLE_HAS_PENDING_ENTRIES
    http: 409
    condition: "Cycle close attempted while LOGGED (un-approved) TimeEntries still charge the cycle"
  - id: ERR_STALE_CYCLE_VERSION
    http: 412
    condition: "expected_cycle_version does not match RetainerCycle.version on cycle close (OCC)"
  - id: ERR_INVOICE_VARIANT_STATE
    http: 409
    condition: "FINAL invoice on a non-CLOSED cycle, or PROVISIONAL invoice on a non-OPEN cycle"
  - id: ERR_NO_APPROVED_TIME
    http: 409
    condition: "Task complete attempted with no APPROVED TimeEntry on the task"
  - id: ERR_REPLACEMENT_INELIGIBLE
    http: 409
    condition: "Replacement va_id is BENCHED, or the original engagement is not ACTIVE"
  - id: ERR_DUPLICATE
    http: 409
    condition: "Uniqueness violation: Client.contact_email, VirtualAssistant.email, SkillTag.code, or SlaPolicy.tier already exists"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: StaffingManager
    description: "Platform operator: manages the VA pool, SLA/skill config, matching, onboarding, escalation/replacement, cycle close, and billing."
    identity: opaque
    exclusive_operations:
      - "POST /va-staffing/skill-tags, POST /va-staffing/sla-policies, POST /va-staffing/virtual-assistants"
      - "POST /va-staffing/clients/{id}/suspend | resume | close"
      - "POST /va-staffing/engagements (auto-match), .../activate, .../return-to-proposed, .../end"
      - "POST /va-staffing/addons/{id}/activate"
      - "POST /va-staffing/cycles/{id}/close"
      - "POST /va-staffing/tasks/{id}/assign"
      - "POST /va-staffing/escalations/{id}/resolve | replace"
      - "POST /va-staffing/invoices"
      - "POST /va-staffing/_clock/set_current_utc"
    shared_operations:
      - "POST /va-staffing/clients (intake)"
      - "POST /va-staffing/tasks (create), .../cancel"
      - "POST /va-staffing/escalations (open)"
      - "GET reads across all collections"

  - name: Client
    description: "The customer organization: scopes its engagement, accepts/rejects proposals, requests add-ons, creates/cancels tasks, approves/rejects time entries."
    identity: "entity_backed:Client"
    exclusive_operations:
      - "PATCH /va-staffing/clients/{id}/scope"
      - "POST /va-staffing/engagements/{id}/accept | reject"
      - "POST /va-staffing/addons (request)"
      - "POST /va-staffing/time-entries/{id}/approve | reject"
    shared_operations:
      - "POST /va-staffing/clients (intake), GET /va-staffing/clients/{id}"
      - "POST /va-staffing/tasks (create), .../cancel"
      - "POST /va-staffing/escalations (open)"
      - "GET reads scoped to own client tree"

  - name: VA
    description: "The matched virtual assistant: works tasks (start/block/unblock/complete) and logs time on the tasks of engagements they hold."
    identity: "entity_backed:VirtualAssistant"
    exclusive_operations:
      - "POST /va-staffing/tasks/{id}/start | block | unblock | complete"
      - "POST /va-staffing/time-entries (log time)"
    shared_operations:
      - "GET reads scoped to tasks/entries of own engagements; GET /va-staffing/_clock"
