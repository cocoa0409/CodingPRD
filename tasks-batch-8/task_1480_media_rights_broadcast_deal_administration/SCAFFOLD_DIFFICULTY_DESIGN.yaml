  - name: broadcaster_bar_cascades_to_deal_termination_and_milestone_default
    grounds:
    - state_machines.Broadcaster.SUSPENDED_to_BARRED
    - state_machines.Deal.ACTIVE_to_TERMINATED_BREACH
    - state_machines.PaymentMilestone.OVERDUE_to_DEFAULTED
