        distinguishing_aspect: |
          Category pair state vs business_fiscal: certifying a packet that is still
          DRAFT while its linked fee waiver is also non-terminal (SUBMITTED) fails
          both priority-6 state and priority-16 fiscal checks; the state error
          ERR_INVALID_STATE must win.
        test_recipe:
          setup:
            - "Packet in DRAFT (never submitted to review) linked to a SUBMITTED fee waiver; LEGAL certifier available"
          setup_api_calls:
            - { call: "POST /naturalization/programs", payload: { name: "Main" }, as: ProgramAdmin }
            - call: "POST /naturalization/applicants"
              payload: { full_name: "Ana Paz", email: "ana@x.com", date_of_birth: "1986-04-02" }
              as: IntakeCoordinator
              captures: { app_id: $.data.id, app_v: $.data.version }
            - call: "POST /naturalization/applicants/${app_id}/screenings"
              payload: { expected_applicant_version: "${app_v}", marital_to_citizen: false, lpr_months: 80, continuous_residence_months: 61, physical_presence_days: 1000, age_years: 40, english_level: 3, civics_practice_pct: 25, has_legal_flag: false }
              as: IntakeCoordinator
            - call: "POST /naturalization/volunteers"
              payload: { full_name: "Prep Vol", email: "vp@x.com", background_check_cleared: true }
              as: ProgramAdmin
              captures: { vp_id: $.data.id }
            - call: "POST /naturalization/volunteers/${vp_id}/training-credits"
              payload: { topic: "forms", hours: 10, earned_at: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /naturalization/volunteers/${vp_id}/accredit"
              payload: { target_level: GENERAL }
              as: ProgramAdmin
            - call: "POST /naturalization/volunteers"
              payload: { full_name: "Sup Vol", email: "vs@x.com", background_check_cleared: true, bar_number: "BAR111" }
              as: ProgramAdmin
              captures: { vs_id: $.data.id }
            - call: "POST /naturalization/volunteers/${vs_id}/training-credits"
              payload: { topic: "ethics", hours: 10, earned_at: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /naturalization/volunteers/${vs_id}/accredit"
              payload: { target_level: GENERAL }
              as: ProgramAdmin
            - call: "POST /naturalization/volunteers/${vs_id}/accredit"
              payload: { target_level: LEGAL }
              as: ProgramAdmin
            - call: "POST /naturalization/workshops"
              payload: { title: "N-400 Workshop", supervising_volunteer_id: "${vs_id}", scheduled_start: "2026-08-05T10:00:00Z", duration_hours: 3, capacity: 5 }
              as: ProgramAdmin
              captures: { ws_id: $.data.id, ws_v: $.data.version }
            - call: "POST /naturalization/workshops/${ws_id}/seats"
              payload: { applicant_id: "${app_id}", expected_workshop_version: "${ws_v}" }
              as: IntakeCoordinator
              captures: { seat_id: $.data.id }
            - { call: "POST /naturalization/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T10:00:00Z" }, as: ProgramAdmin }
            - call: "POST /naturalization/workshops/${ws_id}/complete"
              payload: {}
              as: Volunteer
              as_user_id: "${vs_id}"
            - call: "POST /naturalization/applicants/${app_id}/fee-waiver-requests"
              payload: { household_size: 1, self_reported_income_cents: 2800000, self_reported_benefit: false }
              as: IntakeCoordinator
              captures: { fwr_id: $.data.id }
            - call: "POST /naturalization/fee-waiver-requests/${fwr_id}/submit"
              payload: { attached_document_count: 2 }
