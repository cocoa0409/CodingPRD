    roles: [Customer]
    code: 200
    input: []
    output: ArtProof
    side_effects: ["status -> CHANGES_REQUESTED"]

  - method: POST
    path: "/orders/{id}/art-proofs/{id}/approve"
    description: "Customer approves a proof (SUBMITTED -> APPROVED) with OCC on Order.version"
    roles: [Customer]
    code: 200
    input: ["expected_order_version"]
    output: ArtProof
    side_effects: ["status -> APPROVED; increments Order.version by 1"]

  # ---- BlankReservation ----
  - method: GET
    path: "/orders/{id}/reservations"
    description: "List BlankReservations of an Order (sub-resource; satisfies BlankReservation.order_id)"
    roles: [ShopManager, ArtStaff]
    code: 200
    input: ["blank_sku_id?", "status?", "limit?", "offset?"]
    output: "BlankReservation[]"
    side_effects: []

  - method: GET
    path: "/blank-reservations/{id}"
    description: "Get a BlankReservation"
    roles: [ShopManager, ArtStaff]
    code: 200
    input: []
    output: BlankReservation
    side_effects: []

  - method: GET
    path: "/blank-reservations"
    description: "List BlankReservations (filtered) — FK reverse-reachability for BlankReservation.order_id, .blank_sku_id"
    roles: [ShopManager, ArtStaff]
    code: 200
    input: ["order_id?", "blank_sku_id?", "status?", "limit?", "offset?"]
    output: "BlankReservation[]"
    side_effects: []

  # ---- ProductionRun ----
  - method: POST
    path: "/orders/{id}/production-runs"
    description: "Schedule a ProductionRun on a Press or EmbroideryStation; advances Order to IN_PRODUCTION if CONFIRMED"
    roles: [ShopManager]
    code: 201
    input: ["press_id?", "embroidery_station_id?", "window_start", "window_end"]
    output: ProductionRun
    side_effects: ["status=SCHEDULED; window booked; overlap checked per resource semantics; Order CONFIRMED -> IN_PRODUCTION"]

  - method: GET
    path: "/orders/{id}/production-runs"
    description: "List ProductionRuns of an Order (sub-resource; satisfies ProductionRun.order_id)"
    roles: [ShopManager, ArtStaff]
    code: 200
    input: ["press_id?", "embroidery_station_id?", "status?", "limit?", "offset?"]
    output: "ProductionRun[]"
    side_effects: []

  - method: GET
    path: "/production-runs/{id}"
    description: "Get a ProductionRun"
    roles: [ShopManager, ArtStaff]
    code: 200
    input: []
    output: ProductionRun
    side_effects: []

  - method: GET
    path: "/production-runs"
    description: "List ProductionRuns (filtered) — FK reverse-reachability for ProductionRun.order_id, .press_id, .embroidery_station_id"
    roles: [ShopManager, ArtStaff]
    code: 200
    input: ["order_id?", "press_id?", "embroidery_station_id?", "status?", "limit?", "offset?"]
    output: "ProductionRun[]"
    side_effects: []

  - method: POST
    path: "/orders/{id}/production-runs/{id}/start"
    description: "Start a scheduled run (SCHEDULED -> RUNNING); records blanks_pulled"
    roles: [ShopManager]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["status -> RUNNING; blanks_pulled recorded; Order CONFIRMED -> IN_PRODUCTION"]

  - method: POST
    path: "/orders/{id}/production-runs/{id}/complete"
    description: "Complete a run with QC results (RUNNING -> COMPLETED); cascades Order fulfillment"
    roles: [ShopManager]
    code: 200
    input: ["good_units", "spoiled_units"]
    output: ProductionRun
    side_effects: ["consumed_units and released_units set; if good_units >= ordered total -> Order FULFILLED, reservations released/consumed; else ERR_RUN_SHORT"]

  - method: POST
    path: "/orders/{id}/production-runs/{id}/abort"
    description: "Abort a run (SCHEDULED or RUNNING -> ABORTED); frees the machine window"
    roles: [ShopManager]
    code: 200
    input: []
    output: ProductionRun
    side_effects: ["status -> ABORTED; window freed"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT
    http: 400
    condition: "X-User-ID or X-User-Role header missing or malformed"
  - id: ERR_FORBIDDEN_FOR_ROLE
    http: 403
    condition: "Role not permitted for the endpoint, or acting Customer is not the owner of the resource"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path resource does not exist within the shop"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body: bad enum, non-positive quantity, empty size_run, color/size not in catalog, or method/resource mismatch"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource is not in a state from which the requested transition is allowed"
  - id: ERR_ORDER_NOT_DRAFT
    http: 409
    condition: "Lines or proof submissions attempted on an Order that is not DRAFT"
  - id: ERR_PROOF_NOT_APPROVED
    http: 409
    condition: "Order confirm attempted with no APPROVED ArtProof"
  - id: ERR_ORDER_EMPTY
    http: 409
    condition: "Order confirm attempted with zero OrderLines"
  - id: ERR_BLANK_INSUFFICIENT
    http: 409
    condition: "A line's BlankSku has insufficient on_hand_qty to cover ordered_qty + spoilage allowance"
  - id: ERR_ORDER_NOT_CONFIRMED
    http: 409
    condition: "ProductionRun create/start attempted while Order is not CONFIRMED or IN_PRODUCTION"
  - id: ERR_PRESS_WINDOW_CONFLICT
    http: 409
    condition: "A press run window collides with another non-terminal run within teardown_buffer_min"
  - id: ERR_STATION_OVERSUBSCRIBED
    http: 409
    condition: "An embroidery run window exceeds the station's head_count of concurrent half-open overlaps"
  - id: ERR_INVALID_GOOD_UNITS
    http: 400
    condition: "good_units is negative or exceeds blanks_pulled at completion"
  - id: ERR_RUN_SHORT
    http: 409
    condition: "Completion good_units below total ordered_qty; order cannot be fulfilled"
  - id: ERR_ORDER_NOT_FULFILLED
    http: 409
    condition: "Invoice attempted while Order.fulfillment_status is not FULFILLED"
  - id: ERR_ALREADY_INVOICED
    http: 409
    condition: "Invoice attempted while billing_status is not UNBILLED"
  - id: ERR_NOT_INVOICED
    http: 409
    condition: "Pay attempted while billing_status is not INVOICED"
  - id: ERR_ORDER_NOT_CANCELLABLE
    http: 409
    condition: "Cancel attempted while Order.fulfillment_status is not in {DRAFT, CONFIRMED}"
  - id: ERR_INVALID_REORDER_SOURCE
    http: 409
    condition: "reorder_of_order_id does not reference a FULFILLED Order of the same Customer"
  - id: ERR_STALE_ORDER_VERSION
    http: 412
    condition: "expected_order_version does not match the live Order.version at proof approve"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ShopManager
    description: "Operator of the shop: manages catalog, blanks, machines, and drives the order/production lifecycle"
    identity: "opaque"
    exclusive_operations:
      - "POST /shops — create shop"
      - "POST /_clock/set_current_utc — set clock"
      - "POST .../customers — create customer"
      - "POST .../decoration-methods — create method"
      - "POST .../garment-styles — create style"
      - "POST .../blank-skus — create blank sku"
      - "POST .../blank-skus/{id}/restock — restock"
      - "POST .../presses — create press"
      - "POST .../embroidery-stations — create station"
      - "POST .../orders/{id}/confirm — confirm order"
      - "POST .../orders/{id}/invoice — invoice order"
      - "POST .../production-runs — schedule run"
      - "POST .../production-runs/{id}/start — start run"
      - "POST .../production-runs/{id}/complete — complete run"
      - "POST .../production-runs/{id}/abort — abort run"
    shared_operations:
      - "POST .../orders — create order (shared with Customer)"
      - "POST .../orders/{id}/lines — add line (shared with Customer)"
      - "POST .../orders/{id}/cancel — cancel order (shared with Customer)"
      - "POST .../art-proofs — create proof (shared with ArtStaff)"
      - "GET reads"

  - name: ArtStaff
    description: "Art department: prepares and submits proofs through the revision loop"
    identity: "opaque"
    exclusive_operations:
      - "POST .../art-proofs/{id}/submit — submit/resubmit proof"
    shared_operations:
      - "POST .../art-proofs — create proof (shared with ShopManager)"
      - "GET reads"

  - name: Customer
    description: "Buyer acting on their own orders: places orders, reviews proofs, pays invoices"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST .../art-proofs/{id}/request-changes — request revisions on own order"
      - "POST .../art-proofs/{id}/approve — approve proof on own order (OCC)"
      - "POST .../orders/{id}/pay — pay own invoiced order"
    shared_operations:
      - "POST .../orders — create own order (shared with ShopManager)"
      - "POST .../orders/{id}/lines — add line to own draft order (shared with ShopManager)"
      - "POST .../orders/{id}/cancel — cancel own order (shared with ShopManager)"
      - "GET reads on own resources"

  - name: System
    description: "Automation actor for cascade-driven transitions (proof VOID on cancel, Order FULFILLED on run complete, reservation release/consume)"
    identity: "opaque"
    exclusive_operations: []
    shared_operations: []
