            - { call: "POST /youth-ministry/registrations", payload: {trip_id: "${trip_id}", participant_id: "${p1}", insurance_tier: "INTERNATIONAL", fundraising_goal_cents: 5000}, as: Guardian, as_user_id: "guardian-1", captures: {reg1: $.data.id} }
