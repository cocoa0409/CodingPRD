  side_effects: []
- method: GET
  path: /potato-shed/sheds/{id}
  description: Read a shed incl. derived posture and wash-fail counters
  roles:
  - ShedAdmin
  - IntakeClerk
  - StorageManager
  - QualityAssuranceManager
  - SalesManager
  - PackLineSupervisor
  - SettlementClerk
