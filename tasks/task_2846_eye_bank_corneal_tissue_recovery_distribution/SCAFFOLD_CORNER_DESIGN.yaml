      - name: no_role_can_reach_another_roles_exclusive_operation
        claim_type: cross_role_exclusive_operations_forbidden
        grounds:
          - validations.priority_2
          - "errors[ERR_FORBIDDEN_ROLE]"
          - "roles[EyeBankCoordinator].exclusive_operations"
          - "roles[MedicalDirector].exclusive_operations"
          - "roles[LabTechnician].exclusive_operations"
          - "roles[Surgeon].exclusive_operations"
        distinguishing_aspect: |
          Five cross-role attempts are made with syntactically perfect bodies against resources that
          do not exist. Because the role gate is priority 2 and body-FK resolution is priority 5,
          every one of them must fail with 403 ERR_FORBIDDEN_ROLE rather than any 404 — which is what
          separates a real role gate from a gate that only fires after the row is loaded.
        test_recipe:
          setup:
            - "empty database; logical clock at 2026-08-03T06:00:00.000Z; the ids below are well-formed but unknown UUIDs"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00.000Z" }
              as: EyeBankCoordinator
          trigger:
            - call: "POST /eye-bank/tissues/00000000-0000-4000-8000-0000000000a1/classify"
              payload: {}
              as: Surgeon
              as_user_id: "00000000-0000-4000-8000-0000000000a2"
              captures: { e1: $.data.error_id }
            - call: "POST /eye-bank/adverse-reaction-reports/00000000-0000-4000-8000-0000000000a3/substantiate"
              payload: { adjudication_note: "Coordinator attempting a medical adjudication." }
              as: EyeBankCoordinator
              captures: { e2: $.data.error_id }
            - call: "POST /eye-bank/recoveries"
              payload: { donor_id: "00000000-0000-4000-8000-0000000000a4", technician_id: "00000000-0000-4000-8000-0000000000a5", dispatched_at: "2026-08-03T06:30:00.000Z", planned_release_at: "2026-08-03T10:00:00.000Z" }
              as: LabTechnician
              captures: { e3: $.data.error_id }
            - call: "POST /eye-bank/allocations"
              payload: { tissue_id: "00000000-0000-4000-8000-0000000000a6", request_id: "00000000-0000-4000-8000-0000000000a7" }
              as: EvaluationTechnician
              as_user_id: "00000000-0000-4000-8000-0000000000a8"
              captures: { e4: $.data.error_id }
            - call: "POST /eye-bank/serology-panels/00000000-0000-4000-8000-0000000000a9/results"
              payload: { hiv_result: "NON_REACTIVE", hbv_result: "NON_REACTIVE", hcv_result: "NON_REACTIVE", syphilis_result: "NON_REACTIVE" }
              as: MedicalDirector
              captures: { e5: $.data.error_id }
          assert:
            - "HTTP 403 on all five attempts"
            - "${e1} == \"ERR_FORBIDDEN_ROLE\" (classify is MedicalDirector-exclusive)"
            - "${e2} == \"ERR_FORBIDDEN_ROLE\" (adjudication is MedicalDirector-exclusive)"
            - "${e3} == \"ERR_FORBIDDEN_ROLE\" (dispatching a recovery is EyeBankCoordinator-exclusive)"
            - "${e4} == \"ERR_FORBIDDEN_ROLE\" (allocation is EyeBankCoordinator-exclusive)"
            - "${e5} == \"ERR_FORBIDDEN_ROLE\" (posting marker results is LabTechnician-exclusive)"
            - "no 404 is returned anywhere, proving priority 2 runs ahead of priority 4 and priority 5"

      - name: a_request_missing_the_x_user_headers_is_unauthenticated
        claim_type: authentication_required
        grounds:
          - validations.priority_1
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: |
          Priority 1 covers three distinct header defects — both headers absent, only X-User-Role
          present, and an X-User-Role that is not one of the six declared roles — and all three must
          answer 401 ERR_UNAUTHENTICATED on both a write and a read, ahead of every other check.
        test_recipe:
          setup:
            - "empty database; logical clock at 2026-08-03T06:00:00.000Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
