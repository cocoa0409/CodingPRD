        claim_type: role_permission_matrix
        grounds:
          - roles[NetworkAdmin]
          - roles[PlantDispatcher]
          - roles[TransportManager]
          - roles[PermitDesk]
          - roles[SetCrewLead]
          - roles[InstallationInspector]
          - roles[ClaimsAdjuster]
          - errors[ERR_UNAUTHORIZED]
          - validations[priority 2]
        distinguishing_aspect: |
          One positive control per role on that role's own exclusive operation, and
          one negative probe per role pair on the operations it must not reach. The
          sharp pair is the permit desk and the carrier: pay-fee is
          TransportManager-exclusive and issue is PermitDesk-exclusive, so no single
          principal can both pay and issue the same permit; the second is the claims
          triangle, where ClaimsAdjuster owns review/adjudicate/reverse but is the
          only role that may NOT dispute.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one AZ plant, one ACTIVE AZ hauler, one licensed SetCrew (all created by NetworkAdmin - its positive control)"
