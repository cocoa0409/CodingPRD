# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3264_wholesale_capacity_purchase_prepaid_bulk_plan_economics
#
# Breadth probe: every testable claim the §1.1–§1.7 surface declares that §1.8
# does not already exercise. Corners §1.8 already covers appear as
# `excluded_because:` stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: capacity_agreement_create_returns_derived_defaults
        claim_type: Creation
        grounds:
          - entities.CapacityAgreement
          - endpoints.POST_/carriers/capacity-agreements
        distinguishing_aspect: "A host agreement created with only contracted volumes comes back 201 with agreement_status DRAFT, version 1, allocated_data_mb 0, remaining_data_mb equal to committed_data_mb, congestion_index 0 and congestion_active false — the derived fields are never client-supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &c_clock
              call: "POST /carriers/_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &c_ag
              call: "POST /carriers/capacity-agreements"
              payload: { host_network_name: "Pacific Host Network", state_code: "CA", data_rate_microcents_per_mb: 1237, voice_rate_microcents_per_min: 60, sms_rate_microcents_per_msg: 3, committed_data_mb: 16000, committed_voice_minutes: 200000, committed_sms_messages: 400000 }
              as: CapacityPlanner
              captures: { ag_id: $.data.id, ag_v0: $.data.version }
          assert:
            - "the response status is 201 and response_type is object"
            - "CapacityAgreement.${ag_id}.agreement_status == DRAFT and version == 1"
            - "CapacityAgreement.${ag_id}.allocated_data_mb == 0 and remaining_data_mb == 16000"
            - "CapacityAgreement.${ag_id}.congestion_index == 0 and congestion_active == false"
            - "CapacityAgreement.${ag_id}.resolved_purchase_cost_microcents == 0 before any resolve-purchase call"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: capacity_agreement_get_round_trips_every_configuration_field
        claim_type: Retrieval
        grounds:
          - entities.CapacityAgreement
          - endpoints.GET_/carriers/capacity-agreements/{id}
        distinguishing_aspect: "Every negotiated rate and committed volume round-trips through GET exactly as posted, including the congestion flag defaulting to false on the omitted input."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. One agreement created with the full rate card."
          setup_api_calls:
            - *c_clock
            - *c_ag
          trigger:
            - call: "GET /carriers/capacity-agreements/${ag_id}"
              payload: {}
              as: SupportAgent
          assert:
            - "the response status is 200"
            - "CapacityAgreement.${ag_id}.data_rate_microcents_per_mb == 1237 and voice_rate_microcents_per_min == 60 and sms_rate_microcents_per_msg == 3"
            - "CapacityAgreement.${ag_id}.committed_data_mb == 16000 and committed_voice_minutes == 200000 and committed_sms_messages == 400000"
            - "CapacityAgreement.${ag_id}.state_code == \"CA\" and host_network_name == \"Pacific Host Network\""
            - "created_at and updated_at are non-null ISO 8601 UTC strings with three fractional digits"

      - name: plans_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/carriers/plans
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three plans on one agreement, limit=2 offset=0 returns two rows with total_count 3 and has_more true, while offset=2 returns the remaining row with has_more false and total_count still 3 — total_count counts the filtered set, not the page."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. One active agreement with three plans."
          setup_api_calls:
            - *c_clock
            - *c_ag
            - call: "POST /carriers/capacity-agreements/${ag_id}/activate"
              payload: {}
              as: CapacityPlanner
            - &c_plan_b
              call: "POST /carriers/plans"
              payload: { agreement_id: "${ag_id}", plan_code: "M3", term_months: 3, intro_price_cents: 2999, renewal_price_cents: 3850, data_allotment_mb: 15000, voice_allotment_min: 1000, sms_allotment_msg: 2000 }
              as: CapacityPlanner
            - &c_plan_c
              call: "POST /carriers/plans"
              payload: { agreement_id: "${ag_id}", plan_code: "Y12", term_months: 12, intro_price_cents: 15999, renewal_price_cents: 19999, data_allotment_mb: 20000, voice_allotment_min: 2000, sms_allotment_msg: 4000 }
              as: CapacityPlanner
            - call: "POST /carriers/plans"
              payload: { agreement_id: "${ag_id}", plan_code: "H6", term_months: 6, intro_price_cents: 4999, renewal_price_cents: 5999, data_allotment_mb: 8000, voice_allotment_min: 1000, sms_allotment_msg: 2000 }
              as: CapacityPlanner
          trigger:
            - call: "GET /carriers/plans"
              payload: { agreement_id: "${ag_id}", limit: 2, offset: 0 }
              as: CapacityPlanner
          assert:
            - "the response status is 200 and response_type is array"
            - "the response returns exactly 2 rows and meta reports total_count == 3 and has_more == true"
            - "GET /carriers/plans?agreement_id=${ag_id}&limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /carriers/plans?agreement_id=${ag_id}&plan_status=DRAFT returns 3 rows because no plan has been offered"
            - "GET /carriers/plans with no query parameters returns 3 rows with limit defaulting to 10 and offset to 0"
            - "an agreement with no plans returns an empty Plan[] with total_count 0 and has_more false rather than a 404"

      - name: capacity_agreement_get_with_unknown_id_returns_agreement_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/carriers/capacity-agreements/{id}
          - errors.ERR_AGREEMENT_NOT_FOUND
          - validations[priority=4]
        distinguishing_aspect: "A syntactically valid but unallocated id on the path produces the entity-specific 404 ERR_AGREEMENT_NOT_FOUND rather than a generic not-found and rather than a 400."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. No agreement has been created."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /carriers/capacity-agreements/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CapacityPlanner
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and err == ERR_AGREEMENT_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"
            - "err != ERR_UNAUTHENTICATED and err != ERR_FORBIDDEN_ROLE, so the existence layer is what decided"
            - "the same id shape on GET /carriers/plans/{id} produces ERR_PLAN_NOT_FOUND instead"

      - name: capacity_agreement_create_missing_commitment_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.CapacityAgreement.fields.committed_data_mb
          - validations[priority=1]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "committed_data_mb is a required input with no default, so omitting it is a 400 ERR_INVALID_REQUEST from the required-field check and not the 409 capacity error that an undersized commitment would produce."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /carriers/capacity-agreements"
              payload: { host_network_name: "Pacific Host Network", state_code: "CA", data_rate_microcents_per_mb: 1237, voice_rate_microcents_per_min: 60, sms_rate_microcents_per_msg: 3, committed_voice_minutes: 200000, committed_sms_messages: 400000 }
              as: CapacityPlanner
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and err == ERR_INVALID_REQUEST"
            - "err != ERR_INSUFFICIENT_AGREEMENT_CAPACITY, which is the capacity rule and not a body-shape rule"
            - "err != ERR_UNAUTHENTICATED although the auth layer runs first, because the headers were well formed"
            - "GET /carriers/capacity-agreements/00000000-0000-4000-8000-000000000000 returns ERR_AGREEMENT_NOT_FOUND, confirming nothing was written"
            - "an unknown extra body field is also rejected with ERR_INVALID_REQUEST"

      - name: retail_partner_create_defaults_shipment_sla_days
        claim_type: Defaults
        grounds:
          - entities.RetailPartner.fields.shipment_sla_days
          - endpoints.POST_/carriers/retail-partners
        distinguishing_aspect: "shipment_sla_days declares a default of 2, so omitting it stores 2 rather than null, and the value is readable straight back off the partner."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /carriers/retail-partners"
              payload: { partner_name: "Corner Wireless Retail", partner_state_codes: ["CA", "NV"] }
              as: CapacityPlanner
              captures: { partner_id: $.data.id }
          assert:
            - "the response status is 201 and RetailPartner.${partner_id}.shipment_sla_days == 2"
            - "RetailPartner.${partner_id}.partner_status == ACTIVE"
            - "RetailPartner.${partner_id}.partner_state_codes == [\"CA\", \"NV\"]"
            - "creating a partner with the same partner_name is rejected with ERR_INVALID_REQUEST because the name is unique"
            - "GET /carriers/retail-partners/${partner_id} returns the defaulted value rather than null"

      - name: plan_deprioritization_threshold_is_derived_and_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.Plan.fields.deprioritization_threshold_mb
          - validations[priority=18]
          - endpoints.POST_/carriers/plans/{id}/offer
        distinguishing_aspect: "deprioritization_threshold_mb is declared computed, so a client-supplied value is ignored and the stored threshold always equals data_allotment_mb after the plan is offered."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. One active agreement."
          setup_api_calls:
            - *c_clock
            - *c_ag
            - call: "POST /carriers/capacity-agreements/${ag_id}/activate"
              payload: {}
              as: CapacityPlanner
              captures: { ag_v: $.data.version }
            - &c_plan
              call: "POST /carriers/plans"
              payload: { agreement_id: "${ag_id}", plan_code: "H3", term_months: 3, intro_price_cents: 1999, renewal_price_cents: 3042, data_allotment_mb: 3000, voice_allotment_min: 500, sms_allotment_msg: 1000 }
              as: CapacityPlanner
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /carriers/plans/${plan_id}/offer"
              payload: {}
              as: CapacityPlanner
          assert:
            - "Plan.${plan_id}.plan_status == OFFERED"
            - "Plan.${plan_id}.deprioritization_threshold_mb == 3000, equal to data_allotment_mb"
            - "Plan.${plan_id}.deprioritization_threshold_mb != 99999, so any client attempt to pin the threshold is discarded"
            - "the response payload does not let a client override the threshold field"

      - name: subscriber_activation_status_and_version_are_system_fields
        claim_type: System Fields
        grounds:
          - entities.Subscriber.fields.subscriber_status
          - entities.Subscriber
          - endpoints.POST_/carriers/subscribers
        distinguishing_aspect: "subscriber_status is system-sourced, so a client-supplied ACTIVE is ignored and the created subscriber is PENDING_PORT with version 1 and allocation_status NONE."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /carriers/subscribers"
              payload: { msisdn: "13055550001", full_name: "Mia Herrera", state_code: "CA" }
              as: CapacityPlanner
              captures: { sub_id: $.data.id }
          assert:
            - "the response status is 201 and Subscriber.${sub_id}.subscriber_status == PENDING_PORT"
            - "Subscriber.${sub_id}.allocation_status == NONE and version == 1"
            - "Subscriber.${sub_id}.cycle_index == 0, cycles_rolled == 0 and data_used_mb_cycle == 0"
            - "Subscriber.${sub_id}.deprioritized_this_cycle == false and cycle_deprioritization_days == 0"
            - "Subscriber.${sub_id}.support_seconds_used == 0 and support_seconds_budget == 600"
            - "Subscriber.${sub_id}.self_service_deflection_count == 0"
            - "id, created_at and updated_at are all present and server-minted"

      - name: plan_type_constraints_on_term_and_step_up_price
        claim_type: Type Constraints
        grounds:
          - entities.Plan.fields.term_months
          - entities.Plan.fields.renewal_price_cents
          - validations[priority=19]
          - errors.ERR_INVALID_PLAN_TERM
        distinguishing_aspect: "term_months must be one of 3, 6, 12 and renewal_price_cents must be strictly greater than intro_price_cents, so a 4-month term and an equal-to-intro renewal both produce ERR_INVALID_PLAN_TERM."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. One active agreement."
          setup_api_calls:
            - *c_clock
            - *c_ag
            - call: "POST /carriers/capacity-agreements/${ag_id}/activate"
              payload: {}
              as: CapacityPlanner
          trigger:
            - call: "POST /carriers/plans"
              payload: { agreement_id: "${ag_id}", plan_code: "BAD", term_months: 4, intro_price_cents: 1999, renewal_price_cents: 3042, data_allotment_mb: 3000, voice_allotment_min: 500, sms_allotment_msg: 1000 }
              as: CapacityPlanner
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 422 and err == ERR_INVALID_PLAN_TERM"
            - "a legal term_months of 6 with renewal_price_cents equal to intro_price_cents is also rejected with ERR_INVALID_PLAN_TERM"
            - "term_months 3 with renewal_price_cents 3042 greater than intro_price_cents 1999 is accepted"
            - "term_months 12 and term_months 1 are accepted and rejected respectively"
            - "err != ERR_INVALID_REQUEST, because these are domain constraints rather than malformed-body rules"

      - name: add_on_type_and_window_constraints
        claim_type: Type Constraints
        grounds:
          - entities.AddOn.fields.addon_days
          - entities.AddOn.fields.per_day_allotment_mb
          - validations[priority=20]
          - errors.ERR_INVALID_ADDON_WINDOW
        distinguishing_aspect: "addon_days must be one of 1, 7, 30 and per_day_allotment_mb must be 0 for INTERNATIONAL_LD and at least 1 for ROAMING, so a 14-day window and a zero-allotment roaming add-on both produce ERR_INVALID_ADDON_WINDOW."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. Activated CA subscriber on H3."
          setup_api_calls:
            - *c_clock
            - *c_ag
            - call: "POST /carriers/capacity-agreements/${ag_id}/activate"
              payload: {}
              as: CapacityPlanner
            - *c_plan
            - call: "POST /carriers/plans/${plan_id}/offer"
              payload: {}
              as: CapacityPlanner
            - &c_inv
              call: "POST /carriers/sim-inventories"
              payload: { state_code: "CA", sim_media_type: "ESIM_PROFILE", unit_count: 10 }
              as: CapacityPlanner
              captures: { inv_id: $.data.id }
            - &c_sub
              call: "POST /carriers/subscribers"
              payload: { msisdn: "13055550001", full_name: "Mia Herrera", state_code: "CA" }
              as: CapacityPlanner
              captures: { sub_id: $.data.id }
            - &c_term
              call: "POST /carriers/prepaid-terms"
              payload: { subscriber_id: "${sub_id}", plan_id: "${plan_id}", expected_CapacityAgreement_version: "${ag_v0}" }
              as: Subscriber
              as_user_id: "${sub_id}"
              captures: { term_id: $.data.id }
            - call: "POST /carriers/prepaid-terms/${term_id}/purchase"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
            - &c_act
              call: "POST /carriers/activations"
              payload: { subscriber_id: "${sub_id}", prepaid_term_id: "${term_id}", activation_channel: "DIGITAL" }
              as: Subscriber
              as_user_id: "${sub_id}"
              captures: { act_id: $.data.id }
            - call: "POST /carriers/activations/${act_id}/provision"
              payload: {}
              as: CapacityPlanner
            - call: "POST /carriers/activations/${act_id}/complete"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
          trigger:
            - call: "POST /carriers/add-ons"
              payload: { subscriber_id: "${sub_id}", addon_type: "INTERNATIONAL_LD", addon_days: 30, per_day_allotment_mb: 100 }
              as: Subscriber
              as_user_id: "${sub_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 422 and err == ERR_INVALID_ADDON_WINDOW because an INTERNATIONAL_LD add-on must carry allotment 0"
            - "a ROAMING add-on with per_day_allotment_mb 0 is also rejected with ERR_INVALID_ADDON_WINDOW"
            - "a ROAMING add-on with addon_days 14 is rejected with ERR_INVALID_ADDON_WINDOW"
            - "addon_days 1, 7 and 30 are each accepted for ROAMING with a positive allotment"
            - "an INTERNATIONAL_LD add-on with allotment 0 and addon_days 30 is accepted"
  # ===========================================================================
  - section: state_machines
    instances:

      - name: cycle_roll_on_an_already_rolled_cycle_returns_cycle_already_rolled
        claim_type: invalid_transition
        grounds:
          - state_machines.CycleRecord.OPEN_to_ROLLED
          - errors.ERR_CYCLE_ALREADY_ROLLED
          - validations[priority=7]
        distinguishing_aspect: "A cycle that is already ROLLED cannot roll again: the second run_cycle for the same subscriber rejects with 409 ERR_CYCLE_ALREADY_ROLLED and fires no side effect at all."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. Activated CA subscriber on H3 with one open cycle, already rolled once."
          setup_api_calls:
            - *c_clock
            - *c_ag
            - call: "POST /carriers/capacity-agreements/${ag_id}/activate"
              payload: {}
              as: CapacityPlanner
            - *c_plan
            - call: "POST /carriers/plans/${plan_id}/offer"
              payload: {}
              as: CapacityPlanner
            - *c_inv
            - *c_sub
            - *c_term
            - call: "POST /carriers/prepaid-terms/${term_id}/purchase"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
            - *c_act
            - call: "POST /carriers/activations/${act_id}/provision"
              payload: {}
              as: CapacityPlanner
            - call: "POST /carriers/activations/${act_id}/complete"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
            - &c_roll_once
              call: "POST /carriers/subscribers/${sub_id}/run_cycle"
              payload: {}
              as: CapacityPlanner
          trigger:
            - call: "GET /carriers/cycles"
              payload: { prepaid_term_id: "${term_id}", cycle_status: "ROLLED" }
              as: CapacityPlanner
              captures: { err: $.data.error_id }
          assert:
            - "the roll is refused: GET on the rolled set returns exactly 1 ROLLED row and the open set returns exactly 1 OPEN row"
            - "err == ERR_CYCLE_ALREADY_ROLLED is what a second roll of the same cycle row produces, per the terminal lockdown on CycleRecord"
            - "cycles_rolled == 1 and did not advance on the refused attempt"
            - "no duplicate RENEWAL_PRICING SupportCase was created by the refused attempt"
            - "no second CycleRecord row with the same cycle_index exists"

      - name: activation_complete_from_a_failed_activation_is_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Activation.REQUESTED_to_FAILED
          - state_machines.Activation.PROVISIONED_to_COMPLETED
          - errors.ERR_ACTIVATION_ALREADY_TERMINAL
        distinguishing_aspect: "Once an activation is FAILED it can never be completed, so the second terminal-state action is refused with ERR_ACTIVATION_ALREADY_TERMINAL and the subscriber stays in GRACE."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. Agreement active with offered H3 and a CA subscriber whose term is purchased and activation provisioned."
          setup_api_calls:
            - *c_clock
            - *c_ag
            - call: "POST /carriers/capacity-agreements/${ag_id}/activate"
              payload: {}
              as: CapacityPlanner
            - *c_plan
            - call: "POST /carriers/plans/${plan_id}/offer"
              payload: {}
              as: CapacityPlanner
            - *c_inv
            - *c_sub
            - *c_term
            - call: "POST /carriers/prepaid-terms/${term_id}/purchase"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
            - *c_act
            - call: "POST /carriers/activations/${act_id}/provision"
              payload: {}
              as: CapacityPlanner
            - &c_fail_act
              call: "POST /carriers/activations/${act_id}/fail"
              payload: { failure_reason: "SIM_MEDIA_FAULT" }
              as: SupportAgent
          trigger:
            - call: "POST /carriers/activations/${act_id}/complete"
              payload: {}
              as: SupportAgent
              captures: { err: $.data.error_id }
          assert:
            - "the fail call succeeded and the subscriber reports subscriber_status == GRACE and the term reports term_status == PURCHASED"
            - "the response status is 409 and err == ERR_ACTIVATION_ALREADY_TERMINAL"
            - "err != ERR_INVALID_STATE, because the terminal-state rule at priority 7 is the one that names this case"
            - "the subscriber is still in GRACE and has not become ACTIVE"
            - "SimInventory.${inv_id}.reserved_count == 0 because the failed activation withdrew its reservation"

      - name: create_subscriber_lands_in_pending_port
        claim_type: initial_state
        grounds:
          - state_machines.Subscriber.PENDING_PORT_to_ACTIVE
          - entities.Subscriber.fields.subscriber_status
        distinguishing_aspect: "A newly created subscriber always starts in PENDING_PORT and no endpoint can create one directly in ACTIVE."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /carriers/subscribers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CapacityPlanner
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_SUBSCRIBER_NOT_FOUND and the response status is 404"
            - "POST /carriers/subscribers with body subscriber_status ACTIVE is not an accepted field and produces ERR_INVALID_REQUEST"
            - "a subscriber created with valid body then reports subscriber_status == PENDING_PORT"
            - "GET /carriers/subscribers?subscriber_status=PENDING_PORT returns Subscriber[] containing the new subscriber"
            - "a subscriber created twice with the same msisdn is rejected because msisdn is unique across non-CHURNED subscribers"

      - name: prepaid_term_create_lands_in_quoted_with_zero_price
        claim_type: initial_state
        grounds:
          - state_machines.PrepaidTerm.QUOTED_to_PURCHASED
          - entities.PrepaidTerm.fields.term_status
        distinguishing_aspect: "A newly created term is QUOTED with term_price_cents 0 and deferred_revenue_cents 0, and no price is assigned until the purchase transition runs."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. Active agreement with offered H3 and one CA subscriber."
          setup_api_calls:
            - *c_clock
            - *c_ag
            - call: "POST /carriers/capacity-agreements/${ag_id}/activate"
              payload: {}
              as: CapacityPlanner
            - *c_plan
            - call: "POST /carriers/plans/${plan_id}/offer"
              payload: {}
              as: CapacityPlanner
            - *c_sub
          trigger:
            - call: "POST /carriers/prepaid-terms"
              payload: { subscriber_id: "${sub_id}", plan_id: "${plan_id}", expected_CapacityAgreement_version: "${ag_v0}" }
              as: Subscriber
              as_user_id: "${sub_id}"
              captures: { new_term_id: $.data.id }
          assert:
            - "the response status is 201 and PrepaidTerm.${new_term_id}.term_status == QUOTED"
            - "PrepaidTerm.${new_term_id}.term_price_cents == 0 and deferred_revenue_cents == 0 and earned_revenue_cents == 0"
            - "PrepaidTerm.${new_term_id}.starts_at is null and expires_at is null"
            - "PrepaidTerm.${new_term_id}.breakage_days == 0 and void_reason is null"
            - "the agreement's allocated_data_mb is still 0, so a quoted term commits nothing"

      - name: subscriber_grace_to_churned_on_cycle_roll_without_remedy
        claim_type: side_effect_execution
        grounds:
          - state_machines.Subscriber.GRACE_to_CHURNED
          - calculations.early_churn_revenue_recognition
          - state_machines.SupportCase.RESOLVED_SELF_SERVICE or RESOLVED_AGENT_to_CLOSED
        distinguishing_aspect: "Rolling a cycle while the subscriber sits in GRACE churns them, expires the term into breakage and closes open cases in one cascade."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. CA subscriber in GRACE with a PURCHASED term and one OPEN support case."
          setup_api_calls:
            - *c_clock
            - *c_ag
            - call: "POST /carriers/capacity-agreements/${ag_id}/activate"
              payload: {}
              as: CapacityPlanner
            - *c_plan
            - call: "POST /carriers/plans/${plan_id}/offer"
              payload: {}
              as: CapacityPlanner
            - *c_inv
            - *c_sub
            - *c_term
            - call: "POST /carriers/prepaid-terms/${term_id}/purchase"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
            - *c_act
            - &c_case
              call: "POST /carriers/support-cases"
              payload: { subscriber_id: "${sub_id}", topic_code: "PORT_STATUS" }
              as: SupportAgent
              captures: { case_id: $.data.id }
            - *c_fail_act
          trigger:
            - call: "POST /carriers/subscribers/${sub_id}/run_cycle"
              payload: {}
              as: CapacityPlanner
          assert:
            - "before the roll the subscriber reports subscriber_status == GRACE and the term reports term_status == PURCHASED"
            - "after the roll Subscriber.${sub_id}.subscriber_status == CHURNED"
            - "PrepaidTerm.${term_id}.term_status == EXPIRED with breakage_days == 30"
            - "SupportCase.${case_id}.case_status == CLOSED because the churn closed it"
            - "the agreement's allocated_data_mb returns to 0 and remaining_data_mb to 16000"

      - name: agreement_close_retires_every_plan
        claim_type: side_effect_execution
        grounds:
          - state_machines.CapacityAgreement.ACTIVE_to_CLOSED
          - state_machines.Plan.DRAFT, OFFERED or ACTIVE_to_RETIRED
          - errors.ERR_PLAN_RETIRED
        distinguishing_aspect: "Closing an agreement retires every plan on it in the same call, and a later purchase against a retired plan is refused with ERR_PLAN_RETIRED."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. Active agreement with two offered plans and no subscribers."
          setup_api_calls:
            - *c_clock
            - *c_ag
            - call: "POST /carriers/capacity-agreements/${ag_id}/activate"
              payload: {}
              as: CapacityPlanner
            - *c_plan
            - call: "POST /carriers/plans/${plan_id}/offer"
              payload: {}
              as: CapacityPlanner
            - call: "POST /carriers/plans"
              payload: { agreement_id: "${ag_id}", plan_code: "M3", term_months: 3, intro_price_cents: 2999, renewal_price_cents: 3850, data_allotment_mb: 15000, voice_allotment_min: 1000, sms_allotment_msg: 2000 }
              as: CapacityPlanner
              captures: { plan_m_id: $.data.id }
            - call: "POST /carriers/plans/${plan_m_id}/offer"
              payload: {}
              as: CapacityPlanner
            - &c_sub_for_close
              call: "POST /carriers/subscribers"
              payload: { msisdn: "13055550031", full_name: "Pending Buyer", state_code: "CA" }
              as: CapacityPlanner
              captures: { sub_close_id: $.data.id }
          trigger:
            - call: "POST /carriers/capacity-agreements/${ag_id}/close"
              payload: {}
              as: CapacityPlanner
          assert:
            - "the response status is 200 and CapacityAgreement.${ag_id}.agreement_status == CLOSED"
            - "Plan.${plan_id}.plan_status == RETIRED and Plan.${plan_m_id}.plan_status == RETIRED"
            - "a later POST /carriers/prepaid-terms quoting a term on the retired plan is refused with ERR_PLAN_RETIRED and status 409"
            - "err != ERR_AGREEMENT_CLOSED on the retired-plan path, because the plan rule is the more specific one"
            - "GET /carriers/capacity-agreements/${ag_id}/usage-summary still resolves and reports allocated_data_mb == 0"

      - name: subscriber_cancel_is_forbidden_for_another_subscriber
        claim_type: invalid_transition
        grounds:
          - state_machines.Subscriber.ACTIVE_to_CHURNED
          - validations[priority=3]
          - errors.ERR_NOT_RESOURCE_OWNER
        distinguishing_aspect: "A Subscriber acting on a row that is not their own is refused with 403 ERR_NOT_RESOURCE_OWNER before any state check runs."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. Two CA subscribers, the second active on H3."
          setup_api_calls:
            - *c_clock
            - *c_ag
            - call: "POST /carriers/capacity-agreements/${ag_id}/activate"
              payload: {}
              as: CapacityPlanner
            - *c_plan
            - call: "POST /carriers/plans/${plan_id}/offer"
              payload: {}
              as: CapacityPlanner
            - *c_inv
            - *c_sub
            - &c_sub_other
              call: "POST /carriers/subscribers"
              payload: { msisdn: "13055550041", full_name: "Other Holder", state_code: "CA" }
              as: CapacityPlanner
              captures: { sub_other_id: $.data.id }
            - call: "GET /carriers/subscribers/${sub_other_id}"
              payload: {}
              as: CapacityPlanner
              captures: { sub_other_v: $.data.version }
          trigger:
            - call: "POST /carriers/subscribers/${sub_other_id}/cancel"
              payload: { expected_Subscriber_version: "${sub_other_v}" }
              as: Subscriber
              as_user_id: "${sub_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 and err == ERR_NOT_RESOURCE_OWNER"
            - "err != ERR_INVALID_STATE, so the ownership gate precedes every state gate"
            - "Subscriber.${sub_other_id}.subscriber_status is unchanged after the refusal"
            - "the acting subscriber ${sub_id} is unaffected"
            - "an opaque role acting with the same X-User-ID is not subject to this check"

  # ===========================================================================
  - section: calculations
    instances:

      - name: deprioritization_quality_term_divergence_on_identical_terms
        claim_type: Variant Divergence
        grounds:
          - calculations.schedule_formula_provisional_vs_final
          - entities.CycleRecord.fields.cycle_deprioritization_days
          - endpoints.POST_/carriers/subscribers/{id}/run_cycle
        distinguishing_aspect: "Two subscribers on the same 3-month plan at the same price diverge in earned revenue purely because one rolled a cycle with 30 deprioritization days and the other with 0."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. Two activated CA subscribers on the same H3 plan; each with one open cycle."
          setup_api_calls:
            - *c_clock
            - *c_ag
            - call: "POST /carriers/capacity-agreements/${ag_id}/activate"
              payload: {}
              as: CapacityPlanner
            - *c_plan
            - call: "POST /carriers/plans/${plan_id}/offer"
              payload: {}
              as: CapacityPlanner
            - *c_inv
            - *c_sub
            - *c_term
            - call: "POST /carriers/prepaid-terms/${term_id}/purchase"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
            - *c_act
            - call: "POST /carriers/activations/${act_id}/provision"
              payload: {}
              as: CapacityPlanner
            - call: "POST /carriers/activations/${act_id}/complete"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
            - &c_sub_b
              call: "POST /carriers/subscribers"
              payload: { msisdn: "13055550051", full_name: "Second Rider", state_code: "CA" }
              as: CapacityPlanner
              captures: { sub_b_id: $.data.id }
            - &c_term_b
              call: "POST /carriers/prepaid-terms"
              payload: { subscriber_id: "${sub_b_id}", plan_id: "${plan_id}", expected_CapacityAgreement_version: "${ag_v0}" }
              as: Subscriber
              as_user_id: "${sub_b_id}"
              captures: { term_b_id: $.data.id }
            - call: "POST /carriers/prepaid-terms/${term_b_id}/purchase"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_b_id}"
            - call: "POST /carriers/activations"
              payload: { subscriber_id: "${sub_b_id}", prepaid_term_id: "${term_b_id}", activation_channel: "DIGITAL" }
              as: Subscriber
              as_user_id: "${sub_b_id}"
              captures: { act_b_id: $.data.id }
            - call: "POST /carriers/activations/${act_b_id}/provision"
              payload: {}
              as: CapacityPlanner
            - call: "POST /carriers/activations/${act_b_id}/complete"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_b_id}"
            - call: "POST /carriers/subscribers/${sub_id}/consume_data"
              payload: { data_mb: 3000 }
              as: CapacityPlanner
            - call: "POST /carriers/_clock/set_current_utc"
              payload: { current_utc: "2026-10-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers/subscribers/${sub_id}/consume_data"
              payload: { data_mb: 1 }
              as: CapacityPlanner
          trigger:
            - call: "POST /carriers/subscribers/${sub_id}/run_cycle"
              payload: {}
              as: CapacityPlanner
          assert:
            - "subscriber A's rolled cycle carries cycle_deprioritization_days == 1 and earned_cents == 677 (ceil(1999/3) + ceil(1999*3/20*1/30) == 667 + 10)"
            - "subscriber B rolls a cycle with cycle_deprioritization_days == 0 and earned_cents == 667"
            - "the two terms started at the same price 1999 yet now report different earned_revenue_cents, 677 versus 667"
            - "the divergence is exactly 10 cents on the same term_months and term_price_cents"
            - "the agreement's congestion_active is true before the threshold is crossed, so the flag alone does not deprioritize anyone"

      - name: early_churn_breakage_keeps_the_earned_revenue_identity
        claim_type: Reconciliation
        grounds:
          - calculations.early_churn_revenue_recognition
          - entities.PrepaidTerm.fields.breakage_cents_recognized
          - endpoints.POST_/carriers/subscribers/{id}/cancel
        distinguishing_aspect: "Churning a started 3-month term writes the breakage into earned revenue once and leaves deferred_revenue_cents plus earned_revenue_cents equal to term_price_cents exactly."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. Activated CA subscriber on H3 with one cycle rolled."
          setup_api_calls:
            - *c_clock
            - *c_ag
            - call: "POST /carriers/capacity-agreements/${ag_id}/activate"
              payload: {}
              as: CapacityPlanner
            - *c_plan
            - call: "POST /carriers/plans/${plan_id}/offer"
              payload: {}
              as: CapacityPlanner
            - *c_inv
            - *c_sub
            - *c_term
            - call: "POST /carriers/prepaid-terms/${term_id}/purchase"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
            - *c_act
            - call: "POST /carriers/activations/${act_id}/provision"
              payload: {}
              as: CapacityPlanner
            - call: "POST /carriers/activations/${act_id}/complete"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
            - call: "POST /carriers/subscribers/${sub_id}/run_cycle"
              payload: {}
              as: CapacityPlanner
            - call: "GET /carriers/subscribers/${sub_id}"
              payload: {}
              as: CapacityPlanner
              captures: { sub_v: $.data.version }
          trigger:
            - call: "POST /carriers/subscribers/${sub_id}/cancel"
              payload: { expected_Subscriber_version: "${sub_v}" }
              as: Subscriber
              as_user_id: "${sub_id}"
          assert:
            - "after one roll earned_revenue_cents == 667 and deferred_revenue_cents == 1332"
            - "after the churn breakage_days == 30 and breakage_cents_recognized == floor(1999 * 30 / 90) == 666"
            - "earned_revenue_cents == 1333 and deferred_revenue_cents == 666, and 1333 + 666 == 1999"
            - "the identity earned_revenue_cents + deferred_revenue_cents == term_price_cents holds after the churn"
            - "PrepaidTerm.${term_id}.term_status == EXPIRED, not REFUNDED, because the term had already started"
            - "the agreement's allocated_data_mb returns to 0 after the churn"

      - name: wholesale_allocated_data_mb_excludes_draft_and_retired_plans
        claim_type: Input Set Filtering
        grounds:
          - calculations.wholesale_allocated_data_mb
          - entities.Plan.fields.plan_status
          - endpoints.GET_/carriers/capacity-agreements/{id}/usage-summary
        distinguishing_aspect: "Only plans in OFFERED or ACTIVE contribute to allocated_data_mb, so a DRAFT plan with the same allotment adds nothing while an offered twin adds its full allotment."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. Active agreement with one offered H3 plan sold to one subscriber and one draft M3 plan with no sales."
          setup_api_calls:
            - *c_clock
            - *c_ag
            - call: "POST /carriers/capacity-agreements/${ag_id}/activate"
              payload: {}
              as: CapacityPlanner
            - *c_plan
            - call: "POST /carriers/plans/${plan_id}/offer"
              payload: {}
              as: CapacityPlanner
            - call: "POST /carriers/plans"
              payload: { agreement_id: "${ag_id}", plan_code: "M3", term_months: 3, intro_price_cents: 2999, renewal_price_cents: 3850, data_allotment_mb: 15000, voice_allotment_min: 1000, sms_allotment_msg: 2000 }
              as: CapacityPlanner
              captures: { plan_draft_id: $.data.id }
            - *c_inv
            - *c_sub
            - *c_term
            - call: "POST /carriers/prepaid-terms/${term_id}/purchase"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
          trigger:
            - call: "GET /carriers/capacity-agreements/${ag_id}/usage-summary"
              payload: {}
              as: CapacityPlanner
          assert:
            - "the response reports allocated_data_mb == 3000, the sold H3 allotment only"
            - "the DRAFT M3 plan contributes none of its 15000 megabytes"
            - "remaining_data_mb == 13000"
            - "offering the M3 plan still adds nothing while it has no sold subscriber"
            - "retiring the H3 plan while its subscriber's term is live is refused, so the plan status cannot drop out of the contributing set while capacity is held"

      - name: overage_threshold_split_boundary_on_allotment
        claim_type: Correct Result
        grounds:
          - calculations.overage_threshold_split
          - entities.Plan.fields.data_allotment_mb
        distinguishing_aspect: "Usage below the allotment yields zero overage and usage one megabyte above yields exactly one megabyte of overage, with equality on the allotment yielding zero."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. Activated CA subscriber on H3 with allotment 3000 and zero usage."
          setup_api_calls:
            - *c_clock
            - *c_ag
            - call: "POST /carriers/capacity-agreements/${ag_id}/activate"
              payload: {}
              as: CapacityPlanner
            - *c_plan
            - call: "POST /carriers/plans/${plan_id}/offer"
              payload: {}
              as: CapacityPlanner
            - *c_inv
            - *c_sub
            - *c_term
            - call: "POST /carriers/prepaid-terms/${term_id}/purchase"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
            - *c_act
            - call: "POST /carriers/activations/${act_id}/provision"
              payload: {}
              as: CapacityPlanner
            - call: "POST /carriers/activations/${act_id}/complete"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
          trigger:
            - call: "POST /carriers/subscribers/${sub_id}/consume_data"
              payload: { data_mb: 3000 }
              as: CapacityPlanner
          assert:
            - "at 3000 megabytes consumed the subscriber's data_used_mb_cycle == 3000 and overage is 0"
            - "one more megabyte gives data_used_mb_cycle == 3001 and overage 1"
            - "the boundary is inclusive on the allotment side, so equality produces no overage"
            - "the prepaid subscriber is never billed for the overage; it is only recorded for the agreement's as-incurred variant"
            - "the deduction is that 3000 consumed against a 3000 allotment still yields 0 overage megabytes"

      - name: roaming_rate_card_tier_ladder
        claim_type: Constants Applied
        grounds:
          - calculations.roaming_rate_card
          - entities.AddOn.fields.addon_price_cents
          - endpoints.POST_/carriers/add-ons/{id}/activate
        distinguishing_aspect: "The tier ladder resolves 900 cents for 30 days, 273 for 7 days and 39 for 1 day, with ceil applied at each short-term step."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. Activated CA subscriber on H3."
          setup_api_calls:
            - *c_clock
            - *c_ag
            - call: "POST /carriers/capacity-agreements/${ag_id}/activate"
              payload: {}
              as: CapacityPlanner
            - *c_plan
            - call: "POST /carriers/plans/${plan_id}/offer"
              payload: {}
              as: CapacityPlanner
            - *c_inv
            - *c_sub
            - *c_term
            - call: "POST /carriers/prepaid-terms/${term_id}/purchase"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
            - *c_act
            - call: "POST /carriers/activations/${act_id}/provision"
              payload: {}
              as: CapacityPlanner
            - call: "POST /carriers/activations/${act_id}/complete"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
            - &c_addon_30
              call: "POST /carriers/add-ons"
              payload: { subscriber_id: "${sub_id}", addon_type: "ROAMING", addon_days: 30, per_day_allotment_mb: 1000 }
              as: Subscriber
              as_user_id: "${sub_id}"
              captures: { addon_30_id: $.data.id }
          trigger:
            - call: "POST /carriers/add-ons/${addon_30_id}/activate"
              payload: {}
              as: CapacityPlanner
          assert:
            - "the 30-day add-on activates with addon_price_cents == 900"
            - "a 7-day roaming add-on activates with addon_price_cents == 273, which is ceil(30 * 7 * 13 / 10)"
            - "a 1-day roaming add-on activates with addon_price_cents == 39, which is ceil(30 * 1 * 13 / 10)"
            - "an INTERNATIONAL_LD add-on with allotment 0 activates with addon_price_cents == 500"
            - "the base day rate is round_half_up(900/30) == 30 and is applied before the short-term multiplier"

      - name: support_outsourcing_budget_accounting
        claim_type: Correct Result
        grounds:
          - calculations.support_outsourcing_budget
          - calculations.support_case_topic_window
          - entities.Subscriber.fields.support_seconds_used
        distinguishing_aspect: "Assignments, escalations and agent resolutions each book their own seconds into support_seconds_used while a self-service resolution books nothing, and the budget refills by the granted seconds."
