scaffold_difficulty_design:

  # =====================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: reserve_adequacy_straight_line_vs_component_flips_association_posture
        grounds:
          - calculations.reserve_adequacy
          - entities.CommonElement.fields.effective_age_years
          - entities.CommonElement.fields.useful_life_years
          - entities.Association.fields.reserve_adequacy_threshold_bp
          - entities.Association.fields.reserve_balance_cents
        distinguishing_aspect: |
          This dual variant lives on the Association/CommonElement reserve-funding domain:
          the SAME component roster and the SAME reserve_balance_cents report
          percent_funded_bp 6976 / DEFICIENT under STRAIGHT_LINE_METHOD and 7200 / ADEQUATE
          under COMPONENT_METHOD, because a component with 45 years of remaining life
          contributes 600000 to the straight-line fully-funded basis but exactly 0 to the
          30-year component-method basis.
        test_recipe:
          setup:
            - "One Association with default reserve_adequacy_threshold_bp 7000 and reserve_balance_cents raised to 6000000, reserve_designated_cents 0 (no APPROVED SpecialAssessment exists)."
            - "Two non-DECOMMISSIONED CommonElements: a ROOF (replacement_cost_cents 10000000, useful_life_years 25, effective_age_years 20 -> remaining life 5) and a LANDSCAPE (replacement_cost_cents 6000000, useful_life_years 50, effective_age_years 5 -> remaining life 45)."
            - "No work orders, no claims, no budgets — nothing else can move the reserve figures."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CommunityManager
            - call: "POST /associations"
              payload: { legal_name: "Lakeshore Terrace Condominium Association" }
              as: CommunityManager
              captures: { assoc_id: "$.data.id" }
            - call: "POST /associations/${assoc_id}/common-elements"
              payload: { name: "Main Roof", element_class: "ROOF", replacement_cost_cents: 10000000, useful_life_years: 25, effective_age_years: 20 }
              as: CommunityManager
              captures: { el_roof: "$.data.id" }
            - call: "POST /associations/${assoc_id}/common-elements"
              payload: { name: "Courtyard Landscape", element_class: "LANDSCAPE", replacement_cost_cents: 6000000, useful_life_years: 50, effective_age_years: 5 }
              as: CommunityManager
              captures: { el_land: "$.data.id" }
            - call: "PATCH /associations/${assoc_id}"
              payload: { reserve_balance_cents: 6000000 }
              as: CommunityManager
          trigger:
            - call: "GET /associations/${assoc_id}/reserve-adequacy"
              payload: { method: "STRAIGHT_LINE" }
              as: CommunityManager
              captures: { sl_bp: "$.data.percent_funded_bp", sl_posture: "$.data.posture" }
            - call: "GET /associations/${assoc_id}/reserve-adequacy"
              payload: { method: "COMPONENT" }
              as: CommunityManager
              captures: { cp_bp: "$.data.percent_funded_bp", cp_posture: "$.data.posture" }
          assert:
            - "STRAIGHT_LINE response data.fully_funded_cents == 8600000 (8000000 from the roof + 600000 from the landscape, each round_half_up per component then summed)"
            - "STRAIGHT_LINE response data.spendable_cents == 6000000"
            - "STRAIGHT_LINE response data.percent_funded_bp == 6976 (floor(6000000 * 10000 / 8600000))"
            - "STRAIGHT_LINE response data.posture == DEFICIENT"
            - "COMPONENT response data.fully_funded_cents == 8333333 (8333333 from the roof + 0 from the landscape whose remaining life 45 exceeds HORIZON_YEARS 30)"
            - "COMPONENT response data.percent_funded_bp == 7200 (floor(6000000 * 10000 / 8333333))"
            - "COMPONENT response data.posture == ADEQUATE"
            - "${sl_bp} != ${cp_bp} and ${sl_posture} != ${cp_posture} on identical stored state — neither GET persisted anything, so Association.version is unchanged by both calls"

      - name: resale_payoff_ledger_balance_vs_estimated_payoff_on_twin_units
        grounds:
          - calculations.resale_payoff
          - entities.ResaleCertificate.fields.payoff_basis
          - entities.ResaleCertificate.fields.proration_credit_cents
          - entities.ResaleCertificate.fields.projected_payoff_cents
          - state_machines.ResaleCertificate.REQUESTED_to_ISSUED
        distinguishing_aspect: |
          This dual variant lives on the ResaleCertificate payoff-quoting domain (a different
          entity domain from the Association reserve report): two certificates issued on the
          same logical clock against two units with identical monthly_assessment_cents 550000
          and identical ledgers report projected_payoff_cents 35000 under LEDGER_BALANCE and
          713333 under ESTIMATED_PAYOFF, with proration_credit_cents 0 versus 421667.
        test_recipe:
          setup:
            - "Association with default resale_cert_fee_cents 35000, certificate_validity_days 30, budget_notice_days 30, board_quorum_seats 3."
            - "Three seated board members (two DIRECTORs and one TREASURER) plus two ordinary owners; two Units of 5000 interest_bp each, so total_interest_bp == 10000."
            - "Budget FY2026 with operating_total_cents 12000000 and reserve_contribution_cents 1200000 is ADOPTED, so monthly_assessable_cents == 1100000 and each Unit.monthly_assessment_cents == 550000."
            - "Logical clock at 2026-09-15T00:00:00Z; both unit ledgers empty; closing_date 2026-11-08T00:00:00Z for both certificates."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CommunityManager
            - call: "POST /associations"
              payload: { legal_name: "Harborview Condominium Association" }
              as: CommunityManager
              captures: { assoc_id: "$.data.id" }
            - call: "POST /associations/${assoc_id}/owners"
              payload: { full_name: "Dana Reyes", email: "dana@hv.test", board_role: "PRESIDENT", is_seated: true }
              as: CommunityManager
              captures: { d1: "$.data.id" }
            - call: "POST /associations/${assoc_id}/owners"
              payload: { full_name: "Elliot Shaw", email: "elliot@hv.test", board_role: "DIRECTOR", is_seated: true }
              as: CommunityManager
              captures: { d2: "$.data.id" }
            - call: "POST /associations/${assoc_id}/owners"
              payload: { full_name: "Priya Nandan", email: "priya@hv.test", board_role: "TREASURER", is_seated: true }
              as: CommunityManager
              captures: { tr: "$.data.id" }
            - call: "POST /associations/${assoc_id}/owners"
              payload: { full_name: "Owner One", email: "o1@hv.test", board_role: "NONE", is_seated: false }
              as: CommunityManager
              captures: { o1: "$.data.id" }
            - call: "POST /associations/${assoc_id}/owners"
              payload: { full_name: "Owner Two", email: "o2@hv.test", board_role: "NONE", is_seated: false }
              as: CommunityManager
              captures: { o2: "$.data.id" }
            - call: "POST /associations/${assoc_id}/units"
              payload: { current_owner_id: "${o1}", unit_label: "101", interest_bp: 5000, heated_sqft: 1200 }
              as: CommunityManager
              captures: { u1: "$.data.id" }
            - call: "POST /associations/${assoc_id}/units"
              payload: { current_owner_id: "${o2}", unit_label: "102", interest_bp: 5000, heated_sqft: 1200 }
              as: CommunityManager
              captures: { u2: "$.data.id" }
            - call: "POST /associations/${assoc_id}/board-meetings"
              payload: { scheduled_start: "2026-09-05T18:00:00Z", scheduled_end: "2026-09-05T21:00:00Z", agenda_kinds: ["BUDGET_RATIFICATION"] }
              as: CommunityManager
              captures: { mtg1: "$.data.id" }
            - call: "GET /associations/${assoc_id}"
              as: CommunityManager
              captures: { assoc_v1: "$.data.version" }
            - call: "POST /associations/${assoc_id}/budgets"
              payload: { fiscal_year: 2026, operating_total_cents: 12000000, reserve_contribution_cents: 1200000, ratification_meeting_id: "${mtg1}", expected_association_version: "${assoc_v1}" }
              as: CommunityManager
              captures: { bud1: "$.data.id" }
            - call: "POST /budgets/${bud1}/propose"
              payload: { ratification_meeting_id: "${mtg1}" }
              as: CommunityManager
            - call: "POST /budgets/${bud1}/send-notice"
              payload: {}
              as: CommunityManager
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T18:00:00Z" }
              as: CommunityManager
            - call: "POST /board-meetings/${mtg1}/convene"
              payload: { attending_owner_ids: ["${d1}", "${d2}", "${tr}"] }
              as: CommunityManager
            - call: "POST /budgets/${bud1}/ratify"
              payload: {}
              as: BoardDirector
              as_user_id: "${d1}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: CommunityManager
            - call: "GET /units/${u1}"
              as: CommunityManager
              captures: { u1_v: "$.data.version" }
            - call: "GET /units/${u2}"
              as: CommunityManager
              captures: { u2_v: "$.data.version" }
            - call: "POST /units/${u1}/resale-certificates"
              payload: { closing_date: "2026-11-08T00:00:00Z", payoff_basis: "LEDGER_BALANCE", requesting_agent_id: "TA-DUAL-A", expected_unit_version: "${u1_v}" }
              as: TitleAgent
              captures: { cert_a: "$.data.id" }
            - call: "POST /units/${u2}/resale-certificates"
              payload: { closing_date: "2026-11-08T00:00:00Z", payoff_basis: "ESTIMATED_PAYOFF", requesting_agent_id: "TA-DUAL-B", expected_unit_version: "${u2_v}" }
              as: TitleAgent
              captures: { cert_b: "$.data.id" }
          trigger:
            - call: "POST /resale-certificates/${cert_a}/issue"
              payload: {}
              as: CommunityManager
              captures: { pay_a: "$.data.projected_payoff_cents" }
            - call: "POST /resale-certificates/${cert_b}/issue"
              payload: {}
              as: CommunityManager
              captures: { pay_b: "$.data.projected_payoff_cents" }
          assert:
            - "Budget.${bud1}.monthly_assessable_cents == 1100000 and Budget.${bud1}.status == ADOPTED"
            - "Unit.${u1}.monthly_assessment_cents == 550000 and Unit.${u2}.monthly_assessment_cents == 550000"
            - "ResaleCertificate.${cert_a}.ledger_balance_cents == 35000 (the RESALE_FEE posts before the payoff is computed)"
            - "ResaleCertificate.${cert_a}.proration_credit_cents == 0"
            - "ResaleCertificate.${cert_a}.projected_payoff_cents == 35000"
            - "ResaleCertificate.${cert_b}.ledger_balance_cents == 35000"
            - "ResaleCertificate.${cert_b}.proration_credit_cents == 421667 (round_half_up(550000 * 23 / 30); November 2026 has 30 days, seller_days == 7 on the half-open [2026-11-01, 2026-11-08) interval, buyer_days == 23)"
            - "ResaleCertificate.${cert_b}.projected_payoff_cents == 713333 (35000 + 2 * 550000 + 0 unbilled special assessments - 421667; future_periods == 2 for 2026-10-01 and 2026-11-01)"
            - "${pay_b} - ${pay_a} == 678333 — identical ledgers and identical monthly assessments yield different payoffs purely from payoff_basis"
            - "ResaleCertificate.${cert_a}.expires_at == 2026-10-15T00:00:00Z and Unit.${u1}.transfer_blocked == false"

  # =====================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: assessment_allocation_round_per_line_then_negative_drift_cycle_mode_b
        grounds:
          - calculations.assessment_allocation
          - state_machines.Budget.NOTICED_to_ADOPTED
          - entities.Budget.fields.allocation_snapshot
          - entities.Budget.fields.monthly_assessable_cents
          - entities.BillingRun.fields.remainder_cents_allocated
        distinguishing_aspect: |
          MODE (b) — nested rounding where the order matters: with pool_cents 900002 split
          across four Units of exactly 2500 interest_bp, round_half_up PER LINE ITEM yields
          225001 four times (900004, two cents ABOVE the pinned pool), so the drift is
          NEGATIVE and one cent is removed from the first two participants in the pinned
          order (interest_bp DESC, then created_at ASC) — final shares 225000, 225000,
          225001, 225001. "Sum then round" (900002 with four equal 225000.5 shares) is the
          wrong order and cannot produce this asymmetric split.
        test_recipe:
          setup:
            - "Association with default reserve_contribution_min_bp 1000, board_quorum_seats 3, budget_notice_days 30."
            - "Four Units created in label order 201, 202, 203, 204, each with interest_bp exactly 2500 (total_interest_bp == 10000) and heated_sqft 1000."
            - "Budget FY2026 with operating_total_cents 9800024 and reserve_contribution_cents 1000000 -> assessment_total_cents 10800024 and monthly_assessable_cents round_half_up(10800024/12) == 900002."
            - "Ratification meeting noticed 35 days ahead, convened with three seated directors, no owner ballots cast so no_weight_bp == 0 and the budget adopts."
            - "After adoption a BillingRun for period 2026-10 posts the snapshot to the ledgers."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CommunityManager
            - call: "POST /associations"
              payload: { legal_name: "Quarterdeck Condominium Association" }
              as: CommunityManager
              captures: { assoc_id: "$.data.id" }
            - call: "POST /associations/${assoc_id}/owners"
              payload: { full_name: "Dana Reyes", email: "dana@qd.test", board_role: "PRESIDENT", is_seated: true }
              as: CommunityManager
              captures: { d1: "$.data.id" }
            - call: "POST /associations/${assoc_id}/owners"
              payload: { full_name: "Elliot Shaw", email: "elliot@qd.test", board_role: "DIRECTOR", is_seated: true }
              as: CommunityManager
              captures: { d2: "$.data.id" }
            - call: "POST /associations/${assoc_id}/owners"
              payload: { full_name: "Priya Nandan", email: "priya@qd.test", board_role: "TREASURER", is_seated: true }
              as: CommunityManager
              captures: { tr: "$.data.id" }
            - call: "POST /associations/${assoc_id}/owners"
              payload: { full_name: "Owner Alpha", email: "oa@qd.test", board_role: "NONE", is_seated: false }
              as: CommunityManager
              captures: { oa: "$.data.id" }
            - call: "POST /associations/${assoc_id}/units"
              payload: { current_owner_id: "${oa}", unit_label: "201", interest_bp: 2500, heated_sqft: 1000 }
              as: CommunityManager
              captures: { u1: "$.data.id" }
            - call: "POST /associations/${assoc_id}/units"
              payload: { current_owner_id: "${oa}", unit_label: "202", interest_bp: 2500, heated_sqft: 1000 }
              as: CommunityManager
              captures: { u2: "$.data.id" }
            - call: "POST /associations/${assoc_id}/units"
              payload: { current_owner_id: "${oa}", unit_label: "203", interest_bp: 2500, heated_sqft: 1000 }
              as: CommunityManager
              captures: { u3: "$.data.id" }
            - call: "POST /associations/${assoc_id}/units"
              payload: { current_owner_id: "${oa}", unit_label: "204", interest_bp: 2500, heated_sqft: 1000 }
              as: CommunityManager
              captures: { u4: "$.data.id" }
            - call: "POST /associations/${assoc_id}/board-meetings"
              payload: { scheduled_start: "2026-09-05T18:00:00Z", scheduled_end: "2026-09-05T21:00:00Z", agenda_kinds: ["BUDGET_RATIFICATION"] }
              as: CommunityManager
              captures: { mtg1: "$.data.id" }
            - call: "GET /associations/${assoc_id}"
              as: CommunityManager
              captures: { assoc_v1: "$.data.version" }
            - call: "POST /associations/${assoc_id}/budgets"
              payload: { fiscal_year: 2026, operating_total_cents: 9800024, reserve_contribution_cents: 1000000, ratification_meeting_id: "${mtg1}", expected_association_version: "${assoc_v1}" }
              as: CommunityManager
              captures: { bud1: "$.data.id" }
            - call: "POST /budgets/${bud1}/propose"
              payload: { ratification_meeting_id: "${mtg1}" }
              as: CommunityManager
            - call: "POST /budgets/${bud1}/send-notice"
              payload: {}
              as: CommunityManager
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T18:00:00Z" }
              as: CommunityManager
            - call: "POST /board-meetings/${mtg1}/convene"
              payload: { attending_owner_ids: ["${d1}", "${d2}", "${tr}"] }
              as: CommunityManager
          trigger:
            - call: "POST /budgets/${bud1}/ratify"
              payload: {}
              as: BoardDirector
              as_user_id: "${d1}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: CommunityManager
            - call: "POST /associations/${assoc_id}/billing-runs"
              payload: { source_budget_id: "${bud1}", period: "2026-10", due_on: "2026-10-10T00:00:00Z" }
              as: CommunityManager
              captures: { run1: "$.data.id" }
          assert:
            - "Budget.${bud1}.assessment_total_cents == 10800024"
            - "Budget.${bud1}.monthly_assessable_cents == 900002"
            - "Unit.${u1}.monthly_assessment_cents == 225000"
            - "Unit.${u2}.monthly_assessment_cents == 225000"
            - "Unit.${u3}.monthly_assessment_cents == 225001"
            - "Unit.${u4}.monthly_assessment_cents == 225001"
            - "sum of Unit.monthly_assessment_cents over the four units == 900002 exactly (equal to Budget.monthly_assessable_cents, the STEP 5 post-condition)"
            - "Budget.${bud1}.allocation_snapshot has 4 rows; the rows for ${u1} and ${u2} carry remainder_cent_awarded == true and the rows for ${u3} and ${u4} carry remainder_cent_awarded == false"
            - "BillingRun.${run1}.assessment_charged_cents == 900002"
            - "BillingRun.${run1}.remainder_cents_allocated == 2 (abs(900002 - 900004))"
            - "BillingRun.${run1}.charged_unit_count == 4 and late_fees_charged_cents == 0"
            - "the ASSESSMENT LedgerEntry posted to ${u1} has amount_cents == 225000 and the one posted to ${u4} has amount_cents == 225001"

      - name: deductible_waterfall_tier_basis_pinned_to_gross_damage_mode_c
        grounds:
          - calculations.deductible_waterfall
          - state_machines.InsuranceClaim.UNDER_REVIEW_to_ADJUSTED_SPLIT
          - entities.InsuranceClaim.fields.deductible_allocation
          - entities.Association.fields.association_deductible_cap_cents
          - entities.Unit.fields.heated_sqft
        distinguishing_aspect: |
          MODE (c) — circular-looking dependency with a pinned evaluation order: the tier that
          selects assoc_share_bp is keyed on a basis that LOOKS like it should include the
          owner exposure the waterfall itself produces. With gross_damage_cents 4800000,
          master_policy_deductible_cents 3000000 and association_deductible_cap_cents 2500000,
          the pinned order (basis = gross_damage_cents only) gives assoc_share_bp 10000 ->
          association_absorbed_cents 2500000 and owner_chargeback_cents 500000; feeding the
          produced owner exposure back into step 1 would give basis 5300000 -> 6000 bp ->
          1800000 / 1200000, so the two readings are numerically distinguishable to the cent.
        test_recipe:
          setup:
            - "Association created with master_policy_deductible_cents 3000000 and association_deductible_cap_cents 2500000; operating_cash_cents raised to 10000000 so the absorbed slice can be debited."
            - "Three Units with heated_sqft 1500, 1100 and 700 (total 3300) and interest_bp 4000/3500/2500, plus one FACADE CommonElement."
            - "One WATER InsuranceClaim with gross_damage_cents 4800000 and within_unit_boundary_cents 400000 (so common_element_damage_cents 4400000), affected_unit_ids listing all three units in a non-sqft order to prove the calculation re-sorts them."
            - "Claim already UNDER_REVIEW via assign-adjuster."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CommunityManager
            - call: "POST /associations"
              payload: { legal_name: "Beacon Row Condominium Association", master_policy_deductible_cents: 3000000, association_deductible_cap_cents: 2500000 }
              as: CommunityManager
              captures: { assoc_id: "$.data.id" }
            - call: "PATCH /associations/${assoc_id}"
              payload: { operating_cash_cents: 10000000 }
              as: CommunityManager
            - call: "POST /associations/${assoc_id}/owners"
              payload: { full_name: "Owner Alpha", email: "oa@br.test", board_role: "NONE", is_seated: false }
              as: CommunityManager
              captures: { oa: "$.data.id" }
            - call: "POST /associations/${assoc_id}/units"
              payload: { current_owner_id: "${oa}", unit_label: "301", interest_bp: 4000, heated_sqft: 1500 }
              as: CommunityManager
              captures: { u_big: "$.data.id" }
            - call: "POST /associations/${assoc_id}/units"
              payload: { current_owner_id: "${oa}", unit_label: "302", interest_bp: 3500, heated_sqft: 1100 }
              as: CommunityManager
              captures: { u_mid: "$.data.id" }
            - call: "POST /associations/${assoc_id}/units"
              payload: { current_owner_id: "${oa}", unit_label: "303", interest_bp: 2500, heated_sqft: 700 }
              as: CommunityManager
              captures: { u_small: "$.data.id" }
            - call: "POST /associations/${assoc_id}/common-elements"
              payload: { name: "South Facade", element_class: "FACADE", replacement_cost_cents: 8000000, useful_life_years: 40, effective_age_years: 12 }
              as: CommunityManager
              captures: { el1: "$.data.id" }
            - call: "POST /insurance-claims"
              payload: { association_id: "${assoc_id}", loss_type: "WATER", loss_at: "2026-07-20T00:00:00Z", gross_damage_cents: 4800000, within_unit_boundary_cents: 400000, unit_id: "${u_big}", element_id: "${el1}", affected_unit_ids: ["${u_small}", "${u_big}", "${u_mid}"] }
              as: CommunityManager
              captures: { claim1: "$.data.id" }
            - call: "POST /insurance-claims/${claim1}/assign-adjuster"
              payload: {}
              as: InsuranceAdjuster
          trigger:
            - call: "POST /insurance-claims/${claim1}/adjust"
              payload: { responsibility: "SPLIT" }
              as: InsuranceAdjuster
          assert:
            - "InsuranceClaim.${claim1}.adjustment_status == ADJUSTED_SPLIT"
            - "InsuranceClaim.${claim1}.common_element_damage_cents == 4400000"
            - "InsuranceClaim.${claim1}.association_absorbed_cents == 2500000 (min(round_half_up(3000000 * 10000 / 10000), 2500000)) — NOT 1800000"
            - "InsuranceClaim.${claim1}.owner_chargeback_cents == 500000 — NOT 1200000"
            - "InsuranceClaim.${claim1}.deductible_allocation has exactly 3 rows ordered heated_sqft DESC: [${u_big} 1500, ${u_mid} 1100, ${u_small} 700] regardless of the affected_unit_ids input order"
            - "deductible_allocation[0].allocated_cents == 227273 (floor(500000*1500/3300) == 227272 plus one drift cent)"
            - "deductible_allocation[1].allocated_cents == 166667 (floor(500000*1100/3300) == 166666 plus one drift cent)"
            - "deductible_allocation[2].allocated_cents == 106060 (floor(500000*700/3300), no drift cent)"
            - "sum of allocated_cents == 500000 exactly, equal to residue == master_policy_deductible_cents - association_absorbed_cents"
            - "one INSURANCE_DEDUCTIBLE_CHARGEBACK LedgerEntry per allocation row, posted in allocation order, each with bucket == ASSESSMENT"
            - "Unit.${u_big}.balance_due_cents == 227273, Unit.${u_mid}.balance_due_cents == 166667, Unit.${u_small}.balance_due_cents == 106060"
            - "Association.${assoc_id}.operating_cash_cents == 7500000 (10000000 - 2500000)"

  # =====================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: budget_revision_cycle_draft_proposed_noticed_rejected_draft_then_adopts
        grounds:
          - state_machines.Budget.NOTICED_to_REJECTED
          - state_machines.Budget.REJECTED_to_DRAFT
          - state_machines.Budget.DRAFT_to_PROPOSED
          - state_machines.Budget.NOTICED_to_ADOPTED
          - calculations.budget_ratification_tally
          - entities.Budget.fields.revision_round
        distinguishing_aspect: |
          CYCLE shape on Budget: the same Budget row traverses
