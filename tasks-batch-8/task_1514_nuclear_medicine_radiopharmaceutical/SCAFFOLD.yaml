# =============================================================================
# Task 1514 — Nuclear Medicine & Radiopharmaceutical Management
# Difficulty directive: BEYOND Expert band (depth of coupling over CRUD breadth)
# =============================================================================

scenario: |
  Nuclear Medicine & Radiopharmaceutical Management (hospital nuclear medicine): dose ordering by half-life & delivery window, patient scheduling around isotope arrival, dose calibration/assay & administration record, radiation safety survey & waste decay storage, license condition compliance & authorized user list, patient release instruction & dose limit, spill/contamination incident response, supply disruption contingency

domain_name: nuclear-medicine-radiopharmaceutical
api_prefix: /nuclear-medicine

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Temporal windowing"
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: flat            # peer entities linked by foreign keys; no URL nesting
  state_machine_shape: cyclic      # dominant shape; SpillIncident/DoseOrder/DoseVial carry revision loops, ImagingRoom is posture-driven, DoseOrder restoration is compound
  relationship_patterns:
    - one_to_many
    - self_referential             # DoseOrder.replaces_order_id (supply-disruption substitution chain)
    - cross_aggregate              # vials bind orders to deliveries; surveys gate containers and spills
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table (14 entities)
# =============================================================================
entities:
  - name: IsotopeProduct
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Isotope/tracer name, e.g. 'F-18 FDG'" }
      - { name: half_life_minutes, type: number, source: input, description: "Physical half-life in minutes; must be > 0 (ERR_VALIDATION)" }
      - { name: decay_constant_per_minute, type: number, source: computed, description: "= ln(2)/half_life_minutes, 6 decimals round_half_up" }
      - { name: spill_major_threshold_mbq, type: number, source: input, description: "Estimated spill activity >= this value classifies the spill MAJOR (inclusive boundary)" }
      - { name: release_activity_limit_mbq, type: number, source: input, description: "Administered activity at or below this value passes ACTIVITY_BASED release (inclusive)" }
      - { name: min_usable_activity_mbq, type: number, source: input, description: "Assayed activity below this value is clinically unusable" }

  - name: RadiopharmacyLicense
    parent: null
    common_fields: true
    fields:
      - { name: license_number, type: string, source: input, description: "Regulatory license number; unique (ERR_DUPLICATE_LICENSE_NUMBER)" }
      - { name: max_possession_mbq, type: number, source: input, description: "Aggregate possession limit across the whole license" }
      - { name: isotope_conditions, type: array, source: input, description: "Array of {isotope_product_id, max_possession_mbq, allowed_use} condition objects; allowed_use in DIAGNOSTIC|THERAPEUTIC|BOTH" }
      - { name: expires_at, type: datetime, source: input, description: "License expiry instant (exclusive): operations require current_utc < expires_at" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED (posture gates ordering, receiving, preparation, administration)" }
      - { name: current_possession_mbq, type: number, source: computed, description: "Live possession total per calculation current_possession_mbq" }

  - name: AuthorizedUser
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Physician name on the license's authorized-user list" }
      - { name: license_id, type: string, source: input, description: "FK -> RadiopharmacyLicense.id; license this user is authorized under" }
      - { name: scope, type: enum, source: input, description: "DIAGNOSTIC | THERAPEUTIC | BOTH" }
      - { name: expires_at, type: datetime, source: input, description: "Authorization expiry (exclusive)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED (cascaded from license suspension)" }

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Patient name" }
      - { name: weight_kg, type: number, source: input, description: "Patient weight in kg, > 0" }
      - { name: date_of_birth, type: string, source: input, required: false, description: "Optional ISO date" }

  - name: ImagingRoom
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Room name (hot lab, camera room, injection room)" }
      - { name: cleanup_buffer_minutes, type: integer, source: input, default: 15, description: "Turnover buffer appended to every booking for overlap checks" }
      - { name: status, type: enum, source: system, description: "OPERATIONAL | CONTAMINATED — posture derived from open SpillIncidents; gates appointment booking" }

  - name: IsotopeDelivery
    parent: null
    common_fields: true
    fields:
      - { name: isotope_product_id, type: string, source: input, description: "FK -> IsotopeProduct.id; isotope being delivered" }
      - { name: scheduled_arrival_at, type: datetime, source: input, description: "Scheduled arrival instant; drives hot-lab capacity window [arrival-30min, arrival+30min)" }
      - { name: reference_activity_mbq, type: number, source: input, description: "Supplier-assayed activity at reference_time_at" }
      - { name: reference_time_at, type: datetime, source: input, description: "Instant the reference activity refers to" }
      - { name: received_at, type: datetime, source: system, description: "Actual receipt instant (= current_utc at receive); null until RECEIVED" }
      - { name: measured_activity_mbq, type: number, source: input, description: "Activity measured on receipt; must be within +/-10% of reference decayed to received_at" }
      - { name: failure_reason, type: string, source: input, required: false, description: "Supplier failure reason when marked failed" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | RECEIVED | FAILED" }

  - name: DoseOrder
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; patient receiving the dose" }
      - { name: isotope_product_id, type: string, source: input, description: "FK -> IsotopeProduct.id; prescribed isotope" }
      - { name: authorized_user_id, type: string, source: system, description: "FK -> AuthorizedUser.id; prescribing authorized user (= X-User-ID of creator)" }
      - { name: use_type, type: enum, source: input, description: "DIAGNOSTIC | THERAPEUTIC" }
      - { name: prescribed_activity_mbq, type: number, source: input, description: "Target activity at the scheduled administration instant" }
      - { name: administration_scheduled_at, type: datetime, source: input, description: "Planned administration instant; must be > current_utc at creation" }
      - { name: expires_at, type: datetime, source: computed, description: "= administration_scheduled_at + 2 * half_life_minutes; sweep expires stale orders" }
      - { name: hold_reason, type: enum, source: system, description: "null | LICENSE_SUSPENDED | SPILL_CONTAMINATION; set when ON_HOLD" }
      - { name: hold_previous_status, type: enum, source: system, description: "Status (ORDERED|DOSE_PREPARED) the order returns to when the hold clears" }
      - { name: replaces_order_id, type: string, source: system, description: "FK -> DoseOrder.id; set on the substitute order created by a substitution (self-referential supply-disruption chain)" }
      - { name: superseded_by_order_id, type: string, source: system, description: "Server-set id of the replacing order once this order is SUPERSEDED" }
      - { name: status, type: enum, source: system, description: "ORDERED | DOSE_PREPARED | ON_HOLD | ADMINISTERED | CANCELLED | SUPERSEDED | EXPIRED" }

  - name: DoseVial
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> DoseOrder.id; order this vial is prepared for" }
      - { name: delivery_id, type: string, source: input, description: "FK -> IsotopeDelivery.id; delivery the activity is drawn from" }
      - { name: waste_container_id, type: string, source: input, description: "FK -> WasteContainer.id; container receiving the residual at disposal; null until disposed" }
      - { name: prepared_at, type: datetime, source: system, description: "= current_utc at vial creation" }
      - { name: required_activity_mbq, type: number, source: computed, description: "Activity that must be drawn at prepared_at per required_activity_at_preparation" }
      - { name: measured_activity_mbq, type: number, source: input, description: "Dose-calibrator assay recorded at calibration" }
      - { name: calibrated_at, type: datetime, source: system, description: "= current_utc at calibration" }
      - { name: calibrated_by_user_id, type: string, source: system, description: "X-User-ID of the calibrating radiopharmacist (segregation-of-duties anchor)" }
      - { name: status, type: enum, source: system, description: "PREPARED | CALIBRATED | QUARANTINED | DECAYED | ADMINISTERED | DISPOSED" }
      - { name: disposed_at, type: datetime, source: system, description: "= current_utc at disposal" }
      - { name: residual_activity_mbq, type: number, source: computed, description: "Activity routed to waste at disposal (see compensating invariant vial_activity_balance)" }
      - { name: decay_loss_mbq, type: number, source: computed, description: "Activity lost to physical decay between calibration and disposal" }

  - name: DoseAdministration
    parent: null
    common_fields: false
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> DoseOrder.id; administered order" }
      - { name: vial_id, type: string, source: system, description: "FK -> DoseVial.id; administered vial" }
      - { name: administered_at, type: datetime, source: system, description: "= current_utc at administration" }
      - { name: administered_by_user_id, type: string, source: system, description: "X-User-ID of the administering technologist" }
      - { name: assayed_activity_exact_mbq, type: number, source: computed, description: "decay_corrected_activity exact_exponential variant at administered_at" }
      - { name: assayed_activity_tabular_mbq, type: number, source: computed, description: "decay_corrected_activity tabular_minute_step variant at administered_at (regulatory worksheet)" }
      - { name: within_admin_window, type: boolean, source: computed, description: "True iff administered_at within +/-60 minutes of order.administration_scheduled_at" }

  - name: ProcedureAppointment
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> DoseOrder.id; order being scheduled" }
      - { name: room_id, type: string, source: input, description: "FK -> ImagingRoom.id; room booked" }
      - { name: start_at, type: datetime, source: input, description: "Booking start (half-open interval start)" }
      - { name: end_at, type: datetime, source: input, description: "Booking end (half-open interval end; must be > start_at)" }
      - { name: status, type: enum, source: system, description: "BOOKED | COMPLETED | CANCELLED | AUTO_VOIDED" }
      - { name: void_reason, type: string, source: system, description: "Set to the spill incident id when AUTO_VOIDED by a spill cascade" }

  - name: WasteContainer
    parent: null
    common_fields: true
    fields:
      - { name: isotope_product_id, type: string, source: input, description: "FK -> IsotopeProduct.id; single-isotope decay-in-storage container" }
      - { name: room_id, type: string, source: input, description: "FK -> ImagingRoom.id; storage location" }
      - { name: status, type: enum, source: system, description: "FILLING | SEALED | CLEARED" }
      - { name: sealed_at, type: datetime, source: system, description: "= current_utc at seal" }
      - { name: sealed_by_user_id, type: string, source: system, description: "X-User-ID of the sealing RSO (segregation-of-duties anchor)" }
      - { name: certified_at, type: datetime, source: system, description: "= current_utc at clearance certification" }
      - { name: certified_by_user_id, type: string, source: system, description: "X-User-ID of the certifying RSO; must differ from sealed_by_user_id" }
      - { name: intake_activity_mbq, type: number, source: computed, description: "Sum of per-disposal round(residual_activity_mbq, 3) across vials disposed into this container" }
      - { name: current_activity_mbq, type: number, source: computed, description: "While FILLING: decay each disposal's residual from its disposed_at to now, sum, round 3. Once SEALED: round(intake_activity_mbq * 0.5 ** ((now - sealed_at)/half_life_minutes), 3) — see waste_clearance_window" }
      - { name: clearable_after_at, type: datetime, source: computed, description: "= sealed_at + 10 * half_life_minutes (decay-in-storage rule)" }

  - name: RadiationSurvey
    parent: null
    common_fields: false
    fields:
      - { name: room_id, type: string, source: input, description: "FK -> ImagingRoom.id; surveyed room" }
      - { name: surveyed_at, type: datetime, source: system, description: "= current_utc at survey recording" }
      - { name: ambient_dose_rate_usv_h, type: number, source: input, description: "Measured ambient dose rate" }
      - { name: result, type: enum, source: input, description: "PASS | FAIL" }
      - { name: performed_by_user_id, type: string, source: system, description: "X-User-ID of the surveying RSO" }

  - name: SpillIncident
    parent: null
    common_fields: true
    fields:
      - { name: room_id, type: string, source: input, description: "FK -> ImagingRoom.id; room where the spill occurred" }
      - { name: isotope_product_id, type: string, source: input, description: "FK -> IsotopeProduct.id; spilled isotope" }
      - { name: estimated_activity_mbq, type: number, source: input, description: "Estimated spilled activity; classification threshold input" }
      - { name: occurred_at, type: datetime, source: input, description: "When the spill occurred (may precede report time)" }
      - { name: classification, type: enum, source: computed, description: "MINOR | MAJOR per spill_classification (>= threshold => MAJOR)" }
      - { name: reported_by_user_id, type: string, source: system, description: "X-User-ID of the reporter (segregation-of-duties anchor for clearance)" }
      - { name: status, type: enum, source: system, description: "REPORTED | CONTAINED | DECONTAMINATED | CLEARED" }
      - { name: contained_at, type: datetime, source: system, description: "Timestamp of CONTAINED transition" }
      - { name: decontaminated_at, type: datetime, source: system, description: "Timestamp of most recent DECONTAMINATED transition" }
      - { name: cleared_at, type: datetime, source: system, description: "Timestamp of CLEARED transition" }
      - { name: cleared_by_user_id, type: string, source: system, description: "X-User-ID of the clearing RSO; must differ from reported_by_user_id" }

  - name: PatientReleaseInstruction
    parent: null
    common_fields: true
    fields:
      - { name: administration_id, type: string, source: input, description: "FK -> DoseAdministration.id; exactly one instruction per administration (ERR_DUPLICATE_RELEASE_INSTRUCTION)" }
      - { name: evaluation_variant, type: enum, source: input, description: "ACTIVITY_BASED | MEASURED_RATE_BASED — selects release_eligibility variant" }
      - { name: measured_dose_rate_at_1m_usv_h, type: number, source: input, required: false, description: "Required iff evaluation_variant = MEASURED_RATE_BASED" }
      - { name: releasable, type: boolean, source: computed, description: "Result of release_eligibility under the chosen variant" }
      - { name: status, type: enum, source: system, description: "ISSUED (created only when releasable)" }
      - { name: issued_by_user_id, type: string, source: system, description: "X-User-ID of the issuing AuthorizedUser" }

# =============================================================================
# Table 2: State Machine Table (8 machines; cycles on DoseOrder / DoseVial /
# SpillIncident / RadiopharmacyLicense, posture-driven ImagingRoom)
# =============================================================================
state_machines:
  - entity: RadiopharmacyLicense
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /nuclear-medicine/licenses/{id}/suspend"
        actor: DepartmentAdmin
        preconditions:
          - "License must be ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "Cascade hop 1: every AuthorizedUser with license_id = this license and status ACTIVE becomes SUSPENDED"
          - "Cascade hop 2: every DoseOrder whose authorized_user_id belongs to a user suspended by hop 1 AND whose status is ORDERED or DOSE_PREPARED becomes ON_HOLD with hold_reason=LICENSE_SUSPENDED and hold_previous_status set to its prior status"
          - "Vials are NOT quarantined by this cascade (unlike the spill cascade)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /nuclear-medicine/licenses/{id}/reinstate"
        actor: DepartmentAdmin
        preconditions:
          - "License must be SUSPENDED (else ERR_INVALID_STATE)"
        side_effects:
          - "Cascade hop 1: every AuthorizedUser with license_id = this license and status SUSPENDED becomes ACTIVE"
          - "Cascade hop 2: every DoseOrder with hold_reason=LICENSE_SUSPENDED and status ON_HOLD returns to its hold_previous_status and hold_reason is cleared"

  - entity: DoseOrder
    initial_state: ORDERED
    terminal_states: [ADMINISTERED, CANCELLED, SUPERSEDED, EXPIRED]
    transitions:
      - from: ORDERED
        to: DOSE_PREPARED
        trigger: "POST /nuclear-medicine/dose-vials (system, on vial creation referencing this order)"
        actor: system
        preconditions:
          - "Referenced IsotopeDelivery.status == RECEIVED (ERR_DELIVERY_NOT_RECEIVED)"
          - "order.administration_scheduled_at >= delivery.scheduled_arrival_at (ERR_ADMIN_BEFORE_DELIVERY)"
          - "required_activity_at_preparation <= delivery activity decayed to now (ERR_INSUFFICIENT_DELIVERY_ACTIVITY)"
          - "Projected license.current_possession_mbq after the draw <= license.max_possession_mbq and <= isotope condition max (ERR_POSSESSION_LIMIT_EXCEEDED)"
        side_effects:
          - "DoseVial created PREPARED with required_activity_mbq computed"
      - from: DOSE_PREPARED
        to: ADMINISTERED
        trigger: "POST /nuclear-medicine/dose-vials/{id}/administer (system, on the order's vial)"
        actor: system
        preconditions:
          - "See DoseVial CALIBRATED->ADMINISTERED preconditions"
        side_effects:
          - "DoseAdministration row created (append-only)"
          - "Bubble up: the ProcedureAppointment with order_id = this order, status BOOKED, and administered_at inside [start_at, end_at) becomes COMPLETED"
      - from: ORDERED
        to: ON_HOLD
        trigger: "system (license-suspend cascade hop 2, or spill cascade hop 3)"
        actor: system
        preconditions: []
        side_effects:
          - "hold_previous_status := ORDERED; hold_reason := LICENSE_SUSPENDED or SPILL_CONTAMINATION"
      - from: DOSE_PREPARED
        to: ON_HOLD
        trigger: "system (license-suspend cascade hop 2, or spill cascade hop 3)"
        actor: system
        preconditions: []
        side_effects:
          - "hold_previous_status := DOSE_PREPARED; hold_reason set"
          - "Spill cascade only: this order's DoseVials in PREPARED or CALIBRATED become QUARANTINED"
      - from: ON_HOLD
        to: ORDERED
        trigger: "system (license reinstate when hold_reason=LICENSE_SUSPENDED and hold_previous_status=ORDERED; spill cleared when hold_reason=SPILL_CONTAMINATION and hold_previous_status=ORDERED)"
        actor: system
        preconditions: []
        side_effects:
          - "hold_reason cleared"
      - from: ON_HOLD
        to: DOSE_PREPARED
        trigger: "system (same restoring events when hold_previous_status=DOSE_PREPARED)"
        actor: system
        preconditions: []
        side_effects:
          - "hold_reason cleared"
          - "Spill clearance only: this order's QUARANTINED vials return to CALIBRATED"
      - from: ORDERED
        to: CANCELLED
        trigger: "POST /nuclear-medicine/dose-orders/{id}/cancel"
        actor: AuthorizedUser
        preconditions:
          - "Caller X-User-ID == order.authorized_user_id (ERR_FORBIDDEN_ROLE)"
        side_effects:
          - "This order's DoseVials in PREPARED | CALIBRATED | QUARANTINED become DECAYED"
      - from: ON_HOLD
        to: CANCELLED
        trigger: "POST /nuclear-medicine/dose-orders/{id}/cancel"
        actor: AuthorizedUser
        preconditions:
          - "Caller X-User-ID == order.authorized_user_id (ERR_FORBIDDEN_ROLE)"
        side_effects:
          - "This order's DoseVials in PREPARED | CALIBRATED | QUARANTINED become DECAYED"
      - from: DOSE_PREPARED
        to: CANCELLED
        trigger: "POST /nuclear-medicine/dose-orders/{id}/cancel"
        actor: AuthorizedUser
        preconditions:
          - "Caller X-User-ID == order.authorized_user_id (ERR_FORBIDDEN_ROLE)"
        side_effects:
          - "This order's DoseVials in PREPARED | CALIBRATED | QUARANTINED become DECAYED"
      - from: ORDERED
        to: SUPERSEDED
        trigger: "POST /nuclear-medicine/dose-orders/{id}/substitute"
        actor: AuthorizedUser
        preconditions:
          - "expected_order_version == order.version (OCC, ERR_STALE_VERSION, checked before state)"
          - "Caller X-User-ID == order.authorized_user_id (ERR_FORBIDDEN_ROLE)"
          - "New payload re-validates as a fresh order (scope, condition, prescribed limit, schedule-in-future)"
        side_effects:
          - "New DoseOrder created in ORDERED with replaces_order_id = this order's id"
          - "This order's superseded_by_order_id := new order id; this order's version increments by 1"
      - from: ON_HOLD
        to: SUPERSEDED
        trigger: "POST /nuclear-medicine/dose-orders/{id}/substitute"
        actor: AuthorizedUser
        preconditions:
          - "expected_order_version == order.version (OCC, ERR_STALE_VERSION)"
          - "Caller X-User-ID == order.authorized_user_id (ERR_FORBIDDEN_ROLE)"
        side_effects:
          - "New DoseOrder created in ORDERED with replaces_order_id = this order's id"
          - "superseded_by_order_id set; version increments by 1"
      - from: ORDERED
        to: EXPIRED
        trigger: "system sweep on POST /nuclear-medicine/_clock/set_current_utc when current_utc > expires_at"
        actor: system
        preconditions: []
        side_effects: []
      - from: ON_HOLD
        to: EXPIRED
        trigger: "system sweep on clock set when current_utc > expires_at"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DoseVial
    initial_state: PREPARED
    terminal_states: [DISPOSED]
    transitions:
      - from: PREPARED
        to: CALIBRATED
        trigger: "POST /nuclear-medicine/dose-vials/{id}/calibrate"
        actor: Radiopharmacist
        preconditions:
          - "Vial must be PREPARED (else ERR_INVALID_STATE)"
          - "measured_activity_mbq >= isotope.min_usable_activity_mbq (ERR_DOSE_DECAYED_BELOW_MIN)"
        side_effects:
          - "calibrated_at := current_utc; calibrated_by_user_id := X-User-ID"
          - "license.current_possession_mbq recomputed (vial now counted at measured activity)"
      - from: CALIBRATED
        to: QUARANTINED
        trigger: "system (spill cascade hop 4)"
        actor: system
        preconditions: []
        side_effects:
          - "Vial remains counted in license.current_possession_mbq (quarantine does not remove possession)"
      - from: QUARANTINED
        to: CALIBRATED
        trigger: "system (spill incident CLEARED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CALIBRATED
        to: ADMINISTERED
        trigger: "POST /nuclear-medicine/dose-vials/{id}/administer"
        actor: NuclearMedicineTechnologist
        preconditions:
          - "Vial must be CALIBRATED (else ERR_INVALID_STATE)"
          - "Order's license must be ACTIVE (ERR_LICENSE_SUSPENDED) and unexpired (ERR_LICENSE_EXPIRED)"
          - "administered_at (= current_utc) within +/-60 minutes of order.administration_scheduled_at (ERR_OUTSIDE_ADMIN_WINDOW)"
          - "assayed exact activity at administered_at >= isotope.min_usable_activity_mbq (else ERR_DOSE_DECAYED_BELOW_MIN AND the vial auto-transitions to DECAYED)"
          - "X-User-ID != vial.calibrated_by_user_id (segregation of duties, ERR_SEGREGATION_OF_DUTIES)"
          - "Order must be DOSE_PREPARED (else ERR_INVALID_STATE)"
        side_effects:
          - "DoseAdministration created with both assay variants; order -> ADMINISTERED; covering appointment -> COMPLETED"
      - from: CALIBRATED
        to: DECAYED
        trigger: "system sweep on clock set when decayed activity < min_usable_activity_mbq; OR order cancel/supersede cascade"
        actor: system
        preconditions: []
        side_effects: []
      - from: PREPARED
        to: DECAYED
        trigger: "system (order cancel/supersede cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: QUARANTINED
        to: DECAYED
        trigger: "system (order cancel cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ADMINISTERED
        to: DISPOSED
        trigger: "POST /nuclear-medicine/dose-vials/{id}/dispose"
        actor: Radiopharmacist
        preconditions:
          - "Target WasteContainer must be FILLING (else ERR_INVALID_STATE)"
          - "Container isotope_product_id must equal the vial's order isotope_product_id (ERR_VALIDATION)"
        side_effects:
          - "residual_activity_mbq := (measured_activity_mbq - assayed_activity_exact_mbq) decayed from administered_at to disposed_at; decay_loss_mbq := measured_activity_mbq - decay(measured, calibrated_at -> disposed_at) - ... per vial_activity_balance invariant"
          - "Container intake_activity_mbq += round(residual_activity_mbq, 3)"
      - from: DECAYED
        to: DISPOSED
        trigger: "POST /nuclear-medicine/dose-vials/{id}/dispose"
        actor: Radiopharmacist
        preconditions:
          - "Target WasteContainer must be FILLING (else ERR_INVALID_STATE)"
          - "Container isotope must match (ERR_VALIDATION)"
        side_effects:
          - "residual_activity_mbq := decay(measured_activity_mbq, calibrated_at -> disposed_at) (no administration occurred)"
          - "Container intake_activity_mbq += round(residual_activity_mbq, 3)"

  - entity: IsotopeDelivery
    initial_state: SCHEDULED
    terminal_states: [RECEIVED, FAILED]
    transitions:
      - from: SCHEDULED
        to: RECEIVED
        trigger: "POST /nuclear-medicine/isotope-deliveries/{id}/receive"
        actor: Radiopharmacist
        preconditions:
          - "Delivery must be SCHEDULED (else ERR_INVALID_STATE)"
          - "License ACTIVE (ERR_LICENSE_SUSPENDED) and unexpired (ERR_LICENSE_EXPIRED)"
          - "|measured_activity_mbq - reference decayed to received_at| <= 10% of reference decayed (ERR_ACTIVITY_TOLERANCE_EXCEEDED)"
        side_effects:
          - "received_at := current_utc"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /nuclear-medicine/isotope-deliveries/{id}/mark-failed"
        actor: Radiopharmacist
        preconditions:
          - "Delivery must be SCHEDULED (else ERR_INVALID_STATE)"
        side_effects:
          - "Supply-disruption hook: dependent orders are NOT auto-cancelled; the authorized user substitutes via POST /dose-orders/{id}/substitute"

  - entity: ProcedureAppointment
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED, AUTO_VOIDED]
    transitions:
      - from: BOOKED
        to: COMPLETED
        trigger: "system (DoseAdministration for the same order with administered_at inside [start_at, end_at))"
        actor: system
        preconditions: []
        side_effects: []
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /nuclear-medicine/procedure-appointments/{id}/cancel"
        actor: NuclearMedicineTechnologist
        preconditions:
          - "Appointment must be BOOKED (else ERR_INVALID_STATE)"
        side_effects: []
      - from: BOOKED
        to: AUTO_VOIDED
        trigger: "system (spill cascade hop 3: room CONTAMINATED and end_at > spill.occurred_at)"
        actor: system
        preconditions: []
        side_effects:
          - "void_reason := spill incident id"
          - "Cascade hop 4: the appointment's DoseOrder (status ORDERED|DOSE_PREPARED) -> ON_HOLD with hold_reason=SPILL_CONTAMINATION; that order's vials in PREPARED|CALIBRATED -> QUARANTINED"

  - entity: WasteContainer
    initial_state: FILLING
    terminal_states: [CLEARED]
    transitions:
      - from: FILLING
        to: SEALED
        trigger: "POST /nuclear-medicine/waste-containers/{id}/seal"
        actor: RadiationSafetyOfficer
        preconditions:
          - "expected_container_version == container.version (OCC, ERR_STALE_VERSION)"
          - "Container must be FILLING (else ERR_INVALID_STATE)"
        side_effects:
          - "sealed_at := current_utc; sealed_by_user_id := X-User-ID"
          - "clearable_after_at := sealed_at + 10 * half_life_minutes"
          - "intake_activity_mbq frozen at seal value; container.version increments by 1"
      - from: SEALED
        to: CLEARED
        trigger: "POST /nuclear-medicine/waste-containers/{id}/certify-clearance"
        actor: RadiationSafetyOfficer
        preconditions:
          - "Container must be SEALED (else ERR_INVALID_STATE)"
          - "X-User-ID != sealed_by_user_id (segregation of duties, ERR_SEGREGATION_OF_DUTIES)"
          - "current_utc >= clearable_after_at (ERR_WASTE_CLEARANCE_TOO_EARLY)"
          - "current_activity_mbq <= 0.05 (ERR_CLEARANCE_ACTIVITY_EXCEEDED)"
          - "Latest RadiationSurvey of room_id has result PASS (ERR_SURVEY_REQUIRED)"
        side_effects:
          - "certified_at := current_utc; certified_by_user_id := X-User-ID"
          - "Container exits license.current_possession_mbq"

  - entity: SpillIncident
    initial_state: REPORTED
    terminal_states: [CLEARED]
    transitions:
      - from: REPORTED
        to: CONTAINED
        trigger: "POST /nuclear-medicine/spill-incidents (creation lands in REPORTED) then POST /nuclear-medicine/spill-incidents/{id}/advance {to_state: CONTAINED}"
        actor: RadiationSafetyOfficer
        preconditions:
          - "Incident must be REPORTED (else ERR_INVALID_STATE)"
        side_effects:
          - "contained_at := current_utc"
        note: "Creation itself (REPORTED) fires the room cascade: room -> CONTAMINATED; BOOKED appointments in the room with end_at > occurred_at -> AUTO_VOIDED; each voided appointment's order -> ON_HOLD(SPILL_CONTAMINATION); that order's PREPARED|CALIBRATED vials -> QUARANTINED"
      - from: CONTAINED
        to: DECONTAMINATED
        trigger: "POST /nuclear-medicine/spill-incidents/{id}/advance {to_state: DECONTAMINATED}"
        actor: RadiationSafetyOfficer
        preconditions:
          - "Incident must be CONTAINED (else ERR_INVALID_STATE)"
        side_effects:
          - "decontaminated_at := current_utc; room stays CONTAMINATED"
      - from: DECONTAMINATED
        to: CONTAINED
        trigger: "POST /nuclear-medicine/spill-incidents/{id}/advance {to_state: CONTAINED} (recontamination loop)"
        actor: RadiationSafetyOfficer
        preconditions:
          - "Incident must be DECONTAMINATED (else ERR_INVALID_STATE)"
          - "Latest RadiationSurvey of the room recorded at or after decontaminated_at has result FAIL (else ERR_INVALID_STATE)"
        side_effects:
          - "Room remains CONTAMINATED; appointment/order/vial cascade does NOT re-fire (already voided/held/quarantined)"
      - from: DECONTAMINATED
        to: CLEARED
        trigger: "POST /nuclear-medicine/spill-incidents/{id}/advance {to_state: CLEARED}"
        actor: RadiationSafetyOfficer
        preconditions:
          - "Incident must be DECONTAMINATED (else ERR_INVALID_STATE)"
          - "Latest RadiationSurvey of the room recorded at or after decontaminated_at has result PASS (else ERR_SURVEY_REQUIRED)"
          - "X-User-ID != reported_by_user_id (segregation of duties, ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "cleared_at / cleared_by_user_id set"
          - "If no other non-CLEARED SpillIncident references this room: room -> OPERATIONAL"
          - "Orders ON_HOLD with hold_reason=SPILL_CONTAMINATION return to hold_previous_status; their QUARANTINED vials return to CALIBRATED (appointments stay AUTO_VOIDED — asymmetric compensation)"

  - entity: ImagingRoom
    initial_state: OPERATIONAL
    terminal_states: []
    transitions:
      - from: OPERATIONAL
        to: CONTAMINATED
        trigger: "system (a SpillIncident referencing this room is created)"
        actor: system
        preconditions: []
        side_effects:
          - "Posture gate: while CONTAMINATED, POST /procedure-appointments for this room fails with ERR_ROOM_CONTAMINATED"
      - from: CONTAMINATED
        to: OPERATIONAL
        trigger: "system (the last non-CLEARED SpillIncident for this room becomes CLEARED)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# Section 1.2.1: Concurrency Rules (OCC on parent version; sequential-observable)
# =============================================================================
concurrency_rules:
  - rule_id: order-substitute-stale-version
    parent_entity: DoseOrder
    write_endpoint: "POST /nuclear-medicine/dose-orders/{id}/substitute"
    occ_field: expected_order_version
    description: |
      Substituting a DoseOrder whose version has advanced since the client last
      observed it is rejected. Substitution legitimately supersedes the original
      order, so a client holding a stale view must not create a second
      superseding chain link; the stale expected_order_version is rejected with
      ERR_STALE_VERSION (412).
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: container-seal-stale-version
    parent_entity: WasteContainer
    write_endpoint: "POST /nuclear-medicine/waste-containers/{id}/seal"
    occ_field: expected_container_version
    description: |
      Sealing a WasteContainer whose version has advanced since the client last
      observed it is rejected with ERR_STALE_VERSION (412): the seal freezes
      intake_activity_mbq and starts the 10-half-life decay clock, so a writer
      acting on a stale container view must restart from a fresh read.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table (7 rules; dual variants + 2 combinatorial modes)
# =============================================================================
calculations:
  - name: decay_corrected_activity
    trigger: "DoseVial calibration read, administration assay, possession recompute, waste current activity, hot-lab capacity check"
    algorithm: decay_function
    formula: |
      delta_min = (t_target - t_reference) expressed in whole minutes (fractional seconds truncated)
      exact_exponential variant:
        A = A_ref * (0.5 ** (delta_min / half_life_minutes)); round_half_up(A, 3) applied ONCE at the end
      tabular_minute_step variant (regulatory worksheet method):
        df = round_half_up(0.5 ** (1 / half_life_minutes), 6)
        if delta_min >= 0: repeat delta_min times: A <- round_half_up(A * df, 3)
        if delta_min < 0:  repeat |delta_min| times: A <- round_half_up(A / df, 3)
      Both variants are legitimate assay-correction methods; they diverge because
      the tabular method rounds at every minute step.
    input_set: "Any (A_ref, t_reference, t_target, half_life_minutes) tuple; both directions of delta_min are defined"
    constants:
      ACTIVITY_DECIMALS: 3
      ROUNDING: round_half_up
      TABULAR_FACTOR_DECIMALS: 6
    precision: "3 decimal places, round_half_up (exact variant rounds once; tabular rounds per minute step)"
    variants:
      - name: exact_exponential
        when: "DoseAdministration.assayed_activity_exact_mbq; possession and clearance computations"
        difference: "Single closed-form evaluation with one final rounding"
      - name: tabular_minute_step
        when: "DoseAdministration.assayed_activity_tabular_mbq (the regulatory worksheet figure recorded alongside)"
        difference: "Per-minute iteration with per-step rounding; for 220.000 MBq of an HL=110min isotope over 110 minutes it yields 109.993 where exact yields 110.000"

  - name: required_activity_at_preparation
    trigger: "POST /nuclear-medicine/dose-vials (vial creation against an order and delivery)"
    algorithm: constraint_propagation
    formula: |
      dt_min = (order.administration_scheduled_at - current_utc) in whole minutes; must be >= 0 (ERR_SCHEDULE_IN_PAST otherwise unreachable here because order creation already enforces future scheduling)
      overage_factor = 1.10 if half_life_minutes < 120
                       1.05 if 120 <= half_life_minutes <= 1440
                       1.00 if half_life_minutes > 1440
      raw = prescribed_activity_mbq * (2 ** (dt_min / half_life_minutes)) * overage_factor
      required_activity_mbq = round_half_up(raw, 3)   # single final rounding
      Then validate (in this order): decayed delivery remaining >= required (ERR_INSUFFICIENT_DELIVERY_ACTIVITY);
      projected possession after draw <= limits (ERR_POSSESSION_LIMIT_EXCEEDED).
    input_set: "The DoseOrder (prescribed_activity_mbq, administration_scheduled_at), the IsotopeProduct (half_life_minutes), the current logical clock"
    constants:
      PREP_OVERAGE_SHORT_HALFLIFE: 1.10
      PREP_OVERAGE_MID_HALFLIFE: 1.05
      PREP_OVERAGE_LONG_HALFLIFE: 1.00
      SHORT_HALFLIFE_BOUND_MIN: 120
      LONG_HALFLIFE_BOUND_MIN: 1440
    precision: "3 decimal places, round_half_up, single final rounding"
    variants: []

  - name: current_possession_mbq
    trigger: "Recomputed on every vial / delivery / waste-container mutation and on every clock set; exposed as RadiopharmacyLicense.current_possession_mbq"
    algorithm: aggregation
    formula: |
      component(x) = round_half_up(x, 3)   # per-component rounding
      vial_part      = sum( component(decay_corrected_activity(v.measured_activity_mbq, v.calibrated_at, now)) for v in DoseVial where v.status in {CALIBRATED, QUARANTINED} and v's order traces to this license )
      delivery_part  = sum( component(decay_corrected_activity(d.reference_activity_mbq, d.reference_time_at, now)) for d in IsotopeDelivery where d.status == SCHEDULED and d.isotope is conditioned on this license )
      container_part = sum( component(c.current_activity_mbq) for c in WasteContainer where c.status in {FILLING, SEALED} and c.isotope is conditioned on this license )
      current_possession_mbq = round_half_up(vial_part + delivery_part + container_part, 3)
      PINNED ROUNDING ORDER: every component is rounded to 3 decimals BEFORE the sum; summing raw values and rounding once at the end is a different, non-conformant order.
      Exclusions: PREPARED vials (not yet assayed), DECAYED/ADMINISTERED/DISPOSED vials, RECEIVED/FAILED deliveries (received material is tracked via its vials), CLEARED containers.
    input_set: "Vials in {CALIBRATED, QUARANTINED}; deliveries in {SCHEDULED}; containers in {FILLING, SEALED} — all filtered by isotope-condition membership on the license"
    constants:
      ACTIVITY_DECIMALS: 3
    precision: "3 decimals per component, round_half_up, then sum, then final 3-decimal rounding"
    variants: []

  - name: release_eligibility
    trigger: "POST /nuclear-medicine/patient-release-instructions"
    algorithm: threshold
    formula: |
      ACTIVITY_BASED variant:
        releasable = (administration.assayed_activity_exact_mbq <= isotope.release_activity_limit_mbq)   # inclusive boundary
      MEASURED_RATE_BASED variant:
        requires measured_dose_rate_at_1m_usv_h input (else ERR_VALIDATION)
        releasable = (measured_dose_rate_at_1m_usv_h <= RELEASE_DOSE_RATE_LIMIT_USV_H)                  # inclusive boundary
      If releasable is false the request is rejected with ERR_RELEASE_CRITERIA_NOT_MET and no row is persisted.
      The two variants can disagree for the same administration (e.g. assayed 1098.024 MBq of I-131 passes ACTIVITY_BASED at a 1221 MBq limit while a measured 80.0 uSv/h fails MEASURED_RATE_BASED at 70).
    input_set: "Exactly one DoseAdministration plus its order's isotope; variant chosen by request field evaluation_variant"
    constants:
      RELEASE_DOSE_RATE_LIMIT_USV_H: 70
    precision: "comparison on stored 3-decimal assay; dose rate compared at face value"
    variants:
      - name: ACTIVITY_BASED
        when: "Caller selects evaluation_variant=ACTIVITY_BASED"
        difference: "Uses the administration's exact assay against the isotope's tabulated activity limit"
      - name: MEASURED_RATE_BASED
        when: "Caller selects evaluation_variant=MEASURED_RATE_BASED"
        difference: "Uses a measured 1-meter dose rate against 70 uSv/h — ignores the assay figure entirely"

  - name: spill_classification
    trigger: "POST /nuclear-medicine/spill-incidents (at creation)"
    algorithm: threshold
    formula: |
      classification = MAJOR if estimated_activity_mbq >= isotope.spill_major_threshold_mbq else MINOR
      Boundary is INCLUSIVE: an estimate exactly equal to the threshold is MAJOR.
    input_set: "The new SpillIncident's estimated_activity_mbq and the referenced IsotopeProduct.spill_major_threshold_mbq"
    constants: {}
    precision: "comparison at face value"
    variants: []

  - name: waste_clearance_window
    trigger: "POST /nuclear-medicine/waste-containers/{id}/seal (computes clearable_after_at) and POST .../certify-clearance (evaluates)"
    algorithm: threshold
    formula: |
      clearable_after_at = sealed_at + 10 * half_life_minutes (minutes)
      current_activity_mbq (SEALED) = round_half_up(intake_activity_mbq * 0.5 ** ((now - sealed_at)_min / half_life_minutes), 3)
      While FILLING: current_activity_mbq = round_half_up(sum over disposed vials of decay(residual, disposed_at -> now), 3)
      Clearance requires now >= clearable_after_at (inclusive) AND current_activity_mbq <= 0.05 (inclusive).
    input_set: "The WasteContainer plus its IsotopeProduct half-life and the logical clock"
    constants:
      HALF_LIVES_REQUIRED: 10
      CLEARANCE_ACTIVITY_LIMIT_MBQ: 0.05
    precision: "3 decimals round_half_up on current_activity_mbq; instants compared exactly"
    variants: []

  - name: hot_lab_delivery_capacity
    trigger: "POST /nuclear-medicine/isotope-deliveries (at creation)"
    algorithm: aggregation
    formula: |
      window(d) = [d.scheduled_arrival_at - 30min, d.scheduled_arrival_at + 30min)   # half-open
      candidates = all IsotopeDelivery d' with status in {SCHEDULED, RECEIVED} whose window(d') intersects window(d_new) with a non-empty intersection
      t_star = max(scheduled_arrival_at over {d_new} union candidates)
      load = round_half_up( sum( round_half_up(decay_corrected_activity(d'.reference_activity_mbq, d'.reference_time_at, t_star), 3) for d' in candidates )
                            + round_half_up(decay_corrected_activity(d_new.reference_activity_mbq, d_new.reference_time_at, t_star), 3), 3 )
      Reject with ERR_HOT_LAB_CAPACITY_EXCEEDED if load > 37000 (strictly greater; exactly 37000 passes).
      NOTE the aggregate-capacity semantics: overlapping arrivals are ALLOWED; only the decayed sum at t_star is constrained. This differs from the imaging-room rule's exclusion semantics.
    input_set: "IsotopeDeliveries in {SCHEDULED, RECEIVED} with intersecting arrival windows; FAILED deliveries excluded"
    constants:
      ARRIVAL_WINDOW_HALF_WIDTH_MIN: 30
      HOT_LAB_CAPACITY_MBQ: 37000
    precision: "3 decimals round_half_up per component, then sum"
    variants: []

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority — lower number wins)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; role is one of the five declared roles", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Caller role is listed in the endpoint's roles; AuthorizedUser ownership: cancel/substitute require X-User-ID == order.authorized_user_id; release-instruction creation requires X-User-ID to be the prescribing AU of the underlying order", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path ids exist (left to right), then body FK ids exist; for AuthorizedUser-role calls, X-User-ID must reference an existing AuthorizedUser row", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: state, check: "OCC: where an endpoint declares expected_*_version, it must equal the parent's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /nuclear-medicine/dose-orders/{id}/substitute, POST /nuclear-medicine/waste-containers/{id}/seal" }
  - { priority: 5, category: state, check: "Target entity is in a from-state of the requested transition (generic invalid-transition rejection)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 6, category: state, check: "Vial preparation references a delivery in RECEIVED status", error_id: ERR_DELIVERY_NOT_RECEIVED, http_status: 409, applies_to: "POST /nuclear-medicine/dose-vials" }
  - { priority: 7, category: business_safety, check: "RadiopharmacyLicense.status == ACTIVE for ordering, receiving, vial preparation, administration", error_id: ERR_LICENSE_SUSPENDED, http_status: 409, applies_to: "POST /nuclear-medicine/dose-orders, POST /nuclear-medicine/isotope-deliveries/{id}/receive, POST /nuclear-medicine/dose-vials, POST /nuclear-medicine/dose-vials/{id}/administer" }
  - { priority: 8, category: business_safety, check: "current_utc < license.expires_at for the same operations", error_id: ERR_LICENSE_EXPIRED, http_status: 409, applies_to: "POST /nuclear-medicine/dose-orders, POST /nuclear-medicine/isotope-deliveries/{id}/receive, POST /nuclear-medicine/dose-vials, POST /nuclear-medicine/dose-vials/{id}/administer" }
  - { priority: 9, category: business_safety, check: "Acting AuthorizedUser row has status ACTIVE and current_utc < its expires_at", error_id: ERR_USER_NOT_ACTIVE, http_status: 403, applies_to: "POST /nuclear-medicine/dose-orders, POST /nuclear-medicine/dose-orders/{id}/cancel, POST /nuclear-medicine/dose-orders/{id}/substitute, POST /nuclear-medicine/patient-release-instructions" }
  - { priority: 10, category: business_safety, check: "AuthorizedUser.scope covers the order's use_type (BOTH covers all)", error_id: ERR_USER_SCOPE_INSUFFICIENT, http_status: 403, applies_to: "POST /nuclear-medicine/dose-orders, POST /nuclear-medicine/dose-orders/{id}/substitute" }
  - { priority: 11, category: business_safety, check: "Order isotope appears in license.isotope_conditions and the condition's allowed_use covers use_type", error_id: ERR_ISOTOPE_NOT_ON_LICENSE, http_status: 409, applies_to: "POST /nuclear-medicine/dose-orders, POST /nuclear-medicine/dose-orders/{id}/substitute" }
  - { priority: 12, category: business_safety, check: "prescribed_activity_mbq <= matching isotope condition's max_possession_mbq", error_id: ERR_PRESCRIBED_ACTIVITY_EXCEEDS_LIMIT, http_status: 422, applies_to: "POST /nuclear-medicine/dose-orders, POST /nuclear-medicine/dose-orders/{id}/substitute" }
  - { priority: 13, category: business_safety, check: "ImagingRoom.status == OPERATIONAL when booking an appointment in it", error_id: ERR_ROOM_CONTAMINATED, http_status: 409, applies_to: "POST /nuclear-medicine/procedure-appointments" }
  - { priority: 14, category: business_safety, check: "Segregation of duties: administrator != calibrator; clearance certifier != sealer; spill clearer != reporter", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /nuclear-medicine/dose-vials/{id}/administer, POST /nuclear-medicine/waste-containers/{id}/certify-clearance, POST /nuclear-medicine/spill-incidents/{id}/advance" }
  - { priority: 15, category: business_safety, check: "Projected current_possession_mbq after the vial draw <= license.max_possession_mbq AND <= isotope condition max_possession_mbq", error_id: ERR_POSSESSION_LIMIT_EXCEEDED, http_status: 409, applies_to: "POST /nuclear-medicine/dose-vials" }
  - { priority: 16, category: business_temporal, check: "administration_scheduled_at > current_utc at order creation / substitution", error_id: ERR_SCHEDULE_IN_PAST, http_status: 422, applies_to: "POST /nuclear-medicine/dose-orders, POST /nuclear-medicine/dose-orders/{id}/substitute" }
  - { priority: 17, category: business_temporal, check: "order.administration_scheduled_at >= delivery.scheduled_arrival_at when preparing a vial", error_id: ERR_ADMIN_BEFORE_DELIVERY, http_status: 409, applies_to: "POST /nuclear-medicine/dose-vials" }
  - { priority: 18, category: business_temporal, check: "administered_at within +/-60 minutes of order.administration_scheduled_at", error_id: ERR_OUTSIDE_ADMIN_WINDOW, http_status: 409, applies_to: "POST /nuclear-medicine/dose-vials/{id}/administer" }
  - { priority: 19, category: business_temporal, check: "Assayed activity at administration >= isotope.min_usable_activity_mbq (failure also auto-transitions the vial to DECAYED); calibration measured_activity_mbq >= min_usable", error_id: ERR_DOSE_DECAYED_BELOW_MIN, http_status: 409, applies_to: "POST /nuclear-medicine/dose-vials/{id}/administer, POST /nuclear-medicine/dose-vials/{id}/calibrate" }
  - { priority: 20, category: business_temporal, check: "New booking [start_at, end_at) must not intersect any BOOKED appointment in the same room extended by room.cleanup_buffer_minutes: existing occupies [start, end + buffer); half-open intersection non-empty => conflict", error_id: ERR_APPOINTMENT_OVERLAP, http_status: 409, applies_to: "POST /nuclear-medicine/procedure-appointments" }
  - { priority: 21, category: business_temporal, check: "hot_lab_delivery_capacity aggregate load <= 37000 MBq at t_star", error_id: ERR_HOT_LAB_CAPACITY_EXCEEDED, http_status: 409, applies_to: "POST /nuclear-medicine/isotope-deliveries" }
  - { priority: 22, category: business_temporal, check: "current_utc >= container.clearable_after_at", error_id: ERR_WASTE_CLEARANCE_TOO_EARLY, http_status: 409, applies_to: "POST /nuclear-medicine/waste-containers/{id}/certify-clearance" }
  - { priority: 23, category: business_temporal, check: "container.current_activity_mbq <= 0.05 at certification", error_id: ERR_CLEARANCE_ACTIVITY_EXCEEDED, http_status: 409, applies_to: "POST /nuclear-medicine/waste-containers/{id}/certify-clearance" }
  - { priority: 24, category: business_referential, check: "Spill CLEARED and container CLEARED require a latest room RadiationSurvey (at or after decontaminated_at for spills; at or after sealed_at for containers) with result PASS", error_id: ERR_SURVEY_REQUIRED, http_status: 409, applies_to: "POST /nuclear-medicine/spill-incidents/{id}/advance, POST /nuclear-medicine/waste-containers/{id}/certify-clearance" }
  - { priority: 25, category: business_referential, check: "At most one PatientReleaseInstruction per DoseAdministration", error_id: ERR_DUPLICATE_RELEASE_INSTRUCTION, http_status: 409, applies_to: "POST /nuclear-medicine/patient-release-instructions" }
  - { priority: 26, category: business_constraint, check: "required_activity_at_preparation <= delivery reference activity decayed to current_utc", error_id: ERR_INSUFFICIENT_DELIVERY_ACTIVITY, http_status: 409, applies_to: "POST /nuclear-medicine/dose-vials" }
  - { priority: 27, category: business_constraint, check: "Required fields present; enums valid; half_life_minutes > 0; end_at > start_at; measured_dose_rate present iff MEASURED_RATE_BASED", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all" }
  - { priority: 28, category: business_constraint, check: "license_number unique across RadiopharmacyLicense", error_id: ERR_DUPLICATE_LICENSE_NUMBER, http_status: 409, applies_to: "POST /nuclear-medicine/licenses" }
  - { priority: 29, category: business_safety, check: "release_eligibility under the chosen variant is true", error_id: ERR_RELEASE_CRITERIA_NOT_MET, http_status: 422, applies_to: "POST /nuclear-medicine/patient-release-instructions" }
  - { priority: 30, category: business_constraint, check: "|measured - reference decayed to received_at| <= 10% of reference decayed at receipt", error_id: ERR_ACTIVITY_TOLERANCE_EXCEEDED, http_status: 422, applies_to: "POST /nuclear-medicine/isotope-deliveries/{id}/receive" }

# =============================================================================
# Table 5: API Endpoint Table (52 endpoints; flat topology, filtered-list GETs
# give every FK a reverse-reachability path)
# GET_ALL = [DepartmentAdmin, AuthorizedUser, Radiopharmacist, NuclearMedicineTechnologist, RadiationSafetyOfficer]
# =============================================================================
endpoints:
  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/nuclear-medicine/_clock/set_current_utc"
    description: "Set the logical clock. Before any call, the clock reads exactly 2026-08-01T00:00:00Z (startup default; never falls back to wall-clock). Side effects: system sweep expires DoseOrders past expires_at and transitions CALIBRATED vials whose decayed activity fell below min_usable to DECAYED; possession recomputed."
    roles: [DepartmentAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["order/vial decay sweep", "current_possession_mbq recompute"]

  # --- Isotope catalog ---
  - method: POST
    path: "/nuclear-medicine/isotope-products"
    description: "Register an isotope product"
    roles: [DepartmentAdmin]
    code: 201
    input: [name, half_life_minutes, spill_major_threshold_mbq, release_activity_limit_mbq, min_usable_activity_mbq]
    output: IsotopeProduct
    side_effects: ["decay_constant_per_minute computed"]
  - method: GET
    path: "/nuclear-medicine/isotope-products"
    description: "List isotope products"
    roles: [DepartmentAdmin, AuthorizedUser, Radiopharmacist, NuclearMedicineTechnologist, RadiationSafetyOfficer]
    code: 200
    input: []
    output: "IsotopeProduct[]"
    side_effects: []
  - method: GET
    path: "/nuclear-medicine/isotope-products/{id}"
    description: "Get one isotope product"
    roles: [DepartmentAdmin, AuthorizedUser, Radiopharmacist, NuclearMedicineTechnologist, RadiationSafetyOfficer]
    code: 200
    input: []
    output: IsotopeProduct
    side_effects: []

  # --- License ---
  - method: POST
    path: "/nuclear-medicine/licenses"
    description: "Create a radiopharmacy license with embedded isotope conditions"
    roles: [DepartmentAdmin]
    code: 201
    input: [license_number, max_possession_mbq, isotope_conditions, expires_at]
    output: RadiopharmacyLicense
    side_effects: []
  - method: GET
    path: "/nuclear-medicine/licenses/{id}"
    description: "Get a license incl. live current_possession_mbq"
    roles: [DepartmentAdmin, AuthorizedUser, Radiopharmacist, NuclearMedicineTechnologist, RadiationSafetyOfficer]
    code: 200
    input: []
    output: RadiopharmacyLicense
    side_effects: []
  - method: POST
    path: "/nuclear-medicine/licenses/{id}/suspend"
    description: "Suspend a license (posture gate + cascade to authorized users and their open orders)"
    roles: [DepartmentAdmin]
    code: 200
    input: []
    output: RadiopharmacyLicense
    side_effects: ["license-suspend cascade (see RadiopharmacyLicense machine)"]
  - method: POST
    path: "/nuclear-medicine/licenses/{id}/reinstate"
    description: "Reinstate a suspended license (compensating cascade)"
    roles: [DepartmentAdmin]
    code: 200
    input: []
    output: RadiopharmacyLicense
    side_effects: ["license-reinstate cascade"]

  # --- Authorized users ---
  - method: POST
    path: "/nuclear-medicine/authorized-users"
    description: "Add an authorized user to a license"
    roles: [DepartmentAdmin]
    code: 201
    input: [full_name, license_id, scope, expires_at]
    output: AuthorizedUser
    side_effects: []
  - method: GET
    path: "/nuclear-medicine/authorized-users"
    description: "List authorized users (filterable by license)"
    roles: [DepartmentAdmin, AuthorizedUser, Radiopharmacist, NuclearMedicineTechnologist, RadiationSafetyOfficer]
    code: 200
    input: ["license_id?"]
    output: "AuthorizedUser[]"
    side_effects: []
  - method: GET
    path: "/nuclear-medicine/authorized-users/{id}"
    description: "Get one authorized user"
    roles: [DepartmentAdmin, AuthorizedUser, Radiopharmacist, NuclearMedicineTechnologist, RadiationSafetyOfficer]
    code: 200
    input: []
    output: AuthorizedUser
    side_effects: []

  # --- Patients ---
  - method: POST
    path: "/nuclear-medicine/patients"
    description: "Register a patient"
    roles: [NuclearMedicineTechnologist, DepartmentAdmin]
    code: 201
    input: [full_name, weight_kg, "date_of_birth?"]
    output: Patient
    side_effects: []
  - method: GET
    path: "/nuclear-medicine/patients"
    description: "List patients"
    roles: [DepartmentAdmin, AuthorizedUser, Radiopharmacist, NuclearMedicineTechnologist, RadiationSafetyOfficer]
    code: 200
    input: []
    output: "Patient[]"
    side_effects: []

  # --- Imaging rooms ---
  - method: POST
    path: "/nuclear-medicine/imaging-rooms"
    description: "Register an imaging/injection room"
    roles: [DepartmentAdmin]
    code: 201
    input: [name, "cleanup_buffer_minutes?"]
    output: ImagingRoom
    side_effects: []
  - method: GET
    path: "/nuclear-medicine/imaging-rooms/{id}"
    description: "Get a room (posture status)"
    roles: [DepartmentAdmin, AuthorizedUser, Radiopharmacist, NuclearMedicineTechnologist, RadiationSafetyOfficer]
    code: 200
    input: []
    output: ImagingRoom
    side_effects: []

  # --- Isotope deliveries ---
  - method: POST
    path: "/nuclear-medicine/isotope-deliveries"
    description: "Schedule an isotope delivery (hot-lab aggregate capacity enforced)"
    roles: [Radiopharmacist]
    code: 201
    input: [isotope_product_id, scheduled_arrival_at, reference_activity_mbq, reference_time_at]
    output: IsotopeDelivery
    side_effects: ["hot_lab_delivery_capacity check"]
  - method: GET
    path: "/nuclear-medicine/isotope-deliveries"
    description: "List deliveries"
    roles: [DepartmentAdmin, AuthorizedUser, Radiopharmacist, NuclearMedicineTechnologist, RadiationSafetyOfficer]
    code: 200
    input: ["isotope_product_id?", "status?"]
    output: "IsotopeDelivery[]"
    side_effects: []
  - method: GET
    path: "/nuclear-medicine/isotope-deliveries/{id}"
    description: "Get one delivery"
    roles: [DepartmentAdmin, AuthorizedUser, Radiopharmacist, NuclearMedicineTechnologist, RadiationSafetyOfficer]
    code: 200
    input: []
    output: IsotopeDelivery
    side_effects: []
  - method: POST
    path: "/nuclear-medicine/isotope-deliveries/{id}/receive"
    description: "Receive a delivery; measured activity tolerance +/-10% vs decayed reference"
    roles: [Radiopharmacist]
    code: 200
    input: [measured_activity_mbq]
    output: IsotopeDelivery
    side_effects: ["received_at := current_utc"]
  - method: POST
    path: "/nuclear-medicine/isotope-deliveries/{id}/mark-failed"
    description: "Mark a scheduled delivery failed (supply disruption contingency)"
    roles: [Radiopharmacist]
    code: 200
    input: [reason]
    output: IsotopeDelivery
    side_effects: []

  # --- Dose orders ---
  - method: POST
    path: "/nuclear-medicine/dose-orders"
    description: "Prescribe a dose order (authorized user only; authorized_user_id := X-User-ID)"
    roles: [AuthorizedUser]
    code: 201
    input: [patient_id, isotope_product_id, use_type, prescribed_activity_mbq, administration_scheduled_at]
    output: DoseOrder
    side_effects: ["expires_at computed"]
  - method: GET
    path: "/nuclear-medicine/dose-orders"
    description: "List dose orders (FK reverse-lookup filters)"
    roles: [DepartmentAdmin, AuthorizedUser, Radiopharmacist, NuclearMedicineTechnologist, RadiationSafetyOfficer]
    code: 200
    input: ["patient_id?", "isotope_product_id?", "authorized_user_id?", "replaces_order_id?", "status?"]
    output: "DoseOrder[]"
    side_effects: []
  - method: GET
    path: "/nuclear-medicine/dose-orders/{id}"
    description: "Get one dose order"
    roles: [DepartmentAdmin, AuthorizedUser, Radiopharmacist, NuclearMedicineTechnologist, RadiationSafetyOfficer]
    code: 200
    input: []
    output: DoseOrder
    side_effects: []
  - method: POST
    path: "/nuclear-medicine/dose-orders/{id}/cancel"
    description: "Cancel an open order (prescribing AU only); open vials decay out"
    roles: [AuthorizedUser]
    code: 200
    input: ["reason?"]
    output: DoseOrder
    side_effects: ["vials in PREPARED|CALIBRATED|QUARANTINED -> DECAYED"]
  - method: POST
    path: "/nuclear-medicine/dose-orders/{id}/substitute"
    description: "Supply-disruption substitution: supersede this order and create its replacement (OCC on this order's version)"
    roles: [AuthorizedUser]
    code: 201
    input: [expected_order_version, isotope_product_id, use_type, prescribed_activity_mbq, administration_scheduled_at]
    output: DoseOrder
    side_effects: ["original -> SUPERSEDED, original.version += 1", "new order ORDERED with replaces_order_id", "original's PREPARED|CALIBRATED vials -> DECAYED"]

  # --- Dose vials ---
  - method: POST
    path: "/nuclear-medicine/dose-vials"
    description: "Prepare a vial for an order from a received delivery; computes required_activity_mbq; moves order to DOSE_PREPARED"
    roles: [Radiopharmacist]
    code: 201
    input: [order_id, delivery_id]
    output: DoseVial
    side_effects: ["required_activity_at_preparation", "order -> DOSE_PREPARED", "possession recompute"]
  - method: GET
    path: "/nuclear-medicine/dose-vials"
    description: "List vials (FK reverse-lookup filters)"
    roles: [DepartmentAdmin, AuthorizedUser, Radiopharmacist, NuclearMedicineTechnologist, RadiationSafetyOfficer]
    code: 200
    input: ["order_id?", "delivery_id?", "waste_container_id?", "status?"]
    output: "DoseVial[]"
    side_effects: []
  - method: GET
    path: "/nuclear-medicine/dose-vials/{id}"
    description: "Get one vial"
    roles: [DepartmentAdmin, AuthorizedUser, Radiopharmacist, NuclearMedicineTechnologist, RadiationSafetyOfficer]
    code: 200
    input: []
    output: DoseVial
    side_effects: []
  - method: POST
    path: "/nuclear-medicine/dose-vials/{id}/calibrate"
    description: "Record dose-calibrator assay; calibrated_at := current_utc"
    roles: [Radiopharmacist]
    code: 200
    input: [measured_activity_mbq]
    output: DoseVial
    side_effects: ["possession recompute (vial now counted at measured activity)"]
  - method: POST
    path: "/nuclear-medicine/dose-vials/{id}/administer"
    description: "Administer the vial; administered_at := current_utc; writes the DoseAdministration record with both assay variants"
    roles: [NuclearMedicineTechnologist]
    code: 201
    input: []
    output: DoseAdministration
    side_effects: ["DoseAdministration created", "order -> ADMINISTERED", "covering appointment -> COMPLETED"]
  - method: POST
    path: "/nuclear-medicine/dose-vials/{id}/dispose"
    description: "Dispose an ADMINISTERED or DECAYED vial into a FILLING waste container"
    roles: [Radiopharmacist]
    code: 200
    input: [waste_container_id]
    output: DoseVial
    side_effects: ["residual/decay loss computed per vial_activity_balance", "container intake_activity_mbq += round(residual,3)", "possession recompute"]

  # --- Administrations (append-only read surface) ---
  - method: GET
    path: "/nuclear-medicine/dose-administrations"
    description: "List administration records"
    roles: [DepartmentAdmin, AuthorizedUser, Radiopharmacist, NuclearMedicineTechnologist, RadiationSafetyOfficer]
    code: 200
    input: ["order_id?", "vial_id?"]
    output: "DoseAdministration[]"
    side_effects: []
  - method: GET
    path: "/nuclear-medicine/dose-administrations/{id}"
    description: "Get one administration record"
    roles: [DepartmentAdmin, AuthorizedUser, Radiopharmacist, NuclearMedicineTechnologist, RadiationSafetyOfficer]
    code: 200
    input: []
    output: DoseAdministration
    side_effects: []

  # --- Appointments ---
  - method: POST
    path: "/nuclear-medicine/procedure-appointments"
    description: "Book a procedure appointment for an order in a room (buffered half-open overlap rule); order must be ORDERED or DOSE_PREPARED (else ERR_INVALID_STATE)"
    roles: [NuclearMedicineTechnologist]
    code: 201
    input: [order_id, room_id, start_at, end_at]
    output: ProcedureAppointment
    side_effects: []
  - method: GET
    path: "/nuclear-medicine/procedure-appointments"
    description: "List appointments"
    roles: [DepartmentAdmin, AuthorizedUser, Radiopharmacist, NuclearMedicineTechnologist, RadiationSafetyOfficer]
    code: 200
    input: ["order_id?", "room_id?", "status?"]
    output: "ProcedureAppointment[]"
    side_effects: []
  - method: GET
    path: "/nuclear-medicine/procedure-appointments/{id}"
    description: "Get one appointment"
    roles: [DepartmentAdmin, AuthorizedUser, Radiopharmacist, NuclearMedicineTechnologist, RadiationSafetyOfficer]
    code: 200
    input: []
    output: ProcedureAppointment
    side_effects: []
  - method: POST
    path: "/nuclear-medicine/procedure-appointments/{id}/cancel"
    description: "Cancel a BOOKED appointment"
    roles: [NuclearMedicineTechnologist]
    code: 200
    input: ["reason?"]
    output: ProcedureAppointment
    side_effects: []

  # --- Waste containers ---
  - method: POST
    path: "/nuclear-medicine/waste-containers"
    description: "Create a single-isotope decay-in-storage waste container"
    roles: [RadiationSafetyOfficer]
    code: 201
    input: [isotope_product_id, room_id]
    output: WasteContainer
    side_effects: []
  - method: GET
    path: "/nuclear-medicine/waste-containers"
    description: "List waste containers"
    roles: [DepartmentAdmin, AuthorizedUser, Radiopharmacist, NuclearMedicineTechnologist, RadiationSafetyOfficer]
    code: 200
    input: ["isotope_product_id?", "room_id?", "status?"]
    output: "WasteContainer[]"
    side_effects: []
  - method: GET
    path: "/nuclear-medicine/waste-containers/{id}"
    description: "Get one waste container"
    roles: [DepartmentAdmin, AuthorizedUser, Radiopharmacist, NuclearMedicineTechnologist, RadiationSafetyOfficer]
    code: 200
    input: []
    output: WasteContainer
    side_effects: []
  - method: POST
    path: "/nuclear-medicine/waste-containers/{id}/seal"
    description: "Seal the container (OCC); starts the 10-half-life decay clock"
    roles: [RadiationSafetyOfficer]
    code: 200
    input: [expected_container_version]
    output: WasteContainer
    side_effects: ["sealed_at/clearable_after_at set", "intake_activity_mbq frozen", "container.version += 1"]
  - method: POST
    path: "/nuclear-medicine/waste-containers/{id}/certify-clearance"
    description: "Certify a SEALED container cleared for ordinary disposal (segregation of duties vs sealer)"
    roles: [RadiationSafetyOfficer]
    code: 200
    input: []
    output: WasteContainer
    side_effects: ["container exits possession"]

  # --- Radiation surveys ---
  - method: POST
    path: "/nuclear-medicine/radiation-surveys"
    description: "Record a room radiation survey; surveyed_at := current_utc"
    roles: [RadiationSafetyOfficer]
    code: 201
    input: [room_id, ambient_dose_rate_usv_h, result]
    output: RadiationSurvey
    side_effects: []
  - method: GET
    path: "/nuclear-medicine/radiation-surveys"
    description: "List surveys"
    roles: [DepartmentAdmin, AuthorizedUser, Radiopharmacist, NuclearMedicineTechnologist, RadiationSafetyOfficer]
    code: 200
    input: ["room_id?", "result?"]
    output: "RadiationSurvey[]"
    side_effects: []
  - method: GET
    path: "/nuclear-medicine/radiation-surveys/{id}"
    description: "Get one survey"
    roles: [DepartmentAdmin, AuthorizedUser, Radiopharmacist, NuclearMedicineTechnologist, RadiationSafetyOfficer]
    code: 200
    input: []
    output: RadiationSurvey
    side_effects: []

  # --- Spill incidents ---
  - method: POST
    path: "/nuclear-medicine/spill-incidents"
    description: "Report a spill; any staff role may report; creation fires the room-contamination cascade"
    roles: [DepartmentAdmin, AuthorizedUser, Radiopharmacist, NuclearMedicineTechnologist, RadiationSafetyOfficer]
    code: 201
    input: [room_id, isotope_product_id, estimated_activity_mbq, occurred_at]
    output: SpillIncident
    side_effects: ["spill_classification", "room -> CONTAMINATED", "appointments AUTO_VOIDED", "orders ON_HOLD(SPILL_CONTAMINATION)", "vials QUARANTINED"]
  - method: GET
    path: "/nuclear-medicine/spill-incidents"
    description: "List spill incidents"
    roles: [DepartmentAdmin, AuthorizedUser, Radiopharmacist, NuclearMedicineTechnologist, RadiationSafetyOfficer]
    code: 200
    input: ["room_id?", "isotope_product_id?", "status?"]
    output: "SpillIncident[]"
    side_effects: []
  - method: GET
    path: "/nuclear-medicine/spill-incidents/{id}"
    description: "Get one spill incident"
    roles: [DepartmentAdmin, AuthorizedUser, Radiopharmacist, NuclearMedicineTechnologist, RadiationSafetyOfficer]
    code: 200
    input: []
    output: SpillIncident
    side_effects: []
  - method: POST
    path: "/nuclear-medicine/spill-incidents/{id}/advance"
    description: "Advance the spill workflow: CONTAINED, DECONTAMINATED, CONTAINED-again (recontamination), or CLEARED"
    roles: [RadiationSafetyOfficer]
    code: 200
    input: [to_state]
    output: SpillIncident
    side_effects: ["on CLEARED: room posture restore + hold/quarantine compensation"]

  # --- Patient release instructions ---
  - method: POST
    path: "/nuclear-medicine/patient-release-instructions"
    description: "Issue release instructions for an administration under a chosen evaluation variant"
    roles: [AuthorizedUser]
    code: 201
    input: [administration_id, evaluation_variant, "measured_dose_rate_at_1m_usv_h?"]
    output: PatientReleaseInstruction
    side_effects: ["release_eligibility evaluation"]
  - method: GET
    path: "/nuclear-medicine/patient-release-instructions"
    description: "List release instructions"
    roles: [DepartmentAdmin, AuthorizedUser, Radiopharmacist, NuclearMedicineTechnologist, RadiationSafetyOfficer]
    code: 200
    input: ["administration_id?"]
    output: "PatientReleaseInstruction[]"
    side_effects: []
  - method: GET
    path: "/nuclear-medicine/patient-release-instructions/{id}"
    description: "Get one release instruction"
    roles: [DepartmentAdmin, AuthorizedUser, Radiopharmacist, NuclearMedicineTechnologist, RadiationSafetyOfficer]
    code: 200
    input: []
    output: PatientReleaseInstruction
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog (30 errors)
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not allowed on endpoint, or AuthorizedUser acting on an order they did not prescribe / release for another AU's order" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK id does not exist; entity-backed role id (AuthorizedUser X-User-ID) not found" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_order_version / expected_container_version does not match the parent's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a from-state of the requested transition (incl. terminal-state lockdown, double advance, re-seal)" }
  - { id: ERR_DELIVERY_NOT_RECEIVED, http: 409, condition: "Vial preparation references a delivery not yet RECEIVED" }
  - { id: ERR_LICENSE_SUSPENDED, http: 409, condition: "License status is SUSPENDED at order/receive/prepare/administer time" }
  - { id: ERR_LICENSE_EXPIRED, http: 409, condition: "current_utc >= license.expires_at at order/receive/prepare/administer time" }
  - { id: ERR_USER_NOT_ACTIVE, http: 403, condition: "AuthorizedUser row is SUSPENDED or past its expires_at" }
  - { id: ERR_USER_SCOPE_INSUFFICIENT, http: 403, condition: "AuthorizedUser.scope does not cover the order's use_type" }
  - { id: ERR_ISOTOPE_NOT_ON_LICENSE, http: 409, condition: "Isotope absent from license.isotope_conditions or condition's allowed_use does not cover use_type" }
  - { id: ERR_PRESCRIBED_ACTIVITY_EXCEEDS_LIMIT, http: 422, condition: "prescribed_activity_mbq exceeds the isotope condition's max_possession_mbq" }
  - { id: ERR_ROOM_CONTAMINATED, http: 409, condition: "Booking an appointment in a CONTAMINATED room" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same X-User-ID on both sides of a segregated pair (calibrate/administer, seal/certify, report/clear)" }
  - { id: ERR_POSSESSION_LIMIT_EXCEEDED, http: 409, condition: "Projected possession after vial draw exceeds license or isotope-condition maximum" }
  - { id: ERR_SCHEDULE_IN_PAST, http: 422, condition: "administration_scheduled_at is not in the future at order creation/substitution" }
  - { id: ERR_ADMIN_BEFORE_DELIVERY, http: 409, condition: "order.administration_scheduled_at precedes the delivery's scheduled_arrival_at at vial preparation" }
  - { id: ERR_OUTSIDE_ADMIN_WINDOW, http: 409, condition: "administered_at outside +/-60 minutes of administration_scheduled_at" }
  - { id: ERR_DOSE_DECAYED_BELOW_MIN, http: 409, condition: "Assayed activity below isotope.min_usable_activity_mbq at calibration or administration (administration failure also decays the vial)" }
  - { id: ERR_APPOINTMENT_OVERLAP, http: 409, condition: "Booking intersects an existing BOOKED appointment in the same room extended by cleanup_buffer_minutes (half-open)" }
  - { id: ERR_HOT_LAB_CAPACITY_EXCEEDED, http: 409, condition: "Aggregate decayed delivery load at t_star exceeds 37000 MBq" }
  - { id: ERR_WASTE_CLEARANCE_TOO_EARLY, http: 409, condition: "certify-clearance before clearable_after_at (10 half-lives after seal)" }
  - { id: ERR_CLEARANCE_ACTIVITY_EXCEEDED, http: 409, condition: "current_activity_mbq > 0.05 at certification" }
  - { id: ERR_SURVEY_REQUIRED, http: 409, condition: "No PASS RadiationSurvey of the room recorded (after decontaminated_at for spills; after seal for containers)" }
  - { id: ERR_DUPLICATE_RELEASE_INSTRUCTION, http: 409, condition: "A PatientReleaseInstruction already exists for the administration" }
  - { id: ERR_INSUFFICIENT_DELIVERY_ACTIVITY, http: 409, condition: "required_activity_at_preparation exceeds the delivery's decayed remaining activity" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, invalid enum, half_life_minutes <= 0, end_at <= start_at, missing measured dose rate for MEASURED_RATE_BASED" }
  - { id: ERR_DUPLICATE_LICENSE_NUMBER, http: 409, condition: "license_number already exists" }
  - { id: ERR_RELEASE_CRITERIA_NOT_MET, http: 422, condition: "release_eligibility evaluates false under the chosen variant" }
  - { id: ERR_ACTIVITY_TOLERANCE_EXCEEDED, http: 422, condition: "Measured receipt activity deviates > 10% from the decayed reference activity" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: DepartmentAdmin
    description: "Nuclear medicine department administrator; owns reference data, the license register, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /nuclear-medicine/_clock/set_current_utc"
      - "POST /nuclear-medicine/isotope-products"
      - "POST /nuclear-medicine/licenses (+ suspend/reinstate)"
      - "POST /nuclear-medicine/authorized-users"
      - "POST /nuclear-medicine/imaging-rooms"
    shared_operations: ["all GET endpoints", "POST /nuclear-medicine/spill-incidents", "POST /nuclear-medicine/patients"]
  - name: AuthorizedUser
    description: "Physician on the license's authorized-user list; prescribes and releases"
    identity: "entity_backed:AuthorizedUser"
    exclusive_operations:
      - "POST /nuclear-medicine/dose-orders (+ cancel, substitute — own orders only)"
      - "POST /nuclear-medicine/patient-release-instructions"
    shared_operations: ["all GET endpoints", "POST /nuclear-medicine/spill-incidents"]
  - name: Radiopharmacist
    description: "Radiopharmacy operator; receives deliveries, prepares/calibrates/disposes vials"
    identity: opaque
    exclusive_operations:
      - "POST /nuclear-medicine/isotope-deliveries (+ receive, mark-failed)"
      - "POST /nuclear-medicine/dose-vials (+ calibrate, dispose)"
    shared_operations: ["all GET endpoints", "POST /nuclear-medicine/spill-incidents"]
  - name: NuclearMedicineTechnologist
    description: "Technologist; registers patients, books appointments, administers doses (never calibrates)"
    identity: opaque
    exclusive_operations:
      - "POST /nuclear-medicine/procedure-appointments (+ cancel)"
      - "POST /nuclear-medicine/dose-vials/{id}/administer"
    shared_operations: ["all GET endpoints", "POST /nuclear-medicine/spill-incidents", "POST /nuclear-medicine/patients"]
  - name: RadiationSafetyOfficer
    description: "RSO; surveys, waste custody, spill response. Segregation of duties pins: cannot certify a container they sealed; cannot clear a spill they reported"
    identity: opaque
    exclusive_operations:
      - "POST /nuclear-medicine/radiation-surveys"
      - "POST /nuclear-medicine/waste-containers (+ seal, certify-clearance)"
      - "POST /nuclear-medicine/spill-incidents/{id}/advance"
    shared_operations: ["all GET endpoints", "POST /nuclear-medicine/spill-incidents"]
