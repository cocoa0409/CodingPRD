  - rule_id: boundary_precision_check
    instances:
      - name: discount_band_edge_35_pct
        grounds:
          - calculations.discount_rate_lookup
          - validations[priority=10]
        distinguishing_aspect: |
          Metric: NSLP share percentage at a matrix band edge. Half-open bands make
          share 34.99 stay at C1 50 while exactly 35.00 jumps to 60 (>= lower bound).
          Reached through GET budget-summary for two applicants differing by one
          free-lunch student (349 vs 350 of 1000).
        test_recipe:
          setup:
            - "FY2027; applicant A-LOW school urban 1000 students free 349; applicant A-EDGE school urban 1000 students free 350; both with direct snapshots"
          setup_api_calls:
            - call: "POST /erate/funding-cycles"
              payload: { label: "FY2027", window_open_date: "2026-10-01", window_close_date: "2027-03-31", service_delivery_deadline: "2027-06-30" }
              as: ProgramAdmin
              captures: { cyc: $.data.id }
            - call: "POST /erate/applicants"
              payload: { name: "Lowshare Elementary District", entity_type: "SCHOOL", urban_rural: "URBAN", student_count: 1000 }
              as: ProgramAdmin
              captures: { app_lo: $.data.id }
            - call: "POST /erate/applicants"
              payload: { name: "Edgeline High District", entity_type: "SCHOOL", urban_rural: "URBAN", student_count: 1000 }
              as: ProgramAdmin
              captures: { app_hi: $.data.id }
            - call: "POST /erate/nslp-snapshots"
              payload: { applicant_id: "${app_lo}", funding_cycle_id: "${cyc}", total_students: 1000, free_lunch_eligible_students: 349, cep_participating: false }
              as: ProgramAdmin
            - call: "POST /erate/nslp-snapshots"
              payload: { applicant_id: "${app_hi}", funding_cycle_id: "${cyc}", total_students: 1000, free_lunch_eligible_students: 350, cep_participating: false }
              as: ProgramAdmin
          trigger:
            - call: "GET /erate/applicants/${app_lo}/budget-summary"
              payload: { funding_cycle_id: "${cyc}" }
              as: Any
              captures: { lo_share: $.data.nslp_share_pct, lo_rate: $.data.discount_rate_c1_pct }
            - call: "GET /erate/applicants/${app_hi}/budget-summary"
              payload: { funding_cycle_id: "${cyc}" }
              as: Any
              captures: { hi_share: $.data.nslp_share_pct, hi_rate: $.data.discount_rate_c1_pct }
          assert:
            - "lo_share == 34.9 and lo_rate == 50 (34.90 < 35 stays in band [20,35))"
            - "hi_share == 35.0 and hi_rate == 60 (35.00 >= 35 enters band [35,50))"

