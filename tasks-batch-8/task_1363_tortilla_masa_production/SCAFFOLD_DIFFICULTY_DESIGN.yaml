  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: run_start_blocked_until_changeover_verified
        grounds:
          - state_machines.ProductionRun.SCHEDULED_to_IN_PROGRESS
          - state_machines.ChangeoverRecord
          - errors[ERR_CHANGEOVER_NOT_VERIFIED]
        distinguishing_aspect: |
          Entity pair ProductionRun x ChangeoverRecord: run B's start is gated
          by the VERIFIED state of its gating ChangeoverRecord; while REQUIRED
          the start fails with ERR_CHANGEOVER_NOT_VERIFIED, and only after
          begin+verify does the same start call succeed.
        test_recipe:
          setup:
            - "batch MASA_AVAILABLE 1552.0 kg; line with run A (SOY_BLENDED 08:00-10:00) and run B (CORN_ONLY 12:00-14:00, FULL_SANITATION buffer exactly 120 min)"
            - "run B SCHEDULED with 388.8 kg RESERVED; gating changeover in REQUIRED"
          setup_api_calls:
            - { call: "POST /plant/ingredient-lots", payload: { lot_code: "LOT-X1", corn_variety: "WHITE_CORN", received_kg: 5000, moisture_pct: 12.5 }, as: PlantManager, captures: { lot_id: "$.data.id" } }
