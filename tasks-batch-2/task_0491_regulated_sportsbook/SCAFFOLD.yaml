# =============================================================================
# SCAFFOLD — task_0491_regulated_sportsbook
# Regulated Sportsbook (FanDuel style): account & KYC, geolocation/geofence
# eligibility, market/odds & line management, bet placement & risk/limit,
# parlay/same-game & cash-out, settlement & grading (official data),
# responsible-gaming limits/self-exclusion, bonus/promo & wagering requirement.
#
# Difficulty tier: EXPERT.
# Files: SCAFFOLD.yaml (§1.0–§1.7), SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8),
#        SCAFFOLD_CORNER_DESIGN.yaml (§1.9).
# =============================================================================

scenario: "Regulated Sportsbook (FanDuel style): account & KYC, geolocation/geofence eligibility, market/odds & line management, bet placement & risk/limit, parlay/same-game & cash-out, settlement & grading (official data), responsible-gaming limits/self-exclusion, bonus/promo & wagering requirement"

domain_name: regulated-sportsbook
api_prefix: /
# Flat topology: resources are peer top-level collections (/accounts, /events,
# /markets, /selections, /bets, /promotions, /bonus-grants, /ledger-entries,
# /bet-legs). The empty prefix reflects that no single collection owns the URL
# tree; FK reverse-reachability is served by sub-resource and filtered-list GETs.

# -----------------------------------------------------------------------------
# Complexity profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency       # OCC on Account.version for balance-touching writes
    - cascading_side_effects       # event settlement → market grading → bet/leg grading → ledger → bonus WR
    - dual_variant_calculation     # cash-out valuation vs final settlement payout; gross-loss vs net-loss limit
    - rate_threshold_triggers      # RG deposit/wager/loss limits, risk liability cap, WR completion threshold

  entity_topology: flat
  # Peer entities linked by foreign keys. Account, Event, Market, Selection, Bet,
  # BetLeg, Promotion, BonusGrant, RGControl, GeoCheck, LedgerEntry are not nested
  # in a single ownership tree; they reference each other by FK.

  state_machine_shape: parallel
  # Account carries two independent dimensions: kyc_status × rg_status.
  # Bet carries grading via a branching/compound machine (grades aggregate legs).
  # Event/Market/Selection settle through a cascade.

  relationship_patterns:
    - one_to_many        # Event→Market, Market→Selection, Bet→BetLeg, Account→Bet
    - cross_aggregate    # Bet references Account, BetLeg references Selection
    - polymorphic        # LedgerEntry.ref_id references Bet | BonusGrant | null by ref_type

  role_model: segregation_of_duties
  # Bettor acts on own account/bets; TradingOps manages markets/lines/risk;
  # ComplianceOfficer manages KYC approval + self-exclusion; SettlementAgent
  # posts official results. SoD: the SettlementAgent who posts a result cannot
  # also be the TradingOps who set the line, and KYC approver ≠ Bettor.

  consistency_model: immediate
  # All cascades (settlement grading, ledger postings, WR updates) complete
  # atomically within the triggering request.

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Account
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: email, type: string, source: input, description: "Account login email", constraints: "unique, non-empty" }
      - { name: full_name, type: string, source: input, description: "Legal full name as provided for KYC" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date YYYY-MM-DD; used for 21+ age eligibility" }
      - { name: residence_state, type: enum, source: input, description: "Two-letter US state of residence", constraints: "one of NJ, NY, PA, CO, AZ, NV" }
      - { name: kyc_status, type: enum, source: system, description: "PENDING | VERIFIED | REJECTED — independent dimension; starts PENDING", default: "PENDING", constraints: "PENDING|VERIFIED|REJECTED" }
      - { name: rg_status, type: enum, source: system, description: "ACTIVE | COOLING_OFF | SELF_EXCLUDED — independent dimension; starts ACTIVE", default: "ACTIVE", constraints: "ACTIVE|COOLING_OFF|SELF_EXCLUDED" }
      - { name: cash_balance_cents, type: integer, source: computed, description: "Withdrawable cash balance in cents; = sum of LedgerEntry.amount_cents where bucket=CASH", default: 0 }
      - { name: bonus_balance_cents, type: integer, source: computed, description: "Non-withdrawable bonus balance in cents; = sum of LedgerEntry.amount_cents where bucket=BONUS", default: 0 }
      - { name: lifetime_deposits_cents, type: integer, source: computed, description: "Sum of all DEPOSIT LedgerEntry.amount_cents (CASH bucket); never decremented", default: 0 }
      - { name: cooling_off_until, type: datetime, source: system, description: "ISO8601 UTC; when set and clock < this, rg_status is COOLING_OFF; null otherwise", default: null }
      - { name: kyc_decided_by, type: string, source: system, description: "X-User-ID of ComplianceOfficer who VERIFIED/REJECTED; opaque id", default: null }

  - name: RGControl
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; the account this control applies to" }
      - { name: control_type, type: enum, source: input, description: "DEPOSIT_LIMIT | WAGER_LIMIT | NET_LOSS_LIMIT | COOLING_OFF | SELF_EXCLUSION", constraints: "DEPOSIT_LIMIT|WAGER_LIMIT|NET_LOSS_LIMIT|COOLING_OFF|SELF_EXCLUSION" }
      - { name: period, type: enum, source: input, description: "DAILY | WEEKLY for limit controls; ignored for COOLING_OFF/SELF_EXCLUSION", default: "DAILY", constraints: "DAILY|WEEKLY" }
      - { name: limit_cents, type: integer, source: input, description: "Threshold in cents for DEPOSIT_LIMIT/WAGER_LIMIT/NET_LOSS_LIMIT; null for COOLING_OFF/SELF_EXCLUSION", default: null }
      - { name: duration_days, type: integer, source: input, description: "For COOLING_OFF: days from set_at the account is frozen; null otherwise", default: null }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUPERSEDED — only one ACTIVE control per (account_id, control_type); starts ACTIVE", default: "ACTIVE", constraints: "ACTIVE|SUPERSEDED" }
      - { name: set_at, type: datetime, source: system, description: "Clock time the control became ACTIVE" }

  - name: GeoCheck
    parent: null
    common_fields: false   # id, created_at only — append-only eligibility event
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; the account whose location was checked" }
      - { name: detected_state, type: enum, source: input, description: "Two-letter state the geolocation provider reported", constraints: "one of NJ, NY, PA, CO, AZ, NV, FL, TX, CA, INTL" }
      - { name: accuracy_meters, type: integer, source: input, description: "Reported horizontal accuracy radius in meters" }
      - { name: is_vpn_suspected, type: boolean, source: input, description: "Provider flag that the source IP looks like a VPN/proxy", default: false }
      - { name: eligible, type: boolean, source: computed, description: "True iff detected_state is a permitted state AND accuracy_meters <= MAX_ACCURACY_M AND not is_vpn_suspected" }
      - { name: expires_at, type: datetime, source: computed, description: "created clock time + GEO_TTL_SECONDS; bet placement requires an unexpired eligible check" }

  - name: Event
    parent: null
    common_fields: true
    fields:
      - { name: sport, type: enum, source: input, description: "NFL | NBA | MLB | SOCCER", constraints: "NFL|NBA|MLB|SOCCER" }
      - { name: home_team, type: string, source: input, description: "Home team name" }
      - { name: away_team, type: string, source: input, description: "Away team name" }
      - { name: starts_at, type: datetime, source: input, description: "ISO8601 UTC scheduled start; markets lock at this time" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | LIVE | SETTLED | VOIDED; starts SCHEDULED", default: "SCHEDULED", constraints: "SCHEDULED|LIVE|SETTLED|VOIDED" }
      - { name: home_score, type: integer, source: system, description: "Official home score, set on SETTLED", default: null }
      - { name: away_score, type: integer, source: system, description: "Official away score, set on SETTLED", default: null }
      - { name: result_posted_by, type: string, source: system, description: "X-User-ID of SettlementAgent who posted the official result; opaque", default: null }

  - name: Market
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> Event.id; the event this market is on" }
      - { name: market_type, type: enum, source: input, description: "MONEYLINE | SPREAD | TOTAL", constraints: "MONEYLINE|SPREAD|TOTAL" }
      - { name: line, type: number, source: input, description: "Handicap/total line (e.g., -3.5 spread, 47.5 total); null for MONEYLINE", default: null }
      - { name: liability_cap_cents, type: integer, source: input, description: "Max net liability the book accepts on this market before suspending" }
      - { name: current_liability_cents, type: integer, source: computed, description: "Running max-potential net payout exposure across OPEN bets on this market's selections", default: 0 }
      - { name: status, type: enum, source: system, description: "OPEN | SUSPENDED | SETTLED | VOIDED; starts OPEN", default: "OPEN", constraints: "OPEN|SUSPENDED|SETTLED|VOIDED" }
      - { name: set_by, type: string, source: system, description: "X-User-ID of TradingOps who created/last-priced this market; opaque" }

  - name: Selection
    parent: null
    common_fields: true
    fields:
      - { name: market_id, type: string, source: input, description: "FK -> Market.id; the market this selection belongs to" }
      - { name: name, type: string, source: input, description: "Outcome label (e.g., 'HOME', 'AWAY', 'OVER', 'UNDER')" }
      - { name: american_odds, type: integer, source: input, description: "American odds (e.g., -150, +200); nonzero, magnitude >= 100" }
      - { name: result, type: enum, source: system, description: "PENDING | WON | LOST | PUSH | VOID; starts PENDING; graded on event settlement", default: "PENDING", constraints: "PENDING|WON|LOST|PUSH|VOID" }

  - name: Bet
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; the bettor who placed this bet" }
      - { name: bet_type, type: enum, source: input, description: "SINGLE | PARLAY | SAME_GAME_PARLAY", constraints: "SINGLE|PARLAY|SAME_GAME_PARLAY" }
      - { name: stake_cents, type: integer, source: input, description: "Total risk amount in cents; debited at placement" }
      - { name: stake_bucket, type: enum, source: input, description: "CASH | BONUS — which balance funds the stake", default: "CASH", constraints: "CASH|BONUS" }
      - { name: combined_decimal_odds, type: number, source: computed, description: "Product of each leg's decimal odds; SINGLE = its one leg's decimal odds", precision: "rounded to 4 dp, round_half_up" }
      - { name: potential_payout_cents, type: integer, source: computed, description: "floor(stake_cents * combined_decimal_odds); the gross return if every leg WON" }
      - { name: actual_payout_cents, type: integer, source: computed, description: "Amount credited at settlement/cash-out; 0 until graded", default: 0 }
      - { name: bonus_grant_id, type: string, source: input, description: "FK -> BonusGrant.id; the bonus whose wagering requirement this bet contributes to; null if none", default: null }
      - { name: status, type: enum, source: system, description: "PLACED | WON | LOST | PUSHED | VOIDED | CASHED_OUT; starts PLACED", default: "PLACED", constraints: "PLACED|WON|LOST|PUSHED|VOIDED|CASHED_OUT" }
      - { name: settled_at, type: datetime, source: system, description: "Clock time the bet reached a terminal status", default: null }

  - name: BetLeg
    parent: null
    common_fields: false   # id, created_at only — immutable except graded result/odds snapshot
    fields:
      - { name: bet_id, type: string, source: input, description: "FK -> Bet.id; the parent bet" }
      - { name: selection_id, type: string, source: input, description: "FK -> Selection.id; the selection wagered on" }
      - { name: odds_at_placement, type: integer, source: system, description: "American odds snapshot copied from Selection at placement; immune to later line moves" }
      - { name: decimal_odds_at_placement, type: number, source: system, description: "Decimal conversion of odds_at_placement; precision 4 dp round_half_up" }
      - { name: leg_result, type: enum, source: system, description: "PENDING | WON | LOST | PUSH | VOID; mirrors Selection.result at grading", default: "PENDING", constraints: "PENDING|WON|LOST|PUSH|VOID" }

  - name: Promotion
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Promo code (e.g., 'BET100')", constraints: "unique, non-empty" }
      - { name: bonus_cents, type: integer, source: input, description: "Bonus amount granted to BONUS bucket on claim" }
      - { name: wagering_multiplier, type: integer, source: input, description: "Wagering requirement multiplier; WR target = bonus_cents * wagering_multiplier", constraints: ">= 1" }
      - { name: min_odds_american, type: integer, source: input, description: "Minimum American odds a bet leg must meet to contribute to WR (e.g., -200 means odds >= -200, i.e. shorter than -200 excluded)", default: -200 }
      - { name: max_claims, type: integer, source: input, description: "Total grants this promotion may issue across all accounts", constraints: ">= 1" }
      - { name: claims_used, type: integer, source: computed, description: "Count of BonusGrant rows referencing this promotion", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXHAUSTED | ENDED; starts ACTIVE; EXHAUSTED when claims_used == max_claims", default: "ACTIVE", constraints: "ACTIVE|EXHAUSTED|ENDED" }

  - name: BonusGrant
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; the account that claimed the promotion" }
      - { name: promotion_id, type: string, source: input, description: "FK -> Promotion.id; the claimed promotion" }
      - { name: bonus_cents, type: integer, source: system, description: "Snapshot of Promotion.bonus_cents at claim" }
      - { name: wagering_target_cents, type: integer, source: system, description: "bonus_cents * Promotion.wagering_multiplier; total qualifying stake required" }
      - { name: wagering_progress_cents, type: integer, source: computed, description: "Sum of qualifying contributed stake from settled bets; clamped to wagering_target_cents", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE | COMPLETED | FORFEITED; starts ACTIVE; COMPLETED when progress >= target", default: "ACTIVE", constraints: "ACTIVE|COMPLETED|FORFEITED" }

  - name: LedgerEntry
    parent: null
    common_fields: false   # id, created_at only — append-only money movement
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; the account whose balance moved" }
      - { name: entry_type, type: enum, source: input, description: "DEPOSIT | WITHDRAWAL | STAKE | PAYOUT | BONUS_GRANT | CASHOUT | VOID_REFUND", constraints: "DEPOSIT|WITHDRAWAL|STAKE|PAYOUT|BONUS_GRANT|CASHOUT|VOID_REFUND" }
      - { name: bucket, type: enum, source: input, description: "CASH | BONUS — which balance this entry moves", constraints: "CASH|BONUS" }
      - { name: amount_cents, type: integer, source: input, description: "Signed delta in cents; negative debits (STAKE, WITHDRAWAL), positive credits" }
      - { name: ref_type, type: enum, source: input, description: "BET | BONUS_GRANT | NONE — what this movement is tied to (polymorphic)", default: "NONE", constraints: "BET|BONUS_GRANT|NONE" }
      - { name: ref_id, type: string, source: input, description: "FK -> Bet.id; the Bet this entry references when ref_type=BET; null otherwise (polymorphic, only the BET arm is FK-validated)", default: null }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Account.kyc_status (dimension 1 of the parallel Account machine) ----
  - entity: Account
    initial_state: PENDING
    terminal_states: [REJECTED]
    note: "kyc_status dimension; evolves independently of rg_status"
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /accounts/{id}/kyc-decision with decision=VERIFY"
        actor: ComplianceOfficer
        preconditions:
          - "Age at clock date >= MIN_AGE_YEARS (21), computed from date_of_birth (ERR_UNDERAGE)"
          - "expected_account_version matches Account.version (ERR_STALE_VERSION)"
        side_effects:
          - "kyc_status -> VERIFIED; kyc_decided_by = X-User-ID"
          - "increments Account.version by 1"
      - from: PENDING
        to: REJECTED
        trigger: "POST /accounts/{id}/kyc-decision with decision=REJECT"
        actor: ComplianceOfficer
        preconditions:
          - "expected_account_version matches Account.version (ERR_STALE_VERSION)"
        side_effects:
          - "kyc_status -> REJECTED; kyc_decided_by = X-User-ID"
          - "increments Account.version by 1"

  # ---- Account.rg_status (dimension 2 of the parallel Account machine) ----
  - entity: Account
    initial_state: ACTIVE
    terminal_states: [SELF_EXCLUDED]
    note: "rg_status dimension; SELF_EXCLUDED is terminal and irreversible"
    transitions:
      - from: ACTIVE
        to: COOLING_OFF
        trigger: "POST /accounts/{id}/rg-controls with control_type=COOLING_OFF"
        actor: Bettor
        preconditions:
          - "duration_days present and >= 1 (ERR_INVALID_REQUEST)"
          - "expected_account_version matches Account.version (ERR_STALE_VERSION)"
        side_effects:
          - "cooling_off_until = clock + duration_days; rg_status -> COOLING_OFF"
          - "Open bets are left untouched; only new placements blocked"
          - "increments Account.version by 1"
      - from: COOLING_OFF
        to: ACTIVE
        trigger: "system re-evaluation on any account read or bet attempt"
        actor: system
        preconditions:
          - "clock >= cooling_off_until"
        side_effects:
          - "rg_status -> ACTIVE; cooling_off_until = null"
      - from: ACTIVE
        to: SELF_EXCLUDED
        trigger: "POST /accounts/{id}/rg-controls with control_type=SELF_EXCLUSION"
        actor: ComplianceOfficer
        preconditions:
          - "expected_account_version matches Account.version (ERR_STALE_VERSION)"
        side_effects:
          - "rg_status -> SELF_EXCLUDED (permanent)"
          - "All Bets in PLACED for this account -> VOIDED; each stake refunded via VOID_REFUND LedgerEntry to its stake_bucket (cascade)"
          - "Any ACTIVE BonusGrant for this account -> FORFEITED; bonus_balance_cents zeroed via negative BONUS LedgerEntry"
          - "increments Account.version by 1"
      - from: COOLING_OFF
        to: SELF_EXCLUDED
        trigger: "POST /accounts/{id}/rg-controls with control_type=SELF_EXCLUSION"
        actor: ComplianceOfficer
        preconditions:
          - "expected_account_version matches Account.version (ERR_STALE_VERSION)"
        side_effects:
          - "Same cascade as ACTIVE -> SELF_EXCLUDED"
          - "increments Account.version by 1"

  # ---- Event lifecycle ----
  - entity: Event
    initial_state: SCHEDULED
    terminal_states: [SETTLED, VOIDED]
    transitions:
      - from: SCHEDULED
        to: LIVE
        trigger: "POST /events/{id}/status with to=LIVE (or system when clock >= starts_at)"
        actor: TradingOps
        preconditions: []
        side_effects:
          - "All Markets on this event with status OPEN -> SUSPENDED (no new bets while live)"
      - from: SCHEDULED
        to: VOIDED
        trigger: "POST /events/{id}/status with to=VOIDED"
        actor: TradingOps
        preconditions: []
        side_effects:
          - "All Markets on this event -> VOIDED; all Selections -> VOID (cascade)"
          - "All PLACED Bets with any leg on this event -> VOIDED; stake refunded via VOID_REFUND (cascade)"
      - from: LIVE
        to: VOIDED
        trigger: "POST /events/{id}/status with to=VOIDED"
        actor: TradingOps
        preconditions: []
        side_effects:
          - "Same cascade as SCHEDULED -> VOIDED"
      - from: LIVE
        to: SETTLED
        trigger: "POST /events/{id}/result"
        actor: SettlementAgent
        preconditions:
          - "home_score and away_score present, integers >= 0 (ERR_INVALID_REQUEST)"
          - "Acting X-User-ID must differ from every Market.set_by on this event (ERR_SOD_CONFLICT)"
        side_effects:
          - "home_score/away_score/result_posted_by recorded; status -> SETTLED"
          - "Each Market on event -> SETTLED; each Selection graded WON/LOST/PUSH per market_type & line (cascade step 1)"
          - "Selection grading triggers BetLeg.leg_result update for every leg on those selections (cascade step 2)"
          - "Each Bet whose every leg is now terminal is graded via bet_settlement calc; payout/refund ledger entries posted (cascade step 3)"
          - "Settled WON/PUSHED qualifying bets advance their BonusGrant.wagering_progress (cascade step 4)"

  # ---- Market lifecycle ----
  - entity: Market
    initial_state: OPEN
    terminal_states: [SETTLED, VOIDED]
    transitions:
      - from: OPEN
        to: SUSPENDED
        trigger: "POST /markets/{id}/status with to=SUSPENDED (or auto when current_liability_cents > liability_cap_cents, or event LIVE)"
        actor: TradingOps
        preconditions: []
        side_effects: ["No new Bet legs may reference this market's selections while SUSPENDED"]
      - from: SUSPENDED
        to: OPEN
        trigger: "POST /markets/{id}/status with to=OPEN"
        actor: TradingOps
        preconditions:
          - "Event.status == SCHEDULED (ERR_EVENT_LOCKED)"
          - "current_liability_cents <= liability_cap_cents (ERR_RISK_LIMIT_EXCEEDED)"
        side_effects: []
      - from: OPEN
        to: SETTLED
        trigger: "system cascade from Event SETTLED"
        actor: system
        preconditions: []
        side_effects: ["Selections graded; current_liability_cents -> 0"]
      - from: SUSPENDED
        to: SETTLED
        trigger: "system cascade from Event SETTLED"
        actor: system
        preconditions: []
        side_effects: ["Selections graded; current_liability_cents -> 0"]
      - from: OPEN
        to: VOIDED
        trigger: "system cascade from Event VOIDED"
        actor: system
        preconditions: []
        side_effects: ["Selections -> VOID"]
      - from: SUSPENDED
        to: VOIDED
        trigger: "system cascade from Event VOIDED"
        actor: system
        preconditions: []
        side_effects: ["Selections -> VOID"]

  # ---- Bet lifecycle (compound: status derived from legs) ----
  - entity: Bet
    initial_state: PLACED
    terminal_states: [WON, LOST, PUSHED, VOIDED, CASHED_OUT]
    note: "Grading is compound — bet status derived from aggregate leg_result set"
    transitions:
      - from: PLACED
        to: CASHED_OUT
        trigger: "POST /bets/{id}/cash-out"
        actor: Bettor
        preconditions:
          - "Bet.status == PLACED (ERR_INVALID_STATE)"
          - "No leg's Selection.result is terminal yet — every leg still PENDING (ERR_LEG_ALREADY_GRADED)"
          - "No leg's Market is SUSPENDED or its Event LIVE/SETTLED (ERR_CASHOUT_UNAVAILABLE)"
          - "expected_account_version matches Account.version (ERR_STALE_VERSION)"
        side_effects:
          - "actual_payout_cents = cash_out_value calc; CASHOUT LedgerEntry credited to CASH bucket"
          - "status -> CASHED_OUT; settled_at = clock; market liability released"
          - "If bet funded a BonusGrant, the cashed-out stake does NOT advance wagering_progress"
          - "increments Account.version by 1"
      - from: PLACED
        to: WON
        trigger: "system cascade from Event SETTLED (all legs WON, or WON+PUSH mix)"
        actor: system
        preconditions:
          - "Every leg_result in {WON, PUSH, VOID} and at least one WON"
        side_effects:
          - "actual_payout_cents = bet_settlement payout; PAYOUT LedgerEntry credited (CASH for cash stakes, see calc); settled_at = clock"
          - "If bonus_grant_id set and bet qualifies, advance BonusGrant.wagering_progress by qualifying stake"
      - from: PLACED
        to: LOST
        trigger: "system cascade from Event SETTLED (any leg LOST)"
        actor: system
        preconditions:
          - "At least one leg_result == LOST"
        side_effects:
          - "actual_payout_cents = 0; no payout entry; settled_at = clock"
          - "If bonus_grant_id set, the lost (settled) qualifying stake still advances BonusGrant.wagering_progress"
      - from: PLACED
        to: PUSHED
        trigger: "system cascade from Event SETTLED (all legs PUSH/VOID, none WON, none LOST)"
        actor: system
        preconditions:
          - "Every leg_result in {PUSH, VOID} and none WON and none LOST"
        side_effects:
          - "actual_payout_cents = stake_cents; VOID_REFUND LedgerEntry credited to stake_bucket; settled_at = clock"
      - from: PLACED
        to: VOIDED
        trigger: "system cascade from Event VOIDED or Account SELF_EXCLUDED"
        actor: system
        preconditions: []
        side_effects:
          - "actual_payout_cents = stake_cents; VOID_REFUND LedgerEntry credited to stake_bucket; settled_at = clock; market liability released"

  # ---- BonusGrant lifecycle ----
  - entity: BonusGrant
    initial_state: ACTIVE
    terminal_states: [COMPLETED, FORFEITED]
    transitions:
      - from: ACTIVE
        to: COMPLETED
        trigger: "system when wagering_progress_cents >= wagering_target_cents (bubble-up from bet settlement)"
        actor: system
        preconditions:
          - "wagering_progress_cents >= wagering_target_cents"
        side_effects:
          - "remaining bonus_balance_cents converted to CASH: BONUS debit + CASH credit of equal magnitude (ledger pair)"
      - from: ACTIVE
        to: FORFEITED
        trigger: "system cascade from Account SELF_EXCLUDED"
        actor: system
        preconditions: []
        side_effects:
          - "bonus_balance_cents for this grant zeroed via negative BONUS LedgerEntry"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules — OCC on Account.version only
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: bet-place-stale-account
    parent_entity: Account
    write_endpoint: "POST /bets"
    occ_field: "expected_account_version"
    description: |
      Placing a Bet against an Account whose version has advanced since the
      client last observed it is rejected with a stale-version error. A prior
      placement (or cash-out, or KYC decision) on the same account legitimately
      debited the balance and advanced the account version; the current
      placement's view of the balance is therefore stale, so the system rejects
      it rather than debit against an out-of-date balance snapshot.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: cashout-stale-account
    parent_entity: Account
    write_endpoint: "POST /bets/{id}/cash-out"
    occ_field: "expected_account_version"
    description: |
      Cashing out a Bet while carrying a stale expected_account_version is
      rejected. Another balance-moving write (a settlement payout or a second
      placement) has advanced the account version since the client read it, so
      the cash-out credit would be computed against an out-of-date balance view.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: american_to_decimal_odds
    trigger: "On Selection create and on each BetLeg snapshot at placement"
    algorithm: threshold
    formula: |
      # American odds -> decimal odds.
      if american_odds > 0:
        decimal = 1 + american_odds / 100
      else:   # american_odds <= -100
        decimal = 1 + 100 / abs(american_odds)
      decimal_odds = round_half_up(decimal, 4)
    input_set: "A single Selection.american_odds (magnitude >= 100, nonzero)"
    constants: {}
    precision: "4 decimal places, round_half_up"

  - name: combined_decimal_odds
    trigger: "On POST /bets after all legs snapshotted"
    algorithm: aggregation
    formula: |
      # SINGLE: the one leg's decimal_odds_at_placement.
      # PARLAY / SAME_GAME_PARLAY: product across legs, rounded ONCE at the end.
      #   PIN: multiply the per-leg decimal_odds_at_placement values (each already
      #   rounded to 4dp at snapshot), then round the final product to 4dp.
      #   Do NOT re-round intermediate partial products.
      product = 1.0
      for leg in bet.legs (ordered by BetLeg.created_at ASC):
        product = product * leg.decimal_odds_at_placement
      combined_decimal_odds = round_half_up(product, 4)
    input_set: "All BetLeg rows of the bet, in created_at ASC order"
    constants: {}
    precision: "Final product rounded to 4 dp round_half_up; per-leg factors pre-rounded to 4 dp"

  - name: potential_payout
    trigger: "On POST /bets after combined_decimal_odds computed"
    algorithm: threshold
    formula: |
      potential_payout_cents = floor(stake_cents * combined_decimal_odds)
      # floor (truncate toward zero for positive values) — the book never
      # rounds a potential return up in the bettor's favor.
    input_set: "Single Bet: stake_cents and combined_decimal_odds"
    constants: {}
    precision: "Integer cents via floor"

  - name: bet_settlement_payout
    trigger: "On Event SETTLED cascade, per Bet graded to WON/PUSHED"
    algorithm: forward_looking
    formula: |
      # PIN evaluation order: grade legs first, then recompute effective odds
      # over only the WON legs (PUSH/VOID legs are removed from the parlay and
      # treated as decimal 1.0), then apply.
      effective = 1.0
      for leg in bet.legs (created_at ASC):
        if leg.leg_result == WON: effective *= leg.decimal_odds_at_placement
        elif leg.leg_result in (PUSH, VOID): effective *= 1.0   # leg dropped
        elif leg.leg_result == LOST: effective = 0.0; break
      effective = round_half_up(effective, 4)
      if effective == 0.0:                      # any LOST leg -> bet LOST
        actual_payout_cents = 0
      elif every leg in (PUSH, VOID):           # whole bet PUSH
        actual_payout_cents = stake_cents       # stake refunded only
      else:                                     # WON (with possible pushes)
        actual_payout_cents = floor(stake_cents * effective)
    input_set: "All BetLeg.leg_result + decimal_odds_at_placement for the bet"
    constants: {}
    precision: "Integer cents via floor; effective odds 4 dp round_half_up"
    variants:
      - name: final_settlement
        when: "Event SETTLED with official scores"
        difference: "Uses graded leg_result over real scores; full stake*effective payout"
      - name: cash_out_value
        when: "Bettor cashes out a still-PENDING bet before any leg grades"
        difference: |
          Computed against LIVE/CURRENT odds, not placement odds, and discounted
          by the book margin. See cash_out_value calc — produces a DIFFERENT
          number from bet_settlement_payout on identical stake because it uses
          current_decimal_odds and a 0.92 retention factor instead of locked
          placement odds.

  - name: cash_out_value
    trigger: "On POST /bets/{id}/cash-out"
    algorithm: forward_looking
    formula: |
      # Cash-out offer = expected value of the open ticket at CURRENT prices,
      # times a book retention factor. Distinct from bet_settlement_payout:
      #   settlement uses LOCKED placement odds; cash-out uses CURRENT odds.
      current = 1.0
      for leg in bet.legs (created_at ASC):
        sel = leg.selection
        cur_dec = american_to_decimal_odds(sel.american_odds)   # CURRENT line
        current *= cur_dec
      current = round_half_up(current, 4)
      gross = stake_cents * current
      cash_out_value_cents = floor(gross * CASHOUT_RETENTION)
    input_set: "Current Selection.american_odds for every leg of the bet; stake_cents"
    constants:
      CASHOUT_RETENTION: 0.92
    precision: "Integer cents via floor; current odds product 4 dp round_half_up"
    variants:
      - name: standard_cashout
        when: "All legs still PENDING and markets OPEN"
        difference: "Full formula as above"

  - name: market_liability
    trigger: "On bet placement, cash-out, bet void/settlement"
    algorithm: aggregation
    formula: |
      # Net book exposure on a market = sum over OPEN bets that include a
      # selection on this market of (that bet's max potential book loss
      # attributable to the market). PIN: attribute the WHOLE bet's
      # (potential_payout_cents - stake_cents) to EACH distinct market the bet
      # touches (worst-case, no offsetting), since a parlay can hit on all legs.
      current_liability_cents =
        sum over bets B where B.status == PLACED and B touches a Selection of this market of
          (B.potential_payout_cents - B.stake_cents)
    input_set: "Bets with status PLACED having a BetLeg whose Selection.market_id == this market"
    constants: {}
    precision: "Integer cents"

  - name: deposit_limit_check
    trigger: "On POST /accounts/{id}/deposits"
    algorithm: threshold
    formula: |
      # GROSS rolling-window check.
      window_start = clock - period_seconds(control.period)   # DAILY=86400, WEEKLY=604800
      deposited_in_window = sum(LedgerEntry.amount_cents
                                where entry_type==DEPOSIT and bucket==CASH
                                and created_at > window_start and created_at <= clock)
      if deposited_in_window + new_deposit_cents > control.limit_cents:
        reject ERR_DEPOSIT_LIMIT_EXCEEDED
    input_set: "DEPOSIT ledger entries within the rolling window + this deposit"
    constants:
      DAILY_SECONDS: 86400
      WEEKLY_SECONDS: 604800
    precision: "Integer cents; boundary is strict > (equal-to-limit allowed)"

  - name: net_loss_limit_check
    trigger: "On POST /bets when account has an ACTIVE NET_LOSS_LIMIT control"
    algorithm: chronological
    formula: |
      # NET realized loss over the window — settled outcomes only, NOT a gross
      # stake tally. Distinct domain & shape from deposit_limit_check (gross
      # deposits) and from wager_limit (gross stake).
      window_start = clock - period_seconds(control.period)
      net_loss = sum over Bets B of this account, settled within window, of:
        (B.stake_cents - B.actual_payout_cents)     # positive = net loss, negative = net win
      # plus the about-to-be-placed stake as worst-case prospective loss:
      projected = net_loss + new_stake_cents
      if projected > control.limit_cents:
        reject ERR_NET_LOSS_LIMIT_EXCEEDED
    input_set: "Bets settled (WON/LOST/PUSHED/CASHED_OUT) within window + the new stake"
    constants:
      DAILY_SECONDS: 86400
      WEEKLY_SECONDS: 604800
    precision: "Integer cents; strict > boundary"
    variants:
      - name: net_realized
        when: "Standard NET_LOSS_LIMIT"
        difference: "Nets payouts against stakes — a winning settled bet REDUCES the running loss"
      - name: gross_wager
        when: "WAGER_LIMIT control instead"
        difference: |
          WAGER_LIMIT sums GROSS stake_cents of bets PLACED in window (no payout
          offset). Same window, same account, but a DIFFERENT number: gross
          wager ignores wins, so it is >= net loss for the same bet history.

  - name: wr_qualifying_contribution
    trigger: "On Bet settlement (WON/LOST/PUSHED) when bonus_grant_id is set"
    algorithm: threshold
    formula: |
      # A settled bet contributes its stake to the bonus wagering requirement
      # ONLY if it meets the promotion's minimum-odds floor on the COMBINED odds.
      # min_odds_american is expressed American; convert to decimal floor.
      min_dec = american_to_decimal_odds(promotion.min_odds_american)
      if bet.status == CASHED_OUT: contribution = 0          # cash-outs never qualify
      elif bet.status == VOIDED or bet.status == PUSHED: contribution = 0   # pushed/void excluded
      elif bet.combined_decimal_odds >= min_dec: contribution = bet.stake_cents
      else: contribution = 0
      new_progress = min(grant.wagering_progress_cents + contribution,
                         grant.wagering_target_cents)
    input_set: "The settling Bet's stake_cents, combined_decimal_odds, status; the grant's progress/target"
    constants: {}
    precision: "Integer cents; progress clamped at target; min-odds boundary is >= (inclusive)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /accounts and GET /_health"

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path/body referenced resources exist (left-to-right). For ownership, the Bettor's X-User-ID must equal the resource's account_id"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: business_referential
    check: "Bettor may only act on own Account/Bet (X-User-ID == account_id)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "POST /bets, POST /bets/{id}/cash-out, POST /accounts/{id}/deposits, POST /accounts/{id}/rg-controls(COOLING_OFF), POST /accounts/{id}/bonus-claims"

  - priority: 5
    category: state
    check: "Target resource in correct state for the transition (state machine from: check)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_safety
    check: "Account.rg_status must be ACTIVE for placement/deposit/cash-out (after auto COOLING_OFF→ACTIVE re-eval). SELF_EXCLUDED is permanent block"
    error_id: ERR_RG_SELF_EXCLUDED
    http_status: 403
    applies_to: "POST /bets, POST /accounts/{id}/deposits, POST /accounts/{id}/bonus-claims"

  - priority: 7
    category: business_safety
    check: "Account.rg_status != COOLING_OFF (clock < cooling_off_until) for placement/deposit"
    error_id: ERR_RG_COOLING_OFF
    http_status: 403
    applies_to: "POST /bets, POST /accounts/{id}/deposits"

  - priority: 8
    category: business_safety
    check: "Account.kyc_status == VERIFIED for placement, deposit, withdrawal, bonus-claim"
    error_id: ERR_KYC_NOT_VERIFIED
    http_status: 403
    applies_to: "POST /bets, POST /accounts/{id}/deposits, POST /accounts/{id}/withdrawals, POST /accounts/{id}/bonus-claims"

  - priority: 9
    category: business_safety
    check: "An unexpired, eligible GeoCheck exists for the account (latest GeoCheck has eligible==true and expires_at > clock) at placement"
    error_id: ERR_GEO_INELIGIBLE
    http_status: 403
    applies_to: "POST /bets"

  - priority: 10
    category: business_temporal
    check: "Every leg's Market.status == OPEN and its Event.status == SCHEDULED and Event.starts_at > clock at placement"
    error_id: ERR_MARKET_NOT_OPEN
    http_status: 409
    applies_to: "POST /bets"

  - priority: 11
    category: business_constraint
    check: "SAME_GAME_PARLAY: all legs reference selections whose markets share one event_id. PARLAY: legs span >= 2 distinct events. SINGLE: exactly one leg"
    error_id: ERR_PARLAY_COMPOSITION_INVALID
    http_status: 422
    applies_to: "POST /bets"

  - priority: 12
    category: business_constraint
    check: "No two legs reference the same Selection.id (and SGP correlated-line guard: not two legs on the same market_id)"
    error_id: ERR_DUPLICATE_LEG
    http_status: 422
    applies_to: "POST /bets"

  - priority: 13
    category: business_safety
    check: "If an ACTIVE WAGER_LIMIT control exists, gross window stake + new stake must not exceed limit (gross_wager variant)"
    error_id: ERR_WAGER_LIMIT_EXCEEDED
    http_status: 403
    applies_to: "POST /bets"

  - priority: 14
    category: business_safety
    check: "If an ACTIVE NET_LOSS_LIMIT control exists, projected net loss must not exceed limit (net_realized variant)"
    error_id: ERR_NET_LOSS_LIMIT_EXCEEDED
    http_status: 403
    applies_to: "POST /bets"

  - priority: 15
    category: business_constraint
    check: "Placing into market would push current_liability_cents above liability_cap_cents → reject (book risk cap)"
    error_id: ERR_RISK_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /bets"

  - priority: 16
    category: business_fiscal
    check: "If an ACTIVE DEPOSIT_LIMIT control exists, window deposits + new deposit must not exceed limit"
    error_id: ERR_DEPOSIT_LIMIT_EXCEEDED
    http_status: 403
    applies_to: "POST /accounts/{id}/deposits"

  - priority: 17
    category: business_fiscal
    check: "stake_cents (or withdrawal amount) <= available balance in the named bucket (cash_balance_cents or bonus_balance_cents)"
    error_id: ERR_INSUFFICIENT_FUNDS
    http_status: 402
    applies_to: "POST /bets, POST /accounts/{id}/withdrawals"

  - priority: 18
    category: business_fiscal
    check: "Withdrawal only from CASH bucket and only when no ACTIVE BonusGrant blocks it (cannot withdraw with unmet wagering requirement)"
    error_id: ERR_WR_NOT_MET
    http_status: 409
    applies_to: "POST /accounts/{id}/withdrawals"

  - priority: 19
    category: business_constraint
    check: "Bonus claim: Promotion.status == ACTIVE and claims_used < max_claims and account has no existing grant for this promotion"
    error_id: ERR_PROMO_UNAVAILABLE
    http_status: 409
    applies_to: "POST /accounts/{id}/bonus-claims"

  - priority: 20
    category: business_fiscal
    check: "Field-level: stake_cents/limit_cents/amount_cents > 0; american_odds magnitude >= 100; required fields present; enum members valid"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all create/transition endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- test-driving: logical clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Server startup default is 2026-01-01T00:00:00Z; before any set_current_utc call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [TradingOps, SettlementAgent, ComplianceOfficer]
    code: 200
    input: [to_iso8601]
    output: "{ now: string }"
    side_effects:
      - "Logical clock advances; may auto-transition COOLING_OFF accounts to ACTIVE on next read"

  # ---- Account & KYC ----
  - method: POST
    path: "/accounts"
    description: "Register a new account (self-service, anonymous). kyc_status=PENDING, rg_status=ACTIVE."
    roles: [Anonymous]
    code: 201
    input: [email, full_name, date_of_birth, residence_state]
    output: Account
    side_effects: ["Account created PENDING/ACTIVE; balances 0"]

  - method: GET
    path: "/accounts/{id}"
    description: "Read an account. Re-evaluates COOLING_OFF→ACTIVE if clock >= cooling_off_until before responding."
    roles: [Bettor, ComplianceOfficer, TradingOps]
    code: 200
    input: []
    output: Account
    side_effects: ["Possible rg_status COOLING_OFF->ACTIVE re-eval"]

  - method: GET
    path: "/accounts"
    description: "List accounts (compliance/ops view)."
    roles: [ComplianceOfficer, TradingOps]
    code: 200
    input: ["kyc_status?", "rg_status?", "limit?", "offset?"]
    output: Account[]
    side_effects: []

  - method: POST
    path: "/accounts/{id}/kyc-decision"
    description: "ComplianceOfficer verifies or rejects KYC. Enforces 21+ and SoD."
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, expected_account_version]
    output: Account
    side_effects: ["kyc_status -> VERIFIED|REJECTED; kyc_decided_by set; increments Account.version by 1"]

  - method: POST
    path: "/accounts/{id}/rg-controls"
    description: "Create a responsible-gaming control. COOLING_OFF/COOLING limit by Bettor; SELF_EXCLUSION by ComplianceOfficer; limit controls (DEPOSIT/WAGER/NET_LOSS) by Bettor. Supersedes any prior ACTIVE control of same type."
    roles: [Bettor, ComplianceOfficer]
    code: 201
    input: [control_type, "period?", "limit_cents?", "duration_days?", expected_account_version]
    output: RGControl
    side_effects:
      - "Prior ACTIVE RGControl of same (account_id, control_type) -> SUPERSEDED"
      - "COOLING_OFF: sets cooling_off_until, rg_status->COOLING_OFF; SELF_EXCLUSION: rg_status->SELF_EXCLUDED + cascade voids/forfeits"
      - "increments Account.version by 1"

  - method: GET
    path: "/accounts/{id}/rg-controls"
    description: "List RG controls for an account (reverse lookup of RGControl.account_id)."
    roles: [Bettor, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RGControl[]
    side_effects: []

  # ---- Money: deposits, withdrawals, ledger ----
  - method: POST
    path: "/accounts/{id}/deposits"
    description: "Deposit cash. Requires kyc VERIFIED, rg ACTIVE; enforces DEPOSIT_LIMIT control."
    roles: [Bettor]
    code: 201
    input: [amount_cents, expected_account_version]
    output: LedgerEntry
    side_effects:
      - "DEPOSIT LedgerEntry (CASH, positive) appended; cash_balance_cents and lifetime_deposits_cents increase"
      - "increments Account.version by 1"

  - method: POST
    path: "/accounts/{id}/withdrawals"
    description: "Withdraw cash. Requires kyc VERIFIED; blocked by unmet wagering requirement and insufficient funds."
    roles: [Bettor]
    code: 201
    input: [amount_cents, expected_account_version]
    output: LedgerEntry
    side_effects:
      - "WITHDRAWAL LedgerEntry (CASH, negative) appended; cash_balance_cents decreases"
      - "increments Account.version by 1"

  - method: GET
    path: "/accounts/{id}/ledger"
    description: "List ledger entries for an account (reverse lookup of LedgerEntry.account_id)."
    roles: [Bettor, ComplianceOfficer]
    code: 200
    input: ["entry_type?", "bucket?", "limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []

  - method: GET
    path: "/ledger-entries"
    description: "List ledger entries, filterable by ref_id (reverse lookup of LedgerEntry.ref_id -> Bet)."
    roles: [ComplianceOfficer, TradingOps]
    code: 200
    input: ["ref_id?", "account_id?", "limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []

  - method: GET
    path: "/ledger-entries/{id}"
    description: "Read a single ledger entry."
    roles: [ComplianceOfficer, TradingOps]
    code: 200
    input: []
    output: LedgerEntry
    side_effects: []

  # ---- Geolocation ----
  - method: POST
    path: "/accounts/{id}/geo-checks"
    description: "Submit a geolocation reading; server computes eligible + expires_at. Bettor self-submits."
    roles: [Bettor]
    code: 201
    input: [detected_state, accuracy_meters, "is_vpn_suspected?"]
    output: GeoCheck
    side_effects: ["GeoCheck appended; eligible and expires_at computed"]

  - method: GET
    path: "/accounts/{id}/geo-checks"
    description: "List geo checks for an account (reverse lookup of GeoCheck.account_id)."
    roles: [Bettor, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: GeoCheck[]
    side_effects: []

  # ---- Events / Markets / Selections (trading) ----
  - method: POST
    path: "/events"
    description: "TradingOps creates an event."
    roles: [TradingOps]
    code: 201
    input: [sport, home_team, away_team, starts_at]
    output: Event
    side_effects: ["Event SCHEDULED"]

  - method: GET
    path: "/events/{id}"
    description: "Read an event."
    roles: [TradingOps, SettlementAgent, Bettor]
    code: 200
    input: []
    output: Event
    side_effects: []

  - method: POST
    path: "/events/{id}/status"
    description: "TradingOps transitions event SCHEDULED->LIVE or ->VOIDED."
    roles: [TradingOps]
    code: 200
    input: [to]
    output: Event
    side_effects: ["Per Event state machine; LIVE suspends open markets; VOIDED cascades void of markets/selections/bets"]

  - method: POST
    path: "/events/{id}/result"
    description: "SettlementAgent posts official scores; settles event. Enforces SoD vs Market.set_by."
    roles: [SettlementAgent]
    code: 200
    input: [home_score, away_score]
    output: Event
    side_effects:
      - "Event SETTLED; markets SETTLED; selections graded; bet legs graded; bets settled; ledger payouts; bonus WR advanced (full cascade)"

  - method: POST
    path: "/events/{id}/markets"
    description: "TradingOps creates a market on an event."
    roles: [TradingOps]
    code: 201
    input: [market_type, "line?", liability_cap_cents]
    output: Market
    side_effects: ["Market OPEN; set_by = X-User-ID"]

  - method: GET
    path: "/events/{id}/markets"
    description: "List markets on an event (reverse lookup of Market.event_id)."
    roles: [TradingOps, SettlementAgent, Bettor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Market[]
    side_effects: []

  - method: GET
    path: "/markets/{id}"
    description: "Read a market including current_liability_cents."
    roles: [TradingOps, SettlementAgent, Bettor]
    code: 200
    input: []
    output: Market
    side_effects: ["current_liability_cents recomputed on read"]

  - method: POST
    path: "/markets/{id}/status"
    description: "TradingOps suspends/reopens a market."
    roles: [TradingOps]
    code: 200
    input: [to]
    output: Market
    side_effects: ["Per Market state machine"]

  - method: POST
    path: "/markets/{id}/selections"
    description: "TradingOps adds a selection (outcome + odds) to a market."
    roles: [TradingOps]
    code: 201
    input: [name, american_odds]
    output: Selection
    side_effects: ["Selection PENDING; decimal odds derived"]

  - method: GET
    path: "/markets/{id}/selections"
    description: "List selections on a market (reverse lookup of Selection.market_id)."
    roles: [TradingOps, SettlementAgent, Bettor]
    code: 200
    input: ["limit?", "offset?"]
    output: Selection[]
    side_effects: []

  - method: GET
    path: "/selections/{id}"
    description: "Read a selection (odds + result)."
    roles: [TradingOps, SettlementAgent, Bettor]
    code: 200
    input: []
    output: Selection
    side_effects: []

  - method: PATCH
    path: "/selections/{id}"
    description: "TradingOps re-prices a selection (move the line) while its market is OPEN and event SCHEDULED. Does not change odds_at_placement on existing bet legs."
    roles: [TradingOps]
    code: 200
    input: [american_odds]
    output: Selection
    side_effects: ["american_odds and decimal odds updated; existing BetLeg snapshots unchanged"]

  # ---- Bets ----
  - method: POST
    path: "/bets"
    description: "Bettor places a single/parlay/SGP bet. Validates KYC, RG, geo, market open, composition, limits, risk, funds; debits stake; snapshots legs."
    roles: [Bettor]
    code: 201
    input: [account_id, bet_type, stake_cents, "stake_bucket?", legs, "bonus_grant_id?", expected_account_version]
    output: Bet
    side_effects:
      - "Each leg snapshotted (odds_at_placement); combined odds + potential_payout computed"
      - "STAKE LedgerEntry (negative, stake_bucket) appended; balance debited"
      - "Touched markets' current_liability_cents recomputed; may auto-SUSPEND"
      - "increments Account.version by 1"

  - method: GET
    path: "/bets/{id}"
    description: "Read a bet (status, payouts)."
    roles: [Bettor, ComplianceOfficer, TradingOps]
    code: 200
    input: []
    output: Bet
    side_effects: []

  - method: GET
    path: "/bets"
    description: "List bets, filterable by account_id (reverse lookup of Bet.account_id) and bonus_grant_id (reverse lookup of Bet.bonus_grant_id)."
    roles: [Bettor, ComplianceOfficer, TradingOps]
    code: 200
    input: ["account_id?", "bonus_grant_id?", "status?", "limit?", "offset?"]
    output: Bet[]
    side_effects: []

  - method: GET
    path: "/bets/{id}/legs"
    description: "List the legs of a bet (reverse lookup of BetLeg.bet_id)."
    roles: [Bettor, ComplianceOfficer, TradingOps]
    code: 200
    input: ["limit?", "offset?"]
    output: BetLeg[]
    side_effects: []

  - method: GET
    path: "/bet-legs"
    description: "List bet legs filterable by selection_id (reverse lookup of BetLeg.selection_id)."
    roles: [ComplianceOfficer, TradingOps]
    code: 200
    input: ["selection_id?", "bet_id?", "limit?", "offset?"]
    output: BetLeg[]
    side_effects: []

  - method: GET
    path: "/bet-legs/{id}"
    description: "Read a single bet leg."
    roles: [ComplianceOfficer, TradingOps]
    code: 200
    input: []
    output: BetLeg
    side_effects: []

  - method: POST
    path: "/bets/{id}/cash-out"
    description: "Bettor cashes out an open bet at current prices * retention. Requires all legs PENDING and markets OPEN."
    roles: [Bettor]
    code: 200
    input: [expected_account_version]
    output: Bet
    side_effects:
      - "cash_out_value computed; CASHOUT LedgerEntry (CASH, positive) appended"
      - "status -> CASHED_OUT; market liability released; increments Account.version by 1"

  # ---- Promotions & Bonuses ----
  - method: POST
    path: "/promotions"
    description: "TradingOps creates a promotion with bonus + wagering requirement."
    roles: [TradingOps]
    code: 201
    input: [code, bonus_cents, wagering_multiplier, "min_odds_american?", max_claims]
    output: Promotion
    side_effects: ["Promotion ACTIVE; claims_used 0"]

  - method: GET
    path: "/promotions/{id}"
    description: "Read a promotion."
    roles: [TradingOps, Bettor, ComplianceOfficer]
    code: 200
    input: []
    output: Promotion
    side_effects: []

  - method: GET
    path: "/promotions"
    description: "List promotions."
    roles: [TradingOps, Bettor, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Promotion[]
    side_effects: []

  - method: POST
    path: "/accounts/{id}/bonus-claims"
    description: "Bettor claims a promotion code -> a BonusGrant + bonus balance credit."
    roles: [Bettor]
    code: 201
    input: [promotion_id, expected_account_version]
    output: BonusGrant
    side_effects:
      - "BonusGrant ACTIVE; bonus_cents snapshot; wagering_target = bonus_cents*multiplier"
      - "BONUS_GRANT LedgerEntry (BONUS, positive) appended; bonus_balance_cents increases"
      - "Promotion.claims_used increments; EXHAUSTED when == max_claims"
      - "increments Account.version by 1"

  - method: GET
    path: "/bonus-grants/{id}"
    description: "Read a bonus grant (progress vs target)."
    roles: [Bettor, ComplianceOfficer]
    code: 200
    input: []
    output: BonusGrant
    side_effects: ["wagering_progress_cents recomputed on read"]

  - method: GET
    path: "/bonus-grants"
    description: "List bonus grants filterable by account_id (reverse lookup of BonusGrant.account_id) and promotion_id (reverse lookup of BonusGrant.promotion_id)."
    roles: [Bettor, ComplianceOfficer, TradingOps]
    code: 200
    input: ["account_id?", "promotion_id?", "status?", "limit?", "offset?"]
    output: BonusGrant[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing X-User-Role / X-User-ID on a protected endpoint" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted, or Bettor acting on an account/bet that is not their own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced account/event/market/selection/bet/promotion/grant does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body: missing required field, bad enum, non-positive cents, |american_odds| < 100" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_account_version does not match Account.version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid from-state for the requested transition" }
  - { id: ERR_UNDERAGE, http: 403, condition: "KYC verify attempted but account age < MIN_AGE_YEARS (21) at clock date" }
  - { id: ERR_KYC_NOT_VERIFIED, http: 403, condition: "Operation requires kyc_status==VERIFIED" }
  - { id: ERR_RG_SELF_EXCLUDED, http: 403, condition: "Account.rg_status==SELF_EXCLUDED; permanent block on betting/deposit/claim" }
  - { id: ERR_RG_COOLING_OFF, http: 403, condition: "Account.rg_status==COOLING_OFF (clock < cooling_off_until)" }
  - { id: ERR_GEO_INELIGIBLE, http: 403, condition: "No unexpired eligible GeoCheck for the account at placement" }
  - { id: ERR_MARKET_NOT_OPEN, http: 409, condition: "A leg's market is not OPEN or its event is not SCHEDULED / already started" }
  - { id: ERR_PARLAY_COMPOSITION_INVALID, http: 422, condition: "Leg count / event-spread does not match bet_type (SINGLE/PARLAY/SGP)" }
  - { id: ERR_DUPLICATE_LEG, http: 422, condition: "Two legs reference the same selection, or SGP has two legs on the same market" }
  - { id: ERR_WAGER_LIMIT_EXCEEDED, http: 403, condition: "Gross window stake + new stake exceeds ACTIVE WAGER_LIMIT" }
  - { id: ERR_NET_LOSS_LIMIT_EXCEEDED, http: 403, condition: "Projected net loss exceeds ACTIVE NET_LOSS_LIMIT" }
  - { id: ERR_RISK_LIMIT_EXCEEDED, http: 409, condition: "Placement would push market current_liability_cents above liability_cap_cents" }
  - { id: ERR_DEPOSIT_LIMIT_EXCEEDED, http: 403, condition: "Window deposits + new deposit exceed ACTIVE DEPOSIT_LIMIT" }
  - { id: ERR_INSUFFICIENT_FUNDS, http: 402, condition: "Stake/withdrawal exceeds available balance in the named bucket" }
  - { id: ERR_WR_NOT_MET, http: 409, condition: "Withdrawal blocked by an ACTIVE BonusGrant with unmet wagering requirement" }
  - { id: ERR_PROMO_UNAVAILABLE, http: 409, condition: "Promotion not ACTIVE, exhausted, or already claimed by this account" }
  - { id: ERR_CASHOUT_UNAVAILABLE, http: 409, condition: "Cash-out attempted while a leg's market is SUSPENDED or its event is LIVE/SETTLED" }
  - { id: ERR_LEG_ALREADY_GRADED, http: 409, condition: "Cash-out attempted after at least one leg already graded" }
  - { id: ERR_EVENT_LOCKED, http: 409, condition: "Market reopen attempted while its event is not SCHEDULED" }
  - { id: ERR_SOD_CONFLICT, http: 403, condition: "SettlementAgent posting a result whose X-User-ID matches a Market.set_by on the same event (segregation of duties)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated self-service surface: account registration only."
    identity: "opaque"
    exclusive_operations:
      - "POST /accounts — register"
    shared_operations: []

  - name: Bettor
    description: "An account holder. Acts only on their own account, bets, deposits, withdrawals, geo-checks, RG cooling/limit controls, and bonus claims. X-User-ID == Account.id."
    identity: "entity_backed:Account"
    exclusive_operations:
      - "POST /accounts/{id}/deposits"
      - "POST /accounts/{id}/withdrawals"
      - "POST /accounts/{id}/geo-checks"
      - "POST /bets"
      - "POST /bets/{id}/cash-out"
      - "POST /accounts/{id}/bonus-claims"
    shared_operations:
      - "POST /accounts/{id}/rg-controls (COOLING_OFF and limit controls; SELF_EXCLUSION is ComplianceOfficer-only)"
      - "GET /accounts/{id}, GET reads of own bets/legs/ledger/geo-checks/rg-controls/grants/markets/selections/events/promotions"

  - name: TradingOps
    description: "Trading desk: manages events, markets, lines/odds, market suspension, risk caps, and promotions. Cannot post official results (SoD) and cannot touch bettor accounts."
    identity: "opaque"
    exclusive_operations:
      - "POST /events, POST /events/{id}/status"
      - "POST /events/{id}/markets, POST /markets/{id}/status"
      - "POST /markets/{id}/selections, PATCH /selections/{id}"
      - "POST /promotions"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "GET reads of accounts/events/markets/selections/bets/legs/ledger/promotions/grants"

  - name: SettlementAgent
    description: "Official-data settlement: posts final scores and triggers grading. Segregated from the TradingOps who set the market lines on the same event."
    identity: "opaque"
    exclusive_operations:
      - "POST /events/{id}/result"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "GET reads of events/markets/selections"

  - name: ComplianceOfficer
    description: "KYC verification/rejection and responsible-gaming enforcement including permanent self-exclusion. Cannot place bets or manage trading."
    identity: "opaque"
    exclusive_operations:
      - "POST /accounts/{id}/kyc-decision"
      - "POST /accounts/{id}/rg-controls (SELF_EXCLUSION)"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "GET /accounts, GET reads of accounts/ledger/rg-controls/geo-checks/bets/grants/promotions"
