      - name: acknowledge_fatigue_cascade
        grounds:
          - state_machines.ArrhythmiaAlert.NEW_to_ACKNOWLEDGED
          - entities.Technician.fields.open_alert_load
          - calculations.alarm_fatigue_index
        distinguishing_aspect: |
          Depth-3 cascade from the acknowledge trigger (different trigger from the
          sweep cascade): alert NEW->ACKNOWLEDGED -> Technician.open_alert_load
          increments -> fatigue_index recomputed and fatigue_status flips
          NORMAL->AT_RISK exactly at the 0.60 boundary.
        test_recipe:
          setup:
            - "EVENT episode MONITORING; technician capacity 5; three ROUTINE alerts raised; two acknowledged (load 2, index 0.40)"
          setup_api_calls:
