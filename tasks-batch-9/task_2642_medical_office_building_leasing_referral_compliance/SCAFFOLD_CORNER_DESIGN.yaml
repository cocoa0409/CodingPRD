              payload: { building_id: "${m1_b_id}", suite_id: "${m1_s_id}", tenant_id: "${m1_t_id}", lease_type: "DIRECT", term_start: "2026-09-01", term_end: "2029-08-31", base_rent_psf_annual: 30.00 }
              as: LeasingAgent
              captures: { m1_l_id: $.data.id, m1_l_v: $.data.version }
            - call: "POST /leases/${m1_l_id}/appraisals"
              payload: { expected_lease_version: "${m1_l_v}", appraiser_firm: "Harbor Valuation LLC", appraisal_date: "2026-07-15", opinion_low_psf: 29.00, opinion_high_psf: 33.00, independence_attested: true }
              as: ComplianceOfficer
