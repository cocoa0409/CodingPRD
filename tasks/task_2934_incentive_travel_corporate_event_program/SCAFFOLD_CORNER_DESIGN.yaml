  - name: committed_cost_component_rounding_precision
    claim_type: precision
    grounds:
    - §1.3 qualifier_committed_cost (precision clause)
    - §0.5 combinatorial_formula mode b
    distinguishing_aspect: |
      The precision claim for the hardest calculation in §1.3 — whether each of the three rate
      components is rounded to whole cents before summation or the rates are composited and
      rounded once — is exactly the nested-rounding-order rule already designed in §1.8, down to
      the same 921765-vs-921766 one-cent divergence. A second recipe here would be a copy.
    excluded_because:
      difficulty_instance: committed_cost_rounds_each_rate_component_before_summation
      rationale: |
        That §1.8 instance is built specifically around the pinned evaluation order of the three
        ROUND_HALF_UP component roundings and asserts both the correct total and the naive
        single-composite-rate total that must not appear, which is the whole content of this
        precision claim.
  - name: tier_assignment_threshold_boundary_triplet
    claim_type: threshold
    grounds:
    - §1.3 tier_assignment_selector (algorithm threshold)
    - §1.3 taxable_award_base
    - §0.5 boundary_precision_check
    distinguishing_aspect: |
      The threshold-at / threshold-minus-one / threshold-plus-one triplet for
      tier_assignment_selector is the boundary rule already designed in §1.8, including the
      inclusive comparison at exact equality that decides QUALIFIED versus DISQUALIFIED.
    excluded_because:
      difficulty_instance: tier_qualification_threshold_is_inclusive_at_exact_equality
      rationale: |
        That §1.8 instance walks actual_metric at threshold - 1, exactly at threshold and at
        threshold + 1 across two adjacent tiers, which is precisely the boundary triplet this
        claim type asks for.
  - name: budget_rollup_running_total_crosses_the_posture_boundary_on_each_add
    claim_type: aggregation
    grounds:
    - §1.3 program_budget_rollup (algorithm aggregation, constants, posture ladder)
    - §1.2 SupplierContract PROPOSED -> EXECUTED side effects
    - §1.2 Qualifier PENDING_REVIEW -> QUALIFIED side effects
    - §1.5 GET /programs/{program_id}
    - §1.5 GET /deposit-milestones
    distinguishing_aspect: |
      Exercises the running-total-after-each-add behaviour of the aggregation algorithm on a
      budget deliberately sized to 921765 cents so that the contract-execution recompute lands
      utilization on exactly 10000 bp — the inclusive edge of BUDGET_POSTURE_OVER_BP, which must
      read WATCH and not OVERCOMMITTED — and the next add tips it over. It also pins the one
      asymmetry of the ladder: requires_finance_review is stamped only by the execution cascade,
      so a program that becomes OVERCOMMITTED afterwards never acquires the flag. The §1.8
      compensating-invariant instance walks confirm/cancel conservation instead and never touches
      the posture boundary or the finance-review flag.
