      - GlassOrder.${go}.state is unchanged at ORDERED and last_risk_computed_at == 2026-10-01T08:00:00Z
      - a fabrication release naming ${go} now returns ERR_GLASS_RISK_THRESHOLD_EXCEEDED (422)
