  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_allocation_run_stale_terminal_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[allocation-run-create-stale-terminal]", "errors[ERR_STALE_TERMINAL_VERSION]"]
        distinguishing_aspect: "OCC on Terminal.version: a second POST /allocation-runs carrying the pre-first-create version is rejected 412; with the refreshed version it succeeds and supersedes run1."
        test_recipe:
          setup: ["terminal (version 1)"]
          setup_api_calls:
            - call: "POST /terminals"
              payload: { name: "T-O1", region_code: "NE", storage_capacity_gal: 1000000, reserve_floor_gal: 50000, winter_reserve_floor_gal: 150000, rack_bay_count: 2 }
              as: SupplyAdmin
              captures: { term: $.data.id, t_v: $.data.version }
            - call: "POST /allocation-runs"
              payload: { terminal_id: "${term}", expected_terminal_version: "${t_v}" }
              as: SupplyPlanner
              captures: { run1: $.data.id }
          trigger:
            - call: "POST /allocation-runs"
              payload: { terminal_id: "${term}", expected_terminal_version: "${t_v}" }
              as: SupplyPlanner
              captures: { err: $.data.error_id }
            - { call: "GET /terminals/${term}", as: SupplyPlanner, captures: { t_v2: $.data.version } }
            - call: "POST /allocation-runs"
              payload: { terminal_id: "${term}", expected_terminal_version: "${t_v2}" }
              as: SupplyPlanner
              captures: { run2: $.data.id }
          assert:
            - "stale create: error_id == ERR_STALE_TERMINAL_VERSION (http 412)"
            - "fresh create succeeds: AllocationRun.${run2}.status == OPEN and run1 is SUPERSEDED"
      - name: occ_contract_activate_stale_dealer_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[dealer-contract-activate-stale-dealer]", "errors[ERR_STALE_DEALER_VERSION]"]
        distinguishing_aspect: "OCC on Dealer.version: activating contract2 with the version captured before contract1's activation is rejected 412; the two sequential activations would otherwise both legitimately supersede."
        test_recipe:
          setup: ["terminal; dealer (version 1); two DRAFT FIXED contracts C1, C2 for the same dealer+terminal with overlapping windows"]
          setup_api_calls:
            - call: "POST /terminals"
              payload: { name: "T-O2", region_code: "NE", storage_capacity_gal: 1000000, reserve_floor_gal: 50000, winter_reserve_floor_gal: 150000, rack_bay_count: 2 }
              as: SupplyAdmin
              captures: { term: $.data.id }
            - call: "POST /dealers"
              payload: { legal_name: "Dealer O2", credit_limit_cents: 100000000 }
              as: CreditManager
              captures: { dl: $.data.id, dl_v: $.data.version }
            - call: "POST /dealer-contracts"
              payload: { dealer_id: "${dl}", terminal_id: "${term}", pricing_mode: "FIXED", fixed_price_mc_per_gal: 90000, volume_committed_gal: 100000, window_start: "2026-08-01", window_end: "2027-03-31" }
              as: CreditManager
              captures: { dc1: $.data.id }
            - call: "POST /dealer-contracts"
              payload: { dealer_id: "${dl}", terminal_id: "${term}", pricing_mode: "FIXED", fixed_price_mc_per_gal: 91000, volume_committed_gal: 50000, window_start: "2026-08-01", window_end: "2027-03-31" }
              as: CreditManager
              captures: { dc2: $.data.id }
            - { call: "POST /dealer-contracts/${dc1}/activate", payload: { expected_dealer_version: "${dl_v}" }, as: CreditManager }
          trigger:
            - call: "POST /dealer-contracts/${dc2}/activate"
              payload: { expected_dealer_version: "${dl_v}" }
              as: CreditManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_DEALER_VERSION (http 412): dealer.version moved 1 -> 2 when C1 activated"
            - "DealerContract.${dc2}.status stays DRAFT; ${dc1} stays ACTIVE"
      - name: cold_snap_cascade_layer_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds: [state_machines.Terminal.NORMAL_to_CURTAILED, state_machines.DealerPayment.POSTED_to_RETURNED]
        excluded_because:
          difficulty_instance: cold_snap_activation_repricing_to_credit_flip
          rationale: "Both cascade chains (activation repricing, payment-return reversal) are asserted end-to-end in the named §1.8 instance and payment_return_reverses_invoices_to_suspension."
      - name: dual_variant_layer_covered_by_difficulty
        claim_type: dual_variant_calculation
        grounds: [calculations.delivered_price, calculations.dealer_credit_exposure]
        excluded_because:
          difficulty_instance: index_order_provisional_vs_final_diverge
          rationale: "Both dual-variant calculations are asserted with literal divergent values in the named §1.8 instance and dealer_exposure_ledger_vs_committed_diverge."

