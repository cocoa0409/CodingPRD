scaffold_difficulty_design:
  # ==========================================================================
  # Rule 1 — dual_variant_calc (different entity domains: Indicator vs DataQualityAudit)
  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: indicator_attainment_provisional_vs_final
        grounds:
          - calculations.indicator_attainment
          - entities.Observation.fields.review_status
        distinguishing_aspect: |
          On the Indicator domain, the FINAL variant (VALIDATED only) yields
          aggregated_value 80.00 / attainment 80.00 / band YELLOW while the
          PROVISIONAL variant (PENDING + VALIDATED) over identical stored data
          yields 50.00 / 50.00 / RED — same inputs, two valid answers.
        test_recipe:
          setup:
            - "Program ACTIVE with APPROVED logic model holding indicator I1 (HIGHER_IS_BETTER, baseline 0, target 100)"
            - "Cycle ACTIVE with pinned model; participant P-001 ACTIVE with CURRENT consent"
            - "Instrument SURV PUBLISHED; collector collector-1 certified"
            - "obs1 value 80 VALIDATED; obs2 value 20 PENDING"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Literacy", code: "LIT" }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/activate"
              payload: {}
              as: ProgramDirector
            - call: "POST /programs/${prog}/logic-models"
              payload: { title: "LM1" }
              as: EvaluationLead
              captures: { lm: $.data.id }
            - call: "POST /logic-models/${lm}/indicators"
              payload: { code: "I1", level: "OUTCOME", unit: "SCORE", direction: "HIGHER_IS_BETTER", baseline_value: 0, target_value: 100, weight: 1.0, measurement_frequency: "PER_EVENT" }
              as: EvaluationLead
              captures: { ind1: $.data.id }
            - call: "POST /logic-models/${lm}/submit"
              payload: {}
              as: EvaluationLead
            - call: "GET /programs/${prog}"
              payload: {}
              as: ProgramDirector
              captures: { prog_v: $.data.version }
            - call: "POST /logic-models/${lm}/approve"
              payload: { expected_program_version: "${prog_v}" }
              as: EvaluationLead
            - call: "POST /programs/${prog}/cycles"
              payload: { label: "C1", enrollment_start: "2026-08-01T00:00:00Z", enrollment_end: "2026-08-31T23:59:59Z", cycle_start: "2026-09-01T00:00:00Z", cycle_end: "2026-09-30T23:59:59Z", reporting_due_date: "2026-10-15T00:00:00Z" }
              as: ProgramDirector
              captures: { cyc: $.data.id }
            - call: "POST /cycles/${cyc}/open-enrollment"
              payload: {}
              as: ProgramDirector
            - call: "POST /cycles/${cyc}/activate"
              payload: {}
              as: ProgramDirector
            - call: "POST /cycles/${cyc}/participants"
              payload: { external_ref: "P-001" }
              as: ProgramDirector
              captures: { p1: $.data.id }
            - call: "POST /participants/${p1}/consents"
              payload: { form_version: 1, scope: "FULL", expires_at: "2027-01-01T00:00:00Z" }
              as: PrivacyOfficer
            - call: "POST /programs/${prog}/instruments"
              payload: { code: "SURV", title: "Survey" }
              as: EvaluationLead
              captures: { instr: $.data.id }
            - call: "POST /instruments/${instr}/publish"
              payload: {}
              as: EvaluationLead
            - call: "POST /certifications"
              payload: { staff_user_id: "collector-1", instrument_id: "${instr}", expires_at: "2027-01-01T00:00:00Z" }
              as: EvaluationLead
            - call: "POST /participants/${p1}/observations"
              payload: { indicator_id: "${ind1}", instrument_id: "${instr}", value: 80, collected_at: "2026-09-05T00:00:00Z" }
              as: FieldCollector
              as_user_id: "collector-1"
              captures: { obs1: $.data.id }
            - call: "POST /observations/${obs1}/validate"
              payload: {}
              as: DataSteward
              as_user_id: "steward-1"
            - call: "POST /participants/${p1}/observations"
              payload: { indicator_id: "${ind1}", instrument_id: "${instr}", value: 20, collected_at: "2026-09-06T00:00:00Z" }
              as: FieldCollector
              as_user_id: "collector-1"
          trigger:
            - call: "GET /indicators/${ind1}/attainment"
              payload: { program_cycle_id: "${cyc}", variant: "FINAL" }
              as: DataSteward
              captures: { fin_agg: $.data.aggregated_value, fin_att: $.data.attainment_pct, fin_band: $.data.band, fin_n: $.data.observation_count }
            - call: "GET /indicators/${ind1}/attainment"
              payload: { program_cycle_id: "${cyc}", variant: "PROVISIONAL" }
              as: DataSteward
              captures: { pro_agg: $.data.aggregated_value, pro_att: $.data.attainment_pct, pro_band: $.data.band, pro_n: $.data.observation_count }
          assert:
            - "FINAL: aggregated_value == 80.00, attainment_pct == 80.00, band == YELLOW, observation_count == 1"
            - "PROVISIONAL: aggregated_value == 50.00, attainment_pct == 50.00, band == RED, observation_count == 2"

      - name: dq_score_standard_vs_strict
        grounds:
          - calculations.dq_score
          - entities.Observation.fields.is_late
        distinguishing_aspect: |
          On the DataQualityAudit/dashboard domain, the STANDARD variant counts
          a late PENDING observation in the validated_pct denominator (dq 85.00)
          while the STRICT variant drops late observations from numerator and
          denominator (dq 100.00) over identical stored data.
        test_recipe:
          setup:
            - "Program ACTIVE; model with one indicator I1 (HIGHER 0->100); cycle ACTIVE (cycle_end 2026-09-30T23:59:59Z)"
            - "Participant P-001 ACTIVE with CURRENT consent; instrument published; collector certified"
            - "obs A value 100 recorded at 2026-09-01 (not late) and VALIDATED"
            - "obs B value 50 recorded at 2026-10-05 (after cycle_end, is_late true), left PENDING"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Health", code: "HLT" }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/activate"
              payload: {}
              as: ProgramDirector
            - call: "POST /programs/${prog}/logic-models"
              payload: { title: "LM1" }
              as: EvaluationLead
              captures: { lm: $.data.id }
            - call: "POST /logic-models/${lm}/indicators"
              payload: { code: "I1", level: "OUTCOME", unit: "SCORE", direction: "HIGHER_IS_BETTER", baseline_value: 0, target_value: 100, weight: 1.0, measurement_frequency: "PER_EVENT" }
              as: EvaluationLead
              captures: { ind1: $.data.id }
            - call: "POST /logic-models/${lm}/submit"
              payload: {}
              as: EvaluationLead
            - call: "GET /programs/${prog}"
              payload: {}
              as: ProgramDirector
              captures: { prog_v: $.data.version }
            - call: "POST /logic-models/${lm}/approve"
              payload: { expected_program_version: "${prog_v}" }
              as: EvaluationLead
            - call: "POST /programs/${prog}/cycles"
              payload: { label: "C1", enrollment_start: "2026-08-01T00:00:00Z", enrollment_end: "2026-08-31T23:59:59Z", cycle_start: "2026-09-01T00:00:00Z", cycle_end: "2026-09-30T23:59:59Z", reporting_due_date: "2026-10-15T00:00:00Z" }
              as: ProgramDirector
              captures: { cyc: $.data.id }
            - call: "POST /cycles/${cyc}/open-enrollment"
              payload: {}
              as: ProgramDirector
            - call: "POST /cycles/${cyc}/activate"
              payload: {}
              as: ProgramDirector
            - call: "POST /cycles/${cyc}/participants"
              payload: { external_ref: "P-001" }
              as: ProgramDirector
              captures: { p1: $.data.id }
            - call: "POST /participants/${p1}/consents"
              payload: { form_version: 1, scope: "FULL", expires_at: "2027-01-01T00:00:00Z" }
              as: PrivacyOfficer
            - call: "POST /programs/${prog}/instruments"
              payload: { code: "SURV", title: "Survey" }
              as: EvaluationLead
              captures: { instr: $.data.id }
            - call: "POST /instruments/${instr}/publish"
              payload: {}
              as: EvaluationLead
            - call: "POST /certifications"
              payload: { staff_user_id: "collector-1", instrument_id: "${instr}", expires_at: "2027-01-01T00:00:00Z" }
              as: EvaluationLead
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /participants/${p1}/observations"
              payload: { indicator_id: "${ind1}", instrument_id: "${instr}", value: 100, collected_at: "2026-09-01T00:00:00Z" }
              as: FieldCollector
              as_user_id: "collector-1"
              captures: { obsA: $.data.id }
            - call: "POST /observations/${obsA}/validate"
              payload: {}
              as: DataSteward
              as_user_id: "steward-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-05T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /participants/${p1}/observations"
              payload: { indicator_id: "${ind1}", instrument_id: "${instr}", value: 50, collected_at: "2026-10-05T00:00:00Z" }
              as: FieldCollector
              as_user_id: "collector-1"
              captures: { obsB: $.data.id }
          trigger:
            - call: "GET /cycles/${cyc}/dashboard"
              payload: {}
              as: DataSteward
              captures: { dq_std: $.data.dq_score_standard, dq_strict: $.data.dq_score_strict }
            - call: "GET /observations/${obsB}"
              payload: {}
              as: DataSteward
              captures: { obsB_late: $.data.is_late }
          assert:
            - "dashboard.dq_score_standard == 85.00 (C=100.00, V=50.00, K=100.00, F=0)"
            - "dashboard.dq_score_strict == 100.00 (late obs B dropped from V numerator and denominator)"
            - "obsB.is_late == true"

  # ==========================================================================
  # Rule 2 — combinatorial_formula (three different modes: a, b, c)
  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: attainment_direction_clamp_zero_guard
        grounds:
          - calculations.indicator_attainment
          - calculations.attainment_band
        distinguishing_aspect: |
          Mode (a): the attainment formula branches on direction, applies a
          zero-guard when target == baseline, and clamps to [0,150] — three
          interacting non-linearities producing 75.00 (LOWER, agg 40), 125.00
          (LOWER, agg 0, over-target but under cap) and 100.00 (zero-guard hit).
        test_recipe:
          setup:
            - "Program ACTIVE; cycle ACTIVE; participant ACTIVE with consent; instrument published; collector certified"
            - "Model with indicators: L1 LOWER_IS_BETTER baseline 100 target 20 (obs 40 VALIDATED); L2 LOWER 100->20 (obs 0 VALIDATED); G1 HIGHER baseline 50 target 50 (obs 50 VALIDATED)"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Shelter", code: "SHL" }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/activate"
              payload: {}
              as: ProgramDirector
            - call: "POST /programs/${prog}/logic-models"
              payload: { title: "LM1" }
              as: EvaluationLead
              captures: { lm: $.data.id }
            - call: "POST /logic-models/${lm}/indicators"
              payload: { code: "L1", level: "OUTCOME", unit: "COUNT", direction: "LOWER_IS_BETTER", baseline_value: 100, target_value: 20, weight: 1.0, measurement_frequency: "PER_EVENT" }
              as: EvaluationLead
              captures: { indL1: $.data.id }
            - call: "POST /logic-models/${lm}/indicators"
              payload: { code: "L2", level: "OUTCOME", unit: "COUNT", direction: "LOWER_IS_BETTER", baseline_value: 100, target_value: 20, weight: 1.0, measurement_frequency: "PER_EVENT" }
              as: EvaluationLead
              captures: { indL2: $.data.id }
            - call: "POST /logic-models/${lm}/indicators"
              payload: { code: "G1", level: "OUTPUT", unit: "COUNT", direction: "HIGHER_IS_BETTER", baseline_value: 50, target_value: 50, weight: 1.0, measurement_frequency: "PER_EVENT" }
              as: EvaluationLead
              captures: { indG1: $.data.id }
            - call: "POST /logic-models/${lm}/submit"
              payload: {}
              as: EvaluationLead
            - call: "GET /programs/${prog}"
              payload: {}
              as: ProgramDirector
              captures: { prog_v: $.data.version }
            - call: "POST /logic-models/${lm}/approve"
              payload: { expected_program_version: "${prog_v}" }
              as: EvaluationLead
            - call: "POST /programs/${prog}/cycles"
              payload: { label: "C1", enrollment_start: "2026-08-01T00:00:00Z", enrollment_end: "2026-08-31T23:59:59Z", cycle_start: "2026-09-01T00:00:00Z", cycle_end: "2026-09-30T23:59:59Z", reporting_due_date: "2026-10-15T00:00:00Z" }
              as: ProgramDirector
              captures: { cyc: $.data.id }
            - call: "POST /cycles/${cyc}/open-enrollment"
              payload: {}
              as: ProgramDirector
            - call: "POST /cycles/${cyc}/activate"
              payload: {}
              as: ProgramDirector
            - call: "POST /cycles/${cyc}/participants"
              payload: { external_ref: "P-001" }
              as: ProgramDirector
              captures: { p1: $.data.id }
            - call: "POST /participants/${p1}/consents"
              payload: { form_version: 1, scope: "FULL", expires_at: "2027-01-01T00:00:00Z" }
              as: PrivacyOfficer
            - call: "POST /programs/${prog}/instruments"
              payload: { code: "SURV", title: "Survey" }
              as: EvaluationLead
              captures: { instr: $.data.id }
            - call: "POST /instruments/${instr}/publish"
              payload: {}
              as: EvaluationLead
            - call: "POST /certifications"
              payload: { staff_user_id: "collector-1", instrument_id: "${instr}", expires_at: "2027-01-01T00:00:00Z" }
              as: EvaluationLead
            - call: "POST /participants/${p1}/observations"
              payload: { indicator_id: "${indL1}", instrument_id: "${instr}", value: 40, collected_at: "2026-09-05T00:00:00Z" }
              as: FieldCollector
              as_user_id: "collector-1"
              captures: { o1: $.data.id }
            - call: "POST /observations/${o1}/validate"
              payload: {}
              as: DataSteward
              as_user_id: "steward-1"
            - call: "POST /participants/${p1}/observations"
              payload: { indicator_id: "${indL2}", instrument_id: "${instr}", value: 0, collected_at: "2026-09-05T00:00:00Z" }
              as: FieldCollector
              as_user_id: "collector-1"
              captures: { o2: $.data.id }
            - call: "POST /observations/${o2}/validate"
              payload: {}
              as: DataSteward
              as_user_id: "steward-1"
            - call: "POST /participants/${p1}/observations"
              payload: { indicator_id: "${indG1}", instrument_id: "${instr}", value: 50, collected_at: "2026-09-05T00:00:00Z" }
              as: FieldCollector
              as_user_id: "collector-1"
              captures: { o3: $.data.id }
            - call: "POST /observations/${o3}/validate"
              payload: {}
              as: DataSteward
              as_user_id: "steward-1"
          trigger:
            - call: "GET /indicators/${indL1}/attainment"
              payload: { program_cycle_id: "${cyc}", variant: "FINAL" }
              as: DataSteward
            - call: "GET /indicators/${indL2}/attainment"
              payload: { program_cycle_id: "${cyc}", variant: "FINAL" }
              as: DataSteward
            - call: "GET /indicators/${indG1}/attainment"
              payload: { program_cycle_id: "${cyc}", variant: "FINAL" }
              as: DataSteward
          assert:
            - "L1 (LOWER, agg 40): attainment_pct == 75.00, band == YELLOW"
            - "L2 (LOWER, agg 0): attainment_pct == 125.00 (over-target, within cap 150), band == GREEN"
            - "G1 (target == baseline == 50, agg 50): zero-guard fires, attainment_pct == 100.00, band == GREEN"

      - name: impact_index_per_term_rounding
        grounds:
          - calculations.overall_impact_index
        distinguishing_aspect: |
          Mode (b): the scaffold pins round-per-term-then-sum — per-term rounded
          products 0.13 + 0.13 + 49.00 give index 49.26, whereas sum-then-round
          over exact products (0.125 + 0.125 + 49.00) would give 49.25; the two
          rounding orders diverge by one cent.
        test_recipe:
          setup:
            - "Program ACTIVE; cycle ACTIVE; participant ACTIVE with consent; instrument published; collector certified"
            - "Indicators W1 (weight 0.01), W2 (weight 0.01), W3 (weight 0.98), all HIGHER 0->100"
            - "Observations 12.5 (W1), 12.5 (W2), 50 (W3), all VALIDATED"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Jobs", code: "JOB" }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/activate"
              payload: {}
              as: ProgramDirector
            - call: "POST /programs/${prog}/logic-models"
              payload: { title: "LM1" }
              as: EvaluationLead
              captures: { lm: $.data.id }
            - call: "POST /logic-models/${lm}/indicators"
              payload: { code: "W1", level: "IMPACT", unit: "SCORE", direction: "HIGHER_IS_BETTER", baseline_value: 0, target_value: 100, weight: 0.01, measurement_frequency: "PER_EVENT" }
              as: EvaluationLead
              captures: { indW1: $.data.id }
            - call: "POST /logic-models/${lm}/indicators"
              payload: { code: "W2", level: "IMPACT", unit: "SCORE", direction: "HIGHER_IS_BETTER", baseline_value: 0, target_value: 100, weight: 0.01, measurement_frequency: "PER_EVENT" }
              as: EvaluationLead
              captures: { indW2: $.data.id }
            - call: "POST /logic-models/${lm}/indicators"
              payload: { code: "W3", level: "IMPACT", unit: "SCORE", direction: "HIGHER_IS_BETTER", baseline_value: 0, target_value: 100, weight: 0.98, measurement_frequency: "PER_EVENT" }
              as: EvaluationLead
              captures: { indW3: $.data.id }
            - call: "POST /logic-models/${lm}/submit"
              payload: {}
              as: EvaluationLead
            - call: "GET /programs/${prog}"
              payload: {}
              as: ProgramDirector
              captures: { prog_v: $.data.version }
            - call: "POST /logic-models/${lm}/approve"
              payload: { expected_program_version: "${prog_v}" }
              as: EvaluationLead
            - call: "POST /programs/${prog}/cycles"
              payload: { label: "C1", enrollment_start: "2026-08-01T00:00:00Z", enrollment_end: "2026-08-31T23:59:59Z", cycle_start: "2026-09-01T00:00:00Z", cycle_end: "2026-09-30T23:59:59Z", reporting_due_date: "2026-10-15T00:00:00Z" }
              as: ProgramDirector
              captures: { cyc: $.data.id }
            - call: "POST /cycles/${cyc}/open-enrollment"
              payload: {}
              as: ProgramDirector
            - call: "POST /cycles/${cyc}/activate"
              payload: {}
              as: ProgramDirector
            - call: "POST /cycles/${cyc}/participants"
              payload: { external_ref: "P-001" }
              as: ProgramDirector
              captures: { p1: $.data.id }
            - call: "POST /participants/${p1}/consents"
              payload: { form_version: 1, scope: "FULL", expires_at: "2027-01-01T00:00:00Z" }
              as: PrivacyOfficer
            - call: "POST /programs/${prog}/instruments"
              payload: { code: "SURV", title: "Survey" }
              as: EvaluationLead
              captures: { instr: $.data.id }
            - call: "POST /instruments/${instr}/publish"
              payload: {}
              as: EvaluationLead
            - call: "POST /certifications"
              payload: { staff_user_id: "collector-1", instrument_id: "${instr}", expires_at: "2027-01-01T00:00:00Z" }
              as: EvaluationLead
            - call: "POST /participants/${p1}/observations"
              payload: { indicator_id: "${indW1}", instrument_id: "${instr}", value: 12.5, collected_at: "2026-09-05T00:00:00Z" }
              as: FieldCollector
              as_user_id: "collector-1"
              captures: { o1: $.data.id }
            - call: "POST /observations/${o1}/validate"
              payload: {}
              as: DataSteward
              as_user_id: "steward-1"
            - call: "POST /participants/${p1}/observations"
              payload: { indicator_id: "${indW2}", instrument_id: "${instr}", value: 12.5, collected_at: "2026-09-05T00:00:00Z" }
              as: FieldCollector
              as_user_id: "collector-1"
              captures: { o2: $.data.id }
            - call: "POST /observations/${o2}/validate"
              payload: {}
              as: DataSteward
              as_user_id: "steward-1"
            - call: "POST /participants/${p1}/observations"
              payload: { indicator_id: "${indW3}", instrument_id: "${instr}", value: 50, collected_at: "2026-09-05T00:00:00Z" }
              as: FieldCollector
              as_user_id: "collector-1"
              captures: { o3: $.data.id }
            - call: "POST /observations/${o3}/validate"
              payload: {}
              as: DataSteward
              as_user_id: "steward-1"
          trigger:
            - call: "GET /cycles/${cyc}/dashboard"
              payload: {}
              as: EvaluationLead
              captures: { idx: $.data.overall_impact_index }
          assert:
            - "dashboard.overall_impact_index == 49.26 (per-term rounding: round(12.50*0.01,2)=0.13 twice plus round(50.00*0.98,2)=49.00, sum 49.26 over weight_sum 1.00)"
            - "the alternative sum-then-round order would produce 49.25 and MUST NOT be what the API returns"

      - name: dq_evaluation_order_on_finding_waive
        grounds:
          - calculations.dq_score
          - state_machines.AuditFinding.OPEN_to_WAIVED
        distinguishing_aspect: |
          Mode (c): dq_score has a circular-looking dependency (findings
          penalize the score, and resolving a finding is itself the mutation
          that triggers recomputation); the pinned evaluation order — apply
          resolution first, then count OPEN findings — means a waived finding
          does not penalize the recompute its own waive triggers (96.00 with
          the finding OPEN, 100.00 immediately after waiving it).
        test_recipe:
          setup:
            - "Program ACTIVE; cycle DATA_CLOSED; one participant COMPLETED; one VALIDATED observation covering the single ACTIVE indicator"
            - "Audit open with dq_score 100.00; one MISSING_DATA finding recorded -> dq_score 96.00"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Meals", code: "MLS" }
              as: ProgramDirector
              captures: { prog: $.data.id }
            - call: "POST /programs/${prog}/activate"
              payload: {}
              as: ProgramDirector
            - call: "POST /programs/${prog}/logic-models"
              payload: { title: "LM1" }
              as: EvaluationLead
              captures: { lm: $.data.id }
            - call: "POST /logic-models/${lm}/indicators"
              payload: { code: "I1", level: "OUTPUT", unit: "COUNT", direction: "HIGHER_IS_BETTER", baseline_value: 0, target_value: 100, weight: 1.0, measurement_frequency: "END_OF_CYCLE" }
              as: EvaluationLead
              captures: { ind1: $.data.id }
            - call: "POST /logic-models/${lm}/submit"
              payload: {}
              as: EvaluationLead
            - call: "GET /programs/${prog}"
              payload: {}
              as: ProgramDirector
              captures: { prog_v: $.data.version }
            - call: "POST /logic-models/${lm}/approve"
              payload: { expected_program_version: "${prog_v}" }
              as: EvaluationLead
            - call: "POST /programs/${prog}/cycles"
              payload: { label: "C1", enrollment_start: "2026-08-01T00:00:00Z", enrollment_end: "2026-08-31T23:59:59Z", cycle_start: "2026-09-01T00:00:00Z", cycle_end: "2026-09-30T23:59:59Z", reporting_due_date: "2026-10-15T00:00:00Z" }
              as: ProgramDirector
