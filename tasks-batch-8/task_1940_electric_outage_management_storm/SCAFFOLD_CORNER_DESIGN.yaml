# =============================================================================
# Task 1940 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty
# Tests). Breadth walk over §1.1–§1.7 per the claim-extraction guide taxonomy.
# excluded_because stubs cite the §1.8 instance that already covers the claim.
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: outage_create_success_initial_state_and_system_fields
        claim_type: creation
        grounds:
          - entities.Outage
          - state_machines.Outage
        distinguishing_aspect: "POST /om/outages with valid body returns 201; server mints id/created_at/version=1, forces outage_status=SUSPECTED, current_etr=null, etr_missed=false."
        test_recipe:
          setup: ["Clock 2026-08-10T00:00:00Z; event ACTIVE; feeder exists"]
          setup_api_calls:
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EmergencyDirector }
            - call: "POST /om/storm-events"
              payload: { event_name: "Storm C1", event_type: "TORNADO" }
              as: EmergencyDirector
              captures: { ev_id: $.data.id }
            - { call: "POST /om/storm-events/${ev_id}/activate", payload: {}, as: EmergencyDirector }
            - call: "POST /om/feeders"
              payload: { feeder_code: "FDR-1", county_code: "C1", service_customer_count: 1000 }
              as: EmergencyDirector
              captures: { fd_id: $.data.id }
          trigger:
            - { call: "POST /om/outages", payload: { storm_event_id: "${ev_id}", feeder_id: "${fd_id}" }, as: Dispatcher, captures: { ot: $.data.id, st: $.data.outage_status, v: $.data.version, etr: $.data.current_etr } }
          assert:
            - "${st} == SUSPECTED (initial state), ${v} == 1, ${etr} == null, customers_affected == null"
            - "response carries server-minted id (UUID without type prefix), created_at == \"2026-08-10T00:00:00Z\" from the logical clock"

      - name: outage_create_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Outage.fields.feeder_id
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting required field feeder_id yields 400 ERR_INVALID_REQUEST and creates nothing."
        test_recipe:
          setup: ["Event ACTIVE exists"]
          setup_api_calls:
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EmergencyDirector }
            - call: "POST /om/storm-events"
              payload: { event_name: "Storm C2", event_type: "TORNADO" }
              as: EmergencyDirector
              captures: { ev_id: $.data.id }
            - { call: "POST /om/storm-events/${ev_id}/activate", payload: {}, as: EmergencyDirector }
          trigger:
            - { call: "POST /om/outages", payload: { storm_event_id: "${ev_id}" }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST; GET /om/outages?storm_event_id=${ev_id} returns total_count 0"

      - name: feeder_threshold_defaults_applied
        claim_type: defaults
        grounds:
          - entities.Feeder.fields.cluster_signal_threshold
          - entities.Feeder.fields.cluster_call_threshold
        distinguishing_aspect: "Omitting both clustering thresholds applies defaults 3 (last-gasp) and 5 (calls)."
        test_recipe:
          setup: ["Clock set"]
          setup_api_calls:
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EmergencyDirector }
          trigger:
            - { call: "POST /om/feeders", payload: { feeder_code: "FDR-D", county_code: "C9", service_customer_count: 500 }, as: EmergencyDirector, captures: { sig_t: $.data.cluster_signal_threshold, call_t: $.data.cluster_call_threshold } }
          assert:
            - "${sig_t} == 3 and ${call_t} == 5"

      - name: priority_customer_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.PriorityCustomer.fields.priority_class
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "priority_class outside {LIFE_SUPPORT, CRITICAL_FACILITY} is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Feeder exists"]
          setup_api_calls:
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EmergencyDirector }
            - call: "POST /om/feeders"
              payload: { feeder_code: "FDR-1", county_code: "C1", service_customer_count: 1000 }
              as: EmergencyDirector
              captures: { fd_id: $.data.id }
          trigger:
            - { call: "POST /om/priority-customers", payload: { account_ref: "A-1", priority_class: "VIP", feeder_id: "${fd_id}" }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST"

      - name: trouble_signal_immutable_event_entity_shape
        claim_type: immutability
        grounds:
          - entities.TroubleSignal
        distinguishing_aspect: "common_fields:false event entity: ingest response exposes id and created_at but NO version or updated_at keys, and no update endpoint exists in §1.5."
        test_recipe:
          setup: ["Feeder exists; clock 2026-08-10T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EmergencyDirector }
            - call: "POST /om/feeders"
              payload: { feeder_code: "FDR-1", county_code: "C1", service_customer_count: 1000 }
              as: EmergencyDirector
              captures: { fd_id: $.data.id }
          trigger:
            - { call: "POST /om/trouble-signals", payload: { signal_type: "CUSTOMER_CALL", feeder_id: "${fd_id}", occurred_at: "2026-08-10T00:00:00Z" }, as: TelemetryGateway, captures: { disp: $.data.disposition } }
          assert:
            - "${disp} == UNCLUSTERED"
            - "response data contains id and created_at keys and does NOT contain version or updated_at keys"

      - name: outage_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EmergencyDirector }
          trigger:
            - { call: "GET /om/outages/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_NOT_FOUND with http 404"

      - name: storm_events_list_pagination_envelope
        claim_type: listing
        grounds:
          - response_envelope
        distinguishing_aspect: "List response carries pagination_fields limit/offset/total_count/has_more with defaults limit=10 offset=0."
        test_recipe:
          setup: ["One event exists"]
          setup_api_calls:
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EmergencyDirector }
            - { call: "POST /om/storm-events", payload: { event_name: "Storm C3", event_type: "HURRICANE" }, as: EmergencyDirector }
          trigger:
            - { call: "GET /om/storm-events", payload: {}, as: Dispatcher }
          assert:
            - "response data is an array of length 1; pagination block shows limit == 10, offset == 0, total_count == 1, has_more == false"
            - "envelope carries meta.api_request_id and meta.api_request_timestamp, response_type == \"array\""

      - name: outage_create_computed_field_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Outage.fields.priority_score
        distinguishing_aspect: "Client-supplied values for computed fields (priority_score) are ignored, never stored."
        test_recipe:
          setup: ["Event ACTIVE; feeder exists"]
          setup_api_calls:
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EmergencyDirector }
            - call: "POST /om/storm-events"
              payload: { event_name: "Storm C4", event_type: "HURRICANE" }
              as: EmergencyDirector
              captures: { ev_id: $.data.id }
            - { call: "POST /om/storm-events/${ev_id}/activate", payload: {}, as: EmergencyDirector }
            - call: "POST /om/feeders"
              payload: { feeder_code: "FDR-1", county_code: "C1", service_customer_count: 1000 }
              as: EmergencyDirector
              captures: { fd_id: $.data.id }
          trigger:
            - { call: "POST /om/outages", payload: { storm_event_id: "${ev_id}", feeder_id: "${fd_id}", priority_score: 999 }, as: Dispatcher, captures: { ot: $.data.id } }
          assert:
            - "201 created; GET /om/outages/${ot}.priority_score != 999 (computed field recomputed, input ignored)"

      - name: nested_outage_under_terminal_parent_rejected
        claim_type: parent_relationships
        grounds:
          - entities.Outage.fields.parent_outage_id
          - errors[ERR_PARENT_OUTAGE_TERMINAL]
        distinguishing_aspect: "parent_outage_id referencing a CANCELLED parent is rejected with ERR_PARENT_OUTAGE_TERMINAL (late-discovered damage under a closed parent must open a new root outage)."
        test_recipe:
          setup: ["Event ACTIVE; feeder; parent outage created then cancelled from SUSPECTED"]
          setup_api_calls:
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EmergencyDirector }
            - call: "POST /om/storm-events"
              payload: { event_name: "Storm C5", event_type: "HURRICANE" }
              as: EmergencyDirector
              captures: { ev_id: $.data.id }
            - { call: "POST /om/storm-events/${ev_id}/activate", payload: {}, as: EmergencyDirector }
            - call: "POST /om/feeders"
              payload: { feeder_code: "FDR-1", county_code: "C1", service_customer_count: 1000 }
              as: EmergencyDirector
              captures: { fd_id: $.data.id }
            - call: "POST /om/outages"
              payload: { storm_event_id: "${ev_id}", feeder_id: "${fd_id}" }
              as: Dispatcher
              captures: { op: $.data.id }
            - { call: "POST /om/outages/${op}/cancel", payload: {}, as: Dispatcher }
          trigger:
            - { call: "POST /om/outages", payload: { storm_event_id: "${ev_id}", feeder_id: "${fd_id}", parent_outage_id: "${op}" }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_PARENT_OUTAGE_TERMINAL"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: event_close_from_active_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.StormEvent
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "ACTIVE -> CLOSED skips DEMOBILIZING and must be rejected."
        test_recipe:
          setup: ["Event ACTIVE"]
          setup_api_calls:
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EmergencyDirector }
            - call: "POST /om/storm-events"
              payload: { event_name: "Storm S1", event_type: "HURRICANE" }
              as: EmergencyDirector
              captures: { ev_id: $.data.id }
            - { call: "POST /om/storm-events/${ev_id}/activate", payload: {}, as: EmergencyDirector }
          trigger:
            - { call: "POST /om/storm-events/${ev_id}/close", payload: {}, as: EmergencyDirector, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE_TRANSITION; event remains ACTIVE"

      - name: event_demobilize_blocked_by_open_outage
        claim_type: precondition_enforcement
        grounds:
          - state_machines.StormEvent.ACTIVE_to_DEMOBILIZING
          - errors[ERR_EVENT_HAS_OPEN_WORK]
        distinguishing_aspect: "A single SUSPECTED outage blocks demobilization with ERR_EVENT_HAS_OPEN_WORK."
        test_recipe:
          setup: ["Event ACTIVE with one SUSPECTED outage"]
          setup_api_calls:
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EmergencyDirector }
            - call: "POST /om/storm-events"
              payload: { event_name: "Storm S2", event_type: "HURRICANE" }
              as: EmergencyDirector
              captures: { ev_id: $.data.id }
            - { call: "POST /om/storm-events/${ev_id}/activate", payload: {}, as: EmergencyDirector }
            - call: "POST /om/feeders"
              payload: { feeder_code: "FDR-1", county_code: "C1", service_customer_count: 1000 }
              as: EmergencyDirector
              captures: { fd_id: $.data.id }
            - { call: "POST /om/outages", payload: { storm_event_id: "${ev_id}", feeder_id: "${fd_id}" }, as: Dispatcher }
          trigger:
            - { call: "POST /om/storm-events/${ev_id}/begin_demobilization", payload: {}, as: EmergencyDirector, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_EVENT_HAS_OPEN_WORK; event remains ACTIVE"

      - name: outage_terminal_lockdown_cancelled_rejects_confirm
        claim_type: terminal_lockdown
        grounds:
          - state_machines.Outage
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "A CANCELLED outage accepts no further transitions; confirm is rejected."
        test_recipe:
          setup: ["Event ACTIVE; feeder; outage cancelled from SUSPECTED"]
          setup_api_calls:
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EmergencyDirector }
            - call: "POST /om/storm-events"
              payload: { event_name: "Storm S3", event_type: "HURRICANE" }
              as: EmergencyDirector
              captures: { ev_id: $.data.id }
            - { call: "POST /om/storm-events/${ev_id}/activate", payload: {}, as: EmergencyDirector }
            - call: "POST /om/feeders"
              payload: { feeder_code: "FDR-1", county_code: "C1", service_customer_count: 1000 }
              as: EmergencyDirector
              captures: { fd_id: $.data.id }
            - call: "POST /om/outages"
              payload: { storm_event_id: "${ev_id}", feeder_id: "${fd_id}" }
              as: Dispatcher
              captures: { ot: $.data.id }
            - { call: "POST /om/outages/${ot}/cancel", payload: {}, as: Dispatcher }
          trigger:
            - { call: "POST /om/outages/${ot}/confirm", payload: { customers_affected: 5, cause_code: "TREE" }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE_TRANSITION; outage remains CANCELLED with customers_affected null"

      - name: crew_end_shift_while_en_route_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Crew
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "end_shift is only legal from AVAILABLE; an EN_ROUTE crew (assigned to a work order) is rejected."
        test_recipe:
          setup: ["Outage confirmed {5, EQUIPMENT}; assessment accepted; REPAIR work order DISPATCHED to LINE crew (crew EN_ROUTE)"]
          setup_api_calls:
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EmergencyDirector }
            - call: "POST /om/storm-events"
              payload: { event_name: "Storm S4", event_type: "HURRICANE" }
              as: EmergencyDirector
              captures: { ev_id: $.data.id }
            - { call: "POST /om/storm-events/${ev_id}/activate", payload: {}, as: EmergencyDirector }
            - call: "POST /om/feeders"
              payload: { feeder_code: "FDR-1", county_code: "C1", service_customer_count: 1000 }
              as: EmergencyDirector
              captures: { fd_id: $.data.id }
            - call: "POST /om/outages"
              payload: { storm_event_id: "${ev_id}", feeder_id: "${fd_id}" }
              as: Dispatcher
              captures: { ot: $.data.id }
            - call: "POST /om/outages/${ot}/confirm"
              payload: { customers_affected: 5, cause_code: "EQUIPMENT" }
              as: Dispatcher
              captures: { ot_v: $.data.version }
            - call: "POST /om/crews"
              payload: { crew_code: "A-1", crew_type: "DAMAGE_ASSESSOR", home_base: "D1", hourly_rate_cents: 9000 }
              as: Dispatcher
              captures: { cr_a: $.data.id }
            - call: "POST /om/crews"
              payload: { crew_code: "L-1", crew_type: "LINE", home_base: "D1", hourly_rate_cents: 9000 }
              as: Dispatcher
              captures: { cr_l: $.data.id }
            - { call: "POST /om/crews/${cr_l}/start_shift", payload: {}, as: Dispatcher }
            - call: "POST /om/damage-assessments"
              payload: { outage_id: "${ot}", damage_class: "MINOR", estimated_repair_minutes: 10, requires_switching: false }
              as: FieldCrewLead
              as_user_id: "${cr_a}"
              captures: { da: $.data.id }
            - { call: "POST /om/damage-assessments/${da}/submit", payload: {}, as: FieldCrewLead, as_user_id: "${cr_a}" }
            - { call: "POST /om/damage-assessments/${da}/accept", payload: { expected_outage_version: "${ot_v}" }, as: Dispatcher }
            - call: "POST /om/work-orders"
              payload: { outage_id: "${ot}", work_type: "REPAIR", required_crew_type: "LINE", requires_switching_order: false }
              as: Dispatcher
              captures: { wo: $.data.id }
            - { call: "POST /om/work-orders/${wo}/ready", payload: {}, as: Dispatcher }
            - { call: "POST /om/work-orders/${wo}/assign", payload: { crew_id: "${cr_l}" }, as: Dispatcher }
          trigger:
            - { call: "POST /om/crews/${cr_l}/end_shift", payload: {}, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE_TRANSITION; Crew.${cr_l}.crew_status remains EN_ROUTE"

      - name: switching_issue_by_non_issuer_returns_ownership_error
        claim_type: precondition_enforcement
        grounds:
          - state_machines.SwitchingOrder.DRAFT_to_ISSUED
          - errors[ERR_OWNERSHIP_MISMATCH]
        distinguishing_aspect: "Only the creating SystemOperator (issuer_user_id = X-User-ID) may issue; op-2 issuing op-1's draft is rejected."
        test_recipe:
          setup: ["Outage confirmed; work order CREATED; switching order created by op-1"]
          setup_api_calls:
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EmergencyDirector }
            - call: "POST /om/storm-events"
              payload: { event_name: "Storm S5", event_type: "HURRICANE" }
              as: EmergencyDirector
              captures: { ev_id: $.data.id }
            - { call: "POST /om/storm-events/${ev_id}/activate", payload: {}, as: EmergencyDirector }
            - call: "POST /om/feeders"
              payload: { feeder_code: "FDR-1", county_code: "C1", service_customer_count: 1000 }
              as: EmergencyDirector
              captures: { fd_id: $.data.id }
            - call: "POST /om/outages"
              payload: { storm_event_id: "${ev_id}", feeder_id: "${fd_id}" }
              as: Dispatcher
              captures: { ot: $.data.id }
            - { call: "POST /om/outages/${ot}/confirm", payload: { customers_affected: 5, cause_code: "EQUIPMENT" }, as: Dispatcher }
            - call: "POST /om/work-orders"
              payload: { outage_id: "${ot}", work_type: "SWITCHING", required_crew_type: "LINE", requires_switching_order: true }
              as: Dispatcher
              captures: { wo: $.data.id }
            - call: "POST /om/switching-orders"
              payload: { work_order_id: "${wo}", switching_steps: ["Open breaker 7"] }
              as: SystemOperator
              as_user_id: "op-1"
              captures: { so: $.data.id }
          trigger:
            - { call: "POST /om/switching-orders/${so}/issue", payload: {}, as: SystemOperator, as_user_id: "op-2", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_OWNERSHIP_MISMATCH (http 403); SwitchingOrder.${so}.so_status remains DRAFT"

      - name: switching_abort_clears_work_order_link
        claim_type: side_effect_execution
        grounds:
          - state_machines.SwitchingOrder.DRAFT_to_ABORTED
        distinguishing_aspect: "Aborting an ISSUED switching order clears switching_order_id on the work order; a switching-gated work order must obtain a fresh order before start."
        test_recipe:
          setup: ["Work order CREATED (requires_switching_order=true); switching order ISSUED by op-1"]
          setup_api_calls:
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EmergencyDirector }
            - call: "POST /om/storm-events"
              payload: { event_name: "Storm S6", event_type: "HURRICANE" }
              as: EmergencyDirector
              captures: { ev_id: $.data.id }
            - { call: "POST /om/storm-events/${ev_id}/activate", payload: {}, as: EmergencyDirector }
            - call: "POST /om/feeders"
              payload: { feeder_code: "FDR-1", county_code: "C1", service_customer_count: 1000 }
              as: EmergencyDirector
              captures: { fd_id: $.data.id }
            - call: "POST /om/outages"
              payload: { storm_event_id: "${ev_id}", feeder_id: "${fd_id}" }
              as: Dispatcher
              captures: { ot: $.data.id }
            - { call: "POST /om/outages/${ot}/confirm", payload: { customers_affected: 5, cause_code: "EQUIPMENT" }, as: Dispatcher }
            - call: "POST /om/work-orders"
              payload: { outage_id: "${ot}", work_type: "SWITCHING", required_crew_type: "LINE", requires_switching_order: true }
              as: Dispatcher
              captures: { wo: $.data.id }
            - call: "POST /om/switching-orders"
              payload: { work_order_id: "${wo}", switching_steps: ["Open breaker 7"] }
              as: SystemOperator
              as_user_id: "op-1"
              captures: { so: $.data.id }
            - { call: "POST /om/switching-orders/${so}/issue", payload: {}, as: SystemOperator, as_user_id: "op-1" }
          trigger:
            - { call: "POST /om/switching-orders/${so}/abort", payload: {}, as: SystemOperator, as_user_id: "op-1" }
            - { call: "GET /om/work-orders/${wo}", payload: {}, as: Dispatcher, captures: { so_link: $.data.switching_order_id } }
          assert:
            - "SwitchingOrder.${so}.so_status == ABORTED"
            - "WorkOrder.${wo}: ${so_link} == null (link cleared by the abort side effect)"

      - name: requisition_issue_from_requested_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.MaterialRequisition
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "Issue requires STAGED; issuing a REQUESTED requisition is rejected and stock is untouched."
        test_recipe:
          setup: ["Outage confirmed; assessment accepted; REPAIR work order READY; stock 100 units; requisition REQUESTED qty 10"]
          setup_api_calls:
            - { call: "POST /om/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: EmergencyDirector }
            - call: "POST /om/storm-events"
              payload: { event_name: "Storm S7", event_type: "HURRICANE" }
              as: EmergencyDirector
              captures: { ev_id: $.data.id }
            - { call: "POST /om/storm-events/${ev_id}/activate", payload: {}, as: EmergencyDirector }
            - call: "POST /om/feeders"
              payload: { feeder_code: "FDR-1", county_code: "C1", service_customer_count: 1000 }
              as: EmergencyDirector
              captures: { fd_id: $.data.id }
            - call: "POST /om/outages"
              payload: { storm_event_id: "${ev_id}", feeder_id: "${fd_id}" }
              as: Dispatcher
              captures: { ot: $.data.id }
            - call: "POST /om/outages/${ot}/confirm"
              payload: { customers_affected: 5, cause_code: "EQUIPMENT" }
              as: Dispatcher
              captures: { ot_v: $.data.version }
            - call: "POST /om/crews"
