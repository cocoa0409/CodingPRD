      - name: lot_selection_units_available_boundary_then_exhausted_candidate_pool
        grounds:
          - calculations.lot_selection
          - entities.DrugLot.fields.units_available
          - state_machines.DrugLot.transitions.AVAILABLE_to_DEPLETED
          - errors.ERR_NO_ELIGIBLE_LOT
        distinguishing_aspect: |
          The FEFO filter is `units_available >= units_requested`, and this fixture makes the
          boundary decide WHICH lot is picked rather than merely whether one is: the
          first-expiring lot holds exactly 1 unit and is excluded from a 3-unit request,
          so the later-expiring lot with exactly 3 units must be chosen even though FEFO
          ranking would otherwise prefer the other one. A `>` instead of `>=` finds no lot
          at all; partial fills across both lots would satisfy the request but are forbidden.
        test_recipe:
          setup:
            - "Logical clock 2026-08-05T07:00:00Z; one center, one chair, one nurse."
            - "Drug Three (iron sucrose, no lab gate, unit cost 12000, stability 120)."
            - "Lot EARLY holds 1 unit and expires 2026-11-01T00:00:00Z — first in FEFO order."
            - "Lot LATE holds 3 units and expires 2026-12-01T00:00:00Z — second in FEFO order."
            - "One LOW-tier visit for Patient One on 2026-08-10 at start_minute 540 (chair window 90 minutes)."
