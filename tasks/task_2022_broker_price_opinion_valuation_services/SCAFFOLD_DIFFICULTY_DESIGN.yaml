              as: BillingClerk
              captures: { batch_o2: $.data.id }
          assert:
            - "First trigger (overlap at 2026-08-14) is rejected with error_id == ERR_INVALID_REQUEST (overlap check)"
            - "Second trigger (adjacent at boundary 2026-08-15 == prior period_end) succeeds (half-open semantics; no overlap)"

