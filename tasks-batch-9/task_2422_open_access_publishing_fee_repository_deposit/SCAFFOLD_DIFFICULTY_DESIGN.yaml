              as: AgreementAdmin
              captures: { au9_id: $.data.id }
            - call: "POST /funders"
              payload: { name: "National Research Council", funder_code: "NRC", mandate_type: "GOLD_OA", max_embargo_months: 6, deposit_deadline_days: 90, license_required: "CC_BY", apc_allowable: true }
              as: AgreementAdmin
              captures: { f9_id: $.data.id }
            - call: "POST /grants"
              payload: { funder_id: "${f9_id}", pi_author_id: "${au9_id}", grant_number: "NRC-2026-201", award_from: "2026-01-01", award_until: "2027-12-31", apc_budget_cents: 900000 }
              as: AgreementAdmin
              captures: { g9_id: $.data.id }
            - call: "POST /apc-funds"
              payload: { fund_code: "OA-CENTRAL-2027", fiscal_year: 2027, period_from: "2026-07-01", period_to: "2027-06-30", total_budget_cents: 1000000, priority_rank: 1, eligible_affiliation_statuses: ["ELIGIBLE_FACULTY"], per_article_cap_cents: 300000 }
              as: FundManager
              captures: { fd9_id: $.data.id }
            - call: "POST /articles"
              payload: { journal_id: "${j9_id}", corresponding_author_id: "${au9_id}", grant_id: "${g9_id}", manuscript_title: "Capped authors and reviewable states", accepted_on: "2026-08-05" }
              as: ScholCommLibrarian
              captures: { a9_id: $.data.id }
            - call: "POST /articles/${a9_id}/eligibility-checks"
              payload: { basis: "PROVISIONAL" }
              as: ScholCommLibrarian
              captures: { det9_eligible: $.data.eligible_request_cents }
            - call: "POST /fund-requests"
              payload: { article_id: "${a9_id}", requested_cents: 300000, justification: "Gold OA fee." }
              as: CorrespondingAuthor
              as_user_id: "${au9_id}"
              captures: { fr9_id: $.data.id }
            - call: "POST /fund-requests/${fr9_id}/start-review"
              payload: {}
