# =============================================================================
# Task 1211 — Marine Salvage & Wreck Removal (marine salvage contractor)
# Scaffold seed tables (single source of truth for PRD/tests/implementation)
# =============================================================================

scenario: |
  1211. Marine Salvage & Wreck Removal (marine salvage contractor): incident
  assessment & salvage plan, contract form (fixed price vs no-cure-no-pay) &
  security, environmental protection & pollution response, permit & agency
  coordination, equipment mobilization & weather windows, cargo/vessel
  disposition & lien, salvage award/arbitration, documentation for insurer

domain_name: marine-salvage
api_prefix: ""

# =============================================================================
# Complexity Profile (Step 0)
# Difficulty target: beyond Expert band — dense coupling, not entity count.
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency      # OCC on contract counter-offers and assessment supersede
    - cascading_side_effects      # pollution escalation depth-3+ cascade; completion bubble-up
    - dual_variant_calculation    # provisional vs final award; tariff vs actual exposure
    - rate_threshold_triggers     # wave-height limit, security coverage, overrun threshold
  entity_topology: flat           # peer resources joined by FK references in bodies
  state_machine_shape: cyclic     # negotiation/revision/appeal/hold loops + parallel dimensions
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table (16 entities; flat topology with FK references)
# =============================================================================
entities:
  - name: Casualty
    parent: null
    common_fields: true
    fields:
      - { name: vessel_name, type: string, source: input, description: "Name of the casualty vessel" }
      - { name: casualty_type, type: enum, source: input, description: "GROUNDING | COLLISION | FIRE | SUNK" }
      - { name: declared_salved_value_cents, type: integer, source: input, description: "Owner-declared value of vessel+cargo at risk; > 0" }
      - { name: position, type: string, source: input, description: "Casualty position (free text lat/long or port)" }
      - { name: pollutant_inventory_note, type: string, source: input, description: "Optional note on bunkers/cargo pollutants aboard", default: "" }
      - { name: lifecycle_status, type: enum, source: system, description: "REPORTED | ASSESSED | PLANNED | CONTRACTED | IN_OPERATION | OPERATIONS_COMPLETE | CLOSED" }
      - { name: env_posture, type: enum, source: computed, description: "ENV_CLEAR | ENV_WATCH | ENV_HOLD — derived from open PollutionEvents (see calc pollution_posture_derivation)" }

  - name: Assessment
    parent: null
    common_fields: true
    fields:
      - { name: casualty_id, type: string, source: input, description: "FK -> Casualty.id" }
      - { name: casualty_seq, type: integer, source: system, description: "Monotone sequence number within the casualty, assigned at creation (deterministic recency ordering; never id-based)" }
      - { name: assessor_id, type: string, source: system, description: "X-User-ID of the creating MarineSurveyor (SoD reference)" }
      - { name: pollution_risk_tier, type: enum, source: input, description: "TIER_1 | TIER_2 | TIER_3 — worst credible pollution outcome" }
      - { name: wreck_removal_required, type: boolean, source: input, description: "Whether full wreck removal (not just refloat) is required" }
      - { name: estimated_cost_cents, type: integer, source: input, description: "Surveyor cost estimate; > 0" }
      - { name: notes, type: string, source: input, description: "Free-text survey notes", default: "" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | REJECTED | SUPERSEDED" }
      - { name: reviewer_id, type: string, source: system, description: "X-User-ID of approver/rejecter; null until reviewed" }

  - name: SalvagePlan
    parent: null
    common_fields: true
    fields:
      - { name: casualty_id, type: string, source: input, description: "FK -> Casualty.id" }
      - { name: drafter_id, type: string, source: system, description: "X-User-ID of the creating SalvageMaster (SoD reference)" }
      - { name: method, type: enum, source: input, description: "REFLOAT | LIGHTERING | TOWAGE | WRECK_REMOVAL" }
      - { name: required_equipment_classes, type: array, source: input, description: "Array of equipment classes required (subset of TUG | CRANE_BARGE | PONTOON | OIL_RESPONSE); non-empty" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED (reject returns to DRAFT)" }
      - { name: approver_id, type: string, source: system, description: "X-User-ID of approving OperationsDirector; null until approved" }

  - name: SalvageContract
    parent: null
    common_fields: true
    fields:
      - { name: casualty_id, type: string, source: input, description: "FK -> Casualty.id" }
      - { name: plan_id, type: string, source: input, description: "FK -> SalvagePlan.id" }
      - { name: form, type: enum, source: input, description: "FIXED_PRICE | NO_CURE_NO_PAY" }
      - { name: fixed_price_cents, type: integer, source: input, description: "Required and > 0 iff form == FIXED_PRICE; forbidden otherwise" }
      - { name: scopic_clause_included, type: boolean, source: input, description: "Whether SCOPIC-style special compensation netting applies", default: false }
      - { name: status, type: enum, source: system, description: "DRAFT | OFFERED | COUNTERED | SIGNED | ACTIVE | PERFORMANCE_COMPLETE | AWARD_FINAL | SETTLED | TERMINATED" }
      - { name: negotiation_round, type: integer, source: system, description: "0 at DRAFT; offer sets 1; every counter increments by 1" }
      - { name: provisional_award_cents, type: integer, source: computed, description: "Computed at sign (see calc salvage_award_provisional)" }
      - { name: security_required_cents, type: integer, source: computed, description: "Computed at sign (see calc security_requirement)" }
      - { name: cost_to_date_cents, type: integer, source: computed, description: "Sum of total_cost_cents over OFF_HIRE charters of this casualty; recomputed on every off-hire" }
      - { name: overrun_flag, type: boolean, source: computed, description: "FIXED_PRICE only: true when cost_to_date_cents > round_half_up(fixed_price_cents * 1.10); always false for NO_CURE_NO_PAY", default: false }
      - { name: terminate_reason, type: enum, source: system, description: "MUTUAL | NO_CURE; null until terminated" }

  - name: SecurityDeposit
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> SalvageContract.id" }
      - { name: lodged_amount_cents, type: integer, source: input, description: "Total lodged at creation; > 0; immutable thereafter" }
      - { name: held_cents, type: integer, source: computed, description: "Still held; invariant: lodged == held + released + applied" }
      - { name: released_cents, type: integer, source: computed, description: "Returned to owner", default: 0 }
      - { name: applied_cents, type: integer, source: computed, description: "Applied toward award payment", default: 0 }
      - { name: status, type: enum, source: system, description: "LODGED | PARTIALLY_DISBURSED | CLOSED" }

  - name: Permit
    parent: null
    common_fields: true
    fields:
      - { name: casualty_id, type: string, source: input, description: "FK -> Casualty.id" }
      - { name: agency_type, type: enum, source: input, description: "COAST_GUARD | PORT_AUTHORITY | ENV_AGENCY" }
      - { name: valid_from, type: datetime, source: input, description: "Validity start (inclusive)" }
      - { name: valid_to, type: datetime, source: input, description: "Validity end (inclusive); must be > valid_from" }
      - { name: status, type: enum, source: system, description: "REQUESTED | GRANTED | SUSPENDED | REVOKED | EXPIRED" }

  - name: EquipmentAsset
    parent: null
    common_fields: true
    fields:
      - { name: asset_class, type: enum, source: input, description: "TUG | CRANE_BARGE | PONTOON | OIL_RESPONSE" }
      - { name: day_rate_cents, type: integer, source: input, description: "Daily hire rate; > 0" }
      - { name: max_hs_meters, type: number, source: input, description: "Maximum operable significant wave height; > 0; compared inclusive (forecast <= max passes)" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | CHARTERED — derived from existence of active charters" }

  - name: EquipmentCharter
    parent: null
    common_fields: true
    fields:
      - { name: casualty_id, type: string, source: input, description: "FK -> Casualty.id" }
      - { name: equipment_asset_id, type: string, source: input, description: "FK -> EquipmentAsset.id" }
      - { name: pollution_event_id, type: string, source: input, description: "FK -> PollutionEvent.id; required iff purpose == POLLUTION_RESPONSE, null otherwise" }
      - { name: purpose, type: enum, source: input, description: "SALVAGE | POLLUTION_RESPONSE" }
      - { name: window_start, type: datetime, source: input, description: "Booked window start (inclusive); half-open interval [window_start, window_end)" }
      - { name: window_end, type: datetime, source: input, description: "Booked window end (exclusive); must be > window_start" }
      - { name: status, type: enum, source: system, description: "BOOKED | ON_HIRE | STANDBY_WEATHER | STANDBY_ENV | OFF_HIRE | CANCELLED" }
      - { name: on_hire_at, type: datetime, source: system, description: "Logical clock at on-hire; null until on-hire" }
      - { name: off_hire_at, type: datetime, source: system, description: "Logical clock at off-hire; null until off-hire" }
      - { name: standby_hours, type: integer, source: computed, description: "Accumulated whole hours in STANDBY_WEATHER or STANDBY_ENV", default: 0 }
      - { name: active_days, type: integer, source: computed, description: "Computed at off-hire (see calc charter_cost)" }
      - { name: standby_days, type: integer, source: computed, description: "Computed at off-hire" }
      - { name: demurrage_days, type: integer, source: computed, description: "Computed at off-hire; 0 when elapsed <= booked (strictly greater triggers)" }
      - { name: total_cost_cents, type: integer, source: computed, description: "Computed at off-hire (see calc charter_cost); null until OFF_HIRE" }
      - { name: linked_phase_id, type: string, source: system, description: "Phase this charter was attached to at phase activation; null if never attached" }

  - name: WeatherWindow
    parent: null
    common_fields: true
    fields:
      - { name: casualty_id, type: string, source: input, description: "FK -> Casualty.id" }
      - { name: window_start, type: datetime, source: input, description: "Forecast window start" }
      - { name: window_end, type: datetime, source: input, description: "Forecast window end; must be > window_start" }
      - { name: forecast_hs_meters, type: number, source: input, description: "Forecast significant wave height; >= 0" }
      - { name: status, type: enum, source: system, description: "OPEN | EXPIRED (system sweep when logical clock passes window_end)" }

  - name: OperationPhase
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> SalvageContract.id" }
      - { name: phase_type, type: enum, source: input, description: "MOBILIZATION | LIGHTERING | REFLOAT | TOWAGE | WRECK_REMOVAL | DEMOBILIZATION" }
      - { name: planned_duration_hours, type: integer, source: input, description: "Planned duration; > 0" }
      - { name: status, type: enum, source: system, description: "PLANNED | ACTIVE | WEATHER_HOLD | ENV_SUSPENDED | COMPLETE | ABORTED" }
      - { name: weather_window_id, type: string, source: system, description: "WeatherWindow used at activation; null until activation" }
      - { name: charter_ids, type: array, source: system, description: "Charter ids attached at activation; non-empty once activated" }
      - { name: activated_at, type: datetime, source: system, description: "Logical clock at activation; null until then" }

  - name: PollutionEvent
    parent: null
    common_fields: true
    fields:
      - { name: casualty_id, type: string, source: input, description: "FK -> Casualty.id" }
      - { name: pollutant_class, type: enum, source: input, description: "OIL_PERSISTENT | OIL_NON_PERSISTENT | CHEMICAL | DEBRIS" }
      - { name: tier, type: enum, source: system, description: "TIER_1 | TIER_2 | TIER_3; set from input at creation, only ever raised by escalate" }
      - { name: est_volume_m3, type: number, source: input, description: "Estimated release volume; >= 0" }
      - { name: status, type: enum, source: system, description: "REPORTED | ESCALATED | CONTAINED | VERIFIED_CLEAN" }
      - { name: provisional_exposure_cents, type: integer, source: computed, description: "Tariff-based exposure over response charters (see calc special_compensation)", default: 0 }
      - { name: final_exposure_cents, type: integer, source: computed, description: "Actual-cost-based exposure with pollutant multiplier; null until verify-clean" }
      - { name: special_compensation_payable_cents, type: integer, source: computed, description: "SCOPIC-netted payable amount (see calc special_compensation); recomputed whenever inputs change" }

  - name: RecoveredProperty
    parent: null
    common_fields: true
    fields:
      - { name: casualty_id, type: string, source: input, description: "FK -> Casualty.id" }
      - { name: storage_site_id, type: string, source: system, description: "FK -> StorageSite.id; null until secured ashore" }
      - { name: property_type, type: enum, source: input, description: "BUNKERS | CARGO | VESSEL_HULL | WRECK_DEBRIS" }
      - { name: quantity_tonnes, type: number, source: input, description: "Total salved quantity; > 0" }
      - { name: declared_value_cents, type: integer, source: input, description: "Declared value; >= 0" }
      - { name: verified_value_cents, type: integer, source: system, description: "Surveyor-verified value; null until survey" }
      - { name: custody_status, type: enum, source: system, description: "SALVED | SECURED_ASHORE | LIENED | REDELIVERED | SOLD | DISPOSED (parallel dimension 1)" }
      - { name: documentation_status, type: enum, source: system, description: "PENDING_SURVEY | SURVEYED | VALUE_VERIFIED (parallel dimension 2)" }
      - { name: redelivered_tonnes, type: number, source: computed, description: "Mass bucket; invariant: quantity == redelivered + sold + disposed + in_custody", default: 0 }
      - { name: sold_tonnes, type: number, source: computed, description: "Mass bucket", default: 0 }
      - { name: disposed_tonnes, type: number, source: computed, description: "Mass bucket", default: 0 }
      - { name: in_custody_tonnes, type: number, source: computed, description: "Mass bucket; initialized to quantity_tonnes at creation" }
      - { name: lien_amount_cents, type: integer, source: computed, description: "Outstanding lien; 0 when no lien", default: 0 }
      - { name: surveyor_id, type: string, source: system, description: "X-User-ID of surveying MarineSurveyor (SoD reference); null until survey" }

  - name: StorageSite
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Site name" }
      - { name: capacity_tonnes, type: number, source: input, description: "Aggregate capacity; > 0" }
      - { name: allocated_tonnes, type: number, source: computed, description: "Sum of quantity_tonnes of lots with storage_site_id == this site and custody_status in {SECURED_ASHORE, LIENED}", default: 0 }

  - name: SalvageAward
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> SalvageContract.id; 1:1 with contract" }
      - { name: status, type: enum, source: system, description: "COMPUTED | AGREED | IN_ARBITRATION | AWARDED | APPEALED | PAID" }
      - { name: computed_amount_cents, type: integer, source: computed, description: "Server-computed final amount (see calc salvage_award_final)" }
      - { name: agreed_amount_cents, type: integer, source: input, description: "Party-agreed amount set on agree; null otherwise" }
      - { name: awarded_amount_cents, type: integer, source: input, description: "Arbitral amount set on decide; null otherwise" }
      - { name: paid_amount_cents, type: integer, source: system, description: "Set at mark-paid: agreed_amount if AGREED else awarded_amount" }
      - { name: appeal_count, type: integer, source: system, description: "Number of appeals filed", default: 0 }

  - name: DocPack
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> SalvageContract.id" }
      - { name: status, type: enum, source: system, description: "COMPILING | SUBMITTED | ACCEPTED (DEFICIENT review returns to COMPILING)" }
      - { name: required_count, type: integer, source: computed, description: "Required entries at last evaluation (see calc doc_pack_completeness)", default: 0 }
      - { name: satisfied_count, type: integer, source: computed, description: "Satisfied requirements at last evaluation", default: 0 }
      - { name: completeness_pct, type: number, source: computed, description: "100 * satisfied_count / required_count; 0 when required_count == 0", default: 0 }
      - { name: review_notes, type: string, source: system, description: "Reviewer notes; null until reviewed" }

  - name: DocEntry
    parent: null
    common_fields: false
    fields:
      - { name: doc_pack_id, type: string, source: input, description: "FK -> DocPack.id" }
      - { name: entry_type, type: enum, source: input, description: "DAILY_LOG | COST_LOG | POLLUTION_REPORT | SURVEY_REPORT" }
      - { name: ref_id, type: string, source: input, description: "Referenced record id (OperationPhase for DAILY_LOG, EquipmentCharter for COST_LOG, PollutionEvent for POLLUTION_REPORT, RecoveredProperty for SURVEY_REPORT); a plain reference value, not a foreign key constraint" }
      - { name: entry_date, type: datetime, source: input, description: "Date the entry documents" }
      - { name: summary, type: string, source: input, description: "Entry text" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Casualty
    field: lifecycle_status
    initial_state: REPORTED
    terminal_states: [CLOSED]
    transitions:
      - from: REPORTED
        to: ASSESSED
        trigger: "system (automatic when an Assessment of this casualty transitions to APPROVED)"
        actor: system
        preconditions: []
        side_effects: ["Casualty.version increments by 1", "Casualty.updated_at refreshed"]
      - from: ASSESSED
        to: PLANNED
        trigger: "system (automatic when a SalvagePlan of this casualty transitions to APPROVED)"
        actor: system
        preconditions: []
        side_effects: ["Casualty.version increments by 1"]
      - from: PLANNED
        to: CONTRACTED
        trigger: "system (automatic when a SalvageContract of this casualty transitions to SIGNED)"
        actor: system
        preconditions: []
        side_effects: ["Casualty.version increments by 1"]
      - from: CONTRACTED
        to: IN_OPERATION
        trigger: "system (automatic when the first OperationPhase of the contract transitions to ACTIVE)"
        actor: system
        preconditions: []
        side_effects: ["Casualty.version increments by 1"]
      - from: IN_OPERATION
        to: OPERATIONS_COMPLETE
        trigger: "system (automatic when the SalvageContract transitions to PERFORMANCE_COMPLETE — cascade B link 2)"
        actor: system
        preconditions: []
        side_effects:
          - "RecoveredProperty lots of this casualty become disposition-eligible (gate reads lifecycle_status)"
          - "Casualty.version increments by 1"
      - from: OPERATIONS_COMPLETE
        to: CLOSED
        trigger: "POST /casualties/{casualty_id}/close"
        actor: OperationsDirector
        preconditions:
          - "Every SalvageContract of this casualty has status in {SETTLED, TERMINATED} (ERR_CASUALTY_NOT_CLOSABLE)"
          - "No PollutionEvent of this casualty has status in {REPORTED, ESCALATED, CONTAINED} (ERR_CASUALTY_NOT_CLOSABLE)"
        side_effects: ["Casualty.version increments by 1"]

  - entity: Casualty
    field: env_posture
    initial_state: ENV_CLEAR
    terminal_states: []
    transitions:
      - from: ENV_CLEAR
        to: ENV_WATCH
        trigger: "system (recomputed on PollutionEvent create/contain/verify-clean: an open event with tier TIER_1 exists and no open TIER_2/TIER_3 event)"
        actor: system
        preconditions: []
        side_effects: ["Casualty.version increments by 1"]
      - from: ENV_WATCH
        to: ENV_HOLD
        trigger: "system (an open PollutionEvent with tier in {TIER_2, TIER_3} now exists — create or escalate)"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE A link 2: every OperationPhase of this casualty's contracts with status ACTIVE transitions to ENV_SUSPENDED"
          - "Casualty.version increments by 1"
      - from: ENV_CLEAR
        to: ENV_HOLD
        trigger: "system (PollutionEvent created directly at tier TIER_2/TIER_3, or escalation while posture ENV_CLEAR)"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE A link 2: every OperationPhase with status ACTIVE transitions to ENV_SUSPENDED"
          - "Casualty.version increments by 1"
      - from: ENV_HOLD
        to: ENV_WATCH
        trigger: "system (after verify-clean: open events remain but all are TIER_1)"
        actor: system
        preconditions: []
        side_effects: ["Casualty.version increments by 1; phases stay ENV_SUSPENDED (manual resume only)"]
      - from: ENV_HOLD
        to: ENV_CLEAR
        trigger: "system (after verify-clean: no open events remain)"
        actor: system
        preconditions: []
        side_effects: ["Casualty.version increments by 1; phases stay ENV_SUSPENDED (manual resume only)"]
      - from: ENV_WATCH
        to: ENV_CLEAR
        trigger: "system (after verify-clean: no open events remain)"
        actor: system
        preconditions: []
        side_effects: ["Casualty.version increments by 1"]

  - entity: Assessment
    field: status
    initial_state: SUBMITTED
    terminal_states: [REJECTED, SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /assessments/{assessment_id}/approve"
        actor: OperationsDirector
        preconditions:
          - "SoD: X-User-ID != assessment.assessor_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "reviewer_id set to X-User-ID"
          - "Casualty.lifecycle_status REPORTED -> ASSESSED (system)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /assessments/{assessment_id}/reject"
        actor: OperationsDirector
        preconditions:
          - "SoD: X-User-ID != assessment.assessor_id (ERR_SOD_VIOLATION)"
        side_effects: ["reviewer_id set to X-User-ID"]
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system (automatic when a newer Assessment for the same casualty is created via POST /assessments)"
        actor: system
        preconditions: []
        side_effects: ["Assessment.version increments by 1"]

  - entity: SalvagePlan
    field: status
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /plans/{plan_id}/submit"
        actor: SalvageMaster
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /plans/{plan_id}/approve"
        actor: OperationsDirector
        preconditions:
          - "SoD: X-User-ID != plan.drafter_id (ERR_SOD_VIOLATION)"
          - "An Assessment of the same casualty with status APPROVED exists (ERR_ASSESSMENT_NOT_APPROVED)"
        side_effects:
          - "approver_id set to X-User-ID"
          - "Casualty.lifecycle_status ASSESSED -> PLANNED (system)"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /plans/{plan_id}/reject (revision loop: rejection returns the plan to DRAFT)"
        actor: OperationsDirector
        preconditions: []
        side_effects: ["SalvagePlan.version increments by 1"]
        note: "Cyclic: DRAFT -> SUBMITTED -> DRAFT revision loop may repeat without bound"

  - entity: SalvageContract
    field: status
    initial_state: DRAFT
    terminal_states: [SETTLED, TERMINATED]
    transitions:
      - from: DRAFT
        to: OFFERED
        trigger: "POST /contracts/{contract_id}/offer"
        actor: ContractsOfficer
        preconditions: []
        side_effects: ["negotiation_round := 1", "SalvageContract.version increments by 1"]
      - from: OFFERED
        to: COUNTERED
        trigger: "POST /contracts/{contract_id}/counter (OCC: expected_contract_version must equal current version)"
        actor: ContractsOfficer
        preconditions: ["expected_contract_version == contract.version (ERR_STALE_CONTRACT_VERSION, 412)"]
        side_effects: ["negotiation_round += 1", "SalvageContract.version increments by 1"]
      - from: COUNTERED
        to: OFFERED
        trigger: "POST /contracts/{contract_id}/counter (OCC: expected_contract_version must equal current version)"
        actor: ContractsOfficer
        preconditions: ["expected_contract_version == contract.version (ERR_STALE_CONTRACT_VERSION, 412)"]
        side_effects: ["negotiation_round += 1", "SalvageContract.version increments by 1"]
        note: "Cyclic negotiation: OFFERED <-> COUNTERED via counter, round increments each hop"
      - from: OFFERED
        to: SIGNED
        trigger: "POST /contracts/{contract_id}/sign"
        actor: ContractsOfficer
        preconditions:
          - "Latest-created APPROVED Assessment exists for the casualty (ERR_ASSESSMENT_NOT_APPROVED)"
          - "contract.plan_id references a SalvagePlan with status APPROVED (ERR_PLAN_NOT_APPROVED)"
        side_effects:
          - "Computes provisional_award_cents and security_required_cents (calcs salvage_award_provisional, security_requirement)"
          - "Casualty.lifecycle_status PLANNED -> CONTRACTED (system)"
          - "SalvageContract.version increments by 1"
      - from: COUNTERED
        to: SIGNED
        trigger: "POST /contracts/{contract_id}/sign"
        actor: ContractsOfficer
        preconditions:
          - "Latest-created APPROVED Assessment exists for the casualty (ERR_ASSESSMENT_NOT_APPROVED)"
          - "contract.plan_id references a SalvagePlan with status APPROVED (ERR_PLAN_NOT_APPROVED)"
        side_effects:
          - "Computes provisional_award_cents and security_required_cents"
          - "Casualty.lifecycle_status PLANNED -> CONTRACTED (system)"
          - "SalvageContract.version increments by 1"
      - from: SIGNED
        to: ACTIVE
        trigger: "POST /contracts/{contract_id}/activate"
        actor: ContractsOfficer
        preconditions:
          - "business_safety: if the latest APPROVED assessment has pollution_risk_tier == TIER_3, an ENV_AGENCY Permit with status GRANTED must exist for the casualty (ERR_ENV_CLEARANCE_REQUIRED)"
          - "business_fiscal: some SecurityDeposit of this contract has held_cents >= contract.security_required_cents (ERR_SECURITY_INSUFFICIENT)"
        side_effects: ["SalvageContract.version increments by 1"]
        note: "Validation priority conflict lives here: safety (p6) reported before fiscal (p10)"
      - from: ACTIVE
        to: PERFORMANCE_COMPLETE
        trigger: "system (automatic when every OperationPhase of this contract is in a terminal state {COMPLETE, ABORTED} and at least one phase exists — cascade B link 1, caused by the final phase completion)"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE B link 2: Casualty.lifecycle_status IN_OPERATION -> OPERATIONS_COMPLETE"
          - "SalvageContract.version increments by 1"
      - from: PERFORMANCE_COMPLETE
        to: AWARD_FINAL
        trigger: "system (automatic when the SalvageAward of this contract transitions to PAID)"
        actor: system
        preconditions: []
        side_effects: ["SalvageContract.version increments by 1"]
      - from: AWARD_FINAL
        to: SETTLED
        trigger: "POST /contracts/{contract_id}/settle"
        actor: ContractsOfficer
        preconditions:
          - "Every SecurityDeposit of this contract has status CLOSED (ERR_SECURITY_DISBURSE_NOT_ALLOWED)"
          - "Every DocPack of this contract has status ACCEPTED (ERR_DOCS_NOT_ACCEPTED)"
        side_effects: ["SalvageContract.version increments by 1"]
      - from: DRAFT
        to: TERMINATED
        trigger: "POST /contracts/{contract_id}/terminate reason=MUTUAL"
        actor: ContractsOfficer
        preconditions: []
        side_effects: ["terminate_reason := MUTUAL", "SecurityDeposits of this contract become release-eligible"]
      - from: OFFERED
        to: TERMINATED
        trigger: "POST /contracts/{contract_id}/terminate reason=MUTUAL"
        actor: ContractsOfficer
        preconditions: []
        side_effects: ["terminate_reason := MUTUAL", "SecurityDeposits of this contract become release-eligible"]
      - from: COUNTERED
        to: TERMINATED
        trigger: "POST /contracts/{contract_id}/terminate reason=MUTUAL"
        actor: ContractsOfficer
        preconditions: []
        side_effects: ["terminate_reason := MUTUAL", "SecurityDeposits of this contract become release-eligible"]
      - from: SIGNED
        to: TERMINATED
        trigger: "POST /contracts/{contract_id}/terminate reason=MUTUAL"
        actor: ContractsOfficer
        preconditions: []
        side_effects: ["terminate_reason := MUTUAL", "SecurityDeposits of this contract become release-eligible"]
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /contracts/{contract_id}/terminate reason=NO_CURE"
        actor: ContractsOfficer
        preconditions:
          - "reason == MUTUAL from ACTIVE is forbidden (ERR_TERMINATION_NOT_ALLOWED)"
          - "reason == NO_CURE requires form == NO_CURE_NO_PAY (ERR_NO_CURE_REQUIRES_NCNP)"
        side_effects:
          - "terminate_reason := NO_CURE"
          - "Every OperationPhase in {PLANNED, ACTIVE, WEATHER_HOLD, ENV_SUSPENDED} -> ABORTED"
          - "Every EquipmentCharter of the casualty in {ON_HIRE, STANDBY_WEATHER, STANDBY_ENV} -> OFF_HIRE (charter_cost computed at current logical clock); BOOKED -> CANCELLED"
          - "RecoveredProperty lots become disposition-eligible (termination overrides the operations-complete gate)"
          - "No SalvageAward is creatable (compute requires PERFORMANCE_COMPLETE): no cure, no pay"
          - "SalvageContract.version increments by 1"

  - entity: SecurityDeposit
    field: status
    initial_state: LODGED
    terminal_states: [CLOSED]
    transitions:
      - from: LODGED
        to: PARTIALLY_DISBURSED
        trigger: "POST /securities/{security_id}/disburse with amount_cents < held_cents"
        actor: ContractsOfficer
        preconditions:
          - "mode == RELEASE: contract status in {SETTLED, TERMINATED} (ERR_SECURITY_DISBURSE_NOT_ALLOWED)"
          - "mode == APPLY_TO_AWARD: the contract's SalvageAward has status PAID (ERR_SECURITY_DISBURSE_NOT_ALLOWED)"
          - "amount_cents <= held_cents (ERR_SECURITY_DISBURSE_EXCEEDS_HELD)"
        side_effects: ["held_cents -= amount_cents; released_cents or applied_cents += amount_cents per mode", "SecurityDeposit.version increments by 1"]
      - from: LODGED
        to: CLOSED
        trigger: "POST /securities/{security_id}/disburse with amount_cents == held_cents"
        actor: ContractsOfficer
        preconditions: ["Same mode/amount preconditions as partial disburse"]
        side_effects: ["held_cents := 0; bucket per mode += amount_cents", "SecurityDeposit.version increments by 1"]
      - from: PARTIALLY_DISBURSED
        to: PARTIALLY_DISBURSED
        trigger: "POST /securities/{security_id}/disburse with amount_cents < held_cents"
        actor: ContractsOfficer
        preconditions: ["Same mode/amount preconditions as partial disburse"]
        side_effects: ["buckets updated per mode", "SecurityDeposit.version increments by 1"]
      - from: PARTIALLY_DISBURSED
        to: CLOSED
        trigger: "POST /securities/{security_id}/disburse with amount_cents == held_cents"
        actor: ContractsOfficer
        preconditions: ["Same mode/amount preconditions as partial disburse"]
        side_effects: ["held_cents := 0", "SecurityDeposit.version increments by 1"]

  - entity: Permit
    field: status
    initial_state: REQUESTED
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: REQUESTED
        to: GRANTED
        trigger: "POST /permits/{permit_id}/grant"
        actor: EnvironmentalOfficer
        preconditions: []
        side_effects: []
      - from: GRANTED
        to: SUSPENDED
        trigger: "POST /permits/{permit_id}/suspend"
        actor: EnvironmentalOfficer
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: GRANTED
        trigger: "POST /permits/{permit_id}/reinstate"
        actor: EnvironmentalOfficer
        preconditions: []
        side_effects: []
        note: "Cyclic agency coordination: GRANTED <-> SUSPENDED"
      - from: GRANTED
        to: REVOKED
        trigger: "POST /permits/{permit_id}/revoke"
        actor: EnvironmentalOfficer
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /permits/{permit_id}/revoke"
        actor: EnvironmentalOfficer
        preconditions: []
        side_effects: []
      - from: GRANTED
        to: EXPIRED
        trigger: "system (automatic sweep inside POST /_clock/set_current_utc when the new logical time > valid_to)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: EXPIRED
        trigger: "system (same clock sweep)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REQUESTED
        to: EXPIRED
        trigger: "system (same clock sweep)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: EquipmentAsset
    field: status
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: CHARTERED
        trigger: "system (automatic when an EquipmentCharter referencing this asset enters BOOKED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CHARTERED
        to: AVAILABLE
        trigger: "system (automatic when no charter of this asset remains in {BOOKED, ON_HIRE, STANDBY_WEATHER, STANDBY_ENV})"
        actor: system
        preconditions: []
        side_effects: []

  - entity: EquipmentCharter
    field: status
    initial_state: BOOKED
    terminal_states: [OFF_HIRE, CANCELLED]
    transitions:
      - from: BOOKED
        to: ON_HIRE
        trigger: "POST /charters/{charter_id}/on-hire"
        actor: SalvageMaster
        preconditions:
          - "Casualty's non-terminal contract has status in {ACTIVE, PERFORMANCE_COMPLETE} (ERR_CONTRACT_NOT_ACTIVE)"
          - "Logical clock >= window_start and < window_end (ERR_CHARTER_WINDOW_NOT_OPEN)"
        side_effects: ["on_hire_at := logical clock", "EquipmentCharter.version increments by 1"]
      - from: ON_HIRE
        to: STANDBY_WEATHER
        trigger: "system (cascade: a phase this charter is linked to enters WEATHER_HOLD)"
        actor: system
        preconditions: []
        side_effects: ["standby accrual interval opens at current logical clock"]
      - from: ON_HIRE
        to: STANDBY_ENV
        trigger: "system (CASCADE A link 3: linked phase entered ENV_SUSPENDED, which was caused by casualty env_posture entering ENV_HOLD)"
        actor: system
        preconditions: []
        side_effects: ["standby accrual interval opens at current logical clock"]
      - from: STANDBY_WEATHER
        to: ON_HIRE
        trigger: "system (cascade: linked phase resumes to ACTIVE)"
        actor: system
        preconditions: []
        side_effects: ["standby_hours += whole hours since standby interval opened (floor)"]
      - from: STANDBY_ENV
        to: ON_HIRE
        trigger: "system (cascade: linked phase resumes to ACTIVE)"
        actor: system
        preconditions: []
        side_effects: ["standby_hours += whole hours since standby interval opened (floor)"]
      - from: ON_HIRE
        to: OFF_HIRE
        trigger: "POST /charters/{charter_id}/off-hire"
        actor: SalvageMaster
        preconditions: []
        side_effects:
          - "off_hire_at := logical clock; closes any open standby interval into standby_hours"
          - "Computes active_days, standby_days, demurrage_days, total_cost_cents (calc charter_cost)"
          - "Contract.cost_to_date_cents recomputed; overrun_flag re-evaluated (FIXED_PRICE only)"
          - "If charter purpose == POLLUTION_RESPONSE: provisional/final exposure inputs refresh on linked PollutionEvent"
          - "EquipmentAsset.status re-derived (AVAILABLE when no active charters remain)"
      - from: STANDBY_WEATHER
        to: OFF_HIRE
        trigger: "POST /charters/{charter_id}/off-hire"
        actor: SalvageMaster
        preconditions: []
        side_effects: ["Same as ON_HIRE -> OFF_HIRE"]
      - from: STANDBY_ENV
        to: OFF_HIRE
        trigger: "POST /charters/{charter_id}/off-hire"
        actor: SalvageMaster
        preconditions: []
        side_effects: ["Same as ON_HIRE -> OFF_HIRE"]
      - from: BOOKED
        to: CANCELLED
        trigger: "system (contract terminate cascade)"
        actor: system
        preconditions: []
        side_effects: ["EquipmentAsset.status re-derived"]

  - entity: WeatherWindow
    field: status
    initial_state: OPEN
    terminal_states: [EXPIRED]
    transitions:
      - from: OPEN
        to: EXPIRED
        trigger: "system (automatic sweep inside POST /_clock/set_current_utc when the new logical time > window_end)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: OperationPhase
    field: status
    initial_state: PLANNED
    terminal_states: [COMPLETE, ABORTED]
    transitions:
      - from: PLANNED
        to: ACTIVE
        trigger: "POST /phases/{phase_id}/activate"
        actor: SalvageMaster
        preconditions:
          - "business_safety: casualty env_posture != ENV_HOLD (ERR_ENV_HOLD_ACTIVE)"
          - "business_safety: weather feasibility — weather window OPEN, forecast_hs_meters <= min(max_hs_meters over charter_ids' assets) inclusive (ERR_WEATHER_LIMIT_EXCEEDED), and now >= window_start + 6h, and now + planned_duration_hours <= window_end - 6h (ERR_WEATHER_WINDOW_INFEASIBLE)"
          - "business_temporal: for each agency required by phase_type (see calc phase_permit_requirement) a Permit exists with status GRANTED (ERR_PERMIT_MISSING), valid_from <= now, and valid_to >= now + planned_duration_hours (ERR_PERMIT_NOT_VALID)"
          - "business_referential: charter_ids must be non-empty (ERR_INVALID_REQUEST); every referenced charter must exist (ERR_NOT_FOUND), belong to this casualty, and have status ON_HIRE (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "activated_at := now; weather_window_id and charter_ids stored; each charter.linked_phase_id := this phase"
          - "Casualty.lifecycle_status CONTRACTED -> IN_OPERATION on first activation (system)"
      - from: ACTIVE
        to: WEATHER_HOLD
        trigger: "POST /phases/{phase_id}/hold-weather"
        actor: SalvageMaster
        preconditions: []
        side_effects: ["Linked charters ON_HIRE -> STANDBY_WEATHER (cascade link)"]
      - from: WEATHER_HOLD
        to: ACTIVE
        trigger: "POST /phases/{phase_id}/resume"
        actor: SalvageMaster
        preconditions:
          - "business_safety: casualty env_posture != ENV_HOLD (ERR_ENV_HOLD_ACTIVE)"
        side_effects: ["Linked charters STANDBY_WEATHER -> ON_HIRE (cascade link)"]
        note: "Cyclic hold/resume loop, unbounded"
      - from: ACTIVE
        to: ENV_SUSPENDED
        trigger: "system (CASCADE A link 2: casualty env_posture entered ENV_HOLD)"
        actor: system
        preconditions: []
        side_effects: ["CASCADE A link 3: linked charters ON_HIRE -> STANDBY_ENV"]
      - from: ENV_SUSPENDED
        to: ACTIVE
        trigger: "POST /phases/{phase_id}/resume"
        actor: SalvageMaster
        preconditions:
          - "business_safety: casualty env_posture != ENV_HOLD (ERR_ENV_HOLD_ACTIVE)"
        side_effects: ["Linked charters STANDBY_ENV -> ON_HIRE (cascade link)"]
      - from: ACTIVE
        to: COMPLETE
        trigger: "POST /phases/{phase_id}/complete"
        actor: SalvageMaster
        preconditions: []
        side_effects:
          - "CASCADE B link 1: when this completion makes every phase of the contract terminal, contract -> PERFORMANCE_COMPLETE"
      - from: PLANNED
        to: ABORTED
        trigger: "system (contract terminate cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: ABORTED
        trigger: "system (contract terminate cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: WEATHER_HOLD
        to: ABORTED
        trigger: "system (contract terminate cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ENV_SUSPENDED
        to: ABORTED
        trigger: "system (contract terminate cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PollutionEvent
    field: status
    initial_state: REPORTED
    terminal_states: [VERIFIED_CLEAN]
    transitions:
      - from: REPORTED
        to: ESCALATED
        trigger: "POST /pollution-events/{event_id}/escalate"
        actor: EnvironmentalOfficer
        preconditions: ["new_tier strictly higher than current tier (ERR_POLLUTION_TIER_NOT_RAISED)"]
        side_effects:
          - "tier := new_tier"
          - "CASCADE A link 1: casualty env_posture recomputed; entering ENV_HOLD cascades to phases and charters (links 2-3)"
      - from: CONTAINED
        to: ESCALATED
        trigger: "POST /pollution-events/{event_id}/escalate"
        actor: EnvironmentalOfficer
        preconditions: ["new_tier strictly higher than current tier (ERR_POLLUTION_TIER_NOT_RAISED)"]
        side_effects: ["Same cascade as REPORTED -> ESCALATED"]
        note: "Escalation loop: an event can re-enter ESCALATED after containment"
      - from: REPORTED
        to: CONTAINED
        trigger: "POST /pollution-events/{event_id}/contain"
        actor: EnvironmentalOfficer
        preconditions: []
        side_effects: ["env_posture recomputed (CONTAINED is still open: posture does not relax on contain alone)"]
      - from: ESCALATED
        to: CONTAINED
        trigger: "POST /pollution-events/{event_id}/contain"
        actor: EnvironmentalOfficer
        preconditions: []
        side_effects: ["env_posture recomputed"]
      - from: CONTAINED
        to: VERIFIED_CLEAN
        trigger: "POST /pollution-events/{event_id}/verify-clean"
        actor: EnvironmentalOfficer
        preconditions: []
        side_effects:
          - "Computes final_exposure_cents and refreshes special_compensation_payable_cents (calc special_compensation)"
          - "env_posture recomputed; only verify-clean can relax ENV_HOLD/ENV_WATCH"

  - entity: RecoveredProperty
    field: custody_status
    initial_state: SALVED
    terminal_states: [REDELIVERED, SOLD, DISPOSED]
    transitions:
      - from: SALVED
        to: SECURED_ASHORE
        trigger: "POST /properties/{property_id}/secure-ashore"
        actor: SalvageMaster
        preconditions:
          - "business_temporal: storage site aggregate capacity — site.allocated_tonnes + quantity_tonnes <= site.capacity_tonnes (ERR_STORAGE_CAPACITY_EXCEEDED)"
        side_effects: ["storage_site_id set", "StorageSite.allocated_tonnes recomputed"]
      - from: SECURED_ASHORE
        to: LIENED
        trigger: "POST /properties/{property_id}/lien"
        actor: ContractsOfficer
        preconditions:
          - "Casualty.lifecycle_status in {IN_OPERATION, OPERATIONS_COMPLETE} (ERR_INVALID_STATE_TRANSITION)"
        side_effects: ["lien_amount_cents := input amount"]
      - from: LIENED
        to: SECURED_ASHORE
        trigger: "system (automatic when the casualty's contract SalvageAward transitions to PAID — lien satisfied)"
        actor: system
        preconditions: []
        side_effects: ["lien_amount_cents := 0"]
      - from: SECURED_ASHORE
        to: REDELIVERED
        trigger: "POST /properties/{property_id}/dispose method=REDELIVER with tonnes == in_custody_tonnes"
        actor: SalvageMaster
        preconditions:
          - "Disposition-eligible: casualty.lifecycle_status == OPERATIONS_COMPLETE OR contract TERMINATED (ERR_INVALID_STATE_TRANSITION)"
          - "documentation_status == VALUE_VERIFIED (ERR_INVALID_STATE_TRANSITION)"
          - "tonnes <= in_custody_tonnes (ERR_QUANTITY_EXCEEDS_REMAINING); terminal only when buckets zero out in_custody"
        side_effects: ["redelivered_tonnes += tonnes; in_custody_tonnes -= tonnes", "StorageSite.allocated_tonnes recomputed when terminal"]
      - from: SECURED_ASHORE
        to: SOLD
        trigger: "POST /properties/{property_id}/dispose method=SELL (terminal when tonnes == in_custody_tonnes; partial keeps SECURED_ASHORE)"
        actor: SalvageMaster
        preconditions:
          - "Disposition-eligible gate as REDELIVER"
          - "documentation_status == VALUE_VERIFIED"
          - "Ordinary sale requires the casualty's contract award PAID (lien satisfied); otherwise ERR_LIEN_ACTIVE"
        side_effects: ["sold_tonnes += tonnes; in_custody_tonnes -= tonnes", "StorageSite.allocated_tonnes recomputed when terminal"]
      - from: LIENED
        to: SOLD
        trigger: "POST /properties/{property_id}/dispose method=SELL (lien sale; terminal when tonnes == in_custody_tonnes)"
        actor: SalvageMaster
        preconditions:
          - "contract of the casualty has status TERMINATED (lien sale; ERR_LIEN_ACTIVE otherwise)"
          - "documentation_status == VALUE_VERIFIED (ERR_INVALID_STATE_TRANSITION)"
          - "tonnes <= in_custody_tonnes (ERR_QUANTITY_EXCEEDS_REMAINING)"
        side_effects: ["sold_tonnes += tonnes; in_custody_tonnes -= tonnes", "lien_amount_cents := 0 on terminal sale", "StorageSite.allocated_tonnes recomputed when terminal"]
      - from: SECURED_ASHORE
        to: DISPOSED
        trigger: "POST /properties/{property_id}/dispose method=SCRAP with tonnes == in_custody_tonnes"
        actor: SalvageMaster
        preconditions:
          - "Disposition-eligible gate as REDELIVER"
          - "documentation_status in {SURVEYED, VALUE_VERIFIED}"
        side_effects: ["disposed_tonnes += tonnes; in_custody_tonnes -= tonnes"]
        note: "Partial dispositions keep custody SECURED_ASHORE; terminal custody takes the method of the dispose call that zeroes in_custody_tonnes (REDELIVER->REDELIVERED, SELL->SOLD, SCRAP->DISPOSED)"

  - entity: RecoveredProperty
    field: documentation_status
    initial_state: PENDING_SURVEY
    terminal_states: [VALUE_VERIFIED]
    transitions:
      - from: PENDING_SURVEY
        to: SURVEYED
        trigger: "POST /properties/{property_id}/survey"
        actor: MarineSurveyor
        preconditions: []
        side_effects: ["verified_value_cents := input", "surveyor_id := X-User-ID"]
      - from: SURVEYED
        to: VALUE_VERIFIED
        trigger: "POST /properties/{property_id}/verify-value"
        actor: OperationsDirector
        preconditions: ["SoD: X-User-ID != property.surveyor_id (ERR_SOD_VIOLATION)"]
        side_effects: []
        note: "Parallel dimension: documentation evolves independently of custody_status"

  - entity: SalvageAward
    field: status
    initial_state: COMPUTED
    terminal_states: [PAID]
    transitions:
      - from: COMPUTED
        to: AGREED
        trigger: "POST /awards/{award_id}/agree"
        actor: ContractsOfficer
        preconditions: []
        side_effects: ["agreed_amount_cents := input"]
      - from: COMPUTED
        to: IN_ARBITRATION
        trigger: "POST /awards/{award_id}/submit-arbitration"
        actor: ContractsOfficer
        preconditions:
          - "business_referential: every RecoveredProperty of the casualty has custody_status in {REDELIVERED, SOLD, DISPOSED} (ERR_PROPERTIES_NOT_DISPOSED)"
        side_effects: []
      - from: IN_ARBITRATION
        to: AWARDED
        trigger: "POST /awards/{award_id}/decide"
        actor: Arbitrator
        preconditions: []
        side_effects: ["awarded_amount_cents := input"]
      - from: AWARDED
        to: APPEALED
        trigger: "POST /awards/{award_id}/appeal"
        actor: ContractsOfficer
        preconditions: []
        side_effects: ["appeal_count += 1"]
      - from: APPEALED
        to: AWARDED
        trigger: "POST /awards/{award_id}/decide"
        actor: Arbitrator
        preconditions: []
        side_effects: ["awarded_amount_cents := input (overwrites)"]
        note: "Cyclic appeal loop: AWARDED -> APPEALED -> AWARDED"
      - from: AGREED
        to: PAID
        trigger: "POST /awards/{award_id}/mark-paid"
        actor: ContractsOfficer
        preconditions: []
        side_effects:
          - "paid_amount_cents := agreed_amount_cents"
          - "Contract PERFORMANCE_COMPLETE -> AWARD_FINAL (system)"
          - "All LIENED RecoveredProperty of the casualty: lien_amount_cents := 0, custody LIENED -> SECURED_ASHORE (lien lift cascade)"
      - from: AWARDED
        to: PAID
        trigger: "POST /awards/{award_id}/mark-paid"
        actor: ContractsOfficer
        preconditions: []
        side_effects:
          - "paid_amount_cents := awarded_amount_cents"
          - "Contract PERFORMANCE_COMPLETE -> AWARD_FINAL (system)"
          - "Lien lift cascade as AGREED -> PAID"

  - entity: DocPack
    field: status
    initial_state: COMPILING
    terminal_states: [ACCEPTED]
    transitions:
      - from: COMPILING
        to: SUBMITTED
        trigger: "POST /doc-packs/{pack_id}/submit"
        actor: SalvageMaster
        preconditions:
          - "business_fiscal gate on documentation: completeness_pct == 100 exactly (ERR_DOC_INCOMPLETE)"
        side_effects: ["required_count/satisfied_count/completeness_pct frozen at submit evaluation"]
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /doc-packs/{pack_id}/review outcome=ACCEPT"
        actor: InsurerSurveyor
        preconditions: []
        side_effects: ["review_notes := input notes"]
      - from: SUBMITTED
        to: COMPILING
        trigger: "POST /doc-packs/{pack_id}/review outcome=DEFICIENT"
        actor: InsurerSurveyor
        preconditions: []
        side_effects: ["review_notes := input notes"]
        note: "Cyclic rework loop: SUBMITTED -> COMPILING -> SUBMITTED"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only; all other conflicts are state preconditions)
# =============================================================================
concurrency_rules:
  - rule_id: contract-counter-stale-version
    parent_entity: SalvageContract
    write_endpoint: "POST /contracts/{contract_id}/counter"
    occ_field: "expected_contract_version"
    description: |
      Filing a counter-offer against a SalvageContract whose version has
      advanced since the client last read it is rejected: the client's view
      of the negotiation is stale (e.g., the other party's counter has just
      been recorded, legitimately superseding the current terms under the
      OFFERED <-> COUNTERED cycle). The loser observes version drift only
      through the OCC field, never through wall-clock overlap.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412

  - rule_id: assessment-create-stale-casualty
    parent_entity: Casualty
    write_endpoint: "POST /assessments"
    occ_field: "expected_casualty_version"
    description: |
      Creating an Assessment against a Casualty whose version has advanced
      since the client last read it is rejected: a newer assessment may have
      just superseded the one under review (creation legitimately supersedes
      any sibling in SUBMITTED), so the stale writer must re-read before
      adding another survey.
    error_id: ERR_STALE_CASUALTY_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: salvage_award_provisional
    trigger: "POST /contracts/{contract_id}/sign (contract SIGNED)"
    algorithm: threshold
    formula: |
      if form == NO_CURE_NO_PAY:
        provisional_award_cents = round_half_up(declared_salved_value_cents * PROVISIONAL_PCT)
      if form == FIXED_PRICE:
        provisional_award_cents = fixed_price_cents
    input_set: "The casualty's declared_salved_value_cents (owner-declared, unverified) for NCNP; the contract's fixed_price_cents for FIXED_PRICE"
    constants:
      PROVISIONAL_PCT: 0.12
    precision: "0 decimal places (integer cents), round_half_up"
    variants:
      - name: provisional
        when: "At contract sign — sizes the security demand"
        difference: "Flat 12% of DECLARED value (NCNP) or the fixed price; ignores tiers, risk, pollution, and verification"

  - name: salvage_award_final
    trigger: "POST /contracts/{contract_id}/award (award COMPUTED)"
    algorithm: tiered_pricing
    formula: |
      if form == FIXED_PRICE: computed_amount_cents = fixed_price_cents
      else (NO_CURE_NO_PAY):
        V = sum(verified_value_cents over RecoveredProperty of the casualty with documentation_status == VALUE_VERIFIED)
        base = 0.10 * min(V, T1_CAP) + 0.08 * max(0, min(V, T2_CAP) - T1_CAP) + 0.06 * max(0, V - T2_CAP)
        risk_add = RISK_ADD[casualty.casualty_type]
        env_add  = ENV_ADD[max tier over all PollutionEvents of the casualty, any status; 0 if none]
        enhanced = round_half_up(base * (1 + risk_add + env_add))
        computed_amount_cents = min(enhanced, V)
    input_set: "Only RecoveredProperty lots with documentation_status == VALUE_VERIFIED count toward V; PENDING_SURVEY/SURVEYED lots are excluded (award compute rejects while any lot is unverified — see ERR_PROPERTIES_NOT_VERIFIED)"
    constants:
      T1_CAP: 100000000
      T2_CAP: 500000000
      RISK_ADD: { GROUNDING: 0.05, COLLISION: 0.08, FIRE: 0.10, SUNK: 0.15 }
      ENV_ADD: { TIER_1: 0.05, TIER_2: 0.10, TIER_3: 0.20 }
    precision: "base computed in exact rational arithmetic; single round_half_up to integer cents after enhancement; cap applied after rounding"
    variants:
      - name: final
        when: "At award compute — after operations complete"
        difference: "Tiered percentage of VERIFIED value with risk and pollution enhancement, capped at verified value; diverges from provisional on identical declared==verified data (12% flat vs tiered+multiplier)"

  - name: security_requirement
    trigger: "POST /contracts/{contract_id}/sign (same evaluation moment as salvage_award_provisional)"
    algorithm: threshold
    formula: |
      if form == NO_CURE_NO_PAY: security_required_cents = round_half_up(provisional_award_cents * SECURITY_MULTIPLIER)
      if form == FIXED_PRICE:    security_required_cents = round_half_up(fixed_price_cents * FIXED_SECURITY_PCT)
      Coverage check at /activate: held_cents >= security_required_cents (inclusive: exact equality passes)
    input_set: "provisional_award_cents (NCNP) or fixed_price_cents (FIXED_PRICE)"
    constants:
      SECURITY_MULTIPLIER: 1.25
      FIXED_SECURITY_PCT: 0.30
    precision: "integer cents, round_half_up"

  - name: charter_cost
    trigger: "POST /charters/{charter_id}/off-hire; also forced by contract terminate cascade"
    algorithm: aggregation
    formula: |
      booked_hours    = (window_end - window_start) in whole hours
      elapsed_hours   = (off_hire_at - on_hire_at) in whole hours
      demurrage_hours = max(0, elapsed_hours - booked_hours)   # strictly-greater trigger: elapsed == booked => 0
      active_hours    = elapsed_hours - standby_hours - demurrage_hours
      demurrage_days  = round_half_up(demurrage_hours / 24)
      standby_days    = round_half_up(standby_hours / 24)
      active_days     = round_half_up(active_hours / 24)
      PINNED ROUNDING ORDER (mode b): each rate line is rounded to integer cents FIRST, then multiplied by days, then summed:
      total_cost_cents = active_days    * round_half_up(day_rate_cents)
                       + standby_days   * round_half_up(day_rate_cents * STANDBY_FACTOR)
                       + demurrage_days * round_half_up(day_rate_cents * DEMURRAGE_FACTOR)
      (Summing unrounded line values and rounding once at the end is a different, non-conformant result.)
    input_set: "The single charter being taken off-hire"
    constants:
      STANDBY_FACTOR: 0.5
      DEMURRAGE_FACTOR: 1.5
    precision: "integer cents, round_half_up per rate line before multiplying by days"

  - name: special_compensation
    trigger: "provisional: on EquipmentCharter BOOKED with purpose == POLLUTION_RESPONSE; final + netting: on POST /pollution-events/{id}/verify-clean; re-netting: whenever award.computed_amount_cents is (re)computed while final_exposure exists"
    algorithm: aggregation
    formula: |
      Response set R = EquipmentCharters with purpose == POLLUTION_RESPONSE, casualty_id == event.casualty_id,
                       and pollution_event_id == event.id.
      PROVISIONAL (tariff variant), per event, summed over R regardless of charter status:
        provisional_exposure_cents = Σ round_half_up(asset.day_rate_cents * SCOPIC_UPLIFT_MULT) * booked_days(charter)
      FINAL (actual variant), at verify-clean, over charters in R with status OFF_HIRE:
        actual = Σ charter.total_cost_cents
        final_exposure_cents = round_half_up(actual * POLLUTANT_MULT[event.pollutant_class])
      NETTING (pinned evaluation order — mode c): evaluate (1) charter_cost at each off-hire,
        (2) salvage_award_final at award compute, (3) only then:
        if contract.scopic_clause_included AND award exists:  payable = max(0, final_exposure_cents - award.computed_amount_cents)
        else:                                                  payable = final_exposure_cents
        The order is normative: netting before the award is computed is undefined; reversed dependency is forbidden.
    input_set: "Charters filtered by purpose == POLLUTION_RESPONSE and pollution_event_id == event.id (SALVAGE charters never contribute)"
    constants:
      SCOPIC_UPLIFT_MULT: 1.25
      POLLUTANT_MULT: { OIL_PERSISTENT: 1.5, OIL_NON_PERSISTENT: 1.2, CHEMICAL: 1.8, DEBRIS: 1.0 }
    precision: "integer cents, round_half_up per tariff line and at final multiplication"
    variants:
      - name: provisional_tariff
        when: "While the response is running (charter booking)"
        difference: "Booked days at uplifted tariff rates — ignores actual days, standby, demurrage, and pollutant multiplier"
      - name: final_actual
        when: "At verify-clean"
        difference: "Actual off-hire costs times pollutant multiplier — same charter set, different result whenever actual usage deviates from booking"

  - name: pollution_posture_derivation
    trigger: "On PollutionEvent create, escalate, contain, verify-clean (any tier/status change)"
    algorithm: threshold
    formula: |
      open = PollutionEvents of the casualty with status in {REPORTED, ESCALATED, CONTAINED}  # CONTAINED is still open
      if any open event has tier in {TIER_2, TIER_3}: env_posture = ENV_HOLD
      elif any open event has tier == TIER_1:          env_posture = ENV_WATCH
      else:                                            env_posture = ENV_CLEAR
      ENV_HOLD gates: phase activate/resume (ERR_ENV_HOLD_ACTIVE). CONTAINED alone never relaxes the posture.
    input_set: "All PollutionEvents of the casualty (open-state filter above)"

  - name: phase_permit_requirement
    trigger: "POST /phases/{phase_id}/activate"
    algorithm: constraint_propagation
    formula: |
      required_agencies = PERMIT_MAP[phase_type]
      for each agency in required_agencies:
        some Permit of the casualty must satisfy: status == GRANTED AND valid_from <= now AND valid_to >= now + planned_duration_hours
      (missing agency -> ERR_PERMIT_MISSING; present but out-of-validity -> ERR_PERMIT_NOT_VALID)
    input_set: "Permits of the casualty"
    constants:
      PERMIT_MAP:
        MOBILIZATION: [PORT_AUTHORITY]
        LIGHTERING: [COAST_GUARD, ENV_AGENCY]
        REFLOAT: [COAST_GUARD]
        TOWAGE: [COAST_GUARD]
        WRECK_REMOVAL: [COAST_GUARD, ENV_AGENCY]
        DEMOBILIZATION: [PORT_AUTHORITY]

  - name: weather_feasibility
    trigger: "POST /phases/{phase_id}/activate"
    algorithm: interval_merge
    formula: |
      window must have status == OPEN (ERR_WEATHER_WINDOW_INFEASIBLE)
      hs_limit = min(asset.max_hs_meters over charter_ids' assets)
      window.forecast_hs_meters <= hs_limit          # inclusive boundary: equality passes (ERR_WEATHER_LIMIT_EXCEEDED)
      containment with mandatory buffer (closed interval minus buffer at both ends):
        now >= window.window_start + WEATHER_BUFFER_HOURS
        now + planned_duration_hours <= window.window_end - WEATHER_BUFFER_HOURS
        (violation -> ERR_WEATHER_WINDOW_INFEASIBLE; equality at both buffer edges passes)
    input_set: "The named WeatherWindow and the assets of charter_ids"
    constants:
      WEATHER_BUFFER_HOURS: 6

  - name: doc_pack_completeness
    trigger: "On DocEntry creation and on POST /doc-packs/{pack_id}/submit (evaluated live, frozen at submit)"
    algorithm: threshold
    formula: |
      contract = pack.contract_id; casualty = contract.casualty_id
      required DAILY_LOG:      one per OperationPhase of the contract ever activated (status in {ACTIVE, WEATHER_HOLD, ENV_SUSPENDED, COMPLETE, ABORTED} and activated_at not null)
      required COST_LOG:       one per EquipmentCharter of the casualty with status OFF_HIRE
      required POLLUTION_REPORT: one per PollutionEvent of the casualty (any status)
      required SURVEY_REPORT:  one per RecoveredProperty of the casualty with documentation_status in {SURVEYED, VALUE_VERIFIED}
      satisfied = count of required items covered by at least one DocEntry of matching entry_type and ref_id
      completeness_pct = 100 * satisfied / required (0 if required == 0)
      submit requires completeness_pct == 100 exactly (inclusive boundary; 3 of 4 = 75 fails)
    input_set: "Phases/charters/events/properties scoped to the pack's contract casualty; DocEntries of this pack"

  - name: salved_value_reconciliation
    trigger: "On property verify-value; read by salvage_award_final"
    algorithm: aggregation
    formula: |
      total_verified_salved_value_cents(casualty) = Σ verified_value_cents over RecoveredProperty
                                                    with documentation_status == VALUE_VERIFIED
    input_set: "RecoveredProperty of the casualty, documentation_status filter as stated"

  - name: security_conservation
    trigger: "On every POST /securities and /securities/{id}/disburse"
    algorithm: waterfall_allocation
    formula: |
      INVARIANT (money): lodged_amount_cents == held_cents + released_cents + applied_cents at all times.
      lodge:   held += amount (lodged fixed at creation)
      release: held -= amount; released += amount      (requires contract SETTLED or TERMINATED)
      apply:   held -= amount; applied  += amount      (requires award PAID)
      A disburse that would make held_cents negative is rejected (ERR_SECURITY_DISBURSE_EXCEEDS_HELD);
      forward + compensating actions leave lodged_amount_cents unchanged.

  - name: property_mass_conservation
    trigger: "On every POST /properties/{id}/dispose"
    algorithm: waterfall_allocation
    formula: |
      INVARIANT (mass): quantity_tonnes == redelivered_tonnes + sold_tonnes + disposed_tonnes + in_custody_tonnes at all times.
      dispose(method, tonnes): bucket[method] += tonnes; in_custody_tonnes -= tonnes
      Reject when tonnes > in_custody_tonnes (ERR_QUANTITY_EXCEEDS_REMAINING).
      Terminal custody is reached exactly when in_custody_tonnes == 0; the terminal state is the
      method of the zeroing dispose call. Forward + compensating disposition never changes quantity_tonnes.

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 0
    category: existence
    check: "Request schema: all required fields present; enums valid; numeric amounts/quantities positive where required; datetime ranges valid (valid_to > valid_from, window_end > window_start); conditional fields honored (fixed_price_cents required iff form == FIXED_PRICE; pollution_event_id required iff purpose == POLLUTION_RESPONSE)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutating endpoints"

  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; role name is a declared role"
    error_id: ERR_MISSING_OR_INVALID_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The declared role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path ids exist, validated left-to-right; body-referenced ids exist (casualty_id, plan_id, contract_id, equipment_asset_id, weather_window_id, charter_ids, storage_site_id, doc ref_id)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: auth
    check: "Segregation of duties: approver is not the author (assessment approve/reject vs assessor_id; plan approve vs drafter_id; property verify-value vs surveyor_id)"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "POST /assessments/{id}/approve, POST /assessments/{id}/reject, POST /plans/{id}/approve, POST /properties/{id}/verify-value"

  - priority: 5
    category: state
    check: "Target resource state permits the requested transition (wrong from-state)"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 5
    category: state
    check: "Target resource is in a terminal state (any further action)"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "all action endpoints"
    note: "Same priority tier as ERR_INVALID_STATE_TRANSITION; terminal-from takes precedence when both apply"

  - priority: 6
    category: business_safety
    check: "Environmental/weather safety gates: env_posture != ENV_HOLD on phase activate/resume (ERR_ENV_HOLD_ACTIVE); TIER_3 assessment requires GRANTED ENV_AGENCY permit at contract activate (ERR_ENV_CLEARANCE_REQUIRED); forecast_hs within asset limits (ERR_WEATHER_LIMIT_EXCEEDED); window containment with 6h buffers (ERR_WEATHER_WINDOW_INFEASIBLE)"
    error_id: "ERR_ENV_HOLD_ACTIVE | ERR_ENV_CLEARANCE_REQUIRED | ERR_WEATHER_LIMIT_EXCEEDED | ERR_WEATHER_WINDOW_INFEASIBLE"
    http_status: 422
    applies_to: "POST /phases/{id}/activate, POST /phases/{id}/resume, POST /contracts/{id}/activate"

  - priority: 7
    category: business_temporal
    check: "Time-window rules: required agency permit present (ERR_PERMIT_MISSING) and valid for [now, now + planned_duration] (ERR_PERMIT_NOT_VALID); charter half-open overlap on the same asset (ERR_CHARTER_OVERLAP); storage site aggregate capacity (ERR_STORAGE_CAPACITY_EXCEEDED); on-hire inside booked window (ERR_CHARTER_WINDOW_NOT_OPEN)"
    error_id: "ERR_PERMIT_MISSING | ERR_PERMIT_NOT_VALID | ERR_CHARTER_OVERLAP | ERR_STORAGE_CAPACITY_EXCEEDED | ERR_CHARTER_WINDOW_NOT_OPEN"
    http_status: 409
    applies_to: "POST /phases/{id}/activate, POST /charters, POST /charters/{id}/on-hire, POST /properties/{id}/secure-ashore"
    note: "ERR_PERMIT_MISSING/ERR_PERMIT_NOT_VALID return 422; overlap/capacity conflicts return 409"

  - priority: 8
    category: business_referential
    check: "Referenced-entity state gates: APPROVED assessment exists (ERR_ASSESSMENT_NOT_APPROVED); plan APPROVED (ERR_PLAN_NOT_APPROVED); contract operable for charter/phase/property creation (ERR_CONTRACT_NOT_ACTIVE); all lots VALUE_VERIFIED before award compute (ERR_PROPERTIES_NOT_VERIFIED); all lots terminal custody before arbitration (ERR_PROPERTIES_NOT_DISPOSED); lien blocks REDELIVER (ERR_LIEN_ACTIVE); charter asset class within plan requirements (ERR_ASSET_CLASS_NOT_REQUIRED); all doc packs ACCEPTED before settle (ERR_DOCS_NOT_ACCEPTED)"
    error_id: "ERR_ASSESSMENT_NOT_APPROVED | ERR_PLAN_NOT_APPROVED | ERR_CONTRACT_NOT_ACTIVE | ERR_PROPERTIES_NOT_VERIFIED | ERR_PROPERTIES_NOT_DISPOSED | ERR_LIEN_ACTIVE | ERR_ASSET_CLASS_NOT_REQUIRED | ERR_DOCS_NOT_ACCEPTED"
    http_status: 422
    applies_to: "contract sign, plan approve, charter/phase/property creation, award compute/submit-arbitration, property dispose"

  - priority: 9
    category: business_constraint
    check: "Aggregate/uniqueness/argument constraints: one non-terminal contract per casualty (ERR_DUPLICATE_ACTIVE_CONTRACT); one non-terminal DocPack per contract (ERR_DUPLICATE_OPEN_DOC_PACK); one award per contract (ERR_AWARD_ALREADY_EXISTS); dispose tonnage within remaining (ERR_QUANTITY_EXCEEDS_REMAINING); escalate must raise tier (ERR_POLLUTION_TIER_NOT_RAISED); doc entry ref type/state match (ERR_DOC_ENTRY_INVALID); termination reason/form/state legality (ERR_TERMINATION_NOT_ALLOWED, ERR_NO_CURE_REQUIRES_NCNP); casualty closeability (ERR_CASUALTY_NOT_CLOSABLE)"
    error_id: "ERR_DUPLICATE_ACTIVE_CONTRACT | ERR_DUPLICATE_OPEN_DOC_PACK | ERR_AWARD_ALREADY_EXISTS | ERR_QUANTITY_EXCEEDS_REMAINING | ERR_POLLUTION_TIER_NOT_RAISED | ERR_DOC_ENTRY_INVALID | ERR_TERMINATION_NOT_ALLOWED | ERR_NO_CURE_REQUIRES_NCNP | ERR_CASUALTY_NOT_CLOSABLE"
    http_status: 422
    applies_to: "various (see errors table)"
    note: "ERR_DUPLICATE_* and ERR_AWARD_ALREADY_EXISTS return 409"

  - priority: 10
    category: business_fiscal
    check: "Money gates evaluated last: security coverage at contract activate (ERR_SECURITY_INSUFFICIENT); disburse amount within held (ERR_SECURITY_DISBURSE_EXCEEDS_HELD); disburse mode allowed in current contract/award state (ERR_SECURITY_DISBURSE_NOT_ALLOWED); doc pack completeness (ERR_DOC_INCOMPLETE)"
    error_id: "ERR_SECURITY_INSUFFICIENT | ERR_SECURITY_DISBURSE_EXCEEDS_HELD | ERR_SECURITY_DISBURSE_NOT_ALLOWED | ERR_DOC_INCOMPLETE"
    http_status: 422
    applies_to: "POST /contracts/{id}/activate, POST /securities/{id}/disburse, POST /doc-packs/{id}/submit"

  - priority: 11
    category: business_constraint
    check: "OCC: expected_*_version equals the parent entity's current version"
    error_id: "ERR_STALE_CONTRACT_VERSION | ERR_STALE_CASUALTY_VERSION"
    http_status: 412
    applies_to: "POST /contracts/{id}/counter, POST /assessments"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock (test-driving endpoint; default time before any call is 2026-05-01T00:00:00Z) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Before any call, the clock reads exactly 2026-05-01T00:00:00Z and never falls back to wall-clock. Side effect: sweeps Permits (GRANTED/SUSPENDED/REQUESTED -> EXPIRED when now > valid_to) and WeatherWindows (OPEN -> EXPIRED when now > window_end)."
    roles: [SalvageMaster, ContractsOfficer, MarineSurveyor, EnvironmentalOfficer, OperationsDirector, Arbitrator, InsurerSurveyor]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, expired_permit_ids: string[], expired_window_ids: string[] }"
    side_effects: ["Permit/WeatherWindow expiry sweep at the new time"]

  # --- Casualties ---
  - method: POST
    path: "/casualties"
    description: "Report a new casualty (wreck/grounding incident)"
    roles: [SalvageMaster]
    code: 201
    input: [vessel_name, casualty_type, declared_salved_value_cents, position, "pollutant_inventory_note?"]
    output: Casualty
    side_effects: ["lifecycle_status=REPORTED, env_posture=ENV_CLEAR"]
  - method: GET
    path: "/casualties"
    description: "List casualties with filters"
    roles: [SalvageMaster, ContractsOfficer, MarineSurveyor, EnvironmentalOfficer, OperationsDirector, Arbitrator, InsurerSurveyor]
    code: 200
    input: ["lifecycle_status?", "env_posture?", "limit?", "offset?"]
    output: "Casualty[]"
    side_effects: []
  - method: GET
    path: "/casualties/{casualty_id}"
    description: "Get one casualty"
    roles: [SalvageMaster, ContractsOfficer, MarineSurveyor, EnvironmentalOfficer, OperationsDirector, Arbitrator, InsurerSurveyor]
    code: 200
    input: []
    output: Casualty
    side_effects: []
  - method: POST
    path: "/casualties/{casualty_id}/close"
    description: "Close a casualty file (terminal)"
    roles: [OperationsDirector]
    code: 200
    input: []
    output: Casualty
    side_effects: ["lifecycle_status -> CLOSED"]

  # --- Assessments ---
  - method: POST
    path: "/assessments"
    description: "Submit an incident assessment (supersedes any sibling in SUBMITTED; OCC on casualty version)"
    roles: [MarineSurveyor]
    code: 201
    input: [casualty_id, expected_casualty_version, pollution_risk_tier, wreck_removal_required, estimated_cost_cents, "notes?"]
    output: Assessment
    side_effects: ["status=SUBMITTED, assessor_id=X-User-ID, casualty_seq assigned", "Sibling SUBMITTED assessments -> SUPERSEDED", "increments Casualty.version by 1"]
  - method: GET
    path: "/assessments"
    description: "List assessments (filterable by casualty_id, status)"
    roles: [SalvageMaster, ContractsOfficer, MarineSurveyor, EnvironmentalOfficer, OperationsDirector, Arbitrator, InsurerSurveyor]
    code: 200
    input: ["casualty_id?", "status?", "limit?", "offset?"]
    output: "Assessment[]"
    side_effects: []
  - method: GET
    path: "/assessments/{assessment_id}"
    description: "Get one assessment"
    roles: [SalvageMaster, ContractsOfficer, MarineSurveyor, EnvironmentalOfficer, OperationsDirector, Arbitrator, InsurerSurveyor]
    code: 200
    input: []
    output: Assessment
    side_effects: []
  - method: POST
    path: "/assessments/{assessment_id}/approve"
    description: "Approve an assessment (SoD: approver != assessor)"
    roles: [OperationsDirector]
    code: 200
    input: []
    output: Assessment
    side_effects: ["status -> APPROVED", "casualty lifecycle REPORTED -> ASSESSED"]
  - method: POST
    path: "/assessments/{assessment_id}/reject"
    description: "Reject an assessment (SoD: reviewer != assessor)"
    roles: [OperationsDirector]
    code: 200
    input: []
    output: Assessment
    side_effects: ["status -> REJECTED"]

  # --- Salvage plans ---
  - method: POST
    path: "/plans"
    description: "Draft a salvage plan"
    roles: [SalvageMaster]
    code: 201
    input: [casualty_id, method, required_equipment_classes]
    output: SalvagePlan
    side_effects: ["status=DRAFT, drafter_id=X-User-ID"]
  - method: GET
    path: "/plans"
    description: "List plans (filterable by casualty_id, status)"
    roles: [SalvageMaster, ContractsOfficer, MarineSurveyor, EnvironmentalOfficer, OperationsDirector, Arbitrator, InsurerSurveyor]
    code: 200
    input: ["casualty_id?", "status?", "limit?", "offset?"]
    output: "SalvagePlan[]"
    side_effects: []
  - method: GET
    path: "/plans/{plan_id}"
    description: "Get one plan"
    roles: [SalvageMaster, ContractsOfficer, MarineSurveyor, EnvironmentalOfficer, OperationsDirector, Arbitrator, InsurerSurveyor]
    code: 200
    input: []
    output: SalvagePlan
    side_effects: []
  - method: POST
    path: "/plans/{plan_id}/submit"
    description: "Submit plan for approval"
    roles: [SalvageMaster]
    code: 200
    input: []
    output: SalvagePlan
    side_effects: ["status -> SUBMITTED"]
  - method: POST
    path: "/plans/{plan_id}/approve"
    description: "Approve plan (SoD: approver != drafter; requires APPROVED assessment)"
    roles: [OperationsDirector]
    code: 200
    input: []
    output: SalvagePlan
    side_effects: ["status -> APPROVED", "casualty lifecycle ASSESSED -> PLANNED"]
  - method: POST
    path: "/plans/{plan_id}/reject"
    description: "Reject plan back to DRAFT (revision loop)"
    roles: [OperationsDirector]
    code: 200
    input: []
    output: SalvagePlan
    side_effects: ["status -> DRAFT"]

  # --- Contracts ---
  - method: POST
    path: "/contracts"
    description: "Create a salvage contract in DRAFT (one non-terminal contract per casualty)"
    roles: [ContractsOfficer]
    code: 201
    input: [casualty_id, plan_id, form, "fixed_price_cents?", "scopic_clause_included?"]
    output: SalvageContract
    side_effects: ["status=DRAFT, negotiation_round=0"]
  - method: GET
    path: "/contracts"
    description: "List contracts (filterable by casualty_id, plan_id, status)"
    roles: [SalvageMaster, ContractsOfficer, MarineSurveyor, EnvironmentalOfficer, OperationsDirector, Arbitrator, InsurerSurveyor]
    code: 200
    input: ["casualty_id?", "plan_id?", "status?", "limit?", "offset?"]
    output: "SalvageContract[]"
    side_effects: []
  - method: GET
    path: "/contracts/{contract_id}"
    description: "Get one contract"
    roles: [SalvageMaster, ContractsOfficer, MarineSurveyor, EnvironmentalOfficer, OperationsDirector, Arbitrator, InsurerSurveyor]
    code: 200
    input: []
    output: SalvageContract
    side_effects: []
  - method: POST
    path: "/contracts/{contract_id}/offer"
    description: "Issue the opening offer (DRAFT -> OFFERED, round 1)"
    roles: [ContractsOfficer]
    code: 200
    input: []
    output: SalvageContract
    side_effects: ["status -> OFFERED, negotiation_round=1", "increments SalvageContract.version by 1"]
  - method: POST
    path: "/contracts/{contract_id}/counter"
    description: "Counter-offer (OFFERED <-> COUNTERED cycle; OCC on contract version)"
    roles: [ContractsOfficer]
    code: 200
    input: [expected_contract_version, "terms_note?"]
    output: SalvageContract
    side_effects: ["status flips OFFERED<->COUNTERED", "negotiation_round += 1", "increments SalvageContract.version by 1"]
  - method: POST
    path: "/contracts/{contract_id}/sign"
    description: "Sign the contract from OFFERED or COUNTERED; computes provisional award and security requirement"
    roles: [ContractsOfficer]
    code: 200
    input: []
    output: SalvageContract
    side_effects: ["status -> SIGNED", "computes provisional_award_cents + security_required_cents", "casualty lifecycle PLANNED -> CONTRACTED", "increments SalvageContract.version by 1"]
  - method: POST
    path: "/contracts/{contract_id}/activate"
    description: "Activate a signed contract (safety gate before fiscal gate)"
    roles: [ContractsOfficer]
    code: 200
    input: []
    output: SalvageContract
    side_effects: ["status -> ACTIVE", "increments SalvageContract.version by 1"]
  - method: POST
    path: "/contracts/{contract_id}/terminate"
    description: "Terminate: MUTUAL from DRAFT/OFFERED/COUNTERED/SIGNED; NO_CURE from ACTIVE on NO_CURE_NO_PAY only"
    roles: [ContractsOfficer]
    code: 200
    input: [reason]
    output: SalvageContract
    side_effects: ["status -> TERMINATED", "NO_CURE cascade: phases ABORTED, charters OFF_HIRE/CANCELLED, properties disposition-eligible"]
  - method: POST
    path: "/contracts/{contract_id}/settle"
    description: "Settle the contract after award final (requires security CLOSED and doc packs ACCEPTED)"
    roles: [ContractsOfficer]
    code: 200
    input: []
    output: SalvageContract
    side_effects: ["status -> SETTLED"]

  # --- Securities ---
  - method: POST
    path: "/securities"
    description: "Lodge a security deposit against a SIGNED contract"
    roles: [ContractsOfficer]
    code: 201
    input: [contract_id, lodged_amount_cents]
    output: SecurityDeposit
    side_effects: ["status=LODGED, held_cents=lodged_amount_cents"]
  - method: GET
    path: "/securities"
    description: "List security deposits (filterable by contract_id, status)"
    roles: [SalvageMaster, ContractsOfficer, MarineSurveyor, EnvironmentalOfficer, OperationsDirector, Arbitrator, InsurerSurveyor]
    code: 200
    input: ["contract_id?", "status?", "limit?", "offset?"]
    output: "SecurityDeposit[]"
    side_effects: []
  - method: GET
    path: "/securities/{security_id}"
    description: "Get one security deposit"
    roles: [SalvageMaster, ContractsOfficer, MarineSurveyor, EnvironmentalOfficer, OperationsDirector, Arbitrator, InsurerSurveyor]
    code: 200
    input: []
    output: SecurityDeposit
    side_effects: []
  - method: POST
    path: "/securities/{security_id}/disburse"
    description: "Disburse held funds: RELEASE to owner (contract SETTLED/TERMINATED) or APPLY_TO_AWARD (award PAID)"
    roles: [ContractsOfficer]
    code: 200
    input: [mode, amount_cents]
    output: SecurityDeposit
    side_effects: ["bucket transfer per mode", "status PARTIALLY_DISBURSED or CLOSED", "increments SecurityDeposit.version by 1"]

  # --- Permits ---
  - method: POST
    path: "/permits"
    description: "File a permit request with an agency"
    roles: [EnvironmentalOfficer]
    code: 201
    input: [casualty_id, agency_type, valid_from, valid_to]
    output: Permit
    side_effects: ["status=REQUESTED"]
  - method: GET
    path: "/permits"
    description: "List permits (filterable by casualty_id, agency_type, status)"
    roles: [SalvageMaster, ContractsOfficer, MarineSurveyor, EnvironmentalOfficer, OperationsDirector, Arbitrator, InsurerSurveyor]
    code: 200
    input: ["casualty_id?", "agency_type?", "status?", "limit?", "offset?"]
    output: "Permit[]"
    side_effects: []
  - method: GET
    path: "/permits/{permit_id}"
    description: "Get one permit"
    roles: [SalvageMaster, ContractsOfficer, MarineSurveyor, EnvironmentalOfficer, OperationsDirector, Arbitrator, InsurerSurveyor]
    code: 200
    input: []
    output: Permit
    side_effects: []
  - method: POST
    path: "/permits/{permit_id}/grant"
    description: "Agency grants the permit"
    roles: [EnvironmentalOfficer]
    code: 200
    input: []
    output: Permit
    side_effects: ["status -> GRANTED"]
  - method: POST
    path: "/permits/{permit_id}/suspend"
    description: "Agency suspends the permit"
    roles: [EnvironmentalOfficer]
    code: 200
    input: []
    output: Permit
    side_effects: ["status -> SUSPENDED"]
  - method: POST
    path: "/permits/{permit_id}/reinstate"
    description: "Agency reinstates a suspended permit"
    roles: [EnvironmentalOfficer]
    code: 200
    input: []
    output: Permit
    side_effects: ["status -> GRANTED"]
  - method: POST
    path: "/permits/{permit_id}/revoke"
    description: "Agency revokes the permit (terminal)"
    roles: [EnvironmentalOfficer]
    code: 200
    input: []
    output: Permit
    side_effects: ["status -> REVOKED"]

  # --- Equipment assets ---
  - method: POST
    path: "/equipment-assets"
    description: "Register a contractor equipment asset"
    roles: [OperationsDirector]
    code: 201
    input: [asset_class, day_rate_cents, max_hs_meters]
    output: EquipmentAsset
    side_effects: ["status=AVAILABLE"]
  - method: GET
    path: "/equipment-assets"
    description: "List equipment assets (filterable by asset_class, status)"
    roles: [SalvageMaster, ContractsOfficer, MarineSurveyor, EnvironmentalOfficer, OperationsDirector, Arbitrator, InsurerSurveyor]
    code: 200
    input: ["asset_class?", "status?", "limit?", "offset?"]
    output: "EquipmentAsset[]"
    side_effects: []
  - method: GET
    path: "/equipment-assets/{asset_id}"
    description: "Get one equipment asset"
    roles: [SalvageMaster, ContractsOfficer, MarineSurveyor, EnvironmentalOfficer, OperationsDirector, Arbitrator, InsurerSurveyor]
    code: 200
    input: []
    output: EquipmentAsset
    side_effects: []

  # --- Equipment charters ---
  - method: POST
    path: "/charters"
    description: "Book an equipment charter window (half-open [start,end); adjacent allowed; overlapping rejected). Requires the casualty's contract in {SIGNED, ACTIVE, PERFORMANCE_COMPLETE}."
    roles: [SalvageMaster]
    code: 201
    input: [casualty_id, equipment_asset_id, window_start, window_end, purpose, "pollution_event_id?"]
    output: EquipmentCharter
    side_effects: ["status=BOOKED", "asset -> CHARTERED", "POLLUTION_RESPONSE: event provisional_exposure_cents recomputed"]
  - method: GET
    path: "/charters"
    description: "List charters (filterable by casualty_id, equipment_asset_id, pollution_event_id, status)"
    roles: [SalvageMaster, ContractsOfficer, MarineSurveyor, EnvironmentalOfficer, OperationsDirector, Arbitrator, InsurerSurveyor]
    code: 200
    input: ["casualty_id?", "equipment_asset_id?", "pollution_event_id?", "status?", "limit?", "offset?"]
    output: "EquipmentCharter[]"
    side_effects: []
  - method: GET
    path: "/charters/{charter_id}"
    description: "Get one charter"
    roles: [SalvageMaster, ContractsOfficer, MarineSurveyor, EnvironmentalOfficer, OperationsDirector, Arbitrator, InsurerSurveyor]
    code: 200
    input: []
    output: EquipmentCharter
    side_effects: []
  - method: POST
    path: "/charters/{charter_id}/on-hire"
    description: "Bring a booked charter on hire at the logical clock"
    roles: [SalvageMaster]
    code: 200
    input: []
    output: EquipmentCharter
    side_effects: ["status -> ON_HIRE", "on_hire_at := now", "increments EquipmentCharter.version by 1"]
  - method: POST
    path: "/charters/{charter_id}/off-hire"
    description: "Take a charter off hire; computes day buckets and total_cost_cents; refreshes contract cost_to_date and overrun_flag"
    roles: [SalvageMaster]
    code: 200
    input: []
    output: EquipmentCharter
    side_effects: ["status -> OFF_HIRE", "computes active_days/standby_days/demurrage_days/total_cost_cents", "contract cost_to_date_cents + overrun_flag recompute", "asset status re-derived", "POLLUTION_RESPONSE: event exposure inputs refresh"]

  # --- Weather windows ---
  - method: POST
    path: "/weather-windows"
    description: "Register a forecast weather window for a casualty site"
    roles: [SalvageMaster]
    code: 201
    input: [casualty_id, window_start, window_end, forecast_hs_meters]
    output: WeatherWindow
    side_effects: ["status=OPEN"]
  - method: GET
    path: "/weather-windows"
    description: "List weather windows (filterable by casualty_id, status)"
    roles: [SalvageMaster, ContractsOfficer, MarineSurveyor, EnvironmentalOfficer, OperationsDirector, Arbitrator, InsurerSurveyor]
    code: 200
    input: ["casualty_id?", "status?", "limit?", "offset?"]
    output: "WeatherWindow[]"
    side_effects: []
  - method: GET
    path: "/weather-windows/{window_id}"
    description: "Get one weather window"
    roles: [SalvageMaster, ContractsOfficer, MarineSurveyor, EnvironmentalOfficer, OperationsDirector, Arbitrator, InsurerSurveyor]
    code: 200
    input: []
    output: WeatherWindow
    side_effects: []

  # --- Operation phases ---
  - method: POST
    path: "/phases"
    description: "Create an operation phase under an ACTIVE contract"
    roles: [SalvageMaster]
    code: 201
    input: [contract_id, phase_type, planned_duration_hours]
    output: OperationPhase
    side_effects: ["status=PLANNED"]
  - method: GET
    path: "/phases"
    description: "List phases (filterable by contract_id, status)"
    roles: [SalvageMaster, ContractsOfficer, MarineSurveyor, EnvironmentalOfficer, OperationsDirector, Arbitrator, InsurerSurveyor]
    code: 200
    input: ["contract_id?", "status?", "limit?", "offset?"]
    output: "OperationPhase[]"
    side_effects: []
  - method: GET
    path: "/phases/{phase_id}"
    description: "Get one phase"
    roles: [SalvageMaster, ContractsOfficer, MarineSurveyor, EnvironmentalOfficer, OperationsDirector, Arbitrator, InsurerSurveyor]
    code: 200
    input: []
    output: OperationPhase
    side_effects: []
  - method: POST
    path: "/phases/{phase_id}/activate"
    description: "Activate a phase inside a weather window with attached charters (env, weather, permit gates)"
    roles: [SalvageMaster]
    code: 200
    input: [weather_window_id, charter_ids]
    output: OperationPhase
    side_effects: ["status -> ACTIVE", "stores weather_window_id/charter_ids/activated_at", "charters' linked_phase_id set", "casualty CONTRACTED -> IN_OPERATION on first activation"]
  - method: POST
    path: "/phases/{phase_id}/hold-weather"
    description: "Suspend an active phase for weather (linked charters -> STANDBY_WEATHER)"
    roles: [SalvageMaster]
    code: 200
    input: []
    output: OperationPhase
    side_effects: ["status -> WEATHER_HOLD", "linked ON_HIRE charters -> STANDBY_WEATHER"]
  - method: POST
    path: "/phases/{phase_id}/resume"
    description: "Resume a phase from WEATHER_HOLD or ENV_SUSPENDED (env posture must be below HOLD)"
    roles: [SalvageMaster]
    code: 200
    input: []
    output: OperationPhase
    side_effects: ["status -> ACTIVE", "linked STANDBY_* charters -> ON_HIRE"]
  - method: POST
    path: "/phases/{phase_id}/complete"
    description: "Complete an active phase; last terminal phase bubbles contract to PERFORMANCE_COMPLETE"
    roles: [SalvageMaster]
    code: 200
    input: []
    output: OperationPhase
    side_effects: ["status -> COMPLETE", "cascade B: contract PERFORMANCE_COMPLETE -> casualty OPERATIONS_COMPLETE when all phases terminal"]

  # --- Pollution events ---
  - method: POST
    path: "/pollution-events"
    description: "Report a pollution event for a casualty"
    roles: [EnvironmentalOfficer]
    code: 201
    input: [casualty_id, pollutant_class, tier, est_volume_m3]
    output: PollutionEvent
    side_effects: ["status=REPORTED, tier := input", "casualty env_posture recomputed (may enter WATCH/HOLD and cascade to ACTIVE phases)"]
  - method: GET
    path: "/pollution-events"
    description: "List pollution events (filterable by casualty_id, status)"
    roles: [SalvageMaster, ContractsOfficer, MarineSurveyor, EnvironmentalOfficer, OperationsDirector, Arbitrator, InsurerSurveyor]
    code: 200
    input: ["casualty_id?", "status?", "limit?", "offset?"]
    output: "PollutionEvent[]"
    side_effects: []
  - method: GET
    path: "/pollution-events/{event_id}"
    description: "Get one pollution event"
    roles: [SalvageMaster, ContractsOfficer, MarineSurveyor, EnvironmentalOfficer, OperationsDirector, Arbitrator, InsurerSurveyor]
    code: 200
    input: []
    output: PollutionEvent
    side_effects: []
  - method: POST
    path: "/pollution-events/{event_id}/escalate"
    description: "Escalate event to a strictly higher tier (cascade A: posture -> phases -> charters)"
    roles: [EnvironmentalOfficer]
    code: 200
    input: [new_tier]
    output: PollutionEvent
    side_effects: ["status -> ESCALATED, tier := new_tier", "cascade A: env_posture -> ENV_HOLD -> phases ENV_SUSPENDED -> charters STANDBY_ENV"]
  - method: POST
    path: "/pollution-events/{event_id}/contain"
    description: "Mark event contained (posture does not relax until verify-clean)"
    roles: [EnvironmentalOfficer]
    code: 200
    input: []
    output: PollutionEvent
    side_effects: ["status -> CONTAINED", "env_posture recomputed"]
  - method: POST
    path: "/pollution-events/{event_id}/verify-clean"
    description: "Verify clean-up complete; computes final exposure and SCOPIC netting; relaxes posture"
    roles: [EnvironmentalOfficer]
    code: 200
    input: []
    output: PollutionEvent
    side_effects: ["status -> VERIFIED_CLEAN", "computes final_exposure_cents + special_compensation_payable_cents", "env_posture recomputed"]

  # --- Recovered property ---
  - method: POST
    path: "/properties"
    description: "Log a salved property lot (requires casualty's contract ACTIVE or PERFORMANCE_COMPLETE)"
    roles: [SalvageMaster]
    code: 201
    input: [casualty_id, property_type, quantity_tonnes, declared_value_cents]
    output: RecoveredProperty
    side_effects: ["custody_status=SALVED, documentation_status=PENDING_SURVEY", "in_custody_tonnes := quantity_tonnes"]
  - method: GET
    path: "/properties"
    description: "List property lots (filterable by casualty_id, custody_status, storage_site_id)"
    roles: [SalvageMaster, ContractsOfficer, MarineSurveyor, EnvironmentalOfficer, OperationsDirector, Arbitrator, InsurerSurveyor]
    code: 200
    input: ["casualty_id?", "custody_status?", "storage_site_id?", "limit?", "offset?"]
    output: "RecoveredProperty[]"
    side_effects: []
  - method: GET
    path: "/properties/{property_id}"
    description: "Get one property lot"
    roles: [SalvageMaster, ContractsOfficer, MarineSurveyor, EnvironmentalOfficer, OperationsDirector, Arbitrator, InsurerSurveyor]
    code: 200
    input: []
    output: RecoveredProperty
    side_effects: []
  - method: POST
    path: "/properties/{property_id}/secure-ashore"
    description: "Move a salved lot into a storage site (aggregate capacity check)"
    roles: [SalvageMaster]
    code: 200
    input: [storage_site_id]
    output: RecoveredProperty
    side_effects: ["custody_status -> SECURED_ASHORE", "storage_site_id set", "site allocated_tonnes recomputed"]
  - method: POST
    path: "/properties/{property_id}/survey"
    description: "Surveyor records verified value"
    roles: [MarineSurveyor]
    code: 200
    input: [verified_value_cents]
    output: RecoveredProperty
    side_effects: ["documentation_status -> SURVEYED", "verified_value_cents + surveyor_id set"]
  - method: POST
    path: "/properties/{property_id}/verify-value"
    description: "Operations director verifies the surveyed value (SoD: != surveyor)"
    roles: [OperationsDirector]
    code: 200
    input: []
    output: RecoveredProperty
    side_effects: ["documentation_status -> VALUE_VERIFIED"]
  - method: POST
    path: "/properties/{property_id}/lien"
    description: "Assert a salvage lien over a secured lot"
    roles: [ContractsOfficer]
    code: 200
    input: [lien_amount_cents]
    output: RecoveredProperty
    side_effects: ["custody_status -> LIENED", "lien_amount_cents set"]
  - method: POST
    path: "/properties/{property_id}/dispose"
    description: "Partially or fully dispose of a lot (REDELIVER | SELL | SCRAP) with mass-bucket accounting"
    roles: [SalvageMaster]
    code: 200
    input: [method, tonnes]
    output: RecoveredProperty
    side_effects: ["mass buckets updated", "terminal custody when in_custody_tonnes reaches 0", "site allocated_tonnes recomputed"]

  # --- Storage sites ---
  - method: POST
    path: "/storage-sites"
    description: "Register a storage site (yard/berth) with aggregate capacity"
    roles: [OperationsDirector]
    code: 201
    input: [name, capacity_tonnes]
    output: StorageSite
    side_effects: ["allocated_tonnes = 0"]
  - method: GET
    path: "/storage-sites"
    description: "List storage sites"
    roles: [SalvageMaster, ContractsOfficer, MarineSurveyor, EnvironmentalOfficer, OperationsDirector, Arbitrator, InsurerSurveyor]
    code: 200
    input: ["limit?", "offset?"]
    output: "StorageSite[]"
    side_effects: []
  - method: GET
    path: "/storage-sites/{site_id}"
    description: "Get one storage site"
    roles: [SalvageMaster, ContractsOfficer, MarineSurveyor, EnvironmentalOfficer, OperationsDirector, Arbitrator, InsurerSurveyor]
    code: 200
    input: []
    output: StorageSite
    side_effects: []

  # --- Salvage awards ---
  - method: POST
    path: "/contracts/{contract_id}/award"
    description: "Create + compute the contract's salvage award (requires PERFORMANCE_COMPLETE; all lots VALUE_VERIFIED)"
    roles: [ContractsOfficer]
    code: 201
    input: []
    output: SalvageAward
    side_effects: ["status=COMPUTED", "computed_amount_cents via salvage_award_final", "SCOPIC payable re-netted on open-verified events"]
  - method: GET
    path: "/awards"
    description: "List awards (filterable by contract_id, status)"
    roles: [SalvageMaster, ContractsOfficer, MarineSurveyor, EnvironmentalOfficer, OperationsDirector, Arbitrator, InsurerSurveyor]
    code: 200
    input: ["contract_id?", "status?", "limit?", "offset?"]
    output: "SalvageAward[]"
    side_effects: []
  - method: GET
    path: "/awards/{award_id}"
    description: "Get one award"
    roles: [SalvageMaster, ContractsOfficer, MarineSurveyor, EnvironmentalOfficer, OperationsDirector, Arbitrator, InsurerSurveyor]
    code: 200
    input: []
    output: SalvageAward
    side_effects: []
  - method: POST
    path: "/awards/{award_id}/agree"
    description: "Parties agree an amount without arbitration"
    roles: [ContractsOfficer]
    code: 200
    input: [agreed_amount_cents]
    output: SalvageAward
    side_effects: ["status -> AGREED"]
  - method: POST
    path: "/awards/{award_id}/submit-arbitration"
    description: "Refer the award to arbitration (requires all lots in terminal custody)"
    roles: [ContractsOfficer]
    code: 200
    input: []
    output: SalvageAward
    side_effects: ["status -> IN_ARBITRATION"]
  - method: POST
    path: "/awards/{award_id}/decide"
    description: "Arbitrator publishes an award (also resolves appeals)"
    roles: [Arbitrator]
    code: 200
    input: [awarded_amount_cents]
    output: SalvageAward
    side_effects: ["status -> AWARDED", "awarded_amount_cents set"]
  - method: POST
    path: "/awards/{award_id}/appeal"
    description: "Appeal an arbitral award (AWARDED -> APPEALED cycle)"
    roles: [ContractsOfficer]
    code: 200
    input: [grounds]
    output: SalvageAward
    side_effects: ["status -> APPEALED", "appeal_count += 1"]
  - method: POST
    path: "/awards/{award_id}/mark-paid"
    description: "Record payment of the agreed/awarded amount (cascades: contract AWARD_FINAL, liens lift)"
    roles: [ContractsOfficer]
    code: 200
    input: []
    output: SalvageAward
    side_effects: ["status -> PAID", "paid_amount_cents set", "contract -> AWARD_FINAL", "liens on casualty's lots lift"]

  # --- Insurer documentation packs ---
  - method: POST
    path: "/doc-packs"
    description: "Open an insurer documentation pack for a contract (contract status in {ACTIVE, PERFORMANCE_COMPLETE, AWARD_FINAL} else ERR_CONTRACT_NOT_ACTIVE; one non-ACCEPTED pack per contract else ERR_DUPLICATE_OPEN_DOC_PACK)"
    roles: [SalvageMaster]
    code: 201
    input: [contract_id]
    output: DocPack
    side_effects: ["status=COMPILING"]
  - method: GET
    path: "/doc-packs"
    description: "List doc packs (filterable by contract_id, status)"
    roles: [SalvageMaster, ContractsOfficer, MarineSurveyor, EnvironmentalOfficer, OperationsDirector, Arbitrator, InsurerSurveyor]
    code: 200
    input: ["contract_id?", "status?", "limit?", "offset?"]
    output: "DocPack[]"
    side_effects: []
  - method: GET
    path: "/doc-packs/{pack_id}"
    description: "Get one doc pack (with completeness fields)"
    roles: [SalvageMaster, ContractsOfficer, MarineSurveyor, EnvironmentalOfficer, OperationsDirector, Arbitrator, InsurerSurveyor]
    code: 200
    input: []
    output: DocPack
    side_effects: []
  - method: POST
    path: "/doc-packs/{id}/entries"
    description: "Append a documentation entry (type-checked reference into the same casualty)"
    roles: [SalvageMaster]
    code: 201
    input: [entry_type, ref_id, entry_date, summary]
    output: DocEntry
    side_effects: ["pack completeness recomputed"]
  - method: GET
    path: "/doc-packs/{id}/entries"
    description: "List entries of a doc pack"
    roles: [SalvageMaster, ContractsOfficer, MarineSurveyor, EnvironmentalOfficer, OperationsDirector, Arbitrator, InsurerSurveyor]
    code: 200
    input: ["limit?", "offset?"]
    output: "DocEntry[]"
    side_effects: []
  - method: POST
    path: "/doc-packs/{pack_id}/submit"
    description: "Submit the pack to the insurer (requires completeness_pct == 100)"
    roles: [SalvageMaster]
    code: 200
    input: []
    output: DocPack
    side_effects: ["status -> SUBMITTED"]
  - method: POST
    path: "/doc-packs/{pack_id}/review"
    description: "Insurer surveyor reviews: ACCEPT -> ACCEPTED (terminal); DEFICIENT -> back to COMPILING"
    roles: [InsurerSurveyor]
    code: 200
    input: [outcome, "notes?"]
    output: DocPack
    side_effects: ["status -> ACCEPTED or COMPILING", "review_notes set"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum, non-positive amount/quantity, bad datetime range, or violated conditional-field rule (fixed_price_cents iff FIXED_PRICE; pollution_event_id iff POLLUTION_RESPONSE)" }
  - { id: ERR_MISSING_OR_INVALID_CONTEXT_HEADER, http: 400, condition: "X-User-ID / X-User-Role missing, or role not a declared role name" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Declared role not in the endpoint's roles list" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced id does not exist (left-to-right path validation)" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Segregation of duties: same X-User-ID authored and now approves/verifies the record" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Requested action is not a valid transition from the resource's current state" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Resource is in a terminal state; no further transitions" }
  - { id: ERR_ENV_HOLD_ACTIVE, http: 422, condition: "Casualty env_posture == ENV_HOLD blocks phase activation/resume" }
  - { id: ERR_ENV_CLEARANCE_REQUIRED, http: 422, condition: "Latest APPROVED assessment is TIER_3 but no GRANTED ENV_AGENCY permit exists at contract activation" }
  - { id: ERR_WEATHER_LIMIT_EXCEEDED, http: 422, condition: "forecast_hs_meters > min(max_hs_meters of attached charter assets) — inclusive boundary: equality passes" }
  - { id: ERR_WEATHER_WINDOW_INFEASIBLE, http: 422, condition: "Window EXPIRED, or now < window_start + 6h, or now + planned_duration_hours > window_end - 6h" }
  - { id: ERR_PERMIT_MISSING, http: 422, condition: "No permit of a required agency_type exists in GRANTED status for the casualty at phase activation" }
  - { id: ERR_PERMIT_NOT_VALID, http: 422, condition: "Required permit exists but valid_from > now or valid_to < now + planned_duration_hours (or it was swept to EXPIRED)" }
  - { id: ERR_CHARTER_OVERLAP, http: 409, condition: "Half-open window [window_start, window_end) collides with another active charter (BOOKED/ON_HIRE/STANDBY_*) on the same asset; touching endpoints allowed" }
  - { id: ERR_CHARTER_WINDOW_NOT_OPEN, http: 422, condition: "on-hire before window_start or at/after window_end" }
  - { id: ERR_STORAGE_CAPACITY_EXCEEDED, http: 409, condition: "Site allocated_tonnes + lot quantity_tonnes > capacity_tonnes — aggregate overlap allowed up to capacity; exact equality passes" }
  - { id: ERR_ASSESSMENT_NOT_APPROVED, http: 422, condition: "No APPROVED assessment exists for the casualty (plan approve / contract sign)" }
  - { id: ERR_PLAN_NOT_APPROVED, http: 422, condition: "contract.plan_id is not an APPROVED plan at sign" }
  - { id: ERR_CONTRACT_NOT_ACTIVE, http: 422, condition: "Casualty's contract not in the required operable state (SIGNED/ACTIVE/PERFORMANCE_COMPLETE per endpoint)" }
  - { id: ERR_PROPERTIES_NOT_VERIFIED, http: 422, condition: "Award compute blocked: a RecoveredProperty lot of the casualty is not yet VALUE_VERIFIED" }
  - { id: ERR_PROPERTIES_NOT_DISPOSED, http: 422, condition: "Arbitration blocked: a lot of the casualty is not in terminal custody {REDELIVERED, SOLD, DISPOSED}" }
  - { id: ERR_LIEN_ACTIVE, http: 422, condition: "REDELIVER/SELL blocked while custody is LIENED or lien preconditions unmet" }
  - { id: ERR_ASSET_CLASS_NOT_REQUIRED, http: 422, condition: "Charter asset's class not in the active contract plan's required_equipment_classes" }
  - { id: ERR_DUPLICATE_ACTIVE_CONTRACT, http: 409, condition: "Casualty already has a contract not in {SETTLED, TERMINATED}" }
  - { id: ERR_DUPLICATE_OPEN_DOC_PACK, http: 409, condition: "Contract already has a DocPack not in {ACCEPTED}" }
  - { id: ERR_AWARD_ALREADY_EXISTS, http: 409, condition: "Contract already has its 1:1 SalvageAward" }
  - { id: ERR_QUANTITY_EXCEEDS_REMAINING, http: 422, condition: "dispose tonnes > in_custody_tonnes" }
  - { id: ERR_POLLUTION_TIER_NOT_RAISED, http: 422, condition: "escalate new_tier must be strictly higher than current tier" }
  - { id: ERR_DOC_ENTRY_INVALID, http: 422, condition: "Entry ref_id missing, wrong entity type for entry_type, wrong casualty, or referenced record not in the qualifying state" }
  - { id: ERR_DOC_INCOMPLETE, http: 422, condition: "Doc pack submit with completeness_pct < 100 (exact 100 passes)" }
  - { id: ERR_TERMINATION_NOT_ALLOWED, http: 422, condition: "reason=MUTUAL from ACTIVE, or terminate attempted from PERFORMANCE_COMPLETE/AWARD_FINAL" }
  - { id: ERR_NO_CURE_REQUIRES_NCNP, http: 422, condition: "reason=NO_CURE on a FIXED_PRICE contract" }
  - { id: ERR_CASUALTY_NOT_CLOSABLE, http: 422, condition: "Close blocked: unsettled/unterminated contracts or open pollution events" }
  - { id: ERR_DOCS_NOT_ACCEPTED, http: 422, condition: "Settle blocked: a DocPack of the contract is not ACCEPTED" }
  - { id: ERR_SECURITY_INSUFFICIENT, http: 422, condition: "Activation blocked: no deposit with held_cents >= security_required_cents (exact equality passes)" }
  - { id: ERR_SECURITY_DISBURSE_EXCEEDS_HELD, http: 422, condition: "disburse amount_cents > held_cents" }
  - { id: ERR_SECURITY_DISBURSE_NOT_ALLOWED, http: 422, condition: "RELEASE requires contract SETTLED/TERMINATED; APPLY_TO_AWARD requires award PAID; also settle precondition on open deposits" }
  - { id: ERR_STALE_CONTRACT_VERSION, http: 412, condition: "OCC: expected_contract_version != contract.version on counter" }
  - { id: ERR_STALE_CASUALTY_VERSION, http: 412, condition: "OCC: expected_casualty_version != casualty.version on assessment create" }

# =============================================================================
# 1.7 RBAC Matrix (all identities opaque operator ids; SoD compares X-User-ID)
# =============================================================================
roles:
  - name: SalvageMaster
    description: "On-scene salvage commander: reports casualties, drafts plans, runs mobilization/charters/weather/phases, logs property, compiles insurer documentation"
    identity: opaque
    exclusive_operations:
      - "POST /casualties"
      - "POST /plans, /plans/{id}/submit"
      - "POST /charters, /charters/{id}/on-hire, /charters/{id}/off-hire"
      - "POST /weather-windows"
      - "POST /phases, /phases/{id}/activate, /phases/{id}/hold-weather, /phases/{id}/resume, /phases/{id}/complete"
      - "POST /properties, /properties/{id}/secure-ashore, /properties/{id}/dispose"
      - "POST /doc-packs, /doc-packs/{id}/entries, /doc-packs/{id}/submit"
    shared_operations: ["all GET endpoints", "POST /_clock/set_current_utc"]
  - name: ContractsOfficer
    description: "Commercial/contracts desk: negotiation, signature, security funds, liens, awards, settlement"
    identity: opaque
    exclusive_operations:
      - "POST /contracts and all /contracts/{id}/* actions including /contracts/{id}/award"
      - "POST /securities, /securities/{id}/disburse"
      - "POST /properties/{id}/lien"
      - "POST /awards/{id}/agree, /submit-arbitration, /appeal, /mark-paid"
    shared_operations: ["all GET endpoints", "POST /_clock/set_current_utc"]
  - name: MarineSurveyor
    description: "Independent surveyor: incident assessments and property value surveys"
    identity: opaque
    exclusive_operations:
      - "POST /assessments"
      - "POST /properties/{id}/survey"
    shared_operations: ["all GET endpoints", "POST /_clock/set_current_utc"]
  - name: EnvironmentalOfficer
    description: "Environmental liaison: agency permits and pollution response lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST /permits and /permits/{id}/grant, /suspend, /reinstate, /revoke"
      - "POST /pollution-events and /pollution-events/{id}/escalate, /contain, /verify-clean"
    shared_operations: ["all GET endpoints", "POST /_clock/set_current_utc"]
  - name: OperationsDirector
    description: "Contractor operations director: approves assessments/plans (SoD vs author), owns asset/site registry, closes casualties"
    identity: opaque
    exclusive_operations:
      - "POST /assessments/{id}/approve, /assessments/{id}/reject"
      - "POST /plans/{id}/approve, /plans/{id}/reject"
      - "POST /equipment-assets, /storage-sites"
      - "POST /properties/{id}/verify-value"
      - "POST /casualties/{id}/close"
    shared_operations: ["all GET endpoints", "POST /_clock/set_current_utc"]
  - name: Arbitrator
    description: "Salvage arbitrator (e.g., LOF appeal arbitrator): publishes and re-decides awards"
    identity: opaque
    exclusive_operations:
      - "POST /awards/{id}/decide"
    shared_operations: ["all GET endpoints", "POST /_clock/set_current_utc"]
  - name: InsurerSurveyor
    description: "Hull & P&I insurer's surveyor: reviews documentation packs"
    identity: opaque
    exclusive_operations:
      - "POST /doc-packs/{id}/review"
    shared_operations: ["all GET endpoints", "POST /_clock/set_current_utc"]
