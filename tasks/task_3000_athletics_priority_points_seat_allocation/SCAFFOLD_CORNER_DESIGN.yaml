      - name: seat_pick_with_a_stale_seat_version_returns_412_then_succeeds_on_a_re_read
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[seat-pick-stale-seat]
          - validations[priority 8]
          - entities.Seat.fields.max_concurrent_holds
        distinguishing_aspect: |
          The OCC parent here is the Seat, not the picking donor, so two DIFFERENT
          donors contend over one version counter — the classic lost-update shape.
          max_concurrent_holds is set to 2 so the retry genuinely succeeds rather
          than being refused by priority 17 or 18, which means a 412 cannot be
          explained away as "the seat was taken": the identical body succeeds the
          moment the version is refreshed. Note that §1.2 declares only
          AVAILABLE -> HELD for a pick, so the second hold is a self-loop on HELD
          with no inventory side effect of its own; the §1.3 inventory identity
          seats_available + seats_committed_count + decommissioned_seat_count ==
          seat_row_count forces seats_available 0 and seats_committed_count 1
          rather than a double decrement.
