      - name: applying_a_sync_batch_is_all_or_nothing_and_processes_operations_in_array_order
        claim_type: bulk_action
        grounds:
          - endpoints[POST /enrollment-sync-batches]
          - endpoints[POST /enrollment-sync-batches/{id}/transitions]
          - state_machines.EnrollmentSyncBatch.batch_state
          - validations[36]
          - errors[ERR_SYNC_EPOCH_OUT_OF_ORDER]
        distinguishing_aspect: "Three distinct bulk semantics in one chain: VALIDATE tallies without mutating anything, an APPLY containing one bad operation forks to FAILED and leaves ZERO enrollment rows behind (all-or-nothing, not partial success), and a clean APPLY executes strictly in array order so the ADD that overflows the cap lands on the waitlist and the later DROP promotes it in the same request. The epoch guard then refuses an out-of-order batch."
        test_recipe:
          setup:
            - "Term 2026FA is REGISTRATION_OPEN with a PROVISIONED shell SA of base_seat_cap 2 and a still-REQUESTED shell SB, plus four students."
          setup_api_calls:
            - call: "POST /academic-terms"
              payload: { term_code: "2026FA", term_start_at: "2026-08-24T00:00:00Z", term_end_at: "2026-12-11T00:00:00Z" }
              as: Registrar
              captures: { term_id: $.data.id }
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "REGISTRATION_OPEN" }
              as: Registrar
              captures: { epoch_0: $.data.sis_sync_epoch }
            - call: "POST /people"
              payload: { sis_person_id: "F-6140", full_name: "Jean Bartik", primary_affiliation: "FACULTY" }
              as: Registrar
              captures: { prof_id: $.data.id }
            - call: "POST /course-shells"
              payload: { term_id: "${term_id}", owner_person_id: "${prof_id}", sis_section_code: "EC101-01", shell_type: "OFFICIAL", base_seat_cap: 2 }
              as: LmsAdmin
              captures: { sa: $.data.id }
            - call: "POST /course-shells/${sa}/provisioning-decisions"
              payload: { decision: "APPROVE" }
              as: LmsAdmin
            - call: "POST /course-shells"
              payload: { term_id: "${term_id}", owner_person_id: "${prof_id}", sis_section_code: "EC101-02", shell_type: "OFFICIAL", base_seat_cap: 5 }
              as: LmsAdmin
              captures: { sb: $.data.id, sb_state: $.data.provisioning_state }
            - call: "POST /people"
              payload: { sis_person_id: "S-6141", full_name: "Learner A", primary_affiliation: "STUDENT" }
              as: Registrar
              captures: { pa: $.data.id }
            - call: "POST /people"
              payload: { sis_person_id: "S-6142", full_name: "Learner B", primary_affiliation: "STUDENT" }
              as: Registrar
              captures: { pb: $.data.id }
            - call: "POST /people"
              payload: { sis_person_id: "S-6143", full_name: "Learner C", primary_affiliation: "STUDENT" }
              as: Registrar
              captures: { pc: $.data.id }
            - call: "POST /people"
              payload: { sis_person_id: "S-6144", full_name: "Learner D", primary_affiliation: "STUDENT" }
              as: Registrar
              captures: { pd: $.data.id }
          trigger:
            - call: "POST /enrollment-sync-batches"
              payload:
                term_id: "${term_id}"
                operations:
                  - { op: "ADD", shell_id: "${sa}", person_id: "${pa}", role: "STUDENT" }
                  - { op: "ADD", shell_id: "${sb}", person_id: "${pb}", role: "STUDENT" }
              as: Registrar
              captures: { b1: $.data.id, b1_state: $.data.batch_state, b1_seq: $.data.batch_seq }
            - call: "POST /enrollment-sync-batches/${b1}/transitions"
              payload: { action: "VALIDATE" }
              as: Registrar
              captures: { b1_validated: $.data.validated_operation_count, b1_rejected: $.data.rejected_operation_count, b1_state2: $.data.batch_state }
            - call: "GET /enrollments"
              payload: { shell_id: "${sa}" }
              as: Registrar
              captures: { sa_rows_after_validate: $.data }
            - call: "POST /enrollment-sync-batches/${b1}/transitions"
              payload: { action: "APPLY" }
              as: Registrar
              captures: { b1_state3: $.data.batch_state, b1_fail: $.data.failure_reason, b1_adds: $.data.applied_add_count }
            - call: "GET /academic-terms/${term_id}"
              payload: {}
              as: Registrar
              captures: { epoch_after_fail: $.data.sis_sync_epoch, headcount_after_fail: $.data.total_active_enrollments }
            - call: "POST /enrollment-sync-batches"
              payload:
                term_id: "${term_id}"
                operations:
                  - { op: "ADD", shell_id: "${sa}", person_id: "${pa}", role: "STUDENT" }
                  - { op: "ADD", shell_id: "${sa}", person_id: "${pb}", role: "STUDENT" }
                  - { op: "ADD", shell_id: "${sa}", person_id: "${pc}", role: "STUDENT" }
                  - { op: "DROP", shell_id: "${sa}", person_id: "${pa}", role: "STUDENT" }
              as: Registrar
              captures: { b2: $.data.id, b2_seq: $.data.batch_seq }
            - call: "POST /enrollment-sync-batches/${b2}/transitions"
              payload: { action: "VALIDATE" }
              as: Registrar
              captures: { b2_validated: $.data.validated_operation_count, b2_rejected: $.data.rejected_operation_count }
            - call: "POST /enrollment-sync-batches/${b2}/transitions"
              payload: { action: "APPLY" }
              as: Registrar
              captures: { b2_state: $.data.batch_state, b2_adds: $.data.applied_add_count, b2_drops: $.data.applied_drop_count, b2_promos: $.data.promoted_from_waitlist_count }
            - call: "GET /course-shells/${sa}"
              payload: {}
              as: LmsAdmin
              captures: { sa_active: $.data.active_enrollment_count, sa_waitlisted: $.data.waitlisted_enrollment_count }
            - call: "GET /academic-terms/${term_id}"
              payload: {}
              as: Registrar
              captures: { epoch_after_apply: $.data.sis_sync_epoch, headcount_after_apply: $.data.total_active_enrollments }
            - call: "POST /enrollment-sync-batches"
              payload:
                term_id: "${term_id}"
                batch_seq: 5
                operations:
                  - { op: "ADD", shell_id: "${sa}", person_id: "${pd}", role: "STUDENT" }
              as: Registrar
              captures: { b3: $.data.id, b3_seq: $.data.batch_seq }
            - call: "POST /enrollment-sync-batches/${b3}/transitions"
              payload: { action: "VALIDATE" }
              as: Registrar
              captures: { b3_validated: $.data.validated_operation_count }
            - call: "POST /enrollment-sync-batches/${b3}/transitions"
              payload: { action: "APPLY" }
              as: Registrar
              captures: { err_epoch: $.data.error_id }
          assert:
            - "${epoch_0} == 0 and ${b1_state} == DRAFT with ${b1_seq} == 1 — batch_seq defaults to sis_sync_epoch + 1"
            - "${b1_validated} == 1 and ${b1_rejected} == 1 with ${b1_state2} == VALIDATED — the second operation targets ${sb}, which is still ${sb_state} (REQUESTED), so it fails validation"
            - "${sa_rows_after_validate} is an empty array — VALIDATE tallies only and never creates an Enrollment"
            - "${b1_state3} == FAILED at HTTP 200 (a fork, not an error envelope) with a non-null ${b1_fail} and ${b1_adds} == 0"
            - "${epoch_after_fail} == 0 and ${headcount_after_fail} == 0 — a failed batch is all-or-nothing and does not consume the epoch"
            - "${b2_seq} == 1 (the epoch never moved) and ${b2_validated} == 4 with ${b2_rejected} == 0"
            - "${b2_state} == APPLIED with ${b2_adds} == 3, ${b2_drops} == 1 and ${b2_promos} == 1 — the third ADD exceeded the cap of 2 and was WAITLISTED, then the DROP of Learner A freed a seat and promoted it inside the same request"
            - "${sa_active} == 2 and ${sa_waitlisted} == 0 — the promotion emptied the queue"
            - "${epoch_after_apply} == 1 and ${headcount_after_apply} == 2"
            - "${b3_seq} == 5 and ${b3_validated} == 1, but ${err_epoch} == ERR_SYNC_EPOCH_OUT_OF_ORDER at HTTP 409 — the guard is batch_seq == sis_sync_epoch + 1 == 2, and a well-formed batch is still refused"
            - "GET /academic-terms/${term_id} still reports sis_sync_epoch 1 after the refusal"

      - name: a_tool_placement_links_two_entities_and_both_sides_must_resolve_first
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /tool-placements]
          - endpoints[GET /tool-placements]
          - entities.ToolPlacement
          - errors[ERR_TOOL_NOT_FOUND]
          - errors[ERR_SHELL_NOT_FOUND]
        distinguishing_aspect: "ToolPlacement is the only many-to-many junction, and its two foreign keys must each be resolved before the row is written: a bad tool_id with a good shell_id gives ERR_TOOL_NOT_FOUND and the mirror case gives ERR_SHELL_NOT_FOUND. After the link exists it must be reachable from BOTH filter directions, and the junction row must start with pinned_tool_version null because pinning happens at ACTIVATE, not at link time."
        test_recipe:
          setup:
            - "Term 2026FA REGISTRATION_OPEN, one PROVISIONED OFFICIAL shell, one registered tool."
          setup_api_calls:
            - call: "POST /academic-terms"
              payload: { term_code: "2026FA", term_start_at: "2026-08-24T00:00:00Z", term_end_at: "2026-12-11T00:00:00Z" }
              as: Registrar
              captures: { term_id: $.data.id }
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "REGISTRATION_OPEN" }
              as: Registrar
            - call: "POST /people"
              payload: { sis_person_id: "F-6150", full_name: "Karen Uhlenbeck", primary_affiliation: "FACULTY" }
              as: Registrar
              captures: { prof_id: $.data.id }
            - call: "POST /course-shells"
              payload: { term_id: "${term_id}", owner_person_id: "${prof_id}", sis_section_code: "ST220-01", shell_type: "OFFICIAL", base_seat_cap: 30 }
              as: LmsAdmin
              captures: { shell_id: $.data.id }
            - call: "POST /course-shells/${shell_id}/provisioning-decisions"
              payload: { decision: "APPROVE" }
              as: LmsAdmin
            - call: "POST /tool-integrations"
              payload: { vendor_name: "Epsilon", tool_name: "PeerReview", tool_version: "0.9.0", data_sharing_scope: "ROSTER_ONLY" }
              as: LmsAdmin
              captures: { tool_id: $.data.id }
          trigger:
            - call: "POST /tool-placements"
              payload: { tool_id: "00000000-0000-4000-8000-000000000911", shell_id: "${shell_id}" }
              as: LmsAdmin
              captures: { err_tool: $.data.error_id }
            - call: "POST /tool-placements"
              payload: { tool_id: "${tool_id}", shell_id: "00000000-0000-4000-8000-000000000912" }
              as: LmsAdmin
              captures: { err_shell: $.data.error_id }
            - call: "POST /tool-placements"
              payload: { tool_id: "${tool_id}", shell_id: "${shell_id}" }
              as: LmsAdmin
              captures: { plc_id: $.data.id, plc_state: $.data.placement_state, pinned: $.data.pinned_tool_version }
            - call: "GET /tool-placements"
              payload: { tool_id: "${tool_id}" }
              as: LmsAdmin
              captures: { by_tool_first: "$.data[0].id" }
            - call: "GET /tool-placements"
              payload: { shell_id: "${shell_id}" }
              as: LmsAdmin
              captures: { by_shell_first: "$.data[0].id" }
            - call: "GET /tool-placements/${plc_id}"
              payload: {}
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { read_tool: $.data.tool_id, read_shell: $.data.shell_id }
            - call: "GET /tool-integrations/${tool_id}"
              payload: {}
              as: LmsAdmin
              captures: { active_placements: $.data.active_placement_count }
          assert:
            - "${err_tool} == ERR_TOOL_NOT_FOUND at HTTP 404 — the unresolvable left side is reported even though the shell exists"
            - "${err_shell} == ERR_SHELL_NOT_FOUND at HTTP 404 — the mirror case reports the right side"
            - "${plc_id} is created at HTTP 201 with ${plc_state} == REQUESTED and ${pinned} == null"
            - "${by_tool_first} == ${plc_id} and ${by_shell_first} == ${plc_id}, each list reporting total_count 1 — the junction is reachable from both directions"
            - "${read_tool} == ${tool_id} and ${read_shell} == ${shell_id}"
            - "${active_placements} == 0 — active_placement_count counts ACTIVE placements only, so a REQUESTED link does not inflate it"

      - name: the_owner_chargeback_read_reflects_every_storage_write_to_their_sandbox_shells
        claim_type: computed_read
        grounds:
          - endpoints[GET /people/{id}]
          - calculations.sandbox_storage_chargeback
          - entities.Person.sandbox_storage_charge_usd
        distinguishing_aspect: "GET /people/{id} is a pure read whose sandbox_storage_charge_usd must equal the chargeback formula recomputed after EVERY content write — create, update and delete — and across two shell types with different multipliers. An implementation that only recomputes on create leaves the figure at 2.25 after the PATCH drops the shell back under the free tier."
        test_recipe:
          setup:
            - "Term 2026FA and one FACULTY owner holding one SANDBOX shell and one DEV shell (both still REQUESTED, which the billable set includes)."
          setup_api_calls:
            - call: "POST /academic-terms"
              payload: { term_code: "2026FA", term_start_at: "2026-08-24T00:00:00Z", term_end_at: "2026-12-11T00:00:00Z" }
              as: Registrar
              captures: { term_id: $.data.id }
            - call: "POST /people"
              payload: { sis_person_id: "F-6160", full_name: "Adele Goldberg", primary_affiliation: "FACULTY" }
              as: Registrar
              captures: { prof_id: $.data.id, charge_0: $.data.sandbox_storage_charge_usd }
            - call: "POST /course-shells"
              payload: { term_id: "${term_id}", owner_person_id: "${prof_id}", sis_section_code: "SBX-R1", shell_type: "SANDBOX", base_seat_cap: 1 }
              as: LmsAdmin
              captures: { sbx: $.data.id }
            - call: "POST /course-shells"
              payload: { term_id: "${term_id}", owner_person_id: "${prof_id}", sis_section_code: "DEV-R2", shell_type: "DEV", base_seat_cap: 1 }
              as: LmsAdmin
              captures: { dev: $.data.id }
          trigger:
            - call: "POST /content-items"
              payload: { shell_id: "${sbx}", item_type: "PAGE", title: "big media page", storage_mb: 250.00 }
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { item_a: $.data.id }
            - call: "GET /people/${prof_id}"
              payload: {}
              as: LmsAdmin
              captures: { charge_1: $.data.sandbox_storage_charge_usd }
            - call: "PATCH /content-items/${item_a}"
              payload: { storage_mb: 100.00 }
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { item_a_storage: $.data.storage_mb }
            - call: "GET /people/${prof_id}"
              payload: {}
              as: LmsAdmin
              captures: { charge_2: $.data.sandbox_storage_charge_usd }
            - call: "POST /content-items"
              payload: { shell_id: "${sbx}", item_type: "FILE", title: "lecture capture bundle", storage_mb: 400.00 }
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { item_b: $.data.id }
            - call: "GET /people/${prof_id}"
              payload: {}
              as: LmsAdmin
              captures: { charge_3: $.data.sandbox_storage_charge_usd }
            - call: "POST /content-items"
              payload: { shell_id: "${dev}", item_type: "FILE", title: "dev fixtures", storage_mb: 300.00 }
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { item_c: $.data.id }
            - call: "GET /people/${prof_id}"
              payload: {}
              as: LmsAdmin
              captures: { charge_4: $.data.sandbox_storage_charge_usd }
            - call: "DELETE /content-items/${item_b}"
              payload: {}
              as: Instructor
              as_user_id: "${prof_id}"
            - call: "GET /people/${prof_id}"
              payload: {}
              as: LmsAdmin
              captures: { charge_5: $.data.sandbox_storage_charge_usd }
            - call: "GET /course-shells/${sbx}"
              payload: {}
              as: LmsAdmin
              captures: { sbx_storage: $.data.storage_mb }
          assert:
            - "${charge_0} == 0.00 at registration"
            - "${charge_1} == 2.25  # sandbox 250.00 - 100.00 free = 150.00 billable * 0.0150 * 1.00"
            - "${item_a_storage} == 100.00 and ${charge_2} == 0.00 — the PATCH pulled the shell to exactly the free tier, so max(0.00, 0.00) applies and the read must fall back to zero"
            - "${charge_3} == 6.00  # sandbox now 500.00 -> 400.00 billable * 0.0150 * 1.00"
            - "${charge_4} == 7.50  # sandbox 6.00 + dev (300.00 - 100.00) * 0.0150 * 0.50 = 6.00 + 1.50"
            - "${charge_5} == 1.50 and ${sbx_storage} == 100.00 — the DELETE re-derived both the shell and the owner's charge"

      - name: purging_an_archived_shell_is_permitted_only_when_the_terms_retention_class_allows_it
        claim_type: conditional_action
        grounds:
          - endpoints[POST /course-shells/{id}/lifecycle-transitions]
          - state_machines.CourseShell.provisioning_state.ARCHIVED_to_PURGED
          - validations[27]
          - validations[28]
          - errors[ERR_RETENTION_HOLD_ACTIVE]
        distinguishing_aspect: "The same endpoint, the same target_state, the same clock and two ARCHIVED shells whose only difference is their term's retention_class: STANDARD purges, LEGAL_HOLD is refused with ERR_RETENTION_HOLD_ACTIVE at 403. Because a LEGAL_HOLD term has retention_purge_at null, an implementation that orders the horizon check first leaks ERR_PURGE_NOT_DUE (409) instead."
        test_recipe:
          setup:
            - "Two terms with identical calendars (term_end_at 2026-12-11T00:00:00Z, access_grace_days 0) differing only in retention_class: 2026FA is STANDARD, 2026FB is LEGAL_HOLD."
            - "Each term carries one OFFICIAL shell created after REGISTRATION_OPEN; walking each term to CLOSED cascades its shell to CONCLUDED, after which the Registrar archives it."
          setup_api_calls:
            - call: "POST /academic-terms"
              payload: { term_code: "2026FA", term_start_at: "2026-08-24T00:00:00Z", term_end_at: "2026-12-11T00:00:00Z", access_grace_days: 0, retention_class: "STANDARD" }
              as: Registrar
              captures: { t_std: $.data.id, purge_at_std: $.data.retention_purge_at }
            - call: "POST /academic-terms"
              payload: { term_code: "2026FB", term_start_at: "2026-08-24T00:00:00Z", term_end_at: "2026-12-11T00:00:00Z", access_grace_days: 0, retention_class: "LEGAL_HOLD" }
              as: Registrar
              captures: { t_hold: $.data.id, purge_at_hold: $.data.retention_purge_at }
            - call: "POST /people"
              payload: { sis_person_id: "F-6170", full_name: "Evelyn Boyd Granville", primary_affiliation: "FACULTY" }
              as: Registrar
              captures: { prof_id: $.data.id }
            - call: "POST /academic-terms/${t_std}/lifecycle-transitions"
