            - { call: "GET /irops/reaccommodation-cases/${c1}/options", as: ReaccommodationAgent, captures: { o1: "$.data[0].id" } }
            - { call: "POST /irops/reaccommodation-cases/${c1}/commit", payload: { option_id: "${o1}", expected_case_version: "${c1v}" }, as: ReaccommodationAgent }
            - { call: "GET /irops/reaccommodation-cases?booking_id=${b2}", as: ReaccommodationAgent, captures: { c2: "$.data[0].id" } }
          trigger:
            - { call: "POST /irops/reaccommodation-cases/${c2}/generate-options", payload: { include_interline: true }, as: ReaccommodationAgent, captures: { err: "$.data.error_id" } }
          assert:
            - "first interline commit consumed the full quota (interline_seats_committed == 2 == seats_quota_per_flight; inclusive boundary allowed it)"
            - "second generate-options -> 422 ERR_NO_REACCOM_OPTIONS (partner excluded by quota; no own flights); case2 stays QUEUED"

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_consistency_after_commit
        claim_type: immediate
        grounds: [complexity_profile.consistency_model, "endpoints.POST /irops/reaccommodation-cases/{id}/commit"]
        distinguishing_aspect: "Immediate consistency: the commit response itself shows COMMITTED, and a same-instant GET of the booking shows REBOOKED with replacement segments carrying reaccommodation_case_id — no read lag."
        test_recipe:
          setup: ["event RECOVERY; booking disrupted; case OFFERED onto recovery flight R"]
          setup_api_calls:
            - { call: "POST /irops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T06:00:00Z" }, as: OpsAdmin }
            - { call: "POST /irops/passengers", payload: { full_name: "Con C", contact_email: "con@x.com" }, as: ReaccommodationAgent, captures: { pax: "$.data.id" } }
            - { call: "POST /irops/flights", payload: { flight_number: "OC89", origin: "HUB", destination: "DST", sched_dep_utc: "2026-08-10T09:00:00Z", sched_arr_utc: "2026-08-10T10:00:00Z", distance_km: 900, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 100 }] }, as: OpsController, captures: { f: "$.data.id", fv: "$.data.version" } }
            - { call: "POST /irops/flights", payload: { flight_number: "OC90", origin: "HUB", destination: "DST", sched_dep_utc: "2026-08-10T14:00:00Z", sched_arr_utc: "2026-08-10T15:00:00Z", distance_km: 900, operating_carrier: "OC", cabins: [{ cabin: "ECONOMY", capacity: 100 }] }, as: OpsController, captures: { r: "$.data.id" } }
            - { call: "POST /irops/disruption-events", payload: { event_code: "MECH-C24", hub: "HUB", classification: "MECHANICAL", cost_cap_cents: 1000000 }, as: DutyManager, captures: { ev: "$.data.id" } }
            - { call: "POST /irops/disruption-events/${ev}/assess", payload: {}, as: DutyManager }
            - { call: "POST /irops/bookings", payload: { passenger_id: "${pax}", fare_cents: 12000, cabin: "ECONOMY", party_size: 1, segments: [{ flight_id: "${f}", seq_no: 1 }] }, as: ReaccommodationAgent, captures: { bk: "$.data.id" } }
            - { call: "POST /irops/flights/${f}/cancel", payload: { disruption_event_id: "${ev}", expected_flight_version: "${fv}" }, as: OpsController }
            - { call: "GET /irops/reaccommodation-cases?booking_id=${bk}", as: ReaccommodationAgent, captures: { cs: "$.data[0].id" } }
            - { call: "POST /irops/reaccommodation-cases/${cs}/generate-options", payload: { include_interline: false }, as: ReaccommodationAgent, captures: { csv: "$.data.version" } }
            - { call: "GET /irops/reaccommodation-cases/${cs}/options", as: ReaccommodationAgent, captures: { opt: "$.data[0].id" } }
          trigger:
            - { call: "POST /irops/reaccommodation-cases/${cs}/commit", payload: { option_id: "${opt}", expected_case_version: "${csv}" }, as: ReaccommodationAgent, captures: { st: "$.data.case_status", cv: "$.data.version" } }
            - { call: "GET /irops/bookings/${bk}", as: ReaccommodationAgent }
            - { call: "GET /irops/booking-segments?reaccommodation_case_id=${cs}", as: ReaccommodationAgent }
            - { call: "GET /irops/flights/${r}/cabin-inventories", as: OpsController }
          assert:
            - "commit response: case_status == COMMITTED and version == csv + 1"
            - "Booking.${bk}.booking_status == REBOOKED in the immediately following read"
            - "one replacement segment exists with reaccommodation_case_id == ${cs} and flight_id == ${r}, segment_status == CONFIRMED"
            - "recovery flight seats_sold == 1; cancelled flight seats_sold == 0 (seat moved, released on the cancelled original)"

