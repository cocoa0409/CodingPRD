            - "${a_pdb} == 1375 (55 * 10000 / 400) and ${a_udb} == -1650 (1375 * 12000 / 10000, sign inverted)"
            - "${a_base} == 1000 (DEFAULT_BASELINE_UNITS, no CLOSED review) and ${a_units} == 835 (1000 * 8350 / 10000)"
            - "${a_pfc} == 2198 — computed from the proposed 455, never from the capped 448"
            - "${a_cap} == 448 == min(1650, 448) and ${a_eff} == 461 (448 * 10300 / 10000 = 461.44) because 2198 > target 2000"
            - "${a_status} == SUBMITTED — 455 <= 461 and the 355-cent margin clears MARGIN_FLOOR_CENTS 300"
            - "${a_contrib} == -3575 (835 * 355 - 1000 * 300): an accepted price rise that loses contribution"
            - "${b_error} == ERR_MARKET_CAP_EXCEEDED with HTTP 422 — 2198 < target 3000 means relief_bps 0, so the effective cap stays 448 and 455 > 448"
            - "PriceChangeProposal.${prop_b_id}.status == DRAFT with revision_round == 0 and every projection field still null, because the projection write is a side effect of a successful transition"
            - "MenuItem.${mi_b_id}.current_price_cents == 400 — the failed submit changed nothing"
  - rule_id: non_linear_state_machine
    instances:
      - name: proposal_revision_cycle_terminates_at_two_rounds
        grounds:
          - state_machines.PriceChangeProposal
          - constants.MAX_REVISION_ROUNDS
          - entities.PriceChangeProposal.fields.revision_round
          - validations[priority 21]
          - validations[priority 39]
        distinguishing_aspect: |
          The same trigger (request-revision) is a CYCLE edge twice and a TERMINAL edge the third
          time: it returns the proposal to REVISION_REQUESTED while revision_round < 2 and, at
          revision_round == 2, drives it to the terminal REJECTED state with revision_round frozen
          at 2 instead of reopening the loop. The non-linearity here is a bounded self-loop on ONE
          status field; the other non_linear_state_machine instance's non-linearity is two
          independent status dimensions on one row advancing in either interleaving.
        test_recipe:
          setup:
            - "Ingredient CHEDDAR-BLOCK priced 22000000 per 2268 base units, PUBLISHED for MW from 2026-07-01T00:00:00Z."
            - "Recipe PLATE-GRILL ACTIVE with portion_cost_micros 970018 and MenuItem MI-GRILL-MW ACTIVE at 400 cents, plate_cost_cents 100, target_food_cost_bps 3000, last_price_change_at null."
            - "One DRAFT PriceChangeProposal at proposed_price_cents 420 with elasticity_bps 12000; 420 clears both submit gates (projected_food_cost_bps 2381 < 3000 so no relief, market cap 448 >= 420, margin 320 >= MARGIN_FLOOR_CENTS 300), so every submit in the cycle succeeds for the same reason."
            - "The developer acts as u-dev-1 and the director as u-dir-1 so segregation of duties never interferes."
          setup_api_calls:
            - call: "POST /culinary/ingredients"
              payload: { sku: "CHEDDAR-BLOCK", name: "Cheddar Block", base_uom: "GRAM", pack_base_units: 2268, trim_yield_bps: 10000, cook_shrink_bps: 0, allergen_mask: 1, kcal_per_base_unit_micros: 4000000, sodium_mcg_per_base_unit: 6200 }
