          assert:
            - "response status == 409"
            - "response.data.error_id == ERR_CASE_ALREADY_HAS_APPRAISAL"

      - name: touching_escrow_windows_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_ESCROW_WINDOW_OVERLAP]", "endpoints[POST /mi/loan-cases/{loanCaseId}/repair-escrows]"]
        distinguishing_aspect: "Closed-interval semantics: a second escrow [2026-06-30, 2026-09-30] touches the existing [2026-01-01, 2026-06-30] at the shared endpoint and is rejected 409 ERR_ESCROW_WINDOW_OVERLAP."
        test_recipe:
          setup: ["one case with an OPEN escrow [2026-01-01, 2026-06-30]"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /mi/lenders", payload: { legal_name: "Touch Co", institution_type: MORTGAGEE_SUPERVISED, home_state: "VA", qc_plan_on_file: true }, as: PlatformAdmin, captures: { len_id: $.data.id } }
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: ADVANCE_TO_FIELD_REVIEW }, as: FhaReviewer, as_user_id: rev-1, captures: { len_v2: $.data.version } }
            - { call: "POST /mi/lenders/${len_id}/financial-filings", payload: { fiscal_year_end: "2025-12-31", total_assets_cents: 50000000000, total_liabilities_cents: 49000000000, liquid_assets_cents: 5000000000, expected_lender_version: "${len_v2}" }, as: LenderOfficer, as_user_id: "${len_id}", captures: { fil_id: $.data.id } }
