            - "Deal.${deal_id}.closed_at_utc == 2026-08-01T00:00:00Z and Deal.${deal_id}.guarantee_start_utc == 2026-08-01T00:00:00Z"
            - "Deal.${deal_id}.guarantee_end_utc == 2026-10-30T00:00:00Z and Deal.${deal_id}.replacement_deadline_utc == 2026-11-13T00:00:00Z"
            - "EscrowAccount.${escrow_id}.disbursed_to_broker_cents == 50000, disbursed_to_seller_cents == 70000, holdback_balance_cents == 51000 and undisbursed_balance_cents == 0"
            - "EscrowAccount.${escrow_id}.status == PARTIALLY_RELEASED and EscrowAccount.${escrow_id}.scheduled_holdback_release_utc == 2026-10-30T00:00:00Z"
            - "ServiceAccount.${a1_id}.transfer_status == TRANSFERRED and ServiceAccount.${a2_id}.transfer_status == TRANSFERRED and ServiceAccount.${a3_id}.transfer_status == PENDING (the EXCLUDED stop is not transferred)"
            - "RouteListing.${listing_id}.status == CLOSED"

  - rule_id: resource_temporal_overlap
    instances:

      - name: listing_exclusivity_half_open_adjacency_allowed
        grounds:
          - "validations[priority=45]"
          - "errors.ERR_LISTING_EXCLUSIVITY_OVERLAP"
          - "entities.RouteListing.fields.exclusive_start_date"
          - "entities.RouteListing.fields.exclusive_end_date"
          - "endpoints[POST /route-listings]"
        distinguishing_aspect: "HALF-OPEN interval semantics on a (seller_id, region_code) resource: an interval that starts exactly where an existing one ends is accepted, one that starts a single day earlier is refused, and the same refused window in another region is accepted - so the resource key is exercised as well as the interval arithmetic. Deliberately the opposite convention from the licence-window rule."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; AZ state profile; Seller SUN ACTIVE."
            - "One existing DRAFT listing L-BASE for Seller SUN in region EXC-01 holding the half-open exclusivity window [2026-08-01, 2026-11-01)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-08-01T00:00:00Z"}
              as: PlatformAdmin
            - call: "POST /state-license-profiles"
              payload: {"state_code": "AZ", "required_permit_types": ["PESTICIDE_APPLICATOR", "BUSINESS_TAX"], "reciprocity_states": ["NV"], "transfer_processing_days": 21, "cooling_off_days": 14, "provisional_operation_allowed": false}
              as: PlatformAdmin
              captures: {"az_profile_id": "$.data.id"}
            - call: "POST /sellers"
              payload: {"legal_name": "Sun Valley Pools LLC", "state_code": "AZ", "license_number": "AZ-PA-1001"}
              as: Broker
              captures: {"seller_id": "$.data.id"}
            - call: "POST /route-listings"
              payload: {"seller_id": "${seller_id}", "region_code": "EXC-01", "state_code": "AZ", "asking_price_cents": 200000, "listed_mrr_cents": 20000, "listed_account_count": 1, "exclusive_start_date": "2026-08-01", "exclusive_end_date": "2026-11-01"}
              as: Broker
              captures: {"l_base": "$.data.id"}
          trigger:
            - call: "POST /route-listings"
              payload: {"seller_id": "${seller_id}", "region_code": "EXC-01", "state_code": "AZ", "asking_price_cents": 200000, "listed_mrr_cents": 20000, "listed_account_count": 1, "exclusive_start_date": "2026-11-01", "exclusive_end_date": "2027-02-01"}
              as: Broker
              captures: {"l_adj": "$.data.id"}
            - call: "POST /route-listings"
              payload: {"seller_id": "${seller_id}", "region_code": "EXC-01", "state_code": "AZ", "asking_price_cents": 200000, "listed_mrr_cents": 20000, "listed_account_count": 1, "exclusive_start_date": "2026-10-31", "exclusive_end_date": "2027-01-31"}
              as: Broker
            - call: "POST /route-listings"
              payload: {"seller_id": "${seller_id}", "region_code": "EXC-02", "state_code": "AZ", "asking_price_cents": 200000, "listed_mrr_cents": 20000, "listed_account_count": 1, "exclusive_start_date": "2026-10-31", "exclusive_end_date": "2027-01-31"}
              as: Broker
              captures: {"l_other": "$.data.id"}
          assert:
            - "the first trigger call returns HTTP 201: [2026-11-01, 2027-02-01) touches L-BASE's end instant but does not overlap it, because the interval is half-open"
            - "RouteListing.${l_adj}.exclusive_start_date == 2026-11-01 and RouteListing.${l_adj}.exclusive_end_date == 2027-02-01"
            - "the second trigger call returns HTTP 409 with error_id ERR_LISTING_EXCLUSIVITY_OVERLAP: [2026-10-31, 2027-01-31) overlaps L-BASE by exactly one day"
            - "the second trigger call creates no RouteListing row"
            - "the third trigger call returns HTTP 201: the identical refused window is free in region EXC-02, because the exclusivity resource is the (seller_id, region_code) pair"
            - "RouteListing.${l_other}.region_code == EXC-02 and RouteListing.${l_other}.exclusive_start_date == 2026-10-31"
            - "GET /route-listings filtered on seller_id and region_code EXC-01 returns exactly 2 rows"
            - "RouteListing.${l_base}.status == DRAFT and RouteListing.${l_adj}.status == DRAFT (an exclusivity check mutates nothing)"

      - name: license_application_closed_window_plus_cooling_off_gap
        grounds:
          - "validations[priority=46]"
          - "errors.ERR_LICENSE_WINDOW_CONFLICT"
          - "entities.LicenseTransfer.fields.processing_window_end"
          - "entities.StateLicenseProfile.fields.transfer_processing_days"
          - "entities.StateLicenseProfile.fields.cooling_off_days"
          - "endpoints[POST /license-transfers/{id}/apply]"
        distinguishing_aspect: "CLOSED interval PLUS a mandatory gap, on the (buyer, state_code, permit_type) resource rather than on a seller and region: touching endpoints DO conflict here, the boundary sits cooling_off_days beyond processing_window_end rather than at it, and the day one short of that gap is still refused. Same domain, deliberately incompatible interval convention."
        test_recipe:
          setup:
            - "Logical clock starts at 2026-08-01T00:00:00Z and only moves forward."
            - "AZ StateLicenseProfile: required_permit_types [PESTICIDE_APPLICATOR, BUSINESS_TAX], transfer_processing_days 21, cooling_off_days 14."
            - "One Buyer AZ-BUYER (APPROVED) holds two ACCEPTED deals on two AZ listings WIN-01 and WIN-02, so two PESTICIDE_APPLICATOR LicenseTransfers exist for the same (buyer, AZ, PESTICIDE_APPLICATOR) resource, both NOT_STARTED."
            - "The first transfer is APPLIED with applied_on 2026-08-01, giving the closed window [2026-08-01, 2026-08-22] and a cooling-off gap that runs through 2026-09-04."
