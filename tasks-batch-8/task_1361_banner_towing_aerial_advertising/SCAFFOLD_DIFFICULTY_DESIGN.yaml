  # ---------------------------------------------------------------------------
  # Rule 3 — Non-linear state-machine shape on different entities
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: banner_revision_cycle_forces_refab
        grounds:
          - state_machines.BannerRevision.PROPOSED_to_APPROVED
          - state_machines.BannerRevision.APPROVED_to_ACTIVE
          - state_machines.Banner.IN_FABRICATION_to_DRAFT
          - state_machines.Banner.READY_to_DRAFT
        distinguishing_aspect: |
          BannerRevision has a self-loop back into Banner's DRAFT state from
          both IN_FABRICATION and READY — a cyclic shape (Banner can
          re-enter DRAFT multiple times across revisions). Banner's own
          machine is not a pure linear pipeline.
        test_recipe:
          setup:
            - "Campaign CAM; Banner BAN fabricated to READY via REV1"
            - "Client proposes REV2 (text change); on approve, banner must demote to DRAFT"
          setup_api_calls:
            - call: "POST /btaa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /btaa/bases"
              payload: { code: "B", name: "B" }
              as: PlatformAdmin
              captures: { base_id: $.data.id }
            - call: "POST /btaa/clients"
              payload: { legal_name: "C", billing_email: "c@x.com" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /btaa/clients/${client_id}/campaigns"
              payload: { name: "CAM" }
              as: Client
              as_user_id: "${client_id}"
              captures: { cam_id: $.data.id }
            - call: "POST /btaa/campaigns/${cam_id}/banners"
              payload: { artwork_hash: "h1", text_message: "M1", banner_length_ft: 50, banner_weight_lbs: 100 }
              as: Client
              as_user_id: "${client_id}"
              captures: { ban_id: $.data.id, ban_v: $.data.version }
            - call: "POST /btaa/banners/${ban_id}/revisions"
              payload: { proposed_text: "M1", proposed_artwork_hash: "h1" }
              as: Client
              as_user_id: "${client_id}"
              captures: { rev1_id: $.data.id }
            - call: "POST /btaa/banner_revisions/${rev1_id}/approve"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /btaa/banners/${ban_id}/fabricate"
              payload: { expected_banner_version: "${ban_v} + 1" }
              as: GroundCrewLead
            - call: "POST /btaa/banners/${ban_id}/mark_ready"
              payload: {}
              as: GroundCrewLead
            - call: "POST /btaa/banners/${ban_id}/revisions"
              payload: { proposed_text: "M2", proposed_artwork_hash: "h2" }
              as: Client
              as_user_id: "${client_id}"
              captures: { rev2_id: $.data.id }
          trigger:
            - call: "POST /btaa/banner_revisions/${rev2_id}/approve"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "GET /btaa/banners/${ban_id}"
              payload: {}
              as: PlatformAdmin
              captures: { ban_status: $.data.status, ban_rev: $.data.current_revision_id }
            - call: "GET /btaa/banner_revisions/${rev1_id}"
              payload: {}
              as: PlatformAdmin
              captures: { rev1_status: $.data.status }
          assert:
            - "ban_status == DRAFT"
            - "ban_rev == ${rev2_id}"
            - "rev1_status == SUPERSEDED"

      - name: flight_slot_weather_hold_cycle
        grounds:
          - state_machines.FlightSlot.SCHEDULED_to_WEATHER_HOLD
          - state_machines.FlightSlot.WEATHER_HOLD_to_SCHEDULED
          - state_machines.FlightSlot.WEATHER_HOLD_to_CANCELLED_WEATHER
        distinguishing_aspect: |
          FlightSlot's SCHEDULED ↔ WEATHER_HOLD cycle is non-linear (a
          slot may enter and exit WEATHER_HOLD before a second NO_GO
          forces CANCELLED_WEATHER). Distinct entity from Banner.
        test_recipe:
          setup:
            - "Slot S1 booked and SCHEDULED on a GRANTED approval"
            - "First NO_GO assessment → WEATHER_HOLD (hold_count=1)"
            - "Reschedule → SCHEDULED"
            - "Second NO_GO → CANCELLED_WEATHER (hold_count=2)"
          setup_api_calls:
            - call: "POST /btaa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /btaa/bases"
              payload: { code: "B", name: "B" }
