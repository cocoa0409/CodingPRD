            - call: "POST /mdm/quality-rules"
              payload: { domain_id: "${dom_id}", owner_steward_id: "${own_id}", rule_code: "QR2", dimension: "UNIQUENESS", weight_points: 25, threshold_pct: 90.00, severity: "CRITICAL" }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { qr2_id: $.data.id }
            - call: "POST /mdm/quality-rules"
              payload: { domain_id: "${dom_id}", owner_steward_id: "${std_id}", rule_code: "QR3", dimension: "TIMELINESS", weight_points: 25, threshold_pct: 90.00, severity: "MEDIUM" }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { qr3_id: $.data.id }
            - call: "POST /mdm/quality-rules"
              payload: { domain_id: "${dom_id}", owner_steward_id: "${std_id}", rule_code: "QR4", dimension: "CONSISTENCY", weight_points: 25, threshold_pct: 90.00, severity: "LOW" }
