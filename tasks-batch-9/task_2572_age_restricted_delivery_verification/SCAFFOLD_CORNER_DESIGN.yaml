      - name: corner_renewing_an_active_certification_and_revoking_twice_are_conflicts
        claim_type: error_triggerable
        grounds:
          - errors[ERR_INVALID_CERTIFICATION_STATE]
          - state_machines.CourierCertification.ACTIVE_to_REVOKED
          - endpoints.POST /courier-certifications/{id}/renew
          - endpoints.POST /courier-certifications/{id}/revoke
        distinguishing_aspect: |
          Renewal is only defined from EXPIRED or SUSPENDED, so renewing an ACTIVE row is 409
          ERR_INVALID_CERTIFICATION_STATE with renewal_count untouched; revocation then succeeds
          once and the identical second revocation is the same 409, so REVOKED is terminal.
        test_recipe:
          setup:
            - "logical clock 2026-08-01T00:00:00Z; one ACTIVE certification with valid_days 365"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /delivery-partners"
              payload: { legal_name: "Empire Last Mile", contract_tier: "STANDARD", license_reference: "NY-DEL-0001" }
              as: PlatformAdmin
              captures: { partner: $.data.id }
            - call: "POST /couriers"
              payload: { delivery_partner_id: "${partner}", full_name: "Dana Reyes", hired_at: "2026-05-01" }
              as: PartnerManager
              as_user_id: "${partner}"
              captures: { courier: $.data.id }
            - call: "POST /courier-certifications"
              payload: { courier_id: "${courier}", restriction_type: "ALCOHOL", training_score: 92, training_completed_at: "2026-07-15", valid_days: 365 }
              as: PartnerManager
              as_user_id: "${partner}"
              captures: { cert: $.data.id }
          trigger:
            - call: "POST /courier-certifications/${cert}/renew"
              payload: { training_score: 95, training_completed_at: "2026-07-20", valid_days: 365 }
              as: PartnerManager
              as_user_id: "${partner}"
              captures: { e1: $.data.error_id }
            - call: "POST /courier-certifications/${cert}/revoke"
              payload: { revocation_reason: "FALSIFIED_TRAINING_RECORD" }
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "POST /courier-certifications/${cert}/revoke"
              payload: { revocation_reason: "FALSIFIED_TRAINING_RECORD" }
              as: ComplianceOfficer
              as_user_id: "officer_a"
              captures: { e3: $.data.error_id }
          assert:
            - "first response: HTTP status 409 and data.error_id == \"ERR_INVALID_CERTIFICATION_STATE\""
            - "after the failed renewal CourierCertification.${cert}.state == ACTIVE, renewal_count == 0, training_score == 92"
            - "second response: HTTP status 200 and CourierCertification.${cert}.state == REVOKED"
            - 'CourierCertification.${cert}.revocation_reason == "FALSIFIED_TRAINING_RECORD"'
            - "Courier.${courier}.certification_state == UNCERTIFIED and dispatch_eligible == false"
            - "third response: HTTP status 409 and data.error_id == \"ERR_INVALID_CERTIFICATION_STATE\""

