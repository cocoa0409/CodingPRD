              as: VendorContact
              as_user_id: "${v_tpa}"
            - call: "POST /compliance/contract-amendments/${amd}/execute"
              payload: { executed_terms_note: "Data rights granted as requested; cooperation clause added." }
              as: PlanSponsorAdmin
            - call: "POST /compliance/vendor-data-packages/${pkg}/deliver"
              payload: { record_count: 1200, plan_paid_cents: 4200000, member_paid_cents: 800000, rebate_cents: 900000 }
              as: VendorContact
              as_user_id: "${v_tpa}"
          assert:
            - "the first deliver response HTTP status == 409 and its data.error_id == \"ERR_DATA_RIGHTS_NOT_SECURED\""
            - "immediately after the first deliver, GET /compliance/vendor-data-packages/${pkg} -> data.status == \"EXPECTED\" and data.delivery_round == 0 and data.record_count == null"
            - "after execute, GET /compliance/contracts/${c_tpa} -> data.data_rights_status == \"SECURED\" and GET /compliance/contract-amendments/${amd} -> data.status == \"EXECUTED\""
            - "the second deliver response HTTP status == 200 and GET /compliance/vendor-data-packages/${pkg} -> data.status == \"RECEIVED\", data.delivery_round == 1, data.record_count == 1200"
            - "GET /compliance/rx-data-submissions/${sub} -> data.status == \"ASSEMBLING\" and data.assembled_record_count == 0"

      - name: attestation_submit_requires_every_material_contract_gag_cleared
