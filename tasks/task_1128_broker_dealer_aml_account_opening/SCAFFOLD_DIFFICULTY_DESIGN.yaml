            - { call: "POST /aml/aml-cases/${case_id}/recommend-sar", payload: { recommendation_note: "second round", initial_detection_date: "2026-05-02" }, as: AMLAnalyst, as_user_id: "analyst-sm2", captures: { st5: "$.data.status", v_end: "$.data.version" } }
          assert:
            - "captured st1 == DECIDED_NO_FILE, st2 == CLOSED, st3 == REOPENED, st4 == INVESTIGATING, st5 == SAR_RECOMMENDED"
            - "captured v_end == v1 + 5 (exactly one version increment per transition)"
            - "AMLCase.${case_id}.recommending_analyst_id == analyst-sm2 (re-stamped on second recommendation)"

      - name: certificate_deposit_reject_resubmit_cycle
        grounds:
