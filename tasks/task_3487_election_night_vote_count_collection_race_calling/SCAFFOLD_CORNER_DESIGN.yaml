            - "Contest.${cst}.total_votes == 3999"
            - "VoteReport.${rep_b}.deviation_ratio == 0.00025"

      - name: qc_deviation_exactly_at_040_passes
        claim_type: Correct Result
        grounds:
          - calculations.qc_deviation_check
        distinguishing_aspect: "The flag threshold is strict: deviation_ratio == 0.4 exactly (5600 vs 4000) stays RECEIVED, while 0.4001 (14001 vs 10000) flips FLAGGED."
