# =============================================================================
# §1.9 Scaffold Corner Design — construction-closeout
# Breadth coverage of every §1.1–§1.7 testable claim not covered by §1.8.
# Logical clock default: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ------------------------------------------------------------- entities
  - section: entities
    instances:
      - name: project_creation_computed_defaults
        claim_type: computed_fields
        grounds: [entities.Project.fields.retainage_held_cents, entities.Project.fields.status, calculations.retainage_held_cents]
        distinguishing_aspect: "Creating a project freezes retainage_held_cents = round_half_up(contract*pct), zeros counters, and starts MOBILIZED regardless of any client attempt to inject status."
        test_recipe:
          setup: ["empty DB; clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - { call: "POST /closeout/projects", payload: { name: "Proj D", contract_value_cents: 250000, retainage_pct: 0.10, reduction_policy: "STANDARD", warranty_sla_mode: "CALENDAR" }, as: GCProjectManager, captures: { p: $.data.id, held: $.data.retainage_held_cents, st: $.data.status, v: $.data.version } }
          assert:
            - "${held} == 25000"
            - "${st} == MOBILIZED"
            - "${v} == 1"
            - "open_life_safety_count == 0 AND open_major_count == 0 AND open_minor_count == 0 AND sc_eligible == false AND beneficial_occupancy_registered == false"
            - "retainage_paid_cents == 0 AND retainage_outstanding_cents == 25000"

      - name: project_create_retainage_pct_out_of_range_returns_400
        claim_type: type_constraints
        grounds: [entities.Project.fields.retainage_pct, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "retainage_pct must be in (0, 0.25]; 0.30 is rejected at schema level before any state is created."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /closeout/projects", payload: { name: "Bad", contract_value_cents: 250000, retainage_pct: 0.30 }, as: GCProjectManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST"

      - name: trade_package_missing_subcontractor_org_returns_400
        claim_type: required_fields
        grounds: [entities.TradePackage.fields.subcontractor_org, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "subcontractor_org is conditionally required: omitted with responsible_type=SUBCONTRACTOR -> 400; omitted with SELF_PERFORMED -> 201."
        test_recipe:
          setup: ["Project exists (MOBILIZED)"]
          setup_api_calls:
            - { call: "POST /closeout/projects", payload: { name: "Proj", contract_value_cents: 10000000, retainage_pct: 0.10 }, as: GCProjectManager, captures: { p: $.data.id } }
          trigger:
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${p}", trade_name: "ELECTRICAL", responsible_type: "SUBCONTRACTOR" }, as: GCProjectManager, captures: { err: $.data.error_id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${p}", trade_name: "PLUMBING", responsible_type: "SELF_PERFORMED" }, as: GCProjectManager, captures: { ok_id: $.data.id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "TradePackage.${ok_id} created (SELF_PERFORMED needs no org)"

      - name: project_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=6]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent id returns ERR_NOT_FOUND with http 404, not an empty object."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /closeout/projects/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: GCProjectManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_NOT_FOUND"

      - name: release_create_amount_input_ignored
        claim_type: computed_fields
        grounds: [entities.RetainageRelease.fields.amount_cents, calculations.release_amount]
        distinguishing_aspect: "amount_cents is server-computed; a client-supplied amount_cents on create is ignored and the computed value (500000) is returned."
        test_recipe:
          setup: ["SUBSTANTIALLY_COMPLETE STANDARD project, held 1000000, zero open items"]
          setup_api_calls:
            - { call: "POST /closeout/projects", payload: { name: "Proj", contract_value_cents: 10000000, retainage_pct: 0.10, reduction_policy: "STANDARD" }, as: GCProjectManager, captures: { p: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${p}", trade_name: "ELECTRICAL", responsible_type: "SUBCONTRACTOR", subcontractor_org: "SparkyCo" }, as: GCProjectManager, captures: { t: $.data.id } }
            - { call: "POST /closeout/projects/${p}/begin-punch", as: GCProjectManager }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T12:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks", payload: { project_id: "${p}", trade_package_id: "${t}", lead_inspector_id: "insp-1", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: GCProjectManager, captures: { w: $.data.id } }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks/${w}/complete", as: GCInspector }
            - { call: "POST /closeout/projects/${p}/request-sc-review", as: GCProjectManager }
            - { call: "POST /closeout/projects/${p}/determine-substantial-completion", payload: { approved: true }, as: OwnerRep }
            - { call: "GET /closeout/projects/${p}", as: GCProjectManager, captures: { pv: $.data.version } }
          trigger:
            - { call: "POST /closeout/retainage-releases", payload: { project_id: "${p}", kind: "REDUCTION", expected_project_version: "${pv}", amount_cents: 1 }, as: GCProjectManager, captures: { amt: $.data.amount_cents } }
          assert:
            - "${amt} == 500000  # computed, not the injected 1"

      - name: pagination_on_punch_items_list
        claim_type: listing
        grounds: [response_envelope.pagination_fields, response_envelope.pagination_defaults]
        distinguishing_aspect: "List endpoint honors limit/offset with total_count and has_more: 12 items -> page 1 (default limit 10) has_more true; offset 10 returns 2 with has_more false."
        test_recipe:
          setup: ["PUNCH_ACTIVE project with walked trade and 12 MINOR punch items"]
          setup_api_calls:
            - { call: "POST /closeout/projects", payload: { name: "Proj", contract_value_cents: 10000000, retainage_pct: 0.10 }, as: GCProjectManager, captures: { p: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${p}", trade_name: "ELECTRICAL", responsible_type: "SUBCONTRACTOR", subcontractor_org: "SparkyCo" }, as: GCProjectManager, captures: { t: $.data.id } }
            - { call: "POST /closeout/projects/${p}/begin-punch", as: GCProjectManager }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T12:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks", payload: { project_id: "${p}", trade_package_id: "${t}", lead_inspector_id: "insp-1", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: GCProjectManager, captures: { w: $.data.id } }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks/${w}/complete", as: GCInspector }
            - { call: "POST /closeout/punch-items", payload: { project_id: "${p}", trade_package_id: "${t}", title: "I01", severity: "MINOR", location_building: "B1", location_floor: "L1", location_area: "R01", photo_ref: "i01" }, as: GCInspector }
            - { call: "POST /closeout/punch-items", payload: { project_id: "${p}", trade_package_id: "${t}", title: "I02", severity: "MINOR", location_building: "B1", location_floor: "L1", location_area: "R02", photo_ref: "i02" }, as: GCInspector }
            - { call: "POST /closeout/punch-items", payload: { project_id: "${p}", trade_package_id: "${t}", title: "I03", severity: "MINOR", location_building: "B1", location_floor: "L1", location_area: "R03", photo_ref: "i03" }, as: GCInspector }
            - { call: "POST /closeout/punch-items", payload: { project_id: "${p}", trade_package_id: "${t}", title: "I04", severity: "MINOR", location_building: "B1", location_floor: "L1", location_area: "R04", photo_ref: "i04" }, as: GCInspector }
            - { call: "POST /closeout/punch-items", payload: { project_id: "${p}", trade_package_id: "${t}", title: "I05", severity: "MINOR", location_building: "B1", location_floor: "L1", location_area: "R05", photo_ref: "i05" }, as: GCInspector }
            - { call: "POST /closeout/punch-items", payload: { project_id: "${p}", trade_package_id: "${t}", title: "I06", severity: "MINOR", location_building: "B1", location_floor: "L1", location_area: "R06", photo_ref: "i06" }, as: GCInspector }
            - { call: "POST /closeout/punch-items", payload: { project_id: "${p}", trade_package_id: "${t}", title: "I07", severity: "MINOR", location_building: "B1", location_floor: "L1", location_area: "R07", photo_ref: "i07" }, as: GCInspector }
            - { call: "POST /closeout/punch-items", payload: { project_id: "${p}", trade_package_id: "${t}", title: "I08", severity: "MINOR", location_building: "B1", location_floor: "L1", location_area: "R08", photo_ref: "i08" }, as: GCInspector }
            - { call: "POST /closeout/punch-items", payload: { project_id: "${p}", trade_package_id: "${t}", title: "I09", severity: "MINOR", location_building: "B1", location_floor: "L1", location_area: "R09", photo_ref: "i09" }, as: GCInspector }
            - { call: "POST /closeout/punch-items", payload: { project_id: "${p}", trade_package_id: "${t}", title: "I10", severity: "MINOR", location_building: "B1", location_floor: "L1", location_area: "R10", photo_ref: "i10" }, as: GCInspector }
            - { call: "POST /closeout/punch-items", payload: { project_id: "${p}", trade_package_id: "${t}", title: "I11", severity: "MINOR", location_building: "B1", location_floor: "L1", location_area: "R11", photo_ref: "i11" }, as: GCInspector }
            - { call: "POST /closeout/punch-items", payload: { project_id: "${p}", trade_package_id: "${t}", title: "I12", severity: "MINOR", location_building: "B1", location_floor: "L1", location_area: "R12", photo_ref: "i12" }, as: GCInspector }
          trigger:
            - { call: "GET /closeout/punch-items", payload: { project_id: "${p}" }, as: GCInspector }
            - { call: "GET /closeout/punch-items", payload: { project_id: "${p}", limit: 10, offset: 10 }, as: GCInspector }
          assert:
            - "Page 1: len(data) == 10 AND total_count == 12 AND has_more == true"
            - "Page 2: len(data) == 2 AND total_count == 12 AND has_more == false"

  # ------------------------------------------------------------- state_machines
  - section: state_machines
    instances:
      - name: verify_from_open_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.PunchItem.transitions, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "verify requires from-state READY_FOR_REVIEW; from OPEN it is rejected and no side effects (counts, verified_by) fire."
        test_recipe:
          setup: ["PUNCH_ACTIVE project, walked trade, one OPEN item"]
          setup_api_calls:
            - { call: "POST /closeout/projects", payload: { name: "Proj", contract_value_cents: 10000000, retainage_pct: 0.10 }, as: GCProjectManager, captures: { p: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${p}", trade_name: "ELECTRICAL", responsible_type: "SUBCONTRACTOR", subcontractor_org: "SparkyCo" }, as: GCProjectManager, captures: { t: $.data.id } }
            - { call: "POST /closeout/projects/${p}/begin-punch", as: GCProjectManager }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T12:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks", payload: { project_id: "${p}", trade_package_id: "${t}", lead_inspector_id: "insp-1", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: GCProjectManager, captures: { w: $.data.id } }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks/${w}/complete", as: GCInspector }
            - { call: "POST /closeout/punch-items", payload: { project_id: "${p}", trade_package_id: "${t}", title: "Paint", severity: "MINOR", location_building: "B1", location_floor: "L1", location_area: "R1", photo_ref: "i1" }, as: GCInspector, captures: { it: $.data.id } }
          trigger:
            - { call: "POST /closeout/punch-items/${it}/verify", as: GCInspector, as_user_id: "insp-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE"
            - "PunchItem.${it}.status == OPEN AND verified_by_user_id == null AND Project.${p}.open_minor_count == 1"

      - name: walk_complete_twice_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.PunchWalk.transitions, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "COMPLETED is terminal for PunchWalk; a second complete is rejected."
        test_recipe:
          setup: ["PUNCH_ACTIVE project, walk window reached, walk completed once"]
          setup_api_calls:
            - { call: "POST /closeout/projects", payload: { name: "Proj", contract_value_cents: 10000000, retainage_pct: 0.10 }, as: GCProjectManager, captures: { p: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${p}", trade_name: "ELECTRICAL", responsible_type: "SUBCONTRACTOR", subcontractor_org: "SparkyCo" }, as: GCProjectManager, captures: { t: $.data.id } }
            - { call: "POST /closeout/projects/${p}/begin-punch", as: GCProjectManager }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T12:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks", payload: { project_id: "${p}", trade_package_id: "${t}", lead_inspector_id: "insp-1", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: GCProjectManager, captures: { w: $.data.id } }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks/${w}/complete", as: GCInspector }
          trigger:
            - { call: "POST /closeout/punch-walks/${w}/complete", as: GCInspector, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE"
            - "PunchWalk.${w}.status == COMPLETED"

      - name: doc_approve_from_rejected_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.CloseoutDocument.transitions, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "REJECTED is terminal for a CloseoutDocument; approving it is rejected — the only path forward is a new document with a bumped revision."
        test_recipe:
          setup: ["CLOSEOUT_IN_PROGRESS project; OM_MANUAL doc rejected"]
          setup_api_calls:
            - { call: "POST /closeout/projects", payload: { name: "Proj", contract_value_cents: 10000000, retainage_pct: 0.10 }, as: GCProjectManager, captures: { p: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${p}", trade_name: "ELECTRICAL", responsible_type: "SUBCONTRACTOR", subcontractor_org: "SparkyCo" }, as: GCProjectManager, captures: { t: $.data.id } }
            - { call: "POST /closeout/projects/${p}/begin-punch", as: GCProjectManager }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T12:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks", payload: { project_id: "${p}", trade_package_id: "${t}", lead_inspector_id: "insp-1", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: GCProjectManager, captures: { w: $.data.id } }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks/${w}/complete", as: GCInspector }
            - { call: "POST /closeout/projects/${p}/request-sc-review", as: GCProjectManager }
            - { call: "POST /closeout/projects/${p}/determine-substantial-completion", payload: { approved: true }, as: OwnerRep }
            - { call: "POST /closeout/projects/${p}/register-beneficial-occupancy", payload: { occupancy_date: "2026-08-04T00:00:00Z" }, as: OwnerRep }
            - { call: "POST /closeout/projects/${p}/start-closeout", as: GCProjectManager }
            - { call: "POST /closeout/closeout-documents", payload: { project_id: "${p}", trade_package_id: "${t}", doc_type: "OM_MANUAL", file_ref: "om-v1" }, as: SubcontractorRep, as_user_id: "${t}", captures: { d: $.data.id } }
            - { call: "POST /closeout/closeout-documents/${d}/reject", payload: { rejection_reason: "missing wiring diagrams" }, as: GCProjectManager }
          trigger:
            - { call: "POST /closeout/closeout-documents/${d}/approve", as: GCProjectManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE"
            - "CloseoutDocument.${d}.status == REJECTED"

      - name: warranty_case_resolve_from_reported_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.WarrantyCase.transitions, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "resolve requires TRIAGED; from REPORTED it is rejected (triage cannot be skipped)."
        test_recipe:
          setup: ["CLOSED project with one REPORTED warranty case"]
          setup_api_calls:
            - { call: "POST /closeout/projects", payload: { name: "Proj", contract_value_cents: 10000000, retainage_pct: 0.10 }, as: GCProjectManager, captures: { p: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${p}", trade_name: "ELECTRICAL", responsible_type: "SUBCONTRACTOR", subcontractor_org: "SparkyCo" }, as: GCProjectManager, captures: { t: $.data.id } }
            - { call: "POST /closeout/projects/${p}/begin-punch", as: GCProjectManager }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T12:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks", payload: { project_id: "${p}", trade_package_id: "${t}", lead_inspector_id: "insp-1", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: GCProjectManager, captures: { w: $.data.id } }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks/${w}/complete", as: GCInspector }
            - { call: "POST /closeout/projects/${p}/request-sc-review", as: GCProjectManager }
            - { call: "POST /closeout/projects/${p}/determine-substantial-completion", payload: { approved: true }, as: OwnerRep }
            - { call: "POST /closeout/projects/${p}/register-beneficial-occupancy", payload: { occupancy_date: "2026-08-04T00:00:00Z" }, as: OwnerRep }
            - { call: "POST /closeout/projects/${p}/start-closeout", as: GCProjectManager }
            - { call: "POST /closeout/closeout-documents", payload: { project_id: "${p}", trade_package_id: "${t}", doc_type: "OM_MANUAL", file_ref: "om" }, as: SubcontractorRep, as_user_id: "${t}", captures: { d1: $.data.id } }
            - { call: "POST /closeout/closeout-documents", payload: { project_id: "${p}", trade_package_id: "${t}", doc_type: "WARRANTY_DOC", file_ref: "wd" }, as: SubcontractorRep, as_user_id: "${t}", captures: { d2: $.data.id } }
            - { call: "POST /closeout/closeout-documents", payload: { project_id: "${p}", trade_package_id: "${t}", doc_type: "AS_BUILT", file_ref: "ab" }, as: SubcontractorRep, as_user_id: "${t}", captures: { d3: $.data.id } }
            - { call: "POST /closeout/closeout-documents/${d1}/approve", as: GCProjectManager }
            - { call: "POST /closeout/closeout-documents/${d2}/approve", as: GCProjectManager }
            - { call: "POST /closeout/closeout-documents/${d3}/approve", as: GCProjectManager }
            - { call: "POST /closeout/trade-packages/${t}/lien-waiver-submission", payload: { waiver_type: "UNCONDITIONAL", amount_cents: 1000000, file_ref: "wvr" }, as: SubcontractorRep, as_user_id: "${t}" }
            - { call: "POST /closeout/trade-packages/${t}/lien-waiver-decision", payload: { decision: "ACCEPT" }, as: GCProjectManager }
            - { call: "POST /closeout/training-sessions", payload: { project_id: "${p}", trade_package_id: "${t}", system_name: "AHU-1", location_room: "TR-1", scheduled_start: "2026-08-05T09:00:00Z", scheduled_end: "2026-08-05T10:00:00Z" }, as: GCProjectManager, captures: { s: $.data.id } }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T09:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/training-sessions/${s}/conduct", payload: { attendee_count: 2 }, as: GCProjectManager }
            - { call: "GET /closeout/projects/${p}", as: GCProjectManager, captures: { pv: $.data.version } }
            - { call: "POST /closeout/retainage-releases", payload: { project_id: "${p}", kind: "FINAL", expected_project_version: "${pv}" }, as: GCProjectManager, captures: { rf: $.data.id } }
            - { call: "POST /closeout/retainage-releases/${rf}/approve", as: OwnerRep }
            - { call: "POST /closeout/projects/${p}/close", as: GCProjectManager }
            - { call: "POST /closeout/warranty-cases", payload: { project_id: "${p}", title: "Drip", severity: "MINOR", description: "sink drip" }, as: OwnerRep, captures: { c: $.data.id } }
          trigger:
            - { call: "POST /closeout/warranty-cases/${c}/resolve", payload: { resolution_note: "fixed" }, as: GCProjectManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE"
            - "WarrantyCase.${c}.status == REPORTED AND sla_due_at == null"

      - name: begin_punch_with_zero_trades_returns_error
        claim_type: precondition_enforcement
        grounds: [state_machines.Project.MOBILIZED_to_PUNCH_ACTIVE, "errors[ERR_NO_TRADE_PACKAGES]"]
        distinguishing_aspect: "begin-punch requires at least one registered trade package."
        test_recipe:
          setup: ["Project exists with no trade packages"]
          setup_api_calls:
            - { call: "POST /closeout/projects", payload: { name: "Proj", contract_value_cents: 10000000, retainage_pct: 0.10 }, as: GCProjectManager, captures: { p: $.data.id } }
          trigger:
            - { call: "POST /closeout/projects/${p}/begin-punch", as: GCProjectManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_NO_TRADE_PACKAGES"
            - "Project.${p}.status == MOBILIZED"

      - name: sc_request_walk_incomplete_returns_error
        claim_type: precondition_enforcement
        grounds: [state_machines.Project.PUNCH_ACTIVE_to_SC_REVIEW, "errors[ERR_WALK_INCOMPLETE]"]
