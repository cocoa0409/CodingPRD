  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: stale_version_beats_claim_invalid_state
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - concurrency_rules[assign-tier-stale-claim]
        distinguishing_aspect: |
          Error-category pair = concurrency (412) vs state (409). When both
          checks would fail on assign-tier (stale expected_claim_version AND
          claim not in INJURY_VERIFIED), the OCC check at priority 4 wins and
          returns ERR_STALE_VERSION, not ERR_CLAIM_INVALID_STATE.
        test_recipe:
          setup:
            - "Claim in RECORDS_PENDING (NOT INJURY_VERIFIED, so assign-tier would fail state check)"
            - "Client holds a stale expected_claim_version captured before any mutation"
          setup_api_calls:
            - call: "POST /settlement-programs"
              payload: { program_code: "MT-P1", tort_name: "P1", qsf_principal_cents: 100000000 }
              as: ProgramAdministrator
              captures: { pid: $.data.id }
            - call: "POST /settlement-programs/${pid}/tier-matrices"
              payload: { injury_category: "QUALIFYING_CAT_A", severity_score_min: 0, severity_score_max: 100, base_award_cents: 5000000 }
              as: ProgramAdministrator
              captures: { tmid: $.data.id }
            - call: "POST /settlement-programs/${pid}/tier-matrices/${tmid}/publish"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /settlement-programs/${pid}/claimants"
              payload: { full_name: "Jack", date_of_birth: "1960-01-01", ssn_last4: "8888", date_of_exposure_start: "2020-01-01", date_of_exposure_end: "2022-12-31", date_of_diagnosis: "2021-06-15", injury_category: "QUALIFYING_CAT_A", represented_by_counsel: false }
              as: IntakeSpecialist
              captures: { clid: $.data.id }
            - call: "POST /settlement-programs/${pid}/claims"
              payload: { claimant_id: "${clid}" }
              as: IntakeSpecialist
              captures: { cid: $.data.id }
            - call: "POST /settlement-programs/${pid}/claims/${cid}/screen-eligibility"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /settlement-programs/${pid}/claims/${cid}/medical-records"
              payload: { provider_name: "X", record_type: "DIAGNOSTIC", severity_score: 70, confirms_qualifying_injury: true }
              as: RecordsAnalyst
            - call: "GET /settlement-programs/${pid}/claims/${cid}"
              as: ProgramAdministrator
              captures: { v_stale: $.data.version }
            - call: "POST /settlement-programs/${pid}/claims/${cid}/medical-records"
              payload: { provider_name: "Y", record_type: "TREATMENT", severity_score: 65, confirms_qualifying_injury: false }
              as: RecordsAnalyst
          trigger:
            - call: "POST /settlement-programs/${pid}/claims/${cid}/assign-tier"
              payload: { tier_matrix_id: "${tmid}", expected_claim_version: "${v_stale} - 1" }
              as: ProgramAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_STALE_VERSION (priority 4 wins over priority 5 state check)"

      - name: self_approval_beats_disbursement_state
        grounds:
          - validations[priority=6]
          - state_machines.Disbursement.PENDING_to_APPROVED
        distinguishing_aspect: |
          Error-category pair = business_safety (403 segregation-of-duties)
          vs state (409). When approve is called by the SAME user who called
          prepare-disbursement AND the disbursement is already APPROVED (so
          state check would also fail), priority 6 safety check runs first and
          returns ERR_SELF_APPROVAL_FORBIDDEN. Distinct pair from concurrency
          vs state used in the other instance.
        test_recipe:
          setup:
            - "Claim READY_FOR_DISBURSEMENT with one Disbursement already APPROVED by user_approver_2"
            - "user_approver_1 originally called prepare-disbursement"
          setup_api_calls:
            - call: "POST /settlement-programs"
              payload: { program_code: "MT-P2", tort_name: "P2", qsf_principal_cents: 100000000 }
              as: ProgramAdministrator
              captures: { pid: $.data.id }
            - call: "POST /settlement-programs/${pid}/tier-matrices"
              payload: { injury_category: "QUALIFYING_CAT_A", severity_score_min: 0, severity_score_max: 100, base_award_cents: 5000000 }
              as: ProgramAdministrator
