  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: enroll_chains_through_other_admit_to_aid_revoke_depth_3
        grounds:
          - state_machines.Application.ADMITTED_to_ENROLLED
          - state_machines.Application.ADMITTED_to_DECLINED
          - state_machines.AidPackage.FINALIZED_to_REVOKED
        distinguishing_aspect: |
          Depth-3 cascade chain originating from POST /applications/{id}/enroll:
          (1) the enrolled Application moves ADMITTED→ENROLLED on S_enroll;
          (2) that mutation causes a SIBLING Application at S_other (also ADMITTED) to be
              cascaded ADMITTED→DECLINED;
          (3) that sibling's DECLINED transition itself causes the linked FINALIZED
              AidPackage at S_other to cascade FINALIZED→REVOKED.
          Each link is caused by the previous (not by the original action) — this is
          not a fan-out. Trigger: enroll.
        test_recipe:
          setup:
            - "Applicant A has two ADMITTED applications at two different schools S_enroll and S_other, both with FINALIZED AidPackages."
