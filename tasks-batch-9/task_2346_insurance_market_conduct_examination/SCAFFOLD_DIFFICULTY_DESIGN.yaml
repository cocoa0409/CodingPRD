              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { cycle_id: "$.data.id" }
          trigger:
            - call: "POST /market-conduct/analysis-cycles/${cycle_id}/score"
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { scored: "$.data.scored_insurer_count" }
            - call: "GET /market-conduct/insurers/${zero_id}/analysis-scores"
              payload: { cycle_id: "${cycle_id}" }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { zero_at_scoring: "$.data[0].complaint_ratio_at_scoring", zero_cc: "$.data[0].complaint_component", zero_composite: "$.data[0].composite_score", zero_rank: "$.data[0].rank_position" }
            - call: "POST /market-conduct/analysis-cycles/${cycle_id}/select-targets"
