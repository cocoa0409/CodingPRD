scaffold_corner_design:

  # =====================================================================
  # From Table 1 — Entities
  # =====================================================================
  - section: entities
    instances:
      - name: create_account_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.Account, endpoints]
        distinguishing_aspect: "POST /dmv/accounts with all required fields returns 201; response has server-minted id, version==1, status==ACTIVE, ytd_completed_count==0, outstanding_balance_cents==0."
        test_recipe:
          setup: ["No prior state needed."]
          setup_api_calls: []
          trigger:
            - call: "POST /dmv/accounts"
              payload: { account_type: "RETAIL", legal_name: "New Cust", state_code: "CA" }
              as: PlatformAdmin
              captures: { a_id: $.data.id, a_v: $.data.version }
          assert:
            - "response status == 201"
            - "Account.${a_id}.version == 1 and status == ACTIVE and ytd_completed_count == 0 and outstanding_balance_cents == 0"

      - name: get_account_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Account, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /dmv/accounts/{id} with a non-existent UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /dmv/accounts/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { nf_err: $.data.error_id }
          assert:
            - "response status == 404 and error_id == ERR_NOT_FOUND"

      - name: create_transaction_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Transaction, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /dmv/transactions omitting required transaction_type returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["A CA account exists."]
          setup_api_calls:
            - call: "POST /dmv/accounts"
              payload: { account_type: "RETAIL", legal_name: "Req Cust", state_code: "CA" }
              as: PlatformAdmin
              captures: { rq_acct: $.data.id }
          trigger:
            - call: "POST /dmv/transactions"
              payload: { account_id: "${rq_acct}", vin: "1HGCM82633A004352" }
              as: IntakeClerk
              captures: { rq_err: $.data.error_id }
          assert:
            - "response status == 400 and error_id == ERR_INVALID_REQUEST (transaction_type missing)"

      - name: create_transaction_default_expedite_false_applied
        claim_type: Defaults
        grounds: [entities.Transaction.fields.expedite, entities.Transaction.fields.declared_price_cents]
        distinguishing_aspect: "Omitting expedite and declared_price_cents on a REGISTRATION defaults expedite=false and declared_price_cents=0."
        test_recipe:
          setup: ["A CA FeeSchedule and account exist."]
          setup_api_calls:
            - call: "POST /dmv/fee-schedules"
              payload: { state_code: "CA", title_fee_cents: 2000, registration_fee_cents: 8500, transfer_fee_cents: 1500, lien_recording_fee_cents: 1000, use_tax_rate_bps: 625, trade_in_credit_allowed: true }
              as: PlatformAdmin
            - call: "POST /dmv/accounts"
              payload: { account_type: "RETAIL", legal_name: "Def Cust", state_code: "CA" }
              as: PlatformAdmin
              captures: { df_acct: $.data.id }
          trigger:
            - call: "POST /dmv/transactions"
              payload: { account_id: "${df_acct}", transaction_type: "REGISTRATION", vin: "1HGCM82633A004352" }
              as: IntakeClerk
              captures: { df_txn: $.data.id }
          assert:
            - "Transaction.${df_txn}.expedite == false and declared_price_cents == 0"
            - "Transaction.${df_txn}.lifecycle_status == DRAFT and document_status == COLLECTING and rejection_round == 0"

      - name: computed_outstanding_balance_ignores_client_input
        claim_type: Computed Fields
        grounds: [entities.Account.fields.outstanding_balance_cents, entities.Account.fields.status]
        distinguishing_aspect: "outstanding_balance_cents/status/ytd_completed_count are source:computed; they initialize to 0/ACTIVE/0 regardless of input."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /dmv/accounts"
              payload: { account_type: "FLEET", legal_name: "Comp Cust", state_code: "CA", credit_terms: true, credit_limit_cents: 50000 }
              as: PlatformAdmin
              captures: { cf_id: $.data.id }
          assert:
            - "Account.${cf_id}.outstanding_balance_cents == 0 and ytd_completed_count == 0 and status == ACTIVE (computed)"

      - name: payment_immutable_entity_no_version_field
        claim_type: Immutability
        grounds: [entities.Payment]
        distinguishing_aspect: "Payment has common_fields:false — id and created_at only, no version, no update endpoint; the payments list is an array envelope."
        test_recipe:
          setup: ["A RETAIL account exists."]
          setup_api_calls:
            - call: "POST /dmv/accounts"
              payload: { account_type: "RETAIL", legal_name: "Imm Cust", state_code: "CA" }
              as: PlatformAdmin
              captures: { im_acct: $.data.id }
          trigger:
            - call: "GET /dmv/payments?account_id=${im_acct}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "GET /dmv/payments returns response_type array with total_count == 0 and has_more == false"

      - name: create_transaction_unknown_account_returns_404
        claim_type: Parent Relationships
        grounds: [entities.Transaction.fields.account_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /dmv/transactions referencing a non-existent account_id returns 404 ERR_NOT_FOUND (body FK existence)."
        test_recipe:
          setup: ["A CA FeeSchedule exists so only the account FK is missing."]
          setup_api_calls:
            - call: "POST /dmv/fee-schedules"
              payload: { state_code: "CA", title_fee_cents: 2000, registration_fee_cents: 8500, transfer_fee_cents: 1500, lien_recording_fee_cents: 1000, use_tax_rate_bps: 625, trade_in_credit_allowed: true }
              as: PlatformAdmin
          trigger:
            - call: "POST /dmv/transactions"
              payload: { account_id: "00000000-0000-0000-0000-000000000000", transaction_type: "REGISTRATION", vin: "1HGCM82633A004352" }
              as: IntakeClerk
              captures: { pf_err: $.data.error_id }
          assert:
            - "response status == 404 and error_id == ERR_NOT_FOUND"

      - name: transaction_invalid_fields_vin_length_returns_422
        claim_type: Type Constraints
        grounds: [entities.Transaction.fields.vin, "validations[priority=9]", "errors[ERR_INVALID_TRANSACTION_FIELDS]"]
        distinguishing_aspect: "A VIN of length != 17 ('SHORTVIN') fails the typed constraint with 422 ERR_INVALID_TRANSACTION_FIELDS."
        test_recipe:
          setup: ["A CA FeeSchedule and RETAIL account exist."]
          setup_api_calls:
            - call: "POST /dmv/fee-schedules"
              payload: { state_code: "CA", title_fee_cents: 2000, registration_fee_cents: 8500, transfer_fee_cents: 1500, lien_recording_fee_cents: 1000, use_tax_rate_bps: 625, trade_in_credit_allowed: true }
              as: PlatformAdmin
            - call: "POST /dmv/accounts"
              payload: { account_type: "RETAIL", legal_name: "Vin Cust", state_code: "CA" }
              as: PlatformAdmin
              captures: { vn_acct: $.data.id }
          trigger:
            - call: "POST /dmv/transactions"
              payload: { account_id: "${vn_acct}", transaction_type: "REGISTRATION", vin: "SHORTVIN" }
              as: IntakeClerk
              captures: { vn_err: $.data.error_id }
          assert:
            - "response status == 422 and error_id == ERR_INVALID_TRANSACTION_FIELDS"

      - name: transaction_title_requires_positive_declared_price_422
        claim_type: Type Constraints
        grounds: [entities.Transaction.fields.declared_price_cents, "validations[priority=9]", "errors[ERR_INVALID_TRANSACTION_FIELDS]"]
        distinguishing_aspect: "A TITLE transaction with declared_price_cents==0 violates the transaction-type consistency rule -> 422 ERR_INVALID_TRANSACTION_FIELDS."
        test_recipe:
          setup: ["A CA FeeSchedule and RETAIL account exist."]
          setup_api_calls:
            - call: "POST /dmv/fee-schedules"
              payload: { state_code: "CA", title_fee_cents: 2000, registration_fee_cents: 8500, transfer_fee_cents: 1500, lien_recording_fee_cents: 1000, use_tax_rate_bps: 625, trade_in_credit_allowed: true }
              as: PlatformAdmin
            - call: "POST /dmv/accounts"
              payload: { account_type: "RETAIL", legal_name: "Title0 Cust", state_code: "CA" }
              as: PlatformAdmin
              captures: { t0_acct: $.data.id }
          trigger:
            - call: "POST /dmv/transactions"
              payload: { account_id: "${t0_acct}", transaction_type: "TITLE", vin: "1HGCM82633A004352", declared_price_cents: 0 }
              as: IntakeClerk
              captures: { t0_err: $.data.error_id }
          assert:
            - "response status == 422 and error_id == ERR_INVALID_TRANSACTION_FIELDS"

  # =====================================================================
  # From Table 2 — State Machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: submit_from_draft_without_quote_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Transaction.QUOTED_to_SUBMITTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Submitting a Transaction still in DRAFT (never quoted) is not an allowed from-state -> 409 ERR_INVALID_STATE; no Submission created."
        test_recipe:
          setup: ["A CA FeeSchedule and RETAIL account; a REGISTRATION Transaction in DRAFT with documents VERIFIED but never quoted."]
          setup_api_calls:
            - call: "POST /dmv/fee-schedules"
              payload: { state_code: "CA", title_fee_cents: 2000, registration_fee_cents: 8500, transfer_fee_cents: 1500, lien_recording_fee_cents: 1000, use_tax_rate_bps: 625, trade_in_credit_allowed: true }
              as: PlatformAdmin
            - call: "POST /dmv/accounts"
              payload: { account_type: "RETAIL", legal_name: "Draft Sub", state_code: "CA" }
              as: PlatformAdmin
              captures: { ds_acct: $.data.id }
            - call: "POST /dmv/transactions"
              payload: { account_id: "${ds_acct}", transaction_type: "REGISTRATION", vin: "1HGCM82633A004352" }
              as: IntakeClerk
              captures: { ds_txn: $.data.id }
            - call: "POST /dmv/documents"
              payload: { transaction_id: "${ds_txn}", checklist_code: "ID_PROOF", file_ref: "f1" }
              as: IntakeClerk
              captures: { ds_d1: $.data.id }
            - call: "POST /dmv/documents"
              payload: { transaction_id: "${ds_txn}", checklist_code: "INSURANCE", file_ref: "f2" }
              as: IntakeClerk
              captures: { ds_d2: $.data.id }
            - call: "POST /dmv/documents/${ds_d1}/verify"
              payload: { decision: "VERIFIED" }
              as: IntakeClerk
            - call: "POST /dmv/documents/${ds_d2}/verify"
              payload: { decision: "VERIFIED" }
              as: IntakeClerk
            - call: "POST /dmv/transactions/${ds_txn}/verify-documents"
              payload: {}
              as: IntakeClerk
          trigger:
            - call: "POST /dmv/transactions/${ds_txn}/submit"
              payload: {}
              as: IntakeClerk
              captures: { ds_err: $.data.error_id }
          assert:
            - "response status == 409 and error_id == ERR_INVALID_STATE (DRAFT is not a valid from-state for submit)"

      - name: cancel_from_cancelled_terminal_lockdown_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Transaction.DRAFT_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A Transaction already CANCELLED is terminal; a second cancel returns 409 ERR_INVALID_STATE with no side effects."
        test_recipe:
          setup: ["A RETAIL account with a DRAFT REGISTRATION Transaction cancelled once."]
          setup_api_calls:
            - call: "POST /dmv/fee-schedules"
              payload: { state_code: "CA", title_fee_cents: 2000, registration_fee_cents: 8500, transfer_fee_cents: 1500, lien_recording_fee_cents: 1000, use_tax_rate_bps: 625, trade_in_credit_allowed: true }
              as: PlatformAdmin
            - call: "POST /dmv/accounts"
              payload: { account_type: "RETAIL", legal_name: "Term Cust", state_code: "CA" }
              as: PlatformAdmin
              captures: { tm_acct: $.data.id }
            - call: "POST /dmv/transactions"
              payload: { account_id: "${tm_acct}", transaction_type: "REGISTRATION", vin: "1HGCM82633A004352" }
              as: IntakeClerk
              captures: { tm_txn: $.data.id }
            - call: "POST /dmv/transactions/${tm_txn}/cancel"
              payload: {}
              as: AccountHolder
              as_user_id: "${tm_acct}"
          trigger:
            - call: "POST /dmv/transactions/${tm_txn}/cancel"
              payload: {}
              as: AccountHolder
              as_user_id: "${tm_acct}"
              captures: { tm_err: $.data.error_id }
          assert:
            - "response status == 409 and error_id == ERR_INVALID_STATE (CANCELLED is terminal)"

      - name: new_transaction_starts_in_draft_collecting
        claim_type: initial_state
        grounds: [state_machines.Transaction, entities.Transaction.fields.lifecycle_status, entities.Transaction.fields.document_status]
        distinguishing_aspect: "A freshly created Transaction starts lifecycle_status==DRAFT and document_status==COLLECTING (both parallel dimensions at initial states)."
        test_recipe:
          setup: ["A CA account exists."]
          setup_api_calls:
            - call: "POST /dmv/accounts"
              payload: { account_type: "RETAIL", legal_name: "Init Cust", state_code: "CA" }
              as: PlatformAdmin
              captures: { in_acct: $.data.id }
          trigger:
            - call: "POST /dmv/transactions"
              payload: { account_id: "${in_acct}", transaction_type: "REGISTRATION", vin: "1HGCM82633A004352" }
              as: IntakeClerk
              captures: { in_txn: $.data.id }
          assert:
            - "Transaction.${in_txn}.lifecycle_status == DRAFT and document_status == COLLECTING"

      - name: verify_documents_idempotent_same_set_same_status
        claim_type: idempotency
        grounds: [state_machines.Transaction.COLLECTING_to_INCOMPLETE]
        distinguishing_aspect: "verify-documents is idempotent on outcome: with a missing required doc, two consecutive calls both leave document_status==INCOMPLETE."
        test_recipe:
          setup: ["A REGISTRATION Transaction with only ID_PROOF uploaded+verified (INSURANCE still missing)."]
          setup_api_calls:
            - call: "POST /dmv/accounts"
              payload: { account_type: "RETAIL", legal_name: "Idem Cust", state_code: "CA" }
              as: PlatformAdmin
              captures: { id_acct: $.data.id }
            - call: "POST /dmv/transactions"
              payload: { account_id: "${id_acct}", transaction_type: "REGISTRATION", vin: "1HGCM82633A004352" }
              as: IntakeClerk
              captures: { id_txn: $.data.id }
            - call: "POST /dmv/documents"
              payload: { transaction_id: "${id_txn}", checklist_code: "ID_PROOF", file_ref: "f1" }
              as: IntakeClerk
              captures: { id_d1: $.data.id }
            - call: "POST /dmv/documents/${id_d1}/verify"
              payload: { decision: "VERIFIED" }
              as: IntakeClerk
            - call: "POST /dmv/transactions/${id_txn}/verify-documents"
              payload: {}
              as: IntakeClerk
          trigger:
            - call: "POST /dmv/transactions/${id_txn}/verify-documents"
              payload: {}
              as: IntakeClerk
              captures: { id_status: $.data.document_status }
          assert:
            - "Transaction.${id_txn}.document_status == INCOMPLETE after both calls (INSURANCE missing)"

      - name: document_reject_then_reset_cycle
        claim_type: valid_transition
        grounds: [state_machines.DocumentItem.PENDING_to_REJECTED, state_machines.DocumentItem.REJECTED_to_PENDING]
        distinguishing_aspect: "A DocumentItem moves PENDING->REJECTED then REJECTED->PENDING (RESET); doc_status reflects each transition."
        test_recipe:
          setup: ["A REGISTRATION Transaction with one PENDING ID_PROOF document."]
          setup_api_calls:
            - call: "POST /dmv/accounts"
              payload: { account_type: "RETAIL", legal_name: "Doc Cust", state_code: "CA" }
              as: PlatformAdmin
              captures: { dz_acct: $.data.id }
            - call: "POST /dmv/transactions"
              payload: { account_id: "${dz_acct}", transaction_type: "REGISTRATION", vin: "1HGCM82633A004352" }
              as: IntakeClerk
              captures: { dz_txn: $.data.id }
            - call: "POST /dmv/documents"
              payload: { transaction_id: "${dz_txn}", checklist_code: "ID_PROOF", file_ref: "f1" }
              as: IntakeClerk
              captures: { dz_d1: $.data.id }
            - call: "POST /dmv/documents/${dz_d1}/verify"
              payload: { decision: "REJECTED" }
              as: IntakeClerk
          trigger:
            - call: "POST /dmv/documents/${dz_d1}/verify"
              payload: { decision: "RESET" }
              as: IntakeClerk
              captures: { dz_status: $.data.doc_status }
          assert:
            - "DocumentItem.${dz_d1}.doc_status == PENDING (RESET from REJECTED)"

      - name: transaction_rework_cycle_covered_by_difficulty
        claim_type: valid_transition
        grounds: [state_machines.Transaction.REJECTED_to_SUBMITTED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / transaction_rework_cycle_rejected_back_to_submitted
          rationale: "The REJECTED->SUBMITTED rework edge is exercised by the named §1.8 cyclic-machine instance."

      - name: complete_settle_cascade_covered_by_difficulty
        claim_type: side_effect_execution
        grounds: [state_machines.Transaction.APPROVED_to_COMPLETED]
        excluded_because:
          difficulty_instance: transitive_cascade / complete_settles_quote_then_balance_then_suspends_account_depth3
          rationale: "Completion's settle->balance->suspend side-effect chain is fully asserted by the named §1.8 cascade instance."

  # =====================================================================
  # From Table 3 — Calculations
  # =====================================================================
  - section: calculations
    instances:
      - name: lien_quote_state_fee_includes_lien_recording
        claim_type: correct_result
        grounds: [calculations.fee_quote_estimate, entities.FeeSchedule.fields.lien_recording_fee_cents]
        distinguishing_aspect: "A LIEN transaction quote has state_fees_cents == lien_recording_fee_cents (1000), tax 0, service 4500 -> total 5500 for a non-fleet account at rejection_round 0."
        test_recipe:
          setup: ["CA FeeSchedule lien_recording 1000; RETAIL account; a LIEN Transaction in DRAFT."]
          setup_api_calls:
            - call: "POST /dmv/fee-schedules"
              payload: { state_code: "CA", title_fee_cents: 2000, registration_fee_cents: 8500, transfer_fee_cents: 1500, lien_recording_fee_cents: 1000, use_tax_rate_bps: 625, trade_in_credit_allowed: true }
              as: PlatformAdmin
            - call: "POST /dmv/accounts"
              payload: { account_type: "RETAIL", legal_name: "Lien Quote", state_code: "CA" }
              as: PlatformAdmin
              captures: { lq_acct: $.data.id }
            - call: "POST /dmv/transactions"
              payload: { account_id: "${lq_acct}", transaction_type: "LIEN", vin: "1HGCM82633A004352", declared_price_cents: 0 }
              as: IntakeClerk
              captures: { lq_txn: $.data.id, lq_v0: $.data.version }
          trigger:
            - call: "POST /dmv/transactions/${lq_txn}/quote"
              payload: { expected_transaction_version: "${lq_v0}" }
              as: FeeAnalyst
              captures: { lq_total: $.data.total_cents }
          assert:
            - "FeeQuote.state_fees_cents == 1000 and tax_cents == 0 and service_fee_cents == 4500 and total_cents == 5500"

      - name: tax_rounds_half_up_on_fractional_cent
        claim_type: precision
        grounds: [calculations.fee_quote_estimate, entities.FeeSchedule.fields.use_tax_rate_bps]
        distinguishing_aspect: "Tax line round_half_up: a TITLE with declared_price_cents==120 at 625 bps gives 7.5 -> rounds to 8 cents."
        test_recipe:
          setup: ["CA FeeSchedule use_tax 625; RETAIL account; TITLE Transaction declared 120, no trade."]
          setup_api_calls:
            - call: "POST /dmv/fee-schedules"
              payload: { state_code: "CA", title_fee_cents: 2000, registration_fee_cents: 8500, transfer_fee_cents: 1500, lien_recording_fee_cents: 1000, use_tax_rate_bps: 625, trade_in_credit_allowed: true }
              as: PlatformAdmin
            - call: "POST /dmv/accounts"
              payload: { account_type: "RETAIL", legal_name: "Round Cust", state_code: "CA" }
              as: PlatformAdmin
              captures: { rn_acct: $.data.id }
            - call: "POST /dmv/transactions"
              payload: { account_id: "${rn_acct}", transaction_type: "TITLE", vin: "1HGCM82633A004352", declared_price_cents: 120, trade_in_allowance_cents: 0 }
              as: IntakeClerk
              captures: { rn_txn: $.data.id, rn_v0: $.data.version }
          trigger:
            - call: "POST /dmv/transactions/${rn_txn}/quote"
              payload: { expected_transaction_version: "${rn_v0}" }
              as: FeeAnalyst
              captures: { rn_tax: $.data.tax_cents }
          assert:
            - "FeeQuote.tax_cents == 8 (round_half_up of 7.5)"
            - "FeeQuote.total_cents == 6508 (8 tax + 2000 title + 4500 service)"

      - name: tradein_not_credited_when_schedule_disallows
        claim_type: constants_applied
        grounds: [calculations.fee_quote_estimate, entities.FeeSchedule.fields.trade_in_credit_allowed]
        distinguishing_aspect: "When trade_in_credit_allowed==false the taxable base is the full declared_price_cents: TRANSFER declared 1000000 trade 400000 at 625 bps taxes the full 1000000 -> tax 62500."
        test_recipe:
          setup: ["A TX schedule with trade_in_credit_allowed=false; RETAIL TX account; TRANSFER declared 1000000 trade 400000."]
          setup_api_calls:
            - call: "POST /dmv/fee-schedules"
              payload: { state_code: "TX", title_fee_cents: 2000, registration_fee_cents: 8500, transfer_fee_cents: 1500, lien_recording_fee_cents: 1000, use_tax_rate_bps: 625, trade_in_credit_allowed: false }
              as: PlatformAdmin
            - call: "POST /dmv/accounts"
              payload: { account_type: "RETAIL", legal_name: "NoTradeIn", state_code: "TX" }
              as: PlatformAdmin
              captures: { nt_acct: $.data.id }
            - call: "POST /dmv/transactions"
              payload: { account_id: "${nt_acct}", transaction_type: "TRANSFER", vin: "1HGCM82633A004352", declared_price_cents: 1000000, trade_in_allowance_cents: 400000 }
              as: IntakeClerk
              captures: { nt_txn: $.data.id, nt_v0: $.data.version }
          trigger:
            - call: "POST /dmv/transactions/${nt_txn}/quote"
              payload: { expected_transaction_version: "${nt_v0}" }
              as: FeeAnalyst
              captures: { nt_tax: $.data.tax_cents }
          assert:
            - "FeeQuote.tax_cents == 62500 (full 1000000 base, trade-in not credited)"
            - "FeeQuote.total_cents == 64000 (62500 tax + 1500 transfer + 4500 service)"

      - name: estimate_vs_final_divergence_covered_by_difficulty
        claim_type: variant_divergence
        grounds: [calculations.fee_quote_final]
        excluded_because:
          difficulty_instance: dual_variant_calc / feequote_estimate_vs_final_diverge_on_schedule_republish
          rationale: "ESTIMATE-vs-FINAL divergence is the subject of the named §1.8 dual-variant instance."

      - name: fleet_tier_boundary_covered_by_difficulty
        claim_type: constants_applied
        grounds: [calculations.fleet_volume_discount]
        excluded_because:
          difficulty_instance: boundary_precision_check / fleet_tier_boundary_ytd_5_inclusive_on_quote
          rationale: "The >=5 tier boundary is asserted by the named §1.8 boundary instance."

  # =====================================================================
  # From Table 4 — Validations
  # =====================================================================
  - section: validations
    instances:
      - name: submit_with_incomplete_documents_returns_documents_incomplete
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_DOCUMENTS_INCOMPLETE]"]
        distinguishing_aspect: "Submitting a QUOTED transaction whose document_status is INCOMPLETE returns 409 ERR_DOCUMENTS_INCOMPLETE."
        test_recipe:
          setup: ["CA FeeSchedule; RETAIL account; a REGISTRATION quoted while only ID_PROOF is verified (INSURANCE missing)."]
