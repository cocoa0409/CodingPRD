  # ===================================================================== #
  # RULE 8 — resource_temporal_overlap                                    #
  # Resource 1: ProcessingBay, HALF-OPEN [start, end) pairwise occupation. #
  # Resource 2: SecondaryMarketChannel, CLOSED [start, end] aggregate cap. #
  # ===================================================================== #
  - rule_id: resource_temporal_overlap
    instances:
      - name: quarantine_bay_half_open_windows_admit_touching_ends
        grounds:
          - validations[priority 55 ERR_BAY_WINDOW_CONFLICT]
          - entities.ProcessingBay
          - entities.ReturnLine.fields.quarantine_start_at
          - endpoints[POST /return-lines/{return_line_id}/quarantine]
          - errors.ERR_BAY_WINDOW_CONFLICT
        distinguishing_aspect: |
          The contended resource is a ProcessingBay and its interval semantics are HALF-OPEN
          [start, end): the 12:00-16:00 occupation is admitted against an existing 08:00-12:00 one
          because touching endpoints do NOT collide, while an 11:59 start is refused. The check is
          also strictly PAIRWISE — one conflicting neighbour is enough, with no counting involved.
          The channel instance contends a SecondaryMarketChannel over CLOSED [start, end] windows
          where touching endpoints DO collide and admission is an aggregate count against a capacity.
        test_recipe:
          setup:
            - "Client CLHAZ with default rules; CatalogItem CELL-1 with hazard_class LITHIUM_BATTERY (so quarantine is applicable under priority 46 and mandatory before grading under priority 33), declared_value_cents 20000, unit_weight_grams 1200."
            - "ProcessingBay HZ1 of bay_type HAZMAT with buffer_minutes 0 — the buffer rule is a GENERAL-bay refurb rule and must not leak into quarantine occupations."
            - "One RMA with THREE authorized lines of CELL-1 (quantity 1 each), all scanned on one receipt weighing exactly 200 + 1200 * 3 == 3800 grams, so all three lines sit in RECEIVED_UNGRADED."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Hazmat Client", client_code: "CLHAZ", service_level: "SL_STANDARD", inventory_ownership: "CLIENT_OWNED", restock_grade_floor: "A", refund_hold_hours: 48, liquidation_floor_pct: 0.30, fraud_tolerance_cents: 100000000, donation_allowed: false, destroy_requires_dual_signoff: false, max_refund_exposure_cents: 100000000 }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { c_id: $.data.id }
            - call: "POST /catalog-items"
              payload: { client_id: "${c_id}", sku: "CELL-1", description: "Lithium cell pack", declared_value_cents: 20000, unit_weight_grams: 1200, serialized: false, refurb_eligible: false, secondary_market_floor_cents: 1000, hazard_class: "LITHIUM_BATTERY", regulated_flag: false }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { item_id: $.data.id }
            - call: "POST /processing-bays"
              payload: { bay_code: "HZ1", bay_type: "HAZMAT", buffer_minutes: 0 }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { bay_id: $.data.id }
            - call: "POST /return-authorizations"
              payload: { client_id: "${c_id}", order_reference: "ORD-1019", customer_reference: "CUST-19", order_placed_at: "2026-07-25T00:00:00Z", expires_at: "2026-09-01T00:00:00Z" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rma_id: $.data.id }
            - call: "POST /return-authorizations/${rma_id}/lines"
              payload: { catalog_item_id: "${item_id}", authorized_quantity: 1, reason_code: "DEFECTIVE" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rl_1: $.data.id }
            - call: "POST /return-authorizations/${rma_id}/lines"
              payload: { catalog_item_id: "${item_id}", authorized_quantity: 1, reason_code: "DEFECTIVE" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rl_2: $.data.id }
            - call: "POST /return-authorizations/${rma_id}/lines"
              payload: { catalog_item_id: "${item_id}", authorized_quantity: 1, reason_code: "DEFECTIVE" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rl_3: $.data.id }
            - call: "POST /return-authorizations/${rma_id}/issue"
              payload: {}
              as: CenterAdmin
              as_user_id: "u_admin"
            - call: "POST /receipts"
              payload: { rma_id: "${rma_id}", tracking_reference: "TRK-19", gross_weight_grams: 3800 }
              as: ReceivingClerk
              as_user_id: "u_clerk"
              captures: { rcpt_id: $.data.id }
            - call: "POST /receipts/${rcpt_id}/lines"
              payload: { rma_line_id: "${rl_1}", quantity: 1, reason_code: "DEFECTIVE" }
              as: ReceivingClerk
              as_user_id: "u_clerk"
              captures: { line_1: $.data.id }
            - call: "POST /receipts/${rcpt_id}/lines"
              payload: { rma_line_id: "${rl_2}", quantity: 1, reason_code: "DEFECTIVE" }
              as: ReceivingClerk
              as_user_id: "u_clerk"
              captures: { line_2: $.data.id }
            - call: "POST /receipts/${rcpt_id}/lines"
              payload: { rma_line_id: "${rl_3}", quantity: 1, reason_code: "DEFECTIVE" }
              as: ReceivingClerk
              as_user_id: "u_clerk"
              captures: { line_3: $.data.id }
          trigger:
            - call: "POST /return-lines/${line_1}/quarantine"
              payload: { bay_id: "${bay_id}", quarantine_start_at: "2026-08-01T08:00:00Z", quarantine_end_at: "2026-08-01T12:00:00Z" }
              as: GradingInspector
              as_user_id: "u_grader"
            - call: "POST /return-lines/${line_2}/quarantine"
              payload: { bay_id: "${bay_id}", quarantine_start_at: "2026-08-01T12:00:00Z", quarantine_end_at: "2026-08-01T16:00:00Z" }
              as: GradingInspector
              as_user_id: "u_grader"
            - call: "POST /return-lines/${line_3}/quarantine"
              payload: { bay_id: "${bay_id}", quarantine_start_at: "2026-08-01T11:59:00Z", quarantine_end_at: "2026-08-01T15:00:00Z" }
              as: GradingInspector
              as_user_id: "u_grader"
          assert:
            - "Line 1 (08:00-12:00) returns 200 with disposition_state QUARANTINED, bay_id ${bay_id} stamped"
            - "Line 2 (12:00-16:00) returns 200 and is also QUARANTINED — 12:00 < 12:00 is false, so a window starting exactly when another ends does not collide under [start, end) semantics"
            - "Line 3 (11:59-15:00) returns 409 ERR_BAY_WINDOW_CONFLICT — 11:59 < 12:00 and 08:00 < 15:00 both hold against line 1's occupation, one minute of overlap being sufficient"
            - "After the rejection ReturnLine.${line_3}.disposition_state is still RECEIVED_UNGRADED with bay_id, quarantine_start_at and quarantine_end_at all null — no partial reservation is left behind"
            - "Line 3 conflicts with line 1 only; the pairwise rule does not tally occupations, so a bay with two admitted windows still rejects a third that overlaps either one"

      - name: channel_lot_windows_closed_endpoints_overlap_and_capacity_counts_the_new_order
        grounds:
          - validations[priority 57 ERR_CHANNEL_WINDOW_CAPACITY_EXCEEDED]
          - entities.SecondaryMarketChannel.fields.concurrent_lot_capacity
          - entities.DispositionOrder.fields.channel_window_start_at
          - endpoints[POST /disposition-orders]
          - errors.ERR_CHANNEL_WINDOW_CAPACITY_EXCEEDED
        distinguishing_aspect: |
          The contended resource is a SecondaryMarketChannel and its interval semantics are CLOSED
          [start, end]: the 12:00-16:00 order overlaps the existing 08:00-12:00 one at the shared
          endpoint, which is exactly the case the bay instance admits. Admission is also an AGGREGATE
          formula that counts the order being created (1 + COUNT(overlapping PROPOSED|APPROVED) <=
          concurrent_lot_capacity), so each existing order is individually fine while the third
          request tips the collection over the capacity of 2.
        test_recipe:
          setup:
            - "Client CLLOT with default rules and CatalogItem WIDGET-1 (declared_value_cents 20000, unit_weight_grams 1200); restock_grade_floor A and liquidation_floor_pct 0.30 route grade C to LIQUIDATE."
            - "An AUCTION channel with concurrent_lot_capacity 2, fee_pct 0.12, accepted_grades A/B/C/D, min_lot_value_cents 0."
            - "One RMA with THREE authorized lines (quantity 1 each, reason DEFECTIVE) received on one receipt weighing exactly 3800 grams and all graded C, so all three carry disposition LIQUIDATE and provisional recovery 7200."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Lot Window Client", client_code: "CLLOT", service_level: "SL_STANDARD", inventory_ownership: "CLIENT_OWNED", restock_grade_floor: "A", refund_hold_hours: 48, liquidation_floor_pct: 0.30, fraud_tolerance_cents: 100000000, donation_allowed: false, destroy_requires_dual_signoff: false, max_refund_exposure_cents: 100000000 }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { c_id: $.data.id }
            - call: "POST /catalog-items"
              payload: { client_id: "${c_id}", sku: "WIDGET-1", description: "Standard widget", declared_value_cents: 20000, unit_weight_grams: 1200, serialized: false, refurb_eligible: false, secondary_market_floor_cents: 1000, hazard_class: "NONE", regulated_flag: false }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { item_id: $.data.id }
            - call: "POST /secondary-market-channels"
              payload: { name: "Two Lot Auction", channel_code: "AUC2", channel_type: "AUCTION", accepted_grades: ["A", "B", "C", "D"], fee_pct: 0.12, hazard_certified: false, recall_certified: false, min_lot_value_cents: 0, concurrent_lot_capacity: 2 }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { ch_id: $.data.id }
            - call: "POST /return-authorizations"
