          - validations[priority=702]
          - errors[ERR_CHAMBER_CAPACITY_EXCEEDED]
          - entities.SaltSprayChamber.fields.coupon_capacity
        distinguishing_aspect: |
          SaltSprayChamber has completely different interval semantics from the
          furnace: occupancy is ADDITIVE up to coupon_capacity 24 rather than
          exclusive, there is NO buffer at all, and half-open intervals mean a run
          starting exactly when another ends never conflicts. Overlapping runs of
          10 and 8 coupons coexist; a third run of 7 is refused at peak 25 while a
          third run of 6 is accepted at peak exactly 24.
