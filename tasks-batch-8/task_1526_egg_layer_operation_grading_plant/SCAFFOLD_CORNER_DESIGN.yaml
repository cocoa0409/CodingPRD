          assert:
            - "exactly one lot created: dozen_count == 20 (floor(250/12))"
            - "Flock.${flock_id}.loose_egg_pool == 10 and ungraded_egg_pool == 0"
      - name: fcr_switches_to_size_weighted_mass_after_confirm
        claim_type: constants_applied
        grounds: [calculations.feed_conversion_ratio]
        distinguishing_aspect: "FCR uses the 60 g default only until a confirmed run exists; with a confirmed all-LARGE run the size-weighted 63 g applies: 120 kg feed over 240 eggs -> 120 / (240 x 63 / 1000) = 7.937 (the default-weight value would be 8.333)."
