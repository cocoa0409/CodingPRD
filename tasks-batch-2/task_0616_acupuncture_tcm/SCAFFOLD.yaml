    path: "/intakes/{id}/finalize"
    description: "Finalize an intake; flips Patient.intake_status to INTAKE_COMPLETE"
    roles: [Practitioner]
    code: 200
    input: []
    output: Intake
    side_effects: ["Intake.status=FINALIZED; Patient.intake_status=INTAKE_COMPLETE; Patient.version+1; Intake.version+1"]

  # ---- TreatmentPlan (flat; patient_id/practitioner_id/intake_id in body / filters) ----
  - method: POST
    path: "/treatment-plans"
    description: "Create a treatment plan / point prescription from a finalized intake"
    roles: [Practitioner]
    code: 201
    input: [patient_id, practitioner_id, intake_id, acupoints, planned_sessions]
    output: TreatmentPlan
    side_effects: ["status=ACTIVE; version=1"]

  - method: GET
    path: "/treatment-plans"
    description: "List treatment plans; filter by patient_id / practitioner_id / intake_id (reverse-reachability for all three FKs)"
    roles: [ClinicAdmin, Practitioner, Patient]
    code: 200
    input: ["patient_id?", "practitioner_id?", "intake_id?", "limit?", "offset?"]
    output: "TreatmentPlan[]"
    side_effects: []

  - method: GET
    path: "/treatment-plans/{id}"
    description: "Get a treatment plan"
    roles: [ClinicAdmin, Practitioner, Patient]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects: []

  - method: POST
    path: "/treatment-plans/{id}/hold"
    description: "Put an ACTIVE plan ON_HOLD (revision loop)"
    roles: [Practitioner]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects: ["status ACTIVE->ON_HOLD; version+1"]

  - method: POST
    path: "/treatment-plans/{id}/resume"
    description: "Resume an ON_HOLD plan to ACTIVE (revision loop)"
    roles: [Practitioner]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects: ["status ON_HOLD->ACTIVE; version+1"]

  - method: POST
    path: "/treatment-plans/{id}/complete"
    description: "Complete an ACTIVE plan"
    roles: [Practitioner]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects: ["status ACTIVE->COMPLETED; version+1"]

  - method: POST
    path: "/treatment-plans/{id}/cancel"
    description: "Cancel a plan; cascades to cancel open appointments (depth>=3 chain). OCC on plan version."
    roles: [Practitioner]
    code: 200
    input: [expected_treatment_plan_version]
    output: TreatmentPlan
    side_effects: ["status->CANCELLED; cascade-cancels SCHEDULED/CHECKED_IN appointments; version+1"]

  # ---- PackageSeries (flat; patient_id in body / filter) ----
  - method: POST
    path: "/package-series"
    description: "Purchase a package series (credit bundle)"
    roles: [ClinicAdmin]
    code: 201
    input: [patient_id, total_credits, price_paid_cents]
    output: PackageSeries
    side_effects: ["status=ACTIVE; reserved=0; consumed=0; provisional_remaining=total; finalized_remaining=total; version=1"]

  - method: GET
    path: "/package-series"
    description: "List package series; filter by patient_id (reverse-reachability for PackageSeries.patient_id)"
    roles: [ClinicAdmin, Practitioner, Patient]
    code: 200
    input: ["patient_id?", "limit?", "offset?"]
    output: "PackageSeries[]"
    side_effects: []

  - method: GET
    path: "/package-series/{id}"
    description: "Get a package series"
    roles: [ClinicAdmin, Practitioner, Patient]
    code: 200
    input: []
    output: PackageSeries
    side_effects: []

  - method: POST
    path: "/package-series/{id}/cancel"
    description: "Cancel an unused package series"
    roles: [ClinicAdmin]
    code: 200
    input: []
    output: PackageSeries
    side_effects: ["status->CANCELLED; version+1"]

  # ---- Appointment (flat; FKs in body / filters) ----
  - method: POST
    path: "/appointments"
    description: "Book an appointment (room/table + practitioner + plan; OCC on plan version)"
    roles: [ClinicAdmin]
    code: 201
    input: [patient_id, treatment_plan_id, practitioner_id, room_id, "package_series_id?", "charge_source?", scheduled_start, scheduled_end, base_fee_cents, expected_treatment_plan_version]
    output: Appointment
    side_effects:
      - "clinical_status=SCHEDULED; billing_status=UNBILLED"
      - "If charge_source==PACKAGE: PackageSeries.reserved_credits+1; provisional balance recomputed; EXHAUSTED auto-eval; PackageSeries.version+1"
      - "increments TreatmentPlan.version by 1"
      - "Appointment.version=1"

  - method: GET
    path: "/appointments"
    description: "List appointments; filter by patient_id / treatment_plan_id / practitioner_id / room_id / package_series_id (reverse-reachability for all five FKs)"
    roles: [ClinicAdmin, Practitioner, Patient]
    code: 200
    input: ["patient_id?", "treatment_plan_id?", "practitioner_id?", "room_id?", "package_series_id?", "limit?", "offset?"]
    output: "Appointment[]"
    side_effects: []

  - method: GET
    path: "/appointments/{id}"
    description: "Get an appointment"
    roles: [ClinicAdmin, Practitioner, Patient]
    code: 200
    input: []
    output: Appointment
    side_effects: []

  - method: POST
    path: "/appointments/{id}/addons"
    description: "Attach a cupping/moxa add-on to a SCHEDULED/CHECKED_IN appointment"
    roles: [ClinicAdmin, Practitioner]
    code: 201
    input: [modality, fee_cents]
    output: AddOn
    side_effects: ["status=ATTACHED; Appointment.version+1"]

  - method: POST
    path: "/appointments/{id}/check-in"
    description: "Check in a scheduled appointment (computes arrival_class)"
    roles: [ClinicAdmin]
    code: 200
    input: []
    output: Appointment
    side_effects: ["clinical_status SCHEDULED->CHECKED_IN; checked_in_at set; arrival_class computed; version+1"]

  - method: POST
    path: "/appointments/{id}/complete"
    description: "Complete a checked-in appointment; produces Charge or Superbill, or consumes package credit"
    roles: [Practitioner]
    code: 200
    input: []
    output: Appointment
    side_effects:
      - "clinical_status CHECKED_IN->COMPLETED; billing_status->BILLED"
      - "PER_VISIT+CASH: Charge created (visit_charge cash variant)"
      - "PER_VISIT+INSURANCE: Superbill created (superbill_reconciliation)"
      - "PACKAGE: reserved-1, consumed+1; balances recomputed; PackageSeries.version+1"
      - "Appointment.version+1"

  - method: POST
    path: "/appointments/{id}/no-show"
    description: "Mark a scheduled appointment as no-show; evaluates penalty, releases package credit"
    roles: [ClinicAdmin]
    code: 200
    input: []
    output: Appointment
    side_effects:
      - "clinical_status SCHEDULED->NO_SHOW; Patient.strike_count+1; Patient.version+1"
      - "no_show_penalty evaluated; PENALTY Charge if >0 (billing_status->PENALTY_DUE) else billing_status->WAIVED"
      - "PACKAGE: reserved-1 (credit released, not consumed); balances recomputed; PackageSeries.version+1"
      - "ATTACHED AddOns->VOIDED; Appointment.version+1"

  - method: POST
    path: "/appointments/{id}/cancel"
    description: "Cancel a scheduled/checked-in appointment; cascades to package credit release"
    roles: [ClinicAdmin]
    code: 200
    input: []
    output: Appointment
    side_effects:
      - "clinical_status->CANCELLED; ATTACHED AddOns->VOIDED; OPEN Charge/ISSUED Superbill->VOID (billing_status->WAIVED)"
      - "PACKAGE: reserved-1; provisional balance recomputed; PackageSeries EXHAUSTED->ACTIVE auto-eval; PackageSeries.version+1"
      - "Within LATE_CANCEL_CUTOFF: Patient.strike_count+1, late-cancel PENALTY Charge possible"
      - "Appointment.version+1"

  # ---- AddOn (flat; appointment_id filter — reverse-reachability for AddOn.appointment_id) ----
  - method: GET
    path: "/addons"
    description: "List add-ons; filter by appointment_id (reverse-reachability for AddOn.appointment_id)"
    roles: [ClinicAdmin, Practitioner, Patient]
    code: 200
    input: ["appointment_id?", "limit?", "offset?"]
    output: "AddOn[]"
    side_effects: []

  - method: GET
    path: "/addons/{id}"
    description: "Get an add-on"
    roles: [ClinicAdmin, Practitioner, Patient]
    code: 200
    input: []
    output: AddOn
    side_effects: []

  # ---- Charge (flat; appointment_id filter — reverse-reachability for Charge.appointment_id) ----
  - method: GET
    path: "/charges"
    description: "List charges (VISIT and PENALTY); filter by appointment_id (reverse-reachability for Charge.appointment_id)"
    roles: [ClinicAdmin, Practitioner, Patient]
    code: 200
    input: ["appointment_id?", "limit?", "offset?"]
    output: "Charge[]"
    side_effects: []

  - method: GET
    path: "/charges/{id}"
    description: "Get a charge"
    roles: [ClinicAdmin, Practitioner, Patient]
    code: 200
    input: []
    output: Charge
    side_effects: []

  # ---- Superbill (flat; appointment_id filter — reverse-reachability for Superbill.appointment_id) ----
  - method: GET
    path: "/superbills"
    description: "List superbills; filter by appointment_id (reverse-reachability for Superbill.appointment_id)"
    roles: [ClinicAdmin, Practitioner, Patient]
    code: 200
    input: ["appointment_id?", "limit?", "offset?"]
    output: "Superbill[]"
    side_effects: []

  - method: GET
    path: "/superbills/{id}"
    description: "Get a superbill"
    roles: [ClinicAdmin, Practitioner, Patient]
    code: 200
    input: []
    output: Superbill
    side_effects: []

  # ---- FormulaDispense (flat; patient_id/treatment_plan_id/herbal_formula_id in body / filters) ----
  - method: POST
    path: "/dispenses"
    description: "Request a herbal-formula dispense against an ACTIVE plan (OCC on plan version)"
    roles: [Pharmacist, Practitioner]
    code: 201
    input: [patient_id, treatment_plan_id, herbal_formula_id, doses, expected_treatment_plan_version]
    output: FormulaDispense
    side_effects: ["status=REQUESTED; increments TreatmentPlan.version by 1; version=1"]

  - method: GET
    path: "/dispenses"
    description: "List dispenses; filter by patient_id / treatment_plan_id / herbal_formula_id (reverse-reachability for all three FKs)"
    roles: [Pharmacist, Practitioner, ClinicAdmin, Patient]
    code: 200
    input: ["patient_id?", "treatment_plan_id?", "herbal_formula_id?", "limit?", "offset?"]
    output: "FormulaDispense[]"
    side_effects: []

  - method: GET
    path: "/dispenses/{id}"
    description: "Get a dispense"
    roles: [Pharmacist, Practitioner, ClinicAdmin, Patient]
    code: 200
    input: []
    output: FormulaDispense
    side_effects: []

  - method: POST
    path: "/dispenses/{id}/fill"
    description: "Fill a requested dispense; debits inventory (depth>=3 chain to LOW_STOCK)"
    roles: [Pharmacist]
    code: 200
    input: []
    output: FormulaDispense
    side_effects: ["status REQUESTED->FILLED; HerbItem.on_hand_grams debited; LOW_STOCK auto-flag; HerbItem.version+1; version+1"]

  - method: POST
    path: "/dispenses/{id}/reverse"
    description: "Reverse a filled dispense; restores inventory (compensating, OCC on dispense version)"
    roles: [Pharmacist]
    code: 200
    input: [expected_formula_dispense_version]
    output: FormulaDispense
    side_effects: ["status FILLED->REVERSED; HerbItem.on_hand_grams restored; IN_STOCK auto-eval; HerbItem.version+1; version+1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_AUTH, http: 401, condition: "X-User-ID or X-User-Role header missing/invalid" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_OWNERSHIP_MISMATCH, http: 403, condition: "entity_backed actor's X-User-ID does not match the owning entity id" }
  # --- not found ---
  - { id: ERR_PATIENT_NOT_FOUND, http: 404, condition: "Patient id not found" }
  - { id: ERR_INTAKE_NOT_FOUND, http: 404, condition: "Intake id not found" }
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "TreatmentPlan id not found" }
  - { id: ERR_PACKAGE_NOT_FOUND, http: 404, condition: "PackageSeries id not found" }
  - { id: ERR_APPT_NOT_FOUND, http: 404, condition: "Appointment id not found" }
  - { id: ERR_DISPENSE_NOT_FOUND, http: 404, condition: "FormulaDispense id not found" }
  - { id: ERR_PRACTITIONER_NOT_FOUND, http: 404, condition: "Practitioner id not found" }
  - { id: ERR_ROOM_NOT_FOUND, http: 404, condition: "TreatmentRoom id not found" }
  - { id: ERR_FORMULA_NOT_FOUND, http: 404, condition: "HerbalFormula id not found" }
  - { id: ERR_HERB_NOT_FOUND, http: 404, condition: "HerbItem id not found" }
  # --- request validation ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, invalid enum, scheduled_end<=scheduled_start, numeric below minimum, coinsurance_rate outside [0,1]" }
  # --- state ---
  - { id: ERR_APPT_NOT_SCHEDULED, http: 409, condition: "Operation requires appointment clinical_status==SCHEDULED" }
  - { id: ERR_APPT_NOT_CHECKED_IN, http: 409, condition: "Complete requires appointment clinical_status==CHECKED_IN" }
  - { id: ERR_APPT_NOT_CANCELLABLE, http: 409, condition: "Cancel requires clinical_status IN {SCHEDULED, CHECKED_IN}" }
  - { id: ERR_PLAN_NOT_ACTIVE, http: 409, condition: "Operation requires TreatmentPlan.status==ACTIVE" }
  - { id: ERR_PLAN_NOT_ON_HOLD, http: 409, condition: "Resume requires TreatmentPlan.status==ON_HOLD" }
  - { id: ERR_PLAN_NOT_CANCELLABLE, http: 409, condition: "Cancel requires TreatmentPlan.status IN {ACTIVE, ON_HOLD}" }
  - { id: ERR_PLAN_HAS_OPEN_APPOINTMENTS, http: 409, condition: "Complete requires no SCHEDULED/CHECKED_IN appointments on the plan" }
  - { id: ERR_INTAKE_NOT_DRAFT, http: 409, condition: "Finalize requires Intake.status==DRAFT" }
  - { id: ERR_INTAKE_INCOMPLETE, http: 409, condition: "Finalize requires tcm_pattern, tongue_finding, pulse_finding non-null" }
  - { id: ERR_DISPENSE_NOT_REQUESTED, http: 409, condition: "Fill requires FormulaDispense.status==REQUESTED" }
  - { id: ERR_DISPENSE_NOT_FILLED, http: 409, condition: "Reverse requires FormulaDispense.status==FILLED" }
  # --- business referential / cross-entity ---
  - { id: ERR_INTAKE_REQUIRED, http: 409, condition: "Booking requires Patient.intake_status==INTAKE_COMPLETE" }
  - { id: ERR_INTAKE_NOT_FINALIZED, http: 409, condition: "Plan creation requires the referenced Intake.status==FINALIZED and same patient" }
  # --- business safety / temporal / fiscal ---
  - { id: ERR_INSUFFICIENT_STOCK, http: 409, condition: "Fill requires every recipe line's HerbItem.on_hand_grams >= grams_per_dose*doses" }
  - { id: ERR_ROOM_CONFLICT, http: 409, condition: "Room interval [start,end+cleanup_buffer) overlaps an existing SCHEDULED/CHECKED_IN appointment on the same room" }
  - { id: ERR_PRACTITIONER_CONFLICT, http: 409, condition: "Practitioner gap to an existing appointment is strictly less than turnover_buffer" }
  - { id: ERR_NO_CREDITS_REMAINING, http: 409, condition: "Booking from a package requires provisional_remaining_credits>=1 and series not CANCELLED" }
  - { id: ERR_PACKAGE_HAS_CONSUMED_CREDITS, http: 409, condition: "Package cancel requires consumed_credits==0" }
  - { id: ERR_PACKAGE_HAS_RESERVED_CREDITS, http: 409, condition: "Package cancel requires reserved_credits==0" }
  # --- concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not equal current parent.version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ClinicAdmin
    description: "Front-desk / billing operator: registers patients, schedules, checks-in, no-show/cancel, packages, membership, rooms, practitioners, clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /patients — register patient"
      - "POST /patients/{id}/membership — set membership"
      - "POST /package-series — purchase package"
      - "POST /package-series/{id}/cancel — cancel package"
      - "POST /appointments — book appointment"
      - "POST /appointments/{id}/check-in — check in"
      - "POST /appointments/{id}/no-show — mark no-show"
      - "POST /appointments/{id}/cancel — cancel appointment"
      - "POST /practitioners — create practitioner"
      - "POST /rooms — create room"
      - "POST /_clock/set_current_utc — set clock"
    shared_operations:
      - "GET reads across patients, plans, packages, appointments, charges, superbills, herb-items, formulas, dispenses, rooms, practitioners"
      - "POST /appointments/{id}/addons — attach add-on (shared with Practitioner)"

  - name: Practitioner
    description: "Licensed acupuncturist: intake & TCM diagnosis, treatment plan lifecycle, appointment completion, can request dispenses."
    identity: "entity_backed:Practitioner"
    exclusive_operations:
      - "POST /intakes — create intake"
      - "POST /intakes/{id}/finalize — finalize intake"
      - "POST /treatment-plans — create plan"
      - "POST /treatment-plans/{id}/hold|resume|complete|cancel — plan lifecycle"
      - "POST /appointments/{id}/complete — complete appointment"
    shared_operations:
      - "POST /appointments/{id}/addons — attach add-on (shared with ClinicAdmin)"
      - "POST /dispenses — request dispense (shared with Pharmacist)"
      - "POST /formulas — create formula (shared with Pharmacist)"
      - "GET reads across the clinical and inventory surface"

  - name: Pharmacist
    description: "Herbal pharmacy operator: manages herb inventory, formulas, fills and reverses dispenses."
    identity: "opaque"
    exclusive_operations:
      - "POST /herb-items — create herb item"
      - "POST /dispenses/{id}/fill — fill dispense"
      - "POST /dispenses/{id}/reverse — reverse dispense"
    shared_operations:
      - "POST /dispenses — request dispense (shared with Practitioner)"
      - "POST /formulas — create formula (shared with Practitioner)"
      - "GET reads across inventory, formulas, dispenses, practitioners"

  - name: Patient
    description: "Self-service read access to own clinical and billing records."
    identity: "entity_backed:Patient"
    exclusive_operations: []
    shared_operations:
      - "GET own patient record, intakes, plans, packages, appointments, add-ons, charges, superbills, dispenses (X-User-ID must equal patientId)"
