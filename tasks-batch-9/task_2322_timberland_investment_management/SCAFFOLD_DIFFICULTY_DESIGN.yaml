          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Fund with target_cash_yield_bps 0 so the yield lock never engages."
            - "'Piney Creek Tract' with stand PC-01 cruise-closed at 4647.12 tons."
            - "One RESERVED block of 1000.00 tons for [2027-06-01, 2027-09-30], MIXED, expected price 58.00, index 1.05, haul 140 miles, so provisional net revenue is 22889.55."
