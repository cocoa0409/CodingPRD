              payload: { writer_id: "${w1_id}", window_start_date: "2026-08-03", window_end_date: "2026-08-14" }
              as: DocsLead
            - call: "POST /topics"
              payload: { plan_item_id: "${pi_id}", slug: "atlas-quotas-overview", title: "Atlas Quotas Overview" }
              as: Writer
              as_user_id: "${w1_id}"
              captures: { t_id: $.data.id }
            - call: "POST /topics/${t_id}/revisions"
              payload: { body_word_count: 1200, used_terms: ["quota"], summary: "draft 1" }
              as: Writer
              as_user_id: "${w1_id}"
            - call: "POST /topics/${t_id}/submit-review"
              payload: {}
              as: Writer
              as_user_id: "${w1_id}"
            - call: "POST /topics/${t_id}/sign-offs"
              payload: { reviewer_id: "${rv_erin_id}" }
