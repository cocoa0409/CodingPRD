        grounds:
          - "state_machines.ConsentGrant.GRANTED_to_REVOKED"
          - "calculations.energy_score_labeling"
        distinguishing_aspect: "A consent revoke on an already-VERIFIED report recomputes completeness (60.00 < 75) and suppresses the stored scores to null / INSUFFICIENT_DATA without changing the report status."
