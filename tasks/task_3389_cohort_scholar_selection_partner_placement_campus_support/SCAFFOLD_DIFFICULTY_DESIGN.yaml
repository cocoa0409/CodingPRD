            - { call: "POST /api/nominees/${nx}/decision", payload: { decision: "DROP" }, as: SelectionOfficer }
          trigger:
            - { call: "POST /api/offers", payload: { nominee_id: "${nx}", cohort_id: "${coh}" }, as: SelectionOfficer, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE (captured ${err}): the nominee state gate at priority 8 fires before the capacity gate at priority 11"
            - "HTTP status 409 (state tier), not 422 (fiscal tier)"
            - "cohort.seats_committed still 1 and offers_outstanding still 2 afterwards (no partial creation)"
      - name: nomination_window_error_beats_quota_error
        grounds:
          - validations[priority=9]
          - validations[priority=11]
          - errors[ERR_NOMINATION_WINDOW_CLOSED]
          - errors[ERR_NOMINATION_QUOTA_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair (business_temporal, business_fiscal) — different
          pair from offer_create_state_error_beats_capacity_error: the
          nomination violates the city window (now 2026-12-01 is past the
          2026-11-30 close -> ERR_NOMINATION_WINDOW_CLOSED at priority 9) AND
          the partner quota (used == quota == 1 -> ERR_NOMINATION_QUOTA_EXCEEDED
          at priority 11). The temporal error must win.
        test_recipe:
          setup:
            - "Nominating partner with quota 1 has already used it (one live nominee); logical clock advanced past the nomination window close"
          setup_api_calls:
            - { call: "POST /api/city-programs", payload: { code: "ATL", name: "Atlanta", admissions_cycle: "2027", nomination_window_opens_at: "2026-09-01T00:00:00Z", nomination_window_closes_at: "2026-11-30T23:59:59Z" }, as: ProgramAdmin, captures: { cp: $.data.id } }
