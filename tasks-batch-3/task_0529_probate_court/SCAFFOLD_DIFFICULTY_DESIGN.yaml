              as: Clerk
              captures: { rep_id: $.data.id }
            - call: "GET /estates/${est_id}"
              as: Clerk
              captures: { v1: $.data.version }
            - call: "POST /representatives/${rep_id}/appoint"
              payload: { expected_estate_version: "${v1}" }
              as: ProbateJudge
              as_user_id: "judge-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-29T00:00:00Z" }
              as: Clerk
            - call: "POST /claims"
              payload: { estate_id: "${est_id}", creditor_name: "Edge", claim_class: "GENERAL", claimed_amount_cents: 100000 }
              as: Clerk
