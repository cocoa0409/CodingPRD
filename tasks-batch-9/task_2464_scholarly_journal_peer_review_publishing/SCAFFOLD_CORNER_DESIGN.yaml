          - errors[ERR_DUPLICATE_KEY]
          - entities.Reviewer.fields.email
        distinguishing_aspect: |
          Reviewer.email is unique across the whole society database rather than per journal: a second
          reviewer with the same email but a different name, affiliation and subject area is refused
          with 409 ERR_DUPLICATE_KEY and the reviewer table still holds exactly one row.
        test_recipe:
          setup:
            - "One reviewer already exists with email rev_d@inst.org."
          setup_api_calls:
