            - { call: "POST /termination-cases/${c_fl}/begin-distributions", payload: {}, as: PlanAdministrator }
            - { call: "GET /participants/${p_flo}", payload: {}, as: PlanAdministrator, captures: { p_flo_v: "$.data.version" } }
            - { call: "GET /participants/${p_fhi}", payload: {}, as: PlanAdministrator, captures: { p_fhi_v: "$.data.version" } }
            - { call: "POST /distribution-elections", payload: { participant_id: "${p_flo}", election_method: LUMP_SUM_CHECK, expected_participant_version: "${p_flo_v}" }, as: PlanAdministrator, captures: { e_flo: "$.data.id" } }
            - { call: "POST /distribution-elections", payload: { participant_id: "${p_fhi}", election_method: LUMP_SUM_CHECK, expected_participant_version: "${p_fhi_v}" }, as: PlanAdministrator, captures: { e_fhi: "$.data.id" } }
          trigger:
            - { call: "POST /distribution-elections/${e_flo}/accept", payload: {}, as: PlanAdministrator }
            - { call: "POST /distribution-elections/${e_fhi}/accept", payload: {}, as: PlanAdministrator }
            - { call: "GET /distribution-elections/${e_flo}/payouts", payload: {}, as: PlanAdministrator, captures: { pay_flo: "$.data[0].id" } }
            - { call: "GET /distribution-elections/${e_fhi}/payouts", payload: {}, as: PlanAdministrator, captures: { pay_fhi: "$.data[0].id" } }
          assert:
