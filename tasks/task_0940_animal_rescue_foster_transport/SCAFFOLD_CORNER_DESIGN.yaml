  - section: calculations
    instances:
      - name: impound_calendar_day_versus_overnight_billable_days
        claim_type: Variant Divergence
        grounds:
          - calculations.impound_billable_days
          - calculations.impound_tiered_subtotal
          - entities.IntakeRecord.fields.impound_billing_basis
        distinguishing_aspect: "For the identical stay from 2026-05-10T09:00:00Z to 2026-05-15T14:00:00Z, CALENDAR_DAY bills 6 days for 12000 cents and a 16500-cent total, while OVERNIGHT bills 5 days for 9500 cents and a 14000-cent total."
        test_recipe:
          setup:
            - "Two owners with reclaim_history_count 0 and hardship_certified false."
            - "Animal A intaken STRAY on 2026-05-10T09:00:00Z with impound_billing_basis CALENDAR_DAY; animal B identically but with OVERNIGHT."
            - "The clock stands at 2026-05-15T14:00:00Z."
          setup_api_calls:
            - call: "POST /rescue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rescue/organizations"
              payload: { name: "Harbor Rescue", org_type: "SHELTER", state_code: "OR" }
