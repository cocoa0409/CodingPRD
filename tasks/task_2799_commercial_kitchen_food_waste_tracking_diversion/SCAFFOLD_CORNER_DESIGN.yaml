      - name: repeating_a_site_inside_a_rollup_scope_is_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=80]", "errors[ERR_DUPLICATE_SITE_IN_SCOPE]", "entities.CorporateRollup.site_ids"]
        distinguishing_aspect: "The rollup's site_ids must be pairwise distinct, because a repeated site would double-count its grams into every corporate aggregate; the check is referential rather than a plain schema check."
        test_recipe:
          setup: ["Two sites exist so the request is otherwise well formed."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T12:00:00Z" }
              as: "*"
            - call: "POST /sites"
              payload: { name: "Harbor Kitchen", site_code: "HK-01", region_code: "NE" }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { site_a_id: "$.data.id" }
            - call: "POST /sites"
              payload: { name: "Hillside Kitchen", site_code: "HK-02", region_code: "NE" }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { site_b_id: "$.data.id" }
          trigger:
            - call: "POST /corporate-rollups"
