              payload: { appliance_label: "RANGE-1", appliance_type: "RANGE", phase: "PRE", spillage_seconds: 5, co_ppm_air_free: 500.0, draft_pressure_pa: 2.5, worst_case_depressurization_pa: 8.0 }
              as: FieldTechnician
              as_user_id: "tech-x"
              captures: { v_range500: $.data.verdict }
            - call: "POST /duct-sealing/projects/${proj_id}/combustion-tests"
              payload: { appliance_label: "WH-1", appliance_type: "ATMOSPHERIC_WATER_HEATER", phase: "PRE", spillage_seconds: 5, co_ppm_air_free: 500.0, draft_pressure_pa: 2.5, worst_case_depressurization_pa: 3.0 }
              as: FieldTechnician
