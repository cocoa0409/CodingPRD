          setup:
            - "Patient with FINALIZED eval, APPROVED auth1 (LEFT_ARM, window 2026-05-01..2026-12-31), ACTIVE plan on auth1; plus a second APPROVED auth2 (RIGHT_ARM, narrow window 2026-05-01..2026-05-02) so no window overlap with auth1."
