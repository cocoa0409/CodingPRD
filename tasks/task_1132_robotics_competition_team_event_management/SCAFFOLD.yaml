scenario: |
  1132. Robotics Competition Team & Event Management (FIRST Robotics event): team registration & mentor/volunteer screening, build-season timeline & parts procurement, inspection & rules compliance check, match schedule generation & alliance selection, scoring & ranking calculation, field reset & queueing operations, awards judging & interview scheduling, travel & championship qualification

domain_name: robotics-competition
api_prefix: /frc-events

complexity_profile:
  primary_archetype: posture_driven_gating
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - ops_run_checkpoint
    - selector_policy
    - temporal_windowing
  entity_topology: hybrid
  state_machine_shape: posture_driven
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: FrcEvent
    parent: null
    common_fields: true
    fields:
      - { name: event_code, type: string, source: input, description: "Unique event code, e.g. 'PNW-2026'" , constraints: "unique across all FrcEvent rows" }
      - { name: event_name, type: string, source: input, description: "Display name" }
      - { name: season_year, type: integer, source: input, description: "Competition season year" }
      - { name: start_date, type: datetime, source: input, description: "Event start (ISO8601 UTC)" }
      - { name: end_date, type: datetime, source: input, description: "Event end (ISO8601 UTC)" }
      - { name: status, type: enum, source: system, description: "SETUP | REGISTRATION_OPEN | REGISTRATION_LOCKED | BUILD_SEASON | INSPECTION | MATCHES_RUNNING | ALLIANCE_SELECTION | AWARDS | CLOSED", constraints: "enum values as listed" }
      - { name: posture, type: enum, source: computed, description: "OPEN | RESTRICTED | FROZEN — derived from screening/inspection/blocking violations", constraints: "enum OPEN,RESTRICTED,FROZEN" }
      - { name: team_capacity, type: integer, source: input, description: "Maximum teams permitted at the venue" }
      - { name: match_cycle_minutes, type: integer, source: input, description: "Nominal minutes per match slot", constraints: ">= 4" }
      - { name: field_count, type: integer, source: input, description: "Number of competition fields (>= 1)" }
      - { name: championship_slots, type: integer, source: input, description: "Championship qualification slots granted by this event" }
      - { name: registered_team_count, type: integer, source: computed, description: "Count of Team rows with registration_status == CONFIRMED linked to this event" }
      - { name: cleared_mentor_count, type: integer, source: computed, description: "Count of Person rows linked to a CONFIRMED Team of this event, role MENTOR, screening_status CLEARED" }
      - { name: outstanding_violation_count, type: integer, source: computed, description: "Count of ComplianceViolation rows with resolution_status != RESOLVED" }

  - name: Team
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> FrcEvent.id; event this team is registering for" }
      - { name: team_number, type: integer, source: input, description: "Official FIRST team number, unique within event", constraints: "positive integer" }
      - { name: nickname, type: string, source: input, description: "Public team nickname" }
      - { name: registration_status, type: enum, source: system, description: "PENDING_PAYMENT | PAYMENT_CLEARED | ROSTER_SUBMITTED | CONFIRMED | WITHDRAWN | DISQUALIFIED" }
      - { name: robot_inspection_status, type: enum, source: system, description: "NOT_SUBMITTED | SUBMITTED | PASSED | FAILED | WAIVED" }
      - { name: ranking_score, type: number, source: computed, description: "Average ranking points per played match (precision 4dp)" }
      - { name: ranking_tie_break, type: number, source: computed, description: "Average auto+endgame points per played match (precision 4dp)" }
      - { name: matches_played, type: integer, source: computed, description: "Count of Match rows in status FINALIZED where this team appears on either alliance" }
      - { name: is_alliance_captain, type: boolean, source: computed, description: "True iff this Team is the captain of a SEALED Alliance" }
      - { name: qualified_for_championship, type: boolean, source: computed, description: "Set by championship_qualification_run calculation" }

  - name: Person
    parent: null
    common_fields: true
    fields:
      - { name: team_id, type: string, source: input, description: "FK -> Team.id; team affiliation; null for event-level volunteers" , constraints: "nullable" }
      - { name: full_name, type: string, source: input, description: "Full legal name" }
      - { name: email, type: string, source: input, description: "Contact email, unique per event", constraints: "RFC 5322" }
      - { name: role_kind, type: enum, source: input, description: "MENTOR | VOLUNTEER | JUDGE | STUDENT", constraints: "enum values as listed" }
      - { name: screening_status, type: enum, source: system, description: "PENDING | IN_REVIEW | CLEARED | REJECTED | EXPIRED" }
      - { name: screening_expires_at, type: datetime, source: computed, description: "Cleared_at + 180 days for MENTOR/JUDGE; + 90 days for VOLUNTEER; null otherwise" }

  - name: ScreeningRecord
    parent: Person
    common_fields: true
    fields:
      - { name: person_id, type: string, source: system, description: "FK -> Person.id; subject of the screening" }
      - { name: submission_channel, type: enum, source: input, description: "FIRST_YPP | VENDOR_API | MANUAL_UPLOAD" }
      - { name: vendor_reference, type: string, source: input, description: "External vendor reference number" }
      - { name: submitted_at, type: datetime, source: input, description: "When the package was submitted" }
      - { name: decision, type: enum, source: system, description: "PENDING | APPROVE | REJECT | EXPIRE" }
      - { name: decided_by_role, type: enum, source: system, description: "ScreeningOfficer | system (EXPIRE only)" }
      - { name: version, type: integer, source: system, description: "OCC version (inherited from common_fields); bumped on every decision write" }

  - name: BuildSeasonMilestone
    parent: FrcEvent
    common_fields: true
    fields:
      - { name: event_id, type: string, source: system, description: "FK -> FrcEvent.id" }
      - { name: kind, type: enum, source: input, description: "KICKOFF | STOP_BUILD | BAG_DAY | SHIP_DATE | UNBAG_WINDOW" }
      - { name: scheduled_at, type: datetime, source: input, description: "Scheduled date/time UTC" }
      - { name: window_minutes, type: integer, source: input, description: "Duration of the milestone window; UNBAG_WINDOW only", constraints: "0 for point events; > 0 for UNBAG_WINDOW" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | ARMED | PASSED | CANCELLED" }

  - name: PartOrder
    parent: Team
    common_fields: true
    fields:
      - { name: team_id, type: string, source: system, description: "FK -> Team.id" }
      - { name: event_id, type: string, source: system, description: "FK -> FrcEvent.id; denormalized from Team" }
      - { name: sku, type: string, source: input, description: "Part SKU per KOP catalog" }
      - { name: quantity, type: integer, source: input, description: "Units ordered", constraints: "> 0" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Per-unit cost in cents", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | VENDOR_PLACED | RECEIVED | REJECTED | CANCELLED" }
      - { name: submitted_at, type: datetime, source: computed, description: "Set when transitioned to SUBMITTED" }
      - { name: order_total_cents, type: integer, source: computed, description: "quantity * unit_cost_cents" }

  - name: RobotInspection
    parent: Team
    common_fields: true
    fields:
      - { name: team_id, type: string, source: system, description: "FK -> Team.id" }
      - { name: inspector_id, type: string, source: input, description: "FK -> Person.id; the inspector (must be CLEARED MENTOR or VOLUNTEER with inspector flag)" }
      - { name: weight_kg, type: number, source: input, description: "Measured robot weight", constraints: "> 0" }
      - { name: frame_perimeter_cm, type: integer, source: input, description: "Frame perimeter" }
      - { name: bumper_compliant, type: boolean, source: input, description: "Bumper rules check" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | PASSED | FAILED | SUPERSEDED" }

  - name: ComplianceViolation
    parent: Team
    common_fields: true
    fields:
      - { name: team_id, type: string, source: system, description: "FK -> Team.id" }
      - { name: source_kind, type: enum, source: input, description: "INSPECTION | MATCH_REVIEW | FIELD_SAFETY | JUDGE_REFERRAL" }
      - { name: severity, type: enum, source: input, description: "MINOR | MAJOR | CRITICAL" }
      - { name: description, type: string, source: input, description: "Free text" }
      - { name: resolution_status, type: enum, source: system, description: "OPEN | ACKED | RESOLVED | ESCALATED" }
      - { name: opened_by_person_id, type: string, source: input, description: "FK -> Person.id" }

  - name: Match
    parent: FrcEvent
    common_fields: true
    fields:
      - { name: event_id, type: string, source: system, description: "FK -> FrcEvent.id" }
      - { name: match_number, type: integer, source: input, description: "Sequence within event", constraints: ">= 1; unique per (event_id, series)" }
      - { name: series, type: enum, source: input, description: "QUALIFICATION | PLAYOFF" }
      - { name: scheduled_at, type: datetime, source: input, description: "Timetable slot UTC" }
      - { name: field_index, type: integer, source: input, description: "1-based field number", constraints: "<= event.field_count" }
      - { name: red_alliance_id, type: string, source: input, description: "FK -> Alliance.id (qualification: ephemeral alliance; playoff: sealed alliance)" }
      - { name: blue_alliance_id, type: string, source: input, description: "FK -> Alliance.id" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | QUEUED | ON_FIELD | SCORED | FINALIZED | REPLAYED | CANCELLED" }
      - { name: red_score, type: integer, source: computed, description: "From score_match calculation; null until SCORED" }
      - { name: blue_score, type: integer, source: computed, description: "From score_match calculation; null until SCORED" }
      - { name: red_ranking_points, type: integer, source: computed, description: "Per ranking_points calculation" }
      - { name: blue_ranking_points, type: integer, source: computed, description: "Per ranking_points calculation" }

  - name: Alliance
    parent: FrcEvent
    common_fields: true
    fields:
      - { name: event_id, type: string, source: system, description: "FK -> FrcEvent.id" }
      - { name: seed, type: integer, source: computed, description: "Playoff seed (1..N); null for qualification ephemeral alliances" }
      - { name: captain_team_id, type: string, source: input, description: "FK -> Team.id" }
      - { name: pick1_team_id, type: string, source: input, description: "FK -> Team.id" }
      - { name: pick2_team_id, type: string, source: input, description: "FK -> Team.id; null until second round completes" , constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "FORMING | SEALED | ELIMINATED | CHAMPION" }

  - name: AllianceSelectionRound
    parent: FrcEvent
    common_fields: true
    fields:
      - { name: event_id, type: string, source: system, description: "FK -> FrcEvent.id" }
      - { name: round_index, type: integer, source: input, description: "1 = first pick round, 2 = second pick round (snake)" }
      - { name: status, type: enum, source: system, description: "PENDING | OPEN | COMPLETE" }
      - { name: current_captain_team_id, type: string, source: computed, description: "Team whose pick is currently due" }

  - name: MatchScoreBreakdown
    parent: Match
    common_fields: false
    fields:
      - { name: match_id, type: string, source: system, description: "FK -> Match.id" }
      - { name: alliance_color, type: enum, source: input, description: "RED | BLUE" }
      - { name: auto_points, type: integer, source: input, description: "Autonomous period points", constraints: ">= 0" }
      - { name: teleop_points, type: integer, source: input, description: "Teleop period points", constraints: ">= 0" }
      - { name: endgame_points, type: integer, source: input, description: "Endgame points", constraints: ">= 0" }
      - { name: foul_points_awarded, type: integer, source: input, description: "Foul points awarded to THIS alliance (committed by opponent)", constraints: ">= 0" }
      - { name: tech_foul_count, type: integer, source: input, description: "Tech fouls committed by THIS alliance", constraints: ">= 0" }
      - { name: card_issued, type: enum, source: input, description: "NONE | YELLOW | RED" }

  - name: QueueSlot
    parent: Match
    common_fields: true
    fields:
      - { name: match_id, type: string, source: system, description: "FK -> Match.id" }
      - { name: team_id, type: string, source: input, description: "FK -> Team.id" }
      - { name: position, type: enum, source: input, description: "RED_1 | RED_2 | RED_3 | BLUE_1 | BLUE_2 | BLUE_3" }
      - { name: status, type: enum, source: system, description: "STAGED | AT_FIELD | ON_FIELD | RELEASED | NO_SHOW" }
      - { name: arrived_at, type: datetime, source: computed, description: "When transition to AT_FIELD happened" }

  - name: FieldResetLog
    parent: Match
    common_fields: true
    fields:
      - { name: match_id, type: string, source: system, description: "FK -> Match.id" }
      - { name: field_index, type: integer, source: input, description: "Field being reset" }
      - { name: started_at, type: datetime, source: input, description: "Reset start UTC" }
      - { name: completed_at, type: datetime, source: computed, description: "Set when transition to COMPLETE happens; null while IN_PROGRESS" }
      - { name: status, type: enum, source: system, description: "IN_PROGRESS | COMPLETE | ABORTED" }
      - { name: actual_seconds, type: integer, source: computed, description: "completed_at - started_at; null until COMPLETE" }

  - name: Award
    parent: FrcEvent
    common_fields: true
    fields:
      - { name: event_id, type: string, source: system, description: "FK -> FrcEvent.id" }
      - { name: award_kind, type: enum, source: input, description: "CHAIRMANS | ENGINEERING_INSPIRATION | ROOKIE_ALL_STAR | WOODIE_FLOWERS | DEANS_LIST | SAFETY | CREATIVITY | QUALITY | INNOVATION | GRACIOUS_PROFESSIONALISM" }
      - { name: winner_team_id, type: string, source: computed, description: "FK -> Team.id; null until awarded" , constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "OPEN | JUDGING | DECIDED | PRESENTED" }
      - { name: requires_interview, type: boolean, source: input, description: "True for CHAIRMANS/ENGINEERING_INSPIRATION/DEANS_LIST" }

  - name: InterviewSlot
    parent: Award
    common_fields: true
    fields:
      - { name: award_id, type: string, source: system, description: "FK -> Award.id" }
      - { name: team_id, type: string, source: input, description: "FK -> Team.id; interviewee" }
      - { name: judge_id, type: string, source: input, description: "FK -> Person.id (role JUDGE, screening_status CLEARED)" }
      - { name: starts_at, type: datetime, source: input, description: "Start UTC" }
      - { name: duration_minutes, type: integer, source: input, description: "Duration (>= 5)" }
      - { name: status, type: enum, source: system, description: "PROPOSED | CONFIRMED | COMPLETED | NO_SHOW | CANCELLED" }
      - { name: score, type: integer, source: computed, description: "Judge's rubric score 0..100; null until COMPLETED", constraints: "nullable; 0..100 when set" }

  - name: TravelBooking
    parent: Team
    common_fields: true
    fields:
      - { name: team_id, type: string, source: system, description: "FK -> Team.id" }
      - { name: mode, type: enum, source: input, description: "AIR | RAIL | BUS | SELF_DRIVE" }
      - { name: booked_at, type: datetime, source: input, description: "Booking timestamp UTC" }
      - { name: cost_cents, type: integer, source: input, description: "Total booking cost", constraints: ">= 0" }
      - { name: reimbursement_status, type: enum, source: system, description: "PENDING | APPROVED | PAID | DENIED" }
      - { name: reimbursed_cents, type: integer, source: computed, description: "Amount approved or paid out" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: FrcEvent
    initial_state: SETUP
    terminal_states: [CLOSED]
    transitions:
      - from: SETUP
        to: REGISTRATION_OPEN
        trigger: "POST /frc-events/{eventId}/open-registration"
        actor: EventDirector
        preconditions:
          - "At least one BuildSeasonMilestone of kind KICKOFF exists in status SCHEDULED (ERR_MILESTONE_MISSING)"
          - "team_capacity > 0"
        side_effects:
          - "posture recomputed by event_posture calculation"

      - from: REGISTRATION_OPEN
        to: REGISTRATION_LOCKED
        trigger: "POST /frc-events/{eventId}/lock-registration"
        actor: EventDirector
        preconditions:
          - "posture == OPEN (ERR_EVENT_FROZEN)"
        side_effects:
          - "All Team rows with registration_status IN {PENDING_PAYMENT, PAYMENT_CLEARED} -> WITHDRAWN"
          - "registered_team_count recomputed"

      - from: REGISTRATION_LOCKED
        to: BUILD_SEASON
        trigger: "POST /frc-events/{eventId}/open-build-season"
        actor: EventDirector
        preconditions:
          - "posture == OPEN"
          - "registered_team_count >= 2 (ERR_TOO_FEW_TEAMS)"
        side_effects:
          - "BuildSeasonMilestone kind KICKOFF -> ARMED"

      - from: BUILD_SEASON
        to: INSPECTION
        trigger: "POST /frc-events/{eventId}/open-inspection"
        actor: EventDirector
        preconditions:
          - "BuildSeasonMilestone kind STOP_BUILD is in PASSED state (ERR_MILESTONE_NOT_PASSED)"
        side_effects: []

      - from: INSPECTION
        to: MATCHES_RUNNING
        trigger: "POST /frc-events/{eventId}/start-matches"
        actor: EventDirector
        preconditions:
          - "Every CONFIRMED Team has robot_inspection_status IN {PASSED, WAIVED} (ERR_INSPECTION_INCOMPLETE)"
          - "outstanding_violation_count with severity == CRITICAL == 0"
          - "posture != FROZEN"
        side_effects:
          - "Generate initial qualification Match rows via generate_match_schedule calculation"

      - from: MATCHES_RUNNING
        to: ALLIANCE_SELECTION
        trigger: "POST /frc-events/{eventId}/open-alliance-selection"
        actor: EventDirector
        preconditions:
          - "All QUALIFICATION Match rows are in FINALIZED or REPLAYED status (ERR_MATCHES_OPEN)"
        side_effects:
          - "Create AllianceSelectionRound(round_index=1, status=OPEN)"
          - "Seed captains via seed_alliance_captains calculation"

      - from: ALLIANCE_SELECTION
        to: AWARDS
        trigger: "POST /frc-events/{eventId}/close-alliance-selection"
        actor: EventDirector
        preconditions:
          - "AllianceSelectionRound(1) and (2) both status == COMPLETE (ERR_SELECTION_INCOMPLETE)"
          - "All PLAYOFF Match rows are FINALIZED or REPLAYED"
        side_effects: []

      - from: AWARDS
        to: CLOSED
        trigger: "POST /frc-events/{eventId}/close-event"
        actor: EventDirector
        preconditions:
          - "All Award rows status == PRESENTED (ERR_AWARDS_PENDING)"
          - "outstanding_violation_count == 0"
        side_effects:
          - "championship_qualification_run calculation"
          - "Each Team.qualified_for_championship recomputed"

  - entity: Team
    initial_state: PENDING_PAYMENT
    terminal_states: [WITHDRAWN, DISQUALIFIED]
    transitions:
      - from: PENDING_PAYMENT
        to: PAYMENT_CLEARED
        trigger: "POST /frc-events/{eventId}/teams/{teamId}/mark-payment-cleared"
        actor: RegistrationOfficer
        preconditions:
          - "FrcEvent.status == REGISTRATION_OPEN (ERR_EVENT_NOT_ACCEPTING)"
        side_effects: []

      - from: PAYMENT_CLEARED
        to: ROSTER_SUBMITTED
        trigger: "POST /frc-events/{eventId}/teams/{teamId}/submit-roster"
        actor: TeamLead
        preconditions:
          - "Team has >= 1 linked Person with role_kind == MENTOR AND screening_status == CLEARED (ERR_MENTOR_NOT_CLEARED)"
          - "Team has >= 1 linked Person with role_kind == STUDENT"
        side_effects: []

      - from: ROSTER_SUBMITTED
        to: CONFIRMED
        trigger: "POST /frc-events/{eventId}/teams/{teamId}/confirm"
        actor: RegistrationOfficer
        preconditions:
          - "FrcEvent.registered_team_count < FrcEvent.team_capacity (ERR_EVENT_FULL)"
          - "FrcEvent.posture == OPEN"
        side_effects:
          - "FrcEvent.registered_team_count += 1"
          - "FrcEvent.cleared_mentor_count recomputed"

      - from: CONFIRMED
        to: WITHDRAWN
        trigger: "POST /frc-events/{eventId}/teams/{teamId}/withdraw"
        actor: TeamLead
        preconditions:
          - "FrcEvent.status != AWARDS and != CLOSED"
        side_effects:
          - "FrcEvent.registered_team_count -= 1"
          - "All QueueSlot rows for this Team with status IN {STAGED, AT_FIELD} -> NO_SHOW"
          - "All InterviewSlot rows for this Team with status IN {PROPOSED, CONFIRMED} -> CANCELLED"

      - from: CONFIRMED
        to: DISQUALIFIED
        trigger: "POST /frc-events/{eventId}/teams/{teamId}/disqualify"
        actor: EventDirector
        preconditions:
          - "At least one ComplianceViolation with severity == CRITICAL and resolution_status != RESOLVED exists for this Team (ERR_NO_GROUNDS)"
        side_effects:
          - "FrcEvent.registered_team_count -= 1"
          - "All Match rows where this team appears and status == SCHEDULED -> CANCELLED (replay scheduled)"
          - "All InterviewSlot rows -> CANCELLED"
          - "Team.removed from Alliance (captain/pick1/pick2 cleared) if Alliance.status == FORMING"

      - from: PENDING_PAYMENT
        to: WITHDRAWN
        trigger: "POST /frc-events/{eventId}/teams/{teamId}/withdraw"
        actor: TeamLead
        preconditions: []
        side_effects: []

  - entity: Person
    initial_state: PENDING
    terminal_states: [REJECTED, EXPIRED]
    transitions:
      - from: PENDING
        to: IN_REVIEW
        trigger: "POST /frc-events/{eventId}/persons/{personId}/screening-records (system creates ScreeningRecord on submission)"
        actor: ScreeningOfficer
        preconditions:
          - "FrcEvent.status IN {SETUP, REGISTRATION_OPEN, REGISTRATION_LOCKED}"
        side_effects:
          - "ScreeningRecord created with decision == PENDING"

      - from: IN_REVIEW
        to: CLEARED
        trigger: "POST /frc-events/{eventId}/persons/{personId}/screening-records/{recordId}/approve"
        actor: ScreeningOfficer
        preconditions:
          - "Latest ScreeningRecord.decision == PENDING (ERR_RECORD_NOT_PENDING)"
          - "ScreeningOfficer.id != Person.id (segregation_of_duties: cannot self-clear) (ERR_SEGREGATION_VIOLATION)"
        side_effects:
          - "ScreeningRecord.decision -> APPROVE"
          - "Person.screening_expires_at = now + (180 days if MENTOR/JUDGE else 90 days)"
          - "FrcEvent.posture recomputed via event_posture calculation"
          - "FrcEvent.cleared_mentor_count recomputed"

      - from: IN_REVIEW
        to: REJECTED
        trigger: "POST /frc-events/{eventId}/persons/{personId}/screening-records/{recordId}/reject"
        actor: ScreeningOfficer
        preconditions:
          - "Latest ScreeningRecord.decision == PENDING"
          - "ScreeningOfficer.id != Person.id"
        side_effects:
          - "FrcEvent.posture recomputed"
          - "If Person.role_kind == MENTOR and linked Team.registration_status == ROSTER_SUBMITTED -> Team reverts to PAYMENT_CLEARED"

      - from: CLEARED
        to: EXPIRED
        trigger: "system (automatic when current_utc >= screening_expires_at)"
        actor: system
        preconditions: []
        side_effects:
          - "FrcEvent.cleared_mentor_count recomputed"
          - "If Team.registration_status == CONFIRMED and this was the team's last CLEARED MENTOR -> FrcEvent.posture recomputed"

  - entity: PartOrder
    initial_state: DRAFT
    terminal_states: [RECEIVED, REJECTED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /frc-events/{eventId}/teams/{teamId}/part-orders/{orderId}/submit"
        actor: TeamLead
        preconditions:
          - "FrcEvent.status == BUILD_SEASON (ERR_NOT_BUILD_SEASON)"
          - "Current_utc <= BuildSeasonMilestone(kind=STOP_BUILD).scheduled_at (ERR_STOP_BUILD_PASSED)"
          - "Team.registration_status == CONFIRMED"
        side_effects:
          - "submitted_at set to current_utc"
          - "part_order_total_cents recomputed"

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /frc-events/{eventId}/teams/{teamId}/part-orders/{orderId}/approve"
        actor: ProcurementOfficer
        preconditions:
          - "ProcurementOfficer.id != PartOrder created_by TeamLead (segregation_of_duties)"
        side_effects: []

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /frc-events/{eventId}/teams/{teamId}/part-orders/{orderId}/reject"
        actor: ProcurementOfficer
        preconditions: []
        side_effects: []

      - from: APPROVED
        to: VENDOR_PLACED
        trigger: "POST /frc-events/{eventId}/teams/{teamId}/part-orders/{orderId}/place-with-vendor"
        actor: ProcurementOfficer
        preconditions: []
        side_effects: []

      - from: VENDOR_PLACED
        to: RECEIVED
        trigger: "POST /frc-events/{eventId}/teams/{teamId}/part-orders/{orderId}/receive"
        actor: TeamLead
        preconditions: []
        side_effects: []

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /frc-events/{eventId}/teams/{teamId}/part-orders/{orderId}/cancel"
        actor: TeamLead
        preconditions: []
        side_effects: []

      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /frc-events/{eventId}/teams/{teamId}/part-orders/{orderId}/cancel"
        actor: TeamLead
        preconditions: []
        side_effects: []

  - entity: RobotInspection
    initial_state: DRAFT
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /frc-events/{eventId}/teams/{teamId}/robot-inspections/{inspectionId}/submit"
        actor: Inspector
        preconditions:
          - "FrcEvent.status == INSPECTION"
          - "Inspector is a Person with role_kind IN {MENTOR, VOLUNTEER} AND screening_status == CLEARED (ERR_INSPECTOR_NOT_CLEARED)"
          - "Inspector.team_id != RobotInspection.team_id (segregation_of_duties: cannot inspect own team) (ERR_INSPECTOR_SELF)"
        side_effects: []

      - from: SUBMITTED
        to: PASSED
        trigger: "POST /frc-events/{eventId}/teams/{teamId}/robot-inspections/{inspectionId}/pass"
        actor: LeadInspector
        preconditions:
          - "weight_kg <= MAX_ROBOT_WEIGHT_KG (ERR_ROBOT_OVERWEIGHT)"
          - "frame_perimeter_cm <= MAX_FRAME_PERIMETER_CM (ERR_FRAME_TOO_LARGE)"
          - "bumper_compliant == true (ERR_BUMPERS_NONCOMPLIANT)"
        side_effects:
          - "Team.robot_inspection_status -> PASSED"
          - "All prior RobotInspection rows for this Team in SUBMITTED -> SUPERSEDED"

      - from: SUBMITTED
        to: FAILED
        trigger: "POST /frc-events/{eventId}/teams/{teamId}/robot-inspections/{inspectionId}/fail"
        actor: LeadInspector
        preconditions: []
        side_effects:
          - "Team.robot_inspection_status -> FAILED"
          - "ComplianceViolation created (source_kind=INSPECTION, severity=MAJOR, resolution_status=OPEN)"
          - "FrcEvent.outstanding_violation_count recomputed"

  - entity: ComplianceViolation
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: ACKED
        trigger: "POST /frc-events/{eventId}/teams/{teamId}/violations/{violationId}/ack"
        actor: TeamLead
        preconditions: []
        side_effects: []

      - from: ACKED
        to: RESOLVED
        trigger: "POST /frc-events/{eventId}/teams/{teamId}/violations/{violationId}/resolve"
        actor: HeadReferee
        preconditions:
          - "HeadReferee.id != ComplianceViolation.opened_by_person_id (segregation_of_duties)"
        side_effects:
          - "FrcEvent.outstanding_violation_count recomputed"
          - "FrcEvent.posture recomputed"

      - from: OPEN
        to: ESCALATED
        trigger: "POST /frc-events/{eventId}/teams/{teamId}/violations/{violationId}/escalate"
        actor: HeadReferee
        preconditions:
          - "severity == CRITICAL"
        side_effects:
          - "FrcEvent.posture recomputed"

  - entity: Match
    initial_state: SCHEDULED
    terminal_states: [FINALIZED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: QUEUED
        trigger: "POST /frc-events/{eventId}/matches/{matchId}/queue"
        actor: QueueManager
        preconditions:
          - "FrcEvent.status IN {MATCHES_RUNNING, ALLIANCE_SELECTION}"
          - "All 6 QueueSlot rows for this Match exist (ERR_INCOMPLETE_QUEUE)"
        side_effects:
          - "All 6 QueueSlot -> STAGED"

      - from: QUEUED
        to: ON_FIELD
        trigger: "POST /frc-events/{eventId}/matches/{matchId}/take-field"
        actor: QueueManager
        preconditions:
          - "All 6 QueueSlot.status == AT_FIELD (ERR_TEAM_NOT_AT_FIELD)"
          - "FieldResetLog for prior match on same field is COMPLETE or none exists (ERR_FIELD_NOT_RESET)"
        side_effects:
          - "All 6 QueueSlot -> ON_FIELD"

      - from: ON_FIELD
        to: SCORED
        trigger: "POST /frc-events/{eventId}/matches/{matchId}/score"
        actor: Scorekeeper
        preconditions:
          - "Two MatchScoreBreakdown rows (RED, BLUE) attached to the match (ERR_SCORE_BREAKDOWN_MISSING)"
        side_effects:
          - "score_match calculation runs; red_score and blue_score computed"
          - "ranking_points calculation runs if series == QUALIFICATION"
          - "All 6 QueueSlot -> RELEASED"
          - "FieldResetLog created (status=IN_PROGRESS, field_index=this match's field_index)"

      - from: SCORED
        to: FINALIZED
        trigger: "POST /frc-events/{eventId}/matches/{matchId}/finalize"
        actor: HeadReferee
        preconditions:
          - "Scorekeeper != HeadReferee (segregation_of_duties) (ERR_SEGREGATION_VIOLATION)"
        side_effects:
          - "For each Team on the match: matches_played += 1, ranking_score & ranking_tie_break recomputed"
          - "FieldResetLog.status must transition to COMPLETE before next match can take field"

      - from: SCORED
        to: REPLAYED
        trigger: "POST /frc-events/{eventId}/matches/{matchId}/replay"
        actor: HeadReferee
        preconditions:
          - "At least one ComplianceViolation with source_kind == MATCH_REVIEW references this match (ERR_NO_REPLAY_GROUNDS)"
        side_effects:
          - "Reverse prior ranking_points from each team (recompute)"
          - "Match remains REPLAYED; a NEW Match row is created via schedule-replay endpoint"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (cascade from Team DISQUALIFIED or WITHDRAWN)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: QueueSlot
    initial_state: STAGED
    terminal_states: [RELEASED, NO_SHOW]
    transitions:
      - from: STAGED
        to: AT_FIELD
        trigger: "POST /frc-events/{eventId}/matches/{matchId}/queue-slots/{slotId}/mark-at-field"
        actor: QueueManager
        preconditions:
          - "Match.status == QUEUED (ERR_MATCH_NOT_QUEUED)"
        side_effects:
          - "arrived_at = current_utc"

      - from: STAGED
        to: NO_SHOW
        trigger: "system (cascade from Team WITHDRAWN or DISQUALIFIED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: AT_FIELD
        to: ON_FIELD
        trigger: "system (cascade from Match QUEUED -> ON_FIELD)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ON_FIELD
        to: RELEASED
        trigger: "system (cascade from Match ON_FIELD -> SCORED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: FieldResetLog
    initial_state: IN_PROGRESS
    terminal_states: [COMPLETE, ABORTED]
    transitions:
      - from: IN_PROGRESS
        to: COMPLETE
        trigger: "POST /frc-events/{eventId}/matches/{matchId}/field-reset-logs/{logId}/complete"
        actor: FieldResetCrew
        preconditions:
          - "Match.status IN {SCORED, FINALIZED, REPLAYED}"
        side_effects:
          - "completed_at = current_utc"
          - "actual_seconds = completed_at - started_at"

      - from: IN_PROGRESS
        to: ABORTED
        trigger: "POST /frc-events/{eventId}/matches/{matchId}/field-reset-logs/{logId}/abort"
        actor: FieldResetCrew
        preconditions:
          - "Match.status == CANCELLED"
        side_effects: []

  - entity: Alliance
    initial_state: FORMING
    terminal_states: [ELIMINATED, CHAMPION]
    transitions:
      - from: FORMING
        to: SEALED
        trigger: "POST /frc-events/{eventId}/alliance-selection-rounds/{roundId}/pick (system when round completes all captain picks)"
        actor: system
        preconditions:
          - "captain_team_id, pick1_team_id, pick2_team_id all non-null"
        side_effects:
          - "captain.is_alliance_captain -> true"

      - from: SEALED
        to: ELIMINATED
        trigger: "system (when this alliance loses a playoff series)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SEALED
        to: CHAMPION
        trigger: "system (when this alliance wins the finals)"
        actor: system
        preconditions: []
        side_effects:
          - "Each member Team.qualified_for_championship -> true"

  - entity: AllianceSelectionRound
    initial_state: PENDING
    terminal_states: [COMPLETE]
    transitions:
      - from: PENDING
        to: OPEN
        trigger: "system (cascade from FrcEvent ALLIANCE_SELECTION entry or prior round COMPLETE)"
        actor: system
        preconditions: []
        side_effects:
          - "current_captain_team_id computed by selection order rule (round 1: seed ASC; round 2: seed DESC — snake)"

      - from: OPEN
        to: COMPLETE
        trigger: "system (all alliances have made their pick for this round)"
        actor: system
        preconditions: []
        side_effects:
          - "If round_index == 1: create AllianceSelectionRound(2, status=OPEN)"
          - "If round_index == 2: all Alliance rows FORMING -> SEALED"

  - entity: Award
    initial_state: OPEN
    terminal_states: [PRESENTED]
    transitions:
      - from: OPEN
        to: JUDGING
        trigger: "POST /frc-events/{eventId}/awards/{awardId}/begin-judging"
        actor: JudgeAdvisor
        preconditions:
          - "FrcEvent.status IN {MATCHES_RUNNING, ALLIANCE_SELECTION, AWARDS}"
        side_effects: []

      - from: JUDGING
        to: DECIDED
        trigger: "POST /frc-events/{eventId}/awards/{awardId}/decide"
        actor: JudgeAdvisor
        preconditions:
          - "If requires_interview: at least one InterviewSlot with status == COMPLETED for this award (ERR_INTERVIEW_REQUIRED)"
          - "award_winner_selection calculation produces a non-null winner"
        side_effects:
          - "winner_team_id set"
          - "If award_kind == CHAIRMANS: winner Team.qualified_for_championship -> true (immediate cascade)"

      - from: DECIDED
        to: PRESENTED
        trigger: "POST /frc-events/{eventId}/awards/{awardId}/present"
        actor: EventDirector
        preconditions:
          - "FrcEvent.status == AWARDS"
        side_effects: []

  - entity: InterviewSlot
    initial_state: PROPOSED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST /frc-events/{eventId}/awards/{awardId}/interview-slots/{slotId}/confirm"
        actor: TeamLead
        preconditions:
          - "InterviewSlot.team_id == TeamLead.team_id (ownership)"
        side_effects: []

      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /frc-events/{eventId}/awards/{awardId}/interview-slots/{slotId}/complete"
        actor: Judge
        preconditions:
          - "Judge.id == InterviewSlot.judge_id (ownership)"
          - "Judge.screening_status == CLEARED"
        side_effects:
          - "score set from payload (0..100)"

      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /frc-events/{eventId}/awards/{awardId}/interview-slots/{slotId}/cancel"
        actor: JudgeAdvisor
        preconditions: []
        side_effects: []

      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /frc-events/{eventId}/awards/{awardId}/interview-slots/{slotId}/no-show"
        actor: Judge
        preconditions:
          - "Judge.id == InterviewSlot.judge_id"
          - "current_utc > starts_at + duration_minutes"
        side_effects: []

  - entity: TravelBooking
    initial_state: PENDING
    terminal_states: [PAID, DENIED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /frc-events/{eventId}/teams/{teamId}/travel-bookings/{bookingId}/approve"
        actor: TravelOfficer
        preconditions:
          - "Team.qualified_for_championship == true (ERR_NOT_QUALIFIED)"
          - "travel_reimbursement calculation output > 0"
        side_effects:
          - "reimbursed_cents set by travel_reimbursement calculation"

      - from: APPROVED
        to: PAID
        trigger: "POST /frc-events/{eventId}/teams/{teamId}/travel-bookings/{bookingId}/mark-paid"
        actor: TravelOfficer
        preconditions: []
        side_effects: []

      - from: PENDING
        to: DENIED
        trigger: "POST /frc-events/{eventId}/teams/{teamId}/travel-bookings/{bookingId}/deny"
        actor: TravelOfficer
        preconditions: []
        side_effects:
          - "reimbursed_cents = 0"

# =============================================================================
# Concurrency Rules (OCC on parent.version)
# =============================================================================
concurrency_rules:
  - rule_id: screening-record-stale-person
    parent_entity: Person
    write_endpoint: "POST /frc-events/{eventId}/persons/{personId}/screening-records/{recordId}/approve"
    occ_field: "expected_person_version"
    description: |
      Approving a screening decision against a Person whose version has advanced since the
      ScreeningOfficer last observed it is rejected. This captures the case where another
      officer has just submitted a competing decision on the same Person and the current
      officer's view of the person is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: alliance-pick-stale-round
    parent_entity: AllianceSelectionRound
    write_endpoint: "POST /frc-events/{eventId}/alliance-selection-rounds/{roundId}/pick"
    occ_field: "expected_round_version"
    description: |
      Submitting a pick against an AllianceSelectionRound whose version has advanced since
      the captain's client last observed it is rejected. The previous pick has advanced the
      round state; the captain's stale view (e.g. the still-displayed current_captain_team_id)
      would otherwise overwrite the latest pick.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: match-schedule-stale-event
    parent_entity: FrcEvent
    write_endpoint: "POST /frc-events/{eventId}/start-matches"
    occ_field: "expected_event_version"
    description: |
      Calling start-matches against an FrcEvent whose version has advanced since the
      EventDirector last observed it is rejected. A posture recomputation triggered by
      a screening decision or violation creation in the interim bumps the version, and the
      director's stale view of posture==OPEN must not silently drive the system into
      MATCHES_RUNNING.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: score_match
    trigger: "Match ON_FIELD -> SCORED transition"
    algorithm: weighted_scoring
    formula: |
      For each alliance color c in {RED, BLUE}:
        breakdown = MatchScoreBreakdown where match_id == Match.id AND alliance_color == c
        base_score = breakdown.auto_points + breakdown.teleop_points + breakdown.endgame_points
        foul_component = breakdown.foul_points_awarded
        tech_foul_penalty = breakdown.tech_foul_count * TECH_FOUL_PENALTY_PER
        card_penalty = (0 if breakdown.card_issued == NONE else (YELLOW_CARD_PENALTY if YELLOW else RED_CARD_PENALTY))
        gross = base_score + foul_component - tech_foul_penalty - card_penalty
        # Floor at 0: gross score never negative
        alliance_score = max(0, gross)
      Match.red_score = alliance_score(RED); Match.blue_score = alliance_score(BLUE)
    input_set: "Both MatchScoreBreakdown rows for the Match; match must be ON_FIELD"
    constants:
      TECH_FOUL_PENALTY_PER: 5
      YELLOW_CARD_PENALTY: 10
      RED_CARD_PENALTY: 30
    precision: "integer"
    variants:
      - name: provisional
        when: "Match.status == SCORED (before HeadReferee finalize)"
        difference: "Card penalties NOT applied; only base + fouls - tech fouls. Produces different totals when card_issued != NONE."
      - name: final
        when: "Match.status == FINALIZED (after HeadReferee finalize)"
        difference: "Card penalties fully applied. A match provisional-scored at 120 and then YELLOW-carded finalizes at 110."

  - name: ranking_points
    trigger: "Match ON_FIELD -> SCORED (QUALIFICATION series only)"
    algorithm: threshold
    formula: |
      For each alliance c in {RED, BLUE}:
        rp = 0
        if alliance_score(c) > alliance_score(other): rp += WIN_RP
        elif alliance_score(c) == alliance_score(other): rp += TIE_RP
        else: rp += LOSS_RP
        # Bonus thresholds (use strict >, not >= — see boundary rules)
        if breakdown(c).auto_points > AUTO_BONUS_THRESHOLD: rp += AUTO_BONUS_RP
        if breakdown(c).endgame_points > ENDGAME_BONUS_THRESHOLD: rp += ENDGAME_BONUS_RP
        # Accumulate to each member Team's ranking aggregates (matches_played NOT yet incremented for this match)
        For each Team t in alliance(c).members: t.ranking_points_total += rp (transient accumulator used by team_ranking_score)
    input_set: "QUALIFICATION Match rows in status SCORED or FINALIZED; excludes REPLAYED and CANCELLED"
    constants:
      WIN_RP: 2
      TIE_RP: 1
      LOSS_RP: 0
      AUTO_BONUS_THRESHOLD: 25
      ENDGAME_BONUS_THRESHOLD: 20
      AUTO_BONUS_RP: 1
      ENDGAME_BONUS_RP: 1
    precision: "integer"

  - name: team_ranking_score
    trigger: "Match SCORED -> FINALIZED; also Match SCORED -> REPLAYED (reversal)"
    algorithm: aggregation
    formula: |
      # Two valid aggregation strategies produce different results when a REPLAYED match
      # is reversed out; the scaffold pins the chronological variant.
      team_played = [Match m : m.series == QUALIFICATION, m.status IN {FINALIZED}, team appears in red_alliance_id.members or blue_alliance_id.members]
      Sort team_played by (m.match_number ASC, m.created_at ASC)  # chronological; tie-break by created_at
      rp_sum = 0; tie_break_sum = 0; n = 0
      For each m in team_played:
        side = RED if team in red members else BLUE
        rp_sum += m.<side>_ranking_points
        breakdown = MatchScoreBreakdown where match_id == m.id AND alliance_color == side
        tie_break_sum += (breakdown.auto_points + breakdown.endgame_points)
        n += 1
      Team.ranking_score = rp_sum / n (precision 4dp, ROUND_HALF_UP)
      Team.ranking_tie_break = tie_break_sum / n (precision 4dp, ROUND_HALF_UP)
      Team.matches_played = n
    input_set: "QUALIFICATION Match rows in FINALIZED status only; REPLAYED and SCORED-not-yet-finalized excluded"
    precision: "4 decimal places, round_half_up"
    variants:
      - name: chronological
        when: "Default; pinned"
        difference: "Iterate matches in (match_number ASC, created_at ASC) order. When a REPLAYED match is reversed out, the running aggregate excludes it from the start."
      - name: forward_looking
        when: "Used by GET /frc-events/{eventId}/teams/{teamId}/projected-ranking (read-only)"
        difference: "Includes SCORED-but-not-yet-FINALIZED matches in the average; produces a different value during the SCORED-to-FINALIZED window."

  - name: generate_match_schedule
    trigger: "FrcEvent INSPECTION -> MATCHES_RUNNING"
    algorithm: topological
    formula: |
      teams = [Team t : t.event_id == event.id, t.registration_status == CONFIRMED, t.robot_inspection_status IN {PASSED, WAIVED}]
      Sort teams by (t.team_number ASC, t.created_at ASC)  # deterministic; never use id
      N = len(teams)
      if N < MIN_TEAMS_FOR_MATCHES: raise ERR_TOO_FEW_TEAMS
      # Round-robin pairing: produce M = ceil(N / 6) * ROUNDS_PER_TEAM rounds
      # Each Match has 6 distinct teams (3 red + 3 blue); no team plays twice in the same round
      # Slot allocation: interleave teams across fields 1..event.field_count
      # Constraint: for any two consecutive matches on the same field, at least FIELD_RESET_MIN_SECONDS elapse between their scheduled_at
      Match rows are created in SCHEDULED status; field_index assigned round-robin over field_count
    input_set: "CONFIRMED Teams with PASSED or WAIVED inspection"
    constants:
      MIN_TEAMS_FOR_MATCHES: 6
      ROUNDS_PER_TEAM: 8
      FIELD_RESET_MIN_SECONDS: 300
    precision: "integer"

  - name: seed_alliance_captains
    trigger: "FrcEvent MATCHES_RUNNING -> ALLIANCE_SELECTION"
    algorithm: selector
    formula: |
      # Selector policy: pick the top ALLIANCE_COUNT captains by ranking
      candidates = [Team t : t.event_id == event.id, t.registration_status == CONFIRMED, t.matches_played >= MIN_MATCHES_FOR_SEEDING]
      Sort candidates by (t.ranking_score DESC, t.ranking_tie_break DESC, t.team_number ASC, t.created_at ASC)  # never id
      captains = first ALLIANCE_COUNT rows of the sorted list
      For i, c in enumerate(captains): Alliance(seed=i+1, captain_team_id=c.id, status=FORMING) created
      If len(candidates) < ALLIANCE_COUNT: raise ERR_INSUFFICIENT_CAPTAINS
    input_set: "CONFIRMED Teams with at least MIN_MATCHES_FOR_SEEDING FINALIZED QUALIFICATION matches"
    constants:
      ALLIANCE_COUNT: 8
      MIN_MATCHES_FOR_SEEDING: 1
    precision: "n/a"

  - name: alliance_pick_order
    trigger: "POST /frc-events/{eventId}/alliance-selection-rounds/{roundId}/pick"
    algorithm: selector
    formula: |
      # Snake-draft: round 1 ascending seed; round 2 descending seed
      eligible = [Team t : t.event_id == event.id, t.registration_status == CONFIRMED, t.is_alliance_captain == false,
                  t.id NOT IN (select pick1_team_id, pick2_team_id from Alliance where event_id == event.id AND status IN {FORMING, SEALED})]
      Sort eligible by (t.ranking_score DESC, t.ranking_tie_break DESC, t.team_number ASC, t.created_at ASC)
      # The captain's *choice* is free; the captain whose turn it is, is NOT free:
      # round.current_captain_team_id = alliance[seed_idx].captain_team_id where
      #   seed_idx = round.picks_made (round 1: ascending order of seed; round 2: descending order of seed)
      # If a captain attempts to pick an ineligible team: ERR_PICK_INELIGIBLE
      # If a captain attempts to pick out of turn: ERR_OUT_OF_TURN
    input_set: "Alliances in FORMING for this event; Teams per filter"
    precision: "n/a"

  - name: award_winner_selection
    trigger: "Award JUDGING -> DECIDED"
    algorithm: selector
    formula: |
      # Selector policy per award_kind:
      if award.requires_interview:
        eligible_teams = [t : InterviewSlot s where s.award_id == award.id AND s.status == COMPLETED AND s.team_id == t.id]
        # Winner = team with highest average interview score; ties broken by ranking_score, then by team_number ASC
        scores = {t: avg(s.score for s in completed_interviews(t))}
      elif award_kind == SAFETY:
        # Safety award goes to team with FEWEST open violations, then lowest severity-weighted count
        eligible_teams = [t : t.registration_status == CONFIRMED]
        scores = {t: -1 * sum(severity_weight(v) for v in violations(t) if v.resolution_status != RESOLVED)}
      elif award_kind == ROOKIE_ALL_STAR:
        eligible_teams = [t : t.registration_status == CONFIRMED AND t.is_rookie == true]
        scores = {t: t.ranking_score}
      else:
        eligible_teams = [t : t.registration_status == CONFIRMED]
        scores = {t: t.ranking_score}
      if not eligible_teams: return null (Award remains JUDGING; DECIDE fails with ERR_NO_ELIGIBLE_TEAMS)
      winner = argmax over scores, tie-break by (t.ranking_score DESC, t.ranking_tie_break DESC, t.team_number ASC, t.created_at ASC)
    input_set: "See formula branches; depends on award_kind"
    precision: "n/a"

  - name: event_posture
    trigger: "Person CLEARED/REJECTED/EXPIRED; ComplianceViolation created/resolved/escalated; Team DISQUALIFIED"
    algorithm: aggregation
    formula: |
      # Posture drives gating of all subsequent operations (posture_driven state machine)
      critical_open = count(ComplianceViolation v where v.event's teams include v.team_id AND v.severity == CRITICAL AND v.resolution_status != RESOLVED)
      uncleared_mentors = count(Team t where t.registration_status == CONFIRMED AND NOT EXISTS(Person p where p.team_id == t.id AND p.role_kind == MENTOR AND p.screening_status == CLEARED))
      if critical_open >= CRITICAL_FREEZE_THRESHOLD:
        FrcEvent.posture = FROZEN
      elif critical_open > 0 OR uncleared_mentors > 0:
        FrcEvent.posture = RESTRICTED
      else:
        FrcEvent.posture = OPEN
    input_set: "All ComplianceViolation rows for teams of this event; all CONFIRMED Teams; all linked MENTOR Persons"
    constants:
      CRITICAL_FREEZE_THRESHOLD: 3
    precision: "n/a"

  - name: travel_reimbursement
    trigger: "TravelBooking PENDING -> APPROVED"
    algorithm: tiered_pricing
    formula: |
      # Tiered reimbursement based on cost_cents (the input), with mode-specific caps.
      # Two valid interpretations exist: marginal-rate vs average-rate; the scaffold pins MARGINAL.
      caps = {AIR: AIR_CAP_CENTS, RAIL: RAIL_CAP_CENTS, BUS: BUS_CAP_CENTS, SELF_DRIVE: SELF_DRIVE_CAP_CENTS}
      cap = caps[booking.mode]
      eligible = min(booking.cost_cents, cap)
      # Tier 1: first TIER1_LIMIT_CENTS at TIER1_RATE
      # Tier 2: remainder at TIER2_RATE
      tier1_amount = min(eligible, TIER1_LIMIT_CENTS)
      tier2_amount = max(0, eligible - TIER1_LIMIT_CENTS)
      # Pin nested-rounding order: round per tier, then sum
      tier1_reimbursed = round(tier1_amount * TIER1_RATE, 0)  # 0dp = whole cents
      tier2_reimbursed = round(tier2_amount * TIER2_RATE, 0)
      booking.reimbursed_cents = tier1_reimbursed + tier2_reimbursed
    input_set: "Single TravelBooking row"
    constants:
      AIR_CAP_CENTS: 1500000   # $15,000
      RAIL_CAP_CENTS: 800000
      BUS_CAP_CENTS: 400000
      SELF_DRIVE_CAP_CENTS: 300000
      TIER1_LIMIT_CENTS: 200000  # first $2,000
      TIER1_RATE: 0.80
      TIER2_RATE: 0.50
    precision: "integer (cents); per-tier rounding before summation (NOT sum-then-round)"
    variants:
      - name: marginal
        when: "Default; pinned"
        difference: "Each tier applies its rate to only the portion of the amount within that tier. Round per tier, then sum."
      - name: average
        when: "Forbidden but commonly produced by misreading prose; cited here so a test can falsify it"
        difference: "Sum the full eligible amount, then apply TIER2_RATE to the entire amount. Produces a different (lower) reimbursed_cents for the same booking."

  - name: championship_qualification_run
    trigger: "FrcEvent AWARDS -> CLOSED"
    algorithm: waterfall_allocation
    formula: |
      # Distribute event.championship_slots among candidate teams in priority order:
      # Bucket 1: CHAIRMANS winner (1 slot if any)
      # Bucket 2: ENGINEERING_INSPIRATION winner (1 slot)
      # Bucket 3: Playoff CHAMPION alliance members (3 slots if alliance exists)
      # Bucket 4: Remaining slots allocated by ranking_score DESC, tie_break DESC, team_number ASC, created_at ASC
      # Overflow: if a bucket's winners already qualified via earlier bucket, slot rolls to next bucket
      # Each Team.qualified_for_championship written exactly once
      slots = event.championship_slots
      awarded = set()
      # Bucket 1
      chairmans = Award where award_kind == CHAIRMANS AND status == PRESENTED
      if chairmans.winner_team_id and slots > 0:
        awarded.add(chairmans.winner_team_id); slots -= 1
      # Bucket 2
      ei = Award where award_kind == ENGINEERING_INSPIRATION AND status == PRESENTED
      if ei.winner_team_id and slots > 0 and ei.winner_team_id not in awarded:
        awarded.add(ei.winner_team_id); slots -= 1
      # Bucket 3
      champ_alliance = Alliance where status == CHAMPION
      if champ_alliance:
        for tid in [champ_alliance.captain_team_id, champ_alliance.pick1_team_id, champ_alliance.pick2_team_id]:
          if slots > 0 and tid and tid not in awarded:
            awarded.add(tid); slots -= 1
      # Bucket 4
      candidates = [Team t where t.registration_status == CONFIRMED AND t.id NOT IN awarded]
      Sort candidates by (ranking_score DESC, ranking_tie_break DESC, team_number ASC, created_at ASC)
      for t in candidates:
        if slots == 0: break
        awarded.add(t.id); slots -= 1
      for tid in awarded: Team(tid).qualified_for_championship = true
    input_set: "PRESENTED Award rows; CHAMPION Alliance; CONFIRMED Teams"
    precision: "n/a"

  - name: screening_expiry
    trigger: "system cron — runs on every posture recompute"
    algorithm: decay_function
    formula: |
      # Persons transition CLEARED -> EXPIRED when current_utc >= screening_expires_at
      # This is a STEP decay (not continuous): the transition is binary at expiry
      For each Person p where p.screening_status == CLEARED AND current_utc >= p.screening_expires_at:
        p.screening_status = EXPIRED
        # Cascade: if this leaves the team without a cleared mentor, recompute posture
    input_set: "CLEARED Persons where expires_at <= current_utc"
    precision: "datetime comparison at second precision"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role must be one of the roles permitted for the endpoint"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every id in path must resolve to an existing entity within the scope of its parent"
    error_id: "ERR_NOT_FOUND (ERR_EVENT_NOT_FOUND, ERR_TEAM_NOT_FOUND, ERR_PERSON_NOT_FOUND, ERR_MATCH_NOT_FOUND, ERR_ALLIANCE_NOT_FOUND, ERR_AWARD_NOT_FOUND, ERR_SLOT_NOT_FOUND, ERR_BOOKING_NOT_FOUND, ERR_ORDER_NOT_FOUND, ERR_INSPECTION_NOT_FOUND, ERR_VIOLATION_NOT_FOUND, ERR_RECORD_NOT_FOUND, ERR_MILESTONE_NOT_FOUND, ERR_RESET_LOG_NOT_FOUND)"
    http_status: 404
    applies_to: "all nested endpoints"

  - priority: 4
    category: state
    check: "FrcEvent must be in the expected status for the operation (per state machine)"
    error_id: ERR_EVENT_WRONG_STATUS
    http_status: 409
    applies_to: "all event-scoped transitions"

  - priority: 5
    category: state
    check: "FrcEvent.posture must not be FROZEN for write operations; must be OPEN for confirm/start-matches"
    error_id: ERR_EVENT_FROZEN
    http_status: 409
    applies_to: "write endpoints"

  - priority: 6
    category: state
    check: "Target entity must be in the from-state for the transition (per state machine)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 7
    category: business_safety
    check: "Segregation of duties: same user cannot approve what they created/own"
    error_id: ERR_SEGREGATION_VIOLATION
    http_status: 403
    applies_to: "screening approve/reject, inspection submit (own team), violation resolve (same opener), score finalize (same scorekeeper), part-order approve (same submitter)"

  - priority: 8
    category: business_safety
    check: "Screening: cannot approve or reject a Person if decision is no longer PENDING"
    error_id: ERR_RECORD_NOT_PENDING
    http_status: 409
    applies_to: "screening approve, screening reject"

  - priority: 9
    category: business_safety
    check: "Inspector must be CLEARED MENTOR or VOLUNTEER and not on the inspected team"
    error_id: ERR_INSPECTOR_NOT_CLEARED
    http_status: 422
    applies_to: "robot-inspection submit"

  - priority: 10
    category: business_safety
    check: "Team must have at least one CLEARED MENTOR before roster submission"
    error_id: ERR_MENTOR_NOT_CLEARED
    http_status: 422
    applies_to: "team submit-roster"

  - priority: 11
    category: business_constraint
    check: "Capacity: registered_team_count < team_capacity when confirming"
    error_id: ERR_EVENT_FULL
    http_status: 409
    applies_to: "team confirm"

  - priority: 12
    category: business_temporal
    check: "PartOrder.submit must occur on or before STOP_BUILD milestone"
    error_id: ERR_STOP_BUILD_PASSED
    http_status: 422
    applies_to: "part-order submit"

  - priority: 13
    category: business_temporal
    check: "Match take-field: prior FieldResetLog on same field must be COMPLETE"
    error_id: ERR_FIELD_NOT_RESET
    http_status: 409
    applies_to: "match take-field"

  - priority: 14
    category: business_temporal
    check: "InterviewSlot temporal overlap: same judge cannot have two CONFIRMED slots overlapping in time (half-open intervals [starts_at, starts_at + duration_minutes))"
    error_id: ERR_JUDGE_DOUBLE_BOOKED
    http_status: 409
    applies_to: "interview-slot confirm"

  - priority: 15
    category: business_temporal
    check: "Match schedule: consecutive matches on the same field must have at least FIELD_RESET_MIN_SECONDS between scheduled_at"
    error_id: ERR_FIELD_INTERVAL_VIOLATION
    http_status: 422
    applies_to: "match schedule generation"

  - priority: 16
    category: business_referential
    check: "Alliance pick: target team must be eligible (not already picked, not a captain, registration CONFIRMED)"
    error_id: ERR_PICK_INELIGIBLE
    http_status: 422
    applies_to: "alliance-selection pick"

  - priority: 17
    category: business_referential
    check: "Alliance pick: acting captain must be the current_captain_team_id"
    error_id: ERR_OUT_OF_TURN
    http_status: 409
    applies_to: "alliance-selection pick"

  - priority: 18
    category: business_fiscal
    check: "PartOrder total must not exceed team's remaining build-season budget (per FrcEvent budget cap)"
    error_id: ERR_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "part-order approve"

  - priority: 19
    category: business_fiscal
    check: "TravelBooking reimbursement cannot exceed mode cap"
    error_id: ERR_REIMBURSEMENT_CAP_EXCEEDED
    http_status: 422
    applies_to: "travel-booking approve"

  - priority: 20
    category: business_constraint
    check: "Team number must be unique within event"
    error_id: ERR_DUPLICATE_TEAM_NUMBER
    http_status: 409
    applies_to: "team create"

  - priority: 21
    category: business_constraint
    check: "Match number must be unique within (event_id, series)"
    error_id: ERR_DUPLICATE_MATCH_NUMBER
    http_status: 409
    applies_to: "match create"

  - priority: 22
    category: state
    check: "OCC: expected_<parent>_version must match the current version of the parent entity"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "screening approve, alliance-selection pick, start-matches"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- FrcEvent ---
  - method: POST
    path: "/frc-events"
    description: "Create a new FRC event"
    roles: [EventDirector]
    code: 201
    input: [event_code, event_name, season_year, start_date, end_date, team_capacity, match_cycle_minutes, field_count, championship_slots]
    output: FrcEvent
    side_effects: ["status=SETUP, posture=OPEN, computed counts initialized to 0"]

  - method: GET
    path: "/frc-events"
    description: "List events"
    roles: [EventDirector, RegistrationOfficer, ScreeningOfficer, TeamLead, JudgeAdvisor, Scorekeeper, QueueManager, HeadReferee, Inspector, LeadInspector, FieldResetCrew, TravelOfficer, ProcurementOfficer, Judge]
    code: 200
    input: ["limit?", "offset?", "status?", "season_year?"]
    output: "FrcEvent[]"
    side_effects: []

  - method: GET
    path: "/frc-events/{eventId}"
    description: "Get one event"
    roles: [EventDirector, RegistrationOfficer, ScreeningOfficer, TeamLead, JudgeAdvisor, Scorekeeper, QueueManager, HeadReferee, Inspector, LeadInspector, FieldResetCrew, TravelOfficer, ProcurementOfficer, Judge]
    code: 200
    input: []
    output: FrcEvent
    side_effects: []

  - method: POST
    path: "/frc-events/{eventId}/open-registration"
    description: "Transition FrcEvent SETUP -> REGISTRATION_OPEN"
    roles: [EventDirector]
    code: 200
    input: []
    output: FrcEvent
    side_effects: ["posture recomputed"]

  - method: POST
    path: "/frc-events/{eventId}/lock-registration"
    description: "REGISTRATION_OPEN -> REGISTRATION_LOCKED; withdraw unpaid teams"
    roles: [EventDirector]
    code: 200
    input: []
    output: FrcEvent
    side_effects: ["PENDING_PAYMENT/PAYMENT_CLEARED teams -> WITHDRAWN; registered_team_count recomputed; increments FrcEvent.version by 1"]

  - method: POST
    path: "/frc-events/{eventId}/open-build-season"
    description: "REGISTRATION_LOCKED -> BUILD_SEASON"
    roles: [EventDirector]
    code: 200
    input: []
    output: FrcEvent
    side_effects: ["KICKOFF milestone -> ARMED"]

  - method: POST
    path: "/frc-events/{eventId}/open-inspection"
    description: "BUILD_SEASON -> INSPECTION"
    roles: [EventDirector]
    code: 200
    input: []
    output: FrcEvent
    side_effects: []

  - method: POST
    path: "/frc-events/{eventId}/start-matches"
    description: "INSPECTION -> MATCHES_RUNNING; generates qualification schedule"
    roles: [EventDirector]
    code: 200
    input: [expected_event_version]
    output: FrcEvent
    side_effects: ["generate_match_schedule runs; Match rows created in SCHEDULED; increments FrcEvent.version by 1"]

  - method: POST
    path: "/frc-events/{eventId}/open-alliance-selection"
    description: "MATCHES_RUNNING -> ALLIANCE_SELECTION"
    roles: [EventDirector]
    code: 200
    input: []
    output: FrcEvent
    side_effects: ["AllianceSelectionRound(1) created status=OPEN; captains seeded"]

  - method: POST
    path: "/frc-events/{eventId}/close-alliance-selection"
    description: "ALLIANCE_SELECTION -> AWARDS"
    roles: [EventDirector]
    code: 200
    input: []
    output: FrcEvent
    side_effects: []

  - method: POST
    path: "/frc-events/{eventId}/close-event"
    description: "AWARDS -> CLOSED; championship qualification waterfall"
    roles: [EventDirector]
    code: 200
    input: []
    output: FrcEvent
    side_effects: ["championship_qualification_run; each Team.qualified_for_championship recomputed"]

  # --- BuildSeasonMilestone ---
  - method: POST
    path: "/frc-events/{eventId}/milestones"
    description: "Create a build-season milestone"
    roles: [EventDirector]
    code: 201
    input: [kind, scheduled_at, window_minutes]
