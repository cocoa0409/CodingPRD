scenario: |
  Lift Station Monitoring & Maintenance (wastewater utility): SCADA alarm handling & callout rotation, pump run-time & alternation analysis, wet-well cleaning schedule & grease accumulation, generator/backup power test, spare pump & rebuild inventory, overflow (SSO) reporting clock & documentation, confined-space entry permit, capital replacement prioritization

domain_name: lift-station-ops
api_prefix: /lift-station-ops

complexity_profile:
  primary_archetype: posture-driven gating
  secondary_archetype: compliance / audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - scheduled_actions
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: LiftStation
    parent: null
    common_fields: true
    fields:
      - name: station_code
        type: string
        source: input
        description: Unique regulatory identifier for the lift station (e.g., LS-1042). Used in reports and on permits.
        constraints: "Unique across all LiftStation rows; matches regex ^LS-[0-9]{4}$"
      - name: service_zone
        type: string
        source: input
        description: Operations zone that owns maintenance responsibility.
      - name: design_capacity_gpm
        type: integer
        source: input
        description: Rated firm capacity of the station in gallons per minute.
        constraints: "Positive integer; must be >= 50"
      - name: pump_count
        type: integer
        source: input
        description: Number of installed pump slots in the station.
        constraints: "Integer >= 2 and <= 8"
      - name: has_backup_generator
        type: boolean
        source: input
        description: Whether the station has a permanently installed backup generator.
      - name: wet_well_volume_gal
        type: integer
        source: input
        description: Physical wet-well volume in gallons; drives SSO volume estimates.
        constraints: "Positive integer"
      - name: operational_posture
        type: enum
        source: computed
        description: Derived aggregate state gating all child operations; computed from Pump states, active SsoEvent rows, active ConfinedSpacePermit rows, and in-flight AlarmTicket rows.
        constraints: "One of {NORMAL, DEGRADED, EMERGENCY, FROZEN}"
      - name: firm_capacity_available_gpm
        type: integer
        source: computed
        description: Sum of rated_gpm of Pump rows attached to this station whose status is IN_SERVICE minus the largest single pump's rated_gpm (N-1 criterion).
      - name: last_sso_occurred_at
        type: datetime
        source: computed
        description: Timestamp of the most recent SsoEvent with status in {OPEN, UNDER_REVIEW} for this station; NULL if none.

  - name: Pump
    parent: LiftStation
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: "FK -> LiftStation.id; the station this pump is installed at."
      - name: position_index
        type: integer
        source: input
        description: 1-based physical slot index inside the station (1 = lead slot).
        constraints: "Integer between 1 and station.pump_count; unique per (station_id)"
      - name: rated_gpm
        type: integer
        source: input
        description: Nameplate capacity of this pump in gpm.
        constraints: "Positive integer"
      - name: status
        type: enum
        source: input
        description: Lifecycle status of the pump.
        constraints: "One of {IN_SERVICE, STANDBY, OUT_OF_SERVICE, REBUILD}"
        default: "IN_SERVICE"
      - name: cumulative_runtime_hours
        type: number
        source: computed
        description: Total accumulated run time in hours, advanced by RuntimeReading ingestion. Reset to 0 only when status transitions REBUILD -> IN_SERVICE.
      - name: runtime_since_rebuild_hours
        type: number
        source: computed
        description: Hours accumulated since the most recent rebuild completion.
      - name: last_alternation_at
        type: datetime
        source: computed
        description: Timestamp of the last time this pump became the lead pump.
      - name: rebuild_count
        type: integer
        source: computed
        description: Number of completed PumpRebuild rows tied to this pump.
        default: 0

  - name: RuntimeReading
    parent: Pump
    common_fields: false
    fields:
      - name: pump_id
        type: string
        source: input
        description: "FK -> Pump.id; the pump this reading belongs to."
      - name: recorded_at
        type: datetime
        source: input
        description: UTC timestamp the reading applies to. Must be >= previous reading's recorded_at for the same pump.
      - name: run_hours_delta
        type: number
        source: input
        description: Run-time hours accumulated since the prior reading.
        constraints: "Number in [0, 24]; two-decimal precision, round_half_up"
      - name: starts_count
        type: integer
        source: input
        description: Number of motor starts since the prior reading.
        constraints: "Integer >= 0"
      - name: source
        type: enum
        source: input
        description: Origin of this reading (SCADA poll, manual entry, backfill).
        constraints: "One of {SCADA, MANUAL, BACKFILL}"

  - name: AlarmTicket
    parent: LiftStation
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: "FK -> LiftStation.id; station where the alarm fired."
      - name: alarm_class
        type: enum
        source: input
        description: Severity classification of the alarm.
        constraints: "One of {CRITICAL, MAJOR, MINOR, INFO}"
      - name: alarm_code
        type: string
        source: input
        description: SCADA-originated alarm code (e.g., HI_LEVEL, P1_FAIL, GEN_FAIL, COMM_LOSS).
      - name: raised_at
        type: datetime
        source: input
        description: UTC timestamp the alarm fired.
      - name: status
        type: enum
        source: computed
        description: Workflow state of the ticket.
        constraints: "One of {OPEN, ACKED, DISPATCHED, ON_SCENE, CLEARED, CANCELLED}"
        default: "OPEN"
      - name: assigned_operator_id
        type: string
        source: computed
        description: "FK -> Operator.id; the operator currently responsible (set when DISPATCHED, cleared when CLEARED or CANCELLED)."
      - name: acked_at
        type: datetime
        source: computed
        description: UTC timestamp when ticket entered ACKED.
      - name: dispatched_at
        type: datetime
        source: computed
        description: UTC timestamp when ticket entered DISPATCHED.
      - name: cleared_at
        type: datetime
        source: computed
        description: UTC timestamp when ticket entered CLEARED.
      - name: response_minutes
        type: integer
        source: computed
        description: "For tickets that reach CLEARED — minutes between raised_at and dispatched_at."
      - name: is_sso_related
        type: boolean
        source: input
        description: True if this alarm is suspected to be associated with a sanitary sewer overflow.
        default: false

  - name: Operator
    parent: null
    common_fields: true
    fields:
      - name: employee_code
        type: string
        source: input
        description: HR employee code. Unique across all Operator rows.
        constraints: "Unique; matches regex ^OP-[0-9]{4}$"
      - name: full_name
        type: string
        source: input
        description: Display name.
      - name: certifications
        type: array
        source: input
        description: Array of certification codes the operator holds; values drawn from {CSE_1, CSE_2, ELEC_1, GEN_OP, COLLECTIONS_2}.
      - name: home_zone
        type: string
        source: input
        description: Zone the operator normally serves; callout preferentially picks operators whose home_zone == station.service_zone.
      - name: is_active
        type: boolean
        source: input
        description: Inactive operators are excluded from callout and assignment.
        default: true
      - name: active_ticket_count
        type: integer
        source: computed
        description: Count of AlarmTicket rows where assigned_operator_id == this.id AND status in {DISPATCHED, ON_SCENE}.
      - name: consecutive_callouts_24h
        type: integer
        source: computed
        description: Number of AlarmTicket dispatch events in the trailing 24h where this operator was selected (decays by created_at window).

  - name: PumpRebuild
    parent: Pump
    common_fields: true
    fields:
      - name: pump_id
        type: string
        source: input
        description: "FK -> Pump.id; the pump being rebuilt."
      - name: work_order_ref
        type: string
        source: input
        description: External CMMS work-order reference.
      - name: started_at
        type: datetime
        source: input
        description: UTC timestamp the rebuild started (pump taken out of service).
      - name: completed_at
        type: datetime
        source: computed
        description: UTC timestamp the rebuild was completed.
      - name: status
        type: enum
        source: computed
        description: Rebuild lifecycle.
        constraints: "One of {OPEN, IN_PROGRESS, COMPLETED, CANCELLED}"
        default: "OPEN"
      - name: cost_usd
        type: number
        source: input
        description: Final invoiced cost of the rebuild; feeds capital-replacement scoring.
        constraints: "Number >= 0, two decimal places"
      - name: pre_rebuild_runtime_hours
        type: number
        source: computed
        description: Snapshot of pump.runtime_since_rebuild_hours at the moment the rebuild transitions to IN_PROGRESS.

  - name: WetWellCleaning
    parent: LiftStation
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: "FK -> LiftStation.id; station being cleaned."
      - name: scheduled_for
        type: datetime
        source: input
        description: Planned UTC start of the cleaning.
      - name: status
        type: enum
        source: computed
        description: Cleaning lifecycle.
        constraints: "One of {SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED, OVERDUE}"
        default: "SCHEDULED"
      - name: completed_at
        type: datetime
        source: computed
        description: Actual completion timestamp.
      - name: grease_depth_inches_pre
        type: number
        source: input
        description: Measured grease cap depth before cleaning (inches, one decimal).
        constraints: "Number >= 0"
      - name: grease_depth_inches_post
        type: number
        source: computed
        description: Measured grease cap depth after cleaning (inches, one decimal).
      - name: crew_lead_operator_id
        type: string
        source: input
        description: "FK -> Operator.id; the operator leading the cleaning crew."
      - name: requires_confined_space_entry
        type: boolean
        source: input
        description: True if entering the wet well is required (triggers ConfinedSpacePermit requirement).

  - name: GeneratorTest
    parent: LiftStation
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: "FK -> LiftStation.id; station whose backup generator is under test."
      - name: scheduled_for
        type: datetime
        source: input
        description: Planned UTC timestamp for the test run.
      - name: test_kind
        type: enum
        source: input
        description: Kind of test performed.
        constraints: "One of {NO_LOAD, LOAD_BANK, TRANSFER_SWITCH}"
      - name: status
        type: enum
        source: computed
        description: Test lifecycle.
        constraints: "One of {SCHEDULED, RUNNING, PASSED, FAILED, ABORTED, OVERDUE}"
        default: "SCHEDULED"
      - name: started_at
        type: datetime
        source: computed
        description: When the test actually started.
      - name: duration_minutes
        type: integer
        source: computed
        description: Length of the test run in whole minutes.
      - name: load_percent
        type: number
        source: input
        description: Load percentage applied during the test (0-100).
        constraints: "Number in [0, 100]"
      - name: outcome_notes
        type: string
        source: input
        description: Free-form result notes.

  - name: SsoEvent
    parent: LiftStation
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: "FK -> LiftStation.id; station where the SSO occurred."
      - name: started_at
        type: datetime
        source: input
        description: UTC timestamp the overflow began. Reporting clock runs from this instant.
      - name: stopped_at
        type: datetime
        source: computed
        description: UTC timestamp the overflow was stopped; set on the CONTAINED transition.
      - name: estimated_volume_gal
        type: number
        source: computed
        description: Volume estimate in gallons; computed via the sso_volume_estimate calculation at CONTAINED time.
      - name: cause_code
        type: enum
        source: input
        description: Root cause classification.
        constraints: "One of {GREASE_BLOCKAGE, DEBRIS, POWER_FAILURE, PUMP_FAILURE, INFLOW_INFILTRATION, VANDALISM, UNKNOWN}"
      - name: status
        type: enum
        source: computed
        description: Reporting lifecycle.
        constraints: "One of {OPEN, CONTAINED, REPORT_DRAFT, REPORT_SUBMITTED, REPORT_ACCEPTED, CLOSED}"
        default: "OPEN"
      - name: regulator_deadline_at
        type: datetime
        source: computed
        description: Statutory reporting deadline; started_at + 24 hours per state rule.
      - name: report_submitted_at
        type: datetime
        source: computed
        description: Timestamp the draft was submitted to the regulator.
      - name: report_accepted_at
        type: datetime
        source: computed
        description: Timestamp the regulator accepted the report.
      - name: reached_surface_water
        type: boolean
        source: input
        description: True if overflow reached a surface water body; drives the reporting deadline to the stricter tier.

  - name: ConfinedSpacePermit
    parent: LiftStation
    common_fields: true
    fields:
      - name: station_id
        type: string
        source: input
        description: "FK -> LiftStation.id; station whose wet well is being entered."
      - name: work_description
        type: string
        source: input
        description: Description of the entry work (cleaning, inspection, retrieval).
      - name: authorized_entrant_id
        type: string
        source: input
        description: "FK -> Operator.id; operator entering the confined space; must hold CSE_1 or CSE_2 certification."
      - name: attendant_operator_id
        type: string
        source: input
        description: "FK -> Operator.id; attendant stationed outside; must hold CSE_1 or CSE_2 certification and MUST differ from authorized_entrant_id."
      - name: entry_supervisor_id
        type: string
        source: input
        description: "FK -> Operator.id; supervisor authorizing the entry; MUST differ from entrant and attendant (segregation of duties)."
      - name: status
        type: enum
        source: computed
        description: Permit lifecycle.
        constraints: "One of {DRAFT, ISSUED, ACTIVE, SUSPENDED, CLOSED, CANCELLED}"
        default: "DRAFT"
      - name: issued_at
        type: datetime
        source: computed
        description: Timestamp the supervisor issued the permit.
      - name: valid_until
        type: datetime
        source: computed
        description: Expiry of the permit; issued_at + 12 hours.
      - name: closed_at
        type: datetime
        source: computed
        description: Timestamp the permit was closed after work completion.
      - name: gas_test_passed
        type: boolean
        source: input
        description: Whether pre-entry atmospheric testing passed.
        default: false

  - name: CapitalPlan
    parent: null
    common_fields: true
    fields:
      - name: plan_year
        type: integer
        source: input
        description: Four-digit planning year (e.g., 2027). Unique across CapitalPlan rows.
        constraints: "Unique; integer in [2024, 2100]"
      - name: status
        type: enum
        source: computed
        description: Lifecycle of the capital plan.
        constraints: "One of {DRAFT, RANKED, APPROVED, LOCKED}"
        default: "DRAFT"
      - name: budget_total_usd
        type: number
        source: input
        description: Total authorized budget for the plan year.
        constraints: "Number >= 0, two decimal places"
      - name: budget_allocated_usd
        type: number
        source: computed
        description: Sum of estimated_cost_usd of CapitalProject rows in {PROPOSED, RANKED, APPROVED} state attached to this plan.
      - name: budget_remaining_usd
        type: number
        source: computed
        description: budget_total_usd - budget_allocated_usd; floor at 0.00 for reporting, but raw value used for gating.
      - name: approved_at
        type: datetime
        source: computed
        description: Timestamp the plan entered APPROVED.

  - name: CapitalProject
    parent: CapitalPlan
    common_fields: true
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> CapitalPlan.id; the plan this project sits under."
      - name: station_id
        type: string
        source: input
        description: "FK -> LiftStation.id; the station whose asset is being replaced/upgraded."
      - name: project_name
        type: string
        source: input
        description: Human-readable title.
      - name: estimated_cost_usd
        type: number
        source: input
        description: Engineer's estimate in USD.
        constraints: "Number > 0, two decimal places"
      - name: risk_score
        type: number
        source: computed
        description: Composite risk score computed via capital_risk_score; ranges 0.00 - 100.00.
      - name: priority_rank
        type: integer
        source: computed
        description: 1-based rank within the parent CapitalPlan, computed by risk_score DESC with deterministic tie-break; assigned at RANKED transition.
      - name: status
        type: enum
        source: computed
        description: Lifecycle.
        constraints: "One of {PROPOSED, RANKED, APPROVED, REJECTED, DEFERRED, CANCELLED}"
        default: "PROPOSED"
      - name: consequence_of_failure
        type: integer
        source: input
        description: SME-scored consequence 1-10.
        constraints: "Integer in [1, 10]"
      - name: likelihood_of_failure
        type: integer
        source: input
        description: SME-scored likelihood 1-10.
        constraints: "Integer in [1, 10]"

  - name: SparePump
    parent: null
    common_fields: true
    fields:
      - name: asset_tag
        type: string
        source: input
        description: Warehouse asset tag. Unique across SparePump rows.
        constraints: "Unique; matches regex ^SP-[0-9]{4}$"
      - name: rated_gpm
        type: integer
        source: input
        description: Capacity of this spare.
      - name: compatible_zone
        type: string
        source: input
        description: Service zone the spare is certified to deploy into (must match LiftStation.service_zone).
      - name: status
        type: enum
        source: computed
        description: Spare lifecycle.
        constraints: "One of {AVAILABLE, RESERVED, DEPLOYED, REBUILD, RETIRED}"
        default: "AVAILABLE"
      - name: reserved_for_station_id
        type: string
        source: computed
        description: "FK -> LiftStation.id; station that currently holds the reservation when status is RESERVED."
      - name: deployed_at_station_id
        type: string
        source: computed
        description: "FK -> LiftStation.id; station the spare is currently deployed at when status is DEPLOYED."


# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: LiftStation
    initial_state: NORMAL
    terminal_states: []
    note: "Compound/posture-driven state derived from children. operational_posture is recomputed on every child mutation per calculation station_posture."
    transitions:
      - from: NORMAL
        to: DEGRADED
        trigger: "system (auto) — when firm_capacity_available_gpm < design_capacity_gpm OR any Pump at the station is in REBUILD OR any GeneratorTest in {SCHEDULED, RUNNING, FAILED} past scheduled_for"
        actor: system
        preconditions:
          - "firm_capacity_available_gpm < design_capacity_gpm OR exists Pump(status=REBUILD) OR exists GeneratorTest(status in {SCHEDULED,RUNNING,FAILED} AND scheduled_for < now())"
        side_effects:
          - "AlarmTicket creation with alarm_class=MAJOR auto-fires with alarm_code=STATION_DEGRADED"
          - "updated_at refreshed"
      - from: NORMAL
        to: EMERGENCY
        trigger: "system (auto) — when a SsoEvent is created with status=OPEN for the station"
        actor: system
        preconditions: ["exists SsoEvent(station_id=this, status=OPEN)"]
        side_effects:
          - "all SCHEDULED GeneratorTest rows for the station auto-transition to ABORTED"
          - "all DRAFT ConfinedSpacePermit rows for the station auto-transition to CANCELLED"
          - "updated_at refreshed"
      - from: DEGRADED
        to: EMERGENCY
        trigger: "system (auto) — when a SsoEvent is created with status=OPEN for the station"
        actor: system
        preconditions: ["exists SsoEvent(station_id=this, status=OPEN)"]
        side_effects:
          - "all SCHEDULED GeneratorTest rows auto-transition to ABORTED"
          - "all DRAFT ConfinedSpacePermit rows auto-transition to CANCELLED"
      - from: DEGRADED
        to: NORMAL
        trigger: "system (auto) — when all pumps IN_SERVICE or STANDBY, no overdue GeneratorTest, and firm_capacity_available_gpm >= design_capacity_gpm"
        actor: system
        preconditions: ["firm_capacity_available_gpm >= design_capacity_gpm AND no Pump(status=REBUILD) AND no GeneratorTest(status in {SCHEDULED,RUNNING,FAILED} AND scheduled_for < now())"]
        side_effects: ["updated_at refreshed"]
      - from: EMERGENCY
        to: DEGRADED
        trigger: "system (auto) — when all SsoEvent rows for the station leave {OPEN, UNDER_REVIEW-equivalent}"
        actor: system
        preconditions: ["no SsoEvent(station_id=this, status in {OPEN, CONTAINED, REPORT_DRAFT, REPORT_SUBMITTED})"]
        side_effects: ["updated_at refreshed"]
      - from: EMERGENCY
        to: NORMAL
        trigger: "system (auto) — when no SsoEvent open AND capacity restored"
        actor: system
        preconditions: ["no SsoEvent(station_id=this, status in {OPEN, CONTAINED, REPORT_DRAFT, REPORT_SUBMITTED}) AND firm_capacity_available_gpm >= design_capacity_gpm"]
        side_effects: ["updated_at refreshed"]
      - from: NORMAL
        to: FROZEN
        trigger: "POST /lift-station-ops/stations/{id}/freeze"
        actor: UtilityAdmin
        preconditions: ["no SsoEvent(station_id=this, status in {OPEN, CONTAINED, REPORT_DRAFT, REPORT_SUBMITTED})", "no ConfinedSpacePermit(station_id=this, status in {ISSUED, ACTIVE})"]
        side_effects:
          - "all SCHEDULED WetWellCleaning rows auto-transition to CANCELLED"
          - "all SCHEDULED GeneratorTest rows auto-transition to CANCELLED"
          - "updated_at refreshed"
      - from: FROZEN
        to: NORMAL
        trigger: "POST /lift-station-ops/stations/{id}/unfreeze"
        actor: UtilityAdmin
        preconditions: []
        side_effects: ["updated_at refreshed"]

  - entity: Pump
    initial_state: IN_SERVICE
    terminal_states: []
    note: "Cyclic state machine — IN_SERVICE -> REBUILD -> IN_SERVICE allowed."
    transitions:
      - from: IN_SERVICE
        to: STANDBY
        trigger: "POST /lift-station-ops/pumps/{id}/standby"
        actor: OperationsSupervisor
        preconditions: ["station.operational_posture != FROZEN"]
        side_effects:
          - "station.firm_capacity_available_gpm recomputed (calculation firm_capacity_n_minus_1)"
          - "station.operational_posture recomputed (calculation station_posture)"
      - from: STANDBY
        to: IN_SERVICE
        trigger: "POST /lift-station-ops/pumps/{id}/activate"
        actor: OperationsSupervisor
        preconditions: ["station.operational_posture != FROZEN"]
        side_effects:
          - "station.firm_capacity_available_gpm recomputed"
          - "station.operational_posture recomputed"
          - "pump.last_alternation_at set to now() if this pump becomes the lead (lowest position_index IN_SERVICE)"
      - from: IN_SERVICE
        to: OUT_OF_SERVICE
        trigger: "POST /lift-station-ops/pumps/{id}/mark-out-of-service"
        actor: OperationsSupervisor
        preconditions: ["station.operational_posture != FROZEN", "count of IN_SERVICE pumps at station > 1 (cannot strand station)"]
        side_effects:
          - "station.firm_capacity_available_gpm recomputed"
          - "station.operational_posture recomputed"
          - "AlarmTicket auto-fired with alarm_code=PUMP_OUT_OF_SERVICE, alarm_class=MAJOR"
      - from: OUT_OF_SERVICE
        to: IN_SERVICE
        trigger: "POST /lift-station-ops/pumps/{id}/activate"
        actor: OperationsSupervisor
        preconditions: ["station.operational_posture != FROZEN"]
        side_effects: ["station.firm_capacity_available_gpm recomputed", "station.operational_posture recomputed"]
      - from: IN_SERVICE
        to: REBUILD
        trigger: "POST /lift-station-ops/pump-rebuilds with pump_id"
        actor: MaintenancePlanner
        preconditions: ["station.operational_posture != FROZEN", "count of IN_SERVICE pumps at station > 1"]
        side_effects:
          - "station.firm_capacity_available_gpm recomputed"
          - "station.operational_posture recomputed"
      - from: REBUILD
        to: IN_SERVICE
        trigger: "POST /lift-station-ops/pump-rebuilds/{id}/complete"
        actor: MaintenancePlanner
        preconditions: ["PumpRebuild.status == IN_PROGRESS"]
        side_effects:
          - "pump.runtime_since_rebuild_hours reset to 0"
          - "pump.rebuild_count += 1"
          - "station.firm_capacity_available_gpm recomputed"
          - "station.operational_posture recomputed"

  - entity: AlarmTicket
    initial_state: OPEN
    terminal_states: [CLEARED, CANCELLED]
    note: "Branching state machine: OPEN -> ACKED -> DISPATCHED -> ON_SCENE -> CLEARED with cancel shortcuts."
    transitions:
      - from: OPEN
        to: ACKED
        trigger: "POST /lift-station-ops/alarm-tickets/{id}/ack"
        actor: OnCallOperator
        preconditions: ["station.operational_posture != FROZEN"]
        side_effects: ["ticket.acked_at = now()"]
      - from: OPEN
        to: CANCELLED
        trigger: "POST /lift-station-ops/alarm-tickets/{id}/cancel"
        actor: OnCallOperator
        preconditions: ["ticket.alarm_class != CRITICAL"]
        side_effects: ["ticket.assigned_operator_id cleared"]
      - from: ACKED
        to: DISPATCHED
        trigger: "POST /lift-station-ops/alarm-tickets/{id}/dispatch"
        actor: OnCallOperator
        preconditions:
          - "station.operational_posture != FROZEN"
          - "at least one Operator is eligible per operator_callout_selection"
        side_effects:
          - "ticket.assigned_operator_id set by calculation operator_callout_selection"
          - "ticket.dispatched_at = now()"
          - "operator.active_ticket_count += 1"
          - "operator.consecutive_callouts_24h += 1"
      - from: DISPATCHED
        to: ON_SCENE
        trigger: "POST /lift-station-ops/alarm-tickets/{id}/arrive"
        actor: Operator
        preconditions: ["X-User-ID == ticket.assigned_operator_id"]
        side_effects: []
      - from: ON_SCENE
        to: CLEARED
        trigger: "POST /lift-station-ops/alarm-tickets/{id}/clear"
        actor: Operator
        preconditions:
          - "X-User-ID == ticket.assigned_operator_id"
          - "if ticket.is_sso_related then exists SsoEvent(station_id=this.station_id, status in {CONTAINED, REPORT_DRAFT, REPORT_SUBMITTED, REPORT_ACCEPTED, CLOSED})"
        side_effects:
          - "ticket.cleared_at = now()"
          - "ticket.response_minutes = minutes(ticket.dispatched_at - ticket.raised_at)"
          - "operator.active_ticket_count -= 1"
      - from: ON_SCENE
        to: CANCELLED
        trigger: "POST /lift-station-ops/alarm-tickets/{id}/cancel"
        actor: OperationsSupervisor
        preconditions: ["ticket.alarm_class != CRITICAL"]
        side_effects:
          - "ticket.assigned_operator_id cleared"
          - "operator.active_ticket_count -= 1"

  - entity: PumpRebuild
    initial_state: OPEN
    terminal_states: [COMPLETED, CANCELLED]
    note: "Linear with cancel; completion drives pump state."
    transitions:
      - from: OPEN
        to: IN_PROGRESS
        trigger: "POST /lift-station-ops/pump-rebuilds/{id}/start"
        actor: MaintenancePlanner
        preconditions: ["pump.status == REBUILD"]
        side_effects:
          - "rebuild.pre_rebuild_runtime_hours = pump.runtime_since_rebuild_hours"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /lift-station-ops/pump-rebuilds/{id}/complete"
        actor: MaintenancePlanner
        preconditions: ["pump.status == REBUILD"]
        side_effects:
          - "rebuild.completed_at = now()"
          - "pump.status transitions REBUILD -> IN_SERVICE (drives Pump state machine)"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /lift-station-ops/pump-rebuilds/{id}/cancel"
        actor: MaintenancePlanner
        preconditions: []
        side_effects: ["pump.status transitions REBUILD -> OUT_OF_SERVICE"]
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /lift-station-ops/pump-rebuilds/{id}/cancel"
        actor: OperationsSupervisor
        preconditions: []
        side_effects: ["pump.status transitions REBUILD -> OUT_OF_SERVICE"]

  - entity: WetWellCleaning
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    note: "Branching: OVERDUE is a derived flag; OVERDUE -> COMPLETED allowed."
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /lift-station-ops/wet-well-cleanings/{id}/start"
        actor: Operator
        preconditions:
          - "station.operational_posture != FROZEN"
          - "if requires_confined_space_entry then exists ConfinedSpacePermit(station_id, status in {ISSUED, ACTIVE})"
        side_effects: []
      - from: SCHEDULED
        to: OVERDUE
        trigger: "system (auto) — when now() > scheduled_for + 24h and status == SCHEDULED"
        actor: system
        preconditions: ["now() > scheduled_for + 24h"]
        side_effects: ["AlarmTicket auto-fired alarm_code=CLEANING_OVERDUE, alarm_class=MINOR"]
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /lift-station-ops/wet-well-cleanings/{id}/complete"
        actor: Operator
        preconditions: ["station.operational_posture != FROZEN", "grease_depth_inches_post provided in request and < grease_depth_inches_pre"]
        side_effects:
          - "cleaning.completed_at = now()"
          - "cleaning.grease_depth_inches_post set"
      - from: OVERDUE
        to: IN_PROGRESS
        trigger: "POST /lift-station-ops/wet-well-cleanings/{id}/start"
        actor: Operator
        preconditions: ["station.operational_posture != FROZEN", "if requires_confined_space_entry then exists ConfinedSpacePermit(station_id, status in {ISSUED, ACTIVE})"]
        side_effects: []
      - from: OVERDUE
        to: COMPLETED
        trigger: "POST /lift-station-ops/wet-well-cleanings/{id}/complete"
        actor: Operator
        preconditions: ["station.operational_posture != FROZEN", "grease_depth_inches_post provided and < grease_depth_inches_pre"]
        side_effects: ["cleaning.completed_at = now()"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /lift-station-ops/wet-well-cleanings/{id}/cancel"
        actor: OperationsSupervisor
        preconditions: []
        side_effects: []
      - from: OVERDUE
        to: CANCELLED
        trigger: "POST /lift-station-ops/wet-well-cleanings/{id}/cancel"
        actor: OperationsSupervisor
        preconditions: []
        side_effects: []


  - entity: GeneratorTest
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED, ABORTED, CANCELLED]
    note: "Branching state machine with OVERDUE derivation."
    transitions:
      - from: SCHEDULED
        to: RUNNING
        trigger: "POST /lift-station-ops/generator-tests/{id}/start"
        actor: Operator
        preconditions: ["station.operational_posture != FROZEN AND station.operational_posture != EMERGENCY", "station.has_backup_generator == true"]
        side_effects: ["test.started_at = now()"]
      - from: RUNNING
        to: PASSED
        trigger: "POST /lift-station-ops/generator-tests/{id}/finish"
        actor: Operator
        preconditions: ["duration_minutes provided", "duration_minutes >= 30 for test_kind=LOAD_BANK OR >= 15 otherwise"]
        side_effects:
          - "test.duration_minutes set"
      - from: RUNNING
        to: FAILED
        trigger: "POST /lift-station-ops/generator-tests/{id}/fail"
        actor: Operator
        preconditions: []
        side_effects:
          - "AlarmTicket auto-fired alarm_code=GEN_TEST_FAILED, alarm_class=MAJOR"
          - "station.operational_posture recomputed"
      - from: RUNNING
        to: ABORTED
        trigger: "POST /lift-station-ops/generator-tests/{id}/abort"
        actor: Operator
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: OVERDUE
        trigger: "system (auto) — when now() > scheduled_for + 24h"
        actor: system
        preconditions: ["now() > scheduled_for + 24h"]
        side_effects: ["station.operational_posture recomputed"]
      - from: OVERDUE
        to: RUNNING
        trigger: "POST /lift-station-ops/generator-tests/{id}/start"
        actor: Operator
        preconditions: ["station.operational_posture != FROZEN AND station.operational_posture != EMERGENCY"]
        side_effects: ["test.started_at = now()"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /lift-station-ops/generator-tests/{id}/cancel"
        actor: OperationsSupervisor
        preconditions: []
        side_effects: []
      - from: OVERDUE
        to: CANCELLED
        trigger: "POST /lift-station-ops/generator-tests/{id}/cancel"
        actor: OperationsSupervisor
        preconditions: []
        side_effects: []

  - entity: SsoEvent
    initial_state: OPEN
    terminal_states: [REPORT_ACCEPTED, CLOSED]
    note: "Branching pipeline; failure to submit by deadline produces a compliance flag."
    transitions:
      - from: OPEN
        to: CONTAINED
        trigger: "POST /lift-station-ops/sso-events/{id}/contain"
        actor: Operator
        preconditions: ["station.operational_posture == EMERGENCY"]
        side_effects:
          - "sso.stopped_at = now()"
          - "sso.estimated_volume_gal computed via calculation sso_volume_estimate"
      - from: CONTAINED
        to: REPORT_DRAFT
        trigger: "POST /lift-station-ops/sso-events/{id}/draft-report"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: REPORT_DRAFT
        to: REPORT_SUBMITTED
        trigger: "POST /lift-station-ops/sso-events/{id}/submit-report"
        actor: ComplianceOfficer
        preconditions: ["now() <= sso.regulator_deadline_at OR escalated late submission with override_note"]
        side_effects:
          - "sso.report_submitted_at = now()"
      - from: REPORT_SUBMITTED
        to: REPORT_ACCEPTED
        trigger: "POST /lift-station-ops/sso-events/{id}/accept-report"
        actor: RegulatorPortal
        preconditions: []
        side_effects:
          - "sso.report_accepted_at = now()"
          - "station.last_sso_occurred_at recomputed"
      - from: REPORT_SUBMITTED
        to: REPORT_DRAFT
        trigger: "POST /lift-station-ops/sso-events/{id}/reject-report"
        actor: RegulatorPortal
        preconditions: []
        side_effects: []
      - from: REPORT_ACCEPTED
        to: CLOSED
        trigger: "POST /lift-station-ops/sso-events/{id}/close"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "station.last_sso_occurred_at recomputed"
          - "station.operational_posture recomputed"

  - entity: ConfinedSpacePermit
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    note: "Branching permit with segregation-of-duties gating."
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /lift-station-ops/confined-space-permits/{id}/issue"
        actor: Operator
        preconditions:
          - "X-User-ID == permit.entry_supervisor_id"
          - "permit.entry_supervisor_id != permit.authorized_entrant_id AND permit.entry_supervisor_id != permit.attendant_operator_id AND permit.authorized_entrant_id != permit.attendant_operator_id"
          - "permit.gas_test_passed == true"
          - "Operator(authorized_entrant_id).certifications contains one of {CSE_1, CSE_2}"
          - "Operator(attendant_operator_id).certifications contains one of {CSE_1, CSE_2}"
          - "station.operational_posture != FROZEN AND station.operational_posture != EMERGENCY"
        side_effects:
          - "permit.issued_at = now()"
          - "permit.valid_until = issued_at + 12h"
      - from: ISSUED
        to: ACTIVE
        trigger: "POST /lift-station-ops/confined-space-permits/{id}/activate"
        actor: Operator
        preconditions: ["now() < permit.valid_until"]
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /lift-station-ops/confined-space-permits/{id}/suspend"
        actor: Operator
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /lift-station-ops/confined-space-permits/{id}/activate"
        actor: Operator
        preconditions: ["now() < permit.valid_until"]
        side_effects: []
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /lift-station-ops/confined-space-permits/{id}/close"
        actor: Operator
        preconditions: ["X-User-ID == permit.entry_supervisor_id"]
        side_effects: ["permit.closed_at = now()"]
      - from: ISSUED
        to: CANCELLED
        trigger: "POST /lift-station-ops/confined-space-permits/{id}/cancel"
        actor: OperationsSupervisor
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /lift-station-ops/confined-space-permits/{id}/cancel OR system cascade on station EMERGENCY"
        actor: OperationsSupervisor
        preconditions: []
        side_effects: []

  - entity: CapitalPlan
    initial_state: DRAFT
    terminal_states: [LOCKED]
    note: "Linear with revert DRAFT<-RANKED."
    transitions:
      - from: DRAFT
        to: RANKED
        trigger: "POST /lift-station-ops/capital-plans/{id}/rank"
        actor: CapitalProgramManager
        preconditions: ["count of CapitalProject(plan_id=this, status=PROPOSED) >= 1"]
        side_effects:
          - "every CapitalProject with status=PROPOSED: priority_rank assigned by calculation capital_project_ranking; status transitions PROPOSED -> RANKED"
      - from: RANKED
        to: APPROVED
        trigger: "POST /lift-station-ops/capital-plans/{id}/approve"
        actor: UtilityAdmin
        preconditions: ["plan.budget_allocated_usd <= plan.budget_total_usd"]
        side_effects:
          - "plan.approved_at = now()"
          - "every CapitalProject with status=RANKED and priority_rank <= K (where K is the largest prefix such that cumulative estimated_cost_usd <= plan.budget_total_usd) transitions RANKED -> APPROVED; remaining RANKED transition RANKED -> DEFERRED"
      - from: APPROVED
        to: LOCKED
        trigger: "POST /lift-station-ops/capital-plans/{id}/lock"
        actor: UtilityAdmin
        preconditions: ["now() >= plan.approved_at + 7 days"]
        side_effects: []
      - from: RANKED
        to: DRAFT
        trigger: "POST /lift-station-ops/capital-plans/{id}/unrank"
        actor: CapitalProgramManager
        preconditions: []
        side_effects: ["every CapitalProject with status=RANKED: status reverts to PROPOSED, priority_rank cleared"]

  - entity: CapitalProject
    initial_state: PROPOSED
    terminal_states: [APPROVED, REJECTED, CANCELLED]
    note: "Lifecycle driven by parent CapitalPlan actions plus per-project reject/cancel."
    transitions:
      - from: PROPOSED
        to: RANKED
        trigger: "system (cascade from CapitalPlan DRAFT->RANKED)"
        actor: system
        preconditions: []
        side_effects: ["project.priority_rank assigned", "project.risk_score recomputed"]
      - from: RANKED
        to: APPROVED
        trigger: "system (cascade from CapitalPlan RANKED->APPROVED)"
        actor: system
        preconditions: ["cumulative estimated_cost_usd of projects with lower priority_rank + this project <= plan.budget_total_usd"]
        side_effects: ["plan.budget_allocated_usd recomputed"]
      - from: RANKED
        to: DEFERRED
        trigger: "system (cascade from CapitalPlan RANKED->APPROVED)"
        actor: system
        preconditions: ["cumulative estimated_cost_usd of projects with lower priority_rank + this project > plan.budget_total_usd"]
        side_effects: []
      - from: RANKED
        to: PROPOSED
        trigger: "system (cascade from CapitalPlan RANKED->DRAFT)"
        actor: system
        preconditions: []
        side_effects: ["project.priority_rank cleared"]
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /lift-station-ops/capital-projects/{id}/reject"
        actor: CapitalProgramManager
        preconditions: []
        side_effects: ["plan.budget_allocated_usd recomputed"]
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /lift-station-ops/capital-projects/{id}/cancel"
        actor: CapitalProgramManager
        preconditions: []
        side_effects: ["plan.budget_allocated_usd recomputed"]
      - from: DEFERRED
        to: PROPOSED
        trigger: "POST /lift-station-ops/capital-projects/{id}/resubmit"
        actor: CapitalProgramManager
        preconditions: ["plan.status == DRAFT"]
        side_effects: []

  - entity: SparePump
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    note: "Cyclic AVAILABLE<->RESERVED<->DEPLOYED."
    transitions:
      - from: AVAILABLE
        to: RESERVED
        trigger: "POST /lift-station-ops/spare-pumps/{id}/reserve"
        actor: MaintenancePlanner
        preconditions: ["spare.compatible_zone == station.service_zone"]
        side_effects: ["spare.reserved_for_station_id set"]
      - from: RESERVED
        to: DEPLOYED
        trigger: "POST /lift-station-ops/spare-pumps/{id}/deploy"
        actor: MaintenancePlanner
        preconditions: []
        side_effects:
          - "spare.deployed_at_station_id = reserved_for_station_id"
          - "spare.reserved_for_station_id cleared"
      - from: DEPLOYED
        to: AVAILABLE
        trigger: "POST /lift-station-ops/spare-pumps/{id}/return"
        actor: MaintenancePlanner
        preconditions: []
        side_effects: ["spare.deployed_at_station_id cleared"]
      - from: RESERVED
        to: AVAILABLE
        trigger: "POST /lift-station-ops/spare-pumps/{id}/release"
        actor: MaintenancePlanner
        preconditions: []
        side_effects: ["spare.reserved_for_station_id cleared"]
      - from: AVAILABLE
        to: REBUILD
        trigger: "POST /lift-station-ops/spare-pumps/{id}/send-to-rebuild"
        actor: MaintenancePlanner
        preconditions: []
        side_effects: []
      - from: REBUILD
        to: AVAILABLE
        trigger: "POST /lift-station-ops/spare-pumps/{id}/return"
        actor: MaintenancePlanner
        preconditions: []
        side_effects: []
      - from: AVAILABLE
        to: RETIRED
        trigger: "POST /lift-station-ops/spare-pumps/{id}/retire"
        actor: UtilityAdmin
        preconditions: []
        side_effects: []


# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: sso-event-create-stale-station
    parent_entity: LiftStation
    write_endpoint: "POST /lift-station-ops/stations/{id}/sso-events"
    occ_field: "expected_station_version"
    description: |
      Creating an SsoEvent against a LiftStation whose version has advanced since
      the client last observed it is rejected. Captures the case where another
      writer has just opened an SsoEvent (or mutated station state) and the
      current writer's view is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: alarm-ticket-dispatch-stale-ticket
    parent_entity: AlarmTicket
    write_endpoint: "POST /lift-station-ops/alarm-tickets/{id}/dispatch"
    occ_field: "expected_ticket_version"
    description: |
      Dispatching an AlarmTicket whose version has advanced since the client
      last observed it is rejected. Guards against double-dispatch when the
      ticket was already dispatched by another on-call operator.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: capital-plan-approve-stale-plan
    parent_entity: CapitalPlan
    write_endpoint: "POST /lift-station-ops/capital-plans/{id}/approve"
    occ_field: "expected_plan_version"
    description: |
      Approving a CapitalPlan whose version has advanced since the client last
      observed it is rejected. Two planners stepping the plan DRAFT -> RANKED ->
      APPROVED would otherwise double-approve.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: firm_capacity_n_minus_1
    trigger: "On every Pump.status mutation for a station; on Pump create/destroy; on Pump.rated_gpm edit"
    algorithm: aggregation
    formula: |
      IN_SERVICE_PUMPS = [p for p in Pump where p.station_id == station.id AND p.status == "IN_SERVICE"]
      if IN_SERVICE_PUMPS is empty:
        firm_capacity_available_gpm = 0
      else:
        total = sum(p.rated_gpm for p in IN_SERVICE_PUMPS)
        largest = max(p.rated_gpm for p in IN_SERVICE_PUMPS)
        firm_capacity_available_gpm = total - largest
    input_set: "All Pump rows for the station with status == IN_SERVICE; exclude STANDBY, OUT_OF_SERVICE, REBUILD"
    precision: "Integer gpm; no rounding"
    variants: []

  - name: station_posture
    trigger: "On every Pump/AlarmTicket/SsoEvent/ConfinedSpacePermit/GeneratorTest state change for a station; on explicit freeze/unfreeze actions"
    algorithm: constraint_propagation
    formula: |
      # FROZEN is sticky — driven by explicit POST /freeze and /unfreeze transitions (see LiftStation state machine).
      # This calculation derives NORMAL/DEGRADED/EMERGENCY when not FROZEN.
      if station.operational_posture == FROZEN:
        return FROZEN  # FROZEN persists until explicit unfreeze
      if any SsoEvent(station_id=this, status in {OPEN, CONTAINED, REPORT_DRAFT, REPORT_SUBMITTED}):
        return EMERGENCY
      if firm_capacity_available_gpm < design_capacity_gpm OR exists Pump(station_id=this, status=REBUILD) OR exists GeneratorTest(station_id=this, status in {SCHEDULED,RUNNING,FAILED} AND scheduled_for < now()):
        return DEGRADED
      return NORMAL
    input_set: "All child rows for the station; FROZEN status persists per LiftStation state machine freeze/unfreeze transitions"
    precision: "Discrete enum"
    variants: []

  - name: sso_volume_estimate
    trigger: "On SsoEvent OPEN -> CONTAINED transition (provisional) AND on REPORT_DRAFT -> REPORT_SUBMITTED (final, with regulator backflow correction)"
    algorithm: forward_looking
    formula: |
      duration_minutes = (stopped_at - started_at) / 60 (floor to integer minutes)
      station_capacity_gpm = station.firm_capacity_available_gpm (as computed at stopped_at)
      base_gal = duration_minutes * station_capacity_gpm
      if reached_surface_water:
        base_gal = base_gal * 1.20  # regulatory penalty multiplier for water-body reach
      estimated_volume_gal = round(base_gal, 0)
    input_set: "SsoEvent row; LiftStation row (firm capacity snapshot at stopped_at)"
    constants:
      SURFACE_WATER_MULTIPLIER: 1.20
    precision: "0 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "computed at CONTAINED transition"
        difference: "Uses firm_capacity_available_gpm at stopped_at; may differ from final because capacity can change before submission"
      - name: final
        when: "computed at REPORT_DRAFT -> REPORT_SUBMITTED"
        difference: "Recomputes with the capacity snapshot at submission time; writes the new value to estimated_volume_gal (overwriting provisional)"

  - name: operator_callout_selection
    trigger: "On AlarmTicket ACKED -> DISPATCHED transition"
    algorithm: weighted_scoring
    formula: |
      ELIGIBLE = [op for op in Operator where
        op.is_active == true
        AND op.active_ticket_count < 3
        AND (alarm_class == CRITICAL implies COLLECTIONS_2 in op.certifications)
      ]
      for op in ELIGIBLE:
        zone_match_score = 100 if op.home_zone == station.service_zone else 0
        load_score = -50 * op.active_ticket_count
        fairness_score = -10 * op.consecutive_callouts_24h
        op.callout_score = zone_match_score + load_score + fairness_score
      if ELIGIBLE is empty:
        raise ERR_NO_ELIGIBLE_OPERATOR
      winner = max(ELIGIBLE, key=lambda op: (op.callout_score, op.created_at ASC))
      return winner.id
    input_set: "All Operator rows where is_active == true; filter by active_ticket_count and (if alarm_class=CRITICAL) certifications"
    precision: "Integer score"
    variants: []

  - name: capital_risk_score
    trigger: "On CapitalProject create or field mutation; recomputed on CapitalPlan rank"
    algorithm: weighted_scoring
    formula: |
      base = consequence_of_failure * likelihood_of_failure
      if station.last_sso_occurred_at is not null and (now() - station.last_sso_occurred_at).days < 365:
        recency_bonus = 15
      else:
        recency_bonus = 0
      if station.has_backup_generator == false:
        resilience_bonus = 10
      else:
        resilience_bonus = 0
      age_years = (now() - station.created_at).days / 365.25
      age_score = min(25, floor(age_years))
      risk_score = round(min(100.0, base + recency_bonus + resilience_bonus + age_score), 2)
    input_set: "CapitalProject row + LiftStation row referenced by station_id"
    constants:
      RECENCY_BONUS: 15
      RESILIENCE_BONUS: 10
      AGE_SCORE_CAP: 25
    precision: "2 decimal places, round_half_up"
    variants: []

  - name: capital_project_ranking
    trigger: "On CapitalPlan DRAFT -> RANKED transition"
    algorithm: chronological
    formula: |
      PROJECTS = [p for p in CapitalProject where p.plan_id == plan.id AND p.status == PROPOSED]
      sort_key = (-p.risk_score, p.estimated_cost_usd ASC, p.created_at ASC, p.id ASC)
      ORDERED = sort(PROJECTS, by=sort_key)
      for idx, p in enumerate(ORDERED, start=1):
        p.priority_rank = idx
        p.status = RANKED
    input_set: "All CapitalProject rows for the plan with status=PROPOSED"
    precision: "Integer rank"
    variants: []

  - name: pump_alternation_selection
    trigger: "On POST /lift-station-ops/pumps/alternate or system-driven alternation tick"
    algorithm: threshold
    formula: |
      CANDIDATES = [p for p in Pump where p.station_id == station.id AND p.status == IN_SERVICE]
      if len(CANDIDATES) < 2:
        return null  # no alternation possible
      current_lead = min(CANDIDATES, key=lambda p: p.position_index)
      others = [p for p in CANDIDATES if p.id != current_lead.id]
      # choose pump with lowest runtime_since_rebuild_hours; tie-break by created_at ASC
      next_lead = min(others, key=lambda p: (p.runtime_since_rebuild_hours, p.created_at))
      if next_lead.runtime_since_rebuild_hours >= current_lead.runtime_since_rebuild_hours + ALTERNATION_THRESHOLD_HOURS:
        # swap positions
        current_lead.position_index, next_lead.position_index = next_lead.position_index, current_lead.position_index
        next_lead.last_alternation_at = now()
        return next_lead.id
      return null
    input_set: "All Pump rows for station with status == IN_SERVICE"
    constants:
      ALTERNATION_THRESHOLD_HOURS: 24.0
    precision: "Hours with 2-decimal comparison"
    variants: []

  - name: grease_accumulation_rate
    trigger: "On WetWellCleaning completion (grease_depth_inches_post set)"
    algorithm: decay_function
    formula: |
      # Historical rate in inches/day = sum of (grease_depth_inches_pre for completed cleanings) / sum of days since prior completed cleaning
      COMPLETED = [c for c in WetWellCleaning where c.station_id == station.id AND c.status == COMPLETED order by c.completed_at ASC]
      if len(COMPLETED) < 2:
        return null  # insufficient history
      total_inches = sum(c.grease_depth_inches_pre for c in COMPLETED[1:])  # skip first, it's the baseline
      days = (COMPLETED[-1].completed_at - COMPLETED[0].completed_at).days
      if days == 0:
        return null
      rate = total_inches / days
      return round(rate, 3)
    input_set: "All WetWellCleaning rows for the station with status == COMPLETED"
    precision: "3 decimal places, round_half_up"
    variants:
      - name: by_calendar_days
        when: "default"
        difference: "uses calendar-day difference between first and last completed_at"
      - name: by_operating_days
        when: "when station.is_24_7 == false"
        difference: "uses operating-day count from runtime telemetry"

  - name: next_cleaning_due
    trigger: "On WetWellCleaning completion OR on system tick"
    algorithm: forward_looking
    formula: |
      rate = grease_accumulation_rate(station)  # inches/day, by_calendar_days variant
      if rate is null or rate <= 0:
        return null
      last_cleaned_at = max(completed_at of WetWellCleaning where station_id == station.id AND status == COMPLETED)
      current_depth = latest grease_depth_inches_post
      target_depth = 6.0  # inches — action threshold
      days_to_target = (target_depth - current_depth) / rate
      return last_cleaned_at + days_to_target days
    input_set: "All WetWellCleaning rows for the station with status == COMPLETED"
    constants:
      TARGET_DEPTH_INCHES: 6.0
    precision: "Timestamp to the minute"

  - name: report_deadline
    trigger: "On SsoEvent create"
    algorithm: chronological
    formula: |
      base_deadline = started_at + 24h
      if reached_surface_water == true:
        return started_at + 12h
      return base_deadline
    input_set: "SsoEvent fields started_at, reached_surface_water"
    constants:
      STANDARD_DEADLINE_HOURS: 24
      SURFACE_WATER_DEADLINE_HOURS: 12
    precision: "Timestamp to the second"


# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header is present and one of the roles declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-ID header is present and a non-empty string"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 3
    category: auth
    check: "Role declared in X-User-Role is authorized for this endpoint per §1.5 roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Path-templated resource ids resolve to existing rows (left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 5
    category: existence
    check: "Body-provided FK fields (station_id, pump_id, plan_id, operator ids, etc.) resolve to existing rows"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 422
    applies_to: "POST endpoints with FK inputs"

  - priority: 6
    category: state
    check: "Target entity is in a state permitted by the requested transition per §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "action endpoints (POST /<resource>/{id}/<action>)"

  - priority: 7
    category: state
    check: "Parent LiftStation.operational_posture permits child mutations (FROZEN blocks; EMERGENCY blocks non-critical writes)"
    error_id: ERR_STATION_FROZEN
    http_status: 409
    applies_to: "all POST/PUT/PATCH under /lift-station-ops/stations/{id}/... and any child mutation referencing station_id"

  - priority: 8
    category: business_safety
    check: "Pump OUT_OF_SERVICE / REBUILD transition must leave at least one IN_SERVICE pump at the station (firm-capacity N>=1)"
    error_id: ERR_FIRM_CAPACITY_VIOLATION
    http_status: 422
    applies_to: "POST /lift-station-ops/pumps/{id}/mark-out-of-service, POST /lift-station-ops/pump-rebuilds"

  - priority: 9
    category: business_safety
    check: "ConfinedSpacePermit segregation of duties — entry_supervisor_id != authorized_entrant_id != attendant_operator_id"
    error_id: ERR_SEGREGATION_OF_DUTIES_VIOLATION
    http_status: 422
    applies_to: "POST /lift-station-ops/confined-space-permits, POST /lift-station-ops/confined-space-permits/{id}/issue"

  - priority: 10
    category: business_safety
    check: "ConfinedSpacePermit entrant and attendant both hold CSE_1 or CSE_2 certification"
    error_id: ERR_INSUFFICIENT_CERTIFICATION
    http_status: 422
    applies_to: "POST /lift-station-ops/confined-space-permits, POST /lift-station-ops/confined-space-permits/{id}/issue"

  - priority: 11
    category: business_safety
    check: "ConfinedSpacePermit gas_test_passed == true at ISSUE time"
    error_id: ERR_GAS_TEST_REQUIRED
    http_status: 422
    applies_to: "POST /lift-station-ops/confined-space-permits/{id}/issue"

  - priority: 12
    category: business_constraint
    check: "Pump.position_index unique per (station_id) and within [1, station.pump_count]"
    error_id: ERR_DUPLICATE_POSITION
    http_status: 422
    applies_to: "POST /lift-station-ops/pumps"

  - priority: 13
    category: business_constraint
    check: "LiftStation.station_code unique across LiftStation rows; matches ^LS-[0-9]{4}$"
    error_id: ERR_DUPLICATE_STATION_CODE
    http_status: 422
    applies_to: "POST /lift-station-ops/stations"

  - priority: 14
    category: business_constraint
    check: "Operator.employee_code unique across Operator rows"
    error_id: ERR_DUPLICATE_EMPLOYEE_CODE
    http_status: 422
    applies_to: "POST /lift-station-ops/operators"

  - priority: 15
    category: business_constraint
    check: "CapitalPlan.plan_year unique across CapitalPlan rows"
    error_id: ERR_DUPLICATE_PLAN_YEAR
    http_status: 422
    applies_to: "POST /lift-station-ops/capital-plans"

  - priority: 16
    category: business_constraint
    check: "SparePump.asset_tag unique across SparePump rows"
    error_id: ERR_DUPLICATE_ASSET_TAG
    http_status: 422
    applies_to: "POST /lift-station-ops/spare-pumps"

  - priority: 17
    category: business_constraint
    check: "SparePump reservation requires compatible_zone == station.service_zone"
    error_id: ERR_ZONE_MISMATCH
    http_status: 422
    applies_to: "POST /lift-station-ops/spare-pumps/{id}/reserve"

  - priority: 18
    category: business_temporal
    check: "GeneratorTest duration_minutes >= 30 when test_kind=LOAD_BANK; >= 15 otherwise"
    error_id: ERR_TEST_DURATION_TOO_SHORT
    http_status: 422
    applies_to: "POST /lift-station-ops/generator-tests/{id}/finish"

  - priority: 19
    category: business_temporal
    check: "RuntimeReading.recorded_at must be >= prior reading's recorded_at for the same pump (no out-of-order readings)"
    error_id: ERR_READING_OUT_OF_ORDER
    http_status: 422
    applies_to: "POST /lift-station-ops/pumps/{id}/runtime-readings"

  - priority: 20
    category: business_temporal
    check: "WetWellCleaning grease_depth_inches_post must be < grease_depth_inches_pre"
    error_id: ERR_GREASE_DEPTH_INVALID
    http_status: 422
    applies_to: "POST /lift-station-ops/wet-well-cleanings/{id}/complete"

  - priority: 21
    category: business_temporal
    check: "SsoEvent report submission must occur on or before regulator_deadline_at unless override_note provided"
    error_id: ERR_REPORT_DEADLINE_MISSED
    http_status: 422
    applies_to: "POST /lift-station-ops/sso-events/{id}/submit-report"

  - priority: 22
    category: business_referential
    check: "AlarmTicket clear requires (if is_sso_related) a non-OPEN SsoEvent for the station"
    error_id: ERR_SSO_EVENT_OPEN
    http_status: 422
    applies_to: "POST /lift-station-ops/alarm-tickets/{id}/clear"

  - priority: 23
    category: business_referential
    check: "WetWellCleaning start requires (if requires_confined_space_entry) an ISSUED or ACTIVE ConfinedSpacePermit for the station"
    error_id: ERR_PERMIT_REQUIRED
    http_status: 422
    applies_to: "POST /lift-station-ops/wet-well-cleanings/{id}/start"

  - priority: 24
    category: business_referential
    check: "ConfinedSpacePermit activate requires now() < valid_until"
    error_id: ERR_PERMIT_EXPIRED
    http_status: 422
    applies_to: "POST /lift-station-ops/confined-space-permits/{id}/activate"

  - priority: 25
    category: business_referential
    check: "CapitalPlan approve requires budget_allocated_usd <= budget_total_usd"
    error_id: ERR_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /lift-station-ops/capital-plans/{id}/approve"

  - priority: 26
    category: business_fiscal
    check: "CapitalPlan lock requires at least 7 days since approved_at"
    error_id: ERR_PLAN_NOT_SETTLED
    http_status: 422
    applies_to: "POST /lift-station-ops/capital-plans/{id}/lock"

  - priority: 27
    category: business_fiscal
    check: "CapitalProject reject/cancel allowed only when plan.status != LOCKED"
    error_id: ERR_PLAN_LOCKED
    http_status: 409
    applies_to: "POST /lift-station-ops/capital-projects/{id}/reject, POST /lift-station-ops/capital-projects/{id}/cancel"

  - priority: 28
    category: business_constraint
    check: "Operator dispatch requires at least one eligible operator per operator_callout_selection; empty pool raises this"
    error_id: ERR_NO_ELIGIBLE_OPERATOR
    http_status: 422
    applies_to: "POST /lift-station-ops/alarm-tickets/{id}/dispatch"

  - priority: 29
    category: business_constraint
    check: "Operator dispatch on CRITICAL alarm requires operator holds COLLECTIONS_2 cert"
    error_id: ERR_NO_ELIGIBLE_OPERATOR
    http_status: 422
    applies_to: "POST /lift-station-ops/alarm-tickets/{id}/dispatch"

  - priority: 30
    category: business_constraint
    check: "Required-field presence and basic shape (non-empty strings, numeric ranges, enum membership) — covers all input fields"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"


# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- stations ----
  - method: POST
    path: "/lift-station-ops/stations"
    description: "Create a LiftStation."
    roles: [UtilityAdmin]
    code: 201
    input: [station_code, service_zone, design_capacity_gpm, pump_count, has_backup_generator, wet_well_volume_gal]
    output: LiftStation
    side_effects: []
  - method: GET
    path: "/lift-station-ops/stations"
    description: "List LiftStations."
    roles: [UtilityAdmin, OperationsSupervisor, OnCallOperator, Operator, MaintenancePlanner, ComplianceOfficer, CapitalProgramManager]
    code: 200
    input: ["service_zone?", "operational_posture?", "limit?", "offset?"]
    output: "LiftStation[]"
    side_effects: []
  - method: GET
    path: "/lift-station-ops/stations/{id}"
    description: "Fetch a LiftStation."
    roles: [UtilityAdmin, OperationsSupervisor, OnCallOperator, Operator, MaintenancePlanner, ComplianceOfficer, CapitalProgramManager]
    code: 200
    input: []
    output: LiftStation
    side_effects: []
  - method: POST
    path: "/lift-station-ops/stations/{id}/freeze"
    description: "Freeze the station (posture -> FROZEN); cancels scheduled cleaning and generator tests."
    roles: [UtilityAdmin]
    code: 200
    input: []
    output: LiftStation
    side_effects: ["SCHEDULED WetWellCleaning rows -> CANCELLED", "SCHEDULED GeneratorTest rows -> CANCELLED", "increments LiftStation.version by 1"]
  - method: POST
    path: "/lift-station-ops/stations/{id}/unfreeze"
    description: "Unfreeze the station (posture recomputed)."
    roles: [UtilityAdmin]
    code: 200
    input: []
    output: LiftStation
    side_effects: ["increments LiftStation.version by 1"]

  # ---- pumps ----
  - method: POST
    path: "/lift-station-ops/pumps"
    description: "Register a Pump at a station."
    roles: [MaintenancePlanner, UtilityAdmin]
    code: 201
    input: [station_id, position_index, rated_gpm, "status?"]
    output: Pump
    side_effects: ["station.firm_capacity_available_gpm recomputed", "station.operational_posture recomputed"]
  - method: GET
    path: "/lift-station-ops/pumps"
    description: "List Pumps, filterable by station_id, status."
    roles: [UtilityAdmin, OperationsSupervisor, OnCallOperator, Operator, MaintenancePlanner]
    code: 200
    input: ["station_id?", "status?", "limit?", "offset?"]
    output: "Pump[]"
    side_effects: []
  - method: GET
    path: "/lift-station-ops/stations/{id}/pumps"
    description: "Sub-resource list of Pumps for a station."
    roles: [UtilityAdmin, OperationsSupervisor, OnCallOperator, Operator, MaintenancePlanner]
    code: 200
    input: ["limit?", "offset?"]
    output: "Pump[]"
    side_effects: []
  - method: GET
    path: "/lift-station-ops/pumps/{id}"
    description: "Fetch a Pump."
    roles: [UtilityAdmin, OperationsSupervisor, OnCallOperator, Operator, MaintenancePlanner]
    code: 200
    input: []
    output: Pump
    side_effects: []
  - method: POST
    path: "/lift-station-ops/pumps/{id}/standby"
    description: "Transition pump IN_SERVICE -> STANDBY."
    roles: [OperationsSupervisor]
    code: 200
    input: []
    output: Pump
    side_effects: ["station.firm_capacity_available_gpm recomputed", "station.operational_posture recomputed"]
  - method: POST
    path: "/lift-station-ops/pumps/{id}/activate"
    description: "Transition pump (STANDBY | OUT_OF_SERVICE) -> IN_SERVICE."
    roles: [OperationsSupervisor]
    code: 200
    input: []
    output: Pump
    side_effects: ["station.firm_capacity_available_gpm recomputed", "station.operational_posture recomputed"]
  - method: POST
    path: "/lift-station-ops/pumps/{id}/mark-out-of-service"
    description: "Transition pump IN_SERVICE -> OUT_OF_SERVICE."
    roles: [OperationsSupervisor]
    code: 200
    input: []
    output: Pump
    side_effects: ["AlarmTicket auto-fired with alarm_code=PUMP_OUT_OF_SERVICE", "station.firm_capacity_available_gpm recomputed", "station.operational_posture recomputed"]
  - method: POST
    path: "/lift-station-ops/pumps/alternate"
    description: "Run pump alternation selection at a station; swaps lead/lag if threshold crossed."
    roles: [OperationsSupervisor, UtilityAdmin]
    code: 200
    input: [station_id]
    output: Pump
    side_effects: ["lead and lag position_index swap; last_alternation_at updated"]

  # ---- runtime readings ----
  - method: POST
    path: "/lift-station-ops/pumps/{id}/runtime-readings"
    description: "Ingest a RuntimeReading for a pump (SCADA/manual/backfill)."
    roles: [Operator, ScadaWebhook, UtilityAdmin]
    code: 201
    input: [recorded_at, run_hours_delta, starts_count, source]
    output: RuntimeReading
    side_effects: ["pump.cumulative_runtime_hours += run_hours_delta", "pump.runtime_since_rebuild_hours += run_hours_delta"]
  - method: GET
    path: "/lift-station-ops/pumps/{id}/runtime-readings"
    description: "List runtime readings for a pump."
    roles: [UtilityAdmin, OperationsSupervisor, OnCallOperator, Operator, MaintenancePlanner]
    code: 200
    input: ["since?", "until?", "limit?", "offset?"]
    output: "RuntimeReading[]"
    side_effects: []


  # ---- operators ----
  - method: POST
    path: "/lift-station-ops/operators"
    description: "Create an Operator."
    roles: [UtilityAdmin]
    code: 201
    input: [employee_code, full_name, certifications, home_zone]
    output: Operator
    side_effects: []
  - method: GET
    path: "/lift-station-ops/operators"
    description: "List Operators."
    roles: [UtilityAdmin, OperationsSupervisor, OnCallOperator, MaintenancePlanner]
    code: 200
    input: ["is_active?", "home_zone?", "limit?", "offset?"]
    output: "Operator[]"
    side_effects: []
  - method: GET
    path: "/lift-station-ops/operators/{id}"
    description: "Fetch an Operator."
    roles: [UtilityAdmin, OperationsSupervisor, OnCallOperator, MaintenancePlanner]
    code: 200
    input: []
    output: Operator
    side_effects: []

  # ---- alarm tickets ----
  - method: POST
    path: "/lift-station-ops/stations/{id}/alarm-tickets"
    description: "Raise an AlarmTicket at a station."
    roles: [ScadaWebhook, OnCallOperator, UtilityAdmin]
    code: 201
    input: [alarm_class, alarm_code, raised_at, "is_sso_related?"]
    output: AlarmTicket
    side_effects: ["increments LiftStation.version by 1"]
  - method: GET
    path: "/lift-station-ops/stations/{id}/alarm-tickets"
    description: "Sub-resource list of AlarmTickets for a station."
    roles: [UtilityAdmin, OperationsSupervisor, OnCallOperator, Operator, ComplianceOfficer]
    code: 200
    input: ["status?", "alarm_class?", "limit?", "offset?"]
    output: "AlarmTicket[]"
    side_effects: []
  - method: GET
    path: "/lift-station-ops/alarm-tickets"
    description: "Filtered list of AlarmTickets."
    roles: [UtilityAdmin, OperationsSupervisor, OnCallOperator, Operator, ComplianceOfficer]
    code: 200
    input: ["station_id?", "assigned_operator_id?", "status?", "alarm_class?", "limit?", "offset?"]
    output: "AlarmTicket[]"
    side_effects: []
  - method: GET
    path: "/lift-station-ops/alarm-tickets/{id}"
    description: "Fetch an AlarmTicket."
    roles: [UtilityAdmin, OperationsSupervisor, OnCallOperator, Operator, ComplianceOfficer]
    code: 200
    input: []
    output: AlarmTicket
    side_effects: []
  - method: POST
    path: "/lift-station-ops/alarm-tickets/{id}/ack"
    description: "Acknowledge an OPEN ticket."
    roles: [OnCallOperator]
    code: 200
    input: []
    output: AlarmTicket
    side_effects: ["ticket.acked_at set"]
  - method: POST
    path: "/lift-station-ops/alarm-tickets/{id}/dispatch"
    description: "Dispatch the ticket — picks the callout winner via operator_callout_selection. OCC guarded by expected_ticket_version."
    roles: [OnCallOperator]
    code: 200
    input: [expected_ticket_version]
    output: AlarmTicket
    side_effects: ["ticket.assigned_operator_id set", "ticket.dispatched_at set", "operator.active_ticket_count += 1", "operator.consecutive_callouts_24h += 1", "increments AlarmTicket.version by 1"]
  - method: POST
    path: "/lift-station-ops/alarm-tickets/{id}/arrive"
    description: "Mark ticket ON_SCENE."
    roles: [Operator]
    code: 200
    input: []
    output: AlarmTicket
    side_effects: []
  - method: POST
    path: "/lift-station-ops/alarm-tickets/{id}/clear"
    description: "Clear an ON_SCENE ticket."
    roles: [Operator]
    code: 200
    input: []
    output: AlarmTicket
    side_effects: ["ticket.cleared_at set", "ticket.response_minutes computed", "operator.active_ticket_count -= 1"]
  - method: POST
    path: "/lift-station-ops/alarm-tickets/{id}/cancel"
    description: "Cancel a ticket."
    roles: [OnCallOperator, OperationsSupervisor]
    code: 200
    input: []
    output: AlarmTicket
    side_effects: ["operator.active_ticket_count adjusted if assigned"]

  # ---- pump rebuilds ----
  - method: POST
    path: "/lift-station-ops/pump-rebuilds"
    description: "Open a PumpRebuild; drives the Pump IN_SERVICE -> REBUILD transition."
    roles: [MaintenancePlanner]
    code: 201
    input: [pump_id, work_order_ref, started_at, cost_usd]
    output: PumpRebuild
    side_effects: ["pump.status -> REBUILD", "station.firm_capacity_available_gpm recomputed", "station.operational_posture recomputed"]
  - method: GET
    path: "/lift-station-ops/pump-rebuilds"
    description: "Filtered list of PumpRebuilds."
    roles: [UtilityAdmin, OperationsSupervisor, MaintenancePlanner]
    code: 200
    input: ["pump_id?", "status?", "limit?", "offset?"]
    output: "PumpRebuild[]"
    side_effects: []
  - method: GET
    path: "/lift-station-ops/pumps/{id}/rebuilds"
    description: "Sub-resource list of PumpRebuilds for a pump."
    roles: [UtilityAdmin, OperationsSupervisor, MaintenancePlanner]
    code: 200
    input: ["limit?", "offset?"]
    output: "PumpRebuild[]"
    side_effects: []
  - method: GET
    path: "/lift-station-ops/pump-rebuilds/{id}"
    description: "Fetch a PumpRebuild."
    roles: [UtilityAdmin, OperationsSupervisor, MaintenancePlanner]
    code: 200
    input: []
    output: PumpRebuild
    side_effects: []
  - method: POST
    path: "/lift-station-ops/pump-rebuilds/{id}/start"
    description: "Transition rebuild OPEN -> IN_PROGRESS."
    roles: [MaintenancePlanner]
    code: 200
    input: []
    output: PumpRebuild
    side_effects: ["rebuild.pre_rebuild_runtime_hours snapshotted"]
  - method: POST
    path: "/lift-station-ops/pump-rebuilds/{id}/complete"
    description: "Transition rebuild IN_PROGRESS -> COMPLETED; pump REBUILD -> IN_SERVICE."
    roles: [MaintenancePlanner]
    code: 200
    input: []
    output: PumpRebuild
    side_effects: ["rebuild.completed_at set", "pump.runtime_since_rebuild_hours reset to 0", "pump.rebuild_count += 1"]
  - method: POST
    path: "/lift-station-ops/pump-rebuilds/{id}/cancel"
    description: "Cancel the rebuild; pump transitions REBUILD -> OUT_OF_SERVICE."
    roles: [MaintenancePlanner, OperationsSupervisor]
    code: 200
    input: []
    output: PumpRebuild
    side_effects: ["pump.status -> OUT_OF_SERVICE"]


  # ---- wet-well cleanings ----
  - method: POST
    path: "/lift-station-ops/stations/{id}/wet-well-cleanings"
    description: "Schedule a wet-well cleaning at a station."
    roles: [MaintenancePlanner, OperationsSupervisor]
    code: 201
    input: [scheduled_for, grease_depth_inches_pre, crew_lead_operator_id, requires_confined_space_entry]
    output: WetWellCleaning
    side_effects: []
  - method: GET
    path: "/lift-station-ops/stations/{id}/wet-well-cleanings"
    description: "Sub-resource list of cleanings for a station."
    roles: [UtilityAdmin, OperationsSupervisor, Operator, MaintenancePlanner]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "WetWellCleaning[]"
    side_effects: []
  - method: GET
    path: "/lift-station-ops/wet-well-cleanings"
    description: "Filtered list of cleanings."
    roles: [UtilityAdmin, OperationsSupervisor, Operator, MaintenancePlanner]
