  - name: error_empty_distribution_pool
    claim_type: violation_to_error
    grounds:
    - errors[ERR_EMPTY_DISTRIBUTION_POOL]
    - validations[priority=22]
    distinguishing_aspect: A distribution window containing no FINALIZED invoices is rejected 422 ERR_EMPTY_DISTRIBUTION_POOL.
    test_recipe:
      setup:
      - empty DB (no invoices at all)
      setup_api_calls: []
      trigger:
      - call: POST /pilotage/distribution-runs
        payload:
          period_start: '2026-08-01T00:00:00Z'
          period_end: '2026-08-02T00:00:00Z'
        as: FinanceOfficer
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_EMPTY_DISTRIBUTION_POOL
  - name: error_period_overlap_and_adjacency_allowed
    claim_type: violation_to_error
    grounds:
    - errors[ERR_PERIOD_OVERLAP]
    - validations[priority=21]
    distinguishing_aspect: 'Half-open window semantics: [08-01T12:00Z, 08-03T00:00Z) overlaps the existing [08-01T00:00Z, 08-02T00:00Z) run -> 409; the adjacent window [08-02T00:00Z, 08-03T00:00Z) passes
      the overlap check and fails only on the empty pool.'
    test_recipe:
      setup:
      - MAIN_TARIFF active; P1 endorsed; boat BA; one FINALIZED invoice in [08-01, 08-02); run R1 COMPUTED over that window
      setup_api_calls:
      - call: POST /pilotage/tariff-schedules
        payload:
          effective_from: '2026-01-01T00:00:00Z'
          tiers:
          - min_gt_exclusive: 0
            max_gt_inclusive: 5000
            rate_cents_per_gt: 20
          draft_surcharge_threshold_dm: 100
          draft_surcharge_pct: 0.15
          detention_free_minutes: 30
          detention_rate_cents_per_minute: 200
          delay_rate_cents_per_minute: 150
        as: AssociationAdmin
      - call: POST /pilotage/pilots
        payload:
          full_name: Pilot One
          license_number: LIC-1
          share_units: 1
        as: AssociationAdmin
        captures:
          p1_id: $.data.id
          p1_v: $.data.version
      - call: POST /pilotage/pilots/${p1_id}/endorsements
        payload:
          endorsement_class: UNLIMITED
          tonnage_cap_gt: 100000
          expires_at: '2027-01-01T00:00:00Z'
          expected_pilot_version: ${p1_v}
        as: AssociationAdmin
      - call: POST /pilotage/pilot-boats
        payload:
          name: Boat A
          capacity_persons: 6
        as: AssociationAdmin
      - call: POST /pilotage/vessel-orders
        payload:
          vessel_name: MV One
          gt: 8000
          draft_dm: 90
          order_type: ARRIVAL
          eta: '2026-08-10T00:00:00Z'
        as: VesselAgent
        as_user_id: agent-1
        captures:
          o1_id: $.data.id
      - call: POST /pilotage/vessel-orders/${o1_id}/dispatch
        payload:
          scheduled_start: '2026-08-10T10:00:00Z'
          scheduled_end: '2026-08-10T11:00:00Z'
        as: Dispatcher
        captures:
          a1_id: $.data.id
      - call: POST /pilotage/assignments/${a1_id}/start
        payload: {}
        as: Pilot
        as_user_id: ${p1_id}
      - call: POST /pilotage/assignments/${a1_id}/board
        payload: {}
        as: Pilot
        as_user_id: ${p1_id}
      - call: POST /pilotage/assignments/${a1_id}/complete
        payload:
          detention_minutes: 0
          delay_minutes: 0
        as: Pilot
        as_user_id: ${p1_id}
      - call: GET /pilotage/invoices
        payload:
          assignment_id: ${a1_id}
        as: FinanceOfficer
        captures:
          i1_id: $.data[0].id
      - call: POST /pilotage/invoices/${i1_id}/finalize
        payload: {}
        as: FinanceOfficer
      - call: POST /pilotage/distribution-runs
        payload:
          period_start: '2026-08-01T00:00:00Z'
          period_end: '2026-08-02T00:00:00Z'
        as: FinanceOfficer
        captures:
          r1_id: $.data.id
      trigger:
      - call: POST /pilotage/distribution-runs
        payload:
          period_start: '2026-08-01T12:00:00Z'
          period_end: '2026-08-03T00:00:00Z'
        as: FinanceOfficer
        captures:
          err_ov: $.data.error_id
      - call: POST /pilotage/distribution-runs
        payload:
          period_start: '2026-08-02T00:00:00Z'
          period_end: '2026-08-03T00:00:00Z'
        as: FinanceOfficer
        captures:
          err_adj: $.data.error_id
      assert:
      - err_ov == ERR_PERIOD_OVERLAP (409)
      - err_adj == ERR_EMPTY_DISTRIBUTION_POOL (adjacency passed the overlap check; only the pool rule fires)
  - name: error_exam_not_passed_then_certified
    claim_type: violation_to_error
    grounds:
    - errors[ERR_EXAM_NOT_PASSED]
    - state_machines.Apprentice
    distinguishing_aspect: 'QUALIFIED -> CERTIFIED requires exam_result PASS: FAIL keeps the apprentice QUALIFIED with 422; a subsequent PASS certifies.'
    test_recipe:
      setup:
      - Apprentice AX QUALIFIED (50 trips logged, advanced once)
      setup_api_calls:
      - call: POST /pilotage/apprentices
        payload:
          full_name: App X
          track: STANDARD
        as: AssociationAdmin
        captures:
          ax_id: $.data.id
      - call: POST /pilotage/apprentices/${ax_id}/record-progress
        payload:
          trips_delta: 50
          evaluation_score: 70
        as: AssociationAdmin
      - call: POST /pilotage/apprentices/${ax_id}/advance
        payload: {}
        as: AssociationAdmin
      trigger:
      - call: POST /pilotage/apprentices/${ax_id}/advance
        payload:
          exam_result: FAIL
        as: AssociationAdmin
        captures:
          err: $.data.error_id
      - call: POST /pilotage/apprentices/${ax_id}/advance
        payload:
          exam_result: PASS
        as: AssociationAdmin
        captures:
          st: $.data.status
      assert:
      - err == ERR_EXAM_NOT_PASSED
      - st == CERTIFIED
  - name: error_incident_hold_active_covered
    claim_type: violation_to_error
    grounds:
    - errors[ERR_INCIDENT_HOLD_ACTIVE]
    excluded_because:
      difficulty_instance: invoice_finalize_blocked_by_open_incident
      rationale: Asserted as the failure path of the named §1.8 instance.
