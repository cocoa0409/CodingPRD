          - validations.priority_4.ERR_NOT_RESOURCE_OWNER
          - roles.OutfitterRepresentative.identity
          - errors.ERR_PERMIT_NOT_FOUND
          - errors.ERR_NOT_RESOURCE_OWNER
        distinguishing_aspect: |
          CATEGORY PAIR: existence (priority 3, 404) versus ownership (priority 4, 403) — an
          auth-adjacent pair no other instance covers, and the only conflict here where the
          higher-priority rule leaks LESS information than the lower one. A representative of one
          outfitter aiming at a nonexistent permit id must be told the permit does not exist rather
          than that it is not theirs, and the ownership rule must still bite on a real permit
          belonging to a different outfitter, which proves the 404 is not a blanket response.
