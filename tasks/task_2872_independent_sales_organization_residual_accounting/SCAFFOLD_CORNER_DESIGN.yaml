            - "${sv2} == ${sv1} + 1 (the PROPOSED sibling alone moved it) and the retry with ${sv2} returns 201 (${adj2})"
            - "the approve of ${adj1} sets state APPLIED, adjustment_cents 500 and net_payable_cents 6800 while lifecycle_state stays DRAFT, and bumps the statement version a third time"
            - "${e2} == ERR_STALE_STATEMENT_VERSION — the approval's recompute invalidated ${sv2}, which the second proposal had already consumed anyway"
            - "GET /statement-adjustments?statement_id=${st} returns total_count 2 (${adj1} APPLIED, ${adj2} PROPOSED) — neither 412 left a row behind"

      - name: attrition_threshold_is_inclusive_and_recrosses_in_both_directions
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.agent_portfolio_attrition_bps
          - constants.ATTRITION_HOLD_THRESHOLD_BPS
        distinguishing_aspect: "The instantaneous threshold is inclusive at exactly 2500 bps, and its denominator counts only ACTIVE + ATTRITED merchants, so a PENDING merchant sitting in the portfolio does NOT dilute the ratio even though portfolio_merchant_count includes it. Activating that PENDING merchant later moves the same one attrition from 2500 bps to 2000 bps and clears the hold — the threshold is re-evaluated on every membership change, not latched."
        test_recipe:
          setup: ["Agent A1 with four ACTIVE merchants plus one left PENDING; agent A2 with five ACTIVE merchants. No statements exist, so nothing else can set a hold."]
          setup_api_calls:
            - call: "POST /processor-programs"
              payload: { name: "Atlantic Net Program", buy_rate_bps: 45, buy_rate_per_item_cents: 6, assessment_bps: 13, normalization_mode: "NET_REVENUE_SPLIT", minimum_billing_mode: "NO_MINIMUM" }
              as: IsoAdmin
              captures: { p1: $.data.id }
            - call: "POST /agents"
              payload: { name: "A1 Four Plus Pending", split_pct: 0.50, override_pct: 0.60, vesting_start_date: "2024-01-15" }
              as: IsoAdmin
              captures: { a1: $.data.id }
            - call: "POST /agents"
              payload: { name: "A2 Five Active", split_pct: 0.50, override_pct: 0.60, vesting_start_date: "2024-01-15" }
