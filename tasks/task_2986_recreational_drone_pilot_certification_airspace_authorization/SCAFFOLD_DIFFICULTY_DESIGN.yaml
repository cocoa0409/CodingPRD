              captures: { arid: $.data.id, reserve: $.data.reserved_cents }
          assert:
            - "link 1: AccidentReport.${arid}.status == \"FILED\" and ${reserve} == 1250000 (round_half_up(800000 * 1.25) == 1000000 plus the MINOR reserve 250000)"
