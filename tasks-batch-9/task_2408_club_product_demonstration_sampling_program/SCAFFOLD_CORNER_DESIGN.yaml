              as_user_id: "admin_hq"
            - call: "POST /event-assignments/${asg_id}/transitions"
              payload: { action: "CONFIRM" }
              as: Demonstrator
              as_user_id: "${dem_id}"
            - call: "POST /event-assignments/${asg_id}/transitions"
              payload: { action: "CHECK_IN", occurred_at_utc: "2026-09-14T08:15:00Z" }
              as: Demonstrator
              as_user_id: "${dem_id}"
            - call: "POST /event-assignments/${asg_id}/transitions"
              payload: { action: "CHECK_OUT", occurred_at_utc: "2026-09-14T12:45:00Z" }
              as: Demonstrator
              as_user_id: "${dem_id}"
              captures: { hours: "$.data.hours_worked", billable: "$.data.billable_hours" }
            - call: "POST /demo-events/${event_id}/transitions"
              payload: { action: "CLOSE_OUT" }
              as: ClubOperations
              as_user_id: "${club_id}"
            - call: "POST /demo-events/${event_id}/sample-reconciliation"
              payload: { units_sampled: 20, units_wasted: 0, units_returned: 0 }
              as: ClubOperations
              as_user_id: "${club_id}"
              captures: { recon_state: "$.data.recon_status" }
            - call: "GET /demo-events/${event_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { ev_v: "$.data.version" }
            - call: "POST /demo-events/${event_id}/invoice"
              payload: { expected_demo_event_version: "${ev_v}" }
              as: ProgramAdmin
              as_user_id: "admin_billing"
              captures: { invoice_id: "$.data.id", subtotal: "$.data.subtotal_cents", staffing_fee: "$.data.staffing_fee_cents", handling_fee: "$.data.sample_handling_fee_cents", discount: "$.data.discount_cents", total_due: "$.data.total_due_cents", monthly_count: "$.data.monthly_completed_event_count" }
            - call: "POST /event-invoices/${invoice_id}/transitions"
              payload: { action: "ISSUE" }
              as: ProgramAdmin
              as_user_id: "admin_billing"
              captures: { issued_state: "$.data.invoice_status" }
          trigger:
            - call: "POST /event-invoices/${invoice_id}/transitions"
              payload: { action: "RECORD_PAYMENT", amount_cents: 40000 }
              as: ProgramAdmin
              as_user_id: "admin_billing"
              captures: { err_amount: "$.data.error_id" }
            - call: "GET /event-invoices/${invoice_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin_billing"
              captures: { still_issued: "$.data.invoice_status" }
            - call: "POST /event-invoices/${invoice_id}/transitions"
              payload: { action: "RECORD_PAYMENT", amount_cents: 40600 }
              as: ProgramAdmin
              as_user_id: "admin_billing"
              captures: { paid_state: "$.data.invoice_status", paid_stamp: "$.data.paid_at" }
          assert:
            - "${hours} == 4.50"
            - "${billable} == 4.50"
            - "${recon_state} == BALANCED"
            - "${monthly_count} == 1"
            - "${staffing_fee} == 10800"
            - "${handling_fee} == 1800"
            - "${subtotal} == 40600"
            - "${discount} == 0"
            - "${total_due} == 40600"
            - "${issued_state} == ISSUED"
            - "${err_amount} == ERR_PAYMENT_AMOUNT_MISMATCH"
            - "the 40000 payment responds with HTTP 422"
            - "${still_issued} == ISSUED"
            - "Manufacturer.${mfr_id}.outstanding_balance_cents == 40600 while the invoice is ISSUED"
            - "${paid_state} == PAID"
            - "${paid_stamp} is not null"
            - "Manufacturer.${mfr_id}.outstanding_balance_cents == 0 once the invoice is PAID"
            - "EventInvoice.${invoice_id}.credit_terms_days == 30"

      - name: capacity_endpoint_is_a_pure_computed_read
        claim_type: computed_read
        grounds:
          - endpoints[GET /clubs/{id}/capacity]
          - calculations.club_day_calendar_utilization
        excluded_because:
          difficulty_instance: boundary_precision_check / club_day_capacity_admits_at_one_below_and_rejects_at_exact_equality
          rationale: "That instance reads GET /clubs/{id}/capacity at both sides of the capacity boundary and asserts remaining_slots 0, which is the derived-read claim."
