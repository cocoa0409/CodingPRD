        distinguishing_aspect: "A second submit on an already SUBMITTED order is refused with ERR_INVALID_STATE and leaves submitted_at unchanged, so the snapshot is written exactly once."
        test_recipe:
          setup:
            - "The anchored base fixture with one submitted order."
          setup_api_calls:
            - *x_clock
