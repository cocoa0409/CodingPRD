  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: occ_charter_stale_then_fresh_submission
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[charter-amendment-stale-baseline]"]
        distinguishing_aspect: "Charter OCC: after amendment A re-baselines the charter (version 1 -> 2), a second filer replaying baseline 1 gets 412; re-reading and resubmitting with version 2 succeeds."
        test_recipe:
          setup: ["charter created (version 1); amendment A submitted with baseline 1 -> charter version 2"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/charters", payload: { bond_type: "MULTIPLE_COMMON_BOND", par_value_cents: 500, segments: [{ segment_type: "OCCUPATIONAL", descriptor: "ACME Corp employees", required_documents: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }] }, as: BoardDirector, captures: { charter_id: "$.data.id", charter_v1: "$.data.version" } }
            - { call: "POST /credit-union/charter-amendment-applications", payload: { charter_id: "${charter_id}", amendment_type: "ADD_SEGMENT", proposed_segment_type: "COMMUNITY", proposed_segment_descriptor: "Riverside County residents", proposed_segment_required_documents: ["GOVERNMENT_ID", "ADDRESS_PROOF"], effective_date: "2026-09-01", expected_charter_version: "${charter_v1}" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { amendA: "$.data.id", amendA_base: "$.data.baseline_charter_version" } }
          trigger:
            - { call: "POST /credit-union/charter-amendment-applications", payload: { charter_id: "${charter_id}", amendment_type: "ADD_SEGMENT", proposed_segment_type: "ASSOCIATIONAL", proposed_segment_descriptor: "Riverside Teachers Association members", proposed_segment_required_documents: ["GOVERNMENT_ID", "ASSOCIATION_CARD"], effective_date: "2026-10-01", expected_charter_version: "${charter_v1}" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { err: "$.data.error_id" } }
            - { call: "GET /credit-union/charters/${charter_id}", as: ComplianceOfficer, captures: { charter_v2: "$.data.version" } }
            - { call: "POST /credit-union/charter-amendment-applications", payload: { charter_id: "${charter_id}", amendment_type: "ADD_SEGMENT", proposed_segment_type: "ASSOCIATIONAL", proposed_segment_descriptor: "Riverside Teachers Association members", proposed_segment_required_documents: ["GOVERNMENT_ID", "ASSOCIATION_CARD"], effective_date: "2026-10-01", expected_charter_version: "${charter_v2}" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { amendB: "$.data.id", amendB_base: "$.data.baseline_charter_version" } }
          assert:
            - "amendA_base == 1; err == ERR_STALE_CHARTER_VERSION (412) for the replayed baseline"
            - "charter_v2 == 2; amendB_base == 2 and submission succeeds (201) — each successful submission increments Charter.version by 1"

      - name: occ_member_patch_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[member-patch-stale-version]"]
        distinguishing_aspect: "Member OCC: a PATCH replaying the pre-mutation version is rejected with 412; the first PATCH itself increments Member.version from 1 to 2."
        test_recipe:
          setup: ["member approved (version 1); version captured via GET"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /credit-union/charters", payload: { bond_type: "MULTIPLE_COMMON_BOND", par_value_cents: 500, segments: [{ segment_type: "OCCUPATIONAL", descriptor: "ACME Corp employees", required_documents: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }] }, as: BoardDirector, captures: { charter_id: "$.data.id" } }
            - { call: "GET /credit-union/charters/${charter_id}/segments", as: BoardDirector, captures: { seg1: "$.data[0].id" } }
            - { call: "POST /credit-union/membership-applications", payload: { applicant_full_name: "Occ Otto", date_of_birth: "1990-01-01", basis: "SEGMENT_MATCH", segment_id: "${seg1}", documents_provided: ["GOVERNMENT_ID", "EMPLOYER_LETTER"] }, as: MembershipOfficer, as_user_id: "officer-1", captures: { app1: "$.data.id" } }
            - { call: "POST /credit-union/membership-applications/${app1}/approve", as: MembershipOfficer, as_user_id: "officer-2", captures: { m1: "$.data.resulting_member_id" } }
            - { call: "GET /credit-union/members/${m1}", as: MembershipOfficer, captures: { mv1: "$.data.version" } }
          trigger:
            - { call: "PATCH /credit-union/members/${m1}", payload: { expected_member_version: "${mv1}", mailing_address: "1 Main St" }, as: MembershipOfficer, captures: { mv2: "$.data.version", addr: "$.data.mailing_address" } }
            - { call: "PATCH /credit-union/members/${m1}", payload: { expected_member_version: "${mv1}", mailing_address: "2 Main St" }, as: MembershipOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "mv1 == 1; first PATCH succeeds: addr == '1 Main St' and mv2 == 2"
            - "err == ERR_STALE_MEMBER_VERSION (412) on the replayed version; stored address remains '1 Main St'"

      - name: payment_run_partial_exclusion_of_closed_account
        claim_type: cascading_side_effects
        grounds: [state_machines.DividendDeclaration.DECLARED_to_PAID, state_machines.DividendPayment]
