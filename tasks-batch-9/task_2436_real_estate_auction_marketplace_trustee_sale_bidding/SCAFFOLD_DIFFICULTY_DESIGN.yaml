  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: event_open_blocked_until_trustee_sale_confirmed
        grounds:
          - validations[priority=39]
          - state_machines.AuctionEvent.SCHEDULED_to_LIVE
          - state_machines.TrusteeSale.PENDING_to_CONFIRMED
          - endpoints[POST /auction-events/{id}/open]
        distinguishing_aspect: |
          Opening the event is gated on the state of a THIRD entity that the request never
          names: the TrusteeSale linked to the event. Nothing about the AuctionEvent row
          (SCHEDULED, clock past starts_at, one PENDING lot) changes between the rejected and
          the accepted call — only TrusteeSale.status flips PENDING -> CONFIRMED, so the same
          request body produces 409 then 200.
        test_recipe:
          setup:
            - "One VACANT asset in CA-ALAMEDA with a TrusteeSale for 2026-09-15T18:00:00Z that is still PENDING (never confirmed)."
            - "One AuctionEvent bound to that sale is SCHEDULED for 17:00:00Z..19:00:00Z with one PENDING lot."
            - "Logical clock at 2026-09-15T17:05:00Z, i.e. already past starts_at, so the temporal rule is satisfied."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sellers"
              payload: { org_name: "Redwood Trust Servicing", seller_type: "SERVICER", contact_email: "ops@redwoodtrust.example", settlement_account_ref: "ACH-RED-3" }
              as: PlatformAdmin
              captures: { seller_id: $.data.id }
