  # Validations
  # ===========================================================================
  - section: validations
    instances:
      - name: create_batch_referenced_mfr_not_found
        claim_type: Violation → Error
        grounds:
          - validations[priority=4]
          - errors[ERR_REFERENCED_RESOURCE_NOT_FOUND]
          - endpoints["POST /pharmacy-compounding/compounding-batches"]
        distinguishing_aspect: "POST batch with a non-existent master_formulation_record_id (facility exists) -> ERR_REFERENCED_RESOURCE_NOT_FOUND (422)."
        test_recipe:
          setup:
            - "A facility exists; the referenced MFR id does not."
          setup_api_calls:
            - call: "POST /pharmacy-compounding/facilities"
              payload: { name: "Acme", registration_type: "503B", state_code: "TX" }
              as: SystemAdmin
              captures: { f_id: $.data.id }
          trigger:
            - call: "POST /pharmacy-compounding/compounding-batches"
              payload: { facility_id: "${f_id}", master_formulation_record_id: "00000000-0000-4000-8000-000000000000", purpose: "OFFICE_USE" }
              as: CompoundingPharmacist
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "response.data.error_id == ERR_REFERENCED_RESOURCE_NOT_FOUND"

      - name: create_office_use_batch_at_503a_facility_rejected
