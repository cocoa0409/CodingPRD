              as: FiberBuyer
              as_user_id: "buyer-1"
              captures: { supplier_id: "$.data.id" }
            - call: "POST /fiber-purchase-orders"
              payload: { supplier_id: "${supplier_id}", fiber_grade_code: "SOP_37", contracted_tons: 10.00, index_basis: "CURRENT_MONTH", priced_for_month: "2026-08", negotiated_delta_per_ton: 0.00 }
              as: FiberBuyer
              as_user_id: "buyer-1"
              captures: { po_id: "$.data.id", po_version: "$.data.version" }
          trigger:
