          - validations[priority=7]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Writing a second line while still carrying the order version observed before the first line was written yields ERR_STALE_VERSION 412; re-reading the order and using the fresh version succeeds. Two strictly sequential requests, no parallelism."
        test_recipe:
          setup:
            - "One ACUTE supply room with two APPROVED formulary mappings priced by an ACTIVE TIER_1 contract at 3000 cents each."
            - "A DRAFT order whose version was observed at creation."
          setup_api_calls:
            - call: "POST /supply-rooms"
              payload: { facility_code: "FAC-800", room_code: "GEN-800", gpo_member_class: "ACUTE", room_type: "GENERAL_STORE" }
              as: ContractAdmin
              captures: { room_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "SKU-OCC-A-CS", description: "OCC probe A", manufacturer_code: "MFR-ACME", uom: "CS", wac_cents: 8000, handling_class: "AMBIENT", units_per_parent: 10 }
              as: ContractAdmin
              captures: { item_a_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "SKU-OCC-B-CS", description: "OCC probe B", manufacturer_code: "MFR-ACME", uom: "CS", wac_cents: 8000, handling_class: "AMBIENT", units_per_parent: 10 }
              as: ContractAdmin
              captures: { item_b_id: $.data.id }
            - call: "POST /contracts"
              payload: { manufacturer_code: "MFR-ACME", contract_code: "CTR-OCC", tier: "TIER_1", member_class_scope: "ACUTE", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }
              as: ContractAdmin
              captures: { ctr_id: $.data.id }
            - call: "POST /contracts/${ctr_id}/lines"
              payload: { item_id: "${item_a_id}", tier_price_cents: 3000, floor_price_cents: 2000 }
              as: ContractAdmin
            - call: "POST /contracts/${ctr_id}/lines"
              payload: { item_id: "${item_b_id}", tier_price_cents: 3000, floor_price_cents: 2000 }
              as: ContractAdmin
            - call: "POST /contracts/${ctr_id}/transition"
              payload: { to_status: "PENDING_ACTIVATION" }
              as: ContractAdmin
            - call: "POST /contracts/${ctr_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: ContractAdmin
            - call: "POST /supply-rooms/${room_id}/formulary-items"
              payload: { item_id: "${item_a_id}", facility_item_code: "FAC-OCC-A", par_qty: 50, reorder_point: 10 }
              as: MaterialsManager
              as_user_id: "${room_id}"
              captures: { fi_a_id: $.data.id }
            - call: "POST /formulary-items/${fi_a_id}/decision"
              payload: { decision: "APPROVED" }
              as: Clinician
              as_user_id: "clin-1"
            - call: "POST /supply-rooms/${room_id}/formulary-items"
              payload: { item_id: "${item_b_id}", facility_item_code: "FAC-OCC-B", par_qty: 50, reorder_point: 10 }
              as: MaterialsManager
              as_user_id: "${room_id}"
              captures: { fi_b_id: $.data.id }
            - call: "POST /formulary-items/${fi_b_id}/decision"
              payload: { decision: "APPROVED" }
              as: Clinician
              as_user_id: "clin-1"
            - call: "POST /orders"
              payload: { supply_room_id: "${room_id}" }
              as: MaterialsManager
              as_user_id: "${room_id}"
              captures: { order_id: $.data.id, order_v1: $.data.version }
            - call: "POST /orders/${order_id}/lines"
              payload: { item_id: "${item_a_id}", requested_qty: 1, expected_order_version: "${order_v1}" }
              as: MaterialsManager
              as_user_id: "${room_id}"
              captures: { line_a_id: $.data.id }
          trigger:
            - call: "POST /orders/${order_id}/lines"
              payload: { item_id: "${item_b_id}", requested_qty: 1, expected_order_version: "${order_v1}" }
              as: MaterialsManager
              as_user_id: "${room_id}"
              captures: { err: $.data.error_id }
            - call: "GET /orders/${order_id}"
              payload: {}
              as: MaterialsManager
              as_user_id: "${room_id}"
              captures: { order_v_fresh: $.data.version }
            - call: "POST /orders/${order_id}/lines"
              payload: { item_id: "${item_b_id}", requested_qty: 1, expected_order_version: "${order_v_fresh}" }
              as: MaterialsManager
              as_user_id: "${room_id}"
              captures: { line_b_id: $.data.id }
          assert:
            - "${err} == ERR_STALE_VERSION with HTTP 412"
            - "after the refused write: ReplenishmentOrder.${order_id}.order_total_cents == 3083 and exactly one OrderLine exists for the order"
            - "${order_v_fresh} != ${order_v1}"
            - "after the retry: OrderLine.${line_b_id}.pinned_unit_price_cents == 3000 and ReplenishmentOrder.${order_id}.order_total_cents == 6166"

      - name: occ_stale_formulary_item_version_rejected_on_second_adjustment
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[par-adjust-stale-formulary-item]
          - validations[priority=7]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "A second cycle-count delta carrying the version observed before the first adjustment yields ERR_STALE_VERSION 412 on a DIFFERENT parent entity from the order rule, and on_hand_qty stays at the first adjustment's value."
        test_recipe:
          setup:
            - "One APPROVED formulary mapping with par_qty 60, reorder_point 12 and on_hand_qty 0, whose version was observed at approval time."
          setup_api_calls:
            - call: "POST /supply-rooms"
              payload: { facility_code: "FAC-801", room_code: "GEN-801", gpo_member_class: "ACUTE", room_type: "GENERAL_STORE" }
              as: ContractAdmin
              captures: { room_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "SKU-OCC2-CS", description: "OCC par probe", manufacturer_code: "MFR-ACME", uom: "CS", wac_cents: 4000, handling_class: "AMBIENT", units_per_parent: 12 }
              as: ContractAdmin
              captures: { item_id: $.data.id }
            - call: "POST /supply-rooms/${room_id}/formulary-items"
              payload: { item_id: "${item_id}", facility_item_code: "FAC-OCC2", par_qty: 60, reorder_point: 12 }
              as: MaterialsManager
              as_user_id: "${room_id}"
              captures: { fi_id: $.data.id }
            - call: "POST /formulary-items/${fi_id}/decision"
              payload: { decision: "APPROVED" }
              as: Clinician
              as_user_id: "clin-1"
              captures: { fi_v2: $.data.version }
            - call: "POST /formulary-items/${fi_id}/adjust-on-hand"
              payload: { delta_qty: 20, expected_formulary_item_version: "${fi_v2}" }
              as: MaterialsManager
              as_user_id: "${room_id}"
              captures: { fi_v3: $.data.version }
          trigger:
            - call: "POST /formulary-items/${fi_id}/adjust-on-hand"
              payload: { delta_qty: 7, expected_formulary_item_version: "${fi_v2}" }
              as: MaterialsManager
              as_user_id: "${room_id}"
              captures: { err: $.data.error_id }
            - call: "POST /formulary-items/${fi_id}/adjust-on-hand"
              payload: { delta_qty: 7, expected_formulary_item_version: "${fi_v3}" }
              as: MaterialsManager
              as_user_id: "${room_id}"
          assert:
            - "${err} == ERR_STALE_VERSION with HTTP 412"
            - "after the refused adjustment: FormularyItem.${fi_id}.on_hand_qty == 20 and version == ${fi_v3}"
            - "after the retry with the fresh version: FormularyItem.${fi_id}.on_hand_qty == 27"
            - "${fi_v3} == ${fi_v2} + 1"

      - name: cascading_side_effects_layer_end_to_end
        claim_type: cascading_side_effects
        grounds: ["state_machines.RecallNotice.ISSUED_to_CASCADED"]
        excluded_because:
          difficulty_instance: transitive_cascade / recall_cascade_lot_to_line_to_order_to_route_four_hops
          rationale: "The four-level chain and its ordering are asserted hop by hop there."
      - name: dual_variant_calculation_layer_divergence
        claim_type: dual_variant_calculation
        grounds: ["calculations.contract_unit_price"]
        excluded_because:
          difficulty_instance: dual_variant_calc / unit_price_pin_at_line_write_vs_settlement_reprice_diverge
          rationale: "Both variants are computed on the same line and asserted to differ there."
      - name: rate_threshold_trigger_layer_boundaries
        claim_type: rate_threshold_triggers
        grounds: ["calculations.chargeback_settlement", "calculations.par_replenishment_suggestion"]
        excluded_because:
          difficulty_instance: boundary_precision_check / replenishment_due_at_exactly_reorder_point_not_one_above
          rationale: "The inclusive reorder-point boundary and the gross-chargeback bracket edge are both asserted in the difficulty design."

  - section: consistency_model
    instances:

      - name: submit_commitment_is_visible_on_the_room_in_the_same_request_cycle
        claim_type: immediate
        grounds:
          - state_machines.ReplenishmentOrder.DRAFT_to_SUBMITTED
          - entities.SupplyRoom.fields.open_commitment_cents
          - calculations.order_total
        distinguishing_aspect: "The consistency model is immediate: the very next read of the supply room after a submit already shows open_commitment_cents 3083, with no lag and no reconciliation pass."
        test_recipe:
          setup:
            - "One ACUTE supply room with an APPROVED formulary mapping priced at 3000 by an ACTIVE TIER_1 contract."
            - "A DRAFT order with one line of 1 case, so order_total_cents is 3083 and open_commitment_cents is still 0."
          setup_api_calls:
            - call: "POST /supply-rooms"
              payload: { facility_code: "FAC-900", room_code: "GEN-900", gpo_member_class: "ACUTE", room_type: "GENERAL_STORE" }
              as: ContractAdmin
              captures: { room_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "SKU-CM-CS", description: "Consistency probe", manufacturer_code: "MFR-ACME", uom: "CS", wac_cents: 8000, handling_class: "AMBIENT", units_per_parent: 10 }
              as: ContractAdmin
              captures: { item_id: $.data.id }
            - call: "POST /contracts"
              payload: { manufacturer_code: "MFR-ACME", contract_code: "CTR-CM", tier: "TIER_1", member_class_scope: "ACUTE", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }
              as: ContractAdmin
              captures: { ctr_id: $.data.id }
            - call: "POST /contracts/${ctr_id}/lines"
              payload: { item_id: "${item_id}", tier_price_cents: 3000, floor_price_cents: 2000 }
              as: ContractAdmin
            - call: "POST /contracts/${ctr_id}/transition"
              payload: { to_status: "PENDING_ACTIVATION" }
              as: ContractAdmin
            - call: "POST /contracts/${ctr_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: ContractAdmin
            - call: "POST /supply-rooms/${room_id}/formulary-items"
              payload: { item_id: "${item_id}", facility_item_code: "FAC-CM", par_qty: 50, reorder_point: 10 }
              as: MaterialsManager
              as_user_id: "${room_id}"
              captures: { fi_id: $.data.id }
            - call: "POST /formulary-items/${fi_id}/decision"
              payload: { decision: "APPROVED" }
              as: Clinician
              as_user_id: "clin-1"
            - call: "POST /orders"
              payload: { supply_room_id: "${room_id}" }
              as: MaterialsManager
              as_user_id: "${room_id}"
              captures: { order_id: $.data.id, order_v1: $.data.version }
            - call: "POST /orders/${order_id}/lines"
              payload: { item_id: "${item_id}", requested_qty: 1, expected_order_version: "${order_v1}" }
              as: MaterialsManager
              as_user_id: "${room_id}"
            - call: "GET /supply-rooms/${room_id}"
              payload: {}
              as: MaterialsManager
              as_user_id: "${room_id}"
              captures: { commit_before: $.data.open_commitment_cents }
          trigger:
            - call: "POST /orders/${order_id}/submit"
              payload: {}
              as: MaterialsManager
              as_user_id: "${room_id}"
            - call: "GET /supply-rooms/${room_id}"
              payload: {}
              as: MaterialsManager
              as_user_id: "${room_id}"
              captures: { commit_after: $.data.open_commitment_cents }
          assert:
            - "${commit_before} == 0"
            - "${commit_after} == 3083"
            - "ReplenishmentOrder.${order_id}.fulfillment_status == SUBMITTED and submitted_at == 2026-08-01T00:00:00.000Z"
