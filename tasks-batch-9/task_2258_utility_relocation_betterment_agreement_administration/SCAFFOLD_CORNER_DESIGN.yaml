            - "${rep_read_status} == CLEARANCE_ACTIVE == ${auditor_read_status}"
            - "${eng_posture} == AT_RISK and ${eng_open} == 1, so the engineer sees the same projection the coordinator does"
            - "${adj_first_inv} == ${inv1}, so the adjudicator can read the record research the coordinator captured"
            - "${rep_agreement_total} == 0 and the response is a well-formed empty page rather than a 404"
            - "GET /uro/projects/${p1}/clearance-summary as ExternalAuditor returns 403 ERR_UNAUTHORIZED, because that role is not on this endpoint's list even though it may read the project itself"

