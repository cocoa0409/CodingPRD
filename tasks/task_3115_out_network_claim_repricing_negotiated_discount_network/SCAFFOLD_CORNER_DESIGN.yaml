        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[reprice-stale-claim-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Client reads claim at version 2, a line is added (version 3), then reprice carrying expected_claim_version 2 is rejected 412 ERR_STALE_VERSION — two strictly sequential requests, no parallelism."
        test_recipe:
          setup: ["Payer, provider, Medicare entry, policy; claim with one line (version 2); caller captured version 2 before a second line add."]
          setup_api_calls:
            - call: "POST /payer-clients"
