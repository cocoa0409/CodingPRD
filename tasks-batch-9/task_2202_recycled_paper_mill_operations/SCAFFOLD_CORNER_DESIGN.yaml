  # ===========================================================================
  # RBAC — the eight roles of §1.7, the five auth codes of the priority 1..5
  # ladder, and the three segregation-of-duties pairs that define the role model.
  # ===========================================================================
  - section: rbac
    instances:
      - name: mill_planner_alone_may_take_a_machine_down
        claim_type: exclusive_operation
        grounds:
          - roles.MillPlanner.exclusive_operations
          - endpoints.PATCH_paper_machines_id_status
          - validations.priority_4
        distinguishing_aspect: "PATCH /paper-machines/{id}/status is exclusive to MillPlanner: the same well-formed body sent by MachineOperator — the role that physically runs the machine, and therefore the most plausible false positive — must be refused with 403 ERR_ROLE_NOT_PERMITTED before any state or OCC evaluation, leaving status RUNNABLE and version unchanged."
        test_recipe:
          setup: ["A RUNNABLE PM1 created by MillPlanner."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MillPlanner
              as_user_id: "planner-1"
            - call: "POST /paper-machines"
              payload: { name: "PM1", wire_width_mm: 5600, max_tons_per_hour: 20.00, changeover_buffer_minutes: 30, steam_tph_per_ton: 2.500 }
              as: MillPlanner
              as_user_id: "planner-1"
              captures: { machine_id: "$.data.id", machine_v0: "$.data.version" }
          trigger:
            - call: "PATCH /paper-machines/${machine_id}/status"
              payload: { status: "DOWN", expected_machine_version: "${machine_v0}" }
              as: MachineOperator
              as_user_id: "op-1"
            - call: "GET /paper-machines/${machine_id}"
              payload: {}
              as: MillPlanner
              as_user_id: "planner-1"
              captures: { machine_v_now: "$.data.version" }
            - call: "PATCH /paper-machines/${machine_id}/status"
              payload: { status: "DOWN", expected_machine_version: "${machine_v_now}" }
              as: MillPlanner
              as_user_id: "planner-1"
          assert:
            - "the MachineOperator attempt returns HTTP 403 with response.data.error_id == 'ERR_ROLE_NOT_PERMITTED'"
            - "the intervening GET reports status == 'RUNNABLE' and ${machine_v_now} == ${machine_v0}, proving the refused call wrote nothing"
            - "the MillPlanner attempt returns HTTP 200 with response.data.status == 'DOWN' and response.data.version == ${machine_v_now} + 1"

      - name: quality_lab_alone_may_disposition_a_truck_and_the_operator_may_not
        claim_type: exclusive_operation
        grounds:
          - roles.QualityLab.exclusive_operations
          - roles.MachineOperator.exclusive_operations
          - endpoints.POST_fiber_receipts_id_disposition
          - endpoints.POST_pulp_batches_id_start
        distinguishing_aspect: "The QualityLab/MachineOperator pair is the sharpest peer split in the matrix: dispositioning a truck is QualityLab-exclusive and starting a pulper is MachineOperator-exclusive, so each role is refused the other's verb with 403 ERR_ROLE_NOT_PERMITTED while both succeed on their own. This tests the split in both directions in one recipe rather than assuming symmetry."
        test_recipe:
          setup: ["A CONFIRMED purchase order with one SAMPLED receipt of 2.00% contamination awaiting disposition."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MillPlanner
              as_user_id: "planner-1"
            - call: "POST /paper-grade-specs"
              payload: { product_code: "TL_140", family: "CONTAINERBOARD", basis_weight_gsm: 140.0, target_moisture_pct: 7.50, moisture_tolerance_pct: 0.50, min_sct_kn_m: 2.50, requires_deink_pulp: false, rank_order: 10 }
              as: MillPlanner
              as_user_id: "planner-1"
            - call: "POST /fiber-grades"
