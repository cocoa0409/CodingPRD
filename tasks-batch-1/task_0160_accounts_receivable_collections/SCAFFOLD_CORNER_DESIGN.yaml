              payload: { invoice_id: "${inv_id}", amount_cents: 30000, reason_code: "UNCOLLECTIBLE" }
              as: COLLECTIONS_AGENT
              as_user_id: "agent-1"
              captures: { wo_id: $.data.id }
          trigger:
            - call: "POST /ar/write-offs/${wo_id}/approve"
              payload: {}
              as: AR_CLERK
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_UNAUTHORIZED"

      - name: error_stale_version_on_promise_create
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_VERSION]", "concurrency_rules[promise-create-stale-customer]"]
        distinguishing_aspect: >-
          Creating a second promise carrying the customer version observed BEFORE
          the first promise advanced it (deliberate ${c_v0} - 1 stale form is not
          needed: ${c_v0} is itself stale after the first create) returns
          ERR_STALE_VERSION (412).
        test_recipe:
          setup: ["customer; one promise already created advancing customer.version"]
          setup_api_calls:
            - call: "POST /ar/customers"
              payload: { name: "SV", credit_limit_cents: 1000000 }
              as: AR_MANAGER
              captures: { c_id: $.data.id, c_v0: $.data.version }
            - call: "POST /ar/promises"
              payload: { customer_id: "${c_id}", promised_amount_cents: 5000, coverage_start: "2026-06-01T00:00:00Z", coverage_end: "2026-06-15T00:00:00Z", expected_customer_version: "${c_v0}" }
              as: COLLECTIONS_AGENT
          trigger:
            - call: "POST /ar/promises"
              payload: { customer_id: "${c_id}", promised_amount_cents: 5000, coverage_start: "2026-07-01T00:00:00Z", coverage_end: "2026-07-15T00:00:00Z", expected_customer_version: "${c_v0}" }
              as: COLLECTIONS_AGENT
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_STALE_VERSION   # ${c_v0} went stale when the first promise bumped customer.version"

