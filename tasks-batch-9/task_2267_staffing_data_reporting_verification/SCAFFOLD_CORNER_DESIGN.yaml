              as: StaffingCoordinator
              as_user_id: "${w_coord}"
              captures: { e_p3: $.data.id }
          trigger:
            - call: "GET /hour-entries"
              payload: { submission_id: "${sub}", entry_status: "ACTIVE", limit: 2, offset: 0 }
