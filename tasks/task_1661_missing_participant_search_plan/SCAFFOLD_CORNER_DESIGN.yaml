        distinguishing_aspect: "REJECTED is terminal for an election but not for the participant: reject returns the participant to PENDING_ELECTION, a fresh election succeeds, and rejecting an already-REJECTED election fails with ERR_ELECTION_INVALID_STATE."
        test_recipe:
          setup: ["Case in DISTRIBUTION_IN_PROGRESS; participant 250000 vested 100% with election E1 SUBMITTED."]
          setup_api_calls:
            - { call: "POST /termination-cases", payload: { plan_name: "Resubmit Co 401k", sponsor_ein: "123456789", plan_number: "124", proposed_termination_date: "2026-10-15T00:00:00Z" }, as: PlanAdministrator, captures: { c_re: "$.data.id", c_re_v: "$.data.version" } }
