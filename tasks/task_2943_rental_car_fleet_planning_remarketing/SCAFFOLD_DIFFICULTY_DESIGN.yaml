      - name: total_loss_cascades_vehicle_orders_and_market_census_three_levels
        grounds:
          - state_machines[DamageEvent]
          - state_machines[Vehicle.fleet_status]
          - state_machines[RedistributionOrder]
          - state_machines[Consignment]
          - endpoints[POST /fleet/damage-events/{damage_event_id}/declare-total-loss]
        distinguishing_aspect: |
          This is the FAN-OUT cascade rather than the bubble-up one: the chain runs
          DamageEvent -> Vehicle -> {every open RedistributionOrder, every open
          Consignment, the Market census} across three sibling aggregates that are not
          on one another's ownership path, and it is conditional on child state - a
          RECEIVED order or a SETTLED consignment must be left alone while DRAFT ones
