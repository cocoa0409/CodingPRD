  - name: a_detection_instant_one_second_past_the_clock_is_refused
    claim_type: temporal
    grounds:
    - validations[priority=23]
    - errors[ERR_DETECTION_DATE_IN_FUTURE]
    - calculations.poam_remediation_deadline
    distinguishing_aspect: 'Priority 23 is `detected_at is not after the logical clock`, so the boundary is inclusive: the
      clock instant itself is accepted while one second later is refused, and the accepted item anchors on its detected_at
      (not on the clock) — a past detection keeps its own earlier deadline.'
