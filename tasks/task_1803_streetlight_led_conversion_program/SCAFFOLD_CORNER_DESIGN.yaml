      - WattageAudit.${aud1}.status == SUPERSEDED AND WattageAudit.${aud2}.status == ACCEPTED AND Pole.${pole}.effective_wattage == 190 AND wattage_tier == T2
      - 'TariffAccount.${acct}.ytd_billed_cents == 1100   # REGULAR(BILLED+SUPERSEDED) 1500 + ADJUSTMENT -400'
