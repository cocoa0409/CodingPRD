      - name: weighted_useful_life_blend_gates_requested_term
        claim_type: weighted_scoring
        grounds:
          - calculations.weighted_average_useful_life
          - validations[priority=43]
          - errors[ERR_TERM_EXCEEDS_USEFUL_LIFE]
        distinguishing_aspect: |
          The blend is cost-weighted, not a simple mean and not the maximum: solar 3000000 @ 25 y with
          hvac 1200000 @ 18 y gives (75000000 + 21600000) / 4200000 = 23 years exactly, so a 20-year
          term passes. A single 18-year hvac measure, by contrast, cannot support the same 20-year term
          and must fail with 422 ERR_TERM_EXCEEDS_USEFUL_LIFE — an implementation using the longest life
          (25 / 18) or an unweighted mean (21.5 / 18) gets one of the two probes wrong.
        test_recipe:
          setup:
            - "Clock 2026-08-12 with two products: SOLAR_PV_ROOF (25 y, cap 300000) and HVAC_HEATPUMP (18 y, cap 120000)."
            - "Parcel P1 hosts the blended application (solar 3000000/220000 + hvac 1200000/100000, requested_term_years 20)."
            - "Parcel P2 hosts an hvac-only application with the same requested_term_years 20, whose weighted life is only 18."
