            - call: "POST /clinic/custody-events"
              payload: { drug_screen_id: "${ds_id}", step: "COLLECT" }
              as: Collector
            - call: "POST /clinic/custody-events"
              payload: { drug_screen_id: "${ds_id}", step: "LAB_RECEIVE" }
              as: Collector
            - call: "POST /clinic/clearances"
              payload: { encounter_id: "${enc_id}", determination: "FIT" }
              as: Clinician
              as_user_id: "clin-1"
          trigger:
            - call: "POST /clinic/encounters/${enc_id}/complete"
              payload: {}
              as: Clinician
              as_user_id: "clin-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DRUG_SCREEN_NOT_VERIFIED"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: work_status_closed_interval_touch_supersedes
        grounds:
          - calculations.work_status_supersession
          - entities.WorkStatus.fields.valid_from
          - entities.WorkStatus.fields.valid_to
          - entities.WorkStatus.fields.superseded
        distinguishing_aspect: |
          On the WorkStatus/InjuryCase resource, closed-interval overlap semantics: a new note whose
          valid_from exactly equals an existing note's valid_to (touch at one boundary day) STILL supersedes
          it; half-open arithmetic would not. Interval semantics = endpoint-inclusive overlap.
        test_recipe:
          setup:
            - "Employer ACTIVE; worker; INJURY encounter checked in; injury case OPEN."
            - "A MODIFIED_DUTY work-status valid 2026-01-05..2026-01-12 puts case in RTW_PENDING."
          setup_api_calls:
            - call: "POST /clinic/employers"
              payload: { legal_name: "Omicron", mro_user_id: "mro-1" }
              as: ClinicAdmin
              captures: { emp_id: $.data.id, emp_v0: $.data.version }
            - call: "POST /clinic/protocols"
              payload: { employer_id: "${emp_id}", effective_date: "2026-01-01", panels: [ { panel_code: "PHYSICAL", required_for_job_category: "OP", price_cents: 9000, recheck_interval_days: 0 } ] }
              as: ClinicAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /clinic/protocols/${p1_id}/activate"
              payload: { expected_employer_version: "${emp_v0}" }
              as: ClinicAdmin
            - call: "POST /clinic/workers"
              payload: { employer_id: "${emp_id}", full_name: "Tom Touch", job_category: "OP", dob: "1990-01-15" }
              as: ClinicAdmin
              captures: { wkr_id: $.data.id }
            - call: "POST /clinic/encounters"
              payload: { employer_id: "${emp_id}", worker_id: "${wkr_id}", encounter_type: "INJURY" }
              as: Clinician
              as_user_id: "clin-1"
              captures: { enc_id: $.data.id }
            - call: "POST /clinic/encounters/${enc_id}/check-in"
              payload: {}
              as: Clinician
              as_user_id: "clin-1"
            - call: "POST /clinic/injury-cases"
              payload: { encounter_id: "${enc_id}", injury_date: "2026-01-02", treatment_level: "MEDICAL_TREATMENT", days_away: 0, days_restricted: 0 }
              as: Clinician
              as_user_id: "clin-1"
              captures: { ic_id: $.data.id }
            - call: "POST /clinic/work-statuses"
              payload: { injury_case_id: "${ic_id}", disposition: "MODIFIED_DUTY", restriction_text: "light duty", valid_from: "2026-01-05", valid_to: "2026-01-12" }
              as: Clinician
              as_user_id: "clin-1"
              captures: { ws1_id: $.data.id }
          trigger:
            - call: "POST /clinic/work-statuses"
              payload: { injury_case_id: "${ic_id}", disposition: "OFF_WORK", valid_from: "2026-01-12", valid_to: "2026-01-18" }
              as: Clinician
              as_user_id: "clin-1"
              captures: { ws2_id: $.data.id }
          assert:
            - "WorkStatus.${ws1_id}.superseded == true"
            - "WorkStatus.${ws2_id}.superseded == false"
            - "InjuryCase.${ic_id}.status == RTW_PENDING"

      - name: surveillance_recheck_buffer_blocks_early_reexam
        grounds:
          - validations[priority=14]
          - entities.Protocol.fields.panels
          - entities.SurveillanceExam.fields.exam_kind
          - errors[ERR_SURVEILLANCE_TOO_EARLY]
        distinguishing_aspect: |
          On the Worker/SurveillanceExam resource, a forward minimum-gap (buffer) semantics distinct from
          closed-interval overlap: a new AUDIOMETRIC surveillance encounter is rejected if a prior FINALIZED
          audiometric exam for the same worker is within recheck_interval_days (365) of employer current_date.
          Buffer/gap arithmetic, not interval merge, on a different resource entity.
        test_recipe:
          setup:
            - "Employer ACTIVE (current_date 2026-06-01); protocol AUDIOMETRIC panel recheck_interval_days=365; worker MACHINIST."
            - "A first SURVEILLANCE audiometric encounter is completed and its exam FINALIZED on 2026-06-01."
            - "Clock advances only to 2026-09-01 (90 days later, < 365)."
          setup_api_calls:
            - call: "POST /clinic/employers"
              payload: { legal_name: "Pi", mro_user_id: "mro-1", current_date: "2026-06-01" }
              as: ClinicAdmin
              captures: { emp_id: $.data.id, emp_v0: $.data.version }
            - call: "POST /clinic/protocols"
              payload: { employer_id: "${emp_id}", effective_date: "2026-01-01", panels: [ { panel_code: "AUDIOMETRIC", required_for_job_category: "MACHINIST", price_cents: 5000, recheck_interval_days: 365 } ] }
              as: ClinicAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /clinic/protocols/${p1_id}/activate"
              payload: { expected_employer_version: "${emp_v0}" }
              as: ClinicAdmin
            - call: "POST /clinic/workers"
              payload: { employer_id: "${emp_id}", full_name: "Mona Mach", job_category: "MACHINIST", dob: "1986-06-06" }
              as: ClinicAdmin
              captures: { wkr_id: $.data.id }
            - call: "POST /clinic/encounters"
              payload: { employer_id: "${emp_id}", worker_id: "${wkr_id}", encounter_type: "SURVEILLANCE", panel_code: "AUDIOMETRIC" }
              as: Clinician
              as_user_id: "clin-1"
              captures: { enc1_id: $.data.id }
            - call: "POST /clinic/encounters/${enc1_id}/check-in"
              payload: {}
              as: Clinician
              as_user_id: "clin-1"
            - call: "POST /clinic/surveillance-exams"
              payload: { encounter_id: "${enc1_id}", baseline_threshold_db: 20, current_threshold_db: 22 }
              as: Clinician
              as_user_id: "clin-1"
              captures: { ex1_id: $.data.id }
            - call: "POST /clinic/surveillance-exams/${ex1_id}/record"
              payload: {}
              as: Clinician
              as_user_id: "clin-1"
            - call: "POST /clinic/surveillance-exams/${ex1_id}/finalize"
              payload: {}
              as: Clinician
              as_user_id: "clin-1"
            - call: "POST /clinic/clearances"
              payload: { encounter_id: "${enc1_id}", determination: "FIT" }
              as: Clinician
              as_user_id: "clin-1"
            - call: "POST /clinic/encounters/${enc1_id}/complete"
              payload: {}
              as: Clinician
              as_user_id: "clin-1"
            - call: "POST /_clock/set"
              payload: { employer_id: "${emp_id}", to_iso8601: "2026-09-01" }
              as: ClinicAdmin
          trigger:
            - call: "POST /clinic/encounters"
              payload: { employer_id: "${emp_id}", worker_id: "${wkr_id}", encounter_type: "SURVEILLANCE", panel_code: "AUDIOMETRIC" }
              as: Clinician
              as_user_id: "clin-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_SURVEILLANCE_TOO_EARLY"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: issue_then_full_pay_conserves_outstanding_balance
        grounds:
          - calculations.employer_outstanding_balance
          - state_machines.Invoice.DRAFT_to_ISSUED
          - state_machines.Invoice.ISSUED_to_PAID
          - entities.Employer.fields.outstanding_balance_cents
        distinguishing_aspect: |
          Conserved quantity #1 = Employer.outstanding_balance_cents. Forward action issue (+total_cents to
          outstanding) paired with its compensating full payment (invoice -> PAID, drops out) leaves
          outstanding_balance_cents == 0, exactly its pre-issue value. Pinned: balance = sum over
          {ISSUED,OVERDUE,PARTIALLY_PAID} of (total-paid).
        test_recipe:
          setup:
            - "Employer ACTIVE (current_date 2026-03-15, net_terms 30); protocol PHYSICAL@10000; worker OP."
            - "One PHYSICAL encounter completed (FIT) in 2026-03; a DRAFT invoice of total 10000 exists (1 line item, 0% tier)."
          setup_api_calls:
            - call: "POST /clinic/employers"
              payload: { legal_name: "Rho", mro_user_id: "mro-1", net_terms_days: 30, current_date: "2026-03-15" }
              as: ClinicAdmin
              captures: { emp_id: $.data.id, emp_v0: $.data.version }
            - call: "POST /clinic/protocols"
              payload: { employer_id: "${emp_id}", effective_date: "2026-01-01", panels: [ { panel_code: "PHYSICAL", required_for_job_category: "OP", price_cents: 10000, recheck_interval_days: 0 } ] }
              as: ClinicAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /clinic/protocols/${p1_id}/activate"
              payload: { expected_employer_version: "${emp_v0}" }
              as: ClinicAdmin
            - call: "POST /clinic/workers"
              payload: { employer_id: "${emp_id}", full_name: "Ben Bill", job_category: "OP", dob: "1990-03-03" }
              as: ClinicAdmin
              captures: { wkr_id: $.data.id }
            - call: "POST /clinic/encounters"
              payload: { employer_id: "${emp_id}", worker_id: "${wkr_id}", encounter_type: "PHYSICAL", panel_code: "PHYSICAL" }
              as: Clinician
              as_user_id: "clin-1"
              captures: { enc_id: $.data.id }
            - call: "POST /clinic/encounters/${enc_id}/check-in"
              payload: {}
              as: Clinician
              as_user_id: "clin-1"
            - call: "POST /clinic/clearances"
              payload: { encounter_id: "${enc_id}", determination: "FIT" }
              as: Clinician
              as_user_id: "clin-1"
            - call: "POST /clinic/encounters/${enc_id}/complete"
              payload: {}
              as: Clinician
              as_user_id: "clin-1"
            - call: "POST /clinic/invoices"
              payload: { employer_id: "${emp_id}", period_start: "2026-03-01", period_end: "2026-03-31" }
              as: ClinicAdmin
              captures: { inv_id: $.data.id }
            - call: "GET /clinic/employers/${emp_id}"
              payload: {}
              as: ClinicAdmin
              captures: { emp_v_pre_issue: $.data.version }
            - call: "POST /clinic/invoices/${inv_id}/issue"
              payload: { expected_employer_version: "${emp_v_pre_issue}" }
              as: ClinicAdmin
          trigger:
            - call: "POST /clinic/invoices/${inv_id}/payments"
              payload: { amount_cents: 10000 }
              as: ClinicAdmin
              captures: { st: $.data.status }
            - call: "GET /clinic/employers/${emp_id}"
              payload: {}
              as: ClinicAdmin
              captures: { bal: $.data.outstanding_balance_cents }
          assert:
            - "Invoice.${inv_id}.status == PAID"
            - "Invoice.${inv_id}.paid_cents == 10000"
            - "Employer.${emp_id}.outstanding_balance_cents == 0"

      - name: complete_then_void_conserves_hire_status
        grounds:
          - state_machines.Encounter.IN_PROGRESS_to_COMPLETED
          - state_machines.Encounter.COMPLETED_to_VOIDED
          - state_machines.Clearance.ISSUED_to_RESCINDED
          - entities.Worker.fields.hire_status
        distinguishing_aspect: |
          Conserved quantity #2 = Worker.hire_status (a categorical state, not a monetary sum). Forward action
          complete-with-FIT-clearance (CANDIDATE->CLEARED) paired with its compensating void (clearance
          RESCINDED -> hire_status back to CANDIDATE) leaves hire_status == CANDIDATE, exactly its pre-complete value.
        test_recipe:
          setup:
            - "Employer ACTIVE; worker hire_status CANDIDATE; PHYSICAL encounter checked in; FIT clearance issued; encounter COMPLETED so hire_status CLEARED; not billed."
          setup_api_calls:
            - call: "POST /clinic/employers"
              payload: { legal_name: "Sigma", mro_user_id: "mro-1" }
              as: ClinicAdmin
              captures: { emp_id: $.data.id, emp_v0: $.data.version }
            - call: "POST /clinic/protocols"
              payload: { employer_id: "${emp_id}", effective_date: "2026-01-01", panels: [ { panel_code: "PHYSICAL", required_for_job_category: "OP", price_cents: 10000, recheck_interval_days: 0 } ] }
              as: ClinicAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /clinic/protocols/${p1_id}/activate"
              payload: { expected_employer_version: "${emp_v0}" }
              as: ClinicAdmin
            - call: "POST /clinic/workers"
              payload: { employer_id: "${emp_id}", full_name: "Cleo Clear", job_category: "OP", dob: "1992-04-04" }
              as: ClinicAdmin
              captures: { wkr_id: $.data.id }
            - call: "POST /clinic/encounters"
              payload: { employer_id: "${emp_id}", worker_id: "${wkr_id}", encounter_type: "PHYSICAL", panel_code: "PHYSICAL" }
              as: Clinician
              as_user_id: "clin-1"
              captures: { enc_id: $.data.id }
            - call: "POST /clinic/encounters/${enc_id}/check-in"
              payload: {}
              as: Clinician
              as_user_id: "clin-1"
            - call: "POST /clinic/clearances"
              payload: { encounter_id: "${enc_id}", determination: "FIT" }
              as: Clinician
              as_user_id: "clin-1"
              captures: { clr_id: $.data.id }
            - call: "POST /clinic/encounters/${enc_id}/complete"
              payload: {}
              as: Clinician
              as_user_id: "clin-1"
          trigger:
            - call: "POST /clinic/encounters/${enc_id}/void"
              payload: {}
              as: ClinicAdmin
              captures: { st: $.data.status }
          assert:
            - "Worker.${wkr_id}.hire_status == CANDIDATE"
            - "Clearance.${clr_id}.status == RESCINDED"
            - "Encounter.${enc_id}.status == VOIDED"
