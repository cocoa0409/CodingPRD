            - call: "GET /agreements/${ls_agr}"
              payload: {}
              as: FinanceAnalyst
              captures: { ls_verified2: "$.data.verified_policy_count" }
            - call: "POST /agreements/${ls_agr}/activate"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { ls_status: "$.data.status", ls_total: "$.data.total_premium_cents", ls_af: "$.data.amount_financed_cents", ls_rate: "$.data.effective_annual_rate_bps", ls_fc: "$.data.finance_charge_cents" }
            - call: "GET /policies"
              payload: { agreement_id: "${ls_agr}", status: "VERIFIED", limit: 50 }
              as: FinanceAnalyst
          assert:
            - "at submit ${ls_total0} == 1000000, ${ls_count0} == 2 and ${ls_verified0} == 0"
            - "after the FIRST policy's two attestations ${ls_verified1} == 1 while ${ls_count1} == 2 — the counter follows verified policies, not verifications"
            - "${ls_verified_mid} == 1 after the third attestation overall, because policy 2 has only one party on file: a per-verification counter would read 3 here"
            - "${ls_e_activate} == 'ERR_POLICY_NOT_VERIFIED' with HTTP 422 while verified_policy_count 1 != policy_count 2"
            - "after the fourth attestation ${ls_verified2} == 2 and the activation succeeds with ${ls_status} == 'ACTIVE'"
            - "${ls_total} == 1000000, ${ls_af} == 802000 == 1000000 - 200000 + 2000, ${ls_rate} == 1500 (tier 2, since 500000 < 802000 <= 2000000) and ${ls_fc} == 60150 == round_half_up(802000 * 1500 * 6 / 120000)"
            - "GET /policies filtered by agreement_id and status VERIFIED returns total_count == 2"

      - name: parallel_state_dimensions_move_independently_on_the_agreement
        claim_type: parallel
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.PremiumFinanceAgreement.status
          - state_machines.PremiumFinanceAgreement.delinquency_stage
        excluded_because:
          difficulty_instance: non_linear_state_machine / agreement_parallel_status_and_delinquency_dimensions
          rationale: "The §1.8 instance drives both dimensions of PremiumFinanceAgreement through their full tables and asserts every combined (status, delinquency_stage) pair, which is exactly this guide row."

      - name: cyclic_policy_dispute_and_reopen_loop
        claim_type: cyclic
        grounds:
          - state_machines.FinancedPolicy.PENDING_VERIFICATION_to_DISPUTED
          - state_machines.FinancedPolicy.DISPUTED_to_PENDING_VERIFICATION
        excluded_because:
          difficulty_instance: non_linear_state_machine / policy_dispute_revision_cycle
          rationale: "The §1.8 instance loops PENDING_VERIFICATION -> DISPUTED -> PENDING_VERIFICATION and re-quotes the agreement across the loop, covering the cycle claim in full."

      - name: guarded_transition_activation_requires_an_effective_license
        claim_type: guarded_transitions
        grounds:
          - state_machines.PremiumFinanceAgreement.PENDING_VERIFICATION_to_ACTIVE
          - entities.License.fields.is_effective
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / license_effectiveness_gates_agreement_activation
          rationale: "The §1.8 instance is the 'A -> B only if entity C in state X' claim verbatim, including the unblock leg."

      - name: side_effect_bubble_up_last_carrier_return_closes_the_note
        claim_type: side_effect_execution
        grounds:
          - state_machines.PremiumFinanceAgreement.ACTIVE_to_CANCELLED_DEFICIENT
          - state_machines.CarrierCancellationRequest.REQUESTED_to_RETURN_POSTED
        excluded_because:
          difficulty_instance: transitive_cascade / return_posting_to_agency_suspension_cascade
          rationale: "The §1.8 instance walks return posting -> deficiency -> chargeback -> agency suspension end to end, which includes the bubble-up from the last terminal CarrierCancellationRequest to the parent note."

      - name: side_effect_compensation_reversal_undoes_every_allocation
        claim_type: side_effect_execution
        grounds:
          - state_machines.Payment.POSTED_to_REVERSED
          - calculations.payment_waterfall_allocation.compensation_invariant
        excluded_because:
          difficulty_instance: compensating_invariant / total_receivable_invariant_across_reversal_and_waiver
          rationale: "The §1.8 instance asserts the full undo — four balance fields, installment status and paid_cents, and the late-fee row — with zero drift."

  - section: calculations
    instances:

      - name: precision_simple_interest_rounds_each_period_before_summing
        claim_type: precision
        grounds:
          - calculations.finance_charge_and_amount_financed.precision
          - calculations.finance_charge_and_amount_financed.formula
          - entities.StateRateRule.fields.finance_charge_method
        distinguishing_aspect: |
          The SIMPLE_INTEREST branch pins the ROUNDING ORDER: round_half_up is applied to every
          period's declining-balance interest and the rounded figures are then summed. The CA fixture
          is chosen so the two orders disagree — per-period rounding gives 13205 while summing the
          exact products and rounding once gives 13204. The first period is a second, independent
          probe: 3772.5 exactly, which round_half_up must carry UP to 3773 where banker's rounding
          would give 3772. One fixture therefore catches both a wrong rounding order and a wrong
          rounding mode, and neither shows up under the ADD_ON method at all.
        test_recipe:
          setup:
            - "a CA state rule with finance_charge_method SIMPLE_INTEREST, max_annual_rate_bps 1800, max_service_fee_cents 2000, min_down_payment_bps 1500, max_term_months 12, and an effective License"
            - "a note with one 300000 policy, down payment 50000, service fee 1500, 6 installments, first due 2026-10-01, with the policy VERIFIED by both parties"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /state-rate-rules"
              payload: { state_code: "CA", finance_charge_method: "SIMPLE_INTEREST", max_annual_rate_bps: 1800, max_service_fee_cents: 2000, min_down_payment_bps: 1500, max_term_months: 12, late_fee_bps: 500, late_fee_min_cents: 500, late_fee_max_cents: 10000, grace_period_days: 10, noic_notice_days: 10, unearned_premium_method: "PRO_RATA", short_rate_penalty_bps: 1000, rebate_method: "RULE_OF_78", max_late_fees_per_agreement: 3, license_required: true }
              as: ComplianceOfficer
              captures: { pr_rule: "$.data.id", pr_method: "$.data.finance_charge_method" }
            - call: "POST /state-rate-rules/${pr_rule}/licenses"
              payload: { license_number: "PFC-CA-001", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ComplianceOfficer
            - call: "POST /insureds"
              payload: { legal_name: "Pacific Freight Cooperative", mailing_state_code: "CA", email: "ap@pacfreight.example" }
              as: FinanceAnalyst
              captures: { pr_insured: "$.data.id" }
            - call: "POST /agents"
              payload: { agency_name: "Golden Gate Brokers", state_code: "CA", agent_commission_bps: 1000, chargeback_basis: "COMMISSION_CAPPED", chargeback_liability_cap_cents: 400000, initial_reserve_balance_cents: 75000 }
              as: ComplianceOfficer
              captures: { pr_agent: "$.data.id" }
            - call: "POST /insurers"
              payload: { carrier_name: "Sierra Mutual", naic_code: "20456", status: "ACTIVE" }
              as: ComplianceOfficer
              captures: { pr_insurer: "$.data.id" }
            - call: "POST /agreements"
              payload: { insured_id: "${pr_insured}", producer_agent_id: "${pr_agent}", state_rule_id: "${pr_rule}", down_payment_cents: 50000, service_fee_cents: 1500, installment_count: 6, first_installment_due_date: "2026-10-01" }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { pr_agr: "$.data.id" }
            - call: "POST /agreements/${pr_agr}/policies"
              payload: { insurer_id: "${pr_insurer}", policy_number: "SM-PR-1", gross_premium_cents: 300000, effective_date: "2026-09-01", expiration_date: "2027-09-01", min_earned_days: 0, fully_earned: false }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { pr_pol: "$.data.id" }
            - call: "POST /agreements/${pr_agr}/submit"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { pr_fc_prov: "$.data.finance_charge_cents" }
            - call: "POST /policies/${pr_pol}/verifications"
              payload: { decision: "CONFIRMED" }
              as: Insurer
              as_user_id: "${pr_insurer}"
            - call: "POST /policies/${pr_pol}/verifications"
              payload: { decision: "CONFIRMED" }
              as: ProducerAgent
              as_user_id: "${pr_agent}"
          trigger:
            - call: "POST /agreements/${pr_agr}/activate"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { pr_af: "$.data.amount_financed_cents", pr_rate: "$.data.effective_annual_rate_bps", pr_fc: "$.data.finance_charge_cents", pr_top: "$.data.total_of_payments_cents", pr_unpaid_fc: "$.data.unpaid_finance_charge_cents" }
            - call: "GET /agreements/${pr_agr}/installments"
              payload: { limit: 100 }
              as: FinanceAnalyst
              captures: { pr_i1_fc: "$.data[0].finance_charge_component_cents", pr_i2_fc: "$.data[1].finance_charge_component_cents", pr_i6_fc: "$.data[5].finance_charge_component_cents" }
          assert:
            - "${pr_method} == 'SIMPLE_INTEREST' and ${pr_af} == 251500 == 300000 - 50000 + 1500, so the volume tier is TIER1 (251500 <= 500000) and ${pr_rate} == 1800 == min(1800, max_annual_rate_bps 1800)"
            - "${pr_fc} == 13205 — the sum of the six per-period figures round_half_up(251500/80·…) = 3773 + 3144 + 2515 + 1886 + 1258 + 629"
            - "${pr_fc} != 13204, which is what summing the exact products (13203.90) and rounding once produces: the rounding order is observable in the answer"
            - "${pr_i1_fc} == 3773 — period 1 is exactly 251500 * 1800 / 120000 == 3772.5, and round_half_up carries the tie UP; banker's rounding would give 3772 and break the total"
            - "${pr_i2_fc} == 3144 (3143.76 rounded up) and ${pr_i6_fc} == 629 (628.8 rounded up), so the declining balance drives each period independently"
            - "${pr_top} == 264705 == 251500 + 13205 and ${pr_unpaid_fc} == 13205 at activation"
            - "${pr_fc_prov} == 13205 as well — the provisional and final bases agree here because the attestation CONFIRMED the quoted 300000, so any difference in this fixture is a rounding fault and not a basis fault"

      - name: correct_result_simple_interest_declining_installment_schedule
        claim_type: correct_result
        grounds:
          - calculations.installment_schedule_generation.formula
          - state_machines.PremiumFinanceAgreement.PENDING_VERIFICATION_to_ACTIVE
        distinguishing_aspect: |
          Under SIMPLE_INTEREST the schedule is NOT level: principal is an equal slice with the
          remainder on the last installment, while the finance charge component shrinks every period,
          so the installment amount declines from 45689 to 42549. This is structurally the opposite of
          the ADD_ON branch (constant amount, constant finance charge, remainder on the last), and the
          two must not be conflated. Every one of the six amounts is asserted from the formula, along
          with the three column sums that must close exactly on amount_financed and finance_charge.
        test_recipe:
          setup:
            - "the CA SIMPLE_INTEREST regime and the 300000 note from the precision fixture, activated"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /state-rate-rules"
              payload: { state_code: "CA", finance_charge_method: "SIMPLE_INTEREST", max_annual_rate_bps: 1800, max_service_fee_cents: 2000, min_down_payment_bps: 1500, max_term_months: 12, late_fee_bps: 500, late_fee_min_cents: 500, late_fee_max_cents: 10000, grace_period_days: 10, noic_notice_days: 10, unearned_premium_method: "PRO_RATA", short_rate_penalty_bps: 1000, rebate_method: "RULE_OF_78", max_late_fees_per_agreement: 3, license_required: true }
              as: ComplianceOfficer
              captures: { cr_rule: "$.data.id" }
            - call: "POST /state-rate-rules/${cr_rule}/licenses"
              payload: { license_number: "PFC-CA-001", effective_date: "2026-01-01", expiration_date: "2027-12-31" }
              as: ComplianceOfficer
            - call: "POST /insureds"
              payload: { legal_name: "Pacific Freight Cooperative", mailing_state_code: "CA", email: "ap@pacfreight.example" }
              as: FinanceAnalyst
              captures: { cr_insured: "$.data.id" }
            - call: "POST /agents"
              payload: { agency_name: "Golden Gate Brokers", state_code: "CA", agent_commission_bps: 1000, chargeback_basis: "COMMISSION_CAPPED", chargeback_liability_cap_cents: 400000, initial_reserve_balance_cents: 75000 }
              as: ComplianceOfficer
              captures: { cr_agent: "$.data.id" }
            - call: "POST /insurers"
              payload: { carrier_name: "Sierra Mutual", naic_code: "20456", status: "ACTIVE" }
              as: ComplianceOfficer
              captures: { cr_insurer: "$.data.id" }
            - call: "POST /agreements"
              payload: { insured_id: "${cr_insured}", producer_agent_id: "${cr_agent}", state_rule_id: "${cr_rule}", down_payment_cents: 50000, service_fee_cents: 1500, installment_count: 6, first_installment_due_date: "2026-10-01" }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { cr_agr: "$.data.id" }
            - call: "POST /agreements/${cr_agr}/policies"
              payload: { insurer_id: "${cr_insurer}", policy_number: "SM-CR-1", gross_premium_cents: 300000, effective_date: "2026-09-01", expiration_date: "2027-09-01", min_earned_days: 0, fully_earned: false }
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { cr_pol: "$.data.id" }
            - call: "POST /agreements/${cr_agr}/submit"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
            - call: "POST /policies/${cr_pol}/verifications"
              payload: { decision: "CONFIRMED" }
              as: Insurer
              as_user_id: "${cr_insurer}"
            - call: "POST /policies/${cr_pol}/verifications"
              payload: { decision: "CONFIRMED" }
              as: ProducerAgent
              as_user_id: "${cr_agent}"
            - call: "POST /agreements/${cr_agr}/activate"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-origin"
              captures: { cr_top: "$.data.total_of_payments_cents", cr_af: "$.data.amount_financed_cents", cr_fc: "$.data.finance_charge_cents" }
          trigger:
            - call: "GET /agreements/${cr_agr}/installments"
              payload: { limit: 100 }
              as: FinanceAnalyst
              captures: { a1: "$.data[0].amount_cents", p1: "$.data[0].principal_component_cents", f1: "$.data[0].finance_charge_component_cents", d1: "$.data[0].due_date", a2: "$.data[1].amount_cents", p2: "$.data[1].principal_component_cents", a3: "$.data[2].amount_cents", a4: "$.data[3].amount_cents", a5: "$.data[4].amount_cents", a6: "$.data[5].amount_cents", p6: "$.data[5].principal_component_cents", f6: "$.data[5].finance_charge_component_cents", d6: "$.data[5].due_date" }
          assert:
            - "the list has total_count == 6 ordered by installment_number, with ${cr_af} == 251500, ${cr_fc} == 13205 and ${cr_top} == 264705"
            - "amounts DECLINE: ${a1} == 45689, ${a2} == 45060, ${a3} == 44431, ${a4} == 43802, ${a5} == 43174, ${a6} == 42549 — no two installments are equal, unlike the ADD_ON branch"
            - "principal is a flat slice: base_principal == floor(251500 / 6) == 41916, so ${p1} == ${p2} == 41916 while ${p6} == 41920 carries the 4-cent remainder"
            - "${f1} == 3773 and ${f6} == 629 — the finance charge component is what makes the amount decline, and ${a1} == ${p1} + ${f1} == 41916 + 3773"
            - "sum(amount_cents) == 264705 == total_of_payments_cents, sum(principal_component_cents) == 251500 == amount_financed_cents, sum(finance_charge_component_cents) == 13205 == finance_charge_cents — all three columns close exactly"
            - "${d1} == '2026-10-01' and ${d6} == '2027-03-01' — add_calendar_months preserves the day of month across the year boundary"

      - name: input_set_filtering_servicing_run_skips_inactive_notes_and_paid_installments
        claim_type: input_set_filtering
        grounds:
          - calculations.late_fee_assessment.input_set
          - endpoints.POST_servicing_runs
          - state_machines.LateFeeAssessment.initial_state
        distinguishing_aspect: |
          The servicing sweep's input set is doubly restricted: only agreements with status == ACTIVE
          participate, and within those only installments with status IN {SCHEDULED, PAST_DUE}. The
          fixture puts three notes on the same rule — one ACTIVE, one PENDING_VERIFICATION, one DRAFT
          — and gives the ACTIVE one an installment that is ALREADY PAID but long past its due date.
          A sweep that iterates all agreements marks the two unactivated notes; a sweep that iterates
          all installments assesses a fee against the paid one. Both faults are visible in the run's
          own three counters, so no cross-checking of individual rows is needed to detect them.
