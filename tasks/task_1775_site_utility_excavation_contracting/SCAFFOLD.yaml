# =============================================================================
# SCAFFOLD.yaml — task_1775_site_utility_excavation_contracting
# §1.0–§1.7 (difficulty design and corner design live in sibling files)
# =============================================================================

scenario: |
  Site Utility & Excavation Contracting (site utility contractor): utility locate
  request & potholing verification, trench safety plan & shoring/sloping compliance,
  pipe material/bedding spec & installation inspection, tie-in scheduling with
  utility owner & shutdown windows, dewatering & discharge permit, backfill
  compaction testing, as-built survey & record submission, unforeseen condition
  change order

domain_name: site-utility-excavation-contracting
api_prefix: /site-utility

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# All entities are flat peers (no URL nesting); every cross-reference is an FK
# in a request body. common_fields: true expands to id (server-minted UUID),
# created_at / updated_at (ISO 8601 UTC, 3 fractional digits), version
# (integer, starts 1, +1 on every mutation).
# =============================================================================
entities:
  - name: Project
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Project display name" }
      - { name: contract_ref, type: string, source: input, description: "Contract / job number" }
      - { name: soil_class_default, type: enum, source: input, description: "SOIL_A | SOIL_B | SOIL_C — default soil classification for the site" }
      - { name: contingency_cents, type: integer, source: input, description: "Owner-funded contingency pool for change orders" }
      - { name: single_co_cap_cents, type: integer, source: input, description: "Per-change-order provisional price cap" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CLOSING | CLOSED" }
      - { name: work_posture, type: enum, source: computed, description: "CLEAR | STOPPED — STOPPED iff any UnforeseenCondition of this project has status OPEN and stop_work_required = true" }
      - { name: approved_co_total_cents, type: integer, source: computed, default: 0, description: "Sum of provisional_price_cents of APPROVED ChangeOrders plus final_price_cents of COMPLETED ChangeOrders for this project" }
      - { name: closed_at, type: datetime, source: system, description: "Set when status -> CLOSED; null otherwise", required: false }

  - name: UtilityOwner
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Utility owner display name" }
      - { name: owner_type, type: enum, source: input, description: "WATER | SEWER | GAS | ELECTRIC | TELECOM" }
      - { name: min_notice_hours, type: integer, source: input, description: "Minimum notice before a shutdown window start" }
      - { name: max_shutdown_hours, type: integer, source: input, description: "Maximum duration of a single shutdown window" }
      - { name: committed_shutdown_minutes, type: integer, source: computed, default: 0, description: "Sum of duration_minutes of this owner's ShutdownWindows with status IN {PROPOSED, CONFIRMED, ACTIVE}" }

  - name: LocateTicket
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; ticket covers this project's dig area" }
      - { name: ticket_number, type: string, source: input, description: "One-call center ticket number" }
      - { name: legal_start_at, type: datetime, source: input, description: "Earliest legal dig instant (waiting-period expiry)" }
      - { name: valid_until, type: datetime, source: computed, description: "= legal_start_at + 672h at creation; each renew adds another 672h" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACTIVE | EXPIRED" }
      - { name: renew_count, type: integer, source: system, default: 0, description: "Number of successful renewals" }

  - name: PotholeVerification
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: locate_ticket_id, type: string, source: input, description: "FK -> LocateTicket.id; must belong to the same project" }
      - { name: station_label, type: string, source: input, description: "Survey station label, e.g. STA 10+25" }
      - { name: expected_utility_type, type: enum, source: input, description: "WATER | SEWER | GAS | ELECTRIC | TELECOM | UNKNOWN" }
      - { name: method, type: enum, source: input, description: "VACUUM | HAND_DIG" }
      - { name: design_depth_in, type: integer, source: input, description: "Design depth to utility top, inches" }
      - { name: design_offset_in, type: integer, source: input, description: "Design horizontal offset from station, inches" }
      - { name: measured_depth_in, type: integer, source: input, description: "Measured depth, recorded at perform; null until performed", required: false }
      - { name: measured_offset_in, type: integer, source: input, description: "Measured offset, recorded at perform; null until performed", required: false }
      - { name: status, type: enum, source: system, description: "PLANNED | PERFORMED | VERIFIED | CONFLICT | SUPERSEDED" }

  - name: PipeSegment
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: utility_owner_id, type: string, source: input, description: "FK -> UtilityOwner.id; owner of the facility this segment ties into" }
      - { name: segment_label, type: string, source: input, description: "Segment identifier, e.g. WL-A-01" }
      - { name: pipe_material, type: enum, source: input, description: "PVC_C900 | DUCTILE_IRON | HDPE | RCP" }
      - { name: diameter_in, type: integer, source: input, description: "Nominal pipe diameter, inches" }
      - { name: length_ft, type: number, source: input, description: "Design length, feet" }
      - { name: bedding_class, type: enum, source: input, description: "CLASS_B | CLASS_C | CLASS_D" }
      - { name: design_invert_depth_ft, type: number, source: input, description: "Design depth to pipe invert, feet" }
      - { name: design_slope_pct, type: number, source: input, description: "Design slope, percent" }
      - { name: requires_dewatering, type: boolean, source: input, description: "True if installation needs active dewatering" }
      - { name: lifts_required, type: integer, source: computed, description: "= ceil((design_invert_depth_ft + diameter_in/12 + bedding_depth_ft(bedding_class)) / 1.0)" }
      - { name: lifts_satisfied, type: integer, source: computed, default: 0, description: "Count of lift numbers 1..lifts_required having an ACCEPTED CompactionTest with result PASS" }
      - { name: avg_compaction_pct, type: number, source: computed, description: "Arithmetic mean of compaction_pct over governing (ACCEPTED) tests; null when none", required: false }
      - { name: min_compaction_pct, type: number, source: computed, description: "Minimum compaction_pct over governing (ACCEPTED) tests; null when none", required: false }
      - { name: hold_reason, type: enum, source: system, description: "NONE | STOP_WORK | DEWATERING — set when status ON_HOLD", default: "NONE" }
      - { name: resume_status, type: enum, source: system, description: "Status to return to when hold clears: INSTALLING | BACKFILLING; null when not held", required: false }
      - { name: tie_in_completed, type: boolean, source: system, default: false, description: "Set true when a ShutdownWindow for this segment completes" }
      - { name: status, type: enum, source: system, description: "PLANNED | READY | INSTALLING | INSTALLED | BACKFILLING | COMPLETE | ON_HOLD" }

  - name: TrenchSafetyPlan
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: pipe_segment_id, type: string, source: input, description: "FK -> PipeSegment.id; must belong to the same project" }
      - { name: max_depth_ft, type: number, source: input, description: "Maximum trench depth covered by this plan, feet" }
      - { name: soil_class, type: enum, source: input, description: "SOIL_A | SOIL_B | SOIL_C" }
      - { name: protective_system, type: enum, source: input, description: "SLOPING | BENCHING | SHORING | TRENCH_BOX" }
      - { name: slope_ratio, type: number, source: input, description: "H:V ratio; required when protective_system IN {SLOPING, BENCHING}", required: false }
      - { name: engineered_certification, type: boolean, source: input, default: false, description: "Registered-PE certification; required when max_depth_ft >= 20" }
      - { name: revision, type: integer, source: system, default: 1, description: "Increments on each REJECTED -> DRAFT revision" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID captured at submit" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of reviewer; null until reviewed", required: false }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REJECTED | VOIDED" }

  - name: InstallationInspection
    parent: null
    common_fields: true
    fields:
      - { name: pipe_segment_id, type: string, source: input, description: "FK -> PipeSegment.id" }
      - { name: bedding_ok, type: boolean, source: input, description: "Bedding placement conforms to segment bedding_class" }
      - { name: joint_ok, type: boolean, source: input, description: "Pipe joints conform" }
      - { name: slope_measured_pct, type: number, source: input, description: "Measured installed slope, percent" }
      - { name: cover_depth_ft, type: number, source: input, description: "Measured cover over pipe crown, feet" }
      - { name: result, type: enum, source: computed, description: "PASS | FAIL — per installation_inspection_result calculation" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of recording Inspector" }
      - { name: status, type: enum, source: system, description: "RECORDED | CONFIRMED | DISPUTED" }

  - name: ShutdownWindow
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: utility_owner_id, type: string, source: input, description: "FK -> UtilityOwner.id" }
      - { name: pipe_segment_id, type: string, source: input, description: "FK -> PipeSegment.id; must belong to the same project" }
      - { name: window_start, type: datetime, source: input, description: "Planned shutdown start (UTC)" }
      - { name: window_end, type: datetime, source: input, description: "Planned shutdown end (UTC); half-open interval [start, end)" }
      - { name: duration_minutes, type: integer, source: computed, description: "= (window_end - window_start) in minutes" }
      - { name: status, type: enum, source: system, description: "PROPOSED | CONFIRMED | ACTIVE | COMPLETED | MISSED | REJECTED | CANCELLED" }

  - name: DischargePermit
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: permit_number, type: string, source: input, description: "Regulator permit number" }
      - { name: max_flow_gpm, type: integer, source: input, description: "Maximum instantaneous discharge flow" }
      - { name: turbidity_limit_ntu, type: integer, source: input, description: "Turbidity compliance limit" }
      - { name: daily_volume_limit_gal, type: integer, source: input, description: "Maximum cumulative discharge volume per UTC day" }
      - { name: effective_from, type: datetime, source: input, description: "Permit effective start (UTC)" }
      - { name: effective_to, type: datetime, source: input, description: "Permit effective end (UTC); half-open [from, to)" }
      - { name: exceedance_count, type: integer, source: system, default: 0, description: "Count of readings classified EXCEEDS_*" }
      - { name: status, type: enum, source: system, description: "ISSUED | ACTIVE | SUSPENDED | EXPIRED" }

  - name: DischargeReading
    parent: null
    common_fields: true
    fields:
      - { name: discharge_permit_id, type: string, source: input, description: "FK -> DischargePermit.id" }
      - { name: recorded_at, type: datetime, source: input, description: "When the reading was taken (UTC); must fall inside the permit effective window" }
      - { name: flow_gpm, type: integer, source: input, description: "Measured flow" }
      - { name: turbidity_ntu, type: integer, source: input, description: "Measured turbidity" }
      - { name: duration_min, type: integer, source: input, description: "Discharge duration represented by this reading" }
      - { name: volume_gal, type: integer, source: computed, description: "= flow_gpm * duration_min" }
      - { name: classification, type: enum, source: computed, description: "NORMAL | EXCEEDS_FLOW | EXCEEDS_TURBIDITY | EXCEEDS_VOLUME — per discharge_classification calculation" }

  - name: CompactionTest
    parent: null
    common_fields: true
    fields:
      - { name: pipe_segment_id, type: string, source: input, description: "FK -> PipeSegment.id" }
      - { name: lift_number, type: integer, source: input, description: "Backfill lift index, 1-based; must equal (max lift_number of any RECORDED/ACCEPTED test on the segment) + 1" }
      - { name: proctor_max_density_pcf, type: number, source: input, description: "Lab maximum dry density" }
      - { name: field_density_pcf, type: number, source: input, description: "Field-measured dry density" }
      - { name: moisture_pct, type: number, source: input, description: "Field moisture content, percent" }
      - { name: compaction_pct, type: number, source: computed, description: "= round_half_up(100 * field_density_pcf / proctor_max_density_pcf, 1)" }
      - { name: required_pct, type: number, source: computed, description: "Required compaction by segment bedding_class: CLASS_B 95.0 | CLASS_C 90.0 | CLASS_D 85.0" }
      - { name: result, type: enum, source: computed, description: "PASS iff compaction_pct >= required_pct else FAIL" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of recording Foreman" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of reviewing Inspector; null until reviewed", required: false }
      - { name: status, type: enum, source: system, description: "RECORDED | ACCEPTED | REJECTED" }

  - name: AsBuiltPackage
    parent: null
    common_fields: true
    fields:
      - { name: pipe_segment_id, type: string, source: input, description: "FK -> PipeSegment.id" }
      - { name: surveyor_stamp, type: string, source: input, description: "Licensed surveyor stamp / cert id" }
      - { name: measured_length_ft, type: number, source: input, description: "Surveyed as-built length" }
      - { name: measured_invert_ft, type: number, source: input, description: "Surveyed as-built invert depth" }
      - { name: length_variance_ft, type: number, source: computed, description: "= measured_length_ft - pipe_segment.length_ft" }
      - { name: invert_variance_ft, type: number, source: computed, description: "= measured_invert_ft - pipe_segment.design_invert_depth_ft" }
      - { name: within_tolerance, type: boolean, source: computed, description: "Per as_built_acceptance calculation" }
      - { name: revision, type: integer, source: system, default: 1, description: "Increments on each REJECTED -> DRAFT revision" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACCEPTED | REJECTED" }

  - name: UnforeseenCondition
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: pipe_segment_id, type: string, source: input, description: "FK -> PipeSegment.id; optional — null for project-wide conditions", required: false }
      - { name: condition_type, type: enum, source: input, description: "ROCK | GROUNDWATER | CONTAMINATED_SOIL | CONFLICTING_UTILITY | VOID" }
      - { name: stop_work_required, type: boolean, source: input, description: "True when the condition forces a project-wide stop" }
      - { name: description, type: string, source: input, description: "Free-text condition description" }
      - { name: status, type: enum, source: system, description: "OPEN | MITIGATING | RESOLVED | CLOSED_NO_ACTION" }

  - name: ChangeOrder
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id" }
      - { name: unforeseen_condition_id, type: string, source: input, description: "FK -> UnforeseenCondition.id; must belong to the same project" }
      - { name: utility_owner_id, type: string, source: input, description: "FK -> UtilityOwner.id; owner responsible for payment" }
      - { name: revision, type: integer, source: system, default: 1, description: "Increments on each REJECTED -> DRAFT revision" }
      - { name: labor_hours, type: number, source: input, description: "Estimated labor hours" }
      - { name: labor_rate_cents, type: integer, source: input, description: "Estimated labor rate, cents/hour" }
      - { name: equipment_hours, type: number, source: input, description: "Estimated equipment hours" }
      - { name: equipment_rate_cents, type: integer, source: input, description: "Estimated equipment rate, cents/hour" }
      - { name: material_cost_cents, type: integer, source: input, description: "Estimated material cost" }
      - { name: direct_cost_cents, type: integer, source: computed, description: "Per change_order_price calculation" }
      - { name: markup_cents, type: integer, source: computed, description: "Marginal tiered markup per change_order_price calculation" }
      - { name: provisional_price_cents, type: integer, source: computed, description: "Estimate-based total: direct_cost_cents + markup_cents" }
      - { name: final_price_cents, type: integer, source: computed, description: "Actuals-based total, computed at complete; null until COMPLETED", required: false }
      - { name: price_delta_cents, type: integer, source: computed, description: "= final_price_cents - provisional_price_cents at completion; null until COMPLETED", required: false }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID captured at submit" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of reviewer; null until reviewed", required: false }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REJECTED | COMPLETED | SUPERSEDED" }

  - name: AuditEvent
    parent: null
    common_fields: false
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; project scope of the mutated entity" }
      - { name: actor_role, type: string, source: system, description: "X-User-Role of the caller" }
      - { name: actor_user_id, type: string, source: system, description: "X-User-ID of the caller" }
      - { name: action, type: string, source: system, description: "<METHOD> <path-template> of the mutation" }
      - { name: entity_type, type: string, source: system, description: "Entity name of the mutated resource" }
      - { name: entity_id, type: string, source: system, description: "id of the mutated resource" }
      - { name: detail, type: string, source: system, description: "Human-readable summary (e.g. 'status DRAFT->SUBMITTED')" }

# =============================================================================
# §1.2 State Machine Table
# Time-driven transitions fire when the logical clock advances via
# POST /site-utility/_clock/set_current_utc (see §1.5). Evaluation order on a
# clock advance is pinned: (1) locate tickets activate, (2) locate tickets
# expire, (3) discharge permits activate/expire, (4) shutdown windows
# activate/miss. All system transitions also append an AuditEvent.
# =============================================================================
state_machines:
  - entity: Project
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CLOSING
        trigger: "POST /site-utility/projects/{id}/begin-closeout"
        actor: ProjectManager
        preconditions:
          - "Every PipeSegment with pipe_segment.project_id == project.id has status COMPLETE (else ERR_CLOSEOUT_INCOMPLETE)"
          - "Every PipeSegment of the project has an AsBuiltPackage with status ACCEPTED (else ERR_CLOSEOUT_INCOMPLETE)"
          - "No UnforeseenCondition of the project with status IN {OPEN, MITIGATING} (else ERR_CLOSEOUT_INCOMPLETE)"
          - "No ChangeOrder of the project with status IN {DRAFT, SUBMITTED, APPROVED} (else ERR_CLOSEOUT_INCOMPLETE)"
          - "project.work_posture == CLEAR (else ERR_CLOSEOUT_INCOMPLETE)"
        side_effects: ["AuditEvent appended"]
      - from: CLOSING
        to: CLOSED
        trigger: "POST /site-utility/projects/{id}/close"
        actor: ProjectManager
        preconditions: []
        side_effects:
          - "closed_at := current logical clock time"
          - "AuditEvent appended"

  - entity: Project
    field: work_posture
    initial_state: CLEAR
    terminal_states: []
    transitions:
      - from: CLEAR
        to: STOPPED
        trigger: "system (an UnforeseenCondition of the project is created with stop_work_required = true)"
        actor: system
        preconditions: []
        side_effects:
          - "Every PipeSegment of the project with status IN {INSTALLING, BACKFILLING} -> ON_HOLD; hold_reason := STOP_WORK; resume_status := prior status"
          - "This is hop 2 of the stop_work cascade (hop 1 is the condition create setting work_posture STOPPED)"
      - from: STOPPED
        to: CLEAR
        trigger: "system (the last UnforeseenCondition of the project with status OPEN and stop_work_required = true leaves OPEN)"
        actor: system
        preconditions:
          - "No remaining UnforeseenCondition of the project with status OPEN and stop_work_required = true"
        side_effects:
          - "Every PipeSegment of the project with status ON_HOLD and hold_reason == STOP_WORK -> its resume_status; hold_reason := NONE; resume_status := null"
          - "Segments with hold_reason == DEWATERING are NOT resumed by this transition"

  - entity: LocateTicket
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /site-utility/locate-tickets/{id}/submit"
        actor: ProjectManager
        preconditions:
          - "No other LocateTicket of the same project with status IN {DRAFT, SUBMITTED, ACTIVE} (else ERR_DUPLICATE_OPEN_TICKET)"
        side_effects: ["AuditEvent appended"]
      - from: SUBMITTED
        to: ACTIVE
        trigger: "system (clock advance: now >= legal_start_at)"
        actor: system
        preconditions: ["now >= legal_start_at"]
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (clock advance: now >= valid_until)"
        actor: system
        preconditions: ["now >= valid_until"]
        side_effects: []
      - from: SUBMITTED
        to: EXPIRED
        trigger: "system (clock advance: now >= valid_until while still SUBMITTED)"
        actor: system
        preconditions: ["now >= valid_until"]
        side_effects: []
        note: "Clock evaluation activates then expires within one advance, so a ticket whose window was skipped lands EXPIRED"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /site-utility/locate-tickets/{id}/renew"
        actor: ProjectManager
        preconditions: []
        side_effects:
          - "valid_until := valid_until + 672h"
          - "renew_count += 1"
          - "If now >= new valid_until: status -> EXPIRED instead (renewal too late to matter)"
      - from: EXPIRED
        to: ACTIVE
        trigger: "POST /site-utility/locate-tickets/{id}/renew"
        actor: ProjectManager
        preconditions: ["valid_until + 672h > now (new validity must cover the current instant; else stays EXPIRED and renew_count still increments)"]
        side_effects:
          - "valid_until := valid_until + 672h"
          - "renew_count += 1"

  - entity: PotholeVerification
    initial_state: PLANNED
    terminal_states: [VERIFIED, SUPERSEDED]
    transitions:
      - from: PLANNED
        to: PERFORMED
        trigger: "POST /site-utility/pothole-verifications/{id}/perform"
        actor: Foreman
        preconditions:
          - "The project's LocateTicket (pothole.locate_ticket_id) has status ACTIVE (else ERR_LOCATE_NOT_ACTIVE)"
          - "project.work_posture == CLEAR (else ERR_PROJECT_STOPPED)"
        side_effects:
          - "measured_depth_in / measured_offset_in recorded from input"
          - "AuditEvent appended"
      - from: PERFORMED
        to: VERIFIED
        trigger: "POST /site-utility/pothole-verifications/{id}/verify"
        actor: ProjectManager
        preconditions:
          - "abs(measured_depth_in - design_depth_in) <= 6 AND abs(measured_offset_in - design_offset_in) <= 12 (else ERR_POTHOLE_TOLERANCE_EXCEEDED)"
        side_effects: ["AuditEvent appended"]
      - from: PERFORMED
        to: CONFLICT
        trigger: "POST /site-utility/pothole-verifications/{id}/mark-conflict"
        actor: ProjectManager
        preconditions: []
        side_effects: ["AuditEvent appended"]
      - from: CONFLICT
        to: SUPERSEDED
        trigger: "system (a new PotholeVerification is created for the same project_id + station_label)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Only CONFLICT potholes may be superseded; creating a duplicate station while the existing one is PLANNED/PERFORMED/VERIFIED fails with ERR_DUPLICATE_STATION"

  - entity: TrenchSafetyPlan
    initial_state: DRAFT
    terminal_states: [APPROVED, VOIDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /site-utility/trench-safety-plans/{id}/submit"
        actor: Foreman
        preconditions:
          - "If protective_system IN {SLOPING, BENCHING}: slope_ratio present and slope_ratio >= required ratio for soil_class (SOIL_A 0.75 | SOIL_B 1.0 | SOIL_C 1.5) (else ERR_SLOPE_NONCOMPLIANT)"
          - "If max_depth_ft >= 20: protective_system IN {SHORING, TRENCH_BOX} AND engineered_certification == true (else ERR_ENGINEERED_DESIGN_REQUIRED)"
        side_effects:
          - "submitted_by_user_id := X-User-ID of caller"
          - "AuditEvent appended"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /site-utility/trench-safety-plans/{id}/review with decision=APPROVE"
        actor: SafetyOfficer
        preconditions:
          - "reviewer X-User-ID != submitted_by_user_id (else ERR_SOD_VIOLATION)"
        side_effects:
          - "reviewed_by_user_id := X-User-ID"
          - "AuditEvent appended"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /site-utility/trench-safety-plans/{id}/review with decision=REJECT"
        actor: SafetyOfficer
        preconditions:
          - "reviewer X-User-ID != submitted_by_user_id (else ERR_SOD_VIOLATION)"
        side_effects:
          - "reviewed_by_user_id := X-User-ID"
          - "AuditEvent appended"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /site-utility/trench-safety-plans/{id}/revise"
        actor: Foreman
        preconditions: []
        side_effects:
          - "revision += 1"
          - "Optional new max_depth_ft / soil_class / protective_system / slope_ratio / engineered_certification applied"
      - from: APPROVED
        to: VOIDED
        trigger: "system (an UnforeseenCondition with condition_type GROUNDWATER is created for the project and this plan's protective_system IN {SLOPING, BENCHING})"
        actor: system
        preconditions: []
        side_effects:
          - "Every PipeSegment of the project with status READY whose plan is this plan -> PLANNED (readiness recompute, see readiness_recompute calculation)"

  - entity: PipeSegment
    initial_state: PLANNED
    terminal_states: [COMPLETE]
    transitions:
      - from: PLANNED
        to: READY
        trigger: "POST /site-utility/pipe-segments/{id}/mark-ready"
        actor: Foreman
        preconditions:
          - "A TrenchSafetyPlan with trench_safety_plan.pipe_segment_id == segment.id has status APPROVED (else ERR_PLAN_NOT_APPROVED)"
          - "A LocateTicket with locate_ticket.project_id == segment.project_id has status ACTIVE (else ERR_LOCATE_NOT_ACTIVE)"
          - "No PotholeVerification of the project with status IN {PLANNED, PERFORMED, CONFLICT} (else ERR_POTHOLES_OUTSTANDING)"
          - "project.work_posture == CLEAR (else ERR_PROJECT_STOPPED)"
        side_effects: ["AuditEvent appended"]
      - from: READY
        to: INSTALLING
        trigger: "POST /site-utility/pipe-segments/{id}/start-install"
        actor: Foreman
        preconditions:
          - "A LocateTicket of the project has status ACTIVE (else ERR_LOCATE_NOT_ACTIVE)"
          - "project.work_posture == CLEAR (else ERR_PROJECT_STOPPED)"
        side_effects: ["AuditEvent appended"]
      - from: INSTALLING
        to: INSTALLED
        trigger: "POST /site-utility/pipe-segments/{id}/complete-install"
        actor: Foreman
        preconditions: []
        side_effects: ["AuditEvent appended"]
      - from: INSTALLED
        to: BACKFILLING
        trigger: "POST /site-utility/pipe-segments/{id}/start-backfill"
        actor: Foreman
        preconditions:
          - "The latest-by-created_at InstallationInspection of the segment with status CONFIRMED has result PASS (else ERR_INSPECTION_NOT_PASSED)"
          - "A LocateTicket of the project has status ACTIVE (else ERR_LOCATE_NOT_ACTIVE)"
          - "project.work_posture == CLEAR (else ERR_PROJECT_STOPPED)"
        side_effects: ["AuditEvent appended"]
      - from: INSTALLED
        to: INSTALLING
        trigger: "POST /site-utility/pipe-segments/{id}/reopen-install"
        actor: Foreman
        preconditions:
          - "The latest-by-created_at InstallationInspection of the segment with status CONFIRMED has result FAIL (else ERR_INVALID_STATE)"
        side_effects: ["AuditEvent appended"]
        note: "rework loop: INSTALLED -> INSTALLING -> INSTALLED"
      - from: BACKFILLING
        to: COMPLETE
        trigger: "POST /site-utility/pipe-segments/{id}/complete"
        actor: Foreman
        preconditions:
          - "lifts_satisfied == lifts_required (else ERR_LIFTS_INCOMPLETE)"
        side_effects: ["AuditEvent appended"]
      - from: INSTALLING
        to: ON_HOLD
        trigger: "system (project work_posture -> STOPPED, or the project's ACTIVE DischargePermit -> SUSPENDED while segment.requires_dewatering == true)"
        actor: system
        preconditions: []
        side_effects:
          - "hold_reason := STOP_WORK (posture cause) or DEWATERING (permit cause); resume_status := INSTALLING"
      - from: BACKFILLING
        to: ON_HOLD
        trigger: "system (project work_posture -> STOPPED)"
        actor: system
        preconditions: []
        side_effects:
          - "hold_reason := STOP_WORK; resume_status := BACKFILLING"
          - "note: dewatering suspension does not hold BACKFILLING segments (pipe already in ground)"
      - from: ON_HOLD
        to: INSTALLING
        trigger: "system (hold cleared: posture -> CLEAR for STOP_WORK holds, or permit -> ACTIVE for DEWATERING holds)"
        actor: system
        preconditions:
          - "resume_status == INSTALLING"
        side_effects: ["hold_reason := NONE", "resume_status := null"]
      - from: ON_HOLD
        to: BACKFILLING
        trigger: "system (hold cleared: posture -> CLEAR for STOP_WORK holds)"
        actor: system
        preconditions:
          - "resume_status == BACKFILLING"
        side_effects: ["hold_reason := NONE", "resume_status := null"]
      - from: READY
        to: PLANNED
        trigger: "system (the segment's APPROVED TrenchSafetyPlan -> VOIDED via GROUNDWATER condition)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: InstallationInspection
    initial_state: RECORDED
    terminal_states: [CONFIRMED, DISPUTED]
    transitions:
      - from: RECORDED
        to: CONFIRMED
        trigger: "POST /site-utility/installation-inspections/{id}/confirm"
        actor: Inspector
        preconditions:
          - "confirmer X-User-ID != recorded_by_user_id (else ERR_SOD_VIOLATION)"
        side_effects: ["AuditEvent appended"]
      - from: RECORDED
        to: DISPUTED
        trigger: "POST /site-utility/installation-inspections/{id}/dispute"
        actor: ProjectManager
        preconditions: []
        side_effects:
          - "AuditEvent appended"
          - "A DISPUTED inspection is ignored by the start-backfill gate; a new inspection may be recorded"

  - entity: ShutdownWindow
    initial_state: PROPOSED
    terminal_states: [COMPLETED, MISSED, REJECTED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST /site-utility/shutdown-windows/{id}/review with decision=CONFIRM"
        actor: UtilityOwnerRep
        preconditions:
          - "caller X-User-ID == window.utility_owner_id (else ERR_UNAUTHORIZED_ROLE)"
          - "project.work_posture == CLEAR (else ERR_PROJECT_STOPPED)"
          - "window.pipe_segment_id segment status IN {READY, INSTALLING, INSTALLED, BACKFILLING} (else ERR_INVALID_STATE)"
        side_effects:
          - "AuditEvent appended (utility_owner.committed_shutdown_minutes unchanged — PROPOSED already counts)"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /site-utility/shutdown-windows/{id}/review with decision=REJECT"
        actor: UtilityOwnerRep
        preconditions:
          - "caller X-User-ID == window.utility_owner_id (else ERR_UNAUTHORIZED_ROLE)"
        side_effects:
          - "utility_owner.committed_shutdown_minutes -= window.duration_minutes"
          - "AuditEvent appended"
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /site-utility/shutdown-windows/{id}/cancel, or system (segment of window held ON_HOLD with hold_reason DEWATERING)"
        actor: "ProjectManager | system"
        preconditions: []
        side_effects:
          - "utility_owner.committed_shutdown_minutes -= window.duration_minutes"
          - "AuditEvent appended"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /site-utility/shutdown-windows/{id}/cancel"
        actor: ProjectManager
        preconditions: ["now < window.window_end (else it is already MISSED territory — ERR_INVALID_STATE)"]
        side_effects:
          - "utility_owner.committed_shutdown_minutes -= window.duration_minutes"
          - "AuditEvent appended"
      - from: CONFIRMED
        to: ACTIVE
        trigger: "system (clock advance: now >= window_start AND now < window_end AND project.work_posture == CLEAR)"
        actor: system
        preconditions: []
        side_effects: []
        note: "A CONFIRMED window whose start passes while the project is STOPPED stays CONFIRMED"
      - from: PROPOSED
        to: MISSED
        trigger: "system (clock advance: now >= window_start while still PROPOSED)"
        actor: system
        preconditions: []
        side_effects: ["utility_owner.committed_shutdown_minutes -= window.duration_minutes"]
      - from: CONFIRMED
        to: MISSED
        trigger: "system (clock advance: now >= window_end while CONFIRMED)"
        actor: system
        preconditions: []
        side_effects: ["utility_owner.committed_shutdown_minutes -= window.duration_minutes"]
      - from: ACTIVE
        to: MISSED
        trigger: "system (clock advance: now >= window_end while ACTIVE)"
        actor: system
        preconditions: []
        side_effects: ["utility_owner.committed_shutdown_minutes -= window.duration_minutes"]
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /site-utility/shutdown-windows/{id}/complete"
        actor: Foreman
        preconditions: []
        side_effects:
          - "window.pipe_segment_id segment: tie_in_completed := true"
          - "utility_owner.committed_shutdown_minutes -= window.duration_minutes"
          - "AuditEvent appended"

  - entity: DischargePermit
    initial_state: ISSUED
    note: "At creation the status is computed once: ACTIVE when effective_from <= now < effective_to, otherwise ISSUED (clock-driven activation covers future-dated permits)"
    terminal_states: [EXPIRED]
    transitions:
      - from: ISSUED
        to: ACTIVE
        trigger: "system (clock advance: effective_from <= now < effective_to)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: EXPIRED
        trigger: "system (clock advance: now >= effective_to while still ISSUED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (clock advance: now >= effective_to)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (a DischargeReading on this permit is classified EXCEEDS_TURBIDITY)"
        actor: system
        preconditions: []
        side_effects:
          - "exceedance_count += 1"
          - "Every PipeSegment of the project with status INSTALLING and requires_dewatering == true -> ON_HOLD; hold_reason := DEWATERING; resume_status := INSTALLING"
          - "Every ShutdownWindow of each held segment with status PROPOSED -> CANCELLED; utility_owner.committed_shutdown_minutes decremented accordingly"
          - "This is hop 2 and hop 3 of the turbidity cascade (hop 1 is the reading classification)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /site-utility/discharge-permits/{id}/reinstate"
        actor: ProjectManager
        preconditions:
          - "effective_from <= now < effective_to (else transition to EXPIRED instead)"
          - "project.work_posture == CLEAR (else ERR_PROJECT_STOPPED)"
        side_effects:
          - "Every PipeSegment of the project with status ON_HOLD and hold_reason == DEWATERING -> resume_status; hold_reason := NONE; resume_status := null"
          - "AuditEvent appended"
      - from: SUSPENDED
        to: EXPIRED
        trigger: "system (clock advance: now >= effective_to), or POST /site-utility/discharge-permits/{id}/reinstate when now >= effective_to"
        actor: "system | ProjectManager"
        preconditions: ["now >= effective_to"]
        side_effects:
          - "Segments held ON_HOLD for DEWATERING remain ON_HOLD (excavation cannot resume under an expired permit)"

  - entity: CompactionTest
    initial_state: RECORDED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: RECORDED
        to: ACCEPTED
        trigger: "POST /site-utility/compaction-tests/{id}/review with decision=ACCEPT"
        actor: Inspector
        preconditions:
          - "reviewer X-User-ID != recorded_by_user_id (else ERR_SOD_VIOLATION)"
        side_effects:
          - "reviewed_by_user_id := X-User-ID"
          - "If result == PASS: segment.lifts_satisfied recomputed; segment.avg_compaction_pct / min_compaction_pct recomputed"
          - "AuditEvent appended"
      - from: RECORDED
        to: REJECTED
        trigger: "POST /site-utility/compaction-tests/{id}/review with decision=REJECT"
        actor: Inspector
        preconditions:
          - "reviewer X-User-ID != recorded_by_user_id (else ERR_SOD_VIOLATION)"
        side_effects:
          - "reviewed_by_user_id := X-User-ID"
          - "AuditEvent appended"

  - entity: AsBuiltPackage
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /site-utility/as-built-packages/{id}/submit"
        actor: ProjectManager
        preconditions:
          - "as_built.pipe_segment_id segment status == COMPLETE (else ERR_SEGMENT_NOT_COMPLETE)"
        side_effects: ["AuditEvent appended"]
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /site-utility/as-built-packages/{id}/review with decision=ACCEPT"
        actor: UtilityOwnerRep
        preconditions:
          - "caller X-User-ID == segment.utility_owner_id (else ERR_UNAUTHORIZED_ROLE)"
          - "within_tolerance == true (else ERR_ASBUILT_OUT_OF_TOLERANCE)"
        side_effects: ["AuditEvent appended"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /site-utility/as-built-packages/{id}/review with decision=REJECT"
        actor: UtilityOwnerRep
        preconditions:
          - "caller X-User-ID == segment.utility_owner_id (else ERR_UNAUTHORIZED_ROLE)"
        side_effects: ["AuditEvent appended"]
      - from: REJECTED
        to: DRAFT
        trigger: "POST /site-utility/as-built-packages/{id}/revise"
        actor: ProjectManager
        preconditions: []
        side_effects:
          - "revision += 1"
          - "Optional new measured_length_ft / measured_invert_ft / surveyor_stamp applied; variances recomputed"

  - entity: UnforeseenCondition
    initial_state: OPEN
    terminal_states: [RESOLVED, CLOSED_NO_ACTION]
    transitions:
      - from: OPEN
        to: MITIGATING
        trigger: "system (a ChangeOrder with change_order.unforeseen_condition_id == condition.id transitions to APPROVED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: RESOLVED
        trigger: "POST /site-utility/unforeseen-conditions/{id}/resolve with outcome=RESOLVED"
        actor: ProjectManager
        preconditions:
          - "No ChangeOrder of this condition with status IN {DRAFT, SUBMITTED, APPROVED} (else ERR_CO_NOT_COMPLETED)"
        side_effects:
          - "If stop_work_required: recompute project work_posture (may -> CLEAR, resuming STOP_WORK-held segments)"
          - "AuditEvent appended"
      - from: MITIGATING
        to: RESOLVED
        trigger: "POST /site-utility/unforeseen-conditions/{id}/resolve with outcome=RESOLVED"
        actor: ProjectManager
        preconditions:
          - "Every ChangeOrder of this condition has status COMPLETED or SUPERSEDED (else ERR_CO_NOT_COMPLETED)"
        side_effects:
          - "If stop_work_required: recompute project work_posture (may -> CLEAR, resuming STOP_WORK-held segments)"
          - "AuditEvent appended"
      - from: OPEN
        to: CLOSED_NO_ACTION
        trigger: "POST /site-utility/unforeseen-conditions/{id}/resolve with outcome=CLOSED_NO_ACTION"
        actor: ProjectManager
        preconditions:
          - "No ChangeOrder of this condition with status IN {DRAFT, SUBMITTED, APPROVED} (else ERR_CO_NOT_COMPLETED)"
        side_effects:
          - "If stop_work_required: recompute project work_posture (may -> CLEAR, resuming STOP_WORK-held segments)"
          - "AuditEvent appended"

  - entity: ChangeOrder
    initial_state: DRAFT
    terminal_states: [COMPLETED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /site-utility/change-orders/{id}/submit"
        actor: ProjectManager
        preconditions:
          - "condition (unforeseen_condition_id) status IN {OPEN, MITIGATING} (else ERR_CONDITION_NOT_OPEN)"
          - "provisional_price_cents <= project.single_co_cap_cents (else ERR_PRICE_CAP_EXCEEDED)"
        side_effects:
          - "submitted_by_user_id := X-User-ID"
          - "AuditEvent appended"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /site-utility/change-orders/{id}/review with decision=APPROVE"
        actor: "UtilityOwnerRep (provisional_price_cents >= 2500000) | ProjectManager (provisional_price_cents < 2500000)"
        preconditions:
          - "If provisional_price_cents >= 2500000: caller role UtilityOwnerRep and X-User-ID == change_order.utility_owner_id"
          - "If provisional_price_cents < 2500000: caller role ProjectManager"
          - "reviewer X-User-ID != submitted_by_user_id (else ERR_SOD_VIOLATION)"
          - "project.approved_co_total_cents + provisional_price_cents <= project.contingency_cents (else ERR_CONTINGENCY_EXCEEDED)"
          - "condition status IN {OPEN, MITIGATING} (else ERR_CONDITION_NOT_OPEN)"
        side_effects:
          - "reviewed_by_user_id := X-User-ID"
          - "project.approved_co_total_cents += provisional_price_cents"
          - "condition (if status OPEN) -> MITIGATING"
          - "AuditEvent appended"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /site-utility/change-orders/{id}/review with decision=REJECT"
        actor: "UtilityOwnerRep (provisional_price_cents >= 2500000) | ProjectManager (provisional_price_cents < 2500000)"
        preconditions:
          - "Same role gate as APPROVE; reviewer X-User-ID != submitted_by_user_id (else ERR_SOD_VIOLATION)"
        side_effects:
          - "reviewed_by_user_id := X-User-ID"
          - "AuditEvent appended"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /site-utility/change-orders/{id}/revise"
        actor: ProjectManager
        preconditions: []
        side_effects:
          - "revision += 1"
          - "Optional new pricing inputs applied; direct_cost_cents / markup_cents / provisional_price_cents recomputed"
      - from: APPROVED
        to: COMPLETED
        trigger: "POST /site-utility/change-orders/{id}/complete"
        actor: ProjectManager
        preconditions: []
        side_effects:
          - "final_price_cents computed from actual_* inputs (change_order_price, FINAL variant)"
          - "price_delta_cents := final_price_cents - provisional_price_cents"
          - "project.approved_co_total_cents += price_delta_cents (approved contribution swaps provisional -> final)"
          - "AuditEvent appended"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (a new ChangeOrder is created for the same unforeseen_condition_id)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system (a new ChangeOrder is created for the same unforeseen_condition_id)"
        actor: system
        preconditions: []
        side_effects: []
        note: "supersede is the CREATE-with-supersede case guarded by OCC rule change-order-create-stale-project"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: window-book-stale-project
    parent_entity: Project
    write_endpoint: "POST /site-utility/shutdown-windows"
    occ_field: expected_project_version
    description: |
      Creating a ShutdownWindow against a Project whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just booked a window (which legitimately
      succeeds and bumps Project.version) and the current writer's view of
      the project schedule is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: change-order-create-stale-project
    parent_entity: Project
    write_endpoint: "POST /site-utility/change-orders"
    occ_field: expected_project_version
    description: |
      Creating a ChangeOrder against a Project whose version has advanced
      since the client last observed it is rejected. Under the supersede
      rule a create against a fresh version legitimately supersedes an open
      ChangeOrder for the same condition; a stale-version create is refused
      so the supersede never fires from an outdated view of the project.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: change_order_price
    trigger: "ChangeOrder create; ChangeOrder revise; ChangeOrder complete (complete uses actual_* inputs and the FINAL variant)"
    algorithm: tiered_pricing
    formula: |
      # Pinned rounding order (mode b): round each cost line FIRST, then sum,
      # then compute each marginal tier slice and round each slice, then total.
      labor_cost_cents      = round_half_up(labor_hours * labor_rate_cents)
      equipment_cost_cents  = round_half_up(equipment_hours * equipment_rate_cents)
      direct_cost_cents     = labor_cost_cents + equipment_cost_cents + material_cost_cents
      # Marginal tiers over direct_cost_cents:
      #   slice1 = min(direct, 2500000) * 0.15
      #   slice2 = max(0, min(direct, 10000000) - 2500000) * 0.10
      #   slice3 = max(0, direct - 10000000) * 0.05
      markup_cents          = round_half_up(slice1) + round_half_up(slice2) + round_half_up(slice3)
      provisional_price_cents = direct_cost_cents + markup_cents   # PROVISIONAL variant
      # FINAL variant (at complete): identical formula over actual_* inputs.
      final_price_cents     = direct_cost_cents(actual_*) + markup_cents(actual_*)
      price_delta_cents     = final_price_cents - provisional_price_cents
    input_set: "The single ChangeOrder being priced. PROVISIONAL uses the estimated labor/equipment/material inputs; FINAL uses the actual_* inputs supplied at complete."
    constants:
      TIER1_LIMIT_CENTS: 2500000
      TIER1_RATE: 0.15
      TIER2_LIMIT_CENTS: 10000000
      TIER2_RATE: 0.10
      TIER3_RATE: 0.05
    precision: "integer cents; round_half_up applied per cost line and per tier slice, in the pinned order above"
    variants:
      - name: PROVISIONAL
        when: "create / revise / submit — the estimated price carried by the CO until completion"
        difference: "uses estimated hours/rates/material; stored as provisional_price_cents"
      - name: FINAL
        when: "complete — the time-and-materials settlement price"
        difference: "uses actual_* inputs; stored as final_price_cents; differs from provisional whenever actuals differ from estimates"

  - name: as_built_acceptance
    trigger: "AsBuiltPackage create and revise (recomputes variances and within_tolerance)"
    algorithm: aggregation
    formula: |
      length_variance_ft = measured_length_ft - pipe_segment.length_ft
      invert_variance_ft = measured_invert_ft - pipe_segment.design_invert_depth_ft
      length_tol_ft = max(1.0, round_half_up(0.01 * pipe_segment.length_ft, 1))
      invert_tol_ft = max(0.1, round_half_up(0.005 * pipe_segment.design_invert_depth_ft, 2))
      within_tolerance = (abs(length_variance_ft) <= length_tol_ft) AND (abs(invert_variance_ft) <= invert_tol_ft)
    input_set: "The AsBuiltPackage plus its referenced PipeSegment (design length / invert)."
    constants:
      MIN_LENGTH_TOL_FT: 1.0
      LENGTH_TOL_RATE: 0.01
      MIN_INVERT_TOL_FT: 0.1
      INVERT_TOL_RATE: 0.005
    precision: "feet; tolerances rounded half_up (length to 0.1 ft, invert to 0.01 ft) before comparison; boundary is inclusive (<="

  - name: compaction_test_result
    trigger: "CompactionTest create"
    algorithm: threshold
    formula: |
      compaction_pct = round_half_up(100 * field_density_pcf / proctor_max_density_pcf, 1)
      required_pct   = CLASS_B -> 95.0 | CLASS_C -> 90.0 | CLASS_D -> 85.0   # by segment bedding_class
      result         = PASS iff compaction_pct >= required_pct else FAIL     # boundary inclusive
    input_set: "The new CompactionTest plus its referenced PipeSegment.bedding_class."
    constants:
      REQUIRED_PCT_CLASS_B: 95.0
      REQUIRED_PCT_CLASS_C: 90.0
      REQUIRED_PCT_CLASS_D: 85.0
    precision: "0.1 percent resolution, round_half_up, before the >= comparison"

  - name: segment_compaction_summary
    trigger: "CompactionTest review with decision=ACCEPT (recomputes the segment's summary fields)"
    algorithm: aggregation
    formula: |
      governing = all CompactionTests of the segment with status ACCEPTED
      avg_compaction_pct = round_half_up(mean(governing.compaction_pct), 1)   # variant MEAN
      min_compaction_pct = min(governing.compaction_pct)                       # variant WORST_LIFT
      lifts_satisfied = count of distinct lift_number in 1..lifts_required having an ACCEPTED test with result PASS
      # Acceptance criterion for segment completion is WORST_LIFT per-lift PASS coverage
      # (lifts_satisfied == lifts_required), NOT the mean.
    input_set: "CompactionTests of the segment with status ACCEPTED only (RECORDED and REJECTED excluded)."
    precision: "compaction values carried at 0.1 pct resolution (round_half_up)"
    variants:
      - name: MEAN
        when: "reported as avg_compaction_pct"
        difference: "arithmetic mean over governing tests; can look healthy while one lift fails"
      - name: WORST_LIFT
        when: "reported as min_compaction_pct and used by the completion gate"
        difference: "minimum over governing tests plus per-lift PASS coverage; identical inputs, stricter value"

  - name: lifts_required
    trigger: "PipeSegment create"
    algorithm: threshold
    formula: |
      bedding_depth_ft = CLASS_B -> 0.5 | CLASS_C -> 0.5 | CLASS_D -> 0.25
      trench_depth_ft  = design_invert_depth_ft + diameter_in / 12.0 + bedding_depth_ft(bedding_class)
      lifts_required   = ceil(trench_depth_ft / 1.0)
    input_set: "The PipeSegment's design_invert_depth_ft, diameter_in, bedding_class."
    constants:
      LIFT_THICKNESS_FT: 1.0
    precision: "integer lift count via ceiling"

  - name: trench_slope_requirement
    trigger: "TrenchSafetyPlan submit"
    algorithm: threshold
    formula: |
      required_ratio = SOIL_A -> 0.75 | SOIL_B -> 1.0 | SOIL_C -> 1.5
      if protective_system IN {SLOPING, BENCHING}:
        require slope_ratio >= required_ratio   # boundary inclusive: exactly 1.5 on SOIL_C passes
      if max_depth_ft >= 20:
        require protective_system IN {SHORING, TRENCH_BOX} AND engineered_certification == true
    input_set: "The TrenchSafetyPlan being submitted."
    constants:
      ENGINEERED_DEPTH_FT: 20
    precision: "ratio comparison at exact decimal value"

  - name: installation_inspection_result
    trigger: "InstallationInspection create"
    algorithm: threshold
    formula: |
      result = PASS iff
        bedding_ok == true
        AND joint_ok == true
        AND abs(slope_measured_pct - pipe_segment.design_slope_pct) <= 0.2
        AND cover_depth_ft >= 0.5
      else FAIL
    input_set: "The InstallationInspection plus its referenced PipeSegment.design_slope_pct."
    constants:
      SLOPE_TOL_PCT: 0.2
      MIN_COVER_FT: 0.5
    precision: "slope tolerance inclusive at exactly 0.2 pct deviation"

  - name: discharge_classification
    trigger: "DischargeReading create"
    algorithm: threshold
    formula: |
      volume_gal = flow_gpm * duration_min
      # Daily cumulative volume: sum of volume_gal over all readings of this permit
      # whose recorded_at falls on the same UTC calendar date as this reading,
      # processed chronologically by (recorded_at ASC, created_at ASC) — this
      # reading included. Boundary: strictly greater-than fires EXCEEDS_VOLUME.
      day_volume_gal = sum(volume_gal of same-day readings) 
      # Classification precedence (first match wins):
      if turbidity_ntu >= permit.turbidity_limit_ntu:  classification = EXCEEDS_TURBIDITY
      elif day_volume_gal > permit.daily_volume_limit_gal: classification = EXCEEDS_VOLUME
      elif flow_gpm > permit.max_flow_gpm:             classification = EXCEEDS_FLOW
      else:                                            classification = NORMAL
      # Side effects: any EXCEEDS_* -> permit.exceedance_count += 1;
      # EXCEEDS_TURBIDITY additionally drives permit ACTIVE -> SUSPENDED (cascade).
    input_set: "The new reading plus all readings of the same permit on the same UTC date."
    precision: "integer gallons; turbidity boundary inclusive (>=), flow boundary exclusive (>), volume boundary exclusive (>)"

  - name: window_hours_ledger
    trigger: "ShutdownWindow create, review, cancel, complete, and clock-driven MISS"
    algorithm: aggregation
    formula: |
      duration_minutes(window) = (window_end - window_start) in whole minutes
      utility_owner.committed_shutdown_minutes =
        sum(duration_minutes) over ShutdownWindows with
        window.utility_owner_id == owner.id AND status IN {PROPOSED, CONFIRMED, ACTIVE}
      # Terminal states (COMPLETED, MISSED, REJECTED, CANCELLED) contribute 0.
    input_set: "ShutdownWindows of the UtilityOwner with status IN {PROPOSED, CONFIRMED, ACTIVE} only."
    precision: "integer minutes"

  - name: readiness_recompute
    trigger: "UnforeseenCondition create with condition_type == GROUNDWATER"
    algorithm: constraint_propagation
    formula: |
      # Circular-looking chain (Segment readiness <- Plan validity <- Condition,
      # while Conditions arise from work on Segments). Evaluation order is pinned:
      # (1) conditions: collect OPEN GROUNDWATER conditions of the project
      # (2) plans: every APPROVED TrenchSafetyPlan of the project with
      #     protective_system IN {SLOPING, BENCHING} -> VOIDED
      # (3) segments: every PipeSegment of the project in READY whose plan was
      #     voided in step (2) -> PLANNED
      # SHORING / TRENCH_BOX plans are unaffected.
    input_set: "OPEN GROUNDWATER UnforeseenConditions of the project; APPROVED TrenchSafetyPlans of the project; READY PipeSegments of the project."
    precision: "n/a (state propagation)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lower number wins when a
# request violates several rules)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role permitted for the endpoint per §1.5 roles; UtilityOwnerRep X-User-ID must equal the target resource's utility_owner_id; segregation of duties: reviewer X-User-ID must differ from the resource's submitter/recorder user id"
    error_id: "ERR_UNAUTHORIZED_ROLE / ERR_SOD_VIOLATION"
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Request body well-formed: all required fields present, types correct, enum values in range, numeric fields positive where required"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all POST endpoints"
  - priority: 4
    category: existence
    check: "Path ids and body-referenced FK ids exist as resources (scope/mismatch of an existing FK is checked at priority 9)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: business_constraint
    check: "OCC: expected_project_version must equal the referenced Project's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /site-utility/shutdown-windows, POST /site-utility/change-orders"
  - priority: 6
    category: state
    check: "Target resource in a valid from-state for the requested transition; terminal resources reject all actions"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 7
    category: business_safety
    check: "Safety/compliance gates, sub-ordered: (a) project.work_posture == CLEAR where required (ERR_PROJECT_STOPPED); (b) project has an ACTIVE LocateTicket where required (ERR_LOCATE_NOT_ACTIVE); (c) trench slope/depth compliance on plan submit (ERR_SLOPE_NONCOMPLIANT / ERR_ENGINEERED_DESIGN_REQUIRED); (d) discharge permit ACTIVE for readings (ERR_PERMIT_NOT_ACTIVE)"
    error_id: "ERR_PROJECT_STOPPED / ERR_LOCATE_NOT_ACTIVE / ERR_SLOPE_NONCOMPLIANT / ERR_ENGINEERED_DESIGN_REQUIRED / ERR_PERMIT_NOT_ACTIVE"
    http_status: 409
    applies_to: "ground-disturbing and compliance endpoints"
  - priority: 8
    category: business_temporal
    check: "Temporal rules, sub-ordered: (a) window_start strictly after now (ERR_WINDOW_IN_PAST); (b) window_start - now >= owner.min_notice_hours (ERR_INSUFFICIENT_NOTICE); (c) no half-open overlap with existing PROPOSED/CONFIRMED/ACTIVE windows of the same owner (ERR_OWNER_WINDOW_OVERLAP); (d) >= 120-minute clearance from PROPOSED/CONFIRMED/ACTIVE windows of the same project (ERR_PROJECT_WINDOW_BUFFER); (e) reading recorded_at inside permit effective window (ERR_READING_OUTSIDE_PERMIT_WINDOW)"
    error_id: "ERR_WINDOW_IN_PAST / ERR_INSUFFICIENT_NOTICE / ERR_OWNER_WINDOW_OVERLAP / ERR_PROJECT_WINDOW_BUFFER / ERR_READING_OUTSIDE_PERMIT_WINDOW"
    http_status: 422
    applies_to: "POST /site-utility/shutdown-windows, POST /site-utility/discharge-readings"
  - priority: 9
    category: business_referential
    check: "Cross-entity integrity and cross-entity state gates: body FKs resolve within the same project (ERR_CROSS_PROJECT_REFERENCE); segment's plan APPROVED (ERR_PLAN_NOT_APPROVED); no unresolved potholes (ERR_POTHOLES_OUTSTANDING); latest CONFIRMED inspection PASS (ERR_INSPECTION_NOT_PASSED); segment COMPLETE before as-built submit (ERR_SEGMENT_NOT_COMPLETE); condition OPEN/MITIGATING for CO submit/approve (ERR_CONDITION_NOT_OPEN); COs settled before condition resolve (ERR_CO_NOT_COMPLETED)"
    error_id: "ERR_CROSS_PROJECT_REFERENCE / ERR_PLAN_NOT_APPROVED / ERR_POTHOLES_OUTSTANDING / ERR_INSPECTION_NOT_PASSED / ERR_SEGMENT_NOT_COMPLETE / ERR_CONDITION_NOT_OPEN / ERR_CO_NOT_COMPLETED"
    http_status: 409
    applies_to: "transition endpoints with cross-entity preconditions"
  - priority: 10
    category: business_constraint
    check: "Aggregate/uniqueness constraints: single open locate ticket per project (ERR_DUPLICATE_OPEN_TICKET); single open/verified pothole per station (ERR_DUPLICATE_STATION); single open as-built per segment (ERR_ASBUILT_ALREADY_OPEN); lift_number strictly sequential (ERR_LIFT_SEQUENCE); all lifts satisfied before segment complete (ERR_LIFTS_INCOMPLETE); closeout completeness bundle (ERR_CLOSEOUT_INCOMPLETE)"
    error_id: "ERR_DUPLICATE_OPEN_TICKET / ERR_DUPLICATE_STATION / ERR_ASBUILT_ALREADY_OPEN / ERR_LIFT_SEQUENCE / ERR_LIFTS_INCOMPLETE / ERR_CLOSEOUT_INCOMPLETE"
    http_status: 409
    applies_to: "create and transition endpoints"
  - priority: 11
    category: business_fiscal
    check: "Fiscal caps: provisional_price_cents <= project.single_co_cap_cents at CO create and submit (ERR_PRICE_CAP_EXCEEDED); approved_co_total_cents + provisional_price_cents <= project.contingency_cents at CO approve (ERR_CONTINGENCY_EXCEEDED)"
    error_id: "ERR_PRICE_CAP_EXCEEDED / ERR_CONTINGENCY_EXCEEDED"
    http_status: 422
    applies_to: "POST /site-utility/change-orders, POST /site-utility/change-orders/{id}/submit, POST /site-utility/change-orders/{id}/review"

# =============================================================================
# §1.5 API Endpoint Table
# All GET endpoints accept limit?/offset? per the §1.0 pagination defaults
# and return the paginated envelope. All roles may call every GET endpoint.
# =============================================================================
endpoints:
  # --- Project ---
  - method: POST
    path: "/site-utility/projects"
    description: "Create a project (starts ACTIVE, work_posture CLEAR)"
    roles: [ProjectManager]
    code: 201
    input: [name, contract_ref, soil_class_default, contingency_cents, single_co_cap_cents]
    output: Project
    side_effects: ["status=ACTIVE", "work_posture=CLEAR", "approved_co_total_cents=0", "AuditEvent appended"]
  - method: GET
    path: "/site-utility/projects"
    description: "List projects with optional filters"
    roles: [OpsAdmin, ProjectManager, Foreman, SafetyOfficer, Inspector, UtilityOwnerRep]
    code: 200
    input: ["status?", "work_posture?", "limit?", "offset?"]
    output: Project[]
    side_effects: []
  - method: GET
    path: "/site-utility/projects/{id}"
    description: "Get one project"
    roles: [OpsAdmin, ProjectManager, Foreman, SafetyOfficer, Inspector, UtilityOwnerRep]
    code: 200
    input: []
    output: Project
    side_effects: []
  - method: POST
    path: "/site-utility/projects/{id}/begin-closeout"
    description: "ACTIVE -> CLOSING after the closeout completeness bundle passes"
    roles: [ProjectManager]
    code: 200
    input: []
    output: Project
    side_effects: ["status -> CLOSING", "AuditEvent appended"]
  - method: POST
    path: "/site-utility/projects/{id}/close"
    description: "CLOSING -> CLOSED; stamps closed_at"
    roles: [ProjectManager]
    code: 200
    input: []
    output: Project
    side_effects: ["status -> CLOSED", "closed_at := now", "AuditEvent appended"]
  - method: GET
    path: "/site-utility/projects/{id}/audit-events"
    description: "List audit events for a project, ordered created_at ASC"
    roles: [OpsAdmin, ProjectManager, Foreman, SafetyOfficer, Inspector, UtilityOwnerRep]
    code: 200
    input: ["entity_type?", "limit?", "offset?"]
    output: AuditEvent[]
    side_effects: []

  # --- UtilityOwner ---
  - method: POST
    path: "/site-utility/utility-owners"
    description: "Register a utility owner"
    roles: [OpsAdmin]
    code: 201
    input: [name, owner_type, min_notice_hours, max_shutdown_hours]
    output: UtilityOwner
    side_effects: ["committed_shutdown_minutes=0"]
  - method: GET
    path: "/site-utility/utility-owners"
    description: "List utility owners"
    roles: [OpsAdmin, ProjectManager, Foreman, SafetyOfficer, Inspector, UtilityOwnerRep]
    code: 200
    input: ["limit?", "offset?"]
    output: UtilityOwner[]
    side_effects: []
  - method: GET
    path: "/site-utility/utility-owners/{id}"
    description: "Get one utility owner"
    roles: [OpsAdmin, ProjectManager, Foreman, SafetyOfficer, Inspector, UtilityOwnerRep]
    code: 200
    input: []
    output: UtilityOwner
    side_effects: []

  # --- LocateTicket ---
  - method: POST
    path: "/site-utility/locate-tickets"
    description: "Create a locate ticket for a project (DRAFT); one open ticket per project"
    roles: [ProjectManager]
    code: 201
    input: [project_id, ticket_number, legal_start_at]
    output: LocateTicket
    side_effects: ["status=DRAFT", "valid_until := legal_start_at + 672h", "renew_count=0", "ERR_DUPLICATE_OPEN_TICKET if project has a ticket in DRAFT/SUBMITTED/ACTIVE", "AuditEvent appended"]
  - method: GET
    path: "/site-utility/locate-tickets"
    description: "List locate tickets"
    roles: [OpsAdmin, ProjectManager, Foreman, SafetyOfficer, Inspector, UtilityOwnerRep]
    code: 200
    input: ["project_id?", "status?", "limit?", "offset?"]
    output: LocateTicket[]
    side_effects: []
  - method: GET
    path: "/site-utility/locate-tickets/{id}"
    description: "Get one locate ticket"
    roles: [OpsAdmin, ProjectManager, Foreman, SafetyOfficer, Inspector, UtilityOwnerRep]
    code: 200
    input: []
    output: LocateTicket
    side_effects: []
  - method: POST
    path: "/site-utility/locate-tickets/{id}/submit"
    description: "DRAFT -> SUBMITTED"
    roles: [ProjectManager]
    code: 200
    input: []
    output: LocateTicket
    side_effects: ["status -> SUBMITTED", "ERR_DUPLICATE_OPEN_TICKET if another open ticket exists", "AuditEvent appended"]
  - method: POST
    path: "/site-utility/locate-tickets/{id}/renew"
    description: "Extend valid_until by 672h; EXPIRED -> ACTIVE when the new validity covers now"
    roles: [ProjectManager]
    code: 200
    input: []
    output: LocateTicket
    side_effects: ["valid_until += 672h", "renew_count += 1", "status -> ACTIVE iff now < new valid_until, else stays EXPIRED", "AuditEvent appended"]

  # --- PotholeVerification ---
  - method: POST
    path: "/site-utility/pothole-verifications"
    description: "Plan a pothole verification at a station; supersedes a same-station CONFLICT pothole"
    roles: [ProjectManager]
    code: 201
    input: [project_id, locate_ticket_id, station_label, expected_utility_type, method, design_depth_in, design_offset_in]
    output: PotholeVerification
    side_effects: ["status=PLANNED", "existing same-station CONFLICT pothole -> SUPERSEDED", "ERR_DUPLICATE_STATION if same station exists in PLANNED/PERFORMED/VERIFIED", "ERR_CROSS_PROJECT_REFERENCE if ticket belongs to another project", "AuditEvent appended"]
  - method: GET
    path: "/site-utility/pothole-verifications"
    description: "List pothole verifications"
    roles: [OpsAdmin, ProjectManager, Foreman, SafetyOfficer, Inspector, UtilityOwnerRep]
    code: 200
    input: ["project_id?", "locate_ticket_id?", "status?", "limit?", "offset?"]
    output: PotholeVerification[]
    side_effects: []
  - method: GET
    path: "/site-utility/pothole-verifications/{id}"
    description: "Get one pothole verification"
    roles: [OpsAdmin, ProjectManager, Foreman, SafetyOfficer, Inspector, UtilityOwnerRep]
    code: 200
    input: []
    output: PotholeVerification
    side_effects: []
  - method: POST
    path: "/site-utility/pothole-verifications/{id}/perform"
    description: "PLANNED -> PERFORMED; records measurements; requires ACTIVE ticket and CLEAR posture"
    roles: [Foreman]
    code: 200
    input: [measured_depth_in, measured_offset_in]
    output: PotholeVerification
    side_effects: ["measured fields recorded", "status -> PERFORMED", "AuditEvent appended"]
  - method: POST
    path: "/site-utility/pothole-verifications/{id}/verify"
    description: "PERFORMED -> VERIFIED when measurements are within tolerance"
    roles: [ProjectManager]
    code: 200
    input: []
    output: PotholeVerification
    side_effects: ["status -> VERIFIED", "ERR_POTHOLE_TOLERANCE_EXCEEDED when |depth delta| > 6 or |offset delta| > 12", "AuditEvent appended"]
  - method: POST
    path: "/site-utility/pothole-verifications/{id}/mark-conflict"
    description: "PERFORMED -> CONFLICT"
    roles: [ProjectManager]
    code: 200
    input: []
    output: PotholeVerification
    side_effects: ["status -> CONFLICT", "AuditEvent appended"]

  # --- TrenchSafetyPlan ---
  - method: POST
    path: "/site-utility/trench-safety-plans"
    description: "Draft a trench safety plan for a pipe segment"
    roles: [Foreman]
    code: 201
    input: [project_id, pipe_segment_id, max_depth_ft, soil_class, protective_system, "slope_ratio?", "engineered_certification?"]
    output: TrenchSafetyPlan
    side_effects: ["status=DRAFT", "revision=1", "ERR_CROSS_PROJECT_REFERENCE if segment belongs to another project", "AuditEvent appended"]
  - method: GET
    path: "/site-utility/trench-safety-plans"
    description: "List trench safety plans"
    roles: [OpsAdmin, ProjectManager, Foreman, SafetyOfficer, Inspector, UtilityOwnerRep]
    code: 200
    input: ["project_id?", "pipe_segment_id?", "status?", "limit?", "offset?"]
    output: TrenchSafetyPlan[]
    side_effects: []
  - method: GET
    path: "/site-utility/trench-safety-plans/{id}"
    description: "Get one trench safety plan"
    roles: [OpsAdmin, ProjectManager, Foreman, SafetyOfficer, Inspector, UtilityOwnerRep]
    code: 200
    input: []
    output: TrenchSafetyPlan
    side_effects: []
  - method: POST
    path: "/site-utility/trench-safety-plans/{id}/submit"
    description: "DRAFT -> SUBMITTED; enforces slope/depth compliance"
    roles: [Foreman]
    code: 200
    input: []
    output: TrenchSafetyPlan
    side_effects: ["status -> SUBMITTED", "submitted_by_user_id := X-User-ID", "AuditEvent appended"]
  - method: POST
    path: "/site-utility/trench-safety-plans/{id}/review"
    description: "SUBMITTED -> APPROVED | REJECTED; reviewer must differ from submitter"
    roles: [SafetyOfficer]
    code: 200
    input: [decision]
    output: TrenchSafetyPlan
    side_effects: ["status -> APPROVED or REJECTED per decision", "reviewed_by_user_id := X-User-ID", "AuditEvent appended"]
  - method: POST
    path: "/site-utility/trench-safety-plans/{id}/revise"
    description: "REJECTED -> DRAFT; bumps revision; optional field changes"
    roles: [Foreman]
    code: 200
    input: ["max_depth_ft?", "soil_class?", "protective_system?", "slope_ratio?", "engineered_certification?"]
    output: TrenchSafetyPlan
    side_effects: ["status -> DRAFT", "revision += 1", "supplied fields updated", "AuditEvent appended"]

  # --- PipeSegment ---
  - method: POST
    path: "/site-utility/pipe-segments"
    description: "Create a pipe segment (PLANNED); computes lifts_required"
    roles: [Foreman]
    code: 201
    input: [project_id, utility_owner_id, segment_label, pipe_material, diameter_in, length_ft, bedding_class, design_invert_depth_ft, design_slope_pct, requires_dewatering]
    output: PipeSegment
    side_effects: ["status=PLANNED", "lifts_required computed", "lifts_satisfied=0", "hold_reason=NONE", "tie_in_completed=false", "AuditEvent appended"]
  - method: GET
    path: "/site-utility/pipe-segments"
    description: "List pipe segments"
    roles: [OpsAdmin, ProjectManager, Foreman, SafetyOfficer, Inspector, UtilityOwnerRep]
    code: 200
    input: ["project_id?", "utility_owner_id?", "status?", "limit?", "offset?"]
    output: PipeSegment[]
    side_effects: []
  - method: GET
    path: "/site-utility/pipe-segments/{id}"
    description: "Get one pipe segment"
    roles: [OpsAdmin, ProjectManager, Foreman, SafetyOfficer, Inspector, UtilityOwnerRep]
    code: 200
    input: []
    output: PipeSegment
    side_effects: []
  - method: POST
    path: "/site-utility/pipe-segments/{id}/mark-ready"
    description: "PLANNED -> READY; enforces plan/locate/pothole/posture gates"
    roles: [Foreman]
    code: 200
    input: []
    output: PipeSegment
    side_effects: ["status -> READY", "AuditEvent appended"]
  - method: POST
    path: "/site-utility/pipe-segments/{id}/start-install"
    description: "READY -> INSTALLING; re-checks locate ticket and posture"
    roles: [Foreman]
    code: 200
    input: []
    output: PipeSegment
    side_effects: ["status -> INSTALLING", "AuditEvent appended"]
  - method: POST
    path: "/site-utility/pipe-segments/{id}/complete-install"
    description: "INSTALLING -> INSTALLED"
    roles: [Foreman]
    code: 200
    input: []
    output: PipeSegment
    side_effects: ["status -> INSTALLED", "AuditEvent appended"]
  - method: POST
    path: "/site-utility/pipe-segments/{id}/reopen-install"
    description: "INSTALLED -> INSTALLING rework loop; requires latest CONFIRMED inspection FAIL"
    roles: [Foreman]
    code: 200
    input: []
    output: PipeSegment
    side_effects: ["status -> INSTALLING", "AuditEvent appended"]
  - method: POST
    path: "/site-utility/pipe-segments/{id}/start-backfill"
    description: "INSTALLED -> BACKFILLING; requires latest CONFIRMED inspection PASS, ACTIVE ticket, CLEAR posture"
    roles: [Foreman]
    code: 200
    input: []
    output: PipeSegment
    side_effects: ["status -> BACKFILLING", "AuditEvent appended"]
  - method: POST
    path: "/site-utility/pipe-segments/{id}/complete"
    description: "BACKFILLING -> COMPLETE; requires lifts_satisfied == lifts_required"
    roles: [Foreman]
    code: 200
    input: []
    output: PipeSegment
    side_effects: ["status -> COMPLETE", "AuditEvent appended"]

  # --- InstallationInspection ---
  - method: POST
    path: "/site-utility/installation-inspections"
    description: "Record an installation inspection on an INSTALLED segment; computes result"
    roles: [Inspector]
    code: 201
    input: [pipe_segment_id, bedding_ok, joint_ok, slope_measured_pct, cover_depth_ft]
    output: InstallationInspection
    side_effects: ["status=RECORDED", "result computed", "recorded_by_user_id := X-User-ID", "ERR_INVALID_STATE unless segment is INSTALLED", "AuditEvent appended"]
  - method: GET
    path: "/site-utility/installation-inspections"
    description: "List installation inspections"
    roles: [OpsAdmin, ProjectManager, Foreman, SafetyOfficer, Inspector, UtilityOwnerRep]
    code: 200
    input: ["pipe_segment_id?", "status?", "result?", "limit?", "offset?"]
    output: InstallationInspection[]
    side_effects: []
  - method: GET
    path: "/site-utility/installation-inspections/{id}"
    description: "Get one installation inspection"
    roles: [OpsAdmin, ProjectManager, Foreman, SafetyOfficer, Inspector, UtilityOwnerRep]
    code: 200
    input: []
    output: InstallationInspection
    side_effects: []
  - method: POST
    path: "/site-utility/installation-inspections/{id}/confirm"
    description: "RECORDED -> CONFIRMED; confirmer must differ from recorder"
    roles: [Inspector]
    code: 200
    input: []
    output: InstallationInspection
    side_effects: ["status -> CONFIRMED", "AuditEvent appended"]
  - method: POST
    path: "/site-utility/installation-inspections/{id}/dispute"
    description: "RECORDED -> DISPUTED; disputed inspections are ignored by the backfill gate"
    roles: [ProjectManager]
    code: 200
    input: []
    output: InstallationInspection
    side_effects: ["status -> DISPUTED", "AuditEvent appended"]

  # --- ShutdownWindow ---
  - method: POST
    path: "/site-utility/shutdown-windows"
    description: "Propose a tie-in shutdown window; OCC-guarded on the project; enforces notice/overlap/buffer rules"
    roles: [ProjectManager]
    code: 201
    input: [project_id, utility_owner_id, pipe_segment_id, window_start, window_end, expected_project_version]
    output: ShutdownWindow
    side_effects: ["status=PROPOSED", "duration_minutes computed", "utility_owner.committed_shutdown_minutes += duration_minutes", "increments Project.version by 1", "ERR_CROSS_PROJECT_REFERENCE if segment belongs to another project or owner mismatch with segment.utility_owner_id", "AuditEvent appended"]
  - method: GET
    path: "/site-utility/shutdown-windows"
    description: "List shutdown windows"
    roles: [OpsAdmin, ProjectManager, Foreman, SafetyOfficer, Inspector, UtilityOwnerRep]
    code: 200
    input: ["project_id?", "utility_owner_id?", "pipe_segment_id?", "status?", "limit?", "offset?"]
    output: ShutdownWindow[]
    side_effects: []
  - method: GET
    path: "/site-utility/shutdown-windows/{id}"
    description: "Get one shutdown window"
    roles: [OpsAdmin, ProjectManager, Foreman, SafetyOfficer, Inspector, UtilityOwnerRep]
    code: 200
    input: []
    output: ShutdownWindow
    side_effects: []
  - method: POST
    path: "/site-utility/shutdown-windows/{id}/review"
    description: "PROPOSED -> CONFIRMED | REJECTED; owner rep of the window's owner only"
    roles: [UtilityOwnerRep]
    code: 200
    input: [decision]
    output: ShutdownWindow
    side_effects: ["status -> CONFIRMED or REJECTED per decision", "REJECT releases committed_shutdown_minutes", "AuditEvent appended"]
  - method: POST
    path: "/site-utility/shutdown-windows/{id}/cancel"
    description: "PROPOSED or CONFIRMED -> CANCELLED; releases committed minutes"
    roles: [ProjectManager]
    code: 200
    input: []
    output: ShutdownWindow
    side_effects: ["status -> CANCELLED", "utility_owner.committed_shutdown_minutes -= duration_minutes", "AuditEvent appended"]
  - method: POST
    path: "/site-utility/shutdown-windows/{id}/complete"
    description: "ACTIVE -> COMPLETED; marks the segment tie_in_completed"
    roles: [Foreman]
    code: 200
    input: []
    output: ShutdownWindow
    side_effects: ["status -> COMPLETED", "segment.tie_in_completed := true", "utility_owner.committed_shutdown_minutes -= duration_minutes", "AuditEvent appended"]

  # --- DischargePermit / DischargeReading ---
  - method: POST
    path: "/site-utility/discharge-permits"
    description: "Register a dewatering discharge permit (ISSUED)"
    roles: [ProjectManager]
    code: 201
    input: [project_id, permit_number, max_flow_gpm, turbidity_limit_ntu, daily_volume_limit_gal, effective_from, effective_to]
    output: DischargePermit
    side_effects: ["status=ACTIVE when effective_from <= now < effective_to at creation, else ISSUED", "exceedance_count=0", "ERR_VALIDATION if effective_from >= effective_to", "AuditEvent appended"]
  - method: GET
    path: "/site-utility/discharge-permits"
    description: "List discharge permits"
    roles: [OpsAdmin, ProjectManager, Foreman, SafetyOfficer, Inspector, UtilityOwnerRep]
    code: 200
    input: ["project_id?", "status?", "limit?", "offset?"]
    output: DischargePermit[]
    side_effects: []
  - method: GET
    path: "/site-utility/discharge-permits/{id}"
    description: "Get one discharge permit"
    roles: [OpsAdmin, ProjectManager, Foreman, SafetyOfficer, Inspector, UtilityOwnerRep]
    code: 200
    input: []
    output: DischargePermit
    side_effects: []
  - method: POST
    path: "/site-utility/discharge-permits/{id}/reinstate"
    description: "SUSPENDED -> ACTIVE when inside the effective window, else -> EXPIRED; resumes DEWATERING-held segments"
    roles: [ProjectManager]
    code: 200
    input: []
    output: DischargePermit
    side_effects: ["status -> ACTIVE or EXPIRED", "on ACTIVE: DEWATERING-held segments resume", "ERR_PROJECT_STOPPED when project posture is STOPPED", "AuditEvent appended"]
  - method: GET
    path: "/site-utility/discharge-permits/{id}/readings"
    description: "List readings of a permit, chronological (recorded_at ASC, created_at ASC)"
    roles: [OpsAdmin, ProjectManager, Foreman, SafetyOfficer, Inspector, UtilityOwnerRep]
    code: 200
    input: ["classification?", "limit?", "offset?"]
    output: DischargeReading[]
    side_effects: []
  - method: POST
    path: "/site-utility/discharge-readings"
    description: "Record a discharge reading; computes volume and classification; EXCEEDS_TURBIDITY suspends the permit"
    roles: [Foreman]
    code: 201
    input: [discharge_permit_id, recorded_at, flow_gpm, turbidity_ntu, duration_min]
    output: DischargeReading
    side_effects: ["volume_gal computed", "classification computed", "EXCEEDS_* -> permit.exceedance_count += 1", "EXCEEDS_TURBIDITY -> permit SUSPENDED + dewatering cascade", "ERR_PERMIT_NOT_ACTIVE unless permit ACTIVE", "ERR_READING_OUTSIDE_PERMIT_WINDOW when recorded_at outside [effective_from, effective_to)", "AuditEvent appended"]

  # --- CompactionTest ---
  - method: POST
    path: "/site-utility/compaction-tests"
    description: "Record a compaction test on the next lift of a BACKFILLING segment; computes compaction_pct/required_pct/result"
    roles: [Foreman]
    code: 201
    input: [pipe_segment_id, lift_number, proctor_max_density_pcf, field_density_pcf, moisture_pct]
    output: CompactionTest
    side_effects: ["status=RECORDED", "compaction_pct / required_pct / result computed", "recorded_by_user_id := X-User-ID", "ERR_INVALID_STATE unless segment is BACKFILLING", "ERR_LIFT_SEQUENCE unless lift_number == max existing lift_number on the segment + 1 (first is 1)", "AuditEvent appended"]
  - method: GET
    path: "/site-utility/compaction-tests"
    description: "List compaction tests"
    roles: [OpsAdmin, ProjectManager, Foreman, SafetyOfficer, Inspector, UtilityOwnerRep]
    code: 200
    input: ["pipe_segment_id?", "lift_number?", "status?", "result?", "limit?", "offset?"]
    output: CompactionTest[]
    side_effects: []
  - method: GET
    path: "/site-utility/compaction-tests/{id}"
    description: "Get one compaction test"
    roles: [OpsAdmin, ProjectManager, Foreman, SafetyOfficer, Inspector, UtilityOwnerRep]
    code: 200
    input: []
    output: CompactionTest
    side_effects: []
  - method: POST
    path: "/site-utility/compaction-tests/{id}/review"
    description: "RECORDED -> ACCEPTED | REJECTED; reviewer must differ from recorder; PASS accepts increment lifts_satisfied"
    roles: [Inspector]
    code: 200
    input: [decision]
    output: CompactionTest
    side_effects: ["status -> ACCEPTED or REJECTED per decision", "reviewed_by_user_id := X-User-ID", "on ACCEPT with result PASS: segment.lifts_satisfied / avg_compaction_pct / min_compaction_pct recomputed", "AuditEvent appended"]

  # --- AsBuiltPackage ---
  - method: POST
    path: "/site-utility/as-built-packages"
    description: "Draft an as-built survey package for a segment; computes variances and within_tolerance"
    roles: [ProjectManager]
    code: 201
    input: [pipe_segment_id, surveyor_stamp, measured_length_ft, measured_invert_ft]
    output: AsBuiltPackage
    side_effects: ["status=DRAFT", "revision=1", "variances and within_tolerance computed", "ERR_ASBUILT_ALREADY_OPEN if the segment has a package in DRAFT or SUBMITTED", "AuditEvent appended"]
  - method: GET
    path: "/site-utility/as-built-packages"
    description: "List as-built packages"
    roles: [OpsAdmin, ProjectManager, Foreman, SafetyOfficer, Inspector, UtilityOwnerRep]
    code: 200
    input: ["pipe_segment_id?", "status?", "limit?", "offset?"]
    output: AsBuiltPackage[]
    side_effects: []
  - method: GET
    path: "/site-utility/as-built-packages/{id}"
    description: "Get one as-built package"
    roles: [OpsAdmin, ProjectManager, Foreman, SafetyOfficer, Inspector, UtilityOwnerRep]
    code: 200
    input: []
    output: AsBuiltPackage
    side_effects: []
  - method: POST
    path: "/site-utility/as-built-packages/{id}/submit"
    description: "DRAFT -> SUBMITTED; requires segment COMPLETE"
    roles: [ProjectManager]
    code: 200
    input: []
    output: AsBuiltPackage
    side_effects: ["status -> SUBMITTED", "ERR_SEGMENT_NOT_COMPLETE unless segment COMPLETE", "AuditEvent appended"]
  - method: POST
    path: "/site-utility/as-built-packages/{id}/review"
    description: "SUBMITTED -> ACCEPTED | REJECTED; owner rep of the segment's owner; ACCEPT requires within_tolerance"
    roles: [UtilityOwnerRep]
    code: 200
    input: [decision]
    output: AsBuiltPackage
    side_effects: ["status -> ACCEPTED or REJECTED per decision", "ERR_ASBUILT_OUT_OF_TOLERANCE when decision=ACCEPT and within_tolerance == false", "AuditEvent appended"]
  - method: POST
    path: "/site-utility/as-built-packages/{id}/revise"
    description: "REJECTED -> DRAFT; bumps revision; optional field changes recompute variances"
    roles: [ProjectManager]
    code: 200
    input: ["surveyor_stamp?", "measured_length_ft?", "measured_invert_ft?"]
    output: AsBuiltPackage
    side_effects: ["status -> DRAFT", "revision += 1", "variances and within_tolerance recomputed", "AuditEvent appended"]

  # --- UnforeseenCondition ---
  - method: POST
    path: "/site-utility/unforeseen-conditions"
    description: "Report an unforeseen condition; stop_work_required=true drives the stop-work cascade; GROUNDWATER voids sloped plans"
    roles: [ProjectManager]
    code: 201
    input: [project_id, "pipe_segment_id?", condition_type, stop_work_required, description]
    output: UnforeseenCondition
    side_effects: ["status=OPEN", "ERR_INVALID_STATE unless project status ACTIVE", "ERR_CROSS_PROJECT_REFERENCE if pipe_segment_id belongs to another project", "if stop_work_required: project.work_posture -> STOPPED, then INSTALLING/BACKFILLING segments -> ON_HOLD (hold_reason STOP_WORK)", "if condition_type == GROUNDWATER: readiness_recompute voids APPROVED SLOPING/BENCHING plans and reverts affected READY segments to PLANNED", "AuditEvent appended"]
  - method: GET
    path: "/site-utility/unforeseen-conditions"
    description: "List unforeseen conditions"
    roles: [OpsAdmin, ProjectManager, Foreman, SafetyOfficer, Inspector, UtilityOwnerRep]
    code: 200
    input: ["project_id?", "pipe_segment_id?", "status?", "condition_type?", "limit?", "offset?"]
    output: UnforeseenCondition[]
    side_effects: []
  - method: GET
    path: "/site-utility/unforeseen-conditions/{id}"
    description: "Get one unforeseen condition"
    roles: [OpsAdmin, ProjectManager, Foreman, SafetyOfficer, Inspector, UtilityOwnerRep]
    code: 200
    input: []
    output: UnforeseenCondition
    side_effects: []
  - method: POST
    path: "/site-utility/unforeseen-conditions/{id}/resolve"
    description: "OPEN|MITIGATING -> RESOLVED, or OPEN -> CLOSED_NO_ACTION; open change orders block resolution"
    roles: [ProjectManager]
    code: 200
    input: [outcome]
    output: UnforeseenCondition
    side_effects: ["status -> per outcome", "ERR_CO_NOT_COMPLETED when COs in DRAFT/SUBMITTED/APPROVED remain", "if stop_work_required: posture recompute; STOP_WORK-held segments resume when no other blocking condition", "AuditEvent appended"]

  # --- ChangeOrder ---
  - method: POST
    path: "/site-utility/change-orders"
    description: "Create a change order for an OPEN unforeseen condition; OCC-guarded on the project; supersedes open COs of the same condition"
    roles: [ProjectManager]
    code: 201
    input: [project_id, unforeseen_condition_id, utility_owner_id, labor_hours, labor_rate_cents, equipment_hours, equipment_rate_cents, material_cost_cents, expected_project_version]
    output: ChangeOrder
    side_effects: ["status=DRAFT", "revision=1", "direct_cost_cents / markup_cents / provisional_price_cents computed (PROVISIONAL variant)", "existing COs of the same condition in DRAFT/SUBMITTED -> SUPERSEDED", "increments Project.version by 1", "ERR_CONDITION_NOT_OPEN unless condition OPEN", "ERR_CROSS_PROJECT_REFERENCE if condition belongs to another project", "ERR_PRICE_CAP_EXCEEDED if provisional_price_cents > project.single_co_cap_cents", "AuditEvent appended"]
  - method: GET
    path: "/site-utility/change-orders"
    description: "List change orders"
    roles: [OpsAdmin, ProjectManager, Foreman, SafetyOfficer, Inspector, UtilityOwnerRep]
    code: 200
    input: ["project_id?", "unforeseen_condition_id?", "utility_owner_id?", "status?", "limit?", "offset?"]
    output: ChangeOrder[]
    side_effects: []
  - method: GET
    path: "/site-utility/change-orders/{id}"
    description: "Get one change order"
    roles: [OpsAdmin, ProjectManager, Foreman, SafetyOfficer, Inspector, UtilityOwnerRep]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: []
  - method: POST
    path: "/site-utility/change-orders/{id}/submit"
    description: "DRAFT -> SUBMITTED; re-checks condition and price cap"
    roles: [ProjectManager]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: ["status -> SUBMITTED", "submitted_by_user_id := X-User-ID", "ERR_CONDITION_NOT_OPEN unless condition OPEN/MITIGATING", "ERR_PRICE_CAP_EXCEEDED if provisional_price_cents > project.single_co_cap_cents", "AuditEvent appended"]
  - method: POST
    path: "/site-utility/change-orders/{id}/review"
    description: "SUBMITTED -> APPROVED | REJECTED; amount-gated role (>= 2500000 cents: owner rep of the CO's owner; below: ProjectManager); reviewer != submitter"
    roles: [ProjectManager, UtilityOwnerRep]
    code: 200
    input: [decision]
    output: ChangeOrder
    side_effects: ["status -> APPROVED or REJECTED per decision", "reviewed_by_user_id := X-User-ID", "on APPROVE: project.approved_co_total_cents += provisional_price_cents; condition OPEN -> MITIGATING", "ERR_CONTINGENCY_EXCEEDED when approval would exceed project.contingency_cents", "AuditEvent appended"]
  - method: POST
    path: "/site-utility/change-orders/{id}/revise"
    description: "REJECTED -> DRAFT; bumps revision; optional pricing changes recompute the provisional price"
    roles: [ProjectManager]
    code: 200
    input: ["labor_hours?", "labor_rate_cents?", "equipment_hours?", "equipment_rate_cents?", "material_cost_cents?"]
    output: ChangeOrder
    side_effects: ["status -> DRAFT", "revision += 1", "pricing fields recomputed when inputs supplied", "AuditEvent appended"]
  - method: POST
    path: "/site-utility/change-orders/{id}/complete"
    description: "APPROVED -> COMPLETED; computes the FINAL variant price from actuals and the delta"
    roles: [ProjectManager]
    code: 200
    input: [actual_labor_hours, actual_labor_rate_cents, actual_equipment_hours, actual_equipment_rate_cents, actual_material_cost_cents]
    output: ChangeOrder
    side_effects: ["status -> COMPLETED", "final_price_cents computed (FINAL variant)", "price_delta_cents := final - provisional", "project.approved_co_total_cents += price_delta_cents", "AuditEvent appended"]

  # --- Logical clock (test-driving endpoint) ---
  - method: POST
    path: "/site-utility/_clock/set_current_utc"
    description: "Advance the server logical clock. Before any call the clock reads exactly 2026-08-01T00:00:00Z (it never falls back to wall-clock). The new value must be strictly greater than the current value. Fires time-driven transitions in pinned order: (1) locate tickets SUBMITTED->ACTIVE at legal_start_at, (2) tickets ACTIVE/SUBMITTED->EXPIRED at valid_until, (3) permits ISSUED->ACTIVE / ->EXPIRED, (4) windows PROPOSED->MISSED at start, CONFIRMED->ACTIVE at start when posture CLEAR, CONFIRMED/ACTIVE->MISSED at end."
    roles: [OpsAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["time-driven state transitions per pinned order", "AuditEvent appended for each transitioned entity"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed request: missing required field, bad type, out-of-range enum, non-positive numeric, or window duration not in (0, owner.max_shutdown_hours*60] minutes" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing, or role not a declared role" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for this endpoint, or UtilityOwnerRep X-User-ID does not match the resource's utility_owner_id" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Segregation of duties: reviewer/confirmer X-User-ID equals the resource's submitted_by_user_id / recorded_by_user_id" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body-referenced FK id does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_project_version does not equal the referenced Project's current version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a valid from-state for the requested transition (including terminal-state lockdown)" }
  - { id: ERR_PROJECT_STOPPED, http: 409, condition: "Project work_posture is STOPPED; ground-disturbing work, window confirmation, and permit reinstatement are blocked" }
  - { id: ERR_LOCATE_NOT_ACTIVE, http: 409, condition: "No LocateTicket of the project in status ACTIVE (ticket missing, still waiting, or expired)" }
  - { id: ERR_DUPLICATE_OPEN_TICKET, http: 409, condition: "Project already has a LocateTicket in DRAFT, SUBMITTED, or ACTIVE" }
  - { id: ERR_POTHOLE_TOLERANCE_EXCEEDED, http: 422, condition: "Pothole verify failed: |measured-design| depth > 6 in or offset > 12 in" }
  - { id: ERR_DUPLICATE_STATION, http: 409, condition: "A PotholeVerification for the same project + station_label exists in PLANNED, PERFORMED, or VERIFIED" }
  - { id: ERR_POTHOLES_OUTSTANDING, http: 409, condition: "mark-ready blocked: project has PotholeVerifications in PLANNED, PERFORMED, or CONFLICT" }
  - { id: ERR_PLAN_NOT_APPROVED, http: 409, condition: "mark-ready blocked: no TrenchSafetyPlan for the segment in status APPROVED" }
  - { id: ERR_SLOPE_NONCOMPLIANT, http: 422, condition: "SLOPING/BENCHING plan slope_ratio below the required ratio for its soil class" }
  - { id: ERR_ENGINEERED_DESIGN_REQUIRED, http: 422, condition: "max_depth_ft >= 20 requires SHORING or TRENCH_BOX with engineered_certification" }
  - { id: ERR_INSPECTION_NOT_PASSED, http: 409, condition: "start-backfill blocked: latest CONFIRMED installation inspection is not PASS (or none exists)" }
  - { id: ERR_LIFT_SEQUENCE, http: 422, condition: "lift_number must equal max existing lift_number on the segment + 1 (first test must be lift 1)" }
  - { id: ERR_LIFTS_INCOMPLETE, http: 409, condition: "Segment completion blocked: lifts_satisfied < lifts_required" }
  - { id: ERR_PERMIT_NOT_ACTIVE, http: 409, condition: "Discharge reading rejected: permit not in status ACTIVE" }
  - { id: ERR_READING_OUTSIDE_PERMIT_WINDOW, http: 422, condition: "recorded_at outside the permit's half-open effective window [effective_from, effective_to)" }
  - { id: ERR_WINDOW_IN_PAST, http: 422, condition: "window_start must be strictly after the current logical clock time" }
  - { id: ERR_INSUFFICIENT_NOTICE, http: 422, condition: "window_start - now < utility_owner.min_notice_hours" }
  - { id: ERR_OWNER_WINDOW_OVERLAP, http: 409, condition: "Half-open [window_start, window_end) overlaps an existing PROPOSED/CONFIRMED/ACTIVE window of the same utility owner (touching endpoints allowed)" }
  - { id: ERR_PROJECT_WINDOW_BUFFER, http: 409, condition: "Less than 120 minutes clearance from an existing PROPOSED/CONFIRMED/ACTIVE window of the same project (clearance of exactly 120 minutes passes)" }
  - { id: ERR_CONDITION_NOT_OPEN, http: 422, condition: "UnforeseenCondition not in OPEN (create) or OPEN/MITIGATING (submit/approve) as required" }
  - { id: ERR_CO_NOT_COMPLETED, http: 409, condition: "Condition resolution blocked: change orders remain in DRAFT, SUBMITTED, or APPROVED" }
  - { id: ERR_CROSS_PROJECT_REFERENCE, http: 422, condition: "A body FK references a resource belonging to a different project scope" }
  - { id: ERR_PRICE_CAP_EXCEEDED, http: 422, condition: "provisional_price_cents exceeds project.single_co_cap_cents" }
  - { id: ERR_CONTINGENCY_EXCEEDED, http: 409, condition: "Approval would push project.approved_co_total_cents above project.contingency_cents" }
  - { id: ERR_ASBUILT_ALREADY_OPEN, http: 409, condition: "Segment already has an AsBuiltPackage in DRAFT or SUBMITTED" }
  - { id: ERR_ASBUILT_OUT_OF_TOLERANCE, http: 409, condition: "ACCEPT rejected: within_tolerance == false" }
  - { id: ERR_CLOSEOUT_INCOMPLETE, http: 409, condition: "begin-closeout blocked: incomplete segments, missing ACCEPTED as-builts, open conditions, or open change orders" }
  - { id: ERR_SEGMENT_NOT_COMPLETE, http: 409, condition: "as-built submit blocked: pipe segment not in status COMPLETE" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: OpsAdmin
    description: "Platform operator; maintains the utility-owner registry and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /site-utility/utility-owners"
      - "POST /site-utility/_clock/set_current_utc"
    shared_operations: ["All GET endpoints"]
  - name: ProjectManager
    description: "Contractor's PM; owns project lifecycle, locate tickets, pothole adjudication, shutdown windows, permits, as-builts, conditions, and change orders"
    identity: opaque
    exclusive_operations:
      - "POST /site-utility/projects, POST /site-utility/projects/{id}/begin-closeout, POST /site-utility/projects/{id}/close"
      - "POST /site-utility/locate-tickets, /submit, /renew"
      - "POST /site-utility/pothole-verifications, /verify, /mark-conflict"
      - "POST /site-utility/shutdown-windows, /cancel"
      - "POST /site-utility/discharge-permits, /reinstate"
      - "POST /site-utility/as-built-packages, /submit, /revise"
      - "POST /site-utility/unforeseen-conditions, /resolve"
      - "POST /site-utility/change-orders, /submit, /revise, /complete, /review (only when provisional_price_cents < 2500000)"
      - "POST /site-utility/installation-inspections/{id}/dispute"
    shared_operations: ["All GET endpoints"]
  - name: Foreman
    description: "Field supervisor; drives trench safety plans, pipe segment pipeline, pothole fieldwork, discharge readings, compaction tests, and tie-in completion"
    identity: opaque
    exclusive_operations:
      - "POST /site-utility/trench-safety-plans, /submit, /revise"
      - "POST /site-utility/pipe-segments, /mark-ready, /start-install, /complete-install, /reopen-install, /start-backfill, /complete"
      - "POST /site-utility/pothole-verifications/{id}/perform"
      - "POST /site-utility/discharge-readings"
      - "POST /site-utility/compaction-tests"
      - "POST /site-utility/shutdown-windows/{id}/complete"
    shared_operations: ["All GET endpoints"]
  - name: SafetyOfficer
    description: "Competent person for excavation safety; sole reviewer of trench safety plans"
    identity: opaque
    exclusive_operations:
      - "POST /site-utility/trench-safety-plans/{id}/review"
    shared_operations: ["All GET endpoints"]
  - name: Inspector
    description: "Independent inspector; records and confirms installation inspections, reviews compaction tests"
    identity: opaque
    exclusive_operations:
      - "POST /site-utility/installation-inspections, /confirm"
      - "POST /site-utility/compaction-tests/{id}/review"
    shared_operations: ["All GET endpoints"]
  - name: UtilityOwnerRep
    description: "Utility owner's representative; X-User-ID equals the UtilityOwner id the rep acts for"
    identity: "entity_backed:UtilityOwner"
    exclusive_operations:
      - "POST /site-utility/shutdown-windows/{id}/review"
      - "POST /site-utility/as-built-packages/{id}/review"
