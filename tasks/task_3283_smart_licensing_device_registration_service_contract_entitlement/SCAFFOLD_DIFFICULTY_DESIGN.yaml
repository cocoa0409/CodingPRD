  - rule_id: compensating_invariant
    instances:
      - name: transfer_conserves_global_purchased_quantity
        grounds:
          - "calculations.transfer_recompute"
          - "state_machines.LicenseTransferRequest.APPROVED_to_EXECUTED"
        distinguishing_aspect: "Conserved quantity = sum of purchased_quantity over all LicensePool rows: an executed transfer of q units decrements the source pool by q and increments (or creates) the target pool by exactly q, so the global sum is unchanged."
        test_recipe:
          setup:
            - "Account with VA1 pool P1 purchased 10 consumed 2 (assignment of 2), and VA2 with no pool; transfer request of 5 units approved"
          setup_api_calls:
            - call: "POST /api/smart-accounts"
              payload: { account_ref: "A17", display_name: "Acct Seventeen" }
              as: PlatformAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /api/virtual-accounts"
              payload: { smart_account_id: "${sa_id}", name: "VA1" }
              as: PlatformAdmin
              captures: { va1: $.data.id }
            - call: "POST /api/virtual-accounts"
              payload: { smart_account_id: "${sa_id}", name: "VA2" }
              as: PlatformAdmin
              captures: { va2: $.data.id }
            - call: "POST /api/license-pools"
              payload: { virtual_account_id: "${va1}", sku: "LIC-17", license_model: "PERPETUAL", feature_tier: "ESSENTIALS", purchased_quantity: 10 }
              as: PlatformAdmin
              captures: { pool_id: $.data.id }
            - call: "POST /api/devices"
              payload: { virtual_account_id: "${va1}", serial_number: "SN-17", product_family: "PF-17" }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /api/devices/${dev_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/license-assignments"
              payload: { device_id: "${dev_id}", license_pool_id: "${pool_id}", quantity: 2 }
              as: PlatformAdmin
            - call: "POST /api/license-transfer-requests"
              payload: { source_pool_id: "${pool_id}", target_virtual_account_id: "${va2}", quantity: 5, reason: "ACCOUNT_REORG" }
              as: PlatformAdmin
              captures: { tr_id: $.data.id, tr_ver: $.data.version }
            - call: "POST /api/license-transfer-requests/${tr_id}/approve"
              payload: { expected_transfer_version: "${tr_ver}" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/license-transfer-requests/${tr_id}/execute"
              payload: {}
              as: PlatformAdmin
            - call: "GET /api/license-pools/${pool_id}"
              payload: {}
              as: PlatformAdmin
              captures: { src_qty: $.data.purchased_quantity }
            - call: "GET /api/virtual-accounts/${va2}/license-pools"
              payload: {}
              as: PlatformAdmin
              captures: { tgt_qty: "$.data[0].purchased_quantity" }
          assert:
            - "src_qty == 5"
            - "tgt_qty == 5"
            - "src_qty + tgt_qty == 10 (global purchased_quantity conserved)"
      - name: deregister_reregister_conserves_assignment_quantity
        grounds:
          - "state_machines.Device.REGISTERED_to_DEREGISTERED"
          - "state_machines.DeviceLicenseAssignment.ACTIVE_to_RELEASED"
        distinguishing_aspect: "Different conserved quantity: total ACTIVE assignment quantity against a pool — deregistering a device releases its assignments (sum drops to 0) and re-registering plus re-assigning restores exactly the released amount; consumed_quantity before and after the round trip are equal with no drift."
        test_recipe:
          setup:
            - "Pool purchased 10; device D with assignment quantity 4; pool consumed 4"
          setup_api_calls:
            - call: "POST /api/smart-accounts"
              payload: { account_ref: "A18", display_name: "Acct Eighteen" }
              as: PlatformAdmin
              captures: { sa_id: $.data.id }
