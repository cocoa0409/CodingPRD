            captures: { d_status2: "$.data.status", d_sub: "$.data.submitted_by_user_id" }
          - call: "POST /direct-selling/income-disclosure-statements/${d_id}/submit-legal-review"
            as: CommissionAnalyst
            as_user_id: "ANALYST-1"
            captures: { e_notdraft: "$.data.error_id" }
          - call: "POST /direct-selling/income-disclosure-statements/${d_id}/legal-decision"
            payload: { decision: "REQUEST_REVISION" }
            as: LegalReviewer
            as_user_id: "LEGAL-1"
            captures: { e_note: "$.data.error_id" }
          - call: "POST /direct-selling/income-disclosure-statements/${d_id}/legal-decision"
            payload: { decision: "PUBLISH" }
            as: LegalReviewer
            as_user_id: "ANALYST-1"
