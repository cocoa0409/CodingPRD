      - name: apply_offload_cascade_plan_recompute_flight_load_controlled
        depth: 3
        trigger_transition: "LoadPlan RESTRICTED -> COMPUTED (POST /load-plans/{id}/apply-offload)"
        chain:
          - "hop 1 (direct): every CargoItem in calculate_offload_selection's selected set moves ACCEPTED -> OFFLOADED and its assigned_compartment_id is cleared"
          - "hop 2 (caused by hop 1): because those consignments left the payload set, LoadPlan.planned_payload_kg, underload_kg and the entire index / %MAC / envelope chain are recomputed from the surviving distribution"
          - "hop 3 (caused by hop 2): because the recomputed plan now satisfies the payload limit and moves RESTRICTED -> COMPUTED, Flight.status PLANNING -> LOAD_CONTROLLED"
        grounds:
          - state_machines.LoadPlan.transitions.RESTRICTED_to_COMPUTED
          - state_machines.CargoItem.transitions.ACCEPTED_to_OFFLOADED
          - state_machines.Flight.dimension_status.transitions.PLANNING_to_LOAD_CONTROLLED
        distinguishing_aspect: |
          A different originating transition from the sheet-acceptance cascade, and
          a different propagation pattern: here hop 1 removes rows from a
          calculation's input set, hop 2 is the recomputation that removal forces,
          and hop 3 is a state promotion that only becomes legal because of hop 2's
          numbers. Calling apply-offload on a plan whose cargo cannot cover the
          excess stops at hop 1 with ERR_OFFLOAD_INSUFFICIENT and the flight stays
          PLANNING, proving hop 3 is not a direct effect of the call.
        test_recipe:
          setup:
            - "Aircraft HB-AAA with cabin zones OA, OB, OC and holds H1, H4, H5; runway LSGG/04 with the [15,30) band; STANDARD program; one flight 10:00-12:30 UTC with allowed_payload_kg 20180.00."
