# =============================================================================
# Task 0116: Home Health Nurse Dispatch
# =============================================================================
# Order source (OASIS assessment), nurse / PT / OT / SLP visits,
# HHA companion hours, mileage, Medicare 60-day episode, recertification,
# PDGM payment.
# =============================================================================

scenario: |
  Home Health Nurse Dispatch: order source (OASIS assessment), nurse/PT/OT/SLP
  visits, HHA companion hours, mileage, Medicare 60-day episode, recertification,
  PDGM payment.

domain_name: home-health-dispatch
api_prefix: /episodes

# -----------------------------------------------------------------------------
# Complexity Profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation         # provisional vs final PDGM claim on the Episode
    - rate_threshold_triggers          # LUPA visit-count threshold, mileage tier breakpoints
    - cascading_side_effects           # OASIS lock -> Episode open -> Visit ordering -> Claim recompute
    - scheduled_deferred_actions       # 60-day calendar window and recertification window

  entity_topology: hybrid              # Episode is parent of Visits, MileageLogs, Claim;
                                       # Patient and Clinician are peer entities referenced by FK;
                                       # OASISAssessment is a peer order source bound to Episode

  state_machine_shape: branching       # OASISAssessment branches into Episode (SOC vs Recert vs ROC),
                                       # Episode branches at LUPA boundary into LUPA-paid vs case-mix-paid Claim

  relationship_patterns:
    - one_to_many                      # Episode -> Visits, Episode -> MileageLogs
    - cross_aggregate                  # Visit references Clinician (peer aggregate)
    - polymorphic                      # OASISAssessment.assessment_reason references different episode triggers

  role_model: peer_roles               # IntakeCoordinator owns OASIS + Episodes; FieldClinician owns Visits + Mileage;
                                       # BillingSpecialist owns Claims; PlatformAdmin operates clock/sweep
  consistency_model: immediate         # All mutations atomic per request; cascades happen inline

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Patient full legal name" }
      - { name: medicare_id, type: string, source: input, description: "Medicare beneficiary identifier (unique)", constraints: "unique" }
      - { name: home_zip, type: string, source: input, description: "Five-digit ZIP code of the patient's residence; used to look up wage_index" }
      - { name: wage_index, type: number, source: computed, description: "PDGM wage index for the patient's CBSA; computed from home_zip at Patient creation and re-derived if home_zip is updated via PATCH /patients/{patientId}. Episode/Claim calculations read wage_index off the Patient row at the moment of calculation (provisional reads it at Episode OPEN; final reads it at Episode CLOSED)." }

  - name: Clinician
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Clinician full name" }
      - { name: discipline, type: enum, source: input, description: "Clinician discipline that determines what visit types they may perform", constraints: "SN | PT | OT | SLP | HHA" }
      - { name: license_expiration_date, type: string, source: input, description: "ISO 8601 date (YYYY-MM-DD) on which the clinician's license expires; visits dated on or after this date are blocked" }
      - { name: status, type: enum, source: system, description: "Clinician dispatch status", constraints: "AVAILABLE | SUSPENDED" }

  - name: OASISAssessment
    parent: Patient
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: system, description: "FK to Patient.id (path-derived)" }
      - { name: assessment_reason, type: enum, source: input, description: "OASIS Reason for Assessment (RFA)", constraints: "START_OF_CARE | RECERTIFICATION | RESUMPTION_OF_CARE" }
      - { name: assessment_date, type: string, source: input, description: "ISO 8601 date (YYYY-MM-DD) on which the OASIS was completed in the patient's home" }
      - { name: clinical_grouping, type: enum, source: input, description: "PDGM clinical grouping derived from primary diagnosis", constraints: "MMTA_OTHER | NEURO | WOUND | MS_REHAB | BEHAVIORAL | COMPLEX" }
      - { name: functional_impairment_level, type: enum, source: input, description: "PDGM functional impairment level", constraints: "LOW | MEDIUM | HIGH" }
      - { name: admission_source, type: enum, source: input, description: "PDGM admission source", constraints: "COMMUNITY | INSTITUTIONAL" }
      - { name: hha_companion_hours_ordered, type: number, source: input, description: "Number of HHA companion-care hours ordered on the OASIS plan of care, applies for the resulting episode", default: 0, constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "OASIS lifecycle", constraints: "DRAFT | LOCKED | SUPERSEDED" }

  - name: Episode
    parent: Patient
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: system, description: "FK to Patient.id (path-derived)" }
      - { name: source_oasis_id, type: string, source: input, description: "FK to the LOCKED OASISAssessment that opened this episode" }
      - { name: episode_type, type: enum, source: computed, description: "Derived from source_oasis.assessment_reason: START_OF_CARE -> INITIAL; RECERTIFICATION -> RECERT; RESUMPTION_OF_CARE -> ROC", constraints: "INITIAL | RECERT | ROC" }
      - { name: start_date, type: string, source: computed, description: "ISO date; equals source_oasis.assessment_date for INITIAL and ROC; equals prior episode's end_date + 1 day for RECERT" }
      - { name: end_date, type: string, source: computed, description: "ISO date; equals start_date + 59 days (60-day inclusive window)" }
      - { name: timing_category, type: enum, source: computed, description: "PDGM timing category. INITIAL -> EARLY. RECERT/ROC where the prior episode chain has at least one EARLY episode and the current is the second in the chain -> LATE. All later episodes in the chain -> LATE.", constraints: "EARLY | LATE" }
      - { name: recert_due_date, type: string, source: computed, description: "ISO date = end_date - 4 days; a RECERT OASIS must be locked between recert_due_date and end_date inclusive for the next episode to be eligible" }
      - { name: status, type: enum, source: system, description: "Episode lifecycle", constraints: "OPEN | CLOSED | EXPIRED" }

  - name: Visit
    parent: Episode
    common_fields: true
    fields:
      - { name: episode_id, type: string, source: system, description: "FK to Episode.id (path-derived)" }
      - { name: clinician_id, type: string, source: input, description: "FK to Clinician.id" }
      - { name: visit_type, type: enum, source: input, description: "Discipline of the visit; must match Clinician.discipline", constraints: "SN | PT | OT | SLP | HHA" }
      - { name: visit_date, type: string, source: input, description: "ISO date (YYYY-MM-DD) of the visit; must fall in [Episode.start_date, Episode.end_date]" }
      - { name: start_minute, type: integer, source: input, description: "Minute-of-day the visit started, 0..1439" }
      - { name: end_minute, type: integer, source: input, description: "Minute-of-day the visit ended; must be > start_minute and <= 1439" }
      - { name: hha_hours, type: number, source: computed, description: "For visit_type=HHA: (end_minute - start_minute) / 60, rounded half-up to 2 decimals. For non-HHA: 0." }
      - { name: status, type: enum, source: system, description: "Visit lifecycle", constraints: "SCHEDULED | COMPLETED | CANCELLED" }

  - name: MileageLog
    parent: Visit
    common_fields: false              # immutable once recorded — no updated_at / version
    fields:
      - { name: visit_id, type: string, source: system, description: "FK to Visit.id (path-derived)" }
      - { name: episode_id, type: string, source: system, description: "FK to Episode.id, denormalized for billing aggregation" }
      - { name: miles_driven, type: number, source: input, description: "Round-trip miles driven for this visit; > 0", constraints: "> 0" }
      - { name: reimbursement_amount, type: number, source: computed, description: "Mileage reimbursement in USD, computed by tiered formula and rounded half-up to 2 decimals on insertion" }

  - name: PDGMClaim
    parent: Episode
    common_fields: true
    fields:
      - { name: episode_id, type: string, source: system, description: "FK to Episode.id (path-derived); exactly one PDGMClaim per Episode" }
      - { name: hipps_code, type: string, source: computed, description: "Five-character PDGM HIPPS code: position 1=timing (1=EARLY,2=LATE); position 2=clinical_grouping letter (A..F); position 3=functional level (F=LOW,G=MEDIUM,H=HIGH); position 4=admission source (J=COMMUNITY,K=INSTITUTIONAL); position 5='1' constant" }
      - { name: case_mix_weight, type: number, source: computed, description: "Case-mix weight looked up from constants.CMW_TABLE keyed by (timing_category, clinical_grouping, functional_impairment_level, admission_source); rounded to 4 decimals" }
      - { name: provisional_payment, type: number, source: computed, description: "Forward-looking estimated payment in USD, computed at Episode OPEN using OASIS plan of care (assumes visit count >= LUPA threshold)" }
      - { name: final_payment, type: number, source: computed, description: "Chronological actual payment in USD, computed at Episode close from completed visits (applies LUPA adjustment if completed-visit count < threshold)" }
      - { name: lupa_applied, type: boolean, source: computed, description: "True iff completed-visit count at Episode close was strictly less than constants.LUPA_THRESHOLD" }
      - { name: total_mileage_reimbursement, type: number, source: computed, description: "Sum of MileageLog.reimbursement_amount for all completed visits in the episode; recomputed on Episode close" }
      - { name: status, type: enum, source: system, description: "Claim lifecycle", constraints: "PENDING | FINALIZED" }

  - name: ClockState
    parent: null
    common_fields: false
    fields:
      - { name: current_date, type: string, source: system, description: "Server's current ISO date (YYYY-MM-DD); singleton row used to drive scheduled actions in tests. Advanced via POST /_clock/advance." }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ----- OASISAssessment -----
  - entity: OASISAssessment
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: LOCKED
        trigger: POST /patients/{patientId}/oasis/{oasisId}/lock
        actor: IntakeCoordinator
        preconditions:
          - "OASIS has assessment_reason and clinical_grouping and functional_impairment_level and admission_source populated"
          - "If assessment_reason == RECERTIFICATION: patient has a prior Episode whose recert_due_date <= ClockState.current_date <= end_date"
          - "If assessment_reason == RESUMPTION_OF_CARE: patient has an OPEN Episode"
        side_effects:
          - "Any other DRAFT OASIS belonging to the same patient transitions to SUPERSEDED"
        note: "Locking is a prerequisite for opening an Episode; one LOCKED OASIS may open exactly one Episode."

      - from: LOCKED
        to: SUPERSEDED
        trigger: "system: a new OASIS for the same patient is locked with assessment_reason == RECERTIFICATION and the prior LOCKED OASIS has already opened an Episode that is now CLOSED"
        actor: system
        preconditions:
          - "Prior LOCKED OASIS already produced an Episode whose status is CLOSED or EXPIRED"
        side_effects: []

  # ----- Episode -----
  - entity: Episode
    initial_state: OPEN
    terminal_states: [CLOSED, EXPIRED]
    transitions:
      - from: null            # create-from-empty
        to: OPEN
        trigger: POST /patients/{patientId}/episodes
        actor: IntakeCoordinator
        preconditions:
          - "Body.source_oasis_id references an OASISAssessment with status == LOCKED"
          - "Source OASIS has not already opened another Episode"
          - "Patient has no other Episode whose status == OPEN"
        side_effects:
          - "Compute episode_type, start_date, end_date, timing_category, recert_due_date per entity field rules"
          - "Create a paired PDGMClaim in status PENDING and compute hipps_code, case_mix_weight, provisional_payment (see §1.3 pdgm_provisional_payment)"

      - from: OPEN
        to: CLOSED
        trigger: POST /episodes/{episodeId}/close
        actor: BillingSpecialist
        preconditions:
          - "ClockState.current_date >= Episode.end_date"
          - "Episode has zero Visits whose status == SCHEDULED"
        side_effects:
          - "Recompute PDGMClaim.final_payment, lupa_applied, and total_mileage_reimbursement per §1.3 pdgm_final_payment and mileage_reimbursement"
          - "PDGMClaim transitions PENDING -> FINALIZED"

      - from: OPEN
        to: EXPIRED
        trigger: "system: POST /_sweep/expire-episodes"
        actor: system
        preconditions:
          - "ClockState.current_date > Episode.end_date + 7"
          - "Episode.status == OPEN at sweep time"
        side_effects:
          - "All Visits with status == SCHEDULED on this Episode transition to CANCELLED"
          - "PDGMClaim.final_payment is set equal to PDGMClaim.provisional_payment, lupa_applied is set to false, total_mileage_reimbursement is recomputed from already-COMPLETED visits, and PDGMClaim transitions PENDING -> FINALIZED"
        note: "Hands-off cleanup for abandoned episodes. The cascade is: sweep -> Episode EXPIRED -> Visit CANCELLED (depth 2) -> PDGMClaim FINALIZED via mileage recomputation that follows the Visit cancellation (depth 3)."

  # ----- Visit -----
  - entity: Visit
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: null
        to: SCHEDULED
        trigger: POST /episodes/{episodeId}/visits
        actor: IntakeCoordinator
        preconditions:
          - "Episode.status == OPEN"
          - "Body.visit_date is within [Episode.start_date, Episode.end_date]"
          - "Clinician.status == AVAILABLE and Clinician.license_expiration_date > visit_date"
          - "Clinician.discipline == body.visit_type"
          - "No other Visit on the same Clinician overlaps the requested [start_minute, end_minute) on visit_date (half-open intervals; touching at the same minute is permitted)"
          - "If visit_type == HHA: cumulative HHA hours already scheduled or completed on this episode plus this visit's hha_hours must not exceed Episode.source_oasis.hha_companion_hours_ordered"
        side_effects: []

      - from: SCHEDULED
        to: COMPLETED
        trigger: POST /visits/{visitId}/complete
        actor: FieldClinician
        preconditions:
          - "Acting Clinician.id == Visit.clinician_id"
          - "ClockState.current_date >= Visit.visit_date"
        side_effects: []

      - from: SCHEDULED
        to: CANCELLED
        trigger: POST /visits/{visitId}/cancel
        actor: IntakeCoordinator
        preconditions: []
        side_effects: []

  # ----- PDGMClaim (auto-managed by Episode transitions) -----
  - entity: PDGMClaim
    initial_state: PENDING
    terminal_states: [FINALIZED]
    transitions:
      - from: PENDING
        to: FINALIZED
        trigger: "system: as a side effect of Episode OPEN -> CLOSED or Episode OPEN -> EXPIRED"
        actor: system
        preconditions:
          - "Parent Episode is transitioning to CLOSED or EXPIRED in the same request"
        side_effects: []

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - scenario: "Two Episode-open requests race for the same LOCKED OASIS"
    guarantee: "At most one Episode per LOCKED OASIS; second open is rejected"
    error_id: ERR_OASIS_ALREADY_USED
    http_status: 409
    serialization: "First-writer-wins on Episode.source_oasis_id"

  - scenario: "Two Episode-open requests race on the same Patient with two different LOCKED OASIS rows"
    guarantee: "At most one OPEN Episode per Patient; second open is rejected"
    error_id: ERR_PATIENT_HAS_OPEN_EPISODE
    http_status: 409
    serialization: "First-writer-wins on (patient_id, status=OPEN)"

  - scenario: "Two Visit-schedule requests race for the same Clinician at overlapping time windows"
    guarantee: "At most one Visit per Clinician per overlapping window; second schedule is rejected"
    error_id: ERR_CLINICIAN_DOUBLE_BOOKED
    http_status: 409
    serialization: "First-writer-wins on (clinician_id, visit_date, [start_minute, end_minute))"

  - scenario: "Close and expire-sweep race for the same OPEN Episode"
    guarantee: "Exactly one transition succeeds on the Episode; the loser sees the Episode no longer OPEN"
    error_id: ERR_EPISODE_NOT_OPEN
    http_status: 409
    serialization: "First-writer-wins on Episode.status transition out of OPEN"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: pdgm_provisional_payment
    trigger: "On Episode OPEN side-effect path (forward-looking estimate)"
    algorithm: forward_looking
    formula: |
      # Inputs: source OASIS clinical_grouping, functional_impairment_level, admission_source;
      # Episode timing_category; Patient.wage_index.
      # Step 1: case_mix_weight = CMW_TABLE[(timing_category, clinical_grouping,
      #                                       functional_impairment_level, admission_source)]
      # Step 2: wage_adjusted_base = BASE_30DAY_RATE * wage_index
      #         (rounded HALF_UP to 4 decimals — wage adjustment precedes case-mix)
      # Step 3: provisional_payment = wage_adjusted_base * case_mix_weight
      #         (rounded HALF_UP to 2 decimals)
      # Step 4: NO LUPA adjustment — provisional assumes >= LUPA_THRESHOLD visits.
    input_set: "Source OASIS fields + Episode.timing_category + Patient.wage_index. No Visit data is read."
    constants:
      BASE_30DAY_RATE: 2000.00
      CMW_TABLE:
        # keyed: timing | clinical_grouping | functional | admission -> weight
        EARLY|MMTA_OTHER|LOW|COMMUNITY: 0.9000
        EARLY|MMTA_OTHER|MEDIUM|COMMUNITY: 1.0000
        EARLY|MMTA_OTHER|HIGH|COMMUNITY: 1.1500
        EARLY|MMTA_OTHER|LOW|INSTITUTIONAL: 1.0500
        EARLY|MMTA_OTHER|MEDIUM|INSTITUTIONAL: 1.1500
        EARLY|MMTA_OTHER|HIGH|INSTITUTIONAL: 1.3000
        EARLY|NEURO|LOW|COMMUNITY: 1.0000
        EARLY|NEURO|MEDIUM|COMMUNITY: 1.1500
        EARLY|NEURO|HIGH|COMMUNITY: 1.3500
        EARLY|NEURO|LOW|INSTITUTIONAL: 1.2000
        EARLY|NEURO|MEDIUM|INSTITUTIONAL: 1.3500
        EARLY|NEURO|HIGH|INSTITUTIONAL: 1.5000
        EARLY|WOUND|MEDIUM|COMMUNITY: 1.2000
        EARLY|WOUND|HIGH|COMMUNITY: 1.4000
        EARLY|MS_REHAB|MEDIUM|COMMUNITY: 1.1000
        EARLY|BEHAVIORAL|MEDIUM|COMMUNITY: 0.9500
        EARLY|COMPLEX|HIGH|INSTITUTIONAL: 1.6000
        LATE|MMTA_OTHER|LOW|COMMUNITY: 0.8000
        LATE|MMTA_OTHER|MEDIUM|COMMUNITY: 0.9000
        LATE|MMTA_OTHER|HIGH|COMMUNITY: 1.0500
        LATE|NEURO|MEDIUM|COMMUNITY: 1.0500
        LATE|NEURO|HIGH|COMMUNITY: 1.2500
        LATE|WOUND|HIGH|COMMUNITY: 1.3000
    precision: "Step 2 rounds to 4 decimals (HALF_UP). Step 3 rounds to 2 decimals (HALF_UP)."
    variants:
      - name: standard
        when: "Always at Episode OPEN"
        difference: "Single algorithm; no LUPA branch."

  - name: pdgm_final_payment
    trigger: "On Episode OPEN -> CLOSED transition (chronological actual)"
    algorithm: chronological
    formula: |
      # Inputs: same constants as pdgm_provisional_payment, plus the chronological
      # set of COMPLETED Visits on the Episode at close time.
      # Step A: completed_visit_count = count(Visit where status == COMPLETED).
      # Step B: if completed_visit_count < LUPA_THRESHOLD:
      #             # LUPA: per-visit payment instead of case-mix
      #             # Sort COMPLETED visits ascending by (visit_date, start_minute, id) -- chronological
      #             total = 0
      #             for each completed visit in chronological order:
      #                 per_visit = LUPA_PER_VISIT_RATE[visit.visit_type] * wage_index
      #                 per_visit = round_half_up(per_visit, 2)
      #                 total += per_visit
      #             final_payment = total                # already cent-precise per visit
      #             lupa_applied = true
      #         else:
      #             wage_adjusted_base = round_half_up(BASE_30DAY_RATE * wage_index, 4)
      #             final_payment = round_half_up(wage_adjusted_base * case_mix_weight, 2)
      #             lupa_applied = false
      # Step C: write final_payment, lupa_applied onto PDGMClaim.
    input_set: "All Visit rows on the Episode whose status == COMPLETED at close time. SCHEDULED visits at close time block the close (see Episode CLOSE precondition). CANCELLED visits are excluded."
    constants:
      BASE_30DAY_RATE: 2000.00
      LUPA_THRESHOLD: 5     # strict: count < 5 triggers LUPA
      LUPA_PER_VISIT_RATE:
        SN: 160.00
        PT: 170.00
        OT: 165.00
        SLP: 175.00
        HHA: 80.00
    precision: "Per-visit LUPA payment rounded HALF_UP to 2 decimals BEFORE summing (round-then-sum). Wage-adjusted base rounded HALF_UP to 4 decimals before case-mix multiplication; final case-mix payment rounded HALF_UP to 2 decimals."
    variants:
      - name: case_mix_path
        when: "completed_visit_count >= LUPA_THRESHOLD"
        difference: "Uses BASE_30DAY_RATE * wage_index * case_mix_weight, matching provisional formula. final_payment equals provisional_payment in this branch when no inputs changed."
      - name: lupa_path
        when: "completed_visit_count < LUPA_THRESHOLD"
        difference: "Replaces the case-mix formula with sum of per-visit rates. Produces a meaningfully different number from the provisional payment for the same inputs — this is the dual-variant divergence."

  - name: mileage_reimbursement
    trigger: "On POST /visits/{visitId}/mileage and recomputed on PDGMClaim finalization aggregation"
    algorithm: tiered_pricing
    formula: |
      # Per-MileageLog tiered formula:
      # Let m = miles_driven (must be > 0)
      # tier1 = min(m, 30) * 0.70
      # tier2 = min(max(m - 30, 0), 70) * 0.55
      # tier3 = max(m - 100, 0) * 0.40
      # reimbursement_amount = round_half_up(tier1 + tier2 + tier3, 2)
      # Aggregation onto PDGMClaim.total_mileage_reimbursement:
      #   total_mileage_reimbursement = sum over MileageLog where
      #       MileageLog.visit_id in (Visit.id where Visit.episode_id == Episode.id
      #                               AND Visit.status == COMPLETED)
      #   This sum-of-rounded-amounts ordering is pinned: round per MileageLog first,
      #   then sum the cent-precise amounts. Sum-then-round on the raw tiers would
      #   produce different totals.
    input_set: "All MileageLog rows linked to COMPLETED Visits on the Episode. MileageLogs on CANCELLED or SCHEDULED visits are excluded."
    constants:
      TIER1_LIMIT_MILES: 30
      TIER2_LIMIT_MILES: 70     # tier 2 covers miles 30..100, i.e. up to 70 additional miles
      TIER1_RATE_USD_PER_MILE: 0.70
      TIER2_RATE_USD_PER_MILE: 0.55
      TIER3_RATE_USD_PER_MILE: 0.40
    precision: "Per-MileageLog reimbursement rounded HALF_UP to 2 decimals at insertion. Aggregation sums already-rounded values (round-then-sum). No further rounding on aggregation."
    variants:
      - name: standard
        when: "always"
        difference: "Single algorithm; difficulty lives in the round-then-sum ordering and the inclusive tier breakpoints (tier 1 is miles 0..30 inclusive of 30; tier 2 covers (30..100], tier 3 covers (100, inf))."

  - name: hha_companion_hours_consumed
    trigger: "On Visit schedule (precondition check) and Visit cancel (post-mutation recompute)"
    algorithm: aggregation
    formula: |
      # Across an Episode:
      # consumed_hours = sum(Visit.hha_hours
      #                       where Visit.episode_id == Episode.id
      #                       AND Visit.visit_type == HHA
      #                       AND Visit.status IN {SCHEDULED, COMPLETED})
      # The schedule precondition checks: consumed_hours + proposed_visit.hha_hours
      #                                   <= source_oasis.hha_companion_hours_ordered
      # Visit.hha_hours per visit = round_half_up((end_minute - start_minute) / 60, 2)
    input_set: "Visits on the Episode with visit_type == HHA and status in {SCHEDULED, COMPLETED}. CANCELLED HHA visits are excluded — cancelling frees up hours."
    constants: {}
    precision: "Per-visit hha_hours rounded HALF_UP to 2 decimals; aggregation sums already-rounded values."
    variants:
      - name: standard
        when: "always"
        difference: "Single algorithm; difficulty lives in the inclusion of SCHEDULED-but-not-yet-COMPLETED hours and exclusion of CANCELLED hours."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:

  # ----- Auth (1–2) -----
  - { priority: 1,  category: auth,                 check: "X-User-Role and X-User-ID headers present and well-formed",                                                           error_id: ERR_AUTH_MISSING,                  http_status: 401, applies_to: all }
  - { priority: 2,  category: auth,                 check: "X-User-Role is permitted for the endpoint per §1.7 RBAC",                                                              error_id: ERR_FORBIDDEN,                     http_status: 403, applies_to: all }

  # ----- Existence (3) -----
  - { priority: 3,  category: existence,            check: "All path-parameter resources exist, validated left-to-right",                                                          error_id: ERR_NOT_FOUND,                     http_status: 404, applies_to: all }

  # ----- State (4–7) -----
  - { priority: 4,  category: state,                check: "On POST /patients/{patientId}/oasis/{oasisId}/lock, OASIS.status == DRAFT",                                            error_id: ERR_OASIS_NOT_DRAFT,               http_status: 409, applies_to: "POST /patients/{patientId}/oasis/{oasisId}/lock" }
  - { priority: 5,  category: state,                check: "On POST /patients/{patientId}/episodes, body.source_oasis.status == LOCKED",                                           error_id: ERR_OASIS_NOT_LOCKED,              http_status: 409, applies_to: "POST /patients/{patientId}/episodes" }
  - { priority: 6,  category: state,                check: "On POST /episodes/{episodeId}/close and any /episodes/{episodeId}/visits mutation, Episode.status == OPEN",            error_id: ERR_EPISODE_NOT_OPEN,              http_status: 409, applies_to: "POST /episodes/{episodeId}/close, POST /episodes/{episodeId}/visits, POST /visits/{visitId}/*" }
  - { priority: 7,  category: state,                check: "On POST /visits/{visitId}/complete or /cancel, Visit.status == SCHEDULED",                                             error_id: ERR_VISIT_NOT_SCHEDULED,           http_status: 409, applies_to: "POST /visits/{visitId}/complete, POST /visits/{visitId}/cancel" }

  # ----- Business: safety / compliance (8–11) -----
  - { priority: 8,  category: business_safety,      check: "On POST /episodes/{episodeId}/visits, Clinician.license_expiration_date > body.visit_date (strict inequality)",       error_id: ERR_CLINICIAN_LICENSE_EXPIRED,     http_status: 422, applies_to: "POST /episodes/{episodeId}/visits" }
  - { priority: 9,  category: business_safety,      check: "On POST /episodes/{episodeId}/visits, Clinician.status == AVAILABLE",                                                  error_id: ERR_CLINICIAN_NOT_AVAILABLE,       http_status: 422, applies_to: "POST /episodes/{episodeId}/visits" }
  - { priority: 10, category: business_safety,      check: "On POST /episodes/{episodeId}/visits, body.visit_type == Clinician.discipline",                                        error_id: ERR_DISCIPLINE_MISMATCH,           http_status: 422, applies_to: "POST /episodes/{episodeId}/visits" }
  - { priority: 11, category: business_safety,      check: "RECERT OASIS may only be locked when ClockState.current_date is within [prior_episode.recert_due_date, prior_episode.end_date] inclusive", error_id: ERR_RECERT_WINDOW_VIOLATION, http_status: 422, applies_to: "POST /patients/{patientId}/oasis/{oasisId}/lock" }

  # ----- Business: temporal / referential (12–15) -----
  - { priority: 12, category: business_temporal,    check: "On POST /episodes/{episodeId}/visits, Episode.start_date <= body.visit_date <= Episode.end_date",                       error_id: ERR_VISIT_OUTSIDE_EPISODE,         http_status: 422, applies_to: "POST /episodes/{episodeId}/visits" }
  - { priority: 13, category: business_temporal,    check: "On POST /episodes/{episodeId}/visits, body.end_minute > body.start_minute and both in [0,1439]",                       error_id: ERR_VISIT_TIME_INVALID,            http_status: 422, applies_to: "POST /episodes/{episodeId}/visits" }
  - { priority: 14, category: business_temporal,    check: "On POST /episodes/{episodeId}/visits, no overlap with another non-CANCELLED visit for the same clinician on the same visit_date (half-open intervals)", error_id: ERR_CLINICIAN_DOUBLE_BOOKED, http_status: 409, applies_to: "POST /episodes/{episodeId}/visits" }
  - { priority: 15, category: business_referential, check: "On POST /patients/{patientId}/episodes, source OASIS has not already opened another Episode AND patient has no other OPEN Episode", error_id: ERR_OASIS_ALREADY_USED, http_status: 409, applies_to: "POST /patients/{patientId}/episodes" }

  # ----- Business: fiscal / quota (16) -----
  - { priority: 16, category: business_fiscal,      check: "On POST /episodes/{episodeId}/visits with visit_type=HHA, cumulative hha_companion_hours_consumed (per §1.3) + proposed visit hha_hours <= source_oasis.hha_companion_hours_ordered", error_id: ERR_HHA_HOURS_EXCEEDED, http_status: 422, applies_to: "POST /episodes/{episodeId}/visits" }

  # ----- Business: constraints (17–19) -----
  - { priority: 17, category: business_constraint,  check: "On POST /visits/{visitId}/mileage, body.miles_driven > 0",                                                              error_id: ERR_MILEAGE_NOT_POSITIVE,          http_status: 422, applies_to: "POST /visits/{visitId}/mileage" }
  - { priority: 18, category: business_constraint,  check: "On POST /visits/{visitId}/mileage, the parent Visit.status == COMPLETED",                                               error_id: ERR_MILEAGE_VISIT_NOT_COMPLETED,   http_status: 409, applies_to: "POST /visits/{visitId}/mileage" }
  - { priority: 19, category: business_constraint,  check: "On PATCH endpoints with body.version, server's current version equals body.version",                                    error_id: ERR_VERSION_CONFLICT,              http_status: 409, applies_to: "PATCH /patients/{patientId}, PATCH /clinicians/{clinicianId}" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ----- Patient -----
  - { method: POST,   path: "/patients",                                          description: "Create a patient",                                  roles: [IntakeCoordinator, PlatformAdmin],          code: 201, input: [full_name, medicare_id, home_zip],                                 output: Patient,           side_effects: [compute Patient.wage_index from home_zip] }
  - { method: GET,    path: "/patients/{patientId}",                              description: "Get a patient",                                     roles: [IntakeCoordinator, FieldClinician, BillingSpecialist, PlatformAdmin], code: 200, input: [],                                                       output: Patient,           side_effects: [] }
  - { method: GET,    path: "/patients",                                          description: "List patients with pagination",                     roles: [IntakeCoordinator, BillingSpecialist, PlatformAdmin],          code: 200, input: ["medicare_id?", "limit?", "offset?"],                                   output: "Patient[]",       side_effects: [] }
  - { method: PATCH,  path: "/patients/{patientId}",                              description: "Update mutable patient fields",                     roles: [IntakeCoordinator, PlatformAdmin],          code: 200, input: ["full_name?", "home_zip?", "version?"],                            output: Patient,           side_effects: [if home_zip changes, recompute Patient.wage_index] }

  # ----- Clinician -----
  - { method: POST,   path: "/clinicians",                                        description: "Create a clinician",                                roles: [PlatformAdmin],                              code: 201, input: [full_name, discipline, license_expiration_date],                   output: Clinician,         side_effects: [] }
  - { method: GET,    path: "/clinicians/{clinicianId}",                          description: "Get a clinician",                                   roles: [PlatformAdmin, IntakeCoordinator, FieldClinician], code: 200, input: [],                                                          output: Clinician,         side_effects: [] }
  - { method: PATCH,  path: "/clinicians/{clinicianId}",                          description: "Update mutable clinician fields",                   roles: [PlatformAdmin],                              code: 200, input: ["status?", "license_expiration_date?", "version?"],                output: Clinician,         side_effects: [] }
  - { method: GET,    path: "/clinicians",                                        description: "List clinicians",                                   roles: [IntakeCoordinator, PlatformAdmin],          code: 200, input: ["discipline?", "status?", "limit?", "offset?"],                     output: "Clinician[]",     side_effects: [] }

  # ----- OASIS -----
  - { method: POST,   path: "/patients/{patientId}/oasis",                        description: "Create a DRAFT OASIS assessment",                   roles: [IntakeCoordinator],                          code: 201, input: [assessment_reason, assessment_date, clinical_grouping, functional_impairment_level, admission_source, "hha_companion_hours_ordered?"], output: OASISAssessment, side_effects: [] }
  - { method: POST,   path: "/patients/{patientId}/oasis/{oasisId}/lock",         description: "Lock a DRAFT OASIS",                                roles: [IntakeCoordinator],                          code: 200, input: [],                                                                  output: OASISAssessment,   side_effects: [supersede other DRAFT OASIS for same patient] }
  - { method: GET,    path: "/patients/{patientId}/oasis/{oasisId}",              description: "Get an OASIS",                                      roles: [IntakeCoordinator, BillingSpecialist],      code: 200, input: [],                                                                  output: OASISAssessment,   side_effects: [] }

  # ----- Episode -----
  - { method: POST,   path: "/patients/{patientId}/episodes",                     description: "Open a 60-day episode from a LOCKED OASIS",         roles: [IntakeCoordinator],                          code: 201, input: [source_oasis_id],                                                   output: Episode,           side_effects: [create paired PDGMClaim, compute provisional_payment] }
  - { method: GET,    path: "/episodes/{episodeId}",                              description: "Get an episode",                                    roles: [IntakeCoordinator, FieldClinician, BillingSpecialist, PlatformAdmin], code: 200, input: [],                                                       output: Episode,           side_effects: [] }
  - { method: GET,    path: "/episodes",                                          description: "List episodes with filters",                        roles: [BillingSpecialist, IntakeCoordinator, PlatformAdmin], code: 200, input: ["patient_id?", "status?", "limit?", "offset?"],                     output: "Episode[]",       side_effects: [] }
  - { method: POST,   path: "/episodes/{episodeId}/close",                        description: "Close an episode; finalizes PDGMClaim",             roles: [BillingSpecialist],                          code: 200, input: [],                                                                  output: Episode,           side_effects: [recompute pdgm_final_payment + total_mileage_reimbursement; PDGMClaim PENDING -> FINALIZED] }

  # ----- Visit -----
  - { method: POST,   path: "/episodes/{episodeId}/visits",                       description: "Schedule a visit",                                  roles: [IntakeCoordinator],                          code: 201, input: [clinician_id, visit_type, visit_date, start_minute, end_minute],     output: Visit,             side_effects: [] }
  - { method: GET,    path: "/episodes/{episodeId}/visits",                       description: "List visits on an episode",                         roles: [IntakeCoordinator, FieldClinician, BillingSpecialist], code: 200, input: ["status?", "clinician_id?", "limit?", "offset?"],                  output: "Visit[]",         side_effects: [] }
  - { method: GET,    path: "/visits/{visitId}",                                  description: "Get a visit",                                       roles: [IntakeCoordinator, FieldClinician, BillingSpecialist], code: 200, input: [],                                                                  output: Visit,             side_effects: [] }
  - { method: POST,   path: "/visits/{visitId}/complete",                         description: "Mark a visit complete",                             roles: [FieldClinician],                             code: 200, input: [],                                                                  output: Visit,             side_effects: [] }
  - { method: POST,   path: "/visits/{visitId}/cancel",                           description: "Cancel a scheduled visit",                          roles: [IntakeCoordinator],                          code: 200, input: [],                                                                  output: Visit,             side_effects: [] }

  # ----- Mileage -----
  - { method: POST,   path: "/visits/{visitId}/mileage",                          description: "Record mileage for a completed visit",              roles: [FieldClinician],                             code: 201, input: [miles_driven],                                                      output: MileageLog,        side_effects: [compute mileage_reimbursement] }
  - { method: GET,    path: "/visits/{visitId}/mileage",                          description: "List mileage entries for a visit",                  roles: [FieldClinician, BillingSpecialist],          code: 200, input: [],                                                                  output: "MileageLog[]",    side_effects: [] }

  # ----- PDGMClaim -----
  - { method: GET,    path: "/episodes/{episodeId}/claim",                        description: "Get the PDGMClaim for an episode",                  roles: [BillingSpecialist, IntakeCoordinator],      code: 200, input: [],                                                                  output: PDGMClaim,         side_effects: [] }

  # ----- Test-driving endpoints (clock + sweep) -----
  - { method: POST,   path: "/_clock/advance",                                    description: "Advance ClockState.current_date to a target ISO date (>= current)", roles: [PlatformAdmin], code: 200, input: [target_date], output: ClockState, side_effects: [] }
  - { method: GET,    path: "/_clock",                                            description: "Read current ClockState",                           roles: [PlatformAdmin, IntakeCoordinator, BillingSpecialist, FieldClinician], code: 200, input: [],                                              output: ClockState,        side_effects: [] }
  - { method: POST,   path: "/_sweep/expire-episodes",                            description: "Run the system sweep that expires abandoned episodes (Episode end_date + 7 < current_date)", roles: [PlatformAdmin], code: 200, input: [], output: "Episode[]", side_effects: [Episode OPEN -> EXPIRED, child Visit SCHEDULED -> CANCELLED, PDGMClaim PENDING -> FINALIZED] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # Auth / access
  - { id: ERR_AUTH_MISSING,                http: 401, condition: "X-User-Role or X-User-ID header missing or malformed" }
  - { id: ERR_FORBIDDEN,                   http: 403, condition: "Authenticated role not permitted for endpoint per §1.7" }

  # Existence
  - { id: ERR_NOT_FOUND,                   http: 404, condition: "A path-parameter resource does not exist" }

  # State
  - { id: ERR_OASIS_NOT_DRAFT,             http: 409, condition: "Lock attempted on an OASIS whose status != DRAFT" }
  - { id: ERR_OASIS_NOT_LOCKED,            http: 409, condition: "Episode open attempted with a source_oasis whose status != LOCKED" }
  - { id: ERR_EPISODE_NOT_OPEN,            http: 409, condition: "Mutation requires Episode.status == OPEN but it is not" }
  - { id: ERR_VISIT_NOT_SCHEDULED,         http: 409, condition: "Complete or cancel attempted on a Visit whose status != SCHEDULED" }
  - { id: ERR_MILEAGE_VISIT_NOT_COMPLETED, http: 409, condition: "Mileage record attempted on a Visit whose status != COMPLETED" }

  # Safety / compliance
  - { id: ERR_CLINICIAN_LICENSE_EXPIRED,   http: 422, condition: "Clinician.license_expiration_date <= visit_date" }
  - { id: ERR_CLINICIAN_NOT_AVAILABLE,     http: 422, condition: "Clinician.status != AVAILABLE at scheduling time" }
  - { id: ERR_DISCIPLINE_MISMATCH,         http: 422, condition: "Requested visit_type does not equal Clinician.discipline" }
  - { id: ERR_RECERT_WINDOW_VIOLATION,     http: 422, condition: "Recertification OASIS locked outside [prior_episode.recert_due_date, prior_episode.end_date]" }

  # Temporal / referential
  - { id: ERR_VISIT_OUTSIDE_EPISODE,       http: 422, condition: "Requested visit_date outside [Episode.start_date, Episode.end_date]" }
  - { id: ERR_VISIT_TIME_INVALID,          http: 422, condition: "end_minute <= start_minute, or either is out of [0,1439]" }
  - { id: ERR_CLINICIAN_DOUBLE_BOOKED,     http: 409, condition: "Another non-CANCELLED visit on the same clinician overlaps the requested half-open time window on the same visit_date" }
  - { id: ERR_OASIS_ALREADY_USED,          http: 409, condition: "Source OASIS already opened another Episode" }
  - { id: ERR_PATIENT_HAS_OPEN_EPISODE,    http: 409, condition: "Patient already has an Episode with status == OPEN" }

  # Fiscal / quota
  - { id: ERR_HHA_HOURS_EXCEEDED,          http: 422, condition: "Scheduling this HHA visit would push consumed HHA hours beyond the OASIS-ordered cap" }

  # Constraints
  - { id: ERR_MILEAGE_NOT_POSITIVE,        http: 422, condition: "miles_driven <= 0" }
  - { id: ERR_VERSION_CONFLICT,            http: 409, condition: "Submitted version does not equal server's current version" }
  - { id: ERR_CLOCK_BACKWARDS,             http: 422, condition: "POST /_clock/advance target_date < current_date" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: IntakeCoordinator
    description: "Owns patient intake, OASIS authoring/locking, episode opening, visit scheduling, and visit cancellation."
    identity: "opaque"
    exclusive_operations:
      - "POST /patients"
      - "POST /patients/{patientId}/oasis"
      - "POST /patients/{patientId}/oasis/{oasisId}/lock"
      - "POST /patients/{patientId}/episodes"
      - "POST /episodes/{episodeId}/visits"
      - "POST /visits/{visitId}/cancel"
    shared_operations:
      - "GET /patients, GET /patients/{patientId}, PATCH /patients/{patientId}"
      - "GET /clinicians, GET /clinicians/{clinicianId}"
      - "GET /patients/{patientId}/oasis/{oasisId}"
      - "GET /episodes, GET /episodes/{episodeId}"
      - "GET /episodes/{episodeId}/visits, GET /visits/{visitId}"
      - "GET /episodes/{episodeId}/claim"
      - "GET /_clock"

  - name: FieldClinician
    description: "Performs visits and records mileage. Identity binds X-User-ID to a Clinician.id; ownership of visit-completion is enforced against Visit.clinician_id."
    identity: "entity_backed:Clinician"
    exclusive_operations:
      - "POST /visits/{visitId}/complete"
      - "POST /visits/{visitId}/mileage"
    shared_operations:
      - "GET /clinicians/{clinicianId}"
      - "GET /patients/{patientId}"
      - "GET /episodes/{episodeId}, GET /episodes/{episodeId}/visits, GET /visits/{visitId}"
      - "GET /visits/{visitId}/mileage"
      - "GET /_clock"

  - name: BillingSpecialist
    description: "Closes episodes and reads claims and mileage for billing."
    identity: "opaque"
    exclusive_operations:
      - "POST /episodes/{episodeId}/close"
    shared_operations:
      - "GET /patients, GET /patients/{patientId}"
      - "GET /episodes, GET /episodes/{episodeId}"
      - "GET /episodes/{episodeId}/visits, GET /visits/{visitId}"
      - "GET /visits/{visitId}/mileage"
      - "GET /episodes/{episodeId}/claim"
      - "GET /patients/{patientId}/oasis/{oasisId}"
      - "GET /_clock"

  - name: PlatformAdmin
    description: "Configures clinicians and operates clock/sweep test-driving endpoints."
    identity: "opaque"
    exclusive_operations:
      - "POST /clinicians"
      - "PATCH /clinicians/{clinicianId}"
      - "POST /_clock/advance"
      - "POST /_sweep/expire-episodes"
    shared_operations:
      - "GET /patients, GET /patients/{patientId}, PATCH /patients/{patientId}"
      - "GET /clinicians, GET /clinicians/{clinicianId}"
      - "GET /episodes, GET /episodes/{episodeId}"
      - "GET /_clock"
