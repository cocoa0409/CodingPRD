          rationale: "ERR_ELECTION_NOT_WITHDRAWABLE winning over ERR_ELECTION_WINDOW_CLOSED is exactly that instance's assertion."
      - name: corner_extension_overlap_versus_budget_priority_pair
        claim_type: Priority conflict
        grounds: ["validations[priority=32]", "validations[priority=34]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / extension_overlap_and_over_budget_constraint_beats_fiscal
          rationale: "ERR_EXTENSION_WINDOW_OVERLAP winning over ERR_EXTENSION_BUDGET_EXCEEDED, plus the exactly-90-day pass, are asserted there."
      - name: corner_impasse_good_faith_meeting_minimum
        claim_type: Violation → Error
        grounds: ["validations[priority=23]", "errors.ERR_GOOD_FAITH_NOT_SATISFIED"]
        excluded_because:
          difficulty_instance: boundary_precision_check / impasse_good_faith_meeting_count_exactly_three_satisfies
