# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3199_fare_prediction_price_freeze_booking_guarantee_products
#
# Every instance grounds in §1.1–§1.7 of SCAFFOLD.yaml. Every rule_id below is
# verbatim from SKILL.md §0.5 and carries 2 instances, 18 instances total.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: dual_variant_claim_transaction_value_market_vs_arrival
        grounds:
          - calculations.guarantee_claim_settlement
          - entities.GuaranteeClaim.fields.transaction_value_pre_cents
          - entities.GuaranteeClaim.fields.transaction_value_final_cents
          - endpoints.POST_/fare/claims/{claim_id}/settlements
        distinguishing_aspect: |
          For one identical claim the same formula evaluated on market_price_cents and on the arrival
          observation's fare produces two different transaction values, so the settlement response must
          switch from 17526.40 to 17616.40 rather than re-report the filing-time figure.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Route R1 (base 8900) carries a day-0 curve [8200,9000,9600,11200,12800]. Itinerary I1 departs 2026-10-01T00:00:00Z. Freeze F1 on I1 is FROZEN with manifest 8900 and cap 12460. A claim C1 is FILED while the itinerary's latest observation is 14000, recording market_price_cents 16500 on the claim row; a later 15000 observation arrives before settlement, and the market price at filing is NOT rewritten by it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fare/routes"
              payload: { origin_airport: "SFO", destination_airport: "JFK", flight_number: "HA101", region: "WEST", base_fare_cents: 8900, fare_band_cents: [7000, 8000, 9000, 10000, 11000], peak_price_day_index: 4, seats_left: 9, disclosure_headline: "Fare products are optional and separate from the ticket" }
              as: PlatformAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /fare/demand-curves"
              payload: { route_id: "${r1_id}", price_date: "2026-09-01T00:00:00Z", each_day_prices_cents: [8200, 9000, 9600, 11200, 12800], seats_left_at_each_day: [9, 8, 6, 4, 2] }
              as: OpsAgent
            - call: "POST /fare/itineraries"
              payload: { route_id: "${r1_id}", departure_date: "2026-10-01T00:00:00Z", traveler_user_id: "tv-mara" }
              as: Traveler
              captures: { i1_id: $.data.id, i1_version: $.data.version }
            - call: "POST /fare/itineraries/${i1_id}/price-freezes"
              payload: { deposit_cents: 250, disclosure_version: 1, disclosure_acknowledged: true, expected_itinerary_version: "${i1_version}" }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { f1_id: $.data.id, f1_version: $.data.version }
            - call: "POST /fare/price-freezes/${f1_id}/activations"
              payload: { expected_freeze_version: "${f1_version}" }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { f1_v2: $.data.version }
            - call: "POST /fare/price-freezes/${f1_id}/activations"
              payload: { expected_freeze_version: "${f1_v2}" }
              as: Traveler
              as_user_id: "tv-mara"
            - call: "POST /fare/price-observations"
              payload: { route_id: "${r1_id}", itinerary_id: "${i1_id}", fare_cents: 14000, seats_left: 4 }
              as: OpsAgent
            - call: "POST /fare/claims"
              payload: { freeze_id: "${f1_id}", market_price_cents: 16500 }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { c1_id: $.data.id, c1_version: $.data.version }
            - call: "POST /fare/claims/${c1_id}/reviews"
              payload: { review_note: "conformity check" }
              as: ClaimsAdjuster
              as_user_id: "ca-pavel"
              captures: { c1_v2: $.data.version }
            - call: "POST /fare/claims/${c1_id}/approvals"
              payload: { approval_note: "conformant" }
              as: ClaimsAdjuster
              as_user_id: "ca-rosa"
              captures: { c1_v3: $.data.version }
          trigger:
            - call: "POST /fare/price-observations"
              payload: { route_id: "${r1_id}", itinerary_id: "${i1_id}", fare_cents: 15000, seats_left: 4 }
              as: OpsAgent
            - call: "POST /fare/claims/${c1_id}/settlements"
              payload: { expected_claim_version: "${c1_v3}" }
              as: ClaimsAdjuster
              as_user_id: "ca-ingrid"
          assert:
            - "the reviewing and approving adjusters differ, and ca-ingrid records the settlement, so the priority 7 gate passes"
            - "GuaranteeClaim.${c1_id}.transaction_value_pre_cents == 17526.40 and transaction_value_final_cents == 17616.40"
            - "GuaranteeClaim.${c1_id}.transaction_value_cents == 17526.40 before settlement and == 17616.40 after it"
            - "GuaranteeClaim.${c1_id}.claim_status == SETTLED_WITH_PURCHASE"
            - "GuaranteeClaim.${c1_id}.payout_cents == 9120.00 and equals PriceFreeze.${f1_id}.capped_impact_cents, so the conformity test passes"

      - name: dual_variant_protection_premium_member_versus_standalone
        grounds:
          - calculations.protection_pricing
          - state_machines.ProtectionProduct.QUOTED_FROZEN_to_QUOTED_ACTIVE
          - entities.ProtectionProduct.fields.disruption_probability
          - entities.ProtectionProduct.fields.bonus_days_total
        distinguishing_aspect: |
          On one identical itinerary and one identical client-declared probability of 0.25 the
          hedged-share-rate variant and the declared-probability variant produce different premiums
          (175.80 against 73.25), which is the same-data, different-subject divergence Rule 1 requires.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Route R1 with curve day-0 price 8200 so each_day_disruption_fare_cents is 1172.00. Itinerary I1 on R1 carries freeze F1, frozen against the route high-water mark of 8236 so its hedged share rate is 0.60 (hedged 660.00 of exposure 1100.00). Itinerary I2 on the same route carries no freeze. Both itineraries are otherwise identical."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fare/routes"
              payload: { origin_airport: "SFO", destination_airport: "JFK", flight_number: "HA101", region: "WEST", base_fare_cents: 8236, fare_band_cents: [7000, 8000, 9000, 10000, 11000], peak_price_day_index: 4, seats_left: 9, disclosure_headline: "Fare products are optional and separate from the ticket" }
              as: PlatformAdmin
              captures: { r1_id: $.data.id, r1_version: $.data.version }
            - call: "POST /fare/demand-curves"
              payload: { route_id: "${r1_id}", price_date: "2026-09-01T00:00:00Z", each_day_prices_cents: [8200, 9000, 9600, 11200, 12800], seats_left_at_each_day: [9, 8, 6, 4, 2] }
              as: OpsAgent
            - call: "PATCH /fare/routes/${r1_id}"
              payload: { base_fare_cents: 8900 }
              as: PlatformAdmin
            - call: "POST /fare/itineraries"
              payload: { route_id: "${r1_id}", departure_date: "2026-10-01T00:00:00Z", traveler_user_id: "tv-mara" }
              as: Traveler
              captures: { i1_id: $.data.id, i1_version: $.data.version }
            - call: "POST /fare/itineraries/${i1_id}/price-freezes"
              payload: { deposit_cents: 250, disclosure_version: 1, disclosure_acknowledged: true, expected_itinerary_version: "${i1_version}" }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { f1_id: $.data.id, f1_version: $.data.version }
            - call: "POST /fare/price-freezes/${f1_id}/activations"
              payload: { expected_freeze_version: "${f1_version}" }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { f1_v2: $.data.version }
            - call: "POST /fare/price-freezes/${f1_id}/activations"
              payload: { expected_freeze_version: "${f1_v2}" }
              as: Traveler
              as_user_id: "tv-mara"
            - call: "POST /fare/price-observations"
              payload: { route_id: "${r1_id}", itinerary_id: "${i1_id}", fare_cents: 10000, seats_left: 6 }
              as: OpsAgent
            - call: "POST /fare/protections"
              payload: { itinerary_id: "${i1_id}", product_type: "CANCELLATION", cancellation_disruption_probability: 0.25, freeze_id: "${f1_id}", disclosure_version: 1, disclosure_acknowledged: true }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { pm_id: $.data.id , p_v: $.data.version }
            - call: "POST /fare/itineraries"
              payload: { route_id: "${r1_id}", departure_date: "2026-10-01T00:00:00Z", traveler_user_id: "tv-mara" }
              as: Traveler
              captures: { i2_id: $.data.id }
            - call: "POST /fare/protections"
              payload: { itinerary_id: "${i2_id}", product_type: "CANCELLATION", cancellation_disruption_probability: 0.25, disclosure_version: 1, disclosure_acknowledged: true }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { ps_id: $.data.id , p_v: $.data.version }
          trigger:
            - call: "POST /fare/protections/${pm_id}/activations"
              payload: { expected_protection_version: "${p_v}" }
              as: Traveler
              as_user_id: "tv-mara"
          assert:
            - "ProtectionProduct.${pm_id}.disruption_probability == 0.60 and quoted_status == QUOTED_ACTIVE"
            - "ProtectionProduct.${pm_id}.quote_probable_loss_cents == 703.20 and premium_cents == 175.80"
            - "ProtectionProduct.${ps_id}.disruption_probability == 0.25 and premium_cents == 73.25"
            - "ProtectionProduct.${pm_id}.bonus_days_total == 0 and ProtectionProduct.${ps_id}.bonus_days_total == 2"
            - "the two products come from identical itineraries and an identical declared probability, so the 102.55 premium gap is attributable only to the covering freeze"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: combinatorial_change_redemption_rate_metric_versus_duration_metric
        grounds:
          - calculations.protect_change_redemption
          - state_machines.ProtectionProduct.ACTIVE_to_REBOOKED
          - state_machines.ChangeEvent.HELD_to_SETTLED
          - entities.ProtectionProduct.fields.duration_consumed_days
        distinguishing_aspect: |
          One product's day consumption is measured on a rate metric (ceil(premium / disruption fare),
          capped at bonus_days_total) while another's is measured on the duration metric
          (0/1/2/3/3+ceil((d-3)/2)), and the two modes disagree for the same itinerary — a 12-day shift
          consumes 8 days, not 12, while an 825-cent premium against an 11400-cent fare consumes 1 day
          rather than 8.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Route R2 (base 13200) with a flat curve [9000,9000,9000,9000,9000] so each_day_disruption_fare_cents is 1286.10. Itinerary I3 on R2 departs 2026-12-01T00:00:00Z. A CHANGE protection P3 with bonus_days_total 2 is ACTIVE on I3, and an option OPT1 departing 2026-12-13T00:00:00Z has been selected and held."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fare/routes"
              payload: { origin_airport: "ORD", destination_airport: "LHR", flight_number: "HA707", region: "MIDWEST", base_fare_cents: 13200, fare_band_cents: [9000, 12000, 15000, 17000, 19000], peak_price_day_index: 0, seats_left: 6, disclosure_headline: "Fare products are optional and separate from the ticket" }
              as: PlatformAdmin
              captures: { r2_id: $.data.id }
            - call: "POST /fare/demand-curves"
              payload: { route_id: "${r2_id}", price_date: "2026-09-01T00:00:00Z", each_day_prices_cents: [9000, 9000, 9000, 9000, 9000], seats_left_at_each_day: [6, 6, 6, 6, 6] }
              as: OpsAgent
            - call: "POST /fare/itineraries"
              payload: { route_id: "${r2_id}", departure_date: "2026-12-01T00:00:00Z", traveler_user_id: "tv-otis" }
              as: Traveler
              captures: { i3_id: $.data.id }
            - call: "POST /fare/protections"
              payload: { itinerary_id: "${i3_id}", product_type: "CHANGE", cancellation_disruption_probability: 0.70, disclosure_version: 1, disclosure_acknowledged: true }
              as: Traveler
              as_user_id: "tv-otis"
              captures: { p3_id: $.data.id , p_v: $.data.version }
            - call: "POST /fare/protections/${p3_id}/activations"
              payload: { expected_protection_version: "${p_v}" }
              as: Traveler
              as_user_id: "tv-otis"
            - call: "POST /fare/change-events"
              payload: { protection_id: "${p3_id}", new_departure_date: "2026-12-13T00:00:00Z", gap_direction: "ORIGIN_DIRECTION" }
              as: Traveler
              as_user_id: "tv-otis"
              captures: { ce_id: $.data.id }
            - call: "POST /fare/rebooking-options"
              payload: { change_event_id: "${ce_id}", departure_date: "2026-12-13T00:00:00Z", option_fare_cents: 13200 }
              as: Traveler
              as_user_id: "tv-otis"
              captures: { opt1_id: $.data.id }
            - call: "POST /fare/change-events/${ce_id}/selections"
              payload: { option_id: "${opt1_id}" }
              as: Traveler
              as_user_id: "tv-otis"
            - call: "POST /fare/rebooking-options/${opt1_id}/acceptances"
              payload: {}
              as: Traveler
              as_user_id: "tv-otis"
          trigger:
            - call: "POST /fare/change-events/${ce_id}/settlements"
              payload: {}
              as: Traveler
              as_user_id: "tv-otis"
          assert:
            - "ChangeEvent.${ce_id}.day_shift == 12 and ChangeEvent.${ce_id}.disruption_days == 8"
            - "ProtectionProduct.${p3_id}.duration_consumed_days == 8 and bonus_days_remaining == -6"
            - "ChangeEvent.${ce_id}.remaining_days == -6 so the settlement is refused at priority 30 with ERR_INSUFFICIENT_BONUS_DAYS"
            - "the same 12-day shift measured on the rate metric against an 11400-cent fare would consume ceil(825/114) = 8 days before capping and 2 days after capping, so the two modes are not interchangeable"

      - name: combinatorial_insurance_tier_boundary_straddle
        grounds:
          - calculations.insurance_tier_ceiling
          - entities.PriceFreeze.fields.guaranteed_ceiling_cents
          - entities.Route.fields.peak_day_demand_multiplier
          - calculations.guarantee_claim_settlement
        distinguishing_aspect: |
          Because the cap is 1.4x the manifest, the manifest-priced and cap-priced readings of the
          strict-< tier ladder straddle the 200000-cent boundary for a 15000-cent manifest, and the
          scaffold's pinned evaluation order (manifest ceiling, then cap ceiling, then maximum) is what
          fixes the answer at 50000 rather than 30000.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Route R4 with base_fare_cents 14286 so the cap is round_half_up(1.4 x 14286) = 20000, sitting exactly on the strict-< boundary of the 200000-cent tier. Itinerary I7 departs 2026-11-01T00:00:00Z. Route R5 with base_fare_cents 15000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fare/routes"
              payload: { origin_airport: "SEA", destination_airport: "NRT", flight_number: "HA505", region: "WEST", base_fare_cents: 14286, fare_band_cents: [9000, 12000, 15000, 17000, 19000], peak_price_day_index: 0, seats_left: 5, disclosure_headline: "Fare products are optional and separate from the ticket" }
              as: PlatformAdmin
              captures: { r4_id: $.data.id }
            - call: "POST /fare/routes"
              payload: { origin_airport: "SEA", destination_airport: "HND", flight_number: "HA506", region: "WEST", base_fare_cents: 15000, fare_band_cents: [9000, 12000, 15000, 17000, 19000], peak_price_day_index: 0, seats_left: 5, disclosure_headline: "Fare products are optional and separate from the ticket" }
              as: PlatformAdmin
              captures: { r5_id: $.data.id }
            - call: "POST /fare/itineraries"
              payload: { route_id: "${r4_id}", departure_date: "2026-11-01T00:00:00Z", traveler_user_id: "tv-rae" }
              as: Traveler
              captures: { i7_id: $.data.id, i7_version: $.data.version }
            - call: "POST /fare/itineraries/${i7_id}/price-freezes"
              payload: { deposit_cents: 250, disclosure_version: 1, disclosure_acknowledged: true, expected_itinerary_version: "${i7_version}" }
              as: Traveler
              as_user_id: "tv-rae"
              captures: { f7_id: $.data.id, f7_version: $.data.version }
            - call: "POST /fare/itineraries"
              payload: { route_id: "${r5_id}", departure_date: "2026-11-01T00:00:00Z", traveler_user_id: "tv-rae" }
              as: Traveler
              captures: { i8_id: $.data.id, i8_version: $.data.version }
            - call: "POST /fare/itineraries/${i8_id}/price-freezes"
              payload: { deposit_cents: 250, disclosure_version: 1, disclosure_acknowledged: true, expected_itinerary_version: "${i8_version}" }
              as: Traveler
              as_user_id: "tv-rae"
              captures: { f8_id: $.data.id, f8_version: $.data.version }
          trigger:
            - call: "POST /fare/price-freezes/${f7_id}/activations"
              payload: { expected_freeze_version: "${f7_version}" }
              as: Traveler
              as_user_id: "tv-rae"
            - call: "POST /fare/price-freezes/${f8_id}/activations"
              payload: { expected_freeze_version: "${f8_version}" }
              as: Traveler
              as_user_id: "tv-rae"
          assert:
            - "PriceFreeze.${f7_id}.manifest_fare_cents == 14286 and cap_cents == 20000"
            - "PriceFreeze.${f7_id}.firm_tier_ceiling_cents == 30000 and cap_tier_ceiling_cents == 20000 and guaranteed_ceiling_cents == 30000"
            - "PriceFreeze.${f8_id}.cap_tier_ceiling_cents == 50000, so guaranteed_ceiling_cents == 50000 — a 14-cent manifest difference changes the guarantee by 2959 cents"
            - "the straddle is the pinned consequence of evaluating insurance_tier_ceiling on the manifest and on the cap and then taking the maximum, not of comparing the outcome dollars directly"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: nonlinear_watch_cyclic_notification_cycle
        grounds:
          - state_machines.WatchSubscription.NOTIFIED_to_WAIT
          - state_machines.WatchSubscription.WAIT_to_NOTIFIED
          - state_machines.WatchSubscription.NOTIFIED_to_NOTIFIED
          - state_machines.WatchSubscription.ARMED_to_NOTIFIED
        distinguishing_aspect: |
          The watch machine is cyclic rather than a pipeline: ARMED -> NOTIFIED -> WAIT -> NOTIFIED is a
          legal round trip whose only difference from the first pass is the cooldown gate, and the
          return arc is a notify-again transition rather than a re-arm.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Route R1 with curve day-0 price 8200, itinerary I1 observed at 10000 so fare_tier_ceiling_cents (30000) exceeds the fare and every pass reads WAIT, and an ARMED watch W1 on I1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fare/routes"
              payload: { origin_airport: "SFO", destination_airport: "JFK", flight_number: "HA101", region: "WEST", base_fare_cents: 8900, fare_band_cents: [7000, 8000, 9000, 10000, 11000], peak_price_day_index: 4, seats_left: 9, disclosure_headline: "Fare products are optional and separate from the ticket" }
              as: PlatformAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /fare/demand-curves"
              payload: { route_id: "${r1_id}", price_date: "2026-09-01T00:00:00Z", each_day_prices_cents: [8200, 9000, 9600, 11200, 12800], seats_left_at_each_day: [9, 8, 6, 4, 2] }
              as: OpsAgent
            - call: "POST /fare/itineraries"
              payload: { route_id: "${r1_id}", departure_date: "2026-10-01T00:00:00Z", traveler_user_id: "tv-mara" }
              as: Traveler
              captures: { i1_id: $.data.id, i1_version: $.data.version }
            - call: "POST /fare/price-observations"
              payload: { route_id: "${r1_id}", itinerary_id: "${i1_id}", fare_cents: 10000, seats_left: 6 }
              as: OpsAgent
            - call: "POST /fare/itineraries/${i1_id}/watch-subscription"
              payload: { expected_itinerary_version: "${i1_version}" }
              as: Traveler
              as_user_id: "tv-mara"
              captures: { w1_id: $.data.id }
          trigger:
            - call: "POST /fare/watch-subscriptions/${w1_id}/notifications"
              payload: { request_source: "MEMBER" }
              as: Traveler
              as_user_id: "tv-mara"
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-09-01T07:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fare/watch-subscriptions/${w1_id}/notifications"
              payload: { request_source: "MEMBER" }
              as: Traveler
              as_user_id: "tv-mara"
            - call: "POST /fare/watch-subscriptions/${w1_id}/notifications"
              payload: { request_source: "MEMBER" }
              as: Traveler
              as_user_id: "tv-mara"
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-09-01T14:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fare/watch-subscriptions/${w1_id}/notifications"
              payload: { request_source: "MEMBER" }
              as: Traveler
              as_user_id: "tv-mara"
          assert:
            - "WatchSubscription.${w1_id}.notification_status == NOTIFIED after pass 1 and == WAIT after pass 2"
            - "WatchSubscription.${w1_id}.notification_status == WAIT after pass 3, because the 07:00 pass is inside the six-hour cooldown stamped by pass 1 and the suppression is inclusive at exactly cooldown_until"
            - "WatchSubscription.${w1_id}.cooldown_suppressed == true after pass 3 and == false after pass 4"
            - "WatchSubscription.${w1_id}.notification_attempt_count == 4, showing the same state was entered twice"
            - "Itinerary.${i1_id}.travel_status == WATCHING throughout, so the cycle never re-enters PLANNED"

      - name: nonlinear_change_event_hold_lapse_revert_then_terminal
        grounds:
          - state_machines.ChangeEvent.OPTION_SELECTED_to_HELD
          - state_machines.ChangeEvent.HELD_to_OPTION_SELECTED
          - state_machines.ChangeEvent.HELD_to_SETTLED
          - state_machines.RebookingOption.HELD_to_EXPIRED
        distinguishing_aspect: |
          The change machine both loops (OPTION_SELECTED -> HELD -> OPTION_SELECTED, the hold-lapse
          revert) and branches (a second lapse on the same event ignores the loop and settles instead),
          so the same trigger produces a revert on its first firing and a terminal transition on its
          second.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Route R2, itinerary I3 on it, ACTIVE CHANGE protection P3, change event CE1 with new_departure_date 2026-12-05T00:00:00Z, and option OPT1 departing 2026-12-05T00:00:00Z at 12300 selected and held with hold_expires_at 2026-09-02T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fare/routes"
