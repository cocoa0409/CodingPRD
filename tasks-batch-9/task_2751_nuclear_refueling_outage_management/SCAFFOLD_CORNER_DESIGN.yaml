              payload: { cycle_length_mwd_mtu: 18000, fresh_assembly_count: 88, discharge_assembly_count: 80, expected_outage_version: "${o_v1}" }
              as: ReactorEngineer
              as_user_id: "re-alpha"
              captures: { clp_id: "$.data.id" }
            - call: "POST /core-load-patterns/${clp_id}/approve"
              payload: {}
              as: ReactorEngineer
              as_user_id: "re-beta"
            - call: "POST /outages/${o_id}/work-orders"
              payload: { wo_type: "MAINTENANCE", title: "Feedwater pump overhaul", estimated_hours: 10, estimated_cost_usd: 1000, estimated_dose_mrem: 0 }
              as: OutagePlanner
              captures: { wo_id: "$.data.id" }
            - call: "POST /work-orders/${wo_id}/plan"
              payload: {}
              as: OutagePlanner
            - call: "POST /work-orders/${wo_id}/approve-scope"
              payload: {}
              as: OutageDirector
            - call: "GET /outages/${o_id}"
              payload: {}
              as: OutageDirector
              captures: { o_v_before: "$.data.version" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T06:00:00Z" }
              as: StationAdmin
          trigger:
            - call: "POST /outages/${o_id}/lock-scope"
