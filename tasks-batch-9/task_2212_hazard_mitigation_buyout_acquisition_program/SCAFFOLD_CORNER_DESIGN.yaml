      - name: a_second_case_for_the_same_household_on_one_parcel_is_refused
        claim_type: violation_to_error
        grounds:
          - validations.priority_71
          - entities.RelocationCase.fields.household_reference
        distinguishing_aspect: |
          Uniqueness is scoped to the parcel and checked at creation, before any interval exists, so
          the second case on the SAME parcel with household_reference HH-DUP returns 409
