# =============================================================================
# §1.9 Scaffold Corner Design — task_3334 adjustable bed / sleep data
# Breadth probe: every testable claim §1.1–§1.7 declares that §1.8 does not
# already exercise. §1.8-covered corners appear as excluded_because stubs.
# Shared convention: every instance pins the logical clock first; the startup
# default 2026-09-01T00:00:00Z is asserted once in entities section.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: store_create_returns_defaults_and_server_fields
        claim_type: Creation
        grounds:
          - entities.Store
          - endpoints.POST_/sleep/stores
        distinguishing_aspect: "A store created without default_window_capacity_slots comes back 201 with the default 4 applied, status-bearing server fields id/created_at/updated_at/version present, and version == 1 — proving defaults and system fields are server-assigned."
        test_recipe:
          setup:
            - "Clock at default 2026-09-01T00:00:00Z (no set call). Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /sleep/stores"
              payload: { name: "Flagship", zone_codes: ["941", "940"] }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Store.${store_id}.default_window_capacity_slots == 4 (default applied)"
            - "Store.${store_id}.version == 1 and created_at == 2026-09-01T00:00:00.000Z (logical clock default, not wall clock)"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: customer_registration_sets_free_tier_entitlements
        claim_type: Computed Fields
        grounds:
          - entities.Customer.fields.entitlements
          - entities.Customer.fields.subscription_tier
          - endpoints.POST_/sleep/customers
        distinguishing_aspect: "Registering a customer computes entitlements [SCORE_BASIC] from the default FREE tier and sets store_credit_cents 0 — client-supplied entitlements or tier values in the payload are rejected/ignored (no such input fields exist)."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. One store."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sleep/stores"
              payload: { name: "S", zone_codes: ["941"] }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
          trigger:
            - call: "POST /sleep/customers"
              payload: { home_store_id: "${store_id}", email: "e@x.com", full_name: "Eve E" }
              as: Anonymous
              captures: { cust_id: $.data.id }
          assert:
            - "Customer.${cust_id}.subscription_tier == FREE and subscription_status == ACTIVE"
            - "Customer.${cust_id}.entitlements == [SCORE_BASIC]"
            - "Customer.${cust_id}.store_credit_cents == 0"

      - name: fit_assessment_recommended_firmness_computed_on_complete
        claim_type: Computed Fields
        grounds:
          - entities.FitAssessment.fields.recommended_firmness
          - calculations.recommended_firmness
        distinguishing_aspect: "SIDE(35) + OVER_230(+10) + FIRM(+10) + partner(-5) = 50 exactly; rounding-to-5 is exercised by a second profile: STOMACH(65) + UNDER_130(-10) + PLUSH(-10) = 45 -> 45, while COMBINATION(50)+BAND_130_230(0)+MEDIUM(0)+partner(-5)=45 — all land on multiples of 5 without clamping."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Store, four catalog models (required categories present), customer."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sleep/stores"
              payload: { name: "S", zone_codes: ["941"] }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /sleep/product-models"
              payload: { sku: "MAT-1", name: "M", category: "MATTRESS", price_cents: 240000, replacement_part_price_cents: 0, warranty_months: 120 }
              as: PlatformAdmin
            - call: "POST /sleep/product-models"
              payload: { sku: "BASE-1", name: "B", category: "ADJUSTABLE_BASE", price_cents: 180000, replacement_part_price_cents: 0, warranty_months: 120 }
              as: PlatformAdmin
            - call: "POST /sleep/product-models"
              payload: { sku: "CHAM-1", name: "C", category: "AIR_CHAMBER", price_cents: 40000, replacement_part_price_cents: 40000, warranty_months: 60 }
              as: PlatformAdmin
            - call: "POST /sleep/product-models"
              payload: { sku: "PUMP-1", name: "P", category: "PUMP", price_cents: 30000, replacement_part_price_cents: 30000, warranty_months: 36 }
              as: PlatformAdmin
            - call: "POST /sleep/customers"
              payload: { home_store_id: "${store_id}", email: "f@x.com", full_name: "Fay F" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /sleep/fit-assessments"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", sleep_position: "SIDE", weight_band: "OVER_230", partner_sleeper: true, preferred_feel: "FIRM" }
              as: SalesAssociate
              captures: { fa_id: $.data.id }
          trigger:
            - call: "POST /sleep/fit-assessments/${fa_id}/complete"
              payload: {}
              as: SalesAssociate
          assert:
            - "FitAssessment.${fa_id}.status == COMPLETED"
            - "FitAssessment.${fa_id}.recommended_firmness == 50"
            - "FitAssessment.${fa_id}.recommended_skus == [\"MAT-1\", \"BASE-1\", \"CHAM-1\", \"PUMP-1\"] (lowest price per required category)"
            - "FitAssessment.${fa_id}.completed_at == 2026-09-01T00:00:00.000Z"

      - name: fit_assessment_supersede_self_reference_transitions_predecessor
        claim_type: Parent Relationships
        grounds:
          - entities.FitAssessment.fields.supersedes_assessment_id
          - state_machines.FitAssessment.COMPLETED_to_SUPERSEDED
        distinguishing_aspect: "The self-referential FK drives a system transition: completing assessment B carrying supersedes_assessment_id = A moves A COMPLETED -> SUPERSEDED, and a SUPERSEDED assessment can no longer back an order (ERR_FIT_ASSESSMENT_MISMATCH)."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Store, four models, customer, completed assessment A."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sleep/stores"
              payload: { name: "S", zone_codes: ["941"] }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /sleep/product-models"
              payload: { sku: "MAT-1", name: "M", category: "MATTRESS", price_cents: 240000, replacement_part_price_cents: 0, warranty_months: 120 }
              as: PlatformAdmin
            - call: "POST /sleep/product-models"
              payload: { sku: "BASE-1", name: "B", category: "ADJUSTABLE_BASE", price_cents: 180000, replacement_part_price_cents: 0, warranty_months: 120 }
              as: PlatformAdmin
            - call: "POST /sleep/product-models"
              payload: { sku: "CHAM-1", name: "C", category: "AIR_CHAMBER", price_cents: 40000, replacement_part_price_cents: 40000, warranty_months: 60 }
              as: PlatformAdmin
            - call: "POST /sleep/product-models"
              payload: { sku: "PUMP-1", name: "P", category: "PUMP", price_cents: 30000, replacement_part_price_cents: 30000, warranty_months: 36 }
              as: PlatformAdmin
            - call: "POST /sleep/customers"
              payload: { home_store_id: "${store_id}", email: "s@x.com", full_name: "Sam S" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /sleep/fit-assessments"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", sleep_position: "BACK", weight_band: "BAND_130_230", partner_sleeper: false, preferred_feel: "MEDIUM" }
              as: SalesAssociate
              captures: { fa_a: $.data.id }
            - call: "POST /sleep/fit-assessments/${fa_a}/complete"
              payload: {}
              as: SalesAssociate
          trigger:
            - call: "POST /sleep/fit-assessments"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", sleep_position: "STOMACH", weight_band: "OVER_230", partner_sleeper: false, preferred_feel: "FIRM", supersedes_assessment_id: "${fa_a}" }
              as: SalesAssociate
              captures: { fa_b: $.data.id }
            - call: "POST /sleep/fit-assessments/${fa_b}/complete"
              payload: {}
              as: SalesAssociate
            - call: "POST /sleep/orders"
              payload: { customer_id: "${cust_id}", fit_assessment_id: "${fa_a}", line_items: [{ sku: "MAT-1", qty: 1 }] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "FitAssessment.${fa_a}.status == SUPERSEDED after B completes"
            - "FitAssessment.${fa_b}.status == COMPLETED and recommended_firmness == 85 (STOMACH 65 + OVER_230 10 + FIRM 10)"
            - "order creation against the SUPERSEDED assessment: status 422 and error_id == ERR_FIT_ASSESSMENT_MISMATCH"
            - "GET /sleep/fit-assessments?supersedes_assessment_id=${fa_a} returns exactly 1 row (B) — reverse reachability of the self-FK"

      - name: order_get_unknown_id_returns_order_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/sleep/orders/{id}
          - errors.ERR_ORDER_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unallocated order id produces the entity-specific 404 ERR_ORDER_NOT_FOUND via the error envelope, not a generic 404."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /sleep/orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_ORDER_NOT_FOUND"
            - "response_type == error and data carries both error_id and message"

      - name: order_create_missing_line_items_returns_validation
        claim_type: Required Fields
        grounds:
          - entities.Order.fields.line_items
          - errors.ERR_VALIDATION
        distinguishing_aspect: "line_items is required input with no default: omitting it yields 400 ERR_VALIDATION, and no Order row is created (list stays empty)."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Customer with completed assessment."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sleep/stores"
              payload: { name: "S", zone_codes: ["941"] }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /sleep/product-models"
              payload: { sku: "MAT-1", name: "M", category: "MATTRESS", price_cents: 240000, replacement_part_price_cents: 0, warranty_months: 120 }
              as: PlatformAdmin
            - call: "POST /sleep/product-models"
              payload: { sku: "BASE-1", name: "B", category: "ADJUSTABLE_BASE", price_cents: 180000, replacement_part_price_cents: 0, warranty_months: 120 }
              as: PlatformAdmin
            - call: "POST /sleep/product-models"
              payload: { sku: "CHAM-1", name: "C", category: "AIR_CHAMBER", price_cents: 40000, replacement_part_price_cents: 40000, warranty_months: 60 }
              as: PlatformAdmin
            - call: "POST /sleep/product-models"
              payload: { sku: "PUMP-1", name: "P", category: "PUMP", price_cents: 30000, replacement_part_price_cents: 30000, warranty_months: 36 }
              as: PlatformAdmin
            - call: "POST /sleep/customers"
              payload: { home_store_id: "${store_id}", email: "m@x.com", full_name: "Mel M" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /sleep/fit-assessments"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", sleep_position: "BACK", weight_band: "BAND_130_230", partner_sleeper: false, preferred_feel: "MEDIUM" }
              as: SalesAssociate
              captures: { fa_id: $.data.id }
            - call: "POST /sleep/fit-assessments/${fa_id}/complete"
              payload: {}
              as: SalesAssociate
          trigger:
            - call: "POST /sleep/orders"
              payload: { customer_id: "${cust_id}", fit_assessment_id: "${fa_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_VALIDATION"
            - "GET /sleep/orders?customer_id=${cust_id} returns 0 rows"

      - name: device_customer_id_denormalized_from_order
        claim_type: Computed Fields
        grounds:
          - entities.Device.fields.customer_id
          - endpoints.POST_/sleep/devices
        distinguishing_aspect: "Device.customer_id is computed (denormalized from the order) — the create payload cannot set it, and it always equals Order.customer_id even though the device payload never names a customer."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Confirmed order for customer."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sleep/stores"
              payload: { name: "S", zone_codes: ["941"] }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /sleep/product-models"
              payload: { sku: "MAT-1", name: "M", category: "MATTRESS", price_cents: 240000, replacement_part_price_cents: 0, warranty_months: 120 }
              as: PlatformAdmin
            - call: "POST /sleep/customers"
              payload: { home_store_id: "${store_id}", email: "d@x.com", full_name: "Dan D" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /sleep/fit-assessments"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", sleep_position: "BACK", weight_band: "BAND_130_230", partner_sleeper: false, preferred_feel: "MEDIUM" }
              as: SalesAssociate
              captures: { fa_id: $.data.id }
            - call: "POST /sleep/fit-assessments/${fa_id}/complete"
              payload: {}
              as: SalesAssociate
            - call: "POST /sleep/orders"
              payload: { customer_id: "${cust_id}", fit_assessment_id: "${fa_id}", line_items: [{ sku: "MAT-1", qty: 1 }] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /sleep/orders/${order_id}/confirm"
              payload: { payment_method: "PAY_IN_FULL" }
              as: SalesAssociate
          trigger:
            - call: "POST /sleep/devices"
              payload: { order_id: "${order_id}", kind: "PUMP", serial_number: "SN-P9", firmware_version: "2.1" }
              as: DeliveryTechnician
              captures: { dev_id: $.data.id }
          assert:
            - "Device.${dev_id}.customer_id == ${cust_id} (denormalized, not client-supplied)"
            - "Device.${dev_id}.pairing_status == UNPAIRED and connectivity == OFFLINE and final_nights_count == 0"
            - "GET /sleep/devices?customer_id=${cust_id} returns exactly 1 row (reverse reachability of both device FKs)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: complete_visit_from_terminal_verified_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.DeliveryVisit
          - errors.ERR_VISIT_ALREADY_COMPLETED
        distinguishing_aspect: "A VERIFIED (terminal) visit rejects a second complete with 409 ERR_VISIT_ALREADY_COMPLETED; no side effects fire (order stays DELIVERED, no duplicate trial_verified_at mutation)."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Delivered order via verified visit V."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sleep/stores"
              payload: { name: "S", zone_codes: ["941"] }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /sleep/product-models"
              payload: { sku: "MAT-1", name: "M", category: "MATTRESS", price_cents: 240000, replacement_part_price_cents: 0, warranty_months: 120 }
              as: PlatformAdmin
            - call: "POST /sleep/customers"
              payload: { home_store_id: "${store_id}", email: "t@x.com", full_name: "Tom T" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /sleep/fit-assessments"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", sleep_position: "BACK", weight_band: "BAND_130_230", partner_sleeper: false, preferred_feel: "MEDIUM" }
              as: SalesAssociate
              captures: { fa_id: $.data.id }
            - call: "POST /sleep/fit-assessments/${fa_id}/complete"
              payload: {}
              as: SalesAssociate
            - call: "POST /sleep/orders"
              payload: { customer_id: "${cust_id}", fit_assessment_id: "${fa_id}", line_items: [{ sku: "MAT-1", qty: 1 }] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /sleep/orders/${order_id}/confirm"
              payload: { payment_method: "PAY_IN_FULL" }
              as: SalesAssociate
            - call: "POST /sleep/delivery-windows"
              payload: { store_id: "${store_id}", team_id: "T1", window_start: "2026-09-02T08:00:00Z", window_end: "2026-09-02T12:00:00Z", capacity_slots: 4 }
              as: PlatformAdmin
              captures: { win_id: $.data.id }
            - call: "POST /sleep/delivery-visits"
              payload: { order_id: "${order_id}", delivery_window_id: "${win_id}" }
              as: SalesAssociate
              captures: { visit_id: $.data.id }
            - call: "POST /sleep/devices"
              payload: { order_id: "${order_id}", kind: "BASE", serial_number: "SN-T1", firmware_version: "1.0" }
              as: DeliveryTechnician
              captures: { dev_id: $.data.id }
            - call: "POST /sleep/devices/${dev_id}/pair"
              payload: { target_status: "PAIRED", connectivity_verified: true }
              as: DeliveryTechnician
            - call: "POST /sleep/delivery-visits/${visit_id}/complete"
              payload: { outcome: "VERIFIED", setup_checklist: { base_assembled: true, chambers_connected: true, remote_configured: true, connectivity_verified: true } }
              as: DeliveryTechnician
          trigger:
            - call: "POST /sleep/delivery-visits/${visit_id}/complete"
              payload: { outcome: "VERIFIED", setup_checklist: { base_assembled: true, chambers_connected: true, remote_configured: true, connectivity_verified: true } }
              as: DeliveryTechnician
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_VISIT_ALREADY_COMPLETED"
            - "DeliveryVisit.${visit_id}.status remains VERIFIED"
            - "GET /sleep/orders/${order_id} shows trial_verified_at unchanged (idempotency: no duplicate side effects)"

      - name: failed_setup_visit_reschedule_cycle_returns_to_scheduled
        claim_type: valid_transition
        grounds:
          - state_machines.DeliveryVisit.FAILED_SETUP_to_SCHEDULED
          - concurrency_rules[visit-reschedule-stale-version]
        distinguishing_aspect: "The cyclic path SCHEDULED -> FAILED_SETUP -> SCHEDULED works: a failed visit reschedules into a new window with OCC, consuming slot_need there; version increments at every hop (1 create, 2 complete-fail, 3 reschedule)."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Confirmed order; windows W1 and W2 (capacity 4 each, team T1 non-overlapping); visit V on W1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sleep/stores"
              payload: { name: "S", zone_codes: ["941"] }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /sleep/product-models"
              payload: { sku: "MAT-1", name: "M", category: "MATTRESS", price_cents: 240000, replacement_part_price_cents: 0, warranty_months: 120 }
              as: PlatformAdmin
            - call: "POST /sleep/customers"
              payload: { home_store_id: "${store_id}", email: "u@x.com", full_name: "Uma U" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /sleep/fit-assessments"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", sleep_position: "BACK", weight_band: "BAND_130_230", partner_sleeper: false, preferred_feel: "MEDIUM" }
              as: SalesAssociate
              captures: { fa_id: $.data.id }
            - call: "POST /sleep/fit-assessments/${fa_id}/complete"
              payload: {}
              as: SalesAssociate
            - call: "POST /sleep/orders"
              payload: { customer_id: "${cust_id}", fit_assessment_id: "${fa_id}", line_items: [{ sku: "MAT-1", qty: 1 }] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /sleep/orders/${order_id}/confirm"
              payload: { payment_method: "PAY_IN_FULL" }
              as: SalesAssociate
            - call: "POST /sleep/delivery-windows"
              payload: { store_id: "${store_id}", team_id: "T1", window_start: "2026-09-02T08:00:00Z", window_end: "2026-09-02T12:00:00Z", capacity_slots: 4 }
              as: PlatformAdmin
              captures: { win1: $.data.id }
            - call: "POST /sleep/delivery-windows"
              payload: { store_id: "${store_id}", team_id: "T1", window_start: "2026-09-03T08:00:00Z", window_end: "2026-09-03T12:00:00Z", capacity_slots: 4 }
              as: PlatformAdmin
              captures: { win2: $.data.id }
            - call: "POST /sleep/delivery-visits"
              payload: { order_id: "${order_id}", delivery_window_id: "${win1}" }
              as: SalesAssociate
              captures: { visit_id: $.data.id }
            - call: "POST /sleep/delivery-visits/${visit_id}/complete"
              payload: { outcome: "FAILED_SETUP", setup_checklist: { base_assembled: false, chambers_connected: false, remote_configured: false, connectivity_verified: false } }
              as: DeliveryTechnician
            - call: "GET /sleep/delivery-visits/${visit_id}"
              payload: {}
              as: PlatformAdmin
              captures: { visit_v: $.data.version }
          trigger:
            - call: "POST /sleep/delivery-visits/${visit_id}/reschedule"
              payload: { expected_visit_version: "${visit_v}", new_delivery_window_id: "${win2}" }
              as: SalesAssociate
          assert:
            - "DeliveryVisit.${visit_id}.status == SCHEDULED (cycle closed)"
            - "DeliveryVisit.${visit_id}.delivery_window_id == ${win2}"
            - "DeliveryVisit.${visit_id}.version == ${visit_v} + 1"
            - "GET /sleep/delivery-windows/${win1}.reserved_slots == 0 and /${win2}.reserved_slots == 2"

      - name: device_unpair_repair_cycle_and_connectivity_recompute
        claim_type: valid_transition
        grounds:
          - state_machines.Device.PAIRED_to_UNPAIRED
          - entities.Device.fields.connectivity
        distinguishing_aspect: "The cyclic Device machine: pair with connectivity_verified=false lands PAIRED x OFFLINE; unpair returns UNPAIRED x OFFLINE; re-pair with connectivity_verified=true lands PAIRED x ONLINE — connectivity is recomputed at each pair, never sticky."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Confirmed order; BASE device registered."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
