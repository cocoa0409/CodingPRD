    side_effects: ["status = OPEN"]
  - method: GET
    path: /corrective-actions
    description: "Lists corrective actions, filterable by finding, category and status. Rows are ordered by created_at ASC."
    roles: [ElectionsDirector, AuditManager, CanvassingBoardMember, CandidateRepresentative]
    input: ["discrepancy_id?", "category?", "status?", "limit?", "offset?"]
    output: CorrectiveAction[]
    success_code: 200
    side_effects: []
  - method: GET
    path: /corrective-actions/{id}
    description: "Reads one corrective action."
    roles: [ElectionsDirector, AuditManager, CanvassingBoardMember, CandidateRepresentative]
    input: []
    output: CorrectiveAction
    success_code: 200
    side_effects: []
  - method: POST
    path: /corrective-actions/{id}/transition
    description: "Advances a corrective action; VERIFIED requires a different user than the one who completed it."
    roles: [CanvassingBoardMember]
    input: ["to_status", "note?"]
    output: CorrectiveAction
    success_code: 200
    side_effects: ["completed_by_user_id / verified_by_user_id stamped from X-User-ID"]

  # --- BallotInterpretation ---------------------------------------------------
  - method: POST
    path: /ballot-interpretations
    description: "Refers an ambiguous ballot to the canvassing board for a voter-intent determination."
    roles: [TallyTeamLead]
    input: [manual_tally_id, ballot_ref, ambiguity_type, proposed_determination]
    output: BallotInterpretation
    success_code: 201
    side_effects: ["status = PENDING", "ManualTally SUBMITTED -> PENDING_ADJUDICATION on the first referral"]
  - method: GET
    path: /ballot-interpretations
    description: "Lists ballot interpretations, filterable by tally and status. Rows are ordered by created_at ASC."
    roles: [ElectionsDirector, AuditManager, TallyTeamLead, CanvassingBoardMember, CandidateRepresentative]
    input: ["manual_tally_id?", "status?", "ambiguity_type?", "limit?", "offset?"]
    output: BallotInterpretation[]
    success_code: 200
    side_effects: []
  - method: GET
    path: /ballot-interpretations/{id}
    description: "Reads one interpretation with its board tally."
    roles: [ElectionsDirector, AuditManager, TallyTeamLead, CanvassingBoardMember, CandidateRepresentative]
    input: []
    output: BallotInterpretation
    success_code: 200
    side_effects: []
  - method: POST
    path: /ballot-interpretations/{id}/votes
    description: "Casts one canvassing-board vote on an ambiguous ballot; the voter is X-User-ID."
    roles: [CanvassingBoardMember]
    input: [party, vote]
    output: BallotInterpretation
    success_code: 200
    side_effects:
      - "calculations.board_quorum_adjudication"
      - "on quorum: -> ADJUDICATED or DEADLOCKED"
      - "on ADJUDICATED: ManualTally counts re-derived and its Discrepancy created, updated or voided; ledger and measures re-derived"
      - "when no PENDING interpretation remains: ManualTally PENDING_ADJUDICATION -> SUBMITTED"

  # --- Recount ----------------------------------------------------------------
  - method: POST
    path: /recounts
    description: "Files a recount: automatic by margin, escalated from an audit, or requested by a candidate against a cost deposit."
    roles: [CandidateRepresentative, ElectionsDirector]
    input: ["contest_id", "expected_contest_version", "trigger_type", "scope", "scope_batch_ids?", "requested_by_candidate_name?", "audit_id?"]
    output: Recount
    success_code: 201
    side_effects:
      - "OCC on Contest.version (§1.2.1 recount-create-stale-contest)"
      - "calculations.recount_deposit_assessment prices required_deposit_cents"
      - "status = REQUESTED; deposit_status = PENDING or NOT_REQUIRED; Contest.open_recount_count += 1"
  - method: GET
    path: /recounts
    description: "Lists recounts, filterable by contest, originating audit and status. Rows are ordered by created_at ASC."
    roles: [ElectionsDirector, AuditManager, CandidateRepresentative, CanvassingBoardMember]
    input: ["contest_id?", "audit_id?", "status?", "deposit_status?", "limit?", "offset?"]
    output: Recount[]
    success_code: 200
    side_effects: []
  - method: GET
    path: /recounts/{id}
    description: "Reads one recount with its money ledger."
    roles: [ElectionsDirector, AuditManager, CandidateRepresentative, CanvassingBoardMember]
    input: []
    output: Recount
    success_code: 200
    side_effects: []
  - method: POST
    path: /recounts/{id}/deposit
    description: "Posts the cost deposit in full; only the filing representative may pay."
    roles: [CandidateRepresentative]
    input: [amount_cents]
    output: Recount
    success_code: 200
    side_effects: ["deposit_status PENDING -> HELD; status REQUESTED -> DEPOSIT_HELD"]
  - method: POST
    path: /recounts/{id}/start
    description: "Starts the recount once the deposit is held (or not required) and no audit is live on the contest."
    roles: [ElectionsDirector]
    input: []
    output: Recount
    success_code: 200
    side_effects: ["status -> IN_PROGRESS"]
  - method: POST
    path: /recounts/{id}/complete
    description: "Records the recounted totals, settles the deposit and re-canvasses the contest."
    roles: [ElectionsDirector]
    input: [final_votes, team_hours]
    output: Recount
    success_code: 200
    side_effects:
      - "calculations.recount_cost_and_refund (per-line cost rounding, refund variant selection)"
      - "status -> COMPLETED; deposit_status settled; conservation invariant holds"
      - "cascade: Contest re-canvassed -> margin and automatic_recount_required re-derived -> PLANNED/SEEDED audits re-sized and flagged sample_size_stale -> FULL_CONTEST scope terminates live audits"
  - method: POST
    path: /recounts/{id}/withdraw
    description: "Withdraws a recount request; a held deposit is refunded net of the administrative retention."
    roles: [CandidateRepresentative]
    input: [reason]
    output: Recount
    success_code: 200
    side_effects: ["status -> WITHDRAWN; WITHDRAWAL_RETENTION settlement; Contest.open_recount_count -= 1"]
  - method: POST
    path: /recounts/{id}/deny
    description: "Denies a recount request and returns any held deposit in full."
    roles: [ElectionsDirector]
    input: [denial_reason]
    output: Recount
    success_code: 200
    side_effects: ["status -> DENIED; STATUTORY_REFUND settlement; Contest.open_recount_count -= 1"]

