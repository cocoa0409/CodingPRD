            - call: "POST /mail-items/${mi_b}/dispositions"
              payload: { disposition_type: "FORWARD", expected_mail_item_version: "${mi_b_v}" }
              as: BoxHolder
              as_user_id: "${box_id}"
            - call: "POST /boxes/${box_id}/mail-items"
              payload: { addressee_name: "Fay Ward", item_class: "FLAT", signature_required: false, actual_weight_lb: 3.0, length_in: 12.0, width_in: 9.0, height_in: 1.0, interior_scan_consent: false }
              as: CmraOperator
