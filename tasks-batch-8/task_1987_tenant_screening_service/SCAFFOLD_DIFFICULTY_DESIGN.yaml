              as: Screener
              captures: { ap: "$.data.id" }
            - call: "POST /api/applications"
              payload: { applicant_id: "${ap}", unit_state_code: "TX", monthly_rent_cents: 200000, stated_monthly_income_cents: 600000 }
              as: Landlord
              as_user_id: "${ll}"
              captures: { app: "$.data.id" }
          trigger:
            - { call: "POST /api/applications/${app}/verify-identity", payload: { method: "KNOWLEDGE_BASED", evidence_score: 40 }, as: Screener, captures: { s_fail: "$.data.identity_status" } }
            - { call: "POST /api/applications/${app}/verify-identity", payload: { method: "DOCUMENT_REVIEW", evidence_score: 85 }, as: Screener, captures: { s_pass: "$.data.identity_status", attempts_after: "$.data.identity_attempts" } }
            - { call: "POST /api/applications/${app}/submit", payload: {}, as: Landlord, as_user_id: "${ll}", captures: { status_after: "$.data.status", identity_after: "$.data.identity_status", pinned: "$.data.criteria_id" } }
