            - { call: "POST /surveillance/venues", payload: { venue_code: "NYSE", name: "New York Stock Exchange", venue_type: "EXCHANGE" }, as: ComplianceAdmin, captures: { v_id: "$.data.id" } }
            - { call: "POST /surveillance/routing-arrangements", payload: { venue_id: "${v_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-20T00:00:00Z", pfof_tiers: [ { min_monthly_shares: 0, rate_cents_per_share: 0.10 } ], routing_fee_bps: 2 }, as: ComplianceAdmin, captures: { a_id: "$.data.id" } }
            - { call: "POST /surveillance/routing-arrangements/${a_id}/transition", payload: { to_status: "ACTIVE" }, as: ComplianceAdmin }
            - { call: "POST /surveillance/orders", payload: { client_ref: "UC1", symbol: "ACME", side: "BUY", quantity: 100, order_type: "MARKET", arrival_nbbo_bid_cents: 9990, arrival_nbbo_ask_cents: 10010 }, as: OpsAdmin, captures: { o_id: "$.data.id" } }
            - { call: "POST /surveillance/orders/${o_id}/transition", payload: { to_status: "ROUTED", arrangement_id: "${a_id}" }, as: OpsAdmin }
            - { call: "POST /surveillance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-21T12:00:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/orders/${o_id}/transition", payload: { to_status: "EXECUTED", executed_price_cents: 10000, executed_at: "2026-08-21T10:00:00Z" }, as: OpsAdmin }
            - { call: "POST /surveillance/pfof-disclosures", payload: { quarter: "2026-Q3", pricing_variant: "MARGINAL" }, as: FilingOfficer, captures: { d_id: "$.data.id" } }
          trigger:
            - { call: "POST /surveillance/pfof-disclosures/${d_id}/transition", payload: { to_status: "PENDING_APPROVAL" }, as: FilingOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_UNCOVERED_VOLUME (executed_at 2026-08-21 lies outside the arrangement window that closed 2026-08-20)"
