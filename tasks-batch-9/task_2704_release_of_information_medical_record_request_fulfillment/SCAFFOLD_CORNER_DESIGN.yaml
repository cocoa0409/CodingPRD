              payload: { decision: "APPROVE" }
              as: ReleaseReviewer
              as_user_id: "u-review-2"
          assert:
            - "before the trigger: Request.${rq}.fulfillment_status == \"REDACTION\", RecordSegment.${seg}.sensitivity_status == \"AUTHORIZED_INCLUDE\", redaction_status == \"OPEN\""
            - "redacted_page_count 41: HTTP 422 with data.error_id == \"ERR_REDACTION_PAGE_COUNT_INVALID\"; RecordSegment.${seg}.redaction_status is still \"OPEN\" and redacted_page_count is still 0"
            - "redacted_page_count 40: HTTP 200, redaction_status == \"APPLIED\", redacted_page_count == 40 — equality is accepted"
            - "while APPLIED (not yet approved): Request.${rq}.billable_page_count == 40 and redacted_page_count_total == 0"
            - "after APPROVE: Request.${rq}.billable_page_count == 0, redacted_page_count_total == 40, page_count_total == 40 UNCHANGED"
            - "after APPROVE the bubble-up fires: Request.${rq}.fulfillment_status == \"RELEASE_READY\""

      - name: duplicate_mrn_is_scoped_to_one_facility_rejected
