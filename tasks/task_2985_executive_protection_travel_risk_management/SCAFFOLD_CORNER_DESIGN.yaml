              as: ProtectionManager
              as_user_id: "${mgr_id}"
              captures: { exec_id: $.data.id }
            - call: "POST /exec-protection/executives/${exec_id}/residential-survey"
              payload: { survey_outcome: "COMPLETE", residential_component: 10.00 }
              as: SecurityAnalyst
