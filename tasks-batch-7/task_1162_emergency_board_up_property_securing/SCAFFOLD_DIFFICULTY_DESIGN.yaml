            - call: "POST /jobs"
              payload: { property_id: "${pr}", incident_type: "FIRE", priority: "P3" }
              as: Dispatcher
              captures: { ja: $.data.id }
            - call: "POST /jobs/${ja}/dispatch"
              payload: {}
              as: Dispatcher
              captures: { asa: $.data.id }
            - call: "POST /jobs"
              payload: { property_id: "${pr}", incident_type: "STORM", priority: "P3" }
              as: Dispatcher
              captures: { jb: $.data.id }
            - call: "POST /jobs/${jb}/dispatch"
              payload: {}
