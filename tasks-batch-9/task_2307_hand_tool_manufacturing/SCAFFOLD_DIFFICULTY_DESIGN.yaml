  - rule_id: compensating_invariant
    instances:

      - name: warranty_reserve_money_conserved_across_approve_revoke
        grounds:
          - calculations.reserve_ledger
          - calculations.claim_reserve_charge
          - state_machines.WarrantyClaim.SUBMITTED_to_APPROVED
          - state_machines.WarrantyClaim.APPROVED_to_REVOKED
          - entities.WarrantyProgram.fields.reserve_balance_cents
          - concurrency_rules[claim-approve-stale-program]
        distinguishing_aspect: |
          The conserved quantity is MONEY in integer cents, partitioned into two
          buckets: reserve_funded_cents == reserve_balance_cents + the sum of
          reserve_charge_cents over claims in {APPROVED, FULFILLED}. Approve debits
          exactly 3696 to leave 4996304 and revoke credits exactly 3696 back to
          5000000 with no rounding drift, because the charge is retained on the
          REVOKED row while the row leaves the charged set.
        test_recipe:
          setup:
            - "One BRANDED WRENCH SKU, 17 mm, CR_MO, with a CERTIFIED and RELEASED lot of 500 units."
            - "One WarrantyProgram funded with exactly 5000000 cents and fraud_score_threshold 60."
            - "One CONSUMER Claimant with one SUBMITTED claim carrying three lines whose per-line reserves are 681, 1611 and 1404, totalling 3696."
