# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3032_retail_ear_piercing_service_consent_aftercare
#
# Nine Difficulty Rules from SKILL.md §0.5, two instances each = 18 instances.
# Every `grounds:` entry resolves into SCAFFOLD.yaml §1.1–§1.7.
# Every `${var}` traces to a `captures:` block earlier in the same instance.
# All numeric asserts were computed by executing the §1.3 formula as code.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: refund_allocation_provisional_vs_final_on_incident
        grounds:
          - calculations.incident_refund_allocation
          - calculations.incident_refund_allocation.variants.provisional_at_triage
          - calculations.incident_refund_allocation.variants.final_at_resolution
          - state_machines.IncidentReport.LOGGED_to_TRIAGED
          - state_machines.IncidentReport.TRIAGED_to_RESOLVED
        distinguishing_aspect: |
          For one identical IncidentReport, the provisional variant (evaluated at TRIAGED against the
          session's recorded net_fee_cents) yields refund_amount_cents 1500 while the final variant
          (evaluated at RESOLVED against base_fee_cents + the aftercare kit fee) yields 2850 — two
          valid readings of "the refundable amount" on the same incident, differing by 1350.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Jurisdiction IL (min_age_self_consent 18, min_age_with_guardian 6, min_age_absolute 6, permitted_sites [LOBE, UPPER_LOBE, HELIX, TRAGUS], requires_guardian_presence false, record_retention_years 7, consent_form_version 'IL-2026', sterilization_protocol_code 'AUTOCLAVE-B')."
            - "Store S1 in IL with 2 piercing rooms, posture OPEN. Piercer P1 with a VALID STANDARD certification. Customer C1 (age 30). Consent K1 ACTIVE. Appointment A1 CONFIRMED."
            - "Sterilization cycle Y1 PASSED on autoclave U1, lot L1 (LOBE, 50 units, expiry 2027-01-01) bound to Y1."
            - "Session X1 COMPLETED via the real service path, so its net_fee_cents was computed by net_service_fee. Appointment A1 COMPLETED. HealingOutcome H1 exists in status ASSESSED."
          setup_api_calls:
            - call: "POST /piercing-services/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /piercing-services/jurisdictions"
              payload: { state_code: "IL", min_age_self_consent: 18, min_age_with_guardian: 6, min_age_absolute: 6, permitted_sites: ["LOBE", "UPPER_LOBE", "HELIX", "TRAGUS"], requires_guardian_presence: false, record_retention_years: 7, consent_form_version: "IL-2026", sterilization_protocol_code: "AUTOCLAVE-B" }
              as: ComplianceOfficer
              captures: { jur_il_id: "$.data.id" }
            - call: "POST /piercing-services/stores"
              payload: { name: "Chicago Loop", jurisdiction_id: "${jur_il_id}", piercing_room_count: 2 }
              as: ComplianceOfficer
              captures: { store_il_id: "$.data.id" }
            - call: "POST /piercing-services/piercers"
              payload: { full_name: "Rae Novak", home_store_id: "${store_il_id}" }
              as: StoreManager
              captures: { p_il_id: "$.data.id" }
            - call: "GET /piercing-services/piercers/${p_il_id}"
              payload: { }
              as: AnyAuthenticated
              captures: { pv1: "$.data.version" }
            - call: "POST /piercing-services/certifications"
              payload: { piercer_id: "${p_il_id}", certification_level: "STANDARD", sterilization_protocol_code: "AUTOCLAVE-B", issued_at: "2026-08-01T00:00:00Z", expires_at: "2027-08-01T00:00:00Z", expected_piercer_version: "${pv1}" }
              as: ComplianceOfficer
              captures: { cert_il_id: "$.data.id" }
            - call: "POST /piercing-services/customers"
              payload: { full_name: "Dana Whitfield", date_of_birth: "1996-02-02T00:00:00Z" }
              as: IntakeAssociate
              captures: { cust_il_id: "$.data.id" }
            - call: "POST /piercing-services/consents"
              payload: { customer_id: "${cust_il_id}", jurisdiction_id: "${jur_il_id}", consent_type: "SELF", identification_type: "GOVERNMENT_PHOTO_ID", identification_number_masked: "****1234", signed_at: "2026-08-30T00:00:00Z" }
              as: IntakeAssociate
              captures: { cons_il_id: "$.data.id" }
            - call: "POST /piercing-services/consents/${cons_il_id}/verify"
              payload: { }
              as: IntakeAssociate
            - call: "POST /piercing-services/appointments"
              payload: { store_location_id: "${store_il_id}", customer_id: "${cust_il_id}", piercer_id: "${p_il_id}", jurisdiction_id: "${jur_il_id}", intake_type: "SCHEDULED", site_requested: "LOBE", slot_start_at: "2026-09-01T10:00:00Z", slot_end_at: "2026-09-01T10:30:00Z" }
