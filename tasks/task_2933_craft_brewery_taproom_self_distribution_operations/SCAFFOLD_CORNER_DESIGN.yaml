        distinguishing_aspect: "condition is declared only from BREWING. Applying it to a SCHEDULED batch must return 409 ERR_BATCH_TRANSITION_INVALID and must NOT write actual_yield_bbl, which would otherwise leak a yield onto a beer that was never brewed."
