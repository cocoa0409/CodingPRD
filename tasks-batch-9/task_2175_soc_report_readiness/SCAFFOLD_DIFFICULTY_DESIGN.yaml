              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { eng: $.data.id }
            - call: "POST /soc/subservice-organizations"
              payload: { engagement_id: "${eng}", name: "DataCo", services_provided: "Managed hosting and backup", coverage_start: "2026-09-01T00:00:00.000Z", coverage_end: "2026-11-30T00:00:00.000Z" }
