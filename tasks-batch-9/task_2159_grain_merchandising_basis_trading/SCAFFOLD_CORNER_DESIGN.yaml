# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth walk of references/claim-extraction-guide.md against this scaffold's
# §1.1–§1.7 surface. Corners already exercised by SCAFFOLD_DIFFICULTY_DESIGN.yaml
# are emitted as `excluded_because:` stubs with no test_recipe.
# Logical clock startup default: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: create_trading_desk_returns_system_minted_id_and_version_one
        claim_type: Creation
        grounds:
          - entities.TradingDesk
          - endpoints["POST /grain/trading-desks"]
        distinguishing_aspect: "A freshly created TradingDesk carries a server-minted bare UUID id, version 1, posture NORMAL and every USD aggregate at 0.00, with available_credit_usd equal to the full credit line."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /grain/trading-desks"
              payload: { desk_code: "CD01", name: "Corner Desk 1", credit_line_usd: 250000.00 }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { desk_id: $.data.id }
          trigger:
            - call: "GET /grain/trading-desks/${desk_id}"
              payload: {}
              as: DeskAdmin
              as_user_id: "u-admin-1"
          assert:
            - "TradingDesk.${desk_id}.version == 1"
            - "TradingDesk.${desk_id}.posture == NORMAL"
            - "TradingDesk.${desk_id}.margin_requirement_usd == 0"
            - "TradingDesk.${desk_id}.open_margin_call_usd == 0"
            - "TradingDesk.${desk_id}.available_credit_usd == 250000.00"
            - "TradingDesk.${desk_id}.credit_utilization == 0"
            - "TradingDesk.${desk_id}.committed_hedge_lots == 0"
            - "the response id is a bare UUID with no type prefix"

      - name: get_trading_desk_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=3]
          - errors[ERR_TRADING_DESK_NOT_FOUND]
        distinguishing_aspect: "A GET against a well-formed but unknown desk UUID returns ERR_TRADING_DESK_NOT_FOUND with HTTP 404 and the standard error envelope."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /grain/trading-desks"
              payload: { desk_code: "CD02", name: "Corner Desk 2", credit_line_usd: 250000.00 }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { desk_id: $.data.id }
          trigger:
            - call: "GET /grain/trading-desks/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_TRADING_DESK_NOT_FOUND"
            - "the response status is 404"
            - "the response envelope has response_type == error and meta.api_request_id present"

      - name: list_elevator_locations_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints["GET /grain/elevator-locations"]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three elevators on one desk, GET /grain/elevator-locations?desk_id=...&limit=2&offset=0 returns exactly 2 rows with total_count 3 and has_more true, and offset=2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "One desk with three elevators."
          setup_api_calls:
            - call: "POST /grain/trading-desks"
              payload: { desk_code: "CD03", name: "Corner Desk 3", credit_line_usd: 250000.00 }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { desk_id: $.data.id }
            - call: "POST /grain/elevator-locations"
              payload: { desk_id: "${desk_id}", location_code: "E1", name: "One", intake_capacity_bushels: 100000, rail_served: true }
              as: DeskAdmin
              as_user_id: "u-admin-1"
            - call: "POST /grain/elevator-locations"
              payload: { desk_id: "${desk_id}", location_code: "E2", name: "Two", intake_capacity_bushels: 100000 }
              as: DeskAdmin
              as_user_id: "u-admin-1"
            - call: "POST /grain/elevator-locations"
              payload: { desk_id: "${desk_id}", location_code: "E3", name: "Three", intake_capacity_bushels: 100000 }
              as: DeskAdmin
              as_user_id: "u-admin-1"
          trigger:
            - call: "GET /grain/elevator-locations?desk_id=${desk_id}&limit=2&offset=0"
              payload: {}
              as: DeskAdmin
              as_user_id: "u-admin-1"
            - call: "GET /grain/elevator-locations?desk_id=${desk_id}&limit=2&offset=2"
              payload: {}
              as: DeskAdmin
              as_user_id: "u-admin-1"
          assert:
            - "the first page returns 2 ElevatorLocation rows with total_count == 3 and has_more == true"
            - "the second page returns 1 ElevatorLocation row with total_count == 3 and has_more == false"
            - "response_type == array on both pages"

      - name: create_elevator_location_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting intake_capacity_bushels, a required input with no default, returns ERR_INVALID_REQUEST (400) and creates no row."
        test_recipe:
          setup:
            - "One desk."
          setup_api_calls:
            - call: "POST /grain/trading-desks"
              payload: { desk_code: "CD04", name: "Corner Desk 4", credit_line_usd: 250000.00 }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { desk_id: $.data.id }
          trigger:
            - call: "POST /grain/elevator-locations"
              payload: { desk_id: "${desk_id}", location_code: "E1", name: "One" }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "the response status is 400"
            - "GET /grain/elevator-locations?desk_id=${desk_id} returns an empty array with total_count == 0"

      - name: create_elevator_location_defaults_rail_served_to_false
        claim_type: Defaults
        grounds:
          - entities.ElevatorLocation.fields.rail_served
        distinguishing_aspect: "Omitting rail_served yields false, and committed_intake_bushels initialises to 0 even though the client never supplies it."
        test_recipe:
          setup:
            - "One desk."
          setup_api_calls:
            - call: "POST /grain/trading-desks"
              payload: { desk_code: "CD05", name: "Corner Desk 5", credit_line_usd: 250000.00 }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { desk_id: $.data.id }
          trigger:
            - call: "POST /grain/elevator-locations"
              payload: { desk_id: "${desk_id}", location_code: "E1", name: "One", intake_capacity_bushels: 100000 }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { loc_id: $.data.id }
          assert:
            - "ElevatorLocation.${loc_id}.rail_served == false"
            - "ElevatorLocation.${loc_id}.committed_intake_bushels == 0"
            - "ElevatorLocation.${loc_id}.version == 1"

      - name: create_bid_with_invalid_commodity_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Bid.fields.commodity_code
          - validations[priority=5]
        distinguishing_aspect: "commodity_code OATS is outside the declared {CORN, SOYBEANS, HRW_WHEAT} set, so the bid is rejected with ERR_INVALID_REQUEST (400) before any uniqueness or temporal rule runs."
        test_recipe:
          setup:
            - "One desk with one elevator."
          setup_api_calls:
            - call: "POST /grain/trading-desks"
              payload: { desk_code: "CD06", name: "Corner Desk 6", credit_line_usd: 250000.00 }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { desk_id: $.data.id }
            - call: "POST /grain/elevator-locations"
              payload: { desk_id: "${desk_id}", location_code: "E1", name: "One", intake_capacity_bushels: 100000, rail_served: true }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { loc_id: $.data.id }
          trigger:
            - call: "POST /grain/bids"
              payload: { location_id: "${loc_id}", commodity_code: "OATS", futures_month: "2026-12", delivery_period_start: "2026-10-01", delivery_period_end: "2026-12-31", basis_cents: -32, max_bushels: 100000, expires_at: "2027-01-15T00:00:00Z" }
              as: Merchandiser
              as_user_id: "u-merch-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "the response status is 400"
            - "GET /grain/bids?location_id=${loc_id} returns total_count == 0"

      - name: pricing_order_is_immutable_and_exposes_no_version_field
        claim_type: Immutability
        grounds:
          - entities.PricingOrder
          - endpoints["GET /grain/pricing-orders/{pricingOrderId}"]
        distinguishing_aspect: "PricingOrder declares common_fields: false, so its read carries id and created_at but no version and no updated_at, and no endpoint exists that mutates it."
        test_recipe:
          setup:
            - "Desk, elevator, SHORT 2026-12 hedge with 10 lots at 448, ACTIVE basis -32 bid and one 10,000-bushel HTA contract with a floating basis leg."
          setup_api_calls:
            - call: "POST /grain/trading-desks"
              payload: { desk_code: "CD07", name: "Corner Desk 7", credit_line_usd: 5000000.00 }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { desk_id: $.data.id }
            - call: "POST /grain/elevator-locations"
              payload: { desk_id: "${desk_id}", location_code: "E1", name: "One", intake_capacity_bushels: 5000000, rail_served: true }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { loc_id: $.data.id }
            - call: "POST /grain/hedge-positions"
              payload: { desk_id: "${desk_id}", commodity_code: "CORN", futures_month: "2026-12", side: "SHORT", lots_open: 10, avg_entry_price_cents: 448 }
              as: FuturesTrader
              as_user_id: "u-trader-1"
              captures: { hp_id: $.data.id }
            - call: "POST /grain/bids"
              payload: { location_id: "${loc_id}", commodity_code: "CORN", futures_month: "2026-12", delivery_period_start: "2026-10-01", delivery_period_end: "2026-12-31", basis_cents: -32, max_bushels: 1000000, expires_at: "2027-01-15T00:00:00Z" }
              as: Merchandiser
              as_user_id: "u-merch-1"
              captures: { bid_id: $.data.id }
            - call: "POST /grain/bids/${bid_id}/activate"
              payload: {}
              as: Merchandiser
              as_user_id: "u-merch-1"
            - call: "POST /grain/purchase-contracts"
              payload: { bid_id: "${bid_id}", hedge_position_id: "${hp_id}", contract_type: "HTA", bushels: 10000, seller_name: "Bell Farms", delivery_start: "2026-11-01", delivery_end: "2026-11-30", futures_price_cents: 448 }
              as: Merchandiser
              as_user_id: "u-merch-1"
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /grain/pricing-orders"
              payload: { contract_id: "${c_id}", component: "BASIS", bushels: 10000, price_cents: -30 }
              as: Merchandiser
              as_user_id: "u-merch-1"
              captures: { po_id: $.data.id }
            - call: "GET /grain/pricing-orders/${po_id}"
              payload: {}
              as: Merchandiser
              as_user_id: "u-merch-1"
          assert:
            - "PricingOrder.${po_id} carries id and created_at"
            - "PricingOrder.${po_id} carries no version field and no updated_at field"
            - "PricingOrder.${po_id}.placed_by_user_id == u-merch-1"
            - "GET /grain/pricing-orders?contract_id=${c_id} returns exactly 1 row"

      - name: hedge_position_computed_fields_start_at_zero_and_ignore_client_input
        claim_type: Computed Fields
        grounds:
          - entities.HedgePosition.fields.lots_committed
          - entities.HedgePosition.fields.posted_margin_usd
          - entities.HedgePosition.fields.last_settlement_price_cents
        distinguishing_aspect: "A newly opened 6-lot CORN position derives posted_margin_usd == 9900.00 from the per-commodity initial margin and seeds last_settlement_price_cents from avg_entry_price_cents, with lots_committed 0 and lots_available 6."
        test_recipe:
          setup:
            - "One desk with a 5,000,000 USD credit line."
          setup_api_calls:
            - call: "POST /grain/trading-desks"
              payload: { desk_code: "CD08", name: "Corner Desk 8", credit_line_usd: 5000000.00 }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { desk_id: $.data.id }
          trigger:
            - call: "POST /grain/hedge-positions"
              payload: { desk_id: "${desk_id}", commodity_code: "CORN", futures_month: "2026-12", side: "SHORT", lots_open: 6, avg_entry_price_cents: 448 }
              as: FuturesTrader
              as_user_id: "u-trader-1"
              captures: { hp_id: $.data.id }
          assert:
            - "HedgePosition.${hp_id}.posted_margin_usd == 9900.00"
            - "HedgePosition.${hp_id}.last_settlement_price_cents == 448"
            - "HedgePosition.${hp_id}.lots_committed == 0"
            - "HedgePosition.${hp_id}.lots_available == 6"
            - "HedgePosition.${hp_id}.unrealized_pnl_usd == 0"
            - "HedgePosition.${hp_id}.status == OPEN"
            - "TradingDesk.${desk_id}.margin_requirement_usd == 9900.00"

      - name: create_purchase_contract_with_unknown_bid_id_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - validations[priority=4]
          - errors[ERR_BID_NOT_FOUND]
        distinguishing_aspect: "A body FK that does not resolve is caught at priority 4, before any state or business rule, so an unknown bid_id yields ERR_BID_NOT_FOUND (404) even though the hedge position is perfectly valid."
        test_recipe:
          setup:
            - "Desk, elevator and a SHORT 2026-12 hedge with 10 free lots."
          setup_api_calls:
            - call: "POST /grain/trading-desks"
              payload: { desk_code: "CD09", name: "Corner Desk 9", credit_line_usd: 5000000.00 }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { desk_id: $.data.id }
            - call: "POST /grain/hedge-positions"
              payload: { desk_id: "${desk_id}", commodity_code: "CORN", futures_month: "2026-12", side: "SHORT", lots_open: 10, avg_entry_price_cents: 448 }
              as: FuturesTrader
              as_user_id: "u-trader-1"
              captures: { hp_id: $.data.id }
          trigger:
            - call: "POST /grain/purchase-contracts"
              payload: { bid_id: "00000000-0000-4000-8000-000000000000", hedge_position_id: "${hp_id}", contract_type: "CASH", bushels: 10000, seller_name: "Bell Farms", delivery_start: "2026-11-01", delivery_end: "2026-11-30", futures_price_cents: 448 }
              as: Merchandiser
              as_user_id: "u-merch-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_BID_NOT_FOUND"
            - "the response status is 404"
            - "HedgePosition.${hp_id}.lots_committed == 0"

      - name: purchase_contract_filtered_list_resolves_every_declared_foreign_key
        claim_type: Foreign key references validated
        grounds:
          - entities.PurchaseContract.fields.hedge_position_id
          - endpoints["GET /grain/purchase-contracts"]
        distinguishing_aspect: "In this flat topology the only reverse channel from a parent to its children is the filtered list; GET /grain/purchase-contracts?hedge_position_id=... returns exactly the one contract committed to that position and excludes the contract on the sibling position."
        test_recipe:
          setup:
            - "Desk, elevator, ACTIVE basis -32 bid and two SHORT 2026-12 hedge positions with 10 lots each."
            - "One 10,000-bushel CASH contract on each position."
          setup_api_calls:
            - call: "POST /grain/trading-desks"
              payload: { desk_code: "CD10", name: "Corner Desk 10", credit_line_usd: 5000000.00 }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { desk_id: $.data.id }
            - call: "POST /grain/elevator-locations"
              payload: { desk_id: "${desk_id}", location_code: "E1", name: "One", intake_capacity_bushels: 5000000, rail_served: true }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { loc_id: $.data.id }
            - call: "POST /grain/hedge-positions"
              payload: { desk_id: "${desk_id}", commodity_code: "CORN", futures_month: "2026-12", side: "SHORT", lots_open: 10, avg_entry_price_cents: 448 }
              as: FuturesTrader
              as_user_id: "u-trader-1"
              captures: { hp_a_id: $.data.id }
            - call: "POST /grain/hedge-positions"
              payload: { desk_id: "${desk_id}", commodity_code: "CORN", futures_month: "2027-03", side: "SHORT", lots_open: 10, avg_entry_price_cents: 460 }
              as: FuturesTrader
              as_user_id: "u-trader-1"
              captures: { hp_b_id: $.data.id }
            - call: "POST /grain/bids"
              payload: { location_id: "${loc_id}", commodity_code: "CORN", futures_month: "2026-12", delivery_period_start: "2026-10-01", delivery_period_end: "2026-12-31", basis_cents: -32, max_bushels: 1000000, expires_at: "2027-01-15T00:00:00Z" }
              as: Merchandiser
              as_user_id: "u-merch-1"
              captures: { bid_a_id: $.data.id }
            - call: "POST /grain/bids/${bid_a_id}/activate"
              payload: {}
              as: Merchandiser
              as_user_id: "u-merch-1"
            - call: "POST /grain/bids"
              payload: { location_id: "${loc_id}", commodity_code: "CORN", futures_month: "2027-03", delivery_period_start: "2026-11-01", delivery_period_end: "2026-12-31", basis_cents: -28, max_bushels: 1000000, expires_at: "2027-01-15T00:00:00Z" }
              as: Merchandiser
              as_user_id: "u-merch-1"
              captures: { bid_b_id: $.data.id }
            - call: "POST /grain/bids/${bid_b_id}/activate"
              payload: {}
              as: Merchandiser
              as_user_id: "u-merch-1"
            - call: "POST /grain/purchase-contracts"
              payload: { bid_id: "${bid_a_id}", hedge_position_id: "${hp_a_id}", contract_type: "CASH", bushels: 10000, seller_name: "Bell Farms", delivery_start: "2026-11-01", delivery_end: "2026-11-30", futures_price_cents: 448 }
              as: Merchandiser
              as_user_id: "u-merch-1"
              captures: { c_a_id: $.data.id }
            - call: "POST /grain/purchase-contracts"
              payload: { bid_id: "${bid_b_id}", hedge_position_id: "${hp_b_id}", contract_type: "CASH", bushels: 10000, seller_name: "Halberd Farms", delivery_start: "2026-12-01", delivery_end: "2026-12-31", futures_price_cents: 460 }
              as: Merchandiser
              as_user_id: "u-merch-1"
              captures: { c_b_id: $.data.id }
          trigger:
            - call: "GET /grain/purchase-contracts?hedge_position_id=${hp_a_id}"
              payload: {}
              as: RiskOfficer
              as_user_id: "u-risk-1"
          assert:
            - "the filtered list returns exactly 1 row whose id == ${c_a_id} and total_count == 1"
            - "${c_b_id} does not appear in the filtered list"
            - "PurchaseContract.${c_a_id}.desk_id == ${desk_id} and location_id == ${loc_id}"
            - "PurchaseContract.${c_a_id}.rolled_from_contract_id is null"

  - section: state_machines
    instances:
      - name: activate_an_already_active_bid_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - validations[priority=8]
          - state_machines.Bid.DRAFT_to_ACTIVE
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Activate is not idempotent: a second activate on a bid already in ACTIVE has no declared from-state and is rejected with ERR_INVALID_STATE (409) rather than silently succeeding."
        test_recipe:
          setup:
            - "One desk, one elevator and one ACTIVE CORN bid."
          setup_api_calls:
            - call: "POST /grain/trading-desks"
              payload: { desk_code: "CD11", name: "Corner Desk 11", credit_line_usd: 250000.00 }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { desk_id: $.data.id }
            - call: "POST /grain/elevator-locations"
              payload: { desk_id: "${desk_id}", location_code: "E1", name: "One", intake_capacity_bushels: 100000, rail_served: true }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { loc_id: $.data.id }
            - call: "POST /grain/bids"
              payload: { location_id: "${loc_id}", commodity_code: "CORN", futures_month: "2026-12", delivery_period_start: "2026-10-01", delivery_period_end: "2026-12-31", basis_cents: -32, max_bushels: 100000, expires_at: "2027-01-15T00:00:00Z" }
              as: Merchandiser
              as_user_id: "u-merch-1"
              captures: { bid_id: $.data.id }
            - call: "POST /grain/bids/${bid_id}/activate"
              payload: {}
              as: Merchandiser
              as_user_id: "u-merch-1"
          trigger:
            - call: "POST /grain/bids/${bid_id}/activate"
              payload: {}
              as: Merchandiser
              as_user_id: "u-merch-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE"
            - "the response status is 409"
            - "Bid.${bid_id}.status == ACTIVE"

      - name: withdrawn_bid_cannot_be_suspended_from_terminal_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Bid.ACTIVE_to_WITHDRAWN
          - validations[priority=8]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "WITHDRAWN is a terminal state of the Bid machine, so suspend from WITHDRAWN is refused with ERR_INVALID_STATE and the row keeps status WITHDRAWN."
        test_recipe:
          setup:
            - "One desk, one elevator and one bid activated and then withdrawn."
          setup_api_calls:
            - call: "POST /grain/trading-desks"
              payload: { desk_code: "CD12", name: "Corner Desk 12", credit_line_usd: 250000.00 }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { desk_id: $.data.id }
            - call: "POST /grain/elevator-locations"
              payload: { desk_id: "${desk_id}", location_code: "E1", name: "One", intake_capacity_bushels: 100000, rail_served: true }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { loc_id: $.data.id }
            - call: "POST /grain/bids"
              payload: { location_id: "${loc_id}", commodity_code: "CORN", futures_month: "2026-12", delivery_period_start: "2026-10-01", delivery_period_end: "2026-12-31", basis_cents: -32, max_bushels: 100000, expires_at: "2027-01-15T00:00:00Z" }
