# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — Car Rental Operations
# Depth probe: 9 §0.5 rules x >=2 instances. Every grounds: ref resolves into
# SCAFFOLD.yaml §1.1-§1.7. Every setup_api_calls chain drives empty-DB -> the
# stated precondition using only §1.5 endpoints. Numeric asserts are literals
# pre-computed against the §1.3 formulas + constants.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: settlement_provisional_vs_final_diverges_on_agreement
        grounds:
          - calculations.agreement_settlement
          - calculations.agreement_settlement.variants.provisional_at_pickup
          - calculations.agreement_settlement.variants.final_at_close
          - state_machines.RentalAgreement.OPEN_to_CLOSED
        distinguishing_aspect: |
          On a RentalAgreement (cost-accounting domain), the provisional pass at PICKED_UP equals the
          frozen quote (15000), while the final pass at CLOSE adds usage rows so final_total_cents == 20500;
          the divergence is exactly mileage(2500)+fuel(3000).
        test_recipe:
          setup:
            - "Location LAX, class ECON (daily 5000, included 200 mi/day, overage 25c/mi), one AVAILABLE vehicle odo=1000 fuel=8/8."
            - "Member age 30 (STANDARD). 3-day reservation, no add-ons, same pickup/dropoff. Confirmed (quote 15000), picked up, returned odo=1700 fuel=6/8."
          setup_api_calls:
            - call: "POST /locations"
              payload: { code: "LAX", name: "Los Angeles", one_way_drop_fee_cents: 4500, young_driver_surcharge_per_day_cents: 1000 }
              as: FleetManager
              captures: { loc_lax: $.data.id }
            - call: "POST /vehicle-classes"
              payload: { code: "ECON", tier_rank: 1, daily_rate_cents: 5000, weekly_rate_cents: 28000, included_miles_per_day: 200, overage_per_mile_cents: 25, ldw_per_day_cents: 1500, pai_per_day_cents: 800 }
              as: FleetManager
              captures: { cls_econ: $.data.id }
            - call: "POST /vehicles"
              payload: { location_id: "${loc_lax}", class_id: "${cls_econ}", plate: "LAX-001", odometer_miles: 1000, fuel_level_eighths: 8 }
              as: FleetManager
              captures: { veh1: $.data.id, veh1_ver: $.data.version }
            - call: "POST /members"
              payload: { email: "m1@x.com", full_name: "M One", driver_age: 30 }
              as: RentalAgent
              captures: { mem1: $.data.id }
            - call: "POST /reservations"
              payload: { member_id: "${mem1}", pickup_location_id: "${loc_lax}", dropoff_location_id: "${loc_lax}", class_id: "${cls_econ}", pickup_at: "2026-07-01T10:00:00Z", dropoff_at: "2026-07-04T10:00:00Z", ldw_selected: false, pai_selected: false }
              as: RentalAgent
              captures: { res1: $.data.id }
            - call: "POST /reservations/${res1}/confirm"
              payload: {}
              as: RentalAgent
              captures: { quoted1: $.data.quoted_total_cents }
            - call: "POST /vehicles/${veh1}/hold"
              payload: { reservation_id: "${res1}", expected_vehicle_version: "${veh1_ver}" }
              as: RentalAgent
            - call: "POST /rental-agreements"
              payload: { reservation_id: "${res1}", vehicle_id: "${veh1}", odometer_out: 1000, fuel_out_eighths: 8 }
              as: RentalAgent
              captures: { agr1: $.data.id }
          trigger:
            - call: "POST /rental-agreements/${agr1}/close"
              payload: { odometer_in: 1700, fuel_in_eighths: 6 }
              as: RentalAgent
              captures: { final1: $.data.final_total_cents }
          assert:
            - "Reservation.${res1}.quoted_total_cents == 15000"
            - "RentalAgreement.${agr1}.final_total_cents == 20500"
            - "RentalAgreement.${agr1}.final_total_cents - Reservation.${res1}.quoted_total_cents == 5500"

      - name: incident_liability_ldw_vs_no_ldw_diverges_on_member
        grounds:
          - calculations.incident_liability
          - calculations.incident_liability.variants.ldw_waived
          - calculations.incident_liability.variants.no_ldw
          - entities.IncidentReport.fields.member_liability_cents
        distinguishing_aspect: |
          On the member-risk domain (IncidentReport.member_liability_cents), identical MAJOR assessed_damage
          300000 yields 100000 when the agreement's reservation had ldw_selected==true vs 300000 when false
          — a different entity domain than settlement's cost accounting.
        test_recipe:
          setup:
            - "Two agreements: one whose reservation has ldw_selected=true, one with ldw_selected=false; both OPEN."
            - "A MAJOR incident assessed at 300000 is filed against each."
          setup_api_calls:
            - call: "POST /locations"
              payload: { code: "LAX", name: "Los Angeles", one_way_drop_fee_cents: 4500, young_driver_surcharge_per_day_cents: 1000 }
              as: FleetManager
              captures: { loc_lax: $.data.id }
            - call: "POST /vehicle-classes"
              payload: { code: "ECON", tier_rank: 1, daily_rate_cents: 5000, weekly_rate_cents: 28000, included_miles_per_day: 200, overage_per_mile_cents: 25, ldw_per_day_cents: 1500, pai_per_day_cents: 800 }
              as: FleetManager
              captures: { cls_econ: $.data.id }
            - call: "POST /vehicles"
              payload: { location_id: "${loc_lax}", class_id: "${cls_econ}", plate: "LAX-001", odometer_miles: 1000, fuel_level_eighths: 8 }
              as: FleetManager
              captures: { vehA: $.data.id, vehA_ver: $.data.version }
            - call: "POST /vehicles"
              payload: { location_id: "${loc_lax}", class_id: "${cls_econ}", plate: "LAX-002", odometer_miles: 1000, fuel_level_eighths: 8 }
              as: FleetManager
              captures: { vehB: $.data.id, vehB_ver: $.data.version }
            - call: "POST /members"
              payload: { email: "m1@x.com", full_name: "M One", driver_age: 30 }
              as: RentalAgent
              captures: { mem1: $.data.id }
            - call: "POST /reservations"
              payload: { member_id: "${mem1}", pickup_location_id: "${loc_lax}", dropoff_location_id: "${loc_lax}", class_id: "${cls_econ}", pickup_at: "2026-07-01T10:00:00Z", dropoff_at: "2026-07-04T10:00:00Z", ldw_selected: true, pai_selected: false }
              as: RentalAgent
              captures: { resA: $.data.id }
            - call: "POST /reservations/${resA}/confirm"
              payload: {}
              as: RentalAgent
            - call: "POST /vehicles/${vehA}/hold"
              payload: { reservation_id: "${resA}", expected_vehicle_version: "${vehA_ver}" }
              as: RentalAgent
            - call: "POST /rental-agreements"
              payload: { reservation_id: "${resA}", vehicle_id: "${vehA}", odometer_out: 1000, fuel_out_eighths: 8 }
              as: RentalAgent
              captures: { agrA: $.data.id }
            - call: "POST /reservations"
              payload: { member_id: "${mem1}", pickup_location_id: "${loc_lax}", dropoff_location_id: "${loc_lax}", class_id: "${cls_econ}", pickup_at: "2026-08-01T10:00:00Z", dropoff_at: "2026-08-04T10:00:00Z", ldw_selected: false, pai_selected: false }
              as: RentalAgent
              captures: { resB: $.data.id }
            - call: "POST /reservations/${resB}/confirm"
              payload: {}
              as: RentalAgent
            - call: "POST /vehicles/${vehB}/hold"
              payload: { reservation_id: "${resB}", expected_vehicle_version: "${vehB_ver}" }
              as: RentalAgent
            - call: "POST /rental-agreements"
              payload: { reservation_id: "${resB}", vehicle_id: "${vehB}", odometer_out: 1000, fuel_out_eighths: 8 }
              as: RentalAgent
              captures: { agrB: $.data.id }
          trigger:
            - call: "POST /incident-reports"
              payload: { agreement_id: "${agrA}", severity: "MAJOR", assessed_damage_cents: 300000 }
              as: RentalAgent
              captures: { incA: $.data.id, liabA: $.data.member_liability_cents }
            - call: "POST /incident-reports"
              payload: { agreement_id: "${agrB}", severity: "MAJOR", assessed_damage_cents: 300000 }
              as: RentalAgent
              captures: { incB: $.data.id, liabB: $.data.member_liability_cents }
          assert:
            - "IncidentReport.${incA}.member_liability_cents == 100000"
            - "IncidentReport.${incB}.member_liability_cents == 300000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: quote_nested_tier_and_conditional_inputs_mode_a
        grounds:
          - calculations.reservation_quote
          - entities.Location.fields.young_driver_surcharge_per_day_cents
          - entities.Location.fields.one_way_drop_fee_cents
          - state_machines.Reservation.QUOTED_to_CONFIRMED
        distinguishing_aspect: |
          Mode (a): reservation_quote combines >=5 inputs with non-linear interaction — weekly-vs-daily
          block selection (43000), per-day add-ons (15000), conditional young-driver surcharge keyed on
          the PICKUP location (10000), conditional one-way drop keyed on the DROPOFF location (6000), and a
          GOLD tier discount on base only (-4300) — producing quoted_total_cents == 69700 for the pinned inputs.
        test_recipe:
          setup:
            - "Location LAX (one_way 4500, young 1000/day) and Location SFO; class LUX (daily 5000, weekly 28000, ldw 1500/day)."
            - "GOLD member age 23, 10-day one-way LAX->SFO reservation with LDW selected, PAI not."
          setup_api_calls:
            - call: "POST /locations"
              payload: { code: "LAX", name: "Los Angeles", one_way_drop_fee_cents: 4500, young_driver_surcharge_per_day_cents: 1000 }
              as: FleetManager
              captures: { loc_lax: $.data.id }
            - call: "POST /locations"
              payload: { code: "SFO", name: "San Francisco", one_way_drop_fee_cents: 6000, young_driver_surcharge_per_day_cents: 1500 }
              as: FleetManager
              captures: { loc_sfo: $.data.id }
            - call: "POST /vehicle-classes"
              payload: { code: "LUX", tier_rank: 4, daily_rate_cents: 5000, weekly_rate_cents: 28000, included_miles_per_day: 200, overage_per_mile_cents: 25, ldw_per_day_cents: 1500, pai_per_day_cents: 800 }
              as: FleetManager
              captures: { cls_lux: $.data.id }
            - call: "POST /vehicles"
              payload: { location_id: "${loc_lax}", class_id: "${cls_lux}", plate: "LAX-LUX1", odometer_miles: 500, fuel_level_eighths: 8 }
              as: FleetManager
            - call: "POST /members"
              payload: { email: "young@x.com", full_name: "Young Gold", driver_age: 23 }
              as: RentalAgent
              captures: { memg: $.data.id }
            - call: "POST /_members/${memg}/set_loyalty"
              payload: { tier: "GOLD", lifetime_points: 2500, points_balance: 2500 }
              as: FleetManager
            - call: "POST /reservations"
              payload: { member_id: "${memg}", pickup_location_id: "${loc_lax}", dropoff_location_id: "${loc_sfo}", class_id: "${cls_lux}", pickup_at: "2026-07-01T10:00:00Z", dropoff_at: "2026-07-11T10:00:00Z", ldw_selected: true, pai_selected: false }
              as: RentalAgent
              captures: { resg: $.data.id }
          trigger:
            - call: "POST /reservations/${resg}/confirm"
              payload: {}
              as: RentalAgent
              captures: { qg: $.data.quoted_total_cents }
          assert:
            - "Reservation.${resg}.quoted_total_cents == 69700"
            - "Reservation.${resg}.status == CONFIRMED"

      - name: loyalty_accrual_floor_order_pinned_mode_b
        grounds:
          - calculations.loyalty_accrual
          - calculations.loyalty_accrual.variants.close_full
          - entities.LoyaltyAccrual.fields.delta_points
          - state_machines.RentalAgreement.OPEN_to_CLOSED
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — earned = floor(final_total_cents/100)*tier_mult,
          pinned as floor-then-multiply. For final 20500 and SILVER (mult 2), floor(20500/100)*2 == 410,
          which differs from floor(20500*2/100) on non-multiples; the scaffold pins floor-first.
        test_recipe:
          setup:
            - "SILVER member; a 3-day STANDARD-rate reservation closed with final_total_cents 20500 (15000 base + 2500 mileage + 3000 fuel)."
          setup_api_calls:
            - call: "POST /locations"
              payload: { code: "LAX", name: "Los Angeles", one_way_drop_fee_cents: 4500, young_driver_surcharge_per_day_cents: 1000 }
              as: FleetManager
              captures: { loc_lax: $.data.id }
            - call: "POST /vehicle-classes"
              payload: { code: "ECON", tier_rank: 1, daily_rate_cents: 5000, weekly_rate_cents: 28000, included_miles_per_day: 200, overage_per_mile_cents: 25, ldw_per_day_cents: 1500, pai_per_day_cents: 800 }
              as: FleetManager
              captures: { cls_econ: $.data.id }
            - call: "POST /vehicles"
              payload: { location_id: "${loc_lax}", class_id: "${cls_econ}", plate: "LAX-001", odometer_miles: 1000, fuel_level_eighths: 8 }
              as: FleetManager
              captures: { veh1: $.data.id, veh1_ver: $.data.version }
            - call: "POST /members"
              payload: { email: "silver@x.com", full_name: "Sil Ver", driver_age: 40 }
              as: RentalAgent
              captures: { mems: $.data.id }
            - call: "POST /_members/${mems}/set_loyalty"
              payload: { tier: "SILVER", lifetime_points: 800, points_balance: 800 }
              as: FleetManager
            - call: "POST /reservations"
              payload: { member_id: "${mems}", pickup_location_id: "${loc_lax}", dropoff_location_id: "${loc_lax}", class_id: "${cls_econ}", pickup_at: "2026-07-01T10:00:00Z", dropoff_at: "2026-07-04T10:00:00Z", ldw_selected: false, pai_selected: false }
              as: RentalAgent
              captures: { res1: $.data.id }
            - call: "POST /reservations/${res1}/confirm"
              payload: {}
              as: RentalAgent
            - call: "POST /vehicles/${veh1}/hold"
              payload: { reservation_id: "${res1}", expected_vehicle_version: "${veh1_ver}" }
              as: RentalAgent
            - call: "POST /rental-agreements"
              payload: { reservation_id: "${res1}", vehicle_id: "${veh1}", odometer_out: 1000, fuel_out_eighths: 8 }
              as: RentalAgent
              captures: { agr1: $.data.id }
          trigger:
            - call: "POST /rental-agreements/${agr1}/close"
              payload: { odometer_in: 1700, fuel_in_eighths: 6 }
              as: RentalAgent
              captures: { final1: $.data.final_total_cents }
            - call: "GET /members/${mems}/loyalty-accruals"
              payload: {}
              as: RentalAgent
          assert:
            - "RentalAgreement.${agr1}.final_total_cents == 20500"
            - "the ACCRUAL LoyaltyAccrual for ${mems} has delta_points == 410"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: reservation_branches_confirmed_then_noshow_vs_pickup
        grounds:
          - state_machines.Reservation.CONFIRMED_to_NO_SHOW
          - state_machines.Reservation.CONFIRMED_to_PICKED_UP
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
        distinguishing_aspect: |
          Branching fork on Reservation: from CONFIRMED the divergent successors {PICKED_UP, NO_SHOW, CANCELLED}
          carry different side-effect sets (pickup -> ON_RENT + ledger; no-show -> release + strike). This
          instance drives the NO_SHOW branch and asserts the strike side-effect, distinct from pickup.
        test_recipe:
          setup:
            - "Confirmed reservation with a vehicle held; clock advanced past hold_expires_at (pickup_at + 120 min)."
          setup_api_calls:
            - call: "POST /locations"
              payload: { code: "LAX", name: "Los Angeles", one_way_drop_fee_cents: 4500, young_driver_surcharge_per_day_cents: 1000 }
              as: FleetManager
              captures: { loc_lax: $.data.id }
            - call: "POST /vehicle-classes"
              payload: { code: "ECON", tier_rank: 1, daily_rate_cents: 5000, weekly_rate_cents: 28000, included_miles_per_day: 200, overage_per_mile_cents: 25, ldw_per_day_cents: 1500, pai_per_day_cents: 800 }
              as: FleetManager
              captures: { cls_econ: $.data.id }
            - call: "POST /vehicles"
              payload: { location_id: "${loc_lax}", class_id: "${cls_econ}", plate: "LAX-001", odometer_miles: 1000, fuel_level_eighths: 8 }
              as: FleetManager
              captures: { veh1: $.data.id, veh1_ver: $.data.version }
            - call: "POST /members"
              payload: { email: "m1@x.com", full_name: "M One", driver_age: 30 }
              as: RentalAgent
              captures: { mem1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T09:00:00Z" }
              as: RentalAgent
            - call: "POST /reservations"
              payload: { member_id: "${mem1}", pickup_location_id: "${loc_lax}", dropoff_location_id: "${loc_lax}", class_id: "${cls_econ}", pickup_at: "2026-07-01T10:00:00Z", dropoff_at: "2026-07-04T10:00:00Z", ldw_selected: false, pai_selected: false }
              as: RentalAgent
              captures: { res1: $.data.id }
            - call: "POST /reservations/${res1}/confirm"
              payload: {}
              as: RentalAgent
            - call: "POST /vehicles/${veh1}/hold"
              payload: { reservation_id: "${res1}", expected_vehicle_version: "${veh1_ver}" }
              as: RentalAgent
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T12:30:00Z" }
              as: RentalAgent
          trigger:
            - call: "POST /reservations/${res1}/no-show"
              payload: {}
              as: RentalAgent
          assert:
            - "Reservation.${res1}.status == NO_SHOW"
            - "Vehicle.${veh1}.status == AVAILABLE"
            - "Vehicle.${veh1}.held_by_reservation_id == null"
            - "LoyaltyMember.${mem1}.no_show_strikes == 1"

      - name: vehicle_cycle_reserved_back_to_available_on_release
        grounds:
          - state_machines.Vehicle.AVAILABLE_to_RESERVED
          - state_machines.Vehicle.RESERVED_to_AVAILABLE
          - calculations.class_availability_reconcile
        distinguishing_aspect: |
          Cyclic shape on Vehicle (a different entity than Reservation): AVAILABLE -> RESERVED -> AVAILABLE
          returns the vehicle to its origin state and restores class.available_count to its pre-hold value,
          proving the loop closes.
        test_recipe:
          setup:
            - "One AVAILABLE vehicle of class ECON; class.available_count == 1. A CONFIRMED reservation holds it (available_count 0)."
          setup_api_calls:
            - call: "POST /locations"
              payload: { code: "LAX", name: "Los Angeles", one_way_drop_fee_cents: 4500, young_driver_surcharge_per_day_cents: 1000 }
              as: FleetManager
              captures: { loc_lax: $.data.id }
            - call: "POST /vehicle-classes"
              payload: { code: "ECON", tier_rank: 1, daily_rate_cents: 5000, weekly_rate_cents: 28000, included_miles_per_day: 200, overage_per_mile_cents: 25, ldw_per_day_cents: 1500, pai_per_day_cents: 800 }
              as: FleetManager
              captures: { cls_econ: $.data.id }
            - call: "POST /vehicles"
              payload: { location_id: "${loc_lax}", class_id: "${cls_econ}", plate: "LAX-001", odometer_miles: 1000, fuel_level_eighths: 8 }
              as: FleetManager
              captures: { veh1: $.data.id, veh1_ver: $.data.version }
            - call: "POST /members"
              payload: { email: "m1@x.com", full_name: "M One", driver_age: 30 }
              as: RentalAgent
              captures: { mem1: $.data.id }
            - call: "POST /reservations"
              payload: { member_id: "${mem1}", pickup_location_id: "${loc_lax}", dropoff_location_id: "${loc_lax}", class_id: "${cls_econ}", pickup_at: "2026-07-01T10:00:00Z", dropoff_at: "2026-07-04T10:00:00Z", ldw_selected: false, pai_selected: false }
              as: RentalAgent
              captures: { res1: $.data.id }
            - call: "POST /reservations/${res1}/confirm"
              payload: {}
              as: RentalAgent
            - call: "POST /vehicles/${veh1}/hold"
              payload: { reservation_id: "${res1}", expected_vehicle_version: "${veh1_ver}" }
              as: RentalAgent
          trigger:
            - call: "POST /vehicles/${veh1}/release"
              payload: {}
              as: RentalAgent
            - call: "GET /vehicle-classes/${cls_econ}"
              payload: {}
              as: RentalAgent
          assert:
            - "Vehicle.${veh1}.status == AVAILABLE"
            - "Vehicle.${veh1}.held_by_reservation_id == null"
            - "VehicleClass.${cls_econ}.available_count == 1"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: writeoff_cascade_agreement_to_vehicle_to_class_depth3
        grounds:
          - state_machines.RentalAgreement.OPEN_to_WRITE_OFF
          - state_machines.Vehicle.ON_RENT_to_RETIRED
          - calculations.class_availability_reconcile
          - entities.VehicleClass.fields.total_count
        distinguishing_aspect: |
          Depth-3 cascade from the write-off trigger: (A) RentalAgreement OPEN->WRITE_OFF causes
          (B) Vehicle ON_RENT->RETIRED, which itself causes (C) VehicleClass.total_count decrement.
          Each hop is caused by the prior hop, not by the original write-off call directly.
        test_recipe:
          setup:
            - "An OPEN agreement on the only ECON vehicle (class.total_count==1) with a FILED TOTAL incident assessed 400000."
          setup_api_calls:
            - call: "POST /locations"
              payload: { code: "LAX", name: "Los Angeles", one_way_drop_fee_cents: 4500, young_driver_surcharge_per_day_cents: 1000 }
              as: FleetManager
              captures: { loc_lax: $.data.id }
            - call: "POST /vehicle-classes"
              payload: { code: "ECON", tier_rank: 1, daily_rate_cents: 5000, weekly_rate_cents: 28000, included_miles_per_day: 200, overage_per_mile_cents: 25, ldw_per_day_cents: 1500, pai_per_day_cents: 800 }
              as: FleetManager
              captures: { cls_econ: $.data.id }
            - call: "POST /vehicles"
              payload: { location_id: "${loc_lax}", class_id: "${cls_econ}", plate: "LAX-001", odometer_miles: 1000, fuel_level_eighths: 8 }
              as: FleetManager
              captures: { veh1: $.data.id, veh1_ver: $.data.version }
            - call: "POST /members"
              payload: { email: "m1@x.com", full_name: "M One", driver_age: 30 }
              as: RentalAgent
              captures: { mem1: $.data.id }
            - call: "POST /reservations"
              payload: { member_id: "${mem1}", pickup_location_id: "${loc_lax}", dropoff_location_id: "${loc_lax}", class_id: "${cls_econ}", pickup_at: "2026-07-01T10:00:00Z", dropoff_at: "2026-07-04T10:00:00Z", ldw_selected: true, pai_selected: false }
              as: RentalAgent
              captures: { res1: $.data.id }
            - call: "POST /reservations/${res1}/confirm"
              payload: {}
              as: RentalAgent
            - call: "POST /vehicles/${veh1}/hold"
              payload: { reservation_id: "${res1}", expected_vehicle_version: "${veh1_ver}" }
              as: RentalAgent
            - call: "POST /rental-agreements"
              payload: { reservation_id: "${res1}", vehicle_id: "${veh1}", odometer_out: 1000, fuel_out_eighths: 8 }
              as: RentalAgent
              captures: { agr1: $.data.id }
            - call: "POST /incident-reports"
              payload: { agreement_id: "${agr1}", severity: "TOTAL", assessed_damage_cents: 400000 }
              as: RentalAgent
          trigger:
            - call: "POST /rental-agreements/${agr1}/write-off"
              payload: { odometer_in: 1500, fuel_in_eighths: 4 }
              as: FleetManager
            - call: "GET /vehicle-classes/${cls_econ}"
              payload: {}
              as: FleetManager
          assert:
            - "RentalAgreement.${agr1}.status == WRITE_OFF"
            - "Vehicle.${veh1}.status == RETIRED"
            - "VehicleClass.${cls_econ}.total_count == 0"
            - "VehicleClass.${cls_econ}.available_count == 0"

      - name: void_incident_cascade_reversal_to_final_total_depth2
        grounds:
          - state_machines.IncidentReport.FILED_to_VOID
          - entities.LedgerEntry.fields.kind
          - entities.RentalAgreement.fields.final_total_cents
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (incident void): (A) IncidentReport FILED->VOID emits a
          compensating INCIDENT_REVERSAL LedgerEntry, which (B) drops RentalAgreement.final_total_cents by
          exactly the prior DAMAGE charge. Distinct origin from the write-off cascade.
        test_recipe:
          setup:
            - "A CLOSED 3-day ECON agreement (base 15000, returned at 100 miles so no overage, full fuel) whose final_total_cents includes a 25000 DAMAGE line from a MINOR no-LDW incident assessed 25000, total 40000."
          setup_api_calls:
            - call: "POST /locations"
              payload: { code: "LAX", name: "Los Angeles", one_way_drop_fee_cents: 4500, young_driver_surcharge_per_day_cents: 1000 }
              as: FleetManager
