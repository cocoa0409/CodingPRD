              as: QualityEngineer
            - call: "POST /warranty/field-actions/${fa_big_id}/submit"
              payload: {}
              as: QualityEngineer
              as_user_id: "uq-1"
            - call: "POST /warranty/field-actions"
              payload: { family_id: "${fam_se2_id}", action_code: "FA-SE-SMALL", action_type: "SERVICE_CAMPAIGN", affected_build_start_date: "2025-06-01", affected_build_end_date: "2025-06-30", affected_unit_count: 500 }
              as: QualityEngineer
