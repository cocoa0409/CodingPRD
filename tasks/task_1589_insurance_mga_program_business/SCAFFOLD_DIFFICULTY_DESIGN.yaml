            - { call: "POST /mga/programs/${prog}/rate-filings", payload: { state_code: "CA", filing_type: "RATE", base_rates: { ARTISAN: 1500 }, policy_fee_cents: 5000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: MGAUnderwriter, captures: { fil: $.data.id } }
            - { call: "POST /mga/rate-filings/${fil}/submit", payload: {}, as: MGAUnderwriter }
            - { call: "POST /mga/rate-filings/${fil}/approve", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/rate-filings/${fil}/mark-effective", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/programs/${prog}/activate", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/programs/${prog}/policies", payload: { insured_name: "Trust Co", state_code: "CA", class_code: "ARTISAN", exposure_units: 100, coverage_limit_cents: 500000, experience_mod: 1.0, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: MGAUnderwriter, captures: { pol: $.data.id } }
            - { call: "POST /mga/policies/${pol}/bind", payload: {}, as: MGAUnderwriter }
            - { call: "POST /mga/policies/${pol}/collections", payload: { amount_cents: 155000 }, as: MGAFinance, captures: { e1: $.data.id, rb1: $.data.running_balance_cents } }
          trigger:
            - { call: "POST /mga/policies/${pol}/cancel", payload: { cancellation_date: "2026-08-01T00:00:00Z", reason: "CARRIER_REQUEST" }, as: MGAUnderwriter }
            - { call: "POST /mga/_ops/run-daily", payload: {}, as: PlatformAdmin }
            - { call: "GET /mga/programs/${prog}/trust-ledger", payload: {}, as: MGAFinance, captures: { e2_amt: "$.data[1].amount_cents", e2_type: "$.data[1].entry_type", e2_rb: "$.data[1].running_balance_cents" } }
          assert:
            - "COLLECTION entry running_balance_cents == 155000 (forward)"
            - "second entry: entry_type == REFUND, amount_cents == -155000, running_balance_cents == 0 (compensation; flat cancel => earned 0, fee waived)"
            - "program.trust_balance_cents == 0 — invariant sum(amount_cents) == trust_balance holds with zero drift"

      - name: active_guideline_cardinality_conserved_under_supersede
        grounds:
          - state_machines.UnderwritingGuideline.ACTIVE_to_SUPERSEDED
          - concurrency_rules[guideline-create-stale-program]
        distinguishing_aspect: |
          Conserved quantity = cardinality of ACTIVE guidelines per (state, class)
          scope (a count, not a cents balance): each create-with-supersede keeps the
          ACTIVE count for the scope pinned at exactly 1 while SUPERSEDED rows
          accumulate; program.version increments once per create.
        test_recipe:
          setup:
            - "program PROPOSED with one ACTIVE guideline for (CA, ARTISAN) created at v1"
          setup_api_calls:
            - { call: "POST /mga/carriers", payload: { name: "Carrier CI3", naic_code: "NAIC-CI3", contact_email: "uw@ci3.com" }, as: PlatformAdmin, captures: { ca: $.data.id } }
            - { call: "POST /mga/programs", payload: { carrier_id: "${ca}", name: "CI3 Program", line_of_business: "GENERAL_LIABILITY", states_covered: ["CA"], inception_date: "2026-08-01T00:00:00Z", aggregate_limit_cents: 500000, commission_rate_pct: 0.15, corrective_threshold_pct: 70, termination_threshold_pct: 85, min_trust_balance_cents: 10000, min_earned_premium_for_ratio_cents: 50000 }, as: MGAUnderwriter, captures: { prog: $.data.id, prog_v: $.data.version } }
            - { call: "POST /mga/programs/${prog}/guidelines", payload: { state_code: "CA", class_code: "ARTISAN", max_policy_premium_cents: 250000, max_policy_limit_cents: 1000000, min_policy_premium_cents: 5000, expected_program_version: "${prog_v}" }, as: MGAUnderwriter, captures: { g1: $.data.id } }
          trigger:
            - { call: "GET /mga/programs/${prog}", payload: {}, as: MGAUnderwriter, captures: { v2: $.data.version } }
            - { call: "POST /mga/programs/${prog}/guidelines", payload: { state_code: "CA", class_code: "ARTISAN", max_policy_premium_cents: 200000, max_policy_limit_cents: 800000, min_policy_premium_cents: 5000, expected_program_version: "${v2}" }, as: MGAUnderwriter, captures: { g2: $.data.id } }
            - { call: "GET /mga/programs/${prog}", payload: {}, as: MGAUnderwriter, captures: { v3: $.data.version } }
            - { call: "POST /mga/programs/${prog}/guidelines", payload: { state_code: "CA", class_code: "ARTISAN", max_policy_premium_cents: 300000, max_policy_limit_cents: 1200000, min_policy_premium_cents: 4000, expected_program_version: "${v3}" }, as: MGAUnderwriter, captures: { g3: $.data.id } }
            - { call: "GET /mga/programs/${prog}/guidelines?status=ACTIVE", payload: {}, as: MGAUnderwriter, captures: { active_n: "$.data[0].status" } }
            - { call: "GET /mga/guidelines/${g1}", payload: {}, as: MGAUnderwriter, captures: { g1_st: $.data.status } }
            - { call: "GET /mga/guidelines/${g2}", payload: {}, as: MGAUnderwriter, captures: { g2_st: $.data.status } }
          assert:
            - "after two supersedes: exactly one ACTIVE guideline exists for scope (CA, ARTISAN) — the newest (g3, max 300000)"
            - "Guideline.${g1}.status == SUPERSEDED and Guideline.${g2}.status == SUPERSEDED"
            - "cardinality invariant: count(ACTIVE in scope) == 1 before and after each forward+compensate pair (create supersedes prior)"
            - "program.version advanced by exactly 1 per guideline create (1 -> 2 -> 3)"
