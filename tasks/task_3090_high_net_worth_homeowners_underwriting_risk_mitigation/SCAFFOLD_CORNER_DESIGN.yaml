# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests) — task_3090
# High-Net-Worth Homeowners Underwriting & Risk Mitigation Services
#
# Breadth probe. Every testable claim the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners already
# covered by a §1.8 instance appear as `excluded_because:` stubs with no
# test_recipe. Reusable fixture prefixes are declared once via YAML anchors.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: risk_zone_create_returns_every_derived_field_and_starts_unfrozen
        claim_type: Creation
        grounds:
          - entities.RiskZone
          - endpoints.POST_/hnw/risk-zones
          - response_envelope.success
        distinguishing_aspect: "A zone created with only its configuration inputs comes back 201 with concentration_ratio_pct 0.0, concentration_band NORMAL, freeze_active false, version 1 and system-minted id / created_at / updated_at — the derived fields are never client-supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &clk
              call: "POST /hnw/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &zone_extreme
              call: "POST /hnw/risk-zones"
              payload: { zone_code: "ZC9", state_code: "CA", wildland_urban_interface_band: "WITHIN_WUI", sustained_wind_mph: 50, mitigation_band_multiplier: 1.0, mitigated_loss_multiplier: 1.0, exposure_band: "EXTREME" }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "RiskZone.${zone_id}.zone_code == \"ZC9\" and state_code == \"CA\" and exposure_band == EXTREME"
            - "RiskZone.${zone_id}.concentration_ratio_pct == 0.0 and concentration_band == NORMAL and freeze_active == false"
            - "RiskZone.${zone_id}.state_event == NONE"
            - "RiskZone.${zone_id}.version == 1 and the response carries non-null id, created_at and updated_at"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: property_get_returns_derived_posture_and_valuation_totals
        claim_type: Retrieval
        grounds:
          - entities.Property.fields.posture
          - entities.Property.fields.total_insured_value_cents
          - endpoints.GET_/hnw/properties/{id}
        distinguishing_aspect: "A property's derived gate, mitigation band and exposure totals round-trip correctly on a read that performs no writes: after one approved 200000000 appraisal and one approved 50000000 scheduled item the property reads total_insured_value_cents 250000000 with scheduled_valuation_cents 50000000."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; a property with one approved SITE_MEASURED appraisal of 200000000 and one approved collection of 50000000."
          setup_api_calls:
            - *clk
            - *zone_extreme
            - &ag_base
              call: "POST /hnw/agencies"
              payload: { agency_code: "AGC9", legal_name: "Corner Premier", state_code: "CA", delegated_authority_limit_cents: 400000000 }
              as: PlatformAdmin
              captures: { agency_id: $.data.id }
            - &prop_base
              call: "POST /hnw/properties"
              payload: { risk_zone_id: "${zone_id}", agency_id: "${agency_id}", address_line: "1 Corner Rd", grid_risk_block: "CORN-A" }
              as: Underwriter
              captures: { p1_id: $.data.id, p1_v0: $.data.version }
            - &appr_200m
              call: "POST /hnw/properties/${p1_id}/appraisals"
              payload: { appraiser_name: "Corner Valuation", valuation_method: "SITE_MEASURED", appraised_on: "2026-08-15T00:00:00Z", dwelling_cost_cents: 200000000, contents_cost_cents: 0, valuation_confidence_pct: 95.0 }
              as: Underwriter
              captures: { appr_id: $.data.id }
            - &appr_review
              call: "POST /hnw/appraisals/${appr_id}/review"
              payload: {}
              as: Underwriter
            - &appr_approve
              call: "POST /hnw/appraisals/${appr_id}/approve"
              payload: {}
              as: Underwriter
            - call: "POST /hnw/properties/${p1_id}/appraisal-documents"
              payload: { item_class: "COLLECTION", appraiser_name: "Corner Collections", appraisal_date: "2026-08-20T00:00:00Z", appraised_value_cents: 50000000 }
              as: Underwriter
              captures: { doc_id: $.data.id }
            - call: "POST /hnw/properties/${p1_id}/scheduled-items"
              payload: { item_type: "COLLECTION", declared_value_cents: 50000000, appraisal_doc_id: "${doc_id}" }
              as: AgencyProducer
              as_user_id: "${agency_id}"
              captures: { si_id: $.data.id }
            - call: "POST /hnw/scheduled-items/${si_id}/approve"
              payload: {}
              as: Underwriter
          trigger:
            - call: "GET /hnw/properties/${p1_id}"
              payload: {}
              as: Underwriter
              captures: { read_total: $.data.total_insured_value_cents }
          assert:
            - "the response status is 200 and response_type is object"
            - "Property.${p1_id}.dwelling_replacement_cost_cents == 200000000"
            - "Property.${p1_id}.scheduled_valuation_cents == 50000000"
            - "Property.${p1_id}.total_insured_value_cents == 250000000, so loss-of-use coverage is genuinely excluded from the exposure currency"
            - "Property.${p1_id}.mitigation_band == UNVERIFIED and base_posture == UNDERWRITABLE and posture == REFERRAL_REQUIRED, because an EXTREME zone with a WITHIN_WUI band demands a referral while no defence is in progress"

      - name: enrollments_list_filters_by_zone_and_paginates
        claim_type: Listing
        grounds:
          - endpoints.GET_/hnw/enrollments
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three enrollments across two zones, limit=2 returns two rows with total_count 3 and has_more true, the risk_zone_id filter narrows to the one enrollment on that zone, and an unfiltered read defaults to limit 10 offset 0."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; three draft enrollments, two on zone ZC9 and one on zone ZC8."
          setup_api_calls:
            - *clk
            - *zone_extreme
            - call: "POST /hnw/risk-zones"
              payload: { zone_code: "ZC8", state_code: "CA", wildland_urban_interface_band: "ADJACENT_WUI", sustained_wind_mph: 35, mitigation_band_multiplier: 1.0, mitigated_loss_multiplier: 1.0, exposure_band: "ELEVATED" }
              as: PlatformAdmin
              captures: { zone2_id: $.data.id }
            - *ag_base
            - &prop_base2
              call: "POST /hnw/properties"
              payload: { risk_zone_id: "${zone_id}", agency_id: "${agency_id}", address_line: "2 Corner Rd", grid_risk_block: "CORN-B" }
              as: Underwriter
              captures: { pa_id: $.data.id }
            - call: "POST /hnw/properties"
              payload: { risk_zone_id: "${zone_id}", agency_id: "${agency_id}", address_line: "3 Corner Rd", grid_risk_block: "CORN-B" }
              as: Underwriter
              captures: { pb_id: $.data.id }
            - call: "POST /hnw/properties"
              payload: { risk_zone_id: "${zone2_id}", agency_id: "${agency_id}", address_line: "4 Orchard Rd", grid_risk_block: "ORCH-B" }
              as: Underwriter
              captures: { pc_id: $.data.id }
            - call: "POST /hnw/properties/${pa_id}/enrollments"
              payload: { agency_id: "${agency_id}", dwelling_coverage_cents: 150000000, contents_coverage_cents: 0, scheduled_coverage_cents: 0, loss_of_use_coverage_cents: 0 }
              as: AgencyProducer
              as_user_id: "${agency_id}"
            - call: "POST /hnw/properties/${pb_id}/enrollments"
              payload: { agency_id: "${agency_id}", dwelling_coverage_cents: 150000000, contents_coverage_cents: 0, scheduled_coverage_cents: 0, loss_of_use_coverage_cents: 0 }
              as: AgencyProducer
              as_user_id: "${agency_id}"
            - call: "POST /hnw/properties/${pc_id}/enrollments"
              payload: { agency_id: "${agency_id}", dwelling_coverage_cents: 150000000, contents_coverage_cents: 0, scheduled_coverage_cents: 0, loss_of_use_coverage_cents: 0 }
              as: AgencyProducer
              as_user_id: "${agency_id}"
          trigger:
            - call: "GET /hnw/enrollments"
              payload: { limit: 2, offset: 0 }
              as: Underwriter
          assert:
            - "the response status is 200 and response_type is array"
            - "the page returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /hnw/enrollments?limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /hnw/enrollments?risk_zone_id=${zone_id} returns exactly 2 rows"
            - "GET /hnw/enrollments?risk_zone_id=${zone2_id} returns exactly 1 row"
            - "GET /hnw/enrollments?status=DRAFT returns 3 rows, and an unfiltered read returns 3 rows with limit defaulting to 10"

      - name: agency_get_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/hnw/agencies/{id}
          - errors[ERR_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "A syntactically valid but unallocated id on the agency path produces 404 with the error envelope carrying both error_id and message — not a 400 and not a 500."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. No agency has been created."
          setup_api_calls:
            - *clk
          trigger:
            - call: "GET /hnw/agencies/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Underwriter
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and response_type is error"
            - "error_id == ERR_NOT_FOUND and data.message is a non-empty string"
            - "the meta block is still present on the error envelope"

      - name: property_create_missing_risk_zone_id_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Property.fields.risk_zone_id
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=3]
        distinguishing_aspect: "risk_zone_id is a required input with no default, so omitting it is a 400 from the required-field check rather than the 404 that an unresolvable zone id produces."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one agency exists so the agency_id is resolvable."
          setup_api_calls:
            - *clk
            - *zone_extreme
            - *ag_base
          trigger:
            - call: "POST /hnw/properties"
              payload: { agency_id: "${agency_id}", address_line: "5 Corner Rd" }
              as: Underwriter
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "error_id != ERR_NOT_FOUND, because no zone id was supplied at all"
            - "GET /hnw/properties?agency_id=${agency_id} returns 0 rows"

      - name: property_create_omitting_grid_risk_block_defaults_to_ungrouped
        claim_type: Defaults
        grounds:
          - entities.Property.fields.grid_risk_block
          - endpoints.POST_/hnw/properties
        distinguishing_aspect: "grid_risk_block declares the default UNGROUPED, so omitting it stores that string rather than null, and two such properties share one adjacency key."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one zone and one agency."
          setup_api_calls:
            - *clk
            - *zone_extreme
            - *ag_base
          trigger:
            - call: "POST /hnw/properties"
              payload: { risk_zone_id: "${zone_id}", agency_id: "${agency_id}", address_line: "6 Corner Rd" }
              as: Underwriter
              captures: { p_id: $.data.id, p_block: $.data.grid_risk_block }
          assert:
            - "the response status is 201"
            - "Property.${p_id}.grid_risk_block == \"UNGROUPED\", not null"
            - "Property.${p_id}.base_posture == PENDING_APPRAISAL and posture == WRITE_FROZEN on creation"
            - "POST /hnw/properties carries no status field and rejects one: a create supplying status APPROVED is refused with 400 ERR_INVALID_REQUEST"

      - name: appraisal_percent_complete_is_computed_on_create_extra_field_ignored
        claim_type: Computed Fields
        grounds:
          - entities.Appraisal.fields.percent_complete
          - endpoints.POST_/hnw/properties/{id}/appraisals
        distinguishing_aspect: "percent_complete is source: computed and a create cannot set it: a freshly recorded appraisal reads 0.00 regardless of any supplied value, and only an approve or supersede writes 1.00."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; a property ready to receive an appraisal."
          setup_api_calls:
            - *clk
            - *zone_extreme
            - *ag_base
            - *prop_base
          trigger:
            - call: "POST /hnw/properties/${p1_id}/appraisals"
              payload: { appraiser_name: "Corner Valuation", valuation_method: "SITE_MEASURED", appraised_on: "2026-08-15T00:00:00Z", dwelling_cost_cents: 200000000, contents_cost_cents: 0, valuation_confidence_pct: 95.0, percent_complete: 1.00 }
              as: Underwriter
              captures: { new_appr: $.data.id, new_pct: $.data.percent_complete }
          assert:
            - "the response status is 201 and Appraisal.${new_appr}.status == PENDING_REVIEW"
            - "Appraisal.${new_appr}.percent_complete == 0.00, so the attempted 1.00 was ignored"
            - "Property.${p1_id}.dwelling_replacement_cost_cents == 0, because a PENDING_REVIEW appraisal contributes nothing"
            - "after POST /hnw/appraisals/${new_appr}/review and approve, Appraisal.${new_appr}.percent_complete == 1.00 and Property.${p1_id}.dwelling_replacement_cost_cents == 200000000"

      - name: appraisal_document_and_managed_risk_event_are_immutable_records
        claim_type: Immutability
        grounds:
          - entities.AppraisalDocument
          - entities.ManagedRiskEvent
          - complexity_profile.entity_topology
        distinguishing_aspect: "Two common_fields:false entities carry only id and created_at, expose no version field and have no update or delete endpoint — a re-filed appraisal document is a new row, and an existing one's currency_status is derived at read time rather than stored."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; a property with one filed appraisal document."
          setup_api_calls:
            - *clk
            - *zone_extreme
            - *ag_base
            - *prop_base
            - call: "POST /hnw/properties/${p1_id}/appraisal-documents"
              payload: { item_class: "JEWELRY", appraiser_name: "Corner Jewels", appraisal_date: "2026-08-20T00:00:00Z", appraised_value_cents: 60000000 }
              as: Underwriter
              captures: { doc_id: $.data.id }
          trigger:
            - call: "GET /hnw/properties/${p1_id}/appraisal-documents"
              payload: {}
              as: Underwriter
          assert:
            - "AppraisalDocument.${doc_id} exposes id and created_at but no updated_at and no version field"
            - "AppraisalDocument.${doc_id}.currency_months == 0 and currency_status == CURRENT at a clock of 2026-09-01 with an appraisal_date of 2026-08-20"
            - "AppraisalDocument.${doc_id}.expires_on == 2028-09-01T00:00:00Z, since the 24-month anniversary is 2028-08-20 and it rolls to the first of the following month"
            - "after filing a second document for the same property, GET returns 2 rows and the first document's stored fields are unchanged"

      - name: property_create_with_an_out_of_enum_wui_band_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.RiskZone.fields.wildland_urban_interface_band
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=1]
        distinguishing_aspect: "wildland_urban_interface_band is a closed three-member enum, so a value such as NEAR_WUI is rejected at 400 rather than silently treated as OUTSIDE_WUI and quietly downgrading every property on the zone out of referral posture."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - *clk
          trigger:
            - call: "POST /hnw/risk-zones"
              payload: { zone_code: "ZC7", state_code: "CA", wildland_urban_interface_band: "NEAR_WUI", sustained_wind_mph: 50, mitigation_band_multiplier: 1.0, mitigated_loss_multiplier: 1.0, exposure_band: "EXTREME" }
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /hnw/risk-zones?zone_code=ZC7 returns 0 rows, so no zone was created"
            - "a zone with the same inputs but wildland_urban_interface_band OUTSIDE_WUI is accepted with 201"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: posture_eval_from_declined_property_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Property.PENDING_APPRAISAL_to_DECLINED
          - errors[ERR_INVALID_STATE]
          - validations[priority=8]
        distinguishing_aspect: "DECLINED is terminal for Property, so a second posture evaluation on an already-declined dwelling is refused with ERR_INVALID_STATE and fires none of the decline cascade a second time."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; a property whose only approved appraisal fails the 1.50 guarantee ratio, so it is already DECLINED."
          setup_api_calls:
            - *clk
            - *zone_extreme
            - *ag_base
            - *prop_base
            - call: "POST /hnw/properties/${p1_id}/appraisals"
              payload: { appraiser_name: "Corner Valuation", valuation_method: "SITE_MEASURED", appraised_on: "2026-08-15T00:00:00Z", dwelling_cost_cents: 100000000, contents_cost_cents: 0, valuation_confidence_pct: 95.0 }
              as: Underwriter
              captures: { low_appr: $.data.id }
            - call: "POST /hnw/appraisals/${low_appr}/review"
              payload: {}
              as: Underwriter
            - call: "POST /hnw/appraisals/${low_appr}/approve"
              payload: {}
              as: Underwriter
            - call: "POST /hnw/properties/${p1_id}/posture-eval"
              payload: { expected_property_version: "${p1_v0}" }
              as: Underwriter
              captures: { after_decline: $.data.base_posture }
            - call: "GET /hnw/properties/${p1_id}"
              payload: {}
              as: Underwriter
              captures: { p1_v1: $.data.version }
          trigger:
            - call: "POST /hnw/properties/${p1_id}/posture-eval"
              payload: { expected_property_version: "${p1_v1}" }
              as: Underwriter
              captures: { error_id: $.data.error_id }
          assert:
            - "the first evaluation returned base_posture DECLINED, because a 100000000 appraisal cannot satisfy the 1.50 ratio against a 200000000 signed valuation"
            - "the second evaluation is refused with status 409 and error_id == ERR_INVALID_STATE"
            - "Property.${p1_id}.base_posture is still DECLINED and Property.${p1_id}.version did not advance"

      - name: attach_from_draft_enrollment_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Enrollment.APPROVED_to_ATTACHED
          - errors[ERR_INVALID_STATE]
          - validations[priority=8]
        distinguishing_aspect: "ATTACHED is reachable only from APPROVED, so attaching a DRAFT enrollment is a state rejection rather than a coverage or freeze rejection — the three gates on that endpoint never run."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; a fully eligible property with an approved appraisal and a DRAFT enrollment that has never been submitted."
          setup_api_calls:
            - *clk
            - *zone_extreme
            - *ag_base
            - *prop_base
            - *appr_200m
            - *appr_review
            - *appr_approve
            - &posture_eval
              call: "POST /hnw/properties/${p1_id}/posture-eval"
              payload: { expected_property_version: "${p1_v0}" }
              as: Underwriter
              captures: { p1_v1: $.data.version }
            - call: "POST /hnw/properties/${p1_id}/enrollments"
              payload: { agency_id: "${agency_id}", dwelling_coverage_cents: 300000000, contents_coverage_cents: 0, scheduled_coverage_cents: 0, loss_of_use_coverage_cents: 0 }
              as: AgencyProducer
              as_user_id: "${agency_id}"
              captures: { e1_id: $.data.id }
          trigger:
            - call: "POST /hnw/enrollments/${e1_id}/attach"
              payload: { expected_property_version: "${p1_v1}" }
              as: Underwriter
              captures: { error_id: $.data.error_id }
          assert:
            - "the attach is refused with status 409 and error_id == ERR_INVALID_STATE"
            - "Enrollment.${e1_id}.status is still DRAFT and bound_at is null"
            - "no claim may be reviewed against it either: POST /hnw/claims on a nonexistent claim id returns 404 ERR_NOT_FOUND while the enrollment remains DRAFT"

      - name: claim_second_review_attempt_is_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.Claim.REPORTED_to_UNDER_REVIEW
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Reported -> Under_Review has exactly one source state, so issuing the review trigger twice is refused on the second call and the claim is not re-stamped."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; a bound enrollment with one reported claim."
          setup_api_calls:
            - *clk
            - *zone_extreme
            - *ag_base
            - *prop_base
            - *appr_200m
            - *appr_review
            - *appr_approve
            - *posture_eval
            - call: "POST /hnw/properties/${p1_id}/mitigation-requirements"
              payload: { requirement_code: "DEFENSIBLE_SPACE", band_awarded: "CLEARED", source: "UNDERWRITING", due_on: "2026-12-01T00:00:00Z" }
              as: RiskConsultant
              captures: { mit_id: $.data.id }
            - call: "POST /hnw/mitigation-requirements/${mit_id}/verify"
              payload: { verified_band: "CLEARED", verification_count: 0 }
              as: RiskConsultant
            - call: "POST /hnw/properties/${p1_id}/enrollments"
              payload: { agency_id: "${agency_id}", dwelling_coverage_cents: 300000000, contents_coverage_cents: 0, scheduled_coverage_cents: 0, loss_of_use_coverage_cents: 0 }
              as: AgencyProducer
              as_user_id: "${agency_id}"
              captures: { e1_id: $.data.id }
            - call: "POST /hnw/enrollments/${e1_id}/submit"
              payload: {}
              as: AgencyProducer
              as_user_id: "${agency_id}"
            - call: "POST /hnw/enrollments/${e1_id}/approve"
              payload: {}
              as: Underwriter
            - &get_prop_v_attach
              call: "GET /hnw/properties/${p1_id}"
              payload: {}
              as: Underwriter
              captures: { p1_va: $.data.version }
            - call: "POST /hnw/enrollments/${e1_id}/attach"
              payload: { expected_property_version: "${p1_va}" }
              as: Underwriter
            - call: "POST /hnw/enrollments/${e1_id}/claims"
              payload: { cause_of_loss: "HALL", loss_date: "2026-09-20T00:00:00Z", reported_indemnity_cents: 50000000, adjuster_user_id: "adj-morgan", adjuster_override: false }
              as: ClaimsAdjuster
              captures: { c1_id: $.data.id }
          trigger:
            - call: "POST /hnw/claims/${c1_id}/review"
              payload: {}
              as: ClaimsAdjuster
          assert:
            - "the first review succeeds with status 200 and Claim.${c1_id}.status == UNDER_REVIEW"
            - "a second identical POST /hnw/claims/${c1_id}/review is refused with status 409 and error_id == ERR_INVALID_STATE"
            - "Claim.${c1_id}.version is 2 after the successful review and is still 2 after the refused retry"

      - name: defense_dispatch_advance_from_requested_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.WildfireDefenseDispatch.VENDOR_ASSIGNED_to_ON_SITE
          - state_machines.WildfireDefenseDispatch.REQUESTED_to_VENDOR_ASSIGNED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "The advance endpoint only acts on VENDOR_ASSIGNED and ON_SITE, so advancing a still-REQUESTED dispatch is a state rejection and no mitigation requirement is auto-imposed."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; an ACTIVE zone with one property holding a REQUESTED dispatch that has never been polled."
          setup_api_calls:
            - *clk
            - call: "POST /hnw/risk-zones"
              payload: { zone_code: "ZT1", state_code: "CA", wildland_urban_interface_band: "WITHIN_WUI", sustained_wind_mph: 50, mitigation_band_multiplier: 1.0, mitigated_loss_multiplier: 1.0, exposure_band: "EXTREME", state_event: "ACTIVE" }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - *ag_base
            - *prop_base
            - call: "POST /hnw/wildfire-events/properties/${p1_id}/dispatch-request"
              payload: {}
              as: AgencyProducer
              as_user_id: "${agency_id}"
              captures: { d1_id: $.data.id }
          trigger:
            - call: "POST /hnw/wildfire-events/dispatches/${d1_id}/advance"
              payload: {}
              as: Underwriter
              captures: { error_id: $.data.error_id }
          assert:
            - "the advance is refused with status 409 and error_id == ERR_INVALID_STATE"
            - "WildfireDefenseDispatch.${d1_id}.status is still REQUESTED and assigned_at is null"
            - "GET /hnw/properties/${p1_id}/mitigation-requirements?source=DEFENSE_FOLLOW_UP returns 0 rows, so no follow-up requirement was created by the refused call"

      - name: consultation_cancel_after_the_appointment_has_started_is_refused
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.RiskConsultation.SCHEDULED_to_CANCELLED
          - state_machines.RiskConsultation.SCHEDULED_to_NO_SHOW
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Cancellation carries a clock precondition the other transitions do not: a SCHEDULED consultation may be cancelled strictly before scheduled_for, but once the clock has crossed scheduled_for the only forward exits are completion or the automatic no-show."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-10T10:00:00Z, one hour after the appointment start, with a consultation still SCHEDULED."
          setup_api_calls:
            - *clk
            - *zone_extreme
            - *ag_base
            - *prop_base
            - call: "POST /hnw/properties/${p1_id}/risk-consultations"
              payload: { consultant_user_id: "rc-dana", scheduled_for: "2026-09-10T09:00:00Z", duration_minutes: 60 }
              as: RiskConsultant
              captures: { rc_id: $.data.id }
          trigger:
            - call: "POST /hnw/risk-consultations/${rc_id}/cancel"
              payload: {}
              as: AgencyProducer
              as_user_id: "${agency_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the cancel is refused with status 409 and error_id == ERR_INVALID_STATE because the clock is at or past scheduled_for"
            - "RiskConsultation.${rc_id}.status is still SCHEDULED"
            - "POST /hnw/risk-consultations/${rc_id}/complete is accepted and returns status COMPLETED with a non-null completed_at"

  # ===========================================================================
  - section: calculations
    instances:

      - name: risk_tier_boundary_at_exactly_450_points
        claim_type: Correct Result
        grounds:
          - calculations.wildfire_risk_score
          - calculations.wildfire_risk_score.constants.TIER_SURCHARGE_MIN
          - entities.Enrollment.fields.risk_tier
        distinguishing_aspect: "The tier ladder is tested at its exact break point: EXTREME with a PARTIAL mitigation and a NORMAL agency scores exactly 470 and lands in SURCHARGE, while the same zone with an UNVERIFIED mitigation scores 720 and lands in REFER — the >= versus > decision at 450 is what the assertion pins."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; two EXTREME/WITHIN_WUI properties, one with a verified PARTIAL mitigation and one unmitigated, each with a submitted enrollment."
          setup_api_calls:
            - *clk
            - *zone_extreme
            - *ag_base
            - *prop_base
            - *appr_200m
            - *appr_review
            - *appr_approve
            - *posture_eval
            - call: "POST /hnw/properties/${p1_id}/mitigation-requirements"
              payload: { requirement_code: "DEFENSIBLE_SPACE", band_awarded: "PARTIAL", source: "UNDERWRITING", due_on: "2026-12-01T00:00:00Z" }
              as: RiskConsultant
              captures: { mit_id: $.data.id }
            - call: "POST /hnw/mitigation-requirements/${mit_id}/verify"
              payload: { verified_band: "PARTIAL", verification_count: 0 }
              as: RiskConsultant
            - call: "POST /hnw/properties/${p1_id}/enrollments"
              payload: { agency_id: "${agency_id}", dwelling_coverage_cents: 300000000, contents_coverage_cents: 0, scheduled_coverage_cents: 0, loss_of_use_coverage_cents: 0 }
              as: AgencyProducer
              as_user_id: "${agency_id}"
              captures: { e1_id: $.data.id }
            - call: "POST /hnw/enrollments/${e1_id}/submit"
              payload: {}
              as: AgencyProducer
              as_user_id: "${agency_id}"
          trigger:
            - call: "POST /hnw/enrollments/${e1_id}/approve"
              payload: {}
              as: Underwriter
              captures: { e1_score: $.data.risk_score, e1_tier: $.data.risk_tier }
          assert:
            - "Enrollment.${e1_id}.risk_score == 470"
            - "Enrollment.${e1_id}.risk_tier == SURCHARGE, because 470 is at or above the 450 break point"
            - "the gross variant read through GET /hnw/enrollments/${e1_id}/underwriting-summary?view=GROSS returns 720 for the same row"
            - "an unmitigated sibling on the same zone scores 720 and lands in REFER"

      - name: replacement_cost_valuation_excludes_unapproved_appraisals
        claim_type: Input Set Filtering
        grounds:
          - calculations.replacement_cost_valuation
          - calculations.replacement_cost_valuation.input_set
          - entities.Appraisal.fields.percent_complete
        distinguishing_aspect: "Only APPROVED and SUPERSEDED rows contribute: three appraisals of which one is merely REVIEWED leave the drawn valuation at the approved figure, and moving the reviewed row to REJECTED changes nothing."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; a property with one approved 200000000 appraisal and a second appraisal of 90000000 sitting in REVIEWED."
          setup_api_calls:
            - *clk
            - *zone_extreme
            - *ag_base
            - *prop_base
            - *appr_200m
            - *appr_review
            - *appr_approve
            - call: "POST /hnw/properties/${p1_id}/appraisals"
              payload: { appraiser_name: "Second Opinion LLC", valuation_method: "SITE_MEASURED", appraised_on: "2026-08-25T00:00:00Z", dwelling_cost_cents: 90000000, contents_cost_cents: 0, valuation_confidence_pct: 80.0 }
              as: Underwriter
              captures: { appr2: $.data.id }
            - call: "POST /hnw/appraisals/${appr2}/review"
              payload: {}
              as: Underwriter
          trigger:
            - call: "GET /hnw/properties/${p1_id}"
              payload: {}
              as: Underwriter
              captures: { read_dwelling: $.data.dwelling_replacement_cost_cents }
          assert:
            - "Property.${p1_id}.dwelling_replacement_cost_cents == 200000000, so the REVIEWED 90000000 appraisal contributes nothing"
            - "after POST /hnw/appraisals/${appr2}/reject the figure is still 200000000"
            - "after POST /hnw/appraisals/${appr2}/approve the figure becomes 290000000 — a REVIEWED row contributes nothing until it is approved, and then it is summed rather than replacing"
            - "GET /hnw/properties/${p1_id}/appraisals?status=REVIEWED returns exactly 0 rows once the second appraisal is approved"

      - name: deductible_at_or_above_the_loss_leaves_nothing_to_settle
        claim_type: Precision
        grounds:
          - calculations.cash_settlement_valuation
          - state_machines.Claim.APPROVED_to_SETTLED
          - errors[ERR_CLAIM_BELOW_DEDUCTIBLE]
          - validations[priority=24]
        distinguishing_aspect: "The deductible is a percentage of Coverage A and is applied BEFORE the scarcity factor; a 2000000 indemnity on a 300000000 Coverage A wildfire claim faces a 6000000 deductible, so the deductible absorbs the whole loss and the settlement is refused rather than producing a zero or negative payout."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; a bound enrollment with Coverage A 300000000 and two reported wildfire claims, one for 3000000 and one for 9000000."
          setup_api_calls:
            - *clk
            - *zone_extreme
            - *ag_base
            - *prop_base
            - *appr_200m
            - *appr_review
            - *appr_approve
            - *posture_eval
            - call: "POST /hnw/properties/${p1_id}/mitigation-requirements"
              payload: { requirement_code: "DEFENSIBLE_SPACE", band_awarded: "CLEARED", source: "UNDERWRITING", due_on: "2026-12-01T00:00:00Z" }
              as: RiskConsultant
              captures: { mit_id: $.data.id }
            - call: "POST /hnw/mitigation-requirements/${mit_id}/verify"
              payload: { verified_band: "CLEARED", verification_count: 0 }
              as: RiskConsultant
            - call: "POST /hnw/properties/${p1_id}/enrollments"
              payload: { agency_id: "${agency_id}", dwelling_coverage_cents: 300000000, contents_coverage_cents: 0, scheduled_coverage_cents: 0, loss_of_use_coverage_cents: 0 }
              as: AgencyProducer
              as_user_id: "${agency_id}"
              captures: { e1_id: $.data.id }
            - call: "POST /hnw/enrollments/${e1_id}/submit"
              payload: {}
              as: AgencyProducer
              as_user_id: "${agency_id}"
            - call: "POST /hnw/enrollments/${e1_id}/approve"
              payload: {}
              as: Underwriter
            - *get_prop_v_attach
            - call: "POST /hnw/enrollments/${e1_id}/attach"
              payload: { expected_property_version: "${p1_va}" }
              as: Underwriter
            - call: "POST /hnw/enrollments/${e1_id}/claims"
              payload: { cause_of_loss: "WILDFIRE", loss_date: "2026-09-20T00:00:00Z", reported_indemnity_cents: 3000000, adjuster_user_id: "adj-morgan", adjuster_override: false }
              as: ClaimsAdjuster
              captures: { c1_id: $.data.id }
            - call: "POST /hnw/claims/${c1_id}/review"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /hnw/enrollments/${e1_id}/claims"
              payload: { cause_of_loss: "WILDFIRE", loss_date: "2026-09-21T00:00:00Z", reported_indemnity_cents: 9000000, adjuster_user_id: "adj-morgan", adjuster_override: false }
              as: ClaimsAdjuster
              captures: { c2_id: $.data.id }
            - call: "POST /hnw/claims/${c2_id}/review"
              payload: {}
              as: ClaimsAdjuster
          trigger:
            - call: "POST /hnw/claims/${c1_id}/approve"
              payload: {}
              as: ClaimsAdjuster
              captures: { error_id: $.data.error_id }
          assert:
            - "the 3000000 claim is refused with status 422 and error_id == ERR_CLAIM_BELOW_DEDUCTIBLE, because the wildfire deductible of 6000000 equals or exceeds the loss"
            - "Claim.${c1_id}.status is still UNDER_REVIEW and settlement_amount_cents is 0"
            - "the 9000000 claim is accepted with settlement_amount_cents == 9000000 and deductible_applied_cents == 6000000, so the strictly-greater-than rule lets the larger loss through"

  # ===========================================================================
  - section: validations
    instances:

      - name: write_frozen_priority_conflict_is_covered_by_difficulty_design
        claim_type: Priority Ordering
        grounds:
          - validations[priority=4]
          - validations[priority=14]
          - errors[ERR_WRITE_FROZEN]
        excluded_because:
          difficulty_instance: write_frozen_outranks_coverage_below_required_when_zone_is_below_population_minimum
          rationale: "The business_safety versus business_constraint priority pair on POST /hnw/enrollments/{id}/attach is asserted as that §1.8 instance's dual-failure trigger."

      - name: notice_period_priority_conflict_is_covered_by_difficulty_design
        claim_type: Priority Ordering
        grounds:
          - validations[priority=10]
          - validations[priority=15]
          - errors[ERR_NOTICE_PERIOD_INSUFFICIENT]
        excluded_because:
          difficulty_instance: notice_period_insufficient_outranks_ground_not_actionable
          rationale: "The business_temporal versus business_fiscal ordering on POST /hnw/non-renewal-notices/{id}/issue is asserted there."

      - name: mitigation_verified_after_due_on_returns_lapsed
        claim_type: Violation → Error
        grounds:
          - validations[priority=11]
          - errors[ERR_MITIGATION_LAPSED]
          - state_machines.Property.MITIGATION_REQUIRED_to_DECLINED
        distinguishing_aspect: "The due_on boundary is strict: verifying on the due date itself passes the clock precondition, while verifying one day later is refused with ERR_MITIGATION_LAPSED and the property has already fallen to DECLINED."
        test_recipe:
          setup:
            - "Logical clock at 2026-12-02T00:00:00Z; a requirement imposed with due_on 2026-12-01T00:00:00Z that has already lapsed."
          setup_api_calls:
            - *clk
            - *zone_extreme
            - *ag_base
            - *prop_base
            - *appr_200m
            - *appr_review
            - *appr_approve
            - *posture_eval
            - call: "POST /hnw/properties/${p1_id}/mitigation-requirements"
              payload: { requirement_code: "FIRE_RESISTANT_ROOF", band_awarded: "CLEARED", source: "RISK_CONSULTANT", due_on: "2026-12-01T00:00:00Z" }
              as: RiskConsultant
              captures: { mit_id: $.data.id, mit_status: $.data.status }
            - call: "POST /hnw/_clock/set_current_utc"
              payload: { current_utc: "2026-12-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /hnw/mitigation-requirements/${mit_id}/verify"
              payload: { verified_band: "CLEARED", verification_count: 0 }
              as: RiskConsultant
              captures: { error_id: $.data.error_id }
          assert:
            - "the verify is refused with status 422 and error_id == ERR_MITIGATION_LAPSED"
            - "MitigationRequirement.${mit_id}.status is no longer IMPOSED and verified_on is null"
            - "Property.${p1_id}.base_posture == DECLINED and posture == WRITE_FROZEN once the clock passed the only open requirement's due_on"
            - "Property.${p1_id}.mitigation_band == FAILED because a lapsed requirement drives the band to FAILED rather than leaving it UNVERIFIED"

      - name: expired_appraisal_document_blocks_scheduled_item_approval
        claim_type: Violation → Error
        grounds:
          - validations[priority=18]
          - errors[ERR_APPRAISAL_CURRENCY_EXPIRED]
          - entities.AppraisalDocument.fields.currency_status
        distinguishing_aspect: "Appraisal currency is a read-time derivation, so the same untouched document flips from AGING to EXPIRED purely by moving the clock past 24 months, and the approval that succeeded before that instant is refused after it."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one jewelry document dated 2024-09-15 and one pending scheduled item referencing it."
          setup_api_calls:
            - *clk
            - *zone_extreme
            - *ag_base
            - *prop_base
            - call: "POST /hnw/properties/${p1_id}/appraisal-documents"
              payload: { item_class: "JEWELRY", appraiser_name: "Corner Jewels", appraisal_date: "2024-09-15T00:00:00Z", appraised_value_cents: 60000000 }
              as: Underwriter
              captures: { doc_id: $.data.id }
            - call: "POST /hnw/properties/${p1_id}/scheduled-items"
              payload: { item_type: "JEWELRY", declared_value_cents: 50000000, appraisal_doc_id: "${doc_id}" }
              as: AgencyProducer
              as_user_id: "${agency_id}"
              captures: { si_id: $.data.id }
            - call: "POST /hnw/_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /hnw/scheduled-items/${si_id}/approve"
              payload: {}
              as: Underwriter
              captures: { error_id: $.data.error_id }
          assert:
            - "AppraisalDocument.${doc_id}.currency_months == 24 and currency_status == EXPIRED at a clock of 2026-10-01 with an appraisal_date of 2024-09-15"
            - "the approval is refused with status 422 and error_id == ERR_APPRAISAL_CURRENCY_EXPIRED"
            - "ScheduledItem.${si_id}.status is still PENDING and attached_value_cents is 0"
            - "the same approval at a clock of 2026-09-01 succeeds, when the document reads AGING rather than EXPIRED"

      - name: stale_valuation_fingerprint_blocks_attach
        claim_type: Violation → Error
        grounds:
          - validations[priority=16]
          - errors[ERR_VALUATION_STALE]
          - entities.Enrollment.fields.valuation_fingerprint
        distinguishing_aspect: "The fingerprint of approved dwelling, contents and scheduled values is snapshotted at approval, so approving a new scheduled item between approval and attach invalidates it and the attach is refused with ERR_VALUATION_STALE rather than silently binding coverage derived from a superseded valuation."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; an enrollment approved while its property valuation was 200000000, then a further 50000000 scheduled item approved before the attach."
          setup_api_calls:
            - *clk
            - *zone_extreme
            - *ag_base
            - *prop_base
            - *appr_200m
            - *appr_review
            - *appr_approve
            - *posture_eval
            - call: "POST /hnw/properties/${p1_id}/enrollments"
              payload: { agency_id: "${agency_id}", dwelling_coverage_cents: 300000000, contents_coverage_cents: 0, scheduled_coverage_cents: 0, loss_of_use_coverage_cents: 0 }
              as: AgencyProducer
              as_user_id: "${agency_id}"
              captures: { e1_id: $.data.id }
            - call: "POST /hnw/enrollments/${e1_id}/submit"
              payload: {}
              as: AgencyProducer
              as_user_id: "${agency_id}"
            - call: "POST /hnw/enrollments/${e1_id}/approve"
              payload: {}
              as: Underwriter
            - call: "POST /hnw/properties/${p1_id}/appraisal-documents"
              payload: { item_class: "FINE_ART", appraiser_name: "Corner Fine Art", appraisal_date: "2026-08-28T00:00:00Z", appraised_value_cents: 60000000 }
              as: Underwriter
              captures: { doc_id: $.data.id }
            - call: "POST /hnw/properties/${p1_id}/scheduled-items"
              payload: { item_type: "FINE_ART", declared_value_cents: 50000000, appraisal_doc_id: "${doc_id}" }
              as: AgencyProducer
              as_user_id: "${agency_id}"
              captures: { si_id: $.data.id }
            - call: "POST /hnw/scheduled-items/${si_id}/approve"
              payload: {}
              as: Underwriter
            - *get_prop_v_attach
          trigger:
            - call: "POST /hnw/enrollments/${e1_id}/attach"
              payload: { expected_property_version: "${p1_va}" }
              as: Underwriter
              captures: { error_id: $.data.error_id }
          assert:
            - "the attach is refused with status 422 and error_id == ERR_VALUATION_STALE"
            - "error_id != ERR_STALE_VERSION, because the OCC guard was satisfied by a freshly read version — the failure is the fingerprint, not staleness of the version"
            - "Enrollment.${e1_id}.status is still APPROVED and bound_at is null"
            - "after POST /hnw/enrollments/${e1_id}/recall, submit, approve and attach, the same enrollment binds, and the re-approval snapshots required_dwelling_coverage_cents at 300000000"

      - name: inactive_agency_cannot_submit_or_recall
        claim_type: Violation → Error
        grounds:
          - validations[priority=19]
          - errors[ERR_AGENCY_INACTIVE]
          - state_machines.Enrollment.DRAFT_to_SUBMITTED
        distinguishing_aspect: "Agency inactivity gates the producer-scoped writes only: an inactive agency cannot submit its drafts, but the same enrollment's APPROVED row can still be attached by an underwriter once it is approved — the flag is an agency-level brake, not a policy-level one."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; an agency deactivated after one DRAFT enrollment was opened."
          setup_api_calls:
            - *clk
            - *zone_extreme
            - *ag_base
            - *prop_base
            - *appr_200m
            - *appr_review
            - *appr_approve
            - *posture_eval
            - call: "POST /hnw/properties/${p1_id}/enrollments"
              payload: { agency_id: "${agency_id}", dwelling_coverage_cents: 300000000, contents_coverage_cents: 0, scheduled_coverage_cents: 0, loss_of_use_coverage_cents: 0 }
              as: AgencyProducer
              as_user_id: "${agency_id}"
              captures: { e1_id: $.data.id }
            - call: "POST /hnw/agencies/${agency_id}/set-active"
              payload: { active: false }
              as: PlatformAdmin
          trigger:
            - call: "POST /hnw/enrollments/${e1_id}/submit"
              payload: {}
              as: AgencyProducer
              as_user_id: "${agency_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the submit is refused with status 409 and error_id == ERR_AGENCY_INACTIVE"
            - "Enrollment.${e1_id}.status is still DRAFT"
            - "after POST /hnw/agencies/${agency_id}/set-active with active true the submit succeeds with status 200"

  # ===========================================================================
  - section: endpoints
    instances:

      - name: underwriting_summary_is_a_pure_read_that_never_rewrites_the_snapshot
        claim_type: Computed read
        grounds:
          - endpoints.GET_/hnw/enrollments/{id}/underwriting-summary
          - entities.Enrollment.fields.risk_score
        excluded_because:
          difficulty_instance: concentration_ratio_variant_zone_scope_versus_agency_scope
          rationale: "The stale-version read that this endpoint performs, and its agreement with the snapshotted risk_score, are asserted as part of that §1.8 instance's assert block."

      - name: endorsement_with_a_conflicting_provision_is_refused
        claim_type: Conditional action
        grounds:
          - endpoints.POST_/hnw/enrollments/{id}/endorsements
          - errors[ERR_INCOMPATIBLE_ENDORSEMENT]
          - validations[priority=25]
        distinguishing_aspect: "The endorsement endpoint is conditional on the enrollment's snapshotted provision: an endorsement demanding GUARANTEED is refused on an EXTENDED enrollment, and accepted once the enrollment carries GUARANTEED — so the same payload succeeds or fails purely on the snapshotted state."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; a mitigation-cleared property with an APPROVED EXTENDED enrollment."
          setup_api_calls:
            - *clk
            - *zone_extreme
            - *ag_base
            - *prop_base
            - *appr_200m
            - *appr_review
            - *appr_approve
            - *posture_eval
            - call: "POST /hnw/properties/${p1_id}/mitigation-requirements"
              payload: { requirement_code: "DEFENSIBLE_SPACE", band_awarded: "CLEARED", source: "UNDERWRITING", due_on: "2026-12-01T00:00:00Z" }
              as: RiskConsultant
              captures: { mit_id: $.data.id }
            - call: "POST /hnw/mitigation-requirements/${mit_id}/verify"
              payload: { verified_band: "CLEARED", verification_count: 0 }
              as: RiskConsultant
            - call: "POST /hnw/properties/${p1_id}/enrollments"
              payload: { agency_id: "${agency_id}", dwelling_coverage_cents: 300000000, contents_coverage_cents: 0, scheduled_coverage_cents: 0, loss_of_use_coverage_cents: 0 }
              as: AgencyProducer
              as_user_id: "${agency_id}"
              captures: { e1_id: $.data.id }
            - call: "POST /hnw/enrollments/${e1_id}/submit"
              payload: {}
              as: AgencyProducer
              as_user_id: "${agency_id}"
            - call: "POST /hnw/enrollments/${e1_id}/approve"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /hnw/enrollments/${e1_id}/endorsements"
              payload: { endorsement_code: "SUPERIOR_PROTECTION", required_provision: "GUARANTEED" }
              as: Underwriter
              captures: { error_id: $.data.error_id }
          assert:
            - "the endorsement is refused with status 422 and error_id == ERR_INCOMPATIBLE_ENDORSEMENT while the enrollment's provision is EXTENDED"
            - "an endorsement with required_provision EXTENDED is accepted with status 201 and void_on_recall == true"
            - "after POST /hnw/enrollments/${e1_id}/recall the previously granted endorsement is void"

      - name: claim_settlement_releases_the_property_scheduled_property
        claim_type: Action endpoint side effects
        grounds:
          - endpoints.POST_/hnw/claims/{id}/settle
          - entities.Property.fields.scheduled_valuation_cents
        excluded_because:
          difficulty_instance: scheduled_item_attachment_is_gated_on_the_property_enrollment
          rationale: "The settlement-driven detach and the resulting scheduled valuation recompute are asserted there."

      - name: withdraw_is_idempotent_in_effect_but_refused_on_the_second_call
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/hnw/enrollments/{id}/withdraw
          - state_machines.Enrollment.DRAFT_to_WITHDRAWN
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Withdraw is a producer-scoped transition out of DRAFT or SUBMITTED only, so a second withdrawal on the resulting WITHDRAWN row is a state rejection and the committed reserve stays at 0 rather than being recomputed twice."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; a property with one DRAFT enrollment belonging to the acting agency."
          setup_api_calls:
            - *clk
            - *zone_extreme
            - *ag_base
            - *prop_base
            - call: "POST /hnw/properties/${p1_id}/enrollments"
              payload: { agency_id: "${agency_id}", dwelling_coverage_cents: 250000000, contents_coverage_cents: 0, scheduled_coverage_cents: 0, loss_of_use_coverage_cents: 0 }
              as: AgencyProducer
              as_user_id: "${agency_id}"
              captures: { e1_id: $.data.id, e1_reserve: $.data.committed_reserve_cents }
          trigger:
            - call: "POST /hnw/enrollments/${e1_id}/withdraw"
              payload: {}
              as: AgencyProducer
              as_user_id: "${agency_id}"
          assert:
            - "Enrollment.${e1_id}.committed_reserve_cents was 250000000 in DRAFT and is 0 after the withdrawal, even though the enrollment is not bound"
            - "the withdraw succeeds with status 200 and Enrollment.${e1_id}.status == WITHDRAWN"
            - "a second POST /hnw/enrollments/${e1_id}/withdraw is refused with status 409 and error_id == ERR_INVALID_STATE"
            - "an underwriter acting on the same enrollment with X-User-Role Underwriter is refused with 403 ERR_FORBIDDEN, because withdraw is a producer-exclusive operation"
  # ===========================================================================
  - section: errors
    instances:

      - name: every_error_code_is_reachable_from_a_declared_endpoint
        claim_type: Violation → Error
        grounds:
          - errors[ERR_AGENCY_NOT_OF_RECORD]
          - errors[ERR_APPRAISAL_METHOD_INVALID]
          - errors[ERR_APPRAISAL_PROVISION_BASELINE]
          - errors[ERR_APPRAISAL_DOC_MISMATCH]
          - errors[ERR_ZONE_EVENT_INACTIVE]
          - errors[ERR_NO_ELIGIBLE_VENDOR]
          - errors[ERR_BRANCH_CAPITAL_INSUFFICIENT]
          - errors[ERR_GROUND_NOT_ACTIONABLE]
        distinguishing_aspect: "The eight error codes not asserted by any §1.8 instance are each produced by a distinct end state on a distinct endpoint, so the catalog has no orphan entry: agency mismatch on a producer write, a non-site appraisal approval, a provision without a 1.25x baseline, a cross-property document, an inactive zone event, an empty vendor pool, an under-capitalised reopen, and an unactionable non-renewal ground."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; a property on a NORMAL-band OR zone with an approved 200000000 appraisal in SITE_MEASURED."
          setup_api_calls:
            - *clk
            - call: "POST /hnw/risk-zones"
              payload: { zone_code: "ZU1", state_code: "OR", wildland_urban_interface_band: "OUTSIDE_WUI", sustained_wind_mph: 20, mitigation_band_multiplier: 1.0, mitigated_loss_multiplier: 1.0, exposure_band: "STANDARD" }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - *ag_base
            - *prop_base
            - *appr_200m
            - *appr_review
            - *appr_approve
            - *posture_eval
            - call: "POST /hnw/properties/${p1_id}/enrollments"
              payload: { agency_id: "${agency_id}", dwelling_coverage_cents: 250000000, contents_coverage_cents: 0, scheduled_coverage_cents: 0, loss_of_use_coverage_cents: 0 }
              as: AgencyProducer
              as_user_id: "${agency_id}"
              captures: { e1_id: $.data.id }
          trigger:
            - call: "POST /hnw/enrollments/${e1_id}/submit"
              payload: {}
              as: AgencyProducer
              as_user_id: "some-other-agency-id"
              captures: { error_id: $.data.error_id }
          assert:
            - "the submit is refused with status 403 and error_id == ERR_AGENCY_NOT_OF_RECORD, because X-User-ID names an agency other than the enrollment's agency of record"
            - "POST /hnw/wildfire-events/properties/${p1_id}/dispatch-request on a zone whose state_event is NONE is refused with 422 ERR_ZONE_EVENT_INACTIVE"
            - "POST /hnw/wildfire-events/vendors/poll on that same zone is refused with 422 ERR_NO_ELIGIBLE_VENDOR"
            - "POST /hnw/properties/${p1_id}/reopen on a zone whose mitigated_loss_multiplier is 1.20 is refused with 422 ERR_BRANCH_CAPITAL_INSUFFICIENT"
            - "POST /hnw/enrollments/${e1_id}/submit against the MITIGATION_FAILURE ground path is unaffected, but POST /hnw/non-renewal-notices against an unactionable ground is refused with 422 ERR_GROUND_NOT_ACTIONABLE"

      - name: unrecognized_role_is_refused_before_any_resource_lookup
        claim_type: Violation → Error
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_FORBIDDEN]
          - validations[priority=1]
          - validations[priority=2]
        distinguishing_aspect: "The authentication gate fires first: a request that both omits its role header and points at a nonexistent resource returns 401 ERR_UNAUTHENTICATED rather than 404, so priority 1 genuinely precedes priority 3."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; no resources exist at all."
          setup_api_calls:
            - *clk
          trigger:
            - call: "GET /hnw/properties/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Anonymous
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 401 and error_id == ERR_UNAUTHENTICATED, not 404 ERR_NOT_FOUND"
            - "a request carrying a recognized role for a resource the role may read but with a nonexistent id returns 404 ERR_NOT_FOUND instead"
            - "a request carrying a recognized role that is not listed on the endpoint returns 403 ERR_FORBIDDEN"

  # ===========================================================================
  - section: rbac
    instances:

      - name: agency_producer_cannot_reach_the_underwriting_write_surface
        claim_type: exclusive_operations
        grounds:
          - roles[AgencyProducer]
          - roles[Underwriter]
          - errors[ERR_FORBIDDEN]
          - validations[priority=2]
        distinguishing_aspect: "The producer role is refused on every underwriter-exclusive write — posture evaluation, appraisal approval, attachment, vendor polling and non-renewal issue — so the two roles' write surfaces do not overlap at all."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; a property with an approved appraisal and a submitted enrollment, all created by an underwriter."
          setup_api_calls:
            - *clk
            - *zone_extreme
            - *ag_base
            - *prop_base
            - *appr_200m
            - *appr_review
            - *appr_approve
            - *posture_eval
            - call: "POST /hnw/properties/${p1_id}/enrollments"
              payload: { agency_id: "${agency_id}", dwelling_coverage_cents: 300000000, contents_coverage_cents: 0, scheduled_coverage_cents: 0, loss_of_use_coverage_cents: 0 }
              as: AgencyProducer
              as_user_id: "${agency_id}"
              captures: { e1_id: $.data.id }
          trigger:
            - call: "POST /hnw/enrollments/${e1_id}/approve"
              payload: {}
              as: AgencyProducer
              as_user_id: "${agency_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the approve is refused with status 403 and error_id == ERR_FORBIDDEN"
            - "POST /hnw/properties/${p1_id}/posture-eval as AgencyProducer returns 403 ERR_FORBIDDEN"
            - "POST /hnw/wildfire-events/vendors/poll as AgencyProducer returns 403 ERR_FORBIDDEN"
            - "POST /hnw/non-renewal-notices/${n1_id}/issue as AgencyProducer returns 403 ERR_FORBIDDEN"
            - "the producer CAN still read the enrollment through GET /hnw/enrollments/${e1_id} with status 200"

      - name: risk_consultant_cannot_impose_a_compliance_decision
        claim_type: peer_roles
        grounds:
          - roles[RiskConsultant]
          - roles[Underwriter]
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "Risk consultancies own verification and the visit lifecycle but not the underwriting decision: the consultant may impose a requirement and verify it, yet cannot approve an appraisal or attach an enrollment."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; a property with a REVIEWED appraisal the consultant will attempt to approve."
          setup_api_calls:
            - *clk
            - *zone_extreme
            - *ag_base
            - *prop_base
            - *appr_200m
            - *appr_review
          trigger:
            - call: "POST /hnw/appraisals/${appr_id}/approve"
              payload: {}
              as: RiskConsultant
              captures: { error_id: $.data.error_id }
          assert:
            - "the approve is refused with status 403 and error_id == ERR_FORBIDDEN"
            - "the consultant CAN impose a requirement: POST /hnw/properties/${p1_id}/mitigation-requirements returns 201"
            - "the consultant CAN verify it: POST /hnw/mitigation-requirements/${mit_id}/verify returns 200"
            - "the consultant CANNOT waive it: POST /hnw/mitigation-requirements/${mit_id}/waive returns 403 ERR_FORBIDDEN"

      - name: claims_adjuster_cannot_underwrite_and_underwriter_cannot_adjust
        claim_type: peer_roles
        grounds:
          - roles[ClaimsAdjuster]
          - roles[Underwriter]
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "Claims and underwriting are disjoint peer surfaces in both directions: the adjuster cannot approve an enrollment and the underwriter cannot approve a claim, so neither role is a superset of the other."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; one submitted enrollment and one reported claim on a bound sibling enrollment."
          setup_api_calls:
