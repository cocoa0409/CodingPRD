              payload: {}
              as: NetworkAdmin
              captures: { sv_b: "$.data.version" }
          trigger:
            - call: "POST /oversize-freight/appointments"
              payload: { shipment_id: "${ship2}", window_start: "2026-09-12T11:00:00Z", window_end: "2026-09-12T14:00:00Z", crew_id: "CREW-1", expected_shipment_version: "${sv_b}" }
              as: HubOperator
              captures: { err_ov: "$.data.error_id" }
            - call: "POST /oversize-freight/appointments"
              payload: { shipment_id: "${ship2}", window_start: "2026-09-12T12:00:00Z", window_end: "2026-09-12T15:00:00Z", crew_id: "CREW-1", expected_shipment_version: "${sv_b}" }
              as: HubOperator
              captures: { appt2: "$.data.id" }
          assert:
            - "the overlapping 11:00–14:00 booking is rejected 409 and err_ov == ERR_APPOINTMENT_OVERLAP; the failed attempt does not consume the OCC version"
            - "the back-to-back 12:00–15:00 booking succeeds (201) — half-open semantics treat shared endpoints as non-overlapping"
            - "DeliveryAppointment.${appt2}.status == BOOKED"

      - name: hub_daily_capacity_whole_date_overlap
        grounds:
          - validations[priority=12]
          - entities.Hub.fields.daily_capacity
          - errors.ERR_HUB_DAILY_CAPACITY_EXCEEDED
        distinguishing_aspect: |
          DIFFERENT interval semantics from the crew window: whole-calendar-
          date aggregate overlap on resource Hub — any two linehauls arriving
          the same date overlap fully regardless of clock time, so with
          daily_capacity 1 the second ARRIVE on 2026-09-05 is rejected while
          an arrival on 2026-09-06 (disjoint date) succeeds.
        test_recipe:
          setup:
            - "Hub HUB-C2 daily_capacity 1. Linehaul LA ARRIVED on 2026-09-05; LB DEPARTED for the same date 2026-09-05; LC DEPARTED for 2026-09-06."
          setup_api_calls:
            - *d_clock
            - call: "POST /oversize-freight/hubs"
              payload: { hub_code: "HUB-C2", name: "Cap Hub 2", serves_zones: ["ZONE_NE"], white_glove_capable: false, daily_capacity: 1 }
              as: NetworkAdmin
              captures: { hubc2: "$.data.id" }
            - call: "POST /oversize-freight/linehauls"
              payload: { hub_id: "${hubc2}", planned_arrival_date: "2026-09-05", origin_ship_date: "2026-09-03", capacity: 5 }
              as: NetworkAdmin
              captures: { la: "$.data.id" }
            - call: "POST /oversize-freight/linehauls/${la}/depart"
              payload: {}
              as: NetworkAdmin
            - call: "POST /oversize-freight/linehauls/${la}/arrive"
              payload: {}
              as: HubOperator
            - call: "POST /oversize-freight/linehauls"
              payload: { hub_id: "${hubc2}", planned_arrival_date: "2026-09-05", origin_ship_date: "2026-09-03", capacity: 5 }
              as: NetworkAdmin
              captures: { lb: "$.data.id" }
            - call: "POST /oversize-freight/linehauls/${lb}/depart"
              payload: {}
              as: NetworkAdmin
            - call: "POST /oversize-freight/linehauls"
              payload: { hub_id: "${hubc2}", planned_arrival_date: "2026-09-06", origin_ship_date: "2026-09-04", capacity: 5 }
              as: NetworkAdmin
              captures: { lc: "$.data.id" }
            - call: "POST /oversize-freight/linehauls/${lc}/depart"
              payload: {}
              as: NetworkAdmin
          trigger:
            - call: "POST /oversize-freight/linehauls/${lb}/arrive"
              payload: {}
              as: HubOperator
              captures: { err_cap: "$.data.error_id" }
            - call: "POST /oversize-freight/linehauls/${lc}/arrive"
              payload: {}
              as: HubOperator
          assert:
            - "LB arrive is rejected 409 and err_cap == ERR_HUB_DAILY_CAPACITY_EXCEEDED (same-date aggregate cap)"
            - "LC arrive succeeds (200) and Linehaul.${lc}.status == ARRIVED — 2026-09-06 is a disjoint date bucket"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: linehaul_slot_commit_release_conserves_capacity
        grounds:
          - state_machines.Order.ROUTED_to_CANCELLED
          - entities.Linehaul.fields.committed_count
          - entities.Linehaul.fields.capacity
        distinguishing_aspect: |
          Conserved quantity: linehaul free slots (capacity −
          committed_count). Routing an OWNED_FINAL_MILE order increments
          committed_count by 1; cancelling that order decrements it by
          exactly 1 — capacity − committed_count is invariant across the
          create+cancel pair.
        test_recipe:
          setup:
            - "Linehaul L1 capacity 10, committed_count 0. Routed OWNED_FINAL_MILE order consumes one slot."
          setup_api_calls:
            - *d_clock
            - *d_sup
            - *d_hub
            - *d_lane_ltl
            - *d_item
            - *d_cust
            - *d_linehaul
            - *d_order
          trigger:
            - call: "GET /oversize-freight/linehauls/${lh_id}"
              payload: {}
              as: NetworkAdmin
              captures: { lh_committed: "$.data.committed_count" }
            - call: "POST /oversize-freight/orders/${order_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /oversize-freight/linehauls/${lh_id}"
              payload: {}
              as: NetworkAdmin
              captures: { lh_after: "$.data.committed_count" }
          assert:
            - "lh_committed == 1 after routing (one slot consumed)"
            - "lh_after == 0 after cancel — capacity (10) − committed_count is invariant across the create+cancel pair"
            - "Order.${order_id}.order_state == CANCELLED and fulfillment_state == NONE"

      - name: chargeback_dispute_reverse_conserves_supplier_ledger
        grounds:
          - state_machines.Chargeback
          - calculations.supplier_compliance_score
          - entities.Supplier.fields.chargeback_rate
        distinguishing_aspect: |
          Different conserved quantity — the supplier chargeback ledger: a
          determined CONCEALED claim creates a PENDING chargeback (48000c)
          that never enters the rate numerator, and the dispute → reverse
          compensation returns chargeback_rate to exactly 0.00 and
          compliance_score to 100.00 — zero drift across the pair.
        test_recipe:
          setup:
            - "Delivered order; determined CONCEALED claim (PENDING chargeback 48000c) on supplier SUP-A, whose metrics start at rate 0.00 / score 100.00."
          setup_api_calls:
            - *d_clock
            - *d_sup
            - *d_hub
            - *d_lane_ltl
            - *d_item
            - *d_cust
            - *d_linehaul
            - *d_order
            - *d_ship_list
            - *d_depart
            - *d_lh_depart
            - *d_lh_arrive
            - *d_appt
            - *d_complete
            - call: "POST /oversize-freight/damage-claims"
              payload: { shipment_id: "${ship_id}", claimant_role: "CUSTOMER", concealment: "CONCEALED" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim_i: "$.data.id" }
            - call: "POST /oversize-freight/damage-claims/${claim_i}/inspect"
              payload: { damage_pct: 20, is_structural: false, repair_cost_cents: 20000 }
              as: HubOperator
            - call: "POST /oversize-freight/damage-claims/${claim_i}/determine"
              payload: {}
              as: ClaimsAdjuster
            - call: "GET /oversize-freight/chargebacks"
              payload: { damage_claim_id: "${claim_i}" }
              as: NetworkAdmin
              captures: { cb_i: "$.data[0].id" }
            - call: "GET /oversize-freight/suppliers/${sup_id}"
              payload: {}
              as: NetworkAdmin
              captures: { sup_pre_rate: "$.data.chargeback_rate", sup_pre_score: "$.data.compliance_score" }
          trigger:
            - call: "POST /oversize-freight/chargebacks/${cb_i}/dispute"
              payload: {}
              as: SupplierRep
              as_user_id: "${sup_id}"
            - call: "POST /oversize-freight/chargebacks/${cb_i}/reverse"
              payload: {}
              as: NetworkAdmin
            - call: "GET /oversize-freight/suppliers/${sup_id}"
              payload: {}
              as: NetworkAdmin
              captures: { sup_post_rate: "$.data.chargeback_rate", sup_post_score: "$.data.compliance_score" }
          assert:
            - "sup_pre_rate == 0.00 (PENDING chargebacks never enter the rate)"
            - "sup_post_rate == 0.00 after dispute+reverse — the pair restores the pre-claim ledger position exactly"
            - "sup_post_score == 100.00 and Supplier.${sup_id}.status == ACTIVE (no drift)"
