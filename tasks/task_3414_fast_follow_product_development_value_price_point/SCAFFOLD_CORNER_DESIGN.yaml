            - *c_rev_reg2
            - *c_pack
            - *c_prod_ready
            - *c_partner
            - *c_lr
            - *c_clock2
            - *c_lr_open
            - *c_slot
            - *c_plan
          trigger:
            - call: "PATCH /launch-plans/${plan_id}"
              payload: { sampling_status: "PLANNED" }
              as: ProductManager
              as_user_id: "pm-nadia"
              captures: { err_role1: $.data.error_id }
            - call: "PATCH /launch-plans/${plan_id}"
              payload: { status: "QUANTITY_LOCKED", variant: "DEMAND" }
              as: MarketingLead
              as_user_id: "ml-kai"
              captures: { err_role2: $.data.error_id }
            - call: "PATCH /launch-plans/${plan_id}"
              payload: { sampling_status: "PLANNED" }
              as: MarketingLead
              as_user_id: "ml-kai"
              captures: { err_role3: $.data.error_id }
          assert:
            - "err_role1 == ERR_FORBIDDEN_ROLE (403)  (ProductManager cannot touch sampling fields)"
            - "err_role2 == ERR_FORBIDDEN_ROLE (403)  (MarketingLead cannot touch status/variant)"
            - "err_role3 == ERR_INVALID_STATE (409)  (role passed; the DRAFT plan cannot enter PLANNED)"
            - "LaunchPlan.${plan_id}.status == DRAFT and sampling_status == NONE throughout"

      - name: sourcing_lead_cannot_create_retail_partner_but_can_read
        claim_type: RBAC denial
        grounds:
          - roles[SourcingLead]
          - roles[RetailPlanner]
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: "Peer-role resource ownership: SourcingLead's create on the RetailPlanner-owned resource is 403, while the shared read surface still returns the partner to the same SourcingLead."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Partner ValueMart exists (created by RetailPlanner)."
          setup_api_calls:
            - *c_clock
            - *c_partner
          trigger:
            - call: "POST /retail-partners"
              payload: { name: "Intruder Beauty", banner_code: "IB", category_capacities: { EYES: 4 } }
              as: SourcingLead
              as_user_id: "sl-omar"
              captures: { err_peer: $.data.error_id }
            - call: "GET /retail-partners/${partner_id}"
              payload: {}
              as: SourcingLead
              as_user_id: "sl-omar"
              captures: { peer_read: $.data.id }
          assert:
            - "the create returns 403 and err_peer == ERR_FORBIDDEN_ROLE"
            - "the read returns 200 and peer_read == ${partner_id}  (GET endpoints are shared by all roles)"

      - name: quote_withdraw_restricted_to_owning_manufacturer_rep
        claim_type: RBAC denial
        grounds:
          - roles[ManufacturerRep]
          - state_machines.CostQuote.UNDER_EVALUATION_to_WITHDRAWN
          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: "Ownership scoping inside an allowed role: WITHDRAWN is a ManufacturerRep-only target AND requires X-User-ID == the quote's CM — another CM's rep and even the SourcingLead are both 403, while the owning rep succeeds."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Product in SOURCING. Quote B from CM SecondSource Labs sits UNDER_EVALUATION."
          setup_api_calls:
            - *c_clock
            - *c_trend
            - *c_trend_eval
            - *c_trend_select
            - *c_concept
            - *c_concept_select
            - *c_cm
            - *c_product
            - *c_fp
            - *c_fp_sample
            - *c_fp_approve
            - *c_prod_sourcing
            - *c_quote
            - call: "POST /manufacturers"
              payload: { name: "SecondSource Labs", capabilities: ["EYES"], base_lead_time_weeks: 6, moq_units: 500, quality_tier: "STANDARD", capacity_slots_per_quarter: 4 }
              as: SourcingLead
              as_user_id: "sl-omar"
              captures: { cm2_id: $.data.id }
            - call: "GET /products/${product_id}"
              payload: {}
              as: SourcingLead
              as_user_id: "sl-omar"
              captures: { product_v3: $.data.version }
            - call: "POST /cost-quotes"
              payload: { product_id: "${product_id}", contract_manufacturer_id: "${cm2_id}", unit_cost_cents: 210, tooling_fee_cents: 10000, freight_total_cents: 40000, unit_weight_grams: 50, shipment_weight_grams: 500000, duty_rate: 0.10, initial_order_qty: 1000, valid_until: "2026-12-31T00:00:00Z", production_quarter: "2026-Q4", expected_product_version: "${product_v3}" }
              as: ManufacturerRep
              as_user_id: "${cm2_id}"
              captures: { quote_b: $.data.id }
            - call: "PATCH /cost-quotes/${quote_b}"
              payload: { status: "UNDER_EVALUATION" }
              as: SourcingLead
              as_user_id: "sl-omar"
          trigger:
            - call: "PATCH /cost-quotes/${quote_b}"
              payload: { status: "WITHDRAWN" }
              as: ManufacturerRep
              as_user_id: "${cm_id}"
              captures: { err_w1: $.data.error_id }
            - call: "PATCH /cost-quotes/${quote_b}"
              payload: { status: "WITHDRAWN" }
              as: SourcingLead
              as_user_id: "sl-omar"
              captures: { err_w2: $.data.error_id }
            - call: "PATCH /cost-quotes/${quote_b}"
              payload: { status: "WITHDRAWN" }
              as: ManufacturerRep
              as_user_id: "${cm2_id}"
          assert:
            - "err_w1 == ERR_FORBIDDEN_ROLE (403)  (rep of FastLab cannot withdraw SecondSource's quote)"
            - "err_w2 == ERR_FORBIDDEN_ROLE (403)  (WITHDRAWN is not a SourcingLead target)"
            - "the third call returns 200 and CostQuote.${quote_b}.status == WITHDRAWN  (owning rep succeeds)"

  - section: cross_cutting
    instances:
      - name: quote_create_bumps_product_version_observably
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[quote-create-stale-product]
          - endpoints.POST_/cost-quotes
        distinguishing_aspect: "The OCC parent version is observable: the product reads version 2 after the SOURCING transition, and a successful quote create advances it to 3 — giving clients (and tests) the stale-version signal the 412 rule keys on."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Product in SOURCING (version 2)."
          setup_api_calls:
            - *c_clock
            - *c_trend
            - *c_trend_eval
            - *c_trend_select
            - *c_concept
            - *c_concept_select
            - *c_cm
            - *c_product
            - *c_fp
            - *c_fp_sample
            - *c_fp_approve
            - *c_prod_sourcing
          trigger:
            - *c_quote
            - call: "GET /products/${product_id}"
              payload: {}
              as: SourcingLead
              as_user_id: "sl-omar"
              captures: { product_v_after: $.data.version }
          assert:
            - "the quote create returned 201 carrying expected_product_version == ${product_v} (== 2)"
            - "product_v_after == 3  (the create incremented Product.version by exactly 1)"

      - name: cascading_side_effects_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: discontinuation_cascade_depth3
          rationale: "The 4-entity cascade is asserted link-by-link in the named §1.8 instance; the cert-denial cascade in cert_denial_cascade_depth2; the cancel cascade in the §1.9 corner line_review_cancel_releases_committed_slot_and_reverts_plan."

      - name: dual_variant_calculation_layer
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: landed_cost_provisional_vs_settled_diverge
          rationale: "Both dual-variant calculations are asserted in §1.8 (landed cost and launch quantity instances)."

      - name: selector_policy_eviction_ordering
        claim_type: selector_policy
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: commit_vacate_cycle_conserves_shelf_facings
          rationale: "The eviction selector (committed_at DESC, created_at DESC tie-break) picks slot B over slot A in the named §1.8 instance."

  - section: consistency_model
    instances:
      - name: mutations_are_visible_in_the_same_request_and_immediately_after
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.PlanogramSlot.PROPOSED_to_COMMITTED
        distinguishing_aspect: "Immediate consistency: the commit response itself carries status COMMITTED + committed_at + the bumped version, and a directly following GET returns byte-identical derived state — no read-your-writes lag anywhere."
        test_recipe:
          setup:
            - "Full chain through line review DECIDED at 2026-10-21; slot PROPOSED."
          setup_api_calls:
            - *c_clock
            - *c_trend
            - *c_trend_eval
            - *c_trend_select
            - *c_concept
            - *c_concept_select
            - *c_cm
            - *c_product
            - *c_fp
            - *c_fp_sample
            - *c_fp_approve
            - *c_prod_sourcing
            - *c_quote
            - *c_quote_eval
            - *c_quote_accept
            - *c_prod_gate
            - *c_dossier
            - *c_rev_ing
            - *c_rev_claim
            - *c_rev_cert1
            - *c_rev_cert2
            - *c_rev_cert3
            - *c_rev_reg1
            - *c_rev_reg2
            - *c_pack
            - *c_prod_ready
            - *c_partner
            - *c_lr
            - *c_clock2
            - *c_lr_open
            - *c_slot
            - *c_clock3
            - *c_lr_reviewing
            - *c_clock4
            - *c_lr_decided
          trigger:
            - call: "PATCH /planogram-slots/${slot_id}"
              payload: { status: "COMMITTED" }
              as: RetailPlanner
              as_user_id: "rp-owen"
              captures: { cc_status: $.data.status, cc_at: $.data.committed_at, cc_v: $.data.version }
            - call: "GET /planogram-slots/${slot_id}"
              payload: {}
              as: RetailPlanner
              as_user_id: "rp-owen"
              captures: { cc_status2: $.data.status, cc_at2: $.data.committed_at, cc_v2: $.data.version }
          assert:
            - "cc_status == COMMITTED and cc_at == 2026-10-21T00:00:00Z and cc_v == 2  (mutation visible in the same response)"
            - "cc_status2 == cc_status and cc_at2 == cc_at and cc_v2 == cc_v  (immediate read-back agrees exactly)"
