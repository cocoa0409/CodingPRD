            - call: "POST /appointments"
              payload: { patient_id: "${pat_id}", visit_type: "EXAM", requested_start: "2026-02-18T09:00:00Z", requested_end: "2026-02-18T10:00:00Z" }
              as: Dispatcher
              captures: { appt_id: $.data.id }
            - call: "POST /route-days"
              payload: { clinician_id: "${tech_id}", rolling_clinic_id: "${van_id}", service_date: "2026-02-18T00:00:00Z" }
              as: Dispatcher
              captures: { rd_id: $.data.id, rd_v: $.data.version }
            - call: "POST /route-days/${rd_id}/stops"
              payload: { appointment_id: "${appt_id}", window_start: "2026-02-18T09:00:00Z", window_end: "2026-02-18T10:00:00Z", expected_route_day_version: "${rd_v}" }
              as: Dispatcher
              captures: { stop_id: $.data.id }
          trigger:
            - call: "POST /appointments/${appt_id}/cancel"
              payload: {}
              as: Dispatcher
            - call: "GET /route-days/${rd_id}"
              payload: {}
              as: Dispatcher
              captures: { sc: $.data.stop_count }
          assert:
            - "RouteDay.${rd_id}.stop_count == 0"
            - "RouteStop.${stop_id}.status == SKIPPED"
