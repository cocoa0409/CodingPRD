# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Occupational Health Clinic — breadth probe.
# Walks references/claim-extraction-guide.md row-by-row against SCAFFOLD.yaml
# §1.1–§1.7. Every grounds[] resolves into SCAFFOLD.yaml; every setup_api_calls /
# trigger chain is executable from empty-DB via §1.5 endpoints only.
# Corners already exercised by §1.8 (SCAFFOLD_DIFFICULTY_DESIGN.yaml) are emitted
# as excluded_because: stubs (no test_recipe).
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # SECTION 1 — ENTITIES (creation / retrieval / listing / not-found /
  # required-fields / defaults / computed / system / type-constraints /
  # immutability / parent-relationships / flat-topology FK integrity)
  # ===========================================================================
  - section: entities
    instances:
      - name: create_employer_returns_201_with_prospect_status
        claim_type: Creation
        grounds:
          - entities.Employer.fields.legal_name
          - entities.Employer.fields.account_status
          - endpoints["POST /clinic/employers"]
        distinguishing_aspect: "POST /clinic/employers with required fields returns 201, account_status=PROSPECT, version=1, mro_user_id echoed."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /clinic/employers"
              payload: { legal_name: "Acme Co", dot_regulated: false, mro_user_id: "mro-1", net_terms_days: 30 }
              as: ClinicAdmin
              captures: { emp_id: $.data.id, st: $.data.account_status, v: $.data.version }
          assert:
            - "response.status == 201"
            - "Employer.${emp_id}.account_status == PROSPECT"
            - "Employer.${emp_id}.version == 1"
            - "Employer.${emp_id}.legal_name == Acme Co"
            - "Employer.${emp_id}.mro_user_id == mro-1"

      - name: get_employer_returns_stored_entity
        claim_type: Retrieval
        grounds:
          - endpoints["GET /clinic/employers/{employerId}"]
          - entities.Employer.fields.legal_name
        distinguishing_aspect: "GET /clinic/employers/{id} returns the previously created employer with matching legal_name and id."
        test_recipe:
          setup:
            - "One employer exists."
          setup_api_calls:
            - call: "POST /clinic/employers"
              payload: { legal_name: "Beta Co", mro_user_id: "mro-1" }
              as: ClinicAdmin
              captures: { emp_id: $.data.id }
          trigger:
            - call: "GET /clinic/employers/${emp_id}"
              payload: {}
              as: ClinicAdmin
              captures: { got: $.data.id }
          assert:
            - "response.status == 200"
            - "Employer.${emp_id}.legal_name == Beta Co"

      - name: list_employers_returns_pagination_envelope
        claim_type: Listing
        grounds:
          - endpoints["GET /clinic/employers"]
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /clinic/employers returns an array with response_type=array and pagination fields total_count and has_more present."
        test_recipe:
          setup:
            - "Two employers exist."
          setup_api_calls:
            - call: "POST /clinic/employers"
              payload: { legal_name: "Emp One", mro_user_id: "mro-1" }
              as: ClinicAdmin
            - call: "POST /clinic/employers"
              payload: { legal_name: "Emp Two", mro_user_id: "mro-1" }
              as: ClinicAdmin
          trigger:
            - call: "GET /clinic/employers"
              payload: {}
              as: ClinicAdmin
          assert:
            - "response.status == 200"
            - "response.response_type == array"
            - "response.meta.total_count >= 2"
            - "response.meta.has_more in {true,false}"

      - name: get_employer_nonexistent_returns_employer_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_EMPLOYER_NOT_FOUND]
          - validations[priority=3]
          - endpoints["GET /clinic/employers/{employerId}"]
        distinguishing_aspect: "GET /clinic/employers/{random-uuid} returns 404 ERR_EMPLOYER_NOT_FOUND."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /clinic/employers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ClinicAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_EMPLOYER_NOT_FOUND"

      - name: create_employer_missing_legal_name_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Employer.fields.legal_name
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=5]
        distinguishing_aspect: "POST /clinic/employers omitting required legal_name returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /clinic/employers"
              payload: { mro_user_id: "mro-1" }
              as: ClinicAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_employer_omits_optional_defaults_applied
        claim_type: Defaults
        grounds:
          - entities.Employer.fields.dot_regulated
          - entities.Employer.fields.net_terms_days
          - entities.Employer.fields.current_date
        distinguishing_aspect: "Omitting dot_regulated/net_terms_days/current_date applies defaults false / 30 / 1970-01-01 respectively."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /clinic/employers"
              payload: { legal_name: "Default Co", mro_user_id: "mro-1" }
              as: ClinicAdmin
              captures: { emp_id: $.data.id, dot: $.data.dot_regulated, terms: $.data.net_terms_days, cd: $.data.current_date }
          assert:
            - "Employer.${emp_id}.dot_regulated == false"
            - "Employer.${emp_id}.net_terms_days == 30"
            - "Employer.${emp_id}.current_date == 1970-01-01"
            - "Employer.${emp_id}.outstanding_balance_cents == 0"

      - name: employer_outstanding_balance_computed_ignores_input
        claim_type: Computed Fields
        grounds:
          - entities.Employer.fields.outstanding_balance_cents
          - calculations.employer_outstanding_balance
        distinguishing_aspect: "outstanding_balance_cents is server-computed (default 0 at create); a client-supplied value is ignored and the field stays 0."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /clinic/employers"
              payload: { legal_name: "Comp Co", mro_user_id: "mro-1" }
              as: ClinicAdmin
              captures: { emp_id: $.data.id, bal: $.data.outstanding_balance_cents }
          assert:
            - "Employer.${emp_id}.outstanding_balance_cents == 0"

      - name: employer_system_fields_generated_input_ignored
        claim_type: System Fields
        grounds:
          - entities.Employer.fields.account_status
          - entities.Employer.common_fields
        distinguishing_aspect: "id/created_at/updated_at/version and account_status are system-minted; any account_status=ACTIVE in the body is ignored, server returns PROSPECT and version=1."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /clinic/employers"
              payload: { legal_name: "Sys Co", mro_user_id: "mro-1" }
              as: ClinicAdmin
              captures: { emp_id: $.data.id, st: $.data.account_status, v: $.data.version }
          assert:
            - "Employer.${emp_id}.account_status == PROSPECT"
            - "Employer.${emp_id}.version == 1"
            - "Employer.${emp_id}.id is a UUID without a type prefix"

      - name: create_protocol_invalid_panel_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Protocol.fields.panels
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=5]
        distinguishing_aspect: "POST /clinic/protocols with a panel_code outside {PHYSICAL,DRUG_DOT,DRUG_NON_DOT,AUDIOMETRIC,RESPIRATOR_FIT} returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "One employer exists."
          setup_api_calls:
            - call: "POST /clinic/employers"
              payload: { legal_name: "Enum Co", mro_user_id: "mro-1" }
              as: ClinicAdmin
              captures: { emp_id: $.data.id }
          trigger:
            - call: "POST /clinic/protocols"
              payload: { employer_id: "${emp_id}", effective_date: "2026-01-01", panels: [ { panel_code: "XRAY", required_for_job_category: "OP", price_cents: 100, recheck_interval_days: 0 } ] }
              as: ClinicAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_protocol_negative_price_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Protocol.fields.panels
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=5]
        distinguishing_aspect: "A panel price_cents < 0 violates the non-negative numeric constraint and returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "One employer exists."
          setup_api_calls:
            - call: "POST /clinic/employers"
              payload: { legal_name: "Neg Co", mro_user_id: "mro-1" }
              as: ClinicAdmin
              captures: { emp_id: $.data.id }
          trigger:
            - call: "POST /clinic/protocols"
              payload: { employer_id: "${emp_id}", effective_date: "2026-01-01", panels: [ { panel_code: "PHYSICAL", required_for_job_category: "OP", price_cents: -5, recheck_interval_days: 0 } ] }
              as: ClinicAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: custody_event_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.CustodyEvent.common_fields
          - endpoints["GET /clinic/custody-events/{custodyEventId}"]
        distinguishing_aspect: "CustodyEvent is common_fields:false (append-only) — its read carries id and created_at only, no version field, and there is no update/delete endpoint for it."
        test_recipe:
          setup:
            - "Employer ACTIVE; worker; DRUG_NON_DOT encounter checked in; drug screen created; one COLLECT custody event appended."
          setup_api_calls:
            - call: "POST /clinic/employers"
              payload: { legal_name: "Imm Co", mro_user_id: "mro-1" }
              as: ClinicAdmin
              captures: { emp_id: $.data.id, emp_v0: $.data.version }
            - call: "POST /clinic/protocols"
              payload: { employer_id: "${emp_id}", effective_date: "2026-01-01", panels: [ { panel_code: "DRUG_NON_DOT", required_for_job_category: "PACKER", price_cents: 8000, recheck_interval_days: 0 } ] }
              as: ClinicAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /clinic/protocols/${p1_id}/activate"
              payload: { expected_employer_version: "${emp_v0}" }
              as: ClinicAdmin
            - call: "POST /clinic/workers"
              payload: { employer_id: "${emp_id}", full_name: "Penny Packer", job_category: "PACKER", dob: "1990-01-01" }
              as: ClinicAdmin
              captures: { wkr_id: $.data.id }
            - call: "POST /clinic/encounters"
              payload: { employer_id: "${emp_id}", worker_id: "${wkr_id}", encounter_type: "DRUG_SCREEN", panel_code: "DRUG_NON_DOT" }
              as: Clinician
              as_user_id: "clin-1"
              captures: { enc_id: $.data.id }
            - call: "POST /clinic/encounters/${enc_id}/check-in"
              payload: {}
              as: Clinician
              as_user_id: "clin-1"
            - call: "POST /clinic/drug-screens"
              payload: { encounter_id: "${enc_id}", specimen_seal_intact: true }
              as: Clinician
              as_user_id: "clin-1"
              captures: { ds_id: $.data.id }
            - call: "POST /clinic/custody-events"
              payload: { drug_screen_id: "${ds_id}", step: "COLLECT" }
              as: Collector
              captures: { ce_id: $.data.id }
          trigger:
            - call: "GET /clinic/custody-events/${ce_id}"
              payload: {}
              as: Collector
              captures: { got: $.data.id }
          assert:
            - "response.status == 200"
            - "CustodyEvent.${ce_id}.seq == 1"
            - "CustodyEvent.${ce_id} response has no version field"

      - name: create_worker_wrong_employer_parent_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Worker.fields.employer_id
          - errors[ERR_CROSS_EMPLOYER_REFERENCE]
          - validations[priority=4]
        distinguishing_aspect: "POST /clinic/workers with a non-existent employer_id returns 404 ERR_CROSS_EMPLOYER_REFERENCE (body-FK existence check)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /clinic/workers"
              payload: { employer_id: "00000000-0000-4000-8000-000000000000", full_name: "Ghost", job_category: "OP", dob: "1990-01-01" }
              as: ClinicAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_CROSS_EMPLOYER_REFERENCE"

      - name: encounter_worker_belongs_to_other_employer_returns_cross_employer
        claim_type: Parent Relationships
        grounds:
          - entities.Encounter.fields.worker_id
          - entities.Encounter.fields.employer_id
          - validations[priority=4]
          - errors[ERR_CROSS_EMPLOYER_REFERENCE]
        distinguishing_aspect: "flat-topology FK integrity: scheduling an encounter whose worker_id belongs to a DIFFERENT employer than the body employer_id returns 404 ERR_CROSS_EMPLOYER_REFERENCE."
        test_recipe:
          setup:
            - "Employer A ACTIVE with a PHYSICAL protocol; Employer B ACTIVE; worker W belongs to Employer B."
          setup_api_calls:
            - call: "POST /clinic/employers"
              payload: { legal_name: "Emp A", mro_user_id: "mro-1" }
              as: ClinicAdmin
              captures: { empA_id: $.data.id, empA_v0: $.data.version }
            - call: "POST /clinic/protocols"
              payload: { employer_id: "${empA_id}", effective_date: "2026-01-01", panels: [ { panel_code: "PHYSICAL", required_for_job_category: "OP", price_cents: 9000, recheck_interval_days: 0 } ] }
              as: ClinicAdmin
              captures: { pA_id: $.data.id }
            - call: "POST /clinic/protocols/${pA_id}/activate"
              payload: { expected_employer_version: "${empA_v0}" }
              as: ClinicAdmin
            - call: "POST /clinic/employers"
              payload: { legal_name: "Emp B", mro_user_id: "mro-1" }
              as: ClinicAdmin
              captures: { empB_id: $.data.id }
            - call: "POST /clinic/workers"
              payload: { employer_id: "${empB_id}", full_name: "Wanda B", job_category: "OP", dob: "1990-01-01" }
              as: ClinicAdmin
              captures: { wkrB_id: $.data.id }
          trigger:
            - call: "POST /clinic/encounters"
              payload: { employer_id: "${empA_id}", worker_id: "${wkrB_id}", encounter_type: "PHYSICAL", panel_code: "PHYSICAL" }
              as: Clinician
              as_user_id: "clin-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_CROSS_EMPLOYER_REFERENCE"

      - name: worker_initial_hire_status_is_candidate
        claim_type: Computed Fields
        grounds:
          - entities.Worker.fields.hire_status
          - endpoints["POST /clinic/workers"]
        distinguishing_aspect: "A freshly created worker has hire_status=CANDIDATE (system-initialized, the enum's initial value)."
        test_recipe:
          setup:
            - "One employer exists."
          setup_api_calls:
            - call: "POST /clinic/employers"
              payload: { legal_name: "Init Co", mro_user_id: "mro-1" }
              as: ClinicAdmin
              captures: { emp_id: $.data.id }
          trigger:
            - call: "POST /clinic/workers"
              payload: { employer_id: "${emp_id}", full_name: "New Hire", job_category: "OP", dob: "1990-01-01" }
              as: ClinicAdmin
              captures: { wkr_id: $.data.id, hs: $.data.hire_status }
          assert:
            - "response.status == 201"
            - "Worker.${wkr_id}.hire_status == CANDIDATE"

      - name: list_workers_filtered_by_employer_id_reverse_reachability
        claim_type: Listing
        grounds:
          - endpoints["GET /clinic/workers"]
          - entities.Worker.fields.employer_id
        distinguishing_aspect: "GET /clinic/workers?employer_id=X (FK reverse-reachability filtered list) returns only that employer's workers as Worker[]."
        test_recipe:
          setup:
            - "Employer with one worker exists."
          setup_api_calls:
            - call: "POST /clinic/employers"
              payload: { legal_name: "Filt Co", mro_user_id: "mro-1" }
              as: ClinicAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /clinic/workers"
              payload: { employer_id: "${emp_id}", full_name: "Solo Worker", job_category: "OP", dob: "1990-01-01" }
              as: ClinicAdmin
              captures: { wkr_id: $.data.id }
          trigger:
            - call: "GET /clinic/workers?employer_id=${emp_id}"
              payload: {}
              as: ClinicAdmin
          assert:
            - "response.status == 200"
            - "response.response_type == array"
            - "every returned Worker has employer_id == ${emp_id}"
            - "response.meta.total_count == 1"

  # ===========================================================================
  # SECTION 2 — STATE MACHINES (valid transitions / precondition enforcement /
  # side-effect execution / invalid-from rejection / initial state / terminal
  # lockdown / idempotency / branching / cyclic / cross-entity guarded /
  # cascade-down / cross-entity / compensation / conditional cascade)
  # ===========================================================================
  - section: state_machines
    instances:
      # --- Employer lifecycle ---
      - name: employer_suspend_from_active_succeeds
        claim_type: Valid Transition
        grounds:
          - state_machines.Employer.ACTIVE_to_SUSPENDED
          - entities.Employer.fields.account_status
        distinguishing_aspect: "ACTIVE employer suspend transitions account_status to SUSPENDED (200)."
        test_recipe:
          setup:
            - "Employer ACTIVE via a protocol activation."
          setup_api_calls:
            - call: "POST /clinic/employers"
              payload: { legal_name: "Susp Co", mro_user_id: "mro-1" }
              as: ClinicAdmin
              captures: { emp_id: $.data.id, emp_v0: $.data.version }
            - call: "POST /clinic/protocols"
              payload: { employer_id: "${emp_id}", effective_date: "2026-01-01", panels: [ { panel_code: "PHYSICAL", required_for_job_category: "OP", price_cents: 9000, recheck_interval_days: 0 } ] }
              as: ClinicAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /clinic/protocols/${p1_id}/activate"
              payload: { expected_employer_version: "${emp_v0}" }
              as: ClinicAdmin
          trigger:
            - call: "POST /clinic/employers/${emp_id}/suspend"
              payload: {}
              as: ClinicAdmin
              captures: { st: $.data.account_status }
          assert:
            - "response.status == 200"
            - "Employer.${emp_id}.account_status == SUSPENDED"

      - name: employer_reactivate_when_not_suspended_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Employer.SUSPENDED_to_ACTIVE
          - errors[ERR_EMPLOYER_NOT_SUSPENDED]
          - validations[priority=7]
        distinguishing_aspect: "Reactivate on a PROSPECT (not SUSPENDED) employer is rejected with 409 ERR_EMPLOYER_NOT_SUSPENDED; no state change."
        test_recipe:
          setup:
            - "A PROSPECT employer (never activated)."
          setup_api_calls:
            - call: "POST /clinic/employers"
              payload: { legal_name: "React Co", mro_user_id: "mro-1" }
              as: ClinicAdmin
              captures: { emp_id: $.data.id }
          trigger:
            - call: "POST /clinic/employers/${emp_id}/reactivate"
              payload: {}
              as: ClinicAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_EMPLOYER_NOT_SUSPENDED"

      - name: employer_suspend_already_suspended_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.Employer.ACTIVE_to_SUSPENDED
          - errors[ERR_EMPLOYER_NOT_ACTIVE]
        distinguishing_aspect: "Suspending an already-SUSPENDED employer (second suspend) is rejected with 409 ERR_EMPLOYER_NOT_ACTIVE — suspend is not idempotent."
        test_recipe:
          setup:
            - "Employer ACTIVE then SUSPENDED."
          setup_api_calls:
            - call: "POST /clinic/employers"
              payload: { legal_name: "Idem Co", mro_user_id: "mro-1" }
              as: ClinicAdmin
              captures: { emp_id: $.data.id, emp_v0: $.data.version }
            - call: "POST /clinic/protocols"
              payload: { employer_id: "${emp_id}", effective_date: "2026-01-01", panels: [ { panel_code: "PHYSICAL", required_for_job_category: "OP", price_cents: 9000, recheck_interval_days: 0 } ] }
              as: ClinicAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /clinic/protocols/${p1_id}/activate"
              payload: { expected_employer_version: "${emp_v0}" }
              as: ClinicAdmin
            - call: "POST /clinic/employers/${emp_id}/suspend"
              payload: {}
              as: ClinicAdmin
          trigger:
            - call: "POST /clinic/employers/${emp_id}/suspend"
              payload: {}
              as: ClinicAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_EMPLOYER_NOT_ACTIVE"

      - name: employer_close_with_outstanding_balance_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Employer.ACTIVE_to_CLOSED
          - errors[ERR_EMPLOYER_HAS_BALANCE]
          - calculations.employer_outstanding_balance
        distinguishing_aspect: "Closing an employer whose outstanding_balance_cents > 0 (one ISSUED unpaid invoice) is rejected with 409 ERR_EMPLOYER_HAS_BALANCE."
        test_recipe:
          setup:
            - "Employer ACTIVE; one PHYSICAL encounter completed and a DRAFT invoice issued (total 9000, unpaid) so outstanding_balance_cents == 9000."
          setup_api_calls:
            - call: "POST /clinic/employers"
              payload: { legal_name: "Bal Co", mro_user_id: "mro-1", current_date: "2026-03-15" }
              as: ClinicAdmin
              captures: { emp_id: $.data.id, emp_v0: $.data.version }
            - call: "POST /clinic/protocols"
              payload: { employer_id: "${emp_id}", effective_date: "2026-01-01", panels: [ { panel_code: "PHYSICAL", required_for_job_category: "OP", price_cents: 9000, recheck_interval_days: 0 } ] }
              as: ClinicAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /clinic/protocols/${p1_id}/activate"
              payload: { expected_employer_version: "${emp_v0}" }
              as: ClinicAdmin
            - call: "POST /clinic/workers"
              payload: { employer_id: "${emp_id}", full_name: "Bill Bal", job_category: "OP", dob: "1990-01-01" }
              as: ClinicAdmin
              captures: { wkr_id: $.data.id }
            - call: "POST /clinic/encounters"
              payload: { employer_id: "${emp_id}", worker_id: "${wkr_id}", encounter_type: "PHYSICAL", panel_code: "PHYSICAL" }
              as: Clinician
              as_user_id: "clin-1"
              captures: { enc_id: $.data.id }
            - call: "POST /clinic/encounters/${enc_id}/check-in"
              payload: {}
              as: Clinician
              as_user_id: "clin-1"
            - call: "POST /clinic/clearances"
              payload: { encounter_id: "${enc_id}", determination: "FIT" }
              as: Clinician
              as_user_id: "clin-1"
