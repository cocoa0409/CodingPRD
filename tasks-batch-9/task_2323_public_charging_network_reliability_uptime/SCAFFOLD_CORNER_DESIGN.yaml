          - state_machines.OutageEvent.transitions.RESOLVED_to_VERIFIED
        distinguishing_aspect: "SoD-1 compares X-User-ID against the outage's dispatch_created_by_user_id, not against a role: the very same NetworkOperator user is authorised for resolution-reviews yet must be refused with ERR_SEGREGATION_OF_DUTIES (409), while a different user under the same role succeeds. The outage must stay RESOLVED after the refusal so a second reviewer can still verify it."
