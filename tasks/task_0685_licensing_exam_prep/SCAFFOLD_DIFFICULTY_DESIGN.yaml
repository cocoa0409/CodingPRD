# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Professional Licensing Exam Prep — Expert
# 9 rule_ids × 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: readiness_conservative_vs_projected_diverges_on_enrollment
        grounds:
          - calculations.readiness_score
          - entities.Enrollment.fields.readiness_score
          - entities.Enrollment.fields.projected_readiness_score
        distinguishing_aspect: |
          On the SAME Enrollment with two completed mocks (scaled 70 then 90) and all
          domain masteries at 50, the CONSERVATIVE readiness uses only the latest mock
          (=> 66) while the PROJECTED readiness averages both mocks (=> 62); the two
          variants produce different integers for identical data.
        test_recipe:
          setup:
            - "Published 3-domain program (A:0.50, B:0.30, C:0.20); BASIC plan (paid-in-full); learner enrolled and ACTIVE; domain masteries all 50 (no practice run); two COMPLETED mocks scaled 70 then 90 (latest)."
          setup_api_calls:
            - call: "POST /license-programs"
              payload: { license_code: "CPA-FAR", title: "FAR", passing_scaled_score: 75, domain_weights: [ { domain_code: "A", weight: 0.50 }, { domain_code: "B", weight: 0.30 }, { domain_code: "C", weight: 0.20 } ] }
              as: ContentAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /license-programs/${prog_id}/items"
              payload: { domain_code: "A", difficulty: "MEDIUM", correct_choice: "B" }
              as: ContentAdmin
            - call: "POST /license-programs/${prog_id}/publish"
              payload: {}
              as: ContentAdmin
            - call: "POST /subscription-plans"
              payload: { tier: "BASIC", total_price_cents: 50000, down_payment_pct: 0.00, financing_months: 1, included_mock_credits: 5, pass_guarantee: false, guarantee_refund_pct: 0.0, includes_ce: false }
              as: ContentAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /learners"
              payload: { email: "l1@x.com", full_name: "L One" }
              as: Learner
              captures: { learner_id: "$.data.id" }
            - call: "POST /enrollments"
              payload: { learner_id: "${learner_id}", license_program_id: "${prog_id}", subscription_plan_id: "${plan_id}", financed: false }
              as: Learner
              as_user_id: "${learner_id}"
              captures: { enr_id: "$.data.id" }
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: Learner
              as_user_id: "${learner_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T09:00:00Z" }
              as: PlatformOps
            - call: "POST /enrollments/${enr_id}/mock-exams"
              payload: { raw_score: 70, item_count: 100 }
              as: Learner
              as_user_id: "${learner_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T09:00:00Z" }
              as: PlatformOps
            - call: "POST /enrollments/${enr_id}/mock-exams"
              payload: { raw_score: 90, item_count: 100 }
              as: Learner
              as_user_id: "${learner_id}"
          trigger:
            - call: "GET /enrollments/${enr_id}/analytics"
              as: Learner
              as_user_id: "${learner_id}"
          assert:
            - "Enrollment.${enr_id}.readiness_score == 66"
            - "Enrollment.${enr_id}.projected_readiness_score == 62"
            - "Enrollment.${enr_id}.readiness_score != Enrollment.${enr_id}.projected_readiness_score"

      - name: financing_schedule_paid_in_full_vs_financed_variant
        grounds:
          - calculations.financing_schedule
          - entities.Installment.fields.amount_cents
          - entities.Installment.fields.sequence_no
        distinguishing_aspect: |
          For the SAME plan price (120000 cents), the paid_in_full variant emits ONE
          Installment of 120000, whereas the financed variant emits 7 installments
          (down 24000 then six of 16000); the two algorithms produce different
          Installment sets on the Installment entity domain (distinct from the
          readiness dual-variant which lives on Enrollment).
        test_recipe:
          setup:
            - "Published program + PLUS plan (total 120000, down 0.20, financing_months 6). Two learners: one enrolls paid-in-full, one enrolls financed; compare the materialized Installment sets."
          setup_api_calls:
            - call: "POST /license-programs"
              payload: { license_code: "RE-SALES", title: "RE Sales", passing_scaled_score: 70, domain_weights: [ { domain_code: "A", weight: 1.00 } ] }
              as: ContentAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /license-programs/${prog_id}/items"
              payload: { domain_code: "A", difficulty: "EASY", correct_choice: "A" }
              as: ContentAdmin
            - call: "POST /license-programs/${prog_id}/publish"
              payload: {}
              as: ContentAdmin
            - call: "POST /subscription-plans"
              payload: { tier: "PLUS", total_price_cents: 120000, down_payment_pct: 0.20, financing_months: 6, included_mock_credits: 8, pass_guarantee: false, guarantee_refund_pct: 0.0, includes_ce: false }
              as: ContentAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /learners"
              payload: { email: "full@x.com", full_name: "Full Pay" }
              as: Learner
              captures: { l_full: "$.data.id" }
            - call: "POST /learners"
              payload: { email: "fin@x.com", full_name: "Financed" }
              as: Learner
              captures: { l_fin: "$.data.id" }
            - call: "POST /enrollments"
              payload: { learner_id: "${l_full}", license_program_id: "${prog_id}", subscription_plan_id: "${plan_id}", financed: false }
              as: Learner
              as_user_id: "${l_full}"
              captures: { enr_full: "$.data.id" }
            - call: "POST /enrollments"
              payload: { learner_id: "${l_fin}", license_program_id: "${prog_id}", subscription_plan_id: "${plan_id}", financed: true }
              as: Learner
              as_user_id: "${l_fin}"
              captures: { enr_fin: "$.data.id" }
          trigger:
            - call: "GET /enrollments/${enr_full}/installments"
              as: Learner
              as_user_id: "${l_full}"
            - call: "GET /enrollments/${enr_fin}/installments"
              as: Learner
              as_user_id: "${l_fin}"
          assert:
            - "GET /enrollments/${enr_full}/installments returns total_count == 1 with data[0].amount_cents == 120000"
            - "GET /enrollments/${enr_fin}/installments returns total_count == 7"
            - "financed installment sequence_no 1 amount_cents == 24000 (down payment)"
            - "financed installments sequence_no 2..7 each amount_cents == 16000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: guarantee_refund_round_per_installment_then_sum_mode_b
        grounds:
          - calculations.guarantee_refund
          - entities.PassGuaranteeClaim.fields.refund_amount_cents
          - entities.Installment.fields.amount_cents
        distinguishing_aspect: |
          MODE (b) nested-rounding: refund = sum(round_half_up(amount*0.50)) over PAID
          installments [30001, 11666, 11671] equals 26670 (round-per-installment-then-sum),
          which differs from sum-then-round (53338*0.50 -> 26669); the scaffold pins
          per-installment-first.
        test_recipe:
          setup:
            - "PRO plan with pass_guarantee=true, guarantee_refund_pct=0.50, total 100002, down 0.30, financing_months 6 (schedule: 30001, 11666 x5, last 11671). Single-domain program. Enrollment financed+ACTIVE; PAID installments seq1(30001), seq2(11666), seq7(11671); 200 questions answered, 2 mocks (latest scaled 84 -> conservative readiness 76 >= 75); exam certified FAIL with guarantee_eligible=true; MONEY_BACK claim SUBMITTED."
          setup_api_calls:
            - call: "POST /license-programs"
              payload: { license_code: "NCLEX-RN", title: "NCLEX", passing_scaled_score: 75, domain_weights: [ { domain_code: "A", weight: 1.00 } ] }
              as: ContentAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /license-programs/${prog_id}/items"
              payload: { domain_code: "A", difficulty: "HARD", correct_choice: "C" }
              as: ContentAdmin
            - call: "POST /license-programs/${prog_id}/publish"
              payload: {}
              as: ContentAdmin
            - call: "POST /subscription-plans"
              payload: { tier: "PRO", total_price_cents: 100002, down_payment_pct: 0.30, financing_months: 6, included_mock_credits: 5, pass_guarantee: true, guarantee_refund_pct: 0.50, includes_ce: false }
              as: ContentAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /learners"
              payload: { email: "mb@x.com", full_name: "Money Back" }
              as: Learner
              captures: { learner_id: "$.data.id" }
            - call: "POST /enrollments"
              payload: { learner_id: "${learner_id}", license_program_id: "${prog_id}", subscription_plan_id: "${plan_id}", financed: true }
              as: Learner
              as_user_id: "${learner_id}"
              captures: { enr_id: "$.data.id" }
            - call: "GET /enrollments/${enr_id}/installments"
              as: Learner
              as_user_id: "${learner_id}"
              captures: { inst1: "$.data[0].id", inst2: "$.data[1].id", inst7: "$.data[6].id" }
            - call: "POST /enrollments/${enr_id}/installments/${inst1}/pay"
              payload: {}
              as: Learner
              as_user_id: "${learner_id}"
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: Learner
              as_user_id: "${learner_id}"
            - call: "POST /enrollments/${enr_id}/installments/${inst2}/pay"
              payload: {}
              as: Learner
              as_user_id: "${learner_id}"
            - call: "POST /enrollments/${enr_id}/installments/${inst7}/pay"
              payload: {}
              as: Learner
              as_user_id: "${learner_id}"
            - call: "POST /enrollments/${enr_id}/practice-sessions"
              payload: { domain_code: "A", answered_count: 200, correct_count: 200 }
              as: Learner
              as_user_id: "${learner_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-03T09:00:00Z" }
              as: PlatformOps
            - call: "POST /enrollments/${enr_id}/mock-exams"
              payload: { raw_score: 70, item_count: 100 }
              as: Learner
              as_user_id: "${learner_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: PlatformOps
            - call: "POST /enrollments/${enr_id}/mock-exams"
              payload: { raw_score: 84, item_count: 100 }
              as: Learner
              as_user_id: "${learner_id}"
            - call: "POST /enrollments/${enr_id}/certify-exam"
              payload: { outcome: "FAIL" }
              as: ExamProctor
            - call: "POST /pass-guarantee-claims"
              payload: { enrollment_id: "${enr_id}", remedy: "MONEY_BACK" }
              as: Learner
              as_user_id: "${learner_id}"
              captures: { claim_id: "$.data.id" }
          trigger:
            - call: "POST /pass-guarantee-claims/${claim_id}/decide"
              payload: { decision: "APPROVE" }
              as: ExamProctor
          assert:
            - "PassGuaranteeClaim.${claim_id}.status == APPROVED"
            - "PassGuaranteeClaim.${claim_id}.refund_amount_cents == 26670"
            - "Enrollment.${enr_id}.status == REFUNDED"

      - name: readiness_weighted_blend_conditional_latest_mock_mode_a
        grounds:
          - calculations.readiness_score
          - entities.Enrollment.fields.readiness_score
          - entities.StudyPlanDomain.fields.mastery
        distinguishing_aspect: |
          MODE (a) >=3-input non-linear formula: readiness = round(0.60*weighted_domain_mastery
          + 0.40*latest_mock_score) where weighted_domain_mastery itself is a weighted sum
          over 3 domains AND latest_mock_score is a conditional selection (greatest completed_at,
          tie-break created_at ASC). Two EWMA practice sessions on domain A raise its mastery to
          80 (B,C stay 50), so weighted_domain_mastery = 0.50*80 + 0.30*50 + 0.20*50 = 65; with
          latest mock 90 => round(0.6*65 + 0.4*90) = round(75.0) = 75.
        test_recipe:
          setup:
            - "3-domain program (A:0.50,B:0.30,C:0.20); BASIC paid-in-full; ACTIVE enrollment; two practice sessions on domain A (100/100 then 95/100) raising A's mastery 50->70->80; two mocks, latest scaled 90."
          setup_api_calls:
            - call: "POST /license-programs"
              payload: { license_code: "CPA-AUD", title: "AUD", passing_scaled_score: 75, domain_weights: [ { domain_code: "A", weight: 0.50 }, { domain_code: "B", weight: 0.30 }, { domain_code: "C", weight: 0.20 } ] }
              as: ContentAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /license-programs/${prog_id}/items"
              payload: { domain_code: "A", difficulty: "MEDIUM", correct_choice: "A" }
              as: ContentAdmin
            - call: "POST /license-programs/${prog_id}/publish"
              payload: {}
              as: ContentAdmin
            - call: "POST /subscription-plans"
              payload: { tier: "BASIC", total_price_cents: 40000, down_payment_pct: 0.00, financing_months: 1, included_mock_credits: 5, pass_guarantee: false, guarantee_refund_pct: 0.0, includes_ce: false }
              as: ContentAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /learners"
              payload: { email: "blend@x.com", full_name: "Blend" }
              as: Learner
              captures: { learner_id: "$.data.id" }
            - call: "POST /enrollments"
              payload: { learner_id: "${learner_id}", license_program_id: "${prog_id}", subscription_plan_id: "${plan_id}", financed: false }
              as: Learner
              as_user_id: "${learner_id}"
              captures: { enr_id: "$.data.id" }
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: Learner
              as_user_id: "${learner_id}"
            - call: "POST /enrollments/${enr_id}/practice-sessions"
              payload: { domain_code: "A", answered_count: 100, correct_count: 100 }
              as: Learner
              as_user_id: "${learner_id}"
            - call: "POST /enrollments/${enr_id}/practice-sessions"
              payload: { domain_code: "A", answered_count: 100, correct_count: 95 }
              as: Learner
              as_user_id: "${learner_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-05T09:00:00Z" }
              as: PlatformOps
            - call: "POST /enrollments/${enr_id}/mock-exams"
              payload: { raw_score: 60, item_count: 100 }
              as: Learner
              as_user_id: "${learner_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-06T09:00:00Z" }
              as: PlatformOps
            - call: "POST /enrollments/${enr_id}/mock-exams"
              payload: { raw_score: 90, item_count: 100 }
              as: Learner
              as_user_id: "${learner_id}"
          trigger:
            - call: "GET /enrollments/${enr_id}/domains"
              as: Learner
              as_user_id: "${learner_id}"
            - call: "GET /enrollments/${enr_id}/analytics"
              as: Learner
              as_user_id: "${learner_id}"
          assert:
            - "StudyPlanDomain for domain_code A has mastery == 80"
            - "StudyPlanDomain for domain_code B has mastery == 50 and domain_code C has mastery == 50"
            - "Enrollment.${enr_id}.readiness_score == 75"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: enrollment_branches_active_to_pass_vs_fail_divergent_side_effects
        grounds:
          - state_machines.Enrollment.ACTIVE_to_PASSED
          - state_machines.Enrollment.ACTIVE_to_FAILED
          - entities.Enrollment.fields.exam_outcome
        distinguishing_aspect: |
          The Enrollment fork ACTIVE -> {PASSED, FAILED} has divergent side-effect sets:
          PASS drops cohort memberships and requires zero balance; FAIL snapshots
          guarantee_eligible and leaves status non-terminal (FAILED). Branching on the
          Enrollment entity.
        test_recipe:
          setup:
            - "Two ACTIVE paid-in-full enrollments on a published program; one certified PASS, one certified FAIL."
          setup_api_calls:
            - call: "POST /license-programs"
              payload: { license_code: "RE-BROK", title: "RE Broker", passing_scaled_score: 70, domain_weights: [ { domain_code: "A", weight: 1.00 } ] }
              as: ContentAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /license-programs/${prog_id}/items"
              payload: { domain_code: "A", difficulty: "EASY", correct_choice: "A" }
              as: ContentAdmin
            - call: "POST /license-programs/${prog_id}/publish"
              payload: {}
              as: ContentAdmin
            - call: "POST /subscription-plans"
              payload: { tier: "BASIC", total_price_cents: 30000, down_payment_pct: 0.00, financing_months: 1, included_mock_credits: 3, pass_guarantee: false, guarantee_refund_pct: 0.0, includes_ce: false }
              as: ContentAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /learners"
              payload: { email: "pa@x.com", full_name: "Passer" }
              as: Learner
              captures: { l_pass: "$.data.id" }
            - call: "POST /learners"
              payload: { email: "fa@x.com", full_name: "Failer" }
              as: Learner
              captures: { l_fail: "$.data.id" }
            - call: "POST /enrollments"
              payload: { learner_id: "${l_pass}", license_program_id: "${prog_id}", subscription_plan_id: "${plan_id}", financed: false }
              as: Learner
              as_user_id: "${l_pass}"
              captures: { enr_pass: "$.data.id" }
            - call: "POST /enrollments"
              payload: { learner_id: "${l_fail}", license_program_id: "${prog_id}", subscription_plan_id: "${plan_id}", financed: false }
              as: Learner
              as_user_id: "${l_fail}"
              captures: { enr_fail: "$.data.id" }
            - call: "GET /enrollments/${enr_pass}/installments"
              as: Learner
              as_user_id: "${l_pass}"
              captures: { p_inst1: "$.data[0].id" }
            - call: "POST /enrollments/${enr_pass}/installments/${p_inst1}/pay"
              payload: {}
              as: Learner
              as_user_id: "${l_pass}"
            - call: "POST /enrollments/${enr_pass}/activate"
              payload: {}
              as: Learner
              as_user_id: "${l_pass}"
            - call: "POST /enrollments/${enr_fail}/activate"
              payload: {}
              as: Learner
              as_user_id: "${l_fail}"
          trigger:
            - call: "POST /enrollments/${enr_pass}/certify-exam"
              payload: { outcome: "PASS" }
              as: ExamProctor
            - call: "POST /enrollments/${enr_fail}/certify-exam"
              payload: { outcome: "FAIL" }
              as: ExamProctor
          assert:
            - "Enrollment.${enr_pass}.status == PASSED and exam_outcome == PASS"
            - "Enrollment.${enr_fail}.status == FAILED and exam_outcome == FAIL"
            - "Enrollment.${enr_fail}.guarantee_eligible == false (plan.pass_guarantee false)"

      - name: claim_branches_submitted_to_approve_vs_deny_divergent_side_effects
        grounds:
          - state_machines.PassGuaranteeClaim.SUBMITTED_to_APPROVED
          - state_machines.PassGuaranteeClaim.SUBMITTED_to_DENIED
          - entities.PassGuaranteeClaim.fields.status
        distinguishing_aspect: |
          The PassGuaranteeClaim fork SUBMITTED -> {APPROVED, DENIED} has divergent
          side-effects: APPROVE(RETAKE_EXTENSION) leaves the enrollment FAILED with
          refund 0, whereas DENY just terminates the claim. Branching on the
          PassGuaranteeClaim entity (different entity from the Enrollment fork).
        test_recipe:
          setup:
            - "PRO pass_guarantee plan; eligible FAILED enrollment (200 questions, 2 mocks, conservative readiness >= 75); one RETAKE_EXTENSION claim filed."
          setup_api_calls:
            - call: "POST /license-programs"
              payload: { license_code: "CPA-REG", title: "REG", passing_scaled_score: 75, domain_weights: [ { domain_code: "A", weight: 1.00 } ] }
              as: ContentAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /license-programs/${prog_id}/items"
              payload: { domain_code: "A", difficulty: "MEDIUM", correct_choice: "A" }
              as: ContentAdmin
            - call: "POST /license-programs/${prog_id}/publish"
              payload: {}
              as: ContentAdmin
            - call: "POST /subscription-plans"
              payload: { tier: "PRO", total_price_cents: 50000, down_payment_pct: 0.00, financing_months: 1, included_mock_credits: 5, pass_guarantee: true, guarantee_refund_pct: 0.50, includes_ce: false }
              as: ContentAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /learners"
              payload: { email: "rx@x.com", full_name: "Retake" }
              as: Learner
              captures: { learner_id: "$.data.id" }
            - call: "POST /enrollments"
              payload: { learner_id: "${learner_id}", license_program_id: "${prog_id}", subscription_plan_id: "${plan_id}", financed: false }
              as: Learner
              as_user_id: "${learner_id}"
              captures: { enr_id: "$.data.id" }
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: Learner
              as_user_id: "${learner_id}"
            - call: "POST /enrollments/${enr_id}/practice-sessions"
              payload: { domain_code: "A", answered_count: 200, correct_count: 200 }
              as: Learner
              as_user_id: "${learner_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-07T09:00:00Z" }
              as: PlatformOps
            - call: "POST /enrollments/${enr_id}/mock-exams"
              payload: { raw_score: 70, item_count: 100 }
              as: Learner
              as_user_id: "${learner_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-08T09:00:00Z" }
              as: PlatformOps
            - call: "POST /enrollments/${enr_id}/mock-exams"
              payload: { raw_score: 84, item_count: 100 }
              as: Learner
              as_user_id: "${learner_id}"
            - call: "POST /enrollments/${enr_id}/certify-exam"
              payload: { outcome: "FAIL" }
              as: ExamProctor
            - call: "POST /pass-guarantee-claims"
              payload: { enrollment_id: "${enr_id}", remedy: "RETAKE_EXTENSION" }
              as: Learner
              as_user_id: "${learner_id}"
              captures: { claim_id: "$.data.id" }
          trigger:
            - call: "POST /pass-guarantee-claims/${claim_id}/decide"
              payload: { decision: "APPROVE" }
              as: ExamProctor
          assert:
            - "PassGuaranteeClaim.${claim_id}.status == APPROVED"
            - "PassGuaranteeClaim.${claim_id}.refund_amount_cents == 0"
            - "Enrollment.${enr_id}.status == FAILED (RETAKE_EXTENSION does not refund)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: moneyback_approval_cascades_enrollment_installments_and_cohort_depth3
        grounds:
          - state_machines.PassGuaranteeClaim.SUBMITTED_to_APPROVED
          - state_machines.Enrollment.FAILED_to_REFUNDED
          - state_machines.CohortMembership.JOINED_to_DROPPED
          - state_machines.Cohort.FULL_to_OPEN
        distinguishing_aspect: |
          Depth-3 chain: APPROVE MONEY_BACK claim (A) drives Enrollment FAILED->REFUNDED (B);
          that transition (B) itself voids DUE Installments AND drops the enrollment's
          JOINED CohortMembership (C); the drop (C) itself recomputes the Cohort
          FULL->OPEN (D). Each hop is caused by the previous hop, not by the claim directly.
        test_recipe:
          setup:
            - "Eligible FAILED enrollment (PRO money-back plan, financed) with one DUE installment remaining and one JOINED membership in a capacity-1 cohort (cohort FULL). MONEY_BACK claim SUBMITTED."
          setup_api_calls:
