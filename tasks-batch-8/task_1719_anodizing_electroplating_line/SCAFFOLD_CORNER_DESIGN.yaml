          setup: ["one bath exists"]
          setup_api_calls:
            - { call: "POST /baths", payload: { bath_code: "ANO-ENV", process_type: "ANODIZE", chemistry_family: "SULFURIC", routing_modes_supported: ["BARREL"], volume_liters: 800, target_concentration_g_l: 5.0, low_concentration_g_l: 4.0, high_concentration_g_l: 6.0, amp_hour_capacity: 600 }, as: ShopManager, captures: { benv: $.data.id } }
          trigger:
            - { call: "GET /baths/${benv}", as: LabChemist, captures: { env_obj: $.data.id } }
            - { call: "GET /baths/${benv}/titrations", as: LabChemist, captures: { env_list: $.data } }
            - { call: "GET /baths/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: LabChemist, captures: { env_err: $.data.error_id } }
          assert:
            - "detail response: response_type == 'object', meta.api_request_id present"
            - "list response: response_type == 'array', data is an array (possibly empty)"
            - "error response: response_type == 'error', data.error_id == 'ERR_NOT_FOUND', data.message present"

      - name: fk_reverse_lists_resolvable
        claim_type: parent_relationship
        grounds: [entities.BathTitration.fields.bath_id, entities.WorkOrder.fields.customer_id, entities.ManifestLineItem.fields.manifest_id]
        distinguishing_aspect: "Every FK is reverse-reachable: the titration appears under GET /baths/{id}/titrations, the order under GET /work-orders?customer_id=, the line item under GET /waste-manifests/{id}/line-items."
        test_recipe:
          setup: ["bath BF with one titration; customer CF with one order; manifest MFK with one line"]
          setup_api_calls:
            - { call: "POST /customers", payload: { company_name: "FK Co" }, as: ShopManager, captures: { cfk: $.data.id } }
            - { call: "POST /baths", payload: { bath_code: "ANO-FK", process_type: "ANODIZE", chemistry_family: "SULFURIC", routing_modes_supported: ["BARREL"], volume_liters: 800, target_concentration_g_l: 5.0, low_concentration_g_l: 4.0, high_concentration_g_l: 6.0, amp_hour_capacity: 600 }, as: ShopManager, captures: { bfk: $.data.id } }
            - { call: "POST /baths/${bfk}/titrations", payload: { titrant_volume_ml: 50.0, titrant_normality: 0.1, sample_volume_ml: 49.0 }, as: LabChemist, captures: { tfk: $.data.id } }
            - { call: "POST /work-orders", payload: { customer_id: "${cfk}", part_number: "PN-FK", alloy_code: "AL6061", process_type: "ANODIZE", routing_mode: "BARREL", part_count: 5, surface_area_dm2_per_part: 2.0, thickness_spec_min_um: 10.0, thickness_spec_max_um: 14.0 }, as: Customer, as_user_id: "${cfk}", captures: { wfk: $.data.id } }
            - { call: "POST /waste-manifests", payload: { generator_epa_id: "EPA-GEN-FK" }, as: EHSOfficer, as_user_id: "ehs-fk", captures: { mfk: $.data.id, mfk_v: $.data.version } }
            - { call: "POST /waste-manifests/${mfk}/line-items", payload: { waste_code: "D007", source_type: "RINSE_CONCENTRATE", description: "Rinse", volume_liters: 25, expected_manifest_version: "${mfk_v}" }, as: EHSOfficer, as_user_id: "ehs-fk", captures: { lfk: $.data.id } }
          trigger:
            - { call: "GET /baths/${bfk}/titrations", as: LabChemist, captures: { tit_list: $.data } }
            - { call: "GET /work-orders", payload: { customer_id: "${cfk}" }, as: LineOperator, captures: { wo_list: $.data } }
            - { call: "GET /waste-manifests/${mfk}/line-items", as: EHSOfficer, captures: { li_list: $.data } }
          assert:
            - "GET /baths/${bfk}/titrations returns exactly 1 row with id == ${tfk} and bath_id == ${bfk}"
            - "GET /work-orders?customer_id=${cfk} returns exactly 1 row with id == ${wfk}"
            - "GET /waste-manifests/${mfk}/line-items returns exactly 1 row with id == ${lfk}, mass_kg == 30.0 (25 L x 1.2)"

  # =========================================================================
  # Section: errors (triggerability audit — §1.8-covered errors as stubs)
  # =========================================================================
  - section: errors
    instances:
      - name: error_stale_version_on_load_start
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_VERSION]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / stale_version_beats_bath_occupied
          rationale: "Asserted as the 412 failure path of the named §1.8 instance (stale load start); dose/manifest/wo-amend OCC variants are covered by corner instances dose_stale_version_rejected, manifest_line_stale_version_rejected, workorder_amend_occ_and_quote_recompute."
      - name: error_alloy_bath_incompatible
        claim_type: violation_to_error
        grounds: ["errors[ERR_ALLOY_BATH_INCOMPATIBLE]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / alloy_incompatibility_beats_credit_hold
          rationale: "Fail-closed rejection asserted as the winning error of the named §1.8 priority-conflict instance; the delete-reopens case is covered by corner alloy_rule_delete_restores_fail_closed."
      - name: error_customer_credit_hold
        claim_type: violation_to_error
        grounds: ["errors[ERR_CUSTOMER_CREDIT_HOLD]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / ship_gated_by_customer_credit_hold
          rationale: "Ship-time hold rejection and recovery asserted in the named §1.8 instance; route-time priority interplay asserted in alloy_incompatibility_beats_credit_hold."
      - name: error_bath_life_insufficient
        claim_type: violation_to_error
        grounds: ["errors[ERR_BATH_LIFE_INSUFFICIENT]"]
        excluded_because:
          difficulty_instance: dual_variant_calc / bath_life_nameplate_vs_chemistry_adjusted
          rationale: "Asserted as the route rejection when the pessimistic variant (588) is below the 590 estimate while nameplate (600) would pass."
      - name: error_bath_capacity_exceeded
        claim_type: violation_to_error
        grounds: ["errors[ERR_BATH_CAPACITY_EXCEEDED]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / bath_capacity_inclusive_equality
          rationale: "Asserted at 541 > 540 in the named boundary instance (with the inclusive-equality pass case at exactly 540)."
      - name: error_fixture_occupied
        claim_type: violation_to_error
        grounds: ["errors[ERR_FIXTURE_OCCUPIED]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / fixture_half_open_occupancy
          rationale: "Asserted for the overlapping-load rejection and the half-open adjacency pass in the named §1.8 instance."
      - name: error_permit_window_overlap
        claim_type: violation_to_error
        grounds: ["errors[ERR_PERMIT_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / permit_closed_window_overlap
          rationale: "Asserted for the shared-boundary-date rejection (closed semantics) in the named §1.8 instance."
      - name: error_discharge_exceedance_hold
        claim_type: violation_to_error
        grounds: ["errors[ERR_DISCHARGE_EXCEEDANCE_HOLD]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / manifest_finalize_gated_by_permit_exceedance
          rationale: "Asserted as the finalize rejection during an active exceedance (and bath-release hold in discharge_exceedance_cascade)."

  # =========================================================================
  # Section: rbac
  # =========================================================================
  - section: rbac
    instances:
      - name: rbac_exclusive_denials_forbidden
        claim_type: violation_to_error
        grounds: [roles.Customer, roles.LineOperator, roles.LabChemist, roles.QCInspector, roles.EHSOfficer, roles.ShopManager]
        distinguishing_aspect: "Each role is denied another role's exclusive operation with 403 ERR_INSUFFICIENT_PERMISSIONS (Customer creating baths; LabChemist inspecting; QCInspector titrating; EHSOfficer preparing; LineOperator creating permits), while ShopManager override succeeds on the same prepare operation."
        test_recipe:
          setup: ["customer CRB, order WRB (RECEIVED), bath BRB (ACTIVE)"]
          setup_api_calls:
            - { call: "POST /customers", payload: { company_name: "RBAC Co" }, as: ShopManager, captures: { crb: $.data.id } }
            - { call: "POST /work-orders", payload: { customer_id: "${crb}", part_number: "PN-RB", alloy_code: "AL6061", process_type: "ANODIZE", routing_mode: "BARREL", part_count: 5, surface_area_dm2_per_part: 2.0, thickness_spec_min_um: 10.0, thickness_spec_max_um: 14.0 }, as: ShopManager, captures: { wrb: $.data.id } }
            - { call: "POST /baths", payload: { bath_code: "ANO-RB", process_type: "ANODIZE", chemistry_family: "SULFURIC", routing_modes_supported: ["BARREL"], volume_liters: 800, target_concentration_g_l: 5.0, low_concentration_g_l: 4.0, high_concentration_g_l: 6.0, amp_hour_capacity: 600 }, as: ShopManager, captures: { brb: $.data.id } }
          trigger:
            - { call: "POST /baths", payload: { bath_code: "ANO-RB2", process_type: "ANODIZE", chemistry_family: "SULFURIC", routing_modes_supported: ["BARREL"], volume_liters: 800, target_concentration_g_l: 5.0, low_concentration_g_l: 4.0, high_concentration_g_l: 6.0, amp_hour_capacity: 600 }, as: Customer, as_user_id: "${crb}", captures: { e1: $.data.error_id } }
            - { call: "POST /work-orders/${wrb}/inspections", payload: { thickness_readings_um: [12.0, 13.0, 14.0], defect_type: "NONE" }, as: LabChemist, captures: { e2: $.data.error_id } }
            - { call: "POST /baths/${brb}/titrations", payload: { titrant_volume_ml: 50.0, titrant_normality: 0.1, sample_volume_ml: 49.0 }, as: QCInspector, captures: { e3: $.data.error_id } }
            - { call: "POST /work-orders/${wrb}/prepare", payload: {}, as: EHSOfficer, captures: { e4: $.data.error_id } }
            - { call: "POST /discharge-permits", payload: { outfall_code: "OUTFALL-RB", effective_from: "2026-08-01", effective_to: "2026-08-31", limits: [{ analyte_code: "NICKEL", max_concentration_mg_l: 2.0, monthly_mass_cap_g: 500.0 }] }, as: LineOperator, captures: { e5: $.data.error_id } }
            - { call: "POST /work-orders/${wrb}/prepare", payload: {}, as: ShopManager, captures: { wrb_st: $.data.status } }
          assert:
            - "all five cross-role attempts rejected with error_id == ERR_INSUFFICIENT_PERMISSIONS (403)"
            - "ShopManager (hierarchical override) performs prepare: order -> READY_FOR_ROUTING"

  # =========================================================================
  # Section: cross_cutting_layers (declared complexity layers)
  # =========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_layer_coverage
        claim_type: violation_to_error
        grounds: ["concurrency_rules[dose-stale-bath-version]", "concurrency_rules[load-start-stale-bath-version]", "concurrency_rules[manifest-line-add-stale-version]", "concurrency_rules[workorder-amend-stale-version]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / stale_version_beats_bath_occupied
          rationale: "All four OCC rules are exercised: load-start stale in the named §1.8 instance; dose, manifest-line, and workorder-amend stale-version rejections in corner instances dose_stale_version_rejected, manifest_line_stale_version_rejected, workorder_amend_occ_and_quote_recompute."
      - name: cascading_side_effects_layer
        claim_type: side_effect_execution
        grounds: [state_machines.DischargePermit.ACTIVE_to_EXCEEDED]
        excluded_because:
          difficulty_instance: transitive_cascade / discharge_exceedance_cascade
          rationale: "The 3-hop exceedance cascade (permit -> baths -> work orders) plus hold/release recovery is asserted hop-by-hop in the named §1.8 instance; conditional skip is in corner sulfuric_bath_immune_to_nickel_exceedance."
      - name: dual_variant_calculation_layer
        claim_type: correct_result
        grounds: [calculations.provisional_quote, calculations.bath_life_projection]
        excluded_because:
          difficulty_instance: dual_variant_calc / invoice_provisional_vs_final_divergence
          rationale: "Both variant pairs (WorkOrder invoice provisional/final and PlatingBath nameplate/effective) asserted with literal cent/amp-hour values in the two §1.8 rule-1 instances."
      - name: rate_threshold_triggers_layer
        claim_type: correct_result
        grounds: [calculations.amp_hour_consumption, calculations.waste_mass_accounting]
        excluded_because:
          difficulty_instance: transitive_cascade / load_completion_exhaustion_cascade
          rationale: "Threshold crossings asserted: bath exhaustion at exactly capacity in the named §1.8 instance; discharge instantaneous/cumulative strict-greater crossings in discharge_limit_strict_greater_than and cumulative_cap_equality_compliant."

  # =========================================================================
  # Section: consistency_model (immediate)
  # =========================================================================
  - section: consistency_model
    instances:
      - name: immediate_read_after_write_consistency
        claim_type: side_effect_execution
        grounds: [complexity_profile.consistency_model, calculations.amp_hour_consumption]
        excluded_because:
          difficulty_instance: compensating_invariant / amp_hour_ledger_invariant
          rationale: "Same-request and immediately-following-read visibility of reservation/debit/release is asserted step-by-step (start -> GET, abort -> GET, complete -> GET) in the named §1.8 instance and in corner dragout_depletion_visible_immediately."



