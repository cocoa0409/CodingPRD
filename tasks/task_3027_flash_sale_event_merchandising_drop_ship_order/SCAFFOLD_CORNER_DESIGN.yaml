            - "CustomerOrder.${order_id}.order_status is still AWAITING_VENDOR and payment_status is still AUTHORIZED"
            - "the same cancel as CustomerService on the identical order succeeds with 200 because the gate only binds the Customer actor"
            - "after the operator cancel CustomerOrder.${order_id}.order_status == CANCELLED and the ledger returns a 4th row"

      - name: listing_create_with_a_duplicate_vendor_sku_returns_duplicate_error
        claim_type: Satisfaction → Pass
        grounds:
          - validations[priority=9]
          - errors.ERR_DUPLICATE_VENDOR_SKU
          - endpoints.POST_/listings
        distinguishing_aspect: "vendor_sku uniqueness is scoped to one event rather than globally, so reusing a SKU inside the same event is refused with 409 ERR_DUPLICATE_VENDOR_SKU while the same SKU is accepted on a different event."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One vendor, one shop and two DRAFT events on that shop, with one listing on the first event."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Merchandiser
            - call: "POST /vendors"
              payload: { legal_name: "Northwind Outfitters", vendor_tier: "STANDARD" }
              as: Merchandiser
              captures: { vendor_id: $.data.id }
            - call: "POST /shops"
              payload: { vendor_id: "${vendor_id}", shop_name: "Northwind Brand Shop" }
              as: Merchandiser
              captures: { shop_id: $.data.id }
            - call: "POST /events"
              payload: { shop_id: "${shop_id}", event_title: "Event One", starts_at: "2026-09-01T00:00:00Z", ends_at: "2026-09-02T00:00:00Z", ship_time_quote_days: 14 }
              as: Merchandiser
              captures: { event1_id: $.data.id }
            - call: "POST /events"
              payload: { shop_id: "${shop_id}", event_title: "Event Two", starts_at: "2026-09-20T00:00:00Z", ends_at: "2026-09-21T00:00:00Z", ship_time_quote_days: 14 }
              as: Merchandiser
              captures: { event2_id: $.data.id }
            - call: "POST /listings"
              payload: { event_id: "${event1_id}", vendor_sku: "NW-DUP-1", unit_price_cents: 100, vendor_unit_cost_cents: 60, allocation_units: 4, reveal_at: "2026-09-01T00:00:00Z" }
              as: Merchandiser
          trigger:
            - call: "POST /listings"
              payload: { event_id: "${event1_id}", vendor_sku: "NW-DUP-1", unit_price_cents: 150, vendor_unit_cost_cents: 90, allocation_units: 2, reveal_at: "2026-09-01T00:00:00Z" }
              as: Merchandiser
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_DUPLICATE_VENDOR_SKU"
            - "GET /listings?event_id=${event1_id} still returns exactly 1 row"
            - "the same SKU NW-DUP-1 IS accepted on the second event: POST /listings against ${event2_id} returns 201 because uniqueness is scoped per event"
            - "GET /listings?event_id=${event2_id} returns exactly 1 row with vendor_sku NW-DUP-1"
            - "the satisfied case leaves the first event's row untouched: its unit_price_cents is still 100"

      - name: listing_create_with_a_future_reveal_at_is_rejected_at_submission_not_at_creation
        claim_type: Temporal validation
        grounds:
          - validations[priority=10]
          - errors.ERR_LISTING_NOT_REVEALED
          - state_machines.Confirmation.PENDING_AGGREGATION_to_PENDING_VENDOR
        distinguishing_aspect: "The reveal_at rule is a temporal gate that is legal at creation time and only bites later: a line added before the reveal instant is accepted, but submitting the order that carries it is refused with 409 ERR_LISTING_NOT_REVEALED."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Vendor V1, Shop S1, Event E1 running 2026-09-01T00:00:00Z to 2026-09-03T00:00:00Z with a 14-day quote, and a Listing L1 whose reveal_at is 2026-09-02T12:00:00Z."
            - "Event E1 is scheduled and launched so the listing's reveal gate is the only remaining obstacle."
