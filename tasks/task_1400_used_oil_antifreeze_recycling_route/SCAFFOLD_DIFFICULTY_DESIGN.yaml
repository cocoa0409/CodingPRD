            # Third stop would push loaded to 101 > capacity 100 → ERR_ROUTE_CAPACITY_EXCEEDED
            - { call: "POST /recycle-routes/route-stops/${s3}/arrive", payload: {}, as: Driver, as_user_id: "${drv_id}" }
            - { call: "POST /recycle-routes/route-stops/${s3}/begin-screening", payload: {}, as: Driver, as_user_id: "${drv_id}" }
