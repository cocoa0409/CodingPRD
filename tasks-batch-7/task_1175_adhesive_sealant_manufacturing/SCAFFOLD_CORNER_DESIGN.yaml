      - name: decide_from_submitted_returns_409
        claim_type: invalid_transition
        grounds: [state_machines.FormulationRequest.TECH_REVIEW_to_APPROVED, "errors[ERR_REQUEST_INVALID_STATE]"]
        distinguishing_aspect: "Skipping start-review: decide from SUBMITTED is rejected — the review chain cannot be bypassed."
