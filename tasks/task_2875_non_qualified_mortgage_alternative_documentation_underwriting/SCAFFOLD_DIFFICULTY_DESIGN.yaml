  - rule_id: cross_entity_state_dependency
    instances:
      - name: loan_approval_gated_by_appraisal_review_second_valuation_dimension
        grounds:
          - validations.priority_21
          - state_machines.AppraisalReview.dimensions.second_valuation_status
          - state_machines.LoanFile.UNDERWRITING_to_APPROVED
          - calculations.appraisal_reconciliation
        distinguishing_aspect: |
          Entity pair (LoanFile, AppraisalReview): whether LoanFile may leave UNDERWRITING
          depends entirely on a state dimension owned by a different entity. Three successive
          approve attempts fail at SECOND_REQUIRED, SECOND_ORDERED and SECOND_RECEIVED - only
          SECOND_RECONCILED clears the gate, so it is the review's state, not the existence of
          a second appraisal, that governs.
