      - name: reconcile_twice_on_an_average_agreement_returns_agreement_invalid_state
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.AverageAgreement.OPEN_to_RECONCILED
          - errors.ERR_AGREEMENT_INVALID_STATE
        distinguishing_aspect: |
          RECONCILED is terminal, so the second reconcile is 409 even though the
          fork condition net_days >= 0 still holds — an agreement that could be
          reconciled twice would double-freeze a credit that has already been
          applied to an invoice.
        test_recipe:
          setup:
            - "one customer with an OPEN AverageAgreement for 2026-08 and no released cycles, so credit_days_earned 0, debit_days_incurred 0 and net_days 0"
          setup_api_calls:
            - call: "POST /demurrage/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /demurrage/customers"
              payload: { customer_code: "C9S12-CUST", name: "Twice Reconciled Rutile", serving_station_code: "STN49" }
              as: BillingAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /demurrage/average-agreements"
              payload: { customer_id: "${cust_id}", agreement_month: "2026-08", credit_cap_ratio: 0.3 }
              as: BillingAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /demurrage/average-agreements/${agr_id}/reconcile"
              payload: {}
              as: BillingAdmin
              captures: { agr_v: $.data.version }
          trigger:
            - call: "POST /demurrage/average-agreements/${agr_id}/reconcile"
              payload: {}
              as: BillingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the first reconcile returned 200 with status RECONCILED (net_days 0 satisfies net_days >= 0, so the fork chose RECONCILED and not FORFEITED)"
            - "the trigger returns 409 with error_id ERR_AGREEMENT_INVALID_STATE"
            - "the agreement is still RECONCILED with agreement_credit_cents 0 and its version is still ${agr_v}"

      - name: third_refusal_on_one_cycle_returns_refusal_limit
