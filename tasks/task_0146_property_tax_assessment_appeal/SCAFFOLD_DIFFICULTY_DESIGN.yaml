# =============================================================================
# Property Tax Assessment & Appeal — SCAFFOLD_DIFFICULTY_DESIGN (§1.8)
# Test Targeting Index: cross-references §1.1–§1.7 of SCAFFOLD.yaml per
# Difficulty Rule (§0.5). All `grounds:` refs MUST resolve in SCAFFOLD.yaml.
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — Dual-variant calculations across different entity domains
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: capped_value_growth_vs_reset_on_property
        grounds:
          - calculations.capped_assessed_value
          - entities.Property.fields.ownership_change_date
          - entities.Assessment.fields.cap_reset_applied
          - state_machines.Assessment.DRAFT_to_ISSUED
        distinguishing_aspect: |
          Two valid algorithms on the Property/Assessment domain produce
          different capped_value for identical market_value_at_roll: variant
          'growth_capped' applies prior_capped_value*(1+GROWTH_CAP) ceiling
          while variant 'reset_to_market' bypasses the cap because
          ownership_change_date falls within the roll year. This rule operates
          on the Property-Assessment entity domain.
        test_recipe:
          setup:
            - "Owner O1 created"
            - "Property P with owner_id=O1, market_value=500000"
            - "Assessment A1 issued for roll_year=2025 (no prior) → capped_value=500000 (reset_to_market, first roll)"
            - "Owner O2 created and Property transferred via PATCH /properties/P/owner (ownership_change_date now in 2026)"
            - "Assessment A2 created for roll_year=2026 with market_value_at_roll=600000"
            - "Branch B (control, no transfer): separate Property P2 with same prior_capped=500000, no transfer, Assessment for 2026 market_value_at_roll=600000"
          trigger:
            - "POST /properties/P/assessments/A2/issue"
            - "POST /properties/P2/assessments/A2'/issue"
          assert:
            - "P's A2.capped_value == 600000.00 (reset_to_market variant; cap_reset_applied==true)"
            - "P2's A2'.capped_value == 510000.00 (growth_capped variant; cap_reset_applied==false; ceiling=500000*1.02=510000)"
            - "Same market_value_at_roll=600000 produced different capped_value (600000 vs 510000) — variants are truly dual"

      - name: appeal_bill_reconciliation_refund_vs_credit_on_taxbill
        grounds:
          - calculations.appeal_bill_reconciliation
          - state_machines.Appeal.HEARD_to_DECIDED
          - entities.TaxBill.fields.amount_due
          - entities.Payment.fields.status
        distinguishing_aspect: |
          On the TaxBill/Payment entity domain (distinct from the
          Property/Assessment domain of instance 1), the same DECIDED appeal
          on the same bill yields different cash flows depending on
          decision_outcome: REDUCED triggers variant 'refund_first' which
          flips Payments to REFUNDED (refund_reason=APPEAL_REDUCED), while
          INCREASED triggers variant 'credit_carry' which only grows
          amount_due. Same inputs (bill + payments) → different observable
          Payment.status set.
        test_recipe:
          setup:
            - "Owner O, Property P with owner_id=O, market_value=510000"
            - "Assessment A with capped_value=510000 issued and FINALIZED via clock advance past appeal_window_closes_at"
            - "TaxBill B for P/roll_year with no exemptions, mill_rate=12.5 → base_tax_amount=6375.00"
            - "B issued; Owner pays 4000.00 (Payment P1 APPLIED); amount_due=2375.00"
            - "Branch REDUCED: file Appeal A_red claimed_value=300000, schedule, conduct, decide REDUCED with decided_value=400000 → new base_tax = 400000*12.5/1000 = 5000.00; excess_paid = max(4000 - 5000, 0) = 0 → no refund; amount_due=1000.00"
            - "Branch INCREASED (separate fresh setup, same numbers): decide INCREASED with decided_value=600000 → new base_tax = 600000*12.5/1000 = 7500.00; no refund; amount_due=3500.00"
          trigger:
            - "POST /properties/P/appeals/A_red/decide (REDUCED, decided_value=400000)"
            - "POST /properties/P/appeals/A_inc/decide (INCREASED, decided_value=600000) in branch 2"
          assert:
            - "REDUCED branch: B.amount_due == 1000.00 AND no Payment.status == REFUNDED (excess_paid was 0)"
            - "INCREASED branch: B.amount_due == 3500.00 AND no Payment.status == REFUNDED"
            - "Different outcomes from same starting state confirms two structurally distinct variants on the bill domain"

      - name: appeal_bill_reconciliation_refund_emitted
        grounds:
          - calculations.appeal_bill_reconciliation
          - state_machines.Appeal.HEARD_to_DECIDED
          - entities.Payment.fields.refund_reason
        distinguishing_aspect: |
          A second TaxBill-domain instance proving the refund_first variant
          actually emits a Payment.status=REFUNDED row with
          refund_reason=APPEAL_REDUCED when total_payments_applied truly
          exceeds the new base_tax_amount — falsifying any implementation
          that silently absorbs the excess as a credit.
        test_recipe:
          setup:
            - "Owner O, Property P, Assessment A FINALIZED with capped_value=500000"
            - "TaxBill B with no exemptions, mill_rate=12.5 → base_tax=6250.00"
            - "B issued; Owner pays 4000.00 (Payment P1)"
            - "File Appeal A1, schedule, conduct"
          trigger:
            - "POST /properties/P/appeals/A1/decide (REDUCED, decided_value=300000)"
          assert:
            - "new base_tax = 300000 * 12.5 / 1000 = 3750.00"
            - "Excess = 4000.00 - 3750.00 = 250.00 → Payment P1 split into APPLIED chunk of 3750.00 + REFUNDED chunk of 250.00 OR P1 flipped REFUNDED with new APPLIED Payment of 3750.00"
            - "At least one Payment row exists with status=REFUNDED AND refund_reason=APPEAL_REDUCED"
            - "B.amount_due == 0.00"

  # ---------------------------------------------------------------------------
  # Rule 2 — Combinatorial formulas across different modes
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: exemption_stack_tiered_priority_mode_a
        grounds:
          - calculations.exemption_stack
          - entities.ExemptionApplication.fields.exemption_type
          - entities.Owner.fields.disability_rating
        distinguishing_aspect: |
          Mode (a): formula with ≥3 inputs and non-linear interaction. The
          exemption stack combines (capped_value, HOMESTEAD_PCT,
          HOMESTEAD_CAP_DOLLARS, SENIOR_FLAT, VETERAN_FLAT,
          DISABILITY_FULL, Owner.disability_rating tier) via nested
          min/floor branching: HOMESTEAD uses min(pct*base, cap),
          DISABILITY branches on rating>=70 vs <70 (half), and each layer
          floors residual at 0. Result depends on which subset is
          APPROVED.
        test_recipe:
          setup:
            - "Owner O age 70, veteran=true, disability_rating=80"
            - "Property P with owner_id=O, Assessment with capped_value=510000 FINALIZED"
            - "Four ExemptionApplications submitted for roll_year (HOMESTEAD, SENIOR, VETERAN, DISABILITY)"
          trigger:
            - "POST /properties/P/exemption_applications/{each}/approve in order"
            - "POST /properties/P/tax_bills (mill_rate=12.5)"
          assert:
            - "HOMESTEAD approved_amount == min(0.20*510000, 75000) == 75000.00"
            - "SENIOR approved_amount == 25000.00"
            - "VETERAN approved_amount == 15000.00"
            - "DISABILITY approved_amount == 30000.00 (rating 80 >= 70 → full)"
            - "TaxBill.total_exemption_amount == 145000.00"
            - "TaxBill.taxable_value == 365000.00"
            - "TaxBill.base_tax_amount == 4562.50"

      - name: tax_bill_rounding_order_mode_b
        grounds:
          - calculations.tax_bill_computation
          - calculations.exemption_stack
          - entities.TaxBill.fields.base_tax_amount
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. The scaffold pins
          'per-layer rounding then sum' for exemption_stack and 'subtract
          then round at taxable_value; multiply then round at
          base_tax_amount' for tax_bill_computation. A naive
          'sum-then-round' implementation produces a different cent total
          on properties where HOMESTEAD percentage tier multiplication
          yields fractional cents.
        test_recipe:
          setup:
            - "Owner O age 70, disability_rating=60 (between 50-70 → half disability)"
            - "Property P, Assessment capped_value=333333 FINALIZED"
            - "All 4 exemptions submitted then approved (HOMESTEAD, SENIOR, VETERAN, DISABILITY)"
          trigger:
            - "POST /properties/P/exemption_applications/{each}/approve"
            - "POST /properties/P/tax_bills (mill_rate=12.5)"
          assert:
            - "HOMESTEAD layer: min(round_half_up(0.20*333333,2), 75000) == min(66666.60, 75000) == 66666.60"
            - "SENIOR layer: 25000.00; VETERAN layer: 15000.00; DISABILITY layer (half): round_half_up(0.5*30000,2) == 15000.00"
            - "total_exemption_amount == 66666.60 + 25000.00 + 15000.00 + 15000.00 == 121666.60 (per-layer rounding pinned)"
            - "taxable_value == round_half_up(333333 - 121666.60, 2) == 211666.40"
            - "base_tax_amount == round_half_up(211666.40 * 12.5 / 1000, 2) == 2645.83 (rounded after multiplication)"

      - name: appeal_decided_then_recomputed_bill_mode_c
        grounds:
          - calculations.appeal_bill_reconciliation
          - calculations.tax_bill_computation
          - state_machines.Appeal.HEARD_to_DECIDED
          - state_machines.Assessment.UNDER_APPEAL_to_FINALIZED
        distinguishing_aspect: |
          Mode (c): circular-looking dependency with pinned evaluation
          order. amount_due depends on base_tax_amount; base_tax_amount
          depends on taxable_value; taxable_value depends on
          total_exemption_amount; on appeal DECIDED, capped_value is
          updated by appeal_bill_reconciliation which then triggers
          tax_bill_computation which then triggers refund_first within
          the same chain — and the refund_first variant feeds back into
          amount_due. The scaffold pins the order: appeal_decision →
          capped_value update → tax_bill_computation → refund processing
          → final amount_due.
        test_recipe:
          setup:
            - "Owner O, Property P, Assessment A capped_value=500000, FINALIZED"
            - "TaxBill B issued, mill_rate=12.5, no exemptions → base_tax=6250.00"
            - "Owner pays 5000 (Payment APPLIED)"
            - "File and schedule Appeal A1; conduct"
          trigger:
            - "POST /properties/P/appeals/A1/decide (REDUCED, decided_value=320000)"
          assert:
            - "Step1 Assessment.capped_value == 320000.00"
            - "Step2 TaxBill.base_tax_amount == round_half_up(320000*12.5/1000, 2) == 4000.00"
            - "Step3 excess = 5000.00 - 4000.00 = 1000.00 → Payment refunded chunk 1000.00 (refund_reason=APPEAL_REDUCED)"
            - "Step4 B.amount_due == 0.00"
            - "Order is pinned: amount_due is well-defined exactly 0.00, not -1000 nor 5000-4000=1000-refund-loop"

  # ---------------------------------------------------------------------------
  # Rule 3 — Non-linear state-machine shape on different entities
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: assessment_appeal_cycle
        grounds:
          - state_machines.Assessment.ISSUED_to_UNDER_APPEAL
          - state_machines.Assessment.UNDER_APPEAL_to_ISSUED
          - state_machines.Assessment.ISSUED_to_FINALIZED
        distinguishing_aspect: |
          Assessment is non-linear with a CYCLE: ISSUED → UNDER_APPEAL
          (on first Appeal filed) → ISSUED (on all Appeals withdrawn,
          while still inside appeal window) → UNDER_APPEAL again (new
          Appeal). This is structurally a back-and-forth loop, not a
          linear pipeline.
        test_recipe:
          setup:
            - "Property P, Assessment A issued at t0; appeal_window_closes_at = t0+30d"
            - "Owner files Appeal A1 → Assessment to UNDER_APPEAL"
          trigger:
            - "POST /properties/P/appeals/A1/withdraw (within window)"
            - "POST /properties/P/appeals (file new Appeal A2)"
            - "POST /properties/P/appeals/A2/withdraw"
          assert:
            - "Assessment.status sequence: ISSUED → UNDER_APPEAL → ISSUED → UNDER_APPEAL → ISSUED (cycle traversed twice)"
            - "Assessment.version incremented by 4 (each transition mutates)"

      - name: appeal_branching_decisions
        grounds:
          - state_machines.Appeal.HEARD_to_DECIDED
          - entities.Appeal.fields.decision_outcome
          - calculations.appeal_bill_reconciliation
        distinguishing_aspect: |
          Appeal is non-linear with BRANCHING: from state HEARD, the
          DECIDED transition forks into three distinct decision_outcome
          paths (UPHELD, REDUCED, INCREASED) each with divergent
          side-effect sets — REDUCED triggers refund_first variant,
          INCREASED triggers credit_carry variant, UPHELD triggers no
          tax recomputation. This is a fork from a single state with
          mutually exclusive side-effect sets — distinct from Assessment's
          cycle in instance 1.
        test_recipe:
          setup:
            - "Three independent Property/Assessment/TaxBill setups (P1, P2, P3), each FINALIZED with capped_value=500000, bill issued at base_tax=6250.00, owner paid 3000 (Payment APPLIED)"
            - "Three Appeals (A_u for P1, A_r for P2, A_i for P3) each FILED, SCHEDULED, CONDUCTED"
          trigger:
            - "POST /properties/P1/appeals/A_u/decide (UPHELD, decided_value=500000)"
            - "POST /properties/P2/appeals/A_r/decide (REDUCED, decided_value=400000)"
            - "POST /properties/P3/appeals/A_i/decide (INCREASED, decided_value=600000)"
          assert:
            - "P1.TaxBill.base_tax_amount == 6250.00 (UPHELD: unchanged); no Payment.status == REFUNDED"
            - "P2.TaxBill.base_tax_amount == 5000.00 (REDUCED: 400000*12.5/1000); no refund (3000 < 5000)"
            - "P3.TaxBill.base_tax_amount == 7500.00 (INCREASED); no refund"
            - "Branch divergence: three distinct base_tax_amount values from same starting capped_value, proving non-linear fork"

  # ---------------------------------------------------------------------------
  # Rule 4 — Transitive cascade chains from different triggers
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: appeal_decided_cascade_depth_3
        grounds:
          - state_machines.Appeal.HEARD_to_DECIDED
          - calculations.appeal_bill_reconciliation
          - calculations.tax_bill_computation
          - entities.Assessment.fields.capped_value
          - entities.TaxBill.fields.amount_due
          - entities.Payment.fields.status
        distinguishing_aspect: |
          Triggering action: Appeal.decide. Cascade depth 3:
            hop1: Appeal.status FILED→…→DECIDED mutates Appeal row
                  (decision_outcome, decided_value).
            hop2: That mutation on Appeal triggers Assessment.capped_value
                  to update (Assessment row mutated as a consequence of
                  Appeal mutation, NOT directly by the request).
            hop3: That mutation on Assessment triggers
                  tax_bill_computation which mutates the TaxBill row
                  (base_tax_amount, amount_due).
            hop4: That mutation on TaxBill triggers refund_first which
                  mutates Payment rows (status=REFUNDED). Each hop is
                  caused by the previous one, not by the request itself.
        test_recipe:
          setup:
            - "Property P, Assessment A FINALIZED capped_value=500000, TaxBill B issued base_tax=6250.00"
            - "Owner pays 5500.00 (Payment APPLIED), amount_due=750.00"
            - "Appeal A1 filed, scheduled, conducted"
          trigger:
            - "POST /properties/P/appeals/A1/decide (REDUCED, decided_value=400000)"
          assert:
            - "hop1: Appeal.status == DECIDED, decision_outcome == REDUCED"
            - "hop2: Assessment.capped_value == 400000.00 (caused by hop1)"
            - "hop3: TaxBill.base_tax_amount == 5000.00 (caused by hop2)"
            - "hop4: at least one Payment with status == REFUNDED, refund_reason == APPEAL_REDUCED (caused by hop3, since 5500 > 5000)"
            - "TaxBill.amount_due == 0.00 after refund of 500.00"

      - name: ownership_transfer_cascade_depth_2
        grounds:
          - endpoints[PATCH /properties/{property_id}/owner]
          - state_machines.ExemptionApplication.APPROVED_to_REVOKED
          - calculations.exemption_stack
          - calculations.tax_bill_computation
          - entities.ExemptionApplication.fields.revoked_reason
        distinguishing_aspect: |
          Triggering action: PATCH /properties/{id}/owner (different from
          instance 1's Appeal.decide trigger). Cascade depth 2:
            hop1: Property.owner_id and ownership_change_date mutate.
            hop2: That mutation on Property triggers APPROVED
                  ExemptionApplications for current roll_year to
                  auto-REVOKE (revoked_reason=OWNERSHIP_CHANGE).
            hop3: That revocation triggers exemption_stack recompute
                  which triggers tax_bill_computation on any
                  non-finalized TaxBill.
            Different root trigger than instance 1; different propagation
            pattern (ownership-driven invalidation vs decision-driven
            recalc).
        test_recipe:
          setup:
            - "Owner O1, Property P with O1, Assessment FINALIZED capped_value=400000"
            - "HOMESTEAD ExemptionApplication APPROVED for current roll_year, approved_amount=75000.00"
            - "SENIOR ExemptionApplication APPROVED, 25000.00"
            - "TaxBill B in PENDING state (not yet issued): base_tax = (400000-100000)*12.5/1000 = 3750.00"
            - "Owner O2 registered"
          trigger:
            - "PATCH /properties/P/owner (new_owner_id=O2)"
          assert:
            - "hop1: Property.owner_id == O2, ownership_change_date updated"
            - "hop2: HOMESTEAD ExemptionApplication.status == REVOKED, revoked_reason == OWNERSHIP_CHANGE; SENIOR same"
            - "hop3: TaxBill.total_exemption_amount == 0.00; TaxBill.base_tax_amount == 5000.00 (400000*12.5/1000)"

  # ---------------------------------------------------------------------------
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_temporal_pair
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - state_machines.Assessment.ISSUED_to_FINALIZED
        distinguishing_aspect: |
          Pair: state (priority 5, ERR_INVALID_STATE) vs business_temporal
          (priority 7, ERR_APPEAL_WINDOW_CLOSED). A request filing an
          Appeal against an already FINALIZED Assessment AFTER the
          appeal window has closed could trip both. Priority pins state
          check first → ERR_INVALID_STATE wins.
        test_recipe:
          setup:
            - "Property P, Assessment A issued at t0; appeal_window_closes_at = t0+30d"
            - "POST /_clock/advance to t0+45d (well past window)"
            - "Assessment auto-FINALIZED (now>=window and no Appeal)"
          trigger:
            - "POST /properties/P/appeals (assessment_id=A) as Owner"
          assert:
            - "Response error_id == ERR_INVALID_STATE (Assessment is FINALIZED, not ISSUED)"
            - "Response error_id != ERR_APPEAL_WINDOW_CLOSED (state check fires first per priority)"

      - name: business_safety_vs_business_constraint_pair
        grounds:
          - validations[priority=11]
          - validations[priority=9]
          - state_machines.Appeal.FILED_to_SCHEDULED
        distinguishing_aspect: |
          Pair: business_safety (priority 11, ERR_BOE_OFFICER_CONFLICT —
          segregation of duties) vs business_constraint (priority 9,
          ERR_ROOM_DOUBLE_BOOKED). When a Treasurer schedules a Hearing
          assigning an Officer who is also the Assessor of the
          Assessment AND the room is already booked, both checks could
          fail. Priority pins room check (9) first.
        test_recipe:
          setup:
            - "User U1 acting as Assessor issues Assessment A1 on Property P1; Owner files Appeal Ap1"
            - "Another Hearing H_x already SCHEDULED for ROOM_A from 10:00–11:00 on day D for unrelated appeal"
            - "Register HearingOfficer HO1; assign X-User-ID=HO1.id when conducting/deciding — but for scheduling test, attempt to use officer_id == U1 (which is also the assessor) AND request hearing_room=ROOM_A, scheduled_start=10:30, scheduled_end=10:45"
          trigger:
            - "POST /properties/P1/appeals/Ap1/schedule (hearing_room=ROOM_A, officer_id=U1, scheduled_start=10:30, scheduled_end=10:45)"
          assert:
            - "Response error_id == ERR_ROOM_DOUBLE_BOOKED (priority 9 fires before priority 11)"
            - "Response error_id != ERR_BOE_OFFICER_CONFLICT"

      - name: business_referential_vs_business_fiscal_pair
        grounds:
          - validations[priority=6]
          - validations[priority=14]
          - state_machines.TaxBill.ISSUED_to_PARTIALLY_PAID
        distinguishing_aspect: |
          Pair: business_referential (priority 6,
          ERR_ASSESSMENT_NOT_FINALIZED) vs business_fiscal (priority 14,
          ERR_OVERPAYMENT). On a TaxBill created against an Assessment
          not yet FINALIZED, attempting to overpay would trip both. The
          referential cross-entity check fires first. (Note: in
          principle the bill can only exist if Assessment FINALIZED, but
          tests can fabricate state to surface this order — and even
          when the referential check applies to /issue, the
          implementation must order checks consistently for /payments.)
        test_recipe:
          setup:
            - "Property P, Assessment A in UNDER_APPEAL (not FINALIZED)"
            - "Attempt to POST /properties/P/tax_bills (roll_year=A.roll_year) — server should reject with ERR_ASSESSMENT_NOT_FINALIZED on the issue path"
          trigger:
            - "POST /properties/P/tax_bills/{nonexistent_or_pending_bill_id}/issue with version=1"
          assert:
            - "Response error_id == ERR_ASSESSMENT_NOT_FINALIZED (priority 6 fires; fiscal validation not even reached)"

  # ---------------------------------------------------------------------------
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: appeal_window_strict_inequality
        grounds:
          - calculations.appeal_window_check
          - validations[priority=7]
          - state_machines.Assessment.ISSUED_to_FINALIZED
        distinguishing_aspect: |
          Numeric/time threshold: appeal accepted iff now <
          appeal_window_closes_at (STRICT <). At exact equality the
          appeal is rejected and the auto-finalize fires. This boundary
          is reached via POST /properties/{id}/appeals on a freshly
          time-advanced clock.
        test_recipe:
          setup:
            - "Property P, Assessment A issued at t0 = 2026-01-01T00:00:00Z; appeal_window_closes_at = 2026-01-31T00:00:00Z (30 days)"
            - "POST /_clock/advance to target_timestamp = 2026-01-31T00:00:00Z (exact boundary)"
          trigger:
            - "POST /properties/P/appeals (assessment_id=A) as Owner"
          assert:
            - "Response error_id == ERR_APPEAL_WINDOW_CLOSED (now >= boundary triggers rejection AND auto-finalize)"
            - "Separately, advancing to 2026-01-30T23:59:59.999Z and filing appeal returns 201 (now < boundary)"

      - name: payment_amount_exact_equality_for_paid
        grounds:
          - validations[priority=14]
          - state_machines.TaxBill.ISSUED_to_PAID
          - state_machines.TaxBill.ISSUED_to_PARTIALLY_PAID
        distinguishing_aspect: |
          Different metric (monetary amount, not time) and different
          endpoint (POST /payments, not /appeals). Payment amount == 0
          rejected (ERR_OVERPAYMENT covers both overpay and non-positive
          per priority 14), amount < amount_due → PARTIALLY_PAID, amount
          == amount_due → PAID, amount > amount_due → ERR_OVERPAYMENT.
          The transitions to PAID vs PARTIALLY_PAID hinge on exact
          equality.
        test_recipe:
          setup:
            - "TaxBill B issued with base_tax_amount=1000.00, no payments"
          trigger:
            - "POST /properties/P/tax_bills/B/payments (amount=999.99) — branch A"
            - "POST /properties/P/tax_bills/B/payments (amount=0.01) — branch A continued, exact fill"
            - "Branch B (fresh bill): POST payments (amount=1000.00) directly"
            - "Branch C (fresh bill): POST payments (amount=1000.01)"
          assert:
            - "Branch A: after 999.99 → TaxBill.status == PARTIALLY_PAID, amount_due == 0.01; after 0.01 → status == PAID, amount_due == 0.00"
            - "Branch B: status == PAID, amount_due == 0.00 in one shot"
            - "Branch C: HTTP 409, error_id == ERR_OVERPAYMENT"

      - name: deferral_zero_days_zero_interest_boundary
        grounds:
          - calculations.deferral_interest_accrual
          - entities.DeferralPlan.fields.accrued_interest
        distinguishing_aspect: |
          Different metric (days elapsed empty-set boundary) and
          different endpoint (GET /deferral_plans/{id}). When
          days_elapsed == 0, accrued_interest == 0.00 (not 0.01 from a
          floating point bug, not 0.014 from a continuous formula).
        test_recipe:
          setup:
            - "TaxBill B issued; eligible Owner; DeferralPlan D activated at t0"
          trigger:
            - "GET /properties/P/tax_bills/B/deferral_plans/D (immediately, no clock advance)"
          assert:
            - "DeferralPlan.accrued_interest == 0.00 (exact)"
            - "After POST /_clock/advance(+1 day), accrued_interest == round_half_up(principal_deferred * ((1+0.05/365)^1 - 1), 2)"

  # ---------------------------------------------------------------------------
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: taxbill_issue_requires_assessment_finalized
        grounds:
          - validations[priority=6]
          - state_machines.TaxBill.PENDING_to_ISSUED
          - state_machines.Assessment.UNDER_APPEAL_to_FINALIZED
        distinguishing_aspect: |
          Entity pair: TaxBill ↔ Assessment. TaxBill cannot transition
          PENDING→ISSUED unless the linked Assessment.status ==
          FINALIZED. This crosses two different entity types.
        test_recipe:
          setup:
            - "Property P, Assessment A in UNDER_APPEAL (an Appeal is open)"
            - "Cannot even POST /properties/P/tax_bills if scaffold rejects creation pre-FINALIZED; otherwise create TaxBill in PENDING"
          trigger:
            - "POST /properties/P/tax_bills/B/issue"
          assert:
            - "Response error_id == ERR_ASSESSMENT_NOT_FINALIZED"
            - "After all Appeals decided, Assessment auto-FINALIZES, and re-attempting issue succeeds (status → ISSUED)"

      - name: appeal_filing_requires_assessment_issued
        grounds:
          - state_machines.Assessment.ISSUED_to_UNDER_APPEAL
          - state_machines.Appeal.FILED_to_SCHEDULED
          - validations[priority=5]
          - calculations.appeal_window_check
        distinguishing_aspect: |
          Entity pair: Appeal ↔ Assessment (different from instance 1
          which is TaxBill ↔ Assessment). An Appeal can only be filed
          against an Assessment whose status is ISSUED or UNDER_APPEAL
          (NOT DRAFT, NOT FINALIZED). And /schedule on the Appeal
          requires Hearing to be created with officer != Assessor — but
          the basic cross-entity check is Appeal-on-Assessment status.
        test_recipe:
          setup:
            - "Property P, Assessment A in DRAFT (not yet issued)"
          trigger:
            - "POST /properties/P/appeals (assessment_id=A) as Owner"
          assert:
            - "Response error_id == ERR_INVALID_STATE (Assessment not in ISSUED/UNDER_APPEAL)"
            - "After POST /properties/P/assessments/A/issue, re-attempt succeeds"

      - name: deferral_activation_requires_taxbill_issued_or_partial
        grounds:
          - state_machines.DeferralPlan.REQUESTED_to_ACTIVE
          - state_machines.TaxBill.ISSUED_to_IN_DEFERRAL
          - state_machines.TaxBill.PARTIALLY_PAID_to_IN_DEFERRAL
          - validations[priority=5]
        distinguishing_aspect: |
          Entity pair: DeferralPlan ↔ TaxBill (third distinct pair).
          DeferralPlan REQUESTED→ACTIVE requires TaxBill in {ISSUED,
          PARTIALLY_PAID} — not PENDING, not PAID, not DELINQUENT.
        test_recipe:
          setup:
            - "TaxBill B in PENDING state (just created, not yet issued)"
            - "Eligible Owner; DeferralPlan D requested for B"
          trigger:
            - "POST /properties/P/tax_bills/B/deferral_plans/D/activate"
          assert:
            - "Response error_id == ERR_INVALID_STATE (TaxBill must be ISSUED or PARTIALLY_PAID)"

  # ---------------------------------------------------------------------------
  # Rule 8 — Resource temporal-overlap conflicts across different interval
  #          semantics
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: hearing_room_half_open_overlap
        grounds:
          - validations[priority=9]
          - entities.Hearing.fields.hearing_room
          - entities.Hearing.fields.scheduled_start
          - entities.Hearing.fields.scheduled_end
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [start, end). Two hearings in
          the same hearing_room collide iff intervals overlap as
          half-open sets — i.e., if H1.end == H2.start, they are
          permitted (touching but not overlapping). This is the
          geometric semantics for instance 1: pure interval overlap,
          no buffer.
        test_recipe:
          setup:
            - "Hearing H1 SCHEDULED in ROOM_A from 10:00:00 to 11:00:00 (inclusive start, exclusive end)"
            - "Two new candidate appeals (Ap2 for ROOM_A 10:30–11:30 — should reject; Ap3 for ROOM_A 11:00–12:00 — should succeed since touching is allowed)"
          trigger:
            - "POST /properties/P2/appeals/Ap2/schedule (ROOM_A, 10:30, 11:30, officer != Assessor)"
            - "POST /properties/P3/appeals/Ap3/schedule (ROOM_A, 11:00, 12:00, officer != Assessor)"
          assert:
            - "Ap2 → 409 ERR_ROOM_DOUBLE_BOOKED (intervals overlap on (10:30, 11:00))"
            - "Ap3 → 200 OK (touching boundary at 11:00 is permitted under half-open semantics)"

      - name: officer_buffer_separation_overlap
        grounds:
          - validations[priority=10]
          - entities.Hearing.fields.officer_id
          - entities.Hearing.fields.scheduled_start
          - entities.Hearing.fields.scheduled_end
        distinguishing_aspect: |
          Interval semantics: BUFFER-EXTENDED (officer must have
          OFFICER_BUFFER_MIN minutes between hearings). DIFFERENT
          geometric treatment from instance 1: instance 1's room rule
          permits touching; instance 2's officer rule REJECTS even
          non-overlapping intervals that are within
          OFFICER_BUFFER_MIN of each other. Different resource entity
          (officer_id vs hearing_room), different interval arithmetic.
        test_recipe:
          setup:
            - "HearingOfficer HO1 active. Hearing H1 SCHEDULED with officer_id=HO1 from 10:00 to 11:00 in ROOM_A"
            - "New appeal Ap2 attempting officer_id=HO1, ROOM_B (different room!), 11:05 to 12:00 — touching+5min gap, no room conflict, but assume OFFICER_BUFFER_MIN=15 → must reject"
            - "New appeal Ap3 attempting officer_id=HO1, ROOM_B, 11:30 to 12:30 — 30min gap, accept"
          trigger:
            - "POST /properties/P2/appeals/Ap2/schedule"
            - "POST /properties/P3/appeals/Ap3/schedule"
          assert:
            - "Ap2 → 409 ERR_OFFICER_BUFFER_VIOLATED (gap = 5min < 15min buffer, even though rooms differ and intervals don't overlap)"
            - "Ap3 → 200 OK (30min gap satisfies buffer)"

  # ---------------------------------------------------------------------------
  # Rule 9 — Compensating-action invariants across different conserved
  #          quantities
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: payment_then_appeal_refund_cash_invariant
        grounds:
          - state_machines.Appeal.HEARD_to_DECIDED
          - calculations.appeal_bill_reconciliation
          - entities.Payment.fields.amount
          - entities.Payment.fields.status
          - entities.TaxBill.fields.amount_due
        distinguishing_aspect: |
          Conserved quantity: OWNER CASH POSITION =
            sum(Payment.amount where status=APPLIED for bill) +
            TaxBill.amount_due
          (i.e., total money the owner has paid minus what they still
          owe must equal what their final tax obligation actually is —
          a "no cash drift" invariant). Forward action: pay 5500 on a
          bill where final tax is 4000. Compensating action: Appeal
          DECIDED REDUCED reconciliation → refund 1500 → APPLIED sum
          drops to 4000, amount_due drops to 0. Invariant: APPLIED + due
          == final base_tax.
        test_recipe:
          setup:
            - "Property P, Assessment A FINALIZED capped_value=500000"
            - "TaxBill B issued, base_tax=6250.00, no exemptions"
            - "Owner pays 5500.00 (Payment APPLIED), amount_due=750.00"
          trigger:
            - "File Appeal A1, schedule, conduct, POST .../decide (REDUCED, decided_value=320000)"
          assert:
            - "final base_tax = 320000 * 12.5 / 1000 = 4000.00"
            - "Sum of Payment.amount where status==APPLIED for B == 4000.00"
            - "TaxBill.amount_due == 0.00"
            - "Invariant: APPLIED_sum + amount_due == final base_tax → 4000.00 + 0.00 == 4000.00 (no cash drift)"
            - "Sum of Payment.amount where status==REFUNDED == 1500.00 (= 5500 - 4000, exact compensation)"

      - name: exemption_approve_revoke_taxable_invariant
        grounds:
          - state_machines.ExemptionApplication.SUBMITTED_to_APPROVED
          - state_machines.ExemptionApplication.APPROVED_to_REVOKED
          - calculations.exemption_stack
          - calculations.tax_bill_computation
          - entities.TaxBill.fields.taxable_value
          - entities.TaxBill.fields.total_exemption_amount
        distinguishing_aspect: |
          Conserved quantity (DIFFERENT from instance 1's cash position):
          PROPERTY TAXABLE BASE =
            TaxBill.taxable_value + TaxBill.total_exemption_amount
          must equal Assessment.capped_value (rounded to 2dp), regardless
          of how many APPROVED then REVOKED exemption cycles occur. The
          forward action is /approve, the compensating action is
          /revoke; after a full approve→revoke cycle on the same
          ExemptionApplication, the named quantity (taxable_value +
          total_exemption_amount) is unchanged from the pre-approval
          state.
        test_recipe:
          setup:
            - "Owner O age 70, Property P with capped_value=400000 (Assessment FINALIZED)"
            - "TaxBill B PENDING, mill_rate=12.5"
          trigger:
            - "Step1 — measure baseline: GET B → taxable_value=400000.00, total_exemption_amount=0.00"
            - "Step2 — POST exemption_applications SENIOR for roll_year, then /approve"
            - "Step3 — measure: GET B → taxable_value=375000.00, total_exemption_amount=25000.00"
            - "Step4 — POST /exemption_applications/{id}/revoke (revoked_reason=WITHDRAWN)"
            - "Step5 — measure: GET B"
          assert:
            - "Step1 invariant: 400000.00 + 0.00 == 400000.00 == Assessment.capped_value"
            - "Step3 invariant: 375000.00 + 25000.00 == 400000.00 == Assessment.capped_value"
            - "Step5 invariant: taxable_value + total_exemption_amount == 400000.00 (restored to pre-approval)"
            - "Net change in conserved quantity across approve→revoke cycle == 0.00 (no drift)"
