# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3329_smart_apartment_access_hardware_deployment_vacant_unit
#
# Breadth probe: every testable claim the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners §1.8
# already covers appear as `excluded_because:` stubs with no test_recipe.
# Sections/claim_types follow references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: property_create_returns_declared_fields_and_zero_budget
        claim_type: Creation
        grounds:
          - entities.Property
          - endpoints.POST_/properties
        distinguishing_aspect: "A property created with only name/address_line/unit_capacity/temp_budget_cents_per_day comes back 201 with budget_committed_cents == 0 and a system-minted id/created_at/updated_at; budget is never client-supplied."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /properties"
              payload: { name: "Southgate", address_line: "5 South Way", unit_capacity: 8, temp_budget_cents_per_day: 400 }
              as: PlatformAdmin
              captures: { prop_s: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Property.${prop_s}.name == \"Southgate\" and unit_capacity == 8"
            - "Property.${prop_s}.budget_committed_cents == 0"
            - "the response carries non-null id, created_at and updated_at"

      - name: building_create_derives_connectivity_ok_from_rssi_and_design
        claim_type: Computed Fields
        grounds:
          - entities.Building.fields.connectivity_ok
          - calculations.building_connectivity_ok
          - endpoints.POST_/properties/{propertyId}/buildings
        distinguishing_aspect: "connectivity_ok is computed, not supplied: a HUB_RELAY building at -80 dBm is connected while a POINT_TO_POINT building at the same -80 dBm is not, because the threshold is chosen by network_design."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Property P exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Design Dome", address_line: "8 Antenna Rd", unit_capacity: 4, temp_budget_cents_per_day: 400 }
              as: PlatformAdmin
              captures: { prop_d: $.data.id }
          trigger:
            - call: "POST /properties/${prop_d}/buildings"
              payload: { name: "Relay Wing", network_design: "HUB_RELAY", wifi_rssi_dbm: -80 }
              as: PlatformAdmin
              captures: { bld_relay: $.data.id }
            - call: "POST /properties/${prop_d}/buildings"
              payload: { name: "P2P Wing", network_design: "POINT_TO_POINT", wifi_rssi_dbm: -80 }
              as: PlatformAdmin
              captures: { bld_p2p: $.data.id }
          assert:
            - "Building.${bld_relay}.connectivity_ok == true (HUB_RELAY threshold -80, inclusive)"
            - "Building.${bld_p2p}.connectivity_ok == false (POINT_TO_POINT threshold -67)"

      - name: device_create_applies_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.Device.fields.status
          - entities.Device.fields.lock_state
          - entities.Device.fields.battery_pct
          - endpoints.POST_/devices
        distinguishing_aspect: "Omitting the optional battery_pct on a new device yields battery_pct == 100 (not null), with status PROVISIONED, lock_state LOCKED and battery_replacements == 0."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Property P, building B, unit U created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Default Downs", address_line: "1 Blank Blvd", unit_capacity: 1, temp_budget_cents_per_day: 400 }
              as: PlatformAdmin
              captures: { prop_dd: $.data.id }
            - call: "POST /properties/${prop_dd}/buildings"
              payload: { name: "DD-B1", network_design: "FIELD_MESH", wifi_rssi_dbm: -60 }
              as: PlatformAdmin
              captures: { bld_dd: $.data.id }
            - call: "POST /properties/${prop_dd}/units"
              payload: { unit_number: "U-DD1", building_id: "${bld_dd}" }
              as: PropertyManager
              captures: { unit_dd: $.data.id }
          trigger:
            - call: "POST /devices"
              payload: { device_type: "SMART_LOCK", unit_id: "${unit_dd}", building_id: "${bld_dd}", firmware_version: "LATEST" }
              as: HardwareTechnician
              captures: { dev_dd: $.data.id }
          assert:
            - "Device.${dev_dd}.battery_pct == 100 (default applied when omitted)"
            - "Device.${dev_dd}.status == PROVISIONED and lock_state == LOCKED"
            - "Device.${dev_dd}.battery_replacements == 0"

      - name: units_list_paginates_and_reports_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/units
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three units in one property, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and limit=2&offset=2 returns the remaining row with has_more false — total_count counts the whole filtered set."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Property P with three units U-1, U-2, U-3."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Page Place", address_line: "2 Turn Rd", unit_capacity: 3, temp_budget_cents_per_day: 400 }
              as: PlatformAdmin
              captures: { prop_pg: $.data.id }
            - call: "POST /properties/${prop_pg}/units"
              payload: { unit_number: "U-1" }
              as: PropertyManager
            - call: "POST /properties/${prop_pg}/units"
              payload: { unit_number: "U-2" }
              as: PropertyManager
            - call: "POST /properties/${prop_pg}/units"
              payload: { unit_number: "U-3" }
              as: PropertyManager
          trigger:
            - call: "GET /units"
              payload: { property_id: "${prop_pg}" }
              as: PropertyManager
          assert:
            - "GET /units?property_id=${prop_pg}&limit=2&offset=0 returns 2 rows with total_count == 3 and has_more == true"
            - "GET /units?property_id=${prop_pg}&limit=2&offset=2 returns 1 row with total_count == 3 and has_more == false"
            - "the default page size is 10 and offset 0 when neither limit nor offset is supplied"

      - name: non_existent_property_returns_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_PROPERTY_NOT_FOUND]
          - endpoints.GET_/properties/{propertyId}
        distinguishing_aspect: "GET on a well-formed but unknown property id returns ERR_PROPERTY_NOT_FOUND (404) with the error envelope, not an empty object."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /properties/11111111-2222-4333-8444-555555555555"
              payload: {}
              as: PlatformAdmin
              captures: { e_nf: $.data.error_id }
          assert:
            - "the response status is 404 and response_type is error"
            - "error_id == ERR_PROPERTY_NOT_FOUND"
            - "data.message is a non-empty string"

      - name: resident_create_missing_email_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - endpoints.POST_/residents
        distinguishing_aspect: "POST /residents without the required email field is rejected 400 ERR_INVALID_REQUEST before any unit-occupancy side effect fires."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Property P and unit U exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Missing Manor", address_line: "9 Void St", unit_capacity: 1, temp_budget_cents_per_day: 400 }
              as: PlatformAdmin
              captures: { prop_mm: $.data.id }
            - call: "POST /properties/${prop_mm}/units"
              payload: { unit_number: "U-MM1" }
              as: PropertyManager
              captures: { unit_mm: $.data.id }
          trigger:
            - call: "POST /residents"
              payload: { property_id: "${prop_mm}", unit_id: "${unit_mm}", full_name: "No Email" }
              as: PropertyManager
              captures: { e_mm: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "Unit.${unit_mm}.occupancy_status remains VACANT (no partial side effect)"

      - name: device_list_filters_by_building
        claim_type: Parent Relationships
        grounds:
          - endpoints.GET_/devices
          - entities.Device.fields.building_id
        distinguishing_aspect: "GET /devices?building_id=B returns only the devices whose building_id equals B, excluding devices in a sibling building of the same property."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Property P with buildings B1 and B2, one lock in each."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Filter Fields", address_line: "3 Sort St", unit_capacity: 2, temp_budget_cents_per_day: 400 }
              as: PlatformAdmin
              captures: { prop_ff: $.data.id }
            - call: "POST /properties/${prop_ff}/buildings"
              payload: { name: "B1", network_design: "FIELD_MESH", wifi_rssi_dbm: -60 }
              as: PlatformAdmin
              captures: { bld_f1: $.data.id }
            - call: "POST /properties/${prop_ff}/buildings"
              payload: { name: "B2", network_design: "FIELD_MESH", wifi_rssi_dbm: -60 }
              as: PlatformAdmin
              captures: { bld_f2: $.data.id }
            - call: "POST /devices"
              payload: { device_type: "SMART_LOCK", building_id: "${bld_f1}", firmware_version: "LATEST" }
              as: HardwareTechnician
              captures: { dev_f1: $.data.id }
            - call: "POST /devices"
              payload: { device_type: "SMART_LOCK", building_id: "${bld_f2}", firmware_version: "LATEST" }
              as: HardwareTechnician
          trigger:
            - call: "GET /devices"
              payload: { building_id: "${bld_f1}" }
              as: HardwareTechnician
          assert:
            - "the filtered list returns exactly 1 device and its id == ${dev_f1}"
            - "no device with building_id == ${bld_f2} appears in the result"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: work_order_assign_from_closed_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.WorkOrder.transitions.OPEN_to_ASSIGNED
          - state_machines.WorkOrder.initial_state
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A CLOSED WorkOrder has no declared outgoing trigger; a further assign must fail ERR_INVALID_STATE (409) and leave the parent alert at RESOLVED."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Building B, unit U, LEAK_SENSOR S driven UNREACHABLE with one OPEN OFFLINE alert A."
            - "A WorkOrder W has been opened against A and closed via assign."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Terminal Tracts", address_line: "1 End Ave", unit_capacity: 1, temp_budget_cents_per_day: 400 }
              as: PlatformAdmin
              captures: { prop_tt: $.data.id }
            - call: "POST /properties/${prop_tt}/buildings"
              payload: { name: "TT-B1", network_design: "FIELD_MESH", wifi_rssi_dbm: -60 }
              as: PlatformAdmin
              captures: { bld_tt: $.data.id }
            - call: "POST /properties/${prop_tt}/units"
              payload: { unit_number: "U-TT1", building_id: "${bld_tt}" }
              as: PropertyManager
              captures: { unit_tt: $.data.id }
            - call: "POST /devices"
              payload: { device_type: "LEAK_SENSOR", unit_id: "${unit_tt}", building_id: "${bld_tt}", firmware_version: "OLD", battery_pct: 50 }
              as: HardwareTechnician
              captures: { dev_tt: $.data.id }
            - call: "POST /buildings/${bld_tt}/device-scans"
              payload: { reachable_device_ids: [] }
              as: HardwareTechnician
            - call: "GET /device-alerts"
              payload: { device_id: "${dev_tt}" }
              as: PropertyManager
              captures: { al_tt: "$.data[0].id", al_tt_v: "$.data[0].version" }
            - call: "POST /device-alerts/${al_tt}/work-orders"
              payload: { assigned_technician_id: "tech-ivy", expected_device_alert_version: "${al_tt_v}" }
              as: HardwareTechnician
              captures: { wo_tt: $.data.id }
            - call: "POST /work-orders/${wo_tt}/assign"
              payload: { technician_id: "tech-ivy", replaced_battery: true, confirm_repair: true }
              as: HardwareTechnician
              captures: { wo_tt2: $.data.id }
            - call: "POST /work-orders/${wo_tt2}/assign"
              payload: { technician_id: "tech-ivy", confirm_repair: true }
              as: HardwareTechnician
          trigger:
            - call: "POST /work-orders/${wo_tt2}/assign"
              payload: { technician_id: "tech-ivy", confirm_repair: true }
              as: HardwareTechnician
              captures: { e_wo: $.data.error_id }
          assert:
            - "the trigger response status is 409 and error_id == ERR_INVALID_STATE"
            - "WorkOrder.${wo_tt2}.status remains CLOSED"
            - "the device's DeviceAlert remains RESOLVED (no re-open)"

      - name: terminal_work_order_has_no_outgoing_transitions
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.WorkOrder.terminal_states
          - state_machines.MaintenanceVisit.terminal_states
          - errors[ERR_ALREADY_TERMINAL]
        distinguishing_aspect: "From the CLOSED terminal state of a WorkOrder no trigger in the transition list applies, and a terminal-state action is rejected with ERR_ALREADY_TERMINAL rather than a generic state error."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. A VACANT unit U with a MaintenanceVisit V already COMPLETED (actual_hours=2.0)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Dead End", address_line: "2 Halt Ct", unit_capacity: 1, temp_budget_cents_per_day: 400 }
              as: PlatformAdmin
              captures: { prop_de: $.data.id }
            - call: "POST /properties/${prop_de}/units"
              payload: { unit_number: "U-DE1" }
              as: PropertyManager
              captures: { unit_de: $.data.id }
            - call: "POST /units/${unit_de}/maintenance-visits"
              payload: { technician_id: "tech-zoe", start_at: "2026-09-03T10:00:00Z", end_at: "2026-09-03T12:00:00Z", is_emergency: false }
              as: PropertyManager
              captures: { visit_de: $.data.id }
            - call: "POST /maintenance-visits/${visit_de}/certify_notice"
              payload: { notice_mailed_at: "2026-09-01T09:00:00Z" }
              as: PropertyManager
            - call: "POST /maintenance-visits/${visit_de}/complete"
              payload: { actual_hours: 2.0 }
              as: MaintenanceTechnician
          trigger:
            - call: "POST /maintenance-visits/${visit_de}/complete"
              payload: { actual_hours: 3.0 }
              as: MaintenanceTechnician
              captures: { e_de: $.data.error_id }
          assert:
            - "the trigger status is 409 and error_id == ERR_ALREADY_TERMINAL"
            - "MaintenanceVisit.${visit_de}.status remains COMPLETED with accrued_cost_cents == 3400"

      - name: guest_pass_extend_from_active_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.GuestPass.transitions.ACTIVE_to_EXPIRED
          - state_machines.GuestPass.transitions.EXPIRED_to_ACTIVE
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Extend is declared only from EXPIRED; calling it on an ACTIVE guest pass is rejected ERR_INVALID_STATE and leaves end_at unchanged."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Unit U with an ACTIVE GuestPass G [2026-09-05T09:00:00Z, 2026-09-06T09:00:00Z) hosted by ACTIVE resident R."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Active Abbey", address_line: "4 Live Ln", unit_capacity: 1, temp_budget_cents_per_day: 400 }
              as: PlatformAdmin
              captures: { prop_aa: $.data.id }
            - call: "POST /properties/${prop_aa}/buildings"
              payload: { name: "AA-B1", network_design: "FIELD_MESH", wifi_rssi_dbm: -60 }
              as: PlatformAdmin
              captures: { bld_aa: $.data.id }
            - call: "POST /properties/${prop_aa}/units"
              payload: { unit_number: "U-AA1", building_id: "${bld_aa}" }
              as: PropertyManager
              captures: { unit_aa: $.data.id }
            - call: "POST /devices"
              payload: { device_type: "SMART_LOCK", unit_id: "${unit_aa}", building_id: "${bld_aa}", firmware_version: "LATEST", battery_pct: 100 }
              as: HardwareTechnician
              captures: { dev_aa: $.data.id }
            - call: "POST /buildings/${bld_aa}/device-scans"
              payload: { reachable_device_ids: ["${dev_aa}"] }
              as: HardwareTechnician
            - call: "POST /residents"
              payload: { property_id: "${prop_aa}", unit_id: "${unit_aa}", full_name: "Ada Abbey", email: "ada@x.com" }
              as: PropertyManager
              captures: { res_aa: $.data.id }
            - call: "POST /residents/${res_aa}/onboard"
              payload: {}
              as: PropertyManager
            - call: "POST /units/${unit_aa}/guest-passes"
              payload: { host_resident_id: "${res_aa}", guest_label: "Active Guest", start_at: "2026-09-05T09:00:00Z", end_at: "2026-09-06T09:00:00Z" }
              as: PropertyManager
              captures: { pass_aa: $.data.id }
          trigger:
            - call: "POST /guest-passes/${pass_aa}/extend"
              payload: { new_end_at: "2026-09-08T09:00:00Z" }
              as: PropertyManager
              captures: { e_aa: $.data.error_id }
          assert:
            - "the trigger status is 409 and error_id == ERR_INVALID_STATE"
            - "GuestPass.${pass_aa}.status remains ACTIVE and end_at remains 2026-09-06T09:00:00Z"

      - name: resident_onboard_issues_credential_and_event
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Resident.transitions.PENDING_CREDENTIAL_to_ACTIVE
          - entities.AccessCredential.fields.status
          - entities.Resident.fields.portal_credential_status
        distinguishing_aspect: "Onboarding a resident fires three declared side effects at once: an ACTIVE RESIDENT credential is created, portal_credential_status flips to ACTIVE, and a PENDING_CREDENTIAL->ACTIVE event is appended."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Building B (rssi=-60, connectivity_ok), unit U with an ONLINE SMART_LOCK, resident R PENDING_CREDENTIAL on U."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Effect Estates", address_line: "6 Fx Rd", unit_capacity: 1, temp_budget_cents_per_day: 400 }
              as: PlatformAdmin
              captures: { prop_fx: $.data.id }
            - call: "POST /properties/${prop_fx}/buildings"
              payload: { name: "FX-B1", network_design: "FIELD_MESH", wifi_rssi_dbm: -60 }
              as: PlatformAdmin
              captures: { bld_fx: $.data.id }
            - call: "POST /properties/${prop_fx}/units"
              payload: { unit_number: "U-FX1", building_id: "${bld_fx}" }
              as: PropertyManager
              captures: { unit_fx: $.data.id }
            - call: "POST /devices"
              payload: { device_type: "SMART_LOCK", unit_id: "${unit_fx}", building_id: "${bld_fx}", firmware_version: "LATEST", battery_pct: 100 }
              as: HardwareTechnician
              captures: { dev_fx: $.data.id }
            - call: "POST /buildings/${bld_fx}/device-scans"
              payload: { reachable_device_ids: ["${dev_fx}"] }
              as: HardwareTechnician
            - call: "POST /residents"
              payload: { property_id: "${prop_fx}", unit_id: "${unit_fx}", full_name: "Faye Effect", email: "faye@x.com" }
              as: PropertyManager
              captures: { res_fx: $.data.id }
          trigger:
            - call: "POST /residents/${res_fx}/onboard"
              payload: {}
              as: PropertyManager
          assert:
            - "Resident.${res_fx}.status == ACTIVE and portal_credential_status == ACTIVE"
            - "GET /access-credentials?subject_resident_id=${res_fx} returns exactly 1 credential with status ACTIVE and credential_type RESIDENT"
            - "GET /resident-status-events?resident_id=${res_fx} lists a PENDING_CREDENTIAL -> ACTIVE event"

      - name: maintenance_complete_requires_notice_certified
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.MaintenanceVisit.transitions.NOTICE_CERTIFIED_to_COMPLETED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Completing a visit that is still REQUESTED violates the from-state precondition and is rejected ERR_INVALID_STATE, leaving accrued_cost_cents at 0."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Unit U with a REQUESTED (not yet certified) MaintenanceVisit V."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Premature Place", address_line: "7 Soon St", unit_capacity: 1, temp_budget_cents_per_day: 400 }
              as: PlatformAdmin
              captures: { prop_pm: $.data.id }
            - call: "POST /properties/${prop_pm}/units"
              payload: { unit_number: "U-PM1" }
              as: PropertyManager
              captures: { unit_pm: $.data.id }
            - call: "POST /units/${unit_pm}/maintenance-visits"
              payload: { technician_id: "tech-abe", start_at: "2026-09-03T10:00:00Z", end_at: "2026-09-03T11:00:00Z", is_emergency: false }
              as: PropertyManager
              captures: { visit_pm: $.data.id }
          trigger:
            - call: "POST /maintenance-visits/${visit_pm}/complete"
              payload: { actual_hours: 1.0 }
              as: MaintenanceTechnician
              captures: { e_pm: $.data.error_id }
          assert:
            - "the trigger status is 409 and error_id == ERR_INVALID_STATE"
            - "MaintenanceVisit.${visit_pm}.status remains REQUESTED and accrued_cost_cents == 0"

  # ===========================================================================
  - section: calculations
    instances:

      - name: setpoint_hot_threshold_boundary_at_30_c
        claim_type: Correct Result
        grounds:
          - calculations.vacant_unit_setpoint_c
          - entities.Unit.fields.target_setpoint_c
          - endpoints.POST_/units/{unitId}/vacant-automation
        distinguishing_aspect: "The HOT_FORECAST_THRESHOLD_C boundary is inclusive: forecast 30 with humidity 45 yields the hot setpoint 27.0, while forecast 29 with humidity 45 yields the default 26.0."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Property P with unit U (VACANT)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Boundary Bungalow", address_line: "30 Hot Rd", unit_capacity: 2, temp_budget_cents_per_day: 400 }
              as: PlatformAdmin
              captures: { prop_bu: $.data.id }
            - call: "POST /properties/${prop_bu}/units"
              payload: { unit_number: "U-BU1" }
              as: PropertyManager
              captures: { unit_bu: $.data.id }
          trigger:
            - call: "POST /units/${unit_bu}/vacant-automation"
              payload: { window_forecast_c: 30, relative_humidity_pct: 45 }
              as: PropertyManager
          assert:
            - "Unit.${unit_bu}.target_setpoint_c == 27.0 at forecast 30 (inclusive threshold)"
            - "re-running with window_forecast_c: 29, relative_humidity_pct: 45 yields target_setpoint_c == 26.0"

      - name: setpoint_humidity_boundary_at_60_pct
        claim_type: Correct Result
        grounds:
          - calculations.vacant_unit_setpoint_c.variants.humid_stress
          - constants.HUMIDITY_STRESS_THRESHOLD_PCT
          - endpoints.POST_/units/{unitId}/vacant-automation
        distinguishing_aspect: "The humidity branch needs BOTH forecast >= 27 and humidity >= 60: forecast 30 with humidity 60 takes the humid override (24.0), while forecast 30 with humidity 59 stays base (27.0)."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Property P with unit U (VACANT)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /properties"
              payload: { name: "Humid Hedge", address_line: "60 Wet Way", unit_capacity: 2, temp_budget_cents_per_day: 400 }
              as: PlatformAdmin
