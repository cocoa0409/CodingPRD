            - call: "POST /service-tickets"
              payload: { site_id: "${sa}", vessel_id: "${vla}", job_type: "INSPECTION", requires_entry: false, est_hours: 2, crew_size: 1 }
              as: ServiceManager
              captures: { ta: $.data.id }
            - call: "POST /service-tickets/${ta}/quote"
              payload: {}
              as: ServiceManager
            - call: "POST /service-tickets/${ta}/approve"
              payload: {}
              as: PlantOperator
              as_user_id: "${sa}"
            - call: "POST /service-tickets/${ta}/schedule"
              payload: { technician_id: "${tt6}", window_start: "2026-08-10T09:00:00Z", window_end: "2026-08-10T12:00:00Z" }
              as: ServiceManager
            - call: "POST /service-tickets"
              payload: { site_id: "${sb}", vessel_id: "${vlb}", job_type: "INSPECTION", requires_entry: false, est_hours: 2, crew_size: 1 }
              as: ServiceManager
              captures: { tb: $.data.id }
            - call: "POST /service-tickets/${tb}/quote"
              payload: {}
              as: ServiceManager
            - call: "POST /service-tickets/${tb}/approve"
              payload: {}
              as: PlantOperator
