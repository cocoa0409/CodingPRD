          assert:
            - "the self-award while the solicitation is OPEN fails 409 ERR_SOLICITATION_NOT_CLOSED — priority 23 outranks the segregation check at 41 even though both are violated"
            - "after close, the same self-award by dual-01 fails 409 ERR_SEGREGATION_OF_DUTIES because X-User-ID equals the bid's submitted_by_user_id dual-01"
            - "the award by contracts-02 returns 201 with a ContractOrder in status ACTIVE — the two refusals left the bid SUBMITTED and awardable"
            - "re-submitting the now AWARDED bid fails 409 ERR_BID_STATE_INVALID: submit requires DRAFT"
            - "dual-01 was never denied on role grounds: it is a declared SalesEngineer on submit and a declared ContractsAdmin on award, so the refusal is identity-based, not role-based"

      - name: dealer_agent_touching_another_dealers_remedy_task_is_rejected
        claim_type: peer_roles
        grounds:
          - validations[priority=18]
          - validations[priority=29]
          - errors[ERR_NOT_ASSIGNED_DEALER]
          - errors[ERR_TASK_STATE_INVALID]
          - endpoints[POST /remedy-tasks/{id}/start]
          - endpoints[POST /remedy-tasks/{id}/complete]
        distinguishing_aspect: |
          DealerAgent is the one entity-backed role: its X-User-ID IS a Dealer id, so two DealerAgents are
          peers who must not reach each other's rows. The ownership check runs after existence but before any
          state precondition, so an outsider poking a task learns nothing about its state — the same call
          that would report ERR_TASK_STATE_INVALID for the owner reports ERR_NOT_ASSIGNED_DEALER for the
          stranger. Cancellation, by contrast, is not a dealer verb at all: it belongs to ComplianceOfficer.
        test_recipe:
          setup:
            - "TX fixture; dealer D-TX (licensed TX) holds one legacy DIESEL unit delivered 2026-05-10; dealer D-NV exists with no units"
            - "Campaign RC-DSL-01 (TYPE_C_CONV / DIESEL, window 2026-01-01..2026-07-31, kits_per_unit 1, total_kits 4) is LAUNCHED, creating one OPEN task on the D-TX unit"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
