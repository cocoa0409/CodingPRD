              as: ProgramAdmin
              captures: { coh1_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /members"
              payload: { program_id: "${prog_id}", cohort_id: "${coh1_id}", external_member_ref: "M2", state_code: "TX", tier: "SILVER" }
              as: LoyaltyAccountant
              captures: { m2_id: $.data.id }
            - call: "POST /accounting-periods"
              payload: { program_id: "${prog_id}", period_code: "2026-08", start_at: "2026-08-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }
              as: Controller
              captures: { per1_id: $.data.id }
          trigger:
            - call: "POST /point-lots"
              payload: { member_id: "${m2_id}", period_id: "${per1_id}", base_points: 250, promo_multiplier_bp: 10300 }
              as: LoyaltyAccountant
              captures: { lot1_id: $.data.id }
          assert:
            - "PointLot.${lot1_id}.tier_points == 258 and points_issued == 266"
            - "PointLot.${lot1_id}.tier_benefit_expense_cents == 10 - round_half_up((258 - 250) * 1200 / 1000) == round_half_up(9.6)"
            - "PointLot.${lot1_id}.promo_expense_cents == 10 - round_half_up((266 - 258) * 1200 / 1000) == round_half_up(9.6), measured on the promotional delta only"
            - "The two expense legs sum to 20, NOT the 19 that round_half_up((266 - 250) * 1200 / 1000) == round_half_up(19.2) would give from a single combined delta"
            - "PointLot.${lot1_id}.gross_ssp_cents == 319, breakage_reserve_cents == 80 (round_half_up(79.75)), deferred_revenue_cents == 239"
            - "AccountingPeriod.${per1_id}.issuance_deferred_cents == 239 - only the deferral is booked to the period; the two expense legs are reported on the lot, not added to the liability"

  # ============================================================================
  # SECTION 4 of 9 - validations (13 instances)
  # Covers Violation -> Error, Satisfaction -> Pass, Priority Ordering, plus the
  # Priority conflict / Cross-entity / Temporal / Aggregate / Conditional /
  # Cascading algorithm rows. Six corners are already exercised at depth by
  # SCAFFOLD_DIFFICULTY_DESIGN.yaml and are stubbed here.
  # ============================================================================
  - section: validations
    instances:
      - name: valid_priority_period_state_outranks_issuance_cap
        claim_type: Priority conflict
        grounds:
          - validations[priority=60].conflict_pair
          - validations[priority=90]
        distinguishing_aspect: "A single POST /point-lots that breaches BOTH the period-state gate and the per-issuance point cap must surface the lower-numbered ERR_PERIOD_NOT_OPEN, and the same body must surface ERR_ISSUANCE_CAP_EXCEEDED once the period gate is satisfied."
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / priority_period_not_open_outranks_issuance_cap_exceeded
          rationale: "The §1.8 instance drives the full ordering probe - the same double-violating request against a SOFT_CLOSED period, then against an OPEN period, then the clean boundary case - so the priority-conflict corner is already covered at depth."

      - name: valid_priority_memo_requirement_outranks_statement_settlement
        claim_type: Priority Ordering
        grounds:
          - validations[priority=71]
          - validations[priority=85]
        distinguishing_aspect: "A hard-close attempt that violates both the memo-narrative requirement and the all-statements-settled requirement must report ERR_MEMO_NARRATIVE_REQUIRED, not the more obvious settlement failure."
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / priority_memo_narrative_outranks_unsettled_statements
          rationale: "The §1.8 instance already stages the doubly-violating hard close, then fixes the memo to expose ERR_UNSETTLED_STATEMENTS, then settles to let the close through."

      - name: valid_issuance_cap_satisfied_exactly_at_the_bound
        claim_type: Satisfaction -> Pass
        grounds:
          - validations[priority=90]
          - calculations.point_issuance_measurement
        distinguishing_aspect: "points_issued exactly equal to per_issuance_point_cap must PASS - the comparison is a strict `>` breach, so equality is a satisfaction case, not a violation."
        excluded_because:
          difficulty_instance: boundary_precision_check / boundary_issuance_cap_inclusive_at_five_thousand
          rationale: "The §1.8 boundary instance walks 4999 / 5000 / 5001 through the same endpoint and asserts the pass at exactly the cap, so the satisfaction side of this validation is already probed."

      - name: valid_cross_entity_issuance_needs_open_period_and_active_program
        claim_type: Cross-entity
        grounds:
          - validations[priority=60]
          - validations[priority=61]
        distinguishing_aspect: "POST /point-lots reads state off two OTHER entities - the AccountingPeriod and the LoyaltyProgram - and either one being out of state blocks the write."
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / cross_entity_point_lot_requires_open_period_and_active_program
          rationale: "The §1.8 instance suspends the program and soft-closes the period independently and asserts each error in isolation plus the both-broken ordering, fully covering the cross-entity validation corner."

      - name: valid_temporal_period_windows_may_touch_but_not_overlap
        claim_type: Temporal
        grounds:
          - validations[priority=76]
        distinguishing_aspect: "AccountingPeriod windows are half-open, so a new period starting exactly at the prior period's end_at is accepted while one starting a moment earlier is rejected."
        excluded_because:
          difficulty_instance: resource_temporal_overlap / temporal_accounting_period_adjacent_allowed_overlap_rejected
          rationale: "The §1.8 temporal-overlap instance already drives the touching-boundary acceptance and the one-instant overlap rejection against POST /accounting-periods."

      - name: valid_temporal_partner_window_must_clear_the_settlement_tail
        claim_type: Temporal
        grounds:
          - validations[priority=77]
        distinguishing_aspect: "PartnerAgreement windows are NOT merely non-overlapping: the new window must begin strictly after the prior window's end_date plus its settlement_lag_days."
        excluded_because:
          difficulty_instance: resource_temporal_overlap / temporal_partner_agreement_window_needs_settlement_lag_buffer
          rationale: "The §1.8 instance already probes the lag-buffer arithmetic on both sides of the boundary (a start inside the tail rejected, one day later accepted)."

      - name: valid_aggregate_balance_tested_at_allocate_not_at_request
        claim_type: Aggregate
        grounds:
          - validations[priority=91]
          - endpoints[POST /redemption-events]
          - endpoints[POST /redemption-events/{id}/allocate]
        distinguishing_aspect: "The sum-over-lots balance check lives on ALLOCATE, not on create: a 1500-point request against a 1000-point balance is accepted as a REQUESTED event and only refused when allocation is attempted, leaving the event and the lot untouched."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. Program 'Balance Core' ACTIVE (ssp 1200, cap 5000, historical 7500 so current_breakage_rate_bp 2500), rule TX, cohort C1, member M1 BASE/TX, period per1 [2026-08-01, 2026-09-01)."
            - "M1 holds exactly one 1000-point lot (gross 1200, reserve 300, deferred 900); point_balance is 1000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
              payload: { name: "Balance Core", currency_code: "USD", ssp_millicents_per_point: 1200, point_expiry_days: 730, per_issuance_point_cap: 5000, tier_multiplier_bp: { BASE: 10000, SILVER: 10300, GOLD: 12500, PLATINUM: 15000 }, promo_multiplier_cap_bp: 30000, breakage_method: "COHORT_WEIGHTED", historical_redemption_rate_bp: 7500, escheat_disclosure_threshold_cents: 100000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /state-expiry-rules"
              payload: { program_id: "${prog_id}", state_code: "TX", expiry_permitted: true, min_dormancy_days: 730, escheatment_required: false, escheat_rate_bp: 0 }
              as: ProgramAdmin
            - call: "POST /cohorts"
              payload: { program_id: "${prog_id}", cohort_code: "C1", enrollment_start_date: "2024-01-01T00:00:00Z", enrollment_end_date: "2024-12-31T00:00:00Z", observed_redemption_rate_bp: 8200, sample_size: 40000, program_change_adjustment_bp: 0 }
              as: ProgramAdmin
              captures: { coh1_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /members"
              payload: { program_id: "${prog_id}", cohort_id: "${coh1_id}", external_member_ref: "M1", state_code: "TX", tier: "BASE" }
              as: LoyaltyAccountant
              captures: { m1_id: $.data.id }
            - call: "POST /accounting-periods"
              payload: { program_id: "${prog_id}", period_code: "2026-08", start_at: "2026-08-01T00:00:00Z", end_at: "2026-09-01T00:00:00Z" }
              as: Controller
              captures: { per1_id: $.data.id }
            - call: "POST /point-lots"
              payload: { member_id: "${m1_id}", period_id: "${per1_id}", base_points: 1000, promo_multiplier_bp: 10000 }
              as: LoyaltyAccountant
              captures: { lot1_id: $.data.id }
          trigger:
            - call: "POST /redemption-events"
              payload: { member_id: "${m1_id}", period_id: "${per1_id}", points_requested: 1500, redemption_type: "CATALOG" }
              as: LoyaltyAccountant
              captures: { rev_big_id: $.data.id }
            - call: "POST /redemption-events/${rev_big_id}/allocate"
              payload: {}
              as: LoyaltyAccountant
              captures: { err: $.data.error_id }
            - call: "POST /redemption-events"
              payload: { member_id: "${m1_id}", period_id: "${per1_id}", points_requested: 1000, redemption_type: "CATALOG" }
              as: LoyaltyAccountant
              captures: { rev_ok_id: $.data.id }
            - call: "POST /redemption-events/${rev_ok_id}/allocate"
              payload: {}
              as: LoyaltyAccountant
          assert:
            - "The 1500-point CREATE succeeds: RedemptionEvent.${rev_big_id}.state == REQUESTED even though the member only holds 1000 points"
            - "The 1500-point ALLOCATE returns HTTP 409 with error_id == ERR_INSUFFICIENT_POINT_BALANCE - sum(points_remaining) == 1000 < 1500"
            - "After the refused allocate, RedemptionEvent.${rev_big_id}.state is STILL REQUESTED with allocated_points 0, and PointLot.${lot1_id}.points_remaining is STILL 1000 in lifecycle_state OUTSTANDING"
            - "GET /point-lots/${lot1_id}/allocations returns total_count == 0 - a refused allocation writes no RedemptionAllocation rows"
            - "The 1000-point ALLOCATE succeeds: RedemptionEvent.${rev_ok_id}.state == ALLOCATED with allocated_points 1000, provisional_revenue_recognized_cents == 900 (line_gross 1200 less reserve round_half_up(1200 * 2500 / 10000) == 300)"
            - "PointLot.${lot1_id}.lifecycle_state == FULLY_REDEEMED with points_remaining 0 and Member.${m1_id}.point_balance == 0"
            - "AccountingPeriod.${per1_id}.redemption_recognized_cents == 900"

      - name: valid_conditional_promo_multiplier_above_program_cap_rejected
        claim_type: Conditional
        grounds:
          - validations[priority=88]
          - entities.LoyaltyProgram.fields.promo_multiplier_cap_bp
        distinguishing_aspect: "The cap is a per-program configured ceiling rather than a constant, and the comparison is inclusive: promo_multiplier_bp 30001 against cap 30000 is refused while exactly 30000 is accepted and multiplies the tier points."
