  # -------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # -------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: cart_overlap_buffered_half_open
        grounds:
          - calculations.cart_overlap_check
        distinguishing_aspect: |
          Cart interval semantics: buffered half-open. [event_start-90min, event_end+90min) with strict < overlap test. Two bookings whose RAW windows do NOT overlap but whose BUFFERED windows DO overlap are rejected.
        test_recipe:
          setup:
            - "Clock 2026-05-01T00:00:00Z"
            - "CONFIRMED booking B1 on CART-A 2026-05-10T10:00–12:00"
            - "New booking B2 on same cart, raw start 13:00 (raw windows disjoint; buffered: b1.buffered_end=13:30 > b2.buffered_start=11:30 → OVERLAP)"
          setup_api_calls:
            - call: "POST /coffee-cart/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /coffee-cart/clients"
              payload: { company_name: "Acme", contact_email: "acme@x.com" }
              as: OperationsManager
              captures: { client_id: $.data.id }
