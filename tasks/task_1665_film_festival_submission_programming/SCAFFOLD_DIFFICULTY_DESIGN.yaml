        distinguishing_aspect: |
          Entity pair ScreeningSlot x ExhibitionAgreement: holding a slot is
          gated on the linked agreement being SIGNED or ACTIVE — with the
          agreement still DRAFT the hold fails with ERR_AGREEMENT_NOT_SIGNED,
          and the same hold succeeds after issue+sign.
