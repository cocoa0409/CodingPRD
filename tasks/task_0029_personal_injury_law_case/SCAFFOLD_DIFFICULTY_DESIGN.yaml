            - call: "POST /medical-providers"
              payload: { name: "DC Hospital", contact: "dc@p.example" }
              as: Paralegal
              captures: { provider_id: $.data.id }
            - call: "POST /medical-records-requests"
              payload: { case_id: "${case_id}", provider_id: "${provider_id}" }
              as: Paralegal
              captures: { mrr_id: $.data.id }
            - call: "POST /medical-records-requests/${mrr_id}/receive"
              payload: {}
              as: Paralegal
            - call: "POST /medical-records-requests/${mrr_id}/review"
              payload: {}
              as: Attorney
            - call: "POST /demand-letters"
              payload: { case_id: "${case_id}", pain_multiplier: 1.5 }
              as: Attorney
              as_user_id: "drafter_2"
              captures: { dl_id: $.data.id }
          trigger:
            - call: "POST /demand-letters/${dl_id}/send"
              payload: {}
              as: ManagingPartner
              as_user_id: "partner_2"
          assert:
            - "DemandLetter.${dl_id}.status == 'SENT'"
            - "DemandLetter.${dl_id}.sent_at is not null"
            - "Case.${case_id}.status == 'DEMAND_SENT'"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  #
  # Instance 1: (state, business_safety) — INVALID_STATE wins over SEGREGATION
  # Instance 2: (business_safety, business_referential) — STATUTE_EXPIRED wins
  #             over DEMAND_PREREQUISITES_NOT_MET
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_beats_segregation_on_already_sent_demand
        grounds:
          - validations[priority=5]
          - validations[priority=8]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: |
          A request that violates BOTH (a) DemandLetter.status != DRAFT (priority 5,
          category state) AND (b) the sender's X-User-ID equals drafted_by_user_id
          (priority 8, category business_safety) MUST return ERR_INVALID_STATE — the
          higher-priority state check wins. Category pair: (state, business_safety).
        test_recipe:
          setup:
            - "Active CA Case, one REVIEWED MedicalRecordsRequest, one DemandLetter already SENT (drafted_by_user_id='drafter_5')."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients/register"
              payload: { full_name: "Pri5 Client", email: "pri5@example.com", phone: "555-0800" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/sign-retainer"
              payload: {}
              as: Paralegal
            - call: "POST /cases"
              payload: { client_id: "${client_id}", accident_date: "2024-06-15", jurisdiction: "CA" }
              as: Paralegal
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/activate"
              payload: {}
              as: Attorney
            - call: "POST /medical-providers"
              payload: { name: "Pri5 Hospital", contact: "p5@p.example" }
              as: Paralegal
              captures: { provider_id: $.data.id }
            - call: "POST /medical-records-requests"
              payload: { case_id: "${case_id}", provider_id: "${provider_id}" }
              as: Paralegal
              captures: { mrr_id: $.data.id }
            - call: "POST /medical-records-requests/${mrr_id}/receive"
              payload: {}
              as: Paralegal
            - call: "POST /medical-records-requests/${mrr_id}/review"
              payload: {}
              as: Attorney
            - call: "POST /demand-letters"
              payload: { case_id: "${case_id}", pain_multiplier: 1.5 }
              as: Attorney
              as_user_id: "drafter_5"
              captures: { dl_id: $.data.id }
            - call: "POST /demand-letters/${dl_id}/send"
              payload: {}
              as: ManagingPartner
              as_user_id: "partner_5"
          trigger:
            - call: "POST /demand-letters/${dl_id}/send"
              payload: {}
              as: ManagingPartner
              as_user_id: "drafter_5"
              captures: { error_id: $.data.error_id }
          assert:
            - "response.status_code == 409"
            - "response.data.error_id == 'ERR_INVALID_STATE'"

      - name: statute_expired_beats_demand_prerequisites_on_draft
        grounds:
          - validations[priority=7]
          - validations[priority=11]
          - errors[ERR_STATUTE_EXPIRED]
          - errors[ERR_DEMAND_PREREQUISITES_NOT_MET]
        distinguishing_aspect: |
          A DemandLetter draft attempted on a Case that BOTH (a) has SOL expired
          (priority 7, business_safety) AND (b) has no REVIEWED MedicalRecordsRequest
          (priority 11, business_referential) MUST return ERR_STATUTE_EXPIRED — the
          higher-priority business_safety check wins. Category pair: (business_safety,
          business_referential) — different from instance 1's pair.
        test_recipe:
          setup:
            - "CA Case with accident_date=2024-01-15 (SOL=2026-01-15), clock advanced to 2026-02-01 (past SOL), Case status ACTIVE (was activated before clock advance), NO REVIEWED MedicalRecordsRequest exists on the case."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clients/register"
              payload: { full_name: "Pri7 Client", email: "pri7@example.com", phone: "555-0900" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /clients/${client_id}/sign-retainer"
              payload: {}
              as: Paralegal
            - call: "POST /cases"
