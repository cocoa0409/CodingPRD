        claim_type: correct_result
        grounds:
          - calculations.required_coverage_amount
          - entities.LoanFolio.required_coverage_cents
        distinguishing_aspect: "Two folios in the same REGULAR community pick a different one of the three min() arguments: folio A is capped by principal_balance_cents, folio B by replacement_cost_cents, and the statutory cap wins on neither."
        test_recipe:
          setup:
            - "REGULAR FL community (coverage_availability FULL), panel seq 1 EFFECTIVE zone AE BFE 7.75"
            - "property A ROOFTOP + structure A SINGLE_FAMILY replacement 32000000, sfha_offset_ft -12.0; folio A principal 18000000 -> min(18000000, 32000000, 25000000) == 18000000"
            - "property B ROOFTOP + structure B SINGLE_FAMILY replacement 21000000, sfha_offset_ft -12.0; folio B principal 40000000 -> min(40000000, 21000000, 25000000) == 21000000"
          setup_api_calls:
            - call: "POST /flood-zone/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAnalyst
