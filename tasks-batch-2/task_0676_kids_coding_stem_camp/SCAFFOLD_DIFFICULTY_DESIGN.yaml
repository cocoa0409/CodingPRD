      - name: session_capacity_safety_beats_stale_version_constraint
        grounds:
          - validations[priority=16]
          - validations[priority=18]
          - errors[ERR_SESSION_AT_CAPACITY]
          - errors[ERR_STALE_SESSION_VERSION]
        distinguishing_aspect: "An enrollment that is BOTH over capacity (effective_capacity reached, priority 16 business_safety) AND carries a stale expected_session_version (priority 18 business_constraint/OCC) returns ERR_SESSION_AT_CAPACITY — a different category pair (business_safety vs business_constraint) than the referential-vs-constraint pair above."
        test_recipe:
          setup:
            - "Center device_count 1, ratio 1, so a 1-instructor 1-device session has effective_capacity 1; that one seat is already filled."
