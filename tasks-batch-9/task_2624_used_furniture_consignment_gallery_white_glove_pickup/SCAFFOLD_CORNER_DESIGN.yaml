            - "GET /consignors/${cons_id} reports unclaimed_balance_cents == 118"
            - "GET /consignors/${cons_id}/ledger-entries returns total_count == 2, the surcharge debit and the sale credit, with no PAYOUT_DEBIT among them"

      # --- the nine ids whose triggering is already owned by a §1.8 instance ---
      - name: escheated_consignor_payout_error_walk
        claim_type: error_triggerable
        grounds:
          - validations[priority 11]
          - errors[ERR_CONSIGNOR_ESCHEATED]
        distinguishing_aspect: "ERR_CONSIGNOR_ESCHEATED must beat the two fiscal payout gates below it, so an escheated consignor with a sub-minimum balance answers the escheat id rather than ERR_PAYOUT_BELOW_MINIMUM."
        excluded_because:
          difficulty_instance: escheated_state_p11_beats_payout_minimum_p39
          rationale: "That §1.8 instance exists precisely to pin the priority-11-over-priority-39 ordering and asserts ERR_CONSIGNOR_ESCHEATED on a consignor whose balance is also below the 2000-cent minimum; a separate corner instance would repeat the same escheatment-run fixture with a weaker assertion."

      - name: expired_agreement_placement_error_walk
        claim_type: error_triggerable
        grounds:
          - validations[priority 14]
          - errors[ERR_AGREEMENT_NOT_ACTIVE]
        distinguishing_aspect: "An agreement that has aged past expires_at stops governing placement even though its status column still reads ACTIVE, so the refusal is ERR_AGREEMENT_NOT_ACTIVE rather than a state-machine error."
        excluded_because:
          difficulty_instance: placement_blocked_by_expired_governing_agreement
          rationale: "That §1.8 instance drives the clock past expires_at on a fully received piece and asserts ERR_AGREEMENT_NOT_ACTIVE at placement; the corner walk would need the identical five-call fixture to reach the same line."

      - name: claim_resubmit_budget_error_walk
        claim_type: error_triggerable
        grounds:
          - validations[priority 17]
          - errors[ERR_CLAIM_RESUBMIT_LIMIT]
        distinguishing_aspect: "The negotiation cycle terminates after two resubmissions, so the third pass is refused with ERR_CLAIM_RESUBMIT_LIMIT rather than looping forever."
        excluded_because:
          difficulty_instance: damage_claim_info_request_cycle_terminates_on_third_pass
          rationale: "That §1.8 instance walks the full SUBMITTED / INFO_REQUESTED cycle twice and asserts ERR_CLAIM_RESUBMIT_LIMIT on the third request-info, which is the only reachable path to this id."

      - name: lapsed_election_deadline_error_walk
        claim_type: error_triggerable
        grounds:
          - validations[priority 19]
          - errors[ERR_ELECTION_DEADLINE_PASSED]
        distinguishing_aspect: "A lapsed election window refuses even an otherwise eligible election, and the deadline check at priority 19 outranks the category-eligibility check at priority 30."
        excluded_because:
          difficulty_instance: election_deadline_p19_beats_disposition_eligibility_p30
          rationale: "That §1.8 instance stages an ART piece (ineligible for DONATE) past its deadline so that two rules are violated at once and asserts ERR_ELECTION_DEADLINE_PASSED; a plain corner instance would assert strictly less."

      - name: closed_claim_window_error_walk
        claim_type: error_triggerable
        grounds:
          - validations[priority 20]
          - errors[ERR_CLAIM_WINDOW_CLOSED]
        distinguishing_aspect: "A REFUSED delivery leaves claim_window_ends_at null, and a null window is CLOSED rather than open-ended, so filing is refused with ERR_CLAIM_WINDOW_CLOSED."
        excluded_because:
          difficulty_instance: claim_filing_blocked_by_refused_delivery_leaving_the_window_null
          rationale: "That §1.8 instance is built around the null-window reading of this exact rule and asserts ERR_CLAIM_WINDOW_CLOSED after a REFUSED completion; duplicating it here would only re-file the same claim."

      - name: truck_double_booking_error_walk
        claim_type: error_triggerable
        grounds:
          - validations[priority 21]
          - errors[ERR_TRUCK_WINDOW_CONFLICT]
        distinguishing_aspect: "Truck windows are closed intervals extended by a 45-minute turnaround, so a job starting inside the previous job's cooldown is refused with ERR_TRUCK_WINDOW_CONFLICT."
        excluded_because:
          difficulty_instance: truck_windows_are_closed_intervals_plus_a_forty_five_minute_turnaround
          rationale: "That §1.8 instance tests the boundary on both sides of the turnaround and asserts ERR_TRUCK_WINDOW_CONFLICT on the near miss; a corner instance would restate the accepted half."

      - name: crew_concurrency_error_walk
        claim_type: error_triggerable
        grounds:
          - validations[priority 22]
          - errors[ERR_CREW_CAPACITY_EXCEEDED]
        distinguishing_aspect: "Crew windows are half-open and the capacity is two concurrent jobs, so the refusal appears only on the third overlapping order, as ERR_CREW_CAPACITY_EXCEEDED."
        excluded_because:
          difficulty_instance: crew_windows_are_half_open_and_capacity_two_rather_than_one
          rationale: "That §1.8 instance contrasts the truck rule with the crew rule on the same calendar and asserts ERR_CREW_CAPACITY_EXCEEDED at the third order; a corner instance cannot add a distinction."

      - name: double_reversal_error_walk
        claim_type: error_triggerable
        grounds:
          - validations[priority 15]
          - errors[ERR_SALE_ALREADY_REVERSED]
        distinguishing_aspect: "A reversal is not idempotent: the second reverse is refused with ERR_SALE_ALREADY_REVERSED, which is what keeps the two ledger rows summing to exactly zero."
        excluded_because:
          difficulty_instance: sale_reversal_returns_the_ledger_to_its_pre_sale_balance
          rationale: "That §1.8 instance reverses once, asserts the restored balance, then asserts ERR_SALE_ALREADY_REVERSED on the second attempt, so the error is already covered together with the invariant it protects."

      - name: stale_item_version_write_off_error_walk
        claim_type: error_triggerable
        grounds:
          - concurrency_rules[ConsignmentItem write-off]
          - validations[priority 8]
          - errors[ERR_STALE_ITEM_VERSION]
        distinguishing_aspect: "The write-off endpoint is version-guarded on the ITEM rather than on the consignor, so a version read before an inventory flag is stale by the time the write-off is attempted."
        excluded_because:
          difficulty_instance: write_off_then_recovery_and_replacement_restores_zone_square_footage
          rationale: "That §1.8 instance already re-uses a pre-flag item version and asserts ERR_STALE_ITEM_VERSION at 412 before retrying with the fresh version inside the same cycle, which is a strictly stronger test than a standalone stale-version call."

  # ==========================================================================
  # 7. RBAC
  #
  # complexity_profile.role_model is segregation_of_duties, so the walk covers
  # the two general Table 7 rows (own exclusive operations allowed, another
  # role's exclusive operation denied) plus all THREE segregation sites the
  # scaffold declares: the appraiser that screened an item, the operator that
  # counted an audit, and the coordinator that scheduled a delivery.
  # ==========================================================================
  - section: rbac
    instances:
      - name: an_intake_appraiser_cannot_place_a_piece_on_the_floor
        claim_type: other_roles_exclusive_operations_denied
        grounds:
          - roles[IntakeAppraiser]
          - roles[FloorOperator exclusive_operations]
          - validations[priority 2]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "Authorisation is decided BEFORE existence: the appraiser is refused with ERR_UNAUTHORIZED at HTTP 403 on an item id that does not exist at all, while the same call from a FloorOperator on the same id reaches priority 4 and answers ERR_ITEM_NOT_FOUND at 404."
        test_recipe:
          setup:
            - "an empty database; no fixture is needed because priority 2 runs above the path-existence check at priority 4"
          setup_api_calls: []
          trigger:
            - call: "POST /consignment-items/00000000-0000-4000-8000-000000000011/place"
              payload: { placement_zone_id: "00000000-0000-4000-8000-000000000012", tag_code: "FRONT-0001" }
              as: IntakeAppraiser
              as_user_id: "appr-1"
          assert:
            - "HTTP 403 and data.error_id == \"ERR_UNAUTHORIZED\""
            - "the identical body sent as FloorOperator returns HTTP 404 with data.error_id == \"ERR_ITEM_NOT_FOUND\", which is what proves the 403 came from the role and not from the missing row"
            - "GET /consignment-items as GalleryManager returns total_count == 0"

