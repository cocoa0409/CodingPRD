  # ===========================================================================
  # RULE 6 — boundary_precision_check
  # Two DIFFERENT metrics on two DIFFERENT endpoints:
  #   coverage_ratio_bps at 10000 exactly   -> POST /reserve-funds/{id}/deposits
  #   mape_bps at 500 exactly               -> POST /actual-collections
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: coverage_ratio_strong_band_at_exactly_10000_bps_versus_9999
        grounds:
          - calculations.reserve_adequacy
          - entities.ReserveFund.fields.coverage_ratio_bps
          - entities.ReserveFund.fields.adequacy_band
          - validations[priority 55 ERR_DEPOSIT_EXCEEDS_CAP]
          - endpoints[POST /reserve-funds/{id}/deposits]
        distinguishing_aspect: |
          One cent decides a disclosed rating band: two identical funds each holding 21958137 receive
          manual deposits of 57487677 and 57487676, landing on balances 79445814 and 79445813 against
          the same required_reserve_cents 79445814, so the floor in STEP 4 yields exactly 10000 bps
          (STRONG, cushion 200, disclosed 300) for the first and 9999 bps (ADEQUATE, cushion 0,
          disclosed 500) for the second.
