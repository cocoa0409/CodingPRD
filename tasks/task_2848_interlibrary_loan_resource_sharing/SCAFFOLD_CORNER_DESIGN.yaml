# =============================================================================
# §1.9 Scaffold Corner Design — Interlibrary Loan & Resource Sharing (task 2848)
#
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7. Sections and claim_type values are
# taken verbatim from references/claim-extraction-guide.md; no categories are
# invented. Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as
# excluded_because stubs with no test_recipe.
#
# Conventions shared with §1.8:
#   * The logical clock starts at 2026-08-01T00:00:00Z and only ever moves
#     forward, via POST /_clock/set_current_utc.
#   * Test user ids: admin-01 (LibraryAdmin), ill-staff-01 / ill-staff-02
#     (IllBorrowingStaff), acq-01 / acq-02 (AcquisitionsLibrarian),
#     acct-01 (ConsortiumAccountant). A PartnerAgent authenticates as the
#     Partner row's own id; a Patron as the Patron row's own id.
#   * Money is integer cents everywhere. Pagination defaults are limit 10
#     (min 1, max 100) and offset 0.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: create_patron_with_all_required_fields_returns_201_and_echoes_inputs
        claim_type: creation
        grounds:
          - entities.Patron
          - endpoints[POST /ill/patrons]
          - response_envelope
        distinguishing_aspect: "POST /ill/patrons with the five required inputs returns 201 with every declared Patron field present in data, wrapped in the success envelope whose meta carries api_request_id and api_request_timestamp."
        test_recipe:
          setup:
            - "Empty database; clock at its default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /ill/patrons"
              payload: { external_id: "P-9001", full_name: "Ada Reader", email: "ada@u.edu", patron_type: "FACULTY", department: "CSCI", max_open_requests: 7, max_concurrent_loans: 4, unpaid_balance_cap_cents: 12000 }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { patron_id: $.data.id, ext: $.data.external_id, ptype: $.data.patron_type, caps: $.data.max_open_requests }
          assert:
            - "HTTP 201 and ${ext} == P-9001 and ${ptype} == FACULTY and ${caps} == 7"
            - "response_type == object and data contains id, created_at, updated_at and version"
            - "Patron.${patron_id}.version == 1 and Patron.${patron_id}.status == ACTIVE"
            - "Patron.${patron_id}.max_concurrent_loans == 4 and unpaid_balance_cap_cents == 12000"
            - "meta.api_request_id and meta.api_request_timestamp are both present and non-empty"

      - name: omitting_patron_optional_caps_applies_the_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Patron.fields.max_open_requests
          - entities.Patron.fields.max_concurrent_loans
          - entities.Patron.fields.unpaid_balance_cap_cents
          - endpoints[POST /ill/patrons]
        distinguishing_aspect: "With max_open_requests, max_concurrent_loans and unpaid_balance_cap_cents all omitted, the created Patron carries exactly 5, 3 and 5000 — the §1.1 defaults, not zero and not null."
        test_recipe:
          setup:
            - "Empty database; clock at 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /ill/patrons"
              payload: { external_id: "P-9002", full_name: "Ben Reader", email: "ben@u.edu", patron_type: "UNDERGRAD", department: "ENGL" }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { patron_id: $.data.id, mor: $.data.max_open_requests, mcl: $.data.max_concurrent_loans, cap: $.data.unpaid_balance_cap_cents }
          assert:
            - "${mor} == 5 and ${mcl} == 3 and ${cap} == 5000"
            - "Patron.${patron_id}.status == ACTIVE"
            - "Patron.${patron_id}.provisional_risk_score == 0 and final_risk_score == 0"
            - "Patron.${patron_id}.unpaid_balance_cents == 0 and open_request_count == 0 and pending_charge_cents == 0"

      - name: patron_create_missing_patron_type_is_rejected_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Patron.fields.patron_type
          - validations[priority=35]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting the required input field patron_type returns ERR_INVALID_REQUEST (400) and writes no Patron row."
        test_recipe:
          setup:
            - "Empty database; clock at 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /ill/patrons"
              payload: { external_id: "P-9003", full_name: "Cara Reader", email: "cara@u.edu", department: "MUSI" }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST with HTTP 400"
            - "data contains exactly error_id and message; message is a non-empty string"
            - "GET /ill/patrons?external_id=P-9003 returns total_count == 0"

      - name: patron_create_with_unknown_patron_type_enum_is_rejected_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.Patron.fields.patron_type
          - validations[priority=35]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "patron_type ALUMNI is outside the declared enum {FACULTY, GRAD, UNDERGRAD, STAFF} and returns ERR_INVALID_REQUEST (400) rather than being coerced or stored."
        test_recipe:
          setup:
            - "Empty database; clock at 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /ill/patrons"
              payload: { external_id: "P-9004", full_name: "Dov Reader", email: "dov@u.edu", patron_type: "ALUMNI", department: "HIST" }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST with HTTP 400"
            - "GET /ill/patrons?external_id=P-9004 returns total_count == 0"

      - name: bib_item_create_extra_field_id_and_created_at_input_ignored
        claim_type: system_fields
        grounds:
          - entities.BibItem
          - endpoints[POST /ill/bib-items]
        distinguishing_aspect: "Client-supplied id and created_at are not part of the endpoint's input schema; the server mints both, so the response id differs from the submitted string and created_at equals the current logical clock."
        test_recipe:
          setup:
            - "Empty database; clock at 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /ill/bib-items"
              payload: { title: "Systems of Cataloguing", item_type: "BOOK", publication_year: 2011, isbn: "978-0-000-00020-2", local_holding_status: "NONE", licensed_access_status: "NONE", list_price_cents: 9000, id: "00000000-0000-0000-0000-000000000001", created_at: "1999-01-01T00:00:00Z" }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { bib_id: $.data.id, made_at: $.data.created_at }
          assert:
            - "${bib_id} != 00000000-0000-0000-0000-000000000001 — the id is server-minted"
            - "${made_at} == 2026-08-01T00:00:00Z — created_at is stamped from the logical clock, not from the payload"
            - "BibItem.${bib_id}.version == 1"

      - name: request_intake_computes_its_charge_fields_from_the_committed_lender_quote
        claim_type: computed_fields
        grounds:
          - entities.IllRequest.fields.gross_charge_cents
          - entities.IllRequest.fields.subsidy_cents
          - entities.IllRequest.fields.net_patron_charge_cents
          - calculations.patron_charge_assembly
        distinguishing_aspect: "A LOAN request committed at a 2000-cent quote with no rush and no royalty produces gross_charge_cents 2000, subsidy_cents 1600 (the 0.80 tier on a gross of 2000) and net_patron_charge_cents 400 — all three source: computed, none of them client-supplied."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "Patron P-9005 with default caps."
            - "Partner NORTHU quoting 2000 cents / 4 days on a single-entry LOAN rota."
            - "BibItem with local_holding_status NONE; needed_by 2026-08-09 gives days_available 8, so no rush surcharge applies and the landed cost is the bare 2000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/patrons"
              payload: { external_id: "P-9005", full_name: "Eve Reader", email: "eve@u.edu", patron_type: "GRAD", department: "MATH" }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { patron_id: $.data.id }
            - call: "POST /ill/partners"
              payload: { code: "NORTHU", name: "North University Library", consortium_code: "MIDWEST", base_lending_fee_cents: 2000, avg_turnaround_days: 4, ships_physical: true, supplies_electronic: true, allows_renewals: true, loan_period_days: 28, max_renewals: 2 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { northu_id: $.data.id }
            - call: "POST /ill/rotas"
              payload: { name: "Monograph rota", material_type: "LOAN", selection_policy: "LANDED_COST", max_attempts: 3, auto_escalate_pod: false, offer_response_hours: 48 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { rota_id: $.data.id, rota_v0: $.data.version }
            - call: "POST /ill/rota-entries"
              payload: { rota_id: "${rota_id}", expected_rota_version: "${rota_v0}", partner_id: "${northu_id}", manual_rank: 1, quoted_fee_cents: 2000, quoted_turnaround_days: 4, is_enabled: true }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/bib-items"
              payload: { title: "Analytic Number Theory", item_type: "BOOK", publication_year: 2011, isbn: "978-0-000-00021-9", local_holding_status: "NONE", licensed_access_status: "NONE", list_price_cents: 9000 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { bib_id: $.data.id }
            - call: "POST /ill/requests"
              payload: { patron_id: "${patron_id}", bib_item_id: "${bib_id}", rota_id: "${rota_id}", service_type: "LOAN", delivery_mode: "PICKUP", needed_by: "2026-08-09T00:00:00Z", max_supply_fee_cents: 5000 }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { req_id: $.data.id }
            - call: "POST /ill/requests/${req_id}/source"
              payload: {}
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { offer_id: $.data.id }
          trigger:
            - call: "POST /ill/supply-offers/${offer_id}/accept"
              payload: {}
              as: PartnerAgent
              as_user_id: "${northu_id}"
          assert:
            - "IllRequest.${req_id}.committed_fee_cents == 2000 and rush_surcharge_cents == 0 and royalty_cents == 0"
            - "IllRequest.${req_id}.gross_charge_cents == 2000"
            - "IllRequest.${req_id}.subsidy_cents == 1600 — the 0.80 tier applies to a gross of 2000"
            - "IllRequest.${req_id}.net_patron_charge_cents == 400"
            - "Patron.${patron_id}.pending_charge_cents == 400"

      - name: get_partner_by_id_returns_every_stored_and_derived_field
        claim_type: retrieval
        grounds:
          - entities.Partner
          - endpoints[GET /ill/partners/{id}]
        distinguishing_aspect: "GET /ill/partners/{id} on a freshly created partner returns the eleven submitted inputs unchanged plus the derived balance fields initialised to 0."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one Partner created and nothing else."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/partners"
              payload: { code: "EASTV", name: "East Valley College Library", consortium_code: "EASTERN", base_lending_fee_cents: 1750, avg_turnaround_days: 6, ships_physical: true, supplies_electronic: false, allows_renewals: false, loan_period_days: 21, max_renewals: 1 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { partner_id: $.data.id }
          trigger:
            - call: "GET /ill/partners/${partner_id}"
              payload: {}
              as: ConsortiumAccountant
              as_user_id: "acct-01"
              captures: { code: $.data.code, fee: $.data.base_lending_fee_cents, payable: $.data.borrow_payable_cents, receivable: $.data.lend_receivable_cents, imbalance: $.data.net_borrow_imbalance_items }
          assert:
            - "${code} == EASTV and ${fee} == 1750"
            - "Partner.${partner_id}.status == ACTIVE and supplies_electronic == false and allows_renewals == false"
            - "${payable} == 0 and ${receivable} == 0 and ${imbalance} == 0"
            - "Partner.${partner_id}.borrowed_from_count == 0 and lent_to_count == 0"

      - name: list_bib_items_combines_filter_offset_and_limit_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /ill/bib-items]
          - response_envelope
        distinguishing_aspect: "With three ARTICLE rows and two BOOK rows stored, GET /ill/bib-items?item_type=ARTICLE&limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset=2 returns 1 row with has_more false — total_count counts the filtered set, not the table."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "Five BibItems created in a pinned order: three ARTICLE rows then two BOOK rows."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/bib-items"
              payload: { title: "Article Alpha", item_type: "ARTICLE", issn: "1111-0001", journal_title: "Journal A", publication_year: 2023, local_holding_status: "NONE", licensed_access_status: "NONE", list_price_cents: 4000 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { art1_id: $.data.id }
            - call: "POST /ill/bib-items"
              payload: { title: "Article Beta", item_type: "ARTICLE", issn: "1111-0002", journal_title: "Journal B", publication_year: 2023, local_holding_status: "NONE", licensed_access_status: "NONE", list_price_cents: 4000 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { art2_id: $.data.id }
            - call: "POST /ill/bib-items"
              payload: { title: "Article Gamma", item_type: "ARTICLE", issn: "1111-0003", journal_title: "Journal C", publication_year: 2023, local_holding_status: "NONE", licensed_access_status: "NONE", list_price_cents: 4000 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { art3_id: $.data.id }
            - call: "POST /ill/bib-items"
              payload: { title: "Book Delta", item_type: "BOOK", publication_year: 2014, isbn: "978-0-000-00022-6", local_holding_status: "NONE", licensed_access_status: "NONE", list_price_cents: 9000 }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/bib-items"
              payload: { title: "Book Epsilon", item_type: "BOOK", publication_year: 2015, isbn: "978-0-000-00023-3", local_holding_status: "HELD_AVAILABLE", licensed_access_status: "NONE", list_price_cents: 9000 }
              as: LibraryAdmin
              as_user_id: "admin-01"
          trigger:
            - call: "GET /ill/bib-items"
              payload: { item_type: "ARTICLE", limit: 2, offset: 0 }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { page1_first: "$.data[0].id", page1_total: $.meta.total_count }
            - call: "GET /ill/bib-items"
              payload: { item_type: "ARTICLE", limit: 2, offset: 2 }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { page2_first: "$.data[0].id" }
            - call: "GET /ill/bib-items"
              payload: { local_holding_status: "HELD_AVAILABLE" }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
          assert:
            - "First call: response_type == array, data length == 2, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "${page1_first} == ${art1_id} — the default order is created_at ASC"
            - "Second call: data length == 1, total_count == 3, has_more == false, and ${page2_first} == ${art3_id}"
            - "Third call: data length == 1, total_count == 1, has_more == false — the holdings filter is applied independently of item_type"
            - "GET /ill/bib-items with no query parameters returns total_count == 5 with limit == 10 and offset == 0 applied by default"

      - name: get_supply_offer_with_unknown_uuid_returns_offer_not_found
        claim_type: not_found
        grounds:
          - validations[priority=30]
          - errors[ERR_SUPPLY_OFFER_NOT_FOUND]
          - endpoints[GET /ill/supply-offers/{id}]
        distinguishing_aspect: "A well-formed but unknown UUID on GET /ill/supply-offers/{id} returns ERR_SUPPLY_OFFER_NOT_FOUND with HTTP 404, not 400 and not an empty 200."
        test_recipe:
          setup:
            - "Empty database; clock at 2026-08-01T00:00:00Z. No SupplyOffer rows exist."
          setup_api_calls: []
          trigger:
            - call: "GET /ill/supply-offers/11111111-2222-3333-4444-555555555555"
              payload: {}
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_SUPPLY_OFFER_NOT_FOUND with HTTP 404"
            - "data contains exactly error_id and message"
            - "GET /ill/supply-offers returns total_count == 0"

      - name: patron_notification_is_immutable_with_no_version_and_no_write_endpoint
        claim_type: immutability
        grounds:
          - entities.PatronNotification
          - endpoints[GET /ill/requests/{id}/notifications]
        distinguishing_aspect: "PatronNotification declares common_fields false, so its rows carry sent_at but no id, version, created_at or updated_at, and §1.5 exposes only a read path — every notification is created as a transition side effect and never edited."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "Patron P-9006 and one intake against a single-entry LOAN rota, which emits the REQUEST_SUBMITTED notification as an intake side effect."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/patrons"
              payload: { external_id: "P-9006", full_name: "Finn Reader", email: "finn@u.edu", patron_type: "STAFF", department: "ARTS" }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { patron_id: $.data.id }
            - call: "POST /ill/partners"
              payload: { code: "NORTHU", name: "North University Library", consortium_code: "MIDWEST", base_lending_fee_cents: 2000, avg_turnaround_days: 4, ships_physical: true, supplies_electronic: true, allows_renewals: true, loan_period_days: 28, max_renewals: 2 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { northu_id: $.data.id }
            - call: "POST /ill/rotas"
              payload: { name: "Monograph rota", material_type: "LOAN", selection_policy: "LANDED_COST", max_attempts: 3, auto_escalate_pod: false, offer_response_hours: 48 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { rota_id: $.data.id, rota_v0: $.data.version }
            - call: "POST /ill/rota-entries"
              payload: { rota_id: "${rota_id}", expected_rota_version: "${rota_v0}", partner_id: "${northu_id}", manual_rank: 1, quoted_fee_cents: 2000, quoted_turnaround_days: 4, is_enabled: true }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/bib-items"
              payload: { title: "Baroque Ornament", item_type: "BOOK", publication_year: 2008, isbn: "978-0-000-00024-0", local_holding_status: "NONE", licensed_access_status: "NONE", list_price_cents: 9000 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { bib_id: $.data.id }
            - call: "POST /ill/requests"
              payload: { patron_id: "${patron_id}", bib_item_id: "${bib_id}", rota_id: "${rota_id}", service_type: "LOAN", delivery_mode: "PICKUP", needed_by: "2026-08-09T00:00:00Z", max_supply_fee_cents: 5000 }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { req_id: $.data.id }
          trigger:
            - call: "GET /ill/requests/${req_id}/notifications"
              payload: {}
              as: Patron
              as_user_id: "${patron_id}"
              captures: { kind0: "$.data[0].kind", chan0: "$.data[0].channel", sent0: "$.data[0].sent_at" }
          assert:
            - "total_count == 1 and ${kind0} == REQUEST_SUBMITTED and ${chan0} == EMAIL"
            - "${sent0} == 2026-08-01T00:00:00Z — sent_at is stamped from the logical clock"
            - "data[0] exposes request_id, kind, channel, subject and sent_at and NO id, version, created_at or updated_at field"
            - "No POST, PATCH or DELETE endpoint for PatronNotification exists anywhere in §1.5 — the only producer is a transition side effect"

      - name: rota_entry_create_with_unknown_partner_id_returns_partner_not_found
        claim_type: parent_relationships
        grounds:
          - entities.RotaEntry.fields.partner_id
          - validations[priority=32]
          - errors[ERR_PARTNER_NOT_FOUND]
        distinguishing_aspect: "A RotaEntry needs both of its referenced rows to exist; with a valid rota_id and an unknown partner_id the create returns ERR_PARTNER_NOT_FOUND (404) and the Rota's version is not bumped."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "One Rota with no entries; no Partner row matching the id used in the trigger."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/rotas"
              payload: { name: "Monograph rota", material_type: "LOAN", selection_policy: "LANDED_COST", max_attempts: 3, auto_escalate_pod: false, offer_response_hours: 48 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { rota_id: $.data.id, rota_v0: $.data.version }
          trigger:
            - call: "POST /ill/rota-entries"
              payload: { rota_id: "${rota_id}", expected_rota_version: "${rota_v0}", partner_id: "99999999-8888-7777-6666-555555555555", manual_rank: 1, quoted_fee_cents: 2000, quoted_turnaround_days: 4, is_enabled: true }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { err: $.data.error_id }
            - call: "GET /ill/rotas/${rota_id}"
              payload: {}
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { rota_v1: $.data.version }
          assert:
            - "${err} == ERR_PARTNER_NOT_FOUND with HTTP 404 — existence (priority 32) is checked before the OCC gate at priority 49"
            - "${rota_v1} == ${rota_v0} — the refused create left the parent version alone"
            - "GET /ill/rotas/${rota_id}/entries returns total_count == 0"

      - name: rota_entry_is_the_junction_row_reachable_from_both_the_rota_and_the_partner_side
        claim_type: many_to_many_junction
        grounds:
          - entities.RotaEntry
          - endpoints[GET /ill/rotas/{id}/entries]
          - endpoints[GET /ill/partners/{id}/rota-entries]
          - complexity_profile.entity_topology
