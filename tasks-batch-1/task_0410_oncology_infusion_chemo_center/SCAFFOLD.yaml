# =============================================================================
# Oncology Infusion & Chemotherapy Center — benchmark seed tables (v1)
# =============================================================================

scenario: |
  410. Oncology Infusion & Chemotherapy Center: regimen/protocol order set, chair
  & nurse scheduling, dose calculation (BSA/AUC) & double verification, drug mixing
  & waste (JW modifier), pre-medication & sequencing, prior-auth & specialty-drug
  acquisition, toxicity/reaction monitoring, treatment-cycle calendar

domain_name: oncology-infusion
api_prefix: /infusion-center

# -----------------------------------------------------------------------------
# Complexity profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: temporal_windowing      # chair + nurse interval scheduling with gap/buffer rules
  secondary_archetype: compliance_audit       # double-verification, JW-waste, segregation of duties
  complexity_layers:
    - optimistic_concurrency                  # OCC on TreatmentCycle.version for slot booking supersede
    - cascading_side_effects                  # verification → order release → cycle advance chains
    - dual_variant_calculation                # BSA-dose vs AUC(Calvert)-dose on different orders
    - rate_threshold_triggers                 # toxicity grade threshold auto-holds the cycle

  entity_topology: flat                       # peer entities linked by FK references, non-nested URLs
  state_machine_shape: branching              # fork/join verification + reject-revert loops
  relationship_patterns:
    - one_to_many
    - cross_aggregate                         # InfusionAppointment references Chair, Nurse, DrugOrder, Cycle

  role_model: segregation_of_duties           # preparer/orderer cannot be the independent double-checker
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table  (§1.1)
# =============================================================================
entities:
  - name: Patient
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: mrn, type: string, source: input, description: "Medical record number, unique" }
      - { name: full_name, type: string, source: input, description: "Patient name" }
      - { name: height_cm, type: number, source: input, description: "Height in cm, > 0" }
      - { name: weight_kg, type: number, source: input, description: "Weight in kg, > 0" }
      - { name: gfr_ml_min, type: number, source: input, description: "Glomerular filtration rate mL/min, > 0 (for Calvert AUC dosing)" }
      - { name: bsa_m2, type: number, source: computed, description: "Mosteller BSA = round_half_up(sqrt(height_cm*weight_kg/3600), 2); recomputed whenever height/weight updated" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | DECEASED — DECEASED set by POST /patients/{id}/mark-deceased" }

  - name: RegimenProtocol
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Protocol code, e.g. FOLFOX, unique" }
      - { name: name, type: string, source: input, description: "Protocol display name" }
      - { name: cycle_length_days, type: integer, source: input, description: "Days per cycle, >= 1" }
      - { name: total_cycles, type: integer, source: input, description: "Planned number of cycles, >= 1" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | PUBLISHED — order sets attach only while DRAFT; published protocols are immutable templates" }

  - name: OrderSetItem
    parent: RegimenProtocol
    common_fields: true
    fields:
      - { name: regimen_protocol_id, type: string, source: input, description: "FK -> RegimenProtocol.id" }
      - { name: drug_name, type: string, source: input, description: "Drug name" }
      - { name: role, type: enum, source: input, description: "CHEMO | PREMED — PREMED items are sequenced before CHEMO items" }
      - { name: dosing_method, type: enum, source: input, description: "BSA | AUC | FLAT — BSA uses dose_per_m2, AUC uses target_auc, FLAT uses flat_dose_mg" }
      - { name: dose_per_m2, type: number, source: input, required: false, description: "mg per m^2, required when dosing_method=BSA" }
      - { name: target_auc, type: number, source: input, required: false, description: "Target AUC, required when dosing_method=AUC" }
      - { name: flat_dose_mg, type: number, source: input, required: false, description: "Fixed mg dose, required when dosing_method=FLAT" }
      - { name: vial_size_mg, type: number, source: input, description: "Single-use vial size in mg, > 0 (drives JW waste)" }
      - { name: day_offset, type: integer, source: input, description: "Day within cycle the item runs, >= 1 (day 1 = first day of cycle)" }
      - { name: sequence_index, type: integer, source: input, description: "Ordering within a day; lower runs earlier" }

  - name: Chair
    parent: null
    common_fields: true
    fields:
      - { name: label, type: string, source: input, description: "Chair/bay label, unique" }
      - { name: is_isolation, type: boolean, source: input, default: false, description: "True for negative-pressure isolation bays" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | CLOSED — CLOSED via POST /chairs/{id}/close blocks new bookings" }

  - name: Nurse
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Nurse name" }
      - { name: is_chemo_certified, type: boolean, source: input, default: false, description: "True if certified to verify/administer chemo" }
      - { name: max_acuity_load, type: integer, source: input, default: 6, description: "Maximum summed acuity of overlapping appointments this nurse may cover, >= 1" }

  - name: PriorAuthorization
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: drug_name, type: string, source: input, description: "Specialty drug requiring auth" }
      - { name: payer, type: string, source: input, description: "Insurance payer name" }
      - { name: authorized_units_mg, type: number, source: input, required: false, description: "Approved total mg; required when transitioning to APPROVED" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED -> APPROVED | DENIED; APPROVED -> EXHAUSTED (auto when consumed_units_mg >= authorized_units_mg)" }
      - { name: consumed_units_mg, type: number, source: computed, default: 0, description: "Sum of administered_dose_mg across DrugOrders linked to this auth that reached ADMINISTERED" }

  - name: TreatmentCycle
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: regimen_protocol_id, type: string, source: input, description: "FK -> RegimenProtocol.id (must be PUBLISHED)" }
      - { name: treatment_start_date, type: string, source: input, description: "ISO date (YYYY-MM-DD) anchoring cycle 1 day 1" }
      - { name: current_cycle_number, type: integer, source: system, default: 1, description: "1-based cycle counter, advances on cycle completion" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "PLANNED -> ACTIVE -> ON_HOLD <-> ACTIVE; ACTIVE -> COMPLETED; PLANNED/ACTIVE/ON_HOLD -> ABANDONED" }
      - { name: bsa_snapshot_m2, type: number, source: computed, description: "Patient.bsa_m2 captured at activation; used for all BSA dosing in this cycle (frozen)" }
      - { name: gfr_snapshot_ml_min, type: number, source: computed, description: "Patient.gfr_ml_min captured at activation; used for all AUC dosing in this cycle (frozen)" }

  - name: DrugOrder
    parent: null
    common_fields: true
    fields:
      - { name: treatment_cycle_id, type: string, source: input, description: "FK -> TreatmentCycle.id" }
      - { name: order_set_item_id, type: string, source: input, description: "FK -> OrderSetItem.id (defines drug, role, dosing_method, vial)" }
      - { name: prior_authorization_id, type: string, source: input, required: false, description: "FK -> PriorAuthorization.id (required for specialty CHEMO drugs)" }
      - { name: dose_reduction_pct, type: number, source: input, default: 0, description: "Percent reduction applied to ordered dose, 0..100" }
      - { name: ordered_dose_mg, type: number, source: computed, description: "Computed from dosing_method + cycle snapshots + dose_reduction_pct (see calc ordered_dose)" }
      - { name: vials_drawn, type: integer, source: computed, description: "ceil(ordered_dose_mg / vial_size_mg)" }
      - { name: supplied_mg, type: number, source: computed, description: "vials_drawn * vial_size_mg" }
      - { name: waste_mg, type: number, source: computed, description: "supplied_mg - ordered_dose_mg (drives JW modifier)" }
      - { name: jw_modifier, type: boolean, source: computed, description: "True when waste_mg > 0 (discarded single-use vial drug is JW-billable)" }
      - { name: administered_dose_mg, type: number, source: computed, default: 0, description: "Set = ordered_dose_mg when order reaches ADMINISTERED; 0 otherwise" }
      - { name: prepared_by_nurse_id, type: string, source: system, required: false, description: "FK -> Nurse.id (nurse who issued PREPARE)" }
      - { name: verified_by_nurse_id, type: string, source: system, required: false, description: "FK -> Nurse.id (independent second nurse who issued VERIFY)" }
      - { name: status, type: enum, source: system, default: ORDERED, description: "ORDERED -> PREPARED -> VERIFIED -> ADMINISTERED; PREPARED -> ORDERED (reject); any non-terminal -> CANCELLED" }

  - name: InfusionAppointment
    parent: null
    common_fields: true
    fields:
      - { name: treatment_cycle_id, type: string, source: input, description: "FK -> TreatmentCycle.id" }
      - { name: chair_id, type: string, source: input, description: "FK -> Chair.id" }
      - { name: nurse_id, type: string, source: input, description: "FK -> Nurse.id (covering nurse)" }
      - { name: start_at, type: datetime, source: input, description: "ISO8601 UTC appointment start" }
      - { name: end_at, type: datetime, source: input, description: "ISO8601 UTC appointment end; must be > start_at" }
      - { name: acuity, type: integer, source: input, description: "Nursing acuity weight 1..5" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED -> CHECKED_IN -> COMPLETED; SCHEDULED/CHECKED_IN -> CANCELLED" }

  - name: ToxicityEvent
    parent: null
    common_fields: true
    fields:
      - { name: treatment_cycle_id, type: string, source: input, description: "FK -> TreatmentCycle.id" }
      - { name: drug_order_id, type: string, source: input, required: false, description: "FK -> DrugOrder.id (offending order, if known)" }
      - { name: ctcae_grade, type: integer, source: input, description: "CTCAE toxicity grade 1..5" }
      - { name: description, type: string, source: input, description: "Reaction description" }
      - { name: triggered_hold, type: boolean, source: computed, description: "True if this event auto-placed the cycle ON_HOLD (grade >= 3)" }

# =============================================================================
# Table 2: State Machine Table  (§1.2)
# =============================================================================
state_machines:
  - entity: RegimenProtocol
    initial_state: DRAFT
    terminal_states: [PUBLISHED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /regimen-protocols/{id}/publish"
        actor: Pharmacist
        preconditions:
          - "Protocol has >= 1 OrderSetItem (ERR_NO_ORDER_SET_ITEMS)"
          - "Protocol has >= 1 OrderSetItem with role=CHEMO (ERR_NO_CHEMO_ITEM)"
        side_effects:
          - "status -> PUBLISHED; protocol and its OrderSetItems become immutable templates"

  - entity: TreatmentCycle
    initial_state: PLANNED
    terminal_states: [COMPLETED, ABANDONED]
    transitions:
      - from: PLANNED
        to: ACTIVE
        trigger: "POST /treatment-cycles/{id}/activate"
        actor: Pharmacist
        preconditions:
          - "Patient.status == ACTIVE (ERR_PATIENT_NOT_ACTIVE)"
          - "RegimenProtocol.status == PUBLISHED (ERR_PROTOCOL_NOT_PUBLISHED)"
        side_effects:
          - "bsa_snapshot_m2 = Patient.bsa_m2 (frozen for this cycle)"
          - "gfr_snapshot_ml_min = Patient.gfr_ml_min (frozen for this cycle)"
          - "current_cycle_number = 1"
          - "status -> ACTIVE"
          - "increments TreatmentCycle.version by 1"

      - from: ACTIVE
        to: ON_HOLD
        trigger: "POST /treatment-cycles/{id}/hold  OR  system (ToxicityEvent grade >= 3 recorded)"
        actor: Nurse | system
        preconditions:
          - "Cycle is ACTIVE (ERR_CYCLE_NOT_ACTIVE)"
        side_effects:
          - "status -> ON_HOLD"
          - "Cascade: every DrugOrder of this cycle in {ORDERED, PREPARED, VERIFIED} -> CANCELLED (chain step 1)"
          - "Each cancelled DrugOrder that was VERIFIED reverses its administered reservation (administered_dose_mg stays 0; no PriorAuthorization consumption)"
          - "Cascade: every InfusionAppointment of this cycle in {SCHEDULED, CHECKED_IN} -> CANCELLED (chain step 2, freeing chair+nurse intervals)"
          - "increments TreatmentCycle.version by 1"

      - from: ON_HOLD
        to: ACTIVE
        trigger: "POST /treatment-cycles/{id}/resume"
        actor: Pharmacist
        preconditions:
          - "Cycle is ON_HOLD (ERR_CYCLE_NOT_ON_HOLD)"
          - "No open ToxicityEvent of grade >= 3 remains unresolved (ERR_UNRESOLVED_TOXICITY)"
        side_effects:
          - "status -> ACTIVE"
          - "increments TreatmentCycle.version by 1"

      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /treatment-cycles/{id}/advance-cycle (routes to COMPLETED when current_cycle_number == total_cycles)"
        actor: Pharmacist
        preconditions:
          - "Cycle is ACTIVE (ERR_CYCLE_NOT_ACTIVE)"
          - "All DrugOrders of the current cycle are in {ADMINISTERED, CANCELLED} (ERR_UNRESOLVED_ORDERS)"
        side_effects:
          - "status -> COMPLETED"
          - "increments TreatmentCycle.version by 1"
        note: "advance-cycle routes here automatically when current_cycle_number == RegimenProtocol.total_cycles (no separate error; the counter decides the branch)"

      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /treatment-cycles/{id}/advance-cycle (routes to self-loop when current_cycle_number < total_cycles)"
        actor: Pharmacist
        preconditions:
          - "Cycle is ACTIVE (ERR_CYCLE_NOT_ACTIVE)"
          - "All DrugOrders of the current cycle are in {ADMINISTERED, CANCELLED} (ERR_UNRESOLVED_ORDERS)"
        side_effects:
          - "current_cycle_number += 1"
          - "increments TreatmentCycle.version by 1"
        note: "Self-loop advancing the cycle counter; advance-cycle routes here automatically when current_cycle_number < RegimenProtocol.total_cycles; remains ACTIVE until the final cycle completes"

      - from: PLANNED
        to: ABANDONED
        trigger: "POST /treatment-cycles/{id}/abandon"
        actor: Pharmacist
        preconditions:
          - "Cycle is in {PLANNED, ACTIVE, ON_HOLD} (ERR_CYCLE_TERMINAL)"
        side_effects:
          - "status -> ABANDONED"
          - "Cascade: every non-terminal DrugOrder of this cycle -> CANCELLED"
          - "Cascade: every non-terminal InfusionAppointment of this cycle -> CANCELLED"
          - "increments TreatmentCycle.version by 1"

      - from: ACTIVE
        to: ABANDONED
        trigger: "POST /treatment-cycles/{id}/abandon"
        actor: Pharmacist
        preconditions:
          - "Cycle is in {PLANNED, ACTIVE, ON_HOLD} (ERR_CYCLE_TERMINAL)"
        side_effects:
          - "status -> ABANDONED"
          - "Cascade: every non-terminal DrugOrder of this cycle -> CANCELLED"
          - "Cascade: every non-terminal InfusionAppointment of this cycle -> CANCELLED"
          - "increments TreatmentCycle.version by 1"

      - from: ON_HOLD
        to: ABANDONED
        trigger: "POST /treatment-cycles/{id}/abandon"
        actor: Pharmacist
        preconditions:
          - "Cycle is in {PLANNED, ACTIVE, ON_HOLD} (ERR_CYCLE_TERMINAL)"
        side_effects:
          - "status -> ABANDONED"
          - "Cascade: every non-terminal DrugOrder of this cycle -> CANCELLED"
          - "Cascade: every non-terminal InfusionAppointment of this cycle -> CANCELLED"
          - "increments TreatmentCycle.version by 1"

  - entity: DrugOrder
    initial_state: ORDERED
    terminal_states: [ADMINISTERED, CANCELLED]
    transitions:
      - from: ORDERED
        to: PREPARED
        trigger: "POST /drug-orders/{id}/prepare"
        actor: Nurse
        preconditions:
          - "Parent TreatmentCycle.status == ACTIVE (ERR_CYCLE_NOT_ACTIVE)"
          - "Order is ORDERED (ERR_ORDER_NOT_ORDERED)"
        side_effects:
          - "prepared_by_nurse_id = acting Nurse id"
          - "status -> PREPARED"

      - from: PREPARED
        to: VERIFIED
        trigger: "POST /drug-orders/{id}/verify"
        actor: Nurse
        preconditions:
          - "Order is PREPARED (ERR_ORDER_NOT_PREPARED)"
          - "Acting Nurse.is_chemo_certified == true (ERR_NURSE_NOT_CERTIFIED)"
          - "Acting Nurse id != prepared_by_nurse_id (ERR_SAME_NURSE_VERIFICATION — segregation of duties)"
          - "Submitted recomputed_dose_mg equals stored ordered_dose_mg (ERR_DOSE_VERIFICATION_MISMATCH — independent double-check)"
        side_effects:
          - "verified_by_nurse_id = acting Nurse id"
          - "status -> VERIFIED"

      - from: PREPARED
        to: ORDERED
        trigger: "POST /drug-orders/{id}/reject"
        actor: Nurse
        preconditions:
          - "Order is PREPARED (ERR_ORDER_NOT_PREPARED)"
          - "Acting Nurse id != prepared_by_nurse_id (ERR_SAME_NURSE_VERIFICATION)"
        side_effects:
          - "prepared_by_nurse_id cleared to null"
          - "status -> ORDERED"
        note: "Reject-revert loop: a second nurse can send the order back for re-preparation"

      - from: VERIFIED
        to: ADMINISTERED
        trigger: "POST /drug-orders/{id}/administer"
        actor: Nurse
        preconditions:
          - "Order is VERIFIED (ERR_ORDER_NOT_VERIFIED)"
          - "Parent TreatmentCycle.status == ACTIVE (ERR_CYCLE_NOT_ACTIVE)"
          - "If prior_authorization_id set: linked PriorAuthorization.status == APPROVED AND consumed_units_mg + ordered_dose_mg <= authorized_units_mg (ERR_PRIOR_AUTH_INSUFFICIENT)"
        side_effects:
          - "administered_dose_mg = ordered_dose_mg"
          - "status -> ADMINISTERED"
          - "If prior_authorization_id set: linked PriorAuthorization.consumed_units_mg += ordered_dose_mg (chain step 1)"
          - "If that consumption makes consumed_units_mg >= authorized_units_mg: PriorAuthorization.status -> EXHAUSTED (chain step 2)"

      - from: ORDERED
        to: CANCELLED
        trigger: "POST /drug-orders/{id}/cancel  OR  cascade from cycle hold/abandon"
        actor: Nurse | system
        preconditions:
          - "Order is in {ORDERED, PREPARED, VERIFIED} (ERR_ORDER_TERMINAL)"
        side_effects:
          - "status -> CANCELLED"

      - from: PREPARED
        to: CANCELLED
        trigger: "POST /drug-orders/{id}/cancel  OR  cascade from cycle hold/abandon"
        actor: Nurse | system
        preconditions:
          - "Order is in {ORDERED, PREPARED, VERIFIED} (ERR_ORDER_TERMINAL)"
        side_effects:
          - "status -> CANCELLED"

      - from: VERIFIED
        to: CANCELLED
        trigger: "POST /drug-orders/{id}/cancel  OR  cascade from cycle hold/abandon"
        actor: Nurse | system
        preconditions:
          - "Order is in {ORDERED, PREPARED, VERIFIED} (ERR_ORDER_TERMINAL)"
        side_effects:
          - "status -> CANCELLED"

  - entity: InfusionAppointment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CHECKED_IN
        trigger: "POST /infusion-appointments/{id}/check-in"
        actor: Nurse
        preconditions:
          - "Appointment is SCHEDULED (ERR_APPOINTMENT_NOT_SCHEDULED)"
          - "Parent TreatmentCycle.status == ACTIVE (ERR_CYCLE_NOT_ACTIVE)"
        side_effects:
          - "status -> CHECKED_IN"

      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /infusion-appointments/{id}/complete"
        actor: Nurse
        preconditions:
          - "Appointment is CHECKED_IN (ERR_APPOINTMENT_NOT_CHECKED_IN)"
        side_effects:
          - "status -> COMPLETED"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /infusion-appointments/{id}/cancel  OR  cascade from cycle hold/abandon"
        actor: Nurse | system
        preconditions:
          - "Appointment is in {SCHEDULED, CHECKED_IN} (ERR_APPOINTMENT_TERMINAL)"
        side_effects:
          - "status -> CANCELLED; chair+nurse interval released"

      - from: CHECKED_IN
        to: CANCELLED
        trigger: "POST /infusion-appointments/{id}/cancel  OR  cascade from cycle hold/abandon"
        actor: Nurse | system
        preconditions:
          - "Appointment is in {SCHEDULED, CHECKED_IN} (ERR_APPOINTMENT_TERMINAL)"
        side_effects:
          - "status -> CANCELLED; chair+nurse interval released"

  - entity: PriorAuthorization
    initial_state: REQUESTED
    terminal_states: [DENIED, EXHAUSTED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /prior-authorizations/{id}/decide (decision=APPROVE)"
        actor: PriorAuthCoordinator
        preconditions:
          - "PA is REQUESTED (ERR_PA_NOT_REQUESTED)"
          - "authorized_units_mg provided and > 0 (ERR_INVALID_REQUEST)"
        side_effects:
          - "authorized_units_mg set; status -> APPROVED"

      - from: REQUESTED
        to: DENIED
        trigger: "POST /prior-authorizations/{id}/decide (decision=DENY)"
        actor: PriorAuthCoordinator
        preconditions:
          - "PA is REQUESTED (ERR_PA_NOT_REQUESTED)"
        side_effects:
          - "status -> DENIED"

      - from: APPROVED
        to: EXHAUSTED
        trigger: "system (when consumed_units_mg >= authorized_units_mg after a DrugOrder administer)"
        actor: system
        preconditions:
          - "PA is APPROVED and consumed_units_mg >= authorized_units_mg"
        side_effects:
          - "status -> EXHAUSTED (no further orders may consume against it)"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: appointment-book-stale-cycle
    parent_entity: TreatmentCycle
    write_endpoint: "POST /infusion-appointments"
    occ_field: "expected_treatment_cycle_version"
    description: |
      Booking an InfusionAppointment against a TreatmentCycle whose version has
      advanced since the client last observed it is rejected with a stale-version
      error. A hold or abandon cascade silently bumps the cycle's version and
      cancels its appointments; a booking carrying the pre-cascade version is
      stale and must not slip a new appointment onto a cycle whose schedule was
      just torn down.
    error_id: ERR_STALE_CYCLE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table  (§1.3)
# =============================================================================
calculations:
  - name: patient_bsa_mosteller
    trigger: "Patient create; Patient height/weight update"
    algorithm: weighted_scoring
    formula: |
      bsa_m2 = round_half_up( sqrt( height_cm * weight_kg / 3600 ), 2 )
      Example: height_cm=170, weight_kg=70 -> sqrt(170*70/3600)=sqrt(3.3055..)=1.8181.. -> 1.82
    input_set: "Single Patient row's height_cm and weight_kg at the moment of write"
    precision: "2 decimal places, round_half_up"

  - name: ordered_dose
    trigger: "DrugOrder create (side_effect of POST /drug-orders); names ordered_dose_mg, vials_drawn, supplied_mg, waste_mg, jw_modifier"
    algorithm: tiered_pricing
    formula: |
      Let item = the OrderSetItem (gives dosing_method, dose_per_m2 | target_auc | flat_dose_mg, vial_size_mg).
      Let cycle = the parent TreatmentCycle (gives bsa_snapshot_m2, gfr_snapshot_ml_min — both frozen at activation).
      Let r = dose_reduction_pct (0..100).

      Step 1 — base dose by method (evaluation order is fixed: compute base, THEN apply reduction, THEN round):
        if dosing_method == BSA:  base = item.dose_per_m2 * cycle.bsa_snapshot_m2
        if dosing_method == AUC:  base = item.target_auc * ( min(cycle.gfr_snapshot_ml_min, 125) + 25 )   # Calvert, GFR capped at 125
        if dosing_method == FLAT: base = item.flat_dose_mg
      Step 2 — apply reduction on the UNROUNDED base:  reduced = base * (1 - r/100)
      Step 3 — ordered_dose_mg = round_half_up(reduced, 0)   # whole mg
      Step 4 — vials_drawn   = ceil( ordered_dose_mg / item.vial_size_mg )
      Step 5 — supplied_mg   = vials_drawn * item.vial_size_mg
      Step 6 — waste_mg      = supplied_mg - ordered_dose_mg
      Step 7 — jw_modifier   = (waste_mg > 0)

      Worked: BSA, dose_per_m2=175, bsa_snapshot=1.82, r=0, vial=50
        base=175*1.82=318.5 ; reduced=318.5 ; ordered=round_half_up(318.5)=319 (half rounds up)
        vials=ceil(319/50)=7 ; supplied=350 ; waste=31 ; jw=true
      Worked: AUC, target_auc=5, gfr_snapshot=80, r=20, vial=150
        base=5*(80+25)=525 ; reduced=525*0.8=420 ; ordered=420 ; vials=ceil(420/150)=3 ; supplied=450 ; waste=30 ; jw=true
    input_set: "One DrugOrder, its OrderSetItem, and its TreatmentCycle's frozen snapshots"
    constants:
      GFR_CAP: 125
    precision: "ordered_dose_mg: 0 decimals round_half_up; reduction applied to unrounded base; vials via ceil"
    variants:
      - name: bsa_dose
        when: "OrderSetItem.dosing_method == BSA"
        difference: "base = dose_per_m2 * cycle.bsa_snapshot_m2 — depends on the patient's frozen body-surface-area snapshot"
      - name: auc_calvert_dose
        when: "OrderSetItem.dosing_method == AUC"
        difference: "base = target_auc * (min(gfr_snapshot,125) + 25) — Calvert renal-clearance formula with GFR capped at 125; independent of BSA"

  - name: prior_auth_consumed_units
    trigger: "DrugOrder VERIFIED->ADMINISTERED transition; names PriorAuthorization.consumed_units_mg"
    algorithm: aggregation
    formula: |
      consumed_units_mg = sum over DrugOrder d of d.administered_dose_mg
        where d.prior_authorization_id == this PA.id
          and d.status == ADMINISTERED
      Incrementally: on each administer, consumed_units_mg += that order's ordered_dose_mg.
      Boundary: when consumed_units_mg >= authorized_units_mg the PA auto-transitions APPROVED->EXHAUSTED.
    input_set: "All ADMINISTERED DrugOrders whose prior_authorization_id == PA.id; tie-break not needed (sum is order-independent)"
    precision: "whole mg; comparison uses >= for exhaustion"

  - name: nurse_acuity_load
    trigger: "POST /infusion-appointments (booking validation); not persisted, evaluated against the candidate interval"
    algorithm: interval_merge
    formula: |
      For the requested appointment R (nurse_id, [start_at, end_at), acuity a_R):
        overlapping = { existing InfusionAppointment X :
                          X.nurse_id == R.nurse_id
                          AND X.status IN {SCHEDULED, CHECKED_IN}
                          AND intervals [X.start_at, X.end_at) and [R.start_at, R.end_at) overlap
                            (overlap means X.start_at < R.end_at AND R.start_at < X.end_at; half-open, adjacency end==start does NOT overlap) }
        concurrent_load = a_R + sum(X.acuity for X in overlapping)
      Reject with ERR_NURSE_ACUITY_EXCEEDED when concurrent_load > Nurse.max_acuity_load.
    input_set: "SCHEDULED/CHECKED_IN appointments on the same nurse whose half-open interval overlaps R"
    constants: {}
    precision: "integer acuity sum; strict > triggers rejection (== max is allowed)"

  - name: cycle_day_schedule
    trigger: "GET /treatment-cycles/{id}/calendar; computes the scheduled date of each OrderSetItem occurrence per cycle"
    algorithm: projection
    formula: |
      For RegimenProtocol with cycle_length_days L and total_cycles T, anchored at treatment_start_date S:
        For cycle n in 1..T and OrderSetItem item with day_offset d:
          scheduled_date(n, item) = S + ( (n-1)*L + (d-1) ) days
      Example: S=2026-07-01, L=21, item.day_offset=8, n=2 -> 2026-07-01 + (21 + 7) days = 2026-07-29
    input_set: "The cycle's protocol OrderSetItems and the cycle's treatment_start_date; ordered by (cycle_number ASC, day_offset ASC, sequence_index ASC) — created_at ASC as final tie-break, never id"
    precision: "calendar-day granularity (date only)"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)  (§1.4)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_AUTH
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path and FK-body resource ids resolve, validated left-to-right (path before body)"
    error_id: "ERR_*_NOT_FOUND (resource-specific)"
    http_status: 404
    applies_to: all endpoints that reference a resource

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, numerics in declared range, end_at > start_at, dosing_method-specific field present"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST/PUT/PATCH"

  - priority: 5
    category: concurrency
    check: "OCC: expected_treatment_cycle_version (when required) equals current TreatmentCycle.version"
    error_id: ERR_STALE_CYCLE_VERSION
    http_status: 412
    applies_to: "POST /infusion-appointments"

  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested transition is legal; for DrugOrder creation and appointment check-in, the parent TreatmentCycle must be ACTIVE (ERR_CYCLE_NOT_ACTIVE)"
    error_id: "ERR_*_NOT_* / ERR_*_TERMINAL (state-specific)"
    http_status: 409
    applies_to: "all action endpoints (prepare/verify/administer/activate/hold/resume/advance/check-in/etc.) and POST /drug-orders"

  - priority: 7
    category: business_safety
    check: "Verifying nurse must be chemo-certified"
    error_id: ERR_NURSE_NOT_CERTIFIED
    http_status: 403
    applies_to: "POST /drug-orders/{id}/verify"

  - priority: 8
    category: business_safety
    check: "Segregation of duties: the nurse issuing VERIFY (or REJECT) must differ from prepared_by_nurse_id"
    error_id: ERR_SAME_NURSE_VERIFICATION
    http_status: 409
    applies_to: "POST /drug-orders/{id}/verify, POST /drug-orders/{id}/reject"

  - priority: 9
    category: business_safety
    check: "Independent double-check: submitted recomputed_dose_mg must equal stored ordered_dose_mg"
    error_id: ERR_DOSE_VERIFICATION_MISMATCH
    http_status: 409
    applies_to: "POST /drug-orders/{id}/verify"

  - priority: 10
    category: state
    check: "Chair must be OPEN to accept a new booking"
    error_id: ERR_CHAIR_CLOSED
    http_status: 409
    applies_to: "POST /infusion-appointments"

  - priority: 11
    category: business_temporal
    check: "Chair must be free: requested half-open interval must not overlap any SCHEDULED/CHECKED_IN appointment on the same chair (adjacency end==start allowed)"
    error_id: ERR_CHAIR_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /infusion-appointments"

  - priority: 12
    category: business_temporal
    check: "Nurse acuity capacity: summed acuity of overlapping appointments on the nurse plus the new acuity must not exceed Nurse.max_acuity_load (strict >)"
    error_id: ERR_NURSE_ACUITY_EXCEEDED
    http_status: 409
    applies_to: "POST /infusion-appointments"

  - priority: 13
    category: business_referential
    check: "Specialty CHEMO drug order: prior_authorization_id required, must reference a PA for the same patient and drug_name, status APPROVED"
    error_id: ERR_PRIOR_AUTH_REQUIRED
    http_status: 409
    applies_to: "POST /drug-orders (when OrderSetItem.role==CHEMO and OrderSetItem requires auth)"

  - priority: 14
    category: business_fiscal
    check: "At administer: PriorAuthorization remaining units (authorized_units_mg - consumed_units_mg) must cover ordered_dose_mg"
    error_id: ERR_PRIOR_AUTH_INSUFFICIENT
    http_status: 402
    applies_to: "POST /drug-orders/{id}/administer"

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table  (§1.5)
# =============================================================================
endpoints:
  # ---------- Patients ----------
  - method: POST
    path: "/infusion-center/patients"
    description: "Register a patient"
    roles: [Pharmacist]
    code: 201
    input: [mrn, full_name, height_cm, weight_kg, gfr_ml_min]
    output: Patient
    side_effects: ["bsa_m2 computed (Mosteller); status=ACTIVE"]

  - method: GET
    path: "/infusion-center/patients"
    description: "List patients"
    roles: [Pharmacist, Nurse, PriorAuthCoordinator]
    code: 200
    input: ["mrn?"]
    output: "Patient[]"
    side_effects: []

  - method: GET
    path: "/infusion-center/patients/{id}"
    description: "Get a patient"
    roles: [Pharmacist, Nurse, PriorAuthCoordinator]
    code: 200
    input: []
    output: Patient
    side_effects: []

  - method: PATCH
    path: "/infusion-center/patients/{id}"
    description: "Update patient height/weight/gfr (recomputes bsa_m2)"
    roles: [Pharmacist]
    code: 200
    input: ["height_cm?", "weight_kg?", "gfr_ml_min?"]
    output: Patient
    side_effects: ["bsa_m2 recomputed; version += 1"]

  - method: POST
    path: "/infusion-center/patients/{id}/mark-deceased"
    description: "Mark a patient deceased"
    roles: [Pharmacist]
    code: 200
    input: []
    output: Patient
    side_effects: ["status=DECEASED; version += 1"]

  # ---------- Regimen Protocols ----------
  - method: POST
    path: "/infusion-center/regimen-protocols"
    description: "Create a DRAFT regimen protocol"
    roles: [Pharmacist]
    code: 201
    input: [code, name, cycle_length_days, total_cycles]
    output: RegimenProtocol
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/infusion-center/regimen-protocols"
    description: "List regimen protocols"
    roles: [Pharmacist, Nurse, PriorAuthCoordinator]
    code: 200
    input: ["status?"]
    output: "RegimenProtocol[]"
    side_effects: []

  - method: GET
    path: "/infusion-center/regimen-protocols/{id}"
    description: "Get a regimen protocol"
    roles: [Pharmacist, Nurse, PriorAuthCoordinator]
    code: 200
    input: []
    output: RegimenProtocol
    side_effects: []

  - method: POST
    path: "/infusion-center/regimen-protocols/{id}/publish"
    description: "Publish a protocol (DRAFT -> PUBLISHED)"
    roles: [Pharmacist]
    code: 200
    input: []
    output: RegimenProtocol
    side_effects: ["status -> PUBLISHED; protocol+items immutable"]

  # ---------- Order Set Items ----------
  - method: POST
    path: "/infusion-center/order-set-items"
    description: "Attach an order set item to a DRAFT protocol"
    roles: [Pharmacist]
    code: 201
    input: [regimen_protocol_id, drug_name, role, dosing_method, "dose_per_m2?", "target_auc?", "flat_dose_mg?", vial_size_mg, day_offset, sequence_index]
    output: OrderSetItem
    side_effects: []

  - method: GET
    path: "/infusion-center/order-set-items"
    description: "List order set items (filter by protocol)"
    roles: [Pharmacist, Nurse, PriorAuthCoordinator]
    code: 200
    input: ["regimen_protocol_id?"]
    output: "OrderSetItem[]"
    side_effects: []

  - method: GET
    path: "/infusion-center/order-set-items/{id}"
    description: "Get an order set item"
    roles: [Pharmacist, Nurse, PriorAuthCoordinator]
    code: 200
    input: []
    output: OrderSetItem
    side_effects: []

  # ---------- Chairs ----------
  - method: POST
    path: "/infusion-center/chairs"
    description: "Create an infusion chair/bay"
    roles: [Pharmacist]
    code: 201
    input: [label, "is_isolation?"]
    output: Chair
    side_effects: ["status=OPEN"]

  - method: GET
    path: "/infusion-center/chairs"
    description: "List chairs"
    roles: [Pharmacist, Nurse, PriorAuthCoordinator]
    code: 200
    input: []
    output: "Chair[]"
    side_effects: []

  - method: GET
    path: "/infusion-center/chairs/{id}"
    description: "Get a chair"
    roles: [Pharmacist, Nurse, PriorAuthCoordinator]
    code: 200
    input: []
    output: Chair
    side_effects: []

  - method: POST
    path: "/infusion-center/chairs/{id}/close"
    description: "Close a chair (blocks new bookings)"
    roles: [Pharmacist]
    code: 200
    input: []
    output: Chair
    side_effects: ["status=CLOSED; version += 1"]

  # ---------- Nurses ----------
  - method: POST
    path: "/infusion-center/nurses"
    description: "Create a nurse"
    roles: [Pharmacist]
    code: 201
    input: [full_name, "is_chemo_certified?", "max_acuity_load?"]
    output: Nurse
    side_effects: []

  - method: GET
    path: "/infusion-center/nurses"
    description: "List nurses"
    roles: [Pharmacist, Nurse, PriorAuthCoordinator]
    code: 200
    input: []
    output: "Nurse[]"
    side_effects: []

  - method: GET
    path: "/infusion-center/nurses/{id}"
    description: "Get a nurse"
    roles: [Pharmacist, Nurse, PriorAuthCoordinator]
    code: 200
    input: []
    output: Nurse
    side_effects: []

  # ---------- Prior Authorizations ----------
  - method: POST
    path: "/infusion-center/prior-authorizations"
    description: "Open a specialty-drug prior authorization request"
    roles: [PriorAuthCoordinator]
    code: 201
    input: [patient_id, drug_name, payer]
    output: PriorAuthorization
    side_effects: ["status=REQUESTED; consumed_units_mg=0"]

  - method: GET
    path: "/infusion-center/prior-authorizations"
    description: "List prior authorizations (filter by patient)"
    roles: [Pharmacist, Nurse, PriorAuthCoordinator]
    code: 200
    input: ["patient_id?"]
    output: "PriorAuthorization[]"
    side_effects: []

  - method: GET
    path: "/infusion-center/prior-authorizations/{id}"
    description: "Get a prior authorization"
    roles: [Pharmacist, Nurse, PriorAuthCoordinator]
    code: 200
    input: []
    output: PriorAuthorization
    side_effects: []

  - method: POST
    path: "/infusion-center/prior-authorizations/{id}/decide"
    description: "Approve or deny a PA"
    roles: [PriorAuthCoordinator]
    code: 200
    input: [decision, "authorized_units_mg?"]
    output: PriorAuthorization
    side_effects: ["APPROVE: set authorized_units_mg, status=APPROVED; DENY: status=DENIED"]

  # ---------- Treatment Cycles ----------
  - method: POST
    path: "/infusion-center/treatment-cycles"
    description: "Plan a treatment cycle for a patient on a protocol"
    roles: [Pharmacist]
    code: 201
    input: [patient_id, regimen_protocol_id, treatment_start_date]
    output: TreatmentCycle
    side_effects: ["status=PLANNED; current_cycle_number=1"]

  - method: GET
    path: "/infusion-center/treatment-cycles"
    description: "List treatment cycles (filter by patient or protocol)"
    roles: [Pharmacist, Nurse, PriorAuthCoordinator]
    code: 200
    input: ["patient_id?", "regimen_protocol_id?"]
    output: "TreatmentCycle[]"
    side_effects: []

  - method: GET
    path: "/infusion-center/treatment-cycles/{id}"
    description: "Get a treatment cycle"
    roles: [Pharmacist, Nurse, PriorAuthCoordinator]
    code: 200
    input: []
    output: TreatmentCycle
    side_effects: []

  - method: GET
    path: "/infusion-center/treatment-cycles/{id}/calendar"
    description: "Computed cycle-day calendar of all order set item occurrences"
    roles: [Pharmacist, Nurse, PriorAuthCoordinator]
    code: 200
    input: []
    output: "{ cycle_number: integer, order_set_item_id: string, drug_name: string, role: string, scheduled_date: string }[]"
    side_effects: []

  - method: POST
    path: "/infusion-center/treatment-cycles/{id}/activate"
    description: "Activate a planned cycle (freezes BSA/GFR snapshots)"
    roles: [Pharmacist]
    code: 200
    input: []
    output: TreatmentCycle
    side_effects: ["bsa_snapshot_m2, gfr_snapshot_ml_min frozen; status=ACTIVE; version += 1"]

  - method: POST
    path: "/infusion-center/treatment-cycles/{id}/hold"
    description: "Place an active cycle ON_HOLD (cancels its open orders+appointments)"
    roles: [Nurse, Pharmacist]
    code: 200
    input: []
    output: TreatmentCycle
    side_effects: ["status=ON_HOLD; cascade-cancel orders+appointments; version += 1"]

  - method: POST
    path: "/infusion-center/treatment-cycles/{id}/resume"
    description: "Resume an ON_HOLD cycle"
    roles: [Pharmacist]
    code: 200
    input: []
    output: TreatmentCycle
    side_effects: ["status=ACTIVE; version += 1"]

  - method: POST
    path: "/infusion-center/treatment-cycles/{id}/advance-cycle"
    description: "Advance cycle counter or complete on final cycle"
    roles: [Pharmacist]
    code: 200
    input: []
    output: TreatmentCycle
    side_effects: ["current_cycle_number += 1 OR status=COMPLETED on final cycle; version += 1"]

  - method: POST
    path: "/infusion-center/treatment-cycles/{id}/abandon"
    description: "Abandon a cycle"
    roles: [Pharmacist]
    code: 200
    input: []
    output: TreatmentCycle
    side_effects: ["status=ABANDONED; cascade-cancel non-terminal orders+appointments; version += 1"]

  # ---------- Drug Orders ----------
  - method: POST
    path: "/infusion-center/drug-orders"
    description: "Create a drug order on an active cycle (computes dose + JW waste); requires parent TreatmentCycle.status == ACTIVE (ERR_CYCLE_NOT_ACTIVE)"
    roles: [Pharmacist]
    code: 201
    input: [treatment_cycle_id, order_set_item_id, "prior_authorization_id?", "dose_reduction_pct?"]
    output: DrugOrder
    side_effects: ["ordered_dose_mg, vials_drawn, supplied_mg, waste_mg, jw_modifier computed; status=ORDERED"]

  - method: GET
    path: "/infusion-center/drug-orders"
    description: "List drug orders (filter by cycle, order set item, PA, or nurse)"
    roles: [Pharmacist, Nurse, PriorAuthCoordinator]
    code: 200
    input: ["treatment_cycle_id?", "order_set_item_id?", "prior_authorization_id?", "prepared_by_nurse_id?", "verified_by_nurse_id?"]
    output: "DrugOrder[]"
    side_effects: []

  - method: GET
    path: "/infusion-center/drug-orders/{id}"
    description: "Get a drug order"
    roles: [Pharmacist, Nurse, PriorAuthCoordinator]
    code: 200
    input: []
    output: DrugOrder
    side_effects: []

  - method: POST
    path: "/infusion-center/drug-orders/{id}/prepare"
    description: "Nurse prepares (mixes) the order"
    roles: [Nurse]
    code: 200
    input: []
    output: DrugOrder
    side_effects: ["prepared_by_nurse_id=acting nurse; status=PREPARED"]

  - method: POST
    path: "/infusion-center/drug-orders/{id}/verify"
    description: "Independent second nurse double-checks dose and verifies"
    roles: [Nurse]
    code: 200
    input: [recomputed_dose_mg]
    output: DrugOrder
    side_effects: ["verified_by_nurse_id=acting nurse; status=VERIFIED"]

  - method: POST
    path: "/infusion-center/drug-orders/{id}/reject"
    description: "Second nurse rejects preparation, sending order back to ORDERED"
    roles: [Nurse]
    code: 200
    input: []
    output: DrugOrder
    side_effects: ["prepared_by_nurse_id cleared; status=ORDERED"]

  - method: POST
    path: "/infusion-center/drug-orders/{id}/administer"
    description: "Administer a verified order (consumes prior-auth units)"
    roles: [Nurse]
    code: 200
    input: []
    output: DrugOrder
    side_effects: ["administered_dose_mg set; status=ADMINISTERED; PA consumed_units_mg += dose; PA -> EXHAUSTED if depleted"]

  - method: POST
    path: "/infusion-center/drug-orders/{id}/cancel"
    description: "Cancel a non-terminal drug order"
    roles: [Nurse, Pharmacist]
    code: 200
    input: []
    output: DrugOrder
    side_effects: ["status=CANCELLED"]

  # ---------- Infusion Appointments ----------
  - method: POST
    path: "/infusion-center/infusion-appointments"
    description: "Book a chair+nurse interval for a cycle (OCC on cycle version)"
    roles: [Pharmacist, Nurse]
    code: 201
    input: [treatment_cycle_id, chair_id, nurse_id, start_at, end_at, acuity, expected_treatment_cycle_version]
    output: InfusionAppointment
    side_effects: ["status=SCHEDULED after chair-overlap + nurse-acuity checks"]

  - method: GET
    path: "/infusion-center/infusion-appointments"
    description: "List appointments (filter by cycle, chair, or nurse)"
    roles: [Pharmacist, Nurse, PriorAuthCoordinator]
    code: 200
    input: ["treatment_cycle_id?", "chair_id?", "nurse_id?"]
    output: "InfusionAppointment[]"
    side_effects: []

  - method: GET
    path: "/infusion-center/infusion-appointments/{id}"
    description: "Get an appointment"
    roles: [Pharmacist, Nurse, PriorAuthCoordinator]
    code: 200
    input: []
    output: InfusionAppointment
    side_effects: []

  - method: POST
    path: "/infusion-center/infusion-appointments/{id}/check-in"
    description: "Check a patient in to their appointment"
    roles: [Nurse]
    code: 200
    input: []
    output: InfusionAppointment
    side_effects: ["status=CHECKED_IN"]

  - method: POST
    path: "/infusion-center/infusion-appointments/{id}/complete"
    description: "Complete an appointment"
    roles: [Nurse]
    code: 200
    input: []
    output: InfusionAppointment
    side_effects: ["status=COMPLETED"]

  - method: POST
    path: "/infusion-center/infusion-appointments/{id}/cancel"
    description: "Cancel an appointment (frees chair+nurse interval)"
    roles: [Nurse, Pharmacist]
    code: 200
    input: []
    output: InfusionAppointment
    side_effects: ["status=CANCELLED"]

  # ---------- Toxicity Events ----------
  - method: POST
    path: "/infusion-center/toxicity-events"
    description: "Record a toxicity/reaction event (grade>=3 auto-holds the cycle)"
    roles: [Nurse, Pharmacist]
    code: 201
    input: [treatment_cycle_id, "drug_order_id?", ctcae_grade, description]
    output: ToxicityEvent
    side_effects: ["triggered_hold set; if grade>=3 and cycle ACTIVE: cycle -> ON_HOLD with cascade-cancel; cycle version += 1"]

  - method: GET
    path: "/infusion-center/toxicity-events"
    description: "List toxicity events (filter by cycle or drug order)"
    roles: [Pharmacist, Nurse, PriorAuthCoordinator]
    code: 200
    input: ["treatment_cycle_id?", "drug_order_id?"]
    output: "ToxicityEvent[]"
    side_effects: []

  - method: GET
    path: "/infusion-center/toxicity-events/{id}"
    description: "Get a toxicity event"
    roles: [Pharmacist, Nurse, PriorAuthCoordinator]
    code: 200
    input: []
    output: ToxicityEvent
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog  (§1.6)
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_AUTH, http: 401, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Acting role is not permitted for this operation" }

  # --- Not found ---
  - { id: ERR_PATIENT_NOT_FOUND, http: 404, condition: "Patient id does not resolve" }
  - { id: ERR_PROTOCOL_NOT_FOUND, http: 404, condition: "RegimenProtocol id does not resolve" }
  - { id: ERR_ORDER_SET_ITEM_NOT_FOUND, http: 404, condition: "OrderSetItem id does not resolve" }
  - { id: ERR_CHAIR_NOT_FOUND, http: 404, condition: "Chair id does not resolve" }
  - { id: ERR_NURSE_NOT_FOUND, http: 404, condition: "Nurse id does not resolve" }
  - { id: ERR_PRIOR_AUTH_NOT_FOUND, http: 404, condition: "PriorAuthorization id does not resolve" }
  - { id: ERR_CYCLE_NOT_FOUND, http: 404, condition: "TreatmentCycle id does not resolve" }
  - { id: ERR_DRUG_ORDER_NOT_FOUND, http: 404, condition: "DrugOrder id does not resolve" }
  - { id: ERR_APPOINTMENT_NOT_FOUND, http: 404, condition: "InfusionAppointment id does not resolve" }
  - { id: ERR_TOXICITY_EVENT_NOT_FOUND, http: 404, condition: "ToxicityEvent id does not resolve" }

  # --- Input validation ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, bad enum, out-of-range numeric, end_at <= start_at, or dosing-method-specific dose field missing" }

  # --- Concurrency ---
  - { id: ERR_STALE_CYCLE_VERSION, http: 412, condition: "expected_treatment_cycle_version does not match current TreatmentCycle.version on appointment booking" }

  # --- Protocol / cycle state ---
  - { id: ERR_NO_ORDER_SET_ITEMS, http: 409, condition: "Publishing a protocol with no order set items" }
  - { id: ERR_NO_CHEMO_ITEM, http: 409, condition: "Publishing a protocol with no role=CHEMO order set item" }
  - { id: ERR_PROTOCOL_NOT_PUBLISHED, http: 409, condition: "Activating a cycle whose protocol is still DRAFT" }
  - { id: ERR_PATIENT_NOT_ACTIVE, http: 409, condition: "Activating a cycle for a non-ACTIVE (DECEASED) patient" }
  - { id: ERR_CYCLE_NOT_ACTIVE, http: 409, condition: "Operation requires the cycle to be ACTIVE" }
  - { id: ERR_CYCLE_NOT_ON_HOLD, http: 409, condition: "Resume requires the cycle to be ON_HOLD" }
  - { id: ERR_CYCLE_TERMINAL, http: 409, condition: "Abandon requires the cycle to be non-terminal (PLANNED/ACTIVE/ON_HOLD)" }
  - { id: ERR_UNRESOLVED_TOXICITY, http: 409, condition: "Resuming while an unresolved grade>=3 toxicity event remains open" }
  - { id: ERR_UNRESOLVED_ORDERS, http: 409, condition: "Advancing/completing a cycle while a current-cycle DrugOrder is not in {ADMINISTERED, CANCELLED}" }

  # --- Drug order state + safety ---
  - { id: ERR_ORDER_NOT_ORDERED, http: 409, condition: "prepare requires the order to be ORDERED" }
  - { id: ERR_ORDER_NOT_PREPARED, http: 409, condition: "verify/reject requires the order to be PREPARED" }
  - { id: ERR_ORDER_NOT_VERIFIED, http: 409, condition: "administer requires the order to be VERIFIED" }
  - { id: ERR_ORDER_TERMINAL, http: 409, condition: "cancel requires the order to be non-terminal (ORDERED/PREPARED/VERIFIED)" }
  - { id: ERR_NURSE_NOT_CERTIFIED, http: 403, condition: "Verifying nurse is not chemo-certified" }
  - { id: ERR_SAME_NURSE_VERIFICATION, http: 409, condition: "The verifying/rejecting nurse is the same as prepared_by_nurse_id (segregation of duties)" }
  - { id: ERR_DOSE_VERIFICATION_MISMATCH, http: 409, condition: "Submitted recomputed_dose_mg differs from stored ordered_dose_mg" }

  # --- Prior auth ---
  - { id: ERR_PA_NOT_REQUESTED, http: 409, condition: "Deciding a PA that is not in REQUESTED state" }
  - { id: ERR_PRIOR_AUTH_REQUIRED, http: 409, condition: "Specialty CHEMO order created without an APPROVED matching prior_authorization_id" }
  - { id: ERR_PRIOR_AUTH_INSUFFICIENT, http: 402, condition: "Remaining authorized units cannot cover ordered_dose_mg at administer, or PA not APPROVED" }

  # --- Scheduling / temporal ---
  - { id: ERR_CHAIR_DOUBLE_BOOKED, http: 409, condition: "Requested interval overlaps an existing SCHEDULED/CHECKED_IN appointment on the same chair" }
  - { id: ERR_NURSE_ACUITY_EXCEEDED, http: 409, condition: "Summed acuity of overlapping appointments on the nurse exceeds max_acuity_load" }
  - { id: ERR_CHAIR_CLOSED, http: 409, condition: "Booking against a CLOSED chair" }
  - { id: ERR_APPOINTMENT_NOT_SCHEDULED, http: 409, condition: "check-in requires the appointment to be SCHEDULED" }
  - { id: ERR_APPOINTMENT_NOT_CHECKED_IN, http: 409, condition: "complete requires the appointment to be CHECKED_IN" }
  - { id: ERR_APPOINTMENT_TERMINAL, http: 409, condition: "cancel requires the appointment to be non-terminal (SCHEDULED/CHECKED_IN)" }

# =============================================================================
# Table 7: RBAC Matrix  (§1.7)
# =============================================================================
roles:
  - name: Pharmacist
    description: "Oncology pharmacist: owns protocols/order sets, patients, treatment-cycle lifecycle, and drug-order creation (dose calculation + mixing/waste)"
    identity: opaque
    exclusive_operations:
      - "POST /infusion-center/patients — register patient"
      - "PATCH /infusion-center/patients/{id} — update patient anthropometrics"
      - "POST /infusion-center/patients/{id}/mark-deceased"
      - "POST /infusion-center/regimen-protocols — create protocol"
      - "POST /infusion-center/regimen-protocols/{id}/publish"
      - "POST /infusion-center/order-set-items — attach order set item"
      - "POST /infusion-center/chairs — create chair"
      - "POST /infusion-center/chairs/{id}/close"
      - "POST /infusion-center/nurses — create nurse"
      - "POST /infusion-center/treatment-cycles — plan cycle"
      - "POST /infusion-center/treatment-cycles/{id}/activate"
      - "POST /infusion-center/treatment-cycles/{id}/resume"
      - "POST /infusion-center/treatment-cycles/{id}/advance-cycle"
      - "POST /infusion-center/treatment-cycles/{id}/abandon"
      - "POST /infusion-center/drug-orders — create drug order"
    shared_operations:
      - "POST /infusion-center/treatment-cycles/{id}/hold — shared with Nurse"
      - "POST /infusion-center/drug-orders/{id}/cancel — shared with Nurse"
      - "POST /infusion-center/infusion-appointments — shared with Nurse"
      - "POST /infusion-center/infusion-appointments/{id}/cancel — shared with Nurse"
      - "POST /infusion-center/toxicity-events — shared with Nurse"
      - "All GET endpoints"

  - name: Nurse
    description: "Infusion nurse: prepares/verifies/administers drug orders (double verification with segregation of duties), runs appointment check-in/complete, records toxicity"
    identity: entity_backed:Nurse
    exclusive_operations:
      - "POST /infusion-center/drug-orders/{id}/prepare"
      - "POST /infusion-center/drug-orders/{id}/verify"
      - "POST /infusion-center/drug-orders/{id}/reject"
      - "POST /infusion-center/drug-orders/{id}/administer"
      - "POST /infusion-center/infusion-appointments/{id}/check-in"
      - "POST /infusion-center/infusion-appointments/{id}/complete"
    shared_operations:
      - "POST /infusion-center/treatment-cycles/{id}/hold — shared with Pharmacist"
      - "POST /infusion-center/drug-orders/{id}/cancel — shared with Pharmacist"
      - "POST /infusion-center/infusion-appointments — shared with Pharmacist"
      - "POST /infusion-center/infusion-appointments/{id}/cancel — shared with Pharmacist"
      - "POST /infusion-center/toxicity-events — shared with Pharmacist"
      - "All GET endpoints"

  - name: PriorAuthCoordinator
    description: "Specialty-drug prior-authorization coordinator: opens and decides prior authorizations"
    identity: opaque
    exclusive_operations:
      - "POST /infusion-center/prior-authorizations — open PA request"
      - "POST /infusion-center/prior-authorizations/{id}/decide"
    shared_operations:
      - "All GET endpoints"
