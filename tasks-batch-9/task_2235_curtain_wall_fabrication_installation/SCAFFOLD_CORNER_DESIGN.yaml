      - *id066
      - *id067
      - *id068
      - *id069
      - *id070
      - *id071
      - *id072
      - *id073
      - call: POST /installation-zones
        payload:
          package_id: ${pkg}
          floor_number: 5
          elevation_label: NORTH
          area_sqm: 412.37
          height_m: 24.0
          span_mm: 3200
          anchor_type: SLOTTED
          designed_joint_mm: 22.0
          planned_panel_count: 36
