# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3156_independent_agent_owner_operator_network_settlement
#
# Nine Difficulty Rules (§0.5 × 2 instances each = 18 instances). Every
# instance grounds in §1.1–§1.7 and is driven from empty-DB by §1.5 calls.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: provisional_vs_final_bco_net_pay
        grounds:
          - calculations.settlement_split
          - calculations.settlement_split.variants.provisional
          - calculations.settlement_split.variants.final
          - entities.Settlement.fields.net_owner_operator_pay_cents
          - entities.Settlement.fields.variant_delta_cents
          - endpoints.POST_/network/loads/{id}/settlement
        distinguishing_aspect: "Both variants use the same COMMISSIONABLE base — agent_share_cents is 23040 under both — yet on this revenue mix the two derivations of the two percentage withholdings diverge, so FINAL net_owner_operator_pay_cents is 125091 against PROVISIONAL 127231, a variant_delta_cents of -2140 driven purely by the premium withholdings."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One ACTIVE agent holding TX with commission_rate_pct 0.12 and customer_ownership_days 365; one QUALIFIED_CLEAR enrolled BCO with revenue_split_pct 0.68 and no outstanding advance; one customer account; one COMPLETED trip on 1237 actual miles for a 180000/32400/12000 load."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdministrator
            - call: "POST /network/agents"
              payload: { agent_code: "AG-TX-01", legal_name: "Gulf Coast Freight Agency", home_state: "TX", commission_rate_pct: 0.12, territory_codes: ["TX", "OK"], customer_ownership_days: 365 }
              as: NetworkAdministrator
              captures: { agent_id: $.data.id, agent_v: $.data.version }
            - call: "POST /network/agents/${agent_id}/activate"
              payload: {}
              as: NetworkAdministrator
              captures: { agent_v_act: $.data.version }
            - call: "POST /network/capacity-owners"
              payload: { owner_code: "BCO-TX-01", legal_name: "Lone Star Trucking LLC", home_terminal_city: "Amarillo", revenue_split_pct: 0.68, oa_enrolled: true, liability_insurance_deductible_cents: 250000 }
              as: NetworkAdministrator
              captures: { bco_id: $.data.id }
            - call: "POST /network/escrow-transactions"
              payload: { capacity_owner_id: "${bco_id}", transaction_type: "ESCROW_DEPOSIT", amount_cents: 250000, effective_at: "2026-09-01T00:00:00Z" }
              as: SettlementOperator
            - call: "POST /network/compliance-documents"
              payload: { capacity_owner_id: "${bco_id}", document_type: "CDL", document_number: "TX-CDL-77001", issued_at: "2026-01-05T00:00:00Z", expires_at: "2027-01-05T00:00:00Z" }
              as: SafetyReviewer
            - call: "POST /network/compliance-documents"
              payload: { capacity_owner_id: "${bco_id}", document_type: "MEDICAL_CARD", document_number: "TX-MC-77001", issued_at: "2026-02-01T00:00:00Z", expires_at: "2027-02-01T00:00:00Z" }
              as: SafetyReviewer
            - call: "POST /network/compliance-documents"
              payload: { capacity_owner_id: "${bco_id}", document_type: "MVR_REPORT", document_number: "TX-MVR-77001", issued_at: "2026-03-01T00:00:00Z", expires_at: "2027-03-01T00:00:00Z" }
              as: SafetyReviewer
            - call: "POST /network/compliance-documents"
              payload: { capacity_owner_id: "${bco_id}", document_type: "DRUG_TEST", document_number: "TX-DT-77001", issued_at: "2026-04-01T00:00:00Z", expires_at: "2027-04-01T00:00:00Z" }
              as: SafetyReviewer
            - call: "POST /network/compliance-documents"
              payload: { capacity_owner_id: "${bco_id}", document_type: "OA_ENROLLMENT", document_number: "TX-OA-77001", issued_at: "2026-05-01T00:00:00Z", expires_at: "2027-05-01T00:00:00Z" }
              as: SafetyReviewer
            - call: "POST /network/compliance-documents"
              payload: { capacity_owner_id: "${bco_id}", document_type: "LIABILITY_INSURANCE", document_number: "TX-LI-77001", issued_at: "2026-06-01T00:00:00Z", expires_at: "2027-06-01T00:00:00Z" }
              as: SafetyReviewer
            - call: "POST /network/equipment"
              payload: { capacity_owner_id: "${bco_id}", unit_number: "T-101", equipment_type: "TRACTOR", model_year: 2021, inspection_due_at: "2027-01-01T00:00:00Z" }
              as: SafetyReviewer
              captures: { eq_id: $.data.id }
            - call: "POST /network/equipment/${eq_id}/record-inspection"
              payload: { inspected_at: "2026-08-15T00:00:00Z", result: "PASS", inspector_certificate: "CERT-TX-900" }
              as: SafetyReviewer
            - call: "GET /network/capacity-owners/${bco_id}"
              payload: {}
              as: NetworkAdministrator
              captures: { bco_v_pre_qual: $.data.version }
            - call: "POST /network/capacity-owners/${bco_id}/qualify"
              payload: { expected_network_capacity_owner_version: "${bco_v_pre_qual}" }
              as: SafetyReviewer
            - call: "POST /network/customer-accounts"
              payload: { agent_id: "${agent_id}", customer_ref: "CUST-OKLAHOMA-01", shipper_name: "Red River Steel Supply", first_booked_at: "2026-09-01T00:00:00Z" }
              as: FreightAgent
              as_user_id: "${agent_id}"
              captures: { ca_id: $.data.id }
            - call: "POST /network/loads"
              payload: { agent_id: "${agent_id}", customer_ref: "CUST-OKLAHOMA-01", origin_state: "OK", destination_state: "TX", linehaul_revenue_cents: 180000, fuel_surcharge_cents: 32400, accessorial_revenue_cents: 12000, dispatched_miles: 1240 }
              as: FreightAgent
              as_user_id: "${agent_id}"
              captures: { load_id: $.data.id, load_v0: $.data.version }
            - call: "POST /network/load-offers"
              payload: { load_id: "${load_id}", capacity_owner_id: "${bco_id}", offered_pay_cents: 126000, offered_at: "2026-09-01T01:00:00Z", expected_network_load_version: "${load_v0}" }
              as: FreightAgent
              as_user_id: "${agent_id}"
              captures: { offer_id: $.data.id }
            - call: "POST /network/load-offers/${offer_id}/accept"
              payload: { accepted_at: "2026-09-01T02:00:00Z" }
              as: CapacityOwnerOperator
              as_user_id: "${bco_id}"
            - call: "POST /network/trips"
              payload: { load_id: "${load_id}", capacity_owner_id: "${bco_id}", equipment_id: "${eq_id}", departed_at: "2026-09-01T03:00:00Z", deadline_at: "2026-09-02T03:00:00Z" }
              as: CapacityOwnerOperator
              as_user_id: "${bco_id}"
              captures: { trip_id: $.data.id }
            - call: "POST /network/trips/${trip_id}/dispatch"
              payload: { dispatched_at: "2026-09-01T04:00:00Z" }
              as: CapacityOwnerOperator
              as_user_id: "${bco_id}"
            - call: "POST /network/trips/${trip_id}/complete"
              payload: { actual_miles: 1237, proof_of_delivery_code: "POD-OK-3156" }
              as: CapacityOwnerOperator
              as_user_id: "${bco_id}"
            - call: "POST /network/trips/${trip_id}/verify-pod"
              payload: { pod_verified: true }
              as: SettlementOperator
          trigger:
            - call: "POST /network/loads/${load_id}/settlement"
              payload: { settlement_method: "PROVISIONAL" }
              as: SettlementOperator
            - call: "POST /network/loads/${load_id}/settlement"
              payload: { settlement_method: "FINAL" }
              as: SettlementOperator
          assert:
            - "PROVISIONAL owner_operator_share_cents == 144432 and FINAL owner_operator_share_cents == 144432"
            - "PROVISIONAL agent_share_cents == 23040 and FINAL agent_share_cents == 23040"
            - "PROVISIONAL oa_premium_cents == 2167 and FINAL oa_premium_cents == 2880"
            - "PROVISIONAL insurance_premium_cents == 3034 and FINAL insurance_premium_cents == 4461"
            - "PROVISIONAL net_owner_operator_pay_cents == 127231"
            - "FINAL net_owner_operator_pay_cents == 125091"
            - "FINAL net_owner_operator_pay_cents != PROVISIONAL net_owner_operator_pay_cents"
            - "FINAL variant_delta_cents == -2140"

      - name: oa_premium_enrollment_variant_split
        grounds:
          - calculations.oa_premium
          - calculations.oa_premium.variants.enrolled_tiered
          - calculations.oa_premium.variants.non_enrolled
          - entities.Settlement.fields.oa_premium_cents
          - entities.CapacityOwner.fields.oa_enrolled
        distinguishing_aspect: "Two CapacityOwners with byte-identical revenue_split_pct, safety_score and settlement inputs differ only in oa_enrolled, so the enrolled clone pays oa_premium_cents == 2167 while the non-enrolled twin pays exactly 0 and posts no OA_PREMIUM_DEDUCTION ledger row."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One ACTIVE agent; one fully-inspected TRACTOR fleet row owned by an enrolled BCO that is QUALIFIED and escrow-funded, then a second BCO deep-cloned from the first with oa_enrolled flipped to false, both carrying identical settlement inputs."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdministrator
            - call: "POST /network/agents"
              payload: { agent_code: "AG-TX-11", legal_name: "Panhandle Dispatch Agency", home_state: "TX", commission_rate_pct: 0.12, territory_codes: ["TX", "OK"], customer_ownership_days: 365 }
              as: NetworkAdministrator
              captures: { agent_id: $.data.id }
            - call: "POST /network/agents/${agent_id}/activate"
              payload: {}
              as: NetworkAdministrator
            - call: "POST /network/capacity-owners"
              payload: { owner_code: "BCO-TX-11", legal_name: "Caprock Carriers LLC", home_terminal_city: "Lubbock", revenue_split_pct: 0.68, oa_enrolled: true, liability_insurance_deductible_cents: 250000 }
              as: NetworkAdministrator
              captures: { bco_id: $.data.id }
            - call: "POST /network/escrow-transactions"
              payload: { capacity_owner_id: "${bco_id}", transaction_type: "ESCROW_DEPOSIT", amount_cents: 250000, effective_at: "2026-09-01T00:00:00Z" }
              as: SettlementOperator
            - call: "POST /network/compliance-documents"
              payload: { capacity_owner_id: "${bco_id}", document_type: "CDL", document_number: "TX-CDL-77101", issued_at: "2026-01-05T00:00:00Z", expires_at: "2027-01-05T00:00:00Z" }
              as: SafetyReviewer
            - call: "POST /network/compliance-documents"
              payload: { capacity_owner_id: "${bco_id}", document_type: "MEDICAL_CARD", document_number: "TX-MC-77101", issued_at: "2026-02-01T00:00:00Z", expires_at: "2027-02-01T00:00:00Z" }
              as: SafetyReviewer
            - call: "POST /network/compliance-documents"
              payload: { capacity_owner_id: "${bco_id}", document_type: "MVR_REPORT", document_number: "TX-MVR-77101", issued_at: "2026-03-01T00:00:00Z", expires_at: "2027-03-01T00:00:00Z" }
              as: SafetyReviewer
            - call: "POST /network/compliance-documents"
              payload: { capacity_owner_id: "${bco_id}", document_type: "DRUG_TEST", document_number: "TX-DT-77101", issued_at: "2026-04-01T00:00:00Z", expires_at: "2027-04-01T00:00:00Z" }
              as: SafetyReviewer
            - call: "POST /network/compliance-documents"
              payload: { capacity_owner_id: "${bco_id}", document_type: "OA_ENROLLMENT", document_number: "TX-OA-77101", issued_at: "2026-05-01T00:00:00Z", expires_at: "2027-05-01T00:00:00Z" }
              as: SafetyReviewer
            - call: "POST /network/compliance-documents"
              payload: { capacity_owner_id: "${bco_id}", document_type: "LIABILITY_INSURANCE", document_number: "TX-LI-77101", issued_at: "2026-06-01T00:00:00Z", expires_at: "2027-06-01T00:00:00Z" }
              as: SafetyReviewer
            - call: "POST /network/equipment"
              payload: { capacity_owner_id: "${bco_id}", unit_number: "T-111", equipment_type: "TRACTOR", model_year: 2021, inspection_due_at: "2027-01-01T00:00:00Z" }
              as: SafetyReviewer
              captures: { eq_id: $.data.id }
            - call: "POST /network/equipment/${eq_id}/record-inspection"
              payload: { inspected_at: "2026-08-15T00:00:00Z", result: "PASS", inspector_certificate: "CERT-TX-901" }
              as: SafetyReviewer
            - call: "GET /network/capacity-owners/${bco_id}"
              payload: {}
              as: NetworkAdministrator
              captures: { bco_v_pre_qual: $.data.version }
            - call: "POST /network/capacity-owners/${bco_id}/qualify"
              payload: { expected_network_capacity_owner_version: "${bco_v_pre_qual}" }
              as: SafetyReviewer
          trigger:
            - call: "POST /network/capacity-owners/${bco_id}/deep-clone"
              payload: { source_capacity_owner_id: "${bco_id}" }
              as: NetworkAdministrator
              captures: { twin_id: $.data.id }
            - call: "GET /network/capacity-owners/${twin_id}"
              payload: {}
              as: NetworkAdministrator
          assert:
            - "the clone is a distinct row: CapacityOwner.${twin_id}.id != CapacityOwner.${bco_id}.id"
            - "CapacityOwner.${twin_id}.revenue_split_pct == CapacityOwner.${bco_id}.revenue_split_pct == 0.68"
            - "CapacityOwner.${twin_id}.safety_score == 100 and CapacityOwner.${bco_id}.safety_score == 100"
            - "CapacityOwner.${twin_id}.oa_enrolled is false while CapacityOwner.${bco_id}.oa_enrolled is true"
            - "on the identical 180000/32400/12000 load the enrolled BCO's oa_premium_cents is ceil(144432 * 0.0150) == 2167"
            - "the non-enrolled twin's oa_premium_cents == 0 — the safety_score tier never applies because the enrollment gate short-circuits first"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: settlement_split_evaluation_order_and_conserved_remainder
        grounds:
          - calculations.settlement_split
          - entities.Settlement.fields.settled_total_cents
          - entities.Settlement.fields.company_share_cents
          - entities.Settlement.fields.commissionable_base_cents
          - validations[priority=10]
        distinguishing_aspect: "This is mode (c): the evening-out field company_share_cents is defined as union_base minus the two shares the earlier steps already fixed, so the conserved total lands on exactly 224400 while a provider that rounds the company bucket independently drifts by a cent."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One ACTIVE agent with commission_rate_pct 0.12 and one QUALIFIED_CLEAR enrolled BCO with revenue_split_pct 0.68; the load carries a revenue mix whose two derived bases are unequal, so the ordering of the rounding steps is observable."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdministrator
            - call: "POST /network/agents"
              payload: { agent_code: "AG-TX-21", legal_name: "Brazos Freight Agency", home_state: "TX", commission_rate_pct: 0.12, territory_codes: ["TX", "OK"], customer_ownership_days: 365 }
