scaffold_corner_design:
- section: entities
  instances:
  - name: create_rights_asset_required_fields
    claim_type: creation
    grounds:
    - entities.RightsAsset
    - endpoints[POST /rights-assets]
    distinguishing_aspect: POST /rights-assets with all required fields returns 201
      with id, version=1, status=OPEN, active_package_count=0
    test_recipe:
      setup:
      - Empty DB
      setup_api_calls: []
      trigger:
      - call: POST /rights-assets
        payload:
          asset_code: PL-2026
          competition_name: Premier League
          season_label: 2026-27
          season_start_date: '2026-08-01T00:00:00Z'
          season_end_date: '2027-05-31T23:59:59Z'
          total_package_pool: 5
          guaranteed_rating_basis_points: 5000
        as: RightsManager
        captures:
          asset_id: $.data.id
      assert:
      - Response 201; RightsAsset.${asset_id}.status == OPEN
      - RightsAsset.${asset_id}.version == 1
      - RightsAsset.${asset_id}.active_package_count == 0
      - RightsAsset.${asset_id}.id is a UUID with no type prefix
  - name: create_rights_asset_missing_required_field_returns_400
    claim_type: required_fields
    grounds:
    - entities.RightsAsset
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: POST /rights-assets without guaranteed_rating_basis_points
      → 400 ERR_INVALID_REQUEST
    test_recipe:
      setup:
      - Empty DB
      setup_api_calls: []
      trigger:
      - call: POST /rights-assets
        payload:
          asset_code: X
          competition_name: X
          season_label: '2026'
          season_start_date: '2026-01-01T00:00:00Z'
          season_end_date: '2026-12-31T23:59:59Z'
          total_package_pool: 1
        as: RightsManager
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_INVALID_REQUEST
  - name: create_broadcaster_default_status_registered
    claim_type: defaults
    grounds:
    - entities.Broadcaster.fields.status
    - endpoints[POST /broadcasters]
    distinguishing_aspect: POST /broadcasters defaults status to REGISTERED
    test_recipe:
      setup:
      - Empty DB
      setup_api_calls: []
      trigger:
      - call: POST /broadcasters
        payload:
          legal_name: Test Co
          home_territory: US
          platform_classes:
          - LINEAR_TV
          credit_rating: INVESTMENT_GRADE
        as: RightsManager
        captures:
          b_id: $.data.id
      assert:
      - Broadcaster.${b_id}.status == REGISTERED (system-set default)
  - name: deal_total_contracted_fee_computed
    claim_type: computed_fields
    grounds:
    - entities.Deal.fields.total_contracted_fee_cents
    - calculations.escalated_rights_fee
    distinguishing_aspect: total_contracted_fee_cents computed from escalated_rights_fee
      over seasons at execute; client-supplied value ignored
    test_recipe:
      setup:
      - Executed Deal with base_fee=100000000, escalator 0.05, cap 200000000, term
        covers 2 seasons
      setup_api_calls:
      - call: POST /rights-assets
        payload:
          asset_code: CF1
          competition_name: CF1
          season_label: '2026'
          season_start_date: '2026-01-01T00:00:00Z'
          season_end_date: '2026-12-31T23:59:59Z'
          total_package_pool: 1
          guaranteed_rating_basis_points: 3000
        as: RightsManager
        captures:
          asset_id: $.data.id
      - call: POST /broadcasters
        payload:
          legal_name: B
          home_territory: US
          platform_classes:
          - LINEAR_TV
          credit_rating: INVESTMENT_GRADE
        as: RightsManager
        captures:
          b_id: $.data.id
      - call: POST /broadcasters/${b_id}/accredit
        payload: {}
        as: RightsManager
      - call: POST /packages
        payload:
          package_code: CF1-A
          territory_code: US
          platform_class: LINEAR_TV
          window_start: '2026-01-01T00:00:00Z'
          window_end: '2027-12-31T23:59:59Z'
          exclusivity_class: EXCLUSIVE
          minimum_bid_cents: 100000000
          games_committed: 5
          asset_id: ${asset_id}
        as: RightsManager
        captures:
          pkg_id: $.data.id
      - call: POST /rights-assets/${asset_id}/lock-packages
        payload: {}
        as: RightsManager
      - call: POST /packages/${pkg_id}/bids
        payload:
          bidder_id: ${b_id}
          offered_fee_cents: 100000000
          upfront_pct: 0.1
          escalator_rate_pct: 0.05
          minimum_growth_pct: 0.0
          fee_cap_cents: 200000000
          production_commitment_games: 5
          audience_commitment_pct: 0.5
          exclusivity_request: MATCH_PACKAGE
        as: BidCoordinator
        as_user_id: ${b_id}
        captures:
          bid_id: $.data.id
      - call: POST /packages/${pkg_id}/bids/${bid_id}/submit
        payload: {}
        as: BidCoordinator
        as_user_id: ${b_id}
      - call: POST /packages/${pkg_id}/bids/${bid_id}/start-review
        payload: {}
        as: RightsManager
      - call: POST /packages/${pkg_id}/bids/${bid_id}/shortlist
        payload: {}
        as: RightsManager
      - call: GET /packages/${pkg_id}
        as: RightsManager
        captures:
          pkg_v: $.data.version
      - call: POST /packages/${pkg_id}/bids/${bid_id}/accept
        payload:
          expected_package_version: ${pkg_v}
        as: RightsManager
        captures:
          deal_id: $.data.id
      - call: POST /deals/${deal_id}/payment-milestones
        payload:
          season_index: 1
          sequence_in_season: 1
          due_date: '2026-02-01T00:00:00Z'
          milestone_weight: 1.0
        as: FinanceController
      - call: POST /deals/${deal_id}/payment-milestones
        payload:
          season_index: 2
          sequence_in_season: 1
          due_date: '2027-02-01T00:00:00Z'
          milestone_weight: 1.0
        as: FinanceController
      - call: POST /deals/${deal_id}/production-obligations
        payload:
          season_index: 1
        as: ProductionAuditor
      - call: GET /deals/${deal_id}
        as: RightsManager
        captures:
          deal_v: $.data.version
      - call: POST /deals/${deal_id}/execute
        payload:
          expected_deal_version: ${deal_v}
          term_start: '2026-01-01T00:00:00Z'
          term_end: '2027-12-31T23:59:59Z'
        as: RightsManager
      trigger:
      - call: GET /deals/${deal_id}
        as: RightsManager
      assert:
      - Deal.${deal_id}.total_contracted_fee_cents == 205000000 (season1 100000000
        + season2 min(100000000*1.05, 200000000) = 105000000)
      - Computed field derived from escalated_rights_fee; client cannot inject
  - name: enum_invalid_value_returns_400
    claim_type: type_constraints
    grounds:
    - entities.Broadcaster.fields.credit_rating
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: POST /broadcasters with credit_rating=JUNK → 400
    test_recipe:
      setup:
      - Empty DB
      setup_api_calls: []
      trigger:
      - call: POST /broadcasters
        payload:
          legal_name: Bad
          home_territory: US
          platform_classes:
          - LINEAR_TV
          credit_rating: JUNK
        as: RightsManager
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_INVALID_REQUEST
- section: state_machines
