        claim_type: violation_to_error
        grounds: ["errors[ERR_STATE_PROGRAM_NOT_FOUND]", "errors[ERR_WHOLESALER_NOT_FOUND]", "errors[ERR_LICENSEE_USER_NOT_FOUND]", "errors[ERR_BRAND_NOT_FOUND]", "errors[ERR_PRICE_SCHEDULE_NOT_FOUND]"]
