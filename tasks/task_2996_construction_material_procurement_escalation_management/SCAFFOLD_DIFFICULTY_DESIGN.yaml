- rule_id: non_linear_state_machine
  instances:
  - name: negotiation_cycle_returns_to_proposed_and_stops_at_three_rounds
    grounds:
    - state_machines.EscalationAgreement.PROPOSED_to_COUNTERED
    - state_machines.EscalationAgreement.COUNTERED_to_PROPOSED
    - entities.EscalationAgreement.fields.round_number
    - errors[ERR_NEGOTIATION_ROUNDS_EXHAUSTED]
    distinguishing_aspect: 'CYCLE: the clause revisits PROPOSED three times through COUNTERED, incrementing round_number 1 -> 2 -> 3, and the fourth counter is refused with ERR_NEGOTIATION_ROUNDS_EXHAUSTED leaving cap_pct at 9.0 and round_number at 3 — a bounded loop, not a linear path.'
    test_recipe:
      setup:
      - A steel package with an OPEN quote from Ironworks Fabricators LLC
      - Escalation clause created with cap 8.0 / share 40.0 / deadband 2.0 and PROPOSED
      - Three responsive counters (cap 9.0, then 9.5, then 10.0) each answered by a fresh proposal (cap 8.5, then 8.8, then 9.0)
      - The clause is back at status PROPOSED with round_number 3 and cap_pct 9.0
      setup_api_calls:
      - call: POST /procurement/projects
        payload: {name: Riverside Medical Tower, contract_number: GC-2996-A, owner_name: Riverside Health System, schedule_data_date: '2026-08-01T00:00:00.000Z', escalation_contingency_budget: '500000.00'}
        as: BuyoutManager
        captures: {proj_id: $.data.id}
      - call: POST /procurement/material-packages
        payload: {project_id: '${proj_id}', scope_code: STRUCT-STEEL-01, description: Structural steel frame package, commodity_index_code: PPI_STEEL_MILL, estimated_cost: '1200000.00', required_onsite_date: '2027-03-01T00:00:00.000Z', fabrication_duration_days: 70, delivery_transit_days: 20, submittal_review_days: 21}
        as: BuyoutManager
        captures: {pkg_id: $.data.id}
      - call: POST /procurement/suppliers
        payload: {legal_name: Ironworks Fabricators LLC, country_of_origin: US, declared_tariff_rate_pct: '0.00'}
        as: BuyoutManager
        captures: {sup_id: $.data.id}
      - call: POST /procurement/quotes
        payload: {material_package_id: '${pkg_id}', supplier_id: '${sup_id}', base_price: '1150000.00', received_at: '2026-08-01T00:00:00.000Z', price_hold_days: 45}
        as: SupplierRep
        as_user_id: ${sup_id}
        captures: {q_id: $.data.id}
      - call: POST /procurement/escalation-agreements
        payload: {quote_id: '${q_id}', index_code: PPI_STEEL_MILL, baseline_index_period: 2026-07, cap_pct: '8.0', contractor_share_pct: '40.0', price_hold_through: '2026-09-15T00:00:00.000Z', deadband_pct: '2.0', proposed_terms_note: Mill index escalation with 2 pct deadband and shared band}
        as: BuyoutManager
        captures: {ea_id: $.data.id}
      - call: POST /procurement/escalation-agreements/${ea_id}/propose
        payload: {}
        as: BuyoutManager
      - call: POST /procurement/escalation-agreements/${ea_id}/counter
        payload: {cap_pct: '9.0', contractor_share_pct: '40.0', counter_note: Supplier requires a higher cap}
        as: SupplierRep
        as_user_id: ${sup_id}
      - call: POST /procurement/escalation-agreements/${ea_id}/propose
        payload: {cap_pct: '8.5', proposed_terms_note: Contractor holds near 8.5}
        as: BuyoutManager
      - call: POST /procurement/escalation-agreements/${ea_id}/counter
        payload: {cap_pct: '9.5', contractor_share_pct: '40.0', counter_note: Second supplier counter}
        as: SupplierRep
        as_user_id: ${sup_id}
      - call: POST /procurement/escalation-agreements/${ea_id}/propose
        payload: {cap_pct: '8.8', proposed_terms_note: Contractor moves to 8.8}
        as: BuyoutManager
      - call: POST /procurement/escalation-agreements/${ea_id}/counter
        payload: {cap_pct: '10.0', contractor_share_pct: '40.0', counter_note: Third and final supplier counter}
        as: SupplierRep
        as_user_id: ${sup_id}
      - call: POST /procurement/escalation-agreements/${ea_id}/propose
        payload: {cap_pct: '9.0', proposed_terms_note: Contractor's last position}
        as: BuyoutManager
      trigger:
      - call: POST /procurement/escalation-agreements/${ea_id}/counter
        payload: {cap_pct: '11.0', contractor_share_pct: '40.0', counter_note: Fourth counter attempt}
        as: SupplierRep
        as_user_id: ${sup_id}
      assert:
      - the trigger fails with error_id ERR_NEGOTIATION_ROUNDS_EXHAUSTED and HTTP 409
      - EscalationAgreement.${ea_id}.round_number == 3
      - EscalationAgreement.${ea_id}.cap_pct == 9.0
      - EscalationAgreement.${ea_id}.contractor_share_pct == 40.0
      - EscalationAgreement.${ea_id}.status == PROPOSED
      - EscalationAgreement.${ea_id}.counter_note == "Third and final supplier counter" (the rejected counter mutated nothing)
