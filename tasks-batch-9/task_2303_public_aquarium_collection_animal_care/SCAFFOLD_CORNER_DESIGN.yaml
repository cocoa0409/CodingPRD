    - §1.5 POST /aquarium/collection-plan-entries
    distinguishing_aspect: A newly created plan line is DRAFT with approved_by_user_id, approved_at, superseded_by_entry_id and suspension_reason all null — approval fields are never pre-populated by creation.
    test_recipe:
