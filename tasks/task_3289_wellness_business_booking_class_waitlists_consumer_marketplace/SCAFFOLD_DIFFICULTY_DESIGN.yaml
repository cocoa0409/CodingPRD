  - rule_id: priority_pair_validation_conflict
    instances:

      - name: suspended_studio_outranks_capacity_shortfall_on_session_create
        grounds:
          - validations.check_tier_entitlement_band
          - validations.check_capacity_band
          - errors.ERR_FEATURE_NOT_IN_TIER
          - errors.ERR_STUDIO_CAPACITY_EXCEEDED
          - endpoints.POST_/wellness/class-sessions
        distinguishing_aspect: "The conflict pairs the business_safety band against the business_constraint band, and it is resolvable only because priority 5 is evaluated first: a STARTER studio with marketplace_listing_enabled false is also SUSPENDED, and double-failing the same request must report the tier error, not the capacity error."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. A STARTER studio (marketplace_listing_enabled false, staff_payroll_enabled false) driven into SUSPENDED, with a payroll period and a capacity-1 class template on file."
