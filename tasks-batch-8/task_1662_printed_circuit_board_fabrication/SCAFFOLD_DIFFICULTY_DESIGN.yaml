            - { call: "POST /pcb/laminate-reservations", payload: { fab_order_id: "${ord}", panel_array_id: "${arr}", laminate_lot_id: "${lot}", panels_allocated: 34, expected_laminate_lot_version: "${lot_v}" }, as: ProductionPlanner }
            - { call: "POST /pcb/fab-orders/${ord}/release", payload: {}, as: ProductionPlanner }
            - { call: "POST /pcb/fab-orders/${ord}/start-production", payload: {}, as: ProductionPlanner }
            - { call: "POST /pcb/fab-orders/${ord}/coupons", payload: { spec_line_id: "${line}", panel_ref: "P01" }, as: QualityInspector, captures: { cpn: $.data.id } }
            - { call: "POST /pcb/lab-slot-bookings", payload: { coupon_id: "${cpn}", station: "MICROSECTION_A", starts_at: "2026-07-31T23:30:00Z", ends_at: "2026-08-01T00:30:00Z" }, as: QualityInspector, captures: { bk1: $.data.id } }
            - { call: "POST /pcb/coupons/${cpn}/measurements", payload: { measured_ohms: 60.0, lab_slot_booking_id: "${bk1}" }, as: QualityInspector }
          trigger:
