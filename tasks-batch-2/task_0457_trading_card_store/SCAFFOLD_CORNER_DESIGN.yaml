# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7, walking references/claim-extraction-guide.md.
# §1.8 instances already covering a corner are emitted as excluded_because: stubs.
# All names unique across §1.8 ∪ §1.9.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_customer_returns_defaults
        claim_type: Creation
        grounds:
          - entities.Customer.fields.store_credit_balance_cents
          - entities.Customer.fields.loyalty_tier
          - entities.Customer.fields.status
        distinguishing_aspect: "POST /customers with display_name+email → 201; store_credit_balance_cents=0, lifetime_spend_cents=0, loyalty_tier=BRONZE, status=ACTIVE, version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { display_name: "Fresh", email: "fresh@x.com" }
              as: StoreManager
              captures: { cid: $.data.id }
          assert:
            - "response.status == 201"
            - "Customer.${cid}.store_credit_balance_cents == 0"
            - "Customer.${cid}.loyalty_tier == BRONZE"
            - "Customer.${cid}.status == ACTIVE"
            - "Customer.${cid}.version == 1"

      - name: create_customer_missing_required_field
        claim_type: Required Fields
        grounds: ["endpoints./customers"]
        distinguishing_aspect: "POST /customers omitting email → ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { display_name: "NoEmail" }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "response.status == 400"

      - name: get_customer_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /customers/{nonexistent uuid} → ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /customers/00000000-0000-4000-8000-000000000abc"
              payload: {}
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"
            - "response.status == 404"

      - name: list_customers_pagination_envelope
        claim_type: Listing
        grounds: ["response_envelope.pagination_fields"]
        distinguishing_aspect: "GET /customers returns response_type=array with total_count and has_more in meta/data per envelope."
        test_recipe:
          setup: ["Two customers created."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { display_name: "L1", email: "l1@x.com" }
              as: StoreManager
            - call: "POST /customers"
              payload: { display_name: "L2", email: "l2@x.com" }
              as: StoreManager
          trigger:
            - call: "GET /customers"
              payload: { limit: 1, offset: 0 }
              as: StoreManager
          assert:
            - "response.response_type == array"
            - "response.data.total_count == 2"
            - "response.data.has_more == true"

      - name: inventory_computed_quantity_fields_ignore_input
        claim_type: Computed Fields
        grounds:
          - entities.InventoryItem.fields.quantity_on_hand
          - entities.InventoryItem.fields.quantity_reserved
        distinguishing_aspect: "POST /inventory-items → quantity_on_hand=0, quantity_reserved=0 regardless; computed, not client-set."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /inventory-items"
              payload: { title: "Comp Card", product_kind: "SEALED", market_price_cents: 9999 }
              as: StoreManager
              captures: { it: $.data.id }
          assert:
            - "InventoryItem.${it}.quantity_on_hand == 0"
            - "InventoryItem.${it}.quantity_reserved == 0"

      - name: inventory_invalid_enum_product_kind
        claim_type: Type Constraints
        grounds: ["entities.InventoryItem.fields.product_kind"]
        distinguishing_aspect: "POST /inventory-items with product_kind=FOIL (not in {SINGLE,SEALED}) → ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /inventory-items"
              payload: { title: "Bad", product_kind: "FOIL", market_price_cents: 100 }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "response.status == 400"

      - name: ledger_immutable_only_id_and_created_at
        claim_type: Immutability
        grounds: ["entities.StoreCreditLedger"]
        distinguishing_aspect: "StoreCreditLedger has common_fields:false → ledger rows carry id + created_at only, no version/updated_at; no update endpoint exists."
        test_recipe:
          setup: ["A customer with one MANUAL_ADJUSTMENT ledger row."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { display_name: "Led", email: "led@x.com" }
              as: StoreManager
              captures: { cust: $.data.id }
            - call: "POST /customers/${cust}/credit-adjustments"
              payload: { delta_cents: 1000 }
              as: StoreManager
              captures: { row: $.data.id }
          trigger:
            - call: "GET /customers/${cust}/ledger"
              payload: {}
              as: StoreManager
          assert:
            - "response.data[0].delta_cents == 1000"
            - "response.data[0].reason == MANUAL_ADJUSTMENT"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: buylist_double_submit_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.BuylistSubmission.DRAFT_to_SUBMITTED"]
        distinguishing_aspect: "Submitting a SUBMITTED buylist again → ERR_INVALID_STATE (409); no state change."
        test_recipe:
          setup: ["A SUBMITTED buylist with one line."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { display_name: "DS", email: "ds@x.com" }
              as: StoreManager
              captures: { cust: $.data.id }
            - call: "POST /inventory-items"
              payload: { title: "DS Card", product_kind: "SINGLE", market_price_cents: 500 }
              as: StoreManager
              captures: { item: $.data.id }
            - call: "POST /buylist-submissions"
              payload: { customer_id: "${cust}", payout_method: "CASH" }
              as: Customer
              as_user_id: "${cust}"
              captures: { sub: $.data.id }
            - call: "POST /buylist-lines"
              payload: { buylist_submission_id: "${sub}", inventory_item_id: "${item}", quantity: 1 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /buylist-submissions/${sub}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
          trigger:
            - call: "POST /buylist-submissions/${sub}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response.status == 409"

      - name: consignment_settle_from_listed_terminal_guard
        claim_type: Invalid Transitions
        grounds: ["state_machines.ConsignmentCase.SOLD_to_SETTLED"]
        distinguishing_aspect: "Settling a LISTED (not SOLD) consignment case → ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A LISTED consignment case."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { display_name: "CS", email: "cs2@x.com" }
              as: StoreManager
              captures: { cust: $.data.id }
            - call: "POST /inventory-items"
              payload: { title: "CS Card", product_kind: "SINGLE", market_price_cents: 1000 }
              as: StoreManager
              captures: { item: $.data.id }
            - call: "POST /consignment-cases"
              payload: { customer_id: "${cust}", inventory_item_id: "${item}", quantity: 1, ask_price_cents: 1000, commission_rate_bps: 1500 }
              as: Customer
              as_user_id: "${cust}"
              captures: { cc: $.data.id }
          trigger:
            - call: "POST /consignment-cases/${cc}/settle"
              payload: {}
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response.status == 409"

      - name: event_start_with_no_seated_players
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Event.OPEN_to_IN_PROGRESS", "errors[ERR_NO_SEATED_PLAYERS]"]
        distinguishing_aspect: "Starting an OPEN event with seated_count==0 → ERR_NO_SEATED_PLAYERS (409)."
        test_recipe:
          setup: ["An OPEN event with no checked-in registrations."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /events"
              payload: { title: "Empty Floor", format: "DRAFT", starts_at: "2026-06-10T00:00:00Z", ends_at: "2026-06-10T03:00:00Z", capacity: 8, entry_fee_cents: 1000, tables_required: 1 }
              as: StoreManager
              captures: { ev: $.data.id }
            - call: "POST /events/${ev}/open"
              payload: {}
              as: StoreManager
          trigger:
            - call: "POST /events/${ev}/start"
              payload: {}
              as: JudgeStaff
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NO_SEATED_PLAYERS"
            - "response.status == 409"

      - name: event_advance_round_not_complete
        claim_type: Precondition Enforcement
        grounds: ["state_machines.Event.IN_PROGRESS_to_IN_PROGRESS", "errors[ERR_ROUND_NOT_COMPLETE]"]
        distinguishing_aspect: "advance-round while a current-round pairing is still PENDING → ERR_ROUND_NOT_COMPLETE (409)."
        test_recipe:
          setup: ["IN_PROGRESS round-1 event with one unreported (PENDING) pairing."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { display_name: "AR1", email: "ar1@x.com" }
              as: StoreManager
              captures: { c1: $.data.id }
            - call: "POST /customers"
              payload: { display_name: "AR2", email: "ar2@x.com" }
              as: StoreManager
              captures: { c2: $.data.id }
            - call: "POST /customers/${c1}/credit-adjustments"
              payload: { delta_cents: 5000 }
              as: StoreManager
            - call: "POST /customers/${c2}/credit-adjustments"
              payload: { delta_cents: 5000 }
              as: StoreManager
            - call: "POST /events"
              payload: { title: "AR Cup", format: "MODERN", starts_at: "2026-07-02T00:00:00Z", ends_at: "2026-07-02T05:00:00Z", capacity: 8, entry_fee_cents: 1000, tables_required: 1 }
              as: StoreManager
              captures: { ev: $.data.id }
            - call: "POST /events/${ev}/open"
              payload: {}
              as: StoreManager
            - call: "POST /registrations"
              payload: { event_id: "${ev}", customer_id: "${c1}" }
              as: Customer
              as_user_id: "${c1}"
              captures: { r1: $.data.id }
            - call: "POST /registrations"
              payload: { event_id: "${ev}", customer_id: "${c2}" }
              as: Customer
              as_user_id: "${c2}"
              captures: { r2: $.data.id }
            - call: "POST /registrations/${r1}/pay"
              payload: {}
              as: Customer
              as_user_id: "${c1}"
            - call: "POST /registrations/${r2}/pay"
              payload: {}
              as: Customer
              as_user_id: "${c2}"
            - call: "POST /registrations/${r1}/check-in"
              payload: {}
              as: StoreManager
            - call: "POST /registrations/${r2}/check-in"
              payload: {}
              as: StoreManager
            - call: "POST /events/${ev}/start"
              payload: {}
              as: JudgeStaff
            - call: "POST /pairings"
              payload: { event_id: "${ev}", registration_a_id: "${r1}", registration_b_id: "${r2}" }
              as: JudgeStaff
          trigger:
            - call: "POST /events/${ev}/advance-round"
              payload: {}
              as: JudgeStaff
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_ROUND_NOT_COMPLETE"
            - "response.status == 409"

      - name: pairing_bye_awards_three_points
        claim_type: Side Effect Execution
        grounds: ["state_machines.Pairing.PENDING_to_BYE_A", "entities.Registration.fields.match_points"]
        distinguishing_aspect: "Reporting a BYE (registration_b_id null) → BYE_A; registration_a match_points += 3."
        test_recipe:
          setup: ["IN_PROGRESS event with one checked-in player and a bye pairing (b null)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { display_name: "Bye P1", email: "byep1@x.com" }
              as: StoreManager
              captures: { c1: $.data.id }
            - call: "POST /customers"
              payload: { display_name: "Bye P2", email: "byep2@x.com" }
              as: StoreManager
              captures: { c2: $.data.id }
            - call: "POST /customers/${c1}/credit-adjustments"
              payload: { delta_cents: 5000 }
              as: StoreManager
            - call: "POST /customers/${c2}/credit-adjustments"
              payload: { delta_cents: 5000 }
              as: StoreManager
            - call: "POST /events"
              payload: { title: "Bye Cup", format: "COMMANDER", starts_at: "2026-07-03T00:00:00Z", ends_at: "2026-07-03T05:00:00Z", capacity: 8, entry_fee_cents: 1000, tables_required: 1 }
              as: StoreManager
              captures: { ev: $.data.id }
            - call: "POST /events/${ev}/open"
              payload: {}
              as: StoreManager
            - call: "POST /registrations"
              payload: { event_id: "${ev}", customer_id: "${c1}" }
              as: Customer
              as_user_id: "${c1}"
              captures: { r1: $.data.id }
            - call: "POST /registrations"
              payload: { event_id: "${ev}", customer_id: "${c2}" }
              as: Customer
              as_user_id: "${c2}"
              captures: { r2: $.data.id }
            - call: "POST /registrations/${r1}/pay"
              payload: {}
              as: Customer
              as_user_id: "${c1}"
            - call: "POST /registrations/${r2}/pay"
              payload: {}
              as: Customer
              as_user_id: "${c2}"
            - call: "POST /registrations/${r1}/check-in"
              payload: {}
              as: StoreManager
            - call: "POST /registrations/${r2}/check-in"
              payload: {}
              as: StoreManager
            - call: "POST /events/${ev}/start"
              payload: {}
              as: JudgeStaff
            - call: "POST /pairings"
              payload: { event_id: "${ev}", registration_a_id: "${r1}" }
              as: JudgeStaff
              captures: { pr: $.data.id }
          trigger:
            - call: "POST /pairings/${pr}/report"
              payload: { result: "BYE_A" }
              as: JudgeStaff
          assert:
            - "Pairing.${pr}.result == BYE_A"
            - "Registration.${r1}.match_points == 3"

      - name: preorder_cancel_allocated_frees_pool
        claim_type: Compensation
        grounds: ["state_machines.PreOrder.ALLOCATED_to_CANCELLED", "entities.ReleaseProduct.fields.quantity_allocated"]
        distinguishing_aspect: "Cancelling an ALLOCATED pre-order returns quantity_allocated from 2 to 0 and bumps ReleaseProduct.version."
        test_recipe:
          setup: ["An ALLOCATED pre-order qty 2 on a PRE_ORDER_OPEN release (pool 10), quantity_allocated=2."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { display_name: "Canc PO", email: "cancpo@x.com" }
              as: StoreManager
              captures: { cust: $.data.id }
            - call: "POST /customers/${cust}/credit-adjustments"
              payload: { delta_cents: 5000 }
              as: StoreManager
            - call: "POST /release-products"
              payload: { title: "Cancelable Box", street_date: "2026-09-01T00:00:00Z", allocation_pool: 10, unit_price_cents: 1000, deposit_required_cents: 500 }
              as: StoreManager
              captures: { rp: $.data.id, rpv0: $.data.version }
            - call: "POST /pre-orders"
              payload: { customer_id: "${cust}", release_product_id: "${rp}", requested_quantity: 2, deposit_paid_cents: 500 }
              as: Customer
              as_user_id: "${cust}"
              captures: { po: $.data.id }
            - call: "POST /pre-orders/${po}/allocate"
              payload: { expected_release_product_version: "${rpv0}" }
              as: StoreManager
          trigger:
            - call: "POST /pre-orders/${po}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
          assert:
            - "PreOrder.${po}.status == CANCELLED"
            - "ReleaseProduct.${rp}.quantity_allocated == 0"

      - name: event_cancel_cascade_refund_depth3
        claim_type: Cross-entity
        grounds: ["state_machines.Event.OPEN_to_CANCELLED"]
        excluded_because:
          difficulty_instance: transitive_cascade / event_cancel_refund_ledger_depth3
          rationale: "The depth-3 Event-cancel → Registration-refund → ledger cascade is fully asserted by the named §1.8 instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: grading_fee_standard_tier_value
        claim_type: Correct Result
        grounds: ["calculations.grading_fee", "entities.GradingSubmission.fields.grading_fee_cents"]
        distinguishing_aspect: "Send a STANDARD declared_value 10000 submission → grading_fee_cents == 2400 (round((1500+100)*1.5))."
        test_recipe:
          setup: ["An INTAKE grading submission, service_tier STANDARD, declared_value 10000, on an inventory item with quantity_on_hand>=1."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { display_name: "GF Cust", email: "gf@x.com" }
              as: StoreManager
              captures: { cust: $.data.id }
            - call: "POST /inventory-items"
              payload: { title: "GF Card", product_kind: "SINGLE", market_price_cents: 9000 }
              as: StoreManager
              captures: { item: $.data.id }
            - call: "POST /buylist-submissions"
              payload: { customer_id: "${cust}", payout_method: "CASH" }
              as: Customer
              as_user_id: "${cust}"
              captures: { bsub: $.data.id }
            - call: "POST /buylist-lines"
              payload: { buylist_submission_id: "${bsub}", inventory_item_id: "${item}", quantity: 1 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /buylist-submissions/${bsub}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /buylist-submissions/${bsub}/accept"
              payload: {}
              as: StoreManager
            - call: "POST /grading-submissions"
              payload: { customer_id: "${cust}", inventory_item_id: "${item}", declared_value_cents: 10000, service_tier: "STANDARD" }
              as: StoreManager
              captures: { gs: $.data.id }
          trigger:
            - call: "POST /grading-submissions/${gs}/send"
              payload: {}
              as: StoreManager
              captures: { fee: $.data.grading_fee_cents }
          assert:
            - "GradingSubmission.${gs}.grading_fee_cents == 2400"

      - name: loyalty_tier_silver_threshold_inclusive
        claim_type: Constants Applied
        grounds: ["calculations.loyalty_tier", "calculations.lifetime_spend", "entities.Customer.fields.loyalty_tier"]
        distinguishing_aspect: "After paying a 50000c registration fee (lifetime_spend hits exactly 50000), loyalty_tier becomes SILVER (>= boundary inclusive)."
        test_recipe:
          setup: ["BRONZE customer granted 60000 credit; OPEN event entry_fee 50000; registration created."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /customers"
              payload: { display_name: "Tier Cust", email: "tier@x.com" }
              as: StoreManager
              captures: { cust: $.data.id }
            - call: "POST /customers/${cust}/credit-adjustments"
              payload: { delta_cents: 60000 }
              as: StoreManager
            - call: "POST /events"
              payload: { title: "Pricey Event", format: "STANDARD", starts_at: "2026-06-20T00:00:00Z", ends_at: "2026-06-20T04:00:00Z", capacity: 8, entry_fee_cents: 50000, tables_required: 1 }
              as: StoreManager
              captures: { ev: $.data.id }
            - call: "POST /events/${ev}/open"
              payload: {}
              as: StoreManager
            - call: "POST /registrations"
              payload: { event_id: "${ev}", customer_id: "${cust}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { reg: $.data.id }
          trigger:
            - call: "POST /registrations/${reg}/pay"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
          assert:
            - "Customer.${cust}.lifetime_spend_cents == 50000"
            - "Customer.${cust}.loyalty_tier == SILVER"
            - "Customer.${cust}.store_credit_balance_cents == 10000"

      - name: consignment_settle_credits_consignor
        claim_type: Correct Result
        grounds: ["calculations.consignment_payout", "state_machines.ConsignmentCase.SOLD_to_SETTLED"]
        distinguishing_aspect: "Sell+settle ask 10000, 15% commission, qty 1 → payout 8500 credited; customer store_credit_balance_cents == 8500."
        test_recipe:
          setup: ["A SOLD consignment case ask 10000 bps 1500 qty 1 on a customer with 0 credit."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { display_name: "Settle Cust", email: "settle@x.com" }
              as: StoreManager
              captures: { cust: $.data.id }
            - call: "POST /inventory-items"
              payload: { title: "Pricey Single", product_kind: "SINGLE", market_price_cents: 10000 }
              as: StoreManager
              captures: { item: $.data.id }
            - call: "POST /consignment-cases"
              payload: { customer_id: "${cust}", inventory_item_id: "${item}", quantity: 1, ask_price_cents: 10000, commission_rate_bps: 1500 }
              as: Customer
              as_user_id: "${cust}"
              captures: { cc: $.data.id }
            - call: "POST /consignment-cases/${cc}/sell"
              payload: {}
              as: StoreManager
          trigger:
            - call: "POST /consignment-cases/${cc}/settle"
              payload: {}
              as: StoreManager
          assert:
            - "ConsignmentCase.${cc}.payout_total_cents == 8500"
            - "Customer.${cust}.store_credit_balance_cents == 8500"

      - name: buylist_cash_no_ledger_row
        claim_type: Variant Selection
        grounds: ["calculations.buylist_payout.variants"]
        excluded_because:
          difficulty_instance: dual_variant_calc / buylist_store_credit_vs_cash_payout
          rationale: "The CASH variant (no ledger row, balance stays 0) is directly asserted in the named §1.8 dual-variant instance."

  # ===========================================================================
  - section: validations
    instances:
      - name: register_banned_customer_check_in_blocked
        claim_type: Cross-entity validation
        grounds: ["validations[priority=5]", "entities.Customer.fields.status"]
        distinguishing_aspect: "Checking in a registration whose Customer.status==BANNED → ERR_CUSTOMER_BANNED (409)."
        test_recipe:
          setup: ["A PAID registration whose customer was then BANNED, on an OPEN event."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /customers"
              payload: { display_name: "Ban Cust", email: "ban@x.com" }
              as: StoreManager
              captures: { cust: $.data.id }
            - call: "POST /customers/${cust}/credit-adjustments"
              payload: { delta_cents: 5000 }
              as: StoreManager
            - call: "POST /events"
              payload: { title: "Ban Event", format: "STANDARD", starts_at: "2026-06-10T00:00:00Z", ends_at: "2026-06-10T04:00:00Z", capacity: 8, entry_fee_cents: 1000, tables_required: 1 }
              as: StoreManager
