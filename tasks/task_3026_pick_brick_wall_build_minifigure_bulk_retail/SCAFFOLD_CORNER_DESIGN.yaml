  - section: validations
    instances:

      - name: missing_role_header_is_rejected_before_any_resource_is_resolved
        claim_type: Violation → Error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A call with no role header is rejected at the authentication rung even though the path id does not exist either, so the reported error is the auth error rather than the not-found error."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /stores/elements/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: Anonymous
              captures: { auth_err: $.data.error_id }
          assert:
            - "the call returns error_id == ERR_UNAUTHENTICATED"
            - "the same path read as PlatformAdmin returns error_id == ERR_NOT_FOUND instead"

      - name: wrong_role_on_a_restricted_action_is_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN]", "roles.Member.exclusive_operations"]
