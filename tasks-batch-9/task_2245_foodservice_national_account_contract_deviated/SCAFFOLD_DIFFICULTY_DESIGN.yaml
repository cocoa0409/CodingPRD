            - "Contract.${c95_id}.compliance_posture == OPEN and Contract.${c94_id}.compliance_posture == OPEN"

      - name: service_fee_waiver_threshold_inclusive_at_500000
        grounds:
          - calculations.out_of_market_service_fee
          - entities.OrderLine.fields.service_fee_cents
          - entities.OrderLine.fields.extended_price_cents
          - entities.DcCoverage.fields.service_fee_waived
          - endpoints["POST /nac/order-lines"]
        distinguishing_aspect: |
          A different metric on a different endpoint than the compliance boundary:
          OrderLine.extended_price_cents against
          FEE_WAIVER_EXTENDED_THRESHOLD_CENTS at POST /nac/order-lines, probed at
          threshold-5000 (99 cases, fee 27225), exactly at threshold (100 cases, fee
          0 because the comparison is inclusive) and threshold+5000 (101 cases, fee
          0).
