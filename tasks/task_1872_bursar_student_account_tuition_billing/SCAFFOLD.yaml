# =============================================================================
# Task 1872 — Bursar Student Account & Tuition Billing (university bursar office)
# PRD Benchmark seed tables: §1.0–§1.7
# =============================================================================

scenario: |
  1872. Bursar Student Account & Tuition Billing (university bursar office): charge
  assessment by enrollment & residency/tuition rate, third-party sponsor billing &
  payment reconciliation, payment plan enrollment & installment default, financial
  holds on registration/transcript, refund calculation on drop/withdrawal by date,
  waiver/scholarship posting order, collections & write-off process, 1098-T reporting

domain_name: bursar-student-accounts
api_prefix: /bursar

# =============================================================================
# §0 Complexity profile
# =============================================================================
complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
    - derived_field_reconciliation
  entity_topology: flat            # peer entities joined by FK references; creates carry FKs in body
  state_machine_shape: cyclic      # plan default/cure cycle, invoice dispute/reinstate cycle, account past-due/cure cycle
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential             # TaxForm1098T.corrected_from_id
  role_model: segregation_of_duties  # write-off requester != approver; manager override flavor
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Term
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Term code, unique (e.g. FALL-2026)", constraints: "unique across all terms" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: start_date, type: string, source: input, description: "ISO date YYYY-MM-DD, first day of classes" }
      - { name: end_date, type: string, source: input, description: "ISO date, last day of term; start_date < end_date" }
      - { name: census_date, type: string, source: input, description: "ISO date; enrollment snapshot + charge due_date; start_date <= census_date <= end_date" }
      - { name: full_refund_end_date, type: string, source: input, description: "ISO date; last day for 100% refund tier (inclusive)" }
      - { name: mid_refund_end_date, type: string, source: input, description: "ISO date; last day for 50% refund tier (inclusive); > full_refund_end_date" }
      - { name: withdrawal_deadline, type: string, source: input, description: "ISO date; last day for 25% tier and last allowed withdrawal (inclusive); > mid_refund_end_date, <= end_date" }
      - { name: refund_policy, type: enum, source: input, description: "SCHEDULE_TIERED | PRO_RATA — selects refund_calculation variant" }
      - { name: flat_fee_cents, type: integer, source: input, description: "Mandatory per-enrollment fee added to every assessment" }
      - { name: hold_threshold_cents, type: integer, source: input, description: "past_due_cents >= this places AUTO financial holds" }
      - { name: plan_setup_fee_cents, type: integer, source: input, description: "PLAN_FEE ledger entry posted at payment-plan creation" }
      - { name: late_fee_pct, type: number, source: input, description: "Late fee percentage per past-due installment, e.g. 0.05" }
      - { name: grace_days, type: integer, source: input, description: "Days after installment due_date before it flips to PAST_DUE" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | CENSUS_LOCKED | CLOSED", default: DRAFT }

  - name: Student
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Student legal name" }
      - { name: external_ref, type: string, source: input, description: "SIS reference, unique", constraints: "unique across all students" }
      - { name: residency_status, type: enum, source: input, description: "IN_STATE | OUT_OF_STATE | INTERNATIONAL — drives tuition rate selection" }
      - { name: level, type: enum, source: input, description: "UNDERGRADUATE | GRADUATE — drives tuition rate selection" }

  - name: TuitionRate
    parent: null
    common_fields: true
    fields:
      - { name: term_id, type: string, source: input, description: "FK -> Term.id; rate card applies to this term" }
      - { name: residency, type: enum, source: input, description: "IN_STATE | OUT_OF_STATE | INTERNATIONAL" }
      - { name: level, type: enum, source: input, description: "UNDERGRADUATE | GRADUATE" }
      - { name: per_credit_rate_cents, type: integer, source: input, description: "Per credit-hour rate below full-time threshold; > 0" }
      - { name: full_time_threshold_credits, type: integer, source: input, description: "credit_hours >= this switches to flat rate; > 0" }
      - { name: flat_rate_cents, type: integer, source: input, description: "Flat full-time tuition covering up to max_flat_credits; > 0" }
      - { name: max_flat_credits, type: integer, source: input, description: "Credits covered by flat rate; >= full_time_threshold_credits" }
      - { name: overload_rate_cents, type: integer, source: input, description: "Per-credit rate for hours above max_flat_credits; >= 0" }
      - { name: effective_from, type: string, source: input, description: "ISO date, CLOSED interval start" }
      - { name: effective_to, type: string, source: input, description: "ISO date, CLOSED interval end; >= effective_from; touching endpoints count as overlap" }

  - name: StudentAccount
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: system, description: "FK -> Student.id; one account per (student, term)" }
      - { name: term_id, type: string, source: system, description: "FK -> Term.id" }
      - { name: status, type: enum, source: system, description: "OPEN | PAST_DUE | COLLECTIONS | WRITTEN_OFF | CLOSED", default: OPEN }
      - { name: charges_total_cents, type: integer, source: computed, description: "Sum of signed CHARGE + CHARGE_REVERSAL + LATE_FEE + PLAN_FEE + COLLECTIONS_FEE ledger entries" }
      - { name: payments_total_cents, type: integer, source: computed, description: "Sum of signed PAYMENT + PAYMENT_REVERSAL entries (PAYMENT stored positive, contributes negative)" }
      - { name: waivers_total_cents, type: integer, source: computed, description: "Sum of signed WAIVER + WAIVER_REVERSAL entries" }
      - { name: sponsor_total_cents, type: integer, source: computed, description: "Sum of signed SPONSOR_CHARGE + SPONSOR_REVERSAL entries (credit family)" }
      - { name: writeoffs_total_cents, type: integer, source: computed, description: "Sum of WRITE_OFF entries (credit family)" }
      - { name: balance_cents, type: integer, source: computed, description: "charges_total - payments_total - waivers_total - sponsor_total - writeoffs_total - refund_payouts; see account_ledger_recompute" }
      - { name: past_due_cents, type: integer, source: computed, description: "Open amount on charge-family entries with due_date strictly before current date; see past_due_evaluation; accelerated to full open balance while any plan DEFAULTED" }
      - { name: writeoff_status, type: enum, source: system, description: "NONE | PENDING | APPROVED | REJECTED", default: NONE }
      - { name: writeoff_requester_id, type: string, source: system, description: "X-User-ID of write-off requester; segregation-of-duties check target", default: null }

  - name: LedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> StudentAccount.id" }
      - { name: entry_type, type: enum, source: system, description: "CHARGE | CHARGE_REVERSAL | PAYMENT | PAYMENT_REVERSAL | WAIVER | WAIVER_REVERSAL | SPONSOR_CHARGE | SPONSOR_REVERSAL | LATE_FEE | PLAN_FEE | COLLECTIONS_FEE | WRITE_OFF | REFUND_PAYOUT" }
      - { name: charge_kind, type: enum, source: system, description: "TUITION | FEE | null; set on CHARGE and CHARGE_REVERSAL entries", default: null }
      - { name: amount_cents, type: integer, source: system, description: "Positive magnitude; sign is derived from entry_type per account_ledger_recompute" }
      - { name: due_date, type: string, source: system, description: "ISO date; CHARGE/LATE_FEE/PLAN_FEE/COLLECTIONS_FEE/CHARGE_REVERSAL carry due dates (reversal copies its source charge's due_date); null for payment/waiver/sponsor/write-off/payout families", default: null }
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id; set on assessment CHARGE entries and their CHARGE_REVERSALs; null otherwise", default: null }
      - { name: source_ref, type: string, source: system, description: "Originating object id (payment_id, waiver_id, invoice_id, installment_id, refund_id) for audit; empty string for assessment charges" }
      - { name: memo, type: string, source: system, description: "Human-readable line description" }

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id" }
      - { name: term_id, type: string, source: input, description: "FK -> Term.id" }
      - { name: account_id, type: string, source: system, description: "FK -> StudentAccount.id; get-or-created at enrollment" }
      - { name: credit_hours, type: integer, source: input, description: "Enrolled credit hours; 1..24" }
      - { name: effective_date, type: string, source: input, description: "ISO date of enrollment; defaults to current clock date; must be >= term.start_date and <= term.census_date", default: "current clock date" }
      - { name: status, type: enum, source: system, description: "ENROLLED | DROPPED | WITHDRAWN", default: ENROLLED }
      - { name: exit_date, type: string, source: system, description: "ISO date of drop/withdrawal; null while ENROLLED", default: null }
      - { name: assessed_total_cents, type: integer, source: computed, description: "Original assessment total (tuition + fee) for this enrollment; refund basis anchor" }

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> StudentAccount.id" }
      - { name: amount_cents, type: integer, source: input, description: "Tendered amount; > 0; overpayment allowed (becomes credit balance)" }
      - { name: method, type: enum, source: input, description: "CARD | ACH | CASH | CHECK" }
      - { name: status, type: enum, source: system, description: "POSTED | REVERSED", default: POSTED }
      - { name: allocations, type: array, source: system, description: "Waterfall result: [{ledger_entry_id, amount_cents}] in allocation order (due_date ASC, created_at ASC)" }
      - { name: unapplied_cents, type: integer, source: computed, description: "amount_cents - sum(allocations); credit balance portion" }
      - { name: reversed_reason, type: string, source: system, description: "Reason supplied at reversal; null while POSTED", default: null }

  - name: Waiver
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> StudentAccount.id" }
      - { name: kind, type: enum, source: input, description: "WAIVER (tuition charges only) | SCHOLARSHIP (any charge kind)" }
      - { name: awarded_cents, type: integer, source: input, description: "Total award; > 0" }
      - { name: posted_cents, type: integer, source: computed, description: "Amount posted to ledger so far; <= awarded_cents" }
      - { name: allocations, type: array, source: system, description: "Posting waterfall: [{ledger_entry_id, amount_cents}] — WAIVER targets TUITION-kind only, SCHOLARSHIP targets TUITION then FEE, each oldest due_date first (created_at ASC tie-break)" }
      - { name: status, type: enum, source: system, description: "AWARDED | POSTED | REVOKED", default: AWARDED }

  - name: SponsorAgreement
    parent: null
    common_fields: true
    fields:
      - { name: sponsor_name, type: string, source: input, description: "Third-party sponsor organization name" }
      - { name: student_id, type: string, source: input, description: "FK -> Student.id" }
      - { name: term_id, type: string, source: input, description: "FK -> Term.id" }
      - { name: cap_cents, type: integer, source: input, description: "Maximum total billed to sponsor; > 0" }
      - { name: covers_tuition, type: boolean, source: input, description: "Whether TUITION-kind charges are billable" }
      - { name: covers_fees, type: boolean, source: input, description: "Whether FEE-kind charges are billable" }
      - { name: billing_basis, type: enum, source: input, description: "NET_OF_WAIVER | GROSS — selects sponsor_invoice_amount variant" }
      - { name: start_date, type: string, source: input, description: "ISO date, HALF-OPEN coverage window start (inclusive)" }
      - { name: end_date, type: string, source: input, description: "ISO date, HALF-OPEN coverage window end (exclusive); > start_date; adjacency (a.end == b.start) is NOT overlap" }
      - { name: billed_cents, type: integer, source: computed, description: "Sum of total_cents over invoices in {ISSUED, PARTIALLY_PAID, PAID, DISPUTED}; see agreement_utilization" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXHAUSTED | TERMINATED", default: ACTIVE }

  - name: SponsorInvoice
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> SponsorAgreement.id" }
      - { name: invoice_date, type: string, source: system, description: "ISO date from logical clock at creation" }
      - { name: lines, type: array, source: system, description: "Billable lines: [{ledger_entry_id, memo, amount_cents}] in charge created_at ASC order" }
      - { name: total_cents, type: integer, source: computed, description: "Sum of lines; computed by sponsor_invoice_amount" }
      - { name: paid_cents, type: integer, source: computed, description: "Sum of remittances accepted against this invoice" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | PARTIALLY_PAID | PAID | DISPUTED | VOID", default: DRAFT }
      - { name: dispute_reason, type: string, source: system, description: "Reason recorded on dispute; cleared on reinstate", default: null }

  - name: PaymentPlan
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> StudentAccount.id" }
      - { name: installment_count, type: integer, source: input, description: "Number of installments; 2..6" }
      - { name: first_due_date, type: string, source: input, description: "ISO date of installment 1; subsequent installments +30 days each" }
      - { name: principal_cents, type: integer, source: computed, description: "account.balance_cents captured at plan creation" }
      - { name: fee_cents, type: integer, source: computed, description: "term.plan_setup_fee_cents captured at creation; posted as PLAN_FEE entry" }
      - { name: total_cents, type: integer, source: computed, description: "principal_cents + fee_cents" }
      - { name: defaulted_count, type: integer, source: system, description: "Number of times this plan has entered DEFAULTED", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE | DEFAULTED | COMPLETED | CANCELLED", default: ACTIVE }

  - name: Installment
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "FK -> PaymentPlan.id" }
      - { name: sequence, type: integer, source: system, description: "1..installment_count; drives due_date = first_due_date + 30*(sequence-1) days" }
      - { name: due_date, type: string, source: system, description: "ISO date computed from plan first_due_date and sequence" }
      - { name: amount_cents, type: integer, source: computed, description: "Per installment_split: equal share except final installment absorbs rounding remainder" }
      - { name: paid_cents, type: integer, source: computed, description: "Amount paid against this installment" }
      - { name: late_fee_posted, type: boolean, source: system, description: "True once a LATE_FEE entry has been posted for this installment", default: false }
      - { name: status, type: enum, source: system, description: "SCHEDULED | PAST_DUE | PAID | CANCELLED", default: SCHEDULED }

  - name: FinancialHold
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> StudentAccount.id (manual placement supplies it in the request body)" }
      - { name: hold_type, type: enum, source: input, description: "REGISTRATION | TRANSCRIPT" }
      - { name: origin, type: enum, source: system, description: "MANUAL | AUTO (placed by hold_evaluation)", default: MANUAL }
      - { name: reason, type: string, source: input, description: "Free-text reason; AUTO placements use system reason string" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RELEASED", default: ACTIVE }
      - { name: released_reason, type: string, source: system, description: "Release reason; AUTO_CURED when released by hold_evaluation", default: null }

  - name: Refund
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> StudentAccount.id" }
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id; the dropped/withdrawn enrollment" }
      - { name: trigger, type: enum, source: system, description: "DROP | WITHDRAWAL" }
      - { name: effective_date, type: string, source: system, description: "ISO date supplied on drop/withdraw; selects refund tier / pro-rata ratio" }
      - { name: policy_variant, type: enum, source: system, description: "SCHEDULE_TIERED | PRO_RATA — copied from term.refund_policy at creation" }
      - { name: basis_cents, type: integer, source: computed, description: "Signed sum of CHARGE + CHARGE_REVERSAL entries carrying this enrollment_id at calculation time" }
      - { name: pct_applied, type: number, source: computed, description: "Refund fraction applied (1.0 | 0.5 | 0.25 | 0, or pro-rata ratio rounded to 4 decimals)" }
      - { name: amount_cents, type: integer, source: computed, description: "round_half_up(basis_cents * pct_applied) to whole cents" }
      - { name: status, type: enum, source: system, description: "CALCULATED | POSTED | VOID", default: CALCULATED }

  - name: TaxForm1098T
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id" }
      - { name: tax_year, type: integer, source: input, description: "Calendar year of the form, e.g. 2026" }
      - { name: box1_cents, type: integer, source: computed, description: "Payments received for qualified tuition: min(payments, QTRE charges) over in-scope accounts; floor 0 — see form1098t_amounts" }
      - { name: box4_cents, type: integer, source: computed, description: "Prior-year adjustments; always 0 in this version", default: 0 }
      - { name: box5_cents, type: integer, source: computed, description: "Scholarships/waivers: signed WAIVER-family sum over in-scope accounts; floor 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | FINALIZED | SUPERSEDED", default: DRAFT }
      - { name: corrected_from_id, type: string, source: system, description: "FK -> TaxForm1098T.id; set on the replacement DRAFT created by /correct; null on originals", default: null }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Term
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /bursar/terms/{id}/transition with action=OPEN"
        actor: RegistrarStaff
        preconditions:
          - "Term.status == DRAFT (ERR_TERM_STATE_INVALID)"
        side_effects: []
      - from: OPEN
        to: CENSUS_LOCKED
        trigger: "POST /bursar/terms/{id}/transition with action=LOCK_CENSUS"
        actor: RegistrarStaff
        preconditions:
          - "Term.status == OPEN (ERR_TERM_STATE_INVALID)"
          - "current clock date >= term.census_date (ERR_TERM_STATE_INVALID)"
        side_effects:
          - "Enrollment snapshot: no further create/drop allowed afterward (withdraw still allowed)"
      - from: CENSUS_LOCKED
        to: CLOSED
        trigger: "POST /bursar/terms/{id}/transition with action=CLOSE"
        actor: BursarManager
        preconditions:
          - "Term.status == CENSUS_LOCKED (ERR_TERM_STATE_INVALID)"
          - "Every StudentAccount with term_id == this term has balance_cents <= 0 or status == WRITTEN_OFF (ERR_TERM_NOT_CLOSABLE)"
        side_effects:
          - "StudentAccounts of this term with balance_cents <= 0 and status in {OPEN, PAST_DUE} -> CLOSED"
          - "SponsorAgreements of this term still ACTIVE -> TERMINATED (term ended)"

  - entity: Enrollment
    initial_state: ENROLLED
    terminal_states: [DROPPED, WITHDRAWN]
    transitions:
      - from: ENROLLED
        to: DROPPED
        trigger: "POST /bursar/enrollments/{id}/drop"
        actor: Student | RegistrarStaff
        preconditions:
          - "Enrollment.status == ENROLLED (ERR_ENROLLMENT_NOT_ACTIVE)"
          - "effective_date (default clock date) <= term.census_date (ERR_DROP_WINDOW_CLOSED)"
          - "term.status == OPEN (ERR_TERM_NOT_OPEN)"
        side_effects:
          - "exit_date = effective_date"
          - "Create Refund(trigger=DROP, status=CALCULATED) via refund_calculation"
      - from: ENROLLED
        to: WITHDRAWN
        trigger: "POST /bursar/enrollments/{id}/withdraw"
        actor: Student | RegistrarStaff
        preconditions:
          - "Enrollment.status == ENROLLED (ERR_ENROLLMENT_NOT_ACTIVE)"
          - "effective_date >= term.start_date and <= term.withdrawal_deadline (ERR_WITHDRAWAL_WINDOW_CLOSED)"
          - "term.status in {OPEN, CENSUS_LOCKED} (ERR_TERM_NOT_OPEN)"
        side_effects:
          - "exit_date = effective_date"
          - "Create Refund(trigger=WITHDRAWAL, status=CALCULATED) via refund_calculation"

  - entity: StudentAccount
    initial_state: OPEN
    terminal_states: [WRITTEN_OFF, CLOSED]
    transitions:
      - from: OPEN
        to: PAST_DUE
        trigger: "system (POST /bursar/terms/{id}/run-billing-cycle finds past_due_cents > 0)"
        actor: system
        preconditions: []
        side_effects:
          - "hold_evaluation: if past_due_cents >= term.hold_threshold_cents, create ACTIVE AUTO holds for REGISTRATION and TRANSCRIPT if not already ACTIVE"
      - from: PAST_DUE
        to: OPEN
        trigger: "system (any balance-affecting posting or billing cycle recomputes past_due_cents == 0)"
        actor: system
        preconditions: []
        side_effects:
          - "hold_evaluation: past_due_cents < threshold releases all ACTIVE AUTO holds (released_reason=AUTO_CURED); MANUAL holds unaffected"
      - from: PAST_DUE
        to: COLLECTIONS
        trigger: "POST /bursar/accounts/{id}/send-to-collections"
        actor: BursarStaff | BursarManager
        preconditions:
          - "StudentAccount.status == PAST_DUE (ERR_COLLECTIONS_STATE_INVALID)"
          - "balance_cents > 0 (ERR_NO_BALANCE_DUE)"
        side_effects:
          - "Post COLLECTIONS_FEE ledger entry per calculations.collections_fee (round_half_up(balance_cents * 0.05)), due_date = clock date"
      - from: COLLECTIONS
        to: WRITTEN_OFF
        trigger: "POST /bursar/accounts/{id}/write-off with action=APPROVE"
        actor: BursarManager
        preconditions:
          - "StudentAccount.status == COLLECTIONS and writeoff_status == PENDING (ERR_COLLECTIONS_STATE_INVALID)"
          - "approver X-User-ID != writeoff_requester_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Post WRITE_OFF ledger entry = balance_cents; balance_cents becomes 0; writeoffs_total_cents increases"
          - "writeoff_status -> APPROVED"
          - "Any ACTIVE or DEFAULTED PaymentPlan on this account -> CANCELLED; its non-PAID installments -> CANCELLED"
      - from: OPEN
        to: CLOSED
        trigger: "system (term close with balance_cents <= 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PAST_DUE
        to: CLOSED
        trigger: "system (term close with balance_cents <= 0)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Payment
    initial_state: POSTED
    terminal_states: [REVERSED]
    transitions:
      - from: POSTED
        to: REVERSED
        trigger: "POST /bursar/payments/{id}/reverse"
        actor: BursarStaff | BursarManager
        preconditions:
          - "Payment.status == POSTED (ERR_PAYMENT_STATE_INVALID)"
        side_effects:
          - "Post PAYMENT_REVERSAL ledger entry (+amount_cents) with source_ref = payment.id"
          - "allocations unwound: open amounts on the originally allocated charge-family entries are restored"
          - "account_ledger_recompute: payments_total_cents, balance_cents recalculated"
          - "past_due_evaluation: restored open amounts with due_date < clock date re-enter past_due_cents"
          - "hold_evaluation: if past_due_cents >= term.hold_threshold_cents, create ACTIVE AUTO holds (REGISTRATION + TRANSCRIPT)"

  - entity: Waiver
    initial_state: AWARDED
    terminal_states: [REVOKED]
    transitions:
      - from: AWARDED
        to: POSTED
        trigger: "POST /bursar/waivers/{id}/post"
        actor: BursarStaff | BursarManager
        preconditions:
          - "Waiver.status == AWARDED (ERR_WAIVER_STATE_INVALID)"
          - "expected_account_version matches account.version (ERR_STALE_VERSION)"
          - "Eligible open charge amount > 0 (ERR_WAIVER_NOTHING_ELIGIBLE)"
        side_effects:
          - "Waiver waterfall: allocate min(awarded_cents, eligible open) to CHARGE entries (WAIVER kind: TUITION only; SCHOLARSHIP: TUITION then FEE; due_date ASC, created_at ASC tie-break)"
          - "Post one WAIVER ledger entry (posted amount), source_ref = waiver.id; posted_cents updated; allocations recorded"
          - "account_ledger_recompute + past_due_evaluation + hold_evaluation on the account; account.version increments"
      - from: POSTED
        to: REVOKED
        trigger: "POST /bursar/waivers/{id}/revoke"
        actor: BursarStaff | BursarManager
        preconditions:
          - "Waiver.status == POSTED (ERR_WAIVER_STATE_INVALID)"
        side_effects:
          - "Post WAIVER_REVERSAL ledger entry (+posted_cents), source_ref = waiver.id"
          - "allocations unwound: open amounts restored on the affected charge entries"
          - "account_ledger_recompute + past_due_evaluation + hold_evaluation on the account"
      - from: AWARDED
        to: REVOKED
        trigger: "POST /bursar/waivers/{id}/revoke"
        actor: BursarStaff | BursarManager
        preconditions:
          - "Waiver.status == AWARDED (ERR_WAIVER_STATE_INVALID)"
        side_effects:
          - "No ledger entry (nothing posted to reverse)"

  - entity: SponsorAgreement
    initial_state: ACTIVE
    terminal_states: [EXHAUSTED, TERMINATED]
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system (after invoice issue: billed_cents == cap_cents)"
        actor: system
        preconditions: []
        side_effects:
          - "No further invoices may be created (ERR_AGREEMENT_NOT_ACTIVE)"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /bursar/sponsor-agreements/{id}/terminate"
        actor: BursarStaff | BursarManager
        preconditions:
          - "SponsorAgreement.status in {ACTIVE} (ERR_AGREEMENT_NOT_ACTIVE)"
        side_effects:
          - "DRAFT SponsorInvoices of this agreement -> VOID (they never posted SPONSOR_CHARGE, so no ledger reversal)"
          - "ISSUED/PARTIALLY_PAID/DISPUTED invoices remain collectible (unchanged)"
      - from: EXHAUSTED
        to: TERMINATED
        trigger: "POST /bursar/sponsor-agreements/{id}/terminate"
        actor: BursarStaff | BursarManager
        preconditions: []
        side_effects:
          - "DRAFT SponsorInvoices of this agreement -> VOID"

  - entity: SponsorInvoice
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /bursar/sponsor-invoices/{id}/transition with action=ISSUE"
        actor: BursarStaff | BursarManager
        preconditions:
          - "SponsorInvoice.status == DRAFT (ERR_INVOICE_STATE_INVALID)"
          - "SponsorAgreement.status == ACTIVE (ERR_AGREEMENT_NOT_ACTIVE)"
        side_effects:
          - "Post SPONSOR_CHARGE ledger entry (total_cents, credit family) on the student account, source_ref = invoice.id"
          - "agreement_utilization: agreement.billed_cents += total_cents; if billed_cents == cap_cents, agreement -> EXHAUSTED"
          - "account_ledger_recompute on the student account"
      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "POST /bursar/sponsor-invoices/{id}/payments with amount < remaining"
        actor: BursarStaff | BursarManager
        preconditions:
          - "SponsorInvoice.status in {ISSUED, PARTIALLY_PAID} (ERR_INVOICE_STATE_INVALID)"
          - "amount_cents > 0 and paid_cents + amount_cents <= total_cents (ERR_OVERPAYMENT)"
        side_effects:
          - "paid_cents += amount_cents"
      - from: PARTIALLY_PAID
        to: PARTIALLY_PAID
        trigger: "POST /bursar/sponsor-invoices/{id}/payments with amount < remaining"
        actor: BursarStaff | BursarManager
        preconditions:
          - "SponsorInvoice.status in {ISSUED, PARTIALLY_PAID} (ERR_INVOICE_STATE_INVALID)"
          - "amount_cents > 0 and paid_cents + amount_cents <= total_cents (ERR_OVERPAYMENT)"
        side_effects:
          - "paid_cents += amount_cents"
      - from: ISSUED
        to: PAID
        trigger: "POST /bursar/sponsor-invoices/{id}/payments with amount == remaining"
        actor: BursarStaff | BursarManager
        preconditions:
          - "SponsorInvoice.status in {ISSUED, PARTIALLY_PAID} (ERR_INVOICE_STATE_INVALID)"
          - "paid_cents + amount_cents == total_cents"
        side_effects:
          - "paid_cents = total_cents"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /bursar/sponsor-invoices/{id}/payments with amount == remaining"
        actor: BursarStaff | BursarManager
        preconditions:
          - "SponsorInvoice.status in {ISSUED, PARTIALLY_PAID} (ERR_INVOICE_STATE_INVALID)"
          - "paid_cents + amount_cents == total_cents"
        side_effects:
          - "paid_cents = total_cents"
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /bursar/sponsor-invoices/{id}/transition with action=DISPUTE"
        actor: BursarStaff | BursarManager
        preconditions:
          - "SponsorInvoice.status in {ISSUED, PARTIALLY_PAID} (ERR_INVOICE_STATE_INVALID)"
        side_effects:
          - "dispute_reason recorded; remittances blocked while DISPUTED"
      - from: PARTIALLY_PAID
        to: DISPUTED
        trigger: "POST /bursar/sponsor-invoices/{id}/transition with action=DISPUTE"
        actor: BursarStaff | BursarManager
        preconditions:
          - "SponsorInvoice.status in {ISSUED, PARTIALLY_PAID} (ERR_INVOICE_STATE_INVALID)"
        side_effects:
          - "dispute_reason recorded"
      - from: DISPUTED
        to: ISSUED
        trigger: "POST /bursar/sponsor-invoices/{id}/transition with action=REINSTATE"
        actor: BursarStaff | BursarManager
        preconditions:
          - "SponsorInvoice.status == DISPUTED (ERR_INVOICE_STATE_INVALID)"
        side_effects:
          - "dispute_reason cleared; if paid_cents > 0 the invoice returns to PARTIALLY_PAID instead of ISSUED"
        note: "Cycle ISSUED -> DISPUTED -> ISSUED (or PARTIALLY_PAID when partially paid before dispute)"
      - from: DRAFT
        to: VOID
        trigger: "POST /bursar/sponsor-invoices/{id}/transition with action=VOID"
        actor: BursarStaff | BursarManager
        preconditions:
          - "SponsorInvoice.status in {DRAFT, ISSUED} (ERR_INVOICE_STATE_INVALID)"
        side_effects:
          - "DRAFT: no ledger effect"
      - from: ISSUED
        to: VOID
        trigger: "POST /bursar/sponsor-invoices/{id}/transition with action=VOID"
        actor: BursarStaff | BursarManager
        preconditions:
          - "SponsorInvoice.status in {DRAFT, ISSUED} (ERR_INVOICE_STATE_INVALID)"
        side_effects:
          - "Post SPONSOR_REVERSAL ledger entry (+total_cents) on the student account, source_ref = invoice.id"
          - "agreement_utilization: agreement.billed_cents -= total_cents (EXHAUSTED agreement stays EXHAUSTED)"
          - "account_ledger_recompute on the student account"

  - entity: PaymentPlan
    initial_state: ACTIVE
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: DEFAULTED
        trigger: "system (POST /bursar/terms/{id}/run-billing-cycle marks >=1 installment PAST_DUE)"
        actor: system
        preconditions: []
        side_effects:
          - "defaulted_count += 1"
          - "Acceleration: account past_due_cents recomputed as FULL open balance (all charge-family open amounts, due dates ignored) while any plan on the account is DEFAULTED"
          - "hold_evaluation on the account (accelerated past_due normally crosses hold_threshold_cents -> AUTO holds placed)"
      - from: DEFAULTED
        to: ACTIVE
        trigger: "system (POST /bursar/installments/{id}/pay leaves zero PAST_DUE installments on the plan)"
        actor: system
        preconditions: []
        side_effects:
          - "Cure: acceleration lifted; past_due_evaluation returns to due-date-based rule"
          - "hold_evaluation re-runs; AUTO holds release if past_due_cents < threshold"
        note: "Cycle ACTIVE -> DEFAULTED -> ACTIVE may repeat; defaulted_count accumulates"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (all installments PAID)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DEFAULTED
        to: COMPLETED
        trigger: "system (all installments PAID)"
        actor: system
        preconditions: []
        side_effects:
          - "Acceleration lifted; past_due_evaluation + hold_evaluation re-run"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /bursar/payment-plans/{id}/cancel"
        actor: Student | BursarStaff | BursarManager
        preconditions:
          - "PaymentPlan.status in {ACTIVE, DEFAULTED} (ERR_PLAN_STATE_INVALID)"
        side_effects:
          - "Non-PAID installments -> CANCELLED; plan balance becomes immediately due under normal due-date rules"
          - "past_due_evaluation + hold_evaluation re-run on the account"
      - from: DEFAULTED
        to: CANCELLED
        trigger: "POST /bursar/payment-plans/{id}/cancel"
        actor: Student | BursarStaff | BursarManager
        preconditions:
          - "PaymentPlan.status in {ACTIVE, DEFAULTED} (ERR_PLAN_STATE_INVALID)"
        side_effects:
          - "Non-PAID installments -> CANCELLED; acceleration lifted"
          - "past_due_evaluation + hold_evaluation re-run"
      - from: DEFAULTED
        to: CANCELLED
        trigger: "system (superseded by creation of a replacement plan on the same account)"
        actor: system
        preconditions: []
        side_effects:
          - "Non-PAID installments -> CANCELLED; acceleration lifted before new plan principal is captured"

  - entity: Installment
    initial_state: SCHEDULED
    terminal_states: [PAID, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: PAST_DUE
        trigger: "system (run-billing-cycle: clock date > due_date + term.grace_days and paid_cents < amount_cents)"
        actor: system
        preconditions: []
        side_effects:
          - "Parent plan ACTIVE -> DEFAULTED (see PaymentPlan machine)"
          - "late_fee_assessment: post LATE_FEE entry round_half_up(amount_cents * term.late_fee_pct), due_date = installment due_date, source_ref = installment.id; late_fee_posted = true"
      - from: SCHEDULED
        to: PAID
        trigger: "POST /bursar/installments/{id}/pay"
        actor: Student | BursarStaff | BursarManager
        preconditions:
          - "Installment.status in {SCHEDULED, PAST_DUE} (ERR_INSTALLMENT_STATE_INVALID)"
          - "Parent plan status in {ACTIVE, DEFAULTED} (ERR_PLAN_STATE_INVALID)"
          - "amount_cents == amount_cents - paid_cents exactly (ERR_INSTALLMENT_AMOUNT_MISMATCH)"
        side_effects:
          - "paid_cents = amount_cents"
          - "Post PAYMENT ledger entry on the account (source_ref = installment.id); account_ledger_recompute"
          - "If plan was DEFAULTED and no PAST_DUE installments remain -> plan ACTIVE (cure); if all installments PAID -> plan COMPLETED"
      - from: PAST_DUE
        to: PAID
        trigger: "POST /bursar/installments/{id}/pay"
        actor: Student | BursarStaff | BursarManager
        preconditions:
          - "Installment.status in {SCHEDULED, PAST_DUE} (ERR_INSTALLMENT_STATE_INVALID)"
          - "Parent plan status in {ACTIVE, DEFAULTED} (ERR_PLAN_STATE_INVALID)"
          - "amount_cents == amount_cents - paid_cents exactly (ERR_INSTALLMENT_AMOUNT_MISMATCH)"
        side_effects:
          - "paid_cents = amount_cents; PAYMENT entry posted; plan cure/completion evaluated"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (parent plan CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PAST_DUE
        to: CANCELLED
        trigger: "system (parent plan CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: FinancialHold
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /bursar/holds/{id}/release OR system (hold_evaluation auto-cure)"
        actor: BursarStaff | BursarManager | system
        preconditions:
          - "FinancialHold.status == ACTIVE (ERR_HOLD_STATE_INVALID)"
        side_effects:
          - "released_reason recorded (AUTO_CURED for system releases)"

  - entity: Refund
    initial_state: CALCULATED
    terminal_states: [POSTED, VOID]
    transitions:
      - from: CALCULATED
        to: POSTED
        trigger: "POST /bursar/refunds/{id}/transition with action=APPROVE"
        actor: BursarManager
        preconditions:
          - "Refund.status == CALCULATED (ERR_REFUND_STATE_INVALID)"
        side_effects:
          - "Post CHARGE_REVERSAL ledger entry (amount_cents, charge_kind=TUITION, due_date copied from the enrollment's tuition CHARGE, enrollment_id set, source_ref = refund.id)"
          - "account_ledger_recompute; if resulting balance_cents < 0, post REFUND_PAYOUT entry of |balance_cents| so balance becomes 0 (cash disbursed to student)"
          - "past_due_evaluation + hold_evaluation re-run"
      - from: CALCULATED
        to: VOID
        trigger: "POST /bursar/refunds/{id}/transition with action=VOID"
        actor: BursarManager
        preconditions:
          - "Refund.status == CALCULATED (ERR_REFUND_STATE_INVALID)"
        side_effects:
          - "No ledger effect; enrollment exit remains in force"

  - entity: TaxForm1098T
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, FINALIZED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /bursar/tax-forms/{id}/finalize"
        actor: BursarManager
        preconditions:
          - "TaxForm1098T.status == DRAFT (ERR_TAX_FORM_STATE_INVALID)"
        side_effects: []
      - from: FINALIZED
        to: SUPERSEDED
        trigger: "POST /bursar/tax-forms/{id}/correct"
        actor: BursarManager
        preconditions:
          - "TaxForm1098T.status == FINALIZED (ERR_TAX_FORM_STATE_INVALID)"
        side_effects:
          - "Create a new DRAFT TaxForm1098T for the same student_id + tax_year with corrected_from_id = this form's id and box amounts recomputed from the ledger at correction time"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: plan-create-stale-account
    parent_entity: StudentAccount
    write_endpoint: "POST /bursar/payment-plans"
    occ_field: expected_account_version
    description: |
      Creating a PaymentPlan against a StudentAccount whose version has advanced
      since the client last observed it is rejected. This captures the case where
      another writer has just created a replacement plan (which legitimately
      supersedes a DEFAULTED plan per the PaymentPlan machine) or posted a payment
      that changed the principal basis, so the current writer's view of the account
      is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: waiver-post-stale-account
    parent_entity: StudentAccount
    write_endpoint: "POST /bursar/waivers/{id}/post"
    occ_field: expected_account_version
    description: |
      Posting a Waiver against a StudentAccount whose version has advanced since
      the client last observed it is rejected. Waiver posting is always legitimate
      business-wise while the waiver is AWARDED, so a stale expected version — not
      a state precondition — is what rejects the second, stale-view posting and
      forces the client to re-read the account first.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: tuition_assessment
    trigger: "Enrollment creation (POST /bursar/enrollments)"
    algorithm: tiered_pricing
    formula: |
      rate = the TuitionRate with term_id == enrollment.term_id,
             residency == student.residency_status, level == student.level,
             and effective_from <= enrollment.effective_date <= effective_to
             (CLOSED interval; exactly one must exist -> ERR_NO_APPLICABLE_TUITION_RATE)
      if credit_hours >= rate.full_time_threshold_credits:
          tuition = rate.flat_rate_cents
                    + max(0, credit_hours - rate.max_flat_credits) * rate.overload_rate_cents
      else:
          tuition = credit_hours * rate.per_credit_rate_cents
      fee   = term.flat_fee_cents
      total = tuition + fee
      Post TWO ledger entries: CHARGE(kind=TUITION, tuition) and CHARGE(kind=FEE, fee),
      both due_date = term.census_date, enrollment_id = enrollment.id
      enrollment.assessed_total_cents = total
    input_set: "The enrolling student, the term, the single applicable TuitionRate"
    constants: {}
    precision: "whole cents; integer arithmetic, no rounding needed"

  - name: refund_calculation
    trigger: "Enrollment drop (POST /bursar/enrollments/{id}/drop) and withdraw (POST /bursar/enrollments/{id}/withdraw); runs at Refund creation"
    algorithm: threshold
    formula: |
      basis_cents = signed sum of LedgerEntry rows with enrollment_id == this enrollment
                    and entry_type in {CHARGE, CHARGE_REVERSAL} (CHARGE +amount, CHARGE_REVERSAL -amount)
      Variant SCHEDULE_TIERED:
        if effective_date <= term.full_refund_end_date:  pct = 1.00
        elif effective_date <= term.mid_refund_end_date: pct = 0.50
        elif effective_date <= term.withdrawal_deadline: pct = 0.25
        else: pct = 0  (withdraw endpoint already rejects past the deadline)
        Boundaries are INCLUSIVE (<=): effective on the milestone date earns the higher tier.
      Variant PRO_RATA:
        days_total   = term.end_date - term.start_date in whole days
        days_elapsed = effective_date - term.start_date in whole days (>= 0)
        if days_elapsed / days_total > 0.60: pct = 0
        else: pct = round_half_up(1 - days_elapsed / days_total, 4 decimal places)
      amount_cents = round_half_up(basis_cents * pct, 0 decimal places)
    input_set: "LedgerEntries carrying this enrollment_id; the term's milestone dates and refund_policy"
    constants:
      PRO_RATA_CUTOFF: 0.60
    precision: "pct to 4 decimals round_half_up; amount to whole cents round_half_up"
    variants:
      - name: SCHEDULE_TIERED
        when: "term.refund_policy == SCHEDULE_TIERED"
        difference: "Step function of effective_date against inclusive milestone dates; identical withdrawal data yields a tiered (coarser) amount"
      - name: PRO_RATA
        when: "term.refund_policy == PRO_RATA"
        difference: "Continuous daily ratio with a 60% earned-after cutoff; yields a different amount for identical withdrawal data"

  - name: sponsor_invoice_amount
    trigger: "SponsorInvoice creation (POST /bursar/sponsor-invoices)"
    algorithm: aggregation
    formula: |
      eligible = LedgerEntry rows on the student's account for the agreement's term where
        entry_type == CHARGE
        and ((charge_kind == TUITION and agreement.covers_tuition) or (charge_kind == FEE and agreement.covers_fees))
        and the entry does not appear in any line of another SponsorInvoice of the same
            agreement whose status != VOID
      order eligible by created_at ASC
      cap_remaining = agreement.cap_cents - agreement.billed_cents
      lines = []; running = 0
      for e in eligible (created_at ASC):
          if agreement.billing_basis == GROSS:        line_amount = e.amount_cents
          if agreement.billing_basis == NET_OF_WAIVER:
              line_amount = max(0, e.amount_cents - waiver_allocated(e))
              # waiver_allocated(e) = sum of amount_cents over allocations referencing e
              # from POSTED (non-REVOKED) waivers on the same account
          if running + line_amount > cap_remaining: STOP (no skipping; later entries are not considered)
          if line_amount == 0: continue
          lines.append({ledger_entry_id: e.id, amount_cents: line_amount}); running += line_amount
      if lines is empty: reject ERR_NO_BILLABLE_CHARGES
      total_cents = running
    input_set: "Charge entries on the agreement's student+term account, per the covered-kind and not-yet-billed filters above"
    constants: {}
    precision: "whole cents"
    variants:
      - name: GROSS
        when: "agreement.billing_basis == GROSS"
        difference: "Bills full charge amounts even where waivers posted to the same charge — sponsor overbills relative to NET"
      - name: NET_OF_WAIVER
        when: "agreement.billing_basis == NET_OF_WAIVER"
        difference: "Subtracts waiver amounts allocated to each charge; identical ledger data yields a lower invoice total than GROSS"

  - name: installment_split
    trigger: "PaymentPlan creation (POST /bursar/payment-plans)"
    algorithm: waterfall_allocation
    formula: |
      principal = account.balance_cents at creation
      fee       = term.plan_setup_fee_cents
      total     = principal + fee
      N         = installment_count
      base      = round_half_up(total / N, 0)          # per-installment share, rounded FIRST
      installments 1..N-1: amount_cents = base
      installment N:       amount_cents = total - base * (N - 1)   # remainder absorbed by LAST
      due_date(k) = first_due_date + 30 * (k - 1) calendar days
      PLAN_FEE ledger entry: due_date = first_due_date, source_ref = plan.id
      PINNED ORDER: round each installment to whole cents first, then derive the final
      installment as total minus the sum of the others. (Sum-then-round is NOT used.)
    input_set: "Account balance at creation, term plan_setup_fee_cents, requested installment_count and first_due_date"
    constants: {}
    precision: "whole cents, round_half_up per installment before remainder sweep"

  - name: late_fee_assessment
    trigger: "run-billing-cycle marking an installment PAST_DUE (at most once per installment)"
    algorithm: aggregation
    formula: |
      for each installment flipping SCHEDULED -> PAST_DUE (order: plan.created_at ASC, then sequence ASC):
        fee = round_half_up(installment.amount_cents * term.late_fee_pct, 0)
        post LATE_FEE ledger entry (amount = fee, due_date = installment.due_date, source_ref = installment.id)
        installment.late_fee_posted = true
      PINNED ORDER: each installment's fee is rounded individually BEFORE summing;
      the account receives one LATE_FEE entry per installment (never one merged entry).
    input_set: "Installments flipped to PAST_DUE in this cycle with late_fee_posted == false"
    constants: {}
    precision: "whole cents, round_half_up per installment"

  - name: account_ledger_recompute
    trigger: "Any ledger entry posted to the account"
    algorithm: aggregation
    formula: |
      sign(entry_type): CHARGE +, LATE_FEE +, PLAN_FEE +, COLLECTIONS_FEE +,
        CHARGE_REVERSAL -, PAYMENT -, WAIVER -, SPONSOR_CHARGE -, WRITE_OFF -,
        PAYMENT_REVERSAL +, WAIVER_REVERSAL +, SPONSOR_REVERSAL +, REFUND_PAYOUT +
      balance_cents   = sum(sign * amount_cents over all entries)
      charges_total_cents  = signed sum over {CHARGE, CHARGE_REVERSAL, LATE_FEE, PLAN_FEE, COLLECTIONS_FEE}
      payments_total_cents = signed sum over {PAYMENT (+), PAYMENT_REVERSAL (-)}  # stored as money received
      waivers_total_cents  = signed sum over {WAIVER (+), WAIVER_REVERSAL (-)}
      sponsor_total_cents  = signed sum over {SPONSOR_CHARGE (+), SPONSOR_REVERSAL (-)}
      writeoffs_total_cents = signed sum over {WRITE_OFF}
      refund_payouts_total = signed sum over {REFUND_PAYOUT}
      EVALUATION ORDER (pinned): bucket sums are computed from the entry set first;
      balance_cents = charges_total - payments_total - waivers_total - sponsor_total
                      - writeoffs_total - refund_payouts_total  (no circular reference:
      REFUND_PAYOUT amounts are themselves fixed at posting time from the pre-payout balance)
    input_set: "All LedgerEntry rows for the account (entries are immutable; reversal is additive)"
    constants: {}
    precision: "whole cents"

  - name: past_due_evaluation
    trigger: "run-billing-cycle, and after any balance-affecting posting (payment, reversal, waiver, refund, late fee, sponsor post/void)"
    algorithm: aggregation
    formula: |
      charge_family = entries with entry_type in {CHARGE, CHARGE_REVERSAL, LATE_FEE, PLAN_FEE, COLLECTIONS_FEE}
      open_amount(e) for a CHARGE/LATE_FEE/PLAN_FEE/COLLECTIONS_FEE entry =
        e.amount_cents
        - sum(allocations referencing e from Payments with status == POSTED)
        - sum(allocations referencing e from Waivers with status == POSTED)
      signed contribution: positive entries +open_amount; CHARGE_REVERSAL entries contribute -amount_cents
      if any PaymentPlan on the account has status == DEFAULTED (acceleration):
          past_due_cents = max(0, signed sum over ALL charge_family entries)
      else:
          past_due_cents = max(0, signed sum over charge_family entries with due_date strictly before current clock date)
      status rule: past_due_cents > 0 and account OPEN -> PAST_DUE; past_due_cents == 0 and account PAST_DUE -> OPEN
    input_set: "Charge-family ledger entries of the account, POSTED payment/waiver allocations, plan statuses"
    constants: {}
    precision: "whole cents"

  - name: hold_evaluation
    trigger: "Immediately after every past_due_evaluation"
    algorithm: threshold
    formula: |
      if account.past_due_cents >= term.hold_threshold_cents:
          for hold_type in {REGISTRATION, TRANSCRIPT}:
              if no ACTIVE hold of that type exists on the account:
                  create FinancialHold(origin=AUTO, status=ACTIVE, reason="PAST_DUE_BALANCE")
      else:
          release every ACTIVE hold with origin == AUTO (released_reason=AUTO_CURED)
      BOUNDARY: the comparison is >= — past_due exactly equal to the threshold places holds.
      MANUAL holds are never auto-released.
    input_set: "account.past_due_cents, term.hold_threshold_cents, existing holds"
    constants: {}
    precision: "whole cents; inclusive >= comparison"

  - name: payment_waterfall
    trigger: "Payment creation (POST /bursar/payments)"
    algorithm: waterfall_allocation
    formula: |
      targets = charge-family entries (CHARGE, LATE_FEE, PLAN_FEE, COLLECTIONS_FEE) with open_amount > 0
      order: due_date ASC, then created_at ASC as tie-break
      remaining = payment.amount_cents
      for e in targets: alloc = min(open_amount(e), remaining); record {ledger_entry_id, amount_cents: alloc}; remaining -= alloc
      unapplied_cents = remaining (may be > 0: overpayment becomes account credit)
      Post one PAYMENT ledger entry (amount_cents, source_ref = payment.id)
    input_set: "Open charge-family entries of the account at posting time"
    constants: {}
    precision: "whole cents"

  - name: agreement_utilization
    trigger: "SponsorInvoice ISSUE and VOID transitions"
    algorithm: aggregation
    formula: |
      billed_cents = sum(total_cents) over the agreement's invoices with status in {ISSUED, PARTIALLY_PAID, PAID, DISPUTED}
      on ISSUE: if billed_cents == cap_cents, agreement -> EXHAUSTED
      on VOID of an ISSUED invoice: billed_cents decreases (EXHAUSTED status is NOT automatically reversed)
    input_set: "The agreement's invoices in non-draft receivable states"
    constants: {}
    precision: "whole cents"

  - name: form1098t_amounts
    trigger: "TaxForm1098T creation (POST /bursar/tax-forms) and correction (POST /bursar/tax-forms/{id}/correct)"
    algorithm: aggregation
    formula: |
      in-scope accounts: StudentAccount rows with student_id == form.student_id whose
        term.start_date falls within the calendar tax_year (Jan 1 .. Dec 31 inclusive)
      payments_received = signed sum of PAYMENT (+) and PAYMENT_REVERSAL (-) entries over in-scope accounts
      qtre_charges      = signed sum of CHARGE (kind=TUITION, +) and CHARGE_REVERSAL (kind=TUITION, -) over in-scope accounts
      box1_cents = max(0, min(payments_received, qtre_charges))
      box5_cents = max(0, signed sum of WAIVER (+) and WAIVER_REVERSAL (-) over in-scope accounts)
      box4_cents = 0
    input_set: "Ledger entries of the student's accounts for terms starting inside the tax year"
    constants: {}
    precision: "whole cents"

  - name: collections_fee
    trigger: "POST /bursar/accounts/{id}/send-to-collections"
    algorithm: aggregation
    formula: |
      fee = round_half_up(account.balance_cents * COLLECTIONS_FEE_PCT, 0)
      post COLLECTIONS_FEE ledger entry (amount = fee, due_date = current clock date, source_ref = account.id)
    input_set: "The account's balance at the moment of collections placement"
    constants:
      COLLECTIONS_FEE_PCT: 0.05
    precision: "whole cents, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; role is a declared role name"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Role is permitted on this endpoint per §1.5 roles; entity-backed ownership: Student callers may only touch resources whose owning account/enrollment/plan/installment/hold-list/tax-form belongs to student id == X-User-ID; SoD approval exclusivity is checked at priority 7, not here"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Path ids exist, validated left-to-right; body-supplied ids (student_id, term_id, account_id, agreement_id) exist"
    error_id: ERR_TERM_NOT_FOUND | ERR_STUDENT_NOT_FOUND | ERR_ACCOUNT_NOT_FOUND | ERR_ENROLLMENT_NOT_FOUND | ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 4
    category: state
    check: "Target entity state permits the operation: term status gates (enrollment needs OPEN; withdraw allows OPEN|CENSUS_LOCKED; transitions need exact from-state), enrollment ENROLLED for drop/withdraw, invoice/plan/installment/hold/refund/waiver/tax-form/account state preconditions per §1.2"
    error_id: "ERR_TERM_STATE_INVALID | ERR_TERM_NOT_OPEN | ERR_ENROLLMENT_NOT_ACTIVE | ERR_ACCOUNT_STATE_INVALID | ERR_PAYMENT_STATE_INVALID | ERR_WAIVER_STATE_INVALID | ERR_AGREEMENT_NOT_ACTIVE | ERR_INVOICE_STATE_INVALID | ERR_PLAN_STATE_INVALID | ERR_INSTALLMENT_STATE_INVALID | ERR_HOLD_STATE_INVALID | ERR_REFUND_STATE_INVALID | ERR_TAX_FORM_STATE_INVALID | ERR_COLLECTIONS_STATE_INVALID"
    http_status: 409
    applies_to: "all action/transition endpoints and state-gated creates"
  - priority: 5
    category: business_referential
    check: "Cross-entity reference coherence: SponsorInvoice creation requires an existing StudentAccount for the agreement's (student_id, term_id); registration-hold gate: POST /bursar/enrollments requires NO ACTIVE FinancialHold of hold_type=REGISTRATION on any account of the student"
    error_id: "ERR_NO_ACCOUNT_FOR_AGREEMENT | ERR_REGISTRATION_HOLD_ACTIVE"
    http_status: 422
    applies_to: "POST /bursar/sponsor-invoices, POST /bursar/enrollments"
  - priority: 6
    category: business_temporal
    check: "Date-window rules: drop effective_date <= census_date; withdraw start_date <= effective_date <= withdrawal_deadline; enrollment effective_date within [start_date, census_date]; SponsorInvoice creation while clock date <= agreement.term.end_date + 30 days (billing cutoff); TuitionRate effective_from <= effective_to; term date ordering on create"
    error_id: "ERR_DROP_WINDOW_CLOSED | ERR_WITHDRAWAL_WINDOW_CLOSED | ERR_BILLING_WINDOW_CLOSED | ERR_INVALID_REQUEST"
    http_status: 422
    applies_to: "drop/withdraw, enrollment create, sponsor-invoice create, rate create, term create"
  - priority: 7
    category: business_constraint
    check: "Uniqueness/overlap/SoD: Term.code unique; Student.external_ref unique; TuitionRate CLOSED effective-window overlap per (term,residency,level); SponsorAgreement HALF-OPEN coverage-window overlap per student with intersecting covered kinds; at most one ACTIVE/DEFAULTED plan per account (supersede path via OCC excepted); at most one DRAFT invoice per agreement; at most one DRAFT/FINALIZED tax form per (student, tax_year); write-off approver != requester"
    error_id: "ERR_DUPLICATE_CODE | ERR_DUPLICATE_EXTERNAL_REF | ERR_RATE_WINDOW_OVERLAP | ERR_SPONSOR_WINDOW_OVERLAP | ERR_PLAN_ALREADY_ACTIVE | ERR_DRAFT_INVOICE_EXISTS | ERR_DUPLICATE_TAX_FORM | ERR_SEGREGATION_OF_DUTIES"
    http_status: 409
    applies_to: "create endpoints and write-off approval"
  - priority: 8
    category: business_fiscal
    check: "Amount rules: credit_hours in 1..24; amount_cents > 0; installment pay amount exactly equals remaining; sponsor remittance must not exceed remaining (no overpayment); plan creation needs balance_cents > 0; waiver post needs eligible open amount > 0; sponsor invoice needs >= 1 billable line; send-to-collections needs balance > 0"
    error_id: "ERR_CREDIT_HOURS_INVALID | ERR_AMOUNT_INVALID | ERR_INSTALLMENT_AMOUNT_MISMATCH | ERR_OVERPAYMENT | ERR_NO_BALANCE_DUE | ERR_WAIVER_NOTHING_ELIGIBLE | ERR_NO_BILLABLE_CHARGES"
    http_status: 422
    applies_to: "money/credit-bearing endpoints"
  - priority: 9
    category: state
    check: "OCC: expected_account_version == account.version on OCC-guarded endpoints (checked after all business rules pass)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /bursar/payment-plans, POST /bursar/waivers/{id}/post"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/bursar/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default (before any set) is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [RegistrarStaff, BursarStaff, BursarManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["current_utc updated; no entity mutation"]

  # --- Term ---
  - method: POST
    path: "/bursar/terms"
    description: "Create a term (status DRAFT) with policy constants and refund schedule dates"
    roles: [RegistrarStaff]
    code: 201
    input: [code, name, start_date, end_date, census_date, full_refund_end_date, mid_refund_end_date, withdrawal_deadline, refund_policy, flat_fee_cents, hold_threshold_cents, plan_setup_fee_cents, late_fee_pct, grace_days]
    output: Term
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/bursar/terms/{id}"
    description: "Read a term"
    roles: [Student, RegistrarStaff, BursarStaff, BursarManager]
    code: 200
    input: []
    output: Term
    side_effects: []
  - method: POST
    path: "/bursar/terms/{id}/transition"
    description: "Term lifecycle: action OPEN (DRAFT->OPEN), LOCK_CENSUS (OPEN->CENSUS_LOCKED), CLOSE (CENSUS_LOCKED->CLOSED; BursarManager only)"
    roles: [RegistrarStaff, BursarManager]
    code: 200
    input: [action]
    output: Term
    side_effects: ["Term state machine transitions incl. account auto-close at term close"]
  - method: POST
    path: "/bursar/terms/{id}/run-billing-cycle"
    description: "Batch checkpoint: flip SCHEDULED installments past grace to PAST_DUE, default plans, post late fees, recompute past_due, place/release AUTO holds"
    roles: [BursarStaff, BursarManager]
    code: 200
    input: []
    output: { installments_marked_past_due: integer, plans_defaulted: integer, late_fees_posted: integer, holds_placed: integer, holds_released: integer }
    side_effects: ["Installment/PaymentPlan/StudentAccount/FinancialHold cascades per §1.2"]

  # --- TuitionRate ---
  - method: POST
    path: "/bursar/tuition-rates"
    description: "Create a rate card for (term, residency, level) over a CLOSED effective window"
    roles: [RegistrarStaff]
    code: 201
    input: [term_id, residency, level, per_credit_rate_cents, full_time_threshold_credits, flat_rate_cents, max_flat_credits, overload_rate_cents, effective_from, effective_to]
    output: TuitionRate
    side_effects: ["overlap check vs existing rates of same (term,residency,level)"]
  - method: GET
    path: "/bursar/terms/{id}/tuition-rates"
    description: "List rate cards of a term"
    roles: [Student, RegistrarStaff, BursarStaff, BursarManager]
    code: 200
    input: []
    output: TuitionRate[]
    side_effects: []

  # --- Student ---
  - method: POST
    path: "/bursar/students"
    description: "Register a student"
    roles: [RegistrarStaff]
    code: 201
    input: [full_name, external_ref, residency_status, level]
    output: Student
    side_effects: []
  - method: GET
    path: "/bursar/students/{id}"
    description: "Read a student (Student role restricted to own id)"
    roles: [Student, RegistrarStaff, BursarStaff, BursarManager]
    code: 200
    input: []
    output: Student
    side_effects: []
  - method: GET
    path: "/bursar/students"
    description: "Paginated student directory; optional residency_status filter"
    roles: [RegistrarStaff, BursarStaff, BursarManager]
    code: 200
    input: ["residency_status?", "limit?", "offset?"]
    output: Student[]
    side_effects: []

  # --- Enrollment ---
  - method: POST
    path: "/bursar/enrollments"
    description: "Enroll a student in a term; get-or-creates the StudentAccount and runs tuition_assessment"
    roles: [Student, RegistrarStaff]
    code: 201
    input: [student_id, term_id, credit_hours, "effective_date?"]
    output: Enrollment
    side_effects: ["get-or-create StudentAccount", "tuition_assessment posts CHARGE(TUITION)+CHARGE(FEE)", "account_ledger_recompute"]
  - method: GET
    path: "/bursar/enrollments/{id}"
    description: "Read an enrollment (Student: own only)"
    roles: [Student, RegistrarStaff, BursarStaff, BursarManager]
    code: 200
    input: []
    output: Enrollment
    side_effects: []
  - method: GET
    path: "/bursar/enrollments"
    description: "Filtered enrollment list (Student: own only)"
    roles: [Student, RegistrarStaff, BursarStaff, BursarManager]
    code: 200
    input: ["student_id?", "term_id?", "account_id?", "status?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []
  - method: POST
    path: "/bursar/enrollments/{id}/drop"
    description: "Drop before/at census; creates a CALCULATED Refund"
    roles: [Student, RegistrarStaff]
    code: 200
    input: ["effective_date?"]
    output: Enrollment
    side_effects: ["ENROLLED->DROPPED", "refund_calculation creates Refund(trigger=DROP)"]
  - method: POST
    path: "/bursar/enrollments/{id}/withdraw"
    description: "Withdraw through the withdrawal deadline; creates a CALCULATED Refund"
    roles: [Student, RegistrarStaff]
    code: 200
    input: [effective_date]
    output: Enrollment
    side_effects: ["ENROLLED->WITHDRAWN", "refund_calculation creates Refund(trigger=WITHDRAWAL)"]

  # --- StudentAccount ---
  - method: GET
    path: "/bursar/accounts/{id}"
    description: "Read an account with computed bucket totals (Student: own only)"
    roles: [Student, RegistrarStaff, BursarStaff, BursarManager]
    code: 200
    input: []
    output: StudentAccount
    side_effects: []
  - method: GET
    path: "/bursar/students/{id}/accounts"
    description: "List a student's accounts (Student: own id only)"
    roles: [Student, RegistrarStaff, BursarStaff, BursarManager]
    code: 200
    input: []
    output: StudentAccount[]
    side_effects: []
  - method: GET
    path: "/bursar/terms/{id}/accounts"
    description: "List accounts in a term"
    roles: [RegistrarStaff, BursarStaff, BursarManager]
    code: 200
    input: []
    output: StudentAccount[]
    side_effects: []
  - method: GET
    path: "/bursar/accounts/{id}/ledger"
    description: "Append-only ledger of the account (Student: own only)"
    roles: [Student, RegistrarStaff, BursarStaff, BursarManager]
    code: 200
    input: ["limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []
  - method: GET
    path: "/bursar/enrollments/{id}/ledger"
    description: "Ledger entries carrying this enrollment_id (assessment charges and their reversals)"
    roles: [Student, RegistrarStaff, BursarStaff, BursarManager]
    code: 200
    input: []
    output: LedgerEntry[]
    side_effects: []
  - method: POST
    path: "/bursar/accounts/{id}/send-to-collections"
    description: "PAST_DUE -> COLLECTIONS; posts COLLECTIONS_FEE entry"
    roles: [BursarStaff, BursarManager]
    code: 200
    input: []
    output: StudentAccount
    side_effects: ["COLLECTIONS_FEE entry", "status=COLLECTIONS"]
  - method: POST
    path: "/bursar/accounts/{id}/write-off"
    description: "Write-off workflow: action REQUEST (staff/manager, sets writeoff_status=PENDING), APPROVE or REJECT (manager; approver must differ from requester)"
    roles: [BursarStaff, BursarManager]
    code: 200
    input: [action, "reason?"]
    output: StudentAccount
    side_effects: ["REQUEST: writeoff_status=PENDING; APPROVE: WRITE_OFF entry, status=WRITTEN_OFF, plans cancelled; REJECT: writeoff_status=REJECTED"]

  # --- Payment ---
  - method: POST
    path: "/bursar/payments"
    description: "Post a student payment; waterfall-allocates to open charges; overpayment becomes credit"
    roles: [Student, BursarStaff, BursarManager]
    code: 201
    input: [account_id, amount_cents, method]
    output: Payment
    side_effects: ["PAYMENT entry", "payment_waterfall allocations", "account_ledger_recompute + past_due_evaluation + hold_evaluation"]
  - method: GET
    path: "/bursar/payments/{id}"
    description: "Read a payment (Student: own account only)"
    roles: [Student, RegistrarStaff, BursarStaff, BursarManager]
    code: 200
    input: []
    output: Payment
    side_effects: []
  - method: GET
    path: "/bursar/accounts/{id}/payments"
    description: "List payments on an account (Student: own only)"
    roles: [Student, RegistrarStaff, BursarStaff, BursarManager]
    code: 200
    input: ["limit?", "offset?"]
    output: Payment[]
    side_effects: []
  - method: POST
    path: "/bursar/payments/{id}/reverse"
    description: "Reverse a POSTED payment (NSF); unwinds allocations and re-ages debt"
    roles: [BursarStaff, BursarManager]
    code: 200
    input: [reason]
    output: Payment
    side_effects: ["PAYMENT_REVERSAL entry", "allocations unwound", "recompute + past_due + hold_evaluation"]

  # --- Waiver ---
  - method: POST
    path: "/bursar/waivers"
    description: "Award a waiver/scholarship against an account (status AWARDED; nothing posted yet)"
    roles: [BursarStaff, BursarManager]
    code: 201
    input: [account_id, kind, awarded_cents]
    output: Waiver
    side_effects: ["status=AWARDED"]
  - method: POST
    path: "/bursar/waivers/{id}/post"
    description: "Post an AWARDED waiver to the ledger (OCC-guarded on the account)"
    roles: [BursarStaff, BursarManager]
    code: 200
    input: [expected_account_version]
    output: Waiver
    side_effects: ["WAIVER entry + allocations", "recompute + past_due + hold_evaluation", "increments StudentAccount.version by 1"]
  - method: POST
    path: "/bursar/waivers/{id}/revoke"
    description: "Revoke a waiver; posted portion is reversed"
    roles: [BursarStaff, BursarManager]
    code: 200
    input: []
    output: Waiver
    side_effects: ["WAIVER_REVERSAL entry when posted_cents > 0", "allocations unwound", "recompute + past_due + hold_evaluation"]
  - method: GET
    path: "/bursar/accounts/{id}/waivers"
    description: "List waivers on an account (Student: own only)"
    roles: [Student, RegistrarStaff, BursarStaff, BursarManager]
    code: 200
    input: ["limit?", "offset?"]
    output: Waiver[]
    side_effects: []

  # --- SponsorAgreement ---
  - method: POST
    path: "/bursar/sponsor-agreements"
    description: "Create a third-party sponsor agreement (HALF-OPEN coverage window, per-student overlap check)"
    roles: [BursarStaff, BursarManager]
    code: 201
    input: [sponsor_name, student_id, term_id, cap_cents, covers_tuition, covers_fees, billing_basis, start_date, end_date]
    output: SponsorAgreement
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/bursar/sponsor-agreements/{id}"
    description: "Read a sponsor agreement"
    roles: [RegistrarStaff, BursarStaff, BursarManager]
    code: 200
    input: []
    output: SponsorAgreement
    side_effects: []
  - method: GET
    path: "/bursar/sponsor-agreements"
    description: "Filtered agreement list"
    roles: [RegistrarStaff, BursarStaff, BursarManager]
    code: 200
    input: ["student_id?", "term_id?", "status?", "limit?", "offset?"]
    output: SponsorAgreement[]
    side_effects: []
  - method: POST
    path: "/bursar/sponsor-agreements/{id}/terminate"
    description: "Terminate an agreement; DRAFT invoices void, receivable invoices survive"
    roles: [BursarStaff, BursarManager]
    code: 200
    input: []
    output: SponsorAgreement
    side_effects: ["status=TERMINATED", "DRAFT invoices -> VOID"]

  # --- SponsorInvoice ---
  - method: POST
    path: "/bursar/sponsor-invoices"
    description: "Generate a DRAFT sponsor invoice from eligible unbilled charges per sponsor_invoice_amount"
    roles: [BursarStaff, BursarManager]
    code: 201
    input: [agreement_id]
    output: SponsorInvoice
    side_effects: ["sponsor_invoice_amount computes lines + total_cents"]
  - method: GET
    path: "/bursar/sponsor-invoices/{id}"
    description: "Read a sponsor invoice"
    roles: [RegistrarStaff, BursarStaff, BursarManager]
    code: 200
    input: []
    output: SponsorInvoice
    side_effects: []
  - method: GET
    path: "/bursar/sponsor-agreements/{id}/invoices"
    description: "List invoices of an agreement"
    roles: [RegistrarStaff, BursarStaff, BursarManager]
    code: 200
    input: ["limit?", "offset?"]
    output: SponsorInvoice[]
    side_effects: []
  - method: POST
    path: "/bursar/sponsor-invoices/{id}/transition"
    description: "Invoice lifecycle: action ISSUE | DISPUTE | REINSTATE | VOID"
    roles: [BursarStaff, BursarManager]
    code: 200
    input: [action, "dispute_reason?"]
    output: SponsorInvoice
    side_effects: ["ISSUE posts SPONSOR_CHARGE + utilization; VOID of ISSUED posts SPONSOR_REVERSAL; see §1.2 SponsorInvoice"]
  - method: POST
    path: "/bursar/sponsor-invoices/{id}/payments"
    description: "Record a sponsor remittance; overpayment rejected"
    roles: [BursarStaff, BursarManager]
    code: 200
    input: [amount_cents]
    output: SponsorInvoice
    side_effects: ["paid_cents += amount_cents; PAID at full coverage"]

  # --- PaymentPlan / Installment ---
  - method: POST
    path: "/bursar/payment-plans"
    description: "Enroll an account in an installment plan (OCC-guarded); supersedes a DEFAULTED plan"
    roles: [Student, BursarStaff, BursarManager]
    code: 201
    input: [account_id, installment_count, first_due_date, expected_account_version]
    output: PaymentPlan
    side_effects: ["installment_split creates Installments", "PLAN_FEE entry", "prior DEFAULTED plan superseded -> CANCELLED", "increments StudentAccount.version by 1"]
  - method: GET
    path: "/bursar/payment-plans/{id}"
