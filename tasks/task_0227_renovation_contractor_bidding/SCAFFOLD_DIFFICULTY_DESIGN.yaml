          - entities.Milestone.fields.sequence
        distinguishing_aspect: |
          Interval semantics = discrete-ordinal point uniqueness: two milestones on
          the same project cannot occupy the same sequence ordinal (a zero-width
          slot). Resource = Project's milestone schedule. Distinct geometry from the
          adjacency/sequential gating rule below.
