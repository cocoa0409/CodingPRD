      - name: takeout_approval_flips_enrollment_and_releases_carrier_load
        grounds:
          - state_machines.AssignedRiskTakeOut.PENDING_to_APPROVED
          - state_machines.AssignedRiskEnrollment.ACTIVE_to_EXITED
        distinguishing_aspect: |
          AssignedRiskTakeOut PENDING -> APPROVED is guarded by and mutates
          AssignedRiskEnrollment state (must be ACTIVE; flips to EXITED) and
          Carrier load — a different entity pair (TakeOut -> Enrollment ->
          Carrier) than the sheet/report pair.
        test_recipe:
          setup:
            - "Bureau defaults; employer C; carrier1 quota 10,000,000; enrollment ACTIVE with 500,000 premium; carrier2 voluntary."
