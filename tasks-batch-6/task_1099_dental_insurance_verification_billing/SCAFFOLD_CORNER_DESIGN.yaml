  # ---------------------------------------------------------------------------
  # Corners already exercised by §1.8 difficulty instances -> stubs.
  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: error_coverage_overlap_stub
        claim_type: Temporal validation
        grounds: ["errors[ERR_COVERAGE_OVERLAP]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / coverage_closed_interval_adjacency_overlaps
          rationale: "Closed-interval coverage overlap is the asserted failure path of that §1.8 instance."
      - name: error_membership_overlap_stub
        claim_type: Temporal validation
        grounds: ["errors[ERR_MEMBERSHIP_OVERLAP]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / membership_half_open_interval_adjacency_allowed
          rationale: "Half-open membership overlap is asserted there."
      - name: error_verification_expired_stub
        claim_type: Temporal validation
        grounds: ["errors[ERR_VERIFICATION_EXPIRED]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / verification_expired_beats_frequency_limit
          rationale: "Expired verification is the winning error in that conflict instance."
      - name: error_frequency_limit_stub
        claim_type: Aggregate validation
        grounds: ["errors[ERR_FREQUENCY_LIMIT_EXCEEDED]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / frequency_limit_exact_boundary_on_claim_submit
          rationale: "Frequency limit boundary is asserted there."
      - name: error_coverage_inactive_stub
        claim_type: Cross-entity validation
        grounds: ["errors[ERR_COVERAGE_INACTIVE]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / coverage_inactive_beats_annual_maximum
          rationale: "Inactive coverage is the winning error there."
      - name: error_annual_maximum_stub
        claim_type: Aggregate validation
        grounds: ["errors[ERR_ANNUAL_MAXIMUM_EXCEEDED]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / coverage_inactive_beats_annual_maximum
          rationale: "Annual-maximum exhaustion is the losing member of that conflict pair (remaining_max<=0)."
      - name: error_verification_required_stub
        claim_type: Cross-entity validation
        grounds: ["errors[ERR_VERIFICATION_REQUIRED]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / claim_submit_depends_on_coverage_verification
          rationale: "Missing-verification rejection is asserted there."
      - name: error_primary_not_adjudicated_stub
        claim_type: Cross-entity validation
        grounds: ["errors[ERR_PRIMARY_CLAIM_NOT_ADJUDICATED]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / secondary_claim_depends_on_primary_adjudicated
          rationale: "Primary-not-adjudicated rejection is asserted there."
