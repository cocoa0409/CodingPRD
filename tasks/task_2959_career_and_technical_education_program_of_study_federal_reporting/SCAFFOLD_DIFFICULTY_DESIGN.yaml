  - rule_id: transitive_cascade
    instances:

      - name: close_reporting_year_cascades_miss_count_to_program_suspension_and_expenditure_block
        grounds:
          - state_machines.PerformanceIndicator.AGREED_to_NOT_MET
          - state_machines.PerformanceIndicator.NOT_MET_to_NOT_MET
          - state_machines.PerformanceIndicator.NOT_MET_to_IMPROVEMENT_REQUIRED
          - state_machines.ProgramOfStudy.STATE_APPROVED_to_SUSPENDED
          - state_machines.Expenditure.REQUESTED_to_BLOCKED
          - calculations.performance_indicator_actual
          - entities.PerformanceIndicator.fields.consecutive_miss_count
        distinguishing_aspect: |
          This instance is the DOWNWARD four-link chain fired by a single close-reporting-year call:
          link 1 raises consecutive_miss_count to 2, link 2 moves the indicator NOT_MET -> IMPROVEMENT_REQUIRED,
          link 3 suspends the parent ProgramOfStudy, and link 4 blocks every REQUESTED Expenditure on that program —
          the Expenditure at depth 4 shares no foreign key with the PerformanceIndicator that started the chain.
        test_recipe:
          setup:
            - "Logical clock at its startup default 2026-08-01T00:00:00Z."
            - "One ProgramOfStudy in approval_status STATE_APPROVED with clna_phase CERTIFIED."
