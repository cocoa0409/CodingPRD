# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task: Certification Examination, Recertification & State Licensure Linkage
# Sections follow references/claim-extraction-guide.md. Corners already
# exercised by §1.8 are emitted as excluded_because stubs at the end.
# Standard EMT level constants used throughout: cut 0.66; CE 40/20/10/10;
# hourly 40; remedial 20; refresher 24; fees 9800/4500.
# Standard passing CAT vector: 8 items, difficulty_b 0.5, all correct
# (band exit PASS at k=6, theta_final 1.0).
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: level_definition_create_persists_fields
        claim_type: creation
        grounds: [entities.LevelDefinition]
        distinguishing_aspect: "Creating a LevelDefinition returns 201 with every input field persisted under a server-minted id."
        test_recipe:
          setup: ["empty DB; clock at default 2026-09-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /registry/level-definitions"
              payload: { code: "EMT", display_name: "Emergency Medical Technician", scope_summary: "BLS ambulance practice", cognitive_cut_score: 0.66, ce_total_hours: 40, ce_national_min_hours: 20, ce_local_min_hours: 10, ce_individual_min_hours: 10, hourly_model_total_hours: 40, remedial_hours_required: 20, refresher_hours_required: 24, initial_application_fee_cents: 9800, recert_application_fee_cents: 4500 }
              as: RegistryAdmin
              captures: { lv: $.data.id, cut: $.data.cognitive_cut_score, created: $.data.created_at }
          assert:
            - "201; response carries code == EMT, cognitive_cut_score == 0.66, ce_national_min_hours == 20, refresher_hours_required == 24"
            - "id is a typeless UUID (no prefix) and created_at == 2026-09-01T00:00:00Z (default logical clock)"

      - name: level_definition_duplicate_code_conflict
        claim_type: type_constraints
        grounds:
          - "entities.LevelDefinition.fields.code"
          - "errors[ERR_DUPLICATE_LEVEL_CODE]"
        distinguishing_aspect: "Level codes are unique: a second definition with code EMT is rejected."
        test_recipe:
          setup: ["one EMT level exists"]
          setup_api_calls:
            - call: "POST /registry/level-definitions"
              payload: { code: "EMT", display_name: "Emergency Medical Technician", scope_summary: "BLS", cognitive_cut_score: 0.66, ce_total_hours: 40, ce_national_min_hours: 20, ce_local_min_hours: 10, ce_individual_min_hours: 10, hourly_model_total_hours: 40, remedial_hours_required: 20, refresher_hours_required: 24, initial_application_fee_cents: 9800, recert_application_fee_cents: 4500 }
              as: RegistryAdmin
          trigger:
            - call: "POST /registry/level-definitions"
              payload: { code: "EMT", display_name: "Duplicate", scope_summary: "dup", cognitive_cut_score: 0.5, ce_total_hours: 40, ce_national_min_hours: 20, ce_local_min_hours: 10, ce_individual_min_hours: 10, hourly_model_total_hours: 40, remedial_hours_required: 20, refresher_hours_required: 24, initial_application_fee_cents: 9800, recert_application_fee_cents: 4500 }
              as: RegistryAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_LEVEL_CODE (409)"

      - name: state_policy_defaults_applied
        claim_type: defaults
        grounds: [entities.StateAdoptionPolicy.fields.jurisprudence_exam_required, entities.StateAdoptionPolicy.fields.registry_share_bps]
        distinguishing_aspect: "Omitting optional policy fields applies the declared defaults (jurisprudence false, share 1500 bps, fee lines 0)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /registry/state-adoption-policies"
              payload: { state_code: "OR", adoption_mode: "NREMT_ACCEPTED", accepted_level_codes: ["EMT"], base_license_fee_cents: 12000 }
              as: RegistryAdmin
              captures: { jur: $.data.jurisprudence_exam_required, bps: $.data.registry_share_bps, sur: $.data.national_verification_surcharge_cents }
          assert:
            - "jurisprudence_exam_required == false (default)"
            - "registry_share_bps == 1500 (default)"
            - "national_verification_surcharge_cents == 0 (default)"

      - name: candidate_registration_mints_system_fields
        claim_type: system_fields
        grounds: [entities.Candidate, endpoints.POST_/registry/candidates]
        distinguishing_aspect: "Self-registration works without headers; system fields (UUID id, version 1, REGISTERED, disciplinary_hold false) are server-minted."
        test_recipe:
          setup: ["empty DB; default clock"]
          setup_api_calls: []
          trigger:
            - call: "POST /registry/candidates"
              payload: { full_name: "Nina New", email: "nina@example.com" }
              as: Anonymous
              captures: { c: $.data.id, ver: $.data.version, st: $.data.status, hold: $.data.disciplinary_hold, created: $.data.created_at }
          assert:
            - "201; id is a typeless UUID; version == 1; status == REGISTERED; disciplinary_hold == false"
            - "created_at == 2026-09-01T00:00:00Z (default clock, no set_current_utc call in this instance)"

      - name: get_unknown_candidate_returns_404
        claim_type: not_found
        grounds:
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "Reading a well-formed but nonexistent candidate id returns the 404 error envelope."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /registry/candidates/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: RegistryAdmin
              captures: { err: $.data.error_id }
          assert:
            - "404; error_id == ERR_NOT_FOUND; error envelope carries meta.api_request_id, response_type == error, data.error_id, data.message"

      - name: candidate_missing_email_fails
        claim_type: required_fields
        grounds:
          - "entities.Candidate.fields.email"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "A registration missing the required email field is rejected before any persistence."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /registry/candidates"
              payload: { full_name: "No Email" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "400; error_id == ERR_INVALID_REQUEST"

      - name: level_code_outside_enum_fails
        claim_type: type_constraints
        grounds:
          - "entities.LevelDefinition.fields.code"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "A code outside EMR|EMT|AEMT|PARAMEDIC is a request-shape error."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /registry/level-definitions"
              payload: { code: "SUPEREMT", display_name: "Bogus", scope_summary: "x", cognitive_cut_score: 0.5, ce_total_hours: 40, ce_national_min_hours: 20, ce_local_min_hours: 10, ce_individual_min_hours: 10, hourly_model_total_hours: 40, remedial_hours_required: 20, refresher_hours_required: 24, initial_application_fee_cents: 9800, recert_application_fee_cents: 4500 }
              as: RegistryAdmin
              captures: { err: $.data.error_id }
          assert:
            - "400; error_id == ERR_INVALID_REQUEST"

      - name: ce_entry_half_hour_increment_enforced
        claim_type: type_constraints
        grounds:
          - "entities.CECreditEntry.fields.hours"
          - "errors[ERR_CE_HOURS_INCREMENT]"
          - "validations[priority=3.5]"
        distinguishing_aspect: "CE hours must be a positive multiple of 0.5: 1.3 is rejected, 1.5 is accepted."
        test_recipe:
          setup:
            - "ACTIVE EMT cert (issued 2026-09-04, expires 2028-09-04); clock 2027-10-15 (inside recert window); NCCP draft open"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RegistryAdmin }
            - call: "POST /registry/level-definitions"
              payload: { code: "EMT", display_name: "Emergency Medical Technician", scope_summary: "BLS", cognitive_cut_score: 0.66, ce_total_hours: 40, ce_national_min_hours: 20, ce_local_min_hours: 10, ce_individual_min_hours: 10, hourly_model_total_hours: 40, remedial_hours_required: 20, refresher_hours_required: 24, initial_application_fee_cents: 9800, recert_application_fee_cents: 4500 }
              as: RegistryAdmin
              captures: { lv: $.data.id }
            - call: "POST /registry/candidates"
              payload: { full_name: "Hal Hour", email: "hal@example.com" }
              as: Anonymous
              captures: { c: $.data.id }
            - call: "POST /registry/education-programs"
              payload: { name: "County EMT Academy", level_id: "${lv}", director_user_id: "dir-1" }
              as: RegistryAdmin
              captures: { p: $.data.id }
            - call: "POST /registry/program-completion-records"
              payload: { candidate_id: "${c}", program_id: "${p}", completion_date: "2026-09-01" }
              as: ProgramDirector
              as_user_id: "dir-1"
              captures: { rec: $.data.id }
            - { call: "POST /registry/program-completion-records/${rec}/decision", payload: { outcome: "VERIFIED" }, as: RegistryAdmin }
            - call: "POST /registry/exam-applications"
              payload: { level_id: "${lv}", completion_record_id: "${rec}" }
              as: Candidate
              as_user_id: "${c}"
              captures: { app: $.data.id }
            - call: "POST /registry/exam-applications/${app}/decision"
              payload: { outcome: "APPROVED" }
              as: RegistryAdmin
              captures: { att: $.data.att_id }
            - call: "POST /registry/cognitive-exam-attempts"
              payload: { att_id: "${att}", scheduled_start: "2026-09-02T00:00:00Z", scheduled_end: "2026-09-06T00:00:00Z" }
              as: Candidate
              as_user_id: "${c}"
              captures: { at: $.data.id }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-03T12:00:00Z" }, as: RegistryAdmin }
            - call: "POST /registry/cognitive-exam-attempts/${at}/responses"
              payload: { responses: [ { item_id: "h1", difficulty_b: 0.5, correct: true }, { item_id: "h2", difficulty_b: 0.5, correct: true }, { item_id: "h3", difficulty_b: 0.5, correct: true }, { item_id: "h4", difficulty_b: 0.5, correct: true }, { item_id: "h5", difficulty_b: 0.5, correct: true }, { item_id: "h6", difficulty_b: 0.5, correct: true }, { item_id: "h7", difficulty_b: 0.5, correct: true }, { item_id: "h8", difficulty_b: 0.5, correct: true } ] }
              as: ExamProctor
            - call: "POST /registry/psychomotor-verifications"
              payload: { candidate_id: "${c}", level_id: "${lv}", administered_by: "STATE", completion_record_id: "${rec}", exam_date: "2026-09-03", stations: [ { station_code: "AIRWAY", passed: true } ], documentation_attached: true }
              as: StateOfficial
              as_user_id: "so-1"
              captures: { psy: $.data.id }
            - { call: "POST /registry/psychomotor-verifications/${psy}/decision", payload: { outcome: "VERIFIED" }, as: RegistryAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-04T00:00:00Z" }, as: RegistryAdmin }
            - call: "POST /registry/certifications/issue"
              payload: { candidate_id: "${c}", level_id: "${lv}", exam_application_id: "${app}", attempt_id: "${at}", psychomotor_id: "${psy}" }
              as: RegistryAdmin
              captures: { cert: $.data.id, cv: $.data.version }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-10-15T00:00:00Z" }, as: RegistryAdmin }
            - call: "POST /registry/recert-applications"
              payload: { certification_id: "${cert}", model: "NCCP", expected_certification_version: "${cv}" }
              as: Candidate
              as_user_id: "${c}"
              captures: { rc: $.data.id }
          trigger:
            - call: "POST /registry/recert-applications/${rc}/ce-entries"
              payload: { component: "NATIONAL", hours: 1.3, delivery_method: "IN_PERSON", course_code: "BAD", course_date: "2027-10-01", provider_name: "AlphaCE" }
              as: Candidate
              as_user_id: "${c}"
              captures: { err: $.data.error_id }
            - call: "POST /registry/recert-applications/${rc}/ce-entries"
              payload: { component: "NATIONAL", hours: 1.5, delivery_method: "IN_PERSON", course_code: "GOOD", course_date: "2027-10-01", provider_name: "AlphaCE" }
              as: Candidate
              as_user_id: "${c}"
              captures: { ok_id: $.data.id }
          assert:
            - "hours 1.3 -> 400 ERR_CE_HOURS_INCREMENT"
            - "hours 1.5 -> 201; entry status == RECORDED"

      - name: state_exam_record_passed_boundary
        claim_type: computed_fields
        grounds: [entities.StateExamRecord.fields.passed]
        distinguishing_aspect: "passed is computed as score >= passing_score: 70.0 vs 70 passes (inclusive), 69.5 fails."
        test_recipe:
          setup: ["EMT level; one candidate; TX STATE_EXAM policy not required for record creation"]
          setup_api_calls:
            - call: "POST /registry/level-definitions"
              payload: { code: "EMT", display_name: "Emergency Medical Technician", scope_summary: "BLS", cognitive_cut_score: 0.66, ce_total_hours: 40, ce_national_min_hours: 20, ce_local_min_hours: 10, ce_individual_min_hours: 10, hourly_model_total_hours: 40, remedial_hours_required: 20, refresher_hours_required: 24, initial_application_fee_cents: 9800, recert_application_fee_cents: 4500 }
              as: RegistryAdmin
              captures: { lv: $.data.id }
            - call: "POST /registry/candidates"
              payload: { full_name: "Sara Score", email: "sara@example.com" }
              as: Anonymous
              captures: { c: $.data.id }
          trigger:
            - call: "POST /registry/state-exam-records"
              payload: { candidate_id: "${c}", state_code: "TX", level_id: "${lv}", exam_date: "2026-09-01", score: 70, passing_score: 70 }
              as: StateOfficial
              as_user_id: "so-1"
              captures: { p1: $.data.passed }
            - call: "POST /registry/state-exam-records"
              payload: { candidate_id: "${c}", state_code: "TX", level_id: "${lv}", exam_date: "2026-09-01", score: 69.5, passing_score: 70 }
              as: StateOfficial
              as_user_id: "so-1"
              captures: { p2: $.data.passed }
          assert:
            - "score == passing_score (70): passed == true (inclusive boundary)"
            - "score 69.5 < 70: passed == false"

      - name: exam_application_fee_snapshot
        claim_type: computed_fields
        grounds: [entities.ExamApplication.fields.application_fee_cents]
        distinguishing_aspect: "The application fee is a server snapshot of level.initial_application_fee_cents at creation (9800), not client input."
        test_recipe:
          setup: ["EMT level; candidate; program; VERIFIED completion"]
          setup_api_calls:
            - call: "POST /registry/level-definitions"
              payload: { code: "EMT", display_name: "Emergency Medical Technician", scope_summary: "BLS", cognitive_cut_score: 0.66, ce_total_hours: 40, ce_national_min_hours: 20, ce_local_min_hours: 10, ce_individual_min_hours: 10, hourly_model_total_hours: 40, remedial_hours_required: 20, refresher_hours_required: 24, initial_application_fee_cents: 9800, recert_application_fee_cents: 4500 }
              as: RegistryAdmin
              captures: { lv: $.data.id }
            - call: "POST /registry/candidates"
              payload: { full_name: "Fred Fee", email: "fred@example.com" }
              as: Anonymous
              captures: { c: $.data.id }
            - call: "POST /registry/education-programs"
              payload: { name: "County EMT Academy", level_id: "${lv}", director_user_id: "dir-1" }
              as: RegistryAdmin
              captures: { p: $.data.id }
            - call: "POST /registry/program-completion-records"
              payload: { candidate_id: "${c}", program_id: "${p}", completion_date: "2026-09-01" }
              as: ProgramDirector
              as_user_id: "dir-1"
              captures: { rec: $.data.id }
            - { call: "POST /registry/program-completion-records/${rec}/decision", payload: { outcome: "VERIFIED" }, as: RegistryAdmin }
          trigger:
            - call: "POST /registry/exam-applications"
              payload: { level_id: "${lv}", completion_record_id: "${rec}" }
              as: Candidate
              as_user_id: "${c}"
              captures: { fee: $.data.application_fee_cents, st: $.data.status }
          assert:
            - "201; application_fee_cents == 9800 (snapshot from level); status == SUBMITTED"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: completion_second_decision_fails
        claim_type: invalid_transition
        grounds:
          - "state_machines.ProgramCompletionRecord.PENDING_VERIFICATION_to_VERIFIED"
          - "errors[ERR_COMPLETION_NOT_PENDING]"
        distinguishing_aspect: "A completion record already VERIFIED accepts no further decision — the PENDING_VERIFICATION source state is gone."
        test_recipe:
          setup: ["level, candidate, program, PENDING completion record"]
          setup_api_calls:
            - call: "POST /registry/level-definitions"
              payload: { code: "EMT", display_name: "Emergency Medical Technician", scope_summary: "BLS", cognitive_cut_score: 0.66, ce_total_hours: 40, ce_national_min_hours: 20, ce_local_min_hours: 10, ce_individual_min_hours: 10, hourly_model_total_hours: 40, remedial_hours_required: 20, refresher_hours_required: 24, initial_application_fee_cents: 9800, recert_application_fee_cents: 4500 }
              as: RegistryAdmin
              captures: { lv: $.data.id }
            - call: "POST /registry/candidates"
              payload: { full_name: "Cole Twice", email: "cole@example.com" }
              as: Anonymous
              captures: { c: $.data.id }
            - call: "POST /registry/education-programs"
              payload: { name: "County EMT Academy", level_id: "${lv}", director_user_id: "dir-1" }
              as: RegistryAdmin
              captures: { p: $.data.id }
            - call: "POST /registry/program-completion-records"
              payload: { candidate_id: "${c}", program_id: "${p}", completion_date: "2026-09-01" }
              as: ProgramDirector
              as_user_id: "dir-1"
              captures: { rec: $.data.id }
            - { call: "POST /registry/program-completion-records/${rec}/decision", payload: { outcome: "VERIFIED" }, as: RegistryAdmin }
          trigger:
            - call: "POST /registry/program-completion-records/${rec}/decision"
              payload: { outcome: "REJECTED", reason: "late doubt" }
              as: RegistryAdmin
              captures: { err: $.data.error_id }
          assert:
            - "409; error_id == ERR_COMPLETION_NOT_PENDING; record remains VERIFIED"

      - name: exam_application_deny_resubmit_cycle
        claim_type: valid_transition
        grounds: [state_machines.ExamApplication.SUBMITTED_to_DENIED, state_machines.ExamApplication.DENIED_to_SUBMITTED]
        distinguishing_aspect: "The deny-resubmit cycle works: DENIED -> resubmit -> SUBMITTED with resubmission_count incremented, and the application can still be approved afterwards (ATT minted)."
        test_recipe:
          setup: ["candidate with VERIFIED completion; application SUBMITTED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RegistryAdmin }
            - call: "POST /registry/level-definitions"
              payload: { code: "EMT", display_name: "Emergency Medical Technician", scope_summary: "BLS", cognitive_cut_score: 0.66, ce_total_hours: 40, ce_national_min_hours: 20, ce_local_min_hours: 10, ce_individual_min_hours: 10, hourly_model_total_hours: 40, remedial_hours_required: 20, refresher_hours_required: 24, initial_application_fee_cents: 9800, recert_application_fee_cents: 4500 }
              as: RegistryAdmin
              captures: { lv: $.data.id }
            - call: "POST /registry/candidates"
              payload: { full_name: "Dana Resubmit", email: "dana@example.com" }
              as: Anonymous
              captures: { c: $.data.id }
            - call: "POST /registry/education-programs"
              payload: { name: "County EMT Academy", level_id: "${lv}", director_user_id: "dir-1" }
              as: RegistryAdmin
              captures: { p: $.data.id }
            - call: "POST /registry/program-completion-records"
              payload: { candidate_id: "${c}", program_id: "${p}", completion_date: "2026-09-01" }
              as: ProgramDirector
              as_user_id: "dir-1"
              captures: { rec: $.data.id }
            - { call: "POST /registry/program-completion-records/${rec}/decision", payload: { outcome: "VERIFIED" }, as: RegistryAdmin }
            - call: "POST /registry/exam-applications"
              payload: { level_id: "${lv}", completion_record_id: "${rec}" }
              as: Candidate
              as_user_id: "${c}"
              captures: { app: $.data.id }
            - { call: "POST /registry/exam-applications/${app}/decision", payload: { outcome: "DENIED", reason: "Incomplete documentation" }, as: RegistryAdmin }
          trigger:
            - call: "POST /registry/exam-applications/${app}/resubmit"
              payload: {}
              as: Candidate
              as_user_id: "${c}"
              captures: { st1: $.data.status, rcount: $.data.resubmission_count }
            - call: "POST /registry/exam-applications/${app}/decision"
              payload: { outcome: "APPROVED" }
              as: RegistryAdmin
              captures: { att: $.data.att_id, st2: $.data.status }
          assert:
            - "After resubmit: status == SUBMITTED, resubmission_count == 1, denial_reason cleared"
            - "After second decision: status == APPROVED and att_id is non-null (ATT minted on the re-reviewed application)"

      - name: resubmit_submitted_application_fails
        claim_type: invalid_transition
        grounds:
          - "state_machines.ExamApplication.DENIED_to_SUBMITTED"
          - "errors[ERR_APPLICATION_NOT_DENIED]"
        distinguishing_aspect: "Resubmit is defined only from DENIED; a SUBMITTED application rejects it."
        test_recipe:
          setup: ["candidate with VERIFIED completion; application SUBMITTED (never decided)"]
          setup_api_calls:
            - call: "POST /registry/level-definitions"
              payload: { code: "EMT", display_name: "Emergency Medical Technician", scope_summary: "BLS", cognitive_cut_score: 0.66, ce_total_hours: 40, ce_national_min_hours: 20, ce_local_min_hours: 10, ce_individual_min_hours: 10, hourly_model_total_hours: 40, remedial_hours_required: 20, refresher_hours_required: 24, initial_application_fee_cents: 9800, recert_application_fee_cents: 4500 }
              as: RegistryAdmin
              captures: { lv: $.data.id }
            - call: "POST /registry/candidates"
              payload: { full_name: "Rhea Early", email: "rhea@example.com" }
              as: Anonymous
              captures: { c: $.data.id }
            - call: "POST /registry/education-programs"
              payload: { name: "County EMT Academy", level_id: "${lv}", director_user_id: "dir-1" }
              as: RegistryAdmin
              captures: { p: $.data.id }
            - call: "POST /registry/program-completion-records"
              payload: { candidate_id: "${c}", program_id: "${p}", completion_date: "2026-09-01" }
              as: ProgramDirector
              as_user_id: "dir-1"
              captures: { rec: $.data.id }
            - { call: "POST /registry/program-completion-records/${rec}/decision", payload: { outcome: "VERIFIED" }, as: RegistryAdmin }
            - call: "POST /registry/exam-applications"
              payload: { level_id: "${lv}", completion_record_id: "${rec}" }
              as: Candidate
              as_user_id: "${c}"
              captures: { app: $.data.id }
          trigger:
            - call: "POST /registry/exam-applications/${app}/resubmit"
              payload: {}
              as: Candidate
              as_user_id: "${c}"
              captures: { err: $.data.error_id }
          assert:
            - "409; error_id == ERR_APPLICATION_NOT_DENIED"

      - name: att_expiry_sweep_marks_expired
        claim_type: side_effect_execution
        grounds: [state_machines.AuthorizationToTest.ISSUED_to_EXPIRED, calculations.disciplinary_due_process_schedule]
        distinguishing_aspect: "The clock sweep expires an ISSUED ATT once expires_on (issued + 90 days) passes; the sweep counter and the filtered list both expose the transition."
        test_recipe:
          setup: ["application APPROVED at clock 2026-09-01T00:00:00Z; ATT issued, expires 2026-11-30T00:00:00Z"]
          setup_api_calls:
