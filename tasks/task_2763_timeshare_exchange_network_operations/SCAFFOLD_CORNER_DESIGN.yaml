          setup: >-
            Tier PLUS and Resort A affiliated at the default clock. Member M1 banks a ONE_BR week
            checking in 2027-06-15 worth 82. Member M2 banks a TWO_BR week checking in 2027-05-10
            worth 107 and submits a DEPOSIT_FIRST request for a ONE_BR at Resort A over
            2027-06-01..2027-06-30 funded by that deposit, giving power_budget 117 and
