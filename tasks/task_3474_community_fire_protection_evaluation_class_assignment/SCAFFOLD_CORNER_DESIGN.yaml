            - "ScoreSheet.${sheet1}.distribution_points == 4.67 (only 2 of 3 hydrants creditworthy after halving)"
            - "ScoreSheet.${sheet1}.water_total_points == 31.68 (supply 10.00 + flow 17.01 + distribution 4.67 + storage 0.00)"
            - "the test dated exactly 2021-12-01 (cutoff) counted at full value, proving the staleness comparison is strict-before"

      - name: classification_premium_modifier_stored_class_10
        claim_type: constants_applied
        grounds: [calculations.premium_amounts, entities.Classification.fields.premium_modifier]
        distinguishing_aspect: "A class-10 classification stores premium_modifier 1.25 from the modifier table at publication."
