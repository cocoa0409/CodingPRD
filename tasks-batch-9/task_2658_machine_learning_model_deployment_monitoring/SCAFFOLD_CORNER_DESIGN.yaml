            - call: "GET /traffic-ramp-steps"
              payload: { deployment_id: "${d1_id}", reason: "DRAIN_RELEASE", limit: 10, offset: 0 }
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { drain_total: $.meta.total_count, drain_delta: "$.data[0].delta_pct" }
            - call: "GET /challenger-evaluations"
              payload: { challenger_deployment_id: "${d1_id}", limit: 10, offset: 0 }
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
