scaffold_corner_design:
  # =========================================================================
  - section: entities
    instances:
      - name: create_authorization_request_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.AuthorizationRequest, endpoints]
        distinguishing_aspect: "POST /authorization-requests with all required fields returns 201, status DRAFT, payer_id copied from the member, version 1."
        test_recipe:
          setup: ["A payer, member, provider exist."]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Acme Health" }
              as: Anonymous
              captures: { payer_id: $.data.id }
            - call: "POST /members"
              payload: { payer_id: "${payer_id}", member_number: "M1" }
              as: Anonymous
              captures: { member_id: $.data.id }
            - call: "POST /providers"
              payload: { npi: "1234567890", name: "Dr A", specialty: "ONCOLOGY" }
              as: Anonymous
              captures: { provider_id: $.data.id }
          trigger:
            - call: "POST /authorization-requests"
              payload: { member_id: "${member_id}", provider_id: "${provider_id}", request_type: "DRUG", procedure_code: "NDC-1", requested_units: 2, unit_cost_cents: 5000 }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { req_id: $.data.id }
          assert:
            - "response status == 201"
            - "AuthorizationRequest.${req_id}.status == DRAFT"
            - "AuthorizationRequest.${req_id}.payer_id == ${payer_id}"
            - "AuthorizationRequest.${req_id}.version == 1"
      - name: create_request_missing_requested_units_validation
        claim_type: Required Fields
        grounds: [entities.AuthorizationRequest.fields.requested_units]
        distinguishing_aspect: "Omitting requested_units (source: input, no default) on POST /authorization-requests returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["A payer, member, provider exist."]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Acme Health" }
              as: Anonymous
              captures: { payer_id: $.data.id }
            - call: "POST /members"
              payload: { payer_id: "${payer_id}", member_number: "M1" }
              as: Anonymous
              captures: { member_id: $.data.id }
            - call: "POST /providers"
              payload: { npi: "1234567890", name: "Dr A", specialty: "ONCOLOGY" }
              as: Anonymous
              captures: { provider_id: $.data.id }
          trigger:
            - call: "POST /authorization-requests"
              payload: { member_id: "${member_id}", provider_id: "${provider_id}", request_type: "DRUG", procedure_code: "NDC-1", unit_cost_cents: 5000 }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "response.data.error_id == ERR_VALIDATION"
      - name: get_request_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [endpoints, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /authorization-requests/{id} with an unknown UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["A provider exists to authenticate."]
          setup_api_calls:
            - call: "POST /providers"
              payload: { npi: "1234567890", name: "Dr A", specialty: "ONCOLOGY" }
              as: Anonymous
              captures: { provider_id: $.data.id }
          trigger:
            - call: "GET /authorization-requests/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Provider
              as_user_id: "${provider_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"
      - name: member_coinsurance_rate_default_applied
        claim_type: Defaults
        grounds: [entities.Member.fields.coinsurance_rate]
        distinguishing_aspect: "Omitting coinsurance_rate on POST /members applies the default 0.2."
        test_recipe:
          setup: ["A payer exists."]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Acme Health" }
              as: Anonymous
              captures: { payer_id: $.data.id }
          trigger:
            - call: "POST /members"
              payload: { payer_id: "${payer_id}", member_number: "M1" }
              as: Anonymous
              captures: { member_id: $.data.id }
          assert:
            - "response status == 201"
            - "Member.${member_id}.coinsurance_rate == 0.2"
      - name: request_type_invalid_enum_rejected
        claim_type: Type Constraints
        grounds: [entities.AuthorizationRequest.fields.request_type]
        distinguishing_aspect: "POST /authorization-requests with request_type outside {SERVICE, DRUG} returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["A payer, member, provider exist."]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Acme Health" }
              as: Anonymous
              captures: { payer_id: $.data.id }
            - call: "POST /members"
              payload: { payer_id: "${payer_id}", member_number: "M1" }
              as: Anonymous
              captures: { member_id: $.data.id }
            - call: "POST /providers"
              payload: { npi: "1234567890", name: "Dr A", specialty: "ONCOLOGY" }
              as: Anonymous
              captures: { provider_id: $.data.id }
          trigger:
            - call: "POST /authorization-requests"
              payload: { member_id: "${member_id}", provider_id: "${provider_id}", request_type: "SUPPLY", procedure_code: "X", requested_units: 1, unit_cost_cents: 5000 }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "response.data.error_id == ERR_VALIDATION"
      - name: request_status_system_field_input_ignored
        claim_type: System Fields
        grounds: [entities.AuthorizationRequest.fields.status]
        distinguishing_aspect: "status is source: system; a client-supplied status is rejected as an unknown field (ERR_VALIDATION) — never APPROVED at creation. The created request is always DRAFT."
        test_recipe:
          setup: ["A payer, member, provider exist."]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Acme Health" }
              as: Anonymous
              captures: { payer_id: $.data.id }
            - call: "POST /members"
              payload: { payer_id: "${payer_id}", member_number: "M1" }
              as: Anonymous
              captures: { member_id: $.data.id }
            - call: "POST /providers"
              payload: { npi: "1234567890", name: "Dr A", specialty: "ONCOLOGY" }
              as: Anonymous
              captures: { provider_id: $.data.id }
          trigger:
            - call: "POST /authorization-requests"
              payload: { member_id: "${member_id}", provider_id: "${provider_id}", request_type: "DRUG", procedure_code: "NDC-1", requested_units: 1, unit_cost_cents: 5000, status: "APPROVED" }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "response.data.error_id == ERR_VALIDATION"
      - name: member_active_auth_count_computed_field_starts_zero
        claim_type: Computed Fields
        grounds: [entities.Member.fields.active_authorization_count]
        distinguishing_aspect: "A freshly created Member has computed active_authorization_count == 0 regardless of any client input."
        test_recipe:
          setup: ["A payer exists."]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Acme Health" }
              as: Anonymous
              captures: { payer_id: $.data.id }
            - call: "POST /members"
              payload: { payer_id: "${payer_id}", member_number: "M1" }
              as: Anonymous
              captures: { member_id: $.data.id }
            - call: "POST /providers"
              payload: { npi: "1234567890", name: "Dr A", specialty: "ONCOLOGY" }
              as: Anonymous
              captures: { provider_id: $.data.id }
          trigger:
            - call: "GET /members/${member_id}"
              payload: {}
              as: Provider
              as_user_id: "${provider_id}"
          assert:
            - "Member.${member_id}.active_authorization_count == 0"
      - name: clinical_evidence_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.ClinicalEvidence]
        distinguishing_aspect: "ClinicalEvidence has common_fields: false — it exposes id and created_at but no version field, and has no update endpoint in §1.5."
        test_recipe:
          setup: ["A DRAFT request exists with one evidence row."]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Acme Health" }
              as: Anonymous
              captures: { payer_id: $.data.id }
            - call: "POST /members"
              payload: { payer_id: "${payer_id}", member_number: "M1" }
              as: Anonymous
              captures: { member_id: $.data.id }
            - call: "POST /providers"
              payload: { npi: "1234567890", name: "Dr A", specialty: "RADIOLOGY" }
              as: Anonymous
              captures: { provider_id: $.data.id }
            - call: "POST /authorization-requests"
              payload: { member_id: "${member_id}", provider_id: "${provider_id}", request_type: "SERVICE", procedure_code: "CPT-1", requested_units: 1, unit_cost_cents: 5000 }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { req_id: $.data.id }
          trigger:
            - call: "POST /clinical-evidence"
              payload: { request_id: "${req_id}", document_type: "IMAGING", line_item_cost_cents: 0, uri: "s3://x" }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { ev_id: $.data.id }
          assert:
            - "response status == 201"
            - "ClinicalEvidence.${ev_id} response includes id and created_at but no version key"

  # =========================================================================
  - section: state_machines
    instances:
      - name: start_review_from_draft_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.AuthorizationRequest.SUBMITTED_to_UNDER_REVIEW]
        distinguishing_aspect: "start-review on a DRAFT (not SUBMITTED) request is undefined and returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A DRAFT request (never submitted)."]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Acme Health" }
              as: Anonymous
              captures: { payer_id: $.data.id }
            - call: "POST /members"
              payload: { payer_id: "${payer_id}", member_number: "M1" }
              as: Anonymous
              captures: { member_id: $.data.id }
            - call: "POST /providers"
              payload: { npi: "1234567890", name: "Dr A", specialty: "NEUROLOGY" }
              as: Anonymous
              captures: { provider_id: $.data.id }
            - call: "POST /authorization-requests"
              payload: { member_id: "${member_id}", provider_id: "${provider_id}", request_type: "SERVICE", procedure_code: "CPT-1", requested_units: 1, unit_cost_cents: 5000 }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { req_id: $.data.id }
          trigger:
            - call: "POST /authorization-requests/${req_id}/start-review"
              payload: {}
              as: Payer
              as_user_id: "${payer_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
      - name: submit_twice_idempotency_second_fails
        claim_type: Idempotency
        grounds: [state_machines.AuthorizationRequest.DRAFT_to_SUBMITTED]
        distinguishing_aspect: "Submitting an already-SUBMITTED request a second time returns ERR_INVALID_STATE (409); no double side-effects."
        test_recipe:
          setup: ["A request submitted once (now SUBMITTED)."]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Acme Health" }
              as: Anonymous
              captures: { payer_id: $.data.id }
            - call: "POST /members"
              payload: { payer_id: "${payer_id}", member_number: "M1" }
              as: Anonymous
              captures: { member_id: $.data.id }
            - call: "POST /providers"
              payload: { npi: "1234567890", name: "Dr A", specialty: "ONCOLOGY" }
              as: Anonymous
              captures: { provider_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Provider
            - call: "POST /authorization-requests"
              payload: { member_id: "${member_id}", provider_id: "${provider_id}", request_type: "DRUG", procedure_code: "NDC-1", requested_units: 1, unit_cost_cents: 5000 }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { req_id: $.data.id }
            - call: "POST /clinical-evidence"
              payload: { request_id: "${req_id}", document_type: "MEDICATION_HISTORY", line_item_cost_cents: 0, uri: "s3://e1" }
              as: Provider
              as_user_id: "${provider_id}"
            - call: "POST /authorization-requests/${req_id}/submit"
              payload: {}
              as: Provider
              as_user_id: "${provider_id}"
          trigger:
            - call: "POST /authorization-requests/${req_id}/submit"
              payload: {}
              as: Provider
              as_user_id: "${provider_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
      - name: decide_on_terminal_overturned_appeal_locked
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Appeal.OPEN_to_OVERTURNED]
        distinguishing_aspect: "An Appeal already OVERTURNED (terminal) rejects a further decide with ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A tier-1 appeal already OVERTURNED (request now APPROVED)."]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Acme Health" }
              as: Anonymous
              captures: { payer_id: $.data.id }
            - call: "POST /members"
              payload: { payer_id: "${payer_id}", member_number: "M1" }
              as: Anonymous
              captures: { member_id: $.data.id }
            - call: "POST /providers"
              payload: { npi: "1234567890", name: "Dr A", specialty: "CARDIOLOGY" }
              as: Anonymous
              captures: { provider_id: $.data.id }
            - call: "POST /reviewers"
              payload: { payer_id: "${payer_id}", name: "Rev A", specialty: "CARDIOLOGY" }
              as: Anonymous
              captures: { reviewer_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Payer
            - call: "POST /authorization-requests"
              payload: { member_id: "${member_id}", provider_id: "${provider_id}", request_type: "SERVICE", procedure_code: "CPT-1", requested_units: 1, unit_cost_cents: 5000 }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { req_id: $.data.id }
            - call: "POST /clinical-evidence"
              payload: { request_id: "${req_id}", document_type: "CHART_NOTE", line_item_cost_cents: 0, uri: "s3://c1" }
              as: Provider
              as_user_id: "${provider_id}"
            - call: "POST /authorization-requests/${req_id}/submit"
              payload: {}
              as: Provider
              as_user_id: "${provider_id}"
            - call: "POST /authorization-requests/${req_id}/start-review"
              payload: {}
              as: Payer
              as_user_id: "${payer_id}"
            - call: "POST /review-decisions"
              payload: { request_id: "${req_id}", reviewer_id: "${reviewer_id}", outcome: "DENY", rationale: "no" }
              as: Payer
              as_user_id: "${payer_id}"
            - call: "POST /appeals"
              payload: { request_id: "${req_id}" }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { appeal_id: $.data.id }
            - call: "POST /appeals/${appeal_id}/decide"
              payload: { decision: "OVERTURNED", decision_rationale: "necessary" }
              as: Payer
              as_user_id: "${payer_id}"
          trigger:
            - call: "POST /appeals/${appeal_id}/decide"
              payload: { decision: "UPHELD", decision_rationale: "second try" }
              as: Payer
              as_user_id: "${payer_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
      - name: p2p_complete_credits_sla_pause_cross_entity
        claim_type: Side Effect Execution
        grounds: [state_machines.PeerToPeerSession.SCHEDULED_to_COMPLETED, calculations.sla_due_at]
        distinguishing_aspect: "Completing a 2-hour P2P slot adds 2h to the linked request's clock_paused_hours and pushes sla_due_at from 2026-06-08T00:00:00Z (standard 168h) to 2026-06-08T02:00:00Z."
        test_recipe:
          setup: ["A standard UNDER_REVIEW request reviewed at 2026-06-01T00:00:00Z with a SCHEDULED 2-hour P2P slot."]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Acme Health", standard_sla_hours: 168, expedited_sla_hours: 72 }
              as: Anonymous
              captures: { payer_id: $.data.id }
            - call: "POST /members"
              payload: { payer_id: "${payer_id}", member_number: "M1" }
              as: Anonymous
              captures: { member_id: $.data.id }
            - call: "POST /providers"
              payload: { npi: "1234567890", name: "Dr A", specialty: "CARDIOLOGY" }
              as: Anonymous
              captures: { provider_id: $.data.id }
            - call: "POST /reviewers"
              payload: { payer_id: "${payer_id}", name: "Rev A", specialty: "CARDIOLOGY" }
              as: Anonymous
              captures: { reviewer_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Payer
            - call: "POST /authorization-requests"
              payload: { member_id: "${member_id}", provider_id: "${provider_id}", request_type: "SERVICE", procedure_code: "CPT-1", requested_units: 1, unit_cost_cents: 5000 }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { req_id: $.data.id }
            - call: "POST /clinical-evidence"
              payload: { request_id: "${req_id}", document_type: "CHART_NOTE", line_item_cost_cents: 0, uri: "s3://c1" }
              as: Provider
              as_user_id: "${provider_id}"
            - call: "POST /authorization-requests/${req_id}/submit"
              payload: {}
              as: Provider
              as_user_id: "${provider_id}"
            - call: "POST /authorization-requests/${req_id}/start-review"
              payload: {}
              as: Payer
              as_user_id: "${payer_id}"
            - call: "POST /peer-to-peer-sessions"
              payload: { request_id: "${req_id}", reviewer_id: "${reviewer_id}", slot_start: "2026-06-02T10:00:00Z", slot_end: "2026-06-02T12:00:00Z" }
              as: Payer
              as_user_id: "${payer_id}"
              captures: { p2p_id: $.data.id }
          trigger:
            - call: "POST /peer-to-peer-sessions/${p2p_id}/complete"
              payload: {}
              as: Payer
              as_user_id: "${payer_id}"
          assert:
            - "PeerToPeerSession.${p2p_id}.status == COMPLETED"
            - "AuthorizationRequest.${req_id}.clock_paused_hours == 2"
            - "AuthorizationRequest.${req_id}.sla_due_at == 2026-06-08T02:00:00.000Z"
      - name: withdraw_open_appeal_succeeds
        claim_type: Valid Transition
        grounds: [state_machines.Appeal.OPEN_to_WITHDRAWN]
        distinguishing_aspect: "Provider withdraws an OPEN tier-1 appeal; status becomes WITHDRAWN and the underlying request stays DENIED."
        test_recipe:
          setup: ["A DENIED request with an OPEN tier-1 appeal."]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Acme Health" }
              as: Anonymous
              captures: { payer_id: $.data.id }
            - call: "POST /members"
              payload: { payer_id: "${payer_id}", member_number: "M1" }
              as: Anonymous
              captures: { member_id: $.data.id }
            - call: "POST /providers"
              payload: { npi: "1234567890", name: "Dr A", specialty: "ONCOLOGY" }
              as: Anonymous
              captures: { provider_id: $.data.id }
            - call: "POST /reviewers"
              payload: { payer_id: "${payer_id}", name: "Rev A", specialty: "ONCOLOGY" }
              as: Anonymous
              captures: { reviewer_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Payer
            - call: "POST /authorization-requests"
              payload: { member_id: "${member_id}", provider_id: "${provider_id}", request_type: "DRUG", procedure_code: "NDC-1", requested_units: 1, unit_cost_cents: 5000 }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { req_id: $.data.id }
            - call: "POST /clinical-evidence"
              payload: { request_id: "${req_id}", document_type: "MEDICATION_HISTORY", line_item_cost_cents: 0, uri: "s3://m1" }
              as: Provider
              as_user_id: "${provider_id}"
            - call: "POST /authorization-requests/${req_id}/submit"
              payload: {}
              as: Provider
              as_user_id: "${provider_id}"
            - call: "POST /authorization-requests/${req_id}/start-review"
              payload: {}
              as: Payer
              as_user_id: "${payer_id}"
            - call: "POST /review-decisions"
              payload: { request_id: "${req_id}", reviewer_id: "${reviewer_id}", outcome: "DENY", rationale: "no" }
              as: Payer
              as_user_id: "${payer_id}"
            - call: "POST /appeals"
              payload: { request_id: "${req_id}" }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { appeal_id: $.data.id }
          trigger:
            - call: "POST /appeals/${appeal_id}/withdraw"
              payload: {}
              as: Provider
              as_user_id: "${provider_id}"
          assert:
            - "Appeal.${appeal_id}.status == WITHDRAWN"
            - "AuthorizationRequest.${req_id}.status == DENIED"
      - name: tier3_external_overturn_cascades_request
        claim_type: Side Effect Execution
        grounds: [state_machines.Appeal.OPEN_to_OVERTURNED, state_machines.AuthorizationRequest.UNDER_REVIEW_to_APPROVED]
        distinguishing_aspect: "An ExternalReviewer OVERTURN on a tier-3 appeal cascades the request DENIED->APPROVED and increments Member.active_authorization_count to 1."
        test_recipe:
          setup: ["A DENIED request escalated to a tier-3 OPEN appeal; clock within deadline."]
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Acme Health" }
              as: Anonymous
              captures: { payer_id: $.data.id }
            - call: "POST /members"
              payload: { payer_id: "${payer_id}", member_number: "M1" }
              as: Anonymous
              captures: { member_id: $.data.id }
            - call: "POST /providers"
              payload: { npi: "1234567890", name: "Dr A", specialty: "ORTHOPEDICS" }
              as: Anonymous
              captures: { provider_id: $.data.id }
            - call: "POST /reviewers"
              payload: { payer_id: "${payer_id}", name: "Rev A", specialty: "ORTHOPEDICS" }
              as: Anonymous
              captures: { reviewer_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Payer
            - call: "POST /authorization-requests"
              payload: { member_id: "${member_id}", provider_id: "${provider_id}", request_type: "SERVICE", procedure_code: "CPT-1", requested_units: 2, unit_cost_cents: 5000 }
              as: Provider
              as_user_id: "${provider_id}"
              captures: { req_id: $.data.id }
            - call: "POST /clinical-evidence"
              payload: { request_id: "${req_id}", document_type: "IMAGING", line_item_cost_cents: 0, uri: "s3://i1" }
              as: Provider
              as_user_id: "${provider_id}"
            - call: "POST /authorization-requests/${req_id}/submit"
              payload: {}
              as: Provider
              as_user_id: "${provider_id}"
