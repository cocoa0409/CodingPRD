# =============================================================================
# Scaffold Corner Design (Coverage Index for Non-Difficulty Tests) — §1.9
# Employer Group Health Renewal & Underwriting
# Sections/claim_types follow references/claim-extraction-guide.md.
# Stubs (excluded_because) cite §1.8 instances in SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: create_case_returns_intake_initial_state
        claim_type: creation
        grounds: [entities.UnderwritingCase, state_machines.UnderwritingCase]
        distinguishing_aspect: "POST /underwriting-cases with all required fields returns 201, status INTAKE, version 1, computed rating fields at defaults, and assigned_underwriter_id copied from X-User-ID."
        test_recipe:
          setup: ["Broker B registered (ACTIVE)"]
          setup_api_calls:
            - { call: "POST /brokers", payload: { firm_name: "Apex Benefits", license_number: "LIC-CA-1001", state_code: "CA", commission_pct: 0.04 }, as: Underwriter, captures: { b: "$.data.id" } }
          trigger:
            - { call: "POST /underwriting-cases", payload: { group_name: "InitCo", group_size: 500, sic_code: "7372", state_code: "CA", effective_date: "2027-01-01T00:00:00Z", current_premium_annual: 24000000, current_renewal_date: "2026-12-31T00:00:00Z", funding_type: "FULLY_INSURED", broker_id: "${b}" }, as: Underwriter, as_user_id: "uw-001", captures: { c: "$.data.id", st: "$.data.status", v: "$.data.version", au: "$.data.assigned_underwriter_id", cf: "$.data.credibility_factor", br: "$.data.blended_rate_cents", cap: "$.data.is_rate_cap_applied" } }
          assert:
            - "${st} == INTAKE"
            - "${v} == 1"
            - "${au} == uw-001"
            - "${cf} == 0"
            - "${br} == 0"
            - "${cap} == false"
      - name: get_case_returns_stored_fields
        claim_type: retrieval
        grounds: [entities.UnderwritingCase]
        distinguishing_aspect: "GET /underwriting-cases/{id} echoes every stored input field exactly as posted."
        test_recipe:
          setup: ["Broker B; case created"]
          setup_api_calls:
            - { call: "POST /brokers", payload: { firm_name: "Apex Benefits", license_number: "LIC-CA-1001", state_code: "CA", commission_pct: 0.04 }, as: Underwriter, captures: { b: "$.data.id" } }
            - { call: "POST /underwriting-cases", payload: { group_name: "EchoCo", group_size: 500, sic_code: "7372", state_code: "CA", effective_date: "2027-01-01T00:00:00Z", current_premium_annual: 24000000, current_renewal_date: "2026-12-31T00:00:00Z", funding_type: "FULLY_INSURED", broker_id: "${b}" }, as: Underwriter, captures: { c: "$.data.id" } }
          trigger:
            - { call: "GET /underwriting-cases/${c}", payload: {}, as: ComplianceOfficer, captures: { gn: "$.data.group_name", gs: "$.data.group_size", sic: "$.data.sic_code", bid: "$.data.broker_id" } }
          assert:
            - "${gn} == EchoCo"
            - "${gs} == 500"
            - "${sic} == 7372"
            - "${bid} == ${b}"
      - name: list_cases_paginates_with_envelope
        claim_type: listing
        grounds: [entities.UnderwritingCase, response_envelope]
        distinguishing_aspect: "GET /underwriting-cases honors limit/offset and returns pagination fields total_count/has_more per the fixed response envelope."
        test_recipe:
          setup: ["Broker B; two cases created"]
          setup_api_calls:
            - { call: "POST /brokers", payload: { firm_name: "Apex Benefits", license_number: "LIC-CA-1001", state_code: "CA", commission_pct: 0.04 }, as: Underwriter, captures: { b: "$.data.id" } }
            - { call: "POST /underwriting-cases", payload: { group_name: "PageOneCo", group_size: 500, sic_code: "7372", state_code: "CA", effective_date: "2027-01-01T00:00:00Z", current_premium_annual: 24000000, current_renewal_date: "2026-12-31T00:00:00Z", funding_type: "FULLY_INSURED", broker_id: "${b}" }, as: Underwriter }
            - { call: "POST /underwriting-cases", payload: { group_name: "PageTwoCo", group_size: 500, sic_code: "7372", state_code: "CA", effective_date: "2027-01-01T00:00:00Z", current_premium_annual: 24000000, current_renewal_date: "2026-12-31T00:00:00Z", funding_type: "FULLY_INSURED", broker_id: "${b}" }, as: Underwriter }
          trigger:
            - { call: "GET /underwriting-cases?limit=1&offset=0", payload: {}, as: Underwriter, captures: { g1: "$.data[0].group_name" } }
            - { call: "GET /underwriting-cases?limit=1&offset=1", payload: {}, as: Underwriter, captures: { g2: "$.data[0].group_name" } }
          assert:
            - "${g1} == PageOneCo"
            - "${g2} == PageTwoCo"
            - "page 1 (limit=1, offset=0) has total_count == 2 and has_more == true in the envelope"
            - "page 2 (limit=1, offset=1) has has_more == false in the envelope"
      - name: get_missing_case_returns_not_found
        claim_type: not_found
        grounds: [entities.UnderwritingCase, "errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET with a well-formed but non-existent id returns 404 ERR_NOT_FOUND in the error envelope."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /underwriting-cases/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: Underwriter, captures: { eid: "$.data.error_id" } }
          assert:
            - "${eid} == ERR_NOT_FOUND"
      - name: create_case_missing_group_size_rejected
        claim_type: required_fields
        grounds: [entities.UnderwritingCase.fields.group_size, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required input field group_size yields 400 ERR_INVALID_REQUEST; no case is persisted."
        test_recipe:
          setup: ["Broker B registered"]
          setup_api_calls:
            - { call: "POST /brokers", payload: { firm_name: "Apex Benefits", license_number: "LIC-CA-1001", state_code: "CA", commission_pct: 0.04 }, as: Underwriter, captures: { b: "$.data.id" } }
          trigger:
            - { call: "POST /underwriting-cases", payload: { group_name: "NoSizeCo", sic_code: "7372", state_code: "CA", effective_date: "2027-01-01T00:00:00Z", current_premium_annual: 24000000, current_renewal_date: "2026-12-31T00:00:00Z", funding_type: "FULLY_INSURED", broker_id: "${b}" }, as: Underwriter, captures: { eid: "$.data.error_id" } }
          assert:
            - "${eid} == ERR_INVALID_REQUEST"
            - "GET /underwriting-cases: total_count == 0"
      - name: create_case_invalid_funding_type_rejected
        claim_type: type_constraints
        grounds: [entities.UnderwritingCase.fields.funding_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "funding_type outside {FULLY_INSURED, LEVEL_FUNDED, SELF_FUNDED} is rejected with 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Broker B registered"]
          setup_api_calls:
            - { call: "POST /brokers", payload: { firm_name: "Apex Benefits", license_number: "LIC-CA-1001", state_code: "CA", commission_pct: 0.04 }, as: Underwriter, captures: { b: "$.data.id" } }
          trigger:
            - { call: "POST /underwriting-cases", payload: { group_name: "BadEnumCo", group_size: 500, sic_code: "7372", state_code: "CA", effective_date: "2027-01-01T00:00:00Z", current_premium_annual: 24000000, current_renewal_date: "2026-12-31T00:00:00Z", funding_type: "PARTLY_INSURED", broker_id: "${b}" }, as: Underwriter, captures: { eid: "$.data.error_id" } }
          assert:
            - "${eid} == ERR_INVALID_REQUEST"
      - name: broker_created_active_by_default
        claim_type: defaults
        grounds: [entities.Broker.fields.status, state_machines.UnderwritingCase.INTAKE_to_CENSUS_PENDING]
        distinguishing_aspect: "POST /brokers applies the system default status ACTIVE with no status input accepted."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /brokers", payload: { firm_name: "Apex Benefits", license_number: "LIC-CA-1001", state_code: "CA", commission_pct: 0.04 }, as: Underwriter, captures: { st: "$.data.status", b: "$.data.id" } }
          assert:
            - "${st} == ACTIVE"
      - name: census_child_scoped_to_parent_case
        claim_type: parent_relationships
        grounds: [entities.CensusSnapshot.fields.case_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Census creation under a non-existent parent case id returns ERR_NOT_FOUND; a created child echoes case_id == parent id (hierarchical topology)."
        test_recipe:
          setup: ["Broker B; case C in INTAKE"]
          setup_api_calls:
            - { call: "POST /brokers", payload: { firm_name: "Apex Benefits", license_number: "LIC-CA-1001", state_code: "CA", commission_pct: 0.04 }, as: Underwriter, captures: { b: "$.data.id" } }
            - { call: "POST /underwriting-cases", payload: { group_name: "ParentCo", group_size: 500, sic_code: "7372", state_code: "CA", effective_date: "2027-01-01T00:00:00Z", current_premium_annual: 24000000, current_renewal_date: "2026-12-31T00:00:00Z", funding_type: "FULLY_INSURED", broker_id: "${b}" }, as: Underwriter, captures: { c: "$.data.id" } }
          trigger:
            - { call: "POST /underwriting-cases/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/census-snapshots", payload: { total_employees: 500, enrolled_employees: 400, dependent_count: 250, tier_distribution: { EE: 200, ES: 80, EC: 60, EF: 60 } }, as: Underwriter, captures: { eid: "$.data.error_id" } }
            - { call: "POST /underwriting-cases/${c}/census-snapshots", payload: { total_employees: 500, enrolled_employees: 400, dependent_count: 250, tier_distribution: { EE: 200, ES: 80, EC: 60, EF: 60 } }, as: Underwriter, captures: { pid: "$.data.case_id", st: "$.data.status" } }
          assert:
            - "${eid} == ERR_NOT_FOUND"
            - "${pid} == ${c}"
            - "${st} == PENDING"
      - name: claims_submit_computes_period_fields
        claim_type: computed_fields
        grounds: [entities.ClaimsExperience.fields.months_of_experience, entities.ClaimsExperience.fields.pooled_claims_cents, entities.ClaimsExperience.fields.experience_claim_cost_cents]
        distinguishing_aspect: "On submit, months_of_experience (24), pooled_claims_cents (0 with large_claim_count 0), and experience_claim_cost_cents (== total_paid 38400000) are computed by the system."
        test_recipe:
          setup: ["Case CLAIMS_PENDING; claims record PENDING"]
          setup_api_calls:
            - { call: "POST /brokers", payload: { firm_name: "Apex Benefits", license_number: "LIC-CA-1001", state_code: "CA", commission_pct: 0.04 }, as: Underwriter, captures: { b: "$.data.id" } }
            - { call: "POST /underwriting-cases", payload: { group_name: "CompCo", group_size: 500, sic_code: "7372", state_code: "CA", effective_date: "2027-01-01T00:00:00Z", current_premium_annual: 24000000, current_renewal_date: "2026-12-31T00:00:00Z", funding_type: "FULLY_INSURED", broker_id: "${b}" }, as: Underwriter, captures: { c: "$.data.id" } }
            - { call: "POST /underwriting-cases/${c}/submit-for-census", payload: {}, as: Underwriter }
            - { call: "POST /underwriting-cases/${c}/census-snapshots", payload: { total_employees: 500, enrolled_employees: 400, dependent_count: 250, tier_distribution: { EE: 200, ES: 80, EC: 60, EF: 60 } }, as: Underwriter, captures: { cs: "$.data.id" } }
            - { call: "POST /census-snapshots/${cs}/validate", payload: {}, as: Underwriter }
            - { call: "POST /underwriting-cases/${c}/request-claims", payload: {}, as: Underwriter }
            - { call: "POST /underwriting-cases/${c}/claims-experiences", payload: { experience_period_start: "2024-01-01T00:00:00Z", experience_period_end: "2025-12-31T00:00:00Z", total_paid_claims_cents: 38400000, total_enrollment_months: 9600, large_claim_count: 0, pooling_threshold_cents: 5000000 }, as: Underwriter, captures: { cl: "$.data.id" } }
          trigger:
            - { call: "POST /claims-experiences/${cl}/submit", payload: {}, as: Underwriter, as_user_id: "uw-001", captures: { mo: "$.data.months_of_experience", pc: "$.data.pooled_claims_cents", ec: "$.data.experience_claim_cost_cents" } }
          assert:
            - "${mo} == 24"
            - "${pc} == 0"
            - "${ec} == 38400000"
      - name: case_version_increments_on_each_mutation
        claim_type: system_fields
        grounds: [entities.UnderwritingCase, "concurrency_rules[quote-create-stale-case]"]
        distinguishing_aspect: "version starts at 1 and increments by one on every case mutation (submit-for-census, request-claims); updated_at refreshes."
        test_recipe:
          setup: ["Broker B; case C created (version 1)"]
          setup_api_calls:
            - { call: "POST /brokers", payload: { firm_name: "Apex Benefits", license_number: "LIC-CA-1001", state_code: "CA", commission_pct: 0.04 }, as: Underwriter, captures: { b: "$.data.id" } }
            - { call: "POST /underwriting-cases", payload: { group_name: "VerCo", group_size: 500, sic_code: "7372", state_code: "CA", effective_date: "2027-01-01T00:00:00Z", current_premium_annual: 24000000, current_renewal_date: "2026-12-31T00:00:00Z", funding_type: "FULLY_INSURED", broker_id: "${b}" }, as: Underwriter, captures: { c: "$.data.id" } }
          trigger:
            - { call: "POST /underwriting-cases/${c}/submit-for-census", payload: {}, as: Underwriter, captures: { v2: "$.data.version" } }
            - { call: "POST /underwriting-cases/${c}/census-snapshots", payload: { total_employees: 500, enrolled_employees: 400, dependent_count: 250, tier_distribution: { EE: 200, ES: 80, EC: 60, EF: 60 } }, as: Underwriter, captures: { cs: "$.data.id" } }
            - { call: "POST /census-snapshots/${cs}/validate", payload: {}, as: Underwriter }
            - { call: "POST /underwriting-cases/${c}/request-claims", payload: {}, as: Underwriter, captures: { v3: "$.data.version" } }
          assert:
            - "${v2} == 2"
            - "${v3} == 3"
      - name: quote_numbers_sequential_per_case
        claim_type: system_fields
        grounds: [entities.Quote.fields.quote_number]
        distinguishing_aspect: "quote_number is server-assigned sequentially within a case: first quote 1, second quote 2."
        test_recipe:
          setup: ["Case RATING_IN_PROGRESS with MODELED plan P"]
          setup_api_calls:
            - { call: "POST /brokers", payload: { firm_name: "Apex Benefits", license_number: "LIC-CA-1001", state_code: "CA", commission_pct: 0.04 }, as: Underwriter, captures: { b: "$.data.id" } }
            - { call: "POST /underwriting-cases", payload: { group_name: "SeqCo", group_size: 500, sic_code: "7372", state_code: "CA", effective_date: "2027-01-01T00:00:00Z", current_premium_annual: 24000000, current_renewal_date: "2026-12-31T00:00:00Z", funding_type: "FULLY_INSURED", broker_id: "${b}" }, as: Underwriter, captures: { c: "$.data.id" } }
            - { call: "POST /underwriting-cases/${c}/submit-for-census", payload: {}, as: Underwriter }
            - { call: "POST /underwriting-cases/${c}/census-snapshots", payload: { total_employees: 500, enrolled_employees: 400, dependent_count: 250, tier_distribution: { EE: 200, ES: 80, EC: 60, EF: 60 } }, as: Underwriter, captures: { cs: "$.data.id" } }
            - { call: "POST /census-snapshots/${cs}/validate", payload: {}, as: Underwriter }
            - { call: "POST /underwriting-cases/${c}/request-claims", payload: {}, as: Underwriter }
            - { call: "POST /underwriting-cases/${c}/claims-experiences", payload: { experience_period_start: "2024-01-01T00:00:00Z", experience_period_end: "2025-12-31T00:00:00Z", total_paid_claims_cents: 38400000, total_enrollment_months: 9600, large_claim_count: 0, pooling_threshold_cents: 5000000 }, as: Underwriter, captures: { cl: "$.data.id" } }
            - { call: "POST /claims-experiences/${cl}/submit", payload: {}, as: Underwriter, as_user_id: "uw-001" }
            - { call: "POST /claims-experiences/${cl}/review", payload: {}, as: SeniorUnderwriter, as_user_id: "su-001" }
            - { call: "POST /underwriting-cases/${c}/plan-designs", payload: { plan_name: "Reference PPO", deductible_individual: 0, deductible_family: 0, oop_max_individual: 200000, oop_max_family: 400000, coinsurance_pct: 1.0, copay_primary: 0, copay_specialist: 0, employer_contribution_pct: 0.8, contribution_strategy: "PERCENTAGE", is_reference_plan: true }, as: Underwriter, captures: { p: "$.data.id" } }
            - { call: "POST /plan-designs/${p}/model", payload: {}, as: Underwriter }
            - { call: "GET /underwriting-cases/${c}", payload: {}, as: Underwriter, captures: { cv1: "$.data.version" } }
          trigger:
            - { call: "POST /underwriting-cases/${c}/quotes", payload: { plan_design_id: "${p}", funding_type: "FULLY_INSURED", rate_guarantee_months: 12, enrollment_change_threshold: 0.1, expected_case_version: "${cv1}" }, as: Underwriter, captures: { n1: "$.data.quote_number" } }
            - { call: "GET /underwriting-cases/${c}", payload: {}, as: Underwriter, captures: { cv2: "$.data.version" } }
            - { call: "POST /underwriting-cases/${c}/quotes", payload: { plan_design_id: "${p}", funding_type: "FULLY_INSURED", rate_guarantee_months: 24, enrollment_change_threshold: 0.1, expected_case_version: "${cv2}" }, as: Underwriter, captures: { n2: "$.data.quote_number" } }
          assert:
            - "${n1} == 1"
            - "${n2} == 2"
  - section: state_machines
    instances:
      - name: validate_rejected_census_fails
        claim_type: invalid_transition
        grounds: [state_machines.CensusSnapshot.PENDING_to_VALIDATED, "errors[ERR_CENSUS_NOT_PENDING]"]
        excluded_because:
          difficulty_instance: state_beats_business_constraint_on_census_validate
          rationale: "Asserted as the primary error of the named §1.8 priority-conflict instance (validate on REJECTED census -> ERR_CENSUS_NOT_PENDING)."
      - name: propose_quote_twice_fails
        claim_type: idempotency
        grounds: [state_machines.Quote.DRAFT_to_PROPOSED, "errors[ERR_QUOTE_NOT_DRAFT]"]
        distinguishing_aspect: "Repeating the propose trigger on an already-PROPOSED quote fails with ERR_QUOTE_NOT_DRAFT; all computed rates remain from the first propose."
        test_recipe:
          setup: ["Case QUOTED; quote Q PROPOSED (reference plan, pepm 5338)"]
          setup_api_calls:
            - { call: "POST /brokers", payload: { firm_name: "Apex Benefits", license_number: "LIC-CA-1001", state_code: "CA", commission_pct: 0.04 }, as: Underwriter, captures: { b: "$.data.id" } }
            - { call: "POST /underwriting-cases", payload: { group_name: "IdemCo", group_size: 500, sic_code: "7372", state_code: "CA", effective_date: "2027-01-01T00:00:00Z", current_premium_annual: 24000000, current_renewal_date: "2026-12-31T00:00:00Z", funding_type: "FULLY_INSURED", broker_id: "${b}" }, as: Underwriter, captures: { c: "$.data.id" } }
            - { call: "POST /underwriting-cases/${c}/submit-for-census", payload: {}, as: Underwriter }
            - { call: "POST /underwriting-cases/${c}/census-snapshots", payload: { total_employees: 500, enrolled_employees: 400, dependent_count: 250, tier_distribution: { EE: 200, ES: 80, EC: 60, EF: 60 } }, as: Underwriter, captures: { cs: "$.data.id" } }
            - { call: "POST /census-snapshots/${cs}/validate", payload: {}, as: Underwriter }
            - { call: "POST /underwriting-cases/${c}/request-claims", payload: {}, as: Underwriter }
            - { call: "POST /underwriting-cases/${c}/claims-experiences", payload: { experience_period_start: "2024-01-01T00:00:00Z", experience_period_end: "2025-12-31T00:00:00Z", total_paid_claims_cents: 38400000, total_enrollment_months: 9600, large_claim_count: 0, pooling_threshold_cents: 5000000 }, as: Underwriter, captures: { cl: "$.data.id" } }
            - { call: "POST /claims-experiences/${cl}/submit", payload: {}, as: Underwriter, as_user_id: "uw-001" }
            - { call: "POST /claims-experiences/${cl}/review", payload: {}, as: SeniorUnderwriter, as_user_id: "su-001" }
            - { call: "POST /underwriting-cases/${c}/plan-designs", payload: { plan_name: "Reference PPO", deductible_individual: 0, deductible_family: 0, oop_max_individual: 200000, oop_max_family: 400000, coinsurance_pct: 1.0, copay_primary: 0, copay_specialist: 0, employer_contribution_pct: 0.8, contribution_strategy: "PERCENTAGE", is_reference_plan: true }, as: Underwriter, captures: { p: "$.data.id" } }
            - { call: "POST /plan-designs/${p}/model", payload: {}, as: Underwriter }
            - { call: "GET /underwriting-cases/${c}", payload: {}, as: Underwriter, captures: { cv: "$.data.version" } }
            - { call: "POST /underwriting-cases/${c}/quotes", payload: { plan_design_id: "${p}", funding_type: "FULLY_INSURED", rate_guarantee_months: 12, enrollment_change_threshold: 0.1, expected_case_version: "${cv}" }, as: Underwriter, captures: { q: "$.data.id" } }
            - { call: "POST /quotes/${q}/propose", payload: {}, as: Underwriter }
          trigger:
            - { call: "POST /quotes/${q}/propose", payload: {}, as: Underwriter, captures: { eid: "$.data.error_id" } }
          assert:
            - "${eid} == ERR_QUOTE_NOT_DRAFT"
            - "Quote.${q}.status == PROPOSED"
            - "Quote.${q}.pepm_rate_cents == 5338"
      - name: accept_countered_quote_fails
        claim_type: invalid_transition
        grounds: [state_machines.Quote.PROPOSED_to_ACCEPTED, "errors[ERR_QUOTE_NOT_PROPOSED]"]
        distinguishing_aspect: "Accept is only declared from PROPOSED; from COUNTERED it fails with ERR_QUOTE_NOT_PROPOSED and no cascade (plan stays MODELED, case stays NEGOTIATING)."
        test_recipe:
          setup: ["Case NEGOTIATING; quote Q COUNTERED after broker counter"]
          setup_api_calls:
            - { call: "POST /brokers", payload: { firm_name: "Apex Benefits", license_number: "LIC-CA-1001", state_code: "CA", commission_pct: 0.04 }, as: Underwriter, captures: { b: "$.data.id" } }
            - { call: "POST /underwriting-cases", payload: { group_name: "AccCo", group_size: 500, sic_code: "7372", state_code: "CA", effective_date: "2027-01-01T00:00:00Z", current_premium_annual: 24000000, current_renewal_date: "2026-12-31T00:00:00Z", funding_type: "FULLY_INSURED", broker_id: "${b}" }, as: Underwriter, captures: { c: "$.data.id" } }
            - { call: "POST /underwriting-cases/${c}/submit-for-census", payload: {}, as: Underwriter }
            - { call: "POST /underwriting-cases/${c}/census-snapshots", payload: { total_employees: 500, enrolled_employees: 400, dependent_count: 250, tier_distribution: { EE: 200, ES: 80, EC: 60, EF: 60 } }, as: Underwriter, captures: { cs: "$.data.id" } }
            - { call: "POST /census-snapshots/${cs}/validate", payload: {}, as: Underwriter }
            - { call: "POST /underwriting-cases/${c}/request-claims", payload: {}, as: Underwriter }
            - { call: "POST /underwriting-cases/${c}/claims-experiences", payload: { experience_period_start: "2024-01-01T00:00:00Z", experience_period_end: "2025-12-31T00:00:00Z", total_paid_claims_cents: 38400000, total_enrollment_months: 9600, large_claim_count: 0, pooling_threshold_cents: 5000000 }, as: Underwriter, captures: { cl: "$.data.id" } }
            - { call: "POST /claims-experiences/${cl}/submit", payload: {}, as: Underwriter, as_user_id: "uw-001" }
            - { call: "POST /claims-experiences/${cl}/review", payload: {}, as: SeniorUnderwriter, as_user_id: "su-001" }
