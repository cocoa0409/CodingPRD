        distinguishing_aspect: "Numeric threshold boundary: pct_sold >= 50 (inclusive) enters the 1.25 tier; at exactly 2 of 4 seats sold (pct_sold==50.0) an available base-10000 seat reads 12500 via GET /seats/{id}, not 10000."
        test_recipe:
          setup:
