# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — task_3056
# Career Agency Field Force Recruiting & Advisor Validation
#
# Nine §0.5 rules x 2 instances = 18 instances. Every instance grounds in an
# element already declared in SCAFFOLD.yaml §1.1–§1.7. Every ${var} traces to a
# `captures:` on an earlier line of the same instance. Every numeric assertion is
# a literal computed from the SCAFFOLD.yaml formula and its constants.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: selection_assessment_v1_vs_v2_weight_tables
        grounds:
          - calculations.selection_assessment_weighted_score
          - entities.SelectionAssessment.fields.weighted_score
          - entities.SelectionAssessment.fields.outcome
          - state_machines.RecruitingCandidate.SCREENED_to_ASSESSMENT_PENDING
        distinguishing_aspect: |
          The same competency vector {MARKET_KNOWLEDGE 4, RELATIONSHIP 10, RESILIENCE 10,
          ETHICS 8} yields weighted_score 8.29 (outcome PASS, >= 8.00) under the V1 weight
          table and weighted_score 7.69 (outcome CONDITIONAL, < 8.00) under V2 — a divergent
          band on a SelectionAssessment, an entity domain with no policy or money fields.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One district office. Two candidates, one scheduled with a V1 assessment and one with a V2 assessment."
          setup_api_calls:
            - call: "POST /agency/district-offices"
              payload: { office_code: "DO-101", name: "Great Lakes District", region_code: "MW", state_code: "WI", override_rate_pct: 0.03, override_cap_cents: 300000 }
              as: ManagingDirector
              captures: { office_id: $.data.id }
            - call: "POST /agency/recruiting-candidates"
              payload: { full_name: "Alicia V1", source_channel: "CAMPUS", campus_name: "UW Madison", district_office_id: "${office_id}", notes: "v1 arm" }
              as: RecruitingOfficer
              captures: { cand_v1_id: $.data.id }
            - call: "POST /agency/recruiting-candidates"
              payload: { full_name: "Blair V2", source_channel: "CAREER_CHANGER", district_office_id: "${office_id}", notes: "v2 arm" }
              as: RecruitingOfficer
              captures: { cand_v2_id: $.data.id }
            - call: "POST /agency/recruiting-candidates/${cand_v1_id}/screen"
              payload: {}
              as: RecruitingOfficer
            - call: "POST /agency/recruiting-candidates/${cand_v2_id}/screen"
              payload: {}
              as: RecruitingOfficer
            - call: "POST /agency/recruiting-candidates/${cand_v1_id}/schedule-assessment"
              payload: { assessment_version: "V1", scheduled_date: "2026-09-02T00:00:00Z" }
              as: RecruitingOfficer
              captures: { asm_v1_id: $.data.id }
            - call: "POST /agency/recruiting-candidates/${cand_v2_id}/schedule-assessment"
              payload: { assessment_version: "V2", scheduled_date: "2026-09-02T00:00:00Z" }
              as: RecruitingOfficer
              captures: { asm_v2_id: $.data.id }
          trigger:
            - call: "POST /agency/selection-assessments/${asm_v1_id}/score"
              payload: { raw_score: 78, competency_scores: { MARKET_KNOWLEDGE: 4, RELATIONSHIP: 10, RESILIENCE: 10, ETHICS: 8 } }
              as: RecruitingOfficer
              captures: { asm_v1_scored_id: $.data.id }
            - call: "POST /agency/selection-assessments/${asm_v2_id}/score"
              payload: { raw_score: 78, competency_scores: { MARKET_KNOWLEDGE: 4, RELATIONSHIP: 10, RESILIENCE: 10, ETHICS: 8 } }
              as: RecruitingOfficer
              captures: { asm_v2_scored_id: $.data.id }
          assert:
            - "SelectionAssessment.${asm_v1_scored_id}.weighted_score == 8.29 and outcome == PASS under the V1 table"
            - "SelectionAssessment.${asm_v2_scored_id}.weighted_score == 7.69 and outcome == CONDITIONAL under the V2 table"
            - "SelectionAssessment.${asm_v1_scored_id}.locked_weights.MARKET_KNOWLEDGE == 0.175 and locked_weights.ETHICS == 0.30"
            - "SelectionAssessment.${asm_v2_scored_id}.locked_weights.MARKET_KNOWLEDGE == 0.30 and locked_weights.RELATIONSHIP == 0.15"
            - "RecruitingCandidate.${cand_v1_id}.stage == ASSESSED and RecruitingCandidate.${cand_v2_id}.stage == ASSESSED"

      - name: training_allowance_flat_vs_production_draw
        grounds:
          - calculations.training_allowance_draw
          - entities.EmploymentContract.fields.training_allowance_paid_cents
          - endpoints.POST_/agency/training-allowance-draws
          - state_machines.Advisor.NOT_CONTRACTED_to_ACTIVE_TRAINING
        distinguishing_aspect: |
          The same 300000-cent validation requirement draws a flat 200000 cents on one
          EmploymentContract (FLAT_MONTHLY) and exactly 75000 cents on another
          (PRODUCTION_DRAW) — two contractual allowance variants producing different
          money on the EmploymentContract domain, not on a policy domain.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Two contracted advisors with identical 300000-cent requirements but different allowance modes, neither having met the 105000-cent product requirement."
          setup_api_calls:
            - call: "POST /agency/district-offices"
              payload: { office_code: "DO-201", name: "Badger District", region_code: "MW", state_code: "WI", override_rate_pct: 0.03, override_cap_cents: 300000 }
              as: ManagingDirector
              captures: { office_id: $.data.id }
            - call: "POST /agency/recruiting-candidates"
              payload: { full_name: "Flat Mode Recruit", source_channel: "REFERRAL", district_office_id: "${office_id}", notes: "flat" }
              as: RecruitingOfficer
              captures: { cand_flat_id: $.data.id }
            - call: "POST /agency/recruiting-candidates"
              payload: { full_name: "Draw Mode Recruit", source_channel: "REFERRAL", district_office_id: "${office_id}", notes: "draw" }
              as: RecruitingOfficer
              captures: { cand_draw_id: $.data.id }
            - call: "POST /agency/recruiting-candidates/${cand_flat_id}/screen"
              payload: {}
              as: RecruitingOfficer
            - call: "POST /agency/recruiting-candidates/${cand_flat_id}/schedule-assessment"
              payload: { assessment_version: "V2", scheduled_date: "2026-09-02T00:00:00Z" }
              as: RecruitingOfficer
              captures: { asm_flat_id: $.data.id }
            - call: "POST /agency/selection-assessments/${asm_flat_id}/score"
              payload: { raw_score: 80, competency_scores: { MARKET_KNOWLEDGE: 8, RELATIONSHIP: 8, RESILIENCE: 7, ETHICS: 9 } }
              as: RecruitingOfficer
            - call: "POST /agency/recruiting-candidates/${cand_flat_id}/advance-to-interview"
              payload: {}
              as: RecruitingOfficer
            - call: "POST /agency/recruiting-candidates/${cand_flat_id}/extend-offer"
              payload: {}
              as: DistrictDirector
            - call: "POST /agency/recruiting-candidates/${cand_flat_id}/accept-offer"
              payload: {}
              as: RecruitingOfficer
            - call: "POST /agency/recruiting-candidates/${cand_draw_id}/screen"
              payload: {}
              as: RecruitingOfficer
            - call: "POST /agency/recruiting-candidates/${cand_draw_id}/schedule-assessment"
              payload: { assessment_version: "V2", scheduled_date: "2026-09-02T00:00:00Z" }
              as: RecruitingOfficer
              captures: { asm_draw_id: $.data.id }
            - call: "POST /agency/selection-assessments/${asm_draw_id}/score"
              payload: { raw_score: 80, competency_scores: { MARKET_KNOWLEDGE: 8, RELATIONSHIP: 8, RESILIENCE: 7, ETHICS: 9 } }
              as: RecruitingOfficer
            - call: "POST /agency/recruiting-candidates/${cand_draw_id}/advance-to-interview"
              payload: {}
              as: RecruitingOfficer
            - call: "POST /agency/recruiting-candidates/${cand_draw_id}/extend-offer"
              payload: {}
              as: DistrictDirector
            - call: "POST /agency/recruiting-candidates/${cand_draw_id}/accept-offer"
              payload: {}
              as: RecruitingOfficer
            - call: "POST /agency/advisors"
              payload: { full_name: "Flat Mode Advisor", email: "flat.mode@agency.example", district_office_id: "${office_id}", rank: "REP" }
              as: ManagingDirector
              captures: { adv_flat_id: $.data.id }
            - call: "POST /agency/advisors"
              payload: { full_name: "Draw Mode Advisor", email: "draw.mode@agency.example", district_office_id: "${office_id}", rank: "REP" }
              as: ManagingDirector
              captures: { adv_draw_id: $.data.id }
            - call: "GET /agency/recruiting-candidates/${cand_flat_id}"
              payload: {}
              as: Any
              captures: { cand_flat_v: $.data.version }
            - call: "GET /agency/recruiting-candidates/${cand_draw_id}"
              payload: {}
              as: Any
              captures: { cand_draw_v: $.data.version }
            - call: "POST /agency/employment-contracts"
              payload: { advisor_id: "${adv_flat_id}", candidate_id: "${cand_flat_id}", contract_type: "FULL_TIME", start_date: "2026-09-03T00:00:00Z", training_allowance_total_cents: 1200000, training_allowance_mode: "FLAT_MONTHLY", validation_requirement_cents: 300000, expected_candidate_version: "${cand_flat_v}" }
              as: ManagingDirector
              captures: { con_flat_id: $.data.id }
            - call: "POST /agency/employment-contracts"
              payload: { advisor_id: "${adv_draw_id}", candidate_id: "${cand_draw_id}", contract_type: "FULL_TIME", start_date: "2026-09-03T00:00:00Z", training_allowance_total_cents: 1200000, training_allowance_mode: "PRODUCTION_DRAW", validation_requirement_cents: 300000, expected_candidate_version: "${cand_draw_v}" }
              as: ManagingDirector
              captures: { con_draw_id: $.data.id }
          trigger:
            - call: "POST /agency/training-allowance-draws"
              payload: { contract_id: "${con_flat_id}" }
              as: ManagingDirector
              captures: { con_flat_drawn_id: $.data.id }
            - call: "POST /agency/training-allowance-draws"
              payload: { contract_id: "${con_draw_id}" }
              as: ManagingDirector
              captures: { con_draw_drawn_id: $.data.id }
          assert:
            - "EmploymentContract.${con_flat_drawn_id}.training_allowance_paid_cents == 200000"
            - "EmploymentContract.${con_draw_drawn_id}.training_allowance_paid_cents == 75000"
            - "EmploymentContract.${con_flat_drawn_id}.training_allowance_paid_cents != EmploymentContract.${con_draw_drawn_id}.training_allowance_paid_cents"
            - "the recruiter override on each contract would be 15000 cents (round_2(300000 * 0.05)) but is NOT posted as a CommissionCredit row"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: assessment_intermediate_rounding_order_pinned
        grounds:
          - calculations.selection_assessment_weighted_score
          - entities.SelectionAssessment.fields.locked_weights
          - entities.RecruitingCandidate.fields.stage
        distinguishing_aspect: |
          Mode (b), nested rounding order: the pinned round-then-sum order yields
          weighted_score 8.88 for competency 9/9/8/9 under V1, whereas the rival
          sum-then-round reading yields 8.87 — the scaffold pins the intermediate
          rounding, and the two orders disagree by exactly one cent on this vector.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One district office. One V1 candidate moved to ASSESSMENT_PENDING."
          setup_api_calls:
            - call: "POST /agency/district-offices"
              payload: { office_code: "DO-102", name: "Kettle Moraine District", region_code: "MW", state_code: "WI", override_rate_pct: 0.03, override_cap_cents: 300000 }
              as: ManagingDirector
              captures: { office_id: $.data.id }
            - call: "POST /agency/recruiting-candidates"
              payload: { full_name: "Casey Rounding", source_channel: "CAMPUS", campus_name: "Marquette University", district_office_id: "${office_id}", notes: "rounding arm" }
              as: RecruitingOfficer
              captures: { cand_id: $.data.id }
            - call: "POST /agency/recruiting-candidates/${cand_id}/screen"
              payload: {}
              as: RecruitingOfficer
            - call: "POST /agency/recruiting-candidates/${cand_id}/schedule-assessment"
              payload: { assessment_version: "V1", scheduled_date: "2026-09-02T00:00:00Z" }
              as: RecruitingOfficer
              captures: { asm_id: $.data.id }
          trigger:
            - call: "POST /agency/selection-assessments/${asm_id}/score"
              payload: { raw_score: 88, competency_scores: { MARKET_KNOWLEDGE: 9, RELATIONSHIP: 9, RESILIENCE: 8, ETHICS: 9 } }
              as: RecruitingOfficer
              captures: { asm_scored_id: $.data.id }
          assert:
            - "SelectionAssessment.${asm_scored_id}.weighted_score == 8.88"
            - "SelectionAssessment.${asm_scored_id}.weighted_score != 8.87"
            - "SelectionAssessment.${asm_scored_id}.outcome == PASS"
            - "SelectionAssessment.${asm_scored_id}.raw_score == 88 and weighted_score != 8.80"

      - name: persistency_tier_selection_chain_with_renewal_base
        grounds:
          - calculations.persistency_rate_and_renewal
          - entities.PersistencyRecord.fields.persistency_tier
          - entities.Advisor.fields.renewal_commission_cents
          - state_machines.PersistencyRecord.PROVISIONAL_to_FINALIZED
        distinguishing_aspect: |
          Mode (a), >=3 inputs with non-linear interaction: persistency_pct, the
          tier it selects, the rate that tier pins, and a renewal base summed over the
          advisor's ACTIVE policies interact multiplicatively so that a one-policy
          change moves four fields at once — three VALIDATED policies carrying
          400000/400000/400000 of annual premium plus an INELIGIBLE-tier measurement
          produce renewal 0 and an advisor demotion, not a partial renewal.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-30T00:00:00Z. One district office, one MD, one DD (sponsor) and one VALIDATED REP with three ACTIVE policies totalling 1200000 cents annual premium, and a provisional measurement 25 issued / 20 persisted."
          setup_api_calls:
            - call: "POST /agency/district-offices"
              payload: { office_code: "DO-301", name: "Fox Valley District", region_code: "MW", state_code: "WI", override_rate_pct: 0.03, override_cap_cents: 300000 }
              as: ManagingDirector
              captures: { office_id: $.data.id }
            - call: "POST /agency/advisors"
              payload: { full_name: "Rowan Managing", email: "rowan.md@agency.example", district_office_id: "${office_id}", rank: "MANAGING_DIRECTOR" }
              as: ManagingDirector
              captures: { adv_md_id: $.data.id }
            - call: "POST /agency/advisors"
              payload: { full_name: "Dana Director", email: "dana.dd@agency.example", district_office_id: "${office_id}", sponsoring_advisor_id: "${adv_md_id}", rank: "DISTRICT_DIRECTOR" }
              as: ManagingDirector
              captures: { adv_dd_id: $.data.id }
            - call: "POST /agency/advisors"
              payload: { full_name: "Priya Producer", email: "priya.rep@agency.example", district_office_id: "${office_id}", sponsoring_advisor_id: "${adv_dd_id}", rank: "REP" }
              as: ManagingDirector
              captures: { adv_rep_id: $.data.id }
            - call: "POST /agency/advisors/${adv_rep_id}/licensing/lock-remediation"
              payload: {}
              as: ManagingDirector
            - call: "POST /agency/product-licenses"
              payload: { advisor_id: "${adv_rep_id}", product_line: "LIFE", license_number: "WI-LIFE-4001", effective_date: "2026-01-01T00:00:00Z", expires_at: "2027-12-31T00:00:00Z", appointment_required: true }
              as: LicensingCoordinator
              captures: { lic_id: $.data.id }
            - call: "POST /agency/product-licenses/${lic_id}/activate"
              payload: {}
              as: LicensingCoordinator
            - call: "POST /agency/securities-registrations"
              payload: { advisor_id: "${adv_rep_id}", registration_type: "SERIES_66", crd_number: "CRD-4001", effective_date: "2026-01-01T00:00:00Z", expires_at: "2027-12-31T00:00:00Z" }
              as: LicensingCoordinator
              captures: { reg_id: $.data.id }
            - call: "POST /agency/securities-registrations/${reg_id}/activate"
              payload: {}
              as: LicensingCoordinator
            - call: "POST /agency/carrier-appointments"
              payload: { advisor_id: "${adv_rep_id}", requires_license_id: "${lic_id}", carrier_name: "Northwestern Mutual", state_code: "WI", requested_date: "2026-01-05T00:00:00Z" }
              as: LicensingCoordinator
              captures: { appt_id: $.data.id }
            - call: "POST /agency/carrier-appointments/${appt_id}/approve"
              payload: {}
              as: LicensingCoordinator
            - call: "POST /agency/recruiting-candidates"
              payload: { full_name: "Priya Producer", source_channel: "REFERRAL", district_office_id: "${office_id}", notes: "validator" }
              as: RecruitingOfficer
              captures: { cand_id: $.data.id }
            - call: "POST /agency/recruiting-candidates/${cand_id}/screen"
              payload: {}
              as: RecruitingOfficer
            - call: "POST /agency/recruiting-candidates/${cand_id}/schedule-assessment"
              payload: { assessment_version: "V2", scheduled_date: "2026-01-06T00:00:00Z" }
              as: RecruitingOfficer
              captures: { asm_id: $.data.id }
            - call: "POST /agency/selection-assessments/${asm_id}/score"
              payload: { raw_score: 85, competency_scores: { MARKET_KNOWLEDGE: 8, RELATIONSHIP: 8, RESILIENCE: 7, ETHICS: 9 } }
              as: RecruitingOfficer
            - call: "POST /agency/recruiting-candidates/${cand_id}/advance-to-interview"
              payload: {}
              as: RecruitingOfficer
            - call: "POST /agency/recruiting-candidates/${cand_id}/extend-offer"
              payload: {}
              as: DistrictDirector
            - call: "POST /agency/recruiting-candidates/${cand_id}/accept-offer"
              payload: {}
              as: RecruitingOfficer
              captures: { cand_v: $.data.version }
            - call: "POST /agency/employment-contracts"
              payload: { advisor_id: "${adv_rep_id}", candidate_id: "${cand_id}", contract_type: "FULL_TIME", start_date: "2026-01-07T00:00:00Z", training_allowance_total_cents: 1200000, training_allowance_mode: "PRODUCTION_DRAW", validation_requirement_cents: 300000, expected_candidate_version: "${cand_v}" }
              as: ManagingDirector
              captures: { con_id: $.data.id, con_v: $.data.version }
            - call: "POST /agency/validation-periods"
              payload: { contract_id: "${con_id}", period_number: 1, start_date: "2026-01-08T00:00:00Z", end_date: "2026-12-31T00:00:00Z", required_production_cents: 100000, expected_contract_version: "${con_v}" }
              as: ManagingDirector
              captures: { vp_id: $.data.id }
            - call: "POST /agency/policies"
              payload: { policy_number: "NM-6001", writing_advisor_id: "${adv_rep_id}", carrier_name: "Northwestern Mutual", product_line: "LIFE", annual_premium_cents: 400000, issue_date: "2026-02-01T00:00:00Z", is_advanced_commission: true }
              as: ManagingDirector
              captures: { pol_1_id: $.data.id }
            - call: "POST /agency/policies"
              payload: { policy_number: "NM-6002", writing_advisor_id: "${adv_rep_id}", carrier_name: "Northwestern Mutual", product_line: "LIFE", annual_premium_cents: 400000, issue_date: "2026-02-01T00:00:00Z", is_advanced_commission: true }
              as: ManagingDirector
              captures: { pol_2_id: $.data.id }
            - call: "POST /agency/advisors/${adv_rep_id}/licensing/lock-remediation"
              payload: {}
              as: ManagingDirector
            - call: "POST /agency/policies"
              payload: { policy_number: "NM-6003", writing_advisor_id: "${adv_rep_id}", carrier_name: "Northwestern Mutual", product_line: "LIFE", annual_premium_cents: 400000, issue_date: "2026-02-01T00:00:00Z", is_advanced_commission: true }
              as: ManagingDirector
              captures: { pol_3_id: $.data.id }
            - call: "POST /agency/policies/${pol_1_id}/activate"
              payload: {}
              as: ManagingDirector
            - call: "POST /agency/policies/${pol_2_id}/activate"
              payload: {}
              as: ManagingDirector
            - call: "POST /agency/policies/${pol_3_id}/activate"
              payload: {}
              as: ManagingDirector
            - call: "POST /agency/validation-periods/${vp_id}/evaluate"
              payload: {}
              as: ManagingDirector
            - call: "POST /agency/persistency-records"
              payload: { advisor_id: "${adv_rep_id}", measurement_period: "2026-H1", measurement_start: "2026-01-01T00:00:00Z", measurement_end: "2026-06-30T00:00:00Z", policies_issued: 25, policies_persisted: 20 }
              as: ManagingDirector
              captures: { per_id: $.data.id }
          trigger:
            - call: "POST /agency/persistency-records/${per_id}/finalize"
