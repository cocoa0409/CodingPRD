      # ---- algorithm and variant rows carried by §1.8 -------------------------
      - name: tiered_pricing_boundary_walk
        claim_type: tiered_pricing
        grounds:
          - calculations.consignor_split
        distinguishing_aspect: "The split ladder must be exercised at a tier boundary with the clamp in play."
        excluded_because:
          difficulty_instance: consignor_split_max_clamp_beats_category_and_price_bonus
          rationale: "That §1.8 instance drives the ART category base plus the top price bonus past the 0.70 ceiling and asserts the clamp wins, which is the cross-tier straddling claim for this ladder."

      - name: aggregation_running_total_after_reversal_walk
        claim_type: aggregation
        grounds:
          - calculations.shrinkage_write_off
          - entities.Consignor.fields.unclaimed_balance_cents
        distinguishing_aspect: "A running ledger total must be correct after an append AND after a reversal, with no drift."
        excluded_because:
          difficulty_instance: sale_reversal_returns_the_ledger_to_its_pre_sale_balance
          rationale: "That §1.8 instance asserts the balance after the credit and again after the reversing debit, proving the aggregate is recomputed rather than patched."

      - name: decay_function_interval_walk
        claim_type: decay_function
        grounds:
          - calculations.markdown_price
        distinguishing_aspect: "The decay must apply exactly at the step's start_day_offset, not a day early or late."
        excluded_because:
          difficulty_instance: markdown_step_two_applies_at_exactly_day_thirty
          rationale: "That §1.8 instance pins day 29, day 30 and day 31 against the offset-30 step, covering the interval boundary of the decay curve."

      - name: waterfall_allocation_bucket_order_walk
        claim_type: waterfall_allocation
        grounds:
          - calculations.payout_disbursement
        distinguishing_aspect: "Withholding, method fee and net payout must be drawn from the balance in the declared order."
        excluded_because:
          difficulty_instance: payout_withholding_tier_keyed_on_pre_withholding_balance
          rationale: "That §1.8 instance proves the tier is read off the PRE-withholding balance and that the fee is taken after the withholding, which is the bucket-ordering claim."

      - name: constraint_propagation_fixed_point_walk
        claim_type: constraint_propagation
        grounds:
          - calculations.clearance_relocation_selector
        distinguishing_aspect: "A price change must propagate through the lot, the markdown and the zone selection and settle at a fixed point."
        excluded_because:
          difficulty_instance: component_downgrade_cascades_lot_price_into_clearance_relocation
          rationale: "That §1.8 instance walks the propagation to its fixed point and asserts the settled zone membership on both sides."

      - name: variant_divergence_walk
        claim_type: variant_divergence
        grounds:
          - calculations.photo_screening_score.variants
          - calculations.item_list_price.variants
        distinguishing_aspect: "The provisional and final variants of the grading chain must produce different prices from the same declared value."
        excluded_because:
          difficulty_instance: condition_grade_provisional_vs_final_list_price_diverges
          rationale: "That §1.8 instance asserts both frozen provisional columns and the overwritten final columns in one row, with the delta computed."

      - name: variant_reconciliation_walk
        claim_type: reconciliation
        grounds:
          - calculations.pickup_surcharge.variants
          - entities.PickupJob.fields.surcharge_variance_cents
        distinguishing_aspect: "When the surcharge switches from quoted to final, the variance must be recorded and only the final amount may hit the ledger."
        excluded_because:
          difficulty_instance: pickup_surcharge_quoted_vs_final_diverges
          rationale: "That §1.8 instance asserts surcharge_variance_cents as final minus quoted and proves the single ledger entry carries the final amount, never the quote or the delta."

