      - name: hangar_slot_release_restores_capacity
        grounds:
          - state_machines.HangarSlot.OCCUPIED_to_RELEASED
          - state_machines.HangarSlot.RESERVED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: hangar capacity (one slot per hangar_code per
          half-open interval). Forward action: WorkOrder.start occupies the
          slot (capacity consumed). Compensating action: WorkOrder.return-to-
          service releases the slot (capacity restored). Invariant: after a
          reserve -> occupy -> release cycle, a new overlapping reservation for
          the same hangar_code succeeds — proving capacity was conserved.
