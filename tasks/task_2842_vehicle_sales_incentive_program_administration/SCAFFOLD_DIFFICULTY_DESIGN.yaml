            - call: "POST /incentives/claims"
              payload: { delivery_id: "${delivery_id}", program_id: "${prog_id}", claimed_amount_cents: 130000, expected_program_version: "${pv}" }
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { claim_id: $.data.id, claim_vs_initial: $.data.validation_status }
          trigger:
            - call: "POST /incentives/claims/${claim_id}/adjudicate"
              payload: { decision: "APPROVE" }
              as: ClaimsAuditor
              as_user_id: "u-auditor-2"
            - call: "GET /incentives/claims/${claim_id}"
              payload: {}
              as: ClaimsAuditor
              as_user_id: "u-auditor-2"
              captures: { claim_vs_mid: $.data.validation_status, claim_amt_mid: $.data.approved_amount_cents, claim_adj_mid: $.data.adjudicated_by_user_id }
            - call: "GET /incentives/programs/${prog_id}/spend-summary"
