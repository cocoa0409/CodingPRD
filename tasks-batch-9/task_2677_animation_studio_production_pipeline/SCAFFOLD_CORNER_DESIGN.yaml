  - section: errors
    instances:
      - name: asset_relink_creating_a_cycle_rejects
        claim_type: triggerable_error
        grounds:
          - errors[ERR_ASSET_REUSE_CYCLE]
          - validations[priority=22]
          - endpoints[POST /studio/assets/{id}/relink-source]
        distinguishing_aspect: |
          The cycle check walks the prospective chain, not just the immediate edge: pointing the root at its
          own descendant is refused with 422 and the root keeps depth 0, so no half-applied edge is left
          behind. Relinking to an unrelated asset in the same production is accepted.
        test_recipe:
          setup:
            - "production AD01 is PRE_PRODUCTION"
            - "asset A is a root; asset B derives from A; asset C is an unrelated root in the same production"
          setup_api_calls:
            - call: "POST /studio/productions"
              payload: { title: "Aurora Drift", production_code: "AD01", format: "FEATURE", budget_cents: 100000000, render_allowance_cents: 5000000, master_color_space: "ACEScg" }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { prod_id: "$.data.id" }
            - call: "POST /studio/assets"
              payload: { production_id: "${prod_id}", asset_code: "AD01_PROP_A", asset_type: "PROP", base_complexity_points: 100.00 }
              as: Artist
              as_user_id: "u-artist-01"
              captures: { a_id: "$.data.id" }
            - call: "POST /studio/assets"
              payload: { production_id: "${prod_id}", asset_code: "AD01_PROP_B", asset_type: "PROP", base_complexity_points: 80.00, derived_from_asset_id: "${a_id}" }
              as: Artist
              as_user_id: "u-artist-01"
              captures: { b_id: "$.data.id", b_depth: "$.data.reuse_depth" }
            - call: "POST /studio/assets"
              payload: { production_id: "${prod_id}", asset_code: "AD01_PROP_C", asset_type: "PROP", base_complexity_points: 60.00 }
              as: Artist
              as_user_id: "u-artist-01"
              captures: { c_id: "$.data.id" }
          trigger:
            - call: "POST /studio/assets/${a_id}/relink-source"
              payload: { derived_from_asset_id: "${b_id}" }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { err_cycle: "$.data.error_id" }
            - call: "GET /studio/assets/${a_id}"
              as: Artist
              captures: { a_src_after: "$.data.derived_from_asset_id", a_depth_after: "$.data.reuse_depth", a_points_after: "$.data.effective_complexity_points" }
            - call: "POST /studio/assets/${a_id}/relink-source"
              payload: { derived_from_asset_id: "${a_id}" }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { err_self: "$.data.error_id" }
            - call: "POST /studio/assets/${b_id}/relink-source"
              payload: { derived_from_asset_id: "${c_id}" }
              as: ProductionManager
              as_user_id: "u-pm-01"
              captures: { b_src_ok: "$.data.derived_from_asset_id", b_depth_ok: "$.data.reuse_depth", b_disc_ok: "$.data.reuse_discount_pct" }
          assert:
            - "${b_depth} == 1 at setup time"
            - "the relink of A to its own descendant returns 422 with ${err_cycle} == ERR_ASSET_REUSE_CYCLE"
            - "${a_src_after} is null, ${a_depth_after} == 0 and ${a_points_after} == 100.00 — the rejected relink changed nothing"
            - "the self-link returns 422 with ${err_self} == ERR_ASSET_REUSE_CYCLE (a 1-node cycle is still a cycle)"
            - "${b_src_ok} == ${c_id} with ${b_depth_ok} == 1 and ${b_disc_ok} == 0.00, because C is not LIBRARY_APPROVED"
      - name: partner_approval_without_certification_rejects
        claim_type: triggerable_error
        grounds:
