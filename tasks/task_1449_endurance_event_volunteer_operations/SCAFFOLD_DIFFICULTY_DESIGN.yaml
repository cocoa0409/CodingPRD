            - "precondition evidence: TrainingRecord.${tr1}.status == EXPIRED (${tr_st}) so the safety check WOULD also fail"
            - "precondition evidence: Signup.${sg1}.status == CANCELLED (${sg_st}) so the state check fails first"
            - "approve rejected with error_id == ERR_SIGNUP_NOT_APPROVABLE (${err}), never ERR_TRAINING_NOT_CURRENT — state (p4) beats business_safety (p7)"

      - name: create_safety_beats_temporal_underage_before_window
        grounds:
          - validations[priority=5]
          - validations[priority=8]
          - calculations.age_years_on_event
        distinguishing_aspect: |
          Error-category pair (business_safety vs business_temporal) on signup
          CREATE — a different pair than instance above: volunteer is 17 against a
          min_age 18 role AND the clock is before early_access_opens_at; create MUST
          surface ERR_MIN_AGE_NOT_MET because safety (p5) precedes temporal (p8).
        test_recipe:
          setup:
            - "Event PUBLISHED; role min_age_years 18; volunteer DOB 2008-10-05 -> 17 on event date 2026-10-04, ELIGIBLE"
            - "Clock at 2026-08-01T00:00:00Z (before early_access_opens_at 2026-08-10) — window closed"
          setup_api_calls:
            - { call: "POST /volunteer-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: EventDirector }
            - { call: "POST /volunteer-ops/events", payload: { name: "City Marathon", event_start_at: "2026-10-04T06:00:00Z", event_end_at: "2026-10-04T22:00:00Z", early_access_opens_at: "2026-08-10T00:00:00Z", signup_opens_at: "2026-08-17T00:00:00Z", signup_closes_at: "2026-09-27T00:00:00Z" }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /volunteer-ops/course-segments", payload: { event_id: "${ev}", segment_code: "SEG-A", mile_start: 5, mile_end: 10, terrain_type: ROAD }, as: VolunteerCoordinator, captures: { seg: $.data.id } }
            - { call: "POST /volunteer-ops/role-catalog-entries", payload: { event_id: "${ev}", role_code: "MARSHAL", title: "Course Marshal", min_age_years: 18 }, as: VolunteerCoordinator, captures: { role: $.data.id } }
            - { call: "POST /volunteer-ops/shifts", payload: { event_id: "${ev}", role_entry_id: "${role}", segment_id: "${seg}", start_at: "2026-10-04T07:00:00Z", end_at: "2026-10-04T11:00:00Z", required_headcount: 1 }, as: VolunteerCoordinator, captures: { sh: $.data.id } }
            - { call: "POST /volunteer-ops/events/${ev}/publish", payload: {}, as: EventDirector }
            - { call: "POST /volunteer-ops/volunteers", payload: { event_id: "${ev}", full_name: "V Young", date_of_birth: "2008-10-05" }, as: Anonymous, captures: { v1: $.data.id } }
            - { call: "POST /volunteer-ops/volunteers/${v1}/screen", payload: {}, as: VolunteerCoordinator }
          trigger:
            - { call: "POST /volunteer-ops/signups", payload: { volunteer_id: "${v1}", shift_id: "${sh}" }, as: VolunteerCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "rejected with error_id == ERR_MIN_AGE_NOT_MET (${err}), never ERR_SIGNUP_WINDOW_CLOSED — business_safety (p5) beats business_temporal (p8)"
            - "no Signup row created for (${v1}, ${sh})"

      - name: create_temporal_beats_constraint_window_vs_overlap
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - calculations.volunteer_overlap_rule
        distinguishing_aspect: |
          Error-category pair (business_temporal vs business_constraint) — the third
          distinct pair: signup create at a closed window AND with a genuine
          buffer-overlap conflict MUST surface ERR_SIGNUP_WINDOW_CLOSED because
          temporal (p8) precedes constraint (p9).
        test_recipe:
          setup:
            - "V1 APPROVED on S1 07:00-11:00 (segA); S2 10:00-12:00 on segB (overlaps S1 under the 30-min cross-segment buffer)"
            - "Clock at 2026-09-28T00:00:00Z — after signup_closes_at 2026-09-27, before race day; event still PUBLISHED (no sweep ran)"
          setup_api_calls:
            - { call: "POST /volunteer-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: EventDirector }
            - { call: "POST /volunteer-ops/events", payload: { name: "City Marathon", event_start_at: "2026-10-04T06:00:00Z", event_end_at: "2026-10-04T22:00:00Z", early_access_opens_at: "2026-08-10T00:00:00Z", signup_opens_at: "2026-08-17T00:00:00Z", signup_closes_at: "2026-09-27T00:00:00Z" }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /volunteer-ops/course-segments", payload: { event_id: "${ev}", segment_code: "SEG-A", mile_start: 5, mile_end: 10, terrain_type: ROAD }, as: VolunteerCoordinator, captures: { segA: $.data.id } }
            - { call: "POST /volunteer-ops/course-segments", payload: { event_id: "${ev}", segment_code: "SEG-B", mile_start: 10, mile_end: 15, terrain_type: TRAIL }, as: VolunteerCoordinator, captures: { segB: $.data.id } }
            - { call: "POST /volunteer-ops/role-catalog-entries", payload: { event_id: "${ev}", role_code: "MARSHAL", title: "Course Marshal", min_age_years: 16 }, as: VolunteerCoordinator, captures: { role: $.data.id } }
            - { call: "POST /volunteer-ops/shifts", payload: { event_id: "${ev}", role_entry_id: "${role}", segment_id: "${segA}", start_at: "2026-10-04T07:00:00Z", end_at: "2026-10-04T11:00:00Z", required_headcount: 1 }, as: VolunteerCoordinator, captures: { sh1: $.data.id } }
            - { call: "POST /volunteer-ops/shifts", payload: { event_id: "${ev}", role_entry_id: "${role}", segment_id: "${segB}", start_at: "2026-10-04T10:00:00Z", end_at: "2026-10-04T12:00:00Z", required_headcount: 1 }, as: VolunteerCoordinator, captures: { sh2: $.data.id } }
            - { call: "POST /volunteer-ops/events/${ev}/publish", payload: {}, as: EventDirector }
