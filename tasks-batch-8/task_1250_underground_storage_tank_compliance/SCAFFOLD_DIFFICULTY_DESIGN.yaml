# =============================================================================
# §1.8 Scaffold Difficulty Design — task_1250_underground_storage_tank_compliance
# Test Targeting Index: 2 instances per Difficulty Rule (§0.5), cross-referenced
# against SCAFFOLD.yaml §1.1–§1.7.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: cp_survey_criterion_divergence_same_readings
        grounds:
          - calculations.cp_survey_determination
          - entities.ResultRecord.fields.outcome
          - state_machines.ServiceOrder.IN_PROGRESS_to_UNDER_REVIEW
        distinguishing_aspect: |
          Dual-variant logic on the CP-survey entity domain: one identical voltage
          triple {instant_off_mv: -800, polarized_mv: -700, native_mv: -500} FAILs
          under criterion INSTANT_OFF (-800 > -850 bound) and PASSes under
          criterion POLARIZATION_SHIFT (native - polarized = 200 >= 100).
        test_recipe:
          setup:
            - "Facility ACTIVE with one IN_SERVICE tank carrying a CATHODIC_PROTECTION component"
            - "Technician t_cp holds endorsement CP_TESTER; technician t_rev is the reviewer"
            - "Two CP_SURVEY orders on the same tank/component, each SCHEDULED then started inside its window"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /facilities", payload: { facility_name: "CP Site", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z", fund_program_election: "PER_OCCURRENCE" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank: $.data.id } }
            - { call: "POST /facilities/${fac}/activate", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /tank-systems/${tank}/place-in-service", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /components", payload: { tank_system_id: "${tank}", component_type: "CATHODIC_PROTECTION", install_date: "2018-01-01T00:00:00Z", serial_no: "CP-1" }, as: FacilityOwner, as_user_id: "owner-1", captures: { comp: $.data.id } }
            - { call: "POST /technicians", payload: { full_name: "CP Tester", endorsements: ["CP_TESTER"], trainer: false }, as: ContractorAdmin, captures: { t_cp: $.data.id } }
            - { call: "POST /service-orders", payload: { facility_id: "${fac}", tank_system_id: "${tank}", service_type: "CP_SURVEY", component_id: "${comp}", line_items: [{ description: "cp survey", qty: 1, unit_price_cents: 40000 }] }, as: ContractorAdmin, captures: { so1: $.data.id } }
            - { call: "POST /service-orders/${so1}/schedule", payload: { technician_id: "${t_cp}", window_start: "2026-05-02T10:00:00Z", window_end: "2026-05-02T11:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T10:30:00Z" }, as: ContractorAdmin }
            - { call: "POST /service-orders/${so1}/start", payload: {}, as: Technician, as_user_id: "${t_cp}" }
            - { call: "POST /service-orders", payload: { facility_id: "${fac}", tank_system_id: "${tank}", service_type: "CP_SURVEY", component_id: "${comp}", line_items: [{ description: "cp survey 2", qty: 1, unit_price_cents: 40000 }] }, as: ContractorAdmin, captures: { so2: $.data.id } }
            - { call: "POST /service-orders/${so2}/schedule", payload: { technician_id: "${t_cp}", window_start: "2026-05-03T10:00:00Z", window_end: "2026-05-03T11:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T10:30:00Z" }, as: ContractorAdmin }
            - { call: "POST /service-orders/${so2}/start", payload: {}, as: Technician, as_user_id: "${t_cp}" }
          trigger:
            - call: "POST /service-orders/${so1}/results"
              payload: { readings: { instant_off_mv: -800, polarized_mv: -700, native_mv: -500, valid_contact: true, criterion: "INSTANT_OFF" } }
              as: Technician
              as_user_id: "${t_cp}"
            - call: "POST /service-orders/${so2}/results"
              payload: { readings: { instant_off_mv: -800, polarized_mv: -700, native_mv: -500, valid_contact: true, criterion: "POLARIZATION_SHIFT" } }
              as: Technician
              as_user_id: "${t_cp}"
            - { call: "GET /result-records?service_order_id=${so1}", as: Any, captures: { r1_outcome: "$.data[0].outcome" } }
            - { call: "GET /result-records?service_order_id=${so2}", as: Any, captures: { r2_outcome: "$.data[0].outcome" } }
          assert:
            - "${r1_outcome} == FAIL (INSTANT_OFF criterion: -800 is not <= -850)"
            - "${r2_outcome} == PASS (POLARIZATION_SHIFT criterion: -500 - (-700) = 200 >= 100)"
            - "${r1_outcome} != ${r2_outcome}: identical voltage triples diverge across the two valid criteria"
            - "A MAJOR Deficiency exists with source_service_order_id == ${so1}; no Deficiency exists with source_service_order_id == ${so2}"

      - name: fund_claim_election_changes_payable
        grounds:
          - calculations.fund_reimbursement_amount
          - entities.StateFundClaim.fields.payable_amount_cents
          - entities.Facility.fields.fund_program_election
        distinguishing_aspect: |
          Dual-variant logic on the StateFundClaim entity domain (distinct from the
          CP-survey domain): identical expense_lines of 3000000 cents yield
          payable 1800000 under PER_OCCURRENCE election vs 1000000 under AGGREGATE
          election on an untouched deductible pool.
        test_recipe:
          setup:
            - "Facility F1 with election PER_OCCURRENCE and facility F2 with election AGGREGATE, both ACTIVE with a CONFIRMED release and fees paid through 2027-01-01"
            - "Logical clock at 2026-05-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /facilities", payload: { facility_name: "F1 Occurrence", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z", fund_program_election: "PER_OCCURRENCE" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac1: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac1}", tank_tag: "T1", substance: "GASOLINE", capacity_gallons: 8000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "FRP", piping_type: "SUCTION", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank1: $.data.id } }
            - { call: "POST /facilities/${fac1}/activate", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /tank-systems/${tank1}/place-in-service", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /release-events", payload: { facility_id: "${fac1}", discovered_at: "2026-05-01T08:00:00Z", source_description: "interstitial alarm" }, as: FacilityOwner, as_user_id: "owner-1", captures: { rel1: $.data.id } }
            - { call: "POST /release-events/${rel1}/confirm", payload: {}, as: StateRegulator }
            - { call: "POST /facilities", payload: { facility_name: "F2 Aggregate", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z", fund_program_election: "AGGREGATE" }, as: FacilityOwner, as_user_id: "owner-2", captures: { fac2: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac2}", tank_tag: "T1", substance: "GASOLINE", capacity_gallons: 8000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "FRP", piping_type: "SUCTION", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-2", captures: { tank2: $.data.id } }
            - { call: "POST /facilities/${fac2}/activate", payload: {}, as: FacilityOwner, as_user_id: "owner-2" }
            - { call: "POST /tank-systems/${tank2}/place-in-service", payload: {}, as: FacilityOwner, as_user_id: "owner-2" }
            - { call: "POST /release-events", payload: { facility_id: "${fac2}", discovered_at: "2026-05-01T08:00:00Z", source_description: "sheen observed" }, as: FacilityOwner, as_user_id: "owner-2", captures: { rel2: $.data.id } }
            - { call: "POST /release-events/${rel2}/confirm", payload: {}, as: StateRegulator }
          trigger:
            - call: "POST /fund-claims"
              payload: { facility_id: "${fac1}", release_event_id: "${rel1}", expense_lines: [{ description: "cleanup", amount_cents: 3000000 }] }
              as: FacilityOwner
              as_user_id: "owner-1"
              captures: { c1_payable: $.data.payable_amount_cents, c1_ded: $.data.deductible_applied_cents }
            - call: "POST /fund-claims"
              payload: { facility_id: "${fac2}", release_event_id: "${rel2}", expense_lines: [{ description: "cleanup", amount_cents: 3000000 }] }
              as: FacilityOwner
              as_user_id: "owner-2"
              captures: { c2_payable: $.data.payable_amount_cents, c2_ded: $.data.deductible_applied_cents }
          assert:
            - "${c1_ded} == 1000000 (per-occurrence deductible)"
            - "${c1_payable} == 1800000 (round_half_up((3000000 - 1000000) * 0.90))"
            - "${c2_ded} == 2000000 (aggregate pool drained first)"
            - "${c2_payable} == 1000000 (100% payout after aggregate deductible)"
            - "Identical expense_lines produce different payable_amount_cents across the two elections: ${c1_payable} != ${c2_payable}"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: posture_score_weighted_sum_tier_boundary
        grounds:
          - calculations.compliance_posture_score
          - calculations.monthly_close_sweep
          - entities.Facility.fields.posture_score
          - entities.Facility.fields.compliance_posture
        distinguishing_aspect: |
          Mode (a) combinatorial: weighted multi-input formula (open deficiencies by
          severity, open releases, lapsed operators) with floor/ceiling clamp and a
          tiered branch at 85/60 — score moves 85 -> 70 (DEFICIENT) on a MAJOR
          failure and 70 -> 85 (COMPLIANT, inclusive boundary) on verification.
        test_recipe:
          setup:
            - "Facility ACTIVE, tank IN_SERVICE with a CATHODIC_PROTECTION component"
            - "One SUSPECTED release open (posture -10)"
            - "One class-C operator whose cert completed 2025-06-01 lapses at the 2026-05 monthly close run on 2026-06-11 (posture -5)"
            - "A 2026-05 release-detection record exists so the sweep creates no deficiency"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /facilities", payload: { facility_name: "Posture Site", state_code: "WA", annual_fee_paid_through: "2027-01-01T00:00:00Z", fund_program_election: "PER_OCCURRENCE" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank: $.data.id } }
            - { call: "POST /facilities/${fac}/activate", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /tank-systems/${tank}/place-in-service", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /components", payload: { tank_system_id: "${tank}", component_type: "CATHODIC_PROTECTION", install_date: "2018-01-01T00:00:00Z", serial_no: "CP-9" }, as: FacilityOwner, as_user_id: "owner-1", captures: { comp: $.data.id } }
            - { call: "POST /release-events", payload: { facility_id: "${fac}", discovered_at: "2026-05-01T08:00:00Z", source_description: "ATG alarm" }, as: FacilityOwner, as_user_id: "owner-1", captures: { rel: $.data.id } }
            - { call: "POST /technicians", payload: { full_name: "Trainer Tess", endorsements: [], trainer: true }, as: ContractorAdmin, captures: { t_trainer: $.data.id } }
            - { call: "POST /operators", payload: { facility_id: "${fac}", full_name: "Op A", operator_class: "C" }, as: FacilityOwner, as_user_id: "owner-1", captures: { op: $.data.id } }
            - { call: "POST /training-records", payload: { operator_id: "${op}", course_class: "C", completed_at: "2025-06-01T00:00:00Z" }, as: Technician, as_user_id: "${t_trainer}", captures: { tr1: $.data.id } }
            - { call: "POST /operators/${op}/activate", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /release-detection-records", payload: { tank_system_id: "${tank}", period_month: "2026-05", readings_summary: { atg_log: "clean" } }, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-11T00:00:00Z" }, as: ContractorAdmin }
            - call: "POST /facilities/${fac}/run-monthly-close"
              payload: { period_month: "2026-05" }
              as: ContractorAdmin
              captures: { mc_created: $.data.deficiencies_created, mc_lapsed: $.data.operators_lapsed, mc_score: $.data.posture_score }
            - { call: "POST /technicians", payload: { full_name: "CP Tester", endorsements: ["CP_TESTER"], trainer: false }, as: ContractorAdmin, captures: { t_cp: $.data.id } }
            - { call: "POST /technicians", payload: { full_name: "Reviewer Ray", endorsements: [], trainer: false }, as: ContractorAdmin, captures: { t_rev: $.data.id } }
            - { call: "POST /service-orders", payload: { facility_id: "${fac}", tank_system_id: "${tank}", service_type: "CP_SURVEY", component_id: "${comp}", line_items: [{ description: "cp", qty: 1, unit_price_cents: 40000 }] }, as: ContractorAdmin, captures: { so1: $.data.id } }
            - { call: "POST /service-orders/${so1}/schedule", payload: { technician_id: "${t_cp}", window_start: "2026-06-12T10:00:00Z", window_end: "2026-06-12T11:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-12T10:30:00Z" }, as: ContractorAdmin }
            - { call: "POST /service-orders/${so1}/start", payload: {}, as: Technician, as_user_id: "${t_cp}" }
          trigger:
            - call: "POST /service-orders/${so1}/results"
              payload: { readings: { instant_off_mv: -800, polarized_mv: -700, native_mv: -500, valid_contact: true, criterion: "INSTANT_OFF" } }
              as: Technician
              as_user_id: "${t_cp}"
            - { call: "GET /facilities/${fac}", as: Any, captures: { score_mid: $.data.posture_score, posture_mid: $.data.compliance_posture } }
            - { call: "GET /deficiencies?source_service_order_id=${so1}", as: Any, captures: { d1: "$.data[0].id" } }
            - { call: "POST /deficiencies/${d1}/order-correction", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /deficiencies/${d1}/mark-corrected", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /service-orders", payload: { facility_id: "${fac}", tank_system_id: "${tank}", service_type: "CP_SURVEY", component_id: "${comp}", line_items: [{ description: "cp retest", qty: 1, unit_price_cents: 40000 }], linked_deficiency_id: "${d1}" }, as: ContractorAdmin, captures: { so2: $.data.id } }
            - { call: "POST /service-orders/${so2}/schedule", payload: { technician_id: "${t_cp}", window_start: "2026-06-13T10:00:00Z", window_end: "2026-06-13T11:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-13T10:30:00Z" }, as: ContractorAdmin }
            - { call: "POST /service-orders/${so2}/start", payload: {}, as: Technician, as_user_id: "${t_cp}" }
            - call: "POST /service-orders/${so2}/results"
              payload: { readings: { instant_off_mv: -900, polarized_mv: -950, native_mv: -600, valid_contact: true, criterion: "INSTANT_OFF" } }
              as: Technician
              as_user_id: "${t_cp}"
            - { call: "POST /service-orders/${so2}/certify", payload: {}, as: ComplianceReviewer, as_user_id: "${t_rev}" }
            - { call: "GET /facilities/${fac}", as: Any, captures: { score_final: $.data.posture_score, posture_final: $.data.compliance_posture } }
            - { call: "GET /deficiencies/${d1}", as: Any, captures: { d1_status: $.data.status } }
          assert:
            - "${mc_created} == 0 and ${mc_lapsed} == 1"
            - "${mc_score} == 85 (100 - 10 open release - 5 lapsed operator)"
            - "${score_mid} == 70 and ${posture_mid} == DEFICIENT (85 - 15 MAJOR deficiency crosses the 85 tier boundary)"
            - "${score_final} == 85 and ${posture_final} == COMPLIANT (exactly 85 satisfies the inclusive COMPLIANT bound)"
            - "${d1_status} == VERIFIED_CLOSED"

      - name: quote_per_line_rounding_beats_sum_rounding
        grounds:
          - calculations.service_quote_total
          - entities.ServiceOrder.fields.quote_total_cents
        distinguishing_aspect: |
          Mode (b) combinatorial: nested rounding order is pinned — each line is
          rounded half-up to cents BEFORE summation, then the flat mobilization fee
          is added; two 0.5 x 10001-cent lines produce 25002 total, whereas the
          alternative sum-then-round order produces 25001.
        test_recipe:
          setup:
            - "Facility with one tank (order creation does not require activation)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /facilities", payload: { facility_name: "Quote Site", state_code: "OR", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank: $.data.id } }
          trigger:
            - call: "POST /service-orders"
              payload:
                facility_id: "${fac}"
                tank_system_id: "${tank}"
                service_type: "TANK_TIGHTNESS"
                line_items:
                  - { description: "tightness labor", qty: 0.5, unit_price_cents: 10001 }
                  - { description: "report prep", qty: 0.5, unit_price_cents: 10001 }
              as: ContractorAdmin
              captures: { quote: $.data.quote_total_cents }
          assert:
            - "${quote} == 25002 (round_half_up(0.5 * 10001) = 5001 per line; 5001 + 5001 + 15000 mobilization)"
            - "The rejected alternative order (sum exact 10001.0 + 10001.0... then round) would yield 25001 — the per-line-first order is the pinned behavior"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: service_order_review_rework_cycle
        grounds:
          - state_machines.ServiceOrder.IN_PROGRESS_to_UNDER_REVIEW
          - state_machines.ServiceOrder.UNDER_REVIEW_to_IN_PROGRESS
          - state_machines.ServiceOrder.UNDER_REVIEW_to_CERTIFIED
        distinguishing_aspect: |
          Cyclic machine on ServiceOrder: the reviewer returns the order
          (UNDER_REVIEW -> IN_PROGRESS), a second immutable ResultRecord is
          recorded, and the order converges to CERTIFIED with both records
          preserved in history.
        test_recipe:
          setup:
            - "Facility ACTIVE, tank IN_SERVICE with CATHODIC_PROTECTION component"
            - "CP_SURVEY order SCHEDULED and started by t_cp; reviewer t_rev available"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /facilities", payload: { facility_name: "Rework Site", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank: $.data.id } }
            - { call: "POST /facilities/${fac}/activate", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /tank-systems/${tank}/place-in-service", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /components", payload: { tank_system_id: "${tank}", component_type: "CATHODIC_PROTECTION", install_date: "2018-01-01T00:00:00Z", serial_no: "CP-2" }, as: FacilityOwner, as_user_id: "owner-1", captures: { comp: $.data.id } }
            - { call: "POST /technicians", payload: { full_name: "CP Tester", endorsements: ["CP_TESTER"], trainer: false }, as: ContractorAdmin, captures: { t_cp: $.data.id } }
            - { call: "POST /technicians", payload: { full_name: "Reviewer", endorsements: [], trainer: false }, as: ContractorAdmin, captures: { t_rev: $.data.id } }
            - { call: "POST /service-orders", payload: { facility_id: "${fac}", tank_system_id: "${tank}", service_type: "CP_SURVEY", component_id: "${comp}", line_items: [{ description: "cp", qty: 1, unit_price_cents: 40000 }] }, as: ContractorAdmin, captures: { so: $.data.id } }
            - { call: "POST /service-orders/${so}/schedule", payload: { technician_id: "${t_cp}", window_start: "2026-05-02T10:00:00Z", window_end: "2026-05-02T11:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T10:30:00Z" }, as: ContractorAdmin }
            - { call: "POST /service-orders/${so}/start", payload: {}, as: Technician, as_user_id: "${t_cp}" }
          trigger:
            - call: "POST /service-orders/${so}/results"
              payload: { readings: { instant_off_mv: -900, polarized_mv: -950, native_mv: -600, valid_contact: false, criterion: "INSTANT_OFF" } }
              as: Technician
              as_user_id: "${t_cp}"
            - { call: "POST /service-orders/${so}/return-for-correction", payload: {}, as: ComplianceReviewer, as_user_id: "${t_rev}" }
            - call: "POST /service-orders/${so}/results"
              payload: { readings: { instant_off_mv: -900, polarized_mv: -950, native_mv: -600, valid_contact: true, criterion: "INSTANT_OFF" } }
              as: Technician
              as_user_id: "${t_cp}"
            - { call: "POST /service-orders/${so}/certify", payload: {}, as: ComplianceReviewer, as_user_id: "${t_rev}" }
            - { call: "GET /service-orders/${so}", as: Any, captures: { so_status: $.data.status, so_outcome: $.data.result_outcome } }
            - { call: "GET /result-records?service_order_id=${so}", as: Any, captures: { r_first: "$.data[0].outcome", r_second: "$.data[1].outcome" } }
          assert:
            - "${so_status} == CERTIFIED after the loop IN_PROGRESS -> UNDER_REVIEW -> IN_PROGRESS -> UNDER_REVIEW -> CERTIFIED"
            - "${r_first} == INCONCLUSIVE (valid_contact false ignores voltages)"
            - "${r_second} == PASS"
            - "${so_outcome} == PASS (latest record wins)"
            - "Two ResultRecords exist for the order — rework history is append-only, the first record was not mutated"

      - name: deficiency_retest_loop_after_failed_verify
        grounds:
          - state_machines.Deficiency.RE_TEST_SCHEDULED_to_CORRECTION_ORDERED
          - state_machines.Deficiency.RE_TEST_SCHEDULED_to_VERIFIED_CLOSED
          - state_machines.ServiceOrder.UNDER_REVIEW_to_CERTIFIED
        distinguishing_aspect: |
          Cyclic machine on Deficiency (a different entity than ServiceOrder): a
          certified re-test with outcome FAIL loops RE_TEST_SCHEDULED back to
          CORRECTION_ORDERED, and only a certified PASS converges to the terminal
          VERIFIED_CLOSED with verified_by_service_order_id pinned.
        test_recipe:
          setup:
            - "Facility ACTIVE, tank IN_SERVICE with CATHODIC_PROTECTION component"
            - "A MAJOR deficiency D1 opened by a failed CP_SURVEY order so1"
            - "D1 driven to CORRECTED via order-correction + mark-corrected"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /facilities", payload: { facility_name: "Loop Site", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank: $.data.id } }
            - { call: "POST /facilities/${fac}/activate", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /tank-systems/${tank}/place-in-service", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /components", payload: { tank_system_id: "${tank}", component_type: "CATHODIC_PROTECTION", install_date: "2018-01-01T00:00:00Z", serial_no: "CP-3" }, as: FacilityOwner, as_user_id: "owner-1", captures: { comp: $.data.id } }
            - { call: "POST /technicians", payload: { full_name: "CP Tester", endorsements: ["CP_TESTER"], trainer: false }, as: ContractorAdmin, captures: { t_cp: $.data.id } }
            - { call: "POST /technicians", payload: { full_name: "Reviewer", endorsements: [], trainer: false }, as: ContractorAdmin, captures: { t_rev: $.data.id } }
            - { call: "POST /service-orders", payload: { facility_id: "${fac}", tank_system_id: "${tank}", service_type: "CP_SURVEY", component_id: "${comp}", line_items: [{ description: "cp", qty: 1, unit_price_cents: 40000 }] }, as: ContractorAdmin, captures: { so1: $.data.id } }
            - { call: "POST /service-orders/${so1}/schedule", payload: { technician_id: "${t_cp}", window_start: "2026-05-02T10:00:00Z", window_end: "2026-05-02T11:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T10:30:00Z" }, as: ContractorAdmin }
            - { call: "POST /service-orders/${so1}/start", payload: {}, as: Technician, as_user_id: "${t_cp}" }
            - call: "POST /service-orders/${so1}/results"
              payload: { readings: { instant_off_mv: -800, polarized_mv: -700, native_mv: -500, valid_contact: true, criterion: "INSTANT_OFF" } }
              as: Technician
              as_user_id: "${t_cp}"
            - { call: "GET /deficiencies?source_service_order_id=${so1}", as: Any, captures: { d1: "$.data[0].id" } }
            - { call: "POST /deficiencies/${d1}/order-correction", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /deficiencies/${d1}/mark-corrected", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
          trigger:
            - { call: "POST /service-orders", payload: { facility_id: "${fac}", tank_system_id: "${tank}", service_type: "CP_SURVEY", component_id: "${comp}", line_items: [{ description: "cp retest 1", qty: 1, unit_price_cents: 40000 }], linked_deficiency_id: "${d1}" }, as: ContractorAdmin, captures: { so2: $.data.id } }
            - { call: "POST /service-orders/${so2}/schedule", payload: { technician_id: "${t_cp}", window_start: "2026-05-04T10:00:00Z", window_end: "2026-05-04T11:00:00Z" }, as: ContractorAdmin }
            - { call: "GET /deficiencies/${d1}", as: Any, captures: { d_mid1: $.data.status } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T10:30:00Z" }, as: ContractorAdmin }
            - { call: "POST /service-orders/${so2}/start", payload: {}, as: Technician, as_user_id: "${t_cp}" }
            - call: "POST /service-orders/${so2}/results"
              payload: { readings: { instant_off_mv: -800, polarized_mv: -700, native_mv: -500, valid_contact: true, criterion: "INSTANT_OFF" } }
              as: Technician
              as_user_id: "${t_cp}"
            - { call: "POST /service-orders/${so2}/certify", payload: {}, as: ComplianceReviewer, as_user_id: "${t_rev}" }
            - { call: "GET /deficiencies/${d1}", as: Any, captures: { d_mid2: $.data.status } }
            - { call: "POST /deficiencies/${d1}/mark-corrected", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /service-orders", payload: { facility_id: "${fac}", tank_system_id: "${tank}", service_type: "CP_SURVEY", component_id: "${comp}", line_items: [{ description: "cp retest 2", qty: 1, unit_price_cents: 40000 }], linked_deficiency_id: "${d1}" }, as: ContractorAdmin, captures: { so3: $.data.id } }
            - { call: "POST /service-orders/${so3}/schedule", payload: { technician_id: "${t_cp}", window_start: "2026-05-06T10:00:00Z", window_end: "2026-05-06T11:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-06T10:30:00Z" }, as: ContractorAdmin }
            - { call: "POST /service-orders/${so3}/start", payload: {}, as: Technician, as_user_id: "${t_cp}" }
            - call: "POST /service-orders/${so3}/results"
              payload: { readings: { instant_off_mv: -900, polarized_mv: -950, native_mv: -600, valid_contact: true, criterion: "INSTANT_OFF" } }
              as: Technician
              as_user_id: "${t_cp}"
            - { call: "POST /service-orders/${so3}/certify", payload: {}, as: ComplianceReviewer, as_user_id: "${t_rev}" }
            - { call: "GET /deficiencies/${d1}", as: Any, captures: { d_final: $.data.status, d_verified_by: $.data.verified_by_service_order_id } }
            - { call: "GET /components/${comp}", as: Any, captures: { comp_status: $.data.status } }
          assert:
            - "${d_mid1} == RE_TEST_SCHEDULED (scheduling a linked re-test advances CORRECTED)"
            - "${d_mid2} == CORRECTION_ORDERED (certified re-test with outcome FAIL loops back)"
            - "${d_final} == VERIFIED_CLOSED and ${d_verified_by} == ${so3}"
            - "${comp_status} == IN_SERVICE (component restored on verification)"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: release_confirm_cascades_tank_orders_deficiency
        grounds:
          - state_machines.ReleaseEvent.SUSPECTED_to_CONFIRMED
          - state_machines.TankSystem.IN_SERVICE_to_TEMPORARILY_CLOSED
          - state_machines.ServiceOrder.SCHEDULED_to_CANCELLED
          - state_machines.Deficiency.RE_TEST_SCHEDULED_to_CORRECTED
        distinguishing_aspect: |
          Depth-3 cascade triggered by POST /release-events/{id}/confirm: the
          confirmation closes the tank (link 1), the tank closure cancels its
          SCHEDULED orders (link 2), and the cancelled linked re-test order moves
          its Deficiency from RE_TEST_SCHEDULED back to CORRECTED (link 3).
        test_recipe:
          setup:
            - "Facility ACTIVE, tank IN_SERVICE with CATHODIC_PROTECTION component"
            - "MAJOR deficiency D1 (from a failed CP order so1) driven to CORRECTED, with a linked re-test order so2 SCHEDULED (D1 is RE_TEST_SCHEDULED)"
            - "A second plain TANK_TIGHTNESS order so3 SCHEDULED on the same tank"
            - "A SUSPECTED ReleaseEvent created against the tank by the owner"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /facilities", payload: { facility_name: "Cascade Site", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank: $.data.id } }
            - { call: "POST /facilities/${fac}/activate", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /tank-systems/${tank}/place-in-service", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /components", payload: { tank_system_id: "${tank}", component_type: "CATHODIC_PROTECTION", install_date: "2018-01-01T00:00:00Z", serial_no: "CP-4" }, as: FacilityOwner, as_user_id: "owner-1", captures: { comp: $.data.id } }
            - { call: "POST /technicians", payload: { full_name: "CP Tester", endorsements: ["CP_TESTER"], trainer: false }, as: ContractorAdmin, captures: { t_cp: $.data.id } }
            - { call: "POST /technicians", payload: { full_name: "Tightness Tester", endorsements: ["TIGHTNESS_TESTER"], trainer: false }, as: ContractorAdmin, captures: { t_tt: $.data.id } }
            - { call: "POST /service-orders", payload: { facility_id: "${fac}", tank_system_id: "${tank}", service_type: "CP_SURVEY", component_id: "${comp}", line_items: [{ description: "cp", qty: 1, unit_price_cents: 40000 }] }, as: ContractorAdmin, captures: { so1: $.data.id } }
            - { call: "POST /service-orders/${so1}/schedule", payload: { technician_id: "${t_cp}", window_start: "2026-05-02T10:00:00Z", window_end: "2026-05-02T11:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T10:30:00Z" }, as: ContractorAdmin }
            - { call: "POST /service-orders/${so1}/start", payload: {}, as: Technician, as_user_id: "${t_cp}" }
            - call: "POST /service-orders/${so1}/results"
              payload: { readings: { instant_off_mv: -800, polarized_mv: -700, native_mv: -500, valid_contact: true, criterion: "INSTANT_OFF" } }
              as: Technician
              as_user_id: "${t_cp}"
            - { call: "GET /deficiencies?source_service_order_id=${so1}", as: Any, captures: { d1: "$.data[0].id" } }
            - { call: "POST /deficiencies/${d1}/order-correction", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /deficiencies/${d1}/mark-corrected", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /service-orders", payload: { facility_id: "${fac}", tank_system_id: "${tank}", service_type: "CP_SURVEY", component_id: "${comp}", line_items: [{ description: "cp retest", qty: 1, unit_price_cents: 40000 }], linked_deficiency_id: "${d1}" }, as: ContractorAdmin, captures: { so2: $.data.id } }
            - { call: "POST /service-orders/${so2}/schedule", payload: { technician_id: "${t_cp}", window_start: "2026-05-04T10:00:00Z", window_end: "2026-05-04T11:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /service-orders", payload: { facility_id: "${fac}", tank_system_id: "${tank}", service_type: "TANK_TIGHTNESS", line_items: [{ description: "tightness", qty: 1, unit_price_cents: 60000 }] }, as: ContractorAdmin, captures: { so3: $.data.id } }
            - { call: "POST /service-orders/${so3}/schedule", payload: { technician_id: "${t_tt}", window_start: "2026-05-05T10:00:00Z", window_end: "2026-05-05T11:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /release-events", payload: { facility_id: "${fac}", tank_system_id: "${tank}", discovered_at: "2026-05-02T08:00:00Z", source_description: "fuel odor at dispenser" }, as: FacilityOwner, as_user_id: "owner-1", captures: { rel: $.data.id } }
          trigger:
            - { call: "POST /release-events/${rel}/confirm", payload: {}, as: StateRegulator }
            - { call: "GET /release-events/${rel}", as: Any, captures: { rel_status: $.data.status } }
            - { call: "GET /tank-systems/${tank}", as: Any, captures: { tank_status: $.data.status } }
            - { call: "GET /service-orders/${so2}", as: Any, captures: { so2_status: $.data.status } }
            - { call: "GET /service-orders/${so3}", as: Any, captures: { so3_status: $.data.status } }
            - { call: "GET /deficiencies/${d1}", as: Any, captures: { d1_status: $.data.status } }
          assert:
            - "${rel_status} == CONFIRMED"
            - "${tank_status} == TEMPORARILY_CLOSED (link 1: confirm closes the source tank)"
            - "${so2_status} == CANCELLED and ${so3_status} == CANCELLED (link 2: tank closure cancels SCHEDULED orders)"
            - "${d1_status} == CORRECTED (link 3: the cancelled re-test order drops the deficiency out of RE_TEST_SCHEDULED)"

      - name: failed_component_test_cascades_deficiency_component_posture
        grounds:
          - state_machines.ServiceOrder.IN_PROGRESS_to_UNDER_REVIEW
          - state_machines.Component.IN_SERVICE_to_DEFICIENT
          - calculations.compliance_posture_score
          - entities.Deficiency.fields.source_service_order_id
        distinguishing_aspect: |
          Depth-3 cascade triggered by POST /service-orders/{id}/results with a
          FAIL outcome (a different trigger than release confirm): the recorded
          ResultRecord opens a MAJOR Deficiency (link 1 -> 2), the deficiency marks
          the tested Component DEFICIENT (link 3), and the same deficiency drives
          Facility.posture_score from 100 to 85.
        test_recipe:
          setup:
            - "Facility ACTIVE, tank IN_SERVICE with CATHODIC_PROTECTION component"
            - "CP_SURVEY order SCHEDULED and started by t_cp"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /facilities", payload: { facility_name: "Fail Cascade Site", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank: $.data.id } }
            - { call: "POST /facilities/${fac}/activate", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /tank-systems/${tank}/place-in-service", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /components", payload: { tank_system_id: "${tank}", component_type: "CATHODIC_PROTECTION", install_date: "2018-01-01T00:00:00Z", serial_no: "CP-5" }, as: FacilityOwner, as_user_id: "owner-1", captures: { comp: $.data.id } }
            - { call: "POST /technicians", payload: { full_name: "CP Tester", endorsements: ["CP_TESTER"], trainer: false }, as: ContractorAdmin, captures: { t_cp: $.data.id } }
            - { call: "POST /service-orders", payload: { facility_id: "${fac}", tank_system_id: "${tank}", service_type: "CP_SURVEY", component_id: "${comp}", line_items: [{ description: "cp", qty: 1, unit_price_cents: 40000 }] }, as: ContractorAdmin, captures: { so1: $.data.id } }
            - { call: "POST /service-orders/${so1}/schedule", payload: { technician_id: "${t_cp}", window_start: "2026-05-02T10:00:00Z", window_end: "2026-05-02T11:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T10:30:00Z" }, as: ContractorAdmin }
            - { call: "POST /service-orders/${so1}/start", payload: {}, as: Technician, as_user_id: "${t_cp}" }
          trigger:
            - call: "POST /service-orders/${so1}/results"
              payload: { readings: { instant_off_mv: -800, polarized_mv: -700, native_mv: -500, valid_contact: true, criterion: "INSTANT_OFF" } }
              as: Technician
              as_user_id: "${t_cp}"
            - { call: "GET /service-orders/${so1}", as: Any, captures: { so_status: $.data.status } }
            - { call: "GET /result-records?service_order_id=${so1}", as: Any, captures: { rr_outcome: "$.data[0].outcome" } }
            - { call: "GET /deficiencies?source_service_order_id=${so1}", as: Any, captures: { d_sev: "$.data[0].severity", d_origin: "$.data[0].origin" } }
            - { call: "GET /components/${comp}", as: Any, captures: { comp_status: $.data.status } }
            - { call: "GET /facilities/${fac}", as: Any, captures: { fac_score: $.data.posture_score } }
          assert:
            - "${so_status} == UNDER_REVIEW"
            - "${rr_outcome} == FAIL"
            - "${d_sev} == MAJOR and ${d_origin} == TEST_FAILURE"
            - "${comp_status} == DEFICIENT (link 3: deficiency marks the component)"
            - "${fac_score} == 85 (100 - 15 MAJOR weight)"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: certify_state_error_precedes_self_certification
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - state_machines.ServiceOrder.UNDER_REVIEW_to_CERTIFIED
        distinguishing_aspect: |
          Error-category pair (state, business_safety): the caller IS the
          performing technician (self-certification, priority 6) AND the order is
          IN_PROGRESS rather than UNDER_REVIEW (state, priority 5); the state
          error ERR_ORDER_NOT_UNDER_REVIEW must win.
        test_recipe:
          setup:
            - "Facility ACTIVE, tank IN_SERVICE; TANK_TIGHTNESS order SCHEDULED and started by t_tt (performed_by_technician_id == t_tt)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /facilities", payload: { facility_name: "Priority Site", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank: $.data.id } }
            - { call: "POST /facilities/${fac}/activate", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /tank-systems/${tank}/place-in-service", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /technicians", payload: { full_name: "Tightness Tester", endorsements: ["TIGHTNESS_TESTER"], trainer: false }, as: ContractorAdmin, captures: { t_tt: $.data.id } }
            - { call: "POST /service-orders", payload: { facility_id: "${fac}", tank_system_id: "${tank}", service_type: "TANK_TIGHTNESS", line_items: [{ description: "tightness", qty: 1, unit_price_cents: 60000 }] }, as: ContractorAdmin, captures: { so: $.data.id } }
            - { call: "POST /service-orders/${so}/schedule", payload: { technician_id: "${t_tt}", window_start: "2026-05-02T10:00:00Z", window_end: "2026-05-02T11:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T10:30:00Z" }, as: ContractorAdmin }
            - { call: "POST /service-orders/${so}/start", payload: {}, as: Technician, as_user_id: "${t_tt}" }
          trigger:
            - call: "POST /service-orders/${so}/certify"
              payload: {}
              as: ComplianceReviewer
              as_user_id: "${t_tt}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_ORDER_NOT_UNDER_REVIEW (state priority 5 beats self-certification priority 6 even though the caller equals performed_by_technician_id)"

      - name: claim_posture_gate_precedes_fund_cap
        grounds:
          - validations[priority=9]
          - validations[priority=18]
          - calculations.fund_reimbursement_amount
          - calculations.compliance_posture_score
        distinguishing_aspect: |
          Error-category pair (business_safety, business_fiscal) — distinct from
          the (state, business_safety) pair: facility posture is NON_COMPLIANT
          (score 50) AND the claim's payable 179100000 exceeds the 100000000 cap;
          ERR_FACILITY_POSTURE_BLOCKS_CLAIM must win over ERR_FUND_CAP_EXCEEDED.
        test_recipe:
          setup:
            - "Facility ACTIVE with a MAJOR deficiency (failed CP survey, -15) and a CRITICAL deficiency plus CONFIRMED release (failed tightness test, -25 -10): posture_score 50, NON_COMPLIANT"
            - "The confirmed release is claim-eligible and fees are current"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /facilities", payload: { facility_name: "Blocked Site", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z", fund_program_election: "PER_OCCURRENCE" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank: $.data.id } }
            - { call: "POST /facilities/${fac}/activate", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /tank-systems/${tank}/place-in-service", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /components", payload: { tank_system_id: "${tank}", component_type: "CATHODIC_PROTECTION", install_date: "2018-01-01T00:00:00Z", serial_no: "CP-6" }, as: FacilityOwner, as_user_id: "owner-1", captures: { comp: $.data.id } }
            - { call: "POST /technicians", payload: { full_name: "CP Tester", endorsements: ["CP_TESTER"], trainer: false }, as: ContractorAdmin, captures: { t_cp: $.data.id } }
            - { call: "POST /technicians", payload: { full_name: "Tightness Tester", endorsements: ["TIGHTNESS_TESTER"], trainer: false }, as: ContractorAdmin, captures: { t_tt: $.data.id } }
            - { call: "POST /service-orders", payload: { facility_id: "${fac}", tank_system_id: "${tank}", service_type: "CP_SURVEY", component_id: "${comp}", line_items: [{ description: "cp", qty: 1, unit_price_cents: 40000 }] }, as: ContractorAdmin, captures: { so_cp: $.data.id } }
            - { call: "POST /service-orders/${so_cp}/schedule", payload: { technician_id: "${t_cp}", window_start: "2026-05-02T10:00:00Z", window_end: "2026-05-02T11:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T10:30:00Z" }, as: ContractorAdmin }
            - { call: "POST /service-orders/${so_cp}/start", payload: {}, as: Technician, as_user_id: "${t_cp}" }
            - call: "POST /service-orders/${so_cp}/results"
              payload: { readings: { instant_off_mv: -800, polarized_mv: -700, native_mv: -500, valid_contact: true, criterion: "INSTANT_OFF" } }
              as: Technician
              as_user_id: "${t_cp}"
            - { call: "POST /service-orders", payload: { facility_id: "${fac}", tank_system_id: "${tank}", service_type: "TANK_TIGHTNESS", line_items: [{ description: "tightness", qty: 1, unit_price_cents: 60000 }] }, as: ContractorAdmin, captures: { so_tt: $.data.id } }
            - { call: "POST /service-orders/${so_tt}/schedule", payload: { technician_id: "${t_tt}", window_start: "2026-05-03T10:00:00Z", window_end: "2026-05-03T11:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T10:30:00Z" }, as: ContractorAdmin }
            - { call: "POST /service-orders/${so_tt}/start", payload: {}, as: Technician, as_user_id: "${t_tt}" }
            - call: "POST /service-orders/${so_tt}/results"
              payload: { readings: { leak_rate_gph: 0.5 } }
              as: Technician
              as_user_id: "${t_tt}"
            - { call: "GET /release-events?tank_system_id=${tank}&status=SUSPECTED", as: Any, captures: { rel: "$.data[0].id" } }
            - { call: "POST /release-events/${rel}/confirm", payload: {}, as: StateRegulator }
            - { call: "GET /facilities/${fac}", as: Any, captures: { fac_posture: $.data.compliance_posture, fac_score: $.data.posture_score } }
          trigger:
            - call: "POST /fund-claims"
              payload: { facility_id: "${fac}", release_event_id: "${rel}", expense_lines: [{ description: "cleanup", amount_cents: 200000000 }] }
              as: FacilityOwner
              as_user_id: "owner-1"
              captures: { err: $.data.error_id }
          assert:
            - "${fac_score} == 50 and ${fac_posture} == NON_COMPLIANT (100 - 15 MAJOR - 25 CRITICAL - 10 open release)"
            - "${err} == ERR_FACILITY_POSTURE_BLOCKS_CLAIM (posture gate priority 9 beats fund-cap priority 18, even though payable would be 179100000 > 100000000)"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: tightness_rate_exactly_threshold_passes
        grounds:
          - calculations.test_result_determination
          - entities.ResultRecord.fields.outcome
        distinguishing_aspect: |
          Numeric-threshold boundary on the leak-rate metric via
          POST /service-orders/{id}/results: leak_rate_gph of exactly 0.100 PASSes
          (inclusive <= bound), producing no deficiency.
        test_recipe:
          setup:
            - "Facility ACTIVE, tank IN_SERVICE; TANK_TIGHTNESS order SCHEDULED and started"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /facilities", payload: { facility_name: "Boundary Site", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank: $.data.id } }
            - { call: "POST /facilities/${fac}/activate", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /tank-systems/${tank}/place-in-service", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /technicians", payload: { full_name: "Tightness Tester", endorsements: ["TIGHTNESS_TESTER"], trainer: false }, as: ContractorAdmin, captures: { t_tt: $.data.id } }
            - { call: "POST /service-orders", payload: { facility_id: "${fac}", tank_system_id: "${tank}", service_type: "TANK_TIGHTNESS", line_items: [{ description: "tightness", qty: 1, unit_price_cents: 60000 }] }, as: ContractorAdmin, captures: { so: $.data.id } }
            - { call: "POST /service-orders/${so}/schedule", payload: { technician_id: "${t_tt}", window_start: "2026-05-02T10:00:00Z", window_end: "2026-05-02T11:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T10:30:00Z" }, as: ContractorAdmin }
            - { call: "POST /service-orders/${so}/start", payload: {}, as: Technician, as_user_id: "${t_tt}" }
          trigger:
            - call: "POST /service-orders/${so}/results"
              payload: { readings: { leak_rate_gph: 0.100 } }
              as: Technician
              as_user_id: "${t_tt}"
            - { call: "GET /result-records?service_order_id=${so}", as: Any, captures: { outcome: "$.data[0].outcome" } }
          assert:
            - "${outcome} == PASS (0.100 <= 0.100: the threshold bound is inclusive)"
            - "No Deficiency exists with tank_system_id == ${tank} (filtered list total_count == 0)"
            - "No ReleaseEvent exists with tank_system_id == ${tank} (filtered list total_count == 0)"

      - name: fund_claim_payable_equals_cap_submits
        grounds:
          - calculations.fund_reimbursement_amount
          - entities.Facility.fields.fund_cap_remaining_cents
          - state_machines.StateFundClaim.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Zero-remaining boundary on the fund-cap metric via
          POST /fund-claims/{id}/submit (a different endpoint and metric than the
          leak-rate bound): payable exactly equal to fund_cap_remaining_cents is
          accepted (inclusive <=) and drives the remaining cap to exactly 0.
        test_recipe:
          setup:
            - "Facility ACTIVE (PER_OCCURRENCE) with a CONFIRMED release, fees current; fund_cap_remaining_cents == 100000000"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /facilities", payload: { facility_name: "Cap Site", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z", fund_program_election: "PER_OCCURRENCE" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "GASOLINE", capacity_gallons: 8000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "FRP", piping_type: "SUCTION", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank: $.data.id } }
            - { call: "POST /facilities/${fac}/activate", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /tank-systems/${tank}/place-in-service", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /release-events", payload: { facility_id: "${fac}", discovered_at: "2026-05-01T08:00:00Z", source_description: "sheen" }, as: FacilityOwner, as_user_id: "owner-1", captures: { rel: $.data.id } }
            - { call: "POST /release-events/${rel}/confirm", payload: {}, as: StateRegulator }
          trigger:
            - call: "POST /fund-claims"
              payload: { facility_id: "${fac}", release_event_id: "${rel}", expense_lines: [{ description: "cleanup", amount_cents: 112111111 }] }
              as: FacilityOwner
              as_user_id: "owner-1"
              captures: { claim: $.data.id, pay: $.data.payable_amount_cents }
            - { call: "POST /fund-claims/${claim}/submit", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "GET /facilities/${fac}", as: Any, captures: { cap_after: $.data.fund_cap_remaining_cents } }
            - { call: "GET /fund-claims/${claim}", as: Any, captures: { claim_status: $.data.status } }
          assert:
            - "${pay} == 100000000 (round_half_up((112111111 - 1000000) * 0.90) = round_half_up(99999999.9))"
            - "Submit succeeded: payable == fund_cap_remaining_cents satisfies the inclusive <= reservation check"
            - "${claim_status} == SUBMITTED"
            - "${cap_after} == 0 (boundary: cap driven exactly to zero, not negative, not rejected)"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: schedule_blocked_when_tank_not_in_service
        grounds:
          - state_machines.ServiceOrder.REQUESTED_to_SCHEDULED
          - state_machines.TankSystem.IN_SERVICE_to_TEMPORARILY_CLOSED
          - validations[priority=5]
        distinguishing_aspect: |
          Entity pair (ServiceOrder, TankSystem): scheduling an order requires the
          referenced tank to be IN_SERVICE; a TEMPORARILY_CLOSED tank rejects with
          ERR_TANK_NOT_IN_SERVICE, and return-to-service unblocks the same call.
        test_recipe:
          setup:
            - "Facility ACTIVE; tank placed IN_SERVICE then manually closed TEMPORARY; one REQUESTED TANK_TIGHTNESS order; endorsed technician t_tt"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /facilities", payload: { facility_name: "Gate Site", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank: $.data.id } }
            - { call: "POST /facilities/${fac}/activate", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /tank-systems/${tank}/place-in-service", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /technicians", payload: { full_name: "Tightness Tester", endorsements: ["TIGHTNESS_TESTER"], trainer: false }, as: ContractorAdmin, captures: { t_tt: $.data.id } }
            - { call: "POST /service-orders", payload: { facility_id: "${fac}", tank_system_id: "${tank}", service_type: "TANK_TIGHTNESS", line_items: [{ description: "tightness", qty: 1, unit_price_cents: 60000 }] }, as: ContractorAdmin, captures: { so: $.data.id } }
            - { call: "POST /tank-systems/${tank}/close", payload: { closure_type: "TEMPORARY" }, as: FacilityOwner, as_user_id: "owner-1" }
          trigger:
            - call: "POST /service-orders/${so}/schedule"
              payload: { technician_id: "${t_tt}", window_start: "2026-05-02T10:00:00Z", window_end: "2026-05-02T11:00:00Z" }
              as: ContractorAdmin
              captures: { err: $.data.error_id }
            - { call: "POST /tank-systems/${tank}/return-to-service", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - call: "POST /service-orders/${so}/schedule"
              payload: { technician_id: "${t_tt}", window_start: "2026-05-02T10:00:00Z", window_end: "2026-05-02T11:00:00Z" }
              as: ContractorAdmin
              captures: { so_status: $.data.status }
          assert:
            - "${err} == ERR_TANK_NOT_IN_SERVICE (ServiceOrder transition gated on TankSystem state)"
            - "${so_status} == SCHEDULED after the tank returned to IN_SERVICE"

      - name: operator_activate_requires_valid_training
        grounds:
          - state_machines.OperatorPerson.DESIGNATED_to_ACTIVE
          - calculations.training_certificate_expiry
          - validations[priority=16]
        distinguishing_aspect: |
          Entity pair (OperatorPerson, TrainingRecord) — distinct from
          (ServiceOrder, TankSystem): activation requires a TrainingRecord of the
          operator's class with expires_at strictly after the clock; missing cert
          yields ERR_TRAINING_MISSING, expired cert yields ERR_TRAINING_EXPIRED,
          and a fresh cert flips the same operator to ACTIVE.
        test_recipe:
          setup:
            - "Facility REGISTERED (activation not required for operator designation)"
            - "Operator op of class C; trainer technician t_trainer (trainer == true)"
            - "Logical clock at the default 2026-05-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /facilities", payload: { facility_name: "Training Site", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /operators", payload: { facility_id: "${fac}", full_name: "Op C", operator_class: "C" }, as: FacilityOwner, as_user_id: "owner-1", captures: { op: $.data.id } }
            - { call: "POST /technicians", payload: { full_name: "Trainer Tess", endorsements: [], trainer: true }, as: ContractorAdmin, captures: { t_trainer: $.data.id } }
          trigger:
            - call: "POST /operators/${op}/activate"
              payload: {}
              as: FacilityOwner
              as_user_id: "owner-1"
              captures: { err_missing: $.data.error_id }
            - { call: "POST /training-records", payload: { operator_id: "${op}", course_class: "C", completed_at: "2024-04-01T00:00:00Z" }, as: Technician, as_user_id: "${t_trainer}" }
            - call: "POST /operators/${op}/activate"
              payload: {}
              as: FacilityOwner
              as_user_id: "owner-1"
              captures: { err_expired: $.data.error_id }
            - { call: "POST /training-records", payload: { operator_id: "${op}", course_class: "C", completed_at: "2026-04-15T00:00:00Z" }, as: Technician, as_user_id: "${t_trainer}" }
            - call: "POST /operators/${op}/activate"
              payload: {}
              as: FacilityOwner
              as_user_id: "owner-1"
              captures: { op_status: $.data.status }
          assert:
            - "${err_missing} == ERR_TRAINING_MISSING (no TrainingRecord for the class)"
            - "${err_expired} == ERR_TRAINING_EXPIRED (2024-04-01 + 12 months = 2025-04-01 <= clock 2026-05-01)"
            - "${op_status} == ACTIVE (latest-cert selector picked the 2026-04-15 record expiring 2027-04-15)"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: technician_windows_half_open_adjacency
        grounds:
          - validations[priority=12]
          - state_machines.ServiceOrder.REQUESTED_to_SCHEDULED
        distinguishing_aspect: |
          Half-open interval semantics on resource Technician: windows
          [10:00,12:00) and [12:00,14:00) touch but do not intersect, so the
          second schedule succeeds; [11:00,13:00) intersects and is rejected with
          ERR_TECHNICIAN_DOUBLE_BOOKED.
        test_recipe:
          setup:
            - "Facility ACTIVE with two IN_SERVICE tanks tank1 and tank2"
            - "Technician t_tt (TIGHTNESS_TESTER) with order A on tank1 SCHEDULED [2026-05-10T10:00, 12:00)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /facilities", payload: { facility_name: "Overlap Site", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank1: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T2", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank2: $.data.id } }
            - { call: "POST /facilities/${fac}/activate", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /tank-systems/${tank1}/place-in-service", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /tank-systems/${tank2}/place-in-service", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /technicians", payload: { full_name: "Tightness Tester", endorsements: ["TIGHTNESS_TESTER"], trainer: false }, as: ContractorAdmin, captures: { t_tt: $.data.id } }
            - { call: "POST /service-orders", payload: { facility_id: "${fac}", tank_system_id: "${tank1}", service_type: "TANK_TIGHTNESS", line_items: [{ description: "A", qty: 1, unit_price_cents: 60000 }] }, as: ContractorAdmin, captures: { soA: $.data.id } }
            - { call: "POST /service-orders/${soA}/schedule", payload: { technician_id: "${t_tt}", window_start: "2026-05-10T10:00:00Z", window_end: "2026-05-10T12:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /service-orders", payload: { facility_id: "${fac}", tank_system_id: "${tank2}", service_type: "TANK_TIGHTNESS", line_items: [{ description: "B", qty: 1, unit_price_cents: 60000 }] }, as: ContractorAdmin, captures: { soB: $.data.id } }
            - { call: "POST /service-orders", payload: { facility_id: "${fac}", tank_system_id: "${tank2}", service_type: "TANK_TIGHTNESS", line_items: [{ description: "C", qty: 1, unit_price_cents: 60000 }] }, as: ContractorAdmin, captures: { soC: $.data.id } }
          trigger:
            - call: "POST /service-orders/${soB}/schedule"
              payload: { technician_id: "${t_tt}", window_start: "2026-05-10T12:00:00Z", window_end: "2026-05-10T14:00:00Z" }
              as: ContractorAdmin
              captures: { soB_status: $.data.status }
            - call: "POST /service-orders/${soC}/schedule"
              payload: { technician_id: "${t_tt}", window_start: "2026-05-10T11:00:00Z", window_end: "2026-05-10T13:00:00Z" }
              as: ContractorAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${soB_status} == SCHEDULED (adjacent windows allowed: 12:00 end == 12:00 start does not intersect under half-open semantics)"
            - "${err} == ERR_TECHNICIAN_DOUBLE_BOOKED ([11:00,13:00) intersects both existing windows)"

      - name: tank_tightness_stabilization_buffer_exact
        grounds:
          - validations[priority=13]
          - state_machines.ServiceOrder.REQUESTED_to_SCHEDULED
        distinguishing_aspect: |
          Buffer-gap interval semantics on resource TankSystem (different resource
          and different geometry than the technician half-open rule): a second
          TANK_TIGHTNESS order starting exactly 8h after the previous window_end
          is allowed (>= bound), while 6h is rejected with
          ERR_TANK_STABILIZATION_WINDOW.
        test_recipe:
          setup:
            - "Facility ACTIVE with one IN_SERVICE tank; three distinct TIGHTNESS_TESTER technicians (overlap rule must not confound)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /facilities", payload: { facility_name: "Buffer Site", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank: $.data.id } }
            - { call: "POST /facilities/${fac}/activate", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /tank-systems/${tank}/place-in-service", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /technicians", payload: { full_name: "TT One", endorsements: ["TIGHTNESS_TESTER"], trainer: false }, as: ContractorAdmin, captures: { t1: $.data.id } }
            - { call: "POST /technicians", payload: { full_name: "TT Two", endorsements: ["TIGHTNESS_TESTER"], trainer: false }, as: ContractorAdmin, captures: { t2: $.data.id } }
            - { call: "POST /technicians", payload: { full_name: "TT Three", endorsements: ["TIGHTNESS_TESTER"], trainer: false }, as: ContractorAdmin, captures: { t3: $.data.id } }
            - { call: "POST /service-orders", payload: { facility_id: "${fac}", tank_system_id: "${tank}", service_type: "TANK_TIGHTNESS", line_items: [{ description: "A", qty: 1, unit_price_cents: 60000 }] }, as: ContractorAdmin, captures: { soA: $.data.id } }
            - { call: "POST /service-orders/${soA}/schedule", payload: { technician_id: "${t1}", window_start: "2026-05-10T08:00:00Z", window_end: "2026-05-10T10:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /service-orders", payload: { facility_id: "${fac}", tank_system_id: "${tank}", service_type: "TANK_TIGHTNESS", line_items: [{ description: "B", qty: 1, unit_price_cents: 60000 }] }, as: ContractorAdmin, captures: { soB: $.data.id } }
            - { call: "POST /service-orders", payload: { facility_id: "${fac}", tank_system_id: "${tank}", service_type: "TANK_TIGHTNESS", line_items: [{ description: "C", qty: 1, unit_price_cents: 60000 }] }, as: ContractorAdmin, captures: { soC: $.data.id } }
          trigger:
            - call: "POST /service-orders/${soB}/schedule"
              payload: { technician_id: "${t2}", window_start: "2026-05-10T18:00:00Z", window_end: "2026-05-10T19:00:00Z" }
              as: ContractorAdmin
              captures: { soB_status: $.data.status }
            - call: "POST /service-orders/${soC}/schedule"
              payload: { technician_id: "${t3}", window_start: "2026-05-10T16:00:00Z", window_end: "2026-05-10T17:00:00Z" }
              as: ContractorAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${soB_status} == SCHEDULED (10:00 end -> 18:00 start is exactly the 8h stabilization buffer; the >= bound is inclusive)"
            - "${err} == ERR_TANK_STABILIZATION_WINDOW (10:00 end -> 16:00 start leaves only 6h of product stabilization)"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: claim_submit_withdraw_restores_fund_cap
        grounds:
          - state_machines.StateFundClaim.DRAFT_to_SUBMITTED
          - state_machines.StateFundClaim.SUBMITTED_to_WITHDRAWN
          - entities.Facility.fields.fund_cap_remaining_cents
        distinguishing_aspect: |
          Conserved quantity: facility fund-year cap cents. Submitting a claim
          reserves payable_amount_cents; withdrawing the same claim releases the
          exact reservation, returning fund_cap_remaining_cents to its pre-submit
          value with zero drift.
        test_recipe:
          setup:
            - "Facility ACTIVE (PER_OCCURRENCE) with a CONFIRMED release and fees current"
            - "DRAFT claim with expense_lines summing to 3000000 (payable 1800000)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /facilities", payload: { facility_name: "Invariant Site", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z", fund_program_election: "PER_OCCURRENCE" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "GASOLINE", capacity_gallons: 8000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "FRP", piping_type: "SUCTION", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank: $.data.id } }
            - { call: "POST /facilities/${fac}/activate", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /tank-systems/${tank}/place-in-service", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /release-events", payload: { facility_id: "${fac}", discovered_at: "2026-05-01T08:00:00Z", source_description: "sheen" }, as: FacilityOwner, as_user_id: "owner-1", captures: { rel: $.data.id } }
            - { call: "POST /release-events/${rel}/confirm", payload: {}, as: StateRegulator }
            - { call: "POST /fund-claims", payload: { facility_id: "${fac}", release_event_id: "${rel}", expense_lines: [{ description: "cleanup", amount_cents: 3000000 }] }, as: FacilityOwner, as_user_id: "owner-1", captures: { claim: $.data.id, pay: $.data.payable_amount_cents } }
            - { call: "GET /facilities/${fac}", as: Any, captures: { cap_before: $.data.fund_cap_remaining_cents } }
          trigger:
            - { call: "POST /fund-claims/${claim}/submit", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "GET /facilities/${fac}", as: Any, captures: { cap_reserved: $.data.fund_cap_remaining_cents } }
            - { call: "POST /fund-claims/${claim}/withdraw", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "GET /facilities/${fac}", as: Any, captures: { cap_after: $.data.fund_cap_remaining_cents } }
          assert:
            - "${cap_before} == 100000000"
            - "${pay} == 1800000"
            - "${cap_reserved} == 98200000 (100000000 - 1800000 reserved at submit)"
            - "${cap_after} == ${cap_before} == 100000000 (submit + withdraw leaves the fund-year cap exactly unchanged)"

      - name: fail_then_verify_restores_posture_score
        grounds:
          - calculations.compliance_posture_score
          - state_machines.Deficiency.RE_TEST_SCHEDULED_to_VERIFIED_CLOSED
          - entities.Facility.fields.posture_score
        distinguishing_aspect: |
          Conserved quantity: facility compliance posture points (a different
          quantity than fiscal cap cents). A FAIL result opens a MAJOR deficiency
          (-15 -> 85); completing the correction-plus-certified-re-test cycle
          closes it (+15), returning posture_score to exactly its original 100.
        test_recipe:
          setup:
            - "Facility ACTIVE, tank IN_SERVICE with CATHODIC_PROTECTION component; posture_score 100"
            - "CP_SURVEY order so1 SCHEDULED and started by t_cp; reviewer t_rev"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /facilities", payload: { facility_name: "Posture Invariant Site", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank: $.data.id } }
            - { call: "POST /facilities/${fac}/activate", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /tank-systems/${tank}/place-in-service", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /components", payload: { tank_system_id: "${tank}", component_type: "CATHODIC_PROTECTION", install_date: "2018-01-01T00:00:00Z", serial_no: "CP-7" }, as: FacilityOwner, as_user_id: "owner-1", captures: { comp: $.data.id } }
            - { call: "POST /technicians", payload: { full_name: "CP Tester", endorsements: ["CP_TESTER"], trainer: false }, as: ContractorAdmin, captures: { t_cp: $.data.id } }
            - { call: "POST /technicians", payload: { full_name: "Reviewer", endorsements: [], trainer: false }, as: ContractorAdmin, captures: { t_rev: $.data.id } }
            - { call: "POST /service-orders", payload: { facility_id: "${fac}", tank_system_id: "${tank}", service_type: "CP_SURVEY", component_id: "${comp}", line_items: [{ description: "cp", qty: 1, unit_price_cents: 40000 }] }, as: ContractorAdmin, captures: { so1: $.data.id } }
            - { call: "POST /service-orders/${so1}/schedule", payload: { technician_id: "${t_cp}", window_start: "2026-05-02T10:00:00Z", window_end: "2026-05-02T11:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T10:30:00Z" }, as: ContractorAdmin }
            - { call: "POST /service-orders/${so1}/start", payload: {}, as: Technician, as_user_id: "${t_cp}" }
            - { call: "GET /facilities/${fac}", as: Any, captures: { s0: $.data.posture_score } }
          trigger:
            - call: "POST /service-orders/${so1}/results"
              payload: { readings: { instant_off_mv: -800, polarized_mv: -700, native_mv: -500, valid_contact: true, criterion: "INSTANT_OFF" } }
              as: Technician
              as_user_id: "${t_cp}"
            - { call: "GET /facilities/${fac}", as: Any, captures: { s1: $.data.posture_score } }
            - { call: "GET /deficiencies?source_service_order_id=${so1}", as: Any, captures: { d1: "$.data[0].id" } }
            - { call: "POST /deficiencies/${d1}/order-correction", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /deficiencies/${d1}/mark-corrected", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /service-orders", payload: { facility_id: "${fac}", tank_system_id: "${tank}", service_type: "CP_SURVEY", component_id: "${comp}", line_items: [{ description: "cp retest", qty: 1, unit_price_cents: 40000 }], linked_deficiency_id: "${d1}" }, as: ContractorAdmin, captures: { so2: $.data.id } }
            - { call: "POST /service-orders/${so2}/schedule", payload: { technician_id: "${t_cp}", window_start: "2026-05-04T10:00:00Z", window_end: "2026-05-04T11:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T10:30:00Z" }, as: ContractorAdmin }
            - { call: "POST /service-orders/${so2}/start", payload: {}, as: Technician, as_user_id: "${t_cp}" }
            - call: "POST /service-orders/${so2}/results"
              payload: { readings: { instant_off_mv: -900, polarized_mv: -950, native_mv: -600, valid_contact: true, criterion: "INSTANT_OFF" } }
              as: Technician
              as_user_id: "${t_cp}"
            - { call: "POST /service-orders/${so2}/certify", payload: {}, as: ComplianceReviewer, as_user_id: "${t_rev}" }
            - { call: "GET /facilities/${fac}", as: Any, captures: { s2: $.data.posture_score } }
            - { call: "GET /deficiencies/${d1}", as: Any, captures: { d_status: $.data.status } }
          assert:
            - "${s0} == 100"
            - "${s1} == 85 (MAJOR deficiency weight 15 deducted exactly once)"
            - "${s2} == 100 == ${s0} (verification restores the full weight; no penalty drift)"
            - "${d_status} == VERIFIED_CLOSED"
