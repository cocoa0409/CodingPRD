              payload: {}
              as: Fiduciary
              as_user_id: "${fid_id}"
          trigger:
            # cv_stale was observed before exp_a creation+disburse advanced the case version;
            # the amount 200,000 would also push care 900,000+200,000=1,100,000 > cap 1,000,000.
            - call: "POST /gc/expenditures"
              payload: { case_id: "${case_id}", budget_id: "${budget_id}", category: "CARE", amount_cents: 200000, payee_name: "Caregiver B", expected_case_version: "${cv_stale}" }
