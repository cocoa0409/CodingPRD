      - name: agreement_reinstatement_is_guarded_by_the_carrier_state
        claim_type: guarded_transitions
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.ServiceAgreement.SUSPENDED_to_ACTIVE.preconditions
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / agreement_reinstatement_reads_the_carrier_standing
          rationale: "That instance already drives SUSPENDED -> ACTIVE against a SUSPENDED carrier and then against a reinstated one, asserting both the refusal and the success."
      - name: payment_reversal_undoes_every_side_effect
        claim_type: compensation
        grounds:
          - state_machines.SubsidyPayment.DISBURSED_to_REVERSED.side_effects
          - invariants.program_obligation_conservation
        excluded_because:
          difficulty_instance: compensating_invariant / payment_reversal_restores_the_obligation_identity
          rationale: "That instance already reverses a disbursed payment and re-checks the obligation identity plus the period status roll-back with no drift."
      - name: proposal_dimensions_advance_independently
        claim_type: parallel
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.Proposal.submission_state
          - state_machines.Proposal.evaluation_state
        excluded_because:
          difficulty_instance: non_linear_state_machine / proposal_withdrawal_leaves_evaluation_dimension_frozen
          rationale: "That instance already withdraws a proposal mid-evaluation and asserts that the evaluation dimension keeps its own value while the submission dimension moves to WITHDRAWN."
      - name: renegotiation_counter_revise_loop_is_bounded
        claim_type: cyclic
        grounds:
          - state_machines.RateRenegotiation.COUNTERED_to_REQUESTED
          - entities.RateRenegotiation.fields.revision_count
        excluded_because:
          difficulty_instance: non_linear_state_machine / renegotiation_counter_revise_cycle_bounded_at_three_laps
          rationale: "That instance already walks the COUNTER/REVISE loop to its third lap and asserts the fourth REVISE is refused with ERR_REVISION_LIMIT_EXCEEDED."
      - name: hold_in_grant_executes_all_its_side_effects
        claim_type: side_effect_execution
        grounds:
          - state_machines.TerminationPetition.UNDER_REVIEW_to_GRANTED_WITH_HOLD_IN.side_effects
          - state_machines.Community.SUBSIDIZED_to_HOLD_IN
        excluded_because:
          difficulty_instance: transitive_cascade / hold_in_grant_cascade_opens_the_replacement_solicitation
          rationale: "That instance already asserts every side effect of the hold-in grant: the agreement state, the community state, the decremented active_agreement_count and the auto-created REPLACEMENT solicitation."

  - section: calculations
    instances:
      - name: enplanement_floor_at_the_rounded_boundary
        claim_type: threshold
        grounds:
          - calculations.community_eligibility_assessment
          - calculations.community_eligibility_assessment.constants.MIN_AVG_DAILY_ENPLANEMENTS
          - entities.EligibilityDetermination.fields.outcome
        distinguishing_aspect: "The enplanement floor is applied to the 2-decimal rounded average, so 3648 annual boardings gives 9.99 and fails while 3649 gives exactly 10.00 and passes; the waiver branch is only consulted after the floor fails, and it changes the outcome without changing the distance band or the cap."
        test_recipe:
          setup:
            - "Three CAPPED-band communities (165.0 driving miles) differing only in enplanements_prior_year."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /eas/communities"
              payload: { code: "HYS", name: "Hays", state_code: "KS", driving_miles_to_nearest_hub: 165.0, enplanements_prior_year: 3648, min_required_weekly_round_trips: 12, min_required_weekly_seats: 400 }
              as: ProgramAdmin
              captures: { comm_low_id: $.data.id }
            - call: "POST /eas/communities"
              payload: { code: "DDC", name: "Dodge City", state_code: "KS", driving_miles_to_nearest_hub: 165.0, enplanements_prior_year: 3649, min_required_weekly_round_trips: 12, min_required_weekly_seats: 400 }
              as: ProgramAdmin
              captures: { comm_at_id: $.data.id }
            - call: "POST /eas/communities"
              payload: { code: "GDV", name: "Glendive", state_code: "MT", driving_miles_to_nearest_hub: 165.0, enplanements_prior_year: 3648, min_required_weekly_round_trips: 12, min_required_weekly_seats: 400 }
              as: ProgramAdmin
              captures: { comm_waiver_id: $.data.id }
          trigger:
            - call: "POST /eas/communities/${comm_low_id}/eligibility-determinations"
              payload: { waiver_requested: false }
              as: EligibilityAnalyst
              as_user_id: "analyst-1"
              captures: { det_low_id: $.data.id }
            - call: "POST /eas/communities/${comm_at_id}/eligibility-determinations"
              payload: { waiver_requested: false }
              as: EligibilityAnalyst
              as_user_id: "analyst-1"
              captures: { det_at_id: $.data.id }
            - call: "POST /eas/communities/${comm_waiver_id}/eligibility-determinations"
              payload: { waiver_requested: true }
              as: EligibilityAnalyst
              as_user_id: "analyst-1"
              captures: { det_waiver_id: $.data.id }
          assert:
            - "EligibilityDetermination.${det_low_id}.avg_daily_enplanements == 9.99 with outcome == INELIGIBLE_ENPLANEMENTS"
            - "Community.${comm_low_id}.status == INELIGIBLE and latest_determination_outcome == INELIGIBLE_ENPLANEMENTS"
            - "EligibilityDetermination.${det_at_id}.avg_daily_enplanements == 10.00 with outcome == ELIGIBLE — one extra boarding crosses the floor only because 3649/365 rounds up to 10.00"
            - "Community.${comm_at_id}.status == ELIGIBLE"
            - "EligibilityDetermination.${det_waiver_id}.avg_daily_enplanements == 9.99 with outcome == ELIGIBLE_WITH_WAIVER"
            - "Community.${comm_waiver_id}.status == ELIGIBLE, so the waiver branch reaches the same status by a different outcome"
            - "All three determinations report distance_band == CAPPED and subsidy_per_passenger_cap_usd == 200.00"

