  - rule_id: resource_temporal_overlap
    instances:
      - name: one_marshal_cannot_hold_overlapping_shifts_on_two_courses_until_the_first_is_vacated
        grounds:
          - calculations.staff_shift_conflict_window
          - validations[priority=20].ERR_STAFF_SHIFT_CONFLICT
          - state_machines.StaffAssignment.CONFIRMED_to_VACATED
          - calculations.obstacle_effective_clearance_rate
        distinguishing_aspect: |
          The contended resource is a person, the conflict is pairwise (one collision is fatal,
          headcount is irrelevant) and the search is global: the two shifts sit on two different
          courses of the same venue, so an implementation that scopes the query to the request's
          course wrongly accepts the second booking. The overlap is also strictly contained
          inside the peer window rather than merely touching it. Releasing the resource is what
          frees it: because the conflict search counts only CONFIRMED rows, the identical
          request that was refused succeeds the moment the first shift is VACATED, and the
          staffing consequences move in opposite directions on the two courses.
        test_recipe:
          setup:
            - "One venue carrying two courses: C1 with obstacle X1 (lane_count 4, service_rate 3.00, marshals_required 1, corral_release_rate 12.00) and C2 with obstacle Y1 (lane_count 2, service_rate 4.00, marshals_required 1, corral_release_rate 10.00)."
            - "STAFF-20 holds one CONFIRMED MARSHAL shift on X1 from 2026-09-12T06:00:00Z to 2026-09-12T12:00:00Z, so X1 is MARSHALED at 12.00 per minute and C1.bottleneck_capacity_pph is 720."
            - "Y1 has no marshal yet, so it is UNSTAFFED and C2.bottleneck_capacity_pph is 0."
          setup_api_calls:
            - call: "POST /ocr/venues"
              payload: { name: "Ridgeline Quarry", terrain_type: "QUARRY", water_access: "POND", land_use_zone: "AG-2", protected_acreage_sqm: 2000, restoration_bond_cents: 500000 }
              as: PermitOfficer
              captures: { venue_id: $.data.id }
            - call: "POST /ocr/venues/${venue_id}/courses"
              payload: { name: "Quarry Gauntlet", total_distance_m: 10000, corral_release_rate_per_min: 12.00, corral_throughput_capacity: 200 }
              as: CourseDesigner
              captures: { course_c1_id: $.data.id }
            - call: "POST /ocr/courses/${course_c1_id}/obstacles"
              payload: { name: "Cargo Net", station_index: 1, difficulty_rating: 3, lane_count: 4, service_rate_per_min: 3.00, marshals_required: 1, footprint_sqm: 1200, water_contact: false, bypass_mode: "NONE", penalty_seconds: 0 }
              as: CourseDesigner
              captures: { x1_id: $.data.id }
            - call: "POST /ocr/venues/${venue_id}/courses"
              payload: { name: "Quarry Sprint", total_distance_m: 5000, corral_release_rate_per_min: 10.00, corral_throughput_capacity: 150 }
              as: CourseDesigner
              captures: { course_c2_id: $.data.id }
            - call: "POST /ocr/courses/${course_c2_id}/obstacles"
              payload: { name: "Tyre Drag", station_index: 1, difficulty_rating: 4, lane_count: 2, service_rate_per_min: 4.00, marshals_required: 1, footprint_sqm: 400, water_contact: false, bypass_mode: "NONE", penalty_seconds: 0 }
              as: CourseDesigner
              captures: { y1_id: $.data.id }
            - call: "POST /ocr/courses/${course_c1_id}/staff-assignments"
              payload: { staff_person_id: "STAFF-20", staff_role: "MARSHAL", certification_level: "BASIC", shift_start_utc: "2026-09-12T06:00:00Z", shift_end_utc: "2026-09-12T12:00:00Z", obstacle_id: "${x1_id}" }
              as: SafetyOfficer
              captures: { sa_x1_id: $.data.id }
          trigger:
            - call: "POST /ocr/courses/${course_c2_id}/staff-assignments"
              payload: { staff_person_id: "STAFF-20", staff_role: "MARSHAL", certification_level: "BASIC", shift_start_utc: "2026-09-12T08:00:00Z", shift_end_utc: "2026-09-12T10:00:00Z", obstacle_id: "${y1_id}" }
              as: SafetyOfficer
            - call: "POST /ocr/staff-assignments/${sa_x1_id}/vacate"
              payload: { reason: "Reassigned to the sprint course" }
              as: SafetyOfficer
            - call: "POST /ocr/courses/${course_c2_id}/staff-assignments"
              payload: { staff_person_id: "STAFF-20", staff_role: "MARSHAL", certification_level: "BASIC", shift_start_utc: "2026-09-12T08:00:00Z", shift_end_utc: "2026-09-12T10:00:00Z", obstacle_id: "${y1_id}" }
              as: SafetyOfficer
              captures: { sa_y1_id: $.data.id }
          assert:
            - "The first trigger call returns 409 with error_id ERR_STAFF_SHIFT_CONFLICT even though the peer shift belongs to a different course"
            - "Obstacle.${y1_id}.confirmed_marshal_count == 0 after the first refusal"
            - "StaffAssignment.${sa_x1_id}.status == VACATED after the second trigger call"
            - "The third trigger call returns 201: the VACATED peer is invisible to the conflict search"
            - "Obstacle.${y1_id}.staffing_state == MARSHALED and Obstacle.${y1_id}.effective_clearance_rate_per_min == 8.00"
            - "Obstacle.${x1_id}.staffing_state == UNSTAFFED and Obstacle.${x1_id}.effective_clearance_rate_per_min == 0.00"
            - "Course.${course_c2_id}.bottleneck_capacity_pph == 480 and Course.${course_c1_id}.bottleneck_capacity_pph == 0"
            - "StaffAssignment.${sa_y1_id}.course_id == ${course_c2_id} and its shift window is 2026-09-12T08:00:00Z to 2026-09-12T10:00:00Z"

      - name: three_overlapping_heats_share_the_corral_budget_and_the_window_rolls_forward
        grounds:
          - calculations.wave_corral_occupancy_load
          - validations[priority=21].ERR_CORRAL_WINDOW_CONFLICT
          - entities.Wave.fields.scheduled_start_utc
        distinguishing_aspect: |
          The same start corral is contended by many heats at once, which is the opposite
          semantics to the pairwise staff rule: three staggered heats of 60 coexist happily at
          180 of 200, the fourth is refused at 240, and then a fifth at a LATER instant is
          accepted because the oldest heat has already rolled out of the half-open window and
          stops counting. The refused and accepted candidates have identical capacity, so only
          the moving interval arithmetic can distinguish them.
        test_recipe:
          setup:
            - "One venue and one DRAFT course with the three canonical obstacles (design_capacity_pph 450, wave cap 112) and corral_throughput_capacity 200. No permit exists, so quiet hours are skipped."
            - "Heats W1, W2 and W3 of capacity 60 are created at 08:00:00, 08:02:00 and 08:04:00, giving occupancy sums of 60, 120 and 180."
          setup_api_calls:
            - call: "POST /ocr/venues"
              payload: { name: "Ridgeline Quarry", terrain_type: "QUARRY", water_access: "POND", land_use_zone: "AG-2", protected_acreage_sqm: 2000, restoration_bond_cents: 500000 }
              as: PermitOfficer
              captures: { venue_id: $.data.id }
            - call: "POST /ocr/venues/${venue_id}/courses"
              payload: { name: "Quarry Gauntlet", total_distance_m: 10000, corral_release_rate_per_min: 12.00, corral_throughput_capacity: 200 }
              as: CourseDesigner
              captures: { course_id: $.data.id }
            - call: "POST /ocr/courses/${course_id}/obstacles"
              payload: { name: "Cargo Net", station_index: 1, difficulty_rating: 3, lane_count: 4, service_rate_per_min: 3.00, marshals_required: 2, footprint_sqm: 1200, water_contact: false, bypass_mode: "NONE", penalty_seconds: 0 }
              as: CourseDesigner
              captures: { o1_id: $.data.id }
            - call: "POST /ocr/courses/${course_id}/obstacles"
              payload: { name: "Pond Crossing", station_index: 2, difficulty_rating: 5, lane_count: 3, service_rate_per_min: 2.50, marshals_required: 2, footprint_sqm: 1500, water_contact: true, bypass_mode: "MANDATORY", penalty_seconds: 120 }
              as: CourseDesigner
              captures: { o2_id: $.data.id }
            - call: "POST /ocr/courses/${course_id}/obstacles"
              payload: { name: "Wall Climb", station_index: 3, difficulty_rating: 7, lane_count: 3, service_rate_per_min: 3.00, marshals_required: 1, footprint_sqm: 1000, water_contact: false, bypass_mode: "TIMED_PENALTY", penalty_seconds: 90 }
              as: CourseDesigner
              captures: { o3_id: $.data.id }
            - call: "POST /ocr/divisions"
              payload: { name: "Open Wave", division_type: "OPEN", bypass_policy: "ALLOWED_WITH_PENALTY", scoring_mode: "GUN_TIME", min_age: 16, team_size_min: 1, team_size_max: 1 }
              as: RaceDirector
              captures: { div_open_id: $.data.id }
            - call: "POST /ocr/courses/${course_id}/waves"
              payload: { division_id: "${div_open_id}", wave_code: "W1", scheduled_start_utc: "2026-09-12T08:00:00Z", capacity: 60 }
              as: RaceDirector
              captures: { wave_w1_id: $.data.id }
            - call: "POST /ocr/courses/${course_id}/waves"
              payload: { division_id: "${div_open_id}", wave_code: "W2", scheduled_start_utc: "2026-09-12T08:02:00Z", capacity: 60 }
              as: RaceDirector
              captures: { wave_w2_id: $.data.id }
            - call: "POST /ocr/courses/${course_id}/waves"
              payload: { division_id: "${div_open_id}", wave_code: "W3", scheduled_start_utc: "2026-09-12T08:04:00Z", capacity: 60 }
              as: RaceDirector
              captures: { wave_w3_id: $.data.id }
          trigger:
            - call: "POST /ocr/courses/${course_id}/waves"
              payload: { division_id: "${div_open_id}", wave_code: "W4", scheduled_start_utc: "2026-09-12T08:05:00Z", capacity: 60 }
