          The same computed read is taken twice on one order: before any cycle
          it returns every money field at 0 with overhead_rate_pct 18.00 (the
          first tier still matches a zero subtotal) and unit_cost_cents null,
          and after both hulls pass it returns material 5040, oven energy 6000,
