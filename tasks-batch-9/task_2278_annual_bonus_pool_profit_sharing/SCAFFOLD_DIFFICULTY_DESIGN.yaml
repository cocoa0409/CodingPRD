  - rule_id: resource_temporal_overlap
    instances:

      - name: adjacent_leave_allowed_but_overlapping_leave_rejected_half_open
        grounds:
          - validations.priority_87
          - errors.ERR_LEAVE_INTERVAL_OVERLAP
          - entities.EligibilityEvent.fields.leave_end_date
          - endpoints."POST /eligibility-events"
        distinguishing_aspect: |
          Resource = one Participant's leave calendar; interval semantics =
          HALF-OPEN [effective_date, leave_end_date + 1 day). A second leave
          whose effective_date is exactly the day after the first leave's
          INCLUSIVE leave_end_date (2026-03-31 -> 2026-04-01) is adjacent and
          must be accepted, while a third leave starting on the second's own
          leave_end_date (2026-04-30) shares one day and must be refused 409.
          An implementation that treats leave_end_date as exclusive rejects
          the legal adjacent leave; one that compares only effective_dates
          admits the illegal one-day overlap.
        test_recipe:
          setup:
            - "One unit UNIT-T, one plan 2026-01-01..2027-01-01, L3 target row, one participant L3 10,000,000 hired 2025-01-01."
            - "A first unpaid LEAVE occupies 2026-02-01..2026-03-31 inclusive, i.e. the half-open interval [2026-02-01, 2026-04-01)."
          setup_api_calls:
            - call: "POST /business-units"
              payload: { unit_code: "UNIT-T", name: "Unit T" }
              as: PlanAdmin
              captures: { unit_id: "$.data.id" }
            - call: "POST /bonus-plans"
              payload: { plan_year: 2026, plan_name: "FY26 Leave Interval Plan", plan_period_start: "2026-01-01", plan_period_end: "2027-01-01", payment_date: "2027-03-15", company_weight_pct: 50.00, business_unit_weight_pct: 30.00, individual_weight_pct: 20.00, discretionary_budget_pct: 10.00 }
              as: PlanAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /job-level-targets"
              payload: { plan_id: "${plan_id}", job_level: "L3", target_bonus_pct: 10.00, guideline_min_ratio: 0.25, guideline_max_ratio: 2.00 }
              as: PlanAdmin
            - call: "POST /bu-pools"
              payload: { plan_id: "${plan_id}", business_unit_id: "${unit_id}" }
              as: PlanAdmin
              captures: { pool_id: "$.data.id" }
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", business_unit_id: "${unit_id}", employee_code: "E301", full_name: "Lea Ves", job_level: "L3", base_salary_cents: 10000000, hire_date: "2025-01-01" }
              as: PlanAdmin
              captures: { p_id: "$.data.id" }
            - call: "POST /eligibility-events"
              payload: { participant_id: "${p_id}", event_type: "LEAVE", effective_date: "2026-02-01", leave_end_date: "2026-03-31", paid_leave: false, note: "first unpaid leave" }
              as: HRBusinessPartner
              captures: { leave_a: "$.data.id" }
          trigger:
            - call: "POST /eligibility-events"
              payload: { participant_id: "${p_id}", event_type: "LEAVE", effective_date: "2026-04-01", leave_end_date: "2026-04-30", paid_leave: false, note: "adjacent leave, starts the day after the first ends" }
              as: HRBusinessPartner
              captures: { leave_b: "$.data.id" }
            - call: "POST /eligibility-events"
              payload: { participant_id: "${p_id}", event_type: "LEAVE", effective_date: "2026-04-30", leave_end_date: "2026-05-10", paid_leave: false, note: "overlaps the adjacent leave by exactly one day" }
              as: HRBusinessPartner
          assert:
            - "The adjacent leave is created: HTTP status == 201 and EligibilityEvent.${leave_b}.effective_date == 2026-04-01 and EligibilityEvent.${leave_b}.leave_end_date == 2026-04-30 and EligibilityEvent.${leave_b}.superseded == false"
            - "The one-day overlapping leave is refused: HTTP status == 409 and error_id == ERR_LEAVE_INTERVAL_OVERLAP"
            - "GET /eligibility-events?participant_id=${p_id}&event_type=LEAVE returns total_count == 2 (only ${leave_a} and ${leave_b})"
            - "EligibilityEvent.${leave_a}.leave_end_date == 2026-03-31"
            - "Participant.${p_id}.employment_status == ACTIVE"

      - name: accrual_periods_must_tile_closed_inclusive_with_no_gap_and_no_overlap
        grounds:
          - validations.priority_89
          - validations.priority_90
          - errors.ERR_ACCRUAL_PERIOD_GAP
          - errors.ERR_ACCRUAL_PERIOD_OVERLAP
          - entities.AccrualPeriod.fields.period_start
          - endpoints."POST /accrual-periods"
        distinguishing_aspect: |
          Resource = one BonusPlan's accrual calendar; interval semantics =
          CLOSED-INCLUSIVE [period_start, period_end] that must TILE the plan
          period. Unlike the leave calendar, a gap is illegal too: after a
          first period ending 2026-06-30, period_start 2026-07-02 leaves a
          one-day hole and is refused 422 ERR_ACCRUAL_PERIOD_GAP, 2026-06-30
          re-uses the last day and is refused 409 ERR_ACCRUAL_PERIOD_OVERLAP,
          and only 2026-07-01 is accepted. An implementation that reuses the
          half-open leave check accepts the gap.
        test_recipe:
          setup:
            - "One unit UNIT-S, one plan 2026-01-01..2027-01-01, L3 target row, one participant L3 10,000,000 hired 2025-01-01 (so an accrual basis exists)."
            - "H1 accrual period 2026-01-01..2026-06-30 created and POSTED with forecast_company_achievement_pct 60.00."
          setup_api_calls:
            - call: "POST /business-units"
              payload: { unit_code: "UNIT-S", name: "Unit S" }
              as: PlanAdmin
              captures: { unit_id: "$.data.id" }
            - call: "POST /bonus-plans"
              payload: { plan_year: 2026, plan_name: "FY26 Accrual Tiling Plan", plan_period_start: "2026-01-01", plan_period_end: "2027-01-01", payment_date: "2027-03-15", company_weight_pct: 50.00, business_unit_weight_pct: 30.00, individual_weight_pct: 20.00, discretionary_budget_pct: 10.00 }
              as: PlanAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /job-level-targets"
              payload: { plan_id: "${plan_id}", job_level: "L3", target_bonus_pct: 10.00, guideline_min_ratio: 0.25, guideline_max_ratio: 2.00 }
              as: PlanAdmin
            - call: "POST /bu-pools"
              payload: { plan_id: "${plan_id}", business_unit_id: "${unit_id}" }
              as: PlanAdmin
              captures: { pool_id: "$.data.id" }
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", business_unit_id: "${unit_id}", employee_code: "E302", full_name: "Cal Endar", job_level: "L3", base_salary_cents: 10000000, hire_date: "2025-01-01" }
              as: PlanAdmin
              captures: { p_id: "$.data.id" }
            - call: "POST /accrual-periods"
              payload: { plan_id: "${plan_id}", period_start: "2026-01-01", period_end: "2026-06-30", forecast_company_achievement_pct: 60.00 }
              as: FinanceController
              captures: { period1: "$.data.id" }
            - call: "POST /accrual-periods/${period1}/post"
              payload: { posting_note: "H1 provisional accrual" }
              as: FinanceController
          trigger:
            - call: "POST /accrual-periods"
              payload: { plan_id: "${plan_id}", period_start: "2026-07-02", period_end: "2026-12-31", forecast_company_achievement_pct: 60.00 }
              as: FinanceController
            - call: "POST /accrual-periods"
              payload: { plan_id: "${plan_id}", period_start: "2026-06-30", period_end: "2026-12-31", forecast_company_achievement_pct: 60.00 }
              as: FinanceController
            - call: "POST /accrual-periods"
              payload: { plan_id: "${plan_id}", period_start: "2026-07-01", period_end: "2026-12-31", forecast_company_achievement_pct: 60.00 }
              as: FinanceController
              captures: { period2: "$.data.id" }
          assert:
            - "The 2026-07-02 attempt returns HTTP 422 with error_id ERR_ACCRUAL_PERIOD_GAP"
            - "The 2026-06-30 attempt returns HTTP 409 with error_id ERR_ACCRUAL_PERIOD_OVERLAP"
            - "The 2026-07-01 attempt returns HTTP 201 and AccrualPeriod.${period2}.status == OPEN"
            - "AccrualPeriod.${period2}.period_start == 2026-07-01 and AccrualPeriod.${period2}.period_end == 2026-12-31"
            - "AccrualPeriod.${period1}.status == POSTED and AccrualPeriod.${period1}.period_end == 2026-06-30"
            - "GET /bonus-plans/${plan_id}/accrual-periods returns total_count == 2"

  - rule_id: compensating_invariant
    instances:

      - name: retract_allocation_restores_pool_cent_conservation
        grounds:
          - calculations.pool_distribution_state
          - "state_machines.ParticipantAward: allocation_status=PROPOSED -> allocation_status=UNALLOCATED"
          - entities.BusinessUnitPool.fields.available_cents
          - entities.ParticipantAward.fields.retraction_count
          - endpoints."POST /participant-awards/{awardId}/retract-allocation"
        distinguishing_aspect: |
          Conserved quantity = pool cents (funded_cents == allocated_cents +
          available_cents) together with the derived distribution_status. A
          retraction must reverse EVERY side effect of the proposal: 4,000,000
          leaves allocated_cents, returns to available_cents, utilization_pct
          falls from 100.00 back to 0.00, distribution_status flips
          WITHIN_GUIDELINES -> UNDER_UTILIZED, top_tier_award_count returns to
          0, and the plan's governance_posture returns to FLAGGED — while
          retraction_count increments to 1, proving the undo is audited rather
          than silent. Implementations that zero the award but forget
          available_cents (or leave top_tier_award_count at 1) drift.
        test_recipe:
          setup:
            - "CHAIN-L: one unit UNIT-R, one plan (weights 50/30/20, discretionary 10.00%), L5 target 20.00%, single REVENUE metric weight 100.00 with actual == target, one pool certified at 100.00, one participant L5 20,000,000 hired 2025-03-01."
            - "Multiplier 1.0000, pool funded 4,000,000, min_utilization 3,980,000, discretionary_budget 400,000."
