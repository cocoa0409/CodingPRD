              as: ProductionCompany
              as_user_id: "${pc_id}"
              captures: { err: $.data.error_id }
          assert:
            - "rider create is rejected with HTTP 422 and error_id == ERR_AVIATION_COVERAGE_MISSING"
            - "error_id is NOT ERR_FLIGHT_WINDOW_OUTSIDE_SHOOT even though the 2026-06-05 flight window is outside the 2026-06-01 shoot (safety priority 50 < temporal priority 55)"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: notification_lead_days_boundary
        grounds:
          - validations[priority=55]
          - entities.NeighborhoodNotification.fields.lead_days
          - errors[ERR_NOTICE_TOO_LATE]
        distinguishing_aspect: "lead_days must be >= 7 (>= boundary): with the clock exactly 7 days before shoot_start, lead_days == 7 and the notification is accepted; one day later it would fail."
        test_recipe:
          setup:
            - "Clock set to 2026-06-01T08:00:00Z. Company + application whose shoot_start is 2026-06-08T08:00:00Z (exactly 7*86400 s later)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: FilmOfficeCoordinator
            - call: "POST /production-companies"
              payload: { legal_name: "P6a", contact_email: "6a@x.test", primary_contact: "F" }
              as: FilmOfficeCoordinator
              captures: { pc_id: $.data.id }
            - call: "POST /applications"
              payload: { production_company_id: "${pc_id}", title: "P6a", synopsis: "x", shoot_start_at: "2026-06-08T08:00:00Z", shoot_end_at: "2026-06-08T20:00:00Z", crew_size: 5 }
              as: ProductionCompany
              as_user_id: "${pc_id}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /applications/${app_id}/notifications"
              payload: { geo_zone: "Z1", notice_method: "MAILED" }
              as: FilmOfficeCoordinator
              captures: { lead: $.data.lead_days }
          assert:
            - "notification is created with HTTP 201"
            - "NeighborhoodNotification.lead_days == 7 (exactly at the >= 7 boundary; at 6 it would be rejected with ERR_NOTICE_TOO_LATE)"

      - name: submit_zero_locations_empty_set
        grounds:
          - validations[priority=35]
          - errors[ERR_NO_LOCATIONS]
          - state_machines.PermitApplication.DRAFT_to_UNDER_REVIEW
        distinguishing_aspect: "Empty-collection boundary on a different metric/endpoint: submitting an application with zero LocationDetail rows fails ERR_NO_LOCATIONS (cardinality edge, not a numeric threshold)."
        test_recipe:
          setup:
            - "Company + DRAFT application with NO location-details added; clock 2026-05-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: FilmOfficeCoordinator
            - call: "POST /production-companies"
              payload: { legal_name: "P6b", contact_email: "6b@x.test", primary_contact: "G" }
              as: FilmOfficeCoordinator
              captures: { pc_id: $.data.id }
            - call: "POST /applications"
              payload: { production_company_id: "${pc_id}", title: "P6b", synopsis: "x", shoot_start_at: "2026-06-01T08:00:00Z", shoot_end_at: "2026-06-01T18:00:00Z", crew_size: 5 }
              as: ProductionCompany
              as_user_id: "${pc_id}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: ProductionCompany
              as_user_id: "${pc_id}"
              captures: { err: $.data.error_id }
          assert:
            - "submit is rejected with HTTP 422 and error_id == ERR_NO_LOCATIONS"
            - "PermitApplication.${app_id}.status remains DRAFT"

