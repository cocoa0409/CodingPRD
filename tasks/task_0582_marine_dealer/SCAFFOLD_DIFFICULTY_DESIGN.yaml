scaffold_difficulty_design:

  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: floor_plan_payoff_forward_vs_chronological
        grounds:
          - calculations.floor_plan_accrual
          - entities.FloorPlan.fields.accrued_interest_cents
          - entities.FloorPlan.fields.payoff_cents
        distinguishing_aspect: |
          On a FloorPlan (finance domain), the chronological accrual to clock_now
          (191562) and the forward payoff quote projected PAYOFF_NOTICE_DAYS beyond
          clock_now (8212384) are computed from identical fields yet differ.
        test_recipe:
          setup:
            - "Clock at 2026-06-01; a Unit with a single FloorPlan advanced_at 2026-03-01, principal 8000000, apr 950 bps (92 days out)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Manager
            - call: "POST /units"
              payload: { hin: "HINPAYOFF0001", make: "Sea Ray", model: "SLX", model_year: 2024, unit_type: "BOAT", length_ft: 28, cost_cents: 7000000, list_price_cents: 9000000, acquisition_type: "FLOOR_PLAN" }
              as: Manager
              captures: { u_id: $.data.id, u_v: $.data.version }
            - call: "POST /floor-plans"
              payload: { unit_id: "${u_id}", lender_name: "Marine Credit", principal_cents: 8000000, apr_bps: 950, advanced_at: "2026-03-01T00:00:00Z", curtailment_pct_bps: 1000, expected_unit_version: "${u_v}" }
              as: Manager
              captures: { fp_id: $.data.id }
          trigger:
            - call: "GET /floor-plans/${fp_id}"
              payload: {}
              as: Manager
          assert:
            - "FloorPlan.${fp_id}.accrued_interest_cents == 191562"
            - "FloorPlan.${fp_id}.payoff_cents == 8212384"

      - name: repair_order_estimate_vs_final
        grounds:
          - calculations.repair_order_totals
          - entities.RepairOrder.fields.estimate_total_cents
          - entities.RepairOrder.fields.final_total_cents
        distinguishing_aspect: |
          On a RepairOrder (service domain), the provisional estimate (51480, from
          estimated_hours) and the final total (63060, from actual ServiceLines)
          differ for the same RO — a distinct entity domain from FloorPlan.
        test_recipe:
          setup:
            - "Part with on_hand 10; a CUSTOM RO estimated_hours 4.0, labor rate 12000, tax 725 bps; three ACTIVE lines (2.5h, 3x part @4599, 1.25h)."
          setup_api_calls:
            - call: "POST /parts"
              payload: { sku: "SKU-RO-1", name: "Impeller", on_hand_qty: 10, unit_cost_cents: 2000, list_price_cents: 4599, reorder_point: 2 }
              as: PartsClerk
              captures: { p_id: $.data.id }
            - call: "POST /units"
              payload: { hin: "HINROEST00001", make: "Yamaha", model: "242", model_year: 2023, unit_type: "BOAT", length_ft: 24, cost_cents: 6000000, list_price_cents: 7500000, acquisition_type: "CASH" }
              as: Manager
              captures: { u_id: $.data.id }
            - call: "POST /service-bays"
              payload: { bay_code: "BAY-RO-1", bay_type: "MECHANICAL" }
              as: Manager
              captures: { bay_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { unit_id: "${u_id}", service_bay_id: "${bay_id}", customer_name: "Ada", ro_type: "CUSTOM", labor_rate_cents_per_hour: 12000, tax_rate_bps: 725, scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T12:00:00Z", estimated_hours: 4.0 }
              as: ServiceAdvisor
              captures: { ro_id: $.data.id, est: $.data.estimate_total_cents }
            - call: "POST /service-lines"
              payload: { repair_order_id: "${ro_id}", line_type: "LABOR", hours: 2.5, unit_price_cents: 12000 }
              as: ServiceAdvisor
            - call: "POST /service-lines"
              payload: { repair_order_id: "${ro_id}", line_type: "PART", part_id: "${p_id}", quantity: 3, unit_price_cents: 4599 }
              as: ServiceAdvisor
            - call: "POST /service-lines"
              payload: { repair_order_id: "${ro_id}", line_type: "LABOR", hours: 1.25, unit_price_cents: 12000 }
              as: ServiceAdvisor
            - call: "POST /repair-orders/${ro_id}/start"
              payload: {}
              as: ServiceAdvisor
          trigger:
            - call: "POST /repair-orders/${ro_id}/complete"
              payload: {}
              as: ServiceAdvisor
          assert:
            - "RepairOrder.${ro_id}.estimate_total_cents == 51480"
            - "RepairOrder.${ro_id}.final_total_cents == 63060"

  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: deal_amount_due_nested_max_and_tradein
        grounds:
          - calculations.deal_financials
          - entities.Deal.fields.amount_due_cents
          - entities.Deal.fields.tax_cents
          - entities.Deal.fields.trade_equity_cents
        distinguishing_aspect: |
          Mode (a): amount_due_cents combines 6 inputs with a nested max on the tax
          base and a signed trade-equity term; sale 5000000 yields tax 275500 and
          amount_due 3515400.
        test_recipe:
          setup:
            - "An AVAILABLE Unit; a DRAFT Deal with sale 5000000, tax 725 bps, doc 39900, down 1000000, trade allowance 1200000, lien 400000."
          setup_api_calls:
            - call: "POST /units"
              payload: { hin: "HINDEALFIN001", make: "Boston Whaler", model: "280", model_year: 2024, unit_type: "BOAT", length_ft: 28, cost_cents: 4200000, list_price_cents: 5200000, acquisition_type: "CASH" }
              as: Manager
              captures: { u_id: $.data.id }
            - call: "POST /units/${u_id}/list"
              payload: {}
              as: Manager
          trigger:
            - call: "POST /deals"
              payload: { unit_id: "${u_id}", customer_name: "Grace", sale_price_cents: 5000000, financing_type: "RETAIL_FINANCE", tax_rate_bps: 725, doc_fee_cents: 39900, down_payment_cents: 1000000, trade_allowance_cents: 1200000, trade_lien_payoff_cents: 400000 }
              as: SalesRep
              captures: { d_id: $.data.id }
          assert:
            - "Deal.${d_id}.trade_equity_cents == 800000"
            - "Deal.${d_id}.tax_cents == 275500"
            - "Deal.${d_id}.amount_due_cents == 3515400"

      - name: repair_order_final_round_per_line_then_sum
        grounds:
          - calculations.repair_order_totals
          - entities.ServiceLine.fields.extended_cents
          - entities.RepairOrder.fields.final_total_cents
        distinguishing_aspect: |
          Mode (b): two LABOR lines (1.5h and 2.5h @10033) rounded PER LINE then
          summed give 40133; sum-then-round would give 40132. The scaffold pins
          per-line rounding before summation.
        test_recipe:
          setup:
            - "A CUSTOM RO (tax 0 bps) with two ACTIVE LABOR lines: 1.5h and 2.5h, both priced 10033 cents/hour."
          setup_api_calls:
            - call: "POST /units"
              payload: { hin: "HINRORND00001", make: "Yamaha", model: "255", model_year: 2023, unit_type: "BOAT", length_ft: 25, cost_cents: 6100000, list_price_cents: 7600000, acquisition_type: "CASH" }
              as: Manager
              captures: { u_id: $.data.id }
            - call: "POST /service-bays"
              payload: { bay_code: "BAY-RND-1", bay_type: "MECHANICAL" }
              as: Manager
              captures: { bay_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { unit_id: "${u_id}", service_bay_id: "${bay_id}", customer_name: "Linus", ro_type: "CUSTOM", labor_rate_cents_per_hour: 10033, tax_rate_bps: 0, scheduled_start: "2026-06-03T09:00:00Z", scheduled_end: "2026-06-03T12:00:00Z", estimated_hours: 4.0 }
              as: ServiceAdvisor
              captures: { ro_id: $.data.id }
            - call: "POST /service-lines"
              payload: { repair_order_id: "${ro_id}", line_type: "LABOR", hours: 1.5, unit_price_cents: 10033 }
              as: ServiceAdvisor
              captures: { l1_id: $.data.id }
            - call: "POST /service-lines"
              payload: { repair_order_id: "${ro_id}", line_type: "LABOR", hours: 2.5, unit_price_cents: 10033 }
              as: ServiceAdvisor
              captures: { l2_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/start"
              payload: {}
              as: ServiceAdvisor
          trigger:
            - call: "POST /repair-orders/${ro_id}/complete"
              payload: {}
              as: ServiceAdvisor
          assert:
            - "ServiceLine.${l1_id}.extended_cents == 15050"
            - "ServiceLine.${l2_id}.extended_cents == 25083"
            - "RepairOrder.${ro_id}.final_total_cents == 40133"

  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: deal_branch_funded_to_cancelled_diverges
        grounds:
          - state_machines.Deal.FUNDED_to_CANCELLED
          - state_machines.Deal.SIGNED_to_CANCELLED
          - state_machines.Deal.DRAFT_to_CANCELLED
        distinguishing_aspect: |
          Deal is non-linear branching: CANCELLED is reachable from DRAFT, SIGNED,
          and FUNDED with divergent side-effect sets — FUNDED->CANCELLED reactivates
          the FloorPlan and reverts the Unit to AVAILABLE, unlike DRAFT->CANCELLED.
        test_recipe:
          setup:
            - "A FUNDED Deal on a floor-planned Unit (Unit SOLD, FloorPlan PAID_OFF)."
          setup_api_calls:
            - call: "POST /units"
              payload: { hin: "HINDLBRNCH001", make: "Grady-White", model: "251", model_year: 2024, unit_type: "BOAT", length_ft: 25, cost_cents: 6000000, list_price_cents: 7200000, acquisition_type: "FLOOR_PLAN" }
              as: Manager
              captures: { u_id: $.data.id, u_v: $.data.version }
            - call: "POST /floor-plans"
              payload: { unit_id: "${u_id}", lender_name: "Marine Credit", principal_cents: 5000000, apr_bps: 900, advanced_at: "2026-04-01T00:00:00Z", curtailment_pct_bps: 1000, expected_unit_version: "${u_v}" }
              as: Manager
              captures: { fp_id: $.data.id }
            - call: "POST /units/${u_id}/list"
              payload: {}
              as: Manager
            - call: "POST /deals"
              payload: { unit_id: "${u_id}", customer_name: "Mabel", sale_price_cents: 7000000, financing_type: "CASH", tax_rate_bps: 700, doc_fee_cents: 39900, down_payment_cents: 3000000 }
              as: SalesRep
              captures: { d_id: $.data.id }
            - call: "POST /deals/${d_id}/sign"
              payload: {}
              as: SalesRep
            - call: "POST /deals/${d_id}/fund"
              payload: {}
              as: Manager
          trigger:
            - call: "POST /deals/${d_id}/cancel"
              payload: {}
              as: Manager
          assert:
            - "Deal.${d_id}.status == CANCELLED"
            - "Unit.${u_id}.status == AVAILABLE"
            - "FloorPlan.${fp_id}.status == ACTIVE"

      - name: repair_order_reopen_cycle
        grounds:
          - state_machines.RepairOrder.COMPLETED_to_IN_PROGRESS
          - state_machines.RepairOrder.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          RepairOrder is cyclic: COMPLETED->IN_PROGRESS (reopen) is a back-edge into
          a non-terminal state, distinct from Deal's branching.
        test_recipe:
          setup:
            - "A COMPLETED RO."
          setup_api_calls:
            - call: "POST /units"
              payload: { hin: "HINROCYCLE001", make: "Mercury", model: "V8", model_year: 2022, unit_type: "MOTOR", length_ft: 0, cost_cents: 2500000, list_price_cents: 3000000, acquisition_type: "CASH" }
              as: Manager
              captures: { u_id: $.data.id }
            - call: "POST /service-bays"
              payload: { bay_code: "BAY-CYC-1", bay_type: "MECHANICAL" }
              as: Manager
              captures: { bay_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { unit_id: "${u_id}", service_bay_id: "${bay_id}", customer_name: "Otis", ro_type: "DIAGNOSTIC", labor_rate_cents_per_hour: 11000, tax_rate_bps: 700, scheduled_start: "2026-06-04T09:00:00Z", scheduled_end: "2026-06-04T10:00:00Z", estimated_hours: 1.0 }
              as: ServiceAdvisor
              captures: { ro_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/start"
              payload: {}
              as: ServiceAdvisor
            - call: "POST /repair-orders/${ro_id}/complete"
              payload: {}
              as: ServiceAdvisor
          trigger:
            - call: "POST /repair-orders/${ro_id}/reopen"
              payload: {}
              as: ServiceAdvisor
          assert:
            - "RepairOrder.${ro_id}.status == IN_PROGRESS"

  # ==========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: fund_cascades_unit_sold_floorplan_paidoff
        grounds:
          - state_machines.Deal.SIGNED_to_FUNDED
          - state_machines.Unit.RESERVED_to_SOLD
          - state_machines.FloorPlan.ACTIVE_to_PAID_OFF
          - entities.Unit.fields.floor_plan_balance_cents
        distinguishing_aspect: |
          Depth-3 chain from Deal.fund: Deal->FUNDED mutates Unit->SOLD, which itself
          drives FloorPlan->PAID_OFF, which itself recomputes Unit.floor_plan_balance_cents
          to 0 — each hop caused by the prior, not by the fund action directly.
        test_recipe:
          setup:
            - "A SIGNED Deal on a floor-planned Unit; FloorPlan ACTIVE with outstanding 8000000."
          setup_api_calls:
            - call: "POST /units"
              payload: { hin: "HINCASCADE001", make: "Sea Ray", model: "SPX", model_year: 2024, unit_type: "BOAT", length_ft: 21, cost_cents: 5500000, list_price_cents: 6800000, acquisition_type: "FLOOR_PLAN" }
              as: Manager
              captures: { u_id: $.data.id, u_v: $.data.version }
            - call: "POST /floor-plans"
              payload: { unit_id: "${u_id}", lender_name: "Marine Credit", principal_cents: 8000000, apr_bps: 950, advanced_at: "2026-04-15T00:00:00Z", curtailment_pct_bps: 1000, expected_unit_version: "${u_v}" }
              as: Manager
              captures: { fp_id: $.data.id }
            - call: "POST /units/${u_id}/list"
              payload: {}
              as: Manager
            - call: "POST /deals"
              payload: { unit_id: "${u_id}", customer_name: "Reed", sale_price_cents: 6800000, financing_type: "CASH", tax_rate_bps: 700, doc_fee_cents: 39900, down_payment_cents: 3000000 }
              as: SalesRep
              captures: { d_id: $.data.id }
            - call: "POST /deals/${d_id}/sign"
              payload: {}
              as: SalesRep
          trigger:
            - call: "POST /deals/${d_id}/fund"
              payload: {}
              as: Manager
          assert:
            - "Deal.${d_id}.status == FUNDED"
            - "Unit.${u_id}.status == SOLD"
            - "FloorPlan.${fp_id}.status == PAID_OFF"
            - "FloorPlan.${fp_id}.outstanding_principal_cents == 0"
            - "Unit.${u_id}.floor_plan_balance_cents == 0"

      - name: invoice_cascades_part_consume_available
        grounds:
          - state_machines.RepairOrder.COMPLETED_to_INVOICED
          - state_machines.ServiceLine.ACTIVE_to_CONSUMED
          - entities.Part.fields.on_hand_qty
          - entities.Part.fields.available_qty
        distinguishing_aspect: |
          Chain from RepairOrder.invoice (a different trigger): RO->INVOICED drives the
          PART line ACTIVE->CONSUMED, which itself decrements Part.on_hand_qty (10->7),
          which itself recomputes Part.available_qty.
        test_recipe:
          setup:
            - "A COMPLETED RO with one ACTIVE PART line (qty 3) against a Part on_hand 10 (reserved 3, available 7)."
          setup_api_calls:
            - call: "POST /parts"
              payload: { sku: "SKU-CONS-1", name: "Water Pump", on_hand_qty: 10, unit_cost_cents: 3000, list_price_cents: 6000, reorder_point: 2 }
              as: PartsClerk
              captures: { p_id: $.data.id }
            - call: "POST /units"
              payload: { hin: "HININVCONS001", make: "Suzuki", model: "DF200", model_year: 2022, unit_type: "MOTOR", length_ft: 0, cost_cents: 2000000, list_price_cents: 2600000, acquisition_type: "CASH" }
              as: Manager
              captures: { u_id: $.data.id }
            - call: "POST /service-bays"
              payload: { bay_code: "BAY-INV-1", bay_type: "MECHANICAL" }
              as: Manager
              captures: { bay_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { unit_id: "${u_id}", service_bay_id: "${bay_id}", customer_name: "Perl", ro_type: "CUSTOM", labor_rate_cents_per_hour: 11000, tax_rate_bps: 700, scheduled_start: "2026-06-05T09:00:00Z", scheduled_end: "2026-06-05T11:00:00Z", estimated_hours: 2.0 }
              as: ServiceAdvisor
              captures: { ro_id: $.data.id }
            - call: "POST /service-lines"
              payload: { repair_order_id: "${ro_id}", line_type: "PART", part_id: "${p_id}", quantity: 3, unit_price_cents: 6000 }
              as: ServiceAdvisor
              captures: { line_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/start"
              payload: {}
              as: ServiceAdvisor
            - call: "POST /repair-orders/${ro_id}/complete"
              payload: {}
              as: ServiceAdvisor
          trigger:
            - call: "POST /repair-orders/${ro_id}/invoice"
              payload: {}
              as: ServiceAdvisor
          assert:
            - "RepairOrder.${ro_id}.status == INVOICED"
            - "ServiceLine.${line_id}.status == CONSUMED"
            - "Part.${p_id}.on_hand_qty == 7"
            - "Part.${p_id}.reserved_qty == 0"
            - "Part.${p_id}.available_qty == 7"

  # ==========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: fund_state_beats_fiscal
        grounds:
          - validations[priority=8]
          - validations[priority=17]
          - state_machines.Deal.SIGNED_to_FUNDED
        distinguishing_aspect: |
          A DRAFT deal with an underfunded down payment violates BOTH state (priority 8)
          and business_fiscal (priority 17) on fund; the state error wins -> ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "A DRAFT Deal (never signed) with sale 5000000 and down 100000 (below the 500000 minimum)."
          setup_api_calls:
            - call: "POST /units"
              payload: { hin: "HINP5CONF0001", make: "Bayliner", model: "VR5", model_year: 2023, unit_type: "BOAT", length_ft: 22, cost_cents: 3800000, list_price_cents: 4600000, acquisition_type: "CASH" }
              as: Manager
              captures: { u_id: $.data.id }
            - call: "POST /units/${u_id}/list"
              payload: {}
              as: Manager
            - call: "POST /deals"
              payload: { unit_id: "${u_id}", customer_name: "Nils", sale_price_cents: 5000000, financing_type: "RETAIL_FINANCE", tax_rate_bps: 700, doc_fee_cents: 39900, down_payment_cents: 100000 }
              as: SalesRep
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /deals/${d_id}/fund"
              payload: {}
              as: Manager
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: slip_constraint_beats_temporal
        grounds:
          - validations[priority=14]
          - validations[priority=15]
        distinguishing_aspect: |
          A reservation with an oversized unit that also overlaps an existing booking
          violates business_constraint (priority 14) and business_temporal (priority 15);
          the constraint error wins -> ERR_UNIT_EXCEEDS_BERTH.
        test_recipe:
          setup:
            - "Berth max_length 30 with a RESERVED [06-01,06-10) booking by a 25ft unit; a second 40ft unit."
          setup_api_calls:
            - call: "POST /berths"
              payload: { berth_code: "BR-CONF-1", berth_type: "WET_SLIP", max_length_ft: 30 }
              as: Manager
              captures: { b_id: $.data.id }
            - call: "POST /units"
              payload: { hin: "HINSLIPFIT001", make: "Tracker", model: "Pro", model_year: 2021, unit_type: "BOAT", length_ft: 25, cost_cents: 1800000, list_price_cents: 2200000, acquisition_type: "CASH" }
              as: Manager
              captures: { ua_id: $.data.id }
            - call: "POST /units"
              payload: { hin: "HINSLIPBIG001", make: "Viking", model: "44", model_year: 2020, unit_type: "BOAT", length_ft: 40, cost_cents: 9000000, list_price_cents: 12000000, acquisition_type: "CASH" }
              as: Manager
              captures: { ub_id: $.data.id }
            - call: "POST /slip-reservations"
              payload: { berth_id: "${b_id}", unit_id: "${ua_id}", start_date: "2026-06-01T00:00:00Z", end_date: "2026-06-10T00:00:00Z", daily_rate_cents: 5000 }
              as: ServiceAdvisor
          trigger:
            - call: "POST /slip-reservations"
              payload: { berth_id: "${b_id}", unit_id: "${ub_id}", start_date: "2026-06-05T00:00:00Z", end_date: "2026-06-15T00:00:00Z", daily_rate_cents: 5000 }
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_UNIT_EXCEEDS_BERTH"

  # ==========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: curtailment_due_exactly_at_90_days
        grounds:
          - validations[priority=18]
          - state_machines.FloorPlan.ACTIVE_to_CURTAILED
          - calculations.floor_plan_accrual
        distinguishing_aspect: |
          Numeric threshold: a FloorPlan advanced_at exactly 90 days before clock_now
          (2026-03-03 vs 2026-06-01) satisfies days>=CURTAILMENT_DUE_DAYS and curtail succeeds.
        test_recipe:
          setup:
            - "Clock 2026-06-01; FloorPlan advanced_at 2026-03-03 (exactly 90 days), outstanding 8000000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Manager
            - call: "POST /units"
              payload: { hin: "HINCURT90001", make: "Sea Ray", model: "SDX", model_year: 2024, unit_type: "BOAT", length_ft: 26, cost_cents: 6000000, list_price_cents: 7500000, acquisition_type: "FLOOR_PLAN" }
              as: Manager
              captures: { u_id: $.data.id, u_v: $.data.version }
            - call: "POST /floor-plans"
              payload: { unit_id: "${u_id}", lender_name: "Marine Credit", principal_cents: 8000000, apr_bps: 900, advanced_at: "2026-03-03T00:00:00Z", curtailment_pct_bps: 1000, expected_unit_version: "${u_v}" }
              as: Manager
              captures: { fp_id: $.data.id }
          trigger:
            - call: "POST /floor-plans/${fp_id}/curtail"
              payload: { payment_cents: 100000 }
              as: Manager
          assert:
            - "FloorPlan.${fp_id}.status == CURTAILED"
            - "FloorPlan.${fp_id}.outstanding_principal_cents == 7900000"

      - name: service_line_part_zero_quantity_rejected
        grounds:
          - validations[priority=20]
          - entities.ServiceLine.fields.quantity
        distinguishing_aspect: |
          Zero-count edge on a different endpoint (POST /service-lines): a PART line
          with quantity 0 is below the >=1 floor and is rejected with ERR_INVALID_QUANTITY.
        test_recipe:
          setup:
            - "An OPEN RO and a Part in stock."
          setup_api_calls:
            - call: "POST /parts"
              payload: { sku: "SKU-ZERO-1", name: "Anode", on_hand_qty: 5, unit_cost_cents: 800, list_price_cents: 1600, reorder_point: 1 }
              as: PartsClerk
              captures: { p_id: $.data.id }
            - call: "POST /units"
              payload: { hin: "HINZEROQTY01", make: "Mercury", model: "Pro", model_year: 2022, unit_type: "MOTOR", length_ft: 0, cost_cents: 1500000, list_price_cents: 1900000, acquisition_type: "CASH" }
              as: Manager
              captures: { u_id: $.data.id }
            - call: "POST /service-bays"
              payload: { bay_code: "BAY-ZERO-1", bay_type: "MECHANICAL" }
              as: Manager
              captures: { bay_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { unit_id: "${u_id}", service_bay_id: "${bay_id}", customer_name: "Quinn", ro_type: "CUSTOM", labor_rate_cents_per_hour: 11000, tax_rate_bps: 700, scheduled_start: "2026-06-06T09:00:00Z", scheduled_end: "2026-06-06T10:00:00Z", estimated_hours: 1.0 }
              as: ServiceAdvisor
              captures: { ro_id: $.data.id }
          trigger:
            - call: "POST /service-lines"
              payload: { repair_order_id: "${ro_id}", line_type: "PART", part_id: "${p_id}", quantity: 0, unit_price_cents: 1600 }
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_QUANTITY"

  # ==========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: deal_sign_requires_unit_available
        grounds:
          - state_machines.Deal.DRAFT_to_SIGNED
          - validations[priority=9]
          - entities.Unit.fields.status
        distinguishing_aspect: |
          Deal->Unit dependency: signing a Deal whose Unit is still INTAKE (not AVAILABLE)
          is rejected with ERR_UNIT_NOT_AVAILABLE.
        test_recipe:
          setup:
            - "A Unit left in INTAKE (never listed) with a DRAFT Deal on it."
          setup_api_calls:
            - call: "POST /units"
              payload: { hin: "HINSIGNDEP01", make: "Chaparral", model: "21", model_year: 2023, unit_type: "BOAT", length_ft: 21, cost_cents: 4000000, list_price_cents: 4800000, acquisition_type: "CASH" }
              as: Manager
              captures: { u_id: $.data.id }
            - call: "POST /deals"
              payload: { unit_id: "${u_id}", customer_name: "Ivy", sale_price_cents: 4800000, financing_type: "CASH", tax_rate_bps: 700, doc_fee_cents: 39900, down_payment_cents: 2000000 }
              as: SalesRep
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /deals/${d_id}/sign"
              payload: {}
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_UNIT_NOT_AVAILABLE"

      - name: slip_reservation_requires_berth_open
        grounds:
          - validations[priority=13]
          - state_machines.Berth.OPEN_to_CLOSED
          - entities.Berth.fields.status
        distinguishing_aspect: |
          SlipReservation->Berth dependency (a different entity pair): reserving a CLOSED
          berth is rejected with ERR_BERTH_CLOSED.
        test_recipe:
          setup:
            - "A CLOSED Berth (max_length 40) and a 25ft Unit."
          setup_api_calls:
            - call: "POST /berths"
              payload: { berth_code: "BR-CLOSED-1", berth_type: "WET_SLIP", max_length_ft: 40 }
              as: Manager
              captures: { b_id: $.data.id }
            - call: "POST /berths/${b_id}/close"
              payload: {}
              as: Manager
            - call: "POST /units"
              payload: { hin: "HINBERTHCL01", make: "Tracker", model: "Bass", model_year: 2021, unit_type: "BOAT", length_ft: 25, cost_cents: 1700000, list_price_cents: 2100000, acquisition_type: "CASH" }
              as: Manager
              captures: { u_id: $.data.id }
          trigger:
            - call: "POST /slip-reservations"
              payload: { berth_id: "${b_id}", unit_id: "${u_id}", start_date: "2026-06-01T00:00:00Z", end_date: "2026-06-05T00:00:00Z", daily_rate_cents: 4000 }
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_BERTH_CLOSED"

  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: berth_halfopen_date_overlap_rejected
        grounds:
          - validations[priority=15]
          - entities.SlipReservation.fields.start_date
          - entities.SlipReservation.fields.end_date
        distinguishing_aspect: |
          Berth uses half-open [start,end) date intervals, capacity 1: [06-05,06-15)
          overlaps existing [06-01,06-10) and is rejected with ERR_BERTH_DOUBLE_BOOKED.
        test_recipe:
          setup:
            - "Berth (max_length 40) with a RESERVED [06-01,06-10) booking by a 30ft unit; a second 30ft unit."
          setup_api_calls:
            - call: "POST /berths"
              payload: { berth_code: "BR-OVL-1", berth_type: "WET_SLIP", max_length_ft: 40 }
              as: Manager
              captures: { b_id: $.data.id }
            - call: "POST /units"
              payload: { hin: "HINBROVLA001", make: "Sea Ray", model: "230", model_year: 2022, unit_type: "BOAT", length_ft: 30, cost_cents: 5000000, list_price_cents: 6000000, acquisition_type: "CASH" }
              as: Manager
              captures: { ua_id: $.data.id }
            - call: "POST /units"
              payload: { hin: "HINBROVLB001", make: "Sea Ray", model: "230", model_year: 2022, unit_type: "BOAT", length_ft: 30, cost_cents: 5000000, list_price_cents: 6000000, acquisition_type: "CASH" }
              as: Manager
              captures: { ub_id: $.data.id }
            - call: "POST /slip-reservations"
              payload: { berth_id: "${b_id}", unit_id: "${ua_id}", start_date: "2026-06-01T00:00:00Z", end_date: "2026-06-10T00:00:00Z", daily_rate_cents: 5000 }
              as: ServiceAdvisor
          trigger:
            - call: "POST /slip-reservations"
              payload: { berth_id: "${b_id}", unit_id: "${ub_id}", start_date: "2026-06-05T00:00:00Z", end_date: "2026-06-15T00:00:00Z", daily_rate_cents: 5000 }
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_BERTH_DOUBLE_BOOKED"

      - name: bay_buffered_timestamp_overlap_rejected
        grounds:
          - validations[priority=16]
          - entities.RepairOrder.fields.scheduled_start
          - entities.RepairOrder.fields.scheduled_end
        distinguishing_aspect: |
          ServiceBay uses closed timestamp windows plus a 30-minute buffer: a RO at
          11:15 falls inside the buffer after an 09:00-11:00 RO and is rejected with
          ERR_BAY_SCHEDULE_CONFLICT — different interval arithmetic than the berth.
        test_recipe:
          setup:
            - "A ServiceBay with an OPEN RO scheduled 09:00-11:00; a second unit."
          setup_api_calls:
            - call: "POST /service-bays"
              payload: { bay_code: "BAY-OVL-1", bay_type: "RIGGING" }
              as: Manager
              captures: { bay_id: $.data.id }
            - call: "POST /units"
              payload: { hin: "HINBAYOVLA01", make: "Yamaha", model: "AR", model_year: 2023, unit_type: "BOAT", length_ft: 20, cost_cents: 4500000, list_price_cents: 5300000, acquisition_type: "CASH" }
              as: Manager
              captures: { ua_id: $.data.id }
            - call: "POST /units"
              payload: { hin: "HINBAYOVLB01", make: "Yamaha", model: "AR", model_year: 2023, unit_type: "BOAT", length_ft: 20, cost_cents: 4500000, list_price_cents: 5300000, acquisition_type: "CASH" }
              as: Manager
              captures: { ub_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { unit_id: "${ua_id}", service_bay_id: "${bay_id}", customer_name: "Cleo", ro_type: "DIAGNOSTIC", labor_rate_cents_per_hour: 11000, tax_rate_bps: 700, scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T11:00:00Z", estimated_hours: 2.0 }
              as: ServiceAdvisor
          trigger:
            - call: "POST /repair-orders"
              payload: { unit_id: "${ub_id}", service_bay_id: "${bay_id}", customer_name: "Dax", ro_type: "DIAGNOSTIC", labor_rate_cents_per_hour: 11000, tax_rate_bps: 700, scheduled_start: "2026-06-02T11:15:00Z", scheduled_end: "2026-06-02T12:00:00Z", estimated_hours: 0.75 }
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_BAY_SCHEDULE_CONFLICT"

  # ==========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: part_reserve_then_void_conserves_inventory
        grounds:
          - state_machines.ServiceLine.ACTIVE_to_VOID
          - calculations.part_availability
          - entities.Part.fields.on_hand_qty
          - entities.Part.fields.available_qty
        distinguishing_aspect: |
          Conserved quantity = part units. Reserving 4 units on a PART line then voiding
          it leaves on_hand_qty at 10 and returns available_qty to 10 (reserved_qty back to 0).
        test_recipe:
          setup:
            - "Part on_hand 10; an OPEN RO with an ACTIVE PART line reserving 4 (available 6)."
          setup_api_calls:
            - call: "POST /parts"
              payload: { sku: "SKU-INVAR-1", name: "Prop", on_hand_qty: 10, unit_cost_cents: 5000, list_price_cents: 9000, reorder_point: 2 }
              as: PartsClerk
              captures: { p_id: $.data.id }
            - call: "POST /units"
              payload: { hin: "HININVAR0001", make: "Mercury", model: "Prop", model_year: 2022, unit_type: "MOTOR", length_ft: 0, cost_cents: 1200000, list_price_cents: 1500000, acquisition_type: "CASH" }
              as: Manager
              captures: { u_id: $.data.id }
            - call: "POST /service-bays"
              payload: { bay_code: "BAY-INVAR-1", bay_type: "MECHANICAL" }
              as: Manager
              captures: { bay_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { unit_id: "${u_id}", service_bay_id: "${bay_id}", customer_name: "Rex", ro_type: "CUSTOM", labor_rate_cents_per_hour: 11000, tax_rate_bps: 700, scheduled_start: "2026-06-07T09:00:00Z", scheduled_end: "2026-06-07T10:00:00Z", estimated_hours: 1.0 }
              as: ServiceAdvisor
              captures: { ro_id: $.data.id }
            - call: "POST /service-lines"
              payload: { repair_order_id: "${ro_id}", line_type: "PART", part_id: "${p_id}", quantity: 4, unit_price_cents: 9000 }
              as: ServiceAdvisor
              captures: { line_id: $.data.id }
          trigger:
            - call: "POST /service-lines/${line_id}/void"
              payload: {}
              as: ServiceAdvisor
          assert:
            - "ServiceLine.${line_id}.status == VOID"
            - "Part.${p_id}.on_hand_qty == 10"
            - "Part.${p_id}.reserved_qty == 0"
            - "Part.${p_id}.available_qty == 10"

      - name: deal_fund_then_cancel_conserves_floorplan_principal
        grounds:
          - state_machines.Deal.FUNDED_to_CANCELLED
          - state_machines.FloorPlan.PAID_OFF_to_ACTIVE
          - entities.FloorPlan.fields.principal_cents
          - entities.FloorPlan.fields.outstanding_principal_cents
        distinguishing_aspect: |
          Conserved quantity = floor-plan principal (money). Funding then cancelling a
          deal round-trips FloorPlan PAID_OFF->ACTIVE and restores outstanding_principal_cents
          to 8000000 while principal_cents never changes.
        test_recipe:
          setup:
            - "A FUNDED Deal on a floor-planned Unit; FloorPlan was ACTIVE outstanding 8000000, now PAID_OFF."
          setup_api_calls:
            - call: "POST /units"
              payload: { hin: "HINPRINCON01", make: "Grady-White", model: "306", model_year: 2024, unit_type: "BOAT", length_ft: 30, cost_cents: 8000000, list_price_cents: 9800000, acquisition_type: "FLOOR_PLAN" }
              as: Manager
              captures: { u_id: $.data.id, u_v: $.data.version }
            - call: "POST /floor-plans"
              payload: { unit_id: "${u_id}", lender_name: "Marine Credit", principal_cents: 8000000, apr_bps: 950, advanced_at: "2026-04-01T00:00:00Z", curtailment_pct_bps: 1000, expected_unit_version: "${u_v}" }
              as: Manager
              captures: { fp_id: $.data.id }
            - call: "POST /units/${u_id}/list"
              payload: {}
              as: Manager
            - call: "POST /deals"
              payload: { unit_id: "${u_id}", customer_name: "Tess", sale_price_cents: 9800000, financing_type: "CASH", tax_rate_bps: 700, doc_fee_cents: 39900, down_payment_cents: 4000000 }
              as: SalesRep
              captures: { d_id: $.data.id }
            - call: "POST /deals/${d_id}/sign"
              payload: {}
              as: SalesRep
            - call: "POST /deals/${d_id}/fund"
              payload: {}
              as: Manager
          trigger:
            - call: "POST /deals/${d_id}/cancel"
              payload: {}
              as: Manager
          assert:
            - "FloorPlan.${fp_id}.principal_cents == 8000000"
            - "FloorPlan.${fp_id}.status == ACTIVE"
            - "FloorPlan.${fp_id}.outstanding_principal_cents == 8000000"
            - "Unit.${u_id}.status == AVAILABLE"
