scaffold_difficulty_design:

  # =====================================================================
  # Rule 1 — dual_variant_calc (≥2 instances, different entity domains)
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: monthly_allotment_standard_vs_emergency_on_same_month
        grounds:
          - calculations.monthly_allotment
          - calculations.monthly_allotment.variants.STANDARD
          - calculations.monthly_allotment.variants.EMERGENCY
          - state_machines.MonthlyAllotment.ISSUED_to_ADJUSTED
          - state_machines.EmergencyAllotmentProclamation.DRAFT_to_ACTIVE
          - entities.MonthlyAllotment.fields.standard_allotment_cents
          - entities.MonthlyAllotment.fields.emergency_supplement_cents
          - entities.MonthlyAllotment.fields.issued_total_cents
        distinguishing_aspect: |
          STANDARD vs EMERGENCY variants of monthly_allotment operate on the
          MonthlyAllotment entity: STANDARD yields issued_total_cents=21040
          (standard=21040, emergency=0) for hh size=2 net_income=108200; after a
          state-CA proclamation activates and /adjust is called, EMERGENCY
          yields emergency=32460, issued_total=53500. Different entity domain
          from instance net_income_benefit_vs_limit_check_diverge_on_heap
          (Household).
        test_recipe:
          setup:
            - "Clock: 2026-07-01T00:00:00Z"
            - "Household HH ACTIVE, size=2, state_code=CA, heap_recipient=false"
            - "Member M1 earned=160000 disabled=true (bypass ABAWD)"
            - "Member M2 earned=0 disabled=true"
            - "Application APPROVED; EBTCard ACTIVE"
            - "MonthlyAllotment MA for HH 2026-07 created (standard=21040, emergency=0)"
            - "Proclamation P for state_code=CA benefit_month=2026-07 DRAFT then ACTIVE (min_supplement_cents=9500)"
          setup_api_calls:
            - call: "POST /snap/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PolicyAdmin
              as_user_id: "pa_001"
            - call: "POST /snap/households"
              payload: { case_number: "CA-100001", state_code: "CA", address_line: "1 Main St", heap_recipient: false }
              as: Caseworker
              as_user_id: "cw_001"
              captures: { hh_id: "$.data.id" }
            - call: "POST /snap/household-members"
              payload: { household_id: "${hh_id}", full_name: "M One", date_of_birth: "1980-01-01", relationship: "HEAD", monthly_earned_income_cents: 160000, disabled: true }
              as: Caseworker
              as_user_id: "cw_001"
              captures: { m1_id: "$.data.id" }
            - call: "POST /snap/household-members"
              payload: { household_id: "${hh_id}", full_name: "M Two", date_of_birth: "1982-01-01", relationship: "SPOUSE", monthly_earned_income_cents: 0, disabled: true }
              as: Caseworker
              as_user_id: "cw_001"
              captures: { m2_id: "$.data.id" }
            - call: "POST /snap/applications"
              payload: { household_id: "${hh_id}" }
              as: Caseworker
              as_user_id: "cw_001"
              captures: { app_id: "$.data.id" }
            - call: "POST /snap/applications/${app_id}/submit"
              payload: {}
              as: Caseworker
              as_user_id: "cw_001"
            - call: "POST /snap/applications/${app_id}/approve"
              payload: { decision_reason: "Eligible per net income" }
              as: Caseworker
              as_user_id: "cw_001"
            - call: "GET /snap/ebt-cards"
              payload: {}
              as: Caseworker
              as_user_id: "cw_001"
              captures: { card_id: "$.data[0].id" }
            - call: "POST /snap/ebt-cards/${card_id}/activate"
              payload: {}
              as: Caseworker
              as_user_id: "cw_001"
            - call: "POST /snap/monthly-allotments"
              payload: { household_id: "${hh_id}", benefit_month: "2026-07" }
              as: BenefitIssuer
              as_user_id: "bi_001"
              captures: { ma_id: "$.data.id", ma_std_pre: "$.data.standard_allotment_cents", ma_emerg_pre: "$.data.emergency_supplement_cents", ma_total_pre: "$.data.issued_total_cents" }
            - call: "GET /snap/households/${hh_id}"
              payload: {}
              as: BenefitIssuer
              as_user_id: "bi_001"
              captures: { hh_v: "$.data.version" }
            - call: "POST /snap/monthly-allotments/${ma_id}/issue"
              payload: { expected_household_version: "${hh_v}" }
              as: BenefitIssuer
              as_user_id: "bi_001"
            - call: "POST /snap/emergency-allotments"
              payload: { state_code: "CA", benefit_month: "2026-07", min_supplement_cents: 9500 }
              as: PolicyAdmin
              as_user_id: "pa_001"
              captures: { proc_id: "$.data.id" }
            - call: "POST /snap/emergency-allotments/${proc_id}/activate"
              payload: {}
              as: PolicyAdmin
              as_user_id: "pa_001"
          trigger:
            - call: "POST /snap/monthly-allotments/${ma_id}/adjust"
              payload: {}
              as: BenefitIssuer
              as_user_id: "bi_001"
              captures: { ma_std_post: "$.data.standard_allotment_cents", ma_emerg_post: "$.data.emergency_supplement_cents", ma_total_post: "$.data.issued_total_cents" }
          assert:
            - "MonthlyAllotment.${ma_id}.standard_allotment_cents pre-adjust == 21040 (STANDARD variant only)"
            - "MonthlyAllotment.${ma_id}.emergency_supplement_cents pre-adjust == 0"
            - "MonthlyAllotment.${ma_id}.issued_total_cents pre-adjust == 21040"
            - "MonthlyAllotment.${ma_id}.standard_allotment_cents post-adjust == 21040 (unchanged)"
            - "MonthlyAllotment.${ma_id}.emergency_supplement_cents post-adjust == 32460 (EMERGENCY variant top-up)"
            - "MonthlyAllotment.${ma_id}.issued_total_cents post-adjust == 53500"

      - name: net_income_benefit_vs_limit_check_diverge_on_heap
        grounds:
          - calculations.net_monthly_income
          - calculations.net_monthly_income.variants.BENEFIT_CALC
          - calculations.net_monthly_income.variants.LIMIT_CHECK
          - validations[priority=17]
          - state_machines.Application.SUBMITTED_to_APPROVED
          - entities.Household.fields.net_income_cents
          - errors[ERR_INCOME_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          BENEFIT_CALC variant subtracts SUA when heap_recipient=true so
          Household.net_income_cents == 111100 for size=1 gross=172000 heap=true;
          LIMIT_CHECK variant omits SUA and yields 117800 which exceeds
          NET_INCOME_LIMIT_BY_SIZE[1]=117500. /approve is rejected with
          ERR_INCOME_LIMIT_EXCEEDED while Household.net_income_cents reads
          111100 — both variants on the Household entity, different domain
          from monthly_allotment_standard_vs_emergency_on_same_month
          (MonthlyAllotment).
        test_recipe:
          setup:
            - "Clock: 2026-06-15T00:00:00Z"
            - "Household HH PENDING, size=1, state_code=TX, heap_recipient=true"
            - "Member M earned=172000 disabled=true (bypass ABAWD)"
            - "Application APP SUBMITTED for HH"
          setup_api_calls:
            - call: "POST /snap/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PolicyAdmin
              as_user_id: "pa_001"
            - call: "POST /snap/households"
              payload: { case_number: "TX-200001", state_code: "TX", address_line: "2 Oak Ave", heap_recipient: true }
              as: Caseworker
              as_user_id: "cw_001"
              captures: { hh_id: "$.data.id" }
            - call: "POST /snap/household-members"
              payload: { household_id: "${hh_id}", full_name: "Solo M", date_of_birth: "1975-05-05", relationship: "HEAD", monthly_earned_income_cents: 172000, disabled: true }
              as: Caseworker
              as_user_id: "cw_001"
            - call: "POST /snap/applications"
              payload: { household_id: "${hh_id}" }
              as: Caseworker
              as_user_id: "cw_001"
              captures: { app_id: "$.data.id" }
            - call: "POST /snap/applications/${app_id}/submit"
              payload: {}
              as: Caseworker
              as_user_id: "cw_001"
          trigger:
            - call: "POST /snap/applications/${app_id}/approve"
              payload: { decision_reason: "review" }
              as: Caseworker
              as_user_id: "cw_001"
              captures: { err: "$.data.error_id" }
            - call: "GET /snap/households/${hh_id}"
              payload: {}
              as: Caseworker
              as_user_id: "cw_001"
              captures: { hh_net: "$.data.net_income_cents", hh_status: "$.data.status" }
          assert:
            - "approve response error_id == 'ERR_INCOME_LIMIT_EXCEEDED' (HTTP 409)"
            - "Household.${hh_id}.net_income_cents == 111100 (BENEFIT_CALC includes SUA)"
            - "Household.${hh_id}.status == 'PENDING' (not advanced)"

  # =====================================================================
  # Rule 2 — combinatorial_formula (≥2 instances, different modes)
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: monthly_allotment_round_then_subtract_pinned
        grounds:
          - calculations.monthly_allotment
          - calculations.monthly_allotment.formula
          - calculations.monthly_allotment.precision
          - entities.MonthlyAllotment.fields.standard_allotment_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. For size=3
          net_income_cents=140201, floor(140201*0.30)=42060 then 76600-42060
          yields standard=34540; the alternative subtract-then-floor would
          give 76600-42060.3=34539.7→34539. The scaffold pins round-then-
          subtract, so the observed value is 34540 (not 34539).
        test_recipe:
          setup:
            - "Clock: 2026-07-01T00:00:00Z"
            - "Household HH ACTIVE size=3, state_code=NY, heap_recipient=false"
            - "Member M1 earned=200001 disabled=true; M2 earned=0 disabled=true; M3 earned=0 disabled=true"
            - "Household.gross_income_cents = 200001; Household.net_income_cents = 140201"
            - "EBTCard ACTIVE for HH"
          setup_api_calls:
            - call: "POST /snap/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PolicyAdmin
              as_user_id: "pa_001"
            - call: "POST /snap/households"
              payload: { case_number: "NY-300001", state_code: "NY", address_line: "3 Pine Rd", heap_recipient: false }
              as: Caseworker
              as_user_id: "cw_001"
              captures: { hh_id: "$.data.id" }
            - call: "POST /snap/household-members"
              payload: { household_id: "${hh_id}", full_name: "Earner", date_of_birth: "1970-01-01", relationship: "HEAD", monthly_earned_income_cents: 200001, disabled: true }
              as: Caseworker
              as_user_id: "cw_001"
            - call: "POST /snap/household-members"
              payload: { household_id: "${hh_id}", full_name: "Spouse", date_of_birth: "1972-01-01", relationship: "SPOUSE", monthly_earned_income_cents: 0, disabled: true }
              as: Caseworker
              as_user_id: "cw_001"
            - call: "POST /snap/household-members"
              payload: { household_id: "${hh_id}", full_name: "Child A", date_of_birth: "2015-01-01", relationship: "CHILD" }
              as: Caseworker
              as_user_id: "cw_001"
            - call: "POST /snap/applications"
              payload: { household_id: "${hh_id}" }
              as: Caseworker
              as_user_id: "cw_001"
              captures: { app_id: "$.data.id" }
            - call: "POST /snap/applications/${app_id}/submit"
              payload: {}
              as: Caseworker
              as_user_id: "cw_001"
            - call: "POST /snap/applications/${app_id}/approve"
              payload: { decision_reason: "Income within limits" }
              as: Caseworker
              as_user_id: "cw_001"
            - call: "GET /snap/ebt-cards"
              payload: {}
              as: Caseworker
              as_user_id: "cw_001"
              captures: { card_id: "$.data[0].id" }
            - call: "POST /snap/ebt-cards/${card_id}/activate"
              payload: {}
              as: Caseworker
              as_user_id: "cw_001"
          trigger:
            - call: "POST /snap/monthly-allotments"
              payload: { household_id: "${hh_id}", benefit_month: "2026-07" }
              as: BenefitIssuer
              as_user_id: "bi_001"
              captures: { ma_id: "$.data.id", ma_std: "$.data.standard_allotment_cents" }
          assert:
            - "MonthlyAllotment.${ma_id}.standard_allotment_cents == 34540 (round-then-subtract; subtract-then-round would give 34539)"
            - "Household.${hh_id}.net_income_cents == 140201"

      - name: fraud_velocity_trigger_row_inclusion_order_pinned
        grounds:
          - calculations.fraud_velocity_score
          - calculations.fraud_velocity_score.evaluation_order
          - state_machines.PurchaseTransaction.AUTHORIZED_to_SETTLED
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Mode (c): circular-looking dependency. The fraud_velocity_score is
          triggered by /settle but the formula's window query INCLUDES the
          just-settled row. The scaffold's evaluation_order pins
          (1) write SETTLED → (2) include in window → (3) evaluate aggregate.
          Without this pinning the 4th /settle would NOT raise the flag (count
          would be observed as 3). Test demonstrates: after exactly 4 settles
          of 15000 cents each within 24h, a FraudFlag(VELOCITY_SPIKE) exists
          (count=1), proving the 4th row was included.
        test_recipe:
          setup:
            - "Clock: 2026-07-15T12:00:00Z"
            - "Household HH ACTIVE size=1 state_code=TX"
            - "Member disabled=true"
            - "EBTCard ACTIVE for HH"
            - "EligibleItemCategory FRESH_PRODUCE (eligible=true)"
            - "4 PurchaseTransactions AUTHORIZED on HH's card, each total_cents=15000"
          setup_api_calls:
            - call: "POST /snap/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T12:00:00Z" }
              as: PolicyAdmin
              as_user_id: "pa_001"
            - call: "POST /snap/eligible-item-categories"
              payload: { code: "FRESH_PRODUCE", name: "Fresh Produce", eligible: true }
              as: PolicyAdmin
              as_user_id: "pa_001"
            - call: "POST /snap/households"
              payload: { case_number: "TX-400001", state_code: "TX", address_line: "4 Elm St", heap_recipient: false }
              as: Caseworker
              as_user_id: "cw_001"
              captures: { hh_id: "$.data.id" }
            - call: "POST /snap/household-members"
              payload: { household_id: "${hh_id}", full_name: "Solo", date_of_birth: "1970-01-01", relationship: "HEAD", disabled: true }
              as: Caseworker
              as_user_id: "cw_001"
            - call: "POST /snap/applications"
              payload: { household_id: "${hh_id}" }
              as: Caseworker
              as_user_id: "cw_001"
              captures: { app_id: "$.data.id" }
            - call: "POST /snap/applications/${app_id}/submit"
              payload: {}
              as: Caseworker
              as_user_id: "cw_001"
            - call: "POST /snap/applications/${app_id}/approve"
              payload: { decision_reason: "ok" }
              as: Caseworker
              as_user_id: "cw_001"
            - call: "GET /snap/ebt-cards"
              payload: {}
              as: Caseworker
              as_user_id: "cw_001"
              captures: { card_id: "$.data[0].id" }
            - call: "POST /snap/ebt-cards/${card_id}/activate"
              payload: {}
              as: Caseworker
              as_user_id: "cw_001"
            - call: "POST /snap/purchase-transactions"
              payload: { ebt_card_id: "${card_id}", merchant_id: "M001", line_items: [{category_code: "FRESH_PRODUCE", amount_cents: 15000, quantity: 1}] }
              as: Merchant
              as_user_id: "mer_001"
              captures: { tx1_id: "$.data.id" }
            - call: "POST /snap/purchase-transactions/${tx1_id}/settle"
              payload: {}
              as: Merchant
              as_user_id: "mer_001"
            - call: "POST /snap/purchase-transactions"
              payload: { ebt_card_id: "${card_id}", merchant_id: "M001", line_items: [{category_code: "FRESH_PRODUCE", amount_cents: 15000, quantity: 1}] }
              as: Merchant
              as_user_id: "mer_001"
              captures: { tx2_id: "$.data.id" }
            - call: "POST /snap/purchase-transactions/${tx2_id}/settle"
              payload: {}
              as: Merchant
              as_user_id: "mer_001"
            - call: "POST /snap/purchase-transactions"
              payload: { ebt_card_id: "${card_id}", merchant_id: "M001", line_items: [{category_code: "FRESH_PRODUCE", amount_cents: 15000, quantity: 1}] }
              as: Merchant
              as_user_id: "mer_001"
              captures: { tx3_id: "$.data.id" }
            - call: "POST /snap/purchase-transactions/${tx3_id}/settle"
              payload: {}
              as: Merchant
              as_user_id: "mer_001"
            - call: "POST /snap/purchase-transactions"
              payload: { ebt_card_id: "${card_id}", merchant_id: "M001", line_items: [{category_code: "FRESH_PRODUCE", amount_cents: 15000, quantity: 1}] }
              as: Merchant
              as_user_id: "mer_001"
              captures: { tx4_id: "$.data.id" }
            - call: "GET /snap/fraud-flags"
              payload: {}
              as: FraudInvestigator
              as_user_id: "inv_001"
              
          trigger:
            - call: "POST /snap/purchase-transactions/${tx4_id}/settle"
              payload: {}
              as: Merchant
              as_user_id: "mer_001"
            - call: "GET /snap/fraud-flags"
              payload: {}
              as: FraudInvestigator
              as_user_id: "inv_001"
              
          assert:
            - "After 3 settles, FraudFlag(VELOCITY_SPIKE) count for HH == 0 (count<4 threshold)"
            - "After the 4th settle, FraudFlag(VELOCITY_SPIKE) count for HH == 1 (trigger row was included in window per evaluation_order)"

  # =====================================================================
  # Rule 3 — non_linear_state_machine (≥2 instances, different entities)
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: household_suspend_reinstate_cycle
        grounds:
          - state_machines.Household
          - state_machines.Household.ACTIVE_to_SUSPENDED
          - state_machines.Household.SUSPENDED_to_ACTIVE
          - state_machines.EBTCard.ACTIVE_to_SUSPENDED
          - state_machines.EBTCard.SUSPENDED_to_ACTIVE
          - entities.Household.fields.status
        distinguishing_aspect: |
          Household has a cycle ACTIVE→SUSPENDED→ACTIVE on the Household
          entity — a non-linear shape distinct from a forward pipeline. The
          test drives suspend then reinstate and asserts the EBTCard cascades
          mirror the cycle. Different entity from
          fraud_flag_under_review_branching (FraudFlag).
        test_recipe:
          setup:
            - "Clock: 2026-08-01T00:00:00Z"
            - "Household HH ACTIVE size=1 state_code=GA"
            - "Member disabled=true"
            - "EBTCard CARD ACTIVE for HH"
            - "FraudFlag FF for HH SUBSTANTIATED (precondition for /suspend)"
          setup_api_calls:
            - call: "POST /snap/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PolicyAdmin
              as_user_id: "pa_001"
            - call: "POST /snap/households"
              payload: { case_number: "GA-500001", state_code: "GA", address_line: "5 Peach Rd", heap_recipient: false }
              as: Caseworker
              as_user_id: "cw_001"
              captures: { hh_id: "$.data.id" }
            - call: "POST /snap/household-members"
              payload: { household_id: "${hh_id}", full_name: "Solo", date_of_birth: "1970-01-01", relationship: "HEAD", disabled: true }
              as: Caseworker
              as_user_id: "cw_001"
            - call: "POST /snap/applications"
              payload: { household_id: "${hh_id}" }
              as: Caseworker
              as_user_id: "cw_001"
              captures: { app_id: "$.data.id" }
            - call: "POST /snap/applications/${app_id}/submit"
              payload: {}
              as: Caseworker
              as_user_id: "cw_001"
            - call: "POST /snap/applications/${app_id}/approve"
              payload: { decision_reason: "ok" }
              as: Caseworker
              as_user_id: "cw_001"
            - call: "GET /snap/ebt-cards"
              payload: {}
              as: Caseworker
              as_user_id: "cw_001"
              captures: { card_id: "$.data[0].id" }
            - call: "POST /snap/ebt-cards/${card_id}/activate"
              payload: {}
              as: Caseworker
              as_user_id: "cw_001"
            - call: "POST /snap/fraud-flags"
              payload: { household_id: "${hh_id}", trigger_rule: "VELOCITY_SPIKE" }
              as: FraudInvestigator
              as_user_id: "inv_001"
              captures: { ff_id: "$.data.id" }
            - call: "POST /snap/fraud-flags/${ff_id}/claim"
              payload: {}
              as: FraudInvestigator
              as_user_id: "inv_001"
              captures: { ff_v: "$.data.version" }
            - call: "POST /snap/fraud-flags/${ff_id}/substantiate"
              payload: { resolution_note: "Confirmed", expected_fraudflag_version: "${ff_v}" }
              as: FraudInvestigator
              as_user_id: "inv_001"
          trigger:
            - call: "POST /snap/households/${hh_id}/suspend"
              payload: {}
              as: Caseworker
              as_user_id: "cw_001"
              captures: { hh_status_after_suspend: "$.data.status" }
            - call: "GET /snap/ebt-cards/${card_id}"
              payload: {}
              as: Caseworker
              as_user_id: "cw_001"
              captures: { card_status_after_suspend: "$.data.status" }
            - call: "POST /snap/households/${hh_id}/reinstate"
              payload: {}
              as: Caseworker
              as_user_id: "cw_001"
              captures: { hh_status_after_reinstate: "$.data.status" }
            - call: "GET /snap/ebt-cards/${card_id}"
              payload: {}
              as: Caseworker
              as_user_id: "cw_001"
              captures: { card_status_after_reinstate: "$.data.status" }
          assert:
            - "Household.${hh_id}.status post-suspend == 'SUSPENDED'"
            - "EBTCard.${card_id}.status post-suspend == 'SUSPENDED' (cascade)"
            - "Household.${hh_id}.status post-reinstate == 'ACTIVE' (cycle return)"
            - "EBTCard.${card_id}.status post-reinstate == 'ACTIVE' (cascade)"

      - name: fraud_flag_under_review_branching
        grounds:
          - state_machines.FraudFlag
          - state_machines.FraudFlag.UNDER_REVIEW_to_SUBSTANTIATED
          - state_machines.FraudFlag.UNDER_REVIEW_to_DISMISSED
          - state_machines.FraudFlag.OPEN_to_DISMISSED
          - entities.FraudFlag.fields.status
        distinguishing_aspect: |
          FraudFlag from UNDER_REVIEW forks into two terminal branches
          {SUBSTANTIATED, DISMISSED}, AND OPEN forks directly into DISMISSED
          bypassing UNDER_REVIEW. This branching is on the FraudFlag entity —
          different entity from household_suspend_reinstate_cycle (Household).
          The test drives one flag down each branch in sequence.
        test_recipe:
          setup:
            - "Clock: 2026-08-01T00:00:00Z"
            - "Household HH ACTIVE size=1 state_code=FL"
            - "Two FraudFlags FF_A and FF_B for HH, both in status OPEN"
          setup_api_calls:
            - call: "POST /snap/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PolicyAdmin
              as_user_id: "pa_001"
