            - "HOP 3: Participant.${p1_id}.coverage_through_month == '2026-08'"
            - "HOP 4: Participant.${p1_id}.eligibility_status == ELIGIBLE"
            - "GET /coverage-months?participant_id=${p1_id}&status=REVOKED returns exactly 1 row"
            - "PensionAccrual(participant=${p1_id}, plan_year=2026).hours_credited == 251.30 and pension_credit == 0.25"
            - "Employer.${emp_id}.cumulative_delinquent_cents == 207448"

