          - entities.Community.fields.capture_rate_bps
          - entities.ForwardCommitment.fields.units_available
        distinguishing_aspect: |
          Four causal hops from a single close: the contract close mutates the home site,
          that mutation is what drives the rate lock to CONSUMED, that mutation is what
          increments the commitment's drawn units, and that mutation is what flips the
          commitment to EXHAUSTED and reconciles the community's capture rate.
