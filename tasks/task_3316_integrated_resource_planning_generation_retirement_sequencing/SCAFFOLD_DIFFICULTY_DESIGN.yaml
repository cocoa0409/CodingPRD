          gate value): testimony may only be FILED while the plan is UNDER_REVIEW;
          against an OPEN_FOR_COMMENT plan (a different non-terminal state than the
          first instance's) the filing fails with ERR_PLAN_NOT_UNDER_REVIEW.
        test_recipe:
          setup:
