            - { call: "GET /farm/racks/${rk_1}/towers", as: FarmManager, captures: { t1: "$.data[0].id", t2: "$.data[1].id", t3: "$.data[2].id", t4: "$.data[3].id" } }
            - { call: "POST /farm/sanitation-cycles", payload: { water_loop_id: "${wl_a}", scheduled_start_at: "2026-08-22T01:00:00Z", scheduled_end_at: "2026-08-22T03:00:00Z" }, as: SanitationLead, captures: { cy1: "$.data.id" } }
