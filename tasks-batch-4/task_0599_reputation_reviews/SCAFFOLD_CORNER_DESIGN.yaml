              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "GET /reputation/locations/${loc_id}"
              payload: {}
              as: PlatformAdmin
              captures: { loc_v: $.data.version }
            - call: "POST /reputation/locations/${loc_id}/campaigns"
              payload: { name: "Spring Asks", channel: "EMAIL", message_body: "Rate us", send_window_start: "09:00", send_window_end: "11:00", daily_send_cap: 5, credits_allocated: 5, expected_location_version: "${loc_v}" }
              as: PlatformAdmin
              captures: { camp: $.data.id }
            - call: "POST /reputation/campaigns/${camp}/schedule"
              payload: {}
              as: PlatformAdmin
            - call: "POST /reputation/campaigns/${camp}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /reputation/campaigns/${camp}/requests"
              payload: { contact_id: "${c1}" }
              as: PlatformAdmin
              captures: { req1: $.data.id }
            - call: "POST /reputation/campaigns/${camp}/send-batch"
              payload: { batch_size: 1 }
              as: PlatformAdmin
          trigger:
            - call: "POST /reputation/review-requests/${req1}/events"
              payload: { event_type: "DELIVERED" }
