# =============================================================================
# §1.8 Scaffold Difficulty Design — Patient Experience Survey Program (HCAHPS)
# 9 Difficulty Rules x 2 instances each = 18 instances.
# Fixture conventions (all literals pre-computed by hand against §1.3):
#   - Eligible discharge template: HOME / MEDICAL / MEDICARE / age 65 / US /
#     no_publicity false / custody NONE / admit 2026-06-01, discharge 2026-06-03.
#   - Cycle fielding windows never overlap within a program.
#   - 25-case publishable cycle: 25 ELIGIBLE discharges -> 25 cases (MAIL,
#     100c each) -> start-fielding -> 25 responses.
#   - Composite percentage with n=25 MAIL responses: each score-4 response
#     contributes 4.00 points of top-box pct (k*4.00 for k responses at 4).
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: topbox_raw_vs_mode_adjusted_on_cycle
        grounds:
          - calculations.top_box_composite_scores
          - entities.SurveyCycle.fields.scored_raw_composite_pcts
          - entities.SurveyCycle.fields.scored_adjusted_composite_pcts
        distinguishing_aspect: |
          Entity domain SurveyCycle scoring: identical response data yields
          scored_raw_composite_pcts.overall_rating == 100.0 while
          scored_adjusted_composite_pcts.overall_rating == 40.0, because the
          MODE_ADJUSTED variant strips every PHONE raw-4 (4 - 0.5 = 3.5 < 3.75)
          while the RAW variant counts them.
        test_recipe:
          setup:
            - "Program MIXED_MODE; vendor budget 100000; cycle C fielding 2026-08-03..2026-08-31 in FIELDING with 25 IN_FIELD cases"
            - "25 responses recorded: 10 with mode_used MAIL and 15 with mode_used PHONE; every composite score = 4"
            - "Cycle moved to SCORING via close-fielding (clock 2026-08-31) + begin-scoring"
          setup_api_calls:
            - { call: "POST /api/survey-programs", payload: { name: "P-DV1", sampling_protocol: "CENSUS", admin_mode: "MIXED_MODE" }, as: ProgramAdmin, captures: { pg: "$.data.id", pg_v: "$.data.version" } }
            - { call: "POST /api/vendors", payload: { program_id: "${pg}", name: "V1", cycle_budget_cents: 100000, expected_program_version: "${pg_v}" }, as: ProgramAdmin, captures: { vn: "$.data.id" } }
            - { call: "POST /api/units", payload: { program_id: "${pg}", name: "Unit 1", unit_code: "U1" }, as: ProgramAdmin, captures: { un: "$.data.id" } }
            - { call: "POST /api/providers", payload: { program_id: "${pg}", full_name: "Dr A", npi: "NPI1", specialty: "IM" }, as: ProgramAdmin, captures: { pr: "$.data.id" } }
            - { call: "POST /api/cycles", payload: { program_id: "${pg}", label: "Q1", cycle_index: 1, discharge_window_start: "2026-06-01", discharge_window_end: "2026-06-30", fielding_start_date: "2026-08-03", fielding_end_date: "2026-08-31", target_sample_size: 300 }, as: ProgramAdmin, captures: { cy: "$.data.id" } }
            - { call: "POST /api/cycles/${cy}/open-sampling", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/discharges/import", payload: { program_id: "${pg}", count: 25, template: { mrn_prefix: "M", unit_id: "${un}", provider_id: "${pr}", admit_date: "2026-06-01", discharge_date: "2026-06-03", discharge_disposition: "HOME", primary_dx_group: "MEDICAL", payer: "MEDICARE", age_years: 65, address_country: "US", no_publicity_flag: false, custody_status: "NONE" } }, as: DataSteward, captures: { d_ids: "$.data.discharge_ids" } }
            - { call: "POST /api/sample-cases/import", payload: { cycle_id: "${cy}", discharge_ids: "${d_ids}", mode_assigned: "MAIL", postage_cost_cents: 100 }, as: DataSteward, captures: { c_ids: "$.data.sample_case_ids" } }
            - { call: "POST /api/cycles/${cy}/start-fielding", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/responses/import", payload: { case_ids: "${c_ids[0:10]}", mode_used: "MAIL", nurse_comm_score: 4, doctor_comm_score: 4, cleanliness_score: 4, overall_rating_score: 4 }, as: VendorOperator, as_user_id: "${vn}" }
            - { call: "POST /api/responses/import", payload: { case_ids: "${c_ids[10:25]}", mode_used: "PHONE", nurse_comm_score: 4, doctor_comm_score: 4, cleanliness_score: 4, overall_rating_score: 4 }, as: VendorOperator, as_user_id: "${vn}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /api/cycles/${cy}/close-fielding", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/cycles/${cy}/begin-scoring", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "GET /api/cycles/${cy}", payload: {}, as: Any, captures: { raw_ov: "$.data.scored_raw_composite_pcts", adj_ov: "$.data.scored_adjusted_composite_pcts" } }
          assert:
            - "SurveyCycle.${cy}.scored_raw_composite_pcts.overall_rating == 100.0"
            - "SurveyCycle.${cy}.scored_adjusted_composite_pcts.overall_rating == 40.0"
            - "scored_raw != scored_adjusted for identical response data (10 MAIL top-box / 25 total = 40.00 after PHONE adjustment)"

      - name: initiative_progress_pinned_vs_rolling
        grounds:
          - calculations.initiative_progress
          - entities.ImprovementInitiative.fields.progress_pinned
          - entities.ImprovementInitiative.fields.progress_rolling
        distinguishing_aspect: |
          Entity domain ImprovementInitiative (different from SurveyCycle in the
          sibling instance): the SAME evaluation result (88.00) reports
          progress_pinned == 8.0 against the pinned baseline 80.00 but
          progress_rolling == 6.0 against the trailing-2-cycle average 82.00.
        test_recipe:
          setup:
            - "Three PUBLISHED cycles of one program, all unit U1 CLEANLINESS adjusted: idx1 = 80.00, idx2 = 84.00, idx3 = 88.00"
            - "Initiative on (U1, CLEANLINESS): baseline idx1, evaluation idx3, target 85.00, ACTIVE"
          setup_api_calls:
            - { call: "POST /api/survey-programs", payload: { name: "P-DV2", sampling_protocol: "CENSUS", admin_mode: "MAIL_ONLY" }, as: ProgramAdmin, captures: { pg: "$.data.id", pg_v: "$.data.version" } }
            - { call: "POST /api/vendors", payload: { program_id: "${pg}", name: "V1", cycle_budget_cents: 100000, expected_program_version: "${pg_v}" }, as: ProgramAdmin, captures: { vn: "$.data.id" } }
            - { call: "POST /api/units", payload: { program_id: "${pg}", name: "Unit 1", unit_code: "U1" }, as: ProgramAdmin, captures: { un: "$.data.id" } }
            - { call: "POST /api/providers", payload: { program_id: "${pg}", full_name: "Dr A", npi: "NPI1", specialty: "IM" }, as: ProgramAdmin, captures: { pr: "$.data.id" } }
            # --- cycle idx1: unit cleanliness adjusted 80.00 (20x4 + 5x3, MAIL) ---
            - { call: "POST /api/cycles", payload: { program_id: "${pg}", label: "Q1", cycle_index: 1, discharge_window_start: "2026-06-01", discharge_window_end: "2026-06-30", fielding_start_date: "2026-08-03", fielding_end_date: "2026-08-31", target_sample_size: 100 }, as: ProgramAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /api/cycles/${c1}/open-sampling", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/discharges/import", payload: { program_id: "${pg}", count: 20, template: { mrn_prefix: "A", unit_id: "${un}", provider_id: "${pr}", admit_date: "2026-06-01", discharge_date: "2026-06-03", discharge_disposition: "HOME", primary_dx_group: "MEDICAL", payer: "MEDICARE", age_years: 65, address_country: "US", no_publicity_flag: false, custody_status: "NONE" } }, as: DataSteward, captures: { d1a: "$.data.discharge_ids" } }
            - { call: "POST /api/discharges/import", payload: { program_id: "${pg}", count: 5, template: { mrn_prefix: "B", unit_id: "${un}", provider_id: "${pr}", admit_date: "2026-06-01", discharge_date: "2026-06-03", discharge_disposition: "HOME", primary_dx_group: "MEDICAL", payer: "MEDICARE", age_years: 65, address_country: "US", no_publicity_flag: false, custody_status: "NONE" } }, as: DataSteward, captures: { d1b: "$.data.discharge_ids" } }
            - { call: "POST /api/sample-cases/import", payload: { cycle_id: "${c1}", discharge_ids: "${d1a}", mode_assigned: "MAIL", postage_cost_cents: 100 }, as: DataSteward, captures: { k1a: "$.data.sample_case_ids" } }
            - { call: "POST /api/sample-cases/import", payload: { cycle_id: "${c1}", discharge_ids: "${d1b}", mode_assigned: "MAIL", postage_cost_cents: 100 }, as: DataSteward, captures: { k1b: "$.data.sample_case_ids" } }
            - { call: "POST /api/cycles/${c1}/start-fielding", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/responses/import", payload: { case_ids: "${k1a}", mode_used: "MAIL", nurse_comm_score: 4, doctor_comm_score: 4, cleanliness_score: 4, overall_rating_score: 4 }, as: VendorOperator, as_user_id: "${vn}" }
            - { call: "POST /api/responses/import", payload: { case_ids: "${k1b}", mode_used: "MAIL", nurse_comm_score: 3, doctor_comm_score: 3, cleanliness_score: 3, overall_rating_score: 3 }, as: VendorOperator, as_user_id: "${vn}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /api/cycles/${c1}/close-fielding", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/cycles/${c1}/begin-scoring", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/cycles/${c1}/publish", payload: {}, as: ProgramAdmin }
            # --- cycle idx2: unit cleanliness adjusted 84.00 (21x4 + 4x3) ---
            - { call: "POST /api/cycles", payload: { program_id: "${pg}", label: "Q2", cycle_index: 2, discharge_window_start: "2026-07-01", discharge_window_end: "2026-07-31", fielding_start_date: "2026-09-01", fielding_end_date: "2026-09-30", target_sample_size: 100 }, as: ProgramAdmin, captures: { c2: "$.data.id" } }
            - { call: "POST /api/cycles/${c2}/open-sampling", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/discharges/import", payload: { program_id: "${pg}", count: 21, template: { mrn_prefix: "C", unit_id: "${un}", provider_id: "${pr}", admit_date: "2026-07-01", discharge_date: "2026-07-03", discharge_disposition: "HOME", primary_dx_group: "MEDICAL", payer: "MEDICARE", age_years: 65, address_country: "US", no_publicity_flag: false, custody_status: "NONE" } }, as: DataSteward, captures: { d2a: "$.data.discharge_ids" } }
            - { call: "POST /api/discharges/import", payload: { program_id: "${pg}", count: 4, template: { mrn_prefix: "D", unit_id: "${un}", provider_id: "${pr}", admit_date: "2026-07-01", discharge_date: "2026-07-03", discharge_disposition: "HOME", primary_dx_group: "MEDICAL", payer: "MEDICARE", age_years: 65, address_country: "US", no_publicity_flag: false, custody_status: "NONE" } }, as: DataSteward, captures: { d2b: "$.data.discharge_ids" } }
            - { call: "POST /api/sample-cases/import", payload: { cycle_id: "${c2}", discharge_ids: "${d2a}", mode_assigned: "MAIL", postage_cost_cents: 100 }, as: DataSteward, captures: { k2a: "$.data.sample_case_ids" } }
            - { call: "POST /api/sample-cases/import", payload: { cycle_id: "${c2}", discharge_ids: "${d2b}", mode_assigned: "MAIL", postage_cost_cents: 100 }, as: DataSteward, captures: { k2b: "$.data.sample_case_ids" } }
            - { call: "POST /api/cycles/${c2}/start-fielding", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/responses/import", payload: { case_ids: "${k2a}", mode_used: "MAIL", nurse_comm_score: 4, doctor_comm_score: 4, cleanliness_score: 4, overall_rating_score: 4 }, as: VendorOperator, as_user_id: "${vn}" }
            - { call: "POST /api/responses/import", payload: { case_ids: "${k2b}", mode_used: "MAIL", nurse_comm_score: 3, doctor_comm_score: 3, cleanliness_score: 3, overall_rating_score: 3 }, as: VendorOperator, as_user_id: "${vn}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-30T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /api/cycles/${c2}/close-fielding", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/cycles/${c2}/begin-scoring", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/cycles/${c2}/publish", payload: {}, as: ProgramAdmin }
            # --- cycle idx3: evaluation cycle, unit cleanliness adjusted 88.00 (22x4 + 3x3) ---
            - { call: "POST /api/cycles", payload: { program_id: "${pg}", label: "Q3", cycle_index: 3, discharge_window_start: "2026-08-01", discharge_window_end: "2026-08-31", fielding_start_date: "2026-10-01", fielding_end_date: "2026-10-31", target_sample_size: 100 }, as: ProgramAdmin, captures: { c3: "$.data.id" } }
            - { call: "POST /api/initiatives", payload: { unit_id: "${un}", domain: "CLEANLINESS", baseline_cycle_id: "${c1}", evaluation_cycle_id: "${c3}", target_score: 85.0 }, as: ProgramAdmin, captures: { ini: "$.data.id" } }
            - { call: "POST /api/initiatives/${ini}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/cycles/${c3}/open-sampling", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/discharges/import", payload: { program_id: "${pg}", count: 22, template: { mrn_prefix: "E", unit_id: "${un}", provider_id: "${pr}", admit_date: "2026-08-01", discharge_date: "2026-08-03", discharge_disposition: "HOME", primary_dx_group: "MEDICAL", payer: "MEDICARE", age_years: 65, address_country: "US", no_publicity_flag: false, custody_status: "NONE" } }, as: DataSteward, captures: { d3a: "$.data.discharge_ids" } }
            - { call: "POST /api/discharges/import", payload: { program_id: "${pg}", count: 3, template: { mrn_prefix: "F", unit_id: "${un}", provider_id: "${pr}", admit_date: "2026-08-01", discharge_date: "2026-08-03", discharge_disposition: "HOME", primary_dx_group: "MEDICAL", payer: "MEDICARE", age_years: 65, address_country: "US", no_publicity_flag: false, custody_status: "NONE" } }, as: DataSteward, captures: { d3b: "$.data.discharge_ids" } }
            - { call: "POST /api/sample-cases/import", payload: { cycle_id: "${c3}", discharge_ids: "${d3a}", mode_assigned: "MAIL", postage_cost_cents: 100 }, as: DataSteward, captures: { k3a: "$.data.sample_case_ids" } }
            - { call: "POST /api/sample-cases/import", payload: { cycle_id: "${c3}", discharge_ids: "${d3b}", mode_assigned: "MAIL", postage_cost_cents: 100 }, as: DataSteward, captures: { k3b: "$.data.sample_case_ids" } }
            - { call: "POST /api/cycles/${c3}/start-fielding", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/responses/import", payload: { case_ids: "${k3a}", mode_used: "MAIL", nurse_comm_score: 4, doctor_comm_score: 4, cleanliness_score: 4, overall_rating_score: 4 }, as: VendorOperator, as_user_id: "${vn}" }
            - { call: "POST /api/responses/import", payload: { case_ids: "${k3b}", mode_used: "MAIL", nurse_comm_score: 3, doctor_comm_score: 3, cleanliness_score: 3, overall_rating_score: 3 }, as: VendorOperator, as_user_id: "${vn}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-31T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /api/cycles/${c3}/close-fielding", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/cycles/${c3}/begin-scoring", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/cycles/${c3}/publish", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "GET /api/initiatives/${ini}", payload: {}, as: Any }
          assert:
            - "ImprovementInitiative.${ini}.baseline_score == 80.0 (pinned from cycle idx1)"
            - "ImprovementInitiative.${ini}.status == TARGET_MET (88.00 >= 85.00)"
            - "ImprovementInitiative.${ini}.progress_pinned == 8.0  (88.00 - 80.00)"
            - "ImprovementInitiative.${ini}.progress_rolling == 6.0  (88.00 - round_half_up((84.00 + 80.00)/2, 2) = 88.00 - 82.00)"
            - "progress_pinned != progress_rolling for identical evaluation data"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (different modes: (a) non-linear interaction
  # vs (b) pinned rounding order)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: star_rating_response_rate_cap_interaction
        grounds:
          - calculations.star_rating
          - endpoints[GET /api/cycles/{cycleId}/star-rating]
        distinguishing_aspect: |
          Mode (a) — three inputs (adjusted overall pct 88.00, completed 25,
          response_rate 8.33) interact non-linearly: the piecewise breakpoints
          alone would yield 4 stars, but the response-rate cap (8.33 < 10.0)
          clamps the result to 3 with capped == true.
        test_recipe:
          setup:
            - "Cycle in SCORING with 300 IN_FIELD/NONRESPONSE cases, 25 completed MAIL responses (22 all-4, 3 all-3)"
            - "scored: completed 25, denominator 300, response_rate 8.33, adjusted overall 88.00"
          setup_api_calls:
            - { call: "POST /api/survey-programs", payload: { name: "P-CF1", sampling_protocol: "SIMPLE_RANDOM", admin_mode: "MAIL_ONLY" }, as: ProgramAdmin, captures: { pg: "$.data.id", pg_v: "$.data.version" } }
            - { call: "POST /api/vendors", payload: { program_id: "${pg}", name: "V1", cycle_budget_cents: 100000, expected_program_version: "${pg_v}" }, as: ProgramAdmin, captures: { vn: "$.data.id" } }
            - { call: "POST /api/units", payload: { program_id: "${pg}", name: "Unit 1", unit_code: "U1" }, as: ProgramAdmin, captures: { un: "$.data.id" } }
            - { call: "POST /api/providers", payload: { program_id: "${pg}", full_name: "Dr A", npi: "NPI1", specialty: "IM" }, as: ProgramAdmin, captures: { pr: "$.data.id" } }
            - { call: "POST /api/cycles", payload: { program_id: "${pg}", label: "Q1", cycle_index: 1, discharge_window_start: "2026-06-01", discharge_window_end: "2026-06-30", fielding_start_date: "2026-08-03", fielding_end_date: "2026-08-31", target_sample_size: 300 }, as: ProgramAdmin, captures: { cy: "$.data.id" } }
            - { call: "POST /api/cycles/${cy}/open-sampling", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/discharges/import", payload: { program_id: "${pg}", count: 300, template: { mrn_prefix: "M", unit_id: "${un}", provider_id: "${pr}", admit_date: "2026-06-01", discharge_date: "2026-06-03", discharge_disposition: "HOME", primary_dx_group: "MEDICAL", payer: "MEDICARE", age_years: 65, address_country: "US", no_publicity_flag: false, custody_status: "NONE" } }, as: DataSteward, captures: { d_ids: "$.data.discharge_ids" } }
            - { call: "POST /api/sample-cases/import", payload: { cycle_id: "${cy}", discharge_ids: "${d_ids}", mode_assigned: "MAIL", postage_cost_cents: 100 }, as: DataSteward, captures: { c_ids: "$.data.sample_case_ids" } }
            - { call: "POST /api/cycles/${cy}/start-fielding", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/responses/import", payload: { case_ids: "${c_ids[0:22]}", mode_used: "MAIL", nurse_comm_score: 4, doctor_comm_score: 4, cleanliness_score: 4, overall_rating_score: 4 }, as: VendorOperator, as_user_id: "${vn}" }
            - { call: "POST /api/responses/import", payload: { case_ids: "${c_ids[22:25]}", mode_used: "MAIL", nurse_comm_score: 3, doctor_comm_score: 3, cleanliness_score: 3, overall_rating_score: 3 }, as: VendorOperator, as_user_id: "${vn}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /api/cycles/${cy}/close-fielding", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/cycles/${cy}/begin-scoring", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "GET /api/cycles/${cy}/star-rating", payload: {}, as: Any, captures: { stars: "$.data.stars" } }
          assert:
            - "GET star-rating: adjusted_overall_topbox_pct == 88.0 and response_rate == 8.33 and completed_responses == 25"
            - "stars == 3 (piecewise gives 4 at 88.00 >= 80.0, but response_rate 8.33 < 10.0 caps at 3)"
            - "capped == true and rating_status == RATED"

      - name: vbp_per_composite_rounding_order
        grounds:
          - calculations.vbp_payment_adjustment
          - endpoints[POST /api/cycles/{cycleId}/vbp-projection]
        distinguishing_aspect: |
          Mode (b) — rounding order is pinned per-line: each composite's points
          are rounded half_up to an integer BEFORE summing (74.75->6, 70.25->5,
          65.15->3, 80.00->7; total 21 -> 1.05). The forbidden sum-then-round
          order would produce total 20 -> 1.00 on identical inputs.
        test_recipe:
          setup:
            - "Cycle in SCORING (any scored snapshot; overrides replace composite inputs)"
          setup_api_calls:
            - { call: "POST /api/survey-programs", payload: { name: "P-CF2", sampling_protocol: "CENSUS", admin_mode: "MAIL_ONLY" }, as: ProgramAdmin, captures: { pg: "$.data.id", pg_v: "$.data.version" } }
            - { call: "POST /api/vendors", payload: { program_id: "${pg}", name: "V1", cycle_budget_cents: 100000, expected_program_version: "${pg_v}" }, as: ProgramAdmin, captures: { vn: "$.data.id" } }
            - { call: "POST /api/units", payload: { program_id: "${pg}", name: "Unit 1", unit_code: "U1" }, as: ProgramAdmin, captures: { un: "$.data.id" } }
            - { call: "POST /api/providers", payload: { program_id: "${pg}", full_name: "Dr A", npi: "NPI1", specialty: "IM" }, as: ProgramAdmin, captures: { pr: "$.data.id" } }
            - { call: "POST /api/cycles", payload: { program_id: "${pg}", label: "Q1", cycle_index: 1, discharge_window_start: "2026-06-01", discharge_window_end: "2026-06-30", fielding_start_date: "2026-08-03", fielding_end_date: "2026-08-31", target_sample_size: 100 }, as: ProgramAdmin, captures: { cy: "$.data.id" } }
            - { call: "POST /api/cycles/${cy}/open-sampling", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/discharges/import", payload: { program_id: "${pg}", count: 25, template: { mrn_prefix: "M", unit_id: "${un}", provider_id: "${pr}", admit_date: "2026-06-01", discharge_date: "2026-06-03", discharge_disposition: "HOME", primary_dx_group: "MEDICAL", payer: "MEDICARE", age_years: 65, address_country: "US", no_publicity_flag: false, custody_status: "NONE" } }, as: DataSteward, captures: { d_ids: "$.data.discharge_ids" } }
            - { call: "POST /api/sample-cases/import", payload: { cycle_id: "${cy}", discharge_ids: "${d_ids}", mode_assigned: "MAIL", postage_cost_cents: 100 }, as: DataSteward, captures: { c_ids: "$.data.sample_case_ids" } }
            - { call: "POST /api/cycles/${cy}/start-fielding", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/responses/import", payload: { case_ids: "${c_ids}", mode_used: "MAIL", nurse_comm_score: 4, doctor_comm_score: 4, cleanliness_score: 4, overall_rating_score: 4 }, as: VendorOperator, as_user_id: "${vn}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /api/cycles/${cy}/close-fielding", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/cycles/${cy}/begin-scoring", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "POST /api/cycles/${cy}/vbp-projection", payload: { nurse_comm_pct: 74.75, doctor_comm_pct: 70.25, cleanliness_pct: 65.15, overall_rating_pct: 80.0 }, as: ProgramAdmin }
          assert:
            - "response composite_points == { nurse_comm: 6, doctor_comm: 5, cleanliness: 3, overall_rating: 7 } (per-composite round_half_up to integer: 5.5->6, 4.5->5, 3.3667->3, 6.6667->7)"
            - "response total_points == 21"
            - "response vbp_adjustment_pct == 1.05 (round_half_up(21/40*2.0, 2)); sum-then-round would give 1.00"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: cycle_fielding_reconciliation_reopen_loop
        grounds:
          - state_machines.SurveyCycle.RECONCILIATION_to_FIELDING
          - state_machines.SampleCase.NONRESPONSE_to_IN_FIELD
        distinguishing_aspect: |
          SurveyCycle is cyclic: FIELDING -> RECONCILIATION -> FIELDING via
          reopen-fielding, and the case-level NONRESPONSE -> IN_FIELD revert
          rides the loop (a purely linear machine could not re-admit responses).
        test_recipe:
          setup:
            - "Cycle fielding 2026-08-03..2026-08-31; 1 case IN_FIELD, no response; clock set to 2026-08-31 (== fielding_end_date)"
          setup_api_calls:
            - { call: "POST /api/survey-programs", payload: { name: "P-NL1", sampling_protocol: "CENSUS", admin_mode: "MAIL_ONLY" }, as: ProgramAdmin, captures: { pg: "$.data.id", pg_v: "$.data.version" } }
            - { call: "POST /api/vendors", payload: { program_id: "${pg}", name: "V1", cycle_budget_cents: 100000, expected_program_version: "${pg_v}" }, as: ProgramAdmin, captures: { vn: "$.data.id" } }
            - { call: "POST /api/units", payload: { program_id: "${pg}", name: "Unit 1", unit_code: "U1" }, as: ProgramAdmin, captures: { un: "$.data.id" } }
            - { call: "POST /api/providers", payload: { program_id: "${pg}", full_name: "Dr A", npi: "NPI1", specialty: "IM" }, as: ProgramAdmin, captures: { pr: "$.data.id" } }
            - { call: "POST /api/cycles", payload: { program_id: "${pg}", label: "Q1", cycle_index: 1, discharge_window_start: "2026-06-01", discharge_window_end: "2026-06-30", fielding_start_date: "2026-08-03", fielding_end_date: "2026-08-31", target_sample_size: 100 }, as: ProgramAdmin, captures: { cy: "$.data.id" } }
            - { call: "POST /api/cycles/${cy}/open-sampling", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/discharges/import", payload: { program_id: "${pg}", count: 1, template: { mrn_prefix: "M", unit_id: "${un}", provider_id: "${pr}", admit_date: "2026-06-01", discharge_date: "2026-06-03", discharge_disposition: "HOME", primary_dx_group: "MEDICAL", payer: "MEDICARE", age_years: 65, address_country: "US", no_publicity_flag: false, custody_status: "NONE" } }, as: DataSteward, captures: { d_ids: "$.data.discharge_ids" } }
            - { call: "POST /api/sample-cases/import", payload: { cycle_id: "${cy}", discharge_ids: "${d_ids}", mode_assigned: "MAIL", postage_cost_cents: 100 }, as: DataSteward, captures: { c_ids: "$.data.sample_case_ids" } }
            - { call: "POST /api/cycles/${cy}/start-fielding", payload: {}, as: ProgramAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /api/cycles/${cy}/close-fielding", payload: {}, as: ProgramAdmin, captures: { cy_closed: "$.data.status" } }
          trigger:
            - { call: "POST /api/cycles/${cy}/reopen-fielding", payload: {}, as: ProgramAdmin }
            - { call: "GET /api/sample-cases/${c_ids[0]}", payload: {}, as: Any, captures: { case_st: "$.data.status" } }
            - { call: "POST /api/responses", payload: { case_id: "${c_ids[0]}", mode_used: "MAIL", nurse_comm_score: 4, doctor_comm_score: 4, cleanliness_score: 4, overall_rating_score: 4 }, as: VendorOperator, as_user_id: "${vn}", captures: { rsp_st: "$.data.status" } }
          assert:
            - "after close-fielding cycle status == RECONCILIATION and case status == NONRESPONSE"
            - "after reopen-fielding cycle status == FIELDING (cycle re-entered an earlier state)"
            - "SampleCase.${c_ids[0]}.status == IN_FIELD after reopen"
            - "subsequent intake succeeds: response status == ACCEPTED and case -> RESPONDED"

      - name: initiative_missed_branch_and_replan_loop
        grounds:
          - state_machines.ImprovementInitiative.UNDER_EVALUATION_to_TARGET_MISSED
          - state_machines.ImprovementInitiative.TARGET_MISSED_to_ACTIVE
        distinguishing_aspect: |
          ImprovementInitiative is branching + cyclic (different entity from
          SurveyCycle in the sibling instance): UNDER_EVALUATION forks to
          TARGET_MET / TARGET_MISSED with divergent side effects, and
          TARGET_MISSED loops back to ACTIVE via replan with a new target while
          the pinned baseline_score (80.00) is preserved.
        test_recipe:
          setup:
            - "Cycle idx1 PUBLISHED (unit U1 CLEANLINESS adjusted 80.00); cycle idx2 PUBLISHED with 84.00; initiative (U1, CLEANLINESS, baseline idx1, evaluation idx2, target 85.00) ACTIVE before idx2 publish"
            - "Cycle idx3 exists in DRAFT (replan target)"
          setup_api_calls:
            - { call: "POST /api/survey-programs", payload: { name: "P-NL2", sampling_protocol: "CENSUS", admin_mode: "MAIL_ONLY" }, as: ProgramAdmin, captures: { pg: "$.data.id", pg_v: "$.data.version" } }
            - { call: "POST /api/vendors", payload: { program_id: "${pg}", name: "V1", cycle_budget_cents: 100000, expected_program_version: "${pg_v}" }, as: ProgramAdmin, captures: { vn: "$.data.id" } }
            - { call: "POST /api/units", payload: { program_id: "${pg}", name: "Unit 1", unit_code: "U1" }, as: ProgramAdmin, captures: { un: "$.data.id" } }
            - { call: "POST /api/providers", payload: { program_id: "${pg}", full_name: "Dr A", npi: "NPI1", specialty: "IM" }, as: ProgramAdmin, captures: { pr: "$.data.id" } }
            # cycle idx1 published at 80.00 (20x4 + 5x3)
            - { call: "POST /api/cycles", payload: { program_id: "${pg}", label: "Q1", cycle_index: 1, discharge_window_start: "2026-06-01", discharge_window_end: "2026-06-30", fielding_start_date: "2026-08-03", fielding_end_date: "2026-08-31", target_sample_size: 100 }, as: ProgramAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /api/cycles/${c1}/open-sampling", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/discharges/import", payload: { program_id: "${pg}", count: 20, template: { mrn_prefix: "A", unit_id: "${un}", provider_id: "${pr}", admit_date: "2026-06-01", discharge_date: "2026-06-03", discharge_disposition: "HOME", primary_dx_group: "MEDICAL", payer: "MEDICARE", age_years: 65, address_country: "US", no_publicity_flag: false, custody_status: "NONE" } }, as: DataSteward, captures: { d1a: "$.data.discharge_ids" } }
            - { call: "POST /api/discharges/import", payload: { program_id: "${pg}", count: 5, template: { mrn_prefix: "B", unit_id: "${un}", provider_id: "${pr}", admit_date: "2026-06-01", discharge_date: "2026-06-03", discharge_disposition: "HOME", primary_dx_group: "MEDICAL", payer: "MEDICARE", age_years: 65, address_country: "US", no_publicity_flag: false, custody_status: "NONE" } }, as: DataSteward, captures: { d1b: "$.data.discharge_ids" } }
            - { call: "POST /api/sample-cases/import", payload: { cycle_id: "${c1}", discharge_ids: "${d1a}", mode_assigned: "MAIL", postage_cost_cents: 100 }, as: DataSteward, captures: { k1a: "$.data.sample_case_ids" } }
            - { call: "POST /api/sample-cases/import", payload: { cycle_id: "${c1}", discharge_ids: "${d1b}", mode_assigned: "MAIL", postage_cost_cents: 100 }, as: DataSteward, captures: { k1b: "$.data.sample_case_ids" } }
            - { call: "POST /api/cycles/${c1}/start-fielding", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/responses/import", payload: { case_ids: "${k1a}", mode_used: "MAIL", nurse_comm_score: 4, doctor_comm_score: 4, cleanliness_score: 4, overall_rating_score: 4 }, as: VendorOperator, as_user_id: "${vn}" }
            - { call: "POST /api/responses/import", payload: { case_ids: "${k1b}", mode_used: "MAIL", nurse_comm_score: 3, doctor_comm_score: 3, cleanliness_score: 3, overall_rating_score: 3 }, as: VendorOperator, as_user_id: "${vn}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /api/cycles/${c1}/close-fielding", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/cycles/${c1}/begin-scoring", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/cycles/${c1}/publish", payload: {}, as: ProgramAdmin }
            # cycle idx2 published at 84.00 (21x4 + 4x3) — initiative evaluated MISSED at its publish
            - { call: "POST /api/cycles", payload: { program_id: "${pg}", label: "Q2", cycle_index: 2, discharge_window_start: "2026-07-01", discharge_window_end: "2026-07-31", fielding_start_date: "2026-09-01", fielding_end_date: "2026-09-30", target_sample_size: 100 }, as: ProgramAdmin, captures: { c2: "$.data.id" } }
            - { call: "POST /api/initiatives", payload: { unit_id: "${un}", domain: "CLEANLINESS", baseline_cycle_id: "${c1}", evaluation_cycle_id: "${c2}", target_score: 85.0 }, as: ProgramAdmin, captures: { ini: "$.data.id" } }
            - { call: "POST /api/initiatives/${ini}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/cycles/${c2}/open-sampling", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/discharges/import", payload: { program_id: "${pg}", count: 21, template: { mrn_prefix: "C", unit_id: "${un}", provider_id: "${pr}", admit_date: "2026-07-01", discharge_date: "2026-07-03", discharge_disposition: "HOME", primary_dx_group: "MEDICAL", payer: "MEDICARE", age_years: 65, address_country: "US", no_publicity_flag: false, custody_status: "NONE" } }, as: DataSteward, captures: { d2a: "$.data.discharge_ids" } }
            - { call: "POST /api/discharges/import", payload: { program_id: "${pg}", count: 4, template: { mrn_prefix: "D", unit_id: "${un}", provider_id: "${pr}", admit_date: "2026-07-01", discharge_date: "2026-07-03", discharge_disposition: "HOME", primary_dx_group: "MEDICAL", payer: "MEDICARE", age_years: 65, address_country: "US", no_publicity_flag: false, custody_status: "NONE" } }, as: DataSteward, captures: { d2b: "$.data.discharge_ids" } }
            - { call: "POST /api/sample-cases/import", payload: { cycle_id: "${c2}", discharge_ids: "${d2a}", mode_assigned: "MAIL", postage_cost_cents: 100 }, as: DataSteward, captures: { k2a: "$.data.sample_case_ids" } }
            - { call: "POST /api/sample-cases/import", payload: { cycle_id: "${c2}", discharge_ids: "${d2b}", mode_assigned: "MAIL", postage_cost_cents: 100 }, as: DataSteward, captures: { k2b: "$.data.sample_case_ids" } }
            - { call: "POST /api/cycles/${c2}/start-fielding", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/responses/import", payload: { case_ids: "${k2a}", mode_used: "MAIL", nurse_comm_score: 4, doctor_comm_score: 4, cleanliness_score: 4, overall_rating_score: 4 }, as: VendorOperator, as_user_id: "${vn}" }
            - { call: "POST /api/responses/import", payload: { case_ids: "${k2b}", mode_used: "MAIL", nurse_comm_score: 3, doctor_comm_score: 3, cleanliness_score: 3, overall_rating_score: 3 }, as: VendorOperator, as_user_id: "${vn}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-30T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /api/cycles/${c2}/close-fielding", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/cycles/${c2}/begin-scoring", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/cycles/${c2}/publish", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/cycles", payload: { program_id: "${pg}", label: "Q3", cycle_index: 3, discharge_window_start: "2026-08-01", discharge_window_end: "2026-08-31", fielding_start_date: "2026-10-01", fielding_end_date: "2026-10-31", target_sample_size: 100 }, as: ProgramAdmin, captures: { c3: "$.data.id" } }
          trigger:
            - { call: "GET /api/initiatives/${ini}", payload: {}, as: Any, captures: { ini_st: "$.data.status" } }
            - { call: "POST /api/initiatives/${ini}/replan", payload: { evaluation_cycle_id: "${c3}", target_score: 82.0 }, as: ProgramAdmin }
          assert:
            - "after publish of idx2 (unit adjusted 84.00 < target 85.00): ImprovementInitiative.${ini}.status == TARGET_MISSED"
            - "after replan: status == ACTIVE again (cyclic loop), evaluation_cycle_id == ${c3}, target_score == 82.0"
            - "baseline_score still == 80.0 (pinned baseline unchanged by replan)"
            - "progress_pinned == null and progress_rolling == null after replan (reset until idx3 publishes)"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (depth >= 3 and depth >= 2, different triggers)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: publish_to_response_flag_cascade
        grounds:
          - state_machines.SurveyCycle.SCORING_to_PUBLISHED
          - state_machines.ImprovementInitiative.ACTIVE_to_UNDER_EVALUATION
          - state_machines.ServiceRecoveryTicket.OPEN_to_ESCALATED
          - entities.SurveyResponse.fields.has_escalated_recovery
        distinguishing_aspect: |
          Depth-3 chain triggered by POST publish (different trigger from the
          sibling instance): cycle PUBLISHED mutates initiative (B: ACTIVE ->
          TARGET_MISSED via UNDER_EVALUATION); that branch mutates tickets
          (C: OPEN -> ESCALATED); that escalation mutates the response
          (D: has_escalated_recovery -> true). Each hop is caused by the
          previous hop, not by the publish directly.
        test_recipe:
          setup:
            - "Cycle idx1 PUBLISHED (unit U1 CLEANLINESS adjusted 80.00); initiative (U1, CLEANLINESS, baseline idx1, evaluation idx2, target 85.00) ACTIVE"
            - "Cycle idx2 FIELDING with 25 responses (21 all-4 MAIL + 4 all-3 MAIL; one of the all-3 responses carries comment_text) -> unit adjusted cleanliness will score 84.00 < 85.00"
            - "ServiceRecoveryTicket OPEN on (U1, CLEANLINESS) routing the commented response"
          setup_api_calls:
            - { call: "POST /api/survey-programs", payload: { name: "P-TC1", sampling_protocol: "CENSUS", admin_mode: "MAIL_ONLY" }, as: ProgramAdmin, captures: { pg: "$.data.id", pg_v: "$.data.version" } }
            - { call: "POST /api/vendors", payload: { program_id: "${pg}", name: "V1", cycle_budget_cents: 100000, expected_program_version: "${pg_v}" }, as: ProgramAdmin, captures: { vn: "$.data.id" } }
            - { call: "POST /api/units", payload: { program_id: "${pg}", name: "Unit 1", unit_code: "U1" }, as: ProgramAdmin, captures: { un: "$.data.id" } }
            - { call: "POST /api/providers", payload: { program_id: "${pg}", full_name: "Dr A", npi: "NPI1", specialty: "IM" }, as: ProgramAdmin, captures: { pr: "$.data.id" } }
            - { call: "POST /api/cycles", payload: { program_id: "${pg}", label: "Q1", cycle_index: 1, discharge_window_start: "2026-06-01", discharge_window_end: "2026-06-30", fielding_start_date: "2026-08-03", fielding_end_date: "2026-08-31", target_sample_size: 100 }, as: ProgramAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /api/cycles/${c1}/open-sampling", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/discharges/import", payload: { program_id: "${pg}", count: 20, template: { mrn_prefix: "A", unit_id: "${un}", provider_id: "${pr}", admit_date: "2026-06-01", discharge_date: "2026-06-03", discharge_disposition: "HOME", primary_dx_group: "MEDICAL", payer: "MEDICARE", age_years: 65, address_country: "US", no_publicity_flag: false, custody_status: "NONE" } }, as: DataSteward, captures: { d1a: "$.data.discharge_ids" } }
            - { call: "POST /api/discharges/import", payload: { program_id: "${pg}", count: 5, template: { mrn_prefix: "B", unit_id: "${un}", provider_id: "${pr}", admit_date: "2026-06-01", discharge_date: "2026-06-03", discharge_disposition: "HOME", primary_dx_group: "MEDICAL", payer: "MEDICARE", age_years: 65, address_country: "US", no_publicity_flag: false, custody_status: "NONE" } }, as: DataSteward, captures: { d1b: "$.data.discharge_ids" } }
            - { call: "POST /api/sample-cases/import", payload: { cycle_id: "${c1}", discharge_ids: "${d1a}", mode_assigned: "MAIL", postage_cost_cents: 100 }, as: DataSteward, captures: { k1a: "$.data.sample_case_ids" } }
            - { call: "POST /api/sample-cases/import", payload: { cycle_id: "${c1}", discharge_ids: "${d1b}", mode_assigned: "MAIL", postage_cost_cents: 100 }, as: DataSteward, captures: { k1b: "$.data.sample_case_ids" } }
            - { call: "POST /api/cycles/${c1}/start-fielding", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/responses/import", payload: { case_ids: "${k1a}", mode_used: "MAIL", nurse_comm_score: 4, doctor_comm_score: 4, cleanliness_score: 4, overall_rating_score: 4 }, as: VendorOperator, as_user_id: "${vn}" }
            - { call: "POST /api/responses/import", payload: { case_ids: "${k1b}", mode_used: "MAIL", nurse_comm_score: 3, doctor_comm_score: 3, cleanliness_score: 3, overall_rating_score: 3 }, as: VendorOperator, as_user_id: "${vn}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /api/cycles/${c1}/close-fielding", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/cycles/${c1}/begin-scoring", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/cycles/${c1}/publish", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/cycles", payload: { program_id: "${pg}", label: "Q2", cycle_index: 2, discharge_window_start: "2026-07-01", discharge_window_end: "2026-07-31", fielding_start_date: "2026-09-01", fielding_end_date: "2026-09-30", target_sample_size: 100 }, as: ProgramAdmin, captures: { c2: "$.data.id" } }
            - { call: "POST /api/initiatives", payload: { unit_id: "${un}", domain: "CLEANLINESS", baseline_cycle_id: "${c1}", evaluation_cycle_id: "${c2}", target_score: 85.0 }, as: ProgramAdmin, captures: { ini: "$.data.id" } }
            - { call: "POST /api/initiatives/${ini}/activate", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/cycles/${c2}/open-sampling", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/discharges/import", payload: { program_id: "${pg}", count: 21, template: { mrn_prefix: "C", unit_id: "${un}", provider_id: "${pr}", admit_date: "2026-07-01", discharge_date: "2026-07-03", discharge_disposition: "HOME", primary_dx_group: "MEDICAL", payer: "MEDICARE", age_years: 65, address_country: "US", no_publicity_flag: false, custody_status: "NONE" } }, as: DataSteward, captures: { d2a: "$.data.discharge_ids" } }
            - { call: "POST /api/discharges/import", payload: { program_id: "${pg}", count: 4, template: { mrn_prefix: "D", unit_id: "${un}", provider_id: "${pr}", admit_date: "2026-07-01", discharge_date: "2026-07-03", discharge_disposition: "HOME", primary_dx_group: "MEDICAL", payer: "MEDICARE", age_years: 65, address_country: "US", no_publicity_flag: false, custody_status: "NONE" } }, as: DataSteward, captures: { d2b: "$.data.discharge_ids" } }
            - { call: "POST /api/sample-cases/import", payload: { cycle_id: "${c2}", discharge_ids: "${d2a}", mode_assigned: "MAIL", postage_cost_cents: 100 }, as: DataSteward, captures: { k2a: "$.data.sample_case_ids" } }
            - { call: "POST /api/sample-cases/import", payload: { cycle_id: "${c2}", discharge_ids: "${d2b}", mode_assigned: "MAIL", postage_cost_cents: 100 }, as: DataSteward, captures: { k2b: "$.data.sample_case_ids" } }
            - { call: "POST /api/cycles/${c2}/start-fielding", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/responses/import", payload: { case_ids: "${k2a}", mode_used: "MAIL", nurse_comm_score: 4, doctor_comm_score: 4, cleanliness_score: 4, overall_rating_score: 4 }, as: VendorOperator, as_user_id: "${vn}" }
            - { call: "POST /api/responses/import", payload: { case_ids: "${k2b[0:3]}", mode_used: "MAIL", nurse_comm_score: 3, doctor_comm_score: 3, cleanliness_score: 3, overall_rating_score: 3 }, as: VendorOperator, as_user_id: "${vn}" }
            - { call: "POST /api/responses", payload: { case_id: "${k2b[3]}", mode_used: "MAIL", nurse_comm_score: 3, doctor_comm_score: 3, cleanliness_score: 3, overall_rating_score: 3, comment_text: "Room was dirty" }, as: VendorOperator, as_user_id: "${vn}", captures: { rsp: "$.data.id" } }
            - { call: "POST /api/service-recovery-tickets", payload: { unit_id: "${un}", response_id: "${rsp}", domain: "CLEANLINESS", priority: "HIGH" }, as: UnitManager, as_user_id: "${un}", captures: { tkt: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-30T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /api/cycles/${c2}/close-fielding", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/cycles/${c2}/begin-scoring", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "POST /api/cycles/${c2}/publish", payload: {}, as: ProgramAdmin }
          assert:
            - "hop B: ImprovementInitiative.${ini}.status == TARGET_MISSED (84.00 < 85.00)"
            - "hop C: ServiceRecoveryTicket.${tkt}.status == ESCALATED (was OPEN before publish)"
            - "hop D: SurveyResponse.${rsp}.has_escalated_recovery == true"
            - "cycle: SurveyCycle.${c2}.status == PUBLISHED and published_star_rating == 4 (adjusted overall 84.00)"

      - name: discharge_exclusion_cascade
        grounds:
          - state_machines.Discharge.ELIGIBLE_to_EXCLUDED
          - state_machines.SampleCase.IN_FIELD_to_EXCLUDED_POST_SAMPLE
          - calculations.vendor_budget_reconciliation
        distinguishing_aspect: |
          Depth-2 chain with a different trigger (POST discharges/{id}/evaluate,
          not publish): discharge flips EXCLUDED -> linked IN_FIELD case is
          force-transitioned to EXCLUDED_POST_SAMPLE (B) -> that case mutation
          credits the vendor budget and recomputes cycle counters (C).
        test_recipe:
          setup:
            - "Cycle FIELDING; 2 IN_FIELD cases charged 100c each (vendor remaining 99800); both discharges ELIGIBLE"
          setup_api_calls:
            - { call: "POST /api/survey-programs", payload: { name: "P-TC2", sampling_protocol: "CENSUS", admin_mode: "MAIL_ONLY" }, as: ProgramAdmin, captures: { pg: "$.data.id", pg_v: "$.data.version" } }
            - { call: "POST /api/vendors", payload: { program_id: "${pg}", name: "V1", cycle_budget_cents: 100000, expected_program_version: "${pg_v}" }, as: ProgramAdmin, captures: { vn: "$.data.id" } }
            - { call: "POST /api/units", payload: { program_id: "${pg}", name: "Unit 1", unit_code: "U1" }, as: ProgramAdmin, captures: { un: "$.data.id" } }
            - { call: "POST /api/providers", payload: { program_id: "${pg}", full_name: "Dr A", npi: "NPI1", specialty: "IM" }, as: ProgramAdmin, captures: { pr: "$.data.id" } }
            - { call: "POST /api/cycles", payload: { program_id: "${pg}", label: "Q1", cycle_index: 1, discharge_window_start: "2026-06-01", discharge_window_end: "2026-06-30", fielding_start_date: "2026-08-03", fielding_end_date: "2026-08-31", target_sample_size: 100 }, as: ProgramAdmin, captures: { cy: "$.data.id" } }
            - { call: "POST /api/cycles/${cy}/open-sampling", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/discharges/import", payload: { program_id: "${pg}", count: 2, template: { mrn_prefix: "M", unit_id: "${un}", provider_id: "${pr}", admit_date: "2026-06-01", discharge_date: "2026-06-03", discharge_disposition: "HOME", primary_dx_group: "MEDICAL", payer: "MEDICARE", age_years: 65, address_country: "US", no_publicity_flag: false, custody_status: "NONE" } }, as: DataSteward, captures: { d_ids: "$.data.discharge_ids" } }
            - { call: "POST /api/sample-cases/import", payload: { cycle_id: "${cy}", discharge_ids: "${d_ids}", mode_assigned: "MAIL", postage_cost_cents: 100 }, as: DataSteward, captures: { c_ids: "$.data.sample_case_ids" } }
            - { call: "POST /api/cycles/${cy}/start-fielding", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "POST /api/discharges/${d_ids[0]}/evaluate", payload: { primary_dx_group: "PSYCHIATRIC" }, as: DataSteward, captures: { d_st: "$.data.status" } }
          assert:
            - "hop A: Discharge.${d_ids[0]}.status == EXCLUDED and exclusion_reasons == [PSYCH_DX]"
            - "hop B: SampleCase.${c_ids[0]}.status == EXCLUDED_POST_SAMPLE and billing_status == CREDITED"
            - "hop C: SurveyVendor.${vn}.cycle_budget_remaining_cents == 99900 (99800 + 100 credit)"
            - "hop C: SurveyCycle.${cy}.eligible_denominator == 1 (second case still IN_FIELD)"
            - "SurveyCycle.${cy}.sampled_count == 2 (snapshot at start-fielding unchanged)"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_sample_create
        grounds:
          - validations[priority=4]
          - validations[priority=9]
          - errors[ERR_CYCLE_NOT_SAMPLING_OPEN]
          - errors[ERR_VENDOR_BUDGET_EXCEEDED]
        distinguishing_aspect: |
          Category pair (state, business_fiscal): the request violates BOTH
          priority-4 state (cycle B is DRAFT, not SAMPLING_OPEN) AND priority-9
          fiscal (vendor remaining 0 < postage 50); the state error
          ERR_CYCLE_NOT_SAMPLING_OPEN must win.
        test_recipe:
          setup:
            - "Vendor budget 100c, fully consumed by cycle A's case (remaining 0)"
            - "Cycle B of the same program in DRAFT; a second ELIGIBLE discharge available"
          setup_api_calls:
            - { call: "POST /api/survey-programs", payload: { name: "P-PP1", sampling_protocol: "CENSUS", admin_mode: "MAIL_ONLY" }, as: ProgramAdmin, captures: { pg: "$.data.id", pg_v: "$.data.version" } }
            - { call: "POST /api/vendors", payload: { program_id: "${pg}", name: "V1", cycle_budget_cents: 100, expected_program_version: "${pg_v}" }, as: ProgramAdmin, captures: { vn: "$.data.id" } }
            - { call: "POST /api/units", payload: { program_id: "${pg}", name: "Unit 1", unit_code: "U1" }, as: ProgramAdmin, captures: { un: "$.data.id" } }
            - { call: "POST /api/providers", payload: { program_id: "${pg}", full_name: "Dr A", npi: "NPI1", specialty: "IM" }, as: ProgramAdmin, captures: { pr: "$.data.id" } }
            - { call: "POST /api/cycles", payload: { program_id: "${pg}", label: "Q1", cycle_index: 1, discharge_window_start: "2026-06-01", discharge_window_end: "2026-06-30", fielding_start_date: "2026-08-03", fielding_end_date: "2026-08-31", target_sample_size: 100 }, as: ProgramAdmin, captures: { cA: "$.data.id" } }
            - { call: "POST /api/cycles/${cA}/open-sampling", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/discharges/import", payload: { program_id: "${pg}", count: 2, template: { mrn_prefix: "M", unit_id: "${un}", provider_id: "${pr}", admit_date: "2026-06-01", discharge_date: "2026-06-03", discharge_disposition: "HOME", primary_dx_group: "MEDICAL", payer: "MEDICARE", age_years: 65, address_country: "US", no_publicity_flag: false, custody_status: "NONE" } }, as: DataSteward, captures: { d_ids: "$.data.discharge_ids" } }
            - { call: "POST /api/sample-cases", payload: { cycle_id: "${cA}", discharge_id: "${d_ids[0]}", mode_assigned: "MAIL", postage_cost_cents: 100 }, as: DataSteward, captures: { k1: "$.data.id" } }
            - { call: "POST /api/cycles", payload: { program_id: "${pg}", label: "Q2", cycle_index: 2, discharge_window_start: "2026-07-01", discharge_window_end: "2026-07-31", fielding_start_date: "2026-09-01", fielding_end_date: "2026-09-30", target_sample_size: 100 }, as: ProgramAdmin, captures: { cB: "$.data.id" } }
          trigger:
            - { call: "POST /api/sample-cases", payload: { cycle_id: "${cB}", discharge_id: "${d_ids[1]}", mode_assigned: "MAIL", postage_cost_cents: 50 }, as: DataSteward, captures: { err: "$.data.error_id" } }
          assert:
            - "response status == 409 and error_id == ERR_CYCLE_NOT_SAMPLING_OPEN (state, priority 4)"
            - "NOT ERR_VENDOR_BUDGET_EXCEEDED (fiscal, priority 9), although remaining 0 < 50 also fails"
            - "no SampleCase created for discharge ${d_ids[1]}: GET /api/sample-cases?discharge_id=${d_ids[1]} returns empty array"

      - name: safety_beats_referential_on_sample_create
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_DISCHARGE_NOT_ELIGIBLE]
          - errors[ERR_CROSS_PROGRAM_REFERENCE]
        distinguishing_aspect: |
          Category pair (business_safety, business_referential) — different
          pair from the sibling instance: the discharge is BOTH EXCLUDED
          (safety) AND owned by a different program than the cycle
          (referential); the safety error ERR_DISCHARGE_NOT_ELIGIBLE must win.
        test_recipe:
          setup:
            - "Program P1 with ACTIVE vendor and cycle C1 in SAMPLING_OPEN"
            - "Program P2 with one discharge already evaluated EXCLUDED (disposition EXPIRED)"
          setup_api_calls:
            - { call: "POST /api/survey-programs", payload: { name: "P-PP2-A", sampling_protocol: "CENSUS", admin_mode: "MAIL_ONLY" }, as: ProgramAdmin, captures: { pg1: "$.data.id", pg1_v: "$.data.version" } }
            - { call: "POST /api/vendors", payload: { program_id: "${pg1}", name: "V1", cycle_budget_cents: 100000, expected_program_version: "${pg1_v}" }, as: ProgramAdmin, captures: { vn: "$.data.id" } }
            - { call: "POST /api/units", payload: { program_id: "${pg1}", name: "Unit 1", unit_code: "U1" }, as: ProgramAdmin, captures: { un1: "$.data.id" } }
            - { call: "POST /api/providers", payload: { program_id: "${pg1}", full_name: "Dr A", npi: "NPI1", specialty: "IM" }, as: ProgramAdmin, captures: { pr1: "$.data.id" } }
            - { call: "POST /api/cycles", payload: { program_id: "${pg1}", label: "Q1", cycle_index: 1, discharge_window_start: "2026-06-01", discharge_window_end: "2026-06-30", fielding_start_date: "2026-08-03", fielding_end_date: "2026-08-31", target_sample_size: 100 }, as: ProgramAdmin, captures: { cy: "$.data.id" } }
            - { call: "POST /api/cycles/${cy}/open-sampling", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/survey-programs", payload: { name: "P-PP2-B", sampling_protocol: "CENSUS", admin_mode: "MAIL_ONLY" }, as: ProgramAdmin, captures: { pg2: "$.data.id" } }
            - { call: "POST /api/units", payload: { program_id: "${pg2}", name: "Unit 9", unit_code: "U9" }, as: ProgramAdmin, captures: { un2: "$.data.id" } }
            - { call: "POST /api/providers", payload: { program_id: "${pg2}", full_name: "Dr B", npi: "NPI9", specialty: "IM" }, as: ProgramAdmin, captures: { pr2: "$.data.id" } }
            - { call: "POST /api/discharges/import", payload: { program_id: "${pg2}", count: 1, template: { mrn_prefix: "X", unit_id: "${un2}", provider_id: "${pr2}", admit_date: "2026-06-01", discharge_date: "2026-06-03", discharge_disposition: "EXPIRED", primary_dx_group: "MEDICAL", payer: "MEDICARE", age_years: 80, address_country: "US", no_publicity_flag: false, custody_status: "NONE" } }, as: DataSteward, captures: { d2_ids: "$.data.discharge_ids" } }
          trigger:
            - { call: "POST /api/sample-cases", payload: { cycle_id: "${cy}", discharge_id: "${d2_ids[0]}", mode_assigned: "MAIL", postage_cost_cents: 100 }, as: DataSteward, captures: { err: "$.data.error_id" } }
          assert:
            - "response status == 422 and error_id == ERR_DISCHARGE_NOT_ELIGIBLE (safety, priority 5)"
            - "NOT ERR_CROSS_PROGRAM_REFERENCE (referential, priority 6), although the discharge belongs to program ${pg2}"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: star_threshold_80_inclusive
        grounds:
          - calculations.star_rating
          - endpoints[GET /api/cycles/{cycleId}/star-rating]
        distinguishing_aspect: |
          Metric: adjusted top-box PERCENTAGE via GET star-rating. The 4-star
          breakpoint is INCLUSIVE: exactly 80.00 yields 4 stars (a 79.99-style
          reading would yield 3). Fixture: 20 all-4 + 5 all-3 MAIL responses
          give exactly 80.00.
        test_recipe:
          setup:
            - "Cycle in SCORING; 25 completed MAIL responses: 20 all-4, 5 all-3 -> adjusted overall exactly 80.00; response_rate 100.00"
          setup_api_calls:
            - { call: "POST /api/survey-programs", payload: { name: "P-BP1", sampling_protocol: "CENSUS", admin_mode: "MAIL_ONLY" }, as: ProgramAdmin, captures: { pg: "$.data.id", pg_v: "$.data.version" } }
            - { call: "POST /api/vendors", payload: { program_id: "${pg}", name: "V1", cycle_budget_cents: 100000, expected_program_version: "${pg_v}" }, as: ProgramAdmin, captures: { vn: "$.data.id" } }
            - { call: "POST /api/units", payload: { program_id: "${pg}", name: "Unit 1", unit_code: "U1" }, as: ProgramAdmin, captures: { un: "$.data.id" } }
            - { call: "POST /api/providers", payload: { program_id: "${pg}", full_name: "Dr A", npi: "NPI1", specialty: "IM" }, as: ProgramAdmin, captures: { pr: "$.data.id" } }
            - { call: "POST /api/cycles", payload: { program_id: "${pg}", label: "Q1", cycle_index: 1, discharge_window_start: "2026-06-01", discharge_window_end: "2026-06-30", fielding_start_date: "2026-08-03", fielding_end_date: "2026-08-31", target_sample_size: 100 }, as: ProgramAdmin, captures: { cy: "$.data.id" } }
            - { call: "POST /api/cycles/${cy}/open-sampling", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/discharges/import", payload: { program_id: "${pg}", count: 20, template: { mrn_prefix: "A", unit_id: "${un}", provider_id: "${pr}", admit_date: "2026-06-01", discharge_date: "2026-06-03", discharge_disposition: "HOME", primary_dx_group: "MEDICAL", payer: "MEDICARE", age_years: 65, address_country: "US", no_publicity_flag: false, custody_status: "NONE" } }, as: DataSteward, captures: { d1a: "$.data.discharge_ids" } }
            - { call: "POST /api/discharges/import", payload: { program_id: "${pg}", count: 5, template: { mrn_prefix: "B", unit_id: "${un}", provider_id: "${pr}", admit_date: "2026-06-01", discharge_date: "2026-06-03", discharge_disposition: "HOME", primary_dx_group: "MEDICAL", payer: "MEDICARE", age_years: 65, address_country: "US", no_publicity_flag: false, custody_status: "NONE" } }, as: DataSteward, captures: { d1b: "$.data.discharge_ids" } }
            - { call: "POST /api/sample-cases/import", payload: { cycle_id: "${cy}", discharge_ids: "${d1a}", mode_assigned: "MAIL", postage_cost_cents: 100 }, as: DataSteward, captures: { k1a: "$.data.sample_case_ids" } }
            - { call: "POST /api/sample-cases/import", payload: { cycle_id: "${cy}", discharge_ids: "${d1b}", mode_assigned: "MAIL", postage_cost_cents: 100 }, as: DataSteward, captures: { k1b: "$.data.sample_case_ids" } }
            - { call: "POST /api/cycles/${cy}/start-fielding", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/responses/import", payload: { case_ids: "${k1a}", mode_used: "MAIL", nurse_comm_score: 4, doctor_comm_score: 4, cleanliness_score: 4, overall_rating_score: 4 }, as: VendorOperator, as_user_id: "${vn}" }
            - { call: "POST /api/responses/import", payload: { case_ids: "${k1b}", mode_used: "MAIL", nurse_comm_score: 3, doctor_comm_score: 3, cleanliness_score: 3, overall_rating_score: 3 }, as: VendorOperator, as_user_id: "${vn}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /api/cycles/${cy}/close-fielding", payload: {}, as: ProgramAdmin }
            - { call: "POST /api/cycles/${cy}/begin-scoring", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "GET /api/cycles/${cy}/star-rating", payload: {}, as: Any }
          assert:
            - "stars == 4 (adjusted_overall_topbox_pct == 80.0 meets the >= 80.0 breakpoint exactly)"
            - "rating_status == RATED and capped == false"

      - name: publication_min_completed_count_boundary
        grounds:
          - calculations.response_rate
          - state_machines.SurveyCycle.SCORING_to_PUBLISHED
          - errors[ERR_BELOW_PUBLICATION_THRESHOLD]
          - endpoints[POST /api/cycles/{cycleId}/publish]
        distinguishing_aspect: |
          Metric: completed-response COUNT via POST publish (different metric
          and endpoint from the sibling percentage-boundary instance). At
          completed == 24 (< 25) publication_eligible is false and publish is
          rejected even though response_rate is 100.00 (>= 10.0 satisfied).
        test_recipe:
          setup:
            - "Cycle in SCORING with 24 completed responses out of 24 fielded (rate 100.00)"
          setup_api_calls:
            - { call: "POST /api/survey-programs", payload: { name: "P-BP2", sampling_protocol: "CENSUS", admin_mode: "MAIL_ONLY" }, as: ProgramAdmin, captures: { pg: "$.data.id", pg_v: "$.data.version" } }
            - { call: "POST /api/vendors", payload: { program_id: "${pg}", name: "V1", cycle_budget_cents: 100000, expected_program_version: "${pg_v}" }, as: ProgramAdmin, captures: { vn: "$.data.id" } }
            - { call: "POST /api/units", payload: { program_id: "${pg}", name: "Unit 1", unit_code: "U1" }, as: ProgramAdmin, captures: { un: "$.data.id" } }
            - { call: "POST /api/providers", payload: { program_id: "${pg}", full_name: "Dr A", npi: "NPI1", specialty: "IM" }, as: ProgramAdmin, captures: { pr: "$.data.id" } }
