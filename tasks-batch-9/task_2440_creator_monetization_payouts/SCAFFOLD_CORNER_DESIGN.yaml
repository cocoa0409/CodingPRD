              as: FinanceOperator
            - call: "POST /monetization/earnings-periods/${per}/close"
              payload: {}
              as: FinanceOperator
          trigger:
            - call: "GET /monetization/earnings-statements"
              payload: { creator_id: "${cr}" }
              as: PolicyReviewer
              as_user_id: "pr_read_1"
            - call: "GET /monetization/payouts"
              payload: { creator_id: "${cr}" }
              as: PolicyReviewer
              as_user_id: "pr_read_1"
            - call: "GET /monetization/creators/${cr}/ledger-entries"
              payload: {}
              as: PolicyReviewer
              as_user_id: "pr_read_1"
            - call: "GET /monetization/creator-funds/${fd}"
