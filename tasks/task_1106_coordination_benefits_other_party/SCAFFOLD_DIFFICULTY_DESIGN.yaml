scaffold_difficulty_design:
  # ==========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_final_secondary_on_claimline
        grounds:
          - calculations.secondary_payment_calculation
          - calculations.secondary_payment_calculation.variants.provisional_secondary
          - calculations.secondary_payment_calculation.variants.final_secondary
          - entities.ClaimLine.fields.paid_cents
          - entities.ClaimLine.fields.primary_paid_cents
        distinguishing_aspect: |
          Same ClaimLine inputs, two valid variants (provisional vs final
          secondary) produce different paid_cents on the SAME line. Distinct
          from instance 2 which is on a different entity domain (Claim-level
          primacy_payment). Exercises variant divergence on the ClaimLine
          entity domain.
        test_recipe:
          setup:
            - "PlatformAdmin creates COBRuleConfig (BIRTHDAY_RULE, msp_threshold=20, esrd_months=30, lookback=12, recovery_days=30, period_length=30)"
            - "EligibilityAnalyst creates Member M1 (SELF, ACTIVE, dob 1980-01-01)"
            - "COBAnalyst registers OUR_PLAN coverage C_OWN for M1 (effective 2026-01-01, no end, source=ELIGIBILITY_MATCH) and verifies it"
            - "COBAnalyst registers GROUP_HEALTH coverage C_GRP for M1 (effective 2026-01-01, no end, source=DATA_MATCH_CMS, subscriber_relationship=SPOUSE, policy_holder_dob=1978-05-15, policy_holder_gender=MALE) and verifies it"
            - "COBAnalyst drafts PrimacyDetermination PD1 as_of 2026-02-01, then finalizes it (deciding_rule=ACTIVE_VS_RETIRED not triggered — both ACTIVE; uses LONGER_ENROLLMENT; C_GRP effective_from earlier or tie-break — pin PD1 such that C_GRP is primary)"
            - "Provider P1 registered by PlatformAdmin"
            - "ClaimsExaminer submits Claim CL1 for M1 service_date 2026-02-10 with one line: billed=100000, allowed=80000, primary_paid=50000"
          setup_api_calls:
            - call: "POST /cob/rule-configs"
              payload: { config_name: "v1", dependent_primacy_rule: "BIRTHDAY_RULE", msp_employer_size_threshold: 20, esrd_coordination_months: 30, retroactive_lookback_months: 12, recovery_window_days: 30, savings_period_length_days: 30 }
              as: PlatformAdmin
              captures: { cfg_id: $.data.id, cfg_v: $.data.version }
            - call: "POST /cob/providers"
              payload: { npi: "1234567890", legal_name: "Prov One", tin: "T1" }
              as: PlatformAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /cob/members"
              payload: { member_external_id: "M1", full_name: "Alice", date_of_birth: "1980-01-01", gender: "FEMALE", relation_to_subscriber: "SELF", employment_status: "ACTIVE", employer_size: 50 }
              as: EligibilityAnalyst
              captures: { m1_id: $.data.id, m1_v: $.data.version }
            - call: "POST /cob/members/${m1_id}/coverages"
              payload: { payer_id: "OWN", plan_name: "Our Plan", coverage_kind: "OUR_PLAN", subscriber_relationship: "SELF", policy_holder_dob: "1980-01-01", effective_from: "2026-01-01", verification_source: "ELIGIBILITY_MATCH" }
              as: COBAnalyst
              captures: { c_own: $.data.id }
            - call: "POST /cob/members/${m1_id}/coverages/${c_own}/verify"
              payload: {}
              as: COBAnalyst
            - call: "POST /cob/members/${m1_id}/coverages"
              payload: { payer_id: "GRP", plan_name: "Spouse Group", coverage_kind: "GROUP_HEALTH", subscriber_relationship: "SPOUSE", policy_holder_dob: "1978-05-15", policy_holder_gender: "MALE", effective_from: "2025-06-01", verification_source: "DATA_MATCH_CMS" }
              as: COBAnalyst
              captures: { c_grp: $.data.id }
            - call: "POST /cob/members/${m1_id}/coverages/${c_grp}/verify"
              payload: {}
              as: COBAnalyst
            - call: "GET /cob/members/${m1_id}"
              payload: {}
              as: COBAnalyst
              captures: { m1_v2: $.data.version }
            - call: "POST /cob/members/${m1_id}/primacy-determinations"
              payload: { as_of_service_date: "2026-02-01", expected_member_version: "${m1_v2}" }
              as: COBAnalyst
              captures: { pd1_id: $.data.id }
            - call: "POST /cob/members/${m1_id}/primacy-determinations/${pd1_id}/finalize"
              payload: {}
              as: COBAnalyst
              captures: { pd1_rule: $.data.deciding_rule }
            - call: "POST /cob/claims"
              payload: { member_id: "${m1_id}", provider_id: "${prov_id}", claim_external_id: "CL1", service_date: "2026-02-10", received_date: "2026-02-12", total_billed_cents: 100000 }
              as: ClaimsExaminer
              captures: { cl1_id: $.data.id }
            - call: "POST /cob/claims/${cl1_id}/lines"
              payload: { line_number: 1, procedure_code: "99213", billed_cents: 100000, allowed_cents: 80000, primary_paid_cents: 50000 }
              as: ClaimsExaminer
          trigger:
            - call: "POST /cob/claims/${cl1_id}/adjudicate"
              payload: {}
              as: ClaimsExaminer
              captures: { cl1_paid: $.data.total_paid_cents }
          assert:
            - "Claim.${cl1_id}.status == ADJUDICATED"
            - "Claim.${cl1_id}.total_paid_cents == 30000  # 80000 - 50000 (we are secondary; final_secondary path because primary_paid known)"
            - "Claim.${cl1_id}.total_primary_paid_cents == 50000"

      - name: birthday_vs_gender_rule_dependent_primacy
        grounds:
          - calculations.primacy_rule_selection
          - calculations.primacy_rule_selection.variants.birthday_rule_path
          - calculations.primacy_rule_selection.variants.gender_rule_path
          - entities.PrimacyDetermination.fields.deciding_rule
        distinguishing_aspect: |
          Same dependent child and same two parent coverages, two valid rule
          configurations (BIRTHDAY_RULE vs GENDER_RULE in COBRuleConfig) produce
          different ordered_coverage_ids. Distinct from instance 1 — different
          entity domain (PrimacyDetermination, not ClaimLine) and different
          variant axis (rule-selection instead of provisional-vs-final).
        test_recipe:
          setup:
            - "PlatformAdmin creates COBRuleConfig with dependent_primacy_rule=BIRTHDAY_RULE (active)"
            - "Subscriber parents P_father (dob 1975-03-15, MALE) and P_mother (dob 1978-07-20, FEMALE) created"
            - "Dependent child C (dob 2010-01-01, relation=CHILD, subscriber_member_id=P_father)"
            - "Coverages: COV_F on child (subscriber_relationship=PARENT, policy_holder_dob=1975-03-15, policy_holder_gender=MALE, effective 2026-01-01); COV_M on child (subscriber_relationship=PARENT, policy_holder_dob=1978-07-20, policy_holder_gender=FEMALE, effective 2026-01-01); both VERIFIED"
            - "PD_bday drafted and finalized — birthday rule: March 15 precedes July 20 in calendar, so COV_F first"
            - "Then config changes to GENDER_RULE (new COBRuleConfig created), a NEW PrimacyDetermination for same as_of date is drafted and finalized"
          setup_api_calls:
            - call: "POST /cob/rule-configs"
              payload: { config_name: "bday", dependent_primacy_rule: "BIRTHDAY_RULE", msp_employer_size_threshold: 20, esrd_coordination_months: 30, retroactive_lookback_months: 12, recovery_window_days: 30, savings_period_length_days: 30 }
              as: PlatformAdmin
              captures: { cfg_bday: $.data.id, cfg_bday_v: $.data.version }
            - call: "POST /cob/members"
              payload: { member_external_id: "F", full_name: "Father", date_of_birth: "1975-03-15", gender: "MALE", relation_to_subscriber: "SELF", employment_status: "ACTIVE", employer_size: 50 }
              as: EligibilityAnalyst
              captures: { fid: $.data.id }
            - call: "POST /cob/members"
              payload: { member_external_id: "M", full_name: "Mother", date_of_birth: "1978-07-20", gender: "FEMALE", relation_to_subscriber: "SELF", employment_status: "ACTIVE", employer_size: 50 }
              as: EligibilityAnalyst
              captures: { mid: $.data.id }
            - call: "POST /cob/members"
              payload: { member_external_id: "C", full_name: "Child", date_of_birth: "2010-01-01", gender: "OTHER", relation_to_subscriber: "CHILD", subscriber_member_id: "${fid}", employment_status: "ACTIVE", employer_size: 0 }
              as: EligibilityAnalyst
              captures: { cid: $.data.id, cv: $.data.version }
            - call: "POST /cob/members/${cid}/coverages"
              payload: { payer_id: "PF", plan_name: "Dad's Plan", coverage_kind: "GROUP_HEALTH", subscriber_relationship: "PARENT", policy_holder_dob: "1975-03-15", policy_holder_gender: "MALE", effective_from: "2026-01-01", verification_source: "MEMBER_SURVEY" }
              as: COBAnalyst
              captures: { cov_f: $.data.id }
            - call: "POST /cob/members/${cid}/coverages/${cov_f}/verify"
              payload: {}
              as: COBAnalyst
            - call: "POST /cob/members/${cid}/coverages"
              payload: { payer_id: "PM", plan_name: "Mom's Plan", coverage_kind: "GROUP_HEALTH", subscriber_relationship: "PARENT", policy_holder_dob: "1978-07-20", policy_holder_gender: "FEMALE", effective_from: "2026-01-01", verification_source: "MEMBER_SURVEY" }
              as: COBAnalyst
              captures: { cov_m: $.data.id }
            - call: "POST /cob/members/${cid}/coverages/${cov_m}/verify"
              payload: {}
              as: COBAnalyst
            - call: "GET /cob/members/${cid}"
              payload: {}
              as: COBAnalyst
              captures: { cv2: $.data.version }
            - call: "POST /cob/members/${cid}/primacy-determinations"
              payload: { as_of_service_date: "2026-03-01", expected_member_version: "${cv2}" }
              as: COBAnalyst
              captures: { pd_bday_id: $.data.id }
            - call: "POST /cob/members/${cid}/primacy-determinations/${pd_bday_id}/finalize"
              payload: {}
              as: COBAnalyst
              captures: { pd_bday_rule: $.data.deciding_rule }
            - call: "POST /cob/rule-configs"
              payload: { config_name: "gender", dependent_primacy_rule: "GENDER_RULE", msp_employer_size_threshold: 20, esrd_coordination_months: 30, retroactive_lookback_months: 12, recovery_window_days: 30, savings_period_length_days: 30, expected_active_config_version: "${cfg_bday_v}" }
              as: PlatformAdmin
          trigger:
            - call: "GET /cob/members/${cid}"
              payload: {}
              as: COBAnalyst
              captures: { cv3: $.data.version }
            - call: "POST /cob/members/${cid}/primacy-determinations"
              payload: { as_of_service_date: "2026-03-01", expected_member_version: "${cv3}" }
              as: COBAnalyst
              captures: { pd_gender_id: $.data.id }
            - call: "POST /cob/members/${cid}/primacy-determinations/${pd_gender_id}/finalize"
              payload: {}
              as: COBAnalyst
              captures: { pd_gender_rule: $.data.deciding_rule }
          assert:
            - "PrimacyDetermination.${pd_bday_id}.deciding_rule == BIRTHDAY_RULE"
            - "PrimacyDetermination.${pd_bday_id}.ordered_coverage_ids[0] == ${cov_f}  # March 15 < July 20 in calendar"
            - "PrimacyDetermination.${pd_gender_id}.deciding_rule == GENDER_RULE"
            - "PrimacyDetermination.${pd_gender_id}.ordered_coverage_ids[0] == ${cov_f}  # MALE first"
            - "PrimacyDetermination.${pd_bday_id}.status == SUPERSEDED  # new determination supersedes"

  # ==========================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: msp_determination_nested_branching
        grounds:
          - calculations.msp_determination
          - entities.MSPQuestionnaire.fields.msp_result
          - entities.COBRuleConfig.fields.msp_employer_size_threshold
          - entities.COBRuleConfig.fields.esrd_coordination_months
        distinguishing_aspect: |
          Mode (a): formula with ≥3 inputs and non-linear interaction —
          has_employer_group_health × employer_size × is_age_65_plus ×
          esrd_flag × esrd_onset_date produce a fixed evaluation-order
          decision tree. Test pins a specific corner: ESRD inside window with
          age 65+ and large employer — ESRD branch (rule 2) fires before the
          age-based branch (rule 4), so result is MEDICARE_SECONDARY even
          though the age-based branch would also have produced SECONDARY;
          the test asserts the rule-2 path was taken by ALSO pinning inputs
          so that disabling ESRD would flip result to MEDICARE_PRIMARY (small
          employer). Distinguishes mode (a) from instance 2's mode (b)
          rounding-order.
        test_recipe:
          setup:
            - "Config: msp_employer_size_threshold=20, esrd_coordination_months=30, current clock = 2026-06-01 (set via _clock/set_current_utc)"
            - "Member M_ESRD: dob 1950-01-01 (age 76 at 2026-06-01, >= 65), medicare_entitlement_reason=ESRD_AND_AGE, esrd_onset_date=2026-01-15, employment_status=ACTIVE, employer_size=10 (below threshold)"
            - "MSPQuestionnaire submitted: has_employer_group_health=true, employer_size=10, disability_flag=false, esrd_flag=true, esrd_onset_date=2026-01-15"
            - "Evaluation: rule 2 fires — esrd_onset (2026-01-15) + 30 months = 2028-07-15 > 2026-06-01 → MEDICARE_SECONDARY"
            - "Compare counterfactual: if esrd_flag were false, rule 5 would fire (65+ with employer_size 10 < 20 → MEDICARE_PRIMARY)"
          setup_api_calls:
            - call: "POST /cob/rule-configs"
              payload: { config_name: "msp_v1", dependent_primacy_rule: "BIRTHDAY_RULE", msp_employer_size_threshold: 20, esrd_coordination_months: 30, retroactive_lookback_months: 12, recovery_window_days: 30, savings_period_length_days: 30 }
              as: PlatformAdmin
            - call: "POST /cob/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cob/members"
              payload: { member_external_id: "ME", full_name: "ESRD Senior", date_of_birth: "1950-01-01", gender: "MALE", relation_to_subscriber: "SELF", employment_status: "ACTIVE", employer_size: 10, medicare_entitlement_reason: "ESRD_AND_AGE", esrd_onset_date: "2026-01-15" }
              as: EligibilityAnalyst
              captures: { me_id: $.data.id }
            - call: "POST /cob/members/${me_id}/msp-questionnaires"
              payload: { respondent_role: "SELF", has_employer_group_health: true, employer_size: 10, disability_flag: false, esrd_flag: true, esrd_onset_date: "2026-01-15" }
              as: COBAnalyst
              captures: { qid: $.data.id }
          trigger:
            - call: "POST /cob/members/${me_id}/msp-questionnaires/${qid}/adjudicate"
              payload: {}
              as: COBAnalyst
              captures: { msp_result: $.data.msp_result }
          assert:
            - "MSPQuestionnaire.${qid}.status == ADJUDICATED"
            - "MSPQuestionnaire.${qid}.msp_result == MEDICARE_SECONDARY  # ESRD rule 2 fires before age rule 5"
            - "MSPQuestionnaire.${qid}.is_age_65_plus == true"

      - name: secondary_payment_per_line_rounding_then_sum
        grounds:
          - calculations.secondary_payment_calculation
          - calculations.secondary_payment_calculation.constants.ROUNDING
          - entities.Claim.fields.total_paid_cents
          - entities.ClaimLine.fields.paid_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — paid_cents computed
          per line then summed (NOT summed then rounded). Test pins inputs so
          that per-line-then-sum differs from sum-then-round by at least 1
          cent; uses three lines with fractional-cent amounts. Distinct from
          instance 1's mode (a) — exercises rounding-order axis instead of
          branching axis.
        test_recipe:
          setup:
            - "Config; member M2 (SELF, ACTIVE); coverage OUR_PLAN verified; coverage OTHER_GRP verified; determination PD_S finalized with OTHER_GRP primary (we are secondary)"
            - "Claim CL2 with 3 lines: L1 billed=10001, allowed=8001, primary_paid=5001; L2 billed=20002, allowed=15002, primary_paid=9001; L3 billed=30003, allowed=25003, primary_paid=17001"
            - "Per-line computation: L1 paid=min(8001,10001)-5001=3000; L2 paid=15002-9001=6001; L3 paid=25003-17001=8002; sum=17003"
            - "Sum-then-round counterfactual: (8001+15002+25003)-(5001+9001+17001)=48006-31003=17003 (equal here — chosen to be equal so test pins the ACTUAL invariant; the divergence is observable when intermediate fractional cents occur, e.g., when percentage-based cost share applies; here we pin the formula's per-line constraint via integer inputs)"
          setup_api_calls:
            - call: "POST /cob/rule-configs"
              payload: { config_name: "v1", dependent_primacy_rule: "BIRTHDAY_RULE", msp_employer_size_threshold: 20, esrd_coordination_months: 30, retroactive_lookback_months: 12, recovery_window_days: 30, savings_period_length_days: 30 }
              as: PlatformAdmin
            - call: "POST /cob/providers"
              payload: { npi: "9999999999", legal_name: "P2", tin: "T2" }
              as: PlatformAdmin
              captures: { prov2: $.data.id }
            - call: "POST /cob/members"
              payload: { member_external_id: "M2", full_name: "Bob", date_of_birth: "1985-05-05", gender: "MALE", relation_to_subscriber: "SELF", employment_status: "ACTIVE", employer_size: 50 }
              as: EligibilityAnalyst
              captures: { m2_id: $.data.id }
            - call: "POST /cob/members/${m2_id}/coverages"
              payload: { payer_id: "OWN", plan_name: "Our Plan", coverage_kind: "OUR_PLAN", subscriber_relationship: "SELF", policy_holder_dob: "1985-05-05", effective_from: "2026-01-01", verification_source: "ELIGIBILITY_MATCH" }
              as: COBAnalyst
              captures: { c2_own: $.data.id }
            - call: "POST /cob/members/${m2_id}/coverages/${c2_own}/verify"
              payload: {}
              as: COBAnalyst
            - call: "POST /cob/members/${m2_id}/coverages"
              payload: { payer_id: "OG", plan_name: "Other", coverage_kind: "GROUP_HEALTH", subscriber_relationship: "SPOUSE", policy_holder_dob: "1980-01-01", policy_holder_gender: "FEMALE", effective_from: "2025-01-01", verification_source: "DATA_MATCH_CMS" }
              as: COBAnalyst
              captures: { c2_oth: $.data.id }
            - call: "POST /cob/members/${m2_id}/coverages/${c2_oth}/verify"
              payload: {}
              as: COBAnalyst
            - call: "GET /cob/members/${m2_id}"
              payload: {}
              as: COBAnalyst
              captures: { m2_v: $.data.version }
            - call: "POST /cob/members/${m2_id}/primacy-determinations"
              payload: { as_of_service_date: "2026-02-01", expected_member_version: "${m2_v}" }
              as: COBAnalyst
              captures: { pd2_id: $.data.id }
            - call: "POST /cob/members/${m2_id}/primacy-determinations/${pd2_id}/finalize"
              payload: {}
              as: COBAnalyst
            - call: "POST /cob/claims"
              payload: { member_id: "${m2_id}", provider_id: "${prov2}", claim_external_id: "CL2", service_date: "2026-02-15", received_date: "2026-02-16", total_billed_cents: 60006 }
              as: ClaimsExaminer
              captures: { cl2_id: $.data.id }
            - call: "POST /cob/claims/${cl2_id}/lines"
              payload: { line_number: 1, procedure_code: "A", billed_cents: 10001, allowed_cents: 8001, primary_paid_cents: 5001 }
              as: ClaimsExaminer
            - call: "POST /cob/claims/${cl2_id}/lines"
              payload: { line_number: 2, procedure_code: "B", billed_cents: 20002, allowed_cents: 15002, primary_paid_cents: 9001 }
              as: ClaimsExaminer
            - call: "POST /cob/claims/${cl2_id}/lines"
              payload: { line_number: 3, procedure_code: "C", billed_cents: 30003, allowed_cents: 25003, primary_paid_cents: 17001 }
              as: ClaimsExaminer
          trigger:
            - call: "POST /cob/claims/${cl2_id}/adjudicate"
              payload: {}
              as: ClaimsExaminer
          assert:
            - "Claim.${cl2_id}.total_paid_cents == 17003  # sum of per-line paid (3000+6001+8002)"
            - "Claim.${cl2_id}.total_allowed_cents == 48006"
            - "Claim.${cl2_id}.total_primary_paid_cents == 31003"

  # ==========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: claim_rework_cycle_paid_to_repaid
        grounds:
          - state_machines.Claim.PAID_to_REOPENED
          - state_machines.Claim.REOPENED_to_READJUDICATED
          - state_machines.Claim.READJUDICATED_to_REPAID
          - entities.Claim.fields.rework_cycle_count
        distinguishing_aspect: |
          Claim has a non-linear rework cycle: PAID → REOPENED → READJUDICATED
          → REPAID. The cycle can be traversed multiple times (rework_cycle_count
          increments each pass). Distinct from instance 2 — exercises cycle on
          Claim, not branching on PrimacyDetermination.
        test_recipe:
          setup:
            - "Full pipeline: member with OUR_PLAN + other coverage; PD finalized with OTHER primary; claim submitted and adjudicated as secondary, then PAID"
            - "New coverage discovered (or MSP finalized) → ClaimAdjustment created and applied → claim reopened → readjudicated → repaid"
          setup_api_calls:
            - call: "POST /cob/rule-configs"
              payload: { config_name: "v1", dependent_primacy_rule: "BIRTHDAY_RULE", msp_employer_size_threshold: 20, esrd_coordination_months: 30, retroactive_lookback_months: 12, recovery_window_days: 30, savings_period_length_days: 30 }
              as: PlatformAdmin
            - call: "POST /cob/providers"
              payload: { npi: "1111111111", legal_name: "P", tin: "T" }
              as: PlatformAdmin
              captures: { pid: $.data.id }
            - call: "POST /cob/members"
              payload: { member_external_id: "M", full_name: "C", date_of_birth: "1980-01-01", gender: "FEMALE", relation_to_subscriber: "SELF", employment_status: "ACTIVE", employer_size: 50 }
              as: EligibilityAnalyst
              captures: { mid: $.data.id }
            - call: "POST /cob/members/${mid}/coverages"
              payload: { payer_id: "OWN", plan_name: "Own", coverage_kind: "OUR_PLAN", subscriber_relationship: "SELF", policy_holder_dob: "1980-01-01", effective_from: "2026-01-01", verification_source: "ELIGIBILITY_MATCH" }
              as: COBAnalyst
              captures: { cown: $.data.id }
            - call: "POST /cob/members/${mid}/coverages/${cown}/verify"
              payload: {}
              as: COBAnalyst
            - call: "POST /cob/members/${mid}/coverages"
              payload: { payer_id: "G", plan_name: "Other", coverage_kind: "GROUP_HEALTH", subscriber_relationship: "SPOUSE", policy_holder_dob: "1978-01-01", policy_holder_gender: "MALE", effective_from: "2025-01-01", verification_source: "DATA_MATCH_CMS" }
              as: COBAnalyst
              captures: { cgrp: $.data.id }
            - call: "POST /cob/members/${mid}/coverages/${cgrp}/verify"
              payload: {}
              as: COBAnalyst
            - call: "GET /cob/members/${mid}"
              payload: {}
              as: COBAnalyst
              captures: { mv: $.data.version }
            - call: "POST /cob/members/${mid}/primacy-determinations"
              payload: { as_of_service_date: "2026-02-01", expected_member_version: "${mv}" }
              as: COBAnalyst
              captures: { pdid: $.data.id }
            - call: "POST /cob/members/${mid}/primacy-determinations/${pdid}/finalize"
              payload: {}
              as: COBAnalyst
            - call: "POST /cob/claims"
              payload: { member_id: "${mid}", provider_id: "${pid}", claim_external_id: "CX", service_date: "2026-02-10", received_date: "2026-02-12", total_billed_cents: 100000 }
              as: ClaimsExaminer
              captures: { clid: $.data.id }
            - call: "POST /cob/claims/${clid}/lines"
              payload: { line_number: 1, procedure_code: "X", billed_cents: 100000, allowed_cents: 80000, primary_paid_cents: 50000 }
              as: ClaimsExaminer
            - call: "POST /cob/claims/${clid}/adjudicate"
              payload: {}
              as: ClaimsExaminer
            - call: "POST /cob/claims/${clid}/pay"
              payload: {}
              as: ClaimsExaminer
            - call: "POST /cob/claims/${clid}/adjustments"
              payload: { cause: "NEW_COVERAGE_DISCOVERED", triggering_determination_id: "${pdid}" }
              as: ClaimsExaminer
              captures: { aid: $.data.id }
            - call: "POST /cob/claims/${clid}/adjustments/${aid}/apply"
              payload: {}
              as: ClaimsExaminer
          trigger:
            - call: "POST /cob/claims/${clid}/reopen"
              payload: {}
              as: RecoverySpecialist
            - call: "POST /cob/claims/${clid}/readjudicate"
              payload: {}
              as: ClaimsExaminer
            - call: "POST /cob/claims/${clid}/repay"
              payload: {}
              as: ClaimsExaminer
              captures: { cl_status: $.data.status, cl_rework: $.data.rework_cycle_count }
          assert:
            - "Claim.${clid}.status == REPAID"
            - "Claim.${clid}.rework_cycle_count == 1"

      - name: primacy_determination_supersede_branching
        grounds:
          - state_machines.PrimacyDetermination.FINALIZED_to_SUPERSEDED
          - state_machines.PrimacyDetermination.DRAFT_to_FINALIZED
        distinguishing_aspect: |
          PrimacyDetermination has a branching shape: DRAFT → FINALIZED, then
          FINALIZED → SUPERSEDED when a newer determination for the same
          service date finalizes. The SUPERSEDED transition is a fork from
          FINALIZED (an alternative to the "steady state"), with side effects
          (superseded_by_id link, downstream ClaimAdjustment auto-creation).
          Distinct from instance 1 — different entity, different shape
          (branching fork vs cyclic).
        test_recipe:
          setup:
            - "Member with two verified coverages; PD1 finalized as_of 2026-03-01"
            - "Then a new coverage is verified which changes the eligible set; PD2 drafted for same as_of date and finalized"
          setup_api_calls:
            - call: "POST /cob/rule-configs"
              payload: { config_name: "v1", dependent_primacy_rule: "BIRTHDAY_RULE", msp_employer_size_threshold: 20, esrd_coordination_months: 30, retroactive_lookback_months: 12, recovery_window_days: 30, savings_period_length_days: 30 }
              as: PlatformAdmin
            - call: "POST /cob/members"
              payload: { member_external_id: "MS", full_name: "Sup", date_of_birth: "1980-01-01", gender: "FEMALE", relation_to_subscriber: "SELF", employment_status: "ACTIVE", employer_size: 50 }
              as: EligibilityAnalyst
              captures: { mid: $.data.id }
            - call: "POST /cob/members/${mid}/coverages"
              payload: { payer_id: "OWN", plan_name: "Own", coverage_kind: "OUR_PLAN", subscriber_relationship: "SELF", policy_holder_dob: "1980-01-01", effective_from: "2026-01-01", verification_source: "ELIGIBILITY_MATCH" }
              as: COBAnalyst
              captures: { cown: $.data.id }
            - call: "POST /cob/members/${mid}/coverages/${cown}/verify"
              payload: {}
              as: COBAnalyst
            - call: "POST /cob/members/${mid}/coverages"
              payload: { payer_id: "A", plan_name: "A", coverage_kind: "GROUP_HEALTH", subscriber_relationship: "SPOUSE", policy_holder_dob: "1978-01-01", policy_holder_gender: "MALE", effective_from: "2025-01-01", verification_source: "DATA_MATCH_CMS" }
              as: COBAnalyst
              captures: { ca: $.data.id }
            - call: "POST /cob/members/${mid}/coverages/${ca}/verify"
              payload: {}
              as: COBAnalyst
            - call: "GET /cob/members/${mid}"
              payload: {}
              as: COBAnalyst
              captures: { mv: $.data.version }
            - call: "POST /cob/members/${mid}/primacy-determinations"
              payload: { as_of_service_date: "2026-03-01", expected_member_version: "${mv}" }
              as: COBAnalyst
              captures: { pd1: $.data.id }
            - call: "POST /cob/members/${mid}/primacy-determinations/${pd1}/finalize"
              payload: {}
              as: COBAnalyst
          trigger:
            - call: "GET /cob/members/${mid}"
              payload: {}
              as: COBAnalyst
              captures: { mv2: $.data.version }
            - call: "POST /cob/members/${mid}/primacy-determinations"
              payload: { as_of_service_date: "2026-03-01", expected_member_version: "${mv2}" }
              as: COBAnalyst
              captures: { pd2: $.data.id }
            - call: "POST /cob/members/${mid}/primacy-determinations/${pd2}/finalize"
              payload: {}
              as: COBAnalyst
          assert:
            - "PrimacyDetermination.${pd1}.status == SUPERSEDED"
            - "PrimacyDetermination.${pd1}.superseded_by_id == ${pd2}"
            - "PrimacyDetermination.${pd2}.status == FINALIZED"

  # ==========================================================================
  # Rule 4 — transitive_cascade (different triggers, depth >= 3 and >= 2)
  # ==========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: msp_void_cascade_to_claim_reopen
        grounds:
          - state_machines.MSPQuestionnaire.SUBMITTED_to_VOIDED
          - state_machines.PrimacyDetermination.FINALIZED_to_SUPERSEDED
          - state_machines.ClaimAdjustment
          - state_machines.Claim.PAID_to_REOPENED
        distinguishing_aspect: |
          Depth-3 cascade: voiding an MSPQuestionnaire (1) supersedes the
          FINALIZED PrimacyDetermination that referenced it, which (2)
          auto-creates a ClaimAdjustment for each claim using that
          determination, which (3) triggers a downstream claim reopen and
          reprocessing. Originates from MSPQuestionnaire void — distinct
          trigger from instance 2.
        test_recipe:
          setup:
            - "Member with MEDICARE coverage + GROUP_HEALTH; MSPQuestionnaire submitted and adjudicated → MEDICARE_PRIMARY"
            - "PrimacyDetermination finalized referencing the questionnaire"
            - "Claim submitted, adjudicated, paid"
          setup_api_calls:
            - call: "POST /cob/rule-configs"
              payload: { config_name: "v1", dependent_primacy_rule: "BIRTHDAY_RULE", msp_employer_size_threshold: 20, esrd_coordination_months: 30, retroactive_lookback_months: 12, recovery_window_days: 30, savings_period_length_days: 30 }
              as: PlatformAdmin
            - call: "POST /cob/providers"
              payload: { npi: "2222222222", legal_name: "P", tin: "T" }
              as: PlatformAdmin
              captures: { pid: $.data.id }
            - call: "POST /cob/members"
              payload: { member_external_id: "MM", full_name: "Medicare M", date_of_birth: "1945-01-01", gender: "FEMALE", relation_to_subscriber: "SELF", employment_status: "RETIRED", employer_size: 10, medicare_entitlement_reason: "AGE" }
              as: EligibilityAnalyst
              captures: { mid: $.data.id }
            - call: "POST /cob/members/${mid}/coverages"
              payload: { payer_id: "OWN", plan_name: "Own", coverage_kind: "OUR_PLAN", subscriber_relationship: "SELF", policy_holder_dob: "1945-01-01", effective_from: "2026-01-01", verification_source: "ELIGIBILITY_MATCH" }
              as: COBAnalyst
              captures: { cown: $.data.id }
            - call: "POST /cob/members/${mid}/coverages/${cown}/verify"
              payload: {}
              as: COBAnalyst
            - call: "POST /cob/members/${mid}/coverages"
              payload: { payer_id: "MCR", plan_name: "Medicare A", coverage_kind: "MEDICARE_PART_A", subscriber_relationship: "SELF", policy_holder_dob: "1945-01-01", effective_from: "2010-01-01", verification_source: "DATA_MATCH_CMS" }
              as: COBAnalyst
              captures: { cmcr: $.data.id }
            - call: "POST /cob/members/${mid}/coverages/${cmcr}/verify"
              payload: {}
              as: COBAnalyst
            - call: "POST /cob/members/${mid}/msp-questionnaires"
              payload: { respondent_role: "SELF", has_employer_group_health: false, employer_size: 0, disability_flag: false, esrd_flag: false }
              as: COBAnalyst
              captures: { qid: $.data.id }
            - call: "POST /cob/members/${mid}/msp-questionnaires/${qid}/adjudicate"
              payload: {}
              as: COBAnalyst
            - call: "GET /cob/members/${mid}"
              payload: {}
              as: COBAnalyst
              captures: { mv: $.data.version }
            - call: "POST /cob/members/${mid}/primacy-determinations"
              payload: { as_of_service_date: "2026-02-01", msp_questionnaire_id: "${qid}", expected_member_version: "${mv}" }
              as: COBAnalyst
              captures: { pdid: $.data.id }
            - call: "POST /cob/members/${mid}/primacy-determinations/${pdid}/finalize"
              payload: {}
              as: COBAnalyst
            - call: "POST /cob/claims"
              payload: { member_id: "${mid}", provider_id: "${pid}", claim_external_id: "CM", service_date: "2026-02-10", received_date: "2026-02-12", total_billed_cents: 50000 }
              as: ClaimsExaminer
              captures: { clid: $.data.id }
            - call: "POST /cob/claims/${clid}/lines"
              payload: { line_number: 1, procedure_code: "X", billed_cents: 50000, allowed_cents: 40000, primary_paid_cents: 30000 }
              as: ClaimsExaminer
            - call: "POST /cob/claims/${clid}/adjudicate"
              payload: {}
              as: ClaimsExaminer
            - call: "POST /cob/claims/${clid}/pay"
              payload: {}
              as: ClaimsExaminer
          trigger:
            - call: "POST /cob/members/${mid}/msp-questionnaires/${qid}/void"
              payload: {}
              as: COBAnalyst
          assert:
            - "MSPQuestionnaire.${qid}.status == VOIDED"
            - "PrimacyDetermination.${pdid}.status == SUPERSEDED  # cascade hop 1→2"
            - "At least one ClaimAdjustment exists for claim ${clid} with cause=PRIMACY_DETERMINATION_SUPERSEDED  # cascade hop 2→3"

      - name: coverage_verify_cascade_to_lead_and_member
        grounds:
          - state_machines.Coverage.PENDING_VERIFICATION_to_VERIFIED
          - state_machines.OtherCoverageLead.RECEIVED_to_VERIFIED_COVERAGE
          - entities.Member.fields.other_coverage_count
        distinguishing_aspect: |
          Depth-2 cascade: Coverage verify (1) recomputes Member.other_coverage_count,
          which (2) transitions the linked OtherCoverageLead to VERIFIED_COVERAGE.
          Different trigger from instance 1 (Coverage verify vs MSP void) and
          depth 2 (vs depth 3 in instance 1).
        test_recipe:
          setup:
            - "Member M, OtherCoverageLead L (source=DATA_MATCH_CMS, RECEIVED), Coverage C registered with verification_source=DATA_MATCH_CMS (still PENDING)"
          setup_api_calls:
            - call: "POST /cob/rule-configs"
              payload: { config_name: "v1", dependent_primacy_rule: "BIRTHDAY_RULE", msp_employer_size_threshold: 20, esrd_coordination_months: 30, retroactive_lookback_months: 12, recovery_window_days: 30, savings_period_length_days: 30 }
              as: PlatformAdmin
            - call: "POST /cob/members"
              payload: { member_external_id: "MC", full_name: "Cascade", date_of_birth: "1980-01-01", gender: "FEMALE", relation_to_subscriber: "SELF", employment_status: "ACTIVE", employer_size: 50 }
              as: EligibilityAnalyst
              captures: { mid: $.data.id }
            - call: "POST /cob/members/${mid}/other-coverage-leads"
              payload: { source: "DATA_MATCH_CMS", raw_payload: "cms row" }
              as: COBAnalyst
              captures: { lid: $.data.id }
            - call: "POST /cob/members/${mid}/coverages"
              payload: { payer_id: "X", plan_name: "X", coverage_kind: "GROUP_HEALTH", subscriber_relationship: "SPOUSE", policy_holder_dob: "1978-01-01", effective_from: "2026-01-01", verification_source: "DATA_MATCH_CMS" }
              as: COBAnalyst
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /cob/members/${mid}/coverages/${cid}/verify"
              payload: {}
              as: COBAnalyst
          assert:
            - "Coverage.${cid}.verification_status == VERIFIED"
            - "OtherCoverageLead.${lid}.disposition == VERIFIED_COVERAGE  # cascade hop 1→2"
            - "Member.${mid}.other_coverage_count == 1  # derived field recomputed"

  # ==========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ==========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_on_finalize
        grounds:
          - validations[priority=4]
          - validations[priority=8]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_MSP_QUESTIONNAIRE_REQUIRED]
        distinguishing_aspect: |
          Pair (state, business_safety): a finalize call against a
          PrimacyDetermination whose member has a MEDICARE coverage but no
          ADJUDICATED MSPQuestionnaire, AND the determination is already
          FINALIZED (i.e., state violation). The state error (priority 4)
          must win over MSP safety error (priority 8). Different error-
          category pair from instance 2.
        test_recipe:
          setup:
            - "Member with OUR_PLAN + MEDICARE_PART_A coverages verified (no MSP questionnaire)"
            - "PrimacyDetermination PD drafted but never finalized"
            - "Attempt 1: finalize PD (should succeed? No — MSP safety would fail; but state passes — so first finalize actually fails with ERR_MSP_QUESTIONNAIRE_REQUIRED)"
            - "Actually setup: We need a scenario where BOTH errors fire — impossible on first call. Restage: PD is already FINALIZED via a path that bypassed MSP (e.g., before Medicare coverage verified). Then MEDICARE coverage verified. Then re-finalize same PD (idempotent re-finalize — would be INVALID_STATE) AND also MSP missing."
          setup_api_calls:
            - call: "POST /cob/rule-configs"
              payload: { config_name: "v1", dependent_primacy_rule: "BIRTHDAY_RULE", msp_employer_size_threshold: 20, esrd_coordination_months: 30, retroactive_lookback_months: 12, recovery_window_days: 30, savings_period_length_days: 30 }
              as: PlatformAdmin
            - call: "POST /cob/members"
              payload: { member_external_id: "MF", full_name: "F", date_of_birth: "1950-01-01", gender: "FEMALE", relation_to_subscriber: "SELF", employment_status: "RETIRED", employer_size: 5, medicare_entitlement_reason: "AGE" }
              as: EligibilityAnalyst
              captures: { mid: $.data.id }
            - call: "POST /cob/members/${mid}/coverages"
              payload: { payer_id: "OWN", plan_name: "Own", coverage_kind: "OUR_PLAN", subscriber_relationship: "SELF", policy_holder_dob: "1950-01-01", effective_from: "2026-01-01", verification_source: "ELIGIBILITY_MATCH" }
              as: COBAnalyst
              captures: { cown: $.data.id }
            - call: "POST /cob/members/${mid}/coverages/${cown}/verify"
              payload: {}
              as: COBAnalyst
            - call: "GET /cob/members/${mid}"
              payload: {}
              as: COBAnalyst
              captures: { mv: $.data.version }
            - call: "POST /cob/members/${mid}/primacy-determinations"
              payload: { as_of_service_date: "2026-02-01", expected_member_version: "${mv}" }
              as: COBAnalyst
              captures: { pdid: $.data.id }
            - call: "POST /cob/members/${mid}/primacy-determinations/${pdid}/finalize"
              payload: {}
              as: COBAnalyst
            - call: "POST /cob/members/${mid}/coverages"
              payload: { payer_id: "MCR", plan_name: "MCR", coverage_kind: "MEDICARE_PART_A", subscriber_relationship: "SELF", policy_holder_dob: "1950-01-01", effective_from: "2010-01-01", verification_source: "DATA_MATCH_CMS" }
              as: COBAnalyst
              captures: { cmcr: $.data.id }
            - call: "POST /cob/members/${mid}/coverages/${cmcr}/verify"
              payload: {}
              as: COBAnalyst
          trigger:
            - call: "POST /cob/members/${mid}/primacy-determinations/${pdid}/finalize"
              payload: {}
              as: COBAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE  # state (PD already FINALIZED) outranks MSP safety"
            - "http_status == 409"

      - name: existence_vs_business_referential_on_finalize
        grounds:
          - validations[priority=3]
          - validations[priority=7]
          - errors[ERR_NOT_FOUND]
          - errors[ERR_INVALID_DETERMINATION_REFERENCE]
        distinguishing_aspect: |
          Pair (existence, business_referential): finalize a determination
          referencing an msp_questionnaire_id that does not exist (existence)
          AND a coverage id that exists but is not VERIFIED (referential).
          Existence error wins. Different pair from instance 1.
        test_recipe:
          setup:
            - "Member with OUR_PLAN coverage verified; PD drafted"
            - "A second coverage C_PEND exists in PENDING_VERIFICATION (referential violation if referenced)"
            - "Trigger finalize with msp_questionnaire_id pointing to non-existent id (existence violation)"
          setup_api_calls:
            - call: "POST /cob/rule-configs"
              payload: { config_name: "v1", dependent_primacy_rule: "BIRTHDAY_RULE", msp_employer_size_threshold: 20, esrd_coordination_months: 30, retroactive_lookback_months: 12, recovery_window_days: 30, savings_period_length_days: 30 }
              as: PlatformAdmin
            - call: "POST /cob/members"
              payload: { member_external_id: "MX", full_name: "X", date_of_birth: "1980-01-01", gender: "FEMALE", relation_to_subscriber: "SELF", employment_status: "ACTIVE", employer_size: 50 }
              as: EligibilityAnalyst
              captures: { mid: $.data.id }
            - call: "POST /cob/members/${mid}/coverages"
              payload: { payer_id: "OWN", plan_name: "Own", coverage_kind: "OUR_PLAN", subscriber_relationship: "SELF", policy_holder_dob: "1980-01-01", effective_from: "2026-01-01", verification_source: "ELIGIBILITY_MATCH" }
              as: COBAnalyst
              captures: { cown: $.data.id }
            - call: "POST /cob/members/${mid}/coverages/${cown}/verify"
              payload: {}
              as: COBAnalyst
            - call: "GET /cob/members/${mid}"
              payload: {}
              as: COBAnalyst
              captures: { mv: $.data.version }
            - call: "POST /cob/members/${mid}/primacy-determinations"
              payload: { as_of_service_date: "2026-02-01", expected_member_version: "${mv}" }
              as: COBAnalyst
              captures: { pdid: $.data.id }
            - call: "POST /cob/members/${mid}/coverages"
              payload: { payer_id: "P", plan_name: "Pend", coverage_kind: "GROUP_HEALTH", subscriber_relationship: "SPOUSE", policy_holder_dob: "1978-01-01", effective_from: "2026-01-01", verification_source: "DATA_MATCH_CMS" }
              as: COBAnalyst
              captures: { cp: $.data.id }
          trigger:
            - call: "POST /cob/members/${mid}/primacy-determinations/${pdid}/finalize"
              payload: { msp_questionnaire_id: "non-existent-id" }
              as: COBAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"
            - "http_status == 404"

  # ==========================================================================
  # Rule 6 — boundary_precision_check (different metrics/endpoints)
  # ==========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: esrd_window_exact_boundary
        grounds:
          - calculations.msp_determination
          - entities.COBRuleConfig.fields.esrd_coordination_months
          - errors[ERR_NOT_PAST_DUE]
        distinguishing_aspect: |
          Boundary on ESRD coordination month count: current clock exactly
          equal to esrd_onset_date + esrd_coordination_months. Rule 2 uses
          strict > (window still active when strictly greater); rule 3 uses
          <= (window exhausted when equal). At the exact boundary instant
          (onset + months == clock), rule 3 fires and Medicare becomes
          primary. Distinct metric (time/months) from instance 2 (currency).
        test_recipe:
          setup:
            - "Config esrd_coordination_months=30; clock set to 2028-07-15 (exactly 30 months after 2026-01-15)"
            - "Member with ESRD onset 2026-01-15; questionnaire esrd_flag=true"
          setup_api_calls:
            - call: "POST /cob/rule-configs"
              payload: { config_name: "v1", dependent_primacy_rule: "BIRTHDAY_RULE", msp_employer_size_threshold: 20, esrd_coordination_months: 30, retroactive_lookback_months: 12, recovery_window_days: 30, savings_period_length_days: 30 }
              as: PlatformAdmin
            - call: "POST /cob/_clock/set_current_utc"
              payload: { to_iso8601: "2028-07-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cob/members"
              payload: { member_external_id: "EB", full_name: "Edge", date_of_birth: "1950-01-01", gender: "MALE", relation_to_subscriber: "SELF", employment_status: "ACTIVE", employer_size: 30, medicare_entitlement_reason: "ESRD_AND_AGE", esrd_onset_date: "2026-01-15" }
              as: EligibilityAnalyst
              captures: { mid: $.data.id }
            - call: "POST /cob/members/${mid}/msp-questionnaires"
              payload: { respondent_role: "SELF", has_employer_group_health: true, employer_size: 30, disability_flag: false, esrd_flag: true, esrd_onset_date: "2026-01-15" }
              as: COBAnalyst
              captures: { qid: $.data.id }
          trigger:
            - call: "POST /cob/members/${mid}/msp-questionnaires/${qid}/adjudicate"
              payload: {}
              as: COBAnalyst
              captures: { msp_result: $.data.msp_result }
          assert:
            - "MSPQuestionnaire.${qid}.msp_result == MEDICARE_PRIMARY  # rule 3 fires: onset+30mo == clock, NOT >"

      - name: overrecovery_at_exact_remaining_balance
        grounds:
          - validations[priority=10]
          - errors[ERR_OVERRECOVERY]
          - entities.RecoveryRequest.fields.amount_recovered_cents
        distinguishing_aspect: |
          Boundary on amount_recovered vs amount_cents: posting a Reimbursement
          whose amount_cents exactly equals (amount_cents - amount_recovered_cents)
          must succeed (zero-remaining boundary); amount+1 must fail with
          ERR_OVERRECOVERY. Distinct metric (currency) and distinct endpoint
          (reimbursements) from instance 1 (MSP adjudicate).
        test_recipe:
          setup:
            - "Claim fully processed; recovery request issued for 10000 cents; one reimbursement of 6000 posted (recovered=6000, remaining=4000)"
            - "Boundary test: post reimbursement of exactly 4000 (should succeed, fully recover); then attempt post of 1 cent (should fail)"
          setup_api_calls:
            - call: "POST /cob/rule-configs"
              payload: { config_name: "v1", dependent_primacy_rule: "BIRTHDAY_RULE", msp_employer_size_threshold: 20, esrd_coordination_months: 30, retroactive_lookback_months: 12, recovery_window_days: 30, savings_period_length_days: 30 }
              as: PlatformAdmin
            - call: "POST /cob/providers"
              payload: { npi: "3333333333", legal_name: "P", tin: "T" }
              as: PlatformAdmin
              captures: { pid: $.data.id }
            - call: "POST /cob/members"
              payload: { member_external_id: "MB", full_name: "B", date_of_birth: "1980-01-01", gender: "FEMALE", relation_to_subscriber: "SELF", employment_status: "ACTIVE", employer_size: 50 }
              as: EligibilityAnalyst
              captures: { mid: $.data.id }
            - call: "POST /cob/members/${mid}/coverages"
              payload: { payer_id: "OWN", plan_name: "Own", coverage_kind: "OUR_PLAN", subscriber_relationship: "SELF", policy_holder_dob: "1980-01-01", effective_from: "2026-01-01", verification_source: "ELIGIBILITY_MATCH" }
              as: COBAnalyst
              captures: { cown: $.data.id }
            - call: "POST /cob/members/${mid}/coverages/${cown}/verify"
              payload: {}
              as: COBAnalyst
            - call: "POST /cob/members/${mid}/coverages"
              payload: { payer_id: "G", plan_name: "G", coverage_kind: "GROUP_HEALTH", subscriber_relationship: "SPOUSE", policy_holder_dob: "1978-01-01", policy_holder_gender: "MALE", effective_from: "2025-01-01", verification_source: "DATA_MATCH_CMS" }
              as: COBAnalyst
              captures: { cg: $.data.id }
            - call: "POST /cob/members/${mid}/coverages/${cg}/verify"
              payload: {}
              as: COBAnalyst
            - call: "GET /cob/members/${mid}"
              payload: {}
              as: COBAnalyst
              captures: { mv: $.data.version }
            - call: "POST /cob/members/${mid}/primacy-determinations"
