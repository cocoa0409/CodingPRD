              payload: { vehicle_id: "${veh_id}", pack_id: "${pack_id}", technician_id: "${tech_a_id}", variant: "TELEMATICS_FLEET", expected_vehicle_version: "${veh_ver2}", module_fault_positions: [1, 2, 3, 4, 5] }
              as: ServiceTechnician
