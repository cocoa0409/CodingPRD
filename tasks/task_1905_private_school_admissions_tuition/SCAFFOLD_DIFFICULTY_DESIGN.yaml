            - { call: "POST /admissions/aid-applications/${aidA}/finalize-award", payload: {}, as: FinancialAidOfficer, as_user_id: "fao-2" }
            - { call: "POST /admissions/evaluations", payload: { application_id: "${appA}", kind: "TEST", scheduled_start: "2026-10-10T09:00:00Z", scheduled_end: "2026-10-10T10:00:00Z", test_session_id: "${tss}" }, as: AdmissionOfficer, captures: { evAT: $.data.id } }
            - { call: "POST /admissions/evaluations", payload: { application_id: "${appA}", kind: "INTERVIEW", scheduled_start: "2026-10-12T10:00:00Z", scheduled_end: "2026-10-12T11:00:00Z", interviewer_id: "int-a" }, as: AdmissionOfficer, captures: { evAI: $.data.id } }
            - { call: "POST /admissions/evaluations/${evAT}/score", payload: { score: 100 }, as: AdmissionOfficer }
            - { call: "POST /admissions/evaluations/${evAI}/score", payload: { score: 100 }, as: AdmissionOfficer }
            - { call: "POST /admissions/applicants", payload: { family_id: "fam-b", first_name: "Ben", last_name: "Bell", date_of_birth: "2013-06-01" }, as: Parent, as_user_id: "fam-b", captures: { aplB: $.data.id } }
            - { call: "POST /admissions/applications", payload: { applicant_id: "${aplB}", cycle_id: "${cyc}", grade_section_id: "${sec}", round: "EARLY" }, as: Parent, as_user_id: "fam-b", captures: { appB: $.data.id } }
            - { call: "POST /admissions/applications/${appB}/submit", payload: {}, as: Parent, as_user_id: "fam-b" }
