          - state_machines.StateRegistration.NOT_REQUIRED_to_REGISTRATION_REQUIRED
          - calculations.group_compliance_posture
          - state_machines.StateFiling.APPROVED_to_IN_REVIEW
          - entities.TaxpayerGroup.fields.open_registration_obligations
