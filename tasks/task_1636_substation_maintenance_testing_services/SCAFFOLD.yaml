    input: [outage_window_id, expected_outage_window_version]
    output: WorkOrder
    side_effects: ["transition DRAFT -> SCHEDULED", "window.committed_hours += estimated_hours", "increments OutageWindow.version by 1"]
  - method: POST
    path: "/work-orders/{id}/start"
    description: "Start a scheduled work order (assignee only; window de-energized)"
    roles: [Technician]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["transition SCHEDULED -> IN_PROGRESS"]
  - method: POST
    path: "/work-orders/{id}/complete"
    description: "Complete an in-progress work order with labor and parts lines; computes cost rollup"
    roles: [Technician]
    code: 200
    input: [labor_lines, parts_lines]
    output: WorkOrder
    side_effects: ["transition IN_PROGRESS -> COMPLETED", "cost_subtotal/mobilization_fee/total_cost computed", "Defect WORK_ORDERED -> RESOLVED", "Asset.condition_score recomputed"]
  - method: POST
    path: "/work-orders/{id}/verify"
    description: "Verify a completed work order; closes the defect and refreshes the maintenance baseline"
    roles: [OperationsManager]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["transition COMPLETED -> VERIFIED", "Defect RESOLVED -> VERIFIED", "Asset.last_maintenance_completed_at = clock", "Asset.next_due_date recomputed"]
  - method: POST
    path: "/work-orders/{id}/cancel"
    description: "Cancel a draft/scheduled work order (compensates window hours and defect state)"
    roles: [OperationsManager]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["transition -> CANCELLED", "window.committed_hours -= estimated_hours when scheduled", "Defect WORK_ORDERED -> OPEN"]
  - method: POST
    path: "/spare-units"
    description: "Register a spare transformer or mobile substation"
    roles: [OperationsManager]
    code: 201
    input: [unit_type, rating_mva, voltage_class_kv, impedance_pct, home_location]
    output: SpareUnit
    side_effects: []
  - method: GET
    path: "/spare-units"
    description: "List spare units with filters"
    roles: [OperationsManager, OutageCoordinator, SwitchingSupervisor, Technician, ComplianceOfficer]
    code: 200
    input: ["unit_type?", "status?", "limit?", "offset?"]
    output: "SpareUnit[]"
    side_effects: []
  - method: GET
    path: "/spare-units/{id}"
    description: "Get one spare unit"
    roles: [OperationsManager, OutageCoordinator, SwitchingSupervisor, Technician, ComplianceOfficer]
    code: 200
    input: []
    output: SpareUnit
    side_effects: []
  - method: POST
    path: "/spare-units/{id}/decommission"
    description: "Decommission an available spare unit (blocked while ACTIVE reservations exist)"
    roles: [OperationsManager]
    code: 200
    input: []
    output: SpareUnit
    side_effects: ["transition AVAILABLE -> DECOMMISSIONED"]
  - method: GET
    path: "/spare-units/{id}/reservations"
    description: "List reservations of a spare unit"
    roles: [OperationsManager, OutageCoordinator, SwitchingSupervisor, Technician, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "SpareReservation[]"
    side_effects: []
  - method: GET
    path: "/spare-reservations/{id}"
    description: "Get one spare reservation"
    roles: [OperationsManager, OutageCoordinator, SwitchingSupervisor, Technician, ComplianceOfficer]
    code: 200
    input: []
    output: SpareReservation
    side_effects: []
  - method: POST
    path: "/spare-reservations"
    description: "Reserve a spare unit for a window; spare_unit_id omitted triggers selector per calculations.spare_selection_score"
    roles: [OutageCoordinator]
    code: 201
    input: [unit_type, required_mva, required_voltage_kv, start_ts, end_ts, "spare_unit_id?", "preferred_impedance_pct?", "site_location?", "work_order_id?"]
    output: SpareReservation
    side_effects: ["unit AVAILABLE -> RESERVED", "overlap checked under half-open semantics"]
  - method: GET
    path: "/spare-reservations"
    description: "List spare reservations with filters"
    roles: [OperationsManager, OutageCoordinator, SwitchingSupervisor, Technician, ComplianceOfficer]
    code: 200
    input: ["spare_unit_id?", "work_order_id?", "status?", "limit?", "offset?"]
    output: "SpareReservation[]"
    side_effects: []
  - method: POST
    path: "/spare-reservations/{id}/cancel"
    description: "Cancel an active (not deployed) reservation"
    roles: [OutageCoordinator]
    code: 200
    input: []
    output: SpareReservation
    side_effects: ["transition ACTIVE -> CANCELLED", "unit status recomputed"]
  - method: POST
    path: "/spare-reservations/{id}/deploy"
    description: "Deploy the reserved unit (clock must be within the reservation window)"
    roles: [OutageCoordinator]
    code: 200
    input: []
    output: SpareReservation
    side_effects: ["unit RESERVED -> DEPLOYED"]
  - method: POST
    path: "/spare-reservations/{id}/return"
    description: "Return a deployed unit; fulfils the reservation"
    roles: [OutageCoordinator]
    code: 200
    input: []
    output: SpareReservation
    side_effects: ["transition ACTIVE -> FULFILLED", "unit DEPLOYED -> AVAILABLE/RESERVED"]
  - method: POST
    path: "/relay-settings"
    description: "Draft a relay setting document (author = acting Technician; asset must be class RELAY)"
    roles: [Technician]
    code: 201
    input: [asset_id, setting_group, pickup_a, time_dial, curve]
    output: RelaySetting
    side_effects: ["author_technician_id = X-User-ID"]
  - method: GET
    path: "/relay-settings"
    description: "List relay settings with filters"
    roles: [OperationsManager, OutageCoordinator, SwitchingSupervisor, Technician, ComplianceOfficer]
    code: 200
    input: ["asset_id?", "author_technician_id?", "verified_by_technician_id?", "supersedes_setting_id?", "status?", "setting_group?", "limit?", "offset?"]
    output: "RelaySetting[]"
    side_effects: []
  - method: GET
    path: "/relay-settings/{id}"
    description: "Get one relay setting"
    roles: [OperationsManager, OutageCoordinator, SwitchingSupervisor, Technician, ComplianceOfficer]
    code: 200
    input: []
    output: RelaySetting
    side_effects: []
  - method: POST
    path: "/relay-settings/{id}/submit"
    description: "Submit a draft/rejected setting for verification (author only)"
    roles: [Technician]
    code: 200
    input: []
    output: RelaySetting
    side_effects: ["transition DRAFT/REJECTED -> SUBMITTED"]
  - method: POST
    path: "/relay-settings/{id}/verify"
    description: "Verify a submitted setting (NETA_LEVEL_4, != author)"
    roles: [Technician]
    code: 200
    input: []
    output: RelaySetting
    side_effects: ["transition SUBMITTED -> VERIFIED", "verified_by_technician_id stamped"]
  - method: POST
    path: "/relay-settings/{id}/reject"
    description: "Reject a submitted setting (NETA_LEVEL_4, != author; note required)"
    roles: [Technician]
    code: 200
    input: [rejection_note]
    output: RelaySetting
    side_effects: ["transition SUBMITTED -> REJECTED"]
  - method: POST
    path: "/relay-settings/{id}/activate"
    description: "Activate a verified setting (NETA_LEVEL_4; OCC on asset version; coordination margin; supersedes prior ACTIVE)"
    roles: [Technician]
    code: 200
    input: [expected_asset_version]
    output: RelaySetting
    side_effects: ["transition VERIFIED -> ACTIVE", "prior ACTIVE setting -> SUPERSEDED and supersedes_setting_id linked", "increments Asset.version by 1"]
  - method: POST
    path: "/technicians"
    description: "Register a technician"
    roles: [OperationsManager]
    code: 201
    input: [full_name, employee_code]
    output: Technician
    side_effects: []
  - method: GET
    path: "/technicians"
    description: "List technicians"
    roles: [OperationsManager, OutageCoordinator, SwitchingSupervisor, Technician, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Technician[]"
    side_effects: []
  - method: GET
    path: "/technicians/{id}"
    description: "Get one technician"
    roles: [OperationsManager, OutageCoordinator, SwitchingSupervisor, Technician, ComplianceOfficer]
    code: 200
    input: []
    output: Technician
    side_effects: []
  - method: POST
    path: "/technicians/{id}/certifications"
    description: "Grant a certification to a technician"
    roles: [OperationsManager]
    code: 201
    input: [cert_type, issued_at, expires_at]
    output: TechnicianCertification
    side_effects: []
  - method: GET
    path: "/technicians/{id}/certifications"
    description: "List a technician's certifications"
    roles: [OperationsManager, OutageCoordinator, SwitchingSupervisor, Technician, ComplianceOfficer]
    code: 200
    input: ["cert_type?", "status?", "limit?", "offset?"]
    output: "TechnicianCertification[]"
    side_effects: []
  - method: POST
    path: "/certifications/{id}/revoke"
    description: "Revoke a certification"
    roles: [OperationsManager]
    code: 200
    input: []
    output: TechnicianCertification
    side_effects: ["revoked_at = clock", "status becomes REVOKED"]
  - method: POST
    path: "/substations/{sid}/environmental-inspections"
    description: "File an environmental (oil containment) inspection for a substation"
    roles: [ComplianceOfficer]
    code: 201
    input: [inspection_date, largest_vessel_gal, containment_capacity_gal, rainfall_freeboard_gal, method]
    output: EnvironmentalInspection
    side_effects: []
  - method: GET
    path: "/environmental-inspections"
    description: "List environmental inspections"
    roles: [OperationsManager, OutageCoordinator, SwitchingSupervisor, Technician, ComplianceOfficer]
    code: 200
    input: ["substation_id?", "status?", "limit?", "offset?"]
    output: "EnvironmentalInspection[]"
    side_effects: []
  - method: GET
    path: "/environmental-inspections/{id}"
    description: "Get one environmental inspection"
    roles: [OperationsManager, OutageCoordinator, SwitchingSupervisor, Technician, ComplianceOfficer]
    code: 200
    input: []
    output: EnvironmentalInspection
    side_effects: []
  - method: POST
    path: "/environmental-inspections/{id}/complete"
    description: "Complete an inspection; computes required capacity, compliance, and next due date"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: EnvironmentalInspection
    side_effects: ["transition DRAFT -> COMPLETED", "required_capacity_gal/compliance/next_inspection_due computed"]
  - method: POST
    path: "/environmental-inspections/{id}/close"
    description: "Close a completed inspection (remediation_note required when DEFICIENT)"
    roles: [ComplianceOfficer]
    code: 200
    input: ["remediation_note?"]
    output: EnvironmentalInspection
    side_effects: ["transition COMPLETED -> CLOSED"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Acting role not permitted for this endpoint" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body: missing required field, bad type, invalid enum member, end_ts <= start_ts, non-positive quantities, or inconsistent cross-references" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body-supplied FK does not resolve" }
  - { id: ERR_POLICY_NOT_FOUND, http: 404, condition: "No AssetClassPolicy exists for the asset_class on POST /assets" }
  - { id: ERR_DUPLICATE_KEY, http: 409, condition: "Uniqueness violated: substation code, policy asset_class, technician employee_code, or step sequence_no within a window" }
  - { id: ERR_STATE_TRANSITION, http: 409, condition: "Current entity state does not permit the requested transition (including terminal-state lockdown)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: expected_<parent>_version does not match the parent's current version" }
  - { id: ERR_CERTIFICATION_REQUIRED, http: 403, condition: "Acting technician lacks the required ACTIVE certification level for the operation" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same operator attempting both sides of a segregated step (approve own request, verify own execution, verify own relay setting, or non-owner submit/start)" }
  - { id: ERR_OPEN_CRITICAL_DEFECT, http: 422, condition: "Outage create/approve while the asset has a C1 defect in {OPEN, WORK_ORDERED, DEFERRED}" }
  - { id: ERR_INTERVAL_IN_PAST, http: 422, condition: "Interval start (or deferred_until) not in the future relative to the logical clock" }
  - { id: ERR_OUTSIDE_WINDOW, http: 422, condition: "Clock-gated action attempted outside [start_ts, end_ts)" }
  - { id: ERR_OUTAGE_WINDOW_CONFLICT, http: 409, condition: "Outage window overlaps another non-terminal window of the same asset or violates the 24h buffer rule" }
  - { id: ERR_SPARE_RESERVATION_CONFLICT, http: 409, condition: "Spare reservation overlaps an existing ACTIVE reservation of the same unit (half-open adjacency allowed)" }
  - { id: ERR_NO_COMPATIBLE_SPARE, http: 422, condition: "Selector found no eligible SpareUnit" }
  - { id: ERR_STEP_ORDER_VIOLATION, http: 409, condition: "Executing a switching step before all lower-sequence sibling steps are VERIFIED" }
  - { id: ERR_STEPS_NOT_VERIFIED, http: 409, condition: "Clearing a window while any switching step is not VERIFIED" }
  - { id: ERR_OUTAGE_NEEDS_REVALIDATION, http: 409, condition: "Approve/begin-switching while needs_revalidation is true" }
  - { id: ERR_DEFERRAL_LIMIT_EXCEEDED, http: 422, condition: "Deferral attempted when deferral_count == 2" }
  - { id: ERR_ASSET_NOT_IN_SERVICE, http: 409, condition: "Relay setting activation while the asset is not IN_SERVICE" }
  - { id: ERR_RELAY_COORDINATION_VIOLATION, http: 422, condition: "Upstream ACTIVE setting pickup below 1.3x the activating setting's pickup" }
  - { id: ERR_ASSET_DECOMMISSIONED, http: 422, condition: "Operation references a DECOMMISSIONED asset" }
  - { id: ERR_ACTIVE_RESERVATIONS, http: 409, condition: "Decommissioning a spare unit with ACTIVE reservations" }
  - { id: ERR_OUTAGE_NOT_CLEARED, http: 409, condition: "Submitting an outage-gated test while the linked window is not CLEARED" }
  - { id: ERR_OUTAGE_CAPACITY_EXCEEDED, http: 422, condition: "estimated_hours exceeds the window's remaining uncommitted hours" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: OperationsManager
    description: "Fleet/asset administrator: master data, approvals, defect deferral, work-order verification, certification administration, clock control"
    identity: "opaque"
    exclusive_operations:
      - "POST /substations"
      - "POST /asset-class-policies"
      - "POST /assets"
      - "POST /outage-windows/{id}/approve"
      - "POST /outage-windows/{id}/reject"
      - "POST /defects/{id}/defer"
      - "POST /work-orders (create)"
      - "POST /work-orders/{id}/verify"
      - "POST /work-orders/{id}/cancel"
      - "POST /spare-units"
      - "POST /spare-units/{id}/decommission"
      - "POST /technicians"
      - "POST /technicians/{id}/certifications"
      - "POST /certifications/{id}/revoke"
      - "POST /technicians/{id}/deactivate"
      - "POST /assets/{id}/decommission"
      - "POST /substations/{id}/decommission"
      - "POST /_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]
  - name: OutageCoordinator
    description: "Schedules outages, authors switching plans, schedules work orders, manages spare logistics"
    identity: "opaque"
    exclusive_operations:
      - "POST /outage-windows"
      - "POST /outage-windows/{id}/cancel"
      - "POST /outage-windows/{id}/switching-steps"
      - "POST /work-orders/{id}/schedule"
      - "POST /spare-reservations"
      - "POST /spare-reservations/{id}/cancel"
      - "POST /spare-reservations/{id}/deploy"
      - "POST /spare-reservations/{id}/return"
    shared_operations: ["all GET endpoints"]
  - name: SwitchingSupervisor
    description: "Executes and verifies switching steps; drives windows through switching/clear/restore; step executor and verifier must be different operators"
    identity: "opaque"
    exclusive_operations:
      - "POST /outage-windows/{id}/begin-switching"
      - "POST /outage-windows/{id}/clear"
      - "POST /outage-windows/{id}/restore"
      - "POST /switching-steps/{id}/execute"
      - "POST /switching-steps/{id}/verify"
    shared_operations: ["all GET endpoints"]
  - name: Technician
    description: "NETA-certified field technician: records tests, reports defects, drafts/verifies/activates relay settings, executes assigned work orders"
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /test-events"
      - "POST /test-events/{id}/submit (creator only)"
      - "POST /defects"
      - "POST /relay-settings"
      - "POST /relay-settings/{id}/submit (author only)"
      - "POST /relay-settings/{id}/verify (non-author, NETA_LEVEL_4)"
      - "POST /relay-settings/{id}/reject (non-author, NETA_LEVEL_4)"
      - "POST /relay-settings/{id}/activate (NETA_LEVEL_4)"
      - "POST /work-orders/{id}/start (assignee only)"
      - "POST /work-orders/{id}/complete (assignee only)"
    shared_operations: ["all GET endpoints"]
  - name: ComplianceOfficer
    description: "Reviews test results, files and closes environmental inspections"
    identity: "opaque"
    exclusive_operations:
      - "POST /test-events/{id}/review"
      - "POST /substations/{sid}/environmental-inspections"
      - "POST /environmental-inspections/{id}/complete"
      - "POST /environmental-inspections/{id}/close"
    shared_operations: ["all GET endpoints"]
