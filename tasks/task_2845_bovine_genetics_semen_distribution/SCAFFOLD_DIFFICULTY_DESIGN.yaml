      - name: health_safety_outranks_credit_limit_on_transfer_approve
        grounds:
          - validations.priority_25_ERR_HEALTH_TESTS_NOT_CURRENT
          - validations.priority_51_ERR_CREDIT_LIMIT_EXCEEDED
          - calculations.distributor_exposure
        distinguishing_aspect: |
          A different category pair - business_safety (25) versus business_fiscal (51) - on a different
          endpoint, POST /genetics/consignment-transfers/{id}/approve. The pair spans the widest priority
          gap in the catalog, and the money rule is deliberately last, so an implementation that checks the
          cheap credit arithmetic first is caught.
        test_recipe:
          setup:
            - "Everything from the previous instance's setup, except the lot IS released (unit_book_value_cents 1250) and REG-B's BLUETONGUE test carries validity_days 40, so it lapses at 2026-09-10T00:00:00.000Z."
            - "Distributor D-ALPHA has credit_limit_cents 100000 and consignment_enabled true, and owns Tank TK-A (capacity_straws 500)."
            - "A REQUESTED transfer of 150 doses at unit_price_cents 4000 exists, so projected exposure is 150 * 1250 = 187500 cents against a 100000 limit."
            - "The clock is then advanced to 2026-09-10T00:00:00Z, expiring the BLUETONGUE test."
          setup_api_calls:
            - call: "GET /genetics/sires"
              payload: { collection_status: "ELIGIBLE" }
              as: ProgramDirector
              captures: { b_id: "$.data[0].id", fac_id: "$.data[0].housing_facility_id" }
            - call: "POST /genetics/distributors"
              payload: { name: "D-ALPHA", country_code: "US", credit_limit_cents: 100000, consignment_enabled: true }
              as: ProgramDirector
              captures: { alpha_id: "$.data.id" }
            - call: "POST /genetics/tanks"
              payload: { distributor_id: "${alpha_id}", serial: "TK-A", capacity_straws: 500, service_interval_days: 60, initial_fill_pct: 95.0 }
              as: ProgramDirector
              captures: { tank_a: "$.data.id" }
            - call: "GET /genetics/straw-lots"
              payload: { sire_id: "${b_id}" }
              as: ProgramDirector
              captures: { lot_id: "$.data[0].id", lot_ver: "$.data[0].version" }
            - call: "POST /genetics/straw-lots/${lot_id}/consignment-transfers"
              payload: { distributor_id: "${alpha_id}", tank_id: "${tank_a}", doses: 150, unit_price_cents: 4000, expected_straw_lot_version: "${lot_ver}" }
              as: ProgramDirector
              captures: { tr_id: "$.data.id" }
            - call: "POST /genetics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /genetics/consignment-transfers/${tr_id}/approve"
              payload: {}
              as: ProgramDirector
          assert:
            - "The trigger returns HTTP 422 with error_id ERR_HEALTH_TESTS_NOT_CURRENT, not ERR_CREDIT_LIMIT_EXCEEDED"
            - "ConsignmentTransfer.${tr_id}.status == REQUESTED (no state change on a rejected approval)"
            - "Reachability of the outranked rule: register a retest - POST /genetics/sires/${b_id}/health-tests with test_type BLUETONGUE, sample_date \"2026-09-10\", validity_days 365 - result it NEGATIVE as vet-1, then repeat the approve; it now returns HTTP 422 with error_id ERR_CREDIT_LIMIT_EXCEEDED because 187500 > 100000"
            - "Positive control: after the retest, a fresh REQUESTED transfer of 80 doses (projected exposure 80 * 1250 == 100000, inclusive at the limit) is approved with HTTP 200"

      - name: facility_residency_outranks_rest_buffer_on_booking_create
        grounds:
          - validations.priority_28_ERR_SIRE_NOT_AT_FACILITY
          - validations.priority_34_ERR_SIRE_REST_BUFFER
        distinguishing_aspect: |
          Third category pair - business_referential (28) versus business_temporal (34) - on POST
          /genetics/collection-bookings. Unlike the previous two instances the two rules concern the same
          sire and neither involves money or state; the discriminator is that residency is positional and
          the rest buffer is chronological, and the positional rule must answer first.
        test_recipe:
          setup:
            - "Facilities F-IA-10 and F-IA-11 (both US, APPROVED, bench_capacity 1) exist; Sire REG-B is RESIDENT and ELIGIBLE at F-IA-10 with all four tests NEGATIVE until 2027-08-01."
            - "REG-B has a COMPLETED booking spanning 2026-09-01T08:00:00Z - 2026-09-01T10:00:00Z at F-IA-10."
            - "The logical clock stands at 2026-09-01T10:00:00Z, so the 48-hour rest buffer runs to 2026-09-03T10:00:00Z."
          setup_api_calls:
            - call: "GET /genetics/sires"
              payload: { collection_status: "ELIGIBLE" }
              as: ProgramDirector
              captures: { b_id: "$.data[0].id", fac_id: "$.data[0].housing_facility_id" }
            - call: "POST /genetics/facilities"
              payload: { code: "F-IA-11", country_code: "US", housing_capacity: 2, bench_capacity: 1, approved_export_countries: ["CA"] }
              as: ProgramDirector
              captures: { fac2_id: "$.data.id" }
            - call: "POST /genetics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T10:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /genetics/collection-bookings"
              payload: { sire_id: "${b_id}", facility_id: "${fac2_id}", start_at: "2026-09-02T10:00:00Z", end_at: "2026-09-02T12:00:00Z" }
              as: FacilityManager
              as_user_id: "${fac2_id}"
          assert:
            - "The trigger returns HTTP 422 with error_id ERR_SIRE_NOT_AT_FACILITY, not ERR_SIRE_REST_BUFFER, although start_at 2026-09-02T10:00:00Z is only 24 hours after the previous end_at"
            - "GET /genetics/collection-bookings?sire_id=${b_id} still returns total_count == 1"
            - "Reachability of the outranked rule: the same window submitted for the correct facility F-IA-10 - facility_id ${fac_id}, X-User-ID ${fac_id} - returns HTTP 422 with error_id ERR_SIRE_REST_BUFFER"
            - "Positive control: facility_id ${fac_id} with start_at \"2026-09-03T10:00:00Z\" and end_at \"2026-09-03T12:00:00Z\" - exactly 48 hours, closed boundary - returns HTTP 201"

  - rule_id: boundary_precision_check
    instances:
      - name: progeny_blend_threshold_at_forty_nine_versus_fifty_daughters
        grounds:
          - calculations.sire_genetic_index
          - calculations.sire_genetic_index.constants.PROGENY_BLEND_MIN
        distinguishing_aspect: |
          Metric is progeny_daughter_count against PROGENY_BLEND_MIN = 50 on POST
          /genetics/sires/{id}/genomic-evaluations. The comparison is >= , so 49 and 50 land in different
          variants and produce composite indices 5.36 points apart from byte-identical trait inputs.
        test_recipe:
          setup:
            - "Sire REG-A has a PUBLISHED evaluation with composite_index 62.37, so REG-C's parent_average_index is round_half_up((62.37 + 0.00)/2, 2) == 31.19 (the null dam sire contributes 0.00)."
            - "Sire REG-C has sire_id REG-A and no dam_sire_id; no evaluation of its own yet."
            - "The logical clock stands at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /genetics/sires"
              payload: { registration_code: "REG-A", breed: "HOLSTEIN", birth_date: "2020-03-01", acquisition_cost_cents: 0 }
              as: ProgramDirector
              captures: { a_id: "$.data.id", a_ver: "$.data.version" }
            - call: "POST /genetics/sires/${a_id}/genomic-evaluations"
              payload: { milk_kg: 900, fat_kg: 40, protein_kg: 30, somatic_cell_score: 2.85, fertility_pct: 1.5, longevity_months: 2.0, reliability_pct: 75, progeny_daughter_count: 120, effective_at: "2026-07-01T00:00:00Z", expected_sire_version: "${a_ver}" }
              as: ProgramDirector
              captures: { eval_a: "$.data.id" }
            - call: "POST /genetics/genomic-evaluations/${eval_a}/publish"
              payload: {}
              as: ProgramDirector
            - call: "POST /genetics/sires"
              payload: { registration_code: "REG-C", breed: "HOLSTEIN", birth_date: "2023-05-01", sire_id: "${a_id}", acquisition_cost_cents: 1500000 }
              as: ProgramDirector
              captures: { c_id: "$.data.id", c_ver: "$.data.version" }
          trigger:
            - call: "POST /genetics/sires/${c_id}/genomic-evaluations"
              payload: { milk_kg: 1100, fat_kg: 45, protein_kg: 36, somatic_cell_score: 2.90, fertility_pct: 2.0, longevity_months: 3.0, reliability_pct: 68, progeny_daughter_count: 49, effective_at: "2026-08-15T00:00:00Z", expected_sire_version: "${c_ver}" }
              as: ProgramDirector
              captures: { ev49: "$.data.id" }
            - call: "GET /genetics/sires/${c_id}"
              payload: {}
              as: ProgramDirector
              captures: { c_ver2: "$.data.version" }
            - call: "POST /genetics/sires/${c_id}/genomic-evaluations"
              payload: { milk_kg: 1100, fat_kg: 45, protein_kg: 36, somatic_cell_score: 2.90, fertility_pct: 2.0, longevity_months: 3.0, reliability_pct: 68, progeny_daughter_count: 50, effective_at: "2026-08-16T00:00:00Z", expected_sire_version: "${c_ver2}" }
              as: ProgramDirector
              captures: { ev50: "$.data.id" }
          assert:
            - "Both calls return production_index == 52.90 and health_index == 65.62 and parent_average_index == 31.19 (the trait inputs are identical; only the daughter count differs)"
            - "just below: GenomicEvaluation.${ev49}.evaluation_basis == GENOMIC_ONLY, parent_average_weight == 0.50, composite_index == 44.59"
            - "at the threshold: GenomicEvaluation.${ev50}.evaluation_basis == PROGENY_BLENDED, parent_average_weight == 0.30, composite_index == 49.95"
            - "The 5.36-point gap proves the boundary is >= 50 and not > 50: a 50-daughter sire must NOT be treated as GENOMIC_ONLY"
            - "Sire.${c_id}.published_composite_index is still null - neither evaluation was published"

      - name: ln2_level_exactly_at_service_due_threshold
        grounds:
          - calculations.tank_ln2_level
          - calculations.tank_ln2_level.constants.LN2_SERVICE_DUE_PCT
          - state_machines.Tank
        distinguishing_aspect: |
          A different metric - ln2_level_pct in percent, produced by a step decay - read through a
          different endpoint, GET /genetics/tanks/{id}. The threshold is <= 25.0, so exactly 25.0 must
          already be SERVICE_DUE, and the second boundary (level clamped to 0) must be OUT_OF_SERVICE
          rather than SERVICE_DUE.
        test_recipe:
          setup:
            - "Distributor D-DELTA (US) owns Tank TK-D created at logical clock 2026-08-01T00:00:00Z with initial_fill_pct 95.0 and service_interval_days 60, so last_service_at is 2026-08-01T00:00:00.000Z, last_service_fill_pct is 95.0 and next_service_due_at is 2026-09-30T00:00:00.000Z."
            - "LN2_DECAY_PCT_PER_DAY is 2.0 and LN2_SERVICE_DUE_PCT is 25.0."
          setup_api_calls:
            - call: "POST /genetics/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /genetics/distributors"
              payload: { name: "D-DELTA", country_code: "US", credit_limit_cents: 100000000, consignment_enabled: true }
              as: ProgramDirector
              captures: { dist_id: "$.data.id" }
            - call: "POST /genetics/tanks"
              payload: { distributor_id: "${dist_id}", serial: "TK-D", capacity_straws: 500, service_interval_days: 60, initial_fill_pct: 95.0 }
              as: ProgramDirector
              captures: { tank_id: "$.data.id" }
            - call: "POST /genetics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-04T00:00:00Z" }
              as: ProgramDirector
            - call: "GET /genetics/tanks/${tank_id}"
              payload: {}
              as: ProgramDirector
            - call: "POST /genetics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "GET /genetics/tanks/${tank_id}"
              payload: {}
              as: ProgramDirector
          assert:
            - "just above the threshold (34 elapsed days, clock 2026-09-04T00:00:00Z): the setup read returns ln2_level_pct == 27.0 and tank_status == IN_SERVICE"
            - "exactly at the threshold (35 elapsed days): the trigger returns ln2_level_pct == 25.0 and tank_status == SERVICE_DUE, because the comparison is <= 25.0"
            - "next_service_due_at == \"2026-09-30T00:00:00.000Z\", so the interval clause is NOT what produced SERVICE_DUE at 2026-09-05"
            - "second boundary: after POST /genetics/_clock/set_current_utc with 2026-09-17T00:00:00Z (47 days) the tank reads ln2_level_pct == 1.0 and tank_status == SERVICE_DUE; after 2026-09-18T00:00:00Z (48 days) it reads ln2_level_pct == 0 (clamped, never negative) and tank_status == OUT_OF_SERVICE"
            - "Recovery: POST /genetics/tanks/${tank_id}/ln2-service with fill_pct 95.0 returns ln2_level_pct == 95.0, tank_status == IN_SERVICE, last_service_at == \"2026-09-18T00:00:00.000Z\" and service_count incremented by 1"

      - name: rebate_tier_at_exact_five_hundred_thousand_cent_subtotal
        grounds:
          - calculations.consignment_settlement
          - calculations.consignment_settlement.constants.REBATE_TIERS
        distinguishing_aspect: |
          A third metric - pre_rebate_subtotal_cents in whole cents - on a third endpoint, POST
          /genetics/consignment-transfers/{id}/report-usage. The tier key is the subtotal WITH the
          12000-cent service fee included, so 122 doses tip over the 500000 boundary only because of the
          fee; an implementation that keys the tier on gross_cents gives 0 percent for both dose counts.
        test_recipe:
          setup:
            - "A CONVENTIONAL StrawLot of 300 straws is RELEASED with unit_book_value_cents 1250."
            - "Distributor D-ECHO (US, credit_limit_cents 100000000, consignment_enabled true) owns Tank TK-E (capacity_straws 500, IN_SERVICE)."
            - "REBATE_TIERS are 0 percent from 0, 3 percent from 500000 and 6 percent from 1500000; LN2_SERVICE_FEE_CENTS is 12000."
          setup_api_calls:
            - call: "GET /genetics/straw-lots"
              payload: { distribution_status: "RELEASED", product_line: "CONVENTIONAL" }
              as: ProgramDirector
              captures: { lot_id: "$.data[0].id", lot_ver: "$.data[0].version" }
            - call: "GET /genetics/tanks"
              payload: { tank_status: "IN_SERVICE" }
              as: ProgramDirector
              captures: { tank_id: "$.data[0].id", dist_id: "$.data[0].distributor_id" }
            - call: "POST /genetics/straw-lots/${lot_id}/consignment-transfers"
              payload: { distributor_id: "${dist_id}", tank_id: "${tank_id}", doses: 122, unit_price_cents: 4000, expected_straw_lot_version: "${lot_ver}" }
              as: ProgramDirector
              captures: { tr_id: "$.data.id" }
            - call: "POST /genetics/consignment-transfers/${tr_id}/approve"
              payload: {}
              as: ProgramDirector
            - call: "POST /genetics/consignment-transfers/${tr_id}/dispatch"
              payload: {}
              as: ProgramDirector
            - call: "POST /genetics/consignment-transfers/${tr_id}/receive"
              payload: {}
              as: Distributor
              as_user_id: "${dist_id}"
            - call: "POST /genetics/tanks/${tank_id}/ln2-service"
              payload: { fill_pct: 95.0 }
              as: Distributor
              as_user_id: "${dist_id}"
          trigger:
            - call: "POST /genetics/consignment-transfers/${tr_id}/report-usage"
              payload: { doses_used: 122, doses_returned: 0 }
              as: Distributor
              as_user_id: "${dist_id}"
          assert:
            - "at the tier boundary: gross_cents == 488000, service_fee_cents == 12000, pre_rebate_subtotal_cents == 500000 exactly, rebate_cents == 14640 and settlement_total_cents == 485360"
            - "The rebate is 3 percent of gross_cents only, never of the service fee: 14640 == round_half_up(488000 * 0.03, 0), and 500000 * 0.03 == 15000 must NOT appear"
            - "just below the boundary: an identical second transfer of 121 doses at unit_price_cents 4000, dispatched and received into the same tank with exactly one further ln2-service, settles at gross_cents 484000, service_fee_cents 12000, pre_rebate_subtotal_cents 496000, rebate_cents 0 and settlement_total_cents 496000"
            - "ConsignmentTransfer.${tr_id}.status == RECONCILED and Distributor.${dist_id}.outstanding_balance_cents == 485360 after the trigger"
            - "The 122-dose case proves the fee is inside the tier key: on gross_cents alone (488000 < 500000) the rebate would have been 0"

      - name: inbreeding_ceiling_inclusive_at_six_point_two_five_percent
        grounds:
          - calculations.inbreeding_coefficient
          - calculations.mating_sire_selector
          - validations.priority_50_ERR_NO_ELIGIBLE_SIRE
        distinguishing_aspect: |
          A fourth metric - inbreeding_pct as a 2-dp percentage - on a fourth endpoint, POST
          /genetics/customer-herds/{id}/mating-recommendations. The eligibility comparison is
          inbreeding_pct <= CustomerHerd.max_inbreeding_pct, so a half-sib mating at exactly 6.25 percent
          is admissible while a ceiling of 6.24 empties the pool and must return ERR_NO_ELIGIBLE_SIRE
          without creating a row.
        test_recipe:
          setup:
            - "The canonical fixture holds: REG-A is PUBLISHED with composite_index 62.37; REG-C (sire_id REG-A) is the only RESIDENT and ELIGIBLE sire, has a PUBLISHED evaluation with composite_index 49.95, and owns a RELEASED CONVENTIONAL lot whose Ejaculate.post_thaw_motility_pct is 55.0 and whose doses_available is at least 10."
            - "REG-D is registered with sire_id REG-A as the maternal grandsire, so REG-C and REG-D are half sibs and the mating of REG-C onto a REG-D daughter carries inbreeding_pct 6.25."
            - "Herd H-EDGE has max_inbreeding_pct 6.25 and herd H-TIGHT has max_inbreeding_pct 6.24; neither has a base_sire_id."
          setup_api_calls:
            - call: "GET /genetics/sires"
              payload: { collection_status: "ELIGIBLE" }
              as: ProgramDirector
              captures: { c_id: "$.data[0].id", a_id: "$.data[0].sire_id" }
            - call: "POST /genetics/sires"
              payload: { registration_code: "REG-D", breed: "HOLSTEIN", birth_date: "2021-04-01", sire_id: "${a_id}", acquisition_cost_cents: 0 }
              as: ProgramDirector
              captures: { d_id: "$.data.id" }
            - call: "POST /genetics/distributors"
              payload: { name: "D-FOX", country_code: "US", credit_limit_cents: 100000000, consignment_enabled: true }
              as: ProgramDirector
              captures: { dist_id: "$.data.id" }
            - call: "POST /genetics/customer-herds"
              payload: { herd_name: "H-EDGE", distributor_id: "${dist_id}", country_code: "US", target_product_line: "CONVENTIONAL", max_inbreeding_pct: 6.25 }
              as: BreedingAdvisor
              captures: { herd_edge: "$.data.id" }
            - call: "POST /genetics/customer-herds"
              payload: { herd_name: "H-TIGHT", distributor_id: "${dist_id}", country_code: "US", target_product_line: "CONVENTIONAL", max_inbreeding_pct: 6.24 }
              as: BreedingAdvisor
              captures: { herd_tight: "$.data.id" }
          trigger:
            - call: "POST /genetics/customer-herds/${herd_edge}/mating-recommendations"
              payload: { dam_ref: "COW-9001", dam_sire_id: "${d_id}", requested_product_line: "CONVENTIONAL", doses_requested: 10 }
              as: BreedingAdvisor
              captures: { rec_id: "$.data.id" }
          assert:
            - "at the ceiling: the trigger returns HTTP 201 with inbreeding_pct == 6.25, candidate_pool_size == 1, recommended_sire_id == ${c_id} and status PROPOSED"
            - "expected_conception_rate == 0.3113 (0.60 base * (1 + 0.0004 * 49.95) * 0.55 post-thaw * (1 - 0.012 * 6.25), rounded half up at 4 dp)"
            - "The 6.25 figure is the shortest-path Wright sum over the single shared ancestor REG-A: n1 == 1, n2 == 2, 0.5 ** 4 == 0.0625"
            - "just past the ceiling: the identical body posted to H-TIGHT (max_inbreeding_pct 6.24) returns HTTP 422 with error_id ERR_NO_ELIGIBLE_SIRE"
            - "no row is created on the rejected call: GET /genetics/mating-recommendations?customer_herd_id=${herd_tight} returns total_count == 0, and CustomerHerd.${herd_tight}.recommendation_count == 0"
            - "No dose moved on either call: the lot's doses_available is unchanged until a decision ACCEPTED is posted"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: booking_blocked_by_target_facility_suspension
        grounds:
          - validations.priority_16_ERR_FACILITY_SUSPENDED
          - state_machines.Facility.APPROVED_to_SUSPENDED
          - state_machines.CollectionBooking
        distinguishing_aspect: |
          Entity pair is (CollectionBooking, Facility): the booking is legal in every respect that
          concerns the booking row itself and the sire is ELIGIBLE, yet creation is refused purely because
          a THIRD row - the target Facility - sits in SUSPENDED. The sire deliberately lives at a different,
          still-APPROVED facility so that the sire-state rule at priority 15 cannot fire and mask the
          dependency.
        test_recipe:
          setup:
            - "Facility F-IA-12 is APPROVED and hosts REG-B, which is RESIDENT and ELIGIBLE with all four required tests NEGATIVE until 2027-08-01."
            - "Facility F-IA-13 is APPROVED at creation, has bench_capacity 2 and no bookings, and is then moved to SUSPENDED with suspension_reason \"LN2_SUPPLY_FAILURE\"."
            - "The logical clock stands at 2026-08-31T00:00:00Z; REG-B has no prior booking, so no rest buffer applies."
          setup_api_calls:
            - call: "GET /genetics/sires"
              payload: { collection_status: "ELIGIBLE" }
              as: ProgramDirector
              captures: { b_id: "$.data[0].id", fac_id: "$.data[0].housing_facility_id" }
            - call: "POST /genetics/facilities"
              payload: { code: "F-IA-13", country_code: "US", housing_capacity: 4, bench_capacity: 2, approved_export_countries: ["CA"] }
              as: ProgramDirector
              captures: { fac2_id: "$.data.id" }
            - call: "POST /genetics/facilities/${fac2_id}/approval-status"
              payload: { approval_status: "SUSPENDED", suspension_reason: "LN2_SUPPLY_FAILURE" }
              as: ProgramDirector
          trigger:
            - call: "POST /genetics/collection-bookings"
              payload: { sire_id: "${b_id}", facility_id: "${fac2_id}", start_at: "2026-09-20T08:00:00Z", end_at: "2026-09-20T10:00:00Z" }
              as: FacilityManager
              as_user_id: "${fac2_id}"
          assert:
            - "The trigger returns HTTP 409 with error_id ERR_FACILITY_SUSPENDED"
            - "Sire.${b_id}.collection_status == ELIGIBLE throughout - suspending F-IA-13 cascaded to no sire because none is housed there"
            - "Facility.${fac2_id}.approval_status == SUSPENDED and suspension_reason == \"LN2_SUPPLY_FAILURE\""
            - "GET /genetics/collection-bookings?facility_id=${fac2_id} returns total_count == 0"
            - "Dependency isolation: POST /genetics/facilities/${fac2_id}/approval-status with approval_status APPROVED, then the identical booking body now fails with error_id ERR_SIRE_NOT_AT_FACILITY (priority 28) - the facility-state gate is gone and the next rule takes over"
            - "Positive control: the same window at the sire's own facility ${fac_id}, posted with X-User-ID ${fac_id}, returns HTTP 201"

      - name: consignment_receive_blocked_by_tank_out_of_service
        grounds:
          - validations.priority_21_ERR_TANK_OUT_OF_SERVICE
          - state_machines.Tank.SERVICE_DUE_to_OUT_OF_SERVICE
          - state_machines.ConsignmentTransfer.IN_TRANSIT_to_RECEIVED
          - calculations.tank_ln2_level
        distinguishing_aspect: |
          A different entity pair - (ConsignmentTransfer, Tank) - and a different direction of dependency:
          the transfer is already IN_TRANSIT and its own preconditions are satisfied, but the destination
          Tank drifted into OUT_OF_SERVICE while the shipment was in flight, and the gate is only evaluated
          at receive. The blocking state was reached by a clock-driven system transition, not by an operator
          call on the tank.
        test_recipe:
          setup:
            - "A CONVENTIONAL StrawLot of 300 straws is RELEASED with unit_book_value_cents 1250 and doses_available 300."
            - "Distributor D-GOLF (US, credit_limit_cents 100000000, consignment_enabled true) owns Tank TK-G created at clock 2026-08-01T00:00:00Z with initial_fill_pct 95.0 and service_interval_days 60."
            - "A 40-dose transfer at unit_price_cents 4000 into TK-G has been approved and dispatched at clock 2026-08-01T00:00:00Z, so it is IN_TRANSIT and the lot shows doses_reserved 40."
            - "All required health tests run to 2027-08-01, so no clock move can suspend the sire."
          setup_api_calls:
            - call: "POST /genetics/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "GET /genetics/straw-lots"
              payload: { distribution_status: "RELEASED", product_line: "CONVENTIONAL" }
              as: ProgramDirector
              captures: { lot_id: "$.data[0].id", lot_ver: "$.data[0].version" }
            - call: "POST /genetics/distributors"
              payload: { name: "D-GOLF", country_code: "US", credit_limit_cents: 100000000, consignment_enabled: true }
              as: ProgramDirector
              captures: { dist_id: "$.data.id" }
            - call: "POST /genetics/tanks"
              payload: { distributor_id: "${dist_id}", serial: "TK-G", capacity_straws: 500, service_interval_days: 60, initial_fill_pct: 95.0 }
              as: ProgramDirector
              captures: { tank_id: "$.data.id" }
            - call: "POST /genetics/straw-lots/${lot_id}/consignment-transfers"
              payload: { distributor_id: "${dist_id}", tank_id: "${tank_id}", doses: 40, unit_price_cents: 4000, expected_straw_lot_version: "${lot_ver}" }
              as: ProgramDirector
              captures: { tr_id: "$.data.id" }
            - call: "POST /genetics/consignment-transfers/${tr_id}/approve"
              payload: {}
              as: ProgramDirector
            - call: "POST /genetics/consignment-transfers/${tr_id}/dispatch"
              payload: {}
              as: ProgramDirector
            - call: "POST /genetics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-18T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /genetics/consignment-transfers/${tr_id}/receive"
              payload: {}
              as: Distributor
              as_user_id: "${dist_id}"
          assert:
            - "Before the trigger: Tank.${tank_id}.ln2_level_pct == 0 and tank_status == OUT_OF_SERVICE (48 whole days at 2.0 percent per day from 95.0), and ConsignmentTransfer.${tr_id}.status == IN_TRANSIT"
            - "The trigger returns HTTP 409 with error_id ERR_TANK_OUT_OF_SERVICE"
            - "ConsignmentTransfer.${tr_id}.status is still IN_TRANSIT and the lot still shows doses_reserved 40, doses_consigned 0 - no dose moved on the refused receive"
            - "Distributor.${dist_id}.consignment_value_cents == 0 (nothing is on consignment yet)"
            - "Dependency isolation: POST /genetics/tanks/${tank_id}/ln2-service with fill_pct 95.0 puts the tank back to IN_SERVICE, and the identical receive then returns HTTP 200 with status RECEIVED, doses_on_hand 40, carried_value_cents 50000 and Distributor.consignment_value_cents 50000"
            - "Only the tank changed between the refused and the accepted receive - the transfer row was untouched"

      - name: certificate_issue_blocked_by_lapsed_country_health_test
        grounds:
          - validations.priority_26_ERR_COUNTRY_TEST_MISSING
          - calculations.certificate_export_compliance
          - state_machines.HealthTest.NEGATIVE_to_EXPIRED
          - state_machines.ExportCertificate.SUBMITTED_to_ISSUED
        distinguishing_aspect: |
          A third entity pair - (ExportCertificate, HealthTest) - where the dependency is on a SET of rows
          rather than a single parent, and where the certificate passed the very same country requirement at
          submit time. The IBR test lapses between submit and issue, so the identical issue call flips from
          admissible to refused with no change to the certificate row itself.
        test_recipe:
          setup:
            - "CountryRequirement CA requires [BLUETONGUE, IBR] with max_test_age_days 60 and min_isolation_days 21."
            - "Facility F-IA-14 (US, approved_export_countries [\"CA\"]) hosts REG-B, RESIDENT and ELIGIBLE, housed with isolation_days 30."
            - "REG-B's BLUETONGUE, BVD and TRICHOMONIASIS tests were sampled 2026-08-01 with validity_days 365; its IBR test was sampled 2026-08-01 with validity_days 40, so IBR lapses at 2026-09-10T00:00:00.000Z. Every result was recorded by user vet-1."
            - "A CONVENTIONAL lot of 200 straws from REG-B is RELEASED, and an ExportCertificate over that lot for CA is in SUBMITTED with submission_round 1."
            - "The clock is then advanced from 2026-09-01T08:00:00Z to 2026-09-10T00:00:00Z."
          setup_api_calls:
            - call: "GET /genetics/sires"
              payload: { collection_status: "ELIGIBLE" }
              as: ProgramDirector
              captures: { b_id: "$.data[0].id", fac_id: "$.data[0].housing_facility_id" }
            - call: "POST /genetics/country-requirements"
              payload: { country_code: "CA", required_test_types: ["BLUETONGUE", "IBR"], max_test_age_days: 60, min_isolation_days: 21, sexed_semen_allowed: true, embryo_allowed: false }
              as: ExportCoordinator
              captures: { cr_ca: "$.data.id" }
            - call: "GET /genetics/straw-lots"
              payload: { sire_id: "${b_id}", distribution_status: "RELEASED" }
              as: ProgramDirector
              captures: { lot_id: "$.data[0].id" }
            - call: "POST /genetics/export-certificates"
              payload: { sire_id: "${b_id}", straw_lot_id: "${lot_id}", country_requirement_id: "${cr_ca}" }
              as: ExportCoordinator
              captures: { cert_id: "$.data.id" }
            - call: "POST /genetics/export-certificates/${cert_id}/submit"
              payload: {}
              as: ExportCoordinator
            - call: "POST /genetics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /genetics/export-certificates/${cert_id}/issue"
              payload: { issue_note: "CA batch 1" }
              as: StaffVeterinarian
              as_user_id: "vet-2"
          assert:
            - "The submit in setup succeeded at clock 2026-09-01T08:00:00Z, when both CA-required tests were current - ExportCertificate.${cert_id}.status == SUBMITTED and submission_round == 1"
            - "After the clock move, GET /genetics/health-tests?sire_id=${b_id}&test_type=IBR shows result EXPIRED while BLUETONGUE is still NEGATIVE with valid_until \"2027-08-01T00:00:00.000Z\""
            - "The trigger returns HTTP 422 with error_id ERR_COUNTRY_TEST_MISSING, not ERR_CERTIFICATE_STATE and not ERR_CERTIFIER_TESTED_SIRE (vet-2 recorded none of the results)"
            - "ExportCertificate.${cert_id}.status is still SUBMITTED, issued_by_user_id is null and expires_at is null"
            - "Dependency isolation: POST /genetics/sires/${b_id}/health-tests with test_type IBR, sample_date \"2026-09-10\", validity_days 365, resulted NEGATIVE by vet-1, then POST /genetics/sires/${b_id}/collection-status with collection_status ELIGIBLE, then the identical issue call returns HTTP 200 with status ISSUED, issued_by_user_id \"vet-2\" and expires_at \"2027-08-01T00:00:00.000Z\" - the MIN over the two chosen tests' valid_until"
            - "The replacement IBR row is a fresh test, not a retest: retest_of_test_id must be null, because priority 32 only accepts a POSITIVE or INCONCLUSIVE target"

  - rule_id: resource_temporal_overlap
    instances:
      - name: sire_rest_buffer_closed_forty_eight_hour_spacing_both_sides
        grounds:
          - validations.priority_34_ERR_SIRE_REST_BUFFER
          - entities.CollectionBooking.fields.start_at
          - entities.CollectionBooking.fields.end_at
        distinguishing_aspect: |
          Resource is the SIRE and the interval semantics are a CLOSED 48-hour spacing measured against the
          neighbouring bookings - backwards from the previous end_at to the new start_at, and forwards from
          the new start_at to the next start_at. Exactly 48 hours is admissible on both sides; one second
          less is not. No window overlap is involved at all: the rejected windows do not touch any existing
          window.
        test_recipe:
          setup:
            - "Facility F-IA-15 (US, APPROVED, bench_capacity 4) hosts REG-B, RESIDENT and ELIGIBLE, tests NEGATIVE until 2027-08-01."
            - "REG-B has one COMPLETED booking spanning 2026-09-01T08:00:00Z - 2026-09-01T10:00:00Z."
            - "The logical clock stands at 2026-09-01T10:00:00Z, so the backward buffer clears at 2026-09-03T10:00:00Z."
          setup_api_calls:
            - call: "GET /genetics/sires"
              payload: { collection_status: "ELIGIBLE" }
              as: ProgramDirector
              captures: { b_id: "$.data[0].id", fac_id: "$.data[0].housing_facility_id" }
            - call: "GET /genetics/collection-bookings"
              payload: { sire_id: "${b_id}", status: "COMPLETED" }
              as: FacilityManager
              as_user_id: "${fac_id}"
              captures: { prev_end: "$.data[0].end_at" }
            - call: "POST /genetics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T10:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /genetics/collection-bookings"
              payload: { sire_id: "${b_id}", facility_id: "${fac_id}", start_at: "2026-09-03T09:59:59Z", end_at: "2026-09-03T11:59:59Z" }
              as: FacilityManager
              as_user_id: "${fac_id}"
          assert:
            - "The captured ${prev_end} is \"2026-09-01T10:00:00.000Z\", so the backward buffer boundary is exactly 2026-09-03T10:00:00Z"
            - "one second inside the buffer: the trigger returns HTTP 422 with error_id ERR_SIRE_REST_BUFFER, although its window overlaps no existing booking"
            - "exactly at the closed boundary: start_at \"2026-09-03T10:00:00Z\" with end_at \"2026-09-03T12:00:00Z\" returns HTTP 201 and status SCHEDULED"
            - "forward side, with that 2026-09-03T10:00:00Z booking SCHEDULED and a further SCHEDULED booking created for 2026-09-20T08:00:00Z - 2026-09-20T10:00:00Z: a new booking with start_at \"2026-09-18T09:00:00Z\" is refused with ERR_SIRE_REST_BUFFER because it is only 47 hours before the next booking's start_at"
            - "forward side at the closed boundary: start_at \"2026-09-18T08:00:00Z\" with end_at \"2026-09-18T10:00:00Z\" - exactly 48 hours before the next start_at - returns HTTP 201"
            - "GET /genetics/collection-bookings?sire_id=${b_id} finally returns total_count == 4: one COMPLETED and three SCHEDULED"
            - "A VOIDED or CANCELLED booking is not a neighbour: the buffer is computed over SCHEDULED and COMPLETED rows only"

      - name: facility_bench_half_open_overlap_across_two_sires
        grounds:
          - validations.priority_40_ERR_BENCH_CAPACITY_EXCEEDED
          - entities.Facility.fields.bench_capacity
          - state_machines.CollectionBooking
        distinguishing_aspect: |
          A different resource - the FACILITY's collection bench, shared by every sire housed there - and
          different interval semantics: a HALF-OPEN [start_at, end_at) overlap count aggregated against
          bench_capacity, where adjacency (previous end_at == new start_at) is explicitly NOT an overlap.
          The two windows belong to two DIFFERENT sires, so no per-sire rest buffer can explain the refusal;
          only the shared bench can.
        test_recipe:
          setup:
            - "Facility F-IA-16 (US, APPROVED, housing_capacity 4, bench_capacity 1) hosts REG-E and REG-F, both RESIDENT and ELIGIBLE with all four tests NEGATIVE until 2027-08-01."
            - "REG-E holds a SCHEDULED booking spanning 2026-09-10T09:00:00Z - 2026-09-10T11:00:00Z."
            - "REG-F holds no booking at all, so its own rest buffer is vacuous."
            - "The logical clock stands at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "GET /genetics/sires"
              payload: { collection_status: "ELIGIBLE" }
              as: ProgramDirector
              captures: { e_id: "$.data[0].id", fac_id: "$.data[0].housing_facility_id", f_id: "$.data[1].id" }
            - call: "POST /genetics/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /genetics/collection-bookings"
              payload: { sire_id: "${e_id}", facility_id: "${fac_id}", start_at: "2026-09-10T09:00:00Z", end_at: "2026-09-10T11:00:00Z" }
              as: FacilityManager
              as_user_id: "${fac_id}"
              captures: { bk_e: "$.data.id" }
          trigger:
            - call: "POST /genetics/collection-bookings"
              payload: { sire_id: "${f_id}", facility_id: "${fac_id}", start_at: "2026-09-10T10:00:00Z", end_at: "2026-09-10T12:00:00Z" }
              as: FacilityManager
              as_user_id: "${fac_id}"
          assert:
            - "The captured ${fac_id} is the housing_facility_id of both REG-E and REG-F: GET /genetics/sires?housing_facility_id=${fac_id} returns total_count == 2"
            - "The trigger returns HTTP 422 with error_id ERR_BENCH_CAPACITY_EXCEEDED: [10:00, 12:00) overlaps [09:00, 11:00) and 1 + 1 > bench_capacity 1"
            - "The refusal is not a rest-buffer error: the two windows belong to different sires, and REG-F has no booking of its own at this point"
            - "containment also counts, and no row was created by the refused trigger: REG-F's window \"2026-09-10T09:30:00Z\" - \"2026-09-10T10:30:00Z\", wholly inside REG-E's window, is refused with ERR_BENCH_CAPACITY_EXCEEDED"
            - "identical-instant windows count: REG-F's window \"2026-09-10T09:00:00Z\" - \"2026-09-10T11:00:00Z\" is refused with ERR_BENCH_CAPACITY_EXCEEDED"
            - "adjacency is not overlap: REG-F's window \"2026-09-10T11:00:00Z\" - \"2026-09-10T13:00:00Z\" returns HTTP 201, because the previous end_at equals the new start_at"
            - "GET /genetics/collection-bookings?facility_id=${fac_id}&status=SCHEDULED then returns total_count == 2 with strictly non-overlapping half-open windows"
            - "cancellation frees the bench: cancel both SCHEDULED rows - POST /genetics/collection-bookings/${bk_e}/cancel and the same on REG-F's 11:00 booking - and REG-F's originally refused window \"2026-09-10T10:00:00Z\" - \"2026-09-10T12:00:00Z\" is then accepted with HTTP 201, proving CANCELLED rows leave both the overlap count and the rest buffer"

  - rule_id: compensating_invariant
    instances:
      - name: dose_ledger_conserved_across_approve_dispatch_receive_return
        grounds:
          - calculations.lot_dose_ledger
          - state_machines.ConsignmentTransfer.RECEIVED_to_RETURNED
          - endpoints.POST_/genetics/consignment-transfers/{id}/return
        distinguishing_aspect: |
          The conserved quantity is PHYSICAL DOSES - straw_count == doses_available + doses_reserved +
          doses_consigned + doses_used + doses_destroyed - and the compensating action is the transfer
          return. Every intermediate step is a bucket-to-bucket move, so the identity must hold after each
          of the four calls, and the return must restore doses_available to its exact pre-approve figure
          without inventing or losing a single dose.
        test_recipe:
          setup:
            - "A CONVENTIONAL StrawLot of 300 straws is RELEASED with unit_book_value_cents 1250, doses_available 300 and every other bucket 0."
            - "Distributor D-HOTEL (US, credit_limit_cents 100000000, consignment_enabled true) owns Tank TK-H (capacity_straws 500, IN_SERVICE)."
            - "The logical clock stands at 2026-08-01T00:00:00Z, so no clock-driven tank decay interferes."
          setup_api_calls:
            - call: "POST /genetics/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "GET /genetics/straw-lots"
              payload: { distribution_status: "RELEASED", product_line: "CONVENTIONAL" }
              as: ProgramDirector
              captures: { lot_id: "$.data[0].id", lot_ver: "$.data[0].version" }
            - call: "POST /genetics/distributors"
              payload: { name: "D-HOTEL", country_code: "US", credit_limit_cents: 100000000, consignment_enabled: true }
              as: ProgramDirector
              captures: { dist_id: "$.data.id" }
            - call: "POST /genetics/tanks"
              payload: { distributor_id: "${dist_id}", serial: "TK-H", capacity_straws: 500, service_interval_days: 60, initial_fill_pct: 95.0 }
              as: ProgramDirector
              captures: { tank_id: "$.data.id" }
            - call: "POST /genetics/straw-lots/${lot_id}/consignment-transfers"
              payload: { distributor_id: "${dist_id}", tank_id: "${tank_id}", doses: 40, unit_price_cents: 4000, expected_straw_lot_version: "${lot_ver}" }
              as: ProgramDirector
              captures: { tr_id: "$.data.id" }
            - call: "POST /genetics/consignment-transfers/${tr_id}/approve"
              payload: {}
              as: ProgramDirector
            - call: "POST /genetics/consignment-transfers/${tr_id}/dispatch"
              payload: {}
              as: ProgramDirector
            - call: "POST /genetics/consignment-transfers/${tr_id}/receive"
              payload: {}
              as: Distributor
              as_user_id: "${dist_id}"
          trigger:
            - call: "POST /genetics/consignment-transfers/${tr_id}/return"
              payload: { return_reason: "TANK_RELOCATION" }
              as: Distributor
              as_user_id: "${dist_id}"
          assert:
            - "before any movement: doses_available == 300, doses_reserved == 0, doses_consigned == 0, doses_used == 0, doses_destroyed == 0, and 300 == 300 + 0 + 0 + 0 + 0"
            - "after approve: doses_available == 260 and doses_reserved == 40; the identity still sums to 300"
            - "after dispatch: the buckets are unchanged at 260 / 40 / 0 / 0 / 0 (a dispatch moves no dose, it only stamps tank_service_count_at_dispatch and re-derives Tank.straws_on_hand)"
            - "after receive: doses_available == 260, doses_reserved == 0, doses_consigned == 40, carried_value_cents == 50000 and Distributor.consignment_value_cents == 50000; the identity still sums to 300"
            - "after the trigger: ConsignmentTransfer.${tr_id}.status == RETURNED, doses_available == 300, doses_reserved == 0, doses_consigned == 0, doses_used == 0, doses_destroyed == 0 - byte-identical to the pre-approve ledger"
            - "carried_value_cents == 0 and Distributor.consignment_value_cents == 0 after the return"
            - "no settlement figures were invented by the compensation: gross_cents, service_fee_cents, rebate_cents and settlement_total_cents are all null, and Distributor.outstanding_balance_cents == 0 and cumulative_doses_used == 0"
            - "GET /genetics/inventory-valuation reports plant_inventory_value_cents == 375000 at every one of the five observation points, because available, reserved and consigned all contribute"
            - "RETURNED is terminal: repeating the return returns HTTP 409 with error_id ERR_TRANSFER_STATE, and report-usage on the same transfer likewise returns ERR_TRANSFER_STATE"

      - name: inventory_cents_conserved_across_publish_and_rollback
        grounds:
          - calculations.plant_inventory_value
          - calculations.lot_unit_book_value
          - state_machines.GenomicEvaluation.PUBLISHED_to_ROLLED_BACK
          - entities.StrawLot.fields.pre_revaluation_unit_value_cents
        distinguishing_aspect: |
          A different conserved quantity - INVENTORY CENTS, plant_inventory_value_cents - and a different
          compensating action, the evaluation rollback. Unlike the dose ledger, the quantity here is not
          conserved during the forward step at all: publication deliberately moves it by 199600 cents. The
          invariant is that the compensation returns it to exactly the pre-publication figure, restoring the
          snapshot verbatim rather than recomputing a standard cost from the processing pool.
        test_recipe:
          setup:
            - "Sire REG-C has no PUBLISHED evaluation, so its published_* index fields are 0.00 and published_evaluation_effective_at is null; a DRAFT evaluation with composite_index 49.95 awaits publication."
            - "A CONVENTIONAL StrawLot of 200 straws from REG-C is RELEASED with unit_book_value_cents 1250, valuation_basis STANDARD_COST and pre_revaluation_unit_value_cents null."
            - "Distributor D-INDIA holds a RECEIVED 150-dose transfer on that lot, so doses_available is 50, doses_consigned is 150, carried_value_cents is 187500 and consignment_value_cents is 187500."
            - "plant_inventory_value_cents therefore stands at 1250 * (50 + 0 + 150) == 250000 before the publication."
          setup_api_calls:
            - call: "GET /genetics/straw-lots"
              payload: { distribution_status: "RELEASED", product_line: "CONVENTIONAL" }
              as: ProgramDirector
              captures: { lot_id: "$.data[0].id", sire_id: "$.data[0].sire_id" }
            - call: "GET /genetics/consignment-transfers"
              payload: { straw_lot_id: "${lot_id}", status: "RECEIVED" }
              as: ProgramDirector
              captures: { tr_id: "$.data[0].id", dist_id: "$.data[0].distributor_id" }
            - call: "GET /genetics/genomic-evaluations"
              payload: { sire_id: "${sire_id}", status: "DRAFT" }
              as: ProgramDirector
              captures: { ev_id: "$.data[0].id" }
            - call: "POST /genetics/genomic-evaluations/${ev_id}/publish"
              payload: { publication_note: "August run" }
              as: ProgramDirector
          trigger:
            - call: "POST /genetics/genomic-evaluations/${ev_id}/rollback"
              payload: { rollback_reason: "EVALUATION_RECALL" }
              as: ProgramDirector
          assert:
            - "forward step (setup publish): StrawLot.${lot_id}.unit_book_value_cents == 2248, valuation_basis == MARKET_REVALUED, pre_revaluation_unit_value_cents == 1250, ConsignmentTransfer.${tr_id}.carried_value_cents == 337200, Distributor.${dist_id}.consignment_value_cents == 337200, GET /genetics/inventory-valuation reports plant_inventory_value_cents == 449600 and GenomicEvaluation.${ev_id}.revaluation_delta_cents == 199600"
            - "after the trigger: GenomicEvaluation.${ev_id}.status == ROLLED_BACK (terminal) and Sire.${sire_id}.published_composite_index == 0.00, published_production_index == 0.00, published_health_index == 0.00, published_evaluation_effective_at == null and progeny_daughter_count == 0, because supersedes_evaluation_id was null"
            - "the snapshot is restored verbatim: StrawLot.${lot_id}.unit_book_value_cents == 1250, valuation_basis == STANDARD_COST and pre_revaluation_unit_value_cents == null"
            - "ConsignmentTransfer.${tr_id}.carried_value_cents == 187500 and Distributor.${dist_id}.consignment_value_cents == 187500 - exactly the pre-publication figures"
            - "the conserved quantity: GET /genetics/inventory-valuation reports plant_inventory_value_cents == 250000, identical to the pre-publication reading, with lot_count and released_value_cents also unchanged"
            - "no dose moved in either direction: doses_available == 50, doses_consigned == 150, doses_reserved == 0, doses_used == 0, doses_destroyed == 0 throughout"
            - "the rollback is not a re-derivation: had the implementation recomputed the standard cost from processing_cost_cents instead of reading pre_revaluation_unit_value_cents, a lot whose processing pool had since been re-based would land on a different unit value"
            - "ROLLED_BACK is terminal: a second rollback returns HTTP 409 with error_id ERR_EVALUATION_STATE, and publishing the same evaluation again returns ERR_EVALUATION_STATE"
