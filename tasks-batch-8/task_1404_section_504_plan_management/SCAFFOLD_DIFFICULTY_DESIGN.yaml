      - name: state_vs_business_temporal_on_determine
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors[ERR_EVALUATION_NOT_IN_PROGRESS]
          - errors[ERR_DETERMINATION_DEADLINE_MISSED]
        distinguishing_aspect: |
          Pair: state (priority 6) vs business_temporal (priority 10). Trigger
          an evaluation determine where BOTH the evaluation is in the wrong
          state (CONSENT_PENDING — not yet EVALUATION_IN_PROGRESS) AND the
          determination would be past deadline (clock advanced 70 days past
          evaluation_started_at). Expected: state error wins
          (ERR_EVALUATION_NOT_IN_PROGRESS), NOT ERR_DETERMINATION_DEADLINE_MISSED.
        test_recipe:
          setup:
            - "School S1; coordinator CO; teacher T1; student STU"
            - "Referral R1 submitted by T1, moved to UNDER_REVIEW, evaluation E1 initiated, consent requested and granted"
            - "Evaluation E1 status = CONSENT_RECEIVED (NOT yet EVALUATION_IN_PROGRESS — start step skipped)"
            - "Clock advanced to 2026-08-01 such that IF evaluation had started at 2026-05-23, it would now be > 60 days"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: District504Director
              as_user_id: "bootstrap-director"
            - call: "POST /schools"
              payload: { school_name: "Priority School A", district_code: "D08", current_academic_year: "2025-2026" }
              as: District504Director
              as_user_id: "bootstrap-director"
              captures: { school_id: $.data.id }
            - call: "POST /staff-members"
              payload: { school_id: "${school_id}", staff_external_ref: "CO-A", full_name: "Coord A", staff_role: "COORDINATOR" }
              as: District504Director
              as_user_id: "bootstrap-director"
              captures: { co_id: $.data.id }
            - call: "POST /staff-members"
              payload: { school_id: "${school_id}", staff_external_ref: "T-A", full_name: "Teacher A", staff_role: "TEACHER" }
              as: District504Director
              as_user_id: "bootstrap-director"
              captures: { t1_id: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${school_id}", student_external_ref: "STU-A", full_name: "Student A", date_of_birth: "2012-01-01T00:00:00Z", grade_level: 8 }
              as: Section504Coordinator
              as_user_id: "${co_id}"
              captures: { stu_id: $.data.id }
            - call: "POST /referrals"
              payload: { student_id: "${stu_id}", referral_reason: "r", suspected_disability_category: "LEARNING" }
              as: Teacher
              as_user_id: "${t1_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/start-review"
              payload: {}
              as: Section504Coordinator
              as_user_id: "${co_id}"
            - call: "POST /referrals/${ref_id}/initiate-evaluation"
              payload: {}
              as: Section504Coordinator
              as_user_id: "${co_id}"
              captures: { eval_id: $.data.id }
            - call: "POST /evaluations/${eval_id}/request-consent"
              payload: {}
              as: Section504Coordinator
              as_user_id: "${co_id}"
            - call: "POST /evaluations/${eval_id}/record-consent"
              payload: { granted: true, responded_by_parent_ref: "parent-A" }
              as: Section504Coordinator
              as_user_id: "${co_id}"
            # Intentionally SKIP /start — evaluation is in CONSENT_RECEIVED, not EVALUATION_IN_PROGRESS
            # Advance clock far enough that IF evaluation had started on 2026-05-01 it would be > 60 days
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: District504Director
              as_user_id: "bootstrap-director"
          trigger:
            - call: "POST /evaluations/${eval_id}/determine"
              payload: { determination_outcome: "NOT_ELIGIBLE", disability_impairment_found: false, major_life_activity_affected: false }
              as: Section504Coordinator
              as_user_id: "${co_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_EVALUATION_NOT_IN_PROGRESS (state check fires at priority 6, before temporal check at priority 10)"
            - "err != ERR_DETERMINATION_DEADLINE_MISSED"

      - name: occ_state_vs_business_constraint_on_plan_submit
        grounds:
          - validations[priority=5]
          - validations[priority=16]
          - errors[ERR_STALE_PLAN_VERSION]
          - errors[ERR_PLAN_HAS_NO_ACCOMMODATIONS]
        distinguishing_aspect: |
          Pair: state (priority 5, OCC stale-version) vs business_constraint
          (priority 16, plan has no accommodations). Different category pair
          from the instance above (state vs business_temporal) — here the
          losing side is business_constraint. Submit a plan for consent where
          BOTH the plan is missing accommodations (priority 16 would fire
          ERR_PLAN_HAS_NO_ACCOMMODATIONS) AND the client's expected_plan_version
          is stale (priority 5 fires ERR_STALE_PLAN_VERSION first).
        test_recipe:
          setup:
            - "School S1; coordinator CO; teacher T1; student STU; plan P in DRAFT with version V"
            - "Plan has ZERO accommodations (business_constraint priority 16 would fail: ERR_PLAN_HAS_NO_ACCOMMODATIONS)"
            - "Client's expected_plan_version is stale: V-1 (OCC priority 5 would fail: ERR_STALE_PLAN_VERSION)"
            - "Expected: priority 5 (concurrency/OCC) beats priority 16 (business_constraint)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2025-12-15T00:00:00Z" }
              as: District504Director
              as_user_id: "bootstrap-director"
            - call: "POST /schools"
              payload: { school_name: "Priority School B", district_code: "D09", current_academic_year: "2025-2026" }
              as: District504Director
              as_user_id: "bootstrap-director"
              captures: { school_id: $.data.id }
            - call: "POST /staff-members"
              payload: { school_id: "${school_id}", staff_external_ref: "CO-B", full_name: "Coord B", staff_role: "COORDINATOR" }
              as: District504Director
              as_user_id: "bootstrap-director"
              captures: { co_id: $.data.id }
            - call: "POST /staff-members"
              payload: { school_id: "${school_id}", staff_external_ref: "T-B", full_name: "Teacher B", staff_role: "TEACHER" }
              as: District504Director
              as_user_id: "bootstrap-director"
              captures: { t1_id: $.data.id }
            - call: "POST /students"
              payload: { school_id: "${school_id}", student_external_ref: "STU-B", full_name: "Student B", date_of_birth: "2012-01-01T00:00:00Z", grade_level: 8 }
              as: Section504Coordinator
              as_user_id: "${co_id}"
              captures: { stu_id: $.data.id }
            - call: "POST /referrals"
              payload: { student_id: "${stu_id}", referral_reason: "r", suspected_disability_category: "LEARNING" }
              as: Teacher
              as_user_id: "${t1_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/start-review"
              payload: {}
              as: Section504Coordinator
              as_user_id: "${co_id}"
            - call: "POST /referrals/${ref_id}/initiate-evaluation"
              payload: {}
              as: Section504Coordinator
              as_user_id: "${co_id}"
              captures: { eval_id: $.data.id }
            - call: "POST /evaluations/${eval_id}/request-consent"
              payload: {}
              as: Section504Coordinator
              as_user_id: "${co_id}"
            - call: "POST /evaluations/${eval_id}/record-consent"
              payload: { granted: true, responded_by_parent_ref: "parent-B" }
              as: Section504Coordinator
              as_user_id: "${co_id}"
            - call: "POST /evaluations/${eval_id}/start"
              payload: {}
              as: Section504Coordinator
              as_user_id: "${co_id}"
            - call: "POST /evaluations/${eval_id}/determine"
              payload: { determination_outcome: "ELIGIBLE", disability_impairment_found: true, major_life_activity_affected: true }
              as: Section504Coordinator
              as_user_id: "${co_id}"
            - call: "GET /students/${stu_id}"
              payload: {}
              as: Section504Coordinator
              as_user_id: "${co_id}"
              captures: { stu_v: $.data.version }
            - call: "POST /plans"
              payload: { student_id: "${stu_id}", evaluation_id: "${eval_id}", expected_student_version: "${stu_v}" }
              as: Section504Coordinator
              as_user_id: "${co_id}"
              captures: { plan_id: $.data.id, plan_v_at_create: $.data.version }
            # Plan is DRAFT with version = 1 (creation). No accommodations added.
            # Stale read: capture plan_v_at_create = 1; then plan version bumped via an accommodations add + remove? No — we keep 0 accommodations.
            # Simulate staleness by having a separate read AFTER a no-op mutation. Use GET to capture current version (= 1), then submit with expected_plan_version = plan_v_at_create - 1 = 0 (stale).
          trigger:
            - call: "POST /plans/${plan_id}/submit-for-consent"
              payload: { expected_plan_version: "${plan_v_at_create} - 1" }
              as: Section504Coordinator
              as_user_id: "${co_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_PLAN_VERSION (OCC at priority 5 fires before business_constraint at priority 16)"
            - "err != ERR_PLAN_HAS_NO_ACCOMMODATIONS"

