            - "step 4 returns HTTP 200; InterpretationSession ${s4_id}.status == 'NO_SHOW' and billable_cents == 0."
            - "CaseMatter ${m_id}.interpretation_cost_cents == 17126 exactly (5463 + 5463 + 6200); 17125 is the sum-then-round answer and is wrong."
            - "CaseMatter ${m_id}.interpretation_cost_cents excludes ${s4_id}: only COMPLETED sessions are summed."

      - name: grant_reimbursement_tier_from_base_then_largest_remainder_allocation
        grounds:
          - calculations.grant_reimbursement_rollup
          - calculations.case_hours_rollup
          - calculations.grant_confidentiality_partition
          - state_machines.GrantReport.DRAFT_to_GENERATED
          - entities.GrantReport.fields.supervision_surcharge_cents
          - entities.GrantReport.fields.rounding_remainder_cents
        distinguishing_aspect: |
          Mode (c): the surcharge tier is selected from base_reimbursable_cents ONLY and the
          allocation runs afterwards on the post-surcharge total. Three matters carrying
          60.01 / 52.00 / 40.01 DIRECT hours give per-matter cents 750125 + 650000 + 500125
          == 1900250 base, which is below SURCHARGE_TIER_2_MIN so the rate is 0.06 ->
          surcharge 114015 and total 2014265; an implementation that re-derives the tier
          from the total (2014265 >= 2000000 -> 0.09) reports surcharge 171023 and total
          2071273. The same numbers then force one leftover cent: the exact ideals are
          795132.5 / 689000.0 / 530132.5, floors sum to 2014264, and the single leftover
          cent must go to the FIRST-created of the two matters tied at remainder 0.5, so
          rounding_remainder_cents == 1 and allocated_line_total_cents == 2014265.
