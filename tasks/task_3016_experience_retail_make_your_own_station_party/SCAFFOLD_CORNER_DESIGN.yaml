scaffold_corner_design:
  # ===========================================================================
  # Section: endpoints — envelope, auth, existence, RBAC
  # ===========================================================================
  - section: endpoints
    instances:
      - name: response_envelope_success_object_shape
        claim_type: response_envelope
        grounds: [response_envelope]
        distinguishing_aspect: "Every successful response carries meta.api_request_id, meta.api_request_timestamp, response_type, and data; list responses add pagination fields with defaults limit=10, offset=0."
        test_recipe:
          setup: ["StoreManager creates a store"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Envelope Store", party_room_count: 1 }
              as: StoreManager
              captures: { env_store: $.data.id }
          trigger:
            - call: "GET /stores/${env_store}"
              payload: {}
              as: StoreManager
              captures: { env_resp: $.data }
          assert:
            - "response has meta.api_request_id (string) and meta.api_request_timestamp (ISO8601)"
            - "response_type == 'object' and data.id == ${env_store}"

      - name: unauthenticated_missing_role_header_returns_401
        claim_type: auth_required
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without X-User-Role is rejected before any other check with ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["nothing (empty DB)"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Auth Store", party_room_count: 1 }
              as: StoreManager
              captures: { auth_store: $.data.id }
          trigger:
            - call: "GET /stores/${auth_store}"
              payload: {}
              as: __NO_ROLE__
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHENTICATED"

      - name: get_nonexistent_store_returns_404
        claim_type: not_found
        grounds: ["validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "A well-formed GET against a non-existent UUID yields ERR_NOT_FOUND (404), not a 500 or empty body."
        test_recipe:
          setup: ["nothing (empty DB)"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Ghost Store", party_room_count: 1 }
              as: StoreManager
          trigger:
            - call: "GET /stores/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: customer_cannot_finalize_party_rbac_denied
        claim_type: rbac_denied
        grounds: [roles.Customer, "validations[priority=2]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "POST /parties/{id}/finalize is exclusive to StoreManager; a Customer caller is rejected with ERR_UNAUTHORIZED (403) regardless of party state."
        test_recipe:
          setup: ["Store, customer, deposit-paid SELF_GUIDED party"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "RBAC Store", party_room_count: 1 }
              as: StoreManager
              captures: { rstore: $.data.id }
            - call: "POST /customers"
              payload: { email: "rbac@example.com", full_name: "R Back" }
              as: Customer
              captures: { rcust: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /parties"
              payload: { store_id: "${rstore}", customer_id: "${rcust}", party_start: "2026-10-10T18:00:00Z", duration_minutes: 120, guest_count: 6, package_tier: "BASIC", staffing_mode: "SELF_GUIDED" }
              as: Customer
              as_user_id: "${rcust}"
              captures: { rparty: $.data.id }
            - call: "POST /parties/${rparty}/pay-deposit"
              payload: { payment_amount_cents: 10000 }
              as: Customer
              as_user_id: "${rcust}"
          trigger:
            - call: "POST /parties/${rparty}/finalize"
              payload: {}
              as: Customer
              as_user_id: "${rcust}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHORIZED"

      - name: associate_cannot_create_plush_model_rbac_denied
        claim_type: rbac_denied
        grounds: [roles.WorkshopAssociate, roles.StoreManager]
        distinguishing_aspect: "POST /plush-models is exclusive to StoreManager; WorkshopAssociate is denied with ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["Store exists"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Model Store", party_room_count: 1 }
              as: StoreManager
              captures: { mstore: $.data.id }
          trigger:
            - call: "POST /plush-models"
              payload: { name: "Denied Duck", sku: "DDK-01", base_price_cents: 1000, is_licensed: false, required_stuffing_grams: 100, sound_chip_compatible: false }
              as: WorkshopAssociate
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHORIZED"

  # ===========================================================================
  # Section: entities — creation defaults, required fields, computed/system
  # fields, enum constraints
  # ===========================================================================
  - section: entities
    instances:
      - name: consumable_on_hand_initialized_from_initial_qty
        claim_type: computed_field
        grounds: [entities.Consumable.fields.on_hand_qty, entities.Consumable.fields.initial_qty]
        distinguishing_aspect: "on_hand_qty is computed: it is initialized to initial_qty at creation and a client-supplied on_hand_qty value is ignored."
        test_recipe:
          setup: ["Store exists"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Stock Store", party_room_count: 1 }
              as: StoreManager
              captures: { sstore: $.data.id }
          trigger:
            - call: "POST /consumables"
              payload: { store_id: "${sstore}", consumable_type: "SOUND_CHIP", initial_qty: 25 }
              as: StoreManager
              captures: { chip: $.data }
          assert:
            - "chip.on_hand_qty == 25 (mirrors initial_qty)"
            - "chip.version == 1 and chip.id is a server-minted UUID"

      - name: workshop_session_starts_in_select_with_zero_consumption
        claim_type: initial_state
        grounds: [state_machines.WorkshopSession, entities.WorkshopSession.fields.stuffing_grams_used]
        distinguishing_aspect: "A freshly created session has status SELECT, stuffing_grams_used 0, sound_chip_used false, and null assigned_station_id."
        test_recipe:
          setup: ["Store, customer, non-licensed model, stations, consumables"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Init Store", party_room_count: 1 }
              as: StoreManager
              captures: { istore: $.data.id }
            - call: "POST /customers"
              payload: { email: "init@example.com", full_name: "In It" }
              as: Customer
              captures: { icust: $.data.id }
            - call: "POST /plush-models"
              payload: { name: "Init Ibis", sku: "II-01", base_price_cents: 1500, is_licensed: false, required_stuffing_grams: 100, sound_chip_compatible: false }
              as: StoreManager
              captures: { imodel: $.data.id }
            - call: "POST /consumables"
              payload: { store_id: "${istore}", consumable_type: "STUFFING_FIBER", initial_qty: 5000 }
              as: StoreManager
          trigger:
            - call: "POST /workshops"
              payload: { store_id: "${istore}", customer_id: "${icust}", plush_model_id: "${imodel}", origin_type: "WALK_IN" }
              as: WorkshopAssociate
              captures: { iw: $.data }
          assert:
            - "iw.status == SELECT"
            - "iw.stuffing_grams_used == 0 and iw.sound_chip_used == false"
            - "iw.assigned_station_id == null"

      - name: duplicate_gift_card_code_rejected
        claim_type: unique_constraint
        grounds: [entities.GiftCard.fields.code, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "GiftCard.code is unique; a second card with the same code fails with ERR_VALIDATION (422)."
        test_recipe:
          setup: ["One gift card with code GC-DUP exists"]
          setup_api_calls:
            - call: "POST /gift-cards"
              payload: { code: "GC-DUP", initial_balance_cents: 1000 }
              as: StoreManager
          trigger:
            - call: "POST /gift-cards"
              payload: { code: "GC-DUP", initial_balance_cents: 2000 }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VALIDATION"

      - name: party_guest_count_out_of_range_rejected
        claim_type: range_constraint
        grounds: [entities.PartyReservation.fields.guest_count, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "guest_count is bounded 6..20; 5 is rejected with ERR_VALIDATION even when all other fields are valid."
        test_recipe:
          setup: ["Store and customer exist; clock at 2026-10-01"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Range Store", party_room_count: 1 }
              as: StoreManager
              captures: { gstore: $.data.id }
            - call: "POST /customers"
              payload: { email: "range@example.com", full_name: "Range R" }
              as: Customer
              captures: { gcust: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: StoreManager
          trigger:
            - call: "POST /parties"
              payload: { store_id: "${gstore}", customer_id: "${gcust}", party_start: "2026-10-10T18:00:00Z", duration_minutes: 120, guest_count: 5, package_tier: "BASIC", staffing_mode: "SELF_GUIDED" }
              as: Customer
              as_user_id: "${gcust}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VALIDATION"

  # ===========================================================================
  # Section: state_machines — invalid-from rejections, terminal lockdown
  # ===========================================================================
  - section: state_machines
    instances:
      - name: advance_step_on_paid_session_returns_invalid_state
        claim_type: terminal_lockdown
        grounds: [state_machines.WorkshopSession, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "PAID is terminal; advance-step on a PAID session fails with ERR_INVALID_STATE and no side effects fire."
        test_recipe:
          setup: ["A walk-in session fully advanced and paid"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Term Store", party_room_count: 1 }
              as: StoreManager
              captures: { tstore: $.data.id }
            - call: "POST /customers"
              payload: { email: "term@example.com", full_name: "Term T" }
              as: Customer
              captures: { tcust: $.data.id }
            - call: "POST /plush-models"
              payload: { name: "Term Tern", sku: "TT-01", base_price_cents: 1500, is_licensed: false, required_stuffing_grams: 100, sound_chip_compatible: false }
              as: StoreManager
              captures: { tmodel: $.data.id }
            - call: "POST /consumables"
              payload: { store_id: "${tstore}", consumable_type: "STUFFING_FIBER", initial_qty: 5000 }
              as: StoreManager
            - call: "POST /stations"
              payload: { store_id: "${tstore}", station_type: "STUFF", capacity: 2 }
              as: StoreManager
            - call: "POST /stations"
              payload: { store_id: "${tstore}", station_type: "SOUND", capacity: 2 }
              as: StoreManager
            - call: "POST /stations"
              payload: { store_id: "${tstore}", station_type: "BATHE", capacity: 2 }
              as: StoreManager
            - call: "POST /stations"
              payload: { store_id: "${tstore}", station_type: "DRESS", capacity: 2 }
              as: StoreManager
            - call: "POST /workshops"
              payload: { store_id: "${tstore}", customer_id: "${tcust}", plush_model_id: "${tmodel}", origin_type: "WALK_IN" }
              as: WorkshopAssociate
              captures: { tw: $.data.id }
            - call: "POST /workshops/${tw}/advance-step"
              payload: {}
              as: WorkshopAssociate
            - call: "POST /workshops/${tw}/advance-step"
              payload: {}
              as: WorkshopAssociate
            - call: "POST /workshops/${tw}/advance-step"
              payload: {}
              as: WorkshopAssociate
            - call: "POST /workshops/${tw}/advance-step"
              payload: {}
              as: WorkshopAssociate
            - call: "POST /workshops/${tw}/advance-step"
              payload: {}
              as: WorkshopAssociate
            - call: "POST /workshops/${tw}/payment"
              payload: { payment_amount_cents: 1500, pay_tender: "CASH" }
              as: Customer
              as_user_id: "${tcust}"
          trigger:
            - call: "POST /workshops/${tw}/advance-step"
              payload: {}
              as: WorkshopAssociate
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: abandon_on_abandoned_session_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.WorkshopSession]
        distinguishing_aspect: "ABANDONED is terminal; a second abandon fails with ERR_INVALID_STATE (no double restoration of consumables)."
        test_recipe:
          setup: ["A walk-in session already abandoned from SELECTED"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Dbl Store", party_room_count: 1 }
              as: StoreManager
              captures: { dstore: $.data.id }
            - call: "POST /customers"
              payload: { email: "dbl@example.com", full_name: "Dbl D" }
              as: Customer
              captures: { dcust: $.data.id }
            - call: "POST /plush-models"
              payload: { name: "Dbl Dove", sku: "DDO-01", base_price_cents: 1500, is_licensed: false, required_stuffing_grams: 100, sound_chip_compatible: false }
              as: StoreManager
              captures: { dmodel: $.data.id }
            - call: "POST /consumables"
              payload: { store_id: "${dstore}", consumable_type: "STUFFING_FIBER", initial_qty: 5000 }
              as: StoreManager
            - call: "POST /stations"
              payload: { store_id: "${dstore}", station_type: "STUFF", capacity: 2 }
              as: StoreManager
            - call: "POST /workshops"
              payload: { store_id: "${dstore}", customer_id: "${dcust}", plush_model_id: "${dmodel}", origin_type: "WALK_IN" }
              as: WorkshopAssociate
              captures: { dw: $.data.id }
            - call: "POST /workshops/${dw}/advance-step"
              payload: {}
              as: WorkshopAssociate
            - call: "POST /workshops/${dw}/abandon"
              payload: {}
              as: WorkshopAssociate
          trigger:
            - call: "POST /workshops/${dw}/abandon"
              payload: {}
              as: WorkshopAssociate
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: handoff_before_ready_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.BuildShipOrder.READY_FOR_PICKUP_to_HANDED_TO_CARRIER]
        distinguishing_aspect: "handoff is only valid from READY_FOR_PICKUP; calling it on a PLACED order fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["A build-ship order in PLACED"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Ship Corner", party_room_count: 1 }
              as: StoreManager
              captures: { hstore: $.data.id }
            - call: "POST /customers"
              payload: { email: "ship@example.com", full_name: "Ship S" }
              as: Customer
              captures: { hcust: $.data.id }
            - call: "POST /plush-models"
              payload: { name: "Ship Shark", sku: "SSH-01", base_price_cents: 2500, is_licensed: false, required_stuffing_grams: 200, sound_chip_compatible: false }
              as: StoreManager
              captures: { hmodel: $.data.id }
            - call: "POST /build-ship-orders"
              payload: { store_id: "${hstore}", customer_id: "${hcust}", plush_model_id: "${hmodel}", sound_chip_requested: false, recipient_name: "Rcpt" }
              as: Customer
              as_user_id: "${hcust}"
              captures: { horder: $.data.id }
          trigger:
            - call: "POST /build-ship-orders/${horder}/handoff"
              payload: { carrier_code: "UPS", tracking_number: "1ZX" }
              as: WorkshopAssociate
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: birth_certificate_immutable_after_payment
        claim_type: conditional_action
        grounds: [entities.StuffedAnimal.fields.birth_cert_name, "validations[priority=9]"]
        distinguishing_aspect: "birth-certificate personalization is allowed while the origin session is non-terminal but rejected once the session is PAID."
        test_recipe:
          setup: ["A paid session whose animal is COMPLETED"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Cert Store", party_room_count: 1 }
              as: StoreManager
              captures: { cstore: $.data.id }
            - call: "POST /customers"
              payload: { email: "cert@example.com", full_name: "Cert C" }
              as: Customer
              captures: { ccust: $.data.id }
            - call: "POST /plush-models"
              payload: { name: "Cert Cat", sku: "CCA-01", base_price_cents: 1500, is_licensed: false, required_stuffing_grams: 100, sound_chip_compatible: false }
              as: StoreManager
              captures: { cmodel: $.data.id }
            - call: "POST /consumables"
              payload: { store_id: "${cstore}", consumable_type: "STUFFING_FIBER", initial_qty: 5000 }
              as: StoreManager
            - call: "POST /stations"
              payload: { store_id: "${cstore}", station_type: "STUFF", capacity: 2 }
              as: StoreManager
            - call: "POST /stations"
              payload: { store_id: "${cstore}", station_type: "SOUND", capacity: 2 }
              as: StoreManager
            - call: "POST /stations"
              payload: { store_id: "${cstore}", station_type: "BATHE", capacity: 2 }
              as: StoreManager
            - call: "POST /stations"
              payload: { store_id: "${cstore}", station_type: "DRESS", capacity: 2 }
              as: StoreManager
            - call: "POST /workshops"
              payload: { store_id: "${cstore}", customer_id: "${ccust}", plush_model_id: "${cmodel}", origin_type: "WALK_IN" }
              as: WorkshopAssociate
              captures: { cw: $.data.id }
            - call: "POST /workshops/${cw}/advance-step"
              payload: {}
              as: WorkshopAssociate
            - call: "POST /workshops/${cw}/advance-step"
              payload: {}
              as: WorkshopAssociate
            - call: "POST /workshops/${cw}/advance-step"
              payload: {}
              as: WorkshopAssociate
            - call: "POST /workshops/${cw}/advance-step"
              payload: {}
              as: WorkshopAssociate
            - call: "POST /workshops/${cw}/advance-step"
              payload: {}
              as: WorkshopAssociate
            - call: "GET /workshops/${cw}"
              payload: {}
              as: Customer
              as_user_id: "${ccust}"
              captures: { canimal: $.data.stuffed_animal_id }
            - call: "POST /animals/${canimal}/birth-certificate"
              payload: { birth_cert_name: "Whiskers", birth_cert_birth_date: "2026-10-01" }
              as: Customer
              as_user_id: "${ccust}"
            - call: "POST /workshops/${cw}/payment"
              payload: { payment_amount_cents: 1500, pay_tender: "CASH" }
              as: Customer
              as_user_id: "${ccust}"
          trigger:
            - call: "POST /animals/${canimal}/birth-certificate"
              payload: { birth_cert_name: "Changed", birth_cert_birth_date: "2026-10-02" }
              as: Customer
              as_user_id: "${ccust}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (certificate locked once the origin session is PAID)"

      - name: report_lost_by_non_owner_forbidden
        claim_type: ownership_check
        grounds: [state_machines.StuffedAnimal.COMPLETED_to_LOST_REPORTED]
        distinguishing_aspect: "report-lost compares X-User-ID to StuffedAnimal.customer_id; a different Customer gets ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["Customer A's paid session produced a COMPLETED animal; Customer B exists"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Own Store", party_room_count: 1 }
              as: StoreManager
              captures: { ostore: $.data.id }
            - call: "POST /customers"
              payload: { email: "ownA@example.com", full_name: "Owner A" }
              as: Customer
              captures: { ocustA: $.data.id }
            - call: "POST /customers"
              payload: { email: "ownB@example.com", full_name: "Owner B" }
              as: Customer
              captures: { ocustB: $.data.id }
            - call: "POST /plush-models"
              payload: { name: "Own Owl", sku: "OO-01", base_price_cents: 1500, is_licensed: false, required_stuffing_grams: 100, sound_chip_compatible: false }
              as: StoreManager
              captures: { omodel: $.data.id }
            - call: "POST /consumables"
              payload: { store_id: "${ostore}", consumable_type: "STUFFING_FIBER", initial_qty: 5000 }
              as: StoreManager
            - call: "POST /stations"
              payload: { store_id: "${ostore}", station_type: "STUFF", capacity: 2 }
              as: StoreManager
            - call: "POST /stations"
              payload: { store_id: "${ostore}", station_type: "SOUND", capacity: 2 }
              as: StoreManager
            - call: "POST /stations"
              payload: { store_id: "${ostore}", station_type: "BATHE", capacity: 2 }
              as: StoreManager
            - call: "POST /stations"
              payload: { store_id: "${ostore}", station_type: "DRESS", capacity: 2 }
              as: StoreManager
            - call: "POST /workshops"
              payload: { store_id: "${ostore}", customer_id: "${ocustA}", plush_model_id: "${omodel}", origin_type: "WALK_IN" }
              as: WorkshopAssociate
              captures: { ow: $.data.id }
            - call: "POST /workshops/${ow}/advance-step"
              payload: {}
              as: WorkshopAssociate
            - call: "POST /workshops/${ow}/advance-step"
              payload: {}
              as: WorkshopAssociate
            - call: "POST /workshops/${ow}/advance-step"
              payload: {}
              as: WorkshopAssociate
            - call: "POST /workshops/${ow}/advance-step"
              payload: {}
              as: WorkshopAssociate
            - call: "POST /workshops/${ow}/advance-step"
              payload: {}
              as: WorkshopAssociate
            - call: "POST /workshops/${ow}/payment"
              payload: { payment_amount_cents: 1500, pay_tender: "CASH" }
              as: Customer
              as_user_id: "${ocustA}"
            - call: "GET /workshops/${ow}"
              payload: {}
              as: Customer
              as_user_id: "${ocustA}"
              captures: { oanimal: $.data.stuffed_animal_id }
          trigger:
            - call: "POST /animals/${oanimal}/report-lost"
              payload: {}
              as: Customer
              as_user_id: "${ocustB}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHORIZED (Customer B does not own the animal)"

  # ===========================================================================
  # Section: calculations — boundary variants of calc rules not already
  # exercised by §1.8 instances
  # ===========================================================================
  - section: calculations
    instances:
      - name: ultimate_deposit_uses_floor_when_per_guest_below_floor
        claim_type: constants_applied
        grounds: [calculations.party_deposit_required]
        distinguishing_aspect: "For ULTIMATE, deposit = max(guest_count*1000, 20000); at 12 guests the floor binds (20000 > 12000)."
        test_recipe:
          setup: ["Store and customer; clock 2026-10-01"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Floor Store", party_room_count: 1 }
              as: StoreManager
              captures: { fstore: $.data.id }
            - call: "POST /customers"
              payload: { email: "floor@example.com", full_name: "Floor F" }
              as: Customer
              captures: { fcust: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: StoreManager
          trigger:
            - call: "POST /parties"
              payload: { store_id: "${fstore}", customer_id: "${fcust}", party_start: "2026-10-10T18:00:00Z", duration_minutes: 120, guest_count: 12, package_tier: "ULTIMATE", staffing_mode: "SELF_GUIDED" }
              as: Customer
              as_user_id: "${fcust}"
              captures: { fparty: $.data }
          assert:
