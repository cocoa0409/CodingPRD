scaffold_corner_design:
  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: tour_creation_returns_201_with_fields
        claim_type: creation
        grounds: [entities.Tour, endpoints]
        distinguishing_aspect: "POST /tours with all required fields returns 201 and echoes name/destination/nights/base_price_cents plus system id."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /tours"
              payload: { name: "Athens Odyssey", destination: "Greece", nights: 6, base_price_cents: 210000 }
              as: Operator
              captures: { tour_id: $.data.id }
          assert:
            - "response status == 201"
            - "Tour.${tour_id}.name == 'Athens Odyssey' and nights == 6 and base_price_cents == 210000"
            - "response.data.id is a server-minted UUID"

      - name: enrollment_missing_traveler_gender_returns_validation
        claim_type: required_fields
        grounds: [entities.Enrollment.fields.traveler_gender, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /enrollments without required traveler_gender returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["An OPEN departure exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-18T00:00:00Z" }
              as: Operator
            - call: "POST /tours"
              payload: { name: "Rome Classics", destination: "Italy", nights: 7, base_price_cents: 250000 }
              as: Operator
              captures: { tour_id: $.data.id }
            - call: "POST /group-leaders"
              payload: { full_name: "Ms Rivera", email: "c1@lincoln.edu", school_name: "Lincoln HS" }
              as: Operator
              captures: { gl_id: $.data.id }
            - call: "POST /departures"
              payload: { tour_id: "${tour_id}", group_leader_id: "${gl_id}", depart_date: "2026-11-01T00:00:00Z", return_date: "2026-11-08T00:00:00Z", enrollment_deadline: "2026-09-01T00:00:00Z", early_bird_cutoff: "2026-08-01T00:00:00Z", capacity: 30, price_per_traveler_cents: 250000, min_to_guarantee: 10 }
              as: Operator
              captures: { dep_id: $.data.id }
            - call: "POST /departures/${dep_id}/open"
              payload: {}
              as: Operator
          trigger:
            - call: "POST /enrollments"
              payload: { departure_id: "${dep_id}", traveler_name: "No Gender", traveler_dob: "2010-05-01T00:00:00Z" }
              as: Operator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400"
            - "response.error_id == ERR_VALIDATION"

      - name: departure_get_nonexistent_returns_not_found
        claim_type: not_found
        grounds: [entities.Departure, "errors[ERR_DEPARTURE_NOT_FOUND]"]
        distinguishing_aspect: "GET /departures/{id} with an unknown UUID returns ERR_DEPARTURE_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /departures/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Operator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "response.error_id == ERR_DEPARTURE_NOT_FOUND"

      - name: enrollment_price_locked_is_computed_input_ignored
        claim_type: computed_fields
        grounds: [entities.Enrollment.fields.price_locked_cents, calculations.enrollment_price]
        distinguishing_aspect: "price_locked_cents is computed from calculations.enrollment_price; a plain enrollment (no add-ons/insurance, clock after early-bird) locks exactly price_per_traveler_cents 250000."
        test_recipe:
          setup: ["OPEN departure priced 250000; clock 2026-08-18 (after early_bird_cutoff)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-18T00:00:00Z" }
              as: Operator
            - call: "POST /tours"
              payload: { name: "Rome Classics", destination: "Italy", nights: 7, base_price_cents: 250000 }
              as: Operator
              captures: { tour_id: $.data.id }
            - call: "POST /group-leaders"
              payload: { full_name: "Ms Rivera", email: "c2@lincoln.edu", school_name: "Lincoln HS" }
              as: Operator
              captures: { gl_id: $.data.id }
            - call: "POST /departures"
              payload: { tour_id: "${tour_id}", group_leader_id: "${gl_id}", depart_date: "2026-11-01T00:00:00Z", return_date: "2026-11-08T00:00:00Z", enrollment_deadline: "2026-09-01T00:00:00Z", early_bird_cutoff: "2026-08-01T00:00:00Z", capacity: 30, price_per_traveler_cents: 250000, min_to_guarantee: 10 }
              as: Operator
              captures: { dep_id: $.data.id }
            - call: "POST /departures/${dep_id}/open"
              payload: {}
              as: Operator
          trigger:
            - call: "POST /enrollments"
              payload: { departure_id: "${dep_id}", traveler_name: "Plain P", traveler_dob: "2010-05-01T00:00:00Z", traveler_gender: "MALE" }
              as: Operator
              captures: { enr_id: $.data.id, price: $.data.price_locked_cents }
          assert:
            - "Enrollment.${enr_id}.price_locked_cents == 250000"

  # =========================================================================
  # State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: cancel_already_cancelled_enrollment_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Enrollment.PENDING_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A second POST /enrollments/{id}/cancel on an already-CANCELLED enrollment returns ERR_INVALID_STATE; no new refund side effects fire."
        test_recipe:
          setup: ["OPEN departure; enrollment; deposit paid; cancelled once (lifecycle_status CANCELLED)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-18T00:00:00Z" }
              as: Operator
            - call: "POST /tours"
              payload: { name: "Rome Classics", destination: "Italy", nights: 7, base_price_cents: 250000 }
              as: Operator
              captures: { tour_id: $.data.id }
            - call: "POST /group-leaders"
              payload: { full_name: "Ms Rivera", email: "c3@lincoln.edu", school_name: "Lincoln HS" }
              as: Operator
              captures: { gl_id: $.data.id }
            - call: "POST /departures"
              payload: { tour_id: "${tour_id}", group_leader_id: "${gl_id}", depart_date: "2026-11-01T00:00:00Z", return_date: "2026-11-08T00:00:00Z", enrollment_deadline: "2026-09-01T00:00:00Z", early_bird_cutoff: "2026-08-01T00:00:00Z", capacity: 30, price_per_traveler_cents: 250000, min_to_guarantee: 10 }
              as: Operator
              captures: { dep_id: $.data.id }
            - call: "POST /departures/${dep_id}/open"
              payload: {}
              as: Operator
            - call: "POST /enrollments"
              payload: { departure_id: "${dep_id}", traveler_name: "Twice C", traveler_dob: "2010-05-01T00:00:00Z", traveler_gender: "MALE" }
              as: Operator
              captures: { enr_id: $.data.id, enr_ver: $.data.version }
            - call: "POST /payment-plans"
              payload: { enrollment_id: "${enr_id}", installment_count: 1, expected_enrollment_version: "${enr_ver}" }
              as: Operator
              captures: { plan_id: $.data.id }
            - call: "POST /payments"
              payload: { payment_plan_id: "${plan_id}", amount_cents: 30000, kind: "DEPOSIT" }
              as: Operator
            - call: "POST /enrollments/${enr_id}/cancel"
              payload: { reason: "traveler" }
              as: Operator
          trigger:
            - call: "POST /enrollments/${enr_id}/cancel"
              payload: { reason: "traveler" }
              as: Operator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response.error_id == ERR_INVALID_STATE"

      - name: guarantee_below_min_returns_guarantee_not_met
        claim_type: precondition_enforcement
        grounds: [state_machines.Departure.OPEN_to_GUARANTEED, "errors[ERR_GUARANTEE_NOT_MET]"]
        distinguishing_aspect: "POST /departures/{id}/guarantee with active_enrollment_count 1 < min_to_guarantee 10 returns ERR_GUARANTEE_NOT_MET; departure stays OPEN."
        test_recipe:
          setup: ["OPEN departure, min_to_guarantee 10, only one enrollment."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-18T00:00:00Z" }
              as: Operator
            - call: "POST /tours"
              payload: { name: "Rome Classics", destination: "Italy", nights: 7, base_price_cents: 250000 }
              as: Operator
              captures: { tour_id: $.data.id }
            - call: "POST /group-leaders"
              payload: { full_name: "Ms Rivera", email: "c4@lincoln.edu", school_name: "Lincoln HS" }
              as: Operator
              captures: { gl_id: $.data.id }
            - call: "POST /departures"
              payload: { tour_id: "${tour_id}", group_leader_id: "${gl_id}", depart_date: "2026-11-01T00:00:00Z", return_date: "2026-11-08T00:00:00Z", enrollment_deadline: "2026-09-01T00:00:00Z", early_bird_cutoff: "2026-08-01T00:00:00Z", capacity: 30, price_per_traveler_cents: 250000, min_to_guarantee: 10 }
              as: Operator
              captures: { dep_id: $.data.id }
            - call: "POST /departures/${dep_id}/open"
              payload: {}
              as: Operator
            - call: "POST /enrollments"
              payload: { departure_id: "${dep_id}", traveler_name: "Solo S", traveler_dob: "2010-05-01T00:00:00Z", traveler_gender: "MALE" }
              as: Operator
          trigger:
            - call: "POST /departures/${dep_id}/guarantee"
              payload: {}
              as: Operator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response.error_id == ERR_GUARANTEE_NOT_MET"

      - name: supplier_booking_confirm_requires_departure_guaranteed
        claim_type: precondition_enforcement
        grounds: [state_machines.SupplierBooking.HELD_to_CONFIRMED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /supplier-bookings/{id}/confirm while the parent departure is only OPEN (not GUARANTEED) returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["OPEN departure; one HOTEL supplier; a HELD booking."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T00:00:00Z" }
              as: Operator
            - call: "POST /tours"
              payload: { name: "Rome Classics", destination: "Italy", nights: 7, base_price_cents: 250000 }
              as: Operator
              captures: { tour_id: $.data.id }
            - call: "POST /group-leaders"
              payload: { full_name: "Ms Rivera", email: "c5@lincoln.edu", school_name: "Lincoln HS" }
              as: Operator
              captures: { gl_id: $.data.id }
            - call: "POST /departures"
              payload: { tour_id: "${tour_id}", group_leader_id: "${gl_id}", depart_date: "2026-11-01T00:00:00Z", return_date: "2026-11-08T00:00:00Z", enrollment_deadline: "2026-09-01T00:00:00Z", early_bird_cutoff: "2026-08-01T00:00:00Z", capacity: 30, price_per_traveler_cents: 250000, min_to_guarantee: 10 }
              as: Operator
              captures: { dep_id: $.data.id }
            - call: "POST /departures/${dep_id}/open"
              payload: {}
              as: Operator
            - call: "POST /suppliers"
              payload: { name: "Hotel Roma", service_type: "HOTEL", city: "Rome" }
              as: Operator
              captures: { sup_id: $.data.id }
            - call: "POST /supplier-bookings"
              payload: { departure_id: "${dep_id}", supplier_id: "${sup_id}", service_window_start: "2026-11-01T00:00:00Z", service_window_end: "2026-11-04T00:00:00Z", room_block: 10, cost_cents: 500000 }
              as: Operator
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /supplier-bookings/${b_id}/confirm"
              payload: {}
              as: Operator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response.error_id == ERR_INVALID_STATE"

      - name: permission_form_review_on_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.PermissionForm.SUBMITTED_to_APPROVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /permission-forms/{id}/review on a DRAFT (never-submitted) form returns ERR_INVALID_STATE (review only applies from SUBMITTED)."
        test_recipe:
          setup: ["OPEN departure; enrollment; a permission form created but NOT submitted (DRAFT)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-18T00:00:00Z" }
              as: Operator
            - call: "POST /tours"
              payload: { name: "Rome Classics", destination: "Italy", nights: 7, base_price_cents: 250000 }
              as: Operator
              captures: { tour_id: $.data.id }
            - call: "POST /group-leaders"
              payload: { full_name: "Ms Rivera", email: "c6@lincoln.edu", school_name: "Lincoln HS" }
              as: Operator
              captures: { gl_id: $.data.id }
            - call: "POST /departures"
              payload: { tour_id: "${tour_id}", group_leader_id: "${gl_id}", depart_date: "2026-11-01T00:00:00Z", return_date: "2026-11-08T00:00:00Z", enrollment_deadline: "2026-09-01T00:00:00Z", early_bird_cutoff: "2026-08-01T00:00:00Z", capacity: 30, price_per_traveler_cents: 250000, min_to_guarantee: 10 }
              as: Operator
              captures: { dep_id: $.data.id }
            - call: "POST /departures/${dep_id}/open"
              payload: {}
              as: Operator
            - call: "POST /enrollments"
              payload: { departure_id: "${dep_id}", traveler_name: "Draft D", traveler_dob: "2010-05-01T00:00:00Z", traveler_gender: "FEMALE" }
              as: Operator
              captures: { enr_id: $.data.id }
            - call: "POST /permission-forms"
              payload: { enrollment_id: "${enr_id}", passport_number: "Y7654321", passport_expiry: "2031-01-01T00:00:00Z", guardian_consent: true }
              as: Operator
              captures: { pf_id: $.data.id }
          trigger:
            - call: "POST /permission-forms/${pf_id}/review"
              payload: { decision: "APPROVE" }
              as: Operator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response.error_id == ERR_INVALID_STATE"

      - name: guarantee_with_no_chaperones_returns_not_enough_chaperones
        claim_type: precondition_enforcement
        grounds: [state_machines.Departure.OPEN_to_GUARANTEED, "errors[ERR_NOT_ENOUGH_CHAPERONES]"]
        distinguishing_aspect: "With active_enrollment_count 2 >= min_to_guarantee 2 but ZERO confirmed chaperones (ceil(2/6)=1 required), guarantee returns ERR_NOT_ENOUGH_CHAPERONES."
        test_recipe:
          setup: ["OPEN departure, min_to_guarantee 2, ratio 6; two enrollments; no chaperones."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-18T00:00:00Z" }
              as: Operator
            - call: "POST /tours"
              payload: { name: "Rome Classics", destination: "Italy", nights: 7, base_price_cents: 250000 }
              as: Operator
              captures: { tour_id: $.data.id }
            - call: "POST /group-leaders"
              payload: { full_name: "Ms Rivera", email: "c7@lincoln.edu", school_name: "Lincoln HS" }
              as: Operator
              captures: { gl_id: $.data.id }
            - call: "POST /departures"
              payload: { tour_id: "${tour_id}", group_leader_id: "${gl_id}", depart_date: "2026-11-01T00:00:00Z", return_date: "2026-11-08T00:00:00Z", enrollment_deadline: "2026-09-01T00:00:00Z", early_bird_cutoff: "2026-08-01T00:00:00Z", capacity: 30, price_per_traveler_cents: 250000, min_to_guarantee: 2, chaperone_ratio: 6 }
              as: Operator
              captures: { dep_id: $.data.id }
            - call: "POST /departures/${dep_id}/open"
              payload: {}
              as: Operator
            - call: "POST /enrollments"
              payload: { departure_id: "${dep_id}", traveler_name: "G1", traveler_dob: "2010-05-01T00:00:00Z", traveler_gender: "MALE" }
              as: Operator
            - call: "POST /enrollments"
              payload: { departure_id: "${dep_id}", traveler_name: "G2", traveler_dob: "2010-05-02T00:00:00Z", traveler_gender: "MALE" }
              as: Operator
          trigger:
            - call: "POST /departures/${dep_id}/guarantee"
              payload: {}
              as: Operator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response.error_id == ERR_NOT_ENOUGH_CHAPERONES"

      - name: cancel_from_already_cancelled_enrollment_covered_by_state_stub
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Enrollment.terminal_states]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / payment_state_beats_fiscal_on_refunded_plan
          rationale: "Terminal/refunded-plan lockdown on payments is exercised by that §1.8 instance."

  # =========================================================================
  # Validations
  # =========================================================================
  - section: validations
    instances:
      - name: enrollment_after_deadline_returns_enrollment_closed
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_ENROLLMENT_CLOSED]"]
        distinguishing_aspect: "POST /enrollments when clock (2026-09-02) is past enrollment_deadline (2026-09-01) returns ERR_ENROLLMENT_CLOSED (422)."
        test_recipe:
          setup: ["OPEN departure with enrollment_deadline 2026-09-01; clock advanced to 2026-09-02."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T00:00:00Z" }
              as: Operator
            - call: "POST /tours"
              payload: { name: "Rome Classics", destination: "Italy", nights: 7, base_price_cents: 250000 }
              as: Operator
              captures: { tour_id: $.data.id }
            - call: "POST /group-leaders"
              payload: { full_name: "Ms Rivera", email: "c8@lincoln.edu", school_name: "Lincoln HS" }
              as: Operator
              captures: { gl_id: $.data.id }
            - call: "POST /departures"
              payload: { tour_id: "${tour_id}", group_leader_id: "${gl_id}", depart_date: "2026-11-01T00:00:00Z", return_date: "2026-11-08T00:00:00Z", enrollment_deadline: "2026-09-01T00:00:00Z", early_bird_cutoff: "2026-08-01T00:00:00Z", capacity: 30, price_per_traveler_cents: 250000, min_to_guarantee: 10 }
              as: Operator
              captures: { dep_id: $.data.id }
            - call: "POST /departures/${dep_id}/open"
              payload: {}
              as: Operator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: Operator
          trigger:
            - call: "POST /enrollments"
              payload: { departure_id: "${dep_id}", traveler_name: "Late L", traveler_dob: "2010-05-01T00:00:00Z", traveler_gender: "MALE" }
              as: Operator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "response.error_id == ERR_ENROLLMENT_CLOSED"

      - name: enrollment_when_no_seats_returns_departure_full
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_DEPARTURE_FULL]"]
        distinguishing_aspect: "Departure capacity 1 with one active enrollment (available_seats 0): a second POST /enrollments returns ERR_DEPARTURE_FULL (409)."
        test_recipe:
          setup: ["OPEN departure capacity 1; one enrollment already active (available_seats 0)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-18T00:00:00Z" }
              as: Operator
            - call: "POST /tours"
              payload: { name: "Rome Classics", destination: "Italy", nights: 7, base_price_cents: 250000 }
              as: Operator
              captures: { tour_id: $.data.id }
            - call: "POST /group-leaders"
              payload: { full_name: "Ms Rivera", email: "c9@lincoln.edu", school_name: "Lincoln HS" }
              as: Operator
              captures: { gl_id: $.data.id }
            - call: "POST /departures"
              payload: { tour_id: "${tour_id}", group_leader_id: "${gl_id}", depart_date: "2026-11-01T00:00:00Z", return_date: "2026-11-08T00:00:00Z", enrollment_deadline: "2026-09-01T00:00:00Z", early_bird_cutoff: "2026-08-01T00:00:00Z", capacity: 1, price_per_traveler_cents: 250000, min_to_guarantee: 1 }
              as: Operator
              captures: { dep_id: $.data.id }
            - call: "POST /departures/${dep_id}/open"
              payload: {}
              as: Operator
            - call: "POST /enrollments"
              payload: { departure_id: "${dep_id}", traveler_name: "Seat One", traveler_dob: "2010-05-01T00:00:00Z", traveler_gender: "MALE" }
              as: Operator
          trigger:
            - call: "POST /enrollments"
              payload: { departure_id: "${dep_id}", traveler_name: "Seat Two", traveler_dob: "2010-05-02T00:00:00Z", traveler_gender: "MALE" }
              as: Operator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response.error_id == ERR_DEPARTURE_FULL"

      - name: payment_over_balance_returns_payment_exceeds_balance
        claim_type: violation_to_error
        grounds: ["validations[priority=14]", "errors[ERR_PAYMENT_EXCEEDS_BALANCE]"]
        distinguishing_aspect: "On an ACTIVE plan (total 250000, nothing paid), a payment of 260000 exceeds the remaining balance and returns ERR_PAYMENT_EXCEEDS_BALANCE (422)."
        test_recipe:
          setup: ["OPEN departure; enrollment (price 250000); ACTIVE plan; no payments yet."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-18T00:00:00Z" }
              as: Operator
            - call: "POST /tours"
              payload: { name: "Rome Classics", destination: "Italy", nights: 7, base_price_cents: 250000 }
              as: Operator
              captures: { tour_id: $.data.id }
            - call: "POST /group-leaders"
              payload: { full_name: "Ms Rivera", email: "c10@lincoln.edu", school_name: "Lincoln HS" }
              as: Operator
              captures: { gl_id: $.data.id }
            - call: "POST /departures"
              payload: { tour_id: "${tour_id}", group_leader_id: "${gl_id}", depart_date: "2026-11-01T00:00:00Z", return_date: "2026-11-08T00:00:00Z", enrollment_deadline: "2026-09-01T00:00:00Z", early_bird_cutoff: "2026-08-01T00:00:00Z", capacity: 30, price_per_traveler_cents: 250000, min_to_guarantee: 10 }
              as: Operator
              captures: { dep_id: $.data.id }
            - call: "POST /departures/${dep_id}/open"
              payload: {}
              as: Operator
            - call: "POST /enrollments"
