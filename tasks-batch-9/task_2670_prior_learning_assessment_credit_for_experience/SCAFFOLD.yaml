scenario: |
  Generate task harder than expert level!

  2670. Prior Learning Assessment & Credit for Experience (university prior learning assessment office): eligible credit sources including credit-by-exam, portfolio, military training and industry credential crosswalks, portfolio submission with artifacts mapped to course learning outcomes, faculty assessor assignment, rubric scoring and appeal process, maximum prior learning credit caps by program and residency requirements, fee structure and financial aid ineligibility for assessment fees, articulation of national credential recommendations to local course equivalencies, transcript posting and graduation audit interaction, assessment turnaround service levels
domain_name: "prior-learning-assessment"
api_prefix: "/"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: graph
  # ArticulationRule is a junction across CredentialRecommendation x Course;
  # PlaClaim.supersedes_claim_id is self-referential; Artifact.outcome_mappings
  # forms an artifact -> learning-outcome many-to-many payload. No nested URL
  # ownership chain: every aggregate root is addressed at the collection root.

  state_machine_shape: cyclic
  # PlaClaim carries three independent state dimensions (assessment_status x
  # fee_status x credit_status) and cycles DENIED -> APPEAL_PENDING ->
  # UNDER_ASSESSMENT (remand) and UNDER_ASSESSMENT -> REVISION_REQUESTED ->
  # SUBMITTED; Portfolio cycles SUBMITTED -> REVISION_REQUESTED -> SUBMITTED;
  # ArticulationRule cycles APPROVED -> SUSPENDED -> APPROVED.

  relationship_patterns:
    - one_to_many        # Course -> LearningOutcome, Portfolio -> Artifact, AssessorAssignment -> RubricScore
    - many_to_many       # CredentialRecommendation <-> Course via ArticulationRule
    - self_referential   # PlaClaim.supersedes_claim_id -> PlaClaim.id
    - cross_aggregate    # PlaClaim award mutates Student ledger and sibling PlaClaims
    - polymorphic        # PlaClaim.source_type selects which evidence channel (portfolio vs articulation rule) is authoritative

  role_model: segregation_of_duties
  # (i) the ArticulationOfficer who submits a rule for review may not approve it;
  # (ii) the FacultyAssessor who scored a claim may not decide its appeal;
  # (iii) only Registrar posts to the transcript, never the PlaCoordinator who awarded.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Program
    parent: null
    common_fields: true
    fields:
      - name: program_code
        type: string
        source: input
        description: "Catalog code of the degree program."
        constraints: "unique across Program; 2-16 uppercase alphanumeric chars"
      - name: title
        type: string
        source: input
        description: "Human-readable program title."
      - name: total_credits_required
        type: integer
        source: input
        description: "Total credits required to graduate."
        constraints: ">= 30"
      - name: residency_min_credits
        type: integer
        source: input
        description: "Credits that MUST be earned in residence at this institution. Neither transfer credit nor prior-learning credit ever counts toward residency."
        constraints: ">= 0 and <= total_credits_required"
      - name: pla_max_credits
        type: integer
        source: input
        description: "Absolute ceiling on prior-learning credits the program will accept."
        constraints: ">= 0"
      - name: pla_max_pct_bp
        type: integer
        source: input
        description: "Percentage ceiling on prior-learning credits, in basis points of total_credits_required."
        constraints: "0..10000"
      - name: pla_upper_division_max_credits
        type: integer
        source: input
        description: "Sub-cap on prior-learning credits earned against courses whose level is UPPER."
        constraints: ">= 0"
      - name: pla_pass_threshold_bp
        type: integer
        source: input
        description: "Program override of the verified-coverage pass threshold; when null, PASS_THRESHOLD_BP (7000) applies."
        default: null
        constraints: "null or 1..10000"
      - name: allowed_source_types
        type: array
        source: input
        description: "Non-empty subset of the four eligible credit sources this program accepts."
        constraints: "non-empty subset of {CREDIT_BY_EXAM, PORTFOLIO, MILITARY_TRAINING, INDUSTRY_CREDENTIAL}"
      - name: status
        type: enum
        source: system
        description: "Lifecycle of the program record; INACTIVE programs block award and transcript posting."
        default: "ACTIVE"
        constraints: "ACTIVE | INACTIVE"
      - name: effective_pla_cap_credits
        type: integer
        source: computed
        description: "Cross-entity derived cap = min(pla_max_credits, floor(total_credits_required * pla_max_pct_bp / 10000)); see calculations.program_pla_credit_capacity."

  - name: Course
    parent: null
    common_fields: true
    fields:
      - name: course_code
        type: string
        source: input
        description: "Catalog code of the course."
        constraints: "unique across Course"
      - name: title
        type: string
        source: input
        description: "Course title."
      - name: department_code
        type: string
        source: input
        description: "Owning department; assessor eligibility matches on this value."
        constraints: "2-8 uppercase chars"
      - name: credits
        type: integer
        source: input
        description: "Credit hours the course carries."
        constraints: "1..12"
      - name: level
        type: enum
        source: input
        description: "Division of the course."
        constraints: "LOWER | UPPER"
      - name: pla_eligible
        type: boolean
        source: input
        description: "Whether prior-learning credit may be claimed against this course."
        default: true
      - name: outcome_count
        type: integer
        source: computed
        description: "Number of LearningOutcome rows whose course_id is this course."

  - name: LearningOutcome
    parent: Course
    common_fields: false
    fields:
      - name: course_id
        type: string
        source: system
        description: "FK -> Course.id; set from the path/parent at creation and immutable."
      - name: outcome_code
        type: string
        source: input
        description: "Stable outcome label; also the deterministic list sort key."
        constraints: "unique within course_id; 1-12 chars"
      - name: description
        type: string
        source: input
        description: "Prose statement of the learning outcome."
      - name: weight_bp
        type: integer
        source: input
        description: "Relative weight of this outcome inside the course, in basis points."
        constraints: "1..10000; the weight_bp of all outcomes of one course MUST sum to exactly 10000"
      - name: mastery_threshold_bp
        type: integer
        source: input
        description: "Score ratio at or above which a rubric score marks this outcome met."
        default: 7000
        constraints: "1..10000"

  - name: CredentialRecommendation
    parent: null
    common_fields: true
    fields:
      - name: source_type
        type: enum
        source: input
        description: "Which national credit source this recommendation comes from."
        constraints: "CREDIT_BY_EXAM | MILITARY_TRAINING | INDUSTRY_CREDENTIAL (PORTFOLIO has no national recommendation)"
      - name: credential_code
        type: string
        source: input
        description: "Code of the exam, military course, or industry credential."
        constraints: "unique per (source_type, credential_code)"
      - name: title
        type: string
        source: input
        description: "Title of the credential."
      - name: issuing_body
        type: string
        source: input
        description: "Organization publishing the credit recommendation."
      - name: recommended_credits
        type: integer
        source: input
        description: "Credit hours the national body recommends."
        constraints: "1..12"
      - name: recommended_level
        type: enum
        source: input
        description: "Division the national body recommends."
        constraints: "LOWER | UPPER"
      - name: effective_from
        type: datetime
        source: input
        description: "Inclusive start of the recommendation validity window (ISO 8601 UTC)."
      - name: effective_to
        type: datetime
        source: input
        description: "Exclusive end of the recommendation validity window; null means open-ended."
        default: null
      - name: status
        type: enum
        source: system
        description: "Publication lifecycle."
        default: "DRAFT"
        constraints: "DRAFT | PUBLISHED | RETIRED"
      - name: approved_rule_count
        type: integer
        source: computed
        description: "Count of ArticulationRule rows referencing this recommendation whose status is APPROVED."
        default: 0
      - name: terms_version
        type: integer
        source: system
        description: "Revision counter for the recommendation's substantive TERMS (recommended_credits, recommended_level, title, effective_to). Incremented by PATCH /credential-recommendations/{recommendation_id} ONLY — publish, retire, and the rule lifecycle (submit-for-review, approve, suspend, reinstate) bump the row's generic optimistic-concurrency version but deliberately leave terms_version alone. ArticulationRule.pinned_recommendation_version is pinned to this counter, never to version, so approving one rule does not staleize its siblings."
        default: 1
      - name: retire_reason
        type: string
        source: system
        description: "Reason captured when the recommendation is retired."
        default: null

  - name: ArticulationRule
    parent: null
    common_fields: true
    fields:
      - name: recommendation_id
        type: string
        source: input
        description: "FK -> CredentialRecommendation.id; the national recommendation being articulated."
      - name: course_id
        type: string
        source: input
        description: "FK -> Course.id; the local course equivalency."
      - name: awarded_credits
        type: integer
        source: input
        description: "Local credit hours granted by this equivalency."
        constraints: "1..12; <= CredentialRecommendation.recommended_credits"
      - name: effective_from
        type: datetime
        source: input
        description: "Inclusive start of the equivalency window (ISO 8601 UTC)."
      - name: effective_to
        type: datetime
        source: input
        description: "Exclusive end of the equivalency window; null means open-ended."
        default: null
      - name: status
        type: enum
        source: system
        description: "Review lifecycle of the crosswalk entry."
        default: "DRAFT"
        constraints: "DRAFT | UNDER_REVIEW | APPROVED | SUSPENDED | RETIRED"
      - name: pinned_recommendation_version
        type: integer
        source: system
        description: "CredentialRecommendation.terms_version observed at approval (NOT the generic OCC version); award and posting re-validate it against the recommendation's current terms_version."
        default: null
      - name: reviewed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ArticulationOfficer who submitted this rule for review."
        default: null
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ArticulationOfficer who approved this rule; MUST differ from reviewed_by_user_id."
        default: null
      - name: suspend_reason
        type: enum
        source: system
        description: "Why the rule left APPROVED."
        default: null
        constraints: "null | MANUAL_REVIEW | RECOMMENDATION_RETIRED"

  - name: Student
    parent: null
    common_fields: true
    fields:
      - name: student_number
        type: string
        source: input
        description: "Registrar-issued student number."
        constraints: "unique across Student"
      - name: full_name
        type: string
        source: input
        description: "Student name."
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id; the program whose caps and residency rule govern this student."
      - name: enrollment_status
        type: enum
        source: input
        description: "Registrar enrollment state; only MATRICULATED students may submit claims."
        default: "MATRICULATED"
        constraints: "APPLICANT | MATRICULATED | WITHDRAWN | GRADUATED"
      - name: transfer_credits_accepted
        type: integer
        source: input
        description: "Credits already accepted by transfer; consumes the same non-residency headroom as prior-learning credit."
        default: 0
        constraints: ">= 0"
      - name: institutional_credits_earned
        type: integer
        source: input
        description: "Credits earned in residence at this institution."
        default: 0
        constraints: ">= 0"
      - name: pla_credits_reserved
        type: integer
        source: computed
        description: "Credits held against the cap by claims in {SUBMITTED, UNDER_ASSESSMENT, REVISION_REQUESTED, SCORED}."
        default: 0
      - name: pla_credits_awarded
        type: integer
        source: computed
        description: "Credits awarded but not yet posted to the transcript."
        default: 0
      - name: pla_credits_posted
        type: integer
        source: computed
        description: "Credits posted to the transcript and not reversed."
        default: 0
      - name: pla_upper_division_committed
        type: integer
        source: computed
        description: "Sum of credits_requested (or credits_awarded once awarded) over this student's claims whose course.level == UPPER and whose assessment_status is in {SUBMITTED, UNDER_ASSESSMENT, REVISION_REQUESTED, SCORED, AWARDED}, plus posted upper-division credits."
        default: 0
      - name: fee_paid_net_cents
        type: integer
        source: computed
        description: "Cross-entity derived ledger: sum over this student's FeeInvoice rows of (paid_cents - refunded_cents)."
        default: 0

  - name: FacultyAssessor
    parent: null
    common_fields: true
    fields:
      - name: employee_number
        type: string
        source: input
        description: "Faculty employee number; deterministic final tie-break key for assessor selection."
        constraints: "unique across FacultyAssessor"
      - name: full_name
        type: string
        source: input
        description: "Assessor name."
      - name: department_code
        type: string
        source: input
        description: "Department the assessor may assess for; must equal Course.department_code to be eligible."
      - name: credential_rank
        type: integer
        source: input
        description: "Assessor credential tier; UPPER-division courses require rank >= 3, LOWER-division rank >= 2."
        constraints: "1..3"
      - name: max_concurrent_assignments
        type: integer
        source: input
        description: "Maximum number of buffered assignment windows the assessor may hold at once."
        constraints: "1..10"
      - name: appeal_panel_member
        type: boolean
        source: input
        description: "Whether this assessor may act under the AppealReviewer role."
        default: false
      - name: status
        type: enum
        source: input
        description: "Availability state; only ACTIVE assessors are selectable or may accept."
        default: "ACTIVE"
        constraints: "ACTIVE | ON_LEAVE | INACTIVE"
      - name: active_assignment_count
        type: integer
        source: computed
        description: "Count of AssessorAssignment rows for this assessor whose status is in {ASSIGNED, ACCEPTED}; primary ranking key of the selector."
        default: 0

  - name: PlaClaim
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the claimant."
      - name: course_id
        type: string
        source: input
        description: "FK -> Course.id; the course credit is claimed against."
      - name: articulation_rule_id
        type: string
        source: input
        description: "FK -> ArticulationRule.id; required for every source_type other than PORTFOLIO, forbidden for PORTFOLIO."
        default: null
      - name: supersedes_claim_id
        type: string
        source: input
        description: "FK -> PlaClaim.id; self-referential link to a DENIED_FINAL or WITHDRAWN claim this attempt replaces."
        default: null
      - name: claim_number
        type: integer
        source: system
        description: "Per-student monotonic sequence starting at 1; deterministic final tie-break key wherever created_at ties."
      - name: source_type
        type: enum
        source: input
        description: "Eligible credit source being used."
        constraints: "CREDIT_BY_EXAM | PORTFOLIO | MILITARY_TRAINING | INDUSTRY_CREDENTIAL"
      - name: credits_requested
        type: integer
        source: input
        description: "Credit hours requested."
        constraints: ">= 1 and <= Course.credits"
      - name: credits_awarded
        type: integer
        source: system
        description: "Credit hours actually granted at award time."
        default: null
      - name: attempt_date
        type: datetime
        source: input
        description: "Date the exam was passed or the training completed; required for every source_type other than PORTFOLIO."
        default: null
      - name: rush_requested
        type: boolean
        source: input
        description: "Student requested expedited turnaround (adds the rush surcharge line and halves the SLA)."
        default: false
      - name: priority_tier
        type: enum
        source: system
        description: "STANDARD, or EXPEDITED when rush_requested is true at submit or after an SLA breach."
        default: "STANDARD"
        constraints: "STANDARD | EXPEDITED"
      - name: assessment_status
        type: enum
        source: system
        description: "Assessment dimension of the claim lifecycle."
        default: "DRAFT"
        constraints: "DRAFT | SUBMITTED | UNDER_ASSESSMENT | REVISION_REQUESTED | SCORED | CAP_BLOCKED | AWARDED | DENIED | APPEAL_PENDING | DENIED_FINAL | WITHDRAWN"
      - name: fee_status
        type: enum
        source: system
        description: "Fee dimension of the claim lifecycle; evolves independently of assessment_status."
        default: "UNBILLED"
        constraints: "UNBILLED | INVOICED | PARTIALLY_PAID | PAID | WAIVED | REFUNDED | RETAINED"
      - name: credit_status
        type: enum
        source: system
        description: "Transcript dimension of the claim lifecycle."
        default: "NOT_POSTED"
        constraints: "NOT_POSTED | POSTED | REVERSED"
      - name: provisional_coverage_bp
        type: integer
        source: computed
        description: "Self-reported outcome coverage; see calculations.outcome_coverage_score variant provisional_self_reported."
        default: null
      - name: verified_coverage_bp
        type: integer
        source: computed
        description: "Assessor-verified outcome coverage; see calculations.outcome_coverage_score variant assessor_verified."
        default: null
      - name: assessor_recommendation
        type: enum
        source: system
        description: "Recommendation recorded when the scoring assignment completed."
        default: null
        constraints: "null | PASS | FAIL"
      - name: revision_round
        type: integer
        source: system
        description: "Number of revision requests issued against this claim; capped by MAX_REVISION_ROUNDS."
        default: 0
      - name: sla_breach_count
        type: integer
        source: system
        description: "Number of assignments on this claim revoked by the SLA sweep."
        default: 0
      - name: appeal_count
        type: integer
        source: system
        description: "Number of Appeal rows filed against this claim; capped by MAX_APPEALS_PER_CLAIM."
        default: 0
      - name: hold_reason
        type: enum
        source: system
        description: "Why the claim is parked outside the normal path."
        default: null
        constraints: "null | ARTICULATION_SUSPENDED | NO_ELIGIBLE_ASSESSOR | PLA_CAP | UPPER_DIVISION_CAP"
      - name: denial_reason
        type: string
        source: system
        description: "Reason recorded at denial."
        default: null
      - name: appeal_deadline_at
        type: datetime
        source: computed
        description: "denied_at + APPEAL_WINDOW_HOURS; filing is allowed while current_utc <= appeal_deadline_at."
        default: null
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent submit."
        default: null
      - name: posted_term
        type: string
        source: system
        description: "Term code the credit was posted under."
        default: null
      - name: posted_credits
        type: integer
        source: system
        description: "Credits currently posted to the transcript for this claim; 0 after reversal."
        default: null

  - name: Portfolio
    parent: null
    common_fields: true
    fields:
      - name: claim_id
        type: string
        source: input
        description: "FK -> PlaClaim.id; exactly one Portfolio may exist per claim, and only for source_type PORTFOLIO."
        constraints: "unique across Portfolio"
      - name: narrative
        type: string
        source: input
        description: "Student's experiential-learning narrative."
      - name: status
        type: enum
        source: system
        description: "Portfolio lifecycle; cycles SUBMITTED -> REVISION_REQUESTED -> SUBMITTED."
        default: "DRAFT"
        constraints: "DRAFT | SUBMITTED | REVISION_REQUESTED | LOCKED | VOIDED"
      - name: artifact_count
        type: integer
        source: computed
        description: "Count of Artifact rows whose portfolio_id is this portfolio; drives the artifact tier surcharge and the SLA multiplier."
        default: 0
      - name: provisional_coverage_bp
        type: integer
        source: computed
        description: "Self-reported coverage recomputed on every portfolio submit."
        default: null
      - name: verified_coverage_bp
        type: integer
        source: computed
        description: "Assessor-verified coverage copied from the completing assignment."
        default: null
      - name: revision_round
        type: integer
        source: system
        description: "Number of times this portfolio has been sent back for revision."
        default: 0
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent portfolio submit."
        default: null

  - name: Artifact
    parent: Portfolio
    common_fields: false
    fields:
      - name: portfolio_id
        type: string
        source: system
        description: "FK -> Portfolio.id; taken from the path at creation."
      - name: artifact_type
        type: enum
        source: input
        description: "Kind of evidence."
        constraints: "WORK_PRODUCT | EMPLOYER_LETTER | TRAINING_CERTIFICATE | LICENSE | MILITARY_RECORD | SUPERVISOR_EVALUATION"
      - name: title
        type: string
        source: input
        description: "Artifact title."
      - name: description
        type: string
        source: input
        description: "What the artifact demonstrates."
      - name: evidence_uri
        type: string
        source: input
        description: "Location of the stored evidence file."
      - name: outcome_mappings
        type: array
        source: input
        description: "Non-empty array of objects { learning_outcome_id, alignment } mapping this artifact to learning outcomes of the claim's course; alignment is PRIMARY or SUPPORTING; at most one entry per learning_outcome_id."
        constraints: "1..12 entries; every learning_outcome_id MUST belong to the claim's course_id"

  - name: AssessorAssignment
    parent: null
    common_fields: true
    fields:
      - name: claim_id
        type: string
        source: system
        description: "FK -> PlaClaim.id; taken from the path at creation."
      - name: assessor_id
        type: string
        source: input
        description: "FK -> FacultyAssessor.id; supplied explicitly or chosen by calculations.assessor_selection_rank."
      - name: status
        type: enum
        source: system
        description: "Assignment lifecycle."
        default: "ASSIGNED"
        constraints: "ASSIGNED | ACCEPTED | DECLINED | SCORING_COMPLETE | REVOKED"
      - name: selection_reason
        type: enum
        source: system
        description: "How this assignment came to exist."
        constraints: "EXPLICIT | AUTO_SELECTED | AUTO_REPLACEMENT"
      - name: assigned_at
        type: datetime
        source: system
        description: "Logical-clock instant the assignment was created; the SLA clock starts here regardless of acceptance."
      - name: accepted_at
        type: datetime
        source: system
        description: "Logical-clock instant the assessor accepted."
        default: null
      - name: sla_hours
        type: integer
        source: computed
        description: "Turnaround allowance in whole hours; see calculations.assessment_sla_due_at."
      - name: due_at
        type: datetime
        source: computed
        description: "assigned_at + sla_hours; the service-level deadline."
      - name: at_risk_at
        type: datetime
        source: computed
        description: "assigned_at + SLA_AT_RISK_BP/10000 of sla_hours; the instant sla_state flips to AT_RISK."
      - name: elapsed_bp
        type: integer
        source: computed
        description: "Read-time elapsed fraction of the allowance in basis points; see calculations.assignment_sla_state."
      - name: sla_state
        type: enum
        source: computed
        description: "Read-time service-level posture derived from elapsed_bp."
        constraints: "ON_TRACK | AT_RISK | BREACHED"
      - name: rubric_submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant the rubric score set was accepted."
        default: null
      - name: recommendation
        type: enum
        source: system
        description: "PASS or FAIL recorded at completion."
        default: null
        constraints: "null | PASS | FAIL"
      - name: verified_coverage_bp
        type: integer
        source: computed
        description: "Weighted verified coverage computed from this assignment's rubric scores at completion."
        default: null
      - name: revoke_reason
        type: enum
        source: system
        description: "Why the assignment was revoked."
        default: null
        constraints: "null | SLA_BREACH | REVISION_REQUESTED | CLAIM_WITHDRAWN | CAP_BLOCKED | ASSESSOR_DECLINED"
      - name: decline_reason
        type: string
        source: system
        description: "Free text captured when the assessor declined."
        default: null

  - name: RubricScore
    parent: AssessorAssignment
    common_fields: false
    fields:
      - name: assignment_id
        type: string
        source: system
        description: "FK -> AssessorAssignment.id; taken from the path at creation."
      - name: learning_outcome_id
        type: string
        source: input
        description: "FK -> LearningOutcome.id; the outcome this score applies to."
      - name: points_awarded
        type: integer
        source: input
        description: "Rubric points awarded for the outcome."
        constraints: "0..4"
      - name: points_possible
        type: integer
        source: system
        description: "Always RUBRIC_MAX_POINTS."
        default: 4
      - name: score_ratio_bp
        type: integer
        source: computed
        description: "round_half_up(points_awarded * 10000 / points_possible)."
      - name: outcome_met
        type: boolean
        source: computed
        description: "score_ratio_bp >= LearningOutcome.mastery_threshold_bp of the referenced outcome."
      - name: narrative
        type: string
        source: input
        description: "Assessor comment for this outcome."
        default: null

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - name: claim_id
        type: string
        source: input
        description: "FK -> PlaClaim.id; the denied claim under appeal."
      - name: grounds
        type: string
        source: input
        description: "Student's stated grounds for appeal."
      - name: status
        type: enum
        source: system
        description: "Appeal lifecycle."
        default: "FILED"
        constraints: "FILED | UNDER_REVIEW | UPHELD | OVERTURNED | REMANDED"
      - name: reviewer_assessor_id
        type: string
        source: input
        description: "FK -> FacultyAssessor.id; the panel member reviewing the appeal, supplied explicitly or chosen by the selector."
        default: null
      - name: filed_at
        type: datetime
        source: system
        description: "Logical-clock instant the appeal was filed."
      - name: assigned_at
        type: datetime
        source: system
        description: "Logical-clock instant a reviewer was assigned."
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: "Logical-clock instant the decision was recorded."
        default: null
      - name: decision_note
        type: string
        source: system
        description: "Reviewer's rationale."
        default: null
      - name: prior_scorer_assessor_ids
        type: array
        source: computed
        description: "assessor_id values of every AssessorAssignment on this claim whose status is SCORING_COMPLETE; the segregation-of-duties check rejects a reviewer found in this array."

  - name: FeeInvoice
    parent: null
    common_fields: true
    fields:
      - name: claim_id
        type: string
        source: system
        description: "FK -> PlaClaim.id; exactly one invoice per claim, created by the first submit."
        constraints: "unique across FeeInvoice"
      - name: student_id
        type: string
        source: system
        description: "FK -> Student.id; copied from the claim at creation."
      - name: lines
        type: array
        source: computed
        description: "Ordered array of objects { line_type, amount_cents } in the fixed order BASE_ASSESSMENT_FEE, PER_CREDIT_FEE, ARTIFACT_TIER_SURCHARGE, RUSH_SURCHARGE, APPEAL_FILING_FEE, SLA_SERVICE_CREDIT; zero-value lines are omitted."
      - name: subtotal_cents
        type: integer
        source: computed
        description: "Sum of the per-line rounded amounts, including the negative SLA_SERVICE_CREDIT line."
      - name: discount_bp
        type: integer
        source: computed
        description: "Program discount rate selected from the pre-discount subtotal tier."
      - name: discount_cents
        type: integer
        source: computed
        description: "round_half_up(subtotal_cents * discount_bp / 10000)."
      - name: total_cents
        type: integer
        source: computed
        description: "subtotal_cents - discount_cents."
      - name: paid_cents
        type: integer
        source: computed
        description: "Gross cash received against this invoice."
        default: 0
      - name: refunded_cents
        type: integer
        source: computed
        description: "Gross cash returned against this invoice."
        default: 0
      - name: waived_cents
        type: integer
        source: computed
        description: "Amount forgiven by a waiver."
        default: 0
      - name: balance_due_cents
        type: integer
        source: computed
        description: "total_cents - waived_cents - (paid_cents - refunded_cents)."
      - name: aid_eligible
        type: boolean
        source: system
        description: "Always false: prior-learning assessment fees are institutional charges Title IV aid may not cover."
        default: false
      - name: recompute_count
        type: integer
        source: computed
        description: "Number of times the line set has been recomputed after creation (re-submit, appeal filing, appeal remand, SLA credit)."
        default: 0

state_machines:
  # ---------------------------------------------------------------------------
  # PlaClaim carries THREE independent state dimensions on the same row.
  # assessment_status, fee_status and credit_status advance on their own
  # triggers; no transition of one dimension is a precondition of another
  # except where stated explicitly in preconditions.
  # ---------------------------------------------------------------------------
  - entity: PlaClaim
    dimension: assessment_status
    initial_state: DRAFT
    terminal_states: [AWARDED, DENIED_FINAL, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /pla-claims/{claim_id}/submit"
        actor: Student
        preconditions:
          - "Student.enrollment_status == MATRICULATED"
          - "Program.status == ACTIVE for the claim's student's program"
          - "Course.pla_eligible == true"
          - "PlaClaim.source_type is a member of Program.allowed_source_types"
          - "1 <= credits_requested <= Course.credits"
          - "for source_type != PORTFOLIO: articulation_rule_id is non-null, that rule's status == APPROVED, rule.pinned_recommendation_version == CredentialRecommendation.terms_version, credits_requested <= rule.awarded_credits, and attempt_date is inside [rule.effective_from, rule.effective_to) and inside [recommendation.effective_from, recommendation.effective_to)"
          - "for source_type == PORTFOLIO: a Portfolio exists for this claim with status == SUBMITTED"
          - "no other PlaClaim of the same student_id and course_id has assessment_status in {SUBMITTED, UNDER_ASSESSMENT, REVISION_REQUESTED, SCORED, CAP_BLOCKED, AWARDED, DENIED, APPEAL_PENDING}"
          - "credits_requested <= calculations.program_pla_credit_capacity variant reserved_inclusive remaining for the student"
          - "if Course.level == UPPER: credits_requested + Student.pla_upper_division_committed <= Program.pla_upper_division_max_credits"
        side_effects:
          - "assessment_status = SUBMITTED; submitted_at = current_utc; claim_number already fixed at creation"
          - "priority_tier = EXPEDITED when rush_requested == true, else STANDARD"
          - "Student.pla_credits_reserved += credits_requested (and Student.pla_upper_division_committed += credits_requested when Course.level == UPPER); increments Student.version by 1"
          - "creates the claim's FeeInvoice with lines/subtotal/discount/total per calculations.assessment_fee_invoice_total; fee_status: UNBILLED -> INVOICED"
          - "increments PlaClaim.version by 1"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /pla-claims/{claim_id}/submit"
        actor: Student
        preconditions:
          - "same preconditions as DRAFT -> SUBMITTED, except the duplicate-claim check ignores this claim itself"
          - "hold_reason is null (an ARTICULATION_SUSPENDED hold clears only when the rule returns to APPROVED)"
        side_effects:
          - "assessment_status = SUBMITTED; submitted_at = current_utc"
          - "Student.pla_credits_reserved is NOT re-incremented (the reservation persisted through REVISION_REQUESTED)"
          - "recomputes the existing FeeInvoice line set (artifact tier and rush lines may have changed) and increments FeeInvoice.recompute_count by 1; if paid_cents - refunded_cents > new total_cents the excess is refunded (refunded_cents += excess) and fee_status stays PAID; if paid_cents - refunded_cents < new total_cents fee_status becomes PARTIALLY_PAID"
          - "Portfolio (when present) must already be back in status SUBMITTED"
          - "increments PlaClaim.version by 1"
        note: "This is the revision cycle: UNDER_ASSESSMENT -> REVISION_REQUESTED -> SUBMITTED."
      - from: SUBMITTED
        to: UNDER_ASSESSMENT
        trigger: "POST /pla-claims/{claim_id}/assessor-assignments"
        actor: PlaCoordinator
        preconditions:
          - "assessment_status == SUBMITTED"
          - "fee_status in {PAID, WAIVED}"
          - "the selector yields a non-empty candidate pool, or an explicit assessor_id that passes every eligibility predicate"
        side_effects:
          - "creates AssessorAssignment with status ASSIGNED, assigned_at = current_utc, sla_hours/due_at/at_risk_at per calculations.assessment_sla_due_at, selection_reason EXPLICIT or AUTO_SELECTED"
          - "FacultyAssessor.active_assignment_count += 1; increments FacultyAssessor.version by 1"
          - "assessment_status = UNDER_ASSESSMENT; hold_reason = null"
          - "increments PlaClaim.version by 1"
      - from: UNDER_ASSESSMENT
        to: REVISION_REQUESTED
        trigger: "POST /pla-claims/{claim_id}/request-revision"
        actor: PlaCoordinator
        preconditions:
          - "assessment_status == UNDER_ASSESSMENT"
          - "revision_round + 1 <= MAX_REVISION_ROUNDS (2)"
        side_effects:
          - "revision_round += 1; assessment_status = REVISION_REQUESTED"
          - "every AssessorAssignment of this claim with status in {ASSIGNED, ACCEPTED} -> REVOKED with revoke_reason REVISION_REQUESTED; for each, FacultyAssessor.active_assignment_count -= 1 and that assessor's version increments by 1"
          - "the claim's Portfolio (when present): SUBMITTED -> REVISION_REQUESTED with Portfolio.revision_round += 1"
          - "increments PlaClaim.version by 1"
      - from: UNDER_ASSESSMENT
        to: SCORED
        trigger: "POST /assessor-assignments/{assignment_id}/complete"
        actor: FacultyAssessor
        preconditions:
          - "the completing assignment belongs to this claim, its status == ACCEPTED and rubric_submitted_at is non-null"
          - "the submitted recommendation equals the server's computed recommendation (verified_coverage_bp >= effective pass threshold ? PASS : FAIL)"
        side_effects:
          - "assignment.status = SCORING_COMPLETE; assignment.verified_coverage_bp set; FacultyAssessor.active_assignment_count -= 1 and that assessor's version increments by 1"
          - "claim.verified_coverage_bp = assignment.verified_coverage_bp; claim.assessor_recommendation = recommendation; assessment_status = SCORED"
          - "the claim's Portfolio (when present): SUBMITTED -> LOCKED with Portfolio.verified_coverage_bp copied from the assignment"
          - "increments PlaClaim.version by 1"
      - from: SCORED
        to: AWARDED
        trigger: "POST /pla-claims/{claim_id}/award"
        actor: PlaCoordinator
        preconditions:
          - "assessment_status == SCORED and assessor_recommendation == PASS"
          - "Program.status == ACTIVE"
          - "for source_type != PORTFOLIO: articulation_rule.status == APPROVED and articulation_rule.pinned_recommendation_version == CredentialRecommendation.terms_version"
          - "award_credits (default credits_requested) <= credits_requested, and for source_type != PORTFOLIO also <= articulation_rule.awarded_credits"
          - "fee_status in {PAID, WAIVED}"
          - "award_credits <= calculations.program_pla_credit_capacity variant reserved_inclusive remaining, treating this claim's own reservation as released first"
          - "if Course.level == UPPER: award_credits + (Student.pla_upper_division_committed - credits_requested) <= Program.pla_upper_division_max_credits"
          - "expected_student_version == Student.version"
        side_effects:
          - "assessment_status = AWARDED; credits_awarded = award_credits"
          - "Student.pla_credits_reserved -= credits_requested; Student.pla_credits_awarded += award_credits; Student.pla_upper_division_committed adjusted by (award_credits - credits_requested) when Course.level == UPPER; increments Student.version by 1"
          - "CASCADE: if, after the ledger update, remaining reserved_inclusive capacity is 0, every other PlaClaim of this student with assessment_status in {SUBMITTED, UNDER_ASSESSMENT, SCORED} -> CAP_BLOCKED with hold_reason PLA_CAP, releasing each one's reservation; each such claim's open AssessorAssignment rows -> REVOKED with revoke_reason CAP_BLOCKED and each affected assessor's active_assignment_count -= 1"
          - "increments PlaClaim.version by 1"
      - from: SCORED
        to: DENIED
        trigger: "POST /pla-claims/{claim_id}/deny"
        actor: PlaCoordinator
        preconditions:
          - "assessment_status == SCORED"
        side_effects:
          - "assessment_status = DENIED; denial_reason recorded; appeal_deadline_at = current_utc + APPEAL_WINDOW_HOURS (336)"
          - "Student.pla_credits_reserved -= credits_requested (and pla_upper_division_committed -= credits_requested when Course.level == UPPER); increments Student.version by 1"
          - "fee_status is unchanged (assessment fees are earned once assessment completed)"
          - "increments PlaClaim.version by 1"
      - from: DENIED
        to: APPEAL_PENDING
        trigger: "POST /appeals"
        actor: Student
        preconditions:
          - "assessment_status == DENIED"
          - "current_utc <= appeal_deadline_at"
          - "appeal_count + 1 <= MAX_APPEALS_PER_CLAIM (2)"
          - "no Appeal of this claim has status in {FILED, UNDER_REVIEW}"
        side_effects:
          - "creates Appeal with status FILED and filed_at = current_utc; appeal_count += 1"
          - "assessment_status = APPEAL_PENDING"
          - "appends an APPEAL_FILING_FEE line to the claim's FeeInvoice, recomputes subtotal/discount_bp/discount_cents/total_cents, increments recompute_count by 1; fee_status becomes PARTIALLY_PAID whenever paid_cents - refunded_cents < the new total_cents"
          - "increments PlaClaim.version by 1"
      - from: APPEAL_PENDING
        to: DENIED_FINAL
        trigger: "POST /appeals/{appeal_id}/decide with decision UPHELD"
        actor: AppealReviewer
        preconditions:
          - "the appeal's status == UNDER_REVIEW and its claim_id is this claim"
          - "fee_status == PAID (the appeal filing fee cleared before review began)"
        side_effects:
          - "appeal.status = UPHELD; appeal.decided_at = current_utc"
          - "assessment_status = DENIED_FINAL; fee_status: PAID -> RETAINED"
          - "increments PlaClaim.version by 1"
      - from: APPEAL_PENDING
        to: AWARDED
        trigger: "POST /appeals/{appeal_id}/decide with decision OVERTURNED"
        actor: AppealReviewer
        preconditions:
          - "the appeal's status == UNDER_REVIEW and its claim_id is this claim"
          - "Program.status == ACTIVE"
          - "for source_type != PORTFOLIO: articulation_rule.status == APPROVED and pin still current"
          - "credits_requested <= calculations.program_pla_credit_capacity variant reserved_inclusive remaining (the claim holds no reservation while DENIED/APPEAL_PENDING)"
        side_effects:
          - "appeal.status = OVERTURNED; appeal.decided_at = current_utc"
          - "assessment_status = AWARDED; credits_awarded = credits_requested"
          - "Student.pla_credits_awarded += credits_awarded (and pla_upper_division_committed += credits_awarded when Course.level == UPPER); increments Student.version by 1"
          - "fee_status: PAID -> REFUNDED with refunded_cents += (paid_cents - refunded_cents) on the claim's invoice; Student.fee_paid_net_cents recomputed to (paid_cents - refunded_cents) summed over the student's invoices"
          - "CASCADE (depth 4): claim AWARDED -> Student ledger update -> if remaining reserved_inclusive capacity is now 0, sibling claims in {SUBMITTED, UNDER_ASSESSMENT, SCORED} -> CAP_BLOCKED (hold_reason PLA_CAP, reservations released) -> each blocked claim's open AssessorAssignment rows -> REVOKED (revoke_reason CAP_BLOCKED) with FacultyAssessor.active_assignment_count -= 1"
          - "increments PlaClaim.version by 1"
      - from: APPEAL_PENDING
        to: UNDER_ASSESSMENT
        trigger: "POST /appeals/{appeal_id}/decide with decision REMANDED"
        actor: AppealReviewer
        preconditions:
          - "the appeal's status == UNDER_REVIEW and its claim_id is this claim"
          - "credits_requested <= calculations.program_pla_credit_capacity variant reserved_inclusive remaining"
        side_effects:
          - "appeal.status = REMANDED; appeal.decided_at = current_utc"
          - "assessment_status = UNDER_ASSESSMENT; assessor_recommendation = null; verified_coverage_bp = null; denial_reason = null; appeal_deadline_at = null"
          - "Student.pla_credits_reserved += credits_requested (the reservation is re-taken); increments Student.version by 1"
          - "removes the APPEAL_FILING_FEE line from the invoice, recomputes subtotal/discount/total, increments recompute_count by 1, refunds APPEAL_FILING_FEE_CENTS (refunded_cents += 6000); fee_status returns to PAID once paid_cents - refunded_cents == total_cents"
          - "creates a replacement AssessorAssignment (selection_reason AUTO_REPLACEMENT) excluding every assessor already assigned to this claim; when the candidate pool is empty no assignment is created and hold_reason = NO_ELIGIBLE_ASSESSOR"
          - "increments PlaClaim.version by 1"
        note: "Cycle back into assessment: DENIED -> APPEAL_PENDING -> UNDER_ASSESSMENT."
      - from: SUBMITTED
        to: CAP_BLOCKED
        trigger: "system cascade from another claim of the same student reaching AWARDED (award endpoint or appeal OVERTURNED)"
        actor: system
        preconditions:
          - "remaining reserved_inclusive capacity for the student is 0 after the awarding claim's ledger update"
        side_effects:
          - "assessment_status = CAP_BLOCKED; hold_reason = PLA_CAP"
          - "Student.pla_credits_reserved -= credits_requested (and pla_upper_division_committed -= credits_requested when Course.level == UPPER)"
          - "increments PlaClaim.version by 1"
      - from: UNDER_ASSESSMENT
        to: CAP_BLOCKED
        trigger: "system cascade from another claim of the same student reaching AWARDED"
        actor: system
        preconditions:
          - "remaining reserved_inclusive capacity for the student is 0 after the awarding claim's ledger update"
        side_effects:
          - "assessment_status = CAP_BLOCKED; hold_reason = PLA_CAP; reservation released as above"
          - "every AssessorAssignment of this claim with status in {ASSIGNED, ACCEPTED} -> REVOKED with revoke_reason CAP_BLOCKED; FacultyAssessor.active_assignment_count -= 1 for each"
          - "increments PlaClaim.version by 1"
      - from: SCORED
        to: CAP_BLOCKED
        trigger: "system cascade from another claim of the same student reaching AWARDED"
        actor: system
        preconditions:
          - "remaining reserved_inclusive capacity for the student is 0 after the awarding claim's ledger update"
        side_effects:
          - "assessment_status = CAP_BLOCKED; hold_reason = PLA_CAP; reservation released as above"
          - "increments PlaClaim.version by 1"
      - from: CAP_BLOCKED
        to: SUBMITTED
        trigger: "system cascade from POST /pla-claims/{claim_id}/transcript-posting/reversal or from a sibling claim reaching WITHDRAWN, evaluated by calculations.cap_unblock_waterfall"
        actor: system
        preconditions:
          - "credits_requested <= remaining reserved_inclusive capacity at the moment this claim's turn comes up in the created_at ASC, claim_number ASC walk"
        side_effects:
          - "assessment_status = SUBMITTED; hold_reason = null"
          - "Student.pla_credits_reserved += credits_requested (and pla_upper_division_committed += credits_requested when Course.level == UPPER)"
          - "increments PlaClaim.version by 1"
        note: "Claims whose credits_requested exceeds the remaining capacity are skipped, not stopped on: the walk continues to the next candidate."
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "system cascade from POST /credential-recommendations/{recommendation_id}/retire or POST /articulation-rules/{rule_id}/suspend"
        actor: system
        preconditions:
          - "the claim's articulation_rule_id references a rule that just left APPROVED"
          - "assessment_status in {SUBMITTED, UNDER_ASSESSMENT}"
        side_effects:
          - "assessment_status = REVISION_REQUESTED; hold_reason = ARTICULATION_SUSPENDED; revision_round is NOT incremented (an institutional hold does not consume the student's revision budget)"
          - "open AssessorAssignment rows -> REVOKED with revoke_reason REVISION_REQUESTED and assessor counters decremented"
          - "the claim's FeeInvoice, when fee_status is in {INVOICED, PARTIALLY_PAID}, is waived: waived_cents = balance_due_cents, any net cash paid is refunded, fee_status -> WAIVED"
          - "increments PlaClaim.version by 1"
      - from: UNDER_ASSESSMENT
        to: REVISION_REQUESTED
        trigger: "system cascade from POST /credential-recommendations/{recommendation_id}/retire or POST /articulation-rules/{rule_id}/suspend"
        actor: system
        preconditions:
          - "the claim's articulation_rule_id references a rule that just left APPROVED"
        side_effects:
          - "same as the SUBMITTED -> REVISION_REQUESTED institutional hold above"
        note: "SCORED claims are deliberately NOT swept: they are held at the award decision instead, where ERR_ARTICULATION_NOT_APPROVED fires."
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /pla-claims/{claim_id}/withdraw"
        actor: Student
        preconditions:
          - "assessment_status in {DRAFT, SUBMITTED, UNDER_ASSESSMENT, REVISION_REQUESTED, CAP_BLOCKED}"
        side_effects:
          - "assessment_status = WITHDRAWN; the claim's Portfolio (when present) -> VOIDED"
          - "increments PlaClaim.version by 1"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /pla-claims/{claim_id}/withdraw"
        actor: Student
        preconditions:
          - "assessment_status == SUBMITTED"
        side_effects:
          - "assessment_status = WITHDRAWN; Student.pla_credits_reserved -= credits_requested (and pla_upper_division_committed -= credits_requested when Course.level == UPPER); increments Student.version by 1"
          - "refund settlement per calculations.withdrawal_refund_settlement: retention 0 bp at SUBMITTED, so refunded_cents += paid_cents - refunded_cents, waived_cents = remaining balance, fee_status -> REFUNDED (or WAIVED when nothing was paid)"
          - "Student.fee_paid_net_cents recomputed"
          - "the claim's Portfolio (when present) -> VOIDED"
          - "CASCADE: calculations.cap_unblock_waterfall runs over the student's CAP_BLOCKED claims"
          - "increments PlaClaim.version by 1"
      - from: UNDER_ASSESSMENT
        to: WITHDRAWN
        trigger: "POST /pla-claims/{claim_id}/withdraw"
        actor: Student
        preconditions:
          - "assessment_status == UNDER_ASSESSMENT"
        side_effects:
          - "assessment_status = WITHDRAWN; reservation released as above; increments Student.version by 1"
          - "refund settlement per calculations.withdrawal_refund_settlement: retention WITHDRAW_RETENTION_BP_UNDER_ASSESSMENT (5000), so only half of the net cash is returned and fee_status -> REFUNDED"
          - "open AssessorAssignment rows -> REVOKED with revoke_reason CLAIM_WITHDRAWN; assessor counters decremented"
          - "the claim's Portfolio (when present) -> VOIDED"
          - "CASCADE: calculations.cap_unblock_waterfall runs over the student's CAP_BLOCKED claims"
          - "increments PlaClaim.version by 1"
      - from: CAP_BLOCKED
        to: WITHDRAWN
        trigger: "POST /pla-claims/{claim_id}/withdraw"
        actor: Student
        preconditions:
          - "assessment_status == CAP_BLOCKED"
        side_effects:
          - "assessment_status = WITHDRAWN; no reservation to release (it was released when the claim was blocked)"
          - "refund settlement with retention 0 bp"
          - "increments PlaClaim.version by 1"
      - from: REVISION_REQUESTED
        to: WITHDRAWN
        trigger: "POST /pla-claims/{claim_id}/withdraw"
        actor: Student
        preconditions:
          - "assessment_status == REVISION_REQUESTED"
        side_effects:
          - "assessment_status = WITHDRAWN; Student.pla_credits_reserved -= credits_requested (the reservation persisted through the revision hold); increments Student.version by 1"
          - "refund settlement with retention 0 bp; the claim's Portfolio (when present) -> VOIDED"
          - "CASCADE: calculations.cap_unblock_waterfall runs over the student's CAP_BLOCKED claims"
          - "increments PlaClaim.version by 1"

  - entity: PlaClaim
    dimension: fee_status
    initial_state: UNBILLED
    terminal_states: [RETAINED, REFUNDED]
    transitions:
      - from: UNBILLED
        to: INVOICED
        trigger: "POST /pla-claims/{claim_id}/submit (first submit only)"
        actor: Student
        preconditions:
          - "no FeeInvoice exists for this claim"
        side_effects:
          - "creates FeeInvoice with aid_eligible = false and total_cents per calculations.assessment_fee_invoice_total"
      - from: INVOICED
        to: PARTIALLY_PAID
        trigger: "POST /fee-invoices/{invoice_id}/payments"
        actor: Student
        preconditions:
          - "payment_method != FINANCIAL_AID"
          - "amount_cents <= balance_due_cents"
          - "paid_cents - refunded_cents + amount_cents < total_cents - waived_cents"
        side_effects:
          - "paid_cents += amount_cents; balance_due_cents recomputed; Student.fee_paid_net_cents += amount_cents and increments Student.version by 1"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /fee-invoices/{invoice_id}/payments"
        actor: Student
        preconditions:
          - "paid_cents - refunded_cents + amount_cents == total_cents - waived_cents"
        side_effects:
          - "paid_cents += amount_cents; balance_due_cents = 0; Student.fee_paid_net_cents += amount_cents"
      - from: INVOICED
        to: PAID
        trigger: "POST /fee-invoices/{invoice_id}/payments (single full payment)"
        actor: Student
        preconditions:
          - "amount_cents == total_cents - waived_cents - (paid_cents - refunded_cents)"
        side_effects:
          - "paid_cents += amount_cents; balance_due_cents = 0; Student.fee_paid_net_cents += amount_cents"
      - from: INVOICED
        to: WAIVED
        trigger: "POST /fee-invoices/{invoice_id}/waive"
        actor: PlaCoordinator
        preconditions:
          - "fee_status in {INVOICED, PARTIALLY_PAID}"
        side_effects:
          - "waived_cents = total_cents - (paid_cents - refunded_cents); balance_due_cents = 0; any net cash already paid is refunded (refunded_cents += paid_cents - refunded_cents) and Student.fee_paid_net_cents recomputed"
      - from: PARTIALLY_PAID
        to: WAIVED
        trigger: "POST /fee-invoices/{invoice_id}/waive"
        actor: PlaCoordinator
        preconditions:
          - "fee_status == PARTIALLY_PAID"
        side_effects:
          - "same as INVOICED -> WAIVED"
      - from: INVOICED
        to: WAIVED
        trigger: "system cascade from the institutional articulation hold (recommendation retire / rule suspend)"
        actor: system
        preconditions:
          - "the claim was swept into REVISION_REQUESTED with hold_reason ARTICULATION_SUSPENDED"
        side_effects:
          - "waived_cents = balance_due_cents; net cash refunded; Student.fee_paid_net_cents recomputed"
      - from: PAID
        to: PARTIALLY_PAID
        trigger: "POST /appeals (appeal filing fee line appended) or POST /pla-claims/{claim_id}/submit after revision when the recomputed total rises"
        actor: Student
        preconditions:
          - "the recomputed total_cents exceeds paid_cents - refunded_cents + waived_cents"
        side_effects:
          - "balance_due_cents recomputed to the positive difference; FeeInvoice.recompute_count += 1"
        note: "Backward transition in the fee dimension; this is what makes the fee machine cyclic."
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "system cascade from POST /appeals/{appeal_id}/decide with decision REMANDED (appeal fee line removed and refunded)"
        actor: system
        preconditions:
          - "after removing the APPEAL_FILING_FEE line and refunding 6000, paid_cents - refunded_cents == total_cents - waived_cents"
        side_effects:
          - "fee_status = PAID; FeeInvoice.recompute_count += 1"
      - from: PARTIALLY_PAID
        to: PARTIALLY_PAID
        trigger: "system cascade from POST /appeals/{appeal_id}/decide with decision REMANDED when the refund does not settle the invoice"
        actor: system
        preconditions:
          - "after removing the APPEAL_FILING_FEE line and refunding exactly 6000, paid_cents - refunded_cents < total_cents - waived_cents"
        side_effects:
          - "fee_status stays PARTIALLY_PAID with the positive residue exposed in balance_due_cents; FeeInvoice.recompute_count += 1"
        note: "The remand refund is fixed at APPEAL_FILING_FEE_CENTS, but removing the appeal line also removes the discount that line earned, so a residue of exactly (discount on the appeal line) can remain due. It is NOT swept to 0 — only a NEGATIVE balance is swept, by STEP 4 of calculations.assessment_fee_invoice_total."
      - from: PAID
        to: REFUNDED
        trigger: "POST /appeals/{appeal_id}/decide with decision OVERTURNED, or POST /pla-claims/{claim_id}/withdraw"
        actor: AppealReviewer
        preconditions:
          - "fee_status == PAID"
        side_effects:
          - "refunded_cents += the refundable share per calculations.withdrawal_refund_settlement (100% on OVERTURNED); Student.fee_paid_net_cents recomputed; increments Student.version by 1"
      - from: PAID
        to: RETAINED
        trigger: "POST /appeals/{appeal_id}/decide with decision UPHELD"
        actor: AppealReviewer
        preconditions:
          - "the claim reaches DENIED_FINAL"
        side_effects:
          - "no cash movement; the fee is recognised as earned revenue"
      - from: PAID
        to: PAID
        trigger: "system cascade from POST /_sla/run-escalation-sweep (SLA service credit)"
        actor: system
        preconditions:
          - "claim.sla_breach_count >= SLA_CREDIT_TRIGGER_BREACHES (1) and no SLA_SERVICE_CREDIT line exists yet"
        side_effects:
          - "appends a negative SLA_SERVICE_CREDIT line, recomputes subtotal/discount/total, increments recompute_count by 1; the resulting overpayment (paid_cents - refunded_cents - total_cents) is auto-refunded so balance_due_cents returns to 0 and fee_status stays PAID"

  - entity: PlaClaim
    dimension: credit_status
    initial_state: NOT_POSTED
    terminal_states: []
    transitions:
      - from: NOT_POSTED
        to: POSTED
        trigger: "POST /pla-claims/{claim_id}/transcript-posting"
        actor: Registrar
        preconditions:
          - "assessment_status == AWARDED"
          - "fee_status in {PAID, WAIVED, REFUNDED, RETAINED}"
          - "credit_status == NOT_POSTED"
          - "Program.status == ACTIVE"
          - "Student.transfer_credits_accepted + Student.pla_credits_posted + credits_awarded <= Program.total_credits_required - Program.residency_min_credits"
        side_effects:
          - "credit_status = POSTED; posted_term recorded; posted_credits = credits_awarded"
          - "Student.pla_credits_awarded -= credits_awarded; Student.pla_credits_posted += credits_awarded; increments Student.version by 1"
          - "increments PlaClaim.version by 1"
      - from: POSTED
        to: REVERSED
        trigger: "POST /pla-claims/{claim_id}/transcript-posting/reversal"
        actor: Registrar
        preconditions:
          - "credit_status == POSTED"
        side_effects:
          - "credit_status = REVERSED; posted_credits = 0"
          - "Student.pla_credits_posted -= credits_awarded; Student.pla_credits_awarded += credits_awarded; increments Student.version by 1"
          - "CASCADE (depth 3): reversal -> Student ledger frees posted-only capacity -> calculations.cap_unblock_waterfall walks the student's CAP_BLOCKED claims in created_at ASC, claim_number ASC order and returns each affordable one to SUBMITTED (re-reserving its credits)"
          - "increments PlaClaim.version by 1"
      - from: REVERSED
        to: POSTED
        trigger: "POST /pla-claims/{claim_id}/transcript-posting"
        actor: Registrar
        preconditions:
          - "credit_status == REVERSED and assessment_status == AWARDED"
          - "the residency and posted-only capacity checks pass again"
        side_effects:
          - "same as NOT_POSTED -> POSTED, with posted_term overwritten"
        note: "Re-posting after reversal closes the credit-dimension cycle."

  - entity: Portfolio
    initial_state: DRAFT
    terminal_states: [LOCKED, VOIDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /portfolios/{portfolio_id}/submit"
        actor: Student
        preconditions:
          - "status in {DRAFT, REVISION_REQUESTED}"
          - "artifact_count >= 1"
          - "every LearningOutcome of the claim's course is reachable: provisional coverage >= MIN_PROVISIONAL_COVERAGE_BP (5000)"
        side_effects:
          - "status = SUBMITTED; submitted_at = current_utc"
          - "provisional_coverage_bp recomputed per calculations.outcome_coverage_score variant provisional_self_reported; the value is copied onto PlaClaim.provisional_coverage_bp"
          - "increments Portfolio.version by 1"
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "system cascade from POST /pla-claims/{claim_id}/request-revision"
        actor: system
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "status = REVISION_REQUESTED; revision_round += 1; artifacts become mutable again"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /portfolios/{portfolio_id}/submit"
        actor: Student
        preconditions:
          - "artifact_count >= 1 and provisional coverage >= MIN_PROVISIONAL_COVERAGE_BP"
        side_effects:
          - "status = SUBMITTED; submitted_at = current_utc; provisional_coverage_bp recomputed and copied onto the claim"
        note: "Cycle: SUBMITTED -> REVISION_REQUESTED -> SUBMITTED, bounded by MAX_REVISION_ROUNDS on the claim."
      - from: SUBMITTED
        to: LOCKED
        trigger: "system cascade from POST /assessor-assignments/{assignment_id}/complete"
        actor: system
        preconditions:
          - "the claim reaches SCORED"
        side_effects:
          - "status = LOCKED; verified_coverage_bp copied from the completing assignment; artifacts become immutable"
      - from: SUBMITTED
        to: VOIDED
        trigger: "system cascade from POST /pla-claims/{claim_id}/withdraw"
        actor: system
        preconditions:
          - "the claim reaches WITHDRAWN"
        side_effects:
          - "status = VOIDED"
      - from: DRAFT
        to: VOIDED
        trigger: "system cascade from POST /pla-claims/{claim_id}/withdraw"
        actor: system
        preconditions:
          - "the claim reaches WITHDRAWN"
        side_effects:
          - "status = VOIDED"

  - entity: AssessorAssignment
    initial_state: ASSIGNED
    terminal_states: [DECLINED, SCORING_COMPLETE, REVOKED]
    transitions:
      - from: ASSIGNED
        to: ACCEPTED
        trigger: "POST /assessor-assignments/{assignment_id}/accept"
        actor: FacultyAssessor
        preconditions:
          - "status == ASSIGNED"
          - "X-User-ID == assignment.assessor_id"
          - "FacultyAssessor.status == ACTIVE (cross-entity guard: an assessor who went ON_LEAVE after assignment cannot accept)"
        side_effects:
          - "status = ACCEPTED; accepted_at = current_utc; sla_hours/due_at/at_risk_at are NOT recomputed (the SLA clock started at assigned_at)"
          - "increments AssessorAssignment.version by 1"
      - from: ASSIGNED
        to: DECLINED
        trigger: "POST /assessor-assignments/{assignment_id}/decline"
        actor: FacultyAssessor
        preconditions:
          - "status == ASSIGNED"
          - "X-User-ID == assignment.assessor_id"
        side_effects:
          - "status = DECLINED; decline_reason recorded"
          - "FacultyAssessor.active_assignment_count -= 1; increments that assessor's version by 1"
          - "CASCADE: a replacement AssessorAssignment (selection_reason AUTO_REPLACEMENT) is created for the same claim from the candidate pool excluding every assessor already assigned to this claim; the winner's active_assignment_count += 1. When the pool is empty no replacement is created and PlaClaim.hold_reason = NO_ELIGIBLE_ASSESSOR while assessment_status stays UNDER_ASSESSMENT"
      - from: ACCEPTED
        to: SCORING_COMPLETE
        trigger: "POST /assessor-assignments/{assignment_id}/complete"
        actor: FacultyAssessor
        preconditions:
          - "status == ACCEPTED and rubric_submitted_at is non-null"
          - "the submitted recommendation matches the computed one"
        side_effects:
          - "status = SCORING_COMPLETE; verified_coverage_bp computed; FacultyAssessor.active_assignment_count -= 1"
          - "claim -> SCORED with verified_coverage_bp and assessor_recommendation copied over; the claim's Portfolio -> LOCKED"
      - from: ASSIGNED
        to: REVOKED
        trigger: "POST /_sla/run-escalation-sweep, or system cascade from request-revision / withdraw / CAP_BLOCKED / articulation hold"
        actor: system
        preconditions:
          - "for the sweep: sla_state == BREACHED (elapsed_bp >= 10000)"
        side_effects:
          - "status = REVOKED with revoke_reason SLA_BREACH (sweep) or REVISION_REQUESTED / CLAIM_WITHDRAWN / CAP_BLOCKED"
          - "FacultyAssessor.active_assignment_count -= 1; increments that assessor's version by 1"
          - "CASCADE (sweep, depth 4): assignment REVOKED -> PlaClaim.sla_breach_count += 1 and priority_tier = EXPEDITED -> the claim's FeeInvoice gains a negative SLA_SERVICE_CREDIT line with subtotal/discount/total recomputed -> the resulting overpayment is auto-refunded and Student.fee_paid_net_cents recomputed. A replacement assignment is created from the pool excluding prior assessors of the claim."
      - from: ACCEPTED
        to: REVOKED
        trigger: "POST /_sla/run-escalation-sweep, or system cascade from request-revision / withdraw / CAP_BLOCKED / articulation hold"
        actor: system
        preconditions:
          - "for the sweep: sla_state == BREACHED"
        side_effects:
          - "same as ASSIGNED -> REVOKED"

  - entity: Appeal
    initial_state: FILED
    terminal_states: [UPHELD, OVERTURNED, REMANDED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /appeals/{appeal_id}/assign-reviewer"
        actor: PlaCoordinator
        preconditions:
          - "status == FILED"
          - "PlaClaim.fee_status == PAID (the appeal filing fee has cleared)"
          - "the chosen reviewer has appeal_panel_member == true, status == ACTIVE, department_code == the claim's course department, and is NOT present in prior_scorer_assessor_ids"
        side_effects:
          - "status = UNDER_REVIEW; reviewer_assessor_id set; assigned_at = current_utc"
          - "increments Appeal.version by 1"
      - from: UNDER_REVIEW
        to: UPHELD
        trigger: "POST /appeals/{appeal_id}/decide with decision UPHELD"
        actor: AppealReviewer
        preconditions:
          - "status == UNDER_REVIEW"
          - "X-User-ID == reviewer_assessor_id and that assessor's appeal_panel_member == true"
          - "X-User-ID is NOT present in prior_scorer_assessor_ids"
        side_effects:
          - "status = UPHELD; decided_at = current_utc; claim -> DENIED_FINAL; fee_status PAID -> RETAINED"
      - from: UNDER_REVIEW
        to: OVERTURNED
        trigger: "POST /appeals/{appeal_id}/decide with decision OVERTURNED"
        actor: AppealReviewer
        preconditions:
          - "status == UNDER_REVIEW and the segregation-of-duties check passes"
          - "the claim's remaining reserved_inclusive capacity covers credits_requested"
        side_effects:
          - "status = OVERTURNED; decided_at = current_utc; claim -> AWARDED with the depth-4 cascade documented on PlaClaim.APPEAL_PENDING -> AWARDED; full fee refund"
      - from: UNDER_REVIEW
        to: REMANDED
        trigger: "POST /appeals/{appeal_id}/decide with decision REMANDED"
        actor: AppealReviewer
        preconditions:
          - "status == UNDER_REVIEW and the segregation-of-duties check passes"
        side_effects:
          - "status = REMANDED; decided_at = current_utc; claim -> UNDER_ASSESSMENT with a fresh AUTO_REPLACEMENT assignment; appeal filing fee line removed and refunded"

  - entity: ArticulationRule
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /articulation-rules/{rule_id}/submit-for-review"
        actor: ArticulationOfficer
        preconditions:
          - "status == DRAFT"
          - "CredentialRecommendation.status == PUBLISHED"
          - "awarded_credits <= CredentialRecommendation.recommended_credits"
          - "Course.level == UPPER implies CredentialRecommendation.recommended_level == UPPER"
        side_effects:
          - "status = UNDER_REVIEW; reviewed_by_user_id = X-User-ID"
          - "increments ArticulationRule.version by 1"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /articulation-rules/{rule_id}/approve"
        actor: ArticulationOfficer
        preconditions:
          - "status == UNDER_REVIEW"
          - "X-User-ID != reviewed_by_user_id (segregation of duties)"
          - "CredentialRecommendation.status == PUBLISHED"
          - "expected_recommendation_version == CredentialRecommendation.version"
          - "no other ArticulationRule with the same (recommendation_id, course_id) and status APPROVED has a window overlapping [effective_from, effective_to) under half-open semantics"
        side_effects:
          - "status = APPROVED; approved_by_user_id = X-User-ID; pinned_recommendation_version = CredentialRecommendation.terms_version"
          - "CredentialRecommendation.approved_rule_count += 1 and increments CredentialRecommendation.version by 1"
          - "increments ArticulationRule.version by 1"
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /articulation-rules/{rule_id}/suspend"
        actor: ArticulationOfficer
        preconditions:
          - "status == APPROVED"
        side_effects:
          - "status = SUSPENDED; suspend_reason = MANUAL_REVIEW"
          - "CredentialRecommendation.approved_rule_count -= 1 and increments CredentialRecommendation.version by 1"
          - "CASCADE: every PlaClaim referencing this rule with assessment_status in {SUBMITTED, UNDER_ASSESSMENT} -> REVISION_REQUESTED with hold_reason ARTICULATION_SUSPENDED, its open assignments revoked and its unpaid invoice waived"
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /articulation-rules/{rule_id}/reinstate"
        actor: ArticulationOfficer
        preconditions:
          - "status == SUSPENDED"
          - "CredentialRecommendation.status == PUBLISHED"
          - "no overlapping APPROVED window for the same (recommendation_id, course_id) — reinstate carries no OCC token; the only declared CredentialRecommendation OCC gate is on approve (§1.2.1)"
        side_effects:
          - "status = APPROVED; suspend_reason = null; pinned_recommendation_version re-pinned to the current CredentialRecommendation.terms_version"
          - "CredentialRecommendation.approved_rule_count += 1 and increments CredentialRecommendation.version by 1"
          - "PlaClaim rows holding hold_reason ARTICULATION_SUSPENDED for this rule keep assessment_status REVISION_REQUESTED but hold_reason clears to null, making them re-submittable"
        note: "Cycle: APPROVED -> SUSPENDED -> APPROVED."
      - from: APPROVED
        to: SUSPENDED
        trigger: "system cascade from POST /credential-recommendations/{recommendation_id}/retire"
        actor: system
        preconditions:
          - "the parent recommendation left PUBLISHED"
        side_effects:
          - "status = SUSPENDED; suspend_reason = RECOMMENDATION_RETIRED; the same claim/assignment/invoice cascade as the manual suspend runs"
      - from: SUSPENDED
        to: RETIRED
        trigger: "system cascade from POST /credential-recommendations/{recommendation_id}/retire (rules already SUSPENDED at retire time)"
        actor: system
        preconditions:
          - "status == SUSPENDED and the parent recommendation is RETIRED"
        side_effects:
          - "status = RETIRED; the rule can never return to APPROVED"

  - entity: CredentialRecommendation
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /credential-recommendations/{recommendation_id}/publish"
        actor: ArticulationOfficer
        preconditions:
          - "status == DRAFT"
          - "effective_to is null or effective_to > effective_from"
        side_effects:
          - "status = PUBLISHED; increments CredentialRecommendation.version by 1"
      - from: PUBLISHED
        to: RETIRED
        trigger: "POST /credential-recommendations/{recommendation_id}/retire"
        actor: ArticulationOfficer
        preconditions:
          - "status == PUBLISHED"
        side_effects:
          - "status = RETIRED; retire_reason recorded; increments CredentialRecommendation.version by 1"
          - "CASCADE (depth 4, hop 1): every ArticulationRule of this recommendation with status APPROVED -> SUSPENDED (suspend_reason RECOMMENDATION_RETIRED), approved_rule_count decremented to 0"
          - "CASCADE (hop 2, caused by hop 1): every PlaClaim referencing a just-suspended rule with assessment_status in {SUBMITTED, UNDER_ASSESSMENT} -> REVISION_REQUESTED with hold_reason ARTICULATION_SUSPENDED"
          - "CASCADE (hop 3, caused by hop 2): each such claim's AssessorAssignment rows in {ASSIGNED, ACCEPTED} -> REVOKED (revoke_reason REVISION_REQUESTED) with FacultyAssessor.active_assignment_count -= 1, AND each such claim's FeeInvoice in fee_status {INVOICED, PARTIALLY_PAID, PAID} -> WAIVED at the institution's expense (net paid fully refunded, total_cents moved into waived_cents, balance_due_cents 0)"
          - "CASCADE (hop 4, caused by hop 3): Student.fee_paid_net_cents recomputed from the refunded invoices and Student.version incremented"
          - "rules already SUSPENDED at retire time -> RETIRED"

concurrency_rules:
  - rule_id: award-stale-student-ledger
    parent_entity: Student
    write_endpoint: "POST /pla-claims/{claim_id}/award"
    occ_field: "expected_student_version"
    description: |
      Awarding a claim against a Student whose version has advanced since the
      coordinator last read the student ledger is rejected. The ledger fields
      the cap decision depends on (pla_credits_reserved, pla_credits_awarded,
      pla_credits_posted, pla_upper_division_committed) are mutated by every
      other award, denial, posting and cascade, so a stale view can pass a cap
      check that the current ledger would fail; the award is refused until the
      coordinator re-reads the student.
    error_id: ERR_STALE_STUDENT_VERSION
    http_status: 412

  - rule_id: articulation-approve-stale-recommendation
    parent_entity: CredentialRecommendation
    write_endpoint: "POST /articulation-rules/{rule_id}/approve"
    occ_field: "expected_recommendation_version"
    description: |
      Approving a crosswalk rule against a CredentialRecommendation whose
      version has advanced since the approver last read it is rejected. Every
      write on the recommendation — publication, revision, retirement, and each
      sibling rule's approval, suspension or reinstatement — bumps its version,
      so a stale expected_recommendation_version means the approver is pinning
      terms they never observed and would silently articulate a superseded
      national credit recommendation to a local course. The pin itself is taken
      against terms_version, which only a revision moves.
    error_id: ERR_STALE_RECOMMENDATION_VERSION
    http_status: 412

calculations:
  - name: assessment_fee_invoice_total
    trigger: "On PlaClaim submit (invoice creation), on re-submit after revision, on appeal filing, on appeal remand, and on the SLA service credit cascade — every path that writes FeeInvoice.lines"
    algorithm: tiered_pricing
    formula: |
      # STEP 1 — build the line set in this fixed order, rounding EACH line to
      # whole cents with round_half_up BEFORE any summation.
      base_line        = BASE_FEE_BY_SOURCE[claim.source_type]
      per_credit_line  = PER_CREDIT_FEE_CENTS * claim.credits_requested
      artifact_line    = ARTIFACT_TIER_SURCHARGE_CENTS[tier_of(portfolio.artifact_count)]
                         # 0 when the claim has no Portfolio
      rush_line        = claim.rush_requested
                           ? round_half_up((base_line + per_credit_line) * RUSH_SURCHARGE_BP / 10000)
                           : 0
      appeal_line      = APPEAL_FILING_FEE_CENTS when an Appeal of this claim has
                         status in {FILED, UNDER_REVIEW, UPHELD, OVERTURNED}, else 0
                         # removed again when an appeal is REMANDED
      sla_credit_line  = claim.sla_breach_count >= SLA_CREDIT_TRIGGER_BREACHES
                           ? -1 * round_half_up((base_line + per_credit_line + artifact_line + rush_line)
                                                * SLA_CREDIT_BP / 10000)
                           : 0

      # STEP 2 — sum the rounded lines. ROUND-PER-LINE-THEN-SUM is pinned;
      # sum-then-round is explicitly NOT the rule and yields different cents
      # whenever rush_line or sla_credit_line has a .5 remainder.
      subtotal_cents = base_line + per_credit_line + artifact_line + rush_line
                       + appeal_line + sla_credit_line

      # STEP 3 — the discount tier is keyed on the PRE-DISCOUNT subtotal_cents
      # (the circular-looking dependency is broken here, explicitly, in favour
      # of the pre-discount value; keying it on total_cents is NOT the rule).
      discount_bp = subtotal_cents >= 25000 ? 1000
                    : subtotal_cents >= 10000 ? 500
                    : 0
      discount_cents = round_half_up(subtotal_cents * discount_bp / 10000)
      total_cents    = subtotal_cents - discount_cents
      balance_due_cents = total_cents - waived_cents - (paid_cents - refunded_cents)

      # STEP 4 — EXCESS SWEEP. A recompute can lower total_cents below what the
      # student has already settled. The overpayment is then moved into
      # refunded_cents so balance_due_cents lands on exactly 0; clamping with
      # max(0, ...) and leaving the money unaccounted for is NOT the rule.
      if balance_due_cents < 0:
          excess = -balance_due_cents
          refunded_cents += excess
          balance_due_cents = 0
      # The sweep runs AFTER any explicit refund a transition orders (e.g. the
      # appeal-remand refund of exactly APPEAL_FILING_FEE_CENTS); it never
      # overrides that amount, it only absorbs what is still left over.
    input_set: "Exactly one FeeInvoice per PlaClaim. artifact_line reads Portfolio.artifact_count for the claim's Portfolio (0 when source_type != PORTFOLIO). appeal_line counts Appeal rows of this claim whose status is in {FILED, UNDER_REVIEW, UPHELD, OVERTURNED} — a REMANDED appeal is excluded, which is how the remand refund is expressed. sla_credit_line reads the claim's sla_breach_count."
    constants:
      BASE_FEE_BY_SOURCE: { CREDIT_BY_EXAM: 5000, PORTFOLIO: 15000, MILITARY_TRAINING: 0, INDUSTRY_CREDENTIAL: 7500 }
      PER_CREDIT_FEE_CENTS: 2500
      ARTIFACT_TIER_SURCHARGE_CENTS: { TIER_0_TO_3: 0, TIER_4_TO_8: 4000, TIER_9_PLUS: 9000 }
      RUSH_SURCHARGE_BP: 2500
      APPEAL_FILING_FEE_CENTS: 6000
      SLA_CREDIT_BP: 1500
      SLA_CREDIT_TRIGGER_BREACHES: 1
      DISCOUNT_TIER_1_MIN_CENTS: 10000
      DISCOUNT_TIER_1_BP: 500
      DISCOUNT_TIER_2_MIN_CENTS: 25000
      DISCOUNT_TIER_2_BP: 1000
    precision: "Integer cents throughout; every division is followed immediately by round_half_up. tier_of(n): n <= 3 -> TIER_0_TO_3, 4 <= n <= 8 -> TIER_4_TO_8, n >= 9 -> TIER_9_PLUS."
    variants:
      - name: standard_assessment_invoice
        when: "claim.sla_breach_count == 0 and no Appeal line is present"
        difference: "Only the base, per-credit, artifact-tier and rush lines participate."
      - name: sla_credited_invoice
        when: "claim.sla_breach_count >= 1"
        difference: "A negative SLA_SERVICE_CREDIT line computed from the pre-appeal line block is inserted, which can drop subtotal_cents into a lower discount tier and therefore change discount_bp as well as the total."

  - name: program_pla_credit_capacity
    trigger: "On PlaClaim submit, on award, on appeal OVERTURNED, on appeal REMANDED, on transcript posting, on the CAP_BLOCKED cascade, on cap_unblock_waterfall, and on every read of GET /students/{student_id}/graduation-audit"
    algorithm: threshold
    formula: |
      program_cap        = min(program.pla_max_credits,
                              floor(program.total_credits_required * program.pla_max_pct_bp / 10000))
      residency_headroom = max(0, program.total_credits_required
                                  - program.residency_min_credits
                                  - student.transfer_credits_accepted)
      effective_cap      = min(program_cap, residency_headroom)

      # VARIANT reserved_inclusive (gate for every forward-looking admission)
      consumed_reserved_inclusive = student.pla_credits_reserved
                                  + student.pla_credits_awarded
                                  + student.pla_credits_posted
      remaining_reserved_inclusive = effective_cap - consumed_reserved_inclusive

      # A claim being decided must not be double-counted against itself: its own
      # live reservation is removed before the headroom is measured.
      RESERVING_STATES = {SUBMITTED, UNDER_ASSESSMENT, REVISION_REQUESTED, SCORED}
      own_reservation(claim) = claim.assessment_status in RESERVING_STATES
                                 ? claim.credits_requested : 0
      remaining_for(claim) = effective_cap
                             - (consumed_reserved_inclusive - own_reservation(claim))

      # VARIANT posted_only (gate for transcript posting and the graduation audit)
      remaining_posted_only = effective_cap - student.pla_credits_posted

      upper_division_remaining = program.pla_upper_division_max_credits
                                 - student.pla_upper_division_committed
    input_set: "effective_cap uses only Program config plus Student.transfer_credits_accepted. reserved_inclusive counts claims in {SUBMITTED, UNDER_ASSESSMENT, REVISION_REQUESTED, SCORED} through pla_credits_reserved, claims in {AWARDED} not yet posted through pla_credits_awarded, and posted-and-not-reversed claims through pla_credits_posted; claims in {DRAFT, CAP_BLOCKED, DENIED, APPEAL_PENDING, DENIED_FINAL, WITHDRAWN} and REVERSED postings contribute nothing. posted_only counts pla_credits_posted alone."
    constants: {}
    precision: "Whole credit hours; floor() on the percentage ceiling, never round."
    variants:
      - name: reserved_inclusive
        when: "Admission decisions: claim submit, award, appeal OVERTURNED/REMANDED, the CAP_BLOCKED cascade and cap_unblock_waterfall"
        difference: "Counts reserved and awarded-but-unposted credits as already consumed, so a student with in-flight claims is refused capacity that posted_only would still grant."
      - name: posted_only
        when: "Transcript posting residency/cap gate and the graduation audit projection"
        difference: "Ignores reserved and awarded-but-unposted credits entirely; for identical Student rows this yields a strictly larger remaining capacity whenever pla_credits_reserved + pla_credits_awarded > 0, and the two numbers are both surfaced side by side by GET /students/{student_id}/graduation-audit."

  - name: outcome_coverage_score
    trigger: "provisional_self_reported on POST /portfolios/{portfolio_id}/submit and on POST /pla-claims/{claim_id}/submit for non-PORTFOLIO sources; assessor_verified on POST /assessor-assignments/{assignment_id}/complete"
    algorithm: weighted_scoring
    formula: |
      # Both variants are a weight-weighted average over EVERY LearningOutcome
      # of the claim's course, in basis points. Outcomes with no contribution
      # enter the sum with 0, they are never dropped from the denominator
      # (the denominator is fixed at 10000 because course weights sum to 10000).

      # VARIANT provisional_self_reported (PORTFOLIO source)
      credit_bp(outcome) = 10000 if any Artifact of the portfolio maps this
                                    outcome with alignment PRIMARY
                           5000  else if any Artifact maps it with alignment SUPPORTING
                           0     otherwise
      provisional_coverage_bp = round_half_up(
          sum over outcomes of (outcome.weight_bp * credit_bp(outcome)) / 10000 )

      # VARIANT provisional_self_reported (non-PORTFOLIO sources)
      provisional_coverage_bp = min(10000,
          round_half_up(articulation_rule.awarded_credits * 10000 / course.credits))

      # VARIANT assessor_verified
      score_ratio_bp(outcome) = round_half_up(points_awarded * 10000 / RUBRIC_MAX_POINTS)
                                for the RubricScore of this assignment and outcome,
                                or 0 when the outcome carries no score
      verified_coverage_bp = round_half_up(
          sum over outcomes of (outcome.weight_bp * score_ratio_bp(outcome)) / 10000 )

      effective_pass_threshold_bp = program.pla_pass_threshold_bp is null
                                      ? PASS_THRESHOLD_BP
                                      : program.pla_pass_threshold_bp
      computed_recommendation = verified_coverage_bp >= effective_pass_threshold_bp
                                  ? PASS : FAIL
    input_set: "Outcome set = every LearningOutcome whose course_id == claim.course_id, ordered by outcome_code ASC. Artifact set = every Artifact whose portfolio_id == the claim's Portfolio (deleted artifacts are gone, not filtered). RubricScore set = only the scores of the assignment being completed; scores of REVOKED or DECLINED assignments never enter the verified variant."
    constants:
      RUBRIC_MAX_POINTS: 4
      PASS_THRESHOLD_BP: 7000
      MIN_PROVISIONAL_COVERAGE_BP: 5000
    precision: "Basis points, round_half_up at each division. The multiplication weight_bp * credit_bp is exact integer arithmetic; only the final division by 10000 rounds."
    variants:
      - name: provisional_self_reported
        when: "Portfolio submit and claim submit — the student's own alignment claims"
        difference: "A PRIMARY mapping scores the full weight of the outcome regardless of evidence quality, so a portfolio that maps every outcome PRIMARY scores 10000 provisionally."
      - name: assessor_verified
        when: "Assignment completion — the faculty rubric"
        difference: "Replaces the self-reported credit_bp with the rubric score ratio out of RUBRIC_MAX_POINTS, so identical artifact mappings yield a strictly lower coverage whenever any outcome scores below 4 of 4; the pass/fail decision uses this variant only."

  - name: assessment_sla_due_at
    trigger: "On AssessorAssignment creation (explicit, AUTO_SELECTED or AUTO_REPLACEMENT)"
    algorithm: decay_function
    formula: |
      base_hours     = SLA_BASE_HOURS_BY_SOURCE[claim.source_type]
      artifact_mult  = ARTIFACT_SLA_MULTIPLIER_BP[tier_of(portfolio.artifact_count)]  # 10000 when no portfolio
      tiered_hours   = round_half_up(base_hours * artifact_mult / 10000)   # STEP 1 rounding
      sla_hours      = claim.priority_tier == EXPEDITED
                         ? round_half_up(tiered_hours * RUSH_SLA_BP / 10000)          # STEP 2 rounding
                         : tiered_hours
      assigned_at    = current_utc at assignment creation
      due_at         = assigned_at + sla_hours hours
      at_risk_at     = assigned_at + round_half_up(sla_hours * SLA_AT_RISK_BP / 10000) hours
    input_set: "The claim's source_type and priority_tier as they stand at assignment creation, plus the artifact_count of the claim's Portfolio at that instant. Later artifact edits do NOT move an existing assignment's due_at; only a new assignment picks up the new tier."
    constants:
      SLA_BASE_HOURS_BY_SOURCE: { CREDIT_BY_EXAM: 72, PORTFOLIO: 240, MILITARY_TRAINING: 96, INDUSTRY_CREDENTIAL: 96 }
      ARTIFACT_SLA_MULTIPLIER_BP: { TIER_0_TO_3: 10000, TIER_4_TO_8: 12500, TIER_9_PLUS: 15000 }
      RUSH_SLA_BP: 5000
      SLA_AT_RISK_BP: 8000
    precision: "Whole hours; the artifact multiplier is applied to the SOURCE BASE and rounded FIRST, the rush factor is applied to that tiered value and rounded SECOND. at_risk_at is derived from the final sla_hours, never from the pre-rush tiered_hours — an EXPEDITED PORTFOLIO claim with 5 artifacts therefore has sla_hours 150 and at_risk offset 120, not sla_hours 150 with at_risk offset 240."

  - name: assignment_sla_state
    trigger: "On every read of an AssessorAssignment and on every POST /_sla/run-escalation-sweep"
    algorithm: threshold
    formula: |
      elapsed_hours = current_utc - assigned_at            # exact, may be fractional
      elapsed_bp    = round_half_up(elapsed_hours * 10000 / sla_hours)
      sla_state     = elapsed_bp >= 10000 ? BREACHED
                      : elapsed_bp >= SLA_AT_RISK_BP ? AT_RISK
                      : ON_TRACK
    input_set: "Only assignments whose status is in {ASSIGNED, ACCEPTED} are candidates for the sweep; DECLINED, REVOKED and SCORING_COMPLETE assignments keep their last computed sla_state for display but are never revoked again."
    constants:
      SLA_AT_RISK_BP: 8000
      BREACH_BP: 10000
    precision: "Both comparisons are inclusive (>=): current_utc exactly at at_risk_at yields AT_RISK, and current_utc exactly at due_at yields BREACHED."

  - name: assessor_selection_rank
    trigger: "On POST /pla-claims/{claim_id}/assessor-assignments without assessor_id, on the decline replacement cascade, on the SLA-sweep replacement cascade, on the appeal remand replacement, and on POST /appeals/{appeal_id}/assign-reviewer without reviewer_assessor_id"
    algorithm: constraint_propagation
    formula: |
      # (a) ELIGIBILITY FILTER — every predicate must hold
      candidate_pool = FacultyAssessor rows where
          status == ACTIVE
        AND department_code == course.department_code
        AND credential_rank >= (course.level == UPPER ? 3 : 2)
        AND assessor_buffered_window_conflict_count(assessor, new_window)
              < max_concurrent_assignments
        AND assessor.id is not the assessor_id of ANY AssessorAssignment of this
            claim (any status — exclusion is permanent per claim)
        AND (for appeal reviewer selection only)
              appeal_panel_member == true
              AND assessor.id not in appeal.prior_scorer_assessor_ids

      # (b) RANKING EXPRESSION — first row wins
      order by active_assignment_count ASC,
               credential_rank DESC,
               created_at ASC,
               employee_number ASC          # (c) total-order tie-break

      # (d) EMPTY POOL FALLBACK
      # explicit assessor_id supplied but filtered out -> ERR_ASSESSOR_NOT_ELIGIBLE (422)
      #   (or ERR_ASSESSOR_CAPACITY_CONFLICT (409) when the ONLY failing predicate
      #    is the buffered-window capacity one, and ERR_ASSESSOR_INACTIVE (409)
      #    when the only failing predicate is status != ACTIVE)
      # server-side selection with an empty pool ->
      #   on the assignment endpoint: ERR_NO_ELIGIBLE_ASSESSOR (409)
      #   on a cascade (decline / sweep / remand): no assignment is created and
      #     PlaClaim.hold_reason = NO_ELIGIBLE_ASSESSOR
      #   on appeal reviewer selection: ERR_NO_ELIGIBLE_ASSESSOR (409)
    input_set: "Candidate rows are FacultyAssessor rows only; no random property, and specifically never id, participates in the filter, the ranking or any tie-break."
    constants:
      MIN_RANK_LOWER: 2
      MIN_RANK_UPPER: 3
    precision: "Deterministic total order: (active_assignment_count ASC, credential_rank DESC, created_at ASC, employee_number ASC) is a total order because employee_number is unique."

  - name: assessor_buffered_window_conflict_count
    trigger: "Inside the assessor eligibility filter and on every explicit-assessor assignment request"
    algorithm: interval_merge
    formula: |
      new_window      = [candidate_assigned_at, candidate_due_at]        # CLOSED interval
      buffered(other) = [other.assigned_at - ASSIGNMENT_BUFFER_HOURS,
                         other.due_at      + ASSIGNMENT_BUFFER_HOURS]    # CLOSED, padded
      conflict_count  = count of AssessorAssignment rows of this assessor with
                        status in {ASSIGNED, ACCEPTED} where
                        buffered(other) intersects new_window
      # CLOSED-interval semantics: touching endpoints DO collide. A new window
      # starting exactly at other.due_at + ASSIGNMENT_BUFFER_HOURS conflicts;
      # one starting one millisecond later does not.
      capacity_ok = conflict_count < assessor.max_concurrent_assignments
    input_set: "Only the assessor's own assignments in {ASSIGNED, ACCEPTED}; DECLINED, REVOKED and SCORING_COMPLETE windows are released and never collide."
    constants:
      ASSIGNMENT_BUFFER_HOURS: 24
    precision: "Millisecond-resolution instants; comparisons are inclusive on both ends of both intervals."

  - name: articulation_window_overlap_check
    trigger: "On POST /articulation-rules/{rule_id}/approve and POST /articulation-rules/{rule_id}/reinstate"
    algorithm: interval_merge
    formula: |
      # HALF-OPEN semantics [effective_from, effective_to); null effective_to is +infinity.
      overlaps(a, b) = a.effective_from < coalesce(b.effective_to, +INF)
                   AND b.effective_from < coalesce(a.effective_to, +INF)
      conflict = any OTHER ArticulationRule with the same recommendation_id AND
                 the same course_id AND status == APPROVED for which overlaps() holds
      # Adjacency is legal: a rule ending exactly at 2027-01-01T00:00:00Z and a
      # rule starting exactly at 2027-01-01T00:00:00Z do NOT overlap.
    input_set: "Only rules sharing BOTH recommendation_id and course_id, and only those in status APPROVED; DRAFT, UNDER_REVIEW, SUSPENDED and RETIRED rules never conflict."
    constants: {}
    precision: "Left-closed, right-open. This is deliberately the opposite geometry from assessor_buffered_window_conflict_count, which is closed on both ends and additionally padded."

  - name: cap_unblock_waterfall
    trigger: "On POST /pla-claims/{claim_id}/withdraw, on POST /pla-claims/{claim_id}/deny, and on POST /pla-claims/{claim_id}/transcript-posting/reversal"
    algorithm: waterfall_allocation
    formula: |
      remaining = program_pla_credit_capacity.remaining_reserved_inclusive(student)
      candidates = PlaClaim rows of this student with assessment_status == CAP_BLOCKED
                   ordered by created_at ASC, claim_number ASC
      for claim in candidates:            # SKIP-AND-CONTINUE, never stop-at-first-failure
          if claim.credits_requested <= remaining
             AND (course.level != UPPER
                  OR claim.credits_requested <= upper_division_remaining):
              claim.assessment_status = SUBMITTED
              claim.hold_reason = null
              student.pla_credits_reserved += claim.credits_requested
              remaining -= claim.credits_requested
          # else: the claim stays CAP_BLOCKED and the walk moves on
    input_set: "Only CAP_BLOCKED claims of the same student. The walk is a single pass; a claim skipped because it was too large is NOT revisited even if a later, smaller claim frees nothing."
    constants: {}
    precision: "Order is fully pinned by (created_at ASC, claim_number ASC), a total order because claim_number is unique per student. Processing the same candidate set in any other order can unblock a different subset — first-fit by creation order is the rule, best-fit is not."

  - name: withdrawal_refund_settlement
    trigger: "On POST /pla-claims/{claim_id}/withdraw, on POST /appeals/{appeal_id}/decide with decision OVERTURNED, on POST /appeals/{appeal_id}/decide with decision REMANDED, and on the articulation-hold invoice waiver"
    algorithm: waterfall_allocation
    formula: |
      net_paid = invoice.paid_cents - invoice.refunded_cents
      retention_bp =
          withdraw from {DRAFT, SUBMITTED, REVISION_REQUESTED, CAP_BLOCKED} -> 0
          withdraw from UNDER_ASSESSMENT                                    -> 5000
          appeal decision OVERTURNED                                        -> 0
          appeal decision REMANDED   -> refund exactly APPEAL_FILING_FEE_CENTS, no bp math
          articulation hold waiver   -> 0
      retained_cents = round_half_up(net_paid * retention_bp / 10000)
      refund_cents   = net_paid - retained_cents
      invoice.refunded_cents += refund_cents
      invoice.waived_cents   += remaining balance_due_cents when the claim ends terminal
      student.fee_paid_net_cents = sum over the student's invoices of
                                   (paid_cents - refunded_cents)
    input_set: "One invoice per claim. The retention rate is selected from the assessment_status the claim is LEAVING, not the one it lands in."
    constants:
      WITHDRAW_RETENTION_BP_UNDER_ASSESSMENT: 5000
      APPEAL_FILING_FEE_CENTS: 6000
    precision: "Integer cents; round_half_up on the retention product, and refund_cents is the exact complement so that paid_cents - refunded_cents equals retained_cents with zero drift."

  - name: graduation_audit_projection
    trigger: "On every GET /students/{student_id}/graduation-audit"
    algorithm: aggregation
    formula: |
      pla_credits_posted        = student.pla_credits_posted
      total_credits_applied     = student.institutional_credits_earned
                                + student.transfer_credits_accepted
                                + pla_credits_posted
      non_residency_credits     = student.transfer_credits_accepted + pla_credits_posted
      residency_satisfied       = student.institutional_credits_earned
                                    >= program.residency_min_credits
                                  AND non_residency_credits
                                    <= program.total_credits_required - program.residency_min_credits
      upper_division_pla_posted = sum of credits_awarded over this student's claims
                                  whose credit_status == POSTED and whose course.level == UPPER
      audit_status =
          not residency_satisfied                                   -> RESIDENCY_DEFICIENT
          else if pla_credits_posted > effective_cap                -> PLA_CAP_VIOLATION
          else if total_credits_applied < program.total_credits_required -> DEFICIENT_CREDITS
          else                                                       -> ELIGIBLE
    input_set: "Posted credit only: claims whose credit_status == POSTED. Claims in credit_status REVERSED and NOT_POSTED contribute 0 to every figure, including upper_division_pla_posted, regardless of assessment_status. The audit reports BOTH capacity variants side by side (pla_cap_remaining_posted_only and pla_cap_remaining_reserved_inclusive) so the divergence is directly observable."
    constants: {}
    precision: "Whole credits; audit_status is evaluated in exactly the order written (residency before cap before credit deficiency)."

validations:
  # ---- 1-2: authentication and authorization ----
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present, and for entity_backed roles X-User-ID resolves to an existing row of the backing entity"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "The acting X-User-Role appears in the called endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "A Student may only act on rows scoped to itself: the PlaClaim, Portfolio, Artifact, FeeInvoice or Appeal must resolve to student_id == X-User-ID"
    error_id: ERR_FORBIDDEN_STUDENT_SCOPE
    http_status: 403
    applies_to: "GET /pla-claims/{claim_id}, POST /pla-claims/{claim_id}/submit, POST /pla-claims/{claim_id}/withdraw, GET /portfolios/{portfolio_id}, POST /portfolios/{portfolio_id}/artifacts, DELETE /portfolios/{portfolio_id}/artifacts/{artifact_id}, POST /portfolios/{portfolio_id}/submit, GET /fee-invoices/{invoice_id}, POST /fee-invoices/{invoice_id}/payments, POST /appeals, GET /students/{student_id}/graduation-audit"
  - priority: 4
    category: auth
    check: "A FacultyAssessor may only act on an AssessorAssignment whose assessor_id == X-User-ID"
    error_id: ERR_FORBIDDEN_ASSESSOR_SCOPE
    http_status: 403
    applies_to: "POST /assessor-assignments/{assignment_id}/accept, POST /assessor-assignments/{assignment_id}/decline, POST /assessor-assignments/{assignment_id}/rubric-scores, POST /assessor-assignments/{assignment_id}/complete"
  - priority: 5
    category: auth
    check: "The acting AppealReviewer's FacultyAssessor row has appeal_panel_member == true"
    error_id: ERR_NOT_APPEAL_PANEL_MEMBER
    http_status: 403
    applies_to: "POST /appeals/{appeal_id}/decide"

  # ---- 6-7: existence, path first (left to right), then body references ----
  - priority: 6
    category: existence
    check: "Every id in the request path exists, resolved strictly left-to-right: parent segment before child segment"
    error_id: "ERR_PROGRAM_NOT_FOUND | ERR_COURSE_NOT_FOUND | ERR_STUDENT_NOT_FOUND | ERR_ASSESSOR_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_PORTFOLIO_NOT_FOUND | ERR_ARTIFACT_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_RUBRIC_SCORE_NOT_FOUND | ERR_APPEAL_NOT_FOUND | ERR_INVOICE_NOT_FOUND | ERR_RECOMMENDATION_NOT_FOUND | ERR_ARTICULATION_RULE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"
  - priority: 7
    category: existence
    check: "Every id referenced in the request body exists, resolved in the field order declared by the endpoint's input"
    error_id: "ERR_PROGRAM_NOT_FOUND | ERR_COURSE_NOT_FOUND | ERR_STUDENT_NOT_FOUND | ERR_ASSESSOR_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_OUTCOME_NOT_FOUND | ERR_RECOMMENDATION_NOT_FOUND | ERR_ARTICULATION_RULE_NOT_FOUND"
    http_status: 404
    applies_to: "POST /pla-claims, POST /articulation-rules, POST /students, POST /courses, POST /portfolios, POST /pla-claims/{claim_id}/assessor-assignments, POST /assessor-assignments/{assignment_id}/rubric-scores, POST /appeals, POST /appeals/{appeal_id}/assign-reviewer"

  # ---- 8-11: syntactic and type-level request validation ----
  - priority: 8
    category: existence
    check: "Required input fields are present and every field is of the declared type / enum domain / numeric range"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 9
    category: business_constraint
    check: "credits_requested is an integer >= 1 and <= course.credits"
    error_id: ERR_INVALID_CREDIT_REQUEST
    http_status: 422
    applies_to: "POST /pla-claims"
  - priority: 9
    category: business_constraint
    check: "articulation_rule_id is present for every source_type other than PORTFOLIO and absent for PORTFOLIO; supersedes_claim_id, when present, points at a claim of the same student and course whose assessment_status is DENIED_FINAL or WITHDRAWN"
    error_id: "ERR_ARTICULATION_RULE_REQUIRED | ERR_ARTICULATION_RULE_FORBIDDEN | ERR_SUPERSEDED_CLAIM_NOT_TERMINAL"
    http_status: 422
    applies_to: "POST /pla-claims"
  - priority: 9
    category: business_constraint
    check: "The target claim's source_type is PORTFOLIO and it has no Portfolio yet"
    error_id: "ERR_PORTFOLIO_NOT_ALLOWED_FOR_SOURCE | ERR_PORTFOLIO_ALREADY_EXISTS"
    http_status: "422 | 409"
    applies_to: "POST /portfolios"
  - priority: 10
    category: business_constraint
    check: "The learning_outcomes supplied with a Course have weight_bp values summing to exactly 10000 and unique outcome_code values"
    error_id: ERR_OUTCOME_WEIGHTS_INVALID
    http_status: 422
    applies_to: "POST /courses"
  - priority: 11
    category: business_constraint
    check: "points_awarded is an integer in 0..4 inclusive"
    error_id: ERR_RUBRIC_POINTS_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /assessor-assignments/{assignment_id}/rubric-scores"

  # ---- 12-13: optimistic concurrency, checked before any state precondition ----
  - priority: 12
    category: state
    check: "expected_student_version equals the current Student.version"
    error_id: ERR_STALE_STUDENT_VERSION
    http_status: 412
    applies_to: "POST /pla-claims/{claim_id}/award"
  - priority: 13
    category: state
    check: "expected_recommendation_version equals the current CredentialRecommendation.version"
    error_id: ERR_STALE_RECOMMENDATION_VERSION
    http_status: 412
    applies_to: "POST /articulation-rules/{rule_id}/approve"

  # ---- 14-19: state preconditions ----
  - priority: 14
    category: state
    check: "The PlaClaim's assessment_status is not one of the terminal states AWARDED, DENIED_FINAL, WITHDRAWN"
    error_id: ERR_CLAIM_ALREADY_TERMINAL
    http_status: 409
    applies_to: "POST /pla-claims/{claim_id}/submit, POST /pla-claims/{claim_id}/withdraw, POST /pla-claims/{claim_id}/request-revision, POST /pla-claims/{claim_id}/deny, POST /pla-claims/{claim_id}/assessor-assignments, POST /appeals"
  - priority: 15
    category: state
    check: "The PlaClaim's assessment_status is a declared from-state of the requested transition (§1.3 PlaClaim.assessment_status)"
    error_id: "ERR_CLAIM_NOT_DRAFT | ERR_CLAIM_NOT_SUBMITTED | ERR_CLAIM_NOT_UNDER_ASSESSMENT | ERR_CLAIM_NOT_SCORED | ERR_CLAIM_NOT_DENIED | ERR_CLAIM_NOT_AWARDED"
    http_status: 409
    applies_to: "POST /pla-claims/{claim_id}/submit, POST /pla-claims/{claim_id}/request-revision, POST /pla-claims/{claim_id}/assessor-assignments, POST /pla-claims/{claim_id}/award, POST /pla-claims/{claim_id}/deny, POST /appeals, POST /pla-claims/{claim_id}/transcript-posting, POST /pla-claims/{claim_id}/transcript-posting/reversal"
  - priority: 15
    category: state
    check: "The ArticulationRule's status is a declared from-state of the requested transition, and the CredentialRecommendation's status is a declared from-state of publish or retire"
    error_id: "ERR_RULE_NOT_DRAFT | ERR_RULE_NOT_UNDER_REVIEW | ERR_RULE_NOT_APPROVED | ERR_RULE_NOT_SUSPENDED | ERR_RECOMMENDATION_NOT_DRAFT | ERR_RECOMMENDATION_NOT_PUBLISHED"
    http_status: 409
    applies_to: "POST /articulation-rules/{rule_id}/submit-for-review, POST /articulation-rules/{rule_id}/approve, POST /articulation-rules/{rule_id}/suspend, POST /articulation-rules/{rule_id}/reinstate, POST /credential-recommendations/{recommendation_id}/publish, POST /credential-recommendations/{recommendation_id}/retire, PATCH /credential-recommendations/{recommendation_id}"
  - priority: 15
    category: state
    check: "The PlaClaim's credit_status permits the operation: NOT_POSTED or REVERSED to post, POSTED to reverse"
    error_id: "ERR_CREDIT_ALREADY_POSTED | ERR_CREDIT_NOT_POSTED"
    http_status: 409
    applies_to: "POST /pla-claims/{claim_id}/transcript-posting, POST /pla-claims/{claim_id}/transcript-posting/reversal"
  - priority: 16
    category: state
    check: "The Portfolio's status permits the operation: DRAFT or REVISION_REQUESTED to add or delete artifacts and to submit; LOCKED and VOIDED permit neither"
    error_id: "ERR_PORTFOLIO_NOT_EDITABLE | ERR_PORTFOLIO_NOT_SUBMITTABLE"
    http_status: 409
    applies_to: "POST /portfolios/{portfolio_id}/artifacts, DELETE /portfolios/{portfolio_id}/artifacts/{artifact_id}, POST /portfolios/{portfolio_id}/submit"
  - priority: 17
    category: state
    check: "The AssessorAssignment's status permits the operation: ASSIGNED for accept and decline; ACCEPTED for rubric-scores and complete"
    error_id: "ERR_ASSIGNMENT_NOT_PENDING | ERR_ASSIGNMENT_NOT_ACCEPTED"
    http_status: 409
    applies_to: "POST /assessor-assignments/{assignment_id}/accept, POST /assessor-assignments/{assignment_id}/decline, POST /assessor-assignments/{assignment_id}/rubric-scores, POST /assessor-assignments/{assignment_id}/complete"
  - priority: 18
    category: state
    check: "The Appeal's status permits the operation: FILED for assign-reviewer; UNDER_REVIEW for decide"
    error_id: "ERR_APPEAL_NOT_FILED | ERR_APPEAL_NOT_UNDER_REVIEW"
    http_status: 409
    applies_to: "POST /appeals/{appeal_id}/assign-reviewer, POST /appeals/{appeal_id}/decide"
  - priority: 19
    category: state
    check: "The FeeInvoice's fee_status accepts money movement: UNBILLED, WAIVED, REFUNDED and RETAINED invoices reject payments, and a PAID invoice with balance_due_cents == 0 rejects further payment"
    error_id: ERR_INVOICE_NOT_PAYABLE
    http_status: 409
    applies_to: "POST /fee-invoices/{invoice_id}/payments, POST /fee-invoices/{invoice_id}/waive"

  # ---- 20-22: compliance / segregation of duties / referential integrity of the crosswalk ----
  - priority: 20
    category: business_safety
    check: "Segregation of duties: the X-User-ID that submitted an ArticulationRule for review must not be the X-User-ID that approves it, and an AppealReviewer must not appear in the appeal's prior_scorer_assessor_ids"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /articulation-rules/{rule_id}/approve, POST /appeals/{appeal_id}/assign-reviewer, POST /appeals/{appeal_id}/decide"
  - priority: 21
    category: business_referential
    check: "The claim's pinned ArticulationRule is in status APPROVED and its parent CredentialRecommendation is in status PUBLISHED at the moment of award"
    error_id: ERR_ARTICULATION_NOT_APPROVED
    http_status: 409
    applies_to: "POST /pla-claims/{claim_id}/award, POST /pla-claims/{claim_id}/transcript-posting"
  - priority: 22
    category: business_referential
    check: "The pinned ArticulationRule.pinned_recommendation_version equals the current CredentialRecommendation.terms_version — the national recommendation's terms have not been revised since the crosswalk was approved against them. Only PATCH /credential-recommendations/{recommendation_id} moves terms_version, so publish, retire and sibling rule approvals never trip this rule"
    error_id: ERR_ARTICULATION_STALE_PIN
    http_status: 409
    applies_to: "POST /pla-claims/{claim_id}/award, POST /pla-claims/{claim_id}/transcript-posting"

  # ---- 23-27: structural correctness of the claim / portfolio / crosswalk ----
  - priority: 23
    category: business_referential
    check: "Every learning_outcome_id in an artifact's outcome_mappings, and every learning_outcome_id in a RubricScore, belongs to the claim's course"
    error_id: ERR_OUTCOME_NOT_IN_COURSE
    http_status: 422
    applies_to: "POST /portfolios/{portfolio_id}/artifacts, POST /assessor-assignments/{assignment_id}/rubric-scores"
  - priority: 24
    category: business_constraint
    check: "The claim's source_type is listed in the student's Program.allowed_source_types, and the target Course has pla_eligible == true"
    error_id: "ERR_SOURCE_NOT_ALLOWED_BY_PROGRAM | ERR_COURSE_NOT_PLA_ELIGIBLE"
    http_status: 422
    applies_to: "POST /pla-claims"
  - priority: 25
    category: business_constraint
    check: "The Student's enrollment_status is MATRICULATED and the Program's status is ACTIVE"
    error_id: "ERR_STUDENT_NOT_MATRICULATED | ERR_PROGRAM_INACTIVE"
    http_status: 409
    applies_to: "POST /pla-claims, POST /pla-claims/{claim_id}/submit, POST /pla-claims/{claim_id}/award, POST /pla-claims/{claim_id}/transcript-posting"
  - priority: 26
    category: business_constraint
    check: "Posting must not break residency: after the posting, transfer_credits_accepted + pla_credits_posted must remain <= program.total_credits_required - program.residency_min_credits (the posted_only capacity variant's residency_headroom)"
    error_id: ERR_RESIDENCY_REQUIREMENT_VIOLATION
    http_status: 409
    applies_to: "POST /pla-claims/{claim_id}/transcript-posting"
  - priority: 27
    category: business_temporal
    check: "For CREDIT_BY_EXAM and INDUSTRY_CREDENTIAL claims, attempt_date (exam or credential award date) falls inside the pinned ArticulationRule's [effective_from, effective_to) window"
    error_id: ERR_ATTEMPT_DATE_OUTSIDE_WINDOW
    http_status: 422
    applies_to: "POST /pla-claims, POST /pla-claims/{claim_id}/submit"

  # ---- 28-30: temporal windows and uniqueness ----
  - priority: 28
    category: business_temporal
    check: "current_utc is strictly before the claim's appeal_deadline_at (denial timestamp + APPEAL_WINDOW_HOURS 336); exactly at the deadline is closed"
    error_id: ERR_APPEAL_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /appeals"
  - priority: 29
    category: business_temporal
    check: "No other APPROVED ArticulationRule for the same (recommendation_id, course_id) pair has a half-open [effective_from, effective_to) window overlapping this one; adjacency is legal"
    error_id: ERR_ARTICULATION_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /articulation-rules/{rule_id}/approve, POST /articulation-rules/{rule_id}/reinstate"
  - priority: 30
    category: business_constraint
    check: "The student has no other PlaClaim for the same course_id in a non-terminal or AWARDED state, unless the new claim declares supersedes_claim_id pointing at a DENIED_FINAL or WITHDRAWN claim for that course"
    error_id: ERR_DUPLICATE_CLAIM
    http_status: 409
    applies_to: "POST /pla-claims"

  - priority: 30
    category: business_constraint
    check: "At most one RubricScore per (assignment_id, learning_outcome_id) pair — a second score for the same outcome is rejected, never an overwrite"
    error_id: ERR_DUPLICATE_RUBRIC_SCORE
    http_status: 409
    applies_to: "POST /assessor-assignments/{assignment_id}/rubric-scores"
  - priority: 30
    category: business_temporal
    check: "current_utc supplied to the clock endpoint is greater than or equal to the current logical clock value — the clock never moves backwards"
    error_id: ERR_CLOCK_NOT_MONOTONIC
    http_status: 422
    applies_to: "POST /_clock/set_current_utc"
  - priority: 31
    category: business_constraint
    check: "The named FacultyAssessor has never held an AssessorAssignment on this claim in any status — per-claim exclusion is permanent"
    error_id: ERR_ASSESSOR_ALREADY_ASSIGNED
    http_status: 409
    applies_to: "POST /pla-claims/{claim_id}/assessor-assignments"

  # ---- 31-33: assessor eligibility, capacity, and round limits ----
  - priority: 31
    category: business_constraint
    check: "An explicitly named FacultyAssessor has status == ACTIVE"
    error_id: ERR_ASSESSOR_INACTIVE
    http_status: 409
    applies_to: "POST /pla-claims/{claim_id}/assessor-assignments, POST /appeals/{appeal_id}/assign-reviewer"
  - priority: 32
    category: business_constraint
    check: "An explicitly named assessor satisfies every eligibility predicate of assessor_selection_rank (department match, credential_rank floor, never previously assigned to this claim, appeal-panel membership for reviewers) and has buffered-window capacity below max_concurrent_assignments; when the server selects, the eligible pool is non-empty"
    error_id: "ERR_ASSESSOR_NOT_ELIGIBLE | ERR_ASSESSOR_CAPACITY_CONFLICT | ERR_NO_ELIGIBLE_ASSESSOR"
    http_status: "422 | 409 | 409"
    applies_to: "POST /pla-claims/{claim_id}/assessor-assignments, POST /appeals/{appeal_id}/assign-reviewer"
  - priority: 33
    category: business_constraint
    check: "revision_round < MAX_REVISION_ROUNDS (2) before requesting another revision, and appeal_count < MAX_APPEALS_PER_CLAIM (1) before filing another appeal"
    error_id: "ERR_REVISION_LIMIT_REACHED | ERR_APPEAL_LIMIT_REACHED"
    http_status: 409
    applies_to: "POST /pla-claims/{claim_id}/request-revision, POST /appeals"

  # ---- 34-37: evidence sufficiency and rubric completeness ----
  - priority: 34
    category: business_constraint
    check: "A PORTFOLIO-source claim's Portfolio has artifact_count >= 1 at submit"
    error_id: ERR_PORTFOLIO_NO_ARTIFACTS
    http_status: 422
    applies_to: "POST /portfolios/{portfolio_id}/submit, POST /pla-claims/{claim_id}/submit"
  - priority: 35
    category: business_constraint
    check: "provisional_coverage_bp >= MIN_PROVISIONAL_COVERAGE_BP (5000) at portfolio submit"
    error_id: ERR_INSUFFICIENT_OUTCOME_COVERAGE
    http_status: 422
    applies_to: "POST /portfolios/{portfolio_id}/submit"
  - priority: 36
    category: business_constraint
    check: "Completing an assignment requires exactly one RubricScore for every LearningOutcome of the claim's course, and the submitted recommendation must equal the computed_recommendation implied by verified_coverage_bp against the effective pass threshold"
    error_id: "ERR_INCOMPLETE_RUBRIC | ERR_RECOMMENDATION_INCONSISTENT"
    http_status: 422
    applies_to: "POST /assessor-assignments/{assignment_id}/complete"
  - priority: 37
    category: business_constraint
    check: "credits_awarded <= the pinned ArticulationRule.awarded_credits and the claim's course level matches the rule's course level"
    error_id: "ERR_AWARD_EXCEEDS_RECOMMENDATION | ERR_LEVEL_MISMATCH"
    http_status: 422
    applies_to: "POST /pla-claims/{claim_id}/award"

  # ---- 38-39: capacity and quota, checked after every referential and structural rule ----
  - priority: 38
    category: business_constraint
    check: "For an UPPER-level course, credits_awarded <= program.pla_upper_division_max_credits - student.pla_upper_division_committed"
    error_id: ERR_UPPER_DIVISION_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /pla-claims/{claim_id}/award, POST /pla-claims/{claim_id}/transcript-posting"
  - priority: 39
    category: business_constraint
    check: "At award, credits_awarded <= program_pla_credit_capacity.remaining_for(claim) (the reserved_inclusive variant with the claim's own reservation removed); at posting, posted_credits <= remaining_posted_only"
    error_id: ERR_PLA_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /pla-claims/{claim_id}/award, POST /pla-claims/{claim_id}/transcript-posting"

  # ---- 40-43: fiscal rules last ----
  - priority: 40
    category: business_fiscal
    check: "A payment whose method is FINANCIAL_AID is rejected because assessment fees are aid-ineligible (FeeInvoice.aid_eligible is always false)"
    error_id: ERR_AID_NOT_APPLICABLE
    http_status: 422
    applies_to: "POST /fee-invoices/{invoice_id}/payments"
  - priority: 41
    category: business_fiscal
    check: "amount_cents <= invoice.balance_due_cents — overpayment is refused, never auto-refunded"
    error_id: ERR_PAYMENT_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /fee-invoices/{invoice_id}/payments"
  - priority: 42
    category: business_fiscal
    check: "The claim's FeeInvoice has fee_status in {PAID, WAIVED} before an assessor may be assigned"
    error_id: ERR_ASSESSMENT_FEE_UNPAID
    http_status: 402
    applies_to: "POST /pla-claims/{claim_id}/assessor-assignments"
  - priority: 43
    category: business_fiscal
    check: "The APPEAL_FILING_FEE line of the claim's FeeInvoice is settled (balance_due_cents == 0) before a reviewer may be assigned to the appeal"
    error_id: ERR_APPEAL_FEE_UNPAID
    http_status: 402
    applies_to: "POST /appeals/{appeal_id}/assign-reviewer"

endpoints:
  # ---------- Program ----------
  - method: POST
    path: "/programs"
    description: "Register a degree program with its PLA cap configuration and residency rule."
    roles: [PlaCoordinator]
    code: 201
    input: [program_code, title, total_credits_required, residency_min_credits, pla_max_credits, pla_max_pct_bp, pla_upper_division_max_credits, allowed_source_types, "pla_pass_threshold_bp?", "status?"]
    output: Program
    side_effects: ["computes effective_pla_cap_credits via calculations.program_pla_credit_capacity (residency_headroom evaluated with transfer_credits_accepted = 0)"]
  - method: GET
    path: "/programs/{program_id}"
    description: "Read one program, including its computed effective_pla_cap_credits."
    roles: [PlaCoordinator, Registrar, ArticulationOfficer, FacultyAssessor, AppealReviewer, Student]
    code: 200
    input: []
    output: Program
    side_effects: []
  - method: PATCH
    path: "/programs/{program_id}"
    description: "Amend a program's cap configuration, pass-threshold override, allowed source types or status."
    roles: [PlaCoordinator]
    code: 200
    input: ["pla_max_credits?", "pla_max_pct_bp?", "pla_upper_division_max_credits?", "residency_min_credits?", "total_credits_required?", "pla_pass_threshold_bp?", "allowed_source_types?", "status?"]
    output: Program
    side_effects: ["recomputes effective_pla_cap_credits", "increments Program.version by 1"]

  # ---------- Course and LearningOutcome ----------
  - method: POST
    path: "/courses"
    description: "Create a course together with its full learning-outcome set; learning_outcomes is a list of { outcome_code, description, weight_bp, mastery_threshold_bp? } whose weight_bp values must sum to exactly 10000."
    roles: [PlaCoordinator]
    code: 201
    input: [course_code, title, department_code, credits, level, learning_outcomes, "pla_eligible?"]
    output: Course
    side_effects: ["creates one LearningOutcome per entry in learning_outcomes", "sets Course.outcome_count to the number of outcomes created"]
  - method: GET
    path: "/courses/{course_id}"
    description: "Read one course."
    roles: [PlaCoordinator, Registrar, ArticulationOfficer, FacultyAssessor, AppealReviewer, Student]
    code: 200
    input: []
    output: Course
    side_effects: []
  - method: GET
    path: "/learning-outcomes/{outcome_id}"
    description: "Read one learning outcome."
    roles: [PlaCoordinator, Registrar, ArticulationOfficer, FacultyAssessor, AppealReviewer, Student]
    code: 200
    input: []
    output: LearningOutcome
    side_effects: []
  - method: GET
    path: "/learning-outcomes"
    description: "List learning outcomes, sorted by outcome_code ASC."
    roles: [PlaCoordinator, Registrar, ArticulationOfficer, FacultyAssessor, AppealReviewer, Student]
    code: 200
    input: ["course_id?", "outcome_code?"]
    output: LearningOutcome[]
    side_effects: []

  # ---------- CredentialRecommendation ----------
  - method: POST
    path: "/credential-recommendations"
    description: "Record a national credential recommendation (ACE-style) in DRAFT."
    roles: [ArticulationOfficer]
    code: 201
    input: [source_type, credential_code, title, issuing_body, recommended_credits, recommended_level, effective_from, "effective_to?"]
    output: CredentialRecommendation
    side_effects: []
  - method: GET
    path: "/credential-recommendations/{recommendation_id}"
    description: "Read one credential recommendation, including its current version and approved_rule_count."
    roles: [PlaCoordinator, Registrar, ArticulationOfficer, FacultyAssessor, AppealReviewer, Student]
    code: 200
    input: []
    output: CredentialRecommendation
    side_effects: []
  - method: PATCH
    path: "/credential-recommendations/{recommendation_id}"
    description: "Revise a DRAFT or PUBLISHED recommendation's terms. Any accepted revision bumps version, which invalidates every ArticulationRule pin taken against the previous version."
    roles: [ArticulationOfficer]
    code: 200
    input: ["recommended_credits?", "recommended_level?", "title?", "effective_to?"]
    output: CredentialRecommendation
    side_effects: ["increments CredentialRecommendation.terms_version by 1", "increments CredentialRecommendation.version by 1", "existing APPROVED ArticulationRule rows whose pinned_recommendation_version no longer matches the new terms_version become stale pins (detected at award and posting time, not eagerly)"]
  - method: POST
    path: "/credential-recommendations/{recommendation_id}/publish"
    description: "Publish a DRAFT recommendation so its approved crosswalk rules may be used for awards."
    roles: [ArticulationOfficer]
    code: 200
    input: []
    output: CredentialRecommendation
    side_effects: ["transitions CredentialRecommendation DRAFT -> PUBLISHED", "increments CredentialRecommendation.version by 1"]
  - method: POST
    path: "/credential-recommendations/{recommendation_id}/retire"
    description: "Retire a PUBLISHED recommendation, firing the four-hop retire cascade over its rules, claims, assignments and invoices."
    roles: [ArticulationOfficer]
    code: 200
    input: [retire_reason]
    output: CredentialRecommendation
    side_effects: ["transitions CredentialRecommendation PUBLISHED -> RETIRED", "hop 1: every APPROVED ArticulationRule of this recommendation -> SUSPENDED with suspend_reason RECOMMENDATION_RETIRED, and approved_rule_count falls to 0", "hop 2 (caused by hop 1): every PlaClaim pinned to a just-suspended rule with assessment_status in {SUBMITTED, UNDER_ASSESSMENT} -> REVISION_REQUESTED with hold_reason ARTICULATION_SUSPENDED; SCORED claims are deliberately untouched", "hop 3 (caused by hop 2): each such claim's AssessorAssignment rows in {ASSIGNED, ACCEPTED} -> REVOKED with revoke_reason REVISION_REQUESTED and FacultyAssessor.active_assignment_count decremented, AND each such claim's FeeInvoice in fee_status {INVOICED, PARTIALLY_PAID, PAID} -> WAIVED at the institution's expense: every cent of net paid is refunded and the whole total_cents is moved into waived_cents, so balance_due_cents lands on 0", "hop 4 (caused by hop 3): Student.fee_paid_net_cents is recomputed from the refunded invoices and Student.version is incremented", "increments CredentialRecommendation.version by 1"]

  # ---------- ArticulationRule ----------
  - method: POST
    path: "/articulation-rules"
    description: "Draft a crosswalk from a credential recommendation to a local course equivalency."
    roles: [ArticulationOfficer]
    code: 201
    input: [recommendation_id, course_id, awarded_credits, effective_from, "effective_to?"]
    output: ArticulationRule
    side_effects: []
  - method: POST
    path: "/articulation-rules/{rule_id}/submit-for-review"
    description: "Move a DRAFT rule to UNDER_REVIEW, recording the acting X-User-ID as reviewed_by_user_id for the segregation-of-duties check at approval."
    roles: [ArticulationOfficer]
    code: 200
    input: []
    output: ArticulationRule
    side_effects: ["transitions ArticulationRule DRAFT -> UNDER_REVIEW", "sets reviewed_by_user_id to the acting X-User-ID"]
  - method: POST
    path: "/articulation-rules/{rule_id}/approve"
    description: "Approve an UNDER_REVIEW rule. Requires expected_recommendation_version (OCC on the parent CredentialRecommendation) and a different X-User-ID from the reviewer."
    roles: [ArticulationOfficer]
    code: 200
    input: [expected_recommendation_version]
    output: ArticulationRule
    side_effects: ["transitions ArticulationRule UNDER_REVIEW -> APPROVED", "runs calculations.articulation_window_overlap_check against sibling APPROVED rules", "sets approved_by_user_id to the acting X-User-ID", "pins pinned_recommendation_version to the parent CredentialRecommendation.terms_version, which this endpoint does NOT change, so a freshly approved rule is never stale", "increments CredentialRecommendation.approved_rule_count by 1", "increments CredentialRecommendation.version by 1"]
  - method: POST
    path: "/articulation-rules/{rule_id}/suspend"
    description: "Suspend an APPROVED rule, firing the suspend cascade over in-flight claims pinned to it."
    roles: [ArticulationOfficer]
    code: 200
    input: [suspend_reason]
    output: ArticulationRule
    side_effects: ["transitions ArticulationRule APPROVED -> SUSPENDED", "every PlaClaim pinned to this rule with assessment_status in {SUBMITTED, UNDER_ASSESSMENT} gets hold_reason ARTICULATION_SUSPENDED (SCORED claims are deliberately left untouched so the §1.4 priority conflict at award remains observable)", "decrements CredentialRecommendation.approved_rule_count by 1", "increments CredentialRecommendation.version by 1"]
  - method: POST
    path: "/articulation-rules/{rule_id}/reinstate"
    description: "Return a SUSPENDED rule to APPROVED, re-running the window-overlap check."
    roles: [ArticulationOfficer]
    code: 200
    input: []
    output: ArticulationRule
    side_effects: ["transitions ArticulationRule SUSPENDED -> APPROVED", "re-runs calculations.articulation_window_overlap_check", "clears hold_reason ARTICULATION_SUSPENDED on the claims it set", "increments CredentialRecommendation.approved_rule_count by 1", "increments CredentialRecommendation.version by 1"]
  - method: GET
    path: "/articulation-rules/{rule_id}"
    description: "Read one crosswalk rule, including its pinned_recommendation_version (a terms_version pin)."
    roles: [PlaCoordinator, Registrar, ArticulationOfficer, FacultyAssessor, AppealReviewer, Student]
    code: 200
    input: []
    output: ArticulationRule
    side_effects: []
  - method: GET
    path: "/articulation-rules"
    description: "List crosswalk rules, sorted by effective_from ASC then created_at ASC."
    roles: [PlaCoordinator, Registrar, ArticulationOfficer, FacultyAssessor, AppealReviewer, Student]
    code: 200
    input: ["recommendation_id?", "course_id?", "status?"]
    output: ArticulationRule[]
    side_effects: []

  # ---------- Student ----------
  - method: POST
    path: "/students"
    description: "Enrol a student in a program. All PLA ledger counters start at 0."
    roles: [PlaCoordinator, Registrar]
    code: 201
    input: [student_number, full_name, program_id, "enrollment_status?", "transfer_credits_accepted?", "institutional_credits_earned?"]
    output: Student
    side_effects: []
  - method: GET
    path: "/students/{student_id}"
    description: "Read one student, including the four PLA ledger counters and the current version used for OCC at award."
    roles: [PlaCoordinator, Registrar, FacultyAssessor, AppealReviewer, Student]
    code: 200
    input: []
    output: Student
    side_effects: []
  - method: GET
    path: "/students"
    description: "List students, sorted by student_number ASC."
    roles: [PlaCoordinator, Registrar]
    code: 200
    input: ["program_id?", "enrollment_status?"]
    output: Student[]
    side_effects: []
  - method: PATCH
    path: "/students/{student_id}"
    description: "Registrar adjustment of enrollment status and non-PLA credit counters. The four PLA ledger counters are system-maintained and are never writable here."
    roles: [Registrar, PlaCoordinator]
    code: 200
    input: ["enrollment_status?", "transfer_credits_accepted?", "institutional_credits_earned?"]
    output: Student
    side_effects: ["recomputes the owning Program's effective_pla_cap_credits view for this student (residency_headroom depends on transfer_credits_accepted)", "increments Student.version by 1"]
  - method: GET
    path: "/students/{student_id}/graduation-audit"
    description: "Computed read: the graduation audit projection, exposing BOTH capacity variants side by side."
    roles: [Registrar, PlaCoordinator, Student]
    code: 200
    input: []
    output: "{ student_id: string, program_id: string, effective_pla_cap_credits: integer, pla_credits_posted: integer, pla_credits_reserved: integer, pla_credits_awarded: integer, pla_cap_remaining_posted_only: integer, pla_cap_remaining_reserved_inclusive: integer, upper_division_pla_posted: integer, upper_division_remaining: integer, institutional_credits_earned: integer, transfer_credits_accepted: integer, total_credits_applied: integer, residency_satisfied: boolean, audit_status: string }"
    side_effects: []

  # ---------- FacultyAssessor ----------
  - method: POST
    path: "/faculty-assessors"
    description: "Register a faculty assessor with department, credential rank and concurrency ceiling."
    roles: [PlaCoordinator]
    code: 201
    input: [employee_number, full_name, department_code, credential_rank, "max_concurrent_assignments?", "appeal_panel_member?", "status?"]
    output: FacultyAssessor
    side_effects: []
  - method: GET
    path: "/faculty-assessors/{assessor_id}"
    description: "Read one assessor, including the live active_assignment_count used by the selector's ranking expression."
    roles: [PlaCoordinator, Registrar, FacultyAssessor, AppealReviewer]
    code: 200
    input: []
    output: FacultyAssessor
    side_effects: []
  - method: GET
    path: "/faculty-assessors"
    description: "List assessors, sorted by employee_number ASC."
    roles: [PlaCoordinator, Registrar]
    code: 200
    input: ["department_code?", "status?", "appeal_panel_member?"]
    output: FacultyAssessor[]
    side_effects: []
  - method: PATCH
    path: "/faculty-assessors/{assessor_id}"
    description: "Amend an assessor's status, credential rank, concurrency ceiling or appeal-panel membership."
    roles: [PlaCoordinator]
    code: 200
    input: ["status?", "credential_rank?", "max_concurrent_assignments?", "appeal_panel_member?", "department_code?"]
    output: FacultyAssessor
    side_effects: ["increments FacultyAssessor.version by 1"]

  # ---------- PlaClaim ----------
  - method: POST
    path: "/pla-claims"
    description: "Open a DRAFT prior-learning claim. articulation_rule_id is required for every source_type except PORTFOLIO and forbidden for PORTFOLIO; claim_number is assigned monotonically per student."
    roles: [Student, PlaCoordinator]
    code: 201
    input: [student_id, course_id, source_type, credits_requested, "articulation_rule_id?", "attempt_date?", "rush_requested?", "supersedes_claim_id?"]
    output: PlaClaim
    side_effects: ["assigns claim_number as max(claim_number) + 1 within the student", "sets priority_tier to EXPEDITED when rush_requested is true, otherwise STANDARD", "for source_type PORTFOLIO no Portfolio is auto-created; the student creates it explicitly"]
  - method: GET
    path: "/pla-claims/{claim_id}"
    description: "Read one claim, including all three status dimensions and both coverage figures."
    roles: [PlaCoordinator, Registrar, FacultyAssessor, AppealReviewer, Student]
    code: 200
    input: []
    output: PlaClaim
    side_effects: []
  - method: GET
    path: "/pla-claims"
    description: "List claims, sorted by created_at ASC then claim_number ASC — the same total order the cap_unblock_waterfall walks."
    roles: [PlaCoordinator, Registrar, FacultyAssessor, AppealReviewer, Student]
    code: 200
    input: ["student_id?", "course_id?", "articulation_rule_id?", "supersedes_claim_id?", "assessment_status?", "fee_status?", "credit_status?"]
    output: PlaClaim[]
    side_effects: []
  - method: POST
    path: "/pla-claims/{claim_id}/submit"
    description: "Submit a DRAFT or REVISION_REQUESTED claim for assessment. Creates the FeeInvoice on first submit and recomputes it on every later submit."
    roles: [Student, PlaCoordinator]
    code: 200
    input: []
    output: PlaClaim
    side_effects: ["evaluates calculations.program_pla_credit_capacity in the reserved_inclusive variant; when credits_requested exceeds remaining_reserved_inclusive the claim lands in CAP_BLOCKED with hold_reason PLA_CAP, and when it only exceeds upper_division_remaining for an UPPER-level course it lands in CAP_BLOCKED with hold_reason UPPER_DIVISION_CAP; in both cases no reservation is made", "on success transitions assessment_status -> SUBMITTED, sets submitted_at, and adds credits_requested to Student.pla_credits_reserved", "creates the FeeInvoice on first submit (fee_status UNBILLED -> INVOICED) or recomputes it via calculations.assessment_fee_invoice_total on re-submit, incrementing FeeInvoice.recompute_count", "computes provisional_coverage_bp for non-PORTFOLIO sources", "increments Student.version by 1"]
  - method: POST
    path: "/pla-claims/{claim_id}/withdraw"
    description: "Student or coordinator withdrawal. Releases reservations, settles the invoice per the retention schedule, and runs the cap unblock waterfall."
    roles: [Student, PlaCoordinator]
    code: 200
    input: [withdraw_reason]
    output: PlaClaim
    side_effects: ["transitions assessment_status -> WITHDRAWN", "releases credits_requested from Student.pla_credits_reserved", "revokes every AssessorAssignment of the claim in {ASSIGNED, ACCEPTED}, decrementing FacultyAssessor.active_assignment_count", "voids the claim's Portfolio", "runs calculations.withdrawal_refund_settlement using the status the claim is leaving", "runs calculations.cap_unblock_waterfall over the student's CAP_BLOCKED claims", "increments Student.version by 1"]
  - method: POST
    path: "/pla-claims/{claim_id}/request-revision"
    description: "Send a SUBMITTED or UNDER_ASSESSMENT claim back to the student for more evidence, bounded by MAX_REVISION_ROUNDS."
    roles: [PlaCoordinator]
    code: 200
    input: [revision_note]
    output: PlaClaim
    side_effects: ["transitions assessment_status -> REVISION_REQUESTED", "increments revision_round by 1", "reopens the claim's Portfolio (LOCKED or SUBMITTED -> REVISION_REQUESTED)", "revokes every AssessorAssignment of the claim in {ASSIGNED, ACCEPTED} with revoke_reason REVISION_REQUESTED, decrementing FacultyAssessor.active_assignment_count", "keeps the credits_requested reservation in place"]
  - method: POST
    path: "/pla-claims/{claim_id}/award"
    description: "Coordinator award of a SCORED claim. Requires expected_student_version (OCC on the Student ledger) and enforces the referential-before-fiscal validation ladder."
    roles: [PlaCoordinator]
    code: 200
    input: [expected_student_version, credits_awarded]
    output: PlaClaim
    side_effects: ["transitions assessment_status SCORED -> AWARDED", "moves credits from Student.pla_credits_reserved to Student.pla_credits_awarded", "adds credits_awarded to Student.pla_upper_division_committed when the course level is UPPER", "increments Student.version by 1"]
  - method: POST
    path: "/pla-claims/{claim_id}/deny"
    description: "Coordinator denial of a SCORED claim, opening the appeal window."
    roles: [PlaCoordinator]
    code: 200
    input: [denial_reason]
    output: PlaClaim
    side_effects: ["transitions assessment_status SCORED -> DENIED", "sets appeal_deadline_at to current_utc + APPEAL_WINDOW_HOURS (336)", "releases credits_requested from Student.pla_credits_reserved", "runs calculations.cap_unblock_waterfall", "increments Student.version by 1"]
  - method: POST
    path: "/pla-claims/{claim_id}/transcript-posting"
    description: "Registrar posts awarded credit to the transcript, re-checking the cap with the posted_only variant and the residency rule."
    roles: [Registrar]
    code: 200
    input: [posted_term]
    output: PlaClaim
    side_effects: ["transitions credit_status NOT_POSTED -> POSTED (or REVERSED -> POSTED on a re-post)", "sets posted_term and posted_credits", "moves credits from Student.pla_credits_awarded to Student.pla_credits_posted", "on a re-post from REVERSED, re-adds the upper-division portion to Student.pla_upper_division_committed and re-runs validation priority 38", "increments Student.version by 1"]
  - method: POST
    path: "/pla-claims/{claim_id}/transcript-posting/reversal"
    description: "Registrar reversal of posted credit; the compensating transition that returns the ledger exactly to its pre-posting values and reopens blocked claims."
    roles: [Registrar]
    code: 200
    input: [reversal_reason]
    output: PlaClaim
    side_effects: ["transitions credit_status POSTED -> REVERSED", "subtracts posted_credits from Student.pla_credits_posted and returns them to Student.pla_credits_awarded — the reserved_inclusive total is therefore UNCHANGED by a reversal", "subtracts the upper-division portion from Student.pla_upper_division_committed", "runs calculations.cap_unblock_waterfall over the student's CAP_BLOCKED claims; because the reserved_inclusive total did not move, only claims blocked with hold_reason UPPER_DIVISION_CAP can unblock here, while hold_reason PLA_CAP claims stay blocked", "increments Student.version by 1"]

  # ---------- Portfolio and Artifact ----------
  - method: POST
    path: "/portfolios"
    description: "Create the single DRAFT portfolio for a PORTFOLIO-source claim."
    roles: [Student]
    code: 201
    input: [claim_id, "narrative?"]
    output: Portfolio
    side_effects: []
  - method: GET
    path: "/portfolios/{portfolio_id}"
    description: "Read one portfolio, including artifact_count and both coverage figures."
    roles: [PlaCoordinator, FacultyAssessor, AppealReviewer, Student]
    code: 200
    input: []
    output: Portfolio
    side_effects: []
  - method: GET
    path: "/portfolios"
    description: "List portfolios, sorted by created_at ASC."
    roles: [PlaCoordinator, FacultyAssessor, AppealReviewer, Student]
    code: 200
    input: ["claim_id?", "status?"]
    output: Portfolio[]
    side_effects: []
  - method: POST
    path: "/portfolios/{portfolio_id}/artifacts"
    description: "Attach an evidence artifact mapped to one or more of the course's learning outcomes. outcome_mappings is a list of { learning_outcome_id, alignment } with alignment in {PRIMARY, SUPPORTING}."
    roles: [Student]
    code: 201
    input: [artifact_type, title, evidence_uri, outcome_mappings, "description?"]
    output: Artifact
    side_effects: ["increments Portfolio.artifact_count by 1", "recomputes Portfolio.provisional_coverage_bp via calculations.outcome_coverage_score (provisional_self_reported variant)", "changes the claim's artifact surcharge tier and SLA multiplier tier for any FUTURE invoice recompute or assignment, never retroactively"]
  - method: DELETE
    path: "/portfolios/{portfolio_id}/artifacts/{artifact_id}"
    description: "Remove an artifact from an editable portfolio."
    roles: [Student]
    code: 204
    input: []
    output: null
    side_effects: ["decrements Portfolio.artifact_count by 1", "recomputes Portfolio.provisional_coverage_bp"]
  - method: GET
    path: "/artifacts/{artifact_id}"
    description: "Read one artifact, including its outcome_mappings."
    roles: [PlaCoordinator, FacultyAssessor, AppealReviewer, Student]
    code: 200
    input: []
    output: Artifact
    side_effects: []
  - method: GET
    path: "/artifacts"
    description: "List artifacts, sorted by created_at ASC."
    roles: [PlaCoordinator, FacultyAssessor, AppealReviewer, Student]
    code: 200
    input: ["portfolio_id?", "artifact_type?"]
    output: Artifact[]
    side_effects: []
  - method: POST
    path: "/portfolios/{portfolio_id}/submit"
    description: "Submit the portfolio for assessment; enforces the artifact-count floor and the provisional coverage floor."
    roles: [Student]
    code: 200
    input: []
    output: Portfolio
    side_effects: ["transitions Portfolio -> SUBMITTED", "sets Portfolio.submitted_at", "recomputes and freezes provisional_coverage_bp", "copies provisional_coverage_bp onto the parent PlaClaim"]

  # ---------- AssessorAssignment and RubricScore ----------
  - method: POST
    path: "/pla-claims/{claim_id}/assessor-assignments"
    description: "Assign a faculty assessor to a SUBMITTED claim. Omit assessor_id to let calculations.assessor_selection_rank choose; supply it to pin a specific assessor. Requires the assessment fee to be settled."
    roles: [PlaCoordinator]
    code: 201
    input: ["assessor_id?"]
    output: AssessorAssignment
    side_effects: ["creates the AssessorAssignment in status ASSIGNED with selection_reason EXPLICIT or AUTO_SELECTED", "computes sla_hours, due_at and at_risk_at via calculations.assessment_sla_due_at", "increments FacultyAssessor.active_assignment_count by 1", "transitions the claim's assessment_status SUBMITTED -> UNDER_ASSESSMENT"]
  - method: GET
    path: "/assessor-assignments/{assignment_id}"
    description: "Read one assignment, including the freshly computed elapsed_bp and sla_state."
    roles: [PlaCoordinator, Registrar, FacultyAssessor, AppealReviewer]
    code: 200
    input: []
    output: AssessorAssignment
    side_effects: ["recomputes elapsed_bp and sla_state via calculations.assignment_sla_state without changing status"]
  - method: GET
    path: "/assessor-assignments"
    description: "List assignments, sorted by assigned_at ASC."
    roles: [PlaCoordinator, Registrar, FacultyAssessor, AppealReviewer]
    code: 200
    input: ["claim_id?", "assessor_id?", "status?", "sla_state?"]
    output: AssessorAssignment[]
    side_effects: []
  - method: POST
    path: "/assessor-assignments/{assignment_id}/accept"
    description: "Assessor accepts an ASSIGNED assignment."
    roles: [FacultyAssessor]
    code: 200
    input: []
    output: AssessorAssignment
    side_effects: ["transitions AssessorAssignment ASSIGNED -> ACCEPTED", "sets accepted_at; due_at and at_risk_at are NOT recomputed from accepted_at"]
  - method: POST
    path: "/assessor-assignments/{assignment_id}/decline"
    description: "Assessor declines an ASSIGNED assignment, firing the auto-replacement cascade."
    roles: [FacultyAssessor]
    code: 200
    input: [decline_reason]
    output: AssessorAssignment
    side_effects: ["transitions AssessorAssignment ASSIGNED -> DECLINED", "decrements FacultyAssessor.active_assignment_count by 1", "runs calculations.assessor_selection_rank excluding every assessor ever assigned to this claim and creates a replacement assignment with selection_reason AUTO_REPLACEMENT", "when the eligible pool is empty, no replacement is created and the claim gets hold_reason NO_ELIGIBLE_ASSESSOR"]
  - method: POST
    path: "/assessor-assignments/{assignment_id}/rubric-scores"
    description: "Record one rubric score (0..4 points) for one learning outcome of the claim's course."
    roles: [FacultyAssessor]
    code: 201
    input: [learning_outcome_id, points_awarded, "narrative?"]
    output: RubricScore
    side_effects: ["computes score_ratio_bp as round_half_up(points_awarded * 10000 / 4)", "sets outcome_met to score_ratio_bp >= the outcome's mastery_threshold_bp", "re-scoring the same outcome on the same assignment is rejected, not overwritten"]
  - method: GET
    path: "/rubric-scores/{score_id}"
    description: "Read one rubric score."
    roles: [PlaCoordinator, FacultyAssessor, AppealReviewer, Student]
    code: 200
    input: []
    output: RubricScore
    side_effects: []
  - method: GET
    path: "/rubric-scores"
    description: "List rubric scores, sorted by created_at ASC."
    roles: [PlaCoordinator, FacultyAssessor, AppealReviewer, Student]
    code: 200
    input: ["assignment_id?", "learning_outcome_id?"]
    output: RubricScore[]
    side_effects: []
  - method: POST
    path: "/assessor-assignments/{assignment_id}/complete"
    description: "Assessor completes scoring; recommendation must equal the computed_recommendation implied by verified_coverage_bp against the effective pass threshold."
    roles: [FacultyAssessor]
    code: 200
    input: [recommendation]
    output: AssessorAssignment
    side_effects: ["transitions AssessorAssignment ACCEPTED -> SCORING_COMPLETE", "computes verified_coverage_bp via calculations.outcome_coverage_score (assessor_verified variant) and stores it on the assignment and the claim", "sets rubric_submitted_at", "decrements FacultyAssessor.active_assignment_count by 1", "transitions the claim's assessment_status UNDER_ASSESSMENT -> SCORED and sets assessor_recommendation", "locks the claim's Portfolio (SUBMITTED -> LOCKED)"]

  # ---------- FeeInvoice ----------
  - method: GET
    path: "/fee-invoices/{invoice_id}"
    description: "Read one invoice, including its line breakdown, discount tier and balance."
    roles: [PlaCoordinator, Registrar, Student]
    code: 200
    input: []
    output: FeeInvoice
    side_effects: []
  - method: GET
    path: "/fee-invoices"
    description: "List invoices, sorted by created_at ASC."
    roles: [PlaCoordinator, Registrar, Student]
    code: 200
    input: ["claim_id?", "student_id?", "fee_status?"]
    output: FeeInvoice[]
    side_effects: []
  - method: POST
    path: "/fee-invoices/{invoice_id}/payments"
    description: "Apply a payment. method must be one of CARD, CASH, CHECK, THIRD_PARTY or FINANCIAL_AID; FINANCIAL_AID is always refused because assessment fees are aid-ineligible."
    roles: [Student, PlaCoordinator]
    code: 200
    input: [amount_cents, method]
    output: FeeInvoice
    side_effects: ["increases paid_cents and reduces balance_due_cents", "transitions fee_status INVOICED -> PARTIALLY_PAID or -> PAID when balance_due_cents reaches 0", "updates Student.fee_paid_net_cents", "increments Student.version by 1"]
  - method: POST
    path: "/fee-invoices/{invoice_id}/waive"
    description: "Coordinator waives the outstanding balance (hardship or institutional hold)."
    roles: [PlaCoordinator]
    code: 200
    input: [waive_reason]
    output: FeeInvoice
    side_effects: ["moves the remaining balance_due_cents into waived_cents", "transitions fee_status -> WAIVED", "the claim then satisfies validation priority 42 without any payment"]

  # ---------- Appeal ----------
  - method: POST
    path: "/appeals"
    description: "File an appeal against a DENIED claim inside the appeal window. Adds the appeal filing fee to the claim's invoice."
    roles: [Student]
    code: 201
    input: [claim_id, grounds]
    output: Appeal
    side_effects: ["creates the Appeal in status FILED and sets filed_at", "snapshots prior_scorer_assessor_ids from every assessor who scored this claim", "transitions the claim's assessment_status DENIED -> APPEAL_PENDING", "increments the claim's appeal_count by 1", "recomputes the claim's FeeInvoice with the APPEAL_FILING_FEE line via calculations.assessment_fee_invoice_total, re-selecting the discount tier from the new pre-discount subtotal", "increments FeeInvoice.recompute_count by 1"]
  - method: GET
    path: "/appeals/{appeal_id}"
    description: "Read one appeal, including prior_scorer_assessor_ids."
    roles: [PlaCoordinator, Registrar, AppealReviewer, FacultyAssessor, Student]
    code: 200
    input: []
    output: Appeal
    side_effects: []
  - method: GET
    path: "/appeals"
    description: "List appeals, sorted by filed_at ASC."
    roles: [PlaCoordinator, Registrar, AppealReviewer, FacultyAssessor, Student]
    code: 200
    input: ["claim_id?", "reviewer_assessor_id?", "status?"]
    output: Appeal[]
    side_effects: []
  - method: POST
    path: "/appeals/{appeal_id}/assign-reviewer"
    description: "Assign an appeal-panel reviewer. Omit reviewer_assessor_id to let the selector choose. Enforces segregation of duties against prior_scorer_assessor_ids and requires the appeal fee to be settled."
    roles: [PlaCoordinator]
    code: 200
    input: ["reviewer_assessor_id?"]
    output: Appeal
    side_effects: ["transitions Appeal FILED -> UNDER_REVIEW", "sets reviewer_assessor_id and assigned_at"]
  - method: POST
    path: "/appeals/{appeal_id}/decide"
    description: "Reviewer decides the appeal. decision is one of UPHELD, OVERTURNED or REMANDED; credits_awarded is required for OVERTURNED and forbidden otherwise."
    roles: [AppealReviewer]
    code: 200
    input: [decision, "decision_note?", "credits_awarded?"]
    output: Appeal
    side_effects: ["OVERTURNED and REMANDED both return the claim to a reserving state, so credits_requested is re-added to Student.pla_credits_reserved; when calculations.program_pla_credit_capacity (reserved_inclusive) no longer has room the claim lands in CAP_BLOCKED with hold_reason PLA_CAP instead of SCORED or UNDER_ASSESSMENT, and no replacement assignment is created", "UPHELD: Appeal -> UPHELD, claim APPEAL_PENDING -> DENIED_FINAL, no refund", "OVERTURNED: Appeal -> OVERTURNED, claim APPEAL_PENDING -> SCORED with assessor_recommendation PASS so the coordinator can award, full refund via calculations.withdrawal_refund_settlement at retention_bp 0", "REMANDED: Appeal -> REMANDED, claim APPEAL_PENDING -> UNDER_ASSESSMENT, a fresh AssessorAssignment is created via calculations.assessor_selection_rank excluding every prior scorer, the APPEAL_FILING_FEE line is removed and exactly APPEAL_FILING_FEE_CENTS is refunded, and the invoice discount tier is re-selected from the reduced subtotal", "sets decided_at and decision_note", "increments Student.version by 1"]

  # ---------- Test-driving endpoints ----------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time. The clock only ever advances by an explicit call here; nothing advances it implicitly."
    roles: [PlaCoordinator, Registrar, ArticulationOfficer]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string, previous_utc: string }"
    side_effects: ["all deadline, window and SLA comparisons resolve against the new value on their next evaluation; no state transition fires implicitly"]
  - method: POST
    path: "/_sla/run-escalation-sweep"
    description: "Run the SLA escalation sweep over every AssessorAssignment in {ASSIGNED, ACCEPTED}, in (due_at ASC, created_at ASC) order. Recomputes sla_state and revokes every BREACHED assignment, firing the four-hop breach cascade."
    roles: [PlaCoordinator]
    code: 200
    input: []
    output: "{ evaluated_count: integer, at_risk_count: integer, breached_count: integer, revoked_assignment_ids: string[], replacement_assignment_ids: string[], credited_invoice_ids: string[] }"
    side_effects: ["hop 1: every BREACHED assignment -> REVOKED with revoke_reason SLA_BREACH, decrementing FacultyAssessor.active_assignment_count", "hop 2: the parent PlaClaim's sla_breach_count is incremented", "hop 3: the claim's FeeInvoice is recomputed with the negative SLA_SERVICE_CREDIT line, which can re-select a lower discount tier", "hop 4: a replacement assignment is created via calculations.assessor_selection_rank excluding every assessor ever assigned to the claim, or the claim gets hold_reason NO_ELIGIBLE_ASSESSOR when the pool is empty"]

errors:
  # ---- auth ----
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or an entity_backed role's X-User-ID does not resolve to a row of its backing entity"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not listed in the called endpoint's roles"
  - id: ERR_FORBIDDEN_STUDENT_SCOPE
    http: 403
    condition: "A Student acts on a claim, portfolio, artifact, invoice, appeal or audit belonging to a different student"
  - id: ERR_FORBIDDEN_ASSESSOR_SCOPE
    http: 403
    condition: "A FacultyAssessor acts on an AssessorAssignment whose assessor_id is not the acting X-User-ID"
  - id: ERR_NOT_APPEAL_PANEL_MEMBER
    http: 403
    condition: "An AppealReviewer whose FacultyAssessor row has appeal_panel_member false attempts to decide an appeal"

  # ---- existence ----
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "program_id in the path or body does not exist"
  - id: ERR_COURSE_NOT_FOUND
    http: 404
    condition: "course_id in the path or body does not exist"
  - id: ERR_OUTCOME_NOT_FOUND
    http: 404
    condition: "outcome_id or learning_outcome_id does not exist"
  - id: ERR_STUDENT_NOT_FOUND
    http: 404
    condition: "student_id in the path or body does not exist"
  - id: ERR_ASSESSOR_NOT_FOUND
    http: 404
    condition: "assessor_id or reviewer_assessor_id does not exist"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "claim_id or supersedes_claim_id does not exist"
  - id: ERR_PORTFOLIO_NOT_FOUND
    http: 404
    condition: "portfolio_id does not exist"
  - id: ERR_ARTIFACT_NOT_FOUND
    http: 404
    condition: "artifact_id does not exist, or exists but belongs to a different portfolio than the one in the path"
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "assignment_id does not exist"
  - id: ERR_RUBRIC_SCORE_NOT_FOUND
    http: 404
    condition: "score_id does not exist"
  - id: ERR_APPEAL_NOT_FOUND
    http: 404
    condition: "appeal_id does not exist"
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "invoice_id does not exist"
  - id: ERR_RECOMMENDATION_NOT_FOUND
    http: 404
    condition: "recommendation_id does not exist"
  - id: ERR_ARTICULATION_RULE_NOT_FOUND
    http: 404
    condition: "rule_id or articulation_rule_id does not exist"

  # ---- request shape ----
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "A required input field is missing, or a field violates its declared type, enum domain or numeric range (including a decision value outside {UPHELD, OVERTURNED, REMANDED} and credits_awarded supplied on a non-OVERTURNED decision)"
  - id: ERR_INVALID_CREDIT_REQUEST
    http: 422
    condition: "credits_requested is below 1 or above the target Course.credits"
  - id: ERR_OUTCOME_WEIGHTS_INVALID
    http: 422
    condition: "The learning_outcomes supplied with a course have weight_bp values that do not sum to exactly 10000, or contain duplicate outcome_code values"
  - id: ERR_RUBRIC_POINTS_OUT_OF_RANGE
    http: 422
    condition: "points_awarded is not an integer in 0..4"
  - id: ERR_ARTICULATION_RULE_REQUIRED
    http: 422
    condition: "articulation_rule_id omitted on a claim whose source_type is not PORTFOLIO"
  - id: ERR_ARTICULATION_RULE_FORBIDDEN
    http: 422
    condition: "articulation_rule_id supplied on a PORTFOLIO-source claim"
  - id: ERR_SUPERSEDED_CLAIM_NOT_TERMINAL
    http: 422
    condition: "supersedes_claim_id points at a claim that is not DENIED_FINAL or WITHDRAWN, or belongs to a different student or course"
  - id: ERR_PORTFOLIO_NOT_ALLOWED_FOR_SOURCE
    http: 422
    condition: "A portfolio is created for a claim whose source_type is not PORTFOLIO"
  - id: ERR_PORTFOLIO_ALREADY_EXISTS
    http: 409
    condition: "A second portfolio is created for a claim that already has one"

  # ---- optimistic concurrency ----
  - id: ERR_STALE_STUDENT_VERSION
    http: 412
    condition: "expected_student_version does not equal the current Student.version at award time"
  - id: ERR_STALE_RECOMMENDATION_VERSION
    http: 412
    condition: "expected_recommendation_version does not equal the current CredentialRecommendation.version at rule-approval time"

  # ---- state ----
  - id: ERR_CLAIM_ALREADY_TERMINAL
    http: 409
    condition: "The claim's assessment_status is AWARDED, DENIED_FINAL or WITHDRAWN and any further transition is attempted"
  - id: ERR_CLAIM_NOT_DRAFT
    http: 409
    condition: "A DRAFT-only operation is attempted on a claim that is not DRAFT or REVISION_REQUESTED"
  - id: ERR_CLAIM_NOT_SUBMITTED
    http: 409
    condition: "An assessor assignment is requested for a claim that is not SUBMITTED"
  - id: ERR_CLAIM_NOT_UNDER_ASSESSMENT
    http: 409
    condition: "An UNDER_ASSESSMENT-only operation is attempted from another state"
  - id: ERR_CLAIM_NOT_SCORED
    http: 409
    condition: "Award or deny is attempted on a claim that is not SCORED"
  - id: ERR_CLAIM_NOT_DENIED
    http: 409
    condition: "An appeal is filed against a claim that is not DENIED"
  - id: ERR_CLAIM_NOT_AWARDED
    http: 409
    condition: "Transcript posting is attempted on a claim whose assessment_status is not AWARDED"
  - id: ERR_CREDIT_ALREADY_POSTED
    http: 409
    condition: "Transcript posting is attempted while credit_status is already POSTED"
  - id: ERR_CREDIT_NOT_POSTED
    http: 409
    condition: "A posting reversal is attempted while credit_status is not POSTED"
  - id: ERR_PORTFOLIO_NOT_EDITABLE
    http: 409
    condition: "An artifact is added to or deleted from a portfolio whose status is SUBMITTED, LOCKED or VOIDED"
  - id: ERR_PORTFOLIO_NOT_SUBMITTABLE
    http: 409
    condition: "Portfolio submit is attempted from a status other than DRAFT or REVISION_REQUESTED"
  - id: ERR_ASSIGNMENT_NOT_PENDING
    http: 409
    condition: "Accept or decline is attempted on an assignment whose status is not ASSIGNED"
  - id: ERR_ASSIGNMENT_NOT_ACCEPTED
    http: 409
    condition: "Rubric scoring or completion is attempted on an assignment whose status is not ACCEPTED"
  - id: ERR_APPEAL_NOT_FILED
    http: 409
    condition: "Reviewer assignment is attempted on an appeal whose status is not FILED"
  - id: ERR_APPEAL_NOT_UNDER_REVIEW
    http: 409
    condition: "A decision is attempted on an appeal whose status is not UNDER_REVIEW"
  - id: ERR_RULE_NOT_DRAFT
    http: 409
    condition: "submit-for-review is attempted on an ArticulationRule that is not DRAFT"
  - id: ERR_RULE_NOT_UNDER_REVIEW
    http: 409
    condition: "approve is attempted on an ArticulationRule that is not UNDER_REVIEW"
  - id: ERR_RULE_NOT_APPROVED
    http: 409
    condition: "suspend is attempted on an ArticulationRule that is not APPROVED"
  - id: ERR_RULE_NOT_SUSPENDED
    http: 409
    condition: "reinstate is attempted on an ArticulationRule that is not SUSPENDED"
  - id: ERR_RECOMMENDATION_NOT_DRAFT
    http: 409
    condition: "publish is attempted on a CredentialRecommendation that is not DRAFT"
  - id: ERR_RECOMMENDATION_NOT_PUBLISHED
    http: 409
    condition: "retire is attempted on a CredentialRecommendation that is not PUBLISHED, or a revision is attempted on a RETIRED one"
  - id: ERR_INVOICE_NOT_PAYABLE
    http: 409
    condition: "A payment or waiver is applied to an invoice whose fee_status is UNBILLED, WAIVED, REFUNDED or RETAINED, or whose balance_due_cents is already 0"

  # ---- compliance and referential integrity ----
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "The approving X-User-ID equals the reviewing X-User-ID on an articulation rule, or an appeal reviewer appears in the appeal's prior_scorer_assessor_ids"
  - id: ERR_ARTICULATION_NOT_APPROVED
    http: 409
    condition: "At award or posting time the claim's pinned ArticulationRule is not APPROVED, or its parent CredentialRecommendation is not PUBLISHED"
  - id: ERR_ARTICULATION_STALE_PIN
    http: 409
    condition: "At award or posting time the pinned ArticulationRule.pinned_recommendation_version no longer equals the parent CredentialRecommendation.terms_version"
  - id: ERR_OUTCOME_NOT_IN_COURSE
    http: 422
    condition: "A learning_outcome_id in an artifact mapping or a rubric score does not belong to the claim's course"
  - id: ERR_SOURCE_NOT_ALLOWED_BY_PROGRAM
    http: 422
    condition: "The claim's source_type is not in the student's Program.allowed_source_types"
  - id: ERR_COURSE_NOT_PLA_ELIGIBLE
    http: 422
    condition: "The target course has pla_eligible false"
  - id: ERR_STUDENT_NOT_MATRICULATED
    http: 409
    condition: "The student's enrollment_status is not MATRICULATED"
  - id: ERR_PROGRAM_INACTIVE
    http: 409
    condition: "The student's program status is not ACTIVE"
  - id: ERR_LEVEL_MISMATCH
    http: 422
    condition: "The claim's course level does not match the pinned rule's recommended_level"
  - id: ERR_AWARD_EXCEEDS_RECOMMENDATION
    http: 422
    condition: "credits_awarded exceeds the pinned ArticulationRule.awarded_credits"

  # ---- temporal ----
  - id: ERR_ATTEMPT_DATE_OUTSIDE_WINDOW
    http: 422
    condition: "attempt_date falls outside the pinned rule's half-open [effective_from, effective_to) window"
  - id: ERR_APPEAL_WINDOW_CLOSED
    http: 409
    condition: "current_utc is at or after the claim's appeal_deadline_at"
  - id: ERR_ARTICULATION_WINDOW_OVERLAP
    http: 409
    condition: "Approving or reinstating a rule would overlap a sibling APPROVED rule's half-open window for the same (recommendation_id, course_id)"
  - id: ERR_CLOCK_NOT_MONOTONIC
    http: 422
    condition: "The requested logical clock value is earlier than the current one"

  # ---- uniqueness and limits ----
  - id: ERR_DUPLICATE_CLAIM
    http: 409
    condition: "The student already has a non-terminal or AWARDED claim for the same course and the new claim does not supersede a terminal one"
  - id: ERR_DUPLICATE_RUBRIC_SCORE
    http: 409
    condition: "A second RubricScore is submitted for the same (assignment_id, learning_outcome_id) pair"
  - id: ERR_REVISION_LIMIT_REACHED
    http: 409
    condition: "revision_round has already reached MAX_REVISION_ROUNDS (2)"
  - id: ERR_APPEAL_LIMIT_REACHED
    http: 409
    condition: "appeal_count has already reached MAX_APPEALS_PER_CLAIM (1)"

  # ---- assessor selection ----
  - id: ERR_ASSESSOR_INACTIVE
    http: 409
    condition: "The named FacultyAssessor's status is not ACTIVE"
  - id: ERR_ASSESSOR_NOT_ELIGIBLE
    http: 422
    condition: "The named assessor fails a non-capacity eligibility predicate: department mismatch, credential_rank below the course-level floor, or (for reviewers) not an appeal-panel member"
  - id: ERR_ASSESSOR_ALREADY_ASSIGNED
    http: 409
    condition: "The named assessor already holds or has ever held an assignment on this claim"
  - id: ERR_ASSESSOR_CAPACITY_CONFLICT
    http: 409
    condition: "The named assessor's buffered-window conflict count already equals max_concurrent_assignments"
  - id: ERR_NO_ELIGIBLE_ASSESSOR
    http: 409
    condition: "Server-side selection found an empty eligible pool on a directly requested assignment or reviewer assignment"

  # ---- evidence sufficiency ----
  - id: ERR_PORTFOLIO_NO_ARTIFACTS
    http: 422
    condition: "A PORTFOLIO-source claim or its portfolio is submitted with artifact_count 0"
  - id: ERR_INSUFFICIENT_OUTCOME_COVERAGE
    http: 422
    condition: "provisional_coverage_bp is below MIN_PROVISIONAL_COVERAGE_BP (5000) at portfolio submit"
  - id: ERR_INCOMPLETE_RUBRIC
    http: 422
    condition: "Assignment completion is attempted without exactly one RubricScore for every LearningOutcome of the claim's course"
  - id: ERR_RECOMMENDATION_INCONSISTENT
    http: 422
    condition: "The submitted recommendation disagrees with the computed_recommendation implied by verified_coverage_bp against the effective pass threshold"

  # ---- capacity and quota ----
  - id: ERR_UPPER_DIVISION_CAP_EXCEEDED
    http: 409
    condition: "The award or posting would push Student.pla_upper_division_committed past Program.pla_upper_division_max_credits"
  - id: ERR_PLA_CAP_EXCEEDED
    http: 409
    condition: "The award or posting would exceed the program's effective PLA credit cap under the applicable capacity variant"
  - id: ERR_RESIDENCY_REQUIREMENT_VIOLATION
    http: 409
    condition: "Posting would push transfer_credits_accepted + pla_credits_posted past total_credits_required - residency_min_credits"

  # ---- fiscal ----
  - id: ERR_AID_NOT_APPLICABLE
    http: 422
    condition: "A payment with method FINANCIAL_AID is attempted against an assessment-fee invoice, which is always aid-ineligible"
  - id: ERR_PAYMENT_EXCEEDS_BALANCE
    http: 422
    condition: "amount_cents exceeds the invoice's balance_due_cents"
  - id: ERR_ASSESSMENT_FEE_UNPAID
    http: 402
    condition: "An assessor assignment is requested while the claim's invoice fee_status is not PAID or WAIVED"
  - id: ERR_APPEAL_FEE_UNPAID
    http: 402
    condition: "A reviewer assignment is requested while the appealed claim's invoice still has a non-zero balance_due_cents"

roles:
  - name: Student
    description: "The claimant. Opens claims, builds portfolios, pays assessment fees, files appeals and reads their own graduation audit."
    identity: "entity_backed:Student"
    exclusive_operations: ["create a portfolio", "add or delete portfolio artifacts", "submit a portfolio", "file an appeal"]
    shared_operations: ["create a PLA claim (with PlaCoordinator)", "submit a claim (with PlaCoordinator)", "withdraw a claim (with PlaCoordinator)", "pay a fee invoice (with PlaCoordinator)", "read own claims, portfolios, artifacts, invoices, appeals and graduation audit"]
  - name: PlaCoordinator
    description: "Prior learning assessment office staff. Owns the assessment workflow: assessor assignment, revision requests, award and denial, fee waivers, appeal reviewer assignment and the SLA sweep."
    identity: "opaque"
    exclusive_operations: ["create programs, courses, students and faculty assessors", "amend programs and faculty assessors", "assign an assessor to a claim", "request a revision", "award a claim", "deny a claim", "waive a fee invoice", "assign an appeal reviewer", "run the SLA escalation sweep"]
    shared_operations: ["create, submit and withdraw claims (with Student)", "apply a payment (with Student)", "set the logical clock (with Registrar and ArticulationOfficer)", "read every claim, portfolio, assignment, rubric score, invoice and appeal"]
  - name: FacultyAssessor
    description: "Subject-matter faculty who accept assignments, score rubrics against course learning outcomes and complete the assessment."
    identity: "entity_backed:FacultyAssessor"
    exclusive_operations: ["accept an assignment", "decline an assignment", "submit rubric scores", "complete an assignment"]
    shared_operations: ["read the claims, portfolios, artifacts and rubric scores in scope of their own assignments"]
  - name: AppealReviewer
    description: "An appeal-panel faculty member who decides appeals. Backed by the same FacultyAssessor entity, so the segregation-of-duties check compares X-User-ID against prior_scorer_assessor_ids."
    identity: "entity_backed:FacultyAssessor"
    exclusive_operations: ["decide an appeal (UPHELD, OVERTURNED or REMANDED)"]
    shared_operations: ["read claims, portfolios, assignments, rubric scores and appeals for review purposes"]
  - name: ArticulationOfficer
    description: "Owns the national-credential-to-local-course crosswalk. Segregation of duties applies within the role: the X-User-ID that submits a rule for review may not be the one that approves it."
    identity: "opaque"
    exclusive_operations: ["create, publish, revise and retire credential recommendations", "create, submit-for-review, approve, suspend and reinstate articulation rules"]
    shared_operations: ["set the logical clock (with PlaCoordinator and Registrar)", "read programs, courses, recommendations and rules"]
  - name: Registrar
    description: "Sole authority over the transcript. Posts and reverses PLA credit and maintains institutional and transfer credit counters."
    identity: "opaque"
    exclusive_operations: ["post PLA credit to the transcript", "reverse a transcript posting"]
    shared_operations: ["create students (with PlaCoordinator)", "amend a student's enrollment status and non-PLA credit counters (with PlaCoordinator)", "read a student's graduation audit (with PlaCoordinator and Student)", "set the logical clock (with PlaCoordinator and ArticulationOfficer)"]
