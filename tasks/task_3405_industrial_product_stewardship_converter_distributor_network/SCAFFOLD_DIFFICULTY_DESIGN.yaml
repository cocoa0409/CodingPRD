            - *c_form100
            - *c_clear_exempt
            - *c_decide_clear
            - *c_conv_applied
            - *c_conv_audit
            - *c_conv_authorize
            - *c_authz_slit_de
            - call: "POST /stewardship/price-agreements"
              payload: { formulation_id: "${f_id}", jurisdiction_id: "${jur_de}", converter_id: "${conv_id}", tier: "CONVERTER_AUTHORIZED", base_price_cents: 10000, effective_from: "2026-10-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ChannelManager
              as_user_id: "cm-1"
