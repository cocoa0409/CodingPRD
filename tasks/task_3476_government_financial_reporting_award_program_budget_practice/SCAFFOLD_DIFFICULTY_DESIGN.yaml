# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 3476 — Government Financial Reporting Award Program & Budget Practice
# 9 rules x 2 instances = 18 instances. Shared setup chains are anchored in the
# first instance (&k_*) and aliased (*k_*) downstream; every ${var} is bound by
# a captures: line earlier in the SAME instance.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: award_score_variants_diverge_across_programs
        grounds:
          - calculations.final_award_score
          - calculations.finding_weighted_score
          - state_machines.ReportSubmission.DECISION_READY_to_DECIDED_AWARDED
        distinguishing_aspect: |
          Two submissions with identical per-finding weighted_scores (85.00 each,
          zero deficiency comments) but different program_type produce DIFFERENT
          final_score values: FINANCIAL_REPORTING keeps the plain mean (85.00)
          while BUDGET_PRESENTATION adds the +1.00 clean-round bonus (86.00) —
          the dual variant lives on the ReportSubmission/award domain.
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z. FR checklist (criteria C1/C2 at 0.5 each, pass 85.00) and an FR cycle with window [2026-09-01, 2026-10-15). Government 'City of Example'. A DRAFT-then-SUBMITTED FR submission. Three ELIGIBLE reviewers (rev1, rev2, rev3 trained in that order), each blindly assigned and ACCEPTED."
            - "BUDGET checklist (criteria P/F/C at 0.30/0.40/0.30, pass 85.00), a BUDGET cycle with the same window, a BUDGET submission by the same government with all three budget documents, SUBMITTED, three assignments accepted."
          setup_api_calls:
            - &k_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - &k_cl_fr
              call: "POST /gfoa/checklist-versions"
              payload: { program_type: "FINANCIAL_REPORTING", version_label: "2026.1", pass_score: 85.00, criteria: [{ criterion_code: "C1", weight: 0.5 }, { criterion_code: "C2", weight: 0.5 }] }
              as: PlatformAdmin
              captures: { cl_fr: $.data.id }
            - &k_cyc_fr
              call: "POST /gfoa/award-cycles"
              payload: { program_type: "FINANCIAL_REPORTING", fiscal_year: 2026, submission_opens_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-10-15T00:00:00Z", review_close_at: "2026-12-01T00:00:00Z", checklist_version_id: "${cl_fr}" }
              as: PlatformAdmin
              captures: { cyc_fr: $.data.id }
            - &k_gov_s
              call: "POST /gfoa/governments"
              payload: { legal_name: "City of Example", gov_type: "CITY", population_band: "MEDIUM", state_code: "OH" }
              as: PlatformAdmin
              captures: { gov_s: $.data.id }
            - &k_sub_create
              call: "POST /gfoa/report-submissions"
              payload: { government_id: "${gov_s}", cycle_id: "${cyc_fr}" }
              as: GovernmentContact
              as_user_id: "${gov_s}"
              captures: { sub_s: $.data.id }
            - &k_submit
              call: "POST /gfoa/report-submissions/${sub_s}/submit"
              payload: {}
              as: GovernmentContact
              as_user_id: "${gov_s}"
            - &k_m1
              call: "POST /gfoa/members"
              payload: { full_name: "Rita One", email: "r1@x.com", government_size_band: "MEDIUM" }
              as: PlatformAdmin
              captures: { m1: $.data.id }
            - &k_e1
              call: "POST /gfoa/governments"
              payload: { legal_name: "County of Peer One", gov_type: "COUNTY", population_band: "LARGE", state_code: "MI" }
              as: PlatformAdmin
              captures: { e1: $.data.id }
            - &k_rev1
              call: "POST /gfoa/reviewer-profiles"
              payload: { member_id: "${m1}", employer_government_id: "${e1}" }
              as: Member
              as_user_id: "${m1}"
              captures: { rev1: $.data.id }
            - &k_train1
              call: "PUT /gfoa/reviewer-profiles/${rev1}"
              payload: { status: "TRAINED" }
              as: PlatformAdmin
            - &k_att1
              call: "PUT /gfoa/reviewer-profiles/${rev1}"
              payload: { independence_attested: true }
              as: Reviewer
              as_user_id: "${rev1}"
            - &k_m2
              call: "POST /gfoa/members"
              payload: { full_name: "Rita Two", email: "r2@x.com", government_size_band: "SMALL" }
              as: PlatformAdmin
              captures: { m2: $.data.id }
            - &k_e2
              call: "POST /gfoa/governments"
              payload: { legal_name: "County of Peer Two", gov_type: "COUNTY", population_band: "LARGE", state_code: "IN" }
              as: PlatformAdmin
              captures: { e2: $.data.id }
            - &k_rev2
              call: "POST /gfoa/reviewer-profiles"
              payload: { member_id: "${m2}", employer_government_id: "${e2}" }
              as: Member
              as_user_id: "${m2}"
              captures: { rev2: $.data.id }
            - &k_train2
              call: "PUT /gfoa/reviewer-profiles/${rev2}"
              payload: { status: "TRAINED" }
              as: PlatformAdmin
            - &k_att2
              call: "PUT /gfoa/reviewer-profiles/${rev2}"
              payload: { independence_attested: true }
              as: Reviewer
              as_user_id: "${rev2}"
            - &k_m3
              call: "POST /gfoa/members"
              payload: { full_name: "Rita Three", email: "r3@x.com", government_size_band: "LARGE" }
              as: PlatformAdmin
              captures: { m3: $.data.id }
            - &k_e3
              call: "POST /gfoa/governments"
              payload: { legal_name: "State of Peer Three", gov_type: "STATE_GOV", population_band: "LARGE", state_code: "KY" }
              as: PlatformAdmin
              captures: { e3: $.data.id }
            - &k_rev3
              call: "POST /gfoa/reviewer-profiles"
              payload: { member_id: "${m3}", employer_government_id: "${e3}" }
              as: Member
              as_user_id: "${m3}"
              captures: { rev3: $.data.id }
            - &k_train3
              call: "PUT /gfoa/reviewer-profiles/${rev3}"
              payload: { status: "TRAINED" }
              as: PlatformAdmin
            - &k_att3
              call: "PUT /gfoa/reviewer-profiles/${rev3}"
              payload: { independence_attested: true }
              as: Reviewer
              as_user_id: "${rev3}"
            - &k_asg1
              call: "POST /gfoa/review-assignments"
              payload: { submission_id: "${sub_s}" }
              as: AwardsDirector
              captures: { asg1: $.data.id, asg1_rev: $.data.reviewer_id }
            - &k_asg2
              call: "POST /gfoa/review-assignments"
              payload: { submission_id: "${sub_s}" }
              as: AwardsDirector
              captures: { asg2: $.data.id, asg2_rev: $.data.reviewer_id }
            - &k_asg3
              call: "POST /gfoa/review-assignments"
              payload: { submission_id: "${sub_s}" }
              as: AwardsDirector
              captures: { asg3: $.data.id, asg3_rev: $.data.reviewer_id }
            - &k_acc1
              call: "POST /gfoa/review-assignments/${asg1}/accept"
              payload: {}
              as: Reviewer
              as_user_id: "${rev1}"
            - &k_acc2
              call: "POST /gfoa/review-assignments/${asg2}/accept"
              payload: {}
              as: Reviewer
              as_user_id: "${rev2}"
            - &k_acc3
              call: "POST /gfoa/review-assignments/${asg3}/accept"
              payload: {}
              as: Reviewer
              as_user_id: "${rev3}"
            # BUDGET program leg
            - &k_cl_bud
              call: "POST /gfoa/checklist-versions"
              payload: { program_type: "BUDGET_PRESENTATION", version_label: "2026.1-B", pass_score: 85.00, criteria: [{ criterion_code: "P", weight: 0.30 }, { criterion_code: "F", weight: 0.40 }, { criterion_code: "C", weight: 0.30 }] }
              as: PlatformAdmin
              captures: { cl_bud: $.data.id }
            - &k_cyc_bud
              call: "POST /gfoa/award-cycles"
              payload: { program_type: "BUDGET_PRESENTATION", fiscal_year: 2026, submission_opens_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-10-15T00:00:00Z", review_close_at: "2026-12-01T00:00:00Z", checklist_version_id: "${cl_bud}" }
              as: PlatformAdmin
              captures: { cyc_bud: $.data.id }
            - &k_sub_bud
              call: "POST /gfoa/report-submissions"
              payload: { government_id: "${gov_s}", cycle_id: "${cyc_bud}", budget_documents: [{ doc_type: "POLICY", title: "Budget Policy", page_count: 12 }, { doc_type: "FINANCIAL_PLAN", title: "Financial Plan", page_count: 40 }, { doc_type: "COMMUNICATION", title: "Community Summary", page_count: 8 }] }
              as: GovernmentContact
              as_user_id: "${gov_s}"
              captures: { sub_bud: $.data.id }
            - &k_submit_bud
              call: "POST /gfoa/report-submissions/${sub_bud}/submit"
              payload: {}
              as: GovernmentContact
              as_user_id: "${gov_s}"
            - &k_asgb1
              call: "POST /gfoa/review-assignments"
              payload: { submission_id: "${sub_bud}" }
              as: AwardsDirector
              captures: { asgb1: $.data.id, asgb1_rev: $.data.reviewer_id }
            - &k_asgb2
              call: "POST /gfoa/review-assignments"
              payload: { submission_id: "${sub_bud}" }
              as: AwardsDirector
              captures: { asgb2: $.data.id, asgb2_rev: $.data.reviewer_id }
            - &k_asgb3
              call: "POST /gfoa/review-assignments"
              payload: { submission_id: "${sub_bud}" }
              as: AwardsDirector
              captures: { asgb3: $.data.id, asgb3_rev: $.data.reviewer_id }
            - &k_accb1
              call: "POST /gfoa/review-assignments/${asgb1}/accept"
              payload: {}
              as: Reviewer
              as_user_id: "${rev1}"
            - &k_accb2
              call: "POST /gfoa/review-assignments/${asgb2}/accept"
              payload: {}
              as: Reviewer
              as_user_id: "${rev2}"
            - &k_accb3
              call: "POST /gfoa/review-assignments/${asgb3}/accept"
              payload: {}
              as: Reviewer
              as_user_id: "${rev3}"
            # FR findings: each weighted 85.00 (90*0.5 + 80*0.5), zero comments
            - call: "POST /gfoa/review-assignments/${asg1}/finding"
              payload: { criterion_scores: [{ criterion_code: "C1", score: 90 }, { criterion_code: "C2", score: 80 }], comments: [] }
              as: Reviewer
              as_user_id: "${rev1}"
            - call: "POST /gfoa/review-assignments/${asg2}/finding"
              payload: { criterion_scores: [{ criterion_code: "C1", score: 90 }, { criterion_code: "C2", score: 80 }], comments: [] }
              as: Reviewer
              as_user_id: "${rev2}"
            - call: "POST /gfoa/review-assignments/${asg3}/finding"
              payload: { criterion_scores: [{ criterion_code: "C1", score: 90 }, { criterion_code: "C2", score: 80 }], comments: [] }
              as: Reviewer
              as_user_id: "${rev3}"
            # BUDGET findings: each weighted 85.00 (85*.30 + 85*.40 + 85*.30), zero comments
            - call: "POST /gfoa/review-assignments/${asgb1}/finding"
              payload: { criterion_scores: [{ criterion_code: "P", score: 85 }, { criterion_code: "F", score: 85 }, { criterion_code: "C", score: 85 }], comments: [] }
              as: Reviewer
              as_user_id: "${rev1}"
            - call: "POST /gfoa/review-assignments/${asgb2}/finding"
              payload: { criterion_scores: [{ criterion_code: "P", score: 85 }, { criterion_code: "F", score: 85 }, { criterion_code: "C", score: 85 }], comments: [] }
              as: Reviewer
              as_user_id: "${rev2}"
            - call: "POST /gfoa/review-assignments/${asgb3}/finding"
              payload: { criterion_scores: [{ criterion_code: "P", score: 85 }, { criterion_code: "F", score: 85 }, { criterion_code: "C", score: 85 }], comments: [] }
              as: Reviewer
              as_user_id: "${rev3}"
          trigger:
            - call: "POST /gfoa/report-submissions/${sub_s}/decide"
              payload: {}
              as: AwardsDirector
              captures: { fr_final: $.data.final_score }
            - call: "POST /gfoa/report-submissions/${sub_bud}/decide"
              payload: {}
              as: AwardsDirector
              captures: { bud_final: $.data.final_score }
          assert:
            - "ReportSubmission.${sub_s}.final_score == 85.00 (FINANCIAL_REPORTING variant: plain mean, no bonus)"
            - "ReportSubmission.${sub_bud}.final_score == 86.00 (BUDGET_PRESENTATION variant: mean 85.00 + 1.00 clean-round bonus)"
            - "the two variants diverge by exactly 1.00 for identical weighted findings: ${bud_final} - ${fr_final} == 1.00"
            - "ReportSubmission.${sub_s}.status == DECIDED_AWARDED and ReportSubmission.${sub_bud}.status == DECIDED_AWARDED"

      - name: scholarship_flat_cap_vs_pro_rata
        grounds:
          - calculations.scholarship_grant_amount
          - state_machines.ScholarshipApplication.PENDING_to_GRANTED
        distinguishing_aspect: |
          Two funds holding identical data (pool 100000, cap 200000, a 100000
          request) grant different amounts purely by allocation_policy variant:
          FLAT_CAP grants 100000 while PRO_RATA (one other PENDING application
          requesting 100000) grants round(100000*100000/200000) = 50000 — the
          dual variant lives on the ScholarshipApplication/money domain.
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z. Fund A FLAT_CAP (pool 100000, cap 200000) with one SMALL-government application requesting 100000. Fund B PRO_RATA (same pool/cap) with two SMALL-government applications each requesting 100000."
          setup_api_calls:
            - *k_clock
            - call: "POST /gfoa/governments"
              payload: { legal_name: "Village of Tiny", gov_type: "CITY", population_band: "SMALL", state_code: "OH" }
              as: PlatformAdmin
              captures: { gov_t1: $.data.id }
            - call: "POST /gfoa/governments"
              payload: { legal_name: "Town of Small", gov_type: "CITY", population_band: "SMALL", state_code: "OH" }
              as: PlatformAdmin
              captures: { gov_t2: $.data.id }
            - call: "POST /gfoa/scholarship-funds"
              payload: { fiscal_year: 2026, program_label: "SCHOLARSHIP", pool_total_cents: 100000, per_applicant_cap_cents: 200000, allocation_policy: "FLAT_CAP" }
              as: PlatformAdmin
              captures: { fund_a: $.data.id, fund_a_v: $.data.version }
            - call: "POST /gfoa/scholarship-funds"
              payload: { fiscal_year: 2026, program_label: "SCHOLARSHIP", pool_total_cents: 100000, per_applicant_cap_cents: 200000, allocation_policy: "PRO_RATA" }
              as: PlatformAdmin
              captures: { fund_b: $.data.id, fund_b_v: $.data.version }
            - call: "POST /gfoa/scholarship-applications"
              payload: { fund_id: "${fund_a}", government_id: "${gov_t1}", purpose: "CONFERENCE_SCHOLARSHIP", requested_cents: 100000 }
              as: GovernmentContact
              as_user_id: "${gov_t1}"
              captures: { app_a: $.data.id }
            - call: "POST /gfoa/scholarship-applications"
              payload: { fund_id: "${fund_b}", government_id: "${gov_t1}", purpose: "CONFERENCE_SCHOLARSHIP", requested_cents: 100000 }
              as: GovernmentContact
              as_user_id: "${gov_t1}"
              captures: { app_b1: $.data.id }
            - call: "POST /gfoa/scholarship-applications"
              payload: { fund_id: "${fund_b}", government_id: "${gov_t2}", purpose: "CONFERENCE_SCHOLARSHIP", requested_cents: 100000 }
              as: GovernmentContact
              as_user_id: "${gov_t2}"
              captures: { app_b2: $.data.id }
          trigger:
            - call: "POST /gfoa/scholarship-applications/${app_a}/allocate"
              payload: { expected_fund_version: "${fund_a_v}" }
              as: AwardsDirector
              captures: { grant_a: $.data.granted_cents }
            - call: "POST /gfoa/scholarship-applications/${app_b1}/allocate"
              payload: { expected_fund_version: "${fund_b_v}" }
              as: AwardsDirector
              captures: { grant_b1: $.data.granted_cents }
          assert:
            - "ScholarshipApplication.${app_a}.granted_cents == 100000 (FLAT_CAP: min(100000, 200000, 100000))"
            - "ScholarshipApplication.${app_b1}.granted_cents == 50000 (PRO_RATA: min(200000, round(100000*100000/200000), 100000))"
            - "identical pool/cap/request produce a 50000-cent delta across variants: ${grant_a} - ${grant_b1} == 50000"
            - "ScholarshipApplication.${app_a}.status == GRANTED and ScholarshipApplication.${app_b1}.status == GRANTED"
            - "ScholarshipApplication.${app_b2}.status == PENDING (untouched co-pending application)"

  - rule_id: combinatorial_formula
    instances:
      - name: finding_score_per_line_rounding_order
        grounds:
          - calculations.finding_weighted_score
          - state_machines.ReviewAssignment.ACCEPTED_to_SUBMITTED
        distinguishing_aspect: |
          Mode (b) nested rounding: with weights (0.5, 0.5) and scores
          (10.01, 20.01), the pinned per-criterion-then-sum order yields
          round2(5.005)+round2(10.005) = 5.01+10.01 = 15.02, while the
          sum-then-round order would yield round2(15.01) = 15.01 — the two
          orders differ by one cent and the scaffold pins per-line-first.
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z. FR checklist C1/C2 at 0.5 each, FR cycle in window, submission SUBMITTED, one ELIGIBLE reviewer assigned and ACCEPTED."
          setup_api_calls:
            - *k_clock
            - *k_cl_fr
            - *k_cyc_fr
            - *k_gov_s
            - *k_sub_create
            - *k_submit
            - *k_m1
            - *k_e1
            - *k_rev1
            - *k_train1
            - *k_att1
            - *k_asg1
            - *k_acc1
          trigger:
            - call: "POST /gfoa/review-assignments/${asg1}/finding"
              payload: { criterion_scores: [{ criterion_code: "C1", score: 10.01 }, { criterion_code: "C2", score: 20.01 }], comments: [] }
              as: Reviewer
              as_user_id: "${rev1}"
              captures: { fnd_ws: $.data.weighted_score }
          assert:
            - "ReviewFinding.weighted_score == 15.02 exactly (per-criterion rounding first: 5.01 + 10.01)"
            - "weighted_score != 15.01 (the sum-then-round order is NOT applied)"
            - "ReviewAssignment.${asg1}.status == SUBMITTED"

      - name: member_dues_pinned_evaluation_order
        grounds:
          - calculations.member_annual_dues
          - entities.Member.fields.annual_dues_cents
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: the discount tier is keyed on
          the PRE-discount total (band_base + affiliation fee), not the final
          dues — pinned order base -> fee -> pre_total -> tier -> discount.
          A MEDIUM officer sits exactly at the 30000 tier boundary (>= fires,
          5%); a LARGE officer at exactly 60000 crosses into 10%.
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z. Empty member table."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /gfoa/members"
              payload: { full_name: "Small Indy", email: "si@x.com", government_size_band: "SMALL", independent_finance_officer: true }
              as: PlatformAdmin
              captures: { dues_si: $.data.annual_dues_cents }
            - call: "POST /gfoa/members"
              payload: { full_name: "Mid Plain", email: "mp@x.com", government_size_band: "MEDIUM", independent_finance_officer: false }
              as: PlatformAdmin
              captures: { dues_mp: $.data.annual_dues_cents }
            - call: "POST /gfoa/members"
              payload: { full_name: "Large Plain", email: "lp@x.com", government_size_band: "LARGE", independent_finance_officer: false }
              as: PlatformAdmin
              captures: { dues_lp: $.data.annual_dues_cents }
          assert:
            - "Member(SMALL, independent).annual_dues_cents == 20000 (15000 + 5000 fee; pre_total 20000 below 30000 tier, no discount)"
            - "Member(MEDIUM, non-independent).annual_dues_cents == 28500 (pre_total exactly 30000 -> 5% tier because the boundary is >=, 30000 * 0.95)"
            - "Member(LARGE, non-independent).annual_dues_cents == 54000 (pre_total exactly 60000 -> 10% tier, 60000 * 0.90)"
            - "the discount key is the pre-discount total: a MEDIUM+independent officer (35000 pre) pays 33250, i.e. 5% off 35000, proving tier selection precedes discount application"

  - rule_id: non_linear_state_machine
    instances:
      - name: submission_decide_fork_then_appeal_cycle
        grounds:
          - state_machines.ReportSubmission.DECISION_READY_to_DECIDED_DENIED
          - state_machines.ReportSubmission.DECIDED_DENIED_to_APPEALED
          - state_machines.ReportSubmission.APPEALED_to_UNDER_REVIEW
        distinguishing_aspect: |
          ReportSubmission is non-linear twice over: DECISION_READY forks to
          AWARDED vs DENIED with divergent side effects (grant + counters vs
          required_improvements), and DENIED loops back via APPEALED into a
          fresh UNDER_REVIEW round where round-1 reviewers are excluded (the
          next blind assignment lands on a fourth reviewer with alias R2-1).
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z. FR checklist/cycle in window; submission fully reviewed by rev1-rev3 with weighted 80.00 findings (final 80.00 < 85.00) and one MAJOR comment 'Missing note disclosure'; a fourth ELIGIBLE reviewer rev4 stands by."
          setup_api_calls:
            - *k_clock
            - *k_cl_fr
            - *k_cyc_fr
            - *k_gov_s
            - *k_sub_create
            - *k_submit
            - *k_m1
            - *k_e1
            - *k_rev1
            - *k_train1
            - *k_att1
            - *k_m2
            - *k_e2
            - *k_rev2
            - *k_train2
            - *k_att2
            - *k_m3
            - *k_e3
            - *k_rev3
            - *k_train3
            - *k_att3
            - *k_asg1
            - *k_asg2
            - *k_asg3
            - *k_acc1
            - *k_acc2
            - *k_acc3
            - call: "POST /gfoa/review-assignments/${asg1}/finding"
              payload: { criterion_scores: [{ criterion_code: "C1", score: 80 }, { criterion_code: "C2", score: 80 }], comments: [{ criterion_code: "C1", severity: "MAJOR", text: "Missing note disclosure" }] }
              as: Reviewer
              as_user_id: "${rev1}"
            - call: "POST /gfoa/review-assignments/${asg2}/finding"
              payload: { criterion_scores: [{ criterion_code: "C1", score: 80 }, { criterion_code: "C2", score: 80 }], comments: [] }
              as: Reviewer
              as_user_id: "${rev2}"
            - call: "POST /gfoa/review-assignments/${asg3}/finding"
              payload: { criterion_scores: [{ criterion_code: "C1", score: 80 }, { criterion_code: "C2", score: 80 }], comments: [] }
              as: Reviewer
              as_user_id: "${rev3}"
            - call: "POST /gfoa/report-submissions/${sub_s}/decide"
              payload: {}
              as: AwardsDirector
            - call: "POST /gfoa/members"
              payload: { full_name: "Rita Four", email: "r4@x.com", government_size_band: "MEDIUM" }
              as: PlatformAdmin
              captures: { m4: $.data.id }
            - call: "POST /gfoa/governments"
              payload: { legal_name: "Village of Peer Four", gov_type: "CITY", population_band: "SMALL", state_code: "WI" }
              as: PlatformAdmin
              captures: { e4: $.data.id }
            - call: "POST /gfoa/reviewer-profiles"
              payload: { member_id: "${m4}", employer_government_id: "${e4}" }
              as: Member
              as_user_id: "${m4}"
              captures: { rev4: $.data.id }
            - call: "PUT /gfoa/reviewer-profiles/${rev4}"
              payload: { status: "TRAINED" }
              as: PlatformAdmin
            - call: "PUT /gfoa/reviewer-profiles/${rev4}"
              payload: { independence_attested: true }
              as: Reviewer
              as_user_id: "${rev4}"
          trigger:
            - call: "POST /gfoa/report-submissions/${sub_s}/appeal"
              payload: {}
              as: GovernmentContact
              as_user_id: "${gov_s}"
            - call: "POST /gfoa/review-assignments"
              payload: { submission_id: "${sub_s}" }
              as: AwardsDirector
              captures: { asg_r2: $.data.id, asg_r2_rev: $.data.reviewer_id, asg_r2_alias: $.data.reviewer_alias }
          assert:
            - "before appeal: ReportSubmission.${sub_s}.status == DECIDED_DENIED with final_score == 80.00 and major_deficiency_total == 1"
            - "ReportSubmission.${sub_s}.required_improvements == [\"Missing note disclosure\"] (DENIED branch compiles MAJOR comments) and award_conferred == false"
            - "after appeal: status == APPEALED, appeal_round == 2, provisional_score is null, major_deficiency_total == 0"
            - "the round-2 blind assignment selects ${rev4} (round-1 reviewers are excluded despite higher completed_review_count) with reviewer_alias == \"R2-1\""
            - "after that assignment: ReportSubmission.${sub_s}.status == UNDER_REVIEW (cycle re-entered)"

      - name: publication_revision_loop
        grounds:
          - state_machines.BestPracticePublication.RESOLUTION_to_DRAFTING
          - state_machines.BestPracticePublication.DRAFTING_to_MEMBER_COMMENT
          - state_machines.BestPracticePublication.MEMBER_COMMENT_to_RESOLUTION
        distinguishing_aspect: |
          BestPracticePublication runs a true cycle DRAFTING -> MEMBER_COMMENT
          -> RESOLUTION -> DRAFTING: each revise increments draft_number and
          clears the comment window, and the loop can repeat (draft_number 3)
          while the terminal PUBLISHED state remains reachable from RESOLUTION.
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z. Members chairM (chair) and creatorM (creator); a publication created by creatorM with chair chairM."
          setup_api_calls:
            - *k_clock
            - &k_chairM
              call: "POST /gfoa/members"
              payload: { full_name: "Chair Chen", email: "chair@x.com", government_size_band: "LARGE" }
              as: PlatformAdmin
              captures: { chairM: $.data.id }
            - &k_creatorM
              call: "POST /gfoa/members"
              payload: { full_name: "Creator Cole", email: "creator@x.com", government_size_band: "MEDIUM" }
              as: PlatformAdmin
              captures: { creatorM: $.data.id }
            - &k_pub
              call: "POST /gfoa/publications"
              payload: { committee_name: "Accounting Practices Committee", chair_member_id: "${chairM}", member_ids: ["${chairM}", "${creatorM}"], title: "Internal Control Over Grants", topic_code: "IC-GRANTS" }
              as: CommitteeMember
              as_user_id: "${creatorM}"
              captures: { pub: $.data.id }
            - call: "POST /gfoa/publications/${pub}/open-comment-period"
              payload: { closes_at: "2026-09-20T00:00:00Z" }
              as: CommitteeMember
              as_user_id: "${creatorM}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-21T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /gfoa/publications/${pub}/close-comment-period"
              payload: {}
              as: CommitteeMember
              as_user_id: "${creatorM}"
          trigger:
            - call: "POST /gfoa/publications/${pub}/revise"
              payload: {}
              as: CommitteeMember
              as_user_id: "${creatorM}"
            - call: "POST /gfoa/publications/${pub}/open-comment-period"
              payload: { closes_at: "2026-09-25T00:00:00Z" }
              as: CommitteeMember
              as_user_id: "${creatorM}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-26T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /gfoa/publications/${pub}/close-comment-period"
              payload: {}
              as: CommitteeMember
              as_user_id: "${creatorM}"
            - call: "POST /gfoa/publications/${pub}/revise"
              payload: {}
              as: CommitteeMember
              as_user_id: "${creatorM}"
              captures: { pub_draft: $.data.draft_number }
          assert:
            - "first revise: BestPracticePublication.${pub}.status == DRAFTING and draft_number == 2 with comment_window_opens_at null"
            - "the loop re-enters MEMBER_COMMENT then RESOLUTION a second time without error"
            - "after the second revise: draft_number == 3 and status == DRAFTING"

  - rule_id: transitive_cascade
    instances:
      - name: finding_submit_depth3_cascade
        grounds:
          - state_machines.ReviewAssignment.ACCEPTED_to_SUBMITTED
          - state_machines.ReportSubmission.UNDER_REVIEW_to_DECISION_READY
          - entities.AwardCycle.fields.decision_ready_count
          - calculations.provisional_award_score
        distinguishing_aspect: |
          Depth-3 chain from POST finding: (1) the finding flips its assignment
          ACCEPTED->SUBMITTED and moves the reviewer's open/completed counters;
          (2) the assignment flip recomputes the submission's provisional_score
          and, at the third current-round finding, flips the submission
          UNDER_REVIEW->DECISION_READY; (3) that flip increments
          cycle.decision_ready_count. Each link is caused by the previous one.
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z. FR checklist/cycle in window; submission SUBMITTED with three ACCEPTED assignments (rev1-rev3); two findings already filed (85.00 then 86.00)."
          setup_api_calls:
            - *k_clock
            - *k_cl_fr
            - *k_cyc_fr
            - *k_gov_s
            - *k_sub_create
            - *k_submit
            - *k_m1
            - *k_e1
            - *k_rev1
            - *k_train1
            - *k_att1
            - *k_m2
            - *k_e2
            - *k_rev2
            - *k_train2
            - *k_att2
            - *k_m3
            - *k_e3
            - *k_rev3
            - *k_train3
            - *k_att3
            - *k_asg1
            - *k_asg2
            - *k_asg3
            - *k_acc1
            - *k_acc2
            - *k_acc3
            - call: "POST /gfoa/review-assignments/${asg1}/finding"
              payload: { criterion_scores: [{ criterion_code: "C1", score: 90 }, { criterion_code: "C2", score: 80 }], comments: [] }
              as: Reviewer
              as_user_id: "${rev1}"
              captures: { ws1: $.data.weighted_score }
            - call: "POST /gfoa/review-assignments/${asg2}/finding"
              payload: { criterion_scores: [{ criterion_code: "C1", score: 88 }, { criterion_code: "C2", score: 84 }], comments: [] }
              as: Reviewer
              as_user_id: "${rev2}"
              captures: { ws2: $.data.weighted_score }
          trigger:
            - call: "POST /gfoa/review-assignments/${asg3}/finding"
              payload: { criterion_scores: [{ criterion_code: "C1", score: 92 }, { criterion_code: "C2", score: 76 }], comments: [] }
              as: Reviewer
              as_user_id: "${rev3}"
              captures: { ws3: $.data.weighted_score }
            - call: "GET /gfoa/report-submissions"
              payload: { government_id: "${gov_s}" }
              as: PlatformAdmin
              captures: { sub_status: "$.data.0.status", sub_prov: "$.data.0.provisional_score" }
            - call: "GET /gfoa/award-cycles"
              payload: { checklist_version_id: "${cl_fr}" }
              as: PlatformAdmin
              captures: { cyc_ready: "$.data.0.decision_ready_count" }
            - call: "GET /gfoa/reviewer-profiles"
              payload: { member_id: "${m3}" }
              as: PlatformAdmin
              captures: { rev3_open: "$.data.0.open_assignment_count", rev3_done: "$.data.0.completed_review_count" }
          assert:
            - "link 1: ReviewFinding weighted scores are 85.00, 86.00, 84.00 (${ws1}/${ws2}/${ws3}) and ReviewerProfile(rev3).open_assignment_count == 0 with completed_review_count == 1"
            - "link 2: ReportSubmission.${sub_s}.provisional_score == 85.00 after the third finding and status == DECISION_READY (reached only via the third finding, not by any direct call)"
            - "link 3: AwardCycle.${cyc_fr}.decision_ready_count == 1 (cycle counter moved as a consequence of the submission flip)"

      - name: standards_activation_depth2_cascade
        grounds:
          - state_machines.StandardsReference.ISSUED_to_EFFECTIVE
          - state_machines.ChecklistVersion.ACTIVE_to_SUPERSEDED
          - entities.ReportSubmission.fields.pinned_checklist_stale
        distinguishing_aspect: |
          Depth-2 chain from standards activation: (1) the standard going
          EFFECTIVE supersedes the program's ACTIVE checklist; (2) the
          checklist's supersession flags every DRAFT submission pinned to it
          with pinned_checklist_stale = true. Trigger differs from the
          finding-submit cascade.
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z. FR checklist ACTIVE; FR cycle; government with a DRAFT submission pinned to the checklist. A standard for FINANCIAL_REPORTING with effective_date 2026-09-10 sits ISSUED."
          setup_api_calls:
            - *k_clock
            - *k_cl_fr
            - *k_cyc_fr
            - *k_gov_s
            - *k_sub_create
            - call: "POST /gfoa/standards-references"
              payload: { topic_code: "GASB-103", title: "Financial Reporting Model Improvements", program_type: "FINANCIAL_REPORTING", effective_date: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
              captures: { std1: $.data.id }
          trigger:
            - call: "POST /gfoa/standards-references/${std1}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "GET /gfoa/checklist-versions"
              payload: { program_type: "FINANCIAL_REPORTING" }
              as: PlatformAdmin
              captures: { cl_status: "$.data.0.status" }
            - call: "GET /gfoa/report-submissions"
              payload: { government_id: "${gov_s}" }
              as: PlatformAdmin
              captures: { sub_stale: "$.data.0.pinned_checklist_stale" }
          assert:
            - "StandardsReference.${std1}.status == EFFECTIVE"
            - "link 1: ChecklistVersion.${cl_fr}.status == SUPERSEDED (was ACTIVE before activation)"
            - "link 2: ReportSubmission.${sub_s}.pinned_checklist_stale == true (flagged by the checklist's supersession, not by any direct write to the submission)"
            - "ReportSubmission.${sub_s}.status remains DRAFT and pinned_checklist_version_id == ${cl_fr} (pin retained, only staleness flips)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: allocate_state_error_beats_fiscal_error
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - errors.ERR_APPLICATION_STATE_INVALID
          - errors.ERR_POOL_EXHAUSTED
        distinguishing_aspect: |
          Error-category pair (state vs business_fiscal): re-allocating an
          already-GRANTED application against an EXHAUSTED fund violates both
          the PENDING-state gate and the remaining_cents>0 fiscal gate; the
          state error (priority 6) MUST win over the fiscal error (priority 11).
          The OCC version is kept current so only this pair is in play.
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z. FLAT_CAP fund pool 100000 cap 100000; one SMALL-government application for 100000 already GRANTED (pool drained to 0, fund EXHAUSTED)."
          setup_api_calls:
            - *k_clock
            - call: "POST /gfoa/governments"
              payload: { legal_name: "Village of Tiny", gov_type: "CITY", population_band: "SMALL", state_code: "OH" }
              as: PlatformAdmin
              captures: { gov_t1: $.data.id }
            - call: "POST /gfoa/scholarship-funds"
              payload: { fiscal_year: 2026, program_label: "SCHOLARSHIP", pool_total_cents: 100000, per_applicant_cap_cents: 100000, allocation_policy: "FLAT_CAP" }
              as: PlatformAdmin
              captures: { fund_a: $.data.id, fund_a_v: $.data.version }
            - call: "POST /gfoa/scholarship-applications"
              payload: { fund_id: "${fund_a}", government_id: "${gov_t1}", purpose: "CONFERENCE_SCHOLARSHIP", requested_cents: 100000 }
              as: GovernmentContact
              as_user_id: "${gov_t1}"
              captures: { app_a: $.data.id }
            - call: "POST /gfoa/scholarship-applications/${app_a}/allocate"
              payload: { expected_fund_version: "${fund_a_v}" }
              as: AwardsDirector
          trigger:
            - call: "POST /gfoa/scholarship-applications/${app_a}/allocate"
              payload: { expected_fund_version: "${fund_a_v} + 1" }
              as: AwardsDirector
              captures: { err: $.data.error_id }
          assert:
            - "the second allocate returns 409 with error_id == ERR_APPLICATION_STATE_INVALID (state, priority 6)"
            - "error_id != ERR_POOL_EXHAUSTED even though remaining_cents == 0 (fiscal, priority 11, is shadowed)"
            - "error_id != ERR_STALE_FUND_VERSION (OCC satisfied by the current-version expression)"

      - name: submit_referential_error_beats_temporal_error
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors.ERR_CHECKLIST_PIN_STALE
          - errors.ERR_SUBMISSION_WINDOW_CLOSED
        distinguishing_aspect: |
          Error-category pair (business_referential vs business_temporal): a
          DRAFT submission whose pinned checklist was SUPERSEDED AND whose
          cycle window has closed fails both gates; the referential error
          (priority 8) MUST win over the temporal error (priority 9).
        test_recipe:
          setup:
            - "Logical clock starts 2026-09-15T00:00:00Z. FR checklist/cycle, DRAFT submission pinned to the checklist. A FINANCIAL_REPORTING standard effective 2026-09-10 is activated, superseding the checklist and flagging the pin stale. Clock then moves to 2026-10-16 (past the 2026-10-15 deadline)."
          setup_api_calls:
            - *k_clock
            - *k_cl_fr
            - *k_cyc_fr
            - *k_gov_s
            - *k_sub_create
            - call: "POST /gfoa/standards-references"
              payload: { topic_code: "GASB-103", title: "Financial Reporting Model Improvements", program_type: "FINANCIAL_REPORTING", effective_date: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
              captures: { std1: $.data.id }
            - call: "POST /gfoa/standards-references/${std1}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-16T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /gfoa/report-submissions/${sub_s}/submit"
              payload: {}
              as: GovernmentContact
              as_user_id: "${gov_s}"
              captures: { err: $.data.error_id }
          assert:
            - "submit returns 409 with error_id == ERR_CHECKLIST_PIN_STALE (referential, priority 8)"
            - "error_id != ERR_SUBMISSION_WINDOW_CLOSED even though posture is IN_REVIEW at 2026-10-16 (temporal, priority 9, is shadowed)"
            - "ReportSubmission.${sub_s}.status remains DRAFT"

  - rule_id: boundary_precision_check
    instances:
      - name: decide_threshold_exact_boundary
        grounds:
          - calculations.final_award_score
          - state_machines.ReportSubmission.DECISION_READY_to_DECIDED_AWARDED
          - state_machines.ReportSubmission.DECISION_READY_to_DECIDED_DENIED
        distinguishing_aspect: |
          Score metric boundary on the decide endpoint: pass is final_score >=
          pass_score (inclusive). Findings 85.00/86.00/84.00 yield exactly
          85.00 == pass_score -> AWARDED; findings 85.00/86.00/83.97 yield
          84.99 -> DENIED. One cent of score flips the branch.
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z. FR checklist pass_score 85.00; two FR cycles [2026-09-01,2026-10-15) for 2026 and (second ACTIVE checklist) — two fully-reviewed submissions: submission A with weighted findings 85.00/86.00/84.00, submission B with 85.00/86.00/83.97."
          setup_api_calls:
            - *k_clock
            - *k_cl_fr
            - *k_cyc_fr
            - *k_gov_s
            - *k_sub_create
            - *k_submit
            - *k_m1
            - *k_e1
            - *k_rev1
            - *k_train1
            - *k_att1
            - *k_m2
            - *k_e2
            - *k_rev2
            - *k_train2
            - *k_att2
            - *k_m3
            - *k_e3
            - *k_rev3
            - *k_train3
            - *k_att3
            - *k_asg1
            - *k_asg2
            - *k_asg3
            - *k_acc1
            - *k_acc2
            - *k_acc3
            - call: "POST /gfoa/review-assignments/${asg1}/finding"
              payload: { criterion_scores: [{ criterion_code: "C1", score: 90 }, { criterion_code: "C2", score: 80 }], comments: [] }
              as: Reviewer
              as_user_id: "${rev1}"
            - call: "POST /gfoa/review-assignments/${asg2}/finding"
              payload: { criterion_scores: [{ criterion_code: "C1", score: 88 }, { criterion_code: "C2", score: 84 }], comments: [] }
              as: Reviewer
              as_user_id: "${rev2}"
            - call: "POST /gfoa/review-assignments/${asg3}/finding"
              payload: { criterion_scores: [{ criterion_code: "C1", score: 92 }, { criterion_code: "C2", score: 76 }], comments: [] }
              as: Reviewer
              as_user_id: "${rev3}"
            # second government + submission B below threshold (needs its own reviewer trio: rev1-3 are excluded per-submission only, so reuse is allowed)
            - call: "POST /gfoa/governments"
              payload: { legal_name: "Town of Boundary", gov_type: "CITY", population_band: "MEDIUM", state_code: "OH" }
              as: PlatformAdmin
              captures: { gov_b: $.data.id }
            - call: "POST /gfoa/report-submissions"
              payload: { government_id: "${gov_b}", cycle_id: "${cyc_fr}" }
              as: GovernmentContact
              as_user_id: "${gov_b}"
              captures: { sub_b: $.data.id }
            - call: "POST /gfoa/report-submissions/${sub_b}/submit"
              payload: {}
              as: GovernmentContact
              as_user_id: "${gov_b}"
            - call: "POST /gfoa/review-assignments"
              payload: { submission_id: "${sub_b}" }
              as: AwardsDirector
              captures: { asgb1: $.data.id }
            - call: "POST /gfoa/review-assignments"
              payload: { submission_id: "${sub_b}" }
              as: AwardsDirector
              captures: { asgb2: $.data.id }
            - call: "POST /gfoa/review-assignments"
              payload: { submission_id: "${sub_b}" }
              as: AwardsDirector
              captures: { asgb3: $.data.id }
            - call: "POST /gfoa/review-assignments/${asgb1}/accept"
              payload: {}
              as: Reviewer
              as_user_id: "${rev1}"
            - call: "POST /gfoa/review-assignments/${asgb2}/accept"
              payload: {}
              as: Reviewer
              as_user_id: "${rev2}"
            - call: "POST /gfoa/review-assignments/${asgb3}/accept"
              payload: {}
              as: Reviewer
              as_user_id: "${rev3}"
            - call: "POST /gfoa/review-assignments/${asgb1}/finding"
              payload: { criterion_scores: [{ criterion_code: "C1", score: 90 }, { criterion_code: "C2", score: 80 }], comments: [] }
              as: Reviewer
              as_user_id: "${rev1}"
            - call: "POST /gfoa/review-assignments/${asgb2}/finding"
              payload: { criterion_scores: [{ criterion_code: "C1", score: 88 }, { criterion_code: "C2", score: 84 }], comments: [] }
              as: Reviewer
              as_user_id: "${rev2}"
            - call: "POST /gfoa/review-assignments/${asgb3}/finding"
              payload: { criterion_scores: [{ criterion_code: "C1", score: 87.94 }, { criterion_code: "C2", score: 80 }], comments: [] }
              as: Reviewer
              as_user_id: "${rev3}"
          trigger:
            - call: "POST /gfoa/report-submissions/${sub_s}/decide"
              payload: {}
              as: AwardsDirector
            - call: "POST /gfoa/report-submissions/${sub_b}/decide"
              payload: {}
              as: AwardsDirector
            - call: "GET /gfoa/report-submissions/${sub_s}"
              payload: {}
              as: AwardsDirector
              captures: { sub_a_conferred: "$.data.award_conferred" }
            - call: "GET /gfoa/report-submissions/${sub_b}"
              payload: {}
              as: AwardsDirector
              captures: { sub_b_conferred: "$.data.award_conferred" }
          assert:
            - "ReportSubmission.${sub_s}.final_score == 85.00 exactly and status == DECIDED_AWARDED (>= boundary is inclusive)"
            - "ReportSubmission.${sub_s}.award_conferred == true and conferred_at == 2026-09-15T00:00:00Z"
            - "ReportSubmission.${sub_b}.final_score == 84.99 (85.00+86.00+83.97 = 254.97 / 3) and status == DECIDED_DENIED"
            - "ReportSubmission.${sub_b}.award_conferred == false and conferred_at is null"

      - name: allocate_exact_pool_drain_boundary
        grounds:
          - calculations.scholarship_grant_amount
          - entities.ScholarshipFund.fields.remaining_cents
          - errors.ERR_POOL_EXHAUSTED
        distinguishing_aspect: |
          Money metric boundary on the allocate endpoint: a request exactly
          equal to remaining_cents drains the pool to zero and SUCCEEDS (the
          guard is remaining > 0, not remaining >= request); the NEXT allocate
          hits ERR_POOL_EXHAUSTED. Zero-remaining is the exact edge.
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z. FLAT_CAP fund pool 120000 cap 200000; two SMALL governments each with a PENDING application (120000 and 10000)."
          setup_api_calls:
            - *k_clock
            - call: "POST /gfoa/governments"
              payload: { legal_name: "Village of Tiny", gov_type: "CITY", population_band: "SMALL", state_code: "OH" }
              as: PlatformAdmin
              captures: { gov_t1: $.data.id }
            - call: "POST /gfoa/governments"
              payload: { legal_name: "Town of Small", gov_type: "CITY", population_band: "SMALL", state_code: "OH" }
              as: PlatformAdmin
              captures: { gov_t2: $.data.id }
            - call: "POST /gfoa/scholarship-funds"
              payload: { fiscal_year: 2026, program_label: "SCHOLARSHIP", pool_total_cents: 120000, per_applicant_cap_cents: 200000, allocation_policy: "FLAT_CAP" }
              as: PlatformAdmin
              captures: { fund_a: $.data.id, fund_a_v: $.data.version }
            - call: "POST /gfoa/scholarship-applications"
              payload: { fund_id: "${fund_a}", government_id: "${gov_t1}", purpose: "CONFERENCE_SCHOLARSHIP", requested_cents: 120000 }
              as: GovernmentContact
              as_user_id: "${gov_t1}"
              captures: { app_a: $.data.id }
            - call: "POST /gfoa/scholarship-applications"
              payload: { fund_id: "${fund_a}", government_id: "${gov_t2}", purpose: "CONFERENCE_SCHOLARSHIP", requested_cents: 10000 }
              as: GovernmentContact
              as_user_id: "${gov_t2}"
              captures: { app_b: $.data.id }
          trigger:
            - call: "POST /gfoa/scholarship-applications/${app_a}/allocate"
              payload: { expected_fund_version: "${fund_a_v}" }
              as: AwardsDirector
              captures: { grant_a: $.data.granted_cents }
            - call: "POST /gfoa/scholarship-applications/${app_b}/allocate"
              payload: { expected_fund_version: "${fund_a_v} + 1" }
              as: AwardsDirector
              captures: { err_b: $.data.error_id }
          assert:
            - "ScholarshipApplication.${app_a}.granted_cents == 120000 and status == GRANTED (exact drain succeeds: min(120000, 200000, 120000))"
            - "after the drain the fund holds remaining_cents == 0 with status EXHAUSTED, proven behaviorally: the next allocate fails with ERR_POOL_EXHAUSTED"
            - "ScholarshipApplication.${app_b} allocate returns 409 error_id == ERR_POOL_EXHAUSTED and the application remains PENDING"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: assignment_accept_gated_by_reviewer_eligibility
        grounds:
          - state_machines.ReviewAssignment.OFFERED_to_ACCEPTED
          - state_machines.ReviewerProfile.ELIGIBLE_to_SUSPENDED
          - errors.ERR_REVIEWER_NOT_ELIGIBLE
        distinguishing_aspect: |
          Entity pair ReviewAssignment -> ReviewerProfile: an OFFERED
          assignment cannot be accepted while the reviewer is SUSPENDED; the
          gate re-opens after reinstatement (SUSPENDED -> ELIGIBLE) without
          touching the assignment.
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z. FR checklist/cycle, submission SUBMITTED, rev1 ELIGIBLE with one OFFERED assignment."
          setup_api_calls:
            - *k_clock
            - *k_cl_fr
            - *k_cyc_fr
            - *k_gov_s
            - *k_sub_create
            - *k_submit
            - *k_m1
            - *k_e1
            - *k_rev1
            - *k_train1
            - *k_att1
            - *k_asg1
            - call: "PUT /gfoa/reviewer-profiles/${rev1}"
              payload: { status: "SUSPENDED" }
              as: PlatformAdmin
          trigger:
            - call: "POST /gfoa/review-assignments/${asg1}/accept"
              payload: {}
              as: Reviewer
              as_user_id: "${rev1}"
              captures: { err: $.data.error_id }
            - call: "PUT /gfoa/reviewer-profiles/${rev1}"
              payload: { status: "ELIGIBLE" }
              as: PlatformAdmin
            - call: "POST /gfoa/review-assignments/${asg1}/accept"
              payload: {}
              as: Reviewer
              as_user_id: "${rev1}"
          assert:
            - "accept while SUSPENDED returns 409 error_id == ERR_REVIEWER_NOT_ELIGIBLE and ReviewAssignment.${asg1}.status remains OFFERED"
            - "after reinstatement the same accept returns 200 and ReviewAssignment.${asg1}.status == ACCEPTED"
            - "ReviewerProfile.${rev1}.open_assignment_count == 1 throughout (offer bookkeeping untouched by the suspension episode)"

      - name: submit_gated_by_cycle_posture
        grounds:
          - state_machines.ReportSubmission.DRAFT_to_SUBMITTED
          - calculations.cycle_posture
          - errors.ERR_SUBMISSION_WINDOW_CLOSED
        distinguishing_aspect: |
          Entity pair ReportSubmission -> AwardCycle: submit is allowed only
          while the CYCLE's clock-derived posture is OPEN; the same submission
          that submits cleanly at 2026-09-15 is rejected at 2026-10-16 when the
          cycle has rolled to IN_REVIEW, with no write to the cycle in between.
        test_recipe:
          setup:
            - "Logical clock starts 2026-09-15T00:00:00Z (posture OPEN). FR checklist/cycle with window [2026-09-01, 2026-10-15); a DRAFT submission; clock then advanced to 2026-10-16 (posture IN_REVIEW)."
          setup_api_calls:
            - *k_clock
            - *k_cl_fr
            - *k_cyc_fr
            - *k_gov_s
            - *k_sub_create
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-16T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /gfoa/award-cycles"
              payload: { checklist_version_id: "${cl_fr}" }
              as: PlatformAdmin
              captures: { cyc_posture: "$.data.0.posture" }
            - call: "POST /gfoa/report-submissions/${sub_s}/submit"
              payload: {}
              as: GovernmentContact
              as_user_id: "${gov_s}"
              captures: { err: $.data.error_id }
          assert:
            - "AwardCycle.${cyc_fr}.posture == IN_REVIEW at 2026-10-16 (derived purely from the logical clock)"
            - "submit returns 409 error_id == ERR_SUBMISSION_WINDOW_CLOSED and ReportSubmission.${sub_s}.status remains DRAFT"
            - "a second submission created and submitted at 2026-09-15 (posture OPEN) would succeed — the gate is the cycle's posture, not the submission's own fields"

  - rule_id: resource_temporal_overlap
    instances:
      - name: reviewer_windows_closed_interval_touching_is_overlap
        grounds:
          - entities.ReviewerProfile.fields.unavailability_windows
          - errors.ERR_AVAILABILITY_WINDOW_OVERLAP
          - validations[priority=8]
        distinguishing_aspect: |
          Resource ReviewerProfile, CLOSED-interval semantics: windows include
          both endpoints, so a new window starting on the day an existing one
          ends (2026-10-10 vs [2026-10-01, 2026-10-10]) IS an overlap; only a
          gap day (start 2026-10-11) passes. Touching == conflict here.
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z. Reviewer rev1 (TRAINED not required — PUT windows is valid from APPLICANT)."
          setup_api_calls:
            - *k_clock
            - *k_m1
            - *k_e1
            - *k_rev1
            - call: "PUT /gfoa/reviewer-profiles/${rev1}"
              payload: { unavailability_windows: [{ start_date: "2026-10-01", end_date: "2026-10-10" }] }
              as: Reviewer
              as_user_id: "${rev1}"
          trigger:
            - call: "PUT /gfoa/reviewer-profiles/${rev1}"
              payload: { unavailability_windows: [{ start_date: "2026-10-01", end_date: "2026-10-10" }, { start_date: "2026-10-10", end_date: "2026-10-15" }] }
              as: Reviewer
              as_user_id: "${rev1}"
              captures: { err_touch: $.data.error_id }
            - call: "PUT /gfoa/reviewer-profiles/${rev1}"
              payload: { unavailability_windows: [{ start_date: "2026-10-01", end_date: "2026-10-10" }, { start_date: "2026-10-11", end_date: "2026-10-20" }] }
              as: Reviewer
              as_user_id: "${rev1}"
              captures: { ok_windows: "$.data.unavailability_windows" }
          assert:
            - "touching endpoints (10-10 meets 10-10) return 409 ERR_AVAILABILITY_WINDOW_OVERLAP under closed-interval semantics"
            - "the gapped pair [10-01,10-10] + [10-11,10-20] is accepted (200) and the profile stores exactly 2 windows"
            - "the failed PUT leaves the original single window intact"

      - name: cycle_windows_half_open_adjacency_allowed
        grounds:
          - entities.AwardCycle.fields.submission_opens_at
          - entities.AwardCycle.fields.submission_deadline_at
          - errors.ERR_CYCLE_WINDOW_OVERLAP
          - validations[priority=8]
        distinguishing_aspect: |
          Resource AwardCycle (per program_type), HALF-OPEN semantics: cycle B
          opening exactly when cycle A's deadline lands ([09-01,10-15) then
          [10-15,11-30)) does NOT overlap — back-to-back is allowed — while
          opening one day earlier (10-14) does. Adjacency rule is the opposite
          of the reviewer-window rule.
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z. One ACTIVE FR checklist; cycle A with window [2026-09-01, 2026-10-15)."
          setup_api_calls:
            - *k_clock
            - *k_cl_fr
            - *k_cyc_fr
          trigger:
            - call: "POST /gfoa/award-cycles"
              payload: { program_type: "FINANCIAL_REPORTING", fiscal_year: 2027, submission_opens_at: "2026-10-15T00:00:00Z", submission_deadline_at: "2026-11-30T00:00:00Z", review_close_at: "2027-01-15T00:00:00Z", checklist_version_id: "${cl_fr}" }
              as: PlatformAdmin
              captures: { cyc_b: $.data.id }
            - call: "POST /gfoa/award-cycles"
              payload: { program_type: "FINANCIAL_REPORTING", fiscal_year: 2028, submission_opens_at: "2026-10-14T00:00:00Z", submission_deadline_at: "2026-12-31T00:00:00Z", review_close_at: "2027-02-15T00:00:00Z", checklist_version_id: "${cl_fr}" }
              as: PlatformAdmin
              captures: { err_overlap: $.data.error_id }
          assert:
            - "cycle B ([2026-10-15, 2026-11-30)) returns 201 — adjacency at the exact deadline instant is not an overlap under half-open semantics"
            - "cycle C (opens 2026-10-14) returns 409 ERR_CYCLE_WINDOW_OVERLAP — it intersects cycle A's [2026-09-01, 2026-10-15) window"
            - "both checks apply only within the same program_type (a BUDGET_PRESENTATION cycle over the same dates is unaffected)"

  - rule_id: compensating_invariant
    instances:
      - name: scholarship_allocate_rescind_conserves_pool_money
        grounds:
          - entities.ScholarshipFund.fields.remaining_cents
          - state_machines.ScholarshipApplication.PENDING_to_GRANTED
          - state_machines.ScholarshipApplication.GRANTED_to_RESCINDED
        distinguishing_aspect: |
          Conserved quantity is MONEY: for every fund, remaining_cents +
          SUM(granted_cents over GRANTED applications) == pool_total_cents.
          allocate (forward) then rescind (compensating) restores the exact
          pool, proven behaviorally by a follow-up grant of the full pool.
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z. FLAT_CAP fund pool 80000 cap 80000; SMALL gov applications app1 (60000) and app2 (80000)."
          setup_api_calls:
            - *k_clock
            - call: "POST /gfoa/governments"
              payload: { legal_name: "Village of Tiny", gov_type: "CITY", population_band: "SMALL", state_code: "OH" }
              as: PlatformAdmin
              captures: { gov_t1: $.data.id }
            - call: "POST /gfoa/governments"
              payload: { legal_name: "Town of Small", gov_type: "CITY", population_band: "SMALL", state_code: "OH" }
              as: PlatformAdmin
              captures: { gov_t2: $.data.id }
            - call: "POST /gfoa/scholarship-funds"
              payload: { fiscal_year: 2026, program_label: "TECHNICAL_ASSISTANCE", pool_total_cents: 80000, per_applicant_cap_cents: 80000, allocation_policy: "FLAT_CAP" }
              as: PlatformAdmin
              captures: { fund_a: $.data.id, fund_a_v: $.data.version }
            - call: "POST /gfoa/scholarship-applications"
              payload: { fund_id: "${fund_a}", government_id: "${gov_t1}", purpose: "TECHNICAL_ASSISTANCE", requested_cents: 60000 }
              as: GovernmentContact
              as_user_id: "${gov_t1}"
              captures: { app_1: $.data.id }
            - call: "POST /gfoa/scholarship-applications"
              payload: { fund_id: "${fund_a}", government_id: "${gov_t2}", purpose: "TECHNICAL_ASSISTANCE", requested_cents: 80000 }
              as: GovernmentContact
              as_user_id: "${gov_t2}"
              captures: { app_2: $.data.id }
          trigger:
            - call: "POST /gfoa/scholarship-applications/${app_1}/allocate"
              payload: { expected_fund_version: "${fund_a_v}" }
              as: AwardsDirector
              captures: { grant_1: $.data.granted_cents }
            - call: "POST /gfoa/scholarship-applications/${app_1}/rescind"
              payload: {}
              as: AwardsDirector
            - call: "POST /gfoa/scholarship-applications/${app_2}/allocate"
              payload: { expected_fund_version: "${fund_a_v} + 2" }
              as: AwardsDirector
              captures: { grant_2: $.data.granted_cents }
          assert:
            - "after allocate: app_1.granted_cents == 60000 (remaining would be 20000)"
            - "after rescind: app_1.status == RESCINDED and the recredit restores the pool — proven by app_2 granting the FULL 80000 (min(80000, 80000, 80000))"
            - "app_2.granted_cents == 80000 and status == GRANTED; any drift in the invariant (remaining + granted == pool) would have made this grant 20000 or failed with ERR_POOL_EXHAUSTED"
            - "the fund returns to EXHAUSTED only after app_2 (remaining 0), not after the rescind (remaining 80000 -> ALLOCATING)"

      - name: reviewer_counters_conserve_assignment_totals
        grounds:
          - entities.ReviewerProfile.fields.open_assignment_count
          - entities.ReviewerProfile.fields.completed_review_count
          - entities.ReviewerProfile.fields.declined_assignment_count
          - state_machines.ReviewAssignment.OFFERED_to_DECLINED
        distinguishing_aspect: |
          Conserved quantity is a COUNT, not money: per reviewer,
          open_assignment_count + completed_review_count +
          declined_assignment_count == number of that reviewer's non-CANCELLED
          assignments. Assign (forward) then decline (compensating) returns
          open_assignment_count to its prior value while the identity holds at
          every step.
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z. FR checklist/cycle in window; two SUBMITTED submissions from two governments; rev1 the only ELIGIBLE reviewer."
          setup_api_calls:
            - *k_clock
            - *k_cl_fr
            - *k_cyc_fr
            - *k_gov_s
            - *k_sub_create
            - *k_submit
            - call: "POST /gfoa/governments"
              payload: { legal_name: "Town of Second", gov_type: "CITY", population_band: "MEDIUM", state_code: "OH" }
              as: PlatformAdmin
              captures: { gov_2: $.data.id }
            - call: "POST /gfoa/report-submissions"
              payload: { government_id: "${gov_2}", cycle_id: "${cyc_fr}" }
              as: GovernmentContact
              as_user_id: "${gov_2}"
              captures: { sub_2: $.data.id }
            - call: "POST /gfoa/report-submissions/${sub_2}/submit"
              payload: {}
              as: GovernmentContact
              as_user_id: "${gov_2}"
            - *k_m1
            - *k_e1
            - *k_rev1
            - *k_train1
            - *k_att1
            - *k_asg1
          trigger:
            - call: "POST /gfoa/review-assignments/${asg1}/decline"
              payload: {}
              as: Reviewer
              as_user_id: "${rev1}"
            - call: "POST /gfoa/review-assignments"
              payload: { submission_id: "${sub_2}" }
              as: AwardsDirector
              captures: { asg_b: $.data.id, asg_b_rev: $.data.reviewer_id }
            - call: "GET /gfoa/reviewer-profiles"
              payload: { member_id: "${m1}" }
              as: PlatformAdmin
              captures: { rev_open: "$.data.0.open_assignment_count", rev_done: "$.data.0.completed_review_count", rev_decl: "$.data.0.declined_assignment_count" }
            - call: "GET /gfoa/review-assignments"
              payload: { reviewer_id: "${rev1}" }
              as: AwardsDirector
          assert:
            - "after assign+decline: open_assignment_count returned to 0 and declined_assignment_count == 1 (forward + compensating leave the open count unchanged)"
            - "after the second submission's assignment: open_assignment_count == 1 and the assignee is ${rev1} again (decline excludes rev1 only from submission ${sub_s}, not from ${sub_2})"
            - "identity holds: open(1) + completed(0) + declined(1) == 2 == count of non-CANCELLED assignments listed by GET /gfoa/review-assignments?reviewer_id=${rev1}"
