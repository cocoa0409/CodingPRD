  - rule_id: cross_entity_state_dependency
    instances:
      - name: finding_legalize_requires_pole_active
        grounds:
          - state_machines.UnauthorizedAttachmentFinding.FLAGGED_to_LEGALIZED
          - state_machines.Pole.ACTIVE_to_RETIRED
          - errors[ERR_POLE_NOT_ACTIVE]
        distinguishing_aspect: "Finding->LEGALIZED depends on Pole.status: after the pole is RETIRED (empty), legalizing its finding is rejected with ERR_POLE_NOT_ACTIVE (pair Finding<-Pole)."
        test_recipe:
          setup:
            - "Pole with a FLAGGED finding and no attachments/reservations/open applications; pole retired to RETIRED."
          setup_api_calls:
            - call: "POST /joint-use/pole-owners"
              payload: { legal_name: "O", owner_category: "MUNICIPAL", annual_rental_rate_cents: 1000, make_ready_labor_rate_cents_per_hour: 12000 }
              as: JointUseCoordinator
              captures: { owner_id: $.data.id }
            - call: "POST /joint-use/poles"
              payload: { pole_owner_id: "${owner_id}", tag: "P1", height_ft: 35, usable_communication_space_inches: 60 }
              as: JointUseCoordinator
              captures: { pole_id: $.data.id }
            - call: "POST /joint-use/attachers"
              payload: { company_name: "Acme", cin: "CIN1", contact_email: "a@x.com" }
              as: JointUseCoordinator
              captures: { att_id: $.data.id }
            - call: "POST /joint-use/findings"
              payload: { pole_id: "${pole_id}", attacher_id: "${att_id}", discovered_space_inches: 8, discovered_position_inches: 150, good_faith: true, estimated_install_years_ago: 1 }
              as: FieldAuditor
              captures: { finding_id: $.data.id }
            - call: "POST /joint-use/poles/${pole_id}/retire"
              as: JointUseCoordinator
          trigger:
            - call: "POST /joint-use/findings/${finding_id}/resolve"
              payload: { resolution: "LEGALIZE" }
              as: JointUseCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_POLE_NOT_ACTIVE"
            - "http_status == 409"

      - name: invoice_pay_blocked_by_open_dispute
        grounds:
          - state_machines.Invoice.ISSUED_to_PAID
          - state_machines.Dispute.OPEN_to_UNDER_REVIEW
          - errors[ERR_INVOICE_UNDER_DISPUTE]
        distinguishing_aspect: "Invoice->PAID depends on Dispute.status: a non-terminal (OPEN) Dispute referencing the invoice blocks payment with ERR_INVOICE_UNDER_DISPUTE (pair Invoice<-Dispute), a different entity pair than Finding<-Pole."
        test_recipe:
          setup:
            - "UNAUTHORIZED invoice ISSUED for a finding; attacher opens a dispute on that invoice (still OPEN)."
          setup_api_calls:
            - call: "POST /joint-use/pole-owners"
              payload: { legal_name: "O", owner_category: "ILEC", annual_rental_rate_cents: 1000, make_ready_labor_rate_cents_per_hour: 12000 }
              as: JointUseCoordinator
              captures: { owner_id: $.data.id }
            - call: "POST /joint-use/poles"
