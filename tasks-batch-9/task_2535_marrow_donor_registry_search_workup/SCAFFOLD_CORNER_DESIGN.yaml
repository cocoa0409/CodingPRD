              captures: { consent_result: "$.data.result" }
            - call: "POST /registry/workup-cases/${wc_id}/collection-method"
              payload: { method: "PBSC", rationale: "PBSC authorized by the second physician." }
              as: MedicalDirector
              as_user_id: "md-2"
              captures: { wc_method: "$.data.collection_method" }
          trigger:
            - call: "POST /registry/patients/${p_id}/conditioning"
