              as: FieldRep
              as_user_id: "${rep_id}"
              captures: { err_ov: $.data.error_id }
          assert:
            - "Back-to-back visit (10:00 start == 10:00 end) succeeds with 201 — half-open intervals share the boundary instant legally"
            - "Visit starting 09:59:59 is rejected with error_id ERR_VISIT_SCHEDULE_OVERLAP (http 409)"

      - name: count_session_windows_require_24h_gap_not_mere_non_overlap
