            - "Period locked; beneficiary BH (1990, risk 1.00) with adjudicated claims 10000 (PART_B) + 6000000 + 4000000 (PART_A) — the third adjudication crosses 10000000 and auto-flags a review; FINAL benchmark 1225200; quality validated; settlement PROPOSED (expenditure 10010000)"
