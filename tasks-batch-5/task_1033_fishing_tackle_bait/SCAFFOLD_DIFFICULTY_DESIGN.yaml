# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — task_1033
# 9 Difficulty Rules × 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: charter_provisional_vs_final_diverge
        grounds:
          - calculations.charter_booking_cost
          - state_machines.CharterBooking.CONFIRMED_to_COMPLETED
          - entities.CharterBooking.fields.provisional_total_cents
          - entities.CharterBooking.fields.final_total_cents
        distinguishing_aspect: |
          On CharterBooking (entity domain = charter), the provisional quote uses the
          logical-clock month for season and excludes fuel + tier discount, while the
          final settlement uses the start_at month and adds fuel + tier discount — the
          identical booking yields 65000 provisional vs 81000 final.
        test_recipe:
          setup:
            - "Logical clock at 2026-04-01 (OFF season) so the quote is off-peak."
            - "BRONZE customer; guide with full_day_rate 45000, per_extra_angler 5000, fuel 3000; venue."
            - "Booking FULL_DAY, party 4, equipment rental, trip in July (PEAK)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: ShopManager
            - call: "POST /customers"
              payload: { name: "Angler A", email: "a@x.com", state_code: "CA", birth_date: "1990-01-01" }
              as: ShopClerk
              captures: { cust_id: $.data.id }
            - call: "POST /guides"
              payload: { name: "Cap Joe", guide_license_no: "G-1", half_day_rate_cents: 25000, full_day_rate_cents: 45000, per_extra_angler_cents: 5000, max_party_size: 6, fuel_surcharge_cents: 3000 }
              as: ShopManager
              captures: { guide_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "Blue Lake", water_type: "LAKE" }
              as: ShopManager
              captures: { venue_id: $.data.id }
            - call: "POST /charter-bookings"
              payload: { customer_id: "${cust_id}", guide_id: "${guide_id}", venue_id: "${venue_id}", trip_type: "FULL_DAY", party_size: 4, start_at: "2026-07-10T08:00:00Z", end_at: "2026-07-10T16:00:00Z", add_equipment_rental: true }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /charter-bookings/${booking_id}/transition"
              payload: { action: "QUOTE" }
              as: ShopClerk
              captures: { prov: $.data.provisional_total_cents, dep: $.data.deposit_cents }
            - call: "POST /charter-bookings/${booking_id}/transition"
              payload: { action: "CONFIRM" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /charter-bookings/${booking_id}/transition"
              payload: { action: "COMPLETE" }
              as: Guide
              as_user_id: "${guide_id}"
              captures: { fin: $.data.final_total_cents, pts: $.data.points_awarded }
          assert:
            - "prov (provisional_total_cents) == 65000"
            - "dep (deposit_cents) == 16250"
            - "fin (final_total_cents) == 81000"
            - "pts (points_awarded) == 810"
            - "fin != prov  (final diverges from provisional for identical booking)"

      - name: loyalty_provisional_vs_final_diverge
        grounds:
          - calculations.loyalty_points_accrual
          - state_machines.Sale.COMPLETED_to_SETTLED
          - entities.Sale.fields.points_provisional
          - entities.Sale.fields.points_final
        distinguishing_aspect: |
          On Sale/Customer (entity domain = loyalty, distinct from charter), provisional
          points at COMPLETE exclude the peak seasonal bonus while final points at SETTLE
          in a PEAK month add a 10% bonus — 26 provisional vs 29 final.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-15 (PEAK) so SETTLE earns the seasonal bonus."
            - "BRONZE customer; product priced 1250; two lines each qty 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T00:00:00Z" }
              as: ShopManager
            - call: "POST /customers"
              payload: { name: "Angler B", email: "b@x.com", state_code: "CA", birth_date: "1990-01-01" }
              as: ShopClerk
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "JIG-1", name: "Bass Jig", category: "TERMINAL_TACKLE", unit_price_cents: 1250, stock_qty: 100 }
              as: ShopManager
              captures: { prod_id: $.data.id }
            - call: "POST /sales"
              payload: { customer_id: "${cust_id}" }
              as: ShopClerk
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/lines"
              payload: { product_id: "${prod_id}", qty: 1 }
              as: ShopClerk
            - call: "POST /sales/${sale_id}/lines"
              payload: { product_id: "${prod_id}", qty: 1 }
              as: ShopClerk
            - call: "POST /sales/${sale_id}/transition"
              payload: { action: "COMPLETE" }
              as: ShopClerk
              captures: { prov: $.data.points_provisional }
          trigger:
            - call: "POST /sales/${sale_id}/transition"
              payload: { action: "SETTLE" }
              as: ShopClerk
              captures: { fin: $.data.points_final }
          assert:
            - "prov (points_provisional) == 26"
            - "fin (points_final) == 29"
            - "fin != prov  (seasonal bonus makes final diverge)"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: charter_cost_nonlinear_inputs_mode_a
        grounds:
          - calculations.charter_booking_cost
          - entities.Guide.fields.per_extra_angler_cents
        distinguishing_aspect: |
          Mode (a): charter cost combines >=3 inputs non-linearly — base selected by
          trip_type, tiered extra via max(0, party_size-2)*per_extra, equipment*party,
          and a seasonal multiplier — HALF_DAY party 3 in PEAK gives provisional 36000.
        test_recipe:
          setup:
            - "Logical clock 2026-07-01 (PEAK)."
            - "Guide half_day 25000, per_extra 5000, fuel 3000; BRONZE customer; venue."
            - "Booking HALF_DAY, party 3, no equipment, trip in July."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ShopManager
            - call: "POST /customers"
              payload: { name: "Angler C", email: "c@x.com", state_code: "CA", birth_date: "1990-01-01" }
              as: ShopClerk
              captures: { cust_id: $.data.id }
            - call: "POST /guides"
              payload: { name: "Cap Ann", guide_license_no: "G-2", half_day_rate_cents: 25000, full_day_rate_cents: 45000, per_extra_angler_cents: 5000, max_party_size: 6, fuel_surcharge_cents: 3000 }
              as: ShopManager
              captures: { guide_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "Reed River", water_type: "RIVER" }
              as: ShopManager
              captures: { venue_id: $.data.id }
            - call: "POST /charter-bookings"
              payload: { customer_id: "${cust_id}", guide_id: "${guide_id}", venue_id: "${venue_id}", trip_type: "HALF_DAY", party_size: 3, start_at: "2026-07-20T06:00:00Z", end_at: "2026-07-20T10:00:00Z", add_equipment_rental: false }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /charter-bookings/${booking_id}/transition"
              payload: { action: "CONFIRM" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err_confirm_before_quote: $.data.error_id }
          trigger:
            - call: "POST /charter-bookings/${booking_id}/transition"
              payload: { action: "QUOTE" }
              as: ShopClerk
              captures: { prov: $.data.provisional_total_cents }
          assert:
            - "prov (provisional_total_cents) == 36000  # (25000 + max(0,3-2)*5000 + 0) * 1.20"
            - "err_confirm_before_quote == ERR_INVALID_STATE  # cannot confirm a REQUESTED (un-quoted) booking"

      - name: loyalty_rounding_order_pinned_mode_b
        grounds:
          - calculations.loyalty_points_accrual
          - entities.Sale.fields.points_provisional
        distinguishing_aspect: |
          Mode (b): round-per-line-then-sum is pinned — two 1250 lines give
          round(12.5)+round(12.5)=26, whereas sum-then-round(2500/100)=25; the scaffold
          fixes 26.
        test_recipe:
          setup:
            - "Logical clock 2026-04-01 (OFF, no seasonal effect on provisional)."
            - "BRONZE customer; product 1250; two lines qty 1 each."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: ShopManager
            - call: "POST /customers"
              payload: { name: "Angler D", email: "d@x.com", state_code: "CA", birth_date: "1990-01-01" }
              as: ShopClerk
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "JIG-2", name: "Crappie Jig", category: "TERMINAL_TACKLE", unit_price_cents: 1250, stock_qty: 100 }
              as: ShopManager
              captures: { prod_id: $.data.id }
            - call: "POST /sales"
              payload: { customer_id: "${cust_id}" }
              as: ShopClerk
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/lines"
              payload: { product_id: "${prod_id}", qty: 1 }
              as: ShopClerk
            - call: "POST /sales/${sale_id}/lines"
              payload: { product_id: "${prod_id}", qty: 1 }
              as: ShopClerk
          trigger:
            - call: "POST /sales/${sale_id}/transition"
              payload: { action: "COMPLETE" }
              as: ShopClerk
              captures: { prov: $.data.points_provisional, sub: $.data.subtotal_cents, tot: $.data.total_cents }
          assert:
            - "sub (subtotal_cents) == 2500"
            - "tot (total_cents) == 2700  # 2500 + round(2500*0.08)=200"
            - "prov (points_provisional) == 26  # per-line: 13 + 13; NOT sum-then-round 25"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: charter_reschedule_cycle
        grounds:
          - state_machines.CharterBooking.QUOTED_to_REQUESTED
          - state_machines.CharterBooking.REQUESTED_to_QUOTED
        distinguishing_aspect: |
          CharterBooking cycles QUOTED -> REQUESTED (RESCHEDULE) -> QUOTED (re-quote):
          a non-linear revision loop; re-quote after switching FULL_DAY->HALF_DAY
          recomputes provisional 45000 -> 25000.
        test_recipe:
          setup:
            - "Clock 2026-04-01 (OFF). Guide full_day 45000 half_day 25000. BRONZE customer, venue."
            - "Booking FULL_DAY party 2 no equipment; quoted at 45000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: ShopManager
            - call: "POST /customers"
              payload: { name: "Angler E", email: "e@x.com", state_code: "CA", birth_date: "1990-01-01" }
              as: ShopClerk
              captures: { cust_id: $.data.id }
            - call: "POST /guides"
              payload: { name: "Cap Bo", guide_license_no: "G-3", half_day_rate_cents: 25000, full_day_rate_cents: 45000, per_extra_angler_cents: 5000, max_party_size: 6 }
              as: ShopManager
              captures: { guide_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "Green Pond", water_type: "POND" }
              as: ShopManager
              captures: { venue_id: $.data.id }
            - call: "POST /charter-bookings"
              payload: { customer_id: "${cust_id}", guide_id: "${guide_id}", venue_id: "${venue_id}", trip_type: "FULL_DAY", party_size: 2, start_at: "2026-04-10T08:00:00Z", end_at: "2026-04-10T16:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /charter-bookings/${booking_id}/transition"
              payload: { action: "QUOTE" }
              as: ShopClerk
              captures: { prov1: $.data.provisional_total_cents }
          trigger:
            - call: "POST /charter-bookings/${booking_id}/transition"
              payload: { action: "RESCHEDULE", start_at: "2026-04-11T08:00:00Z", end_at: "2026-04-11T12:00:00Z", trip_type: "HALF_DAY" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { st_resched: $.data.status }
            - call: "POST /charter-bookings/${booking_id}/transition"
              payload: { action: "QUOTE" }
              as: ShopClerk
              captures: { st_quote: $.data.status, prov2: $.data.provisional_total_cents }
          assert:
            - "prov1 (provisional_total_cents at first quote) == 45000"
            - "st_resched == REQUESTED  # booking looped back to REQUESTED"
            - "st_quote == QUOTED  # re-quoted after the cycle"
            - "prov2 (provisional_total_cents at re-quote) == 25000"

      - name: service_order_awaiting_parts_cycle
        grounds:
          - state_machines.ServiceOrder.IN_PROGRESS_to_AWAITING_PARTS
          - state_machines.ServiceOrder.AWAITING_PARTS_to_IN_PROGRESS
        distinguishing_aspect: |
          ServiceOrder revisits IN_PROGRESS via AWAITING_PARTS -> RESUME before READY —
          a cycle on a different entity than CharterBooking; the state sequence
          IN_PROGRESS -> AWAITING_PARTS -> IN_PROGRESS -> READY proves non-linearity.
        test_recipe:
          setup:
            - "Customer; ServiceOrder RECEIVED, started to IN_PROGRESS."
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Angler F", email: "f@x.com", state_code: "CA", birth_date: "1990-01-01" }
              as: ShopClerk
              captures: { cust_id: $.data.id }
            - call: "POST /service-orders"
              payload: { customer_id: "${cust_id}", item_description: "Shimano reel", service_type: "REEL_SERVICE", quoted_cents: 4000 }
              as: ShopClerk
              captures: { so_id: $.data.id }
            - call: "POST /service-orders/${so_id}/transition"
              payload: { action: "START" }
              as: ShopClerk
          trigger:
            - call: "POST /service-orders/${so_id}/transition"
              payload: { action: "AWAIT_PARTS" }
              as: ShopClerk
              captures: { st1: $.data.status }
            - call: "POST /service-orders/${so_id}/transition"
              payload: { action: "RESUME" }
              as: ShopClerk
              captures: { st2: $.data.status }
            - call: "POST /service-orders/${so_id}/transition"
              payload: { action: "READY" }
              as: ShopClerk
              captures: { st3: $.data.status }
          assert:
            - "st1 == AWAITING_PARTS"
            - "st2 == IN_PROGRESS  # cycle: IN_PROGRESS re-entered from AWAITING_PARTS"
            - "st3 == READY"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: charter_complete_tier_upgrade_cascade_depth3
        grounds:
          - state_machines.CharterBooking.CONFIRMED_to_COMPLETED
          - entities.Customer.fields.loyalty_ledger
          - entities.Customer.fields.loyalty_points_balance
          - entities.Customer.fields.loyalty_tier
        distinguishing_aspect: |
          Depth-3 chain from COMPLETE: (1) append loyalty_ledger +810 -> (2) recompute
          loyalty_points_balance to 810 -> (3) recompute loyalty_tier BRONZE->SILVER;
          each hop is caused by the previous.
        test_recipe:
          setup:
            - "Clock 2026-04-01 (OFF at quote). BRONZE customer balance 0."
            - "Guide full_day 45000 per_extra 5000 fuel 3000; venue."
            - "Booking FULL_DAY party 4 equipment, trip July; quoted and confirmed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: ShopManager
            - call: "POST /customers"
              payload: { name: "Angler G", email: "g@x.com", state_code: "CA", birth_date: "1990-01-01" }
              as: ShopClerk
              captures: { cust_id: $.data.id }
            - call: "POST /guides"
              payload: { name: "Cap Di", guide_license_no: "G-4", half_day_rate_cents: 25000, full_day_rate_cents: 45000, per_extra_angler_cents: 5000, max_party_size: 6, fuel_surcharge_cents: 3000 }
              as: ShopManager
              captures: { guide_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "Cedar Lake", water_type: "LAKE" }
              as: ShopManager
              captures: { venue_id: $.data.id }
            - call: "POST /charter-bookings"
              payload: { customer_id: "${cust_id}", guide_id: "${guide_id}", venue_id: "${venue_id}", trip_type: "FULL_DAY", party_size: 4, start_at: "2026-07-10T08:00:00Z", end_at: "2026-07-10T16:00:00Z", add_equipment_rental: true }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /charter-bookings/${booking_id}/transition"
              payload: { action: "QUOTE" }
              as: ShopClerk
            - call: "POST /charter-bookings/${booking_id}/transition"
              payload: { action: "CONFIRM" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /charter-bookings/${booking_id}/transition"
              payload: { action: "COMPLETE" }
              as: Guide
              as_user_id: "${guide_id}"
              captures: { pts: $.data.points_awarded }
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: ShopClerk
              captures: { bal: $.data.loyalty_points_balance, tier: $.data.loyalty_tier }
          assert:
            - "pts (points_awarded) == 810"
            - "bal (loyalty_points_balance) == 810  # single ledger entry from this completion"
            - "tier (loyalty_tier) == SILVER  # 810 >= SILVER_MIN 500, crossed by the cascade"

      - name: tournament_finalize_prize_cascade_depth2
        grounds:
          - state_machines.Tournament.IN_PROGRESS_to_FINALIZED
          - state_machines.TournamentEntry.WEIGHED_to_PLACED
          - entities.Customer.fields.loyalty_points_balance
          - entities.Tournament.fields.winner_entry_id
        distinguishing_aspect: |
          Different trigger (FINALIZE): (1) rank entries and set winner placement -> (2)
          credit the winner's Customer prize_points 500 and recompute balance/tier
          BRONZE->SILVER; the second hop is caused by the placement hop.
        test_recipe:
          setup:
            - "Clock 2026-07-01 (inside registration window)."
            - "Venue; tournament prize_points 500, reg window Jul1..Aug1, opened."
            - "BRONZE customer registered, tournament STARTED, one 5000g weigh-in."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ShopManager
            - call: "POST /customers"
              payload: { name: "Angler H", email: "h@x.com", state_code: "CA", birth_date: "1990-01-01" }
              as: ShopClerk
              captures: { cust_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "Bass Basin", water_type: "LAKE" }
              as: ShopManager
              captures: { venue_id: $.data.id }
            - call: "POST /tournaments"
              payload: { venue_id: "${venue_id}", name: "Summer Slam", entry_fee_cents: 2000, registration_open_at: "2026-07-01T00:00:00Z", registration_close_at: "2026-08-01T00:00:00Z", start_at: "2026-09-05T06:00:00Z", end_at: "2026-09-05T18:00:00Z", max_entries: 20, prize_points: 500 }
              as: TournamentDirector
              captures: { tid: $.data.id }
            - call: "POST /tournaments/${tid}/transition"
              payload: { action: "OPEN" }
              as: TournamentDirector
            - call: "POST /tournaments/${tid}/entries"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { entry_id: $.data.id }
            - call: "POST /tournaments/${tid}/transition"
              payload: { action: "START" }
              as: TournamentDirector
            - call: "POST /tournament-entries/${entry_id}/weigh-ins"
              payload: { species: "LARGEMOUTH_BASS", weight_grams: 5000 }
              as: TournamentDirector
          trigger:
            - call: "POST /tournaments/${tid}/transition"
              payload: { action: "FINALIZE" }
              as: TournamentDirector
              captures: { winner: $.data.winner_entry_id }
            - call: "GET /tournament-entries/${entry_id}"
              payload: {}
              as: TournamentDirector
              captures: { placement: $.data.placement, estatus: $.data.status }
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: ShopClerk
              captures: { bal: $.data.loyalty_points_balance, tier: $.data.loyalty_tier }
          assert:
            - "winner (winner_entry_id) == ${entry_id}"
            - "placement == 1"
            - "estatus == PLACED"
            - "bal (loyalty_points_balance) == 500  # prize credited by cascade"
            - "tier (loyalty_tier) == SILVER"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_temporal_on_confirm
        grounds:
          - validations[priority=6]
          - validations[priority=9]
        distinguishing_aspect: |
          Category pair {state (P6) vs business_temporal (P9)}: confirming a REQUESTED
          (un-quoted) booking that also collides with the guide's confirmed slot returns
          ERR_INVALID_STATE (state), never ERR_GUIDE_UNAVAILABLE (temporal).
        test_recipe:
          setup:
            - "Guide, venue, two customers."
            - "Booking A (customer 1) 08:00-12:00 quoted+confirmed on the guide."
            - "Booking B (customer 2) 09:00-11:00 created but left REQUESTED (never quoted)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Cust One", email: "c1@x.com", state_code: "CA", birth_date: "1990-01-01" }
              as: ShopClerk
              captures: { c1: $.data.id }
            - call: "POST /customers"
              payload: { name: "Cust Two", email: "c2@x.com", state_code: "CA", birth_date: "1990-01-01" }
              as: ShopClerk
              captures: { c2: $.data.id }
            - call: "POST /guides"
              payload: { name: "Cap Ed", guide_license_no: "G-5", half_day_rate_cents: 25000, full_day_rate_cents: 45000, per_extra_angler_cents: 5000, max_party_size: 6 }
              as: ShopManager
              captures: { guide_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "Twin Lakes", water_type: "LAKE" }
              as: ShopManager
              captures: { venue_id: $.data.id }
            - call: "POST /charter-bookings"
              payload: { customer_id: "${c1}", guide_id: "${guide_id}", venue_id: "${venue_id}", trip_type: "HALF_DAY", party_size: 2, start_at: "2026-07-10T08:00:00Z", end_at: "2026-07-10T12:00:00Z" }
              as: Customer
              as_user_id: "${c1}"
              captures: { bookingA: $.data.id }
            - call: "POST /charter-bookings/${bookingA}/transition"
              payload: { action: "QUOTE" }
              as: ShopClerk
            - call: "POST /charter-bookings/${bookingA}/transition"
              payload: { action: "CONFIRM" }
              as: Customer
              as_user_id: "${c1}"
            - call: "POST /charter-bookings"
              payload: { customer_id: "${c2}", guide_id: "${guide_id}", venue_id: "${venue_id}", trip_type: "HALF_DAY", party_size: 2, start_at: "2026-07-10T09:00:00Z", end_at: "2026-07-10T11:00:00Z" }
              as: Customer
              as_user_id: "${c2}"
              captures: { bookingB: $.data.id }
          trigger:
            - call: "POST /charter-bookings/${bookingB}/transition"
              payload: { action: "CONFIRM" }
              as: Customer
              as_user_id: "${c2}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE  # state (P6) wins over the also-true temporal overlap (P9)"

      - name: safety_beats_referential_on_license
        grounds:
          - validations[priority=7]
          - validations[priority=8]
        distinguishing_aspect: |
          Category pair {business_safety (P7) vs business_referential (P8)}: issuing a
          second RESIDENT_ANNUAL with a mismatched state for a customer who already holds
          an ACTIVE RESIDENT_ANNUAL returns ERR_LICENSE_STATE_MISMATCH (safety), not
          ERR_DUPLICATE_LICENSE (referential).
        test_recipe:
          setup:
            - "Clock 2026-07-01. Adult CA customer already holding an ACTIVE RESIDENT_ANNUAL (CA)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ShopManager
            - call: "POST /customers"
              payload: { name: "Angler I", email: "i@x.com", state_code: "CA", birth_date: "1980-01-01" }
              as: ShopClerk
              captures: { cust_id: $.data.id }
            - call: "POST /licenses"
              payload: { customer_id: "${cust_id}", license_type: "RESIDENT_ANNUAL", state_code: "CA", valid_from: "2026-07-01T00:00:00Z" }
              as: ShopClerk
              captures: { lic1: $.data.id, lic1_status: $.data.status }
          trigger:
            - call: "POST /licenses"
              payload: { customer_id: "${cust_id}", license_type: "RESIDENT_ANNUAL", state_code: "NV", valid_from: "2026-07-01T00:00:00Z" }
              as: ShopClerk
              captures: { err: $.data.error_id }
          assert:
            - "lic1_status == ACTIVE  # first license is active, so the duplicate rule is also violated"
            - "err == ERR_LICENSE_STATE_MISMATCH  # safety (P7) wins over duplicate/referential (P8)"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: tank_delivery_capacity_boundary
        grounds:
          - entities.BaitTank.fields.capacity_units
          - calculations.tank_available_count
          - validations[priority=10]
        distinguishing_aspect: |
          Metric = tank unit count on POST /bait-tanks/{id}/batches: delivering exactly
          capacity (available 0 + 100 == 100) is accepted, delivering one more (would be
          101 > 100) is rejected — the >= capacity boundary.
        test_recipe:
          setup:
            - "Clock 2026-07-01. Tank capacity 100, zero mortality (no decay)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ShopManager
            - call: "POST /bait-tanks"
              payload: { name: "Minnow A", species: "MINNOW", capacity_units: 100, mortality_rate_bps_per_day: 0 }
              as: ShopManager
              captures: { tank_id: $.data.id, tank_v0: $.data.version }
          trigger:
            - call: "POST /bait-tanks/${tank_id}/batches"
              payload: { initial_count: 100, delivered_at: "2026-07-01T00:00:00Z", expected_bait_tank_version: "${tank_v0}" }
              as: ShopManager
              captures: { avail: $.data.available_count, tank_v1: $.data.version }
            - call: "POST /bait-tanks/${tank_id}/batches"
              payload: { initial_count: 1, delivered_at: "2026-07-01T00:00:00Z", expected_bait_tank_version: "${tank_v1}" }
              as: ShopManager
              captures: { err: $.data.error_id }
          assert:
            - "avail (available_count) == 100  # delivery at exactly capacity accepted"
            - "err == ERR_TANK_CAPACITY_EXCEEDED  # available 100 + 1 = 101 > capacity 100"

      - name: tournament_registration_deadline_boundary
        grounds:
          - entities.Tournament.fields.registration_close_at
          - validations[priority=9]
        distinguishing_aspect: |
          Metric = time on POST /tournaments/{id}/entries: registering at now ==
          registration_close_at is rejected (close is EXCLUSIVE) with
          ERR_REGISTRATION_CLOSED — a distinct endpoint and metric from the tank boundary.
        test_recipe:
          setup:
            - "Venue, tournament reg window Jul1..Aug1 (exclusive close), opened."
            - "Clock advanced to exactly 2026-08-01T00:00:00Z == registration_close_at."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ShopManager
            - call: "POST /customers"
              payload: { name: "Angler J", email: "j@x.com", state_code: "CA", birth_date: "1990-01-01" }
              as: ShopClerk
              captures: { cust_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "Clock Lake", water_type: "LAKE" }
              as: ShopManager
              captures: { venue_id: $.data.id }
            - call: "POST /tournaments"
              payload: { venue_id: "${venue_id}", name: "Deadline Cup", entry_fee_cents: 1000, registration_open_at: "2026-07-01T00:00:00Z", registration_close_at: "2026-08-01T00:00:00Z", start_at: "2026-09-10T06:00:00Z", end_at: "2026-09-10T18:00:00Z", max_entries: 50, prize_points: 300 }
              as: TournamentDirector
              captures: { tid: $.data.id }
            - call: "POST /tournaments/${tid}/transition"
              payload: { action: "OPEN" }
              as: TournamentDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ShopManager
          trigger:
            - call: "POST /tournaments/${tid}/entries"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_REGISTRATION_CLOSED  # now == close instant is rejected (exclusive)"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: confirm_blocked_by_suspended_guide
        grounds:
          - state_machines.CharterBooking.QUOTED_to_CONFIRMED
          - entities.Guide.fields.status
        distinguishing_aspect: |
          Entity pair {CharterBooking, Guide}: a QUOTED booking cannot CONFIRM while the
          referenced Guide.status == SUSPENDED -> ERR_GUIDE_SUSPENDED.
        test_recipe:
          setup:
            - "Customer, venue, guide; booking QUOTED; then guide PATCHed to SUSPENDED."
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Angler K", email: "k@x.com", state_code: "CA", birth_date: "1990-01-01" }
              as: ShopClerk
              captures: { cust_id: $.data.id }
            - call: "POST /guides"
              payload: { name: "Cap Fi", guide_license_no: "G-6", half_day_rate_cents: 25000, full_day_rate_cents: 45000, per_extra_angler_cents: 5000, max_party_size: 6 }
              as: ShopManager
              captures: { guide_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "Mirror Lake", water_type: "LAKE" }
              as: ShopManager
              captures: { venue_id: $.data.id }
            - call: "POST /charter-bookings"
              payload: { customer_id: "${cust_id}", guide_id: "${guide_id}", venue_id: "${venue_id}", trip_type: "HALF_DAY", party_size: 2, start_at: "2026-07-12T08:00:00Z", end_at: "2026-07-12T12:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /charter-bookings/${booking_id}/transition"
              payload: { action: "QUOTE" }
              as: ShopClerk
            - call: "PATCH /guides/${guide_id}"
              payload: { status: "SUSPENDED" }
              as: ShopManager
          trigger:
            - call: "POST /charter-bookings/${booking_id}/transition"
              payload: { action: "CONFIRM" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_GUIDE_SUSPENDED  # booking transition gated on Guide.status"

      - name: weighin_blocked_when_tournament_not_in_progress
        grounds:
          - state_machines.TournamentEntry.REGISTERED_to_WEIGHED
          - entities.Tournament.fields.status
        distinguishing_aspect: |
          Entity pair {TournamentEntry, Tournament}: a REGISTERED entry cannot accept a
          weigh-in while the parent Tournament.status == REGISTRATION_OPEN (not
          IN_PROGRESS) -> ERR_TOURNAMENT_NOT_IN_PROGRESS.
        test_recipe:
          setup:
            - "Clock 2026-07-01. Venue, tournament OPENed, customer registered; tournament NOT started."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ShopManager
            - call: "POST /customers"
              payload: { name: "Angler L", email: "l@x.com", state_code: "CA", birth_date: "1990-01-01" }
              as: ShopClerk
              captures: { cust_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "Still Water", water_type: "LAKE" }
              as: ShopManager
              captures: { venue_id: $.data.id }
            - call: "POST /tournaments"
              payload: { venue_id: "${venue_id}", name: "Early Bird", entry_fee_cents: 1500, registration_open_at: "2026-07-01T00:00:00Z", registration_close_at: "2026-08-01T00:00:00Z", start_at: "2026-09-12T06:00:00Z", end_at: "2026-09-12T18:00:00Z", max_entries: 30, prize_points: 400 }
              as: TournamentDirector
              captures: { tid: $.data.id }
            - call: "POST /tournaments/${tid}/transition"
              payload: { action: "OPEN" }
              as: TournamentDirector
            - call: "POST /tournaments/${tid}/entries"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { entry_id: $.data.id }
          trigger:
            - call: "POST /tournament-entries/${entry_id}/weigh-ins"
              payload: { species: "CATFISH", weight_grams: 3000 }
              as: TournamentDirector
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_TOURNAMENT_NOT_IN_PROGRESS  # entry weigh-in gated on parent Tournament.status"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: guide_buffered_overlap_conflict
        grounds:
          - state_machines.CharterBooking.QUOTED_to_CONFIRMED
          - validations[priority=9]
        distinguishing_aspect: |
          Guide resource, half-open intervals padded by CHARTER_BUFFER_MINUTES=60: a
          second booking starting 30 min after the first ends (< buffer) collides ->
          ERR_GUIDE_UNAVAILABLE (buffer padding, unlike the venue rule).
        test_recipe:
          setup:
            - "Guide, venue, two customers."
            - "Booking A 08:00-12:00 confirmed; Booking B 12:30-16:00 quoted (gap 30 min < 60)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Cust P", email: "p@x.com", state_code: "CA", birth_date: "1990-01-01" }
              as: ShopClerk
              captures: { c1: $.data.id }
            - call: "POST /customers"
              payload: { name: "Cust Q", email: "q@x.com", state_code: "CA", birth_date: "1990-01-01" }
              as: ShopClerk
              captures: { c2: $.data.id }
            - call: "POST /guides"
              payload: { name: "Cap Gus", guide_license_no: "G-7", half_day_rate_cents: 25000, full_day_rate_cents: 45000, per_extra_angler_cents: 5000, max_party_size: 6 }
              as: ShopManager
              captures: { guide_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "Buffer Bay", water_type: "SALTWATER" }
              as: ShopManager
              captures: { venue_id: $.data.id }
            - call: "POST /charter-bookings"
              payload: { customer_id: "${c1}", guide_id: "${guide_id}", venue_id: "${venue_id}", trip_type: "HALF_DAY", party_size: 2, start_at: "2026-07-10T08:00:00Z", end_at: "2026-07-10T12:00:00Z" }
              as: Customer
              as_user_id: "${c1}"
              captures: { bookingA: $.data.id }
            - call: "POST /charter-bookings/${bookingA}/transition"
              payload: { action: "QUOTE" }
              as: ShopClerk
            - call: "POST /charter-bookings/${bookingA}/transition"
              payload: { action: "CONFIRM" }
              as: Customer
              as_user_id: "${c1}"
            - call: "POST /charter-bookings"
              payload: { customer_id: "${c2}", guide_id: "${guide_id}", venue_id: "${venue_id}", trip_type: "HALF_DAY", party_size: 2, start_at: "2026-07-10T12:30:00Z", end_at: "2026-07-10T16:00:00Z" }
              as: Customer
              as_user_id: "${c2}"
              captures: { bookingB: $.data.id }
            - call: "POST /charter-bookings/${bookingB}/transition"
              payload: { action: "QUOTE" }
              as: ShopClerk
          trigger:
            - call: "POST /charter-bookings/${bookingB}/transition"
              payload: { action: "CONFIRM" }
              as: Customer
              as_user_id: "${c2}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_GUIDE_UNAVAILABLE  # 30-min gap is within the 60-min buffer"

      - name: venue_adjacency_allowed_overlap_conflict
        grounds:
          - entities.Tournament.fields.venue_id
          - validations[priority=9]
        distinguishing_aspect: |
          Venue resource, half-open intervals with NO buffer: a tournament overlapping an
          existing one at the same venue is rejected (ERR_VENUE_DOUBLE_BOOKED), but exact
          adjacency (end == next start) is accepted — different interval semantics from
          the buffered guide rule.
        test_recipe:
          setup:
            - "Venue with tournament T1 06:00-18:00 on 2026-09-05."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Contested Cove", water_type: "SALTWATER" }
              as: ShopManager
              captures: { venue_id: $.data.id }
            - call: "POST /tournaments"
              payload: { venue_id: "${venue_id}", name: "T1", entry_fee_cents: 1000, registration_open_at: "2026-08-01T00:00:00Z", registration_close_at: "2026-09-04T00:00:00Z", start_at: "2026-09-05T06:00:00Z", end_at: "2026-09-05T18:00:00Z", max_entries: 40, prize_points: 200 }
              as: TournamentDirector
              captures: { t1: $.data.id }
          trigger:
            - call: "POST /tournaments"
              payload: { venue_id: "${venue_id}", name: "T2 overlap", entry_fee_cents: 1000, registration_open_at: "2026-08-01T00:00:00Z", registration_close_at: "2026-09-04T00:00:00Z", start_at: "2026-09-05T17:00:00Z", end_at: "2026-09-06T01:00:00Z", max_entries: 40, prize_points: 200 }
              as: TournamentDirector
              captures: { err: $.data.error_id }
            - call: "POST /tournaments"
              payload: { venue_id: "${venue_id}", name: "T3 adjacent", entry_fee_cents: 1000, registration_open_at: "2026-08-01T00:00:00Z", registration_close_at: "2026-09-04T00:00:00Z", start_at: "2026-09-05T18:00:00Z", end_at: "2026-09-05T20:00:00Z", max_entries: 40, prize_points: 200 }
              as: TournamentDirector
              captures: { t3: $.data.id, t3_status: $.data.status }
          assert:
            - "err == ERR_VENUE_DOUBLE_BOOKED  # 17:00 start overlaps T1's [06:00,18:00)"
            - "t3_status == SCHEDULED  # T3 starting exactly at 18:00 (== T1 end) is accepted; no buffer"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: loyalty_points_conserved_on_sale_refund
        grounds:
          - state_machines.Sale.OPEN_to_COMPLETED
          - state_machines.Sale.COMPLETED_to_REFUNDED
          - entities.Customer.fields.loyalty_ledger
          - entities.Customer.fields.loyalty_points_balance
        distinguishing_aspect: |
          Conserved quantity = loyalty points: COMPLETE mints +50 and REFUND mints -50,
          so loyalty_points_balance returns to its pre-sale value 0 and equals
          sum(loyalty_ledger deltas) after the round-trip.
        test_recipe:
          setup:
            - "Clock 2026-04-01 (OFF, no bonus). BRONZE customer balance 0."
            - "Product 5000, stock 10; sale one line qty 1; completed (points 50, balance 50)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: ShopManager
            - call: "POST /customers"
              payload: { name: "Angler M", email: "m@x.com", state_code: "CA", birth_date: "1990-01-01" }
              as: ShopClerk
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "ROD-1", name: "Spin Rod", category: "ROD", unit_price_cents: 5000, stock_qty: 10 }
              as: ShopManager
              captures: { prod_id: $.data.id }
            - call: "POST /sales"
              payload: { customer_id: "${cust_id}" }
              as: ShopClerk
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/lines"
              payload: { product_id: "${prod_id}", qty: 1 }
              as: ShopClerk
            - call: "POST /sales/${sale_id}/transition"
              payload: { action: "COMPLETE" }
              as: ShopClerk
              captures: { prov: $.data.points_provisional }
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: ShopClerk
              captures: { bal1: $.data.loyalty_points_balance }
          trigger:
            - call: "POST /sales/${sale_id}/transition"
              payload: { action: "REFUND" }
              as: ShopManager
              captures: { rstatus: $.data.status }
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: ShopClerk
              captures: { bal2: $.data.loyalty_points_balance }
          assert:
            - "prov (points_provisional) == 50"
            - "bal1 (loyalty_points_balance after COMPLETE) == 50"
            - "rstatus == REFUNDED"
            - "bal2 (loyalty_points_balance after REFUND) == 0  # equals sum(ledger deltas: +50, -50)"

      - name: bait_count_conserved_on_dispense_return
        grounds:
          - calculations.tank_available_count
          - entities.BaitTank.fields.sold_count
          - entities.BaitTank.fields.available_count
        distinguishing_aspect: |
          Conserved quantity = physical bait units (distinct from loyalty points):
          dispensing 30 then returning 30 leaves available_count unchanged at 100, and
          available_count == survivors(100) - sold_count(0) after the round-trip.
        test_recipe:
          setup:
            - "Clock 2026-07-01. Tank capacity 100, zero mortality; batch of 100 delivered same day (available 100)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ShopManager
            - call: "POST /bait-tanks"
              payload: { name: "Shiner Tank", species: "SHINER", capacity_units: 100, mortality_rate_bps_per_day: 0 }
              as: ShopManager
              captures: { tank_id: $.data.id, tank_v0: $.data.version }
            - call: "POST /bait-tanks/${tank_id}/batches"
              payload: { initial_count: 100, delivered_at: "2026-07-01T00:00:00Z", expected_bait_tank_version: "${tank_v0}" }
              as: ShopManager
              captures: { avail0: $.data.available_count }
          trigger:
            - call: "POST /bait-tanks/${tank_id}/dispense"
              payload: { qty: 30 }
              as: ShopClerk
              captures: { avail1: $.data.available_count, sold1: $.data.sold_count }
            - call: "POST /bait-tanks/${tank_id}/returns"
              payload: { qty: 30 }
              as: ShopClerk
              captures: { avail2: $.data.available_count, sold2: $.data.sold_count }
          assert:
            - "avail0 (available_count) == 100"
            - "avail1 (available_count after dispense 30) == 70"
            - "sold1 (sold_count) == 30"
            - "avail2 (available_count after return 30) == 100  # conserved"
            - "sold2 (sold_count) == 0"
