              payload: { category_code: "SNACKS", brand_codes: ["ACME"] }
              as: RetailerAdmin
            - call: "POST /shopper-insights/insight-reports"
              payload: { contract_id: "${contract}", report_type: "CATEGORY", category_code: "SNACKS", period_start: "2026-08-01", period_end: "2026-08-31" }
              as: SupplierAnalyst
              as_user_id: "${acct}"
              captures: { rep: $.data.id }
            - call: "POST /shopper-insights/line-review-cycles"
              payload: { category_code: "SNACKS", window_start: "2026-09-20", window_end: "2026-09-25" }
              as: CategoryManager
              captures: { cyc: $.data.id }
            - call: "POST /shopper-insights/line-review-cycles/${cyc}/deliverables"
              payload: { contract_id: "${contract}", insight_report_id: "${rep}", due_at: "2026-09-15T00:00:00Z" }
              as: CategoryManager
              captures: { dlv: $.data.id }
            - call: "POST /shopper-insights/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: RetailerAdmin
            - call: "GET /shopper-insights/line-review-cycles/${cyc}"
              as: CategoryManager
              captures: { cyc_status: $.data.status }
          trigger:
            - call: "POST /shopper-insights/line-review-cycles/${cyc}/lock"
              as: CategoryManager
            - call: "GET /shopper-insights/line-review-cycles/${cyc}/deliverables"
              as: CategoryManager
              captures: { dlv_status: "$.data[0].status" }
            - call: "GET /shopper-insights/subscription-contracts/${contract}"
              as: CategoryManager
              captures: { c_score: $.data.compliance_score }
          assert:
            - "cycle GET before lock shows status == OPEN (lazy auto-open at clock >= open_at)"
            - "ReviewDeliverable.${dlv}.status == MISSED (cascade B)"
            - "SubscriptionContract.${contract}.compliance_score == 975 (cascade C: 1000 - 25)"
            - "LineReviewCycle.${cyc}.status == LOCKED"

