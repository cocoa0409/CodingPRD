  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: shift_confirm_blocked_by_suspended_guard
        grounds:
          - state_machines.CoverageShift.SCHEDULED_to_CONFIRMED
          - state_machines.Guard.employment_status=ACTIVE_to_employment_status=SUSPENDED
          - validations[priority=9]
          - errors[ERR_GUARD_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair (CoverageShift ← Guard): the shift's SCHEDULED→CONFIRMED edge is gated on the OTHER
          entity's employment_status; suspending the guard after the shift has already started (so the release
          cascade, which only touches shifts starting at or after the clock, leaves it assigned) makes CONFIRM
          fail with ERR_GUARD_NOT_ACTIVE.
        test_recipe:
          setup:
