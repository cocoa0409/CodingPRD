      - name: error_credit_gate_on_activation
        claim_type: error_triggerable
        grounds:
          - "errors[ERR_CREDIT_NOT_CLEARED]"
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / order_activation_blocked_by_deposit_due_handoff
          rationale: |
            ERR_CREDIT_NOT_CLEARED is the compensating-invariant instance's whole subject: it
            activates an order whose credit dimension sits at DEPOSIT_DUE, checks the 409, pays the
            exact deposit, and re-activates successfully. A corner test would repeat that trigger
            with a weaker assertion set.

      - name: error_filing_state_gate
        claim_type: error_triggerable
        grounds:
          - "errors[ERR_FILING_NOT_SUBMITTABLE]"
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_beats_consent_revoked_on_filing_resubmission
          rationale: |
            ERR_FILING_NOT_SUBMITTABLE is raised there against a CONFIRMED filing specifically to
            show it outranks the revoked-consent complaint, which is a strictly stronger claim than
            triggering the code on its own; the same instance also covers the DRAFT-filing
            usps-response and the CONFIRMED-filing cancellation variants of the code.

  - section: rbac
    instances:

      - name: rbac_exclusive_operations_are_forbidden_across_roles_in_both_directions
        claim_type: exclusive_operation_denial
        grounds:
          - roles.MoveOpsAgent.exclusive_operations
          - roles.PlatformAdmin.exclusive_operations
          - roles.ProviderAgent.exclusive_operations
          - "validations[priority=2]"
          - "errors[ERR_FORBIDDEN_ROLE]"
        distinguishing_aspect: |
          Denial asserted in both directions on the same fixture, plus the ordering proof that the
          role gate outranks the state gate: MoveOpsAgent is refused the ProviderAgent-exclusive
          activation of an order that is in DRAFT, so the answer must be 403 ERR_FORBIDDEN_ROLE and
          not the 409 ERR_ORDER_NOT_SCHEDULABLE that the order's own status would earn.
        test_recipe:
          setup:
            - "A verified move whose electric utility order has been mapped but not scheduled."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /feed-sources"
              payload: { name: "Metro PM Feed", source_type: "PROPERTY_MANAGER", referral_revenue_share_pct: 0.1750, dedupe_window_days: 30, trust_tier: "TIER_B" }
              as: PlatformAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /residents"
              payload: { full_name: "Dana Ruiz", email: "dana.ruiz@example.com", phone_last4: "4417", date_of_birth: "1988-04-12", ssn_last4: "6621" }
              as: PlatformAdmin
              captures: { res_id: $.data.id, res_v1: $.data.version }
            - call: "POST /service-addresses"
              payload: { line1: "18 Maple Ct", city: "Atlanta", state_code: "GA", postal_code: "30301" }
              as: PlatformAdmin
              captures: { orig_id: $.data.id }
            - call: "POST /service-addresses"
              payload: { line1: "402 Peachtree Way", unit: "7B", city: "Atlanta", state_code: "GA", postal_code: "30302" }
              as: PlatformAdmin
              captures: { dest_id: $.data.id }
            - call: "POST /utility-providers"
              payload: { name: "Georgia Metro Electric", utility_type: "ELECTRIC", required_account_fields: ["account_holder_name", "service_start_date"], deposit_policy: "CREDIT_SCORE_BASED", credit_check_required: true, scheduling_lead_days: 3 }
              as: PlatformAdmin
              captures: { prov_e_id: $.data.id }
            - call: "POST /provider-service-territories"
              payload: { provider_id: "${prov_e_id}", postal_code: "30302", state_code: "GA", effective_from: "2026-01-01", priority_rank: 1, is_default_carrier: true }
              as: PlatformAdmin
              captures: { terr_e_id: $.data.id }
            - call: "POST /moves"
              payload: { resident_id: "${res_id}", feed_source_id: "${fs_id}", origin_address_id: "${orig_id}", destination_address_id: "${dest_id}", move_date: "2026-08-20" }
              as: MoveOpsAgent
              captures: { mv_id: $.data.id }
            - call: "POST /residents/${res_id}/consent-records"
              payload: { scope: "UTILITY_SETUP", source_channel: "PM_FEED", consent_text_version: "v3", expected_resident_version: "${res_v1}" }
              as: MoveOpsAgent
              captures: { cs_util_id: $.data.id }
            - call: "POST /moves/${mv_id}/identity-verifications"
              payload: { method: "KBA" }
              as: MoveOpsAgent
              captures: { idv_id: $.data.id }
            - call: "POST /identity-verifications/${idv_id}/kba-result"
              payload: { outcome: "PASSED", score: 720 }
              as: ExternalServiceGateway
            - call: "GET /moves/${mv_id}"
              payload: {}
