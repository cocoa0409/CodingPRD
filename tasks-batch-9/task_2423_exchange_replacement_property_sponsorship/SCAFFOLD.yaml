scenario: |
  Generate task harder than expert level!

  2423. Exchange Replacement Property Sponsorship (Delaware statutory trust sponsor): property acquisition and trust formation with restrictions on trustee powers, offering document preparation, accredited investor verification and suitability review, investor closing sequencing with tight exchange identification and closing deadlines, financing at the trust level with non-recourse debt and no-refinancing constraints, master lease structure to accommodate operating flexibility within trust limits, reserve funding for capital needs given prohibitions on new capital calls, ongoing investor reporting, distributions and tax reporting, exit through sale or conversion with subsequent exchange planning for investors
domain_name: "exchange-replacement-property-sponsorship"
api_prefix: ""

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Temporal windowing"
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: graph
  # graph: Property <- DstTrust <- Offering <- Subscription -> ExchangeFile -> PropertyIdentification -> Property
  # closes a cycle; ExitConsent and DistributionAllocation are many-to-many junctions;
  # TrustLedgerEntry.reversal_of_entry_id is self-referential.

  state_machine_shape: parallel
  # Investor carries two independent dimensions (accreditation_status x suitability_status);
  # Offering is cyclic (DRAFT -> UNDER_REVIEW -> DRAFT revision loop);
  # DstTrust.posture is a derived aggregate that gates child operations.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # The SponsorPrincipal who submits a PPM cannot declare it effective (ComplianceOfficer must),
  # and the Trustee who funds trust-level obligations cannot close subscriptions.

  consistency_model: immediate

difficulty_level: expert_plus
# 16 entities / 78 endpoints / 76 error codes / 62 ordered validations /
# 21 calculations (3 with variants) / 2 OCC rules / 7 roles /
# 13 state machines (1 cyclic, 1 parallel-dimension, 1 posture-driven aggregate).

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Property
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Marketing name of the candidate replacement property."
      - name: state_code
        type: string
        source: input
        description: "Two-letter US state code where the property sits."
        constraints: "exactly 2 uppercase letters"
      - name: asset_type
        type: enum
        source: input
        description: "Asset class of the property."
        constraints: "one of INDUSTRIAL, MULTIFAMILY, RETAIL, OFFICE"
      - name: purchase_price_cents
        type: integer
        source: input
        description: "Contract purchase price in cents."
        constraints: ">= 1"
      - name: appraised_value_cents
        type: integer
        source: input
        description: "Third-party appraised value in cents; denominator of the loan LTV test."
        constraints: ">= 1"
      - name: annual_noi_cents
        type: integer
        source: input
        description: "Underwritten annual net operating income in cents; numerator of the DSCR test."
        constraints: ">= 0"
      - name: occupancy_rate
        type: number
        source: input
        description: "Physical occupancy at underwriting, 4 decimal places."
        constraints: "0.0000 <= occupancy_rate <= 1.0000"
      - name: contract_close_deadline
        type: datetime
        source: input
        description: "Outside date on the purchase contract; acquisition after this instant is rejected."
      - name: depreciable_basis_cents
        type: integer
        source: computed
        description: "Depreciable (improvement) basis: round_half_up(purchase_price_cents * LAND_EXCLUSION_COMPLEMENT). See calculations.property_depreciable_basis."
      - name: acquired_at
        type: datetime
        source: computed
        description: "Logical-clock instant at which the property was acquired; null until acquisition."
      - name: status
        type: enum
        source: computed
        description: "Acquisition lifecycle state."
        default: "UNDER_CONTRACT"
        constraints: "one of UNDER_CONTRACT, ACQUIRED, CONTRACT_EXPIRED, DISPOSED"

  - name: DstTrust
    parent: Property
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the single replacement property this Delaware statutory trust will hold."
      - name: trust_name
        type: string
        source: input
        description: "Legal name of the statutory trust."
      - name: total_units
        type: integer
        source: input
        description: "Maximum beneficial-interest units the trust agreement authorises."
        constraints: ">= 1"
      - name: units_issued
        type: integer
        source: computed
        description: "Count of units carried by Subscription rows in status CLOSED. Denominator of every per-unit allocation."
        default: 0
      - name: reserve_floor_cents
        type: integer
        source: input
        description: "Hard floor the reserve bucket may not drop below; a draw that would breach it flips posture to RESTRICTED."
        constraints: ">= 0"
      - name: reserve_target_pct
        type: number
        source: input
        description: "Target reserve as a fraction of Property.purchase_price_cents, 4 decimal places; reported in the investor report."
        constraints: "0.0000 <= reserve_target_pct <= 1.0000"
      - name: reserve_balance_cents
        type: integer
        source: computed
        description: "Sum of TrustLedgerEntry.amount_cents where bucket == RESERVE and the entry is not reversed."
        default: 0
      - name: operating_balance_cents
        type: integer
        source: computed
        description: "Sum of TrustLedgerEntry.amount_cents where bucket == OPERATING and the entry is not reversed."
        default: 0
      - name: equity_raised_cents
        type: integer
        source: computed
        description: "Sum of Subscription.investment_amount_cents over subscriptions in status CLOSED."
        default: 0
      - name: property_acquired_at
        type: datetime
        source: computed
        description: "Mirror of Property.acquired_at for the property named by property_id; the start of the trust's depreciation holding period."
      - name: springing_llc_armed
        type: boolean
        source: computed
        description: "True once the trust has entered WINDING_DOWN with exit_mode SECTION_721_CONVERSION, arming the springing-LLC conversion."
        default: false
      - name: status
        type: enum
        source: computed
        description: "Trust lifecycle state."
        default: "FORMING"
        constraints: "one of FORMING, FUNDING, OPERATING, WINDING_DOWN, TERMINATED, CONVERTED_LLC"
      - name: posture
        type: enum
        source: computed
        description: "Derived gate over all child operations: FROZEN > RESTRICTED > OPEN. See calculations.trust_posture."
        default: "OPEN"
        constraints: "one of OPEN, RESTRICTED, FROZEN"

  - name: Offering
    parent: DstTrust
    common_fields: true
    fields:
      - name: trust_id
        type: string
        source: input
        description: "FK -> DstTrust.id; the trust whose units this offering sells."
      - name: exemption_rule
        type: enum
        source: input
        description: "Securities exemption the offering relies on; constrains which accreditation methods are acceptable."
        constraints: "one of RULE_506B, RULE_506C"
      - name: unit_price_cents
        type: integer
        source: input
        description: "Price of one beneficial-interest unit in cents."
        constraints: ">= 1"
      - name: min_units_per_investor
        type: integer
        source: input
        description: "Minimum units a single subscription must request."
        constraints: ">= 1"
      - name: load_pct
        type: number
        source: input
        description: "Sponsor load as a fraction of gross equity, 4 decimal places; grossed up circularly in calculations.offering_capital_stack_grossup."
        constraints: "0.0000 <= load_pct < 1.0000"
      - name: closing_costs_cents
        type: integer
        source: input
        description: "Third-party acquisition closing costs in cents."
        constraints: ">= 0"
      - name: reserve_funding_pct
        type: number
        source: input
        description: "Initial reserve funded at closing as a fraction of Property.purchase_price_cents, 4 decimal places."
        constraints: "0.0000 <= reserve_funding_pct <= 1.0000"
      - name: rescission_window_days
        type: integer
        source: input
        description: "Days after a subscription closes during which the investor may still rescind (inclusive of the boundary instant)."
        constraints: ">= 0"
      - name: initial_reserve_cents
        type: integer
        source: computed
        description: "Reserve dollars to fund at closing. See calculations.offering_capital_stack_grossup."
      - name: target_equity_cents
        type: integer
        source: computed
        description: "Gross equity the offering must raise, grossed up for the sponsor load. See calculations.offering_capital_stack_grossup."
      - name: sponsor_load_cents
        type: integer
        source: computed
        description: "target_equity_cents - base_need_cents; the load implied by the gross-up, never load_pct * target_equity_cents."
      - name: units_committed
        type: integer
        source: computed
        description: "Sum of Subscription.units_requested over subscriptions in status IN {RESERVED, CLOSED}."
        default: 0
      - name: equity_committed_cents
        type: integer
        source: computed
        description: "Sum of Subscription.investment_amount_cents over subscriptions in status IN {RESERVED, CLOSED}."
        default: 0
      - name: ppm_submitted_by_user_id
        type: string
        source: computed
        description: "Opaque X-User-ID of the SponsorPrincipal who last submitted the PPM for review; compared against the acting ComplianceOfficer for segregation of duties."
      - name: ppm_version
        type: integer
        source: computed
        description: "Private-placement-memorandum revision counter; starts at 1 and increments by 1 on every return-to-DRAFT and every amendment."
        default: 1
      - name: effective_at
        type: datetime
        source: computed
        description: "Logical-clock instant the ComplianceOfficer declared the offering effective; null before that."
      - name: status
        type: enum
        source: computed
        description: "Offering lifecycle state; the DRAFT <-> UNDER_REVIEW loop is the PPM revision cycle."
        default: "DRAFT"
        constraints: "one of DRAFT, UNDER_REVIEW, EFFECTIVE, CLOSED, WITHDRAWN"

  - name: Investor
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Legal name of the subscribing investor."
      - name: entity_type
        type: enum
        source: input
        description: "Legal form of the investor; selects the liquid-net-worth concentration cap band."
        constraints: "one of INDIVIDUAL, JOINT, IRA, LLC, REVOCABLE_TRUST"
      - name: accreditation_method
        type: enum
        source: input
        description: "How accreditation is established; RULE_506C offerings require THIRD_PARTY_LETTER."
        constraints: "one of SELF_CERT_INCOME, SELF_CERT_NET_WORTH, THIRD_PARTY_LETTER"
      - name: annual_income_cents
        type: integer
        source: input
        description: "Represented annual income in cents."
        constraints: ">= 0"
      - name: net_worth_cents
        type: integer
        source: input
        description: "Represented net worth in cents."
        constraints: ">= 0"
      - name: liquid_net_worth_cents
        type: integer
        source: input
        description: "Represented liquid net worth in cents."
        constraints: ">= 0"
      - name: accreditation_status
        type: enum
        source: computed
        description: "First of two independent status dimensions on this entity."
        default: "UNVERIFIED"
        constraints: "one of UNVERIFIED, VERIFIED, EXPIRED"
      - name: accreditation_verified_at
        type: datetime
        source: computed
        description: "Logical-clock instant of accreditation verification; null while UNVERIFIED."
      - name: accreditation_expires_at
        type: datetime
        source: computed
        description: "accreditation_verified_at + ACCREDITATION_VALID_DAYS days; a subscription close at or after this instant is rejected."
      - name: suitability_status
        type: enum
        source: computed
        description: "Second, independent status dimension; evolves without touching accreditation_status."
        default: "NOT_REVIEWED"
        constraints: "one of NOT_REVIEWED, APPROVED, DECLINED"
      - name: suitability_cap_cents
        type: integer
        source: computed
        description: "Maximum cents this investor may commit to the offering named by suitability_offering_id. See calculations.investor_suitability_cap."
      - name: suitability_offering_id
        type: string
        source: computed
        description: "FK -> Offering.id; the offering the suitability review was scoped to. A subscription to any other offering is rejected."
      - name: suitability_reviewed_by_user_id
        type: string
        source: computed
        description: "Opaque X-User-ID of the ComplianceOfficer who performed the suitability review; compared against the closing SponsorPrincipal for segregation of duties."

  - name: ExchangeFile
    parent: Investor
    common_fields: true
    fields:
      - name: investor_id
        type: string
        source: input
        description: "FK -> Investor.id; the taxpayer running this 1031 exchange."
      - name: source_exit_event_id
        type: string
        source: computed
        description: "FK -> ExitEvent.id; set only on a successor file seeded by an exit close, null on an original file."
      - name: qi_reference
        type: string
        source: input
        description: "Qualified-intermediary file reference string."
      - name: relinquished_closed_on
        type: datetime
        source: input
        description: "Instant the relinquished property sale closed; day 0 of both exchange clocks."
      - name: relinquished_sale_price_cents
        type: integer
        source: input
        description: "Gross sale price of the relinquished property in cents; basis of the 200%-rule capacity test."
        constraints: ">= 1"
      - name: net_proceeds_cents
        type: integer
        source: input
        description: "Exchange proceeds held by the qualified intermediary in cents."
        constraints: ">= 0"
      - name: debt_retired_cents
        type: integer
        source: input
        description: "Debt discharged on the relinquished property in cents; part of the boot computation."
        constraints: ">= 0"
      - name: identification_rule
        type: enum
        source: input
        description: "Identification regime elected for this file."
        constraints: "one of THREE_PROPERTY, TWO_HUNDRED_PCT"
      - name: boot_tolerance_cents
        type: integer
        source: input
        description: "Cents of boot the investor will tolerate on a subscription; a subscription whose boot exceeds it is rejected."
        default: 0
        constraints: ">= 0"
      - name: identification_deadline
        type: datetime
        source: computed
        description: "relinquished_closed_on + IDENTIFICATION_DAYS days, snapped to 23:59:59.999Z. See calculations.exchange_file_deadlines."
      - name: exchange_deadline
        type: datetime
        source: computed
        description: "relinquished_closed_on + EXCHANGE_DAYS days, snapped to 23:59:59.999Z. See calculations.exchange_file_deadlines."
      - name: status
        type: enum
        source: computed
        description: "Exchange file lifecycle state."
        default: "OPEN"
        constraints: "one of OPEN, IDENTIFIED, CLOSED_MATCHED, EXPIRED"

  - name: PropertyIdentification
    parent: ExchangeFile
    common_fields: true
    fields:
      - name: exchange_file_id
        type: string
        source: input
        description: "FK -> ExchangeFile.id; the file this identification is filed under."
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the replacement property being identified."
      - name: fair_market_value_cents
        type: integer
        source: input
        description: "FMV attributed to the identified property in cents; summed for the 200%-rule test."
        constraints: ">= 1"
      - name: identified_at
        type: datetime
        source: computed
        description: "Logical-clock instant of filing; must be <= ExchangeFile.identification_deadline."
      - name: sequence_no
        type: integer
        source: computed
        description: "1-based ordinal within the exchange file, assigned in identified_at ASC order (tie-break created_at ASC)."
      - name: status
        type: enum
        source: computed
        description: "Identification state; only ACTIVE rows count toward the identification-rule capacity test."
        default: "ACTIVE"
        constraints: "one of ACTIVE, REVOKED"

  - name: Subscription
    parent: Offering
    common_fields: true
    fields:
      - name: offering_id
        type: string
        source: input
        description: "FK -> Offering.id; the offering being subscribed to."
      - name: investor_id
        type: string
        source: input
        description: "FK -> Investor.id; the subscribing investor."
      - name: exchange_file_id
        type: string
        source: input
        description: "FK -> ExchangeFile.id; the exchange file this subscription completes."
      - name: units_requested
        type: integer
        source: input
        description: "Units subscribed for."
        constraints: ">= 1"
      - name: investment_amount_cents
        type: integer
        source: computed
        description: "units_requested * Offering.unit_price_cents."
      - name: boot_cents
        type: integer
        source: computed
        description: "Taxable boot left on the table. See calculations.subscription_boot."
      - name: closing_sequence_no
        type: integer
        source: computed
        description: "1-based closing ordinal within the offering, assigned in closed_at ASC order (tie-break created_at ASC); the residual-cent tie-break key."
      - name: closed_at
        type: datetime
        source: computed
        description: "Logical-clock instant the subscription closed; null until CLOSED."
      - name: rescission_deadline
        type: datetime
        source: computed
        description: "closed_at + Offering.rescission_window_days days; rescission at exactly this instant is still allowed."
      - name: status
        type: enum
        source: computed
        description: "Subscription lifecycle state."
        default: "RESERVED"
        constraints: "one of RESERVED, REVISION_REQUIRED, CLOSED, RESCINDED, REJECTED"

  - name: LoanFacility
    parent: DstTrust
    common_fields: true
    fields:
      - name: trust_id
        type: string
        source: input
        description: "FK -> DstTrust.id; the borrowing trust."
      - name: lender_name
        type: string
        source: input
        description: "Name of the lender."
      - name: principal_cents
        type: integer
        source: input
        description: "Committed principal in cents."
        constraints: ">= 1"
      - name: rate_bps
        type: integer
        source: input
        description: "Fixed interest rate in basis points."
        constraints: ">= 0"
      - name: recourse_type
        type: enum
        source: input
        description: "Recourse posture; RECOURSE is prohibited at the trust level."
        constraints: "one of NON_RECOURSE, RECOURSE"
      - name: maturity_on
        type: datetime
        source: input
        description: "Maturity date of the facility."
      - name: ltv_pct
        type: number
        source: computed
        description: "Reported loan-to-value, 4 decimal places. See calculations.loan_ltv_check."
      - name: dscr
        type: number
        source: computed
        description: "Debt-service coverage ratio, 4 decimal places. See calculations.loan_dscr."
      - name: repriced_count
        type: integer
        source: computed
        description: "Number of pre-closing repricings applied to this facility."
        default: 0
      - name: funded_at
        type: datetime
        source: computed
        description: "Logical-clock instant the loan funded; null until FUNDED."
      - name: status
        type: enum
        source: computed
        description: "Facility lifecycle state."
        default: "COMMITTED"
        constraints: "one of COMMITTED, FUNDED, PAID_OFF"

  - name: MasterLease
    parent: DstTrust
    common_fields: true
    fields:
      - name: trust_id
        type: string
        source: input
        description: "FK -> DstTrust.id; the landlord trust."
      - name: master_tenant_user_id
        type: string
        source: input
        description: "Opaque MasterTenant operator id (X-User-ID of the MasterTenant role); never equal to any entity id."
      - name: term_start_on
        type: datetime
        source: input
        description: "First day of the lease term (inclusive)."
      - name: term_end_on
        type: datetime
        source: input
        description: "Last day of the lease term (inclusive) — closed interval, so a shared endpoint day collides."
      - name: base_rent_annual_cents
        type: integer
        source: input
        description: "Annual base rent in cents, accrued on a 365-day basis."
        constraints: ">= 0"
      - name: supplemental_rent_annual_cents
        type: integer
        source: input
        description: "Annual supplemental (percentage) rent in cents, accrued on a 365-day basis."
        constraints: ">= 0"
      - name: executed_at
        type: datetime
        source: computed
        description: "Logical-clock instant the lease was executed; null until EXECUTED."
      - name: status
        type: enum
        source: computed
        description: "Lease lifecycle state."
        default: "DRAFT"
        constraints: "one of DRAFT, EXECUTED, TERMINATED"

  - name: TrustLedgerEntry
    parent: DstTrust
    common_fields: false
    fields:
      - name: trust_id
        type: string
        source: input
        description: "FK -> DstTrust.id; the trust whose books this entry hits."
      - name: reversal_of_entry_id
        type: string
        source: computed
        description: "FK -> TrustLedgerEntry.id; self-reference set only on entry_type REVERSAL, null otherwise."
      - name: entry_type
        type: enum
        source: computed
        description: "Nature of the booking."
        constraints: "one of EQUITY_CONTRIBUTION, LOAN_PROCEEDS, ACQUISITION_PAYMENT, SPONSOR_LOAD, RESERVE_FUNDING, RESERVE_DRAW, RENT_RECEIPT, DEBT_SERVICE, DISTRIBUTION_PAYMENT, SALE_PROCEEDS, LOAN_PAYOFF, REVERSAL"
      - name: bucket
        type: enum
        source: computed
        description: "Which trust cash bucket the entry moves."
        constraints: "one of OPERATING, RESERVE"
      - name: amount_cents
        type: integer
        source: computed
        description: "Signed cents; positive credits the bucket, negative debits it."
      - name: occurred_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the booking; the chronological replay key for balances."
      - name: memo
        type: string
        source: computed
        description: "Human-readable provenance note, e.g. 'reserve draw for capital need'."
      - name: source_kind
        type: enum
        source: computed
        description: "Which workflow produced the entry (provenance label only, never an FK)."
        constraints: "one of SUBSCRIPTION_CLOSE, LOAN_FUNDING, ACQUISITION, RENT_POSTING, DEBT_SERVICE_POSTING, CAPITAL_NEED, DISTRIBUTION, EXIT, REVERSAL"

  - name: CapitalNeed
    parent: DstTrust
    common_fields: true
    fields:
      - name: trust_id
        type: string
        source: input
        description: "FK -> DstTrust.id; the trust that owns the capital need."
      - name: need_type
        type: enum
        source: input
        description: "Nature of the capital need; STRUCTURAL_CAPEX may not be funded from trust reserves."
        constraints: "one of NORMAL_REPAIR, TENANT_IMPROVEMENT, STRUCTURAL_CAPEX"
      - name: amount_cents
        type: integer
        source: input
        description: "Cost of the capital need in cents."
        constraints: ">= 1"
      - name: needed_by
        type: datetime
        source: input
        description: "Date the work must be funded by."
      - name: funding_source
        type: enum
        source: computed
        description: "Where the funding came from; CAPITAL_CALL is never a persistable value because the request is rejected."
        constraints: "one of RESERVE, MASTER_TENANT"
      - name: funded_at
        type: datetime
        source: computed
        description: "Logical-clock instant of funding; null until FUNDED."
      - name: status
        type: enum
        source: computed
        description: "Capital need lifecycle state."
        default: "IDENTIFIED"
        constraints: "one of IDENTIFIED, FUNDED, VOIDED"

  - name: Distribution
    parent: DstTrust
    common_fields: true
    fields:
      - name: trust_id
        type: string
        source: input
        description: "FK -> DstTrust.id; the distributing trust."
      - name: kind
        type: enum
        source: input
        description: "OPERATING distributions are posture-gated; LIQUIDATING distributions are exempt from posture gating."
        constraints: "one of OPERATING, LIQUIDATING"
      - name: period_start
        type: datetime
        source: input
        description: "Start of the distribution period, INCLUSIVE."
      - name: period_end
        type: datetime
        source: input
        description: "End of the distribution period, EXCLUSIVE — half-open, so adjacent periods sharing an instant do not overlap."
      - name: provisional_amount_cents
        type: integer
        source: computed
        description: "Amount under variant PROVISIONAL_ACCRUAL, computed at declaration. See calculations.distribution_distributable."
      - name: final_amount_cents
        type: integer
        source: computed
        description: "Amount under variant FINAL_CASH, computed at payment; null until PAID."
      - name: reconciliation_delta_cents
        type: integer
        source: computed
        description: "final_amount_cents - provisional_amount_cents; null until PAID."
      - name: declared_at
        type: datetime
        source: computed
        description: "Logical-clock instant of declaration."
      - name: paid_at
        type: datetime
        source: computed
        description: "Logical-clock instant of payment; null until PAID."
      - name: status
        type: enum
        source: computed
        description: "Distribution lifecycle state."
        default: "DECLARED"
        constraints: "one of DECLARED, PAID, VOIDED"

  - name: DistributionAllocation
    parent: Distribution
    common_fields: false
    fields:
      - name: distribution_id
        type: string
        source: computed
        description: "FK -> Distribution.id; the distribution being split."
      - name: subscription_id
        type: string
        source: computed
        description: "FK -> Subscription.id; the CLOSED subscription receiving the split."
      - name: units
        type: integer
        source: computed
        description: "Subscription.units_requested snapshotted at payment time."
      - name: raw_share_cents
        type: number
        source: computed
        description: "Unrounded pro-rata share, 4 decimal places, before the residual sweep."
      - name: allocated_cents
        type: integer
        source: computed
        description: "Final integer cents paid to this subscription, after rounding and the residual sweep."
      - name: residual_adjustment_cents
        type: integer
        source: computed
        description: "Cents added (+1) or removed (-1) by the residual sweep; 0 when this row was not swept."

  - name: TaxStatement
    parent: DstTrust
    common_fields: true
    fields:
      - name: trust_id
        type: string
        source: input
        description: "FK -> DstTrust.id; the grantor trust reporting the items."
      - name: subscription_id
        type: string
        source: input
        description: "FK -> Subscription.id; the CLOSED subscription whose beneficial owner is being reported to."
      - name: tax_year
        type: integer
        source: input
        description: "Calendar tax year being reported."
        constraints: ">= 2026"
      - name: allocation_variant
        type: enum
        source: input
        description: "Which allocation convention to apply; the two conventions produce different numbers for identical data."
        constraints: "one of UNITS_AT_YEAR_END, UNIT_DAYS_WEIGHTED"
      - name: rental_income_cents
        type: integer
        source: computed
        description: "Investor's share of trust rental income. See calculations.tax_statement_allocation."
      - name: interest_expense_cents
        type: integer
        source: computed
        description: "Investor's share of trust interest expense. See calculations.tax_statement_allocation."
      - name: depreciation_cents
        type: integer
        source: computed
        description: "Investor's share of trust depreciation. See calculations.tax_statement_allocation."
      - name: net_taxable_income_cents
        type: integer
        source: computed
        description: "rental_income_cents - interest_expense_cents - depreciation_cents."
      - name: issued_at
        type: datetime
        source: computed
        description: "Logical-clock instant the statement was issued; null while DRAFT."
      - name: status
        type: enum
        source: computed
        description: "Statement lifecycle state."
        default: "DRAFT"
        constraints: "one of DRAFT, ISSUED"

  - name: ExitEvent
    parent: DstTrust
    common_fields: true
    fields:
      - name: trust_id
        type: string
        source: input
        description: "FK -> DstTrust.id; the trust being exited."
      - name: exit_mode
        type: enum
        source: input
        description: "ASSET_SALE nets selling costs and loan payoff; SECTION_721_CONVERSION contributes the asset subject to the debt."
        constraints: "one of ASSET_SALE, SECTION_721_CONVERSION"
      - name: gross_price_cents
        type: integer
        source: input
        description: "Gross sale price or contribution value in cents."
        constraints: ">= 1"
      - name: selling_costs_cents
        type: integer
        source: input
        description: "Transaction costs in cents."
        constraints: ">= 0"
      - name: consent_threshold_pct
        type: number
        source: input
        description: "Fraction of DstTrust.units_issued that must consent, 4 decimal places; the tally test is >= this fraction."
        constraints: "0.0001 <= consent_threshold_pct <= 1.0000"
      - name: expected_close_on
        type: datetime
        source: input
        description: "Target closing date of the exit."
      - name: consented_units
        type: integer
        source: computed
        description: "Sum of ExitConsent.units_at_consent where decision == CONSENT."
        default: 0
      - name: consent_pct
        type: number
        source: computed
        description: "Reported consent fraction, 4 decimal places. See calculations.exit_consent_tally."
      - name: net_proceeds_cents
        type: integer
        source: computed
        description: "Distributable exit proceeds. See calculations.exit_net_proceeds."
      - name: net_proceeds_per_unit_cents
        type: integer
        source: computed
        description: "floor(net_proceeds_cents / DstTrust.units_issued); reported only, never the allocation basis."
      - name: closed_at
        type: datetime
        source: computed
        description: "Logical-clock instant the exit closed; null until CLOSED."
      - name: status
        type: enum
        source: computed
        description: "Exit lifecycle state."
        default: "PROPOSED"
        constraints: "one of PROPOSED, APPROVED, CLOSED, ABANDONED"

  - name: ExitConsent
    parent: ExitEvent
    common_fields: false
    fields:
      - name: exit_event_id
        type: string
        source: input
        description: "FK -> ExitEvent.id; the exit being voted on."
      - name: subscription_id
        type: string
        source: input
        description: "FK -> Subscription.id; the CLOSED subscription casting the vote."
      - name: decision
        type: enum
        source: input
        description: "Vote cast by the beneficial owner."
        constraints: "one of CONSENT, WITHHOLD"
      - name: units_at_consent
        type: integer
        source: computed
        description: "Subscription.units_requested snapshotted when the vote was recorded."
      - name: recorded_at
        type: datetime
        source: computed
        description: "Logical-clock instant the vote was recorded."

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: Property
    initial_state: UNDER_CONTRACT
    terminal_states: [CONTRACT_EXPIRED, DISPOSED]
    transitions:
      - from: UNDER_CONTRACT
        to: ACQUIRED
        trigger: "POST /properties/{property_id}/acquire"
        actor: SponsorPrincipal
        preconditions:
          - "Property.status == UNDER_CONTRACT"
          - "logical clock now <= Property.contract_close_deadline"
        side_effects:
          - "sets Property.acquired_at = logical clock now"
          - "computes Property.depreciable_basis_cents per calculations.property_depreciable_basis"
      - from: UNDER_CONTRACT
        to: CONTRACT_EXPIRED
        trigger: "POST /properties/{property_id}/expire-contract"
        actor: SponsorPrincipal
        preconditions:
          - "Property.status == UNDER_CONTRACT"
          - "logical clock now > Property.contract_close_deadline"
        side_effects:
          - "for every DstTrust whose property_id is this property and whose status IN {FORMING, FUNDING}: recomputes DstTrust.posture, which becomes FROZEN per calculations.trust_posture"
      - from: ACQUIRED
        to: DISPOSED
        trigger: "system event: ExitEvent APPROVED_to_CLOSED cascade"
        actor: system
        preconditions:
          - "Property.status == ACQUIRED"
          - "the trust holding this property has an ExitEvent in status APPROVED being closed"
        side_effects:
          - "sets Property.status = DISPOSED for both exit_mode values"

  - entity: DstTrust
    initial_state: FORMING
    terminal_states: [TERMINATED, CONVERTED_LLC]
    transitions:
      - from: FORMING
        to: FUNDING
        trigger: "POST /trusts/{trust_id}/open-funding"
        actor: Trustee
        preconditions:
          - "DstTrust.status == FORMING"
          - "DstTrust.posture == OPEN"
          - "Property.status == ACQUIRED for DstTrust.property_id"
          - "exactly one Offering exists on this trust with status == EFFECTIVE"
          - "exactly one LoanFacility exists on this trust with status IN {COMMITTED, FUNDED}"
        side_effects:
          - "sets DstTrust.property_acquired_at = Property.acquired_at"
      - from: FUNDING
        to: OPERATING
        trigger: "system event: Subscription RESERVED_to_CLOSED cascade hop 2 (equity_raised_cents reached target_equity_cents)"
        actor: system
        preconditions:
          - "DstTrust.status == FUNDING"
          - "DstTrust.equity_raised_cents >= Offering.target_equity_cents for the trust's EFFECTIVE offering"
          - "the trust's LoanFacility.status == FUNDED"
          - "a MasterLease on this trust is in status EXECUTED"
        side_effects:
          - "books TrustLedgerEntry SPONSOR_LOAD, bucket OPERATING, amount_cents = -Offering.sponsor_load_cents, source_kind SUBSCRIPTION_CLOSE"
          - "books TrustLedgerEntry ACQUISITION_PAYMENT, bucket OPERATING, amount_cents = -(Property.purchase_price_cents + Offering.closing_costs_cents), source_kind ACQUISITION"
          - "books the reserve funding as TWO legs: TrustLedgerEntry RESERVE_FUNDING bucket OPERATING amount_cents = -Offering.initial_reserve_cents, and TrustLedgerEntry RESERVE_FUNDING bucket RESERVE amount_cents = +Offering.initial_reserve_cents, both source_kind ACQUISITION"
          - "recomputes DstTrust.operating_balance_cents and DstTrust.reserve_balance_cents"
          - "recomputes DstTrust.posture per calculations.trust_posture"
          - "cascade hop 3: because this trust reached OPERATING, its EFFECTIVE Offering transitions to CLOSED"
      - from: OPERATING
        to: WINDING_DOWN
        trigger: "POST /exit-events/{exit_event_id}/tally-consents (consent threshold met)"
        actor: system
        preconditions:
          - "DstTrust.status == OPERATING"
          - "ExitEvent.status == PROPOSED and the tally meets ExitEvent.consent_threshold_pct"
        side_effects:
          - "sets DstTrust.springing_llc_armed = true when ExitEvent.exit_mode == SECTION_721_CONVERSION, false otherwise"
          - "recomputes DstTrust.posture, which becomes FROZEN because an APPROVED ExitEvent now exists"
      - from: WINDING_DOWN
        to: TERMINATED
        trigger: "POST /exit-events/{exit_event_id}/close with exit_mode ASSET_SALE"
        actor: Trustee
        preconditions:
          - "DstTrust.status == WINDING_DOWN"
          - "ExitEvent.status == APPROVED"
          - "ExitEvent.exit_mode == ASSET_SALE"
        side_effects:
          - "books SALE_PROCEEDS and LOAN_PAYOFF ledger entries; see ExitEvent APPROVED_to_CLOSED"
      - from: WINDING_DOWN
        to: CONVERTED_LLC
        trigger: "POST /exit-events/{exit_event_id}/close with exit_mode SECTION_721_CONVERSION"
        actor: Trustee
        preconditions:
          - "DstTrust.status == WINDING_DOWN"
          - "ExitEvent.status == APPROVED"
          - "ExitEvent.exit_mode == SECTION_721_CONVERSION"
          - "DstTrust.springing_llc_armed == true"
        side_effects:
          - "books SALE_PROCEEDS ledger entry only; the loan travels with the asset and LoanFacility moves to PAID_OFF"

  - entity: Offering
    initial_state: DRAFT
    terminal_states: [CLOSED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /offerings/{offering_id}/submit-ppm"
        actor: SponsorPrincipal
        preconditions:
          - "Offering.status == DRAFT"
          - "DstTrust.posture != FROZEN"
        side_effects:
          - "records the submitting SponsorPrincipal X-User-ID for the segregation-of-duties check on declare-effective"
      - from: UNDER_REVIEW
        to: DRAFT
        trigger: "POST /offerings/{offering_id}/return-ppm"
        actor: ComplianceOfficer
        note: "Revision loop: this is the cyclic edge (DRAFT -> UNDER_REVIEW -> DRAFT) that makes the machine non-linear."
        preconditions:
          - "Offering.status == UNDER_REVIEW"
        side_effects:
          - "increments Offering.ppm_version by 1"
      - from: UNDER_REVIEW
        to: EFFECTIVE
        trigger: "POST /offerings/{offering_id}/declare-effective"
        actor: ComplianceOfficer
        preconditions:
          - "Offering.status == UNDER_REVIEW"
          - "the acting ComplianceOfficer X-User-ID differs from the SponsorPrincipal X-User-ID that submitted the PPM"
          - "the request's acknowledged_ppm_version equals Offering.ppm_version"
        side_effects:
          - "sets Offering.effective_at = logical clock now"
          - "computes Offering.initial_reserve_cents, target_equity_cents and sponsor_load_cents per calculations.offering_capital_stack_grossup"
      - from: EFFECTIVE
        to: DRAFT
        trigger: "system event: LoanFacility reprice cascade hop 2"
        actor: system
        preconditions:
          - "Offering.status == EFFECTIVE"
          - "the trust's LoanFacility was repriced while DstTrust.status == FUNDING"
        side_effects:
          - "increments Offering.ppm_version by 1"
          - "recomputes Offering.initial_reserve_cents, target_equity_cents and sponsor_load_cents from the new LoanFacility.principal_cents"
          - "cascade hop 3: because this offering returned to DRAFT, every Subscription on it in status RESERVED transitions to REVISION_REQUIRED"
      - from: EFFECTIVE
        to: CLOSED
        trigger: "system event: DstTrust FUNDING_to_OPERATING cascade hop 3"
        actor: system
        preconditions:
          - "Offering.status == EFFECTIVE"
          - "the trust named by Offering.trust_id has just reached status OPERATING"
        side_effects:
          - "cascade hop 4: because this offering is now CLOSED, every Subscription on it still in status RESERVED transitions to REJECTED"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /offerings/{offering_id}/withdraw"
        actor: ComplianceOfficer
        preconditions:
          - "Offering.status == DRAFT"
        side_effects:
          - "every Subscription on this offering in status IN {RESERVED, REVISION_REQUIRED} transitions to REJECTED"
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /offerings/{offering_id}/withdraw"
        actor: ComplianceOfficer
        preconditions:
          - "Offering.status == UNDER_REVIEW"
        side_effects:
          - "every Subscription on this offering in status IN {RESERVED, REVISION_REQUIRED} transitions to REJECTED"

  - entity: Investor
    initial_state: UNVERIFIED
    terminal_states: []
    note: |
      Parallel state dimensions on one row. Dimension A is accreditation_status
      (UNVERIFIED -> VERIFIED -> EXPIRED); dimension B is suitability_status
      (NOT_REVIEWED -> APPROVED | DECLINED). The two dimensions advance
      independently: verifying accreditation never touches suitability_status, and
      a suitability review never touches accreditation_status. initial_state names
      dimension A's initial value; dimension B starts at NOT_REVIEWED.
    transitions:
      - from: UNVERIFIED
        to: VERIFIED
        trigger: "POST /investors/{investor_id}/verify-accreditation (dimension A)"
        actor: ComplianceOfficer
        preconditions:
          - "Investor.accreditation_status == UNVERIFIED"
        side_effects:
          - "sets Investor.accreditation_verified_at = logical clock now"
          - "sets Investor.accreditation_expires_at = accreditation_verified_at + ACCREDITATION_VALID_DAYS days"
          - "leaves Investor.suitability_status unchanged"
      - from: VERIFIED
        to: EXPIRED
        trigger: "POST /investors/{investor_id}/lapse-accreditation (dimension A)"
        actor: ComplianceOfficer
        preconditions:
          - "Investor.accreditation_status == VERIFIED"
          - "logical clock now >= Investor.accreditation_expires_at"
        side_effects:
          - "leaves Investor.suitability_status and Investor.suitability_cap_cents unchanged"
      - from: NOT_REVIEWED
        to: APPROVED
        trigger: "POST /investors/{investor_id}/review-suitability with decision APPROVED (dimension B)"
        actor: ComplianceOfficer
        preconditions:
          - "Investor.suitability_status == NOT_REVIEWED"
        side_effects:
          - "computes Investor.suitability_cap_cents per calculations.investor_suitability_cap"
          - "leaves Investor.accreditation_status unchanged"
      - from: NOT_REVIEWED
        to: DECLINED
        trigger: "POST /investors/{investor_id}/review-suitability with decision DECLINED (dimension B)"
        actor: ComplianceOfficer
        preconditions:
          - "Investor.suitability_status == NOT_REVIEWED"
        side_effects:
          - "sets Investor.suitability_cap_cents = 0"
          - "leaves Investor.accreditation_status unchanged"

  - entity: ExchangeFile
    initial_state: OPEN
    terminal_states: [CLOSED_MATCHED, EXPIRED]
    transitions:
      - from: OPEN
        to: IDENTIFIED
        trigger: "system event: first ACTIVE PropertyIdentification filed on this file"
        actor: system
        preconditions:
          - "ExchangeFile.status == OPEN"
          - "logical clock now <= ExchangeFile.identification_deadline"
        side_effects:
          - "assigns PropertyIdentification.sequence_no = 1"
      - from: IDENTIFIED
        to: OPEN
        trigger: "system event: last ACTIVE PropertyIdentification on this file revoked"
        actor: system
        note: "Revision loop on the exchange file: identification can be unwound while the 45-day window is still open."
        preconditions:
          - "ExchangeFile.status == IDENTIFIED"
          - "count of PropertyIdentification rows on this file with status == ACTIVE drops to 0"
        side_effects:
          - "no ledger or deadline change; identification_deadline is NOT extended"
      - from: IDENTIFIED
        to: CLOSED_MATCHED
        trigger: "system event: Subscription RESERVED_to_CLOSED cascade hop 1"
        actor: system
        preconditions:
          - "ExchangeFile.status == IDENTIFIED"
          - "logical clock now <= ExchangeFile.exchange_deadline"
        side_effects:
          - "no further identifications may be filed on this file"
      - from: OPEN
        to: EXPIRED
        trigger: "POST /exchange-files/{exchange_file_id}/mark-expired"
        actor: QualifiedIntermediary
        preconditions:
          - "ExchangeFile.status == OPEN"
          - "logical clock now > ExchangeFile.identification_deadline"
        side_effects:
          - "every Subscription on this file in status IN {RESERVED, REVISION_REQUIRED} transitions to REJECTED"
      - from: IDENTIFIED
        to: EXPIRED
        trigger: "POST /exchange-files/{exchange_file_id}/mark-expired"
        actor: QualifiedIntermediary
        preconditions:
          - "ExchangeFile.status == IDENTIFIED"
          - "logical clock now > ExchangeFile.exchange_deadline"
        side_effects:
          - "every Subscription on this file in status IN {RESERVED, REVISION_REQUIRED} transitions to REJECTED"

  - entity: PropertyIdentification
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /property-identifications/{identification_id}/revoke"
        actor: QualifiedIntermediary
        preconditions:
          - "PropertyIdentification.status == ACTIVE"
          - "ExchangeFile.status == IDENTIFIED"
          - "logical clock now <= ExchangeFile.identification_deadline"
        side_effects:
          - "removes this row from the identification-rule capacity input set"
          - "when no ACTIVE identification remains on the file, the ExchangeFile transitions IDENTIFIED -> OPEN"

  - entity: Subscription
    initial_state: RESERVED
    terminal_states: [CLOSED, RESCINDED, REJECTED]
    transitions:
      - from: RESERVED
        to: CLOSED
        trigger: "POST /subscriptions/{subscription_id}/close"
        actor: SponsorPrincipal
        preconditions:
          - "Subscription.status == RESERVED"
          - "Offering.status == EFFECTIVE"
          - "DstTrust.status == FUNDING and DstTrust.posture != FROZEN"
          - "Investor.accreditation_status == VERIFIED and logical clock now < Investor.accreditation_expires_at"
          - "Investor.suitability_status == APPROVED"
          - "ExchangeFile.status == IDENTIFIED and logical clock now <= ExchangeFile.exchange_deadline"
          - "the acting SponsorPrincipal X-User-ID differs from the ComplianceOfficer X-User-ID that approved the investor's suitability"
        side_effects:
          - "cascade hop 1: sets closed_at, assigns Subscription.closing_sequence_no (next ordinal in closed_at ASC order within the offering), sets rescission_deadline; books TrustLedgerEntry EQUITY_CONTRIBUTION bucket OPERATING amount_cents = +investment_amount_cents source_kind SUBSCRIPTION_CLOSE; recomputes DstTrust.units_issued, DstTrust.equity_raised_cents, DstTrust.operating_balance_cents; transitions the ExchangeFile IDENTIFIED -> CLOSED_MATCHED"
          - "cascade hop 2: because DstTrust.equity_raised_cents now satisfies >= Offering.target_equity_cents, DstTrust transitions FUNDING -> OPERATING (see DstTrust)"
          - "cascade hop 3 (caused by hop 2): the Offering transitions EFFECTIVE -> CLOSED"
          - "cascade hop 4 (caused by hop 3): every other Subscription on that offering still in status RESERVED transitions to REJECTED"
      - from: RESERVED
        to: REVISION_REQUIRED
        trigger: "system event: Offering EFFECTIVE_to_DRAFT cascade hop 3"
        actor: system
        preconditions:
          - "Subscription.status == RESERVED"
          - "the parent Offering has just returned to DRAFT"
        side_effects:
          - "removes this subscription's units from Offering.units_committed and equity_committed_cents"
      - from: RESERVED
        to: REJECTED
        trigger: "POST /subscriptions/{subscription_id}/reject"
        actor: ComplianceOfficer
        preconditions:
          - "Subscription.status == RESERVED"
        side_effects:
          - "removes this subscription's units from Offering.units_committed and equity_committed_cents"
      - from: REVISION_REQUIRED
        to: REJECTED
        trigger: "POST /subscriptions/{subscription_id}/reject"
        actor: ComplianceOfficer
        preconditions:
          - "Subscription.status == REVISION_REQUIRED"
        side_effects:
          - "no ledger effect; the subscription never contributed equity"
      - from: RESERVED
        to: REJECTED
        trigger: "system event: Offering EFFECTIVE_to_CLOSED cascade hop 4, Offering withdrawal, or ExchangeFile expiry"
        actor: system
        preconditions:
          - "Subscription.status == RESERVED"
        side_effects:
          - "removes this subscription's units from Offering.units_committed and equity_committed_cents"
      - from: CLOSED
        to: RESCINDED
        trigger: "POST /subscriptions/{subscription_id}/rescind"
        actor: Investor
        preconditions:
          - "Subscription.status == CLOSED"
          - "logical clock now <= Subscription.rescission_deadline"
          - "the acting Investor X-User-ID equals Subscription.investor_id"
        side_effects:
          - "books a compensating TrustLedgerEntry entry_type REVERSAL, bucket OPERATING, amount_cents = -investment_amount_cents, reversal_of_entry_id = the EQUITY_CONTRIBUTION entry booked at close, source_kind REVERSAL"
          - "recomputes DstTrust.units_issued and DstTrust.equity_raised_cents so that units_issued returns to its pre-close value (compensating invariant: conserved unit count)"
          - "clears Subscription.closing_sequence_no and renumbers the remaining CLOSED subscriptions on the offering in closed_at ASC order"
          - "transitions the ExchangeFile CLOSED_MATCHED -> OPEN when the file's identification_deadline has not passed, otherwise CLOSED_MATCHED -> EXPIRED"

  - entity: LoanFacility
    initial_state: COMMITTED
    terminal_states: [PAID_OFF]
    transitions:
      - from: COMMITTED
        to: COMMITTED
        trigger: "POST /loan-facilities/{loan_id}/reprice"
        actor: Trustee
        note: "Self-loop repricing edge; permitted only while the facility is undrawn. Once the facility is FUNDED (or the trust has left the offering period) the same call is rejected as a prohibited refinancing at validation priority 34, not as an invalid loan state."
        preconditions:
          - "LoanFacility.status == COMMITTED (a FUNDED facility is refused by validations[priority=34] as a prohibited refinancing; only PAID_OFF is refused by validations[priority=17])"
          - "DstTrust.status IN {FORMING, FUNDING}"
          - "the request's recourse_type == NON_RECOURSE"
        side_effects:
          - "cascade hop 1: updates principal_cents and rate_bps, increments repriced_count by 1, recomputes ltv_pct and dscr"
          - "cascade hop 2 (caused by hop 1): the trust's EFFECTIVE Offering transitions EFFECTIVE -> DRAFT and its capital stack is recomputed"
          - "cascade hop 3 (caused by hop 2): every Subscription on that offering in status RESERVED transitions to REVISION_REQUIRED"
      - from: COMMITTED
        to: FUNDED
        trigger: "POST /loan-facilities/{loan_id}/fund"
        actor: Trustee
        preconditions:
          - "LoanFacility.status == COMMITTED"
          - "DstTrust.status == FUNDING"
          - "Property.status == ACQUIRED"
          - "LoanFacility.recourse_type == NON_RECOURSE"
          - "principal_cents * 10000 <= Property.appraised_value_cents * MAX_LTV_BPS"
        side_effects:
          - "sets funded_at = logical clock now"
          - "books TrustLedgerEntry LOAN_PROCEEDS, bucket OPERATING, amount_cents = +principal_cents, source_kind LOAN_FUNDING"
          - "recomputes DstTrust.operating_balance_cents"
      - from: FUNDED
        to: PAID_OFF
        trigger: "system event: ExitEvent APPROVED_to_CLOSED cascade"
        actor: system
        preconditions:
          - "LoanFacility.status == FUNDED"
          - "the trust's ExitEvent is being closed"
        side_effects:
          - "for exit_mode ASSET_SALE books TrustLedgerEntry LOAN_PAYOFF, bucket OPERATING, amount_cents = -principal_cents; for SECTION_721_CONVERSION books no payoff entry because the debt travels with the asset"

  - entity: MasterLease
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: EXECUTED
        trigger: "POST /master-leases/{lease_id}/execute"
        actor: Trustee
        preconditions:
          - "MasterLease.status == DRAFT"
          - "DstTrust.status IN {FORMING, FUNDING}"
          - "DstTrust.posture != FROZEN"
        side_effects:
          - "sets executed_at = logical clock now"
          - "unblocks distribution declaration, which requires an EXECUTED lease on the trust"
      - from: EXECUTED
        to: TERMINATED
        trigger: "POST /master-leases/{lease_id}/terminate"
        actor: Trustee
        preconditions:
          - "MasterLease.status == EXECUTED"
        side_effects:
          - "stops rent accrual for periods beginning at or after the termination instant"

  - entity: CapitalNeed
    initial_state: IDENTIFIED
    terminal_states: [FUNDED, VOIDED]
    transitions:
      - from: IDENTIFIED
        to: FUNDED
        trigger: "POST /capital-needs/{capital_need_id}/fund with funding_source RESERVE"
        actor: Trustee
        preconditions:
          - "CapitalNeed.status == IDENTIFIED"
          - "DstTrust.status == OPERATING and DstTrust.posture == OPEN"
          - "CapitalNeed.need_type != STRUCTURAL_CAPEX"
          - "DstTrust.reserve_balance_cents >= CapitalNeed.amount_cents"
        side_effects:
          - "sets funding_source = RESERVE, funded_at = logical clock now"
          - "books TrustLedgerEntry RESERVE_DRAW, bucket RESERVE, amount_cents = -amount_cents, source_kind CAPITAL_NEED"
          - "recomputes DstTrust.reserve_balance_cents and then DstTrust.posture; posture becomes RESTRICTED when the new balance is below reserve_floor_cents"
      - from: IDENTIFIED
        to: FUNDED
        trigger: "POST /capital-needs/{capital_need_id}/fund with funding_source MASTER_TENANT"
        actor: MasterTenant
        preconditions:
          - "CapitalNeed.status == IDENTIFIED"
          - "DstTrust.status == OPERATING"
          - "an EXECUTED MasterLease exists on the trust whose master_tenant_user_id equals the acting X-User-ID"
        side_effects:
          - "sets funding_source = MASTER_TENANT, funded_at = logical clock now"
          - "books no ledger entry: master-tenant capital is outside the trust's books, so DstTrust.reserve_balance_cents is unchanged"
      - from: FUNDED
        to: VOIDED
        trigger: "POST /capital-needs/{capital_need_id}/void"
        actor: Trustee
        preconditions:
          - "CapitalNeed.status == FUNDED"
          - "DstTrust.status == OPERATING"
        side_effects:
          - "when funding_source == RESERVE books a compensating TrustLedgerEntry entry_type REVERSAL, bucket RESERVE, amount_cents = +amount_cents, reversal_of_entry_id = the RESERVE_DRAW entry, source_kind REVERSAL"
          - "when funding_source == MASTER_TENANT books nothing"
          - "recomputes DstTrust.reserve_balance_cents and DstTrust.posture (compensating invariant: conserved reserve cash)"
      - from: IDENTIFIED
        to: VOIDED
        trigger: "POST /capital-needs/{capital_need_id}/void"
        actor: Trustee
        preconditions:
          - "CapitalNeed.status == IDENTIFIED"
        side_effects:
          - "no ledger effect: the need was never funded"

  - entity: Distribution
    initial_state: DECLARED
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: DECLARED
        to: PAID
        trigger: "POST /distributions/{distribution_id}/pay"
        actor: Trustee
        preconditions:
          - "Distribution.status == DECLARED"
          - "DstTrust.status IN {OPERATING, WINDING_DOWN}"
          - "logical clock now >= Distribution.period_end"
          - "DstTrust.operating_balance_cents >= the FINAL_CASH amount computed at payment"
        side_effects:
          - "computes final_amount_cents under variant FINAL_CASH and reconciliation_delta_cents = final_amount_cents - provisional_amount_cents"
          - "creates one DistributionAllocation per CLOSED Subscription on the trust per calculations.distribution_allocation_rounding"
          - "books TrustLedgerEntry DISTRIBUTION_PAYMENT, bucket OPERATING, amount_cents = -final_amount_cents, source_kind DISTRIBUTION"
          - "recomputes DstTrust.operating_balance_cents and DstTrust.posture"
      - from: DECLARED
        to: VOIDED
        trigger: "POST /distributions/{distribution_id}/void"
        actor: Trustee
        preconditions:
          - "Distribution.status == DECLARED"
        side_effects:
          - "releases the period so a new Distribution may occupy the same half-open interval"

  - entity: TaxStatement
    initial_state: DRAFT
    terminal_states: [ISSUED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /tax-statements/{tax_statement_id}/issue"
        actor: SponsorPrincipal
        preconditions:
          - "TaxStatement.status == DRAFT"
          - "the referenced Subscription.status == CLOSED"
        side_effects:
          - "sets issued_at = logical clock now; the statement becomes immutable"

  - entity: ExitEvent
    initial_state: PROPOSED
    terminal_states: [CLOSED, ABANDONED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /exit-events/{exit_event_id}/tally-consents"
        actor: SponsorPrincipal
        preconditions:
          - "ExitEvent.status == PROPOSED"
          - "DstTrust.status == OPERATING"
          - "at least one ExitConsent row exists on this exit event"
          - "the tally satisfies calculations.exit_consent_tally"
        side_effects:
          - "sets consented_units and consent_pct"
          - "transitions the DstTrust OPERATING -> WINDING_DOWN, which recomputes DstTrust.posture to FROZEN"
      - from: PROPOSED
        to: ABANDONED
        trigger: "POST /exit-events/{exit_event_id}/abandon"
        actor: SponsorPrincipal
        preconditions:
          - "ExitEvent.status == PROPOSED"
        side_effects:
          - "leaves DstTrust.status and DstTrust.posture unchanged"
      - from: APPROVED
        to: CLOSED
        trigger: "POST /exit-events/{exit_event_id}/close"
        actor: Trustee
        preconditions:
          - "ExitEvent.status == APPROVED"
          - "DstTrust.status == WINDING_DOWN"
          - "the trust's LoanFacility.status == FUNDED"
        side_effects:
          - "computes net_proceeds_cents and net_proceeds_per_unit_cents per calculations.exit_net_proceeds"
          - "books TrustLedgerEntry SALE_PROCEEDS, bucket OPERATING, amount_cents = +(gross_price_cents - selling_costs_cents), source_kind EXIT"
          - "transitions the LoanFacility FUNDED -> PAID_OFF (booking LOAN_PAYOFF only for ASSET_SALE)"
          - "transitions the Property ACQUIRED -> DISPOSED"
          - "sweeps the reserve bucket to operating: books REVERSAL of the remaining reserve balance (bucket RESERVE, negative) and an equal positive OPERATING entry"
          - "creates one Distribution with kind LIQUIDATING covering [closed_at, closed_at) semantics pinned in calculations.exit_liquidating_distribution and immediately in status DECLARED"
          - "creates one successor ExchangeFile per CLOSED Subscription with source_exit_event_id = this exit event, per calculations.successor_exchange_file_seed"
          - "transitions the DstTrust to TERMINATED (ASSET_SALE) or CONVERTED_LLC (SECTION_721_CONVERSION)"

# =====================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =====================================================================
concurrency_rules:
  - rule_id: subscription-create-stale-offering
    parent_entity: Offering
    write_endpoint: "POST /subscriptions"
    occ_field: "expected_offering_version"
    description: |
      Creating a Subscription against an Offering whose version has advanced
      since the client last observed it is rejected with a stale-version error.
      A subscription create legitimately supersedes the client's view of
      remaining capacity: an earlier create bumped Offering.units_committed and
      equity_committed_cents (and therefore Offering.version), so a writer still
      carrying the older version number is working from a capacity picture the
      trust has already spent.
    error_id: ERR_STALE_OFFERING_VERSION
    http_status: 412

  - rule_id: distribution-create-stale-trust
    parent_entity: DstTrust
    write_endpoint: "POST /distributions"
    occ_field: "expected_trust_version"
    description: |
      Declaring a Distribution against a DstTrust whose version has advanced
      since the client last observed it is rejected with a stale-version error.
      A declaration legitimately supersedes the prior view of trust cash: any
      intervening reserve draw, rent posting or capital-need funding bumped
      DstTrust.operating_balance_cents (and therefore DstTrust.version), so a
      declaration carrying the older version is sized against cash that has
      already moved.
    error_id: ERR_STALE_TRUST_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
#
# Arithmetic conventions (apply to EVERY rule below):
#   * All money is integer cents. All intermediate products/quotients are
#     evaluated in exact rational arithmetic, then rounded exactly once at the
#     step where the rule says "round_half_up".
#   * round_half_up(x) = floor(x + 1/2) for x >= 0, and -floor(-x + 1/2) for x < 0.
#   * ceil_div(a, b) = -((-a) // b) on integers.
#   * "days" between two instants means the whole-day count of the difference
#     (end - start) measured in UTC.
#   * Ratios reported as `number` carry exactly 4 decimal places, round_half_up.
# =====================================================================
calculations:
  - name: property_depreciable_basis
    trigger: "Property UNDER_CONTRACT_to_ACQUIRED (POST /properties/{property_id}/acquire)"
    algorithm: threshold
    formula: |
      depreciable_basis_cents = round_half_up(purchase_price_cents * LAND_EXCLUSION_COMPLEMENT)
      annual_depreciation_cents = round_half_up(depreciable_basis_cents / DEPRECIATION_RECOVERY_YEARS)
      # annual_depreciation_cents is not persisted on Property; it is recomputed
      # on demand by tax_statement_trust_totals from depreciable_basis_cents.
    input_set: "the single Property being acquired; no other rows participate"
    constants:
      LAND_EXCLUSION_COMPLEMENT: 0.80
      DEPRECIATION_RECOVERY_YEARS: 39
    precision: "integer cents, round_half_up at each of the two steps in the order written"

  - name: offering_capital_stack_grossup
    trigger: "Offering UNDER_REVIEW_to_EFFECTIVE (POST /offerings/{offering_id}/declare-effective) and Offering EFFECTIVE_to_DRAFT recompute"
    algorithm: constraint_propagation
    formula: |
      # MODE (c): circular-looking dependency. sponsor_load_cents is a percentage of
      # gross equity, but gross equity must cover the load, so the equity is grossed
      # up. EVALUATION ORDER IS PINNED and MUST be executed exactly in these five
      # steps. In particular sponsor_load_cents is NEVER computed as
      # round(load_pct * target_equity_cents) -- that is the trap and it is wrong.
      #
      # Inputs: P = Property.purchase_price_cents for the trust's property_id,
      #         C = Offering.closing_costs_cents,
      #         L = LoanFacility.principal_cents of the trust's facility in
      #             status IN {COMMITTED, FUNDED} (exactly one exists),
      #         r = Offering.reserve_funding_pct, k = Offering.load_pct
      #
      # step 1: initial_reserve_cents = round_half_up(P * r)
      # step 2: net_acquisition_cents = P + C - L
      # step 3: base_need_cents       = net_acquisition_cents + initial_reserve_cents
      # step 4: load_pct_bps          = round_half_up(k * 10000)
      #         target_equity_cents   = ceil_div(base_need_cents * 10000,
      #                                          10000 - load_pct_bps)
      # step 5: sponsor_load_cents    = target_equity_cents - base_need_cents
      #
      # unit_capacity_cents = DstTrust.total_units * Offering.unit_price_cents
      # and declare-effective is rejected when unit_capacity_cents < target_equity_cents.
    input_set: "the Offering being made effective, its DstTrust, that trust's Property, and that trust's single LoanFacility in status IN {COMMITTED, FUNDED}"
    constants:
      BPS_SCALE: 10000
    precision: "integer cents; step 1 round_half_up; step 4 ceil_div (always rounds up, so equity never under-funds the need); step 5 exact subtraction"

  - name: investor_suitability_cap
    trigger: "Investor NOT_REVIEWED_to_APPROVED (POST /investors/{investor_id}/review-suitability with decision APPROVED)"
    algorithm: tiered_pricing
    formula: |
      # MODE (a): 3+ inputs with non-linear interaction -- a nested min over three
      # caps, one of which is itself selected by a branch on accreditation_method
      # and another by a band lookup on entity_type.
      #
      # band = LIQUID_CAP_BY_ENTITY_TYPE[Investor.entity_type]
      # liquid_cap_cents = floor(Investor.liquid_net_worth_cents * band)
      #
      # if Investor.accreditation_method == SELF_CERT_INCOME:
      #     means_cap_cents = floor(Investor.annual_income_cents * INCOME_MULTIPLE)
      # else:
      #     means_cap_cents = floor(Investor.net_worth_cents * NET_WORTH_PCT)
      #
      # deal_cap_cents = floor(Offering.target_equity_cents * DEAL_CONCENTRATION_PCT)
      #   where Offering is the offering named by the review request's offering_id
      #
      # suitability_cap_cents = min(liquid_cap_cents, means_cap_cents, deal_cap_cents)
      #
      # On decision DECLINED the cap is set to 0 and no branch is evaluated.
    input_set: "the Investor under review plus the single Offering named by the request's offering_id (which MUST be in status EFFECTIVE)"
    constants:
      LIQUID_CAP_BY_ENTITY_TYPE: { IRA: 0.10, INDIVIDUAL: 0.25, JOINT: 0.25, LLC: 0.35, REVOCABLE_TRUST: 0.35 }
      INCOME_MULTIPLE: 3.0
      NET_WORTH_PCT: 0.30
      DEAL_CONCENTRATION_PCT: 0.60
    precision: "integer cents; every branch floors (never rounds half up), then the three-way min is taken"

  - name: exchange_file_deadlines
    trigger: "POST /exchange-files (creation) and successor-file seeding inside ExitEvent APPROVED_to_CLOSED"
    algorithm: interval_merge
    formula: |
      identification_deadline = date(relinquished_closed_on) + IDENTIFICATION_DAYS days,
                                snapped to 23:59:59.999Z on that date
      exchange_deadline       = date(relinquished_closed_on) + EXCHANGE_DAYS days,
                                snapped to 23:59:59.999Z on that date
      # Both boundaries are INCLUSIVE: a filing whose identified_at equals
      # identification_deadline exactly is accepted; identified_at one millisecond
      # later is rejected.
    input_set: "the single ExchangeFile being created or seeded"
    constants:
      IDENTIFICATION_DAYS: 45
      EXCHANGE_DAYS: 180
    precision: "millisecond-precision datetimes, always 23:59:59.999Z"

  - name: identification_rule_capacity
    trigger: "POST /property-identifications (before insert)"
    algorithm: threshold
    formula: |
      candidate_set = PropertyIdentification rows on this ExchangeFile with
                      status == ACTIVE, PLUS the row about to be inserted
      if ExchangeFile.identification_rule == THREE_PROPERTY:
          reject when count(candidate_set) > MAX_IDENTIFIED_PROPERTIES
      if ExchangeFile.identification_rule == TWO_HUNDRED_PCT:
          reject when sum(candidate_set.fair_market_value_cents) * 100
                      > ExchangeFile.relinquished_sale_price_cents * TWO_HUNDRED_PCT_LIMIT
      # The 200% test is an integer cross-multiplication, so a candidate set whose
      # FMV total lands EXACTLY at 200% of the sale price is accepted.
    input_set: "PropertyIdentification rows on the target ExchangeFile with status == ACTIVE (REVOKED rows are excluded), plus the pending row"
    constants:
      MAX_IDENTIFIED_PROPERTIES: 3
      TWO_HUNDRED_PCT_LIMIT: 200
    precision: "exact integer arithmetic; no rounding, no floating point"

  - name: subscription_boot
    trigger: "POST /subscriptions (before insert) and on Offering capital-stack recompute"
    algorithm: threshold
    formula: |
      debt_share_cents = round_half_up(LoanFacility.principal_cents
                                       * Subscription.units_requested
                                       / DstTrust.total_units)
      replacement_value_cents = investment_amount_cents + debt_share_cents
      relinquished_value_cents = ExchangeFile.net_proceeds_cents
                                 + ExchangeFile.debt_retired_cents
      boot_cents = max(0, relinquished_value_cents - replacement_value_cents)
      # Rejected when boot_cents > ExchangeFile.boot_tolerance_cents.
    input_set: "the pending Subscription, its ExchangeFile, its Offering's DstTrust, and that trust's single LoanFacility in status IN {COMMITTED, FUNDED}"
    constants: {}
    precision: "integer cents; the debt share is the only rounded step (round_half_up)"

  - name: loan_ltv_check
    trigger: "POST /loan-facilities, POST /loan-facilities/{loan_id}/reprice, POST /loan-facilities/{loan_id}/fund"
    algorithm: threshold
    formula: |
      # The REPORTED ratio and the ENFORCED test are deliberately different
      # computations. The report rounds; the test does not.
      ltv_pct = round_half_up(principal_cents * 10000 / appraised_value_cents) / 100
                (reported with 4 decimal places, as a percentage)
      pass_test = (principal_cents * BPS_SCALE <= Property.appraised_value_cents * MAX_LTV_BPS)
      # pass_test is exact integer cross-multiplication: a principal one cent above
      # 75.0000% of appraised value fails even though ltv_pct still reports 75.0000.
    input_set: "the LoanFacility and the Property held (or to be held) by its DstTrust"
    constants:
      MAX_LTV_BPS: 7500
      BPS_SCALE: 10000
    precision: "ltv_pct reported to 4 decimal places round_half_up; the enforced test uses exact integers and never rounds"

  - name: loan_dscr
    trigger: "POST /loan-facilities, POST /loan-facilities/{loan_id}/reprice, POST /loan-facilities/{loan_id}/fund"
    algorithm: threshold
    formula: |
      annual_debt_service_cents = round_half_up(principal_cents * rate_bps / BPS_SCALE)
                                  # interest-only facility
      dscr = round_half_up(Property.annual_noi_cents * 10000 / annual_debt_service_cents) / 10000
      pass_test = (Property.annual_noi_cents * 10000
                   >= annual_debt_service_cents * MIN_DSCR_BPS)
    input_set: "the LoanFacility and the Property held by its DstTrust"
    constants:
      MIN_DSCR_BPS: 12500
      BPS_SCALE: 10000
    precision: "dscr reported to 4 decimal places round_half_up; the enforced test uses exact integers"

  - name: trust_balances
    trigger: "every TrustLedgerEntry insertion (all state transitions that book entries)"
    algorithm: aggregation
    formula: |
      # A ledger entry E is REVERSED when another entry R exists with
      # R.entry_type == REVERSAL and R.reversal_of_entry_id == E.id.
      # REVERSAL entries themselves always count.
      operating_balance_cents = sum(E.amount_cents) over TrustLedgerEntry E where
          E.trust_id == DstTrust.id AND E.bucket == OPERATING AND E is not REVERSED
      reserve_balance_cents   = sum(E.amount_cents) over TrustLedgerEntry E where
          E.trust_id == DstTrust.id AND E.bucket == RESERVE   AND E is not REVERSED
      units_issued        = sum(S.units_requested) over Subscription S where
          S.offering_id belongs to this trust AND S.status == CLOSED
      equity_raised_cents = sum(S.investment_amount_cents) over the same set
      # Replay order for reporting is occurred_at ASC, tie-break created_at ASC.
      # Sums themselves are order-independent (integer addition).
    input_set: "TrustLedgerEntry rows for the trust (all entry_types, unreversed) and Subscription rows in status CLOSED"
    constants: {}
    precision: "exact integer cents; no rounding"

  - name: trust_posture
    trigger: "recomputed after every DstTrust mutation, every ledger entry, every Property status change and every ExitEvent PROPOSED_to_APPROVED"
    algorithm: threshold
    formula: |
      # Strict precedence, evaluated top to bottom; the FIRST match wins.
      if Property.status == CONTRACT_EXPIRED for DstTrust.property_id
         OR an ExitEvent on this trust has status == APPROVED:
             posture = FROZEN
      elif DstTrust.status == OPERATING
           AND DstTrust.reserve_balance_cents < DstTrust.reserve_floor_cents:
             posture = RESTRICTED
      else:
             posture = OPEN
      # FROZEN blocks every child mutation. RESTRICTED blocks capital-need funding
      # and OPERATING distributions but still permits tax statements, consents and
      # exit workflow. A Distribution with kind == LIQUIDATING is exempt from
      # posture gating entirely, because it is created by the exit cascade while
      # the trust is necessarily FROZEN.
    input_set: "the DstTrust, its Property, and ExitEvent rows on the trust"
    constants: {}
    precision: "enum-valued; no arithmetic"

  - name: subscription_closing_sequence
    trigger: "Subscription RESERVED_to_CLOSED and Subscription CLOSED_to_RESCINDED (renumber)"
    algorithm: chronological
    formula: |
      ordered = Subscription rows on the same offering_id with status == CLOSED,
                sorted by closed_at ASC, tie-break created_at ASC
                # `id` is NEVER a sort key
      for i, S in enumerate(ordered, start=1): S.closing_sequence_no = i
      # On rescission the rescinded row's closing_sequence_no is cleared to null
      # and the remaining CLOSED rows are renumbered by the same rule, so the
      # sequence is always 1..n with no gaps.
    input_set: "Subscription rows on the offering with status == CLOSED"
    constants: {}
    precision: "1-based integers"

  - name: distribution_reserve_replenishment
    trigger: "POST /distributions (declaration) and POST /distributions/{distribution_id}/pay"
    algorithm: aggregation
    formula: |
      # Two-step rounding, order PINNED: annualise and round FIRST, then prorate
      # and round SECOND. Collapsing the two steps into one product changes cents.
      period_days = days(period_end - period_start)
      replenish_annual_cents = round_half_up(MasterLease.base_rent_annual_cents
                                             * DstTrust.reserve_target_pct)
      reserve_replenishment_cents = round_half_up(replenish_annual_cents
                                                  * period_days / DAYS_IN_YEAR)
      # Identical under both variants of distribution_distributable: the
      # replenishment is always an accrual, never a cash figure.
    input_set: "the Distribution's DstTrust and the single MasterLease on that trust in status IN {EXECUTED, TERMINATED} whose term covers period_start"
    constants:
      DAYS_IN_YEAR: 365
    precision: "integer cents; round_half_up twice, in the order written"

  - name: distribution_distributable
    trigger: "POST /distributions (variant PROVISIONAL_ACCRUAL) and POST /distributions/{distribution_id}/pay (variant FINAL_CASH)"
    algorithm: forward_looking
    formula: |
      period_days = days(period_end - period_start)
      reserve_replenishment_cents = calculations.distribution_reserve_replenishment
      # Variant-specific gross, then a common replenishment deduction:
      distributable_cents = gross_cents - reserve_replenishment_cents
    input_set: "the Distribution's DstTrust, that trust's MasterLease, its LoanFacility in status FUNDED, and (FINAL_CASH only) TrustLedgerEntry rows whose occurred_at lies in [period_start, period_end)"
    constants:
      DAYS_IN_YEAR: 365
      BPS_SCALE: 10000
    precision: "integer cents; each of the three accrual components is rounded half up INDEPENDENTLY before they are combined (round-then-combine, never combine-then-round)"
    variants:
      - name: PROVISIONAL_ACCRUAL
        when: "at declaration (POST /distributions), stored in Distribution.provisional_amount_cents"
        difference: |
          gross_cents is an ACCRUAL over the period and ignores whether cash arrived:
            accrued_base_cents = round_half_up(MasterLease.base_rent_annual_cents
                                               * period_days / DAYS_IN_YEAR)
            accrued_supplemental_cents = round_half_up(
                                               MasterLease.supplemental_rent_annual_cents
                                               * period_days / DAYS_IN_YEAR)
            scheduled_debt_service_cents = round_half_up(
                round_half_up(LoanFacility.principal_cents * LoanFacility.rate_bps / BPS_SCALE)
                * period_days / DAYS_IN_YEAR)
            gross_cents = accrued_base_cents + accrued_supplemental_cents
                          - scheduled_debt_service_cents
      - name: FINAL_CASH
        when: "at payment (POST /distributions/{distribution_id}/pay), stored in Distribution.final_amount_cents"
        difference: |
          gross_cents is the CASH actually booked inside the half-open window
          [period_start, period_end), taken from the ledger and never annualised:
            gross_cents = sum(E.amount_cents) over TrustLedgerEntry E where
                E.trust_id == this trust
                AND E.entry_type IN {RENT_RECEIPT, DEBT_SERVICE}
                AND E is not REVERSED
                AND period_start <= E.occurred_at < period_end
          reconciliation_delta_cents = final_amount_cents - provisional_amount_cents
          is persisted on the Distribution; a late rent receipt or an early debt
          service payment therefore produces a non-zero delta for identical
          lease and loan terms.

  - name: distribution_allocation_rounding
    trigger: "Distribution DECLARED_to_PAID (POST /distributions/{distribution_id}/pay)"
    algorithm: waterfall_allocation
    formula: |
      # MODE (b): nested rounding where the ORDER MATTERS. The pinned order is
      # ROUND EACH SHARE FIRST, THEN SWEEP THE RESIDUAL. "Sum the raw shares and
      # round once at the end" is explicitly FORBIDDEN and produces a different
      # per-investor split.
      #
      # amount = Distribution.final_amount_cents
      # denominator = DstTrust.units_issued        <-- NOT DstTrust.total_units
      # rows = Subscription rows on the trust with status == CLOSED,
      #        ordered by closing_sequence_no ASC   <-- NEVER by id
      #
      # step 1: for each row: raw_share_cents = amount * units / denominator
      #                       (kept to 4 decimal places, round_half_up)
      # step 2: for each row: allocated_cents = round_half_up(raw_share_cents)
      # step 3: residual_cents = amount - sum(allocated_cents)
      # step 4: if residual_cents > 0:
      #             order rows by fractional_part(raw_share_cents) DESC,
      #             tie-break closing_sequence_no ASC;
      #             add +1 cent to the first |residual_cents| rows
      #         if residual_cents < 0:
      #             order rows by fractional_part(raw_share_cents) ASC,
      #             tie-break closing_sequence_no ASC;
      #             subtract 1 cent from the first |residual_cents| rows
      #         residual_adjustment_cents records the +1 / -1 / 0 applied
      # step 5: invariant -- sum(allocated_cents) == amount exactly
    input_set: "Subscription rows on the paying trust with status == CLOSED (RESCINDED, REJECTED, RESERVED and REVISION_REQUIRED rows are excluded)"
    constants: {}
    precision: "raw_share_cents to 4 decimal places round_half_up; allocated_cents integer round_half_up; residual swept by whole cents"

  - name: tax_statement_trust_totals
    trigger: "POST /tax-statements (before per-investor allocation)"
    algorithm: chronological
    formula: |
      year_start = 0001-01-01T00:00:00.000Z semantics not used; the window is
      [Jan 1 of tax_year 00:00:00.000Z, Jan 1 of tax_year+1 00:00:00.000Z)
      trust_rental_income_cents = sum(E.amount_cents) over unreversed
          TrustLedgerEntry E with entry_type == RENT_RECEIPT and occurred_at in window
      trust_interest_expense_cents = -1 * sum(E.amount_cents) over unreversed
          TrustLedgerEntry E with entry_type == DEBT_SERVICE and occurred_at in window
          # stored positive
      # Depreciation: two-step rounding, order PINNED (annualise, then prorate).
      annual_depreciation_cents = round_half_up(Property.depreciable_basis_cents
                                                / DEPRECIATION_RECOVERY_YEARS)
      held_days = whole days from date(DstTrust.property_acquired_at) through
                  Dec 31 of tax_year, INCLUSIVE of both endpoints, capped at DAYS_IN_YEAR
      trust_depreciation_cents = round_half_up(annual_depreciation_cents
                                               * held_days / DAYS_IN_YEAR)
    input_set: "unreversed TrustLedgerEntry rows of the trust with entry_type IN {RENT_RECEIPT, DEBT_SERVICE} inside the tax year, plus the trust's Property"
    constants:
      DEPRECIATION_RECOVERY_YEARS: 39
      DAYS_IN_YEAR: 365
    precision: "integer cents; depreciation rounds twice in the order written"

  - name: tax_statement_allocation
    trigger: "POST /tax-statements"
    algorithm: weighted_scoring
    formula: |
      totals = calculations.tax_statement_trust_totals
      share = variant-specific exact rational fraction (see variants)
      rental_income_cents    = round_half_up(totals.trust_rental_income_cents * share)
      interest_expense_cents = round_half_up(totals.trust_interest_expense_cents * share)
      depreciation_cents     = round_half_up(totals.trust_depreciation_cents * share)
      net_taxable_income_cents = rental_income_cents - interest_expense_cents
                                 - depreciation_cents
      # Each of the three items is rounded INDEPENDENTLY from the exact rational
      # share; the net is then computed from the three ROUNDED items.
    input_set: "the TaxStatement's Subscription (which MUST be status CLOSED) and all Subscription rows on the trust with status == CLOSED"
    constants:
      DAYS_IN_YEAR: 365
    precision: "integer cents; three independent round_half_up steps, then exact subtraction"
    variants:
      - name: UNITS_AT_YEAR_END
        when: "TaxStatement.allocation_variant == UNITS_AT_YEAR_END"
        difference: |
          share = Subscription.units_requested / DstTrust.units_issued
          A closing date inside the year is ignored entirely: an investor who
          closed on the last business day of the year receives the same share as
          one who closed in month one, provided both hold the same units.
      - name: UNIT_DAYS_WEIGHTED
        when: "TaxStatement.allocation_variant == UNIT_DAYS_WEIGHTED"
        difference: |
          unit_days(S) = S.units_requested * (whole days from date(S.closed_at)
                         through Dec 31 of tax_year, INCLUSIVE of both endpoints)
          share = unit_days(this subscription) / sum(unit_days(S)) over all
                  CLOSED subscriptions on the trust
          Closing date now drives the split, so two equal-unit investors who
          closed in different months receive different numbers for identical
          trust-level totals.

  - name: exit_consent_tally
    trigger: "POST /exit-events/{exit_event_id}/tally-consents"
    algorithm: threshold
    formula: |
      rows = ExitConsent rows on this ExitEvent (one per subscription; duplicates
             are rejected at insert time)
      consented_units = sum(R.units_at_consent) over rows where R.decision == CONSENT
      threshold_bps = round_half_up(ExitEvent.consent_threshold_pct * BPS_SCALE)
      consent_pct = round_half_up(consented_units * BPS_SCALE
                                  / DstTrust.units_issued) / BPS_SCALE
      pass_test = (consented_units * BPS_SCALE >= threshold_bps * DstTrust.units_issued)
      # Exact integer cross-multiplication: a tally that lands EXACTLY on the
      # threshold passes (>=, not >). An empty rows set is rejected earlier by
      # the no-consents-recorded validation, so pass_test is never evaluated
      # against a zero-length input set.
    input_set: "ExitConsent rows on the ExitEvent; DstTrust.units_issued as denominator"
    constants:
      BPS_SCALE: 10000
    precision: "consent_pct reported to 4 decimal places round_half_up; the enforced test uses exact integers"

  - name: exit_net_proceeds
    trigger: "ExitEvent APPROVED_to_CLOSED (POST /exit-events/{exit_event_id}/close)"
    algorithm: waterfall_allocation
    formula: |
      net_proceeds_cents = variant-specific (see variants)
      net_proceeds_per_unit_cents = floor(net_proceeds_cents / DstTrust.units_issued)
      # per-unit is a REPORTED figure only; the cash actually paid to investors is
      # allocated by calculations.exit_liquidating_distribution over the ledger
      # balance, not by multiplying this per-unit number.
    input_set: "the ExitEvent, its DstTrust, that trust's Property and its LoanFacility in status FUNDED"
    constants: {}
    precision: "integer cents; per-unit floors"
    variants:
      - name: ASSET_SALE
        when: "ExitEvent.exit_mode == ASSET_SALE"
        difference: |
          The buyer pays cash and the facility is retired out of the proceeds:
            net_proceeds_cents = gross_price_cents - selling_costs_cents
                                 - LoanFacility.principal_cents
          Ledger: SALE_PROCEEDS +(gross_price_cents - selling_costs_cents) and
          LOAN_PAYOFF -(LoanFacility.principal_cents), both bucket OPERATING.
      - name: SECTION_721_CONVERSION
        when: "ExitEvent.exit_mode == SECTION_721_CONVERSION"
        difference: |
          The asset is contributed SUBJECT TO the existing debt, so no payoff
          occurs and the principal is NOT deducted:
            net_proceeds_cents = gross_price_cents - selling_costs_cents
          Ledger: SALE_PROCEEDS +(gross_price_cents - selling_costs_cents) only.
          For identical gross_price_cents and selling_costs_cents the two variants
          differ by exactly LoanFacility.principal_cents.

  - name: exit_liquidating_distribution
    trigger: "ExitEvent APPROVED_to_CLOSED (POST /exit-events/{exit_event_id}/close), after the reserve sweep"
    algorithm: waterfall_allocation
    formula: |
      # Order of operations inside the close is PINNED:
      #   1. book SALE_PROCEEDS (and LOAN_PAYOFF for ASSET_SALE)
      #   2. sweep the reserve bucket: book a REVERSAL entry bucket RESERVE with
      #      amount_cents = -DstTrust.reserve_balance_cents (reversal_of_entry_id
      #      null, source_kind EXIT) and an equal positive entry bucket OPERATING,
      #      driving reserve_balance_cents to exactly 0
      #   3. liquidating_amount_cents = DstTrust.operating_balance_cents AFTER
      #      steps 1-2
      #   4. create Distribution kind LIQUIDATING with period_start = closed_at,
      #      period_end = closed_at + 1 millisecond, status DECLARED,
      #      provisional_amount_cents = liquidating_amount_cents
      # The liquidating Distribution is exempt from posture gating and from the
      # period-overlap rule (no other period can contain a 1-millisecond window
      # that begins at closed_at unless it also began there).
      # Payment then follows calculations.distribution_allocation_rounding
      # unchanged, with amount = final_amount_cents.
    input_set: "the closing ExitEvent's DstTrust and its ledger"
    constants: {}
    precision: "exact integer cents"

  - name: successor_exchange_file_seed
    trigger: "ExitEvent APPROVED_to_CLOSED (POST /exit-events/{exit_event_id}/close)"
    algorithm: projection
    formula: |
      for each Subscription S on the trust with status == CLOSED,
          ordered by S.closing_sequence_no ASC:
        create ExchangeFile F with
          investor_id                    = S.investor_id
          source_exit_event_id           = ExitEvent.id
          qi_reference                   = "SUCCESSOR-" + str(S.closing_sequence_no)
          relinquished_closed_on         = ExitEvent.closed_at
          relinquished_sale_price_cents  = round_half_up(ExitEvent.gross_price_cents
                                             * S.units_requested / DstTrust.units_issued)
          net_proceeds_cents             = the DistributionAllocation.allocated_cents
                                             this subscription will receive is NOT
                                             yet known, so seed with
                                             round_half_up(liquidating_amount_cents
                                             * S.units_requested / DstTrust.units_issued)
          debt_retired_cents             = round_half_up(LoanFacility.principal_cents
                                             * S.units_requested / DstTrust.units_issued)
          identification_rule            = THREE_PROPERTY
          boot_tolerance_cents           = 0
          status                         = OPEN
        then apply calculations.exchange_file_deadlines to F, so the successor
        file's 45-day and 180-day clocks both start at ExitEvent.closed_at.
    input_set: "CLOSED Subscription rows on the exiting trust"
    constants: {}
    precision: "integer cents, round_half_up per subscription"

  - name: investor_report_rollup
    trigger: "GET /trusts/{trust_id}/investor-report"
    algorithm: aggregation
    formula: |
      units_issued            = DstTrust.units_issued
      units_available         = DstTrust.total_units - DstTrust.units_issued
      reserve_target_cents    = round_half_up(Property.purchase_price_cents
                                              * DstTrust.reserve_target_pct)
      reserve_variance_cents  = DstTrust.reserve_balance_cents - reserve_target_cents
      distributions_paid_cents = sum(D.final_amount_cents) over Distribution rows on
                                 the trust with status == PAID
      closed_investor_count   = count(distinct S.investor_id) over Subscription rows
                                 on the trust with status == CLOSED
      posture                 = DstTrust.posture
    input_set: "the DstTrust, its Property, its Distribution rows in status PAID, and its Subscription rows in status CLOSED"
    constants: {}
    precision: "integer cents; reserve target rounds half up"

# =====================================================================
# §1.4 Validation Rules Table (evaluated strictly in ascending priority;
#      the FIRST violated rule determines the response, and no side effect
#      of the request is applied)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the seven declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the acting role appears in the called endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "for the Investor role, X-User-ID equals the investor_id of the target resource (Subscription.investor_id, ExchangeFile.investor_id, or the Subscription named by an ExitConsent); for the MasterTenant role, X-User-ID equals MasterLease.master_tenant_user_id of an EXECUTED lease on the target trust"
    error_id: ERR_FORBIDDEN_NOT_OWNER
    http_status: 403
    applies_to: "POST /subscriptions/{subscription_id}/rescind, POST /exit-consents, POST /trusts/{trust_id}/rent-postings, POST /capital-needs/{capital_need_id}/fund"

  - priority: 4
    category: auth
    check: "segregation of duties: on declare-effective the acting X-User-ID differs from Offering.ppm_submitted_by_user_id; on subscription close the acting X-User-ID differs from Investor.suitability_reviewed_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /offerings/{offering_id}/declare-effective, POST /subscriptions/{subscription_id}/close"

  - priority: 5
    category: state
    check: "request body parses; every required input field is present; enums are declared members; integers are within their declared constraints; occupancy_rate/load_pct/reserve_target_pct/reserve_funding_pct/consent_threshold_pct lie in their declared ranges; Distribution.period_start < Distribution.period_end; MasterLease.term_start_on <= MasterLease.term_end_on; pagination limit is 1..100 and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 6
    category: existence
    check: "every path id resolves to an existing row, validated left to right"
    error_id: ERR_PROPERTY_NOT_FOUND | ERR_TRUST_NOT_FOUND | ERR_OFFERING_NOT_FOUND | ERR_INVESTOR_NOT_FOUND | ERR_EXCHANGE_FILE_NOT_FOUND | ERR_IDENTIFICATION_NOT_FOUND | ERR_SUBSCRIPTION_NOT_FOUND | ERR_LOAN_NOT_FOUND | ERR_MASTER_LEASE_NOT_FOUND | ERR_LEDGER_ENTRY_NOT_FOUND | ERR_CAPITAL_NEED_NOT_FOUND | ERR_DISTRIBUTION_NOT_FOUND | ERR_ALLOCATION_NOT_FOUND | ERR_TAX_STATEMENT_NOT_FOUND | ERR_EXIT_EVENT_NOT_FOUND | ERR_EXIT_CONSENT_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint carrying a path id"

  - priority: 7
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row, validated in the field order declared by the endpoint's input list"
    error_id: ERR_PROPERTY_NOT_FOUND | ERR_TRUST_NOT_FOUND | ERR_OFFERING_NOT_FOUND | ERR_INVESTOR_NOT_FOUND | ERR_EXCHANGE_FILE_NOT_FOUND | ERR_SUBSCRIPTION_NOT_FOUND | ERR_EXIT_EVENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /trusts, POST /offerings, POST /exchange-files, POST /property-identifications, POST /subscriptions, POST /loan-facilities, POST /master-leases, POST /capital-needs, POST /distributions, POST /tax-statements, POST /exit-events, POST /exit-consents, POST /investors/{investor_id}/review-suitability"

  - priority: 8
    category: state
    check: "expected_offering_version equals the current Offering.version (OCC, see concurrency_rules[subscription-create-stale-offering])"
    error_id: ERR_STALE_OFFERING_VERSION
    http_status: 412
    applies_to: "POST /subscriptions"

  - priority: 9
    category: state
    check: "expected_trust_version equals the current DstTrust.version (OCC, see concurrency_rules[distribution-create-stale-trust])"
    error_id: ERR_STALE_TRUST_VERSION
    http_status: 412
    applies_to: "POST /distributions"

  - priority: 10
    category: state
    check: "the target trust's posture is not FROZEN"
    error_id: ERR_TRUST_FROZEN
    http_status: 409
    applies_to: "every mutating endpoint whose target resolves to a DstTrust, EXCEPT POST /exit-events/{exit_event_id}/close, POST /distributions and POST /distributions/{distribution_id}/pay for a Distribution whose kind == LIQUIDATING, POST /tax-statements, POST /tax-statements/{tax_statement_id}/issue, POST /exit-consents and POST /exit-events/{exit_event_id}/abandon"

  - priority: 11
    category: state
    check: "the target trust's posture is not RESTRICTED"
    error_id: ERR_TRUST_RESTRICTED
    http_status: 409
    applies_to: "POST /capital-needs/{capital_need_id}/fund, POST /distributions (kind OPERATING), POST /distributions/{distribution_id}/pay (kind OPERATING)"

  - priority: 12
    category: state
    check: "the trust is in a status permitted for the operation (open-funding requires FORMING; subscription close, loan fund and lease execute require FUNDING or FORMING as declared in §1.2; capital-need funding, distribution declaration and exit proposal require OPERATING; exit close requires WINDING_DOWN)"
    error_id: ERR_TRUST_INVALID_STATE
    http_status: 409
    applies_to: "POST /trusts/{trust_id}/open-funding, POST /loan-facilities/{loan_id}/fund, POST /master-leases/{lease_id}/execute, POST /subscriptions, POST /subscriptions/{subscription_id}/close, POST /capital-needs/{capital_need_id}/fund, POST /distributions, POST /distributions/{distribution_id}/pay, POST /trusts/{trust_id}/rent-postings, POST /trusts/{trust_id}/debt-service-payments, POST /exit-events, POST /exit-events/{exit_event_id}/tally-consents, POST /exit-events/{exit_event_id}/close"

  - priority: 13
    category: state
    check: "the Offering named by the request is in status EFFECTIVE"
    error_id: ERR_OFFERING_NOT_EFFECTIVE
    http_status: 409
    applies_to: "POST /subscriptions, POST /subscriptions/{subscription_id}/close, POST /investors/{investor_id}/review-suitability"

  - priority: 14
    category: state
    check: "the Offering is in the from-state the requested transition declares in §1.2 (submit-ppm requires DRAFT; return-ppm and declare-effective require UNDER_REVIEW; withdraw requires DRAFT or UNDER_REVIEW)"
    error_id: ERR_OFFERING_INVALID_STATE
    http_status: 409
    applies_to: "POST /offerings/{offering_id}/submit-ppm, POST /offerings/{offering_id}/return-ppm, POST /offerings/{offering_id}/declare-effective, POST /offerings/{offering_id}/withdraw"

  - priority: 15
    category: state
    check: "the trust's Property is in status ACQUIRED"
    error_id: ERR_PROPERTY_NOT_ACQUIRED
    http_status: 409
    applies_to: "POST /trusts/{trust_id}/open-funding, POST /loan-facilities/{loan_id}/fund"

  - priority: 16
    category: state
    check: "the Property is in the from-state the requested transition declares (acquire requires UNDER_CONTRACT; expire-contract requires UNDER_CONTRACT)"
    error_id: ERR_PROPERTY_INVALID_STATE
    http_status: 409
    applies_to: "POST /properties/{property_id}/acquire, POST /properties/{property_id}/expire-contract"

  - priority: 17
    category: state
    check: "the LoanFacility is in the from-state the requested transition declares (reprice requires COMMITTED or FUNDED — a FUNDED facility passes this state gate and is refused at priority 34 as a prohibited refinancing, so the two errors never collide, while a PAID_OFF facility is refused here; fund requires COMMITTED; exit close requires the trust's facility to be FUNDED)"
    error_id: ERR_LOAN_INVALID_STATE
    http_status: 409
    applies_to: "POST /loan-facilities/{loan_id}/reprice, POST /loan-facilities/{loan_id}/fund, POST /exit-events/{exit_event_id}/close, POST /trusts/{trust_id}/debt-service-payments"

  - priority: 18
    category: state
    check: "a MasterLease on the trust is in status EXECUTED"
    error_id: ERR_MASTER_LEASE_NOT_EXECUTED
    http_status: 409
    applies_to: "POST /distributions, POST /trusts/{trust_id}/rent-postings"

  - priority: 19
    category: state
    check: "the MasterLease is in the from-state the requested transition declares (execute requires DRAFT; terminate requires EXECUTED)"
    error_id: ERR_MASTER_LEASE_INVALID_STATE
    http_status: 409
    applies_to: "POST /master-leases/{lease_id}/execute, POST /master-leases/{lease_id}/terminate"

  - priority: 20
    category: state
    check: "the Subscription is in the from-state the requested transition declares (close requires RESERVED; reject requires RESERVED or REVISION_REQUIRED; rescind requires CLOSED); a Subscription referenced by an ExitConsent or a TaxStatement must be CLOSED"
    error_id: ERR_SUBSCRIPTION_INVALID_STATE
    http_status: 409
    applies_to: "POST /subscriptions/{subscription_id}/close, POST /subscriptions/{subscription_id}/reject, POST /subscriptions/{subscription_id}/rescind, POST /exit-consents, POST /tax-statements, POST /tax-statements/{tax_statement_id}/issue"

  - priority: 21
    category: state
    check: "the ExchangeFile is in the status the operation requires (subscription create requires IDENTIFIED; subscription close requires IDENTIFIED; identification filing requires OPEN or IDENTIFIED; mark-expired requires OPEN or IDENTIFIED)"
    error_id: ERR_EXCHANGE_FILE_INVALID_STATE
    http_status: 409
    applies_to: "POST /subscriptions, POST /subscriptions/{subscription_id}/close, POST /property-identifications, POST /exchange-files/{exchange_file_id}/mark-expired"

  - priority: 22
    category: state
    check: "the PropertyIdentification is in status ACTIVE and its ExchangeFile is in status IDENTIFIED"
    error_id: ERR_IDENTIFICATION_INVALID_STATE
    http_status: 409
    applies_to: "POST /property-identifications/{identification_id}/revoke"

  - priority: 23
    category: state
    check: "the Distribution is in status DECLARED"
    error_id: ERR_DISTRIBUTION_INVALID_STATE
    http_status: 409
    applies_to: "POST /distributions/{distribution_id}/pay, POST /distributions/{distribution_id}/void"

  - priority: 24
    category: state
    check: "the CapitalNeed is in the from-state the requested transition declares (fund requires IDENTIFIED; void requires IDENTIFIED or FUNDED)"
    error_id: ERR_CAPITAL_NEED_INVALID_STATE
    http_status: 409
    applies_to: "POST /capital-needs/{capital_need_id}/fund, POST /capital-needs/{capital_need_id}/void"

  - priority: 25
    category: state
    check: "the ExitEvent is in the from-state the requested transition declares (tally-consents and abandon require PROPOSED; close requires APPROVED); a consent may only be recorded against a PROPOSED exit event"
    error_id: ERR_EXIT_INVALID_STATE
    http_status: 409
    applies_to: "POST /exit-events/{exit_event_id}/tally-consents, POST /exit-events/{exit_event_id}/abandon, POST /exit-events/{exit_event_id}/close, POST /exit-consents"

  - priority: 26
    category: state
    check: "the TaxStatement is in status DRAFT"
    error_id: ERR_TAX_STATEMENT_INVALID_STATE
    http_status: 409
    applies_to: "POST /tax-statements/{tax_statement_id}/issue"

  - priority: 27
    category: state
    check: "the logical clock is at or before Subscription.rescission_deadline (the boundary instant itself is still inside the window)"
    error_id: ERR_RESCISSION_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /subscriptions/{subscription_id}/rescind"

  - priority: 28
    category: business_safety
    check: "Investor.accreditation_status == VERIFIED"
    error_id: ERR_INVESTOR_NOT_ACCREDITED
    http_status: 422
    applies_to: "POST /subscriptions, POST /subscriptions/{subscription_id}/close"

  - priority: 29
    category: business_safety
    check: "the logical clock is strictly before Investor.accreditation_expires_at"
    error_id: ERR_ACCREDITATION_EXPIRED
    http_status: 422
    applies_to: "POST /subscriptions, POST /subscriptions/{subscription_id}/close"

  - priority: 30
    category: business_safety
    check: "when Offering.exemption_rule == RULE_506C the investor's accreditation_method must be THIRD_PARTY_LETTER; self-certification is not permitted in a generally solicited offering"
    error_id: ERR_ACCREDITATION_METHOD_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /subscriptions, POST /investors/{investor_id}/verify-accreditation"

  - priority: 31
    category: business_safety
    check: "Investor.suitability_status == APPROVED"
    error_id: ERR_SUITABILITY_NOT_APPROVED
    http_status: 422
    applies_to: "POST /subscriptions, POST /subscriptions/{subscription_id}/close"

  - priority: 32
    category: business_safety
    check: "the request's acknowledged_ppm_version equals the current Offering.ppm_version"
    error_id: ERR_PPM_VERSION_STALE
    http_status: 409
    applies_to: "POST /offerings/{offering_id}/declare-effective"

  - priority: 33
    category: business_safety
    check: "trustee power restriction: a capital need may not be funded by calling capital from beneficial owners (funding_source == CAPITAL_CALL is never permitted)"
    error_id: ERR_CAPITAL_CALL_PROHIBITED
    http_status: 422
    applies_to: "POST /capital-needs/{capital_need_id}/fund"

  - priority: 34
    category: business_safety
    check: "trustee power restriction: the trust may not renegotiate or refinance debt it has already drawn, and may not reprice at all once the offering period has ended — a reprice request against a LoanFacility in status FUNDED, or against a DstTrust whose status is not IN {FORMING, FUNDING}, is a prohibited refinancing"
    error_id: ERR_REFINANCING_PROHIBITED
    http_status: 422
    applies_to: "POST /loan-facilities/{loan_id}/reprice"

  - priority: 35
    category: business_safety
    check: "trustee power restriction: trust-level debt must be NON_RECOURSE at creation, at repricing and at funding"
    error_id: ERR_RECOURSE_DEBT_PROHIBITED
    http_status: 422
    applies_to: "POST /loan-facilities, POST /loan-facilities/{loan_id}/reprice, POST /loan-facilities/{loan_id}/fund"

  - priority: 36
    category: business_safety
    check: "trustee power restriction: a CapitalNeed with need_type == STRUCTURAL_CAPEX may not be funded from trust reserves (funding_source RESERVE); only the master tenant may fund it"
    error_id: ERR_STRUCTURAL_CAPEX_PROHIBITED
    http_status: 422
    applies_to: "POST /capital-needs/{capital_need_id}/fund"

  - priority: 37
    category: business_safety
    check: "trustee power restriction: the trust may not enter into a new lease once it is OPERATING and already has a MasterLease in status EXECUTED"
    error_id: ERR_NEW_LEASE_PROHIBITED
    http_status: 422
    applies_to: "POST /master-leases"

  - priority: 38
    category: business_temporal
    check: "the logical clock is at or before ExchangeFile.identification_deadline (inclusive boundary)"
    error_id: ERR_IDENTIFICATION_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /property-identifications, POST /property-identifications/{identification_id}/revoke"

  - priority: 39
    category: business_temporal
    check: "the logical clock is at or before ExchangeFile.exchange_deadline (inclusive boundary)"
    error_id: ERR_EXCHANGE_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /subscriptions, POST /subscriptions/{subscription_id}/close"

  - priority: 40
    category: business_temporal
    check: "the logical clock is at or before Property.contract_close_deadline"
    error_id: ERR_PROPERTY_CONTRACT_EXPIRED
    http_status: 422
    applies_to: "POST /properties/{property_id}/acquire"

  - priority: 41
    category: business_temporal
    check: "the logical clock is at or after Distribution.period_end (a period may not be paid before it has ended)"
    error_id: ERR_DISTRIBUTION_PERIOD_NOT_ENDED
    http_status: 422
    applies_to: "POST /distributions/{distribution_id}/pay"

  - priority: 42
    category: business_constraint
    check: "the identification rule elected on the ExchangeFile is satisfied by the ACTIVE identifications plus the pending row, per calculations.identification_rule_capacity"
    error_id: ERR_IDENTIFICATION_RULE_VIOLATION
    http_status: 422
    applies_to: "POST /property-identifications"

  - priority: 43
    category: business_constraint
    check: "no ACTIVE PropertyIdentification already names this (exchange_file_id, property_id) pair"
    error_id: ERR_DUPLICATE_IDENTIFICATION
    http_status: 409
    applies_to: "POST /property-identifications"

  - priority: 44
    category: business_constraint
    check: "the requested [period_start, period_end) half-open interval does not overlap any Distribution on the same DstTrust in status IN {DECLARED, PAID}; intervals that merely touch (previous period_end == new period_start) do NOT overlap"
    error_id: ERR_DISTRIBUTION_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /distributions"

  - priority: 45
    category: business_constraint
    check: "the requested [term_start_on, term_end_on] CLOSED interval does not overlap any MasterLease in status IN {DRAFT, EXECUTED} on any DstTrust holding the same Property (join MasterLease.trust_id -> DstTrust.property_id); a single shared endpoint day IS an overlap"
    error_id: ERR_LEASE_TERM_OVERLAP
    http_status: 409
    applies_to: "POST /master-leases"

  - priority: 46
    category: business_constraint
    check: "the trust does not already have a LoanFacility in status IN {COMMITTED, FUNDED}"
    error_id: ERR_MULTIPLE_LOANS_PROHIBITED
    http_status: 409
    applies_to: "POST /loan-facilities"

  - priority: 47
    category: business_constraint
    check: "the Property is not already held by a DstTrust in status IN {FORMING, FUNDING, OPERATING, WINDING_DOWN}"
    error_id: ERR_PROPERTY_ALREADY_TRUSTED
    http_status: 409
    applies_to: "POST /trusts"

  - priority: 48
    category: business_constraint
    check: "no ExitConsent already exists for this (exit_event_id, subscription_id) pair"
    error_id: ERR_DUPLICATE_CONSENT
    http_status: 409
    applies_to: "POST /exit-consents"

  - priority: 49
    category: business_constraint
    check: "no TaxStatement already exists for this (trust_id, subscription_id, tax_year, allocation_variant) quadruple; the SAME subscription and year MAY carry one statement per allocation convention, so the two conventions can be compared side by side"
    error_id: ERR_DUPLICATE_TAX_STATEMENT
    http_status: 409
    applies_to: "POST /tax-statements"

  - priority: 50
    category: business_constraint
    check: "at least one ExitConsent row exists on the ExitEvent (an empty consent set is never a passing tally)"
    error_id: ERR_NO_CONSENTS_RECORDED
    http_status: 422
    applies_to: "POST /exit-events/{exit_event_id}/tally-consents"

  - priority: 51
    category: business_referential
    check: "Subscription.offering_id equals Investor.suitability_offering_id (the suitability review was scoped to a different offering)"
    error_id: ERR_SUITABILITY_OFFERING_MISMATCH
    http_status: 422
    applies_to: "POST /subscriptions"

  - priority: 52
    category: business_referential
    check: "ExchangeFile.investor_id equals the Subscription's investor_id"
    error_id: ERR_EXCHANGE_FILE_INVESTOR_MISMATCH
    http_status: 422
    applies_to: "POST /subscriptions"

  - priority: 53
    category: business_referential
    check: "the Subscription's ExchangeFile has an ACTIVE PropertyIdentification naming the DstTrust's property_id"
    error_id: ERR_IDENTIFICATION_MISSING_FOR_TRUST
    http_status: 422
    applies_to: "POST /subscriptions, POST /subscriptions/{subscription_id}/close"

  - priority: 54
    category: business_fiscal
    check: "units_requested >= Offering.min_units_per_investor"
    error_id: ERR_BELOW_MINIMUM_INVESTMENT
    http_status: 422
    applies_to: "POST /subscriptions"

  - priority: 55
    category: business_fiscal
    check: "investment_amount_cents <= Investor.suitability_cap_cents"
    error_id: ERR_SUITABILITY_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /subscriptions"

  - priority: 56
    category: business_fiscal
    check: "boot_cents <= ExchangeFile.boot_tolerance_cents, per calculations.subscription_boot"
    error_id: ERR_BOOT_EXCEEDS_TOLERANCE
    http_status: 422
    applies_to: "POST /subscriptions"

  - priority: 57
    category: business_fiscal
    check: "the offering still has room: Offering.equity_committed_cents < Offering.target_equity_cents AND Offering.units_committed + units_requested <= DstTrust.total_units. The straddling subscription that crosses target_equity_cents is accepted; only a subscription arriving when the target is ALREADY met (or one that would exceed authorised units) is rejected."
    error_id: ERR_OFFERING_OVERSUBSCRIBED
    http_status: 422
    applies_to: "POST /subscriptions"

  - priority: 58
    category: business_fiscal
    check: "principal_cents * 10000 <= Property.appraised_value_cents * MAX_LTV_BPS, per calculations.loan_ltv_check"
    error_id: ERR_LTV_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /loan-facilities, POST /loan-facilities/{loan_id}/reprice, POST /loan-facilities/{loan_id}/fund"

  - priority: 59
    category: business_fiscal
    check: "Property.annual_noi_cents * 10000 >= annual_debt_service_cents * MIN_DSCR_BPS, per calculations.loan_dscr"
    error_id: ERR_DSCR_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /loan-facilities, POST /loan-facilities/{loan_id}/reprice, POST /loan-facilities/{loan_id}/fund"

  - priority: 60
    category: business_fiscal
    check: "DstTrust.total_units * Offering.unit_price_cents >= Offering.target_equity_cents (the authorised units must be able to raise the grossed-up equity; equality passes)"
    error_id: ERR_OFFERING_CAPACITY_SHORTFALL
    http_status: 422
    applies_to: "POST /offerings/{offering_id}/declare-effective"

  - priority: 61
    category: business_fiscal
    check: "DstTrust.reserve_balance_cents >= CapitalNeed.amount_cents when funding_source == RESERVE"
    error_id: ERR_RESERVE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /capital-needs/{capital_need_id}/fund"

  - priority: 62
    category: business_fiscal
    check: "DstTrust.operating_balance_cents >= the amount about to leave the operating bucket (the FINAL_CASH distribution amount plus its reserve replenishment, or the debt-service payment amount)"
    error_id: ERR_OPERATING_CASH_INSUFFICIENT
    http_status: 422
    applies_to: "POST /distributions/{distribution_id}/pay, POST /trusts/{trust_id}/debt-service-payments"

# =====================================================================
# §1.5 API Endpoint Table
#   * Every list endpoint accepts `limit?` and `offset?` and returns the
#     paginated envelope declared in §1.0.
#   * Every FK declared in §1.1 is reverse-reachable through the matching
#     filtered-list GET below.
# =====================================================================
endpoints:
  # ---------------- logical clock (test-driving endpoint) ----------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. The clock's startup default is EXACTLY 2026-08-01T00:00:00Z: before any call to this endpoint every deadline, expiry and window rule evaluates against 2026-08-01T00:00:00Z, and the server never falls back to real wall-clock time. Time only ever moves when this endpoint is called."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["all subsequent requests evaluate deadlines, expiries and accruals against the new instant"]

  # ---------------- Property ----------------
  - method: POST
    path: "/properties"
    description: "Registers a candidate replacement property under contract."
    roles: [SponsorPrincipal]
    code: 201
    input: [name, state_code, asset_type, purchase_price_cents, appraised_value_cents, annual_noi_cents, occupancy_rate, contract_close_deadline]
    output: Property
    side_effects: ["creates the Property in status UNDER_CONTRACT"]
  - method: GET
    path: "/properties/{property_id}"
    description: "Reads one property."
    roles: [SponsorPrincipal, ComplianceOfficer, Trustee, Investor, MasterTenant, QualifiedIntermediary, PlatformAdmin]
    code: 200
    input: []
    output: Property
    side_effects: []
  - method: GET
    path: "/properties"
    description: "Lists properties, filterable by state, asset class and status."
    roles: [SponsorPrincipal, ComplianceOfficer, Trustee, Investor, MasterTenant, QualifiedIntermediary, PlatformAdmin]
    code: 200
    input: ["state_code?", "asset_type?", "status?", "limit?", "offset?"]
    output: Property[]
    side_effects: []
  - method: POST
    path: "/properties/{property_id}/acquire"
    description: "Closes the purchase of the property."
    roles: [SponsorPrincipal]
    code: 200
    input: []
    output: Property
    side_effects: ["Property UNDER_CONTRACT -> ACQUIRED", "sets acquired_at", "computes depreciable_basis_cents per calculations.property_depreciable_basis"]
  - method: POST
    path: "/properties/{property_id}/expire-contract"
    description: "Records that the purchase contract lapsed unexercised."
    roles: [SponsorPrincipal]
    code: 200
    input: []
    output: Property
    side_effects: ["Property UNDER_CONTRACT -> CONTRACT_EXPIRED", "recomputes posture of every DstTrust on this property, driving them to FROZEN"]

  # ---------------- DstTrust ----------------
  - method: POST
    path: "/trusts"
    description: "Forms a Delaware statutory trust to hold one replacement property."
    roles: [Trustee]
    code: 201
    input: [property_id, trust_name, total_units, reserve_floor_cents, reserve_target_pct]
    output: DstTrust
    side_effects: ["creates the DstTrust in status FORMING with posture OPEN and all balances 0"]
  - method: GET
    path: "/trusts/{trust_id}"
    description: "Reads one trust, including its derived balances, units_issued and posture."
    roles: [SponsorPrincipal, ComplianceOfficer, Trustee, Investor, MasterTenant, QualifiedIntermediary, PlatformAdmin]
    code: 200
    input: []
    output: DstTrust
    side_effects: []
  - method: GET
    path: "/trusts"
    description: "Lists trusts; filtering by property_id makes DstTrust.property_id reverse-reachable."
    roles: [SponsorPrincipal, ComplianceOfficer, Trustee, Investor, MasterTenant, QualifiedIntermediary, PlatformAdmin]
    code: 200
    input: ["property_id?", "status?", "posture?", "limit?", "offset?"]
    output: DstTrust[]
    side_effects: []
  - method: POST
    path: "/trusts/{trust_id}/open-funding"
    description: "Opens the trust for investor closings once the property is acquired, an offering is effective and a facility is committed."
    roles: [Trustee]
    code: 200
    input: []
    output: DstTrust
    side_effects: ["DstTrust FORMING -> FUNDING", "sets property_acquired_at from Property.acquired_at", "increments DstTrust.version by 1"]
  - method: GET
    path: "/trusts/{trust_id}/investor-report"
    description: "Computed read: the ongoing investor report for the trust, per calculations.investor_report_rollup."
    roles: [SponsorPrincipal, ComplianceOfficer, Trustee, Investor, PlatformAdmin]
    code: 200
    input: []
    output: "{ trust_id: string, status: string, posture: string, units_issued: integer, units_available: integer, equity_raised_cents: integer, operating_balance_cents: integer, reserve_balance_cents: integer, reserve_target_cents: integer, reserve_variance_cents: integer, distributions_paid_cents: integer, closed_investor_count: integer }"
    side_effects: []
  - method: POST
    path: "/trusts/{trust_id}/rent-postings"
    description: "Master tenant remits rent to the trust; books a RENT_RECEIPT ledger entry at the current logical-clock instant."
    roles: [MasterTenant]
    code: 201
    input: [rent_kind, amount_cents]
    output: TrustLedgerEntry
    side_effects: ["creates TrustLedgerEntry entry_type RENT_RECEIPT, bucket OPERATING, amount_cents = +amount_cents, source_kind RENT_POSTING, occurred_at = logical clock now", "recomputes DstTrust.operating_balance_cents and posture", "increments DstTrust.version by 1"]
  - method: POST
    path: "/trusts/{trust_id}/debt-service-payments"
    description: "Trustee pays scheduled interest to the lender; books a DEBT_SERVICE ledger entry at the current logical-clock instant."
    roles: [Trustee]
    code: 201
    input: [amount_cents]
    output: TrustLedgerEntry
    side_effects: ["creates TrustLedgerEntry entry_type DEBT_SERVICE, bucket OPERATING, amount_cents = -amount_cents, source_kind DEBT_SERVICE_POSTING, occurred_at = logical clock now", "recomputes DstTrust.operating_balance_cents and posture", "increments DstTrust.version by 1"]

  # ---------------- Offering ----------------
  - method: POST
    path: "/offerings"
    description: "Drafts the private placement offering for a trust."
    roles: [SponsorPrincipal]
    code: 201
    input: [trust_id, exemption_rule, unit_price_cents, min_units_per_investor, load_pct, closing_costs_cents, reserve_funding_pct, rescission_window_days]
    output: Offering
    side_effects: ["creates the Offering in status DRAFT with ppm_version 1"]
  - method: GET
    path: "/offerings/{offering_id}"
    description: "Reads one offering, including its computed capital-stack fields and current version."
    roles: [SponsorPrincipal, ComplianceOfficer, Trustee, Investor, MasterTenant, QualifiedIntermediary, PlatformAdmin]
    code: 200
    input: []
    output: Offering
    side_effects: []
  - method: GET
    path: "/offerings"
    description: "Lists offerings; filtering by trust_id makes Offering.trust_id reverse-reachable."
    roles: [SponsorPrincipal, ComplianceOfficer, Trustee, Investor, MasterTenant, QualifiedIntermediary, PlatformAdmin]
    code: 200
    input: ["trust_id?", "status?", "exemption_rule?", "limit?", "offset?"]
    output: Offering[]
    side_effects: []
  - method: POST
    path: "/offerings/{offering_id}/submit-ppm"
    description: "Sponsor submits the private placement memorandum for compliance review."
    roles: [SponsorPrincipal]
    code: 200
    input: [ppm_document_reference]
    output: Offering
    side_effects: ["Offering DRAFT -> UNDER_REVIEW", "records ppm_submitted_by_user_id = acting X-User-ID", "increments Offering.version by 1"]
  - method: POST
    path: "/offerings/{offering_id}/return-ppm"
    description: "Compliance returns the memorandum for revision; this is the cyclic edge of the offering machine."
    roles: [ComplianceOfficer]
    code: 200
    input: ["review_note?"]
    output: Offering
    side_effects: ["Offering UNDER_REVIEW -> DRAFT", "increments Offering.ppm_version by 1", "increments Offering.version by 1"]
  - method: POST
    path: "/offerings/{offering_id}/declare-effective"
    description: "Compliance declares the offering effective, pinning the capital stack. The acting officer must not be the sponsor who submitted the memorandum, and acknowledged_ppm_version must match the current revision."
    roles: [ComplianceOfficer]
    code: 200
    input: [acknowledged_ppm_version]
    output: Offering
    side_effects: ["Offering UNDER_REVIEW -> EFFECTIVE", "sets effective_at", "computes initial_reserve_cents, target_equity_cents and sponsor_load_cents per calculations.offering_capital_stack_grossup", "increments Offering.version by 1"]
  - method: POST
    path: "/offerings/{offering_id}/withdraw"
    description: "Compliance withdraws an unlaunched offering."
    roles: [ComplianceOfficer]
    code: 200
    input: ["reason?"]
    output: Offering
    side_effects: ["Offering DRAFT|UNDER_REVIEW -> WITHDRAWN", "every Subscription on the offering in status IN {RESERVED, REVISION_REQUIRED} transitions to REJECTED", "increments Offering.version by 1"]
  - method: GET
    path: "/offerings/{offering_id}/capital-stack"
    description: "Computed read: the grossed-up capital stack for the offering, per calculations.offering_capital_stack_grossup."
    roles: [SponsorPrincipal, ComplianceOfficer, Trustee, Investor, PlatformAdmin]
    code: 200
    input: []
    output: "{ offering_id: string, purchase_price_cents: integer, closing_costs_cents: integer, loan_principal_cents: integer, initial_reserve_cents: integer, net_acquisition_cents: integer, base_need_cents: integer, target_equity_cents: integer, sponsor_load_cents: integer, unit_capacity_cents: integer, equity_committed_cents: integer, equity_remaining_cents: integer }"
    side_effects: []

  # ---------------- Investor ----------------
  - method: POST
    path: "/investors"
    description: "Onboards a prospective beneficial owner."
    roles: [SponsorPrincipal, PlatformAdmin]
    code: 201
    input: [legal_name, entity_type, accreditation_method, annual_income_cents, net_worth_cents, liquid_net_worth_cents]
    output: Investor
    side_effects: ["creates the Investor with accreditation_status UNVERIFIED and suitability_status NOT_REVIEWED"]
  - method: GET
    path: "/investors/{investor_id}"
    description: "Reads one investor, including both status dimensions and the suitability cap."
    roles: [SponsorPrincipal, ComplianceOfficer, Trustee, Investor, QualifiedIntermediary, PlatformAdmin]
    code: 200
    input: []
    output: Investor
    side_effects: []
  - method: GET
    path: "/investors"
    description: "Lists investors; filtering by suitability_offering_id makes Investor.suitability_offering_id reverse-reachable."
    roles: [SponsorPrincipal, ComplianceOfficer, Trustee, Investor, QualifiedIntermediary, PlatformAdmin]
    code: 200
    input: ["entity_type?", "accreditation_status?", "suitability_status?", "suitability_offering_id?", "limit?", "offset?"]
    output: Investor[]
    side_effects: []
  - method: POST
    path: "/investors/{investor_id}/verify-accreditation"
    description: "Compliance verifies accreditation (dimension A only; suitability is untouched)."
    roles: [ComplianceOfficer]
    code: 200
    input: [evidence_reference]
    output: Investor
    side_effects: ["Investor.accreditation_status UNVERIFIED -> VERIFIED", "sets accreditation_verified_at = logical clock now and accreditation_expires_at = +90 days", "leaves suitability_status at its current value"]
  - method: POST
    path: "/investors/{investor_id}/lapse-accreditation"
    description: "Compliance records that a verification has aged out (dimension A only)."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Investor
    side_effects: ["Investor.accreditation_status VERIFIED -> EXPIRED", "leaves suitability_status and suitability_cap_cents unchanged"]
  - method: POST
    path: "/investors/{investor_id}/review-suitability"
    description: "Compliance reviews suitability for one specific effective offering (dimension B only; accreditation is untouched)."
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, offering_id]
    output: Investor
    side_effects: ["Investor.suitability_status NOT_REVIEWED -> APPROVED|DECLINED", "sets suitability_offering_id = offering_id and suitability_reviewed_by_user_id = acting X-User-ID", "computes suitability_cap_cents per calculations.investor_suitability_cap (0 when DECLINED)", "leaves accreditation_status unchanged"]

  # ---------------- ExchangeFile ----------------
  - method: POST
    path: "/exchange-files"
    description: "Qualified intermediary opens a 1031 exchange file for an investor."
    roles: [QualifiedIntermediary]
    code: 201
    input: ["investor_id", "qi_reference", "relinquished_closed_on", "relinquished_sale_price_cents", "net_proceeds_cents", "debt_retired_cents", "identification_rule", "boot_tolerance_cents?"]
    output: ExchangeFile
    side_effects: ["creates the ExchangeFile in status OPEN", "computes identification_deadline and exchange_deadline per calculations.exchange_file_deadlines"]
  - method: GET
    path: "/exchange-files/{exchange_file_id}"
    description: "Reads one exchange file, including both deadlines."
    roles: [SponsorPrincipal, ComplianceOfficer, Trustee, Investor, QualifiedIntermediary, PlatformAdmin]
    code: 200
    input: []
    output: ExchangeFile
    side_effects: []
  - method: GET
    path: "/exchange-files"
    description: "Lists exchange files; filtering by investor_id and source_exit_event_id makes both ExchangeFile FKs reverse-reachable (successor files created by an exit close are discoverable only here)."
    roles: [SponsorPrincipal, ComplianceOfficer, Trustee, Investor, QualifiedIntermediary, PlatformAdmin]
    code: 200
    input: ["investor_id?", "source_exit_event_id?", "status?", "identification_rule?", "limit?", "offset?"]
    output: ExchangeFile[]
    side_effects: []
  - method: POST
    path: "/exchange-files/{exchange_file_id}/mark-expired"
    description: "Qualified intermediary closes out a file whose identification or exchange deadline has passed."
    roles: [QualifiedIntermediary]
    code: 200
    input: []
    output: ExchangeFile
    side_effects: ["ExchangeFile OPEN|IDENTIFIED -> EXPIRED", "every Subscription on the file in status IN {RESERVED, REVISION_REQUIRED} transitions to REJECTED"]

  # ---------------- PropertyIdentification ----------------
  - method: POST
    path: "/property-identifications"
    description: "Files an identification of a replacement property against an exchange file."
    roles: [QualifiedIntermediary]
    code: 201
    input: [exchange_file_id, property_id, fair_market_value_cents]
    output: PropertyIdentification
    side_effects: ["creates the PropertyIdentification in status ACTIVE with identified_at = logical clock now and the next sequence_no", "transitions the ExchangeFile OPEN -> IDENTIFIED on the first ACTIVE row"]
  - method: GET
    path: "/property-identifications/{identification_id}"
    description: "Reads one identification."
    roles: [SponsorPrincipal, ComplianceOfficer, Trustee, Investor, QualifiedIntermediary, PlatformAdmin]
    code: 200
    input: []
    output: PropertyIdentification
    side_effects: []
  - method: GET
    path: "/property-identifications"
    description: "Lists identifications; filtering by exchange_file_id and property_id makes both FKs reverse-reachable."
    roles: [SponsorPrincipal, ComplianceOfficer, Trustee, Investor, QualifiedIntermediary, PlatformAdmin]
    code: 200
    input: ["exchange_file_id?", "property_id?", "status?", "limit?", "offset?"]
    output: PropertyIdentification[]
    side_effects: []
  - method: POST
    path: "/property-identifications/{identification_id}/revoke"
    description: "Withdraws an identification while the 45-day window is still open."
    roles: [QualifiedIntermediary]
    code: 200
    input: ["reason?"]
    output: PropertyIdentification
    side_effects: ["PropertyIdentification ACTIVE -> REVOKED", "when no ACTIVE row remains, transitions the ExchangeFile IDENTIFIED -> OPEN"]

  # ---------------- Subscription ----------------
  - method: POST
    path: "/subscriptions"
    description: "Reserves units for an investor against an effective offering. Carries the OCC field expected_offering_version."
    roles: [SponsorPrincipal]
    code: 201
    input: [offering_id, investor_id, exchange_file_id, units_requested, expected_offering_version]
    output: Subscription
    side_effects: ["creates the Subscription in status RESERVED", "computes investment_amount_cents and boot_cents per calculations.subscription_boot", "recomputes Offering.units_committed and equity_committed_cents", "increments Offering.version by 1"]
  - method: GET
    path: "/subscriptions/{subscription_id}"
    description: "Reads one subscription, including closing_sequence_no and rescission_deadline."
    roles: [SponsorPrincipal, ComplianceOfficer, Trustee, Investor, QualifiedIntermediary, PlatformAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: []
  - method: GET
    path: "/subscriptions"
    description: "Lists subscriptions; filtering by offering_id, investor_id and exchange_file_id makes all three Subscription FKs reverse-reachable."
    roles: [SponsorPrincipal, ComplianceOfficer, Trustee, Investor, QualifiedIntermediary, PlatformAdmin]
    code: 200
    input: ["offering_id?", "investor_id?", "exchange_file_id?", "status?", "limit?", "offset?"]
    output: Subscription[]
    side_effects: []
  - method: POST
    path: "/subscriptions/{subscription_id}/close"
    description: "Closes the subscription into the trust. The acting sponsor must not be the compliance officer who approved the investor's suitability. This is the head of the four-hop closing cascade."
    roles: [SponsorPrincipal]
    code: 200
    input: []
    output: Subscription
    side_effects: ["Subscription RESERVED -> CLOSED with closed_at, closing_sequence_no and rescission_deadline", "books TrustLedgerEntry EQUITY_CONTRIBUTION and recomputes DstTrust.units_issued, equity_raised_cents, operating_balance_cents", "transitions the ExchangeFile IDENTIFIED -> CLOSED_MATCHED", "when equity_raised_cents >= Offering.target_equity_cents: DstTrust FUNDING -> OPERATING (hop 2), which books SPONSOR_LOAD, ACQUISITION_PAYMENT and the two RESERVE_FUNDING legs, then closes the Offering (hop 3), which rejects every other RESERVED Subscription (hop 4)", "increments DstTrust.version by 1"]
  - method: POST
    path: "/subscriptions/{subscription_id}/reject"
    description: "Compliance rejects a reserved or revision-required subscription."
    roles: [ComplianceOfficer]
    code: 200
    input: ["reason?"]
    output: Subscription
    side_effects: ["Subscription RESERVED|REVISION_REQUIRED -> REJECTED", "recomputes Offering.units_committed and equity_committed_cents", "increments Offering.version by 1"]
  - method: POST
    path: "/subscriptions/{subscription_id}/rescind"
    description: "Investor rescinds a closed subscription inside the rescission window; the compensating ledger reversal must leave DstTrust.units_issued exactly as it was before the close."
    roles: [Investor]
    code: 200
    input: []
    output: Subscription
    side_effects: ["Subscription CLOSED -> RESCINDED", "books a REVERSAL TrustLedgerEntry against the close's EQUITY_CONTRIBUTION entry", "recomputes DstTrust.units_issued, equity_raised_cents and operating_balance_cents", "clears closing_sequence_no and renumbers remaining CLOSED subscriptions", "transitions the ExchangeFile CLOSED_MATCHED -> OPEN (or EXPIRED when its identification_deadline has passed)", "increments DstTrust.version by 1"]

  # ---------------- LoanFacility ----------------
  - method: POST
    path: "/loan-facilities"
    description: "Commits trust-level non-recourse debt."
    roles: [Trustee]
    code: 201
    input: [trust_id, lender_name, principal_cents, rate_bps, recourse_type, maturity_on]
    output: LoanFacility
    side_effects: ["creates the LoanFacility in status COMMITTED", "computes ltv_pct and dscr per calculations.loan_ltv_check and calculations.loan_dscr"]
  - method: GET
    path: "/loan-facilities/{loan_id}"
    description: "Reads one facility."
    roles: [SponsorPrincipal, ComplianceOfficer, Trustee, Investor, PlatformAdmin]
    code: 200
    input: []
    output: LoanFacility
    side_effects: []
  - method: GET
    path: "/loan-facilities"
    description: "Lists facilities; filtering by trust_id makes LoanFacility.trust_id reverse-reachable."
    roles: [SponsorPrincipal, ComplianceOfficer, Trustee, Investor, PlatformAdmin]
    code: 200
    input: ["trust_id?", "status?", "recourse_type?", "limit?", "offset?"]
    output: LoanFacility[]
    side_effects: []
  - method: POST
    path: "/loan-facilities/{loan_id}/reprice"
    description: "Re-cuts committed (not yet closed) debt terms. Permitted only while the trust is FORMING or FUNDING; against an OPERATING trust the same call is a prohibited refinancing. This is the head of the three-hop repricing cascade."
    roles: [Trustee]
    code: 200
    input: [principal_cents, rate_bps, recourse_type]
    output: LoanFacility
    side_effects: ["updates principal_cents and rate_bps, increments repriced_count, recomputes ltv_pct and dscr (hop 1)", "the trust's EFFECTIVE Offering returns to DRAFT with ppm_version incremented and its capital stack recomputed (hop 2)", "every RESERVED Subscription on that offering transitions to REVISION_REQUIRED (hop 3)"]
  - method: POST
    path: "/loan-facilities/{loan_id}/fund"
    description: "Draws the facility at closing."
    roles: [Trustee]
    code: 200
    input: []
    output: LoanFacility
    side_effects: ["LoanFacility COMMITTED -> FUNDED with funded_at", "books TrustLedgerEntry LOAN_PROCEEDS bucket OPERATING amount_cents = +principal_cents", "recomputes DstTrust.operating_balance_cents", "increments DstTrust.version by 1"]

  # ---------------- MasterLease ----------------
  - method: POST
    path: "/master-leases"
    description: "Drafts the master lease to the master tenant. The closed term interval may not overlap any DRAFT or EXECUTED lease on any trust holding the same property."
    roles: [Trustee]
    code: 201
    input: [trust_id, master_tenant_user_id, term_start_on, term_end_on, base_rent_annual_cents, supplemental_rent_annual_cents]
    output: MasterLease
    side_effects: ["creates the MasterLease in status DRAFT"]
  - method: GET
    path: "/master-leases/{lease_id}"
    description: "Reads one master lease."
    roles: [SponsorPrincipal, ComplianceOfficer, Trustee, Investor, MasterTenant, PlatformAdmin]
    code: 200
    input: []
    output: MasterLease
    side_effects: []
  - method: GET
    path: "/master-leases"
    description: "Lists master leases; filtering by trust_id makes MasterLease.trust_id reverse-reachable."
    roles: [SponsorPrincipal, ComplianceOfficer, Trustee, Investor, MasterTenant, PlatformAdmin]
    code: 200
    input: ["trust_id?", "status?", "master_tenant_user_id?", "limit?", "offset?"]
    output: MasterLease[]
    side_effects: []
  - method: POST
    path: "/master-leases/{lease_id}/execute"
    description: "Executes the master lease, unblocking rent postings and distribution declarations."
    roles: [Trustee]
    code: 200
    input: []
    output: MasterLease
    side_effects: ["MasterLease DRAFT -> EXECUTED with executed_at"]
  - method: POST
    path: "/master-leases/{lease_id}/terminate"
    description: "Terminates an executed master lease."
    roles: [Trustee]
    code: 200
    input: ["reason?"]
    output: MasterLease
    side_effects: ["MasterLease EXECUTED -> TERMINATED"]

  # ---------------- TrustLedgerEntry ----------------
  - method: GET
    path: "/ledger-entries/{ledger_entry_id}"
    description: "Reads one ledger entry."
    roles: [SponsorPrincipal, ComplianceOfficer, Trustee, Investor, MasterTenant, PlatformAdmin]
    code: 200
    input: []
    output: TrustLedgerEntry
    side_effects: []
  - method: GET
    path: "/ledger-entries"
    description: "Lists ledger entries; filtering by trust_id and reversal_of_entry_id makes both TrustLedgerEntry FKs (including the self-reference) reverse-reachable. Cascade-created entries are discoverable only here."
    roles: [SponsorPrincipal, ComplianceOfficer, Trustee, Investor, MasterTenant, PlatformAdmin]
    code: 200
    input: ["trust_id?", "reversal_of_entry_id?", "entry_type?", "bucket?", "source_kind?", "limit?", "offset?"]
    output: TrustLedgerEntry[]
    side_effects: []

  # ---------------- CapitalNeed ----------------
  - method: POST
    path: "/capital-needs"
    description: "Records a capital need at the property."
    roles: [Trustee, MasterTenant]
    code: 201
    input: [trust_id, need_type, amount_cents, needed_by]
    output: CapitalNeed
    side_effects: ["creates the CapitalNeed in status IDENTIFIED"]
  - method: GET
    path: "/capital-needs/{capital_need_id}"
    description: "Reads one capital need."
    roles: [SponsorPrincipal, ComplianceOfficer, Trustee, Investor, MasterTenant, PlatformAdmin]
    code: 200
    input: []
    output: CapitalNeed
    side_effects: []
  - method: GET
    path: "/capital-needs"
    description: "Lists capital needs; filtering by trust_id makes CapitalNeed.trust_id reverse-reachable."
    roles: [SponsorPrincipal, ComplianceOfficer, Trustee, Investor, MasterTenant, PlatformAdmin]
    code: 200
    input: ["trust_id?", "status?", "need_type?", "funding_source?", "limit?", "offset?"]
    output: CapitalNeed[]
    side_effects: []
  - method: POST
    path: "/capital-needs/{capital_need_id}/fund"
    description: "Funds a capital need. funding_source RESERVE draws the trust reserve (Trustee); MASTER_TENANT funds it outside the trust books (MasterTenant); CAPITAL_CALL is never permitted because the trust may not call capital from beneficial owners."
    roles: [Trustee, MasterTenant]
    code: 200
    input: [funding_source]
    output: CapitalNeed
    side_effects: ["CapitalNeed IDENTIFIED -> FUNDED with funding_source and funded_at", "for RESERVE: books TrustLedgerEntry RESERVE_DRAW bucket RESERVE amount_cents = -amount_cents, recomputes DstTrust.reserve_balance_cents and then posture (RESTRICTED when below reserve_floor_cents), increments DstTrust.version by 1", "for MASTER_TENANT: books no ledger entry and leaves every trust balance unchanged"]
  - method: POST
    path: "/capital-needs/{capital_need_id}/void"
    description: "Voids a capital need; a reserve-funded need is compensated by an exact ledger reversal so reserve cash is conserved."
    roles: [Trustee]
    code: 200
    input: ["reason?"]
    output: CapitalNeed
    side_effects: ["CapitalNeed IDENTIFIED|FUNDED -> VOIDED", "for a RESERVE-funded need: books TrustLedgerEntry REVERSAL bucket RESERVE amount_cents = +amount_cents with reversal_of_entry_id = the RESERVE_DRAW entry", "recomputes DstTrust.reserve_balance_cents and posture", "increments DstTrust.version by 1"]

  # ---------------- Distribution ----------------
  - method: POST
    path: "/distributions"
    description: "Declares a distribution for a half-open period. The provisional amount is the accrual variant. Carries the OCC field expected_trust_version."
    roles: [Trustee]
    code: 201
    input: [trust_id, kind, period_start, period_end, expected_trust_version]
    output: Distribution
    side_effects: ["creates the Distribution in status DECLARED", "computes provisional_amount_cents under variant PROVISIONAL_ACCRUAL per calculations.distribution_distributable", "increments DstTrust.version by 1"]
  - method: GET
    path: "/distributions/{distribution_id}"
    description: "Reads one distribution, including both variant amounts and the reconciliation delta."
    roles: [SponsorPrincipal, ComplianceOfficer, Trustee, Investor, PlatformAdmin]
    code: 200
    input: []
    output: Distribution
    side_effects: []
  - method: GET
    path: "/distributions"
    description: "Lists distributions; filtering by trust_id makes Distribution.trust_id reverse-reachable."
    roles: [SponsorPrincipal, ComplianceOfficer, Trustee, Investor, PlatformAdmin]
    code: 200
    input: ["trust_id?", "status?", "kind?", "limit?", "offset?"]
    output: Distribution[]
    side_effects: []
  - method: POST
    path: "/distributions/{distribution_id}/pay"
    description: "Pays the distribution using the FINAL_CASH variant and splits it across closed subscriptions with the pinned round-then-sweep allocation."
    roles: [Trustee]
    code: 200
    input: []
    output: Distribution
    side_effects: ["Distribution DECLARED -> PAID with final_amount_cents and reconciliation_delta_cents", "creates one DistributionAllocation per CLOSED Subscription per calculations.distribution_allocation_rounding", "books TrustLedgerEntry DISTRIBUTION_PAYMENT and the two reserve-replenishment legs", "recomputes DstTrust.operating_balance_cents, reserve_balance_cents and posture", "increments DstTrust.version by 1"]
  - method: POST
    path: "/distributions/{distribution_id}/void"
    description: "Voids a declared distribution, releasing its period."
    roles: [Trustee]
    code: 200
    input: ["reason?"]
    output: Distribution
    side_effects: ["Distribution DECLARED -> VOIDED", "the period becomes available to a new declaration"]
  - method: GET
    path: "/distribution-allocations/{allocation_id}"
    description: "Reads one allocation row."
    roles: [SponsorPrincipal, ComplianceOfficer, Trustee, Investor, PlatformAdmin]
    code: 200
    input: []
    output: DistributionAllocation
    side_effects: []
  - method: GET
    path: "/distribution-allocations"
    description: "Lists allocations; filtering by distribution_id and subscription_id makes both DistributionAllocation FKs reverse-reachable. Cascade-created allocations are discoverable only here."
    roles: [SponsorPrincipal, ComplianceOfficer, Trustee, Investor, PlatformAdmin]
    code: 200
    input: ["distribution_id?", "subscription_id?", "limit?", "offset?"]
    output: DistributionAllocation[]
    side_effects: []

  # ---------------- TaxStatement ----------------
  - method: POST
    path: "/tax-statements"
    description: "Prepares a grantor-trust tax statement for one closed subscription under the elected allocation convention."
    roles: [SponsorPrincipal]
    code: 201
    input: [trust_id, subscription_id, tax_year, allocation_variant]
    output: TaxStatement
    side_effects: ["creates the TaxStatement in status DRAFT", "computes rental_income_cents, interest_expense_cents, depreciation_cents and net_taxable_income_cents per calculations.tax_statement_allocation"]
  - method: GET
    path: "/tax-statements/{tax_statement_id}"
    description: "Reads one tax statement."
    roles: [SponsorPrincipal, ComplianceOfficer, Trustee, Investor, PlatformAdmin]
    code: 200
    input: []
    output: TaxStatement
    side_effects: []
  - method: GET
    path: "/tax-statements"
    description: "Lists tax statements; filtering by trust_id and subscription_id makes both TaxStatement FKs reverse-reachable."
    roles: [SponsorPrincipal, ComplianceOfficer, Trustee, Investor, PlatformAdmin]
    code: 200
    input: ["trust_id?", "subscription_id?", "tax_year?", "status?", "allocation_variant?", "limit?", "offset?"]
    output: TaxStatement[]
    side_effects: []
  - method: POST
    path: "/tax-statements/{tax_statement_id}/issue"
    description: "Issues the statement to the beneficial owner."
    roles: [SponsorPrincipal]
    code: 200
    input: []
    output: TaxStatement
    side_effects: ["TaxStatement DRAFT -> ISSUED with issued_at"]

  # ---------------- ExitEvent / ExitConsent ----------------
  - method: POST
    path: "/exit-events"
    description: "Proposes an exit by asset sale or Section 721 conversion."
    roles: [SponsorPrincipal]
    code: 201
    input: [trust_id, exit_mode, gross_price_cents, selling_costs_cents, consent_threshold_pct, expected_close_on]
    output: ExitEvent
    side_effects: ["creates the ExitEvent in status PROPOSED with consented_units 0"]
  - method: GET
    path: "/exit-events/{exit_event_id}"
    description: "Reads one exit event, including the tally and net-proceeds figures."
    roles: [SponsorPrincipal, ComplianceOfficer, Trustee, Investor, PlatformAdmin]
    code: 200
    input: []
    output: ExitEvent
    side_effects: []
  - method: GET
    path: "/exit-events"
    description: "Lists exit events; filtering by trust_id makes ExitEvent.trust_id reverse-reachable."
    roles: [SponsorPrincipal, ComplianceOfficer, Trustee, Investor, PlatformAdmin]
    code: 200
    input: ["trust_id?", "status?", "exit_mode?", "limit?", "offset?"]
    output: ExitEvent[]
    side_effects: []
  - method: POST
    path: "/exit-events/{exit_event_id}/tally-consents"
    description: "Tallies recorded consents against the threshold; on success the trust begins winding down and its posture freezes."
    roles: [SponsorPrincipal]
    code: 200
    input: []
    output: ExitEvent
    side_effects: ["sets consented_units and consent_pct per calculations.exit_consent_tally", "ExitEvent PROPOSED -> APPROVED", "DstTrust OPERATING -> WINDING_DOWN, sets springing_llc_armed for SECTION_721_CONVERSION, recomputes posture to FROZEN", "increments DstTrust.version by 1"]
  - method: POST
    path: "/exit-events/{exit_event_id}/abandon"
    description: "Abandons a proposed exit without touching the trust."
    roles: [SponsorPrincipal]
    code: 200
    input: ["reason?"]
    output: ExitEvent
    side_effects: ["ExitEvent PROPOSED -> ABANDONED", "leaves DstTrust.status and DstTrust.posture unchanged"]
  - method: POST
    path: "/exit-events/{exit_event_id}/close"
    description: "Closes the exit: books proceeds, retires or transfers the debt, sweeps the reserve, declares the liquidating distribution and seeds one successor exchange file per closed subscription."
    roles: [Trustee]
    code: 200
    input: []
    output: ExitEvent
    side_effects: ["ExitEvent APPROVED -> CLOSED with closed_at, net_proceeds_cents and net_proceeds_per_unit_cents per calculations.exit_net_proceeds", "books SALE_PROCEEDS (and LOAN_PAYOFF for ASSET_SALE); LoanFacility FUNDED -> PAID_OFF", "Property ACQUIRED -> DISPOSED", "sweeps the reserve bucket to zero into operating", "creates the LIQUIDATING Distribution in status DECLARED per calculations.exit_liquidating_distribution", "creates one successor ExchangeFile per CLOSED Subscription per calculations.successor_exchange_file_seed", "DstTrust WINDING_DOWN -> TERMINATED (ASSET_SALE) or CONVERTED_LLC (SECTION_721_CONVERSION)", "increments DstTrust.version by 1"]
  - method: POST
    path: "/exit-consents"
    description: "Beneficial owner records a consent or withholding against a proposed exit."
    roles: [Investor]
    code: 201
    input: [exit_event_id, subscription_id, decision]
    output: ExitConsent
    side_effects: ["creates the ExitConsent with units_at_consent = Subscription.units_requested and recorded_at = logical clock now"]
  - method: GET
    path: "/exit-consents/{exit_consent_id}"
    description: "Reads one consent row."
    roles: [SponsorPrincipal, ComplianceOfficer, Trustee, Investor, PlatformAdmin]
    code: 200
    input: []
    output: ExitConsent
    side_effects: []
  - method: GET
    path: "/exit-consents"
    description: "Lists consents; filtering by exit_event_id and subscription_id makes both ExitConsent FKs reverse-reachable."
    roles: [SponsorPrincipal, ComplianceOfficer, Trustee, Investor, PlatformAdmin]
    code: 200
    input: ["exit_event_id?", "subscription_id?", "decision?", "limit?", "offset?"]
    output: ExitConsent[]
    side_effects: []

# =====================================================================
# §1.6 Error Catalogue
# =====================================================================
errors:
  # ---- authentication / authorisation ----
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing, empty, or X-User-Role not one of the seven declared roles."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting X-User-Role is not listed in the target endpoint's roles."
  - id: ERR_FORBIDDEN_NOT_OWNER
    http: 403
    condition: "Role Investor acts on a Subscription, ExitConsent or ExchangeFile whose Investor.id does not equal the acting X-User-ID."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting X-User-ID already performed the conflicting step of the same workflow: declaring effective an offering whose memorandum the same user submitted, or closing a subscription whose investor suitability the same user approved."

  # ---- request shape ----
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "A required input field is absent, has the wrong type, violates an enum domain, is a non-positive amount or unit count, a percentage outside [0,1], or an interval whose start is not strictly before its end."

  # ---- existence ----
  - id: ERR_PROPERTY_NOT_FOUND
    http: 404
    condition: "No Property with the given property_id (path or payload)."
  - id: ERR_TRUST_NOT_FOUND
    http: 404
    condition: "No DstTrust with the given trust_id (path or payload)."
  - id: ERR_OFFERING_NOT_FOUND
    http: 404
    condition: "No Offering with the given offering_id (path or payload)."
  - id: ERR_INVESTOR_NOT_FOUND
    http: 404
    condition: "No Investor with the given investor_id (path or payload)."
  - id: ERR_EXCHANGE_FILE_NOT_FOUND
    http: 404
    condition: "No ExchangeFile with the given exchange_file_id (path or payload)."
  - id: ERR_IDENTIFICATION_NOT_FOUND
    http: 404
    condition: "No PropertyIdentification with the given identification_id."
  - id: ERR_SUBSCRIPTION_NOT_FOUND
    http: 404
    condition: "No Subscription with the given subscription_id (path or payload)."
  - id: ERR_LOAN_NOT_FOUND
    http: 404
    condition: "No LoanFacility with the given loan_id."
  - id: ERR_MASTER_LEASE_NOT_FOUND
    http: 404
    condition: "No MasterLease with the given lease_id."
  - id: ERR_LEDGER_ENTRY_NOT_FOUND
    http: 404
    condition: "No TrustLedgerEntry with the given ledger_entry_id."
  - id: ERR_CAPITAL_NEED_NOT_FOUND
    http: 404
    condition: "No CapitalNeed with the given capital_need_id."
  - id: ERR_DISTRIBUTION_NOT_FOUND
    http: 404
    condition: "No Distribution with the given distribution_id."
  - id: ERR_ALLOCATION_NOT_FOUND
    http: 404
    condition: "No DistributionAllocation with the given allocation_id."
  - id: ERR_TAX_STATEMENT_NOT_FOUND
    http: 404
    condition: "No TaxStatement with the given tax_statement_id."
  - id: ERR_EXIT_EVENT_NOT_FOUND
    http: 404
    condition: "No ExitEvent with the given exit_event_id (path or payload)."
  - id: ERR_EXIT_CONSENT_NOT_FOUND
    http: 404
    condition: "No ExitConsent with the given exit_consent_id."

  # ---- optimistic concurrency ----
  - id: ERR_STALE_OFFERING_VERSION
    http: 412
    condition: "POST /subscriptions carried expected_offering_version different from the Offering's current version."
  - id: ERR_STALE_TRUST_VERSION
    http: 412
    condition: "POST /distributions carried expected_trust_version different from the DstTrust's current version."

  # ---- state (409) ----
  - id: ERR_PROPERTY_INVALID_STATE
    http: 409
    condition: "The Property is not in a status from which the requested transition is defined (for example acquiring a CONTRACT_EXPIRED or already ACQUIRED property)."
  - id: ERR_TRUST_INVALID_STATE
    http: 409
    condition: "The DstTrust is not in a status from which the requested operation is defined (for example opening funding on a FUNDING trust, closing a subscription into a FORMING trust, or declaring a non-liquidating distribution on a trust that is not OPERATING)."
  - id: ERR_TRUST_FROZEN
    http: 409
    condition: "DstTrust.posture is FROZEN, which blocks new subscriptions, master leases, capital-need funding and every non-LIQUIDATING distribution declaration."
  - id: ERR_TRUST_RESTRICTED
    http: 409
    condition: "DstTrust.posture is RESTRICTED (reserve balance below reserve_floor_cents), which blocks distribution declarations and payments while still permitting reserve replenishment and capital-need funding."
  - id: ERR_OFFERING_INVALID_STATE
    http: 409
    condition: "The Offering is not in a status from which the requested transition is defined (submitting a memorandum that is already UNDER_REVIEW, returning a DRAFT memorandum, declaring effective anything other than UNDER_REVIEW, or withdrawing an EFFECTIVE/CLOSED offering)."
  - id: ERR_OFFERING_NOT_EFFECTIVE
    http: 409
    condition: "POST /subscriptions against an Offering whose status is not EFFECTIVE."
  - id: ERR_EXCHANGE_FILE_INVALID_STATE
    http: 409
    condition: "The ExchangeFile is not in a status from which the requested operation is defined (identifying against a CLOSED_MATCHED or EXPIRED file, expiring an already EXPIRED file, or subscribing on a file that is neither OPEN nor IDENTIFIED)."
  - id: ERR_IDENTIFICATION_INVALID_STATE
    http: 409
    condition: "The PropertyIdentification is not ACTIVE and therefore cannot be revoked."
  - id: ERR_SUBSCRIPTION_INVALID_STATE
    http: 409
    condition: "The Subscription is not in a status from which the requested transition is defined (closing anything other than RESERVED, rejecting a CLOSED row, or rescinding a row that is not CLOSED)."
  - id: ERR_LOAN_INVALID_STATE
    http: 409
    condition: "The LoanFacility is not in a status from which the requested transition is defined (repricing or funding a FUNDED or PAID_OFF facility)."
  - id: ERR_MASTER_LEASE_INVALID_STATE
    http: 409
    condition: "The MasterLease is not in a status from which the requested transition is defined (executing an EXECUTED or TERMINATED lease, terminating a DRAFT lease)."
  - id: ERR_MASTER_LEASE_NOT_EXECUTED
    http: 409
    condition: "An operation that depends on operating flexibility under the lease (rent posting, distribution declaration) was attempted while the trust has no EXECUTED MasterLease covering the relevant date."
  - id: ERR_CAPITAL_NEED_INVALID_STATE
    http: 409
    condition: "The CapitalNeed is not in a status from which the requested transition is defined (funding a FUNDED or VOIDED need, voiding an already VOIDED need)."
  - id: ERR_DISTRIBUTION_INVALID_STATE
    http: 409
    condition: "The Distribution is not DECLARED and therefore cannot be paid or voided."
  - id: ERR_TAX_STATEMENT_INVALID_STATE
    http: 409
    condition: "The TaxStatement is not DRAFT and therefore cannot be issued."
  - id: ERR_EXIT_INVALID_STATE
    http: 409
    condition: "The ExitEvent is not in a status from which the requested transition is defined (tallying or abandoning a non-PROPOSED event, closing a non-APPROVED event)."
  - id: ERR_PROPERTY_NOT_ACQUIRED
    http: 409
    condition: "The trust's Property is not in status ACQUIRED when opening funding, executing a lease or closing a subscription."
  - id: ERR_PROPERTY_CONTRACT_EXPIRED
    http: 422
    condition: "The trust's Property is in status CONTRACT_EXPIRED, so no trust-level activity may proceed."
  - id: ERR_SUITABILITY_NOT_APPROVED
    http: 422
    condition: "POST /subscriptions for an Investor whose suitability_status is not APPROVED."
  - id: ERR_ACCREDITATION_EXPIRED
    http: 422
    condition: "The Investor's accreditation_status is EXPIRED, or accreditation_expires_at is at or before the current logical-clock instant, at the moment of subscription creation or closing."
  - id: ERR_INVESTOR_NOT_ACCREDITED
    http: 422
    condition: "The Investor's accreditation_status is UNVERIFIED when a subscription is created."

  # ---- DST trustee-power prohibitions and other business safety ----
  - id: ERR_CAPITAL_CALL_PROHIBITED
    http: 422
    condition: "POST /capital-needs/{capital_need_id}/fund carried funding_source CAPITAL_CALL: the trust may never call additional capital from beneficial owners."
  - id: ERR_REFINANCING_PROHIBITED
    http: 422
    condition: "POST /loan-facilities/{loan_id}/reprice against a LoanFacility already in status FUNDED, or against a facility whose trust is OPERATING, WINDING_DOWN, TERMINATED or CONVERTED_LLC: the trustee may not renegotiate or refinance debt it has already drawn."
  - id: ERR_RECOURSE_DEBT_PROHIBITED
    http: 422
    condition: "A LoanFacility was created or repriced with recourse_type other than NON_RECOURSE."
  - id: ERR_MULTIPLE_LOANS_PROHIBITED
    http: 409
    condition: "A second LoanFacility in status COMMITTED or FUNDED was requested for a trust that already has one: the trustee may not enter into new financing."
  - id: ERR_NEW_LEASE_PROHIBITED
    http: 422
    condition: "POST /master-leases for a trust that is OPERATING, WINDING_DOWN, TERMINATED or CONVERTED_LLC: the trustee may not enter into new leases after the offering closes; operating flexibility must run through the existing master lease."
  - id: ERR_STRUCTURAL_CAPEX_PROHIBITED
    http: 422
    condition: "POST /capital-needs/{capital_need_id}/fund carried funding_source RESERVE for a CapitalNeed whose need_type is STRUCTURAL_CAPEX: the trustee may not make capital improvements beyond normal repair and maintenance out of trust funds, so only the master tenant may fund it."
  - id: ERR_ACCREDITATION_METHOD_NOT_PERMITTED
    http: 422
    condition: "The Investor's accreditation_method is SELF_CERT_NET_WORTH or SELF_CERT_INCOME while the Offering's exemption_rule is RULE_506C, which requires verification by a third party."
  - id: ERR_RESERVE_INSUFFICIENT
    http: 422
    condition: "A reserve draw would take DstTrust.reserve_balance_cents strictly below zero."
  - id: ERR_OPERATING_CASH_INSUFFICIENT
    http: 422
    condition: "A payment would take DstTrust.operating_balance_cents strictly below zero."
  - id: ERR_LTV_LIMIT_EXCEEDED
    http: 422
    condition: "principal_cents * 10000 > Property.appraised_value_cents * 7500 (loan-to-value above 75.0000%)."
  - id: ERR_DSCR_BELOW_MINIMUM
    http: 422
    condition: "Property.annual_noi_cents * 10000 < annual_debt_service_cents * 12500 (debt service coverage below 1.2500x)."

  # ---- temporal (422) ----
  - id: ERR_IDENTIFICATION_WINDOW_CLOSED
    http: 422
    condition: "An identification was filed after ExchangeFile.identification_deadline (the 45th day at 23:59:59.999Z is still inside the window)."
  - id: ERR_EXCHANGE_DEADLINE_PASSED
    http: 422
    condition: "A subscription close was attempted after ExchangeFile.exchange_deadline (the 180th day at 23:59:59.999Z is still inside the window)."
  - id: ERR_RESCISSION_WINDOW_CLOSED
    http: 409
    condition: "A rescission was attempted after Subscription.rescission_deadline (the deadline instant itself is still inside the window)."
  - id: ERR_DISTRIBUTION_PERIOD_NOT_ENDED
    http: 422
    condition: "A distribution was declared or paid while its period_end is strictly after the current logical-clock instant."

  # ---- overlap / uniqueness (409) ----
  - id: ERR_DISTRIBUTION_PERIOD_OVERLAP
    http: 409
    condition: "The half-open period [period_start, period_end) of a new Distribution intersects the period of an existing DECLARED or PAID Distribution on the same trust; touching endpoints do not intersect."
  - id: ERR_LEASE_TERM_OVERLAP
    http: 409
    condition: "The closed term [term_start_on, term_end_on] of a new MasterLease intersects the term of an existing DRAFT or EXECUTED MasterLease on any trust holding the same Property; a single shared endpoint day is an intersection."
  - id: ERR_PROPERTY_ALREADY_TRUSTED
    http: 409
    condition: "A DstTrust was requested for a Property that already has a trust in status other than TERMINATED."
  - id: ERR_DUPLICATE_IDENTIFICATION
    http: 409
    condition: "An ACTIVE PropertyIdentification already exists for the same (exchange_file_id, property_id) pair."
  - id: ERR_DUPLICATE_CONSENT
    http: 409
    condition: "An ExitConsent already exists for the same (exit_event_id, subscription_id) pair."
  - id: ERR_DUPLICATE_TAX_STATEMENT
    http: 409
    condition: "A TaxStatement already exists for the same (trust_id, subscription_id, tax_year, allocation_variant) quadruple."

  # ---- referential / consistency (422) ----
  - id: ERR_EXCHANGE_FILE_INVESTOR_MISMATCH
    http: 422
    condition: "The ExchangeFile named on a subscription belongs to a different Investor than the subscription's investor_id."
  - id: ERR_SUITABILITY_OFFERING_MISMATCH
    http: 422
    condition: "The Investor's suitability_offering_id is not the offering_id of the subscription being created."
  - id: ERR_IDENTIFICATION_MISSING_FOR_TRUST
    http: 422
    condition: "The subscription's ExchangeFile has no ACTIVE PropertyIdentification naming the Property held by the subscription's trust."
  - id: ERR_PPM_VERSION_STALE
    http: 409
    condition: "POST /offerings/{offering_id}/declare-effective carried acknowledged_ppm_version different from Offering.ppm_version."

  # ---- fiscal (422) ----
  - id: ERR_IDENTIFICATION_RULE_VIOLATION
    http: 422
    condition: "Under THREE_PROPERTY a fourth ACTIVE identification was filed; under TWO_HUNDRED_PCT the aggregate fair market value of ACTIVE identifications would exceed 200% of ExchangeFile.relinquished_sale_price_cents (exactly 200% is permitted)."
  - id: ERR_BELOW_MINIMUM_INVESTMENT
    http: 422
    condition: "units_requested is below Offering.min_units_per_investor."
  - id: ERR_SUITABILITY_CAP_EXCEEDED
    http: 422
    condition: "The subscription's investment_amount_cents exceeds Investor.suitability_cap_cents."
  - id: ERR_BOOT_EXCEEDS_TOLERANCE
    http: 422
    condition: "The computed boot_cents of a subscription exceeds ExchangeFile.boot_tolerance_cents."
  - id: ERR_OFFERING_OVERSUBSCRIBED
    http: 422
    condition: "Offering.equity_committed_cents already equals or exceeds target_equity_cents, or units_committed + units_requested would exceed DstTrust.total_units."
  - id: ERR_OFFERING_CAPACITY_SHORTFALL
    http: 422
    condition: "DstTrust.total_units * Offering.unit_price_cents is strictly less than the computed target_equity_cents, so the offering could never be fully subscribed (exact equality is permitted)."
  - id: ERR_NO_CONSENTS_RECORDED
    http: 422
    condition: "POST /exit-events/{exit_event_id}/tally-consents was called while the event has no ExitConsent rows at all; an empty consent set is not a zero-percent approval, it is an untallied event."

# =====================================================================
# §1.7 RBAC Matrix
#   role_model: segregation_of_duties — the same X-User-ID may not both
#   submit and declare effective one memorandum, and may not both approve
#   an investor's suitability and close that investor's subscription.
# =====================================================================
roles:
  - name: SponsorPrincipal
    identity: opaque
    description: "The DST sponsor. Sources property, drafts the offering and its memorandum, onboards investors, writes subscriptions, prepares tax statements and proposes exits."
    exclusive_operations:
      - "POST /properties"
      - "POST /properties/{property_id}/acquire"
      - "POST /properties/{property_id}/expire-contract"
      - "POST /offerings"
      - "POST /offerings/{offering_id}/submit-ppm"
      - "POST /subscriptions"
      - "POST /subscriptions/{subscription_id}/close"
      - "POST /tax-statements"
      - "POST /tax-statements/{tax_statement_id}/issue"
      - "POST /exit-events"
      - "POST /exit-events/{exit_event_id}/tally-consents"
      - "POST /exit-events/{exit_event_id}/abandon"
    shared_operations:
      - "POST /investors (with PlatformAdmin)"
      - "every GET read endpoint"
  - name: ComplianceOfficer
    identity: opaque
    description: "Reviews the memorandum, declares the offering effective, verifies accredited-investor status and performs suitability review. Never a sponsor on the same document or the same investor's closing."
    exclusive_operations:
      - "POST /offerings/{offering_id}/return-ppm"
      - "POST /offerings/{offering_id}/declare-effective"
      - "POST /offerings/{offering_id}/withdraw"
      - "POST /investors/{investor_id}/verify-accreditation"
      - "POST /investors/{investor_id}/lapse-accreditation"
      - "POST /investors/{investor_id}/review-suitability"
      - "POST /subscriptions/{subscription_id}/reject"
    shared_operations:
      - "every GET read endpoint"
  - name: Trustee
    identity: opaque
    description: "The Delaware trustee. Forms the trust, commits and funds non-recourse debt, signs and terminates the master lease, funds capital needs from reserve, posts debt service, declares and pays distributions and closes the exit. Its powers are deliberately narrow: no capital calls, no refinancing, no new leases, no discretionary capital improvements."
    exclusive_operations:
      - "POST /trusts"
      - "POST /trusts/{trust_id}/open-funding"
      - "POST /trusts/{trust_id}/debt-service-payments"
      - "POST /loan-facilities"
      - "POST /loan-facilities/{loan_id}/reprice"
      - "POST /loan-facilities/{loan_id}/fund"
      - "POST /master-leases"
      - "POST /master-leases/{lease_id}/execute"
      - "POST /master-leases/{lease_id}/terminate"
      - "POST /capital-needs/{capital_need_id}/void"
      - "POST /distributions"
      - "POST /distributions/{distribution_id}/pay"
      - "POST /distributions/{distribution_id}/void"
      - "POST /exit-events/{exit_event_id}/close"
    shared_operations:
      - "POST /capital-needs (with MasterTenant)"
      - "POST /capital-needs/{capital_need_id}/fund (with MasterTenant; funding_source RESERVE is Trustee-only in effect because a reserve draw touches the trust books)"
      - "every GET read endpoint"
  - name: Investor
    identity: entity_backed:Investor
    description: "A beneficial owner. X-User-ID equals Investor.id. May rescind only its own closed subscription and consent only on its own units."
    exclusive_operations:
      - "POST /subscriptions/{subscription_id}/rescind"
      - "POST /exit-consents"
    shared_operations:
      - "every GET read endpoint, scoped to its own rows"
  - name: MasterTenant
    identity: opaque
    description: "The sponsor-affiliated master tenant that runs the property and remits rent, absorbing operating variability the trust itself may not manage."
    exclusive_operations:
      - "POST /trusts/{trust_id}/rent-postings"
    shared_operations:
      - "POST /capital-needs (with Trustee)"
      - "POST /capital-needs/{capital_need_id}/fund (with Trustee; funding_source MASTER_TENANT)"
      - "GET reads on properties, trusts, offerings, master leases, ledger entries and capital needs"
  - name: QualifiedIntermediary
    identity: opaque
    description: "Holds exchange proceeds and administers identification and closing deadlines for each investor's exchange file."
    exclusive_operations:
      - "POST /exchange-files"
      - "POST /exchange-files/{exchange_file_id}/mark-expired"
      - "POST /property-identifications"
      - "POST /property-identifications/{identification_id}/revoke"
    shared_operations:
      - "GET reads on properties, trusts, offerings, investors, exchange files, identifications and subscriptions"
  - name: PlatformAdmin
    identity: opaque
    description: "Operates the platform clock and may onboard investors. Holds no trust, offering or exchange authority."
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /investors (with SponsorPrincipal)"
      - "every GET read endpoint"
