            - "a subsequent POST /festival-ops/offers/${offer_ob}/accept is rejected with ERR_OFFER_NOT_NEGOTIABLE (409) because SUPERSEDED is terminal"

      - name: violation_adjudication_depth4_enforcement_cascade
        grounds:
          - state_machines.CompetingPerformance.REPORTED_to_VIOLATION
          - state_machines.RadiusClause.ACTIVE_to_BREACHED
          - state_machines.PaymentInstallment.SCHEDULED_to_HELD
          - state_machines.Booking.settlement_status.UNFUNDED_to_WITHHELD
        distinguishing_aspect: |
          A different triggering transition — POST /competing-performances/{id}/adjudicate with
          finding VIOLATION — and a chain that crosses four entities in strict succession: the
          finding breaches the clause (1) -> the breach holds every SCHEDULED installment of the
          clause's booking (2) -> the holds put the booking's settlement dimension into WITHHELD
          (3) -> WITHHELD is what makes the release endpoint refuse money (4). The adjudicate
          request names only the performance row.
        test_recipe:
          setup:
            - "Single-tier Harbor Lights fixture with one accepted booking at guarantee 1800000 for a draw-72 ELECTRONIC act, so the clause is ACTIVE for 2026-10-05..2027-01-04 at 150 miles and both installments are SCHEDULED."
            - "One reported Portland performance on 2026-11-20 inside that window; Portland is 145.41 miles from the Seattle market point, inside the 150-mile radius, so it was stamped CONFLICT at creation."
          setup_api_calls:
            - call: "POST /festival-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
