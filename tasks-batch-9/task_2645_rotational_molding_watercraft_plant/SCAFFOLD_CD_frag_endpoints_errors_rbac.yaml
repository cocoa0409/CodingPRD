            - "the attempt to schedule a cycle under the inspector's identity returns 403 'ERR_ROLE_IDENTITY_MISMATCH', NOT 'ERR_SEGREGATION_OF_DUTIES' and NOT 'ERR_ROLE_NOT_PERMITTED'"
            - "the attempt to outfit under the inspector's identity returns 403 'ERR_ROLE_IDENTITY_MISMATCH', so the inspector can never become FinishedUnit.outfitted_by_technician_id either"
            - "FinishedUnit.${fu2}.outfitted_by_technician_id is still ${t_asm} after that refusal"
            - "the inspection by T-CD-QCI-2 returns 200 with inspection_result 'PASS', build_status 'SELLABLE' and inspected_by_technician_id == ${t_qc2}, which is neither ${t_op} nor ${t_asm}"
            - "no request in this instance ever returns 'ERR_SEGREGATION_OF_DUTIES': the two identities the rule guards against are unreachable through the declared endpoint surface"

