            - call: "POST /programs"
              payload: { program_code: "PRG-TC1", peril_type: "RAINFALL_DEFICIT", regulatory_classification: "ADMITTED_INSURANCE", contract_wording_version: "CW-T1", exposure_limit_cents: 100000000 }
