            - "TaxReturn.${ret_id}.status == DRAFT"
            - "TaxReturn.${ret_id}.upgrade_prompt_pending == true"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics/endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: refund_exactly_covers_fees_boundary
        grounds:
          - validations[priority=19]
          - calculations.total_fees_due
          - calculations.federal_refund
        distinguishing_aspect: |
          Numeric-threshold boundary (refund vs fees) on POST file: at
          federal_refund_cents == total_fees_due_cents == 4000 the >= check
          passes (boundary inclusive); the sibling corner instance tests
          3999 -> ERR_REFUND_INSUFFICIENT_FOR_FEES.
        test_recipe:
          setup:
            - "Account A (AGI 1000000c, CA), return R(2025) with ACTIVE F1040 + W2_WH(amount 4000c => refund 4000); FREE tier (fees 0); refund-transfer agreement ACTIVE so total_fees_due_cents == 4000; return in READY_FOR_REVIEW"
            - "Catalog seeded per header"
          setup_api_calls:
            - call: "POST /tax/_tiers/seed"
              payload: { code: "FREE", price_cents: 0, state_addon_price_cents: 0, supported_forms: ["F1040", "W2_WH"], tier_rank: 0 }
              as: PlatformOperator
            - call: "POST /tax/_forms/seed"
              payload: { code: "F1040", minimum_tier: "FREE", disqualifies_free_file: false }
              as: PlatformOperator
            - call: "POST /tax/_forms/seed"
              payload: { code: "W2_WH", minimum_tier: "FREE", disqualifies_free_file: false, counts_toward_refund: true }
              as: PlatformOperator
            - call: "POST /tax/accounts"
              payload: { email: "bnd1@x.com", full_name: "Bnd One", filing_status: "SINGLE", agi_cents: 1000000, resident_state_code: "CA" }
              as: Taxpayer
              captures: { acct_id: $.data.id }
            - call: "POST /tax/accounts/${acct_id}/returns"
              payload: { tax_year: 2025 }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_id: $.data.id, ret_v: $.data.version }
            - call: "POST /tax/returns/${ret_id}/forms"
              payload: { form_code: "F1040", amount_cents: 0, expected_return_version: "${ret_v}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v2: $.data.version }
            - call: "POST /tax/returns/${ret_id}/forms"
              payload: { form_code: "W2_WH", amount_cents: 4000, expected_return_version: "${ret_v2}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v3: $.data.version }
            - call: "POST /tax/returns/${ret_id}/refund-transfer"
              payload: { bank_partner_code: "BANK_A", expected_return_version: "${ret_v3}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v4: $.data.version }
            - call: "POST /tax/returns/${ret_id}/refund-transfer/accept-disclosure"
              payload: { expected_return_version: "${ret_v4}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v5: $.data.version }
            - call: "POST /tax/returns/${ret_id}/submit-review"
              payload: { expected_return_version: "${ret_v5}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v6: $.data.version }
          trigger:
            - call: "POST /tax/returns/${ret_id}/file"
              payload: { transmission_payload_hash: "hash-b", expected_return_version: "${ret_v6}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { fa1: $.data.id }
          assert:
            - "TaxReturn.${ret_id}.total_fees_due_cents == 4000 (0 base + 0 state + 4000 service fee)"
            - "TaxReturn.${ret_id}.federal_refund_cents == 4000"
            - "TaxReturn.${ret_id}.status == SUBMITTED (>= boundary is inclusive: 4000 >= 4000 files)"
            - "FilingAttempt.${fa1}.outcome == PENDING"

      - name: empty_form_set_boundary_on_submit
        grounds:
          - calculations.minimum_tier_classification
          - state_machines.TaxReturn.DRAFT_to_READY_FOR_REVIEW
        distinguishing_aspect: |
          Empty-collection boundary (zero ACTIVE forms) on a different
          endpoint (POST submit-review) and a different metric (form-set
          cardinality, not cents): the last form removal empties the ACTIVE
          set, the classifier collapses to FREE, and submit-review is
          rejected with ERR_NO_FORMS_ON_RETURN.
        test_recipe:
          setup:
            - "Account A (AGI 1000000c, CA), return R(2025, DRAFT) whose only form (F1040) has just been removed, leaving zero ACTIVE forms"
            - "Catalog seeded per header"
          setup_api_calls:
            - call: "POST /tax/_tiers/seed"
              payload: { code: "FREE", price_cents: 0, state_addon_price_cents: 0, supported_forms: ["F1040", "W2_WH"], tier_rank: 0 }
              as: PlatformOperator
            - call: "POST /tax/_forms/seed"
              payload: { code: "F1040", minimum_tier: "FREE", disqualifies_free_file: false }
              as: PlatformOperator
            - call: "POST /tax/accounts"
              payload: { email: "bnd2@x.com", full_name: "Bnd Two", filing_status: "SINGLE", agi_cents: 1000000, resident_state_code: "CA" }
              as: Taxpayer
              captures: { acct_id: $.data.id }
            - call: "POST /tax/accounts/${acct_id}/returns"
              payload: { tax_year: 2025 }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_id: $.data.id, ret_v: $.data.version }
            - call: "POST /tax/returns/${ret_id}/forms"
              payload: { form_code: "F1040", amount_cents: 0, expected_return_version: "${ret_v}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { form1: $.data.id, ret_v2: $.data.version }
            - call: "POST /tax/returns/${ret_id}/forms/${form1}/remove"
              payload: { expected_return_version: "${ret_v2}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v3: $.data.version }
          trigger:
            - call: "POST /tax/returns/${ret_id}/submit-review"
              payload: { expected_return_version: "${ret_v3}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { err1: $.data.error_id }
          assert:
            - "${err1} == ERR_NO_FORMS_ON_RETURN"
            - "TaxReturn.${ret_id}.minimum_required_tier == FREE (empty ACTIVE set collapses the classifier)"
            - "TaxReturn.${ret_id}.status == DRAFT"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: suspended_account_blocks_return_review
        grounds:
          - validations[priority=5]
          - state_machines.TaxpayerAccount.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Pair TaxpayerAccount -> TaxReturn: the account-level SUSPENDED
          state gates an otherwise fully valid return transition
          (submit-review), independent of the return's own state.
        test_recipe:
          setup:
            - "Account A (AGI 1000000c) with return R holding ACTIVE F1040 (free-file eligible, no prompts); account then suspended"
            - "Catalog seeded per header"
          setup_api_calls:
            - call: "POST /tax/_tiers/seed"
              payload: { code: "FREE", price_cents: 0, state_addon_price_cents: 0, supported_forms: ["F1040", "W2_WH"], tier_rank: 0 }
              as: PlatformOperator
            - call: "POST /tax/_forms/seed"
              payload: { code: "F1040", minimum_tier: "FREE", disqualifies_free_file: false }
              as: PlatformOperator
            - call: "POST /tax/accounts"
              payload: { email: "xes1@x.com", full_name: "Xes One", filing_status: "SINGLE", agi_cents: 1000000, resident_state_code: "CA" }
              as: Taxpayer
              captures: { acct_id: $.data.id }
            - call: "POST /tax/accounts/${acct_id}/returns"
              payload: { tax_year: 2025 }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_id: $.data.id, ret_v: $.data.version }
            - call: "POST /tax/returns/${ret_id}/forms"
              payload: { form_code: "F1040", amount_cents: 0, expected_return_version: "${ret_v}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v2: $.data.version }
            - call: "POST /tax/accounts/${acct_id}/suspend"
              payload: {}
              as: PlatformOperator
          trigger:
            - call: "POST /tax/returns/${ret_id}/submit-review"
              payload: { expected_return_version: "${ret_v2}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { err1: $.data.error_id }
          assert:
            - "${err1} == ERR_ACCOUNT_SUSPENDED"
            - "TaxReturn.${ret_id}.status == DRAFT"

      - name: prompt_resolution_gates_return_review
        grounds:
          - validations[priority=8]
          - state_machines.UpgradePrompt.PENDING_to_ACKNOWLEDGED
        distinguishing_aspect: |
          Pair UpgradePrompt -> TaxReturn (different entity pair from
          instance 1): a sibling prompt in PENDING blocks the return's
          DRAFT -> READY_FOR_REVIEW transition; acknowledging the prompt
          unblocks it and ratchets current_tier to PREMIER.
        test_recipe:
          setup:
            - "Account A (AGI 1000000c, ACTIVE) with return R holding ACTIVE F1040 + SCH_D; PENDING prompt P (FREE->PREMIER, price_delta 12999) outstanding"
            - "Catalog seeded per header"
          setup_api_calls:
            - call: "POST /tax/_tiers/seed"
              payload: { code: "FREE", price_cents: 0, state_addon_price_cents: 0, supported_forms: ["F1040", "W2_WH"], tier_rank: 0 }
              as: PlatformOperator
            - call: "POST /tax/_tiers/seed"
              payload: { code: "PREMIER", price_cents: 12999, state_addon_price_cents: 4999, supported_forms: ["SCH_D", "F8949", "F4562"], tier_rank: 2 }
              as: PlatformOperator
            - call: "POST /tax/_forms/seed"
              payload: { code: "F1040", minimum_tier: "FREE", disqualifies_free_file: false }
              as: PlatformOperator
            - call: "POST /tax/_forms/seed"
              payload: { code: "SCH_D", minimum_tier: "PREMIER", disqualifies_free_file: true }
              as: PlatformOperator
            - call: "POST /tax/accounts"
              payload: { email: "xes2@x.com", full_name: "Xes Two", filing_status: "SINGLE", agi_cents: 1000000, resident_state_code: "CA" }
              as: Taxpayer
              captures: { acct_id: $.data.id }
            - call: "POST /tax/accounts/${acct_id}/returns"
              payload: { tax_year: 2025 }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_id: $.data.id, ret_v: $.data.version }
            - call: "POST /tax/returns/${ret_id}/forms"
              payload: { form_code: "F1040", amount_cents: 0, expected_return_version: "${ret_v}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v2: $.data.version }
            - call: "POST /tax/returns/${ret_id}/forms"
              payload: { form_code: "SCH_D", amount_cents: 1000, expected_return_version: "${ret_v2}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v3: $.data.version }
            - call: "GET /tax/returns/${ret_id}/upgrade-prompts"
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures:
                prompt_id: "$.data[0].id"
          trigger:
            - call: "POST /tax/returns/${ret_id}/submit-review"
              payload: { expected_return_version: "${ret_v3}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { err1: $.data.error_id }
            - call: "POST /tax/returns/${ret_id}/upgrade-prompts/${prompt_id}/acknowledge"
              payload: { expected_return_version: "${ret_v3}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v4: $.data.version }
            - call: "POST /tax/returns/${ret_id}/submit-review"
              payload: { expected_return_version: "${ret_v4}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
          assert:
            - "first submit rejected: ${err1} == ERR_UPGRADE_ACK_REQUIRED"
            - "UpgradePrompt.${prompt_id}.status == ACKNOWLEDGED"
            - "TaxReturn.${ret_id}.current_tier == PREMIER"
            - "TaxReturn.${ret_id}.total_fees_due_cents == 12999"
            - "TaxReturn.${ret_id}.status == READY_FOR_REVIEW (unblocked after prompt resolution)"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: half_open_residency_window_overlap_and_adjacency
        grounds:
          - validations[priority=14]
          - entities.StateReturn.fields.residency_start_date
          - entities.StateReturn.fields.residency_end_date
        distinguishing_aspect: |
          Half-open interval semantics on StateReturn residency windows:
          [start, end) — a window starting exactly at another's end
          (adjacency, 2026-06-30 == 2026-06-30) is accepted, while true
          overlap (inner start < outer end AND outer start < inner end) is
          rejected with ERR_RESIDENCY_OVERLAP.
        test_recipe:
          setup:
            - "Account A (AGI 1000000c, resident CA), return R(2025, DRAFT) with ACTIVE F1040 and one non-resident OR StateReturn carrying residency window [2026-01-01, 2026-06-30)"
            - "Catalog seeded per header"
          setup_api_calls:
            - call: "POST /tax/_tiers/seed"
              payload: { code: "FREE", price_cents: 0, state_addon_price_cents: 0, supported_forms: ["F1040", "W2_WH"], tier_rank: 0 }
              as: PlatformOperator
            - call: "POST /tax/_forms/seed"
              payload: { code: "F1040", minimum_tier: "FREE", disqualifies_free_file: false }
              as: PlatformOperator
            - call: "POST /tax/accounts"
              payload: { email: "ovr1@x.com", full_name: "Ovr One", filing_status: "SINGLE", agi_cents: 1000000, resident_state_code: "CA" }
              as: Taxpayer
              captures: { acct_id: $.data.id }
            - call: "POST /tax/accounts/${acct_id}/returns"
              payload: { tax_year: 2025 }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_id: $.data.id, ret_v: $.data.version }
            - call: "POST /tax/returns/${ret_id}/forms"
              payload: { form_code: "F1040", amount_cents: 0, expected_return_version: "${ret_v}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v2: $.data.version }
            - call: "POST /tax/returns/${ret_id}/state-returns"
              payload: { state_code: "OR", residency_start_date: "2026-01-01", residency_end_date: "2026-06-30", expected_return_version: "${ret_v2}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { sr_or: $.data.id, ret_v3: $.data.version }
          trigger:
            - call: "POST /tax/returns/${ret_id}/state-returns"
              payload: { state_code: "WA", residency_start_date: "2026-06-30", residency_end_date: "2026-12-31", expected_return_version: "${ret_v3}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { sr_wa: $.data.id, ret_v4: $.data.version }
            - call: "POST /tax/returns/${ret_id}/state-returns"
              payload: { state_code: "NV", residency_start_date: "2026-03-01", residency_end_date: "2026-09-01", expected_return_version: "${ret_v4}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { err1: $.data.error_id }
          assert:
            - "StateReturn.${sr_wa}.status == DRAFT (adjacent window [2026-06-30, 2026-12-31) accepted: A.end == B.start is NOT overlap under half-open semantics)"
            - "NV create rejected: ${err1} == ERR_RESIDENCY_OVERLAP ([2026-03-01, 2026-09-01) intersects both existing windows)"
            - "TaxReturn.${ret_id}.total_fees_due_cents == 0 (FREE add-on price; fee count tracks accepted rows only)"

      - name: amendment_hold_closed_interval_boundary
        grounds:
          - calculations.amendment_hold_window
          - validations[priority=15]
        distinguishing_aspect: |
          Closed-interval semantics on the amendment hold (different interval
          semantics from instance 1's half-open windows, on a different
          resource — the return's filing slot): re-filing AT exactly
          resolved_at + 24h is still rejected, while one second past the
          boundary succeeds.
        test_recipe:
          setup:
            - "Account A (AGI 1000000c, CA) with return R(2025) that was filed and ACCEPTED at 2026-10-01T00:00:00Z, then amended back through DRAFT to READY_FOR_REVIEW; logical clock parked at exactly 2026-10-02T00:00:00Z (resolved_at + 24h)"
            - "Catalog seeded per header"
          setup_api_calls:
            - call: "POST /tax/_tiers/seed"
              payload: { code: "FREE", price_cents: 0, state_addon_price_cents: 0, supported_forms: ["F1040", "W2_WH"], tier_rank: 0 }
              as: PlatformOperator
            - call: "POST /tax/_forms/seed"
              payload: { code: "F1040", minimum_tier: "FREE", disqualifies_free_file: false }
              as: PlatformOperator
            - call: "POST /tax/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /tax/accounts"
              payload: { email: "ovr2@x.com", full_name: "Ovr Two", filing_status: "SINGLE", agi_cents: 1000000, resident_state_code: "CA" }
              as: Taxpayer
              captures: { acct_id: $.data.id }
            - call: "POST /tax/accounts/${acct_id}/returns"
              payload: { tax_year: 2025 }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_id: $.data.id, ret_v: $.data.version }
            - call: "POST /tax/returns/${ret_id}/forms"
              payload: { form_code: "F1040", amount_cents: 0, expected_return_version: "${ret_v}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v2: $.data.version }
            - call: "POST /tax/returns/${ret_id}/submit-review"
              payload: { expected_return_version: "${ret_v2}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v3: $.data.version }
            - call: "POST /tax/returns/${ret_id}/file"
              payload: { transmission_payload_hash: "hash-1", expected_return_version: "${ret_v3}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { fa1: $.data.id, ret_v4: $.data.version }
            - call: "POST /tax/_authority/filing-callback"
              payload: { filing_attempt_id: "${fa1}", outcome: "ACCEPTED" }
              as: PlatformOperator
            - call: "POST /tax/returns/${ret_id}/amend"
              payload: { expected_return_version: "${ret_v4}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v5: $.data.version }
            - call: "POST /tax/returns/${ret_id}/submit-review"
              payload: { expected_return_version: "${ret_v5}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v6: $.data.version }
            - call: "POST /tax/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: PlatformOperator
          trigger:
            - call: "POST /tax/returns/${ret_id}/file"
              payload: { transmission_payload_hash: "hash-2", expected_return_version: "${ret_v6}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { err1: $.data.error_id }
            - call: "POST /tax/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:01Z" }
              as: PlatformOperator
            - call: "POST /tax/returns/${ret_id}/file"
              payload: { transmission_payload_hash: "hash-2", expected_return_version: "${ret_v6}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { fa2: $.data.id }
          assert:
            - "first re-file rejected: ${err1} == ERR_AMENDMENT_HOLD_ACTIVE (closed interval: exactly resolved_at + 24h is still inside the hold)"
            - "FilingAttempt.${fa2}.attempt_sequence == 2 (one second past the boundary succeeds)"
            - "TaxReturn.${ret_id}.status == SUBMITTED"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: fee_conservation_across_rt_accept_void_cycle
        grounds:
          - calculations.total_fees_due
          - state_machines.RefundTransferAgreement.PENDING_DISCLOSURE_to_ACTIVE
          - state_machines.RefundTransferAgreement.ACTIVE_to_VOIDED
        distinguishing_aspect: |
          Conserved quantity: total_fees_due_cents minus the refund-transfer
          service fee — accept-disclosure adds exactly
          REFUND_TRANSFER_FEE_CENTS and the paired void removes exactly the
          frozen service_fee_cents, returning the invariant to its pre-cycle
          value (16998 -> 20998 -> 16998) with no drift.
        test_recipe:
          setup:
            - "Account A (AGI 2000000c, CA), return R(2025, DRAFT) with ACTIVE F1040 + SCH_D, prompt acknowledged (current_tier=PREMIER), one CA StateReturn added: total_fees_due_cents == 16998, refund_transfer_selected == false"
            - "Catalog seeded per header"
          setup_api_calls:
            - call: "POST /tax/_tiers/seed"
              payload: { code: "FREE", price_cents: 0, state_addon_price_cents: 0, supported_forms: ["F1040", "W2_WH"], tier_rank: 0 }
              as: PlatformOperator
            - call: "POST /tax/_tiers/seed"
              payload: { code: "PREMIER", price_cents: 12999, state_addon_price_cents: 4999, supported_forms: ["SCH_D", "F8949", "F4562"], tier_rank: 2 }
              as: PlatformOperator
            - call: "POST /tax/_forms/seed"
              payload: { code: "F1040", minimum_tier: "FREE", disqualifies_free_file: false }
              as: PlatformOperator
            - call: "POST /tax/_forms/seed"
              payload: { code: "SCH_D", minimum_tier: "PREMIER", disqualifies_free_file: true }
              as: PlatformOperator
            - call: "POST /tax/accounts"
              payload: { email: "inv1@x.com", full_name: "Inv One", filing_status: "SINGLE", agi_cents: 2000000, resident_state_code: "CA" }
              as: Taxpayer
              captures: { acct_id: $.data.id }
            - call: "POST /tax/accounts/${acct_id}/returns"
              payload: { tax_year: 2025 }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_id: $.data.id, ret_v: $.data.version }
            - call: "POST /tax/returns/${ret_id}/forms"
              payload: { form_code: "F1040", amount_cents: 0, expected_return_version: "${ret_v}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v2: $.data.version }
            - call: "POST /tax/returns/${ret_id}/forms"
              payload: { form_code: "SCH_D", amount_cents: 1000, expected_return_version: "${ret_v2}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v3: $.data.version }
            - call: "GET /tax/returns/${ret_id}/upgrade-prompts"
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures:
                prompt_id: "$.data[0].id"
            - call: "POST /tax/returns/${ret_id}/upgrade-prompts/${prompt_id}/acknowledge"
              payload: { expected_return_version: "${ret_v3}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v4: $.data.version }
            - call: "POST /tax/returns/${ret_id}/state-returns"
              payload: { state_code: "CA", expected_return_version: "${ret_v4}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v5: $.data.version }
            - call: "POST /tax/returns/${ret_id}/refund-transfer"
              payload: { bank_partner_code: "BANK_A", expected_return_version: "${ret_v5}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v6: $.data.version }
          trigger:
            - call: "POST /tax/returns/${ret_id}/refund-transfer/accept-disclosure"
              payload: { expected_return_version: "${ret_v6}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v7: $.data.version }
            - call: "POST /tax/returns/${ret_id}/refund-transfer/void"
              payload: { expected_return_version: "${ret_v7}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
          assert:
            - "TaxReturn.${ret_id}.total_fees_due_cents == 16998 after the full accept+void cycle (12999 + 4999; service fee added then exactly removed)"
            - "TaxReturn.${ret_id}.refund_transfer_selected == false"
            - "RefundTransferAgreement (the return's) status == VOIDED"
            - "TaxpayerAccount.${acct_id}.disclosure_accepted_version == 'RTD-2026-1' (acceptance persists even after void)"

      - name: minimum_tier_conservation_across_add_remove_cycle
        grounds:
          - calculations.minimum_tier_classification
          - state_machines.UpgradePrompt.PENDING_to_SUPERSEDED
        distinguishing_aspect: |
          Conserved quantity of a different type (enum rank, not cents):
          minimum_required_tier over the ACTIVE form set — adding SCH_C
          raises FREE -> SELF_EMPLOYED and the compensating remove restores
          exactly FREE, with every prompt the cycle created left in a
          terminal state (zero PENDING prompts remain).
        test_recipe:
          setup:
            - "Account A (AGI 1000000c, CA), return R(2025, DRAFT) with ACTIVE F1040 only: minimum_required_tier == FREE, no prompts"
            - "Catalog seeded per header"
          setup_api_calls:
            - call: "POST /tax/_tiers/seed"
              payload: { code: "FREE", price_cents: 0, state_addon_price_cents: 0, supported_forms: ["F1040", "W2_WH"], tier_rank: 0 }
              as: PlatformOperator
            - call: "POST /tax/_tiers/seed"
              payload: { code: "SELF_EMPLOYED", price_cents: 19999, state_addon_price_cents: 5999, supported_forms: ["SCH_C"], tier_rank: 3 }
              as: PlatformOperator
            - call: "POST /tax/_forms/seed"
              payload: { code: "F1040", minimum_tier: "FREE", disqualifies_free_file: false }
              as: PlatformOperator
            - call: "POST /tax/_forms/seed"
              payload: { code: "SCH_C", minimum_tier: "SELF_EMPLOYED", disqualifies_free_file: true }
              as: PlatformOperator
            - call: "POST /tax/accounts"
              payload: { email: "inv2@x.com", full_name: "Inv Two", filing_status: "SINGLE", agi_cents: 1000000, resident_state_code: "CA" }
              as: Taxpayer
              captures: { acct_id: $.data.id }
            - call: "POST /tax/accounts/${acct_id}/returns"
              payload: { tax_year: 2025 }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_id: $.data.id, ret_v: $.data.version }
            - call: "POST /tax/returns/${ret_id}/forms"
              payload: { form_code: "F1040", amount_cents: 0, expected_return_version: "${ret_v}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v2: $.data.version }
          trigger:
            - call: "POST /tax/returns/${ret_id}/forms"
              payload: { form_code: "SCH_C", amount_cents: 500000, expected_return_version: "${ret_v2}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { schc_form: $.data.id, ret_v3: $.data.version }
            - call: "POST /tax/returns/${ret_id}/forms/${schc_form}/remove"
              payload: { expected_return_version: "${ret_v3}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v4: $.data.version }
            - call: "GET /tax/returns/${ret_id}"
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { final_min_tier: $.data.minimum_required_tier, final_prompt_pending: $.data.upgrade_prompt_pending }
          assert:
            - "TaxReturn.${ret_id}.minimum_required_tier == FREE (observed ${final_min_tier}; restored exactly after the compensating remove)"
            - "TaxReturn.${ret_id}.free_file_eligible == true (disqualifying form left the ACTIVE set)"
            - "TaxReturn.${ret_id}.upgrade_prompt_pending == false (observed ${final_prompt_pending}; the add-created prompt auto-resolved once the minimum dropped back at/below current_tier)"
            - "ReturnForm.${schc_form}.status == REMOVED"
            - "TaxReturn.${ret_id}.current_tier == FREE (never ratcheted; no acknowledgment happened)"
