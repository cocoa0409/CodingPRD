      - name: rider_cannot_create_plan_forbidden
        claim_type: Cannot perform other roles' exclusive_operations
        grounds: ["roles", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "A Rider calling POST /api/plans (PlatformAdmin-exclusive) is rejected with ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["a registered rider"]
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { code: "STANDARD", unlock_fee_cents: 100, per_minute_cents: 30, daily_cap_cents: 0, slow_zone_discount_pct: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
