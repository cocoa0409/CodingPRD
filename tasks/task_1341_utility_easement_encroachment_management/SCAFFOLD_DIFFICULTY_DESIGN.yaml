  # =====================================================================
  # Rule 8: resource_temporal_overlap — different interval semantics
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: permit_overlap_half_open_adjacency_vs_buffer
        grounds:
          - calculations.overlap_window_check
          - validations[priority=12]
          - errors[ERR_PERMIT_OVERLAP]
        distinguishing_aspect: |
          Interval semantics (a): standard half-open adjacency — permit A
          [2026-09-01, 2026-10-01) and permit B [2026-10-01, 2026-11-01) do NOT
          overlap (end == start). For STRUCTURE_RETENTION, a 30-day buffer is
          added, so A [2026-09-01,2026-10-01) and B [2026-10-15,2026-11-15)
          DO overlap when A is STRUCTURE_RETENTION (buffer extends to 2026-10-31).
        test_recipe:
          setup:
            - "EasementCase ACTIVE_MONITORING, title_cleared, RECORDED doc, one APPROVED DRIVEWAY permit [2026-09-01,2026-10-01)"
          setup_api_calls:
            - call: "POST /easement-cases"
              payload: { case_code: "ESM-015", utility_district: "D1", county: "King", parcel_id: "P-015", easement_width_ft: 50, easement_area_sqft: 10000, fair_market_value_per_sqft: 10, acquisition_budget_cents: 50000000 }
              as: RightOfWayAgent
              captures: { case_id: $.data.id }
            - call: "POST /easement-cases/${case_id}/documents"
              payload: { doc_kind: "DEED", instrument_number: "INST-1401", recording_date: "2026-07-01T00:00:00Z", grantor_name: "S", grantee_name: "CU", gis_polygon_wkt: "POLYGON((0 0,1 0,1 1,0 1,0 0))", width_ft: 50 }
              as: TitleExaminer
              captures: { doc_id: $.data.id }
            - call: "POST /easement-cases/${case_id}/title-searches"
              payload: { search_scope: "FULL_CHAIN" }
              as: TitleExaminer
              captures: { task_id: $.data.id }
            - call: "POST /easement-cases/${case_id}/title-searches/${task_id}/begin"
              payload: {}
              as: TitleExaminer
            - call: "POST /easement-cases/${case_id}/title-searches/${task_id}/complete"
              payload: { liens_found: 0, defects_found: 0, chain_of_title_json: { links: [] } }
              as: TitleExaminer
            - call: "POST /easement-cases/${case_id}/documents/${doc_id}/record"
              payload: {}
              as: TitleExaminer
            - call: "POST /easement-cases/${case_id}/begin-mapping"
              payload: {}
              as: RightOfWayAgent
            - call: "POST /easement-cases/${case_id}/activate-monitoring"
              payload: {}
              as: RightOfWayAgent
            # Create and approve first permit (DRIVEWAY, no buffer)
            - call: "POST /easement-cases/${case_id}/permits"
              payload: { permittee_name: "P1", permit_type: "DRIVEWAY", requested_area_sqft: 100, requested_start_date: "2026-09-01T00:00:00Z", requested_end_date: "2026-10-01T00:00:00Z", insurance_certificate_on_file: true }
              as: RightOfWayAgent
              captures: { permit1_id: $.data.id }
            - call: "POST /easement-cases/${case_id}/permits/${permit1_id}/schedule-inspection"
              payload: {}
              as: VegetationInspector
            - call: "POST /easement-cases/${case_id}/permits/${permit1_id}/record-inspection"
              payload: { result: "PASSED" }
              as: VegetationInspector
            - call: "GET /easement-cases/${case_id}"
              payload: {}
              as: RightOfWayAgent
              captures: { case_v1: $.data.version }
            - call: "POST /easement-cases/${case_id}/permits/${permit1_id}/approve"
              payload: { expected_case_version: "${case_v1}" }
              as: RightOfWayAgent
          trigger:
            # Second permit adjacent (no overlap) — DRIVEWAY so no buffer
            - call: "POST /easement-cases/${case_id}/permits"
              payload: { permittee_name: "P2", permit_type: "DRIVEWAY", requested_area_sqft: 100, requested_start_date: "2026-10-01T00:00:00Z", requested_end_date: "2026-11-01T00:00:00Z", insurance_certificate_on_file: true }
              as: RightOfWayAgent
              captures: { permit2_id: $.data.id }
            - call: "POST /easement-cases/${case_id}/permits/${permit2_id}/schedule-inspection"
              payload: {}
              as: VegetationInspector
            - call: "POST /easement-cases/${case_id}/permits/${permit2_id}/record-inspection"
              payload: { result: "PASSED" }
              as: VegetationInspector
            - call: "GET /easement-cases/${case_id}"
              payload: {}
              as: RightOfWayAgent
              captures: { case_v2: $.data.version }
            - call: "POST /easement-cases/${case_id}/permits/${permit2_id}/approve"
              payload: { expected_case_version: "${case_v2}" }
              as: RightOfWayAgent
            # Third permit overlapping within buffer window if STRUCTURE_RETENTION
            - call: "POST /easement-cases/${case_id}/permits"
              payload: { permittee_name: "P3", permit_type: "STRUCTURE_RETENTION", requested_area_sqft: 100, requested_start_date: "2026-10-15T00:00:00Z", requested_end_date: "2026-11-15T00:00:00Z", insurance_certificate_on_file: true }
              as: RightOfWayAgent
              captures: { permit3_id: $.data.id }
            - call: "POST /easement-cases/${case_id}/permits/${permit3_id}/schedule-inspection"
              payload: {}
              as: VegetationInspector
            - call: "POST /easement-cases/${case_id}/permits/${permit3_id}/record-inspection"
              payload: { result: "PASSED" }
              as: VegetationInspector
            - call: "GET /easement-cases/${case_id}"
              payload: {}
              as: RightOfWayAgent
              captures: { case_v3: $.data.version }
            - call: "POST /easement-cases/${case_id}/permits/${permit3_id}/approve"
              payload: { expected_case_version: "${case_v3}" }
              as: RightOfWayAgent
              captures: { err3: $.data.error_id }
          assert:
            - "permit2 approve succeeded (adjacent, half-open)"
            - "permit3 approve error_id == ERR_PERMIT_OVERLAP (STRUCTURE_RETENTION 30-day buffer overlaps P1's [09-01,10-01) window extended to 10-31)"

      - name: permit_overlap_aggregate_capacity_different_semantics
        grounds:
          - calculations.overlap_window_check
          - validations[priority=12]
        distinguishing_aspect: |
          Interval semantics (b): aggregate capacity — two permits of the same
          type on the same case are forbidden from ANY overlap, while permits
          of different types may overlap freely. This differs from instance (a)
          which tests half-open adjacency plus buffer.
        test_recipe:
          setup:
            - "EasementCase ACTIVE_MONITORING, RECORDED doc, one APPROVED FENCE_RETENTION permit [2026-09-01,2026-12-01)"
          setup_api_calls:
            - call: "POST /easement-cases"
              payload: { case_code: "ESM-016", utility_district: "D1", county: "King", parcel_id: "P-016", easement_width_ft: 50, easement_area_sqft: 10000, fair_market_value_per_sqft: 10, acquisition_budget_cents: 50000000 }
              as: RightOfWayAgent
              captures: { case_id: $.data.id }
            - call: "POST /easement-cases/${case_id}/documents"
              payload: { doc_kind: "DEED", instrument_number: "INST-1501", recording_date: "2026-07-01T00:00:00Z", grantor_name: "S", grantee_name: "CU", gis_polygon_wkt: "POLYGON((0 0,1 0,1 1,0 1,0 0))", width_ft: 50 }
              as: TitleExaminer
              captures: { doc_id: $.data.id }
            - call: "POST /easement-cases/${case_id}/title-searches"
              payload: { search_scope: "FULL_CHAIN" }
              as: TitleExaminer
              captures: { task_id: $.data.id }
            - call: "POST /easement-cases/${case_id}/title-searches/${task_id}/begin"
              payload: {}
              as: TitleExaminer
            - call: "POST /easement-cases/${case_id}/title-searches/${task_id}/complete"
              payload: { liens_found: 0, defects_found: 0, chain_of_title_json: { links: [] } }
              as: TitleExaminer
            - call: "POST /easement-cases/${case_id}/documents/${doc_id}/record"
              payload: {}
              as: TitleExaminer
            - call: "POST /easement-cases/${case_id}/begin-mapping"
              payload: {}
              as: RightOfWayAgent
            - call: "POST /easement-cases/${case_id}/activate-monitoring"
              payload: {}
              as: RightOfWayAgent
            - call: "POST /easement-cases/${case_id}/permits"
              payload: { permittee_name: "F1", permit_type: "FENCE_RETENTION", requested_area_sqft: 100, requested_start_date: "2026-09-01T00:00:00Z", requested_end_date: "2026-12-01T00:00:00Z", insurance_certificate_on_file: true }
              as: RightOfWayAgent
              captures: { p1_id: $.data.id }
            - call: "POST /easement-cases/${case_id}/permits/${p1_id}/schedule-inspection"
              payload: {}
              as: VegetationInspector
            - call: "POST /easement-cases/${case_id}/permits/${p1_id}/record-inspection"
              payload: { result: "PASSED" }
              as: VegetationInspector
            - call: "GET /easement-cases/${case_id}"
              payload: {}
              as: RightOfWayAgent
              captures: { cv1: $.data.version }
            - call: "POST /easement-cases/${case_id}/permits/${p1_id}/approve"
              payload: { expected_case_version: "${cv1}" }
              as: RightOfWayAgent
          trigger:
            # Same type overlapping -> reject
            - call: "POST /easement-cases/${case_id}/permits"
              payload: { permittee_name: "F2", permit_type: "FENCE_RETENTION", requested_area_sqft: 100, requested_start_date: "2026-10-01T00:00:00Z", requested_end_date: "2026-11-01T00:00:00Z", insurance_certificate_on_file: true }
              as: RightOfWayAgent
              captures: { p2_id: $.data.id }
            - call: "POST /easement-cases/${case_id}/permits/${p2_id}/schedule-inspection"
              payload: {}
              as: VegetationInspector
            - call: "POST /easement-cases/${case_id}/permits/${p2_id}/record-inspection"
              payload: { result: "PASSED" }
              as: VegetationInspector
            - call: "GET /easement-cases/${case_id}"
              payload: {}
              as: RightOfWayAgent
              captures: { cv2: $.data.version }
            - call: "POST /easement-cases/${case_id}/permits/${p2_id}/approve"
              payload: { expected_case_version: "${cv2}" }
              as: RightOfWayAgent
              captures: { err_same: $.data.error_id }
            # Different type overlapping -> allow
            - call: "POST /easement-cases/${case_id}/permits"
              payload: { permittee_name: "L1", permit_type: "LANDSCAPING", requested_area_sqft: 100, requested_start_date: "2026-10-01T00:00:00Z", requested_end_date: "2026-11-01T00:00:00Z", insurance_certificate_on_file: true }
              as: RightOfWayAgent
