# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3356_full_time_service_corps_placement_schools_stipend
# 9 rules x 2 instances = 18 instances. Every recipe replays empty-DB -> target
# state using only §1.5 endpoints. Common setup steps are anchored (&k_*) in
# the first instance and referenced (*k_*) afterwards.
# Canonical world literals:
#   site:    service year 2026-09-01 .. 2027-06-15, annual_stipend_cents 1300000
#   school:  team_size 3 (min_active_members 1), annual_cost_share_cents 400000
#   member:  DOB 2003-05-20 (age 23 at 2026-09-01), BACHELORS_PLUS, US_CITIZEN,
#            0 prior terms, 0 prior awards
#   team:    backfill_limit 2, backfill_deadline 2027-01-15
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: stipend_provisional_vs_final_deduction
        grounds:
          - calculations.stipend_amounts
          - entities.StipendPayment.fields.base_amount_cents
          - entities.StipendPayment.fields.final_gross_cents
          - entities.StipendPayment.fields.net_amount_cents
        distinguishing_aspect: |
          Stipend domain: on identical period data the provisional variant
          (base_amount_cents 50000, blind to period length and deductions)
          diverges from the final variant computed at approval
          (final_gross 50000 minus 12000 deduction = net 38000).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Site ACTIVE. Member ACTIVE with stipend_status ACTIVE (no team needed)."
          setup_api_calls:
            - &k_clock
              call: "POST /corps/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SiteDirector
              as_user_id: "sd-1"
            - &k_site
              call: "POST /corps/sites"
              payload: { name: "Riverton Site", city: "Riverton", service_year_start: "2026-09-01", service_year_end: "2027-06-15", annual_stipend_cents: 1300000, district_committed_cents: 0, philanthropy_committed_cents: 0, federal_committed_cents: 0 }
              as: SiteDirector
              as_user_id: "sd-1"
              captures: { site_id: $.data.id }
            - &k_site_on
              call: "POST /corps/sites/${site_id}/state"
              payload: { to_status: "ACTIVE" }
              as: SiteDirector
              as_user_id: "sd-1"
            - &k_app
              call: "POST /corps/applications"
              payload: { site_id: "${site_id}", full_name: "Jordan Rivers", date_of_birth: "2003-05-20", education_level: "BACHELORS_PLUS", citizenship_status: "US_CITIZEN", prior_service_terms: 0, prior_full_awards_received: 0 }
              as: Applicant
              as_user_id: "app-jordan"
              captures: { app_id: $.data.id }
            - &k_screen
              call: "POST /corps/applications/${app_id}/state"
              payload: { to_status: "SCREEN" }
              as: ProgramManager
              as_user_id: "pm-1"
            - &k_interview
              call: "POST /corps/applications/${app_id}/state"
              payload: { to_status: "INTERVIEWED" }
              as: ProgramManager
              as_user_id: "pm-1"
            - &k_offer
              call: "POST /corps/applications/${app_id}/state"
              payload: { to_status: "OFFERED" }
              as: ProgramManager
              as_user_id: "pm-1"
            - &k_accept
              call: "POST /corps/applications/${app_id}/state"
              payload: { to_status: "ACCEPTED" }
              as: Applicant
              as_user_id: "app-jordan"
            - &k_enroll
              call: "POST /corps/applications/${app_id}/state"
              payload: { to_status: "ENROLLED" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { member_id: $.data.enrolled_member_id }
            - &k_activate
              call: "POST /corps/members/${member_id}/state"
              payload: { to_status: "ACTIVE", dimension: "SERVICE" }
              as: ProgramManager
              as_user_id: "pm-1"
          trigger:
            - call: "POST /corps/members/${member_id}/stipend-payments"
              payload: { period_start: "2026-09-01", period_end: "2026-09-14" }
              as: StipendAdministrator
              as_user_id: "sa-1"
              captures: { pay_id: $.data.id, base_amt: $.data.base_amount_cents }
            - call: "POST /corps/stipend-payments/${pay_id}/state"
              payload: { to_status: "APPROVED", deduction_cents: 12000 }
              as: StipendAdministrator
              as_user_id: "sa-2"
              captures: { final_gross: $.data.final_gross_cents, net_amt: $.data.net_amount_cents, pay_status: $.data.status, pay_approver: $.data.approved_by }
          assert:
            - "${base_amt} == 50000 (provisional variant: round_half_up(1300000 / 26), computed at creation before any deduction was known)"
            - "${final_gross} == 50000 (final variant: round_half_up(50000 x 14 / 14))"
            - "${net_amt} == 38000 (final variant nets the 12000 deduction — diverges from the 50000 provisional base on identical period data)"
            - "${pay_status} == APPROVED and ${pay_approver} == sa-2"

      - name: education_award_projection_vs_certification
        grounds:
          - calculations.education_award
          - entities.CorpsMember.fields.award_projected_cents
          - entities.CorpsMember.fields.award_amount_cents
        distinguishing_aspect: |
          Award domain (not stipend): with identical verified data (90.00
          VERIFIED hours), the forward-looking projection counts 106 remaining
          service days x 8.0 hours and projects the full 739500, while the
          exit certification counts VERIFIED entries only and pays the pro-rata
          554625 = round_half_up(739500 x 90 / 120).
        test_recipe:
          setup:
            - "Site ACTIVE. Member ACTIVE with exactly 90.00 VERIFIED hours: 12.0 on each of 2026-09-01..2026-09-07 and 6.0 on 2026-09-08, all DIRECT_SERVICE, all verified at clock 2026-09-16."
            - "Logical clock then advanced to 2027-03-01T00:00:00Z."
          setup_api_calls:
            - *k_clock
            - *k_site
            - *k_site_on
            - *k_app
            - *k_screen
            - *k_interview
            - *k_offer
            - *k_accept
            - *k_enroll
            - *k_activate
            - call: "POST /corps/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-16T00:00:00Z" }
              as: SiteDirector
              as_user_id: "sd-1"
            - call: "POST /corps/hour-entries"
              payload: { corps_member_id: "${member_id}", service_date: "2026-09-01", hours: 12.0, category: "DIRECT_SERVICE" }
              as: CorpsMember
              as_user_id: "${member_id}"
              captures: { he1: $.data.id }
            - call: "POST /corps/hour-entries/${he1}/review"
              payload: { decision: "VERIFY" }
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /corps/hour-entries"
              payload: { corps_member_id: "${member_id}", service_date: "2026-09-02", hours: 12.0, category: "DIRECT_SERVICE" }
              as: CorpsMember
              as_user_id: "${member_id}"
              captures: { he2: $.data.id }
            - call: "POST /corps/hour-entries/${he2}/review"
              payload: { decision: "VERIFY" }
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /corps/hour-entries"
              payload: { corps_member_id: "${member_id}", service_date: "2026-09-03", hours: 12.0, category: "DIRECT_SERVICE" }
              as: CorpsMember
              as_user_id: "${member_id}"
              captures: { he3: $.data.id }
            - call: "POST /corps/hour-entries/${he3}/review"
              payload: { decision: "VERIFY" }
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /corps/hour-entries"
              payload: { corps_member_id: "${member_id}", service_date: "2026-09-04", hours: 12.0, category: "DIRECT_SERVICE" }
              as: CorpsMember
              as_user_id: "${member_id}"
              captures: { he4: $.data.id }
            - call: "POST /corps/hour-entries/${he4}/review"
              payload: { decision: "VERIFY" }
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /corps/hour-entries"
              payload: { corps_member_id: "${member_id}", service_date: "2026-09-05", hours: 12.0, category: "DIRECT_SERVICE" }
              as: CorpsMember
              as_user_id: "${member_id}"
              captures: { he5: $.data.id }
            - call: "POST /corps/hour-entries/${he5}/review"
              payload: { decision: "VERIFY" }
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /corps/hour-entries"
              payload: { corps_member_id: "${member_id}", service_date: "2026-09-06", hours: 12.0, category: "DIRECT_SERVICE" }
              as: CorpsMember
              as_user_id: "${member_id}"
              captures: { he6: $.data.id }
            - call: "POST /corps/hour-entries/${he6}/review"
              payload: { decision: "VERIFY" }
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /corps/hour-entries"
              payload: { corps_member_id: "${member_id}", service_date: "2026-09-07", hours: 12.0, category: "DIRECT_SERVICE" }
              as: CorpsMember
              as_user_id: "${member_id}"
              captures: { he7: $.data.id }
            - call: "POST /corps/hour-entries/${he7}/review"
              payload: { decision: "VERIFY" }
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /corps/hour-entries"
              payload: { corps_member_id: "${member_id}", service_date: "2026-09-08", hours: 6.0, category: "DIRECT_SERVICE" }
              as: CorpsMember
              as_user_id: "${member_id}"
              captures: { he8: $.data.id }
            - call: "POST /corps/hour-entries/${he8}/review"
              payload: { decision: "VERIFY" }
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /corps/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: SiteDirector
              as_user_id: "sd-1"
            - call: "GET /corps/members/${member_id}"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { proj_award: $.data.award_projected_cents, proj_hours: $.data.projected_hours_total, m_v: $.data.version, verified_now: $.data.verified_hours_total }
          trigger:
            - call: "POST /corps/members/${member_id}/exit"
              payload: { expected_member_version: "${m_v}", exit_type: "COMPELLING_CIRCUMSTANCE" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { cert_award: $.data.award_amount_cents, award_st: $.data.award_status, svc_st: $.data.service_status }
          assert:
            - "${verified_now} == 90.0"
            - "${proj_hours} == 938.0 (90 verified + 106 remaining days x 8.0: 2027-03-02..2027-06-15 = 30+30+31+15 days)"
            - "${proj_award} == 739500 (projection variant: 938 >= 120 -> full award on identical verified data)"
            - "${award_st} == EARNED_PARTIAL and ${cert_award} == 554625 (certification variant: round_half_up(739500 x 90 / 120); 90 >= 24 minimum)"
            - "${svc_st} == EXITED_EARLY"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: cost_share_round_per_school_then_sum
        grounds:
          - calculations.district_cost_share_installments
          - entities.Site.fields.cost_share_installment_1_cents
          - entities.Site.fields.cost_share_installment_2_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: installment 1 is rounded per school THEN
          summed — schools at 333333 and 666667 cents give 166667 + 333334 =
          500001, whereas sum-then-round would give round(1000000 x 0.5) =
          500000. The DRAFT school (111111) must be excluded from the input set.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Site exists (SETUP is sufficient). School A (annual 333333) SIGNED, school B (annual 666667) SIGNED, school C (annual 111111) left in DRAFT."
          setup_api_calls:
            - *k_clock
            - *k_site
            - call: "POST /corps/schools"
              payload: { site_id: "${site_id}", name: "North Elementary", district_name: "Riverton USD", team_size: 3, service_scope: ["ATTENDANCE_SUPPORT"], annual_cost_share_cents: 333333 }
              as: SiteDirector
              as_user_id: "sd-1"
              captures: { school_a: $.data.id }
            - call: "POST /corps/schools/${school_a}/state"
              payload: { to_status: "SIGNED", dimension: "AGREEMENT" }
              as: SchoolLiaison
              as_user_id: "${school_a}"
            - call: "POST /corps/schools"
              payload: { site_id: "${site_id}", name: "South Elementary", district_name: "Riverton USD", team_size: 3, service_scope: ["MATH_TUTORING"], annual_cost_share_cents: 666667 }
              as: SiteDirector
              as_user_id: "sd-1"
              captures: { school_b: $.data.id }
            - call: "POST /corps/schools/${school_b}/state"
              payload: { to_status: "SIGNED", dimension: "AGREEMENT" }
              as: SchoolLiaison
              as_user_id: "${school_b}"
            - call: "POST /corps/schools"
              payload: { site_id: "${site_id}", name: "Draft Academy", district_name: "Riverton USD", team_size: 3, service_scope: ["LITERACY_TUTORING"], annual_cost_share_cents: 111111 }
              as: SiteDirector
              as_user_id: "sd-1"
              captures: { school_c: $.data.id }
          trigger:
            - call: "GET /corps/sites/${site_id}"
              payload: {}
              as: SiteDirector
              as_user_id: "sd-1"
              captures: { cs1: $.data.cost_share_installment_1_cents, cs2: $.data.cost_share_installment_2_cents, cst: $.data.cost_share_total_cents }
          assert:
            - "${cs1} == 500001 (per-school round_half_up first: 166667 + 333334; sum-then-round would give 500000)"
            - "${cs2} == 499999 (166666 + 333333; each school keeps the remainder cent)"
            - "${cst} == 1000000 (installment 1 + installment 2 == sum of annual cost shares)"
            - "The DRAFT school ${school_c} (111111) is excluded: all three totals would be larger otherwise"

      - name: fundraising_cap_circular_order
        grounds:
          - calculations.fundraising_cap_check
          - entities.CorpsMember.fields.verified_fundraising_hours
        distinguishing_aspect: |
          Mode (c) order-pinned circular dependency: the 10% cap is computed
          against the total AFTER including the candidate entry (T_new), and
          the candidate is itself fundraising. At verified total 18.0 /
          fundraising 1.0, a 0.75 candidate gives T_new 18.75, cap =
          floor(18.75 x 0.10 x 4) / 4 = 1.75, so F_new 1.75 <= 1.75 verifies
          at the boundary; the next 0.25 candidate gives T_new 19.0, cap still
          1.75, so F_new 2.0 > 1.75 is rejected. Evaluating the cap against
          the pre-candidate total instead flips the boundary accept.
        test_recipe:
          setup:
            - "Clock 2026-09-09T00:00:00Z. Site ACTIVE. Member ACTIVE with verified totals 18.75 hours of which 1.75 FUNDRAISING: 12.0 DIRECT (09-01), 5.0 DIRECT (09-02), 1.0 FUNDRAISING (09-02) verified, then 0.75 FUNDRAISING (09-02) verified."
            - "A further PENDING 0.25 FUNDRAISING entry exists for 09-02."
          setup_api_calls:
            - *k_clock
            - *k_site
            - *k_site_on
            - *k_app
            - *k_screen
            - *k_interview
            - *k_offer
            - *k_accept
            - *k_enroll
            - *k_activate
            - call: "POST /corps/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-09T00:00:00Z" }
              as: SiteDirector
              as_user_id: "sd-1"
            - call: "POST /corps/hour-entries"
              payload: { corps_member_id: "${member_id}", service_date: "2026-09-01", hours: 12.0, category: "DIRECT_SERVICE" }
              as: CorpsMember
              as_user_id: "${member_id}"
              captures: { fe1: $.data.id }
            - call: "POST /corps/hour-entries/${fe1}/review"
              payload: { decision: "VERIFY" }
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /corps/hour-entries"
              payload: { corps_member_id: "${member_id}", service_date: "2026-09-02", hours: 5.0, category: "DIRECT_SERVICE" }
              as: CorpsMember
              as_user_id: "${member_id}"
              captures: { fe2: $.data.id }
            - call: "POST /corps/hour-entries/${fe2}/review"
              payload: { decision: "VERIFY" }
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /corps/hour-entries"
              payload: { corps_member_id: "${member_id}", service_date: "2026-09-02", hours: 1.0, category: "FUNDRAISING" }
              as: CorpsMember
              as_user_id: "${member_id}"
              captures: { fe3: $.data.id }
            - call: "POST /corps/hour-entries/${fe3}/review"
              payload: { decision: "VERIFY" }
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /corps/hour-entries"
              payload: { corps_member_id: "${member_id}", service_date: "2026-09-02", hours: 0.75, category: "FUNDRAISING" }
              as: CorpsMember
              as_user_id: "${member_id}"
              captures: { fe4: $.data.id }
            - call: "POST /corps/hour-entries/${fe4}/review"
              payload: { decision: "VERIFY" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { fe4_status: $.data.status }
            - call: "POST /corps/hour-entries"
              payload: { corps_member_id: "${member_id}", service_date: "2026-09-02", hours: 0.25, category: "FUNDRAISING" }
              as: CorpsMember
              as_user_id: "${member_id}"
              captures: { fe5: $.data.id }
          trigger:
            - call: "POST /corps/hour-entries/${fe5}/review"
              payload: { decision: "VERIFY" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { cap_err: $.data.error_id }
            - call: "GET /corps/members/${member_id}"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { tot_after: $.data.verified_hours_total, fund_after: $.data.verified_fundraising_hours }
          assert:
            - "${fe4_status} == VERIFIED (0.75 candidate: T_new = 18.75 -> cap = floor(18.75 x 0.10 x 4) / 4 = 1.75; F_new = 1.75 <= 1.75 boundary accept)"
            - "${cap_err} == ERR_FUNDRAISING_CAP_EXCEEDED (0.25 candidate: T_new = 19.0 -> cap = floor(19.0 x 0.10 x 4) / 4 = 1.75; F_new = 2.0 > 1.75)"
            - "${tot_after} == 18.75 and ${fund_after} == 1.75 (failed verification leaves both totals untouched)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: school_agreement_amendment_and_suspension_cycle
        grounds:
          - state_machines.School.agreement_status
          - state_machines.School.data_sharing_status
          - concurrency_rules[school-amend-stale-version]
        distinguishing_aspect: |
          School is cyclic, not a linear pipeline: the agreement loops
          ACTIVE -> AMENDMENT_REVIEW -> ACTIVE via OCC-guarded amendment and
          liaison confirmation, loops ACTIVE -> SUSPENDED -> ACTIVE manually,
          and is forced ACTIVE -> SUSPENDED again when the data-sharing
          dimension expires (re-signing data sharing does NOT auto-resume the
          agreement).
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Site ACTIVE. School created, data sharing SIGNED, agreement SIGNED then ACTIVE (version 4 after activation)."
          setup_api_calls:
            - *k_clock
            - *k_site
            - *k_site_on
            - &k_school
              call: "POST /corps/schools"
              payload: { site_id: "${site_id}", name: "Riverton Elementary", district_name: "Riverton USD", team_size: 3, service_scope: ["ATTENDANCE_SUPPORT", "MATH_TUTORING"], annual_cost_share_cents: 400000 }
              as: SiteDirector
              as_user_id: "sd-1"
              captures: { school_id: $.data.id }
            - &k_ds_sign
              call: "POST /corps/schools/${school_id}/state"
              payload: { to_status: "SIGNED", dimension: "DATA_SHARING" }
              as: SchoolLiaison
              as_user_id: "${school_id}"
            - &k_agr_sign
              call: "POST /corps/schools/${school_id}/state"
              payload: { to_status: "SIGNED", dimension: "AGREEMENT" }
              as: SchoolLiaison
              as_user_id: "${school_id}"
            - &k_agr_active
              call: "POST /corps/schools/${school_id}/state"
              payload: { to_status: "ACTIVE", dimension: "AGREEMENT" }
              as: SiteDirector
              as_user_id: "sd-1"
              captures: { school_v: $.data.version }
          trigger:
            - call: "POST /corps/schools/${school_id}/amend"
              payload: { expected_school_version: "${school_v}", team_size: 5 }
              as: SiteDirector
              as_user_id: "sd-1"
              captures: { st1: $.data.agreement_status }
            - call: "POST /corps/schools/${school_id}/state"
              payload: { to_status: "ACTIVE", dimension: "AGREEMENT" }
              as: SchoolLiaison
              as_user_id: "${school_id}"
              captures: { st2: $.data.agreement_status }
            - call: "POST /corps/schools/${school_id}/state"
              payload: { to_status: "SUSPENDED", dimension: "AGREEMENT" }
              as: SiteDirector
              as_user_id: "sd-1"
              captures: { st3: $.data.agreement_status }
            - call: "POST /corps/schools/${school_id}/state"
              payload: { to_status: "ACTIVE", dimension: "AGREEMENT" }
              as: SiteDirector
              as_user_id: "sd-1"
              captures: { st4: $.data.agreement_status }
            - call: "POST /corps/schools/${school_id}/state"
              payload: { to_status: "EXPIRED", dimension: "DATA_SHARING" }
              as: SchoolLiaison
              as_user_id: "${school_id}"
              captures: { st5: $.data.agreement_status, ds5: $.data.data_sharing_status }
            - call: "POST /corps/schools/${school_id}/state"
              payload: { to_status: "SIGNED", dimension: "DATA_SHARING" }
              as: SchoolLiaison
              as_user_id: "${school_id}"
              captures: { st6: $.data.agreement_status, ds6: $.data.data_sharing_status }
            - call: "POST /corps/schools/${school_id}/state"
              payload: { to_status: "ACTIVE", dimension: "AGREEMENT" }
              as: SiteDirector
              as_user_id: "sd-1"
              captures: { st7: $.data.agreement_status, school_v7: $.data.version }
          assert:
            - "${st1} == AMENDMENT_REVIEW (first loop entry: amend from ACTIVE)"
            - "${st2} == ACTIVE (liaison confirms the amendment — first loop closes)"
            - "${st3} == SUSPENDED and ${st4} == ACTIVE (manual suspension loop)"
            - "${ds5} == EXPIRED and ${st5} == SUSPENDED (data-sharing expiry force-suspends the ACTIVE agreement)"
            - "${ds6} == SIGNED and ${st6} == SUSPENDED (re-signing data sharing does not auto-resume the agreement)"
            - "${st7} == ACTIVE and ${school_v7} == 11 (create v1 + 10 mutations)"

      - name: member_service_and_stipend_dimensions_evolve_independently
        grounds:
          - state_machines.CorpsMember.service_status
          - state_machines.CorpsMember.stipend_status
        distinguishing_aspect: |
          CorpsMember carries two independent state dimensions on one entity:
          a stipend hold (STIPEND dimension) suspends stipend while service
          stays ACTIVE; a service suspension force-suspends stipend; a stipend
          resume while service is SUSPENDED is rejected by the cross-dimension
          guard; a service resume auto-restores stipend.
        test_recipe:
          setup:
