  - rule_id: priority_pair_validation_conflict
    instances:

      - name: exam_state_gate_outranks_topic_referential_gate
        grounds:
          - validations[priority 42 category state ERR_RECRUIT_NOT_IN_ACADEMY]
          - validations[priority 70 category business_referential ERR_TOPIC_NOT_IN_STANDARD]
          - endpoints[POST /examinations]
          - errors.ERR_RECRUIT_NOT_IN_ACADEMY
          - errors.ERR_TOPIC_NOT_IN_STANDARD
        distinguishing_aspect: |
          One request violates a priority-42 state rule and a priority-70 business_referential rule
          at once: the examinee's academy_status is NOT_STARTED and the topic_code is not a
          topic_requirements key of the class standard. The 409 state error must win over the 422
          referential error, and the paired control call - identical topic, but a recruit whose
          academy_status IS IN_PROGRESS - proves the referential rule is live rather than absent.
          Evaluating cheap referential lookups first (the natural implementation order, since the
          standard is already loaded) returns ERR_TOPIC_NOT_IN_STANDARD and fails this instance.
