      - name: x2_disbursement_release_requires_file_closed
        grounds: [state_machines.DisbursementInstruction.APPROVED_to_RELEASED, "validations[priority=8]"]
        distinguishing_aspect: |
          Entity pair DisbursementInstruction -> EscrowFile (different pair than Filing -> Lien): an
