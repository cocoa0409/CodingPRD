              as: Underwriter
              captures: { pol_id: $.data.id }
            - call: "POST /open-policies/${pol_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /certificates"
              payload: { open_policy_id: "${pol_id}", commodity_class_id: "${cc_id}", vessel_id: "${vsl_id}", loading_port_id: "${port_load_id}", discharge_port_id: "${port_disch_id}", certificate_number: "CERT-A", valuation_basis: "CIF_PLUS_MARKUP", packaging_code: "EXPORT_CRATE", package_count: 120, gross_weight_kg: 18000, sailing_date: "2026-08-10T00:00:00Z", discharge_date: "2026-09-05T00:00:00Z", invoice_value: 1000000, freight_amount: 45000, duty_amount: 5000, war_cover_requested: true, strikes_cover_requested: true }
              as: Assured
