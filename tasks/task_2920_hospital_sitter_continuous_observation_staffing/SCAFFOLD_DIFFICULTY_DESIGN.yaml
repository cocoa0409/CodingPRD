              as: StaffingCoordinator
              captures: { s_n: $.data.id }
            - call: "POST /observation/orders"
              payload: { patient_id: "${p15}", ordering_provider_user_id: "prov-1", risk_categories: ["FALL"], required_modality: "ONE_TO_ONE_SITTER", clinical_rationale: "Fall precautions, sitter at bedside" }
              as: AttendingProvider
