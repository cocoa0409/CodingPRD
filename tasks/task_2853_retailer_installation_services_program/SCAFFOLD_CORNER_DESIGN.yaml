  - section: endpoints
    instances:

      - name: service_category_patch_is_partial_and_retirement_closes_the_catalogue_entry
        claim_type: standard_crud
        grounds:
          - endpoints[POST /service-categories]
          - endpoints[GET /service-categories]
          - endpoints[GET /service-categories/{id}]
          - endpoints[PATCH /service-categories/{id}]
          - errors.ERR_DUPLICATE_CODE
          - errors.ERR_REFERENCE_NOT_ELIGIBLE
        distinguishing_aspect: "PATCH touches only the named fields (code and trade_code are not even accepted), bumps version by exactly 1, the re-read returns the patched row, a second POST of the same code is ERR_DUPLICATE_CODE, and a RETIRED category is refused by POST /projects with ERR_REFERENCE_NOT_ELIGIBLE."
        test_recipe:
          setup:
            - "One ACTIVE category, one jurisdiction and one customer, so a project can be attempted against the category both before and after retirement."
          setup_api_calls:
            - call: "POST /service-categories"
              payload: { code: "FLOOR-DIRECT", name: "Direct-Ship Flooring Install", trade_code: "FLOORING", unit_of_measure: "SQFT", base_labor_rate_cents_per_unit: 425, minimum_billable_units: 150.00, measurement_required: false, permit_policy: "NEVER", deposit_pct: 0.30, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { cat_id: $.data.id, v1: $.data.version }
            - call: "POST /jurisdictions"
              payload: { code: "METRO-02", name: "Harbor District", permit_required_trades: [], permit_responsible_party: "RETAILER", inspection_required: false, min_liability_coverage_cents: 100000000, permit_unit_threshold: 0, inspection_lead_days: 3, max_concurrent_inspections: 2, background_check_recency_days: 365, license_required: true, labor_complexity_multiplier: 1.00, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Dana Reyes", email: "dana@example.com", jurisdiction_id: "${jur_id}" }
              as: ProgramAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /service-categories"
              payload: { code: "FLOOR-DIRECT", name: "Duplicate Attempt", trade_code: "FLOORING", unit_of_measure: "SQFT", base_labor_rate_cents_per_unit: 425, minimum_billable_units: 150.00, measurement_required: false, permit_policy: "NEVER", deposit_pct: 0.30, status: "ACTIVE" }
              as: ProgramAdmin
              captures: { err_dup: $.data.error_id }
            - call: "PATCH /service-categories/${cat_id}"
              payload: { name: "Direct-Ship Flooring Install (2026)", base_labor_rate_cents_per_unit: 480 }
              as: ProgramAdmin
              captures: { p_name: $.data.name, p_rate: $.data.base_labor_rate_cents_per_unit, p_trade: $.data.trade_code, p_dep: $.data.deposit_pct, v2: $.data.version }
            - call: "GET /service-categories/${cat_id}"
              payload: {}
              as: ProjectCoordinator
              captures: { g_name: $.data.name, g_rate: $.data.base_labor_rate_cents_per_unit, g_status: $.data.status }
            - call: "PATCH /service-categories/${cat_id}"
              payload: { status: "RETIRED" }
              as: ProgramAdmin
              captures: { r_status: $.data.status, v3: $.data.version }
            - call: "GET /service-categories?status=ACTIVE&limit=50&offset=0"
              payload: {}
              as: ProjectCoordinator
            - call: "POST /projects"
              payload: { customer_id: "${cust_id}", service_category_id: "${cat_id}", jurisdiction_id: "${jur_id}", site_address: "18 Larch Way", estimated_units: 420.00, requested_install_date: "2026-08-25T13:00:00.000Z" }
              as: ProjectCoordinator
              captures: { err_ret: $.data.error_id }
          assert:
            - "${err_dup} == 'ERR_DUPLICATE_CODE' with HTTP 409 AND ServiceCategory.${cat_id}.version == ${v1} — the rejected create changed nothing"
            - "${p_name} == 'Direct-Ship Flooring Install (2026)' AND ${p_rate} == 480 AND ${p_trade} == 'FLOORING' AND ${p_dep} == 0.30 — unnamed fields are untouched"
            - "${v2} == ${v1} + 1 AND ${v3} == ${v2} + 1 — exactly one increment per accepted PATCH"
            - "${g_name} == ${p_name} AND ${g_rate} == 480 AND ${g_status} == 'ACTIVE' — the read-back matches the patched row"
            - "${r_status} == 'RETIRED', and the GET /service-categories?status=ACTIVE page returns total_count 0 with an empty data array — the status filter excludes the retired row"
            - "${err_ret} == 'ERR_REFERENCE_NOT_ELIGIBLE' with HTTP 409 — a RETIRED category cannot back a new project"

      - name: settlement_preview_is_role_sensitive_and_writes_nothing
        claim_type: computed_read
