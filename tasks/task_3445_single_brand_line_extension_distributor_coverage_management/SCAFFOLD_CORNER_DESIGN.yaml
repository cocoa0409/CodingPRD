        distinguishing_aspect: "Posture thresholds are exact: two open severity-3 cases give severity_sum 6 -> ELEVATED (not CRITICAL, which needs sum >= 10 or a severity-5 case); closing one drops back to NORMAL at sum 3."
        test_recipe:
