scenario: "2376. Medicare Cost Report Preparation & Wage Index Review (hospital reimbursement department): trial balance mapping to cost centers with reclassifications and adjustments, statistical allocation bases for overhead stepdown, wage index data collection with occupational mix survey and hours/salary verification, graduate medical education resident counts and rotation tracking, disproportionate share and uncompensated care data compilation, filing deadline, tentative settlement and final settlement stages, audit adjustment response, reopening and appeal to the review board, interim rate adjustment requests based on projections"
domain_name: "medicare-cost-report-wage-index"
api_prefix: "/"

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers
    - derived_field_reconciliation

  entity_topology: hybrid
  # CostReport is the aggregate root for the accounting tree (CostCenter,
  # TrialBalanceLine, WorkpaperEntry, StepdownRun, WageIndexSubmission,
  # UccDataSet, Settlement); Resident/RotationAssignment hang off Provider and
  # reach across into CostCenter; AuditAdjustment/AppealCase/InterimRateRequest
  # are cross-aggregate peers keyed by explicit foreign keys.

  state_machine_shape: parallel
  # CostReport carries two independent state dimensions (`status` for the
  # filing/settlement lifecycle, `wage_data_status` for the wage-index review
  # lifecycle) plus a settlement->reopening cycle; WageIndexSubmission is
  # cyclic (ACCEPTED -> UNDER_REVIEW -> CHANGE_REQUESTED -> SUBMITTED ->
  # UNDER_REVIEW -> ACCEPTED); AuditAdjustment is branching fork-join.

  relationship_patterns:
    - one_to_many          # CostReport -> CostCenter / TrialBalanceLine / ...
    - cross_aggregate      # RotationAssignment.cost_center_id, AuditAdjustment.target_cost_center_id
    - polymorphic          # AppealCase.kind selects REOPENING vs PRRB_APPEAL semantics on one row

  role_model: segregation_of_duties
  # Provider-side preparation (ReimbursementAnalyst) is separated from
  # provider-side attestation/filing (ReimbursementManager); contractor-side
  # audit proposal is separated from audit resolution by opaque user id;
  # the review board (ReviewBoardClerk) may only record PRRB decisions.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# 1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Provider
    parent: null
    common_fields: true
    fields:
      - name: ccn
        type: string
        source: input
        description: CMS certification number; unique across all Providers
        constraints: "6 characters, digits only; unique"
      - name: name
        type: string
        source: input
        description: hospital legal name
        constraints: "1..200 chars"
      - name: cbsa_code
        type: string
        source: input
        description: labor market area code used for wage index grouping
        constraints: "5 characters, digits only"
      - name: teaching_status
        type: enum
        source: input
        description: whether the hospital operates approved GME programs
        default: NON_TEACHING
        constraints: "TEACHING | NON_TEACHING"
      - name: fte_cap
        type: number
        source: input
        description: provider-specific unweighted GME FTE cap applied by gme_fte_rolling_average
        default: 0
        constraints: ">= 0, 2 decimal places"
      - name: current_interim_rate_cents
        type: integer
        source: input
        description: interim payment rate per Medicare discharge in cents; overwritten by an APPROVED InterimRateRequest
        default: 0
        constraints: ">= 0"
      - name: approved_interim_period_count
        type: integer
        source: computed
        description: "count of InterimRateRequest rows with provider_id == this Provider.id and status == APPROVED"
        default: 0
        constraints: ">= 0"

  - name: CostReport
    parent: Provider
    common_fields: true
    fields:
      - name: provider_id
        type: string
        source: input
        description: "FK -> Provider.id; the filing hospital"
      - name: fiscal_year_begin
        type: string
        source: input
        description: first day of the cost reporting period (date, YYYY-MM-DD)
        constraints: "valid ISO date; must be < fiscal_year_end"
      - name: fiscal_year_end
        type: string
        source: input
        description: last day of the cost reporting period (date, YYYY-MM-DD)
        constraints: "valid ISO date; period length 1..366 days"
      - name: filing_deadline
        type: string
        source: computed
        description: "fiscal_year_end plus 5 calendar months, clamped to the last day of the target month (date, YYYY-MM-DD)"
      - name: status
        type: enum
        source: system
        description: filing and settlement lifecycle dimension
        default: DRAFT
        constraints: "DRAFT | FILED | TENTATIVE_SETTLED | FINAL_SETTLED | REOPENED | AMENDED_FILED | CLOSED"
      - name: wage_data_status
        type: enum
        source: system
        description: wage-index data collection dimension; evolves independently of `status`, driven only by the report's WageIndexSubmission transitions
        default: NOT_STARTED
        constraints: "NOT_STARTED | COLLECTED | UNDER_REVIEW | VERIFIED | REVISION_REQUESTED | REJECTED"
      - name: allocation_status
        type: enum
        source: system
        description: freshness of the overhead stepdown relative to cost-center inputs
        default: NOT_RUN
        constraints: "NOT_RUN | CURRENT | STALE"
      - name: apportionment_method
        type: enum
        source: input
        description: default stepdown method used when POST stepdown-runs omits `method`
        default: SINGLE_APPORTIONMENT
        constraints: "SINGLE_APPORTIONMENT | DOUBLE_APPORTIONMENT"
      - name: medicare_utilization_ratio
        type: number
        source: input
        description: Medicare share of reimbursable cost used by settlement_amount
        default: 0.4000
        constraints: "0.0000 .. 1.0000, 4 decimal places"
      - name: interim_payments_received_cents
        type: integer
        source: input
        description: interim payments already received from the contractor for this period, in cents
        default: 0
        constraints: ">= 0"
      - name: total_charges_cents
        type: integer
        source: input
        description: total facility charges for the period, in cents; denominator of cost_to_charge_ratio
        default: 0
        constraints: ">= 0"
      - name: medicare_discharges
        type: integer
        source: input
        description: Medicare discharges for the period; denominator of allowable_cost_per_discharge_cents
        default: 0
        constraints: ">= 0"
      - name: total_direct_cost_cents
        type: integer
        source: computed
        description: "sum of CostCenter.direct_cost_cents over all CostCenters of this report"
        default: 0
      - name: unmapped_tb_total_cents
        type: integer
        source: computed
        description: "sum of TrialBalanceLine.amount_cents for this report where status == UNMAPPED"
        default: 0
      - name: total_allowable_cost_cents
        type: integer
        source: computed
        description: "sum of CostCenter.allocated_total_cost_cents for center_type IN {ROUTINE, ANCILLARY} after the latest COMPLETED StepdownRun; 0 while allocation_status == NOT_RUN"
        default: 0
      - name: cost_to_charge_ratio
        type: number
        source: computed
        description: "total_allowable_cost_cents / total_charges_cents, 6 decimal places, round_half_up; 0.000000 when total_charges_cents == 0"
        default: 0.000000
      - name: unweighted_fte_days_total
        type: number
        source: computed
        description: "sum of RotationAssignment.fte_days over ACTIVE assignments whose cost_center_id belongs to this report"
        default: 0.0000
      - name: unweighted_fte_total
        type: number
        source: computed
        description: per-resident FTE summed, 2 decimal places (see gme_fte_rolling_average)
        default: 0.00
      - name: capped_unweighted_fte
        type: number
        source: computed
        description: "min(unweighted_fte_total, Provider.fte_cap), 2 decimal places"
        default: 0.00
      - name: weighted_fte_total
        type: number
        source: computed
        description: IRP-weighted FTE total, 2 decimal places
        default: 0.00
      - name: rolling_average_fte
        type: number
        source: computed
        description: three-year rolling average of capped_unweighted_fte, 2 decimal places
        default: 0.00
      - name: allowable_cost_per_discharge_cents
        type: integer
        source: computed
        description: "round_half_up(total_allowable_cost_cents / medicare_discharges) stamped when status becomes FINAL_SETTLED; 0 before that"
        default: 0
      - name: filed_at
        type: datetime
        source: system
        description: logical-clock instant of the first successful file action; null while DRAFT
      - name: amendment_count
        type: integer
        source: computed
        description: number of successful file actions after the first one
        default: 0

  - name: CostCenter
    parent: CostReport
    common_fields: true
    fields:
      - name: cost_report_id
        type: string
        source: input
        description: "FK -> CostReport.id; owning cost report"
      - name: code
        type: string
        source: input
        description: worksheet A line code; unique within the cost report
        constraints: "5 characters, digits only; unique per cost_report_id"
      - name: name
        type: string
        source: input
        description: cost center label
      - name: center_type
        type: enum
        source: input
        description: stepdown role of this cost center
        constraints: "GENERAL_SERVICE | ANCILLARY | ROUTINE | NONREIMBURSABLE"
      - name: allocation_basis
        type: enum
        source: input
        description: statistic this center uses to distribute its accumulated cost; required non-NONE iff center_type == GENERAL_SERVICE
        default: NONE
        constraints: "SQUARE_FEET | MEALS_SERVED | POUNDS_LAUNDRY | NURSING_HOURS | NONE"
      - name: stepdown_order
        type: integer
        source: input
        description: ascending order in which GENERAL_SERVICE centers close; required and unique among the report's GENERAL_SERVICE centers, must be omitted for other center types
        constraints: ">= 1; unique per cost_report_id among GENERAL_SERVICE centers AT CREATION (PATCH /cost-centers/{id} may renumber into a transient duplicate, which a later stepdown run reports as a FAILED run rather than a 422)"
      - name: statistics
        type: object
        source: input
        description: "statistical allocation base units this center receives on, keyed by basis name"
        default: {}
        constraints: "keys subset of {SQUARE_FEET, MEALS_SERVED, POUNDS_LAUNDRY, NURSING_HOURS}; values numbers >= 0"
      - name: direct_cost_cents
        type: integer
        source: computed
        description: "sum of TrialBalanceLine.amount_cents where mapped_cost_center_id == this id AND status == MAPPED"
        default: 0
      - name: reclassified_amount_cents
        type: integer
        source: computed
        description: "signed sum of WorkpaperEntry legs targeting this center where entry_type == RECLASSIFICATION AND status == ACTIVE"
        default: 0
      - name: adjustment_amount_cents
        type: integer
        source: computed
        description: "signed sum of WorkpaperEntry legs targeting this center where entry_type == ADJUSTMENT AND status == ACTIVE"
        default: 0
      - name: post_reclass_direct_cost_cents
        type: integer
        source: computed
        description: "direct_cost_cents + reclassified_amount_cents"
        default: 0
      - name: post_adjustment_cost_cents
        type: integer
        source: computed
        description: "post_reclass_direct_cost_cents + adjustment_amount_cents; the pool the stepdown starts from"
        default: 0
      - name: allocated_in_cents
        type: integer
        source: computed
        description: cost received from GENERAL_SERVICE centers in the latest COMPLETED StepdownRun
        default: 0
      - name: allocated_out_cents
        type: integer
        source: computed
        description: cost distributed away from this center in the latest COMPLETED StepdownRun
        default: 0
      - name: allocated_total_cost_cents
        type: integer
        source: computed
        description: "post_adjustment_cost_cents + allocated_in_cents - allocated_out_cents"
        default: 0

  - name: TrialBalanceLine
    parent: CostReport
    common_fields: true
    fields:
      - name: cost_report_id
        type: string
        source: input
        description: "FK -> CostReport.id"
      - name: gl_account
        type: string
        source: input
        description: general ledger account number as filed by the hospital
      - name: description
        type: string
        source: input
        description: ledger account label
      - name: amount_cents
        type: integer
        source: input
        description: trial balance amount in cents; may be negative (credit balance)
      - name: mapped_cost_center_id
        type: string
        source: input
        description: "FK -> CostCenter.id; null until the line is mapped"
        default: null
      - name: status
        type: enum
        source: system
        description: mapping state of the ledger line
        default: UNMAPPED
        constraints: "UNMAPPED | MAPPED"

  - name: WorkpaperEntry
    parent: CostReport
    common_fields: true
    fields:
      - name: cost_report_id
        type: string
        source: input
        description: "FK -> CostReport.id"
      - name: entry_type
        type: enum
        source: input
        description: A-6 reclassification (must net to zero) or A-8 adjustment (need not)
        constraints: "RECLASSIFICATION | ADJUSTMENT"
      - name: code
        type: string
        source: input
        description: workpaper reference code
      - name: description
        type: string
        source: input
        description: narrative basis for the entry
      - name: legs
        type: array
        source: input
        description: "array of objects { cost_center_id, amount_cents }; each cost_center_id MUST identify a CostCenter whose cost_report_id equals this entry's cost_report_id, otherwise ERR_COST_CENTER_FOREIGN_TO_REPORT"
        constraints: "RECLASSIFICATION: >= 2 legs and sum(amount_cents) == 0; ADJUSTMENT: exactly 1 leg; amount_cents integer != 0"
      - name: source
        type: enum
        source: system
        description: MANUAL for analyst-entered entries, AUDIT for entries synthesized by AuditAdjustment resolution
        default: MANUAL
        constraints: "MANUAL | AUDIT"
      - name: is_non_allowable
        type: boolean
        source: input
        description: marks an A-8 adjustment removing non-allowable cost; when true every leg amount_cents must be < 0
        default: false
      - name: status
        type: enum
        source: system
        description: whether the entry currently contributes to cost center balances
        default: ACTIVE
        constraints: "ACTIVE | REVERSED"
      - name: source_audit_adjustment_id
        type: string
        source: system
        description: "FK -> AuditAdjustment.id; set only when source == AUDIT, null otherwise"
        default: null
      - name: reversed_at
        type: datetime
        source: system
        description: logical-clock instant of reversal; null while ACTIVE
        default: null

  - name: StepdownRun
    parent: CostReport
    common_fields: true
    fields:
      - name: cost_report_id
        type: string
        source: input
        description: "FK -> CostReport.id"
      - name: method
        type: enum
        source: input
        description: apportionment algorithm variant; defaults to the report's apportionment_method
        constraints: "SINGLE_APPORTIONMENT | DOUBLE_APPORTIONMENT"
      - name: status
        type: enum
        source: system
        description: run lifecycle
        default: QUEUED
        constraints: "QUEUED | COMPLETED | FAILED | STALE"
      - name: total_allocated_cents
        type: integer
        source: computed
        description: "sum of allocation_lines[].amount_cents produced by this run"
        default: 0
      - name: residual_unallocated_cents
        type: integer
        source: computed
        description: cost left sitting on GENERAL_SERVICE centers because every eligible receiver had statistic 0, plus any second-pass residual
        default: 0
      - name: allocation_lines
        type: array
        source: computed
        description: "array of objects { pass, from_cost_center_id, to_cost_center_id, amount_cents } in execution order"
        default: []
      - name: failure_reason
        type: string
        source: computed
        description: set when status == FAILED, null otherwise
        default: null
      - name: stale_reason
        type: enum
        source: system
        description: why a COMPLETED run was invalidated
        default: null
        constraints: "SUPERSEDED_BY_NEWER_RUN | COST_CENTER_INPUT_CHANGED | WORKPAPER_ENTRY_CHANGED | null"
      - name: completed_at
        type: datetime
        source: system
        description: logical-clock instant the run reached COMPLETED; null otherwise
        default: null

  - name: WageIndexSubmission
    parent: CostReport
    common_fields: true
    fields:
      - name: cost_report_id
        type: string
        source: input
        description: "FK -> CostReport.id; at most one submission per report with status != REJECTED"
      - name: status
        type: enum
        source: system
        description: wage index review lifecycle (cyclic)
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | UNDER_REVIEW | CHANGE_REQUESTED | ACCEPTED | REJECTED"
      - name: revision_number
        type: integer
        source: computed
        description: incremented by 1 on every submit action after the first one
        default: 0
      - name: total_salaries_cents
        type: integer
        source: input
        description: worksheet S-3 part II total salaries in cents
        constraints: ">= 0"
      - name: total_paid_hours
        type: number
        source: input
        description: total paid hours corresponding to total_salaries_cents
        constraints: "> 0, 2 decimal places"
      - name: wage_related_costs_cents
        type: integer
        source: input
        description: pension and benefit costs claimed as wage-related, in cents
        default: 0
        constraints: ">= 0"
      - name: contract_labor_cents
        type: integer
        source: input
        description: contract labor cost in cents
        default: 0
        constraints: ">= 0"
      - name: contract_labor_hours
        type: number
        source: input
        description: contract labor hours; 0 means hours were not documented
        default: 0
        constraints: ">= 0, 2 decimal places"
      - name: excluded_area_salaries_cents
        type: integer
        source: input
        description: salaries of excluded (non-acute) areas removed from the wage index, in cents
        default: 0
        constraints: ">= 0"
      - name: excluded_area_hours
        type: number
        source: input
        description: hours of excluded areas removed from the wage index
        default: 0
        constraints: ">= 0, 2 decimal places"
      - name: allowed_wage_related_costs_cents
        type: integer
        source: computed
        description: "min(wage_related_costs_cents, floor(0.25 * total_salaries_cents))"
        default: 0
      - name: unadjusted_ahw_cents
        type: integer
        source: computed
        description: average hourly wage in whole cents, unadjusted variant
        default: 0
      - name: occ_mix_adjusted_ahw_cents
        type: integer
        source: computed
        description: occupational-mix-adjusted average hourly wage in whole cents; null when occ_mix_category_count < 3
        default: null
      - name: occ_mix_category_count
        type: integer
        source: computed
        description: "count of OccMixResponse rows for this submission with reported_hours > 0"
        default: 0
      - name: effective_ahw_cents
        type: integer
        source: computed
        description: occ_mix_adjusted_ahw_cents when occ_mix_category_count >= 3, else unadjusted_ahw_cents
        default: 0
      - name: reported_hours_total
        type: number
        source: computed
        description: "sum of OccMixResponse.reported_hours for this submission"
        default: 0
      - name: review_note
        type: string
        source: system
        description: latest contractor review note; null until a review decision is recorded
        default: null

  - name: OccMixResponse
    parent: WageIndexSubmission
    common_fields: true
    fields:
      - name: wage_index_submission_id
        type: string
        source: input
        description: "FK -> WageIndexSubmission.id"
      - name: category
        type: enum
        source: input
        description: occupational mix nursing category; unique per submission
        constraints: "RN | LPN | NURSE_AIDE | MEDICAL_ASSISTANT | NURSE_PRACTITIONER; unique per wage_index_submission_id"
      - name: reported_hours
        type: number
        source: input
        description: patient-care hours reported for this category; 0 means the category was not staffed
        constraints: ">= 0, 2 decimal places"
      - name: reported_salaries_cents
        type: integer
        source: input
        description: salaries paid for this category, in cents
        constraints: ">= 0"
      - name: category_ahw_cents
        type: integer
        source: computed
        description: "round_half_up(reported_salaries_cents / reported_hours); null when reported_hours == 0"
        default: null

  - name: Resident
    parent: Provider
    common_fields: true
    fields:
      - name: provider_id
        type: string
        source: input
        description: "FK -> Provider.id"
      - name: full_name
        type: string
        source: input
        description: resident name
      - name: program
        type: string
        source: input
        description: approved GME program name
      - name: irp_status
        type: enum
        source: input
        description: WITHIN_IRP weights 1.00, BEYOND_IRP weights 0.50 in weighted_fte_total
        default: WITHIN_IRP
        constraints: "WITHIN_IRP | BEYOND_IRP"
      - name: assigned_fte_days
        type: number
        source: computed
        description: "sum of RotationAssignment.fte_days over this resident's ACTIVE assignments"
        default: 0.0000

  - name: RotationAssignment
    parent: Resident
    common_fields: true
    fields:
      - name: resident_id
        type: string
        source: input
        description: "FK -> Resident.id"
      - name: cost_center_id
        type: string
        source: input
        description: "FK -> CostCenter.id; the rotation site; its CostReport must belong to the resident's Provider"
      - name: start_date
        type: string
        source: input
        description: inclusive first day of the rotation (date, YYYY-MM-DD)
      - name: end_date
        type: string
        source: input
        description: exclusive last day of the rotation (date, YYYY-MM-DD); intervals are half-open [start_date, end_date)
        constraints: "must be > start_date"
      - name: fte_fraction
        type: number
        source: input
        description: share of the resident's time on this rotation
        constraints: "> 0.0000 and <= 1.0000, 4 decimal places"
      - name: status
        type: enum
        source: system
        description: whether the assignment counts toward FTE totals
        default: ACTIVE
        constraints: "ACTIVE | VOID"
      - name: overlap_days
        type: integer
        source: computed
        description: "count of days in [start_date, end_date) intersected with [CostReport.fiscal_year_begin, CostReport.fiscal_year_end + 1 day)"
        default: 0
      - name: fte_days
        type: number
        source: computed
        description: "fte_fraction * overlap_days, 4 decimal places; 0.0000 when status == VOID"
        default: 0.0000

  - name: UccDataSet
    parent: CostReport
    common_fields: true
    fields:
      - name: cost_report_id
        type: string
        source: input
        description: "FK -> CostReport.id; at most one UccDataSet per cost report"
      - name: medicaid_non_medicare_days
        type: integer
        source: input
        description: Medicaid-eligible, non-Medicare inpatient days
        constraints: ">= 0"
      - name: total_inpatient_days
        type: integer
        source: input
        description: total inpatient days; denominator of medicaid_fraction
        constraints: "> 0"
      - name: ssi_days
        type: integer
        source: input
        description: Medicare Part A days for SSI-entitled patients
        constraints: ">= 0"
      - name: medicare_part_a_days
        type: integer
        source: input
        description: total Medicare Part A days; denominator of ssi_fraction
        constraints: "> 0"
      - name: charity_care_charges_cents
        type: integer
        source: input
        description: worksheet S-10 charity care charges in cents
        constraints: ">= 0"
      - name: non_medicare_bad_debt_cents
        type: integer
        source: input
        description: non-Medicare bad debt expense in cents
        default: 0
        constraints: ">= 0"
      - name: medicaid_fraction
        type: number
        source: computed
        description: "round_half_up(medicaid_non_medicare_days / total_inpatient_days, 4)"
        default: 0.0000
      - name: ssi_fraction
        type: number
        source: computed
        description: "round_half_up(ssi_days / medicare_part_a_days, 4)"
        default: 0.0000
      - name: dsh_patient_percentage
        type: number
        source: computed
        description: "round_half_up(medicaid_fraction + ssi_fraction, 4) — the two fractions are rounded FIRST, then summed"
        default: 0.0000
      - name: dsh_eligible
        type: boolean
        source: computed
        description: "true iff dsh_patient_percentage >= 0.1500"
        default: false
      - name: cost_to_charge_ratio
        type: number
        source: computed
        description: snapshot of CostReport.cost_to_charge_ratio at the last recompute, 6 decimal places
        default: 0.000000
      - name: uncompensated_care_cost_cents
        type: integer
        source: computed
        description: charity care charges converted to cost plus allowable bad debt, in cents
        default: 0
      - name: ucc_payment_cents
        type: integer
        source: computed
        description: uncompensated care payment share in cents; 0 when dsh_eligible == false
        default: 0
      - name: recompute_required
        type: boolean
        source: system
        description: set true when the cost report's allocation went STALE after this data set was last recomputed
        default: false

  - name: Settlement
    parent: CostReport
    common_fields: true
    fields:
      - name: cost_report_id
        type: string
        source: input
        description: "FK -> CostReport.id"
      - name: stage
        type: enum
        source: input
        description: settlement stage
        constraints: "TENTATIVE | FINAL"
      - name: status
        type: enum
        source: system
        description: settlement lifecycle
        default: ISSUED
        constraints: "ISSUED | APPEALED | SUPERSEDED | RESETTLED"
      - name: basis_method
        type: enum
        source: computed
        description: method of the StepdownRun this settlement was computed from
        constraints: "SINGLE_APPORTIONMENT | DOUBLE_APPORTIONMENT"
      - name: basis_allowable_cost_cents
        type: integer
        source: computed
        description: snapshot of CostReport.total_allowable_cost_cents at issuance
        default: 0
      - name: reimbursable_cost_cents
        type: integer
        source: computed
        description: "round_half_up(basis_allowable_cost_cents * CostReport.medicare_utilization_ratio)"
        default: 0
      - name: ucc_payment_cents
        type: integer
        source: computed
        description: uncompensated care payment folded into this settlement; always 0 for stage TENTATIVE
        default: 0
      - name: prior_tentative_paid_cents
        type: integer
        source: computed
        description: "sum of amount_due_provider_cents over this report's Settlements with stage == TENTATIVE and status != SUPERSEDED; 0 for stage TENTATIVE"
        default: 0
      - name: amount_due_provider_cents
        type: integer
        source: computed
        description: signed settlement amount in cents; positive means the contractor owes the provider
        default: 0
      - name: recompute_required
        type: boolean
        source: system
        description: set true when a later stepdown run changed the allocation this settlement was computed from
        default: false
      - name: issued_at
        type: datetime
        source: system
        description: logical-clock instant of issuance

  - name: AuditAdjustment
    parent: Settlement
    common_fields: true
    fields:
      - name: settlement_id
        type: string
        source: input
        description: "FK -> Settlement.id; the settlement under audit"
      - name: target_cost_center_id
        type: string
        source: input
        description: "FK -> CostCenter.id; the cost center the adjustment lands on"
      - name: code
        type: string
        source: input
        description: audit exception code
      - name: rationale
        type: string
        source: input
        description: auditor narrative
      - name: proposed_amount_cents
        type: integer
        source: input
        description: signed cost adjustment in cents
        constraints: "!= 0"
      - name: status
        type: enum
        source: system
        description: audit response lifecycle (branching)
        default: PROPOSED
        constraints: "PROPOSED | ACCEPTED_BY_PROVIDER | PROTESTED | INCORPORATED | WITHDRAWN"
      - name: proposed_by_user_id
        type: string
        source: system
        description: opaque MacAuditor id taken from X-User-ID at proposal time
      - name: resolved_by_user_id
        type: string
        source: system
        description: opaque MacAuditor id taken from X-User-ID at resolution time; null until resolved
        default: null
      - name: provider_response_note
        type: string
        source: system
        description: provider narrative captured by the respond action; null until responded
        default: null

  - name: AppealCase
    parent: CostReport
    common_fields: true
    fields:
      - name: cost_report_id
        type: string
        source: input
        description: "FK -> CostReport.id"
      - name: settlement_id
        type: string
        source: input
        description: "FK -> Settlement.id; must be a Settlement of the same cost report with stage == FINAL"
      - name: kind
        type: enum
        source: input
        description: contractor reopening request or Provider Reimbursement Review Board appeal
        constraints: "REOPENING | PRRB_APPEAL"
      - name: issue_description
        type: string
        source: input
        description: disputed issue narrative
      - name: amount_at_issue_cents
        type: integer
        source: input
        description: dollars in controversy, in cents
        constraints: "> 0 (schema level only; the PRRB_APPEAL minimum of 1000000 is NOT a schema constraint — it is the priority-13 rule ERR_PRRB_AMOUNT_BELOW_MINIMUM, so 500000 on a PRRB_APPEAL is a 422, never a 400)"
      - name: status
        type: enum
        source: system
        description: appeal lifecycle (branching by kind)
        default: REQUESTED
        constraints: "REQUESTED | GRANTED | DENIED | HEARD | DECIDED_FOR_PROVIDER | DECIDED_FOR_CONTRACTOR"
      - name: decided_at
        type: datetime
        source: system
        description: logical-clock instant of the decision; null while REQUESTED
        default: null
      - name: decision_note
        type: string
        source: system
        description: decision narrative; null while REQUESTED
        default: null

  - name: InterimRateRequest
    parent: Provider
    common_fields: true
    fields:
      - name: provider_id
        type: string
        source: input
        description: "FK -> Provider.id"
      - name: basis_cost_report_id
        type: string
        source: input
        description: "FK -> CostReport.id; must belong to provider_id and have status == FINAL_SETTLED"
      - name: projected_discharges
        type: integer
        source: input
        description: projected Medicare discharges for the requested period
        constraints: "> 0"
      - name: trend_factor
        type: number
        source: input
        description: cost inflation factor applied to the basis cost per discharge
        constraints: ">= 0.0000 and <= 0.5000, 4 decimal places"
      - name: effective_from
        type: string
        source: input
        description: first day the requested rate would apply (date, YYYY-MM-DD); intervals are closed [effective_from, effective_to]
      - name: effective_to
        type: string
        source: input
        description: last day the requested rate would apply, inclusive (date, YYYY-MM-DD)
        constraints: "must be > effective_from"
      - name: status
        type: enum
        source: system
        description: request lifecycle
        default: PENDING
        constraints: "PENDING | APPROVED | DENIED | SUPERSEDED"
      - name: projected_cost_per_discharge_cents
        type: integer
        source: computed
        description: uncapped projected cost per discharge in cents
        default: 0
      - name: variance_ratio
        type: number
        source: computed
        description: variance of the uncapped projection against the provider's current interim rate, 4 decimal places
        default: 0.0000
      - name: approved_rate_cents
        type: integer
        source: computed
        description: capped rate that would take effect; computed at creation, applied to the Provider only on approval
        default: 0
      - name: adjustment_amount_cents
        type: integer
        source: computed
        description: "(approved_rate_cents - Provider.current_interim_rate_cents) * projected_discharges at creation time"
        default: 0
      - name: decision_note
        type: string
        source: system
        description: contractor decision narrative; null while PENDING
        default: null

# =====================================================================
# 1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: CostReport
    initial_state: DRAFT
    terminal_states: [CLOSED]
    note: |
      CostReport carries TWO independent state dimensions on the same row.
      `status` (below) is driven by file / settlement / appeal actions.
      `wage_data_status` is driven ONLY by the report's WageIndexSubmission
      transitions and never by a `status` transition; the transitions of the
      two dimensions are therefore freely interleavable and combinations such
      as (FILED, REVISION_REQUESTED) are reachable.
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /cost-reports/{id}/file"
        actor: ReimbursementManager
        preconditions:
          - "unmapped_tb_total_cents == 0"
          - "allocation_status == CURRENT"
          - "wage_data_status == VERIFIED (i.e. the report's WageIndexSubmission.status == ACCEPTED)"
          - "exactly one UccDataSet exists for this report"
          - "logical clock date <= filing_deadline"
        side_effects:
          - "sets filed_at to the current logical clock instant"
          - "recomputes gme_fte_rolling_average (unweighted_fte_total, capped_unweighted_fte, weighted_fte_total, rolling_average_fte)"
          - "increments CostReport.version by 1"
      - from: FILED
        to: TENTATIVE_SETTLED
        trigger: "POST /cost-reports/{id}/settlements with stage TENTATIVE"
        actor: MacAuditor
        preconditions:
          - "no Settlement with stage == TENTATIVE and status == ISSUED exists for this report"
          - "allocation_status == CURRENT"
        side_effects:
          - "creates Settlement(stage TENTATIVE) computed by settlement_amount variant tentative"
          - "increments CostReport.version by 1"
      - from: TENTATIVE_SETTLED
        to: FINAL_SETTLED
        trigger: "POST /cost-reports/{id}/settlements with stage FINAL"
        actor: MacAuditor
        preconditions:
          - "a Settlement with stage == TENTATIVE and status == ISSUED exists"
          - "allocation_status == CURRENT"
          - "the latest COMPLETED StepdownRun has method == DOUBLE_APPORTIONMENT"
          - "no AuditAdjustment of the tentative Settlement is in status PROPOSED or ACCEPTED_BY_PROVIDER or PROTESTED"
        side_effects:
          - "creates Settlement(stage FINAL) computed by settlement_amount variant final"
          - "stamps allowable_cost_per_discharge_cents = round_half_up(total_allowable_cost_cents / medicare_discharges); 0 when medicare_discharges == 0"
          - "increments CostReport.version by 1"
      - from: FINAL_SETTLED
        to: REOPENED
        trigger: "POST /appeal-cases/{id}/decide with outcome GRANT on an AppealCase of kind REOPENING"
        actor: MacAuditor
        preconditions:
          - "the AppealCase.settlement_id names a Settlement of this report with stage == FINAL and status IN {ISSUED, APPEALED}"
          - "logical clock date <= that Settlement.issued_at date + 3 years"
        side_effects:
          - "sets AppealCase.status = GRANTED (link 1)"
          - "that AppealCase status change sets the referenced FINAL Settlement.status = RESETTLED (link 2)"
          - "the Settlement becoming RESETTLED sets CostReport.status = REOPENED and allocation_status = STALE (link 3)"
          - "CostReport.allocation_status becoming STALE sets every COMPLETED StepdownRun of this report to STALE with stale_reason COST_CENTER_INPUT_CHANGED (link 4)"
          - "increments CostReport.version by 1"
      - from: REOPENED
        to: AMENDED_FILED
        trigger: "POST /cost-reports/{id}/file"
        actor: ReimbursementManager
        preconditions:
          - "unmapped_tb_total_cents == 0"
          - "allocation_status == CURRENT"
          - "wage_data_status == VERIFIED"
          - "exactly one UccDataSet exists for this report"
        note: "the filing_deadline check does NOT apply to an amended filing after a granted reopening"
        side_effects:
          - "increments amendment_count by 1"
          - "recomputes gme_fte_rolling_average"
          - "increments CostReport.version by 1"
      - from: AMENDED_FILED
        to: FINAL_SETTLED
        trigger: "POST /cost-reports/{id}/settlements with stage FINAL"
        actor: MacAuditor
        preconditions:
          - "allocation_status == CURRENT"
          - "the latest COMPLETED StepdownRun has method == DOUBLE_APPORTIONMENT"
        side_effects:
          - "creates Settlement(stage FINAL) computed by settlement_amount variant final; the RESETTLED prior FINAL settlement's amount is included in prior_tentative_paid_cents only for stage TENTATIVE rows, so it is not double counted"
          - "re-stamps allowable_cost_per_discharge_cents"
          - "increments CostReport.version by 1"
        note: "this edge closes the reopening cycle FINAL_SETTLED -> REOPENED -> AMENDED_FILED -> FINAL_SETTLED"
      - from: FINAL_SETTLED
        to: CLOSED
        trigger: "POST /appeal-cases/{id}/decide with outcome DECIDE_FOR_CONTRACTOR on an AppealCase of kind PRRB_APPEAL"
        actor: ReviewBoardClerk
        preconditions:
          - "AppealCase.kind == PRRB_APPEAL and AppealCase.status == HEARD"
        side_effects:
          - "sets AppealCase.status = DECIDED_FOR_CONTRACTOR and decided_at"
          - "sets the referenced FINAL Settlement.status = ISSUED (appeal resolved without change)"
          - "increments CostReport.version by 1"

  - entity: WageIndexSubmission
    initial_state: DRAFT
    terminal_states: [REJECTED]
    note: "cyclic — ACCEPTED can re-enter review (desk review), and CHANGE_REQUESTED returns to SUBMITTED with revision_number incremented"
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /wage-index-submissions/{id}/submit"
        actor: ReimbursementManager
        preconditions:
          - "reported_hours_total <= total_paid_hours"
          - "at least one OccMixResponse exists for this submission"
        side_effects:
          - "recomputes average_hourly_wage (allowed_wage_related_costs_cents, unadjusted_ahw_cents, occ_mix_adjusted_ahw_cents, occ_mix_category_count, effective_ahw_cents)"
          - "sets CostReport.wage_data_status = COLLECTED"
          - "increments CostReport.version by 1"
      - from: CHANGE_REQUESTED
        to: SUBMITTED
        trigger: "POST /wage-index-submissions/{id}/submit"
        actor: ReimbursementManager
        preconditions:
          - "reported_hours_total <= total_paid_hours"
        side_effects:
          - "increments revision_number by 1"
          - "recomputes average_hourly_wage"
          - "sets CostReport.wage_data_status = COLLECTED"
          - "increments CostReport.version by 1"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /wage-index-submissions/{id}/start-review"
        actor: MacAuditor
        preconditions: ["status == SUBMITTED or status == ACCEPTED"]
        side_effects:
          - "sets CostReport.wage_data_status = UNDER_REVIEW"
          - "increments CostReport.version by 1"
      - from: ACCEPTED
        to: UNDER_REVIEW
        trigger: "POST /wage-index-submissions/{id}/start-review"
        actor: MacAuditor
        preconditions: ["CostReport.status != CLOSED"]
        side_effects:
          - "sets CostReport.wage_data_status = UNDER_REVIEW (this does NOT touch CostReport.status, which may already be FILED)"
          - "increments CostReport.version by 1"
        note: "desk review of an already accepted submission; the cycle entry point"
      - from: UNDER_REVIEW
        to: ACCEPTED
        trigger: "POST /wage-index-submissions/{id}/review-decision with decision ACCEPT"
        actor: MacAuditor
        preconditions:
          - "occ_mix_category_count >= 3"
          - "reported_hours_total <= total_paid_hours"
        side_effects:
          - "sets review_note"
          - "sets CostReport.wage_data_status = VERIFIED"
          - "increments CostReport.version by 1"
      - from: UNDER_REVIEW
        to: CHANGE_REQUESTED
        trigger: "POST /wage-index-submissions/{id}/review-decision with decision REQUEST_CHANGE"
        actor: MacAuditor
        preconditions: []
        side_effects:
          - "sets review_note"
          - "sets CostReport.wage_data_status = REVISION_REQUESTED (CostReport.status is untouched)"
          - "increments CostReport.version by 1"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /wage-index-submissions/{id}/review-decision with decision REJECT"
        actor: MacAuditor
        preconditions: ["CostReport.status == DRAFT"]
        side_effects:
          - "sets CostReport.wage_data_status = REJECTED"
          - "increments CostReport.version by 1"

  - entity: StepdownRun
    initial_state: QUEUED
    terminal_states: [FAILED, STALE]
    transitions:
      - from: QUEUED
        to: COMPLETED
        trigger: "system, synchronously inside POST /cost-reports/{id}/stepdown-runs"
        actor: system
        preconditions:
          - "the report has >= 1 GENERAL_SERVICE CostCenter and >= 1 CostCenter with center_type IN {ROUTINE, ANCILLARY}"
          - "CostReport.unmapped_tb_total_cents == 0"
        side_effects:
          - "writes allocation_lines, total_allocated_cents and residual_unallocated_cents per stepdown_allocation"
          - "sets each CostCenter.allocated_in_cents / allocated_out_cents / allocated_total_cost_cents (link 1)"
          - "those CostCenter changes recompute CostReport.total_allowable_cost_cents and cost_to_charge_ratio and set allocation_status = CURRENT (link 2)"
          - "the CostReport.cost_to_charge_ratio change recomputes the report's UccDataSet cost_to_charge_ratio, uncompensated_care_cost_cents and ucc_payment_cents and clears its recompute_required (link 3)"
          - "the UccDataSet recompute sets recompute_required = true on every Settlement of this report with status == ISSUED whose basis_allowable_cost_cents != the new total_allowable_cost_cents (link 4)"
          - "sets any previously COMPLETED StepdownRun of this report to STALE with stale_reason SUPERSEDED_BY_NEWER_RUN"
          - "increments CostReport.version by 1"
      - from: QUEUED
        to: FAILED
        trigger: "system, synchronously inside POST /cost-reports/{id}/stepdown-runs"
        actor: system
        preconditions: ["two or more GENERAL_SERVICE CostCenters of the report share the same stepdown_order"]
        side_effects:
          - "sets failure_reason = 'DUPLICATE_STEPDOWN_ORDER'"
          - "leaves CostReport.allocation_status unchanged"
          - "increments CostReport.version by 1"
        note: "returned with HTTP 201 and status FAILED; the run row is the audit record of the attempt"
      - from: COMPLETED
        to: STALE
        trigger: "system, on any of: a newer StepdownRun COMPLETED, PATCH /cost-centers/{id}, POST /workpaper-entries/{id}/reverse, POST /cost-reports/{id}/workpaper-entries, POST /audit-adjustments/{id}/resolve with outcome INCORPORATE"
        actor: system
        preconditions: ["status == COMPLETED"]
        side_effects:
          - "sets stale_reason to SUPERSEDED_BY_NEWER_RUN, COST_CENTER_INPUT_CHANGED or WORKPAPER_ENTRY_CHANGED per the trigger"
          - "sets CostReport.allocation_status = STALE unless a newer COMPLETED run exists"

  - entity: AuditAdjustment
    initial_state: PROPOSED
    terminal_states: [INCORPORATED, WITHDRAWN]
    note: "branching fork-join — PROPOSED forks to ACCEPTED_BY_PROVIDER or PROTESTED with different side-effect sets, and both branches rejoin at resolve"
    transitions:
      - from: PROPOSED
        to: ACCEPTED_BY_PROVIDER
        trigger: "POST /audit-adjustments/{id}/respond with response ACCEPT"
        actor: ReimbursementManager
        preconditions:
          - "the parent Settlement.status IN {ISSUED, APPEALED}"
          - "the parent Settlement's CostReport.status == TENTATIVE_SETTLED"
        side_effects:
          - "sets provider_response_note"
          - "increments Settlement.version by 1"
      - from: PROPOSED
        to: PROTESTED
        trigger: "POST /audit-adjustments/{id}/respond with response PROTEST"
        actor: ReimbursementManager
        preconditions:
          - "the parent Settlement.status IN {ISSUED, APPEALED}"
        side_effects:
          - "sets provider_response_note"
          - "sets the parent Settlement.status = APPEALED (branch-specific side effect absent from the ACCEPT branch)"
          - "increments Settlement.version by 1"
      - from: ACCEPTED_BY_PROVIDER
        to: INCORPORATED
        trigger: "POST /audit-adjustments/{id}/resolve with outcome INCORPORATE"
        actor: MacAuditor
        preconditions:
          - "X-User-ID != proposed_by_user_id"
        side_effects:
          - "sets resolved_by_user_id = X-User-ID"
          - "creates WorkpaperEntry(entry_type ADJUSTMENT, source AUDIT, source_audit_adjustment_id = this id, legs [{ target_cost_center_id, proposed_amount_cents }]) even though CostReport.status is not DRAFT/REOPENED (link 1)"
          - "that WorkpaperEntry creation updates CostCenter.adjustment_amount_cents and post_adjustment_cost_cents on target_cost_center_id (link 2)"
          - "the CostCenter change sets every COMPLETED StepdownRun of the report to STALE with stale_reason WORKPAPER_ENTRY_CHANGED (link 3)"
          - "the StepdownRun becoming STALE sets CostReport.allocation_status = STALE (link 4)"
          - "CostReport.allocation_status becoming STALE sets recompute_required = true on every Settlement of the report with status IN {ISSUED, APPEALED} (link 5)"
          - "increments CostReport.version by 1"
      - from: PROTESTED
        to: INCORPORATED
        trigger: "POST /audit-adjustments/{id}/resolve with outcome INCORPORATE"
        actor: MacAuditor
        preconditions:
          - "X-User-ID != proposed_by_user_id"
        side_effects:
          - "identical cascade to the ACCEPTED_BY_PROVIDER branch (links 1-5)"
          - "additionally sets the parent Settlement.status back to ISSUED (the protest is overruled)"
      - from: PROTESTED
        to: WITHDRAWN
        trigger: "POST /audit-adjustments/{id}/resolve with outcome WITHDRAW"
        actor: MacAuditor
        preconditions:
          - "X-User-ID != proposed_by_user_id"
        side_effects:
          - "sets resolved_by_user_id = X-User-ID"
          - "creates NO WorkpaperEntry and leaves every CostCenter, StepdownRun and CostReport field untouched"
          - "sets the parent Settlement.status back to ISSUED"
      - from: ACCEPTED_BY_PROVIDER
        to: WITHDRAWN
        trigger: "POST /audit-adjustments/{id}/resolve with outcome WITHDRAW"
        actor: MacAuditor
        preconditions:
          - "X-User-ID != proposed_by_user_id"
        side_effects:
          - "sets resolved_by_user_id = X-User-ID; no cost impact"

  - entity: AppealCase
    initial_state: REQUESTED
    terminal_states: [DENIED, DECIDED_FOR_PROVIDER, DECIDED_FOR_CONTRACTOR]
    note: "branching by kind — REOPENING resolves GRANT/DENY through the contractor; PRRB_APPEAL runs HEARD then a board decision"
    transitions:
      - from: REQUESTED
        to: GRANTED
        trigger: "POST /appeal-cases/{id}/decide with outcome GRANT"
        actor: MacAuditor
        preconditions:
          - "kind == REOPENING"
          - "the referenced Settlement has stage == FINAL and status IN {ISSUED, APPEALED}"
          - "logical clock date <= Settlement.issued_at date + 3 years"
        side_effects:
          - "sets decided_at and decision_note"
          - "drives the CostReport FINAL_SETTLED -> REOPENED cascade (see CostReport transitions)"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /appeal-cases/{id}/decide with outcome DENY"
        actor: MacAuditor
        preconditions: ["kind == REOPENING"]
        side_effects:
          - "sets decided_at and decision_note; CostReport.status and the Settlement are untouched"
      - from: REQUESTED
        to: HEARD
        trigger: "POST /appeal-cases/{id}/decide with outcome HEAR"
        actor: ReviewBoardClerk
        preconditions:
          - "kind == PRRB_APPEAL"
          - "the referenced Settlement.status == APPEALED"
        side_effects:
          - "sets decided_at = null and decision_note to the hearing record"
      - from: HEARD
        to: DECIDED_FOR_PROVIDER
        trigger: "POST /appeal-cases/{id}/decide with outcome DECIDE_FOR_PROVIDER"
        actor: ReviewBoardClerk
        preconditions: ["kind == PRRB_APPEAL"]
        side_effects:
          - "sets decided_at and decision_note"
          - "sets the referenced Settlement.status = RESETTLED and CostReport.status = REOPENED with allocation_status = STALE"
      - from: HEARD
        to: DECIDED_FOR_CONTRACTOR
        trigger: "POST /appeal-cases/{id}/decide with outcome DECIDE_FOR_CONTRACTOR"
        actor: ReviewBoardClerk
        preconditions: ["kind == PRRB_APPEAL"]
        side_effects:
          - "sets decided_at and decision_note"
          - "sets the referenced Settlement.status = ISSUED and CostReport.status = CLOSED"

  - entity: InterimRateRequest
    initial_state: PENDING
    terminal_states: [APPROVED, DENIED, SUPERSEDED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /interim-rate-requests/{id}/decide with decision APPROVE"
        actor: MacAuditor
        preconditions:
          - "status == PENDING"
          - "the basis CostReport.status == FINAL_SETTLED"
        side_effects:
          - "sets decision_note"
          - "sets Provider.current_interim_rate_cents = approved_rate_cents and increments Provider.approved_interim_period_count by 1"
          - "increments Provider.version by 1"
      - from: PENDING
        to: DENIED
        trigger: "POST /interim-rate-requests/{id}/decide with decision DENY"
        actor: MacAuditor
        preconditions: ["status == PENDING"]
        side_effects:
          - "sets decision_note; Provider fields untouched"
      - from: PENDING
        to: SUPERSEDED
        trigger: "system, on POST /interim-rate-requests creating a newer request for the same provider_id"
        actor: system
        preconditions: ["status == PENDING"]
        side_effects:
          - "sets decision_note = 'SUPERSEDED_BY_NEWER_REQUEST'; Provider.current_interim_rate_cents untouched"

  - entity: RotationAssignment
    initial_state: ACTIVE
    terminal_states: [VOID]
    transitions:
      - from: ACTIVE
        to: VOID
        trigger: "POST /rotation-assignments/{id}/void"
        actor: ReimbursementAnalyst
        preconditions:
          - "status == ACTIVE"
          - "the cost center's CostReport.status IN {DRAFT, REOPENED}"
        side_effects:
          - "sets fte_days = 0.0000"
          - "decrements Resident.assigned_fte_days by the pre-void fte_days"
          - "decrements CostReport.unweighted_fte_days_total by the pre-void fte_days and recomputes gme_fte_rolling_average outputs"

# =====================================================================
# 1.2.1 Concurrency Rules
# =====================================================================
concurrency_rules:
  - rule_id: stepdown-run-create-stale-report
    parent_entity: CostReport
    write_endpoint: "POST /cost-reports/{id}/stepdown-runs"
    occ_field: "expected_cost_report_version"
    description: |
      Creating a StepdownRun against a CostReport whose version has advanced
      since the client last read it is rejected. A new run legitimately
      supersedes the prior COMPLETED run (setting it STALE), so a second
      request carrying an older observed version would otherwise silently
      discard an allocation the client never saw.
    error_id: ERR_STALE_COST_REPORT_VERSION
    http_status: 412
  - rule_id: interim-rate-request-create-stale-provider
    parent_entity: Provider
    write_endpoint: "POST /interim-rate-requests"
    occ_field: "expected_provider_version"
    description: |
      Creating an InterimRateRequest against a Provider whose version has
      advanced since the client last read it is rejected. A new request
      legitimately supersedes the provider's PENDING request and is priced
      off Provider.current_interim_rate_cents, so a stale view of the
      provider would price the projection against a rate that no longer holds.
    error_id: ERR_STALE_PROVIDER_VERSION
    http_status: 412

# =====================================================================
# 1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: trial_balance_mapping_rollup
    trigger: "on POST /cost-reports/{id}/trial-balance-lines, POST /trial-balance-lines/{id}/map, POST /cost-reports/{id}/workpaper-entries, POST /workpaper-entries/{id}/reverse"
    algorithm: aggregation
    formula: |
      for each CostCenter cc of the report:
        cc.direct_cost_cents =
          SUM(tb.amount_cents) over TrialBalanceLine tb
          WHERE tb.cost_report_id == report.id
            AND tb.mapped_cost_center_id == cc.id
            AND tb.status == MAPPED
        cc.reclassified_amount_cents =
          SUM(leg.amount_cents) over WorkpaperEntry we, leg in we.legs
          WHERE we.cost_report_id == report.id AND we.entry_type == RECLASSIFICATION
            AND we.status == ACTIVE AND leg.cost_center_id == cc.id
        cc.adjustment_amount_cents =
          SUM(leg.amount_cents) over WorkpaperEntry we, leg in we.legs
          WHERE we.cost_report_id == report.id AND we.entry_type == ADJUSTMENT
            AND we.status == ACTIVE AND leg.cost_center_id == cc.id
        cc.post_reclass_direct_cost_cents = cc.direct_cost_cents + cc.reclassified_amount_cents
        cc.post_adjustment_cost_cents     = cc.post_reclass_direct_cost_cents + cc.adjustment_amount_cents
      report.total_direct_cost_cents  = SUM(cc.direct_cost_cents) over all CostCenters of the report
      report.unmapped_tb_total_cents  = SUM(tb.amount_cents) WHERE tb.status == UNMAPPED
    input_set: "all TrialBalanceLines of the report (MAPPED lines feed centers, UNMAPPED lines feed unmapped_tb_total_cents); only WorkpaperEntry rows with status == ACTIVE are applied, REVERSED rows contribute nothing"
    constants: {}
    precision: "integer cents; no rounding needed"
    variants: []
    invariant: |
      CONSERVED QUANTITY 'mapped_direct_cost' (dollars):
        SUM(cc.post_reclass_direct_cost_cents) over the report's CostCenters
        == SUM(tb.amount_cents) over the report's MAPPED TrialBalanceLines
      holds after every reclassification create and after every reversal,
      because RECLASSIFICATION legs are required to net to zero.

  - name: stepdown_allocation
    trigger: "on POST /cost-reports/{id}/stepdown-runs (StepdownRun QUEUED -> COMPLETED)"
    algorithm: waterfall_allocation
    formula: |
      GS  = CostCenters with center_type == GENERAL_SERVICE, ordered by stepdown_order ASC
      NON = CostCenters with center_type IN {ANCILLARY, ROUTINE, NONREIMBURSABLE}
      weight(receiver, allocator) = receiver.statistics[allocator.allocation_basis], default 0

      DISTRIBUTE(pool_cents, allocator, receivers):        # pinned rounding order
        eligible = [r in receivers where weight(r, allocator) > 0]
        if eligible is empty: return ({}, pool_cents)      # residual, no division
        W = SUM(weight(r, allocator)) over eligible
        for r in eligible:
          exact_r = pool_cents * weight(r, allocator) / W  # exact rational
          share_r = floor(exact_r)                        # ROUND PER RECEIVER FIRST
        remainder = pool_cents - SUM(share_r)              # 0 <= remainder < count(eligible)
        order eligible by (exact_r - share_r) DESC, then created_at ASC
        give +1 cent to each of the first `remainder` receivers in that order
        return ({r: share_r}, 0)
      # This order is normative: allocate-then-round-per-receiver-then-spread-
      # remainder. Summing exact shares and rounding the total (or rounding the
      # ratio to 6 dp before multiplying) is WRONG and produces different cents.

      VARIANT single_apportionment:
        acc[c] = c.post_adjustment_cost_cents for every center
        for g in GS (stepdown_order ASC):
          receivers = NON + [gs in GS where gs.stepdown_order > g.stepdown_order]
          (shares, residual) = DISTRIBUTE(acc[g], g, receivers)
          acc[r] += shares[r]; acc[g] = residual
          record allocation_lines with pass = 1

      VARIANT double_apportionment:
        PASS 1 - for g in GS (stepdown_order ASC):
          receivers = every center except g (INCLUDING already-closed GS centers)
          (shares, residual) = DISTRIBUTE(g.post_adjustment_cost_cents, g, receivers)
          recv[c] += shares[c] for every c; record allocation_lines with pass = 1
        acc[c] = c.post_adjustment_cost_cents + recv[c] for c in NON
        PASS 2 - for g in GS (stepdown_order ASC):
          (shares, residual) = DISTRIBUTE(recv[g], g, NON)
          acc[r] += shares[r]; acc[g] = residual
          record allocation_lines with pass = 2

      for every center c:
        c.allocated_in_cents  = SUM(line.amount_cents where line.to_cost_center_id   == c.id)
        c.allocated_out_cents = SUM(line.amount_cents where line.from_cost_center_id == c.id)
        c.allocated_total_cost_cents = c.post_adjustment_cost_cents + c.allocated_in_cents - c.allocated_out_cents
      run.total_allocated_cents        = SUM(line.amount_cents)
      run.residual_unallocated_cents  = SUM(residual) over all allocator steps
      report.total_allowable_cost_cents = SUM(c.allocated_total_cost_cents) for c.center_type IN {ROUTINE, ANCILLARY}
      report.cost_to_charge_ratio = round_half_up(report.total_allowable_cost_cents / report.total_charges_cents, 6)
                                    (0.000000 when total_charges_cents == 0)
    input_set: "every CostCenter of the report at its current post_adjustment_cost_cents; NONREIMBURSABLE centers receive allocations but are excluded from total_allowable_cost_cents"
    constants: {}
    precision: "integer cents; floor per receiver then 1-cent remainder spread by (fractional part DESC, created_at ASC)"
    variants:
      - name: single_apportionment
        when: "run.method == SINGLE_APPORTIONMENT"
        difference: "one pass; a GENERAL_SERVICE center distributes its ACCUMULATED cost (direct + everything received from earlier GS centers) and closed GS centers receive nothing"
      - name: double_apportionment
        when: "run.method == DOUBLE_APPORTIONMENT"
        difference: "pass 1 distributes each GS center's OWN post_adjustment cost to all other centers including already-closed GS centers, then pass 2 redistributes what each GS center received in pass 1 to non-GS centers only; identical inputs therefore yield different per-center and different report.total_allowable_cost_cents"

  - name: average_hourly_wage
    trigger: "on POST /wage-index-submissions/{id}/submit (DRAFT -> SUBMITTED and CHANGE_REQUESTED -> SUBMITTED), on POST /wage-index-submissions/{id}/occ-mix-responses, and on PATCH /wage-index-submissions/{id}"
    algorithm: weighted_scoring
    formula: |
      allowed_wrc = min(wage_related_costs_cents, floor(0.25 * total_salaries_cents))
      # conditional branch: undocumented contract labor is dropped from BOTH sides
      if contract_labor_hours == 0:
        cl_cents = 0; cl_hours = 0
      else:
        cl_cents = contract_labor_cents; cl_hours = contract_labor_hours
      numerator_cents = total_salaries_cents + allowed_wrc + cl_cents - excluded_area_salaries_cents
      denominator_hours = total_paid_hours + cl_hours - excluded_area_hours
      unadjusted_ahw_cents = round_half_up(numerator_cents / denominator_hours)   # whole cents

      VARIANT occ_mix_adjusted:
        active = OccMixResponse rows of this submission with reported_hours > 0
        occ_mix_category_count = count(active)
        if occ_mix_category_count < 3: occ_mix_adjusted_ahw_cents = null
        else:
          for a in active: a.category_ahw_cents = round_half_up(a.reported_salaries_cents / a.reported_hours)
          T = SUM(NATIONAL_TARGET_PCT[a.category]) over active         # renormalization base
          for a in active: w[a] = round_half_up(NATIONAL_TARGET_PCT[a.category] / T, 6)
          drift = 1.000000 - SUM(w)                                    # pinned remainder rule
          add drift to the active category with the largest
            NATIONAL_TARGET_PCT, tie-break category name ASC
          occ_mix_adjusted_ahw_cents = round_half_up(SUM(w[a] * a.category_ahw_cents))
      effective_ahw_cents = occ_mix_adjusted_ahw_cents if occ_mix_category_count >= 3
                            else unadjusted_ahw_cents
    input_set: "the submission's own salary/hour fields plus every OccMixResponse row belonging to it; categories with reported_hours == 0 are excluded and their national target percentage is redistributed pro rata across the remaining categories"
    constants:
      NATIONAL_TARGET_PCT_RN: 0.5600
      NATIONAL_TARGET_PCT_LPN: 0.1000
      NATIONAL_TARGET_PCT_NURSE_AIDE: 0.2000
      NATIONAL_TARGET_PCT_MEDICAL_ASSISTANT: 0.0400
      NATIONAL_TARGET_PCT_NURSE_PRACTITIONER: 0.1000
      WAGE_RELATED_COST_CAP_PCT: 0.25
    precision: "weights 6 decimal places round_half_up; hourly wages whole cents round_half_up"
    variants:
      - name: unadjusted
        when: "occ_mix_category_count < 3, or when a caller reads unadjusted_ahw_cents directly"
        difference: "one pooled ratio over all hours; occupational mix is ignored"
      - name: occ_mix_adjusted
        when: "occ_mix_category_count >= 3"
        difference: "per-category hourly wages weighted by renormalized national target percentages; identical submission data yields a different cents-per-hour result than the unadjusted variant"

  - name: gme_fte_rolling_average
    trigger: "on POST /residents/{id}/rotation-assignments, POST /rotation-assignments/{id}/void, POST /cost-reports/{id}/file, and on GET /cost-reports/{id}/gme-summary"
    algorithm: aggregation
    formula: |
      period = [report.fiscal_year_begin, report.fiscal_year_end + 1 day)   # half-open
      period_days = day_count(period)
      for each ACTIVE RotationAssignment ra whose cost_center_id belongs to this report:
        ra.overlap_days = day_count([ra.start_date, ra.end_date) INTERSECT period)
        ra.fte_days     = round_half_up(ra.fte_fraction * ra.overlap_days, 4)
      report.unweighted_fte_days_total = SUM(ra.fte_days)
      for each Resident r of the report's Provider:
        r.assigned_fte_days = SUM(ra.fte_days) over r's ACTIVE assignments
        resident_fte[r] = min(round_half_up(r.assigned_fte_days / period_days, 4), 1.0000)
      report.unweighted_fte_total   = round_half_up(SUM(resident_fte[r]), 2)
      report.capped_unweighted_fte  = min(report.unweighted_fte_total, Provider.fte_cap)
      report.weighted_fte_total     = round_half_up(
          SUM(resident_fte[r] * (1.00 if r.irp_status == WITHIN_IRP else 0.50)), 2)
      priors = CostReports of the same Provider with status == FINAL_SETTLED and
               fiscal_year_end < this report.fiscal_year_end,
               ordered by fiscal_year_end DESC, take the first 2
      report.rolling_average_fte = round_half_up(
          (report.capped_unweighted_fte + SUM(p.capped_unweighted_fte for p in priors))
          / (1 + count(priors)), 2)
    input_set: "ACTIVE RotationAssignments only (VOID rows contribute 0.0000); prior-year term uses ONLY the provider's FINAL_SETTLED reports with an earlier fiscal_year_end, at most two, so a provider with no settled history divides by 1"
    constants:
      WITHIN_IRP_WEIGHT: 1.00
      BEYOND_IRP_WEIGHT: 0.50
      RESIDENT_DAILY_FTE_CAP: 1.0000
    precision: "fte_days and resident_fte 4 decimal places round_half_up; report totals 2 decimal places round_half_up"
    variants: []
    invariant: |
      CONSERVED QUANTITY 'resident_fte_days' (time-weighted FTE-days, not dollars):
        report.unweighted_fte_days_total
          == SUM(r.assigned_fte_days) over the Provider's Residents
          == SUM(ra.fte_days) over ACTIVE RotationAssignments of the report
      A create followed by its compensating void MUST return all three figures
      to their pre-create values exactly (no 0.0001 drift).

  - name: dsh_and_ucc_compilation
    trigger: "on POST /cost-reports/{id}/ucc-data-sets, POST /ucc-data-sets/{id}/recompute, and as link 3 of the stepdown COMPLETED cascade"
    algorithm: threshold
    formula: |
      medicaid_fraction = round_half_up(medicaid_non_medicare_days / total_inpatient_days, 4)
      ssi_fraction      = round_half_up(ssi_days / medicare_part_a_days, 4)
      dsh_patient_percentage = round_half_up(medicaid_fraction + ssi_fraction, 4)
      # ROUND EACH FRACTION FIRST, THEN SUM. Summing the raw quotients and
      # rounding once produces a different 4-dp value at the boundary.
      dsh_eligible = (dsh_patient_percentage >= DSH_ELIGIBILITY_THRESHOLD)
      cost_to_charge_ratio = report.cost_to_charge_ratio            # snapshot
      uncompensated_care_cost_cents =
          round_half_up(charity_care_charges_cents * cost_to_charge_ratio)
        + round_half_up(non_medicare_bad_debt_cents * BAD_DEBT_ALLOWABLE_FACTOR)
      ucc_payment_cents = 0 if not dsh_eligible else
          floor(UCC_POOL_CENTS * uncompensated_care_cost_cents / NATIONAL_UCC_COST_CENTS)
      recompute_required = false
    input_set: "the single UccDataSet of the report plus the report's current cost_to_charge_ratio (which is 0.000000 until a StepdownRun COMPLETED)"
    constants:
      DSH_ELIGIBILITY_THRESHOLD: 0.1500
      BAD_DEBT_ALLOWABLE_FACTOR: 0.65
      UCC_POOL_CENTS: 800000000000
      NATIONAL_UCC_COST_CENTS: 4000000000000
    precision: "fractions 4 decimal places round_half_up; ratio 6 decimal places; cents integer, payment floored"
    variants: []

  - name: settlement_amount
    trigger: "on POST /cost-reports/{id}/settlements"
    algorithm: chronological
    formula: |
      basis_run = the report's StepdownRun with status == COMPLETED
                  (exactly one exists while allocation_status == CURRENT)
      basis_method                 = basis_run.method
      basis_allowable_cost_cents   = report.total_allowable_cost_cents
      reimbursable_cost_cents      = round_half_up(
          basis_allowable_cost_cents * report.medicare_utilization_ratio)

      VARIANT tentative:
        ucc_payment_cents            = 0
        prior_tentative_paid_cents   = 0
        amount_due_provider_cents    = round_half_up(TENTATIVE_PAYMENT_PCT *
            (reimbursable_cost_cents - report.interim_payments_received_cents))

      VARIANT final:
        ucc_payment_cents = report's UccDataSet.ucc_payment_cents (0 when dsh_eligible == false)
        prior_tentative_paid_cents = SUM(amount_due_provider_cents) over this
            report's Settlements with stage == TENTATIVE and status != SUPERSEDED
        amount_due_provider_cents =
            (reimbursable_cost_cents - report.interim_payments_received_cents)
          + ucc_payment_cents
          - prior_tentative_paid_cents
    input_set: "the one COMPLETED StepdownRun (its method decides the allocation numbers), the report's medicare_utilization_ratio and interim_payments_received_cents, and for the final variant the report's UccDataSet and its prior non-SUPERSEDED TENTATIVE settlements"
    constants:
      TENTATIVE_PAYMENT_PCT: 0.75
    precision: "integer cents, round_half_up on each multiplication"
    variants:
      - name: tentative
        when: "request stage == TENTATIVE"
        difference: "pays TENTATIVE_PAYMENT_PCT of the net, ignores uncompensated care entirely, and accepts a SINGLE_APPORTIONMENT basis run"
      - name: final
        when: "request stage == FINAL"
        difference: "pays 100% of the net, adds the uncompensated care payment, subtracts what the tentative stage already paid, and REQUIRES a DOUBLE_APPORTIONMENT basis run — so the same report settles to different dollars than a naive 'tentative x 4/3'"

  - name: interim_rate_projection
    trigger: "on POST /interim-rate-requests"
    algorithm: constraint_propagation
    formula: |
      # EVALUATION ORDER IS NORMATIVE — the cap and the eligibility gate each
      # depend on the other's input, so the sequence below is what makes the
      # result well defined:
      # step 1: uncapped projection
      projected_cost_per_discharge_cents =
          round_half_up(basis_report.allowable_cost_per_discharge_cents * (1 + trend_factor))
      # step 2: variance measured against the UNCAPPED projection
      variance_ratio = round_half_up(
          abs(projected_cost_per_discharge_cents - provider.current_interim_rate_cents)
          / provider.current_interim_rate_cents, 4)
      # step 3: eligibility gate on the pre-cap variance
      if variance_ratio < INTERIM_VARIANCE_THRESHOLD: reject ERR_INTERIM_VARIANCE_BELOW_THRESHOLD
      # step 4: cap AFTER the gate
      rate_cap_cents = floor(provider.current_interim_rate_cents * INTERIM_RATE_CAP_MULTIPLIER)
      approved_rate_cents = min(projected_cost_per_discharge_cents, rate_cap_cents)
      # step 5: dollar impact
      adjustment_amount_cents =
          (approved_rate_cents - provider.current_interim_rate_cents) * projected_discharges
      # Computing variance_ratio from approved_rate_cents instead (i.e. after the
      # cap) collapses every capped request to exactly INTERIM_RATE_CAP_MULTIPLIER
      # - 1 and changes both the stored variance_ratio and which requests pass.
    input_set: "the basis CostReport (must be status == FINAL_SETTLED, so allowable_cost_per_discharge_cents is stamped) and the Provider's current_interim_rate_cents at request time"
    constants:
      INTERIM_VARIANCE_THRESHOLD: 0.1000
      INTERIM_RATE_CAP_MULTIPLIER: 1.10
    precision: "cents integer, round_half_up on the projection, floor on the cap; variance 4 decimal places round_half_up"
    variants: []

  - name: filing_deadline_computation
    trigger: "on POST /cost-reports (at creation) and re-evaluated on POST /cost-reports/{id}/file"
    algorithm: threshold
    formula: |
      filing_deadline = fiscal_year_end + 5 calendar months,
                        clamped to the last day of the target month
                        (2026-06-30 -> 2026-11-30; 2026-09-30 -> 2027-02-28)
      on file: reject when current_clock_date > filing_deadline, EXCEPT when
               report.status == REOPENED (amended filing after a granted reopening)
    input_set: "the report's fiscal_year_end and the logical clock date"
    constants:
      FILING_MONTHS_AFTER_FYE: 5
      REOPENING_WINDOW_YEARS: 3
      PRRB_APPEAL_WINDOW_DAYS: 180
    precision: "whole days; comparisons are on calendar dates in UTC"
    variants: []

# =====================================================================
# 1.4 Validation Rules Table (evaluated strictly in ascending priority;
#     the FIRST violated rule decides the response and nothing is written)
# =====================================================================
validations:
  - priority: 1
    rule: "the request carries a recognized role header (X-User-Role)"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    category: authentication
    applies_to: "every endpoint"
  - priority: 2
    rule: "the caller's role appears in the endpoint's `roles` list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    category: authorization
    applies_to: "every endpoint"
  - priority: 3
    rule: "the payload parses, every required input field is present, and every field satisfies its declared type / enum / range / decimal-place constraint"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    category: schema
    applies_to: "every endpoint with a body or query parameters"
  - priority: 4
    rule: "every {id} path segment resolves to an existing row of the expected entity"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    category: existence
    applies_to: "every path-parameterized endpoint"
  - priority: 5
    rule: "every FK supplied in the body resolves to an existing row of the referenced entity"
    error_id: ERR_REFERENCED_ENTITY_NOT_FOUND
    http_status: 404
    category: referential
    applies_to: "POST /cost-reports, POST /trial-balance-lines/{id}/map, POST /cost-reports/{id}/workpaper-entries, POST /residents/{id}/rotation-assignments, POST /settlements/{id}/audit-adjustments, POST /cost-reports/{id}/appeal-cases, POST /interim-rate-requests"
  - priority: 6
    rule: "when a provider-scoped role (ReimbursementAnalyst, ReimbursementManager) supplies X-User-ID, that value equals the id of the Provider that owns the target resource"
    error_id: ERR_PROVIDER_SCOPE_VIOLATION
    http_status: 403
    category: authorization
    applies_to: "every provider-scoped endpoint (X-User-ID is optional for these roles; when absent this rule does not fire)"
  - priority: 7
    rule: "the X-User-ID resolving an AuditAdjustment differs from its proposed_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    category: authorization
    applies_to: "POST /audit-adjustments/{id}/resolve"
  - priority: 8
    rule: "expected_cost_report_version equals CostReport.version"
    error_id: ERR_STALE_COST_REPORT_VERSION
    http_status: 412
    category: concurrency
    applies_to: "POST /cost-reports/{id}/stepdown-runs"
  - priority: 8
    rule: "expected_provider_version equals Provider.version"
    error_id: ERR_STALE_PROVIDER_VERSION
    http_status: 412
    category: concurrency
    applies_to: "POST /interim-rate-requests"
  - priority: 9
    rule: "the target entity is in a state from which the requested transition exists"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    category: state
    applies_to: "every action endpoint (file, submit, start-review, review-decision, settlements, respond, resolve, decide, void, reverse, map)"
  - priority: 9
    rule: "the parent CostReport is editable (status IN {DRAFT, REOPENED}) before its accounting children are created, mapped, patched, reversed or voided"
    error_id: ERR_COST_REPORT_NOT_EDITABLE
    http_status: 409
    category: state
    applies_to: "POST /cost-reports/{id}/cost-centers, POST /cost-reports/{id}/trial-balance-lines, POST /trial-balance-lines/{id}/map, POST /cost-reports/{id}/workpaper-entries, POST /workpaper-entries/{id}/reverse, PATCH /cost-centers/{id}, POST /residents/{id}/rotation-assignments, POST /rotation-assignments/{id}/void, POST /cost-reports/{id}/wage-index-submissions, PATCH /wage-index-submissions/{id}, POST /cost-reports/{id}/ucc-data-sets"
  - priority: 10
    rule: "the logical clock date is on or before CostReport.filing_deadline (skipped when status == REOPENED)"
    error_id: ERR_FILING_DEADLINE_PASSED
    http_status: 422
    category: business_compliance
    applies_to: "POST /cost-reports/{id}/file"
  - priority: 10
    rule: "a PRRB_APPEAL is requested within PRRB_APPEAL_WINDOW_DAYS (180) days of the FINAL Settlement.issued_at"
    error_id: ERR_APPEAL_WINDOW_EXPIRED
    http_status: 422
    category: business_compliance
    applies_to: "POST /cost-reports/{id}/appeal-cases"
  - priority: 10
    rule: "a REOPENING is granted within REOPENING_WINDOW_YEARS (3) years of the FINAL Settlement.issued_at"
    error_id: ERR_REOPENING_WINDOW_EXPIRED
    http_status: 422
    category: business_compliance
    applies_to: "POST /appeal-cases/{id}/decide"
  - priority: 11
    rule: "every WorkpaperEntry leg names a CostCenter whose cost_report_id equals the entry's cost_report_id"
    error_id: ERR_COST_CENTER_FOREIGN_TO_REPORT
    http_status: 422
    category: business_referential
    applies_to: "POST /cost-reports/{id}/workpaper-entries"
  - priority: 11
    rule: "the TrialBalanceLine and the target CostCenter belong to the same CostReport"
    error_id: ERR_COST_CENTER_FOREIGN_TO_REPORT
    http_status: 422
    category: business_referential
    applies_to: "POST /trial-balance-lines/{id}/map"
  - priority: 11
    rule: "the RotationAssignment's cost_center_id belongs to a CostReport of the resident's Provider"
    error_id: ERR_COST_CENTER_FOREIGN_TO_PROVIDER
    http_status: 422
    category: business_referential
    applies_to: "POST /residents/{id}/rotation-assignments"
  - priority: 11
    rule: "the AppealCase.settlement_id names a Settlement whose cost_report_id equals the path cost report"
    error_id: ERR_SETTLEMENT_FOREIGN_TO_REPORT
    http_status: 422
    category: business_referential
    applies_to: "POST /cost-reports/{id}/appeal-cases"
  - priority: 11
    rule: "the AuditAdjustment.target_cost_center_id belongs to the settlement's CostReport"
    error_id: ERR_COST_CENTER_FOREIGN_TO_REPORT
    http_status: 422
    category: business_referential
    applies_to: "POST /settlements/{id}/audit-adjustments"
  - priority: 11
    rule: "the InterimRateRequest.basis_cost_report_id belongs to provider_id"
    error_id: ERR_BASIS_REPORT_FOREIGN_TO_PROVIDER
    http_status: 422
    category: business_referential
    applies_to: "POST /interim-rate-requests"
  - priority: 12
    rule: "the resident's aggregate ACTIVE fte_fraction on every day of the half-open interval [start_date, end_date) is <= RESIDENT_DAILY_FTE_CAP (1.0000); adjacency (end_date == other.start_date) is NOT an overlap"
    error_id: ERR_RESIDENT_DAILY_FTE_EXCEEDED
    http_status: 409
    category: business_temporal
    applies_to: "POST /residents/{id}/rotation-assignments"
  - priority: 12
    rule: "the requested closed interval [effective_from, effective_to] does not come within INTERIM_PERIOD_BUFFER_DAYS (30) days of any non-DENIED, non-SUPERSEDED InterimRateRequest interval of the same Provider; boundaries are inclusive on both ends"
    error_id: ERR_INTERIM_PERIOD_OVERLAP
    http_status: 409
    category: business_temporal
    applies_to: "POST /interim-rate-requests"
  - priority: 12
    rule: "the rotation interval intersects the basis CostReport's fiscal year (overlap_days > 0)"
    error_id: ERR_ROTATION_OUTSIDE_FISCAL_YEAR
    http_status: 409
    category: business_temporal
    applies_to: "POST /residents/{id}/rotation-assignments"
  - priority: 13
    rule: "CostReport.unmapped_tb_total_cents == 0"
    error_id: ERR_UNMAPPED_TRIAL_BALANCE
    http_status: 422
    category: business_constraint
    applies_to: "POST /cost-reports/{id}/file, POST /cost-reports/{id}/stepdown-runs"
  - priority: 13
    rule: "CostReport.allocation_status == CURRENT"
    error_id: ERR_ALLOCATION_NOT_CURRENT
    http_status: 422
    category: business_constraint
    applies_to: "POST /cost-reports/{id}/file, POST /cost-reports/{id}/settlements"
  - priority: 13
    rule: "the report's WageIndexSubmission is ACCEPTED (equivalently wage_data_status == VERIFIED)"
    error_id: ERR_WAGE_SUBMISSION_NOT_ACCEPTED
    http_status: 422
    category: business_constraint
    applies_to: "POST /cost-reports/{id}/file"
  - priority: 13
    rule: "exactly one UccDataSet exists for the report"
    error_id: ERR_UCC_DATA_MISSING
    http_status: 422
    category: business_constraint
    applies_to: "POST /cost-reports/{id}/file"
  - priority: 13
    rule: "a RECLASSIFICATION WorkpaperEntry has >= 2 legs whose amount_cents sum to exactly 0 (an ADJUSTMENT entry has exactly 1 leg and is exempt from the net-zero test)"
    error_id: ERR_RECLASS_NOT_BALANCED
    http_status: 422
    category: business_constraint
    applies_to: "POST /cost-reports/{id}/workpaper-entries"
  - priority: 13
    rule: "when is_non_allowable == true every leg amount_cents is < 0"
    error_id: ERR_NON_ALLOWABLE_MUST_BE_NEGATIVE
    http_status: 422
    category: business_constraint
    applies_to: "POST /cost-reports/{id}/workpaper-entries"
  - priority: 13
    rule: "a GENERAL_SERVICE CostCenter supplies allocation_basis != NONE and a stepdown_order unique within the report; a non-GENERAL_SERVICE CostCenter supplies neither"
    error_id: ERR_STEPDOWN_ORDER_CONFLICT
    http_status: 422
    category: business_constraint
    applies_to: "POST /cost-reports/{id}/cost-centers"
    note: |
      Uniqueness of stepdown_order is enforced ON CREATION ONLY. PATCH
      /cost-centers/{id} may renumber a GENERAL_SERVICE center into an order
      another center already holds, because renumbering a stepdown sequence
      necessarily passes through a transient collision (swapping orders 1 and 2
      cannot be done atomically through a single-resource PATCH). A stepdown run
      attempted while a collision stands does NOT 422 - it is recorded as a
      FAILED StepdownRun with failure_reason DUPLICATE_STEPDOWN_ORDER (HTTP 201),
      which is the only way that transition is reachable. PATCH still rejects
      allocation_basis == NONE on a GENERAL_SERVICE center and any
      allocation_basis / stepdown_order on a non-GENERAL_SERVICE center via
      ERR_INVALID_REQUEST at priority 3.
  - priority: 13
    rule: "CostCenter.code is unique within the report and CostCenter.statistics keys are a subset of the declared basis enum"
    error_id: ERR_COST_CENTER_CODE_DUPLICATE
    http_status: 422
    category: business_constraint
    applies_to: "POST /cost-reports/{id}/cost-centers"
  - priority: 13
    rule: "the report has at least one GENERAL_SERVICE center and at least one ROUTINE or ANCILLARY center"
    error_id: ERR_STEPDOWN_STRUCTURE_INCOMPLETE
    http_status: 422
    category: business_constraint
    applies_to: "POST /cost-reports/{id}/stepdown-runs"
  - priority: 13
    rule: "WageIndexSubmission.reported_hours_total <= total_paid_hours (equality is allowed)"
    error_id: ERR_OCC_MIX_HOURS_EXCEED_TOTAL
    http_status: 422
    category: business_constraint
    applies_to: "POST /wage-index-submissions/{id}/submit, POST /wage-index-submissions/{id}/occ-mix-responses, POST /wage-index-submissions/{id}/review-decision"
  - priority: 13
    rule: "occ_mix_category_count >= OCC_MIX_MIN_CATEGORIES (3) before a submission can be ACCEPTED"
    error_id: ERR_OCC_MIX_INCOMPLETE
    http_status: 422
    category: business_constraint
    applies_to: "POST /wage-index-submissions/{id}/review-decision"
  - priority: 13
    rule: "OccMixResponse.category is unique per submission"
    error_id: ERR_OCC_MIX_CATEGORY_DUPLICATE
    http_status: 422
    category: business_constraint
    applies_to: "POST /wage-index-submissions/{id}/occ-mix-responses"
  - priority: 13
    rule: "at most one WageIndexSubmission with status != REJECTED exists per CostReport, and at most one UccDataSet exists per CostReport"
    error_id: ERR_DUPLICATE_CHILD_RECORD
    http_status: 422
    category: business_constraint
    applies_to: "POST /cost-reports/{id}/wage-index-submissions, POST /cost-reports/{id}/ucc-data-sets"
  - priority: 13
    rule: "a FINAL settlement is computed from a COMPLETED StepdownRun whose method == DOUBLE_APPORTIONMENT"
    error_id: ERR_FINAL_REQUIRES_DOUBLE_APPORTIONMENT
    http_status: 422
    category: business_constraint
    applies_to: "POST /cost-reports/{id}/settlements"
  - priority: 13
    rule: "no AuditAdjustment of the report's tentative Settlement is still in status PROPOSED, ACCEPTED_BY_PROVIDER or PROTESTED when a FINAL settlement is issued"
    error_id: ERR_AUDIT_ADJUSTMENT_UNRESOLVED
    http_status: 422
    category: business_constraint
    applies_to: "POST /cost-reports/{id}/settlements"
  - priority: 13
    rule: "the AppealCase's Settlement has stage == FINAL"
    error_id: ERR_SETTLEMENT_STAGE_INVALID
    http_status: 422
    category: business_constraint
    applies_to: "POST /cost-reports/{id}/appeal-cases"
  - priority: 13
    rule: "a PRRB_APPEAL has amount_at_issue_cents >= PRRB_MINIMUM_AMOUNT_CENTS (1000000)"
    error_id: ERR_PRRB_AMOUNT_BELOW_MINIMUM
    http_status: 422
    category: business_constraint
    applies_to: "POST /cost-reports/{id}/appeal-cases"
  - priority: 13
    rule: "the basis CostReport.status == FINAL_SETTLED"
    error_id: ERR_BASIS_REPORT_NOT_FINAL_SETTLED
    http_status: 422
    category: business_constraint
    applies_to: "POST /interim-rate-requests"
  - priority: 13
    rule: "Provider.current_interim_rate_cents > 0 so a variance can be measured"
    error_id: ERR_NO_CURRENT_INTERIM_RATE
    http_status: 422
    category: business_constraint
    applies_to: "POST /interim-rate-requests"
  - priority: 14
    rule: "variance_ratio (computed on the UNCAPPED projection) >= INTERIM_VARIANCE_THRESHOLD (0.1000)"
    error_id: ERR_INTERIM_VARIANCE_BELOW_THRESHOLD
    http_status: 422
    category: business_fiscal
    applies_to: "POST /interim-rate-requests"
  - priority: 14
    rule: "fiscal_year_begin < fiscal_year_end and the period spans 1..366 days; Provider.ccn is unique"
    error_id: ERR_FISCAL_PERIOD_INVALID
    http_status: 422
    category: business_fiscal
    applies_to: "POST /cost-reports, POST /providers"

# =====================================================================
# 1.5 Endpoint Table
# =====================================================================
endpoints:
  # ---------- test-driving logical clock ----------
  - method: POST
    path: "/_clock/set_current_utc"
    purpose: "Set the deterministic logical clock used by every filing-deadline, appeal-window and settlement-timestamp comparison. Reachability: the filing deadline, the 180-day PRRB window and the 3-year reopening window are otherwise unreachable from a fresh database."
    input: [current_utc]
    output: "{ current_utc: datetime }"
    roles: [SystemAdmin]
    default_clock: "2026-08-01T00:00:00Z"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]
  - method: GET
    path: "/_clock"
    purpose: "Read the current logical clock instant."
    input: []
    output: "{ current_utc: datetime }"
    roles: [SystemAdmin, ReimbursementAnalyst, ReimbursementManager, MacAuditor, ReviewBoardClerk]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE]

  # ---------- Provider ----------
  - method: POST
    path: "/providers"
    purpose: "Register a hospital provider."
    input: [ccn, name, cbsa_code, "teaching_status?", "fte_cap?", "current_interim_rate_cents?"]
    output: "Provider"
    roles: [SystemAdmin]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_FISCAL_PERIOD_INVALID]
  - method: GET
    path: "/providers/{id}"
    purpose: "Read one provider, including current_interim_rate_cents and version for optimistic concurrency."
    input: []
    output: "Provider"
    roles: [SystemAdmin, ReimbursementAnalyst, ReimbursementManager, MacAuditor]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_PROVIDER_NOT_FOUND, ERR_PROVIDER_SCOPE_VIOLATION]
  - method: GET
    path: "/providers"
    purpose: "List providers."
    input: ["ccn?", "cbsa_code?", "teaching_status?", "limit?", "offset?"]
    output: "Provider[]"
    roles: [SystemAdmin, ReimbursementAnalyst, ReimbursementManager, MacAuditor]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]

  # ---------- CostReport ----------
  - method: POST
    path: "/cost-reports"
    purpose: "Open a cost report for a fiscal period; stamps filing_deadline."
    input: [provider_id, fiscal_year_begin, fiscal_year_end, "apportionment_method?", "medicare_utilization_ratio?", "interim_payments_received_cents?", "total_charges_cents?", "medicare_discharges?"]
    output: "CostReport"
    roles: [SystemAdmin, ReimbursementManager]
    side_effects:
      - "computes filing_deadline via filing_deadline_computation"
      - "initializes status DRAFT, wage_data_status NOT_STARTED, allocation_status NOT_RUN"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_REFERENCED_ENTITY_NOT_FOUND, ERR_PROVIDER_SCOPE_VIOLATION, ERR_FISCAL_PERIOD_INVALID]
  - method: GET
    path: "/cost-reports/{id}"
    purpose: "Read one cost report including both state dimensions, the derived cost totals and `version` for optimistic concurrency."
    input: []
    output: "CostReport"
    roles: [SystemAdmin, ReimbursementAnalyst, ReimbursementManager, MacAuditor]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_COST_REPORT_NOT_FOUND, ERR_PROVIDER_SCOPE_VIOLATION]
  - method: GET
    path: "/cost-reports"
    purpose: "List cost reports; the provider_id filter is the reverse traversal of CostReport.provider_id."
    input: ["provider_id?", "status?", "wage_data_status?", "allocation_status?", "limit?", "offset?"]
    output: "CostReport[]"
    roles: [SystemAdmin, ReimbursementAnalyst, ReimbursementManager, MacAuditor]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]
  - method: POST
    path: "/cost-reports/{id}/file"
    purpose: "File (or amend) the cost report. DRAFT -> FILED, REOPENED -> AMENDED_FILED."
    input: []
    output: "CostReport"
    roles: [ReimbursementManager]
    side_effects:
      - "stamps filed_at from the logical clock on the first filing; increments amendment_count afterwards"
      - "recomputes gme_fte_rolling_average"
      - "increments CostReport.version"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_COST_REPORT_NOT_FOUND, ERR_PROVIDER_SCOPE_VIOLATION, ERR_INVALID_STATE_TRANSITION, ERR_FILING_DEADLINE_PASSED, ERR_UNMAPPED_TRIAL_BALANCE, ERR_ALLOCATION_NOT_CURRENT, ERR_WAGE_SUBMISSION_NOT_ACCEPTED, ERR_UCC_DATA_MISSING]
  - method: GET
    path: "/cost-reports/{id}/gme-summary"
    purpose: "Computed read of the GME FTE counts (unweighted, capped, weighted, rolling average) for the report."
    input: []
    output: "{ cost_report_id: string, period_days: integer, unweighted_fte_days_total: number, unweighted_fte_total: number, capped_unweighted_fte: number, weighted_fte_total: number, rolling_average_fte: number, prior_period_count: integer }"
    roles: [SystemAdmin, ReimbursementAnalyst, ReimbursementManager, MacAuditor]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_COST_REPORT_NOT_FOUND]

  # ---------- CostCenter ----------
  - method: POST
    path: "/cost-reports/{id}/cost-centers"
    purpose: "Create a worksheet A cost center with its statistical allocation base units."
    input: [code, name, center_type, "allocation_basis?", "stepdown_order?", "statistics?"]
    output: "CostCenter"
    roles: [ReimbursementAnalyst]
    side_effects: ["sets CostReport.allocation_status = STALE when a COMPLETED StepdownRun exists"]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_COST_REPORT_NOT_FOUND, ERR_PROVIDER_SCOPE_VIOLATION, ERR_COST_REPORT_NOT_EDITABLE, ERR_STEPDOWN_ORDER_CONFLICT, ERR_COST_CENTER_CODE_DUPLICATE]
  - method: GET
    path: "/cost-centers/{id}"
    purpose: "Read one cost center with its full cost waterfall (direct, reclassified, adjusted, allocated in/out, total)."
    input: []
    output: "CostCenter"
    roles: [SystemAdmin, ReimbursementAnalyst, ReimbursementManager, MacAuditor]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_COST_CENTER_NOT_FOUND]
  - method: GET
    path: "/cost-reports/{id}/cost-centers"
    purpose: "List the report's cost centers; reverse traversal of CostCenter.cost_report_id."
    input: ["center_type?", "limit?", "offset?"]
    output: "CostCenter[]"
    roles: [SystemAdmin, ReimbursementAnalyst, ReimbursementManager, MacAuditor]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_COST_REPORT_NOT_FOUND, ERR_INVALID_REQUEST]
  - method: PATCH
    path: "/cost-centers/{id}"
    purpose: "Revise a cost center's statistics, basis, order or name. Reachability: statistical bases must be changeable to make an allocation go STALE without touching the ledger, and stepdown_order must be renumberable into a transient duplicate so that the FAILED StepdownRun transition is reachable (see the ERR_STEPDOWN_ORDER_CONFLICT note in §1.4 - this PATCH does NOT enforce stepdown_order uniqueness)."
    input: ["name?", "allocation_basis?", "stepdown_order?", "statistics?"]
    output: "CostCenter"
    roles: [ReimbursementAnalyst]
    side_effects:
      - "sets every COMPLETED StepdownRun of the report to STALE with stale_reason COST_CENTER_INPUT_CHANGED"
      - "sets CostReport.allocation_status = STALE and increments CostReport.version"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_COST_CENTER_NOT_FOUND, ERR_PROVIDER_SCOPE_VIOLATION, ERR_COST_REPORT_NOT_EDITABLE]

  # ---------- TrialBalanceLine ----------
  - method: POST
    path: "/cost-reports/{id}/trial-balance-lines"
    purpose: "Load a general ledger trial balance line, optionally already mapped."
    input: [gl_account, description, amount_cents, "mapped_cost_center_id?"]
    output: "TrialBalanceLine"
    roles: [ReimbursementAnalyst]
    side_effects:
      - "sets status = MAPPED when mapped_cost_center_id is supplied, otherwise UNMAPPED"
      - "recomputes trial_balance_mapping_rollup; increments CostReport.version"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_COST_REPORT_NOT_FOUND, ERR_REFERENCED_ENTITY_NOT_FOUND, ERR_PROVIDER_SCOPE_VIOLATION, ERR_COST_REPORT_NOT_EDITABLE, ERR_COST_CENTER_FOREIGN_TO_REPORT]
  - method: GET
    path: "/trial-balance-lines/{id}"
    purpose: "Read one trial balance line."
    input: []
    output: "TrialBalanceLine"
    roles: [SystemAdmin, ReimbursementAnalyst, ReimbursementManager, MacAuditor]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_TRIAL_BALANCE_LINE_NOT_FOUND]
  - method: GET
    path: "/cost-reports/{id}/trial-balance-lines"
    purpose: "List the report's trial balance lines; reverse traversal of TrialBalanceLine.cost_report_id."
    input: ["status?", "limit?", "offset?"]
    output: "TrialBalanceLine[]"
    roles: [SystemAdmin, ReimbursementAnalyst, ReimbursementManager, MacAuditor]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_COST_REPORT_NOT_FOUND, ERR_INVALID_REQUEST]
  - method: GET
    path: "/cost-centers/{id}/trial-balance-lines"
    purpose: "List the lines mapped to one cost center; reverse traversal of TrialBalanceLine.mapped_cost_center_id."
    input: ["limit?", "offset?"]
    output: "TrialBalanceLine[]"
    roles: [SystemAdmin, ReimbursementAnalyst, ReimbursementManager, MacAuditor]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_COST_CENTER_NOT_FOUND, ERR_INVALID_REQUEST]
  - method: POST
    path: "/trial-balance-lines/{id}/map"
    purpose: "Map an UNMAPPED ledger line to a cost center. UNMAPPED -> MAPPED."
    input: [cost_center_id]
    output: "TrialBalanceLine"
    roles: [ReimbursementAnalyst]
    side_effects:
      - "recomputes trial_balance_mapping_rollup (CostCenter.direct_cost_cents, CostReport.total_direct_cost_cents, CostReport.unmapped_tb_total_cents)"
      - "sets CostReport.allocation_status = STALE when a COMPLETED StepdownRun exists; increments CostReport.version"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_TRIAL_BALANCE_LINE_NOT_FOUND, ERR_REFERENCED_ENTITY_NOT_FOUND, ERR_COST_REPORT_NOT_EDITABLE, ERR_INVALID_STATE_TRANSITION, ERR_COST_CENTER_FOREIGN_TO_REPORT]

  # ---------- WorkpaperEntry ----------
  - method: POST
    path: "/cost-reports/{id}/workpaper-entries"
    purpose: "Record an A-6 reclassification (net-zero, >= 2 legs) or an A-8 adjustment (1 leg)."
    input: [entry_type, code, description, legs, "is_non_allowable?"]
    output: "WorkpaperEntry"
    roles: [ReimbursementAnalyst]
    side_effects:
      - "recomputes CostCenter.reclassified_amount_cents / adjustment_amount_cents / post_reclass_direct_cost_cents / post_adjustment_cost_cents for every leg target"
      - "sets every COMPLETED StepdownRun of the report to STALE with stale_reason WORKPAPER_ENTRY_CHANGED and CostReport.allocation_status = STALE"
      - "increments CostReport.version"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_COST_REPORT_NOT_FOUND, ERR_REFERENCED_ENTITY_NOT_FOUND, ERR_PROVIDER_SCOPE_VIOLATION, ERR_COST_REPORT_NOT_EDITABLE, ERR_COST_CENTER_FOREIGN_TO_REPORT, ERR_RECLASS_NOT_BALANCED, ERR_NON_ALLOWABLE_MUST_BE_NEGATIVE]
  - method: GET
    path: "/workpaper-entries/{id}"
    purpose: "Read one workpaper entry with its legs."
    input: []
    output: "WorkpaperEntry"
    roles: [SystemAdmin, ReimbursementAnalyst, ReimbursementManager, MacAuditor]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_WORKPAPER_ENTRY_NOT_FOUND]
  - method: GET
    path: "/cost-reports/{id}/workpaper-entries"
    purpose: "List the report's workpaper entries; reverse traversal of WorkpaperEntry.cost_report_id."
    input: ["entry_type?", "status?", "source?", "limit?", "offset?"]
    output: "WorkpaperEntry[]"
    roles: [SystemAdmin, ReimbursementAnalyst, ReimbursementManager, MacAuditor]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_COST_REPORT_NOT_FOUND, ERR_INVALID_REQUEST]
  - method: GET
    path: "/audit-adjustments/{id}/workpaper-entries"
    purpose: "List the workpaper entries synthesized by resolving one audit adjustment; reverse traversal of WorkpaperEntry.source_audit_adjustment_id."
    input: ["limit?", "offset?"]
    output: "WorkpaperEntry[]"
    roles: [SystemAdmin, ReimbursementAnalyst, ReimbursementManager, MacAuditor]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_AUDIT_ADJUSTMENT_NOT_FOUND, ERR_INVALID_REQUEST]
  - method: POST
    path: "/workpaper-entries/{id}/reverse"
    purpose: "Reverse a workpaper entry. ACTIVE -> REVERSED; the compensating operation for the mapped_direct_cost invariant."
    input: []
    output: "WorkpaperEntry"
    roles: [ReimbursementAnalyst]
    side_effects:
      - "stamps reversed_at from the logical clock and excludes the entry from every cost center rollup"
      - "recomputes trial_balance_mapping_rollup; sets StepdownRuns STALE and CostReport.allocation_status = STALE"
      - "increments CostReport.version"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_WORKPAPER_ENTRY_NOT_FOUND, ERR_PROVIDER_SCOPE_VIOLATION, ERR_COST_REPORT_NOT_EDITABLE, ERR_INVALID_STATE_TRANSITION]

  # ---------- StepdownRun ----------
  - method: POST
    path: "/cost-reports/{id}/stepdown-runs"
    purpose: "Run the overhead stepdown under the chosen apportionment method and publish the allocation to every cost center. Carries the CostReport OCC token."
    input: [expected_cost_report_version, "method?"]
    output: "StepdownRun"
    roles: [ReimbursementAnalyst, MacAuditor]
    side_effects:
      - "executes stepdown_allocation and writes allocation_lines, total_allocated_cents, residual_unallocated_cents"
      - "cascade link 1: CostCenter.allocated_in_cents / allocated_out_cents / allocated_total_cost_cents"
      - "cascade link 2: CostReport.total_allowable_cost_cents, cost_to_charge_ratio, allocation_status = CURRENT"
      - "cascade link 3: the report's UccDataSet cost_to_charge_ratio / uncompensated_care_cost_cents / ucc_payment_cents recomputed, recompute_required cleared"
      - "cascade link 4: Settlement.recompute_required = true on ISSUED settlements whose basis_allowable_cost_cents no longer matches"
      - "supersedes the prior COMPLETED run (status STALE, stale_reason SUPERSEDED_BY_NEWER_RUN)"
      - "increments CostReport.version"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_COST_REPORT_NOT_FOUND, ERR_PROVIDER_SCOPE_VIOLATION, ERR_STALE_COST_REPORT_VERSION, ERR_UNMAPPED_TRIAL_BALANCE, ERR_STEPDOWN_STRUCTURE_INCOMPLETE]
  - method: GET
    path: "/stepdown-runs/{id}"
    purpose: "Read one stepdown run with its ordered allocation_lines."
    input: []
    output: "StepdownRun"
    roles: [SystemAdmin, ReimbursementAnalyst, ReimbursementManager, MacAuditor]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_STEPDOWN_RUN_NOT_FOUND]
  - method: GET
    path: "/cost-reports/{id}/stepdown-runs"
    purpose: "List the report's stepdown runs; reverse traversal of StepdownRun.cost_report_id."
    input: ["status?", "method?", "limit?", "offset?"]
    output: "StepdownRun[]"
    roles: [SystemAdmin, ReimbursementAnalyst, ReimbursementManager, MacAuditor]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_COST_REPORT_NOT_FOUND, ERR_INVALID_REQUEST]

  # ---------- WageIndexSubmission / OccMixResponse ----------
  - method: POST
    path: "/cost-reports/{id}/wage-index-submissions"
    purpose: "Open the S-3 wage index data collection for the report."
    input: [total_salaries_cents, total_paid_hours, "wage_related_costs_cents?", "contract_labor_cents?", "contract_labor_hours?", "excluded_area_salaries_cents?", "excluded_area_hours?"]
    output: "WageIndexSubmission"
    roles: [ReimbursementAnalyst]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_COST_REPORT_NOT_FOUND, ERR_PROVIDER_SCOPE_VIOLATION, ERR_COST_REPORT_NOT_EDITABLE, ERR_DUPLICATE_CHILD_RECORD]
  - method: GET
    path: "/wage-index-submissions/{id}"
    purpose: "Read one wage index submission with both average-hourly-wage variants."
    input: []
    output: "WageIndexSubmission"
    roles: [SystemAdmin, ReimbursementAnalyst, ReimbursementManager, MacAuditor]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_WAGE_INDEX_SUBMISSION_NOT_FOUND]
  - method: GET
    path: "/cost-reports/{id}/wage-index-submissions"
    purpose: "List the report's wage index submissions; reverse traversal of WageIndexSubmission.cost_report_id."
    input: ["status?", "limit?", "offset?"]
    output: "WageIndexSubmission[]"
    roles: [SystemAdmin, ReimbursementAnalyst, ReimbursementManager, MacAuditor]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_COST_REPORT_NOT_FOUND, ERR_INVALID_REQUEST]
  - method: PATCH
    path: "/wage-index-submissions/{id}"
    purpose: "Correct hours/salary figures during collection or after a change request. Reachability: the hours-verification boundary (reported occupational-mix hours exactly equal to total paid hours) is only reachable by editing the totals after the responses exist."
    input: ["total_salaries_cents?", "total_paid_hours?", "wage_related_costs_cents?", "contract_labor_cents?", "contract_labor_hours?", "excluded_area_salaries_cents?", "excluded_area_hours?"]
    output: "WageIndexSubmission"
    roles: [ReimbursementAnalyst]
    side_effects: ["recomputes average_hourly_wage for both variants"]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_WAGE_INDEX_SUBMISSION_NOT_FOUND, ERR_PROVIDER_SCOPE_VIOLATION, ERR_COST_REPORT_NOT_EDITABLE, ERR_INVALID_STATE_TRANSITION]
  - method: POST
    path: "/wage-index-submissions/{id}/submit"
    purpose: "Attest and submit the wage data. DRAFT -> SUBMITTED, CHANGE_REQUESTED -> SUBMITTED (revision_number + 1)."
    input: []
    output: "WageIndexSubmission"
    roles: [ReimbursementManager]
    side_effects:
      - "recomputes average_hourly_wage"
      - "sets CostReport.wage_data_status = COLLECTED and increments CostReport.version"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_WAGE_INDEX_SUBMISSION_NOT_FOUND, ERR_PROVIDER_SCOPE_VIOLATION, ERR_INVALID_STATE_TRANSITION, ERR_OCC_MIX_HOURS_EXCEED_TOTAL]
  - method: POST
    path: "/wage-index-submissions/{id}/start-review"
    purpose: "Open contractor desk review. SUBMITTED -> UNDER_REVIEW and ACCEPTED -> UNDER_REVIEW (the cycle entry point)."
    input: []
    output: "WageIndexSubmission"
    roles: [MacAuditor]
    side_effects: ["sets CostReport.wage_data_status = UNDER_REVIEW and increments CostReport.version"]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_WAGE_INDEX_SUBMISSION_NOT_FOUND, ERR_INVALID_STATE_TRANSITION]
  - method: POST
    path: "/wage-index-submissions/{id}/review-decision"
    purpose: "Record the contractor's desk review outcome. UNDER_REVIEW -> ACCEPTED | CHANGE_REQUESTED | REJECTED."
    input: [decision, review_note]
    output: "WageIndexSubmission"
    roles: [MacAuditor]
    side_effects:
      - "sets review_note"
      - "sets CostReport.wage_data_status to VERIFIED | REVISION_REQUESTED | REJECTED without touching CostReport.status"
      - "increments CostReport.version"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_WAGE_INDEX_SUBMISSION_NOT_FOUND, ERR_INVALID_STATE_TRANSITION, ERR_OCC_MIX_INCOMPLETE, ERR_OCC_MIX_HOURS_EXCEED_TOTAL]
  - method: POST
    path: "/wage-index-submissions/{id}/occ-mix-responses"
    purpose: "Record one occupational mix survey category."
    input: [category, reported_hours, reported_salaries_cents]
    output: "OccMixResponse"
    roles: [ReimbursementAnalyst]
    side_effects: ["recomputes category_ahw_cents, the submission's occ_mix_category_count, reported_hours_total and both AHW variants"]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_WAGE_INDEX_SUBMISSION_NOT_FOUND, ERR_PROVIDER_SCOPE_VIOLATION, ERR_INVALID_STATE_TRANSITION, ERR_OCC_MIX_CATEGORY_DUPLICATE, ERR_OCC_MIX_HOURS_EXCEED_TOTAL]
  - method: GET
    path: "/wage-index-submissions/{id}/occ-mix-responses"
    purpose: "List the submission's occupational mix responses; reverse traversal of OccMixResponse.wage_index_submission_id."
    input: ["category?", "limit?", "offset?"]
    output: "OccMixResponse[]"
    roles: [SystemAdmin, ReimbursementAnalyst, ReimbursementManager, MacAuditor]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_WAGE_INDEX_SUBMISSION_NOT_FOUND, ERR_INVALID_REQUEST]
  - method: GET
    path: "/occ-mix-responses/{id}"
    purpose: "Read one occupational mix response with its category hourly wage."
    input: []
    output: "OccMixResponse"
    roles: [SystemAdmin, ReimbursementAnalyst, ReimbursementManager, MacAuditor]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_OCC_MIX_RESPONSE_NOT_FOUND]

  # ---------- Resident / RotationAssignment ----------
  - method: POST
    path: "/providers/{id}/residents"
    purpose: "Register a GME resident."
    input: [full_name, program, "irp_status?"]
    output: "Resident"
    roles: [ReimbursementAnalyst]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_PROVIDER_NOT_FOUND, ERR_PROVIDER_SCOPE_VIOLATION]
  - method: GET
    path: "/providers/{id}/residents"
    purpose: "List a provider's residents; reverse traversal of Resident.provider_id."
    input: ["irp_status?", "limit?", "offset?"]
    output: "Resident[]"
    roles: [SystemAdmin, ReimbursementAnalyst, ReimbursementManager, MacAuditor]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_PROVIDER_NOT_FOUND, ERR_INVALID_REQUEST]
  - method: GET
    path: "/residents/{id}"
    purpose: "Read one resident with assigned_fte_days."
    input: []
    output: "Resident"
    roles: [SystemAdmin, ReimbursementAnalyst, ReimbursementManager, MacAuditor]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_RESIDENT_NOT_FOUND]
  - method: POST
    path: "/residents/{id}/rotation-assignments"
    purpose: "Assign a resident to a rotation site for a half-open date interval."
    input: [cost_center_id, start_date, end_date, fte_fraction]
    output: "RotationAssignment"
    roles: [ReimbursementAnalyst]
    side_effects:
      - "computes overlap_days and fte_days"
      - "increments Resident.assigned_fte_days and CostReport.unweighted_fte_days_total; recomputes gme_fte_rolling_average"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_RESIDENT_NOT_FOUND, ERR_REFERENCED_ENTITY_NOT_FOUND, ERR_PROVIDER_SCOPE_VIOLATION, ERR_COST_REPORT_NOT_EDITABLE, ERR_COST_CENTER_FOREIGN_TO_PROVIDER, ERR_RESIDENT_DAILY_FTE_EXCEEDED, ERR_ROTATION_OUTSIDE_FISCAL_YEAR]
  - method: GET
    path: "/rotation-assignments/{id}"
    purpose: "Read one rotation assignment with overlap_days and fte_days."
    input: []
    output: "RotationAssignment"
    roles: [SystemAdmin, ReimbursementAnalyst, ReimbursementManager, MacAuditor]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_ROTATION_ASSIGNMENT_NOT_FOUND]
  - method: GET
    path: "/rotation-assignments"
    purpose: "List rotation assignments; the resident_id and cost_center_id filters are the reverse traversals of RotationAssignment.resident_id and RotationAssignment.cost_center_id."
    input: ["resident_id?", "cost_center_id?", "status?", "limit?", "offset?"]
    output: "RotationAssignment[]"
    roles: [SystemAdmin, ReimbursementAnalyst, ReimbursementManager, MacAuditor]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]
  - method: POST
    path: "/rotation-assignments/{id}/void"
    purpose: "Void a rotation assignment. ACTIVE -> VOID; the compensating operation for the resident_fte_days invariant."
    input: []
    output: "RotationAssignment"
    roles: [ReimbursementAnalyst]
    side_effects:
      - "sets fte_days = 0.0000"
      - "decrements Resident.assigned_fte_days and CostReport.unweighted_fte_days_total by the pre-void fte_days and recomputes gme_fte_rolling_average"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_ROTATION_ASSIGNMENT_NOT_FOUND, ERR_PROVIDER_SCOPE_VIOLATION, ERR_COST_REPORT_NOT_EDITABLE, ERR_INVALID_STATE_TRANSITION]

  # ---------- UccDataSet ----------
  - method: POST
    path: "/cost-reports/{id}/ucc-data-sets"
    purpose: "Compile the DSH and S-10 uncompensated care data set for the report."
    input: [medicaid_non_medicare_days, total_inpatient_days, ssi_days, medicare_part_a_days, charity_care_charges_cents, "non_medicare_bad_debt_cents?"]
    output: "UccDataSet"
    roles: [ReimbursementAnalyst]
    side_effects: ["runs dsh_and_ucc_compilation (medicaid_fraction, ssi_fraction, dsh_patient_percentage, dsh_eligible, uncompensated_care_cost_cents, ucc_payment_cents)"]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_COST_REPORT_NOT_FOUND, ERR_PROVIDER_SCOPE_VIOLATION, ERR_COST_REPORT_NOT_EDITABLE, ERR_DUPLICATE_CHILD_RECORD]
  - method: GET
    path: "/ucc-data-sets/{id}"
    purpose: "Read one uncompensated care data set."
    input: []
    output: "UccDataSet"
    roles: [SystemAdmin, ReimbursementAnalyst, ReimbursementManager, MacAuditor]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_UCC_DATA_SET_NOT_FOUND]
  - method: GET
    path: "/cost-reports/{id}/ucc-data-sets"
    purpose: "List the report's uncompensated care data sets; reverse traversal of UccDataSet.cost_report_id."
    input: ["limit?", "offset?"]
    output: "UccDataSet[]"
    roles: [SystemAdmin, ReimbursementAnalyst, ReimbursementManager, MacAuditor]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_COST_REPORT_NOT_FOUND, ERR_INVALID_REQUEST]
  - method: POST
    path: "/ucc-data-sets/{id}/recompute"
    purpose: "Re-run dsh_and_ucc_compilation against the report's current cost_to_charge_ratio and clear recompute_required. Reachability: lets a test observe the uncompensated care figures under a new cost-to-charge ratio without re-filing."
    input: []
    output: "UccDataSet"
    roles: [ReimbursementAnalyst, MacAuditor]
    side_effects: ["recomputes every derived UccDataSet field and sets recompute_required = false"]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_UCC_DATA_SET_NOT_FOUND, ERR_PROVIDER_SCOPE_VIOLATION]

  # ---------- Settlement ----------
  - method: POST
    path: "/cost-reports/{id}/settlements"
    purpose: "Issue the tentative or final settlement for the report."
    input: [stage]
    output: "Settlement"
    roles: [MacAuditor]
    side_effects:
      - "runs settlement_amount for the requested stage and snapshots basis_method / basis_allowable_cost_cents"
      - "advances CostReport.status (FILED -> TENTATIVE_SETTLED, TENTATIVE_SETTLED|AMENDED_FILED -> FINAL_SETTLED)"
      - "stamps CostReport.allowable_cost_per_discharge_cents on the FINAL stage"
      - "increments CostReport.version"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_COST_REPORT_NOT_FOUND, ERR_INVALID_STATE_TRANSITION, ERR_ALLOCATION_NOT_CURRENT, ERR_FINAL_REQUIRES_DOUBLE_APPORTIONMENT, ERR_AUDIT_ADJUSTMENT_UNRESOLVED]
  - method: GET
    path: "/settlements/{id}"
    purpose: "Read one settlement with its computed amounts and recompute_required flag."
    input: []
    output: "Settlement"
    roles: [SystemAdmin, ReimbursementAnalyst, ReimbursementManager, MacAuditor, ReviewBoardClerk]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_SETTLEMENT_NOT_FOUND]
  - method: GET
    path: "/cost-reports/{id}/settlements"
    purpose: "List the report's settlements; reverse traversal of Settlement.cost_report_id."
    input: ["stage?", "status?", "limit?", "offset?"]
    output: "Settlement[]"
    roles: [SystemAdmin, ReimbursementAnalyst, ReimbursementManager, MacAuditor, ReviewBoardClerk]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_COST_REPORT_NOT_FOUND, ERR_INVALID_REQUEST]

  # ---------- AuditAdjustment ----------
  - method: POST
    path: "/settlements/{id}/audit-adjustments"
    purpose: "Propose an audit adjustment against a settled cost center. Records proposed_by_user_id from X-User-ID for segregation of duties."
    input: [target_cost_center_id, code, rationale, proposed_amount_cents]
    output: "AuditAdjustment"
    roles: [MacAuditor]
    side_effects: ["stamps proposed_by_user_id from X-User-ID; increments Settlement.version"]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_SETTLEMENT_NOT_FOUND, ERR_REFERENCED_ENTITY_NOT_FOUND, ERR_INVALID_STATE_TRANSITION, ERR_COST_CENTER_FOREIGN_TO_REPORT]
  - method: GET
    path: "/audit-adjustments/{id}"
    purpose: "Read one audit adjustment with its proposer and resolver ids."
    input: []
    output: "AuditAdjustment"
    roles: [SystemAdmin, ReimbursementAnalyst, ReimbursementManager, MacAuditor]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_AUDIT_ADJUSTMENT_NOT_FOUND]
  - method: GET
    path: "/audit-adjustments"
    purpose: "List audit adjustments; the settlement_id and target_cost_center_id filters are the reverse traversals of AuditAdjustment.settlement_id and AuditAdjustment.target_cost_center_id."
    input: ["settlement_id?", "target_cost_center_id?", "status?", "limit?", "offset?"]
    output: "AuditAdjustment[]"
    roles: [SystemAdmin, ReimbursementAnalyst, ReimbursementManager, MacAuditor]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]
  - method: POST
    path: "/audit-adjustments/{id}/respond"
    purpose: "Provider response to a proposed adjustment. PROPOSED -> ACCEPTED_BY_PROVIDER | PROTESTED (the PROTEST branch also flips the settlement to APPEALED)."
    input: [response, provider_response_note]
    output: "AuditAdjustment"
    roles: [ReimbursementManager]
    side_effects: ["sets provider_response_note; on PROTEST sets Settlement.status = APPEALED; increments Settlement.version"]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_AUDIT_ADJUSTMENT_NOT_FOUND, ERR_PROVIDER_SCOPE_VIOLATION, ERR_INVALID_STATE_TRANSITION]
  - method: POST
    path: "/audit-adjustments/{id}/resolve"
    purpose: "Contractor resolution. INCORPORATE synthesizes an AUDIT-sourced workpaper entry and drives the 5-link cost cascade; WITHDRAW drops the exception with no cost impact. Requires a different X-User-ID than the proposer."
    input: [outcome, "resolution_note?"]
    output: "AuditAdjustment"
    roles: [MacAuditor]
    side_effects:
      - "stamps resolved_by_user_id from X-User-ID"
      - "INCORPORATE link 1: creates WorkpaperEntry(entry_type ADJUSTMENT, source AUDIT, source_audit_adjustment_id, single leg on target_cost_center_id)"
      - "INCORPORATE link 2: CostCenter.adjustment_amount_cents and post_adjustment_cost_cents updated"
      - "INCORPORATE link 3: COMPLETED StepdownRuns -> STALE (stale_reason WORKPAPER_ENTRY_CHANGED)"
      - "INCORPORATE link 4: CostReport.allocation_status = STALE"
      - "INCORPORATE link 5: Settlement.recompute_required = true on ISSUED / APPEALED settlements"
      - "restores Settlement.status = ISSUED when resolving from PROTESTED; increments CostReport.version"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_AUDIT_ADJUSTMENT_NOT_FOUND, ERR_SEGREGATION_OF_DUTIES, ERR_INVALID_STATE_TRANSITION]

  # ---------- AppealCase ----------
  - method: POST
    path: "/cost-reports/{id}/appeal-cases"
    purpose: "Request a contractor reopening or file a PRRB appeal against a FINAL settlement."
    input: [settlement_id, kind, issue_description, amount_at_issue_cents]
    output: "AppealCase"
    roles: [ReimbursementManager]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_COST_REPORT_NOT_FOUND, ERR_REFERENCED_ENTITY_NOT_FOUND, ERR_PROVIDER_SCOPE_VIOLATION, ERR_APPEAL_WINDOW_EXPIRED, ERR_SETTLEMENT_FOREIGN_TO_REPORT, ERR_SETTLEMENT_STAGE_INVALID, ERR_PRRB_AMOUNT_BELOW_MINIMUM]
  - method: GET
    path: "/appeal-cases/{id}"
    purpose: "Read one appeal case."
    input: []
    output: "AppealCase"
    roles: [SystemAdmin, ReimbursementAnalyst, ReimbursementManager, MacAuditor, ReviewBoardClerk]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_APPEAL_CASE_NOT_FOUND]
  - method: GET
    path: "/appeal-cases"
    purpose: "List appeal cases; the cost_report_id and settlement_id filters are the reverse traversals of AppealCase.cost_report_id and AppealCase.settlement_id."
    input: ["cost_report_id?", "settlement_id?", "kind?", "status?", "limit?", "offset?"]
    output: "AppealCase[]"
    roles: [SystemAdmin, ReimbursementAnalyst, ReimbursementManager, MacAuditor, ReviewBoardClerk]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]
  - method: POST
    path: "/appeal-cases/{id}/decide"
    purpose: "Record a reopening grant/denial (contractor) or a board hearing and decision (review board)."
    input: [outcome, decision_note]
    output: "AppealCase"
    roles: [MacAuditor, ReviewBoardClerk]
    side_effects:
      - "GRANT: Settlement.status = RESETTLED, CostReport.status = REOPENED, allocation_status = STALE, COMPLETED StepdownRuns -> STALE"
      - "DECIDE_FOR_PROVIDER: same reopening cascade as GRANT"
      - "DECIDE_FOR_CONTRACTOR: Settlement.status = ISSUED and CostReport.status = CLOSED"
      - "increments CostReport.version"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_APPEAL_CASE_NOT_FOUND, ERR_INVALID_STATE_TRANSITION, ERR_REOPENING_WINDOW_EXPIRED]

  # ---------- InterimRateRequest ----------
  - method: POST
    path: "/interim-rate-requests"
    purpose: "Request an interim payment rate adjustment from a projection. Carries the Provider OCC token; supersedes the provider's PENDING request."
    input: [provider_id, expected_provider_version, basis_cost_report_id, projected_discharges, trend_factor, effective_from, effective_to]
    output: "InterimRateRequest"
    roles: [ReimbursementManager]
    side_effects:
      - "runs interim_rate_projection (projected_cost_per_discharge_cents, variance_ratio, approved_rate_cents, adjustment_amount_cents)"
      - "sets the provider's prior PENDING request to SUPERSEDED with decision_note SUPERSEDED_BY_NEWER_REQUEST"
      - "increments Provider.version"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_REFERENCED_ENTITY_NOT_FOUND, ERR_PROVIDER_SCOPE_VIOLATION, ERR_STALE_PROVIDER_VERSION, ERR_BASIS_REPORT_FOREIGN_TO_PROVIDER, ERR_INTERIM_PERIOD_OVERLAP, ERR_BASIS_REPORT_NOT_FINAL_SETTLED, ERR_NO_CURRENT_INTERIM_RATE, ERR_INTERIM_VARIANCE_BELOW_THRESHOLD]
  - method: GET
    path: "/interim-rate-requests/{id}"
    purpose: "Read one interim rate request with its projection figures."
    input: []
    output: "InterimRateRequest"
    roles: [SystemAdmin, ReimbursementAnalyst, ReimbursementManager, MacAuditor]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INTERIM_RATE_REQUEST_NOT_FOUND]
  - method: GET
    path: "/interim-rate-requests"
    purpose: "List interim rate requests; the provider_id and basis_cost_report_id filters are the reverse traversals of InterimRateRequest.provider_id and InterimRateRequest.basis_cost_report_id."
    input: ["provider_id?", "basis_cost_report_id?", "status?", "limit?", "offset?"]
    output: "InterimRateRequest[]"
    roles: [SystemAdmin, ReimbursementAnalyst, ReimbursementManager, MacAuditor]
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]
  - method: POST
    path: "/interim-rate-requests/{id}/decide"
    purpose: "Approve or deny the requested rate. APPROVE writes the rate onto the Provider."
    input: [decision, decision_note]
    output: "InterimRateRequest"
    roles: [MacAuditor]
    side_effects:
      - "APPROVE: Provider.current_interim_rate_cents = approved_rate_cents, approved_interim_period_count + 1, Provider.version + 1"
      - "DENY: no Provider change"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_INTERIM_RATE_REQUEST_NOT_FOUND, ERR_INVALID_STATE_TRANSITION, ERR_BASIS_REPORT_NOT_FINAL_SETTLED]

# =====================================================================
# 1.6 Error Catalog
# =====================================================================
errors:
  - error_id: ERR_UNAUTHENTICATED
    http_status: 401
    trigger: "no recognized X-Role header on the request"
  - error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    trigger: "the caller's role is not in the endpoint's roles list"
  - error_id: ERR_INVALID_REQUEST
    http_status: 400
    trigger: "missing required field, unknown enum value, wrong type, out-of-range number, bad date, or pagination limit outside 1..100"
  - error_id: ERR_PROVIDER_NOT_FOUND
    http_status: 404
    trigger: "the {id} path segment does not resolve to a Provider"
  - error_id: ERR_COST_REPORT_NOT_FOUND
    http_status: 404
    trigger: "the {id} path segment does not resolve to a CostReport"
  - error_id: ERR_COST_CENTER_NOT_FOUND
    http_status: 404
    trigger: "the {id} path segment does not resolve to a CostCenter"
  - error_id: ERR_TRIAL_BALANCE_LINE_NOT_FOUND
    http_status: 404
    trigger: "the {id} path segment does not resolve to a TrialBalanceLine"
  - error_id: ERR_WORKPAPER_ENTRY_NOT_FOUND
    http_status: 404
    trigger: "the {id} path segment does not resolve to a WorkpaperEntry"
  - error_id: ERR_STEPDOWN_RUN_NOT_FOUND
    http_status: 404
    trigger: "the {id} path segment does not resolve to a StepdownRun"
  - error_id: ERR_WAGE_INDEX_SUBMISSION_NOT_FOUND
    http_status: 404
    trigger: "the {id} path segment does not resolve to a WageIndexSubmission"
  - error_id: ERR_OCC_MIX_RESPONSE_NOT_FOUND
    http_status: 404
    trigger: "the {id} path segment does not resolve to an OccMixResponse"
  - error_id: ERR_RESIDENT_NOT_FOUND
    http_status: 404
    trigger: "the {id} path segment does not resolve to a Resident"
  - error_id: ERR_ROTATION_ASSIGNMENT_NOT_FOUND
    http_status: 404
    trigger: "the {id} path segment does not resolve to a RotationAssignment"
  - error_id: ERR_UCC_DATA_SET_NOT_FOUND
    http_status: 404
    trigger: "the {id} path segment does not resolve to a UccDataSet"
  - error_id: ERR_SETTLEMENT_NOT_FOUND
    http_status: 404
    trigger: "the {id} path segment does not resolve to a Settlement"
  - error_id: ERR_AUDIT_ADJUSTMENT_NOT_FOUND
    http_status: 404
    trigger: "the {id} path segment does not resolve to an AuditAdjustment"
  - error_id: ERR_APPEAL_CASE_NOT_FOUND
    http_status: 404
    trigger: "the {id} path segment does not resolve to an AppealCase"
  - error_id: ERR_INTERIM_RATE_REQUEST_NOT_FOUND
    http_status: 404
    trigger: "the {id} path segment does not resolve to an InterimRateRequest"
  - error_id: ERR_REFERENCED_ENTITY_NOT_FOUND
    http_status: 404
    trigger: "a foreign key supplied in the body does not resolve to an existing row"
  - error_id: ERR_PROVIDER_SCOPE_VIOLATION
    http_status: 403
    trigger: "a provider-scoped role supplied an X-User-ID that is not the Provider owning the target resource"
  - error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    trigger: "the X-User-ID resolving an AuditAdjustment equals its proposed_by_user_id"
  - error_id: ERR_STALE_COST_REPORT_VERSION
    http_status: 412
    trigger: "expected_cost_report_version does not equal the CostReport's current version"
  - error_id: ERR_STALE_PROVIDER_VERSION
    http_status: 412
    trigger: "expected_provider_version does not equal the Provider's current version"
  - error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    trigger: "the requested action has no transition from the entity's current state"
  - error_id: ERR_COST_REPORT_NOT_EDITABLE
    http_status: 409
    trigger: "an accounting child was created, mapped, patched, reversed or voided while the CostReport was not in DRAFT or REOPENED"
  - error_id: ERR_RESIDENT_DAILY_FTE_EXCEEDED
    http_status: 409
    trigger: "the resident's aggregate ACTIVE fte_fraction on some day of [start_date, end_date) would exceed 1.0000"
  - error_id: ERR_INTERIM_PERIOD_OVERLAP
    http_status: 409
    trigger: "the requested closed [effective_from, effective_to] interval comes within 30 days of an existing PENDING or APPROVED interval for the provider"
  - error_id: ERR_ROTATION_OUTSIDE_FISCAL_YEAR
    http_status: 409
    trigger: "the rotation interval does not intersect the cost report's fiscal year"
  - error_id: ERR_FILING_DEADLINE_PASSED
    http_status: 422
    trigger: "the logical clock date is after CostReport.filing_deadline on a non-REOPENED report"
  - error_id: ERR_APPEAL_WINDOW_EXPIRED
    http_status: 422
    trigger: "a PRRB appeal was filed more than 180 days after the FINAL settlement's issued_at"
  - error_id: ERR_REOPENING_WINDOW_EXPIRED
    http_status: 422
    trigger: "a reopening was granted more than 3 years after the FINAL settlement's issued_at"
  - error_id: ERR_COST_CENTER_FOREIGN_TO_REPORT
    http_status: 422
    trigger: "a referenced CostCenter belongs to a different CostReport than the operation's report"
  - error_id: ERR_COST_CENTER_FOREIGN_TO_PROVIDER
    http_status: 422
    trigger: "a rotation's CostCenter belongs to a CostReport of a different Provider than the resident's"
  - error_id: ERR_SETTLEMENT_FOREIGN_TO_REPORT
    http_status: 422
    trigger: "the appeal's settlement_id belongs to a different CostReport"
  - error_id: ERR_BASIS_REPORT_FOREIGN_TO_PROVIDER
    http_status: 422
    trigger: "the interim rate request's basis_cost_report_id belongs to a different Provider"
  - error_id: ERR_UNMAPPED_TRIAL_BALANCE
    http_status: 422
    trigger: "CostReport.unmapped_tb_total_cents != 0 at filing or stepdown time"
  - error_id: ERR_ALLOCATION_NOT_CURRENT
    http_status: 422
    trigger: "CostReport.allocation_status is NOT_RUN or STALE at filing or settlement time"
  - error_id: ERR_WAGE_SUBMISSION_NOT_ACCEPTED
    http_status: 422
    trigger: "the report is filed while its WageIndexSubmission is not ACCEPTED"
  - error_id: ERR_UCC_DATA_MISSING
    http_status: 422
    trigger: "the report is filed with no UccDataSet"
  - error_id: ERR_RECLASS_NOT_BALANCED
    http_status: 422
    trigger: "a RECLASSIFICATION entry has fewer than 2 legs or legs that do not sum to 0"
  - error_id: ERR_NON_ALLOWABLE_MUST_BE_NEGATIVE
    http_status: 422
    trigger: "is_non_allowable is true but some leg amount_cents is >= 0"
  - error_id: ERR_STEPDOWN_ORDER_CONFLICT
    http_status: 422
    trigger: "on POST /cost-reports/{id}/cost-centers only: a GENERAL_SERVICE center omits allocation_basis or stepdown_order, reuses a stepdown_order already held in the report, or a non-GENERAL_SERVICE center supplies either. PATCH /cost-centers/{id} never raises it (a renumbering collision surfaces as a FAILED StepdownRun instead)."
  - error_id: ERR_COST_CENTER_CODE_DUPLICATE
    http_status: 422
    trigger: "CostCenter.code already exists in the report, or statistics contains an unknown basis key"
  - error_id: ERR_STEPDOWN_STRUCTURE_INCOMPLETE
    http_status: 422
    trigger: "the report lacks a GENERAL_SERVICE center or lacks any ROUTINE / ANCILLARY center"
  - error_id: ERR_OCC_MIX_HOURS_EXCEED_TOTAL
    http_status: 422
    trigger: "the submission's summed occupational-mix reported_hours exceeds total_paid_hours"
  - error_id: ERR_OCC_MIX_INCOMPLETE
    http_status: 422
    trigger: "fewer than 3 occupational-mix categories have reported_hours > 0 when the submission is accepted"
  - error_id: ERR_OCC_MIX_CATEGORY_DUPLICATE
    http_status: 422
    trigger: "the occupational-mix category already exists on the submission"
  - error_id: ERR_DUPLICATE_CHILD_RECORD
    http_status: 422
    trigger: "a second non-REJECTED WageIndexSubmission or a second UccDataSet was created for the report"
  - error_id: ERR_FINAL_REQUIRES_DOUBLE_APPORTIONMENT
    http_status: 422
    trigger: "a FINAL settlement was requested while the COMPLETED StepdownRun used SINGLE_APPORTIONMENT"
  - error_id: ERR_AUDIT_ADJUSTMENT_UNRESOLVED
    http_status: 422
    trigger: "a FINAL settlement was requested while an AuditAdjustment is PROPOSED, ACCEPTED_BY_PROVIDER or PROTESTED"
  - error_id: ERR_SETTLEMENT_STAGE_INVALID
    http_status: 422
    trigger: "the appealed Settlement's stage is not FINAL"
  - error_id: ERR_PRRB_AMOUNT_BELOW_MINIMUM
    http_status: 422
    trigger: "a PRRB appeal was filed with amount_at_issue_cents below 1000000"
  - error_id: ERR_BASIS_REPORT_NOT_FINAL_SETTLED
    http_status: 422
    trigger: "the interim rate request's basis CostReport is not FINAL_SETTLED"
  - error_id: ERR_NO_CURRENT_INTERIM_RATE
    http_status: 422
    trigger: "the Provider's current_interim_rate_cents is 0, so no variance can be measured"
  - error_id: ERR_INTERIM_VARIANCE_BELOW_THRESHOLD
    http_status: 422
    trigger: "the pre-cap variance_ratio is below 0.1000"
  - error_id: ERR_FISCAL_PERIOD_INVALID
    http_status: 422
    trigger: "fiscal_year_begin >= fiscal_year_end, a period longer than 366 days, or a duplicate Provider.ccn"

# =====================================================================
# 1.7 RBAC Matrix
# =====================================================================
rbac:
  role_header: "X-User-Role"
  user_header: |
    X-User-ID carries the caller's identity. For the entity_backed roles
    (ReimbursementAnalyst, ReimbursementManager) it is the id of the Provider
    the caller acts for and is optional; when supplied it MUST own the target
    resource (ERR_PROVIDER_SCOPE_VIOLATION otherwise). For MacAuditor it is an
    opaque auditor id and is REQUIRED on POST /settlements/{id}/audit-adjustments
    and POST /audit-adjustments/{id}/resolve, where segregation of duties is
    enforced by comparing it with AuditAdjustment.proposed_by_user_id.
  roles:
    - name: SystemAdmin
      identity: opaque
      description: "platform operator; registers providers, opens cost reports and drives the logical clock"
      exclusive_operations:
        - "POST /_clock/set_current_utc"
        - "POST /providers"
      shared_operations:
        - "POST /cost-reports"
        - "every GET endpoint except /appeal-cases* (shared with the review board) "
    - name: ReimbursementAnalyst
      identity: entity_backed:Provider
      description: "hospital reimbursement staff who prepare the report: cost centers, trial balance mapping, workpapers, stepdown runs, wage data collection, residents/rotations and uncompensated care data"
      exclusive_operations:
        - "POST /cost-reports/{id}/cost-centers"
        - "PATCH /cost-centers/{id}"
        - "POST /cost-reports/{id}/trial-balance-lines"
        - "POST /trial-balance-lines/{id}/map"
        - "POST /cost-reports/{id}/workpaper-entries"
        - "POST /workpaper-entries/{id}/reverse"
        - "POST /cost-reports/{id}/wage-index-submissions"
        - "PATCH /wage-index-submissions/{id}"
        - "POST /wage-index-submissions/{id}/occ-mix-responses"
        - "POST /providers/{id}/residents"
        - "POST /residents/{id}/rotation-assignments"
        - "POST /rotation-assignments/{id}/void"
        - "POST /cost-reports/{id}/ucc-data-sets"
      shared_operations:
        - "POST /cost-reports/{id}/stepdown-runs"
        - "POST /ucc-data-sets/{id}/recompute"
        - "read endpoints for the provider's own data"
      scope_rule: "when X-User-ID is supplied it must equal the id of the Provider that owns the target resource, else ERR_PROVIDER_SCOPE_VIOLATION"
    - name: ReimbursementManager
      identity: entity_backed:Provider
      description: "hospital officer who attests and files: separated from preparation so that no analyst can both prepare and submit"
      exclusive_operations:
        - "POST /wage-index-submissions/{id}/submit"
        - "POST /cost-reports/{id}/file"
        - "POST /audit-adjustments/{id}/respond"
        - "POST /cost-reports/{id}/appeal-cases"
        - "POST /interim-rate-requests"
      shared_operations:
        - "POST /cost-reports"
        - "read endpoints for the provider's own data"
      scope_rule: "same provider scope rule as ReimbursementAnalyst; a ReimbursementManager may NOT perform any ReimbursementAnalyst exclusive_operation and vice versa"
    - name: MacAuditor
      identity: opaque
      description: "Medicare administrative contractor auditor; reviews wage data, issues settlements, proposes and resolves audit adjustments, grants reopenings and decides interim rate requests"
      exclusive_operations:
        - "POST /wage-index-submissions/{id}/start-review"
        - "POST /wage-index-submissions/{id}/review-decision"
        - "POST /cost-reports/{id}/settlements"
        - "POST /settlements/{id}/audit-adjustments"
        - "POST /audit-adjustments/{id}/resolve"
        - "POST /interim-rate-requests/{id}/decide"
      shared_operations:
        - "POST /cost-reports/{id}/stepdown-runs"
        - "POST /ucc-data-sets/{id}/recompute"
        - "POST /appeal-cases/{id}/decide (outcomes GRANT and DENY only)"
        - "every read endpoint"
      scope_rule: "no provider scope restriction; segregation of duties applies by X-User-ID — the auditor who proposed an AuditAdjustment cannot resolve it"
    - name: ReviewBoardClerk
      identity: opaque
      description: "Provider Reimbursement Review Board clerk; records hearings and board decisions only"
      exclusive_operations:
        - "POST /appeal-cases/{id}/decide (outcomes HEAR, DECIDE_FOR_PROVIDER, DECIDE_FOR_CONTRACTOR)"
      shared_operations:
        - "GET /appeal-cases, GET /appeal-cases/{id}, GET /settlements/{id}, GET /cost-reports/{id}/settlements"
      scope_rule: "may not read or write any other resource — a ReviewBoardClerk calling GET /cost-reports/{id} receives ERR_FORBIDDEN_ROLE"

