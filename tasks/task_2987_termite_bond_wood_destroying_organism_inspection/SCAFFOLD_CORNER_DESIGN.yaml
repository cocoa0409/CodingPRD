          assert:
            - "HTTP 404 with data.error_id == ERR_INSPECTION_NOT_FOUND"
            - "no plan row is created: GET /treatment-plans with property_id ${p1} returns total_count 0"
            - "the resolvable references are irrelevant to the outcome — priority 60 fires on the first unresolved body reference"

      - name: plan_create_with_inspection_from_another_property_rejected
        claim_type: foreign_key_integrity
        grounds:
          - validations[priority=104]
          - errors.ERR_PROPERTY_MISMATCH
          - complexity_profile.entity_topology
          - endpoints[POST /treatment-plans]
        distinguishing_aspect: >-
          The flat topology expresses parentage only through body FKs, so cross-reference integrity
          has to be checked explicitly: both references resolve and both rows are healthy, yet the
          graph belongs to a different structure, which is ERR_PROPERTY_MISMATCH (422) at priority
          104 — after existence (60) and after the plan-state family, but before any money rule.
        test_recipe:
          setup:
            - "Two FL properties, P1 and P4, each with its own GRAPHED INITIAL inspection."
            - "The plan is then requested for P1 while citing P4's graph."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
