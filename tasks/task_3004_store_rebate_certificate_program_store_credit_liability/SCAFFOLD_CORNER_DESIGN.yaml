# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# task_3004_store_rebate_certificate_program_store_credit_liability
# Breadth probe over §1.1–§1.7. Corners already exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because stubs.
# Common fixture idiom: the first call of every chain pins the logical clock
# via POST /_clock/set_current_utc; store policy {window 30d, validity 1mo,
# breakage 0.25, split 2h/3} unless overridden.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: store_create_returns_201_with_initialized_liability_fields
        claim_type: Creation
        grounds: [entities.Store, endpoints.POST_/stores]
        distinguishing_aspect: "A store created with the full policy payload returns 201 with outstanding_liability_cents 0, net_liability_cents 0, accrued_breakage_income_cents 0, liability_epoch 0, version 1 — computed fields are never client-supplied."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z (startup default, no set needed). Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /stores"
              payload: { store_code: "S-ENT1", submission_window_days: 30, certificate_validity_months: 1, expected_breakage_rate: 0.25, split_txn_window_hours: 2, split_txn_min_receipts: 3 }
              as: StoreAdmin
              captures: { s: $.data.id }
          assert:
            - "response status is 201 with response_type object"
            - "Store.${s}.outstanding_liability_cents == 0 and net_liability_cents == 0"
            - "Store.${s}.accrued_breakage_income_cents == 0 and liability_epoch == 0"
            - "Store.${s}.version == 1 and id / created_at / updated_at are non-null"

      - name: store_get_returns_stored_configuration_unchanged
        claim_type: Retrieval
        grounds: [entities.Store, "endpoints.GET_/stores/{store_id}"]
        distinguishing_aspect: "Every policy field round-trips through GET exactly as posted, including the fractional expected_breakage_rate 0.33."
        test_recipe:
          setup: ["Store S created with expected_breakage_rate 0.33."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_code: "S-ENT2", submission_window_days: 45, certificate_validity_months: 3, expected_breakage_rate: 0.33, split_txn_window_hours: 4, split_txn_min_receipts: 2 }
              as: StoreAdmin
              captures: { s: $.data.id }
          trigger:
            - call: "GET /stores/${s}"
              payload: {}
              as: GuestService
          assert:
            - "response status is 200"
            - "Store.${s}.submission_window_days == 45 and certificate_validity_months == 3"
            - "Store.${s}.expected_breakage_rate == 0.33 and split_txn_window_hours == 4 and split_txn_min_receipts == 2"

      - name: rebate_programs_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds: ["endpoints.GET_/stores/{store_id}/rebate-programs", response_envelope.pagination_defaults]
        distinguishing_aspect: "With three programs on file, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns the last row with has_more false — total_count counts the whole filtered set, not the page."
        test_recipe:
          setup: ["Store S with three DRAFT programs P1, P2, P3."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_code: "S-ENT3", submission_window_days: 30, certificate_validity_months: 1, expected_breakage_rate: 0.25, split_txn_window_hours: 2, split_txn_min_receipts: 3 }
              as: StoreAdmin
              captures: { s: $.data.id }
            - call: "POST /stores/${s}/rebate-programs"
              payload: { name: "P1", week_start_date: "2026-09-07", week_end_date: "2026-09-14" }
              as: StoreAdmin
            - call: "POST /stores/${s}/rebate-programs"
              payload: { name: "P2", week_start_date: "2026-09-14", week_end_date: "2026-09-21" }
              as: StoreAdmin
            - call: "POST /stores/${s}/rebate-programs"
              payload: { name: "P3", week_start_date: "2026-09-21", week_end_date: "2026-09-28" }
              as: StoreAdmin
          trigger:
            - call: "GET /stores/${s}/rebate-programs"
              payload: { limit: 2, offset: 0 }
              as: StoreAdmin
            - call: "GET /stores/${s}/rebate-programs"
              payload: { limit: 2, offset: 2 }
              as: StoreAdmin
          assert:
            - "first page returns 2 rows with meta total_count == 3 and has_more == true"
            - "second page returns 1 row with total_count == 3 and has_more == false"

      - name: get_certificate_with_unknown_id_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_NOT_FOUND]", "endpoints.GET_/stores/{store_id}/certificates/{certificate_id}"]
        distinguishing_aspect: "Reading a certificate under a well-formed but non-existent UUID returns ERR_NOT_FOUND (404), and the same happens when the certificate id exists but belongs to a DIFFERENT store (mis-nested path)."
        test_recipe:
          setup: ["Stores S1 and S2; account AC at S1; receipt R1 (AAA @ 10000) approved and certificate CERT issued at S1."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: StoreAdmin
            - call: "POST /stores"
              payload: { store_code: "S-ENT4A", submission_window_days: 30, certificate_validity_months: 1, expected_breakage_rate: 0.25, split_txn_window_hours: 2, split_txn_min_receipts: 3 }
              as: StoreAdmin
              captures: { s1: $.data.id }
            - call: "POST /stores"
              payload: { store_code: "S-ENT4B", submission_window_days: 30, certificate_validity_months: 1, expected_breakage_rate: 0.25, split_txn_window_hours: 2, split_txn_min_receipts: 3 }
              as: StoreAdmin
              captures: { s2: $.data.id }
            - call: "POST /stores/${s1}/rebate-programs"
              payload: { name: "W", week_start_date: "2026-09-07", week_end_date: "2026-09-14" }
              as: StoreAdmin
              captures: { p: $.data.id }
            - call: "POST /stores/${s1}/rebate-programs/${p}/items"
              payload: { sku: "AAA", rebate_pct: 0.1 }
              as: StoreAdmin
            - call: "POST /stores/${s1}/rebate-programs/${p}/activate"
              payload: {}
              as: StoreAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T12:00:00Z" }
              as: StoreAdmin
            - call: "POST /stores/${s1}/credit-accounts"
              payload: { owner_name: "Ann", account_type: "RETAIL" }
              as: GuestService
              captures: { ac: $.data.id }
            - call: "POST /stores/${s1}/receipts"
              payload: { receipt_number: "R-ENT4", account_id: "${ac}", purchase_at: "2026-09-08T10:00:00Z", lines: [ { line_number: 1, sku: "AAA", category: "TOOLS", quantity: 1, unit_price_cents: 10000, tender_splits: [ { tender_type: "CASH", amount_cents: 10000 } ] } ] }
              as: GuestService
              captures: { r: $.data.id }
            - call: "POST /stores/${s1}/rebate-submissions"
              payload: { receipt_id: "${r}" }
              as: Customer
              as_user_id: "${ac}"
              captures: { sub: $.data.id }
            - call: "POST /stores/${s1}/rebate-submissions/${sub}/adjudicate"
              payload: { decision: "APPROVE" }
              as: GuestService
            - call: "POST /stores/${s1}/rebate-submissions/${sub}/issue-certificate"
              payload: {}
              as: GuestService
              captures: { cert: $.data.id }
          trigger:
            - call: "GET /stores/${s1}/certificates/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: GuestService
              captures: { err1: $.data.error_id }
            - call: "GET /stores/${s2}/certificates/${cert}"
              payload: {}
              as: GuestService
              captures: { err2: $.data.error_id }
          assert:
            - "both requests fail: unknown id → ERR_NOT_FOUND (404); existing certificate under the wrong store → ERR_NOT_FOUND (404)"

      - name: store_create_missing_policy_field_rejected
        claim_type: Required Fields
        grounds: [entities.Store.fields.submission_window_days, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting the required input field submission_window_days from POST /stores is rejected with ERR_INVALID_REQUEST (400); no store row is created."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /stores"
              payload: { store_code: "S-ENT5", certificate_validity_months: 1, expected_breakage_rate: 0.25, split_txn_window_hours: 2, split_txn_min_receipts: 3 }
              as: StoreAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the request fails with error_id ERR_INVALID_REQUEST (HTTP 400)"

      - name: program_item_defaults_applied_when_optionals_omitted
        claim_type: Defaults
        grounds: [entities.ProgramItem.fields.excluded_categories, entities.ProgramItem.fields.min_quantity, entities.ProgramItem.fields.per_receipt_cap_cents]
        distinguishing_aspect: "Creating a ProgramItem with only sku and rebate_pct applies the declared defaults: excluded_categories == [], min_quantity == 1, per_receipt_cap_cents == null."
        test_recipe:
          setup: ["Store S; DRAFT program P."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_code: "S-ENT6", submission_window_days: 30, certificate_validity_months: 1, expected_breakage_rate: 0.25, split_txn_window_hours: 2, split_txn_min_receipts: 3 }
              as: StoreAdmin
              captures: { s: $.data.id }
            - call: "POST /stores/${s}/rebate-programs"
              payload: { name: "W", week_start_date: "2026-09-07", week_end_date: "2026-09-14" }
              as: StoreAdmin
              captures: { p: $.data.id }
          trigger:
            - call: "POST /stores/${s}/rebate-programs/${p}/items"
              payload: { sku: "AAA", rebate_pct: 0.11 }
              as: StoreAdmin
              captures: { item: $.data.id }
          assert:
            - "ProgramItem.${item}.excluded_categories == [] and min_quantity == 1 and per_receipt_cap_cents is null"

      - name: receipt_total_cents_computed_not_accepted_from_input
        claim_type: Computed Fields
        grounds: [entities.Receipt.fields.total_cents, entities.ReceiptLine.fields.certificate_tendered_cents]
        distinguishing_aspect: "Receipt.total_cents and ReceiptLine.certificate_tendered_cents are computed: a receipt of lines 2×5000 + 3×2500 with 800 certificate tender on line 2 reports total_cents 17500 and line 2 certificate_tendered_cents 800 regardless of any client-supplied value."
        test_recipe:
          setup: ["Store S; retail account AC; clock at 2026-09-08T12:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T12:00:00Z" }
              as: StoreAdmin
            - call: "POST /stores"
              payload: { store_code: "S-ENT7", submission_window_days: 30, certificate_validity_months: 1, expected_breakage_rate: 0.25, split_txn_window_hours: 2, split_txn_min_receipts: 3 }
              as: StoreAdmin
              captures: { s: $.data.id }
            - call: "POST /stores/${s}/credit-accounts"
              payload: { owner_name: "Ann", account_type: "RETAIL" }
              as: GuestService
              captures: { ac: $.data.id }
          trigger:
            - call: "POST /stores/${s}/receipts"
              payload: { receipt_number: "R-ENT7", account_id: "${ac}", purchase_at: "2026-09-08T10:00:00Z", lines: [ { line_number: 1, sku: "AAA", category: "TOOLS", quantity: 2, unit_price_cents: 5000, tender_splits: [ { tender_type: "CASH", amount_cents: 10000 } ] }, { line_number: 2, sku: "BBB", category: "TOOLS", quantity: 3, unit_price_cents: 2500, tender_splits: [ { tender_type: "CASH", amount_cents: 6700 }, { tender_type: "STORE_CREDIT_CERTIFICATE", amount_cents: 800 } ] } ] }
              as: GuestService
              captures: { r: $.data.id }
            - call: "GET /stores/${s}/receipts/${r}/lines"
              payload: {}
              as: GuestService
          assert:
            - "Receipt.${r}.total_cents == 17500"
            - "line 1 certificate_tendered_cents == 0 and line 2 certificate_tendered_cents == 800"

      - name: receipt_line_has_no_version_field_common_fields_false
        claim_type: Immutability
        grounds: [entities.ReceiptLine, entities.SubmissionLine, entities.CreditLedgerEntry]
        distinguishing_aspect: "ReceiptLine, SubmissionLine and CreditLedgerEntry carry common_fields: false — their representations expose id and created_at but no version field, and no update endpoint exists for them."
        test_recipe:
          setup: ["Store S; account AC; receipt R with one line."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T12:00:00Z" }
              as: StoreAdmin
            - call: "POST /stores"
              payload: { store_code: "S-ENT8", submission_window_days: 30, certificate_validity_months: 1, expected_breakage_rate: 0.25, split_txn_window_hours: 2, split_txn_min_receipts: 3 }
              as: StoreAdmin
              captures: { s: $.data.id }
            - call: "POST /stores/${s}/credit-accounts"
              payload: { owner_name: "Ann", account_type: "RETAIL" }
              as: GuestService
              captures: { ac: $.data.id }
            - call: "POST /stores/${s}/receipts"
              payload: { receipt_number: "R-ENT8", account_id: "${ac}", purchase_at: "2026-09-08T10:00:00Z", lines: [ { line_number: 1, sku: "AAA", category: "TOOLS", quantity: 1, unit_price_cents: 1000, tender_splits: [ { tender_type: "CASH", amount_cents: 1000 } ] } ] }
              as: GuestService
              captures: { r: $.data.id }
          trigger:
            - call: "GET /stores/${s}/receipts/${r}/lines"
              payload: {}
              as: GuestService
          assert:
            - "each returned line carries id and created_at and carries NO version and NO updated_at field"

      - name: receipt_create_with_unknown_account_returns_422_invalid_job_purchase
        claim_type: Parent Relationships
        grounds: [entities.Receipt.fields.account_id, "validations[priority=7]", "errors[ERR_INVALID_JOB_PURCHASE]"]
        distinguishing_aspect: "Posting a receipt whose account_id references a non-existent CreditAccount is rejected with ERR_INVALID_JOB_PURCHASE (422) — referential integrity on the flat FK, not a 404, because the account id arrives in the body rather than the path."
        test_recipe:
          setup: ["Store S; clock at 2026-09-08T12:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T12:00:00Z" }
              as: StoreAdmin
            - call: "POST /stores"
              payload: { store_code: "S-ENT9", submission_window_days: 30, certificate_validity_months: 1, expected_breakage_rate: 0.25, split_txn_window_hours: 2, split_txn_min_receipts: 3 }
              as: StoreAdmin
              captures: { s: $.data.id }
          trigger:
            - call: "POST /stores/${s}/receipts"
              payload: { receipt_number: "R-ENT9", account_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", purchase_at: "2026-09-08T10:00:00Z", lines: [ { line_number: 1, sku: "AAA", category: "TOOLS", quantity: 1, unit_price_cents: 1000, tender_splits: [ { tender_type: "CASH", amount_cents: 1000 } ] } ] }
              as: GuestService
              captures: { err: $.data.error_id }
          assert:
            - "the request fails with error_id ERR_INVALID_JOB_PURCHASE (HTTP 422)"

      - name: credit_account_close_blocked_while_balance_nonzero
        claim_type: Creation
        grounds: [state_machines.CreditAccount, "errors[ERR_ACCOUNT_BALANCE_NONZERO]"]
        distinguishing_aspect: "Closing an account whose credit_balance_cents is 500 is rejected with ERR_ACCOUNT_BALANCE_NONZERO; after the certificate is fully redeemed the same close succeeds."
        test_recipe:
          setup: ["Store S; program P ACTIVE week [2026-09-07, 2026-09-14) item AAA 0.10; account AC; receipt R1 (AAA @ 5000) → approved → CERT 500 issued 2026-09-10; receipt R2 (ZZZ @ 500, purchased 2026-09-11) available as redemption target."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: StoreAdmin
            - call: "POST /stores"
              payload: { store_code: "S-ENT10", submission_window_days: 30, certificate_validity_months: 1, expected_breakage_rate: 0.25, split_txn_window_hours: 2, split_txn_min_receipts: 3 }
              as: StoreAdmin
              captures: { s: $.data.id }
            - call: "POST /stores/${s}/rebate-programs"
              payload: { name: "W", week_start_date: "2026-09-07", week_end_date: "2026-09-14" }
              as: StoreAdmin
              captures: { p: $.data.id }
            - call: "POST /stores/${s}/rebate-programs/${p}/items"
              payload: { sku: "AAA", rebate_pct: 0.1 }
              as: StoreAdmin
            - call: "POST /stores/${s}/rebate-programs/${p}/activate"
              payload: {}
              as: StoreAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T12:00:00Z" }
              as: StoreAdmin
            - call: "POST /stores/${s}/credit-accounts"
              payload: { owner_name: "Ann", account_type: "RETAIL" }
              as: GuestService
              captures: { ac: $.data.id }
            - call: "POST /stores/${s}/receipts"
              payload: { receipt_number: "R-ENT10-1", account_id: "${ac}", purchase_at: "2026-09-08T10:00:00Z", lines: [ { line_number: 1, sku: "AAA", category: "TOOLS", quantity: 1, unit_price_cents: 5000, tender_splits: [ { tender_type: "CASH", amount_cents: 5000 } ] } ] }
              as: GuestService
              captures: { r1: $.data.id }
            - call: "POST /stores/${s}/rebate-submissions"
              payload: { receipt_id: "${r1}" }
              as: Customer
              as_user_id: "${ac}"
              captures: { sub: $.data.id }
            - call: "POST /stores/${s}/rebate-submissions/${sub}/adjudicate"
              payload: { decision: "APPROVE" }
              as: GuestService
            - call: "POST /stores/${s}/rebate-submissions/${sub}/issue-certificate"
              payload: {}
              as: GuestService
              captures: { cert: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T00:00:00Z" }
              as: StoreAdmin
            - call: "POST /stores/${s}/receipts"
              payload: { receipt_number: "R-ENT10-2", account_id: "${ac}", purchase_at: "2026-09-11T10:00:00Z", lines: [ { line_number: 1, sku: "ZZZ", category: "PAINT", quantity: 1, unit_price_cents: 500, tender_splits: [ { tender_type: "CASH", amount_cents: 500 } ] } ] }
              as: GuestService
              captures: { r2: $.data.id }
          trigger:
            - call: "POST /stores/${s}/credit-accounts/${ac}/close"
              payload: {}
              as: StoreAdmin
              captures: { err: $.data.error_id }
            - call: "POST /stores/${s}/certificates/${cert}/redeem"
              payload: { receipt_id: "${r2}", amount_cents: 500 }
              as: GuestService
            - call: "POST /stores/${s}/credit-accounts/${ac}/close"
              payload: {}
              as: StoreAdmin
          assert:
            - "first close fails with error_id ERR_ACCOUNT_BALANCE_NONZERO (HTTP 409)"
            - "after full redemption, second close succeeds: CreditAccount.${ac}.status == CLOSED"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: adjudicate_rejected_submission_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.RebateSubmission, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Adjudicating a REJECTED submission while the window is still OPEN fails with ERR_INVALID_STATE (409) — the pure state-precondition path, complementing the §1.8 instance that layers the temporal failure on top."
        test_recipe:
          setup:
            - "Store S; program P ACTIVE week [2026-09-07, 2026-09-14) item AAA 0.11; account AC; receipt R purchased 2026-09-08T10:00:00Z; submission created and REJECTED; clock STILL at 2026-09-09 (window open)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
              as: StoreAdmin
            - call: "POST /stores"
              payload: { store_code: "S-SM1", submission_window_days: 30, certificate_validity_months: 1, expected_breakage_rate: 0.25, split_txn_window_hours: 2, split_txn_min_receipts: 3 }
              as: StoreAdmin
              captures: { s: $.data.id }
            - call: "POST /stores/${s}/rebate-programs"
              payload: { name: "W", week_start_date: "2026-09-07", week_end_date: "2026-09-14" }
              as: StoreAdmin
              captures: { p: $.data.id }
            - call: "POST /stores/${s}/rebate-programs/${p}/items"
              payload: { sku: "AAA", rebate_pct: 0.11 }
              as: StoreAdmin
            - call: "POST /stores/${s}/rebate-programs/${p}/activate"
              payload: {}
              as: StoreAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T12:00:00Z" }
              as: StoreAdmin
            - call: "POST /stores/${s}/credit-accounts"
              payload: { owner_name: "Ann", account_type: "RETAIL" }
              as: GuestService
              captures: { ac: $.data.id }
            - call: "POST /stores/${s}/receipts"
              payload: { receipt_number: "R-SM1", account_id: "${ac}", purchase_at: "2026-09-08T10:00:00Z", lines: [ { line_number: 1, sku: "AAA", category: "TOOLS", quantity: 1, unit_price_cents: 10000, tender_splits: [ { tender_type: "CASH", amount_cents: 10000 } ] } ] }
              as: GuestService
              captures: { r: $.data.id }
            - call: "POST /stores/${s}/rebate-submissions"
              payload: { receipt_id: "${r}" }
              as: Customer
              as_user_id: "${ac}"
              captures: { sub: $.data.id }
            - call: "POST /stores/${s}/rebate-submissions/${sub}/adjudicate"
              payload: { decision: "REJECT", rejection_reason: "illegible" }
              as: GuestService
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-09T00:00:00Z" }
              as: StoreAdmin
          trigger:
            - call: "POST /stores/${s}/rebate-submissions/${sub}/adjudicate"
              payload: { decision: "APPROVE" }
              as: GuestService
              captures: { err: $.data.error_id }
          assert:
            - "with the window still open, the rejection is error_id ERR_INVALID_STATE (HTTP 409) — the pure state-precondition path, confirming the §1.8 instance's error really came from the temporal priority"
            - "RebateSubmission.${sub}.status == REJECTED (unchanged)"

      - name: redeem_fully_redeemed_certificate_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.RebateCertificate, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Redeeming against a FULLY_REDEEMED certificate (terminal state) fails with ERR_INVALID_STATE — not ERR_REDEMPTION_EXCEEDS_BALANCE — because the state check (priority 9) precedes the fiscal check (priority 15) even though remaining_balance is 0."
        test_recipe:
          setup: ["Store S; program P ACTIVE item AAA 0.10; account AC; R1 (AAA @ 10000) → approved → CERT 1000 issued; R2 (ZZZ @ 2000, purchased 2026-09-11); CERT fully redeemed (1000) against R2."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T00:00:00Z" }
