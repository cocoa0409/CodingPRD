            - "${sc_open_state} == OPEN — the SAME open on the SAME lane succeeds for the opaque CheckpointManager, which holds no Officer row at all"
            - "${sc_ref_private} == true and the CREATE was allowed: priority 18 gates the begin, not the referral creation"
            - "${sc_begin_error} == ERR_SUPERVISOR_CERTIFICATION_REQUIRED (403) — and NOT ERR_OFFICER_NOT_CERTIFIED, because the officer does hold SPECIAL_PROCEDURES for the MEDICAL_DEVICE category"
            - "${sc_begin_state} == IN_PROGRESS and ${sc_resolve_state} == DENIED_ENTRY for the SUPERVISOR-certified officer — detecting (${nosup_id}) and resolving (${sup_id}) differ, so segregation of duties is satisfied"

      - name: shared_operations_work_for_every_role_that_declares_them
        claim_type: shared_operation_coverage
        grounds:
          - roles[CheckpointManager]
          - roles[DutyManager]
          - roles[SupervisoryOfficer]
          - roles[StaffingPlanner]
          - roles[PlatformAdmin]
        distinguishing_aspect: "Peer roles must not be collapsed into one privileged path: three different roles post wait observations into the SAME publication window, two create time bands, and a DutyManager — an opaque role — may drive an assignment's duty axis on behalf of the officer while entity_backed roles may not do so for others."
        test_recipe:
          setup: ["an ACTIVATED plan with one assignment, an OPEN lane and a SUPERVISOR-certified officer"]
          setup_api_calls:
            - *c_clock08
            - *c_cp
            - *c_lane
