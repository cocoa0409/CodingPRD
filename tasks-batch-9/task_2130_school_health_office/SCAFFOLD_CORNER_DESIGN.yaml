              captures: { lot_id: $.data.id }
            - call: "POST /health-office/medication-authorizations"
              payload: { student_id: "${stu_id}", medication_code: "ALBUTEROL", route: "INHALED", dose_amount: 2, dose_unit: "PUFF", schedule_type: "SCHEDULED", max_doses_per_day: 3, valid_from: "2026-07-01T00:00:00Z", valid_until: "2027-06-30T00:00:00Z" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { auth_id: $.data.id }
            - call: "POST /health-office/medication-authorizations/${auth_id}/consent"
              payload: { decision: "GRANT" }
              as: Guardian
              as_user_id: "${stu_id}"
            - call: "POST /health-office/medication-authorizations/${auth_id}/clinical-review"
              payload: { decision: "VERIFY" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
            - call: "POST /health-office/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: DistrictHealthAdmin
            - call: "POST /health-office/health-visits"
              payload: { student_id: "${stu_id}", school_id: "${sch_id}", nurse_id: "${rn_id}", complaint_code: "MEDICATION", acuity: "ROUTINE" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { visit_id: $.data.id }
            - call: "POST /health-office/health-visits/${visit_id}/assess"
              payload: { assessment_note: "Two doses charted today" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
            - call: "GET /health-office/medication-authorizations/${auth_id}"
              payload: {}
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { auth_v_stale: $.data.version }
            - call: "POST /health-office/administration-records"
              payload: { visit_id: "${visit_id}", authorization_id: "${auth_id}", units: 1, expected_authorization_version: "${auth_v_stale}" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { adm1_id: $.data.id }
          trigger:
            - call: "POST /health-office/administration-records"
              payload: { visit_id: "${visit_id}", authorization_id: "${auth_id}", units: 1, expected_authorization_version: "${auth_v_stale}" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { err: $.data.error_id }
            - call: "GET /health-office/medication-authorizations/${auth_id}"
              payload: {}
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { auth_v_fresh: $.data.version }
            - call: "POST /health-office/administration-records"
              payload: { visit_id: "${visit_id}", authorization_id: "${auth_id}", units: 1, expected_authorization_version: "${auth_v_fresh}" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { adm2_id: $.data.id }
          assert:
            - "Stale attempt: HTTP status == 412 and data.error_id == ERR_STALE_AUTHORIZATION_VERSION"
            - "Stale attempt: data.error_id != ERR_DAILY_DOSE_CAP_REACHED"
            - "Stale attempt: MedicationStockLot.${lot_id}.quantity_on_hand == 9 and quantity_reserved == 1"
            - "Stale attempt: HealthVisit.${visit_id}.pending_administration_count == 1"
            - "Fresh attempt: HTTP status == 201 and AdministrationRecord.${adm2_id}.status == PREPARED"
            - "Fresh attempt: MedicationStockLot.${lot_id}.quantity_on_hand == 8 and quantity_reserved == 2"
            - "Fresh attempt: HealthVisit.${visit_id}.pending_administration_count == 2"
            - "MedicationStockLot.${lot_id}.received_total == 10 throughout"

      - name: occ_stale_lot_version_rejects_inventory_action
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[lot-inventory-action-stale-lot]
          - validations[priority=16]
          - errors[ERR_STALE_LOT_VERSION]
          - entities.MedicationStockLot.fields.version
        distinguishing_aspect: "A RECEIVE increments MedicationStockLot.version, so a follow-up QUARANTINE still carrying the pre-RECEIVE version is refused with 412 ERR_STALE_LOT_VERSION and the lot remains AVAILABLE with its post-RECEIVE counters intact."
        test_recipe:
          setup:
            - "School LOOM72 with no students and one AVAILABLE stock-protocol EPINEPHRINE lot of 4 units, version captured at creation."
            - "A RECEIVE of 6 more units then advances the lot to 10 units and bumps its version."
          setup_api_calls:
            - call: "POST /health-office/schools"
              payload: { name: "Loom Elementary", building_code: "LOM72", cot_capacity: 2, emergency_protocol_enabled: true }
              as: DistrictHealthAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /health-office/medication-stock-lots"
              payload: { school_id: "${sch_id}", medication_code: "EPINEPHRINE", lot_number: "EPI-LOM-1", is_stock_protocol: true, initial_quantity: 4, expiration_date: "2027-06-30T00:00:00Z" }
              as: DistrictHealthAdmin
              captures: { lot_id: $.data.id, lot_v_stale: $.data.version }
            - call: "POST /health-office/medication-stock-lots/${lot_id}/inventory-action"
              payload: { action: "RECEIVE", expected_lot_version: "${lot_v_stale}", units: 6 }
              as: DistrictHealthAdmin
              captures: { lot_v_after_receive: $.data.version, on_hand_after_receive: $.data.quantity_on_hand }
          trigger:
            - call: "POST /health-office/medication-stock-lots/${lot_id}/inventory-action"
              payload: { action: "QUARANTINE", expected_lot_version: "${lot_v_stale}", reason_code: "Stale-version quarantine attempt" }
              as: DistrictHealthAdmin
              captures: { err: $.data.error_id }
            - call: "POST /health-office/medication-stock-lots/${lot_id}/inventory-action"
              payload: { action: "QUARANTINE", expected_lot_version: "${lot_v_after_receive}", reason_code: "Recall confirmed" }
              as: DistrictHealthAdmin
              captures: { lot_status_final: $.data.status }
          assert:
            - "After RECEIVE: MedicationStockLot.${lot_id}.received_total == 10 and quantity_on_hand == 10"
            - "After RECEIVE: MedicationStockLot.${lot_id}.days_of_supply == 33.33 and version == 2"
            - "Stale QUARANTINE: HTTP status == 412 and data.error_id == ERR_STALE_LOT_VERSION"
            - "Stale QUARANTINE: MedicationStockLot.${lot_id}.status == AVAILABLE and version == 2"
            - "Stale QUARANTINE: School.${sch_id}.epinephrine_days_of_supply == 33.33"
            - "Fresh QUARANTINE: HTTP status == 200 and MedicationStockLot.${lot_id}.status == QUARANTINED"
            - "Fresh QUARANTINE: MedicationStockLot.${lot_id}.version == 3"
            - "Fresh QUARANTINE: School.${sch_id}.epinephrine_days_of_supply == 0.0"

      - name: ops_checkpoint_expires_authorization_and_voids_its_prepared_record
        claim_type: ops_run_checkpoint
        grounds:
          - state_machines.MedicationAuthorization.UNVERIFIED_to_EXPIRED
          - endpoints[POST /health-office/_ops/run-daily-checkpoint]
          - state_machines.AdministrationRecord.PREPARED_to_VOIDED
          - calculations.lot_unit_conservation
        distinguishing_aspect: "The epoch-advancing checkpoint drives clinical_status to EXPIRED for every order whose valid_until the clock has reached, voids each PREPARED record drawing on it and returns both ids in expired_authorization_ids and voided_administration_ids — the reservation returns to the lot with received_total unchanged."
        test_recipe:
          setup:
            - "School MIRE73 with an RN on an ACTIVE Monday block, one ENROLLED student and one AVAILABLE student-specific ALBUTEROL lot of 5 units (expiring 2027-06-30, so the lot itself does not expire)."
            - "One SCHEDULED ALBUTEROL order at (CONSENT_GRANTED, VERIFIED) whose valid_until is 2026-08-04T00:00:00Z."
            - "Clock at 2026-08-03T09:00:00Z: encounter IN_ASSESSMENT with one PREPARED record for 2 units. Clock then advanced to exactly 2026-08-04T00:00:00Z."
          setup_api_calls:
            - call: "POST /health-office/schools"
              payload: { name: "Mire Elementary", building_code: "MIR73", cot_capacity: 2, emergency_protocol_enabled: true }
              as: DistrictHealthAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /health-office/nurses"
              payload: { full_name: "Rita Nolan", credential: "RN", weekly_contracted_minutes: 2400, delegation_authorized: false }
              as: DistrictHealthAdmin
              captures: { rn_id: $.data.id }
            - call: "POST /health-office/coverage-assignments"
              payload: { nurse_id: "${rn_id}", school_id: "${sch_id}", weekday: "MON", start_minute: 480, end_minute: 960, effective_from: "2026-07-01T00:00:00Z" }
              as: DistrictHealthAdmin
              captures: { cov_id: $.data.id }
            - call: "POST /health-office/students"
              payload: { school_id: "${sch_id}", full_name: "Mel Ruiz", grade_level: 7, date_of_birth: "2013-12-12T00:00:00Z", allergy_severity: "NONE", chronic_condition_codes: ["ASTHMA"], immunization_status: "COMPLIANT" }
              as: DistrictHealthAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /health-office/medication-stock-lots"
              payload: { school_id: "${sch_id}", medication_code: "ALBUTEROL", lot_number: "ALB-MIR-1", is_stock_protocol: false, initial_quantity: 5, expiration_date: "2027-06-30T00:00:00Z" }
              as: DistrictHealthAdmin
              captures: { lot_id: $.data.id }
            - call: "POST /health-office/medication-authorizations"
              payload: { student_id: "${stu_id}", medication_code: "ALBUTEROL", route: "INHALED", dose_amount: 2, dose_unit: "PUFF", schedule_type: "SCHEDULED", max_doses_per_day: 2, valid_from: "2026-07-01T00:00:00Z", valid_until: "2026-08-04T00:00:00Z" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { auth_id: $.data.id }
            - call: "POST /health-office/medication-authorizations/${auth_id}/consent"
              payload: { decision: "GRANT" }
              as: Guardian
              as_user_id: "${stu_id}"
            - call: "POST /health-office/medication-authorizations/${auth_id}/clinical-review"
              payload: { decision: "VERIFY" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
            - call: "POST /health-office/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: DistrictHealthAdmin
            - call: "POST /health-office/health-visits"
              payload: { student_id: "${stu_id}", school_id: "${sch_id}", nurse_id: "${rn_id}", complaint_code: "MEDICATION", acuity: "ROUTINE" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { visit_id: $.data.id }
            - call: "POST /health-office/health-visits/${visit_id}/assess"
              payload: { assessment_note: "Dose reserved before the order lapses" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
            - call: "GET /health-office/medication-authorizations/${auth_id}"
              payload: {}
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { auth_v: $.data.version }
            - call: "POST /health-office/administration-records"
              payload: { visit_id: "${visit_id}", authorization_id: "${auth_id}", units: 2, expected_authorization_version: "${auth_v}" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { adm_id: $.data.id }
            - call: "POST /health-office/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T00:00:00Z" }
              as: DistrictHealthAdmin
          trigger:
            - call: "POST /health-office/_ops/run-daily-checkpoint"
              payload: { school_id: "${sch_id}" }
              as: DistrictHealthAdmin
              captures: { expired_auths: $.data.expired_authorization_ids, voided_admins: $.data.voided_administration_ids }
          assert:
            - "Before the checkpoint: MedicationAuthorization.${auth_id}.clinical_status == VERIFIED and AdministrationRecord.${adm_id}.status == PREPARED"
            - "Before the checkpoint: MedicationStockLot.${lot_id}.quantity_on_hand == 3 and quantity_reserved == 2"
            - "HTTP status == 200"
            - "data.expired_authorization_ids contains ${auth_id}"
            - "data.voided_administration_ids contains ${adm_id}"
            - "MedicationAuthorization.${auth_id}.clinical_status == EXPIRED"
            - "MedicationAuthorization.${auth_id}.consent_status == CONSENT_GRANTED"
            - "MedicationAuthorization.${auth_id}.dispensable == false"
            - "AdministrationRecord.${adm_id}.status == VOIDED"
            - "MedicationStockLot.${lot_id}.quantity_on_hand == 5 and quantity_reserved == 0"
            - "MedicationStockLot.${lot_id}.received_total == 5"
            - "HealthVisit.${visit_id}.pending_administration_count == 0"

      - name: cascading_side_effects_layer_walk
        claim_type: cascading_side_effects
        grounds: [state_machines.MedicationStockLot.AVAILABLE_to_QUARANTINED]
        excluded_because:
          difficulty_instance: transitive_cascade / lot_quarantine_four_hop_cascade
          rationale: "The four-level quarantine chain, its ordering and its end-state counters are asserted hop by hop in that §1.8 instance."

      - name: dual_variant_calculation_layer_walk
        claim_type: dual_variant_calculation
        grounds: [calculations.student_risk_scoring]
        excluded_because:
          difficulty_instance: dual_variant_calc / student_risk_intake_vs_observed_diverge
          rationale: "Both stored variants (15 vs 26) and the tier driven by the larger one are pinned by that §1.8 instance."

  - section: consistency_model
    instances:

      - name: derived_fields_are_visible_in_the_same_request_cycle
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.school_days_of_supply
          - calculations.stock_protocol_status
          - entities.MedicationStockLot.fields.days_of_supply
        distinguishing_aspect: "consistency_model is immediate: the lot-create response itself already carries days_of_supply 33.33, and the very next School read shows epinephrine_days_of_supply 33.33 and stock_protocol_status DEGRADED with no intervening checkpoint call."
        test_recipe:
          setup:
            - "School NIMBUS74 with an RN on an ACTIVE Monday block, one ENROLLED ANAPHYLAXIS student (required_stock_units 1) and one stock-protocol ALBUTEROL lot of 36 units already in place."
          setup_api_calls:
            - call: "POST /health-office/schools"
              payload: { name: "Nimbus Elementary", building_code: "NMB74", cot_capacity: 2, emergency_protocol_enabled: true }
              as: DistrictHealthAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /health-office/nurses"
              payload: { full_name: "Rita Nolan", credential: "RN", weekly_contracted_minutes: 2400, delegation_authorized: false }
              as: DistrictHealthAdmin
              captures: { rn_id: $.data.id }
            - call: "POST /health-office/coverage-assignments"
              payload: { nurse_id: "${rn_id}", school_id: "${sch_id}", weekday: "MON", start_minute: 480, end_minute: 960, effective_from: "2026-07-01T00:00:00Z" }
              as: DistrictHealthAdmin
              captures: { cov_id: $.data.id }
            - call: "POST /health-office/students"
              payload: { school_id: "${sch_id}", full_name: "Nia Falk", grade_level: 4, date_of_birth: "2016-11-21T00:00:00Z", allergy_severity: "ANAPHYLAXIS", chronic_condition_codes: [], immunization_status: "COMPLIANT" }
              as: DistrictHealthAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /health-office/medication-stock-lots"
              payload: { school_id: "${sch_id}", medication_code: "ALBUTEROL", lot_number: "ALB-NMB-1", is_stock_protocol: true, initial_quantity: 36, expiration_date: "2027-06-30T00:00:00Z" }
              as: DistrictHealthAdmin
              captures: { alb_lot_id: $.data.id }
            - call: "GET /health-office/schools/${sch_id}"
              payload: {}
              as: DistrictHealthAdmin
              captures: { status_before_epi: $.data.stock_protocol_status }
          trigger:
            - call: "POST /health-office/medication-stock-lots"
              payload: { school_id: "${sch_id}", medication_code: "EPINEPHRINE", lot_number: "EPI-NMB-1", is_stock_protocol: true, initial_quantity: 10, expiration_date: "2027-06-30T00:00:00Z" }
              as: DistrictHealthAdmin
              captures: { epi_lot_id: $.data.id, epi_dos_in_create_response: $.data.days_of_supply }
            - call: "GET /health-office/schools/${sch_id}"
              payload: {}
              as: DistrictHealthAdmin
              captures: { status_after_epi: $.data.stock_protocol_status, epi_dos_school: $.data.epinephrine_days_of_supply }
          assert:
            - "Before the trigger: School.${sch_id}.stock_protocol_status == DEPLETED (zero epinephrine units)"
            - "The create response itself carries MedicationStockLot.${epi_lot_id}.days_of_supply == 33.33"
            - "The create response itself carries MedicationStockLot.${epi_lot_id}.status == AVAILABLE and received_total == 10"
            - "Immediately after, with no checkpoint call: School.${sch_id}.epinephrine_days_of_supply == 33.33"
            - "Immediately after, with no checkpoint call: School.${sch_id}.albuterol_days_of_supply == 30.0"
            - "Immediately after, with no checkpoint call: School.${sch_id}.stock_protocol_status == READY"
            - "Immediately after, with no checkpoint call: School.${sch_id}.coverage_posture == FULL"

      - name: cascade_visibility_without_a_second_request
        claim_type: immediate
        grounds: [complexity_profile.consistency_model]
        excluded_because:
          difficulty_instance: transitive_cascade / action_plan_supersede_four_hop_cascade
          rationale: "That §1.8 instance asserts the entire four-hop cascade is observable immediately after the single approving request, with no intervening checkpoint or re-read."

  - section: errors
    instances:

      - name: error_duplicate_building_code_on_school_create
        claim_type: violation_to_error
        grounds: ["errors[ERR_DUPLICATE_BUILDING_CODE]", "validations[priority=40]"]
        distinguishing_aspect: "building_code is unique across all School rows, so a second POST /health-office/schools reusing DUP75 returns 409 ERR_DUPLICATE_BUILDING_CODE and no second School exists."
        test_recipe:
          setup: ["One School already registered with building_code DUP75."]
          setup_api_calls:
            - call: "POST /health-office/schools"
              payload: { name: "Dupont Elementary", building_code: "DUP75", cot_capacity: 2, emergency_protocol_enabled: true }
              as: DistrictHealthAdmin
              captures: { sch_id: $.data.id }
          trigger:
            - call: "POST /health-office/schools"
              payload: { name: "Dupont Annex", building_code: "DUP75", cot_capacity: 3, emergency_protocol_enabled: false }
              as: DistrictHealthAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_DUPLICATE_BUILDING_CODE"
            - "School.${sch_id}.cot_capacity == 2 and School.${sch_id}.emergency_protocol_enabled == true"

      - name: error_lot_expired_on_create_with_past_expiration_date
        claim_type: violation_to_error
        grounds: ["errors[ERR_LOT_EXPIRED]", "validations[priority=39]", "entities.MedicationStockLot.fields.expiration_date"]
        distinguishing_aspect: "A lot whose expiration_date is at or before the logical clock (2026-07-01 against the 2026-08-01 default) is refused at creation with 409 ERR_LOT_EXPIRED, so the school's days of supply stay at 0.00."
        test_recipe:
          setup: ["One School with no lots; logical clock left at its 2026-08-01T00:00:00Z default."]
          setup_api_calls:
            - call: "POST /health-office/schools"
              payload: { name: "Ledger Elementary", building_code: "LDG76", cot_capacity: 2, emergency_protocol_enabled: true }
              as: DistrictHealthAdmin
              captures: { sch_id: $.data.id }
          trigger:
            - call: "POST /health-office/medication-stock-lots"
              payload: { school_id: "${sch_id}", medication_code: "EPINEPHRINE", lot_number: "EPI-OLD-1", is_stock_protocol: true, initial_quantity: 8, expiration_date: "2026-07-01T00:00:00Z" }
              as: DistrictHealthAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_LOT_EXPIRED"
            - "School.${sch_id}.epinephrine_days_of_supply == 0.0"
            - "GET /health-office/medication-stock-lots?school_id=${sch_id} returns total_count == 0"

      - name: error_lot_invalid_state_on_restore_of_an_available_lot
        claim_type: violation_to_error
        grounds: ["errors[ERR_LOT_INVALID_STATE]", "validations[priority=11]", "state_machines.MedicationStockLot.QUARANTINED_to_AVAILABLE"]
        distinguishing_aspect: "RESTORE requires status QUARANTINED; issuing it against an AVAILABLE lot returns 409 ERR_LOT_INVALID_STATE and leaves the lot's version and counters untouched."
        test_recipe:
          setup: ["One School with one AVAILABLE stock-protocol EPINEPHRINE lot of 6 units, version 1."]
          setup_api_calls:
            - call: "POST /health-office/schools"
              payload: { name: "Marden Elementary", building_code: "MRD77", cot_capacity: 2, emergency_protocol_enabled: true }
              as: DistrictHealthAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /health-office/medication-stock-lots"
              payload: { school_id: "${sch_id}", medication_code: "EPINEPHRINE", lot_number: "EPI-MRD-1", is_stock_protocol: true, initial_quantity: 6, expiration_date: "2027-06-30T00:00:00Z" }
              as: DistrictHealthAdmin
              captures: { lot_id: $.data.id, lot_v: $.data.version }
          trigger:
            - call: "POST /health-office/medication-stock-lots/${lot_id}/inventory-action"
              payload: { action: "RESTORE", expected_lot_version: "${lot_v}" }
              as: DistrictHealthAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_LOT_INVALID_STATE"
            - "MedicationStockLot.${lot_id}.status == AVAILABLE"
            - "MedicationStockLot.${lot_id}.version == 1"
            - "MedicationStockLot.${lot_id}.quantity_on_hand == 6 and received_total == 6"

      - name: error_insufficient_stock_on_discard_below_zero
        claim_type: violation_to_error
        grounds: ["errors[ERR_INSUFFICIENT_STOCK]", "validations[priority=49]", "calculations.lot_unit_conservation"]
        distinguishing_aspect: "A DISCARD of 10 units against a lot holding 5 would drive quantity_on_hand below zero, so it is refused with 409 ERR_INSUFFICIENT_STOCK and every conservation counter stays put."
        test_recipe:
          setup: ["One School with one AVAILABLE stock-protocol ALBUTEROL lot of 5 units."]
          setup_api_calls:
            - call: "POST /health-office/schools"
              payload: { name: "Norwood Elementary", building_code: "NRW78", cot_capacity: 2, emergency_protocol_enabled: true }
              as: DistrictHealthAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /health-office/medication-stock-lots"
              payload: { school_id: "${sch_id}", medication_code: "ALBUTEROL", lot_number: "ALB-NRW-1", is_stock_protocol: true, initial_quantity: 5, expiration_date: "2027-06-30T00:00:00Z" }
              as: DistrictHealthAdmin
              captures: { lot_id: $.data.id, lot_v: $.data.version }
          trigger:
            - call: "POST /health-office/medication-stock-lots/${lot_id}/inventory-action"
              payload: { action: "DISCARD", expected_lot_version: "${lot_v}", units: 10, reason_code: "Attempted over-discard" }
              as: DistrictHealthAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_INSUFFICIENT_STOCK"
            - "MedicationStockLot.${lot_id}.quantity_on_hand == 5"
            - "MedicationStockLot.${lot_id}.quantity_wasted == 0"
            - "MedicationStockLot.${lot_id}.received_total == 5"
            - "MedicationStockLot.${lot_id}.version == 1"
            - "MedicationStockLot.${lot_id}.status == AVAILABLE"

      - name: error_disclosure_invalid_state_on_release_of_a_draft_request
        claim_type: violation_to_error
        grounds: ["errors[ERR_DISCLOSURE_INVALID_STATE]", "validations[priority=13]", "state_machines.DisclosureRequest.APPROVED_to_RELEASED"]
        distinguishing_aspect: "release requires status APPROVED; calling it on a DRAFT request returns 409 ERR_DISCLOSURE_INVALID_STATE and leaves released_at null and release_package_item_count 0."
        test_recipe:
          setup: ["One School, one ENROLLED student and one DisclosureRequest still in DRAFT."]
          setup_api_calls:
