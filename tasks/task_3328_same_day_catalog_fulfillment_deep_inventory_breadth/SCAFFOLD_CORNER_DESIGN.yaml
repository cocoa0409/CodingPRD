  # ===========================================================================
  - section: errors
    instances:

      - name: terminal_order_refuses_further_mutation_with_already_terminal
        claim_type: Violation to Error
        grounds:
          - errors.ERR_ALREADY_TERMINAL
          - validations[priority=5]
          - state_machines.CatalogOrder
        distinguishing_aspect: "The terminal-state gate names its own code: once an order has reached the terminal CANCELLED state, a further cancel answers 409 ERR_ALREADY_TERMINAL rather than the generic ERR_INVALID_STATE, so a client can distinguish 'wrong state' from 'no state left'."
        test_recipe:
          setup:
            - "Logical clock 2026-09-14T08:00:00Z. One account, one curated item, one order of 1 unit created and released and then cancelled."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { account_name: "Riverside Machine", delivery_zone: "America/New_York", home_region: "NORTHEAST" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "AT-1001", description: "Already terminal item", material_spec: "steel", long_tail: false, unit_price_cents: 1500, unit_weight_kg: 0.10, curation_bundle_size: 4, curated_dimension_json: { nominal_length_mm: 10, nominal_width_mm: 10, nominal_height_mm: 10, drawing_revision: 1 } }
              as: CatalogCurator
              captures: { item_id: $.data.id }
            - call: "POST /items/${item_id}/attributes"
              payload: { attribute_name: "Grade", attribute_value: "8.8", unit_of_measure: "n/a" }
              as: CatalogCurator
            - call: "POST /curation-reviews"
              payload: { item_ids: ["${item_id}"] }
              as: CatalogCurator
            - call: "POST /orders"
              payload: { account_id: "${acct_id}", lines: [{ item_id: "${item_id}", quantity: 1 }] }
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/release"
              payload: {}
              as: CustomerAccount
              as_user_id: "${acct_id}"
            - call: "POST /orders/${order_id}/cancel"
              payload: {}
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { order_v_terminal: $.data.version }
          trigger:
            - call: "POST /orders/${order_id}/cancel"
              payload: {}
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_ALREADY_TERMINAL"
            - "CatalogOrder.${order_id}.order_status == CANCELLED both before and after the rejected call"
            - "CatalogOrder.${order_id}.version == ${order_v_terminal}, so no mutation was recorded"

      - name: unknown_line_id_returns_line_not_found
        claim_type: Violation to Error
        grounds:
          - errors.ERR_LINE_NOT_FOUND
          - validations[priority=3]
          - endpoints.POST_/orders/{id}/lines/{line_id}/pick
        distinguishing_aspect: "Existence is resolved left to right down the path, so a valid order id paired with an unresolvable line id yields 404 ERR_LINE_NOT_FOUND — not the order code, which would be the answer if the FIRST path segment had failed."
        test_recipe:
          setup:
            - "Logical clock 2026-09-14T08:00:00Z. One DC, one account, one curated item, BOS stock of 5 units, one order of 1 unit released and allocated."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /distribution-centers"
              payload: { code: "BOS", region: "NORTHEAST", local_zone: "America/New_York", local_cutoff_time: "06:00:00", utc_offset_minutes: -240, inbound_capacity_units: 900, transit_seconds: 86400 }
              as: PlatformAdmin
              captures: { dc_id: $.data.id }
            - call: "POST /accounts"
              payload: { account_name: "Riverside Machine", delivery_zone: "America/New_York", home_region: "NORTHEAST" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "LN-1001", description: "Line not found item", material_spec: "steel", long_tail: false, unit_price_cents: 1500, unit_weight_kg: 0.10, curation_bundle_size: 4, curated_dimension_json: { nominal_length_mm: 10, nominal_width_mm: 10, nominal_height_mm: 10, drawing_revision: 1 } }
              as: CatalogCurator
              captures: { item_id: $.data.id }
            - call: "POST /items/${item_id}/attributes"
              payload: { attribute_name: "Grade", attribute_value: "8.8", unit_of_measure: "n/a" }
              as: CatalogCurator
            - call: "POST /curation-reviews"
              payload: { item_ids: ["${item_id}"] }
              as: CatalogCurator
            - call: "POST /stock"
              payload: { item_id: "${item_id}", dc_id: "${dc_id}", account_id: "${acct_id}", on_hand_units: 5, daily_demand_units: 1, inbound_daily_units: 1 }
              as: DCManager
            - call: "POST /orders"
              payload: { account_id: "${acct_id}", lines: [{ item_id: "${item_id}", quantity: 1 }] }
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/release"
              payload: {}
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { order_v: $.data.version }
            - call: "POST /orders/${order_id}/allocate"
              payload: { expected_order_version: "${order_v}" }
              as: CustomerAccount
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /orders/${order_id}/lines/00000000-0000-4000-8000-000000000099/pick"
              payload: { requested_units: 1 }
              as: WarehousePicker
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_LINE_NOT_FOUND"
            - "error_id != ERR_ORDER_NOT_FOUND, so the resolvable first path segment did not produce the error"
            - "GET /orders/${order_id}/lines still returns exactly 1 row and its line_status is still ALLOCATED"

      - name: return_receive_without_removed_part_numbers_is_refused
        claim_type: Violation to Error
        grounds:
          - errors.ERR_RETURN_PART_NUMBER_REQUIRED
          - validations[priority=14]
          - state_machines.ReturnAuthorization.APPROVED_to_RECEIVED
        distinguishing_aspect: "The receive action requires a traceability map: an APPROVED return submitted with an empty removed_manufacturer_part_numbers object answers 422 ERR_RETURN_PART_NUMBER_REQUIRED and the authorization stays APPROVED, so the restock mix is never applied."
        test_recipe:
          setup:
            - "Logical clock 2026-09-14T10:05:00Z (Monday), DC BOS local 06:05 after its cutoff."
            - "One account, one curated item priced 2000 cents, BOS stock of 10 units; one order of 5 units picked in full and cut off; one return for 5 units approved."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T10:05:00Z" }
              as: PlatformAdmin
            - call: "POST /distribution-centers"
              payload: { code: "BOS", region: "NORTHEAST", local_zone: "America/New_York", local_cutoff_time: "06:00:00", utc_offset_minutes: -240, inbound_capacity_units: 900, transit_seconds: 86400 }
              as: PlatformAdmin
              captures: { dc_id: $.data.id }
            - call: "POST /accounts"
              payload: { account_name: "Riverside Machine", delivery_zone: "America/New_York", home_region: "NORTHEAST" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "RN-1001", description: "Return traceability item", material_spec: "steel", long_tail: false, unit_price_cents: 2000, unit_weight_kg: 0.10, curation_bundle_size: 8, curated_dimension_json: { nominal_length_mm: 10, nominal_width_mm: 10, nominal_height_mm: 10, drawing_revision: 1 } }
              as: CatalogCurator
              captures: { item_id: $.data.id }
            - call: "POST /items/${item_id}/attributes"
              payload: { attribute_name: "Grade", attribute_value: "8.8", unit_of_measure: "n/a" }
              as: CatalogCurator
            - call: "POST /curation-reviews"
              payload: { item_ids: ["${item_id}"] }
              as: CatalogCurator
            - call: "POST /stock"
              payload: { item_id: "${item_id}", dc_id: "${dc_id}", account_id: "${acct_id}", on_hand_units: 10, daily_demand_units: 1, inbound_daily_units: 1 }
              as: DCManager
              captures: { stock_id: $.data.id }
            - call: "POST /orders"
              payload: { account_id: "${acct_id}", lines: [{ item_id: "${item_id}", quantity: 5 }] }
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/release"
              payload: {}
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { order_v: $.data.version }
            - call: "POST /orders/${order_id}/allocate"
              payload: { expected_order_version: "${order_v}" }
              as: CustomerAccount
              as_user_id: "${acct_id}"
            - call: "GET /orders/${order_id}/lines"
              payload: { limit: 10, offset: 0 }
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { line_id: "$.data[0].id" }
            - call: "POST /orders/${order_id}/lines/${line_id}/pick"
              payload: { requested_units: 5 }
              as: WarehousePicker
            - call: "POST /orders/${order_id}/lines/${line_id}/pick_complete"
              payload: { actual_units: 5 }
              as: WarehousePicker
            - call: "GET /orders/${order_id}"
              payload: {}
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { order_v_ready: $.data.version }
            - call: "POST /orders/${order_id}/confirm_cutoff"
              payload: { expected_order_version: "${order_v_ready}", service_level: "GROUND" }
              as: DCManager
            - call: "POST /returns"
              payload: { order_id: "${order_id}", lines: [{ line_id: "${line_id}", requested_return_units: 5 }] }
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /returns/${ret_id}/approve"
              payload: {}
              as: DCManager
          trigger:
            - call: "POST /returns/${ret_id}/receive"
              payload: { removed_manufacturer_part_numbers: {} }
              as: DCManager
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_RETURN_PART_NUMBER_REQUIRED"
            - "ReturnAuthorization.${ret_id}.return_status is still APPROVED"
            - "InventoriedStock.${stock_id}.on_hand_units is still 5, so nothing was restocked"
            - "the same receive with a populated removed_manufacturer_part_numbers map returns 200 and moves the authorization to RECEIVED"
