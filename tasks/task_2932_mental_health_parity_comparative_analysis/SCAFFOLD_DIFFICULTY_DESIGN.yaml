              payload: { outcome: "VIOLATION", rationale: "Prior authorization is imposed on MH/SUD outpatient visits only and denies at three times the medical/surgical rate.", expected_plan_year_version: "${py_v}" }
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
          assert:
            - "NqtlItem.${item_id}.status == VIOLATION and NqtlItem.${item_id}.determination_recorded_by_user_id == user-officer-01"
            - "NqtlItem.${item_id}.stringency_in_operation_index == 10.00 and stringency_flag == true"
            - "GET /parity/nqtl-items/${item_id}/participant-notices returns exactly 1 row"
            - "that ParticipantNotice.notice_type == VIOLATION_DISCLOSURE and source == DETERMINATION_CASCADE"
            - "that ParticipantNotice.recipient_count == 1200 (copied from covered_participant_count)"
            - "PlanYear.${py_id}.open_violation_count == 1 and PlanYear.${py_id}.notified_violation_count == 1"
            - "PlanYear.${py_id}.compliance_posture == VIOLATION"
            - "PlanYear.${py_id}.status == REMEDIATION"
            - "a subsequent POST /parity/plan-years/${py_id}/classifications -> ERR_PLAN_YEAR_NOT_OPEN, proving level 4 of the cascade actually landed"
            - "PlanYear.${py_id}.remediation_liability_cents == 0 (no corrective plan is approved yet)"

      - name: breach_declaration_cascades_three_levels_to_plan_year_posture
        grounds:
          - state_machines.VendorDataRequest.escalation_NOTICE_SENT_to_BREACH_DECLARED
          - calculations.administrator_cooperation_score
          - calculations.plan_year_compliance_posture
          - entities.Administrator.fields.cooperation_status
          - validations.priority_30_ERR_NOT_YET_OVERDUE
        distinguishing_aspect: |
          A different trigger (vendor escalation, not a compliance determination) and depth 3:
          escalate -> (1) VendorDataRequest.escalation_status BREACH_DECLARED -> (2) Administrator
          breach_count 1 and cooperation_score 60.00 -> cooperation_status DELINQUENT -> (3) every
          PlanYear owned by that administrator recomputes compliance_posture to AT_RISK. The chain
          crosses two aggregates the trigger never names and, unlike the determination cascade,
          stops short of changing PlanYear.status.
        test_recipe:
          setup:
            - "One Administrator with contractual_production_days 45 and one OPEN PlanYear with no NqtlItem at all, so the initial posture is COMPLIANT."
            - "One VendorDataRequest issued at the default clock 2026-08-01T00:00:00Z (due_at 2026-09-15T00:00:00.000Z), left OPEN."
            - "The clock is advanced past due_at and then past due_at + BREACH_GRACE_DAYS (7)."
          setup_api_calls:
            - call: "POST /parity/administrators"
              payload: { legal_name: "Northwind Benefit Administrators", contact_email: "ops@northwind.example", contractual_production_days: 45 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { adm_id: $.data.id }
            - call: "POST /parity/plan-years"
              payload: { plan_name: "Acme Group Health Plan", plan_year_label: "2026", administrator_id: "${adm_id}", funding_arrangement: "SELF_FUNDED", covered_participant_count: 1200, remediation_liability_cap_cents: 5000000 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { py_id: $.data.id }
            - call: "POST /parity/vendor-requests"
              payload: { administrator_id: "${adm_id}", plan_year_id: "${py_id}", requested_item_count: 1, requested_submission_types: ["DENIAL_RATES"] }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { vr_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-16T00:00:00Z" }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
            - call: "POST /parity/vendor-requests/${vr_id}/escalate"
              payload: {}
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-23T00:00:01Z" }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
          trigger:
            - call: "POST /parity/vendor-requests/${vr_id}/escalate"
              payload: {}
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { esc_final: $.data.escalation_status }
          assert:
            - "before the trigger: Administrator.${adm_id}.cooperation_score == 85.00 (one late request, no breach) and cooperation_status == COOPERATIVE and PlanYear.${py_id}.compliance_posture == COMPLIANT"
            - "VendorDataRequest.${vr_id}.escalation_status == BREACH_DECLARED and fulfillment_status is still OPEN"
            - "Administrator.${adm_id}.breach_count == 1 and Administrator.${adm_id}.late_request_count == 1"
            - "Administrator.${adm_id}.cooperation_score == 60.00 (100 - 15 - 25) and cooperation_status == DELINQUENT"
            - "Administrator.${adm_id}.regulatory_basis_cooperation_score == 60.00 (the single request is late on both deadlines)"
            - "PlanYear.${py_id}.compliance_posture == AT_RISK (level 3 of the cascade, reached through an entity the escalate call never named)"
            - "PlanYear.${py_id}.status == OPEN (the AT_RISK clause of the ladder does not move status; only VIOLATION does)"
            - "PlanYear.${py_id}.open_violation_count == 0 and failing_parity_test_count == 0"

  # =========================================================================
  # §0.5 Rule 5 — Priority-pair validation conflicts
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_priority_15_beats_temporal_priority_28_on_classification_create
        grounds:
          - validations.priority_15_ERR_PLAN_YEAR_NOT_OPEN
          - validations.priority_28_ERR_MEASUREMENT_PERIOD_OVERLAP
          - state_machines.PlanYear.OPEN_to_UNDER_REGULATOR_REVIEW
        distinguishing_aspect: |
          Category pair state (priority 15) vs business_temporal (priority 28) on
          POST /parity/plan-years/{id}/classifications. The identical payload violates both rules, and
          a control run on a still-OPEN plan year proves the temporal rule really would fire, so an
          implementation that checks overlap first is caught rather than merely unobserved.
        test_recipe:
          setup:
            - "Two OPEN PlanYears under one Administrator; each already carries an OUTPATIENT / IN_NETWORK / OFFICE_VISITS classification for 2026-01-01..2026-06-30."
            - "The second plan year is then moved to UNDER_REGULATOR_REVIEW by opening a RegulatorRequest against it."
          setup_api_calls:
            - call: "POST /parity/administrators"
              payload: { legal_name: "Northwind Benefit Administrators", contact_email: "ops@northwind.example", contractual_production_days: 45 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { adm_id: $.data.id }
            - call: "POST /parity/plan-years"
              payload: { plan_name: "Acme Group Health Plan", plan_year_label: "2026-CONTROL", administrator_id: "${adm_id}", funding_arrangement: "SELF_FUNDED", covered_participant_count: 1200, remediation_liability_cap_cents: 5000000 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { py_ctl_id: $.data.id }
            - call: "POST /parity/plan-years/${py_ctl_id}/classifications"
              payload: { benefit_category: "OUTPATIENT", network_tier: "IN_NETWORK", sub_classification: "OFFICE_VISITS", measurement_period_start: "2026-01-01", measurement_period_end: "2026-06-30", mh_su_benefits_covered: true }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { cls_ctl_id: $.data.id }
            - call: "POST /parity/plan-years"
              payload: { plan_name: "Acme Group Health Plan", plan_year_label: "2026-FROZEN", administrator_id: "${adm_id}", funding_arrangement: "SELF_FUNDED", covered_participant_count: 1200, remediation_liability_cap_cents: 5000000 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { py_id: $.data.id }
            - call: "POST /parity/plan-years/${py_id}/classifications"
              payload: { benefit_category: "OUTPATIENT", network_tier: "IN_NETWORK", sub_classification: "OFFICE_VISITS", measurement_period_start: "2026-01-01", measurement_period_end: "2026-06-30", mh_su_benefits_covered: true }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { cls_id: $.data.id }
            - call: "POST /parity/regulator-requests"
              payload: { plan_year_id: "${py_id}", requested_nqtl_types: ["PRIOR_AUTHORIZATION"], request_reference: "DOL-EBSA-2026-00512" }
              as: Regulator
              as_user_id: "user-regulator-01"
              captures: { rr_id: $.data.id }
          trigger:
            - call: "POST /parity/plan-years/${py_ctl_id}/classifications"
              payload: { benefit_category: "OUTPATIENT", network_tier: "IN_NETWORK", sub_classification: "OFFICE_VISITS", measurement_period_start: "2026-06-01", measurement_period_end: "2026-08-31", mh_su_benefits_covered: true }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
            - call: "POST /parity/plan-years/${py_id}/classifications"
              payload: { benefit_category: "OUTPATIENT", network_tier: "IN_NETWORK", sub_classification: "OFFICE_VISITS", measurement_period_start: "2026-06-01", measurement_period_end: "2026-08-31", mh_su_benefits_covered: true }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
          assert:
            - "control call on ${py_ctl_id} -> 409 ERR_MEASUREMENT_PERIOD_OVERLAP (the temporal rule is genuinely violated by this payload)"
            - "same payload on the frozen ${py_id} -> 409 ERR_PLAN_YEAR_NOT_OPEN, not ERR_MEASUREMENT_PERIOD_OVERLAP"
            - "PlanYear.${py_id}.status == UNDER_REGULATOR_REVIEW and RegulatorRequest.${rr_id}.status == OPEN"
            - "GET /parity/plan-years/${py_id}/classifications still returns exactly 1 row"

      - name: safety_priority_19_beats_fiscal_priority_34_on_corrective_plan_decision
        grounds:
          - validations.priority_19_ERR_APPROVER_IS_DETERMINER
          - validations.priority_34_ERR_LIABILITY_CAP_EXCEEDED
          - calculations.remediation_liability_cents
        distinguishing_aspect: |
          A different category pair — business_safety (19) vs business_fiscal (34) — on a different
          endpoint, POST /parity/corrective-action-plans/{id}/decision. Both rules are violated by the
          same request; retrying as an independent officer strips away the safety failure and exposes
          the fiscal one, so the pair is observed in both orders.
        test_recipe:
          setup:
            - "One Administrator, one OPEN PlanYear whose remediation_liability_cap_cents is only 100000 cents."
            - "One PRIOR_AUTHORIZATION NqtlItem applied_to MENTAL_HEALTH_SUD_ONLY driven to VIOLATION by user-officer-01 on a disparity_ratio 3.0000 submission."
            - "One DRAFT CorrectiveActionPlan, DESIGN_CHANGE, 1327 claims x 4990 cents -> reprocessing_liability_cents 1655433, far above the cap."
          setup_api_calls:
            - call: "POST /parity/administrators"
              payload: { legal_name: "Northwind Benefit Administrators", contact_email: "ops@northwind.example", contractual_production_days: 45 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { adm_id: $.data.id }
            - call: "POST /parity/plan-years"
              payload: { plan_name: "Acme Group Health Plan", plan_year_label: "2026", administrator_id: "${adm_id}", funding_arrangement: "SELF_FUNDED", covered_participant_count: 1200, remediation_liability_cap_cents: 100000 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { py_id: $.data.id }
            - call: "POST /parity/plan-years/${py_id}/classifications"
              payload: { benefit_category: "OUTPATIENT", network_tier: "IN_NETWORK", sub_classification: "OFFICE_VISITS", measurement_period_start: "2026-01-01", measurement_period_end: "2026-06-30", mh_su_benefits_covered: true }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { cls_id: $.data.id }
            - call: "POST /parity/nqtl-items"
              payload: { plan_year_id: "${py_id}", classification_id: "${cls_id}", nqtl_type: "PRIOR_AUTHORIZATION", applied_to: "MENTAL_HEALTH_SUD_ONLY", description: "Prior authorization required for outpatient MH/SUD office visits only." }
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
              captures: { item_id: $.data.id }
            - call: "POST /parity/vendor-requests"
              payload: { administrator_id: "${adm_id}", plan_year_id: "${py_id}", nqtl_item_id: "${item_id}", requested_item_count: 1, requested_submission_types: ["DENIAL_RATES"] }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { vr_id: $.data.id }
            - call: "POST /parity/vendor-requests/${vr_id}/data-submissions"
              payload: { classification_id: "${cls_id}", submission_type: "DENIAL_RATES", mh_denials: 300, mh_adjudicated_claims: 1000, ms_denials: 100, ms_adjudicated_claims: 1000 }
              as: Administrator
              as_user_id: "${adm_id}"
              captures: { sub_id: $.data.id }
            - call: "GET /parity/nqtl-items/${item_id}"
              payload: {}
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { item_v: $.data.version }
            - call: "POST /parity/comparative-analyses"
              payload: { nqtl_item_id: "${item_id}", factor_count: 2, evidentiary_standard_count: 1, stringency_written_finding: "MORE_STRINGENT_MH", stringency_operation_finding: "MORE_STRINGENT_MH", expected_nqtl_item_version: "${item_v}" }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { ca_id: $.data.id }
            - call: "POST /parity/comparative-analyses/${ca_id}/submit"
              payload: {}
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
            - call: "GET /parity/plan-years/${py_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
              captures: { py_v: $.data.version }
            - call: "POST /parity/nqtl-items/${item_id}/determinations"
              payload: { outcome: "VIOLATION", rationale: "Prior authorization is applied to MH/SUD benefits only and denies at three times the comparable rate.", expected_plan_year_version: "${py_v}" }
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
            - call: "POST /parity/corrective-action-plans"
              payload: { nqtl_item_id: "${item_id}", remedy_type: "DESIGN_CHANGE", affected_claims_count: 1327, average_claim_cents: 4990, target_completion_date: "2026-12-31" }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { cap_id: $.data.id }
          trigger:
            - call: "POST /parity/corrective-action-plans/${cap_id}/decision"
              payload: { outcome: "APPROVED", decision_note: "Approved by the officer who recorded the determination." }
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
            - call: "POST /parity/corrective-action-plans/${cap_id}/decision"
              payload: { outcome: "APPROVED", decision_note: "Approved by an independent officer." }
              as: ComplianceOfficer
              as_user_id: "user-officer-02"
          assert:
            - "first decision call -> 409 ERR_APPROVER_IS_DETERMINER, not ERR_LIABILITY_CAP_EXCEEDED"
            - "second decision call (independent officer) -> 409 ERR_LIABILITY_CAP_EXCEEDED, proving the fiscal rule was violated all along"
            - "CorrectiveActionPlan.${cap_id}.reprocessing_liability_cents == 1655433 and status is still DRAFT"
            - "CorrectiveActionPlan.${cap_id}.approved_by_user_id == null"
            - "PlanYear.${py_id}.remediation_liability_cents == 0 (a refused approval contributes nothing)"

  # =========================================================================
  # §0.5 Rule 6 — Boundary and precision checks
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: substantially_all_ratio_exactly_two_thirds_versus_one_cent_below
        grounds:
          - calculations.qtl_substantially_all_ratio
          - calculations.qtl_predominant_level
          - calculations.mh_level_under_test
          - endpoints.POST_parity_classifications_id_parity_tests
        distinguishing_aspect: |
          Metric: the substantially-all ratio at the two-thirds boundary, on
          POST /parity/classifications/{id}/parity-tests. Endpoint of the interval: inclusive — exactly
          two-thirds satisfies the standard. One extra cent in the denominator flips
          substantially_all_met to false even though the 6-place display ratio moves only from
          0.666667 to 0.666666, so an implementation that thresholds on the rounded ratio passes the
          first case and fails the second.
        test_recipe:
          setup:
            - "One Administrator and one OPEN PlanYear."
            - "cls_a: OUTPATIENT / IN_NETWORK / OFFICE_VISITS with MEDICAL_SURGICAL COPAY rows level 20 -> 2000000 cents and level 0 -> 1000000 cents (subject 2000000, total 3000000 = exactly two thirds), plus one MENTAL_HEALTH_SUD COPAY row at level 20."
            - "cls_b: OUTPATIENT / OUT_OF_NETWORK / OFFICE_VISITS with the same rows except level 0 -> 1000001 cents (total 3000001, one cent past the boundary)."
            - "The two classifications differ in network_tier, so the measurement-period overlap rule does not apply between them."
          setup_api_calls:
            - call: "POST /parity/administrators"
              payload: { legal_name: "Northwind Benefit Administrators", contact_email: "ops@northwind.example", contractual_production_days: 45 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { adm_id: $.data.id }
            - call: "POST /parity/plan-years"
              payload: { plan_name: "Acme Group Health Plan", plan_year_label: "2026", administrator_id: "${adm_id}", funding_arrangement: "SELF_FUNDED", covered_participant_count: 1200, remediation_liability_cap_cents: 5000000 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { py_id: $.data.id }
            - call: "POST /parity/plan-years/${py_id}/classifications"
              payload: { benefit_category: "OUTPATIENT", network_tier: "IN_NETWORK", sub_classification: "OFFICE_VISITS", measurement_period_start: "2026-01-01", measurement_period_end: "2026-06-30", mh_su_benefits_covered: true }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { cls_a_id: $.data.id }
            - call: "POST /parity/plan-years/${py_id}/classifications"
              payload: { benefit_category: "OUTPATIENT", network_tier: "OUT_OF_NETWORK", sub_classification: "OFFICE_VISITS", measurement_period_start: "2026-01-01", measurement_period_end: "2026-06-30", mh_su_benefits_covered: true }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { cls_b_id: $.data.id }
            - call: "POST /parity/classifications/${cls_a_id}/treatment-limitations"
              payload: { limitation_type: "COPAY", benefit_side: "MEDICAL_SURGICAL", level_value: 20, projected_plan_payments_cents: 2000000, projected_claims_count: 400 }
              as: Administrator
              as_user_id: "${adm_id}"
              captures: { tl_a1_id: $.data.id }
            - call: "POST /parity/classifications/${cls_a_id}/treatment-limitations"
              payload: { limitation_type: "COPAY", benefit_side: "MEDICAL_SURGICAL", level_value: 0, projected_plan_payments_cents: 1000000, projected_claims_count: 200 }
              as: Administrator
              as_user_id: "${adm_id}"
              captures: { tl_a2_id: $.data.id }
            - call: "POST /parity/classifications/${cls_a_id}/treatment-limitations"
              payload: { limitation_type: "COPAY", benefit_side: "MENTAL_HEALTH_SUD", level_value: 20, projected_plan_payments_cents: 900000, projected_claims_count: 120 }
              as: Administrator
              as_user_id: "${adm_id}"
              captures: { tl_a3_id: $.data.id }
            - call: "POST /parity/classifications/${cls_b_id}/treatment-limitations"
              payload: { limitation_type: "COPAY", benefit_side: "MEDICAL_SURGICAL", level_value: 20, projected_plan_payments_cents: 2000000, projected_claims_count: 400 }
              as: Administrator
              as_user_id: "${adm_id}"
              captures: { tl_b1_id: $.data.id }
            - call: "POST /parity/classifications/${cls_b_id}/treatment-limitations"
              payload: { limitation_type: "COPAY", benefit_side: "MEDICAL_SURGICAL", level_value: 0, projected_plan_payments_cents: 1000001, projected_claims_count: 200 }
              as: Administrator
              as_user_id: "${adm_id}"
              captures: { tl_b2_id: $.data.id }
            - call: "POST /parity/classifications/${cls_b_id}/treatment-limitations"
              payload: { limitation_type: "COPAY", benefit_side: "MENTAL_HEALTH_SUD", level_value: 20, projected_plan_payments_cents: 900000, projected_claims_count: 120 }
              as: Administrator
              as_user_id: "${adm_id}"
              captures: { tl_b3_id: $.data.id }
          trigger:
            - call: "POST /parity/classifications/${cls_a_id}/parity-tests"
              payload: { limitation_type: "COPAY", basis: "PLAN_PAYMENTS" }
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
              captures: { pt_a_id: $.data.id, met_a: $.data.substantially_all_met }
            - call: "POST /parity/classifications/${cls_b_id}/parity-tests"
              payload: { limitation_type: "COPAY", basis: "PLAN_PAYMENTS" }
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
              captures: { pt_b_id: $.data.id, met_b: $.data.substantially_all_met }
          assert:
            - "ParityTest.${pt_a_id}.total_ms_payments_cents == 3000000 and subject_payments_cents == 2000000"
            - "ParityTest.${pt_a_id}.substantially_all_ratio == 0.666667 and substantially_all_met == true (2000000*3 == 3000000*2, the inclusive endpoint)"
            - "ParityTest.${pt_a_id}.predominant_level == 20 and mh_level_value == 20 and result == PASS"
            - "ParityTest.${pt_b_id}.total_ms_payments_cents == 3000001 and subject_payments_cents == 2000000"
            - "ParityTest.${pt_b_id}.substantially_all_ratio == 0.666666 and substantially_all_met == false (6000000 < 6000002)"
            - "ParityTest.${pt_b_id}.predominant_level == null and result == NOT_APPLICABLE"
            - "PlanYear.${py_id}.failing_parity_test_count == 0 (a NOT_APPLICABLE result is not a failure)"

      - name: disparity_ratio_exactly_at_threshold_versus_one_ten_thousandth_below
        grounds:
          - calculations.denial_rate_disparity_index
          - entities.DataSubmission.fields.as_applied_flag
          - endpoints.POST_parity_vendor_requests_id_data_submissions
        distinguishing_aspect: |
          A different metric (the as-applied denial-rate disparity ratio) at a different endpoint,
          POST /parity/vendor-requests/{id}/data-submissions, and a different interval endpoint:
          DISPARITY_THRESHOLD is inclusive, so exactly 2.0000 raises as_applied_flag while 1.9990 —
          one unit of the pinned 4-place precision below — does not.
        test_recipe:
          setup:
            - "One Administrator, one OPEN PlanYear, one classification."
            - "One VendorDataRequest with requested_item_count 2 and requested_submission_types [DENIAL_RATES]."
          setup_api_calls:
            - call: "POST /parity/administrators"
              payload: { legal_name: "Northwind Benefit Administrators", contact_email: "ops@northwind.example", contractual_production_days: 45 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { adm_id: $.data.id }
            - call: "POST /parity/plan-years"
              payload: { plan_name: "Acme Group Health Plan", plan_year_label: "2026", administrator_id: "${adm_id}", funding_arrangement: "SELF_FUNDED", covered_participant_count: 1200, remediation_liability_cap_cents: 5000000 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { py_id: $.data.id }
            - call: "POST /parity/plan-years/${py_id}/classifications"
              payload: { benefit_category: "OUTPATIENT", network_tier: "IN_NETWORK", sub_classification: "OFFICE_VISITS", measurement_period_start: "2026-01-01", measurement_period_end: "2026-06-30", mh_su_benefits_covered: true }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { cls_id: $.data.id }
            - call: "POST /parity/vendor-requests"
              payload: { administrator_id: "${adm_id}", plan_year_id: "${py_id}", requested_item_count: 2, requested_submission_types: ["DENIAL_RATES"] }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { vr_id: $.data.id }
          trigger:
            - call: "POST /parity/vendor-requests/${vr_id}/data-submissions"
              payload: { classification_id: "${cls_id}", submission_type: "DENIAL_RATES", mh_denials: 200, mh_adjudicated_claims: 1000, ms_denials: 100, ms_adjudicated_claims: 1000 }
              as: Administrator
              as_user_id: "${adm_id}"
              captures: { sub_at_id: $.data.id, flag_at: $.data.as_applied_flag }
            - call: "POST /parity/vendor-requests/${vr_id}/data-submissions"
              payload: { classification_id: "${cls_id}", submission_type: "DENIAL_RATES", mh_denials: 1999, mh_adjudicated_claims: 10000, ms_denials: 1000, ms_adjudicated_claims: 10000 }
              as: Administrator
              as_user_id: "${adm_id}"
              captures: { sub_below_id: $.data.id, flag_below: $.data.as_applied_flag }
          assert:
            - "DataSubmission.${sub_at_id}.disparity_ratio == 2.0000 and as_applied_flag == true (>= threshold, not > threshold)"
            - "DataSubmission.${sub_at_id}.mh_denial_rate == 0.200000 and ms_denial_rate == 0.100000"
            - "DataSubmission.${sub_below_id}.disparity_ratio == 1.9990 and as_applied_flag == false"
            - "DataSubmission.${sub_below_id}.mh_denial_rate == 0.199900 and ms_denial_rate == 0.100000"
            - "both rows have status == VALIDATED and rejection_reason == NONE"
            - "VendorDataRequest.${vr_id}.validated_submission_count == 2 and fulfillment_status == FULFILLED"

      - name: escalation_ripeness_at_exactly_due_at_versus_one_second_later
        grounds:
          - validations.priority_30_ERR_NOT_YET_OVERDUE
          - entities.VendorDataRequest.fields.due_at
          - entities.VendorDataRequest.fields.is_overdue
          - endpoints.POST_parity_vendor_requests_id_escalate
        distinguishing_aspect: |
          A third metric (the logical clock against a computed deadline instant) at a third endpoint,
          POST /parity/vendor-requests/{id}/escalate, with the opposite interval endpoint: the rule is
          strictly greater than, so the instant exactly equal to due_at is NOT yet overdue and one
          second later is. The boundary is tested on the instant, not on the calendar day.
        test_recipe:
          setup:
            - "One Administrator with contractual_production_days 45 and one OPEN PlanYear."
            - "One VendorDataRequest issued at the default clock 2026-08-01T00:00:00Z, so due_at is exactly 2026-09-15T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /parity/administrators"
              payload: { legal_name: "Northwind Benefit Administrators", contact_email: "ops@northwind.example", contractual_production_days: 45 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { adm_id: $.data.id }
            - call: "POST /parity/plan-years"
              payload: { plan_name: "Acme Group Health Plan", plan_year_label: "2026", administrator_id: "${adm_id}", funding_arrangement: "SELF_FUNDED", covered_participant_count: 1200, remediation_liability_cap_cents: 5000000 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { py_id: $.data.id }
            - call: "POST /parity/vendor-requests"
              payload: { administrator_id: "${adm_id}", plan_year_id: "${py_id}", requested_item_count: 1, requested_submission_types: ["DENIAL_RATES"] }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { vr_id: $.data.id, due_at: $.data.due_at }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
            - call: "POST /parity/vendor-requests/${vr_id}/escalate"
              payload: {}
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:01Z" }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
            - call: "POST /parity/vendor-requests/${vr_id}/escalate"
              payload: {}
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { esc_after: $.data.escalation_status }
          assert:
            - "VendorDataRequest.${vr_id}.issued_at == 2026-08-01T00:00:00.000Z and due_at == 2026-09-15T00:00:00.000Z"
            - "at clock == due_at: escalate -> 409 ERR_NOT_YET_OVERDUE and is_overdue == false and escalation_status is still NONE"
            - "at clock == due_at + 1 second: escalate -> 200 with escalation_status == NOTICE_SENT and is_overdue == true"
            - "Administrator.${adm_id}.late_request_count == 1 and cooperation_score == 85.00"
            - "Administrator.${adm_id}.regulatory_basis_cooperation_score == 85.00 (regulatory_due_at 2026-08-31T00:00:00.000Z is also passed, still one late request)"
            - "a BREACH_DECLARED escalate at this clock -> 409 ERR_NOT_YET_OVERDUE (the grace boundary is due_at + 7 days, also strict)"

  # =========================================================================
  # §0.5 Rule 7 — Cross-entity state dependencies
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: certification_requires_a_validated_denial_rates_submission_on_the_classification
        grounds:
          - validations.priority_20_ERR_IN_OPERATION_DATA_MISSING
          - state_machines.DataSubmission.RECEIVED_to_REJECTED
          - state_machines.ComparativeAnalysis.SUBMITTED_to_CERTIFIED
          - calculations.nqtl_stringency_in_operation_index
        distinguishing_aspect: |
          Entity pair ComparativeAnalysis x DataSubmission, coupled only through the shared
          classification_id: whether the review call succeeds depends on the *status* of a row in a
          different aggregate that the request never names. A REJECTED submission exists and carries
          the right submission_type and classification, so an implementation that merely checks for
          the presence of a submission passes the first attempt when it must fail.
        test_recipe:
          setup:
            - "One Administrator, one OPEN PlanYear, one classification, one NETWORK_ADMISSION NqtlItem applied_to BOTH."
            - "One ComparativeAnalysis authored by user-sponsor-01 (factor_count 2, evidentiary_standard_count 1) in state SUBMITTED."
            - "One VendorDataRequest with requested_item_count 2 and requested_submission_types [DENIAL_RATES]."
            - "One DENIAL_RATES submission with ms_denials 0, which the RECEIVED -> REJECTED transition rejects with rejection_reason ZERO_COMPARATOR_DENIALS."
          setup_api_calls:
            - call: "POST /parity/administrators"
              payload: { legal_name: "Northwind Benefit Administrators", contact_email: "ops@northwind.example", contractual_production_days: 45 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { adm_id: $.data.id }
            - call: "POST /parity/plan-years"
              payload: { plan_name: "Acme Group Health Plan", plan_year_label: "2026", administrator_id: "${adm_id}", funding_arrangement: "SELF_FUNDED", covered_participant_count: 1200, remediation_liability_cap_cents: 5000000 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { py_id: $.data.id }
            - call: "POST /parity/plan-years/${py_id}/classifications"
              payload: { benefit_category: "OUTPATIENT", network_tier: "IN_NETWORK", sub_classification: "OFFICE_VISITS", measurement_period_start: "2026-01-01", measurement_period_end: "2026-06-30", mh_su_benefits_covered: true }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { cls_id: $.data.id }
            - call: "POST /parity/nqtl-items"
              payload: { plan_year_id: "${py_id}", classification_id: "${cls_id}", nqtl_type: "NETWORK_ADMISSION", applied_to: "BOTH", description: "Provider network admission standards for outpatient office visits." }
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
              captures: { item_id: $.data.id, item_v0: $.data.version }
            - call: "POST /parity/comparative-analyses"
              payload: { nqtl_item_id: "${item_id}", factor_count: 2, evidentiary_standard_count: 1, stringency_written_finding: "COMPARABLE", stringency_operation_finding: "COMPARABLE", expected_nqtl_item_version: "${item_v0}" }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { ca_id: $.data.id }
            - call: "POST /parity/comparative-analyses/${ca_id}/submit"
              payload: {}
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
            - call: "POST /parity/vendor-requests"
              payload: { administrator_id: "${adm_id}", plan_year_id: "${py_id}", nqtl_item_id: "${item_id}", requested_item_count: 2, requested_submission_types: ["DENIAL_RATES"] }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { vr_id: $.data.id }
            - call: "POST /parity/vendor-requests/${vr_id}/data-submissions"
              payload: { classification_id: "${cls_id}", submission_type: "DENIAL_RATES", mh_denials: 137, mh_adjudicated_claims: 1919, ms_denials: 0, ms_adjudicated_claims: 1913 }
              as: Administrator
              as_user_id: "${adm_id}"
              captures: { sub_bad_id: $.data.id, bad_status: $.data.status }
          trigger:
            - call: "POST /parity/comparative-analyses/${ca_id}/review"
              payload: { outcome: "CERTIFIED", review_note: "Attempting certification on a rejected data submission." }
              as: ComplianceOfficer
              as_user_id: "user-officer-02"
            - call: "POST /parity/vendor-requests/${vr_id}/data-submissions"
              payload: { classification_id: "${cls_id}", submission_type: "DENIAL_RATES", mh_denials: 137, mh_adjudicated_claims: 1919, ms_denials: 71, ms_adjudicated_claims: 1913 }
              as: Administrator
              as_user_id: "${adm_id}"
              captures: { sub_good_id: $.data.id }
            - call: "POST /parity/comparative-analyses/${ca_id}/review"
              payload: { outcome: "CERTIFIED", review_note: "As-applied denial-rate data produced and validated; factors and standards are comparable." }
              as: ComplianceOfficer
              as_user_id: "user-officer-02"
              captures: { ca_status: $.data.status }
          assert:
            - "DataSubmission.${sub_bad_id}.status == REJECTED and rejection_reason == ZERO_COMPARATOR_DENIALS and disparity_ratio == null and as_applied_flag == false"
            - "first review call -> 409 ERR_IN_OPERATION_DATA_MISSING and ComparativeAnalysis.${ca_id}.status is still SUBMITTED"
            - "VendorDataRequest.${vr_id}.validated_submission_count == 0 and fulfillment_status == OPEN after the rejected row"
            - "DataSubmission.${sub_good_id}.status == VALIDATED and disparity_ratio == 1.9235 and as_applied_flag == false"
            - "second review call -> 200 with ComparativeAnalysis.${ca_id}.status == CERTIFIED and certified_by_user_id == user-officer-02"
            - "NqtlItem.${item_id}.status == ANALYSIS_SUBMITTED (certification does not by itself resolve the item)"
            - "NqtlItem.${item_id}.stringency_in_operation_index == 1.47 and stringency_flag == false"

      - name: corrective_action_plan_creation_requires_its_nqtl_item_in_violation
        grounds:
          - errors.ERR_ITEM_NOT_IN_VIOLATION
          - state_machines.NqtlItem.ANALYSIS_SUBMITTED_to_VIOLATION
          - calculations.remediation_liability_cents
          - endpoints.POST_parity_corrective_action_plans
        distinguishing_aspect: |
          A different entity pair, CorrectiveActionPlan x NqtlItem, and the dependency runs the other
          way: here the *created* row is refused because its FK target sits in the wrong state, rather
          than an action on an existing row being refused because a sibling aggregate lacks evidence.
          The identical payload succeeds once the item reaches VIOLATION, with no change to the payload.
        test_recipe:
          setup:
            - "One Administrator, one OPEN PlanYear with cap 5000000, one classification."
            - "One PRIOR_AUTHORIZATION NqtlItem applied_to MENTAL_HEALTH_SUD_ONLY with a VALIDATED disparity_ratio 3.0000 submission, so its stringency_in_operation_index is 10.00."
            - "One SUBMITTED ComparativeAnalysis on the item; no determination has been recorded yet, so the item is ANALYSIS_SUBMITTED."
          setup_api_calls:
            - call: "POST /parity/administrators"
              payload: { legal_name: "Northwind Benefit Administrators", contact_email: "ops@northwind.example", contractual_production_days: 45 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { adm_id: $.data.id }
            - call: "POST /parity/plan-years"
              payload: { plan_name: "Acme Group Health Plan", plan_year_label: "2026", administrator_id: "${adm_id}", funding_arrangement: "SELF_FUNDED", covered_participant_count: 1200, remediation_liability_cap_cents: 5000000 }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { py_id: $.data.id }
            - call: "POST /parity/plan-years/${py_id}/classifications"
              payload: { benefit_category: "INPATIENT", network_tier: "IN_NETWORK", measurement_period_start: "2026-01-01", measurement_period_end: "2026-06-30", mh_su_benefits_covered: true }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { cls_id: $.data.id }
            - call: "POST /parity/nqtl-items"
              payload: { plan_year_id: "${py_id}", classification_id: "${cls_id}", nqtl_type: "PRIOR_AUTHORIZATION", applied_to: "MENTAL_HEALTH_SUD_ONLY", description: "Prior authorization required for all inpatient MH/SUD admissions." }
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
              captures: { item_id: $.data.id }
            - call: "POST /parity/vendor-requests"
              payload: { administrator_id: "${adm_id}", plan_year_id: "${py_id}", nqtl_item_id: "${item_id}", requested_item_count: 1, requested_submission_types: ["DENIAL_RATES"] }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { vr_id: $.data.id }
            - call: "POST /parity/vendor-requests/${vr_id}/data-submissions"
              payload: { classification_id: "${cls_id}", submission_type: "DENIAL_RATES", mh_denials: 300, mh_adjudicated_claims: 1000, ms_denials: 100, ms_adjudicated_claims: 1000 }
              as: Administrator
              as_user_id: "${adm_id}"
              captures: { sub_id: $.data.id }
            - call: "GET /parity/nqtl-items/${item_id}"
              payload: {}
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
