          assert:
            - "FaultRecord.${f}.status == REOPENED after reopen and closed_at == null"
            - "CableCircuit.${c}.unresolved_fault_count == 1 and resolved_fault_count_24m == 0 after reopen"
            - "second pinpoint: status == PINPOINTED, pinpointed_distance_m == 780.0, corridor [702.0, 858.0]"

      - name: job_suspend_resume_revert_loop
        grounds:
          - state_machines.TestJob.IN_PROGRESS_to_SUSPENDED
          - state_machines.TestJob.SUSPENDED_to_IN_PROGRESS
        distinguishing_aspect: |
          TestJob is a revert-loop (branching-with-revert) machine, unlike the FaultRecord
          cycle: IN_PROGRESS -> SUSPENDED -> IN_PROGRESS -> SUSPENDED -> IN_PROGRESS is
          legal, each pass incrementing version; the job ends IN_PROGRESS with version 7.
        test_recipe:
          setup:
            - "Circuit, APPROVED window, PLANNED job (budget 800000); clock 2026-08-10T09:00Z; window ACTIVE; job started."
          setup_api_calls:
            - { call: "POST /cable-diagnostics/circuits", payload: { circuit_ref: "CKT-NL2", voltage_class: "KV_15", length_m: 1000, installation_year: 2015 }, as: SystemAdmin, captures: { c: "$.data.id" } }
