# =============================================================================
# SCAFFOLD: Biologic Manufacturing Campaign Scheduling & Batch Release
# task_3431_biologic_manufacturing_campaign_scheduling_batch_release
# =============================================================================

scenario: |
  Biologic Manufacturing Campaign Scheduling & Batch Release (Amgen): cell culture campaign scheduling across bioreactor trains with seed train timing and facility changeover between products, upstream and downstream process control with in-process testing and deviation investigation, batch record review and quality release with disposition decisions and investigation of out-of-specification results, capacity allocation between clinical and commercial demand with long lead times for scale-up, comparability studies when a process or site changes with regulatory filing requirements, cold chain distribution with temperature excursion evaluation and product complaint handling, supply continuity planning for single-source raw materials and single-site products, regulatory inspection readiness across multiple health authorities

domain_name: biologic-campaign-batch-release
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: hierarchical
  state_machine_shape: cyclic   # dominant shape; BatchLot additionally carries parallel dimensions
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ManufacturingSite
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Site name" }
      - { name: region, type: string, source: input, description: "Geographic region code (free-form, e.g. US-RI, IE-DUB)" }
      - { name: monthly_capacity_hours, type: integer, source: input, description: "Firm campaign capacity per calendar month, in hours; must be > 0" }
      - { name: cold_storage_capacity_units, type: integer, source: input, description: "Aggregate cold storage capacity in sellable units; must be > 0" }
      - { name: licensed_authorities, type: array, source: input, description: "Health authorities the site is licensed by; members of FDA | EMA | PMDA | MHRA" }
      - { name: release_posture, type: enum, source: computed, default: CLEAR, description: "CLEAR | CONDITIONAL | FROZEN; derived by site_release_posture calculation", constraints: "CLEAR | CONDITIONAL | FROZEN" }
      - { name: open_critical_deviation_count, type: integer, source: computed, default: 0, description: "Count of Deviations severity CRITICAL with status in {OPEN, REOPENED} on batches of campaigns of trains of this site" }
      - { name: open_critical_finding_count, type: integer, source: computed, default: 0, description: "Sum of CRITICAL findings on RegulatoryInspections of this site with status FINDINGS_ISSUED" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: product_code, type: string, source: input, description: "Unique product code" }
      - { name: molecule_type, type: enum, source: input, description: "Molecule class", constraints: "MONOCLONAL_ANTIBODY | FUSION_PROTEIN | RECOMBINANT_ENZYME" }
      - { name: market_scope, type: enum, source: input, description: "Which demand types may be manufactured", constraints: "CLINICAL_ONLY | COMMERCIAL_ONLY | BOTH" }
      - { name: requires_cold_chain, type: boolean, source: input, description: "Whether shipments of this product require cold chain" }
      - { name: min_storage_temp_c, type: number, source: input, description: "Minimum labeled storage temperature in Celsius" }
      - { name: max_storage_temp_c, type: number, source: input, description: "Maximum labeled storage temperature in Celsius; must be > min_storage_temp_c" }
      - { name: shelf_life_hours, type: integer, source: input, description: "Shelf life in hours from process completion; must be > 0" }
      - { name: changeover_hours, type: integer, source: input, description: "Facility changeover hours required when a train switches to or from a DIFFERENT product; must be >= 0" }
      - { name: same_product_turnaround_hours, type: integer, source: input, description: "Cleaning/turnaround hours between back-to-back campaigns of the SAME product; must be >= 0" }
      - { name: required_materials, type: array, source: input, description: "Array of {material_name, base_quantity, is_single_source}; raw materials consumed at seed-train start; may be empty" }

  - name: BioreactorTrain
    parent: ManufacturingSite
    common_fields: true
    fields:
      - { name: site_id, type: string, source: system, description: "FK -> ManufacturingSite.id; owning site" }
      - { name: train_code, type: string, source: input, description: "Train identifier unique within the site" }
      - { name: capacity_liters, type: integer, source: input, description: "Production bioreactor working volume in liters; must be > 0" }
      - { name: supported_molecule_types, type: array, source: input, description: "Molecule types this train may run; members of MONOCLONAL_ANTIBODY | FUSION_PROTEIN | RECOMBINANT_ENZYME; non-empty" }

  - name: Campaign
    parent: BioreactorTrain
    common_fields: true
    fields:
      - { name: train_id, type: string, source: system, description: "FK -> BioreactorTrain.id; train this campaign is scheduled on" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id; product to manufacture" }
      - { name: demand_type, type: enum, source: input, description: "Demand channel this campaign serves", constraints: "CLINICAL | COMMERCIAL" }
      - { name: planned_start_utc, type: datetime, source: input, description: "Planned campaign window start (inclusive)" }
      - { name: planned_end_utc, type: datetime, source: input, description: "Planned campaign window end (exclusive); must be strictly after planned_start_utc" }
      - { name: upstream_hours, type: integer, source: input, description: "Planned upstream processing hours; must be > 0" }
      - { name: downstream_hours, type: integer, source: input, description: "Planned downstream processing hours; must be > 0" }
      - { name: allocated_hours, type: integer, source: computed, description: "Capacity-hours charged to the site month; see allocated_hours calculation (per-component round-up, then sum)" }
      - { name: status, type: enum, source: system, default: PROPOSED, description: "PROPOSED | ALLOCATED | SEED_IN_PROGRESS | PRODUCTION_IN_PROGRESS | COMPLETED | PREEMPTED", constraints: "PROPOSED | ALLOCATED | SEED_IN_PROGRESS | PRODUCTION_IN_PROGRESS | COMPLETED | PREEMPTED" }

  - name: SeedTrainStage
    parent: Campaign
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: system, description: "FK -> Campaign.id; owning campaign" }
      - { name: stage_index, type: integer, source: input, description: "1-based seed train stage ordinal; unique within the campaign; must be > 0" }
      - { name: planned_duration_hours, type: integer, source: input, description: "Planned duration of this stage in hours; must be > 0" }
      - { name: started_at, type: datetime, source: system, description: "Logical time the stage last entered RUNNING; null until first start" }
      - { name: completed_at, type: datetime, source: system, description: "Logical time the stage entered COMPLETED; null until completed; cleared on retry" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | RUNNING | COMPLETED | FAILED | EXPIRED", constraints: "PENDING | RUNNING | COMPLETED | FAILED | EXPIRED" }

  - name: BatchLot
    parent: Campaign
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: system, description: "FK -> Campaign.id; owning campaign (at most one batch per campaign)" }
      - { name: lot_number, type: string, source: input, description: "Client-supplied lot identifier" }
      - { name: product_id, type: string, source: system, description: "Denormalized copy of the parent Campaign product_id captured at batch creation; not a live reference" }
      - { name: process_status, type: enum, source: system, default: UPSTREAM, description: "Parallel dimension 1: UPSTREAM | DOWNSTREAM | PROCESS_COMPLETE | TERMINATED", constraints: "UPSTREAM | DOWNSTREAM | PROCESS_COMPLETE | TERMINATED" }
      - { name: quality_status, type: enum, source: system, default: IN_TESTING, description: "Parallel dimension 2: IN_TESTING | READY_FOR_REVIEW | PENDING_DISPOSITION | UNDER_INVESTIGATION | RELEASED | REJECTED | QUARANTINED", constraints: "IN_TESTING | READY_FOR_REVIEW | PENDING_DISPOSITION | UNDER_INVESTIGATION | RELEASED | REJECTED | QUARANTINED" }
      - { name: quality_hold_return_status, type: enum, source: system, description: "Quality status to restore when the last open deviation closes; null unless quality_status == UNDER_INVESTIGATION", constraints: "READY_FOR_REVIEW | PENDING_DISPOSITION | null" }
      - { name: manufactured_by_user_id, type: string, source: system, description: "X-User-ID of the ManufacturingOperator who created the batch; segregation-of-duties anchor" }
      - { name: quantity_units, type: integer, source: computed, description: "Sellable units; provisional variant while processing, final variant from PROCESS_COMPLETE onward" }
      - { name: provisional_yield_units, type: integer, source: computed, description: "Provisional yield estimate computed at batch creation; see batch_yield calculation" }
      - { name: final_yield_units, type: integer, source: computed, description: "Final yield computed at PROCESS_COMPLETE from VERIFIED DOWNSTREAM TITER tests; null before",  }
      - { name: available_to_ship_units, type: integer, source: computed, description: "quantity_units minus sum of quantity_units over this batch's Shipments with status in {PLANNED, IN_TRANSIT, EXCURSION_HOLD, DELIVERED}" }
      - { name: process_completed_at, type: datetime, source: system, description: "Logical time process_status entered PROCESS_COMPLETE; null until then" }
      - { name: expiry_utc, type: datetime, source: computed, description: "process_completed_at + product.shelf_life_hours; null before PROCESS_COMPLETE" }

  - name: InProcessTest
    parent: BatchLot
    common_fields: true
    fields:
      - { name: batch_lot_id, type: string, source: system, description: "FK -> BatchLot.id; batch under test" }
      - { name: test_type, type: enum, source: input, description: "In-process control test type", constraints: "CELL_VIABILITY | TITER | PURITY | STERILITY | ENDOTOXIN" }
      - { name: phase, type: enum, source: input, description: "Process phase this test belongs to", constraints: "UPSTREAM | DOWNSTREAM" }
      - { name: measured_value, type: number, source: input, description: "Measured result" }
      - { name: unit, type: string, source: input, description: "Unit of measure (free-form)" }
      - { name: spec_min, type: number, source: input, description: "Lower specification bound (inclusive); must be < spec_max" }
      - { name: spec_max, type: number, source: input, description: "Upper specification bound (inclusive)" }
      - { name: is_in_spec, type: boolean, source: computed, description: "spec_min <= measured_value <= spec_max, computed at record time" }
      - { name: supersedes_test_id, type: string, source: input, description: "Optional id of an INVALIDATED test on the same batch that this retest supersedes; plain reference, not a live FK" }
      - { name: status, type: enum, source: system, default: RECORDED, description: "RECORDED | VERIFIED | OOS_SUSPECT | OOS_CONFIRMED | INVALIDATED", constraints: "RECORDED | VERIFIED | OOS_SUSPECT | OOS_CONFIRMED | INVALIDATED" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the recording ManufacturingOperator" }
      - { name: verified_by_user_id, type: string, source: system, description: "X-User-ID of the verifying QualityControlAnalyst; null until decided" }

  - name: Deviation
    parent: BatchLot
    common_fields: true
    fields:
      - { name: batch_lot_id, type: string, source: system, description: "FK -> BatchLot.id; batch the deviation is raised against" }
      - { name: kind, type: enum, source: system, description: "PROCESS | OOS | COMPLAINT; OOS deviations are system-created by test verification only, never by POST body", constraints: "PROCESS | OOS | COMPLAINT" }
      - { name: severity, type: enum, source: system, description: "MINOR | MAJOR | CRITICAL; input on manual create; system-set for OOS (CRITICAL when the linked test phase is DOWNSTREAM, else MAJOR)", constraints: "MINOR | MAJOR | CRITICAL" }
      - { name: description, type: string, source: input, description: "Free-text description" }
      - { name: linked_test_id, type: string, source: system, description: "For kind OOS: id of the InProcessTest that triggered this deviation; null otherwise; plain reference, not a live FK" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | CLOSED | REOPENED", constraints: "OPEN | CLOSED | REOPENED" }
      - { name: conclusion, type: enum, source: system, description: "Set at close; allowed values depend on kind (see deviation state machine); null while open", constraints: "INVALIDATED_TEST | CONFIRMED_OOS | CAPA_COMPLETED | NO_ACTION_REQUIRED | CONFIRMED | UNCONFIRMED | null" }
      - { name: capa_summary, type: string, source: system, description: "CAPA summary supplied at close; required when severity == CRITICAL; null while open" }
      - { name: opened_by_user_id, type: string, source: system, description: "X-User-ID of creator, or the string system for auto-created OOS deviations" }
      - { name: closed_by_user_id, type: string, source: system, description: "X-User-ID of the closer; null while open" }

  - name: Shipment
    parent: BatchLot
    common_fields: true
    fields:
      - { name: batch_lot_id, type: string, source: system, description: "FK -> BatchLot.id; batch being distributed" }
      - { name: destination_region, type: string, source: input, description: "Destination region code (free-form)" }
      - { name: market_type, type: enum, source: input, description: "Market channel; must equal the batch campaign demand_type", constraints: "CLINICAL | COMMERCIAL" }
      - { name: quantity_units, type: integer, source: input, description: "Units shipped; must be >= 1" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "PLANNED | IN_TRANSIT | EXCURSION_HOLD | DELIVERED | QUARANTINED | CANCELLED", constraints: "PLANNED | IN_TRANSIT | EXCURSION_HOLD | DELIVERED | QUARANTINED | CANCELLED" }
      - { name: shipped_at, type: datetime, source: system, description: "Logical time of SHIP; null until shipped" }
      - { name: delivered_at, type: datetime, source: system, description: "Logical time of DELIVER; null until delivered" }
      - { name: excursion_evaluation, type: enum, source: system, default: NONE, description: "NONE | PENDING | ACCEPTABLE | UNACCEPTABLE", constraints: "NONE | PENDING | ACCEPTABLE | UNACCEPTABLE" }
      - { name: evaluation_variant, type: enum, source: system, default: NONE, description: "Variant applied by the last excursion evaluation; NONE until evaluated", constraints: "NONE | SCREENING | MKT" }

  - name: TemperatureReading
    parent: Shipment
    common_fields: false
    fields:
      - { name: shipment_id, type: string, source: system, description: "FK -> Shipment.id; shipment monitored" }
      - { name: recorded_at, type: datetime, source: input, description: "Timestamp the logger reading was taken" }
      - { name: temperature_c, type: number, source: input, description: "Recorded temperature in Celsius" }

  - name: ComparabilityStudy
    parent: Product
    common_fields: true
    fields:
      - { name: product_id, type: string, source: system, description: "FK -> Product.id; product whose process or site changed" }
      - { name: change_type, type: enum, source: input, description: "Nature of the change under study", constraints: "PROCESS_CHANGE | SITE_TRANSFER | SCALE_UP" }
      - { name: baseline_attribute_values, type: array, source: input, description: "Historical DOWNSTREAM PURITY values (numbers) from pre-change lots; at least 3 entries" }
      - { name: candidate_batch_ids, type: array, source: input, description: "Ids of post-change BatchLots whose latest VERIFIED DOWNSTREAM PURITY test supplies the candidate values; at least 1 entry" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "PLANNED | PROTOCOL_APPROVED | COMPARABLE | NOT_COMPARABLE | FILED", constraints: "PLANNED | PROTOCOL_APPROVED | COMPARABLE | NOT_COMPARABLE | FILED" }
      - { name: authority, type: enum, source: system, description: "Health authority the filing was submitted to; null until SUBMIT_FILING", constraints: "FDA | EMA | PMDA | MHRA | null" }
      - { name: baseline_mean, type: number, source: computed, description: "Post-exclusion baseline mean mu1 (4 decimal places, round_half_up); null until RECORD_ASSESSMENT" }
      - { name: equivalence_margin, type: number, source: computed, description: "max(ABS_MARGIN, REL_MARGIN * baseline_mean) (4 decimal places, round_half_up); null until RECORD_ASSESSMENT" }

  - name: RegulatoryInspection
    parent: ManufacturingSite
    common_fields: true
    fields:
      - { name: site_id, type: string, source: system, description: "FK -> ManufacturingSite.id; inspected site" }
      - { name: authority, type: enum, source: input, description: "Inspecting health authority; must be in the site licensed_authorities", constraints: "FDA | EMA | PMDA | MHRA" }
      - { name: status, type: enum, source: system, default: ANNOUNCED, description: "ANNOUNCED | FINDINGS_ISSUED | CLOSED", constraints: "ANNOUNCED | FINDINGS_ISSUED | CLOSED" }
      - { name: findings, type: array, source: system, description: "Array of {severity: CRITICAL | MAJOR | MINOR, note: string}; empty until ISSUE_FINDINGS" }
      - { name: open_critical_finding_count, type: integer, source: computed, default: 0, description: "Count of CRITICAL findings while status == FINDINGS_ISSUED; reset to 0 on CLOSE" }
      - { name: response_summary, type: string, source: system, description: "Response narrative supplied at CLOSE; null until closed" }

  - name: MaterialLot
    parent: ManufacturingSite
    common_fields: true
    fields:
      - { name: site_id, type: string, source: system, description: "FK -> ManufacturingSite.id; stocking site" }
      - { name: material_name, type: string, source: input, description: "Material identifier matched against Product.required_materials.material_name" }
      - { name: is_single_source, type: boolean, source: input, description: "Whether this lot comes from a single-source supplier" }
      - { name: quantity_available, type: number, source: system, description: "Unconsumed quantity; initialized from input quantity on create, decremented by campaign seed starts" }
      - { name: status, type: enum, source: system, default: AVAILABLE, description: "AVAILABLE | QUARANTINED", constraints: "AVAILABLE | QUARANTINED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Campaign
    initial_state: PROPOSED
    terminal_states: [COMPLETED, PREEMPTED]
    transitions:
      - from: PROPOSED
        to: ALLOCATED
        trigger: "POST /campaigns/{id}/advance (to_status=ALLOCATED)"
        actor: ProcessEngineer
        preconditions:
          - "Campaign status == PROPOSED (ERR_INVALID_CAMPAIGN_STATE)"
          - "Train window re-check against campaigns in {PROPOSED, ALLOCATED, SEED_IN_PROGRESS, PRODUCTION_IN_PROGRESS} on the same train passes incl. changeover gap (ERR_TRAIN_WINDOW_CONFLICT; checked before capacity)"
          - "Firm capacity waterfall succeeds for the calendar month of planned_start_utc (ERR_CAPACITY_EXCEEDED after preemption attempts for CLINICAL)"
        side_effects:
          - "If demand_type == CLINICAL and firm capacity is insufficient: preempt (ALLOCATED -> PREEMPTED) as many COMMERCIAL campaigns at the same site whose planned_start_utc falls in the same calendar month as needed, in order planned_start_utc DESC, tie-break created_at ASC, until capacity suffices or candidates are exhausted"
          - "increments Campaign.version by 1"
      - from: ALLOCATED
        to: PROPOSED
        trigger: "POST /campaigns/{id}/advance (to_status=PROPOSED)"
        actor: ProcessEngineer
        preconditions:
          - "Campaign status == ALLOCATED (ERR_INVALID_CAMPAIGN_STATE)"
        side_effects:
          - "Firm capacity-hours for the campaign's month are released (allocated_hours no longer counts as firm consumption)"
          - "increments Campaign.version by 1"
      - from: ALLOCATED
        to: SEED_IN_PROGRESS
        trigger: "POST /campaigns/{id}/advance (to_status=SEED_IN_PROGRESS)"
        actor: ProcessEngineer
        preconditions:
          - "Campaign status == ALLOCATED (ERR_INVALID_CAMPAIGN_STATE)"
          - "Logical clock >= planned_start_utc (ERR_CAMPAIGN_START_TOO_EARLY)"
          - "At least one SeedTrainStage exists for the campaign (ERR_NO_SEED_STAGES_DEFINED)"
          - "Material coverage check passes for every Product.required_materials entry (ERR_SINGLE_SOURCE_MATERIAL_BLOCKED checked before ERR_MATERIAL_SHORTAGE)"
        side_effects:
          - "Consume each required material: for each required_materials entry, decrement quantity_available of AVAILABLE MaterialLots at the campaign site with matching material_name in created_at ASC order until base_quantity * 1.10 (2 decimals, round_half_up) is covered"
          - "increments Campaign.version by 1"
      - from: SEED_IN_PROGRESS
        to: PRODUCTION_IN_PROGRESS
        trigger: "POST /campaigns/{id}/advance (to_status=PRODUCTION_IN_PROGRESS)"
        actor: ProcessEngineer
        preconditions:
          - "Campaign status == SEED_IN_PROGRESS (ERR_INVALID_CAMPAIGN_STATE)"
          - "Every SeedTrainStage of the campaign has status == COMPLETED (ERR_SEED_STAGES_INCOMPLETE)"
          - "Logical clock - max(SeedTrainStage.completed_at) <= 24 hours (ERR_SEED_INOCULATION_WINDOW_EXPIRED)"
        side_effects:
          - "increments Campaign.version by 1"
        note: "An attempt rejected by ERR_SEED_INOCULATION_WINDOW_EXPIRED additionally flips the highest-indexed COMPLETED stage to EXPIRED (see the SeedTrainStage COMPLETED -> EXPIRED system transition), which permits a stage retry cycle instead of stranding the campaign."
      - from: PRODUCTION_IN_PROGRESS
        to: COMPLETED
        trigger: "system (automatic when the campaign's BatchLot process_status enters PROCESS_COMPLETE or TERMINATED)"
        actor: system
        preconditions:
          - "The campaign's BatchLot process_status in {PROCESS_COMPLETE, TERMINATED}"
        side_effects: []
      - from: PROPOSED
        to: PREEMPTED
        trigger: "system (site release_posture becomes FROZEN)"
        actor: system
        preconditions:
          - "Campaign demand_type == COMMERCIAL and the campaign's train belongs to the site whose posture became FROZEN"
        side_effects: []
      - from: ALLOCATED
        to: PREEMPTED
        trigger: "system (capacity preemption by a CLINICAL allocation at the same site and month)"
        actor: system
        preconditions:
          - "Campaign demand_type == COMMERCIAL and selected by the preemption selector of a CLINICAL allocation"
        side_effects:
          - "Firm capacity-hours for the campaign's month are released"

  - entity: BatchLot
    initial_state: "process_status=UPSTREAM, quality_status=IN_TESTING (parallel dimensions)"
    terminal_states: ["process: PROCESS_COMPLETE | TERMINATED", "quality: RELEASED | REJECTED | QUARANTINED"]
    transitions:
      - from: "process UPSTREAM"
        to: "process DOWNSTREAM"
        trigger: "POST /batches/{id}/advance (to_status=DOWNSTREAM)"
        actor: ManufacturingOperator
        preconditions:
          - "process_status == UPSTREAM (ERR_INVALID_BATCH_STATE)"
          - "At least one VERIFIED UPSTREAM test exists AND every UPSTREAM test has status in {VERIFIED, INVALIDATED} (ERR_UNRESOLVED_TESTS)"
        side_effects:
          - "increments BatchLot.version by 1"
      - from: "process DOWNSTREAM"
        to: "process PROCESS_COMPLETE"
        trigger: "POST /batches/{id}/advance (to_status=PROCESS_COMPLETE)"
        actor: ManufacturingOperator
        preconditions:
          - "process_status == DOWNSTREAM (ERR_INVALID_BATCH_STATE)"
          - "At least one VERIFIED DOWNSTREAM test exists AND every test of the batch (both phases) has status in {VERIFIED, INVALIDATED} (ERR_UNRESOLVED_TESTS)"
        side_effects:
          - "Compute final_yield_units (batch_yield final variant); quantity_units := final_yield_units"
          - "process_completed_at := logical clock; expiry_utc := process_completed_at + product.shelf_life_hours"
          - "quality_status IN_TESTING -> READY_FOR_REVIEW"
          - "Parent Campaign PRODUCTION_IN_PROGRESS -> COMPLETED (system)"
          - "increments BatchLot.version by 1"
      - from: "process UPSTREAM"
        to: "process TERMINATED"
        trigger: "POST /batches/{id}/advance (to_status=TERMINATED)"
        actor: ManufacturingOperator
        preconditions:
          - "process_status in {UPSTREAM, DOWNSTREAM} (ERR_INVALID_BATCH_STATE)"
        side_effects:
          - "quality_status -> REJECTED"
          - "Parent Campaign PRODUCTION_IN_PROGRESS -> COMPLETED (system)"
          - "increments BatchLot.version by 1"
      - from: "process DOWNSTREAM"
        to: "process TERMINATED"
        trigger: "POST /batches/{id}/advance (to_status=TERMINATED)"
        actor: ManufacturingOperator
        preconditions:
          - "process_status in {UPSTREAM, DOWNSTREAM} (ERR_INVALID_BATCH_STATE)"
        side_effects:
          - "quality_status -> REJECTED"
          - "Parent Campaign PRODUCTION_IN_PROGRESS -> COMPLETED (system)"
          - "increments BatchLot.version by 1"
      - from: "quality READY_FOR_REVIEW"
        to: "quality PENDING_DISPOSITION"
        trigger: "POST /batches/{id}/submit-for-review"
        actor: QualityAssuranceReviewer
        preconditions:
          - "quality_status == READY_FOR_REVIEW (ERR_INVALID_BATCH_STATE)"
        side_effects:
          - "increments BatchLot.version by 1"
      - from: "quality PENDING_DISPOSITION"
        to: "quality RELEASED"
        trigger: "POST /batches/{id}/disposition (decision=RELEASED)"
        actor: QualityAssuranceReviewer
        preconditions:
          - "quality_status == PENDING_DISPOSITION (ERR_INVALID_BATCH_STATE; state errors precede all business checks)"
          - "Segregation of duties: X-User-ID != manufactured_by_user_id AND X-User-ID != verified_by_user_id of every VERIFIED test on the batch (ERR_SEGREGATION_OF_DUTIES)"
          - "Site posture gate: if campaign demand_type == COMMERCIAL, site release_posture != FROZEN (ERR_SITE_RELEASE_FROZEN)"
          - "Shelf-life gate: if campaign demand_type == COMMERCIAL, expiry_utc - logical clock >= 720 hours (ERR_INSUFFICIENT_REMAINING_SHELF_LIFE)"
          - "Comparability gate: if campaign demand_type == COMMERCIAL and the product has at least one ComparabilityStudy, the most recently created study must have status == FILED (ERR_COMPARABILITY_NOT_ESTABLISHED)"
        side_effects:
          - "increments BatchLot.version by 1"
      - from: "quality PENDING_DISPOSITION"
        to: "quality REJECTED"
        trigger: "POST /batches/{id}/disposition (decision=REJECTED)"
        actor: QualityAssuranceReviewer
        preconditions:
          - "quality_status == PENDING_DISPOSITION (ERR_INVALID_BATCH_STATE)"
          - "Segregation of duties as for RELEASED (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "All Shipments of this batch with status PLANNED -> CANCELLED (cold-storage occupancy released)"
          - "increments BatchLot.version by 1"
      - from: "quality READY_FOR_REVIEW"
        to: "quality UNDER_INVESTIGATION"
        trigger: "system (a Deviation with severity CRITICAL opens on this batch, or an OOS deviation closes with conclusion CONFIRMED_OOS)"
        actor: system
        preconditions:
          - "quality_status in {READY_FOR_REVIEW, PENDING_DISPOSITION}"
        side_effects:
          - "quality_hold_return_status := prior quality_status"
      - from: "quality PENDING_DISPOSITION"
        to: "quality UNDER_INVESTIGATION"
        trigger: "system (a Deviation with severity CRITICAL opens on this batch, or an OOS deviation closes with conclusion CONFIRMED_OOS)"
        actor: system
        preconditions:
          - "quality_status in {READY_FOR_REVIEW, PENDING_DISPOSITION}"
        side_effects:
          - "quality_hold_return_status := prior quality_status"
      - from: "quality UNDER_INVESTIGATION"
        to: "quality (quality_hold_return_status)"
        trigger: "system (the last Deviation of this batch with status in {OPEN, REOPENED} closes)"
        actor: system
        preconditions:
          - "After the closing deviation, zero deviations of this batch have status in {OPEN, REOPENED}"
        side_effects:
          - "quality_hold_return_status := null"
      - from: "quality RELEASED"
        to: "quality QUARANTINED"
        trigger: "system (a COMPLAINT Deviation with severity CRITICAL closes with conclusion CONFIRMED on this batch)"
        actor: system
        preconditions:
          - "quality_status == RELEASED at the moment the complaint closes"
        side_effects:
          - "All Shipments of this batch with status in {PLANNED, IN_TRANSIT, EXCURSION_HOLD} -> QUARANTINED (PLANNED occupancy released)"

  - entity: SeedTrainStage
    initial_state: PENDING
    terminal_states: [COMPLETED]
    transitions:
      - from: PENDING
        to: RUNNING
        trigger: "POST /seed-stages/{id}/advance (to_status=RUNNING)"
        actor: ProcessEngineer
        preconditions:
          - "Stage status in {PENDING, FAILED, EXPIRED} (ERR_INVALID_SEED_STAGE_STATE)"
          - "Parent Campaign status == SEED_IN_PROGRESS (ERR_INVALID_CAMPAIGN_STATE)"
          - "Every stage of the same campaign with lower stage_index has status == COMPLETED (ERR_SEED_STAGE_ORDER_VIOLATION)"
          - "If stage_index > 1: logical clock - completed_at of the stage with stage_index - 1 <= 36 hours (ERR_SEED_TRANSFER_WINDOW_EXPIRED)"
        side_effects:
          - "started_at := logical clock; completed_at := null"
        note: "A RUNNING attempt rejected by ERR_SEED_TRANSFER_WINDOW_EXPIRED additionally flips the stage with stage_index - 1 from COMPLETED to EXPIRED (see the COMPLETED -> EXPIRED system transition); the failed stage itself keeps its status."
      - from: COMPLETED
        to: EXPIRED
        trigger: "system (a successor stage's RUNNING attempt observes the 36-hour transfer window exceeded, OR a campaign production-start attempt observes the 24-hour inoculation window exceeded)"
        actor: system
        preconditions:
          - "Stage status == COMPLETED and (a) a RUNNING attempt on the stage with stage_index + 1 of the same campaign is being rejected with ERR_SEED_TRANSFER_WINDOW_EXPIRED, or (b) a PRODUCTION_IN_PROGRESS attempt on the parent campaign is being rejected with ERR_SEED_INOCULATION_WINDOW_EXPIRED and this stage has the highest stage_index of the campaign"
        side_effects: []
      - from: FAILED
        to: RUNNING
        trigger: "POST /seed-stages/{id}/advance (to_status=RUNNING) — retry"
        actor: ProcessEngineer
        preconditions:
          - "Stage status in {PENDING, FAILED, EXPIRED} (ERR_INVALID_SEED_STAGE_STATE)"
          - "Parent Campaign status == SEED_IN_PROGRESS (ERR_INVALID_CAMPAIGN_STATE)"
          - "Every stage of the same campaign with lower stage_index has status == COMPLETED (ERR_SEED_STAGE_ORDER_VIOLATION)"
          - "If stage_index > 1: logical clock - completed_at of the stage with stage_index - 1 <= 36 hours (ERR_SEED_TRANSFER_WINDOW_EXPIRED)"
        side_effects:
          - "started_at := logical clock; completed_at := null"
      - from: EXPIRED
        to: RUNNING
        trigger: "POST /seed-stages/{id}/advance (to_status=RUNNING) — retry"
        actor: ProcessEngineer
        preconditions:
          - "Stage status in {PENDING, FAILED, EXPIRED} (ERR_INVALID_SEED_STAGE_STATE)"
          - "Parent Campaign status == SEED_IN_PROGRESS (ERR_INVALID_CAMPAIGN_STATE)"
          - "Every stage of the same campaign with lower stage_index has status == COMPLETED (ERR_SEED_STAGE_ORDER_VIOLATION)"
          - "If stage_index > 1: logical clock - completed_at of the stage with stage_index - 1 <= 36 hours (ERR_SEED_TRANSFER_WINDOW_EXPIRED)"
        side_effects:
          - "started_at := logical clock; completed_at := null"
      - from: RUNNING
        to: COMPLETED
        trigger: "POST /seed-stages/{id}/advance (to_status=COMPLETED)"
        actor: ProcessEngineer
        preconditions:
          - "Stage status == RUNNING (ERR_INVALID_SEED_STAGE_STATE)"
        side_effects:
          - "completed_at := logical clock"
      - from: RUNNING
        to: FAILED
        trigger: "POST /seed-stages/{id}/advance (to_status=FAILED)"
        actor: ProcessEngineer
        preconditions:
          - "Stage status == RUNNING (ERR_INVALID_SEED_STAGE_STATE)"
        side_effects: []

  - entity: InProcessTest
    initial_state: RECORDED
    terminal_states: [VERIFIED, OOS_CONFIRMED, INVALIDATED]
    transitions:
      - from: RECORDED
        to: VERIFIED
        trigger: "POST /tests/{id}/verify when is_in_spec == true"
        actor: QualityControlAnalyst
        preconditions:
          - "Test status == RECORDED (ERR_TEST_NOT_RECORDED)"
          - "Four-eyes: X-User-ID != recorded_by_user_id (ERR_FOUR_EYES_VIOLATION)"
        side_effects:
          - "verified_by_user_id := X-User-ID"
      - from: RECORDED
        to: OOS_SUSPECT
        trigger: "POST /tests/{id}/verify when is_in_spec == false"
        actor: QualityControlAnalyst
        preconditions:
          - "Test status == RECORDED (ERR_TEST_NOT_RECORDED)"
          - "Four-eyes: X-User-ID != recorded_by_user_id (ERR_FOUR_EYES_VIOLATION)"
        side_effects:
          - "verified_by_user_id := X-User-ID"
          - "System creates a Deviation on the same batch: kind=OOS, status=OPEN, linked_test_id=this test, severity = CRITICAL if this test phase == DOWNSTREAM else MAJOR, opened_by_user_id = system"
          - "If that deviation is CRITICAL: recompute site open_critical_deviation_count and release_posture (site_release_posture calculation); if release_posture becomes FROZEN, every COMMERCIAL Campaign in PROPOSED at that site -> PREEMPTED"
      - from: OOS_SUSPECT
        to: INVALIDATED
        trigger: "system (the linked OOS Deviation closes with conclusion INVALIDATED_TEST)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OOS_SUSPECT
        to: OOS_CONFIRMED
        trigger: "system (the linked OOS Deviation closes with conclusion CONFIRMED_OOS)"
        actor: system
        preconditions: []
        side_effects:
          - "If the batch quality_status is in {READY_FOR_REVIEW, PENDING_DISPOSITION}: quality_status -> UNDER_INVESTIGATION (return status stored)"

  - entity: Deviation
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /deviations/{id}/action (action=CLOSE)"
        actor: QualityAssuranceReviewer
        preconditions:
          - "Deviation status in {OPEN, REOPENED} (ERR_DEVIATION_NOT_OPEN)"
          - "conclusion must be admissible for the deviation kind: OOS -> {INVALIDATED_TEST, CONFIRMED_OOS}; PROCESS -> {CAPA_COMPLETED, NO_ACTION_REQUIRED}; COMPLAINT -> {CONFIRMED, UNCONFIRMED} (ERR_INVALID_REQUEST)"
          - "If severity == CRITICAL: capa_summary is required (ERR_INVALID_REQUEST)"
        side_effects:
          - "conclusion, capa_summary, closed_by_user_id recorded"
          - "If kind == OOS and conclusion == INVALIDATED_TEST: linked test OOS_SUSPECT -> INVALIDATED"
          - "If kind == OOS and conclusion == CONFIRMED_OOS: linked test OOS_SUSPECT -> OOS_CONFIRMED; batch quality hold per InProcessTest machine"
          - "If kind == COMPLAINT and severity == CRITICAL and conclusion == CONFIRMED and batch quality_status == RELEASED: batch quality_status -> QUARANTINED and its non-terminal shipments -> QUARANTINED (see BatchLot machine)"
          - "If severity == CRITICAL: recompute site open_critical_deviation_count and release_posture; if posture leaves FROZEN, PREEMPTED campaigns are NOT resurrected"
          - "If after closing zero deviations of the batch have status in {OPEN, REOPENED} and batch quality_status == UNDER_INVESTIGATION: quality_status := quality_hold_return_status"
      - from: REOPENED
        to: CLOSED
        trigger: "POST /deviations/{id}/action (action=CLOSE)"
        actor: QualityAssuranceReviewer
        preconditions:
          - "Deviation status in {OPEN, REOPENED} (ERR_DEVIATION_NOT_OPEN)"
          - "conclusion admissible for kind (ERR_INVALID_REQUEST)"
          - "If severity == CRITICAL: capa_summary is required (ERR_INVALID_REQUEST)"
        side_effects:
          - "Same side effects as OPEN -> CLOSED"
      - from: CLOSED
        to: REOPENED
        trigger: "POST /deviations/{id}/action (action=REOPEN)"
        actor: QualityAssuranceReviewer
        preconditions:
          - "Deviation status == CLOSED (ERR_DEVIATION_NOT_OPEN)"
          - "justification is required (ERR_INVALID_REQUEST)"
        side_effects:
          - "If severity == CRITICAL: recompute site open_critical_deviation_count and release_posture (the deviation counts as open again)"
          - "conclusion := null; closed_by_user_id := null"

  - entity: Shipment
    initial_state: PLANNED
    terminal_states: [DELIVERED, QUARANTINED, CANCELLED]
    transitions:
      - from: PLANNED
        to: IN_TRANSIT
        trigger: "POST /shipments/{id}/action (action=SHIP)"
        actor: SupplyPlanner
        preconditions:
          - "Shipment status == PLANNED (ERR_INVALID_SHIPMENT_STATE)"
        side_effects:
          - "shipped_at := logical clock; cold-storage occupancy at the origin site is released for this shipment"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /shipments/{id}/action (action=CANCEL)"
        actor: SupplyPlanner
        preconditions:
          - "Shipment status == PLANNED (ERR_INVALID_SHIPMENT_STATE)"
        side_effects:
          - "Cold-storage occupancy released; batch available_to_ship_units restored by quantity_units"
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /shipments/{id}/action (action=DELIVER)"
        actor: SupplyPlanner
        preconditions:
          - "Shipment status == IN_TRANSIT (ERR_INVALID_SHIPMENT_STATE)"
          - "Logical clock <= batch expiry_utc (ERR_BATCH_EXPIRED)"
        side_effects:
          - "delivered_at := logical clock"
      - from: IN_TRANSIT
        to: EXCURSION_HOLD
        trigger: "system (a TemperatureReading violates a detection guard)"
        actor: system
        preconditions:
          - "Shipment status == IN_TRANSIT and the new reading satisfies: temperature_c > product.max_storage_temp_c + 5.0, OR temperature_c < product.min_storage_temp_c - 0.5, OR the count of this shipment's readings with temperature_c > product.max_storage_temp_c exceeds 2"
        side_effects:
          - "excursion_evaluation := PENDING"
      - from: EXCURSION_HOLD
        to: IN_TRANSIT
        trigger: "POST /shipments/{id}/evaluate-excursion when the evaluation verdict is ACCEPTABLE"
        actor: QualityAssuranceReviewer
        preconditions:
          - "Shipment status == EXCURSION_HOLD (ERR_INVALID_SHIPMENT_STATE)"
        side_effects:
          - "excursion_evaluation := ACCEPTABLE; evaluation_variant := SCREENING (market_type CLINICAL) or MKT (market_type COMMERCIAL)"
      - from: EXCURSION_HOLD
        to: QUARANTINED
        trigger: "POST /shipments/{id}/evaluate-excursion when the evaluation verdict is UNACCEPTABLE"
        actor: QualityAssuranceReviewer
        preconditions:
          - "Shipment status == EXCURSION_HOLD (ERR_INVALID_SHIPMENT_STATE)"
        side_effects:
          - "excursion_evaluation := UNACCEPTABLE; evaluation_variant := SCREENING (market_type CLINICAL) or MKT (market_type COMMERCIAL)"
      - from: PLANNED
        to: QUARANTINED
        trigger: "system (batch quarantine cascade from a confirmed critical complaint)"
        actor: system
        preconditions: []
        side_effects:
          - "Cold-storage occupancy released"
      - from: IN_TRANSIT
        to: QUARANTINED
        trigger: "system (batch quarantine cascade from a confirmed critical complaint)"
        actor: system
        preconditions: []
        side_effects: []
      - from: EXCURSION_HOLD
        to: QUARANTINED
        trigger: "system (batch quarantine cascade from a confirmed critical complaint)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ComparabilityStudy
    initial_state: PLANNED
    terminal_states: [FILED]
    transitions:
      - from: PLANNED
        to: PROTOCOL_APPROVED
        trigger: "POST /comparability-studies/{id}/action (action=APPROVE_PROTOCOL)"
        actor: RegulatoryAffairsSpecialist
        preconditions:
          - "Study status in {PLANNED, NOT_COMPARABLE} (ERR_INVALID_STUDY_STATE)"
        side_effects: []
      - from: NOT_COMPARABLE
        to: PROTOCOL_APPROVED
        trigger: "POST /comparability-studies/{id}/action (action=APPROVE_PROTOCOL) — rework loop"
        actor: RegulatoryAffairsSpecialist
        preconditions:
          - "Study status in {PLANNED, NOT_COMPARABLE} (ERR_INVALID_STUDY_STATE)"
        side_effects: []
      - from: PROTOCOL_APPROVED
        to: COMPARABLE
        trigger: "POST /comparability-studies/{id}/action (action=RECORD_ASSESSMENT) when the equivalence calculation passes"
        actor: RegulatoryAffairsSpecialist
        preconditions:
          - "Study status == PROTOCOL_APPROVED (ERR_INVALID_STUDY_STATE)"
          - "Every candidate batch has at least one VERIFIED DOWNSTREAM PURITY test (ERR_STUDY_DATA_MISSING)"
        side_effects:
          - "Compute baseline_mean and equivalence_margin (comparability_equivalence calculation)"
      - from: PROTOCOL_APPROVED
        to: NOT_COMPARABLE
        trigger: "POST /comparability-studies/{id}/action (action=RECORD_ASSESSMENT) when the equivalence calculation fails"
        actor: RegulatoryAffairsSpecialist
        preconditions:
          - "Study status == PROTOCOL_APPROVED (ERR_INVALID_STUDY_STATE)"
          - "Every candidate batch has at least one VERIFIED DOWNSTREAM PURITY test (ERR_STUDY_DATA_MISSING)"
        side_effects:
          - "Compute baseline_mean and equivalence_margin (comparability_equivalence calculation)"
      - from: COMPARABLE
        to: FILED
        trigger: "POST /comparability-studies/{id}/action (action=SUBMIT_FILING)"
        actor: RegulatoryAffairsSpecialist
        preconditions:
          - "Study status == COMPARABLE (ERR_INVALID_STUDY_STATE)"
          - "authority is provided and is a member of FDA | EMA | PMDA | MHRA (ERR_INVALID_REQUEST)"
        side_effects:
          - "authority recorded"

  - entity: RegulatoryInspection
    initial_state: ANNOUNCED
    terminal_states: [CLOSED]
    transitions:
      - from: ANNOUNCED
        to: FINDINGS_ISSUED
        trigger: "POST /inspections/{id}/action (action=ISSUE_FINDINGS)"
        actor: RegulatoryAffairsSpecialist
        preconditions:
          - "Inspection status == ANNOUNCED (ERR_INVALID_INSPECTION_STATE)"
          - "findings array is non-empty; each entry has severity in {CRITICAL, MAJOR, MINOR} and a note (ERR_INVALID_REQUEST)"
        side_effects:
          - "open_critical_finding_count := count of CRITICAL findings"
          - "Recompute site open_critical_finding_count and release_posture"
      - from: FINDINGS_ISSUED
        to: CLOSED
        trigger: "POST /inspections/{id}/action (action=CLOSE)"
        actor: RegulatoryAffairsSpecialist
        preconditions:
          - "Inspection status == FINDINGS_ISSUED (ERR_INVALID_INSPECTION_STATE)"
          - "response_summary is required (ERR_INVALID_REQUEST)"
        side_effects:
          - "open_critical_finding_count := 0"
          - "Recompute site open_critical_finding_count and release_posture"

  - entity: MaterialLot
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: QUARANTINED
        trigger: "POST /materials/{id}/hold (quarantined=true)"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: QUARANTINED
        to: AVAILABLE
        trigger: "POST /materials/{id}/hold (quarantined=false)"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: test-create-stale-batch-version
    parent_entity: BatchLot
    write_endpoint: "POST /batches/{id}/tests"
    occ_field: expected_batch_version
    description: |
      Recording an InProcessTest against a BatchLot whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just recorded a test (including a retest that
      legitimately supersedes the same INVALIDATED predecessor under the
      supersession rule) and the current writer's view of the batch is
      therefore stale.
    error_id: ERR_STALE_BATCH_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: allocated_hours
    trigger: "campaign creation (POST /trains/{id}/campaigns)"
    algorithm: nested_rounding
    formula: |
      raw_upstream = campaign.upstream_hours
      raw_downstream = campaign.downstream_hours
      upstream_component = ceil(raw_upstream / SEED_SHIFT_HOURS) * SEED_SHIFT_HOURS
      downstream_component = ceil(raw_downstream / PRODUCTION_BLOCK_HOURS) * PRODUCTION_BLOCK_HOURS
      # changeover component: consider existing campaigns on the SAME train with
      # status in {PROPOSED, ALLOCATED, SEED_IN_PROGRESS, PRODUCTION_IN_PROGRESS}
      # whose planned_end_utc <= this campaign's planned_start_utc; the predecessor
      # is the one with the LATEST planned_end_utc (tie-break: latest created_at).
      # If no predecessor exists: changeover_component = 0.
      # Else if predecessor.product_id == this.product_id:
      #   gap_hours = this product's same_product_turnaround_hours
      # Else: gap_hours = max(predecessor product.changeover_hours, this product.changeover_hours)
      # changeover_component = ceil(gap_hours / CHANGEOVER_BLOCK_HOURS) * CHANGEOVER_BLOCK_HOURS
      allocated_hours = upstream_component + downstream_component + changeover_component
      # PINNED ORDER: each component is rounded UP to its own block granularity
      # BEFORE summation. Rounding the raw sum once is NON-CONFORMANT.
    input_set: "the new campaign plus campaigns on the same train with status in {PROPOSED, ALLOCATED, SEED_IN_PROGRESS, PRODUCTION_IN_PROGRESS}"
    constants:
      SEED_SHIFT_HOURS: 8
      PRODUCTION_BLOCK_HOURS: 24
      CHANGEOVER_BLOCK_HOURS: 4
    precision: "integer hours; round each component UP to its block granularity before summing"

  - name: train_window_conflict
    trigger: "campaign creation and POST /campaigns/{id}/advance (to_status=ALLOCATED)"
    algorithm: interval_merge
    formula: |
      Campaign windows on a train are half-open intervals [planned_start_utc, planned_end_utc).
      For the candidate campaign B and each other campaign A on the same train with
      status in {PROPOSED, ALLOCATED, SEED_IN_PROGRESS, PRODUCTION_IN_PROGRESS}:
        if A.product_id == B.product_id: g = product.same_product_turnaround_hours
        else: g = max(A product.changeover_hours, B product.changeover_hours)
        conflict UNLESS (B.planned_start_utc >= A.planned_end_utc + g hours
                         OR B.planned_end_utc + g hours <= A.planned_start_utc)
      A gap of exactly g hours is ALLOWED (>= semantics). Any overlap or shortfall
      of even one second is a conflict (ERR_TRAIN_WINDOW_CONFLICT).
    input_set: "campaigns on the same train with status in {PROPOSED, ALLOCATED, SEED_IN_PROGRESS, PRODUCTION_IN_PROGRESS}"
    precision: "second precision on datetimes"

  - name: firm_capacity_waterfall
    trigger: "POST /campaigns/{id}/advance (to_status=ALLOCATED)"
    algorithm: waterfall_allocation
    formula: |
      Let M = the calendar month (UTC) containing the candidate campaign's planned_start_utc,
      and S = the site of the candidate's train.
      firm_consumed = SUM(allocated_hours) over campaigns at site S with
        status in {ALLOCATED, SEED_IN_PROGRESS, PRODUCTION_IN_PROGRESS}
        whose planned_start_utc falls in M.
      available = site.monthly_capacity_hours - firm_consumed
      If candidate.allocated_hours <= available: allocation succeeds.
      Else if candidate.demand_type == CLINICAL:
        preemption candidates = campaigns at site S with demand_type == COMMERCIAL,
          status == ALLOCATED, and planned_start_utc in M.
        Rank by planned_start_utc DESC, tie-break created_at ASC.
        Preempt (ALLOCATED -> PREEMPTED) one at a time in rank order, recomputing
        available after each preemption, until available >= candidate.allocated_hours
        (allocation succeeds) or candidates are exhausted (ERR_CAPACITY_EXCEEDED).
      Else (COMMERCIAL candidate): ERR_CAPACITY_EXCEEDED.
      # Boundary: allocated_hours == available exactly is SUFFICIENT (<= semantics).
    input_set: "campaigns at the same site whose planned_start_utc falls in the same calendar month"
    precision: "integer hours"
    note: "created_at values of preemption candidates are distinct whenever the logical clock is moved between their creations; fixtures must position the clock to avoid exact ties"

  - name: seed_train_timing
    trigger: "POST /seed-stages/{id}/advance (to_status=RUNNING) and campaign advance to PRODUCTION_IN_PROGRESS"
    algorithm: chronological
    formula: |
      Stages execute strictly in stage_index order (chronological chain).
      Stage N (N > 1) may enter RUNNING only while
        logical_clock - completed_at(stage N-1) <= TRANSFER_WINDOW_HOURS.
      A rejected attempt flips stage N-1 from COMPLETED to EXPIRED; an EXPIRED or
      FAILED stage may re-enter RUNNING (retry), clearing completed_at.
      Campaign may enter PRODUCTION_IN_PROGRESS only while
        logical_clock - max(completed_at over all stages) <= INOCULATION_WINDOW_HOURS.
      # Boundary: exactly TRANSFER_WINDOW_HOURS / INOCULATION_WINDOW_HOURS elapsed is ALLOWED (<=).
    constants:
      TRANSFER_WINDOW_HOURS: 36
      INOCULATION_WINDOW_HOURS: 24
    precision: "second precision on datetimes"

  - name: batch_yield
    trigger: "batch creation (provisional variant); batch advance to PROCESS_COMPLETE (final variant)"
    algorithm: aggregation
    formula: |
      Provisional variant (at batch creation):
        provisional_yield_units = floor(train.capacity_liters * DESIGN_TITER_G_PER_L
                                        * UNITS_PER_GRAM * PROVISIONAL_RECOVERY_FACTOR)
        quantity_units := provisional_yield_units
      Final variant (at PROCESS_COMPLETE):
        avg_titer = mean of measured_value over the batch's VERIFIED tests with
                    test_type == TITER and phase == DOWNSTREAM
                    (4 decimal places, round_half_up)
        final_yield_units = floor(avg_titer * train.capacity_liters * UNITS_PER_GRAM)
        quantity_units := final_yield_units
      If no VERIFIED DOWNSTREAM TITER test exists, avg_titer := DESIGN_TITER_G_PER_L.
    input_set: "VERIFIED InProcessTests of the batch with test_type TITER and phase DOWNSTREAM"
    constants:
      DESIGN_TITER_G_PER_L: 2.0
      UNITS_PER_GRAM: 125
      PROVISIONAL_RECOVERY_FACTOR: 0.8
    precision: "avg_titer 4 decimal places round_half_up; yields integer via floor"
    variants:
      - name: provisional
        when: "batch creation until PROCESS_COMPLETE"
        difference: "Uses train design capacity and the fixed recovery factor; ignores measured titers"
      - name: final
        when: "from PROCESS_COMPLETE onward"
        difference: "Uses the mean of measured VERIFIED DOWNSTREAM TITER results; replaces quantity_units and re-derives available_to_ship_units"

  - name: excursion_evaluation
    trigger: "POST /shipments/{id}/evaluate-excursion (shipment must be EXCURSION_HOLD)"
    algorithm: threshold
    formula: |
      Let R = all TemperatureReadings of the shipment, P = the batch's product.
      Variant SCREENING (shipment.market_type == CLINICAL):
        ACCEPTABLE iff every reading satisfies P.min_storage_temp_c <= t <= P.max_storage_temp_c
        AND count(readings with t > P.max_storage_temp_c) <= SCREENING_MAX_EXCURSION_COUNT.
      Variant MKT (shipment.market_type == COMMERCIAL):
        T_i in Kelvin = temperature_c + 273.15.
        MKT_K = -(DELTA_H_KJ_MOL / R_GAS) / ln( mean over readings of exp( -(DELTA_H_KJ_MOL/R_GAS) / T_i ) )
        MKT_C = MKT_K - 273.15, rounded to 3 decimal places round_half_up BEFORE comparison.
        ACCEPTABLE iff MKT_C <= P.max_storage_temp_c + MKT_ALLOWANCE_C
          AND max(readings) <= P.max_storage_temp_c + SPIKE_ALLOWANCE_C
          AND min(readings) >= P.min_storage_temp_c - FREEZE_ALLOWANCE_C.
      Otherwise UNACCEPTABLE.
      # DELTA_H_KJ_MOL / R_GAS = 83.14472 / 0.008314472 = 10000.0 exactly.
      # Boundary: MKT_C == max + MKT_ALLOWANCE_C exactly is ACCEPTABLE (<=).
    input_set: "all TemperatureReadings of the shipment"
    constants:
      DELTA_H_KJ_MOL: 83.14472
      R_GAS: 0.008314472
      MKT_ALLOWANCE_C: 1.0
      SPIKE_ALLOWANCE_C: 5.0
      FREEZE_ALLOWANCE_C: 0.5
      SCREENING_MAX_EXCURSION_COUNT: 2
    precision: "MKT_C 3 decimal places round_half_up before comparison"
    variants:
      - name: screening
        when: "shipment.market_type == CLINICAL"
        difference: "Count-and-band rule only; no kinetic averaging"
      - name: mkt
        when: "shipment.market_type == COMMERCIAL"
        difference: "Mean-kinetic-temperature rule with three guards; can accept series that screening rejects and vice versa"

  - name: expiry_dating
    trigger: "batch advance to PROCESS_COMPLETE; shipment DELIVER; disposition of COMMERCIAL batches"
    algorithm: projection
    formula: |
      expiry_utc = process_completed_at + product.shelf_life_hours (projection).
      Shipment DELIVER requires logical_clock <= expiry_utc (ERR_BATCH_EXPIRED; exactly at expiry is ALLOWED).
      Disposition RELEASED of a COMMERCIAL batch requires
        expiry_utc - logical_clock >= MIN_REMAINING_SHELF_LIFE_HOURS
      (ERR_INSUFFICIENT_REMAINING_SHELF_LIFE; exactly 720 hours remaining is ALLOWED).
    constants:
      MIN_REMAINING_SHELF_LIFE_HOURS: 720
    precision: "second precision on datetimes"

  - name: comparability_equivalence
    trigger: "POST /comparability-studies/{id}/action (action=RECORD_ASSESSMENT)"
    algorithm: constraint_propagation
    formula: |
      # PINNED EVALUATION ORDER (the exclusion set depends on statistics of the
      # full baseline INCLUDING exclusion candidates — compute once, exclude once,
      # never re-iterate):
      1. mu0 = mean(baseline_attribute_values); sd0 = population standard deviation
         (ddof=0) of baseline_attribute_values.
      2. Exclude baseline values outside [mu0 - EXCLUSION_SIGMA * sd0, mu0 + EXCLUSION_SIGMA * sd0].
      3. mu1 = mean of the surviving baseline values, recomputed EXACTLY ONCE
         (4 decimal places, round_half_up). sd is NOT recomputed and no second
         exclusion pass occurs.
      4. equivalence_margin = max(ABS_MARGIN, REL_MARGIN * mu1) (4 decimal places, round_half_up).
      5. candidate value for each candidate batch = measured_value of its most recently
         created (created_at DESC) VERIFIED test with test_type == PURITY and
         phase == DOWNSTREAM; missing for any candidate -> ERR_STUDY_DATA_MISSING.
      6. Verdict COMPARABLE iff every candidate value lies in
         [mu1 - equivalence_margin, mu1 + equivalence_margin] (inclusive);
         else NOT_COMPARABLE.
      baseline_mean := mu1; equivalence_margin stored on the study.
    input_set: "study baseline_attribute_values plus the latest VERIFIED DOWNSTREAM PURITY test of each candidate batch"
    constants:
      EXCLUSION_SIGMA: 1.5
      ABS_MARGIN: 1.5
      REL_MARGIN: 0.03
    precision: "mu1 and margin 4 decimal places round_half_up"

  - name: site_release_posture
    trigger: "deviation open (OOS auto-create), deviation close/reopen, inspection ISSUE_FINDINGS/CLOSE"
    algorithm: threshold
    formula: |
      open_critical_deviation_count = count of Deviations with severity == CRITICAL
        and status in {OPEN, REOPENED} whose batch belongs to a campaign of a train
        of this site.
      open_critical_finding_count = SUM(open_critical_finding_count) over
        RegulatoryInspections of this site with status == FINDINGS_ISSUED.
      release_posture =
        FROZEN      if open_critical_finding_count >= 1
                      OR open_critical_deviation_count >= CRITICAL_DEVIATION_FREEZE_THRESHOLD
        CONDITIONAL if open_critical_deviation_count == 1
        CLEAR       otherwise
      # Boundary: exactly CRITICAL_DEVIATION_FREEZE_THRESHOLD open critical deviations
      # triggers FROZEN (>=); one fewer gives CONDITIONAL.
      On transition INTO FROZEN: every COMMERCIAL Campaign in PROPOSED at this site -> PREEMPTED.
      On transition OUT OF FROZEN: no campaign is resurrected (one-way cascade).
    input_set: "deviations of batches of campaigns of trains of the site; inspections of the site"
    constants:
      CRITICAL_DEVIATION_FREEZE_THRESHOLD: 2
    precision: "integer counts"

  - name: material_coverage
    trigger: "campaign advance to SEED_IN_PROGRESS"
    algorithm: threshold
    formula: |
      For each entry in the campaign product's required_materials
      ({material_name, base_quantity, is_single_source}):
        required = base_quantity * (1 + OVERAGE_FACTOR), 2 decimal places round_half_up.
        available = SUM(quantity_available) over MaterialLots at the campaign's site
          with matching material_name and status == AVAILABLE.
        If entry.is_single_source and available < required: ERR_SINGLE_SOURCE_MATERIAL_BLOCKED.
        Else if available < required: ERR_MATERIAL_SHORTAGE.
        (single-source check is evaluated before the generic shortage check.)
      On success, consume per entry: iterate matching AVAILABLE lots in created_at ASC
      order, decrementing quantity_available by min(lot.quantity_available, remaining)
      until required is covered.
      # Boundary: available == required exactly is SUFFICIENT (>= semantics).
    input_set: "MaterialLots at the campaign's site with status AVAILABLE and matching material_name"
    constants:
      OVERAGE_FACTOR: 0.10
    precision: "required quantity 2 decimal places round_half_up"

  - name: cold_storage_occupancy
    trigger: "shipment creation"
    algorithm: aggregation
    formula: |
      occupied = SUM(quantity_units) over Shipments with status == PLANNED whose
        batch belongs to a campaign of a train of this site.
      Shipment creation requires occupied + new quantity_units <= site.cold_storage_capacity_units
      (ERR_COLD_STORAGE_CAPACITY_EXCEEDED).
      Occupancy is released when the shipment leaves PLANNED (SHIP, CANCEL, or quarantine cascade).
      # Aggregate semantics: the constraint is on the SUM of co-located PLANNED
      # shipments, not on pairwise interval overlap. Boundary: == capacity exactly is ALLOWED.
    input_set: "Shipments with status PLANNED at the site"
    precision: "integer units"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role named by X-User-Role must be listed for this endpoint in the RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path ids must exist, validated left-to-right; body-supplied references (product_id, supersedes_test_id, baseline/candidate batch ids) must exist"
    error_id: "ERR_SITE_NOT_FOUND | ERR_PRODUCT_NOT_FOUND | ERR_TRAIN_NOT_FOUND | ERR_CAMPAIGN_NOT_FOUND | ERR_SEED_STAGE_NOT_FOUND | ERR_BATCH_NOT_FOUND | ERR_TEST_NOT_FOUND | ERR_DEVIATION_NOT_FOUND | ERR_SHIPMENT_NOT_FOUND | ERR_MATERIAL_NOT_FOUND | ERR_INSPECTION_NOT_FOUND | ERR_COMPARABILITY_STUDY_NOT_FOUND"
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 3.2
    category: business_constraint
    check: "Request body well-formed: required fields present, enum members valid, planned_end_utc strictly after planned_start_utc, spec_min < spec_max, quantity units >= 1, action value supported by the endpoint, numeric ranges respected"
    error_id: "ERR_INVALID_REQUEST | ERR_INVALID_SPEC_BOUNDS | ERR_UNSUPPORTED_ACTION"
    http_status: 400
    applies_to: "all mutation endpoints"

  - priority: 3.5
    category: concurrency
    check: "expected_batch_version must equal the batch's current version (OCC; checked before any business rule)"
    error_id: ERR_STALE_BATCH_VERSION
    http_status: 412
    applies_to: "POST /batches/{id}/tests"

  - priority: 4
    category: state
    check: "Target resource state must admit the requested transition (campaign/batch/test/deviation/shipment/study/inspection/seed-stage state machines)"
    error_id: "ERR_INVALID_CAMPAIGN_STATE | ERR_INVALID_BATCH_STATE | ERR_TEST_NOT_RECORDED | ERR_DEVIATION_NOT_OPEN | ERR_INVALID_SHIPMENT_STATE | ERR_INVALID_STUDY_STATE | ERR_INVALID_INSPECTION_STATE | ERR_INVALID_SEED_STAGE_STATE"
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 5
    category: business_safety
    check: "Four-eyes: the verifying user must differ from the recording user"
    error_id: ERR_FOUR_EYES_VIOLATION
    http_status: 403
    applies_to: "POST /tests/{id}/verify"

  - priority: 6
    category: business_safety
    check: "Segregation of duties: disposition user must not be the batch manufacturer nor a verifier of any VERIFIED test on the batch"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /batches/{id}/disposition"

  - priority: 7
    category: business_safety
    check: "Site posture gate: COMMERCIAL batch release requires release_posture != FROZEN"
    error_id: ERR_SITE_RELEASE_FROZEN
    http_status: 409
    applies_to: "POST /batches/{id}/disposition (decision=RELEASED)"

  - priority: 8
    category: business_safety
    check: "Remaining shelf life at disposition must be >= 720 hours for COMMERCIAL batches"
    error_id: ERR_INSUFFICIENT_REMAINING_SHELF_LIFE
    http_status: 409
    applies_to: "POST /batches/{id}/disposition (decision=RELEASED)"

  - priority: 9
    category: business_referential
    check: "Comparability gate: if the product has any ComparabilityStudy, the most recently created one must be FILED for COMMERCIAL release"
    error_id: ERR_COMPARABILITY_NOT_ESTABLISHED
    http_status: 409
    applies_to: "POST /batches/{id}/disposition (decision=RELEASED)"

  - priority: 10
    category: business_referential
    check: "Shipment creation requires batch quality_status == RELEASED"
    error_id: ERR_BATCH_NOT_RELEASED
    http_status: 409
    applies_to: "POST /batches/{id}/shipments"

  - priority: 11
    category: business_referential
    check: "At most one BatchLot per Campaign"
    error_id: ERR_BATCH_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /campaigns/{id}/batches"

  - priority: 12
    category: business_referential
    check: "supersedes_test_id must reference an INVALIDATED test on the same batch with the same test_type and phase"
    error_id: ERR_SUPERSEDE_TARGET_NOT_INVALIDATED
    http_status: 409
    applies_to: "POST /batches/{id}/tests (when supersedes_test_id present)"

  - priority: 13
    category: business_referential
    check: "Every candidate batch of a comparability assessment must have a VERIFIED DOWNSTREAM PURITY test"
    error_id: ERR_STUDY_DATA_MISSING
    http_status: 409
    applies_to: "POST /comparability-studies/{id}/action (action=RECORD_ASSESSMENT)"

  - priority: 14
    category: business_temporal
    check: "Train window conflict incl. product changeover / same-product turnaround gap (half-open intervals, exact gap allowed)"
    error_id: ERR_TRAIN_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /trains/{id}/campaigns, POST /campaigns/{id}/advance (to_status=ALLOCATED)"

  - priority: 15
    category: business_temporal
    check: "Logical clock must be >= planned_start_utc at seed-train start"
    error_id: ERR_CAMPAIGN_START_TOO_EARLY
    http_status: 409
    applies_to: "POST /campaigns/{id}/advance (to_status=SEED_IN_PROGRESS)"

  - priority: 16
    category: business_temporal
    check: "Seed stage N may start only within 36 hours of stage N-1 completion"
    error_id: ERR_SEED_TRANSFER_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /seed-stages/{id}/advance (to_status=RUNNING)"

  - priority: 17
    category: business_temporal
    check: "Production may start only within 24 hours of the last seed stage completion"
    error_id: ERR_SEED_INOCULATION_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /campaigns/{id}/advance (to_status=PRODUCTION_IN_PROGRESS)"

  - priority: 18
    category: business_temporal
    check: "Delivery must occur at or before batch expiry_utc"
    error_id: ERR_BATCH_EXPIRED
    http_status: 409
    applies_to: "POST /shipments/{id}/action (action=DELIVER)"

  - priority: 19
    category: business_constraint
    check: "Product molecule_type must be in the train's supported_molecule_types"
    error_id: ERR_TRAIN_PRODUCT_INCOMPATIBLE
    http_status: 409
    applies_to: "POST /trains/{id}/campaigns"

  - priority: 20
    category: business_constraint
    check: "Campaign demand_type must be permitted by product market_scope; shipment market_type must equal the campaign demand_type"
    error_id: ERR_MARKET_SCOPE_VIOLATION
    http_status: 422
    applies_to: "POST /trains/{id}/campaigns, POST /batches/{id}/shipments"

  - priority: 21
    category: business_constraint
    check: "Test phase must equal the batch's current process phase; tests may only be recorded while process_status in {UPSTREAM, DOWNSTREAM}"
    error_id: ERR_TEST_PHASE_MISMATCH
    http_status: 409
    applies_to: "POST /batches/{id}/tests"

  - priority: 22
    category: business_constraint
    check: "Process phase advance requires all tests of the relevant scope terminal in {VERIFIED, INVALIDATED} with at least one VERIFIED test of the completed phase"
    error_id: ERR_UNRESOLVED_TESTS
    http_status: 409
    applies_to: "POST /batches/{id}/advance (to_status=DOWNSTREAM | PROCESS_COMPLETE)"

  - priority: 23
    category: business_constraint
    check: "Seed-train start requires at least one defined stage; production start requires all stages COMPLETED; stage start requires all lower-indexed stages COMPLETED"
    error_id: "ERR_NO_SEED_STAGES_DEFINED | ERR_SEED_STAGES_INCOMPLETE | ERR_SEED_STAGE_ORDER_VIOLATION"
    http_status: 409
    applies_to: "POST /campaigns/{id}/advance (to_status=SEED_IN_PROGRESS | PRODUCTION_IN_PROGRESS), POST /seed-stages/{id}/advance (to_status=RUNNING)"

  - priority: 24
    category: business_safety
    check: "Single-source required material must have sufficient AVAILABLE stock (evaluated before the generic shortage check)"
    error_id: ERR_SINGLE_SOURCE_MATERIAL_BLOCKED
    http_status: 409
    applies_to: "POST /campaigns/{id}/advance (to_status=SEED_IN_PROGRESS)"

  - priority: 25
    category: business_constraint
    check: "Multi-source required material must have sufficient AVAILABLE stock"
    error_id: ERR_MATERIAL_SHORTAGE
    http_status: 409
    applies_to: "POST /campaigns/{id}/advance (to_status=SEED_IN_PROGRESS)"

  - priority: 26
    category: business_constraint
    check: "Shipment quantity_units must be <= batch available_to_ship_units"
    error_id: ERR_SHIPMENT_QUANTITY_EXCEEDS_AVAILABLE
    http_status: 409
    applies_to: "POST /batches/{id}/shipments"

  - priority: 27
    category: business_fiscal
    check: "Firm monthly capacity waterfall at allocation (with CLINICAL preemption selector)"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /campaigns/{id}/advance (to_status=ALLOCATED)"

  - priority: 28
    category: business_fiscal
    check: "Aggregate cold-storage capacity at the origin site must admit the new PLANNED shipment"
    error_id: ERR_COLD_STORAGE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /batches/{id}/shipments"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Before any call, the logical clock reads exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects: ["logical clock set; no entity mutated"]

  # --- Sites ---
  - method: POST
    path: "/sites"
    description: "Create a manufacturing site"
    roles: [PlatformAdmin]
    code: 201
    input: [name, region, monthly_capacity_hours, cold_storage_capacity_units, licensed_authorities]
    output: ManufacturingSite
    side_effects: ["release_posture := CLEAR; open counts := 0"]

  - method: GET
    path: "/sites/{id}"
    description: "Get a site incl. computed posture fields"
    roles: [Any]
    code: 200
    input: []
    output: ManufacturingSite
    side_effects: []

  # --- Bioreactor trains ---
  - method: POST
    path: "/sites/{id}/trains"
    description: "Create a bioreactor train at a site"
    roles: [PlatformAdmin]
    code: 201
    input: [train_code, capacity_liters, supported_molecule_types]
    output: BioreactorTrain
    side_effects: []

  - method: GET
    path: "/sites/{id}/trains"
    description: "List trains of a site"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "BioreactorTrain[]"
    side_effects: []

  # --- Materials ---
  - method: POST
    path: "/sites/{id}/materials"
    description: "Register a raw material lot at a site"
    roles: [PlatformAdmin]
    code: 201
    input: [material_name, is_single_source, quantity]
    output: MaterialLot
    side_effects: ["quantity_available := quantity; status := AVAILABLE"]

  - method: GET
    path: "/sites/{id}/materials"
    description: "List material lots of a site"
    roles: [Any]
    code: 200
    input: ["material_name?", "status?", "limit?", "offset?"]
    output: "MaterialLot[]"
    side_effects: []

  - method: POST
    path: "/materials/{id}/hold"
    description: "Quarantine or release a material lot"
    roles: [PlatformAdmin]
    code: 200
    input: [quarantined]
    output: MaterialLot
    side_effects: ["status := QUARANTINED when quarantined true, AVAILABLE when false"]

  # --- Regulatory inspections ---
  - method: POST
    path: "/sites/{id}/inspections"
    description: "Register an announced inspection by a health authority"
    roles: [RegulatoryAffairsSpecialist]
    code: 201
    input: [authority]
    output: RegulatoryInspection
    side_effects: ["status := ANNOUNCED"]

  - method: GET
    path: "/sites/{id}/inspections"
    description: "List inspections of a site"
    roles: [Any]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "RegulatoryInspection[]"
    side_effects: []

  - method: POST
    path: "/inspections/{id}/action"
    description: "Advance an inspection: ISSUE_FINDINGS (findings) or CLOSE (response_summary)"
    roles: [RegulatoryAffairsSpecialist]
    code: 200
    input: ["action", "findings?", "response_summary?"]
    output: RegulatoryInspection
    side_effects: ["state transition per RegulatoryInspection machine", "site posture recomputed"]

  # --- Products ---
  - method: POST
    path: "/products"
    description: "Create a product master"
    roles: [PlatformAdmin]
    code: 201
    input: [product_code, molecule_type, market_scope, requires_cold_chain, min_storage_temp_c, max_storage_temp_c, shelf_life_hours, changeover_hours, same_product_turnaround_hours, required_materials]
    output: Product
    side_effects: []

  - method: GET
    path: "/products/{id}"
    description: "Get a product"
    roles: [Any]
    code: 200
    input: []
    output: Product
    side_effects: []

  # --- Comparability studies ---
  - method: POST
    path: "/products/{id}/comparability-studies"
    description: "Create a comparability study for a process/site change"
    roles: [RegulatoryAffairsSpecialist]
    code: 201
    input: [change_type, baseline_attribute_values, candidate_batch_ids]
    output: ComparabilityStudy
    side_effects: ["status := PLANNED"]

  - method: GET
    path: "/products/{id}/comparability-studies"
    description: "List comparability studies of a product"
    roles: [Any]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ComparabilityStudy[]"
    side_effects: []

  - method: POST
    path: "/comparability-studies/{id}/action"
    description: "Advance a study: APPROVE_PROTOCOL, RECORD_ASSESSMENT, or SUBMIT_FILING (authority)"
    roles: [RegulatoryAffairsSpecialist]
    code: 200
    input: ["action", "authority?"]
    output: ComparabilityStudy
    side_effects: ["state transition per ComparabilityStudy machine", "RECORD_ASSESSMENT computes baseline_mean and equivalence_margin"]

  # --- Campaigns ---
  - method: POST
    path: "/trains/{id}/campaigns"
    description: "Create a campaign (enters PROPOSED; window + compatibility + market checks run here)"
    roles: [ProcessEngineer]
    code: 201
    input: [product_id, demand_type, planned_start_utc, planned_end_utc, upstream_hours, downstream_hours]
    output: Campaign
    side_effects: ["status := PROPOSED", "allocated_hours computed (allocated_hours calculation)"]

  - method: GET
    path: "/campaigns"
    description: "List campaigns with filters"
    roles: [Any]
    code: 200
    input: ["site_id?", "train_id?", "product_id?", "demand_type?", "status?", "limit?", "offset?"]
    output: "Campaign[]"
    side_effects: []

  - method: GET
    path: "/campaigns/{id}"
    description: "Get a campaign"
    roles: [Any]
    code: 200
    input: []
    output: Campaign
    side_effects: []

  - method: POST
    path: "/campaigns/{id}/advance"
    description: "Advance a campaign: ALLOCATED, PROPOSED (de-allocation), SEED_IN_PROGRESS, or PRODUCTION_IN_PROGRESS"
    roles: [ProcessEngineer]
    code: 200
    input: [to_status]
    output: Campaign
    side_effects: ["state transition per Campaign machine incl. capacity waterfall, material consumption, preemption cascades"]

  # --- Seed train stages ---
  - method: POST
    path: "/campaigns/{id}/seed-stages"
    description: "Define a seed train stage for a campaign"
    roles: [ProcessEngineer]
    code: 201
    input: [stage_index, planned_duration_hours]
    output: SeedTrainStage
    side_effects: ["status := PENDING"]

  - method: GET
    path: "/campaigns/{id}/seed-stages"
    description: "List seed stages of a campaign"
    roles: [Any]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "SeedTrainStage[]"
    side_effects: []

  - method: POST
    path: "/seed-stages/{id}/advance"
    description: "Advance a seed stage: RUNNING (incl. retry from FAILED/EXPIRED), COMPLETED, or FAILED"
    roles: [ProcessEngineer]
    code: 200
    input: [to_status]
    output: SeedTrainStage
    side_effects: ["state transition per SeedTrainStage machine incl. transfer-window expiry side effect"]

  # --- Batch lots ---
  - method: POST
    path: "/campaigns/{id}/batches"
    description: "Create the batch lot of a campaign in PRODUCTION_IN_PROGRESS"
    roles: [ManufacturingOperator]
    code: 201
    input: [lot_number]
    output: BatchLot
    side_effects: ["process_status := UPSTREAM; quality_status := IN_TESTING", "manufactured_by_user_id := X-User-ID", "provisional yield computed; quantity_units := provisional_yield_units"]

  - method: GET
    path: "/campaigns/{id}/batches"
    description: "List batches of a campaign (0 or 1 element)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "BatchLot[]"
    side_effects: []

  - method: GET
    path: "/batches/{id}"
    description: "Get a batch incl. computed yield and posture fields"
    roles: [Any]
    code: 200
    input: []
    output: BatchLot
    side_effects: []

  - method: POST
    path: "/batches/{id}/advance"
    description: "Advance the process dimension: DOWNSTREAM, PROCESS_COMPLETE, or TERMINATED"
    roles: [ManufacturingOperator]
    code: 200
    input: [to_status]
    output: BatchLot
    side_effects: ["state transition per BatchLot process machine incl. final yield, expiry, campaign completion cascade"]

  - method: POST
    path: "/batches/{id}/submit-for-review"
    description: "Submit the completed batch record for quality disposition"
    roles: [QualityAssuranceReviewer]
    code: 200
    input: []
    output: BatchLot
    side_effects: ["quality_status READY_FOR_REVIEW -> PENDING_DISPOSITION"]

  - method: POST
    path: "/batches/{id}/disposition"
    description: "Disposition decision on a batch (release or reject) with segregation-of-duties, posture, shelf-life, and comparability gates"
    roles: [QualityAssuranceReviewer]
    code: 200
    input: [decision, rationale]
    output: BatchLot
    side_effects: ["quality_status PENDING_DISPOSITION -> RELEASED | REJECTED", "REJECTED cancels PLANNED shipments"]

  # --- In-process tests ---
  - method: POST
    path: "/batches/{id}/tests"
    description: "Record an in-process test result (optionally a retest superseding an INVALIDATED test); OCC via expected_batch_version"
    roles: [ManufacturingOperator]
    code: 201
    input: [test_type, phase, measured_value, unit, spec_min, spec_max, expected_batch_version, "supersedes_test_id?"]
    output: InProcessTest
    side_effects: ["status := RECORDED", "is_in_spec computed", "increments BatchLot.version by 1"]

  - method: GET
    path: "/batches/{id}/tests"
    description: "List tests of a batch"
    roles: [Any]
    code: 200
    input: ["status?", "phase?", "limit?", "offset?"]
    output: "InProcessTest[]"
    side_effects: []

  - method: POST
    path: "/tests/{id}/verify"
    description: "Verify a recorded test (four-eyes); in-spec -> VERIFIED, out-of-spec -> OOS_SUSPECT with auto deviation"
    roles: [QualityControlAnalyst]
    code: 200
    input: []
    output: InProcessTest
    side_effects: ["state transition per InProcessTest machine", "OOS auto-deviation and posture cascade when out of spec"]

  # --- Deviations (incl. OOS investigations and product complaints) ---
  - method: POST
    path: "/batches/{id}/deviations"
    description: "Raise a PROCESS deviation or register a COMPLAINT against a batch (OOS deviations are system-created only)"
    roles: [ManufacturingOperator, QualityControlAnalyst, QualityAssuranceReviewer]
    code: 201
    input: [kind, severity, description]
    output: Deviation
    side_effects: ["status := OPEN", "CRITICAL deviations recompute site posture", "CRITICAL open on a batch in {READY_FOR_REVIEW, PENDING_DISPOSITION} puts quality UNDER_INVESTIGATION"]

  - method: GET
    path: "/batches/{id}/deviations"
    description: "List deviations of a batch"
    roles: [Any]
    code: 200
    input: ["kind?", "status?", "severity?", "limit?", "offset?"]
    output: "Deviation[]"
    side_effects: []

  - method: POST
    path: "/deviations/{id}/action"
    description: "CLOSE (conclusion, capa_summary) or REOPEN (justification) a deviation"
    roles: [QualityAssuranceReviewer]
    code: 200
    input: ["action", "conclusion?", "capa_summary?", "justification?"]
    output: Deviation
    side_effects: ["state transition per Deviation machine incl. test invalidation, batch hold release, quarantine cascade, posture recompute"]

  # --- Shipments & cold chain ---
  - method: POST
    path: "/batches/{id}/shipments"
    description: "Plan a shipment of a RELEASED batch (occupies cold storage until shipped)"
    roles: [SupplyPlanner]
    code: 201
    input: [destination_region, market_type, quantity_units]
    output: Shipment
    side_effects: ["status := PLANNED", "cold-storage occupancy increases"]

  - method: GET
    path: "/batches/{id}/shipments"
    description: "List shipments of a batch"
    roles: [Any]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Shipment[]"
    side_effects: []

  - method: GET
    path: "/shipments/{id}"
    description: "Get a shipment"
    roles: [Any]
    code: 200
    input: []
    output: Shipment
    side_effects: []

  - method: POST
    path: "/shipments/{id}/action"
    description: "SHIP, DELIVER, or CANCEL a shipment"
    roles: [SupplyPlanner]
    code: 200
    input: [action]
    output: Shipment
    side_effects: ["state transition per Shipment machine incl. storage release and expiry gate"]

  - method: POST
    path: "/shipments/{id}/readings"
    description: "Record a temperature reading; detection guards may flip the shipment to EXCURSION_HOLD"
    roles: [SupplyPlanner]
    code: 201
    input: [recorded_at, temperature_c]
    output: TemperatureReading
    side_effects: ["excursion detection per Shipment machine"]

  - method: GET
    path: "/shipments/{id}/readings"
    description: "List temperature readings of a shipment"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "TemperatureReading[]"
    side_effects: []

  - method: POST
    path: "/shipments/{id}/evaluate-excursion"
    description: "Evaluate an excursion on hold; system applies the SCREENING or MKT variant by market_type and transitions accordingly"
    roles: [QualityAssuranceReviewer]
    code: 200
    input: []
    output: Shipment
    side_effects: ["excursion_evaluation computed (excursion_evaluation calculation)", "EXCURSION_HOLD -> IN_TRANSIT | QUARANTINED"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role is not permitted to call this endpoint" }

  # --- Existence ---
  - { id: ERR_SITE_NOT_FOUND, http: 404, condition: "No ManufacturingSite with the given id" }
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "No Product with the given id (path or body reference)" }
  - { id: ERR_TRAIN_NOT_FOUND, http: 404, condition: "No BioreactorTrain with the given id" }
  - { id: ERR_CAMPAIGN_NOT_FOUND, http: 404, condition: "No Campaign with the given id" }
  - { id: ERR_SEED_STAGE_NOT_FOUND, http: 404, condition: "No SeedTrainStage with the given id" }
  - { id: ERR_BATCH_NOT_FOUND, http: 404, condition: "No BatchLot with the given id (path or study candidate reference)" }
  - { id: ERR_TEST_NOT_FOUND, http: 404, condition: "No InProcessTest with the given id (path or supersedes reference)" }
  - { id: ERR_DEVIATION_NOT_FOUND, http: 404, condition: "No Deviation with the given id" }
  - { id: ERR_SHIPMENT_NOT_FOUND, http: 404, condition: "No Shipment with the given id" }
  - { id: ERR_MATERIAL_NOT_FOUND, http: 404, condition: "No MaterialLot with the given id" }
  - { id: ERR_INSPECTION_NOT_FOUND, http: 404, condition: "No RegulatoryInspection with the given id" }
  - { id: ERR_COMPARABILITY_STUDY_NOT_FOUND, http: 404, condition: "No ComparabilityStudy with the given id" }

  # --- Input validation ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum member, malformed datetime, empty findings array, inadmissible conclusion for the deviation kind, missing capa_summary for a CRITICAL close, missing justification for REOPEN, or other schema violation" }
  - { id: ERR_INVALID_SPEC_BOUNDS, http: 400, condition: "spec_min >= spec_max on test record" }
  - { id: ERR_UNSUPPORTED_ACTION, http: 400, condition: "action or to_status value not supported by the target endpoint" }

  # --- Concurrency ---
  - { id: ERR_STALE_BATCH_VERSION, http: 412, condition: "expected_batch_version does not equal the batch's current version" }

  # --- State machine guards ---
  - { id: ERR_INVALID_CAMPAIGN_STATE, http: 409, condition: "Campaign status does not admit the requested transition (or a seed-stage advance requires SEED_IN_PROGRESS)" }
  - { id: ERR_INVALID_BATCH_STATE, http: 409, condition: "Batch process_status or quality_status does not admit the requested operation" }
  - { id: ERR_TEST_NOT_RECORDED, http: 409, condition: "Test status is not RECORDED (verify requires RECORDED)" }
  - { id: ERR_DEVIATION_NOT_OPEN, http: 409, condition: "Deviation status does not admit the requested action (CLOSE needs OPEN or REOPENED; REOPEN needs CLOSED)" }
  - { id: ERR_INVALID_SHIPMENT_STATE, http: 409, condition: "Shipment status does not admit the requested action" }
  - { id: ERR_INVALID_STUDY_STATE, http: 409, condition: "ComparabilityStudy status does not admit the requested action" }
  - { id: ERR_INVALID_INSPECTION_STATE, http: 409, condition: "RegulatoryInspection status does not admit the requested action" }
  - { id: ERR_INVALID_SEED_STAGE_STATE, http: 409, condition: "SeedTrainStage status does not admit the requested transition" }

  # --- Safety / compliance ---
  - { id: ERR_FOUR_EYES_VIOLATION, http: 403, condition: "Verifying user equals the recording user of the test" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Disposition user equals the batch's manufactured_by_user_id or a verifier of one of its VERIFIED tests" }
  - { id: ERR_SITE_RELEASE_FROZEN, http: 409, condition: "Site release_posture is FROZEN; COMMERCIAL disposition blocked" }
  - { id: ERR_INSUFFICIENT_REMAINING_SHELF_LIFE, http: 409, condition: "Fewer than 720 hours remain until expiry at COMMERCIAL disposition time" }
  - { id: ERR_SINGLE_SOURCE_MATERIAL_BLOCKED, http: 409, condition: "A required single-source material has insufficient AVAILABLE stock at the site" }

  # --- Referential ---
  - { id: ERR_COMPARABILITY_NOT_ESTABLISHED, http: 409, condition: "COMMERCIAL release blocked: the product's most recent ComparabilityStudy is not FILED" }
  - { id: ERR_BATCH_NOT_RELEASED, http: 409, condition: "Shipment creation requires batch quality_status RELEASED" }
  - { id: ERR_BATCH_ALREADY_EXISTS, http: 409, condition: "The campaign already has a batch lot" }
  - { id: ERR_SUPERSEDE_TARGET_NOT_INVALIDATED, http: 409, condition: "supersedes_test_id does not reference an INVALIDATED test of the same batch, test_type, and phase" }
  - { id: ERR_STUDY_DATA_MISSING, http: 409, condition: "A candidate batch lacks a VERIFIED DOWNSTREAM PURITY test at assessment time" }

  # --- Temporal ---
  - { id: ERR_TRAIN_WINDOW_CONFLICT, http: 409, condition: "Planned window collides with another campaign on the train incl. changeover or turnaround gap" }
  - { id: ERR_CAMPAIGN_START_TOO_EARLY, http: 409, condition: "Logical clock is before planned_start_utc at seed-train start" }
  - { id: ERR_SEED_TRANSFER_WINDOW_EXPIRED, http: 409, condition: "More than 36 hours elapsed since the predecessor stage completed; predecessor flips to EXPIRED" }
  - { id: ERR_SEED_INOCULATION_WINDOW_EXPIRED, http: 409, condition: "More than 24 hours elapsed since the last seed stage completed" }
  - { id: ERR_BATCH_EXPIRED, http: 409, condition: "Logical clock is past batch expiry_utc at delivery" }

  # --- Constraint ---
  - { id: ERR_TRAIN_PRODUCT_INCOMPATIBLE, http: 409, condition: "Product molecule_type not in train supported_molecule_types" }
  - { id: ERR_MARKET_SCOPE_VIOLATION, http: 422, condition: "demand_type not permitted by product market_scope, or shipment market_type differs from the campaign demand_type" }
  - { id: ERR_TEST_PHASE_MISMATCH, http: 409, condition: "Test phase differs from the batch's current process phase, or the batch is no longer processing" }
  - { id: ERR_UNRESOLVED_TESTS, http: 409, condition: "Process advance blocked: tests exist outside {VERIFIED, INVALIDATED} or no VERIFIED test exists for the completed phase" }
  - { id: ERR_NO_SEED_STAGES_DEFINED, http: 409, condition: "Seed-train start requires at least one defined stage" }
  - { id: ERR_SEED_STAGES_INCOMPLETE, http: 409, condition: "Production start requires every seed stage COMPLETED" }
  - { id: ERR_SEED_STAGE_ORDER_VIOLATION, http: 409, condition: "A lower-indexed seed stage of the campaign is not COMPLETED" }
  - { id: ERR_MATERIAL_SHORTAGE, http: 409, condition: "A required multi-source material has insufficient AVAILABLE stock at the site" }
  - { id: ERR_SHIPMENT_QUANTITY_EXCEEDS_AVAILABLE, http: 409, condition: "quantity_units exceeds batch available_to_ship_units" }

  # --- Fiscal / capacity ---
  - { id: ERR_CAPACITY_EXCEEDED, http: 409, condition: "Firm monthly capacity insufficient after any permitted preemption" }
  - { id: ERR_COLD_STORAGE_CAPACITY_EXCEEDED, http: 409, condition: "Aggregate PLANNED shipment quantity at the site would exceed cold storage capacity" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform administrator; owns master data (sites, products, trains, materials) and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /sites"
      - "POST /sites/{id}/trains"
      - "POST /sites/{id}/materials"
      - "POST /materials/{id}/hold"
      - "POST /products"
    shared_operations: []

  - name: ProcessEngineer
    description: "Process engineer; schedules campaigns and drives seed train execution"
    identity: opaque
    exclusive_operations:
      - "POST /trains/{id}/campaigns"
      - "POST /campaigns/{id}/advance"
      - "POST /campaigns/{id}/seed-stages"
      - "POST /seed-stages/{id}/advance"
    shared_operations: []

  - name: ManufacturingOperator
    description: "Manufacturing operator; runs batch processing and records in-process test results"
    identity: opaque
    exclusive_operations:
      - "POST /campaigns/{id}/batches"
      - "POST /batches/{id}/advance"
      - "POST /batches/{id}/tests"
    shared_operations:
      - "POST /batches/{id}/deviations (shared with QualityControlAnalyst and QualityAssuranceReviewer)"

  - name: QualityControlAnalyst
    description: "QC analyst; verifies recorded test results (four-eyes) and raises deviations"
    identity: opaque
    exclusive_operations:
      - "POST /tests/{id}/verify"
    shared_operations:
      - "POST /batches/{id}/deviations (shared with ManufacturingOperator and QualityAssuranceReviewer)"

  - name: QualityAssuranceReviewer
    description: "QA reviewer; batch record review, disposition, deviation closure, excursion evaluation; segregated from manufacture and verification of the same batch"
    identity: opaque
    exclusive_operations:
      - "POST /batches/{id}/submit-for-review"
      - "POST /batches/{id}/disposition"
      - "POST /deviations/{id}/action"
      - "POST /shipments/{id}/evaluate-excursion"
    shared_operations:
      - "POST /batches/{id}/deviations (shared with ManufacturingOperator and QualityControlAnalyst)"

  - name: SupplyPlanner
    description: "Supply planner; plans shipments, ships/delivers/cancels them, and records temperature readings"
    identity: opaque
    exclusive_operations:
      - "POST /batches/{id}/shipments"
      - "POST /shipments/{id}/action"
      - "POST /shipments/{id}/readings"
    shared_operations: []

  - name: RegulatoryAffairsSpecialist
    description: "Regulatory affairs; owns comparability studies and health-authority inspections"
    identity: opaque
    exclusive_operations:
      - "POST /products/{id}/comparability-studies"
      - "POST /comparability-studies/{id}/action"
      - "POST /sites/{id}/inspections"
      - "POST /inspections/{id}/action"
    shared_operations: []

  - name: Any
    description: "Any authenticated role; read-only access to all GET endpoints"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /sites/{id}"
      - "GET /sites/{id}/trains"
      - "GET /sites/{id}/materials"
      - "GET /sites/{id}/inspections"
      - "GET /products/{id}"
      - "GET /products/{id}/comparability-studies"
      - "GET /campaigns"
      - "GET /campaigns/{id}"
      - "GET /campaigns/{id}/seed-stages"
      - "GET /campaigns/{id}/batches"
      - "GET /batches/{id}"
      - "GET /batches/{id}/tests"
      - "GET /batches/{id}/deviations"
      - "GET /batches/{id}/shipments"
      - "GET /shipments/{id}"
      - "GET /shipments/{id}/readings"
