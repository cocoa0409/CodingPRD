          difficulty_instance: dual_variant_calc / load_study_nameplate_vs_diversified_with_cooling_floor
          rationale: "The named §1.8 instance files a restudy at diversity_factor 0.60, asserts the 212.1 MW switch and the network_upgrade_cost_usd falling to 0.00, which is the reconciliation claim."

