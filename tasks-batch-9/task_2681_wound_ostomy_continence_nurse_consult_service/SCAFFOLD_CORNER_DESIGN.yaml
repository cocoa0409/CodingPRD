      - name: archived_product_conditional_action_rejects_protocol_and_second_archive
        claim_type: Conditional action
        grounds:
          - endpoints[POST /formulary-products/{product_id}/archive]
          - validations[priority=17]
          - errors[ERR_RESOURCE_NOT_ACTIVE]
        distinguishing_aspect: "Archiving is only legal once, and the archived product is only excluded going FORWARD: an existing protocol that already cites it keeps its stored cost, while any new protocol against it is refused. The identical protocol request against a still-ACTIVE product succeeds, isolating the product's status as the sole cause."
        test_recipe:
          setup:
            - "Unit 3E exists with nurse Nina at CANDIDATE and ADMITTED patient MRN-AF1 (admitted 2026-07-31T12:00:00Z)."
            - "Products DRSG-30 and DRSG-31 are both ACTIVE and PREFERRED at 1000 cents per unit."
            - "Consult C1 is driven to a VALIDATED assessment and already carries protocol DP1 against DRSG-30, so it sits at PLAN_ACTIVE."
          setup_api_calls:
            - call: "POST /units"
              payload: { unit_code: "3E", name: "Three East", bed_count: 18, rental_budget_cap_cents: 0 }
              as: WocProgramDirector
              captures: { u1_id: "$.data.id" }
            - call: "POST /woc-nurses"
              payload: { full_name: "Nina Stage", home_unit_id: "${u1_id}", ce_credits: 30 }
              as: WocProgramDirector
              captures: { n1_id: "$.data.id" }
            - call: "POST /woc-nurses/${n1_id}/competency-signoffs"
              payload: { signed_off_at: "2026-08-01T00:00:00Z", competency_domain: "WOUND_STAGING" }
              as: WocProgramDirector
            - call: "POST /woc-nurses/${n1_id}/advance"
              payload: {}
              as: WocProgramDirector
            - call: "POST /formulary-products"
              payload: { sku: "DRSG-30", name: "Foam dressing 10x10", category: "FOAM", unit_cost_cents: 1000, formulary_tier: "PREFERRED" }
              as: WocProgramDirector
              captures: { fp1_id: "$.data.id" }
            - call: "POST /formulary-products"
              payload: { sku: "DRSG-31", name: "Foam dressing 15x15", category: "FOAM", unit_cost_cents: 1000, formulary_tier: "PREFERRED" }
              as: WocProgramDirector
              captures: { fp2_id: "$.data.id" }
            - call: "POST /patients"
              payload: { mrn: "MRN-AF1", unit_id: "${u1_id}", admitted_at: "2026-07-31T12:00:00Z" }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { p1_id: "$.data.id" }
            - call: "POST /consult-requests"
              payload: { patient_id: "${p1_id}", requesting_unit_id: "${u1_id}", consult_type: "WOUND", reported_stage: "STAGE_2", clinical_note: "Sacral wound present on arrival." }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { c1_id: "$.data.id" }
            - call: "POST /consult-requests/${c1_id}/triage"
              payload: {}
              as: WocNurse
              as_user_id: "${n1_id}"
            - call: "POST /consult-requests/${c1_id}/assign"
              payload: { assigned_nurse_id: "${n1_id}" }
              as: WocProgramDirector
            - call: "GET /patients/${p1_id}"
              payload: {}
              as: WocNurse
              as_user_id: "${n1_id}"
              captures: { p1_v: "$.data.version" }
            - call: "POST /skin-assessments"
              payload: { consult_request_id: "${c1_id}", patient_id: "${p1_id}", anatomic_location: "SACRUM", observed_stage: "STAGE_2", measured_area_cm2: 6, observed_at: "2026-08-01T00:00:00Z", expected_patient_version: "${p1_v}", present_on_admission_claimed: true }
              as: WocNurse
              as_user_id: "${n1_id}"
              captures: { a1_id: "$.data.id" }
            - call: "POST /skin-assessments/${a1_id}/validate"
              payload: { confirmed_stage: "STAGE_2", present_on_admission_confirmed: true }
              as: WocProgramDirector
            - call: "POST /dressing-protocols"
              payload: { consult_request_id: "${c1_id}", formulary_product_id: "${fp1_id}", change_frequency_hours: 24, units_per_change: 1 }
              as: WocNurse
              as_user_id: "${n1_id}"
              captures: { dp1_id: "$.data.id" }
          trigger:
            - call: "POST /formulary-products/${fp1_id}/archive"
              payload: { reason: "Vendor discontinued the 10x10 foam." }
              as: WocProgramDirector
            - call: "POST /dressing-protocols"
              payload: { consult_request_id: "${c1_id}", formulary_product_id: "${fp1_id}", change_frequency_hours: 12, units_per_change: 1 }
              as: WocNurse
              as_user_id: "${n1_id}"
              captures: { err_id: "$.data.error_id" }
            - call: "POST /formulary-products/${fp1_id}/archive"
              payload: { reason: "Duplicate archive request from the formulary committee." }
              as: WocProgramDirector
            - call: "POST /dressing-protocols"
              payload: { consult_request_id: "${c1_id}", formulary_product_id: "${fp2_id}", change_frequency_hours: 12, units_per_change: 1 }
              as: WocNurse
              as_user_id: "${n1_id}"
              captures: { dp2_id: "$.data.id" }
          assert:
            - "Call 1 returns HTTP 200 and FormularyProduct.${fp1_id}.status == ARCHIVED"
            - "Archiving is backward-compatible: DressingProtocol.${dp1_id} is untouched, still ACTIVE with weekly_cost_cents == 7000, and its formulary_product_id still resolves"
            - "Call 2 returns HTTP 409 with data.error_id == ERR_RESOURCE_NOT_ACTIVE — a new protocol may not cite an ARCHIVED product"
            - "After call 2 no protocol row was created, DressingProtocol.${dp1_id}.status is still ACTIVE and ConsultRequest.${c1_id}.status is still PLAN_ACTIVE with an unchanged version"
            - "Call 3 returns HTTP 409 with ERR_RESOURCE_NOT_ACTIVE — the action is conditional on status == ACTIVE, so archiving is not idempotent"
            - "Call 4 returns HTTP 201 with a byte-identical body except for the product reference: changes_per_week == 14 (floor(168 / 12)) and weekly_cost_cents == 14000"
            - "DressingProtocol.${dp1_id}.status == SUPERSEDED only after the accepted call 4, and ConsultRequest.${c1_id}.status is still PLAN_ACTIVE via the self-transition"

