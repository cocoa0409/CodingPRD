  - section: calculations
    instances:
      - name: performance_score_penalties_accumulate_until_the_auto_suspension_threshold
        claim_type: weighted_scoring
        grounds:
          - "calculations.inspector_performance_score"
          - "state_machines.Inspector.license_status.ACTIVE_to_SUSPENDED"
          - "entities.Inspector.fields.check_sample_deviation_count"
          - "errors[ERR_INSPECTOR_NOT_QUALIFIED]"
        distinguishing_aspect: "Four successive comparison deviations of exactly +0.30 walk the score 100 -> 92 -> 82 -> 72 -> 62, crossing the strict < 70 auto-suspension threshold only on the fourth, and the 12-point training credit cap then makes reinstatement arithmetically unreachable no matter how many hours are filed."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z."
            - "A DESIGNATED area with an APPROVED PROTEIN_INSTRUMENT."
            - "One inspector holding GRADING and PROTEIN with exactly 24 training hours, activated to ACTIVE, so performance_score is the clamped 100 (raw 100 + 2 credit)."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: ServiceAdmin
              payload: { current_utc: "2026-08-03T09:00:00Z" }
            - call: POST /grain-inspection/service-areas
              as: ServiceAdmin
              payload: { name: "Gulf Designated Office", state_code: "TX", authority_type: "DESIGNATED" }
              captures: { area: "$.data.id" }
            - call: POST /grain-inspection/inspectors
              as: ServiceAdmin
              payload: { service_area_id: "${area}", license_number: "L-1301", full_name: "S. Scored", endorsements: ["GRADING", "PROTEIN"], license_expires_at: "2027-06-01T00:00:00Z" }
              captures: { insp: "$.data.id" }
            - call: POST /grain-inspection/inspectors/${insp}/training-records
              as: ServiceAdmin
              payload: { course_code: "PROTEIN-101", hours: 24 }
            - call: POST /grain-inspection/inspectors/${insp}/activate
              as: ServiceAdmin
              payload: {}
            - call: POST /grain-inspection/equipment
              as: ServiceAdmin
              payload: { service_area_id: "${area}", equipment_kind: "PROTEIN_INSTRUMENT", asset_code: "NIR-SCORE", model: "SpectraGrain 9" }
              captures: { nir: "$.data.id" }
            - call: POST /grain-inspection/equipment/${nir}/certify
              as: ServiceAdmin
              payload: { certified_until: "2027-01-01T00:00:00Z" }
            - call: POST /grain-inspection/comparison-checks
              as: ServiceAdmin
              payload: { instrument_id: "${nir}", inspector_id: "${insp}", reference_value_pct: 12.00, instrument_reading_pct: 12.30 }
            - call: POST /grain-inspection/comparison-checks
              as: ServiceAdmin
              payload: { instrument_id: "${nir}", inspector_id: "${insp}", reference_value_pct: 12.00, instrument_reading_pct: 12.30 }
            - call: POST /grain-inspection/comparison-checks
              as: ServiceAdmin
              payload: { instrument_id: "${nir}", inspector_id: "${insp}", reference_value_pct: 12.00, instrument_reading_pct: 12.30 }
          trigger:
            - call: POST /grain-inspection/comparison-checks
              as: ServiceAdmin
              payload: { instrument_id: "${nir}", inspector_id: "${insp}", reference_value_pct: 12.00, instrument_reading_pct: 12.30 }
          assert:
            - "After check 1 the inspector read check_sample_deviation_count 1 and performance_score 92; after check 2, 82; after check 3, 72 with license_status still ACTIVE (72 >= 70, the threshold is strict)"
            - "200 on the trigger; GET /grain-inspection/inspectors/${insp} -> check_sample_deviation_count == 4, performance_score == 62, license_status == SUSPENDED, suspension_reason == AUTO_PERFORMANCE"
            - "GET /grain-inspection/equipment/${nir} -> approval_status == DRIFT_WATCH throughout: every rolling_bias_pct is exactly 0.30, which is neither > 0.30 (out of tolerance) nor <= 0.15 (recovery), so no calibration cascade interfered with the score arithmetic"
            - "POST /grain-inspection/inspectors/${insp}/training-records with 120 hours -> training_hours_completed 144, credit floor(144/10) = 14 capped at 12, performance_score == 72, license_status still SUSPENDED (a score recompute never reinstates by itself)"
            - "POST /grain-inspection/inspectors/${insp}/reinstate -> 422 ERR_INSPECTOR_NOT_QUALIFIED, and no further training can help: with 4 deviations the ceiling is 100 + 12 - 40 == 72 < 80"

      - name: fee_input_set_excludes_draft_and_window_closed_schedules
        claim_type: input_set_filtering
        grounds:
          - "calculations.fee_assessment"
          - "entities.FeeSchedule.fields.status"
          - "entities.FeeSchedule.fields.effective_to"
          - "errors[ERR_NO_ACTIVE_FEE_SCHEDULE]"
        distinguishing_aspect: "A COMBINED certificate prices two classes; the area has a DRAFT WEIGHING schedule and an ACTIVE WEIGHING schedule whose window closed a month before the clock, so issuance must fail outright rather than fall back to either row, and the eventual fee proves neither of the excluded (deliberately much more expensive) schedules leaked into the sum."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z (standard hours)."
            - "A DELEGATED area with fee_multiplier_bp at the 10000 default and supervision_required false."
            - "GRADING schedule ACTIVE from 2026-01-01: base 8000, per_thousand 2000, minimum 10000."
            - "WEIGHING schedule base 50000 / per_thousand 9000 left in DRAFT, plus WEIGHING schedule base 40000 / per_thousand 8000 ACTIVE only over [2026-01-01, 2026-07-01)."
            - "A CORN request with GRADING and WEIGHING requested, a FINAL grading result and a WEIGHED weighing record whose net_bushels is 3609.27."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: ServiceAdmin
              payload: { current_utc: "2026-08-03T09:00:00Z" }
            - call: POST /grain-inspection/service-areas
              as: ServiceAdmin
              payload: { name: "Plains Delegated Office", state_code: "KS", authority_type: "DELEGATED", supervision_required: false }
              captures: { area: "$.data.id" }
            - call: POST /grain-inspection/fee-schedules
              as: ServiceAdmin
              payload: { service_area_id: "${area}", service_class: "GRADING", base_fee_cents: 8000, per_thousand_bushel_rate_cents: 2000, minimum_fee_cents: 10000, effective_from: "2026-01-01T00:00:00Z" }
              captures: { fs_g: "$.data.id" }
            - call: POST /grain-inspection/fee-schedules/${fs_g}/activate
              as: ServiceAdmin
              payload: {}
            - call: POST /grain-inspection/fee-schedules
              as: ServiceAdmin
              payload: { service_area_id: "${area}", service_class: "WEIGHING", base_fee_cents: 50000, per_thousand_bushel_rate_cents: 9000, effective_from: "2026-01-01T00:00:00Z" }
              captures: { fs_draft: "$.data.id" }
            - call: POST /grain-inspection/fee-schedules
              as: ServiceAdmin
              payload: { service_area_id: "${area}", service_class: "WEIGHING", base_fee_cents: 40000, per_thousand_bushel_rate_cents: 8000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-07-01T00:00:00Z" }
              captures: { fs_old: "$.data.id" }
            - call: POST /grain-inspection/fee-schedules/${fs_old}/activate
              as: ServiceAdmin
              payload: {}
            - call: POST /grain-inspection/applicants
