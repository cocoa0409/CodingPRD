scenario: |
  2997. Aviation Hull & Liability Underwriting (aviation insurer): pilot qualification, hours and
  training requirements as warranties in the policy, hull valuation on an agreed-value basis with
  depreciation and total loss settlement, use classification across private, business, instructional
  and commercial operations with rate impact, territorial limits, airport premises and product
  liability extensions, war, hijacking and terrorism coverage placement in a separate market,
  non-owned aircraft, renter and club exposure structures, claim handling with accident investigation
  cooperation and hull salvage disposition, fleet policy with automatic acquisition and reporting
  endorsements

domain_name: aviation-hull-liability-underwriting
api_prefix: "/aviation"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  # Every entity is a peer collection directly under /aviation with foreign keys carried in
  # request bodies and query filters; no entity is nested inside another entity's URL path.
  # Parent context (policy_id, claim_id, schedule_id) always travels in the body or query string.

  state_machine_shape: parallel
  # Two entities carry independent parallel state dimensions on the same row:
  #   AircraftSchedule: coverage_status x warranty_status
  #   Claim:            adjustment_status x salvage_status
  # Endorsement adds a cycle (SUBMITTED -> QUOTED -> SUBMITTED via referral rounds), and
  # AircraftSchedule.coverage_status adds a revert loop (ACTIVE -> SUSPENDED_WARRANTY -> ACTIVE).

  relationship_patterns:
    - one_to_many          # Policy -> AircraftSchedule / Endorsement / Claim / FleetDeclaration
    - cross_aggregate      # AircraftSchedule -> Aircraft and -> Pilot cross aggregate boundaries;
                           # the aircraft-level coverage-overlap rule spans ALL policies
    - polymorphic          # Endorsement carries a discriminated payload per endorsement_type

  role_model: segregation_of_duties
  # The ClaimsAdjuster who recorded a claim's coverage decision may not execute its settlement;
  # Underwriter / Broker / ClaimsAdjuster additionally own disjoint resource surfaces (peer roles),
  # and OperatorUser is scoped to its own Operator's policies.

  consistency_model: immediate

  difficulty_level: beyond_expert
  difficulty_notes: |
    Deliberately above the Expert band of SKILL.md 0.4 (12 entities / 46 endpoints / 54 error codes)
    because the scenario asks for a harder-than-expert task. The extra surface is not padding: every
    entity participates in at least one of the nine 0.5 rules, and the density lives in
    (a) a four-factor rate chain with nested min/max caps and a fleet-size conditional branch,
    (b) two settlement bases over the same loss, (c) two parallel state dimensions, and
    (d) two four-hop transitive cascades.

entities:
  - name: Operator
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered legal name of the insured operator.
        constraints: 1..120 chars, non-blank after trim
      - name: operator_type
        type: enum
        source: input
        description: Operating character of the insured, used for use-class plausibility checks.
        constraints: "one of PRIVATE_OWNER, BUSINESS_OPERATOR, FLIGHT_SCHOOL, AIR_CARRIER, FLYING_CLUB"
      - name: aoc_number
        type: string
        source: input
        description: Air Operator Certificate number; mandatory when operator_type == AIR_CARRIER.
        default: null
        constraints: "when present: 4..16 chars of [A-Z0-9-]"
      - name: home_base_icao
        type: string
        source: input
        description: ICAO code of the home base aerodrome.
        constraints: "exactly 4 characters, uppercase A-Z only"
      - name: policy_count
        type: integer
        source: computed
        description: >-
          Cross-entity count of Policy rows whose operator_id == this Operator.id and whose
          status IN {DRAFT, BOUND}; EXPIRED policies are excluded.
        default: 0

  - name: Aircraft
    parent: null
    common_fields: true
    fields:
      - name: registration_mark
        type: string
        source: input
        description: Nationality/registration mark, globally unique across all Aircraft rows.
        constraints: "3..8 chars of [A-Z0-9-], uppercase; unique"
      - name: aircraft_class
        type: enum
        source: input
        description: Airframe class driving airworthiness expectations.
        constraints: "one of SINGLE_PISTON, MULTI_PISTON, TURBOPROP, JET, HELICOPTER"
      - name: manufacture_year
        type: integer
        source: input
        description: Calendar year of manufacture; the depreciation clock starts here.
        constraints: "1950 <= manufacture_year <= 2026"
      - name: hull_new_value_cents
        type: integer
        source: input
        description: New-replacement hull value in cents; the depreciation base.
        constraints: "> 0"
      - name: seat_count
        type: integer
        source: input
        description: Total seats including crew; caps renter/club per-seat exposure structures.
        constraints: "1 <= seat_count <= 500"
      - name: max_takeoff_weight_kg
        type: integer
        source: input
        description: Maximum takeoff weight in kilograms.
        constraints: "> 0"
      - name: current_depreciated_value_cents
        type: integer
        source: computed
        description: >-
          Depreciated hull value as of the CURRENT logical clock year (see calculations.depreciated_hull_value,
          variant clock_basis). Reporting field only. Settlement MUST NOT read this field: settlement
          re-derives depreciation from the loss year (variant loss_date_basis), which differs whenever
          the loss year differs from the clock year.

  - name: Pilot
    parent: null
    common_fields: true
    fields:
      - name: pilot_name
        type: string
        source: input
        description: Full name of the pilot named in the policy warranty.
        constraints: 1..120 chars
      - name: license_type
        type: enum
        source: input
        description: Highest licence held.
        constraints: "one of STUDENT, PPL, CPL, ATPL"
      - name: total_logged_hours
        type: integer
        source: input
        description: Self-declared total logged flying hours as submitted by the broker.
        constraints: ">= 0"
      - name: hours_on_type
        type: integer
        source: input
        description: Self-declared hours on the insured type.
        constraints: ">= 0 and <= total_logged_hours"
      - name: instrument_rated
        type: boolean
        source: input
        description: Whether the pilot holds a current instrument rating.
        default: false
      - name: last_training_completed_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant of the last completed recurrent training event.
      - name: medical_expires_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant at which the pilot's medical certificate expires.
      - name: verified_total_hours
        type: integer
        source: system
        description: Logbook-audited total hours; null until an hours-verification is recorded.
        default: null
      - name: verified_hours_on_type
        type: integer
        source: system
        description: Logbook-audited hours on type; null until an hours-verification is recorded.
        default: null
      - name: verified_at
        type: datetime
        source: system
        description: ISO 8601 UTC instant the logbook audit was recorded; null until then.
        default: null
      - name: qualification_score_logged
        type: integer
        source: computed
        description: >-
          Qualification score computed from the self-declared figures
          (calculations.pilot_qualification_score, variant logged_hours_basis).
        constraints: "0..1000"
      - name: qualification_score_verified
        type: integer
        source: computed
        description: >-
          Qualification score computed from the audited figures
          (calculations.pilot_qualification_score, variant verified_hours_basis);
          null while verified_at is null.
        default: null
      - name: rating_band_logged
        type: enum
        source: computed
        description: Band derived from qualification_score_logged.
        constraints: "one of BAND_A, BAND_B, BAND_C, BAND_D"
      - name: rating_band_verified
        type: enum
        source: computed
        description: Band derived from qualification_score_verified; null while verified_at is null.
        default: null
        constraints: "one of BAND_A, BAND_B, BAND_C, BAND_D or null"

  - name: Policy
    parent: null
    common_fields: true
    fields:
      - name: operator_id
        type: string
        source: input
        description: FK -> Operator.id; the insured operator this policy is issued to.
      - name: policy_number
        type: string
        source: system
        description: >-
          Server-minted sequential policy number "AVN-" + 6-digit zero-padded counter assigned in
          Policy creation order (created_at ASC, starting at AVN-000001).
      - name: policy_type
        type: enum
        source: input
        description: SINGLE_AIRCRAFT policies are never eligible for the fleet-size credit in
          calculations.annual_hull_premium; FLEET policies are once the live-schedule count reaches
          FLEET_CREDIT_MIN_SCHEDULES.
        constraints: "one of SINGLE_AIRCRAFT, FLEET"
      - name: status
        type: enum
        source: system
        description: Lifecycle state; see state_machines.Policy.
        default: DRAFT
        constraints: "one of DRAFT, BOUND, EXPIRED"
      - name: effective_from
        type: datetime
        source: input
        description: ISO 8601 UTC inception instant of the policy period.
      - name: effective_to
        type: datetime
        source: input
        description: ISO 8601 UTC expiry instant of the policy period; must be > effective_from.
      - name: term_days
        type: integer
        source: computed
        description: >-
          Whole days between effective_from and effective_to, computed as
          (effective_to.date - effective_from.date) in days. The pro-rata denominator.
      - name: territorial_limit_code
        type: enum
        source: input
        description: Standing territorial limit of the policy; drives the territory rate factor.
        constraints: "one of DOMESTIC, CONTINENTAL, WORLDWIDE"
      - name: permitted_use_classes
        type: array
        source: input
        description: Use classes this policy may schedule; a schedule outside the set is rejected.
        default: ["PRIVATE", "BUSINESS", "INSTRUCTIONAL", "COMMERCIAL"]
        constraints: "non-empty subset of {PRIVATE, BUSINESS, INSTRUCTIONAL, COMMERCIAL}"
      - name: base_hull_rate_ppm
        type: integer
        source: input
        description: Base annual hull rate in parts per million of agreed value.
        constraints: "1 <= base_hull_rate_ppm <= 100000"
      - name: hull_deductible_ppm
        type: integer
        source: input
        description: Hull deductible as parts per million of the settlement gross, floored by MIN_DEDUCTIBLE_CENTS.
        constraints: "0 <= hull_deductible_ppm <= 200000"
      - name: liability_limit_cents
        type: integer
        source: input
        description: Combined single limit for third-party liability in cents.
        constraints: "> 0"
      - name: hull_aggregate_limit_cents
        type: integer
        source: input
        description: Aggregate hull limit in cents across all hull settlements on this policy.
        constraints: "> 0"
      - name: premises_liability_extension
        type: boolean
        source: system
        description: True once a PREMISES_LIABILITY endorsement is bound (airport premises cover).
        default: false
      - name: product_liability_extension
        type: boolean
        source: system
        description: True once a PRODUCT_LIABILITY endorsement is bound.
        default: false
      - name: automatic_acquisition_enabled
        type: boolean
        source: input
        description: Whether newly acquired aircraft may attach automatically pending declaration.
        default: false
      - name: acquisition_reporting_days
        type: integer
        source: input
        description: >-
          Days after a declaration period ends within which the declaration must be submitted before
          the late loading applies.
        default: 30
        constraints: "1 <= acquisition_reporting_days <= 180"
      - name: war_risk_required
        type: boolean
        source: input
        description: Whether war/hijacking/terrorism cover must be placed in the separate market.
        default: false
      - name: total_hull_sum_insured_cents
        type: integer
        source: computed
        description: >-
          Sum of agreed_value_cents over AircraftSchedule rows on this policy whose coverage_status
          IN {PENDING, ACTIVE, SUSPENDED_WARRANTY}; TOTAL_LOSS_SETTLED and REMOVED are excluded.
        default: 0
      - name: written_premium_cents
        type: integer
        source: computed
        description: >-
          Signed sum of PremiumTransaction.amount_cents over ALL transactions whose policy_id ==
          this Policy.id (the ledger is append-only, so no status filter applies).
        default: 0
      - name: outstanding_reserve_cents
        type: integer
        source: computed
        description: >-
          Sum of Claim.reserve_cents over Claim rows on this policy whose adjustment_status == RESERVED.
        default: 0
      - name: paid_hull_cents
        type: integer
        source: computed
        description: >-
          Sum of Claim.settlement_amount_cents over Claim rows on this policy whose adjustment_status
          == SETTLED and whose loss_type IN {HULL_DAMAGE, TOTAL_LOSS}.
        default: 0
      - name: live_schedule_count
        type: integer
        source: computed
        description: >-
          Count of AircraftSchedule rows on this policy whose coverage_status IN
          {PENDING, ACTIVE, SUSPENDED_WARRANTY}.
        default: 0

  - name: AircraftSchedule
    parent: null
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: input
        description: FK -> Policy.id; the policy this hull is scheduled on.
      - name: aircraft_id
        type: string
        source: input
        description: FK -> Aircraft.id; the scheduled airframe.
      - name: named_pilot_id
        type: string
        source: input
        description: FK -> Pilot.id; the pilot named in the policy's pilot warranty for this hull.
      - name: use_class
        type: enum
        source: input
        description: Use classification of the operation; drives both the rate factor and the warranty minima.
        constraints: "one of PRIVATE, BUSINESS, INSTRUCTIONAL, COMMERCIAL"
      - name: agreed_value_cents
        type: integer
        source: input
        description: Agreed hull value in cents; the settlement basis for AGREED_VALUE losses.
        constraints: "> 0 and <= aircraft.hull_new_value_cents * OVER_INSURANCE_CAP_PPM / 1000000"
      - name: effective_from
        type: datetime
        source: input
        description: ISO 8601 UTC start of this hull's coverage window; must be >= policy.effective_from.
      - name: effective_to
        type: datetime
        source: input
        description: >-
          ISO 8601 UTC end of this hull's coverage window (EXCLUSIVE upper bound for the
          aircraft-level overlap rule); must be <= policy.effective_to and > effective_from.
      - name: coverage_status
        type: enum
        source: system
        description: Coverage dimension of the schedule; see state_machines.AircraftSchedule.coverage_status.
        default: PENDING
        constraints: "one of PENDING, ACTIVE, SUSPENDED_WARRANTY, TOTAL_LOSS_SETTLED, REMOVED"
      - name: warranty_status
        type: enum
        source: system
        description: >-
          Pilot-warranty dimension of the schedule, evolving independently of coverage_status;
          see state_machines.AircraftSchedule.warranty_status.
        default: PENDING_EVIDENCE
        constraints: "one of PENDING_EVIDENCE, COMPLIANT, BREACHED, WAIVED"
      - name: warranty_basis
        type: enum
        source: computed
        description: >-
          VERIFIED_HOURS when the named Pilot.verified_at is non-null at the moment this schedule's
          premium is computed, otherwise LOGGED_HOURS. Selects which pilot qualification variant
          feeds the rate and which hour figures the warranty minima are tested against.
        default: LOGGED_HOURS
        constraints: "one of LOGGED_HOURS, VERIFIED_HOURS"
      - name: warranted_min_total_hours
        type: integer
        source: computed
        description: Minimum total hours warranted for this use_class (WARRANTY_MIN_TOTAL_HOURS constant).
      - name: warranted_min_hours_on_type
        type: integer
        source: computed
        description: Minimum hours-on-type warranted for this use_class (WARRANTY_MIN_HOURS_ON_TYPE constant).
      - name: rated_pilot_band
        type: enum
        source: computed
        description: Pilot band actually used to rate this schedule, selected by warranty_basis.
        constraints: "one of BAND_A, BAND_B, BAND_C, BAND_D"
      - name: rate_ppm
        type: integer
        source: computed
        description: Final capped annual hull rate in ppm (calculations.hull_rate_ppm).
      - name: hull_premium_cents
        type: integer
        source: computed
        description: Annual hull premium in cents at 100% of term (calculations.annual_hull_premium).
      - name: acquisition_source
        type: enum
        source: input
        description: >-
          SCHEDULED for hulls underwritten up front; AUTOMATIC_ACQUISITION for hulls attaching under
          the fleet automatic-acquisition clause pending a reporting declaration.
        default: SCHEDULED
        constraints: "one of SCHEDULED, AUTOMATIC_ACQUISITION"
      - name: reported_declaration_id
        type: string
        source: system
        description: >-
          FK -> FleetDeclaration.id; stamped when an accepted declaration reports this
          automatic-acquisition hull. Null for SCHEDULED hulls and for unreported acquisitions.
        default: null
      - name: warranty_breach_reason
        type: string
        source: system
        description: Free-text reason recorded when warranty_status becomes BREACHED; null otherwise.
        default: null

  - name: Endorsement
    parent: null
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: input
        description: FK -> Policy.id; the policy being endorsed.
      - name: endorsement_type
        type: enum
        source: input
        description: >-
          Discriminator selecting which optional payload fields are required and which premium branch
          calculations.endorsement_premium_delta evaluates.
        constraints: >-
          one of ADD_AIRCRAFT, REMOVE_AIRCRAFT, VALUE_REVISION, USE_CLASS_CHANGE, TERRITORY_EXTENSION,
          PREMISES_LIABILITY, PRODUCT_LIABILITY, NON_OWNED_EXPOSURE, RENTER_EXPOSURE, FLYING_CLUB_EXPOSURE
      - name: status
        type: enum
        source: system
        description: Lifecycle state; see state_machines.Endorsement (cyclic via referral).
        default: SUBMITTED
        constraints: "one of SUBMITTED, QUOTED, BOUND, VOID"
      - name: effective_date
        type: datetime
        source: input
        description: >-
          ISO 8601 UTC instant the endorsement attaches; the pro-rata numerator starts here and it
          must fall inside [policy.effective_from, policy.effective_to).
      - name: target_schedule_id
        type: string
        source: input
        description: >-
          FK -> AircraftSchedule.id; supplied by the client for REMOVE_AIRCRAFT, VALUE_REVISION and
          USE_CLASS_CHANGE, and STAMPED BY THE SERVER on ADD_AIRCRAFT bind with the id of the
          schedule it created. Null for extension and exposure endorsements.
        default: null
      - name: aircraft_id
        type: string
        source: input
        description: FK -> Aircraft.id; required for ADD_AIRCRAFT, null otherwise.
        default: null
      - name: named_pilot_id
        type: string
        source: input
        description: FK -> Pilot.id; required for ADD_AIRCRAFT, null otherwise.
        default: null
      - name: new_agreed_value_cents
        type: integer
        source: input
        description: Agreed value for ADD_AIRCRAFT, or the revised agreed value for VALUE_REVISION.
        default: null
        constraints: "> 0 when present"
      - name: new_use_class
        type: enum
        source: input
        description: Use class for ADD_AIRCRAFT, or the revised use class for USE_CLASS_CHANGE.
        default: null
        constraints: "one of PRIVATE, BUSINESS, INSTRUCTIONAL, COMMERCIAL when present"
      - name: territory_code
        type: enum
        source: input
        description: Extended territory for TERRITORY_EXTENSION; WAR_ZONE_A demands a bound war placement.
        default: null
        constraints: "one of CONTINENTAL, WORLDWIDE, WAR_ZONE_A when present"
      - name: exposure_member_count
        type: integer
        source: input
        description: >-
          Number of covered renters / club members / non-owned pilots for the exposure-structure
          endorsement types.
        default: null
        constraints: "1 <= exposure_member_count <= 500 when present"
      - name: per_seat_limit_cents
        type: integer
        source: input
        description: Per-seat liability limit for the exposure structure, in cents.
        default: null
        constraints: "> 0 when present"
      - name: quote_round
        type: integer
        source: system
        description: >-
          Number of completed quote rounds. Starts at 0, increments by 1 on every quote, and the
          referral back-edge is refused once quote_round == MAX_QUOTE_ROUNDS.
        default: 0
      - name: quoted_premium_delta_cents
        type: integer
        source: computed
        description: >-
          Signed premium delta computed by the most recent quote
          (calculations.endorsement_premium_delta); overwritten on each re-quote round.
        default: null
      - name: premium_delta_cents
        type: integer
        source: computed
        description: >-
          Signed premium delta actually charged, frozen from quoted_premium_delta_cents at bind time;
          the amount of the ENDORSEMENT_PREMIUM transaction and the exact amount reversed on void.
        default: null
      - name: quoted_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the Underwriter who produced the current quote; null before the first quote.
        default: null
      - name: referral_reason
        type: string
        source: input
        description: Reason recorded on the most recent referral back to submission; null before any referral.
        default: null
      - name: void_reason
        type: string
        source: input
        description: Reason recorded when the endorsement is voided; null otherwise.
        default: null

  - name: WarRiskMarket
    parent: null
    common_fields: true
    fields:
      - name: market_name
        type: string
        source: input
        description: Name of the separate war/hijacking/terrorism market carrying the placement; unique.
        constraints: "1..80 chars, unique"
      - name: aggregate_line_cents
        type: integer
        source: input
        description: Maximum aggregate hull line this market will carry at any single instant, in cents.
        constraints: "> 0"
      - name: perils_offered
        type: enum
        source: input
        description: >-
          Widest perils scope this market writes. Scope order is WAR_ONLY < WAR_HIJACK <
          WAR_HIJACK_TERRORISM; a placement requesting a wider scope than perils_offered is refused.
        constraints: "one of WAR_ONLY, WAR_HIJACK, WAR_HIJACK_TERRORISM"
      - name: committed_line_cents
        type: integer
        source: computed
        description: >-
          Sum of war_hull_line_cents over WarRiskPlacement rows whose market_id == this market and
          whose status == BOUND; CANCELLED placements are excluded.
        default: 0
      - name: available_line_cents
        type: integer
        source: computed
        description: aggregate_line_cents - committed_line_cents.

  - name: WarRiskPlacement
    parent: null
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: input
        description: FK -> Policy.id; the hull policy whose war exposure is placed out.
      - name: market_id
        type: string
        source: input
        description: FK -> WarRiskMarket.id; the separate market taking the line.
      - name: war_hull_line_cents
        type: integer
        source: input
        description: Hull line ceded to the war market in cents.
        constraints: "> 0"
      - name: perils_scope
        type: enum
        source: input
        description: Perils placed; must not exceed the market's perils_offered.
        constraints: "one of WAR_ONLY, WAR_HIJACK, WAR_HIJACK_TERRORISM"
      - name: coverage_from
        type: datetime
        source: input
        description: >-
          ISO 8601 UTC start of the placement period. The placement interval is CLOSED on both ends
          for the market aggregate rule: two placements that merely touch at an endpoint DO overlap.
      - name: coverage_to
        type: datetime
        source: input
        description: ISO 8601 UTC end of the placement period (inclusive); must be > coverage_from.
      - name: status
        type: enum
        source: system
        description: Lifecycle state; see state_machines.WarRiskPlacement.
        default: BOUND
        constraints: "one of BOUND, CANCELLED"
      - name: premium_cents
        type: integer
        source: computed
        description: War risk premium charged at placement (calculations.war_risk_premium).
      - name: cancellation_reason
        type: string
        source: input
        description: Reason recorded on cancellation; null while BOUND.
        default: null

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: input
        description: FK -> Policy.id; the policy the loss is notified under.
      - name: schedule_id
        type: string
        source: input
        description: >-
          FK -> AircraftSchedule.id; the scheduled hull involved in the loss. Must belong to policy_id.
      - name: loss_date
        type: datetime
        source: input
        description: >-
          ISO 8601 UTC instant of the loss; must lie inside [schedule.effective_from,
          schedule.effective_to) and must not be after the current logical clock.
      - name: loss_type
        type: enum
        source: input
        description: >-
          Class of loss notified. HULL_DAMAGE may be promoted to TOTAL_LOSS by the constructive
          total loss calculation.
        constraints: "one of HULL_DAMAGE, TOTAL_LOSS, WAR_PERIL, LIABILITY_BODILY, LIABILITY_PROPERTY, PREMISES, PRODUCT"
      - name: loss_description
        type: string
        source: input
        description: Narrative of the occurrence.
        constraints: 1..500 chars
      - name: adjustment_status
        type: enum
        source: system
        description: Adjustment dimension; see state_machines.Claim.adjustment_status.
        default: NOTIFIED
        constraints: "one of NOTIFIED, INVESTIGATING, COVERAGE_REFERRED, RESERVED, SETTLED, DENIED"
      - name: salvage_status
        type: enum
        source: system
        description: >-
          Salvage dimension, evolving independently of adjustment_status; see
          state_machines.Claim.salvage_status.
        default: NONE
        constraints: "one of NONE, RETAINED_BY_INSURED, TENDERED, SOLD, ABANDONED"
      - name: cooperation_status
        type: enum
        source: system
        description: >-
          Accident-investigation cooperation recorded by the adjuster. NON_COOPERATION forces the
          claim into COVERAGE_REFERRED instead of INVESTIGATING.
        default: PENDING
        constraints: "one of PENDING, COOPERATING, NON_COOPERATION"
      - name: investigator_reference
        type: string
        source: input
        description: Reference of the accident investigation file; null until an investigation is recorded.
        default: null
      - name: reserve_cents
        type: integer
        source: system
        description: >-
          Reserve held against this claim, set by the coverage decision and zeroed when the claim
          leaves RESERVED (settlement, denial, or a warranty-suspension referral).
        default: 0
      - name: ctl_ratio_ppm
        type: integer
        source: computed
        description: >-
          Repair-to-agreed-value ratio in ppm of the SELECTED damage assessment
          (calculations.constructive_total_loss_ratio); null until the first assessment is recorded.
        default: null
      - name: ctl_flag
        type: boolean
        source: computed
        description: True once ctl_ratio_ppm >= CTL_THRESHOLD_PPM; gates which settlement bases are legal.
        default: false
      - name: assessment_count
        type: integer
        source: computed
        description: Count of DamageAssessment rows whose claim_id == this Claim.id.
        default: 0
      - name: settlement_basis
        type: enum
        source: input
        description: Basis chosen at settlement; null until settled.
        default: null
        constraints: "one of AGREED_VALUE, DEPRECIATED_VALUE, PARTIAL_REPAIR when present"
      - name: settlement_amount_cents
        type: integer
        source: computed
        description: Net settlement paid (calculations.hull_settlement_amount); null until settled.
        default: null
      - name: deductible_applied_cents
        type: integer
        source: computed
        description: Deductible actually applied at settlement; null until settled.
        default: null
      - name: salvage_proceeds_cents
        type: integer
        source: system
        description: >-
          Gross proceeds of the salvage sale; non-zero only once salvage_status == SOLD, and credited
          against the settlement only in that state.
        default: 0
      - name: coverage_decided_by_user_id
        type: string
        source: system
        description: >-
          Opaque X-User-ID of the ClaimsAdjuster who recorded the coverage decision. Segregation of
          duties forbids this same user id from executing the settlement.
        default: null
      - name: denial_reason
        type: string
        source: input
        description: Reason recorded when the coverage decision denies the claim; null otherwise.
        default: null

  - name: DamageAssessment
    parent: null
    common_fields: false
    fields:
      - name: claim_id
        type: string
        source: input
        description: FK -> Claim.id; the claim this assessment belongs to. Assessments are immutable.
      - name: repair_cost_estimate_cents
        type: integer
        source: input
        description: Surveyor's repair cost estimate in cents.
        constraints: ">= 0"
      - name: assessor_reference
        type: string
        source: input
        description: Reference of the surveyor / assessor issuing the estimate.
        constraints: 1..80 chars
      - name: assessed_at
        type: datetime
        source: input
        description: >-
          ISO 8601 UTC instant of the survey; the primary sort key of the assessment selector. Must
          not be after the current logical clock.
      - name: ctl_ratio_ppm
        type: integer
        source: computed
        description: >-
          floor(repair_cost_estimate_cents * 1000000 / schedule.agreed_value_cents) for THIS assessment.
      - name: verdict
        type: enum
        source: computed
        description: CONSTRUCTIVE_TOTAL_LOSS when this assessment's ctl_ratio_ppm >= CTL_THRESHOLD_PPM, else REPAIRABLE.
        constraints: "one of REPAIRABLE, CONSTRUCTIVE_TOTAL_LOSS"

  - name: PremiumTransaction
    parent: null
    common_fields: false
    fields:
      - name: policy_id
        type: string
        source: system
        description: FK -> Policy.id; the policy whose written premium this immutable entry moves.
          Stamped by the appending transition — the ledger has no create endpoint.
      - name: endorsement_id
        type: string
        source: system
        description: >-
          FK -> Endorsement.id; the endorsement that produced this entry. Null for INITIAL_PREMIUM,
          RERATE_ADJUSTMENT, DECLARATION_PREMIUM, WAR_RISK_PREMIUM and SETTLEMENT_RETURN entries.
        default: null
      - name: txn_type
        type: enum
        source: system
        description: Origin of the entry.
        constraints: >-
          one of INITIAL_PREMIUM, ENDORSEMENT_PREMIUM, RETURN_PREMIUM, RERATE_ADJUSTMENT,
          DECLARATION_PREMIUM, WAR_RISK_PREMIUM, SETTLEMENT_RETURN
      - name: amount_cents
        type: integer
        source: system
        description: Signed amount in cents; negative for returns of premium. May not be 0.
      - name: effective_date
        type: datetime
        source: system
        description: ISO 8601 UTC instant from which the amount is earned.
      - name: basis
        type: enum
        source: system
        description: ANNUAL for full-term charges, PRO_RATA for time-apportioned charges and returns.
        constraints: "one of ANNUAL, PRO_RATA"
      - name: memo
        type: string
        source: system
        description: Human-readable origin note, e.g. "bind of endorsement <id>".

  - name: FleetDeclaration
    parent: null
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: input
        description: FK -> Policy.id; the fleet policy being declared against.
      - name: period_from
        type: datetime
        source: input
        description: >-
          ISO 8601 UTC start of the declaration period (INCLUSIVE); must be >= policy.effective_from.
      - name: period_to
        type: datetime
        source: input
        description: >-
          ISO 8601 UTC end of the declaration period (INCLUSIVE); must be > period_from and
          <= policy.effective_to.
      - name: status
        type: enum
        source: system
        description: Lifecycle state; see state_machines.FleetDeclaration.
        default: SUBMITTED
        constraints: "one of SUBMITTED, ACCEPTED, REJECTED"
      - name: declared_count
        type: integer
        source: computed
        description: >-
          Count of reportable automatic-acquisition schedules captured by this declaration
          (calculations.fleet_declaration_premium input_set).
        default: 0
      - name: declared_premium_cents
        type: integer
        source: computed
        description: >-
          Sum of the per-schedule pro-rata lines, each rounded up individually BEFORE summation
          (calculations.fleet_declaration_premium), plus late_loading_cents.
        default: 0
      - name: late_flag
        type: boolean
        source: computed
        description: >-
          True when the declaration is created more than policy.acquisition_reporting_days after
          period_to.
        default: false
      - name: late_loading_cents
        type: integer
        source: computed
        description: Late reporting loading applied when late_flag is true; 0 otherwise.
        default: 0
      - name: reported_schedule_ids
        type: array
        source: computed
        description: >-
          Ids of the AircraftSchedule rows captured by this declaration, in the declaration's
          processing order (effective_from ASC, tie-break created_at ASC).
        default: []
      - name: rejection_reason
        type: string
        source: input
        description: Reason recorded when the declaration is rejected; null otherwise.
        default: null

state_machines:
  - entity: Policy
    state_field: status
    initial_state: DRAFT
    terminal_states: [EXPIRED]
    transitions:
      - from: DRAFT
        to: BOUND
        trigger: "POST /aviation/policies/{id}/bind"
        actor: Underwriter
        preconditions:
          - "policy.status == DRAFT"
          - "at least one AircraftSchedule exists on the policy with coverage_status == PENDING
             (validations[priority=43], ERR_POLICY_HAS_NO_SCHEDULES)"
          - "policy.war_risk_required == false OR a WarRiskPlacement with status == BOUND exists whose
             [coverage_from, coverage_to] contains policy.effective_from"
        side_effects:
          - "every AircraftSchedule on the policy with coverage_status == PENDING and
             acquisition_source == SCHEDULED becomes coverage_status = ACTIVE"
          - "appends one PremiumTransaction { txn_type: INITIAL_PREMIUM, basis: ANNUAL,
             endorsement_id: null, effective_date: policy.effective_from,
             amount_cents: sum of hull_premium_cents over the schedules just activated }"
          - "recomputes policy.written_premium_cents, policy.total_hull_sum_insured_cents,
             policy.live_schedule_count"
          - "increments Policy.version by 1"
        note: >-
          AUTOMATIC_ACQUISITION schedules deliberately stay PENDING at bind: they are covered (they
          count toward total_hull_sum_insured_cents) but are only activated and charged when their
          reporting declaration is accepted.
      - from: BOUND
        to: EXPIRED
        trigger: "system event during POST /_clock/set_current_utc when the new clock >= policy.effective_to"
        actor: system
        preconditions:
          - "policy.status == BOUND"
          - "new logical clock >= policy.effective_to"
        side_effects:
          - "every AircraftSchedule on the policy with coverage_status IN {PENDING, ACTIVE,
             SUSPENDED_WARRANTY} becomes coverage_status = REMOVED"
          - "recomputes policy.total_hull_sum_insured_cents (to 0) and policy.live_schedule_count (to 0)"
          - "increments Policy.version by 1"
        note: >-
          Expiry is evaluated for every BOUND policy on each clock advance, in policy created_at ASC
          order. No premium is returned on expiry; the term is fully earned.

  - entity: AircraftSchedule
    state_field: coverage_status
    initial_state: PENDING
    terminal_states: [TOTAL_LOSS_SETTLED, REMOVED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /aviation/policies/{id}/bind (SCHEDULED hulls) or POST /aviation/endorsements/{id}/bind of an ADD_AIRCRAFT endorsement"
        actor: Underwriter
        preconditions:
          - "schedule.coverage_status == PENDING"
          - "schedule.acquisition_source == SCHEDULED"
        side_effects:
          - "recomputes policy.live_schedule_count and policy.total_hull_sum_insured_cents"
      - from: PENDING
        to: ACTIVE
        trigger: "POST /aviation/fleet-declarations/{id}/acceptance with decision == ACCEPT"
        actor: Underwriter
        preconditions:
          - "schedule.coverage_status == PENDING"
          - "schedule.acquisition_source == AUTOMATIC_ACQUISITION"
          - "schedule.id appears in declaration.reported_schedule_ids"
        side_effects:
          - "sets schedule.reported_declaration_id = declaration.id"
          - "recomputes policy.live_schedule_count"
      - from: ACTIVE
        to: SUSPENDED_WARRANTY
        trigger: "system event caused by warranty_status becoming BREACHED (see the warranty_status dimension)"
        actor: system
        preconditions:
          - "schedule.coverage_status == ACTIVE"
          - "schedule.warranty_status transitioned to BREACHED in this same request"
        side_effects:
          - "CASCADE HOP 3: every Claim whose schedule_id == this schedule and whose adjustment_status
             IN {NOTIFIED, INVESTIGATING, RESERVED} becomes adjustment_status = COVERAGE_REFERRED and
             has reserve_cents set to 0, processed in Claim created_at ASC order"
          - "increments AircraftSchedule.version by 1"
      - from: SUSPENDED_WARRANTY
        to: ACTIVE
        trigger: "POST /aviation/schedules/{id}/warranty-findings with finding IN {EVIDENCE_VERIFIED, WAIVER}"
        actor: Underwriter
        preconditions:
          - "schedule.coverage_status == SUSPENDED_WARRANTY"
          - "the finding moves warranty_status to COMPLIANT or WAIVED in this same request"
        side_effects:
          - "clears schedule.warranty_breach_reason to null"
          - "increments AircraftSchedule.version by 1"
        note: >-
          Reinstatement does NOT retroactively re-open claims that were referred by the suspension;
          those claims stay in COVERAGE_REFERRED until a coverage decision is recorded.
      - from: ACTIVE
        to: TOTAL_LOSS_SETTLED
        trigger: "POST /aviation/claims/{id}/settlement with settlement_basis IN {AGREED_VALUE, DEPRECIATED_VALUE}"
        actor: ClaimsAdjuster
        preconditions:
          - "schedule.coverage_status == ACTIVE"
          - "the settling claim's ctl_flag == true"
        side_effects:
          - "CASCADE HOP 3: because the hull left the sum-insured set, policy.total_hull_sum_insured_cents,
             policy.live_schedule_count and policy.paid_hull_cents are recomputed and one
             PremiumTransaction { txn_type: SETTLEMENT_RETURN, basis: PRO_RATA, endorsement_id: null,
             amount_cents: -floor(schedule.hull_premium_cents * days(claim.loss_date -> policy.effective_to)
             / policy.term_days) } is appended"
          - "increments AircraftSchedule.version by 1"
      - from: ACTIVE
        to: REMOVED
        trigger: "POST /aviation/endorsements/{id}/bind of a REMOVE_AIRCRAFT endorsement"
        actor: Underwriter
        preconditions:
          - "schedule.coverage_status == ACTIVE"
          - "no Claim on this schedule has adjustment_status IN {NOTIFIED, INVESTIGATING, COVERAGE_REFERRED, RESERVED}"
        side_effects:
          - "recomputes policy.total_hull_sum_insured_cents and policy.live_schedule_count"
          - "increments AircraftSchedule.version by 1"
      - from: SUSPENDED_WARRANTY
        to: REMOVED
        trigger: "POST /aviation/endorsements/{id}/bind of a REMOVE_AIRCRAFT endorsement"
        actor: Underwriter
        preconditions:
          - "schedule.coverage_status == SUSPENDED_WARRANTY"
          - "no Claim on this schedule has adjustment_status IN {NOTIFIED, INVESTIGATING, COVERAGE_REFERRED, RESERVED}"
        side_effects:
          - "recomputes policy.total_hull_sum_insured_cents and policy.live_schedule_count"
          - "increments AircraftSchedule.version by 1"
      - from: ACTIVE
        to: REMOVED
        trigger: "POST /aviation/endorsements/{id}/void of a BOUND ADD_AIRCRAFT endorsement"
        actor: Underwriter
        preconditions:
          - "schedule.coverage_status == ACTIVE"
          - "schedule.id == endorsement.target_schedule_id and endorsement.endorsement_type == ADD_AIRCRAFT"
          - "current logical clock < endorsement.effective_date"
        side_effects:
          - "recomputes policy.total_hull_sum_insured_cents and policy.live_schedule_count"
          - "increments AircraftSchedule.version by 1"

  - entity: AircraftSchedule
    state_field: warranty_status
    initial_state: PENDING_EVIDENCE
    terminal_states: []
    transitions:
      - from: PENDING_EVIDENCE
        to: COMPLIANT
        trigger: "POST /aviation/schedules/{id}/warranty-findings with finding == EVIDENCE_VERIFIED"
        actor: Underwriter
        preconditions:
          - "schedule.warranty_status IN {PENDING_EVIDENCE, BREACHED}"
          - "schedule.coverage_status NOT IN {TOTAL_LOSS_SETTLED, REMOVED}"
        side_effects:
          - "clears schedule.warranty_breach_reason"
          - "increments AircraftSchedule.version by 1"
      - from: BREACHED
        to: COMPLIANT
        trigger: "POST /aviation/schedules/{id}/warranty-findings with finding == EVIDENCE_VERIFIED"
        actor: Underwriter
        preconditions:
          - "schedule.warranty_status == BREACHED"
          - "schedule.coverage_status NOT IN {TOTAL_LOSS_SETTLED, REMOVED}"
        side_effects:
          - "if coverage_status == SUSPENDED_WARRANTY it returns to ACTIVE (coverage dimension)"
          - "increments AircraftSchedule.version by 1"
      - from: PENDING_EVIDENCE
        to: BREACHED
        trigger: "POST /aviation/schedules/{id}/warranty-findings with finding == BREACH"
        actor: Underwriter
        preconditions:
          - "schedule.warranty_status IN {PENDING_EVIDENCE, COMPLIANT}"
          - "schedule.coverage_status NOT IN {TOTAL_LOSS_SETTLED, REMOVED}"
          - "breach_reason is present"
        side_effects:
          - "CASCADE HOP 2: because warranty_status became BREACHED, coverage_status ACTIVE ->
             SUSPENDED_WARRANTY (which itself cascades to the claims on this schedule)"
          - "sets schedule.warranty_breach_reason = breach_reason"
      - from: COMPLIANT
        to: BREACHED
        trigger: "POST /aviation/schedules/{id}/warranty-findings with finding == BREACH"
        actor: Underwriter
        preconditions:
          - "schedule.warranty_status == COMPLIANT"
          - "schedule.coverage_status NOT IN {TOTAL_LOSS_SETTLED, REMOVED}"
          - "breach_reason is present"
        side_effects:
          - "CASCADE HOP 2: coverage_status ACTIVE -> SUSPENDED_WARRANTY"
          - "sets schedule.warranty_breach_reason = breach_reason"
      - from: BREACHED
        to: WAIVED
        trigger: "POST /aviation/schedules/{id}/warranty-findings with finding == WAIVER"
        actor: Underwriter
        preconditions:
          - "schedule.warranty_status == BREACHED"
          - "schedule.coverage_status NOT IN {TOTAL_LOSS_SETTLED, REMOVED}"
        side_effects:
          - "if coverage_status == SUSPENDED_WARRANTY it returns to ACTIVE (coverage dimension)"
          - "increments AircraftSchedule.version by 1"
        note: >-
          A waiver restores coverage but NOT the agreed-value basis: settlement on a WAIVED schedule
          is confined to DEPRECIATED_VALUE (market value terms).
      - from: PENDING_EVIDENCE
        to: COMPLIANT
        trigger: "POST /aviation/pilots/{id}/hours-verifications (system, for each schedule naming this pilot)"
        actor: system
        preconditions:
          - "schedule.named_pilot_id == the verified pilot"
          - "schedule.coverage_status IN {PENDING, ACTIVE, SUSPENDED_WARRANTY}"
          - "verified_total_hours >= schedule.warranted_min_total_hours AND
             verified_hours_on_type >= schedule.warranted_min_hours_on_type AND
             (WARRANTY_REQUIRES_INSTRUMENT[schedule.use_class] == false OR pilot.instrument_rated == true)"
        side_effects:
          - "CASCADE HOP 2: schedule.warranty_basis becomes VERIFIED_HOURS and the schedule is re-rated
             (rated_pilot_band, rate_ppm, hull_premium_cents recomputed)"
      - from: COMPLIANT
        to: BREACHED
        trigger: "POST /aviation/pilots/{id}/hours-verifications (system, for each schedule naming this pilot)"
        actor: system
        preconditions:
          - "schedule.named_pilot_id == the verified pilot"
          - "schedule.coverage_status IN {PENDING, ACTIVE, SUSPENDED_WARRANTY}"
          - "the audited figures fail at least one warranted minimum"
        side_effects:
          - "sets schedule.warranty_breach_reason = 'VERIFIED_HOURS_BELOW_WARRANTY'"
          - "CASCADE HOP 2: coverage_status ACTIVE -> SUSPENDED_WARRANTY"
      - from: PENDING_EVIDENCE
        to: BREACHED
        trigger: "POST /aviation/pilots/{id}/hours-verifications (system, for each schedule naming this pilot)"
        actor: system
        preconditions:
          - "schedule.named_pilot_id == the verified pilot"
          - "schedule.coverage_status IN {PENDING, ACTIVE, SUSPENDED_WARRANTY}"
          - "the audited figures fail at least one warranted minimum"
        side_effects:
          - "sets schedule.warranty_breach_reason = 'VERIFIED_HOURS_BELOW_WARRANTY'"
          - "CASCADE HOP 2: coverage_status ACTIVE -> SUSPENDED_WARRANTY"

  - entity: Endorsement
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [VOID]
    transitions:
      - from: SUBMITTED
        to: QUOTED
        trigger: "POST /aviation/endorsements/{id}/quote"
        actor: Underwriter
        preconditions:
          - "endorsement.status == SUBMITTED"
          - "policy.status == BOUND"
          - "endorsement.quote_round < MAX_QUOTE_ROUNDS"
        side_effects:
          - "increments endorsement.quote_round by 1"
          - "sets endorsement.quoted_premium_delta_cents from calculations.endorsement_premium_delta"
          - "sets endorsement.quoted_by_user_id = acting X-User-ID"
          - "increments Endorsement.version by 1"
      - from: QUOTED
        to: SUBMITTED
        trigger: "POST /aviation/endorsements/{id}/referral"
        actor: Broker
        preconditions:
          - "endorsement.status == QUOTED"
          - "endorsement.quote_round < MAX_QUOTE_ROUNDS"
        side_effects:
          - "sets endorsement.referral_reason"
          - "clears endorsement.quoted_premium_delta_cents to null and quoted_by_user_id to null"
          - "increments Endorsement.version by 1"
        note: >-
          The cycle SUBMITTED -> QUOTED -> SUBMITTED is the negotiation round with the broker. The
          third quote is final: once quote_round == MAX_QUOTE_ROUNDS (3) the referral back-edge is
          refused with ERR_QUOTE_ROUNDS_EXHAUSTED and the endorsement must be bound or voided.
      - from: QUOTED
        to: BOUND
        trigger: "POST /aviation/endorsements/{id}/bind"
        actor: Underwriter
        preconditions:
          - "endorsement.status == QUOTED"
          - "policy.status == BOUND"
          - "endorsement.effective_date >= current logical clock (no back-dating)"
          - "for TERRITORY_EXTENSION with territory_code == WAR_ZONE_A: a WarRiskPlacement with
             status == BOUND exists on this policy whose [coverage_from, coverage_to] contains
             endorsement.effective_date"
        side_effects:
          - "freezes endorsement.premium_delta_cents = endorsement.quoted_premium_delta_cents"
          - "appends one PremiumTransaction { txn_type: ENDORSEMENT_PREMIUM, basis: PRO_RATA,
             endorsement_id: endorsement.id, effective_date: endorsement.effective_date,
             amount_cents: endorsement.premium_delta_cents } (skipped only when the delta is 0)"
          - "ADD_AIRCRAFT: creates an AircraftSchedule (coverage_status ACTIVE, acquisition_source
             SCHEDULED) and stamps endorsement.target_schedule_id with its id"
          - "REMOVE_AIRCRAFT: target schedule coverage_status -> REMOVED"
          - "VALUE_REVISION: target schedule agreed_value_cents := new_agreed_value_cents and the
             schedule is re-rated"
          - "USE_CLASS_CHANGE: target schedule use_class := new_use_class, warranted minima recomputed
             and the schedule is re-rated"
          - "TERRITORY_EXTENSION: policy.territorial_limit_code := territory_code when territory_code
             IN {CONTINENTAL, WORLDWIDE}; WAR_ZONE_A leaves territorial_limit_code untouched"
          - "PREMISES_LIABILITY: policy.premises_liability_extension := true"
          - "PRODUCT_LIABILITY: policy.product_liability_extension := true"
          - "recomputes policy.written_premium_cents, policy.total_hull_sum_insured_cents,
             policy.live_schedule_count and increments Policy.version by 1"
      - from: SUBMITTED
        to: VOID
        trigger: "POST /aviation/endorsements/{id}/void"
        actor: Underwriter
        preconditions:
          - "endorsement.status == SUBMITTED"
        side_effects:
          - "sets endorsement.void_reason"
          - "increments Endorsement.version by 1"
      - from: QUOTED
        to: VOID
        trigger: "POST /aviation/endorsements/{id}/void"
        actor: Underwriter
        preconditions:
          - "endorsement.status == QUOTED"
        side_effects:
          - "sets endorsement.void_reason; quoted_premium_delta_cents is retained for audit"
          - "increments Endorsement.version by 1"
      - from: BOUND
        to: VOID
        trigger: "POST /aviation/endorsements/{id}/void"
        actor: Underwriter
        preconditions:
          - "endorsement.status == BOUND"
          - "current logical clock < endorsement.effective_date (coverage never incepted)"
        side_effects:
          - "appends one PremiumTransaction { txn_type: RETURN_PREMIUM, basis: PRO_RATA,
             endorsement_id: endorsement.id, effective_date: current clock,
             amount_cents: -endorsement.premium_delta_cents } — the EXACT negation, no short-rate
             penalty, because the endorsement never attached"
          - "ADD_AIRCRAFT: the schedule created at bind (target_schedule_id) becomes REMOVED"
          - "VALUE_REVISION / USE_CLASS_CHANGE: the target schedule's pre-bind agreed_value_cents /
             use_class are restored and the schedule is re-rated back to its pre-bind hull_premium_cents"
          - "REMOVE_AIRCRAFT: the target schedule returns from REMOVED to ACTIVE"
          - "PREMISES_LIABILITY / PRODUCT_LIABILITY: the corresponding policy extension flag returns to false"
          - "recomputes policy.written_premium_cents, policy.total_hull_sum_insured_cents,
             policy.live_schedule_count and increments Policy.version by 1"
        note: >-
          This is the compensating action for the bind: written_premium_cents returns to its exact
          pre-bind value (see calculations.policy_written_premium invariant).

  - entity: WarRiskPlacement
    state_field: status
    initial_state: BOUND
    terminal_states: [CANCELLED]
    transitions:
      - from: BOUND
        to: CANCELLED
        trigger: "POST /aviation/war-placements/{id}/cancellation"
        actor: Underwriter
        preconditions:
          - "placement.status == BOUND"
          - "no BOUND TERRITORY_EXTENSION endorsement with territory_code == WAR_ZONE_A on this policy
             has an effective_date inside [placement.coverage_from, placement.coverage_to]"
        side_effects:
          - "releases the market line: WarRiskMarket.committed_line_cents and available_line_cents are
             recomputed, restoring the pre-placement available capacity exactly"
          - "appends one PremiumTransaction { txn_type: RETURN_PREMIUM, basis: PRO_RATA,
             endorsement_id: null, amount_cents: -placement.premium_cents }"
          - "recomputes policy.written_premium_cents and increments Policy.version by 1"

  - entity: Claim
    state_field: adjustment_status
    initial_state: NOTIFIED
    terminal_states: [SETTLED, DENIED]
    transitions:
      - from: NOTIFIED
        to: INVESTIGATING
        trigger: "POST /aviation/claims/{id}/investigations with cooperation_status == COOPERATING"
        actor: ClaimsAdjuster
        preconditions:
          - "claim.adjustment_status == NOTIFIED"
          - "schedule.coverage_status NOT IN {REMOVED}"
        side_effects:
          - "sets claim.cooperation_status = COOPERATING and claim.investigator_reference"
          - "increments Claim.version by 1"
      - from: NOTIFIED
        to: COVERAGE_REFERRED
        trigger: "POST /aviation/claims/{id}/investigations with cooperation_status == NON_COOPERATION"
        actor: ClaimsAdjuster
        preconditions:
          - "claim.adjustment_status == NOTIFIED"
        side_effects:
          - "sets claim.cooperation_status = NON_COOPERATION and claim.investigator_reference"
          - "increments Claim.version by 1"
        note: >-
          Failure to cooperate with the accident investigation is a coverage question, not an
          adjustment step: the claim skips INVESTIGATING and goes straight to referral.
      - from: INVESTIGATING
        to: COVERAGE_REFERRED
        trigger: "system event caused by the schedule's coverage_status becoming SUSPENDED_WARRANTY"
        actor: system
        preconditions:
          - "claim.adjustment_status IN {NOTIFIED, INVESTIGATING, RESERVED}"
          - "claim.schedule_id == the schedule that was just suspended"
        side_effects:
          - "claim.reserve_cents is RETAINED verbatim for audit — the cascade never destroys the
             adjuster's figure"
          - "CASCADE HOP 4: policy.outstanding_reserve_cents is recomputed and therefore DROPS by
             this claim's reserve_cents, because calculations.policy_written_premium sums only
             claims whose adjustment_status == RESERVED"
          - "increments Claim.version by 1"
      - from: RESERVED
        to: COVERAGE_REFERRED
        trigger: "system event caused by the schedule's coverage_status becoming SUSPENDED_WARRANTY"
        actor: system
        preconditions:
          - "claim.adjustment_status == RESERVED"
          - "claim.schedule_id == the schedule that was just suspended"
        side_effects:
          - "claim.reserve_cents is RETAINED verbatim for audit — the cascade never destroys the
             adjuster's figure"
          - "CASCADE HOP 4: policy.outstanding_reserve_cents is recomputed and therefore DROPS by
             this claim's reserve_cents, because calculations.policy_written_premium sums only
             claims whose adjustment_status == RESERVED"
          - "increments Claim.version by 1"
      - from: INVESTIGATING
        to: RESERVED
        trigger: "POST /aviation/claims/{id}/coverage-decision with decision == COVERED"
        actor: ClaimsAdjuster
        preconditions:
          - "claim.adjustment_status IN {INVESTIGATING, COVERAGE_REFERRED}"
          - "claim.cooperation_status != NON_COOPERATION"
          - "schedule.coverage_status IN {PENDING, ACTIVE, SUSPENDED_WARRANTY} — a hull whose
             warranty is BREACHED may still be RESERVED, but it may never be SETTLED
             (validations[priority=21]); REMOVED and TOTAL_LOSS_SETTLED are refused"
          - "reserve_cents is present and <= schedule.agreed_value_cents"
        side_effects:
          - "sets claim.reserve_cents = reserve_cents and claim.coverage_decided_by_user_id = acting X-User-ID"
          - "recomputes policy.outstanding_reserve_cents"
          - "increments Claim.version by 1"
      - from: COVERAGE_REFERRED
        to: RESERVED
        trigger: "POST /aviation/claims/{id}/coverage-decision with decision == COVERED"
        actor: ClaimsAdjuster
        preconditions:
          - "claim.adjustment_status == COVERAGE_REFERRED"
          - "claim.cooperation_status != NON_COOPERATION"
          - "schedule.coverage_status IN {PENDING, ACTIVE, SUSPENDED_WARRANTY} — a hull whose
             warranty is BREACHED may still be RESERVED, but it may never be SETTLED
             (validations[priority=21]); REMOVED and TOTAL_LOSS_SETTLED are refused"
          - "reserve_cents is present and <= schedule.agreed_value_cents"
        side_effects:
          - "sets claim.reserve_cents and claim.coverage_decided_by_user_id = acting X-User-ID"
          - "recomputes policy.outstanding_reserve_cents"
          - "increments Claim.version by 1"
      - from: COVERAGE_REFERRED
        to: DENIED
        trigger: "POST /aviation/claims/{id}/coverage-decision with decision == DENIED"
        actor: ClaimsAdjuster
        preconditions:
          - "claim.adjustment_status IN {INVESTIGATING, COVERAGE_REFERRED}"
          - "denial_reason is present"
        side_effects:
          - "sets claim.denial_reason, claim.reserve_cents = 0 and claim.coverage_decided_by_user_id"
          - "recomputes policy.outstanding_reserve_cents"
          - "increments Claim.version by 1"
      - from: INVESTIGATING
        to: DENIED
        trigger: "POST /aviation/claims/{id}/coverage-decision with decision == DENIED"
        actor: ClaimsAdjuster
        preconditions:
          - "claim.adjustment_status == INVESTIGATING"
          - "denial_reason is present"
        side_effects:
          - "sets claim.denial_reason, claim.reserve_cents = 0 and claim.coverage_decided_by_user_id"
          - "recomputes policy.outstanding_reserve_cents"
          - "increments Claim.version by 1"
      - from: RESERVED
        to: SETTLED
        trigger: "POST /aviation/claims/{id}/settlement"
        actor: ClaimsAdjuster
        preconditions:
          - "claim.adjustment_status == RESERVED"
          - "acting X-User-ID != claim.coverage_decided_by_user_id (segregation of duties)"
          - "schedule.warranty_status != BREACHED (a suspended hull is reservable but not payable)"
          - "settlement_basis == AGREED_VALUE requires schedule.warranty_status == COMPLIANT"
          - "settlement_basis IN {AGREED_VALUE, DEPRECIATED_VALUE} requires claim.ctl_flag == true"
          - "settlement_basis == PARTIAL_REPAIR requires claim.ctl_flag == false and assessment_count >= 1"
          - "policy.paid_hull_cents + net settlement <= policy.hull_aggregate_limit_cents"
        side_effects:
          - "CASCADE HOP 1: sets claim.settlement_basis, claim.deductible_applied_cents and
             claim.settlement_amount_cents (calculations.hull_settlement_amount), and reserve_cents = 0"
          - "CASCADE HOP 2: for AGREED_VALUE / DEPRECIATED_VALUE the linked AircraftSchedule moves
             ACTIVE -> TOTAL_LOSS_SETTLED (which itself cascades to the policy ledger)"
          - "recomputes policy.outstanding_reserve_cents and policy.paid_hull_cents"
          - "increments Claim.version by 1"
        note: >-
          PARTIAL_REPAIR settlements leave the schedule ACTIVE, so no SETTLEMENT_RETURN transaction
          is written and total_hull_sum_insured_cents does not move.

  - entity: Claim
    state_field: salvage_status
    initial_state: NONE
    terminal_states: [RETAINED_BY_INSURED, SOLD, ABANDONED]
    transitions:
      - from: NONE
        to: RETAINED_BY_INSURED
        trigger: "POST /aviation/claims/{id}/salvage-disposition with salvage_action == RETAIN"
        actor: ClaimsAdjuster
        preconditions:
          - "claim.salvage_status == NONE"
          - "claim.adjustment_status IN {INVESTIGATING, COVERAGE_REFERRED, RESERVED}"
        side_effects:
          - "increments Claim.version by 1"
        note: >-
          The salvage dimension advances independently of adjustment_status; it is legal to dispose of
          salvage before or after settlement, subject only to the per-transition preconditions.
      - from: NONE
        to: TENDERED
        trigger: "POST /aviation/claims/{id}/salvage-disposition with salvage_action == TENDER"
        actor: ClaimsAdjuster
        preconditions:
          - "claim.salvage_status == NONE"
          - "claim.adjustment_status IN {INVESTIGATING, COVERAGE_REFERRED, RESERVED}"
          - "claim.ctl_flag == true"
        side_effects:
          - "increments Claim.version by 1"
      - from: TENDERED
        to: SOLD
        trigger: "POST /aviation/claims/{id}/salvage-disposition with salvage_action == SELL"
        actor: ClaimsAdjuster
        preconditions:
          - "claim.salvage_status == TENDERED"
          - "salvage_proceeds_cents is present and > 0"
        side_effects:
          - "sets claim.salvage_proceeds_cents"
          - "increments Claim.version by 1"
        note: >-
          Selling BEFORE settlement credits the proceeds against the settlement; selling AFTER
          settlement does not retroactively adjust settlement_amount_cents.
      - from: TENDERED
        to: ABANDONED
        trigger: "POST /aviation/claims/{id}/salvage-disposition with salvage_action == ABANDON"
        actor: ClaimsAdjuster
        preconditions:
          - "claim.salvage_status == TENDERED"
        side_effects:
          - "increments Claim.version by 1"

  - entity: FleetDeclaration
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /aviation/fleet-declarations/{id}/acceptance with decision == ACCEPT"
        actor: Underwriter
        preconditions:
          - "declaration.status == SUBMITTED"
          - "policy.status == BOUND"
        side_effects:
          - "every AircraftSchedule id in declaration.reported_schedule_ids moves PENDING -> ACTIVE and
             gets reported_declaration_id = declaration.id"
          - "appends one PremiumTransaction { txn_type: DECLARATION_PREMIUM, basis: PRO_RATA,
             endorsement_id: null, amount_cents: declaration.declared_premium_cents } — skipped
             entirely when declared_count == 0"
          - "recomputes policy.written_premium_cents and policy.live_schedule_count and increments
             Policy.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /aviation/fleet-declarations/{id}/acceptance with decision == REJECT"
        actor: Underwriter
        preconditions:
          - "declaration.status == SUBMITTED"
          - "rejection_reason is present"
        side_effects:
          - "sets declaration.rejection_reason; no schedule is activated and no PremiumTransaction is written"
          - "increments FleetDeclaration.version by 1"

concurrency_rules:
  - rule_id: schedule-value-revision-stale
    parent_entity: AircraftSchedule
    write_endpoint: "POST /aviation/schedules/{id}/value-revisions"
    occ_field: "expected_schedule_version"
    description: |
      A direct agreed-value revision legitimately supersedes the schedule's prior agreed value, so a
      second revision carrying the version the client last observed is a well-formed product
      operation rather than an invalid state. It is rejected only because the schedule's version has
      advanced since that observation (another revision, a re-rate cascade, or a warranty finding has
      already been recorded), which means the revision was priced against a stale agreed value.
    error_id: ERR_STALE_SCHEDULE_VERSION
    http_status: 412
  - rule_id: war-placement-create-stale-policy
    parent_entity: Policy
    write_endpoint: "POST /aviation/war-placements"
    occ_field: "expected_policy_version"
    description: |
      A new war risk placement supersedes any earlier placement for the same period, so creating one
      against a policy whose version the client last observed is a legitimate operation. It is
      rejected only when the policy's version has advanced since that observation, because the hull
      exposure the placement was sized against (total_hull_sum_insured_cents) is then stale.
    error_id: ERR_STALE_POLICY_VERSION
    http_status: 412

calculations:
  - name: pilot_qualification_score
    trigger: >-
      On POST /aviation/pilots (logged variant only), on POST /aviation/pilots/{id}/hours-verifications
      (both variants), and whenever a schedule's premium is computed (the variant selected by
      schedule.warranty_basis feeds calculations.hull_rate_ppm).
    algorithm: weighted_scoring
    formula: |
      hours_component  = min(400, floor(basis_total_hours * 400 / 2000))
      type_component   = min(250, floor(basis_hours_on_type * 250 / 200))
      rating_component = 150 if pilot.instrument_rated else 0
      licence_component = LICENCE_POINTS[pilot.license_type]
      recurrency_penalty = RECURRENCY_PENALTY_POINTS
                           if (current_clock_date - pilot.last_training_completed_at.date)
                              > TRAINING_RECURRENCY_DAYS days
                           else 0
      score = clamp(0, 1000,
                    hours_component + type_component + rating_component
                    + licence_component - recurrency_penalty)
      band  = BAND_A if score >= 750
              else BAND_B if score >= 550
              else BAND_C if score >= 350
              else BAND_D
    input_set: >-
      Exactly one Pilot row. The recurrency penalty is evaluated against the CURRENT logical clock at
      the moment of computation, so the same pilot can rate differently before and after a clock
      advance past the 365-day recurrency horizon.
    constants:
      LICENCE_POINTS: { STUDENT: 0, PPL: 80, CPL: 150, ATPL: 200 }
      TRAINING_RECURRENCY_DAYS: 365
      RECURRENCY_PENALTY_POINTS: 200
      HOURS_COMPONENT_CAP: 400
      HOURS_SATURATION: 2000
      TYPE_COMPONENT_CAP: 250
      TYPE_SATURATION: 200
    precision: "integer points, floor after each component division; band thresholds are inclusive (>=)"
    variants:
      - name: logged_hours_basis
        when: "schedule.warranty_basis == LOGGED_HOURS, i.e. pilot.verified_at is null"
        difference: >-
          basis_total_hours = pilot.total_logged_hours and basis_hours_on_type = pilot.hours_on_type
          (the broker's self-declared figures). Result is stored in
          Pilot.qualification_score_logged / Pilot.rating_band_logged.
      - name: verified_hours_basis
        when: "schedule.warranty_basis == VERIFIED_HOURS, i.e. pilot.verified_at is non-null"
        difference: >-
          basis_total_hours = pilot.verified_total_hours and basis_hours_on_type =
          pilot.verified_hours_on_type (the logbook audit). Result is stored in
          Pilot.qualification_score_verified / Pilot.rating_band_verified. Because audited hours are
          routinely lower than declared hours, the two variants place the SAME pilot in different
          bands and therefore produce different hull premiums for an unchanged schedule.

  - name: pilot_warranty_minima
    trigger: "POST /aviation/schedules, and the bind of an ADD_AIRCRAFT or USE_CLASS_CHANGE endorsement;
      writes AircraftSchedule.warranted_min_total_hours, warranted_min_hours_on_type and warranty_basis."
    algorithm: threshold
    formula: |
      warranted_min_total_hours   = WARRANTY_MIN_TOTAL_HOURS[schedule.use_class]
      warranted_min_hours_on_type = WARRANTY_MIN_HOURS_ON_TYPE[schedule.use_class]
      warranty_basis = VERIFIED_HOURS if pilot.verified_at IS NOT NULL else LOGGED_HOURS
      # These three tables are what the hours-verification warranty transitions compare against
      # (see state_machines.AircraftSchedule.warranty_status): the audited figures must clear BOTH
      # minima INCLUSIVELY, and must supply an instrument rating when the use class demands one.
    input_set: "Exactly one AircraftSchedule's use_class plus the named Pilot's verified_at. The minima are
      frozen from the use_class in force at the moment of computation and are recomputed only when
      use_class changes (USE_CLASS_CHANGE), never when the pilot's hours change."
    constants:
      WARRANTY_MIN_TOTAL_HOURS: { PRIVATE: 100, BUSINESS: 400, INSTRUCTIONAL: 500, COMMERCIAL: 1500 }
      WARRANTY_MIN_HOURS_ON_TYPE: { PRIVATE: 10, BUSINESS: 25, INSTRUCTIONAL: 50, COMMERCIAL: 100 }
      WARRANTY_REQUIRES_INSTRUMENT: { PRIVATE: false, BUSINESS: true, INSTRUCTIONAL: false, COMMERCIAL: true }
    precision: "integer hours; both comparisons in the warranty transitions are inclusive (>=)"
  - name: hull_rate_ppm
    trigger: >-
      Whenever a schedule's premium is (re)computed: POST /aviation/schedules, bind of an ADD_AIRCRAFT
      endorsement, bind of a VALUE_REVISION / USE_CLASS_CHANGE endorsement, POST
      /aviation/schedules/{id}/value-revisions, and the re-rate cascade of
      POST /aviation/pilots/{id}/hours-verifications.
    algorithm: tiered_pricing
    formula: |
      step1_ppm = floor(policy.base_hull_rate_ppm * USE_CLASS_FACTOR_PPM[schedule.use_class] / 1000000)
      step2_ppm = floor(step1_ppm * TERRITORY_FACTOR_PPM[policy.territorial_limit_code] / 1000000)
      step3_ppm = floor(step2_ppm * PILOT_BAND_FACTOR_PPM[schedule.rated_pilot_band] / 1000000)
      rate_ppm  = min(max(step3_ppm, MIN_RATE_PPM), MAX_RATE_PPM)
      # Evaluation order is PINNED: use class, then territory, then pilot band, flooring after EVERY
      # multiplication. Multiplying the three factors together first and flooring once produces a
      # different ppm for many inputs and is forbidden.
      # rated_pilot_band = Pilot.rating_band_verified when schedule.warranty_basis == VERIFIED_HOURS,
      #                    else Pilot.rating_band_logged.
    input_set: >-
      The schedule's own use_class, its policy's territorial_limit_code and base_hull_rate_ppm, and the
      named pilot's band under the basis selected by schedule.warranty_basis.
    constants:
      USE_CLASS_FACTOR_PPM: { PRIVATE: 1000000, BUSINESS: 1150000, INSTRUCTIONAL: 1400000, COMMERCIAL: 1750000 }
      TERRITORY_FACTOR_PPM: { DOMESTIC: 1000000, CONTINENTAL: 1080000, WORLDWIDE: 1250000 }
      PILOT_BAND_FACTOR_PPM: { BAND_A: 900000, BAND_B: 1000000, BAND_C: 1250000, BAND_D: 1600000 }
      MIN_RATE_PPM: 8000
      MAX_RATE_PPM: 60000
    precision: "integer ppm, floor after each of the three multiplications, then clamp"

  - name: annual_hull_premium
    trigger: "Same events as calculations.hull_rate_ppm; writes AircraftSchedule.hull_premium_cents."
    algorithm: threshold
    formula: |
      gross_cents = floor(schedule.agreed_value_cents * schedule.rate_ppm / 1000000)
      live_count  = count of AircraftSchedule rows on this policy whose coverage_status IN
                    {PENDING, ACTIVE, SUSPENDED_WARRANTY}, INCLUDING the schedule being computed
      fleet_credit_applies = (policy.policy_type == FLEET
                              AND live_count >= FLEET_CREDIT_MIN_SCHEDULES)
      hull_premium_cents = gross_cents - (floor(gross_cents * FLEET_CREDIT_PPM / 1000000)
                                          if fleet_credit_applies else 0)
    input_set: >-
      The schedule's agreed_value_cents and rate_ppm, plus the live-schedule count on its policy at the
      MOMENT OF THIS COMPUTATION. The credit is evaluated per premium-computation event and is NEVER
      retroactively applied: existing schedules are not re-rated when the fleet later crosses the
      threshold, so two identical hulls on the same policy legitimately carry different premiums.
    constants:
      FLEET_CREDIT_PPM: 50000
      FLEET_CREDIT_MIN_SCHEDULES: 5
    precision: "integer cents, floor; the credit is floored separately and then subtracted"

  - name: endorsement_premium_delta
    trigger: "POST /aviation/endorsements/{id}/quote; frozen into premium_delta_cents at bind."
    algorithm: waterfall_allocation
    formula: |
      term_days     = policy.term_days
      unexpired     = days(endorsement.effective_date.date -> policy.effective_to.date)
      # Branch on endorsement_type; exactly one branch runs.
      ADD_AIRCRAFT      : annual = annual_hull_premium(hypothetical schedule: aircraft_id,
                                     named_pilot_id, new_use_class, new_agreed_value_cents,
                                     window [effective_date, policy.effective_to))
                          delta  = ceil(annual * unexpired / term_days)
      VALUE_REVISION    : annual_new = annual_hull_premium(target schedule with
                                         agreed_value_cents := new_agreed_value_cents)
                          delta  = ceil((annual_new - target.hull_premium_cents) * unexpired / term_days)
      USE_CLASS_CHANGE  : annual_new = annual_hull_premium(target schedule with
                                         use_class := new_use_class)
                          delta  = ceil((annual_new - target.hull_premium_cents) * unexpired / term_days)
      REMOVE_AIRCRAFT   : delta  = -floor(floor(target.hull_premium_cents * unexpired / term_days)
                                          * SHORT_RATE_RETURN_PPM / 1000000)
      TERRITORY_EXTENSION: delta = ceil(TERRITORY_EXTENSION_FLAT_CENTS[territory_code]
                                        * unexpired / term_days)
      PREMISES_LIABILITY : delta = ceil(PREMISES_EXTENSION_FLAT_CENTS * unexpired / term_days)
      PRODUCT_LIABILITY  : delta = ceil(PRODUCT_EXTENSION_FLAT_CENTS * unexpired / term_days)
      NON_OWNED_EXPOSURE / RENTER_EXPOSURE / FLYING_CLUB_EXPOSURE:
                          base   = floor(exposure_member_count * per_seat_limit_cents
                                          * EXPOSURE_RATE_PPM[endorsement_type] / 1000000)
                          delta  = ceil(base * unexpired / term_days)
    input_set: >-
      One Endorsement plus, for schedule-touching types, the single target AircraftSchedule identified
      by target_schedule_id. A negative delta (REMOVE_AIRCRAFT) is a return of premium and uses
      NESTED rounding: the pro-rata unearned amount is floored FIRST, then the 90% short-rate return
      factor is applied to that floored amount and floored again.
    constants:
      SHORT_RATE_RETURN_PPM: 900000
      TERRITORY_EXTENSION_FLAT_CENTS: { CONTINENTAL: 180000, WORLDWIDE: 420000, WAR_ZONE_A: 950000 }
      PREMISES_EXTENSION_FLAT_CENTS: 240000
      PRODUCT_EXTENSION_FLAT_CENTS: 360000
      EXPOSURE_RATE_PPM: { NON_OWNED_EXPOSURE: 900, RENTER_EXPOSURE: 1400, FLYING_CLUB_EXPOSURE: 1100 }
    precision: >-
      integer cents; positive charges use ceil (in the insurer's favour), returns use floor of the
      absolute value. Rounding happens once per branch except REMOVE_AIRCRAFT, whose two-stage
      floor order is pinned above.

  - name: fleet_declaration_premium
    trigger: "POST /aviation/fleet-declarations (computed at creation, frozen thereafter)."
    algorithm: aggregation
    formula: |
      reportable = AircraftSchedule rows where policy_id == declaration.policy_id
                     AND acquisition_source == AUTOMATIC_ACQUISITION
                     AND reported_declaration_id IS NULL
                     AND coverage_status == PENDING
                     AND period_from <= effective_from <= period_to      (both bounds INCLUSIVE)
      order      = effective_from ASC, tie-break created_at ASC
      declared_count = count(reportable)
      # ROUND-PER-LINE-THEN-SUM. This order is PINNED.
      for each schedule s in order:
          unexpired_s   = days(s.effective_from.date -> policy.effective_to.date)
          line_cents_s  = ceil(s.hull_premium_cents * unexpired_s / policy.term_days)
      lines_total   = sum of line_cents_s
      late_flag     = (current_clock_date - period_to.date) > policy.acquisition_reporting_days
      late_loading_cents = ceil(lines_total * LATE_LOADING_PPM / 1000000) if late_flag else 0
      declared_premium_cents = lines_total + late_loading_cents
      # Summing the exact rational line values and rounding ONCE at the end
      # (ceil(sum(s.hull_premium_cents * unexpired_s / term_days))) is a different, FORBIDDEN
      # algorithm: it under-charges by the accumulated per-line fractions.
    input_set: >-
      Only unreported PENDING automatic-acquisition hulls whose effective_from falls inside the
      inclusive declaration period. SCHEDULED hulls, already-reported hulls, and hulls whose
      effective_from lies outside the period are excluded, and an empty candidate set is legal:
      declared_count = 0, declared_premium_cents = 0, late_loading_cents = 0.
    constants:
      LATE_LOADING_PPM: 150000
    precision: "integer cents; ceil per line, then ceil once more for the late loading on the line total"

  - name: depreciated_hull_value
    trigger: >-
      Read model on GET /aviation/aircraft/{id} (clock_basis) and inside
      calculations.hull_settlement_amount for the DEPRECIATED_VALUE basis (loss_date_basis).
    algorithm: decay_function
    formula: |
      age_years    = reference_year - aircraft.manufacture_year          (never below 0)
      residual_ppm = max(RESIDUAL_FLOOR_PPM,
                         1000000 - age_years * DEPRECIATION_PER_YEAR_PPM)
      depreciated_value_cents = floor(aircraft.hull_new_value_cents * residual_ppm / 1000000)
    input_set: "One Aircraft row plus a reference year supplied by the variant."
    constants:
      DEPRECIATION_PER_YEAR_PPM: 40000
      RESIDUAL_FLOOR_PPM: 400000
    precision: "integer cents, floor; the residual is floored at 40% of new value"
    variants:
      - name: clock_basis
        when: "Populating Aircraft.current_depreciated_value_cents for reads."
        difference: "reference_year = calendar year of the CURRENT logical clock."
      - name: loss_date_basis
        when: "Settling a hull claim on the DEPRECIATED_VALUE basis."
        difference: >-
          reference_year = calendar year of claim.loss_date. A loss in an earlier calendar year than
          the clock therefore settles on a HIGHER depreciated value than the aircraft's reported
          current_depreciated_value_cents.

  - name: constructive_total_loss_ratio
    trigger: "POST /aviation/damage-assessments (recomputed on every appended assessment)."
    algorithm: threshold
    formula: |
      this_assessment.ctl_ratio_ppm =
          floor(this.repair_cost_estimate_cents * 1000000 / schedule.agreed_value_cents)
      this_assessment.verdict = CONSTRUCTIVE_TOTAL_LOSS
          if this_assessment.ctl_ratio_ppm >= CTL_THRESHOLD_PPM else REPAIRABLE
      # Claim-level selection over ALL assessments on the claim:
      selected = the assessment with the greatest assessed_at;
                 tie-break 1: greatest repair_cost_estimate_cents;
                 tie-break 2: earliest created_at
      claim.ctl_ratio_ppm = selected.ctl_ratio_ppm
      claim.ctl_flag      = claim.ctl_ratio_ppm >= CTL_THRESHOLD_PPM
      claim.assessment_count = count of assessments on the claim
      if claim.ctl_flag and claim.loss_type == HULL_DAMAGE: claim.loss_type := TOTAL_LOSS
    input_set: >-
      Every DamageAssessment row whose claim_id == this claim, with no status filter (assessments are
      immutable). The threshold is INCLUSIVE: a ratio of exactly 750000 ppm is a constructive total
      loss, 749999 ppm is not. Promotion of loss_type is one-way; a later, lower assessment can pull
      ctl_flag back to false but never demotes loss_type back to HULL_DAMAGE.
    constants:
      CTL_THRESHOLD_PPM: 750000
    precision: "integer ppm, floor"

  - name: hull_settlement_amount
    trigger: "POST /aviation/claims/{id}/settlement."
    algorithm: forward_looking
    formula: |
      gross_cents = per variant below
      deductible_cents = max(MIN_DEDUCTIBLE_CENTS,
                             floor(gross_cents * policy.hull_deductible_ppm / 1000000))
      salvage_credit_cents = claim.salvage_proceeds_cents if claim.salvage_status == SOLD else 0
      settlement_amount_cents = max(0, gross_cents - deductible_cents - salvage_credit_cents)
      # Unearned-premium return, written only for the two TOTAL-LOSS bases (PARTIAL_REPAIR writes
      # nothing). Note the deliberate contrast with the REMOVE_AIRCRAFT branch of
      # calculations.endorsement_premium_delta, which additionally applies the 90% short-rate factor:
      unearned_return_cents = -floor(schedule.hull_premium_cents
                                     * days(claim.loss_date.date -> policy.effective_to.date)
                                     / policy.term_days)
      # Evaluation order is PINNED: the deductible is computed on the GROSS basis value BEFORE the
      # salvage credit is subtracted. Deducting salvage first and then applying the percentage
      # deductible yields a different figure and is forbidden.
    input_set: >-
      One Claim, its AircraftSchedule, that schedule's Aircraft, and the claim's policy. The selected
      DamageAssessment (calculations.constructive_total_loss_ratio) is read only for the
      PARTIAL_REPAIR variant.
    constants:
      MIN_DEDUCTIBLE_CENTS: 250000
    precision: "integer cents, floor inside the deductible, hard floor of 0 on the net"
    variants:
      - name: agreed_value_basis
        when: "settlement_basis == AGREED_VALUE (requires schedule.warranty_status == COMPLIANT and ctl_flag)"
        difference: "gross_cents = schedule.agreed_value_cents — the agreed value is paid without proof of market value."
      - name: depreciated_value_basis
        when: >-
          settlement_basis == DEPRECIATED_VALUE (the only total-loss basis available once the pilot
          warranty has been WAIVED after a breach)
        difference: >-
          gross_cents = min(schedule.agreed_value_cents,
          depreciated_hull_value(loss_date_basis)) — market-value terms, so the SAME loss on the SAME
          schedule settles for materially less than the agreed-value basis, and the deductible
          (a percentage of gross) shrinks with it.
      - name: partial_repair_basis
        when: "settlement_basis == PARTIAL_REPAIR (requires ctl_flag == false and assessment_count >= 1)"
        difference: >-
          gross_cents = selected_assessment.repair_cost_estimate_cents; the schedule stays ACTIVE and
          no SETTLEMENT_RETURN transaction is written.

  - name: war_risk_premium
    trigger: "POST /aviation/war-placements."
    algorithm: tiered_pricing
    formula: |
      base_cents    = floor(placement.war_hull_line_cents * PERILS_RATE_PPM[perils_scope] / 1000000)
      premium_cents = ceil(base_cents * TERRITORY_FACTOR_PPM[policy.territorial_limit_code] / 1000000)
      # Evaluation order is PINNED and resolves the apparent circularity between the two premium
      # ledgers: the war premium is a function of the war line only. It is added to
      # policy.written_premium_cents AFTER any hull fleet credit has already been applied to the hull
      # premiums, and it NEVER feeds the fleet-credit test in calculations.annual_hull_premium.
    input_set: "One WarRiskPlacement plus its policy's territorial_limit_code."
    constants:
      PERILS_RATE_PPM: { WAR_ONLY: 1500, WAR_HIJACK: 2400, WAR_HIJACK_TERRORISM: 3600 }
    precision: "integer cents: floor on the perils step, ceil on the territory step"

  - name: market_line_occupancy
    trigger: "POST /aviation/war-placements (admission test) and on every placement cancellation (release)."
    algorithm: interval_merge
    formula: |
      # CLOSED-interval overlap: two placements overlap when
      #   existing.coverage_from <= requested.coverage_to
      #   AND requested.coverage_from <= existing.coverage_to
      # Touching endpoints therefore DO overlap (contrast the half-open aircraft coverage rule).
      overlapping = WarRiskPlacement rows where market_id == requested.market_id
                      AND status == BOUND
                      AND the closed intervals overlap as above
      peak_cents  = sum of war_hull_line_cents over overlapping
      admitted    = (peak_cents + requested.war_hull_line_cents) <= market.aggregate_line_cents
      market.committed_line_cents = sum of war_hull_line_cents over ALL BOUND placements on the market
      market.available_line_cents = market.aggregate_line_cents - market.committed_line_cents
    input_set: >-
      BOUND placements on the target market only; CANCELLED placements never occupy the line, which is
      what makes cancellation an exact release of the committed quantity.
    constants: {}
    precision: "integer cents; the admission test is inclusive (<=), so filling the line exactly is allowed"

  - name: policy_written_premium
    trigger: >-
      Every append to the PremiumTransaction ledger: policy bind, endorsement bind, endorsement void,
      declaration acceptance, war placement creation and cancellation, hull settlement, and the
      hours-verification re-rate cascade.
    algorithm: aggregation
    formula: |
      policy.written_premium_cents = sum of PremiumTransaction.amount_cents
                                     over ALL rows whose policy_id == policy.id
      # CONSERVED QUANTITY (money). For any forward action F on this policy and its compensating
      # action C:  written_premium_cents(after C) == written_premium_cents(before F)
      # and the identity written_premium_cents == sum(ledger) holds after every request.
      # Pairs pinned by this scaffold:
      #   bind endorsement (+premium_delta_cents) / void endorsement (-premium_delta_cents)
      #   create war placement (+premium_cents)   / cancel placement  (-premium_cents)
      policy.outstanding_reserve_cents = sum of Claim.reserve_cents over claims on this policy whose
                                         adjustment_status == RESERVED
      policy.paid_hull_cents = sum of Claim.settlement_amount_cents over claims on this policy whose
                               adjustment_status == SETTLED and loss_type IN {HULL_DAMAGE, TOTAL_LOSS}
    input_set: >-
      The whole append-only ledger for the policy, in created_at ASC order (order is irrelevant to the
      sum but pinned for the reporting list endpoint).
    constants: {}
    precision: "integer cents; no rounding — the ledger is already integral"

  - name: rerate_adjustment_delta
    trigger: "POST /aviation/pilots/{id}/hours-verifications (once per affected schedule) and
      POST /aviation/schedules/{id}/value-revisions (once, for the single target schedule)."
    algorithm: chronological
    formula: |
      # VARIANT 1 - hours verification (fan-out over every live schedule naming the pilot):
      affected = AircraftSchedule rows where named_pilot_id == pilot.id
                   AND coverage_status IN {PENDING, ACTIVE, SUSPENDED_WARRANTY}
      order    = created_at ASC
      for each schedule s in affected:
          old_premium = s.hull_premium_cents
          s.warranty_basis := VERIFIED_HOURS
          recompute s.rated_pilot_band, s.rate_ppm, s.hull_premium_cents
          delta_s = s.hull_premium_cents - old_premium
          if delta_s != 0 and s.policy.status == BOUND:
              append PremiumTransaction { txn_type: RERATE_ADJUSTMENT, basis: ANNUAL,
                                          endorsement_id: null, amount_cents: delta_s,
                                          effective_date: current clock }
      # VARIANT 2 - direct agreed-value revision (exactly one schedule, warranty_basis untouched):
      affected = [ the schedule named in the path ]
      old_premium = s.hull_premium_cents
      s.agreed_value_cents := new_agreed_value_cents
      recompute s.rate_ppm and s.hull_premium_cents (rated_pilot_band and warranty_basis unchanged)
      delta = s.hull_premium_cents - old_premium
      if delta != 0 and s.policy.status == BOUND:
          append PremiumTransaction { txn_type: RERATE_ADJUSTMENT, basis: ANNUAL,
                                      endorsement_id: null, amount_cents: delta,
                                      effective_date: current clock }
      # Both variants post the ANNUAL difference of two already-floored premiums; NEITHER is
      # pro-rated over the unexpired term (that is what the endorsement route does instead).
    input_set: >-
      Variant 1: only live schedules naming the verified pilot; TOTAL_LOSS_SETTLED and REMOVED
      schedules are never re-rated. Variant 2: exactly the one schedule named in the path, which
      validations[priority=14] has already forced to be live. Schedules on DRAFT policies are
      re-rated but write no ledger entry, because their premium has not yet been written.
    constants: {}
    precision: "integer cents; the delta is the difference of two already-floored premiums"

validations:
  - priority: 1
    category: auth
    check: "Both X-User-ID and X-User-Role headers are present and non-blank on every request."
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role is one of the five declared roles (Underwriter, Broker, ClaimsAdjuster, OperatorUser, Auditor)."
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: all
  - priority: 3
    category: auth
    check: "The caller's role appears in the target endpoint's roles list."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 4
    category: auth
    check: >-
      An OperatorUser's X-User-ID must equal the operator_id of the Operator that owns the policy
      reached by the request (directly, or transitively via schedule/endorsement/claim/placement/
      declaration/transaction). Reads and writes on another operator's tree are refused.
    error_id: ERR_OPERATOR_SCOPE_VIOLATION
    http_status: 403
    applies_to: "all business endpoints (not POST /aviation/_clock/set_current_utc)"
  - priority: 5
    category: existence
    check: "The {id} path parameter resolves to an existing row of the endpoint's own collection."
    error_id: "ERR_OPERATOR_NOT_FOUND | ERR_AIRCRAFT_NOT_FOUND | ERR_PILOT_NOT_FOUND | ERR_POLICY_NOT_FOUND | ERR_SCHEDULE_NOT_FOUND | ERR_ENDORSEMENT_NOT_FOUND | ERR_MARKET_NOT_FOUND | ERR_PLACEMENT_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_ASSESSMENT_NOT_FOUND | ERR_TRANSACTION_NOT_FOUND | ERR_DECLARATION_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint whose path contains {id}"
  - priority: 6
    category: existence
    check: >-
      Every FK supplied in the request body resolves to an existing row, validated in the body-field
      order declared by the endpoint's input list (operator_id, then policy_id, then aircraft_id, then
      named_pilot_id, then market_id, then schedule_id, then target_schedule_id, then claim_id).
    error_id: "ERR_OPERATOR_NOT_FOUND | ERR_POLICY_NOT_FOUND | ERR_AIRCRAFT_NOT_FOUND | ERR_PILOT_NOT_FOUND | ERR_MARKET_NOT_FOUND | ERR_SCHEDULE_NOT_FOUND | ERR_CLAIM_NOT_FOUND"
    http_status: 404
    applies_to: "all POST endpoints carrying FK fields in the body"
  - priority: 7
    category: business_constraint
    check: >-
      Every field marked source: input without a default is present, and every present field carries
      the declared JSON type (integers are JSON numbers without a fractional part, instants are
      RFC-3339 UTC strings ending in Z, booleans are JSON booleans).
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"
  - priority: 8
    category: business_constraint
    check: >-
      Every supplied value satisfies its §1.1 constraints line: enum membership, string length and
      charset, integer sign and range, and the ordering rules effective_from < effective_to,
      period_from <= period_to, coverage_from < coverage_to.
    error_id: ERR_VALIDATION_FAILED
    http_status: 422
    applies_to: "all POST endpoints"
  - priority: 9
    category: business_constraint
    check: >-
      Conditional field presence: aoc_number is mandatory when operator_type == AIR_CARRIER;
      target_schedule_id is mandatory for VALUE_REVISION / USE_CLASS_CHANGE / REMOVE_AIRCRAFT
      endorsements and MUST be null for the other types; aircraft_id, named_pilot_id,
      new_agreed_value_cents and new_use_class are all mandatory for ADD_AIRCRAFT;
      new_agreed_value_cents is mandatory for VALUE_REVISION; new_use_class is
      mandatory for USE_CLASS_CHANGE; territory_code is mandatory for
      TERRITORY_EXTENSION; exposure_member_count and per_seat_limit_cents are mandatory for the three
      exposure types.
    error_id: ERR_CONDITIONAL_FIELD_REQUIRED
    http_status: 422
    applies_to: "POST /aviation/operators, POST /aviation/endorsements"
  - priority: 10
    category: business_constraint
    check: "registration_mark is unique across all Aircraft rows (exact, case-sensitive after the uppercase constraint)."
    error_id: ERR_DUPLICATE_REGISTRATION
    http_status: 409
    applies_to: "POST /aviation/aircraft"
  - priority: 11
    category: state
    check: >-
      Policy is in DRAFT: required to attach a schedule with acquisition_source == SCHEDULED, and
      required by POST /aviation/policies/{id}/bind.
    error_id: ERR_POLICY_NOT_DRAFT
    http_status: 409
    applies_to: "POST /aviation/policies/{id}/bind, POST /aviation/schedules (SCHEDULED only)"
  - priority: 12
    category: state
    check: >-
      Policy is in the state the write requires: endorsements, claims, fleet declarations and
      AUTOMATIC_ACQUISITION schedules all require status == BOUND. A war placement is the single
      exception and is accepted on a DRAFT policy as well, because the war slip is arranged in the
      separate market BEFORE inception and policy bind itself requires that slip whenever
      war_risk_required is true. EXPIRED policies refuse every write.
    error_id: ERR_POLICY_NOT_BOUND
    http_status: 409
    applies_to: >-
      POST /aviation/endorsements, POST /aviation/war-placements, POST /aviation/claims,
      POST /aviation/fleet-declarations, POST /aviation/schedules (AUTOMATIC_ACQUISITION only)
  - priority: 13
    category: state
    check: >-
      Endorsement is in the state its action requires: SUBMITTED for quote, QUOTED for referral and
      for bind, SUBMITTED or QUOTED for void. BOUND and VOID are terminal.
    error_id: ERR_ENDORSEMENT_INVALID_STATE
    http_status: 409
    applies_to: >-
      POST /aviation/endorsements/{id}/quote, POST /aviation/endorsements/{id}/referral,
      POST /aviation/endorsements/{id}/bind, POST /aviation/endorsements/{id}/void
  - priority: 14
    category: state
    check: >-
      The target AircraftSchedule is live (coverage_status IN {PENDING, ACTIVE, SUSPENDED_WARRANTY}).
      TOTAL_LOSS_SETTLED and REMOVED schedules accept no value revision, no endorsement binding, no
      new claim and no coverage decision.
    error_id: ERR_SCHEDULE_NOT_LIVE
    http_status: 409
    applies_to: >-
      POST /aviation/schedules/{id}/value-revisions, POST /aviation/schedules/{id}/warranty-findings,
      POST /aviation/endorsements/{id}/bind, POST /aviation/claims,
      POST /aviation/claims/{id}/coverage-decision
  - priority: 15
    category: state
    check: >-
      Claim is in the state its action requires: NOTIFIED or INVESTIGATING for POST investigations;
      INVESTIGATING or COVERAGE_REFERRED for POST coverage-decision; NOTIFIED, INVESTIGATING or
      RESERVED for POST damage-assessments; RESERVED for POST settlement. SETTLED and DENIED are
      terminal and refuse every further action.
    error_id: ERR_CLAIM_INVALID_STATE
    http_status: 409
    applies_to: >-
      POST /aviation/claims/{id}/investigations, POST /aviation/damage-assessments,
      POST /aviation/claims/{id}/coverage-decision, POST /aviation/claims/{id}/settlement,
      POST /aviation/claims/{id}/salvage-disposition
  - priority: 16
    category: state
    check: "WarRiskPlacement is BOUND; a CANCELLED placement cannot be cancelled again."
    error_id: ERR_PLACEMENT_NOT_BOUND
    http_status: 409
    applies_to: "POST /aviation/war-placements/{id}/cancellation"
  - priority: 17
    category: state
    check: "FleetDeclaration is SUBMITTED; ACCEPTED and REJECTED are terminal."
    error_id: ERR_DECLARATION_NOT_SUBMITTED
    http_status: 409
    applies_to: "POST /aviation/fleet-declarations/{id}/acceptance"
  - priority: 18
    category: state
    check: >-
      The requested salvage_action is reachable from the claim's current salvage_status: RETAIN and
      TENDER require NONE; SELL and ABANDON require TENDERED. RETAINED_BY_INSURED, SOLD and ABANDONED
      are terminal, so a second disposition is refused.
    error_id: ERR_SALVAGE_INVALID_STATE
    http_status: 409
    applies_to: "POST /aviation/claims/{id}/salvage-disposition"
  - priority: 19
    category: state
    check: >-
      The OCC token matches the current parent version. expected_policy_version must equal
      Policy.version on POST /aviation/war-placements; expected_schedule_version must equal
      AircraftSchedule.version on POST /aviation/schedules/{id}/value-revisions. A token that is
      well-formed but stale is rejected before any business rule runs and mutates nothing.
    error_id: "ERR_STALE_POLICY_VERSION | ERR_STALE_SCHEDULE_VERSION"
    http_status: 412
    applies_to: "POST /aviation/war-placements, POST /aviation/schedules/{id}/value-revisions"
  - priority: 20
    category: business_safety
    check: >-
      The named pilot's medical certificate is unexpired at the schedule's effective_from
      (pilot.medical_expires_at >= schedule.effective_from). A lapsed medical blocks attachment
      outright — it is not a warranty suspension.
    error_id: ERR_PILOT_MEDICAL_EXPIRED
    http_status: 422
    applies_to: "POST /aviation/schedules, POST /aviation/endorsements/{id}/bind (ADD_AIRCRAFT)"
  - priority: 21
    category: business_safety
    check: >-
      The schedule's warranty is not BREACHED. A BREACHED warranty suspends cover, so it blocks
      value revisions, endorsement bindings against that schedule, and settlement of a claim on it
      until a WAIVER finding is recorded.
    error_id: ERR_PILOT_WARRANTY_BREACHED
    http_status: 422
    applies_to: >-
      POST /aviation/schedules/{id}/value-revisions, POST /aviation/endorsements/{id}/bind,
      POST /aviation/claims/{id}/settlement
  - priority: 22
    category: business_safety
    check: >-
      The schedule's use_class is listed in policy.permitted_use_classes, and is plausible for the
      operator: INSTRUCTIONAL requires operator_type IN {FLIGHT_SCHOOL, FLYING_CLUB}, COMMERCIAL
      requires operator_type == AIR_CARRIER with a non-null aoc_number.
    error_id: ERR_USE_CLASS_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /aviation/schedules, POST /aviation/endorsements (ADD_AIRCRAFT, USE_CLASS_CHANGE)"
  - priority: 23
    category: business_safety
    check: >-
      War, hijacking and terrorism losses are only payable when the peril was placed in the separate
      market: a claim whose loss_type == WAR_PERIL requires a WarRiskPlacement on the same policy
      that is BOUND and whose closed coverage interval contains claim.loss_date.
    error_id: ERR_WAR_RISK_NOT_PLACED
    http_status: 422
    applies_to: >-
      POST /aviation/claims (loss_type == WAR_PERIL), POST /aviation/claims/{id}/settlement,
      POST /aviation/endorsements/{id}/bind (TERRITORY_EXTENSION with territory_code == WAR_ZONE_A,
      whose effective_date must sit inside a BOUND placement window)
  - priority: 24
    category: business_safety
    check: >-
      Cover cannot be confirmed while the insured is withholding accident-investigation cooperation:
      a decision of COVERED requires claim.cooperation_status == COOPERATING, which only a recorded
      investigation submitted with cooperation_status == COOPERATING can produce. This is the reason
      no SETTLED claim can exist behind a NON_COOPERATION investigation: the reserve gate upstream of
      settlement is where the rule bites, so settlement itself needs no cooperation re-check.
    error_id: ERR_INVESTIGATION_COOPERATION_MISSING
    http_status: 422
    applies_to: "POST /aviation/claims/{id}/coverage-decision (decision == COVERED)"
  - priority: 25
    category: business_safety
    check: >-
      Segregation of duties: the X-User-ID settling a claim must differ from
      claim.coverage_decided_by_user_id, and the X-User-ID binding an endorsement must differ from
      endorsement.quoted_by_user_id. The header identity, not the role, is what is compared.
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /aviation/claims/{id}/settlement, POST /aviation/endorsements/{id}/bind"
  - priority: 26
    category: business_temporal
    check: >-
      A schedule's coverage window lies inside its policy's term: policy.effective_from <=
      schedule.effective_from < schedule.effective_to <= policy.effective_to.
    error_id: ERR_SCHEDULE_WINDOW_OUTSIDE_POLICY
    http_status: 422
    applies_to: "POST /aviation/schedules"
  - priority: 27
    category: business_temporal
    check: >-
      An endorsement's effective_date lies inside its policy's term, treated as the half-open
      interval [policy.effective_from, policy.effective_to): an endorsement effective exactly at
      expiry is rejected.
    error_id: ERR_EFFECTIVE_DATE_OUT_OF_TERM
    http_status: 422
    applies_to: "POST /aviation/endorsements"
  - priority: 28
    category: business_temporal
    check: >-
      One airframe carries at most one live schedule at a time. Two schedules for the same
      aircraft_id conflict when their HALF-OPEN windows [effective_from, effective_to) intersect;
      windows that merely touch (A.effective_to == B.effective_from) are adjacent, not overlapping,
      and are allowed. REMOVED and TOTAL_LOSS_SETTLED schedules never conflict.
    error_id: ERR_AIRCRAFT_COVERAGE_OVERLAP
    http_status: 409
    applies_to: "POST /aviation/schedules, POST /aviation/endorsements/{id}/bind (ADD_AIRCRAFT)"
  - priority: 29
    category: business_temporal
    check: >-
      A war placement's coverage window lies inside its policy's term, and its CLOSED interval
      [coverage_from, coverage_to] must not touch or overlap another BOUND placement of the same
      policy for an overlapping perils_scope.
    error_id: ERR_PLACEMENT_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /aviation/war-placements"
  - priority: 30
    category: business_temporal
    check: >-
      claim.loss_date falls inside the named schedule's half-open coverage window
      [effective_from, effective_to) and is not in the future relative to the current logical clock.
    error_id: ERR_LOSS_DATE_NOT_COVERED
    http_status: 422
    applies_to: "POST /aviation/claims"
  - priority: 31
    category: business_temporal
    check: >-
      A fleet declaration's inclusive period [period_from, period_to] lies inside the policy term and
      does not overlap the period of any SUBMITTED or ACCEPTED declaration on the same policy.
    error_id: ERR_DECLARATION_PERIOD_INVALID
    http_status: 422
    applies_to: "POST /aviation/fleet-declarations"
  - priority: 32
    category: business_temporal
    check: >-
      DamageAssessment.assessed_at is at or after claim.loss_date and not after the current logical
      clock.
    error_id: ERR_ASSESSED_AT_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /aviation/damage-assessments"
  - priority: 33
    category: business_referential
    check: >-
      Cross-aggregate coherence: claim.schedule_id must belong to claim.policy_id;
      endorsement.target_schedule_id must belong to endorsement.policy_id.
    error_id: ERR_SCHEDULE_POLICY_MISMATCH
    http_status: 409
    applies_to: "POST /aviation/claims, POST /aviation/endorsements"
  - priority: 34
    category: business_referential
    check: >-
      AUTOMATIC_ACQUISITION schedules are only accepted when policy.automatic_acquisition_enabled is
      true, and a fleet declaration may only be created on such a policy.
    error_id: ERR_AUTO_ACQUISITION_DISABLED
    http_status: 422
    applies_to: "POST /aviation/schedules (AUTOMATIC_ACQUISITION), POST /aviation/fleet-declarations"
  - priority: 35
    category: business_referential
    check: >-
      The requested perils_scope is offered by the target market
      (perils_scope IN market.perils_offered).
    error_id: ERR_PERILS_NOT_OFFERED
    http_status: 422
    applies_to: "POST /aviation/war-placements"
  - priority: 36
    category: business_constraint
    check: >-
      An endorsement may be quoted at most MAX_QUOTE_ROUNDS (3) times; the fourth quote attempt after
      three referrals is refused rather than silently reusing the last quote.
    error_id: ERR_QUOTE_ROUNDS_EXHAUSTED
    http_status: 422
    applies_to: "POST /aviation/endorsements/{id}/quote"
  - priority: 37
    category: business_constraint
    check: >-
      The requested settlement_basis is permitted for the claim's evidence: AGREED_VALUE requires
      ctl_flag == true AND warranty_status == COMPLIANT; DEPRECIATED_VALUE requires ctl_flag == true;
      PARTIAL_REPAIR requires ctl_flag == false. Every basis requires assessment_count >= 1.
    error_id: ERR_SETTLEMENT_BASIS_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /aviation/claims/{id}/settlement"
  - priority: 38
    category: business_constraint
    check: >-
      A total-loss settlement requires salvage to have been dealt with: salvage_status must not be
      NONE when settlement_basis IN {AGREED_VALUE, DEPRECIATED_VALUE}.
    error_id: ERR_SALVAGE_DISPOSITION_REQUIRED
    http_status: 422
    applies_to: "POST /aviation/claims/{id}/settlement"
  - priority: 39
    category: business_fiscal
    check: >-
      Agreed value may not exceed OVER_INSURANCE_CAP_PPM (120%) of the aircraft's depreciated value at
      the schedule's effective_from year: agreed_value_cents <=
      floor(depreciated_hull_value(effective_from year) * 1200000 / 1000000).
    error_id: ERR_OVER_INSURED_VALUE
    http_status: 422
    applies_to: >-
      POST /aviation/schedules, POST /aviation/schedules/{id}/value-revisions,
      POST /aviation/endorsements (ADD_AIRCRAFT, VALUE_REVISION)
  - priority: 40
    category: business_fiscal
    check: >-
      The policy's hull sum insured may not exceed its aggregate: the sum of agreed_value_cents over
      live schedules, including the one being created or revised, must be <=
      policy.hull_aggregate_limit_cents.
    error_id: ERR_HULL_AGGREGATE_EXCEEDED
    http_status: 422
    applies_to: >-
      POST /aviation/schedules, POST /aviation/schedules/{id}/value-revisions,
      POST /aviation/endorsements/{id}/bind, POST /aviation/claims/{id}/settlement
  - priority: 41
    category: business_fiscal
    check: >-
      A war placement's line must fit the market's aggregate over the overlapping closed interval
      (calculations.market_line_occupancy): peak_cents + requested line <= market.aggregate_line_cents.
      The test is inclusive, so filling the line to the last cent succeeds.
    error_id: ERR_MARKET_LINE_EXCEEDED
    http_status: 422
    applies_to: "POST /aviation/war-placements"
  - priority: 42
    category: business_fiscal
    check: >-
      A claim reserve may not exceed the exposure it protects: reserve_cents <=
      schedule.agreed_value_cents for hull losses and <= policy.liability_limit_cents for liability
      losses.
    error_id: ERR_RESERVE_EXCEEDS_LIMIT
    http_status: 422
    applies_to: "POST /aviation/claims/{id}/coverage-decision"
  - priority: 43
    category: state
    check: >-
      A policy may only be bound once it has something to insure: at least one AircraftSchedule on the
      policy has coverage_status == PENDING. Ranked below the fiscal rules because it is the last thing
      checked at bind — a policy that is not DRAFT (priority 11) fails first.
    error_id: ERR_POLICY_HAS_NO_SCHEDULES
    http_status: 409
    applies_to: "POST /aviation/policies/{id}/bind"

endpoints:
  - method: POST
    path: "/aviation/operators"
    description: "Register an insured operator."
    roles: [Underwriter, Broker]
    code: 201
    input: [legal_name, operator_type, home_base_icao, "aoc_number?"]
    output: Operator
    side_effects: ["policy_count initialised to 0"]
  - method: GET
    path: "/aviation/operators/{id}"
    description: "Fetch one operator with its live policy count."
    roles: [Underwriter, Broker, ClaimsAdjuster, OperatorUser, Auditor]
    code: 200
    input: []
    output: Operator
    side_effects: []
  - method: POST
    path: "/aviation/aircraft"
    description: "Register an airframe. registration_mark is globally unique."
    roles: [Underwriter, Broker]
    code: 201
    input: [registration_mark, aircraft_class, manufacture_year, hull_new_value_cents, seat_count, max_takeoff_weight_kg]
    output: Aircraft
    side_effects: ["current_depreciated_value_cents computed via calculations.depreciated_hull_value (clock_basis)"]
  - method: GET
    path: "/aviation/aircraft/{id}"
    description: "Fetch one airframe; current_depreciated_value_cents is re-derived against the current logical clock on every read."
    roles: [Underwriter, Broker, ClaimsAdjuster, OperatorUser, Auditor]
    code: 200
    input: []
    output: Aircraft
    side_effects: ["calculations.depreciated_hull_value (clock_basis)"]
  - method: POST
    path: "/aviation/pilots"
    description: "Register a pilot with broker-declared logbook figures."
    roles: [Underwriter, Broker]
    code: 201
    input: [pilot_name, license_type, total_logged_hours, hours_on_type, last_training_completed_at, medical_expires_at, "instrument_rated?"]
    output: Pilot
    side_effects:
      - >-
        calculations.pilot_qualification_score (logged_hours_basis) populating
        qualification_score_logged and rating_band_logged; the verified_* fields and verified_at stay
        null and the verified score/band stay null.
  - method: GET
    path: "/aviation/pilots/{id}"
    description: "Fetch one pilot with both the logged and (once audited) the verified score and band."
    roles: [Underwriter, Broker, ClaimsAdjuster, OperatorUser, Auditor]
    code: 200
    input: []
    output: Pilot
    side_effects: []
  - method: POST
    path: "/aviation/pilots/{id}/hours-verifications"
    description: >-
      Record a logbook audit. Sets the verified hours, recomputes the verified score/band, flips every
      live schedule naming this pilot onto the VERIFIED_HOURS basis and re-rates them.
    roles: [Underwriter]
    code: 201
    input: [verified_total_hours, verified_hours_on_type]
    output: Pilot
    side_effects:
      - >-
        calculations.pilot_qualification_score (verified_hours_basis); verified_at set to the current
        logical clock; calculations.rerate_adjustment_delta over live schedules in created_at ASC order,
        each re-running calculations.hull_rate_ppm and calculations.annual_hull_premium and appending a
        RERATE_ADJUSTMENT PremiumTransaction when the delta is non-zero and the policy is BOUND;
        calculations.policy_written_premium; warranty re-evaluation may drive
        AircraftSchedule.warranty_status to BREACHED and coverage_status to SUSPENDED_WARRANTY.
  - method: POST
    path: "/aviation/policies"
    description: "Open a DRAFT policy for an operator."
    roles: [Underwriter, Broker]
    code: 201
    input: [operator_id, policy_type, effective_from, effective_to, territorial_limit_code, base_hull_rate_ppm, hull_deductible_ppm, liability_limit_cents, hull_aggregate_limit_cents, "permitted_use_classes?", "automatic_acquisition_enabled?", "acquisition_reporting_days?", "war_risk_required?"]
    output: Policy
    side_effects:
      - >-
        policy_number generated; status initialised to DRAFT; term_days computed;
        Operator.policy_count incremented.
  - method: GET
    path: "/aviation/policies"
    description: "List policies, filtered by operator and status."
    roles: [Underwriter, Broker, ClaimsAdjuster, OperatorUser, Auditor]
    code: 200
    input: ["operator_id?", "status?", "policy_type?", "limit?", "offset?"]
    output: Policy[]
    side_effects: []
  - method: GET
    path: "/aviation/policies/{id}"
    description: "Fetch one policy with its derived premium, sum-insured, reserve and paid-hull figures."
    roles: [Underwriter, Broker, ClaimsAdjuster, OperatorUser, Auditor]
    code: 200
    input: []
    output: Policy
    side_effects: ["calculations.policy_written_premium re-derived for the response"]
  - method: POST
    path: "/aviation/policies/{id}/bind"
    description: "Bind a DRAFT policy, writing the initial premium for every attached schedule."
    roles: [Underwriter]
    code: 200
    input: []
    output: Policy
    side_effects:
      - >-
        Policy.status DRAFT -> BOUND; every attached schedule PENDING -> ACTIVE, immediately followed by
        the system transition ACTIVE -> SUSPENDED_WARRANTY for any schedule whose warranty_status is
        already BREACHED; one INITIAL_PREMIUM
        PremiumTransaction per schedule in created_at ASC order; calculations.policy_written_premium;
        version incremented.
  - method: POST
    path: "/aviation/schedules"
    description: >-
      Attach an aircraft to a policy with a named pilot, an agreed value and a use class. SCHEDULED
      attachments require a DRAFT policy; AUTOMATIC_ACQUISITION attachments require a BOUND policy
      with automatic_acquisition_enabled and enter PENDING awaiting a fleet declaration.
    roles: [Underwriter, Broker]
    code: 201
    input: [policy_id, aircraft_id, named_pilot_id, use_class, agreed_value_cents, effective_from, effective_to, "acquisition_source?"]
    output: AircraftSchedule
    side_effects:
      - >-
        warranted_min_total_hours and warranted_min_hours_on_type resolved from use_class;
        warranty_status initialised to its initial state PENDING_EVIDENCE (evidence of the pilot
        warranty has not yet been sighted); coverage_status initialised to PENDING;
        calculations.pilot_qualification_score, calculations.hull_rate_ppm and
        calculations.annual_hull_premium (fleet credit evaluated including this schedule);
        Policy.total_hull_sum_insured_cents and live_schedule_count updated; version incremented.
  - method: GET
    path: "/aviation/schedules"
    description: "List aircraft schedules by policy, airframe, named pilot, reporting declaration or coverage status."
    roles: [Underwriter, Broker, ClaimsAdjuster, OperatorUser, Auditor]
    code: 200
    input: ["policy_id?", "aircraft_id?", "named_pilot_id?", "reported_declaration_id?", "coverage_status?", "warranty_status?", "limit?", "offset?"]
    output: AircraftSchedule[]
    side_effects: []
  - method: GET
    path: "/aviation/schedules/{id}"
    description: "Fetch one schedule with its rate, premium, warranty status and version."
    roles: [Underwriter, Broker, ClaimsAdjuster, OperatorUser, Auditor]
    code: 200
    input: []
    output: AircraftSchedule
    side_effects: []
  - method: POST
    path: "/aviation/schedules/{id}/value-revisions"
    description: >-
      Revise the agreed value of a live schedule in place. Guarded by optimistic concurrency on the
      schedule's own version.
    roles: [Underwriter]
    code: 200
    input: [new_agreed_value_cents, expected_schedule_version]
    output: AircraftSchedule
    side_effects:
      - >-
        agreed_value_cents replaced; calculations.hull_rate_ppm and calculations.annual_hull_premium
        re-run; a RERATE_ADJUSTMENT PremiumTransaction appended for the annual difference when
        the policy is BOUND; Policy.total_hull_sum_insured_cents and written_premium_cents updated;
        version incremented.
  - method: POST
    path: "/aviation/schedules/{id}/warranty-findings"
    description: >-
      Record an underwriting finding against the pilot warranty: EVIDENCE_VERIFIED, BREACH or WAIVER.
      This is the only way to move warranty_status and the only way to lift a suspension.
    roles: [Underwriter]
    code: 200
    input: [finding, "breach_reason?"]
    output: AircraftSchedule
    side_effects:
      - >-
        warranty_status transition (PENDING_EVIDENCE -> COMPLIANT on EVIDENCE_VERIFIED; * -> BREACHED on
        BREACH; BREACHED -> WAIVED on WAIVER); coverage_status cascade ACTIVE -> SUSPENDED_WARRANTY on
        BREACH and SUSPENDED_WARRANTY -> ACTIVE on WAIVER or EVIDENCE_VERIFIED; open claims on the
        schedule move to COVERAGE_REFERRED on BREACH; Policy.outstanding_reserve_cents re-derived;
        version incremented.
  - method: POST
    path: "/aviation/endorsements"
    description: >-
      Submit a mid-term endorsement of one of the ten declared types (ADD_AIRCRAFT, REMOVE_AIRCRAFT,
      VALUE_REVISION, USE_CLASS_CHANGE, TERRITORY_EXTENSION, PREMISES_LIABILITY, PRODUCT_LIABILITY,
      NON_OWNED_EXPOSURE, RENTER_EXPOSURE, FLYING_CLUB_EXPOSURE).
    roles: [Underwriter, Broker]
    code: 201
    input: [policy_id, endorsement_type, effective_date, "target_schedule_id?", "aircraft_id?", "named_pilot_id?", "new_agreed_value_cents?", "new_use_class?", "territory_code?", "exposure_member_count?", "per_seat_limit_cents?"]
    output: Endorsement
    side_effects: ["status initialised to SUBMITTED; quote_round initialised to 0; version incremented"]
  - method: GET
    path: "/aviation/endorsements"
    description: "List endorsements by policy, target schedule, airframe, named pilot or status."
    roles: [Underwriter, Broker, ClaimsAdjuster, OperatorUser, Auditor]
    code: 200
    input: ["policy_id?", "target_schedule_id?", "aircraft_id?", "named_pilot_id?", "status?", "endorsement_type?", "limit?", "offset?"]
    output: Endorsement[]
    side_effects: []
  - method: GET
    path: "/aviation/endorsements/{id}"
    description: "Fetch one endorsement with its quoted and bound premium deltas."
    roles: [Underwriter, Broker, ClaimsAdjuster, OperatorUser, Auditor]
    code: 200
    input: []
    output: Endorsement
    side_effects: []
  - method: POST
    path: "/aviation/endorsements/{id}/quote"
    description: "Price a SUBMITTED endorsement. At most three quote rounds per endorsement."
    roles: [Underwriter]
    code: 200
    input: []
    output: Endorsement
    side_effects:
      - >-
        status SUBMITTED -> QUOTED; quote_round incremented; quoted_by_user_id set from X-User-ID;
        calculations.endorsement_premium_delta writing quoted_premium_delta_cents; version incremented.
  - method: POST
    path: "/aviation/endorsements/{id}/referral"
    description: "Refer a QUOTED endorsement back for re-submission, cycling it to SUBMITTED without losing the quote history."
    roles: [Underwriter]
    code: 200
    input: [referral_reason]
    output: Endorsement
    side_effects:
      - >-
        status QUOTED -> SUBMITTED; quoted_premium_delta_cents cleared to null; quote_round retained so
        the three-round ceiling still bites; version incremented.
  - method: POST
    path: "/aviation/endorsements/{id}/bind"
    description: >-
      Bind a QUOTED endorsement, freezing its premium delta and applying its structural effect to the
      policy. The binder's X-User-ID must differ from the quoter's.
    roles: [Underwriter]
    code: 200
    input: []
    output: Endorsement
    side_effects:
      - >-
        status QUOTED -> BOUND; premium_delta_cents frozen from quoted_premium_delta_cents; an
        ENDORSEMENT_PREMIUM PremiumTransaction appended; type-specific cascade (ADD_AIRCRAFT creates an
        ACTIVE AircraftSchedule; REMOVE_AIRCRAFT moves the target schedule to REMOVED;
        VALUE_REVISION / USE_CLASS_CHANGE mutate and re-rate the target schedule; TERRITORY_EXTENSION
        rewrites Policy.territorial_limit_code; PREMISES_LIABILITY and PRODUCT_LIABILITY set the
        matching Policy extension flag); calculations.policy_written_premium; version incremented.
  - method: POST
    path: "/aviation/endorsements/{id}/void"
    description: >-
      Void an endorsement. Voiding a BOUND endorsement is the compensating action: it reverses the
      premium and every structural effect.
    roles: [Underwriter]
    code: 200
    input: [void_reason]
    output: Endorsement
    side_effects:
      - >-
        status SUBMITTED|QUOTED|BOUND -> VOID; for a BOUND endorsement a RETURN_PREMIUM
        PremiumTransaction of exactly -premium_delta_cents is appended and the structural effect is
        undone (a created schedule goes REMOVED, a REMOVED schedule returns to ACTIVE, a revised value
        or use class is restored and re-rated, an extension flag is cleared);
        calculations.policy_written_premium returns to its pre-bind value; version incremented.
  - method: POST
    path: "/aviation/war-markets"
    description: "Open a separate war/hijacking/terrorism market with a finite aggregate line."
    roles: [Underwriter]
    code: 201
    input: [market_name, aggregate_line_cents, perils_offered]
    output: WarRiskMarket
    side_effects: ["committed_line_cents initialised to 0; available_line_cents initialised to aggregate_line_cents"]
  - method: GET
    path: "/aviation/war-markets/{id}"
    description: "Fetch one market with its committed and available line."
    roles: [Underwriter, Broker, ClaimsAdjuster, OperatorUser, Auditor]
    code: 200
    input: []
    output: WarRiskMarket
    side_effects: ["calculations.market_line_occupancy re-derived for the response"]
  - method: POST
    path: "/aviation/war-placements"
    description: >-
      Place the war, hijacking and terrorism perils for a BOUND policy into a separate market. Guarded
      by optimistic concurrency on the policy's version because the placement writes premium onto the
      policy ledger.
    roles: [Underwriter]
    code: 201
    input: [policy_id, market_id, war_hull_line_cents, perils_scope, coverage_from, coverage_to, expected_policy_version]
    output: WarRiskPlacement
    side_effects:
      - >-
        status initialised to BOUND; calculations.war_risk_premium; calculations.market_line_occupancy
        admission test then WarRiskMarket.committed_line_cents and available_line_cents updated; a
        WAR_RISK_PREMIUM PremiumTransaction appended; calculations.policy_written_premium;
        Policy.version incremented.
  - method: GET
    path: "/aviation/war-placements"
    description: "List war-risk placements by policy, market, perils scope or status."
    roles: [Underwriter, Broker, ClaimsAdjuster, OperatorUser, Auditor]
    code: 200
    input: ["policy_id?", "market_id?", "perils_scope?", "status?", "limit?", "offset?"]
    output: WarRiskPlacement[]
    side_effects: []
  - method: GET
    path: "/aviation/war-placements/{id}"
    description: "Fetch one war-risk placement with its premium."
    roles: [Underwriter, Broker, ClaimsAdjuster, OperatorUser, Auditor]
    code: 200
    input: []
    output: WarRiskPlacement
    side_effects: []
  - method: POST
    path: "/aviation/war-placements/{id}/cancellation"
    description: >-
      Cancel a BOUND placement. This is the compensating action for the market's capacity: the line is
      released exactly and the premium is reversed in full.
    roles: [Underwriter]
    code: 200
    input: [cancellation_reason]
    output: WarRiskPlacement
    side_effects:
      - >-
        status BOUND -> CANCELLED; a RETURN_PREMIUM PremiumTransaction of exactly -premium_cents
        appended; WarRiskMarket.committed_line_cents decreased by war_hull_line_cents and
        available_line_cents restored to its pre-placement value;
        calculations.policy_written_premium; version incremented.
  - method: POST
    path: "/aviation/claims"
    description: "Notify a loss against a specific aircraft schedule."
    roles: [Broker, OperatorUser, ClaimsAdjuster]
    code: 201
    input: [policy_id, schedule_id, loss_date, loss_type, loss_description, "investigator_reference?"]
    output: Claim
    side_effects:
      - >-
        adjustment_status initialised to NOTIFIED; salvage_status initialised to NONE;
        cooperation_status initialised to PENDING; reserve_cents initialised to 0; assessment_count
        initialised to 0; ctl_flag initialised to false; version incremented.
  - method: GET
    path: "/aviation/claims"
    description: "List claims by policy, schedule, adjustment status, salvage status or loss type."
    roles: [Underwriter, Broker, ClaimsAdjuster, OperatorUser, Auditor]
    code: 200
    input: ["policy_id?", "schedule_id?", "adjustment_status?", "salvage_status?", "loss_type?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []
  - method: GET
    path: "/aviation/claims/{id}"
    description: "Fetch one claim with its CTL ratio, reserve and settlement figures."
    roles: [Underwriter, Broker, ClaimsAdjuster, OperatorUser, Auditor]
    code: 200
    input: []
    output: Claim
    side_effects: []
  - method: POST
    path: "/aviation/claims/{id}/investigations"
    description: >-
      Record accident-investigation activity and whether the insured cooperated. Cooperation is a
      precondition of settlement.
    roles: [ClaimsAdjuster]
    code: 200
    input: [cooperation_status, investigator_reference]
    output: Claim
    side_effects:
      - >-
        cooperation_status stored as submitted (COOPERATING or NON_COOPERATION); adjustment_status
        NOTIFIED -> INVESTIGATING when COOPERATING and NOTIFIED -> COVERAGE_REFERRED when
        NON_COOPERATION; investigator_reference stored; version incremented.
  - method: POST
    path: "/aviation/damage-assessments"
    description: >-
      Append an immutable damage assessment to a claim. Each append recomputes the claim's
      constructive-total-loss ratio from the currently selected assessment.
    roles: [ClaimsAdjuster]
    code: 201
    input: [claim_id, repair_cost_estimate_cents, assessor_reference, assessed_at]
    output: DamageAssessment
    side_effects:
      - >-
        calculations.constructive_total_loss_ratio writing the row's own ctl_ratio_ppm and verdict and
        then the claim's ctl_ratio_ppm, ctl_flag and assessment_count; Claim.loss_type promoted from
        HULL_DAMAGE to TOTAL_LOSS when ctl_flag becomes true; Claim.version incremented.
  - method: GET
    path: "/aviation/damage-assessments"
    description: "List damage assessments for a claim in assessed_at order."
    roles: [Underwriter, Broker, ClaimsAdjuster, OperatorUser, Auditor]
    code: 200
    input: ["claim_id?", "verdict?", "limit?", "offset?"]
    output: DamageAssessment[]
    side_effects: []
  - method: GET
    path: "/aviation/damage-assessments/{id}"
    description: "Fetch one immutable damage assessment."
    roles: [Underwriter, Broker, ClaimsAdjuster, OperatorUser, Auditor]
    code: 200
    input: []
    output: DamageAssessment
    side_effects: []
  - method: POST
    path: "/aviation/claims/{id}/coverage-decision"
    description: >-
      Take the coverage decision: COVERED reserves the claim for payment, DENIED closes it with a
      reason. The deciding X-User-ID is recorded and is barred from settling the same claim.
    roles: [ClaimsAdjuster]
    code: 200
    input: [decision, "reserve_cents?", "denial_reason?"]
    output: Claim
    side_effects:
      - >-
        decision is COVERED or DENIED; adjustment_status INVESTIGATING|COVERAGE_REFERRED -> RESERVED on
        COVERED and -> DENIED on DENIED; reserve_cents (mandatory for COVERED) stored; denial_reason
        (mandatory for DENIED) stored; coverage_decided_by_user_id set from X-User-ID;
        Policy.outstanding_reserve_cents re-derived; version incremented.
  - method: POST
    path: "/aviation/claims/{id}/salvage-disposition"
    description: >-
      Dispose of the hull salvage: retain it with the insured, tender it to the insurer, sell it for
      proceeds, or abandon it. Sale proceeds are credited against the settlement.
    roles: [ClaimsAdjuster]
    code: 200
    input: [salvage_action, "salvage_proceeds_cents?"]
    output: Claim
    side_effects:
      - >-
        salvage_status transition driven by salvage_action: RETAIN -> RETAINED_BY_INSURED and
        TENDER -> TENDERED from NONE, SELL -> SOLD and ABANDON -> ABANDONED from TENDERED;
        salvage_proceeds_cents (mandatory for SELL) stored; version incremented. Runs independently of
        adjustment_status: the two Claim dimensions advance in either order.
  - method: POST
    path: "/aviation/claims/{id}/settlement"
    description: >-
      Settle a RESERVED claim on one of three bases. The settling X-User-ID must differ from the
      coverage decider's.
    roles: [ClaimsAdjuster]
    code: 200
    input: [settlement_basis]
    output: Claim
    side_effects:
      - >-
        calculations.hull_settlement_amount (variant per settlement_basis) writing
        settlement_amount_cents and deductible_applied_cents; adjustment_status RESERVED -> SETTLED;
        reserve_cents zeroed; for a total-loss basis the AircraftSchedule moves to TOTAL_LOSS_SETTLED and
        a SETTLEMENT_RETURN PremiumTransaction returns the unearned hull premium; Policy.paid_hull_cents,
        outstanding_reserve_cents, total_hull_sum_insured_cents, live_schedule_count and
        written_premium_cents all re-derived; version incremented.
  - method: GET
    path: "/aviation/premium-transactions"
    description: "Read the append-only premium ledger, filtered by policy, endorsement or transaction type."
    roles: [Underwriter, Broker, ClaimsAdjuster, OperatorUser, Auditor]
    code: 200
    input: ["policy_id?", "endorsement_id?", "txn_type?", "limit?", "offset?"]
    output: PremiumTransaction[]
    side_effects: []
  - method: GET
    path: "/aviation/premium-transactions/{id}"
    description: "Fetch one immutable ledger row."
    roles: [Underwriter, Broker, ClaimsAdjuster, OperatorUser, Auditor]
    code: 200
    input: []
    output: PremiumTransaction
    side_effects: []
  - method: POST
    path: "/aviation/fleet-declarations"
    description: >-
      Declare the automatically acquired hulls of a reporting period. The declaration sweeps every
      unreported PENDING automatic-acquisition schedule whose effective_from falls in the inclusive
      period and prices them pro rata.
    roles: [Underwriter, Broker]
    code: 201
    input: [policy_id, period_from, period_to]
    output: FleetDeclaration
    side_effects:
      - >-
        status initialised to SUBMITTED; calculations.fleet_declaration_premium writing declared_count,
        declared_premium_cents, late_flag, late_loading_cents and reported_schedule_ids; version
        incremented. No schedule is mutated and no ledger row is written until acceptance.
  - method: GET
    path: "/aviation/fleet-declarations"
    description: "List fleet declarations by policy and status."
    roles: [Underwriter, Broker, ClaimsAdjuster, OperatorUser, Auditor]
    code: 200
    input: ["policy_id?", "status?", "late_flag?", "limit?", "offset?"]
    output: FleetDeclaration[]
    side_effects: []
  - method: GET
    path: "/aviation/fleet-declarations/{id}"
    description: "Fetch one declaration with its priced lines."
    roles: [Underwriter, Broker, ClaimsAdjuster, OperatorUser, Auditor]
    code: 200
    input: []
    output: FleetDeclaration
    side_effects: []
  - method: POST
    path: "/aviation/fleet-declarations/{id}/acceptance"
    description: "Accept or reject a SUBMITTED declaration. Acceptance activates the declared hulls and writes the declared premium."
    roles: [Underwriter]
    code: 200
    input: [decision, "rejection_reason?"]
    output: FleetDeclaration
    side_effects:
      - >-
        status SUBMITTED -> ACCEPTED or REJECTED; on ACCEPTED every reported schedule moves PENDING ->
        ACTIVE (immediately followed by the system transition ACTIVE -> SUSPENDED_WARRANTY when its
        warranty_status is BREACHED) and has
        reported_declaration_id stamped, and one DECLARATION_PREMIUM PremiumTransaction is appended for
        declared_premium_cents; calculations.policy_written_premium; Policy.live_schedule_count
        re-derived; version incremented.
  - method: POST
    path: "/aviation/_clock/set_current_utc"
    description: >-
      Test-driving endpoint: set the server's logical UTC clock. Before any call to this endpoint the
      logical clock reads exactly 2026-08-01T00:00:00Z — this startup default is mandatory and the
      server MUST NOT fall back to real wall-clock time. Every deadline, expiry, depreciation year,
      recurrency horizon and late-reporting test is evaluated against this logical clock.
    roles: [Underwriter, Broker, ClaimsAdjuster, OperatorUser, Auditor]
    code: 200
    input: [current_utc]
    output: null
    side_effects:
      - >-
        The logical clock is repositioned, then a single expiry sweep runs: every BOUND Policy whose
        effective_to is at or before the new instant transitions BOUND -> EXPIRED (created_at ASC). No
        other value is recomputed eagerly: derived reads such as
        Aircraft.current_depreciated_value_cents and FleetDeclaration.late_flag pick the new instant up
        on their next evaluation.

errors:
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-ID or X-User-Role absent, empty, or whitespace-only on any request."
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is not one of Underwriter, Broker, ClaimsAdjuster, OperatorUser, Auditor."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The caller's role is not listed in the target endpoint's roles."
  - id: ERR_OPERATOR_SCOPE_VIOLATION
    http: 403
    condition: "An OperatorUser touches a resource that does not belong to the Operator whose id equals its X-User-ID."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: >-
      The X-User-ID settling a claim equals claim.coverage_decided_by_user_id, or the X-User-ID binding
      an endorsement equals endorsement.quoted_by_user_id.
  - id: ERR_OPERATOR_NOT_FOUND
    http: 404
    condition: "operator_id in the path or body matches no Operator."
  - id: ERR_AIRCRAFT_NOT_FOUND
    http: 404
    condition: "aircraft_id in the path or body matches no Aircraft."
  - id: ERR_PILOT_NOT_FOUND
    http: 404
    condition: "pilot id in the path or named_pilot_id in the body matches no Pilot."
  - id: ERR_POLICY_NOT_FOUND
    http: 404
    condition: "policy_id in the path or body matches no Policy."
  - id: ERR_SCHEDULE_NOT_FOUND
    http: 404
    condition: "schedule id in the path, or schedule_id / target_schedule_id in the body, matches no AircraftSchedule."
  - id: ERR_ENDORSEMENT_NOT_FOUND
    http: 404
    condition: "endorsement id in the path matches no Endorsement."
  - id: ERR_MARKET_NOT_FOUND
    http: 404
    condition: "market id in the path or market_id in the body matches no WarRiskMarket."
  - id: ERR_PLACEMENT_NOT_FOUND
    http: 404
    condition: "war placement id in the path matches no WarRiskPlacement."
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "claim id in the path or claim_id in the body matches no Claim."
  - id: ERR_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "damage assessment id in the path matches no DamageAssessment."
  - id: ERR_TRANSACTION_NOT_FOUND
    http: 404
    condition: "premium transaction id in the path matches no PremiumTransaction."
  - id: ERR_DECLARATION_NOT_FOUND
    http: 404
    condition: "fleet declaration id in the path matches no FleetDeclaration."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "A required input field is absent, or a present field carries the wrong JSON type."
  - id: ERR_VALIDATION_FAILED
    http: 422
    condition: >-
      A field violates its declared constraint: bad enum member, string length or charset, non-positive
      money, ppm outside 0..1000000, or a reversed date/instant pair.
  - id: ERR_CONDITIONAL_FIELD_REQUIRED
    http: 422
    condition: >-
      A field that is mandatory only for a particular discriminator is missing, or a field forbidden
      for that discriminator is present (aoc_number for AIR_CARRIER, the per-endorsement-type field
      sets).
  - id: ERR_DUPLICATE_REGISTRATION
    http: 409
    condition: "registration_mark already exists on another Aircraft."
  - id: ERR_POLICY_NOT_DRAFT
    http: 409
    condition: "The policy must be DRAFT for this operation but is BOUND or EXPIRED."
  - id: ERR_POLICY_NOT_BOUND
    http: 409
    condition: "The policy must be BOUND for this operation but is DRAFT or EXPIRED."
  - id: ERR_ENDORSEMENT_INVALID_STATE
    http: 409
    condition: "The endorsement is not in the state its action requires (quote needs SUBMITTED, referral and bind need QUOTED, void needs a non-terminal state)."
  - id: ERR_SCHEDULE_NOT_LIVE
    http: 409
    condition: "The target AircraftSchedule is TOTAL_LOSS_SETTLED or REMOVED."
  - id: ERR_CLAIM_INVALID_STATE
    http: 409
    condition: "The claim's adjustment_status does not permit this action, or the claim is SETTLED or DENIED."
  - id: ERR_SALVAGE_INVALID_STATE
    http: 409
    condition: "The requested salvage disposition is not reachable from the claim's current salvage_status."
  - id: ERR_PLACEMENT_NOT_BOUND
    http: 409
    condition: "The war placement is already CANCELLED."
  - id: ERR_DECLARATION_NOT_SUBMITTED
    http: 409
    condition: "The fleet declaration is already ACCEPTED or REJECTED."
  - id: ERR_SCHEDULE_POLICY_MISMATCH
    http: 409
    condition: "The referenced schedule belongs to a different policy than the one named in the request."
  - id: ERR_AIRCRAFT_COVERAGE_OVERLAP
    http: 409
    condition: >-
      Another live schedule for the same aircraft_id has a half-open coverage window that intersects
      the requested one. Windows that merely touch are adjacent, not overlapping.
  - id: ERR_STALE_POLICY_VERSION
    http: 412
    condition: "expected_policy_version does not equal the policy's current version."
  - id: ERR_STALE_SCHEDULE_VERSION
    http: 412
    condition: "expected_schedule_version does not equal the schedule's current version."
  - id: ERR_PILOT_MEDICAL_EXPIRED
    http: 422
    condition: "pilot.medical_expires_at is earlier than the schedule's effective_from."
  - id: ERR_PILOT_WARRANTY_BREACHED
    http: 422
    condition: "The schedule's warranty_status is BREACHED and the operation requires unsuspended cover."
  - id: ERR_USE_CLASS_NOT_PERMITTED
    http: 422
    condition: >-
      The use class is absent from policy.permitted_use_classes, or is implausible for the operator's
      operator_type / aoc_number.
  - id: ERR_WAR_RISK_NOT_PLACED
    http: 422
    condition: "A WAR_PERIL loss has no BOUND WarRiskPlacement on the policy whose closed coverage interval contains the loss date."
  - id: ERR_INVESTIGATION_COOPERATION_MISSING
    http: 422
    condition: "A COVERED coverage decision is attempted while claim.cooperation_status is NON_COOPERATION (a claim whose cooperation_status is still PENDING is refused earlier, by the claim-state rule)."
  - id: ERR_SCHEDULE_WINDOW_OUTSIDE_POLICY
    http: 422
    condition: "The schedule's coverage window is not contained in its policy's term."
  - id: ERR_EFFECTIVE_DATE_OUT_OF_TERM
    http: 422
    condition: "The endorsement's effective_date lies outside the half-open policy term [effective_from, effective_to)."
  - id: ERR_PLACEMENT_WINDOW_INVALID
    http: 422
    condition: "The placement window escapes the policy term, or touches/overlaps another BOUND placement of the same policy with an overlapping perils scope."
  - id: ERR_LOSS_DATE_NOT_COVERED
    http: 422
    condition: "claim.loss_date lies outside the schedule's half-open coverage window, or is after the current logical clock."
  - id: ERR_DECLARATION_PERIOD_INVALID
    http: 422
    condition: "The declaration period escapes the policy term or overlaps another SUBMITTED/ACCEPTED declaration on the same policy."
  - id: ERR_ASSESSED_AT_OUT_OF_RANGE
    http: 422
    condition: "assessed_at is before claim.loss_date or after the current logical clock."
  - id: ERR_AUTO_ACQUISITION_DISABLED
    http: 422
    condition: "An AUTOMATIC_ACQUISITION schedule or a fleet declaration is attempted on a policy whose automatic_acquisition_enabled is false."
  - id: ERR_PERILS_NOT_OFFERED
    http: 422
    condition: "The requested perils_scope is not in market.perils_offered."
  - id: ERR_QUOTE_ROUNDS_EXHAUSTED
    http: 422
    condition: "A fourth quote is attempted on an endorsement that has already been quoted three times."
  - id: ERR_SETTLEMENT_BASIS_NOT_PERMITTED
    http: 422
    condition: >-
      The settlement basis does not match the claim's evidence: AGREED_VALUE without ctl_flag or with a
      non-COMPLIANT warranty, DEPRECIATED_VALUE without ctl_flag, PARTIAL_REPAIR with ctl_flag, or any
      basis with assessment_count == 0.
  - id: ERR_SALVAGE_DISPOSITION_REQUIRED
    http: 422
    condition: "A total-loss settlement is attempted while salvage_status is still NONE."
  - id: ERR_OVER_INSURED_VALUE
    http: 422
    condition: "agreed_value_cents exceeds 120% of the airframe's depreciated value at the coverage start year."
  - id: ERR_HULL_AGGREGATE_EXCEEDED
    http: 422
    condition: "The policy's live hull sum insured, or its cumulative paid hull, would exceed hull_aggregate_limit_cents."
  - id: ERR_MARKET_LINE_EXCEEDED
    http: 422
    condition: "The requested war line plus the peak overlapping committed line exceeds the market's aggregate line."
  - id: ERR_RESERVE_EXCEEDS_LIMIT
    http: 422
    condition: "reserve_cents exceeds the schedule's agreed value (hull losses) or the policy's liability limit (liability losses)."
  - id: ERR_POLICY_HAS_NO_SCHEDULES
    http: 409
    condition: "Bind attempted on a DRAFT policy that has no AircraftSchedule with coverage_status == PENDING."

roles:
  - name: Underwriter
    description: >-
      Owns pricing and the insurer's balance sheet: binds policies, quotes and binds endorsements,
      records warranty findings, verifies pilot hours, opens war markets, places and cancels war risk,
      and accepts fleet declarations.
    identity: opaque
    exclusive_operations:
      - "POST /aviation/policies/{id}/bind"
      - "POST /aviation/pilots/{id}/hours-verifications"
      - "POST /aviation/schedules/{id}/value-revisions"
      - "POST /aviation/schedules/{id}/warranty-findings"
      - "POST /aviation/endorsements/{id}/quote"
      - "POST /aviation/endorsements/{id}/referral"
      - "POST /aviation/endorsements/{id}/bind"
      - "POST /aviation/endorsements/{id}/void"
      - "POST /aviation/war-markets"
      - "POST /aviation/war-placements"
      - "POST /aviation/war-placements/{id}/cancellation"
      - "POST /aviation/fleet-declarations/{id}/acceptance"
    shared_operations:
      - "POST /aviation/operators"
      - "POST /aviation/aircraft"
      - "POST /aviation/pilots"
      - "POST /aviation/policies"
      - "POST /aviation/schedules"
      - "POST /aviation/endorsements"
      - "POST /aviation/fleet-declarations"
      - "POST /aviation/_clock/set_current_utc"
      - "all GET endpoints"
  - name: Broker
    description: >-
      Places business on behalf of insureds: registers operators, airframes and pilots, opens draft
      policies, attaches schedules, submits endorsements and fleet declarations, and notifies losses.
      A Broker can never price, bind or settle anything.
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /aviation/operators"
      - "POST /aviation/aircraft"
      - "POST /aviation/pilots"
      - "POST /aviation/policies"
      - "POST /aviation/schedules"
      - "POST /aviation/endorsements"
      - "POST /aviation/fleet-declarations"
      - "POST /aviation/claims"
      - "POST /aviation/_clock/set_current_utc"
      - "all GET endpoints"
  - name: ClaimsAdjuster
    description: >-
      Owns the claim file end to end: investigations, damage assessments, the coverage decision,
      salvage disposition and settlement. Segregation of duties bites inside this role: the user who
      took the coverage decision cannot be the user who settles.
    identity: opaque
    exclusive_operations:
      - "POST /aviation/claims/{id}/investigations"
      - "POST /aviation/damage-assessments"
      - "POST /aviation/claims/{id}/coverage-decision"
      - "POST /aviation/claims/{id}/salvage-disposition"
      - "POST /aviation/claims/{id}/settlement"
    shared_operations:
      - "POST /aviation/claims"
      - "POST /aviation/_clock/set_current_utc"
      - "all GET endpoints"
  - name: OperatorUser
    description: >-
      The insured itself. May notify a loss and read its own policy tree, but nothing belonging to
      another operator. X-User-ID is the Operator.id.
    identity: "entity_backed:Operator"
    exclusive_operations: []
    shared_operations:
      - "POST /aviation/claims"
      - "POST /aviation/_clock/set_current_utc"
      - "all GET endpoints, restricted to resources reachable from its own Operator"
  - name: Auditor
    description: >-
      Read-only oversight of the whole book: premium ledger, reserves, warranty findings and war-risk
      placements. Holds no write permission at all.
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /aviation/_clock/set_current_utc"
      - "all GET endpoints"
