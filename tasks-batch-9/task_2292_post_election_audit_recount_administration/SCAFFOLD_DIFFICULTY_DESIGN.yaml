            - "ManualTally.${mt1_id}.status == DRAFT and ManualTally.${mt1_id}.reopen_count == 1"
            - "ManualTally.${mt1_id}.net_error_votes == null and ManualTally.${mt1_id}.relative_taint == null"
            - "ManualTally.${mt1_id}.counted_votes == { ALVAREZ: 520, BRENNAN: 480 } (the recorded counts survive the reversal)"
            - "AuditBatch.${ab3_id}.tally_status == IN_PROGRESS"
            - "Election.${e1_id}.certification_risk_flag == false"
      - name: compensating_deposit_ledger_conservation_on_withdrawal
        grounds:
          - calculations.recount_cost_and_refund
          - calculations.recount_cost_and_refund.variants.WITHDRAWAL_RETENTION
          - state_machines.Recount.DEPOSIT_HELD_to_WITHDRAWN
          - entities.Recount.fields.admin_retained_cents
        distinguishing_aspect: |
          Conserved quantity: the deposit ledger in integer cents. Withdrawal splits the held 170000 into
          admin_retained_cents 42500 and refunded_cents 127500 with forfeited_cents left at 0, so
          deposit_paid_cents == refunded + forfeited + admin_retained holds exactly and no cent is invented or lost -
          a different conserved quantity from the vote-error ledger of the reopen instance.
        test_recipe:
          setup:
            - "Election ST-02 with one canvassed contest C2 (CHEN 1575 / DAVIS 1425 of 3000 ballots) over batches C2-B01 1000, C2-B02 995 and C2-B03 1005."
            - "rep-davis filed a PARTIAL_BATCHES recount over all three batches: required_deposit_cents 50000 + 40 * 3000 = 170000."
            - "The deposit is posted in full, so status is DEPOSIT_HELD, deposit_status HELD, refunded/forfeited/admin_retained all 0 and Contest.open_recount_count 1."
            - "The recount has not started, so no counting cost has been measured: actual_cost_cents is still 0 and team_hours is null."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-05T09:00:00Z" }
              as: ElectionsDirector
            - call: "POST /elections"
              payload: { jurisdiction_code: "ST-02", election_name: "2026 General Election", election_date: "2026-11-03", certification_deadline_at: "2026-11-24T17:00:00Z" }
              as: ElectionsDirector
              captures: { e2_id: "$.data.id" }
            - call: "POST /contests"
              payload: { election_id: "${e2_id}", contest_label: "C2", office_name: "State Treasurer", contest_type: "CANDIDATE", candidate_names: ["CHEN", "DAVIS"], ballots_cast: 3000, cvr_available: false }
              as: ElectionsDirector
              captures: { c2_id: "$.data.id" }
            - call: "POST /ballot-batches/bulk"
              payload: { election_id: "${e2_id}", contest_id: "${c2_id}", batches: [{ batch_label: "C2-B01", storage_location_code: "VAULT-2", ballot_count: 1000, machine_votes: { CHEN: 525, DAVIS: 475 }, current_seal_number: "S2-01" }, { batch_label: "C2-B02", storage_location_code: "VAULT-2", ballot_count: 995, machine_votes: { CHEN: 522, DAVIS: 473 }, current_seal_number: "S2-02" }, { batch_label: "C2-B03", storage_location_code: "VAULT-2", ballot_count: 1005, machine_votes: { CHEN: 528, DAVIS: 477 }, current_seal_number: "S2-03" }] }
              as: CustodyOfficer
              captures: { c2_bulk: "$.data.created_count" }
            - call: "POST /contests/${c2_id}/canvass-results"
              payload: { reported_votes: { CHEN: 1575, DAVIS: 1425 } }
              as: ElectionsDirector
              captures: { c2_v: "$.data.version" }
            - call: "GET /ballot-batches"
              payload: { contest_id: "${c2_id}", limit: 100 }
              as: CustodyOfficer
              captures: { cb1_id: "$.data[0].id", cb2_id: "$.data[1].id", cb3_id: "$.data[2].id" }
            - call: "POST /recounts"
              payload: { contest_id: "${c2_id}", expected_contest_version: "${c2_v}", trigger_type: "CANDIDATE_REQUESTED", scope: "PARTIAL_BATCHES", scope_batch_ids: ["${cb1_id}", "${cb2_id}", "${cb3_id}"], requested_by_candidate_name: "DAVIS" }
              as: CandidateRepresentative
              as_user_id: "rep-davis"
              captures: { rc_id: "$.data.id" }
            - call: "POST /recounts/${rc_id}/deposit"
              payload: { amount_cents: 170000 }
              as: CandidateRepresentative
              as_user_id: "rep-davis"
              captures: { paid: "$.data.deposit_paid_cents", held_status: "$.data.deposit_status" }
          trigger:
            - call: "POST /recounts/${rc_id}/withdraw"
              payload: { reason: "Candidate accepts the canvassed result." }
              as: CandidateRepresentative
              as_user_id: "rep-davis"
          assert:
            - "${paid} == 170000 and ${held_status} == HELD"
            - "Recount.${rc_id}.admin_retained_cents == 42500"
            - "Recount.${rc_id}.refunded_cents == 127500"
            - "Recount.${rc_id}.forfeited_cents == 0"
            - "Recount.${rc_id}.deposit_paid_cents == 170000 and 170000 == 127500 + 0 + 42500"
            - "Recount.${rc_id}.refund_variant == WITHDRAWAL_RETENTION and Recount.${rc_id}.deposit_status == PARTIALLY_REFUNDED"
            - "Recount.${rc_id}.status == WITHDRAWN and Recount.${rc_id}.actual_cost_cents == 0"
            - "Contest.${c2_id}.open_recount_count == 0 and Contest.${c2_id}.margin_votes == 150"
            - "Contest.${c2_id}.reported_votes == { CHEN: 1575, DAVIS: 1425 } (a withdrawn recount never folds votes back)"
      - name: compensating_ballot_accounting_conserved_through_adjudication
        grounds:
          - calculations.board_quorum_adjudication
          - state_machines.BallotInterpretation.PENDING_to_ADJUDICATED
          - state_machines.ManualTally.PENDING_ADJUDICATION_to_SUBMITTED
          - validations[priority=39]
          - validations[priority=23]
        distinguishing_aspect: |
          Conserved quantity: the ballot-accounting identity sum(counted_votes) + ambiguous_ballot_count +
          no_vote_count == AuditBatch.ballot_count. Adjudicating one ambiguous ballot moves a unit from
          ambiguous_ballot_count into counted_votes[ALVAREZ] so the identity still evaluates to 1000, and every
          downstream error figure is re-derived from the new counts rather than patched.
        test_recipe:
          setup:
            - "Election ST-01 contest C1 canvassed (winner ALVAREZ, margin_votes 300) with six 1000-ballot batches machine-tabulated 525/475; audit A1 RISK_LIMITING alpha 0.05 seeded 0459231087 drew B-003, B-004, B-005."
            - "Team T-1 submitted B-003 as ALVAREZ 519 / BRENNAN 480 with 1 ambiguous ballot and 0 blanks: 519 + 480 + 1 + 0 == 1000, net_error_votes 11, relative_taint 1.6500, round_measure 0.0110, round 1 REVIEW_REQUIRED."
            - "One PENDING BallotInterpretation of ballot B-003-0417 (PARTIAL_MARK, proposed determination ALVAREZ) moved the tally to PENDING_ADJUDICATION."
            - "Board members u-board-1 (DEM), u-board-2 (REP) and u-board-3 (DEM) are none of them members of team T-1, so the segregation-of-duties rule is satisfied."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-05T09:00:00Z" }
              as: ElectionsDirector
            - call: "POST /elections"
              payload: { jurisdiction_code: "ST-01", election_name: "2026 General Election", election_date: "2026-11-03", certification_deadline_at: "2026-11-24T17:00:00Z" }
              as: ElectionsDirector
              captures: { e1_id: "$.data.id" }
            - call: "POST /contests"
              payload: { election_id: "${e1_id}", contest_label: "C1", office_name: "State Auditor", contest_type: "CANDIDATE", candidate_names: ["ALVAREZ", "BRENNAN"], ballots_cast: 6000, cvr_available: true }
              as: ElectionsDirector
              captures: { c1_id: "$.data.id" }
            - call: "POST /ballot-batches/bulk"
              payload: { election_id: "${e1_id}", contest_id: "${c1_id}", batches: [{ batch_label: "B-001", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-001" }, { batch_label: "B-002", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-002" }, { batch_label: "B-003", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-003" }, { batch_label: "B-004", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-004" }, { batch_label: "B-005", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-005" }, { batch_label: "B-006", storage_location_code: "VAULT-1", ballot_count: 1000, machine_votes: { ALVAREZ: 525, BRENNAN: 475 }, current_seal_number: "SEAL-006" }] }
              as: CustodyOfficer
              captures: { bulk_count: "$.data.created_count" }
            - call: "POST /contests/${c1_id}/canvass-results"
              payload: { reported_votes: { ALVAREZ: 3150, BRENNAN: 2850 } }
              as: ElectionsDirector
              captures: { c1_v: "$.data.version" }
            - call: "POST /tally-teams"
              payload: { election_id: "${e1_id}", team_label: "T-1", room_code: "ROOM-A" }
              as: ElectionsDirector
              captures: { t1_id: "$.data.id" }
            - call: "POST /tally-teams/${t1_id}/members"
              payload: { members: [{ user_id: "u-dem-1", party: "DEM", seat_role: "LEAD" }, { user_id: "u-rep-1", party: "REP", seat_role: "COUNTER" }] }
              as: ElectionsDirector
            - call: "POST /audits"
              payload: { contest_id: "${c1_id}", audit_type: "RISK_LIMITING", risk_limit_alpha: 0.05 }
              as: AuditManager
              captures: { a1_id: "$.data.id" }
            - call: "POST /audits/${a1_id}/seed"
              payload: { random_seed: "0459231087" }
              as: AuditManager
              captures: { a1_v: "$.data.version" }
            - call: "POST /audits/${a1_id}/rounds"
              payload: { expected_audit_version: "${a1_v}" }
              as: AuditManager
              captures: { r1_id: "$.data.id" }
            - call: "GET /audit-batches"
              payload: { audit_round_id: "${r1_id}", limit: 100 }
              as: CustodyOfficer
              captures: { ab3_id: "$.data[0].id", ab4_id: "$.data[1].id", ab5_id: "$.data[2].id" }
            - call: "GET /ballot-batches"
              payload: { contest_id: "${c1_id}", limit: 100 }
              as: CustodyOfficer
              captures: { bb1_id: "$.data[0].id", bb1_v: "$.data[0].version", bb2_id: "$.data[1].id", bb2_v: "$.data[1].version", bb3_id: "$.data[2].id", bb3_v: "$.data[2].version", bb4_id: "$.data[3].id", bb4_v: "$.data[3].version", bb5_id: "$.data[4].id", bb5_v: "$.data[4].version", bb6_id: "$.data[5].id", bb6_v: "$.data[5].version" }
            - call: "POST /audit-batches/${ab3_id}/retrieve"
              payload: { expected_ballot_batch_version: "${bb3_v}", observed_seal_number: "SEAL-003" }
              as: CustodyOfficer
            - call: "POST /manual-tallies"
              payload: { audit_batch_id: "${ab3_id}", tally_team_id: "${t1_id}", session_start_at: "2026-11-05T09:00:00Z", session_end_at: "2026-11-05T11:00:00Z", counted_votes: { ALVAREZ: 519, BRENNAN: 480 }, ambiguous_ballot_count: 1, no_vote_count: 0 }
              as: TallyTeamLead
              as_user_id: "${t1_id}"
              captures: { mt1_id: "$.data.id" }
            - call: "POST /manual-tallies/${mt1_id}/submit"
              payload: { }
              as: TallyTeamLead
              as_user_id: "${t1_id}"
              captures: { pre_net: "$.data.net_error_votes", pre_taint: "$.data.relative_taint", pre_amb: "$.data.ambiguous_ballot_count" }
            - call: "POST /ballot-interpretations"
              payload: { manual_tally_id: "${mt1_id}", ballot_ref: "B-003-0417", ambiguity_type: "PARTIAL_MARK", proposed_determination: "ALVAREZ" }
              as: TallyTeamLead
              as_user_id: "${t1_id}"
              captures: { bi_id: "$.data.id", bi_status: "$.data.status" }
            - call: "GET /discrepancies"
              payload: { manual_tally_id: "${mt1_id}", limit: 10 }
              as: AuditManager
              captures: { d1_id: "$.data[0].id", d1_mag_pre: "$.data[0].magnitude_votes" }
          trigger:
            - call: "POST /ballot-interpretations/${bi_id}/votes"
              payload: { party: "DEM", vote: "ACCEPT" }
              as: CanvassingBoardMember
              as_user_id: "u-board-1"
            - call: "POST /ballot-interpretations/${bi_id}/votes"
              payload: { party: "REP", vote: "ACCEPT" }
              as: CanvassingBoardMember
              as_user_id: "u-board-2"
            - call: "POST /ballot-interpretations/${bi_id}/votes"
              payload: { party: "DEM", vote: "REJECT" }
              as: CanvassingBoardMember
              as_user_id: "u-board-3"
          assert:
            - "${pre_net} == 11 and ${pre_taint} == 1.6500 and ${pre_amb} == 1 and ${bi_status} == PENDING and ${d1_mag_pre} == 11"
            - "the identity held before adjudication: 519 + 480 + 1 + 0 == 1000 == AuditBatch.${ab3_id}.ballot_count"
            - "BallotInterpretation.${bi_id}.votes_cast == 3 and accept_count == 2 and reject_count == 1 and quorum_met == true"
            - "BallotInterpretation.${bi_id}.status == ADJUDICATED and final_determination == ALVAREZ"
            - "ManualTally.${mt1_id}.counted_votes == { ALVAREZ: 520, BRENNAN: 480 }"
            - "ManualTally.${mt1_id}.ambiguous_ballot_count == 0 and ManualTally.${mt1_id}.no_vote_count == 0"
            - "the identity still holds after adjudication: 520 + 480 + 0 + 0 == 1000 == AuditBatch.${ab3_id}.ballot_count"
            - "ManualTally.${mt1_id}.status == SUBMITTED and ManualTally.${mt1_id}.manual_margin_votes == 40"
            - "ManualTally.${mt1_id}.net_error_votes == 10 and ManualTally.${mt1_id}.relative_taint == 1.5000"
            - "Discrepancy.${d1_id}.magnitude_votes == 10 and Discrepancy.${d1_id}.status == OPEN"
            - "AuditRound.${r1_id}.cumulative_net_error_votes == 10 and AuditRound.${r1_id}.round_measure == 0.0100"
            - "Audit.${a1_id}.status == DISCREPANCY_REVIEW and Audit.${a1_id}.discrepancy_measure == 0.0100"
