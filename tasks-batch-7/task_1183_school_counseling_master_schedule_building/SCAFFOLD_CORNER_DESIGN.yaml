              as: Student
              as_user_id: "${s_lab}"
            - call: "POST /scheduling/terms/${t_lab_term}/close-collection"
              payload: {}
              as: Administrator
            - call: "POST /scheduling/terms/${t_lab_term}/generate-sections"
              payload: {}
              as: Administrator
