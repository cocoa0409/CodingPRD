          assert:
            - "GarmentUnit.${unit_id}.available_from_iso == 2026-09-05T12:00:00.000Z"  # returned 09-03T12:00 + 2 buffer days
            - "confirm response error_id == ERR_NO_UNIT_AVAILABLE"   # pickup_start 09-04T09:00 is inside the buffer window
            - "Reservation.${resv2_id}.status == PENDING"

      - name: customer_rental_window_overlap_half_open_blocks_confirm
        grounds:
          - validations[priority=9]
          - state_machines.Reservation.PENDING_to_CONFIRMED
          - errors[ERR_CUSTOMER_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Customer overlap with HALF-OPEN [start,end) NO-buffer geometry on a DIFFERENT resource entity
          (Customer, not GarmentUnit): the same customer cannot hold two non-terminal reservations whose rental
          windows overlap. Distinct interval semantics from the buffer-inflated closed GarmentUnit overlap.
        test_recipe:
          setup:
            - "One customer with a first CONFIRMED reservation over [09-01,09-05); a second PENDING reservation over [09-03,09-08) overlapping it, on a catalog with two units so unit availability is NOT the blocker."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /catalogs"
              payload: { style_name: "Tux O", category: "FORMALWEAR", daily_rate_cents: 5000, deposit_cents: 20000, replacement_value_cents: 80000, waiver_daily_rate_cents: 1200, cleaning_buffer_days: 2, late_fee_daily_rate_cents: 2000 }
              as: StoreManager
              captures: { cat_id: $.data.id }
            - call: "POST /garment-units"
              payload: { catalog_id: "${cat_id}", size_code: "M" }
              as: StoreManager
              captures: { unit1_id: $.data.id }
            - call: "POST /garment-units"
              payload: { catalog_id: "${cat_id}", size_code: "M" }
              as: StoreManager
              captures: { unit2_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Rex U", email: "rex@x.com" }
              as: StoreClerk
              captures: { cust_id: $.data.id }
            - call: "POST /reservations"
              payload: { customer_id: "${cust_id}", catalog_id: "${cat_id}", requested_size_code: "M", event_date_iso: "2026-09-06T00:00:00Z", pickup_window_start_iso: "2026-09-01T09:00:00Z", return_window_end_iso: "2026-09-05T09:00:00Z", damage_waiver_opted: false }
              as: StoreClerk
              captures: { resv1_id: $.data.id }
            - call: "POST /reservations/${resv1_id}/confirm"
              payload: {}
              as: StoreClerk
            - call: "POST /reservations"
              payload: { customer_id: "${cust_id}", catalog_id: "${cat_id}", requested_size_code: "M", event_date_iso: "2026-09-09T00:00:00Z", pickup_window_start_iso: "2026-09-03T09:00:00Z", return_window_end_iso: "2026-09-08T09:00:00Z", damage_waiver_opted: false }
              as: StoreClerk
              captures: { resv2_id: $.data.id }
          trigger:
            - call: "POST /reservations/${resv2_id}/confirm"
              payload: {}
              as: StoreClerk
              captures: { err: $.data.error_id }
          assert:
            - "Reservation.${resv1_id}.status == CONFIRMED"
            - "confirm response error_id == ERR_CUSTOMER_WINDOW_CONFLICT"  # half-open window overlap on the Customer
            - "Reservation.${resv2_id}.status == PENDING"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: deposit_conservation_hold_equals_release_plus_capture
        grounds:
          - calculations.deposit_conservation
          - entities.LedgerEntry.fields.amount_cents
          - state_machines.Reservation.PICKED_UP_to_RETURNED
        distinguishing_aspect: |
          Conserved quantity = deposit cents. Over a single reservation's pickup->settle lifecycle the
          DEPOSIT_HOLD amount must equal DEPOSIT_RELEASE magnitude + DEPOSIT_CAPTURE magnitude. With deposit
          20000 and a DAMAGED net consuming 20000 of deposit, hold 20000 == release 0 + capture 20000.
        test_recipe:
          setup:
            - "A reservation picked up (DEPOSIT_HOLD 20000) and returned DAMAGED (no waiver), consuming the full deposit; ledger inspected."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /catalogs"
              payload: { style_name: "Tux P", category: "FORMALWEAR", daily_rate_cents: 5000, deposit_cents: 20000, replacement_value_cents: 80000, waiver_daily_rate_cents: 1200, cleaning_buffer_days: 2, late_fee_daily_rate_cents: 2000 }
              as: StoreManager
              captures: { cat_id: $.data.id }
            - call: "POST /garment-units"
              payload: { catalog_id: "${cat_id}", size_code: "M" }
              as: StoreManager
              captures: { unit_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Sky V", email: "sky@x.com" }
              as: StoreClerk
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/measurement-profiles"
              payload: { chest_cm: 100, waist_cm: 84, inseam_cm: 80 }
              as: StoreClerk
              captures: { mp_id: $.data.id }
            - call: "POST /reservations"
              payload: { customer_id: "${cust_id}", catalog_id: "${cat_id}", requested_size_code: "M", event_date_iso: "2026-09-04T00:00:00Z", pickup_window_start_iso: "2026-09-01T09:00:00Z", return_window_end_iso: "2026-09-03T17:00:00Z", damage_waiver_opted: false }
              as: StoreClerk
              captures: { resv_id: $.data.id }
            - call: "POST /reservations/${resv_id}/confirm"
              payload: {}
              as: StoreClerk
            - call: "POST /fit-checks"
              payload: { reservation_id: "${resv_id}", measurement_profile_id: "${mp_id}" }
              as: StoreClerk
            - call: "POST /reservations/${resv_id}/pickup"
              payload: {}
              as: StoreClerk
          trigger:
            - call: "POST /reservations/${resv_id}/return"
              payload: { returned_at_iso: "2026-09-03T12:00:00Z", disposition: "DAMAGED" }
              as: StoreClerk
            - call: "GET /ledger-entries"
              payload: { reservation_id: "${resv_id}" }
              as: StoreClerk
              captures: { first_type: "$.data[0].entry_type" }
          assert:
            - "Sum of DEPOSIT_HOLD amounts for reservation ${resv_id} == 20000"
            - "Sum of DEPOSIT_RELEASE magnitudes + DEPOSIT_CAPTURE magnitudes for reservation ${resv_id} == 20000"
            - "DEPOSIT_HOLD (20000) == DEPOSIT_RELEASE (0) + DEPOSIT_CAPTURE (20000) — deposit conserved"

      - name: unit_pool_conservation_confirm_then_cancel
        grounds:
          - state_machines.Reservation.PENDING_to_CONFIRMED
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
          - entities.Catalog.fields.active_unit_count
        distinguishing_aspect: |
          Conserved quantity = count of AVAILABLE units in the catalog (a DIFFERENT quantity than deposit cents).
          Confirm (AVAILABLE->RESERVED) paired with its compensating cancel (RESERVED->AVAILABLE) leaves the
          number of AVAILABLE size-M units unchanged at 1 before and after the round trip.
        test_recipe:
          setup:
            - "A catalog with exactly one AVAILABLE size-M unit; a reservation is confirmed then cancelled."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /catalogs"
              payload: { style_name: "Tux Q", category: "FORMALWEAR", daily_rate_cents: 5000, deposit_cents: 20000, replacement_value_cents: 80000, waiver_daily_rate_cents: 1200, cleaning_buffer_days: 2, late_fee_daily_rate_cents: 2000 }
              as: StoreManager
              captures: { cat_id: $.data.id }
            - call: "POST /garment-units"
              payload: { catalog_id: "${cat_id}", size_code: "M" }
              as: StoreManager
              captures: { unit_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Tia W", email: "tia@x.com" }
              as: StoreClerk
              captures: { cust_id: $.data.id }
            - call: "POST /reservations"
              payload: { customer_id: "${cust_id}", catalog_id: "${cat_id}", requested_size_code: "M", event_date_iso: "2026-09-06T00:00:00Z", pickup_window_start_iso: "2026-09-01T09:00:00Z", return_window_end_iso: "2026-09-05T09:00:00Z", damage_waiver_opted: false }
              as: StoreClerk
              captures: { resv_id: $.data.id }
            - call: "GET /garment-units"
              payload: { catalog_id: "${cat_id}", status: "AVAILABLE", size_code: "M" }
              as: StoreClerk
              captures: { before_count: $.total_count }
            - call: "POST /reservations/${resv_id}/confirm"
              payload: {}
              as: StoreClerk
          trigger:
            - call: "POST /reservations/${resv_id}/cancel"
              payload: {}
              as: StoreClerk
            - call: "GET /garment-units"
              payload: { catalog_id: "${cat_id}", status: "AVAILABLE", size_code: "M" }
              as: StoreClerk
              captures: { after_count: $.total_count }
          assert:
            - "AVAILABLE size-M unit count before confirm == 1"
            - "AVAILABLE size-M unit count after the confirm+cancel round trip == 1"  # pool conserved
            - "GarmentUnit.${unit_id}.status == AVAILABLE"
