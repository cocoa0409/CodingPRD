              as: Creator
              as_user_id: "${ch_al}"
            - call: "POST /api/claims/${cl_al}/appeals"
              payload: { grounds_code: "REVIEW_ERROR" }
              as: RightsHolder
              as_user_id: "${rf_al}"
              captures: { ap_al1: $.data.id }
            - call: "POST /api/claims/${cl_al}/appeals/${ap_al1}/decide"
              payload: { decision: "DENY" }
              as: RightsHolder
              as_user_id: "${rf_al}"
            - call: "POST /api/claims/${cl_al}/appeals"
