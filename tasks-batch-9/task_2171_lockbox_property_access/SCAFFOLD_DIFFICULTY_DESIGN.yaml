              as: Member
              as_user_id: "${m2_id}"
              captures: { a2_id: $.data.id, a2_v: $.data.version }
            - call: "POST /showing-appointments"
              payload: { listing_id: "${lst1_id}", showing_member_id: "${m2_id}", window_start: "2026-08-07T11:01:00Z", window_end: "2026-08-07T12:00:00Z" }
              as: Member
              as_user_id: "${m2_id}"
              captures: { a3_id: $.data.id, a3_v: $.data.version }
          trigger:
            - call: "POST /showing-appointments/${a2_id}/state"
              payload: { action: "CONFIRM", expected_appointment_version: "${a2_v}" }
              as: Member
              as_user_id: "${m2_id}"
              captures: { err_id: $.data.error_id }
            - call: "POST /showing-appointments/${a3_id}/state"
              payload: { action: "CONFIRM", expected_appointment_version: "${a3_v}" }
              as: Member
              as_user_id: "${m2_id}"
          assert:
            - "Confirming a2 responds HTTP 409 with data.error_id == \"ERR_SHOWING_CAPACITY_EXCEEDED\""
            - "GET /showing-appointments/${a2_id} returns status == \"REQUESTED\""
            - "Confirming a3 responds HTTP 200 and GET /showing-appointments/${a3_id} returns status == \"CONFIRMED\""
            - "GET /showing-appointments?listing_id=${lst1_id}&status=CONFIRMED returns exactly 2 rows"

  - rule_id: compensating_invariant
    instances:
      - name: place_then_remove_conserves_unplaced_inventory_count
        grounds:
          - entities.Association.fields.unplaced_inventory_count
          - state_machines.Lockbox.ASSIGNED_to_PLACED
          - state_machines.Lockbox.PLACED_to_ASSIGNED
          - endpoints["POST /lockbox-placements"]
        distinguishing_aspect: |
          Conserved quantity #1 is an inventory COUNT pinned as
          Association.unplaced_inventory_count == count(Lockbox where association_id = A and status
          IN {IN_STOCK, ASSIGNED}); placing a box decrements it to 2 and removing the placement
          restores it to exactly 3 with boxes_in_field_count untouched at 1.
        test_recipe:
          setup:
            - "Association with three lockboxes: LB-0001 ASSIGNED to Ana, LB-0002 and LB-0003 IN_STOCK"
            - "unplaced_inventory_count is 3 and boxes_in_field_count is 1 before the forward action"
          setup_api_calls:
            - call: "POST /associations"
              payload: { name: "Cascade Regional Association", jurisdiction_code: "WA-KING" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { assoc_id: $.data.id }
            - call: "POST /members"
              payload: { association_id: "${assoc_id}", full_name: "Ana Reyes", email: "ana@example.com", dues_paid_through: "2027-01-31" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { m1_id: $.data.id }
            - call: "POST /lockboxes"
              payload: { association_id: "${assoc_id}", serial_number: "LB-0001", model: "LB_PRO", replacement_cost_cents: 12000, in_service_since: "2025-08-01" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { box1_id: $.data.id, box1_v: $.data.version }
            - call: "POST /lockboxes"
              payload: { association_id: "${assoc_id}", serial_number: "LB-0002", model: "LB_STD", replacement_cost_cents: 9000, in_service_since: "2025-08-01" }
              as: AssociationAdmin
              as_user_id: "admin-1"
            - call: "POST /lockboxes"
              payload: { association_id: "${assoc_id}", serial_number: "LB-0003", model: "LB_STD", replacement_cost_cents: 9000, in_service_since: "2025-08-01" }
              as: AssociationAdmin
              as_user_id: "admin-1"
            - call: "POST /lockboxes/${box1_id}/state"
              payload: { action: "ASSIGN", member_id: "${m1_id}", expected_lockbox_version: "${box1_v}" }
              as: AssociationAdmin
              as_user_id: "admin-1"
            - call: "POST /listings"
              payload: { association_id: "${assoc_id}", listing_agent_id: "${m1_id}", address_line: "12 Pine St", mls_number: "MLS-1001" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { lst1_id: $.data.id }
            - call: "GET /associations/${assoc_id}"
              payload: {}
              as: AssociationAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /lockbox-placements"
              payload: { lockbox_id: "${box1_id}", listing_id: "${lst1_id}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { p1_id: $.data.id, p1_v: $.data.version }
            - call: "POST /lockbox-placements/${p1_id}/state"
              payload: { action: "REMOVE", expected_placement_version: "${p1_v}" }
              as: Member
              as_user_id: "${m1_id}"
          assert:
            - "Before the trigger, GET /associations/${assoc_id} returned unplaced_inventory_count == 3 and boxes_in_field_count == 1"
            - "Between the two trigger calls, GET /associations/${assoc_id} returns unplaced_inventory_count == 2 and active_placement_count == 1"
            - "After the compensating REMOVE, GET /associations/${assoc_id} returns unplaced_inventory_count == 3"
            - "After the compensating REMOVE, GET /associations/${assoc_id} returns boxes_in_field_count == 1 and active_placement_count == 0"
            - "GET /lockboxes?association_id=${assoc_id}&status=IN_STOCK returns exactly 2 rows and GET /lockboxes?association_id=${assoc_id}&status=ASSIGNED returns exactly 1 row"

      - name: loss_then_recover_conserves_member_outstanding_balance
        grounds:
          - entities.Member.fields.outstanding_balance_cents
          - state_machines.Lockbox.ASSIGNED_to_MISSING
          - state_machines.Lockbox.MISSING_to_QUARANTINE
          - state_machines.BillingCharge.PENDING_to_VOID
          - calculations.member_statement_balance
        distinguishing_aspect: |
          Conserved quantity #2 is MONEY, not a count: Member.outstanding_balance_cents ==
          sum over BillingCharge rows with status IN {PENDING, INVOICED} of
          round_half_up(amount_cents * 1.025); the REPORT_LOST/RECOVER pair drives it 0 -> 12300 -> 0
          with no residual drift.
        test_recipe:
          setup:
            - "Ana (m1) holds LB-0001 (replacement_cost_cents 12000) in status ASSIGNED"
            - "Ana's outstanding_balance_cents is 0 and the association has no missing boxes"
          setup_api_calls:
            - call: "POST /associations"
              payload: { name: "Cascade Regional Association", jurisdiction_code: "WA-KING" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { assoc_id: $.data.id }
            - call: "POST /members"
              payload: { association_id: "${assoc_id}", full_name: "Ana Reyes", email: "ana@example.com", dues_paid_through: "2027-01-31" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { m1_id: $.data.id }
            - call: "POST /lockboxes"
              payload: { association_id: "${assoc_id}", serial_number: "LB-0001", model: "LB_PRO", replacement_cost_cents: 12000, in_service_since: "2025-08-01" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { box1_id: $.data.id, box1_v: $.data.version }
            - call: "POST /lockboxes/${box1_id}/state"
              payload: { action: "ASSIGN", member_id: "${m1_id}", expected_lockbox_version: "${box1_v}" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { box1_v2: $.data.version }
            - call: "GET /members/${m1_id}"
              payload: {}
              as: AssociationAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /lockboxes/${box1_id}/state"
              payload: { action: "REPORT_LOST", expected_lockbox_version: "${box1_v2}" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { box1_v3: $.data.version }
            - call: "POST /lockboxes/${box1_id}/state"
              payload: { action: "RECOVER", expected_lockbox_version: "${box1_v3}" }
              as: AssociationAdmin
              as_user_id: "admin-1"
          assert:
            - "Before the trigger, GET /members/${m1_id} returned outstanding_balance_cents == 0"
            - "Between the two trigger calls, GET /members/${m1_id} returns outstanding_balance_cents == 12300"
            - "After RECOVER, GET /members/${m1_id} returns outstanding_balance_cents == 0"
            - "GET /billing-charges?member_id=${m1_id}&charge_type=REPLACEMENT returns exactly 1 row with status == \"VOID\" and amount_cents == 12000"
            - "GET /lockboxes/${box1_id} returns status == \"QUARANTINE\""
            - "GET /associations/${assoc_id} returns missing_box_count == 0 and posture == \"OPEN\""

      - name: suspend_then_reinstate_conserves_active_credential_count
        grounds:
          - entities.Member.fields.active_credential_count
          - state_machines.Member.ACTIVE_to_SUSPENDED
          - state_machines.Member.SUSPENDED_to_ACTIVE
          - entities.AccessCredential.fields.suspended_by_cascade
        distinguishing_aspect: |
          Conserved quantity #3 is an entitlement COUNT over a different entity family than
          inventory or money: Member.active_credential_count == count(AccessCredential where
          member_id = M and status == ACTIVE); SUSPEND drives 2 -> 0 and REINSTATE restores exactly
          2 because only credentials with suspended_by_cascade == true are revived.
        test_recipe:
          setup:
            - "Association keeps the default credential_cap_per_member of 2"
            - "Ana (m1) is ACTIVE and holds two ACTIVE credentials (one KEY_APP, one KEY_FOB), both expiring 2027-06-30T00:00:00Z"
          setup_api_calls:
            - call: "POST /associations"
              payload: { name: "Cascade Regional Association", jurisdiction_code: "WA-KING" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { assoc_id: $.data.id }
            - call: "POST /members"
              payload: { association_id: "${assoc_id}", full_name: "Ana Reyes", email: "ana@example.com", dues_paid_through: "2027-01-31" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { m1_id: $.data.id, m1_v: $.data.version }
            - call: "POST /access-credentials"
              payload: { member_id: "${m1_id}", credential_type: "KEY_APP", expires_at: "2027-06-30T00:00:00Z", expected_member_version: "${m1_v}" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { c1_id: $.data.id, c1_v: $.data.version }
            - call: "POST /access-credentials/${c1_id}/state"
              payload: { action: "ACTIVATE", expected_credential_version: "${c1_v}" }
              as: AssociationAdmin
              as_user_id: "admin-1"
            - call: "GET /members/${m1_id}"
              payload: {}
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { m1_v2: $.data.version }
            - call: "POST /access-credentials"
              payload: { member_id: "${m1_id}", credential_type: "KEY_FOB", expires_at: "2027-06-30T00:00:00Z", expected_member_version: "${m1_v2}" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { c2_id: $.data.id, c2_v: $.data.version }
            - call: "POST /access-credentials/${c2_id}/state"
              payload: { action: "ACTIVATE", expected_credential_version: "${c2_v}" }
              as: AssociationAdmin
              as_user_id: "admin-1"
            - call: "GET /members/${m1_id}"
              payload: {}
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { m1_v3: $.data.version }
          trigger:
            - call: "POST /members/${m1_id}/membership-events"
              payload: { event_type: "SUSPEND", reason: "Board review", expected_member_version: "${m1_v3}" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { m1_v4: $.data.version }
            - call: "POST /members/${m1_id}/membership-events"
              payload: { event_type: "REINSTATE", expected_member_version: "${m1_v4}" }
              as: AssociationAdmin
              as_user_id: "admin-1"
          assert:
            - "Before the trigger, GET /members/${m1_id} returned active_credential_count == 2"
            - "Between the two trigger calls, GET /members/${m1_id} returns active_credential_count == 0"
            - "Between the two trigger calls, GET /access-credentials/${c1_id} returns status == \"SUSPENDED\" and suspended_by_cascade == true"
            - "After REINSTATE, GET /members/${m1_id} returns active_credential_count == 2 and membership_status == \"ACTIVE\""
            - "After REINSTATE, GET /access-credentials/${c1_id} returns status == \"ACTIVE\" and suspended_by_cascade == false"
            - "After REINSTATE, GET /access-credentials/${c2_id} returns status == \"ACTIVE\""
            - "GET /access-credentials?member_id=${m1_id}&status=ACTIVE returns exactly 2 rows"
