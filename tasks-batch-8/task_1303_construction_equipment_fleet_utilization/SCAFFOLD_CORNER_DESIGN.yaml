            - "Equipment.${e404_id}.availability_status == IDLE (unchanged)"

      - name: open_work_blocks_dispose_work_order_and_damage_variants
        claim_type: violation_to_error
        grounds: ["validations[priority=16]", "errors[ERR_OPEN_WORK]"]
        distinguishing_aspect: "Dispose's open-work gate fires on EITHER an OPEN WorkOrder (unit E405a) OR an unresolved FILED DamageReport lingering after the assignment closed (unit E405b) — both 409 ERR_OPEN_WORK."
        test_recipe:
          setup: ["Class C405, project P405; E405a IDLE with an OPEN REPAIR work order; E405b was ON_RENT at P405, has a FILED damage report, assignment then CLOSED (E405b IDLE with the report still FILED)"]
