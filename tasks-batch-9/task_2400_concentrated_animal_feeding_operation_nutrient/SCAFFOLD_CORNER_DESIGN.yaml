# =============================================================================
# §1.9 Scaffold Corner Design — breadth coverage index
# Task 2400 — Concentrated Animal Feeding Operation Nutrient Management
#
# Walk of references/claim-extraction-guide.md against SCAFFOLD.yaml §1.1–§1.7.
# Sections and claim_type values are taken only from that guide.
# Every name here is unique across this file and SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# Logical clock starts at 2026-08-01T00:00:00Z in every recipe unless a call moves it.
#
# Canonical fixture literals reused below (all pre-computed from §1.3):
#   Operation "Willow Creek Dairy": DAIRY_COW, 300 head, LIQUID, open_lot 40000 sqft,
#     CONTINUOUS, conservation plan on file
#     -> animal_units 420.00, size_class MEDIUM, permit_required true,
#        design_annual_manure_gallons 3374298.00, daily_production_gallons 9244.65
#   ManureStorage "Lagoon 1": EARTHEN_LAGOON, 60000 sqft, 144 in deep, freeboard 24 in
#     -> design_capacity 5385960.00, freeboard_reserve 897660.00,
#        operating_capacity 4488300.00, design_storage_days 485
#   Field "North 40": 42.5 ac, 150 ft to water, no tile inlet, slope 4.0, frontage 900 ft
#     -> required_setback_ft 200, excluded_acres 4.13, net_applicable_acres 38.37
#   SoilTest 2026-03-15: 42 ppm P -> p_index 43.68, MEDIUM, is_valid true
#   FieldNutrientBudget CORN_GRAIN yield 190 after SOYBEAN, INJECTION
#     -> crop_n_need 209.00, legume_credit 40.00, adjusted_n_need 169.00,
#        crop_p_removal 70.30, p_allowance 140.60,
#        allowable_n_rate 10800, allowable_p_rate 14000, binding_basis NITROGEN,
#        allowable_rate 10800, allowable_total_gallons 414396
# =============================================================================
scaffold_corner_design:

  # =====================================================================
  # Entities (§1.1)
  # =====================================================================
  - section: entities
    instances:
      - name: create_operation_computes_animal_units_and_returns_envelope
        claim_type: creation
        grounds:
          - endpoints.POST /cafo/operations
          - entities.Operation
          - calculations.operation_animal_units_and_class
          - calculations.operation_manure_production
          - response_envelope.success
        distinguishing_aspect: |
          A single create must return 201 with the full success envelope AND every computed
          Operation field already populated from §1.3, including design_storage_days == 0
          because no ManureStorage exists yet for the summation.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls: []
          trigger:
            - call: "POST /cafo/operations"
              payload: { name: "Willow Creek Dairy", county: "Linn", animal_type: "DAIRY_COW", head_count: 300, manure_handling: "LIQUID", open_lot_area_sqft: 40000, discharge_potential: "CONTINUOUS", has_conservation_plan: true }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { op_id: $.data.id }
          assert:
            - "status is 201 and the body carries meta.api_request_id, meta.api_request_timestamp and response_type == object"
            - "Operation.${op_id}.animal_units == 420.00 and size_class == MEDIUM"
            - "Operation.${op_id}.permit_required == true, because MEDIUM with discharge_potential CONTINUOUS requires coverage"
            - "Operation.${op_id}.design_annual_manure_gallons == 3374298.00 and daily_production_gallons == 9244.65"
            - "Operation.${op_id}.design_storage_days == 0, since the operation has no ManureStorage row yet"
            - "Operation.${op_id}.recorded_annual_manure_gallons == 0.00, compliance_posture == OPEN, open_finding_count == 0, open_discharge_incident_count == 0"
            - "Operation.${op_id}.version == 1 and id is a bare UUID with no type prefix"
      - name: get_operation_returns_the_stored_and_computed_row
        claim_type: retrieval
        grounds:
          - endpoints.GET /cafo/operations/{id}
          - entities.Operation
        distinguishing_aspect: |
          A read-only GET must return byte-identical stored input plus computed fields and must
          NOT bump version, so version is still 1 after the read.
        test_recipe:
          setup:
            - "One Willow Creek Dairy operation created by ComplianceAdmin at version 1"
          setup_api_calls:
            - call: "POST /cafo/operations"
              payload: { name: "Willow Creek Dairy", county: "Linn", animal_type: "DAIRY_COW", head_count: 300, manure_handling: "LIQUID", open_lot_area_sqft: 40000, discharge_potential: "CONTINUOUS", has_conservation_plan: true }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { op_id: $.data.id }
          trigger:
            - call: "GET /cafo/operations/${op_id}"
              payload: {}
              as: StateReviewer
              as_user_id: "reviewer-1"
              captures: { seen_units: $.data.animal_units }
          assert:
            - "status is 200 and the captured seen_units == 420.00"
            - "data.name == Willow Creek Dairy, county == Linn, animal_type == DAIRY_COW, head_count == 300, manure_handling == LIQUID"
            - "data.open_lot_area_sqft == 40000 and has_conservation_plan == true"
            - "data.design_annual_manure_gallons == 3374298.00 and daily_production_gallons == 9244.65"
            - "data.version == 1, so the GET performed no write"
      - name: list_operations_defaults_to_limit_ten_and_reports_total_count
        claim_type: listing
        grounds:
          - endpoints.GET /cafo/operations
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          With eleven rows present, the default page must be exactly ten items with
          has_more true and total_count 11, and offset 10 must return the single remainder
          with has_more false — proving limit defaults to 10 and offset to 0.
        test_recipe:
          setup:
            - "Eleven SWINE_FINISHING operations of 100 head each with discharge_potential NONE, created in name order Op 01 .. Op 11"
            - "Each has animal_units 40.00, size_class SMALL and permit_required false"
          setup_api_calls:
            - call: "POST /cafo/operations"
              payload: { name: "Op 01", county: "Linn", animal_type: "SWINE_FINISHING", head_count: 100, manure_handling: "LIQUID", discharge_potential: "NONE" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { op1_id: $.data.id }
            - call: "POST /cafo/operations"
              payload: { name: "Op 02", county: "Linn", animal_type: "SWINE_FINISHING", head_count: 100, manure_handling: "LIQUID", discharge_potential: "NONE" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
            - call: "POST /cafo/operations"
              payload: { name: "Op 03", county: "Linn", animal_type: "SWINE_FINISHING", head_count: 100, manure_handling: "LIQUID", discharge_potential: "NONE" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
            - call: "POST /cafo/operations"
              payload: { name: "Op 04", county: "Linn", animal_type: "SWINE_FINISHING", head_count: 100, manure_handling: "LIQUID", discharge_potential: "NONE" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
            - call: "POST /cafo/operations"
              payload: { name: "Op 05", county: "Linn", animal_type: "SWINE_FINISHING", head_count: 100, manure_handling: "LIQUID", discharge_potential: "NONE" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
            - call: "POST /cafo/operations"
              payload: { name: "Op 06", county: "Linn", animal_type: "SWINE_FINISHING", head_count: 100, manure_handling: "LIQUID", discharge_potential: "NONE" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
            - call: "POST /cafo/operations"
              payload: { name: "Op 07", county: "Linn", animal_type: "SWINE_FINISHING", head_count: 100, manure_handling: "LIQUID", discharge_potential: "NONE" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
            - call: "POST /cafo/operations"
              payload: { name: "Op 08", county: "Linn", animal_type: "SWINE_FINISHING", head_count: 100, manure_handling: "LIQUID", discharge_potential: "NONE" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
            - call: "POST /cafo/operations"
              payload: { name: "Op 09", county: "Linn", animal_type: "SWINE_FINISHING", head_count: 100, manure_handling: "LIQUID", discharge_potential: "NONE" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
            - call: "POST /cafo/operations"
              payload: { name: "Op 10", county: "Linn", animal_type: "SWINE_FINISHING", head_count: 100, manure_handling: "LIQUID", discharge_potential: "NONE" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
            - call: "POST /cafo/operations"
              payload: { name: "Op 11", county: "Benton", animal_type: "SWINE_FINISHING", head_count: 100, manure_handling: "LIQUID", discharge_potential: "NONE" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { op11_id: $.data.id }
          trigger:
            - call: "GET /cafo/operations"
              payload: {}
              as: StateReviewer
              as_user_id: "reviewer-1"
              captures: { first_units: "$.data[0].animal_units" }
            - call: "GET /cafo/operations"
              payload: { offset: 10 }
              as: StateReviewer
              as_user_id: "reviewer-1"
            - call: "GET /cafo/operations"
              payload: { county: "Benton", limit: 5 }
              as: StateReviewer
              as_user_id: "reviewer-1"
          assert:
            - "first trigger call returns response_type == array with exactly 10 items, limit == 10, offset == 0, total_count == 11 and has_more == true"
            - "the captured first_units == 40.00 and every returned row has size_class == SMALL and permit_required == false"
            - "second trigger call returns exactly 1 item, limit == 10, offset == 10, total_count == 11 and has_more == false"
            - "third trigger call returns exactly 1 item whose id == ${op11_id}, with limit == 5, total_count == 1 and has_more == false"
      - name: get_by_unknown_id_returns_entity_specific_not_found
        claim_type: not_found
        grounds:
          - validations[priority=5]
          - errors.ERR_OPERATION_NOT_FOUND
          - errors.ERR_HAULER_NOT_FOUND
          - errors.ERR_PERMIT_NOT_FOUND
          - errors.ERR_PLAN_NOT_FOUND
          - errors.ERR_FIELD_NOT_FOUND
          - errors.ERR_SOIL_TEST_NOT_FOUND
          - errors.ERR_BUDGET_NOT_FOUND
          - errors.ERR_STORAGE_NOT_FOUND
          - errors.ERR_STORAGE_INSPECTION_NOT_FOUND
          - errors.ERR_EVENT_NOT_FOUND
          - errors.ERR_TRANSFER_NOT_FOUND
          - errors.ERR_INCIDENT_NOT_FOUND
          - errors.ERR_INSPECTION_NOT_FOUND
          - errors.ERR_REPORT_NOT_FOUND
        distinguishing_aspect: |
          Validation 1.4/5 promises the NOT_FOUND code of the FAILING SEGMENT, not one generic
          404: the same well-formed but absent UUID must yield fourteen different error_ids,
          one per entity, on an empty database.
        test_recipe:
          setup:
            - "Empty database; no row of any entity exists"
          setup_api_calls: []
          trigger:
            - call: "GET /cafo/operations/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { e_op: $.data.error_id }
            - call: "GET /cafo/haulers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { e_hauler: $.data.error_id }
            - call: "GET /cafo/permits/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { e_permit: $.data.error_id }
            - call: "GET /cafo/nutrient-plans/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { e_plan: $.data.error_id }
            - call: "GET /cafo/fields/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { e_field: $.data.error_id }
            - call: "GET /cafo/soil-tests/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { e_soil: $.data.error_id }
            - call: "GET /cafo/field-budgets/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { e_budget: $.data.error_id }
            - call: "GET /cafo/manure-storages/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { e_storage: $.data.error_id }
            - call: "GET /cafo/storage-inspections/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { e_stinsp: $.data.error_id }
            - call: "GET /cafo/application-events/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { e_event: $.data.error_id }
            - call: "GET /cafo/manure-transfers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { e_transfer: $.data.error_id }
            - call: "GET /cafo/incident-reports/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { e_incident: $.data.error_id }
            - call: "GET /cafo/inspections/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { e_inspection: $.data.error_id }
            - call: "GET /cafo/annual-reports/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { e_report: $.data.error_id }
          assert:
            - "every one of the fourteen trigger calls returns status 404 with response_type == error"
            - "e_op == ERR_OPERATION_NOT_FOUND, e_hauler == ERR_HAULER_NOT_FOUND, e_permit == ERR_PERMIT_NOT_FOUND, e_plan == ERR_PLAN_NOT_FOUND"
            - "e_field == ERR_FIELD_NOT_FOUND, e_soil == ERR_SOIL_TEST_NOT_FOUND, e_budget == ERR_BUDGET_NOT_FOUND, e_storage == ERR_STORAGE_NOT_FOUND"
            - "e_stinsp == ERR_STORAGE_INSPECTION_NOT_FOUND, e_event == ERR_EVENT_NOT_FOUND, e_transfer == ERR_TRANSFER_NOT_FOUND"
            - "e_incident == ERR_INCIDENT_NOT_FOUND, e_inspection == ERR_INSPECTION_NOT_FOUND, e_report == ERR_REPORT_NOT_FOUND"
            - "each error body carries a non-empty data.message and no data payload of the requested entity"
      - name: create_field_missing_required_input_is_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=7]
          - errors.ERR_INVALID_REQUEST
          - endpoints.POST /cafo/fields
        distinguishing_aspect: |
          slope_pct and water_frontage_ft carry no default in §1.1, so omitting either is a
          400 rather than a silent zero — which would otherwise change required_setback_ft
          and net_applicable_acres.
        test_recipe:
          setup:
            - "One Willow Creek Dairy operation"
          setup_api_calls:
            - call: "POST /cafo/operations"
              payload: { name: "Willow Creek Dairy", county: "Linn", animal_type: "DAIRY_COW", head_count: 300, manure_handling: "LIQUID", open_lot_area_sqft: 40000, discharge_potential: "CONTINUOUS", has_conservation_plan: true }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { op_id: $.data.id }
          trigger:
            - call: "POST /cafo/fields"
              payload: { operation_id: "${op_id}", field_name: "North 40", total_acres: 42.5, distance_to_water_ft: 150, water_frontage_ft: 900 }
              as: CertifiedPlanner
              as_user_id: "planner-1"
              captures: { err_slope: $.data.error_id }
            - call: "POST /cafo/fields"
              payload: { operation_id: "${op_id}", field_name: "North 40", total_acres: 42.5, distance_to_water_ft: 150, slope_pct: 4.0 }
              as: CertifiedPlanner
              as_user_id: "planner-1"
              captures: { err_frontage: $.data.message }
          assert:
            - "both trigger calls return status 400 with data.error_id == ERR_INVALID_REQUEST"
            - "err_slope == ERR_INVALID_REQUEST and err_frontage is a non-empty message naming the missing field"
            - "no Field row exists for operation ${op_id} after both calls"
      - name: omitted_optional_inputs_apply_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Operation.fields.open_lot_area_sqft
          - entities.Operation.fields.has_conservation_plan
          - entities.ManureStorage.fields.required_freeboard_in
          - entities.Hauler.fields.certified_applicator
        distinguishing_aspect: |
          Three different defaults must be applied and then FLOW INTO computed values:
          open_lot_area_sqft 0 drops design_annual_manure_gallons to 3105000.00 (no
          precipitation term), required_freeboard_in 24 fixes operating_capacity at
          4488300.00, and certified_applicator defaults to false.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls: []
          trigger:
            - call: "POST /cafo/operations"
              payload: { name: "Dry Lot Dairy", county: "Linn", animal_type: "DAIRY_COW", head_count: 300, manure_handling: "LIQUID", discharge_potential: "CONTINUOUS" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { op_id: $.data.id }
            - call: "POST /cafo/manure-storages"
              payload: { operation_id: "${op_id}", structure_name: "Lagoon 1", structure_type: "EARTHEN_LAGOON", surface_area_sqft: 60000, total_depth_in: 144 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { st_id: $.data.id }
            - call: "POST /cafo/haulers"
              payload: { business_name: "Prairie Pumping LLC", license_number: "HL-4417", license_expires_on: "2027-12-31T00:00:00Z" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { hl_id: $.data.id }
          assert:
            - "Operation.${op_id}.open_lot_area_sqft == 0 and has_conservation_plan == false"
            - "Operation.${op_id}.design_annual_manure_gallons == 3105000.00 and daily_production_gallons == 8506.85"
            - "ManureStorage.${st_id}.required_freeboard_in == 24, freeboard_reserve_gallons == 897660.00 and operating_capacity_gallons == 4488300.00"
            - "Operation.${op_id}.design_storage_days == 527, computed as floor(4488300.00 / 8506.85)"
            - "Hauler.${hl_id}.certified_applicator == false and hauler_status == ACTIVE"
      - name: client_supplied_computed_field_is_rejected_as_unknown_field
        claim_type: computed_fields
        grounds:
          - validations[priority=7]
          - errors.ERR_INVALID_REQUEST
          - entities.Operation.fields.animal_units
          - entities.FieldNutrientBudget.fields.allowable_rate_gal_per_acre
        distinguishing_aspect: |
          Computed fields are not merely ignored on input — §1.4/7 forbids unknown body fields,
          so posting animal_units or allowable_rate_gal_per_acre is a 400, which is stronger and
          observably different from a silent overwrite.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls: []
          trigger:
            - call: "POST /cafo/operations"
              payload: { name: "Willow Creek Dairy", county: "Linn", animal_type: "DAIRY_COW", head_count: 300, manure_handling: "LIQUID", open_lot_area_sqft: 40000, discharge_potential: "CONTINUOUS", has_conservation_plan: true, animal_units: 9999.00 }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { err_units: $.data.error_id }
            - call: "POST /cafo/operations"
              payload: { name: "Willow Creek Dairy", county: "Linn", animal_type: "DAIRY_COW", head_count: 300, manure_handling: "LIQUID", open_lot_area_sqft: 40000, discharge_potential: "CONTINUOUS", has_conservation_plan: true, size_class: "SMALL" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { err_class: $.data.message }
          assert:
            - "both trigger calls return status 400 with data.error_id == ERR_INVALID_REQUEST"
            - "err_units == ERR_INVALID_REQUEST and err_class is a non-empty message"
            - "zero Operation rows exist after both calls, so neither create partially applied"
      - name: system_fields_are_server_minted_and_version_increments_on_patch
        claim_type: system_fields
        grounds:
          - entities.Operation
          - endpoints.PATCH /cafo/operations/{id}
          - calculations.operation_animal_units_and_class
        distinguishing_aspect: |
          id and created_at must be stable across a mutation while version increments 1 -> 2 and
          updated_at moves, and the PATCH must re-run §1.3 so animal_units follows head_count
          from 420.00 to 560.00.
        test_recipe:
          setup:
            - "One Willow Creek Dairy operation at version 1 with animal_units 420.00"
          setup_api_calls:
            - call: "POST /cafo/operations"
              payload: { name: "Willow Creek Dairy", county: "Linn", animal_type: "DAIRY_COW", head_count: 300, manure_handling: "LIQUID", open_lot_area_sqft: 40000, discharge_potential: "CONTINUOUS", has_conservation_plan: true }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { op_id: $.data.id, made_at: $.data.created_at }
          trigger:
            - call: "PATCH /cafo/operations/${op_id}"
              payload: { head_count: 400 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { new_version: $.data.version }
          assert:
            - "status is 200, data.id == ${op_id} and data.created_at == ${made_at}, both untouched by the write"
            - "the captured new_version == 2 and data.updated_at is at or after data.created_at"
            - "Operation.${op_id}.animal_units == 560.00 and size_class is still MEDIUM"
            - "Operation.${op_id}.design_annual_manure_gallons == 4409298.00 and daily_production_gallons == 12080.27"
      - name: invalid_enum_and_out_of_range_values_are_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=7]
          - errors.ERR_INVALID_REQUEST
          - entities.Operation.fields.animal_type
          - entities.StorageInspection.fields.visual_condition
        distinguishing_aspect: |
          Type-constraint rejection is checked on an enum member that is plausible but undeclared
          (GOAT) and on a numeric field driven negative, both before any state or business rule
          runs, so nothing is persisted.
        test_recipe:
          setup:
            - "One Willow Creek Dairy operation with one EARTHEN_LAGOON structure"
          setup_api_calls:
            - call: "POST /cafo/operations"
              payload: { name: "Willow Creek Dairy", county: "Linn", animal_type: "DAIRY_COW", head_count: 300, manure_handling: "LIQUID", open_lot_area_sqft: 40000, discharge_potential: "CONTINUOUS", has_conservation_plan: true }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { op_id: $.data.id }
            - call: "POST /cafo/manure-storages"
              payload: { operation_id: "${op_id}", structure_name: "Lagoon 1", structure_type: "EARTHEN_LAGOON", surface_area_sqft: 60000, total_depth_in: 144, required_freeboard_in: 24 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { st_id: $.data.id }
          trigger:
            - call: "POST /cafo/operations"
              payload: { name: "Goat Dairy", county: "Linn", animal_type: "GOAT", head_count: 300, manure_handling: "LIQUID", discharge_potential: "CONTINUOUS" }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { err_enum: $.data.error_id }
            - call: "POST /cafo/storage-inspections"
              payload: { storage_id: "${st_id}", inspected_on: "2026-07-30T00:00:00Z", inspector_name: "T. Beck", measured_freeboard_in: -3, visual_condition: "NORMAL" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { err_range: $.data.error_id }
            - call: "POST /cafo/storage-inspections"
              payload: { storage_id: "${st_id}", inspected_on: "2026-07-30T00:00:00Z", inspector_name: "T. Beck", measured_freeboard_in: 30, visual_condition: "MUDDY" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { err_cond: $.data.error_id }
          assert:
            - "all three trigger calls return status 400 with data.error_id == ERR_INVALID_REQUEST"
            - "err_enum == ERR_INVALID_REQUEST, err_range == ERR_INVALID_REQUEST and err_cond == ERR_INVALID_REQUEST"
            - "ManureStorage.${st_id}.storage_status is STILL IN_SERVICE and last_inspected_on == null, so no rejected inspection landed"
            - "exactly one Operation row exists"
      - name: soil_test_and_storage_inspection_are_append_only_records
        claim_type: immutability
        grounds:
          - entities.SoilTest
          - entities.StorageInspection
          - endpoints.POST /cafo/soil-tests
          - endpoints.POST /cafo/storage-inspections
        distinguishing_aspect: |
          Both entities declare common_fields: false, so their rows carry id and created_at only
          — no version and no updated_at — and §1.5 declares no PATCH for either, making the
          measurement record append-only while still exposing computed fields.
        test_recipe:
          setup:
            - "One Willow Creek Dairy operation with field North 40 and one EARTHEN_LAGOON structure"
          setup_api_calls:
            - call: "POST /cafo/operations"
              payload: { name: "Willow Creek Dairy", county: "Linn", animal_type: "DAIRY_COW", head_count: 300, manure_handling: "LIQUID", open_lot_area_sqft: 40000, discharge_potential: "CONTINUOUS", has_conservation_plan: true }
              as: ComplianceAdmin
