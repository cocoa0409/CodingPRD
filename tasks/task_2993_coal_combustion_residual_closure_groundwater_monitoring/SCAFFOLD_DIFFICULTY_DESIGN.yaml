              as: ProfessionalEngineer
              as_user_id: "${pe_geo_id}"
          assert:
            - "BeneficialReuseAgreement.${agr_at_id}.meets_astm_c618_class_f == true"
            - "BeneficialReuseAgreement.${agr_at_id}.qualification_score == 70.30"
            - "BeneficialReuseAgreement.${agr_at_id}.status == QUALIFIED"
            - "BeneficialReuseAgreement.${agr_at_id}.qualified_by == ${pe_geo_id}"
            - "BeneficialReuseAgreement.${agr_over_id}.meets_astm_c618_class_f == false"
            - "BeneficialReuseAgreement.${agr_over_id}.qualification_score == 70.27"
            - "the second trigger call returns HTTP 422 with error_id ERR_ASH_QUALITY_FAILS_SPEC"
            - "BeneficialReuseAgreement.${agr_over_id}.status == DRAFT and qualified_on == null and qualified_by == null"

      - name: exactly_three_downgradient_wells_certifies_network_and_two_does_not
        grounds:
          - calculations.network_certification_readiness
          - validations.priority_37_ERR_INSUFFICIENT_DOWNGRADIENT_WELLS
          - entities.MonitoringProgram.fields.downgradient_well_count
          - entities.MonitoringProgram.fields.network_certified
