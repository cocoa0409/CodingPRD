    claim_type: Correct Result
    grounds:
    - calculations.driver_compliance_expiry
    - entities.Driver.fields.compliance_expires_at
    distinguishing_aspect: 'The rule folds clearances with min and the inspection with MAX: with a fingerprint clear to 2027-05-01, a county clear to 2027-03-01 and a passing inspection to 2027-04-01, compliance_expires_at reads 2027-03-01 — the county date, not the fingerprint date and not the inspection date.'
