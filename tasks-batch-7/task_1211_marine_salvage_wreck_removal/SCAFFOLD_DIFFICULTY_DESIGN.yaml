          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION with HTTP 409 (state p5 wins over business_safety p6)"
            - "error_id != ERR_ENV_HOLD_ACTIVE even though env_posture == ENV_HOLD also blocks the call"
            - "OperationPhase.${ph_id}.status == WEATHER_HOLD (no side effects fired)"

      - name: contract_activate_env_clearance_beats_security_shortfall
        grounds:
          - "validations[priority=6]"
          - "validations[priority=10]"
          - "errors[ERR_ENV_CLEARANCE_REQUIRED]"
          - "errors[ERR_SECURITY_INSUFFICIENT]"
        distinguishing_aspect: |
          Category pair business_safety vs business_fiscal: activating a
          contract whose latest APPROVED assessment is TIER_3 with no GRANTED
          ENV_AGENCY permit AND with security held below requirement violates
          both p6 and p10; the safety error ERR_ENV_CLEARANCE_REQUIRED must be
          returned. Distinct pair from state-vs-safety.
        test_recipe:
          setup:
            - "Casualty FIRE declared 50,000,000 with TIER_3 assessment APPROVED; NCNP contract SIGNED (provisional 6,000,000; security_required 7,500,000)"
            - "Security lodged only 1,000,000 (held < required) and NO ENV_AGENCY permit granted"
          setup_api_calls:
            - { call: "POST /casualties", payload: { vessel_name: "MV Pyro", casualty_type: FIRE, declared_salved_value_cents: 50000000, position: "36N 5W" }, as: SalvageMaster, as_user_id: "sm-01", captures: { cas_id: $.data.id, cas_v: $.data.version } }
            - { call: "POST /assessments", payload: { casualty_id: "${cas_id}", expected_casualty_version: "${cas_v}", pollution_risk_tier: TIER_3, wreck_removal_required: true, estimated_cost_cents: 9000000 }, as: MarineSurveyor, as_user_id: "surveyor-01", captures: { asmt_id: $.data.id } }
            - { call: "POST /assessments/${asmt_id}/approve", payload: {}, as: OperationsDirector, as_user_id: "opsdir-01" }
            - { call: "POST /plans", payload: { casualty_id: "${cas_id}", method: WRECK_REMOVAL, required_equipment_classes: [CRANE_BARGE] }, as: SalvageMaster, as_user_id: "sm-01", captures: { plan_id: $.data.id } }
            - { call: "POST /plans/${plan_id}/submit", payload: {}, as: SalvageMaster, as_user_id: "sm-01" }
            - { call: "POST /plans/${plan_id}/approve", payload: {}, as: OperationsDirector, as_user_id: "opsdir-01" }
            - { call: "POST /contracts", payload: { casualty_id: "${cas_id}", plan_id: "${plan_id}", form: NO_CURE_NO_PAY, scopic_clause_included: true }, as: ContractsOfficer, as_user_id: "co-01", captures: { ct_id: $.data.id } }
            - { call: "POST /contracts/${ct_id}/offer", payload: {}, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /contracts/${ct_id}/sign", payload: {}, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /securities", payload: { contract_id: "${ct_id}", lodged_amount_cents: 1000000 }, as: ContractsOfficer, as_user_id: "co-01" }
          trigger:
            - { call: "POST /contracts/${ct_id}/activate", payload: {}, as: ContractsOfficer, as_user_id: "co-01", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ENV_CLEARANCE_REQUIRED with HTTP 422 (business_safety p6 wins over business_fiscal p10)"
            - "error_id != ERR_SECURITY_INSUFFICIENT even though held 1,000,000 < required 7,500,000"
            - "SalvageContract.${ct_id}.status == SIGNED and provisional_award_cents == 6000000 and security_required_cents == 7500000"

  - rule_id: boundary_precision_check
    instances:
      - name: wave_height_equality_passes_activation
        grounds:
          - calculations.weather_feasibility
          - "validations[priority=6]"
          - "errors[ERR_WEATHER_LIMIT_EXCEEDED]"
        distinguishing_aspect: |
          Metric = significant wave height (meters) on POST
          /phases/{id}/activate: forecast_hs_meters == min asset max_hs_meters
          (2.50 == 2.50) PASSES because the comparison is inclusive (<=); the
          failing side (2.51) is covered in corner design. Distinct metric and
          endpoint from the security-coverage boundary.
