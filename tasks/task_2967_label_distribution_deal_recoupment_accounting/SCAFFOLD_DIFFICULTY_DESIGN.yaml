  - rule_id: resource_temporal_overlap
    instances:
      - name: rate_card_half_open_window_overlap_rejected_adjacency_allowed
        grounds:
          - validations[priority 11 business_referential ERR_RATE_CARD_OVERLAP]
          - entities.StreamRateCard.fields.effective_from
          - entities.StreamRateCard.fields.effective_to
          - endpoints[POST /stream-rate-cards]
        distinguishing_aspect: |
          Interval semantics = HALF-OPEN [effective_from, effective_to) keyed on the
          (dsp_code, territory_code, tier) triple, so a card starting exactly on another's effective_to
          is adjacent and legal, and an open-ended card (effective_to null) extends to infinity and
          blocks everything after its start.
        test_recipe:
          setup:
            - "no StreamRateCard rows for dsp_code STRM at the start of the test"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /stream-rate-cards"
              payload: { dsp_code: "STRM", territory_code: "US", tier: "PREMIUM", rate_micros_per_stream: 4000, effective_from: "2026-01-01", effective_to: "2026-04-01" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
          trigger:
            - call: "POST /stream-rate-cards"
              payload: { dsp_code: "STRM", territory_code: "US", tier: "PREMIUM", rate_micros_per_stream: 4200, effective_from: "2026-04-01", effective_to: "2026-07-01" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /stream-rate-cards"
              payload: { dsp_code: "STRM", territory_code: "US", tier: "PREMIUM", rate_micros_per_stream: 4300, effective_from: "2026-03-31", effective_to: "2026-05-01" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /stream-rate-cards"
              payload: { dsp_code: "STRM", territory_code: "US", tier: "AD_SUPPORTED", rate_micros_per_stream: 1200, effective_from: "2026-01-01", effective_to: "2026-04-01" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /stream-rate-cards"
              payload: { dsp_code: "STRM", territory_code: "US", tier: "PREMIUM", rate_micros_per_stream: 4400, effective_from: "2026-07-01" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /stream-rate-cards"
              payload: { dsp_code: "STRM", territory_code: "US", tier: "PREMIUM", rate_micros_per_stream: 4500, effective_from: "2026-08-01" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
          assert:
            - "call 1 (2026-04-01..2026-07-01) returns 201: touching the predecessor's exclusive end is adjacency, not overlap"
            - "call 2 (2026-03-31..2026-05-01) returns 409 with error.code == ERR_RATE_CARD_OVERLAP: it straddles the 2026-04-01 boundary by one day"
            - "call 3 returns 201: the same 2026-01-01..2026-04-01 window is free on the AD_SUPPORTED tier because the triple differs"
            - "call 4 (2026-07-01, no effective_to) returns 201: adjacent to the 2026-07-01 exclusive end of call 1's card"
            - "call 5 (2026-08-01, no effective_to) returns 409 ERR_RATE_CARD_OVERLAP: the open-ended card from call 4 covers 2026-08-01 onward"
            - "GET /stream-rate-cards with dsp_code STRM, territory_code US and tier PREMIUM returns exactly 3 rows with rate_micros_per_stream 4000, 4200 and 4400"

      - name: final_statement_closed_period_overlap_and_contiguity
        grounds:
          - validations[priority 11 business_referential ERR_STATEMENT_PERIOD_OVERLAP]
          - validations[priority 11 business_referential ERR_STATEMENT_PERIOD_NOT_CONTIGUOUS]
          - state_machines.ArtistStatement.DRAFT_to_PREPARED
          - entities.ArtistStatement.fields.basis_variant
          - endpoints[POST /artist-statements/{id}/prepare]
        distinguishing_aspect: |
          Interval semantics = CLOSED INCLUSIVE [period_start, period_end] per agreement, the opposite
          convention from the rate cards: here a single-day touch IS an overlap, and beyond
          non-overlap the periods must also be gap-free, so a one-day gap that overlaps nothing is
          still rejected — with a different error and a different status (422 vs 409).
        test_recipe:
          setup:
            - "one EXECUTED DISTRIBUTION_FEE deal with term 2026-01-01..2026-12-31, one RELEASED release, one ACTIVE ArtistAgreement"
            - "no statements exist on the agreement at the start of the test"
