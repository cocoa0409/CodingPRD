              as: TalentBuyer
            - call: "GET /cancellation-events/${fk_cep_id}"
              payload: {}
              as: TalentBuyer
            # ---- the two forks never rejoin -----------------------------
            - call: "POST /cancellation-events/${fk_cep_id}/process-refunds"
              payload: {}
              as: TourAccountant
              captures: { fk_e_rejoin_refunds: $.data.error_id }
            - call: "POST /cancellation-events/${fk_ceq_id}/reschedule"
              payload: { replacement_show_id: "${fk_shr_id}" }
              as: TalentBuyer
              captures: { fk_e_rejoin_reschedule: $.data.error_id }
            - call: "GET /markets/${fk_mk_id}"
              payload: {}
              as: RiskOfficer
            - call: "GET /artists/${fk_arp_id}"
              payload: {}
              as: TalentBuyer
          assert:
            - "FORK A STEP 1 — Show Q show_status CANCELLED, sales_status CLOSED, its GA tier CLOSED, BudgetLine ${fk_blq_id}.status VOID, Offer ${fk_ofq_id} still ACCEPTED (terminal children are never rewritten), CancellationEvent ${fk_ceq_id}.status OPENED with kind CANCELLED and occurred_at ${fk_ceq_occurred} == 2026-08-01T00:00:00.000Z"
            - "FORK A REFUND MATH — ${fk_q_refund} == 500000 (100 x 5000 face value, NOT the 487500 adjusted gross: tax, facility and card fees are the promoter's sunk loss) and ${fk_q_tickets} == 100"
            - "FORK A UNRECOVERED MATH — ${fk_q_unrecovered} == 1100000 == 1000000 (the VOIDed line's settlement_expense_cents, which still counts because the money was already spent) + 100000 (the accepted offer's deposit)"
            - "FORK A POST-REFUND STATE — Show Q gross_sold_cents == 0 and adjusted_gross_cents == 0, while the GA tier's sold_qty stays 100 as the historical record"
            - "FORK A INSURANCE MATH — ${fk_q_covered} == 1100000 == MIN(1200000, 1100000, 25000000) and ${fk_q_recovery} == 600000 == MAX(0, 1100000 - 500000); the claim was filed for MORE than the unrecovered cost and the unrecovered cost is what caps the payout"
            - "FORK A TERMINATES — CancellationEvent ${fk_ceq_id}.status == CLAIM_SETTLED, filed_by_user_id == 'u_risk_filer', and the settle was performed by a different user ('u_risk_adjuster'), satisfying segregation of duties"
            - "FORK B STEP 1 — Show P show_status POSTPONED, sales_status CLOSED, its GA tier CLOSED, ${fk_p_refund_at_open} == 1000000 (200 x 5000 at face), and artist Fork Act P confirmed_show_count back to 0"
            - "FORK B MONEY MOVES INSTEAD OF BEING REFUNDED — after reschedule, ${fk_r_transferred} == 1000000, Show R transferred_in_paid_tickets == 200, ${fk_r_adjusted} == 975000 == 1000000 - 0 tax - 0 facility - 25000 card fee, while Show P refund_liability_cents == 0 and CancellationEvent ${fk_cep_id}.refund_liability_cents == 0"
            - "FORK B TERMINATES — Show P show_status == RESCHEDULED, CancellationEvent ${fk_cep_id}.status == RESCHEDULED with replacement_show_id == ${fk_shr_id}, and Show R is STILL PLANNED (the transfer moves money, not the deal)"
            - "THE FORKS NEVER REJOIN — ${fk_e_rejoin_refunds} == ERR_ALREADY_TERMINAL 409 and ${fk_e_rejoin_reschedule} == ERR_ALREADY_TERMINAL 409; neither refused call created a Settlement, moved money, or changed either event's status"
            - "PORTFOLIO CLOSES OUT — ${fk_mk_after_cancel} == 1000000 (only P still in the exposure set at that point), and at the end market.committed_guarantee_cents == 0, exposure_utilization_pct == 0.00, risk_posture OPEN, at_risk_guarantee_cents == 0 (no IN_SCOPE show remains and the 600000 recovery is subtracted then floored), settled_show_count == 0 and performance_index == 0 (no SETTLED show, so the denominator is 0)"

      - name: guarded_transition_perform_to_settled_requires_every_invoice_resolved
        claim_type: guarded transitions
        grounds:
          - "state_machines.Show.transitions.PERFORMED_to_SETTLED"
          - "state_machines.Settlement.transitions.DRAFT_to_CALCULATED"
          - "validations[36]"
        excluded_because:
          difficulty_instance: settlement_calculate_blocked_by_a_still_verified_vendor_invoice
          rationale: "That §1.8 instance is exactly the cross-entity guard 'Settlement DRAFT -> CALCULATED only if every VendorInvoice of the show is APPROVED or REJECTED', asserted in both directions (blocked at VERIFIED, then permitted once the invoice is approved)."

      # --- side-effect pattern rows ---------------------------------------
      # 'Bubble up' is non-applicable: no parent state in §1.2 is auto-derived
      # from its children reaching terminal states (show.budget_posture is a
      # computed enum, not a state machine, and it is covered under entities).
      - name: cancellation_cascades_down_to_non_terminal_children_only
        claim_type: Cascade down
        grounds:
          - "state_machines.Show.transitions.ON_SALE_to_CANCELLED"
          - "state_machines.TicketTier.transitions.DRAFT_to_CLOSED"
          - "state_machines.TicketTier.transitions.ON_SALE_to_CLOSED"
          - "state_machines.Offer.transitions.DRAFT_to_WITHDRAWN"
          - "state_machines.Offer.terminal_states"
          - "endpoints[POST /cancellation-events].side_effects"
        distinguishing_aspect: "One cancellation touches five children of three different types and the selection rule is state-based, not type-based: the ON_SALE tier and the DRAFT tier both go CLOSED, both ACTIVE budget lines go VOID, the DRAFT sibling offer goes WITHDRAWN, but the ACCEPTED offer and the already-WITHDRAWN offer are left byte-identical (same status, same version) because they are terminal."
        test_recipe:
          setup:
            - "BASE(Cascade Market limit 5000000, Cascade Act, Cascade Hall cap 800 / facility 0 / tax 0)."
            - "Show S carries THREE offers: O0 created then explicitly withdrawn (terminal WITHDRAWN), O1 created and left in DRAFT (non-terminal), O2 created, submitted and ACCEPTED for 800000 (terminal). Creating a new offer supersedes only SUBMITTED/COUNTERED siblings, so O0 and O1 survive the O2 write untouched."
            - "Show S then carries two ACTIVE budget lines (PRODUCTION 200000, MARKETING 100000), tier T1 (GA 5000 x 300) created before on-sale so it is ON_SALE, tier T2 (BALCONY 3000 x 200) created after on-sale so it is still DRAFT, and 50 GA tickets sold -> gross_sold_cents 250000."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Cascade Market", region_code: "CD", guarantee_exposure_limit_cents: 5000000 }
              as: RiskOfficer
              captures: { cd_mk_id: $.data.id }
            - call: "POST /artists"
              payload: { name: "Cascade Act", agency: "Down Talent", tier: "THEATER", historical_sellthrough_pct: 50.00, withholding_pct: 0 }
