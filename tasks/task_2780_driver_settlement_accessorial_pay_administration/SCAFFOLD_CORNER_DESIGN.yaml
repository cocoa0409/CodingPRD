          rationale: "That instance runs byte-identical load bodies through a PRACTICAL package and an HHG package and asserts both paid_miles and both linehaul_pay_cents plus the delta, which is exactly the dual_variant_calculation layer claim."
  - section: consistency_model
    instances:
      - name: prepare_side_effects_are_readable_at_the_same_logical_instant
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /driver-pay/settlements/{id}/prepare]
          - entities.Settlement.fields.line_count
          - entities.Load.fields.pay_status
          - entities.Driver.fields.ytd_gross_pay_cents
        distinguishing_aspect: |
          The declared consistency model is immediate, so every derived field the prepare touches is visible to
          the very next read with no clock advance, no retry and no polling: the settlement is PREPARED with
          line_count 1 and gross 46080, and the load has already flipped to SETTLED with its settlement_id
          stamped. Equally, immediate does not mean eventually-more - ytd_gross_pay_cents is defined over
          APPROVED and PAID settlements only, so it must still read 0 at this instant and must not creep upward
          on a later read taken at the same clock value.
