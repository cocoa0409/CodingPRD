            - call: "POST /psm/equipment"
              payload: { system_id: "${sys}", tag_number: "P-301", equipment_type: "PIPING_CIRCUIT", inspection_interval_days: 180, inspection_method: "CONDITION_BASED" }
              as: MaintenanceLead
              captures: { eq: $.data.id }
            - call: "POST /psm/inspections"
              payload: { equipment_id: "${eq}", due_at: "2026-08-05T00:00:00Z" }
              as: MaintenanceLead
              captures: { insp: $.data.id }
            - call: "POST /psm/_clock/set_current_utc"
