scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: workstation_provisional_vs_final_tier_flip
        grounds:
          - calculations.reservation_fee_provisional
          - calculations.reservation_fee_final
          - state_machines.Reservation.PENDING_to_CONFIRMED
          - state_machines.Reservation.IN_USE_to_COMPLETED
          - entities.Reservation.fields.provisional_fee_cents
          - entities.Reservation.fields.final_fee_cents
        distinguishing_aspect: |
          Two calculations on the Reservation entity produce DIFFERENT integer-cent results for the same
          booked reservation when the actual check-out time flips the cheaper tier. Provisional uses
          booked hours to choose between hourly vs daily pricing at CONFIRM time; Final uses actual hours
          at COMPLETION time, so an 8-hour booking that costs daily=5000¢ provisionally becomes
          hourly=4000¢ finally when the member leaves after 5 actual hours.
        test_recipe:
          setup:
            - "PlatformAdmin creates Tenant T1 with default credit limit"
            - "PlatformAdmin creates Lease on T1 with billing_plan=DAILY, monthly_rate_cents=0, term covering today..today+180d, then activates it"
            - "PlatformAdmin creates Member M1 under T1 and issues AccessBadge B1 to M1"
            - "PlatformAdmin creates Resource WS-1 with kind=WORKSTATION, hourly_rate_cents=800, daily_rate_cents=5000, block_rate_cents=0"
            - "Advance clock to 2026-05-04T07:00:00Z"
          trigger:
            - "TenantMember M1: POST /reservations {tenant_id:T1, member_id:M1, resource_id:WS-1, start_at:2026-05-04T09:00Z, end_at:2026-05-04T17:00Z}  (8 hours)"
            - "M1: POST /reservations/{id}/confirm  (provisional picks DAILY: 5000¢ since 8h*800=6400¢ > 5000¢)"
            - "Advance clock to 2026-05-04T09:00:00Z"
            - "M1: POST /access-events {kind:CHECK_IN, reservation_id:R, badge_id:B1}"
            - "Advance clock to 2026-05-04T14:00:00Z  (5 actual hours elapsed)"
            - "M1: POST /access-events {kind:CHECK_OUT, reservation_id:R, badge_id:B1}"
          assert:
            - "Reservation.provisional_fee_cents == 5000"
            - "Reservation.final_fee_cents == 4000"
            - "Reservation.provisional_fee_cents != Reservation.final_fee_cents"

      - name: visitor_overstay_threshold_vs_zero_fee
        grounds:
          - calculations.visitor_overstay_fee
          - state_machines.Visitor.CHECKED_IN_to_CHECKED_OUT
          - entities.Visitor.fields.overstay_fee_cents
          - entities.Visitor.fields.actual_departure_at
          - entities.Visitor.fields.expected_departure_at
        distinguishing_aspect: |
          A calculation on the Visitor entity (different entity domain than reservation_fee_final on
          Reservation) produces a NON-ZERO overstay fee when actual_departure_at > expected_departure_at,
          and ZERO otherwise — the SAME visitor configuration yields two different cent outputs depending
          on which of the two CHECKED_OUT paths (on-time vs overstay) is taken.
        test_recipe:
          setup:
            - "Create Tenant T1, Member M1 (host), Receptionist actor headers"
            - "Advance clock to 2026-05-10T08:00:00Z"
            - "M1: POST /visitors {host_member_id:M1, visitor_name:'V1', expected_arrival_at:2026-05-10T09:00Z, expected_departure_at:2026-05-10T11:00Z}"
            - "Advance clock to 2026-05-10T09:00:00Z"
            - "Receptionist: POST /access-events {kind:VISITOR_CHECK_IN, visitor_id:V}"
          trigger:
            - "Advance clock to 2026-05-10T11:45:00Z (45 minutes past expected)"
            - "Receptionist: POST /access-events {kind:VISITOR_CHECK_OUT, visitor_id:V}"
          assert:
            - "Visitor.overstay_fee_cents == 1000  (ceil(45/30)=2 blocks * 500¢)"
            - "Visitor.actual_departure_at == '2026-05-10T11:45:00.000Z'"
            - "A second parallel visitor V2 with identical expected window but checked out at 11:00:00Z on the dot yields Visitor.overstay_fee_cents == 0"

  - rule_id: combinatorial_formula
    instances:

      - name: bill_tax_nested_sum_then_round
        grounds:
          - calculations.bill_tax
          - calculations.reservation_fee_final
          - calculations.visitor_overstay_fee
          - entities.Bill.fields.subtotal_cents
          - entities.Bill.fields.tax_cents
          - entities.BillLine.fields.amount_cents
        distinguishing_aspect: |
          Mode (b) nested rounding where order matters. The scaffold pins SUM-THEN-ROUND for tax: per-line
          amounts are rounded by source calculations, then summed to subtotal, then tax = round(subtotal *
          0.0825). Per-line rounding (round(line * rate, 2) per line, then sum) yields 1¢ more on specific
          line shapes — e.g., three lines of 991¢ each produce per-line tax 3*82=246¢ vs sum-then-round
          round(2973*0.0825)=245¢.
        test_recipe:
          setup:
            - "Create Tenant T1 with credit_limit_cents=100000, Member M1, Resource MR-1 with kind=MEETING_ROOM, hourly_rate_cents=991 (unusual rate) capacity=4"
            - "Activate a lease on T1 (billing_plan=HOURLY)"
            - "Advance clock to 2026-05-05T08:00:00Z"
          trigger:
            - "Create and confirm three meeting-room reservations, each of 1.0 hour duration, on different non-overlapping time slots"
            - "CHECK_IN and CHECK_OUT each reservation at exactly booked times (so final_fee_cents == provisional_fee_cents == 1 unit * 991¢ = 991¢ each)"
            - "Wait for consolidation into a single DRAFT Bill for T1"
          assert:
            - "Bill.subtotal_cents == 2973  (991 + 991 + 991)"
            - "Bill.tax_cents == 245  (round(2973 * 0.0825) = round(245.2725) = 245, using sum-then-round order pinned by scaffold)"
            - "Bill.tax_cents != 246  (246 is the result of per-line rounding — rejected by scaffold)"
            - "Bill.total_due_cents == 3218  (2973 + 245 + 0 late_fee)"

      - name: workstation_final_tiered_min_over_three_inputs
        grounds:
          - calculations.reservation_fee_final
          - entities.Resource.fields.hourly_rate_cents
          - entities.Resource.fields.daily_rate_cents
          - entities.Reservation.fields.actual_start_at
          - entities.Reservation.fields.actual_end_at
        distinguishing_aspect: |
          Mode (a) a formula with ≥3 inputs and non-linear interaction: Final workstation fee is
          min(int(round(hours_actual * hourly_rate_cents)), ceil(hours_actual/8) * daily_rate_cents), and
          the tie-break (pick HOURLY when equal) is a branch that depends on the exact equality of the
          two expressions — so three inputs (hours_actual, hourly_rate, daily_rate) interact non-linearly
          with a tier-selection branch.
        test_recipe:
          setup:
            - "Create Tenant T1, Lease DAILY, Member M1 with AccessBadge B1"
            - "Create WS-2 with hourly_rate_cents=800, daily_rate_cents=5000"
            - "Advance clock to 2026-05-06T08:00:00Z"
          trigger:
            - "Create and confirm reservation R with booked 09:00-15:15Z (6.25 hours). Provisional DAILY: days=ceil(6.25/8)=1 day * 5000=5000¢; hourly=6.25*800=5000¢; tie → HOURLY picked, provisional_fee_cents=5000"
            - "CHECK_IN at 09:00Z"
            - "Advance clock to 2026-05-06T15:15:00Z; CHECK_OUT"
          assert:
            - "Reservation.provisional_fee_cents == 5000"
            - "Reservation.final_fee_cents == 5000  (6.25 actual hours, hourly==daily tie → HOURLY branch picked)"
            - "A sibling reservation with booked+actual 7 hours yields final_fee_cents == 5000 (daily wins since 5600 > 5000)"

  - rule_id: non_linear_state_machine
    instances:

      - name: lease_termination_cycle
        grounds:
          - state_machines.Lease.ACTIVE_to_TERMINATION_REQUESTED
          - state_machines.Lease.TERMINATION_REQUESTED_to_ACTIVE
          - state_machines.Lease.TERMINATION_REQUESTED_to_TERMINATION_REVIEWING
        distinguishing_aspect: |
          A genuine cycle A→B→A on the Lease entity: ACTIVE → TERMINATION_REQUESTED →
          (withdraw-termination) → ACTIVE. Not a dead-end terminal; the lease can re-enter ACTIVE and
          later be terminated again. This is a revision loop, not a linear pipeline.
        test_recipe:
          setup:
            - "Create Tenant T1, draft + activate Lease L1 (monthly_rate_cents=90000, term_end_date 2026-09-30)"
            - "Create TenantAdmin headers for T1"
          trigger:
            - "TenantAdmin: POST /leases/L1/request-termination → status TERMINATION_REQUESTED"
            - "TenantAdmin: POST /leases/L1/withdraw-termination → status ACTIVE"
            - "TenantAdmin: POST /leases/L1/request-termination (second time) → status TERMINATION_REQUESTED"
            - "PlatformAdmin P1: POST /leases/L1/begin-review → status TERMINATION_REVIEWING"
          assert:
            - "Lease.status == 'TERMINATION_REVIEWING'"
            - "Lease.version >= 4  (four successful mutations after activation)"

      - name: reservation_branching_to_three_terminals
        grounds:
          - state_machines.Reservation.CONFIRMED_to_IN_USE
          - state_machines.Reservation.CONFIRMED_to_NO_SHOW
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
          - state_machines.Reservation.IN_USE_to_COMPLETED
        distinguishing_aspect: |
          Reservation state machine has a branching fork from CONFIRMED to THREE divergent terminals —
          (a) CONFIRMED→IN_USE→COMPLETED (billed final_fee), (b) CONFIRMED→NO_SHOW (billed provisional),
          (c) CONFIRMED→CANCELLED (no bill). Each branch has a DIFFERENT side-effect set on
          provisional_fee_cents / final_fee_cents / bill_id, which satisfies branching fork-join with
          divergent side effects. This is on a DIFFERENT entity (Reservation) than the Lease cycle above.
        test_recipe:
          setup:
            - "Create three Reservations R1, R2, R3, all confirmed on the same workstation at DIFFERENT non-overlapping time slots today"
          trigger:
            - "R1: CHECK_IN + CHECK_OUT on time → COMPLETED"
            - "R2: do not CHECK_IN; advance clock past R2.end_at; run /_sweep → NO_SHOW"
            - "R3: POST /reservations/R3/cancel before start → CANCELLED"
          assert:
            - "R1.status == 'COMPLETED' AND R1.final_fee_cents > 0 AND R1.bill_id != null"
            - "R2.status == 'NO_SHOW' AND R2.final_fee_cents == R2.provisional_fee_cents AND R2.bill_id != null"
            - "R3.status == 'CANCELLED' AND R3.final_fee_cents == 0 AND R3.bill_id == null"

  - rule_id: transitive_cascade
    instances:

      - name: checkout_completion_bill_posture_depth3
        grounds:
          - state_machines.Reservation.IN_USE_to_COMPLETED
          - state_machines.Bill.DRAFT_to_ISSUED
          - calculations.bill_tax
          - calculations.tenant_access_posture
          - entities.Reservation.fields.final_fee_cents
          - entities.Bill.fields.subtotal_cents
          - entities.Tenant.fields.outstanding_balance_cents
          - entities.Tenant.fields.access_posture
        distinguishing_aspect: |
          Three-hop cascade originating from the CHECK_OUT access event:
          Hop 1: access-event (CHECK_OUT) mutates Reservation.status IN_USE → COMPLETED and sets
                 Reservation.final_fee_cents.
          Hop 2: That Reservation mutation CAUSES Bill.subtotal_cents to recompute (a BillLine is
                 appended; bill.tax_cents recomputes).
          Hop 3: Subsequent Bill.issue on that Bill CAUSES Tenant.outstanding_balance_cents to rise,
                 which CAUSES Tenant.access_posture to flip OPEN → RESTRICTED when balance crosses
                 credit_limit_cents.
          Each hop is caused by the previous hop's mutation, not by the original CHECK_OUT.
        test_recipe:
          setup:
            - "Create Tenant T1 with credit_limit_cents=5000"
            - "Create workstation WS-1 hourly_rate_cents=800, daily_rate_cents=10000 (daily deliberately uncompetitive so hourly wins); Member M1; Badge B1; Lease HOURLY"
            - "Create reservation 09:00-17:00 (8h), confirm; CHECK_IN; CHECK_OUT at 17:00"
            - "Confirm Bill has Reservation linked; BillingOfficer issues Bill"
          trigger:
            - "POST /access-events {kind:CHECK_OUT, reservation_id:R}  (this is the origin trigger)"
            - "POST /bills/{billId}/issue  (second transition caused by the first hop's result)"
          assert:
            - "Hop 1: Reservation.status == 'COMPLETED' AND Reservation.final_fee_cents == 6400"
            - "Hop 2: Bill.subtotal_cents == 6400 AND Bill.tax_cents == round(6400*0.0825)=528 AND Bill.total_due_cents == 6928"
            - "Hop 3 (after issue): Tenant.outstanding_balance_cents == 6928 AND Tenant.access_posture == 'RESTRICTED' (because 6928 >= 5000)"

      - name: lease_finalize_termination_cascade_depth2
        grounds:
          - state_machines.Lease.TERMINATION_REVIEWING_to_TERMINATED
          - calculations.lease_termination_penalty
          - calculations.tenant_access_posture
          - entities.Tenant.fields.status
          - entities.Tenant.fields.access_posture
          - entities.AccessBadge.fields.status
        distinguishing_aspect: |
          A DIFFERENT triggering transition (Lease TERMINATION_REVIEWING → TERMINATED) produces a
          two-hop cascade:
          Hop 1: Lease terminated → compute lease_termination_penalty → BillLine appended to Bill AND
                 Tenant.status := TERMINATING.
          Hop 2: Tenant.status mutation CAUSES Tenant.access_posture recompute (→ RESTRICTED) AND
                 enqueues AccessBadge SUSPEND sweep-job for all badges under this tenant.
          This cascade originates at a LEASE transition (not a reservation CHECK_OUT), and covers a
          different propagation pattern (termination → posture → badges vs checkout → bill → posture).
        test_recipe:
          setup:
            - "Create Tenant T1 MONTHLY lease with monthly_rate_cents=90000, term ending 2026-06-30"
            - "Create Member M1 with Badge B1 in ACTIVE status"
            - "Advance clock to 2026-04-30; TenantAdmin request-termination; PlatformAdmin P1 begin-review"
          trigger:
            - "PlatformAdmin P2 (different user from P1): POST /leases/L1/finalize-termination"
            - "POST /_sweep/run  (runs deferred AccessBadge suspension)"
          assert:
            - "Hop 1: Lease.status == 'TERMINATED' AND Lease.termination_penalty_cents == 54000  (2 full remaining months * 90000 * 0.3)"
            - "Hop 1: Tenant.status == 'TERMINATING'"
            - "Hop 2: Tenant.access_posture == 'RESTRICTED'"
            - "Hop 2: AccessBadge B1.status == 'SUSPENDED' after sweep"

  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_vs_business_safety_reservation_confirm
        grounds:
          - validations[priority=7]
          - validations[priority=12]
          - state_machines.Reservation.PENDING_to_CONFIRMED
          - entities.Tenant.fields.access_posture
        distinguishing_aspect: |
          Dual-failure: a reservation in the WRONG state (already CONFIRMED) on a tenant with
          access_posture=RESTRICTED triggers BOTH `ERR_INVALID_RESERVATION_STATE` (priority 7, state) AND
          `ERR_ACCESS_POSTURE_DENIES` (priority 12, business_safety). Since priority 7 < priority 12, the
          scaffold guarantees the response is `ERR_INVALID_RESERVATION_STATE`. Error-category pair:
          state vs business_safety.
        test_recipe:
          setup:
            - "Create Tenant T1 with credit_limit_cents=100; create a COMPLETED reservation that left Bill ISSUED; wait until Tenant.access_posture becomes RESTRICTED (outstanding_balance >= 100)"
            - "Create another Reservation R2 on a different resource and confirm it (status=CONFIRMED)"
          trigger:
            - "POST /reservations/R2/confirm (R2 is already CONFIRMED; and tenant posture is RESTRICTED)"
          assert:
            - "HTTP status == 409 (not 422)"
            - "data.error_id == 'ERR_INVALID_RESERVATION_STATE' (priority 7 fires first; ERR_ACCESS_POSTURE_DENIES priority 12 is NOT observed)"

      - name: business_referential_vs_business_fiscal_on_lease_finalize
        grounds:
          - validations[priority=18]
          - validations[priority=19]
          - state_machines.Lease.TERMINATION_REVIEWING_to_TERMINATED
        distinguishing_aspect: |
          Dual-failure during lease finalization: the tenant still has both (a) open reservations and (b)
          draft bills. priority 18 is business_referential (ERR_HAS_OPEN_RESERVATIONS), priority 19 is
          business_fiscal (ERR_HAS_DRAFT_BILLS). The scaffold guarantees priority 18 wins. Error-category
          pair: business_referential vs business_fiscal — DIFFERENT from the state vs business_safety
          pairing above.
        test_recipe:
          setup:
            - "Tenant T1 MONTHLY lease in TERMINATION_REVIEWING"
            - "One CONFIRMED reservation R1 still open"
            - "One DRAFT Bill on T1 with lines"
            - "PlatformAdmin P1 did begin-review; P2 will attempt finalize"
          trigger:
            - "P2: POST /leases/L1/finalize-termination"
          assert:
            - "HTTP 422"
            - "data.error_id == 'ERR_HAS_OPEN_RESERVATIONS' (priority 18 fires before priority 19)"

  - rule_id: boundary_precision_check
    instances:

      - name: overdue_week_strict_floor_threshold
        grounds:
          - calculations.bill_late_fee
          - state_machines.Bill.ISSUED_to_OVERDUE
          - endpoints[POST /_sweep/run]
          - endpoints[POST /_clock/advance]
          - entities.Bill.fields.late_fee_cents
        distinguishing_aspect: |
          Numeric-threshold boundary on Bill.late_fee_cents: weeks_past_due = floor(seconds_past_due / (7
          days)). At exactly 6 days 23 hours 59 minutes past due, weeks_past_due==0 → late_fee_cents==0.
          At exactly 7 days 0 minutes past due, weeks_past_due==1 → late_fee_cents is charged. Reachable
          via /_clock/advance + /_sweep/run endpoints.
        test_recipe:
          setup:
            - "Issue a Bill whose due_at is 2026-05-01T00:00:00Z, subtotal_cents=10000, tax_cents=round(10000*0.0825)=825"
          trigger:
            - "Advance clock to 2026-05-07T23:59:00Z (6d 23h 59m past due) and run sweep"
            - "Then advance to 2026-05-08T00:00:00Z (exactly 7d past due) and run sweep again"
          assert:
            - "At first observation: Bill.status == 'OVERDUE' AND Bill.late_fee_cents == 0"
            - "At second observation: Bill.late_fee_cents == round((10000+825) * 0.015 * 1) == 162"

      - name: half_open_interval_adjacency
        grounds:
          - validations[priority=15]
          - endpoints[POST /shared-office/reservations]
          - entities.Reservation.fields.start_at
          - entities.Reservation.fields.end_at
        distinguishing_aspect: |
          Empty-set boundary on a DIFFERENT metric (interval overlap, not late-fee time floor): half-open
          intervals [start, end) make back-to-back reservations R1=[09:00,11:00), R2=[11:00,13:00)
          non-overlapping. One minute of overlap (R2=[10:59, 13:00)) triggers
          ERR_RESERVATION_CONFLICT. Reached through the POST /reservations endpoint — a DIFFERENT
          endpoint than the /_sweep/run used for the late-fee boundary above.
        test_recipe:
          setup:
            - "Create Tenant T1, Member M1, Resource MR-1 (meeting room), Lease"
            - "Create R1: 2026-05-04T09:00-11:00Z, confirm it"
          trigger:
            - "Attempt R2 back-to-back: 2026-05-04T11:00-13:00Z → should succeed (HTTP 201)"
            - "Attempt R3 overlapping by one minute: 2026-05-04T10:59-13:00Z → should fail (HTTP 409)"
          assert:
            - "R2 HTTP 201; R2.id != null"
            - "R3 HTTP 409; R3.data.error_id == 'ERR_RESERVATION_CONFLICT'"

  - rule_id: cross_entity_state_dependency
    instances:

      - name: reservation_confirm_requires_tenant_posture_open
        grounds:
          - state_machines.Reservation.PENDING_to_CONFIRMED
          - validations[priority=12]
          - entities.Tenant.fields.access_posture
          - calculations.tenant_access_posture
        distinguishing_aspect: |
          Reservation.PENDING→CONFIRMED depends on Tenant.access_posture == OPEN. Entity pair:
          Reservation ↔ Tenant. When Tenant.access_posture is RESTRICTED or FROZEN, the transition is
          blocked on a sibling (different) entity's state.
        test_recipe:
          setup:
            - "Create Tenant T1 with credit_limit_cents=1 (easily exceeded)"
            - "Create a small COMPLETED reservation whose fee lands in a DRAFT Bill that is issued → outstanding_balance >= 1 → posture RESTRICTED"
            - "Create another Reservation R2 on a different resource (status=PENDING)"
          trigger:
            - "POST /reservations/R2/confirm"
          assert:
            - "HTTP 422; data.error_id == 'ERR_ACCESS_POSTURE_DENIES'"
            - "Reservation R2.status remains 'PENDING'"

      - name: bill_issue_requires_all_reservations_terminal
        grounds:
          - state_machines.Bill.DRAFT_to_ISSUED
          - validations[priority=21]
          - entities.Reservation.fields.status
          - entities.Bill.fields.status
        distinguishing_aspect: |
          Bill.DRAFT→ISSUED depends on the state of linked Reservations (all must be in {COMPLETED,
          NO_SHOW}). Entity pair: Bill ↔ Reservation — DIFFERENT from the Reservation↔Tenant pair above.
          When at least one linked Reservation is still IN_USE (or earlier), issuance is blocked.
        test_recipe:
          setup:
            - "Create Tenant T1, Reservation R1 linked to DRAFT Bill B1 after CHECK_IN (R1.status=IN_USE, R1.bill_id=B1.id)"
            - "Do NOT check out R1"
          trigger:
            - "BillingOfficer: POST /bills/B1/issue"
          assert:
            - "HTTP 422; data.error_id == 'ERR_BILL_HAS_OPEN_RESERVATIONS'"
            - "Bill B1.status remains 'DRAFT'"
