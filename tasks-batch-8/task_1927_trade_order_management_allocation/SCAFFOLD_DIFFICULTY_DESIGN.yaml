            - { call: "POST /trading/orders/${o1}/compliance-check", as: ComplianceOfficer }
            - { call: "POST /trading/blocks", payload: { security_id: "${sec}", side: BUY }, as: Trader, captures: { blk: $.data.id } }
            - { call: "POST /trading/blocks/${blk}/orders", payload: { order_id: "${o1}" }, as: Trader }
            - { call: "POST /trading/blocks/${blk}/route", payload: { broker_id: "${brk}" }, as: Trader }
            - { call: "POST /trading/blocks/${blk}/fills", payload: { fill_qty: 100, fill_price_cents: 2000, executed_at: "2026-08-01T09:00:00Z" }, as: ExecutionDesk }
            - { call: "GET /trading/blocks/${blk}", as: Trader, captures: { blk_v: $.data.version } }
            - { call: "POST /trading/blocks/${blk}/allocation-plans", payload: { method: PRO_RATA, expected_block_version: "${blk_v}" }, as: Trader, as_user_id: "trader-1", captures: { plan: $.data.id } }
            - { call: "POST /trading/allocation-plans/${plan}/propose", as: Trader }
            - { call: "POST /trading/allocation-plans/${plan}/approve", as: ComplianceOfficer, as_user_id: "co-1" }
          trigger:
            - { call: "POST /trading/allocation-plans/${plan}/post", as: Trader, captures: { pst: $.data.status } }
            - { call: "GET /trading/commission-budgets/${b1}", as: Trader, captures: { bst: $.data.status, bacc: $.data.accrued_commission_cents } }
          assert:
            - "Post succeeds: AllocationPlan.${plan}.status == POSTED"
            - "CommissionBudget.${b1}: accrued_commission_cents == 1000 == budget_amount_cents and status == EXHAUSTED (equality allowed, exhaustion at =="

      - name: propose_empty_batch_boundary
        grounds:
          - validations[priority=11]
          - state_machines.AllocationPlan.DRAFT_to_PROPOSED
        distinguishing_aspect: |
          Empty-set boundary on the covered-fill collection via the propose
          endpoint: with allocated_through_seq == max fill_seq the batch is
          EMPTY and propose is rejected with ERR_NOTHING_TO_ALLOCATE — a
          zero-count edge on a different metric (fill set cardinality, not
          commission cents) and a different endpoint than the budget boundary.
        test_recipe:
          setup:
            - "Account A1 budget 100000; block order 100, fill 100@1000 -> FILLED; plan1 proposed/approved/posted (allocated_through_seq == 1 == max fill_seq)"
            - "Plan2 created (covered_from_seq == 1); no new fills recorded"
          setup_api_calls:
            - { call: "POST /trading/accounts", payload: { account_code: "A1", display_name: "A1", account_type: DISCRETIONARY, custodian_name: "CUSTO" }, as: DeskAdmin, captures: { a1: $.data.id } }
            - { call: "POST /trading/securities", payload: { ticker: "ACME", asset_class: EQUITY, lot_size: 1, reference_price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /trading/brokers", payload: { broker_code: "BRK1", display_name: "B1", commission_rate_bp: 50, supported_asset_classes: [EQUITY] }, as: DeskAdmin, captures: { brk: $.data.id } }
            - { call: "POST /trading/accounts/${a1}/commission-budgets", payload: { period_start: "2026-01-01", period_end: "2027-01-01", budget_amount_cents: 100000 }, as: DeskAdmin }
            - { call: "POST /trading/orders", payload: { account_id: "${a1}", security_id: "${sec}", side: BUY, order_qty: 100, order_type: MARKET }, as: Trader, captures: { o1: $.data.id } }
            - { call: "POST /trading/orders/${o1}/compliance-check", as: ComplianceOfficer }
            - { call: "POST /trading/blocks", payload: { security_id: "${sec}", side: BUY }, as: Trader, captures: { blk: $.data.id } }
            - { call: "POST /trading/blocks/${blk}/orders", payload: { order_id: "${o1}" }, as: Trader }
            - { call: "POST /trading/blocks/${blk}/route", payload: { broker_id: "${brk}" }, as: Trader }
            - { call: "POST /trading/blocks/${blk}/fills", payload: { fill_qty: 100, fill_price_cents: 1000, executed_at: "2026-08-01T09:00:00Z" }, as: ExecutionDesk }
            - { call: "GET /trading/blocks/${blk}", as: Trader, captures: { blk_v: $.data.version } }
            - { call: "POST /trading/blocks/${blk}/allocation-plans", payload: { method: PRO_RATA, expected_block_version: "${blk_v}" }, as: Trader, as_user_id: "trader-1", captures: { p1: $.data.id } }
            - { call: "POST /trading/allocation-plans/${p1}/propose", as: Trader }
            - { call: "POST /trading/allocation-plans/${p1}/approve", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /trading/allocation-plans/${p1}/post", as: Trader }
            - { call: "GET /trading/blocks/${blk}", as: Trader, captures: { blk_v2: $.data.version } }
            - { call: "POST /trading/blocks/${blk}/allocation-plans", payload: { method: PRO_RATA, expected_block_version: "${blk_v2}" }, as: Trader, as_user_id: "trader-1", captures: { p2: $.data.id } }
          trigger:
            - { call: "POST /trading/allocation-plans/${p2}/propose", as: Trader, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOTHING_TO_ALLOCATE (zero fills with fill_seq > covered_from_seq 1)"
            - "AllocationPlan.${p2} remains DRAFT with covered_to_seq null"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: compliance_check_requires_security_active
        grounds:
          - state_machines.Order.PENDING_COMPLIANCE_to_APPROVED
          - entities.Security.fields.status
        distinguishing_aspect: |
          Entity pair Order -> Security: the order's compliance transition is
          legal only while the referenced Security is ACTIVE; HALTED blocks it
          with ERR_SECURITY_HALTED and resuming re-enables the identical request.
        test_recipe:
          setup:
            - "Account A1 ACTIVE; security ACTIVE then HALTED; order 100 BUY PENDING_COMPLIANCE"
          setup_api_calls:
            - { call: "POST /trading/accounts", payload: { account_code: "A1", display_name: "A1", account_type: DISCRETIONARY, custodian_name: "CUSTO" }, as: DeskAdmin, captures: { a1: $.data.id } }
            - { call: "POST /trading/securities", payload: { ticker: "ACME", asset_class: EQUITY, lot_size: 1, reference_price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /trading/orders", payload: { account_id: "${a1}", security_id: "${sec}", side: BUY, order_qty: 100, order_type: MARKET }, as: Trader, captures: { o1: $.data.id } }
            - { call: "POST /trading/securities/${sec}/status", payload: { to_status: HALTED }, as: DeskAdmin }
          trigger:
            - { call: "POST /trading/orders/${o1}/compliance-check", as: ComplianceOfficer, captures: { err: $.data.error_id } }
            - { call: "POST /trading/securities/${sec}/status", payload: { to_status: ACTIVE }, as: DeskAdmin }
            - { call: "POST /trading/orders/${o1}/compliance-check", as: ComplianceOfficer, captures: { st: $.data.status } }
          assert:
            - "While Security HALTED: error_id == ERR_SECURITY_HALTED, Order stays PENDING_COMPLIANCE"
            - "After resume to ACTIVE: same request succeeds, Order.${o1}.status == APPROVED"

      - name: block_route_requires_broker_active
        grounds:
          - state_machines.BlockOrder.OPEN_to_WORKING
          - entities.Broker.fields.status
        distinguishing_aspect: |
          Entity pair BlockOrder -> Broker (different pair than Order ->
          Security): routing is legal only while the target Broker is ACTIVE;
          SUSPENDED rejects with ERR_BROKER_SUSPENDED even though the block
          itself is in the correct from-state OPEN.
        test_recipe:
          setup:
            - "Account A1; security ACTIVE; broker created then SUSPENDED; block OPEN with one APPROVED order attached"
          setup_api_calls:
            - { call: "POST /trading/accounts", payload: { account_code: "A1", display_name: "A1", account_type: DISCRETIONARY, custodian_name: "CUSTO" }, as: DeskAdmin, captures: { a1: $.data.id } }
            - { call: "POST /trading/securities", payload: { ticker: "ACME", asset_class: EQUITY, lot_size: 1, reference_price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /trading/brokers", payload: { broker_code: "BRK1", display_name: "B1", commission_rate_bp: 50, supported_asset_classes: [EQUITY] }, as: DeskAdmin, captures: { brk: $.data.id } }
            - { call: "POST /trading/brokers/${brk}/status", payload: { to_status: SUSPENDED }, as: DeskAdmin }
            - { call: "POST /trading/orders", payload: { account_id: "${a1}", security_id: "${sec}", side: BUY, order_qty: 100, order_type: MARKET }, as: Trader, captures: { o1: $.data.id } }
            - { call: "POST /trading/orders/${o1}/compliance-check", as: ComplianceOfficer }
            - { call: "POST /trading/blocks", payload: { security_id: "${sec}", side: BUY }, as: Trader, captures: { blk: $.data.id } }
            - { call: "POST /trading/blocks/${blk}/orders", payload: { order_id: "${o1}" }, as: Trader }
          trigger:
            - { call: "POST /trading/blocks/${blk}/route", payload: { broker_id: "${brk}" }, as: Trader, captures: { err: $.data.error_id } }
            - { call: "POST /trading/brokers/${brk}/status", payload: { to_status: ACTIVE }, as: DeskAdmin }
            - { call: "POST /trading/blocks/${blk}/route", payload: { broker_id: "${brk}" }, as: Trader, captures: { st: $.data.status } }
          assert:
            - "While Broker SUSPENDED: error_id == ERR_BROKER_SUSPENDED, BlockOrder stays OPEN"
            - "After resume: route succeeds, BlockOrder.${blk}.status == WORKING"

  - rule_id: resource_temporal_overlap
    instances:
      - name: budget_half_open_period_overlap
        grounds:
          - validations[priority=9]
          - entities.CommissionBudget.fields.period_start
          - entities.CommissionBudget.fields.period_end
        distinguishing_aspect: |
          Half-open interval semantics on CommissionBudget: [period_start,
          period_end) — adjacency (new start == existing end) is ALLOWED while
          any strict interior intersection is rejected; resource = the account's
          budget timeline.
        test_recipe:
          setup:
            - "Account A1; existing budget [2026-01-01, 2026-04-01)"
          setup_api_calls:
            - { call: "POST /trading/accounts", payload: { account_code: "A1", display_name: "A1", account_type: DISCRETIONARY, custodian_name: "CUSTO" }, as: DeskAdmin, captures: { a1: $.data.id } }
            - { call: "POST /trading/accounts/${a1}/commission-budgets", payload: { period_start: "2026-01-01", period_end: "2026-04-01", budget_amount_cents: 100000 }, as: DeskAdmin, captures: { b1: $.data.id } }
            - { call: "POST /trading/accounts/${a1}/commission-budgets", payload: { period_start: "2026-04-01", period_end: "2026-07-01", budget_amount_cents: 100000 }, as: DeskAdmin, captures: { b2: $.data.id } }
          trigger:
            - { call: "POST /trading/accounts/${a1}/commission-budgets", payload: { period_start: "2026-03-31", period_end: "2026-06-01", budget_amount_cents: 50000 }, as: DeskAdmin, captures: { err: $.data.error_id } }
          assert:
            - "Adjacent budget [2026-04-01, 2026-07-01) succeeded (201) — half-open end excludes the boundary day"
            - "Overlapping budget [2026-03-31, 2026-06-01): error_id == ERR_BUDGET_PERIOD_OVERLAP (intersects [2026-01-01, 2026-04-01))"

      - name: restriction_closed_window_overlap
        grounds:
          - validations[priority=9]
          - state_machines.Restriction.DRAFT_to_ACTIVE
          - entities.Restriction.fields.effective_to
        distinguishing_aspect: |
          Closed-interval semantics on Restriction (different resource,
          different geometry than the budget's half-open periods): two same-key
          ACTIVE restrictions whose windows merely TOUCH at one endpoint
          ([...08-31T23:59:59Z] vs [08-31T23:59:59Z...]) DO conflict at
          activation, while a window starting the next second is allowed.
        test_recipe:
          setup:
            - "Security exists; ACTIVE restriction R1 key (null account, sec, PROHIBITED, BUY) window [2026-08-01T00:00:00Z, 2026-08-31T23:59:59Z]"
            - "DRAFT R2 same key window [2026-08-31T23:59:59Z, 2026-09-30T23:59:59Z]; DRAFT R3 same key window [2026-09-01T00:00:00Z, 2026-09-30T23:59:59Z]"
          setup_api_calls:
            - { call: "POST /trading/securities", payload: { ticker: "ACME", asset_class: EQUITY, lot_size: 1, reference_price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /trading/restrictions", payload: { security_id: "${sec}", rule_type: PROHIBITED, side: BUY, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-31T23:59:59Z" }, as: ComplianceOfficer, captures: { r1: $.data.id } }
            - { call: "POST /trading/restrictions/${r1}/activate", as: ComplianceOfficer }
            - { call: "POST /trading/restrictions", payload: { security_id: "${sec}", rule_type: PROHIBITED, side: BUY, effective_from: "2026-08-31T23:59:59Z", effective_to: "2026-09-30T23:59:59Z" }, as: ComplianceOfficer, captures: { r2: $.data.id } }
            - { call: "POST /trading/restrictions", payload: { security_id: "${sec}", rule_type: PROHIBITED, side: BUY, effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-09-30T23:59:59Z" }, as: ComplianceOfficer, captures: { r3: $.data.id } }
          trigger:
            - { call: "POST /trading/restrictions/${r2}/activate", as: ComplianceOfficer, captures: { err: $.data.error_id } }
            - { call: "POST /trading/restrictions/${r3}/activate", as: ComplianceOfficer, captures: { st: $.data.status } }
          assert:
            - "R2 activate: error_id == ERR_RESTRICTION_WINDOW_OVERLAP (shared endpoint 2026-08-31T23:59:59Z intersects under closed semantics); R2 stays DRAFT"
            - "R3 activate: succeeds, status == ACTIVE (one-second gap is disjoint)"

  - rule_id: compensating_invariant
    instances:
      - name: wrong_qty_correction_conserves_block_quantity
        grounds:
          - state_machines.TradeError.OPEN_to_RESOLVED
          - state_machines.Allocation.ERROR_FLAGGED_to_REVERSED
          - calculations.position_net_qty
        distinguishing_aspect: |
          Conserved quantity = block-level allocated quantity: flag + correct
          (WRONG_QTY) leaves sum(alloc_qty over the block's POSTED lines) ==
          block.filled_qty == 100, because the 70-unit corrected line plus the
          30-unit ERROR-account residual exactly replace the reversed 100-unit
          original.
        test_recipe:
          setup:
            - "Accounts A1 (DISCRETIONARY) and ERR (ERROR), both ACTIVE with budgets 100000; EQUITY security; broker 50bp"
            - "Order 100 BUY filled 100@1000; plan posted -> line L 100@1000 commission 500; L flagged WRONG_QTY (ERROR_FLAGGED)"
          setup_api_calls:
            - { call: "POST /trading/accounts", payload: { account_code: "A1", display_name: "A1", account_type: DISCRETIONARY, custodian_name: "CUSTO" }, as: DeskAdmin, captures: { a1: $.data.id } }
            - { call: "POST /trading/accounts", payload: { account_code: "ERR", display_name: "Desk Error", account_type: ERROR, custodian_name: "CUSTO" }, as: DeskAdmin, captures: { ea: $.data.id } }
            - { call: "POST /trading/securities", payload: { ticker: "ACME", asset_class: EQUITY, lot_size: 1, reference_price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /trading/brokers", payload: { broker_code: "BRK1", display_name: "B1", commission_rate_bp: 50, supported_asset_classes: [EQUITY] }, as: DeskAdmin, captures: { brk: $.data.id } }
            - { call: "POST /trading/accounts/${a1}/commission-budgets", payload: { period_start: "2026-01-01", period_end: "2027-01-01", budget_amount_cents: 100000 }, as: DeskAdmin, captures: { b1: $.data.id } }
            - { call: "POST /trading/accounts/${ea}/commission-budgets", payload: { period_start: "2026-01-01", period_end: "2027-01-01", budget_amount_cents: 100000 }, as: DeskAdmin, captures: { be: $.data.id } }
            - { call: "POST /trading/orders", payload: { account_id: "${a1}", security_id: "${sec}", side: BUY, order_qty: 100, order_type: MARKET }, as: Trader, captures: { o1: $.data.id } }
            - { call: "POST /trading/orders/${o1}/compliance-check", as: ComplianceOfficer }
            - { call: "POST /trading/blocks", payload: { security_id: "${sec}", side: BUY }, as: Trader, captures: { blk: $.data.id } }
            - { call: "POST /trading/blocks/${blk}/orders", payload: { order_id: "${o1}" }, as: Trader }
            - { call: "POST /trading/blocks/${blk}/route", payload: { broker_id: "${brk}" }, as: Trader }
            - { call: "POST /trading/blocks/${blk}/fills", payload: { fill_qty: 100, fill_price_cents: 1000, executed_at: "2026-08-01T09:00:00Z" }, as: ExecutionDesk }
            - { call: "GET /trading/blocks/${blk}", as: Trader, captures: { blk_v: $.data.version } }
            - { call: "POST /trading/blocks/${blk}/allocation-plans", payload: { method: PRO_RATA, expected_block_version: "${blk_v}" }, as: Trader, as_user_id: "trader-1", captures: { plan: $.data.id } }
            - { call: "POST /trading/allocation-plans/${plan}/propose", as: Trader }
            - { call: "POST /trading/allocation-plans/${plan}/approve", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /trading/allocation-plans/${plan}/post", as: Trader }
            - { call: "GET /trading/allocations?plan_id=${plan}", as: SettlementOps, captures: { al: "$.data[0].id" } }
            - { call: "POST /trading/allocations/${al}/flag-error", payload: { error_type: WRONG_QTY, note: "filled qty misbooked" }, as: SettlementOps, captures: { te: $.data.id } }
          trigger:
            - { call: "POST /trading/trade-errors/${te}/correct", payload: { corrected_qty: 70 }, as: DeskAdmin, captures: { te_st: $.data.status } }
            - { call: "GET /trading/allocations/${al}", as: DeskAdmin, captures: { al_st: $.data.status } }
            - { call: "GET /trading/allocations?account_id=${a1}&status=POSTED", as: DeskAdmin, captures: { c1_qty: "$.data[0].alloc_qty", c1_px: "$.data[0].alloc_price_cents" } }
            - { call: "GET /trading/allocations?account_id=${ea}&status=POSTED", as: DeskAdmin, captures: { c2_qty: "$.data[0].alloc_qty", c2_corr: "$.data[0].corrects_allocation_id" } }
            - { call: "GET /trading/positions?account_id=${a1}", as: DeskAdmin, captures: { pos_a1: "$.data[0].net_qty" } }
            - { call: "GET /trading/positions?account_id=${ea}", as: DeskAdmin, captures: { pos_ea: "$.data[0].net_qty" } }
            - { call: "GET /trading/commission-budgets/${b1}", as: DeskAdmin, captures: { b1_acc: $.data.accrued_commission_cents } }
            - { call: "GET /trading/commission-budgets/${be}", as: DeskAdmin, captures: { be_acc: $.data.accrued_commission_cents } }
            - { call: "GET /trading/orders/${o1}", as: DeskAdmin, captures: { o1_st: $.data.status, o1_qty: $.data.allocated_qty } }
          assert:
            - "TradeError.${te}.status == RESOLVED; original Allocation.${al}.status == REVERSED"
            - "Correction lines: A1 POSTED 70@1000; ERROR account POSTED 30 with corrects_allocation_id == ${al}"
            - "INVARIANT: 70 + 30 == 100 == BlockOrder.${blk}.filled_qty (block allocated quantity conserved)"
            - "Positions: A1 net_qty == 70, ERROR net_qty == 30"
            - "Budgets unwound/reaccrued per line: A1 accrued == 350 (500 reversed, 350 posted), ERROR accrued == 150"
            - "Order.${o1}: status == ALLOCATED, allocated_qty == 70"

      - name: wrong_account_correction_conserves_firm_position
        grounds:
          - state_machines.TradeError.OPEN_to_RESOLVED
          - calculations.position_net_qty
          - entities.Position.fields.net_qty
        distinguishing_aspect: |
          Conserved quantity = firm-wide net position per security (different
          conserved quantity than block allocated quantity): flag + correct
          (WRONG_ACCOUNT) moves 100 units from A1 to A2 — Position(A1) 100 -> 0
          and Position(A2) 0 -> 100 — while SUM(net_qty over all accounts for
          the security) stays exactly 100 before and after.
        test_recipe:
          setup:
            - "Accounts A1, A2 ACTIVE with budgets 100000; EQUITY security; broker 50bp"
            - "Order 100 BUY (A1) filled 100@1000; plan posted -> A1 line 100@1000 commission 500; A1 position +100, firm total +100"
            - "Line flagged WRONG_ACCOUNT"
          setup_api_calls:
            - { call: "POST /trading/accounts", payload: { account_code: "A1", display_name: "A1", account_type: DISCRETIONARY, custodian_name: "CUSTO" }, as: DeskAdmin, captures: { a1: $.data.id } }
            - { call: "POST /trading/accounts", payload: { account_code: "A2", display_name: "A2", account_type: DISCRETIONARY, custodian_name: "CUSTO" }, as: DeskAdmin, captures: { a2: $.data.id } }
            - { call: "POST /trading/securities", payload: { ticker: "ACME", asset_class: EQUITY, lot_size: 1, reference_price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /trading/brokers", payload: { broker_code: "BRK1", display_name: "B1", commission_rate_bp: 50, supported_asset_classes: [EQUITY] }, as: DeskAdmin, captures: { brk: $.data.id } }
            - { call: "POST /trading/accounts/${a1}/commission-budgets", payload: { period_start: "2026-01-01", period_end: "2027-01-01", budget_amount_cents: 100000 }, as: DeskAdmin, captures: { b1: $.data.id } }
            - { call: "POST /trading/accounts/${a2}/commission-budgets", payload: { period_start: "2026-01-01", period_end: "2027-01-01", budget_amount_cents: 100000 }, as: DeskAdmin, captures: { b2: $.data.id } }
            - { call: "POST /trading/orders", payload: { account_id: "${a1}", security_id: "${sec}", side: BUY, order_qty: 100, order_type: MARKET }, as: Trader, captures: { o1: $.data.id } }
            - { call: "POST /trading/orders/${o1}/compliance-check", as: ComplianceOfficer }
            - { call: "POST /trading/blocks", payload: { security_id: "${sec}", side: BUY }, as: Trader, captures: { blk: $.data.id } }
            - { call: "POST /trading/blocks/${blk}/orders", payload: { order_id: "${o1}" }, as: Trader }
            - { call: "POST /trading/blocks/${blk}/route", payload: { broker_id: "${brk}" }, as: Trader }
            - { call: "POST /trading/blocks/${blk}/fills", payload: { fill_qty: 100, fill_price_cents: 1000, executed_at: "2026-08-01T09:00:00Z" }, as: ExecutionDesk }
            - { call: "GET /trading/blocks/${blk}", as: Trader, captures: { blk_v: $.data.version } }
            - { call: "POST /trading/blocks/${blk}/allocation-plans", payload: { method: PRO_RATA, expected_block_version: "${blk_v}" }, as: Trader, as_user_id: "trader-1", captures: { plan: $.data.id } }
            - { call: "POST /trading/allocation-plans/${plan}/propose", as: Trader }
            - { call: "POST /trading/allocation-plans/${plan}/approve", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /trading/allocation-plans/${plan}/post", as: Trader }
            - { call: "GET /trading/allocations?plan_id=${plan}", as: SettlementOps, captures: { al: "$.data[0].id" } }
            - { call: "POST /trading/allocations/${al}/flag-error", payload: { error_type: WRONG_ACCOUNT, note: "booked to wrong account" }, as: ComplianceOfficer, captures: { te: $.data.id } }
          trigger:
            - { call: "POST /trading/trade-errors/${te}/correct", payload: { target_account_id: "${a2}" }, as: DeskAdmin, captures: { te_st: $.data.status } }
            - { call: "GET /trading/allocations/${al}", as: DeskAdmin, captures: { al_st: $.data.status } }
            - { call: "GET /trading/allocations?account_id=${a2}&status=POSTED", as: DeskAdmin, captures: { c_qty: "$.data[0].alloc_qty", c_ord: "$.data[0].order_id", c_corr: "$.data[0].corrects_allocation_id" } }
            - { call: "GET /trading/positions?security_id=${sec}", as: DeskAdmin, captures: { p1: "$.data[0].net_qty", p2: "$.data[1].net_qty" } }
            - { call: "GET /trading/commission-budgets/${b1}", as: DeskAdmin, captures: { b1_acc: $.data.accrued_commission_cents } }
            - { call: "GET /trading/commission-budgets/${b2}", as: DeskAdmin, captures: { b2_acc: $.data.accrued_commission_cents } }
            - { call: "GET /trading/orders/${o1}", as: DeskAdmin, captures: { o1_st: $.data.status, o1_qty: $.data.allocated_qty } }
          assert:
            - "TradeError.${te}.status == RESOLVED; Allocation.${al}.status == REVERSED"
            - "Correction line: POSTED, account A2, alloc_qty == 100, order_id == ${o1} (inherits linkage), corrects_allocation_id == ${al}"
            - "INVARIANT: Position(A1) == 0 and Position(A2) == 100; firm-wide sum == 100, identical to pre-correction total"
            - "Commissions move with the line: A1 accrued == 0, A2 accrued == 500"
            - "Order.${o1}: status == ALLOCATED, allocated_qty == 100"
