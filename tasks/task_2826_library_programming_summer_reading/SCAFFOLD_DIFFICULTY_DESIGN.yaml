          - errors[ERR_BRANCH_STAFFING_CAPACITY_EXCEEDED]
          - calculations.branch_overlap_load
        distinguishing_aspect: |
          A second pair only 2 priorities apart, on a different endpoint and with a different flavour:
          both rules are space/staffing constraints on the same confirm call, so a naive implementation
          that evaluates the cheap aggregate first has a very plausible excuse. Program P2 sits in
          SCHEDULED on a HELD (never confirmed) reservation in a second room while the branch's single
          overlapping_program_capacity slot is already spent by the CONFIRMED P1, so priority 26 and
          priority 28 fire together and the answer must be ERR_NO_CONFIRMED_ROOM.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z; one branch with overlapping_program_capacity 1 and two rooms R1 and R2 (min_setup_minutes 15, min_teardown_minutes 15)."
            - "Program P1: ADULT IN_BRANCH 2026-08-12T14:00Z-15:00Z, reservation in R1 13:45Z-15:15Z CONFIRMED, program CONFIRMED — the branch's only staffing slot is now consumed."
            - "Program P2: ADULT IN_BRANCH 2026-08-12T14:30Z-15:30Z whose public window overlaps P1's, holding a reservation in R2 (14:15Z-15:45Z) that was created but deliberately NOT confirmed, so P2 reached SCHEDULED with no CONFIRMED room."
            - "Both programs use supply_units_per_attendee 0 so no inventory or budget rule can fire first."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramManager
            - call: "POST /library/branches"
              payload: { name: "Central Library", branch_code: "CEN", overlapping_program_capacity: 1, per_program_fee_cap_cents: 150000 }
              as: ProgramManager
              captures: { br: $.data.id }
            - call: "POST /library/branches/${br}/rooms"
              payload: { room_name: "Room One", capacity_seats: 40, min_setup_minutes: 15, min_teardown_minutes: 15 }
              as: ProgramManager
              captures: { r1: $.data.id }
            - call: "POST /library/branches/${br}/rooms"
              payload: { room_name: "Room Two", capacity_seats: 30, min_setup_minutes: 15, min_teardown_minutes: 15 }
              as: ProgramManager
              captures: { r2: $.data.id }
            - call: "POST /library/programs"
              payload: { branch_id: "${br}", title: "Afternoon Book Club", age_group: "ADULT", delivery_mode: "IN_BRANCH", registration_policy: "REGISTRATION", start_utc: "2026-08-12T14:00:00.000Z", end_utc: "2026-08-12T15:00:00.000Z", attendance_target: 20, attendance_cap: 20, supply_sku: "KIT-BOOK", supply_units_per_attendee: 0, materials_budget_cents: 5000, presenter_fee_budget_cents: 0 }
              as: ProgramCoordinator
              captures: { p1: $.data.id, p1_v: $.data.version }
            - call: "POST /library/programs/${p1}/reservations"
              payload: { room_id: "${r1}", start_utc: "2026-08-12T13:45:00.000Z", end_utc: "2026-08-12T15:15:00.000Z", setup_minutes: 15, teardown_minutes: 15, expected_program_version: "${p1_v}" }
              as: ProgramCoordinator
              captures: { resv1: $.data.id }
            - call: "POST /library/reservations/${resv1}/confirm"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /library/programs/${p1}/schedule"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /library/programs/${p1}/confirm"
              payload: {}
              as: ProgramManager
            - call: "POST /library/programs"
              payload: { branch_id: "${br}", title: "Poetry Salon", age_group: "ADULT", delivery_mode: "IN_BRANCH", registration_policy: "REGISTRATION", start_utc: "2026-08-12T14:30:00.000Z", end_utc: "2026-08-12T15:30:00.000Z", attendance_target: 15, attendance_cap: 15, supply_sku: "KIT-POEM", supply_units_per_attendee: 0, materials_budget_cents: 5000, presenter_fee_budget_cents: 0 }
              as: ProgramCoordinator
              captures: { p2: $.data.id, p2_v: $.data.version }
            - call: "POST /library/programs/${p2}/reservations"
              payload: { room_id: "${r2}", start_utc: "2026-08-12T14:15:00.000Z", end_utc: "2026-08-12T15:45:00.000Z", setup_minutes: 15, teardown_minutes: 15, expected_program_version: "${p2_v}" }
              as: ProgramCoordinator
              captures: { resv2: $.data.id }
            - call: "POST /library/programs/${p2}/schedule"
              payload: {}
              as: ProgramCoordinator
          trigger:
            - call: "POST /library/programs/${p2}/confirm"
              payload: {}
              as: ProgramManager
          assert:
            - "HTTP 422 with error_id ERR_NO_CONFIRMED_ROOM"
            - "The response error_id is NOT ERR_BRANCH_STAFFING_CAPACITY_EXCEEDED even though branch_overlap_load would be 2 against a capacity of 1"
            - "Program.${p2}.operational_status == SCHEDULED and confirmed_room_capacity == 0"
            - "Program.${p2}.supply_draw_lines == [] and materials_committed_cents == 0"
            - "RoomReservation.${resv2}.status == HELD (a rejected confirm changes nothing)"
            - "Program.${p1}.operational_status == CONFIRMED and confirmed_room_capacity == 40"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: tier_threshold_grants_at_exactly_sixty_units_and_withholds_at_fifty_nine
        grounds:
          - calculations.participant_progress_ledger
          - entities.IncentiveTier.fields.threshold_units
          - entities.Participant.fields.eligible_tier_index
          - calculations.prize_award_cost
        distinguishing_aspect: |
          Inclusive-threshold boundary on the reading ledger: threshold_units 60 is compared with <=,
          so a reader sitting at exactly 60 units earns the tier while a reader at 59 earns nothing.
          The two readers are driven through the same endpoint in the same request sequence, so an
          implementation using a strict > comparison produces zero awards and a challenge
          prize_committed_cents of 0 instead of 100.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z; one branch holding a local PRIZE lot for sku PRIZE-T1 (unit_cost_cents 100, quantity_procured 10, reuse_pool false, so no surcharge can blur the numbers)."
            - "One OPEN challenge (MINUTES, 2026-06-01..2026-08-31, HIGH_WATER, prize_budget_cents 100000) with exactly one tier: tier_index 1, threshold_units 60, prize_units_per_participant 1."
            - "Two participants at that home branch: AT (to be driven to exactly 60 units) and BELOW (to be driven to 59)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramManager
            - call: "POST /library/branches"
              payload: { name: "Central Library", branch_code: "CEN", overlapping_program_capacity: 2, per_program_fee_cap_cents: 150000 }
              as: ProgramManager
              captures: { br: $.data.id }
            - call: "POST /library/inventory-lots"
              payload: { branch_id: "${br}", category: "PRIZE", sku: "PRIZE-T1", unit_cost_cents: 100, quantity_procured: 10, reuse_pool: false }
              as: ProgramManager
              captures: { lot: $.data.id }
            - call: "POST /library/reading-challenges"
              payload: { name: "Minutes Matter", logging_method: "MINUTES", unit_label: "minute", start_on: "2026-06-01", end_on: "2026-08-31", correction_policy: "HIGH_WATER", prize_budget_cents: 100000 }
              as: ProgramManager
              captures: { ch: $.data.id }
            - call: "POST /library/reading-challenges/${ch}/incentive-tiers"
              payload: { tier_index: 1, threshold_units: 60, prize_sku: "PRIZE-T1", prize_units_per_participant: 1 }
              as: ProgramManager
              captures: { tier: $.data.id }
            - call: "POST /library/reading-challenges/${ch}/open"
              payload: {}
              as: ProgramManager
            - call: "POST /library/participants"
              payload: { challenge_id: "${ch}", home_branch_id: "${br}", display_name: "Reader At", age_band: "AGE_5_11" }
              as: ProgramCoordinator
              captures: { p_at: $.data.id }
            - call: "POST /library/participants"
              payload: { challenge_id: "${ch}", home_branch_id: "${br}", display_name: "Reader Below", age_band: "AGE_5_11" }
              as: ProgramCoordinator
              captures: { p_below: $.data.id }
          trigger:
            - call: "POST /library/participants/${p_at}/log-entries"
              payload: { units: 60, logged_on: "2026-07-15", source: "STAFF_DESK" }
              as: ProgramCoordinator
            - call: "POST /library/participants/${p_below}/log-entries"
              payload: { units: 59, logged_on: "2026-07-15", source: "STAFF_DESK" }
              as: ProgramCoordinator
          assert:
            - "Participant.${p_at}.cumulative_units == 60, eligible_tier_index == 1, awarded_tier_index == 1"
            - "Participant.${p_below}.cumulative_units == 59, eligible_tier_index == 0, awarded_tier_index == 0"
            - "GET /library/tier-awards?participant_id=${p_at} returns exactly 1 award with status RESERVED and award_total_cents 100"
            - "GET /library/tier-awards?participant_id=${p_below} returns 0 awards"
            - "IncentiveTier.${tier}.award_count == 1"
            - "ReadingChallenge.${ch}.prize_committed_cents == 100 and prize_available_cents == 99900"
            - "InventoryLot.${lot}.quantity_reserved == 1 and quantity_available == 9"

      - name: close_out_at_exactly_end_utc_with_zero_attendance_yields_zero_point_zero_rates
        grounds:
          - calculations.program_attendance_attainment
          - validations[priority=48]
          - entities.Program.fields.survey_response_rate_pct
          - entities.Program.fields.no_show_count
        distinguishing_aspect: |
          Two boundaries in one call, both on Program rather than on the reading ledger: the logical
          clock sits at exactly end_utc (priority 48 uses "at or after", so the close-out is admitted
          rather than rejected with ERR_PROGRAM_NOT_YET_ENDED), and gross_attendance is exactly 0, so
          every percentage must be the literal 0.0 instead of a ZeroDivisionError or a null. no_show_count
          is simultaneously the full registered_count of 5.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z; one branch with a 25-seat room (no accessibility features needed)."
            - "One ADULT IN_BRANCH REGISTRATION program 2026-08-12T14:00Z-15:00Z, attendance_target 5, attendance_cap 5, supply_units_per_attendee 0, materials_budget_cents 5000, presenter_fee_budget_cents 0."
            - "A CONFIRMED reservation 13:45Z-15:15Z (confirmed_room_capacity 25), 5 seats registered, program CONFIRMED."
            - "The clock then set to exactly 2026-08-12T15:00:00.000Z — the program's end instant, not one millisecond later."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramManager
            - call: "POST /library/branches"
              payload: { name: "Central Library", branch_code: "CEN", overlapping_program_capacity: 2, per_program_fee_cap_cents: 150000 }
              as: ProgramManager
              captures: { br: $.data.id }
            - call: "POST /library/branches/${br}/rooms"
              payload: { room_name: "Meeting Room", capacity_seats: 25, min_setup_minutes: 15, min_teardown_minutes: 15 }
              as: ProgramManager
              captures: { room: $.data.id }
            - call: "POST /library/programs"
              payload: { branch_id: "${br}", title: "Rainy Night Poetry", age_group: "ADULT", delivery_mode: "IN_BRANCH", registration_policy: "REGISTRATION", start_utc: "2026-08-12T14:00:00.000Z", end_utc: "2026-08-12T15:00:00.000Z", attendance_target: 5, attendance_cap: 5, supply_sku: "KIT-POEM", supply_units_per_attendee: 0, materials_budget_cents: 5000, presenter_fee_budget_cents: 0 }
              as: ProgramCoordinator
              captures: { prog: $.data.id, prog_v: $.data.version }
            - call: "POST /library/programs/${prog}/reservations"
              payload: { room_id: "${room}", start_utc: "2026-08-12T13:45:00.000Z", end_utc: "2026-08-12T15:15:00.000Z", setup_minutes: 15, teardown_minutes: 15, expected_program_version: "${prog_v}" }
              as: ProgramCoordinator
              captures: { resv: $.data.id }
            - call: "POST /library/reservations/${resv}/confirm"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /library/programs/${prog}/schedule"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /library/programs/${prog}/registrations"
              payload: { registrant_reference: "WALKUP-LIST", seats: 5 }
              as: ProgramCoordinator
            - call: "POST /library/programs/${prog}/confirm"
              payload: {}
              as: ProgramManager
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T15:00:00.000Z" }
              as: ProgramManager
          trigger:
            - call: "POST /library/programs/${prog}/close-out"
              payload: { verified_registrant_attendance: 0, drop_in_headcount: 0, surveys_collected: 0 }
              as: ProgramManager
          assert:
            - "The close-out succeeds (the clock at exactly end_utc satisfies priority 48; no ERR_PROGRAM_NOT_YET_ENDED)"
            - "Program.${prog}.operational_status == CLOSED_OUT"
            - "Program.${prog}.gross_attendance == 0"
            - "Program.${prog}.attendance_attainment_funder_pct == 0.0"
            - "Program.${prog}.attendance_attainment_internal_pct == 0.0"
            - "Program.${prog}.survey_response_rate_pct == 0.0"
            - "Program.${prog}.no_show_count == 5 (the whole registered_count)"
            - "Program.${prog}.confirmed_room_capacity == 25"
            - "Program.${prog}.materials_spent_cents == 0 and materials_available_cents == 5000"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: contract_creation_depends_on_presenter_engagement_state_not_its_own
        grounds:
          - validations[priority=16]
          - errors[ERR_PRESENTER_SUSPENDED]
          - entities.Presenter.fields.engagement_status
          - state_machines.Presenter.engagement_status.PROSPECT_to_SUSPENDED
          - endpoints[POST /library/contracts]
        distinguishing_aspect: |
          The blocked entity pair is PresenterContract -> Presenter: nothing about the contract request
          is invalid (both FKs resolve, the program is in DRAFT, the mileage is legal), and the contract
          has no state of its own yet. The write is refused purely because a FLAGGED screening result on
          a completely different endpoint left Presenter.engagement_status == SUSPENDED. No contract row
          may be created, so the presenter's contract list stays empty.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z; one branch; one ADULT IN_BRANCH program in DRAFT (an ADULT program needs no screening at all, so the only thing standing in the way is the presenter's engagement state)."
            - "One presenter that has never held a contract, screened NAME_CHECK and then returned FLAGGED on 2026-08-01, which drives engagement_status PROSPECT -> SUSPENDED and screening_status to PENDING_ADJUDICATION."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramManager
            - call: "POST /library/branches"
              payload: { name: "Central Library", branch_code: "CEN", overlapping_program_capacity: 2, per_program_fee_cap_cents: 150000 }
              as: ProgramManager
              captures: { br: $.data.id }
            - call: "POST /library/programs"
              payload: { branch_id: "${br}", title: "Local History Lecture", age_group: "ADULT", delivery_mode: "IN_BRANCH", registration_policy: "REGISTRATION", start_utc: "2026-08-12T18:00:00.000Z", end_utc: "2026-08-12T19:00:00.000Z", attendance_target: 30, attendance_cap: 30, supply_sku: "KIT-HIST", supply_units_per_attendee: 0, materials_budget_cents: 5000, presenter_fee_budget_cents: 80000 }
              as: ProgramCoordinator
              captures: { prog: $.data.id }
            - call: "POST /library/presenters"
              payload: { legal_name: "Ivo Marek", presenter_type: "INDIVIDUAL", insurance_certificate_expires_on: "2027-06-30", quoted_fee_cents: 70000 }
              as: ProgramCoordinator
              captures: { pres: $.data.id }
            - call: "POST /library/presenters/${pres}/screening-requests"
              payload: { screening_tier: "NAME_CHECK" }
              as: ScreeningOfficer
            - call: "POST /library/presenters/${pres}/screening-results"
              payload: { result: "FLAGGED", decided_on: "2026-08-01" }
              as: ScreeningOfficer
          trigger:
            - call: "POST /library/contracts"
              payload: { presenter_id: "${pres}", program_id: "${prog}", round_trip_miles: 12 }
              as: ProgramCoordinator
          assert:
            - "HTTP 409 with error_id ERR_PRESENTER_SUSPENDED"
            - "GET /library/contracts?presenter_id=${pres} returns total_count 0 — no contract row was created"
            - "Presenter.${pres}.engagement_status == SUSPENDED, screening_decision == FLAGGED, screening_status == PENDING_ADJUDICATION"
            - "Presenter.${pres}.executed_contract_count == 0"
            - "Program.${prog}.compliance_status == UNVERIFIED (the rejected create never moved the compliance dimension) and operational_status == DRAFT"

      - name: log_entry_depends_on_owning_challenge_being_open_not_on_the_participant
        grounds:
          - validations[priority=14]
          - errors[ERR_CHALLENGE_STATE_INVALID]
          - state_machines.ReadingChallenge.PLANNING_to_OPEN
          - entities.ReadingLogEntry
          - entities.Participant.fields.cumulative_units
        distinguishing_aspect: |
          A different pair (ReadingLogEntry -> ReadingChallenge) whose dependency runs through the
          grandparent of the write: enrolling a Participant is legal while the challenge is still
          PLANNING, so the participant exists and is perfectly valid, but posting reading minutes is
          not admitted until the challenge has been opened. The tell is that the failure is a challenge
          state error rather than anything about the participant or the entry payload, and that the
          append-only ledger stays completely empty.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z; one branch with a local PRIZE lot for sku PRIZE-P1."
            - "One challenge (MINUTES, 2026-06-01..2026-08-31, LEDGER_TRUTH, prize_budget_cents 50000) that has a tier_index 1 / threshold 60 tier but was deliberately NEVER opened, so its status is still PLANNING."
            - "One participant enrolled while the challenge is PLANNING (enrolment admits PLANNING or OPEN)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramManager
            - call: "POST /library/branches"
              payload: { name: "Central Library", branch_code: "CEN", overlapping_program_capacity: 2, per_program_fee_cap_cents: 150000 }
              as: ProgramManager
              captures: { br: $.data.id }
            - call: "POST /library/inventory-lots"
              payload: { branch_id: "${br}", category: "PRIZE", sku: "PRIZE-P1", unit_cost_cents: 100, quantity_procured: 10, reuse_pool: false }
              as: ProgramManager
              captures: { lot: $.data.id }
            - call: "POST /library/reading-challenges"
              payload: { name: "Not Yet Open", logging_method: "MINUTES", unit_label: "minute", start_on: "2026-06-01", end_on: "2026-08-31", correction_policy: "LEDGER_TRUTH", prize_budget_cents: 50000 }
              as: ProgramManager
              captures: { ch: $.data.id }
            - call: "POST /library/reading-challenges/${ch}/incentive-tiers"
              payload: { tier_index: 1, threshold_units: 60, prize_sku: "PRIZE-P1", prize_units_per_participant: 1 }
              as: ProgramManager
              captures: { tier: $.data.id }
            - call: "POST /library/participants"
              payload: { challenge_id: "${ch}", home_branch_id: "${br}", display_name: "Eager Reader", age_band: "AGE_5_11" }
              as: ProgramCoordinator
              captures: { p: $.data.id }
          trigger:
            - call: "POST /library/participants/${p}/log-entries"
              payload: { units: 60, logged_on: "2026-07-15", source: "STAFF_DESK" }
              as: ProgramCoordinator
          assert:
            - "HTTP 409 with error_id ERR_CHALLENGE_STATE_INVALID"
            - "GET /library/log-entries?participant_id=${p} returns total_count 0"
            - "Participant.${p}.cumulative_units == 0, entry_count == 0, eligible_tier_index == 0, awarded_tier_index == 0, last_entry_on is null"
            - "ReadingChallenge.${ch}.status == PLANNING and prize_committed_cents == 0"
            - "IncentiveTier.${tier}.award_count == 0 and deferred_count == 0"
            - "InventoryLot.${lot}.quantity_reserved == 0 and quantity_available == 10"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: room_half_open_occupancy_admits_adjacency_and_rejects_one_minute_overlap
        grounds:
          - calculations.room_occupancy_interval
          - validations[priority=25]
          - errors[ERR_ROOM_DOUBLE_BOOKED]
          - entities.RoomReservation.fields.occupancy_start_utc
          - entities.RoomReservation.fields.occupancy_end_utc
        distinguishing_aspect: |
          The room resource uses HALF-OPEN occupancy intervals, so a booking that starts at the exact
          instant the previous booking's occupancy ends is legal. With setup and teardown pinned to 0
          the occupancy interval equals the booked window, which isolates the interval semantics from
          the buffer arithmetic: [14:00, 15:00) and [15:00, 16:00) coexist, while [15:59, 17:00) is
          rejected for a single overlapping minute against the second booking.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z; one branch with a single 30-seat room whose min_setup_minutes and min_teardown_minutes are both 0."
            - "Three ADULT IN_BRANCH programs on 2026-08-12, all left in DRAFT (reservations are admitted in DRAFT), with no accessibility_accommodations so the 30-minute accessible setup floor never applies: P1 14:00Z-15:00Z, P2 15:00Z-16:00Z, P3 16:00Z-17:00Z."
            - "P1 already holds a reservation on that room for exactly 14:00Z-15:00Z with setup_minutes 0 and teardown_minutes 0, i.e. occupancy [14:00, 15:00)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramManager
            - call: "POST /library/branches"
