  - rule_id: priority_pair_validation_conflict
    instances:
      - name: purge_state_vs_safety_conflict
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - state_machines.RetentionBox.STORED_to_DESTROYED
        distinguishing_aspect: "On /purge, a box that is NOT STORED (state, priority 5) AND has an ACTIVE hold (business_safety, priority 6) fails with the state error ERR_BOX_NOT_STORED — state outranks business_safety."
        test_recipe:
          setup:
            - "ACTIVE account; box INGESTED (never shelved -> not STORED); ACTIVE ComplianceHold on the box"
          setup_api_calls:
            - call: "POST /accounts"
              payload: { business_name: "Prio1", compliance_regime: "STANDARD", billing_email: "b@x.com" }
              as: ComplianceOfficer
              captures: { acct_id: $.data.id }
            - call: "POST /locations"
              payload: { account_id: "${acct_id}", label: "Vault", address: "2 Ave" }
              as: AccountManager
              captures: { loc_id: $.data.id }
            - call: "POST /retention-boxes"
              payload: { account_id: "${acct_id}", location_id: "${loc_id}", barcode: "BX-1" }
              as: AccountManager
              captures: { box1: $.data.id }
            - call: "POST /compliance-holds"
              payload: { account_id: "${acct_id}", subject_type: "RETENTION_BOX", subject_id: "${box1}", reason: "LITIGATION_HOLD" }
              as: ComplianceOfficer
