# §1.9 Scaffold Corner Design — breadth walk of references/claim-extraction-guide.md
# against this scaffold's §1.1–§1.7. §1.8 is the depth probe; this file is the breadth probe.
# Every `section:` is one of the guide's nine sections and every `claim_type:` is one of that
# section's table rows. Corners already asserted by a §1.8 instance carry an `excluded_because:`
# stub (no test_recipe). Instance names are unique across BOTH design files.
# Logical clock starts at 2026-08-01T00:00:00Z on a cold server (mandatory startup default).
# The unknown-id probe value used throughout is 00000000-0000-4000-8000-000000000000.

scaffold_corner_design:

  # ==========================================================================
  - section: entities
    instances:
      - name: retailer_creation_applies_every_declared_default_and_envelope
        claim_type: creation
        grounds:
          - entities.Retailer
          - endpoints.POST_/retailers
          - response_envelope.success
        distinguishing_aspect: |
          A retailer created with only the three required inputs must come back
          201 with all six optional policy knobs at their declared defaults
          (STORE_COUNT_BASIS / 1500 / 90 / 30 / 2 / 14), version 1, a bare UUID
          id with no type prefix, and the success envelope's meta block. An
          implementation that leaves the policy fields null passes no downstream
          void-rate, dispute-window or demo-buffer test.
        test_recipe:
          setup:
            - "Empty database, cold clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BrokerAdmin
          trigger:
            - call: "POST /retailers"
              payload: { name: "Bigmart", chain_code: "BIGMART", total_store_count: 1200 }
              as: BrokerAdmin
              captures: { ret: $.data.id }
            - call: "GET /retailers/${ret}"
              payload: {}
              as: BrokerAccountManager
          assert:
            - "POST returns 201 and the body is { meta: { api_request_id, api_request_timestamp }, response_type: \"object\", data: {...} }"
            - "Retailer.${ret}.void_rate_basis_default == STORE_COUNT_BASIS, at_risk_void_rate_bps == 1500, deduction_dispute_window_days == 90"
            - "Retailer.${ret}.demo_changeover_buffer_minutes == 30, max_concurrent_demos == 2, review_blackout_days == 14"
            - "Retailer.${ret}.version == 1, created_at == updated_at, and id is a bare UUID (no \"ret_\" style prefix)"
            - "The GET returns byte-identical field values to the POST body's data object (immediate consistency, no denormalization lag)"

      - name: unknown_ids_on_every_single_resource_read_return_not_found
        claim_type: not_found
        grounds:
          - errors.ERR_RETAILER_NOT_FOUND
          - errors.ERR_PRINCIPAL_NOT_FOUND
          - errors.ERR_AGREEMENT_NOT_FOUND
          - errors.ERR_CONFLICT_RULE_NOT_FOUND
          - errors.ERR_ITEM_NOT_FOUND
          - errors.ERR_REVIEW_NOT_FOUND
          - errors.ERR_PRESENTATION_NOT_FOUND
          - errors.ERR_DEAL_NOT_FOUND
          - errors.ERR_AUTHORIZATION_NOT_FOUND
          - errors.ERR_SNAPSHOT_NOT_FOUND
          - errors.ERR_PROMOTION_NOT_FOUND
          - errors.ERR_DEDUCTION_NOT_FOUND
        distinguishing_aspect: |
          One well-formed but unknown UUID against all twelve single-resource
          reads must produce twelve DISTINCT entity-specific 404 error_ids, not a
          generic ERR_NOT_FOUND. This is the §1.4 priority-4 rung and it is what
          makes later priority tests meaningful.
        test_recipe:
          setup:
            - "Empty database; no entities of any kind exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BrokerAdmin
          trigger:
            - call: "GET /retailers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: BrokerAdmin
              captures: { e1: $.data.error_id }
            - call: "GET /principals/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: BrokerAdmin
              captures: { e2: $.data.error_id }
            - call: "GET /commission-agreements/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: BrokerAdmin
              captures: { e3: $.data.error_id }
            - call: "GET /conflict-rules/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: BrokerAdmin
              captures: { e4: $.data.error_id }
            - call: "GET /items/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: BrokerAdmin
              captures: { e5: $.data.error_id }
            - call: "GET /category-reviews/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: BrokerAdmin
              captures: { e6: $.data.error_id }
            - call: "GET /presentations/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: BrokerAdmin
              captures: { e7: $.data.error_id }
            - call: "GET /slotting-deals/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: BrokerAdmin
              captures: { e8: $.data.error_id }
            - call: "GET /authorizations/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: BrokerAdmin
              captures: { e9: $.data.error_id }
            - call: "GET /distribution-snapshots/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: BrokerAdmin
              captures: { e10: $.data.error_id }
            - call: "GET /promotion-events/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: BrokerAdmin
              captures: { e11: $.data.error_id }
            - call: "GET /deductions/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: BrokerAdmin
              captures: { e12: $.data.error_id }
          assert:
            - "All twelve calls return HTTP 404 with response_type == \"error\""
            - "error_ids in order: ERR_RETAILER_NOT_FOUND, ERR_PRINCIPAL_NOT_FOUND, ERR_AGREEMENT_NOT_FOUND, ERR_CONFLICT_RULE_NOT_FOUND, ERR_ITEM_NOT_FOUND, ERR_REVIEW_NOT_FOUND"
            - "then ERR_PRESENTATION_NOT_FOUND, ERR_DEAL_NOT_FOUND, ERR_AUTHORIZATION_NOT_FOUND, ERR_SNAPSHOT_NOT_FOUND, ERR_PROMOTION_NOT_FOUND, ERR_DEDUCTION_NOT_FOUND"
            - "GET /authorizations/{id}/voids-report with the same unknown id also returns ERR_AUTHORIZATION_NOT_FOUND (404), not an empty report"

      - name: creations_missing_required_input_fields_are_rejected
        claim_type: required_fields
        grounds:
          - endpoints.POST_/retailers.input
          - endpoints.POST_/principals.input
          - endpoints.POST_/items.input
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          Every §1.5 `input:` token without a `?` suffix is mandatory: omitting
          total_store_count, slotting_budget_cents or upc must fail at §1.4
          priority 3 with ERR_INVALID_REQUEST (400) BEFORE any lookup or state
          check runs, and must not create a partial row.
        test_recipe:
          setup:
            - "Empty database; a single principal NWF exists so the items call can reference a real parent."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BrokerAdmin
            - call: "POST /principals"
              payload: { name: "Northwind Foods", code: "NWF", slotting_budget_cents: 20000000 }
              as: BrokerAdmin
              captures: { prin: $.data.id }
          trigger:
            - call: "POST /retailers"
              payload: { name: "Bigmart", chain_code: "BIGMART" }
              as: BrokerAdmin
              captures: { e1: $.data.error_id }
            - call: "POST /principals"
              payload: { name: "Sunglow Frozen", code: "SGF" }
              as: BrokerAdmin
              captures: { e2: $.data.error_id }
            - call: "POST /items"
              payload: { principal_id: "${prin}", description: "Mini Tacos 12ct", case_pack_units: 12, list_price_cents: 2010, unit_cost_cents: 1200 }
              as: BrokerAccountManager
              captures: { e3: $.data.error_id }
            - call: "POST /category-reviews"
              payload: { retailer_id: "00000000-0000-4000-8000-000000000000", category_code: "FROZEN_SNACKS", review_window_start: "2026-09-01", review_window_end: "2026-09-15", new_item_slots: 2 }
              as: RetailerBuyer
              as_user_id: "00000000-0000-4000-8000-000000000000"
              captures: { e4: $.data.error_id }
          assert:
            - "All four calls return 400 ERR_INVALID_REQUEST"
            - "GET /retailers returns total_count 0 and GET /items returns total_count 0 — no partial rows were persisted"
            - "The fourth call proves ordering: the missing submission_deadline (priority 3) is reported even though retailer_id is also unknown (priority 4) and the caller's retailer scope could not match (priority 5)"

      - name: principal_system_and_computed_fields_start_at_declared_values
        claim_type: system_fields
        grounds:
          - entities.Principal.fields.status
          - entities.Principal.fields.slotting_committed_cents
          - entities.Principal.fields.credit_posture
          - endpoints.POST_/principals
        distinguishing_aspect: |
          status, the five money/count aggregates and credit_posture are
          `source: system` / `source: computed` — they are absent from
          POST /principals' `input:` list entirely, so a fresh principal must read
          PROSPECT / 0 / 0 / 0 / 0 / 0 / NORMAL no matter what the caller wants,
          and the id must never leak into a business decision.
        test_recipe:
          setup:
            - "Empty database, clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BrokerAdmin
          trigger:
            - call: "POST /principals"
              payload: { name: "Northwind Foods", code: "NWF", slotting_budget_cents: 20000000 }
              as: BrokerAdmin
              captures: { prin: $.data.id, st: $.data.status }
          assert:
            - "Principal.${prin}.status == PROSPECT (not ACTIVE — activation needs an ACTIVE agreement first)"
            - "slotting_committed_cents == 0, open_slotting_liability_cents == 0, open_deduction_cents == 0, at_risk_authorization_count == 0, liability_ratio_bps == 0"
            - "credit_posture == NORMAL and version == 1"
            - "GET /principals?status=PROSPECT returns this principal; GET /principals?credit_posture=RESTRICTED returns total_count 0"

      - name: item_upc_type_constraints_and_global_uniqueness_rejected
        claim_type: type_constraints
        grounds:
          - entities.Item.fields.upc
          - errors.ERR_UPC_CHECK_DIGIT_INVALID
          - errors.ERR_UPC_DUPLICATE
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          Three distinct failure modes on one field, each at a different §1.4
          rung: an 11-digit upc is a shape error (priority 3,
          ERR_INVALID_REQUEST), a 12-digit upc with a wrong GS1 mod-10 check digit
          is its own 400 (ERR_UPC_CHECK_DIGIT_INVALID), and a correct upc that
          already exists anywhere — even under a different principal — is a
          priority-11 uniqueness conflict (409 ERR_UPC_DUPLICATE).
        test_recipe:
          setup:
            - "Two principals NWF and SGF exist in PROSPECT (item setup does not require activation)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BrokerAdmin
            - call: "POST /principals"
              payload: { name: "Northwind Foods", code: "NWF", slotting_budget_cents: 20000000 }
              as: BrokerAdmin
              captures: { p1: $.data.id }
            - call: "POST /principals"
              payload: { name: "Sunglow Frozen", code: "SGF", slotting_budget_cents: 20000000 }
              as: BrokerAdmin
              captures: { p2: $.data.id }
          trigger:
            - call: "POST /items"
              payload: { principal_id: "${p1}", upc: "01111100000", description: "Short UPC", case_pack_units: 12, list_price_cents: 2010, unit_cost_cents: 1200 }
              as: BrokerAccountManager
              captures: { e1: $.data.error_id }
            - call: "POST /items"
              payload: { principal_id: "${p1}", upc: "011111000002", description: "Bad check digit", case_pack_units: 12, list_price_cents: 2010, unit_cost_cents: 1200 }
              as: BrokerAccountManager
              captures: { e2: $.data.error_id }
            - call: "POST /items"
              payload: { principal_id: "${p1}", upc: "011111000001", description: "Mini Tacos 12ct", case_pack_units: 12, list_price_cents: 2010, unit_cost_cents: 1200 }
              as: BrokerAccountManager
              captures: { itm: $.data.id }
            - call: "POST /items"
              payload: { principal_id: "${p2}", upc: "011111000001", description: "Copycat Tacos", case_pack_units: 12, list_price_cents: 1990, unit_cost_cents: 1100 }
              as: BrokerAccountManager
              captures: { e3: $.data.error_id }
          assert:
            - "Call 1 returns 400 ERR_INVALID_REQUEST — 11 characters is not the declared exactly-12-numeric shape"
            - "Call 2 returns 400 ERR_UPC_CHECK_DIGIT_INVALID — 011111000002 is 12 digits but the GS1 mod-10 digit for 01111100000 is 1"
            - "Call 3 returns 201 with Item.${itm}.catalog_state == INCOMPLETE, catalog_submission_round == 0, catalog_reject_reason == null, gtin14 == null"
            - "Call 4 returns 409 ERR_UPC_DUPLICATE — uniqueness is global across principals, not scoped per principal"
            - "GET /items?upc=011111000001 returns total_count 1"

      - name: presentation_parent_lookups_and_item_ownership_rejected
        claim_type: parent_relationships
        grounds:
          - endpoints.POST_/presentations
          - errors.ERR_REVIEW_NOT_FOUND
          - errors.ERR_PRINCIPAL_NOT_FOUND
          - errors.ERR_ITEM_PRINCIPAL_MISMATCH
        distinguishing_aspect: |
          A presentation has three parents (review, principal, items) and each
          bad reference lands on a different §1.4 rung: unknown review or
          principal at priority 4 (404), while an item that exists but belongs to
          a DIFFERENT principal is a priority-10 referential error
          (422 ERR_ITEM_PRINCIPAL_MISMATCH) — a foreign-key existence check alone
          cannot catch it.
        test_recipe:
          setup:
            - "Retailer BIGMART; principals NWF (with a VALIDATED item I1) and SGF (with a VALIDATED item I2); an OPEN FROZEN_SNACKS review with deadline 2026-08-20."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BrokerAdmin
            - call: "POST /retailers"
              payload: { name: "Bigmart", chain_code: "BIGMART", total_store_count: 1200 }
              as: BrokerAdmin
              captures: { ret: $.data.id }
            - call: "POST /principals"
              payload: { name: "Northwind Foods", code: "NWF", slotting_budget_cents: 20000000 }
              as: BrokerAdmin
              captures: { p1: $.data.id }
            - call: "POST /principals"
              payload: { name: "Sunglow Frozen", code: "SGF", slotting_budget_cents: 20000000 }
              as: BrokerAdmin
              captures: { p2: $.data.id }
            - call: "POST /items"
              payload: { principal_id: "${p1}", upc: "011111000001", description: "Mini Tacos 12ct", case_pack_units: 12, list_price_cents: 2010, unit_cost_cents: 1200 }
              as: BrokerAccountManager
              captures: { i1: $.data.id }
            - call: "POST /items/${i1}/catalog-submissions"
              payload: { gtin14: "00011111000001", dimensions_cm: "20x15x8", gross_weight_g: 900, nutrition_panel_url: "https://cdn.example/n1.pdf", shelf_life_days: 365 }
              as: BrokerAccountManager
            - call: "POST /items/${i1}/catalog-decision"
              payload: { decision: "VALIDATED" }
              as: RetailerBuyer
              as_user_id: "${ret}"
            - call: "POST /items"
              payload: { principal_id: "${p2}", upc: "022222000002", description: "Frozen Empanadas 10ct", case_pack_units: 10, list_price_cents: 2000, unit_cost_cents: 1150 }
              as: BrokerAccountManager
              captures: { i2: $.data.id }
            - call: "POST /items/${i2}/catalog-submissions"
              payload: { gtin14: "00022222000002", dimensions_cm: "22x16x8", gross_weight_g: 950, nutrition_panel_url: "https://cdn.example/n2.pdf", shelf_life_days: 300 }
              as: BrokerAccountManager
            - call: "POST /items/${i2}/catalog-decision"
              payload: { decision: "VALIDATED" }
              as: RetailerBuyer
              as_user_id: "${ret}"
            - call: "POST /category-reviews"
              payload: { retailer_id: "${ret}", category_code: "FROZEN_SNACKS", review_window_start: "2026-09-01", review_window_end: "2026-09-15", submission_deadline: "2026-08-20T00:00:00Z", new_item_slots: 2 }
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { rev: $.data.id }
            - call: "POST /category-reviews/${rev}/open"
              payload: {}
              as: RetailerBuyer
              as_user_id: "${ret}"
          trigger:
            - call: "POST /presentations"
              payload: { review_id: "00000000-0000-4000-8000-000000000000", principal_id: "${p1}", item_ids: ["${i1}"] }
              as: BrokerAccountManager
              captures: { e1: $.data.error_id }
            - call: "POST /presentations"
              payload: { review_id: "${rev}", principal_id: "00000000-0000-4000-8000-000000000000", item_ids: ["${i1}"] }
              as: BrokerAccountManager
              captures: { e2: $.data.error_id }
            - call: "POST /presentations"
              payload: { review_id: "${rev}", principal_id: "${p1}", item_ids: ["${i1}", "${i2}"] }
              as: BrokerAccountManager
              captures: { e3: $.data.error_id }
            - call: "POST /presentations"
              payload: { review_id: "${rev}", principal_id: "${p1}", item_ids: ["${i1}"] }
              as: BrokerAccountManager
              captures: { pres: $.data.id }
            - call: "POST /presentations"
              payload: { review_id: "${rev}", principal_id: "${p1}", item_ids: ["${i1}"] }
              as: BrokerAccountManager
              captures: { e4: $.data.error_id }
          assert:
            - "Call 1 returns 404 ERR_REVIEW_NOT_FOUND; call 2 returns 404 ERR_PRINCIPAL_NOT_FOUND"
            - "Call 3 returns 422 ERR_ITEM_PRINCIPAL_MISMATCH — ${i2} exists but belongs to SGF while the presentation is NWF's"
            - "Call 4 returns 201 with Presentation.${pres}.status == DRAFT and authorized_item_count == 0"
            - "Call 5 returns 409 ERR_PRESENTATION_DUPLICATE — one presentation per (review_id, principal_id)"
            - "GET /presentations?review_id=${rev} returns total_count 1"

      - name: retailer_listing_paginates_and_filters_deterministically
        claim_type: listing
        grounds:
          - endpoints.GET_/retailers
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          List reads must carry limit/offset/total_count/has_more, default to
          limit 10 / offset 0, and order by created_at ASC — never by id. With
          three retailers created in a known order, limit 2 must return the first
          two in creation order with has_more true, and offset 2 must return the
          third with has_more false.
        test_recipe:
          setup:
            - "Three retailers created in this order: BIGMART, MIDCO, TINYMART."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BrokerAdmin
            - call: "POST /retailers"
              payload: { name: "Bigmart", chain_code: "BIGMART", total_store_count: 1200 }
              as: BrokerAdmin
              captures: { r1: $.data.id }
            - call: "POST /retailers"
              payload: { name: "Midco Markets", chain_code: "MIDCO", total_store_count: 400 }
              as: BrokerAdmin
              captures: { r2: $.data.id }
            - call: "POST /retailers"
              payload: { name: "Tinymart", chain_code: "TINYMART", total_store_count: 40 }
              as: BrokerAdmin
              captures: { r3: $.data.id }
          trigger:
            - call: "GET /retailers"
              payload: { limit: 2, offset: 0 }
              as: BrokerAccountManager
              captures: { first: "$.data[0].id", second: "$.data[1].id" }
            - call: "GET /retailers"
              payload: { limit: 2, offset: 2 }
              as: BrokerAccountManager
              captures: { third: "$.data[0].id" }
            - call: "GET /retailers"
              payload: { chain_code: "MIDCO" }
              as: BrokerAccountManager
              captures: { only: "$.data[0].id" }
          assert:
            - "Call 1: response_type == \"array\", total_count == 3, has_more == true, limit == 2, offset == 0, data length 2, and ${first} == ${r1}, ${second} == ${r2} (created_at ASC)"
            - "Call 2: total_count == 3, has_more == false, data length 1, ${third} == ${r3}"
            - "Call 3: total_count == 1 and ${only} == ${r2} — the chain_code filter is applied before pagination"
            - "A call with no limit/offset returns limit 10 and offset 0 in the envelope"

      - name: conflict_rule_is_an_unordered_pair_junction_rejecting_self_and_duplicates
        claim_type: graph
        grounds:
          - entities.ConflictRule
          - errors.ERR_CONFLICT_RULE_SELF
          - errors.ERR_CONFLICT_RULE_DUPLICATE
          - errors.ERR_INVALID_REQUEST
          - endpoints.GET_/conflict-rules
        distinguishing_aspect: |
          ConflictRule is the many-to-many junction that makes the entity
          topology a graph, and its identity is an UNORDERED pair: creating
          {A,B} then {B,A} for the same category/scope/retailer is the same edge
          (409 ERR_CONFLICT_RULE_DUPLICATE), a self-loop is rejected outright,
          and the scope enum drives a conditional field requirement — NATIONAL
          must omit retailer_id while RETAILER_LEVEL must supply it.
        test_recipe:
          setup:
            - "Retailer BIGMART and principals NWF and SGF exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BrokerAdmin
            - call: "POST /retailers"
              payload: { name: "Bigmart", chain_code: "BIGMART", total_store_count: 1200 }
              as: BrokerAdmin
              captures: { ret: $.data.id }
            - call: "POST /principals"
              payload: { name: "Northwind Foods", code: "NWF", slotting_budget_cents: 20000000 }
              as: BrokerAdmin
              captures: { p1: $.data.id }
            - call: "POST /principals"
              payload: { name: "Sunglow Frozen", code: "SGF", slotting_budget_cents: 20000000 }
              as: BrokerAdmin
              captures: { p2: $.data.id }
          trigger:
            - call: "POST /conflict-rules"
              payload: { category_code: "FROZEN_SNACKS", principal_a_id: "${p1}", principal_b_id: "${p1}", scope: "NATIONAL" }
              as: BrokerAdmin
              captures: { e1: $.data.error_id }
            - call: "POST /conflict-rules"
              payload: { category_code: "FROZEN_SNACKS", principal_a_id: "${p1}", principal_b_id: "${p2}", scope: "NATIONAL", retailer_id: "${ret}" }
              as: BrokerAdmin
              captures: { e2: $.data.error_id }
            - call: "POST /conflict-rules"
              payload: { category_code: "FROZEN_SNACKS", principal_a_id: "${p1}", principal_b_id: "${p2}", scope: "NATIONAL" }
              as: BrokerAdmin
              captures: { cr: $.data.id }
            - call: "POST /conflict-rules"
              payload: { category_code: "FROZEN_SNACKS", principal_a_id: "${p2}", principal_b_id: "${p1}", scope: "NATIONAL" }
              as: BrokerAdmin
              captures: { e3: $.data.error_id }
            - call: "GET /conflict-rules"
              payload: { principal_b_id: "${p2}", category_code: "FROZEN_SNACKS" }
              as: BrokerAccountManager
              captures: { found: "$.data[0].id" }
          assert:
            - "Call 1 returns 409 ERR_CONFLICT_RULE_SELF"
            - "Call 2 returns 400 ERR_INVALID_REQUEST — a NATIONAL rule must not carry retailer_id"
            - "Call 3 returns 201 with ConflictRule.${cr}.status == ACTIVE, waiver_reason == null, retailer_id == null"
            - "Call 4 returns 409 ERR_CONFLICT_RULE_DUPLICATE — {SGF, NWF} is the same unordered pair as {NWF, SGF}"
            - "Call 5 returns total_count 1 with ${found} == ${cr}, proving both FK directions are reverse-reachable from §1.5"
            - "A RETAILER_LEVEL rule for the same pair and category IS accepted (different scope), and omitting retailer_id on it returns 400 ERR_INVALID_REQUEST"

      - name: distribution_snapshot_ledger_is_immutable
        claim_type: immutability
        grounds:
          - entities.DistributionSnapshot
        excluded_because:
          difficulty_instance: "compensating_invariant / store_counts_conserved_across_reported_basis_posting_and_reversal"
          rationale: "That instance asserts the reversed POSTING keeps its own stored counters, that correction happens by appending a REVERSAL row, and that re-reversing returns ERR_SNAPSHOT_ALREADY_REVERSED — i.e. the whole common_fields:false immutability claim."

  # ==========================================================================
  - section: state_machines
    instances:
      - name: every_entity_starts_in_its_declared_initial_state
        claim_type: initial_state
        grounds:
          - state_machines.Principal.initial_state
          - state_machines.CommissionAgreement.initial_state
          - state_machines.ConflictRule.initial_state
          - state_machines.Item.initial_state
          - state_machines.CategoryReview.initial_state
          - state_machines.Presentation.initial_state
          - state_machines.SlottingDeal.initial_state
          - state_machines.PromotionEvent.initial_state
          - state_machines.Deduction.initial_state
        distinguishing_aspect: |
          Nine machines, nine initial states, and two of them are easy to get
          wrong: a CategoryReview starts SCHEDULED (not OPEN — opening is an
          explicit transition) and a SlottingDeal starts DRAFT (not PROPOSED —
          creating a deal is not making an offer). Deduction starts in a PAIR of
          initial states, OPEN on the settlement dimension and NOT_DISPUTED on
          the dispute dimension.
        test_recipe:
          setup:
            - "Retailer BIGMART; principal NWF; a FROZEN_SNACKS agreement; a conflict-rule partner principal SGF; one item; a review; a presentation; a slotting deal; an authorization is NOT needed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BrokerAdmin
            - call: "POST /retailers"
              payload: { name: "Bigmart", chain_code: "BIGMART", total_store_count: 1200 }
              as: BrokerAdmin
              captures: { ret: $.data.id }
            - call: "POST /principals"
              payload: { name: "Northwind Foods", code: "NWF", slotting_budget_cents: 20000000 }
              as: BrokerAdmin
              captures: { p1: $.data.id }
            - call: "POST /principals"
              payload: { name: "Sunglow Frozen", code: "SGF", slotting_budget_cents: 20000000 }
              as: BrokerAdmin
              captures: { p2: $.data.id }
            - call: "POST /items"
              payload: { principal_id: "${p1}", upc: "011111000001", description: "Mini Tacos 12ct", case_pack_units: 12, list_price_cents: 2010, unit_cost_cents: 1200 }
              as: BrokerAccountManager
              captures: { itm: $.data.id }
          trigger:
            - call: "POST /commission-agreements"
              payload: { principal_id: "${p1}", retailer_id: "${ret}", category_code: "FROZEN_SNACKS", effective_start_date: "2026-01-01", effective_end_date: "2027-01-01", base_commission_bps: 500, tier_threshold_cents: 3000000, tier_commission_bps: 300 }
              as: BrokerAdmin
              captures: { agr: $.data.id, agr_status: $.data.status }
            - call: "POST /conflict-rules"
              payload: { category_code: "FROZEN_SNACKS", principal_a_id: "${p1}", principal_b_id: "${p2}", scope: "NATIONAL" }
              as: BrokerAdmin
              captures: { cr: $.data.id, cr_status: $.data.status }
            - call: "POST /category-reviews"
              payload: { retailer_id: "${ret}", category_code: "FROZEN_SNACKS", review_window_start: "2026-09-01", review_window_end: "2026-09-15", submission_deadline: "2026-08-20T00:00:00Z", new_item_slots: 2 }
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { rev: $.data.id, rev_status: $.data.status }
            - call: "POST /presentations"
              payload: { review_id: "${rev}", principal_id: "${p1}", item_ids: ["${itm}"] }
              as: BrokerAccountManager
              captures: { pres: $.data.id, pres_status: $.data.status }
            - call: "POST /slotting-deals"
              payload: { presentation_id: "${pres}", requested_fee_per_store_cents: 12500, store_count_in_scope: 400, item_count_in_scope: 1, forecast_annual_units: 0, amortization_periods: 6, amortization_method: "FORECAST_STRAIGHT" }
              as: BrokerAccountManager
              captures: { deal: $.data.id, deal_state: $.data.state }
            - call: "POST /deductions"
              payload: { retailer_id: "${ret}", principal_id: "${p1}", reason_code: "SHORTAGE", amount_cents: 90000, deduction_date: "2026-08-01" }
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { ded: $.data.id, ded_settlement: $.data.settlement_state, ded_dispute: $.data.dispute_state }
          assert:
            - "Principal.${p1}.status == PROSPECT; CommissionAgreement.${agr}.status == DRAFT; ConflictRule.${cr}.status == ACTIVE (its initial state is already ACTIVE)"
            - "Item.${itm}.catalog_state == INCOMPLETE; CategoryReview.${rev}.status == SCHEDULED (NOT OPEN)"
            - "Presentation.${pres}.status == DRAFT; SlottingDeal.${deal}.state == DRAFT (NOT PROPOSED) with current_fee_per_store_cents == null and round_index == 0"
            - "Deduction.${ded}.settlement_state == OPEN and dispute_state == NOT_DISPUTED simultaneously, with open_cents == 90000, recovered_cents == 0, conceded_cents == 0"
            - "A PromotionEvent created against an AUTHORIZED authorization starts state == PLANNED with actual_funding_cents == 0 and settled_funding_cents == 0"

      - name: principal_activation_precondition_and_terminated_lockdown_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Principal.PROSPECT_to_ACTIVE
          - state_machines.Principal.ACTIVE_to_TERMINATED
          - state_machines.Principal.terminal_states
          - errors.ERR_PRINCIPAL_HAS_NO_AGREEMENT
          - errors.ERR_INVALID_STATE
          - errors.ERR_PRINCIPAL_TERMINATED
        distinguishing_aspect: |
          Both ends of the Principal lifecycle: PROSPECT→ACTIVE is guarded by the
          existence of an ACTIVE agreement (409 ERR_PRINCIPAL_HAS_NO_AGREEMENT —
          a DRAFT agreement does not count), and TERMINATED is terminal, so every
          later status write, including a repeat of TERMINATED, must fail with
          409 ERR_INVALID_STATE rather than silently succeeding. A TERMINATED
          principal also poisons agreement activation with the distinct
          ERR_PRINCIPAL_TERMINATED, and the termination itself cascades the ACTIVE
          agreement to TERMINATED.
        test_recipe:
          setup:
            - "Retailer BIGMART; principal NWF in PROSPECT with a DRAFT FROZEN_SNACKS agreement A1 (created but not activated) and a second DRAFT agreement A2 for the adjacent window [2027-01-01, 2028-01-01); no authorizations anywhere."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BrokerAdmin
            - call: "POST /retailers"
              payload: { name: "Bigmart", chain_code: "BIGMART", total_store_count: 1200 }
              as: BrokerAdmin
              captures: { ret: $.data.id }
            - call: "POST /principals"
              payload: { name: "Northwind Foods", code: "NWF", slotting_budget_cents: 20000000 }
              as: BrokerAdmin
              captures: { prin: $.data.id }
            - call: "POST /commission-agreements"
              payload: { principal_id: "${prin}", retailer_id: "${ret}", category_code: "FROZEN_SNACKS", effective_start_date: "2026-01-01", effective_end_date: "2027-01-01", base_commission_bps: 500, tier_threshold_cents: 3000000, tier_commission_bps: 300 }
              as: BrokerAdmin
              captures: { agr: $.data.id }
            - call: "POST /commission-agreements"
              payload: { principal_id: "${prin}", retailer_id: "${ret}", category_code: "FROZEN_SNACKS", effective_start_date: "2027-01-01", effective_end_date: "2028-01-01", base_commission_bps: 500, tier_threshold_cents: 3000000, tier_commission_bps: 300 }
              as: BrokerAdmin
              captures: { agr2: $.data.id }
          trigger:
            - call: "POST /principals/${prin}/status"
              payload: { status: "ACTIVE" }
              as: BrokerAdmin
              captures: { e1: $.data.error_id }
            - call: "POST /commission-agreements/${agr}/activate"
              payload: {}
              as: BrokerAdmin
            - call: "POST /principals/${prin}/status"
              payload: { status: "ACTIVE" }
              as: BrokerAdmin
            - call: "POST /principals/${prin}/status"
              payload: { status: "SUSPENDED" }
              as: BrokerAdmin
            - call: "POST /principals/${prin}/status"
              payload: { status: "TERMINATED" }
              as: BrokerAdmin
            - call: "POST /principals/${prin}/status"
              payload: { status: "ACTIVE" }
              as: BrokerAdmin
              captures: { e2: $.data.error_id }
            - call: "POST /principals/${prin}/status"
              payload: { status: "TERMINATED" }
              as: BrokerAdmin
              captures: { e3: $.data.error_id }
            - call: "POST /commission-agreements/${agr2}/activate"
              payload: {}
              as: BrokerAdmin
              captures: { e4: $.data.error_id }
          assert:
            - "Call 1 returns 409 ERR_PRINCIPAL_HAS_NO_AGREEMENT — the agreement exists but is only DRAFT"
            - "After activating the agreement, call 3 succeeds and Principal.${prin}.status == ACTIVE"
            - "Call 4 succeeds (ACTIVE→SUSPENDED) and call 5 succeeds (SUSPENDED→TERMINATED) because no authorization of this principal is in PENDING_SETUP, AUTHORIZED or AT_RISK"
            - "Call 5 also cascades: CommissionAgreement.${agr}.status ACTIVE→TERMINATED, while the DRAFT ${agr2} is untouched"
            - "Call 6 returns 409 ERR_INVALID_STATE and call 7 returns 409 ERR_INVALID_STATE — TERMINATED is terminal, and even the idempotent repeat is refused"
            - "Call 8 returns 409 ERR_PRINCIPAL_TERMINATED — a DRAFT agreement of a TERMINATED principal can never be activated (a distinct error from the ERR_INVALID_STATE of the status writes)"
            - "Principal.${prin}.version increments by exactly 1 per successful status write and does not move on the three rejected ones"

      - name: second_presentation_submit_is_rejected_as_invalid_state
        claim_type: idempotency
        grounds:
          - state_machines.Presentation.DRAFT_to_SUBMITTED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: |
          Action endpoints are not idempotent by design: DRAFT→SUBMITTED exists
          but SUBMITTED→SUBMITTED does not, so a duplicate submit must fail with
          409 ERR_INVALID_STATE and must not double-count
