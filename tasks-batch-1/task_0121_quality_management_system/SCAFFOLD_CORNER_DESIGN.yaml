        excluded_because:
          difficulty_instance: resource_temporal_overlap / auditor_buffered_window_double_booking_rejected
          rationale: "ERR_AUDITOR_DOUBLE_BOOKED is the subject of the named §1.8 overlap instance."

      - name: err_audit_has_open_findings_triggerable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_AUDIT_HAS_OPEN_FINDINGS]
        excluded_because:
          difficulty_instance: boundary_precision_check / audit_close_with_zero_open_findings_succeeds
          rationale: "ERR_AUDIT_HAS_OPEN_FINDINGS guards the boundary asserted by the named §1.8 instance; fired directly by the §1.9 RBAC/endpoint chains that close an audit with an open finding."

      - name: err_finding_ncr_open_triggerable
        claim_type: violation_to_error
        grounds:
