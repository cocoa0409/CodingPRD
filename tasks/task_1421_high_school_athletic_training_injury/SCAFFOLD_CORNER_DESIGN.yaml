            - { call: "POST /staff", payload: { full_name: "Nurse Nia", role_type: SCHOOL_NURSE }, as: SystemAdmin, captures: { nr1: $.data.id } }
            - { call: "POST /athletes", payload: { full_name: "Athlete A", date_of_birth: "2009-05-01", grade: 11, sex: M, primary_sport: BASEBALL, team_level: VARSITY, guardian_name: "Guard A", guardian_user_id: "g-9404", guardian_email: "ga@x.com" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { a1: $.data.id } }
