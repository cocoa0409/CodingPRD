  - rule_id: transitive_cascade
    instances:
      - name: batch_quarantine_item_orders_cascade
        grounds:
          - state_machines.FoodBatch.INSPECTING_to_QUARANTINED
          - state_machines.MenuItem.CONFIRMED_to_UNAVAILABLE
          - state_machines.MealOrder
        distinguishing_aspect: |
          Depth-3 cascade from routine re-inspection failing on an ACCEPTED,
          already-allocated batch: begin-inspection (ACCEPTED -> INSPECTING) then
          record-inspection(FAILED) quarantines B -> allocated MenuItem I
          (CONFIRMED) goes UNAVAILABLE (link 1 caused by the inspection); the item
          transition itself releases RESERVED MealOrder O (substitution_allowed
          false) decrementing MealService.reserved_count (link 2); and debits
          MenuDay.committed_servings (link 3).
        test_recipe:
          setup:
            - "Clock 2026-08-10T10:30:00Z; site S; batch B (PURCHASE, 20) ACCEPTED; menu day D SERVING; item I planned 20, allocated 20 from B, CONFIRMED; DINE_IN service OPEN capacity 5; guest G order O for I quantity 1 substitution_allowed false; MenuDay.committed_servings == 20, service.reserved_count == 1."
          setup_api_calls:
            - call: "POST /kitchen/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /kitchen/sites"
              payload: { name: "Cascade Kitchen", dine_in_capacity: 50, togo_capacity_per_window: 20, delivery_radius_km: 8 }
              as: ProgramAdmin
