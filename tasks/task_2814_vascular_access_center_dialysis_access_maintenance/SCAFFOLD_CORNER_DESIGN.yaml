  - section: errors
    instances:
      - name: unknown_ids_across_every_collection_return_their_own_not_found_code
        claim_type: error_triggerable
        grounds:
          - errors.ERR_FACILITY_NOT_FOUND
          - errors.ERR_PATIENT_NOT_FOUND
          - errors.ERR_ACCESS_NOT_FOUND
          - errors.ERR_DEVICE_USAGE_NOT_FOUND
          - validations.priority_3_path_404
        distinguishing_aspect: "Every collection has its OWN 404 error_id rather than a shared ERR_NOT_FOUND, and a well-formed but absent UUID is a 404 at priority 3, never a 422 ERR_INVALID_REQUEST and never a 500."
        test_recipe:
          setup:
            - "an empty database — no rows of any kind are needed to trigger a path 404"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CenterAdmin
          trigger:
            - call: "GET /dialysis-facilities/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: CenterAdmin
            - call: "GET /patients/22222222-2222-4222-8222-222222222222"
              payload: {}
              as: CenterAdmin
            - call: "GET /clinicians/33333333-3333-4333-8333-333333333333"
              payload: {}
              as: CenterAdmin
            - call: "GET /procedure-rooms/44444444-4444-4444-8444-444444444444"
              payload: {}
              as: CenterAdmin
            - call: "GET /device-lots/55555555-5555-4555-8555-555555555555"
              payload: {}
              as: CenterAdmin
            - call: "GET /vascular-accesses/66666666-6666-4666-8666-666666666666"
              payload: {}
              as: CenterAdmin
            - call: "GET /surveillance-readings/77777777-7777-4777-8777-777777777777"
              payload: {}
              as: CenterAdmin
            - call: "GET /referrals/88888888-8888-4888-8888-888888888888"
              payload: {}
              as: CenterAdmin
            - call: "GET /procedures/99999999-9999-4999-8999-999999999999"
              payload: {}
              as: CenterAdmin
            - call: "GET /device-usages/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
              payload: {}
