        distinguishing_aspect: "Setting the clock to 2026-07-31T23:59:59Z (before the 2026-08-01T00:00:00Z startup default) returns ERR_CLOCK_NOT_MONOTONIC 422, while setting it to exactly 2026-08-01T00:00:00Z succeeds because the rule is >=, and the successful response reports previous_utc equal to current_utc."
        test_recipe:
          setup:
            - "Empty database; the clock still holds its startup default."
          setup_api_calls: []
          trigger:
            - call: "POST /lsl/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-31T23:59:59Z" }
