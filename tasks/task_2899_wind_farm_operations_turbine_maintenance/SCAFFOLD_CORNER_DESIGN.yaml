              as: ReliabilityEngineer
              as_user_id: "rel-1"
            - call: "POST /wind-ops/work-orders/${wo_engineer}/submit"
              payload: {}
              as: MaintenancePlanner
              as_user_id: "planner-1"
            - call: "POST /wind-ops/turbines/${t_id}/blade-damages"
              payload: { inspection_method: "DRONE", blade_position: "A", inspected_at: "2026-08-01T02:00:00Z", damage_category: 2, damage_type: "LEADING_EDGE_EROSION", chord_position_pct: 30.0, damage_length_mm: 400, exposed_area_cm2: 90.0 }
              as: ReliabilityEngineer
              as_user_id: "rel-1"
