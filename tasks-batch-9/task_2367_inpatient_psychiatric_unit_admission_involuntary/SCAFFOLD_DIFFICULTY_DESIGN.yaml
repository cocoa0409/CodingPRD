  - rule_id: compensating_invariant
    instances:
      - name: bed_occupancy_conserved_across_place_and_discharge
        grounds:
          - calculations.unit_posture_and_effective_availability
          - entities.Unit.fields.occupied_bed_count
          - entities.Unit.fields.raw_available_bed_count
          - entities.Bed.fields.status
          - endpoints[POST /behavioral-health/admissions/{id}/discharge]
        distinguishing_aspect: |
          Discharge is the inverse of placement, and the invariant
          occupied_bed_count + raw_available_bed_count == licensed_placement_bed_count must hold
          before and after, with the derived posture and effective_available_bed_count reconciled
          from the restored counters rather than left at their pre-discharge values. The bed
          released by the discharge is the same bed the placement took, and the row-level truth
          (Bed.status, Admission.bed_id) is reconciled against the unit-level counters.
        test_recipe:
          setup:
            - "Unit with three STANDARD beds 401-A, 402-A and 403-B, so licensed_placement_bed_count is 3 and restricted_threshold is max(1, floor(3 * 0.20)) == 1."
            - "Two adult MODERATE VOLUNTARY admissions B1 and B2 are searched and PLACED in 401-A and 402-A."
            - "Before the trigger the unit reads occupied_bed_count 2, raw_available_bed_count 1, posture RESTRICTED, effective_available_bed_count 0."
            - "B1 has a secured discharge plan with follow_up_appointment_at 2026-09-10T09:00:00Z; the clock is 2026-09-03T08:00:00Z, so the appointment is still in the future."
            - "No admission is in PENDING_PLACEMENT on this unit and the posture never reaches CLOSED, so queued_admission_promotion has nothing to promote."
