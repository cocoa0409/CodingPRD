            - "OperatingAuthority.${auth19_id}.authority_status == ACTIVE with suspension_reason == NONE and suspended_at == null, and insurance_status == FILED"
            - "RevocationProceeding.${proc19_id}.status == CURED with cured_at == '2026-09-14T00:00:00.000Z' and replacement_policy_number == 'BIPD-2'"
            - "InsuranceFiling.${filing19b_id}.status == ACTIVE and supersedes_filing_id is null, because filing ${filing19a_id} was already CANCELLED when it was written"
