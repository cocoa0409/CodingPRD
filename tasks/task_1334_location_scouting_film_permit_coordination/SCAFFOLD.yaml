  - method: POST
    path: "/productions/{id}/owner-agreements/{rid}/counter"
    description: "Owner counters the proposal"
    roles: [OwnerRep]
    code: 200
    input: [proposed_day_rate_cents]
    output: OwnerAgreement
    side_effects: ["status := COUNTERED"]
  - method: POST
    path: "/productions/{id}/owner-agreements/{rid}/accept"
    description: "Accept the standing rate (OwnerRep accepts PROPOSED; LocationManager accepts COUNTERED)"
