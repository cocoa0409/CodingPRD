  - section: cross_cutting_complexity_layers
    instances:
      - name: sector_version_must_be_current_on_every_reservation_and_advances_on_each_write
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.capacity-hold-create-stale-sector
          - errors.ERR_STALE_SECTOR_VERSION
          - validations[priority=9]
          - endpoints[POST /capacity-holds]
        distinguishing_aspect: |
          The guarded row is the PARENT: booking a hold bumps Sector.version, so a client holding the
          pre-booking number is stale on its next reservation even though nothing it can see about its
          own request changed. The 412 must fire before the capacity arithmetic runs - there is plenty of
          allowance left - and it must leave the sector untouched so that a re-read plus retry succeeds
          with the very same body.
        test_recipe:
          setup:
            - "PRELUDE P1 plus two QUALIFIED STD50 requests on the same ACTIVE sector (capacity 25, ratio 8.0, allowance 200)."
          setup_api_calls:
            - call: "POST /towers"
              payload: { site_code: "RB-TWR-001", latitude: 41.2500, longitude: -104.8000, ground_elevation_m: 1200.0, antenna_agl_m: 45.0, lease_landowner_name: "Hartley Ranch LLC", lease_monthly_base_rent_cents: 45000, lease_escalator_pct: 0.0275, lease_start_date: "2023-04-01", lease_term_months: 60 }
              as: NetworkEngineer
              captures: { tower_id: $.data.id }
