              as: Consultant
              as_user_id: "con-ada"
            - call: "POST /society/school-applications"
              payload: { school_id: "${y_id}", type: "AFFILIATION", expected_school_version: "${y_v}" }
              as: SchoolAdmin
              as_user_id: "${y_id}"
              captures: { ya1: $.data.id }
            - call: "POST /society/school-applications/${ya1}/submit"
