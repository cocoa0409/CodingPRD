            - "RoyaltyStatement.${rs1}.status == AUDIT_OPEN   # unchanged"

      - name: offer_accept_sod_beats_auction_rank_constraint
        grounds:
          - validations[priority=7]
          - validations[priority=15]
          - state_machines.Offer.RECEIVED_to_ACCEPTED
        distinguishing_aspect: |
          DIFFERENT category pair than the sibling: business_safety (p7, SoD) vs
          business_constraint (p15, auction rank). Accepting the rank-2 offer in
