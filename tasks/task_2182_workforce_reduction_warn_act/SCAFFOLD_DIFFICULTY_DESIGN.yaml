  - rule_id: boundary_precision_check
    instances:

      - name: state_warn_percent_test_is_inclusive_at_exactly_min_percent
        grounds:
          - calculations.warn_employment_loss_count
          - entities.WarnRule.fields.min_percent
          - entities.WarnNotice.fields.loss_percent
          - entities.WarnNotice.fields.threshold_met
        distinguishing_aspect: |
          Numeric-threshold boundary on the loss_percent metric, reached through
          POST /warn-notices: with min_percent 50.00 a one-of-four loss computes
          loss_percent 25.00 and threshold_met false, while a two-of-four loss computes
          exactly 50.00 and threshold_met true — the comparison is >= on the two-decimal
          rounded percent, not >.
        test_recipe:
          setup:
            - "A TX site with four full-time employees and a TX STATE WarnRule with min_loss_count 1, min_percent 50.00, absolute_count 0, window_days 60."
            - "No FEDERAL WarnRule is configured, so the federal jurisdiction contributes nothing."
            - "Alice is SELECTED for 2026-12-01; Ben's selection is created but still PROPOSED."
          setup_api_calls:
            - call: "POST /warn-rules"
              payload: { jurisdiction: "STATE", state_code: "TX", rule_code: "TX-MINI-WARN", min_loss_count: 1, min_percent: 50.00, absolute_count: 0, notice_days: 60, window_days: 60, counts_part_time: true, min_service_days: 0, required_content_codes: ["EMPLOYER_NAME", "SITE_ADDRESS"] }
