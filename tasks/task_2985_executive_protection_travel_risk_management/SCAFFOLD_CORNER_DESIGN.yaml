      - name: shared_operations_succeed_for_each_role_that_declares_them
        claim_type: shared_operations
        grounds:
          - roles.ProtectionManager.shared_operations
          - roles.SecurityDirector.shared_operations
          - roles.ComplianceOfficer.shared_operations
          - roles.SystemOperator.shared_operations
        distinguishing_aspect: |
          Four operations are declared by two roles each, and each must accept both. The
          disclosure read is the sharpest of the four: the protectee may read only their own,
