            - "Consumed 9 days (2026-05-01..2026-05-10): next_cycle_due_at == 2026-05-10T00:00:00Z (2026-05-01 + 9 days) and paused_days_used_365d == 9"
            - "Second pause succeeds: Subscription.${s_id}.status == PAUSED again (cyclic loop, current_pause_end == 2026-05-15T00:00:00Z)"

      - name: fee_dispute_cycle_round_limited
        grounds:
          - state_machines.FeeAssessment.INVOICED_to_DISPUTED
          - state_machines.FeeAssessment.DISPUTED_to_INVOICED
          - entities.FeeAssessment.fields.dispute_rounds
        distinguishing_aspect: |
          Cyclic machine on FeeAssessment (different entity from Subscription):
          INVOICED -> DISPUTED -> INVOICED repeats up to MAX_DISPUTE_ROUNDS 2;
          the third dispute attempt fails ERR_DISPUTE_LIMIT_REACHED while the
          fee remains payable — loop-with-counter, not a plain pipeline.
        test_recipe:
          setup:
            - "Plan STD; member M with child born 2025-01-15; catalog item replacement 8000 age [12,36]; NEW copy; box delivered 2026-05-03"
            - "Item reported lost -> LOSS FeeAssessment 8000 INVOICED (member wallet -8000, member SUSPENDED; dispute/pay remain allowed)"
          setup_api_calls:
            - call: "POST /toy-rental/subscription-plans"
              payload: { name: "STD", monthly_fee_cents: 5000, toys_per_box: 2, swap_allowance_per_cycle: 2, max_holds: 2, rotation_cadence_days: 28, rental_period_days: 28, buyout_discount_pct: 0.10 }
              as: PlatformAdmin
