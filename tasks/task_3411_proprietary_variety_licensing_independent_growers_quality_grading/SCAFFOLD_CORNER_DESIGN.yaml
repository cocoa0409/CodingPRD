      - name: grade_juice_and_reject_bands
        claim_type: Correct Result
        grounds:
          - calculations.grade_determination
          - state_machines.HarvestLot.RECEIVED_to_REJECTED
        distinguishing_aspect: "JUICE ignores firmness and appearance entirely (brix 6.0, defect 15.0 with firmness 200 / appearance 30 still grades JUICE); brix 4.9 with defect 25.0 grades REJECT, and certifying a REJECT grade moves the lot RECEIVED -> REJECTED."
        test_recipe:
          setup: ["Same two-lot setup as grade_standard_process_defect_boundary."]
          setup_api_calls:
            - *c_clock
            - *c_v1
            - *c_v1_rel
            - *c_g1
            - *c_a1
            - *c_a1_dec
            - *c_l1
            - *c_w1
            - *c_p1
            - *c_clock_aug
            - *c_p1_conf
            - *c_clock_h1a
            - *c_hA
            - *c_p1_get3
            - *c_hB
            - *c_clock_h1b
            - *c_hA_recv
            - *c_hB_recv
          trigger:
