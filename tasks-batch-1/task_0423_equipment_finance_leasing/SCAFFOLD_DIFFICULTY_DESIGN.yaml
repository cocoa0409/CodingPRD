# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Equipment Finance & Leasing — 9 rules x >=2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: residual_buyout_differs_by_lease_type
        grounds:
          - calculations.residual_value
          - calculations.buyout_quote
          - entities.Lease.fields.lease_type
          - state_machines.EndOfTermElection.transitions.ELECTED_to_EXERCISED
        distinguishing_aspect: |
          residual_value/buyout is computed on the Lease entity: a TRAC lease's buyout equals
          its stipulated residual (90000), while an otherwise-identical FMV lease's buyout equals
          its tiered residual (100000) — different numbers from the SAME endpoint on a DIFFERENT
          entity domain than the tax dual-variant below.
        test_recipe:
          setup:
            - "Lessor with sales_tax_rate_bps=825, property_tax_rate_bps=120, home_state_code=NY"
            - "Two approved lessees, each on a booked+funded ACTIVE lease at end-of-term: one FMV (cost 500000, term 1, rate 2000), one TRAC (cost 600000, term 1, rate 2000, trac_residual 1500 bps)"
          setup_api_calls:
            - call: "POST /lessors"
              payload: { legal_name: "Atlas Leasing", home_state_code: "NY", sales_tax_rate_bps: 825, property_tax_rate_bps: 120 }
              as: FundingOfficer
              captures: { lessor_id: "$.data.id" }
            - call: "POST /lessors/${lessor_id}/vendors"
              payload: { name: "MachineCo", remit_account: "RA-1" }
              as: FundingOfficer
              captures: { vendor_id: "$.data.id" }
            - call: "POST /lessors/${lessor_id}/vendors/${vendor_id}/approve"
              payload: {}
              as: FundingOfficer
            # ---- FMV lessee + lease ----
            - call: "POST /lessors/${lessor_id}/credit-applications"
              payload: { applicant_legal_name: "FMV Corp", requested_amount_cents: 1000000, credit_score: 760 }
              as: CreditAnalyst
              as_user_id: "analyst-1"
              captures: { fmv_app_id: "$.data.id" }
            - call: "POST /lessors/${lessor_id}/credit-applications/${fmv_app_id}/submit"
              payload: {}
              as: CreditAnalyst
              as_user_id: "analyst-1"
            - call: "POST /lessors/${lessor_id}/credit-applications/${fmv_app_id}/approve"
              payload: { approved_amount_cents: 1000000 }
              as: CreditAnalyst
              as_user_id: "analyst-2"
            - call: "GET /lessors/${lessor_id}/lessees?credit_application_id=${fmv_app_id}"
              payload: {}
              as: FundingOfficer
              captures: { fmv_lessee_id: "$.data[0].id" }
            - call: "POST /lessors/${lessor_id}/lessees/${fmv_lessee_id}/leases"
              payload: { vendor_id: "${vendor_id}", lease_type: "FMV", equipment_cost_cents: 500000, term_months: 1, monthly_rate_factor_bps: 2000, advance_payment_count: 0, security_deposit_cents: 0 }
              as: FundingOfficer
              captures: { fmv_lease_id: "$.data.id", fmv_lease_v: "$.data.version" }
            - call: "POST /lessors/${lessor_id}/leases/${fmv_lease_id}/equipment"
              payload: { serial_number: "FMV-SN-1", description: "Press", original_cost_cents: 500000 }
              as: FundingOfficer
            - call: "POST /lessors/${lessor_id}/leases/${fmv_lease_id}/book"
              payload: { expected_lease_version: "${fmv_lease_v}" }
              as: FundingOfficer
            - call: "POST /lessors/${lessor_id}/leases/${fmv_lease_id}/fund"
              payload: {}
              as: FundingOfficer
            - call: "GET /lessors/${lessor_id}/leases/${fmv_lease_id}/schedule-lines?status=SCHEDULED"
              payload: {}
              as: Servicer
              captures: { fmv_line_id: "$.data[0].id" }
            - call: "POST /lessors/${lessor_id}/leases/${fmv_lease_id}/invoices"
              payload: { schedule_line_id: "${fmv_line_id}" }
              as: Servicer
              captures: { fmv_inv_id: "$.data.id" }
            - call: "POST /lessors/${lessor_id}/invoices/${fmv_inv_id}/payments"
              payload: { amount_cents: 108250 }
              as: Servicer
            - call: "POST /lessors/${lessor_id}/leases/${fmv_lease_id}/begin-end-of-term"
              payload: {}
              as: Servicer
            # ---- TRAC lessee + lease ----
            - call: "POST /lessors/${lessor_id}/credit-applications"
              payload: { applicant_legal_name: "TRAC Corp", requested_amount_cents: 1000000, credit_score: 760 }
              as: CreditAnalyst
              as_user_id: "analyst-1"
              captures: { trac_app_id: "$.data.id" }
            - call: "POST /lessors/${lessor_id}/credit-applications/${trac_app_id}/submit"
              payload: {}
              as: CreditAnalyst
              as_user_id: "analyst-1"
            - call: "POST /lessors/${lessor_id}/credit-applications/${trac_app_id}/approve"
              payload: { approved_amount_cents: 1000000 }
              as: CreditAnalyst
              as_user_id: "analyst-2"
            - call: "GET /lessors/${lessor_id}/lessees?credit_application_id=${trac_app_id}"
              payload: {}
              as: FundingOfficer
              captures: { trac_lessee_id: "$.data[0].id" }
            - call: "POST /lessors/${lessor_id}/lessees/${trac_lessee_id}/leases"
              payload: { vendor_id: "${vendor_id}", lease_type: "TRAC", equipment_cost_cents: 600000, term_months: 1, monthly_rate_factor_bps: 2000, trac_residual_pct_bps: 1500, advance_payment_count: 0, security_deposit_cents: 0 }
              as: FundingOfficer
              captures: { trac_lease_id: "$.data.id", trac_lease_v: "$.data.version" }
            - call: "POST /lessors/${lessor_id}/leases/${trac_lease_id}/equipment"
              payload: { serial_number: "TRAC-SN-1", description: "Loader", original_cost_cents: 600000 }
              as: FundingOfficer
            - call: "POST /lessors/${lessor_id}/leases/${trac_lease_id}/book"
              payload: { expected_lease_version: "${trac_lease_v}" }
              as: FundingOfficer
            - call: "POST /lessors/${lessor_id}/leases/${trac_lease_id}/fund"
              payload: {}
              as: FundingOfficer
            - call: "GET /lessors/${lessor_id}/leases/${trac_lease_id}/schedule-lines?status=SCHEDULED"
              payload: {}
              as: Servicer
              captures: { trac_line_id: "$.data[0].id" }
            - call: "POST /lessors/${lessor_id}/leases/${trac_lease_id}/invoices"
              payload: { schedule_line_id: "${trac_line_id}" }
              as: Servicer
              captures: { trac_inv_id: "$.data.id" }
            - call: "POST /lessors/${lessor_id}/invoices/${trac_inv_id}/payments"
              payload: { amount_cents: 129900 }
              as: Servicer
            - call: "POST /lessors/${lessor_id}/leases/${trac_lease_id}/begin-end-of-term"
              payload: {}
              as: Servicer
          trigger:
            - call: "POST /lessors/${lessor_id}/leases/${fmv_lease_id}/eot-elections"
              payload: { election: "BUYOUT" }
              as: Servicer
              captures: { fmv_eot_id: "$.data.id" }
            - call: "POST /lessors/${lessor_id}/leases/${trac_lease_id}/eot-elections"
              payload: { election: "BUYOUT" }
              as: Servicer
              captures: { trac_eot_id: "$.data.id" }
          assert:
            - "EndOfTermElection.${fmv_eot_id}.quoted_amount_cents == 100000"
            - "EndOfTermElection.${trac_eot_id}.quoted_amount_cents == 90000"
            - "EndOfTermElection.${fmv_eot_id}.quoted_amount_cents != EndOfTermElection.${trac_eot_id}.quoted_amount_cents"

      - name: tax_amount_differs_sales_use_vs_property
        grounds:
          - calculations.assessment_tax_amount
          - calculations.assessed_value
          - entities.TaxAssessment.fields.tax_type
          - entities.TaxAssessment.fields.tax_amount_cents
        distinguishing_aspect: |
          assessment_tax_amount is computed on the TaxAssessment entity: a SALES_USE assessment taxes
          equipment_cost_cents at sales_tax_rate_bps (41250), while a PROPERTY assessment taxes the
          depreciated assessed_value sum at property_tax_rate_bps (6000) — different base AND different
          rate, a dual-variant on a DIFFERENT entity domain than the Lease residual/buyout above.
        test_recipe:
          setup:
            - "Lessor sales_tax_rate_bps=825, property_tax_rate_bps=120, home_state_code=NY"
            - "One booked+funded ACTIVE lease (cost 500000, single unit original_cost 500000); SALES_USE auto-assessed at funding; property assessed at year 0 (just booked)"
          setup_api_calls:
            - call: "POST /lessors"
              payload: { legal_name: "Beacon Leasing", home_state_code: "NY", sales_tax_rate_bps: 825, property_tax_rate_bps: 120 }
              as: FundingOfficer
              captures: { lessor_id: "$.data.id" }
            - call: "POST /lessors/${lessor_id}/_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: FundingOfficer
            - call: "POST /lessors/${lessor_id}/vendors"
              payload: { name: "MachineCo", remit_account: "RA-1" }
              as: FundingOfficer
              captures: { vendor_id: "$.data.id" }
            - call: "POST /lessors/${lessor_id}/vendors/${vendor_id}/approve"
              payload: {}
              as: FundingOfficer
            - call: "POST /lessors/${lessor_id}/credit-applications"
              payload: { applicant_legal_name: "Cust", requested_amount_cents: 1000000, credit_score: 760 }
              as: CreditAnalyst
              as_user_id: "analyst-1"
              captures: { app_id: "$.data.id" }
            - call: "POST /lessors/${lessor_id}/credit-applications/${app_id}/submit"
              payload: {}
              as: CreditAnalyst
              as_user_id: "analyst-1"
            - call: "POST /lessors/${lessor_id}/credit-applications/${app_id}/approve"
              payload: { approved_amount_cents: 1000000 }
              as: CreditAnalyst
              as_user_id: "analyst-2"
            - call: "GET /lessors/${lessor_id}/lessees?credit_application_id=${app_id}"
              payload: {}
              as: FundingOfficer
              captures: { lessee_id: "$.data[0].id" }
            - call: "POST /lessors/${lessor_id}/lessees/${lessee_id}/leases"
              payload: { vendor_id: "${vendor_id}", lease_type: "FMV", equipment_cost_cents: 500000, term_months: 12, monthly_rate_factor_bps: 2000, advance_payment_count: 0, security_deposit_cents: 0 }
              as: FundingOfficer
              captures: { lease_id: "$.data.id", lease_v: "$.data.version" }
            - call: "POST /lessors/${lessor_id}/leases/${lease_id}/equipment"
              payload: { serial_number: "SN-100", description: "Press", original_cost_cents: 500000 }
              as: FundingOfficer
            - call: "POST /lessors/${lessor_id}/leases/${lease_id}/book"
              payload: { expected_lease_version: "${lease_v}" }
              as: FundingOfficer
            - call: "POST /lessors/${lessor_id}/leases/${lease_id}/fund"
              payload: {}
              as: FundingOfficer
          trigger:
            - call: "GET /lessors/${lessor_id}/leases/${lease_id}/tax-assessments?tax_type=SALES_USE"
              payload: {}
              as: Servicer
              captures: { sales_assessment_id: "$.data[0].id" }
            - call: "POST /lessors/${lessor_id}/leases/${lease_id}/tax-assessments"
              payload: { tax_type: "PROPERTY" }
              as: Servicer
              captures: { prop_assessment_id: "$.data.id" }
          assert:
            - "TaxAssessment.${sales_assessment_id}.tax_amount_cents == 41250"
            - "TaxAssessment.${prop_assessment_id}.tax_amount_cents == 6000"
            - "TaxAssessment.${sales_assessment_id}.taxable_base_cents == 500000"
            - "TaxAssessment.${prop_assessment_id}.taxable_base_cents == 500000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: buyout_quote_multibranch_three_inputs
        grounds:
          - calculations.buyout_quote
          - entities.Lease.fields.residual_value_cents
          - entities.Lease.fields.monthly_payment_cents
          - state_machines.EndOfTermElection.transitions.ELECTED_to_EXERCISED
        distinguishing_aspect: |
          MODE (a) non-linear formula: buyout_quote takes >=3 inputs (lease_type, residual_value_cents,
          remaining_installments derived from term/paid/advance, monthly_payment_cents) and branches on
          lease_type — an FMV buyout with 25 remaining installments = residual 180000 + 25*30000 = 930000,
          not a single linear expression.
        test_recipe:
          setup:
            - "FMV lease cost 1200000, term 36, rate 250 (mp=30000, residual 180000), advance 1; 10 installments paid (paid_installment_count=10); lease still ACTIVE"
            - "Lessee approved_credit 2000000"
          setup_api_calls:
            - call: "POST /lessors"
              payload: { legal_name: "Crest Leasing", home_state_code: "NY", sales_tax_rate_bps: 825, property_tax_rate_bps: 120 }
              as: FundingOfficer
              captures: { lessor_id: "$.data.id" }
            - call: "POST /lessors/${lessor_id}/vendors"
              payload: { name: "MachineCo", remit_account: "RA-1" }
              as: FundingOfficer
              captures: { vendor_id: "$.data.id" }
            - call: "POST /lessors/${lessor_id}/vendors/${vendor_id}/approve"
              payload: {}
              as: FundingOfficer
            - call: "POST /lessors/${lessor_id}/credit-applications"
              payload: { applicant_legal_name: "Cust", requested_amount_cents: 2000000, credit_score: 760 }
              as: CreditAnalyst
              as_user_id: "analyst-1"
              captures: { app_id: "$.data.id" }
            - call: "POST /lessors/${lessor_id}/credit-applications/${app_id}/submit"
              payload: {}
              as: CreditAnalyst
              as_user_id: "analyst-1"
            - call: "POST /lessors/${lessor_id}/credit-applications/${app_id}/approve"
              payload: { approved_amount_cents: 2000000 }
              as: CreditAnalyst
              as_user_id: "analyst-2"
            - call: "GET /lessors/${lessor_id}/lessees?credit_application_id=${app_id}"
              payload: {}
              as: FundingOfficer
              captures: { lessee_id: "$.data[0].id" }
            - call: "POST /lessors/${lessor_id}/lessees/${lessee_id}/leases"
              payload: { vendor_id: "${vendor_id}", lease_type: "FMV", equipment_cost_cents: 1200000, term_months: 36, monthly_rate_factor_bps: 250, advance_payment_count: 1, security_deposit_cents: 50000 }
              as: FundingOfficer
              captures: { lease_id: "$.data.id", lease_v: "$.data.version" }
            - call: "POST /lessors/${lessor_id}/leases/${lease_id}/equipment"
              payload: { serial_number: "SN-200", description: "Excavator", original_cost_cents: 1200000 }
              as: FundingOfficer
            - call: "POST /lessors/${lessor_id}/leases/${lease_id}/book"
              payload: { expected_lease_version: "${lease_v}" }
              as: FundingOfficer
            - call: "POST /lessors/${lessor_id}/leases/${lease_id}/fund"
              payload: {}
              as: FundingOfficer
          trigger:
            - call: "POST /lessors/${lessor_id}/leases/${lease_id}/eot-elections"
              payload: { election: "BUYOUT" }
              as: Servicer
              captures: { eot_id: "$.data.id" }
          assert:
            - "EndOfTermElection.${eot_id}.quoted_amount_cents == 930000"
        # Note: 10 of the 35 non-advance installments would be paid in a fuller chain; here the
        # buyout quote is computed at election time from term/advance and current paid count.

      - name: invoice_sales_tax_round_per_line_order
        grounds:
          - calculations.invoice_sales_tax
          - entities.Invoice.fields.sales_tax_cents
          - entities.Invoice.fields.total_due_cents
          - state_machines.Invoice.transitions.OPEN_to_PAID
        distinguishing_aspect: |
          MODE (b) rounding order: tax is rounded PER INVOICE — base_rent 1000 @ 825 bps rounds to 83
          on each of two invoices (166 total), whereas sum-then-round of 2000 @ 825 bps would be 165.
          The scaffold pins round-per-line, so each invoice.sales_tax_cents == 83.
        test_recipe:
          setup:
            - "Lessor sales_tax_rate_bps=825; ACTIVE lease with mp=1000 (cost 400000, rate 25), term 2"
          setup_api_calls:
            - call: "POST /lessors"
              payload: { legal_name: "Delta Leasing", home_state_code: "NY", sales_tax_rate_bps: 825, property_tax_rate_bps: 120 }
              as: FundingOfficer
              captures: { lessor_id: "$.data.id" }
            - call: "POST /lessors/${lessor_id}/vendors"
              payload: { name: "MachineCo", remit_account: "RA-1" }
              as: FundingOfficer
              captures: { vendor_id: "$.data.id" }
            - call: "POST /lessors/${lessor_id}/vendors/${vendor_id}/approve"
              payload: {}
              as: FundingOfficer
            - call: "POST /lessors/${lessor_id}/credit-applications"
              payload: { applicant_legal_name: "Cust", requested_amount_cents: 1000000, credit_score: 760 }
              as: CreditAnalyst
              as_user_id: "analyst-1"
              captures: { app_id: "$.data.id" }
            - call: "POST /lessors/${lessor_id}/credit-applications/${app_id}/submit"
              payload: {}
              as: CreditAnalyst
              as_user_id: "analyst-1"
            - call: "POST /lessors/${lessor_id}/credit-applications/${app_id}/approve"
              payload: { approved_amount_cents: 1000000 }
              as: CreditAnalyst
              as_user_id: "analyst-2"
            - call: "GET /lessors/${lessor_id}/lessees?credit_application_id=${app_id}"
              payload: {}
              as: FundingOfficer
              captures: { lessee_id: "$.data[0].id" }
            - call: "POST /lessors/${lessor_id}/lessees/${lessee_id}/leases"
              payload: { vendor_id: "${vendor_id}", lease_type: "FMV", equipment_cost_cents: 400000, term_months: 2, monthly_rate_factor_bps: 25, advance_payment_count: 0, security_deposit_cents: 0 }
              as: FundingOfficer
              captures: { lease_id: "$.data.id", lease_v: "$.data.version" }
            - call: "POST /lessors/${lessor_id}/leases/${lease_id}/equipment"
              payload: { serial_number: "SN-300", description: "Forklift", original_cost_cents: 400000 }
              as: FundingOfficer
            - call: "POST /lessors/${lessor_id}/leases/${lease_id}/book"
              payload: { expected_lease_version: "${lease_v}" }
              as: FundingOfficer
            - call: "POST /lessors/${lessor_id}/leases/${lease_id}/fund"
              payload: {}
              as: FundingOfficer
            - call: "GET /lessors/${lessor_id}/leases/${lease_id}/schedule-lines?status=SCHEDULED"
              payload: {}
              as: Servicer
              captures: { line0_id: "$.data[0].id", line1_id: "$.data[1].id" }
          trigger:
            - call: "POST /lessors/${lessor_id}/leases/${lease_id}/invoices"
              payload: { schedule_line_id: "${line0_id}" }
              as: Servicer
              captures: { inv0_id: "$.data.id" }
            - call: "POST /lessors/${lessor_id}/leases/${lease_id}/invoices"
              payload: { schedule_line_id: "${line1_id}" }
              as: Servicer
              captures: { inv1_id: "$.data.id" }
          assert:
            - "Invoice.${inv0_id}.sales_tax_cents == 83"
            - "Invoice.${inv1_id}.sales_tax_cents == 83"
            - "Invoice.${inv0_id}.total_due_cents == 1083"
            - "Invoice.${inv0_id}.base_rent_cents == 1000"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: credit_application_revision_cycle
        grounds:
          - state_machines.CreditApplication.transitions.SUBMITTED_to_RETURNED_FOR_INFO
          - state_machines.CreditApplication.transitions.RETURNED_FOR_INFO_to_DRAFT
          - entities.CreditApplication.fields.revision_count
        distinguishing_aspect: |
          CreditApplication is CYCLIC: SUBMITTED -> RETURNED_FOR_INFO -> DRAFT -> SUBMITTED forms a loop,
          and revision_count increments each pass (1 after one full loop) — a non-linear cycle on the
          CreditApplication entity, distinct from the Lease parallel-dimensions machine below.
        test_recipe:
          setup:
            - "A DRAFT credit application created and submitted once"
          setup_api_calls:
            - call: "POST /lessors"
              payload: { legal_name: "Echo Leasing", home_state_code: "NY", sales_tax_rate_bps: 825, property_tax_rate_bps: 120 }
              as: FundingOfficer
              captures: { lessor_id: "$.data.id" }
            - call: "POST /lessors/${lessor_id}/credit-applications"
              payload: { applicant_legal_name: "Cust", requested_amount_cents: 500000, credit_score: 700 }
              as: CreditAnalyst
              as_user_id: "analyst-1"
              captures: { app_id: "$.data.id" }
            - call: "POST /lessors/${lessor_id}/credit-applications/${app_id}/submit"
              payload: {}
              as: CreditAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "POST /lessors/${lessor_id}/credit-applications/${app_id}/return-for-info"
              payload: {}
              as: CreditAnalyst
              as_user_id: "analyst-2"
            - call: "POST /lessors/${lessor_id}/credit-applications/${app_id}/revise"
              payload: {}
              as: CreditAnalyst
              as_user_id: "analyst-1"
            - call: "POST /lessors/${lessor_id}/credit-applications/${app_id}/submit"
              payload: {}
              as: CreditAnalyst
              as_user_id: "analyst-1"
          assert:
            - "CreditApplication.${app_id}.status == SUBMITTED"
            - "CreditApplication.${app_id}.revision_count == 1"

      - name: lease_parallel_lifecycle_and_funding_dimensions
        grounds:
          - state_machines.Lease.transitions.ORIGINATION_to_BOOKED
          - state_machines.Lease.transitions.PENDING_FUNDING_to_FUNDED
          - state_machines.Lease.transitions.BOOKED_to_ACTIVE
          - entities.Lease.fields.lifecycle_status
          - entities.Lease.fields.funding_status
        distinguishing_aspect: |
          Lease carries TWO independent state axes: after book, lifecycle_status=BOOKED while
          funding_status is still PENDING_FUNDING; only when fund advances funding_status to FUNDED does
          the automatic BOOKED -> ACTIVE fire — parallel dimensions on the Lease entity, distinct from
          the CreditApplication cycle above.
        test_recipe:
          setup:
            - "An approved lessee with a created lease and one attached unit; vendor APPROVED"
          setup_api_calls:
            - call: "POST /lessors"
              payload: { legal_name: "Foxtrot Leasing", home_state_code: "NY", sales_tax_rate_bps: 825, property_tax_rate_bps: 120 }
              as: FundingOfficer
              captures: { lessor_id: "$.data.id" }
            - call: "POST /lessors/${lessor_id}/vendors"
              payload: { name: "MachineCo", remit_account: "RA-1" }
              as: FundingOfficer
              captures: { vendor_id: "$.data.id" }
            - call: "POST /lessors/${lessor_id}/vendors/${vendor_id}/approve"
              payload: {}
              as: FundingOfficer
            - call: "POST /lessors/${lessor_id}/credit-applications"
              payload: { applicant_legal_name: "Cust", requested_amount_cents: 1000000, credit_score: 760 }
              as: CreditAnalyst
              as_user_id: "analyst-1"
              captures: { app_id: "$.data.id" }
            - call: "POST /lessors/${lessor_id}/credit-applications/${app_id}/submit"
              payload: {}
              as: CreditAnalyst
              as_user_id: "analyst-1"
            - call: "POST /lessors/${lessor_id}/credit-applications/${app_id}/approve"
              payload: { approved_amount_cents: 1000000 }
              as: CreditAnalyst
              as_user_id: "analyst-2"
            - call: "GET /lessors/${lessor_id}/lessees?credit_application_id=${app_id}"
              payload: {}
              as: FundingOfficer
              captures: { lessee_id: "$.data[0].id" }
