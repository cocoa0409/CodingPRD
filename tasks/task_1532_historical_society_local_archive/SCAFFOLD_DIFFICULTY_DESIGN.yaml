  - rule_id: priority_pair_validation_conflict
    instances:
      - name: invoice_state_error_beats_quota_fiscal
        grounds:
          - validations[priority=5]
          - validations[priority=12]
          - calculations.reproduction_annual_quota
          - errors[ERR_INVALID_STATE]
          - errors[ERR_REPRO_QUOTA_EXCEEDED]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: the invoice call targets a
          QUOTED order (state violation, priority 4) AND its 600 actual pages
          would breach the 500-page annual quota (fiscal violation, priority 11).
          The pinned ordering returns ERR_INVALID_STATE, never the fiscal error.
        test_recipe:
          setup:
            - "Reproduction order O in QUOTED state (never quote-approved) with page_estimate 60; researcher has consumed 0 of the 500-page annual quota"
          setup_api_calls:
            - { call: "POST /storage-zones", payload: { zone_code: "Z1", name: "Vault A" }, as: Registrar, captures: { z: $.data.id } }
            - { call: "POST /collections", payload: { title: "Papers", collection_code: "C1", storage_zone_id: "${z}" }, as: Registrar, captures: { c: $.data.id } }
