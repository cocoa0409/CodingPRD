  - rule_id: non_linear_state_machine
    instances:
      - name: chargeback_parallel_axes_prearb_cycle
        grounds:
          - state_machines.Chargeback.DECIDED_WON_to_PRE_ARBITRATION
          - state_machines.Chargeback.PRE_ARBITRATION_to_DECIDED_WON
          - entities.Chargeback.fields.case_status
          - entities.Chargeback.fields.funds_status
        distinguishing_aspect: |
          Chargeback carries two parallel state axes (case_status x funds_status)
          plus a cycle: DECIDED_WON -> PRE_ARBITRATION -> DECIDED_WON returns the
          case to the same (case, funds) pair with money moved out and back;
          funds_status evolves independently of the lifecycle axis.
        test_recipe:
          setup:
            - "STANDARD merchant reserve_rate_bps 0 (no reserve holds; clearing arithmetic isolated)"
            - "one 10000-cent sale occurred 2026-07-10; chargeback NC-1 for the full amount received 2026-07-15; notified; complete packet; submitted"
          setup_api_calls:
            - { call: "POST /acquirer/reason-code-rules", as: AcquirerOps, payload: { network: VISA, reason_code: "10.4", category: FRAUD, required_evidence_types: [RECEIPT, DELIVERY_PROOF], merchant_response_days: 7, representment_days: 30, chargeback_fee_cents: 2500, effective_from: "2026-01-01T00:00:00Z" } }
            - call: "POST /acquirer/merchants"
              as: AcquirerOps
              payload: { legal_name: "Cycle M", merchant_category_code: "5411", risk_tier: STANDARD, reserve_rate_bps: 0 }
              captures: { m_id: $.data.id }
            - { call: "POST /acquirer/transactions", as: AcquirerOps, payload: { merchant_id: "${m_id}", external_ref: "T-1", network: VISA, amount_cents: 10000, occurred_at: "2026-07-10T00:00:00Z" } }
            - { call: "POST /acquirer/_clock/set_current_utc", as: AcquirerOps, payload: { to_iso8601: "2026-07-15T00:00:00Z" } }
            - call: "POST /acquirer/chargebacks"
              as: AcquirerOps
              payload: { merchant_id: "${m_id}", transaction_external_ref: "T-1", network_case_id: "NC-1", reason_code: "10.4", amount_cents: 10000 }
              captures: { cb_id: $.data.id }
            - { call: "POST /acquirer/chargebacks/${cb_id}/notify", as: AcquirerOps, payload: {} }
            - call: "POST /acquirer/evidence-items"
              as: MerchantUser
              as_user_id: "${m_id}"
              payload: { chargeback_id: "${cb_id}", evidence_type: RECEIPT, document_uri: "s3://ev/receipt.pdf" }
              captures: { ev1: $.data.id }
            - call: "POST /acquirer/evidence-items"
              as: MerchantUser
              as_user_id: "${m_id}"
              payload: { chargeback_id: "${cb_id}", evidence_type: DELIVERY_PROOF, document_uri: "s3://ev/delivery.pdf" }
              captures: { ev2: $.data.id }
            - call: "GET /acquirer/chargebacks/${cb_id}"
              as: AcquirerOps
              captures: { cb_v: $.data.version }
            - call: "POST /acquirer/representments"
              as: MerchantUser
              as_user_id: "${m_id}"
              payload: { chargeback_id: "${cb_id}", evidence_item_ids: ["${ev1}", "${ev2}"], expected_chargeback_version: "${cb_v}" }
              captures: { rep_id: $.data.id }
            - { call: "POST /acquirer/representments/${rep_id}/submit", as: MerchantUser, as_user_id: "${m_id}", payload: {} }
          trigger:
            - { call: "POST /acquirer/representments/${rep_id}/network-outcome", as: AcquirerOps, payload: { outcome: WON } }
            - call: "GET /acquirer/chargebacks/${cb_id}"
              as: AcquirerOps
              captures: { case_won: $.data.case_status, funds_won: $.data.funds_status }
            - call: "GET /acquirer/merchants/${m_id}"
              as: AcquirerOps
              captures: { clearing_won: $.data.clearing_balance_cents }
            - { call: "POST /acquirer/chargebacks/${cb_id}/pre-arbitration", as: AcquirerOps, payload: {} }
            - call: "GET /acquirer/chargebacks/${cb_id}"
              as: AcquirerOps
              captures: { case_pa: $.data.case_status, funds_pa: $.data.funds_status }
            - call: "GET /acquirer/merchants/${m_id}"
              as: AcquirerOps
              captures: { clearing_pa: $.data.clearing_balance_cents }
            - { call: "POST /acquirer/chargebacks/${cb_id}/pre-arbitration/outcome", as: AcquirerOps, payload: { decision: WON } }
            - call: "GET /acquirer/chargebacks/${cb_id}"
              as: AcquirerOps
              captures: { case_won2: $.data.case_status, funds_won2: $.data.funds_status }
            - call: "GET /acquirer/merchants/${m_id}"
              as: AcquirerOps
              captures: { clearing_won2: $.data.clearing_balance_cents }
          assert:
            - "after outcome WON: case_won == DECIDED_WON and funds_won == FUNDS_RETURNED and clearing_won == 10000"
            - "after pre-arbitration: case_pa == PRE_ARBITRATION and funds_pa == MERCHANT_DEBITED and clearing_pa == 0 (the win re-credit is re-debited)"
            - "after pre-arb outcome WON: case_won2 == DECIDED_WON and funds_won2 == FUNDS_RETURNED and clearing_won2 == 10000 (cycle closed on both axes)"

      - name: representment_cure_cycle_supersede
        grounds:
          - state_machines.Representment.SUBMITTED_to_RETURNED_FOR_CURE
          - state_machines.Representment.RETURNED_FOR_CURE_to_SUPERSEDED
          - state_machines.EvidenceItem.ATTACHED_to_DRAFT
          - concurrency_rules[representment-create-stale-chargeback]
        distinguishing_aspect: |
          Representment (a different entity than the Chargeback instance) runs the
          cycle SUBMITTED -> RETURNED_FOR_CURE -> successor ASSEMBLED -> SUBMITTED;
          creating the successor supersedes the returned packet and bounces its
          evidence ATTACHED -> DRAFT, with cure_count carried as 0 -> 1.
        test_recipe:
          setup:
            - "STANDARD merchant reserve_rate_bps 0; 10000-cent sale; chargeback NC-1 received 2026-07-15, notified, first packet submitted then RETURNED_FOR_CURE by the network"
          setup_api_calls:
            - { call: "POST /acquirer/reason-code-rules", as: AcquirerOps, payload: { network: VISA, reason_code: "10.4", category: FRAUD, required_evidence_types: [RECEIPT, DELIVERY_PROOF], merchant_response_days: 7, representment_days: 30, chargeback_fee_cents: 2500, effective_from: "2026-01-01T00:00:00Z" } }
            - call: "POST /acquirer/merchants"
              as: AcquirerOps
              payload: { legal_name: "Cure M", merchant_category_code: "5411", risk_tier: STANDARD, reserve_rate_bps: 0 }
              captures: { m_id: $.data.id }
            - { call: "POST /acquirer/transactions", as: AcquirerOps, payload: { merchant_id: "${m_id}", external_ref: "T-1", network: VISA, amount_cents: 10000, occurred_at: "2026-07-10T00:00:00Z" } }
            - { call: "POST /acquirer/_clock/set_current_utc", as: AcquirerOps, payload: { to_iso8601: "2026-07-15T00:00:00Z" } }
            - call: "POST /acquirer/chargebacks"
              as: AcquirerOps
              payload: { merchant_id: "${m_id}", transaction_external_ref: "T-1", network_case_id: "NC-1", reason_code: "10.4", amount_cents: 10000 }
              captures: { cb_id: $.data.id }
            - { call: "POST /acquirer/chargebacks/${cb_id}/notify", as: AcquirerOps, payload: {} }
            - call: "POST /acquirer/evidence-items"
              as: MerchantUser
              as_user_id: "${m_id}"
              payload: { chargeback_id: "${cb_id}", evidence_type: RECEIPT, document_uri: "s3://ev/r1.pdf" }
              captures: { ev1: $.data.id }
            - call: "POST /acquirer/evidence-items"
              as: MerchantUser
              as_user_id: "${m_id}"
              payload: { chargeback_id: "${cb_id}", evidence_type: DELIVERY_PROOF, document_uri: "s3://ev/d1.pdf" }
              captures: { ev2: $.data.id }
            - call: "GET /acquirer/chargebacks/${cb_id}"
              as: AcquirerOps
              captures: { cb_v1: $.data.version }
            - call: "POST /acquirer/representments"
              as: MerchantUser
              as_user_id: "${m_id}"
              payload: { chargeback_id: "${cb_id}", evidence_item_ids: ["${ev1}", "${ev2}"], expected_chargeback_version: "${cb_v1}" }
              captures: { rep1_id: $.data.id }
            - { call: "POST /acquirer/representments/${rep1_id}/submit", as: MerchantUser, as_user_id: "${m_id}", payload: {} }
            - { call: "POST /acquirer/representments/${rep1_id}/network-outcome", as: AcquirerOps, payload: { outcome: RETURNED_FOR_CURE } }
            - call: "POST /acquirer/evidence-items"
              as: MerchantUser
              as_user_id: "${m_id}"
              payload: { chargeback_id: "${cb_id}", evidence_type: RECEIPT, document_uri: "s3://ev/r2.pdf" }
              captures: { ev3: $.data.id }
            - call: "POST /acquirer/evidence-items"
              as: MerchantUser
              as_user_id: "${m_id}"
              payload: { chargeback_id: "${cb_id}", evidence_type: DELIVERY_PROOF, document_uri: "s3://ev/d2.pdf" }
              captures: { ev4: $.data.id }
            - call: "GET /acquirer/chargebacks/${cb_id}"
              as: AcquirerOps
              captures: { cb_v2: $.data.version, case_mid: $.data.case_status }
          trigger:
            - call: "POST /acquirer/representments"
              as: MerchantUser
              as_user_id: "${m_id}"
              payload: { chargeback_id: "${cb_id}", evidence_item_ids: ["${ev3}", "${ev4}"], expected_chargeback_version: "${cb_v2}" }
              captures: { rep2_id: $.data.id, rep2_cure: $.data.cure_count }
            - call: "GET /acquirer/representments/${rep1_id}"
              as: AcquirerOps
              captures: { rep1_status: $.data.status }
            - call: "GET /acquirer/evidence-items/${ev1}"
              as: AcquirerOps
              captures: { ev1_status: $.data.status }
            - { call: "POST /acquirer/representments/${rep2_id}/submit", as: MerchantUser, as_user_id: "${m_id}", payload: {} }
            - call: "POST /acquirer/representments/${rep2_id}/network-outcome"
              as: AcquirerOps
              payload: { outcome: RETURNED_FOR_CURE }
              captures: { err: $.data.error_id }
            - { call: "POST /acquirer/representments/${rep2_id}/network-outcome", as: AcquirerOps, payload: { outcome: WON } }
            - call: "GET /acquirer/chargebacks/${cb_id}"
              as: AcquirerOps
              captures: { case_final: $.data.case_status }
          assert:
            - "case_mid == REPRESENTED (a returned packet leaves the case in REPRESENTED, not a new state)"
            - "rep1_status == SUPERSEDED after the successor packet is created"
            - "ev1_status == DRAFT (supersede bounces attached evidence back to DRAFT)"
            - "rep2_cure == 1 (cure lineage carried forward)"
            - "err == ERR_CURE_LIMIT_EXCEEDED (MAX_CURES = 1 already consumed by this lineage)"
            - "case_final == DECIDED_WON after the cured packet wins"

      - name: remediation_plan_return_resubmit_cycle
        grounds:
          - state_machines.RemediationPlan.SUBMITTED_to_RETURNED
          - state_machines.RemediationPlan.RETURNED_to_SUBMITTED
          - state_machines.ProgramEnrollment.ACTIVE_to_REMEDIATION
        distinguishing_aspect: |
          RemediationPlan (a third entity with a non-linear machine) loops
          SUBMITTED -> RETURNED -> SUBMITTED on reviewer rejection, and only the
          APPROVED exit crosses machines by moving the parent ProgramEnrollment
          ACTIVE -> REMEDIATION.
        test_recipe:
          setup:
            - "merchant with a manually created ACTIVE VDMP_STANDARD enrollment (enrolled_month 2026-05)"
          setup_api_calls:
            - call: "POST /acquirer/merchants"
              as: AcquirerOps
              payload: { legal_name: "Plan M", merchant_category_code: "5411", risk_tier: STANDARD, reserve_rate_bps: 0 }
              captures: { m_id: $.data.id }
            - call: "POST /acquirer/program-enrollments"
              as: RiskOfficer
              payload: { merchant_id: "${m_id}", network: VISA, program_code: VDMP_STANDARD, enrolled_month: "2026-05" }
              captures: { enr_id: $.data.id }
            - call: "POST /acquirer/remediation-plans"
              as: MerchantUser
              as_user_id: "${m_id}"
              payload: { enrollment_id: "${enr_id}", root_cause_codes: [FRAUD_GAP], corrective_actions: ["deploy 3DS"] }
              captures: { plan_id: $.data.id }
          trigger:
            - { call: "POST /acquirer/remediation-plans/${plan_id}/submit", as: MerchantUser, as_user_id: "${m_id}", payload: {} }
            - { call: "POST /acquirer/remediation-plans/${plan_id}/review", as: RiskOfficer, payload: { decision: RETURN, decision_note: "insufficient detail" } }
            - call: "GET /acquirer/program-enrollments/${enr_id}"
              as: RiskOfficer
              captures: { enr_mid: $.data.status }
            - { call: "POST /acquirer/remediation-plans/${plan_id}/submit", as: MerchantUser, as_user_id: "${m_id}", payload: {} }
            - { call: "POST /acquirer/remediation-plans/${plan_id}/review", as: RiskOfficer, payload: { decision: APPROVE, decision_note: "ok" } }
            - call: "GET /acquirer/program-enrollments/${enr_id}"
              as: RiskOfficer
              captures: { enr_final: $.data.status }
            - call: "GET /acquirer/program-enrollments/${enr_id}/remediation-plans"
              as: RiskOfficer
              captures: { plan_final: "$.data[0].status" }
          assert:
            - "enr_mid == ACTIVE after the RETURN review (rejection does not move the enrollment)"
            - "plan_final == APPROVED after the RETURNED -> SUBMITTED resubmission cycle and APPROVE review"
            - "enr_final == REMEDIATION (cross-machine side effect of the plan approval)"

  - rule_id: transitive_cascade
    instances:
      - name: network_outcome_win_cascade
        grounds:
          - state_machines.Representment.SUBMITTED_to_WON
          - state_machines.Chargeback.REPRESENTED_to_DECIDED_WON
          - entities.Merchant.fields.clearing_balance_cents
          - entities.ReserveAccount.fields.held_cents
          - calculations.reserve_target
        distinguishing_aspect: |
          Depth-3+ chain from the network-outcome trigger: representment outcome
          WON -> chargeback DECIDED_WON/FUNDS_RETURNED -> merchant clearing
          re-credit (+10000) -> HIGH_RISK receipt-holdback RELEASE ledger entry ->
          held_cents fold (10000 -> 0) -> EXPOSURE_BASED target recompute
          (20000 -> 0 as the case leaves the open-exposure set). Each link is
          caused by the previous link, not by the original call.
        test_recipe:
          setup:
            - "HIGH_RISK merchant, reserve_rate_bps 0, reserve_mode EXPOSURE_BASED"
            - "one 10000-cent sale occurred 2026-07-10; full-amount chargeback received 2026-07-15 (receipt holdback HOLD 10000 posted); notified; packet assembled and submitted"
          setup_api_calls:
            - { call: "POST /acquirer/reason-code-rules", as: AcquirerOps, payload: { network: VISA, reason_code: "10.4", category: FRAUD, required_evidence_types: [RECEIPT, DELIVERY_PROOF], merchant_response_days: 7, representment_days: 30, chargeback_fee_cents: 2500, effective_from: "2026-01-01T00:00:00Z" } }
            - call: "POST /acquirer/merchants"
              as: AcquirerOps
              payload: { legal_name: "Cascade M", merchant_category_code: "5411", risk_tier: HIGH_RISK, reserve_mode: EXPOSURE_BASED, reserve_rate_bps: 0 }
              captures: { m_id: $.data.id }
            - { call: "POST /acquirer/transactions", as: AcquirerOps, payload: { merchant_id: "${m_id}", external_ref: "T-1", network: VISA, amount_cents: 10000, occurred_at: "2026-07-10T00:00:00Z" } }
            - { call: "POST /acquirer/_clock/set_current_utc", as: AcquirerOps, payload: { to_iso8601: "2026-07-15T00:00:00Z" } }
            - call: "POST /acquirer/chargebacks"
              as: AcquirerOps
              payload: { merchant_id: "${m_id}", transaction_external_ref: "T-1", network_case_id: "NC-1", reason_code: "10.4", amount_cents: 10000 }
              captures: { cb_id: $.data.id }
            - { call: "POST /acquirer/chargebacks/${cb_id}/notify", as: AcquirerOps, payload: {} }
            - call: "POST /acquirer/evidence-items"
              as: MerchantUser
              as_user_id: "${m_id}"
              payload: { chargeback_id: "${cb_id}", evidence_type: RECEIPT, document_uri: "s3://ev/r.pdf" }
              captures: { ev1: $.data.id }
            - call: "POST /acquirer/evidence-items"
              as: MerchantUser
              as_user_id: "${m_id}"
              payload: { chargeback_id: "${cb_id}", evidence_type: DELIVERY_PROOF, document_uri: "s3://ev/d.pdf" }
              captures: { ev2: $.data.id }
            - call: "GET /acquirer/chargebacks/${cb_id}"
              as: AcquirerOps
              captures: { cb_v: $.data.version }
            - call: "POST /acquirer/representments"
              as: MerchantUser
              as_user_id: "${m_id}"
              payload: { chargeback_id: "${cb_id}", evidence_item_ids: ["${ev1}", "${ev2}"], expected_chargeback_version: "${cb_v}" }
              captures: { rep_id: $.data.id }
            - { call: "POST /acquirer/representments/${rep_id}/submit", as: MerchantUser, as_user_id: "${m_id}", payload: {} }
            - call: "GET /acquirer/reserve-accounts"
              as: RiskOfficer
              payload: { merchant_id: "${m_id}" }
              captures: { ra_id: "$.data[0].id", held_pre: "$.data[0].held_cents", target_pre: "$.data[0].target_cents" }
          trigger:
            - { call: "POST /acquirer/representments/${rep_id}/network-outcome", as: AcquirerOps, payload: { outcome: WON } }
            - call: "GET /acquirer/chargebacks/${cb_id}"
              as: AcquirerOps
              captures: { case_final: $.data.case_status, funds_final: $.data.funds_status }
            - call: "GET /acquirer/merchants/${m_id}"
              as: AcquirerOps
              captures: { clearing_final: $.data.clearing_balance_cents }
            - call: "GET /acquirer/reserve-accounts/${ra_id}"
              as: RiskOfficer
              captures: { held_post: $.data.held_cents, target_post: $.data.target_cents }
            - call: "GET /acquirer/reserve-accounts/${ra_id}/ledger-entries"
              as: RiskOfficer
              captures: { entry1_type: "$.data[0].entry_type", entry2_type: "$.data[1].entry_type", entry2_amount: "$.data[1].amount_cents" }
          assert:
            - "held_pre == 10000 and target_pre == 20000 (EXPOSURE_BASED: max(0 rate floor, 2 x 10000 open exposure))"
            - "case_final == DECIDED_WON and funds_final == FUNDS_RETURNED"
            - "clearing_final == 10000 (sale +10000, receipt debit -10000, win re-credit +10000)"
            - "entry1_type == HOLD (CHARGEBACK_RECEIPT) and entry2_type == RELEASE with entry2_amount == 10000 (CHARGEBACK_WON)"
            - "held_post == 0 and target_post == 0 (exposure set emptied by the terminal win)"

      - name: advance_month_enrollment_cascade
        grounds:
          - calculations.chargeback_ratio
          - calculations.program_threshold_evaluation
          - calculations.program_fine_schedule
          - state_machines.ProgramEnrollment
          - entities.EducationAssignment.fields.module_code
        distinguishing_aspect: |
          Depth-3 chain from a different trigger (advance-month sweep, not a
          network outcome): snapshot posted over threshold -> ProgramEnrollment
          created ACTIVE -> EducationAssignments auto-created (CHARGEBACK_BASICS +
          EVIDENCE_BEST_PRACTICE) and month-1 PROGRAM_FINE assessed -> fee lands
          on the merchant's assessment list with assessed_by_user_id 'system'.
        test_recipe:
          setup:
            - "VISA merchant with 50 June sales and 5 June chargebacks (1000 bps >= 90 and count 5 >= 5 -> VDMP_STANDARD)"
          setup_api_calls:
            - { call: "POST /acquirer/reason-code-rules", as: AcquirerOps, payload: { network: VISA, reason_code: "10.4", category: FRAUD, required_evidence_types: [RECEIPT], merchant_response_days: 7, representment_days: 30, chargeback_fee_cents: 2500, effective_from: "2026-01-01T00:00:00Z" } }
            - call: "POST /acquirer/merchants"
              as: AcquirerOps
              payload: { legal_name: "Sweep M", merchant_category_code: "5411", risk_tier: STANDARD, reserve_rate_bps: 0 }
              captures: { m_id: $.data.id }
            - { call: "POST /acquirer/transactions/batch", as: AcquirerOps, payload: { merchant_id: "${m_id}", network: VISA, count: 50, amount_cents: 10000, occurred_at: "2026-06-10T00:00:00Z", external_ref_prefix: "J6" } }
            - { call: "POST /acquirer/_clock/set_current_utc", as: AcquirerOps, payload: { to_iso8601: "2026-06-15T00:00:00Z" } }
            - { call: "POST /acquirer/chargebacks", as: AcquirerOps, payload: { merchant_id: "${m_id}", transaction_external_ref: "J6-0001", network_case_id: "NC-J1", reason_code: "10.4", amount_cents: 1000 } }
            - { call: "POST /acquirer/chargebacks", as: AcquirerOps, payload: { merchant_id: "${m_id}", transaction_external_ref: "J6-0002", network_case_id: "NC-J2", reason_code: "10.4", amount_cents: 1000 } }
            - { call: "POST /acquirer/chargebacks", as: AcquirerOps, payload: { merchant_id: "${m_id}", transaction_external_ref: "J6-0003", network_case_id: "NC-J3", reason_code: "10.4", amount_cents: 1000 } }
            - { call: "POST /acquirer/chargebacks", as: AcquirerOps, payload: { merchant_id: "${m_id}", transaction_external_ref: "J6-0004", network_case_id: "NC-J4", reason_code: "10.4", amount_cents: 1000 } }
            - { call: "POST /acquirer/chargebacks", as: AcquirerOps, payload: { merchant_id: "${m_id}", transaction_external_ref: "J6-0005", network_case_id: "NC-J5", reason_code: "10.4", amount_cents: 1000 } }
          trigger:
            - call: "POST /acquirer/ops/advance-month"
              as: AcquirerOps
              payload: { period_month: "2026-06", merchant_id: "${m_id}" }
              captures: { snaps: $.data.snapshots_created, enrs: $.data.enrollments_created, fines: $.data.fines_assessed }
            - call: "GET /acquirer/program-enrollments"
              as: RiskOfficer
