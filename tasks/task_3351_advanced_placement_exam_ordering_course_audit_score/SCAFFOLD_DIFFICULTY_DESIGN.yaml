            - "With seat_capacity 2 the merged total 510 exceeds seat_minutes_available 2 * 30 == 60, so error_id == ERR_ALT_SEAT_CONFLICT and AlternateExamRequest.status stays UNDER_REVIEW"
      - name: alternate_same_day_concurrent_count_cap
        grounds:
