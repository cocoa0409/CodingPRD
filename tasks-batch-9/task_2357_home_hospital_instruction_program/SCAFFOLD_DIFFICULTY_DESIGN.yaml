      - name: certification_acceptance_requires_exactly_ten_expected_absence_days_and_rejects_nine
        grounds:
          - validations.priority_11.ERR_ABSENCE_DURATION_TOO_SHORT
          - state_machines.PhysicianCertification.SUBMITTED_to_ACCEPTED
          - calculations.weekly_entitlement_minutes
        distinguishing_aspect: |
          The eligibility floor is an inclusive >= 10, so a 10-day certification is accepted (and yields
          the unbonused 360 weekly minutes because 10 < MID_DURATION_DAYS) while a 9-day certification is
          rejected with 422 and leaves both the certification SUBMITTED and the case in
          PENDING_CERT_REVIEW - no partial entitlement resolution may leak from the failed review.
