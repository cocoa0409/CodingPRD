              as: ProcessEngineer
              captures: { lot_other_line: $.data.id }
          assert:
            - "20 minutes after the incumbent ends: LOT-SCH-LATE-BAD returns HTTP 409 ERR_LINE_SCHEDULE_CONFLICT because 12:20 < 12:00 + 30min and 08:00 < 14:20 + 30min"
            - "one second short of the buffer: LOT-SCH-LATE-EDGE at 12:29:59 also returns HTTP 409 ERR_LINE_SCHEDULE_CONFLICT - the buffer is exclusive"
            - "exactly at the buffer: LOT-SCH-LATE-OK at 12:30:00 is created with 201 because 12:30 < 12:30 is false"
            - "one second inside the buffer on the early side: LOT-SCH-EARLY-BAD ending 07:31 returns HTTP 409 ERR_LINE_SCHEDULE_CONFLICT because 08:00 < 07:31 + 30min"
            - "exactly at the buffer on the early side: LOT-SCH-EARLY-OK ending 07:30 is created with 201 because 08:00 < 08:00 is false"
            - "the resource is the line, not the plant: LOT-SCH-OTHERLINE takes the identical 08:00-12:00 window on EXT-2 and is created with 201"
            - "rejected attempts wrote nothing: ${rod_v2} remains valid across both failed attempts before LOT-SCH-LATE-OK, and GET /production-lots?line_code=EXT-1 finally returns exactly 3 rows (LOT-SCH-1, LOT-SCH-EARLY-OK, LOT-SCH-LATE-OK)"
            - "scope excludes closed lots: a lot whose process_state is SHIPPED or SCRAP_CLOSED no longer blocks its window, so re-scheduling into a scrapped lot's slot succeeds"

      - name: reel_occupancy_half_open_at_return_instant
        resource: "Reel (a physical returnable reel, occupied by at most one lot at a time)"
        interval_semantics: "half-open [occupancy_start_at, returned_at) with NO buffer: a new load is refused only when occupancy_start_at < returned_at, so a load starting exactly at the previous return instant is accepted"
        grounds:
          - validations.priority_62_ERR_REEL_OCCUPANCY_OVERLAP
          - state_machines.Reel.RETURN_PENDING_to_AVAILABLE
          - endpoints.POST_/reels/{id}/load
        distinguishing_aspect: |
          Deliberately the opposite convention on a different resource: the reel
          interval is HALF-OPEN and carries NO buffer, because a reel needs no
          changeover - it is simply unavailable until the instant it is booked
          back in. So the value that is rejected on the line (touching the
          boundary) is exactly the value that is accepted here, and the
          comparison is against a system-recorded instant (returned_at from the
          logical clock) rather than a client-supplied window.
