              payload: { affiliate_id: "${aff_id}", engine: "BING_ADS", window_start: "2026-07-01T00:00:00Z", window_end: "2026-07-15T00:00:00Z", trademark_hits: 0, forced_click_ratio_bps: 0, cookie_stuffing_index: 0, unauthorized_coupon_hits: 0 }
              as: ComplianceAnalyst
