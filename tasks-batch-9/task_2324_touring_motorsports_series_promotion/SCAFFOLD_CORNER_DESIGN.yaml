      - name: corner_error_settlement_preparation_preconditions_and_duplicate_children
        claim_type: Error Triggerable
        grounds:
          - errors.ERR_SAFETY_PLAN_MISSING
          - errors.ERR_PENDING_ORDERS_OUTSTANDING
          - errors.ERR_DUPLICATE_CHILD
