  # ===========================================================================
  # SECTION 6 — Errors (Table 6): every declared error id must be triggerable.
  # The two auth-header codes have no other home; the remaining 70 codes are
  # each triggered by a named instance in the validations, state_machines,
  # calculations, rbac or cross_cutting sections of this file and of §1.8.
  # ===========================================================================
  - section: errors
    instances:
      - name: missing_and_unknown_auth_header_errors_outrank_every_later_check
        claim_type: violation_to_error
        grounds:
          - validations.priority_1
          - validations.priority_2
          - errors[ERR_MISSING_AUTH_HEADERS]
          - errors[ERR_UNKNOWN_ROLE]
        distinguishing_aspect: |
          Both auth-header codes are 401s that must fire before the request body, the path ids or
          the endpoint's role list are ever consulted, and they are ordered against each other: an
          empty X-User-ID is still ERR_MISSING_AUTH_HEADERS even when the role name is valid, while
          a present-but-unrecognised role is ERR_UNKNOWN_ROLE (401) rather than ERR_UNAUTHORIZED
          (403), because priority 2 precedes priority 3. Probing a non-existent id with no headers
          must not leak existence as a 404, and an unparseable body must not surface
          ERR_INVALID_REQUEST ahead of the header check. Every error response carries the standard
          error envelope with error_id and message.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ordinance IZ-2024-01 and AmiSchedule 2026 published; Project P (R-2, 20 units, dev-1) exists in DRAFT."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/ordinances", payload: { code: "IZ-2024-01", effective_date: "2024-01-01", min_project_units_threshold: 10, set_aside_bps_by_district: { "R-2": 1000, "R-4": 1500, "C-2": 2000 }, gap_basis_cents_by_level: { "5000": 24000000, "8000": 18000000, "12000": 12000000 }, fee_gap_level_bps: 5000, surcharge_bps: 350, surcharge_cap_cents: 5000000, discount_tiers: [ { min_pre_discount_cents: 0, discount_bps: 0 }, { min_pre_discount_cents: 20000000, discount_bps: 150 }, { min_pre_discount_cents: 100000000, discount_bps: 400 } ], fee_due_days: 45, alternative_paths_allowed: ["IN_LIEU_FEE", "OFFSITE"] }, as: ProgramAdministrator, captures: { ord_id: $.data.id } }
            - { call: "POST /iz-compliance/ami-schedules", payload: { effective_year: 2026, median_income_cents_by_size: { "1": 9868000, "2": 11278000, "3": 12669800, "4": 14082000, "5": 15214000 }, utility_allowance_cents_by_bedrooms: { "0": 8500, "1": 11000, "2": 14500, "3": 18000 } }, as: ProgramAdministrator, captures: { ami26_id: $.data.id } }
            - { call: "POST /iz-compliance/projects", payload: { name: "Header Hollow", zoning_district: "R-2", total_units: 20, approval_date: "2026-01-15" }, as: Developer, as_user_id: "dev-1", captures: { p_id: $.data.id } }
          trigger:
            # `as: NO_AUTH_HEADERS` means the request is sent with NEITHER X-User-ID nor
            # X-User-Role. `as: EMPTY_USER_ID` means X-User-Role: Developer with X-User-ID: "".
            # `as: HousingInspector` is a syntactically fine but undeclared role name.
            - { call: "POST /iz-compliance/projects", payload: { name: "Ghost", zoning_district: "R-2", total_units: 20, approval_date: "2026-01-15" }, as: NO_AUTH_HEADERS, captures: { e1: $.data.error_id } }
            - { call: "GET /iz-compliance/projects/${p_id}", payload: {}, as: EMPTY_USER_ID, captures: { e2: $.data.error_id } }
            - { call: "GET /iz-compliance/projects/00000000-0000-0000-0000-0000000000ff", payload: {}, as: NO_AUTH_HEADERS, captures: { e3: $.data.error_id } }
            - { call: "GET /iz-compliance/trust-fund-summary", payload: {}, as: HousingInspector, as_user_id: "who-1", captures: { e4: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-01T00:00:00Z" }, as: HousingInspector, as_user_id: "who-1", captures: { e5: $.data.error_id } }
            - { call: "POST /iz-compliance/ordinances", payload: { code: "" }, as: HousingInspector, as_user_id: "who-1", captures: { e6: $.data.error_id } }
          assert:
            - "the header-less create returns 401 ERR_MISSING_AUTH_HEADERS and creates nothing: a later authenticated list shows no project named 'Ghost'"
            - "the empty X-User-ID read returns 401 ERR_MISSING_AUTH_HEADERS — a valid role name does not rescue a blank identity"
            - "the header-less read of a non-existent project id returns 401 ERR_MISSING_AUTH_HEADERS, NOT 404: priority 1 precedes the priority-5 path-id checks and existence is never leaked to an unauthenticated caller"
            - "the undeclared role reading the fund summary returns 401 ERR_UNKNOWN_ROLE, NOT 403 ERR_UNAUTHORIZED — priority 2 precedes priority 3 even though FundAuditor and ProgramAdministrator are the only permitted readers"
            - "the undeclared role calling the clock returns 401 ERR_UNKNOWN_ROLE even though the clock endpoint admits all five declared roles — the role must first BE a declared role"
            - "the undeclared role posting a structurally invalid ordinance body returns 401 ERR_UNKNOWN_ROLE, NOT 400 ERR_INVALID_REQUEST: priority 2 precedes priority 4, and the clock is still at 2026-08-01T00:00:00Z because the rejected clock call had no effect"
            - "every one of the six responses carries response_type error with data.error_id and data.message present, and no meta.api_request_id is missing"

  # ===========================================================================
  # SECTION 7 — RBAC (Table 7 rows): exclusive vs shared operations, ownership
  # scoping and the four-eyes rule.
  # ===========================================================================
  - section: rbac
    instances:
      - name: the_fund_auditor_is_a_read_only_role_and_the_fund_reads_are_exclusive
        claim_type: exclusive_operation
        grounds:
          - validations.priority_3
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          FundAuditor appears in the roles list of many reads and of NO write, so the role boundary
          is only observable by pairing refusals with the reads that do succeed. The exclusivity
          runs the other way too: the trust-fund ledger and disbursement reads are restricted to
          ProgramAdministrator and FundAuditor, so a Developer — who may read projects, units and
          fees — is refused the fund summary. Every refusal is a 403 ERR_UNAUTHORIZED that leaves
          no trace, which the unchanged project version and empty disbursement list prove.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ordinance IZ-2024-01 and AmiSchedule 2026 published."
            - "Project P (R-2, 20 units, dev-1) screened SUBJECT and IN_LIEU_FEE elected, with a FULL assessment of 48934800 paid in full so the fund holds money to draw against."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/ordinances", payload: { code: "IZ-2024-01", effective_date: "2024-01-01", min_project_units_threshold: 10, set_aside_bps_by_district: { "R-2": 1000, "R-4": 1500, "C-2": 2000 }, gap_basis_cents_by_level: { "5000": 24000000, "8000": 18000000, "12000": 12000000 }, fee_gap_level_bps: 5000, surcharge_bps: 350, surcharge_cap_cents: 5000000, discount_tiers: [ { min_pre_discount_cents: 0, discount_bps: 0 }, { min_pre_discount_cents: 20000000, discount_bps: 150 }, { min_pre_discount_cents: 100000000, discount_bps: 400 } ], fee_due_days: 45, alternative_paths_allowed: ["IN_LIEU_FEE", "OFFSITE"] }, as: ProgramAdministrator, captures: { ord_id: $.data.id } }
            - { call: "POST /iz-compliance/ami-schedules", payload: { effective_year: 2026, median_income_cents_by_size: { "1": 9868000, "2": 11278000, "3": 12669800, "4": 14082000, "5": 15214000 }, utility_allowance_cents_by_bedrooms: { "0": 8500, "1": 11000, "2": 14500, "3": 18000 } }, as: ProgramAdministrator, captures: { ami26_id: $.data.id } }
            - { call: "POST /iz-compliance/projects", payload: { name: "Audit Alley", zoning_district: "R-2", total_units: 20, approval_date: "2026-01-15" }, as: Developer, as_user_id: "dev-1", captures: { p_id: $.data.id } }
