    roles: [ProjectManager]
    code: 201
    input: [name, "max_wind_mph?"]
    output: Crew
    side_effects: ["create Crew"]
  - method: GET
    path: "/crews/{id}"
    description: "Fetch a Crew."
    roles: [ProjectManager, FinanceOfficer]
    code: 200
    input: []
    output: Crew
    side_effects: []
  - method: POST
    path: "/projects/{id}/work-schedules"
    description: "Propose a crew work window for a milestone."
    roles: [ProjectManager]
    code: 201
    input: [crew_id, milestone, window_start_iso, window_end_iso, forecast_wind_mph]
    output: WorkSchedule
    side_effects: ["create WorkSchedule PROPOSED"]
  - method: GET
    path: "/work-schedules/{id}"
    description: "Fetch a WorkSchedule."
    roles: [ProjectManager, FinanceOfficer]
    code: 200
    input: []
    output: WorkSchedule
    side_effects: []
  - method: GET
    path: "/work-schedules"
    description: "List work schedules. Reverse-reachability for WorkSchedule.project_id and WorkSchedule.crew_id."
    roles: [ProjectManager, FinanceOfficer]
    code: 200
    input: ["project_id?", "crew_id?", "limit?", "offset?"]
    output: WorkSchedule[]
    side_effects: []
  - method: POST
    path: "/work-schedules/{id}/confirm"
    description: "Confirm a window (weather + overlap + compliance + material gates). Too-high wind parks it on WEATHER_HOLD."
    roles: [ProjectManager]
    code: 200
    input: []
    output: WorkSchedule
    side_effects: ["WorkSchedule -> CONFIRMED or WEATHER_HOLD", "if project ORDERED -> SCHEDULED"]
  - method: POST
    path: "/work-schedules/{id}/reweather"
    description: "Re-evaluate a WEATHER_HOLD window with a revised forecast and confirm it."
    roles: [ProjectManager]
    code: 200
    input: [forecast_wind_mph]
    output: WorkSchedule
    side_effects: ["update forecast_wind_mph", "WorkSchedule -> CONFIRMED", "if project ORDERED -> SCHEDULED"]
  - method: POST
    path: "/work-schedules/{id}/start"
    description: "Start a confirmed window; advances project SCHEDULED->IN_PROGRESS."
    roles: [ProjectManager]
    code: 200
    input: []
    output: WorkSchedule
    side_effects: ["Project workflow_status -> IN_PROGRESS"]
  - method: POST
    path: "/work-schedules/{id}/complete"
    description: "Complete a milestone window (enables its progress draw)."
    roles: [ProjectManager]
    code: 200
    input: []
    output: WorkSchedule
    side_effects: ["WorkSchedule -> COMPLETED"]
  - method: POST
    path: "/work-schedules/{id}/cancel"
    description: "Cancel a window; cascades any draw on it to REJECTED."
    roles: [ProjectManager]
    code: 200
    input: []
    output: WorkSchedule
    side_effects: ["WorkSchedule -> CANCELLED", "cascade ProgressDraw {REQUESTED,APPROVED} -> REJECTED"]

  # ---- progress draw ----
  - method: POST
    path: "/projects/{id}/progress-draws"
    description: "Request a progress draw against a completed milestone window."
    roles: [ProjectManager]
    code: 201
    input: [work_schedule_id, milestone_pct]
    output: ProgressDraw
    side_effects: ["create ProgressDraw REQUESTED"]
  - method: GET
    path: "/progress-draws/{id}"
    description: "Fetch a ProgressDraw with computed gross/retainage/net."
    roles: [ProjectManager, FinanceOfficer]
    code: 200
    input: []
    output: ProgressDraw
    side_effects: []
  - method: GET
    path: "/progress-draws"
    description: "List progress draws. Reverse-reachability for ProgressDraw.project_id and ProgressDraw.work_schedule_id."
    roles: [ProjectManager, FinanceOfficer]
    code: 200
    input: ["project_id?", "work_schedule_id?", "limit?", "offset?"]
    output: ProgressDraw[]
    side_effects: []
  - method: POST
    path: "/progress-draws/{id}/approve"
    description: "Approve a draw (requires the milestone COMPLETED); computes gross/retainage/net (calc draw_release_amount)."
    roles: [ProjectManager]
    code: 200
    input: []
    output: ProgressDraw
    side_effects: ["ProgressDraw -> APPROVED", "compute gross_amount_cents/retainage_cents/net_released_cents", "stamp approved_by_staff_id = X-User-ID"]
  - method: POST
    path: "/progress-draws/{id}/release"
    description: "FinanceOfficer releases an approved draw (segregation of duties + OCC on Project.version)."
    roles: [FinanceOfficer]
    code: 200
    input: [expected_project_version]
    output: ProgressDraw
    side_effects: ["ProgressDraw -> RELEASED", "Project.amount_released_cents += net_released_cents", "Project.retainage_held_cents += retainage_cents", "increments Project.version by 1"]
  - method: POST
    path: "/progress-draws/{id}/clawback"
    description: "FinanceOfficer claws back a released draw; exactly reverses the release ledger effects. OCC-guarded."
    roles: [FinanceOfficer]
    code: 200
    input: [expected_project_version]
    output: ProgressDraw
    side_effects: ["ProgressDraw -> CLAWED_BACK", "Project.amount_released_cents -= net_released_cents", "Project.retainage_held_cents -= retainage_cents", "increments Project.version by 1"]
  - method: POST
    path: "/progress-draws/{id}/reject"
    description: "Reject a requested/approved draw."
    roles: [ProjectManager]
    code: 200
    input: []
    output: ProgressDraw
    side_effects: ["ProgressDraw -> REJECTED"]

  # ---- warranty ----
  - method: GET
    path: "/warranties/{id}"
