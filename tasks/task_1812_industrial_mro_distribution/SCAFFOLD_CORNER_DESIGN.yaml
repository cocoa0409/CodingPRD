            - call: "POST /mro/orders/${o_wc}/confirm"
              as: DistributionAdmin
              captures: { st: $.data.status }
          assert:
            - "err == ERR_HAZMAT_REGION_RESTRICTED (delivery into a restricted state)"
            - "st == CONFIRMED (WILL_CALL is exempt from both hazmat shipping checks)"

      - name: ground_only_method_matrix
        claim_type: conditional_validation
        grounds: ["validations[priority=7]", "errors[ERR_HAZMAT_METHOD_RESTRICTED]"]
        distinguishing_aspect: "GROUND_ONLY items ship STANDARD (ground) but not SAME_DAY (express): the SAME_DAY confirm fails with ERR_HAZMAT_METHOD_RESTRICTED while the STANDARD confirm succeeds."
        test_recipe:
