      - name: zero_denominator_boundary_on_departure_counts
        grounds:
          - validations.priority_28
          - validations.priority_23
          - calculations.departure_count_reconciliation
          - calculations.carrier_completion_factor
          - errors.ERR_NO_SCHEDULED_DEPARTURES
        boundary_metric: "integer departure counts at zero — scheduled_departures at 0 versus 1 on a report, and the ADJUSTED completion-factor denominator (sum_scheduled minus sum_weather) at 0 versus 1 on a review"
        distinguishing_aspect: |
          The metric is a discrete count whose only interesting value is zero, and it is probed at two
          different sites for the same error id: an input count that must be at least 1, and a
          *derived* denominator that can collapse to 0 even though every input count is positive. The
          balance rule at priority 23 is satisfied throughout (0 == 0 + 0 + 0 and 6 == 0 + 0 + 6), so
