      - name: process_run_window_shape_is_enforced_at_both_bounds
        claim_type: violation_to_error
        grounds:
          - validations.priority_18
          - errors.ERR_INVALID_WINDOW
          - calculations.instrument_minutes_ledger.constants.MIN_WINDOW_MINUTES
          - calculations.instrument_minutes_ledger.constants.MAX_WINDOW_MINUTES
        distinguishing_aspect: |
          Three malformed windows must each return 422 ERR_INVALID_WINDOW — 29 minutes (one under
          MIN_WINDOW_MINUTES), 481 minutes (one over MAX_WINDOW_MINUTES) and an end before its start —
          while the 30-minute window immediately after them is accepted, so the bounds are inclusive; and
          no refused window may book a single minute on the instrument.
        test_recipe:
          setup:
            - "A RELEASED design OD-2540-A (aperture 120.0 mm, RMS 0.0400, tolerance budget 0.0800, transmitted-wavefront budget 0.1050, one 0.0375-wave ACTIVE allocation, verdict PASS) and a RELEASED lot GL-2540-1 with total_blank_count 20."
            - "Interferometer IF-2540-1 calibrated at the clock's start value with base_uncertainty_waves 0.0010, so capability_ratio 0.0500 and status CALIBRATED."
            - "One work order WO-2540-1 in BLANKS_RESERVED, so a POLISHING run is admissible by the stage gate."
            - "booked_minutes_total starts at 0."
            - "The logical clock stays at its start value 2026-08-01T00:00:00Z unless stated otherwise."
          setup_api_calls:
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-A", aperture_mm: 120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050 }
              as: OpticsEngineer
              captures: { d1: $.data.id }
            - call: "POST /optics/optical-designs/${d1}/tolerance-allocations"
              payload: { contributor_type: "SURFACE_IRREGULARITY", sensitivity_waves_per_unit: 1.5, manufacturing_tolerance_units: 0.0250 }
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/tolerance-analysis"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/release"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/glass-lots"
              payload: { lot_code: "GL-2540-1", glass_type: "N-BK7", melt_index_nd: 1.516800, total_blank_count: 20, declared_index_homogeneity_grade: "H2", declared_striae_grade: "A" }
              as: ProcurementOfficer
              captures: { g1: $.data.id }
            - call: "POST /optics/glass-lots/${g1}/certification"
              payload: { measured_index_homogeneity_grade: "H3", measured_striae_grade: "B", certificate_reference: "CERT-2540-1" }
              as: ProcurementOfficer
              captures: { g1v: $.data.version }
            - call: "POST /optics/work-orders"
              payload: { wo_code: "WO-2540-1", design_id: "${d1}", glass_lot_id: "${g1}", element_count: 2, expected_glass_lot_version: "${g1v}" }
              as: ProcessTechnician
              captures: { w1: $.data.id }
            - call: "POST /optics/metrology-instruments"
              payload: { instrument_code: "IF-2540-1", instrument_type: "PHASE_SHIFTING_INTERFEROMETER", base_uncertainty_waves: 0.0010, last_calibrated_utc: "2026-08-01T00:00:00Z", lateral_resolution_um: 5.0 }
              as: PlantAdmin
              captures: { i1: $.data.id }
          trigger:
            - call: "POST /optics/process-runs"
              payload: { work_order_id: "${w1}", metrology_instrument_id: "${i1}", run_stage: "POLISHING", metrology_window_start_utc: "2026-08-01T08:00:00Z", metrology_window_end_utc: "2026-08-01T08:29:00Z" }
              as: ProcessTechnician
            - call: "POST /optics/process-runs"
              payload: { work_order_id: "${w1}", metrology_instrument_id: "${i1}", run_stage: "POLISHING", metrology_window_start_utc: "2026-08-01T08:00:00Z", metrology_window_end_utc: "2026-08-01T16:01:00Z" }
              as: ProcessTechnician
            - call: "POST /optics/process-runs"
              payload: { work_order_id: "${w1}", metrology_instrument_id: "${i1}", run_stage: "POLISHING", metrology_window_start_utc: "2026-08-01T09:00:00Z", metrology_window_end_utc: "2026-08-01T08:00:00Z" }
              as: ProcessTechnician
            - call: "GET /optics/metrology-instruments/${i1}"
              payload: {}
              as: PlantAdmin
              as_user_id: "pa-001"
            - call: "POST /optics/process-runs"
              payload: { work_order_id: "${w1}", metrology_instrument_id: "${i1}", run_stage: "POLISHING", metrology_window_start_utc: "2026-08-01T08:00:00Z", metrology_window_end_utc: "2026-08-01T08:30:00Z" }
              as: ProcessTechnician
              captures: { r1: $.data.id }
            - call: "GET /optics/metrology-instruments/${i1}"
              payload: {}
              as: PlantAdmin
              as_user_id: "pa-001"
          assert:
            - "the 29-minute window returns HTTP 422 with error_id ERR_INVALID_WINDOW"
            - "the 481-minute window returns HTTP 422 with error_id ERR_INVALID_WINDOW"
            - "the inverted window returns HTTP 422 with error_id ERR_INVALID_WINDOW"
            - "MetrologyInstrument.${i1}.booked_minutes_total == 0 after the three refusals"
            - "the 30-minute window returns HTTP 201 with ProcessRun.${r1}.window_minutes == 30 and run_status SCHEDULED"
            - "MetrologyInstrument.${i1}.booked_minutes_total == 30"
            - "WorkOrder.${w1}.process_status == BLANKS_RESERVED (scheduling alone does not advance the stage)"

      - name: role_check_outranks_the_path_existence_check
        claim_type: priority_ordering
        grounds:
          - validations.priority_2
          - validations.priority_3
          - errors.ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: |
          The Priority-conflict claim across the two cheapest checks: a forbidden role addressing an
          unstored id must be told about the role, not about the id.
        excluded_because:
          difficulty_instance: glass_lot_block_rejects_wrong_role_before_reporting_missing_lot
          rationale: |
            That §1.8 instance calls the block endpoint as a non-permitted role against a never-stored
            lot id and asserts ERR_ROLE_NOT_PERMITTED (403) rather than ERR_GLASS_LOT_NOT_FOUND, then
            repeats both halves separately. The ordering claim is fully pinned there.

      - name: the_stage_gate_outranks_the_instrument_window_conflict
        claim_type: priority_ordering
        grounds:
          - validations.priority_14
          - validations.priority_19
          - errors.ERR_RUN_STAGE_OUT_OF_ORDER
          - errors.ERR_INSTRUMENT_WINDOW_CONFLICT
        distinguishing_aspect: |
          Two business rules violated by one process-run create (wrong stage for the work order's
          process_status and a window inside another run's purge buffer) must answer with priority 14.
        excluded_because:
          difficulty_instance: run_stage_order_outranks_instrument_window_conflict_on_process_run_create
          rationale: |
            That §1.8 instance builds exactly that double violation and then removes one defect at a
            time to show each error surfacing on its own.

      - name: segregation_of_duties_outranks_the_calibration_gate_on_a_signature
        claim_type: priority_ordering
        grounds:
          - validations.priority_12
          - validations.priority_16
          - errors.ERR_SEGREGATION_OF_DUTIES
          - errors.ERR_INSTRUMENT_CALIBRATION_OVERDUE
        distinguishing_aspect: |
          A signature that is both self-signed and made on an overdue instrument must return the
          segregation-of-duties 403 from priority 12, not the 409 from priority 16.
        excluded_because:
          difficulty_instance: segregation_of_duties_outranks_calibration_overdue_on_report_sign
          rationale: |
            That §1.8 instance advances the clock past the calibration interval, signs with the
            recorder's own X-User-ID and asserts the 403, then fixes each defect separately.

      - name: grade_suitability_outranks_blank_sufficiency_on_a_work_order_create
        claim_type: priority_ordering
        grounds:
          - validations.priority_21
          - validations.priority_26
          - errors.ERR_GLASS_GRADE_UNSUITABLE
          - errors.ERR_INSUFFICIENT_BLANKS
        distinguishing_aspect: |
          When a lot is both too coarse for the design and too small for the reservation, priority 21 must
          answer before priority 26.
        excluded_because:
          difficulty_instance: glass_grade_suitability_outranks_blank_sufficiency_on_work_order_create
          rationale: |
            That §1.8 instance certifies a lot to H4/C against an H3/B design and sizes it below the
            reservation, asserting ERR_GLASS_GRADE_UNSUITABLE and then each rule in isolation.

      - name: the_instrument_purge_buffer_is_inclusive_at_fifteen_minutes
        claim_type: violation_to_error
        grounds:
          - validations.priority_19
          - calculations.instrument_minutes_ledger
          - errors.ERR_INSTRUMENT_WINDOW_CONFLICT
        distinguishing_aspect: |
          The Temporal-validation claim on the instrument: a gap of exactly INSTRUMENT_PURGE_MINUTES is
          admissible and fourteen minutes is not.
        excluded_because:
          difficulty_instance: instrument_purge_buffer_admits_exact_fifteen_minute_gap_and_rejects_fourteen
          rationale: |
            That §1.8 instance schedules the neighbouring windows at both gaps on the same instrument
            and asserts the admitted booking, the refusal and booked_minutes_total after each.

      - name: chamber_intervals_are_half_open_and_capacity_is_inclusive
        claim_type: violation_to_error
        grounds:
          - validations.priority_20
          - calculations.chamber_capacity_occupancy
          - errors.ERR_CHAMBER_CAPACITY_EXCEEDED
        distinguishing_aspect: |
          The Aggregate-validation claim on the chamber: touching intervals never overlap, and the booking
          that makes occupancy equal slot_capacity is the one refused.
        excluded_because:
          difficulty_instance: chamber_half_open_interval_admits_touching_booking_and_rejects_overlap_at_capacity
          rationale: |
            That §1.8 instance books a touching interval (admitted) and an overlapping one at capacity
            (refused) on the same chamber, with the occupancy count asserted at each step.

  # =======================================================================
  - section: endpoints
    instances:

      - name: coating_chamber_create_read_and_list_are_the_plain_crud_triple
        claim_type: standard_crud
        grounds:
          - endpoints.POST_/optics/coating-chambers
          - endpoints.GET_/optics/coating-chambers/{id}
          - endpoints.GET_/optics/coating-chambers
          - entities.CoatingChamber
          - errors.ERR_CHAMBER_NOT_FOUND
        distinguishing_aspect: |
          CoatingChamber is the one entity with no state machine and no computed field, so its three CRUD
          endpoints can be exercised on their own: the create echoes the input and defaults coating_type,
          the single read returns the identical row, the collection read filters on coating_type and pages
          with limit/offset, and an unknown id on the single read is a 404 ERR_CHAMBER_NOT_FOUND.
        test_recipe:
          setup:
            - "Empty database."
            - "The logical clock stays at its start value 2026-08-01T00:00:00Z unless stated otherwise."
            - "Two chambers are created: CH-2540-1 (slot_capacity 2, coating_type omitted so it defaults to AR_BROADBAND) and CH-2540-2 (slot_capacity 1, coating_type DIELECTRIC_MIRROR)."
            - "Only PlantAdmin may create a chamber; every role may read one."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
          trigger:
            - call: "POST /optics/coating-chambers"
              payload: { chamber_code: "CH-2540-1", slot_capacity: 2 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { ch1: $.data.id }
            - call: "POST /optics/coating-chambers"
              payload: { chamber_code: "CH-2540-2", slot_capacity: 1, coating_type: "DIELECTRIC_MIRROR" }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { ch2: $.data.id }
            - call: "GET /optics/coating-chambers/${ch1}"
              payload: {}
              as: ProcessTechnician
            - call: "GET /optics/coating-chambers"
              payload: { limit: 10, offset: 0 }
              as: ProcessTechnician
            - call: "GET /optics/coating-chambers"
              payload: { coating_type: "DIELECTRIC_MIRROR", limit: 10, offset: 0 }
              as: MetrologyTechnician
              as_user_id: "mt-001"
            - call: "GET /optics/coating-chambers"
              payload: { limit: 1, offset: 1 }
              as: PlantAdmin
              as_user_id: "pa-001"
            - call: "GET /optics/coating-chambers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: QualityManager
              as_user_id: "qm-001"
          assert:
            - "the first create returns HTTP 201 with chamber_code CH-2540-1, slot_capacity 2 and coating_type AR_BROADBAND (the declared default)"
            - "the second create returns HTTP 201 with coating_type DIELECTRIC_MIRROR and a different id"
            - "the single read returns HTTP 200 and every field of ${ch1} unchanged, including id, created_at and version 1"
            - "the unfiltered list returns exactly 2 rows in created_at ASC order, ${ch1} first"
            - "the coating_type filter returns exactly 1 row, ${ch2}"
            - "limit 1 / offset 1 returns exactly 1 row, ${ch2}, so paging follows the same ordering"
            - "the read on the all-zeros uuid returns HTTP 404 with error_id ERR_CHAMBER_NOT_FOUND"

      - name: run_start_stamps_the_clock_and_drags_the_work_order_to_the_run_stage
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/optics/process-runs/{id}/start
          - state_machines.ProcessRun.SCHEDULED_to_IN_PROCESS
          - state_machines.WorkOrder.process_status.BLANKS_RESERVED_to_POLISHING
          - conventions.logical_clock
        distinguishing_aspect: |
          The start action takes no payload yet writes three places at once: the run's own run_status, the
          run's started_at_utc from the logical clock (not from the reserved window and not from wall
          time), and the work order's process_status, which is set to the run's stage. The instrument's
          booked minutes were already taken at scheduling and the action must not book them twice.
        test_recipe:
          setup:
            - "A RELEASED design OD-2540-A (aperture 120.0 mm, RMS 0.0400, tolerance budget 0.0800, transmitted-wavefront budget 0.1050, one ACTIVE 0.0375-wave allocation, verdict PASS) and a RELEASED lot GL-2540-1 with total_blank_count 20 certified H3/B."
            - "Interferometer IF-2540-1 calibrated at the clock's start value with base_uncertainty_waves 0.0010, so capability_ratio_at_scheduling is 0.0500."
            - "One work order WO-2540-1 (element_count 2) in BLANKS_RESERVED / UNCLASSIFIED."
            - "One SCHEDULED POLISHING run r1 on IF-2540-1 reserving 2026-08-01T08:00:00Z..10:00:00Z, so window_minutes is 120 and booked_minutes_total is already 120."
            - "The clock is then moved to 2026-08-01T09:15:00Z, an instant that is neither the window start nor the window end."
          setup_api_calls:
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-A", aperture_mm: 120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050 }
              as: OpticsEngineer
              captures: { d1: $.data.id }
            - call: "POST /optics/optical-designs/${d1}/tolerance-allocations"
              payload: { contributor_type: "SURFACE_IRREGULARITY", sensitivity_waves_per_unit: 1.5, manufacturing_tolerance_units: 0.0250 }
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/tolerance-analysis"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/release"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/glass-lots"
              payload: { lot_code: "GL-2540-1", glass_type: "N-BK7", melt_index_nd: 1.516800, total_blank_count: 20, declared_index_homogeneity_grade: "H2", declared_striae_grade: "A" }
              as: ProcurementOfficer
              captures: { g1: $.data.id }
