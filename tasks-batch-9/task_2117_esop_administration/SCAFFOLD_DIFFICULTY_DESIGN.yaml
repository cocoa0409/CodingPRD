scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: loan_share_release_principal_only_vs_principal_and_interest
        grounds:
          - calculations.loan_share_release
          - entities.EsopLoan.fields.release_method
          - entities.LoanPayment.fields.released_shares
          - endpoints.POST /loan-payments
        distinguishing_aspect: |
          This instance's dual variant lives on the EsopLoan/LoanPayment domain: two loans
          carrying byte-identical principal, interest, suspense and balance figures release
          60000 versus 64285 shares purely because release_method selects a different
          denominator, so the divergence is 4285 shares on identical inputs.
        test_recipe:
          setup:
            - "Two plans, each OPEN, each carrying exactly one leveraged loan with original principal 4000000000 cents, original interest 1600000000 cents and 600000 pledged shares."
            - "The first loan declares release_method PRINCIPAL_ONLY, the second PRINCIPAL_AND_INTEREST. Nothing else differs."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-30T00:00:00Z" }
              as: PlanAdministrator
              as_user_id: "tpa-01"
            - call: "POST /plans"
              payload: { plan_name: "Ironwood PO", sponsor_name: "Ironwood Manufacturing Inc.", plan_year: 2026, total_shares_outstanding: 1000000, vesting_schedule: "GRADED_6YR", service_measurement_method: "TERMINATION_DATE_MEASURE", forfeiture_policy: "REALLOCATE_PRO_RATA", distribution_policy: "FIVE_YEAR_INSTALLMENT" }
              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { plan_po_id: $.data.id }
            - call: "POST /esop-loans"
              payload: { plan_id: "${plan_po_id}", lender_name: "First Meridian Bank", original_principal_cents: 4000000000, original_interest_cents: 1600000000, shares_pledged: 600000, release_method: "PRINCIPAL_ONLY" }
              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { loan_po_id: $.data.id }
            - call: "POST /plans"
              payload: { plan_name: "Ironwood PI", sponsor_name: "Ironwood Manufacturing Inc.", plan_year: 2026, total_shares_outstanding: 1000000, vesting_schedule: "GRADED_6YR", service_measurement_method: "TERMINATION_DATE_MEASURE", forfeiture_policy: "REALLOCATE_PRO_RATA", distribution_policy: "FIVE_YEAR_INSTALLMENT" }
              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { plan_pi_id: $.data.id }
            - call: "POST /esop-loans"
              payload: { plan_id: "${plan_pi_id}", lender_name: "First Meridian Bank", original_principal_cents: 4000000000, original_interest_cents: 1600000000, shares_pledged: 600000, release_method: "PRINCIPAL_AND_INTEREST" }
              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { loan_pi_id: $.data.id }
          trigger:
            - call: "POST /loan-payments"
              payload: { loan_id: "${loan_po_id}", payment_date: "2026-06-30", principal_cents: 400000000, interest_cents: 200000000 }
              as: PlanAdministrator
              as_user_id: "tpa-01"
              captures: { pay_po_id: $.data.id, released_po: $.data.released_shares }
            - call: "POST /loan-payments"
              payload: { loan_id: "${loan_pi_id}", payment_date: "2026-06-30", principal_cents: 400000000, interest_cents: 200000000 }
              as: PlanAdministrator
              as_user_id: "tpa-01"
              captures: { pay_pi_id: $.data.id, released_pi: $.data.released_shares }
          assert:
            - "LoanPayment.${pay_po_id}.released_shares == 60000"
            - "LoanPayment.${pay_pi_id}.released_shares == 64285"
            - "LoanPayment.${pay_po_id}.released_shares != LoanPayment.${pay_pi_id}.released_shares"
            - "LoanPayment.${pay_po_id}.release_method_applied == PRINCIPAL_ONLY"
            - "LoanPayment.${pay_pi_id}.release_method_applied == PRINCIPAL_AND_INTEREST"
            - "LoanPayment.${pay_po_id}.suspense_shares_before == 600000 and LoanPayment.${pay_po_id}.suspense_shares_after == 540000"
            - "LoanPayment.${pay_pi_id}.suspense_shares_after == 535715"
            - "EsopLoan.${loan_po_id}.suspense_shares == 540000 and EsopLoan.${loan_po_id}.released_shares_cumulative == 60000"
            - "EsopLoan.${loan_pi_id}.suspense_shares == 535715 and EsopLoan.${loan_pi_id}.released_shares_cumulative == 64285"
            - "EsopPlan.${plan_po_id}.unallocated_released_shares == 60000 and EsopPlan.${plan_po_id}.suspense_shares == 540000"
            - "EsopPlan.${plan_pi_id}.unallocated_released_shares == 64285 and EsopPlan.${plan_pi_id}.suspense_shares == 535715"

      - name: vesting_measurement_termination_date_vs_plan_year_end
        grounds:
          - calculations.participant_vested_percentage
          - entities.EsopPlan.fields.service_measurement_method
          - entities.Participant.fields.vested_percentage
          - state_machines.Participant.ACTIVE_to_TERMINATED
        distinguishing_aspect: |
          This instance's dual variant lives on the Participant domain, not the loan domain:
          two participants with identical hire_date 2021-03-01 and identical termination_date
          2026-01-15 are credited 4 versus 5 whole years of service and therefore 60 versus
          80 percent vesting, solely because their plans declare different
          service_measurement_method values.
        test_recipe:
          setup:
            - "Two OPEN plans for plan_year 2026, both on GRADED_6YR, differing only in service_measurement_method."
            - "One ACTIVE participant in each plan, both hired 2021-03-01, both with zero allocated shares."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: PlanSponsor
              as_user_id: "sponsor-01"
            - call: "POST /plans"
              payload: { plan_name: "Measure-T", sponsor_name: "Northgate Tooling Inc.", plan_year: 2026, total_shares_outstanding: 1000000, vesting_schedule: "GRADED_6YR", service_measurement_method: "TERMINATION_DATE_MEASURE", forfeiture_policy: "REALLOCATE_PRO_RATA", distribution_policy: "FIVE_YEAR_INSTALLMENT" }
              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { plan_t_id: $.data.id }
            - call: "POST /plans"
              payload: { plan_name: "Measure-Y", sponsor_name: "Northgate Tooling Inc.", plan_year: 2026, total_shares_outstanding: 1000000, vesting_schedule: "GRADED_6YR", service_measurement_method: "PLAN_YEAR_END_MEASURE", forfeiture_policy: "REALLOCATE_PRO_RATA", distribution_policy: "FIVE_YEAR_INSTALLMENT" }
              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { plan_y_id: $.data.id }
            - call: "POST /participants"
              payload: { plan_id: "${plan_t_id}", employee_number: "E-201", date_of_birth: "1985-06-10", hire_date: "2021-03-01", eligible_compensation_cents: 34500000 }
              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { p_t_id: $.data.id }
            - call: "POST /participants"
              payload: { plan_id: "${plan_y_id}", employee_number: "E-201", date_of_birth: "1985-06-10", hire_date: "2021-03-01", eligible_compensation_cents: 34500000 }
              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { p_y_id: $.data.id }
          trigger:
            - call: "POST /participants/${p_t_id}/terminate"
              payload: { termination_date: "2026-01-15", termination_reason: "TERMINATION" }
              as: PlanSponsor
              as_user_id: "sponsor-01"
            - call: "POST /participants/${p_y_id}/terminate"
              payload: { termination_date: "2026-01-15", termination_reason: "TERMINATION" }
              as: PlanSponsor
              as_user_id: "sponsor-01"
          assert:
            - "Participant.${p_t_id}.years_of_service == 4"
            - "Participant.${p_t_id}.vested_percentage == 60"
            - "Participant.${p_y_id}.years_of_service == 5"
            - "Participant.${p_y_id}.vested_percentage == 80"
            - "Participant.${p_t_id}.vested_percentage != Participant.${p_y_id}.vested_percentage"
            - "Participant.${p_t_id}.status == TERMINATED and Participant.${p_y_id}.status == TERMINATED"
            - "Participant.${p_t_id}.termination_date == 2026-01-15"

      - name: repurchase_sweep_strict_order_vs_best_fit
        grounds:
          - calculations.repurchase_funding_waterfall
          - entities.EsopPlan.fields.sweep_mode
          - endpoints.POST /plans/{plan_id}/repurchase-sweeps
        distinguishing_aspect: |
          This instance's dual variant lives on the EsopPlan cash domain: with a spendable
          reserve of 3000000 cents and a queue of a 3562500-cent exercise ahead of a
          2850000-cent one, STRICT_ORDER funds nothing while BEST_FIT funds the second,
          so funded_count is 0 versus 1 on identical queues.
        test_recipe:
          setup:
            - "A plan on sweep_mode STRICT_ORDER with an approved share price of 7125 cents, one TERMINATED participant holding 900 delivered shares and an open put window."
            - "Two PENDING put option exercises for that participant, the earlier for 500 shares (3562500 cents) and the later for 400 shares (2850000 cents), both priority_class TERMINATION."
            - "repurchase_reserve_cents is 3000000 and repurchase_reserve_floor_cents is 0, so the whole reserve is spendable and only the cheaper exercise fits."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlanSponsor
              as_user_id: "sponsor-01"
            - call: "POST /plans"
              payload: { plan_name: "Cedar Valley Strict", sponsor_name: "Cedar Valley Foods LLC", plan_year: 2026, total_shares_outstanding: 1000000, vesting_schedule: "CLIFF_3YR", service_measurement_method: "TERMINATION_DATE_MEASURE", forfeiture_policy: "REALLOCATE_PRO_RATA", distribution_policy: "LUMP_SUM", sweep_mode: "STRICT_ORDER", repurchase_reserve_floor_cents: 0 }
              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { plan_id: $.data.id }
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", employee_number: "E-100", date_of_birth: "1975-07-04", hire_date: "2012-02-01", eligible_compensation_cents: 34500000 }
              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { p1_id: $.data.id }
            - call: "POST /plans/${plan_id}/close-year"
              payload: {}
              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { plan_v_closed: $.data.version }
            - call: "POST /valuations"
              payload: { plan_id: "${plan_id}", plan_year: 2026, enterprise_value_cents: 12000000000, debt_outstanding_cents: 3000000000, non_operating_assets_cents: 500000000, control_premium_bps: 1500, marketability_discount_bps: 2500, effective_from_date: "2026-01-01", effective_to_date: "2027-01-01", expected_plan_version: "${plan_v_closed}" }
              as: Appraiser
              as_user_id: "appraiser-01"
              captures: { val_id: $.data.id }
            - call: "POST /valuations/${val_id}/approve"
              payload: {}
              as: Trustee
              as_user_id: "trustee-01"
            - call: "GET /plans/${plan_id}"
              payload: {}
              as: Trustee
              as_user_id: "trustee-01"
              captures: { plan_v_priced: $.data.version }
            - call: "POST /allocation-runs"
              payload: { plan_id: "${plan_id}", valuation_id: "${val_id}", plan_year: 2026, contributed_shares: 900, expected_plan_version: "${plan_v_priced}" }
              as: PlanAdministrator
              as_user_id: "tpa-01"
              captures: { run_id: $.data.id }
            - call: "POST /allocation-runs/${run_id}/finalize"
              payload: {}
              as: PlanAdministrator
              as_user_id: "tpa-02"
            - call: "POST /participants/${p1_id}/terminate"
              payload: { termination_date: "2026-03-31", termination_reason: "TERMINATION" }
              as: PlanSponsor
              as_user_id: "sponsor-01"
            - call: "POST /distribution-elections"
              payload: { participant_id: "${p1_id}", election_type: "TERMINATION", requested_shares: 900 }
              as: Participant
              as_user_id: "${p1_id}"
              captures: { elect_id: $.data.id }
            - call: "POST /distribution-elections/${elect_id}/commence"
              payload: {}
              as: PlanAdministrator
              as_user_id: "tpa-01"
            - call: "GET /installment-payments"
              payload: { distribution_election_id: "${elect_id}" }
              as: PlanAdministrator
              as_user_id: "tpa-01"
              captures: { inst_id: "$.data[0].id" }
            - call: "POST /installment-payments/${inst_id}/pay"
              payload: {}
              as: PlanAdministrator
              as_user_id: "tpa-01"
            - call: "POST /put-option-exercises"
              payload: { distribution_election_id: "${elect_id}", shares_tendered: 500 }
              as: Participant
              as_user_id: "${p1_id}"
              captures: { ex_big_id: $.data.id }
            - call: "POST /put-option-exercises"
              payload: { distribution_election_id: "${elect_id}", shares_tendered: 400 }
              as: Participant
              as_user_id: "${p1_id}"
              captures: { ex_small_id: $.data.id }
            - call: "POST /plans/${plan_id}/repurchase-funding"
              payload: { amount_cents: 3000000 }
              as: Trustee
              as_user_id: "trustee-01"
          trigger:
            - call: "POST /plans/${plan_id}/repurchase-sweeps"
              payload: {}
              as: Trustee
              as_user_id: "trustee-01"
              captures: { funded_count_strict: $.data.funded_count, funded_total_strict: $.data.funded_cents_total }
          assert:
            - "the sweep response funded_count == 0"
            - "the sweep response deferred_count == 2"
            - "the sweep response funded_cents_total == 0"
            - "the sweep response sweep_mode_applied == STRICT_ORDER"
            - "the sweep response stopped_at_exercise_id == ${ex_big_id}"
            - "PutOptionExercise.${ex_big_id}.status == DEFERRED"
            - "PutOptionExercise.${ex_small_id}.status == DEFERRED"
            - "EsopPlan.${plan_id}.repurchase_reserve_cents == 3000000"
            - "EsopPlan.${plan_id}.committed_repurchase_cents == 0"
            - "under BEST_FIT the identical queue instead yields funded_count 1, funded_cents_total 2850000, PutOptionExercise.${ex_small_id}.status == FUNDED and EsopPlan.${plan_id}.repurchase_reserve_cents == 150000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: valuation_price_capped_premium_before_discount_mode_a
        grounds:
          - calculations.valuation_share_price
          - entities.Valuation.fields.share_price_cents
          - entities.Valuation.fields.control_premium_applied_cents
          - entities.EsopPlan.fields.total_plan_shares
          - endpoints.POST /valuations
        distinguishing_aspect: |
          Mode (a): five inputs interact non-linearly - a conditional branch on the trust's
          ownership basis points, a min() cap on the control premium, a multiplicative
          discount and a final floor - and because the premium is capped the pinned
          premium-then-discount order yields 7875 cents where discount-then-premium would
          yield 8125.
        test_recipe:
          setup:
            - "One OPEN plan with total_shares_outstanding 1000000 and a leveraged loan pledging 600000 shares, so total_plan_shares is 600000 and ownership is 6000 basis points."
            - "A second OPEN plan with the identical appraisal inputs but no loan, so total_plan_shares is 0 and ownership is 0 basis points."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:00Z" }
              as: PlanSponsor
              as_user_id: "sponsor-01"
            - call: "POST /plans"
              payload: { plan_name: "Ironwood Levered", sponsor_name: "Ironwood Manufacturing Inc.", plan_year: 2026, total_shares_outstanding: 1000000, vesting_schedule: "GRADED_6YR", service_measurement_method: "TERMINATION_DATE_MEASURE", forfeiture_policy: "REALLOCATE_PRO_RATA", distribution_policy: "FIVE_YEAR_INSTALLMENT" }
              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { plan_lev_id: $.data.id }
            - call: "POST /esop-loans"
              payload: { plan_id: "${plan_lev_id}", lender_name: "First Meridian Bank", original_principal_cents: 4000000000, original_interest_cents: 1600000000, shares_pledged: 600000, release_method: "PRINCIPAL_ONLY" }
              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { loan_id: $.data.id }
            - call: "GET /plans/${plan_lev_id}"
              payload: {}
              as: Appraiser
              as_user_id: "appraiser-01"
              captures: { plan_lev_v: $.data.version }
            - call: "POST /plans"
              payload: { plan_name: "Ironwood Unlevered", sponsor_name: "Ironwood Manufacturing Inc.", plan_year: 2026, total_shares_outstanding: 1000000, vesting_schedule: "GRADED_6YR", service_measurement_method: "TERMINATION_DATE_MEASURE", forfeiture_policy: "REALLOCATE_PRO_RATA", distribution_policy: "FIVE_YEAR_INSTALLMENT" }
              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { plan_unl_id: $.data.id, plan_unl_v: $.data.version }
          trigger:
            - call: "POST /valuations"
              payload: { plan_id: "${plan_lev_id}", plan_year: 2026, enterprise_value_cents: 12000000000, debt_outstanding_cents: 3000000000, non_operating_assets_cents: 500000000, control_premium_bps: 1500, marketability_discount_bps: 2500, effective_from_date: "2026-01-01", effective_to_date: "2027-01-01", expected_plan_version: "${plan_lev_v}" }
              as: Appraiser
              as_user_id: "appraiser-01"
              captures: { val_lev_id: $.data.id }
            - call: "POST /valuations"
              payload: { plan_id: "${plan_unl_id}", plan_year: 2026, enterprise_value_cents: 12000000000, debt_outstanding_cents: 3000000000, non_operating_assets_cents: 500000000, control_premium_bps: 1500, marketability_discount_bps: 2500, effective_from_date: "2026-01-01", effective_to_date: "2027-01-01", expected_plan_version: "${plan_unl_v}" }
              as: Appraiser
              as_user_id: "appraiser-01"
              captures: { val_unl_id: $.data.id }
          assert:
            - "Valuation.${val_lev_id}.equity_value_cents == 9500000000"
            - "Valuation.${val_lev_id}.ownership_bps_at_valuation == 6000"
            - "Valuation.${val_lev_id}.control_premium_applied_cents == 1000000000"
            - "Valuation.${val_lev_id}.share_price_cents == 7875"
            - "Valuation.${val_unl_id}.ownership_bps_at_valuation == 0"
            - "Valuation.${val_unl_id}.control_premium_applied_cents == 0"
            - "Valuation.${val_unl_id}.share_price_cents == 7125"
            - "Valuation.${val_lev_id}.share_price_cents != 8125"

      - name: allocation_remainder_floor_then_distribute_mode_b
        grounds:
          - calculations.allocation_pool_distribution
          - entities.ShareAllocation.fields.remainder_shares_awarded
          - entities.ShareAllocation.fields.allocated_shares
          - endpoints.POST /allocation-runs/{run_id}/finalize
        distinguishing_aspect: |
          Mode (b): the pinned rounding order is floor-per-participant first and reconcile
          the shortfall second. Exact shares of 1069.767 / 620.155 / 310.078 floor to
          1069 / 620 / 310 leaving one share, which goes to the largest fraction; rounding
          each half-up first and summing would have distributed 2001 shares against a pool
          of 2000.
        test_recipe:
          setup:
            - "A plan with a loan pledging 600000 shares and an APPROVED valuation pricing shares at 7875 cents."
            - "Three ACTIVE participants created in this order with eligible compensation 40000000, 20000000 and 10000000 cents; the compensation limit is 34500000 cents."
            - "A DRAFT allocation run contributing 2000 shares, with unallocated_released_shares and unallocated_forfeiture_shares both 0 so pool_shares is exactly 2000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:00Z" }
              as: PlanSponsor
              as_user_id: "sponsor-01"
            - call: "POST /plans"
              payload: { plan_name: "Ironwood Manufacturing ESOP", sponsor_name: "Ironwood Manufacturing Inc.", plan_year: 2026, total_shares_outstanding: 1000000, vesting_schedule: "GRADED_6YR", service_measurement_method: "TERMINATION_DATE_MEASURE", forfeiture_policy: "REALLOCATE_PRO_RATA", distribution_policy: "FIVE_YEAR_INSTALLMENT", annual_compensation_limit_cents: 34500000, annual_additions_limit_cents: 6900000, forfeiture_sweep_threshold_shares: 0 }
              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { plan_id: $.data.id }
            - call: "POST /esop-loans"
              payload: { plan_id: "${plan_id}", lender_name: "First Meridian Bank", original_principal_cents: 4000000000, original_interest_cents: 1600000000, shares_pledged: 600000, release_method: "PRINCIPAL_ONLY" }
              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { loan_id: $.data.id }
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", employee_number: "E-001", date_of_birth: "1980-04-11", hire_date: "2015-01-05", eligible_compensation_cents: 40000000 }
              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { pa_id: $.data.id }
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", employee_number: "E-002", date_of_birth: "1982-09-23", hire_date: "2016-06-01", eligible_compensation_cents: 20000000 }
              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { pb_id: $.data.id }
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", employee_number: "E-003", date_of_birth: "1990-02-14", hire_date: "2019-03-15", eligible_compensation_cents: 10000000 }
              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { pc_id: $.data.id }
            - call: "POST /plans/${plan_id}/close-year"
              payload: {}
              as: PlanSponsor
              as_user_id: "sponsor-01"
              captures: { plan_v_closed: $.data.version }
            - call: "POST /valuations"
              payload: { plan_id: "${plan_id}", plan_year: 2026, enterprise_value_cents: 12000000000, debt_outstanding_cents: 3000000000, non_operating_assets_cents: 500000000, control_premium_bps: 1500, marketability_discount_bps: 2500, effective_from_date: "2026-01-01", effective_to_date: "2027-01-01", expected_plan_version: "${plan_v_closed}" }
              as: Appraiser
              as_user_id: "appraiser-01"
              captures: { val_id: $.data.id }
            - call: "POST /valuations/${val_id}/approve"
              payload: {}
              as: Trustee
              as_user_id: "trustee-01"
            - call: "GET /plans/${plan_id}"
              payload: {}
              as: PlanAdministrator
              as_user_id: "tpa-01"
              captures: { plan_v_priced: $.data.version }
            - call: "POST /allocation-runs"
              payload: { plan_id: "${plan_id}", valuation_id: "${val_id}", plan_year: 2026, contributed_shares: 2000, expected_plan_version: "${plan_v_priced}" }
              as: PlanAdministrator
              as_user_id: "tpa-01"
              captures: { run_id: $.data.id }
          trigger:
            - call: "POST /allocation-runs/${run_id}/finalize"
              payload: {}
              as: PlanAdministrator
              as_user_id: "tpa-02"
          assert:
            - "AllocationRun.${run_id}.pool_shares == 2000"
            - "AllocationRun.${run_id}.share_price_cents == 7875"
            - "AllocationRun.${run_id}.total_capped_compensation_cents == 64500000"
            - "the ShareAllocation for participant ${pa_id} in run ${run_id} has remainder_shares_awarded == 1 and gross_shares_before_cap == 1070"
            - "the ShareAllocation for participant ${pb_id} in run ${run_id} has remainder_shares_awarded == 0"
            - "the ShareAllocation for participant ${pc_id} in run ${run_id} has remainder_shares_awarded == 1 and gross_shares_before_cap == 375"
            - "the sum of allocated_shares across the three ShareAllocation rows of run ${run_id} == 2000"
