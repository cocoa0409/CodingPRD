  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: lot_capacity_ge_boundary_on_checkin
        grounds:
          - calculations.lot_occupancy
          - entities.Lot.fields.capacity
          - entities.Lot.fields.occupied_count
          - errors[ERR_LOT_AT_CAPACITY]
        distinguishing_aspect: |
          Count metric on POST /valet/tickets: with capacity 1, occupied_count 0 (<1) admits t1, then
          occupied_count 1 (>=1) rejects t2 with ERR_LOT_AT_CAPACITY — the >= boundary, not >.
        test_recipe:
          setup:
            - "ACTIVE event; lot capacity 1, no overflow; t1 already checked in (occupied 1)."
