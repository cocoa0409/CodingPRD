# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_2468_retirement_plan_committee_investment_menu_governance
#
# Depth probe. Every instance grounds only in elements already declared in
# SCAFFOLD.yaml §1.1-§1.7. Nine §0.5 rule_ids, 22 non-stub instances.
#
# Shared conventions used by every setup_api_calls chain below:
#   * The logical clock starts at 2026-08-01T00:00:00Z and is only ever moved by
#     POST /_clock/set_current_utc { current_utc: ... }.
#   * The chair seat is created with seat_code "CHAIR" and seat_class "CHAIR" so
#     that validations[priority=25] ("for CommitteeChair the resolved member's
#     seat.seat_class must be CHAIR") can be satisfied at all.
#   * Motions always carry an explicit carried_threshold_pct expressed on the
#     0.00..100.00 scale that calculations.motion_tally compares support_pct
#     against; Plan.voting_threshold_pct keeps its own 0.5000..1.0000 scale.
#   * IPS weights use the §1.1 object key set { performance, peer, expense,
#     style, manager }.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  # RULE 1 - dual_variant_calc  (3 instances, three different entity domains:
  #          FundScorecard, FeeLevelizationRun, Motion)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: composite_score_trailing_blend_ignores_rolling_inputs
        grounds:
          - calculations.fund_composite_score
          - calculations.watch_recommendation
          - entities.FundScorecard.fields.composite_score
          - entities.FundScorecard.fields.performance_component
          - entities.InvestmentPolicyStatement.fields.scoring_variant
          - entities.QuarterlyReview.fields.scoring_variant
          - state_machines.FundScorecard.SUBMITTED_to_SUPERSEDED
          - concurrency_rules[scorecard-create-stale-review]
          - validations[priority=79]
        distinguishing_aspect: |
          The variant is selected by the review's pinned InvestmentPolicyStatement.scoring_variant and
          never by the scorecard payload, so a TRAILING_PERIOD review that receives both trailing and
          rolling_since_watch inputs blends 3y/5y excess at 60/40 to composite_score 40.08
          (watch_recommendation WATCH) instead of consuming the undiluted since-watch excess that
          would have produced 21.20 (watch_recommendation REMEDIATION) on the identical row.
        test_recipe:
          setup:
            - "One Plan with charter_status ADOPTED, participant_account_count 8, menu_slot_capacity 6, fiscal_quarter_index 0."
            - "Two FILLED voting CommitteeSeat rows; both CommitteeMember rows ACTIVE with fiduciary_training_status CURRENT and acceptance_signed_at stamped."
            - "One InvestmentPolicyStatement status ADOPTED with scoring_variant TRAILING_PERIOD, weights { performance 0.40, peer 0.20, expense 0.20, style 0.10, manager 0.10 }, style_drift_r2_floor 0.8000, watch_trigger_score_max 40.00, remediation_trigger_score_max 25.00, cure_margin_points 10.00."
            - "One Fund 'ACMLX' with menu_status CANDIDATE and watch_status CLEAR (never seated, so no watch_started_quarter_index)."
            - "One QuarterlyReview for quarter_index 0, status DRAFT, version 1, scoring_variant pinned TRAILING_PERIOD."
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanSponsorAdmin
            - call: "POST /governance/plans"
              payload: { plan_name: "Acme 401(k) Plan", plan_sponsor_name: "Acme Industries Inc", erisa_covered: true, participant_account_count: 8, menu_slot_capacity: 6, quorum_min_voting_members: 2, voting_threshold_pct: 0.6667, max_voting_seats: 2, notice_lead_days_required: 30, blackout_buffer_days: 3, fiscal_quarter_index: 0 }
              as: PlanSponsorAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /governance/committee-seats"
              payload: { plan_id: "${plan_id}", seat_code: "CHAIR", seat_class: "CHAIR", voting: true, seat_index: 1 }
              as: PlanSponsorAdmin
              captures: { seat_chair_id: $.data.id }
            - call: "POST /governance/committee-seats"
              payload: { plan_id: "${plan_id}", seat_code: "FIN-1", seat_class: "FINANCE", voting: true, seat_index: 2 }
              as: PlanSponsorAdmin
              captures: { seat_fin_id: $.data.id }
            - call: "POST /governance/plans/${plan_id}/charter/adopt"
              payload: { quorum_min_voting_members: 2, voting_threshold_pct: 0.6667, max_voting_seats: 2, charter_doc_ref: "CHARTER-2026-V1" }
              as: PlanSponsorAdmin
            - call: "POST /governance/committee-members"
              payload: { seat_id: "${seat_chair_id}", member_name: "Dana Reyes", term_start_date: "2026-01-01", term_end_date: "2027-12-31", independence_flag: true }
              as: PlanSponsorAdmin
              captures: { chair_id: $.data.id }
            - call: "POST /governance/committee-members"
              payload: { seat_id: "${seat_fin_id}", member_name: "Marcus Webb", term_start_date: "2026-01-01", term_end_date: "2027-12-31", independence_flag: true }
              as: PlanSponsorAdmin
              captures: { mem2_id: $.data.id }
            - call: "POST /governance/training-records"
              payload: { member_id: "${chair_id}", module_code: "FIDUCIARY_DUTIES", status: "ASSIGNED", validity_quarters: 8 }
              as: PlanSponsorAdmin
              captures: { tr_c1_id: $.data.id }
            - call: "POST /governance/training-records"
              payload: { member_id: "${chair_id}", module_code: "IPS_MECHANICS", status: "ASSIGNED", validity_quarters: 8 }
              as: PlanSponsorAdmin
              captures: { tr_c2_id: $.data.id }
            - call: "POST /governance/training-records/${tr_c1_id}/complete"
              payload: { score_pct: 95.00 }
              as: PlanSponsorAdmin
            - call: "POST /governance/training-records/${tr_c2_id}/complete"
              payload: { score_pct: 95.00 }
              as: PlanSponsorAdmin
            - call: "POST /governance/training-records"
              payload: { member_id: "${mem2_id}", module_code: "FIDUCIARY_DUTIES", status: "ASSIGNED", validity_quarters: 8 }
              as: PlanSponsorAdmin
              captures: { tr_m1_id: $.data.id }
            - call: "POST /governance/training-records"
              payload: { member_id: "${mem2_id}", module_code: "IPS_MECHANICS", status: "ASSIGNED", validity_quarters: 8 }
