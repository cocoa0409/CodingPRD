              payload: { to_iso8601: "2027-08-04T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /api/accounts/${acct_q}/statement"
              as: BenefitsAdministrator
              captures: { q_vested_bp: $.data.vested_bp, q_vested: $.data.vested_balance_cents, q_settled: $.data.settled_balance_cents }
            - call: "GET /api/accounts/${acct_r}/statement"
              as: BenefitsAdministrator
              captures: { r_vested_bp: $.data.vested_bp, r_vested: $.data.vested_balance_cents, r_settled: $.data.settled_balance_cents }
          assert:
            - "${q_settled} == 100000 and ${r_settled} == 100000"
            - "${q_vested_bp} == 10000 and ${q_vested} == 100000 (exactly 3.000 years -> vested, >= inclusive)"
            - "${r_vested_bp} == 0 and ${r_vested} == 0 (2.997 years -> not vested; one day of service flips the boundary)"
      - name: election_submit_deadline_inclusive_timestamp
        grounds:
          - validations[priority=8]
          - state_machines.DeferralElection.DRAFT_to_SUBMITTED
          - calculations.deferral_cap
        distinguishing_aspect: |
          Metric: submission timestamp vs the NEWLY_ELIGIBLE 30-day deadline
          (initial_eligibility_date + 30 days, inclusive); endpoint: POST
          /api/deferral-elections and /submit. At deadline date exactly,
          create+submit succeed; one day later, create is rejected with
          ERR_ELECTION_DEADLINE_PASSED.
        test_recipe:
          setup:
            - "ACTIVE plan with fund and a plan_year-2026 window (general dates in 2025; NE elections are exempt from window status)"
            - "P1 eligibility 2026-07-02 (deadline 2026-08-01 == default clock date, inclusive boundary); P2 eligibility 2026-06-30 (deadline 2026-07-30, already past at default clock)"
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { name: "Plan ED", effective_date: "2026-01-01", distribution_events_allowed: ["SEPARATION"], officer_comp_threshold_cents: 20000000 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
            - call: "POST /api/plans/${plan_id}/activate"
              as: PlanSponsor
              captures: { plan_v: $.data.version }
            - call: "POST /api/notional-funds"
              payload: { plan_id: "${plan_id}", ticker: "FIX5", crediting_mode: "FIXED_RATE", annual_rate_bp: 500 }
              as: PlanSponsor
              captures: { fund_id: $.data.id }
            - call: "POST /api/election-windows"
              payload: { plan_id: "${plan_id}", plan_year: 2026, general_open_date: "2025-10-01", general_close_date: "2025-12-31", expected_plan_version: "${plan_v}" }
              as: PlanSponsor
              captures: { window_id: $.data.id }
            - call: "POST /api/participants"
              payload: { plan_id: "${plan_id}", employee_ref: "EMP-P1", hire_date: "2024-01-02", initial_eligibility_date: "2026-07-02", annual_compensation_cents: 30000000 }
              as: BenefitsAdministrator
              captures: { p1_id: $.data.id }
            - call: "POST /api/participants"
              payload: { plan_id: "${plan_id}", employee_ref: "EMP-P2", hire_date: "2024-01-02", initial_eligibility_date: "2026-06-30", annual_compensation_cents: 30000000 }
              as: BenefitsAdministrator
              captures: { p2_id: $.data.id }
          trigger:
            - call: "POST /api/deferral-elections"
              payload: { participant_id: "${p1_id}", election_window_id: "${window_id}", election_type: "NEWLY_ELIGIBLE", deferral_percent_bp: 5000, notional_fund_id: "${fund_id}" }
              as: Participant
              as_user_id: "${p1_id}"
              captures: { e1_id: $.data.id }
            - call: "POST /api/deferral-elections/${e1_id}/submit"
              as: Participant
              as_user_id: "${p1_id}"
              captures: { e1_status: $.data.status, e1_cap: $.data.elected_cap_cents }
            - call: "POST /api/deferral-elections"
              payload: { participant_id: "${p2_id}", election_window_id: "${window_id}", election_type: "NEWLY_ELIGIBLE", deferral_percent_bp: 5000, notional_fund_id: "${fund_id}" }
              as: Participant
              as_user_id: "${p2_id}"
              captures: { e2_err: $.data.error_id }
          assert:
            - "${e1_status} == SUBMITTED (deadline date 2026-08-01 is inclusive)"
            - "${e1_cap} == 6287671 (floor(30000000*153/365)=12575342 prorated comp, then floor(*5000/10000))"
            - "${e2_err} == ERR_ELECTION_DEADLINE_PASSED (2026-08-01 > 2026-07-30 deadline)"
            - "no DeferralElection row exists for P2 (creation rejected atomically)"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
