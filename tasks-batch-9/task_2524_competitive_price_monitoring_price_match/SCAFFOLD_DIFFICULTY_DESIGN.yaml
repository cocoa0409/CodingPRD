# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Competitive Price Monitoring & Price Match (task 2524)
#
# 9 rule_ids / 22 instances. Every numeric literal in an `assert:` line was
# computed by executing the corresponding §1.3 `formula:` as code against the
# fixture pinned in the same instance's `setup:`.
# Logical clock default on a fresh service start: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: confidence_variant_identifier_anchored_vs_attribute_blend
        grounds:
          - calculations.match_confidence_score
          - entities.CompetitorProductLink.fields.confidence_variant
          - entities.CompetitorProductLink.fields.confidence_bp
          - entities.CompetitorProductLink.fields.match_grade
        distinguishing_aspect: |
          This dual variant lives on the product-matching domain (CompetitorProductLink
          evidence scoring): the identical score triple (identifier 92, attribute 40,
          image 30) yields confidence_bp 9700 / match_grade EXACT under
          IDENTIFIER_ANCHORED and confidence_bp 6000 / match_grade CLOSE under
          ATTRIBUTE_BLEND, a 3700 bp divergence driven only by match_method.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One market US-WEST, one ACTIVE product SKU-BLENDER-1, two ACTIVE PRIMARY competitors C-ALPHA and C-BETA in that market."
            - "No links, observations or reports exist yet."
          setup_api_calls:
            - call: "POST /pricing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pricing/markets"
              payload: { market_code: "US-WEST", name: "US West", strategic_positioning: "AT_PARITY", strategic_index_target_bp: 9800, index_tolerance_bp: 150 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /pricing/products"
              payload: { market_id: "${m_id}", sku: "SKU-BLENDER-1", category_code: "APPLIANCE", brand: "Vitala", own_price_cents: 24999, unit_cost_cents: 15000, margin_floor_pct: 0.20, map_floor_cents: 0, index_weight_bp: 10000 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /pricing/competitors"
              payload: { market_id: "${m_id}", competitor_code: "C-ALPHA", name: "Alpha Mart", collection_method: "ONLINE", tier: "PRIMARY" }
              as: PlatformAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /pricing/competitors"
              payload: { market_id: "${m_id}", competitor_code: "C-BETA", name: "Beta Mart", collection_method: "ONLINE", tier: "PRIMARY" }
              as: PlatformAdmin
              captures: { c2_id: $.data.id }
          trigger:
            - call: "POST /pricing/matches"
              payload: { product_id: "${p_id}", competitor_id: "${c1_id}", match_method: "IDENTIFIER", identifier_score: 92, attribute_score: 40, image_score: 30, competitor_identifier: "00712345678905" }
              as: PricingAnalyst
              captures: { link_anchored_id: $.data.id }
            - call: "POST /pricing/matches"
              payload: { product_id: "${p_id}", competitor_id: "${c2_id}", match_method: "ATTRIBUTE", identifier_score: 92, attribute_score: 40, image_score: 30 }
              as: PricingAnalyst
              captures: { link_blend_id: $.data.id }
          assert:
            - "CompetitorProductLink.${link_anchored_id}.confidence_variant == IDENTIFIER_ANCHORED"
            - "CompetitorProductLink.${link_anchored_id}.confidence_bp == 9700"
            - "CompetitorProductLink.${link_anchored_id}.match_grade == EXACT"
            - "CompetitorProductLink.${link_blend_id}.confidence_variant == ATTRIBUTE_BLEND"
            - "CompetitorProductLink.${link_blend_id}.confidence_bp == 6000"
            - "CompetitorProductLink.${link_blend_id}.match_grade == CLOSE"
            - "confidence_bp divergence on identical scores == 9700 - 6000 == 3700"
            - "CompetitorProductLink.${link_blend_id}.confidence_bp != 6710 (the raw blend is capped by LOW_IMAGE_CONFIDENCE_CEILING_BP because image_score 30 < 50)"
            - "both links have status == PROPOSED and review_round == 0"

      - name: price_index_matched_basket_vs_imputed_full_catalog_divergence
        grounds:
          - calculations.price_index
          - entities.PriceIndexReport.fields.basis
          - entities.PriceIndexReport.fields.index_bp
          - entities.PriceIndexReport.fields.imputed_product_count
          - concurrency_rules[index-report-create-stale-market]
        distinguishing_aspect: |
          This dual variant lives on a different entity domain — market-level index
          reporting over a Product basket, not per-link scoring: the same three-product
          basket yields index_bp 9743 under MATCHED_BASKET (unmatched product excluded
          from numerator and weight denominator) and 9760 under IMPUTED_FULL_CATALOG
          (unmatched product pulled in at the 9808 bp median ratio).
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Market US-WEST with strategic_index_target_bp 9800 and index_tolerance_bp 150."
            - "Category COFFEE holds three ACTIVE products: P1 own 24999 weight 10000, P2 own 9999 weight 5000, P3 own 19999 weight 5000."
            - "One ACTIVE PRIMARY competitor C-ALPHA with CONFIRMED links (confidence_bp 10000) on P1 and P2 only; P3 has no link."
            - "P1's link carries an ACTIVE in-stock observation of 25999 and P2's an observation of 9999, both observed 2026-07-31T18:00:00Z (6 hours inside the 72h TTL)."
          setup_api_calls:
            - call: "POST /pricing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pricing/markets"
              payload: { market_code: "US-WEST", name: "US West", strategic_positioning: "AT_PARITY", strategic_index_target_bp: 9800, index_tolerance_bp: 150 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /pricing/products"
              payload: { market_id: "${m_id}", sku: "SKU-COFFEE-1", category_code: "COFFEE", brand: "Roastly", own_price_cents: 24999, unit_cost_cents: 15000, margin_floor_pct: 0.20, map_floor_cents: 0, index_weight_bp: 10000 }
              as: PlatformAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /pricing/products"
              payload: { market_id: "${m_id}", sku: "SKU-COFFEE-2", category_code: "COFFEE", brand: "Roastly", own_price_cents: 9999, unit_cost_cents: 5000, margin_floor_pct: 0.20, map_floor_cents: 0, index_weight_bp: 5000 }
              as: PlatformAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /pricing/products"
              payload: { market_id: "${m_id}", sku: "SKU-COFFEE-3", category_code: "COFFEE", brand: "Roastly", own_price_cents: 19999, unit_cost_cents: 12000, margin_floor_pct: 0.20, map_floor_cents: 0, index_weight_bp: 5000 }
              as: PlatformAdmin
              captures: { p3_id: $.data.id }
            - call: "POST /pricing/competitors"
              payload: { market_id: "${m_id}", competitor_code: "C-ALPHA", name: "Alpha Mart", collection_method: "ONLINE", tier: "PRIMARY" }
              as: PlatformAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /pricing/matches"
              payload: { product_id: "${p1_id}", competitor_id: "${c1_id}", match_method: "IDENTIFIER", identifier_score: 95, attribute_score: 95, image_score: 95, competitor_identifier: "00712345678901" }
              as: PricingAnalyst
              captures: { l1_id: $.data.id }
            - call: "POST /pricing/matches/${l1_id}/review"
              payload: { decision: "CONFIRM" }
              as: PricingManager
              as_user_id: "manager-9"
            - call: "POST /pricing/matches"
              payload: { product_id: "${p2_id}", competitor_id: "${c1_id}", match_method: "IDENTIFIER", identifier_score: 95, attribute_score: 95, image_score: 95, competitor_identifier: "00712345678902" }
              as: PricingAnalyst
              captures: { l2_id: $.data.id }
            - call: "POST /pricing/matches/${l2_id}/review"
              payload: { decision: "CONFIRM" }
              as: PricingManager
              as_user_id: "manager-9"
            - call: "POST /pricing/observations"
              payload: { link_id: "${l1_id}", observed_price_cents: 25999, collection_method: "ONLINE", observed_at: "2026-07-31T18:00:00Z", in_stock: true }
              as: DataCollector
            - call: "POST /pricing/observations"
              payload: { link_id: "${l2_id}", observed_price_cents: 9999, collection_method: "ONLINE", observed_at: "2026-07-31T18:00:00Z", in_stock: true }
              as: DataCollector
            - call: "GET /pricing/markets/${m_id}"
              payload: {}
              as: PricingAnalyst
              captures: { m_v1: $.data.version }
          trigger:
            - call: "POST /pricing/index-reports"
              payload: { market_id: "${m_id}", category_code: "COFFEE", basis: "MATCHED_BASKET", expected_market_version: "${m_v1}" }
              as: PricingAnalyst
              captures: { rpt_matched_id: $.data.id }
            - call: "GET /pricing/markets/${m_id}"
              payload: {}
              as: PricingAnalyst
              captures: { m_v2: $.data.version }
            - call: "POST /pricing/index-reports"
              payload: { market_id: "${m_id}", category_code: "COFFEE", basis: "IMPUTED_FULL_CATALOG", expected_market_version: "${m_v2}" }
              as: PricingAnalyst
              captures: { rpt_imputed_id: $.data.id }
          assert:
            - "PriceIndexReport.${rpt_matched_id}.index_bp == 9743"
            - "PriceIndexReport.${rpt_matched_id}.candidate_product_count == 3"
            - "PriceIndexReport.${rpt_matched_id}.matched_product_count == 2"
            - "PriceIndexReport.${rpt_matched_id}.imputed_product_count == 0"
            - "PriceIndexReport.${rpt_matched_id}.excluded_product_count == 1"
            - "PriceIndexReport.${rpt_matched_id}.positioning_gap_bp == -57"
            - "PriceIndexReport.${rpt_matched_id}.positioning_verdict == ON_TARGET"
            - "PriceIndexReport.${rpt_imputed_id}.index_bp == 9760"
            - "PriceIndexReport.${rpt_imputed_id}.matched_product_count == 2"
            - "PriceIndexReport.${rpt_imputed_id}.imputed_product_count == 1"
            - "PriceIndexReport.${rpt_imputed_id}.excluded_product_count == 0"
            - "PriceIndexReport.${rpt_imputed_id}.positioning_gap_bp == -40"
            - "index_bp divergence between the two bases == 9760 - 9743 == 17"
            - "both reports have data_sufficiency == SUFFICIENT and status == DRAFT"
            - "Market.${m_id}.version == ${m_v2} + 1 (each report creation bumps the market version by exactly 1)"
            - "Market.${m_id}.observed_index_bp == null (neither report is PUBLISHED)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: repricing_band_clamp_then_floor_clamp_non_commutative
        grounds:
          - calculations.repricing_proposal
          - calculations.repricing_rule_selection
          - calculations.repricing_benchmark_selection
          - entities.PriceChangeOrder.fields.banded_price_cents
          - entities.PriceChangeOrder.fields.proposed_price_cents
          - entities.PriceChangeOrder.fields.band_breach
        distinguishing_aspect: |
          Mode (a): four inputs (benchmark 22499, target_position_bp 9700, own_price
          24999 with max_change_pct 0.10, effective_floor 27500) interact through
          nested min/max in a pinned order — band clamp first, floor clamp last —
          producing proposed_price_cents 27500 with band_breach true, where the
          reversed order would produce 27498; the clamps are NOT commutative.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Market US-WEST; product SKU-BLENDER-1 in category APPLIANCE, brand Vitala, own_price 24999, unit_cost 22000, margin_floor_pct 0.20, map_floor 22999 (effective_floor_cents = max(ceil(22000/0.8)=27500, 22999) = 27500)."
            - "ACTIVE PRIMARY competitor C-ALPHA with a CONFIRMED link (confidence_bp 10000) carrying an ACTIVE in-stock observation of 22499, so the benchmark is 22499 and the link's gap_bp is 11111 (drift 1111, below the 1200 bp alert)."
            - "One ACTIVE repricing rule for (US-WEST, APPLIANCE): target_position_bp 9700, max_change_pct 0.10, change_frequency_limit_days 30, priority 10, no brand exclusions."
          setup_api_calls:
            - call: "POST /pricing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pricing/markets"
              payload: { market_code: "US-WEST", name: "US West", strategic_positioning: "PRICE_LEADER", strategic_index_target_bp: 9700, index_tolerance_bp: 200 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /pricing/products"
              payload: { market_id: "${m_id}", sku: "SKU-BLENDER-1", category_code: "APPLIANCE", brand: "Vitala", own_price_cents: 24999, unit_cost_cents: 22000, margin_floor_pct: 0.20, map_floor_cents: 22999, index_weight_bp: 10000 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /pricing/competitors"
              payload: { market_id: "${m_id}", competitor_code: "C-ALPHA", name: "Alpha Mart", collection_method: "ONLINE", tier: "PRIMARY" }
              as: PlatformAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /pricing/matches"
              payload: { product_id: "${p_id}", competitor_id: "${c1_id}", match_method: "IDENTIFIER", identifier_score: 95, attribute_score: 95, image_score: 95, competitor_identifier: "00712345678905" }
              as: PricingAnalyst
              captures: { l1_id: $.data.id }
            - call: "POST /pricing/matches/${l1_id}/review"
              payload: { decision: "CONFIRM" }
              as: PricingManager
              as_user_id: "manager-9"
            - call: "POST /pricing/observations"
              payload: { link_id: "${l1_id}", observed_price_cents: 22499, collection_method: "ONLINE", observed_at: "2026-07-31T18:00:00Z", in_stock: true }
              as: DataCollector
            - call: "POST /pricing/repricing-rules"
              payload: { market_id: "${m_id}", category_code: "APPLIANCE", target_position_bp: 9700, max_change_pct: 0.10, change_frequency_limit_days: 30, priority: 10 }
              as: PricingManager
              as_user_id: "manager-9"
              captures: { rule_id: $.data.id }
            - call: "GET /pricing/products/${p_id}"
              payload: {}
              as: PricingAnalyst
              captures: { p_v1: $.data.version }
          trigger:
            - call: "POST /pricing/change-orders"
              payload: { product_id: "${p_id}", origin: "AUTOMATED_RULE", effective_from: "2026-08-01T00:00:00Z", expected_product_version: "${p_v1}" }
              as: PricingAnalyst
              as_user_id: "analyst-1"
              captures: { ord_id: $.data.id }
          assert:
            - "PriceChangeOrder.${ord_id}.rule_id == ${rule_id}"
            - "PriceChangeOrder.${ord_id}.benchmark_price_cents == 22499"
            - "PriceChangeOrder.${ord_id}.target_price_cents == 21824"
            - "PriceChangeOrder.${ord_id}.banded_price_cents == 22500"
            - "PriceChangeOrder.${ord_id}.effective_floor_cents == 27500"
            - "PriceChangeOrder.${ord_id}.proposed_price_cents == 27500"
            - "PriceChangeOrder.${ord_id}.proposed_price_cents != 27498 (the value the floor-then-band order would produce)"
            - "PriceChangeOrder.${ord_id}.floor_binding == true"
            - "PriceChangeOrder.${ord_id}.band_breach == true"
            - "PriceChangeOrder.${ord_id}.status == DRAFT and signage_status == NOT_REQUIRED"
            - "Product.${p_id}.own_price_cents == 24999 (creation never writes the price)"
            - "Product.${p_id}.version == ${p_v1} + 1"

      - name: price_index_round_per_product_then_average_order
        grounds:
          - calculations.price_index
          - entities.PriceIndexReport.fields.index_bp
          - entities.Product.fields.index_weight_bp
        distinguishing_aspect: |
          Mode (b): nested rounding where the order changes the cents — rounding each
          product ratio to an integer basis point first and rounding the weighted
          average second yields index_bp 9743, while averaging the unrounded ratios
          and rounding once yields 9744; the scaffold pins the per-product-first order.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Market US-EAST, category COFFEE with exactly two ACTIVE products: P1 own 24999 weight 10000 and P2 own 9999 weight 5000."
            - "ACTIVE PRIMARY competitor C-ALPHA with CONFIRMED links on both products (confidence_bp 10000) and ACTIVE in-stock observations of 25999 (P1) and 9999 (P2), so the unrounded ratios are 9615.3675... and exactly 10000."
          setup_api_calls:
            - call: "POST /pricing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pricing/markets"
              payload: { market_code: "US-EAST", name: "US East", strategic_positioning: "AT_PARITY", strategic_index_target_bp: 9800, index_tolerance_bp: 150 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /pricing/products"
              payload: { market_id: "${m_id}", sku: "SKU-COFFEE-1", category_code: "COFFEE", brand: "Roastly", own_price_cents: 24999, unit_cost_cents: 15000, margin_floor_pct: 0.20, map_floor_cents: 0, index_weight_bp: 10000 }
              as: PlatformAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /pricing/products"
              payload: { market_id: "${m_id}", sku: "SKU-COFFEE-2", category_code: "COFFEE", brand: "Roastly", own_price_cents: 9999, unit_cost_cents: 5000, margin_floor_pct: 0.20, map_floor_cents: 0, index_weight_bp: 5000 }
              as: PlatformAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /pricing/competitors"
              payload: { market_id: "${m_id}", competitor_code: "C-ALPHA", name: "Alpha Mart", collection_method: "ONLINE", tier: "PRIMARY" }
              as: PlatformAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /pricing/matches"
              payload: { product_id: "${p1_id}", competitor_id: "${c1_id}", match_method: "IDENTIFIER", identifier_score: 95, attribute_score: 95, image_score: 95, competitor_identifier: "00712345678901" }
              as: PricingAnalyst
              captures: { l1_id: $.data.id }
            - call: "POST /pricing/matches/${l1_id}/review"
              payload: { decision: "CONFIRM" }
              as: PricingManager
              as_user_id: "manager-9"
            - call: "POST /pricing/matches"
              payload: { product_id: "${p2_id}", competitor_id: "${c1_id}", match_method: "IDENTIFIER", identifier_score: 95, attribute_score: 95, image_score: 95, competitor_identifier: "00712345678902" }
              as: PricingAnalyst
              captures: { l2_id: $.data.id }
            - call: "POST /pricing/matches/${l2_id}/review"
              payload: { decision: "CONFIRM" }
              as: PricingManager
              as_user_id: "manager-9"
            - call: "POST /pricing/observations"
              payload: { link_id: "${l1_id}", observed_price_cents: 25999, collection_method: "ONLINE", observed_at: "2026-07-31T18:00:00Z", in_stock: true }
              as: DataCollector
            - call: "POST /pricing/observations"
              payload: { link_id: "${l2_id}", observed_price_cents: 9999, collection_method: "ONLINE", observed_at: "2026-07-31T18:00:00Z", in_stock: true }
              as: DataCollector
            - call: "GET /pricing/markets/${m_id}"
              payload: {}
              as: PricingAnalyst
              captures: { m_v1: $.data.version }
          trigger:
            - call: "POST /pricing/index-reports"
              payload: { market_id: "${m_id}", category_code: "COFFEE", basis: "MATCHED_BASKET", expected_market_version: "${m_v1}" }
              as: PricingAnalyst
              captures: { rpt_id: $.data.id }
          assert:
            - "CompetitorProductLink.${l1_id}.gap_bp == 9615 (per-product ratio rounded first)"
            - "CompetitorProductLink.${l2_id}.gap_bp == 10000"
            - "PriceIndexReport.${rpt_id}.index_bp == 9743"
            - "PriceIndexReport.${rpt_id}.index_bp != 9744 (the sum-then-round-once value)"
            - "PriceIndexReport.${rpt_id}.matched_product_count == 2 and excluded_product_count == 0"
            - "PriceIndexReport.${rpt_id}.data_sufficiency == SUFFICIENT"
            - "PriceIndexReport.${rpt_id}.perception_validation == INDETERMINATE (no survey index was supplied)"

      - name: beat_bonus_tier_keyed_on_claimed_price_not_honored_price
        grounds:
          - calculations.price_match_honored_price
          - entities.PriceMatchClaim.fields.beat_bonus_cents
          - entities.PriceMatchClaim.fields.honored_price_cents
          - entities.PriceMatchClaim.fields.required_approval_tier
        distinguishing_aspect: |
          Mode (c): the beat-the-price bonus looks circular because the tier is a
          function of a price band while the honored price is the claimed price minus
          the bonus. Keying the tier on honored_price_cents has NO fixed point for a
          claim of 2050 (tier 0.05 gives honored 1947, which sits in the 0.00 tier;
          tier 0.00 gives honored 2050, which sits in the 0.05 tier); the pinned order
          keys the tier on claimed_price_cents and yields beat_bonus 103 / honored 1947.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Market US-WEST; store STORE-101 with override_authority_cents 1052 and label_printer_capacity_per_day 5."
            - "Product SKU-PANTRY-1 in category PANTRY: own_price 2999, unit_cost 1200, margin_floor_pct 0.20, map_floor 0, so effective_floor_cents == 1500."
            - "ACTIVE PRIMARY competitor C-ALPHA with price_match_eligible true."
            - "ACTIVE price match policy for the market: eligible_competitor_tiers [PRIMARY], max_match_discount_pct 0.40 (cap 1200 cents), daily_override_budget_cents 100000, claim_window_hours 168."
          setup_api_calls:
            - call: "POST /pricing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pricing/markets"
              payload: { market_code: "US-WEST", name: "US West", strategic_positioning: "AT_PARITY", strategic_index_target_bp: 9800, index_tolerance_bp: 150 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /pricing/products"
              payload: { market_id: "${m_id}", sku: "SKU-PANTRY-1", category_code: "PANTRY", brand: "Roastly", own_price_cents: 2999, unit_cost_cents: 1200, margin_floor_pct: 0.20, map_floor_cents: 0, index_weight_bp: 10000 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /pricing/stores"
              payload: { market_id: "${m_id}", store_code: "STORE-101", override_authority_cents: 1052, label_printer_capacity_per_day: 5 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /pricing/competitors"
              payload: { market_id: "${m_id}", competitor_code: "C-ALPHA", name: "Alpha Mart", collection_method: "ONLINE", tier: "PRIMARY", price_match_eligible: true }
              as: PlatformAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /pricing/match-policies"
              payload: { market_id: "${m_id}", eligible_competitor_tiers: ["PRIMARY"], daily_override_budget_cents: 100000, max_match_discount_pct: 0.40, claim_window_hours: 168 }
              as: PricingManager
              as_user_id: "manager-9"
              captures: { pol_id: $.data.id }
          trigger:
            - call: "POST /pricing/claims"
              payload: { policy_id: "${pol_id}", product_id: "${p_id}", competitor_id: "${c1_id}", store_id: "${s_id}", claimed_price_cents: 2050, claimed_observed_at: "2026-07-31T18:00:00Z", competitor_evidence_ref: "receipt-2050" }
              as: StoreAssociate
              as_user_id: "${s_id}"
              captures: { claim_id: $.data.id }
          assert:
