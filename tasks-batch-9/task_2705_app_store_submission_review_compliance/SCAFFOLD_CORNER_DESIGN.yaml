      - name: require_remediation_keeps_the_posture_restricted_and_leaves_the_index_halved
        claim_type: Conditional cascade
        grounds:
          - state_machines.ImpactAssessment.transitions.IN_ASSESSMENT_to_REMEDIATION_REQUIRED
          - calculations.compliance_posture
        distinguishing_aspect: "Branch A touches no FeatureMapping at all: the mapping stays STALE, the index stays 50.00 and posture stays RESTRICTED with OPEN_IMPACT_ASSESSMENT still listed, which is the observable difference from branch B."
        test_recipe:
          setup:
            - "The impact assessment for rule 5.1.2 is IN_ASSESSMENT; the mapping is STALE and the index is 50.00."
          setup_api_calls: &CH_IA_REQ
