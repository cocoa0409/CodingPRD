              captures: { sr_id: $.data.id }
          trigger:
            - call: "GET /sales-records"
              payload: { format_id: "${format_id}" }
              as: Publisher
          assert:
            - "response_type == array"
            - "exactly one element with id == ${sr_id} and units_sold == 7"

  # ===================================================================
  # Errors — remaining catalog entries not triggered above
  # ===================================================================
  - section: errors
    instances:
      - name: right_already_settled_void_rejected
        claim_type: violation_to_error
