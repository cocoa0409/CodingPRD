      - name: segment_sync_blocked_by_draft_inventory_list
        grounds:
          - state_machines.PreBidSegment.PENDING_to_SYNCED
          - state_machines.InventoryList.DRAFT_to_PUBLISHED
          - errors.ERR_LIST_NOT_PUBLISHED
          - endpoints.POST_pre_bid_segments_id_sync
        distinguishing_aspect: |
          A different entity pair - PreBidSegment <- InventoryList - and a
          different direction of dependency: the segment is in its own legal
          initial state PENDING and its campaign is ACTIVE, but the referenced
          exclusion list is still DRAFT, so the sync is refused with
          ERR_LIST_NOT_PUBLISHED. Publishing the list without touching the
          segment then makes the identical sync call succeed and stamps
          synced_exclusion_version from the list's published_version, proving
          the dependency is on the other entity's state rather than on the
          segment.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T00:00:00Z; campaign ACTIVE."
            - "An EXCLUSION list with one DOMAIN entry, left in DRAFT."
            - "A PreBidSegment pinning that list, in sync_status PENDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /advertisers"
              payload: { name: "Northwind Media", credit_cap_cents: 1000000 }
              as: PlatformAdmin
              captures: { adv_id: $.data.id }
            - call: "POST /campaigns"
              payload: { advertiser_id: "${adv_id}", name: "Q3 Display", cpm_cents: 875, min_suitability_tier: "MEDIUM_RISK", format: "DISPLAY", target_coverage_rate: 0.75 }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { camp_id: $.data.id }
            - call: "POST /inventory-lists"
              payload: { advertiser_id: "${adv_id}", list_type: "EXCLUSION", name: "Q3 blocks" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { excl_list_id: $.data.id }
            - call: "POST /inventory-lists/${excl_list_id}/entries"
              payload: { entry_type: "DOMAIN", entry_value: "spamfarm.example.com" }
              as: Advertiser
              as_user_id: "${adv_id}"
            - call: "POST /pre-bid-segments"
              payload: { campaign_id: "${camp_id}", suitability_floor_tier: "MEDIUM_RISK", exclusion_list_id: "${excl_list_id}" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { seg_id: $.data.id }
          trigger:
            - call: "POST /pre-bid-segments/${seg_id}/sync"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
            - call: "POST /inventory-lists/${excl_list_id}/publish"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
            - call: "POST /pre-bid-segments/${seg_id}/sync"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
          assert:
            - "The first sync returns 409 ERR_LIST_NOT_PUBLISHED while InventoryList.${excl_list_id}.status == DRAFT"
            - "PreBidSegment.${seg_id}.sync_status is still PENDING and synced_at, synced_exclusion_version are still null after the refusal"
            - "After publish: InventoryList.${excl_list_id}.status == PUBLISHED with entry_count == 1 and published_version set"
            - "The second, byte-identical sync returns 200 and PreBidSegment.${seg_id}.sync_status == SYNCED with synced_exclusion_version == InventoryList.${excl_list_id}.published_version and synced_inclusion_version == null"

      - name: claim_review_blocked_by_live_appeal_on_a_cited_page
        grounds:
          - state_machines.RefundClaim.SUBMITTED_to_UNDER_REVIEW
          - state_machines.Appeal.FILED_to_UPHELD
          - errors.ERR_APPEAL_PENDING
          - validations.priority_20_ERR_APPEAL_PENDING
