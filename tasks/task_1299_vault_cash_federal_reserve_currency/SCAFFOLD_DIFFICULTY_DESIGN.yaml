# =============================================================================
# §1.8 Scaffold Difficulty Design — Vault Cash & Federal Reserve Currency Ordering
# 9 rules x 2 instances (+1 extra for combinatorial_formula mode (c)) = 19 instances
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------- Rule 1 ---
  - rule_id: dual_variant_calc
    instances:
      - name: atm_forecast_trailing_vs_seasonal_projection
        grounds:
          - calculations.atm_forecast_projection
          - entities.AtmForecast.fields.projected_base_cents
          - entities.AtmForecast.fields.projected_final_cents
          - entities.AtmForecast.fields.variant_applied
        distinguishing_aspect: |
          Entity domain = AtmForecast/AtmMachine. For identical trailing inputs
          (w1,w2,w3) the TRAILING variant yields projected_final_cents == base while the
          SEASONAL variant (forecast_date inside a site SeasonalWindow at 12500 bps) yields
          a strictly larger final; the server must expose BOTH projected_base_cents and
          projected_final_cents and select the variant by window coverage.
        test_recipe:
          setup:
            - "Site S (NORMAL), ATM A under S with opening 5,000,000 (NORMAL posture)"
            - "SeasonalWindow on S covering 2026-12-20..2026-12-26 at 12500 bps"
            - "Forecast F on A for 2026-12-24 with w1=1,000,000 w2=2,000,000 w3=3,000,000"
          setup_api_calls:
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "S", site_type: "BRANCH", vault_limit_cents: 100000000, insurance_coverage_cents: 100000000, dock_capacity: 2, opening_fit_cents: 50000000 }
              as: CashOperationsAdmin
              captures: { s_id: $.data.id }
            - call: "POST /vault-cash/seasonal-windows"
              payload: { site_id: "${s_id}", name: "Holiday2026", start_date: "2026-12-20", end_date: "2026-12-26", multiplier_bps: 12500 }
              as: CashOperationsAdmin
            - call: "POST /vault-cash/atm-machines"
              payload: { site_id: "${s_id}", terminal_code: "ATM-1", cash_capacity_cents: 10000000, opening_balance_cents: 5000000 }
              as: CashOperationsAdmin
              captures: { atm_id: $.data.id }
            - call: "POST /vault-cash/staff-members"
              payload: { full_name: "Analyst A", home_site_id: "${s_id}" }
              as: CashOperationsAdmin
              captures: { ana_id: $.data.id }
          trigger:
            - call: "POST /vault-cash/atm-forecasts"
              payload: { atm_id: "${atm_id}", forecast_date: "2026-12-24", w1_cents: 1000000, w2_cents: 2000000, w3_cents: 3000000 }
              as: AtmAnalyst
              as_user_id: "${ana_id}"
              captures: { f_id: $.data.id }
          assert:
            - "AtmForecast.${f_id}.variant_applied == SEASONAL"
            - "AtmForecast.${f_id}.projected_base_cents == 1700000"
            - "AtmForecast.${f_id}.projected_final_cents == 2125000"
            - "AtmForecast.${f_id}.projected_final_cents != AtmForecast.${f_id}.projected_base_cents"
            - "AtmForecast.${f_id}.recommended_load_cents == 2200000"
            - "AtmForecast.${f_id}.residual_target_cents == 318750"

      - name: recon_provisional_vs_final_expected_with_late_entry
        grounds:
          - calculations.reconciliation_expected_balance
          - entities.Reconciliation.fields.provisional_expected_cents
          - entities.Reconciliation.fields.final_expected_cents
        distinguishing_aspect: |
          Entity domain = Reconciliation/CashLedgerEntry (different from the ATM forecast
          domain of the sibling instance). A backdated ledger entry created AFTER the recon
          opened is excluded from provisional_expected_cents (snapshot semantics) but included
          in final_expected_cents, so the two variants diverge by exactly the late entry.
        test_recipe:
          setup:
            - "Site S created at default clock 2026-08-01 (opening fit 5,000,000)"
            - "Clock advanced to 2026-08-02T09:00; ADJUSTMENT +1,000,000 on business_date 2026-08-02"
            - "Clock advanced to 2026-08-02T09:05; Reconciliation R for 2026-08-02 opened (opening 5,000,000)"
            - "Clock advanced to 2026-08-02T09:10; late ADJUSTMENT -400,000 backdated to 2026-08-02"
          setup_api_calls:
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "S", site_type: "CENTRAL", vault_limit_cents: 100000000, insurance_coverage_cents: 100000000, dock_capacity: 2, opening_fit_cents: 5000000 }
              as: CashOperationsAdmin
              captures: { s_id: $.data.id }
            - call: "POST /vault-cash/staff-members"
              payload: { full_name: "Cust U1", home_site_id: "${s_id}" }
              as: CashOperationsAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /vault-cash/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T09:00:00Z" }
              as: CashOperationsAdmin
            - call: "POST /vault-cash/cash-ledger-entries"
              payload: { site_id: "${s_id}", business_date: "2026-08-02", signed_amount_cents: 1000000, bucket: "FIT" }
              as: VaultCustodian
              as_user_id: "${u1_id}"
            - call: "POST /vault-cash/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T09:05:00Z" }
              as: CashOperationsAdmin
            - call: "POST /vault-cash/reconciliations"
              payload: { site_id: "${s_id}", business_date: "2026-08-02", opening_balance_cents: 5000000 }
              as: VaultCustodian
              as_user_id: "${u1_id}"
              captures: { r_id: $.data.id }
            - call: "POST /vault-cash/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T09:10:00Z" }
              as: CashOperationsAdmin
            - call: "POST /vault-cash/cash-ledger-entries"
              payload: { site_id: "${s_id}", business_date: "2026-08-02", signed_amount_cents: -400000, bucket: "FIT" }
              as: VaultCustodian
              as_user_id: "${u1_id}"
          trigger:
            - call: "GET /vault-cash/reconciliations/${r_id}"
              payload: {}
              as: VaultCustodian
              as_user_id: "${u1_id}"
          assert:
            - "Reconciliation.${r_id}.provisional_expected_cents == 6000000"
            - "Reconciliation.${r_id}.final_expected_cents == 5600000"
            - "Reconciliation.${r_id}.final_expected_cents - Reconciliation.${r_id}.provisional_expected_cents == -400000"

  # ---------------------------------------------------------------- Rule 2 ---
  - rule_id: combinatorial_formula
    instances:
      - name: fed_fee_per_line_rounding_then_sum
        grounds:
          - calculations.fed_service_fee
          - entities.DenominationLine.fields.fee_cents
          - entities.FedOrder.fields.fee_total_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: fee rounds per line (round_half_up(line_cents/160))
          THEN sums. Two deposit lines of 10,000 cents each yield 63+63=126; the forbidden
          sum-then-round order yields 125. The one-cent delta is the observable.
        test_recipe:
          setup:
            - "Site S (NORMAL); FedCoordinator U1 on S"
            - "DEPOSIT order O for business_date 2026-08-03 with two lines, each denomination_cents=100, strap_count=1 (line_cents=10,000)"
          setup_api_calls:
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "S", site_type: "BRANCH", vault_limit_cents: 100000000, insurance_coverage_cents: 100000000, dock_capacity: 2, opening_fit_cents: 50000000 }
              as: CashOperationsAdmin
              captures: { s_id: $.data.id }
            - call: "POST /vault-cash/staff-members"
              payload: { full_name: "Coord U1", home_site_id: "${s_id}" }
              as: CashOperationsAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /vault-cash/fed-orders"
              payload: { site_id: "${s_id}", direction: "DEPOSIT", business_date: "2026-08-03" }
              as: FedCoordinator
              as_user_id: "${u1_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /vault-cash/fed-orders/${o_id}/lines"
              payload: { denomination_cents: 100, strap_count: 1, expected_fed_order_version: "${o_v}" }
              as: FedCoordinator
              as_user_id: "${u1_id}"
              captures: { l1_fee: $.data.fee_cents, l1_cents: $.data.line_cents }
            - call: "GET /vault-cash/fed-orders/${o_id}"
              payload: {}
              as: FedCoordinator
              as_user_id: "${u1_id}"
              captures: { o_v2: $.data.version }
            - call: "POST /vault-cash/fed-orders/${o_id}/lines"
              payload: { denomination_cents: 100, strap_count: 1, expected_fed_order_version: "${o_v2}" }
              as: FedCoordinator
              as_user_id: "${u1_id}"
          trigger:
            - call: "GET /vault-cash/fed-orders/${o_id}"
              payload: {}
              as: FedCoordinator
              as_user_id: "${u1_id}"
          assert:
            - "FedOrder.${o_id}.face_total_cents == 20000"
            - "FedOrder.${o_id}.fee_total_cents == 126"
            - "FedOrder.${o_id}.grand_total_cents == 20126"
            - "captured per-line fee ${l1_fee} == 63 (line_cents ${l1_cents} == 10000)"

      - name: atm_residual_target_minmax_branches
        grounds:
          - calculations.atm_residual_target
          - entities.AtmForecast.fields.residual_target_cents
          - entities.AtmMachine.fields.cash_posture
        distinguishing_aspect: |
          Mode (a) >=3 inputs with nested min/max and a state-conditional branch:
          raw=max(100000, 15% of projection), then min with (capacity - load), and a
          CRITICAL-posture override to 0. Three ATMs with identical forecast inputs land in
          three different branches: 255000 (raw wins), 100000 (capacity headroom binds), 0 (CRITICAL).
        test_recipe:
          setup:
            - "Site S; ATMs X (cap 10,000,000, opening 5,000,000 → NORMAL), Y (cap 1,900,000, opening 500,000 → NORMAL: 500000*5=2,500,000 >= 1,900,000), Z (cap 10,000,000, opening 400,000 → CRITICAL: 400000*20=8,000,000 < 10,000,000)"
            - "No seasonal window → TRAILING variant; identical w=(1,000,000 / 2,000,000 / 3,000,000) → base 1,700,000, load 1,800,000"
          setup_api_calls:
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "S", site_type: "CENTRAL", vault_limit_cents: 100000000, insurance_coverage_cents: 100000000, dock_capacity: 2, opening_fit_cents: 50000000 }
              as: CashOperationsAdmin
              captures: { s_id: $.data.id }
            - call: "POST /vault-cash/atm-machines"
              payload: { site_id: "${s_id}", terminal_code: "ATM-X", cash_capacity_cents: 10000000, opening_balance_cents: 5000000 }
              as: CashOperationsAdmin
              captures: { x_id: $.data.id }
            - call: "POST /vault-cash/atm-machines"
              payload: { site_id: "${s_id}", terminal_code: "ATM-Y", cash_capacity_cents: 1900000, opening_balance_cents: 500000 }
              as: CashOperationsAdmin
              captures: { y_id: $.data.id }
            - call: "POST /vault-cash/atm-machines"
              payload: { site_id: "${s_id}", terminal_code: "ATM-Z", cash_capacity_cents: 10000000, opening_balance_cents: 400000 }
              as: CashOperationsAdmin
              captures: { z_id: $.data.id, z_posture: $.data.cash_posture }
            - call: "POST /vault-cash/staff-members"
              payload: { full_name: "Analyst A", home_site_id: "${s_id}" }
              as: CashOperationsAdmin
              captures: { ana_id: $.data.id }
          trigger:
            - call: "POST /vault-cash/atm-forecasts"
              payload: { atm_id: "${x_id}", forecast_date: "2026-08-10", w1_cents: 1000000, w2_cents: 2000000, w3_cents: 3000000 }
              as: AtmAnalyst
              as_user_id: "${ana_id}"
              captures: { fx_id: $.data.id }
            - call: "POST /vault-cash/atm-forecasts"
              payload: { atm_id: "${y_id}", forecast_date: "2026-08-10", w1_cents: 1000000, w2_cents: 2000000, w3_cents: 3000000 }
              as: AtmAnalyst
              as_user_id: "${ana_id}"
              captures: { fy_id: $.data.id }
            - call: "POST /vault-cash/atm-forecasts"
              payload: { atm_id: "${z_id}", forecast_date: "2026-08-10", w1_cents: 1000000, w2_cents: 2000000, w3_cents: 3000000 }
              as: AtmAnalyst
              as_user_id: "${ana_id}"
              captures: { fz_id: $.data.id }
          assert:
            - "AtmForecast.${fx_id}.residual_target_cents == 255000 (raw branch: max(100000, round(1700000*0.15)) = 255000; headroom 8,200,000 does not bind)"
            - "AtmForecast.${fy_id}.residual_target_cents == 100000 (capacity branch: headroom = 1,900,000 - 1,800,000 = 100,000 binds)"
            - "AtmForecast.${fz_id}.residual_target_cents == 0 (CRITICAL override branch; ATM Z cash_posture == CRITICAL per ${z_posture})"
            - "AtmForecast.${fx_id}.recommended_load_cents == 1800000"

      - name: insurance_headroom_evaluation_order
        grounds:
          - calculations.insurance_headroom_evaluation
          - entities.VaultSite.fields.insurance_headroom_cents
          - validations[priority=10]
        distinguishing_aspect: |
          Mode (c) circular-looking dependency with pinned evaluation order: headroom is
          computed from committed exposure EXCLUDING the candidate order, then compared with
          <=. A first ORDER of 15,000,000 commits; a second ORDER of exactly 5,000,000 equals
          the remaining headroom and is admitted; a third of 200,000 exceeds the zero remaining
          headroom and is rejected — the candidate never eats its own headroom mid-request.
        test_recipe:
          setup:
            - "Site S: coverage 50,000,000, limit 100,000,000, opening fit 30,000,000 → headroom starts at 20,000,000, posture NORMAL"
            - "FedCoordinator U1 on S; default clock 2026-08-01T00:00:00Z (cutoff passes for business_date 2026-08-04)"
          setup_api_calls:
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "S", site_type: "CENTRAL", vault_limit_cents: 100000000, insurance_coverage_cents: 50000000, dock_capacity: 2, opening_fit_cents: 30000000 }
              as: CashOperationsAdmin
              captures: { s_id: $.data.id, s_h0: $.data.insurance_headroom_cents }
            - call: "POST /vault-cash/staff-members"
              payload: { full_name: "Coord U1", home_site_id: "${s_id}" }
              as: CashOperationsAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /vault-cash/fed-orders"
              payload: { site_id: "${s_id}", direction: "ORDER", business_date: "2026-08-04" }
              as: FedCoordinator
              as_user_id: "${u1_id}"
              captures: { o1_id: $.data.id, o1_v: $.data.version }
            - call: "POST /vault-cash/fed-orders/${o1_id}/lines"
              payload: { denomination_cents: 10000, strap_count: 15, expected_fed_order_version: "${o1_v}" }
              as: FedCoordinator
              as_user_id: "${u1_id}"
            - call: "POST /vault-cash/fed-orders/${o1_id}/submit"
              payload: {}
              as: FedCoordinator
              as_user_id: "${u1_id}"
            - call: "POST /vault-cash/fed-orders"
              payload: { site_id: "${s_id}", direction: "ORDER", business_date: "2026-08-04" }
              as: FedCoordinator
              as_user_id: "${u1_id}"
              captures: { o2_id: $.data.id, o2_v: $.data.version }
            - call: "POST /vault-cash/fed-orders/${o2_id}/lines"
              payload: { denomination_cents: 10000, strap_count: 5, expected_fed_order_version: "${o2_v}" }
              as: FedCoordinator
              as_user_id: "${u1_id}"
            - call: "POST /vault-cash/fed-orders"
              payload: { site_id: "${s_id}", direction: "ORDER", business_date: "2026-08-04" }
              as: FedCoordinator
              as_user_id: "${u1_id}"
              captures: { o3_id: $.data.id, o3_v: $.data.version }
            - call: "POST /vault-cash/fed-orders/${o3_id}/lines"
              payload: { denomination_cents: 100, strap_count: 20, expected_fed_order_version: "${o3_v}" }
              as: FedCoordinator
              as_user_id: "${u1_id}"
          trigger:
            - call: "POST /vault-cash/fed-orders/${o2_id}/submit"
              payload: {}
              as: FedCoordinator
              as_user_id: "${u1_id}"
            - call: "POST /vault-cash/fed-orders/${o3_id}/submit"
              payload: {}
              as: FedCoordinator
              as_user_id: "${u1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "initial headroom ${s_h0} == 20000000"
            - "FedOrder.${o2_id}.status == SUBMITTED (face 5,000,000 <= headroom 5,000,000 — inclusive boundary admitted)"
            - "third submit rejected with error_id ERR_INSURANCE_HEADROOM_EXCEEDED (200,000 > headroom 0)"
            - "FedOrder.${o3_id}.status == DRAFT (rejected submit leaves state unchanged)"

  # ---------------------------------------------------------------- Rule 3 ---
  - rule_id: non_linear_state_machine
    instances:
      - name: fed_order_submit_recall_cycle
        grounds:
          - state_machines.FedOrder.SUBMITTED_to_DRAFT
          - state_machines.FedOrder.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Entity = FedOrder, shape = CYCLE (DRAFT→SUBMITTED→DRAFT→SUBMITTED). The recall edge
          releases pending_inbound_order_cents; resubmission re-acquires it. Version marches
          1→5 across the cycle proving each edge is a real mutation.
        test_recipe:
          setup:
            - "Site S (NORMAL: fit 10,000,000, limit 100,000,000, coverage 100,000,000); FedCoordinator U1"
            - "ORDER O business_date 2026-08-03 with one line denom 2000 x 10 straps (face 2,000,000)"
          setup_api_calls:
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "S", site_type: "BRANCH", vault_limit_cents: 100000000, insurance_coverage_cents: 100000000, dock_capacity: 2, opening_fit_cents: 10000000 }
              as: CashOperationsAdmin
              captures: { s_id: $.data.id }
            - call: "POST /vault-cash/staff-members"
              payload: { full_name: "Coord U1", home_site_id: "${s_id}" }
              as: CashOperationsAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /vault-cash/fed-orders"
              payload: { site_id: "${s_id}", direction: "ORDER", business_date: "2026-08-03" }
              as: FedCoordinator
              as_user_id: "${u1_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /vault-cash/fed-orders/${o_id}/lines"
              payload: { denomination_cents: 2000, strap_count: 10, expected_fed_order_version: "${o_v}" }
              as: FedCoordinator
              as_user_id: "${u1_id}"
          trigger:
            - call: "POST /vault-cash/fed-orders/${o_id}/submit"
              payload: {}
              as: FedCoordinator
              as_user_id: "${u1_id}"
            - call: "POST /vault-cash/fed-orders/${o_id}/recall"
              payload: {}
              as: FedCoordinator
              as_user_id: "${u1_id}"
              captures: { o_draft_v: $.data.version }
            - call: "POST /vault-cash/fed-orders/${o_id}/submit"
              payload: {}
              as: FedCoordinator
              as_user_id: "${u1_id}"
              captures: { o_final_v: $.data.version }
          assert:
            - "FedOrder.${o_id}.status == SUBMITTED after the DRAFT→SUBMITTED→DRAFT→SUBMITTED cycle"
            - "version marched 1 (create) → 2 (line) → 3 (submit) → 4 (recall, captured ${o_draft_v} == 4) → 5 (resubmit, ${o_final_v} == 5)"
            - "GET /vault-cash/vault-sites/${s_id}.pending_inbound_order_cents == 2000000 (released at recall, re-acquired at resubmit)"

      - name: atm_parallel_state_dimensions
        grounds:
          - state_machines.AtmMachine.ACTIVE_to_OUT_OF_SERVICE
          - entities.AtmMachine.fields.cash_posture
          - entities.AtmMachine.fields.service_status
        distinguishing_aspect: |
          Entity = AtmMachine, shape = PARALLEL DIMENSIONS (different entity than FedOrder).
          service_status toggles ACTIVE↔OUT_OF_SERVICE while cash_posture stays CRITICAL —
          neither axis rewrites the other.
        test_recipe:
          setup:
            - "Site S; ATM Z capacity 10,000,000 opening 400,000 → cash_posture CRITICAL (400000*20 < 10000000)"
            - "AtmAnalyst A1 on S"
          setup_api_calls:
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "S", site_type: "BRANCH", vault_limit_cents: 100000000, insurance_coverage_cents: 100000000, dock_capacity: 2, opening_fit_cents: 50000000 }
              as: CashOperationsAdmin
              captures: { s_id: $.data.id }
            - call: "POST /vault-cash/atm-machines"
              payload: { site_id: "${s_id}", terminal_code: "ATM-Z", cash_capacity_cents: 10000000, opening_balance_cents: 400000 }
              as: CashOperationsAdmin
              captures: { z_id: $.data.id, z_posture0: $.data.cash_posture }
            - call: "POST /vault-cash/staff-members"
              payload: { full_name: "Analyst A1", home_site_id: "${s_id}" }
              as: CashOperationsAdmin
              captures: { a1_id: $.data.id }
          trigger:
            - call: "POST /vault-cash/atm-machines/${z_id}/set-service-status"
              payload: { service_status: "OUT_OF_SERVICE" }
              as: AtmAnalyst
              as_user_id: "${a1_id}"
              captures: { z_oos_posture: $.data.cash_posture }
            - call: "POST /vault-cash/atm-machines/${z_id}/set-service-status"
              payload: { service_status: "ACTIVE" }
              as: AtmAnalyst
              as_user_id: "${a1_id}"
              captures: { z_back_posture: $.data.cash_posture }
          assert:
            - "initial cash_posture ${z_posture0} == CRITICAL with service_status ACTIVE"
            - "after OUT_OF_SERVICE: service_status == OUT_OF_SERVICE AND cash_posture ${z_oos_posture} == CRITICAL (unchanged)"
            - "after return to ACTIVE: service_status == ACTIVE AND cash_posture ${z_back_posture} == CRITICAL (still unchanged — axes independent)"

  # ---------------------------------------------------------------- Rule 4 ---
  - rule_id: transitive_cascade
    instances:
      - name: shipment_verify_cascade_flips_reconciliation
        grounds:
          - state_machines.CashShipment.IN_TRANSIT_to_VERIFIED
          - state_machines.Reconciliation.BALANCED_to_VARIANCE_PENDING
          - calculations.reconciliation_expected_balance
        distinguishing_aspect: |
          Depth-3 chain: verify (A) posts FED_RECEIPT ledger entry (B); the ledger append
          re-derives VaultSite totals (C); the site re-derivation refreshes the matching
          COUNTED/BALANCED Reconciliation and flips it to VARIANCE_PENDING (D). Each link is
          caused by the previous link, not by the verify call directly.
        test_recipe:
          setup:
            - "Site S: fit 30,000,000, limit 100,000,000, coverage 100,000,000, dock 2 (NORMAL); staff U1(custodian), U2(fed coord); carrier C"
            - "ORDER O face 2,000,000 business_date 2026-08-04, SUBMITTED + ACKNOWLEDGED at default clock 2026-08-01"
            - "Reconciliation R for S on 2026-08-02 with opening 30,000,000; counted 30,000,000 → BALANCED (variance 0)"
            - "Clock 2026-08-02T09:00; shipment for O loaded + departed (IN_TRANSIT)"
          setup_api_calls:
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "S", site_type: "CENTRAL", vault_limit_cents: 100000000, insurance_coverage_cents: 100000000, dock_capacity: 2, opening_fit_cents: 30000000 }
              as: CashOperationsAdmin
              captures: { s_id: $.data.id }
            - call: "POST /vault-cash/staff-members"
              payload: { full_name: "Cust U1", home_site_id: "${s_id}" }
              as: CashOperationsAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /vault-cash/staff-members"
              payload: { full_name: "Coord U2", home_site_id: "${s_id}" }
              as: CashOperationsAdmin
              captures: { u2_id: $.data.id }
            - call: "POST /vault-cash/carriers"
              payload: { name: "Carrier C", liability_cap_per_truck_cents: 50000000 }
              as: CashOperationsAdmin
              captures: { c_id: $.data.id }
            - call: "POST /vault-cash/fed-orders"
              payload: { site_id: "${s_id}", direction: "ORDER", business_date: "2026-08-04" }
              as: FedCoordinator
              as_user_id: "${u2_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /vault-cash/fed-orders/${o_id}/lines"
              payload: { denomination_cents: 2000, strap_count: 10, expected_fed_order_version: "${o_v}" }
              as: FedCoordinator
              as_user_id: "${u2_id}"
            - call: "POST /vault-cash/fed-orders/${o_id}/submit"
              payload: {}
              as: FedCoordinator
              as_user_id: "${u2_id}"
            - call: "POST /vault-cash/fed-orders/${o_id}/acknowledge"
              payload: {}
              as: FedCoordinator
              as_user_id: "${u2_id}"
            - call: "POST /vault-cash/reconciliations"
              payload: { site_id: "${s_id}", business_date: "2026-08-02", opening_balance_cents: 30000000 }
              as: VaultCustodian
              as_user_id: "${u1_id}"
              captures: { r_id: $.data.id }
            - call: "POST /vault-cash/reconciliations/${r_id}/count"
              payload: { counted_on_hand_cents: 30000000 }
              as: VaultCustodian
              as_user_id: "${u1_id}"
              captures: { r_status0: $.data.status }
            - call: "POST /vault-cash/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T09:00:00Z" }
              as: CashOperationsAdmin
            - call: "POST /vault-cash/cash-shipments"
              payload: { fed_order_id: "${o_id}", carrier_id: "${c_id}", scheduled_departure_at: "2026-08-02T10:00:00Z", scheduled_arrival_at: "2026-08-02T12:00:00Z" }
              as: FedCoordinator
              as_user_id: "${u2_id}"
              captures: { sh_id: $.data.id }
            - call: "POST /vault-cash/cash-shipments/${sh_id}/load"
              payload: {}
              as: FedCoordinator
              as_user_id: "${u2_id}"
            - call: "POST /vault-cash/cash-shipments/${sh_id}/depart"
              payload: {}
              as: CarrierDispatcher
              as_user_id: "${c_id}"
          trigger:
            - call: "POST /vault-cash/cash-shipments/${sh_id}/verify"
              payload: { counted_value_cents: 2000000 }
              as: CarrierDispatcher
              as_user_id: "${c_id}"
          assert:
            - "pre-verify recon status ${r_status0} == BALANCED (variance 0 within tolerance 1000)"
            - "Reconciliation.${r_id}.status == VARIANCE_PENDING (flipped by the cascade, not by the verify call directly)"
            - "Reconciliation.${r_id}.final_expected_cents == 32000000 and variance_cents == -2000000"
            - "GET /vault-cash/vault-sites/${s_id}.on_hand_fit_cents == 32000000 (link B→C)"
            - "FedOrder.${o_id}.status == RECEIVED"

      - name: counterfeit_seize_cascade_debits_site
        grounds:
          - state_machines.CounterfeitCase.DETECTED_to_SEIZED
          - entities.CashLedgerEntry.fields.entry_type
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (counterfeit seize, not shipment verify):
          seize (A) posts a COUNTERFEIT_SEIZURE ledger entry (B); the ledger append re-derives
          the site's fit balance (C). The seized face leaves fit circulation while the case
          tracks it separately.
        test_recipe:
          setup:
            - "Site S: fit 5,000,000 (NORMAL); custodian U1 on S"
            - "Counterfeit case K on S: 25 notes x 2000 cents → face 50,000, DETECTED"
          setup_api_calls:
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "S", site_type: "BRANCH", vault_limit_cents: 100000000, insurance_coverage_cents: 100000000, dock_capacity: 2, opening_fit_cents: 5000000 }
              as: CashOperationsAdmin
              captures: { s_id: $.data.id }
            - call: "POST /vault-cash/staff-members"
              payload: { full_name: "Cust U1", home_site_id: "${s_id}" }
              as: CashOperationsAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /vault-cash/counterfeit-cases"
              payload: { site_id: "${s_id}", denomination_cents: 2000, note_count: 25 }
              as: VaultCustodian
              as_user_id: "${u1_id}"
              captures: { k_id: $.data.id, k_face: $.data.face_value_cents }
          trigger:
            - call: "POST /vault-cash/counterfeit-cases/${k_id}/seize"
              payload: {}
              as: VaultCustodian
              as_user_id: "${u1_id}"
          assert:
            - "CounterfeitCase.${k_id}.status == SEIZED and seized_by_staff_id == ${u1_id}"
            - "face ${k_face} == 50000"
            - "GET /vault-cash/vault-sites/${s_id}.on_hand_fit_cents == 4950000 (5,000,000 - 50,000 via ledger link B→C)"
            - "GET /vault-cash/cash-ledger-entries?site_id=${s_id} contains one COUNTERFEIT_SEIZURE entry of -50000"

  # ---------------------------------------------------------------- Rule 5 ---
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_error_beats_sod_on_counterfeit_report
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors[ERR_CASE_INVALID_STATE]
          - errors[ERR_SOD_VIOLATION]
        distinguishing_aspect: |
          Error-category pair = state vs business_safety. A report attempt on an
          already-REPORTED case BY THE ORIGINAL SEIZER violates both the state gate
          (not SEIZED) and SoD (reporter == seizer); priority 7 beats priority 9, so
          ERR_CASE_INVALID_STATE must win.
        test_recipe:
          setup:
            - "Site S; custodian U1 (seizer); compliance officer U2 — both home_site S"
            - "Case K: DETECTED → SEIZED by U1 → REPORTED by U2"
          setup_api_calls:
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "S", site_type: "BRANCH", vault_limit_cents: 100000000, insurance_coverage_cents: 100000000, dock_capacity: 2, opening_fit_cents: 5000000 }
              as: CashOperationsAdmin
              captures: { s_id: $.data.id }
            - call: "POST /vault-cash/staff-members"
              payload: { full_name: "Cust U1", home_site_id: "${s_id}" }
              as: CashOperationsAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /vault-cash/staff-members"
              payload: { full_name: "Comp U2", home_site_id: "${s_id}" }
              as: CashOperationsAdmin
              captures: { u2_id: $.data.id }
            - call: "POST /vault-cash/counterfeit-cases"
              payload: { site_id: "${s_id}", denomination_cents: 2000, note_count: 25 }
              as: VaultCustodian
              as_user_id: "${u1_id}"
              captures: { k_id: $.data.id }
            - call: "POST /vault-cash/counterfeit-cases/${k_id}/seize"
              payload: {}
              as: VaultCustodian
              as_user_id: "${u1_id}"
            - call: "POST /vault-cash/counterfeit-cases/${k_id}/report"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "${u2_id}"
          trigger:
            - call: "POST /vault-cash/counterfeit-cases/${k_id}/report"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "${u1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "second report rejected with error_id ERR_CASE_INVALID_STATE (state priority 7 beats SoD priority 9 even though reporter==seizer also holds)"
            - "CounterfeitCase.${k_id}.status == REPORTED (unchanged)"

      - name: insurance_safety_beats_liability_fiscal_on_shipment_create
        grounds:
          - validations[priority=10]
          - validations[priority=18]
          - errors[ERR_INSURANCE_HEADROOM_EXCEEDED]
          - errors[ERR_CARRIER_LIABILITY_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair = business_safety vs business_fiscal (different pair than the
          sibling instance). An inbound shipment whose declared value busts BOTH the
          destination's insurance headroom (600,000 > 100,000) AND the carrier liability cap
          (600,000 > 500,000) must surface ERR_INSURANCE_HEADROOM_EXCEEDED (safety p10) over
          ERR_CARRIER_LIABILITY_EXCEEDED (fiscal p18).
        test_recipe:
          setup:
            - "Site A: fit 10,000,000 (NORMAL); Site B: fit 900,000, coverage 1,000,000, limit 10,000,000, dock 2 → headroom 100,000, posture NORMAL"
            - "Carrier C: liability cap 500,000, ACTIVE; FedCoordinator U1 on site A"
          setup_api_calls:
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "A", site_type: "CENTRAL", vault_limit_cents: 100000000, insurance_coverage_cents: 100000000, dock_capacity: 2, opening_fit_cents: 10000000 }
              as: CashOperationsAdmin
              captures: { a_id: $.data.id }
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "B", site_type: "BRANCH", vault_limit_cents: 10000000, insurance_coverage_cents: 1000000, dock_capacity: 2, opening_fit_cents: 900000 }
              as: CashOperationsAdmin
              captures: { b_id: $.data.id }
            - call: "POST /vault-cash/carriers"
              payload: { name: "Carrier C", liability_cap_per_truck_cents: 500000 }
              as: CashOperationsAdmin
              captures: { c_id: $.data.id }
            - call: "POST /vault-cash/staff-members"
              payload: { full_name: "Coord U1", home_site_id: "${a_id}" }
              as: CashOperationsAdmin
              captures: { u1_id: $.data.id }
          trigger:
            - call: "POST /vault-cash/cash-shipments"
              payload: { carrier_id: "${c_id}", origin_site_id: "${a_id}", destination_site_id: "${b_id}", declared_value_cents: 600000, scheduled_departure_at: "2026-08-10T10:00:00Z", scheduled_arrival_at: "2026-08-10T12:00:00Z" }
              as: FedCoordinator
              as_user_id: "${u1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "create rejected with error_id ERR_INSURANCE_HEADROOM_EXCEEDED (safety beats fiscal)"
            - "GET /vault-cash/cash-shipments?origin_site_id=${a_id} returns 0 rows (nothing persisted)"

  # ---------------------------------------------------------------- Rule 6 ---
  - rule_id: boundary_precision_check
    instances:
      - name: vault_posture_exactly_ninety_percent
        grounds:
          - calculations.vault_posture_derivation
          - entities.VaultSite.fields.posture
        distinguishing_aspect: |
          Metric = utilization vs vault limit, integer cross-multiplication, >= semantics:
          on_hand 8,999,999 with limit 10,000,000 is NORMAL; exactly 9,000,000 trips ELEVATED.
          Reachable via POST /vault-cash/cash-ledger-entries (+1 cent adjustment) and observed
          via GET /vault-cash/vault-sites/{id}.
        test_recipe:
          setup:
            - "Site S: limit 10,000,000, coverage 100,000,000, opening fit 8,999,999 → NORMAL; custodian U1"
          setup_api_calls:
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "S", site_type: "BRANCH", vault_limit_cents: 10000000, insurance_coverage_cents: 100000000, dock_capacity: 2, opening_fit_cents: 8999999 }
              as: CashOperationsAdmin
              captures: { s_id: $.data.id, p0: $.data.posture }
            - call: "POST /vault-cash/staff-members"
              payload: { full_name: "Cust U1", home_site_id: "${s_id}" }
              as: CashOperationsAdmin
              captures: { u1_id: $.data.id }
          trigger:
            - call: "POST /vault-cash/cash-ledger-entries"
              payload: { site_id: "${s_id}", business_date: "2026-08-01", signed_amount_cents: 1, bucket: "FIT" }
              as: VaultCustodian
              as_user_id: "${u1_id}"
            - call: "GET /vault-cash/vault-sites/${s_id}"
              payload: {}
              as: CashOperationsAdmin
              captures: { p1: $.data.posture }
          assert:
            - "posture before adjustment ${p0} == NORMAL (89,999,990 < 90,000,000 cross-product)"
            - "on_hand_fit_cents after +1 == 9000000 and posture ${p1} == ELEVATED (90,000,000 >= 90,000,000 — inclusive boundary)"

      - name: atm_load_exact_strap_multiple_no_roundup
        grounds:
          - calculations.atm_forecast_projection
          - entities.AtmForecast.fields.recommended_load_cents
        distinguishing_aspect: |
          Metric = strap-ceiling rounding (different metric than utilization, different
          endpoint POST /vault-cash/atm-forecasts). A projection of exactly 2,000,000 cents
          is an exact multiple of the 200,000-cent load strap and must NOT round up to
          2,200,000: ceil(2,000,000/200,000)*200,000 == 2,000,000.
        test_recipe:
          setup:
            - "Site S; ATM X (capacity 10,000,000, opening 5,000,000 → NORMAL); no seasonal window (TRAILING); analyst A1"
            - "w1=w2=w3=2,000,000 → base = 0.5*2e6+0.3*2e6+0.2*2e6 = 2,000,000"
          setup_api_calls:
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "S", site_type: "BRANCH", vault_limit_cents: 100000000, insurance_coverage_cents: 100000000, dock_capacity: 2, opening_fit_cents: 50000000 }
              as: CashOperationsAdmin
              captures: { s_id: $.data.id }
            - call: "POST /vault-cash/atm-machines"
              payload: { site_id: "${s_id}", terminal_code: "ATM-X", cash_capacity_cents: 10000000, opening_balance_cents: 5000000 }
              as: CashOperationsAdmin
              captures: { x_id: $.data.id }
            - call: "POST /vault-cash/staff-members"
              payload: { full_name: "Analyst A1", home_site_id: "${s_id}" }
              as: CashOperationsAdmin
              captures: { a1_id: $.data.id }
          trigger:
            - call: "POST /vault-cash/atm-forecasts"
              payload: { atm_id: "${x_id}", forecast_date: "2026-08-11", w1_cents: 2000000, w2_cents: 2000000, w3_cents: 2000000 }
              as: AtmAnalyst
              as_user_id: "${a1_id}"
              captures: { f_id: $.data.id }
          assert:
            - "AtmForecast.${f_id}.projected_base_cents == 2000000 and variant_applied == TRAILING"
            - "AtmForecast.${f_id}.recommended_load_cents == 2000000 (exact strap multiple — no round-up)"
            - "AtmForecast.${f_id}.residual_target_cents == 300000 (max(100000, 15% of 2,000,000); headroom 8,000,000 does not bind)"

  # ---------------------------------------------------------------- Rule 7 ---
  - rule_id: cross_entity_state_dependency
    instances:
      - name: fed_order_submit_blocked_by_frozen_vault
        grounds:
          - state_machines.FedOrder.DRAFT_to_SUBMITTED
          - entities.VaultSite.fields.posture
          - errors[ERR_VAULT_FROZEN]
        distinguishing_aspect: |
          Entity pair = FedOrder→VaultSite. A site born with on_hand_total == vault_limit is
          FROZEN (inclusive >=); submit of a well-formed DRAFT order on that site is rejected
          with ERR_VAULT_FROZEN even though the order's own state is valid.
        test_recipe:
          setup:
            - "Site S: limit 10,000,000, coverage 50,000,000, opening fit 10,000,000 → FROZEN from creation; FedCoordinator U1"
            - "ORDER O (business_date 2026-08-03) with line denom 2000 x 10 straps"
          setup_api_calls:
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "S", site_type: "BRANCH", vault_limit_cents: 10000000, insurance_coverage_cents: 50000000, dock_capacity: 2, opening_fit_cents: 10000000 }
              as: CashOperationsAdmin
              captures: { s_id: $.data.id, p0: $.data.posture }
            - call: "POST /vault-cash/staff-members"
              payload: { full_name: "Coord U1", home_site_id: "${s_id}" }
              as: CashOperationsAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /vault-cash/fed-orders"
              payload: { site_id: "${s_id}", direction: "ORDER", business_date: "2026-08-03" }
              as: FedCoordinator
              as_user_id: "${u1_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /vault-cash/fed-orders/${o_id}/lines"
              payload: { denomination_cents: 2000, strap_count: 10, expected_fed_order_version: "${o_v}" }
              as: FedCoordinator
              as_user_id: "${u1_id}"
          trigger:
            - call: "POST /vault-cash/fed-orders/${o_id}/submit"
              payload: {}
              as: FedCoordinator
              as_user_id: "${u1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "site posture at creation ${p0} == FROZEN"
            - "submit rejected with error_id ERR_VAULT_FROZEN"
            - "FedOrder.${o_id}.status == DRAFT (unchanged)"

      - name: shipment_load_blocked_until_order_acknowledged
        grounds:
          - state_machines.CashShipment.SCHEDULED_to_LOADED
          - entities.FedOrder.fields.status
          - errors[ERR_LINKED_ORDER_NOT_ACKNOWLEDGED]
        distinguishing_aspect: |
          Entity pair = CashShipment→FedOrder (different pair than the sibling). A shipment
          may be CREATED while its linked order is SUBMITTED, but LOAD is rejected with
          ERR_LINKED_ORDER_NOT_ACKNOWLEDGED until the order reaches ACKNOWLEDGED; after
          acknowledge, the same load succeeds.
        test_recipe:
          setup:
            - "Site S (NORMAL, fit 30,000,000); FedCoordinator U1; carrier C"
            - "ORDER O face 2,000,000 business_date 2026-08-04, SUBMITTED (not acknowledged)"
            - "Shipment SH linked to O (created while SUBMITTED)"
          setup_api_calls:
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "S", site_type: "CENTRAL", vault_limit_cents: 100000000, insurance_coverage_cents: 100000000, dock_capacity: 2, opening_fit_cents: 30000000 }
              as: CashOperationsAdmin
              captures: { s_id: $.data.id }
            - call: "POST /vault-cash/staff-members"
              payload: { full_name: "Coord U1", home_site_id: "${s_id}" }
              as: CashOperationsAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /vault-cash/carriers"
              payload: { name: "Carrier C", liability_cap_per_truck_cents: 50000000 }
              as: CashOperationsAdmin
              captures: { c_id: $.data.id }
            - call: "POST /vault-cash/fed-orders"
              payload: { site_id: "${s_id}", direction: "ORDER", business_date: "2026-08-04" }
              as: FedCoordinator
              as_user_id: "${u1_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /vault-cash/fed-orders/${o_id}/lines"
              payload: { denomination_cents: 2000, strap_count: 10, expected_fed_order_version: "${o_v}" }
              as: FedCoordinator
              as_user_id: "${u1_id}"
            - call: "POST /vault-cash/fed-orders/${o_id}/submit"
              payload: {}
              as: FedCoordinator
              as_user_id: "${u1_id}"
            - call: "POST /vault-cash/cash-shipments"
              payload: { fed_order_id: "${o_id}", carrier_id: "${c_id}", scheduled_departure_at: "2026-08-02T10:00:00Z", scheduled_arrival_at: "2026-08-02T12:00:00Z" }
              as: FedCoordinator
              as_user_id: "${u1_id}"
              captures: { sh_id: $.data.id }
          trigger:
            - call: "POST /vault-cash/cash-shipments/${sh_id}/load"
              payload: {}
              as: FedCoordinator
              as_user_id: "${u1_id}"
              captures: { err: $.data.error_id }
            - call: "POST /vault-cash/fed-orders/${o_id}/acknowledge"
              payload: {}
              as: FedCoordinator
              as_user_id: "${u1_id}"
            - call: "POST /vault-cash/cash-shipments/${sh_id}/load"
              payload: {}
              as: FedCoordinator
              as_user_id: "${u1_id}"
          assert:
            - "first load rejected with error_id ERR_LINKED_ORDER_NOT_ACKNOWLEDGED"
            - "after acknowledge, second load succeeds: CashShipment.${sh_id}.status == LOADED"
            - "inbound destination in_transit_inbound_cents == 2000000 on GET /vault-cash/vault-sites/${s_id}"

  # ---------------------------------------------------------------- Rule 8 ---
  - rule_id: resource_temporal_overlap
    instances:
      - name: carrier_turnaround_buffer_boundary
        grounds:
          - validations[priority=12]
          - errors[ERR_CARRIER_TURNAROUND_CONFLICT]
        distinguishing_aspect: |
          Resource = Carrier, interval semantics = half-open windows expanded by a 45-minute
          turnaround buffer. A follow-on shipment departing 30 min after a 12:00 arrival is
          rejected; departing exactly at 12:45 (buffer exactly met, strict < comparison) is
          admitted.
        test_recipe:
          setup:
            - "Sites A (fit 10,000,000) and B; carrier C cap 50,000,000 ACTIVE; FedCoordinator U1 on A"
            - "Shipment S1 A→B 2026-08-10 10:00→12:00 declared 100,000"
          setup_api_calls:
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "A", site_type: "CENTRAL", vault_limit_cents: 100000000, insurance_coverage_cents: 100000000, dock_capacity: 5, opening_fit_cents: 10000000 }
              as: CashOperationsAdmin
              captures: { a_id: $.data.id }
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "B", site_type: "BRANCH", vault_limit_cents: 100000000, insurance_coverage_cents: 100000000, dock_capacity: 5, opening_fit_cents: 0 }
              as: CashOperationsAdmin
              captures: { b_id: $.data.id }
            - call: "POST /vault-cash/carriers"
              payload: { name: "Carrier C", liability_cap_per_truck_cents: 50000000 }
              as: CashOperationsAdmin
              captures: { c_id: $.data.id }
            - call: "POST /vault-cash/staff-members"
              payload: { full_name: "Coord U1", home_site_id: "${a_id}" }
              as: CashOperationsAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /vault-cash/cash-shipments"
              payload: { carrier_id: "${c_id}", origin_site_id: "${a_id}", destination_site_id: "${b_id}", declared_value_cents: 100000, scheduled_departure_at: "2026-08-10T10:00:00Z", scheduled_arrival_at: "2026-08-10T12:00:00Z" }
              as: FedCoordinator
              as_user_id: "${u1_id}"
              captures: { s1_id: $.data.id }
          trigger:
            - call: "POST /vault-cash/cash-shipments"
              payload: { carrier_id: "${c_id}", origin_site_id: "${a_id}", destination_site_id: "${b_id}", declared_value_cents: 100000, scheduled_departure_at: "2026-08-10T12:30:00Z", scheduled_arrival_at: "2026-08-10T14:00:00Z" }
              as: FedCoordinator
              as_user_id: "${u1_id}"
              captures: { err: $.data.error_id }
            - call: "POST /vault-cash/cash-shipments"
              payload: { carrier_id: "${c_id}", origin_site_id: "${a_id}", destination_site_id: "${b_id}", declared_value_cents: 100000, scheduled_departure_at: "2026-08-10T12:45:00Z", scheduled_arrival_at: "2026-08-10T14:00:00Z" }
              as: FedCoordinator
              as_user_id: "${u1_id}"
              captures: { s2_id: $.data.id }
          assert:
            - "12:30 departure rejected with ERR_CARRIER_TURNAROUND_CONFLICT (12:30 < 12:00+45min)"
            - "12:45 departure admitted (${s2_id} created, status SCHEDULED) — buffer exactly met is allowed"
            - "GET /vault-cash/vault-sites/${a_id}.reserved_out_cents == 200000 (S1 + S2 only)"

      - name: dock_capacity_point_instant_aggregate
        grounds:
          - validations[priority=13]
          - errors[ERR_DOCK_CAPACITY_EXCEEDED]
          - entities.VaultSite.fields.dock_capacity
        distinguishing_aspect: |
          Resource = VaultSite dock, interval semantics = aggregate point-instant capacity
          (different from the pairwise turnaround buffer): an arrival instant covered by a
          +/-30-minute dock window of dock_capacity other inbound shipments is rejected.
          Three different carriers avoid turnaround interference; the third arrival at the
          same 14:00 instant, with dock_capacity 2 already covered, is rejected.
        test_recipe:
          setup:
            - "Site A (fit 30,000,000); Site B dock_capacity 2; carriers C1, C2, C3; FedCoordinator U1 on A"
            - "Shipments S1 (C1) and S2 (C2) A→B both arriving 2026-08-12T14:00:00Z (departures staggered 13:00)"
          setup_api_calls:
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "A", site_type: "CENTRAL", vault_limit_cents: 100000000, insurance_coverage_cents: 100000000, dock_capacity: 5, opening_fit_cents: 30000000 }
              as: CashOperationsAdmin
              captures: { a_id: $.data.id }
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "B", site_type: "BRANCH", vault_limit_cents: 100000000, insurance_coverage_cents: 100000000, dock_capacity: 2, opening_fit_cents: 0 }
              as: CashOperationsAdmin
              captures: { b_id: $.data.id }
            - call: "POST /vault-cash/carriers"
              payload: { name: "C1", liability_cap_per_truck_cents: 50000000 }
              as: CashOperationsAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /vault-cash/carriers"
              payload: { name: "C2", liability_cap_per_truck_cents: 50000000 }
              as: CashOperationsAdmin
              captures: { c2_id: $.data.id }
            - call: "POST /vault-cash/carriers"
              payload: { name: "C3", liability_cap_per_truck_cents: 50000000 }
              as: CashOperationsAdmin
              captures: { c3_id: $.data.id }
            - call: "POST /vault-cash/staff-members"
              payload: { full_name: "Coord U1", home_site_id: "${a_id}" }
              as: CashOperationsAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /vault-cash/cash-shipments"
              payload: { carrier_id: "${c1_id}", origin_site_id: "${a_id}", destination_site_id: "${b_id}", declared_value_cents: 100000, scheduled_departure_at: "2026-08-12T13:00:00Z", scheduled_arrival_at: "2026-08-12T14:00:00Z" }
              as: FedCoordinator
              as_user_id: "${u1_id}"
            - call: "POST /vault-cash/cash-shipments"
              payload: { carrier_id: "${c2_id}", origin_site_id: "${a_id}", destination_site_id: "${b_id}", declared_value_cents: 100000, scheduled_departure_at: "2026-08-12T13:00:00Z", scheduled_arrival_at: "2026-08-12T14:00:00Z" }
              as: FedCoordinator
              as_user_id: "${u1_id}"
          trigger:
            - call: "POST /vault-cash/cash-shipments"
              payload: { carrier_id: "${c3_id}", origin_site_id: "${a_id}", destination_site_id: "${b_id}", declared_value_cents: 100000, scheduled_departure_at: "2026-08-12T13:00:00Z", scheduled_arrival_at: "2026-08-12T14:00:00Z" }
              as: FedCoordinator
              as_user_id: "${u1_id}"
              captures: { err: $.data.error_id }
            - call: "POST /vault-cash/cash-shipments"
              payload: { carrier_id: "${c3_id}", origin_site_id: "${a_id}", destination_site_id: "${b_id}", declared_value_cents: 100000, scheduled_departure_at: "2026-08-12T13:30:00Z", scheduled_arrival_at: "2026-08-12T14:31:00Z" }
              as: FedCoordinator
              as_user_id: "${u1_id}"
              captures: { s3_id: $.data.id }
          assert:
            - "third 14:00 arrival rejected with ERR_DOCK_CAPACITY_EXCEEDED (window 13:30-14:30 already holds 2 == dock_capacity)"
            - "arrival 14:31 admitted (${s3_id} created): its window 14:01-15:01 does not contain 14:00-window occupants' covering count at capacity — count at 14:31 is 0 of the earlier pair (their windows end 14:30)"

  # ---------------------------------------------------------------- Rule 9 ---
  - rule_id: compensating_invariant
    instances:
      - name: shipment_create_then_cancel_restores_reserved_out
        grounds:
          - state_machines.CashShipment.SCHEDULED_to_CANCELLED
          - entities.VaultSite.fields.reserved_out_cents
        distinguishing_aspect: |
          Conserved quantity = origin site committed position (on_hand_total_cents +
          reserved_out_cents). Create reserves declared_value; cancel before departure
          releases it exactly. Pre-create and post-cancel snapshots must be identical —
          zero drift in the named quantity.
        test_recipe:
          setup:
            - "Sites A (fit 5,000,000, NORMAL) and B; carrier C; FedCoordinator U1 on A"
          setup_api_calls:
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "A", site_type: "CENTRAL", vault_limit_cents: 100000000, insurance_coverage_cents: 100000000, dock_capacity: 5, opening_fit_cents: 5000000 }
              as: CashOperationsAdmin
              captures: { a_id: $.data.id, a_fit0: $.data.on_hand_fit_cents, a_res0: $.data.reserved_out_cents }
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "B", site_type: "BRANCH", vault_limit_cents: 100000000, insurance_coverage_cents: 100000000, dock_capacity: 5, opening_fit_cents: 0 }
              as: CashOperationsAdmin
              captures: { b_id: $.data.id }
            - call: "POST /vault-cash/carriers"
              payload: { name: "Carrier C", liability_cap_per_truck_cents: 50000000 }
              as: CashOperationsAdmin
              captures: { c_id: $.data.id }
            - call: "POST /vault-cash/staff-members"
              payload: { full_name: "Coord U1", home_site_id: "${a_id}" }
              as: CashOperationsAdmin
              captures: { u1_id: $.data.id }
          trigger:
            - call: "POST /vault-cash/cash-shipments"
              payload: { carrier_id: "${c_id}", origin_site_id: "${a_id}", destination_site_id: "${b_id}", declared_value_cents: 1000000, scheduled_departure_at: "2026-08-10T10:00:00Z", scheduled_arrival_at: "2026-08-10T12:00:00Z" }
              as: FedCoordinator
              as_user_id: "${u1_id}"
              captures: { sh_id: $.data.id }
            - call: "GET /vault-cash/vault-sites/${a_id}"
              payload: {}
              as: FedCoordinator
              as_user_id: "${u1_id}"
              captures: { a_res_mid: $.data.reserved_out_cents }
            - call: "POST /vault-cash/cash-shipments/${sh_id}/cancel"
              payload: {}
              as: FedCoordinator
              as_user_id: "${u1_id}"
            - call: "GET /vault-cash/vault-sites/${a_id}"
              payload: {}
              as: FedCoordinator
              as_user_id: "${u1_id}"
              captures: { a_fit_end: $.data.on_hand_fit_cents, a_res_end: $.data.reserved_out_cents }
          assert:
            - "after create: reserved_out ${a_res_mid} == 1000000 (reservation taken)"
            - "after cancel: on_hand_fit ${a_fit_end} == initial ${a_fit0} == 5000000 AND reserved_out ${a_res_end} == initial ${a_res0} == 0"
            - "invariant: (on_hand_total + reserved_out) before create == after cancel == 5000000 — no drift"

      - name: fitness_batch_conservation_across_resort
        grounds:
          - calculations.fitness_settlement
          - state_machines.FitnessBatch.SORTED_to_OPEN
          - entities.FitnessBatch.fields.shrink_cents
        distinguishing_aspect: |
          Conserved quantity = batch escrowed input (different quantity than site cash).
          After every sort-results AND across a reopen/re-sort cycle:
          input_unfit_cents == fit + unfit + counterfeit + shrink. Batch 1 settles at the
          shrink boundary (== 500, inclusive). Batch 2 re-sorts to a different split; the
          invariant still holds with a different shrink.
        test_recipe:
          setup:
            - "Site S: unfit 2,000,000, fit 1,000,000 (NORMAL); custodian U1"
            - "Batch B1 input 1,000,000; Batch B2 input 500,000"
          setup_api_calls:
            - call: "POST /vault-cash/vault-sites"
              payload: { name: "S", site_type: "BRANCH", vault_limit_cents: 100000000, insurance_coverage_cents: 100000000, dock_capacity: 2, opening_fit_cents: 1000000, opening_unfit_cents: 2000000 }
              as: CashOperationsAdmin
              captures: { s_id: $.data.id }
            - call: "POST /vault-cash/staff-members"
              payload: { full_name: "Cust U1", home_site_id: "${s_id}" }
              as: CashOperationsAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /vault-cash/fitness-batches"
              payload: { site_id: "${s_id}", input_unfit_cents: 1000000 }
              as: VaultCustodian
              as_user_id: "${u1_id}"
              captures: { b1_id: $.data.id }
            - call: "POST /vault-cash/fitness-batches/${b1_id}/sort-results"
              payload: { fit_recovered_cents: 600000, unfit_remaining_cents: 399000, counterfeit_face_cents: 500 }
              as: VaultCustodian
              as_user_id: "${u1_id}"
              captures: { b1_shrink: $.data.shrink_cents }
            - call: "POST /vault-cash/fitness-batches/${b1_id}/settle"
              payload: {}
              as: VaultCustodian
              as_user_id: "${u1_id}"
            - call: "POST /vault-cash/fitness-batches"
              payload: { site_id: "${s_id}", input_unfit_cents: 500000 }
              as: VaultCustodian
              as_user_id: "${u1_id}"
              captures: { b2_id: $.data.id }
            - call: "POST /vault-cash/fitness-batches/${b2_id}/sort-results"
              payload: { fit_recovered_cents: 200000, unfit_remaining_cents: 300000, counterfeit_face_cents: 0 }
              as: VaultCustodian
              as_user_id: "${u1_id}"
            - call: "POST /vault-cash/fitness-batches/${b2_id}/reopen"
              payload: {}
              as: VaultCustodian
              as_user_id: "${u1_id}"
          trigger:
            - call: "POST /vault-cash/fitness-batches/${b2_id}/sort-results"
              payload: { fit_recovered_cents: 250000, unfit_remaining_cents: 249500, counterfeit_face_cents: 0 }
              as: VaultCustodian
              as_user_id: "${u1_id}"
              captures: { b2_shrink2: $.data.shrink_cents }
            - call: "POST /vault-cash/fitness-batches/${b2_id}/settle"
              payload: {}
              as: VaultCustodian
              as_user_id: "${u1_id}"
          assert:
            - "B1: shrink ${b1_shrink} == 500 (== SHRINK_TOLERANCE_CENTS, inclusive boundary settles) and 600000+399000+500+500 == 1000000"
            - "B1 status == SETTLED; auto-created CounterfeitCase (face 500, DETECTED) discoverable via GET /vault-cash/counterfeit-cases?fitness_batch_id=${b1_id}"
            - "B2 round 1: 200000+300000+0+0 == 500000; after reopen buckets reset; round 2: shrink ${b2_shrink2} == 500 and 250000+249500+0+500 == 500000"
            - "B2 status == SETTLED after second settle — conservation held across the recount cycle"
