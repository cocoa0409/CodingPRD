            - call: "POST /eo-applications/${eo_id}/reviews"
              payload: { review_type: "UNDERWRITING", outcome: "PASSED" }
              as: ClearanceSupervisor
              as_user_id: "supervisor-one"
            - call: "POST /eo-applications/${eo_id}/state"
              payload: { to_status: "BOUND", policy_number: "EO-2026-91" }
              as: ProductionAdmin
            - call: "POST /productions/${prod_id}/delivery-packages"
              payload: { clearance_chart_id: "${chart_id}", distributor_name: "Northgate Docs", window_class: "ALL_MEDIA_WINDOW" }
              as: ProductionAdmin
