            - "challenge on a violation of a FINALIZED inspection -> ERR_INSPECTION_FINALIZED (409)"

      - name: challenge_on_removed_violation_rejected
        claim_type: invalid_transition
        grounds: ["errors[ERR_VIOLATION_NOT_ACTIVE]", state_machines.InspectionViolation]
