  - section: errors
    instances:

      - name: error_records_frozen_is_triggerable
        claim_type: Violation → Error
        grounds:
          - errors[ERR_RECORDS_FROZEN]
          - validations[priority=5]
        excluded_because:
          difficulty_instance: records_freeze_beats_referral_state_gate
          rationale: "The §1.8 priority-pair instance triggers the global write gate directly and asserts the error id."

      - name: error_titration_interval_is_triggerable
        claim_type: Violation → Error
        grounds:
          - errors[ERR_TITRATION_INTERVAL]
          - validations[priority=21]
        excluded_because:
          difficulty_instance: titration_minimum_gap_boundary_on_appliance
          rationale: "Raised at thirteen days and cleared at fourteen inside the named §1.8 overlap instance."

      - name: error_loaner_unavailable_is_triggerable
        claim_type: Violation → Error
        grounds:
          - errors[ERR_LOANER_UNAVAILABLE]
          - validations[priority=34]
        excluded_because:
          difficulty_instance: loaner_half_open_interval_on_spare_appliance
          rationale: "The overlapping loaner assignment is the failure leg of the named §1.8 instance."

      - name: error_appeal_limit_reached_is_triggerable
        claim_type: Violation → Error
        grounds:
          - errors[ERR_APPEAL_LIMIT_REACHED]
          - validations[priority=35]
        excluded_because:
          difficulty_instance: prior_auth_denial_appeal_cycle_to_denied_final
          rationale: "The third appeal attempt in the named §1.8 cycle instance returns this error id."

      - name: error_invalid_state_is_triggerable
        claim_type: Violation → Error
        grounds:
          - errors[ERR_INVALID_STATE]
          - validations[priority=12]
        excluded_because:
          difficulty_instance: appliance_create_requires_received_accepted_lab_order
          rationale: "Founding an appliance on a merely SHIPPED lab order returns this error id in the named §1.8 instance."

      - name: error_protrusion_limit_is_reachable_after_the_interval_clears
        claim_type: Priority conflict
        grounds:
          - errors[ERR_PROTRUSION_LIMIT_EXCEEDED]
          - validations[priority=22]
        excluded_because:
          difficulty_instance: titration_interval_beats_protrusion_ceiling
          rationale: "The §1.8 instance proves rung 21 masks rung 22 on the same request; the un-masked ceiling error is asserted by the §1.9 instance protrusion_ceiling_rejects_the_overshoot_and_accepts_the_exact_fit."

      - name: unknown_provider_referral_and_appliance_ids_take_their_own_not_found_codes
        claim_type: Violation → Error
        grounds:
          - errors[ERR_PROVIDER_NOT_FOUND]
          - errors[ERR_REFERRAL_NOT_FOUND]
          - errors[ERR_APPLIANCE_NOT_FOUND]
          - validations[priority=3]
          - validations[priority=4]
        distinguishing_aspect: |
          Three of the five not-found codes are entity specific and must not collapse into the generic
          one: an unknown treating_dentist_id is ERR_PROVIDER_NOT_FOUND, an unknown referral_id in a
          lab-order body is ERR_REFERRAL_NOT_FOUND, and an unknown appliance id in a path is
          ERR_APPLIANCE_NOT_FOUND, all with HTTP 404.
