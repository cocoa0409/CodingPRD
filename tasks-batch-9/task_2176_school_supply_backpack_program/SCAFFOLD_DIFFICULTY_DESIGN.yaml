            - "Lincoln Elementary is ACTIVE with a PUBLISHED K_2 needs list (4 pencils, 2 notebooks, 1 backpack) and target_student_count 100, title_i_pct 0.80."
            - "The cycle holds 40 pencils, 20 notebooks and 10 backpacks on hand."
