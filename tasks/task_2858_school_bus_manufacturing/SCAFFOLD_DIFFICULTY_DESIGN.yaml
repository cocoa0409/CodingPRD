              payload: { bus_unit_id: "${unit_tx_id}", test_bay_id: "${bay_1_id}", test_type: "EMERGENCY_EXIT", window_start: "2026-09-16", window_end: "2026-09-16" }
              as: QualityInspector
              as_user_id: "qc-01"
              captures: { test_exit_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-20T00:00:00Z" }
              as: QualityInspector
              as_user_id: "qc-01"
          trigger:
            - call: "POST /quality-tests/${test_brake_id}/record-result"
              payload: { outcome: "FAIL", result_notes: "pedal travel out of tolerance" }
              as: QualityInspector
              as_user_id: "qc-01"
              captures: { failed_status: $.data.status }
          assert:
            - "hop 1: QualityTest.${test_brake_id}.status == FAILED with recorded_by_user_id qc-01 and recorded_at 2026-10-20T00:00:00Z"
            - "hop 2: BusUnit.${unit_tx_id}.certification_status == NONCONFORMING"
            - "hop 3: BuildSlot.${slot_tx_id}.status == RELEASED; ProductionLine.${line_a1_id}.committed_slot_days == 0 (was 7); BusUnit.${unit_tx_id}.production_status == PLANNED; QualityTest.${test_exit_id}.status == VOIDED"
            - "hop 4: ContractOrder.${order_tx_id}.status == BREACHED, at_risk_unit_count == 1, liquidated_damages_cents == 112500 (15 days late x 1 unit x 7500, below the 804511 cap)"
            - "ProductionLine.${line_a1_id}.version incremented on the cascade release even though no client sent a line write"
            - "the clock move to 2026-10-20 alone left delivery_posture ON_TRACK; only the cascade recomputation turned it BREACHED"
            - "a later re-run BRAKE test cannot rescue this unit by waiver: BRAKE is not waivable (ERR_WAIVER_NOT_PERMITTED)"

      - name: cascade_b_campaign_launch_escalates_through_dealer_standing
        grounds:
          - state_machines.RecallCampaign.DRAFT_to_LAUNCHED
          - state_machines.BusUnit.NONE_to_RECALL_OPEN
          - state_machines.Dealer.GOOD_to_RESTRICTED
          - calculations.recall_scope
          - calculations.dealer_recall_exposure
          - entities.RecallCampaign.fields.escalated_task_count
          - entities.RemedyTask.fields.kits_reserved
        distinguishing_aspect: |
          CASCADE-B is a four-hop chain whose third hop is triggered by a *derived threshold* rather than
          by a status write: creating the two RemedyTasks pushes the dealer's open_recall_unit_count to
          the RESTRICTED threshold of 2, and it is the dealer leaving GOOD standing that escalates both
          tasks to FACTORY_DIRECTED and reserves one extra kit each — so a single launch call moves
          campaign, tasks, units and dealer.
        test_recipe:
          setup:
            - "TYPE_C_CONV, DSL-100 and the PUBLISHED TX 2026-2027 profile"
            - "Dealer D-TX-01 licensed in TX and OK, standing GOOD, open_recall_unit_count 0"
            - "Logical clock 2026-08-20"
            - "Two legacy fleet records through that dealer: VIN ...9001 delivered 2026-05-10 and VIN ...9002 delivered 2026-06-02, both DELIVERED / CERTIFIED / service_status NONE"
