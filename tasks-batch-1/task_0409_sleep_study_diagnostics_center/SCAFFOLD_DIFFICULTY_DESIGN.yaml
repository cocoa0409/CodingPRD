  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: forbidden_role_beats_study_not_found
        grounds:
          - validations[priority=2]
          - validations[priority=3]
          - errors[ERR_FORBIDDEN_ROLE]
          - errors[ERR_STUDY_NOT_FOUND]
        distinguishing_aspect: |
          Pair auth (priority 2) vs existence (priority 3): a Physician calling
          POST /study-orders/{id}/start (a SleepTechnologist-only op) on a
          non-existent study fails ERR_FORBIDDEN_ROLE (403), NOT
          ERR_STUDY_NOT_FOUND (404), because role check precedes existence.
        test_recipe:
          setup:
            - "Empty DB; no study with the probed id exists."
          setup_api_calls: []
          trigger:
            - call: "POST /study-orders/00000000-0000-0000-0000-000000000000/start"
              payload: {}
              as: Physician
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_FORBIDDEN_ROLE"

      - name: auth_expired_beats_bed_double_booked
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors[ERR_AUTH_EXPIRED]
          - errors[ERR_BED_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Pair business_temporal (priority 7, ERR_AUTH_EXPIRED) vs
          business_temporal scheduling overlap (priority 9,
          ERR_BED_DOUBLE_BOOKED): a schedule request whose night is BOTH past
          the auth expiry AND collides with an existing bed night returns
          ERR_AUTH_EXPIRED because auth-expiry check precedes overlap check.
          Different error-category instances from the auth-vs-existence pair.
        test_recipe:
          setup:
            - "A bed already booked for night1 (occupies the colliding interval). A second authorized referral whose auth expires 2026-07-05, scheduling for a night on/after 2026-07-10 that also collides with night1."
