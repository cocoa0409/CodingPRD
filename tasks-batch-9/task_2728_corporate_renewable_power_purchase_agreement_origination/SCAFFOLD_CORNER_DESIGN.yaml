      - name: risk_event_duration_and_excused_hours_are_order_independent
        claim_type: chronological
        grounds:
          - calculations.risk_event_impact
          - endpoints.POST_/ppa/risk-events/{id}/review
          - endpoints.GET_/ppa/settlement-periods/{id}/intervals
        distinguishing_aspect: |
          The three metered hours are posted in reverse chronological order, and the
          claim is sized only afterwards - so the arithmetic must come from the stored
          timestamps, not from insertion order. The window is closed on both ends and
          spans 4 days 23 hours, which makes duration_days 5 rather than 4 (whole-day
          division alone) or 6 (ceiling plus one). excused_hours is 2: the hour starting
