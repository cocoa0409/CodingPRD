    input: ["applicant_id?", "service_type?", "status?", "limit?", "offset?"]
    output: RiskManagementService[]
    side_effects: []

  - method: GET
    path: "/epli/exposure-assessments/{assessment_id}"
    description: "Fetch one exposure assessment by id, including every premium component and credit_basis_stale."
    roles: [PlatformAdmin, Underwriter, UnderwritingManager, PolicyholderContact]
    code: 200
    input: []
    output: ExposureAssessment
    side_effects: []

  - method: GET
    path: "/epli/exposure-assessments"
