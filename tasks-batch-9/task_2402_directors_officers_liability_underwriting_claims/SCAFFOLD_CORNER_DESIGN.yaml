              as: Underwriter
            - call: "POST /dno/submissions"
              payload: { insured_id: "${insured_id}", requested_limit_usd: 10000000, requested_retention_usd: 250000, requested_side_c_sublimit_usd: 5000000, requested_program_target_limit_usd: 8000000, requested_period_start: "2026-09-01T00:00:00Z", requested_period_end: "2026-09-01T00:00:00Z", retroactive_date: "2024-01-01T00:00:00Z", erp_days: 90 }
              as: Underwriter
          assert:
            - "trigger call 1 returns 422 with data.error_id == \"ERR_INVALID_REQUEST\": UTILITIES is not a member of the declared sector_code enum {TECH, BIOTECH, FINANCIAL, ENERGY, INDUSTRIAL, CONSUMER}"
            - "trigger call 2 returns 422 with data.error_id == \"ERR_PERIOD_INVALID\": requested_period_end must be strictly after requested_period_start, so equal instants fail"
            - "trigger call 3 returns 422 with data.error_id == \"ERR_PROGRAM_TARGET_BELOW_LIMIT\": 8,000,000 target under a 10,000,000 requested limit is priority 17's rejection, not priority 15's"
            - "trigger call 4 breaks both cross-field rules and returns 422 with data.error_id == \"ERR_PERIOD_INVALID\" — priority 16 wins over priority 17"
            - "GET /dno/submissions with insured_id == ${insured_id} returns total_count == 0: none of the four rejected calls persisted a row"
