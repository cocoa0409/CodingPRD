  # =====================================================================
  - section: rbac
    instances:
      - name: owner_cannot_read_other_owners_statement
        claim_type: "peer_roles"
        grounds: [roles.Owner, entities.OwnerStatement.fields.owner_id]
        distinguishing_aspect: "An Owner reading another owner's statement via GET /owner-statements/{id} with a mismatched X-User-ID is denied ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["Owner Ox with a DRAFT statement; a second owner Oy attempts to read it."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /owners", payload: { legal_name: "Ox", email: "ox@x.com", default_management_fee_pct: 20 }, as: PlatformAdmin, captures: { ox: "$.data.id" } }
            - { call: "POST /owners", payload: { legal_name: "Oy", email: "oy@x.com", default_management_fee_pct: 20 }, as: PlatformAdmin, captures: { oy: "$.data.id" } }
            - { call: "POST /owner-statements", payload: { owner_id: "${ox}", period_year: 2026, period_month: 6 }, as: PropertyManager, captures: { stx: "$.data.id" } }
