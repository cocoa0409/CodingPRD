      - name: interview_advance_requires_min_rounds_and_average
        claim_type: guarded transitions
        grounds:
          - state_machines.Application.INTERVIEWS_to_BUSINESS_ASSESSMENT
          - errors.ERR_INTERVIEW_GATE
        distinguishing_aspect: "Advancing from INTERVIEWS requires >= MIN_INTERVIEW_ROUNDS (2) SUBMITTED rounds and interview_average >= 70; with only one scored round the advance is refused."
        test_recipe:
          setup:
