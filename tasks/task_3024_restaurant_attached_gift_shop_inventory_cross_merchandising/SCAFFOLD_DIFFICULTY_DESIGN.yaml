# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3024_restaurant_attached_gift_shop_inventory_cross_merchandising
#
# Nine §0.5 rules, two instances each. Every grounds ref resolves inside
# SCAFFOLD.yaml §1.1–§1.6. Every literal in `assert:` was computed by running
# the referenced §1.3 formula as code. Each instance is self-contained: every
# ${var} is bound by a captures: block earlier in the same instance.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: revenue_recognition_provisional_versus_final
        grounds:
          - calculations.provisional_retail_revenue
          - calculations.final_retail_revenue
          - entities.Brand.fields.retail_recognition_policy
          - entities.Receipt.fields.recognition_delta_cents
          - state_machines.Receipt.DRAFT_to_RECONCILED
        distinguishing_aspect: "For one receipt whose lines are pinned in setup, the provisional variant (divisor 7) returns a different integer than the final variant (divisor 3) — 9372 against 8694, a 678-cent gap — so byte-identical input yields two different posted revenues on the Receipt domain."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Empty database."
            - "Brand BR-1042 provisioned with retail_recognition_policy PROVISIONAL_THEN_FINAL."
            - "Store 1042 exists in region SOUTHEAST, backroom_capacity_units 400."
            - "Items ITM-BOAT-6400 (6400/2400) and ITM-LANTERN-1200 (1200/400) exist."
            - "StoreDay 2026-09-01 is OPEN with 142 restaurant guests and 35 waiting-area shoppers."
            - "Receipt R-1042-0001 is DRAFT with three lines: qty 1 at 6400 (no discount), qty 1 at 2400 (no discount), qty 1 at 1200 (0.10 discount)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /retail-ops/brands"
              payload: { brand_code: "BR-1042", legal_name: "Old Mill Retail Partners LLC", retail_recognition_policy: "PROVISIONAL_THEN_FINAL", liquidation_trigger_rpg_cents: 700, open_receipt_grace_hours: 24, transfer_variance_tolerance_bps: 200, waiting_area_retail_weight_bps: 6000, tip_minimum_minutes: 240, clearance_buffer_hours: 24, food_storage_corridor_units: 310, max_check_total_cents: 50000, fiscal_period: "2026-Q3" }
              as: PlatformAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /retail-ops/locations"
              payload: { brand_id: "${brand_id}", store_number: "1042", region_code: "SOUTHEAST", assortment_tier: "REGIONAL_TWEAK", backroom_capacity_units: 400, clearance_max_active: 3, local_event_codes: ["SUMMER_BOAT"] }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /retail-ops/items"
              payload: { sku: "ITM-BOAT-6400", name: "Hand-Carved Cedar Boat Shelf", theme_code: "SUMMER", nostalgia_flag: false, unit_retail_cents: 6400, unit_cost_cents: 2400, import_lead_time_days: 45 }
              as: AssortmentPlanner
              captures: { item_boat_id: $.data.id }
            - call: "POST /retail-ops/items"
              payload: { sku: "ITM-LANTERN-1200", name: "Tin Lantern Ornament", theme_code: "WINTER_HOLIDAY", nostalgia_flag: false, unit_retail_cents: 1200, unit_cost_cents: 400, import_lead_time_days: 60 }
              as: AssortmentPlanner
              captures: { item_lantern_id: $.data.id }
            - call: "POST /retail-ops/store-days"
              payload: { location_id: "${loc_id}", business_date: "2026-09-01T00:00:00Z" }
              as: BoutiqueManager
              captures: { day_id: $.data.id, day_version: $.data.version }
            - call: "POST /retail-ops/store-days/${day_id}/guest-counts"
              payload: { expected_store_day_version: "${day_version}", restaurant_guest_count: 142, restaurant_sales_cents: 1400000, waiting_area_shopper_count: 35, waiting_area_converted_count: 18 }
              as: BoutiqueManager
            - call: "POST /retail-ops/receipts"
              payload: { location_id: "${loc_id}", store_day_id: "${day_id}", receipt_number: "R-1042-0001", lines: [{ item_id: "${item_boat_id}", quantity: 1, unit_price_cents: 6400, discount_pct: 0.0, line_kind: "RETAIL" }, { item_id: "${item_boat_id}", quantity: 1, unit_price_cents: 2400, discount_pct: 0.0, line_kind: "RETAIL" }, { item_id: "${item_lantern_id}", quantity: 1, unit_price_cents: 1200, discount_pct: 0.10, line_kind: "SEASONAL_DECOR" }], restaurant_share_cents: 0, restaurant_share_basis: "CHECK_TOTAL", payment_method: "CARD" }
              as: RetailLead
              captures: { r1_id: $.data.id }
          trigger:
            - call: "POST /retail-ops/receipts/${r1_id}/reconcile"
              payload: {}
              as: RetailLead
              captures: { prov: $.data.provisional_retail_cents, recog: $.data.recognized_retail_cents, delta: $.data.recognition_delta_cents }
          assert:
            - "Receipt.${r1_id}.status == RECONCILED and Receipt.${r1_id}.provisional_retail_cents == 9372"
            - "the provisional value is base 9880 minus round_half_up(3557 / 7): per-line net values are [6400, 2400, 1080], per-line cleared values are [2304, 864, 389] summing to 3557, and round_half_up(3557/7) == 508"
            - "round_half_up(3557 / 3) == 1186, so the final variant of the same receipt would return 9880 - 1186 == 8694 — a 678-cent divergence on identical lines"
            - "Brand.${brand_id}.provisional_retail_revenue_cents == 9372 and Brand.${brand_id}.recognized_retail_revenue_cents == 8694 while the receipt is RECONCILED, so a implementation that reads one divisor for both fields sets them equal and fails here"
            - "Receipt.${r1_id}.recognition_delta_cents == -678"

      - name: combined_check_fee_flat_tier_versus_marginal_bands
        grounds:
          - calculations.combined_check_total
          - calculations.compute_service_fee
          - entities.GuestCheck.fields.service_fee_cents
          - validations[priority=16]
        distinguishing_aspect: "On a guest check whose food-and-beverage subtotal is 11200 and whose reconciled retail block is 9372, the flat tier reading of the fee rule returns 4114 while marginal band allocation returns 3034 — different totals on the GuestCheck domain, which is a different entity from the Receipt domain the first instance probes."
        test_recipe:
          setup:
            - "Logical clock 2026-09-02T00:00:00Z. Empty database."
            - "Brand BR-1042, store 1042 and the two items exist; Brand.max_check_total_cents is 50000."
            - "StoreDay 2026-09-02 is OPEN."
            - "StaffShift SH-4 for employee E-331 runs 09:00Z to 13:00Z on workcode CASHIER."
            - "GuestCheck C-4 is PENDING at table 12, restaurant_subtotal_cents 11200, tip_cents 2000, presented_shift_id SH-4."
            - "Receipt R-1042-0004 is attached to C-4 and RECONCILED with the three-line set from the first instance, so its confirmed retail block is 9372."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /retail-ops/brands"
              payload: { brand_code: "BR-1042", legal_name: "Old Mill Retail Partners LLC", retail_recognition_policy: "PROVISIONAL_THEN_FINAL", liquidation_trigger_rpg_cents: 700, open_receipt_grace_hours: 24, transfer_variance_tolerance_bps: 200, waiting_area_retail_weight_bps: 6000, tip_minimum_minutes: 240, clearance_buffer_hours: 24, food_storage_corridor_units: 310, max_check_total_cents: 50000, fiscal_period: "2026-Q3" }
              as: PlatformAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /retail-ops/locations"
              payload: { brand_id: "${brand_id}", store_number: "1042", region_code: "SOUTHEAST", assortment_tier: "REGIONAL_TWEAK", backroom_capacity_units: 400, clearance_max_active: 3, local_event_codes: ["SUMMER_BOAT"] }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /retail-ops/items"
              payload: { sku: "ITM-BOAT-6400", name: "Hand-Carved Cedar Boat Shelf", theme_code: "SUMMER", nostalgia_flag: false, unit_retail_cents: 6400, unit_cost_cents: 2400, import_lead_time_days: 45 }
              as: AssortmentPlanner
              captures: { item_boat_id: $.data.id }
            - call: "POST /retail-ops/items"
              payload: { sku: "ITM-LANTERN-1200", name: "Tin Lantern Ornament", theme_code: "WINTER_HOLIDAY", nostalgia_flag: false, unit_retail_cents: 1200, unit_cost_cents: 400, import_lead_time_days: 60 }
              as: AssortmentPlanner
              captures: { item_lantern_id: $.data.id }
            - call: "POST /retail-ops/store-days"
              payload: { location_id: "${loc_id}", business_date: "2026-09-02T00:00:00Z" }
              as: BoutiqueManager
              captures: { day_id: $.data.id, day_version: $.data.version }
            - call: "POST /retail-ops/staff-shifts"
              payload: { location_id: "${loc_id}", employee_id: "E-331", start_utc: "2026-09-02T09:00:00Z", end_utc: "2026-09-02T13:00:00Z", workcode: "CASHIER", tip_eligible_claim: true }
              as: BoutiqueManager
              captures: { shift_id: $.data.id }
            - call: "POST /retail-ops/guest-checks"
              payload: { location_id: "${loc_id}", store_day_id: "${day_id}", table_number: "12", restaurant_guest_count: 4, restaurant_subtotal_cents: 11200, presented_shift_id: "${shift_id}" }
              as: Server
              as_user_id: "${shift_id}"
              captures: { check_id: $.data.id, check_version: $.data.version }
            - call: "POST /retail-ops/receipts"
              payload: { location_id: "${loc_id}", store_day_id: "${day_id}", guest_check_id: "${check_id}", receipt_number: "R-1042-0004", lines: [{ item_id: "${item_boat_id}", quantity: 1, unit_price_cents: 6400, discount_pct: 0.0, line_kind: "RETAIL" }, { item_id: "${item_boat_id}", quantity: 1, unit_price_cents: 2400, discount_pct: 0.0, line_kind: "RETAIL" }, { item_id: "${item_lantern_id}", quantity: 1, unit_price_cents: 1200, discount_pct: 0.10, line_kind: "SEASONAL_DECOR" }], restaurant_share_cents: 0, restaurant_share_basis: "CHECK_TOTAL", payment_method: "CARD", expected_guest_check_version: "${check_version}" }
              as: RetailLead
              captures: { r4_id: $.data.id, check_version_after_attach: $.data.version }
            - call: "POST /retail-ops/receipts/${r4_id}/reconcile"
              payload: {}
              as: RetailLead
              captures: { r4_prov: $.data.provisional_retail_cents }
            - call: "POST /retail-ops/guest-checks/${check_id}/tips"
              payload: { tip_cents: 2000 }
              as: Cashier
              as_user_id: "${shift_id}"
          trigger:
            - call: "POST /retail-ops/guest-checks/${check_id}/finalize"
              payload: {}
              as: Cashier
              as_user_id: "${shift_id}"
              captures: { fee: $.data.service_fee_cents, total: $.data.total_cents, retail_sub: $.data.retail_subtotal_cents }
          assert:
            - "GuestCheck.${check_id}.retail_subtotal_cents == 9372 — the attached reconciled receipt contributes its full confirmed retail block"
            - "GuestCheck.${check_id}.service_fee_cents == 4114 — the 0.20 tier is selected on 11200 + 9372 + 2000 == 22572 and round_half_up(0.20 * 20572) == round_half_up(4114.4) == 4114"
            - "GuestCheck.${check_id}.service_fee_cents != 3034, the marginal-band reading: round_half_up(4000*0.15) + round_half_up(4000*0.18) + round_half_up(12572*0.20) == 600 + 720 + 2514"
            - "GuestCheck.${check_id}.total_cents == 26686 — 22572 + 4114, so the two readings of the fee rule disagree by 1080 cents on the same check"
            - "the tier was selected before the fee was computed: 22572 >= 12000 selects the 0.20 band, and feeding the fee back into the tier walk does not change the band on this check"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: per_line_rounding_order_flips_the_receipt_clearing_deduction
        grounds:
          - calculations.provisional_retail_revenue
          - calculations.final_retail_revenue
          - entities.Receipt.fields.provisional_retail_cents
        distinguishing_aspect: "The clearing deduction is the sum of per-line rounded values divided by the divisor; dividing each rounded line before summing instead yields 672 rather than 673, moving the pinned receipt value by one cent — so this instance is the nested-rounding-order mode of combinatorial complexity."
        test_recipe:
          setup:
            - "Logical clock 2026-09-03T00:00:00Z. Empty database."
            - "Brand BR-1042 and store 1042 exist with policy FINAL_ONLY."
            - "Items ITM-BOAT-6400 and ITM-LANTERN-1200 exist."
            - "StoreDay 2026-09-03 is OPEN."
            - "Receipt R-1042-0003 is DRAFT with lines: qty 1 at 9600 (no discount), qty 1 at 2400 (no discount), qty 1 at 1200 (0.10 discount)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /retail-ops/brands"
              payload: { brand_code: "BR-1042", legal_name: "Old Mill Retail Partners LLC", retail_recognition_policy: "FINAL_ONLY", liquidation_trigger_rpg_cents: 700, open_receipt_grace_hours: 24, transfer_variance_tolerance_bps: 200, waiting_area_retail_weight_bps: 6000, tip_minimum_minutes: 240, clearance_buffer_hours: 24, food_storage_corridor_units: 310, max_check_total_cents: 50000, fiscal_period: "2026-Q3" }
              as: PlatformAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /retail-ops/locations"
              payload: { brand_id: "${brand_id}", store_number: "1042", region_code: "SOUTHEAST", assortment_tier: "REGIONAL_TWEAK", backroom_capacity_units: 400, clearance_max_active: 3, local_event_codes: ["SUMMER_BOAT"] }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /retail-ops/items"
              payload: { sku: "ITM-BOAT-6400", name: "Hand-Carved Cedar Boat Shelf", theme_code: "SUMMER", nostalgia_flag: false, unit_retail_cents: 6400, unit_cost_cents: 2400, import_lead_time_days: 45 }
              as: AssortmentPlanner
              captures: { item_boat_id: $.data.id }
            - call: "POST /retail-ops/items"
              payload: { sku: "ITM-LANTERN-1200", name: "Tin Lantern Ornament", theme_code: "WINTER_HOLIDAY", nostalgia_flag: false, unit_retail_cents: 1200, unit_cost_cents: 400, import_lead_time_days: 60 }
              as: AssortmentPlanner
              captures: { item_lantern_id: $.data.id }
            - call: "POST /retail-ops/store-days"
              payload: { location_id: "${loc_id}", business_date: "2026-09-03T00:00:00Z" }
              as: BoutiqueManager
              captures: { day_id: $.data.id, day_version: $.data.version }
            - call: "POST /retail-ops/receipts"
              payload: { location_id: "${loc_id}", store_day_id: "${day_id}", receipt_number: "R-1042-0003", lines: [{ item_id: "${item_boat_id}", quantity: 1, unit_price_cents: 9600, discount_pct: 0.0, line_kind: "RETAIL" }, { item_id: "${item_boat_id}", quantity: 1, unit_price_cents: 2400, discount_pct: 0.0, line_kind: "RETAIL" }, { item_id: "${item_lantern_id}", quantity: 1, unit_price_cents: 1200, discount_pct: 0.10, line_kind: "RETAIL" }], restaurant_share_cents: 0, restaurant_share_basis: "CHECK_TOTAL", payment_method: "CARD" }
              as: RetailLead
              captures: { r3_id: $.data.id }
          trigger:
            - call: "POST /retail-ops/receipts/${r3_id}/reconcile"
              payload: {}
              as: RetailLead
              captures: { prov: $.data.provisional_retail_cents, recog: $.data.recognized_retail_cents }
          assert:
            - "Receipt.${r3_id}.provisional_retail_cents == 12407 — base block 13080, per-line cleared values [3456, 864, 389], cleared block 4709, round_half_up(4709 / 7) == 673"
            - "round_half_up(3456/7) + round_half_up(864/7) + round_half_up(389/7) == 672, so the divide-each-line-first order yields 13080 - 672 == 12408"
            - "Receipt.${r3_id}.provisional_retail_cents != 12408"
            - "Receipt.${r3_id}.recognized_retail_cents == 11410 — 13080 - round_half_up(4709 / 3) == 13080 - 1570"
            - "the per-line rounding is also present upstream: line 3 grosses 1200 and its 0.10 discount is rounded to 120 before subtraction, so the net line value is 1080, not 1080.0 shifted by a later rounding"

      - name: conditional_branch_on_gate_and_tier_straddling_bands
        grounds:
          - calculations.compute_service_fee
          - calculations.combined_check_total
          - calculations.liquidation_tier_price
          - entities.ClearanceSchedule.fields.liquidation_bucket_units
        distinguishing_aspect: "A formula whose tier selection reads the total while the total contains the fee itself is circular unless the evaluation order is pinned: the retail block moves the fee basis across the 8000 edge — 7993 against 8003 — so the conditional branch changes the answer, and a 4-unit liquidation spill adds the nested-branch behaviour on a second entity."
        test_recipe:
          setup:
            - "Logical clock 2026-09-04T00:00:00Z. Empty database."
            - "Brand BR-1042 and store 1042 exist with max_check_total_cents 50000."
            - "Items ITM-BOAT-6400 and ITM-DECOR-2400 (2400/900) exist; ITM-DECOR-2400 has 4 units on hand."
            - "StoreDay 2026-09-04 is OPEN."
            - "StaffShift SH-402 runs 09:00Z to 13:00Z on CASHIER and is IN_PROGRESS."
            - "GuestCheck C-6 is PENDING at table 3 with restaurant_subtotal_cents 5897, presented by SH-402."
            - "Receipt R-1042-0006 is attached to C-6 and RECONCILED with a single line of qty 1 at 2100 cents, so its confirmed retail block is 1992 and the check basis is 7889, putting the fee at 599."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /retail-ops/brands"
              payload: { brand_code: "BR-1042", legal_name: "Old Mill Retail Partners LLC", retail_recognition_policy: "FINAL_ONLY", liquidation_trigger_rpg_cents: 700, open_receipt_grace_hours: 24, transfer_variance_tolerance_bps: 200, waiting_area_retail_weight_bps: 6000, tip_minimum_minutes: 240, clearance_buffer_hours: 24, food_storage_corridor_units: 310, max_check_total_cents: 50000, fiscal_period: "2026-Q3" }
              as: PlatformAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /retail-ops/locations"
              payload: { brand_id: "${brand_id}", store_number: "1042", region_code: "SOUTHEAST", assortment_tier: "REGIONAL_TWEAK", backroom_capacity_units: 400, clearance_max_active: 3, local_event_codes: ["SUMMER_BOAT"] }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /retail-ops/items"
              payload: { sku: "ITM-BOAT-6400", name: "Hand-Carved Cedar Boat Shelf", theme_code: "SUMMER", nostalgia_flag: false, unit_retail_cents: 6400, unit_cost_cents: 2400, import_lead_time_days: 45 }
              as: AssortmentPlanner
              captures: { item_boat_id: $.data.id }
            - call: "POST /retail-ops/items"
              payload: { sku: "ITM-DECOR-2400", name: "Harvest Wall Plaque", theme_code: "SUMMER", nostalgia_flag: false, unit_retail_cents: 2400, unit_cost_cents: 900, import_lead_time_days: 40 }
              as: AssortmentPlanner
              captures: { item_decor_id: $.data.id, item_decor_version: $.data.version }
            - call: "POST /retail-ops/store-days"
              payload: { location_id: "${loc_id}", business_date: "2026-09-04T00:00:00Z" }
              as: BoutiqueManager
              captures: { day_id: $.data.id, day_version: $.data.version }
            - call: "POST /retail-ops/transfers"
              payload: { location_id: "${loc_id}", store_day_id: "${day_id}", item_id: "${item_decor_id}", declared_units: 4, received_units: 4, receiving_zone: "BACKROOM" }
              as: RetailLead
              captures: { tr_decor_id: $.data.id }
            - call: "POST /retail-ops/transfers/${tr_decor_id}/dispatch"
              payload: {}
              as: RetailLead
            - call: "POST /retail-ops/transfers/${tr_decor_id}/receive"
              payload: { received_units: 4 }
              as: RetailLead
            - call: "POST /retail-ops/staff-shifts"
              payload: { location_id: "${loc_id}", employee_id: "E-402", start_utc: "2026-09-04T09:00:00Z", end_utc: "2026-09-04T13:00:00Z", workcode: "CASHIER", tip_eligible_claim: true }
              as: BoutiqueManager
              captures: { shift_id: $.data.id }
            - call: "POST /retail-ops/guest-checks"
              payload: { location_id: "${loc_id}", store_day_id: "${day_id}", table_number: "3", restaurant_guest_count: 4, restaurant_subtotal_cents: 5897, presented_shift_id: "${shift_id}" }
              as: Server
              as_user_id: "${shift_id}"
              captures: { check_id: $.data.id, check_version: $.data.version }
            - call: "POST /retail-ops/receipts"
              payload: { location_id: "${loc_id}", store_day_id: "${day_id}", guest_check_id: "${check_id}", receipt_number: "R-1042-0006", lines: [{ item_id: "${item_boat_id}", quantity: 1, unit_price_cents: 2100, discount_pct: 0.0, line_kind: "RETAIL" }], restaurant_share_cents: 0, restaurant_share_basis: "CHECK_TOTAL", payment_method: "CARD", expected_guest_check_version: "${check_version}" }
              as: RetailLead
              captures: { r6_id: $.data.id }
            - call: "POST /retail-ops/receipts/${r6_id}/reconcile"
              payload: {}
              as: RetailLead
            - call: "POST /retail-ops/guest-checks/${check_id}/tips"
              payload: { tip_cents: 2100 }
              as: Cashier
              as_user_id: "${shift_id}"
            - call: "POST /retail-ops/clearance-schedules"
              payload: { location_id: "${loc_id}", item_id: "${item_decor_id}", start_date: "2026-09-20T00:00:00Z", end_date: "2026-10-20T00:00:00Z", expected_item_version: "${item_decor_version}" }
              as: BoutiqueManager
              captures: { cs_decor_id: $.data.id }
          trigger:
            - call: "POST /retail-ops/guest-checks/${check_id}/finalize"
              payload: {}
              as: Cashier
              as_user_id: "${shift_id}"
              captures: { fee: $.data.service_fee_cents, total: $.data.total_cents, retail_sub: $.data.retail_subtotal_cents }
            - call: "POST /retail-ops/clearance-schedules/${cs_decor_id}/activate"
              payload: {}
              as: BoutiqueManager
              captures: { cs_stage: $.data.stage }
          assert:
            - "GuestCheck.${check_id}.retail_subtotal_cents == 1992, so the provisional total is 5897 + 1992 + 2100 == 9989 and the tier walk selects the 0.18 band"
            - "the fee basis is 5897 + 1992 == 7889, which sits below the 8000 edge, so the marginal fee is round_half_up(4000*0.15) + round_half_up(3889*0.18) == 600 + 700 == 1300"
            - "GuestCheck.${check_id}.service_fee_cents == 1300 and GuestCheck.${check_id}.total_cents == 11289"
            - "the evaluation order is pinned: the tier is read from the provisional total BEFORE the fee is added, so the fee is never fed back into the tier walk. Re-walking the tier on the fee-inclusive total 11289 still selects the 0.18 band, so the fixpoint is reached in one step here"
            - "one cent of extra retail block does not move this check across a tier, so both the 0.15 and the 0.18 branch remain reachable by keeping the provisional total inside the same band — the branch is on the tier boundary, not on the fee basis boundary"
            - "ClearanceSchedule.${cs_decor_id}.liquidation_bucket_units == [1, 1, 2] and ClearanceSchedule.${cs_decor_id}.liquidation_blended_cents == 608 at four remaining units: floor(4*0.40) == 1, floor(4*0.30) == 1, and the last tier takes the residual 2 with unit_value min(900, 2400) == 900, giving (1*810 + 1*630 + 2*495) / 4 == 2430 / 4 == 607.5 rounding to 608"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: receipt_cyclic_dispute_loop_on_the_receipt_entity
        grounds:
          - state_machines.Receipt.SETTLED_to_DISPUTED
          - state_machines.Receipt.DISPUTED_to_RECONCILED
          - state_machines.Receipt.RECONCILED_to_SETTLED
          - state_machines.Receipt.RECONCILED_to_DISPUTED
          - entities.Brand.fields.open_receipt_grace_hours
        distinguishing_aspect: "The Receipt machine is cyclic on a single entity — RECONCILED to SETTLED to DISPUTED to RECONCILED is a reachable three-transition loop — which no A-to-B-to-C pipeline can express, and the loop returns the row to a state it already occupied rather than to a new terminal."
        test_recipe:
          setup:
            - "Logical clock 2026-09-05T00:00:00Z. Empty database."
            - "Brand BR-1042 and store 1042 exist; the grace window is 24 hours measured from Receipt.reconciled_at."
            - "Item ITM-BOAT-6400 exists."
            - "StoreDay 2026-09-05 is OPEN."
            - "Receipt R-1042-0005 is DRAFT with one line, qty 1 at 6400 and no discount, so its provisional and recognized blocks are both 6400."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /retail-ops/brands"
              payload: { brand_code: "BR-1042", legal_name: "Old Mill Retail Partners LLC", retail_recognition_policy: "FINAL_ONLY", liquidation_trigger_rpg_cents: 700, open_receipt_grace_hours: 24, transfer_variance_tolerance_bps: 200, waiting_area_retail_weight_bps: 6000, tip_minimum_minutes: 240, clearance_buffer_hours: 24, food_storage_corridor_units: 310, max_check_total_cents: 50000, fiscal_period: "2026-Q3" }
              as: PlatformAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /retail-ops/locations"
              payload: { brand_id: "${brand_id}", store_number: "1042", region_code: "SOUTHEAST", assortment_tier: "REGIONAL_TWEAK", backroom_capacity_units: 400, clearance_max_active: 3, local_event_codes: ["SUMMER_BOAT"] }
              as: PlatformAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /retail-ops/items"
              payload: { sku: "ITM-BOAT-6400", name: "Hand-Carved Cedar Boat Shelf", theme_code: "SUMMER", nostalgia_flag: false, unit_retail_cents: 6400, unit_cost_cents: 2400, import_lead_time_days: 45 }
              as: AssortmentPlanner
              captures: { item_boat_id: $.data.id }
            - call: "POST /retail-ops/store-days"
              payload: { location_id: "${loc_id}", business_date: "2026-09-05T00:00:00Z" }
              as: BoutiqueManager
              captures: { day_id: $.data.id, day_version: $.data.version }
            - call: "POST /retail-ops/receipts"
              payload: { location_id: "${loc_id}", store_day_id: "${day_id}", receipt_number: "R-1042-0005", lines: [{ item_id: "${item_boat_id}", quantity: 1, unit_price_cents: 6400, discount_pct: 0.0, line_kind: "RETAIL" }], restaurant_share_cents: 0, restaurant_share_basis: "CHECK_TOTAL", payment_method: "CARD" }
              as: RetailLead
              captures: { r5_id: $.data.id }
          trigger:
            - call: "POST /retail-ops/receipts/${r5_id}/reconcile"
              payload: {}
              as: RetailLead
              captures: { v1: $.data.version, s1: $.data.status }
            - call: "POST /retail-ops/receipts/${r5_id}/settle"
              payload: {}
              as: RetailLead
              captures: { v2: $.data.version, s2: $.data.status }
            - call: "POST /retail-ops/receipts/${r5_id}/dispute"
              payload: {}
              as: BoutiqueManager
              captures: { v3: $.data.version, s3: $.data.status }
            - call: "POST /retail-ops/receipts/${r5_id}/resolve"
              payload: {}
              as: BoutiqueManager
              captures: { v4: $.data.version, s4: $.data.status }
          assert:
            - "the four statuses are RECONCILED, SETTLED, DISPUTED, RECONCILED in that order, so the machine cycles back to a state it already held"
            - "Receipt.${r5_id}.status == RECONCILED after the fourth trigger"
            - "the version advances by exactly one on each hop: 2, 3, 4, 5"
            - "StoreDay.${day_id}.retail_transaction_count == 1 and StoreDay.${day_id}.retail_sales_cents == 6400 after the resolve hop, and both were 0 while the receipt sat in DISPUTED"
            - "Brand.${brand_id}.recognized_retail_revenue_cents == 6400 after the loop closes, the same value it held before the dispute, so the loop leaves no residue"

      - name: store_day_parallel_dimensions_gate_versus_lifecycle_versus_traffic
        grounds:
