  - section: rbac
    instances:

      - name: operator_cannot_schedule_an_inspection
        claim_type: role denial
        grounds: [roles.Operator, roles.Inspector, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "POST /inspections is exclusive to Inspector; an Operator calling it receives ERR_UNAUTHORIZED (403) and no inspection row is created."
        test_recipe:
          setup: ["One operator owns one pool facility."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Blue Lagoon Aquatics", contact_email: "ops@bluelagoon.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "Main Pool", facility_class: "CLASS_B_PUBLIC", surface_area_sqft: 1200, water_volume_gallons: 60000, max_depth_feet: 10, drain_count: 2 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { fac_id: $.data.id }
          trigger:
            - call: "POST /inspections"
              payload: { facility_id: "${fac_id}", inspection_type: "ROUTINE", scheduled_start_at: "2026-05-02T09:00:00Z", scheduled_end_at: "2026-05-02T10:00:00Z" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 403 with data.error_id == ERR_UNAUTHORIZED"
            - "GET /inspections?facility_id=${fac_id} returns zero rows"

      - name: inspector_cannot_decide_a_plan_review
        claim_type: role denial
        grounds: [roles.PlanReviewer, roles.Inspector, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "POST /plan-reviews/{id}/transition is exclusive to PlanReviewer; an Inspector attempting START_REVIEW receives ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["A SUBMITTED plan review exists."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Blue Lagoon Aquatics", contact_email: "ops@bluelagoon.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "Main Pool", facility_class: "CLASS_B_PUBLIC", surface_area_sqft: 1200, water_volume_gallons: 60000, max_depth_feet: 10, drain_count: 2 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { fac_id: $.data.id }
            - call: "POST /plan-reviews"
              payload: { facility_id: "${fac_id}", project_type: "ALTERATION", drawing_reference: "DR-1" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { pr_id: $.data.id }
          trigger:
            - call: "POST /plan-reviews/${pr_id}/transition"
              payload: { action: "START_REVIEW" }
              as: Inspector
              as_user_id: "insp-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 403 with data.error_id == ERR_UNAUTHORIZED"
            - "PlanReview.${pr_id}.status == SUBMITTED and reviewer_user_id == null"

      - name: plan_reviewer_cannot_drive_the_permit_lifecycle
        claim_type: role denial
        grounds: [roles.PlanReviewer, roles.HealthAuthorityAdmin, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "POST /permits/{id}/transition lists only Operator and HealthAuthorityAdmin, so a PlanReviewer attempting START_REVIEW on a permit receives ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["A SUBMITTED annual permit exists."]
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Blue Lagoon Aquatics", contact_email: "ops@bluelagoon.example" }
              as: Anonymous
              captures: { op_id: $.data.id }
            - call: "POST /facilities"
              payload: { operator_id: "${op_id}", name: "Main Pool", facility_class: "CLASS_B_PUBLIC", surface_area_sqft: 1200, water_volume_gallons: 60000, max_depth_feet: 10, drain_count: 2 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { fac_id: $.data.id }
            - call: "POST /permits"
              payload: { facility_id: "${fac_id}", permit_type: "ANNUAL", term_start_date: "2026-05-01" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/transition"
              payload: { action: "SUBMIT" }
              as: Operator
              as_user_id: "${op_id}"
          trigger:
            - call: "POST /permits/${permit_id}/transition"
              payload: { action: "START_REVIEW" }
