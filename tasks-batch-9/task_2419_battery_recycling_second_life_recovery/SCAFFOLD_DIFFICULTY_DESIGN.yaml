      - name: role_denial_precedes_path_not_found_on_lot_finalize
        grounds:
          - validations[priority=2]
          - validations[priority=5]
          - errors[ERR_FORBIDDEN_ROLE]
          - errors[ERR_LOT_NOT_FOUND]
        distinguishing_aspect: |
          Priority pair 2 vs 5 - auth versus existence, 403 versus 404: a SettlementAccountant
          (a role absent from the finalize endpoint's roles list) targets a lot id that does not
          exist, and the response must be ERR_FORBIDDEN_ROLE with HTTP 403, never
          ERR_LOT_NOT_FOUND, so the API leaks no existence information to an unauthorised role.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-10T00:00:00.000Z, one campus, one HYDROMET NICKEL_RICH line, one SCHEDULED campaign and one OPEN lot L-1 (so lots do exist in the database)."
            - "The lot id used in the trigger, 00000000-0000-0000-0000-000000000000, belongs to no RecoveryLot."
          setup_api_calls:
            - call: "POST /recycling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /recycling/facilities"
              payload: { name: "Reno Campus", state_code: "NV", mech_capacity_kg_per_day: 3000.0, hydro_capacity_kg_per_day: 2000.0 }
