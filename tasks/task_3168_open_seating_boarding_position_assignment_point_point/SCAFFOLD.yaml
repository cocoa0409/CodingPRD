  side_effects:
  - bag → OFFLOADED
- method: POST
  path: /ops/boarding/scan
  description: 'Gate scan: mark a checked-in journey BOARDED'
  roles:
  - GateAgent
  code: 200
  input:
  - journey_id
  output: PassengerJourney
  side_effects:
  - journey CHECKED_IN → BOARDED
- method: POST
  path: /ops/boarding-upgrades/{upgrade_id}/refund
  description: Refund an UPGRADED_BOARDING purchase before boarding opens
  roles:
  - Passenger
  code: 200
  input: []
  output: BoardingUpgrade
  side_effects:
  - upgrade → REFUNDED; granted assignment VOIDED (release_reason=UPGRADE); journey reverts to CHECKIN_TIME position; A-position
    NOT backfilled
- method: GET
  path: /ops/credits/{credit_id}
  description: Get a travel credit
  roles:
  - Passenger
  - OpsController
  code: 200
  input: []
  output: TravelCredit
  side_effects: []
- method: GET
  path: /ops/credits
  description: List credits (filter by passenger_id, status)
  roles:
  - Passenger
  - OpsController
  code: 200
  input:
  - passenger_id?
  - credit_status?
  - source_journey_id?
  - limit?
  - offset?
  output: TravelCredit[]
  side_effects: []
- method: POST
  path: /ops/credits/{credit_id}/redeem
  description: Redeem credit toward a journey fare (OCC on credit version)
  roles:
  - Passenger
  code: 201
  input:
  - journey_id
  - amount_cents
  - expected_credit_version
  output: CreditRedemption
  side_effects:
  - remaining_amount_cents decremented; status transitions OPEN→PARTIALLY_REDEEMED→REDEEMED; increments TravelCredit.version
    by 1
- method: POST
  path: /ops/credits/{credit_id}/void
  description: Admin clawback of a credit with no ACTIVE redemptions
  roles:
  - OpsController
  code: 200
  input: []
  output: TravelCredit
  side_effects:
  - credit → VOID
- method: GET
  path: /ops/credits/{credit_id}/redemptions
  description: 'Reverse-reachability: redemptions against a credit, ordered created_at ASC'
  roles:
  - Passenger
  - OpsController
  code: 200
  input: []
  output: CreditRedemption[]
  side_effects: []
- method: GET
  path: /ops/boarding-assignments
  description: List boarding assignments (filtered-list reverse-reachability for journey_id and flight_leg_id)
  roles:
  - Passenger
  - GateAgent
  - OpsController
  code: 200
  input:
  - journey_id?
  - flight_leg_id?
  - assignment_status?
  - boarding_group?
  - limit?
  - offset?
  output: BoardingAssignment[]
  side_effects: []
- method: GET
  path: /ops/boarding-upgrades
  description: List boarding upgrades (filtered-list reverse-reachability for journey_id)
  roles:
  - Passenger
  - GateAgent
  - OpsController
  code: 200
  input:
  - journey_id?
  - upgrade_type?
  - upgrade_status?
  - limit?
  - offset?
  output: BoardingUpgrade[]
  side_effects: []
- method: GET
  path: /ops/bags
  description: List bags (filtered-list reverse-reachability for journey_id)
  roles:
  - GateAgent
  - OpsController
  code: 200
  input:
  - journey_id?
  - bag_status?
  - limit?
  - offset?
  output: Bag[]
  side_effects: []
- method: GET
  path: /ops/credit-redemptions
  description: List credit redemptions (filtered-list reverse-reachability for credit_id and journey_id)
  roles:
  - Passenger
  - OpsController
  code: 200
  input:
  - credit_id?
  - journey_id?
  - redemption_status?
  - limit?
  - offset?
  output: CreditRedemption[]
  side_effects: []
- method: GET
  path: /ops/disruption-events
  description: List disruption events (filtered-list reverse-reachability for flight_leg_id)
  roles:
  - OpsController
  - GateAgent
  code: 200
  input:
  - flight_leg_id?
  - disruption_type?
  - limit?
  - offset?
  output: DisruptionEvent[]
  side_effects: []
- method: POST
  path: /ops/_clock/set_current_utc
  description: Set the server's logical clock. Startup default is exactly 2026-09-01T00:00:00Z; before any set call the clock
    reads this default and never falls back to wall-clock time.
  roles:
  - OpsController
  code: 200
  input:
  - to_iso8601
  output: '{ current_utc: string }'
  side_effects:
  - 'TravelCredit expiry sweep: OPEN/PARTIALLY_REDEEMED credits with expires_on < logical date → EXPIRED'
- method: GET
  path: /ops/boarding-assignments/{assignment_id}
  description: Get a boarding assignment
  roles:
  - Passenger
  - GateAgent
  - OpsController
  code: 200
  input: []
  output: BoardingAssignment
  side_effects: []
- method: GET
  path: /ops/boarding-upgrades/{upgrade_id}
  description: Get a boarding upgrade
  roles:
  - Passenger
  - GateAgent
  - OpsController
  code: 200
  input: []
  output: BoardingUpgrade
  side_effects: []
- method: GET
  path: /ops/bags/{bag_id}
  description: Get a bag
  roles:
  - GateAgent
  - OpsController
  code: 200
  input: []
  output: Bag
  side_effects: []
- method: GET
  path: /ops/credit-redemptions/{redemption_id}
  description: Get a credit redemption
  roles:
  - Passenger
  - OpsController
  code: 200
  input: []
  output: CreditRedemption
  side_effects: []
- method: GET
  path: /ops/disruption-events/{event_id}
  description: Get a disruption event
  roles:
  - OpsController
  - GateAgent
  code: 200
  input: []
  output: DisruptionEvent
  side_effects: []
errors:
- id: ERR_UNAUTHENTICATED
  http: 401
  condition: Missing or unrecognized X-User-Role / X-User-ID headers
- id: ERR_FORBIDDEN
  http: 403
  condition: Role not permitted for endpoint, or Passenger acting on another passenger's resource
- id: ERR_NOT_FOUND
  http: 404
  condition: Path resource does not exist (validated left-to-right)
- id: ERR_INVALID_STATE
  http: 409
  condition: Resource state precondition failed (e.g., check-in on non-BOOKED journey, depart before boarding opens, redeem
    from EXPIRED credit)
- id: ERR_STALE_VERSION
  http: 412
  condition: expected_*_version does not match the parent's current version (OCC)
- id: ERR_VALIDATION
  http: 400
  condition: 'Malformed body: missing required field, wrong type, unknown enum member'
- id: ERR_CHECKIN_WINDOW_CLOSED
  http: 409
  condition: Logical clock outside [STD-24h, STD-30min] adjusted for posted delay
- id: ERR_DUPLICATE_CHECKIN
  http: 409
  condition: Journey already CHECKED_IN
- id: ERR_BOARDING_CAPACITY_EXCEEDED
  http: 409
  condition: ACTIVE assignments on leg == capacity_seats
- id: ERR_UPGRADE_WINDOW_CLOSED
  http: 409
  condition: EARLY_BIRD requested after STD-36h, or UPGRADED_BOARDING requested before STD-24h
- id: ERR_UPGRADE_SOLD_OUT
  http: 409
  condition: 'A1-A15 pool exhausted: ACTIVE UPGRADED_BOARDING count == min(15, aircraft.seat_count)'
- id: ERR_DUPLICATE_UPGRADE
  http: 409
  condition: Journey already holds an ACTIVE upgrade of the same type
- id: ERR_UPGRADE_NOT_REFUNDABLE
  http: 422
  condition: Refund attempted on EARLY_BIRD or after boarding opened
- id: ERR_PREBOARD_NOT_ELIGIBLE
  http: 422
  condition: PREBOARD accommodation requested on a fare class with preboard_eligible=false
- id: ERR_FAMILY_ANCHOR_INELIGIBLE
  http: 422
  condition: MIN accommodation anchor is not a child (under 6 on flight date) or accompanying passenger is_min_eligible=false
- id: ERR_BAG_OVERWEIGHT
  http: 422
  condition: weight_lbs exceeds origin station bag_weight_limit_lbs
- id: ERR_BAG_LIMIT_EXCEEDED
  http: 409
  condition: Journey already has MAX_BAGS_PER_JOURNEY (10) ACCEPTED/LOADED bags
- id: ERR_DELAY_BELOW_FLOOR
  http: 422
  condition: Posted delay < 15 minutes, or DELAYED→DELAYED not strictly greater
- id: ERR_FARE_INACTIVE
  http: 422
  condition: Booking attempted on fare class with is_active=false
- id: ERR_CREDIT_EXHAUSTED
  http: 422
  condition: Redeem amount > remaining_amount_cents, or credit REDEEMED/VOID
- id: ERR_CREDIT_EXPIRED
  http: 410
  condition: Logical date past expires_on at redemption
- id: ERR_CHANGE_FEE_UNPAID
  http: 422
  condition: Non-flexible fare change without payable change fee
- id: ERR_FLEET_HETEROGENEITY
  http: 422
  condition: Pairing/routing references non-SINGLE_FLEET qualification or aircraft
- id: ERR_ROUTING_CHAIN_BROKEN
  http: 422
  condition: Consecutive routing legs do not share station or are out of time order
- id: ERR_ROUTING_TURN_VIOLATION
  http: 422
  condition: STD_next - STA_prev < turn_target_next for a consecutive routing pair
- id: ERR_AIRCRAFT_DOUBLE_BOOKED
  http: 409
  condition: Tail already has an ACTIVE routing with overlapping leg windows on the same date (touching endpoints allowed)
- id: ERR_CREW_LEGALITY_VIOLATION
  http: 422
  condition: Pairing violates base start, chain connectivity, MAX_CONNECTION_MINUTES (120), MAX_DUTY_MINUTES (840), or crew
    availability
- id: ERR_STATION_CONNECTION_VIOLATION
  http: 422
  condition: Connection gap below the connection station's min_connection_minutes
- id: ERR_STATION_CLOSED
  http: 409
  condition: Flight leg references a station with station_status=CLOSED
roles:
- name: Passenger
  description: Traveler managing own bookings, journeys, check-ins, upgrades, and travel credits
  identity: entity_backed:Passenger
  exclusive_operations:
  - POST /ops/passengers — register self
  - POST /ops/bookings — create own booking
  - POST /ops/journeys/{id}/check-in and POST /ops/flight-legs/{id}/check-ins — own check-in
  - POST /ops/flight-legs/{id}/upgrades — purchase upgrade on own journey
  - POST /ops/journeys/{id}/cancel, /change — modify own journey
  - POST /ops/credits/{id}/redeem — redeem own credit
  - POST /ops/boarding-upgrades/{id}/refund — refund own upgrade
  shared_operations:
  - GET on stations, fare-classes, flight-legs, own journeys/bookings/credits
- name: GateAgent
  description: Station agent running boarding, bag acceptance, scans, and leg departure/arrival
  identity: opaque
  exclusive_operations:
  - POST /ops/journeys/{id}/bags — accept bag
  - POST /ops/bags/{id}/offload
  - POST /ops/boarding/scan
  - POST /ops/flight-legs/{id}/boarding/open, /depart, /arrive
  shared_operations:
  - GET on stations, fare-classes, passengers, aircraft, flight-legs, journeys, routings, pairings, turn-projection, staffing-check
- name: OpsController
  description: 'Network operations: stations, fares, fleet, crew, routings, pairings, disruption posting, credit clawback,
    clock control'
  identity: opaque
  exclusive_operations:
  - POST /ops/stations, /ops/fare-classes, /ops/aircraft, /ops/crew-members
  - POST /ops/aircraft/{id}/maintenance
  - POST /ops/crew-members/{id}/availability
  - POST /ops/flight-legs, /ops/aircraft-routings, /ops/crew-pairings
  - POST /ops/flight-legs/{id}/disruptions
  - POST /ops/credits/{id}/void
  - POST /ops/_clock/set_current_utc
  shared_operations:
  - GET on all resources
