      - name: upload_submit_moves_prescription_from_draft_to_verified_active
        claim_type: valid_transition
        grounds:
          - state_machines.prescription_lifecycle.DRAFT_to_VERIFIED_ACTIVE
          - endpoints[POST /prescriptions/{id}/submit]
        distinguishing_aspect: "An UPLOAD prescription with a document_reference skips PENDING_VERIFICATION entirely and lands in VERIFIED_ACTIVE on submit, creating no VerificationRequest and leaving verification_rounds at 0."
        test_recipe:
          setup:
            - One DRAFT UPLOAD prescription exists for a customer with no other prescriptions.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
