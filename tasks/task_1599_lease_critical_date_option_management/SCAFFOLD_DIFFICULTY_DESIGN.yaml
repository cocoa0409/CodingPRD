              payload: { name: "P8", region: "EAST", laddering_max_pct_per_year: 40 }
              as: PlatformAdmin
              captures: { pid: $.data.id }
            - call: "POST /portfolios/${pid}/contacts"
              payload: { full_name: "AM Eight", email: "am8@x.com", contact_kind: "ASSET_MANAGER" }
              as: PlatformAdmin
