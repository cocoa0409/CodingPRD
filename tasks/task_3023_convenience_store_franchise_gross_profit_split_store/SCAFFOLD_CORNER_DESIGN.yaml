              as: FieldAuditor
            - call: "POST /franchise/shrink-audits/${saN_2}/count"
              payload: { physical_inventory_cents: 3850000, recount: false }
              as: FieldAuditor
            - call: "POST /franchise/shrink-audits/${saN_3}/count"
              payload: { physical_inventory_cents: 4100000, recount: false }
              as: FieldAuditor
          assert:
            - "ShrinkAudit.${saN_1}.shrink_cents == 0 and ShrinkAudit.${saN_1}.shrink_charge_cents == 0.00 — exactly on the boundary"
            - "ShrinkAudit.${saN_2}.shrink_cents == 150000 and ShrinkAudit.${saN_2}.shrink_charge_cents == 90000.00"
            - "ShrinkAudit.${saN_3}.shrink_cents == -100000 — an overage"
            - "ShrinkAudit.${saN_3}.shrink_charge_cents == 0.00 and ShrinkAudit.${saN_3}.shrink_charge_cents != -60000.00"
            - "all three audits remain in status COUNTED pending finalize"
            - "Franchisee.${frN_id}.open_shrink_charge_cents is still 0 because no audit has finalized"

