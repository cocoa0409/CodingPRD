          assert:
            - "the first completion returns HTTP 403 ERR_SEGREGATION_OF_DUTIES - pe-1 approved this plan, so pe-1 may not record its result even while carrying the AuthorizedInspector role"
            - "after that refusal HydrotestPlan.${plan_id} is unchanged: status == 'FILL_HOLD', completed_at_utc == null and approved_by_user_id == 'pe-1'"
