        grounds: ["errors[ERR_KIT_NOT_DELIVERED]", "errors[ERR_APPOINTMENT_TERMINAL]", "errors[ERR_SUBSCRIPTION_NOT_ACTIVE]", "errors[ERR_CAREGIVER_SENIOR_MISMATCH]"]
        excluded_because:
