      - name: vessel_downtime_two_hour_buffer
        grounds:
          - state_machines.ServiceTicket.APPROVED_to_SCHEDULED
          - errors[ERR_VESSEL_DOWNTIME_CONFLICT]
        distinguishing_aspect: |
          Different interval semantics on a DIFFERENT resource (Vessel, not
