      - name: warranty_claim_parallel_dimensions_move_independently
        summary: "adjudication_status and remediation_status advance on separate axes: an APPROVED claim moves remediation NOT_STARTED -> IN_PROGRESS -> COMPLETED without the adjudication dimension changing, after which reversal is refused."
        mechanism: "Two state fields on one entity, each with its own transition set, plus a guard that couples them in one direction only (remediation requires APPROVED; a COMPLETED remediation locks reversal)."
        entities_touched: [WarrantyClaim, ProductLine]
        rules_referenced: [warranty_liability_dual_variant]
        test_recipe:
          setup: "A funded SOLID line and an APPROVED claim (adjudicated liability 151474) with remediation still NOT_STARTED."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-20T00:00:00.000Z" }, as: MillAdmin }
            - { call: "POST /mill/species-profiles", payload: { species_code: "RED_OAK", common_name: "Red Oak", density_class: "DENSE", tangential_shrinkage_coefficient: 0.145, target_moisture_pct: 7.0, max_moisture_gradient_pp: 2.0 }, as: MillAdmin, captures: { species_id: "$.data.id" } }
            - { call: "POST /mill/product-lines", payload: { line_code: "SOLID-RO-325", species_profile_id: "${species_id}", construction_type: "SOLID", nominal_width_in: 3.250, nominal_thickness_in: 0.750, material_value_cents_per_sf: 895, warranty_funded_total_cents: 600000 }, as: MillAdmin, captures: { line_id: "$.data.id" } }
            - { call: "POST /mill/warranty-claims", payload: { product_line_id: "${line_id}", claim_type: "CUPPING", affected_square_feet: 240, installation_date: "2026-03-15", subfloor_moisture_pct_at_install: 10.5, ambient_rh_pct_at_install: 62 }, as: WarrantyAdjudicator, as_user_id: "u_intake", captures: { claim_id: "$.data.id" } }
            - { call: "POST /mill/warranty-claims/${claim_id}/adjudicate", payload: { decision: "APPROVED", adjudicated_affected_sf: 210, adjudicated_subfloor_moisture_pct: 10.5, adjudicated_ambient_rh_pct: 62 }, as: WarrantyAdjudicator, as_user_id: "u_adjudicator" }
          trigger:
            - { call: "POST /mill/warranty-claims/${claim_id}/start_remediation", payload: {}, as: MillSupervisor }
            - { call: "POST /mill/warranty-claims/${claim_id}/complete_remediation", payload: {}, as: MillSupervisor }
            - { call: "POST /mill/warranty-claims/${claim_id}/reverse", payload: { reversal_reason: "Adjuster error found on review" }, as: WarrantyAdjudicator, as_user_id: "u_adjudicator" }
          assert:
            - "start_remediation: status 200, data.remediation_status == \"IN_PROGRESS\" and data.adjudication_status is still \"APPROVED\"."
            - "complete_remediation: status 200, data.remediation_status == \"COMPLETED\" and data.adjudication_status is still \"APPROVED\"."
            - "data.adjudicated_liability_cents remains 151474 across both remediation moves and the product line balance stays 448526."
            - "reverse: status 409 with data.error_id == \"ERR_CLAIM_STATE_INVALID\" because remediation_status is COMPLETED."
            - "The claim is therefore in a combined state (APPROVED, COMPLETED) that no single-dimension state machine could express."

