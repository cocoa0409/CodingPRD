            - "GET /sales-remittances/${rem_id}/exemption-claims returns data.meta.total_count == 0"

      - name: flat_topology_foreign_keys_validated_across_peer_collections
        claim_type: Parent Relationships
        grounds:
          - complexity_profile.entity_topology
          - entities.CollectionSite.fields.state_program_id
          - entities.Hauler.fields.state_program_id
          - validations[priority=30]
        distinguishing_aspect: "entity_topology is flat, so FK targets live in peer root collections and are resolved by body field rather than by URL nesting: an unused state_program_id in the body of POST /collection-sites and POST /haulers returns 404 ERR_STATE_PROGRAM_NOT_FOUND."
        test_recipe:
