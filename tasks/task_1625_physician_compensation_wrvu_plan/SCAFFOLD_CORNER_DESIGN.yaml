  - section: validations
    instances:
      - name: missing_auth_headers_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Requests without X-User-Role/X-User-ID fail at priority 1 before any role or existence check."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /comp/physicians", payload: { npi: "1000000230", full_name: "No Auth", specialty: "IM", provider_type: PHYSICIAN, fte: 1.0, hire_date: "2020-01-01" }, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "Response is 401 with error_id == \"ERR_UNAUTHENTICATED\""
      - name: role_denied_before_existence_check
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=4]", "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "Authorization (priority 2) precedes existence (priority 4): a Physician GETting a nonexistent plan id receives 403 ERR_UNAUTHORIZED_ROLE, not 404 — no resource-existence information leaks across the role boundary."
        test_recipe:
          setup: ["Physician PH exists"]
          setup_api_calls:
            - { call: "POST /comp/physicians", payload: { npi: "1000000231", full_name: "Dr Nope", specialty: "IM", provider_type: PHYSICIAN, fte: 1.0, hire_date: "2020-01-01" }, as: SystemAdmin, captures: { phys: $.data.id } }
          trigger:
            - { call: "GET /comp/comp-plans/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: Physician, as_user_id: "${phys}", captures: { err: $.data.error_id } }
          assert:
            - "Response is 403 with error_id == \"ERR_UNAUTHORIZED_ROLE\" (not 404 ERR_NOT_FOUND)"
