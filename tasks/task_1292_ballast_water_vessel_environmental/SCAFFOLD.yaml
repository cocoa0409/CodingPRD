    side_effects: ["compliance_status PENDING_EVAL -> COMPLIANT | NONCOMPLIANT | EXEMPT_SCRUBBER", "if NONCOMPLIANT: create NoncomplianceRecord"]

  # --- Drills ---
  - method: POST
