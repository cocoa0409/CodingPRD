      - name: inventory_index_snapshot_not_recomputed
        claim_type: correct_result
        grounds:
          - calculations.inventory_risk_index
          - entities.RegulatoryReport.fields.inventory_risk_index
        distinguishing_aspect: "Snapshot fields are computed once at creation: registering a third model after report creation does not change the stored inventory_risk_index or total_models."
        test_recipe:
          setup:
            - "M1 registered (LOW/SINGLE_DESK/100 → 30); report R created"
          setup_api_calls:
            - call: "POST /mrm/models"
              payload: { name: "SnapA M1", business_unit: "Risk", declared_complexity: "LOW", usage_scope: "SINGLE_DESK", exposure_amount: 100 }
              as: ModelOwner
              as_user_id: u_own_a
            - call: "POST /mrm/regulatory-reports"
              payload: { report_type: "BOARD_QUARTERLY", period_start: "2026-07-01T00:00:00Z", period_end: "2026-09-30T00:00:00Z", aggregation_method: "EQUAL_WEIGHTED" }
              as: RegulatoryReporter
              as_user_id: u_rep
              captures: { r_id: $.data.id, idx0: $.data.inventory_risk_index, tot0: $.data.total_models }
            - call: "POST /mrm/models"
              payload: { name: "SnapA M2", business_unit: "Risk", declared_complexity: "HIGH", usage_scope: "SINGLE_DESK", exposure_amount: 100 }
              as: ModelOwner
              as_user_id: u_own_a
          trigger:
            - call: "GET /mrm/regulatory-reports/${r_id}"
              payload: {}
              as: RegulatoryReporter
              as_user_id: u_rep
              captures: { idx1: $.data.inventory_risk_index, tot1: $.data.total_models }
          assert:
            - "captured ${idx0} == 30.00 and captured ${tot0} == 1 (snapshot at creation)"
            - "captured ${idx1} == 30.00 and captured ${tot1} == 1 — unchanged after M2 registered (snapshot, not live recompute)"

  # ==========================================================================
  - section: validations
    instances:

      - name: missing_user_context_header_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"
        distinguishing_aspect: "A request without X-User-ID / X-User-Role headers is rejected with 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before any other check."
        test_recipe:
          setup:
            - "Empty DB"
          setup_api_calls: []
          trigger:
            - call: "GET /mrm/models"
              payload: {}
              as: ModelRiskOfficer
              as_user_id: u_cro
              captures: { err: $.data.error_id }
          assert:
            - "Sending the trigger request WITHOUT the X-User-ID header yields captured ${err} == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"
            - "HTTP status == 400"

      - name: forbidden_role_on_exclusive_endpoint
        claim_type: violation_to_error
        grounds:
          - "validations[priority=2]"
          - "errors[ERR_FORBIDDEN_ROLE]"
        distinguishing_aspect: "ModelValidator calling the ModelRiskOfficer-exclusive approve endpoint is rejected with 403 ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup:
            - "Model M registered by u_own_a"
          setup_api_calls:
            - call: "POST /mrm/models"
              payload: { name: "FR M", business_unit: "Risk", declared_complexity: "LOW", usage_scope: "SINGLE_DESK", exposure_amount: 100 }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /mrm/models/${m_id}/approve"
              payload: {}
              as: ModelValidator
              as_user_id: u_val
              captures: { err: $.data.error_id }
          assert:
            - "captured ${err} == ERR_FORBIDDEN_ROLE"
            - "HTTP status == 403"
            - "Model.${m_id}.status == REGISTERED (unchanged)"

      - name: occ_stale_version_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=4]"
          - "concurrency_rules[change-request-stale-model]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Creating a change request with expected_model_version behind the model's current version returns 412 ERR_STALE_VERSION; checked after existence, before state rules."
        test_recipe:
          setup:
            - "Model M registered; first change request created (bumps Model.version); a second create reuses the now-stale version"
          setup_api_calls:
            - call: "POST /mrm/models"
              payload: { name: "OCC M", business_unit: "Risk", declared_complexity: "LOW", usage_scope: "SINGLE_DESK", exposure_amount: 100 }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { m_id: $.data.id, m_v: $.data.version }
            - call: "POST /mrm/models/${m_id}/change-requests"
              payload: { change_type: "MINOR", description: "first", expected_model_version: "${m_v}" }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { cr1_id: $.data.id }
          trigger:
            - call: "POST /mrm/models/${m_id}/change-requests"
              payload: { change_type: "MINOR", description: "second with stale version", expected_model_version: "${m_v}" }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { err: $.data.error_id }
          assert:
            - "captured ${err} == ERR_STALE_VERSION (the first create bumped Model.version past ${m_v})"
            - "HTTP status == 412"
            - "GET /mrm/models/${m_id}/change-requests returns exactly 1 row"

      - name: occ_fresh_version_after_stale_failure_succeeds
        claim_type: satisfaction_to_pass
        grounds:
          - "concurrency_rules[change-request-stale-model]"
        distinguishing_aspect: "Re-reading the model to obtain the fresh version and retrying succeeds — change requests are allowed to coexist; only the stale view is rejected."
        test_recipe:
          setup:
            - "Model M registered; first change request created (version bumped); client re-reads the model"
          setup_api_calls:
            - call: "POST /mrm/models"
              payload: { name: "OCC2 M", business_unit: "Risk", declared_complexity: "LOW", usage_scope: "SINGLE_DESK", exposure_amount: 100 }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { m_id: $.data.id, m_v0: $.data.version }
            - call: "POST /mrm/models/${m_id}/change-requests"
              payload: { change_type: "MINOR", description: "first", expected_model_version: "${m_v0}" }
              as: ModelOwner
              as_user_id: u_own_a
            - call: "GET /mrm/models/${m_id}"
              payload: {}
              as: ModelOwner
              as_user_id: u_own_a
              captures: { m_v1: $.data.version }
          trigger:
            - call: "POST /mrm/models/${m_id}/change-requests"
              payload: { change_type: "MAJOR", description: "second with fresh version", expected_model_version: "${m_v1}" }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { cr2_id: $.data.id, cr2_status: $.data.status }
          assert:
            - "captured ${cr2_status} == SUBMITTED (fresh version accepted)"
            - "captured ${m_v1} == ${m_v0} + 1"
            - "GET /mrm/models/${m_id}/change-requests returns exactly 2 rows (coexistence allowed)"

      - name: ownership_check_blocks_non_owner_documentation
        claim_type: violation_to_error
        grounds:
          - "validations[priority=5]"
          - "errors[ERR_NOT_MODEL_OWNER]"
        distinguishing_aspect: "A ModelOwner whose X-User-ID differs from model.owner_user_id cannot submit documentation on that model (ownership checked before state rules)."
        test_recipe:
          setup:
            - "Model M registered by u_own_a"
          setup_api_calls:
            - call: "POST /mrm/models"
              payload: { name: "Own M", business_unit: "Risk", declared_complexity: "LOW", usage_scope: "SINGLE_DESK", exposure_amount: 100 }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /mrm/models/${m_id}/documentations"
              payload: { version_label: "1.0", has_development_evidence: true, has_testing_evidence: true, has_data_lineage: true }
              as: ModelOwner
              as_user_id: u_own_b
              captures: { err: $.data.error_id }
          assert:
            - "captured ${err} == ERR_NOT_MODEL_OWNER"
            - "HTTP status == 403"
            - "GET /mrm/models/${m_id}/documentations returns an empty list"

      - name: sod_validator_independence_blocks_owner_validator
        claim_type: violation_to_error
        grounds:
          - "validations[priority=7]"
          - "errors[ERR_SOD_VALIDATION_INDEPENDENCE]"
        distinguishing_aspect: "A validator whose X-User-ID equals the model's owner_user_id cannot open an engagement — segregation of duties between development and validation."
        test_recipe:
          setup:
            - "Model M registered by u_own_a with APPROVED documentation"
          setup_api_calls:
            - call: "POST /mrm/models"
              payload: { name: "SoD M", business_unit: "Risk", declared_complexity: "LOW", usage_scope: "SINGLE_DESK", exposure_amount: 100 }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { m_id: $.data.id }
            - call: "POST /mrm/models/${m_id}/documentations"
              payload: { version_label: "1.0", has_development_evidence: true, has_testing_evidence: true, has_data_lineage: true }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { doc_id: $.data.id }
            - call: "POST /mrm/models/${m_id}/documentations/${doc_id}/decide"
              payload: { decision: "APPROVE" }
              as: ModelRiskOfficer
              as_user_id: u_cro
          trigger:
            - call: "POST /mrm/models/${m_id}/validation-engagements"
              payload: { scope_conceptual_soundness: true, scope_outcomes_analysis: false, period_start: "2026-08-02T00:00:00Z", period_end: "2026-08-09T00:00:00Z" }
              as: ModelValidator
              as_user_id: u_own_a
              captures: { err: $.data.error_id }
          assert:
            - "captured ${err} == ERR_SOD_VALIDATION_INDEPENDENCE"
            - "HTTP status == 403"
            - "GET /mrm/models/${m_id}/validation-engagements returns an empty list"

      - name: sod_documentation_approval_blocks_submitter_deciding
        claim_type: violation_to_error
        grounds:
          - "validations[priority=7]"
          - "errors[ERR_SOD_DOCUMENTATION_APPROVAL]"
        distinguishing_aspect: "The decider's X-User-ID must differ from the doc's submitted_by_user_id; a submitter deciding their own package is rejected with ERR_SOD_DOCUMENTATION_APPROVAL."
        test_recipe:
          setup:
            - "Model M registered by u_cro acting as ModelOwner (registrar and submitter share id u_cro); doc submitted by u_cro"
          setup_api_calls:
            - call: "POST /mrm/models"
              payload: { name: "SoDDoc M", business_unit: "Risk", declared_complexity: "LOW", usage_scope: "SINGLE_DESK", exposure_amount: 100 }
              as: ModelOwner
              as_user_id: u_cro
              captures: { m_id: $.data.id }
            - call: "POST /mrm/models/${m_id}/documentations"
              payload: { version_label: "1.0", has_development_evidence: true, has_testing_evidence: true, has_data_lineage: true }
              as: ModelOwner
              as_user_id: u_cro
              captures: { doc_id: $.data.id }
          trigger:
            - call: "POST /mrm/models/${m_id}/documentations/${doc_id}/decide"
              payload: { decision: "APPROVE" }
              as: ModelRiskOfficer
              as_user_id: u_cro
              captures: { err: $.data.error_id }
          assert:
            - "captured ${err} == ERR_SOD_DOCUMENTATION_APPROVAL (decider u_cro == submitted_by_user_id u_cro)"
            - "HTTP status == 403"
            - "ModelDocumentation.${doc_id}.status == SUBMITTED (unchanged)"

      - name: approve_blocked_by_open_critical_findings
        claim_type: violation_to_error
        grounds:
          - "validations[priority=7]"
          - "errors[ERR_OPEN_CRITICAL_FINDINGS]"
        distinguishing_aspect: "Approval is blocked while any CRITICAL finding is OPEN/OVERDUE/ESCALATED, even with documentation and validation gates satisfied."
        test_recipe:
          setup:
            - "Model M registered with APPROVED doc and COMPLETED EFFECTIVE engagement; CRITICAL finding raised afterwards (still OPEN)"
          setup_api_calls:
            - call: "POST /mrm/models"
              payload: { name: "CritBlock M", business_unit: "Risk", declared_complexity: "LOW", usage_scope: "SINGLE_DESK", exposure_amount: 100 }
              as: ModelOwner
              as_user_id: u_own_a
