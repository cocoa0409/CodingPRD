  - section: consistency_model
    instances:
      - name: success_and_error_envelopes_carry_meta_block
        claim_type: immediate
        grounds: ["response_envelope"]
        distinguishing_aspect: "Both a 201 success and a 404 error carry meta.api_request_id and meta.api_request_timestamp; the success body sets response_type 'object' with the entity under data, while the error body sets response_type 'error' with error_id and message under data."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /jurisdictions"
              payload: { name: "Palmdale", code: "PLMD", local_max_detached_sqft: 1000, local_rear_setback_ft: 4.0, local_side_setback_ft: 4.0, local_max_height_ft: 18.0, plan_check_base_fee_cents: 120000, plan_check_rate_per_sqft_cents: 90, impact_fee_per_sqft_cents: 800, utility_capacity_fee_cents: 250000 }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "GET /properties/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PlatformAdmin
              captures: { err_id: $.data.error_id, err_msg: $.data.message }
          assert:
            - "the create response has meta.api_request_id and meta.api_request_timestamp present and response_type == 'object'"
            - "the create response's data.created_at matches the ISO 8601 UTC pattern with exactly three fractional digits"
            - "the second call returns HTTP 404 with response_type == 'error', the captured err_id == 'ERR_PROPERTY_NOT_FOUND' and a non-empty err_msg"
            - "the error response also carries meta.api_request_id and meta.api_request_timestamp"

      - name: cascade_effects_visible_in_immediately_following_read
        claim_type: immediate
        grounds: ["state_machines.ChangeOrder.SUBMITTED_to_APPROVED"]
        excluded_because:
          difficulty_instance: "transitive_cascade / change_order_funding_chain"
          rationale: "That instance asserts the project's repriced contract, the scenario's recomputed funding gap and the flipped financing_state immediately after the single decide call, which is exactly the immediate-consistency claim."
