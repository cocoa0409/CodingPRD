        distinguishing_aspect: |
          Election's POLLS_CLOSED->CERTIFIED transition depends on every Precinct of the election being
          TALLIED (entity pair Election->Precinct, distinct from AbsenteeBallot->VoterRegistration);
          a single PENDING precinct blocks certification with ERR_PRECINCTS_NOT_TALLIED.
        test_recipe:
          setup:
            - "Election POLLS_CLOSED with two precincts, one TALLIED and one still PENDING; no open recounts."
          setup_api_calls:
