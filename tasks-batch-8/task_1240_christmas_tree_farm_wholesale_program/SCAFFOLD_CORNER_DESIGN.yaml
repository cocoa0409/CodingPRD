            - { call: "GET /api/allocations?order_id=${oa}", payload: {}, as: FarmManager, captures: { ala: "$.data[0].id" } }
            - { call: "POST /api/wholesale-orders", payload: { season_id: "${s}", buyer_account_id: "${buy}", species: "NOBLE_FIR", height_class: "H_5_6", quantity: 100, unit_price_cents: 400 }, as: WholesaleBuyer, as_user_id: "${buy}", captures: { ob: $.data.id } }
            - { call: "POST /api/wholesale-orders/${ob}/submit", payload: {}, as: WholesaleBuyer, as_user_id: "${buy}", captures: { obv: $.data.version } }
            - { call: "POST /api/wholesale-orders/${ob}/allocate", payload: { quantity: 100, expected_order_version: "${obv}" }, as: FarmManager }
            - { call: "GET /api/allocations?order_id=${ob}", payload: {}, as: FarmManager, captures: { alb: "$.data[0].id" } }
