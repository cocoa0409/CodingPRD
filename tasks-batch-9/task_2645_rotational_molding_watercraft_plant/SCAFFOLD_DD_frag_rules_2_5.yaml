            - "WarrantyClaim.${wc1}.pre_fee_gross_cents == 240000 — round_half_up(300000 * round((60 - 12) / 60 * 100, 2) / 100 * 1.00) with coverage_pct 80.00 and CLAIM_TYPE_FACTOR[HULL_DEFORMATION] 1.00"
            - "WarrantyClaim.${wc1}.admin_fee_cents == 12000 — no ADMIN_FEE_TIERS row has max_gross_cents >= 240000, so ADMIN_FEE_TOP_RATE_PCT 5.00 applies: round_half_up(240000 * 5.00 / 100)"
            - "WarrantyClaim.${wc1}.storage_deduction_cents == 84000 — round_half_up(240000 * STORAGE_WAIVED_DEDUCTION_PCT 35.00 / 100), applied only because the storage axis is WAIVED"
            - "WarrantyClaim.${wc1}.net_payout_cents == 144000 == max(0, 240000 - 84000 - 12000)"
            - "WarrantyClaim.${wc1}.claim_status == \"APPROVED\" and WarrantyClaim.${wc1}.storage_review_status == \"WAIVED\""
            - "WarrantyClaim.${wc2}.pre_fee_gross_cents == 72000 — the same msrp and the same 80.00 coverage, scaled by CLAIM_TYPE_FACTOR[COSMETIC] 0.30"
            - "WarrantyClaim.${wc2}.admin_fee_cents == 5760 — 72000 falls in the second ADMIN_FEE_TIERS row (max_gross_cents 200000, rate 8.00), a DIFFERENT band from claim 1 on identical msrp and age"
            - "WarrantyClaim.${wc2}.storage_deduction_cents == 0 and WarrantyClaim.${wc2}.net_payout_cents == 66240"
            - "ProductModel.${pm}.warranty_reserve_cents == 289760 and ProductModel.${pm}.warranty_paid_cents == 210240, and 289760 + 210240 == 500000 == initial_warranty_reserve_cents"
            - "the pinned order is falsifiable: re-selecting the admin fee tier AFTER the storage deduction would price claim 1 at 8.00 percent of 156000 == 12480 and yield net_payout_cents 143520 and warranty_reserve_cents 290240 — neither of which this instance accepts"

  # ===========================================================================
  # RULE 3 — non_linear_state_machine
  # Instances must live on DIFFERENT ENTITIES (§0.5 Rule 3 differentiation
  # clause): MoldingCycle (branch fork with divergent compensation),
  # FinishedUnit (backward loop edge plus a parallel-axis guard) and
  # Shipment (backward unseal edge that invalidates a derived field).
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: molding_cycle_scheduled_fork_with_divergent_abort_compensation
        grounds:
          - state_machines.MoldingCycle.SCHEDULED_to_ABORTED
          - state_machines.MoldingCycle.SCHEDULED_to_OVEN_RUNNING
          - state_machines.MoldingCycle.OVEN_RUNNING_to_ABORTED
          - state_machines.ResinCharge.RESERVED_to_RELEASED
          - state_machines.ResinCharge.RESERVED_to_CONSUMED
          - state_machines.ResinLot.DEPLETED_to_AVAILABLE
          - state_machines.Mold.IN_CYCLE_to_AVAILABLE
          - calculations.resin_mass_ledger
          - calculations.production_order_cost
        distinguishing_aspect: |
          The non-linearity here is a BRANCH on MoldingCycle: the single state
          SCHEDULED has two outgoing edges (ABORTED and OVEN_RUNNING) that are
          chosen by which endpoint is called, and the SAME abort endpoint then
          compensates differently depending on which branch was taken —
          aborting from SCHEDULED returns charge_kg to ResinLot.available_kg,
          while aborting from OVEN_RUNNING leaves it in consumed_kg forever.
          One lot of 24.000 kg drives both branches, so the divergence is
          visible as a single ledger split 12.000 restored / 12.000 scrapped.
        test_recipe:
          setup:
            - "ProductModel PM-FORK-KM (nominal_charge_kg 12.000, charge_tolerance_pct 5.00, so the release mass gate is round(12.000 * 0.95, 3) == 11.400)."
            - "One Mold MLD-FORK-1 with cavity_count 1, nominal_charge_kg 12.000 == 12.000 * 1, service_interval_cycles 10 and cycles_since_service 0."
            - "ResinLot LOT-FORK with received_kg exactly 24.000 — enough for two 12.000 kg charges and nothing more, so the second charge drives available_kg to exactly 0.000 and the lot goes DEPLETED."
            - "ProductionOrder PO-FORK (ordered_qty 2, no demand_bucket_id) released and then given TWO cycles: CYC-A over oven window 09:00-10:00 (cooling to 10:30) and CYC-B over 11:00-12:00 on the same arm 1 of OV-1, which is legal because the windows are disjoint half-open intervals separated by more than changeover_buffer_min 15 and because MLD-FORK-1 is AVAILABLE with no overlapping cycle."
            - "Creating CYC-A moved PO-FORK from READY_TO_SCHEDULE to IN_PRODUCTION; creating CYC-B left the status alone but bumped ProductionOrder.version again, so CYC-B's expected_production_order_version comes from a fresh GET."
            - "Both cycles hold a RESERVED ResinCharge of 12.000 kg against LOT-FORK, so at the end of setup the lot reads available_kg 0.000 / reserved_kg 24.000 / consumed_kg 0.000 and status DEPLETED, and both cycles are still SCHEDULED."
          setup_api_calls:
            - call: "POST /product-models"
              payload: { model_code: "PM-FORK-KM", hull_type: "KAYAK", size_class: "MID", resin_grade: "HDPE_LINEAR", master_color_code: "SLATE", max_color_delta_e: 1.50, required_additive_package_code: "UV12", max_regrind_pct: 30.00, min_melt_index_g10min: 2.50, max_melt_index_g10min: 6.00, nominal_charge_kg: 12.000, charge_tolerance_pct: 5.00, min_cooling_minutes: 30, target_wall_thickness_mm: 6.00, wall_thickness_min_mm: 4.50, wall_cv_max_pct: 12.00, impact_test_min_joules: 90.00, gross_cube_m3: 2.0000, nest_factor: 0.5000, unit_weight_kg: 24.000, msrp_cents: 300000, warranty_basis: "FLAT", initial_warranty_reserve_cents: 500000, seasonal_family: "PADDLE" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { pm: $.data.id }
            - call: "POST /molds"
              payload: { mold_code: "MLD-FORK-1", product_model_id: "${pm}", size_class: "MID", cavity_count: 1, nominal_charge_kg: 12.000, service_interval_cycles: 10 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { mold: $.data.id }
            - call: "POST /oven-stations"
              payload: { station_code: "OV-1", arm_count: 2, max_size_class: "OVERSIZE", changeover_buffer_min: 15, energy_cents_per_min: 100 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { station: $.data.id }
            - call: "POST /cooling-bays"
              payload: { bay_code: "CB-1", concurrent_slot_capacity: 2, airflow_mode: "FORCED_AIR" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { bay: $.data.id }
            - call: "POST /technicians"
              payload: { employee_code: "T-RES-1", full_name: "Rita Resin", role_code: "RESIN_TECH", certifications: ["RESIN_BLENDING"] }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { t_res: $.data.id }
            - call: "POST /technicians"
              payload: { employee_code: "T-OPR-1", full_name: "Omar Oven", role_code: "MOLDING_OPERATOR", certifications: [] }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { t_op: $.data.id }
            - call: "POST /warehouses"
              payload: { site_code: "WH-FORK", footprint_capacity_cube_m3: 20.0000, zones: [{ zone_code: "Z-A", capacity_cube_m3: 20.0000 }], restricted_threshold_pct: 85.00, frozen_threshold_pct: 95.00 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { wh: $.data.id }
            - call: "POST /resin-lots"
              payload: { lot_code: "LOT-FORK", resin_grade: "HDPE_LINEAR", melt_index_g10min: 4.00, color_code: "SLATE", color_delta_e: 0.50, additive_package_code: "UV12", regrind_pct_by_mass: 10.00, cost_cents_per_kg: 210, received_kg: 24.000, expires_on: "2035-12-31" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { lot: $.data.id }
            - call: "POST /production-orders"
              payload: { order_code: "PO-FORK", product_model_id: "${pm}", target_warehouse_id: "${wh}", ordered_qty: 2 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { po: $.data.id }
            - call: "POST /production-orders/${po}/release"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { po_v1: $.data.version }
            - call: "POST /molding-cycles"
              payload: { production_order_id: "${po}", oven_station_id: "${station}", arm_index: 1, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T09:00:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "FORCED_AIR", expected_production_order_version: "${po_v1}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { cyc_a: $.data.id }
            - call: "GET /production-orders/${po}"
              payload: {}
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { po_v2: $.data.version }
            - call: "POST /molding-cycles"
              payload: { production_order_id: "${po}", oven_station_id: "${station}", arm_index: 1, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T11:00:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "FORCED_AIR", expected_production_order_version: "${po_v2}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { cyc_b: $.data.id }
            - call: "GET /resin-lots/${lot}"
              payload: {}
              as: ResinTechnician
              as_user_id: "${t_res}"
              captures: { lot_v1: $.data.version }
            - call: "POST /resin-charges"
              payload: { molding_cycle_id: "${cyc_a}", resin_lot_id: "${lot}", charge_kg: 12.000, regrind_kg: 1.200, expected_resin_lot_version: "${lot_v1}" }
              as: ResinTechnician
              as_user_id: "${t_res}"
              captures: { ch_a: $.data.id }
            - call: "GET /resin-lots/${lot}"
              payload: {}
              as: ResinTechnician
              as_user_id: "${t_res}"
              captures: { lot_v2: $.data.version }
            - call: "POST /resin-charges"
              payload: { molding_cycle_id: "${cyc_b}", resin_lot_id: "${lot}", charge_kg: 12.000, regrind_kg: 1.200, expected_resin_lot_version: "${lot_v2}" }
              as: ResinTechnician
              as_user_id: "${t_res}"
              captures: { ch_b: $.data.id }
          trigger:
            - call: "POST /molding-cycles/${cyc_a}/abort"
              payload: { abort_reason: "OPERATOR_ABORT" }
              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "GET /resin-lots/${lot}"
              payload: {}
              as: ResinTechnician
              as_user_id: "${t_res}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T11:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /molding-cycles/${cyc_b}/start-oven"
              payload: { actual_oven_start_at: "2026-08-01T11:00:00Z" }
              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "GET /molds/${mold}"
              payload: {}
              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T11:30:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /molding-cycles/${cyc_b}/abort"
              payload: { abort_reason: "OPERATOR_ABORT" }
              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "GET /resin-lots/${lot}"
              payload: {}
              as: ResinTechnician
              as_user_id: "${t_res}"
            - call: "GET /finished-units?production_order_id=${po}"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "GET /production-orders/${po}"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
          assert:
            - "MoldingCycle.${cyc_a}.status == \"ABORTED\" and MoldingCycle.${cyc_a}.abort_reason == \"OPERATOR_ABORT\" and MoldingCycle.${cyc_a}.actual_oven_start_at is null — the SCHEDULED -> ABORTED branch never entered the oven"
            - "ResinCharge.${ch_a}.status == \"RELEASED\" and ResinCharge.${ch_a}.released_reason == \"CYCLE_ABORTED\" (CASCADE-A link 2)"
            - "immediately after the first abort, ResinLot.${lot}.available_kg == 12.000, reserved_kg == 12.000, consumed_kg == 0.000 and status == \"AVAILABLE\" — the DEPLETED -> AVAILABLE edge fired because available_kg rose above 0.000"
            - "MoldingCycle.${cyc_b}.status after start-oven is \"OVEN_RUNNING\" and ResinCharge.${ch_b}.status == \"CONSUMED\": the OTHER edge out of SCHEDULED moved the same 12.000 kg from reserved_kg to consumed_kg, leaving available_kg unchanged at 12.000, so the lot stays AVAILABLE rather than re-depleting"
            - "Mold.${mold}.status == \"IN_CYCLE\" while cycle B is OVEN_RUNNING"
            - "MoldingCycle.${cyc_b}.status == \"ABORTED\" and abort_reason == \"OPERATOR_ABORT\" after the second abort, and Mold.${mold}.status == \"AVAILABLE\" with cycles_since_service == 0 — an OVEN_RUNNING abort frees the mold WITHOUT incrementing the service counter"
            - "ResinCharge.${ch_b}.status is still \"CONSUMED\" (NOT RELEASED) and ResinCharge.${ch_b}.released_reason is null — the asymmetric compensation: a shot already in the oven is scrapped, not returned"
            - "ResinLot.${lot} finally reads available_kg == 12.000, reserved_kg == 0.000, consumed_kg == 12.000, status == \"AVAILABLE\", and round(12.000 + 0.000 + 12.000, 3) == 24.000 == ResinLot.${lot}.received_kg — the mass invariant survives both branches"
            - "GET /finished-units?production_order_id=${po} returns 0 rows: neither ABORTED branch minted a hull"
            - "ProductionOrder.${po}.status == \"IN_PRODUCTION\" with completed_qty == 0, scrapped_qty == 0, material_cost_cents == 2520 == round_half_up(12.000 * 210) from the single CONSUMED charge, oven_energy_cost_cents == 0 because no cycle reached DEMOLDED, overhead_cents == 454 == round_half_up(2520 * 18.00 / 100), total_cost_cents == 2974 and unit_cost_cents is null"

      - name: finished_unit_rework_loop_edge_closed_by_logistics_axis
        grounds:
          - state_machines.FinishedUnit.OUTFITTED_to_REWORK
          - state_machines.FinishedUnit.REWORK_to_TRIMMED
          - state_machines.FinishedUnit.TRIMMED_to_OUTFITTED
          - state_machines.FinishedUnit.OUTFITTED_to_SELLABLE
          - state_machines.FinishedUnit.logistics_status.UNALLOCATED_to_STORED
          - calculations.inspection_verdict
          - calculations.wall_thickness_distribution
          - calculations.production_order_cost
          - validations[priority=39]
        distinguishing_aspect: |
          A DIFFERENT ENTITY from the MoldingCycle fork: this instance drives
          FinishedUnit, whose non-linearity is a genuine CYCLE — REWORK travels
          BACKWARD to TRIMMED and the unit re-walks TRIMMED -> OUTFITTED ->
          SELLABLE, so the same state is occupied twice with rework_count 0 and
          then 1 and hardware_kit_serial cleared in between. It is not a branch
          (the MoldingCycle case) but a loop, and the loop is closed from the
          OTHER, parallel axis: once logistics_status leaves UNALLOCATED the
          build-axis edge out of SELLABLE becomes unreachable
          (ERR_UNIT_NOT_REINSPECTABLE, priority 39).
