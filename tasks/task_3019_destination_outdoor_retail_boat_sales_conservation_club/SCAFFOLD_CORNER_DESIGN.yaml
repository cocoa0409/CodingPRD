            - "the calendar owner checking in a session is rejected with data.error_id == ERR_FORBIDDEN_ROLE and http 403"
            - "only one EventOffering exists for the store, so the refused creation left nothing behind"
            - "AttractionSession.${s_id}.status == CONFIRMED after both rejections, so neither role has executed the other's action"

      - name: shared_operations_are_permitted_for_multiple_declared_roles
        claim_type: shared_operation_allowed
        grounds:
          - roles.PlatformAdmin.shared_operations
          - roles.StoreManager.shared_operations
          - endpoints.POST /stores/{store_id}/ops-run
        distinguishing_aspect: "The ops-run checkpoint is a shared operation, so a store manager running it for their own store and a platform operator running it for the same store both succeed and both advance the epoch."
        test_recipe:
          setup: ["a store with one permit sale so the checkpoint has work to reconcile"]
          setup_api_calls:
