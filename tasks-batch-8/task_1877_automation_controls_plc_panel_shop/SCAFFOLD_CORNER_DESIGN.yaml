  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: bom_rollup_excludes_retired_substituted_original
        claim_type: input_set_filtering
        grounds: [calculations.bom_cost_rollup]
        distinguishing_aspect: "After an approved substitution, the retired original line is excluded from the rollup: a panel with {BPD 10000 x1 (RECEIVED), CON 8000 x1 (original, retired)} and new line {CON-sub 9000 x1 (SUBSTITUTED)} totals 19000, not 27000."
        test_recipe:
          setup: ["panel PROCUREMENT with BPD line received, CON line swapped to a 9000-cent substitute via approved substitution"]
          setup_api_calls:
            - call: "POST /panel-shop/customers"
              payload: { company_name: "Rollup Co", site_state_code: "UT" }
              as: ProjectManager
              captures: { c_ru: "$.data.id" }
            - call: "POST /panel-shop/jobs"
              payload: { customer_id: "${c_ru}", job_number: "J-RU1", quoted_price_cents: 100000 }
              as: ProjectManager
              captures: { j_ru: "$.data.id" }
            - call: "POST /panel-shop/jobs/${j_ru}/panels"
              payload: { panel_tag: "P-RU1", enclosure_rating: "NEMA_1", design_engineer_id: "de-ru" }
              as: DesignEngineer
              captures: { p_ru: "$.data.id" }
            - call: "POST /panel-shop/components"
              payload: { part_number: "BPD-RU", component_class: "BRANCH_PROTECTIVE", unit_cost_cents: 10000, lead_time_days: 7, sccr_ka: 10, heat_dissipation_w: 8 }
              as: QAManager
              captures: { comp_ru1: "$.data.id" }
            - call: "POST /panel-shop/components"
              payload: { part_number: "CON-RU", component_class: "CONTACTOR", unit_cost_cents: 8000, lead_time_days: 5, sccr_ka: 5, heat_dissipation_w: 20 }
              as: QAManager
              captures: { comp_ru2: "$.data.id" }
            - call: "POST /panel-shop/components"
              payload: { part_number: "CON-RU-S", component_class: "CONTACTOR", unit_cost_cents: 9000, lead_time_days: 9, sccr_ka: 22, heat_dissipation_w: 20 }
              as: QAManager
              captures: { comp_ru3: "$.data.id" }
            - call: "POST /panel-shop/panels/${p_ru}/components"
              payload: { component_id: "${comp_ru1}", quantity: 1 }
              as: DesignEngineer
            - call: "POST /panel-shop/panels/${p_ru}/components"
              payload: { component_id: "${comp_ru2}", quantity: 1 }
              as: DesignEngineer
              captures: { line_ru: "$.data.id" }
            - call: "POST /panel-shop/panels/${p_ru}/submit-review"
              payload: {}
              as: DesignEngineer
            - call: "POST /panel-shop/panels/${p_ru}/approve-design"
              payload: {}
              as: QAManager
              as_user_id: "qa-ru"
            - call: "POST /panel-shop/panels/${p_ru}/release-procurement"
              payload: {}
              as: ProjectManager
            - call: "POST /panel-shop/panels/${p_ru}/substitution-requests"
              payload: { original_line_id: "${line_ru}", proposed_component_id: "${comp_ru3}", reason: "stockout" }
              as: DesignEngineer
              as_user_id: "de-ru"
              captures: { sub_ru: "$.data.id" }
            - call: "POST /panel-shop/substitution-requests/${sub_ru}/approve"
              payload: {}
              as: QAManager
              as_user_id: "qa-ru"
          trigger:
            - call: "GET /panel-shop/panels/${p_ru}/components"
              payload: {}
              as: DesignEngineer
          assert:
            - "active lines (PENDING/ORDERED/RECEIVED + the SUBSTITUTED replacement, excluding the retired original) sum extended_cost_cents == 19000 (10000 + 9000)"
            - "the retired original line (id == ${line_ru}) is excluded from the active set even though its line_status is SUBSTITUTED — it is the one referenced by the replacement's substituted_for_id"
            - "exactly 3 PanelComponent rows exist for the panel (original BPD, original CON, replacement CON)"

      - name: as_built_completeness_weighted_steps
        claim_type: correct_result
        grounds: [calculations.as_built_completeness]
        distinguishing_aspect: "Weighted scoring: wiring alone == 35; wiring+program+test == 85; all four == 100; the package auto-advances to PENDING_REVIEW only at exactly 100."
        test_recipe:
          setup: ["panel with as-built package, no flags set"]
          setup_api_calls:
            - call: "POST /panel-shop/customers"
              payload: { company_name: "AB Co", site_state_code: "UT" }
              as: ProjectManager
              captures: { c_ab: "$.data.id" }
            - call: "POST /panel-shop/jobs"
              payload: { customer_id: "${c_ab}", job_number: "J-AB1", quoted_price_cents: 100000 }
              as: ProjectManager
              captures: { j_ab: "$.data.id" }
            - call: "POST /panel-shop/jobs/${j_ab}/panels"
              payload: { panel_tag: "P-AB1", enclosure_rating: "NEMA_1", design_engineer_id: "de-ab" }
              as: DesignEngineer
              captures: { p_ab: "$.data.id" }
            - call: "GET /panel-shop/panels/${p_ab}/as-built-packages"
              payload: {}
              as: DesignEngineer
              captures: { abp_ab: "$.data[0].id" }
          trigger:
            - call: "PATCH /panel-shop/as-built-packages/${abp_ab}"
              payload: { has_wiring_diagram: true }
              as: DesignEngineer
              captures: { pct_1: "$.data.completeness_pct" }
            - call: "PATCH /panel-shop/as-built-packages/${abp_ab}"
              payload: { has_program_archive: true, has_test_report: true }
              as: DesignEngineer
              captures: { pct_2: "$.data.completeness_pct" }
            - call: "PATCH /panel-shop/as-built-packages/${abp_ab}"
              payload: { has_ul_label_photo: true }
              as: DesignEngineer
              captures: { pct_3: "$.data.completeness_pct", st_3: "$.data.status" }
          assert:
            - "pct_1 == 35"
            - "pct_2 == 85"
            - "pct_3 == 100 and st_3 == PENDING_REVIEW (auto-advance at exactly 100)"

      - name: as_built_flag_withdrawal_regresses_pending_review
        claim_type: variant_divergence
        grounds: [calculations.as_built_completeness, state_machines.AsBuiltPackage.PENDING_REVIEW_to_INCOMPLETE]
        distinguishing_aspect: "Flipping a has_* flag true -> false while PENDING_REVIEW regresses the package to INCOMPLETE (compound posture re-derived on child change) and completeness drops below 100."
        test_recipe:
          setup: ["as-built package PENDING_REVIEW at completeness 100"]
          setup_api_calls:
            - call: "POST /panel-shop/customers"
              payload: { company_name: "Regr Co", site_state_code: "UT" }
              as: ProjectManager
              captures: { c_rg: "$.data.id" }
            - call: "POST /panel-shop/jobs"
              payload: { customer_id: "${c_rg}", job_number: "J-RG1", quoted_price_cents: 100000 }
              as: ProjectManager
              captures: { j_rg: "$.data.id" }
            - call: "POST /panel-shop/jobs/${j_rg}/panels"
              payload: { panel_tag: "P-RG1", enclosure_rating: "NEMA_1", design_engineer_id: "de-rg" }
              as: DesignEngineer
              captures: { p_rg: "$.data.id" }
            - call: "GET /panel-shop/panels/${p_rg}/as-built-packages"
              payload: {}
              as: DesignEngineer
              captures: { abp_rg: "$.data[0].id" }
            - call: "PATCH /panel-shop/as-built-packages/${abp_rg}"
              payload: { has_wiring_diagram: true, has_program_archive: true, has_test_report: true, has_ul_label_photo: true }
              as: DesignEngineer
          trigger:
            - call: "PATCH /panel-shop/as-built-packages/${abp_rg}"
              payload: { has_test_report: false }
              as: DesignEngineer
              captures: { pct_rg: "$.data.completeness_pct", st_rg: "$.data.status" }
          assert:
            - "pct_rg == 75 (0.35 + 0.25 + 0.15)"
            - "st_rg == INCOMPLETE (regressed from PENDING_REVIEW)"

      - name: sccr_excludes_unrated_and_control_class_lines
        claim_type: input_set_filtering
        grounds: [calculations.sccr_panel_rating]
        distinguishing_aspect: "Lines whose component class is WIRE_DUCT/TERMINAL/PLC_IO/PILOT_DEVICE, or whose sccr_ka is null, are excluded from the min-chain: a BOM of {BPD 10, WIRE_DUCT (null), PLC_IO (null)} rates exactly 10, not 0."
        test_recipe:
