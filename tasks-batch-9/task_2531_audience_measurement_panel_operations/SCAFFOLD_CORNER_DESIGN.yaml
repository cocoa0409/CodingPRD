            - "Trigger call 1: HTTP 409 with ${w1} == ERR_INCENTIVE_PERIOD_NOT_ACCRUED - accrual_periods is still empty"
            - "Trigger call 2: HTTP 201 with data.incentive_accrued_cents == 2500 and accrual_periods == [{2026-08, 2500, reversed false}]"
            - "Trigger call 3: HTTP 409 with ${w2} == ERR_INCENTIVE_PERIOD_NOT_ACCRUED - the label must match exactly; 2026-09 was never accrued"
            - "Trigger call 4: HTTP 200 with data.incentive_accrued_cents == 0 and accrual_periods still holding ONE entry for 2026-08 whose reversed flag is now true - the entry is flagged, not deleted"
            - "Trigger call 5: HTTP 409 with ${w3} == ERR_INCENTIVE_PERIOD_NOT_ACCRUED - the entry exists but its reversed flag is true, so the rule reads both halves of its condition"
            - "Trigger call 6: data.incentive_budget_committed_cents == 0 and data.incentive_budget_reserved_cents == 2000 - the reversal returned the committed money and left the armed boost's reservation alone"

  # ===========================================================================
  # SECTION 7 - RBAC (§1.7)
  #
  # role_model is segregation_of_duties over seven peer roles, so the claims are:
  # identity headers, peer-role denial of every exclusive operation family, the
  # confidential-read subset, the ClientUser's entity-backed identity, and the
  # three same-user gates.
  # ===========================================================================
  - section: rbac
    instances:

      - name: unauthenticated_and_unknown_role_requests_are_rejected
        claim_type: unauthenticated
        grounds:
          - validations[priority 1]
          - roles
        distinguishing_aspect: "Priority 1 is one rule with two halves - a present non-empty X-User-ID AND an X-User-Role naming one of the seven declared roles - so an unknown role name is a 401 and not a 403, and neither failure may leave a row behind."
        test_recipe:
          setup:
            - "An empty database. Each call below manipulates the identity headers directly."
          setup_api_calls: []
          trigger:
            - call: "GET /markets"
              payload: {}
              as: PanelOperationsManager
              as_user_id: ""
              captures: { a1: "$.data.error_id" }
            - call: "GET /markets"
              payload: {}
              as: "AuditIntern"
              as_user_id: "intern-1"
              captures: { a2: "$.data.error_id" }
            - call: "POST /markets"
              payload: { name: "Ghost Market", market_code: "DMA-693", dma_rank: 193, incentive_budget_cents: 500000 }
              as: PanelOperationsManager
              as_user_id: ""
              captures: { a3: "$.data.error_id" }
            - call: "GET /markets"
              payload: {}
              as: PanelOperationsManager
              as_user_id: "ops-1"
          assert:
            - "Trigger call 1: HTTP 401 with ${a1} == ERR_UNAUTHENTICATED - the X-User-ID header is empty"
            - "Trigger call 2: HTTP 401 with ${a2} == ERR_UNAUTHENTICATED and NOT 403 - an X-User-Role outside the seven declared roles fails the authentication rule, before any endpoint role list is consulted"
            - "Trigger call 3: HTTP 401 with ${a3} == ERR_UNAUTHENTICATED"
            - "Trigger call 4: HTTP 200 with data.total_count == 0 - the rejected POST created nothing"

      - name: exclusive_operations_are_rejected_for_peer_roles_unauthorized
        claim_type: unauthorized
        grounds:
          - validations[priority 2]
          - roles
        distinguishing_aspect: "Every role family's exclusive write is probed from a peer that owns a NEIGHBOURING surface, and each probe carries an unresolvable id in path or body - the 403 rather than a 404 proves the role gate at priority 2 runs before existence at 4 and 5. The clock endpoint, which every role shares, still succeeds for the same callers."
        test_recipe:
          setup:
            - "An empty database; the probes need no rows because they must fail on the role check first."
          setup_api_calls: []
          trigger:
            - call: "POST /markets"
              payload: { name: "Not Mine", market_code: "DMA-694", dma_rank: 194, incentive_budget_cents: 500000 }
              as: FieldTechnician
              captures: { b1: "$.data.error_id" }
            - call: "POST /meters"
              payload: { household_id: "00000000-0000-0000-0000-000000000000", meter_type: "TV_TUNER", serial_no: "MT-002093" }
              as: PanelOperationsManager
              captures: { b2: "$.data.error_id" }
            - call: "POST /edit-rule-sets"
              payload: { label: "RS-C81", missing_interval_ascription_minutes: 60, invalid_tuning_max_minutes: 900, outlier_household_minutes_cap: 1200, outlier_weight_ratio_cap: 2.5, fault_missing_minutes_threshold: 1440 }
              as: PanelOperationsManager
              captures: { b3: "$.data.error_id" }
            - call: "POST /clients"
              payload: { name: "Not Mine Either", tier: "BASIC", contract_market_ids: [] }
              as: GovernanceDirector
              captures: { b4: "$.data.error_id" }
            - call: "POST /methodology-changes"
              payload: { title: "Not my job", target_edit_rule_set_id: "00000000-0000-0000-0000-000000000000", proposed_edit_rule_set_id: "00000000-0000-0000-0000-000000000000", affected_market_ids: [] }
              as: ClientServiceRep
              captures: { b5: "$.data.error_id" }
            - call: "POST /accreditation-audits"
              payload: { market_id: "00000000-0000-0000-0000-000000000000", scope_edit_rule_set_id: "00000000-0000-0000-0000-000000000000", auditor_note: "Self-audit" }
              as: MethodologyStatistician
              captures: { b6: "$.data.error_id" }
            - call: "POST /client-deliverables/00000000-0000-0000-0000-000000000000/request-revision"
              payload: { reason: "On the client's behalf" }
              as: ClientServiceRep
              captures: { b7: "$.data.error_id" }
            - call: "POST /households/00000000-0000-0000-0000-000000000000/enumerations"
              payload: { roster_persons_count: 2, tv_sets_count: 1 }
              as: PanelOperationsManager
              captures: { b8: "$.data.error_id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: FieldTechnician
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: ClientUser
              as_user_id: "some-client-id"
          assert:
            - "Trigger calls 1-8: HTTP 403 with ${b1} == ${b2} == ${b3} == ${b4} == ${b5} == ${b6} == ${b7} == ${b8} == ERR_UNAUTHORIZED - a market write from a technician, a meter write from the ops manager, a rule-set write from the ops manager, a client write from governance, a change from the service rep, an audit from the statistician, a client-side revision request from the service rep and an enumeration from the ops manager"
            - "Trigger calls 2, 5, 6, 7, 8: the ids in path and body are all unresolvable, yet the status is 403 and not 404 - priority 2 precedes priorities 4 and 5"
            - "Trigger calls 9-10: HTTP 200 - the clock endpoint lists all seven roles as shared, so the same callers that were just refused can move the clock"

      - name: confidential_reads_are_rejected_for_client_facing_roles
        claim_type: unauthorized
        grounds:
          - endpoints[GET /tuning-intervals]
          - endpoints[GET /household-weights]
          - roles
        distinguishing_aspect: "Two GET families are restricted to the three roles that need respondent-level data (PanelOperationsManager, MethodologyStatistician, AccreditationAuditor); even the FieldTechnician who installed the meters cannot read the interval stream, while ordinary market reads stay open to all seven."
        test_recipe:
          setup:
            - "An empty database - the role gate at priority 2 is reached before any row is looked up, so empty listings are enough."
          setup_api_calls: []
          trigger:
            - call: "GET /tuning-intervals"
              payload: {}
              as: ClientUser
              as_user_id: "some-client-id"
              captures: { c1: "$.data.error_id" }
            - call: "GET /tuning-intervals"
              payload: {}
              as: FieldTechnician
              captures: { c2: "$.data.error_id" }
            - call: "GET /tuning-intervals/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ClientServiceRep
              captures: { c3: "$.data.error_id" }
            - call: "GET /household-weights"
              payload: {}
              as: ClientServiceRep
              captures: { c4: "$.data.error_id" }
            - call: "GET /household-weights"
              payload: {}
              as: GovernanceDirector
              captures: { c5: "$.data.error_id" }
            - call: "GET /household-weights"
              payload: {}
              as: AccreditationAuditor
            - call: "GET /tuning-intervals"
              payload: {}
              as: PanelOperationsManager
            - call: "GET /markets"
              payload: {}
              as: ClientUser
              as_user_id: "some-client-id"
          assert:
            - "Trigger calls 1-5: HTTP 403 with ${c1} == ${c2} == ${c3} == ${c4} == ${c5} == ERR_UNAUTHORIZED - the ClientUser, FieldTechnician, ClientServiceRep and GovernanceDirector are all outside the confidential-read set, and call 3 returns 403 rather than the 404 its unresolvable id would otherwise earn"
            - "Trigger calls 6-7: HTTP 200 with data.total_count == 0 - the auditor and the ops manager are inside the set"
            - "Trigger call 8: HTTP 200 - market reads are not confidential, so the same ClientUser that was refused in call 1 is served here"

      - name: client_user_cross_client_writes_are_rejected_unauthorized
        claim_type: peer_roles
        grounds:
          - validations[priority 3]
          - roles[ClientUser]
        distinguishing_aspect: "The ClientUser's identity is entity_backed:Client, so authorisation is row-level: the SAME endpoint, the same payload and the same role differ only in the X-User-ID header, and one call is a 403 while the other succeeds. Both endpoints named by priority 3 are probed."
        test_recipe:
          setup:
            - "CHAIN C complete with CODE DMA-695, RANK 195, T 1, B 2000, BUDGET 500000, PERSONS 2, SERIAL MT-002094, LABEL RS-C82, opened by stat-opener-95 and published by stat-publisher-95; the clock reads 2026-08-11T00:00:00Z."
            - "Two STANDARD clients X and Y, both contracted to the run's market."
            - "A DELIVERED custom analysis belonging to X (created, started and delivered by the service rep)."
            - "A NOTIFIED methodology change over the same market, so BOTH clients hold a SENT notification; X's notification id is captured."
          setup_api_calls:
            - call: "GET /processing-runs"
              payload: { state: "PUBLISHED" }
              as: ClientServiceRep
              captures: { run95_id: "$.data[0].id", m95_id: "$.data[0].market_id", rs82_id: "$.data[0].edit_rule_set_id" }
            - call: "POST /clients"
              payload: { name: "Riverbend Media", tier: "STANDARD", contract_market_ids: ["${m95_id}"] }
              as: ClientServiceRep
              captures: { clx_id: "$.data.id" }
            - call: "POST /clients"
              payload: { name: "Crosstown Media", tier: "STANDARD", contract_market_ids: ["${m95_id}"] }
              as: ClientServiceRep
              captures: { cly_id: "$.data.id" }
            - call: "POST /client-deliverables"
              payload: { client_id: "${clx_id}", processing_run_id: "${run95_id}", question: "Reach by daypart", requested_cell_count: 1 }
              as: ClientServiceRep
              captures: { dx_id: "$.data.id" }
            - call: "POST /client-deliverables/${dx_id}/start"
              payload: {}
              as: ClientServiceRep
            - call: "POST /client-deliverables/${dx_id}/deliver"
              payload: { findings_summary: "Daypart reach attached" }
              as: ClientServiceRep
            - call: "POST /edit-rule-sets"
              payload: { label: "RS-C83", missing_interval_ascription_minutes: 66, invalid_tuning_max_minutes: 900, outlier_household_minutes_cap: 1200, outlier_weight_ratio_cap: 2.5, fault_missing_minutes_threshold: 1440 }
              as: MethodologyStatistician
              captures: { rs83_id: "$.data.id" }
            - call: "POST /methodology-changes"
              payload: { title: "Ascription 60 -> 66", target_edit_rule_set_id: "${rs82_id}", proposed_edit_rule_set_id: "${rs83_id}", affected_market_ids: ["${m95_id}"] }
              as: GovernanceDirector
              as_user_id: "gov-drafter-95"
              captures: { ch95_id: "$.data.id", ch95_v: "$.data.version" }
            - call: "POST /methodology-changes/${ch95_id}/impact-analyses"
              payload: { baseline_processing_run_id: "${run95_id}", expected_methodology_change_version: "${ch95_v}" }
              as: GovernanceDirector
              as_user_id: "gov-analyst-95"
            - call: "POST /methodology-changes/${ch95_id}/notify"
              payload: {}
              as: GovernanceDirector
              as_user_id: "gov-drafter-95"
            - call: "GET /client-notifications"
              payload: { methodology_change_id: "${ch95_id}", client_id: "${clx_id}" }
              as: ClientServiceRep
              captures: { nx_id: "$.data[0].id" }
          trigger:
            - call: "POST /client-deliverables/${dx_id}/request-revision"
              payload: { reason: "Please split by county" }
              as: ClientUser
              as_user_id: "${cly_id}"
              captures: { d1: "$.data.error_id" }
            - call: "POST /client-deliverables/${dx_id}/request-revision"
              payload: { reason: "Please split by county" }
              as: ClientUser
              as_user_id: "${clx_id}"
            - call: "POST /client-notifications/${nx_id}/acknowledge"
              payload: {}
              as: ClientUser
              as_user_id: "${cly_id}"
              captures: { d2: "$.data.error_id" }
            - call: "POST /client-notifications/${nx_id}/acknowledge"
              payload: {}
              as: ClientUser
              as_user_id: "${clx_id}"
            - call: "GET /methodology-changes/${ch95_id}"
              payload: {}
              as: GovernanceDirector
          assert:
            - "Trigger call 1: HTTP 403 with ${d1} == ERR_UNAUTHORIZED - Y holds the ClientUser role but the deliverable's client_id is X"
            - "Trigger call 2: HTTP 200 with data.state == REVISION_REQUESTED and data.revision_count == 1 - byte-identical payload, different X-User-ID"
            - "Trigger call 3: HTTP 403 with ${d2} == ERR_UNAUTHORIZED - the same row-level rule guards notifications; Y must acknowledge its OWN notification"
            - "Trigger call 4: HTTP 200 with data.state == ACKNOWLEDGED and data.acknowledged_at == 2026-08-11T00:00:00Z"
            - "Trigger call 5: data.notified_client_count == 2 and data.acknowledged_client_count == 1 - the refused acknowledgement was not counted, so activation is still blocked by priority 58"

      - name: segregation_of_duties_gates_publish_and_finalize_by_user_id
        claim_type: segregation_of_duties
        grounds:
          - validations[priority 44]
          - roles[MethodologyStatistician]
          - roles[AccreditationAuditor]
        distinguishing_aspect: "The role is necessary but not sufficient: the SAME role with the SAME payload succeeds or fails on X-User-ID alone, at two different sites. Rule 44 also outranks the disclosure rule at 63, so a self-finalize of a QUALIFIED outcome with no disclosures reports the duties error and not the disclosure error."
        test_recipe:
          setup:
            - "CHAIN C steps C1..C11 with CODE DMA-696, RANK 196, T 1, B 2000, BUDGET 500000, PERSONS 2, SERIAL MT-002095, LABEL RS-C84, opened by stat-opener-96 - so the run is WEIGHTED and unpublished, and the market's accreditation is untouched (publication is not blocked)."
          setup_api_calls:
            - call: "GET /processing-runs"
              payload: { state: "WEIGHTED" }
              as: MethodologyStatistician
              captures: { run96_id: "$.data[0].id", m96_id: "$.data[0].market_id", rs84_id: "$.data[0].edit_rule_set_id" }
          trigger:
            - call: "POST /processing-runs/${run96_id}/publish"
              payload: {}
              as: MethodologyStatistician
              as_user_id: "stat-opener-96"
              captures: { s1: "$.data.error_id" }
            - call: "POST /processing-runs/${run96_id}/publish"
              payload: {}
              as: MethodologyStatistician
              as_user_id: "stat-publisher-96"
            - call: "POST /accreditation-audits"
              payload: { market_id: "${m96_id}", scope_edit_rule_set_id: "${rs84_id}", auditor_note: "Post-publication review" }
              as: AccreditationAuditor
              as_user_id: "auditor-opener-96"
              captures: { au96_id: "$.data.id" }
            - call: "POST /accreditation-audits/${au96_id}/finalize"
              payload: { outcome: "QUALIFIED", limitation_disclosures: [] }
              as: AccreditationAuditor
              as_user_id: "auditor-opener-96"
              captures: { s2: "$.data.error_id" }
            - call: "POST /accreditation-audits/${au96_id}/finalize"
              payload: { outcome: "QUALIFIED", limitation_disclosures: [] }
              as: AccreditationAuditor
              as_user_id: "auditor-closer-96"
              captures: { s3: "$.data.error_id" }
            - call: "POST /accreditation-audits/${au96_id}/finalize"
              payload: { outcome: "ACCREDITED", limitation_disclosures: [] }
              as: AccreditationAuditor
              as_user_id: "auditor-closer-96"
            - call: "GET /markets/${m96_id}"
              payload: {}
              as: AccreditationAuditor
          assert:
            - "Trigger call 1: HTTP 409 with ${s1} == ERR_SEGREGATION_OF_DUTIES - the operator who opened the run cannot publish it, even though the role is right"
            - "Trigger call 2: HTTP 200 with data.state == PUBLISHED and data.published_by_user_id == stat-publisher-96"
            - "Trigger call 4: HTTP 409 with ${s2} == ERR_SEGREGATION_OF_DUTIES and NOT ERR_DISCLOSURE_REQUIRED - both rules are violated and priority 44 precedes 63"
            - "Trigger call 5: HTTP 422 with ${s3} == ERR_DISCLOSURE_REQUIRED - a different auditor clears rule 44 and now the empty disclosure list on a QUALIFIED outcome is what fails"
            - "Trigger call 6: HTTP 200 with data.state == FINALIZED, data.outcome == ACCREDITED and data.finalized_by_user_id == auditor-closer-96"
            - "Trigger call 7: data.recruitment_posture is back to its ladder value (RESTRICTED, because the single cell is at target 1 with 1 in-tab household so under_target_cell_count == 0), data.open_audit_count == 0, data.accreditation_status == ACCREDITED and data.publication_blocked == false"

  # ===========================================================================
  # SECTION 8 - Cross-cutting complexity layers (§1.1 complexity_profile)
  #
  # One entry per DECLARED layer, in the order they are declared:
  # dual_variant_calculation, cascading_side_effects, version_pinning_on_approval,
  # optimistic_concurrency, rate_threshold_triggers. Layers that §1.8 already
  # drives end-to-end are recorded as stubs pointing at the difficulty instance.
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: dual_variant_layer_weighting_divergence
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
          - calculations[household_base_weight]
        excluded_because:
          difficulty_instance: "dual_variant_calc / design_vs_final_weighting_diverge_on_one_edited_run"
          rationale: "The layer's claim is exactly 'both variants produce expected results on the same data and the delta on switch is correct', which that difficulty instance already drives: it re-weights one EDITED run under DESIGN and then under FINAL, compares both base weights and both projections, and checks that the second weighting replaces rather than accumulates the HouseholdWeight rows."

      - name: dual_variant_layer_compliance_divergence
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
          - calculations[household_compliance_rate]
        excluded_because:
          difficulty_instance: "dual_variant_calc / compliance_rolling_30_vs_run_scoped_diverge_for_one_household"
          rationale: "The second dual-variant calculation is the compliance rate, and its variant-selection claim (ROLLING_30 is a stored snapshot refreshed only at ingest and fault-scan time, RUN_SCOPED is computed inside the weighting pass over the run window) is already driven there for a single household whose two figures differ."

      - name: universe_supersession_cascade_runs_deliverables_and_client_ledger
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
          - state_machines[UniverseEstimate PUBLISHED -> SUPERSEDED]
          - endpoints[POST /universe-estimates/{universe_estimate_id}/publish]
        distinguishing_aspect: "A four-level chain fired by a single publish - vintage -> run -> deliverable -> client ledger - where level 2 is CONDITIONAL (the terminal PUBLISHED run of the same market, pinned to the very vintage being superseded, is not touched) and level 3 is conditional on level 2 (the deliverable of the untouched run keeps its state). The chain is then walked back: repin does NOT lift the hold, release refuses until the run publishes again, and because the deliverable was HELD at publication time it never receives the due_at that publication stamps on SCHEDULED rows."
        test_recipe:
          setup:
            - "CHAIN C complete with CODE DMA-698, RANK 198, T 1, B 2000, BUDGET 500000, PERSONS 2, SERIAL MT-002097, LABEL RS-C87, opened by stat-opener-98 and published by stat-publisher-98; clock 2026-08-11T00:00:00Z, vintage 2026Q3 published at 2026-08-01T00:00:00Z."
            - "One STANDARD client (tier_base_fee_cents 65000) contracted to the market."
            - "The clock moved to 2026-08-30T00:00:00Z so a second vintage clears VINTAGE_MIN_GAP_DAYS (29 whole days elapsed)."
            - "A second run of the same market over the disjoint window 2026-08-12 -> 2026-08-13, left OPEN, with one ingested interval inside that window."
            - "A SCHEDULED_DATASET placement against the OPEN run, a CUSTOM_ANALYSIS against the PUBLISHED run, and a DRAFT 2026Q4 vintage whose effective range covers both windows."
          setup_api_calls:
            - call: "GET /processing-runs"
              payload: { state: "PUBLISHED" }
              as: MethodologyStatistician
              captures: { runpub98: "$.data[0].id", m98_id: "$.data[0].market_id", ue1_98: "$.data[0].universe_estimate_id", rs87_id: "$.data[0].edit_rule_set_id" }
            - call: "GET /quota-cells"
              payload: { market_id: "${m98_id}" }
              as: MethodologyStatistician
              captures: { c98_id: "$.data[0].id" }
            - call: "GET /households"
              payload: { market_id: "${m98_id}" }
              as: FieldTechnician
              captures: { h98_id: "$.data[0].id" }
            - call: "GET /meters"
              payload: { household_id: "${h98_id}" }
              as: FieldTechnician
              captures: { mt98_id: "$.data[0].id" }
            - call: "POST /clients"
              payload: { name: "Northgate Media", tier: "STANDARD", contract_market_ids: ["${m98_id}"] }
              as: ClientServiceRep
              captures: { clz98: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-30T00:00:00Z" }
              as: MethodologyStatistician
            - call: "GET /markets/${m98_id}"
              payload: {}
              as: MethodologyStatistician
              captures: { mv98_a: "$.data.version" }
            - call: "POST /processing-runs"
              payload: { market_id: "${m98_id}", universe_estimate_id: "${ue1_98}", edit_rule_set_id: "${rs87_id}", window_start_iso: "2026-08-12T00:00:00Z", window_end_iso: "2026-08-13T00:00:00Z", expected_market_version: "${mv98_a}" }
              as: MethodologyStatistician
              as_user_id: "stat-opener-98"
              captures: { runopen98: "$.data.id" }
            - call: "POST /tuning-intervals"
              payload: { meter_id: "${mt98_id}", source_methodology: "INHOME_TUNER", start_iso: "2026-08-12T18:00:00Z", end_iso: "2026-08-12T23:50:00Z", station_code: "WXYZ", tuning_minutes: 350 }
              as: MethodologyStatistician
            - call: "POST /clients/${clz98}/scheduled-deliverables"
              payload: { processing_run_id: "${runopen98}", requested_cell_count: 0 }
              as: ClientServiceRep
              captures: { d1_98: "$.data.id" }
            - call: "POST /client-deliverables"
              payload: { client_id: "${clz98}", processing_run_id: "${runpub98}", question: "Weekly reach", requested_cell_count: 0 }
              as: ClientServiceRep
