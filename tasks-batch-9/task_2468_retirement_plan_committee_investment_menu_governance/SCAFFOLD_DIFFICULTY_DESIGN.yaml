      - name: provider_cost_tier_and_rfp_edges_at_2500_2501_6000_6001_and_pct_75
        grounds:
          - calculations.total_provider_cost_bps
          - state_machines.ServiceProviderEngagement.PENDING_to_ACTIVE
          - state_machines.ServiceProviderEngagement.ACTIVE_to_UNDER_RFP
          - entities.ServiceProviderEngagement.fields.benchmark_percentile
          - entities.ServiceProviderEngagement.fields.gross_cost_bps
          - entities.ServiceProviderEngagement.fields.total_cost_bps
          - entities.ServiceProviderEngagement.fields.fee_credit_tier
          - entities.ServiceProviderEngagement.fields.last_rfp_quarter_index
          - entities.Plan.fields.total_plan_assets_cents
          - validations[priority=90]
        distinguishing_aspect: |
          With total_plan_assets_cents pinned to 180000000 and 180 participants, a per_head_fee_cents of
          1 adds exactly 0.01 bps, so six engagements land on gross 25.00 (TIER_A) versus 25.01 (TIER_B)
          and total 60.00 (no RFP) versus 60.01 (RFP), while benchmark_percentile 75 triggers and 74 does
          not, and a NULL last_rfp_quarter_index triggers on its own.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; Plan.fiscal_quarter_index 0, participant_account_count 180."
            - "One ACTIVE fund with plan_assets_cents 180000000 seated in the US_LARGE_CAP slot, so Plan.total_plan_assets_cents == 180000000 and the priority 90 divisor-sanity check (ERR_NO_PLAN_ASSETS) cannot fire."
            - "Plan.revenue_credit_balance_cents == 0, so PASS B records a tier but forces offset_bps to 0.00."
            - "Six PENDING engagements in three provider roles with disjoint calendar-year terms (2026 and 2027) so no pair overlaps."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanSponsorAdmin
            - call: "POST /governance/plans"
