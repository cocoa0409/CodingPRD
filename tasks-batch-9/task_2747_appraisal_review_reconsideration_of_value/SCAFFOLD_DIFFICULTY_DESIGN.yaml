  - rule_id: boundary_precision_check
    instances:
      - name: escalation_completion_lands_ltv_exactly_on_no_impact_bound
        grounds:
          - calculations.ltv_and_decision_impact
          - entities.LoanFile.fields.ltv_bps
          - entities.LoanFile.fields.effective_value_cents
          - entities.ValueRevision.fields.delta_bps
          - endpoints.POST_escalation_orders_id_complete
        distinguishing_aspect: |
          Metric under test: ltv_bps against the INCLUSIVE LTV_NO_IMPACT_BPS bound of 8000, driven
          through POST /escalation-orders/{id}/complete. The revised value moves the loan from
          8333 bps (PRICING_ADJUSTMENT) to exactly 8000 bps, which must classify as NO_IMPACT --
          an off-by-one in the comparison direction would report PRICING_ADJUSTMENT. The
          PURCHASE min() clause is also exercised at its tie point: current value equals the
          contract price exactly.
        test_recipe:
          setup:
            - "Clock at its default 2026-08-01T00:00:00Z."
            - "AMC (default budget) with two ACTIVE panel appraisers: A authors, B takes the field review."
            - "PURCHASE loan file, HIGH risk tier, contract_price_cents 50000000 and loan_amount_cents 40000000."
            - "Appraisal by A reports 48000000 with 8 sections, 1 exhibit, and three CLOSED comparables whose adjusted prices are 47000000, 48000000 and 49000000; per-comparable division by 3 then summation gives an indicated value of exactly 48000000, so the reconciliation check passes with variance 0."
            - "Completeness is 8286 (thin exhibits), no rule check fails, one WARN, PRELIMINARY 8086, FINAL 8086 -- inside the HIGH tier FIELD_REVIEW band."
            - "Before the completion the loan already stands at 10000 * 40000000 / 48000000 = 8333 bps, i.e. PRICING_ADJUSTMENT."
            - "The desk review is submitted and ESCALATEd; the FIELD_REVIEW order is assigned to B with hours_remaining exactly 72.0, so cost is 45000 with no rush and no discount."
          setup_api_calls:
            - call: "POST /appraisal-desk/amcs"
              payload: { name: "Summit Appraisal Management" }
              as: ChiefAppraiser
              as_user_id: "chief_user_1"
              captures: { amc1_id: $.data.id }
            - call: "POST /appraisal-desk/appraisers"
              payload: { full_name: "Alice Author", license_number: "CA-AL-6001", license_state: "CA" }
