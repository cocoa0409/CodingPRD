            - "after the first conclusion Seller.${seller_id}.standalone_strike_points == 25.15, cluster_strike_points == 25.15 and status == UNDER_INVESTIGATION (25.15 >= 25.00)"
            - "GET /brand-protection/cases?seller_id=${seller_id} reports total_count 1 with case_status OPEN, correspondence_status NONE, litigation_status NONE and originating_takedown_id null"
            - "after the second conclusion both variants read 50.30 and the status is still UNDER_INVESTIGATION (50.30 < 60.00)"
            - "GET /brand-protection/cases?seller_id=${seller_id} still reports total_count 1 (the live case suppresses a second auto-create)"
            - "after the third conclusion both variants read 75.45 and the status is BLOCKED (75.45 >= 60.00)"
            - "all three investigations end DIVERSION_CONFIRMED with concluded_at == 2026-08-05T08:00:00Z"

      - name: five_level_removal_cascade_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
          - state_machines.TakedownSubmission
        excluded_because:
          difficulty_instance: "transitive_cascade / second_removal_cascades_five_levels_into_an_auto_created_case"
          rationale: "The deepest chain in the domain — decision -> listing -> claim -> strike recomputation -> escalation -> auto-created case — is asserted level by level in that §1.8 instance; §1.9 covers only the shallower suspension and dismissal cascades so the two sections do not duplicate the same chain."

      - name: both_strike_variants_diverge_on_the_same_evidence
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
          - calculations.seller_strike_points
        excluded_because:
          difficulty_instance: "dual_variant_calc / seller_standalone_and_cluster_strike_variants_diverge_after_alias_link"
          rationale: "That §1.8 instance already pins both variants and the delta on the switch for the strike calculation; the §1.9 calculations section instead covers the other dual-variant pair (PRELIMINARY versus FULL substantiation), so both layers stay covered without repetition."

  - section: consistency_model
    instances:
      - name: the_mutating_response_already_carries_the_ledger_effect
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /brand-protection/claims/{claimId}/test-buys]
          - calculations.test_buy_billable_total
        distinguishing_aspect: "Consistency is immediate, so the test-buy create response itself already carries the derived fee breakdown (subtotal 5500, rate 0.12, fee 660, billable 6160) and the very next read of the brand shows enforcement_spend_cents 6160 with a bumped version — nothing is deferred to a sweep or a re-read."
        test_recipe:
          setup:
            - "A FLAGGED COUNTERFEIT listing with a DRAFT claim on a brand whose ledger reads 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: BrandAdministrator
            - call: "POST /brand-protection/brands"
              payload: { name: "Acme Tools", owner_legal_entity: "Acme Tools LLC", home_jurisdiction: "US", authorized_msrp_cents: 10000, enforcement_budget_cents: 500000 }
              as: BrandAdministrator
              captures: { brand_id: $.data.id }
            - call: "POST /brand-protection/trademark-registrations"
              payload: { brand_id: "${brand_id}", registration_number: "US-4455667", jurisdiction: "US", nice_class: 8, registration_date: "2024-03-15", expiry_date: "2034-03-15", principal_register: true, status: "REGISTERED" }
              as: BrandAdministrator
              captures: { reg_id: $.data.id }
            - call: "POST /brand-protection/sellers"
              payload: { marketplace_code: "AMZ", seller_ref: "A1SELLER", legal_name: "Shenzhen Trading Co", jurisdiction: "CN" }
              as: EnforcementAnalyst
              captures: { seller_id: $.data.id }
            - call: "POST /brand-protection/listings"
              payload: { brand_id: "${brand_id}", seller_id: "${seller_id}", marketplace_code: "AMZ", listing_ref: "B0ACME001", title_text: "ACME 8-inch adjustable wrench", image_hash: "IMGHASH1", price_cents: 3000, nice_class: 8 }
              as: EnforcementAnalyst
              captures: { listing_id: $.data.id }
            - call: "POST /brand-protection/listings/${listing_id}/screen"
              payload: { image_match_score: 0.92, text_match_score: 0.88 }
              as: EnforcementAnalyst
            - call: "POST /brand-protection/claims"
              payload: { brand_id: "${brand_id}", listing_id: "${listing_id}", asserted_registration_id: "${reg_id}", claimed_violation_type: "COUNTERFEIT" }
              as: EnforcementAnalyst
              captures: { claim_id: $.data.id }
            - call: "GET /brand-protection/brands/${brand_id}"
              as: EnforcementAnalyst
              captures: { brand_v_before: $.data.version }
          trigger:
            - call: "POST /brand-protection/claims/${claim_id}/test-buys"
              payload: { order_ref: "TB-1", purchase_price_cents: 3000, shipping_cents: 500, lab_fee_cents: 2000 }
              as: EnforcementAnalyst
              captures: { tb_id: $.data.id }
            - call: "GET /brand-protection/brands/${brand_id}"
              as: EnforcementAnalyst
          assert:
            - "the create response itself reports subtotal_cents 5500, service_fee_rate 0.12, service_fee_cents 660 and billable_total_cents 6160 — no second read is needed to see the derived fields"
            - "the create response reports status ORDERED, ordered_at 2026-08-05T09:00:00Z and seller_id == ${seller_id} copied from the claim's listing"
            - "the immediately following brand read shows enforcement_spend_cents == 6160 and version == ${brand_v_before} + 1"
            - "MonitoredListing.${listing_id}.match_score is still 0.8620 and the claim is still DRAFT (ordering a buy advances neither)"

  - section: errors
    instances:
      - name: unknown_path_ids_return_each_entitys_own_not_found_code
        claim_type: Not Found
        grounds:
          - validations[priority=4]
          - errors[ERR_REGISTRATION_NOT_FOUND]
          - errors[ERR_ENROLLMENT_NOT_FOUND]
          - errors[ERR_CLAIM_NOT_FOUND]
          - errors[ERR_TEST_BUY_NOT_FOUND]
          - errors[ERR_TAKEDOWN_NOT_FOUND]
          - errors[ERR_COUNTER_NOTICE_NOT_FOUND]
          - errors[ERR_CASE_NOT_FOUND]
          - errors[ERR_CUSTOMS_RECORDATION_NOT_FOUND]
          - errors[ERR_INVESTIGATION_NOT_FOUND]
        distinguishing_aspect: "Each detail read owns a distinct 404 code, so a single unknown UUID walked across nine resources must produce nine different error_ids in the error envelope — never a generic not-found and never an empty 200."
        test_recipe:
          setup:
            - "The database is empty apart from the pinned clock, so every id below names no row"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: BrandAdministrator
          trigger:
            - call: "GET /brand-protection/trademark-registrations/99999999-9999-4999-8999-999999999999"
              as: BrandAdministrator
              captures: { err1: $.data.error_id }
            - call: "GET /brand-protection/enrollments/99999999-9999-4999-8999-999999999999"
              as: BrandAdministrator
              captures: { err2: $.data.error_id }
            - call: "GET /brand-protection/claims/99999999-9999-4999-8999-999999999999"
              as: EnforcementAnalyst
              captures: { err3: $.data.error_id }
            - call: "GET /brand-protection/test-buys/99999999-9999-4999-8999-999999999999"
              as: EnforcementAnalyst
              captures: { err4: $.data.error_id }
            - call: "GET /brand-protection/takedowns/99999999-9999-4999-8999-999999999999"
              as: MarketplaceLiaison
              captures: { err5: $.data.error_id }
            - call: "GET /brand-protection/counter-notices/99999999-9999-4999-8999-999999999999"
              as: MarketplaceLiaison
              captures: { err6: $.data.error_id }
            - call: "GET /brand-protection/cases/99999999-9999-4999-8999-999999999999"
              as: LegalCounsel
              captures: { err7: $.data.error_id }
            - call: "GET /brand-protection/customs-recordations/99999999-9999-4999-8999-999999999999"
              as: CustomsCoordinator
              captures: { err8: $.data.error_id }
            - call: "GET /brand-protection/diversion-investigations/99999999-9999-4999-8999-999999999999"
              as: CustomsCoordinator
              captures: { err9: $.data.error_id }
          assert:
            - "every call returns HTTP 404 with response_type == error and a null-free error envelope carrying error_id and message"
            - "the nine error_ids are exactly ERR_REGISTRATION_NOT_FOUND, ERR_ENROLLMENT_NOT_FOUND, ERR_CLAIM_NOT_FOUND, ERR_TEST_BUY_NOT_FOUND, ERR_TAKEDOWN_NOT_FOUND, ERR_COUNTER_NOTICE_NOT_FOUND, ERR_CASE_NOT_FOUND, ERR_CUSTOMS_RECORDATION_NOT_FOUND and ERR_INVESTIGATION_NOT_FOUND in that order"
            - "no call returns 200 with an empty data object and no call returns ERR_INVALID_REQUEST for the id format"

      - name: body_fk_lookups_report_the_registration_and_enrollment_not_found_codes
        claim_type: Not Found
        grounds:
          - validations[priority=5]
          - errors[ERR_REGISTRATION_NOT_FOUND]
          - errors[ERR_ENROLLMENT_NOT_FOUND]
        distinguishing_aspect: "Body foreign keys resolve in the endpoint's declared input order and report the referenced entity's own 404: an unknown asserted_registration_id on a claim is ERR_REGISTRATION_NOT_FOUND even though the listing is real, and an unknown enrollment_id on a takedown is ERR_ENROLLMENT_NOT_FOUND — it is first in that input list, so it wins over the equally unknown claim_id and evidence_package_id."
        test_recipe:
          setup:
            - "A brand, a seller and one never-screened listing (the FK checks run long before the FLAGGED gate)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: BrandAdministrator
            - call: "POST /brand-protection/brands"
              payload: { name: "Acme Tools", owner_legal_entity: "Acme Tools LLC", home_jurisdiction: "US", authorized_msrp_cents: 10000, enforcement_budget_cents: 500000 }
              as: BrandAdministrator
              captures: { brand_id: $.data.id }
            - call: "POST /brand-protection/sellers"
              payload: { marketplace_code: "AMZ", seller_ref: "A1SELLER", legal_name: "Shenzhen Trading Co", jurisdiction: "CN" }
              as: EnforcementAnalyst
              captures: { seller_id: $.data.id }
            - call: "POST /brand-protection/listings"
              payload: { brand_id: "${brand_id}", seller_id: "${seller_id}", marketplace_code: "AMZ", listing_ref: "B0ACME001", title_text: "ACME 8-inch adjustable wrench", image_hash: "IMGHASH1", price_cents: 0, nice_class: 8 }
              as: EnforcementAnalyst
              captures: { listing_id: $.data.id }
          trigger:
            - call: "POST /brand-protection/claims"
              payload: { brand_id: "${brand_id}", listing_id: "${listing_id}", asserted_registration_id: "99999999-9999-4999-8999-999999999999", claimed_violation_type: "TRADEMARK" }
              as: EnforcementAnalyst
              captures: { err1: $.data.error_id }
            - call: "POST /brand-protection/takedowns"
              payload: { enrollment_id: "99999999-9999-4999-8999-999999999999", claim_id: "88888888-8888-4888-8888-888888888888", evidence_package_id: "77777777-7777-4777-8777-777777777777" }
              as: EnforcementAnalyst
              captures: { err2: $.data.error_id }
          assert:
            - "the claim create returns HTTP 404 with data.error_id == ERR_REGISTRATION_NOT_FOUND and not ERR_LISTING_NOT_FLAGGED"
            - "GET /brand-protection/claims?brand_id=${brand_id} returns total_count 0"
            - "the takedown create returns HTTP 404 with data.error_id == ERR_ENROLLMENT_NOT_FOUND, not ERR_CLAIM_NOT_FOUND or ERR_EVIDENCE_PACKAGE_NOT_FOUND"
            - "MonitoredListing.${listing_id}.monitor_status is still NEW with match_score null"

      - name: submit_by_a_designation_outside_its_window_returns_not_effective
        claim_type: Violation → Error
        grounds:
          - validations[priority=30]
          - errors[ERR_REPRESENTATIVE_NOT_EFFECTIVE]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / takedown_submit_gated_on_the_designations_own_effective_window"
          rationale: "That §1.8 instance triggers ERR_REPRESENTATIVE_NOT_EFFECTIVE from both directions — a not-yet-effective window and a revoked designation — on the takedown submit endpoint, which is the only place the code can arise; a §1.9 copy would repeat it verbatim."

      - name: cease_desist_before_escalation_returns_seller_not_under_investigation
        claim_type: Violation → Error
        grounds:
          - validations[priority=42]
          - errors[ERR_SELLER_NOT_UNDER_INVESTIGATION]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / cease_desist_gated_on_a_cluster_rollup_of_a_seller_the_case_never_names"
          rationale: "The cited §1.8 instance drives the seller across the 25.00 escalation boundary through a cluster rollup and asserts the code on both sides of it, fully covering the error's only trigger."

      - name: second_test_buy_inside_the_cooling_interval_returns_cooling_period
        claim_type: Violation → Error
        grounds:
          - validations[priority=72]
          - errors[ERR_TEST_BUY_COOLING_PERIOD]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / test_buy_cooling_interval_is_closed_so_exactly_seven_days_still_collides"
          rationale: "The §1.8 interval instance already asserts the closed-interval boundary (exactly 7 days collides, 7 days plus one second does not) plus the cancelled-buy exclusion, which is the whole behaviour of this error."

      - name: test_buy_beyond_the_enforcement_budget_returns_budget_exceeded
        claim_type: Violation → Error
        grounds:
          - validations[priority=80]
          - errors[ERR_TEST_BUY_BUDGET_EXCEEDED]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / dismissed_claim_state_error_outranks_exhausted_budget_on_test_buy"
          rationale: "That §1.8 instance both proves the 402 is reachable on an exhausted budget and pins its priority against ERR_INVALID_STATE, so the fiscal rule needs no separate §1.9 instance."

      - name: a_second_counter_notice_on_one_takedown_returns_duplicate
        claim_type: Violation → Error
        grounds:
          - validations[priority=65]
          - errors[ERR_DUPLICATE_COUNTER_NOTICE]
        excluded_because:
          difficulty_instance: "compensating_invariant / rebutted_counter_notice_closes_the_cycle_without_double_counting_the_strike"
          rationale: "The cited §1.8 instance files a counter notice, resolves it REBUTTED and then shows a second notice on the same takedown returning ERR_DUPLICATE_COUNTER_NOTICE, which is the error's only trigger path."
