      - name: cylinder_set_retest_loop_met_then_not_met_then_met
        grounds:
          - state_machines.CylinderSet.RELEASE_MET_to_RELEASE_NOT_MET
          - state_machines.CylinderSet.RELEASE_NOT_MET_to_RELEASE_MET
          - calculations.cylinder_set_qualified_strength
          - entities.CylinderSet.fields.status
        distinguishing_aspect: |
          CylinderSet is the third non-linear machine and sits on yet another entity: a 4-specimen
          set walks RELEASE_MET (3500) -> RELEASE_NOT_MET (3400) -> RELEASE_MET (3500) as breaks
          arrive, because each new break re-derives the outlier band and can re-admit or re-discard
          earlier specimens.
        test_recipe:
          setup:
            - "Mix M40-STD is QUALIFIED with required_release_psi 3500."
            - "Run R1 is SCHEDULED on bed B1 - it is never cast, so no BedRun cascade can interfere with the set's own loop."
            - "R1 carries one CylinderSet with purpose RELEASE and specimen_count 4, status CAST."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /mix-designs"
