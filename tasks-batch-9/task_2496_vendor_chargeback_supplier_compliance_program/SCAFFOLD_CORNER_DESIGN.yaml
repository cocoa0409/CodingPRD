              captures: { r_id: $.data.id }
            - call: "POST /compliance/routing-guides/${g_id}/publish"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /compliance/purchase-orders"
              payload: { vendor_id: "${v_id}", po_number: "PO-1", ordered_units: 1000, unit_cost_cents: 500, ship_window_start: "2026-08-06T00:00:00Z", ship_window_end: "2026-08-09T00:00:00Z", must_arrive_by: "2026-08-10T00:00:00Z" }
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { po_id: $.data.id }
            - call: "POST /compliance/purchase-orders/${po_id}/shipments"
              payload: { asn_number: "ASN-1", shipped_units: 1000, carton_count: 40 }
              as: Vendor
              as_user_id: "${v_id}"
              captures: { s_id: $.data.id }
            - call: "POST /compliance/shipments/${s_id}/receive"
              payload: { received_units: 1000 }
              as: DCInspector
              as_user_id: "insp-1"
            - call: "POST /compliance/shipments/${s_id}/violations"
              payload: { requirement_id: "${r_id}", affected_units: 100, affected_cartons: 4, narrative: "Unreadable labels on four cartons." }
              as: DCInspector
              as_user_id: "insp-1"
              captures: { vio_id: $.data.id }
          trigger:
            - call: "POST /compliance/violations/${vio_id}/assess"
              payload: { assessment_note: "Label scan failures confirmed." }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cb_id: $.data.id, gross: $.data.gross_assessed_cents, outstanding: $.data.outstanding_cents }
            - call: "GET /compliance/violations/${vio_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { vio_status: $.data.status }
            - call: "GET /compliance/vendors/${v_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { open_cents: $.data.open_chargeback_cents }
          assert:
            - "First trigger call returns HTTP 201 with $.data.gross_assessed_cents == 38000 in the SAME response body"
            - "$.data.outstanding_cents == 38000 and $.data.settlement_status == ASSESSED in that same body"
            - "$.data.dispute_status == NONE in that same body"
            - "$.data.evidence_at_assessment_count == 0 in that same body"
            - "Second trigger call returns $.data.status == CHARGED with no delay or retry"
            - "Third trigger call returns $.data.open_chargeback_cents == 38000 and $.data.exposure_alert_flag == false"
            - "Chargeback.${cb_id}.assessed_at == 2026-08-10T00:00:00Z"
