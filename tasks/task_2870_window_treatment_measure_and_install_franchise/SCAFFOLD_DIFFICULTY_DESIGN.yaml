      - name: quote_acceptance_cascades_three_hops_into_a_queued_lead_promotion
        grounds:
          - state_machines.Quote.PRESENTED_to_ACCEPTED
          - state_machines.Lead.ROUTED_to_CONVERTED
          - state_machines.Lead.QUEUED_to_ROUTED
          - state_machines.Lead.NEW_to_QUEUED
          - calculations.territory_lead_routing
          - entities.Territory.fields.open_leads_count
        distinguishing_aspect: |
          Cascade of depth THREE through the CAPACITY graph rather than the money graph:
          Quote -> Lead CONVERTED -> Territory.open_leads_count decrement -> a different
          Lead promoted QUEUED -> ROUTED. Unlike the four-hop exception cascade it changes
          no state machine of the acting entity's own subtree and must promote exactly ONE
          of the two waiting leads, leaving the second queued.
