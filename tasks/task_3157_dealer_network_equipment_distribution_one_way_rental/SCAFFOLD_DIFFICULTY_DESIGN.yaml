            - call: "POST /rental-network/reservations"
              payload: { customer_id: "${cust_a}", origin_dealer_id: "${dealer_a}", dest_location_id: "${loc_b}", equipment_type: "TRUCK_10FT", rental_kind: "ONE_WAY", pickup_date: "2026-11-10T10:00:00Z", dropoff_date: "2026-11-11T10:00:00Z" }
              as: Customer
              as_user_id: "${cust_a}"
              captures: { rsv_a: $.data.id, rsv_a_v: $.data.version }
            - call: "POST /rental-network/reservations/${rsv_a}/confirm"
              payload: { expected_reservation_version: "${rsv_a_v}" }
              as: Customer
