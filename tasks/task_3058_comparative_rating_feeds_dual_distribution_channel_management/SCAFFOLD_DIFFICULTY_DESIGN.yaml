  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: quote_rerate_cycle_and_referral_loop_on_quote
        grounds:
          - state_machines.Quote.QUOTED_to_DRAFT
          - state_machines.Quote.AGENT_QUOTED_to_REFERRED_TO_AGENT
          - state_machines.Quote.QUOTED_to_REFERRED_TO_AGENT
        distinguishing_aspect: |
          Entity: Quote — a cyclic machine: DRAFT -> QUOTED -> DRAFT (re-rate
          loop) and the referral loop QUOTED -> REFERRED_TO_AGENT ->
          AGENT_QUOTED -> REFERRED_TO_AGENT (agent re-rate preserves the
          referral instead of collapsing to DRAFT). Two full cycles leave the
          quote bindable with correct premium.
        test_recipe:
          setup:
            - "Logical clock 2026-01-01T00:00:00Z. P-AUTO ACTIVE (BOTH; LIABILITY BASIC 50000; direct_discount 0.10; agent_load 0.15; min 40000). Feed published. Agent A APPOINTED (TX, AUTO). Consumer C6."
