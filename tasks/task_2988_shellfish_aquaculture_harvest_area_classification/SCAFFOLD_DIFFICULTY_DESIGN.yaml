      - name: lease_revision_cycle_returns_to_under_review_with_cleared_flags_reset
        grounds:
          - state_machines.Lease.UNDER_REVIEW_to_REVISION_REQUESTED
          - state_machines.Lease.REVISION_REQUESTED_to_UNDER_REVIEW
          - entities.Lease.fields.navigation_clearance
          - entities.Lease.fields.environmental_clearance
          - entities.Lease.fields.revision_round
          - validations[priority=67]
        distinguishing_aspect: |
          CYCLIC shape with state-clearing re-entry: the lease returns to a state it already occupied
          (UNDER_REVIEW) but not to the same configuration -- revision_round advances 0 -> 1 and both
          clearance fields are forced back to PENDING with both reviewer ids nulled, so the previously
          recorded environmental OBJECTION and navigation CLEARED are both erased by the re-entry.
        test_recipe:
          setup:
            - "Logical clock parked at 2026-08-01T00:00:00Z; GrowingArea GA-114 APPROVED."
            - "Lease L-2988-01 held by op-1 submitted once (revision_round 0)."
            - "navigation-review CLEARED recorded by rev-nav-1, then environmental-review OBJECTION recorded by rev-env-1."
            - "Because an environmental objection invalidates the navigation finding, the lease sits in REVISION_REQUESTED with navigation_clearance PENDING (reviewer id nulled) and environmental_clearance OBJECTION (reviewer rev-env-1)."
          setup_api_calls:
            - call: "POST /shellfish/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas"
              payload: { code: "GA-114", water_body: "Pamlico Sound", rainfall_closure_threshold_in: 1.0, rainfall_closure_hours: 96, reopen_sample_count_required: 3, clean_sample_mpn_limit: 14.0, conditional_management_plan_on_file: false }
              as: ShellfishControlAuthority
              captures: { area: $.data.id }
            - call: "POST /shellfish/leases"
              payload: { growing_area_id: "${area}", lease_code: "L-2988-01", requested_acreage: 5.0, plot_codes: ["P1", "P2", "P3"], gear_types_permitted: ["BOTTOM", "RACK_AND_BAG"], authorized_gear_units: 200 }
              as: FarmOperator
              as_user_id: "op-1"
              captures: { lease: $.data.id }
            - call: "POST /shellfish/leases/${lease}/submit"
              payload: { submission_note: "initial siting package" }
              as: FarmOperator
              as_user_id: "op-1"
            - call: "POST /shellfish/leases/${lease}/navigation-review"
              payload: { decision: "CLEARED", review_note: "outside the marked channel" }
              as: SitingReviewer
              as_user_id: "rev-nav-1"
            - call: "POST /shellfish/leases/${lease}/environmental-review"
              payload: { decision: "OBJECTION", review_note: "footprint overlaps SAV" }
              as: SitingReviewer
              as_user_id: "rev-env-1"
          trigger:
            - call: "POST /shellfish/leases/${lease}/submit"
              payload: { submission_note: "footprint moved 40 m east" }
              as: FarmOperator
              as_user_id: "op-1"
          assert:
            - "Before the trigger Lease.${lease}.status == REVISION_REQUESTED, navigation_clearance == PENDING, navigation_reviewer_user_id == null, environmental_clearance == OBJECTION, environmental_reviewer_user_id == rev-env-1, revision_round == 0"
            - "After the trigger Lease.${lease}.status == UNDER_REVIEW"
            - "After the trigger Lease.${lease}.revision_round == 1"
            - "After the trigger Lease.${lease}.navigation_clearance == PENDING and Lease.${lease}.environmental_clearance == PENDING"
            - "After the trigger Lease.${lease}.navigation_reviewer_user_id == null and Lease.${lease}.environmental_reviewer_user_id == null"
            - "Lease.${lease}.decided_at == null and Lease.${lease}.operator_user_id == op-1"
            - "The re-entry into UNDER_REVIEW is not idempotent with the first entry: revision_round is 1 rather than 0, and MAX_REVISION_ROUNDS 3 caps this cycle"
