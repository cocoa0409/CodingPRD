              as: SalesCounselor
              captures: { e_site: $.data.error_id }
          assert:
            - "the second contract is rejected with http 409 and error_id ERR_HOME_SITE_NOT_AVAILABLE"
            - "HomeSite.${hs1}.home_site_status == UNDER_CONTRACT, set by the first contract's creation"
