  # ---------------------------------------------------------------- Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: confirm_requires_aircraft_available
        grounds:
          - state_machines.AircraftAssignment.TENTATIVE_to_CONFIRMED
          - state_machines.Aircraft.AVAILABLE_to_MAINTENANCE_HOLD
        distinguishing_aspect: |
          Entity pair AircraftAssignment -> Aircraft: confirm is gated on the
          aircraft's status == AVAILABLE; an aircraft forced into
          MAINTENANCE_HOLD by a clock-activated window makes confirm fail.
        test_recipe:
          setup:
            - "Owner; aircraft N800MW LIGHT_JET ops-listed; clock 2026-08-01T00:00:00Z"
            - "MaintenanceWindow 2026-08-01T00:00:00Z..2026-08-02T00:00:00Z (AOG_REPAIR) PLANNED; clock advanced to 2026-08-01T12:00:00Z -> window ACTIVE, aircraft MAINTENANCE_HOLD"
            - "Trip dep 2026-08-10T10:00:00Z (after window end, so no maintenance conflict), leg REV 60, BOOKED 67500, assignment TENTATIVE"
          setup_api_calls:
            - { call: "POST /charter/aircraft-owners", payload: { name: "Owner M", contact_email: "m@x.com", revenue_share_pct: 80, guarantee_cents_per_block_min: 0 }, as: OpsAdmin, captures: { own_m: $.data.id } }
            - { call: "POST /charter/aircraft", payload: { owner_id: "${own_m}", tail_number: "N800MW", category: "LIGHT_JET", home_base_icao: "KLAX", seats: 8, hourly_rate_cents: 240000, on_ops_spec: true, initial_airframe_minutes: 0, next_check_due_minutes: 60000 }, as: OpsAdmin, captures: { ac_m: $.data.id } }
            - { call: "POST /charter/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /charter/maintenance-windows", payload: { aircraft_id: "${ac_m}", window_type: "AOG_REPAIR", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-02T00:00:00Z" }, as: MaintenanceController, captures: { win_m: $.data.id } }
            - { call: "POST /charter/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T12:00:00Z" }, as: OpsAdmin }
            - { call: "POST /charter/trip-requests", payload: { customer_name: "Cust M", customer_email: "m2@x.com", requested_category: "LIGHT_JET", origin_icao: "KLAX", destination_icao: "KTEB", departure_at: "2026-08-10T10:00:00Z", passenger_count: 0, international: false }, as: SalesAgent, captures: { trip_m: $.data.id } }
            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_m}", seq_no: 1, leg_type: "REVENUE", origin_icao: "KLAX", destination_icao: "KTEB", block_minutes: 60, fuel_stop: false }, as: SalesAgent }
            - { call: "POST /charter/trip-requests/${trip_m}/quote", payload: {}, as: SalesAgent }
            - { call: "POST /charter/trip-requests/${trip_m}/book", payload: { deposit_cents: 67500 }, as: SalesAgent, captures: { trip_m_v: $.data.version } }
            - { call: "POST /charter/aircraft-assignments", payload: { trip_request_id: "${trip_m}", aircraft_id: "${ac_m}", expected_trip_request_version: "${trip_m_v}" }, as: DispatchManager, captures: { asg_m: $.data.id } }
          trigger:
            - { call: "POST /charter/aircraft-assignments/${asg_m}/confirm", payload: {}, as: DispatchManager, captures: { err_m: $.data.error_id } }
          assert:
            - "HTTP 409 with error_id == ERR_AIRCRAFT_NOT_AVAILABLE (aircraft in MAINTENANCE_HOLD blocks the assignment's TENTATIVE -> CONFIRMED transition)"

      - name: dispatch_requires_passengers_cleared
        grounds:
          - state_machines.TripRequest.BOOKED_to_DISPATCHED
          - state_machines.Passenger.PENDING_to_CLEARED
        distinguishing_aspect: |
          Entity pair TripRequest -> Passenger (different pair than
          AircraftAssignment -> Aircraft): dispatch is gated on every manifest
          Passenger's tsa_status; a PENDING (never screened) passenger blocks
          an otherwise fully-valid dispatch.
        test_recipe:
          setup:
            - "Owner + aircraft + PIC crew; clock 2026-08-01T00:00:00Z; trip dep 2026-08-10T10:00:00Z, 1 pax, leg REV 60, booked in full 270000, confirmed, vetted"
            - "Manifest has exactly 1 passenger (count satisfied) but tsa_status == PENDING"
          setup_api_calls:
            - { call: "POST /charter/aircraft-owners", payload: { name: "Owner T", contact_email: "t@x.com", revenue_share_pct: 80, guarantee_cents_per_block_min: 0 }, as: OpsAdmin, captures: { own_t: $.data.id } }
            - { call: "POST /charter/aircraft", payload: { owner_id: "${own_t}", tail_number: "N900TT", category: "LIGHT_JET", home_base_icao: "KLAX", seats: 8, hourly_rate_cents: 240000, on_ops_spec: true, initial_airframe_minutes: 0, next_check_due_minutes: 60000 }, as: OpsAdmin, captures: { ac_t: $.data.id } }
            - { call: "POST /charter/crew-members", payload: { name: "Pic T", base_icao: "KLAX", qualified_categories: ["LIGHT_JET"] }, as: OpsAdmin, captures: { crew_t: $.data.id } }
            - { call: "POST /charter/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /charter/trip-requests", payload: { customer_name: "Cust T", customer_email: "t2@x.com", requested_category: "LIGHT_JET", origin_icao: "KLAX", destination_icao: "KTEB", departure_at: "2026-08-10T10:00:00Z", passenger_count: 1, international: false }, as: SalesAgent, captures: { trip_t: $.data.id } }
            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_t}", seq_no: 1, leg_type: "REVENUE", origin_icao: "KLAX", destination_icao: "KTEB", block_minutes: 60, fuel_stop: false }, as: SalesAgent }
            - { call: "POST /charter/trip-requests/${trip_t}/quote", payload: {}, as: SalesAgent }
            - { call: "POST /charter/trip-requests/${trip_t}/book", payload: { deposit_cents: 67500 }, as: SalesAgent, captures: { trip_t_v: $.data.version } }
            - { call: "POST /charter/payments", payload: { trip_request_id: "${trip_t}", payment_type: "BALANCE", amount_cents: 202500 }, as: SalesAgent }
            - { call: "POST /charter/aircraft-assignments", payload: { trip_request_id: "${trip_t}", aircraft_id: "${ac_t}", expected_trip_request_version: "${trip_t_v}" }, as: DispatchManager, captures: { asg_t: $.data.id } }
            - { call: "POST /charter/aircraft-assignments/${asg_t}/confirm", payload: {}, as: DispatchManager }
            - { call: "POST /charter/crew-assignments", payload: { trip_request_id: "${trip_t}", crew_member_id: "${crew_t}", duty_role: "PIC" }, as: DispatchManager, captures: { ca_t: $.data.id } }
            - { call: "POST /charter/crew-assignments/${ca_t}/vet", payload: {}, as: DispatchManager }
            - { call: "POST /charter/passengers", payload: { trip_request_id: "${trip_t}", full_name: "Pending Pax", date_of_birth: "1990-01-01" }, as: SalesAgent }
          trigger:
            - { call: "POST /charter/trip-requests/${trip_t}/dispatch", payload: {}, as: DispatchManager, captures: { err_t: $.data.error_id } }
          assert:
            - "HTTP 422 with error_id == ERR_TSA_NOT_CLEARED (PENDING passenger blocks dispatch even though every other gate passes)"

      - name: vet_requires_crew_active
        grounds:
          - state_machines.CrewAssignment.PROPOSED_to_VETTED
          - entities.CrewMember.fields.status
        distinguishing_aspect: |
          Entity pair CrewAssignment -> CrewMember (third distinct pair):
          vetting a PROPOSED assignment whose CrewMember was SUSPENDED fails
          with a state error before any duty math runs.
        test_recipe:
          setup:
            - "Crew member (ACTIVE at create); clock 2026-08-01T00:00:00Z; trip QUOTED, leg REV 60; crew assignment PROPOSED"
            - "Crew member then SUSPENDED via PATCH"
          setup_api_calls:
            - { call: "POST /charter/crew-members", payload: { name: "Pic S", base_icao: "KLAX", qualified_categories: ["LIGHT_JET"] }, as: OpsAdmin, captures: { crew_s: $.data.id } }
            - { call: "POST /charter/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /charter/trip-requests", payload: { customer_name: "Cust S", customer_email: "s@x.com", requested_category: "LIGHT_JET", origin_icao: "KLAX", destination_icao: "KTEB", departure_at: "2026-08-10T10:00:00Z", passenger_count: 0, international: false }, as: SalesAgent, captures: { trip_sx: $.data.id } }
            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_sx}", seq_no: 1, leg_type: "REVENUE", origin_icao: "KLAX", destination_icao: "KTEB", block_minutes: 60, fuel_stop: false }, as: SalesAgent }
            - { call: "POST /charter/trip-requests/${trip_sx}/quote", payload: {}, as: SalesAgent }
            - { call: "POST /charter/crew-assignments", payload: { trip_request_id: "${trip_sx}", crew_member_id: "${crew_s}", duty_role: "PIC" }, as: DispatchManager, captures: { ca_sx: $.data.id } }
            - { call: "PATCH /charter/crew-members/${crew_s}", payload: { status: "SUSPENDED" }, as: OpsAdmin, captures: { crew_s_st: $.data.status } }
          trigger:
            - { call: "POST /charter/crew-assignments/${ca_sx}/vet", payload: {}, as: DispatchManager, captures: { err_sx: $.data.error_id } }
          assert:
            - "HTTP 409 with error_id == ERR_INVALID_STATE (crew member SUSPENDED blocks vet)"

  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: aircraft_buffered_overlap_conflict
        grounds:
          - state_machines.AircraftAssignment.TENTATIVE_to_CONFIRMED
          - entities.AircraftAssignment.fields.occupied_start_at
          - validations[priority=9]
        distinguishing_aspect: |
          Resource Aircraft with buffered half-open interval semantics:
          occupied = [departure - 45min, arrival + 45min). Trip2 departing
          13:29 (occupied start 12:44) intersects trip1's 12:45 end ->
          conflict; the companion corner shows 13:30 (12:45 == 12:45) is
          allowed under half-open semantics.
        test_recipe:
          setup:
            - "Owner; aircraft N110OV LIGHT_JET ops-listed; clock 2026-08-01T00:00:00Z"
            - "Trip1 dep 2026-08-10T10:00:00Z, leg REV 120 (arrival 12:00 -> occupied [09:15, 12:45)), quoted 540000, booked 135000, CONFIRMED"
