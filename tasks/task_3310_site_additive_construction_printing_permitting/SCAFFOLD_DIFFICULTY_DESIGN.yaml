          - validations[priority=9]
          - errors.ERR_INVALID_STATE
          - errors.ERR_PERMIT_REVISION_SUPERSEDED
        distinguishing_aspect: |
          Category pair: state (priority 8, ERR_INVALID_STATE) vs business_referential
          (priority 9, ERR_PERMIT_REVISION_SUPERSEDED). A PermitApplication already in
          APPROVED terminal state whose referenced PlanRevision has been VOIDED must,
          on a further decide attempt, surface ERR_INVALID_STATE — the state machine
          rejection at priority 8 wins over the referential check at priority 9.
