              captures: { s_draft: $.data.status, exp_draft: $.data.expired_at }
            - call: "GET /perks/offers/${offer_review}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { s_review: $.data.status, exp_review: $.data.expired_at }
