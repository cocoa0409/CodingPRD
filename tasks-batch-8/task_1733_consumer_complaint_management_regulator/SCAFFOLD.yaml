    output: ResponseTemplate
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/complaint-office/response-templates/{templateId}"
    description: "Get a ResponseTemplate"
    roles: [ComplaintManager, CaseHandler, QAReviewer, ExecutiveReviewer, Auditor]
    code: 200
    input: []
    output: ResponseTemplate
    side_effects: []

  - method: GET
    path: "/complaint-office/response-templates"
    description: "List ResponseTemplates (reverse reachability for ResponseTemplate.channel_code and ResponseTemplate.category_code)"
    roles: [ComplaintManager, CaseHandler, QAReviewer, ExecutiveReviewer, Auditor]
    code: 200
    input: ["channel_code?", "category_code?", "status?", "limit?", "offset?"]
    output: "ResponseTemplate[]"
    side_effects: []

  - method: POST
    path: "/complaint-office/response-templates/{templateId}/publish"
    description: "Publish a DRAFT template; supersedes any ACTIVE template with same (channel_code, category_code)"
    roles: [ComplaintManager]
    code: 200
    input: []
    output: ResponseTemplate
    side_effects:
      - "status -> ACTIVE"
      - "Prior ACTIVE template with same pair -> RETIRED (invariant: at most one ACTIVE per pair); increments both templates' version by 1"
      - "increments ResponseTemplate.version by 1"

  - method: POST
    path: "/complaint-office/response-templates/{templateId}/retire"
    description: "Retire an ACTIVE template"
    roles: [ComplaintManager]
    code: 200
    input: []
