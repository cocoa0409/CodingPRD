              as_user_id: "${cde_id}"
              captures: { qlici_a_id: $.data.id }
            - call: "POST /nmtc/qlicis"
              payload: { qei_id: "${qei_id}", qalicb_id: "${qalicb_id}", loan_class: "B", principal_cents: 5000000 }
              as: CDESponsor
              as_user_id: "${cde_id}"
              captures: { qlici_b_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: CertifyingAgency
            - call: "POST /nmtc/qlicis/${qlici_a_id}/principal-repayments"
              payload: { amount_cents: 85000000 }
              as: CDESponsor
              as_user_id: "${cde_id}"
            - call: "GET /nmtc/reinvestment-obligations"
              payload: { qei_id: "${qei_id}", status: "OPEN" }
              as: CDESponsor
              as_user_id: "${cde_id}"
              captures: { obligation_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-15T00:00:00Z" }
              as: CertifyingAgency
          trigger:
            - call: "POST /nmtc/reinvestment-obligations/${obligation_id}/reinvestments"
              payload: { target_qlici_id: "${qlici_b_id}", amount_cents: 85000001 }
              as: CDESponsor
              as_user_id: "${cde_id}"
            - call: "POST /nmtc/reinvestment-obligations/${obligation_id}/reinvestments"
              payload: { target_qlici_id: "${qlici_b_id}", amount_cents: 90000001 }
              as: CDESponsor
              as_user_id: "${cde_id}"
            - call: "POST /nmtc/reinvestment-obligations/${obligation_id}/reinvestments"
              payload: { target_qlici_id: "${qlici_b_id}", amount_cents: 85000000 }
              as: CDESponsor
              as_user_id: "${cde_id}"
          assert:
            - "PRECONDITION — QEI.${qei_id}.uninvested_cash_cents == 90000000 and ReinvestmentObligation.${obligation_id}.amount_cents == 85000000 with reinvested_cents == 0"
            - "ONE ceiling breached (85,000,001 <= 90,000,000 cash but > 85,000,000 obligation): HTTP 422 with error_id == \"ERR_REINVESTMENT_EXCEEDS_OBLIGATION\""
            - "BOTH ceilings breached (90,000,001 > 90,000,000 cash and > 85,000,000 obligation): HTTP 422 with error_id == \"ERR_INSUFFICIENT_UNINVESTED_CASH\" — priority 35 outranks priority 37"
            - "SATISFACTION — the exact 85,000,000 reinvestment returns 200 with status == \"SATISFIED\", reinvested_cents == 85000000 and satisfied_at == \"2026-12-15T00:00:00.000Z\""
            - "After the successful reinvestment QLICI.${qlici_b_id}.outstanding_principal_cents == 90000000 and QEI.${qei_id}.uninvested_cash_cents == 5000000"
            - "Neither refused call altered reinvested_cents, the QLICI balance or the QEI cash position"

      - name: qei_amount_above_remaining_authority_returns_insufficient_allocation_authority
        claim_type: aggregate_validation
        grounds:
          - validations[priority=34]
          - errors[ERR_INSUFFICIENT_ALLOCATION_AUTHORITY]
          - calculations.allocation_authority_ledger
        distinguishing_aspect: "The authority ceiling is an aggregate over prior QEIs, not a per-request cap: two 60,000,000 cent QEIs are each individually far below the 100,000,000 cent award, but the second exhausts the ledger and returns 422 — and it is the FUND capital leg of the same rule that would fire if the fund were the tighter constraint."
        test_recipe:
          setup:
            - "An award of exactly 100,000,000 cents, signed and ACTIVE."
            - "Two separately closed funds, each with 60,000,000 equity and 40,000,000 leverage, so each has 100,000,000 cents of capital available."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CertifyingAgency
            - call: "POST /nmtc/cdes"
              payload: { legal_name: "Gulf Coast CDE", certification_number: "CDE-2869-116", service_area_scope: "MULTI_STATE" }
              as: CertifyingAgency
              captures: { cde_id: $.data.id }
            - call: "POST /nmtc/allocation-awards"
              payload: { cde_id: "${cde_id}", award_year: 2026, allocation_amount_cents: 100000000, service_area_state_codes: ["MS"], min_severe_distress_share_pct: 60.00, substantially_all_method: "DIRECT_TRACING" }
              as: CertifyingAgency
              captures: { award_id: $.data.id }
            - call: "POST /nmtc/allocation-awards/${award_id}/allocation-agreement"
              payload: { signatory_name: "A. Rivers" }
              as: CDESponsor
              as_user_id: "${cde_id}"
              captures: { award_v_signed: $.data.version }
            - call: "POST /nmtc/investment-funds"
              payload: { legal_name: "NMTC Fund A LLC", equity_contribution_cents: 60000000, leverage_lender_name: "Delta Bank", leverage_loan_principal_cents: 40000000, leverage_loan_rate_bps: 450 }
              as: TaxCreditInvestor
              as_user_id: "investor-delta"
              captures: { fund_a_id: $.data.id }
            - call: "POST /nmtc/investment-funds/${fund_a_id}/closing"
              payload: { equity_received_cents: 60000000, leverage_received_cents: 40000000 }
              as: TaxCreditInvestor
              as_user_id: "investor-delta"
            - call: "POST /nmtc/investment-funds"
              payload: { legal_name: "NMTC Fund B LLC", equity_contribution_cents: 60000000, leverage_lender_name: "Delta Bank", leverage_loan_principal_cents: 40000000, leverage_loan_rate_bps: 450 }
              as: TaxCreditInvestor
              as_user_id: "investor-delta"
              captures: { fund_b_id: $.data.id }
            - call: "POST /nmtc/investment-funds/${fund_b_id}/closing"
              payload: { equity_received_cents: 60000000, leverage_received_cents: 40000000 }
              as: TaxCreditInvestor
              as_user_id: "investor-delta"
          trigger:
            - call: "POST /nmtc/qeis"
              payload: { allocation_award_id: "${award_id}", investment_fund_id: "${fund_a_id}", qei_amount_cents: 60000000, expected_allocation_award_version: "${award_v_signed}" }
              as: CDESponsor
              as_user_id: "${cde_id}"
              captures: { qei_a_id: $.data.id }
            - call: "GET /nmtc/allocation-awards/${award_id}"
              payload: {}
              as: CDESponsor
              as_user_id: "${cde_id}"
              captures: { award_v_after_a: $.data.version }
            - call: "POST /nmtc/qeis"
              payload: { allocation_award_id: "${award_id}", investment_fund_id: "${fund_b_id}", qei_amount_cents: 60000000, expected_allocation_award_version: "${award_v_after_a}" }
              as: CDESponsor
              as_user_id: "${cde_id}"
            - call: "POST /nmtc/qeis"
              payload: { allocation_award_id: "${award_id}", investment_fund_id: "${fund_b_id}", qei_amount_cents: 40000000, expected_allocation_award_version: "${award_v_after_a}" }
              as: CDESponsor
              as_user_id: "${cde_id}"
              captures: { qei_b_id: $.data.id }
          assert:
            - "The first QEI returns 201; AllocationAward.${award_id}.remaining_authority_cents == 40000000 and issued_qei_count == 1"
            - "AGGREGATE — the second 60,000,000 cent QEI returns HTTP 422 with error_id == \"ERR_INSUFFICIENT_ALLOCATION_AUTHORITY\" even though 60,000,000 is well under the 100,000,000 award and under fund B's 100,000,000 of capital"
            - "SATISFACTION — a 40,000,000 cent QEI on the same fund and the same expected version returns 201, so the refused call did not consume the version"
            - "AllocationAward.${award_id}.remaining_authority_cents == 0 and issued_qei_count == 2"
            - "QEI.${qei_a_id}.qei_amount_cents == 60000000 and QEI.${qei_b_id}.qei_amount_cents == 40000000"
            - "InvestmentFund.${fund_b_id}.deployed_to_qei_cents == 40000000, not 100000000"

      - name: issuing_a_qei_from_a_formed_fund_returns_fund_not_funded
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=27]
          - errors[ERR_FUND_NOT_FUNDED]
          - state_machines.InvestmentFund.status
        distinguishing_aspect: "The QEI issuance rule reads the FUND's state: a fund that has recorded a 100,000,000 cent capital stack on paper but never run closing is still FORMED, so issuance returns 422 ERR_FUND_NOT_FUNDED at priority 27 — ahead of the authority check at 34 that the same request also satisfies."
        test_recipe:
          setup:
            - "One ACTIVE award of 5,000,000,000 cents and one FORMED fund with 65,000,000 equity + 35,000,000 leverage declared but closing not yet run."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
