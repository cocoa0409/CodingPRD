          The SAME release request is issued twice against the SAME lot, which
          violates both the state rule (priority 60) and the environmental rule
          (priority 80) on the first call. Only the state defect is repaired between
          the two calls, and the error_id changes from ERR_REAGENT_LOT_STATE_INVALID
