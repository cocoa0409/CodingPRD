        grounds:
          - state_machines.TransportLeg.DEPARTED_to_ABORTED
          - state_machines.ManifestEntry.LOADED_to_STRANDED
          - state_machines.Animal.IN_TRANSIT_to_STRANDED
          - state_machines.TransportRun.IN_PROGRESS_to_ABORTED
          - state_machines.PartnerCommitment.EXHAUSTED_to_PARTIALLY_DRAWN
          - calculations.partner_commitment_slot_conservation
        distinguishing_aspect: |
          Depth-5 chain triggered by aborting a departed leg: TransportLeg -> ManifestEntry ->
          Animal -> TransportRun -> PartnerCommitment -> Organization, where each hop is caused by
          the previous hop and not by the original abort call.
        test_recipe:
          setup:
            - "Clock at 2026-05-05T14:30:00Z."
            - "A SHELTER organization in OR and a PARTNER_RESCUE organization in WA."
            - "A DOG PartnerCommitment for 2 slots expiring 2026-07-01, fully drawn by an IN_PROGRESS TRANSFER_OUT relay."
            - "Two in-custody dogs manifested on both legs of the relay; leg 1 has ARRIVED at HUB-B and leg 2 has DEPARTED, so both dogs are IN_TRANSIT."
