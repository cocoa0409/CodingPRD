        claim_type: valid_transition
        grounds:
          - state_machines[ProcedureCase.clearance_status] CLEARED -> BLOCKED -> CLEARED
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: nl_case_parallel_dimensions_clearance_cycle
          rationale: "That §1.8 instance already drives the clearance dimension through PENDING_PREP -> PREP_ACKNOWLEDGED -> CLEARED -> BLOCKED -> CLEARED while the schedule dimension holds at SCHEDULED, and additionally reschedules the case to prove the two dimensions are independent. A separate corner test would assert a strict subset of the same transitions."

      - name: sm_scope_reprocessing_cycle_returns_to_available
        claim_type: valid_transition
        grounds:
          - state_machines[ScopeAsset.status] SOILED -> REPROCESSING -> AVAILABLE
          - state_machines[ReprocessingLog.log_status] OPEN -> CLOSED
        excluded_because:
          difficulty_instance: nl_scope_reprocessing_full_cycle
          rationale: "That §1.8 instance walks AVAILABLE -> IN_USE -> SOILED -> REPROCESSING -> AVAILABLE through all five stage logs in the mandated order, asserting reprocess_due_at, hld_pass_at and the five CLOSED PASS logs. Every transition of both machines on the happy path is already covered there."

