      - name: the_zone_slot_identity_survives_an_approve_void_reapprove_cycle_with_no_drift
        grounds:
          - state_machines.ArtifactCase.APPROVED_to_DRAFT
          - state_machines.ArtifactCase.CONSERVATOR_REVIEW_to_APPROVED
          - validations.priority_92
          - entities.GalleryZone.fields.available_case_slots
          - "endpoints.POST_/shop-drawings/{id}/void"
        distinguishing_aspect: |
          available_case_slots is not stored independently: the invariant
          case_slot_capacity == reserved_case_slots + available_case_slots must hold
          before and after every write. Approval reserves a slot, and the void
          cascade releases it - two writes on a row the void request never names.
          The released slot has to be genuinely reusable by a DIFFERENT case, and
          the compensated case then has to queue behind it, so a symmetric
          approve/void/re-approve cycle ends with the exact counters it started
          with and the same refusal it would have received at the start.
          Implementations that decrement reserved_case_slots without recomputing
          available_case_slots, or that release the slot on the drawing void while
          leaving the case APPROVED, break the identity in one direction or the
          other.
