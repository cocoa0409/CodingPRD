            - "InstallationCrew Pin-3 under Dealer Pinnacle at certification_tier T3, so max_diameter_m 30.0, certified_until 2027-12-31T00:00:00Z, status CERTIFIED."
            - "BinDesign D7 (15.5 m x 12.0 m, pitch 30, wind 105, moisture 14.0, ASD) owned by Dealer Alpha; diameter_m 15.5 exceeds 9.5 but not 30.0."
            - "DealerOrder O_A on D7 for Dealer Alpha (NONE / GRAVITY) left in production_status DRAFT with installation_readiness UNASSIGNED - assign-crew admits DRAFT."
            - "Logical clock untouched at 2026-08-01T00:00:00Z, well before both certification expiries, so priority 20 is satisfied and cannot mask either error."
