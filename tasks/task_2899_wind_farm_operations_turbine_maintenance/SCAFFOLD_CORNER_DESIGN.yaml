  - section: endpoints
    instances:
      - name: patching_a_fault_code_rule_binds_only_faults_raised_afterwards
        claim_type: standard_crud
        grounds:
          - endpoints.PATCH_/wind-ops/fault-code-rules/{id}
          - entities.FaultEvent.fields.max_remote_resets_pinned
          - entities.FaultEvent.fields.requires_dispatch_pinned
          - entities.FaultEvent.fields.contractual_exclusion_pinned
          - entities.FaultEvent.fields.fault_code_rule_version_pinned
        distinguishing_aspect: |
          The only update endpoint in the API is also the one place where pinning matters: the PATCH
          must bump the rule's version and change the rule row, must NOT retro-edit the four pinned
          copies on the fault raised before it, and the very next raise must pin the NEW values - so
          two live events on the same code disagree about resettability.
        test_recipe:
          setup:
            - "two turbines on one farm and one RESETTABLE rule that permits remote reset"
          setup_api_calls:
            - call: "POST /wind-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SiteAdmin
              as_user_id: "admin-1"
            - call: "POST /wind-ops/farms"
              payload: { name: "Elk Basin", region_code: "MT-E", grid_operator_code: "NWMT", road_levy_pct: 2.5, community_levy_pct: 1.5, landowner_budget_cap_cents: 500000000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { farm_id: $.data.id }
            - call: "POST /wind-ops/turbine-models"
              payload: { model_code: "V150-4.2", rated_power_kw: 4200, hub_height_m: 105, rotor_diameter_m: 150, service_interval_hours: 4000, service_interval_tolerance_hours: 250, gearbox_lead_time_days: 210, blade_lead_time_days: 150, generator_lead_time_days: 120 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { model_id: $.data.id }
            - call: "POST /wind-ops/farms/${farm_id}/turbines"
              payload: { turbine_model_id: "${model_id}", asset_tag: "T-01", commissioning_date: "2024-03-15", expected_kwh_per_hour: 2000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { t1: $.data.id }
            - call: "POST /wind-ops/farms/${farm_id}/turbines"
              payload: { turbine_model_id: "${model_id}", asset_tag: "T-02", commissioning_date: "2024-03-15", expected_kwh_per_hour: 2000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { t2: $.data.id }
            - call: "POST /wind-ops/fault-code-rules"
              payload: { fault_code: "F-3001", severity_class: "RESETTABLE", max_remote_resets_per_24h: 2, requires_dispatch: false, contractual_exclusion: false }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { rule_id: $.data.id, rule_v1: $.data.version }
            - call: "POST /wind-ops/turbines/${t1}/fault-events"
              payload: { fault_code: "F-3001", raised_at: "2026-08-01T01:00:00Z" }
              as: ControlRoomOperator
              as_user_id: "ops-1"
              captures: { fe_before: $.data.id }
          trigger:
            - call: "PATCH /wind-ops/fault-code-rules/${rule_id}"
              payload: { max_remote_resets_per_24h: 5, requires_dispatch: true, contractual_exclusion: true }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { rule_v2: $.data.version }
            - call: "POST /wind-ops/turbines/${t2}/fault-events"
              payload: { fault_code: "F-3001", raised_at: "2026-08-01T02:00:00Z" }
              as: ControlRoomOperator
              as_user_id: "ops-1"
              captures: { fe_after: $.data.id }
            - call: "POST /wind-ops/fault-events/${fe_before}/triage"
              payload: { disposition: "REMOTE_RESET" }
              as: ControlRoomOperator
              as_user_id: "ops-1"
            - call: "POST /wind-ops/fault-events/${fe_after}/triage"
              payload: { disposition: "REMOTE_RESET" }
              as: ControlRoomOperator
              as_user_id: "ops-1"
              captures: { err_after: $.data.error_id }
          assert:
            - "the PATCH returns HTTP 200 with FaultCodeRule.${rule_id}.max_remote_resets_per_24h 5, requires_dispatch true, contractual_exclusion true and ${rule_v2} greater than ${rule_v1}"
            - "FaultCodeRule.${rule_id}.fault_code is still F-3001 and severity_class is still RESETTABLE, since neither is a PATCH input"
            - "FaultEvent.${fe_before} still has max_remote_resets_pinned 2, requires_dispatch_pinned false, contractual_exclusion_pinned false and fault_code_rule_version_pinned == ${rule_v1}"
            - "FaultEvent.${fe_after} has max_remote_resets_pinned 5, requires_dispatch_pinned true, contractual_exclusion_pinned true and fault_code_rule_version_pinned == ${rule_v2}"
            - "the older event's triage to REMOTE_RESET still returns 200 and moves it to RESET_PENDING"
            - "the newer event's triage returns HTTP 422 with ${err_after} == ERR_RESET_NOT_PERMITTED, so one live rule yields two different verdicts on the same fault code"
      - name: creating_a_fault_dispatch_order_links_the_event_and_advances_it_to_dispatched
        claim_type: cross_reference_link
        grounds:
          - endpoints.POST_/wind-ops/work-orders
          - state_machines.FaultEvent
          - entities.WorkOrder.fields.fault_event_id
        distinguishing_aspect: |
          This create is simultaneously a link and a transition on a DIFFERENT entity: the new order
          holds fault_event_id and the referenced event moves DISPATCH_REQUIRED -> DISPATCHED in the
          same request, while the turbine's availability dimension stays FAULTED because dispatch is
          not yet work in progress.
        test_recipe:
          setup:
            - "one turbine with a LOCKOUT fault triaged to DISPATCH_REQUIRED"
          setup_api_calls:
            - call: "POST /wind-ops/_clock/set_current_utc"
