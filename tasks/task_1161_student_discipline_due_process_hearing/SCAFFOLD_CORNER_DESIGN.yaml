# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 1161: Student Discipline & Due-Process Hearing
# Sections follow references/claim-extraction-guide.md. Claims already covered
# by §1.8 are emitted as excluded_because stubs.
# =============================================================================

scaffold_corner_design:
  # ---------------------------------------------------------------------------
  # Section: entities
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: student_creation_applies_defaults
        claim_type: defaults
        grounds: [entities.Student.fields.disability_status, entities.Student.fields.cumulative_suspension_days, entities.Student.fields.enrollment_status]
        distinguishing_aspect: "Omitting disability_status applies default NONE; system fields initialize (enrollment_status ENROLLED, cumulative 0, version 1)."
        test_recipe:
          setup: ["empty database; logical clock at default 2026-05-01T00:00:00Z"]
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "Stu Def", date_of_birth: "2010-05-01T00:00:00Z", grade_level: 9, demographic_group: "ASIAN", guardian_id: "gd1" }
              as: SchoolAdministrator
              captures: { stu_id: $.data.id }
          trigger:
            - call: "GET /students/${stu_id}"
              payload: {}
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
          assert:
            - "Student.disability_status == NONE (default applied)"
            - "Student.enrollment_status == ENROLLED and cumulative_suspension_days == 0"
            - "Student.version == 1; id and created_at are server-minted"

      - name: student_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Student.fields.full_name, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required full_name yields ERR_INVALID_REQUEST (400); no row persisted."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /students"
              payload: { date_of_birth: "2010-05-01T00:00:00Z", grade_level: 9, demographic_group: "ASIAN", guardian_id: "gd1" }
              as: SchoolAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST with HTTP 400"
            - "GET /students returns total_count == 0"

      - name: student_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.Student.fields.demographic_group, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "demographic_group outside the declared enum set is rejected."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /students"
              payload: { full_name: "Stu Enum", date_of_birth: "2010-05-01T00:00:00Z", grade_level: 9, demographic_group: "MARTIAN", guardian_id: "gd1" }
              as: SchoolAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST with HTTP 400"

      - name: student_grade_out_of_range_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.Student.fields.grade_level, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "grade_level 5 is below the [6,12] range."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /students"
              payload: { full_name: "Stu Grade", date_of_birth: "2012-05-01T00:00:00Z", grade_level: 5, demographic_group: "WHITE", guardian_id: "gd2" }
              as: SchoolAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST with HTTP 400"

      - name: student_computed_field_input_ignored
        claim_type: computed_fields
        grounds: [entities.Student.fields.cumulative_suspension_days]
        distinguishing_aspect: "Client-supplied cumulative_suspension_days is ignored; server computes 0."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "Stu Comp", date_of_birth: "2010-05-01T00:00:00Z", grade_level: 9, demographic_group: "BLACK", guardian_id: "gd3", cumulative_suspension_days: 99 }
              as: SchoolAdministrator
              captures: { stu_id: $.data.id }
          trigger:
            - call: "GET /students/${stu_id}"
              payload: {}
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
          assert:
            - "Student.cumulative_suspension_days == 0 (client input 99 ignored)"

      - name: get_case_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Reading a case with a non-existent UUID yields ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /cases/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND with HTTP 404"

      - name: student_retrieval_matches_created_data
        claim_type: retrieval
        grounds: [entities.Student]
        distinguishing_aspect: "GET returns exactly the stored input fields."
        test_recipe:
          setup: ["one student created with known field values"]
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "Stu Read", date_of_birth: "2010-07-01T00:00:00Z", grade_level: 8, demographic_group: "HISPANIC", guardian_id: "gd4", disability_status: "SECTION_504" }
              as: DistrictAdmin
              as_user_id: "da_1"
              captures: { stu_id: $.data.id }
          trigger:
            - call: "GET /students/${stu_id}"
              payload: {}
              as: DistrictAdmin
              as_user_id: "da_1"
          assert:
            - "full_name == 'Stu Read', grade_level == 8, demographic_group == HISPANIC, disability_status == SECTION_504, guardian_id == 'gd4'"

  # ---------------------------------------------------------------------------
  # Section: state_machines
  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: case_created_in_initial_state_submitted
        claim_type: initial_state
        grounds: [state_machines.DisciplineCase]
        distinguishing_aspect: "A new referral starts in SUBMITTED with referrer_id bound to the creator."
        test_recipe:
          setup: ["one student exists"]
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "Stu Init", date_of_birth: "2010-05-01T00:00:00Z", grade_level: 9, demographic_group: "WHITE", guardian_id: "gi1" }
              as: SchoolAdministrator
              captures: { stu_id: $.data.id }
          trigger:
            - call: "POST /cases"
              payload: { student_id: "${stu_id}", incident_date: "2026-05-01T08:00:00Z", description: "initial state check" }
              as: SchoolAdministrator
              as_user_id: "admin_ref_1"
              captures: { st: $.data.status, ref: $.data.referrer_id }
          assert:
            - "DisciplineCase.status == SUBMITTED (got ${st})"
            - "DisciplineCase.referrer_id == 'admin_ref_1' (got ${ref}); offense_code_id == null"

      - name: confirm_from_classified_returns_409
        claim_type: invalid_transition
        grounds: [state_machines.DisciplineCase, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CONFIRM is not reachable from CLASSIFIED (notice never issued)."
        test_recipe:
          setup: ["student; offense code with band occ1 [1,3]; case classified (status CLASSIFIED)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T09:00:00Z" }, as: DistrictAdmin }
            - call: "POST /offense-codes"
              payload: { code: "DISR-01", title: "Disruption", category: "DISRUPTION", severity_level: 2, expellable: false }
              as: DistrictAdmin
              captures: { oc_id: $.data.id }
            - { call: "POST /offense-codes/${oc_id}/sanction-bands", payload: { occurrence_index: 1, min_days: 1, max_days: 3 }, as: DistrictAdmin }
            - call: "POST /students"
              payload: { full_name: "Stu Inv", date_of_birth: "2010-05-01T00:00:00Z", grade_level: 9, demographic_group: "WHITE", guardian_id: "gi2" }
              as: SchoolAdministrator
              captures: { stu_id: $.data.id }
            - call: "POST /cases"
              payload: { student_id: "${stu_id}", incident_date: "2026-05-04T08:00:00Z", description: "d" }
              as: SchoolAdministrator
              as_user_id: "admin_ref_1"
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /cases/${case_id}/classify"
              payload: { offense_code_id: "${oc_id}", expected_case_version: "${case_v}" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
          trigger:
            - call: "POST /cases/${case_id}/confirm"
              payload: {}
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE with HTTP 409 (CONFIRM requires NOTICE_ISSUED)"

      - name: close_from_notice_issued_returns_409
        claim_type: invalid_transition
        grounds: [state_machines.DisciplineCase, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CLOSE is not reachable from NOTICE_ISSUED (case must be CONFIRMED or EXPULSION_ACTIVE)."
        test_recipe:
          setup: ["case advanced to NOTICE_ISSUED (2-day sanction, notice at 2026-05-04T09:00:00Z)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T09:00:00Z" }, as: DistrictAdmin }
            - call: "POST /offense-codes"
              payload: { code: "DISR-01", title: "Disruption", category: "DISRUPTION", severity_level: 2, expellable: false }
              as: DistrictAdmin
              captures: { oc_id: $.data.id }
            - { call: "POST /offense-codes/${oc_id}/sanction-bands", payload: { occurrence_index: 1, min_days: 1, max_days: 3 }, as: DistrictAdmin }
            - call: "POST /students"
              payload: { full_name: "Stu Inv2", date_of_birth: "2010-05-01T00:00:00Z", grade_level: 9, demographic_group: "WHITE", guardian_id: "gi3" }
              as: SchoolAdministrator
              captures: { stu_id: $.data.id }
            - call: "POST /cases"
              payload: { student_id: "${stu_id}", incident_date: "2026-05-04T08:00:00Z", description: "d" }
              as: SchoolAdministrator
              as_user_id: "admin_ref_1"
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /cases/${case_id}/classify"
              payload: { offense_code_id: "${oc_id}", expected_case_version: "${case_v}" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
              captures: { case_v2: $.data.version }
            - call: "POST /cases/${case_id}/sanction"
              payload: { sanction_days: 2, sanction_type: "OUT_OF_SCHOOL", expected_case_version: "${case_v2}" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
            - { call: "POST /cases/${case_id}/notices", payload: { delivery_method: "EMAIL" }, as: SchoolAdministrator, as_user_id: "admin_adj_1" }
          trigger:
            - call: "POST /cases/${case_id}/close"
              payload: {}
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE with HTTP 409 (CLOSE requires CONFIRMED or EXPULSION_ACTIVE)"

      - name: appeal_second_decision_returns_409
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Appeal, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A terminal appeal (UPHELD) accepts no further decision."
        test_recipe:
          setup: ["case NOTICE_ISSUED (notice 2026-05-04T09:00:00Z); guardian appeal FILED at 2026-05-05T09:00:00Z; appeal already decided UPHELD by da_1"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T09:00:00Z" }, as: DistrictAdmin }
            - call: "POST /offense-codes"
              payload: { code: "DISR-01", title: "Disruption", category: "DISRUPTION", severity_level: 2, expellable: false }
              as: DistrictAdmin
              captures: { oc_id: $.data.id }
            - { call: "POST /offense-codes/${oc_id}/sanction-bands", payload: { occurrence_index: 1, min_days: 1, max_days: 3 }, as: DistrictAdmin }
            - call: "POST /students"
              payload: { full_name: "Stu Term", date_of_birth: "2010-05-01T00:00:00Z", grade_level: 9, demographic_group: "WHITE", guardian_id: "gt1" }
              as: SchoolAdministrator
              captures: { stu_id: $.data.id }
            - call: "POST /cases"
              payload: { student_id: "${stu_id}", incident_date: "2026-05-04T08:00:00Z", description: "d" }
              as: SchoolAdministrator
              as_user_id: "admin_ref_1"
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /cases/${case_id}/classify"
              payload: { offense_code_id: "${oc_id}", expected_case_version: "${case_v}" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
              captures: { case_v2: $.data.version }
            - call: "POST /cases/${case_id}/sanction"
              payload: { sanction_days: 2, sanction_type: "OUT_OF_SCHOOL", expected_case_version: "${case_v2}" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
            - { call: "POST /cases/${case_id}/notices", payload: { delivery_method: "EMAIL" }, as: SchoolAdministrator, as_user_id: "admin_adj_1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T09:00:00Z" }, as: DistrictAdmin }
            - call: "POST /cases/${case_id}/appeals"
              payload: { grounds: "g" }
              as: ParentGuardian
              as_user_id: "gt1"
              captures: { ap_id: $.data.id }
            - { call: "POST /appeals/${ap_id}/decision", payload: { outcome: "UPHELD" }, as: DistrictAdmin, as_user_id: "da_1" }
          trigger:
            - call: "POST /appeals/${ap_id}/decision"
              payload: { outcome: "REVERSED" }
              as: DistrictAdmin
              as_user_id: "da_1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE with HTTP 409 (UPHELD is terminal; no transition out)"

      - name: evidence_locked_after_packet_served_returns_409
        claim_type: invalid_transition
        grounds: [state_machines.ExpulsionHearing.SCHEDULED_to_EVIDENCE_SERVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Once the packet is served (EVIDENCE_SERVED), the evidence packet is locked: new evidence creation is rejected."
        test_recipe:
          setup: ["expulsion hearing for officer ho_1 in EVIDENCE_SERVED (one ADMITTED item; packet served 2026-05-04 for a 2026-05-08 hearing)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T00:00:00Z" }, as: DistrictAdmin }
            - call: "POST /offense-codes"
              payload: { code: "WEAP-01", title: "Weapon possession", category: "WEAPONS", severity_level: 4, expellable: true }
              as: DistrictAdmin
              captures: { oc_id: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Stu Lock", date_of_birth: "2008-05-01T00:00:00Z", grade_level: 11, demographic_group: "WHITE", guardian_id: "gl1" }
              as: SchoolAdministrator
              captures: { stu_id: $.data.id }
            - call: "POST /cases"
              payload: { student_id: "${stu_id}", incident_date: "2026-05-01T00:00:00Z", description: "weapon" }
              as: SchoolAdministrator
              as_user_id: "admin_ref_1"
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /cases/${case_id}/classify"
              payload: { offense_code_id: "${oc_id}", expected_case_version: "${case_v}" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
            - { call: "POST /cases/${case_id}/refer-expulsion", payload: {}, as: SchoolAdministrator, as_user_id: "admin_adj_1" }
            - call: "POST /hearings"
              payload: { case_id: "${case_id}", hearing_officer_id: "ho_1", scheduled_start: "2026-05-08T10:00:00Z", scheduled_end: "2026-05-08T12:00:00Z" }
              as: DistrictAdmin
              as_user_id: "da_1"
              captures: { h_id: $.data.id }
            - call: "POST /hearings/${h_id}/evidence"
              payload: { item_type: "DOCUMENT", description: "report" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
              captures: { ev_id: $.data.id }
            - { call: "POST /evidence-items/${ev_id}/rule", payload: { ruling: "ADMITTED" }, as: HearingOfficer, as_user_id: "ho_1" }
            - { call: "POST /hearings/${h_id}/serve-packet", payload: {}, as: SchoolAdministrator, as_user_id: "admin_adj_1" }
          trigger:
            - call: "POST /hearings/${h_id}/evidence"
              payload: { item_type: "OTHER", description: "late evidence" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE with HTTP 409 (packet locked at EVIDENCE_SERVED)"

      - name: not_expelled_decision_reverts_case_to_classified
        claim_type: side_effect_execution
        grounds: [state_machines.ExpulsionHearing.HELD_to_NOT_EXPELLED, state_machines.DisciplineCase.EXPULSION_REFERRED_to_CLASSIFIED]
        distinguishing_aspect: "NOT_EXPELLED branch reverts the case to CLASSIFIED and clears referred_to_expulsion_at (cycle back to the normal track)."
        test_recipe:
          setup: ["expulsion hearing HELD for case (officer ho_1, evidence admitted, packet served, convened at 2026-05-08T12:00:00Z)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T00:00:00Z" }, as: DistrictAdmin }
            - call: "POST /offense-codes"
              payload: { code: "WEAP-01", title: "Weapon possession", category: "WEAPONS", severity_level: 4, expellable: true }
              as: DistrictAdmin
              captures: { oc_id: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Stu NotExp", date_of_birth: "2008-05-01T00:00:00Z", grade_level: 11, demographic_group: "BLACK", guardian_id: "gn1" }
              as: SchoolAdministrator
              captures: { stu_id: $.data.id }
            - call: "POST /cases"
              payload: { student_id: "${stu_id}", incident_date: "2026-05-01T00:00:00Z", description: "alleged weapon" }
              as: SchoolAdministrator
              as_user_id: "admin_ref_1"
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /cases/${case_id}/classify"
              payload: { offense_code_id: "${oc_id}", expected_case_version: "${case_v}" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
            - { call: "POST /cases/${case_id}/refer-expulsion", payload: {}, as: SchoolAdministrator, as_user_id: "admin_adj_1" }
            - call: "POST /hearings"
              payload: { case_id: "${case_id}", hearing_officer_id: "ho_1", scheduled_start: "2026-05-08T10:00:00Z", scheduled_end: "2026-05-08T12:00:00Z" }
              as: DistrictAdmin
              as_user_id: "da_1"
              captures: { h_id: $.data.id }
            - call: "POST /hearings/${h_id}/evidence"
              payload: { item_type: "WITNESS_STATEMENT", description: "witness" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
              captures: { ev_id: $.data.id }
            - { call: "POST /evidence-items/${ev_id}/rule", payload: { ruling: "ADMITTED" }, as: HearingOfficer, as_user_id: "ho_1" }
            - { call: "POST /hearings/${h_id}/serve-packet", payload: {}, as: SchoolAdministrator, as_user_id: "admin_adj_1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-08T12:00:00Z" }, as: DistrictAdmin }
            - { call: "POST /hearings/${h_id}/convene", payload: {}, as: HearingOfficer, as_user_id: "ho_1" }
          trigger:
            - { call: "POST /hearings/${h_id}/decision", payload: { outcome: "NOT_EXPELLED", rationale: "insufficient evidence" }, as: HearingOfficer, as_user_id: "ho_1" }
            - call: "GET /cases/${case_id}"
              payload: {}
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
              captures: { st_after: $.data.status, ref_at: $.data.referred_to_expulsion_at }
          assert:
            - "ExpulsionHearing.status == NOT_EXPELLED"
            - "DisciplineCase.status == CLASSIFIED (got ${st_after}) — the revert cycle edge"
            - "DisciplineCase.referred_to_expulsion_at == null (got ${ref_at})"
            - "Student.enrollment_status remains ENROLLED (no cascade fired on this branch)"

      - name: conference_attempt_limit_returns_409
        claim_type: precondition_enforcement
        grounds: [state_machines.Conference.NO_SHOW_to_SCHEDULED, "errors[ERR_CONFERENCE_ATTEMPT_LIMIT]"]
        distinguishing_aspect: "The reschedule loop is capped: with attempt_number == 2 a further NO_SHOW -> reschedule is rejected."
        test_recipe:
          setup: ["case NOTICE_ISSUED (notice 2026-05-04T09:00:00Z, conference_deadline 2026-05-07T09:00:00Z); conference attempt 1 NO_SHOW, rescheduled to attempt 2, then NO_SHOW again"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T09:00:00Z" }, as: DistrictAdmin }
            - call: "POST /offense-codes"
              payload: { code: "DISR-01", title: "Disruption", category: "DISRUPTION", severity_level: 2, expellable: false }
              as: DistrictAdmin
              captures: { oc_id: $.data.id }
            - { call: "POST /offense-codes/${oc_id}/sanction-bands", payload: { occurrence_index: 1, min_days: 1, max_days: 3 }, as: DistrictAdmin }
            - call: "POST /students"
              payload: { full_name: "Stu Att", date_of_birth: "2010-05-01T00:00:00Z", grade_level: 9, demographic_group: "WHITE", guardian_id: "ga1" }
              as: SchoolAdministrator
              captures: { stu_id: $.data.id }
            - call: "POST /cases"
              payload: { student_id: "${stu_id}", incident_date: "2026-05-04T08:00:00Z", description: "d" }
              as: SchoolAdministrator
              as_user_id: "admin_ref_1"
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /cases/${case_id}/classify"
              payload: { offense_code_id: "${oc_id}", expected_case_version: "${case_v}" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
              captures: { case_v2: $.data.version }
            - call: "POST /cases/${case_id}/sanction"
              payload: { sanction_days: 2, sanction_type: "OUT_OF_SCHOOL", expected_case_version: "${case_v2}" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
            - { call: "POST /cases/${case_id}/notices", payload: { delivery_method: "EMAIL" }, as: SchoolAdministrator, as_user_id: "admin_adj_1" }
            - call: "POST /cases/${case_id}/conferences"
              payload: { scheduled_at: "2026-05-05T10:00:00Z" }
              as: SchoolAdministrator
              as_user_id: "admin_adj_1"
              captures: { conf_id: $.data.id }
            - { call: "POST /conferences/${conf_id}/outcome", payload: { outcome: "NO_SHOW" }, as: SchoolAdministrator, as_user_id: "admin_adj_1" }
