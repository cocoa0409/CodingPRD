          - errors.ERR_REVIEW_NOTE_REQUIRED
        distinguishing_aspect: "Rejecting an onboarding document without review_note fails ERR_REVIEW_NOTE_REQUIRED; with the note it transitions to REJECTED and stores the note."
        test_recipe:
