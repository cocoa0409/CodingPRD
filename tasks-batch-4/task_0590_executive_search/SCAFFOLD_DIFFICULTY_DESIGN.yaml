          Entity pair = (PipelineEntry, Engagement). The PipelineEntry's own state is irrelevant — it
          does not yet exist — yet its creation is governed by a grandparent two FK hops away
          (PipelineEntry.assignment_id -> SearchAssignment.engagement_id -> Engagement.status).
