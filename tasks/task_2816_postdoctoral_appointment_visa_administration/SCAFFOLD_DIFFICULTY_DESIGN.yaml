          - validations.priority_27_ERR_LAB_BUFFER_CONFLICT
          - entities.Laboratory.fields.decontamination_buffer_days
          - entities.LabAccessGrant.fields.access_start_date
        distinguishing_aspect: |
          Resource: a Laboratory bench (a shared physical resource with an integer
          capacity), not a person's timeline. Interval semantics: ASYMMETRIC — the
          requested interval's leading edge is pulled back by
          decontamination_buffer_days while its trailing edge is untouched, so the
          conflict is invisible in the raw request dates. With a 7-day buffer, a
          request starting 2027-02-07 has an effective start of 2027-01-31 and
          collides with an incumbent whose last day is 2027-01-31; one day later
