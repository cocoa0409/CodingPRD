      - name: segregation_of_duties_bars_the_drawer_and_the_de_enroller
        claim_type: segregation_of_duties
        grounds:
          - complexity_profile.role_model_note
          - validations[priority=34]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: |
          Both declared separations are proved on the same fixture and both are keyed on
          X-User-ID WITHIN an authorised role, so the 403 cannot be explained by role: the
          auditor who drew the sample is barred from adjudicating it while a second auditor
          succeeds, and the administrator recorded in de_enrolled_by_ref is barred from
          deciding that enrollment's appeal while a third administrator succeeds. The barred
          calls leave the sample DRAWN and the case UNDER_REVIEW.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z; one ACTIVE carrier licensed in TX with cap 50 and two VOICE enrollments E1 and E2 at two dwellings, both starting 2026-06-01."
            - "Clock moved to 2026-07-02T00:00:00Z; the June claim is drafted and filed at 925 + 925 = 1850; auditor AUD-1 draws one sample."
