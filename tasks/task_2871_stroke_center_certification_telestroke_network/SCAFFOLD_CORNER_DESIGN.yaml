  - name: an_empty_reporting_period_yields_zero_rates_and_a_null_excess_mean
    claim_type: aggregation
    grounds:
    - calculations.measure_compliance_rate 'rate = 0.00 if denom == 0'
    - calculations.dtn_excess_reporting STEP 3 'if count(V) == 0 then mean_dtn_excess_pct := null (NOT 0.00)'
    - endpoints.POST /stroke-network/certification-reports
    distinguishing_aspect: 'The two aggregations disagree DELIBERATELY on the empty set: the three compliance rates collapse to 0.00 while mean_dtn_excess_pct must be null. An implementation that treats ''nothing to average'' uniformly gets one of the two wrong, and 0.00 for the excess mean would read as perfect performance rather than no data.'
