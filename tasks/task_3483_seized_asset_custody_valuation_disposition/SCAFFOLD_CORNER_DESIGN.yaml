          - entities.ThirdPartyInterest.fields.priority_position
        distinguishing_aspect: "Priority uniqueness is scoped to statuses {FILED, VERIFIED, APPEALED}: a second LIEN_TAX at priority_position 1 conflicts while the first is FILED, but once the first is DENIED the same position can be re-filed — DENIED releases the slot."
