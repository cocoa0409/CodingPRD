        grounds:
          - concurrency_rules[evidence-packet-create-stale-release]
          - errors[ERR_STALE_RELEASE_VERSION]
          - validations[priority=7]
        distinguishing_aspect: "The second concurrency rule guards the Release row with its own error id: the version captured when the release was created is stale after the merge and the cut, so packet creation returns 412 ERR_STALE_RELEASE_VERSION rather than the flag-flavoured 412, and the fresh token yields base_index 75."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; Release 2026.08.1 created on core-train with its version captured immediately."
            - "One LOW change is merged at 2026-08-01T00:00:00Z and the release is cut at 2026-08-08T00:00:00Z, so the Release row has advanced twice."
