scaffold_corner_design:
  # ===================================================================
  # Entities (Table 1)
  # ===================================================================
  - section: entities
    instances:
      - name: customer_creation_applies_defaults
        claim_type: defaults
        grounds: [entities.Customer.fields.no_show_strikes, entities.Customer.fields.status]
        distinguishing_aspect: "A newly registered customer starts with no_show_strikes 0, status ACTIVE, version 1, and server-minted id/created_at."
        test_recipe:
          setup: ["empty DB; clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - { call: "POST /locker/customers", payload: { name: "Ann Orr", phone: "555-0101", email: "ann@x.com" }, as: PlantOperator, captures: { c1: $.data.id, c1_st: $.data.status, c1_strikes: $.data.no_show_strikes, c1_v: $.data.version } }
          assert:
            - "response 201; status == ACTIVE; no_show_strikes == 0; version == 1"
            - "id is a bare UUID with no type prefix; created_at == 2026-08-01T00:00:00Z (logical clock)"

      - name: customer_get_missing_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", response_envelope]
        distinguishing_aspect: "GET on a non-existent customer id returns the error envelope with ERR_NOT_FOUND and HTTP 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /locker/customers/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: PlantOperator, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 404; data.error_id == ERR_NOT_FOUND; response_type == 'error'"

      - name: capacity_day_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=3]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required capacity_head on capacity-day creation yields ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /locker/capacity-days", payload: { date: "2026-08-20" }, as: PlantManager, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 400; error_id == ERR_INVALID_REQUEST; no CapacityDay persisted"

      - name: appointment_unknown_field_returns_invalid_request
        claim_type: type_constraints
        grounds: ["validations[priority=3]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "A booking body carrying an undeclared field (status spoof) is rejected ERR_INVALID_REQUEST; computed fields are never client-set."
        test_recipe:
          setup: ["c1 exists; CapacityDay 2026-08-20 cap 1 exists"]
          setup_api_calls:
            - { call: "POST /locker/customers", payload: { name: "Ann Orr", phone: "555-0101", email: "ann@x.com" }, as: PlantOperator, captures: { c1: $.data.id } }
            - { call: "POST /locker/capacity-days", payload: { date: "2026-08-20", capacity_head: 1 }, as: PlantManager, captures: { cd1: $.data.id } }
          trigger:
            - { call: "POST /locker/appointments", payload: { customer_id: "${c1}", capacity_day_id: "${cd1}", species: "BEEF", head_count: 1, status: "CONFIRMED" }, as: Customer, as_user_id: "${c1}", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 400; error_id == ERR_INVALID_REQUEST; appointment not created; CapacityDay.booked_head stays 0"

      - name: share_fraction_over_precision_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.CarcassShare.fields.share_fraction, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "share_fraction with more than 3 decimal places (0.3335) violates the field domain and is rejected before any split math."
        test_recipe:
          setup: ["c1 ACTIVE; confirmed HOG appointment; animal HANGING at 200.0 lb"]
          setup_api_calls:
            - { call: "POST /locker/customers", payload: { name: "Ann Orr", phone: "555-0101", email: "ann@x.com" }, as: PlantOperator, captures: { c1: $.data.id } }
            - { call: "POST /locker/capacity-days", payload: { date: "2026-08-20", capacity_head: 1 }, as: PlantManager, captures: { cd1: $.data.id } }
            - { call: "POST /locker/appointments", payload: { customer_id: "${c1}", capacity_day_id: "${cd1}", species: "HOG", head_count: 1 }, as: Customer, as_user_id: "${c1}", captures: { appt: $.data.id } }
            - { call: "POST /locker/appointments/${appt}/pay-deposit", payload: { amount_cents: 7500 }, as: Customer, as_user_id: "${c1}" }
            - { call: "GET /locker/appointments/${appt}/animals", payload: {}, as: PlantOperator, captures: { an1: "$.data[0].id" } }
            - { call: "POST /locker/animals/${an1}/receive", payload: { tag_id: "TAG-H1", live_weight_lbs: 280.0 }, as: PlantOperator }
            - { call: "POST /locker/animals/${an1}/slaughter", payload: {}, as: PlantOperator }
            - { call: "POST /locker/animals/${an1}/weigh", payload: { hanging_weight_lbs: 200.0 }, as: PlantOperator }
          trigger:
            - { call: "POST /locker/animals/${an1}/shares", payload: { owner_customer_id: "${c1}", share_fraction: 0.3335, intended_use: "OWNER_USE" }, as: Customer, as_user_id: "${c1}", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 400; error_id == ERR_INVALID_REQUEST"

      - name: capacity_day_duplicate_date_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.CapacityDay.fields.date, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "CapacityDay.date is unique; a second row for 2026-08-20 is rejected."
        test_recipe:
          setup: ["CapacityDay 2026-08-20 already exists"]
          setup_api_calls:
            - { call: "POST /locker/capacity-days", payload: { date: "2026-08-20", capacity_head: 2 }, as: PlantManager, captures: { cd1: $.data.id } }
          trigger:
            - { call: "POST /locker/capacity-days", payload: { date: "2026-08-20", capacity_head: 5 }, as: PlantManager, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 400; error_id == ERR_INVALID_REQUEST; only one CapacityDay for 2026-08-20 exists"

  # ===================================================================
  # State Machines (Table 2)
  # ===================================================================
  - section: state_machines
    instances:
      - name: appointment_initial_state_is_pending_deposit
        claim_type: initial_state
        grounds: [state_machines.Appointment]
        distinguishing_aspect: "A fresh booking starts in PENDING_DEPOSIT with deposit_due_at exactly created_at + 48h (logical clock)."
        test_recipe:
          setup: ["c1 ACTIVE; CapacityDay 2026-08-20 cap 1; clock default 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /locker/customers", payload: { name: "Ann Orr", phone: "555-0101", email: "ann@x.com" }, as: PlantOperator, captures: { c1: $.data.id } }
            - { call: "POST /locker/capacity-days", payload: { date: "2026-08-20", capacity_head: 1 }, as: PlantManager, captures: { cd1: $.data.id } }
          trigger:
            - { call: "POST /locker/appointments", payload: { customer_id: "${c1}", capacity_day_id: "${cd1}", species: "BEEF", head_count: 1 }, as: Customer, as_user_id: "${c1}", captures: { a_st: $.data.status, a_due: $.data.deposit_due_at } }
          assert:
            - "status == PENDING_DEPOSIT"
            - "deposit_due_at == 2026-08-03T00:00:00Z (created_at 2026-08-01T00:00:00Z + 48h)"

      - name: pending_appointment_expires_via_run_daily
        claim_type: valid_transition
        grounds: [state_machines.Appointment.PENDING_DEPOSIT_to_EXPIRED]
        distinguishing_aspect: "System sweep expires a PENDING_DEPOSIT appointment only when now is strictly past deposit_due_at; at exactly due time it survives, one second later it expires, releasing capacity without charging a strike."
        test_recipe:
          setup: ["c1 ACTIVE; CapacityDay 2026-08-20 cap 2; c1 booked BEEF head 1 at clock 2026-08-01T00:00:00Z (booked_head 1)"]
          setup_api_calls:
            - { call: "POST /locker/customers", payload: { name: "Ann Orr", phone: "555-0101", email: "ann@x.com" }, as: PlantOperator, captures: { c1: $.data.id } }
            - { call: "POST /locker/capacity-days", payload: { date: "2026-08-20", capacity_head: 2 }, as: PlantManager, captures: { cd1: $.data.id } }
            - { call: "POST /locker/appointments", payload: { customer_id: "${c1}", capacity_day_id: "${cd1}", species: "BEEF", head_count: 1 }, as: Customer, as_user_id: "${c1}", captures: { appt: $.data.id } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: PlantManager }
            - { call: "POST /locker/ops/run-daily", payload: {}, as: PlantOperator, captures: { expired1: $.data.expired_appointment_ids } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:01Z" }, as: PlantManager }
            - { call: "POST /locker/ops/run-daily", payload: {}, as: PlantOperator, captures: { expired2: $.data.expired_appointment_ids } }
            - { call: "GET /locker/appointments/${appt}", payload: {}, as: PlantOperator, captures: { a_st: $.data.status } }
            - { call: "GET /locker/capacity-days", payload: { date_from: "2026-08-20", date_to: "2026-08-20" }, as: PlantOperator, captures: { cd_booked: "$.data[0].booked_head" } }
            - { call: "GET /locker/customers/${c1}", payload: {}, as: PlantOperator, captures: { c_strikes: $.data.no_show_strikes } }
          assert:
            - "first run-daily (exactly at due): appointment not expired (now > due required)"
            - "second run-daily (1s past due): appointment EXPIRED and listed in expired_appointment_ids"
            - "CapacityDay.booked_head == 0 (reservation released)"
            - "Customer.no_show_strikes == 0 (expiry is not a no-show)"

      - name: appointment_pay_deposit_after_confirm_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Appointment.PENDING_DEPOSIT_to_CONFIRMED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "pay-deposit is only valid from PENDING_DEPOSIT; a second payment against the CONFIRMED appointment is rejected (no double-confirm)."
        test_recipe:
          setup: ["c1 ACTIVE; CapacityDay 2026-08-20 cap 1; appointment booked and confirmed (deposit 15000 paid)"]
          setup_api_calls:
            - { call: "POST /locker/customers", payload: { name: "Ann Orr", phone: "555-0101", email: "ann@x.com" }, as: PlantOperator, captures: { c1: $.data.id } }
            - { call: "POST /locker/capacity-days", payload: { date: "2026-08-20", capacity_head: 1 }, as: PlantManager, captures: { cd1: $.data.id } }
            - { call: "POST /locker/appointments", payload: { customer_id: "${c1}", capacity_day_id: "${cd1}", species: "BEEF", head_count: 1 }, as: Customer, as_user_id: "${c1}", captures: { appt: $.data.id } }
            - { call: "POST /locker/appointments/${appt}/pay-deposit", payload: { amount_cents: 15000 }, as: Customer, as_user_id: "${c1}" }
          trigger:
            - { call: "POST /locker/appointments/${appt}/pay-deposit", payload: { amount_cents: 15000 }, as: Customer, as_user_id: "${c1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE; deposit_paid_cents stays 15000; exactly 1 animal exists"

      - name: animal_voided_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Animal, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A VOIDED animal (appointment no-show) rejects every further action — receive on it fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["c1 ACTIVE; CapacityDay 2026-08-15 cap 1; confirmed appointment; clock advanced to 2026-08-15; appointment marked NO_SHOW so its animal is VOIDED"]
          setup_api_calls:
            - { call: "POST /locker/customers", payload: { name: "Ann Orr", phone: "555-0101", email: "ann@x.com" }, as: PlantOperator, captures: { c1: $.data.id } }
            - { call: "POST /locker/capacity-days", payload: { date: "2026-08-15", capacity_head: 1 }, as: PlantManager, captures: { cd1: $.data.id } }
            - { call: "POST /locker/appointments", payload: { customer_id: "${c1}", capacity_day_id: "${cd1}", species: "BEEF", head_count: 1 }, as: Customer, as_user_id: "${c1}", captures: { appt: $.data.id } }
            - { call: "POST /locker/appointments/${appt}/pay-deposit", payload: { amount_cents: 15000 }, as: Customer, as_user_id: "${c1}" }
            - { call: "GET /locker/appointments/${appt}/animals", payload: {}, as: PlantOperator, captures: { an1: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: PlantManager }
            - { call: "POST /locker/appointments/${appt}/no-show", payload: {}, as: PlantOperator }
          trigger:
            - { call: "POST /locker/animals/${an1}/receive", payload: { tag_id: "TAG-LATE", live_weight_lbs: 1100.0 }, as: PlantOperator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE; Animal stays VOIDED; tag TAG-LATE not consumed"

      - name: label_double_approve_rejected
        claim_type: invalid_transition
        grounds: [state_machines.LabelRecord.PENDING_to_APPROVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Label approval is single-shot: approving an already APPROVED label fails ERR_INVALID_STATE (terminal lockdown)."
        test_recipe:
          setup: ["full flow: HOG animal finalized with one OWNER_USE share; label exists and was approved once"]
          setup_api_calls:
            - { call: "POST /locker/customers", payload: { name: "Ann Orr", phone: "555-0101", email: "ann@x.com" }, as: PlantOperator, captures: { c1: $.data.id } }
            - { call: "POST /locker/capacity-days", payload: { date: "2026-08-20", capacity_head: 1 }, as: PlantManager, captures: { cd1: $.data.id } }
            - { call: "POST /locker/appointments", payload: { customer_id: "${c1}", capacity_day_id: "${cd1}", species: "HOG", head_count: 1 }, as: Customer, as_user_id: "${c1}", captures: { appt: $.data.id } }
            - { call: "POST /locker/appointments/${appt}/pay-deposit", payload: { amount_cents: 7500 }, as: Customer, as_user_id: "${c1}" }
            - { call: "GET /locker/appointments/${appt}/animals", payload: {}, as: PlantOperator, captures: { an1: "$.data[0].id" } }
            - { call: "POST /locker/animals/${an1}/receive", payload: { tag_id: "TAG-H1", live_weight_lbs: 280.0 }, as: PlantOperator }
            - { call: "POST /locker/animals/${an1}/slaughter", payload: {}, as: PlantOperator }
            - { call: "POST /locker/animals/${an1}/weigh", payload: { hanging_weight_lbs: 200.0 }, as: PlantOperator }
            - { call: "POST /locker/animals/${an1}/shares", payload: { owner_customer_id: "${c1}", share_fraction: 1.0, intended_use: "OWNER_USE" }, as: Customer, as_user_id: "${c1}", captures: { s1: $.data.id } }
            - { call: "POST /locker/animals/${an1}/shares/finalize", payload: {}, as: PlantOperator }
            - { call: "GET /locker/labels", payload: { share_id: "${s1}" }, as: PlantOperator, captures: { lbl1: "$.data[0].id" } }
            - { call: "POST /locker/labels/${lbl1}/approve", payload: {}, as: PlantOperator }
          trigger:
            - { call: "POST /locker/labels/${lbl1}/approve", payload: {}, as: PlantOperator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE; LabelRecord stays APPROVED with version incremented only once"

      - name: pickup_share_cascades_and_double_pickup_rejected
        claim_type: side_effect_execution
        grounds: [state_machines.StorageRecord.STORED_to_PICKED_UP, state_machines.CarcassShare.READY_to_PICKED_UP, state_machines.Animal.READY_to_COMPLETE]
        distinguishing_aspect: "A successful pickup cascades share -> PICKED_UP and, with all shares terminal, bubbles the animal to COMPLETE; a second pickup on the same record is rejected ERR_INVALID_STATE."
        test_recipe:
          setup: ["full flow: HOG animal READY with one share (1.0) STORED since 2026-08-04; label APPROVED; invoice paid 15500 (storage 0 on 2026-08-04)"]
          setup_api_calls:
            - { call: "POST /locker/customers", payload: { name: "Ann Orr", phone: "555-0101", email: "ann@x.com" }, as: PlantOperator, captures: { c1: $.data.id } }
            - { call: "POST /locker/capacity-days", payload: { date: "2026-08-20", capacity_head: 1 }, as: PlantManager, captures: { cd1: $.data.id } }
            - { call: "POST /locker/appointments", payload: { customer_id: "${c1}", capacity_day_id: "${cd1}", species: "HOG", head_count: 1 }, as: Customer, as_user_id: "${c1}", captures: { appt: $.data.id } }
            - { call: "POST /locker/appointments/${appt}/pay-deposit", payload: { amount_cents: 7500 }, as: Customer, as_user_id: "${c1}" }
            - { call: "GET /locker/appointments/${appt}/animals", payload: {}, as: PlantOperator, captures: { an1: "$.data[0].id" } }
            - { call: "POST /locker/animals/${an1}/receive", payload: { tag_id: "TAG-H1", live_weight_lbs: 280.0 }, as: PlantOperator }
            - { call: "POST /locker/animals/${an1}/slaughter", payload: {}, as: PlantOperator }
            - { call: "POST /locker/animals/${an1}/weigh", payload: { hanging_weight_lbs: 200.0 }, as: PlantOperator }
            - { call: "POST /locker/animals/${an1}/shares", payload: { owner_customer_id: "${c1}", share_fraction: 1.0, intended_use: "OWNER_USE" }, as: Customer, as_user_id: "${c1}", captures: { s1: $.data.id } }
            - { call: "POST /locker/animals/${an1}/shares/finalize", payload: {}, as: PlantOperator }
            - { call: "POST /locker/shares/${s1}/cut-sheet", payload: { grind_pct: 30, package_weight_lbs: 2.0 }, as: Customer, as_user_id: "${c1}", captures: { cs1: $.data.id } }
            - { call: "POST /locker/cut-sheets/${cs1}/submit", payload: {}, as: Customer, as_user_id: "${c1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: PlantManager }
            - { call: "POST /locker/animals/${an1}/start-fabrication", payload: {}, as: PlantOperator }
            - { call: "POST /locker/animals/${an1}/complete-fabrication", payload: {}, as: PlantOperator }
            - { call: "GET /locker/labels", payload: { share_id: "${s1}" }, as: PlantOperator, captures: { lbl1: "$.data[0].id" } }
            - { call: "POST /locker/labels/${lbl1}/approve", payload: {}, as: PlantOperator }
            - { call: "GET /locker/invoices", payload: { share_id: "${s1}" }, as: PlantOperator, captures: { inv1: "$.data[0].id" } }
            - { call: "POST /locker/invoices/${inv1}/payments", payload: { amount_cents: 15500 }, as: Customer, as_user_id: "${c1}" }
            - { call: "GET /locker/storage-records", payload: { share_id: "${s1}" }, as: PlantOperator, captures: { sr1: "$.data[0].id" } }
          trigger:
            - { call: "POST /locker/storage-records/${sr1}/pickup", payload: {}, as: PlantOperator, captures: { sr_st: $.data.status } }
            - { call: "GET /locker/shares/${s1}", payload: {}, as: PlantOperator, captures: { sh_st: $.data.status } }
            - { call: "GET /locker/animals/${an1}", payload: {}, as: PlantOperator, captures: { an_st: $.data.status } }
            - { call: "POST /locker/storage-records/${sr1}/pickup", payload: {}, as: PlantOperator, captures: { err: $.data.error_id } }
          assert:
            - "pickup succeeds: StorageRecord.status == PICKED_UP with picked_up_at set"
            - "cascade: CarcassShare.status == PICKED_UP"
            - "bubble-up: Animal.status == COMPLETE (all shares terminal)"
            - "second pickup rejected ERR_INVALID_STATE"

      - name: receive_last_expected_completes_appointment
        claim_type: side_effect_execution
        grounds: [state_machines.Appointment.CONFIRMED_to_COMPLETED, state_machines.Animal.EXPECTED_to_RECEIVED]
        distinguishing_aspect: "Bubble-up: receiving the final EXPECTED animal of a confirmed appointment flips the appointment to COMPLETED automatically."
        test_recipe:
          setup: ["c1 ACTIVE; CapacityDay 2026-08-20 cap 2; confirmed BEEF head_count 2 appointment with two EXPECTED animals"]
          setup_api_calls:
            - { call: "POST /locker/customers", payload: { name: "Ann Orr", phone: "555-0101", email: "ann@x.com" }, as: PlantOperator, captures: { c1: $.data.id } }
            - { call: "POST /locker/capacity-days", payload: { date: "2026-08-20", capacity_head: 2 }, as: PlantManager, captures: { cd1: $.data.id } }
            - { call: "POST /locker/appointments", payload: { customer_id: "${c1}", capacity_day_id: "${cd1}", species: "BEEF", head_count: 2 }, as: Customer, as_user_id: "${c1}", captures: { appt: $.data.id } }
            - { call: "POST /locker/appointments/${appt}/pay-deposit", payload: { amount_cents: 30000 }, as: Customer, as_user_id: "${c1}" }
            - { call: "GET /locker/appointments/${appt}/animals", payload: {}, as: PlantOperator, captures: { an1: "$.data[0].id", an2: "$.data[1].id" } }
          trigger:
            - { call: "POST /locker/animals/${an1}/receive", payload: { tag_id: "TAG-A1", live_weight_lbs: 1200.0 }, as: PlantOperator }
            - { call: "GET /locker/appointments/${appt}", payload: {}, as: PlantOperator, captures: { st_mid: $.data.status } }
            - { call: "POST /locker/animals/${an2}/receive", payload: { tag_id: "TAG-A2", live_weight_lbs: 1150.0 }, as: PlantOperator }
            - { call: "GET /locker/appointments/${appt}", payload: {}, as: PlantOperator, captures: { st_end: $.data.status } }
          assert:
            - "after first receive: appointment still CONFIRMED (one EXPECTED remains)"
            - "after second receive: appointment == COMPLETED"

      - name: cut_sheet_locked_rejects_submit
        claim_type: terminal_state_lockdown
        grounds: [state_machines.CutSheet, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Once fabrication locks the sheet, submit (and any transition) from LOCKED is rejected."
        test_recipe:
          setup: ["full flow through start-fabrication: HOG animal CUTTING, its share's cut sheet LOCKED"]
          setup_api_calls:
            - { call: "POST /locker/customers", payload: { name: "Ann Orr", phone: "555-0101", email: "ann@x.com" }, as: PlantOperator, captures: { c1: $.data.id } }
            - { call: "POST /locker/capacity-days", payload: { date: "2026-08-20", capacity_head: 1 }, as: PlantManager, captures: { cd1: $.data.id } }
            - { call: "POST /locker/appointments", payload: { customer_id: "${c1}", capacity_day_id: "${cd1}", species: "HOG", head_count: 1 }, as: Customer, as_user_id: "${c1}", captures: { appt: $.data.id } }
            - { call: "POST /locker/appointments/${appt}/pay-deposit", payload: { amount_cents: 7500 }, as: Customer, as_user_id: "${c1}" }
            - { call: "GET /locker/appointments/${appt}/animals", payload: {}, as: PlantOperator, captures: { an1: "$.data[0].id" } }
            - { call: "POST /locker/animals/${an1}/receive", payload: { tag_id: "TAG-H1", live_weight_lbs: 280.0 }, as: PlantOperator }
            - { call: "POST /locker/animals/${an1}/slaughter", payload: {}, as: PlantOperator }
            - { call: "POST /locker/animals/${an1}/weigh", payload: { hanging_weight_lbs: 200.0 }, as: PlantOperator }
            - { call: "POST /locker/animals/${an1}/shares", payload: { owner_customer_id: "${c1}", share_fraction: 1.0, intended_use: "OWNER_USE" }, as: Customer, as_user_id: "${c1}", captures: { s1: $.data.id } }
            - { call: "POST /locker/animals/${an1}/shares/finalize", payload: {}, as: PlantOperator }
            - { call: "POST /locker/shares/${s1}/cut-sheet", payload: { grind_pct: 30, package_weight_lbs: 2.0 }, as: Customer, as_user_id: "${c1}", captures: { cs1: $.data.id } }
