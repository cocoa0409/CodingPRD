      - name: payout_run_payroll_skips_voided_rows
        claim_type: bulk_action
        grounds:
          - endpoints[POST /events/{id}/payout-run]
          - endpoints[POST /staff-assignments/{id}/attendance]
          - calculations.assignment_worked_pay
          - errors[ERR_PAYOUT_PHASE_INVALID]
        distinguishing_aspect: >-
          The PAYROLL phase is skip-not-fail: the ACCRUED row that worked 180 minutes at the member's
          own 2000 cents/h is paid 6000 while the RELEASED row sitting in VOIDED is passed over
          silently rather than aborting the batch - and the same phase run before the event closes is
          refused outright with ERR_PAYOUT_PHASE_INVALID.
        test_recipe:
          setup:
            - "Clock at 2026-09-12T18:00:00Z."
            - "One Event (expected_attendance 6000, gratuity_pool_cents defaulted to 0) whose plan carries a TICKET_TAKER slot that is NOT tip eligible, required_headcount_override 2, 18:00Z -> 21:00Z."
            - "Two ACTIVE members at 2000 cents/h with one assignment each: A1 for m1 and A2 for m2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T18:00:00Z" }
              as: StaffingCoordinator
            - call: "POST /events"
              payload: { name: "Payroll Skip Fixture", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T17:00:00Z", doors_close_at: "2026-09-12T23:00:00Z", expected_attendance: 6000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id, ev_v1: $.data.version }
            - call: "POST /position-types"
              payload: { code: "TICKET_TAKER", display_name: "Ticket Taker", base_hourly_rate_cents: 2000, attendance_ratio_per_1000: 0.8, min_headcount: 1, required_certifications: [], is_tip_eligible: false, is_contracted_position: false }
              as: StaffingCoordinator
              captures: { pt_id: $.data.id }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "${pt_id}", zone_code: "Z100", shift_start: "2026-09-12T18:00:00Z", shift_end: "2026-09-12T21:00:00Z", required_headcount_override: 2 }
              as: StaffingCoordinator
              captures: { slot_id: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "M1 Worker", employment_type: "PART_TIME_EMPLOYEE", seniority_date: "2018-01-01T00:00:00Z", hourly_rate_cents: 2000 }
              as: StaffingCoordinator
              captures: { m1: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "M2 Released", employment_type: "PART_TIME_EMPLOYEE", seniority_date: "2019-01-01T00:00:00Z", hourly_rate_cents: 2000 }
              as: StaffingCoordinator
              captures: { m2: $.data.id }
            - call: "POST /staffing-plans/${plan_id}/activate"
              payload: { expected_event_version: "${ev_v1}" }
              as: StaffingCoordinator
            - call: "POST /staff-assignments"
              payload: { position_slot_id: "${slot_id}", staff_member_id: "${m1}" }
              as: StaffingCoordinator
              captures: { a1: $.data.id }
            - call: "POST /staff-assignments"
              payload: { position_slot_id: "${slot_id}", staff_member_id: "${m2}" }
              as: StaffingCoordinator
              captures: { a2: $.data.id }
            - call: "POST /events/${ev_id}/lifecycle"
              payload: { target_status: "IN_PROGRESS" }
              as: GuestExperienceDirector
            - call: "POST /staff-assignments/${a1}/attendance"
              payload: { action: "CHECK_IN" }
              as: StaffingCoordinator
            - call: "POST /staff-assignments/${a2}/attendance"
              payload: { action: "RELEASE" }
              as: StaffingCoordinator
              captures: { a2_pay_status: $.data.payout_status }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T21:00:00Z" }
              as: StaffingCoordinator
            - call: "POST /staff-assignments/${a1}/attendance"
              payload: { action: "CHECK_OUT" }
              as: StaffingCoordinator
              captures: { a1_minutes: $.data.worked_minutes, a1_total: $.data.total_payout_cents, a1_pay_status: $.data.payout_status }
          trigger:
            - call: "POST /events/${ev_id}/payout-run"
              payload: { phase: "PAYROLL" }
              as: GuestExperienceDirector
              captures: { err_phase: $.data.error_id }
            - call: "POST /events/${ev_id}/lifecycle"
              payload: { target_status: "CLOSED" }
              as: GuestExperienceDirector
            - call: "POST /events/${ev_id}/payout-run"
              payload: { phase: "PAYROLL" }
              as: GuestExperienceDirector
              captures: { paid_count: $.meta.total_count, paid_first: "$.data[0].id" }
          assert:
            - "${a1_minutes} == 180, ${a1_total} == 6000 (180 minutes at the MEMBER's 2000 cents/h, all regular, no overtime) and ${a1_pay_status} == 'ACCRUED'"
            - "${a2_pay_status} == 'VOIDED' and StaffAssignment.${a2}.attendance_status == 'RELEASED'"
            - "${err_phase} == 'ERR_PAYOUT_PHASE_INVALID' with HTTP 409 while the event is still IN_PROGRESS"
            - "after the close the run returns 200 with ${paid_count} == 1 and ${paid_first} == ${a1}"
            - "StaffAssignment.${a1}.payout_status == 'PAID', gratuity_cents == 0 and total_payout_cents still 6000 - the slot is not tip eligible so no GRATUITY_ALLOCATION phase was required first"
            - "StaffAssignment.${a2}.payout_status is still 'VOIDED' - it was skipped, not failed and not paid"
            - "Event.${ev_id}.gratuity_allocated_cents == 0"

      - name: certification_revoke_action_flips_status_to_revoked
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /certifications/{id}/revoke]
          - state_machines.Certification.VALID_to_REVOKED
          - validations[priority 12]
          - errors[ERR_CERTIFICATION_MISSING]
        distinguishing_aspect: >-
          Revocation is forward-only: it stamps revoked_at and flips VALID -> REVOKED without
          retro-cancelling the assignment the worker already holds, but the very next eligibility
          check on the same member now fails with ERR_CERTIFICATION_MISSING.
        test_recipe:
          setup:
            - "Clock at 2026-09-12T10:00:00Z."
            - "One PLANNED Event whose ACTIVE plan carries two ELEVATOR_OPERATOR slots (required_certifications [ELEVATOR_OPERATION], override 2) in zones Z100 and Z200 on the same 18:00Z -> 22:05Z shift."
            - "One ACTIVE member with a VALID ELEVATOR_OPERATION certification and one existing assignment on the Z100 slot."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T10:00:00Z" }
              as: StaffingCoordinator
            - call: "POST /events"
              payload: { name: "Revoke Fixture", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T17:00:00Z", doors_close_at: "2026-09-12T23:00:00Z", expected_attendance: 6000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id, ev_v1: $.data.version }
            - call: "POST /position-types"
              payload: { code: "ELEVATOR_OPERATOR", display_name: "Elevator Operator", base_hourly_rate_cents: 2400, attendance_ratio_per_1000: 0.2, min_headcount: 1, required_certifications: ["ELEVATOR_OPERATION"] }
              as: StaffingCoordinator
              captures: { pt_id: $.data.id }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "${pt_id}", zone_code: "Z100", shift_start: "2026-09-12T18:00:00Z", shift_end: "2026-09-12T22:05:00Z", required_headcount_override: 2 }
              as: StaffingCoordinator
              captures: { slot_a: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "${pt_id}", zone_code: "Z200", shift_start: "2026-09-12T18:00:00Z", shift_end: "2026-09-12T22:05:00Z", required_headcount_override: 2 }
              as: StaffingCoordinator
              captures: { slot_b: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Ada Certified", employment_type: "PART_TIME_EMPLOYEE", seniority_date: "2018-01-01T00:00:00Z", hourly_rate_cents: 2400 }
              as: StaffingCoordinator
              captures: { m1: $.data.id }
            - call: "POST /certifications"
              payload: { staff_member_id: "${m1}", cert_type: "ELEVATOR_OPERATION", issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { cert_1: $.data.id, cert_status_before: $.data.status, revoked_at_before: $.data.revoked_at }
            - call: "POST /staffing-plans/${plan_id}/activate"
              payload: { expected_event_version: "${ev_v1}" }
              as: StaffingCoordinator
            - call: "POST /staff-assignments"
              payload: { position_slot_id: "${slot_a}", staff_member_id: "${m1}" }
              as: StaffingCoordinator
              captures: { a1: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T11:30:00Z" }
              as: StaffingCoordinator
            - call: "POST /certifications/${cert_1}/revoke"
              payload: { reason: "Failed the annual re-test" }
              as: StaffingCoordinator
              captures: { cert_status_after: $.data.status, revoked_at_after: $.data.revoked_at }
            - call: "POST /staff-assignments"
              payload: { position_slot_id: "${slot_b}", staff_member_id: "${m1}" }
              as: StaffingCoordinator
              captures: { err_cert: $.data.error_id }
          assert:
            - "${cert_status_before} == 'VALID' and ${revoked_at_before} is null"
            - "the revoke returns 200 with ${cert_status_after} == 'REVOKED' and ${revoked_at_after} == '2026-09-12T11:30:00Z'"
            - "StaffAssignment.${a1}.attendance_status is still 'SCHEDULED' and PositionSlot.${slot_a}.filled_headcount is still 1 - nothing is retro-cancelled"
            - "${err_cert} == 'ERR_CERTIFICATION_MISSING' with HTTP 409 - the next eligibility check sees the REVOKED row"
            - "PositionSlot.${slot_b}.filled_headcount == 0 and status == 'OPEN'"
            - "GET /staff-members/${m1}/certifications?status=VALID&limit=10&offset=0 returns total_count == 0"

      - name: shift_bid_link_requires_both_member_and_slot
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /shift-bids]
          - endpoints[GET /shift-bids]
          - validations[priority 6]
          - errors[ERR_STAFF_MEMBER_NOT_FOUND]
          - errors[ERR_POSITION_SLOT_NOT_FOUND]
        distinguishing_aspect: >-
          The bid is a pure link row between a member and a slot: either endpoint of the link being
          absent is a 404, both being absent reports the member first because staff_member_id precedes
          position_slot_id in the §1.1 field order, and once created the row is reachable from both
          sides through the list filters.
        test_recipe:
          setup:
            - "Clock at 2026-09-12T10:00:00Z."
            - "One PLANNED Event with an ACTIVE plan and one TICKET_TAKER slot of override 2; one ACTIVE member m1; the absent-row id literal 00000000-0000-0000-0000-0000000000ff."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T10:00:00Z" }
              as: StaffingCoordinator
            - call: "POST /events"
              payload: { name: "Bid Link Fixture", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T17:00:00Z", doors_close_at: "2026-09-12T23:00:00Z", expected_attendance: 6000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id, ev_v1: $.data.version }
            - call: "POST /position-types"
              payload: { code: "TICKET_TAKER", display_name: "Ticket Taker", base_hourly_rate_cents: 2000, attendance_ratio_per_1000: 0.8, min_headcount: 1, required_certifications: [] }
              as: StaffingCoordinator
              captures: { pt_id: $.data.id }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "${pt_id}", zone_code: "Z100", shift_start: "2026-09-12T18:00:00Z", shift_end: "2026-09-12T22:05:00Z", required_headcount_override: 2 }
              as: StaffingCoordinator
              captures: { slot_id: $.data.id }
            - call: "POST /staffing-plans/${plan_id}/activate"
              payload: { expected_event_version: "${ev_v1}" }
              as: StaffingCoordinator
            - call: "POST /staff-members"
              payload: { full_name: "Ada Bidder", employment_type: "PART_TIME_EMPLOYEE", seniority_date: "2018-01-01T00:00:00Z", hourly_rate_cents: 2000 }
              as: StaffingCoordinator
              captures: { m1: $.data.id }
          trigger:
            - call: "POST /shift-bids"
              payload: { staff_member_id: "00000000-0000-0000-0000-0000000000ff", position_slot_id: "${slot_id}" }
              as: StaffingCoordinator
              captures: { err_member: $.data.error_id }
            - call: "POST /shift-bids"
              payload: { staff_member_id: "${m1}", position_slot_id: "00000000-0000-0000-0000-0000000000ff" }
              as: StaffingCoordinator
              captures: { err_slot: $.data.error_id }
            - call: "POST /shift-bids"
              payload: { staff_member_id: "00000000-0000-0000-0000-0000000000ff", position_slot_id: "00000000-0000-0000-0000-0000000000ff" }
              as: StaffingCoordinator
              captures: { err_both: $.data.error_id }
            - call: "POST /shift-bids"
              payload: { staff_member_id: "${m1}", position_slot_id: "${slot_id}" }
              as: StaffingCoordinator
              captures: { bid_1: $.data.id, bid_member: $.data.staff_member_id, bid_slot: $.data.position_slot_id, bid_submitted: $.data.submitted_at }
            - call: "GET /shift-bids?staff_member_id=${m1}&limit=10&offset=0"
              as: StaffMember
              as_user_id: "${m1}"
              captures: { by_member: $.meta.total_count }
            - call: "GET /shift-bids?position_slot_id=${slot_id}&limit=10&offset=0"
              as: StaffingCoordinator
              captures: { by_slot: $.meta.total_count }
          assert:
            - "${err_member} == 'ERR_STAFF_MEMBER_NOT_FOUND' with HTTP 404"
            - "${err_slot} == 'ERR_POSITION_SLOT_NOT_FOUND' with HTTP 404"
            - "${err_both} == 'ERR_STAFF_MEMBER_NOT_FOUND' - the declaration order of the body FKs decides, so the member is checked before the slot"
            - "the valid link returns 201 with ${bid_member} == ${m1}, ${bid_slot} == ${slot_id}, status SUBMITTED, rank_score null and ${bid_submitted} == '2026-09-12T10:00:00Z'"
            - "${by_member} == 1 and ${by_slot} == 1 - the same row is reachable from either end of the link"
            - "no bid row was created by any of the three refusals: GET /shift-bids?limit=10&offset=0 returns total_count == 1"

      - name: satisfaction_summary_computed_read_zone_filter
        claim_type: computed_read
        grounds:
          - endpoints[GET /events/{id}/satisfaction-summary]
          - endpoints[POST /satisfaction-responses]
          - calculations.event_satisfaction_summary
        distinguishing_aspect: >-
          A read that computes rather than stores: three responses give response_count 3,
          average_score 4.00 and promoter_share_bp 6667 (2 of 3 at or above the promoter floor of 4,
          rounded half up from 6666.67), the zone_breakdown comes back ordered by zone_code ASC, and
          passing zone_code=Z1 narrows the same computation to 2 / 4.50 / 10000 without writing a row.
        test_recipe:
          setup:
            - "Clock at 2026-09-12T22:30:00Z."
            - "One Event with no GuestIssues at all."
            - "Three SatisfactionResponses: score 5 in Z1, score 4 in Z1, score 3 in Z2 - keyed in that order."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T22:30:00Z" }
              as: GuestServicesSupervisor
            - call: "POST /events"
              payload: { name: "Satisfaction Summary Fixture", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T17:00:00Z", doors_close_at: "2026-09-12T23:00:00Z", expected_attendance: 6000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id }
            - call: "GET /events/${ev_id}/satisfaction-summary"
              as: GuestExperienceDirector
              captures: { empty_count: $.data.response_count, empty_avg: $.data.average_score, empty_promoter: $.data.promoter_share_bp }
            - call: "POST /satisfaction-responses"
              payload: { event_id: "${ev_id}", zone_code: "Z1", score: 5, comment: "Great ushers" }
              as: GuestServicesSupervisor
              as_user_id: "sup-1"
              captures: { r1: $.data.id, r1_user: $.data.submitted_by_user_id }
            - call: "POST /satisfaction-responses"
              payload: { event_id: "${ev_id}", zone_code: "Z1", score: 4 }
              as: GuestServicesSupervisor
              as_user_id: "sup-1"
              captures: { r2: $.data.id, r2_comment: $.data.comment }
            - call: "POST /satisfaction-responses"
              payload: { event_id: "${ev_id}", zone_code: "Z2", score: 3 }
              as: GuestExperienceDirector
              as_user_id: "dir-1"
              captures: { r3: $.data.id }
          trigger:
            - call: "GET /events/${ev_id}/satisfaction-summary"
              as: GuestExperienceDirector
              captures: { all_count: $.data.response_count, all_avg: $.data.average_score, all_promoter: $.data.promoter_share_bp, all_resolved: $.data.resolved_issue_count, all_breached: $.data.sla_breached_issue_count, zone_first: "$.data.zone_breakdown[0].zone_code" }
            - call: "GET /events/${ev_id}/satisfaction-summary?zone_code=Z1"
              as: GuestServicesSupervisor
              captures: { z1_count: $.data.response_count, z1_avg: $.data.average_score, z1_promoter: $.data.promoter_share_bp }
            - call: "GET /events/${ev_id}/satisfaction-summary?zone_code=Z2"
              as: GuestServicesSupervisor
              captures: { z2_count: $.data.response_count, z2_avg: $.data.average_score, z2_promoter: $.data.promoter_share_bp }
          assert:
            - "${empty_count} == 0 with ${empty_avg} and ${empty_promoter} both null - a response-less event returns nulls, never zeros"
            - "${r1_user} == 'sup-1' and ${r2_comment} is null (the declared default)"
            - "${all_count} == 3, ${all_avg} == 4.00 (12 / 3) and ${all_promoter} == 6667 (2 * 10000 / 3 = 6666.67 rounded half up)"
            - "${all_resolved} == 0 and ${all_breached} == 0 - the two issue counters read the event's GuestIssues, of which there are none"
            - "${zone_first} == 'Z1' and zone_breakdown == [{Z1, 2, 4.50}, {Z2, 1, 3.00}] in zone_code ASC order"
            - "${z1_count} == 2, ${z1_avg} == 4.50 and ${z1_promoter} == 10000"
            - "${z2_count} == 1, ${z2_avg} == 3.00 and ${z2_promoter} == 0"
            - "three consecutive identical summary reads return byte-identical bodies and GET /events/${ev_id}/satisfaction-responses?limit=10&offset=0 still returns total_count == 3 - the read writes nothing"

      - name: refund_decision_void_is_conditional_on_a_live_authorization
        claim_type: conditional_action
        grounds:
          - endpoints[POST /guest-issues/{id}/refund-decision]
          - conditional_role_rules
          - validations[priority 2]
          - validations[priority 22]
          - calculations.event_refund_budget_ledger
        distinguishing_aspect: >-
          VOID is doubly conditional: the supervisor who may APPROVE is refused it outright with
          ERR_ROLE_NOT_PERMITTED at priority 2, and even the director may only VOID an authorization
          that exists - VOID on a merely PENDING ask is ERR_REFUND_STATE_INVALID, while VOID after an
          APPROVE restores the ledger exactly to 100000 / 0.
        test_recipe:
          setup:
            - "Clock at 2026-09-12T19:00:00Z."
            - "One IN_PROGRESS Event with refund_budget_total_cents 100000."
            - "One ACTIVE member with a VALID CODE_OF_CONDUCT certification."
            - "One MEDIUM / OTHER GuestIssue reported by 'sup-9', assigned so it is IN_PROGRESS, with a 2000-cent ask filed by 'sup-1'."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T19:00:00Z" }
              as: GuestServicesSupervisor
            - call: "POST /events"
              payload: { name: "Void Conditional Fixture", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T17:00:00Z", doors_close_at: "2026-09-12T23:00:00Z", expected_attendance: 6000, refund_budget_total_cents: 100000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id, ev_v1: $.data.version }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /staffing-plans/${plan_id}/activate"
              payload: { expected_event_version: "${ev_v1}" }
              as: StaffingCoordinator
            - call: "POST /events/${ev_id}/lifecycle"
              payload: { target_status: "IN_PROGRESS" }
              as: GuestExperienceDirector
            - call: "POST /staff-members"
              payload: { full_name: "Ida Responder", employment_type: "PART_TIME_EMPLOYEE", seniority_date: "2020-01-01T00:00:00Z", hourly_rate_cents: 2000 }
              as: StaffingCoordinator
              captures: { m1: $.data.id }
            - call: "POST /certifications"
              payload: { staff_member_id: "${m1}", cert_type: "CODE_OF_CONDUCT", issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { cert_1: $.data.id }
            - call: "POST /guest-issues"
              payload: { event_id: "${ev_id}", channel: "TEXT_LINE", category: "OTHER", severity: "MEDIUM", description: "Charged twice at the gate" }
              as: GuestServicesSupervisor
              as_user_id: "sup-9"
              captures: { gi_1: $.data.id, refund_status_new: $.data.refund_status }
            - call: "POST /guest-issues/${gi_1}/assign"
              payload: { staff_member_id: "${m1}" }
              as: GuestServicesSupervisor
              as_user_id: "sup-9"
            - call: "POST /guest-issues/${gi_1}/refund-request"
              payload: { refund_requested_cents: 2000 }
              as: GuestServicesSupervisor
              as_user_id: "sup-1"
              captures: { refund_status_pending: $.data.refund_status }
          trigger:
            - call: "POST /guest-issues/${gi_1}/refund-decision"
              payload: { decision: "VOID" }
              as: GuestServicesSupervisor
              as_user_id: "sup-2"
              captures: { err_role: $.data.error_id }
            - call: "POST /guest-issues/${gi_1}/refund-decision"
              payload: { decision: "VOID" }
              as: GuestExperienceDirector
              as_user_id: "dir-1"
              captures: { err_state: $.data.error_id }
            - call: "POST /guest-issues/${gi_1}/refund-decision"
              payload: { decision: "APPROVE" }
              as: GuestExperienceDirector
              as_user_id: "dir-1"
              captures: { approved_status: $.data.refund_status, approved_cents: $.data.refund_approved_cents, decided_by: $.data.refund_decided_by_user_id }
            - call: "GET /events/${ev_id}"
              as: GuestExperienceDirector
              captures: { remaining_mid: $.data.refund_budget_remaining_cents, total_mid: $.data.refund_approved_total_cents }
            - call: "POST /guest-issues/${gi_1}/refund-decision"
              payload: { decision: "VOID" }
              as: GuestExperienceDirector
              as_user_id: "dir-1"
              captures: { voided_status: $.data.refund_status, voided_cents: $.data.refund_approved_cents }
            - call: "GET /events/${ev_id}"
              as: GuestExperienceDirector
              captures: { remaining_after: $.data.refund_budget_remaining_cents, total_after: $.data.refund_approved_total_cents }
          assert:
            - "${refund_status_new} == 'NONE' at creation and ${refund_status_pending} == 'PENDING' after the ask"
            - "${err_role} == 'ERR_ROLE_NOT_PERMITTED' with HTTP 403 - a supervisor may APPROVE and DENY but never VOID, and the role rule speaks at priority 2, before any refund-state check"
            - "${err_state} == 'ERR_REFUND_STATE_INVALID' with HTTP 409 - VOID needs APPROVED or PARTIALLY_APPROVED, and PENDING is neither"
            - "${approved_status} == 'APPROVED', ${approved_cents} == 2000 and ${decided_by} == 'dir-1' - min(2000, director cap 50000 with 0 bp MEDIUM uplift, available 100000)"
            - "${remaining_mid} == 98000 and ${total_mid} == 2000"
            - "${voided_status} == 'VOIDED' and ${voided_cents} == 0"
            - "${remaining_after} == 100000 and ${total_after} == 0 - the ledger is restored exactly to its pre-approval value with no drift"

      - name: clock_endpoint_available_to_every_role
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /_clock/set_current_utc]
          - roles
        distinguishing_aspect: >-
          The only endpoint all four roles may call, and the only one that writes no row: each role
          moves the clock and gets its echo back, the default before any call is exactly
          2026-08-01T00:00:00Z rather than wall-clock time, and the effect is visible purely through
          the created_at of the next row written.
        test_recipe:
          setup:
            - "A freshly started server with no calls made at all, so the logical clock still holds its startup default."
          setup_api_calls: []
          trigger:
            - call: "POST /events"
              payload: { name: "Default Clock Probe", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T17:00:00Z", doors_close_at: "2026-09-12T23:00:00Z", expected_attendance: 6000 }
              as: GuestExperienceDirector
              captures: { probe_id: $.data.id, probe_created: $.data.created_at }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T08:00:00Z" }
              as: GuestExperienceDirector
              captures: { echo_dir: $.data.current_utc }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-03T08:00:00Z" }
              as: StaffingCoordinator
              captures: { echo_coord: $.data.current_utc }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-04T08:00:00Z" }
              as: GuestServicesSupervisor
              captures: { echo_sup: $.data.current_utc }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T08:00:00Z" }
              as: StaffMember
              as_user_id: "any-worker-user"
              captures: { echo_member: $.data.current_utc }
            - call: "POST /position-types"
              payload: { code: "USHER", display_name: "Usher", base_hourly_rate_cents: 2200, attendance_ratio_per_1000: 1.5, min_headcount: 4, required_certifications: [] }
              as: StaffingCoordinator
              captures: { pt_id: $.data.id, pt_created: $.data.created_at }
          assert:
            - "${probe_created} == '2026-08-01T00:00:00Z' - the startup default, not wall-clock time"
            - "each of the four clock calls returns 200 with ${echo_dir} == '2026-09-02T08:00:00Z', ${echo_coord} == '2026-09-03T08:00:00Z', ${echo_sup} == '2026-09-04T08:00:00Z' and ${echo_member} == '2026-09-05T08:00:00Z'"
            - "${pt_created} == '2026-09-05T08:00:00Z' - the last clock write is what the next row stamps"
            - "Event.${probe_id}.created_at is still '2026-08-01T00:00:00Z' and version is still 1 - moving the clock mutated no existing row"

  # ===================================================================================
  # 6. From Table 6 (Errors) - every one of the 43 catalogued error ids must be
  #    triggerable; the instances below cover the ids no other section already forces
  # ===================================================================================
  - section: errors
    instances:
      - name: all_twelve_not_found_errors_are_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_EVENT_NOT_FOUND]
          - errors[ERR_POSITION_TYPE_NOT_FOUND]
          - errors[ERR_STAFFING_PLAN_NOT_FOUND]
          - errors[ERR_POSITION_SLOT_NOT_FOUND]
          - errors[ERR_STAFF_MEMBER_NOT_FOUND]
          - errors[ERR_CERTIFICATION_NOT_FOUND]
          - errors[ERR_SHIFT_BID_NOT_FOUND]
          - errors[ERR_STAFF_ASSIGNMENT_NOT_FOUND]
          - errors[ERR_BACKFILL_REQUEST_NOT_FOUND]
          - errors[ERR_GUEST_ISSUE_NOT_FOUND]
          - errors[ERR_ACCESSIBILITY_RESOURCE_NOT_FOUND]
          - errors[ERR_ACCESSIBILITY_REQUEST_NOT_FOUND]
        distinguishing_aspect: >-
          One entity-specific 404 per persisted entity, all reached with the same absent-row id: the
          catalogue has twelve distinct NOT_FOUND ids and none of them may collapse into a shared
          generic code.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T09:00:00Z. A completely empty store - no rows of any kind - so the same absent id 00000000-0000-0000-0000-0000000000ff is unknown to every collection."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: GuestExperienceDirector
          trigger:
            - call: "GET /events/00000000-0000-0000-0000-0000000000ff"
              as: GuestExperienceDirector
              captures: { e_event: $.data.error_id }
            - call: "GET /position-types/00000000-0000-0000-0000-0000000000ff"
              as: StaffingCoordinator
              captures: { e_ptype: $.data.error_id }
            - call: "GET /staffing-plans/00000000-0000-0000-0000-0000000000ff"
              as: StaffingCoordinator
              captures: { e_plan: $.data.error_id }
            - call: "GET /position-slots/00000000-0000-0000-0000-0000000000ff"
              as: StaffingCoordinator
              captures: { e_slot: $.data.error_id }
            - call: "GET /staff-members/00000000-0000-0000-0000-0000000000ff"
              as: StaffingCoordinator
              captures: { e_member: $.data.error_id }
            - call: "GET /certifications/00000000-0000-0000-0000-0000000000ff"
              as: StaffingCoordinator
              captures: { e_cert: $.data.error_id }
            - call: "GET /shift-bids/00000000-0000-0000-0000-0000000000ff"
              as: StaffingCoordinator
              captures: { e_bid: $.data.error_id }
            - call: "GET /staff-assignments/00000000-0000-0000-0000-0000000000ff"
              as: StaffingCoordinator
              captures: { e_asg: $.data.error_id }
            - call: "GET /backfill-requests/00000000-0000-0000-0000-0000000000ff"
              as: StaffingCoordinator
              captures: { e_backfill: $.data.error_id }
            - call: "GET /guest-issues/00000000-0000-0000-0000-0000000000ff"
              as: GuestServicesSupervisor
              captures: { e_issue: $.data.error_id }
            - call: "GET /accessibility-resources/00000000-0000-0000-0000-0000000000ff"
              as: GuestServicesSupervisor
              captures: { e_res: $.data.error_id }
            - call: "GET /accessibility-requests/00000000-0000-0000-0000-0000000000ff"
              as: GuestServicesSupervisor
              captures: { e_areq: $.data.error_id }
          assert:
            - "every call returns HTTP 404 with the error envelope { error_id, message }"
            - "${e_event} == 'ERR_EVENT_NOT_FOUND' and ${e_ptype} == 'ERR_POSITION_TYPE_NOT_FOUND'"
            - "${e_plan} == 'ERR_STAFFING_PLAN_NOT_FOUND' and ${e_slot} == 'ERR_POSITION_SLOT_NOT_FOUND'"
            - "${e_member} == 'ERR_STAFF_MEMBER_NOT_FOUND' and ${e_cert} == 'ERR_CERTIFICATION_NOT_FOUND'"
            - "${e_bid} == 'ERR_SHIFT_BID_NOT_FOUND' and ${e_asg} == 'ERR_STAFF_ASSIGNMENT_NOT_FOUND'"
            - "${e_backfill} == 'ERR_BACKFILL_REQUEST_NOT_FOUND' and ${e_issue} == 'ERR_GUEST_ISSUE_NOT_FOUND'"
            - "${e_res} == 'ERR_ACCESSIBILITY_RESOURCE_NOT_FOUND' and ${e_areq} == 'ERR_ACCESSIBILITY_REQUEST_NOT_FOUND'"
            - "the twelve captured values are twelve distinct strings"

      - name: plan_slot_bid_and_assignment_state_errors_are_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_PLAN_STATE_INVALID]
          - errors[ERR_SLOT_STATE_INVALID]
          - errors[ERR_BID_STATE_INVALID]
          - errors[ERR_ASSIGNMENT_STATE_INVALID]
        distinguishing_aspect: >-
          Four sibling 409s that must stay separable: re-activating an ACTIVE plan is
          ERR_PLAN_STATE_INVALID, deleting a DRAFT-plan slot that still carries a SUBMITTED bid is
          ERR_SLOT_STATE_INVALID (the plan rule passes, the slot rule does not), withdrawing a bid
          that is already AWARDED is ERR_BID_STATE_INVALID, and CHECK_OUT before CHECK_IN is
          ERR_ASSIGNMENT_STATE_INVALID.
        test_recipe:
          setup:
            - "Clock at 2026-09-12T10:00:00Z."
            - "One PLANNED Event (expected_attendance 6000) with a DRAFT plan carrying two TICKET_TAKER slots (override 2, 18:00Z -> 22:05Z) in zones Z100 and Z200; no required certifications."
            - "One ACTIVE member m1 with a SUBMITTED bid on the Z200 slot filed while the plan is still DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T10:00:00Z" }
              as: StaffingCoordinator
            - call: "POST /events"
              payload: { name: "State Error Fixture", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T17:00:00Z", doors_close_at: "2026-09-12T23:00:00Z", expected_attendance: 6000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id, ev_v1: $.data.version }
            - call: "POST /position-types"
              payload: { code: "TICKET_TAKER", display_name: "Ticket Taker", base_hourly_rate_cents: 2000, attendance_ratio_per_1000: 0.8, min_headcount: 1, required_certifications: [] }
              as: StaffingCoordinator
              captures: { pt_id: $.data.id }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "${pt_id}", zone_code: "Z100", shift_start: "2026-09-12T18:00:00Z", shift_end: "2026-09-12T22:05:00Z", required_headcount_override: 2 }
              as: StaffingCoordinator
              captures: { slot_a: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "${pt_id}", zone_code: "Z200", shift_start: "2026-09-12T18:00:00Z", shift_end: "2026-09-12T22:05:00Z", required_headcount_override: 2 }
              as: StaffingCoordinator
              captures: { slot_b: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Ada Bidder", employment_type: "PART_TIME_EMPLOYEE", seniority_date: "2018-01-01T00:00:00Z", hourly_rate_cents: 2000 }
              as: StaffingCoordinator
              captures: { m1: $.data.id }
            - call: "POST /shift-bids"
              payload: { staff_member_id: "${m1}", position_slot_id: "${slot_b}" }
              as: StaffingCoordinator
              captures: { bid_1: $.data.id }
          trigger:
            - call: "DELETE /position-slots/${slot_b}"
              as: StaffingCoordinator
              captures: { err_slot_state: $.data.error_id }
            - call: "POST /staffing-plans/${plan_id}/activate"
              payload: { expected_event_version: "${ev_v1}" }
              as: StaffingCoordinator
              captures: { ev_v2: $.data.version }
            - call: "POST /staffing-plans/${plan_id}/activate"
              payload: { expected_event_version: "${ev_v2}" }
              as: StaffingCoordinator
              captures: { err_plan_state: $.data.error_id }
            - call: "POST /shift-bids/${bid_1}/award"
              as: StaffingCoordinator
              captures: { asg_from_award: $.data.id }
            - call: "POST /shift-bids/${bid_1}/withdraw"
              as: StaffMember
              as_user_id: "${m1}"
              captures: { err_bid_state: $.data.error_id }
            - call: "POST /staff-assignments"
              payload: { position_slot_id: "${slot_a}", staff_member_id: "${m1}" }
              as: StaffingCoordinator
              captures: { a1: $.data.id }
            - call: "POST /staff-assignments/${a1}/attendance"
              payload: { action: "CHECK_OUT" }
              as: StaffingCoordinator
              captures: { err_asg_state: $.data.error_id }
          assert:
            - "${err_slot_state} == 'ERR_SLOT_STATE_INVALID' with HTTP 409 - the plan is DRAFT so the plan-state rule is satisfied; it is the non-terminal ShiftBid that blocks the delete, and PositionSlot.${slot_b} still exists"
            - "${err_plan_state} == 'ERR_PLAN_STATE_INVALID' with HTTP 409 on the second activate, and the Event version is not incremented a second time"
            - "${err_bid_state} == 'ERR_BID_STATE_INVALID' with HTTP 409 - the bid is AWARDED, which is terminal, so withdraw is not available"
            - "ShiftBid.${bid_1}.status is still 'AWARDED' and the assignment it produced is unaffected"
            - "${err_asg_state} == 'ERR_ASSIGNMENT_STATE_INVALID' with HTTP 409 - CHECK_OUT with check_in_at still null"
            - "StaffAssignment.${a1}.attendance_status is still 'SCHEDULED', worked_minutes == 0 and payout_status 'PENDING'"
            - "the four captured error ids are four distinct strings"

      - name: backfill_and_member_status_errors_are_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_BACKFILL_NOT_OPEN]
          - errors[ERR_STAFF_MEMBER_NOT_ACTIVE]
          - state_machines.BackfillRequest.OPEN_to_CANCELLED
          - state_machines.StaffMember.ACTIVE_to_SUSPENDED
        distinguishing_aspect: >-
          Both errors need a state to be reached first: the BackfillRequest only exists because a
          NO_SHOW created it, and once cancelled both auto-fill and a second cancel are
          ERR_BACKFILL_NOT_OPEN; the member error needs a SUSPENDED worker for the assignment attempt
          and a TERMINATED worker for the status-change attempt.
        test_recipe:
          setup:
            - "Clock at 2026-09-12T18:10:00Z."
            - "One IN_PROGRESS Event (expected_attendance 6000) whose LOCKED plan carries a TICKET_TAKER slot with no required certifications, override 2, 18:00Z -> 22:05Z."
            - "Two ACTIVE members: m1 assigned to the slot and about to be marked NO_SHOW, and m2 with no assignment."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T18:10:00Z" }
              as: StaffingCoordinator
            - call: "POST /events"
              payload: { name: "Backfill Error Fixture", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T17:00:00Z", doors_close_at: "2026-09-12T23:00:00Z", expected_attendance: 6000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id, ev_v1: $.data.version }
            - call: "POST /position-types"
              payload: { code: "TICKET_TAKER", display_name: "Ticket Taker", base_hourly_rate_cents: 2000, attendance_ratio_per_1000: 0.8, min_headcount: 1, required_certifications: [] }
              as: StaffingCoordinator
              captures: { pt_id: $.data.id }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "${pt_id}", zone_code: "Z100", shift_start: "2026-09-12T18:00:00Z", shift_end: "2026-09-12T22:05:00Z", required_headcount_override: 2 }
              as: StaffingCoordinator
              captures: { slot_id: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "M1 Absent", employment_type: "PART_TIME_EMPLOYEE", seniority_date: "2018-01-01T00:00:00Z", hourly_rate_cents: 2000 }
              as: StaffingCoordinator
              captures: { m1: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "M2 Sidelined", employment_type: "PART_TIME_EMPLOYEE", seniority_date: "2019-01-01T00:00:00Z", hourly_rate_cents: 2000 }
              as: StaffingCoordinator
              captures: { m2: $.data.id }
            - call: "POST /staffing-plans/${plan_id}/activate"
              payload: { expected_event_version: "${ev_v1}" }
              as: StaffingCoordinator
            - call: "POST /staff-assignments"
              payload: { position_slot_id: "${slot_id}", staff_member_id: "${m1}" }
              as: StaffingCoordinator
              captures: { a1: $.data.id }
            - call: "POST /events/${ev_id}/lifecycle"
              payload: { target_status: "IN_PROGRESS" }
              as: GuestExperienceDirector
            - call: "POST /staff-assignments/${a1}/attendance"
              payload: { action: "NO_SHOW" }
              as: StaffingCoordinator
            - call: "GET /backfill-requests?triggering_assignment_id=${a1}&limit=10&offset=0"
              as: StaffingCoordinator
              captures: { bf_total: $.meta.total_count, bf_id: "$.data[0].id", bf_status: "$.data[0].status" }
          trigger:
            - call: "POST /backfill-requests/${bf_id}/cancel"
              payload: { cancel_reason: "Zone closed for the rest of the event" }
              as: StaffingCoordinator
              captures: { bf_cancelled: $.data.status, bf_attempts: $.data.attempt_count }
            - call: "POST /backfill-requests/${bf_id}/auto-fill"
              as: StaffingCoordinator
              captures: { err_bf_autofill: $.data.error_id }
            - call: "POST /backfill-requests/${bf_id}/cancel"
              payload: { cancel_reason: "Second attempt" }
              as: StaffingCoordinator
              captures: { err_bf_cancel: $.data.error_id }
            - call: "POST /staff-members/${m2}/status-change"
              payload: { target_status: "SUSPENDED", reason: "Pending conduct review" }
              as: StaffingCoordinator
              captures: { m2_suspended: $.data.status, m2_pool: $.data.in_backfill_pool }
            - call: "POST /staff-assignments"
              payload: { position_slot_id: "${slot_id}", staff_member_id: "${m2}" }
              as: StaffingCoordinator
              captures: { err_member_state: $.data.error_id }
            - call: "POST /staff-members/${m2}/status-change"
              payload: { target_status: "TERMINATED", reason: "Review concluded" }
              as: StaffingCoordinator
              captures: { m2_terminated: $.data.status }
            - call: "POST /staff-members/${m2}/status-change"
              payload: { target_status: "ACTIVE", reason: "Change of heart" }
              as: StaffingCoordinator
              captures: { err_member_terminal: $.data.error_id }
          assert:
            - "${bf_total} == 1 and ${bf_status} == 'OPEN' - the NO_SHOW cascade created it"
            - "${bf_cancelled} == 'CANCELLED' and ${bf_attempts} == 0 - cancelling is not an attempt"
            - "${err_bf_autofill} == 'ERR_BACKFILL_NOT_OPEN' with HTTP 409 and attempt_count is still 0"
            - "${err_bf_cancel} == 'ERR_BACKFILL_NOT_OPEN' with HTTP 409 - cancel is not idempotent"
            - "${m2_suspended} == 'SUSPENDED' and ${m2_pool} == false"
            - "${err_member_state} == 'ERR_STAFF_MEMBER_NOT_ACTIVE' with HTTP 409 and PositionSlot.${slot_id}.filled_headcount is unchanged by the refusal"
            - "${m2_terminated} == 'TERMINATED' - SUSPENDED -> TERMINATED is a declared edge"
            - "${err_member_terminal} == 'ERR_STAFF_MEMBER_NOT_ACTIVE' with HTTP 409 - a status-change attempted from TERMINATED, and StaffMember.${m2}.status is still 'TERMINATED'"

      - name: accessibility_resource_and_request_state_errors_are_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_RESOURCE_NOT_AVAILABLE]
          - errors[ERR_ACCESS_REQUEST_STATE_INVALID]
          - endpoints[PATCH /accessibility-resources/{id}]
          - endpoints[POST /accessibility-requests/{id}/transition]
          - state_machines.AccessibilityRequest
        distinguishing_aspect: >-
          The resource's own status and the request's status produce two different 409s on the same
          transition endpoint: IN_SERVICE straight from REQUESTED is
          ERR_ACCESS_REQUEST_STATE_INVALID because §1.2 declares no such edge, while CONFIRMED against
          a MAINTENANCE resource is ERR_RESOURCE_NOT_AVAILABLE - and after the request is CANCELLED
          every further transition returns the request-state error again.
        test_recipe:
          setup:
            - "Clock at 2026-09-12T10:00:00Z."
            - "One PLANNED Event with an ACTIVE plan."
            - "One AVAILABLE WHEELCHAIR_ESCORT resource in zone Z100 with unit_count 4."
            - "One REQUESTED AccessibilityRequest for 1 unit over 18:00Z -> 19:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T10:00:00Z" }
              as: GuestServicesSupervisor
            - call: "POST /events"
              payload: { name: "Accessibility Error Fixture", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T17:00:00Z", doors_close_at: "2026-09-12T23:00:00Z", expected_attendance: 6000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id, ev_v1: $.data.version }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /staffing-plans/${plan_id}/activate"
              payload: { expected_event_version: "${ev_v1}" }
              as: StaffingCoordinator
            - call: "POST /accessibility-resources"
              payload: { event_id: "${ev_id}", resource_type: "WHEELCHAIR_ESCORT", zone_code: "Z100", unit_count: 4 }
              as: GuestServicesSupervisor
              captures: { res_id: $.data.id, res_status: $.data.status }
            - call: "POST /accessibility-requests"
              payload: { resource_id: "${res_id}", guest_reference: "GUEST-4410", window_start: "2026-09-12T18:00:00Z", window_end: "2026-09-12T19:00:00Z", units_requested: 1 }
              as: GuestServicesSupervisor
              captures: { areq_1: $.data.id, areq_status: $.data.status, companion_default: $.data.companion_seats_requested }
          trigger:
            - call: "POST /accessibility-requests/${areq_1}/transition"
              payload: { target_status: "IN_SERVICE" }
              as: GuestServicesSupervisor
              captures: { err_req_state: $.data.error_id }
            - call: "PATCH /accessibility-resources/${res_id}"
              payload: { status: "MAINTENANCE" }
              as: GuestServicesSupervisor
              captures: { res_maint: $.data.status }
            - call: "POST /accessibility-requests/${areq_1}/transition"
              payload: { target_status: "CONFIRMED" }
              as: GuestServicesSupervisor
              captures: { err_res_avail: $.data.error_id }
            - call: "PATCH /accessibility-resources/${res_id}"
              payload: { status: "AVAILABLE" }
              as: GuestServicesSupervisor
              captures: { res_back: $.data.status }
            - call: "POST /accessibility-requests/${areq_1}/transition"
              payload: { target_status: "CONFIRMED" }
              as: GuestServicesSupervisor
              captures: { areq_confirmed: $.data.status }
            - call: "POST /accessibility-requests/${areq_1}/transition"
              payload: { target_status: "CANCELLED" }
              as: GuestServicesSupervisor
              captures: { areq_cancelled: $.data.status }
            - call: "POST /accessibility-requests/${areq_1}/transition"
              payload: { target_status: "COMPLETED" }
              as: GuestServicesSupervisor
              captures: { err_terminal: $.data.error_id }
          assert:
            - "${res_status} == 'AVAILABLE', ${areq_status} == 'REQUESTED' and ${companion_default} == 0"
            - "${err_req_state} == 'ERR_ACCESS_REQUEST_STATE_INVALID' with HTTP 409 - §1.2 declares REQUESTED -> CONFIRMED and CONFIRMED -> IN_SERVICE, never REQUESTED -> IN_SERVICE"
            - "${res_maint} == 'MAINTENANCE' and ${err_res_avail} == 'ERR_RESOURCE_NOT_AVAILABLE' with HTTP 409 - the request's own status was perfectly legal; the resource was not"
            - "${res_back} == 'AVAILABLE' and ${areq_confirmed} == 'CONFIRMED' - the same call now succeeds, proving the earlier refusal came from the resource"
            - "${areq_cancelled} == 'CANCELLED' - CONFIRMED -> CANCELLED is declared"
            - "${err_terminal} == 'ERR_ACCESS_REQUEST_STATE_INVALID' with HTTP 409 out of the terminal state, and AccessibilityRequest.${areq_1}.status is still 'CANCELLED'"
            - "AccessibilityResource.${res_id}.unit_count is still 4 throughout"

      - name: slot_capacity_full_error_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_SLOT_CAPACITY_FULL]
          - validations[priority 17]
          - state_machines.PositionSlot.PARTIALLY_FILLED_to_FILLED
        distinguishing_aspect: >-
          The capacity error in isolation, with every other gate satisfied: a second, different,
          fully-eligible member on a slot of required_headcount 1 returns ERR_SLOT_CAPACITY_FULL - not
          the certification error (there are no required certifications) and not the duplicate error
          (it is a different member).
        test_recipe:
          setup:
            - "Clock at 2026-09-12T10:00:00Z."
            - "One PLANNED Event whose ACTIVE plan carries a TICKET_TAKER slot with required_certifications [] and required_headcount_override 1, 18:00Z -> 22:05Z."
            - "Two ACTIVE members m1 and m2, neither with any other assignment; m1 already fills the slot."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T10:00:00Z" }
              as: StaffingCoordinator
            - call: "POST /events"
              payload: { name: "Capacity Full Fixture", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T17:00:00Z", doors_close_at: "2026-09-12T23:00:00Z", expected_attendance: 6000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id, ev_v1: $.data.version }
            - call: "POST /position-types"
              payload: { code: "TICKET_TAKER", display_name: "Ticket Taker", base_hourly_rate_cents: 2000, attendance_ratio_per_1000: 0.8, min_headcount: 1, required_certifications: [] }
              as: StaffingCoordinator
              captures: { pt_id: $.data.id }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "${pt_id}", zone_code: "Z100", shift_start: "2026-09-12T18:00:00Z", shift_end: "2026-09-12T22:05:00Z", required_headcount_override: 1 }
              as: StaffingCoordinator
              captures: { slot_id: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "M1 Incumbent", employment_type: "PART_TIME_EMPLOYEE", seniority_date: "2018-01-01T00:00:00Z", hourly_rate_cents: 2000 }
              as: StaffingCoordinator
              captures: { m1: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "M2 Latecomer", employment_type: "PART_TIME_EMPLOYEE", seniority_date: "2019-01-01T00:00:00Z", hourly_rate_cents: 2000 }
              as: StaffingCoordinator
              captures: { m2: $.data.id }
            - call: "POST /staffing-plans/${plan_id}/activate"
              payload: { expected_event_version: "${ev_v1}" }
              as: StaffingCoordinator
            - call: "POST /staff-assignments"
              payload: { position_slot_id: "${slot_id}", staff_member_id: "${m1}" }
              as: StaffingCoordinator
              captures: { a1: $.data.id }
          trigger:
            - call: "GET /position-slots/${slot_id}"
              as: StaffingCoordinator
              captures: { filled_before: $.data.filled_headcount, status_before: $.data.status }
            - call: "POST /staff-assignments"
              payload: { position_slot_id: "${slot_id}", staff_member_id: "${m2}" }
              as: StaffingCoordinator
              captures: { err_full: $.data.error_id }
            - call: "GET /position-slots/${slot_id}"
              as: StaffingCoordinator
              captures: { filled_after: $.data.filled_headcount, status_after: $.data.status }
          assert:
            - "${filled_before} == 1 and ${status_before} == 'FILLED' - one head against a required_headcount of 1 skips PARTIALLY_FILLED entirely"
            - "${err_full} == 'ERR_SLOT_CAPACITY_FULL' with HTTP 409"
            - "${filled_after} == 1 and ${status_after} == 'FILLED' - the refusal wrote nothing"
            - "GET /staff-assignments?position_slot_id=${slot_id}&limit=10&offset=0 returns total_count == 1 with the only row being ${a1}"
            - "StaffingPlan.${plan_id}.total_required_headcount == 1 and its cost aggregates are untouched by either the success or the refusal"

      - name: shift_rest_conflict_error_is_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_SHIFT_REST_CONFLICT]
        excluded_because:
