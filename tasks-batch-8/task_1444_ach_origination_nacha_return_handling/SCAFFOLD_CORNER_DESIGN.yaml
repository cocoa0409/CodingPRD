# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# ACH Origination & NACHA Return Handling (ODFI)
# Sections/claim_types follow references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: originator_creation_defaults_applied
        claim_type: defaults
        grounds: [entities.Originator.fields.status, entities.Originator.fields.exposure_limit_cents, entities.Originator.fields.fee_discount_bps]
        distinguishing_aspect: "A freshly registered originator is PENDING_UNDERWRITING with zeroed limit/discount/rates/exposure and version == 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /ach/originators"
              payload: { legal_name: "Defaults Co", sec_codes_allowed: ["PPD"] }
              as: OdfiUnderwriter
              captures: { org_id: "$.data.id" }
          assert:
            - "Originator.${org_id}.status == PENDING_UNDERWRITING"
            - "Originator.${org_id}.exposure_limit_cents == 0 AND fee_discount_bps == 0"
            - "Originator.${org_id}.unauth_rate_bps_trailing == 0 AND unauth_rate_bps_mtd == 0"
            - "Originator.${org_id}.outstanding_exposure_gross_cents == 0 AND outstanding_exposure_debit_cents == 0"
            - "Originator.${org_id}.version == 1"

      - name: file_create_missing_sec_code_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.AchFile.fields.sec_code, "errors[ERR_INVALID_REQUEST]", "validations[priority=5]"]
        distinguishing_aspect: "Omitting required field sec_code at intake yields ERR_INVALID_REQUEST (400) before any state check."
        test_recipe:
          setup: ["Originator registered and ACTIVE"]
          setup_api_calls:
            - call: "POST /ach/originators"
              payload: { legal_name: "Req Co", sec_codes_allowed: ["CCD"] }
              as: OdfiUnderwriter
              captures: { org_id: "$.data.id", org_v: "$.data.version" }
            - call: "PATCH /ach/originators/${org_id}"
              payload: { expected_originator_version: "${org_v}", decision: "APPROVE", exposure_limit_cents: 1000000, fee_discount_bps: 0 }
              as: OdfiUnderwriter
            - call: "POST /ach/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: OdfiOperations
          trigger:
            - call: "POST /ach/ach-files"
              payload: { requested_window_kind: "NEXT_DAY", effective_date: "2026-08-03" }
              as: OriginatorOps
              as_user_id: "${org_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_INVALID_REQUEST (http 400)"

      - name: get_originator_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "Reading a random UUID that was never registered returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /ach/originators/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: OdfiOperations
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_NOT_FOUND (http 404)"

      - name: return_with_unknown_code_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.ReturnCase.fields.return_code, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "return_code R99 is outside {R01,R02,R05,R07,R10} and is rejected as malformed input, not as a state error."
        test_recipe:
          setup:
            - "Originator ACTIVE; file with 1 DEBIT entry 100000 settled on 2026-08-03"
          setup_api_calls:
            - call: "POST /ach/cutoff-windows"
              payload: { window_kind: "NEXT_DAY", opens_at_utc: "00:00", closes_at_utc: "23:00", per_entry_fee_cents: 60, file_fee_cents: 200, large_entry_surcharge_cents: 100 }
              as: OdfiOperations
            - call: "POST /ach/originators"
              payload: { legal_name: "Enum Co", sec_codes_allowed: ["CCD"] }
              as: OdfiUnderwriter
              captures: { org_id: "$.data.id", org_v: "$.data.version" }
            - call: "PATCH /ach/originators/${org_id}"
              payload: { expected_originator_version: "${org_v}", decision: "APPROVE", exposure_limit_cents: 10000000, fee_discount_bps: 0 }
              as: OdfiUnderwriter
            - call: "POST /ach/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: OdfiOperations
            - call: "POST /ach/ach-files"
              payload: { sec_code: "CCD", requested_window_kind: "NEXT_DAY", effective_date: "2026-08-03" }
              as: OriginatorOps
              as_user_id: "${org_id}"
              captures: { f_id: "$.data.id", f_v: "$.data.version" }
            - call: "POST /ach/ach-files/${f_id}/entries"
              payload:
                expected_file_version: "${f_v}"
                entries:
                  - { direction: "DEBIT", amount_cents: 100000, receiver_account: "en-1", receiver_routing: "123456789" }
              as: OriginatorOps
              as_user_id: "${org_id}"
            - call: "POST /ach/ach-files/${f_id}/release"
              payload: {}
              as: OdfiOperations
              captures: { b_id: "$.data.settlement_batch_id" }
            - call: "POST /ach/settlement-batches/${b_id}/advance"
              payload: { action: "DISPATCH" }
              as: OdfiOperations
              as_user_id: "ops-1"
            - call: "POST /ach/settlement-batches/${b_id}/advance"
              payload: { action: "SETTLE" }
              as: OdfiOperations
              as_user_id: "ops-1"
            - call: "GET /ach/ach-files/${f_id}/entries"
              payload: {}
              as: OdfiOperations
              captures: { e_id: "$.data[0].id" }
          trigger:
            - call: "POST /ach/ach-entries/${e_id}/returns"
              payload: { return_code: "R99" }
              as: OdfiOperations
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_INVALID_REQUEST (http 400)"
            - "AchEntry.${e_id}.status == SETTLED (unchanged); no ReturnCase created"

      - name: snapshot_and_posting_are_immutable_event_records
        claim_type: immutability
        grounds: [entities.ReturnRateSnapshot, entities.GlPosting]
        distinguishing_aspect: "common_fields: false entities carry id + created_at only: snapshot responses expose no version field and the API surface has no PATCH/DELETE for snapshots or GL postings."
        test_recipe:
          setup: ["Originator ACTIVE (no files needed — a zero-denominator snapshot is legal)"]
          setup_api_calls:
            - call: "POST /ach/originators"
              payload: { legal_name: "Imm Co", sec_codes_allowed: ["PPD"] }
              as: OdfiUnderwriter
              captures: { org_id: "$.data.id", org_v: "$.data.version" }
            - call: "PATCH /ach/originators/${org_id}"
              payload: { expected_originator_version: "${org_v}", decision: "APPROVE", exposure_limit_cents: 1000000, fee_discount_bps: 0 }
              as: OdfiUnderwriter
          trigger:
            - call: "POST /ach/originators/${org_id}/return-rate-snapshots"
              payload: {}
              as: OdfiRiskOfficer
              captures: { snap_id: "$.data.id" }
          assert:
            - "ReturnRateSnapshot.${snap_id} response has NO version field and no updated_at field"
            - "ReturnRateSnapshot.${snap_id}.rate_bps_trailing_60d == 0 AND rate_bps_mtd == 0 AND breach == false (empty denominator -> 0)"
            - "GET /ach/originators/${org_id}/return-rate-snapshots returns exactly 1 row"

      - name: file_list_pagination_and_status_filter
        claim_type: listing
        grounds: [response_envelope.pagination_defaults, "endpoints(GET /ach/ach-files)"]
        distinguishing_aspect: "Pagination envelope fields (limit/offset/total_count/has_more) and the status filter compose: 2 files, limit=1 -> total_count 2, has_more true; status filter WAREHOUSED vs CANCELLED partitions them."
        test_recipe:
          setup:
            - "Originator ACTIVE; two WAREHOUSED files created; second one then cancelled"
          setup_api_calls:
            - call: "POST /ach/cutoff-windows"
              payload: { window_kind: "NEXT_DAY", opens_at_utc: "00:00", closes_at_utc: "23:00", per_entry_fee_cents: 60, file_fee_cents: 200, large_entry_surcharge_cents: 100 }
              as: OdfiOperations
            - call: "POST /ach/originators"
              payload: { legal_name: "Page Co", sec_codes_allowed: ["CCD"] }
              as: OdfiUnderwriter
              captures: { org_id: "$.data.id", org_v: "$.data.version" }
            - call: "PATCH /ach/originators/${org_id}"
              payload: { expected_originator_version: "${org_v}", decision: "APPROVE", exposure_limit_cents: 1000000, fee_discount_bps: 0 }
              as: OdfiUnderwriter
            - call: "POST /ach/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: OdfiOperations
            - call: "POST /ach/ach-files"
              payload: { sec_code: "CCD", requested_window_kind: "NEXT_DAY", effective_date: "2026-08-03" }
              as: OriginatorOps
              as_user_id: "${org_id}"
              captures: { fa_id: "$.data.id" }
            - call: "POST /ach/ach-files"
              payload: { sec_code: "CCD", requested_window_kind: "NEXT_DAY", effective_date: "2026-08-03" }
              as: OriginatorOps
              as_user_id: "${org_id}"
              captures: { fb_id: "$.data.id" }
            - call: "POST /ach/ach-files/${fb_id}/cancel"
              payload: {}
              as: OriginatorOps
              as_user_id: "${org_id}"
          trigger:
            - call: "GET /ach/ach-files"
              payload: { originator_id: "${org_id}", limit: 1 }
              as: OdfiOperations
            - call: "GET /ach/ach-files"
              payload: { originator_id: "${org_id}", status: "CANCELLED" }
              as: OdfiOperations
          assert:
            - "First call: total_count == 2, data has exactly 1 row (${fa_id} — created_at ASC), has_more == true"
            - "Second call: exactly 1 row (${fb_id}); a status=WAREHOUSED call would return exactly ${fa_id}"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: release_already_released_file_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.AchFile.WAREHOUSED_to_RELEASED, "errors[ERR_FILE_NOT_WAREHOUSED]"]
        distinguishing_aspect: "Second release of a RELEASED file fails with ERR_FILE_NOT_WAREHOUSED; no duplicate batch assignment occurs."
        test_recipe:
          setup: ["Originator ACTIVE; file with 1 DEBIT entry 100000 released at 2026-08-03T10:00Z"]
          setup_api_calls:
            - call: "POST /ach/cutoff-windows"
              payload: { window_kind: "NEXT_DAY", opens_at_utc: "00:00", closes_at_utc: "23:00", per_entry_fee_cents: 60, file_fee_cents: 200, large_entry_surcharge_cents: 100 }
              as: OdfiOperations
            - call: "POST /ach/originators"
              payload: { legal_name: "State Co", sec_codes_allowed: ["CCD"] }
              as: OdfiUnderwriter
              captures: { org_id: "$.data.id", org_v: "$.data.version" }
            - call: "PATCH /ach/originators/${org_id}"
              payload: { expected_originator_version: "${org_v}", decision: "APPROVE", exposure_limit_cents: 10000000, fee_discount_bps: 0 }
              as: OdfiUnderwriter
            - call: "POST /ach/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: OdfiOperations
            - call: "POST /ach/ach-files"
              payload: { sec_code: "CCD", requested_window_kind: "NEXT_DAY", effective_date: "2026-08-03" }
              as: OriginatorOps
              as_user_id: "${org_id}"
              captures: { f_id: "$.data.id", f_v: "$.data.version" }
            - call: "POST /ach/ach-files/${f_id}/entries"
              payload:
                expected_file_version: "${f_v}"
                entries:
                  - { direction: "DEBIT", amount_cents: 100000, receiver_account: "st-1", receiver_routing: "123456789" }
              as: OriginatorOps
              as_user_id: "${org_id}"
            - call: "POST /ach/ach-files/${f_id}/release"
              payload: {}
              as: OdfiOperations
              captures: { b_id: "$.data.settlement_batch_id" }
          trigger:
            - call: "POST /ach/ach-files/${f_id}/release"
              payload: {}
              as: OdfiOperations
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_FILE_NOT_WAREHOUSED (http 409)"
            - "AchFile.${f_id}.settlement_batch_id unchanged (still ${b_id})"

      - name: settle_open_batch_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.SettlementBatch.OPEN_to_DISPATCHED, "errors[ERR_BATCH_NOT_OPEN]"]
        distinguishing_aspect: "settle on an OPEN (never dispatched) batch is rejected ERR_BATCH_NOT_OPEN; the linear chain may not skip DISPATCHED."
        test_recipe:
          setup: ["Originator ACTIVE; file released (batch B auto-created OPEN)"]
          setup_api_calls:
            - call: "POST /ach/cutoff-windows"
              payload: { window_kind: "NEXT_DAY", opens_at_utc: "00:00", closes_at_utc: "23:00", per_entry_fee_cents: 60, file_fee_cents: 200, large_entry_surcharge_cents: 100 }
              as: OdfiOperations
            - call: "POST /ach/originators"
              payload: { legal_name: "Batch Co", sec_codes_allowed: ["CCD"] }
              as: OdfiUnderwriter
              captures: { org_id: "$.data.id", org_v: "$.data.version" }
            - call: "PATCH /ach/originators/${org_id}"
              payload: { expected_originator_version: "${org_v}", decision: "APPROVE", exposure_limit_cents: 10000000, fee_discount_bps: 0 }
              as: OdfiUnderwriter
            - call: "POST /ach/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: OdfiOperations
            - call: "POST /ach/ach-files"
              payload: { sec_code: "CCD", requested_window_kind: "NEXT_DAY", effective_date: "2026-08-03" }
              as: OriginatorOps
              as_user_id: "${org_id}"
              captures: { f_id: "$.data.id", f_v: "$.data.version" }
            - call: "POST /ach/ach-files/${f_id}/entries"
              payload:
                expected_file_version: "${f_v}"
                entries:
                  - { direction: "DEBIT", amount_cents: 100000, receiver_account: "bt-1", receiver_routing: "123456789" }
              as: OriginatorOps
              as_user_id: "${org_id}"
            - call: "POST /ach/ach-files/${f_id}/release"
              payload: {}
              as: OdfiOperations
              captures: { b_id: "$.data.settlement_batch_id" }
          trigger:
            - call: "POST /ach/settlement-batches/${b_id}/advance"
              payload: { action: "SETTLE" }
              as: OdfiOperations
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_BATCH_NOT_OPEN (http 409)"
            - "SettlementBatch.${b_id}.status == OPEN (unchanged)"

      - name: double_resolve_risk_case_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.RiskCase.OPEN_to_RESOLVED, "errors[ERR_RISK_CASE_ALREADY_RESOLVED]"]
        distinguishing_aspect: "RESOLVED is terminal: a second resolve on the same case fails ERR_RISK_CASE_ALREADY_RESOLVED and does not re-apply the originator transition."
        test_recipe:
          setup: ["Originator ACTIVE; one MANUAL RiskCase opened"]
          setup_api_calls:
            - call: "POST /ach/originators"
              payload: { legal_name: "Lock Co", sec_codes_allowed: ["PPD"] }
              as: OdfiUnderwriter
              captures: { org_id: "$.data.id", org_v: "$.data.version" }
            - call: "PATCH /ach/originators/${org_id}"
              payload: { expected_originator_version: "${org_v}", decision: "APPROVE", exposure_limit_cents: 5000000, fee_discount_bps: 0 }
              as: OdfiUnderwriter
            - call: "POST /ach/originators/${org_id}/risk-cases"
              payload: {}
              as: OdfiRiskOfficer
              captures: { rc_id: "$.data.id" }
            - call: "POST /ach/risk-cases/${rc_id}/resolve"
              payload: { action: "DISMISS" }
              as: OdfiRiskOfficer
          trigger:
            - call: "POST /ach/risk-cases/${rc_id}/resolve"
              payload: { action: "WATCH" }
              as: OdfiRiskOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_RISK_CASE_ALREADY_RESOLVED (http 409)"
            - "Originator.${org_id}.status == ACTIVE (first resolution DISMISS left it unchanged; second resolve did not fire)"

      - name: advance_transmitted_reversal_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.ReversalRequest.REQUESTED_to_TRANSMITTED, "errors[ERR_REVERSAL_NOT_ACTIONABLE]"]
        distinguishing_aspect: "TRANSMIT on an already-TRANSMITTED reversal fails ERR_REVERSAL_NOT_ACTIONABLE (no double transmission)."
        test_recipe:
          setup: ["Originator ACTIVE; DEBIT entry 100000 settled 2026-08-03; reversal created (REQUESTED) and transmitted"]
          setup_api_calls:
            - call: "POST /ach/cutoff-windows"
              payload: { window_kind: "NEXT_DAY", opens_at_utc: "00:00", closes_at_utc: "23:00", per_entry_fee_cents: 60, file_fee_cents: 200, large_entry_surcharge_cents: 100 }
              as: OdfiOperations
            - call: "POST /ach/originators"
              payload: { legal_name: "Adv Co", sec_codes_allowed: ["CCD"] }
              as: OdfiUnderwriter
              captures: { org_id: "$.data.id", org_v: "$.data.version" }
            - call: "PATCH /ach/originators/${org_id}"
              payload: { expected_originator_version: "${org_v}", decision: "APPROVE", exposure_limit_cents: 10000000, fee_discount_bps: 0 }
              as: OdfiUnderwriter
            - call: "POST /ach/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: OdfiOperations
            - call: "POST /ach/ach-files"
              payload: { sec_code: "CCD", requested_window_kind: "NEXT_DAY", effective_date: "2026-08-03" }
              as: OriginatorOps
              as_user_id: "${org_id}"
              captures: { f_id: "$.data.id", f_v: "$.data.version" }
            - call: "POST /ach/ach-files/${f_id}/entries"
              payload:
                expected_file_version: "${f_v}"
                entries:
                  - { direction: "DEBIT", amount_cents: 100000, receiver_account: "ad-1", receiver_routing: "123456789" }
              as: OriginatorOps
              as_user_id: "${org_id}"
            - call: "POST /ach/ach-files/${f_id}/release"
              payload: {}
              as: OdfiOperations
              captures: { b_id: "$.data.settlement_batch_id" }
            - call: "POST /ach/settlement-batches/${b_id}/advance"
              payload: { action: "DISPATCH" }
              as: OdfiOperations
              as_user_id: "ops-1"
            - call: "POST /ach/settlement-batches/${b_id}/advance"
              payload: { action: "SETTLE" }
              as: OdfiOperations
              as_user_id: "ops-1"
            - call: "GET /ach/ach-files/${f_id}/entries"
              payload: {}
              as: OdfiOperations
              captures: { e_id: "$.data[0].id" }
            - call: "POST /ach/ach-entries/${e_id}/reversals"
              payload: { reason: "DUPLICATE_ENTRY" }
              as: OriginatorOps
              as_user_id: "${org_id}"
              captures: { rv_id: "$.data.id" }
            - call: "POST /ach/reversal-requests/${rv_id}/advance"
              payload: { action: "TRANSMIT" }
              as: OdfiOperations
          trigger:
            - call: "POST /ach/reversal-requests/${rv_id}/advance"
              payload: { action: "TRANSMIT" }
              as: OdfiOperations
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_REVERSAL_NOT_ACTIONABLE (http 409)"
            - "ReversalRequest.${rv_id}.status == TRANSMITTED (unchanged)"

      - name: return_on_warehoused_entry_returns_invalid_state
        claim_type: precondition_enforcement
        grounds: [state_machines.AchEntry.SETTLED_to_RETURNED, "errors[ERR_ENTRY_NOT_SETTLED]"]
        distinguishing_aspect: "Returns are registerable only after settlement; a WAREHOUSED entry rejects with ERR_ENTRY_NOT_SETTLED."
        test_recipe:
          setup: ["Originator ACTIVE; file with 1 DEBIT entry 100000, never released"]
          setup_api_calls:
            - call: "POST /ach/cutoff-windows"
              payload: { window_kind: "NEXT_DAY", opens_at_utc: "00:00", closes_at_utc: "23:00", per_entry_fee_cents: 60, file_fee_cents: 200, large_entry_surcharge_cents: 100 }
              as: OdfiOperations
            - call: "POST /ach/originators"
              payload: { legal_name: "Ware Co", sec_codes_allowed: ["CCD"] }
              as: OdfiUnderwriter
              captures: { org_id: "$.data.id", org_v: "$.data.version" }
            - call: "PATCH /ach/originators/${org_id}"
              payload: { expected_originator_version: "${org_v}", decision: "APPROVE", exposure_limit_cents: 10000000, fee_discount_bps: 0 }
              as: OdfiUnderwriter
            - call: "POST /ach/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: OdfiOperations
            - call: "POST /ach/ach-files"
              payload: { sec_code: "CCD", requested_window_kind: "NEXT_DAY", effective_date: "2026-08-03" }
              as: OriginatorOps
              as_user_id: "${org_id}"
              captures: { f_id: "$.data.id", f_v: "$.data.version" }
            - call: "POST /ach/ach-files/${f_id}/entries"
              payload:
                expected_file_version: "${f_v}"
                entries:
                  - { direction: "DEBIT", amount_cents: 100000, receiver_account: "wh-1", receiver_routing: "123456789" }
              as: OriginatorOps
              as_user_id: "${org_id}"
            - call: "GET /ach/ach-files/${f_id}/entries"
              payload: {}
              as: OdfiOperations
              captures: { e_id: "$.data[0].id" }
          trigger:
            - call: "POST /ach/ach-entries/${e_id}/returns"
              payload: { return_code: "R01" }
              as: OdfiOperations
              captures: { err: "$.data.error_id" }
          assert:
            - "err == ERR_ENTRY_NOT_SETTLED (http 409); AchEntry.${e_id}.status == WAREHOUSED"

      - name: represent_settled_entry_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.AchEntry.RETURNED_to_TRANSMITTED, "errors[ERR_ENTRY_NOT_RETURNED]"]
        distinguishing_aspect: "Re-presentment requires RETURNED; on a SETTLED entry it fails ERR_ENTRY_NOT_RETURNED."
        test_recipe:
          setup: ["Originator ACTIVE; DEBIT entry 100000 settled 2026-08-03"]
          setup_api_calls:
            - call: "POST /ach/cutoff-windows"
              payload: { window_kind: "NEXT_DAY", opens_at_utc: "00:00", closes_at_utc: "23:00", per_entry_fee_cents: 60, file_fee_cents: 200, large_entry_surcharge_cents: 100 }
              as: OdfiOperations
            - call: "POST /ach/originators"
              payload: { legal_name: "Rep Co", sec_codes_allowed: ["CCD"] }
              as: OdfiUnderwriter
              captures: { org_id: "$.data.id", org_v: "$.data.version" }
            - call: "PATCH /ach/originators/${org_id}"
              payload: { expected_originator_version: "${org_v}", decision: "APPROVE", exposure_limit_cents: 10000000, fee_discount_bps: 0 }
              as: OdfiUnderwriter
            - call: "POST /ach/_clock/set_current_utc"
