# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Cashback & Receipt-Rebate Rewards — 9 rule_ids x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: reward_rate_online_vs_in_store_diverge
        grounds:
          - calculations.reward_amount_computation
          - entities.RewardClaim.fields.amount_cents
          - entities.RewardClaim.fields.attribution
        distinguishing_aspect: "Same purchase_amount_cents=10000 on the same merchant yields a different amount_cents for ONLINE (linked rate variant) vs IN_STORE (rebate variant) — this dual-variant lives on the RewardClaim entity domain."
        test_recipe:
          setup:
            - "Merchant M: online_rate_bps=500, instore_rate_bps=200, double_dip_allowed=true, attribution_window_hours=168."
            - "LINKED offer OL (bonus_rate_bps=300, min_spend_cents=5000) and RECEIPT_REBATE offer OR (rebate_cents=300, min_spend_cents=2000), both active over 2026-01-01..2027-01-01."
            - "Member MB with a ClickThrough on M; one ONLINE claim (purchase 10000) and one approved IN_STORE receipt (purchase 10000)."
          setup_api_calls:
            - call: "POST /merchants"
              payload: { name: "M", online_rate_bps: 500, instore_rate_bps: 200, double_dip_allowed: true, attribution_window_hours: 168, maturity_hold_days: 30 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /offers"
              payload: { merchant_id: "${m_id}", offer_type: "LINKED", bonus_rate_bps: 300, min_spend_cents: 5000, starts_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { ol_id: $.data.id }
            - call: "POST /offers"
              payload: { merchant_id: "${m_id}", offer_type: "RECEIPT_REBATE", rebate_cents: 300, min_spend_cents: 2000, starts_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { or_id: $.data.id }
            - call: "POST /members"
              payload: { email: "mb@x.com" }
              as: PlatformAdmin
              captures: { mb_id: $.data.id }
            - call: "POST /clickthroughs"
              payload: { member_id: "${mb_id}", merchant_id: "${m_id}", offer_id: "${ol_id}" }
              as: Member
              as_user_id: "${mb_id}"
              captures: { click_id: $.data.id }
            - call: "POST /reward-claims"
              payload: { member_id: "${mb_id}", merchant_id: "${m_id}", click_through_id: "${click_id}", offer_id: "${ol_id}", purchase_amount_cents: 10000 }
              as: Member
              as_user_id: "${mb_id}"
              captures: { online_claim_id: $.data.id }
            - call: "POST /receipt-scans"
              payload: { member_id: "${mb_id}", merchant_id: "${m_id}", offer_id: "${or_id}", purchase_total_cents: 10000, purchased_at: "2026-01-01T06:00:00Z" }
              as: Member
              as_user_id: "${mb_id}"
              captures: { rs_id: $.data.id }
            - call: "POST /receipt-scans/${rs_id}/start-review"
              payload: {}
              as: ReviewAgent
          trigger:
            - call: "POST /receipt-scans/${rs_id}/approve"
              payload: { review_note: "ok" }
              as: ReviewAgent
              captures: { instore_claim_id: $.data.reward_claim_id }
          assert:
            - "RewardClaim.${online_claim_id}.amount_cents == 800"
            - "RewardClaim.${instore_claim_id}.amount_cents == 460"
            - "RewardClaim.${online_claim_id}.amount_cents != RewardClaim.${instore_claim_id}.amount_cents"

      - name: wallet_gross_available_vs_net_cashoutable_diverge
        grounds:
          - calculations.wallet_balance_reconciliation
          - entities.Member.fields.available_balance_cents
          - entities.Member.fields.net_cashoutable_cents
          - state_machines.RewardClaim.AVAILABLE_to_RESERVED
        distinguishing_aspect: "After one of two AVAILABLE claims is RESERVED by an open CashOut, Member.available_balance_cents stays at the unreserved sum while net_cashoutable_cents drops — the dual-variant lives on the Member (wallet) entity domain, distinct from the RewardClaim rate variants."
        test_recipe:
          setup:
            - "Member MB VERIFIED with two matured AVAILABLE online claims of 1000 cents each (net_cashoutable 2000)."
            - "Clock advanced past maturity so both claims are AVAILABLE."
          setup_api_calls:
            - call: "POST /merchants"
              payload: { name: "M", online_rate_bps: 1000, instore_rate_bps: 200, maturity_hold_days: 30 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /members"
              payload: { email: "mb2@x.com" }
              as: PlatformAdmin
              captures: { mb_id: $.data.id }
            - call: "POST /members/${mb_id}/verify"
              payload: {}
              as: FinanceAdmin
            - call: "POST /clickthroughs"
              payload: { member_id: "${mb_id}", merchant_id: "${m_id}" }
              as: Member
              as_user_id: "${mb_id}"
              captures: { click1: $.data.id }
            - call: "POST /reward-claims"
              payload: { member_id: "${mb_id}", merchant_id: "${m_id}", click_through_id: "${click1}", purchase_amount_cents: 10000 }
              as: Member
              as_user_id: "${mb_id}"
              captures: { claim1: $.data.id }
            - call: "POST /clickthroughs"
              payload: { member_id: "${mb_id}", merchant_id: "${m_id}" }
              as: Member
              as_user_id: "${mb_id}"
              captures: { click2: $.data.id }
            - call: "POST /reward-claims"
              payload: { member_id: "${mb_id}", merchant_id: "${m_id}", click_through_id: "${click2}", purchase_amount_cents: 10000 }
              as: Member
              as_user_id: "${mb_id}"
              captures: { claim2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-15T00:00:00Z" }
              as: FinanceAdmin
            - call: "GET /members/${mb_id}"
              payload: {}
              as: Member
              as_user_id: "${mb_id}"
              captures: { mb_ver: $.data.version }
          trigger:
            - call: "POST /cashouts"
              payload: { member_id: "${mb_id}", method: "PAYPAL", requested_amount_cents: 1000, expected_member_version: "${mb_ver}" }
              as: Member
              as_user_id: "${mb_id}"
              captures: { co_id: $.data.id }
          assert:
            - "Member.${mb_id}.available_balance_cents == 1000"
            - "Member.${mb_id}.reserved_balance_cents == 1000"
            - "Member.${mb_id}.net_cashoutable_cents == 1000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: reward_amount_mode_a_three_input_rate_selection
        grounds:
          - calculations.reward_amount_computation
          - entities.Offer.fields.bonus_rate_bps
          - entities.Merchant.fields.online_rate_bps
        distinguishing_aspect: "MODE (a): amount_cents = floor(purchase * min(online_rate_bps + linked bonus_rate_bps, RATE_CAP_BPS) / 10000) — three inputs (merchant rate, offer bonus, purchase) with a non-linear min() cap that binds at 6000+300 -> 5000."
        test_recipe:
          setup:
            - "Merchant with online_rate_bps=4800; LINKED offer bonus_rate_bps=400 (min_spend 0); a click; online claim purchase 10000."
            - "4800+400=5200 capped to RATE_CAP_BPS=5000 -> floor(10000*5000/10000)=5000."
          setup_api_calls:
            - call: "POST /merchants"
              payload: { name: "M", online_rate_bps: 4800, instore_rate_bps: 200, maturity_hold_days: 30 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /offers"
              payload: { merchant_id: "${m_id}", offer_type: "LINKED", bonus_rate_bps: 400, min_spend_cents: 0, starts_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { ol_id: $.data.id }
            - call: "POST /members"
              payload: { email: "mc@x.com" }
              as: PlatformAdmin
              captures: { mc_id: $.data.id }
            - call: "POST /clickthroughs"
              payload: { member_id: "${mc_id}", merchant_id: "${m_id}", offer_id: "${ol_id}" }
              as: Member
              as_user_id: "${mc_id}"
              captures: { click_id: $.data.id }
          trigger:
            - call: "POST /reward-claims"
              payload: { member_id: "${mc_id}", merchant_id: "${m_id}", click_through_id: "${click_id}", offer_id: "${ol_id}", purchase_amount_cents: 10000 }
              as: Member
              as_user_id: "${mc_id}"
              captures: { claim_id: $.data.id }
          assert:
            - "RewardClaim.${claim_id}.amount_cents == 5000"

      - name: cashout_fee_mode_c_circular_tier_pinned_on_gross
        grounds:
          - calculations.cashout_payout_and_fee
          - entities.CashOut.fields.fee_cents
          - entities.CashOut.fields.net_payout_cents
        distinguishing_aspect: "MODE (c): fee depends on the GROSS-keyed tier and net depends on fee; pinning the tier on gross (1000 < LARGE_CASHOUT_CENTS=5000 -> 2% small fee) makes fee_cents=20, net_payout_cents=980 well-defined — keying on net would loop."
        test_recipe:
          setup:
            - "Member VERIFIED with a single 1000-cent AVAILABLE claim; PAYPAL cash-out of 1000."
          setup_api_calls:
            - call: "POST /merchants"
              payload: { name: "M", online_rate_bps: 1000, instore_rate_bps: 200, maturity_hold_days: 30 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /members"
              payload: { email: "md@x.com" }
              as: PlatformAdmin
              captures: { md_id: $.data.id }
            - call: "POST /members/${md_id}/verify"
              payload: {}
              as: FinanceAdmin
            - call: "POST /clickthroughs"
              payload: { member_id: "${md_id}", merchant_id: "${m_id}" }
              as: Member
              as_user_id: "${md_id}"
              captures: { click_id: $.data.id }
            - call: "POST /reward-claims"
              payload: { member_id: "${md_id}", merchant_id: "${m_id}", click_through_id: "${click_id}", purchase_amount_cents: 10000 }
              as: Member
              as_user_id: "${md_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-15T00:00:00Z" }
              as: FinanceAdmin
            - call: "GET /members/${md_id}"
              payload: {}
              as: Member
              as_user_id: "${md_id}"
              captures: { md_ver: $.data.version }
          trigger:
            - call: "POST /cashouts"
              payload: { member_id: "${md_id}", method: "PAYPAL", requested_amount_cents: 1000, expected_member_version: "${md_ver}" }
              as: Member
              as_user_id: "${md_id}"
              captures: { co_id: $.data.id }
          assert:
            - "CashOut.${co_id}.fee_cents == 20"
            - "CashOut.${co_id}.net_payout_cents == 980"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: receipt_scan_reject_then_resubmit_cycle
        grounds:
          - state_machines.ReceiptScan.IN_REVIEW_to_REJECTED
          - state_machines.ReceiptScan.REJECTED_to_IN_REVIEW
          - state_machines.ReceiptScan.IN_REVIEW_to_APPROVED
        distinguishing_aspect: "CYCLE on ReceiptScan: REJECTED -> IN_REVIEW (resubmit) re-enters review and a subsequent approve succeeds — a back-edge the linear pipelines lack."
        test_recipe:
          setup:
            - "Receipt scan rejected once, then resubmitted to IN_REVIEW."
          setup_api_calls:
            - call: "POST /merchants"
              payload: { name: "M", online_rate_bps: 500, instore_rate_bps: 200, maturity_hold_days: 30 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /offers"
              payload: { merchant_id: "${m_id}", offer_type: "RECEIPT_REBATE", rebate_cents: 300, min_spend_cents: 0, starts_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { or_id: $.data.id }
            - call: "POST /members"
              payload: { email: "me@x.com" }
              as: PlatformAdmin
              captures: { me_id: $.data.id }
            - call: "POST /receipt-scans"
              payload: { member_id: "${me_id}", merchant_id: "${m_id}", offer_id: "${or_id}", purchase_total_cents: 8000, purchased_at: "2026-01-01T06:00:00Z" }
              as: Member
              as_user_id: "${me_id}"
              captures: { rs_id: $.data.id }
            - call: "POST /receipt-scans/${rs_id}/start-review"
              payload: {}
              as: ReviewAgent
            - call: "POST /receipt-scans/${rs_id}/reject"
              payload: { review_note: "blurry" }
              as: ReviewAgent
            - call: "POST /receipt-scans/${rs_id}/start-review"
              payload: {}
              as: ReviewAgent
          trigger:
            - call: "POST /receipt-scans/${rs_id}/approve"
              payload: { review_note: "clear now" }
              as: ReviewAgent
              captures: { claim_id: $.data.reward_claim_id }
          assert:
            - "ReceiptScan.${rs_id}.status == APPROVED"
            - "RewardClaim.${claim_id}.attribution == IN_STORE"

      - name: member_parallel_account_and_verification_dimensions
        grounds:
          - state_machines.Member.account_status
          - state_machines.Member.verification_status
          - entities.Member.fields.account_status
          - entities.Member.fields.verification_status
        distinguishing_aspect: "PARALLEL dimensions on Member: verify (UNVERIFIED->VERIFIED) and suspend (ACTIVE->SUSPENDED) evolve independently; after both, account_status==SUSPENDED and verification_status==VERIFIED coexist on the same row — a different entity than ReceiptScan's cycle."
        test_recipe:
          setup:
            - "A freshly registered member."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "mf@x.com" }
              as: PlatformAdmin
              captures: { mf_id: $.data.id }
            - call: "POST /members/${mf_id}/verify"
              payload: {}
              as: FinanceAdmin
          trigger:
            - call: "POST /members/${mf_id}/suspend"
              payload: {}
              as: FinanceAdmin
          assert:
            - "Member.${mf_id}.account_status == SUSPENDED"
            - "Member.${mf_id}.verification_status == VERIFIED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: return_on_reserved_claim_fails_cashout_and_reverts_siblings
        grounds:
          - state_machines.RewardClaim.RESERVED_to_CLAWED_BACK
          - state_machines.CashOut.PROCESSING_to_FAILED
          - state_machines.RewardClaim.RESERVED_to_AVAILABLE
          - calculations.clawback_amount
        distinguishing_aspect: "Depth-3 cascade from POST /return-events: (A) return -> target claim RESERVED->CLAWED_BACK; (B) that clawback -> owning CashOut->FAILED; (C) that failure -> sibling RESERVED claim reverts to AVAILABLE. Each hop is caused by the previous, not the original action."
        test_recipe:
          setup:
            - "Member VERIFIED with two matured AVAILABLE claims of 1000 cents each, both RESERVED by one PAYPAL cash-out of 2000 in REQUESTED."
          setup_api_calls:
            - call: "POST /merchants"
              payload: { name: "M", online_rate_bps: 1000, instore_rate_bps: 200, maturity_hold_days: 30 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /members"
              payload: { email: "mg@x.com" }
              as: PlatformAdmin
              captures: { mg_id: $.data.id }
            - call: "POST /members/${mg_id}/verify"
              payload: {}
              as: FinanceAdmin
            - call: "POST /clickthroughs"
              payload: { member_id: "${mg_id}", merchant_id: "${m_id}" }
              as: Member
              as_user_id: "${mg_id}"
              captures: { click1: $.data.id }
            - call: "POST /reward-claims"
              payload: { member_id: "${mg_id}", merchant_id: "${m_id}", click_through_id: "${click1}", purchase_amount_cents: 10000 }
              as: Member
              as_user_id: "${mg_id}"
              captures: { claim1: $.data.id }
            - call: "POST /clickthroughs"
              payload: { member_id: "${mg_id}", merchant_id: "${m_id}" }
              as: Member
              as_user_id: "${mg_id}"
              captures: { click2: $.data.id }
            - call: "POST /reward-claims"
              payload: { member_id: "${mg_id}", merchant_id: "${m_id}", click_through_id: "${click2}", purchase_amount_cents: 10000 }
              as: Member
              as_user_id: "${mg_id}"
              captures: { claim2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-15T00:00:00Z" }
              as: FinanceAdmin
            - call: "GET /members/${mg_id}"
              payload: {}
              as: Member
              as_user_id: "${mg_id}"
              captures: { mg_ver: $.data.version }
            - call: "POST /cashouts"
              payload: { member_id: "${mg_id}", method: "PAYPAL", requested_amount_cents: 2000, expected_member_version: "${mg_ver}" }
              as: Member
              as_user_id: "${mg_id}"
              captures: { co_id: $.data.id }
          trigger:
            - call: "POST /return-events"
              payload: { reward_claim_id: "${claim1}", returned_amount_cents: 10000 }
              as: FinanceAdmin
              captures: { re_id: $.data.id }
          assert:
            - "RewardClaim.${claim1}.status == CLAWED_BACK"
            - "CashOut.${co_id}.status == FAILED"
            - "RewardClaim.${claim2}.status == AVAILABLE"

      - name: receipt_approve_spawns_claim_and_pending_ledger_entry
        grounds:
          - state_machines.ReceiptScan.IN_REVIEW_to_APPROVED
          - entities.RewardClaim.fields.status
          - entities.LedgerEntry.fields.entry_type
        distinguishing_aspect: "Depth-2 cascade from POST /receipt-scans/{id}/approve: (A) approve -> creates a PENDING RewardClaim; (B) that claim's creation -> emits a CLAIM_PENDING LedgerEntry. Originates from a different trigger (receipt approve) than the return cascade."
        test_recipe:
          setup:
            - "Receipt scan IN_REVIEW under a RECEIPT_REBATE offer (rebate 300, instore 200bps), purchase 8000."
          setup_api_calls:
            - call: "POST /merchants"
              payload: { name: "M", online_rate_bps: 500, instore_rate_bps: 200, maturity_hold_days: 30 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /offers"
              payload: { merchant_id: "${m_id}", offer_type: "RECEIPT_REBATE", rebate_cents: 300, min_spend_cents: 2000, starts_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { or_id: $.data.id }
            - call: "POST /members"
              payload: { email: "mh@x.com" }
              as: PlatformAdmin
              captures: { mh_id: $.data.id }
            - call: "POST /receipt-scans"
              payload: { member_id: "${mh_id}", merchant_id: "${m_id}", offer_id: "${or_id}", purchase_total_cents: 8000, purchased_at: "2026-01-01T06:00:00Z" }
              as: Member
              as_user_id: "${mh_id}"
              captures: { rs_id: $.data.id }
            - call: "POST /receipt-scans/${rs_id}/start-review"
              payload: {}
              as: ReviewAgent
          trigger:
            - call: "POST /receipt-scans/${rs_id}/approve"
              payload: { review_note: "ok" }
              as: ReviewAgent
              captures: { claim_id: $.data.reward_claim_id }
          assert:
            - "RewardClaim.${claim_id}.status == PENDING"
            - "RewardClaim.${claim_id}.amount_cents == 460"
            - "Member.${mh_id}.pending_balance_cents == 460"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: forbidden_beats_below_minimum_on_cashout
        grounds:
          - validations[priority=2]
          - validations[priority=14]
        distinguishing_aspect: "A ReviewAgent (forbidden on POST /cashouts) sends a below-minimum PayPal cash-out; auth (priority 2, category auth) wins over business_fiscal (priority 14) -> ERR_FORBIDDEN, not ERR_BELOW_CASHOUT_MINIMUM."
        test_recipe:
          setup:
            - "A verified member exists; ReviewAgent attempts the cash-out."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "mi@x.com" }
              as: PlatformAdmin
              captures: { mi_id: $.data.id }
            - call: "POST /members/${mi_id}/verify"
              payload: {}
              as: FinanceAdmin
            - call: "GET /members/${mi_id}"
              payload: {}
              as: FinanceAdmin
              captures: { mi_ver: $.data.version }
          trigger:
            - call: "POST /cashouts"
              payload: { member_id: "${mi_id}", method: "PAYPAL", requested_amount_cents: 100, expected_member_version: "${mi_ver}" }
              as: ReviewAgent
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_FORBIDDEN"
            - "response.status == 403"

      - name: invalid_state_beats_min_spend_on_receipt_approve
        grounds:
          - validations[priority=6]
          - validations[priority=13]
        distinguishing_aspect: "Approving a SUBMITTED (not IN_REVIEW) receipt whose purchase is below min_spend: state precondition (priority 6, category state) wins over business_constraint min-spend (priority 13) -> ERR_INVALID_STATE, not ERR_MIN_SPEND_NOT_MET."
        test_recipe:
          setup:
            - "Receipt scan still SUBMITTED (review not started); purchase 1000 below offer min_spend 2000."
          setup_api_calls:
            - call: "POST /merchants"
              payload: { name: "M", online_rate_bps: 500, instore_rate_bps: 200, maturity_hold_days: 30 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /offers"
              payload: { merchant_id: "${m_id}", offer_type: "RECEIPT_REBATE", rebate_cents: 300, min_spend_cents: 2000, starts_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { or_id: $.data.id }
            - call: "POST /members"
              payload: { email: "mj@x.com" }
              as: PlatformAdmin
              captures: { mj_id: $.data.id }
            - call: "POST /receipt-scans"
              payload: { member_id: "${mj_id}", merchant_id: "${m_id}", offer_id: "${or_id}", purchase_total_cents: 1000, purchased_at: "2026-01-01T06:00:00Z" }
              as: Member
              as_user_id: "${mj_id}"
              captures: { rs_id: $.data.id }
          trigger:
            - call: "POST /receipt-scans/${rs_id}/approve"
              payload: { review_note: "x" }
              as: ReviewAgent
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response.status == 409"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: cashout_minimum_inclusive_boundary_paypal
        grounds:
          - calculations.cashout_threshold_eligibility
          - validations[priority=14]
          - entities.CashOut.fields.requested_amount_cents
        distinguishing_aspect: "Numeric threshold boundary: requested_amount_cents exactly MIN_PAYPAL_CENTS=500 is accepted (>= inclusive); 499 is rejected with ERR_BELOW_CASHOUT_MINIMUM. Tested via POST /cashouts."
        test_recipe:
          setup:
            - "Member VERIFIED with exactly 500 cents AVAILABLE (matured claim of 500)."
          setup_api_calls:
            - call: "POST /merchants"
              payload: { name: "M", online_rate_bps: 500, instore_rate_bps: 200, maturity_hold_days: 30 }
              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /members"
              payload: { email: "mk@x.com" }
              as: PlatformAdmin
              captures: { mk_id: $.data.id }
