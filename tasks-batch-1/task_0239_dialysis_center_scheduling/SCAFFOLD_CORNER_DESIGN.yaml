# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe. Taxonomy sections/claim_types per references/claim-extraction-guide.md.
# Flat topology; every create payload carries its body FK. OCC versions come from
# server responses. Stubs (excluded_because) cite §1.8 instances by name.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_clinic_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Clinic, endpoints]
        distinguishing_aspect: "POST /clinics with {name} returns 201, status=OPEN, dialyzer_reuse_limit default 12, version 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /clinics"
              payload: { name: "Solo Clinic" }
              as: ClinicAdmin
              captures: { cid: $.data.id, ver: $.data.version, st: $.data.status, lim: $.data.dialyzer_reuse_limit }
          assert:
            - "data.status == OPEN"
            - "data.dialyzer_reuse_limit == 12"
            - "data.version == 1"

      - name: get_clinic_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_CLINIC_NOT_FOUND]"]
        distinguishing_aspect: "GET /clinics/{unknown} returns ERR_CLINIC_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /clinics/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ClinicAdmin
              captures: { err: $.data.error_id }
          assert:
            - "data.error_id == ERR_CLINIC_NOT_FOUND"
            - "HTTP status 404"

      - name: create_order_missing_required_modality
        claim_type: Required Fields
        grounds: [entities.NephrologistOrder.fields.modality, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /orders without modality returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A clinic and patient exist."]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "ReqClinic" }
              as: ClinicAdmin
              captures: { cid: $.data.id }
            - call: "POST /patients"
              payload: { clinic_id: "${cid}", mrn: "RQ1", full_name: "Req One" }
              as: Scheduler
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { patient_id: "${pid}", effective_from_date: "2026-06-01" }
              as: Nephrologist
              captures: { err: $.data.error_id }
          assert:
            - "data.error_id == ERR_INVALID_REQUEST"
            - "HTTP status 400"

      - name: create_patient_default_kind_and_payer
        claim_type: Defaults
        grounds: [entities.Patient.fields.patient_kind, entities.Patient.fields.payer_class, entities.Patient.fields.account_balance_cents]
        distinguishing_aspect: "POST /patients omitting patient_kind/payer_class applies RESIDENT/STANDARD defaults; account_balance_cents starts 0, adherence_status GOOD_STANDING."
        test_recipe:
          setup: ["A clinic exists."]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "DefClinic" }
              as: ClinicAdmin
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /patients"
              payload: { clinic_id: "${cid}", mrn: "DEF1", full_name: "Def One" }
              as: Scheduler
              captures: { pk: $.data.patient_kind, pc: $.data.payer_class, bal: $.data.account_balance_cents, adh: $.data.adherence_status }
          assert:
            - "data.patient_kind == RESIDENT"
            - "data.payer_class == STANDARD"
            - "data.account_balance_cents == 0 and data.adherence_status == GOOD_STANDING"

      - name: system_fields_generated_on_create
        claim_type: System Fields
        grounds: [entities.Clinic]
        distinguishing_aspect: "id/created_at/updated_at/version are server-minted on POST /clinics; status is forced to OPEN regardless of any client hint."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /clinics"
              payload: { name: "SysClinic" }
              as: ClinicAdmin
              captures: { cid: $.data.id, ca: $.data.created_at, st: $.data.status }
          assert:
            - "data.id is a server UUID with no type prefix"
            - "data.created_at is ISO 8601 UTC with three fractional digits and data.status == OPEN"

      - name: list_patients_pagination_envelope
        claim_type: Listing
        grounds: [entities.Patient, endpoints]
        distinguishing_aspect: "GET /patients returns response_type array with total_count and has_more pagination fields."
        test_recipe:
          setup: ["A clinic with one patient."]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "ListClinic" }
              as: ClinicAdmin
              captures: { cid: $.data.id }
            - call: "POST /patients"
              payload: { clinic_id: "${cid}", mrn: "L1", full_name: "List One" }
              as: Scheduler
              captures: { pid: $.data.id }
          trigger:
            - call: "GET /patients?clinic_id=${cid}&limit=10&offset=0"
              payload: {}
              as: Scheduler
          assert:
            - "response envelope response_type == array; meta.total_count == 1; meta.has_more == false"

      - name: computed_dialyzer_reuse_count_initial_zero
        claim_type: Computed Fields
        grounds: [entities.Machine.fields.dialyzer_reuse_count]
        distinguishing_aspect: "Machine.dialyzer_reuse_count is computed and initialized to 0 on create regardless of any input."
        test_recipe:
          setup: ["A clinic exists."]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "MachClinic" }
              as: ClinicAdmin
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /machines"
              payload: { clinic_id: "${cid}", asset_tag: "MX1", model: "Test" }
              as: ClinicAdmin
              captures: { rc: $.data.dialyzer_reuse_count, st: $.data.status }
          assert:
            - "data.dialyzer_reuse_count == 0 and data.status == AVAILABLE"

      - name: create_order_bad_modality_enum
        claim_type: Type Constraints
        grounds: [entities.NephrologistOrder.fields.modality, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /orders with modality=PLASMA (not in enum) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A clinic and patient exist."]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "EnumClinic" }
              as: ClinicAdmin
              captures: { cid: $.data.id }
            - call: "POST /patients"
              payload: { clinic_id: "${cid}", mrn: "EN1", full_name: "Enum One" }
              as: Scheduler
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { patient_id: "${pid}", modality: "PLASMA", effective_from_date: "2026-06-01" }
              as: Nephrologist
              captures: { err: $.data.error_id }
          assert:
            - "data.error_id == ERR_INVALID_REQUEST"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: cancel_session_from_cancelled_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.TreatmentSession.BOOKED_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling an already-CANCELLED session returns ERR_INVALID_STATE (409); no side effects fire."
        test_recipe:
          setup: ["A BOOKED session is cancelled, then cancelled again."]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "InvClinic" }
              as: ClinicAdmin
              captures: { cid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T07:00:00Z" }
              as: ClinicAdmin
            - call: "POST /machines"
              payload: { clinic_id: "${cid}", asset_tag: "IM1", model: "T" }
              as: ClinicAdmin
              captures: { mid: $.data.id }
            - call: "POST /stations"
              payload: { clinic_id: "${cid}", chair_label: "IC1", machine_id: "${mid}" }
              as: ClinicAdmin
              captures: { sid: $.data.id }
            - call: "POST /shifts"
              payload: { clinic_id: "${cid}", code: "AM", day_pattern: "MWF", start_minute: 360, end_minute: 600 }
              as: ClinicAdmin
              captures: { shid: $.data.id }
            - call: "POST /patients"
              payload: { clinic_id: "${cid}", mrn: "IV1", full_name: "Inv One" }
              as: Scheduler
              captures: { pid: $.data.id, pv0: $.data.version }
            - call: "POST /orders"
              payload: { patient_id: "${pid}", modality: "HEMODIALYSIS", effective_from_date: "2026-06-01" }
              as: Nephrologist
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/activate"
              payload: {}
              as: Nephrologist
            - call: "POST /sessions"
              payload: { patient_id: "${pid}", order_id: "${oid}", station_id: "${sid}", shift_id: "${shid}", service_date: "2026-06-01", expected_patient_version: "${pv0}" }
              as: Scheduler
              captures: { sess: $.data.id }
            - call: "POST /sessions/${sess}/cancel"
              payload: {}
              as: Scheduler
          trigger:
            - call: "POST /sessions/${sess}/cancel"
              payload: {}
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "data.error_id == ERR_INVALID_STATE"
            - "HTTP status 409"

      - name: complete_session_from_booked_requires_checked_in
        claim_type: Invalid Transitions
        grounds: [state_machines.TreatmentSession.CHECKED_IN_to_COMPLETED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /sessions/{id}/complete on a BOOKED (not CHECKED_IN) session returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A BOOKED session never checked in."]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "CmpClinic" }
              as: ClinicAdmin
              captures: { cid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T07:00:00Z" }
              as: ClinicAdmin
            - call: "POST /machines"
              payload: { clinic_id: "${cid}", asset_tag: "CM1", model: "T" }
              as: ClinicAdmin
              captures: { mid: $.data.id }
            - call: "POST /stations"
              payload: { clinic_id: "${cid}", chair_label: "CC1", machine_id: "${mid}" }
              as: ClinicAdmin
              captures: { sid: $.data.id }
            - call: "POST /shifts"
              payload: { clinic_id: "${cid}", code: "AM", day_pattern: "MWF", start_minute: 360, end_minute: 600 }
              as: ClinicAdmin
              captures: { shid: $.data.id }
            - call: "POST /patients"
              payload: { clinic_id: "${cid}", mrn: "CP1", full_name: "Cmp One" }
              as: Scheduler
              captures: { pid: $.data.id, pv0: $.data.version }
            - call: "POST /orders"
              payload: { patient_id: "${pid}", modality: "HEMODIALYSIS", effective_from_date: "2026-06-01" }
              as: Nephrologist
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/activate"
              payload: {}
              as: Nephrologist
            - call: "POST /sessions"
              payload: { patient_id: "${pid}", order_id: "${oid}", station_id: "${sid}", shift_id: "${shid}", service_date: "2026-06-01", expected_patient_version: "${pv0}" }
              as: Scheduler
              captures: { sess: $.data.id }
          trigger:
            - call: "POST /sessions/${sess}/complete"
              payload: {}
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "data.error_id == ERR_INVALID_STATE"

      - name: activate_second_order_blocked_by_active_one
        claim_type: Precondition Enforcement
        grounds: [state_machines.NephrologistOrder.DRAFT_to_ACTIVE, "errors[ERR_ACTIVE_ORDER_EXISTS]"]
        distinguishing_aspect: "Activating a second order while the patient already has an ACTIVE order returns ERR_ACTIVE_ORDER_EXISTS (409)."
        test_recipe:
          setup: ["A patient with one ACTIVE order and a second DRAFT order."]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "ActClinic" }
              as: ClinicAdmin
              captures: { cid: $.data.id }
            - call: "POST /patients"
              payload: { clinic_id: "${cid}", mrn: "AC1", full_name: "Act One" }
              as: Scheduler
              captures: { pid: $.data.id }
            - call: "POST /orders"
              payload: { patient_id: "${pid}", modality: "HEMODIALYSIS", effective_from_date: "2026-06-01" }
              as: Nephrologist
              captures: { o1: $.data.id }
            - call: "POST /orders/${o1}/activate"
              payload: {}
              as: Nephrologist
            - call: "POST /orders"
              payload: { patient_id: "${pid}", modality: "PERITONEAL", effective_from_date: "2026-06-01" }
              as: Nephrologist
              captures: { o2: $.data.id }
          trigger:
            - call: "POST /orders/${o2}/activate"
              payload: {}
              as: Nephrologist
              captures: { err: $.data.error_id }
          assert:
            - "data.error_id == ERR_ACTIVE_ORDER_EXISTS"

      - name: lab_order_initial_state_scheduled
        claim_type: Initial State
        grounds: [state_machines.LabOrder, entities.LabOrder.fields.status]
        distinguishing_aspect: "A newly created LabOrder starts in status SCHEDULED."
        test_recipe:
          setup: ["A clinic and patient."]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "LabClinic" }
              as: ClinicAdmin
              captures: { cid: $.data.id }
            - call: "POST /patients"
              payload: { clinic_id: "${cid}", mrn: "LB1", full_name: "Lab One" }
              as: Scheduler
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /lab-orders"
              payload: { patient_id: "${pid}", panel: "MONTHLY_CHEM", scheduled_date: "2026-06-15" }
              as: Nephrologist
              captures: { st: $.data.status }
          assert:
            - "data.status == SCHEDULED"

      - name: collect_lab_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.LabOrder.SCHEDULED_to_COLLECTED, state_machines.LabOrder.SCHEDULED_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "After a LabOrder is COLLECTED (terminal), cancelling it returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A COLLECTED lab order."]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "LabClinic2" }
              as: ClinicAdmin
              captures: { cid: $.data.id }
            - call: "POST /patients"
              payload: { clinic_id: "${cid}", mrn: "LB2", full_name: "Lab Two" }
              as: Scheduler
              captures: { pid: $.data.id }
            - call: "POST /lab-orders"
              payload: { patient_id: "${pid}", panel: "CBC", scheduled_date: "2026-06-15" }
              as: Scheduler
              captures: { lid: $.data.id }
            - call: "POST /lab-orders/${lid}/collect"
              payload: {}
              as: Scheduler
          trigger:
            - call: "POST /lab-orders/${lid}/cancel"
              payload: {}
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "data.error_id == ERR_INVALID_STATE"

      - name: check_in_idempotency_second_call_rejected
        claim_type: Idempotency
        grounds: [state_machines.TreatmentSession.BOOKED_to_CHECKED_IN, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Checking in an already CHECKED_IN session a second time returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A CHECKED_IN session."]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "IdemClinic" }
              as: ClinicAdmin
              captures: { cid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T07:00:00Z" }
              as: ClinicAdmin
            - call: "POST /machines"
              payload: { clinic_id: "${cid}", asset_tag: "ID1", model: "T" }
              as: ClinicAdmin
              captures: { mid: $.data.id }
            - call: "POST /stations"
              payload: { clinic_id: "${cid}", chair_label: "ID1", machine_id: "${mid}" }
              as: ClinicAdmin
              captures: { sid: $.data.id }
            - call: "POST /shifts"
              payload: { clinic_id: "${cid}", code: "AM", day_pattern: "MWF", start_minute: 360, end_minute: 600 }
              as: ClinicAdmin
              captures: { shid: $.data.id }
            - call: "POST /patients"
              payload: { clinic_id: "${cid}", mrn: "ID1", full_name: "Idem One" }
              as: Scheduler
              captures: { pid: $.data.id, pv0: $.data.version }
            - call: "POST /orders"
              payload: { patient_id: "${pid}", modality: "HEMODIALYSIS", effective_from_date: "2026-06-01" }
              as: Nephrologist
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/activate"
              payload: {}
              as: Nephrologist
            - call: "POST /sessions"
              payload: { patient_id: "${pid}", order_id: "${oid}", station_id: "${sid}", shift_id: "${shid}", service_date: "2026-06-01", expected_patient_version: "${pv0}" }
              as: Scheduler
              captures: { sess: $.data.id }
            - call: "POST /sessions/${sess}/check-in"
              payload: {}
              as: Scheduler
          trigger:
            - call: "POST /sessions/${sess}/check-in"
              payload: {}
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "data.error_id == ERR_INVALID_STATE"

      - name: machine_maintenance_cycle_disinfect_resets_count
        claim_type: Side Effect Execution
        grounds: [state_machines.Machine.IN_MAINTENANCE_to_AVAILABLE, entities.Machine.fields.dialyzer_reuse_count]
        distinguishing_aspect: "complete-maintenance with disinfect=true resets dialyzer_reuse_count to 0 after a prior COMPLETED HD session raised it to 1."
        test_recipe:
          setup: ["A machine with dialyzer_reuse_count 1 (from one COMPLETED HD session), then put into and out of maintenance with disinfect."]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "DisClinic", dialyzer_reuse_limit: 12 }
              as: ClinicAdmin
              captures: { cid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T07:00:00Z" }
              as: ClinicAdmin
            - call: "POST /machines"
              payload: { clinic_id: "${cid}", asset_tag: "DS1", model: "T" }
              as: ClinicAdmin
              captures: { mid: $.data.id }
            - call: "POST /stations"
              payload: { clinic_id: "${cid}", chair_label: "DS1", machine_id: "${mid}" }
              as: ClinicAdmin
              captures: { sid: $.data.id }
            - call: "POST /shifts"
              payload: { clinic_id: "${cid}", code: "AM", day_pattern: "MWF", start_minute: 360, end_minute: 600 }
              as: ClinicAdmin
              captures: { shid: $.data.id }
            - call: "POST /patients"
              payload: { clinic_id: "${cid}", mrn: "DS1", full_name: "Dis One" }
              as: Scheduler
              captures: { pid: $.data.id, pv0: $.data.version }
            - call: "POST /orders"
              payload: { patient_id: "${pid}", modality: "HEMODIALYSIS", effective_from_date: "2026-06-01" }
              as: Nephrologist
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/activate"
              payload: {}
              as: Nephrologist
            - call: "POST /sessions"
              payload: { patient_id: "${pid}", order_id: "${oid}", station_id: "${sid}", shift_id: "${shid}", service_date: "2026-06-01", expected_patient_version: "${pv0}" }
              as: Scheduler
              captures: { sess: $.data.id }
            - call: "POST /sessions/${sess}/check-in"
              payload: {}
              as: Scheduler
            - call: "POST /sessions/${sess}/complete"
              payload: {}
              as: Scheduler
            - call: "POST /machines/${mid}/start-maintenance"
              payload: {}
              as: ClinicAdmin
          trigger:
            - call: "POST /machines/${mid}/complete-maintenance"
              payload: { disinfect: true }
              as: ClinicAdmin
              captures: { rc: $.data.dialyzer_reuse_count, st: $.data.status }
          assert:
            - "data.dialyzer_reuse_count == 0 and data.status == AVAILABLE"

      - name: order_revoke_cascade_session_transport_account
        claim_type: Compensation
        grounds: [state_machines.NephrologistOrder.ACTIVE_to_REVOKED]
        excluded_because:
          difficulty_instance: order_revoke_cascades_session_transport_account
          rationale: "The depth-3 order-revoke cascade and its account reversal are fully asserted by the named §1.8 instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: session_charge_standard_with_addons
        claim_type: Correct Result
        grounds: [calculations.session_charge, entities.TreatmentSession.fields.billed_amount_cents]
        distinguishing_aspect: "STANDARD HEMODIALYSIS with epo_units=4000 (4 blocks) and iron_ordered=true bills 28500 + 4*1200 + 4500 = 37800."
        test_recipe:
          setup: ["A STANDARD patient with an ACTIVE HD order (epo 4000, iron) and a CHECKED_IN session."]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "ChgClinic", dialyzer_reuse_limit: 12 }
              as: ClinicAdmin
              captures: { cid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T07:00:00Z" }
              as: ClinicAdmin
            - call: "POST /machines"
              payload: { clinic_id: "${cid}", asset_tag: "CG1", model: "T" }
              as: ClinicAdmin
              captures: { mid: $.data.id }
            - call: "POST /stations"
              payload: { clinic_id: "${cid}", chair_label: "CG1", machine_id: "${mid}" }
              as: ClinicAdmin
              captures: { sid: $.data.id }
            - call: "POST /shifts"
              payload: { clinic_id: "${cid}", code: "AM", day_pattern: "MWF", start_minute: 360, end_minute: 600 }
              as: ClinicAdmin
              captures: { shid: $.data.id }
            - call: "POST /patients"
              payload: { clinic_id: "${cid}", mrn: "CG1", full_name: "Chg One", payer_class: "STANDARD", coinsurance_pct: 0.0 }
              as: Scheduler
              captures: { pid: $.data.id, pv0: $.data.version }
            - call: "POST /orders"
              payload: { patient_id: "${pid}", modality: "HEMODIALYSIS", epo_units: 4000, iron_ordered: true, effective_from_date: "2026-06-01" }
              as: Nephrologist
              captures: { oid: $.data.id }
            - call: "POST /orders/${oid}/activate"
              payload: {}
              as: Nephrologist
            - call: "POST /sessions"
              payload: { patient_id: "${pid}", order_id: "${oid}", station_id: "${sid}", shift_id: "${shid}", service_date: "2026-06-01", expected_patient_version: "${pv0}" }
              as: Scheduler
              captures: { sess: $.data.id }
            - call: "POST /sessions/${sess}/check-in"
              payload: {}
              as: Scheduler
          trigger:
            - call: "POST /sessions/${sess}/complete"
              payload: {}
              as: Scheduler
              captures: { billed: $.data.billed_amount_cents }
          assert:
            - "data.billed_amount_cents == 37800"

      - name: transport_fare_shared_discount_rounding
        claim_type: Correct Result
        grounds: [calculations.transport_fare, entities.TransportTrip.fields.fare_cents]
        distinguishing_aspect: "miles=12, shared_ride=true, no surcharges: round(0.75 * (800 + 2650)) = round(2587.5) = 2588 fare_cents (no add-ons)."
        test_recipe:
          setup: ["A BOOKED session with a transport request."]
          setup_api_calls:
            - call: "POST /clinics"
              payload: { name: "TfClinic" }
              as: ClinicAdmin
              captures: { cid: $.data.id }
