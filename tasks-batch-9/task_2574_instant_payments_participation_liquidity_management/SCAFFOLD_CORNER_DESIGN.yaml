              payload: { participant_id: "${pa_id}", segment: "CORPORATE", per_transaction_limit_cents: 250000000, daily_aggregate_limit_cents: 500000000, rolling_window_count_limit: 5, rolling_window_amount_limit_cents: 400000000, effective_from: "2026-08-01T00:00:00Z", expected_participant_version: "${pa_v_stale}" }
              as: ParticipantAdmin
              as_user_id: "${pa_id}"
              captures: { pol1_id: $.data.id }
            - call: "GET /participants/${pa_id}"
              payload: {}
              as: ParticipantAdmin
              as_user_id: "${pa_id}"
              captures: { pa_v_fresh: $.data.version }
          trigger:
            - call: "POST /segment-policies"
              payload: { participant_id: "${pa_id}", segment: "CORPORATE", per_transaction_limit_cents: 300000000, daily_aggregate_limit_cents: 600000000, rolling_window_count_limit: 6, rolling_window_amount_limit_cents: 500000000, effective_from: "2026-08-03T00:00:00Z", supersede_open_ended: true, expected_participant_version: "${pa_v_stale}" }
              as: ParticipantAdmin
              as_user_id: "${pa_id}"
              captures: { err: $.data.error_id }
          assert:
            - "The response is HTTP 412 and ${err} == ERR_STALE_PARTICIPANT_VERSION"
            - "${pa_v_fresh} is exactly one greater than ${pa_v_stale}, so the first policy write did increment the participant version"
            - "CustomerSegmentPolicy.${pol1_id} still has superseded_at null, effective_to null and per_transaction_limit_cents 250000000 - nothing was closed by the refused write"
            - "Re-issuing the identical body with ${pa_v_fresh} succeeds, stamps ${pol1_id}.superseded_at and effective_to at 2026-08-03T00:00:00Z and leaves exactly one governing CORPORATE policy"

      - name: velocity_count_threshold_boundary_and_window_reset
        claim_type: rate_threshold_triggers
        grounds:
          - validations[priority=94]
          - calculations.velocity_window_usage
          - errors[ERR_VELOCITY_LIMIT_EXCEEDED]
          - global_constants.VELOCITY_WINDOW_MINUTES
        distinguishing_aspect: "The velocity gate is a cumulative count over a 60-minute half-open window, so the second transfer is admitted at exactly the limit, the third is refused, and once the clock passes both earlier rows out of the window the same customer is admitted again - the counter resets by time rather than by an operator action."
        test_recipe:
          setup:
            - "Alpha National Bank is LIVE with a position account of 1,200,000,000 cents (floor 200,000,000) and a CORPORATE policy whose rolling_window_count_limit is 2, with generous amount limits (per transaction 250,000,000, daily 500,000,000, rolling amount 400,000,000)."
            - "CUST-ALPHA-0001 (baseline 20) sends 5,000,000 cents at 13:00 and again at 13:10; both score 20 + 20 + 0 + 12 = 52, x 1.1 = 57.2 -> 57 and stay INITIATED."
            - "The clock is then advanced to 13:20 for the refused attempt and later to 14:11, at which point the 60-minute window is [13:11, 14:11) and excludes both earlier rows."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T13:00:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /participants"
              payload: { legal_name: "Alpha National Bank", routing_number: "021000021", settlement_agent_reference: "SA-ALPHA-01", participation_model: "SEND_AND_RECEIVE" }
              as: NetworkOperator
              as_user_id: "netops-01"
              captures: { pa_id: $.data.id }
            - call: "POST /position-accounts"
              payload: { participant_id: "${pa_id}", opening_balance_cents: 1200000000, warning_threshold_cents: 1100000000, critical_threshold_cents: 1000000000, floor_cents: 200000000 }
              as: LiquidityOfficer
              as_user_id: "liq-01"
              captures: { acct_id: $.data.id }
            - call: "POST /participants/${pa_id}/attestation"
              payload: { attestation_document_reference: "ATT-ALPHA-2026-08" }
              as: ParticipantAdmin
              as_user_id: "${pa_id}"
            - call: "POST /participants/${pa_id}/certification-window"
              payload: { certification_test_suite_version: "CERT-2026.2" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /participants/${pa_id}/certification-results"
              payload: { outcome: "PASS" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /participants/${pa_id}/activation"
              payload: { go_live_business_date: "2026-08-03" }
              as: NetworkOperator
              as_user_id: "netops-01"
              captures: { pa_v: $.data.version }
            - call: "POST /segment-policies"
              payload: { participant_id: "${pa_id}", segment: "CORPORATE", per_transaction_limit_cents: 250000000, daily_aggregate_limit_cents: 500000000, rolling_window_count_limit: 2, rolling_window_amount_limit_cents: 400000000, effective_from: "2026-08-01T00:00:00Z", expected_participant_version: "${pa_v}" }
              as: ParticipantAdmin
              as_user_id: "${pa_id}"
            - call: "POST /customer-accounts"
              payload: { participant_id: "${pa_id}", segment: "CORPORATE", account_reference: "CUST-ALPHA-0001", fraud_risk_baseline: 20 }
              as: ParticipantAdmin
              as_user_id: "${pa_id}"
              captures: { ca_id: $.data.id }
            - call: "GET /position-accounts/${acct_id}"
              payload: {}
              as: PaymentOperator
              as_user_id: "ops-alpha-01"
              captures: { acct_v1: $.data.version }
            - call: "POST /credit-transfers"
              payload: { originator_participant_id: "${pa_id}", customer_account_id: "${ca_id}", receiver_routing_number: "021000089", amount_cents: 5000000, expected_position_account_version: "${acct_v1}" }
              as: PaymentOperator
              as_user_id: "ops-alpha-01"
              captures: { t1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T13:10:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "GET /position-accounts/${acct_id}"
              payload: {}
              as: PaymentOperator
              as_user_id: "ops-alpha-01"
              captures: { acct_v2: $.data.version }
            - call: "POST /credit-transfers"
              payload: { originator_participant_id: "${pa_id}", customer_account_id: "${ca_id}", receiver_routing_number: "021000089", amount_cents: 5000000, expected_position_account_version: "${acct_v2}" }
              as: PaymentOperator
              as_user_id: "ops-alpha-01"
              captures: { t2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T13:20:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "GET /position-accounts/${acct_id}"
              payload: {}
              as: PaymentOperator
              as_user_id: "ops-alpha-01"
              captures: { acct_v3: $.data.version }
          trigger:
            - call: "POST /credit-transfers"
              payload: { originator_participant_id: "${pa_id}", customer_account_id: "${ca_id}", receiver_routing_number: "021000089", amount_cents: 5000000, expected_position_account_version: "${acct_v3}" }
              as: PaymentOperator
              as_user_id: "ops-alpha-01"
              captures: { err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T14:11:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "GET /position-accounts/${acct_id}"
              payload: {}
              as: PaymentOperator
              as_user_id: "ops-alpha-01"
              captures: { acct_v4: $.data.version }
            - call: "POST /credit-transfers"
              payload: { originator_participant_id: "${pa_id}", customer_account_id: "${ca_id}", receiver_routing_number: "021000089", amount_cents: 5000000, expected_position_account_version: "${acct_v4}" }
              as: PaymentOperator
              as_user_id: "ops-alpha-01"
              captures: { t4_id: $.data.id }
          assert:
            - "The 13:20 attempt returns HTTP 422 with ${err} == ERR_VELOCITY_LIMIT_EXCEEDED, because window_count 2 plus this one exceeds the limit of 2"
            - "CreditTransfer.${t1_id} and CreditTransfer.${t2_id} are both INITIATED with fraud_score 57, so the second transfer was admitted while sitting exactly on the count limit"
            - "The 14:11 attempt returns HTTP 201: the window [13:11, 14:11) contains neither 13:00 nor 13:10, so window_count is 0 and CreditTransfer.${t4_id}.fraud_score == 57 with no velocity term"
            - "PrefundedPositionAccount.${acct_id}.reserved_cents == 15000000 at the end (three INITIATED transfers of 5000000) with available_cents 1185000000"

      - name: cascading_side_effects_layer_covered_by_difficulty_design
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - state_machines.CreditTransfer.ACCEPTED_to_SETTLED
        excluded_because:
          difficulty_instance: settlement_cascade_five_hops_to_sibling_parking
          rationale: "That difficulty instance already walks a single settlement through five ordered hops - ledger entry, balance, tier re-band, alert, posture and sibling parking - and asserts each hop's observable state, which is exactly the end-to-end and ordering-sensitivity claim for this layer; the return-honour counterpart is covered by return_honor_cascade_five_hops_to_queue_release."

      - name: dual_variant_calculation_layer_covered_by_difficulty_design
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.fraud_score
          - calculations.reconciliation_variance
        excluded_because:
          difficulty_instance: fraud_score_origination_vs_review_final_diverge
          rationale: "Both dual-variant calculations already have divergence instances in the difficulty design - fraud_score there and reconciliation_variance in reconciliation_variance_provisional_vs_final_diverge - each computing both variants on identical stored rows and pinning the delta, which is the whole claim for this layer."

  - section: consistency_model
    instances:
      - name: ledger_adjustment_response_reflects_completed_cascade
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /position-accounts/{id}/ledger-adjustments]
          - calculations.liquidity_alert_tier
          - calculations.operational_posture_derivation
        distinguishing_aspect: "The consistency model is immediate, so a single withdrawal call must return an entry whose balance_after_cents already includes the movement, and every dependent projection - account balance, tier, the freshly opened alert and the participant posture - must be readable in full straight after that one call, with no sweep or second write needed."
        test_recipe:
          setup:
            - "Alpha National Bank is LIVE with a position account opened at 1,200,000,000 cents (warning 1,100,000,000 / critical 1,000,000,000 / floor 200,000,000), alert_tier GREEN, posture NORMAL and last_ledger_sequence_no 0."
            - "No ledger entries exist yet, because opening an account seeds the balance without posting one."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T13:00:00Z" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /participants"
              payload: { legal_name: "Alpha National Bank", routing_number: "021000021", settlement_agent_reference: "SA-ALPHA-01", participation_model: "SEND_AND_RECEIVE" }
              as: NetworkOperator
              as_user_id: "netops-01"
              captures: { pa_id: $.data.id }
            - call: "POST /position-accounts"
              payload: { participant_id: "${pa_id}", opening_balance_cents: 1200000000, warning_threshold_cents: 1100000000, critical_threshold_cents: 1000000000, floor_cents: 200000000 }
              as: LiquidityOfficer
              as_user_id: "liq-01"
              captures: { acct_id: $.data.id }
            - call: "POST /participants/${pa_id}/attestation"
              payload: { attestation_document_reference: "ATT-ALPHA-2026-08" }
              as: ParticipantAdmin
              as_user_id: "${pa_id}"
            - call: "POST /participants/${pa_id}/certification-window"
              payload: { certification_test_suite_version: "CERT-2026.2" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /participants/${pa_id}/certification-results"
              payload: { outcome: "PASS" }
              as: NetworkOperator
              as_user_id: "netops-01"
            - call: "POST /participants/${pa_id}/activation"
              payload: { go_live_business_date: "2026-08-03" }
              as: NetworkOperator
              as_user_id: "netops-01"
          trigger:
            - call: "POST /position-accounts/${acct_id}/ledger-adjustments"
              payload: { entry_type: "WITHDRAWAL_DEBIT", magnitude_cents: 150000000, reference: "TREASURY-SWEEP-02" }
              as: LiquidityOfficer
              as_user_id: "liq-01"
              captures: { entry_balance: $.data.balance_after_cents, entry_seq: $.data.sequence_no }
            - call: "GET /position-accounts/${acct_id}"
              payload: {}
              as: LiquidityOfficer
              as_user_id: "liq-01"
            - call: "GET /position-accounts/${acct_id}/alerts"
              payload: { status: "OPEN", limit: 10, offset: 0 }
              as: LiquidityOfficer
              as_user_id: "liq-01"
            - call: "GET /participants/${pa_id}"
              payload: {}
              as: LiquidityOfficer
              as_user_id: "liq-01"
          assert:
            - "The write response itself already carries ${entry_balance} == 1050000000, ${entry_seq} == 1, amount_cents -150000000 and business_date 2026-08-03"
            - "The account read shows current_balance_cents 1050000000, reserved_cents 0, available_cents 1050000000, alert_tier AMBER and last_ledger_sequence_no 1"
            - "The alerts read returns exactly one OPEN alert with tier AMBER, threshold_cents 1100000000 and observed_balance_cents 1050000000, total_count 1"
            - "The participant read shows operational_posture THROTTLED, so the posture derivation ran inside the same write rather than lagging behind it"
