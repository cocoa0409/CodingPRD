# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 2918 — Reverse Logistics & Returns Processing Center
#
# Every instance grounds in elements already declared in SCAFFOLD.yaml §1.1–§1.7.
# Every numeric literal in every `assert:` was computed by executing the relevant
# §1.3 formula against its declared constants (workspace/.scratch_step2/verify18.py).
#
# Shared fixture conventions used by every instance below:
#   * The logical clock starts at 2026-08-01T00:00:00Z (the scaffold's declared
#     startup default); instances that need a later instant set it explicitly.
#   * RMAs are created with order_placed_at 2026-07-25T00:00:00Z and expires_at
#     2026-09-01T00:00:00Z, so every ReturnLine gets days_since_order == 7 and the
#     restocking-fee late band is 0.00.
#   * Receipt gross_weight_grams is set to exactly the expected weight
#     (200 tare + 1200 per authorized unit) unless the instance probes empty-box
#     detection, so empty_box_suspected is false and the EMPTY_BOX FraudCheck passes.
#   * Opaque-role X-User-IDs are pinned whenever segregation of duties is in play:
#     u_admin, u_clerk, u_grader, u_tech, u_qa, u_super, u_analyst.

scaffold_difficulty_design:

  # ===================================================================== #
  # RULE 1 — dual_variant_calc                                            #
  # Instance 1 domain: ReturnLine / DispositionOrder unit-recovery accounting.
  # Instance 2 domain: Client portfolio-level settlement posture.
  # ===================================================================== #
  - rule_id: dual_variant_calc
    instances:
      - name: recovery_value_provisional_vs_final_on_return_line
        grounds:
          - calculations.return_line_recovery_value
          - calculations.disposition_net_recovery
          - entities.ReturnLine.fields.recovery_value_cents
          - entities.DispositionOrder.fields.net_recovery_cents
          - state_machines.DispositionOrder.APPROVED_to_EXECUTED
          - calculations.disposition_audit_report
        distinguishing_aspect: |
          Both variants of return_line_recovery_value are asserted on the ReturnLine /
          DispositionOrder unit-recovery accounting domain: provisional_at_grade is the pure
          catalog estimate (20000 declared x 0.40 grade C x 0.90 DEFECTIVE penalty = 7200) and
          final_at_execution is the realized channel result (12000 gross - 2160 channel fee -
          0 refurb = 9840) overwriting the SAME ReturnLine.recovery_value_cents field, leaving a
          recovery variance of exactly 2640. The second dual_variant_calc instance operates on
          the Client entity's settlement balance, so the two instances share no entity.
        test_recipe:
          setup:
            - "Client CLLIQ: SL_STANDARD, CLIENT_OWNED, restock_grade_floor A, liquidation_floor_pct 0.30, donation_allowed false, fraud_tolerance_cents 100000000 so no fraud check can fail."
            - "CatalogItem WIDGET-1: declared_value_cents 20000, unit_weight_grams 1200, not serialized, not refurb_eligible, secondary_market_floor_cents 1000, hazard_class NONE, regulated_flag false."
            - "An AUCTION channel with fee_pct 0.12, accepted_grades A/B/C/D, min_lot_value_cents 0, concurrent_lot_capacity 5, price_index_pct at its 1.0 default."
            - "One ISSUED RMA with one authorized line (quantity 1, reason DEFECTIVE), fully received in one Receipt weighing exactly the expected 1400 grams, then graded C."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Liquidation Client", client_code: "CLLIQ", service_level: "SL_STANDARD", inventory_ownership: "CLIENT_OWNED", restock_grade_floor: "A", refund_hold_hours: 48, liquidation_floor_pct: 0.30, fraud_tolerance_cents: 100000000, donation_allowed: false, destroy_requires_dual_signoff: false, max_refund_exposure_cents: 100000000 }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { c_id: $.data.id }
            - call: "POST /catalog-items"
              payload: { client_id: "${c_id}", sku: "WIDGET-1", description: "Standard widget", declared_value_cents: 20000, unit_weight_grams: 1200, serialized: false, refurb_eligible: false, secondary_market_floor_cents: 1000, hazard_class: "NONE", regulated_flag: false }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { item_id: $.data.id }
            - call: "POST /secondary-market-channels"
              payload: { name: "Alpha Auction", channel_code: "AUC1", channel_type: "AUCTION", accepted_grades: ["A", "B", "C", "D"], fee_pct: 0.12, hazard_certified: false, recall_certified: false, min_lot_value_cents: 0, concurrent_lot_capacity: 5 }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { ch_id: $.data.id }
            - call: "POST /return-authorizations"
              payload: { client_id: "${c_id}", order_reference: "ORD-1001", customer_reference: "CUST-1", order_placed_at: "2026-07-25T00:00:00Z", expires_at: "2026-09-01T00:00:00Z" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rma_id: $.data.id }
            - call: "POST /return-authorizations/${rma_id}/lines"
              payload: { catalog_item_id: "${item_id}", authorized_quantity: 1, reason_code: "DEFECTIVE" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rl_id: $.data.id }
            - call: "POST /return-authorizations/${rma_id}/issue"
              payload: {}
              as: CenterAdmin
              as_user_id: "u_admin"
            - call: "POST /receipts"
              payload: { rma_id: "${rma_id}", tracking_reference: "TRK-1", gross_weight_grams: 1400 }
              as: ReceivingClerk
              as_user_id: "u_clerk"
              captures: { rcpt_id: $.data.id }
            - call: "POST /receipts/${rcpt_id}/lines"
              payload: { rma_line_id: "${rl_id}", quantity: 1, reason_code: "DEFECTIVE" }
              as: ReceivingClerk
              as_user_id: "u_clerk"
              captures: { line_id: $.data.id }
            - call: "POST /return-lines/${line_id}/grade"
              payload: { condition_grade: "C" }
              as: GradingInspector
              as_user_id: "u_grader"
              captures: { line_ver: $.data.version, prov_recovery: $.data.recovery_value_cents }
          trigger:
            - call: "POST /disposition-orders"
              payload: { return_line_id: "${line_id}", expected_return_line_version: "${line_ver}", channel_id: "${ch_id}", disposition: "LIQUIDATE", quantity: 1, channel_window_start_at: "2026-08-02T08:00:00Z", channel_window_end_at: "2026-08-02T12:00:00Z" }
              as: DispositionSupervisor
              as_user_id: "u_super"
              captures: { do_id: $.data.id, frozen_unit_price: $.data.unit_price_cents }
            - call: "POST /disposition-orders/${do_id}/approve"
              payload: {}
              as: DispositionSupervisor
              as_user_id: "u_super"
            - call: "POST /disposition-orders/${do_id}/execute"
              payload: { realized_unit_price_cents: 12000 }
              as: DispositionSupervisor
              as_user_id: "u_super"
            - call: "GET /return-lines/${line_id}"
              payload: {}
              as: DispositionSupervisor
              as_user_id: "u_super"
            - call: "GET /clients/${c_id}/disposition-audit"
              payload: {}
              as: CenterAdmin
              as_user_id: "u_admin"
          assert:
            - "Immediately after grading, ReturnLine.${line_id}.recovery_value_cents == 7200 (provisional_at_grade: round_half_up(20000 * 0.40 * (1 - 0.10)) * 1)"
            - "ReturnLine.${line_id}.disposition == LIQUIDATE (rule D6: 7200 * 100 == 720000 >= 20000 * 1 * 30 == 600000)"
            - "DispositionOrder.${do_id}.unit_price_cents == 7200 — the provisional variant is what gets frozen into the order"
            - "DispositionOrder.${do_id}.gross_lot_value_cents == 12000 and effective_fee_pct == 0.18 and channel_fee_cents == 2160 and net_recovery_cents == 9840"
            - "After execution, ReturnLine.${line_id}.recovery_value_cents == 9840 — the same field now carries final_at_execution, NOT 7200"
            - "The two variants differ by exactly 9840 - 7200 == 2640, and GET /clients/${c_id}/disposition-audit returns recovery_variance_cents == 2640"
            - "ShrinkLedgerEntry of entry_type RECOVERY_CREDIT has amount_cents == 9102 (9840 - round_half_up(9840 * 0.075) == 9840 - 738)"
            - "Client.${c_id}.settlement_balance_cents == 9102"

      - name: client_settlement_booked_vs_projected_balance
        grounds:
          - calculations.client_settlement_balance
          - entities.Client.fields.settlement_balance_cents
          - entities.Client.fields.projected_settlement_balance_cents
          - endpoints[GET /clients/{client_id}/disposition-audit]
          - endpoints[POST /disposition-orders]
        distinguishing_aspect: |
          Both variants of client_settlement_balance are asserted on the Client entity's
          portfolio posture, not on any single line: with one PROPOSED order and zero ledger rows
          the booked variant reads 0 while the projected variant reads 5461, and after execution
          plus the RELEASE_PENDING refund the booked variant reads 9102 while the projected
          variant reads -8898. The first dual_variant_calc instance asserts
          return_line_recovery_value on ReturnLine, a different entity domain entirely.
        test_recipe:
          setup:
            - "Identical fixture to recovery_value_provisional_vs_final_on_return_line: Client CLLIQ2, CatalogItem WIDGET-1 at 20000 cents, AUCTION channel at fee_pct 0.12, one received line graded C with disposition LIQUIDATE and provisional recovery 7200."
            - "No ShrinkLedgerEntry exists yet for the client, because nothing has executed."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Projection Client", client_code: "CLLIQ2", service_level: "SL_STANDARD", inventory_ownership: "CLIENT_OWNED", restock_grade_floor: "A", refund_hold_hours: 48, liquidation_floor_pct: 0.30, fraud_tolerance_cents: 100000000, donation_allowed: false, destroy_requires_dual_signoff: false, max_refund_exposure_cents: 100000000 }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { c_id: $.data.id }
            - call: "POST /catalog-items"
              payload: { client_id: "${c_id}", sku: "WIDGET-1", description: "Standard widget", declared_value_cents: 20000, unit_weight_grams: 1200, serialized: false, refurb_eligible: false, secondary_market_floor_cents: 1000, hazard_class: "NONE", regulated_flag: false }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { item_id: $.data.id }
            - call: "POST /secondary-market-channels"
              payload: { name: "Alpha Auction", channel_code: "AUC1", channel_type: "AUCTION", accepted_grades: ["A", "B", "C", "D"], fee_pct: 0.12, hazard_certified: false, recall_certified: false, min_lot_value_cents: 0, concurrent_lot_capacity: 5 }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { ch_id: $.data.id }
            - call: "POST /return-authorizations"
              payload: { client_id: "${c_id}", order_reference: "ORD-1002", customer_reference: "CUST-2", order_placed_at: "2026-07-25T00:00:00Z", expires_at: "2026-09-01T00:00:00Z" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rma_id: $.data.id }
            - call: "POST /return-authorizations/${rma_id}/lines"
              payload: { catalog_item_id: "${item_id}", authorized_quantity: 1, reason_code: "DEFECTIVE" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rl_id: $.data.id }
            - call: "POST /return-authorizations/${rma_id}/issue"
              payload: {}
              as: CenterAdmin
              as_user_id: "u_admin"
            - call: "POST /receipts"
              payload: { rma_id: "${rma_id}", tracking_reference: "TRK-2", gross_weight_grams: 1400 }
              as: ReceivingClerk
              as_user_id: "u_clerk"
              captures: { rcpt_id: $.data.id }
            - call: "POST /receipts/${rcpt_id}/lines"
              payload: { rma_line_id: "${rl_id}", quantity: 1, reason_code: "DEFECTIVE" }
              as: ReceivingClerk
              as_user_id: "u_clerk"
              captures: { line_id: $.data.id }
            - call: "POST /return-lines/${line_id}/grade"
              payload: { condition_grade: "C" }
              as: GradingInspector
              as_user_id: "u_grader"
              captures: { line_ver: $.data.version }
          trigger:
            - call: "POST /disposition-orders"
              payload: { return_line_id: "${line_id}", expected_return_line_version: "${line_ver}", channel_id: "${ch_id}", disposition: "LIQUIDATE", quantity: 1, channel_window_start_at: "2026-08-02T08:00:00Z", channel_window_end_at: "2026-08-02T12:00:00Z" }
              as: DispositionSupervisor
              as_user_id: "u_super"
              captures: { do_id: $.data.id }
            - call: "GET /clients/${c_id}/disposition-audit"
              payload: {}
              as: CenterAdmin
              as_user_id: "u_admin"
            - call: "POST /disposition-orders/${do_id}/approve"
              payload: {}
              as: DispositionSupervisor
              as_user_id: "u_super"
            - call: "POST /disposition-orders/${do_id}/execute"
              payload: { realized_unit_price_cents: 12000 }
              as: DispositionSupervisor
              as_user_id: "u_super"
            - call: "GET /clients/${c_id}"
              payload: {}
              as: CenterAdmin
              as_user_id: "u_admin"
          assert:
            - "With the order PROPOSED and no ShrinkLedgerEntry rows, GET /clients/${c_id}/disposition-audit returns settlement_balance_cents == 0 (booked_balance variant)"
            - "The same response returns projected_settlement_balance_cents == 5461 (projected_balance variant over the frozen unit_price_cents 7200: gross 7200, effective_fee_pct 0.18, fee 1296, net 5904, minus round_half_up(5904 * 0.075) == 443)"
            - "The two variants therefore differ by exactly 5461 on identical stored data"
            - "After the order EXECUTES at realized_unit_price_cents 12000, Client.${c_id}.settlement_balance_cents == 9102 (booked)"
            - "After the same execution, Client.${c_id}.projected_settlement_balance_cents == -8898 (9102 booked, no order left in flight, minus the RELEASE_PENDING RefundRelease net_refund_cents of 18000)"
            - "RefundRelease of ReturnLine.${line_id} has gross_refund_cents == 20000, restocking_fee_pct == 0.10, restocking_fee_cents == 2000, net_refund_cents == 18000"
            - "Client.${c_id}.status == ACTIVE — 9102 never falls below -100000000, so the execute cascade does not suspend"

  # ===================================================================== #
  # RULE 2 — combinatorial_formula                                        #
  # Instance 1 is §0.5 mode (b): nested rounding where the order matters. #
  # Instance 2 is §0.5 mode (c): a circular-looking dependency whose      #
  # evaluation order the scaffold pins.                                   #
  # ===================================================================== #
  - rule_id: combinatorial_formula
    instances:
      - name: client_settlement_rounding_per_entry_then_sum
        grounds:
          - calculations.client_settlement_balance
          - calculations.shrink_ledger_entry_amount
          - entities.ShrinkLedgerEntry.fields.amount_cents
          - entities.Client.fields.settlement_balance_cents
        distinguishing_aspect: |
          This is §0.5 mode (b): the center's 7.5% handling share is rounded once per
          ShrinkLedgerEntry at append time and the integer entries are then summed, which the
          scaffold pins explicitly. Three lots realizing 1626 / 3387 / 5013 cents produce credits
          1233 + 2569 + 3803 == 7605, whereas summing the three nets (8221) and withholding the
          handling share once would produce 7604 — a one-cent divergence that falsifies the wrong
          order. The other combinatorial_formula instance is mode (c), not mode (b).
        test_recipe:
          setup:
            - "Client CLROUND: SL_STANDARD, restock_grade_floor A, liquidation_floor_pct 0.30, donation_allowed false, fraud_tolerance_cents 100000000, max_refund_exposure_cents 100000000."
            - "CatalogItem WIDGET-1 at declared_value_cents 20000 and unit_weight_grams 1200; AUCTION channel at fee_pct 0.12 with concurrent_lot_capacity 5 and min_lot_value_cents 0."
            - "One RMA with three authorized lines of quantity 1 each (reason DEFECTIVE), all received in one Receipt weighing exactly 200 + 3 * 1200 == 3800 grams, all graded C so each line's provisional recovery is 7200 and each disposition is LIQUIDATE."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Rounding Client", client_code: "CLROUND", service_level: "SL_STANDARD", inventory_ownership: "CLIENT_OWNED", restock_grade_floor: "A", refund_hold_hours: 48, liquidation_floor_pct: 0.30, fraud_tolerance_cents: 100000000, donation_allowed: false, destroy_requires_dual_signoff: false, max_refund_exposure_cents: 100000000 }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { c_id: $.data.id }
            - call: "POST /catalog-items"
              payload: { client_id: "${c_id}", sku: "WIDGET-1", description: "Standard widget", declared_value_cents: 20000, unit_weight_grams: 1200, serialized: false, refurb_eligible: false, secondary_market_floor_cents: 1000, hazard_class: "NONE", regulated_flag: false }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { item_id: $.data.id }
            - call: "POST /secondary-market-channels"
              payload: { name: "Alpha Auction", channel_code: "AUC1", channel_type: "AUCTION", accepted_grades: ["A", "B", "C", "D"], fee_pct: 0.12, hazard_certified: false, recall_certified: false, min_lot_value_cents: 0, concurrent_lot_capacity: 5 }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { ch_id: $.data.id }
            - call: "POST /return-authorizations"
              payload: { client_id: "${c_id}", order_reference: "ORD-1003", customer_reference: "CUST-3", order_placed_at: "2026-07-25T00:00:00Z", expires_at: "2026-09-01T00:00:00Z" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rma_id: $.data.id }
            - call: "POST /return-authorizations/${rma_id}/lines"
              payload: { catalog_item_id: "${item_id}", authorized_quantity: 1, reason_code: "DEFECTIVE" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rl1: $.data.id }
            - call: "POST /return-authorizations/${rma_id}/lines"
              payload: { catalog_item_id: "${item_id}", authorized_quantity: 1, reason_code: "DEFECTIVE" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rl2: $.data.id }
            - call: "POST /return-authorizations/${rma_id}/lines"
              payload: { catalog_item_id: "${item_id}", authorized_quantity: 1, reason_code: "DEFECTIVE" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rl3: $.data.id }
            - call: "POST /return-authorizations/${rma_id}/issue"
              payload: {}
              as: CenterAdmin
              as_user_id: "u_admin"
            - call: "POST /receipts"
              payload: { rma_id: "${rma_id}", tracking_reference: "TRK-3", gross_weight_grams: 3800 }
              as: ReceivingClerk
              as_user_id: "u_clerk"
              captures: { rcpt_id: $.data.id }
            - call: "POST /receipts/${rcpt_id}/lines"
              payload: { rma_line_id: "${rl1}", quantity: 1, reason_code: "DEFECTIVE" }
              as: ReceivingClerk
              as_user_id: "u_clerk"
              captures: { line1: $.data.id }
            - call: "POST /receipts/${rcpt_id}/lines"
              payload: { rma_line_id: "${rl2}", quantity: 1, reason_code: "DEFECTIVE" }
              as: ReceivingClerk
              as_user_id: "u_clerk"
              captures: { line2: $.data.id }
            - call: "POST /receipts/${rcpt_id}/lines"
              payload: { rma_line_id: "${rl3}", quantity: 1, reason_code: "DEFECTIVE" }
              as: ReceivingClerk
              as_user_id: "u_clerk"
              captures: { line3: $.data.id }
            - call: "POST /return-lines/${line1}/grade"
              payload: { condition_grade: "C" }
              as: GradingInspector
              as_user_id: "u_grader"
              captures: { v1: $.data.version }
            - call: "POST /return-lines/${line2}/grade"
              payload: { condition_grade: "C" }
              as: GradingInspector
              as_user_id: "u_grader"
              captures: { v2: $.data.version }
            - call: "POST /return-lines/${line3}/grade"
              payload: { condition_grade: "C" }
              as: GradingInspector
              as_user_id: "u_grader"
              captures: { v3: $.data.version }
            - call: "POST /disposition-orders"
              payload: { return_line_id: "${line1}", expected_return_line_version: "${v1}", channel_id: "${ch_id}", disposition: "LIQUIDATE", quantity: 1, channel_window_start_at: "2026-08-02T08:00:00Z", channel_window_end_at: "2026-08-02T12:00:00Z" }
              as: DispositionSupervisor
              as_user_id: "u_super"
              captures: { do1: $.data.id }
            - call: "POST /disposition-orders"
              payload: { return_line_id: "${line2}", expected_return_line_version: "${v2}", channel_id: "${ch_id}", disposition: "LIQUIDATE", quantity: 1, channel_window_start_at: "2026-08-02T08:00:00Z", channel_window_end_at: "2026-08-02T12:00:00Z" }
              as: DispositionSupervisor
              as_user_id: "u_super"
              captures: { do2: $.data.id }
            - call: "POST /disposition-orders"
              payload: { return_line_id: "${line3}", expected_return_line_version: "${v3}", channel_id: "${ch_id}", disposition: "LIQUIDATE", quantity: 1, channel_window_start_at: "2026-08-02T08:00:00Z", channel_window_end_at: "2026-08-02T12:00:00Z" }
              as: DispositionSupervisor
              as_user_id: "u_super"
              captures: { do3: $.data.id }
            - call: "POST /disposition-orders/${do1}/approve"
              payload: {}
              as: DispositionSupervisor
              as_user_id: "u_super"
            - call: "POST /disposition-orders/${do2}/approve"
              payload: {}
              as: DispositionSupervisor
              as_user_id: "u_super"
            - call: "POST /disposition-orders/${do3}/approve"
              payload: {}
              as: DispositionSupervisor
              as_user_id: "u_super"
          trigger:
            - call: "POST /disposition-orders/${do1}/execute"
              payload: { realized_unit_price_cents: 1626 }
              as: DispositionSupervisor
              as_user_id: "u_super"
            - call: "POST /disposition-orders/${do2}/execute"
              payload: { realized_unit_price_cents: 3387 }
              as: DispositionSupervisor
              as_user_id: "u_super"
            - call: "POST /disposition-orders/${do3}/execute"
              payload: { realized_unit_price_cents: 5013 }
              as: DispositionSupervisor
              as_user_id: "u_super"
            - call: "GET /clients/${c_id}/disposition-audit"
              payload: {}
              as: CenterAdmin
              as_user_id: "u_admin"
          assert:
            - "DispositionOrder.${do1}: gross_lot_value_cents == 1626, effective_fee_pct == 0.18, channel_fee_cents == 293, net_recovery_cents == 1333"
            - "DispositionOrder.${do2}: gross_lot_value_cents == 3387, channel_fee_cents == 610, net_recovery_cents == 2777"
            - "DispositionOrder.${do3}: gross_lot_value_cents == 5013, channel_fee_cents == 902, net_recovery_cents == 4111"
            - "The three RECOVERY_CREDIT ShrinkLedgerEntry rows have amount_cents 1233, 2569 and 3803 — each net rounded once at append time"
            - "Client.${c_id}.settlement_balance_cents == 7605"
            - "Client.${c_id}.settlement_balance_cents != 7604, which is what summing the nets (1333 + 2777 + 4111 == 8221) and withholding round_half_up(8221 * 0.075) == 617 once would have produced"
            - "GET /clients/${c_id}/disposition-audit returns recovery_credit_cents == 7605 and money_conservation_ok == true"

      - name: disposition_fee_band_keyed_on_gross_not_net
        grounds:
          - calculations.disposition_net_recovery
          - entities.DispositionOrder.fields.effective_fee_pct
          - entities.DispositionOrder.fields.channel_fee_cents
          - entities.DispositionOrder.fields.net_recovery_cents
          - state_machines.DispositionOrder.APPROVED_to_EXECUTED
        distinguishing_aspect: |
          This is §0.5 mode (c): "the commission band the lot finally settles into" is circular,
          because net depends on the fee and the fee depends on the band. The scaffold pins the
          band to the GROSS lot value in STEP 2, so a lot grossing exactly 25000 lands in MID_LOT
          (surcharge 0.00, effective_fee_pct 0.12, fee 3000, net 22000); reading the band off the
          post-fee net 22000 would put it in SMALL_LOT (+0.06, effective_fee_pct 0.18, fee 4500,
