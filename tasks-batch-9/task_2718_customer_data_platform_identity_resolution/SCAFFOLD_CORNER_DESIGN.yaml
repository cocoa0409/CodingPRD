      - name: new_activation_starts_in_draft
        claim_type: initial_state
        grounds:
          - state_machines.Activation.initial_state
          - entities.Activation.fields.status
          - endpoints[POST /cdp/activations]
        distinguishing_aspect: "A freshly created Activation is DRAFT with every audience, hash, match-rate and timestamp field at its declared default and consumes no destination quota."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One ACTIVE Destination and one APPROVED Segment (no profiles are needed for the initial-state claim)."
          setup_api_calls:
            - call: "POST /cdp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
