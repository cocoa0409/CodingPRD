          assert:
            - "After release: total_disbursed_cents == 200000 and remaining_assistance_cents == 275002 (sum 475002 == final_assistance)"
            - "After clawback: total_disbursed_cents == 0 and remaining_assistance_cents == 475002 (sum invariant 475002 restored)"
            - "Disbursement.${disb_id}.status == CLAWED_BACK; case stays DISBURSEMENT_PENDING (remaining != 0)"

