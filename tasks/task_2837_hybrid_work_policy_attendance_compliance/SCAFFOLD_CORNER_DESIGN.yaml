      - name: occ_on_the_employee_and_cycle_carriers_with_exact_version_accounting
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[classification-create-stale-employee]
          - concurrency_rules[recalibration-decision-stale-cycle]
        distinguishing_aspect: "Two of the three OCC carriers are parents whose version is advanced by a CHILD write - creating a classification bumps Employee.version, deciding a review bumps PolicyCycle.version - so the client's own successful call is what makes its next request stale. The exact increments are pinned so that an extra or missing bump is visible."
        test_recipe:
