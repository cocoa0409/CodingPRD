          setup:
            - "Guard Enzo is ACTIVE and LICENSED with committed_hours == 0.0."
            - "One OPEN_UNFILLED shift 2026-05-04T08:00Z→16:00Z with a 30-minute break (scheduled_hours 7.5) exists at post Perimeter."
