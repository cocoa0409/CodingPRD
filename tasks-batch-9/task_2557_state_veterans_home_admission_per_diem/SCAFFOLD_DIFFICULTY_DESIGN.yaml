      - name: cost_share_medical_cap_tier_evaluation_order_pinned
        grounds:
          - calculations.resident_cost_share_monthly
          - entities.CostShareDetermination.fields.income_tier
          - entities.CostShareDetermination.fields.allowed_medical_deduction_cents
          - entities.CostShareDetermination.fields.federal_per_diem_offset_cents
        distinguishing_aspect: |
          The income tier is selected from income AFTER the PNA deduction but BEFORE the medical
          deduction, and the federal offset cap is a percentage of the tiered share that the
          medical deduction has already reduced — a circular-looking dependency with exactly one
          legal evaluation order. Pinned order: 105000 -> TIER_2 -> cap 15000 -> 90000 -> 36000 ->
          offset min(18378, 10800) = 10800 -> 25200. Re-tiering after the deduction gives TIER_1,
          cap 5000, 100000, 40000, offset 12000 and the wrong answer 28000.
        test_recipe:
          setup:
            - "One RECOGNIZED VeteransHome with personal_needs_allowance_monthly_cents 9000."
            - "One CERTIFIED NURSING CareUnit with per_diem_rate_cents 11857."
            - "One Resident admitted 2026-08-01, never hospitalized, with 31 RESIDENT_DAY CensusDay rows for August."
            - "Exactly one VERIFIED IncomeRecord: SSA 114000 for effective_month 2026-08, so income net of PNA is 105000 — 5000 above the TIER_1 upper bound."
          setup_api_calls:
            - call: "POST /svh/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
