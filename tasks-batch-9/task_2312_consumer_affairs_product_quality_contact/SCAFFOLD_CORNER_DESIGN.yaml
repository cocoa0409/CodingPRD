      - name: corner_clock_endpoint_returns_previous_and_current_instants
        claim_type: action_endpoint
        grounds: ["endpoints[POST /_clock/set_current_utc]", "validations[priority 1]"]
        distinguishing_aspect: "The test-driving clock endpoint is the single documented exception to the X-User-ID rule, and it reports the instant it replaced so a recipe can chain relative jumps."
        test_recipe:
          setup: ["Nothing; this is the first call of the run."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", as: SystemAdmin, payload: { current_utc: "2026-08-01T00:00:00Z" }, captures: { c1: "$.data.current_utc" } }
          trigger:
            - { call: "POST /_clock/set_current_utc", as: SystemAdmin, payload: { current_utc: "2026-09-15T06:30:00Z" }, captures: { c2: "$.data.current_utc", p2: "$.data.previous_utc" } }
            - { call: "POST /_clock/set_current_utc", as: SystemAdmin, payload: { current_utc: "2026-07-01T00:00:00Z" }, captures: { c3: "$.data.current_utc", p3: "$.data.previous_utc" } }
          assert:
            - "HTTP 200 (not 201 — nothing is created) with response_type \"object\""
            - "the second call returns current_utc \"2026-09-15T06:30:00Z\" and previous_utc \"2026-08-01T00:00:00Z\""
            - "the third call moves the clock BACKWARDS and is accepted, returning previous_utc \"2026-09-15T06:30:00Z\" — the harness may rewind"
            - "no X-User-ID header is required on any of the three calls, per the explicit carve-out in the priority-1 rule"

