      - name: err_max_active_transcripts
        claim_type: violation_to_error
        grounds:
          - validations[priority=36]
          - errors[ERR_MAX_ACTIVE_TRANSCRIPTS]
        distinguishing_aspect: "A Learner may hold at most MAX_ACTIVE_TRANSCRIPTS(2) QUOTED/PAID transcripts: the third create fails with 409 ERR_MAX_ACTIVE_TRANSCRIPTS, and after one is RELEASED (no longer active) the same create succeeds — TRANSCRIPT is exempt from the duplicate rule."
        test_recipe:
          setup:
            - "Compliant institution; student S1 with an ACCEPTED entry; default clock"
          setup_api_calls:
            - { call: "POST /institutions", payload: { name: "State University", ope_id: "00123400", users: [ { email: "sub@su.edu", role: "SUBMITTER" } ] }, as: ClearinghouseOps, captures: { inst_id: "$.data.id", sub_uid: "$.data.users[0].id" } }
