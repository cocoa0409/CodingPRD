      - name: endotoxin_noninjectable_route_tier_threshold
        claim_type: Constants Applied
        grounds:
          - calculations.qc_endotoxin_evaluation
          - entities.MasterFormulationRecord.fields.dosage_form
        distinguishing_aspect: "For a STERILE_NONAQUEOUS (non-injectable) batch, the endotoxin ceiling is NONINJECTABLE_EU_LIMIT=350, not 175; same projection passes at a higher measured_value."
        excluded_because:
          difficulty_instance: dual_variant_calc / endotoxin_route_tiered_projection_vs_bud_window
          rationale: "The route-tiered endotoxin ceiling (175 injectable branch) is computed and asserted in that difficulty instance; the 350 non-injectable branch is the same constant-selection claim on the other tier."

      - name: yield_under_yield_lower_boundary_inclusive
        claim_type: Correct Result
        grounds:
          - calculations.yield_reconciliation
          - entities.CompoundingBatch.fields.yield_variance_pct
        distinguishing_aspect: "actual_yield_units=95 against theoretical 100 -> variance == -5.00, inclusive lower boundary, compile succeeds (status COMPILED)."
        excluded_because:
          difficulty_instance: combinatorial_formula / yield_variance_round_then_band_compare_mode_b
          rationale: "The inclusive yield band (round-then-compare against ±5.00) is asserted at the +5.00 upper boundary in that instance; the -5.00 lower boundary is the symmetric edge of the same band."

