            - "Candidate.${cand_a_id}.readiness_score == 92.00"

      - name: comp_award_offset_tier_keyed_on_pre_offset_total_not_net_total
        grounds:
          - calculations.director_compensation_award
          - calculations.committee_seat_ledger
          - entities.DirectorCompensationAward.fields.pre_offset_total_cents
          - entities.DirectorCompensationAward.fields.excess_offset_pct
          - entities.DirectorCompensationAward.fields.excess_offset_cents
          - entities.DirectorCompensationAward.fields.total_cents
          - entities.DirectorCompensationAward.fields.ownership_requirement_cents
          - entities.DirectorCompensationAward.fields.ownership_compliant
          - state_machines.DirectorCompensationAward.DRAFT_to_FINALIZED
        distinguishing_aspect: |
          total_cents is defined net of an offset whose tier is keyed on pre_offset_total_cents: the fixture
          lands pre_offset_total_cents at 41000000, inside the 5.0% band, while the resulting total_cents
          38950000 falls back below the 40000000 ceiling - so an implementation that re-derives the tier
          from the net total applies 2.5% and reports 39975000, pinning the evaluation ORDER rather than a
          rounding order.
        test_recipe:
          setup:
            - "ACTIVE GovernancePolicy for cycle 2026 with equity_grant_value_cents 23500000; annual_cash_retainer_cents 12000000, committee_member_fee_cents 1500000, committee_chair_premium_cents 2500000, ownership_multiple 5.0 and ownership_grace_years 5 left at their defaults."
            - "One SEATED director appointed_on 2026-01-01 holding shares_held 900."
            - "Three chartered committees each with authorized_seats 5 and min_seats 1: AUDIT with an ACTIVE CHAIR assignment for the director, COMPENSATION and NOMINATING_GOVERNANCE each with an ACTIVE MEMBER assignment for the same director."
            - "Logical clock left at the 2026-08-01T00:00:00Z default, which is inside the five-year ownership grace period."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { cycle_year: 2026, effective_from: "2026-01-01T00:00:00Z", equity_grant_value_cents: 23500000 }
