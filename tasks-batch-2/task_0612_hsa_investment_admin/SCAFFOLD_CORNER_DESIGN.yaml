            - "TaxForm.fair_market_value_cents == 250000 (cash 250000 + invested 50000)"

      - name: excess_correction_amount_mismatch
        claim_type: input_set_filtering
        grounds: ["validations[priority=17]", "errors[ERR_CORRECTION_AMOUNT_MISMATCH]"]
        distinguishing_aspect: "A correction created for requested_amount_cents=137500 (the excess at create time) is then made stale by superseding the only coverage period (limit drops to 0, excess jumps to 1000000); executing it returns ERR_CORRECTION_AMOUNT_MISMATCH because 137500 != current excess 1000000."
        test_recipe:
          setup: ["ACTIVE account, FAMILY full-year coverage cp (limit 862500), three POSTED contributions summing 1000000 (excess 137500, posture LOCKED). A REQUESTED correction for 137500 was created; THEN cp is superseded so limit->0 and excess->1000000."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: AccountAdmin
            - call: "POST /hsa/accountholders"
              payload: { full_name: "St Uvw", email: "st.uvw@x.com", date_of_birth: "1978-04-08" }
              as: AccountAdmin
              captures: { h_id: $.data.id }
            - call: "POST /hsa/accounts"
              payload: { accountholder_id: "${h_id}", plan_year: 2026 }
              as: AccountAdmin
              captures: { acc_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /hsa/accounts/${acc_id}/coverage-periods"
              payload: { coverage_tier: "FAMILY", effective_month: 1, end_month: 12 }
              as: AccountAdmin
              captures: { cp_id: $.data.id }
            - call: "POST /hsa/accounts/${acc_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Accountholder
              as_user_id: "${h_id}"
            - call: "POST /hsa/accounts/${acc_id}/contributions"
              payload: { channel: "INDIVIDUAL", amount_cents: 400000 }
              as: AccountAdmin
              captures: { c1: $.data.id }
            - call: "POST /hsa/accounts/${acc_id}/contributions/${c1}/post"
              as: AccountAdmin
            - call: "POST /hsa/accounts/${acc_id}/contributions"
              payload: { channel: "INDIVIDUAL", amount_cents: 400000 }
              as: AccountAdmin
              captures: { c2: $.data.id }
            - call: "POST /hsa/accounts/${acc_id}/contributions/${c2}/post"
              as: AccountAdmin
            - call: "POST /hsa/accounts/${acc_id}/contributions"
              payload: { channel: "INDIVIDUAL", amount_cents: 200000 }
              as: AccountAdmin
              captures: { c3: $.data.id }
            - call: "POST /hsa/accounts/${acc_id}/contributions/${c3}/post"
              as: AccountAdmin
            - call: "GET /hsa/accounts/${acc_id}"
              as: AccountAdmin
              captures: { acc_v: $.data.version }
            - call: "POST /hsa/accounts/${acc_id}/corrections"
              payload: { requested_amount_cents: 137500, expected_account_version: "${acc_v}" }
              as: AccountAdmin
              captures: { corr_id: $.data.id }
            - call: "POST /hsa/accounts/${acc_id}/coverage-periods/${cp_id}/supersede"
              as: AccountAdmin
          trigger:
            - call: "POST /hsa/accounts/${acc_id}/corrections/${corr_id}/execute"
              as: AccountAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_CORRECTION_AMOUNT_MISMATCH (requested 137500 != current excess 1000000)"
            - "ExcessCorrection.${corr_id}.status remains REQUESTED"

  # ===========================================================================
  - section: validations
