          Entity pair HardwareUnit -> ReroofProject (a different pair from HardwareUnit -> ArrayCircuit):
          the stored, SERVICEABLE panel on an ISOLATED circuit of a REINSTALL-phase project with OPEN
          posture is refused only because the leased system's manufacturer notice is not on file, and
