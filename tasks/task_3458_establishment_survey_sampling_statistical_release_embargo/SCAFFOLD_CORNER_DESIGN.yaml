      - name: base_weight_precision_six_decimals
        claim_type: precision
        grounds: ["calculations.base_sampling_weight", "entities.PanelEnrollment.fields.base_weight"]
        distinguishing_aspect: "100/3 is stored as exactly 33.333333 (6 decimals, round_half_up) — not 33.33, not full precision."
        test_recipe:
          setup: ["program CES (budget 3); frame stratum (MANUFACTURING,SMALL,100) frozen -> allocation 3"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /survey/programs", payload: { code: "CES", name: "Current Employment Statistics", sample_budget: 3 }, as: ProgramAdmin, captures: { prog_v: $.data.version } }
            - { call: "POST /survey/sample-frames", payload: { program_code: "CES", reference_quarter: "2026-Q3", strata: [{ industry_code: MANUFACTURING, size_class: SMALL, frame_unit_count: 100 }], expected_program_version: "${prog_v}" }, as: ProgramAdmin, captures: { frame_id: $.data.id } }
            - { call: "POST /survey/sample-frames/${frame_id}/freeze", payload: {}, as: ProgramAdmin }
            - { call: "POST /survey/establishments", payload: { ein: "11-0002901", name: "WP-E1", industry_code: MANUFACTURING, size_class: SMALL }, as: CollectionOfficer, captures: { e1: $.data.id } }
          trigger:
            - { call: "POST /survey/panel-enrollments", payload: { establishment_id: "${e1}", program_code: "CES" }, as: CollectionOfficer, captures: { w: $.data.base_weight } }
          assert:
            - "w == 33.333333"

