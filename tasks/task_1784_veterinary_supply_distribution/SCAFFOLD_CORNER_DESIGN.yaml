- section: validations
  instances:
  - name: clinic_create_missing_auth_header
    claim_type: violation_to_error
    grounds:
    - validations[priority=1]
    - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
    distinguishing_aspect: A request sent without X-User-ID / X-User-Role headers is rejected ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before role, existence, or body checks.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: POST /vet/clinics
        payload:
          clinic_name: No Auth
          license_number: LIC-NA
          ship_to_address: 44 Auth Ave
          credit_limit_cents: 100000
          minimum_order_value_cents: 5000
          delivery_frequency_per_week: 2
          free_freight_threshold_cents: 75000
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http 400 (headers omitted by the test driver)
  - name: approve_with_wrong_role_beats_state_check
    claim_type: priority_ordering
    grounds:
    - validations[priority=2]
    - validations[priority=4]
    - errors[ERR_UNAUTHORIZED_ROLE]
    distinguishing_aspect: "Category pair (auth, state) \u2014 distinct from \xA71.8's pairs: a SupplyChainPlanner approving a DRAFT order hits ERR_UNAUTHORIZED_ROLE (403, priority 2), never ERR_ORDER_INVALID_STATE\
      \ (priority 4)."
    test_recipe:
      setup:
      - ACTIVE clinic; stocked product; order in DRAFT
      setup_api_calls:
      - call: POST /vet/clinics
        payload:
          clinic_name: Clinic PR
          license_number: LIC-PR
          ship_to_address: 45 Prio Pl
          credit_limit_cents: 1000000
          minimum_order_value_cents: 5000
          delivery_frequency_per_week: 2
          free_freight_threshold_cents: 75000
        as: AccountManager
        captures:
          c_id: $.data.id
      - call: POST /vet/clinics/${c_id}/activate
        as: AccountManager
      - call: POST /vet/products
        payload:
          sku: CONS-PR
          product_name: Cotton Roll
          manufacturer_code: GEN
          product_type: CONSUMABLE
          unit_price_cents: 2500
        as: SupplyChainPlanner
        captures:
          p_id: $.data.id
      - call: POST /vet/orders
        payload:
          clinic_id: ${c_id}
          ship_to_address: 45 Prio Pl
          delivery_window_start: '2026-08-03T13:00:00Z'
          delivery_window_end: '2026-08-03T15:00:00Z'
          lines:
          - product_id: ${p_id}
            qty_requested: 1
        as: ClinicBuyer
        as_user_id: ${c_id}
        captures:
          o_id: $.data.id
      trigger:
      - call: POST /vet/orders/${o_id}/approve
        as: SupplyChainPlanner
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_UNAUTHORIZED_ROLE, http 403 (role gate precedes the state gate)
  - name: dea_registration_required_for_controlled_substance
    claim_type: violation_to_error
    grounds:
    - validations[priority=5.1]
    - errors[ERR_DEA_REGISTRATION_REQUIRED]
    distinguishing_aspect: "A controlled-substance Rx line with a valid APPROVED authorization still fails approval when the clinic's dea_registration_number is null \u2014 a distinct safety gate after\
      \ the authorization check."
    test_recipe:
      setup:
      - ACTIVE clinic WITHOUT DEA number; controlled RX product (ZOETIS); APPROVED authorization with matching ship-to; order SUBMITTED
      setup_api_calls:
      - call: POST /vet/clinics
        payload:
          clinic_name: Clinic DEA
          license_number: LIC-DEA
          ship_to_address: 46 Dea Dr
          credit_limit_cents: 5000000
          minimum_order_value_cents: 5000
          delivery_frequency_per_week: 5
          free_freight_threshold_cents: 100000
        as: AccountManager
        captures:
          c_id: $.data.id
      - call: POST /vet/clinics/${c_id}/activate
        as: AccountManager
