              payload: { spectral_samples: [ { wavelength_nm: 450, reflectance_pct: 0.1000 }, { wavelength_nm: 500, reflectance_pct: 0.1200 }, { wavelength_nm: 600, reflectance_pct: 0.1400 }, { wavelength_nm: 700, reflectance_pct: 0.1800 }, { wavelength_nm: 800, reflectance_pct: 0.2000 } ] }
              as: ProcessTechnician
