            - { call: "POST /v1/customers", payload: { full_name: "Sam Owner", email: "sam@example.com" }, as: ContractorAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /v1/policies", payload: { customer_id: "${cust_id}", carrier_id: "${ca_id}", policy_number: "POL-1", coverage_a_limit_cents: 5000000, deductible_type: "FLAT", flat_deductible_cents: 50000, recoverable_depreciation: true, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z" }, as: ContractorAdmin, captures: { pol_id: $.data.id } }
