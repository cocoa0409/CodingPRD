# =============================================================================
# task_0438_plm_eco — §1.9 Scaffold Corner Design (breadth coverage)
# Walks references/claim-extraction-guide.md sections against §1.1-§1.7.
# Every grounds[] ref resolves into SCAFFOLD.yaml. Placeholders bound in-instance.
# excluded_because stubs cite a §1.8 instance by name.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_part_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.Part, endpoints]
        distinguishing_aspect: "POST /plm/parts with required fields returns 201 and a Part with id, part_number, part_type, version=1, revision_count=0, released_revision_id=null."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /plm/parts"
              payload: { part_number: "MK1", name: "Make One", part_type: "MAKE", base_cost_cents: 1000 }
              as: Designer
              captures: { pid: $.data.id, v: $.data.version, rc: $.data.revision_count }
          assert:
            - "create returns 201; data.version == 1; data.revision_count == 0; data.released_revision_id == null"

      - name: get_part_returns_stored_entity
        claim_type: Retrieval
        grounds: [entities.Part, endpoints]
        distinguishing_aspect: "GET /plm/parts/{id} returns the part_number and part_type stored at create."
        test_recipe:
          setup: ["One Part exists."]
          setup_api_calls:
            - call: "POST /plm/parts"
              payload: { part_number: "MK2", name: "Make Two", part_type: "MAKE", base_cost_cents: 0 }
              as: Designer
              captures: { pid: $.data.id }
          trigger:
            - call: "GET /plm/parts/${pid}"
              payload: {}
              as: Viewer
              captures: { pn: $.data.part_number }
          assert:
            - "get.data.part_number == MK2 and data.part_type == MAKE"

      - name: list_parts_paginated_envelope
        claim_type: Listing
        grounds: [entities.Part, endpoints, response_envelope]
        distinguishing_aspect: "GET /plm/parts returns response_type=array with pagination fields total_count and has_more."
        test_recipe:
          setup: ["At least one Part exists."]
          setup_api_calls:
            - call: "POST /plm/parts"
              payload: { part_number: "MK3", name: "Make Three", part_type: "PHANTOM" }
              as: Designer
          trigger:
            - call: "GET /plm/parts"
              payload: {}
              as: Viewer
          assert:
            - "list returns 200; meta.total_count >= 1; has_more is boolean; response_type == array"

      - name: get_part_not_found
        claim_type: Not Found
        grounds:
          - "errors[ERR_NOT_FOUND]"
          - "endpoints"
        distinguishing_aspect: "GET /plm/parts/{id} with a random non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /plm/parts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Viewer
              captures: { eid: $.data.error_id }
          assert:
            - "get returns 404 with data.error_id == ERR_NOT_FOUND"

      - name: create_part_missing_required_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - "entities.Part.fields.part_type"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /plm/parts missing part_type returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /plm/parts"
              payload: { part_number: "MK4", name: "No Type" }
              as: Designer
              captures: { eid: $.data.error_id }
          assert:
            - "create returns 422 with data.error_id == ERR_INVALID_REQUEST"

      - name: buy_part_without_supplier_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - "entities.Part.fields.default_supplier_id"
          - "validations[priority=16]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "BUY part create without default_supplier_id is rejected with ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /plm/parts"
              payload: { part_number: "BUYNOSUP", name: "Buy No Sup", part_type: "BUY", base_cost_cents: 500 }
              as: Designer
              captures: { eid: $.data.error_id }
          assert:
            - "create returns 422 with data.error_id == ERR_INVALID_REQUEST"

      - name: make_part_with_supplier_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - "entities.Part.fields.default_supplier_id"
          - "validations[priority=16]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "MAKE part create that includes default_supplier_id is rejected with ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A supplier exists."]
          setup_api_calls:
            - call: "POST /plm/suppliers"
              payload: { name: "Acme", supplier_code: "ACME-MS" }
              as: SupplierManager
              captures: { sid: $.data.id }
          trigger:
            - call: "POST /plm/parts"
              payload: { part_number: "MAKESUP", name: "Make Sup", part_type: "MAKE", default_supplier_id: "${sid}" }
              as: Designer
              captures: { eid: $.data.error_id }
          assert:
            - "create returns 422 with data.error_id == ERR_INVALID_REQUEST"

      - name: duplicate_part_number_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - "entities.Part.fields.part_number"
          - "validations[priority=16]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Creating a second Part with an already-used part_number returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["One Part with part_number DUP exists."]
          setup_api_calls:
            - call: "POST /plm/parts"
              payload: { part_number: "DUPNUM", name: "First", part_type: "PHANTOM" }
              as: Designer
          trigger:
            - call: "POST /plm/parts"
              payload: { part_number: "DUPNUM", name: "Second", part_type: "PHANTOM" }
              as: Designer
              captures: { eid: $.data.error_id }
          assert:
            - "create returns 422 with data.error_id == ERR_INVALID_REQUEST"

      - name: computed_revision_count_and_released_revision
        claim_type: Computed Fields
        grounds: [entities.Part.fields.revision_count, entities.Part.fields.released_revision_id]
        distinguishing_aspect: "After creating one revision, Part.revision_count == 1 and released_revision_id stays null (no release yet)."
        test_recipe:
          setup: ["A MAKE part with one WORKING revision."]
          setup_api_calls:
            - call: "POST /plm/parts"
              payload: { part_number: "RCNT", name: "RevCount", part_type: "MAKE", base_cost_cents: 0 }
              as: Designer
              captures: { pid: $.data.id, v0: $.data.version }
            - call: "POST /plm/parts/${pid}/revisions"
              payload: { expected_part_version: "${v0}" }
              as: Designer
          trigger:
            - call: "GET /plm/parts/${pid}"
              payload: {}
              as: Viewer
              captures: { rc: $.data.revision_count, rel: $.data.released_revision_id }
          assert:
            - "get.data.revision_count == 1 and data.released_revision_id == null"

      - name: system_fields_input_ignored
        claim_type: System Fields
        grounds: [entities.Part.fields.released_revision_id, entities.Part.fields.revision_count]
        distinguishing_aspect: "Client-supplied id/version/revision_count on POST /plm/parts are ignored; server mints version=1, revision_count=0. (Extra fields rejected by ERR_INVALID_REQUEST.)"
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /plm/parts"
              payload: { part_number: "SYSIG", name: "SysIgnore", part_type: "PHANTOM", revision_count: 99 }
              as: Designer
              captures: { eid: $.data.error_id }
          assert:
            - "create returns 422 with data.error_id == ERR_INVALID_REQUEST (revision_count not an accepted input)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: submit_review_from_in_review_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.PartRevision.WORKING_to_IN_REVIEW"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Calling submit-review on an IN_REVIEW revision (already submitted) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A MAKE revision already IN_REVIEW."]
          setup_api_calls:
            - call: "POST /plm/suppliers"
              payload: { name: "S1", supplier_code: "S1-INVSM" }
              as: SupplierManager
              captures: { sid: $.data.id }
            - call: "POST /plm/parts"
              payload: { part_number: "INV-SM", name: "InvSubmit", part_type: "BUY", base_cost_cents: 60, default_supplier_id: "${sid}" }
              as: Designer
              captures: { leaf_id: $.data.id }
            - call: "POST /plm/parts"
              payload: { part_number: "INV-SM-ASM", name: "InvAsm", part_type: "MAKE", base_cost_cents: 0 }
              as: Designer
              captures: { pid: $.data.id, v0: $.data.version }
            - call: "POST /plm/parts/${pid}/revisions"
              payload: { expected_part_version: "${v0}" }
              as: Designer
              captures: { rid: $.data.id, rv: $.data.version }
            - call: "POST /plm/part-revisions/${rid}/bom-lines"
              payload: { child_part_id: "${leaf_id}", quantity: 1, expected_part_revision_version: "${rv}" }
              as: Designer
            - call: "POST /plm/part-revisions/${rid}/submit-review"
              payload: {}
              as: Designer
          trigger:
            - call: "POST /plm/part-revisions/${rid}/submit-review"
              payload: {}
              as: Designer
              captures: { eid: $.data.error_id }
          assert:
            - "submit-review returns 409 with data.error_id == ERR_INVALID_STATE"

      - name: empty_bom_blocks_submit_review
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.PartRevision.WORKING_to_IN_REVIEW"
          - "validations[priority=15]"
          - "errors[ERR_EMPTY_BOM]"
        distinguishing_aspect: "A MAKE revision with no BomLine returns ERR_EMPTY_BOM (409) on submit-review."
        test_recipe:
          setup: ["A MAKE part with one WORKING revision and zero BomLines."]
          setup_api_calls:
            - call: "POST /plm/parts"
              payload: { part_number: "EMPTY-BOM", name: "EmptyBom", part_type: "MAKE", base_cost_cents: 0 }
              as: Designer
              captures: { pid: $.data.id, v0: $.data.version }
            - call: "POST /plm/parts/${pid}/revisions"
              payload: { expected_part_version: "${v0}" }
              as: Designer
              captures: { rid: $.data.id }
          trigger:
            - call: "POST /plm/part-revisions/${rid}/submit-review"
              payload: {}
              as: Designer
              captures: { eid: $.data.error_id }
          assert:
            - "submit-review returns 409 with data.error_id == ERR_EMPTY_BOM"

      - name: initial_state_working_on_revision_create
        claim_type: Initial State
        grounds: [state_machines.PartRevision, entities.PartRevision.fields.lifecycle_state]
        distinguishing_aspect: "A newly created PartRevision starts in lifecycle_state == WORKING with rev_label A for the first revision."
        test_recipe:
          setup: ["A MAKE part with no revisions yet."]
          setup_api_calls:
            - call: "POST /plm/parts"
              payload: { part_number: "INIT-WK", name: "InitWork", part_type: "MAKE", base_cost_cents: 0 }
              as: Designer
              captures: { pid: $.data.id, v0: $.data.version }
          trigger:
            - call: "POST /plm/parts/${pid}/revisions"
              payload: { expected_part_version: "${v0}" }
              as: Designer
              captures: { st: $.data.lifecycle_state, rl: $.data.rev_label }
          assert:
            - "revision.data.lifecycle_state == WORKING and data.rev_label == A and data.supersedes_revision_id == null"

      - name: ecr_return_to_draft_via_reopen_cycle
        claim_type: Valid Transition
        grounds: [state_machines.EngineeringChangeRequest.REJECTED_to_DRAFT, entities.EngineeringChangeRequest.fields.submitted_by_user_id]
        distinguishing_aspect: "A REJECTED ECR reopened returns to DRAFT and clears submitted_by_user_id (revision loop)."
        test_recipe:
          setup: ["An ECR in REJECTED status."]
          setup_api_calls:
            - call: "POST /plm/parts"
              payload: { part_number: "ECR-RO", name: "EcrReopen", part_type: "PHANTOM" }
              as: Designer
              captures: { pid: $.data.id }
            - call: "POST /plm/change-requests"
              payload: { title: "ro", affected_part_id: "${pid}", reason_code: "OBSOLESCENCE" }
              as: Designer
              captures: { ecr: $.data.id }
            - call: "POST /plm/change-requests/${ecr}/submit"
              payload: {}
              as: Designer
            - call: "POST /plm/change-requests/${ecr}/reject"
              payload: {}
              as: ChangeAdmin
          trigger:
            - call: "POST /plm/change-requests/${ecr}/reopen"
              payload: {}
              as: Designer
              captures: { st: $.data.status, sub: $.data.submitted_by_user_id }
          assert:
            - "reopen.data.status == DRAFT and data.submitted_by_user_id == null"

      - name: terminal_state_obsolete_locked
        claim_type: Terminal State Lockdown
        grounds:
          - "state_machines.Document.RELEASED_to_OBSOLETE"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "An OBSOLETE document rejects obsolete again with ERR_INVALID_STATE (terminal lock)."
        test_recipe:
          setup: ["A document that has reached OBSOLETE."]
          setup_api_calls:
            - call: "POST /plm/documents"
              payload: { doc_number: "DOC-TERM", title: "Term Doc", doc_type: "SPEC" }
              as: Designer
              captures: { did: $.data.id }
            - call: "POST /plm/documents/${did}/submit-review"
              payload: {}
              as: Designer
            - call: "POST /plm/documents/${did}/release"
              payload: {}
              as: ChangeAdmin
            - call: "POST /plm/documents/${did}/obsolete"
              payload: {}
              as: ChangeAdmin
          trigger:
            - call: "POST /plm/documents/${did}/obsolete"
              payload: {}
              as: ChangeAdmin
              captures: { eid: $.data.error_id }
          assert:
            - "obsolete returns 409 with data.error_id == ERR_INVALID_STATE"

      - name: document_release_requires_released_part_cross_entity
        claim_type: guarded transitions
        grounds:
          - "state_machines.Document.IN_REVIEW_to_RELEASED"
          - "errors[ERR_PART_NOT_RELEASED]"
        distinguishing_aspect: "Releasing a document attached to a Part with no RELEASED revision returns ERR_PART_NOT_RELEASED (409)."
        test_recipe:
          setup: ["A document attached to a MAKE part with no released revision, IN_REVIEW."]
          setup_api_calls:
            - call: "POST /plm/parts"
              payload: { part_number: "DOC-PART", name: "DocPart", part_type: "MAKE", base_cost_cents: 0 }
              as: Designer
              captures: { pid: $.data.id }
            - call: "POST /plm/documents"
              payload: { doc_number: "DOC-CE", title: "Doc CE", doc_type: "CAD", part_id: "${pid}" }
              as: Designer
              captures: { did: $.data.id }
            - call: "POST /plm/documents/${did}/submit-review"
              payload: {}
              as: Designer
          trigger:
            - call: "POST /plm/documents/${did}/release"
              payload: {}
              as: ChangeAdmin
              captures: { eid: $.data.error_id }
          assert:
            - "release returns 409 with data.error_id == ERR_PART_NOT_RELEASED"

      - name: ship_nonconforming_unit_blocked
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.SerializedUnit.BUILT_to_SHIPPED"
          - "validations[priority=19]"
          - "errors[ERR_UNIT_NONCONFORMING]"
        distinguishing_aspect: "Shipping a BUILT but NONCONFORMING unit returns ERR_UNIT_NONCONFORMING (409)."
        test_recipe:
          setup: ["A BUILT unit on a released revision, flagged NONCONFORMING."]
          setup_api_calls:
            - call: "POST /plm/suppliers"
              payload: { name: "ShipSup", supplier_code: "SHIP-SUP" }
              as: SupplierManager
              captures: { sid: $.data.id }
            - call: "POST /plm/parts"
              payload: { part_number: "SHIP-LEAF", name: "ShipLeaf", part_type: "BUY", base_cost_cents: 50, default_supplier_id: "${sid}" }
              as: Designer
              captures: { leaf_id: $.data.id }
            - call: "POST /plm/parts"
              payload: { part_number: "SHIP-ASM", name: "ShipAsm", part_type: "MAKE", base_cost_cents: 0 }
              as: Designer
              captures: { pid: $.data.id, v0: $.data.version }
            - call: "POST /plm/parts/${pid}/revisions"
              payload: { expected_part_version: "${v0}" }
              as: Designer
              captures: { rid: $.data.id, rv: $.data.version }
            - call: "POST /plm/part-revisions/${rid}/bom-lines"
              payload: { child_part_id: "${leaf_id}", quantity: 1, expected_part_revision_version: "${rv}" }
              as: Designer
            - call: "POST /plm/part-revisions/${rid}/submit-review"
              payload: {}
              as: Designer
            - call: "POST /plm/change-requests"
              payload: { title: "ship", affected_part_id: "${pid}", reason_code: "DESIGN_DEFECT" }
              as: Designer
              captures: { ecr: $.data.id }
            - call: "POST /plm/change-requests/${ecr}/submit"
              payload: {}
              as: Designer
            - call: "POST /plm/change-requests/${ecr}/approve"
              payload: {}
              as: ChangeAdmin
            - call: "POST /plm/change-orders"
              payload: { change_request_id: "${ecr}", effectivity_date: "2026-01-02T00:00:00Z", required_approvals: 1 }
              as: ChangeAdmin
              as_user_id: "ca1"
              captures: { eco: $.data.id }
            - call: "POST /plm/change-orders/${eco}/affected-items"
              payload: { part_revision_id: "${rid}" }
              as: ChangeAdmin
              as_user_id: "ca1"
            - call: "POST /plm/change-orders/${eco}/approval-tasks"
              payload: { assignee_user_id: "ap1" }
              as: ChangeAdmin
              as_user_id: "ca1"
              captures: { t: $.data.id }
            - call: "POST /plm/change-orders/${eco}/submit-for-approval"
              payload: {}
              as: ChangeAdmin
              as_user_id: "ca1"
            - call: "POST /plm/approval-tasks/${t}/approve"
              payload: {}
              as: Approver
              as_user_id: "ap1"
            - call: "POST /plm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-03T00:00:00Z" }
              as: ChangeAdmin
            - call: "POST /plm/change-orders/${eco}/make-effective"
              payload: {}
              as: ChangeAdmin
              as_user_id: "ca1"
            - call: "POST /plm/serialized-units"
              payload: { serial_number: "SN-SHIP", part_revision_id: "${rid}" }
              as: QualityEngineer
              captures: { uid: $.data.id }
            - call: "POST /plm/serialized-units/${uid}/build"
              payload: {}
              as: QualityEngineer
            - call: "POST /plm/serialized-units/${uid}/flag-nonconforming"
              payload: {}
              as: QualityEngineer
          trigger:
            - call: "POST /plm/serialized-units/${uid}/ship"
              payload: {}
              as: QualityEngineer
              captures: { eid: $.data.error_id }
          assert:
            - "ship returns 409 with data.error_id == ERR_UNIT_NONCONFORMING"

      - name: pcn_accept_non_buy_part_blocked
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.SupplierChangeNotice.UNDER_ASSESSMENT_to_ACCEPTED"
          - "validations[priority=18]"
          - "errors[ERR_PART_NOT_BUY]"
        distinguishing_aspect: "Accepting a PCN whose affected_part_id is a MAKE part returns ERR_PART_NOT_BUY (409)."
        test_recipe:
          setup: ["A PCN UNDER_ASSESSMENT for a MAKE part."]
          setup_api_calls:
            - call: "POST /plm/suppliers"
              payload: { name: "PcnSup", supplier_code: "PCN-NB" }
              as: SupplierManager
              captures: { sid: $.data.id }
            - call: "POST /plm/parts"
              payload: { part_number: "PCN-MAKE", name: "PcnMake", part_type: "MAKE", base_cost_cents: 0 }
              as: Designer
              captures: { pid: $.data.id }
            - call: "POST /plm/supplier-change-notices"
              payload: { supplier_id: "${sid}", affected_part_id: "${pid}", pcn_reference: "PCN-NB-1" }
              as: SupplierManager
              captures: { pcn: $.data.id }
            - call: "POST /plm/supplier-change-notices/${pcn}/assess"
              payload: {}
              as: SupplierManager
          trigger:
            - call: "POST /plm/supplier-change-notices/${pcn}/accept"
              payload: {}
              as: SupplierManager
              captures: { eid: $.data.error_id }
          assert:
            - "accept returns 409 with data.error_id == ERR_PART_NOT_BUY"

      - name: eco_submit_without_affected_items_blocked
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.EngineeringChangeOrder.DRAFT_to_IN_APPROVAL"
          - "validations[priority=10]"
          - "errors[ERR_NO_AFFECTED_ITEMS]"
        distinguishing_aspect: "submit-for-approval on an ECO with zero ChangeAffectedItems returns ERR_NO_AFFECTED_ITEMS (409)."
        test_recipe:
          setup: ["A DRAFT ECO from an APPROVED ECR, with an approval task but no affected items."]
          setup_api_calls:
            - call: "POST /plm/parts"
              payload: { part_number: "NOAFF", name: "NoAff", part_type: "PHANTOM" }
              as: Designer
              captures: { pid: $.data.id }
            - call: "POST /plm/change-requests"
              payload: { title: "noaff", affected_part_id: "${pid}", reason_code: "COST_REDUCTION" }
              as: Designer
              captures: { ecr: $.data.id }
            - call: "POST /plm/change-requests/${ecr}/submit"
              payload: {}
              as: Designer
            - call: "POST /plm/change-requests/${ecr}/approve"
              payload: {}
              as: ChangeAdmin
            - call: "POST /plm/change-orders"
              payload: { change_request_id: "${ecr}", effectivity_date: "2026-02-01T00:00:00Z", required_approvals: 1 }
              as: ChangeAdmin
              as_user_id: "ca1"
              captures: { eco: $.data.id }
            - call: "POST /plm/change-orders/${eco}/approval-tasks"
              payload: { assignee_user_id: "ap1" }
              as: ChangeAdmin
              as_user_id: "ca1"
          trigger:
            - call: "POST /plm/change-orders/${eco}/submit-for-approval"
              payload: {}
              as: ChangeAdmin
              as_user_id: "ca1"
              captures: { eid: $.data.error_id }
          assert:
            - "submit-for-approval returns 409 with data.error_id == ERR_NO_AFFECTED_ITEMS"

      - name: eco_submit_insufficient_approvers_blocked
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.EngineeringChangeOrder.DRAFT_to_IN_APPROVAL"
          - "validations[priority=11]"
          - "errors[ERR_INSUFFICIENT_APPROVERS]"
        distinguishing_aspect: "submit-for-approval with required_approvals=2 but only 1 ApprovalTask returns ERR_INSUFFICIENT_APPROVERS (409)."
        test_recipe:
          setup: ["A DRAFT ECO with one affected item, required_approvals=2, only one approval task."]
          setup_api_calls:
            - call: "POST /plm/suppliers"
              payload: { name: "IsSup", supplier_code: "INSUF" }
              as: SupplierManager
              captures: { sid: $.data.id }
            - call: "POST /plm/parts"
