          setup:
            - "Clock 2026-08-01; mandatory ROLLING requirement; unit MED (no required certs); nurse Cora ACTIVE/CLEAR (license 2027-06-30, BLS 2027-03-31, competency CURRENT); shift S1 booked 2026-08-10 07:00-19:00 (SCHEDULED); clock moves to 2026-08-15."
