  - section: endpoints
    instances:
      - name: clock_set_endpoint_round_trips_logical_time
        claim_type: Standard CRUD
        grounds:
          - endpoints.POST_/field-force/_clock/set_current_utc
        distinguishing_aspect: "The test-driving clock endpoint returns the new logical time; before any set call the clock reads exactly 2026-09-01T00:00:00Z and never the wall clock."
        test_recipe:
          setup:
            - "Fresh server: logical clock untouched."
          setup_api_calls: []
          trigger:
            - call: "POST /field-force/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T12:30:00Z" }
              as: PlatformAdmin
          assert:
            - "the response status is 200 and data.current_utc == 2026-10-15T12:30:00Z"

      - name: transfer_accept_action_endpoint_moves_state_and_balances
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/field-force/sample-transfers/{id}/accept
          - state_machines.SampleTransfer.REQUESTED_to_ACCEPTED
        distinguishing_aspect: "accept is a pure action endpoint (empty body) that performs the two-sided balance mutation atomically: sender transferred_out += n and in_transit_out −= n, receiver transferred_in += n."
        test_recipe:
          setup:
            - "Sender with 20 units; receiver; REQUESTED transfer of 6."
          setup_api_calls:
            - call: "POST /field-force/regions"
              payload: { region_code: "ND-01", name: "North Dakota" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /field-force/regions/${r_id}/territories"
              payload: { territory_code: "TFA", name: "Fargo", cycle_start_date: "2026-09-01T00:00:00Z", cycle_end_date: "2026-12-01T00:00:00Z", cycle_sample_budget_units: 100 }
              as: PlatformAdmin
