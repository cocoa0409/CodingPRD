            - "SupplyOrder.${oB}.fulfillment_state == PENDING throughout (allocation axis moved, fulfillment axis untouched)"
            - "SupplyOrder.${oA}.allocation_state == DROPPED and fulfillment_state == CANCELLED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: licensee_termination_cascades_territory_appointment_order_capacity
        grounds:
          - state_machines.Licensee.ACTIVE_to_TERMINATED
          - state_machines.Territory.ASSIGNED_to_OPEN
          - state_machines.DeliveryAppointment.CONFIRMED_to_CANCELLED
          - state_machines.SupplyOrder.SHIPPED_to_PICKED
          - state_machines.SupplyOrder.ALLOCATED_to_DROPPED
        distinguishing_aspect: |
          Depth-3 chain from POST /api/licensees/{id}/transition TERMINATED:
          (1) Territory T-SEA flips OPEN; (2) that revocation cancels the
          CONFIRMED appointment in the region; (3) the cancellation reverts its
          order SHIPPED -> PICKED — while a parallel drop branch frees cycle
          capacity and promotes another licensee's WAITLISTED order. Distinct
          trigger from the line-retirement cascade.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Factory FAC-T3 (cap 10), line Alder 89900 ACTIVE, licensee Summit ACTIVE holding T-SEA, licensee Prairie ACTIVE, DC-KENT, cycle week 2026-09-07 OPEN."
            - "HD2: Summit home-delivery order qty 1 RESERVED; LA: Summit freight qty 6 RESERVED; LB: Prairie freight qty 5 WAITLISTED at submit (12 > 10)."
            - "Run: licensee_cap = 8 (10 - floor(10*0.25)); rank by created_at: HD2, LA allocated; LB stays WAITLISTED."
            - "HD2 picked; appointment CONFIRMED (window 2026-09-10 09:00-11:00, crew 1) -> HD2 SHIPPED."
          setup_api_calls:
            - *a_clock
            - call: "POST /api/factories"
              payload: { code: "FAC-T3", region: DOMESTIC, component_lines: [FOAM, FRAMES], weekly_capacity_units: 10 }
