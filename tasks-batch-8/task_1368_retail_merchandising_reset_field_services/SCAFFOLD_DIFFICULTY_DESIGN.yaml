  - rule_id: resource_temporal_overlap
    instances:
      - name: rep_schedule_half_open_overlap
        grounds:
          - validations[priority=7]
          - entities.Assignment.fields.scheduled_start
        distinguishing_aspect: |
          Interval semantics #1 (half-open [start,end) intersection on the
          FieldRep resource): a new assignment 10:00-12:00 collides with an
          existing 09:00-11:00 SCHEDULED assignment for the same rep and is
          rejected with ERR_REP_DOUBLE_BOOKED; adjacency (start == prior end)
          is not a collision.
        test_recipe:
          setup:
            - "W2 rep with existing SCHEDULED assignment 09:00-11:00; second store PENDING on same project"
          setup_api_calls:
            - call: "POST /retail-reset/clients"
              payload: { name: "Ov Client", billing_model: "PER_STORE", per_store_rate_cents: 3500 }
              as: ProjectManager
              captures: { client_id: "$.data.id" }
            - call: "POST /retail-reset/reps"
              payload: { full_name: "Ov Rep", employment_type: "W2", home_base_commute_miles: 5, mileage_rate_cents: 67, travel_minute_rate_cents: 40, mileage_policy: "HOME_BASED" }
              as: PayrollAdmin
              captures: { rep_id: "$.data.id" }
            - call: "POST /retail-reset/stores"
              payload: { store_number: "O1", name: "Ov Store 1", address: "22 Birch", timezone: "America/Chicago" }
              as: ProjectManager
              captures: { store_1: "$.data.id" }
            - call: "POST /retail-reset/stores"
              payload: { store_number: "O2", name: "Ov Store 2", address: "23 Birch", timezone: "America/Chicago" }
              as: ProjectManager
              captures: { store_2: "$.data.id" }
            - call: "POST /retail-reset/projects"
              payload: { client_id: "${client_id}", title: "Ov Proj", scope_type: "AUDIT" }
              as: ProjectManager
              captures: { project_id: "$.data.id", project_ver: "$.data.version" }
            - call: "POST /retail-reset/project-stores"
              payload: { project_id: "${project_id}", store_id: "${store_1}", due_date: "2026-08-20" }
              as: ProjectManager
              captures: { ps_1: "$.data.id" }
            - call: "POST /retail-reset/project-stores"
              payload: { project_id: "${project_id}", store_id: "${store_2}", due_date: "2026-08-20" }
              as: ProjectManager
              captures: { ps_2: "$.data.id" }
            - call: "POST /retail-reset/projects/${project_id}/scope"
              payload: { expected_project_version: "${project_ver} + 2" }
              as: ProjectManager
            - call: "POST /retail-reset/assignments"
              payload: { project_id: "${project_id}", project_store_id: "${ps_1}", rep_id: "${rep_id}", scheduled_start: "2026-08-05T09:00:00Z", scheduled_end: "2026-08-05T11:00:00Z" }
              as: ProjectManager
          trigger:
            - call: "POST /retail-reset/assignments"
              payload: { project_id: "${project_id}", project_store_id: "${ps_2}", rep_id: "${rep_id}", scheduled_start: "2026-08-05T10:00:00Z", scheduled_end: "2026-08-05T12:00:00Z" }
              as: ProjectManager
          assert:
            - "response error_id == ERR_REP_DOUBLE_BOOKED (409): [10:00,12:00) intersects [09:00,11:00)"
      - name: rep_single_on_site_occupancy
        grounds:
          - state_machines.Assignment.SCHEDULED_to_ON_SITE
          - validations[priority=4]
        distinguishing_aspect: |
          Interval semantics #2 (instantaneous-occupancy capacity of 1 on the
          FieldRep resource, different semantics than scheduled-interval
          intersection): a rep already ON_SITE at store A cannot check in at
          store B even when the two scheduled windows do NOT overlap, because
          check-in requires zero ON_SITE assignments for the rep — occupancy
          at an instant, not interval intersection.
        test_recipe:
