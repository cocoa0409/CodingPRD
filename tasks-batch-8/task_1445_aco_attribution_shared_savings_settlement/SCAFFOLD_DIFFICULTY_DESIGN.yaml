            - { call: "POST /aco/claims", payload: { agreement_period_id: "${p1}", beneficiary_id: "${bp}", participant_id: "${pa}", service_date: "2026-02-05", allowed_amount_cents: 20000, claim_type: "PART_B" }, as: ClaimsProcessor, captures: { c2: $.data.id } }
