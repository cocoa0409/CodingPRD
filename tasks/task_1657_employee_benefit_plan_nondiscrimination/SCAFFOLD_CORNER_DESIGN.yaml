scaffold_corner_design:
- section: entities
  instances:
  - name: employer_create_returns_201_with_system_fields
    claim_type: creation
    grounds:
    - entities.Employer
    distinguishing_aspect: POST /ndt/employers with all required fields returns 201, server-minted UUID id (no type prefix),
      created_at with 3 fractional digits, version == 1, status default ACTIVE.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls:
      - call: POST /ndt/employers
        payload:
          legal_name: Sierra Corp
          ein: '111222333'
          entity_type: S_CORPORATION
        as: PlatformAdmin
        captures:
          e_id: $.data.id
          e_ver: $.data.version
      trigger:
      - call: GET /ndt/employers/${e_id}
        payload: {}
        as: Auditor
      assert:
      - Employer.${e_id}.status == ACTIVE (default applied)
      - Employer.${e_id}.version == 1
      - id is a bare UUID with no prefix; created_at matches ISO8601 with 3 fractional digits
  - name: employer_create_missing_ein_returns_invalid_request
    claim_type: required_fields
    grounds:
    - entities.Employer.fields.ein
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: Missing required input field ein -> ERR_INVALID_REQUEST 400; nothing persisted.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: POST /ndt/employers
        payload:
          legal_name: No Ein Corp
          entity_type: CORPORATION
        as: PlatformAdmin
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_REQUEST and http status == 400
  - name: employer_get_nonexistent_returns_not_found
    claim_type: not_found
    grounds:
    - entities.Employer
    - errors[ERR_NOT_FOUND]
    distinguishing_aspect: GET /ndt/employers/{random-uuid} -> ERR_NOT_FOUND 404 with the error envelope shape.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: GET /ndt/employers/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2
        payload: {}
        as: Auditor
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_NOT_FOUND and http status == 404
  - name: employer_list_pagination_defaults
    claim_type: listing
    grounds:
    - entities.Employer
    - response_envelope
    distinguishing_aspect: GET /ndt/employers without params returns limit=10, offset=0; response carries total_count and
      has_more; creating 12 employers then reading page 2 with limit=10 returns 2 rows and has_more=false.
    test_recipe:
      setup:
      - 12 employers created
      setup_api_calls:
      - call: POST /ndt/employers
        payload:
          legal_name: P01
          ein: '100000001'
          entity_type: CORPORATION
        as: PlatformAdmin
      - call: POST /ndt/employers
        payload:
          legal_name: P02
          ein: '100000002'
          entity_type: CORPORATION
        as: PlatformAdmin
      - call: POST /ndt/employers
        payload:
          legal_name: P03
          ein: '100000003'
          entity_type: CORPORATION
        as: PlatformAdmin
      - call: POST /ndt/employers
        payload:
          legal_name: P04
          ein: '100000004'
          entity_type: CORPORATION
        as: PlatformAdmin
      - call: POST /ndt/employers
        payload:
          legal_name: P05
          ein: '100000005'
          entity_type: CORPORATION
        as: PlatformAdmin
      - call: POST /ndt/employers
        payload:
          legal_name: P06
          ein: '100000006'
          entity_type: CORPORATION
        as: PlatformAdmin
      - call: POST /ndt/employers
        payload:
          legal_name: P07
          ein: '100000007'
          entity_type: CORPORATION
        as: PlatformAdmin
      - call: POST /ndt/employers
        payload:
          legal_name: P08
          ein: '100000008'
          entity_type: CORPORATION
        as: PlatformAdmin
      - call: POST /ndt/employers
        payload:
          legal_name: P09
          ein: '100000009'
          entity_type: CORPORATION
        as: PlatformAdmin
      - call: POST /ndt/employers
        payload:
          legal_name: P10
          ein: '100000010'
          entity_type: CORPORATION
        as: PlatformAdmin
      - call: POST /ndt/employers
        payload:
          legal_name: P11
          ein: '100000011'
          entity_type: CORPORATION
        as: PlatformAdmin
      - call: POST /ndt/employers
        payload:
          legal_name: P12
          ein: '100000012'
          entity_type: CORPORATION
        as: PlatformAdmin
      trigger:
      - call: GET /ndt/employers
        payload: {}
        as: Auditor
      assert:
      - page 1 returns 10 rows, total_count == 12, has_more == true
      - GET /ndt/employers?offset=10 returns 2 rows, has_more == false
  - name: census_employee_computed_fields_ignore_client_input
    claim_type: computed_fields
    grounds:
    - entities.CensusEmployee.fields.hce_status
    - entities.CensusEmployee.fields.attributed_ownership_pct
    distinguishing_aspect: Client-supplied values for computed fields (hce_status, covered_status, key_employee_status, attributed_ownership_pct)
      on POST /plan-years/{id}/census-employees are rejected as unknown fields (ERR_INVALID_REQUEST) — they are never settable.
    test_recipe:
      setup:
      - plan year in CENSUS_COLLECTING
      setup_api_calls:
      - call: POST /ndt/employers
        payload:
          legal_name: Tango Corp
          ein: '200000001'
          entity_type: CORPORATION
        as: PlatformAdmin
        captures:
          te: $.data.id
      - call: POST /ndt/employers/${te}/plans
        payload:
          plan_name: Tango 401k
          plan_type: 401K
          plan_number: '001'
        as: PlanAdministrator
        captures:
          tp: $.data.id
      - call: POST /ndt/plans/${tp}/plan-years
        payload:
          year_label: 2026
          year_start: '2026-01-01'
          year_end: '2026-12-31'
        as: PlanAdministrator
        captures:
          tpy: $.data.id
      - call: POST /ndt/plan-years/${tpy}/open-census
        payload: {}
        as: PlanAdministrator
      trigger:
      - call: POST /ndt/plan-years/${tpy}/census-employees
        payload:
          ssn: '200000001'
          full_name: Tam
          date_of_birth: '1980-01-01'
          date_of_hire: '2020-01-01'
          employment_status: ACTIVE
          hce_status: HCE
        as: PlanAdministrator
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_REQUEST (computed field supplied by client)
  - name: census_employee_defaults_applied
    claim_type: defaults
    grounds:
    - entities.CensusEmployee.fields.ownership_pct_direct
    - entities.CensusEmployee.fields.is_officer
    distinguishing_aspect: Omitting ownership_pct_direct and is_officer yields 0 and false respectively on the created row.
    test_recipe:
      setup:
      - plan year in CENSUS_COLLECTING
      setup_api_calls:
      - call: POST /ndt/employers
        payload:
          legal_name: Uniform Corp
          ein: '200000002'
          entity_type: CORPORATION
        as: PlatformAdmin
        captures:
          ue: $.data.id
      - call: POST /ndt/employers/${ue}/plans
        payload:
          plan_name: Uniform 401k
          plan_type: 401K
          plan_number: '001'
        as: PlanAdministrator
        captures:
          up: $.data.id
      - call: POST /ndt/plans/${up}/plan-years
        payload:
          year_label: 2026
          year_start: '2026-01-01'
          year_end: '2026-12-31'
        as: PlanAdministrator
        captures:
          upy: $.data.id
      - call: POST /ndt/plan-years/${upy}/open-census
        payload: {}
        as: PlanAdministrator
      trigger:
      - call: POST /ndt/plan-years/${upy}/census-employees
        payload:
          ssn: '200000002'
          full_name: Uma
          date_of_birth: '1990-01-01'
          date_of_hire: '2021-01-01'
          employment_status: ACTIVE
        as: PlanAdministrator
        captures:
          uce: $.data.id
      assert:
      - CensusEmployee.${uce}.ownership_pct_direct == 0
      - CensusEmployee.${uce}.is_officer == false
      - CensusEmployee.${uce}.date_of_termination == null and family_member_of_ssn == null
  - name: invalid_enum_value_rejected
    claim_type: type_constraints
    grounds:
    - entities.Employer.fields.entity_type
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: entity_type 'B_CORP' is not a declared enum member -> ERR_INVALID_REQUEST 400.
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: POST /ndt/employers
        payload:
          legal_name: BadEnum
          ein: '200000003'
          entity_type: B_CORP
        as: PlatformAdmin
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_REQUEST and http status == 400
  - name: child_creation_requires_existing_parent_chain
    claim_type: parent_relationships
    grounds:
    - entities.Plan.fields.employer_id
    - errors[ERR_NOT_FOUND]
    distinguishing_aspect: POST /ndt/employers/{nonexistent}/plans -> ERR_NOT_FOUND 404 (parent chain validated left-to-right
      before body checks).
    test_recipe:
      setup:
      - empty DB
      setup_api_calls: []
      trigger:
      - call: POST /ndt/employers/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/plans
        payload:
          plan_name: Ghost
          plan_type: 401K
          plan_number: '001'
        as: PlanAdministrator
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_NOT_FOUND and http status == 404
  - name: family_attribution_rollup_computed
    claim_type: computed_fields
    grounds:
    - calculations.ownership_attribution
    - entities.CensusEmployee.fields.family_member_of_ssn
    distinguishing_aspect: 'Employee A owns 3% direct; employee B (spouse, family_member_of_ssn -> A) owns 4% direct. After
      lock: A.attributed == 3+4 == 7 (HCE via >5%), B.attributed == 4+3 == 7 (also HCE). One-hop only.'
    test_recipe:
      setup:
      - plan year with spouses A (3% direct) and B (4% direct, family_member_of_ssn = A.ssn), both with CURRENT_YEAR W2 comp
        below threshold
      setup_api_calls:
      - call: POST /ndt/employers
        payload:
          legal_name: Victor Corp
          ein: '200000004'
          entity_type: CORPORATION
        as: PlatformAdmin
        captures:
          ve: $.data.id
      - call: POST /ndt/regulatory-limits
        payload:
          year_label: 2026
          hce_comp_threshold_cents: 15500000
          key_officer_comp_threshold_cents: 22000000
          sec402g_limit_cents: 2350000
          sec415_annual_additions_limit_cents: 6900000
          dependent_care_limit_cents: 500000
        as: PlatformAdmin
      - call: POST /ndt/employers/${ve}/plans
        payload:
          plan_name: Victor 401k
          plan_type: 401K
          plan_number: '001'
        as: PlanAdministrator
        captures:
          vp: $.data.id
      - call: POST /ndt/plans/${vp}/plan-versions
        payload:
          effective_start: '2026-01-01'
          effective_end: '2026-12-31'
          comp_definition: W2
          safe_harbor_design: NONE
        as: PlanAdministrator
        captures:
          vpv: $.data.id
      - call: POST /ndt/plan-versions/${vpv}/adopt
        payload: {}
        as: PlanAdministrator
      - call: POST /ndt/plans/${vp}/plan-years
        payload:
          year_label: 2026
          year_start: '2026-01-01'
          year_end: '2026-12-31'
        as: PlanAdministrator
        captures:
          vpy: $.data.id
          vpy_v0: $.data.version
      - call: POST /ndt/plan-years/${vpy}/open-census
        payload: {}
        as: PlanAdministrator
      - call: POST /ndt/plan-years/${vpy}/census-employees
        payload:
          ssn: '200000101'
          full_name: Alex A
          date_of_birth: '1978-01-01'
          date_of_hire: '2015-01-01'
          employment_status: ACTIVE
          ownership_pct_direct: 3
        as: PlanAdministrator
        captures:
          va: $.data.id
      - call: POST /ndt/plan-years/${vpy}/census-employees
        payload:
          ssn: '200000102'
          full_name: Blair B
          date_of_birth: '1979-01-01'
          date_of_hire: '2016-01-01'
          employment_status: ACTIVE
          ownership_pct_direct: 4
          family_member_of_ssn: '200000101'
        as: PlanAdministrator
        captures:
          vb: $.data.id
      - call: POST /ndt/census-employees/${va}/compensation-records
        payload:
          comp_source: W2
          amount_cents: 8000000
          period: CURRENT_YEAR
        as: PlanAdministrator
      - call: POST /ndt/census-employees/${vb}/compensation-records
        payload:
          comp_source: W2
          amount_cents: 8000000
          period: CURRENT_YEAR
        as: PlanAdministrator
      - call: GET /ndt/plan-years/${vpy}
        payload: {}
        as: PlanAdministrator
        captures:
          occ_v_0: $.data.version
      - call: POST /ndt/plan-years/${vpy}/lock-census
        payload:
          expected_plan_year_version: ${occ_v_0}
        as: PlanAdministrator
      trigger:
      - call: GET /ndt/census-employees/${va}
        payload: {}
        as: ComplianceAnalyst
        captures:
          va_own: $.data.attributed_ownership_pct
          va_hce: $.data.hce_status
      - call: GET /ndt/census-employees/${vb}
        payload: {}
        as: ComplianceAnalyst
        captures:
          vb_own: $.data.attributed_ownership_pct
          vb_hce: $.data.hce_status
      assert:
      - CensusEmployee.${va}.attributed_ownership_pct == 7 (3 direct + 4 from spouse one hop)
      - CensusEmployee.${vb}.attributed_ownership_pct == 7 (4 direct + 3 attributed out-and-back one hop)
      - both hce_status == HCE (7 > 5.0)
- section: state_machines
  instances:
  - name: plan_year_invalid_transition_file_from_draft
    claim_type: invalid_transition
    grounds:
    - state_machines.PlanYear
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: POST /plan-years/{id}/file from DRAFT -> ERR_INVALID_STATE 409; no side effects fire (status remains
      DRAFT).
    test_recipe:
      setup:
      - plan year created, never opened
      setup_api_calls:
      - call: POST /ndt/employers
        payload:
          legal_name: Whiskey Corp
          ein: '300000001'
          entity_type: CORPORATION
        as: PlatformAdmin
        captures:
          we: $.data.id
      - call: POST /ndt/employers/${we}/plans
        payload:
          plan_name: Whiskey 401k
          plan_type: 401K
          plan_number: '001'
        as: PlanAdministrator
        captures:
          wp: $.data.id
      - call: POST /ndt/plans/${wp}/plan-years
        payload:
          year_label: 2026
          year_start: '2026-01-01'
          year_end: '2026-12-31'
        as: PlanAdministrator
        captures:
          wpy: $.data.id
      trigger:
      - call: POST /ndt/plan-years/${wpy}/file
        payload: {}
        as: PlanAdministrator
        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_INVALID_STATE and PlanYear remains DRAFT on re-read
  - name: plan_year_terminal_lockdown_terminated
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.PlanYear
    distinguishing_aspect: From TERMINATED every further transition (open-census, lock-census, terminate again, file) is rejected
      ERR_INVALID_STATE.
    test_recipe:
      setup:
      - plan year TERMINATED from CENSUS_COLLECTING
      setup_api_calls:
      - call: POST /ndt/employers
        payload:
          legal_name: Xray Corp
          ein: '300000002'
          entity_type: CORPORATION
        as: PlatformAdmin
        captures:
          xe: $.data.id
      - call: POST /ndt/employers/${xe}/plans
        payload:
          plan_name: Xray 401k
          plan_type: 401K
          plan_number: '001'
        as: PlanAdministrator
        captures:
          xp: $.data.id
      - call: POST /ndt/plans/${xp}/plan-years
        payload:
          year_label: 2026
          year_start: '2026-01-01'
          year_end: '2026-12-31'
        as: PlanAdministrator
        captures:
          xpy: $.data.id
      - call: POST /ndt/plan-years/${xpy}/open-census
        payload: {}
        as: PlanAdministrator
      - call: POST /ndt/plan-years/${xpy}/terminate
        payload: {}
        as: PlanAdministrator
      trigger:
      - call: POST /ndt/plan-years/${xpy}/open-census
        payload: {}
        as: PlanAdministrator
        captures:
          err1: $.data.error_id
      - call: POST /ndt/plan-years/${xpy}/file
        payload: {}
        as: PlanAdministrator
        captures:
          err2: $.data.error_id
      assert:
      - both error_ids == ERR_INVALID_STATE; PlanYear.status remains TERMINATED
      - Plan.status == TERMINATED (cascade-up fired on terminate)
  - name: testrun_idempotent_void_second_call_rejected
    claim_type: idempotency
    grounds:
    - state_machines.TestRun.QUEUED_to_VOID
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: Voiding a QUEUED run succeeds; voiding it again (now VOID) -> ERR_INVALID_STATE (terminal lockdown),
      proving the trigger is not idempotent-replayable.
    test_recipe:
      setup:
      - locked plan year with one QUEUED ADP run
      setup_api_calls:
      - call: POST /ndt/employers
        payload:
          legal_name: Yankee Corp
          ein: '300000003'
          entity_type: CORPORATION
        as: PlatformAdmin
        captures:
          ye: $.data.id
      - call: POST /ndt/regulatory-limits
        payload:
          year_label: 2026
          hce_comp_threshold_cents: 15500000
          key_officer_comp_threshold_cents: 22000000
          sec402g_limit_cents: 2350000
          sec415_annual_additions_limit_cents: 6900000
          dependent_care_limit_cents: 500000
        as: PlatformAdmin
      - call: POST /ndt/employers/${ye}/plans
        payload:
          plan_name: Yankee 401k
          plan_type: 401K
          plan_number: '001'
        as: PlanAdministrator
        captures:
          yp: $.data.id
      - call: POST /ndt/plans/${yp}/plan-versions
        payload:
          effective_start: '2026-01-01'
          effective_end: '2026-12-31'
          comp_definition: W2
          safe_harbor_design: NONE
        as: PlanAdministrator
        captures:
          ypv: $.data.id
      - call: POST /ndt/plan-versions/${ypv}/adopt
        payload: {}
        as: PlanAdministrator
      - call: POST /ndt/plans/${yp}/plan-years
        payload:
          year_label: 2026
          year_start: '2026-01-01'
          year_end: '2026-12-31'
        as: PlanAdministrator
        captures:
          ypy: $.data.id
          ypy_v0: $.data.version
      - call: POST /ndt/plan-years/${ypy}/open-census
        payload: {}
        as: PlanAdministrator
      - call: POST /ndt/plan-years/${ypy}/census-employees
        payload:
          ssn: '300000101'
          full_name: Yuri
          date_of_birth: '1980-01-01'
          date_of_hire: '2020-01-01'
          employment_status: ACTIVE
        as: PlanAdministrator
        captures:
          yce: $.data.id
      - call: POST /ndt/census-employees/${yce}/compensation-records
        payload:
          comp_source: W2
          amount_cents: 9000000
          period: CURRENT_YEAR
        as: PlanAdministrator
      - call: GET /ndt/plan-years/${ypy}
        payload: {}
        as: PlanAdministrator
        captures:
          occ_v_1: $.data.version
      - call: POST /ndt/plan-years/${ypy}/lock-census
        payload:
          expected_plan_year_version: ${occ_v_1}
        as: PlanAdministrator
      - call: POST /ndt/plan-years/${ypy}/test-runs
        payload:
          test_scope: ADP_401K
          run_mode: FINAL
        as: ComplianceAnalyst
        captures:
          ytr: $.data.id
      trigger:
      - call: POST /ndt/test-runs/${ytr}/void
        payload: {}
        as: ComplianceAnalyst
      - call: POST /ndt/test-runs/${ytr}/void
        payload: {}
        as: ComplianceAnalyst
        captures:
          err: $.data.error_id
      assert:
      - 'first void: TestRun.status == VOID'
      - 'second void: error_id == ERR_INVALID_STATE (VOID is terminal)'
  - name: correction_execute_from_proposed_rejected
    claim_type: precondition_enforcement
    grounds:
    - state_machines.Correction.APPROVED_to_EXECUTED
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: POST /corrections/{id}/execute while PROPOSED (skipping approve) -> ERR_INVALID_STATE; approval
      chain cannot be skipped.
    test_recipe:
