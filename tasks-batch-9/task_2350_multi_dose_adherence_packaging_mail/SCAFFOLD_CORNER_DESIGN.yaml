        distinguishing_aspect: "Cancelling auto-ship reaches across aggregates: the Patient's own dimension moves to CANCELLED and every ISSUED CreditMemo of that patient becomes VOIDED with the balance zeroed, because an unredeemed credit has no future fill to land on."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z; synchronized patient with one prescription; cycle C1 adjudicated, rolled, packed by tech-01"
            - "the imaging pass marks pouch 7 as a count mismatch, so the verify by rph-01 quarantines the roll and issues a 500-cent FAILED_VERIFICATION credit"
          setup_api_calls:
            - call: "POST /pharmacy/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pharmacy/insurance-plans"
              payload: { payer_name: "Northwind PBM", bin_number: "610502", generic_copay_cents_per_day: 34, brand_copay_cents_per_day: 74, specialty_copay_cents_per_day: 44, refill_too_soon_threshold_pct: 75, coinsurance_pct: 20 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pharmacy/patients"
              payload: { full_name: "Rosa Klein", date_of_birth: "1954-09-09", email: "rosa.klein@example.com", state_code: "WA", insurance_plan_id: "${plan_id}" }
              as: PharmacyOperations
              captures: { pt_id: $.data.id }
            - call: "POST /pharmacy/prescriptions"
              payload: { patient_id: "${pt_id}", prescriber_npi: "1487654321", drug_name: "Metformin ER", ndc: "00093-1049-01", strength: "500mg", form: "TABLET", copay_tier: "GENERIC", dose_times: ["MORNING"], quantity_per_dose: 1, days_supply_written: 30, refills_authorized: 3, written_date: "2026-05-01", expiration_date: "2027-05-01", last_dispensed_date: "2026-07-25", last_dispensed_days_supply: 28 }
              as: Prescriber
              captures: { rx1: $.data.id }
            - call: "POST /pharmacy/patients/${pt_id}/synchronize"
              payload: { anchor_fill_day: 15, sync_mode: "BRIDGE_TO_START" }
              as: PharmacyOperations
            - call: "POST /pharmacy/fill-cycles"
              payload: { patient_id: "${pt_id}", cycle_start_date: "2026-08-15", day_supply_days: 28 }
              as: PharmacyOperations
              captures: { c1: $.data.id }
            - call: "POST /pharmacy/fill-cycles/${c1}/adjudicate"
              payload: {}
              as: VerifyingPharmacist
            - call: "POST /pharmacy/fill-cycles/${c1}/generate-roll"
              payload: {}
              as: PackagingTechnician
              as_user_id: "tech-01"
              captures: { roll: $.data.id }
            - call: "POST /pharmacy/pouch-rolls/${roll}/pack"
              payload: {}
              as: PackagingTechnician
              as_user_id: "tech-01"
            - call: "POST /pharmacy/pouch-rolls/${roll}/verification-images"
              payload: { image_confidence_pct: 97, overrides: [{ pouch_index: 7, detected_pill_count: 0 }] }
              as: PackagingTechnician
              as_user_id: "tech-02"
            - call: "POST /pharmacy/pouch-rolls/${roll}/verify"
              payload: {}
              as: VerifyingPharmacist
              as_user_id: "rph-01"
            - call: "GET /pharmacy/credit-memos"
              payload: { patient_id: "${pt_id}", reason: "FAILED_VERIFICATION" }
              as: PharmacyOperations
              captures: { memo: "$.data[0].id", memo_amount: "$.data[0].amount_cents" }
          trigger:
            - call: "POST /pharmacy/patients/${pt_id}/autoship"
              payload: { action: "CANCEL" }
              as: PharmacyOperations
              captures: { autoship: $.data.autoship_status, balance_after: $.data.credit_balance_cents }
          assert:
            - "${memo_amount} == 500 and CreditMemo.${memo}.status was ISSUED with cycle_id ${c1} and applied_to_cycle_id null before the trigger"
            - "${autoship} == CANCELLED with pause_reason PATIENT_REQUEST"
            - "CreditMemo.${memo}.status == VOIDED and ${balance_after} == 0"
            - "PouchRoll.${roll}.verification_status is still FAILED_QUARANTINED — voiding the credit does not un-fail the roll"

      - name: fill_cycle_packaging_and_insurance_dimensions_are_independent
        claim_type: parallel
        grounds:
          - state_machines.FillCycle
          - entities.FillCycle.fields.insurance_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / fill_cycle_insurance_and_packaging_dimensions_move_independently
          rationale: "That §1.8 instance drives insurance_status NOT_ADJUDICATED -> REJECTED_TOO_SOON -> CLEARED while packaging_status stays put, which is exactly this parallel-shape claim."
      - name: generate_roll_is_guarded_by_prescription_state
        claim_type: guarded_transitions
        grounds:
          - validations.priority_25
          - errors.ERR_RX_PENDING_AUTHORIZATION
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / roll_generation_blocked_by_another_cycles_authorization_hold
          rationale: "The cross-entity guard (roll may only be built when every ADJUDICATED line's Prescription is ACTIVE) is asserted there in both polarities."
      - name: autoship_pause_cascades_cancellation_to_draft_cycles
        claim_type: cascade_down
        grounds:
          - state_machines.Patient
          - entities.CycleLine.fields.line_status
        excluded_because:
          difficulty_instance: transitive_cascade / missed_pickup_sweep_cascades_to_cancelled_draft_cycle_lines
          rationale: "That §1.8 instance asserts the full pause cascade (Shipment -> Patient -> DRAFT FillCycle -> CycleLine) end to end."
      - name: cold_chain_exception_compensates_the_stamped_dispense
        claim_type: compensation
        grounds:
          - state_machines.Shipment
          - entities.Prescription.fields.prior_last_dispensed_days_supply
        excluded_because:
          difficulty_instance: compensating_invariant / cold_chain_reversal_conserves_refill_units_and_dispensed_days
          rationale: "Every reversed side effect of the excursion path is enumerated and reconciled there; duplicating it here would add no observable."
      - name: authorization_chase_loop_terminates_at_escalation
        claim_type: cyclic
        grounds:
          - state_machines.RefillAuthorizationRequest
          - validations.priority_34
        excluded_because:
          difficulty_instance: non_linear_state_machine / refill_authorization_chase_loop_then_escalation_exit
          rationale: "The SENT <-> NO_RESPONSE loop, its MAX_CHASE_ROUNDS ceiling and the ESCALATED exit are all asserted by that instance."

  - section: calculations
