            - { call: "POST /crating/wood-batches", payload: { ht_certificate_no: "HT-OLD-01", treatment_type: HT, expires_at: "2026-06-01T00:00:00Z", received_board_feet: 500, stamps_acquired: 2 }, as: ComplianceOfficer, captures: { batch_id: $.data.id } }
