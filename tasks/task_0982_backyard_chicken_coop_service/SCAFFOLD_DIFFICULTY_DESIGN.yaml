              as: Customer
              as_user_id: "${hh_id}"
              captures: { v1: $.data.id }
            - call: "POST /coopcare/service-visits/${v1}/assign"
              payload: { technician_id: "tech-5" }
              as: Dispatcher
            - call: "POST /coopcare/service-visits"
              payload: { household_id: "${hh_id}", coop_site_id: "${coop_id}", visit_type: "SETUP_INSTALL", scheduled_start: "2026-06-10T10:15:00Z", scheduled_end: "2026-06-10T11:15:00Z" }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { v2: $.data.id }
            - call: "POST /coopcare/service-visits"
              payload: { household_id: "${hh_id}", coop_site_id: "${coop_id}", visit_type: "SETUP_INSTALL", scheduled_start: "2026-06-10T10:30:00Z", scheduled_end: "2026-06-10T11:30:00Z" }
              as: Customer
              as_user_id: "${hh_id}"
              captures: { v3: $.data.id }
          trigger:
            - call: "POST /coopcare/service-visits/${v2}/assign"
