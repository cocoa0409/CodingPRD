            - "GET /cases/${case_id}/ledger returns 2 rows: seq 1 DEPOSIT 100000 (balance_after_cents 100000), seq 2 DRAW 80000 (balance_after_cents 20000)"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: closed_case_beats_retainer_exhaustion_on_expense_approval
        grounds:
          - validations[priority=8]
          - validations[priority=18]
          - errors[ERR_CASE_NOT_ACTIVE]
          - errors[ERR_RETAINER_EXHAUSTED]
        distinguishing_aspect: |
          Error-category pair `state` (priority 8, ERR_CASE_NOT_ACTIVE) vs `business_fiscal`
          (priority 18, ERR_RETAINER_EXHAUSTED): the approval simultaneously targets a CLOSED case
          AND would drive the retainer to -50000, and the lower-numbered state check must win, so the
          response is 409 ERR_CASE_NOT_ACTIVE and never 402.
