scaffold_difficulty_design:

  # -------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: royalty_provisional_vs_final_exclusive_license
        grounds:
          - calculations.royalty_period_amount
          - state_machines.Contract.SIGNING_to_SIGNED
          - entities.RoyaltySchedule.fields.provisional_royalty_cents
          - entities.RoyaltySchedule.fields.final_royalty_cents
          - entities.Contract.fields.min_guarantee_cents
        distinguishing_aspect: |
          Provisional uses forecast_revenue_cents with no floor; final settlement applies
          the EXCLUSIVE_LICENSE min_guarantee floor — identical inputs except for the
          variant flag produce different cents. The subject is the Contract / RoyaltySchedule
          entity domain (licensing revenue), distinct from the AnnualFeeSchedule surcharge
          domain in the second instance.
        test_recipe:
          setup:
            - "Create business unit BU1 (annual_budget_cents=1000000000)"
            - "Create IPManager-prosecuted IPRight IP1, ip_type=PATENT, primary_jurisdiction=US, business_unit_id=BU1; walk it to REGISTERED via one JurisdictionFiling registration"
            - "Create ContractTemplate T1 with contract_type=EXCLUSIVE_LICENSE"
            - "Create Contract C1 with contract_type=EXCLUSIVE_LICENSE, royalty_rate=0.10, min_guarantee_cents=800000 (i.e. $8000.00), two unique parties both signature_required=true, ip_right_id=IP1, business_unit_id=BU1, template_id=T1"
            - "Drive Contract through DRAFT→SIGNING (each party signs)→SIGNED→FILED"
            - "Create RoyaltySchedule R1 on C1 with period_index=1, forecast_revenue_cents=10000000 (i.e. $100000.00), non-overlapping period dates"
          trigger:
            - "GET /royalty-schedules/{R1.id}  — provisional_royalty_cents was computed at creation"
            - "POST /royalty-schedules/{R1.id}/settle with actual_revenue_cents=9000000 (i.e. $90000.00)"
          assert:
            - "Before settle: RoyaltySchedule.provisional_royalty_cents == 1000000 (i.e. round_half_up(10000000 * 0.10))"
            - "After settle: RoyaltySchedule.final_royalty_cents == 900000 (i.e. max(round_half_up(9000000*0.10)=900000, min_guarantee_cents=800000))"
            - "provisional_royalty_cents (1000000) != final_royalty_cents (900000) on identical contract row"
            - "RoyaltySchedule.status == SETTLED"

      - name: annual_fee_surcharge_on_pay_vs_on_sweep
        grounds:
          - calculations.annual_fee_surcharge
          - state_machines.AnnualFeeSchedule.PENDING_to_LATE
          - state_machines.AnnualFeeSchedule.LATE_to_ABANDONED
          - entities.AnnualFeeSchedule.fields.surcharge_cents
          - endpoints./_sweep/annual-fees
          - endpoints./annual-fees/{id}/pay
        distinguishing_aspect: |
          The on_payment variant books a Cost row of category ANNUAL_FEE and sets
          total_paid_cents = base_fee + surcharge; the on_sweep variant transitions
          status to LATE/ABANDONED without booking a cost or computing surcharge_cents.
          Identical AnnualFeeSchedule + clock state produce different observable
          mutations depending on which entry-point fires first. Entity domain is
          AnnualFeeSchedule (annuity lifecycle), distinct from the RoyaltySchedule
          contractual revenue domain above.
        test_recipe:
          setup:
            - "Set up BU1, an Agent A1 (qualification_verified=true, jurisdictions=['US']), IPRight IP1 registered in US owned by BU1"
            - "POST /ip-rights/{IP1}/annual-fees fee_year=1, base_fee_cents=100000 (i.e. $1000.00), jurisdiction=US, due_date=now+10d, auto_pay_authorized=false, assigned_agent_id=A1"
            - "POST /_clock/advance seconds=(10+45)*86400  (45 days past due_date, inside grace)"
          trigger:
            - "Branch A (on_payment, primary run): POST /annual-fees/{F1}/pay"
            - "Branch B (on_sweep, fresh DB run with identical setup): POST /_sweep/annual-fees"
          assert:
            - "Branch A: AnnualFeeSchedule.status == PAID, surcharge_cents == 25000 (round_half_up(100000 * 0.25)), total_paid_cents == 125000, exactly one Cost row of category=ANNUAL_FEE with amount_usd_cents==125000 exists"
            - "Branch B: AnnualFeeSchedule.status == LATE, surcharge_cents == 0, zero Cost rows of category=ANNUAL_FEE exist for this fee"

  # -------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: late_surcharge_tiered_with_branch_on_state          # MODE (a)
        grounds:
          - calculations.annual_fee_surcharge
          - entities.AnnualFeeSchedule.fields.base_fee_cents
          - entities.AnnualFeeSchedule.fields.due_date
          - entities.AnnualFeeSchedule.fields.grace_end_date
        distinguishing_aspect: |
          Mode (a) — 3 inputs (base_fee_cents, days_late, current schedule status),
          non-linear interaction (four-tier piecewise rate selection that ALSO branches
          to ABANDONED when days_late>180 with no surcharge booked). Two valid
          interpretations of the same prose produce different cents at the tier
          boundary (day-30 vs day-31).
        test_recipe:
          setup:
            - "BU1, Agent A1 verified, IPRight IP1 REGISTERED in US"
            - "POST annual-fee F1 base_fee_cents=100000 (i.e. $1000.00) due_date=now+1d"
          trigger:
            - "POST /_clock/advance to exactly 1d + 30d after creation"
            - "POST /annual-fees/{F1}/pay"
          assert:
            - "AnnualFeeSchedule.surcharge_cents == 10000 (i.e. round_half_up(100000 * 0.10) at days_late=30)"
            - "AnnualFeeSchedule.total_paid_cents == 110000 (= 100000 + 10000)"

      - name: cost_allocation_pinned_round_per_then_remainder      # MODE (b)
        grounds:
          - calculations.cost_allocation
          - entities.Cost.fields.allocation_rules
          - entities.Cost.fields.allocations
          - endpoints./costs
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters. "Round each portion then
          push remainder to the last bucket" vs "split first, round at end" produce
          different per-bucket cents on the same input. The scaffold pins
          round-per-allocation order. This is a different combinatorial mode than
          the (a) tiered surcharge above.
        test_recipe:
          setup:
            - "Create 3 BUs: BU_A, BU_B, BU_C each with annual_budget_cents=1000000000"
            - "Create IPRight IP1, REGISTERED, owned by BU_A"
          trigger:
            - "POST /costs body: category=APPLICATION, ip_right_id=IP1, currency=USD, amount_native_cents=100000 (i.e. $1000.00), fx_rate_to_usd=1.0, allocation_rules=[{BU_A,3333},{BU_B,3333},{BU_C,3334}], booked_at=now"
          assert:
            - "Cost.amount_usd_cents == 100000"
            - "Cost.allocations[0].allocated_cents == 33330  (= round_half_up(100000 * 3333 / 10000))"
            - "Cost.allocations[1].allocated_cents == 33330  (same formula, second bucket)"
            - "Cost.allocations[2].allocated_cents == 33340  (= 100000 - 33330 - 33330; remainder pinned to LAST rule)"
            - "Sum allocations[i].allocated_cents == 100000 (exact invariant)"

  # -------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: ip_right_office_action_cycle
        grounds:
          - state_machines.IPRight.FILED_to_OFFICE_ACTION
          - state_machines.IPRight.OFFICE_ACTION_to_FILED
          - state_machines.ApplicationOfficeAction.PENDING_to_RESPONDED
        distinguishing_aspect: |
          Cyclic shape on the IPRight entity: FILED → OFFICE_ACTION → FILED can repeat
          across distinct office-action rounds, plus the office-action machine has
          two branches (RESPONDED vs CLOSED_ABANDONED) on PENDING. Different entity
          domain from the Contract cycle below (IP prosecution vs licensing contract).
        test_recipe:
          setup:
            - "BU1, verified Agent A1 jurisdictions=['US'], IPRight IP1 registered to FILED state via one JurisdictionFiling JF1"
          trigger:
            - "POST /ip-rights/{IP1}/office-actions {jurisdiction_filing_id:JF1, assigned_agent_id:A1, response_due_at: now+30d} -> IP1 FILED→OFFICE_ACTION"
            - "POST /office-actions/{OA1}/respond as InternalAgent A1 -> IP1 OFFICE_ACTION→FILED"
            - "POST /ip-rights/{IP1}/office-actions again {jurisdiction_filing_id:JF1, assigned_agent_id:A1, response_due_at: now+30d} -> IP1 FILED→OFFICE_ACTION (second cycle)"
          assert:
            - "IP1.status sequence == ['FILED','OFFICE_ACTION','FILED','OFFICE_ACTION'] across the four operations"
            - "Two distinct ApplicationOfficeAction rows exist, both having traversed PENDING state"

      - name: contract_filed_amended_filed_cycle
        grounds:
          - state_machines.Contract.FILED_to_AMENDED
          - state_machines.Contract.AMENDED_to_FILED
          - endpoints./contracts/{id}/amend
        distinguishing_aspect: |
          Cyclic shape on the Contract entity: FILED → AMENDED → FILED can repeat
          for multiple amendment cycles. Different entity from the IPRight cycle —
          IP prosecution domain vs contract-management domain — satisfying the
          "different entities" clause.
        test_recipe:
          setup:
            - "BU1, IPRight IP1 in REGISTERED, ContractTemplate T1 (EXCLUSIVE_LICENSE), Contract C1 driven to FILED"
          trigger:
            - "POST /contracts/{C1}/amend -> C1 FILED→AMENDED (audit snapshot 1)"
            - "POST /contracts/{C1}/file-with-authority -> C1 AMENDED→FILED"
            - "POST /contracts/{C1}/amend -> C1 FILED→AMENDED (audit snapshot 2)"
          assert:
            - "C1.status sequence == ['FILED','AMENDED','FILED','AMENDED']"
            - "Two AuditEntry rows with event_type==CONTRACT_RECORD recording the two amendment snapshots"

  # -------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: fee_abandon_to_filing_abandon_to_ipright_abandon   # depth 3
        grounds:
          - state_machines.AnnualFeeSchedule.LATE_to_ABANDONED
          - state_machines.IPRight.REGISTERED_to_ABANDONED
          - entities.JurisdictionFiling.fields.status
        distinguishing_aspect: |
          Depth-3 cascade: sweep marks AnnualFeeSchedule ABANDONED, which itself
          mutates the matching JurisdictionFiling to ABANDONED, which in turn (when
          it is the last open sibling) mutates the parent IPRight to ABANDONED.
          Each link is caused by the previous link, not by the original sweep call —
          it is a true chain, not a fan-out. Trigger: scheduled sweep on overdue fee.
        test_recipe:
          setup:
            - "BU1, verified Agent A1 jurisdictions=['US'], IPRight IP1 with one JurisdictionFiling JF1 (US) walked to REGISTERED"
            - "Create AnnualFeeSchedule F1: base_fee_cents=100000, due_date=now+1d (server auto-sets grace_end_date = due_date + 180 days)"
            - "POST /_clock/advance seconds=(1+181)*86400  (past grace_end_date)"
          trigger:
            - "POST /_sweep/annual-fees"
          assert:
            - "AnnualFeeSchedule F1.status == ABANDONED (link 1)"
            - "JurisdictionFiling JF1.status == ABANDONED (link 2, caused by F1 abandonment)"
            - "IPRight IP1.status == ABANDONED (link 3, caused by JF1 abandonment which was the last open sibling)"

      - name: resolve_case_books_cost_then_recomputes_bu_spend   # depth 2
        grounds:
          - state_machines.ProtectionCase.IN_PROGRESS_to_RESOLVED
          - calculations.business_unit_actual_spend
          - entities.BusinessUnit.fields.actual_spend_cents
          - entities.Cost.fields.allocations
        distinguishing_aspect: |
          Depth-2 cascade originating from a different trigger (case resolution,
          not annual-fee sweep): /resolve mutates ProtectionCase, which itself
          books a new Cost row (link 1), and the Cost insertion itself triggers
          recomputation of BusinessUnit.actual_spend_cents (link 2). Distinct
          propagation pattern from the fee-abandon chain.
        test_recipe:
          setup:
            - "BU1 (annual_budget_cents=1000000000, actual_spend_cents=0 initially), verified Agent A1, IPRight IP1 REGISTERED, ProtectionCase PC1 routed to LITIGATION (Evidence row with chain_of_custody_hash supplied)"
          trigger:
            - "POST /protection-cases/{PC1}/resolve {outcome:WON, recovered_amount_cents:10000000, legal_fees_cents:1500000, agent_fees_cents:800000, punitive_cap_cents:2000000}"
          assert:
            - "ProtectionCase.status == RESOLVED  (link 0: original mutation)"
            - "Exactly one new Cost row of category=LITIGATION with amount_usd_cents == 2300000 (= legal_fees_cents + agent_fees_cents = 1500000 + 800000) and allocation_rules == [{BU1,10000}] (link 1)"
            - "GET /business-units/{BU1.id} returns actual_spend_cents == 2300000 (link 2, recomputed by calculations.business_unit_actual_spend)"

  # -------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_route_after_resolved
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - state_machines.ProtectionCase.IN_PROGRESS_to_RESOLVED
        distinguishing_aspect: |
          Pair: state (priority 5) vs business_safety (priority 7). When a caller
          attempts POST /protection-cases/{id}/route with route=LITIGATION on a case
          that is already RESOLVED (state-invalid) AND has zero chain-of-custody
          evidence (safety-invalid), state precedes safety, so ERR_INVALID_STATE
          wins over ERR_EVIDENCE_MISSING_FOR_LITIGATION. Different category pair
          than the fiscal-vs-constraint conflict below.
        test_recipe:
          setup:
            - "BU1, verified Agent A1 jurisdictions=['US'], IPRight IP1 REGISTERED"
            - "Open ProtectionCase PC2 with ip_right_id=IP1, assigned_agent_id=A1 (no evidence at all)"
            - "POST /protection-cases/{PC2}/route {route: MEDIATION}  (MEDIATION does not require chain-of-custody evidence)"
            - "POST /protection-cases/{PC2}/resolve {outcome:DISMISSED, recovered_amount_cents:0, legal_fees_cents:0, agent_fees_cents:0, punitive_cap_cents:0}"
            - "PC2.status is now RESOLVED and PC2 still has zero chain-of-custody evidence"
          trigger:
            - "POST /protection-cases/{PC2}/route with body {route: LITIGATION}"
          assert:
            - "Response status_code == 409"
            - "Response error_id == ERR_INVALID_STATE  (state check at priority 5 fires first, beating the priority-7 evidence safety check)"

      - name: constraint_vs_fiscal_bu_inactive_beats_budget_exceeded
        grounds:
          - validations[priority=15]
          - validations[priority=16]
          - calculations.cost_allocation
          - entities.BusinessUnit.fields.status
        distinguishing_aspect: |
          Pair: business_constraint (priority 15, ERR_ALLOCATION_BU_INACTIVE) vs
          business_fiscal (priority 16, ERR_BUDGET_EXCEEDED). When a Cost is posted
          whose allocation_rules include an ARCHIVED BU AND another BU whose share
          would push its actual_spend above annual_budget, priority 15 wins. The
          test fixture seeds BU2 directly in ARCHIVED status. Different
          error-category pair from the state-vs-safety pair above.
        test_recipe:
          setup:
            - "POST /business-units {code:BU_A, name:'A', annual_budget_cents:10000}  (tiny budget == $100.00, ACTIVE)"
            - "POST /business-units {code:BU_B, name:'B', annual_budget_cents:1000000000}"
            - "POST /business-units/{BU_B.id}/archive  → BU_B.status becomes ARCHIVED"
            - "Create IPRight IP1 REGISTERED owned by BU_A"
          trigger:
            - "POST /costs {category:APPLICATION, ip_right_id:IP1, currency:USD, amount_native_cents:100000, fx_rate_to_usd:1.0, allocation_rules:[{BU_A,5000},{BU_B,5000}], booked_at:now}"
          assert:
            - "Response status_code == 422"
            - "Response error_id == ERR_ALLOCATION_BU_INACTIVE  (priority 15 fires before priority 16 ERR_BUDGET_EXCEEDED, even though BU_A's 50% share of 100000 == 50000 cents would exceed BU_A's 10000-cent budget)"

  # -------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: surcharge_tier_boundary_day_30_vs_day_31
        grounds:
          - calculations.annual_fee_surcharge
          - entities.AnnualFeeSchedule.fields.due_date
          - endpoints./annual-fees/{id}/pay
        distinguishing_aspect: |
          Numeric-threshold boundary on AnnualFeeSchedule.days_late (>=31 trips the
          25% tier). Different metric from the empty-evidence-collection boundary
          below, and reachable through /annual-fees/{id}/pay rather than /route.
        test_recipe:
          setup:
            - "BU1, Agent A1 verified, IPRight IP1 REGISTERED, AnnualFeeSchedule F1 base_fee_cents=100000, due_date=now+1d"
            - "Variant A: POST /_clock/advance seconds=(1+30)*86400  (days_late == 30)"
            - "Variant B (fresh DB): POST /_clock/advance seconds=(1+31)*86400  (days_late == 31)"
          trigger:
            - "Variant A: POST /annual-fees/{F1}/pay"
            - "Variant B: POST /annual-fees/{F1}/pay"
          assert:
            - "Variant A: AnnualFeeSchedule.surcharge_cents == 10000  (= round_half_up(100000 * 0.10), tier 1)"
            - "Variant B: AnnualFeeSchedule.surcharge_cents == 25000  (= round_half_up(100000 * 0.25), tier 2)"

      - name: empty_evidence_collection_blocks_litigation_route
        grounds:
          - validations[priority=7]
          - entities.Evidence
          - endpoints./protection-cases/{id}/route
        distinguishing_aspect: |
          Empty-collection boundary (different metric from the numeric surcharge
          tier above): the Evidence set having ZERO rows with
          chain_of_custody_hash != null must reject LITIGATION routing, even though
          ≥1 row already exists. Reachable through /protection-cases/{id}/route,
          a different endpoint from /pay.
        test_recipe:
          setup:
            - "BU1, Agent A1 verified jurisdictions=['US'], IPRight IP1 REGISTERED, ProtectionCase PC1 (OPEN)"
            - "Add one Evidence row WITHOUT chain_of_custody_hash (left null)"
          trigger:
            - "POST /protection-cases/{PC1}/route {route: LITIGATION}"
          assert:
            - "Response status_code == 422"
            - "Response error_id == ERR_EVIDENCE_MISSING_FOR_LITIGATION"
            - "ProtectionCase.status remains OPEN, route remains NONE"

  # -------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: contract_file_requires_ipright_registered
        grounds:
          - validations[priority=18]
          - state_machines.Contract.SIGNED_to_FILED
          - state_machines.IPRight.FILED_to_REGISTERED
        distinguishing_aspect: |
          Contract→IPRight pair: Contract.SIGNED→FILED is gated on IPRight.status ==
          REGISTERED. Distinct from the ProtectionCase→IPRight pair below (which
          gates on different IPRight states and a different child machine).
        test_recipe:
          setup:
            - "BU1, IPRight IP1 in MATERIALS_READY (not yet REGISTERED); create JurisdictionFiling JF1 so IP1 advances to FILED (still not REGISTERED)"
            - "ContractTemplate T1 (TRANSFER), Contract C1 (TRANSFER) driven to SIGNED"
          trigger:
            - "POST /contracts/{C1}/file-with-authority"
          assert:
            - "Response status_code == 422"
            - "Response error_id == ERR_IP_NOT_REGISTERED"
            - "Contract.status remains SIGNED"

      - name: protection_case_route_requires_ipright_registered
        grounds:
          - state_machines.ProtectionCase.OPEN_to_IN_PROGRESS
          - entities.IPRight.fields.status
          - validations[priority=5]
        distinguishing_aspect: |
          Different entity pair: ProtectionCase→IPRight. A case cannot be routed
          (OPEN→IN_PROGRESS) unless its IPRight is in REGISTERED — otherwise the
          rights-holder cannot prove standing. The dependency rejection error
          differs from the contract-filing dependency above (ERR_INVALID_STATE on
          the parent IPRight precondition, not ERR_IP_NOT_REGISTERED).
        test_recipe:
          setup:
            - "BU1, Agent A1 verified, IPRight IP1 in DRAFT (NEVER registered)"
            - "Open ProtectionCase PC1 with ip_right_id=IP1, assigned_agent_id=A1"
            - "Add one Evidence with chain_of_custody_hash"
          trigger:
            - "POST /protection-cases/{PC1}/route {route: LITIGATION}"
          assert:
            - "Response status_code == 409"
            - "Response error_id == ERR_INVALID_STATE  (IPRight not in REGISTERED, precondition of routing fails — distinct from the contract-pair error)"
            - "ProtectionCase.status remains OPEN"

  # -------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: royalty_period_no_gap_no_overlap
        grounds:
          - validations[priority=12]
          - entities.RoyaltySchedule.fields.period_start
          - entities.RoyaltySchedule.fields.period_end
        distinguishing_aspect: |
          Interval semantics: half-open [period_start, period_end) on RoyaltySchedule
          rows of the same Contract. period_end of period N MUST EQUAL period_start
          of period N+1 — both overlap AND gap are forbidden. Distinct semantics
          from the office-action response-window below (which is a single deadline
          relative to a fixed point, not a sequence of contiguous intervals).
        test_recipe:
          setup:
            - "BU1, IPRight IP1 REGISTERED, ContractTemplate T1 (EXCLUSIVE_LICENSE), Contract C1 driven to FILED with royalty_rate=0.10"
            - "POST /contracts/{C1}/royalty-schedules period_index=1, period_start=2026-01-01T00:00:00Z, period_end=2026-04-01T00:00:00Z, forecast_revenue_cents=1000000  (succeeds)"
          trigger:
            - "Attempt A (overlap): POST period_index=2 period_start=2026-03-01T00:00:00Z period_end=2026-06-01T00:00:00Z forecast_revenue_cents=1000000"
            - "Attempt B (gap, fresh DB rerun): POST period_index=2 period_start=2026-05-01T00:00:00Z period_end=2026-08-01T00:00:00Z forecast_revenue_cents=1000000"
          assert:
            - "Attempt A: status_code == 422, error_id == ERR_ROYALTY_PERIOD_GAP_OR_OVERLAP"
            - "Attempt B: status_code == 422, error_id == ERR_ROYALTY_PERIOD_GAP_OR_OVERLAP"

      - name: office_action_response_deadline_buffer
        grounds:
          - state_machines.ApplicationOfficeAction.PENDING_to_RESPONDED
          - state_machines.ApplicationOfficeAction.PENDING_to_CLOSED_ABANDONED
          - entities.ApplicationOfficeAction.fields.response_due_at
        distinguishing_aspect: |
          Different interval geometry: a single half-open response window
          (now < response_due_at admits /respond; now >= response_due_at admits
          /abandon). The transition admissibility flips exactly at the boundary,
          and the resource is ApplicationOfficeAction — a different entity from
          RoyaltySchedule above.
        test_recipe:
          setup:
            - "BU1, Agent A1 verified, IPRight IP1 to OFFICE_ACTION with JurisdictionFiling JF1 + OfficeAction OA1 (response_due_at=now+30d)"
          trigger:
            - "POST /_clock/advance seconds=30*86400 (now == response_due_at exactly)"
            - "POST /office-actions/{OA1}/respond"
            - "POST /office-actions/{OA1}/abandon (alternative timeline)"
          assert:
            - "At now == response_due_at the /respond call returns 409 ERR_INVALID_STATE (precondition now < response_due_at fails)"
            - "/abandon at the same instant succeeds (precondition now >= response_due_at holds), OA1.status == CLOSED_ABANDONED, JurisdictionFiling.status == ABANDONED"

  # -------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: damages_waterfall_conservation_of_cents
        grounds:
          - calculations.damages_recovery_waterfall
          - state_machines.ProtectionCase.IN_PROGRESS_to_RESOLVED
          - entities.ProtectionCase.fields.distributed
        distinguishing_aspect: |
          Named conserved quantity: total damages cents. INVARIANT:
          distributed.legal_paid + distributed.agent_paid + distributed.punitive_paid
          + distributed.rights_holder_paid == recovered_amount_cents, exactly,
          across all input combinations. Different conserved quantity from the
          allocation-cents-vs-cost-cents invariant below.
        test_recipe:
          setup:
            - "BU1 (annual_budget_cents=1000000000), verified Agent A1 jurisdictions=['US'], IPRight IP1 REGISTERED owned by BU1, ProtectionCase PC1 (assigned_agent_id=A1) with one Evidence row containing chain_of_custody_hash, then /route to LITIGATION"
          trigger:
            - "POST /protection-cases/{PC1}/resolve {outcome:WON, recovered_amount_cents:10000000, legal_fees_cents:1500000, agent_fees_cents:800000, punitive_cap_cents:2000000}"
          assert:
            - "PC1.distributed.legal_paid == 1500000  (= min(10000000, 1500000))"
            - "PC1.distributed.agent_paid == 800000  (= min(10000000-1500000=8500000, 800000))"
            - "PC1.distributed.punitive_paid == 2000000  (= min(8500000-800000=7700000, 2000000))"
            - "PC1.distributed.rights_holder_paid == 5700000  (= 7700000 - 2000000 = 5700000)"
            - "INVARIANT: 1500000 + 800000 + 2000000 + 5700000 == 10000000 (sum equals recovered_amount_cents exactly)"

      - name: cost_allocation_sum_equals_amount_usd_cents
        grounds:
          - calculations.cost_allocation
          - entities.Cost.fields.allocations
          - entities.Cost.fields.amount_usd_cents
        distinguishing_aspect: |
          Different conserved quantity: total cost cents allocated across business
          units. INVARIANT: sum(allocations[i].allocated_cents) ==
          amount_usd_cents, exactly — guaranteed by the "remainder to last bucket"
          rounding rule. Conserves an allocation-side quantity, distinct from
          the damages-disbursement quantity above.
        test_recipe:
          setup:
            - "Three ACTIVE BusinessUnits BU_A, BU_B, BU_C each with annual_budget_cents=10_000_000_00"
            - "Create IPRight IP1 REGISTERED, owned by BU_A"
          trigger:
            - "POST /costs {category:APPLICATION, ip_right_id:IP1, currency:USD, amount_native_cents:123456, fx_rate_to_usd:1.0, allocation_rules:[{BU_A,3333},{BU_B,3333},{BU_C,3334}], booked_at:now}"
          assert:
            - "Cost.amount_usd_cents == 123456 (i.e. round_half_up(123456 * 1.0))"
            - "Cost.allocations[0].allocated_cents == 41148  (computed: 123456 * 3333 / 10000 = 41147.8848, round_half_up → 41148)"
            - "Cost.allocations[1].allocated_cents == 41148  (same formula, second bucket)"
            - "Cost.allocations[2].allocated_cents == 41160  (= 123456 - 41148 - 41148; remainder pinned to LAST rule)"
            - "INVARIANT: 41148 + 41148 + 41160 == 123456 (sum equals amount_usd_cents exactly)"
