              as: Actuary
              captures: { rr_a: $.data.id }
            - call: "POST /inland-marine/rate-rules/${rr_a}/publish"
              payload: {}
              as: Actuary
            - call: "POST /inland-marine/rate-rules"
              payload: { equipment_type: "EXCAVATOR", territory_code: "T2_URBAN", age_band_min_years: 0, age_band_max_years: 5, base_rate_bp: 200, theft_hazard_grade: "A" }
              as: Actuary
              captures: { rr_b: $.data.id }
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Retire Cell Co", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 100000 }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/coverage-parts"
              payload: { part_type: "SCHEDULED_EQUIPMENT", valuation_basis: "ACV", rating_basis: "SCHEDULED", deductible_cents: 100000, per_item_limit_cents: 20000000, aggregate_limit_cents: 200000000 }
              as: Underwriter
              captures: { cp: $.data.id }
            - call: "GET /inland-marine/policies/${pol}"
              payload: {}
              as: Underwriter
              captures: { pol_v1: $.data.version }
          trigger:
            - call: "POST /inland-marine/rate-rules/${rr_b}/publish"
              payload: {}
              as: Actuary
            - call: "GET /inland-marine/rate-rules/${rr_a}"
              payload: {}
