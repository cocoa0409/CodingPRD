            - { call: "POST /api/speed-studies/${st2}/observations", payload: { observation_date: "2026-08-04", vehicle_count: 3000, p85_speed_mph: 40.0, mean_speed_mph: 33.0 }, as: TrafficEngineer }
            - { call: "POST /api/speed-studies/${st2}/observations", payload: { observation_date: "2026-08-05", vehicle_count: 3000, p85_speed_mph: 40.0, mean_speed_mph: 33.0 }, as: TrafficEngineer }
