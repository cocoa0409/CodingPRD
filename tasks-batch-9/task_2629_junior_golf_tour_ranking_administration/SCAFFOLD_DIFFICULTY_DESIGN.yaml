          - state_machines.CoachAccessGrant.REQUESTED_to_GRANTED
          - endpoints.GET_members_memberId_published_results
          - errors.ERR_COACH_ACCESS_DENIED
        distinguishing_aspect: |
          A DIFFERENT entity pair from the previous instance (CoachAccessGrant -> Member rather than
          Tournament -> Round) and the mirror-image shape: the same read by the same caller against
          the same member flips from 403 to 200 purely because a third entity changed state. The
          recipe asserts BOTH sides of the guard in one recipe, so an implementation that hard-denies
          Coach reads and one that never checks the grant each fail exactly one of the two triggers.
