              captures: { coord_id: $.data.id }
            - call: "POST /ei/children"
              payload: { first_name: "Ada", last_name: "Nolan", date_of_birth: "2024-01-15", county_code: "CNT_A", primary_language: "EN" }
              as: IntakeSpecialist
              captures: { child1_id: $.data.id }
            - call: "POST /ei/children"
              payload: { first_name: "Bram", last_name: "Ostro", date_of_birth: "2024-01-18", county_code: "CNT_A", primary_language: "EN" }
              as: IntakeSpecialist
              captures: { child2_id: $.data.id }
            - call: "POST /ei/referrals"
              payload: { child_id: "${child1_id}", primary_referral_source: "PHYSICIAN", referral_received_date: "2026-09-01", county_code: "CNT_A", presenting_concern: "Expressive language delay noted at the 20-month well-child visit", interpreter_required: false }
              as: IntakeSpecialist
              captures: { ref1_id: $.data.id }
            - call: "POST /ei/referrals"
              payload: { child_id: "${child2_id}", primary_referral_source: "PARENT", referral_received_date: "2026-09-01", county_code: "CNT_A", presenting_concern: "Parent reports few words and limited pretend play", interpreter_required: false }
              as: IntakeSpecialist
              captures: { ref2_id: $.data.id }
            - call: "POST /ei/referrals/${ref1_id}/assign-coordinator"
              payload: { coordinator_id: "${coord_id}" }
              as: ProgramAdmin
            - call: "POST /ei/referrals/${ref2_id}/assign-coordinator"
              payload: { coordinator_id: "${coord_id}" }
              as: ProgramAdmin
            - call: "POST /ei/assessments"
              payload: { referral_id: "${ref1_id}", assessment_type: "INITIAL_EVALUATION", scheduled_date: "2026-09-01", setting_code: "HOME", domains_assessed: ["PHYSICAL", "COGNITIVE", "COMMUNICATION", "SOCIAL_EMOTIONAL", "ADAPTIVE"] }
              as: Evaluator
              captures: { eval1_id: $.data.id }
            - call: "POST /ei/assessments"
              payload: { referral_id: "${ref1_id}", assessment_type: "FAMILY_ASSESSMENT", scheduled_date: "2026-09-01", setting_code: "HOME" }
              as: Evaluator
              captures: { fam1_id: $.data.id }
            - call: "POST /ei/assessments"
              payload: { referral_id: "${ref2_id}", assessment_type: "INITIAL_EVALUATION", scheduled_date: "2026-09-01", setting_code: "HOME", domains_assessed: ["PHYSICAL", "COGNITIVE", "COMMUNICATION", "SOCIAL_EMOTIONAL", "ADAPTIVE"] }
              as: Evaluator
              captures: { eval2_id: $.data.id }
            - call: "POST /ei/assessments"
              payload: { referral_id: "${ref2_id}", assessment_type: "FAMILY_ASSESSMENT", scheduled_date: "2026-09-01", setting_code: "HOME" }
              as: Evaluator
              captures: { fam2_id: $.data.id }
            - call: "POST /ei/assessments/${eval1_id}/complete"
              payload: { completion_date: "2026-09-01", eligibility_recommendation: "ELIGIBLE", family_unavailable_days: 0 }
              as: Evaluator
            - call: "POST /ei/assessments/${fam1_id}/complete"
              payload: { completion_date: "2026-09-01", eligibility_recommendation: "ELIGIBLE", family_unavailable_days: 0 }
