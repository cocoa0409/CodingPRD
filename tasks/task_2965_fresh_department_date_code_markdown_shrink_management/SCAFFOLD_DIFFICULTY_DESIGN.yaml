          setup:
            - "One MEAT department on store 0412 with shrink_budget_pct 2.5 and an ACTIVE four-rung ladder."
            - "One item at 599 cents retail, 420 cents cost, daily_forecast_units 4.00."
            - "One FRESH lot of 24 units produced 2026-08-05, with 4 units already sold at the full 599 price, so quantity_on_hand is 20."
            - "One RECORDED shrink event by clerk-4 for 6 units, cause DAMAGE, origin MANUAL."
            - "Clock parked at 2026-08-12T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00.000Z" }
              as: StoreOperationsAdmin
