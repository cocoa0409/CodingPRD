            - "the RegulatorOps register and file endpoints refuse the pooled plan provider that owns the plan: registration and acceptance are government-side acts"
            - "prepare and attest are refused to the PooledPlanProvider while certify-employer-data is refused to the IndependentAuditor, which is the segregation of duties on the annual return: three different roles clear three different parts of it"
