            - call: "POST /campaigns/${camp_id}/pledges"
              payload: { backer_id: "${b1_id}", tier_id: "${tier_id}", pledge_amount_cents: 5000, destination_zone: "DOMESTIC", expected_campaign_version: "${camp_v1}" }
              as: Backer
              as_user_id: "${b1_id}"
