      - name: dispute_grant_three_hop_cascade_clears_two_held_orders_with_distinct_holds
        grounds:
          - state_machines.AddressDispute.UNDER_REVIEW_to_GRANTED
          - entities.ServiceAddress.fields.override_state
          - entities.ServiceAddress.fields.effective_zone_state
          - state_machines.Order.fulfillment_status.ZONE_HELD_to_ZONE_CLEARED
          - calculations.order_to_door_minutes
          - entities.Store.fields.unassigned_order_count
        distinguishing_aspect: |
          Granting one dispute writes ONE override field on ONE ServiceAddress,
          and from that single write two held Orders must be released and the
          Store's backlog counter must rise by two. The two orders entered
          ZONE_HELD at DIFFERENT logical instants (12:00 and 12:02), so the
          cascade must accrue per-order hold minutes of 8 and 6 respectively
          rather than one shared value, and the release order is pinned to
          Order.created_at ASC. An implementation that stamps a single hold
          duration on all affected orders, or that only flips the address without
          walking to the orders, fails.
        test_recipe:
          setup:
            - "A store with the ceiling-40 zone model and one EDGE address at grid 11.34 miles (drive 41 > the 40 minute ceiling)."
            - "Two orders on that address, placed and held at 12:00:00Z and 12:02:00Z respectively."
            - "A dispute on that address taken UNDER_REVIEW; the clock is then advanced to 12:08:00Z."
          setup_api_calls:
            - call: "POST /store-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: StoreManager
              as_user_id: "boot"
            - call: "POST /store-ops/stores"
              payload: { store_number: "7421", name: "Riverside", latitude_micro: 39000000, longitude_micro: -84000000, promise_minutes: 30, delivery_fee_cents: 399, cash_limit_cents: 5000, hot_bag_count: 4, max_stacked_stops: 3, handoff_minutes_per_stop: 6, dispatch_reset_buffer_minutes: 10, service_posture: "OPEN" }
              as: StoreManager
              as_user_id: "boot"
              captures: { store_id: $.data.id, store_v1: $.data.version }
            - call: "POST /store-ops/zone-versions"
              payload: { store_id: "${store_id}", polygon: [{ latitude_micro: 38900000, longitude_micro: -84200000 }, { latitude_micro: 39200000, longitude_micro: -84200000 }, { latitude_micro: 39200000, longitude_micro: -83800000 }, { latitude_micro: 38900000, longitude_micro: -83800000 }], effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", expected_store_version: "${store_v1}", max_drive_time_minutes: 40, base_drive_minutes: 6, minutes_per_mile: 3, peak_surcharge_minutes: 7, barrier_surcharge_minutes: 4 }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { zv1_id: $.data.id }
            - call: "POST /store-ops/zone-versions/${zv1_id}/activate"
              payload: {}
              as: StoreManager
              as_user_id: "${store_id}"
            - call: "POST /store-ops/service-addresses"
              payload: { store_id: "${store_id}", line1: "77 Far Ridge", latitude_micro: 39170100, longitude_micro: -84000000, crosses_barrier: false }
              as: Dispatcher
              as_user_id: "disp-1"
              captures: { addr_h_id: $.data.id }
            - call: "POST /store-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T12:00:00Z" }
              as: StoreManager
              as_user_id: "${store_id}"
            - call: "POST /store-ops/orders"
              payload: { store_id: "${store_id}", service_address_id: "${addr_h_id}", customer_name: "Hana", customer_phone: "555-0108", food_subtotal_cents: 2200, payment_method: "CARD", tip_cents: 500 }
              as: Dispatcher
              as_user_id: "disp-1"
              captures: { ord_h1_id: $.data.id }
            - call: "POST /store-ops/orders/${ord_h1_id}/zone-decision"
              payload: { action: "HOLD" }
              as: Dispatcher
              as_user_id: "disp-1"
            - call: "POST /store-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T12:02:00Z" }
              as: StoreManager
              as_user_id: "${store_id}"
            - call: "POST /store-ops/orders"
              payload: { store_id: "${store_id}", service_address_id: "${addr_h_id}", customer_name: "Ivo", customer_phone: "555-0109", food_subtotal_cents: 2200, payment_method: "CARD", tip_cents: 500 }
              as: Dispatcher
              as_user_id: "disp-1"
              captures: { ord_h2_id: $.data.id }
            - call: "POST /store-ops/orders/${ord_h2_id}/zone-decision"
              payload: { action: "HOLD" }
              as: Dispatcher
              as_user_id: "disp-1"
            - call: "POST /store-ops/address-disputes"
              payload: { service_address_id: "${addr_h_id}", claimed_state: "IN_ZONE", evidence_note: "Driveway is on our side of the creek" }
              as: CustomerCareAgent
              as_user_id: "cca-1"
              captures: { disp_h_id: $.data.id }
            - call: "POST /store-ops/address-disputes/${disp_h_id}/review"
