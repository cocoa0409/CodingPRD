              as: Host
              as_user_id: "${h1}"
              captures: { p1: $.data.id }
            - call: "POST /rentals/properties/${p1}/activate"
              payload: {}
              as: Host
              as_user_id: "${h1}"
            - call: "GET /rentals/properties/${p1}"
              payload: {}
