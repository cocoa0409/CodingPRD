            - { call: "POST /api/orders", payload: { formula_id: "${f_id}", tons: 10, expected_customer_version: "${cust_v}" }, as: Customer, as_user_id: "${cust_id}", captures: { ord_id: $.data.id } }
            - { call: "POST /api/orders/${ord_id}/confirm", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /api/employees", payload: { full_name: "Olly Operator", capability: "OPERATOR" }, as: MillManager, captures: { op_id: $.data.id } }
            - { call: "POST /api/lines", payload: { code: "L1" }, as: MillManager, captures: { line_id: $.data.id } }
            - { call: "POST /api/bins", payload: { code: "BIN-C", capacity_tons: 50 }, as: MillManager, captures: { binc_id: $.data.id } }
            - { call: "POST /api/bins/${binc_id}/assign", payload: { ingredient_id: "${corn_id}" }, as: MillManager }
            - { call: "POST /api/bins/${binc_id}/replenish", payload: { tons: 20 }, as: MillManager }
            - { call: "POST /api/batches", payload: { order_id: "${ord_id}", line_id: "${line_id}", target_tons: 10, planned_start_at: "2026-05-02T10:00:00Z", planned_end_at: "2026-05-02T11:00:00Z" }, as: MillManager, captures: { bat_id: $.data.id } }
            - { call: "POST /api/batches/${bat_id}/start", payload: {}, as: Operator, as_user_id: "${op_id}" }
            - { call: "GET /api/bins/${binc_id}", as: MillManager, captures: { bin_before: $.data.on_hand_tons } }
          trigger:
            - { call: "POST /api/batches/${bat_id}/weighments", payload: { ingredient_id: "${corn_id}", bin_id: "${binc_id}", actual_tons: 4.000 }, as: Operator, as_user_id: "${op_id}", captures: { w_id: $.data.id } }
            - { call: "GET /api/bins/${binc_id}", as: MillManager, captures: { bin_mid: $.data.on_hand_tons } }
            - { call: "POST /api/weighments/${w_id}/void", payload: {}, as: Operator, as_user_id: "${op_id}" }
          assert:
            - "Bin.${binc_id}.on_hand_tons was 20 after replenish (bin_before == 20)"
            - "Bin.${binc_id}.on_hand_tons == 16 after the 4.000t weighment (bin_mid == 16)"
            - "Bin.${binc_id}.on_hand_tons == 20 again after the void (invariant: weigh + void conserves physical tons)"
            - "Bin.${binc_id}.cumulative_replenished_tons == 20 at every observation"
            - "Weighment.${w_id}.status == VOID"

      - name: credit_confirm_then_cancel_restores_exposure
        grounds:
          - calculations.credit_exposure
          - state_machines.CustomerOrder.QUOTED_to_CONFIRMED
          - state_machines.CustomerOrder.CONFIRMED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: FISCAL EXPOSURE IN CENTS. credit_used_cents over the status-filtered order
          set: confirm adds 426420, cancel releases it, and the customer's exposure returns exactly to
          its pre-confirm value of 0 — a cascade that drifted would violate the invariant. Different
          conserved quantity from physical tons and contractual tons.
        test_recipe:
          setup:
            - "Catalog + F-GROW ACTIVE; customer credit_limit 500000; order 10t QUOTED at 426420"
          setup_api_calls:
            - { call: "POST /api/ingredients", payload: { code: "CORN", name: "Yellow corn", hazard_class: "STANDARD", crude_protein_pct: 9.0, crude_fiber_pct: 2.2, metabolizable_energy_kcal_kg: 3300 }, as: MillManager, captures: { corn_id: $.data.id } }
            - { call: "POST /api/ingredients", payload: { code: "SBM", name: "Soybean meal", hazard_class: "STANDARD", crude_protein_pct: 44.0, crude_fiber_pct: 7.0, metabolizable_energy_kcal_kg: 2600 }, as: MillManager, captures: { sbm_id: $.data.id } }
            - { call: "POST /api/price-ticks", payload: { ingredient_id: "${corn_id}", price_cents_per_ton: 30000, effective_from: "2026-04-01T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/price-ticks", payload: { ingredient_id: "${sbm_id}", price_cents_per_ton: 52000, effective_from: "2026-04-01T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/formulas", payload: { code: "F-GROW", min_protein_pct: 19.5, max_fiber_pct: 5.0, min_energy_kcal_kg: 3000 }, as: Nutritionist, captures: { f_id: $.data.id, f_v: $.data.version } }
            - { call: "POST /api/formulas/${f_id}/optimize", payload: { expected_formula_version: "${f_v}" }, as: Nutritionist }
            - { call: "POST /api/formulas/${f_id}/activate", payload: {}, as: Nutritionist }
            - { call: "POST /api/customers", payload: { name: "Acme Farms", credit_limit_cents: 500000 }, as: MillManager, captures: { cust_id: $.data.id, cust_v: $.data.version } }
            - { call: "POST /api/orders", payload: { formula_id: "${f_id}", tons: 10, expected_customer_version: "${cust_v}" }, as: Customer, as_user_id: "${cust_id}", captures: { ord_id: $.data.id } }
          trigger:
            - { call: "POST /api/orders/${ord_id}/confirm", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "GET /api/customers/${cust_id}", as: MillManager, captures: { used_mid: $.data.credit_used_cents } }
            - { call: "POST /api/orders/${ord_id}/cancel", payload: {}, as: Customer, as_user_id: "${cust_id}" }
          assert:
            - "Customer.${cust_id}.credit_used_cents == 0 before confirm and while QUOTED (QUOTED excluded from exposure)"
            - "after confirm: credit_used_cents == 426420 (used_mid == 426420)"
            - "after cancel: credit_used_cents == 0 (invariant: confirm + cancel conserves exposure)"
            - "CustomerOrder.${ord_id}.status == CANCELLED"

      - name: contract_tonnage_weigh_then_void_restores_remaining
        grounds:
          - calculations.contract_consumption
          - calculations.weighment_pricing
          - state_machines.Weighment.RECORDED_to_VOID
        distinguishing_aspect: |
          Conserved quantity: CONTRACTUAL COVERAGE TONS. remaining_tons == total_tons - sum(RECORDED
          weighments with contract_id == this): a CONTRACT-sourced weighment of 4.000t moves remaining
          50 -> 46, and voiding the same weighment restores exactly 50 with status back to plain OPEN.
          Different conserved quantity from physical inventory and credit exposure.
        test_recipe:
          setup:
            - "Catalog + corn contract 50t @ 29000 covering the clock; F-GROW ACTIVE; order 10t CONFIRMED; batch BATCHING"
          setup_api_calls:
            - { call: "POST /api/ingredients", payload: { code: "CORN", name: "Yellow corn", hazard_class: "STANDARD", crude_protein_pct: 9.0, crude_fiber_pct: 2.2, metabolizable_energy_kcal_kg: 3300 }, as: MillManager, captures: { corn_id: $.data.id } }
            - { call: "POST /api/ingredients", payload: { code: "SBM", name: "Soybean meal", hazard_class: "STANDARD", crude_protein_pct: 44.0, crude_fiber_pct: 7.0, metabolizable_energy_kcal_kg: 2600 }, as: MillManager, captures: { sbm_id: $.data.id } }
            - { call: "POST /api/price-ticks", payload: { ingredient_id: "${corn_id}", price_cents_per_ton: 30000, effective_from: "2026-04-01T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/price-ticks", payload: { ingredient_id: "${sbm_id}", price_cents_per_ton: 52000, effective_from: "2026-04-01T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/contracts", payload: { ingredient_id: "${corn_id}", supplier_ref: "SUP-1", fixed_price_cents_per_ton: 29000, total_tons: 50, window_start_date: "2026-04-01", window_end_date: "2026-06-30" }, as: MillManager, captures: { con_id: $.data.id } }
            - { call: "POST /api/formulas", payload: { code: "F-GROW", min_protein_pct: 19.5, max_fiber_pct: 5.0, min_energy_kcal_kg: 3000 }, as: Nutritionist, captures: { f_id: $.data.id, f_v: $.data.version } }
            - { call: "POST /api/formulas/${f_id}/optimize", payload: { expected_formula_version: "${f_v}" }, as: Nutritionist }
            - { call: "POST /api/formulas/${f_id}/activate", payload: {}, as: Nutritionist }
            - { call: "POST /api/customers", payload: { name: "Acme Farms", credit_limit_cents: 1000000 }, as: MillManager, captures: { cust_id: $.data.id, cust_v: $.data.version } }
            - { call: "POST /api/orders", payload: { formula_id: "${f_id}", tons: 10, expected_customer_version: "${cust_v}" }, as: Customer, as_user_id: "${cust_id}", captures: { ord_id: $.data.id } }
            - { call: "POST /api/orders/${ord_id}/confirm", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /api/employees", payload: { full_name: "Olly Operator", capability: "OPERATOR" }, as: MillManager, captures: { op_id: $.data.id } }
            - { call: "POST /api/lines", payload: { code: "L1" }, as: MillManager, captures: { line_id: $.data.id } }
            - { call: "POST /api/bins", payload: { code: "BIN-C", capacity_tons: 50 }, as: MillManager, captures: { binc_id: $.data.id } }
            - { call: "POST /api/bins/${binc_id}/assign", payload: { ingredient_id: "${corn_id}" }, as: MillManager }
            - { call: "POST /api/bins/${binc_id}/replenish", payload: { tons: 20 }, as: MillManager }
            - { call: "POST /api/batches", payload: { order_id: "${ord_id}", line_id: "${line_id}", target_tons: 10, planned_start_at: "2026-05-02T10:00:00Z", planned_end_at: "2026-05-02T11:00:00Z" }, as: MillManager, captures: { bat_id: $.data.id } }
            - { call: "POST /api/batches/${bat_id}/start", payload: {}, as: Operator, as_user_id: "${op_id}" }
          trigger:
            - { call: "POST /api/batches/${bat_id}/weighments", payload: { ingredient_id: "${corn_id}", bin_id: "${binc_id}", actual_tons: 4.000 }, as: Operator, as_user_id: "${op_id}", captures: { w_id: $.data.id } }
            - { call: "GET /api/contracts/${con_id}", as: MillManager, captures: { con_mid: $.data.remaining_tons } }
            - { call: "POST /api/weighments/${w_id}/void", payload: {}, as: Operator, as_user_id: "${op_id}" }
          assert:
            - "Weighment.${w_id}.source == CONTRACT and unit_price_cents == 29000"
            - "Contract.${con_id}.consumed_tons == 4.000 and remaining_tons == 46.000 after the weighment (con_mid == 46)"
            - "after void: Contract.${con_id}.consumed_tons == 0 and remaining_tons == 50 (invariant conserved)"
            - "Contract.${con_id}.status == OPEN throughout (remaining never hit 0, so no EXHAUSTED flip)"
