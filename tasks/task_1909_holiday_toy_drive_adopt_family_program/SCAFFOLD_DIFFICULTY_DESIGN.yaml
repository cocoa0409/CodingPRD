              as: PlatformAdmin
              captures:
                camp_id: "$.data.id"
            - call: "POST /toy-drive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-drive/campaigns/${camp_id}/open-intake"
              payload: {}
              as: PlatformAdmin
            - call: "POST /toy-drive/distribution-events"
              payload: { campaign_id: "${camp_id}", site_name: "Early Hall", start_at: "2026-12-18T09:00:00Z", end_at: "2026-12-18T17:00:00Z", capacity_slots: 10 }
              as: PlatformAdmin
              captures:
                ev_id: "$.data.id"
          trigger:
            - call: "POST /toy-drive/distribution-events/${ev_id}/open-slots"
              payload: {}
              as: PlatformAdmin
              captures:
                err: "$.data.error_id"
          assert:
            - "err == ERR_INVALID_STATE (campaign not in DISTRIBUTION_PREP)"
            - "DistributionEvent.${ev_id}.status remains PLANNED"

  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: family_slot_halfopen_overlap
        grounds:
          - calculations.distribution_slot_overlap
          - validations[priority=19]
        distinguishing_aspect: |
          Resource = Family's pickup schedule. Interval semantics = half-open
          [start, end) on a single family axis. Overlap is forbidden
          (new.start < existing.end AND existing.start < new.end); adjacency
          (new.start == existing.end) is permitted. One-minute overlap at
          10:59-11:01 fails.
        test_recipe:
          setup:
            - "family F1 has slot 10:00-11:00; attempt second slot 10:59-11:30 (1-minute overlap)"
          setup_api_calls:
            - call: "POST /toy-drive/_clock/set_current_utc"
