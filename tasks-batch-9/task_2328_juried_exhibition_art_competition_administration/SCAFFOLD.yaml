scenario: "2328. Juried Exhibition & Art Competition Administration (arts council juried exhibition): call for entries with eligibility, media categories, size limits and entry fee structure, digital submission with image standards and metadata requirements, juror selection with expertise, conflict declarations and honorarium terms, blind jurying rounds with scoring, deliberation and acceptance list determination, artwork delivery, condition reporting and installation with insurance coverage during the exhibition, award selection with prize categories, purchase awards and sponsor recognition, sales handling with commission split, sales tax and artist payment, deinstallation, return shipping and unclaimed artwork policy"
domain_name: juried-exhibition-administration
api_prefix: ""   # flat topology: every entity is addressed as a top-level collection (/exhibitions, /entries, /artworks, ...)

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - selector_policy

  entity_topology: flat
  # Every entity is its own top-level collection; relationships are expressed only by
  # FK fields (no nested ownership URLs beyond one action segment). Cross-aggregate
  # coherence (wall segment ↔ exhibition, artwork ↔ round's exhibition) is therefore
  # a validated business rule rather than a URL invariant.

  state_machine_shape: parallel
  secondary_state_machine_shapes: [cyclic, branching, compound]
  # Exhibition carries two independent axes (status × settlement_status); JuryRound is
  # cyclic (OPEN → SCORING_COMPLETE → OPEN, bounded by reopen_count); Artwork forks
  # (SUBMITTED → {SHORTLISTED, DECLINED} → {ACCEPTED, WAITLISTED, DECLINED}) and also
  # carries a second axis (placement_status); Exhibition.status advance to ON_VIEW is
  # compound (gated on every ACCEPTED child artwork being INSTALLED).

  relationship_patterns:
    - one_to_many
    - many_to_many          # Juror × Artwork through Score; Juror × Artist through ConflictDeclaration
    - cross_aggregate       # Award → Sponsor, Sale → Award, Artwork → WallSegment

  role_model: segregation_of_duties
  # The user who proposes an Award may not confirm it; the user who records a Sale may
  # not release its artist payout. Layered on peer ownership (Artist owns entries,
  # Juror owns scores, Registrar owns logistics, FinanceOfficer owns money).

  consistency_model: immediate

  difficulty_level: expert_plus
  # 15 entities / 68 endpoints / 49 ordered validations / 47 error codes / 9 calculations
  # (4 carrying divergent variants) / 6 state machines / 5 OCC rules.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Exhibition
    parent: null
    common_fields: true
    fields:
      - name: title
        type: string
        source: input
        description: Exhibition title as printed in the call for entries.
      - name: season_year
        type: integer
        source: input
        description: Season year; also the prefix of every artwork blind_label.
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: Lifecycle axis (axis 1 of 2).
        constraints: "DRAFT | OPEN_FOR_ENTRIES | JURYING | RESULTS_PUBLISHED | INSTALLATION | ON_VIEW | CLOSED"
      - name: settlement_status
        type: enum
        source: system
        default: NOT_STARTED
        description: Money axis (axis 2 of 2); evolves independently of status.
        constraints: "NOT_STARTED | RECONCILING | PAYOUTS_RELEASED | BOOKS_CLOSED"
      - name: call_opens_at
        type: datetime
        source: input
        description: Instant the call for entries opens (informational).
      - name: call_closes_at
        type: datetime
        source: input
        description: Submission deadline; the window is half-open, so a submit at exactly this instant is rejected.
      - name: notification_at
        type: datetime
        source: input
        description: Published date on which acceptance results are announced (informational).
      - name: delivery_window_start_at
        type: datetime
        source: input
        description: First instant an INTAKE condition report may be filed (inclusive).
      - name: delivery_window_end_at
        type: datetime
        source: input
        description: Last instant an INTAKE condition report may be filed (inclusive; closed interval).
      - name: opening_at
        type: datetime
        source: input
        description: Public opening instant; ON_VIEW cannot be entered before it.
      - name: closing_at
        type: datetime
        source: input
        description: Public closing instant; CLOSED cannot be entered before it.
      - name: claim_deadline_days
        type: integer
        source: input
        default: 30
        description: Days after closing_at by which an artist must claim unsold work.
      - name: entry_fee_base_cents
        type: integer
        source: input
        description: Base entry fee covering the first works_included_in_base works.
      - name: works_included_in_base
        type: integer
        source: input
        default: 2
        description: Number of works covered by the base fee.
      - name: entry_fee_additional_cents
        type: integer
        source: input
        description: Fee per work beyond works_included_in_base.
      - name: member_discount_pct
        type: number
        source: input
        default: 0.175
        description: Fractional discount applied to base and additional fee lines when Artist.member_status == MEMBER; never applied to the oversize surcharge.
      - name: max_works_per_entry
        type: integer
        source: input
        default: 5
        description: Maximum artworks attachable to one entry.
      - name: max_entries_per_artist
        type: integer
        source: input
        default: 1
        description: Maximum entries per artist in this exhibition counting Entry.status IN {DRAFT, PENDING_FEE, SUBMITTED}.
      - name: max_dimension_cm
        type: number
        source: input
        description: Size limit on an artwork's longest edge.
      - name: max_weight_kg
        type: number
        source: input
        description: Size limit on an artwork's weight.
      - name: per_work_insurance_cap_cents
        type: integer
        source: input
        description: Policy limit per single work; a work declared above it cannot be installed.
      - name: allowed_media_categories
        type: array
        source: input
        description: Accepted media categories for this call.
        constraints: "non-empty subset of {PAINTING, SCULPTURE, PHOTOGRAPHY, PRINTMAKING, TEXTILE, NEW_MEDIA}"
      - name: eligible_state_codes
        type: array
        source: input
        description: Residency eligibility whitelist matched against Artist.residency_state_code.
        constraints: non-empty array of 2-letter codes
      - name: acceptance_capacity
        type: integer
        source: input
        description: Maximum artworks that may hold status ACCEPTED.
      - name: waitlist_capacity
        type: integer
        source: input
        description: Maximum artworks that may hold status WAITLISTED.
      - name: jury_quorum
        type: integer
        source: input
        description: Default quorum copied onto each JuryRound when quorum_required is omitted.
      - name: advance_score_threshold
        type: number
        source: input
        description: "Inclusive threshold: certified_mean_score >= this value advances an artwork to SHORTLISTED."
      - name: score_weight_technique
        type: number
        source: input
        description: Weight of the technique criterion in composite_score.
      - name: score_weight_originality
        type: number
        source: input
        description: Weight of the originality criterion in composite_score.
      - name: score_weight_relevance
        type: number
        source: input
        description: Weight of the relevance criterion in composite_score; the three weights must sum to exactly 1.00.
      - name: commission_pct
        type: number
        source: input
        description: Council commission share applied to the taxable base of a GALLERY_SALE.
      - name: sales_tax_pct
        type: number
        source: input
        description: Sales tax rate; GALLERY_SALE prices are posted tax-inclusive, PURCHASE_AWARD prices are tax-additional.
      - name: award_budget_cents
        type: integer
        source: input
        description: Council cash budget for CONFIRMED awards excluding sponsor-funded purchase awards.
      - name: shortlisted_count
        type: integer
        source: computed
        description: Count of this exhibition's artworks with status SHORTLISTED.
      - name: accepted_count
        type: integer
        source: computed
        description: Count of this exhibition's artworks with status IN {ACCEPTED, DELIVERED, ON_VIEW, SOLD, RETURN_PENDING, RETURN_SCHEDULED, RETURNED, UNCLAIMED_FORFEIT}.
      - name: waitlisted_count
        type: integer
        source: computed
        description: Count of this exhibition's artworks with status WAITLISTED.
      - name: insured_value_total_cents
        type: integer
        source: computed
        description: See calculations.insurance_premium_assessment input_set.
      - name: insurance_premium_cents
        type: integer
        source: computed
        description: Output of calculations.insurance_premium_assessment.
      - name: award_committed_cents
        type: integer
        source: computed
        description: Sum of Award.prize_cents for awards with status CONFIRMED and sponsor_id == null.
      - name: jury_cost_committed_cents
        type: integer
        source: computed
        description: Sum of JurorAssignment.honorarium_share_cents over assignments with status IN {BOOKED, COMPLETED} whose jury round belongs to this exhibition.
      - name: sales_gross_cents
        type: integer
        source: computed
        description: Sum of Sale.sale_price_cents for this exhibition's sales with status IN {RECORDED, INVOICED, PAID, PAYOUT_RELEASED}.
      - name: commission_total_cents
        type: integer
        source: computed
        description: Sum of Sale.commission_cents over the same non-VOIDED sale set.
      - name: sales_tax_total_cents
        type: integer
        source: computed
        description: Sum of Sale.sales_tax_cents over the same non-VOIDED sale set.
      - name: artist_payable_total_cents
        type: integer
        source: computed
        description: Sum of Sale.artist_payable_cents over the same non-VOIDED sale set.
      - name: payouts_released_cents
        type: integer
        source: computed
        description: Sum of Sale.artist_payable_cents for this exhibition's sales with status PAYOUT_RELEASED.
      - name: council_retention_cents
        type: integer
        source: computed
        description: Output of calculations.settlement_retention.

  - name: Artist
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Legal name used on payment remittances.
      - name: email
        type: string
        source: input
        description: Contact email; unique across artists.
        constraints: unique
      - name: residency_state_code
        type: string
        source: input
        description: Two-letter residency code checked against Exhibition.eligible_state_codes.
      - name: member_status
        type: enum
        source: input
        default: NON_MEMBER
        description: Council membership; MEMBER receives the entry-fee discount.
        constraints: "MEMBER | NON_MEMBER"
      - name: tax_form_on_file
        type: boolean
        source: input
        default: false
        description: Whether a signed tax form is on file; required before any payout release.
      - name: payout_method
        type: enum
        source: input
        default: CHECK
        description: Remittance channel.
        constraints: "CHECK | ACH"
      - name: payout_hold
        type: boolean
        source: system
        default: false
        description: Set true by the unclaimed sweep once unclaimed_forfeit_count reaches 2; clearable by CallManager via PATCH.
      - name: unclaimed_forfeit_count
        type: integer
        source: computed
        description: Count of this artist's artworks with status UNCLAIMED_FORFEIT across all exhibitions.

  - name: Entry
    parent: null
    common_fields: true
    fields:
      - name: exhibition_id
        type: string
        source: input
        description: FK -> Exhibition.id; the call this entry answers.
      - name: artist_id
        type: string
        source: input
        description: FK -> Artist.id; must equal the acting Artist's X-User-ID.
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: Entry lifecycle.
        constraints: "DRAFT | PENDING_FEE | SUBMITTED | WITHDRAWN"
      - name: works_count
        type: integer
        source: computed
        description: Count of this entry's artworks with status != WITHDRAWN.
      - name: entry_fee_cents
        type: integer
        source: computed
        description: Output of calculations.entry_fee_assessment, frozen at submit; set to 0 by a fee waiver.
      - name: fee_paid_cents
        type: integer
        source: system
        default: 0
        description: Cents actually received.
      - name: fee_waived
        type: boolean
        source: system
        default: false
        description: True when a CallManager waived the fee.
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock instant of the submit call.
      - name: shortlisted_count
        type: integer
        source: computed
        description: Count of this entry's artworks with status IN {SHORTLISTED, ACCEPTED, WAITLISTED, DELIVERED, ON_VIEW, SOLD, RETURN_PENDING, RETURN_SCHEDULED, RETURNED, UNCLAIMED_FORFEIT}.

  - name: Artwork
    parent: null
    common_fields: true
    fields:
      - name: entry_id
        type: string
        source: input
        description: FK -> Entry.id; masked to null for Juror readers while a BLIND_SCORING round is OPEN.
      - name: wall_segment_id
        type: string
        source: system
        description: FK -> WallSegment.id; nullable, set by the installation plan and retained after deinstall.
      - name: title
        type: string
        source: input
        description: Artwork title.
      - name: medium_category
        type: enum
        source: input
        description: Media category; must be in Exhibition.allowed_media_categories.
        constraints: "PAINTING | SCULPTURE | PHOTOGRAPHY | PRINTMAKING | TEXTILE | NEW_MEDIA"
      - name: width_cm
        type: number
        source: input
        description: Framed width.
      - name: height_cm
        type: number
        source: input
        description: Framed height.
      - name: depth_cm
        type: number
        source: input
        description: Framed depth.
      - name: weight_kg
        type: number
        source: input
        description: Framed weight, checked against wall capacity at installation.
      - name: year_created
        type: integer
        source: input
        description: Year of creation.
      - name: declared_value_cents
        type: integer
        source: input
        description: Insured declared value.
      - name: for_sale
        type: boolean
        source: input
        default: false
        description: Whether the work is offered for sale during the exhibition.
      - name: list_price_cents
        type: integer
        source: input
        description: Posted tax-inclusive price; required when for_sale is true.
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: Jury/logistics lifecycle axis (axis 1 of 2).
        constraints: "DRAFT | SUBMITTED | WITHDRAWN | SHORTLISTED | DECLINED | ACCEPTED | WAITLISTED | DELIVERED | ON_VIEW | SOLD | RETURN_PENDING | RETURN_SCHEDULED | RETURNED | UNCLAIMED_FORFEIT"
      - name: placement_status
        type: enum
        source: system
        default: UNPLACED
        description: Physical placement axis (axis 2 of 2); evolves independently of status.
        constraints: "UNPLACED | PLANNED | INSTALLED | DEINSTALLED"
      - name: span_start_cm
        type: number
        source: system
        description: Left edge of the reserved wall span, nullable until planned.
      - name: span_end_cm
        type: number
        source: system
        description: Right edge of the reserved wall span (exclusive), nullable until planned.
      - name: longest_edge_cm
        type: number
        source: computed
        description: "max(width_cm, height_cm, depth_cm)."
      - name: blind_label
        type: string
        source: computed
        description: "Anonymous jury label `<Exhibition.season_year>-<ordinal>` where ordinal is the 1-based position of this artwork among the exhibition's artworks ordered by created_at ASC, zero-padded to 4 digits."
      - name: primary_image_count
        type: integer
        source: computed
        description: Count of this artwork's images with role PRIMARY.
      - name: provisional_mean_score
        type: number
        source: computed
        description: Variant PROVISIONAL of calculations.artwork_round_mean.
      - name: certified_mean_score
        type: number
        source: computed
        description: Variant QUORUM_CERTIFIED of calculations.artwork_round_mean, written at round completion.
      - name: valid_score_count
        type: integer
        source: computed
        description: Count of this artwork's scores in the exhibition's round_number 1 with voided_by_conflict == false.
      - name: intake_condition_grade
        type: enum
        source: computed
        description: condition_grade of the latest ConditionReport for this artwork with stage INTAKE ordered by created_at ASC (last wins); null when none exists.
        constraints: "A | B | C | DAMAGED | null"
      - name: claim_deadline_at
        type: datetime
        source: system
        description: closing_at + Exhibition.claim_deadline_days, stamped by the CLOSED cascade.
      - name: return_method
        type: enum
        source: system
        description: Chosen return channel, nullable until a return shipment is arranged.
        constraints: "ARTIST_PICKUP | COURIER | null"
      - name: return_carrier
        type: string
        source: system
        description: Carrier name for COURIER returns.
      - name: return_tracking_number
        type: string
        source: system
        description: Tracking number for COURIER returns.
      - name: storage_fee_cents
        type: integer
        source: computed
        default: 0
        description: Output of calculations.unclaimed_storage_accrual.
      - name: sold_price_cents
        type: integer
        source: system
        description: sale_price_cents of the non-VOIDED sale of this artwork, nullable.

  - name: ArtworkImage
    parent: null
    common_fields: false
    fields:
      - name: artwork_id
        type: string
        source: input
        description: FK -> Artwork.id; the work this file depicts.
      - name: role
        type: enum
        source: input
        description: Submission role of the file.
        constraints: "PRIMARY | DETAIL"
      - name: format
        type: enum
        source: input
        description: Container format; only JPEG and PNG meet the digital standard.
        constraints: "JPEG | PNG | TIFF"
      - name: pixel_long_edge
        type: integer
        source: input
        description: Pixels on the longest edge; standard requires >= 1200.
      - name: pixel_short_edge
        type: integer
        source: input
        description: Pixels on the shortest edge; standard requires >= 800.
      - name: file_bytes
        type: integer
        source: input
        description: File size; standard requires <= 8388608 bytes.
      - name: color_profile
        type: enum
        source: input
        description: Embedded profile; standard requires SRGB.
        constraints: "SRGB | ADOBE_RGB | CMYK"
      - name: capture_date
        type: datetime
        source: input
        description: Required metadata field.
      - name: credit_line
        type: string
        source: input
        description: Required metadata field (photographer credit).
      - name: checksum_sha256
        type: string
        source: input
        description: Client-supplied digest recorded for provenance.
      - name: standard_ok
        type: boolean
        source: computed
        description: Always true on a persisted image; a violating upload is rejected rather than stored.

  - name: Juror
    parent: null
    common_fields: true
    fields:
      - name: display_name
        type: string
        source: input
        description: Public juror name.
      - name: email
        type: string
        source: input
        description: Contact email; unique across jurors.
        constraints: unique
      - name: expertise_categories
        type: array
        source: input
        description: Media categories this juror is credentialed in; drives the composite-score expertise cap.
        constraints: non-empty subset of the medium category enum
      - name: honorarium_cents
        type: integer
        source: input
        description: Total agreed honorarium for this juror across all their sessions.
      - name: status
        type: enum
        source: system
        default: INVITED
        description: Juror engagement state.
        constraints: "INVITED | CONFIRMED | RESIGNED"
      - name: honorarium_committed_cents
        type: integer
        source: computed
        description: Sum of honorarium_share_cents over this juror's assignments with status IN {BOOKED, COMPLETED}.
      - name: honorarium_paid_cents
        type: integer
        source: system
        default: 0
        description: Cents actually remitted to this juror.
      - name: conflict_count
        type: integer
        source: computed
        description: Count of this juror's conflict declarations.
      - name: assignment_count
        type: integer
        source: computed
        description: Count of this juror's assignments with status IN {BOOKED, COMPLETED}.

  - name: ConflictDeclaration
    parent: null
    common_fields: false
    fields:
      - name: juror_id
        type: string
        source: input
        description: FK -> Juror.id; the declaring juror.
      - name: artist_id
        type: string
        source: input
        description: FK -> Artist.id; the artist the juror is conflicted with.
      - name: relation_type
        type: enum
        source: input
        description: Nature of the conflict.
        constraints: "FAMILY | TEACHER_STUDENT | SAME_GALLERY | COLLABORATOR | FINANCIAL_INTEREST"
      - name: voided_score_count
        type: integer
        source: computed
        description: Count of Scores flipped to voided_by_conflict == true by this declaration.

  - name: JuryRound
    parent: null
    common_fields: true
    fields:
      - name: exhibition_id
        type: string
        source: input
        description: FK -> Exhibition.id; the call being juried.
      - name: round_number
        type: integer
        source: input
        description: Round ordinal; unique per exhibition.
        constraints: ">= 1, unique per exhibition_id"
      - name: round_type
        type: enum
        source: input
        description: BLIND_SCORING masks artist identity from Juror readers; DELIBERATION reveals it.
        constraints: "BLIND_SCORING | DELIBERATION"
      - name: opens_at
        type: datetime
        source: input
        description: First instant scores may be submitted (inclusive).
      - name: closes_at
        type: datetime
        source: input
        description: Last instant scores may be submitted (inclusive; closed interval).
      - name: quorum_required
        type: integer
        source: input
        description: Distinct non-voided scores an artwork needs before the round may complete.
      - name: status
        type: enum
        source: system
        default: PENDING
        description: Round lifecycle; cyclic between SCORING_COMPLETE and OPEN.
        constraints: "PENDING | OPEN | SCORING_COMPLETE | CLOSED"
      - name: reopen_count
        type: integer
        source: system
        default: 0
        description: Number of SCORING_COMPLETE -> OPEN transitions; capped at 2.
      - name: scored_artwork_count
        type: integer
        source: computed
        description: Count of distinct artworks holding at least one non-voided score in this round.
      - name: quorum_shortfall_count
        type: integer
        source: computed
        description: Count of this exhibition's artworks with status SUBMITTED whose non-voided score count in this round is < quorum_required.

  - name: JurorAssignment
    parent: null
    common_fields: true
    fields:
      - name: juror_id
        type: string
        source: input
        description: FK -> Juror.id; the booked juror.
      - name: jury_round_id
        type: string
        source: input
        description: FK -> JuryRound.id; the round the session serves.
      - name: session_start_at
        type: datetime
        source: input
        description: Session start (inclusive).
      - name: session_end_at
        type: datetime
        source: input
        description: Session end (exclusive; half-open, so back-to-back sessions are legal).
      - name: status
        type: enum
        source: system
        default: BOOKED
        description: Assignment state.
        constraints: "BOOKED | COMPLETED | CANCELLED"
      - name: session_minutes
        type: integer
        source: computed
        description: "(session_end_at - session_start_at) in whole minutes."
      - name: honorarium_share_cents
        type: integer
        source: computed
        description: Output of calculations.honorarium_proration; 0 when status == CANCELLED.
      - name: scores_submitted_count
        type: integer
        source: computed
        description: Count of scores this juror filed in this round.

  - name: Score
    parent: null
    common_fields: false
    fields:
      - name: jury_round_id
        type: string
        source: input
        description: FK -> JuryRound.id; the round in which the score was cast.
      - name: artwork_id
        type: string
        source: input
        description: FK -> Artwork.id; the work scored.
      - name: juror_id
        type: string
        source: system
        description: FK -> Juror.id; taken from the acting juror's X-User-ID, never from the body.
      - name: technique
        type: integer
        source: input
        description: Technique criterion.
        constraints: integer 1..10
      - name: originality
        type: integer
        source: input
        description: Originality criterion.
        constraints: integer 1..10
      - name: relevance
        type: integer
        source: input
        description: Relevance-to-theme criterion.
        constraints: integer 1..10
      - name: expertise_match
        type: boolean
        source: computed
        description: True when Artwork.medium_category is in the juror's expertise_categories.
      - name: composite_score
        type: number
        source: computed
        description: Output of calculations.composite_score.
      - name: voided_by_conflict
        type: boolean
        source: system
        default: false
        description: Flipped true when a later ConflictDeclaration links this juror to the artwork's artist.
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock instant of submission.

  - name: WallSegment
    parent: null
    common_fields: true
    fields:
      - name: exhibition_id
        type: string
        source: input
        description: FK -> Exhibition.id; the exhibition this wall belongs to.
      - name: label
        type: string
        source: input
        description: Gallery wall label.
      - name: length_cm
        type: number
        source: input
        description: Usable hanging length.
      - name: max_weight_kg
        type: number
        source: input
        description: Aggregate load limit.
      - name: lighting_class
        type: enum
        source: input
        default: STANDARD
        description: Lighting grade of the wall.
        constraints: "STANDARD | MUSEUM"
      - name: occupied_cm
        type: number
        source: computed
        description: Sum of (span_end_cm - span_start_cm) over artworks with this wall_segment_id and placement_status IN {PLANNED, INSTALLED}.
      - name: available_cm
        type: number
        source: computed
        description: "length_cm - occupied_cm; the pair is the conserved spatial quantity."
      - name: loaded_weight_kg
        type: number
        source: computed
        description: Sum of weight_kg over artworks with this wall_segment_id and placement_status IN {PLANNED, INSTALLED}.

  - name: ConditionReport
    parent: null
    common_fields: false
    fields:
      - name: artwork_id
        type: string
        source: input
        description: FK -> Artwork.id; the inspected work.
      - name: stage
        type: enum
        source: input
        description: Inspection stage.
        constraints: "INTAKE | DEINSTALL"
      - name: condition_grade
        type: enum
        source: input
        description: Assessed grade; DAMAGED blocks installation.
        constraints: "A | B | C | DAMAGED"
      - name: photo_count
        type: integer
        source: input
        description: Number of documentation photographs taken.
        constraints: ">= 1"
      - name: damage_notes
        type: string
        source: input
        description: Free text; required when condition_grade == DAMAGED.
      - name: reported_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the filing Registrar.

  - name: Sponsor
    parent: null
    common_fields: true
    fields:
      - name: exhibition_id
        type: string
        source: input
        description: FK -> Exhibition.id; the sponsored exhibition.
      - name: name
        type: string
        source: input
        description: Sponsor name as recognised in print.
      - name: contribution_cents
        type: integer
        source: input
        description: Cash contribution driving recognition_tier.
      - name: purchase_award_budget_cents
        type: integer
        source: input
        description: Ceiling on this sponsor's confirmed purchase awards.
      - name: recognition_tier
        type: enum
        source: computed
        description: Output of calculations.sponsor_recognition_tier.
        constraints: "NONE | BRONZE | SILVER | GOLD | PRESENTING"
      - name: purchase_award_committed_cents
        type: integer
        source: computed
        description: Sum of prize_cents over this sponsor's awards with status CONFIRMED.

  - name: Award
    parent: null
    common_fields: true
    fields:
      - name: exhibition_id
        type: string
        source: input
        description: FK -> Exhibition.id; the awarding exhibition.
      - name: artwork_id
        type: string
        source: input
        description: FK -> Artwork.id; the honoured work.
      - name: sponsor_id
        type: string
        source: input
        description: FK -> Sponsor.id; nullable, required when category == PURCHASE_AWARD.
      - name: category
        type: enum
        source: input
        description: Prize category.
        constraints: "BEST_IN_SHOW | JURORS_CHOICE | MEDIUM_MERIT | PURCHASE_AWARD"
      - name: prize_cents
        type: integer
        source: input
        description: Cash prize; for PURCHASE_AWARD it is also the purchase price.
      - name: status
        type: enum
        source: system
        default: PROPOSED
        description: Award state.
        constraints: "PROPOSED | CONFIRMED | RESCINDED"
      - name: proposed_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the proposing JuryChair.
      - name: confirmed_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the confirming JuryChair; must differ from proposed_by_user_id.

  - name: Sale
    parent: null
    common_fields: true
    fields:
      - name: artwork_id
        type: string
        source: input
        description: FK -> Artwork.id; the work sold.
      - name: source_award_id
        type: string
        source: system
        description: FK -> Award.id; nullable, set only on the sale cascaded from a confirmed PURCHASE_AWARD.
      - name: sale_type
        type: enum
        source: system
        default: GALLERY_SALE
        description: GALLERY_SALE for counter sales (tax-inclusive price), PURCHASE_AWARD for sponsor purchases (tax-additional).
        constraints: "GALLERY_SALE | PURCHASE_AWARD"
      - name: buyer_name
        type: string
        source: input
        description: Buyer of record.
      - name: buyer_region_code
        type: string
        source: input
        description: Buyer region, recorded for tax reporting.
      - name: tax_exempt
        type: boolean
        source: input
        default: false
        description: When true the sales tax component is zero and the whole sale price is taxable base.
      - name: sale_price_cents
        type: integer
        source: input
        description: Amount charged to the buyer before any tax-additional component.
      - name: taxable_base_cents
        type: integer
        source: computed
        description: Output of calculations.sale_settlement_split.
      - name: sales_tax_cents
        type: integer
        source: computed
        description: Output of calculations.sale_settlement_split.
      - name: commission_cents
        type: integer
        source: computed
        description: Output of calculations.sale_settlement_split.
      - name: artist_payable_cents
        type: integer
        source: computed
        description: Output of calculations.sale_settlement_split.
      - name: buyer_total_cents
        type: integer
        source: computed
        description: Output of calculations.sale_settlement_split; the amount a payment must match exactly.
      - name: status
        type: enum
        source: system
        default: RECORDED
        description: Sale lifecycle.
        constraints: "RECORDED | INVOICED | PAID | PAYOUT_RELEASED | VOIDED"
      - name: recorded_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the recording FinanceOfficer.
      - name: payout_released_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the releasing FinanceOfficer; must differ from recorded_by_user_id.
      - name: void_reason
        type: string
        source: system
        description: Reason captured when the sale was voided.

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Exhibition
    initial_state: DRAFT
    terminal_states: [CLOSED]
    note: "Axis 1 of 2 (status). Axis 2 (settlement_status) is declared as a separate machine below and advances independently."
    transitions:
      - from: DRAFT
        to: OPEN_FOR_ENTRIES
        trigger: "POST /exhibitions/{id}/phase-advance target_status=OPEN_FOR_ENTRIES"
        actor: CallManager
        preconditions:
          - "status == DRAFT"
          - "score_weight_technique + score_weight_originality + score_weight_relevance == 1.00"
          - "allowed_media_categories is non-empty AND eligible_state_codes is non-empty"
          - "logical clock now < call_closes_at (else ERR_CALL_WINDOW_CLOSED)"
        side_effects:
          - "status = OPEN_FOR_ENTRIES"
          - "increments Exhibition.version by 1"
      - from: OPEN_FOR_ENTRIES
        to: JURYING
        trigger: "POST /exhibitions/{id}/phase-advance target_status=JURYING"
        actor: CallManager
        preconditions:
          - "status == OPEN_FOR_ENTRIES"
          - "logical clock now >= call_closes_at (else ERR_CALL_WINDOW_NOT_CLOSED)"
        side_effects:
          - "status = JURYING"
          - "CASCADE hop 1: every Entry of this exhibition with status IN {DRAFT, PENDING_FEE} -> WITHDRAWN (unpaid at deadline)"
          - "CASCADE hop 2: each Entry entering WITHDRAWN drives its own artworks with status IN {DRAFT, SUBMITTED} -> WITHDRAWN"
          - "CASCADE hop 3: each artwork entering WITHDRAWN drives Entry.works_count and Exhibition.insured_value_total_cents recompute"
          - "increments Exhibition.version by 1"
      - from: JURYING
        to: RESULTS_PUBLISHED
        trigger: "POST /exhibitions/{id}/acceptance-list"
        actor: JuryChair
        preconditions:
          - "status == JURYING"
          - "every JuryRound of this exhibition has status CLOSED"
          - "the candidate set of calculations.acceptance_list_determination is non-empty (else ERR_NO_ELIGIBLE_ARTWORKS)"
          - "expected_exhibition_version == version (else ERR_STALE_VERSION)"
        side_effects:
          - "status = RESULTS_PUBLISHED"
          - "runs calculations.acceptance_list_determination; each candidate artwork -> ACCEPTED | WAITLISTED | DECLINED"
          - "recomputes accepted_count, waitlisted_count"
          - "increments Exhibition.version by 1"
      - from: RESULTS_PUBLISHED
        to: INSTALLATION
        trigger: "POST /exhibitions/{id}/phase-advance target_status=INSTALLATION"
        actor: CallManager
        preconditions:
          - "status == RESULTS_PUBLISHED"
          - "at least one WallSegment exists for this exhibition (else ERR_WALL_SEGMENT_REQUIRED)"
          - "logical clock now <= delivery_window_end_at (else ERR_DELIVERY_WINDOW_INVALID)"
        side_effects:
          - "status = INSTALLATION"
          - "increments Exhibition.version by 1"
      - from: INSTALLATION
        to: ON_VIEW
        trigger: "POST /exhibitions/{id}/phase-advance target_status=ON_VIEW"
        actor: CallManager
        preconditions:
          - "status == INSTALLATION"
          - "every artwork with status ACCEPTED or DELIVERED has placement_status == INSTALLED (else ERR_INSTALLATION_INCOMPLETE)"
          - "logical clock now >= opening_at (else ERR_PHASE_TIME_NOT_REACHED)"
        side_effects:
          - "status = ON_VIEW"
          - "every artwork with status DELIVERED and placement_status INSTALLED -> ON_VIEW"
          - "increments Exhibition.version by 1"
      - from: ON_VIEW
        to: CLOSED
        trigger: "POST /exhibitions/{id}/phase-advance target_status=CLOSED"
        actor: CallManager
        preconditions:
          - "status == ON_VIEW"
          - "logical clock now >= closing_at (else ERR_PHASE_TIME_NOT_REACHED)"
        side_effects:
          - "status = CLOSED"
          - "CASCADE hop 1: every artwork with status ON_VIEW -> RETURN_PENDING and claim_deadline_at = closing_at + claim_deadline_days days"
          - "CASCADE hop 2: each artwork entering RETURN_PENDING with placement_status INSTALLED -> DEINSTALLED"
          - "CASCADE hop 3: each artwork entering DEINSTALLED drives its WallSegment.occupied_cm / available_cm / loaded_weight_kg recompute"
          - "CASCADE hop 4: the resulting drop in insured works drives Exhibition.insured_value_total_cents and insurance_premium_cents recompute"
          - "increments Exhibition.version by 1"

  - entity: Exhibition
    initial_state: NOT_STARTED
    terminal_states: [BOOKS_CLOSED]
    note: "Axis 2 of 2 (settlement_status). Independent of the status axis except for the explicit guard on RECONCILING."
    transitions:
      - from: NOT_STARTED
        to: RECONCILING
        trigger: "POST /exhibitions/{id}/settlement target_settlement_status=RECONCILING"
        actor: FinanceOfficer
        preconditions:
          - "settlement_status == NOT_STARTED"
          - "status IN {ON_VIEW, CLOSED} (else ERR_EXHIBITION_PHASE_INVALID)"
        side_effects:
          - "settlement_status = RECONCILING"
          - "recomputes sales_gross_cents, commission_total_cents, sales_tax_total_cents, artist_payable_total_cents, council_retention_cents"
          - "increments Exhibition.version by 1"
      - from: RECONCILING
        to: PAYOUTS_RELEASED
        trigger: "POST /exhibitions/{id}/settlement target_settlement_status=PAYOUTS_RELEASED"
        actor: FinanceOfficer
        preconditions:
          - "settlement_status == RECONCILING"
          - "no Sale of this exhibition has status IN {RECORDED, INVOICED} (every non-voided sale reached PAID or PAYOUT_RELEASED)"
          - "payouts_released_cents == artist_payable_total_cents (else ERR_PAYOUT_INCOMPLETE)"
        side_effects:
          - "settlement_status = PAYOUTS_RELEASED"
          - "increments Exhibition.version by 1"
      - from: PAYOUTS_RELEASED
        to: BOOKS_CLOSED
        trigger: "POST /exhibitions/{id}/settlement target_settlement_status=BOOKS_CLOSED"
        actor: FinanceOfficer
        preconditions:
          - "settlement_status == PAYOUTS_RELEASED"
          - "status == CLOSED (else ERR_EXHIBITION_PHASE_INVALID)"
        side_effects:
          - "settlement_status = BOOKS_CLOSED"
          - "freezes council_retention_cents"
          - "increments Exhibition.version by 1"

  - entity: Entry
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    transitions:
      - from: DRAFT
        to: PENDING_FEE
        trigger: "POST /entries/{id}/submit"
        actor: Artist
        preconditions:
          - "status == DRAFT"
          - "Exhibition.status == OPEN_FOR_ENTRIES (else ERR_EXHIBITION_PHASE_INVALID)"
          - "logical clock now < Exhibition.call_closes_at (else ERR_CALL_WINDOW_CLOSED)"
          - "works_count >= 1"
          - "every artwork of this entry has primary_image_count >= 1 (else ERR_PRIMARY_IMAGE_REQUIRED)"
          - "Artist.residency_state_code IN Exhibition.eligible_state_codes (else ERR_ELIGIBILITY_NOT_MET)"
        side_effects:
          - "runs calculations.entry_fee_assessment and freezes entry_fee_cents"
          - "status = PENDING_FEE, submitted_at = logical clock now"
          - "increments Entry.version by 1"
      - from: PENDING_FEE
        to: SUBMITTED
        trigger: "POST /entries/{id}/fee-payment"
        actor: Artist
        preconditions:
          - "status == PENDING_FEE"
          - "amount_cents == entry_fee_cents (else ERR_FEE_AMOUNT_MISMATCH)"
          - "logical clock now < Exhibition.call_closes_at (else ERR_CALL_WINDOW_CLOSED)"
        side_effects:
          - "fee_paid_cents = amount_cents, status = SUBMITTED"
          - "CASCADE hop 1: every artwork of this entry with status DRAFT -> SUBMITTED"
          - "increments Entry.version by 1"
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /entries/{id}/fee-waiver"
        actor: CallManager
        preconditions:
          - "status IN {DRAFT, PENDING_FEE}"
          - "Exhibition.status == OPEN_FOR_ENTRIES"
          - "works_count >= 1 AND every artwork has primary_image_count >= 1"
        side_effects:
          - "fee_waived = true, entry_fee_cents = 0, fee_paid_cents = 0"
          - "status = SUBMITTED, submitted_at = logical clock now"
          - "every artwork of this entry with status DRAFT -> SUBMITTED"
          - "increments Entry.version by 1"
        note: "Also valid from PENDING_FEE with identical effects (the waiver supersedes an unpaid assessment)."
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /entries/{id}/withdraw"
        actor: Artist | CallManager
        preconditions:
          - "status IN {DRAFT, PENDING_FEE, SUBMITTED}"
          - "Exhibition.status IN {OPEN_FOR_ENTRIES, JURYING} (else ERR_EXHIBITION_PHASE_INVALID)"
          - "no artwork of this entry has status IN {ACCEPTED, WAITLISTED, DELIVERED, ON_VIEW, SOLD}"
        side_effects:
          - "status = WITHDRAWN"
          - "every artwork of this entry with status IN {DRAFT, SUBMITTED, SHORTLISTED} -> WITHDRAWN"
          - "Exhibition.shortlisted_count recomputed"
          - "increments Entry.version by 1"

  - entity: Artwork
    initial_state: DRAFT
    terminal_states: [WITHDRAWN, DECLINED, SOLD, RETURNED, UNCLAIMED_FORFEIT]
    note: "Axis 1 of 2 (status). Branching fork-join: SUBMITTED forks to {SHORTLISTED, DECLINED}; SHORTLISTED forks to {ACCEPTED, WAITLISTED, DECLINED}; WAITLISTED rejoins ACCEPTED via promotion."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "cascade from POST /entries/{id}/fee-payment or POST /entries/{id}/fee-waiver"
        actor: system
        preconditions:
          - "parent Entry transitions to SUBMITTED"
        side_effects:
          - "status = SUBMITTED"
          - "increments Artwork.version by 1"
      - from: SUBMITTED
        to: SHORTLISTED
        trigger: "POST /jury-rounds/{id}/status target_status=SCORING_COMPLETE (round_number 1)"
        actor: system
        preconditions:
          - "valid_score_count >= JuryRound.quorum_required"
          - "certified_mean_score >= Exhibition.advance_score_threshold (inclusive)"
        side_effects:
          - "certified_mean_score written by calculations.artwork_round_mean variant QUORUM_CERTIFIED"
          - "status = SHORTLISTED; Entry.shortlisted_count and Exhibition.shortlisted_count recomputed"
          - "increments Artwork.version by 1"
      - from: SUBMITTED
        to: DECLINED
        trigger: "POST /jury-rounds/{id}/status target_status=SCORING_COMPLETE (round_number 1)"
        actor: system
        preconditions:
          - "valid_score_count >= JuryRound.quorum_required"
          - "certified_mean_score < Exhibition.advance_score_threshold"
        side_effects:
          - "certified_mean_score written by calculations.artwork_round_mean variant QUORUM_CERTIFIED"
          - "status = DECLINED"
          - "increments Artwork.version by 1"
      - from: SHORTLISTED
        to: ACCEPTED
        trigger: "POST /exhibitions/{id}/acceptance-list"
        actor: JuryChair
        preconditions:
          - "artwork rank within acceptance_capacity and within its medium category cap per calculations.acceptance_list_determination"
        side_effects:
          - "status = ACCEPTED"
          - "Exhibition.accepted_count recomputed"
          - "increments Artwork.version by 1"
      - from: SHORTLISTED
        to: WAITLISTED
        trigger: "POST /exhibitions/{id}/acceptance-list"
        actor: JuryChair
        preconditions:
          - "artwork displaced by acceptance_capacity or by its medium category cap, and rank within waitlist_capacity"
        side_effects:
          - "status = WAITLISTED"
          - "Exhibition.waitlisted_count recomputed"
          - "increments Artwork.version by 1"
      - from: SHORTLISTED
        to: DECLINED
        trigger: "POST /exhibitions/{id}/acceptance-list"
        actor: JuryChair
        preconditions:
          - "artwork rank beyond acceptance_capacity + waitlist_capacity"
        side_effects:
          - "status = DECLINED"
          - "increments Artwork.version by 1"
      - from: WAITLISTED
        to: ACCEPTED
        trigger: "POST /artworks/{id}/promotion"
        actor: JuryChair
        preconditions:
          - "status == WAITLISTED"
          - "Exhibition.status IN {RESULTS_PUBLISHED, INSTALLATION} (else ERR_EXHIBITION_PHASE_INVALID)"
          - "Exhibition.accepted_count < Exhibition.acceptance_capacity (else ERR_ACCEPTANCE_CAPACITY_REACHED)"
          - "expected_exhibition_version == Exhibition.version (else ERR_STALE_VERSION)"
        side_effects:
          - "status = ACCEPTED"
          - "Exhibition.accepted_count +1, waitlisted_count -1"
          - "increments Exhibition.version by 1 and Artwork.version by 1"
      - from: ACCEPTED
        to: DELIVERED
        trigger: "POST /artworks/{id}/condition-reports stage=INTAKE"
        actor: Registrar
        preconditions:
          - "status == ACCEPTED"
          - "Exhibition.status == INSTALLATION (else ERR_EXHIBITION_PHASE_INVALID)"
          - "delivery_window_start_at <= now <= delivery_window_end_at (else ERR_DELIVERY_WINDOW_INVALID)"
        side_effects:
          - "status = DELIVERED, intake_condition_grade = report.condition_grade"
          - "Exhibition.insured_value_total_cents recomputed, then Exhibition.insurance_premium_cents recomputed"
          - "increments Artwork.version by 1"
      - from: DELIVERED
        to: ON_VIEW
        trigger: "cascade from POST /exhibitions/{id}/phase-advance target_status=ON_VIEW"
        actor: system
        preconditions:
          - "placement_status == INSTALLED"
        side_effects:
          - "status = ON_VIEW"
          - "increments Artwork.version by 1"
      - from: ON_VIEW
        to: SOLD
        trigger: "POST /sales or cascade from POST /awards/{id}/confirm (category PURCHASE_AWARD)"
        actor: FinanceOfficer | system
        preconditions:
          - "status == ON_VIEW"
          - "for_sale == true for a GALLERY_SALE (else ERR_ARTWORK_NOT_FOR_SALE)"
          - "no existing Sale for this artwork with status != VOIDED"
        side_effects:
          - "status = SOLD, sold_price_cents = Sale.sale_price_cents"
          - "Exhibition.sales_gross_cents / commission_total_cents / sales_tax_total_cents / artist_payable_total_cents recomputed"
          - "increments Artwork.version by 1"
      - from: SOLD
        to: ON_VIEW
        trigger: "POST /sales/{id}/void"
        actor: FinanceOfficer
        preconditions:
          - "the voided sale is the artwork's only non-VOIDED sale"
          - "Exhibition.status == ON_VIEW"
        side_effects:
          - "status = ON_VIEW, sold_price_cents = null"
          - "Exhibition money aggregates recomputed to their pre-sale values"
          - "increments Artwork.version by 1"
        note: "Compensating transition; when Exhibition.status == CLOSED the artwork instead returns to RETURN_PENDING."
      - from: ON_VIEW
        to: RETURN_PENDING
        trigger: "cascade from POST /exhibitions/{id}/phase-advance target_status=CLOSED"
        actor: system
        preconditions:
          - "status == ON_VIEW"
        side_effects:
          - "status = RETURN_PENDING, claim_deadline_at = Exhibition.closing_at + claim_deadline_days days"
          - "placement_status INSTALLED -> DEINSTALLED"
          - "increments Artwork.version by 1"
      - from: RETURN_PENDING
        to: RETURN_SCHEDULED
        trigger: "POST /artworks/{id}/return-shipment"
        actor: Registrar
        preconditions:
          - "status == RETURN_PENDING"
          - "a ConditionReport with stage DEINSTALL exists for this artwork (else ERR_CONDITION_REPORT_REQUIRED)"
          - "return_method == COURIER requires carrier and tracking_number"
        side_effects:
          - "status = RETURN_SCHEDULED, return_method / return_carrier / return_tracking_number stored"
          - "increments Artwork.version by 1"
      - from: RETURN_SCHEDULED
        to: RETURNED
        trigger: "POST /artworks/{id}/return-completion"
        actor: Registrar
        preconditions:
          - "status == RETURN_SCHEDULED"
        side_effects:
          - "status = RETURNED; storage_fee_cents frozen at its swept value"
          - "increments Artwork.version by 1"
      - from: RETURN_PENDING
        to: UNCLAIMED_FORFEIT
        trigger: "POST /exhibitions/{id}/unclaimed-sweep"
        actor: Registrar
        preconditions:
          - "status IN {RETURN_PENDING, RETURN_SCHEDULED} with return_method != COURIER"
          - "overdue_days > FORFEIT_GRACE_DAYS per calculations.unclaimed_storage_accrual"
        side_effects:
          - "storage_fee_cents recomputed, status = UNCLAIMED_FORFEIT"
          - "CASCADE hop 1: Artist.unclaimed_forfeit_count recomputed"
          - "CASCADE hop 2: Artist.payout_hold = true when unclaimed_forfeit_count >= 2"
          - "CASCADE hop 3: any later POST /sales/{id}/payout for that artist is rejected with ERR_ARTIST_PAYOUT_HOLD"
          - "increments Artwork.version by 1"

  - entity: Artwork
    initial_state: UNPLACED
    terminal_states: [DEINSTALLED]
    note: "Axis 2 of 2 (placement_status), independent of the status axis."
    transitions:
      - from: UNPLACED
        to: PLANNED
        trigger: "POST /artworks/{id}/installation-plan"
        actor: Registrar
        preconditions:
          - "placement_status == UNPLACED AND status == DELIVERED"
          - "Exhibition.status == INSTALLATION"
          - "WallSegment.exhibition_id == Artwork's exhibition (else ERR_EXHIBITION_SCOPE_MISMATCH)"
          - "intake_condition_grade != DAMAGED (else ERR_ARTWORK_CONDITION_BLOCKED)"
          - "declared_value_cents <= Exhibition.per_work_insurance_cap_cents (else ERR_INSURANCE_COVERAGE_MISSING)"
          - "0 <= span_start_cm < span_end_cm <= WallSegment.length_cm (else ERR_WALL_SPAN_OUT_OF_BOUNDS)"
          - "no buffered-span collision per validations[priority=42] (else ERR_WALL_SPAN_CONFLICT)"
          - "WallSegment.loaded_weight_kg + weight_kg <= WallSegment.max_weight_kg (else ERR_WALL_WEIGHT_EXCEEDED)"
          - "expected_wall_segment_version == WallSegment.version (else ERR_STALE_VERSION)"
        side_effects:
          - "placement_status = PLANNED, wall_segment_id / span_start_cm / span_end_cm stored"
          - "WallSegment.occupied_cm / available_cm / loaded_weight_kg recomputed"
          - "increments WallSegment.version by 1 and Artwork.version by 1"
      - from: PLANNED
        to: INSTALLED
        trigger: "POST /artworks/{id}/install"
        actor: Registrar
        preconditions:
          - "placement_status == PLANNED"
          - "Exhibition.status == INSTALLATION"
        side_effects:
          - "placement_status = INSTALLED"
          - "increments Artwork.version by 1"
      - from: INSTALLED
        to: DEINSTALLED
        trigger: "POST /artworks/{id}/deinstall"
        actor: Registrar
        preconditions:
          - "placement_status IN {PLANNED, INSTALLED}"
          - "a ConditionReport with stage DEINSTALL exists when status IN {ON_VIEW, RETURN_PENDING} (else ERR_CONDITION_REPORT_REQUIRED)"
        side_effects:
          - "placement_status = DEINSTALLED"
          - "WallSegment.occupied_cm / available_cm / loaded_weight_kg recomputed so that occupied_cm + available_cm == length_cm still holds"
          - "increments Artwork.version by 1"
        note: "Compensating counterpart of the UNPLACED -> PLANNED reservation; also fires as a cascade hop of the CLOSED transition."

  - entity: JuryRound
    initial_state: PENDING
    terminal_states: [CLOSED]
    note: "Cyclic: SCORING_COMPLETE -> OPEN is allowed at most twice (reopen_count <= 2)."
    transitions:
      - from: PENDING
        to: OPEN
        trigger: "POST /jury-rounds/{id}/status target_status=OPEN"
        actor: JuryChair
        preconditions:
          - "status == PENDING"
          - "Exhibition.status == JURYING (else ERR_EXHIBITION_PHASE_INVALID)"
          - "at least one JurorAssignment with status BOOKED exists for this round"
        side_effects:
          - "status = OPEN"
          - "increments JuryRound.version by 1"
      - from: OPEN
        to: SCORING_COMPLETE
        trigger: "POST /jury-rounds/{id}/status target_status=SCORING_COMPLETE"
        actor: JuryChair
        preconditions:
          - "status == OPEN"
          - "quorum_shortfall_count == 0 (else ERR_QUORUM_NOT_MET)"
        side_effects:
          - "status = SCORING_COMPLETE"
          - "for round_number 1: every artwork with status SUBMITTED gets certified_mean_score, then forks to SHORTLISTED or DECLINED"
          - "Entry.shortlisted_count and Exhibition.shortlisted_count recomputed"
          - "increments JuryRound.version by 1"
      - from: SCORING_COMPLETE
        to: OPEN
        trigger: "POST /jury-rounds/{id}/status target_status=OPEN"
        actor: JuryChair
        preconditions:
          - "status == SCORING_COMPLETE"
          - "reopen_count < 2 (else ERR_ROUND_REOPEN_LIMIT)"
          - "Exhibition.status == JURYING"
        side_effects:
          - "status = OPEN, reopen_count +1"
          - "every artwork of this exhibition with status IN {SHORTLISTED, DECLINED} reverts to SUBMITTED and certified_mean_score = null"
          - "Exhibition.shortlisted_count recomputed"
          - "increments JuryRound.version by 1"
      - from: SCORING_COMPLETE
        to: CLOSED
        trigger: "POST /jury-rounds/{id}/status target_status=CLOSED"
        actor: JuryChair
        preconditions:
          - "status == SCORING_COMPLETE"
        side_effects:
          - "status = CLOSED"
          - "every JurorAssignment of this round with status BOOKED -> COMPLETED"
          - "increments JuryRound.version by 1"

  - entity: JurorAssignment
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: BOOKED
        to: COMPLETED
        trigger: "cascade from POST /jury-rounds/{id}/status target_status=CLOSED"
        actor: system
        preconditions:
          - "status == BOOKED"
        side_effects:
          - "status = COMPLETED (honorarium_share_cents retained)"
          - "increments JurorAssignment.version by 1"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /juror-assignments/{id}/cancel or cascade from POST /jurors/{id}/resign"
        actor: JuryChair | system
        preconditions:
          - "status == BOOKED"
          - "JuryRound.status != CLOSED (else ERR_JURY_ROUND_STATE_INVALID)"
        side_effects:
          - "status = CANCELLED, honorarium_share_cents = 0"
          - "CASCADE hop 1: calculations.honorarium_proration re-runs over the juror's remaining {BOOKED, COMPLETED} assignments"
          - "CASCADE hop 2: Juror.honorarium_committed_cents recomputed"
          - "CASCADE hop 3: Exhibition.jury_cost_committed_cents recomputed"
          - "increments JurorAssignment.version by 1"

  - entity: Juror
    initial_state: INVITED
    terminal_states: [RESIGNED]
    transitions:
      - from: INVITED
        to: CONFIRMED
        trigger: "POST /jurors/{id}/confirm"
        actor: Juror | JuryChair
        preconditions:
          - "status == INVITED"
        side_effects:
          - "status = CONFIRMED"
          - "increments Juror.version by 1"
      - from: CONFIRMED
        to: RESIGNED
        trigger: "POST /jurors/{id}/resign"
        actor: Juror | JuryChair
        preconditions:
          - "status IN {INVITED, CONFIRMED}"
        side_effects:
          - "status = RESIGNED"
          - "CASCADE hop 1: every JurorAssignment of this juror with status BOOKED -> CANCELLED"
          - "CASCADE hop 2: each cancelled assignment re-runs calculations.honorarium_proration over the juror's remaining assignments"
          - "CASCADE hop 3: Juror.honorarium_committed_cents recomputed"
          - "CASCADE hop 4: Exhibition.jury_cost_committed_cents recomputed for every affected exhibition"
          - "CASCADE hop 5: each affected JuryRound.quorum_shortfall_count recomputed (a round may become uncompletable)"
          - "increments Juror.version by 1"

  - entity: Award
    initial_state: PROPOSED
    terminal_states: [RESCINDED]
    transitions:
      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST /awards/{id}/confirm"
        actor: JuryChair
        preconditions:
          - "status == PROPOSED"
          - "Exhibition.status IN {RESULTS_PUBLISHED, INSTALLATION, ON_VIEW} (else ERR_EXHIBITION_PHASE_INVALID)"
          - "confirming X-User-ID != proposed_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "for sponsor_id == null: Exhibition.award_committed_cents + prize_cents <= Exhibition.award_budget_cents (else ERR_AWARD_BUDGET_EXCEEDED)"
          - "for PURCHASE_AWARD: Sponsor.purchase_award_committed_cents + prize_cents <= Sponsor.purchase_award_budget_cents (else ERR_SPONSOR_BUDGET_EXCEEDED)"
          - "for PURCHASE_AWARD: Artwork.status == ON_VIEW"
          - "expected_exhibition_version == Exhibition.version (else ERR_STALE_VERSION)"
        side_effects:
          - "status = CONFIRMED, confirmed_by_user_id = acting X-User-ID"
          - "Exhibition.award_committed_cents or Sponsor.purchase_award_committed_cents recomputed"
          - "CASCADE hop 1 (PURCHASE_AWARD only): a Sale is created with sale_type PURCHASE_AWARD, source_award_id = this award, sale_price_cents = prize_cents, buyer_name = Sponsor.name, status RECORDED"
          - "CASCADE hop 2: the created Sale drives Artwork.status ON_VIEW -> SOLD and sold_price_cents = prize_cents"
          - "CASCADE hop 3: the artwork becoming SOLD drives Exhibition.sales_gross_cents / commission_total_cents / sales_tax_total_cents / artist_payable_total_cents recompute"
          - "increments Exhibition.version by 1 and Award.version by 1"
      - from: CONFIRMED
        to: RESCINDED
        trigger: "POST /awards/{id}/rescind"
        actor: JuryChair
        preconditions:
          - "status == CONFIRMED"
          - "Exhibition.settlement_status == NOT_STARTED (else ERR_SETTLEMENT_PHASE_INVALID)"
        side_effects:
          - "status = RESCINDED"
          - "Exhibition.award_committed_cents or Sponsor.purchase_award_committed_cents recomputed downward"
          - "for PURCHASE_AWARD: the linked Sale -> VOIDED and its artwork returns to ON_VIEW"
          - "increments Award.version by 1"

  - entity: Sale
    initial_state: RECORDED
    terminal_states: [VOIDED]
    transitions:
      - from: RECORDED
        to: INVOICED
        trigger: "POST /sales/{id}/invoice"
        actor: FinanceOfficer
        preconditions:
          - "status == RECORDED"
        side_effects:
          - "status = INVOICED"
          - "increments Sale.version by 1"
      - from: INVOICED
        to: PAID
        trigger: "POST /sales/{id}/payment"
        actor: FinanceOfficer
        preconditions:
          - "status == INVOICED"
          - "amount_cents == buyer_total_cents (else ERR_PAYMENT_AMOUNT_MISMATCH)"
        side_effects:
          - "status = PAID"
          - "increments Sale.version by 1"
      - from: PAID
        to: PAYOUT_RELEASED
        trigger: "POST /sales/{id}/payout"
        actor: FinanceOfficer
        preconditions:
          - "status == PAID"
          - "Exhibition.settlement_status == RECONCILING (else ERR_SETTLEMENT_PHASE_INVALID)"
          - "Artist.tax_form_on_file == true (else ERR_TAX_FORM_MISSING)"
          - "Artist.payout_hold == false (else ERR_ARTIST_PAYOUT_HOLD)"
          - "acting X-User-ID != recorded_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "expected_exhibition_version == Exhibition.version (else ERR_STALE_VERSION)"
        side_effects:
          - "status = PAYOUT_RELEASED, payout_released_by_user_id = acting X-User-ID"
          - "Exhibition.payouts_released_cents recomputed"
          - "increments Exhibition.version by 1 and Sale.version by 1"
      - from: PAID
        to: VOIDED
        trigger: "POST /sales/{id}/void"
        actor: FinanceOfficer
        preconditions:
          - "status IN {RECORDED, INVOICED, PAID}"
          - "Exhibition.settlement_status IN {NOT_STARTED, RECONCILING} (else ERR_SETTLEMENT_PHASE_INVALID)"
        side_effects:
          - "status = VOIDED, void_reason stored"
          - "artwork returns to ON_VIEW (or RETURN_PENDING when Exhibition.status == CLOSED) and sold_price_cents = null"
          - "Exhibition.sales_gross_cents / commission_total_cents / sales_tax_total_cents / artist_payable_total_cents recomputed, restoring their pre-sale values"
          - "increments Sale.version by 1"
        note: "Compensating transition for the money invariant; a PAYOUT_RELEASED sale can no longer be voided."

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: installation-plan-stale-wall
    parent_entity: WallSegment
    write_endpoint: "POST /artworks/{id}/installation-plan"
    occ_field: "expected_wall_segment_version"
    description: |
      Planning a span on a WallSegment whose version has advanced since the
      Registrar last read the wall is rejected as stale. Another plan has since
      reserved centimetres on that wall (legitimately, because a non-colliding
      span always succeeds), so the current planner's picture of occupied_cm,
      available_cm and loaded_weight_kg no longer describes the wall.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: award-confirm-stale-exhibition
    parent_entity: Exhibition
    write_endpoint: "POST /awards/{id}/confirm"
    occ_field: "expected_exhibition_version"
    description: |
      Confirming an Award against an Exhibition whose version has advanced is
      rejected as stale. Confirming a different award legitimately consumes part
      of award_budget_cents, so the confirmer's view of award_committed_cents is
      out of date and the budget check would be computed against a stale ceiling.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: promotion-stale-exhibition
    parent_entity: Exhibition
    write_endpoint: "POST /artworks/{id}/promotion"
    occ_field: "expected_exhibition_version"
    description: |
      Promoting a WAITLISTED artwork against a stale Exhibition version is
      rejected. Promoting a different waitlisted artwork legitimately raises
      accepted_count, so a promoter holding an older version is deciding against
      a capacity figure the exhibition no longer has.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: payout-release-stale-exhibition
    parent_entity: Exhibition
    write_endpoint: "POST /sales/{id}/payout"
    occ_field: "expected_exhibition_version"
    description: |
      Releasing an artist payout against a stale Exhibition version is rejected.
      Releasing the payout of a different sale legitimately raises
      payouts_released_cents, so the releasing officer's view of the settlement
      ledger is out of date.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: assignment-create-stale-round
    parent_entity: JuryRound
    write_endpoint: "POST /jury-rounds/{id}/assignments"
    occ_field: "expected_jury_round_version"
    description: |
      Booking a juror session against a JuryRound whose version has advanced is
      rejected as stale. Booking a different juror or a non-overlapping session
      legitimately succeeds and advances the round, so a chair working from an
      older read is scheduling against a session grid that has already changed.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: entry_fee_assessment
    trigger: "POST /entries/{id}/submit (frozen onto Entry.entry_fee_cents)"
    algorithm: tiered_pricing
    formula: |
      discount = (Artist.member_status == MEMBER) ? Exhibition.member_discount_pct : 0.0
      # PINNED ROUNDING ORDER: round each fee LINE to whole cents first, then sum.
      base_line_cents        = round_half_up(Exhibition.entry_fee_base_cents * (1 - discount))
      additional_works       = max(0, Entry.works_count - Exhibition.works_included_in_base)
      additional_line_cents  = round_half_up(Exhibition.entry_fee_additional_cents * (1 - discount))
      oversize_count         = count(artworks of this entry with status != WITHDRAWN
                                     AND longest_edge_cm > OVERSIZE_LONG_EDGE_CM)
      # The surcharge is NEVER discounted.
      entry_fee_cents = base_line_cents
                      + additional_works * additional_line_cents
                      + oversize_count * OVERSIZE_SURCHARGE_CENTS
    input_set: "Artworks of this entry with status != WITHDRAWN at the instant of submit; the Exhibition fee configuration; the Artist's member_status."
    constants:
      OVERSIZE_LONG_EDGE_CM: 120.0
      OVERSIZE_SURCHARGE_CENTS: 2000
    precision: "whole cents, round_half_up applied per line BEFORE multiplication and summation"
    variants:
      - name: PER_LINE_ROUNDING
        when: "always — this is the pinned order"
        difference: "base and additional lines are rounded individually, so 4500 and 1500 at a 0.175 discount give 3713 + 1238 per additional work."
      - name: SUM_THEN_ROUNDING
        when: "never applied — documented only to pin the divergence"
        difference: "rounding the discounted total once (round_half_up((4500 + n*1500) * 0.825)) yields a 1-2 cent lower fee for the same inputs."

  - name: composite_score
    trigger: "POST /jury-rounds/{id}/scores (written onto Score.composite_score)"
    algorithm: weighted_scoring
    formula: |
      raw = technique   * Exhibition.score_weight_technique
          + originality * Exhibition.score_weight_originality
          + relevance   * Exhibition.score_weight_relevance
      expertise_match = Artwork.medium_category IN Juror.expertise_categories
      adjusted = expertise_match ? raw : min(raw, NON_EXPERT_CAP)
      composite_score = round_half_up(adjusted, 2)
    input_set: "The three criteria of this single score, the exhibition's three weights, and the cross-entity expertise test between Artwork.medium_category and Juror.expertise_categories."
    constants:
      NON_EXPERT_CAP: 8.00
    precision: "2 decimal places, round_half_up, applied once after the cap"
    variants:
      - name: EXPERT_UNCAPPED
        when: "expertise_match == true"
        difference: "the weighted raw value is kept in full, so (10,10,10) scores 10.00."
      - name: NON_EXPERT_CAPPED
        when: "expertise_match == false"
        difference: "the same (10,10,10) yields 8.00 because min(raw, 8.00) applies before rounding."

  - name: artwork_round_mean
    trigger: "on every POST /jury-rounds/{id}/scores (PROVISIONAL) and on POST /jury-rounds/{id}/status target_status=SCORING_COMPLETE (QUORUM_CERTIFIED)"
    algorithm: aggregation
    formula: |
      valid_scores = [ s for s in Scores
                       where s.artwork_id == artwork.id
                         AND s.jury_round_id == round.id
                         AND s.voided_by_conflict == false ]
      ordered = sort(valid_scores, key = (created_at ASC, composite_score ASC))

      # VARIANT A (PROVISIONAL) — live figure, written on every score submission:
      provisional_mean_score = round_half_up(mean(composite_score over ALL of ordered), 2)

      # VARIANT B (QUORUM_CERTIFIED) — decision figure, written at round completion:
      certified_window = first JuryRound.quorum_required elements of ordered
      certified_mean_score = round_half_up(mean(composite_score over certified_window), 2)

      advance = certified_mean_score >= Exhibition.advance_score_threshold   # inclusive
    input_set: "Scores of this artwork in this round with voided_by_conflict == false; conflict-voided scores are excluded from both variants. Ordering key: created_at ASC, tie-broken by composite_score ASC (never by id)."
    constants: {}
    precision: "2 decimal places, round_half_up, applied once to the mean"
    variants:
      - name: PROVISIONAL
        when: "round.status == OPEN; refreshed on each submission"
        difference: "averages every valid score, so a late high score raises it — e.g. 7.15/7.00/6.00/10.00 gives 7.54."
      - name: QUORUM_CERTIFIED
        when: "round.status transitions OPEN -> SCORING_COMPLETE; this is the only variant that drives SHORTLISTED/DECLINED"
        difference: "averages only the earliest quorum_required scores, so the same four scores give 6.72 and the artwork is DECLINED against a 7.00 threshold."

  - name: sale_settlement_split
    trigger: "POST /sales and the Sale created by POST /awards/{id}/confirm (category PURCHASE_AWARD)"
    algorithm: waterfall_allocation
    formula: |
      if Sale.tax_exempt:
          taxable_base_cents = sale_price_cents
          sales_tax_cents    = 0
      elif Sale.sale_type == GALLERY_SALE:
          # VARIANT TAX_INCLUSIVE_LIST — posted gallery prices include tax.
          taxable_base_cents = round_half_up(sale_price_cents / (1 + Exhibition.sales_tax_pct))
          sales_tax_cents    = sale_price_cents - taxable_base_cents
      else:  # PURCHASE_AWARD
          # VARIANT TAX_ADDITIONAL — the sponsor pays the prize plus tax.
          taxable_base_cents = sale_price_cents
          sales_tax_cents    = round_half_up(sale_price_cents * Exhibition.sales_tax_pct)

      commission_pct = (Sale.sale_type == PURCHASE_AWARD)
                       ? PURCHASE_AWARD_COMMISSION_PCT
                       : Exhibition.commission_pct
      commission_cents     = round_half_up(taxable_base_cents * commission_pct)
      artist_payable_cents = taxable_base_cents - commission_cents
      buyer_total_cents    = taxable_base_cents + sales_tax_cents
    input_set: "The single Sale row plus Exhibition.sales_tax_pct and Exhibition.commission_pct. Evaluation order is pinned: taxable base, then tax, then commission on the base, then artist payable, then buyer total."
    constants:
      PURCHASE_AWARD_COMMISSION_PCT: 0.10
    precision: "whole cents, round_half_up; the tax component of a tax-inclusive sale is the residual (price - base) so no cent is created or lost"
    variants:
      - name: TAX_INCLUSIVE_LIST
        when: "sale_type == GALLERY_SALE AND tax_exempt == false"
        difference: "sale_price 250000 at 0.0875 tax / 0.35 commission gives base 229885, tax 20115, commission 80460, artist 149425, buyer total 250000."
      - name: TAX_ADDITIONAL
        when: "sale_type == PURCHASE_AWARD AND tax_exempt == false"
        difference: "the same 250000 gives base 250000, tax 21875, commission 25000, artist 225000, buyer total 271875 — the artist nets 75575 cents more from identical inputs."

  - name: insurance_premium_assessment
    trigger: "recomputed whenever an artwork enters or leaves the insured set (INTAKE report, ON_VIEW cascade, CLOSED cascade, void)"
    algorithm: tiered_pricing
    formula: |
      insured_value_total_cents = sum(Artwork.declared_value_cents
                                      for artworks of this exhibition with
                                      status IN {DELIVERED, ON_VIEW, SOLD})
      # PINNED: ceil ONCE on the total, then allocate the thousands across tiers.
      thousands = ceil(insured_value_total_cents / 100000)
      t1 = min(thousands, 50)
      t2 = min(max(thousands - 50, 0), 150)
      t3 = max(thousands - 200, 0)
      premium_raw = t1 * TIER1_RATE_CENTS + t2 * TIER2_RATE_CENTS + t3 * TIER3_RATE_CENTS
      # The minimum-premium floor applies only while coverage is actually in force.
      insurance_premium_cents = (insured_value_total_cents == 0)
                                ? 0
                                : max(MIN_PREMIUM_CENTS, premium_raw)
    input_set: "Artworks of this exhibition with status IN {DELIVERED, ON_VIEW, SOLD}; ACCEPTED, RETURN_PENDING, RETURNED and UNCLAIMED_FORFEIT works are outside coverage."
    constants:
      TIER1_RATE_CENTS: 350
      TIER2_RATE_CENTS: 275
      TIER3_RATE_CENTS: 190
      MIN_PREMIUM_CENTS: 25000
    precision: "whole cents; ceil applied once to the aggregate thousands, never per artwork"
    variants:
      - name: MINIMUM_PREMIUM_FLOOR
        when: "insured_value_total_cents > 0 AND premium_raw < 25000"
        difference: "the floor replaces the tiered figure, so a 4,900,000-cent insured total charges 25000 rather than 17150."
      - name: NO_COVERAGE_IN_FORCE
        when: "insured_value_total_cents == 0"
        difference: "the floor does NOT apply — an exhibition with nothing under coverage charges 0, not 25000."

  - name: acceptance_list_determination
    trigger: "POST /exhibitions/{id}/acceptance-list"
    algorithm: waterfall_allocation
    formula: |
      # (a) ELIGIBILITY FILTER — the candidate set:
      candidates = [ a for a in artworks of this exhibition
                     where a.status == SHORTLISTED
                       AND Entry(a.entry_id).status == SUBMITTED ]
      if candidates is empty: reject with ERR_NO_ELIGIBLE_ARTWORKS (no state change)

      # (b) RANKING EXPRESSION and (c) TIE-BREAK:
      ranked = sort(candidates, key = (certified_mean_score DESC, created_at ASC))

      # per-medium cap keeps one category from dominating:
      medium_cap = ceil(Exhibition.acceptance_capacity * MEDIUM_CAP_PCT)

      accepted = []; waitlisted = []; declined = []
      per_medium = {}
      for a in ranked:
          if len(accepted) < Exhibition.acceptance_capacity
             AND per_medium.get(a.medium_category, 0) < medium_cap:
              accepted.append(a); per_medium[a.medium_category] += 1
          elif len(waitlisted) < Exhibition.waitlist_capacity:
              waitlisted.append(a)
          else:
              declined.append(a)
    input_set: "SHORTLISTED artworks whose entry is SUBMITTED. Excluded: WITHDRAWN entries' works, DECLINED works, and works whose entry never paid."
    constants:
      MEDIUM_CAP_PCT: 0.40
    precision: "integer counts; medium_cap uses ceil so a capacity of 3 permits 2 works per medium"
    variants:
      - name: CAPACITY_FIRST
        when: "always — this is the pinned order"
        difference: "the global capacity test is evaluated before the medium cap for each candidate in rank order, so a capped medium's next work falls to the waitlist even while global capacity remains."

  - name: honorarium_proration
    trigger: "POST /jury-rounds/{id}/assignments, POST /juror-assignments/{id}/cancel, and the resign cascade"
    algorithm: waterfall_allocation
    formula: |
      active = [ x for x in assignments of this juror
                 where x.status IN {BOOKED, COMPLETED} ]
      if active is empty: every share = 0
      total_minutes = sum(x.session_minutes for x in active)
      for x in active:
          x.honorarium_share_cents = floor(Juror.honorarium_cents * x.session_minutes / total_minutes)
      remainder = Juror.honorarium_cents - sum(shares)
      # distribute the remainder one cent at a time over `active` ordered by created_at ASC
      for x in first `remainder` elements of sort(active, key = created_at ASC):
          x.honorarium_share_cents += 1
    input_set: "Assignments of this juror with status IN {BOOKED, COMPLETED} across all rounds; CANCELLED assignments are excluded and carry share 0."
    constants: {}
    precision: "whole cents; floor per assignment then one-cent remainder allocation by created_at ASC (never by id)"
    variants:
      - name: EQUAL_SESSIONS_REMAINDER
        when: "honorarium_cents is not divisible by the number of equal-length sessions"
        difference: "50000 over three 100-minute sessions gives 16667 / 16667 / 16666 rather than a fractional share; the sum stays exactly 50000."

  - name: settlement_retention
    trigger: "POST /exhibitions/{id}/settlement target_settlement_status=RECONCILING and every money recompute thereafter"
    algorithm: constraint_propagation
    formula: |
      # The retention figure and the premium-recovery rate look mutually dependent.
      # PINNED EVALUATION ORDER breaks the loop — the recovery tier is keyed on
      # commission_total_cents, NEVER on council_retention_cents:
      # step 1
      sales_gross_cents      = sum(s.sale_price_cents  for non-voided sales of this exhibition)
      # step 2
      commission_total_cents = sum(s.commission_cents  for the same set)
      sales_tax_total_cents  = sum(s.sales_tax_cents   for the same set)
      artist_payable_total_cents = sum(s.artist_payable_cents for the same set)
      # step 3
      premium = Exhibition.insurance_premium_cents      # already computed by insurance_premium_assessment
      # step 4 — tier selected from step 2's output, not from the result below
      recovery_pct = commission_total_cents >= RECOVERY_TIER2_CENTS ? 0.75
                   : commission_total_cents >= RECOVERY_TIER1_CENTS ? 0.50
                   : 0.25
      # step 5
      council_retention_cents = commission_total_cents - round_half_up(premium * recovery_pct)
    input_set: "Sales of this exhibition with status IN {RECORDED, INVOICED, PAID, PAYOUT_RELEASED} (VOIDED excluded) plus the current insurance_premium_cents."
    constants:
      RECOVERY_TIER1_CENTS: 50000
      RECOVERY_TIER2_CENTS: 150000
    precision: "whole cents, round_half_up on the recovered premium only; the retention value may be negative when commission is small"
    variants:
      - name: COMMISSION_KEYED_RECOVERY
        when: "always — this is the pinned order"
        difference: "keying the tier on retention instead of commission would be self-referential and is explicitly not the rule."

  - name: unclaimed_storage_accrual
    trigger: "POST /exhibitions/{id}/unclaimed-sweep"
    algorithm: threshold
    formula: |
      for a in artworks of this exhibition
              where a.status IN {RETURN_PENDING, RETURN_SCHEDULED}
                AND (a.return_method IS NULL OR a.return_method == ARTIST_PICKUP)
                AND now >= a.claim_deadline_at:
          overdue_days = floor((now - a.claim_deadline_at) / 86400 seconds) + 1   # deadline day counts as day 1
          a.storage_fee_cents = min(STORAGE_FEE_PER_DAY_CENTS * overdue_days,
                                    floor(a.declared_value_cents * STORAGE_FEE_CAP_PCT))
          if overdue_days > FORFEIT_GRACE_DAYS:
              a.status = UNCLAIMED_FORFEIT
    input_set: "Artworks of this exhibition in {RETURN_PENDING, RETURN_SCHEDULED} whose return_method is null or ARTIST_PICKUP and whose claim_deadline_at is at or before the logical clock; COURIER shipments are excluded because the council controls transit."
    constants:
      STORAGE_FEE_PER_DAY_CENTS: 1500
      STORAGE_FEE_CAP_PCT: 0.5
      FORFEIT_GRACE_DAYS: 30
    precision: "whole cents; day counting uses floor on whole 86400-second days plus one"
    variants:
      - name: DEADLINE_DAY_INCLUSIVE
        when: "now == claim_deadline_at exactly"
        difference: "overdue_days is 1 (not 0), so one day of storage accrues at the boundary instant."

  - name: sponsor_recognition_tier
    trigger: "POST /sponsors (and on any change to contribution_cents)"
    algorithm: threshold
    formula: |
      tier = contribution_cents >= 5000000 ? PRESENTING
           : contribution_cents >= 2500000 ? GOLD
           : contribution_cents >= 1000000 ? SILVER
           : contribution_cents >=  250000 ? BRONZE
           : NONE
    input_set: "The single Sponsor row."
    constants:
      BRONZE_FLOOR_CENTS: 250000
      SILVER_FLOOR_CENTS: 1000000
      GOLD_FLOOR_CENTS: 2500000
      PRESENTING_FLOOR_CENTS: 5000000
    precision: "integer cents; every threshold is inclusive (>=), so exactly 1000000 is SILVER"
    variants:
      - name: INCLUSIVE_FLOORS
        when: "always"
        difference: "999999 is BRONZE while 1000000 is SILVER."

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "every path id resolves, validated left-to-right"
    error_id: ERR_EXHIBITION_NOT_FOUND | ERR_ENTRY_NOT_FOUND | ERR_ARTWORK_NOT_FOUND | ERR_JUROR_NOT_FOUND | ERR_JURY_ROUND_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_WALL_SEGMENT_NOT_FOUND | ERR_SPONSOR_NOT_FOUND | ERR_AWARD_NOT_FOUND | ERR_SALE_NOT_FOUND | ERR_SCORE_NOT_FOUND | ERR_ARTIST_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 4
    category: existence
    check: "every FK supplied in the body resolves"
    error_id: ERR_EXHIBITION_NOT_FOUND | ERR_ARTIST_NOT_FOUND | ERR_ARTWORK_NOT_FOUND | ERR_JUROR_NOT_FOUND | ERR_WALL_SEGMENT_NOT_FOUND | ERR_SPONSOR_NOT_FOUND
    http_status: 404
    applies_to: "POST /entries, POST /jury-rounds, POST /jury-rounds/{id}/assignments, POST /jury-rounds/{id}/scores, POST /wall-segments, POST /sponsors, POST /awards, POST /sales, POST /artworks/{id}/installation-plan, POST /jurors/{id}/conflict-declarations"
  - priority: 5
    category: auth
    check: "entity_backed ownership: Artist X-User-ID equals Entry.artist_id (and the artwork's entry's artist_id); Juror X-User-ID equals the target Juror.id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /entries, POST /entries/{id}/artworks, POST /entries/{id}/submit, POST /entries/{id}/fee-payment, POST /entries/{id}/withdraw, POST /artworks/{id}/images, POST /jurors/{id}/confirm, POST /jurors/{id}/resign, POST /jurors/{id}/conflict-declarations, PATCH /artists/{id}"
  - priority: 6
    category: business_constraint
    check: "body schema: required fields present, enum members valid, integers in range (score criteria 1..10, photo_count >= 1, non-negative cents), span_start_cm < span_end_cm, score weights summing to 1.00, damage_notes present when condition_grade == DAMAGED, list_price_cents present when for_sale == true, carrier and tracking_number present when return_method == COURIER"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 7
    category: state
    check: "the target resource is in a state from which this transition is declared in §1.2"
    error_id: ERR_ENTRY_STATE_INVALID | ERR_ARTWORK_STATE_INVALID | ERR_JURY_ROUND_STATE_INVALID | ERR_AWARD_STATE_INVALID | ERR_SALE_STATE_INVALID | ERR_ASSIGNMENT_STATE_INVALID
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 8
    category: state
    check: "Exhibition.status permits the operation (phase guard)"
    error_id: ERR_EXHIBITION_PHASE_INVALID
    http_status: 409
    applies_to: "POST /exhibitions/{id}/phase-advance, POST /exhibitions/{id}/acceptance-list, POST /entries/**, POST /jury-rounds/{id}/status, POST /artworks/{id}/promotion, POST /artworks/{id}/condition-reports, POST /artworks/{id}/installation-plan, POST /artworks/{id}/install, POST /awards/{id}/confirm, POST /sales, POST /exhibitions/{id}/settlement"
  - priority: 9
    category: state
    check: "Exhibition.settlement_status permits the operation"
    error_id: ERR_SETTLEMENT_PHASE_INVALID
    http_status: 409
    applies_to: "POST /exhibitions/{id}/settlement, POST /sales/{id}/payout, POST /sales/{id}/void, POST /awards/{id}/rescind"
  - priority: 10
    category: state
    check: "Juror.status == CONFIRMED before booking a session or submitting a score"
    error_id: ERR_JUROR_NOT_CONFIRMED
    http_status: 409
    applies_to: "POST /jury-rounds/{id}/assignments, POST /jury-rounds/{id}/scores"
  - priority: 11
    category: state
    check: "JuryRound.reopen_count < 2 when re-opening a completed round"
    error_id: ERR_ROUND_REOPEN_LIMIT
    http_status: 409
    applies_to: "POST /jury-rounds/{id}/status (target OPEN from SCORING_COMPLETE)"
  - priority: 12
    category: business_referential
    check: "cross-aggregate coherence: WallSegment.exhibition_id equals the artwork's exhibition; the scored artwork belongs to the round's exhibition; Award.artwork_id belongs to Award.exhibition_id; Sponsor.exhibition_id equals Award.exhibition_id"
    error_id: ERR_EXHIBITION_SCOPE_MISMATCH
    http_status: 422
    applies_to: "POST /artworks/{id}/installation-plan, POST /jury-rounds/{id}/scores, POST /awards, POST /awards/{id}/confirm"
  - priority: 13
    category: business_referential
    check: "a GALLERY_SALE requires Artwork.for_sale == true with a list_price_cents"
    error_id: ERR_ARTWORK_NOT_FOR_SALE
    http_status: 422
    applies_to: "POST /sales"
  - priority: 14
    category: business_safety
    check: "the acting juror has no ConflictDeclaration naming the artwork's artist"
    error_id: ERR_JUROR_CONFLICT_DECLARED
    http_status: 403
    applies_to: "POST /jury-rounds/{id}/scores"
  - priority: 15
    category: business_safety
    check: "segregation of duties: the confirming X-User-ID differs from Award.proposed_by_user_id; the releasing X-User-ID differs from Sale.recorded_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /awards/{id}/confirm, POST /sales/{id}/payout"
  - priority: 16
    category: business_safety
    check: "the required ConditionReport exists (stage INTAKE before deinstall reporting is possible; stage DEINSTALL before deinstall of a shown work and before a return shipment)"
    error_id: ERR_CONDITION_REPORT_REQUIRED
    http_status: 409
    applies_to: "POST /artworks/{id}/deinstall, POST /artworks/{id}/return-shipment"
  - priority: 17
    category: business_safety
    check: "Artwork.intake_condition_grade != DAMAGED before a wall span may be reserved"
    error_id: ERR_ARTWORK_CONDITION_BLOCKED
    http_status: 422
    applies_to: "POST /artworks/{id}/installation-plan"
  - priority: 18
    category: business_safety
    check: "Artwork.declared_value_cents <= Exhibition.per_work_insurance_cap_cents"
    error_id: ERR_INSURANCE_COVERAGE_MISSING
    http_status: 409
    applies_to: "POST /artworks/{id}/installation-plan"
  - priority: 19
    category: business_safety
    check: "Artist.tax_form_on_file == true before any payout release"
    error_id: ERR_TAX_FORM_MISSING
    http_status: 422
    applies_to: "POST /sales/{id}/payout"
  - priority: 20
    category: business_safety
    check: "Artist.payout_hold == false before any payout release"
    error_id: ERR_ARTIST_PAYOUT_HOLD
    http_status: 409
    applies_to: "POST /sales/{id}/payout"
  - priority: 21
    category: business_temporal
    check: "logical clock now < Exhibition.call_closes_at (half-open submission window)"
    error_id: ERR_CALL_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /entries, POST /entries/{id}/artworks, POST /entries/{id}/submit, POST /entries/{id}/fee-payment, POST /exhibitions/{id}/phase-advance (target OPEN_FOR_ENTRIES)"
  - priority: 22
    category: business_temporal
    check: "logical clock now >= Exhibition.call_closes_at before JURYING may begin"
    error_id: ERR_CALL_WINDOW_NOT_CLOSED
    http_status: 409
    applies_to: "POST /exhibitions/{id}/phase-advance (target JURYING)"
  - priority: 23
    category: business_temporal
    check: "JuryRound.opens_at <= now <= JuryRound.closes_at (closed scoring window)"
    error_id: ERR_SCORING_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /jury-rounds/{id}/scores"
  - priority: 24
    category: business_temporal
    check: "the session lies inside [JuryRound.opens_at, JuryRound.closes_at]"
    error_id: ERR_SESSION_OUTSIDE_ROUND_WINDOW
    http_status: 422
    applies_to: "POST /jury-rounds/{id}/assignments"
  - priority: 25
    category: business_temporal
    check: "the juror holds no other {BOOKED, COMPLETED} assignment whose half-open interval [session_start_at, session_end_at) intersects the requested one; touching endpoints do not intersect"
    error_id: ERR_JUROR_SESSION_OVERLAP
    http_status: 409
    applies_to: "POST /jury-rounds/{id}/assignments"
  - priority: 26
    category: business_temporal
    check: "delivery_window_start_at <= now <= delivery_window_end_at for an INTAKE report; and now <= delivery_window_end_at when entering INSTALLATION"
    error_id: ERR_DELIVERY_WINDOW_INVALID
    http_status: 409
    applies_to: "POST /artworks/{id}/condition-reports (stage INTAKE), POST /exhibitions/{id}/phase-advance (target INSTALLATION)"
  - priority: 27
    category: business_temporal
    check: "now >= opening_at for ON_VIEW and now >= closing_at for CLOSED"
    error_id: ERR_PHASE_TIME_NOT_REACHED
    http_status: 409
    applies_to: "POST /exhibitions/{id}/phase-advance (targets ON_VIEW, CLOSED)"
  - priority: 28
    category: business_constraint
    check: "Artist.residency_state_code IN Exhibition.eligible_state_codes"
    error_id: ERR_ELIGIBILITY_NOT_MET
    http_status: 422
    applies_to: "POST /entries, POST /entries/{id}/submit"
  - priority: 29
    category: business_constraint
    check: "Artwork.medium_category IN Exhibition.allowed_media_categories"
    error_id: ERR_MEDIA_CATEGORY_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /entries/{id}/artworks"
  - priority: 30
    category: business_constraint
    check: "longest_edge_cm <= Exhibition.max_dimension_cm AND weight_kg <= Exhibition.max_weight_kg"
    error_id: ERR_SIZE_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /entries/{id}/artworks"
  - priority: 31
    category: business_constraint
    check: "works_count would not exceed Exhibition.max_works_per_entry"
    error_id: ERR_MAX_WORKS_EXCEEDED
    http_status: 422
    applies_to: "POST /entries/{id}/artworks"
  - priority: 32
    category: business_constraint
    check: "the artist's entries in this exhibition with status IN {DRAFT, PENDING_FEE, SUBMITTED} would not exceed Exhibition.max_entries_per_artist"
    error_id: ERR_ENTRY_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /entries"
  - priority: 33
    category: business_constraint
    check: "image standard: format IN {JPEG, PNG}, pixel_long_edge >= 1200, pixel_short_edge >= 800, file_bytes <= 8388608, color_profile == SRGB"
    error_id: ERR_IMAGE_STANDARD_VIOLATION
    http_status: 422
    applies_to: "POST /artworks/{id}/images"
  - priority: 34
    category: business_constraint
    check: "image metadata: credit_line non-empty AND capture_date present and not after the logical clock"
    error_id: ERR_IMAGE_METADATA_INCOMPLETE
    http_status: 422
    applies_to: "POST /artworks/{id}/images"
  - priority: 35
    category: business_constraint
    check: "every artwork of the entry has primary_image_count >= 1 (and at most 1 PRIMARY image per artwork)"
    error_id: ERR_PRIMARY_IMAGE_REQUIRED
    http_status: 409
    applies_to: "POST /entries/{id}/submit, POST /entries/{id}/fee-waiver, POST /artworks/{id}/images"
  - priority: 36
    category: business_constraint
    check: "round_number is unique within the exhibition"
    error_id: ERR_DUPLICATE_ROUND_NUMBER
    http_status: 409
    applies_to: "POST /jury-rounds"
  - priority: 37
    category: business_constraint
    check: "at most one Score per (jury_round_id, artwork_id, juror_id)"
    error_id: ERR_DUPLICATE_SCORE
    http_status: 409
    applies_to: "POST /jury-rounds/{id}/scores"
  - priority: 38
    category: business_constraint
    check: "JuryRound.quorum_shortfall_count == 0 before the round may complete"
    error_id: ERR_QUORUM_NOT_MET
    http_status: 409
    applies_to: "POST /jury-rounds/{id}/status (target SCORING_COMPLETE)"
  - priority: 39
    category: business_constraint
    check: "the acceptance-list candidate set is non-empty"
    error_id: ERR_NO_ELIGIBLE_ARTWORKS
    http_status: 409
    applies_to: "POST /exhibitions/{id}/acceptance-list"
  - priority: 40
    category: business_constraint
    check: "Exhibition.accepted_count < Exhibition.acceptance_capacity before a waitlist promotion"
    error_id: ERR_ACCEPTANCE_CAPACITY_REACHED
    http_status: 409
    applies_to: "POST /artworks/{id}/promotion"
  - priority: 41
    category: business_constraint
    check: "0 <= span_start_cm < span_end_cm <= WallSegment.length_cm"
    error_id: ERR_WALL_SPAN_OUT_OF_BOUNDS
    http_status: 422
    applies_to: "POST /artworks/{id}/installation-plan"
  - priority: 42
    category: business_constraint
    check: "buffered span collision on the wall: reject when (span_start_cm - WALL_BUFFER_CM) < other.span_end_cm AND (span_end_cm + WALL_BUFFER_CM) > other.span_start_cm for any artwork on the same wall with placement_status IN {PLANNED, INSTALLED}; WALL_BUFFER_CM = 15, so a gap of exactly 15 cm is legal and 14 cm is not"
    error_id: ERR_WALL_SPAN_CONFLICT
    http_status: 409
    applies_to: "POST /artworks/{id}/installation-plan"
  - priority: 43
    category: business_constraint
    check: "WallSegment.loaded_weight_kg + Artwork.weight_kg <= WallSegment.max_weight_kg"
    error_id: ERR_WALL_WEIGHT_EXCEEDED
    http_status: 422
    applies_to: "POST /artworks/{id}/installation-plan"
  - priority: 44
    category: business_constraint
    check: "every ACCEPTED or DELIVERED artwork has placement_status INSTALLED before ON_VIEW"
    error_id: ERR_INSTALLATION_INCOMPLETE
    http_status: 409
    applies_to: "POST /exhibitions/{id}/phase-advance (target ON_VIEW)"
  - priority: 45
    category: business_constraint
    check: "at least one WallSegment exists for the exhibition before INSTALLATION"
    error_id: ERR_WALL_SEGMENT_REQUIRED
    http_status: 409
    applies_to: "POST /exhibitions/{id}/phase-advance (target INSTALLATION)"
  - priority: 46
    category: business_fiscal
    check: "amount_cents == Entry.entry_fee_cents exactly"
    error_id: ERR_FEE_AMOUNT_MISMATCH
    http_status: 402
    applies_to: "POST /entries/{id}/fee-payment"
  - priority: 47
    category: business_fiscal
    check: "council award budget: award_committed_cents + prize_cents <= award_budget_cents for awards without a sponsor"
    error_id: ERR_AWARD_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /awards/{id}/confirm"
  - priority: 48
    category: business_fiscal
    check: "sponsor purchase budget: purchase_award_committed_cents + prize_cents <= purchase_award_budget_cents"
    error_id: ERR_SPONSOR_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /awards/{id}/confirm"
  - priority: 49
    category: business_fiscal
    check: "amount_cents == Sale.buyer_total_cents exactly"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 402
    applies_to: "POST /sales/{id}/payment"
  - priority: 50
    category: state
    check: "OCC: expected_<parent>_version equals the parent's current version (see §1.2.1)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /artworks/{id}/installation-plan, POST /awards/{id}/confirm, POST /artworks/{id}/promotion, POST /sales/{id}/payout, POST /jury-rounds/{id}/assignments, POST /exhibitions/{id}/acceptance-list"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # --- Exhibitions -------------------------------------------------------
  - method: POST
    path: "/exhibitions"
    description: "Create an exhibition (call for entries configuration) in DRAFT / NOT_STARTED."
    roles: [CallManager]
    code: 201
    input: [title, season_year, call_opens_at, call_closes_at, notification_at, delivery_window_start_at, delivery_window_end_at, opening_at, closing_at, entry_fee_base_cents, entry_fee_additional_cents, max_dimension_cm, max_weight_kg, per_work_insurance_cap_cents, allowed_media_categories, eligible_state_codes, acceptance_capacity, waitlist_capacity, jury_quorum, advance_score_threshold, score_weight_technique, score_weight_originality, score_weight_relevance, commission_pct, sales_tax_pct, award_budget_cents, "claim_deadline_days?", "works_included_in_base?", "member_discount_pct?", "max_works_per_entry?", "max_entries_per_artist?"]
    output: Exhibition
    side_effects: ["status = DRAFT", "settlement_status = NOT_STARTED", "all money aggregates = 0", "version = 1"]
  - method: GET
    path: "/exhibitions"
    description: "List exhibitions with pagination and optional status filter."
    roles: [CallManager, JuryChair, Juror, Artist, Registrar, FinanceOfficer]
    code: 200
    input: ["status?", "season_year?", "limit?", "offset?"]
    output: Exhibition[]
    side_effects: []
  - method: GET
    path: "/exhibitions/{id}"
    description: "Read one exhibition including every computed money and count field; the source of expected_exhibition_version."
    roles: [CallManager, JuryChair, Juror, Artist, Registrar, FinanceOfficer]
    code: 200
    input: []
    output: Exhibition
    side_effects: []
  - method: POST
    path: "/exhibitions/{id}/phase-advance"
    description: "Advance Exhibition.status along axis 1 (OPEN_FOR_ENTRIES, JURYING, INSTALLATION, ON_VIEW, CLOSED). RESULTS_PUBLISHED is reachable only through the acceptance-list run."
    roles: [CallManager]
    code: 200
    input: [target_status]
    output: Exhibition
    side_effects: ["state machine Exhibition axis 1 transition with its declared cascades", "increments Exhibition.version by 1"]
  - method: POST
    path: "/exhibitions/{id}/acceptance-list"
    description: "Ops run: determine the acceptance list (calculations.acceptance_list_determination), fork every SHORTLISTED artwork to ACCEPTED / WAITLISTED / DECLINED and move the exhibition to RESULTS_PUBLISHED."
    roles: [JuryChair]
    code: 200
    input: [expected_exhibition_version]
    output: { accepted_artwork_ids: "string[]", waitlisted_artwork_ids: "string[]", declined_artwork_ids: "string[]", accepted_count: integer, waitlisted_count: integer, declined_count: integer, exhibition_status: string }
    side_effects: ["artwork forks", "recomputes accepted_count / waitlisted_count / shortlisted_count", "increments Exhibition.version by 1"]
  - method: POST
    path: "/exhibitions/{id}/settlement"
    description: "Advance Exhibition.settlement_status along axis 2 (RECONCILING, PAYOUTS_RELEASED, BOOKS_CLOSED)."
    roles: [FinanceOfficer]
    code: 200
    input: [target_settlement_status]
    output: Exhibition
    side_effects: ["recomputes the money aggregates and council_retention_cents", "increments Exhibition.version by 1"]
  - method: POST
    path: "/exhibitions/{id}/unclaimed-sweep"
    description: "Ops run: accrue storage fees on unclaimed work at the current logical clock and forfeit works past the grace period."
    roles: [Registrar]
    code: 200
    input: []
    output: { swept_artwork_ids: "string[]", forfeited_artwork_ids: "string[]", storage_fee_total_cents: integer, swept_at: string }
    side_effects: ["Artwork.storage_fee_cents recomputed", "status -> UNCLAIMED_FORFEIT past grace", "Artist.unclaimed_forfeit_count and payout_hold cascade"]

  # --- Artists -----------------------------------------------------------
  - method: POST
    path: "/artists"
    description: "Register an artist in the council roster."
    roles: [CallManager]
    code: 201
    input: [legal_name, email, residency_state_code, "member_status?", "tax_form_on_file?", "payout_method?"]
    output: Artist
    side_effects: ["payout_hold = false", "unclaimed_forfeit_count = 0"]
  - method: GET
    path: "/artists/{id}"
    description: "Read one artist including payout eligibility fields."
    roles: [CallManager, Artist, FinanceOfficer]
    code: 200
    input: []
    output: Artist
    side_effects: []
  - method: PATCH
    path: "/artists/{id}"
    description: "Update artist administrative fields; CallManager may also clear payout_hold."
    roles: [CallManager, Artist]
    code: 200
    input: ["member_status?", "tax_form_on_file?", "payout_method?", "payout_hold?"]
    output: Artist
    side_effects: ["increments Artist.version by 1"]
  - method: GET
    path: "/artists/{id}/conflict-declarations"
    description: "Reverse lookup of every conflict declaration naming this artist."
    roles: [CallManager, JuryChair]
    code: 200
    input: ["limit?", "offset?"]
    output: ConflictDeclaration[]
    side_effects: []

  # --- Entries -----------------------------------------------------------
  - method: POST
    path: "/entries"
    description: "Open a DRAFT entry for the acting artist against an OPEN_FOR_ENTRIES call."
    roles: [Artist]
    code: 201
    input: [exhibition_id, artist_id]
    output: Entry
    side_effects: ["status = DRAFT", "entry_fee_cents = 0 until submit"]
  - method: GET
    path: "/entries"
    description: "Filtered list of entries (reverse lookup for Entry.exhibition_id and Entry.artist_id)."
    roles: [CallManager, JuryChair, Artist]
    code: 200
    input: ["exhibition_id?", "artist_id?", "status?", "limit?", "offset?"]
    output: Entry[]
    side_effects: []
  - method: GET
    path: "/entries/{id}"
    description: "Read one entry including the frozen fee assessment; the source of expected_entry_version."
    roles: [CallManager, JuryChair, Artist]
    code: 200
    input: []
    output: Entry
    side_effects: []
  - method: POST
    path: "/entries/{id}/artworks"
    description: "Attach an artwork to a DRAFT entry; enforces media category, size limits and per-entry work count."
    roles: [Artist]
    code: 201
    input: [title, medium_category, width_cm, height_cm, depth_cm, weight_kg, year_created, declared_value_cents, "for_sale?", "list_price_cents?"]
    output: Artwork
    side_effects: ["status = DRAFT", "placement_status = UNPLACED", "longest_edge_cm and blind_label computed", "Entry.works_count recomputed"]
  - method: POST
    path: "/entries/{id}/submit"
    description: "Submit the entry: freeze entry_fee_cents via calculations.entry_fee_assessment and move to PENDING_FEE."
    roles: [Artist]
    code: 200
    input: []
    output: Entry
    side_effects: ["entry_fee_cents frozen", "status = PENDING_FEE", "submitted_at stamped", "increments Entry.version by 1"]
  - method: POST
    path: "/entries/{id}/fee-payment"
    description: "Pay the assessed entry fee exactly; cascades every DRAFT artwork of the entry to SUBMITTED."
    roles: [Artist]
    code: 200
    input: [amount_cents]
    output: Entry
    side_effects: ["fee_paid_cents set", "status = SUBMITTED", "artworks DRAFT -> SUBMITTED", "increments Entry.version by 1"]
  - method: POST
    path: "/entries/{id}/fee-waiver"
    description: "Waive the entry fee (hardship policy) and admit the entry directly to SUBMITTED."
    roles: [CallManager]
    code: 200
    input: []
    output: Entry
    side_effects: ["fee_waived = true", "entry_fee_cents = 0", "status = SUBMITTED", "artworks DRAFT -> SUBMITTED", "increments Entry.version by 1"]
  - method: POST
    path: "/entries/{id}/withdraw"
    description: "Withdraw the entry before results; cascades its non-accepted artworks to WITHDRAWN."
    roles: [Artist, CallManager]
    code: 200
    input: []
    output: Entry
    side_effects: ["status = WITHDRAWN", "artworks -> WITHDRAWN", "Exhibition.shortlisted_count recomputed", "increments Entry.version by 1"]

  # --- Artworks ----------------------------------------------------------
  - method: GET
    path: "/artworks"
    description: "Filtered list of artworks (reverse lookup for Artwork.entry_id and Artwork.wall_segment_id) with pagination."
    roles: [CallManager, JuryChair, Juror, Artist, Registrar, FinanceOfficer]
    code: 200
    input: ["entry_id?", "exhibition_id?", "wall_segment_id?", "status?", "placement_status?", "limit?", "offset?"]
    output: Artwork[]
    side_effects: []
  - method: GET
    path: "/artworks/{id}"
    description: "Read one artwork. For a Juror reader, while any BLIND_SCORING round of the exhibition has status OPEN, entry_id is returned as null and blind_label is the only identifier; DELIBERATION rounds and all other roles see entry_id."
    roles: [CallManager, JuryChair, Juror, Artist, Registrar, FinanceOfficer]
    code: 200
    input: []
    output: Artwork
    side_effects: []
  - method: POST
    path: "/artworks/{id}/images"
    description: "Upload an image record for the artwork; enforces the digital image standard and the metadata requirements."
    roles: [Artist]
    code: 201
    input: [role, format, pixel_long_edge, pixel_short_edge, file_bytes, color_profile, capture_date, credit_line, checksum_sha256]
    output: ArtworkImage
    side_effects: ["Artwork.primary_image_count recomputed"]
  - method: GET
    path: "/artworks/{id}/images"
    description: "Reverse lookup of the artwork's image records."
    roles: [CallManager, JuryChair, Juror, Artist]
    code: 200
    input: ["limit?", "offset?"]
    output: ArtworkImage[]
    side_effects: []
  - method: POST
    path: "/artworks/{id}/condition-reports"
    description: "File an INTAKE (delivery) or DEINSTALL condition report; an INTAKE report drives ACCEPTED -> DELIVERED."
    roles: [Registrar]
    code: 201
    input: [stage, condition_grade, photo_count, "damage_notes?"]
    output: ConditionReport
    side_effects: ["Artwork.intake_condition_grade refreshed for INTAKE", "status ACCEPTED -> DELIVERED", "Exhibition.insured_value_total_cents then insurance_premium_cents recomputed"]
  - method: GET
    path: "/artworks/{id}/condition-reports"
    description: "Reverse lookup of the artwork's condition reports."
    roles: [CallManager, Registrar, FinanceOfficer, Artist]
    code: 200
    input: ["stage?", "limit?", "offset?"]
    output: ConditionReport[]
    side_effects: []
  - method: POST
    path: "/artworks/{id}/promotion"
    description: "Promote a WAITLISTED artwork to ACCEPTED against remaining capacity (OCC on the exhibition)."
    roles: [JuryChair]
    code: 200
    input: [expected_exhibition_version]
    output: Artwork
    side_effects: ["status = ACCEPTED", "Exhibition.accepted_count +1 / waitlisted_count -1", "increments Exhibition.version by 1"]
  - method: POST
    path: "/artworks/{id}/installation-plan"
    description: "Reserve a buffered wall span for a delivered artwork (OCC on the wall segment)."
    roles: [Registrar]
    code: 200
    input: [wall_segment_id, span_start_cm, span_end_cm, expected_wall_segment_version]
    output: Artwork
    side_effects: ["placement_status = PLANNED", "WallSegment.occupied_cm / available_cm / loaded_weight_kg recomputed", "increments WallSegment.version by 1"]
  - method: POST
    path: "/artworks/{id}/install"
    description: "Mark a planned artwork physically installed."
    roles: [Registrar]
    code: 200
    input: []
    output: Artwork
    side_effects: ["placement_status = INSTALLED", "increments Artwork.version by 1"]
  - method: POST
    path: "/artworks/{id}/deinstall"
    description: "Deinstall an artwork and release its wall span (compensating counterpart of the installation plan)."
    roles: [Registrar]
    code: 200
    input: []
    output: Artwork
    side_effects: ["placement_status = DEINSTALLED", "WallSegment.occupied_cm / available_cm / loaded_weight_kg restored", "increments Artwork.version by 1"]
  - method: POST
    path: "/artworks/{id}/return-shipment"
    description: "Arrange the return of unsold work (artist pickup or courier)."
    roles: [Registrar]
    code: 200
    input: [return_method, "carrier?", "tracking_number?"]
    output: Artwork
    side_effects: ["status = RETURN_SCHEDULED", "return fields stored", "increments Artwork.version by 1"]
  - method: POST
    path: "/artworks/{id}/return-completion"
    description: "Record that the work was collected or delivered back to the artist."
    roles: [Registrar]
    code: 200
    input: []
    output: Artwork
    side_effects: ["status = RETURNED", "storage_fee_cents frozen", "increments Artwork.version by 1"]

  # --- Jurors ------------------------------------------------------------
  - method: POST
    path: "/jurors"
    description: "Invite a juror with declared expertise and honorarium terms."
    roles: [JuryChair]
    code: 201
    input: [display_name, email, expertise_categories, honorarium_cents]
    output: Juror
    side_effects: ["status = INVITED", "honorarium_committed_cents = 0"]
  - method: GET
    path: "/jurors/{id}"
    description: "Read one juror including honorarium commitment and payment state."
    roles: [JuryChair, Juror, FinanceOfficer]
    code: 200
    input: []
    output: Juror
    side_effects: []
  - method: POST
    path: "/jurors/{id}/confirm"
    description: "Juror accepts the invitation (INVITED -> CONFIRMED)."
    roles: [Juror, JuryChair]
    code: 200
    input: []
    output: Juror
    side_effects: ["status = CONFIRMED", "increments Juror.version by 1"]
  - method: POST
    path: "/jurors/{id}/conflict-declarations"
    description: "Declare a conflict of interest with an artist; retroactively voids that juror's scores on the artist's works."
    roles: [Juror, JuryChair]
    code: 201
    input: [artist_id, relation_type]
    output: ConflictDeclaration
    side_effects: ["matching Scores get voided_by_conflict = true", "affected Artwork.provisional_mean_score and valid_score_count recomputed", "affected JuryRound.quorum_shortfall_count recomputed"]
  - method: GET
    path: "/jurors/{id}/conflict-declarations"
    description: "Reverse lookup of this juror's conflict declarations."
    roles: [Juror, JuryChair]
    code: 200
    input: ["limit?", "offset?"]
    output: ConflictDeclaration[]
    side_effects: []
  - method: POST
    path: "/jurors/{id}/resign"
    description: "Juror resigns; cancels their booked sessions and re-prorates their honorarium."
    roles: [Juror, JuryChair]
    code: 200
    input: []
    output: Juror
    side_effects: ["status = RESIGNED", "BOOKED assignments -> CANCELLED", "honorarium re-prorated", "Exhibition.jury_cost_committed_cents recomputed"]
  - method: POST
    path: "/jurors/{id}/honorarium-payment"
    description: "Remit honorarium to a juror up to their committed share."
    roles: [FinanceOfficer]
    code: 200
    input: [amount_cents]
    output: Juror
    side_effects: ["honorarium_paid_cents += amount_cents", "increments Juror.version by 1"]

  # --- Jury rounds, assignments, scores ---------------------------------
  - method: POST
    path: "/jury-rounds"
    description: "Create a jury round (blind scoring or deliberation) for an exhibition."
    roles: [JuryChair]
    code: 201
    input: [exhibition_id, round_number, round_type, opens_at, closes_at, "quorum_required?"]
    output: JuryRound
    side_effects: ["status = PENDING", "quorum_required defaults to Exhibition.jury_quorum"]
  - method: GET
    path: "/jury-rounds"
    description: "Filtered list of jury rounds (reverse lookup for JuryRound.exhibition_id)."
    roles: [CallManager, JuryChair, Juror]
    code: 200
    input: ["exhibition_id?", "status?", "limit?", "offset?"]
    output: JuryRound[]
    side_effects: []
  - method: GET
    path: "/jury-rounds/{id}"
    description: "Read one jury round including quorum shortfall; the source of expected_jury_round_version."
    roles: [CallManager, JuryChair, Juror]
    code: 200
    input: []
    output: JuryRound
    side_effects: []
  - method: POST
    path: "/jury-rounds/{id}/status"
    description: "Drive the round machine: OPEN, SCORING_COMPLETE, OPEN again (reopen, max 2) or CLOSED."
    roles: [JuryChair]
    code: 200
    input: [target_status]
    output: JuryRound
    side_effects: ["round transition with its declared cascades (artwork forks on completion, reverts on reopen, assignment completion on close)", "increments JuryRound.version by 1"]
  - method: POST
    path: "/jury-rounds/{id}/assignments"
    description: "Book a confirmed juror into a session window of this round (OCC on the round)."
    roles: [JuryChair]
    code: 201
    input: [juror_id, session_start_at, session_end_at, expected_jury_round_version]
    output: JurorAssignment
    side_effects: ["status = BOOKED", "honorarium re-prorated across the juror's active assignments", "Exhibition.jury_cost_committed_cents recomputed", "increments JuryRound.version by 1"]
  - method: GET
    path: "/juror-assignments"
    description: "Filtered list of assignments (reverse lookup for JurorAssignment.juror_id and jury_round_id)."
    roles: [JuryChair, Juror, FinanceOfficer]
    code: 200
    input: ["juror_id?", "jury_round_id?", "status?", "limit?", "offset?"]
    output: JurorAssignment[]
    side_effects: []
  - method: GET
    path: "/juror-assignments/{id}"
    description: "Read one assignment including its prorated honorarium share."
    roles: [JuryChair, Juror, FinanceOfficer]
    code: 200
    input: []
    output: JurorAssignment
    side_effects: []
  - method: POST
    path: "/juror-assignments/{id}/cancel"
    description: "Cancel a booked session; re-prorates the juror's honorarium so the pool stays conserved."
    roles: [JuryChair]
    code: 200
    input: []
    output: JurorAssignment
    side_effects: ["status = CANCELLED", "honorarium_share_cents = 0", "sibling shares re-prorated", "Juror.honorarium_committed_cents and Exhibition.jury_cost_committed_cents recomputed"]
  - method: POST
    path: "/jury-rounds/{id}/scores"
    description: "Submit one score for one artwork as the acting juror; juror_id comes from X-User-ID."
    roles: [Juror]
    code: 201
    input: [artwork_id, technique, originality, relevance]
    output: Score
    side_effects: ["composite_score computed", "Artwork.provisional_mean_score and valid_score_count recomputed", "JuryRound.scored_artwork_count and quorum_shortfall_count recomputed"]
  - method: GET
    path: "/scores"
    description: "Filtered list of scores (reverse lookup for Score.jury_round_id, artwork_id and juror_id)."
    roles: [JuryChair, Juror]
    code: 200
    input: ["jury_round_id?", "artwork_id?", "juror_id?", "limit?", "offset?"]
    output: Score[]
    side_effects: []
  - method: GET
    path: "/scores/{id}"
    description: "Read one score including its expertise cap outcome."
    roles: [JuryChair, Juror]
    code: 200
    input: []
    output: Score
    side_effects: []

  # --- Wall segments ----------------------------------------------------
  - method: POST
    path: "/wall-segments"
    description: "Register a gallery wall segment for an exhibition."
    roles: [CallManager, Registrar]
    code: 201
    input: [exhibition_id, label, length_cm, max_weight_kg, "lighting_class?"]
    output: WallSegment
    side_effects: ["occupied_cm = 0", "available_cm = length_cm"]
  - method: GET
    path: "/wall-segments"
    description: "Filtered list of wall segments (reverse lookup for WallSegment.exhibition_id)."
    roles: [CallManager, Registrar, JuryChair]
    code: 200
    input: ["exhibition_id?", "limit?", "offset?"]
    output: WallSegment[]
    side_effects: []
  - method: GET
    path: "/wall-segments/{id}"
    description: "Read one wall segment including occupancy; the source of expected_wall_segment_version."
    roles: [CallManager, Registrar, JuryChair]
    code: 200
    input: []
    output: WallSegment
    side_effects: []

  # --- Sponsors ---------------------------------------------------------
  - method: POST
    path: "/sponsors"
    description: "Register a sponsor; recognition_tier is derived from the contribution."
    roles: [CallManager]
    code: 201
    input: [exhibition_id, name, contribution_cents, purchase_award_budget_cents]
    output: Sponsor
    side_effects: ["recognition_tier computed", "purchase_award_committed_cents = 0"]
  - method: GET
    path: "/sponsors"
    description: "Filtered list of sponsors (reverse lookup for Sponsor.exhibition_id)."
    roles: [CallManager, JuryChair, FinanceOfficer]
    code: 200
    input: ["exhibition_id?", "recognition_tier?", "limit?", "offset?"]
    output: Sponsor[]
    side_effects: []
  - method: GET
    path: "/sponsors/{id}"
    description: "Read one sponsor including recognition tier and committed purchase awards."
    roles: [CallManager, JuryChair, FinanceOfficer]
    code: 200
    input: []
    output: Sponsor
    side_effects: []

  # --- Awards -----------------------------------------------------------
  - method: POST
    path: "/awards"
    description: "Propose an award for an artwork; records the proposing chair for segregation of duties."
    roles: [JuryChair]
    code: 201
    input: [exhibition_id, artwork_id, category, prize_cents, "sponsor_id?"]
    output: Award
    side_effects: ["status = PROPOSED", "proposed_by_user_id = acting X-User-ID"]
  - method: GET
    path: "/awards"
    description: "Filtered list of awards (reverse lookup for Award.exhibition_id, artwork_id and sponsor_id)."
    roles: [CallManager, JuryChair, FinanceOfficer]
    code: 200
    input: ["exhibition_id?", "artwork_id?", "sponsor_id?", "status?", "limit?", "offset?"]
    output: Award[]
    side_effects: []
  - method: GET
    path: "/awards/{id}"
    description: "Read one award including its proposer and confirmer."
    roles: [CallManager, JuryChair, FinanceOfficer]
    code: 200
    input: []
    output: Award
    side_effects: []
  - method: POST
    path: "/awards/{id}/confirm"
    description: "Confirm a proposed award by a different chair; a PURCHASE_AWARD cascades into a Sale and marks the work SOLD (OCC on the exhibition)."
    roles: [JuryChair]
    code: 200
    input: [expected_exhibition_version]
    output: Award
    side_effects: ["status = CONFIRMED", "budget commitment recomputed", "PURCHASE_AWARD creates a Sale, artwork -> SOLD, exhibition money aggregates recomputed", "increments Exhibition.version by 1"]
  - method: POST
    path: "/awards/{id}/rescind"
    description: "Rescind a confirmed award, releasing the budget commitment and voiding any purchase-award sale."
    roles: [JuryChair]
    code: 200
    input: [reason]
    output: Award
    side_effects: ["status = RESCINDED", "budget commitment released", "linked Sale -> VOIDED and artwork back to ON_VIEW"]

  # --- Sales ------------------------------------------------------------
  - method: POST
    path: "/sales"
    description: "Record a gallery sale of a work on view (tax-inclusive posted price)."
    roles: [FinanceOfficer]
    code: 201
    input: [artwork_id, buyer_name, buyer_region_code, sale_price_cents, "tax_exempt?"]
    output: Sale
    side_effects: ["sale_type = GALLERY_SALE", "settlement split computed", "artwork -> SOLD", "exhibition money aggregates recomputed", "recorded_by_user_id = acting X-User-ID"]
  - method: GET
    path: "/sales"
    description: "Filtered list of sales (reverse lookup for Sale.artwork_id and Sale.source_award_id)."
    roles: [CallManager, FinanceOfficer, Artist]
    code: 200
    input: ["artwork_id?", "source_award_id?", "status?", "limit?", "offset?"]
    output: Sale[]
    side_effects: []
  - method: GET
    path: "/sales/{id}"
    description: "Read one sale including the full commission / tax / payable split."
    roles: [CallManager, FinanceOfficer, Artist]
    code: 200
    input: []
    output: Sale
    side_effects: []
  - method: POST
    path: "/sales/{id}/invoice"
    description: "Issue the buyer invoice (RECORDED -> INVOICED)."
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: Sale
    side_effects: ["status = INVOICED", "increments Sale.version by 1"]
  - method: POST
    path: "/sales/{id}/payment"
    description: "Record buyer payment of exactly buyer_total_cents (INVOICED -> PAID)."
    roles: [FinanceOfficer]
    code: 200
    input: [amount_cents]
    output: Sale
    side_effects: ["status = PAID", "increments Sale.version by 1"]
  - method: POST
    path: "/sales/{id}/payout"
    description: "Release the artist payment for a paid sale; requires a different officer than the recorder (OCC on the exhibition)."
    roles: [FinanceOfficer]
    code: 200
    input: [expected_exhibition_version]
    output: Sale
    side_effects: ["status = PAYOUT_RELEASED", "payout_released_by_user_id set", "Exhibition.payouts_released_cents recomputed", "increments Exhibition.version by 1"]
  - method: POST
    path: "/sales/{id}/void"
    description: "Void a sale that has not yet paid out; restores the artwork and every exhibition money aggregate."
    roles: [FinanceOfficer]
    code: 200
    input: [reason]
    output: Sale
    side_effects: ["status = VOIDED", "artwork returns to ON_VIEW or RETURN_PENDING", "exhibition money aggregates restored to pre-sale values", "increments Sale.version by 1"]

  # --- Test-driving surface ---------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [CallManager, JuryChair, Juror, Artist, Registrar, FinanceOfficer]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["every subsequent deadline, window and accrual evaluation uses this instant"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or role not one of the six declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "acting role is not listed in the endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "entity_backed actor is not the owner of the target resource"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "award confirmer equals its proposer, or payout releaser equals the sale recorder"
  - id: ERR_EXHIBITION_NOT_FOUND
    http: 404
    condition: "exhibition id does not resolve"
  - id: ERR_ARTIST_NOT_FOUND
    http: 404
    condition: "artist id does not resolve"
  - id: ERR_ENTRY_NOT_FOUND
    http: 404
    condition: "entry id does not resolve"
  - id: ERR_ARTWORK_NOT_FOUND
    http: 404
    condition: "artwork id does not resolve"
  - id: ERR_JUROR_NOT_FOUND
    http: 404
    condition: "juror id does not resolve"
  - id: ERR_JURY_ROUND_NOT_FOUND
    http: 404
    condition: "jury round id does not resolve"
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "juror assignment id does not resolve"
  - id: ERR_WALL_SEGMENT_NOT_FOUND
    http: 404
    condition: "wall segment id does not resolve"
  - id: ERR_SPONSOR_NOT_FOUND
    http: 404
    condition: "sponsor id does not resolve"
  - id: ERR_AWARD_NOT_FOUND
    http: 404
    condition: "award id does not resolve"
  - id: ERR_SALE_NOT_FOUND
    http: 404
    condition: "sale id does not resolve"
  - id: ERR_SCORE_NOT_FOUND
    http: 404
    condition: "score id does not resolve"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "body schema violation: missing required field, bad enum member, out-of-range integer, span_start_cm >= span_end_cm, weights not summing to 1.00, missing damage_notes on a DAMAGED grade, missing list_price_cents on a for-sale work, missing carrier/tracking on a COURIER return"
  - id: ERR_ENTRY_STATE_INVALID
    http: 409
    condition: "entry is not in a state from which the requested transition is declared"
  - id: ERR_ARTWORK_STATE_INVALID
    http: 409
    condition: "artwork status or placement_status does not permit the requested transition"
  - id: ERR_JURY_ROUND_STATE_INVALID
    http: 409
    condition: "jury round status does not permit the requested transition"
  - id: ERR_AWARD_STATE_INVALID
    http: 409
    condition: "award is not PROPOSED for confirm or not CONFIRMED for rescind"
  - id: ERR_SALE_STATE_INVALID
    http: 409
    condition: "sale status does not permit invoice, payment, payout or void"
  - id: ERR_ASSIGNMENT_STATE_INVALID
    http: 409
    condition: "assignment is not BOOKED when cancellation is requested"
  - id: ERR_EXHIBITION_PHASE_INVALID
    http: 409
    condition: "Exhibition.status does not permit the operation, or the requested target_status is not reachable from it"
  - id: ERR_SETTLEMENT_PHASE_INVALID
    http: 409
    condition: "Exhibition.settlement_status does not permit the operation, or the requested target_settlement_status is not reachable from it"
  - id: ERR_JUROR_NOT_CONFIRMED
    http: 409
    condition: "juror is INVITED or RESIGNED when a booking or score is attempted"
  - id: ERR_ROUND_REOPEN_LIMIT
    http: 409
    condition: "reopen requested when reopen_count is already 2"
  - id: ERR_EXHIBITION_SCOPE_MISMATCH
    http: 422
    condition: "referenced entities belong to different exhibitions (wall segment, artwork, sponsor, scored artwork)"
  - id: ERR_ARTWORK_NOT_FOR_SALE
    http: 422
    condition: "gallery sale attempted on a work with for_sale == false"
  - id: ERR_JUROR_CONFLICT_DECLARED
    http: 403
    condition: "acting juror has declared a conflict with the artwork's artist"
  - id: ERR_CONDITION_REPORT_REQUIRED
    http: 409
    condition: "the required INTAKE or DEINSTALL condition report is absent"
  - id: ERR_ARTWORK_CONDITION_BLOCKED
    http: 422
    condition: "intake condition grade is DAMAGED, so the work cannot be hung"
  - id: ERR_INSURANCE_COVERAGE_MISSING
    http: 409
    condition: "declared value exceeds the exhibition's per-work insurance cap"
  - id: ERR_TAX_FORM_MISSING
    http: 422
    condition: "payout attempted while the artist has no tax form on file"
  - id: ERR_ARTIST_PAYOUT_HOLD
    http: 409
    condition: "payout attempted while the artist's payout_hold is true"
  - id: ERR_CALL_WINDOW_CLOSED
    http: 409
    condition: "submission-side operation attempted at or after call_closes_at"
  - id: ERR_CALL_WINDOW_NOT_CLOSED
    http: 409
    condition: "JURYING requested before call_closes_at"
  - id: ERR_SCORING_WINDOW_CLOSED
    http: 409
    condition: "score submitted outside [opens_at, closes_at]"
  - id: ERR_SESSION_OUTSIDE_ROUND_WINDOW
    http: 422
    condition: "session window is not contained in the round's window"
  - id: ERR_JUROR_SESSION_OVERLAP
    http: 409
    condition: "requested half-open session interval intersects another active session of the same juror"
  - id: ERR_DELIVERY_WINDOW_INVALID
    http: 409
    condition: "intake filed outside the closed delivery window, or INSTALLATION requested after delivery_window_end_at"
  - id: ERR_PHASE_TIME_NOT_REACHED
    http: 409
    condition: "ON_VIEW requested before opening_at, or CLOSED requested before closing_at"
  - id: ERR_ELIGIBILITY_NOT_MET
    http: 422
    condition: "artist residency state is not in the exhibition's eligible_state_codes"
  - id: ERR_MEDIA_CATEGORY_NOT_ALLOWED
    http: 422
    condition: "artwork medium category is not in allowed_media_categories"
  - id: ERR_SIZE_LIMIT_EXCEEDED
    http: 422
    condition: "longest edge exceeds max_dimension_cm or weight exceeds max_weight_kg"
  - id: ERR_MAX_WORKS_EXCEEDED
    http: 422
    condition: "attaching the artwork would exceed max_works_per_entry"
  - id: ERR_ENTRY_LIMIT_EXCEEDED
    http: 409
    condition: "artist already holds max_entries_per_artist active entries in this exhibition"
  - id: ERR_IMAGE_STANDARD_VIOLATION
    http: 422
    condition: "image format, pixel dimensions, byte size or colour profile violate the digital standard"
  - id: ERR_IMAGE_METADATA_INCOMPLETE
    http: 422
    condition: "credit_line empty or capture_date missing / in the future"
  - id: ERR_PRIMARY_IMAGE_REQUIRED
    http: 409
    condition: "submit or waiver attempted while some artwork has no PRIMARY image, or a second PRIMARY image is uploaded"
  - id: ERR_DUPLICATE_ROUND_NUMBER
    http: 409
    condition: "round_number already used in this exhibition"
  - id: ERR_DUPLICATE_SCORE
    http: 409
    condition: "this juror already scored this artwork in this round"
  - id: ERR_QUORUM_NOT_MET
    http: 409
    condition: "round completion attempted while some submitted artwork holds fewer valid scores than quorum_required"
  - id: ERR_NO_ELIGIBLE_ARTWORKS
    http: 409
    condition: "acceptance-list run found an empty candidate set"
  - id: ERR_ACCEPTANCE_CAPACITY_REACHED
    http: 409
    condition: "promotion attempted while accepted_count equals acceptance_capacity"
  - id: ERR_WALL_SPAN_OUT_OF_BOUNDS
    http: 422
    condition: "requested span falls outside [0, length_cm]"
  - id: ERR_WALL_SPAN_CONFLICT
    http: 409
    condition: "requested span collides with a neighbouring span once the 15 cm buffer is applied"
  - id: ERR_WALL_WEIGHT_EXCEEDED
    http: 422
    condition: "adding the artwork would exceed the wall's aggregate load limit"
  - id: ERR_INSTALLATION_INCOMPLETE
    http: 409
    condition: "ON_VIEW requested while some accepted work is not installed"
  - id: ERR_WALL_SEGMENT_REQUIRED
    http: 409
    condition: "INSTALLATION requested with no wall segment registered"
  - id: ERR_FEE_AMOUNT_MISMATCH
    http: 402
    condition: "fee payment amount differs from the frozen entry_fee_cents"
  - id: ERR_AWARD_BUDGET_EXCEEDED
    http: 402
    condition: "confirming the award would exceed the council award budget"
  - id: ERR_SPONSOR_BUDGET_EXCEEDED
    http: 402
    condition: "confirming the purchase award would exceed the sponsor's purchase budget"
  - id: ERR_PAYMENT_AMOUNT_MISMATCH
    http: 402
    condition: "buyer payment amount differs from buyer_total_cents"
  - id: ERR_PAYOUT_INCOMPLETE
    http: 409
    condition: "PAYOUTS_RELEASED requested while released cents do not equal artist_payable_total_cents"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not equal the parent entity's current version"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: CallManager
    description: "Runs the call for entries: exhibition configuration, artist roster, wall inventory, sponsors, fee waivers and lifecycle phase advances."
    identity: opaque
    exclusive_operations:
      - "POST /exhibitions"
      - "POST /exhibitions/{id}/phase-advance"
      - "POST /artists"
      - "POST /entries/{id}/fee-waiver"
      - "POST /sponsors"
    shared_operations:
      - "PATCH /artists/{id} (with Artist)"
      - "POST /entries/{id}/withdraw (with Artist)"
      - "POST /wall-segments (with Registrar)"
      - "GET reads on exhibitions, entries, artworks, awards, sales, sponsors, wall segments, jury rounds"
      - "POST /_clock/set_current_utc"
  - name: JuryChair
    description: "Convenes the jury: invites jurors, books sessions, drives rounds, runs the acceptance list, proposes and confirms awards."
    identity: opaque
    exclusive_operations:
      - "POST /jurors"
      - "POST /jury-rounds"
      - "POST /jury-rounds/{id}/status"
      - "POST /jury-rounds/{id}/assignments"
      - "POST /juror-assignments/{id}/cancel"
      - "POST /exhibitions/{id}/acceptance-list"
      - "POST /artworks/{id}/promotion"
      - "POST /awards"
      - "POST /awards/{id}/confirm"
      - "POST /awards/{id}/rescind"
    shared_operations:
      - "POST /jurors/{id}/confirm (with Juror)"
      - "POST /jurors/{id}/resign (with Juror)"
      - "POST /jurors/{id}/conflict-declarations (with Juror)"
      - "GET reads on jury rounds, assignments, scores, artworks, entries, awards, sponsors"
      - "POST /_clock/set_current_utc"
    note: "Segregation of duties: the X-User-ID that proposed an award may not confirm it."
  - name: Juror
    description: "Scores artworks in blind and deliberation rounds and declares conflicts of interest."
    identity: "entity_backed:Juror"
    exclusive_operations:
      - "POST /jury-rounds/{id}/scores"
    shared_operations:
      - "POST /jurors/{id}/confirm (with JuryChair, own record only)"
      - "POST /jurors/{id}/resign (with JuryChair, own record only)"
      - "POST /jurors/{id}/conflict-declarations (with JuryChair, own record only)"
      - "GET reads on artworks (identity-masked during an open blind round), images, scores, assignments, jury rounds, exhibitions"
      - "POST /_clock/set_current_utc"
  - name: Artist
    description: "Submits entries and artworks with images, pays entry fees, withdraws entries."
    identity: "entity_backed:Artist"
    exclusive_operations:
      - "POST /entries"
      - "POST /entries/{id}/artworks"
      - "POST /entries/{id}/submit"
      - "POST /entries/{id}/fee-payment"
      - "POST /artworks/{id}/images"
    shared_operations:
      - "PATCH /artists/{id} (with CallManager, own record only)"
      - "POST /entries/{id}/withdraw (with CallManager, own entries only)"
      - "GET reads on own entries, artworks, images, condition reports, sales, exhibitions"
      - "POST /_clock/set_current_utc"
  - name: Registrar
    description: "Owns physical logistics: intake and deinstall condition reports, wall planning, installation, deinstallation, returns and the unclaimed sweep."
    identity: opaque
    exclusive_operations:
      - "POST /artworks/{id}/condition-reports"
      - "POST /artworks/{id}/installation-plan"
      - "POST /artworks/{id}/install"
      - "POST /artworks/{id}/deinstall"
      - "POST /artworks/{id}/return-shipment"
      - "POST /artworks/{id}/return-completion"
      - "POST /exhibitions/{id}/unclaimed-sweep"
    shared_operations:
      - "POST /wall-segments (with CallManager)"
      - "GET reads on artworks, condition reports, wall segments, exhibitions"
      - "POST /_clock/set_current_utc"
  - name: FinanceOfficer
    description: "Owns money: sales, invoices, buyer payments, artist payouts, voids, honorarium remittance and settlement phases."
    identity: opaque
    exclusive_operations:
      - "POST /sales"
      - "POST /sales/{id}/invoice"
      - "POST /sales/{id}/payment"
      - "POST /sales/{id}/payout"
      - "POST /sales/{id}/void"
      - "POST /jurors/{id}/honorarium-payment"
      - "POST /exhibitions/{id}/settlement"
    shared_operations:
      - "GET reads on sales, awards, sponsors, artists, jurors, assignments, exhibitions, condition reports"
      - "POST /_clock/set_current_utc"
    note: "Segregation of duties: the X-User-ID that recorded a sale may not release its artist payout."
