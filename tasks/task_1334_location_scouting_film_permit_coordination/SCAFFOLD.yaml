    code: 200
    input: []
    output: OwnerAgreement
    side_effects: ["status := EXECUTED", "agreed_day_rate_cents := proposed_day_rate_cents", "Location.status := AGREEMENT_EXECUTED", "DepositAccount.required_amount_cents recomputed for any account on this location"]
  - method: POST
    path: "/productions/{id}/owner-agreements/{rid}/walk-away"
    description: "Collapse the negotiation"
    roles: [LocationManager, OwnerRep]
    code: 200
    input: []
    output: OwnerAgreement
    side_effects: ["status := COLLAPSED"]

  # --- Permit applications ---
  - method: POST
    path: "/productions/{id}/permit-applications"
    description: "Create a permit application (optionally an amendment superseding another via amendment_of_id). OCC: expected_production_version required."
    roles: [LocationManager]
    code: 201
    input: [location_id, shoot_start_date, shoot_end_date, closed_lanes, shoot_hours_per_day, expected_production_version, "amendment_of_id?"]
    output: PermitApplication
    side_effects:
      - "status := DRAFT; jurisdiction pinned from Location"
      - "increments Production.version by 1"
      - "If amendment_of_id set: referenced application -> SUPERSEDED; its REQUESTED/APPROVED StreetClosures -> CANCELLED"
  - method: GET
    path: "/productions/{id}/permit-applications"
    description: "List permit applications (filterable by location_id, jurisdiction_id, status)"
    roles: [FilmOffice, LocationManager, OwnerRep]
    code: 200
    input: ["limit?", "offset?", "location_id?", "jurisdiction_id?", "status?", "amendment_of_id?"]
    output: PermitApplication[]
    side_effects: []
  - method: GET
    path: "/productions/{id}/permit-applications/{rid}"
    description: "Get a permit application"
    roles: [FilmOffice, LocationManager, OwnerRep]
    code: 200
    input: []
    output: PermitApplication
    side_effects: []
  - method: POST
    path: "/productions/{id}/permit-applications/{rid}/submit"
    description: "Submit an application; computes lead time and fee"
    roles: [LocationManager]
    code: 200
    input: []
    output: PermitApplication
    side_effects: ["status := SUBMITTED", "submitted_at stamped", "business_days_available, lead_time_satisfied, fee_cents computed"]
  - method: POST
    path: "/productions/{id}/permit-applications/{rid}/start-review"
    description: "Film office opens review (lead-time gate)"
    roles: [FilmOffice]
    code: 200
    input: []
    output: PermitApplication
    side_effects: ["status := UNDER_REVIEW"]
  - method: POST
    path: "/productions/{id}/permit-applications/{rid}/decide"
    description: "Film office decides: ISSUE | APPROVE_WITH_CONDITIONS | DENY"
    roles: [FilmOffice]
    code: 200
    input: [decision]
    output: PermitApplication
    side_effects: ["status per decision; ISSUE from CONDITIONALLY_APPROVED additionally requires ACKED notification"]
  - method: POST
    path: "/productions/{id}/permit-applications/{rid}/withdraw"
    description: "Withdraw a DRAFT or SUBMITTED application"
    roles: [LocationManager]
    code: 200
    input: []
    output: PermitApplication
    side_effects: ["status := WITHDRAWN"]

  # --- Street closures ---
  - method: POST
    path: "/productions/{id}/street-closures"
    description: "Request a street closure against a permit"
    roles: [LocationManager]
    code: 201
    input: [permit_application_id, street_segment, closure_start, closure_end]
    output: StreetClosure
    side_effects: ["status := REQUESTED"]
  - method: GET
    path: "/productions/{id}/street-closures"
    description: "List street closures (filterable by permit_application_id, street_segment, status)"
    roles: [FilmOffice, LocationManager, OwnerRep]
    code: 200
    input: ["limit?", "offset?", "permit_application_id?", "street_segment?", "status?"]
    output: StreetClosure[]
    side_effects: []
  - method: POST
    path: "/productions/{id}/street-closures/{rid}/approve"
    description: "Approve a closure (overlap + permit gates)"
    roles: [FilmOffice]
    code: 200
    input: []
    output: StreetClosure
    side_effects: ["status := APPROVED"]
  - method: POST
    path: "/productions/{id}/street-closures/{rid}/cancel"
    description: "Cancel a REQUESTED or APPROVED closure"
    roles: [LocationManager]
    code: 200
    input: []
    output: StreetClosure
    side_effects: ["status := CANCELLED"]

  # --- Notifications ---
  - method: POST
    path: "/productions/{id}/notifications"
    description: "Record a posted neighborhood notification"
    roles: [LocationManager]
    code: 201
    input: [permit_application_id, households_reached, radius_ft_used]
    output: NotificationRecord
    side_effects: ["posted_at stamped", "calendar_days_before_shoot + notification_adequate computed", "status := POSTED or DEFICIENT"]
  - method: GET
    path: "/productions/{id}/notifications"
    description: "List notifications (filterable by permit_application_id, status)"
    roles: [FilmOffice, LocationManager, OwnerRep]
    code: 200
    input: ["limit?", "offset?", "permit_application_id?", "status?"]
    output: NotificationRecord[]
    side_effects: []
  - method: POST
    path: "/productions/{id}/notifications/{rid}/acknowledge"
    description: "Film office acknowledges an adequate notification"
    roles: [FilmOffice]
    code: 200
    input: []
    output: NotificationRecord
    side_effects: ["status := ACKED"]

  # --- Insurance ---
  - method: POST
    path: "/productions/{id}/insurance-certificates"
    description: "Present an insurance certificate to a jurisdiction"
    roles: [LocationManager]
    code: 201
    input: [jurisdiction_id, insurer_name, umbrella_limit_cents, indemnity_clause_ref, effective_date, expiry_date]
    output: InsuranceCertificate
    side_effects: ["status := PRESENTED"]
  - method: GET
    path: "/productions/{id}/insurance-certificates"
    description: "List certificates (filterable by jurisdiction_id, status)"
    roles: [FilmOffice, LocationManager, OwnerRep]
    code: 200
    input: ["limit?", "offset?", "jurisdiction_id?", "status?"]
    output: InsuranceCertificate[]
    side_effects: []
  - method: POST
    path: "/productions/{id}/insurance-certificates/{rid}/verify"
    description: "Verify a certificate (limit, indemnity, window checks)"
    roles: [FilmOffice]
    code: 200
    input: []
    output: InsuranceCertificate
    side_effects: ["status := VERIFIED"]
  - method: POST
    path: "/productions/{id}/insurance-certificates/{rid}/reject"
    description: "Reject a certificate"
    roles: [FilmOffice]
    code: 200
    input: []
    output: InsuranceCertificate
    side_effects: ["status := REJECTED"]

  # --- Deposits ---
  - method: POST
    path: "/productions/{id}/deposit-accounts"
    description: "Open a deposit account for a location (unique per production+location)"
    roles: [LocationManager]
    code: 201
    input: [location_id]
    output: DepositAccount
    side_effects: ["status := OPEN", "required_amount_cents computed (uses agreement if EXECUTED, else deposit_floor_cents only)"]
  - method: GET
    path: "/productions/{id}/deposit-accounts"
    description: "List deposit accounts (filterable by location_id, status)"
    roles: [FilmOffice, LocationManager, OwnerRep]
    code: 200
    input: ["limit?", "offset?", "location_id?", "status?"]
    output: DepositAccount[]
    side_effects: []
  - method: GET
    path: "/productions/{id}/deposit-accounts/{rid}"
    description: "Get a deposit account"
    roles: [FilmOffice, LocationManager, OwnerRep]
    code: 200
    input: []
    output: DepositAccount
    side_effects: []
  - method: POST
    path: "/productions/{id}/deposit-accounts/{rid}/deposit"
    description: "Pay funds into the deposit account"
    roles: [LocationManager]
    code: 200
    input: [amount_cents]
    output: DepositAccount
    side_effects: ["held_amount_cents += amount_cents", "status := FUNDED when held >= required"]
  - method: POST
    path: "/productions/{id}/deposit-accounts/{rid}/settle"
    description: "Film office settles the account: award a claim, release the remainder, close"
    roles: [FilmOffice]
    code: 200
    input: [awarded_claim_cents]
    output: DepositAccount
    side_effects: ["waterfall per calc deposit_waterfall", "status := CLOSED", "POST WalkthroughReport -> FINAL"]

  # --- Walkthroughs ---
  - method: POST
    path: "/productions/{id}/walkthrough-reports"
    description: "Create a PRE or POST walkthrough report"
    roles: [LocationManager]
    code: 201
    input: [location_id, kind, "damage_item_count?", "damage_claim_cents?", "signed_by_owner?", "signed_by_manager?"]
    output: WalkthroughReport
    side_effects: ["status := DRAFT"]
  - method: GET
    path: "/productions/{id}/walkthrough-reports"
    description: "List walkthrough reports (filterable by location_id, kind, status)"
    roles: [FilmOffice, LocationManager, OwnerRep]
    code: 200
    input: ["limit?", "offset?", "location_id?", "kind?", "status?"]
    output: WalkthroughReport[]
    side_effects: []
  - method: POST
    path: "/productions/{id}/walkthrough-reports/{rid}/sign"
    description: "Sign a report (both signature flags must already be true)"
    roles: [LocationManager]
    code: 200
    input: []
    output: WalkthroughReport
    side_effects: ["status := SIGNED", "POST report: DepositAccount -> SETTLING"]
  - method: POST
    path: "/productions/{id}/walkthrough-reports/{rid}/dispute"
    description: "Owner disputes a POST report"
    roles: [OwnerRep]
    code: 200
    input: []
    output: WalkthroughReport
    side_effects: ["status := DISPUTED", "DepositAccount -> SETTLING"]

  # --- Monitors ---
  - method: POST
    path: "/productions/{id}/monitor-assignments"
    description: "Assign a monitor/officer to a shoot day"
    roles: [LocationManager]
    code: 201
    input: [shoot_day_id, monitor_type, officer_badge, hours_booked]
    output: MonitorAssignment
    side_effects: ["status := ASSIGNED"]
  - method: GET
    path: "/productions/{id}/monitor-assignments"
    description: "List monitor assignments (filterable by shoot_day_id, status, monitor_type)"
    roles: [FilmOffice, LocationManager, OwnerRep]
    code: 200
    input: ["limit?", "offset?", "shoot_day_id?", "status?", "monitor_type?"]
    output: MonitorAssignment[]
    side_effects: []
  - method: POST
    path: "/productions/{id}/monitor-assignments/{rid}/confirm"
    description: "Film office confirms an assignment"
    roles: [FilmOffice]
    code: 200
    input: []
    output: MonitorAssignment
    side_effects: ["status := CONFIRMED", "ShootDay.monitors_confirmed recomputed"]
  - method: POST
    path: "/productions/{id}/monitor-assignments/{rid}/release"
    description: "Release an assignment"
    roles: [FilmOffice]
    code: 200
    input: []
    output: MonitorAssignment
    side_effects: ["status := RELEASED", "ShootDay.monitors_confirmed recomputed"]
  - method: POST
    path: "/productions/{id}/monitor-assignments/{rid}/mark-no-show"
    description: "Record a no-show on a confirmed assignment"
    roles: [FilmOffice]
    code: 200
    input: []
    output: MonitorAssignment
    side_effects: ["status := NO_SHOW", "ShootDay.monitors_confirmed recomputed (NO_SHOW excluded)", "ShootDay.compliance_status recomputed (may force VIOLATION)"]
  - method: POST
    path: "/productions/{id}/monitor-assignments/{rid}/check-in"
    description: "Record officer check-in on the shoot day (requires the day IN_PROGRESS)"
    roles: [FilmOffice]
    code: 200
    input: []
    output: MonitorAssignment
    side_effects: ["checked_in := true"]

  # --- Shoot days ---
  - method: POST
    path: "/productions/{id}/shoot-days"
    description: "Plan a shoot day under a non-terminal permit (ISSUED gate applies at mark-ready, not at create)"
    roles: [LocationManager]
    code: 201
    input: [permit_application_id, location_id, shoot_date, planned_hours]
    output: ShootDay
    side_effects: ["status := PLANNED", "monitors_required computed"]
  - method: GET
    path: "/productions/{id}/shoot-days"
    description: "List shoot days (filterable by permit_application_id, location_id, status)"
    roles: [FilmOffice, LocationManager, OwnerRep]
    code: 200
    input: ["limit?", "offset?", "permit_application_id?", "location_id?", "status?"]
    output: ShootDay[]
    side_effects: []
  - method: GET
    path: "/productions/{id}/shoot-days/{rid}"
    description: "Get a shoot day"
    roles: [FilmOffice, LocationManager, OwnerRep]
    code: 200
    input: []
    output: ShootDay
    side_effects: []
  - method: POST
    path: "/productions/{id}/shoot-days/{rid}/mark-ready"
    description: "Gate check + transition to READY. OCC: expected_shoot_day_version required."
    roles: [LocationManager]
    code: 200
    input: [expected_shoot_day_version]
    output: ShootDay
    side_effects: ["status := READY", "increments ShootDay.version by 1", "Production.status := ACTIVE if PREP"]
  - method: POST
    path: "/productions/{id}/shoot-days/{rid}/complete"
    description: "Complete an IN_PROGRESS day with actual hours"
    roles: [LocationManager]
    code: 200
    input: [actual_hours]
    output: ShootDay
    side_effects: ["status := COMPLETED", "overtime_minutes computed", "compliance_status recomputed", "unchecked CONFIRMED monitors -> NO_SHOW"]
  - method: POST
    path: "/productions/{id}/shoot-days/{rid}/cancel"
    description: "Cancel a PLANNED or READY day"
    roles: [LocationManager]
    code: 200
    input: []
    output: ShootDay
    side_effects: ["status := CANCELLED", "assignments RELEASED"]
  - method: POST
    path: "/productions/{id}/shoot-days/{rid}/shut-down"
    description: "Film office shuts down an IN_PROGRESS day"
    roles: [FilmOffice]
    code: 200
    input: []
    output: ShootDay
    side_effects: ["status := SHUT_DOWN", "day's APPROVED closures CANCELLED"]

  # --- Complaints ---
  - method: POST
    path: "/productions/{id}/complaints"
    description: "File a complaint against a shoot day"
    roles: [FilmOffice, LocationManager, OwnerRep]
    code: 201
    input: [shoot_day_id, category, severity]
    output: Complaint
    side_effects: ["filed_at stamped", "response_due_at := filed_at + 24h", "status := OPEN", "ShootDay.compliance_status recomputed per calc shoot_day_compliance", "If severity == CRITICAL and day IN_PROGRESS: day -> SHUT_DOWN cascade"]
  - method: GET
    path: "/productions/{id}/complaints"
    description: "List complaints (filterable by shoot_day_id, status, severity)"
    roles: [FilmOffice, LocationManager, OwnerRep]
    code: 200
    input: ["limit?", "offset?", "shoot_day_id?", "status?", "severity?"]
    output: Complaint[]
    side_effects: []
  - method: POST
    path: "/productions/{id}/complaints/{rid}/acknowledge"
    description: "Location manager acknowledges a complaint"
    roles: [LocationManager]
    code: 200
    input: []
    output: Complaint
    side_effects: ["status := ACKNOWLEDGED"]
  - method: POST
    path: "/productions/{id}/complaints/{rid}/resolve"
    description: "Resolve a complaint (LocationManager from ACKNOWLEDGED; FilmOffice from ESCALATED)"
    roles: [LocationManager, FilmOffice]
    code: 200
    input: [resolution_note]
    output: Complaint
    side_effects: ["status := RESOLVED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id missing or outside production scope" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed payload, missing required field, invalid enum/date" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource state does not permit the requested transition" }
  - { id: ERR_PACKAGE_INCOMPLETE, http: 422, condition: "Scout package submitted with photo_count < 6" }
  - { id: ERR_SCOUT_NOT_ACCEPTED, http: 422, condition: "Owner agreement PROPOSE without an ACCEPTED scout package for the location" }
  - { id: ERR_NEGOTIATION_EXHAUSTED, http: 422, condition: "Propose/counter would exceed max_rounds" }
  - { id: ERR_AGREEMENT_NOT_EXECUTED, http: 422, condition: "Permit submit without an EXECUTED agreement covering the window" }
  - { id: ERR_JURISDICTION_SUSPENDED, http: 422, condition: "Permit submit into a SUSPENDED jurisdiction" }
  - { id: ERR_LEAD_TIME_SHORT, http: 422, condition: "business_days_available < jurisdiction.lead_time_business_days at start-review" }
  - { id: ERR_NOTIFICATION_DEFICIENT, http: 422, condition: "Notification inadequate (calendar days or radius short) at acknowledge or conditional-issue" }
  - { id: ERR_INSURANCE_INSUFFICIENT, http: 422, condition: "Certificate limit below jurisdiction minimum, window not covering, or no VERIFIED certificate when required" }
  - { id: ERR_INDEMNITY_MISSING, http: 422, condition: "Certificate verification with empty indemnity_clause_ref" }
  - { id: ERR_PERMIT_NOT_ISSUED, http: 422, condition: "ShootDay create / mark-ready or closure approve against a non-ISSUED permit" }
  - { id: ERR_CLOSURE_OVERLAP, http: 409, condition: "Half-open interval collision with an APPROVED/ACTIVE closure on the same street segment" }
  - { id: ERR_BOOKING_BUFFER_CONFLICT, http: 409, condition: "New booking's buffered closed interval touches an existing CONFIRMED booking's closed interval at the location" }
  - { id: ERR_HOURS_EXCEED_LOCATION_CAP, http: 422, condition: "Planned or actual hours exceed location.max_shoot_hours_per_day" }
  - { id: ERR_MONITOR_SHORTFALL, http: 422, condition: "Confirmed monitors below required, or no POLICE monitor when lane threshold met" }
  - { id: ERR_DEPOSIT_NOT_FUNDED, http: 422, condition: "mark-ready with held_amount_cents < required_amount_cents" }
  - { id: ERR_CLAIM_EXCEEDS_DEPOSIT, http: 422, condition: "Settle award exceeds unreleased balance" }
  - { id: ERR_WALKTHROUGH_DISPUTED, http: 422, condition: "Settle attempted while the POST walkthrough is DISPUTED" }
  - { id: ERR_SIGNATURE_MISSING, http: 422, condition: "Sign attempted without both owner and manager signature flags" }
  - { id: ERR_PRE_WALKTHROUGH_MISSING, http: 422, condition: "mark-ready without a SIGNED PRE walkthrough for the location" }
  - { id: ERR_DUPLICATE_PRE_WALKTHROUGH, http: 422, condition: "Second SIGNED PRE walkthrough for the same location" }
  - { id: ERR_DAY_IN_PROGRESS, http: 409, condition: "Monitor release attempted while the shoot day is IN_PROGRESS" }
  - { id: ERR_CLOSURE_MISSING, http: 422, condition: "mark-ready for a permit with closed_lanes > 0 without APPROVED closures covering the day" }
  - { id: ERR_APPLICATIONS_OPEN, http: 409, condition: "Wrap attempted with non-terminal permit applications" }
  - { id: ERR_DEPOSITS_OPEN, http: 409, condition: "Wrap attempted with non-CLOSED deposit accounts" }
  - { id: ERR_COMPLAINTS_OPEN, http: 409, condition: "Wrap attempted with OPEN or ACKNOWLEDGED complaints" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: LocationManager
    description: "Production-side location manager: scouts, negotiates, applies for permits, funds deposits, manages shoot days"
    identity: "opaque"
    exclusive_operations:
      - "POST /productions — create production"
      - "POST /owners — register owner"
      - "POST /locations — register location"
      - "POST /productions/{id}/location-bookings, /release"
      - "POST /productions/{id}/scout-packages — create scout package"
      - "POST /productions/{id}/scout-packages/{id}/submit"
      - "POST /productions/{id}/owner-agreements — open negotiation"
      - "POST /productions/{id}/owner-agreements/{id}/propose"
      - "POST /productions/{id}/permit-applications — create/amend application (OCC)"
      - "POST /productions/{id}/permit-applications/{id}/submit, /withdraw"
      - "POST /productions/{id}/street-closures — request closure"
      - "POST /productions/{id}/street-closures/{id}/cancel"
      - "POST /productions/{id}/notifications — record posting"
      - "POST /productions/{id}/insurance-certificates — present certificate"
      - "POST /productions/{id}/deposit-accounts, /deposit"
      - "POST /productions/{id}/walkthrough-reports, /sign"
      - "POST /productions/{id}/monitor-assignments — assign monitor"
      - "POST /productions/{id}/shoot-days, /mark-ready (OCC), /complete, /cancel"
      - "POST /productions/{id}/complaints/{id}/acknowledge"
      - "POST /productions/{id}/wrap, /cancel"
    shared_operations:
      - "GET endpoints — read access shared with FilmOffice and OwnerRep"
      - "POST /productions/{id}/owner-agreements/{id}/accept — accept a COUNTERED rate"
      - "POST /productions/{id}/owner-agreements/{id}/walk-away"
      - "POST /productions/{id}/complaints — file a complaint"
      - "POST /productions/{id}/complaints/{id}/resolve — from ACKNOWLEDGED only"

  - name: FilmOffice
    description: "Jurisdiction film office staff: configures jurisdictions, reviews packages and permits, verifies insurance, confirms monitors, settles deposits, sweeps ops"
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc, /_ops/sweep"
      - "POST /jurisdictions, /jurisdictions/{id}/suspend"
      - "POST /productions/{id}/scout-packages/{id}/review"
      - "POST /productions/{id}/permit-applications/{id}/start-review, /decide"
      - "POST /productions/{id}/street-closures/{id}/approve"
      - "POST /productions/{id}/notifications/{id}/acknowledge"
      - "POST /productions/{id}/insurance-certificates/{id}/verify, /reject"
      - "POST /productions/{id}/deposit-accounts/{id}/settle"
      - "POST /productions/{id}/monitor-assignments/{id}/confirm, /release, /mark-no-show, /check-in"
      - "POST /productions/{id}/shoot-days/{id}/shut-down"
    shared_operations:
      - "GET endpoints"
      - "POST /productions/{id}/complaints — file a complaint"
      - "POST /productions/{id}/complaints/{id}/resolve — from ESCALATED only"

  - name: OwnerRep
    description: "Location owner's representative: counters proposals, accepts agreements, disputes walkthroughs, files complaints"
    identity: "entity_backed:LocationOwner"
    exclusive_operations:
      - "POST /productions/{id}/owner-agreements/{id}/counter"
      - "POST /productions/{id}/walkthrough-reports/{id}/dispute"
    shared_operations:
      - "GET endpoints"
      - "POST /productions/{id}/owner-agreements/{id}/accept — accept a PROPOSED rate"
      - "POST /productions/{id}/owner-agreements/{id}/walk-away"
      - "POST /productions/{id}/complaints — file a complaint"
