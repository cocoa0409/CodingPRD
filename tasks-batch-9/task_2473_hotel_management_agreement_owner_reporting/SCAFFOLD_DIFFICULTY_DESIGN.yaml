      - name: brand_dispute_rescission_reopens_negotiation_cycle_then_waives
        grounds:
          - state_machines.BrandStandardDispute.RESOLVED_OWNER_FUNDS_to_OWNER_COUNTERED
          - state_machines.BrandStandardDispute.OWNER_COUNTERED_to_MANAGER_RESPONDED
          - state_machines.BrandStandardDispute.OWNER_COUNTERED_to_RESOLVED_WAIVED
