          - validations[priority=24]
          - errors.ERR_REVIEW_ALREADY_RECORDED
        distinguishing_aspect: "A FAILED first review short-circuits the fork: the application jumps SUBMITTED -> DECLINED (terminal) and premium_cents is reset to null, so the second review branch can never be recorded — the cascade is conditional on the outcome value, not on the review type."
        test_recipe:
          setup: ["A production in CLEARANCE with no assets, a PINNED chart, and one SUBMITTED EOApplication (coverage 4000000, retention 100000, so premium_cents is the 25000 floor)."]
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "Declined Cover", delivery_deadline_date: "2027-06-30" }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/state"
              payload: { to_status: "CLEARANCE" }
              as: ProductionAdmin
            - call: "GET /productions/${prod_id}"
              payload: {}
              as: ClearanceSupervisor
              captures: { pv: $.data.version }
            - call: "POST /productions/${prod_id}/clearance-charts"
              payload: { chart_label: "v1", expected_production_version: "${pv}" }
              as: ClearanceSupervisor
              captures: { chart_id: $.data.id }
            - call: "POST /productions/${prod_id}/eo-applications"
              payload: { clearance_chart_id: "${chart_id}", coverage_limit_cents: 4000000, retention_cents: 100000 }
              as: ProductionAdmin
              captures: { eo_id: $.data.id }
            - call: "POST /eo-applications/${eo_id}/state"
              payload: { to_status: "SUBMITTED" }
              as: ProductionAdmin
              captures: { premium: $.data.premium_cents }
          trigger:
            - call: "POST /eo-applications/${eo_id}/reviews"
              payload: { review_type: "LEGAL", outcome: "FAILED", notes: "Unresolved chain of title" }
              as: LegalCounsel
              as_user_id: "counsel-beta"
            - call: "POST /eo-applications/${eo_id}/reviews"
              payload: { review_type: "UNDERWRITING", outcome: "PASSED" }
              as: ClearanceSupervisor
              as_user_id: "supervisor-one"
          assert:
            - "premium_cents was 25000 at submission — base 50000 minus the 30000 retention credit is 20000, below MIN_PREMIUM_CENTS, and the chart has no rateable rows"
            - "after the FAILED legal review: EOApplication.${eo_id}.status == DECLINED, legal_review_status == FAILED, legal_reviewer_user_id == counsel-beta"
            - "premium_cents is null — the DECLINED side effect cleared it"
            - "the second review call returns 409 (the application is terminal: DECLINED has no outgoing transition), underwriting_review_status is still PENDING and underwriting_reviewer_user_id is still null"

