  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: supersede_of_an_open_batch_rejects_a_stale_expected_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[payout-batch-period-supersede]
          - errors.ERR_STALE_VERSION
          - endpoints.POST_/network/payout-batches/{id}/supersede
        distinguishing_aspect: "The OCC field captures the version observed before the batch was rewritten, so a supersede carrying the pre-write version is rejected with 412 ERR_STALE_VERSION while one carrying the freshly observed version succeeds."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-09T00:00:00Z; one open batch whose version was read and then advanced by a subsequent write."
          setup_api_calls:
            - *c_clock
            - call: "POST /network/_clock/set_current_utc"
              payload: { current_utc: "2026-06-09T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /network/payout-batches"
              payload: { period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-08T00:00:00Z", schedule: "WEEKLY" }
              as: OpsAdmin
              captures: { batch_id: $.data.id, batch_v1: $.data.version }
          trigger:
            - call: "POST /network/payout-batches/${batch_id}/supersede"
              payload: { expected_open_batch_version: "${batch_v1} - 1" }
              as: OpsAdmin
              captures: { error_id: $.data.error_id }
            - call: "GET /network/payout-batches/${batch_id}"
              payload: {}
              as: OpsAdmin
              captures: { observed_v: $.data.version }
            - call: "POST /network/payout-batches/${batch_id}/supersede"
              payload: { expected_open_batch_version: "${observed_v}" }
              as: OpsAdmin
              captures: { final_status: $.data.status }
          assert:
            - "the stale supersede returns status 412 and error_id == ERR_STALE_VERSION"
            - "PayoutBatch.${batch_id}.status == OPEN after the stale rejection"
            - "the fresh supersede succeeds and ${final_status} == SKIPPED"
            - "PayoutBatch.${batch_id}.version advanced by one across the successful supersede, which is what made the earlier literal stale"

      - name: adding_a_note_against_a_stale_session_version_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[session-note-supersede]
          - errors.ERR_STALE_VERSION
          - endpoints.POST_/network/sessions/{id}/notes
        distinguishing_aspect: "A note added with the session version observed before the previous note bumped it is rejected with 412 ERR_STALE_VERSION, and the note_version counter is what the second writer's stale view missed."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z; a scheduled session with no notes, and the session version read once."
          setup_api_calls:
            - *c_clock
            - *c_payer
            - *c_rate
            - *c_clinician
            - *c_license
            - call: "POST /network/clinicians/${clinician_id}/licenses/${license_id}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /network/clinicians/${clinician_id}/malpractice-policies"
              payload: { carrier_name: "TherapyGuard Mutual", coverage_cents: 500000000, effective_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z", tail_coverage: false }
              as: OpsAdmin
            - *c_enroll
            - call: "POST /network/payer-enrollments/${enrollment_id}/activate"
              payload: {}
              as: OpsAdmin
            - *c_patient
            - *c_verification
            - *c_session
            - call: "POST /network/sessions/${session_id}/schedule"
              payload: {}
              as: Clinician
              as_user_id: "${clinician_id}"
              captures: { session_v1: $.data.version }
            - call: "POST /network/sessions/${session_id}/notes"
              payload: { diagnosis_code: "F41.1", duration_minutes: 60, cpt_code: "90837", narrative: "First note, which advances the session version.", expected_session_version: "${session_v1}" }
              as: Clinician
              as_user_id: "${clinician_id}"
              captures: { note_first: $.data.id }
          trigger:
            - call: "POST /network/sessions/${session_id}/notes"
              payload: { diagnosis_code: "F41.1", duration_minutes: 60, cpt_code: "90837", narrative: "Second note carrying the superseded session version.", expected_session_version: "${session_v1}" }
              as: Clinician
              as_user_id: "${clinician_id}"
              captures: { error_id: $.data.error_id }
            - call: "GET /network/sessions/${session_id}"
              payload: {}
              as: OpsAdmin
              captures: { observed_v: $.data.version }
            - call: "POST /network/sessions/${session_id}/notes"
              payload: { diagnosis_code: "F41.1", duration_minutes: 60, cpt_code: "90837", narrative: "Second note replayed against the freshly observed version.", expected_session_version: "${observed_v}" }
              as: Clinician
              as_user_id: "${clinician_id}"
              captures: { note_second: $.data.id }
          assert:
            - "the stale note returns status 412 and error_id == ERR_STALE_VERSION"
            - "GET /network/sessions/${session_id}/notes returns exactly 1 row after the stale rejection"
            - "the replay with the observed version succeeds and SessionNote.${note_second}.note_version == 2"
            - "SessionNote.${note_first}.status == LOCKED once the newer note exists, so the supersede is a real state change rather than a duplicate insert"

      - name: reassigning_a_continuity_successor_against_a_stale_plan_version_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[continuity-successor-swap]
          - errors.ERR_STALE_VERSION
          - endpoints.POST_/network/continuity-plans/{id}/successor
        distinguishing_aspect: "The plan version read before the first successor assignment is stale by the time a second assignment is attempted, so the second is rejected with 412 ERR_STALE_VERSION and the first successor survives."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z; one departing clinician, one patient, two candidate successors, and a plan read once at creation."
          setup_api_calls:
            - *c_clock
            - *c_payer
            - *c_clinician
            - call: "POST /network/clinicians"
              payload: { full_name: "Nadia Okonkwo", license_type: "LMFT", primary_state: "CA", specialty_tags: ["ANXIETY"], weekly_caseload_target: 8, availability_blocks: [{ weekday: 4, start_minute: 480, end_minute: 1080 }] }
              as: OpsAdmin
              captures: { departing_id: $.data.id }
            - call: "POST /network/clinicians"
              payload: { full_name: "Zara Whitfield", license_type: "LCSW", primary_state: "CA", specialty_tags: ["ANXIETY"], weekly_caseload_target: 6, availability_blocks: [{ weekday: 5, start_minute: 480, end_minute: 1080 }] }
              as: OpsAdmin
              captures: { second_successor: $.data.id }
            - *c_patient
            - call: "POST /network/continuity-plans"
              payload: { clinician_id: "${departing_id}", patient_id: "${patient_id}", reason: "OFFBOARDING", successor_clinician_id: "${clinician_id}" }
              as: OpsAdmin
              captures: { plan_id: $.data.id, plan_v1: $.data.version }
          trigger:
            - call: "POST /network/continuity-plans/${plan_id}/successor"
              payload: { successor_clinician_id: "${second_successor}", expected_plan_version: "${plan_v1}" }
              as: OpsAdmin
              captures: { after_first: $.data.successor_clinician_id, plan_v2: $.data.version }
            - call: "POST /network/continuity-plans/${plan_id}/successor"
              payload: { successor_clinician_id: "${clinician_id}", expected_plan_version: "${plan_v1}" }
              as: OpsAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the first assignment succeeds with ${after_first} == ${second_successor}"
            - "the second assignment carrying the same stale version returns status 412 and error_id == ERR_STALE_VERSION"
            - "ContinuityPlan.${plan_id}.successor_clinician_id is still ${second_successor} after the rejection"
            - "PayoutBatch-style literal reuse is the failure mode: the reused ${plan_v1} went stale the moment the first assignment bumped the plan to ${plan_v2}"

      - name: patient_status_patch_is_visible_in_the_same_response
        claim_type: consistency_model_immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.PATCH_/network/payers/{id}
          - calculations.clinician_billing_posture_derived
        distinguishing_aspect: "The scaffold declares an immediate consistency model, so the payer status returned by the patch response already reflects the new value and a follow-up read agrees with it, with no lag and no reconciliation step."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z; one payer and one clinician with an effective enrollment."
          setup_api_calls:
            - *c_clock
            - *c_payer
            - *c_clinician
            - *c_license
            - call: "POST /network/clinicians/${clinician_id}/licenses/${license_id}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /network/clinicians/${clinician_id}/malpractice-policies"
