            - "K1 is then ISSUED, which allocates 95066500 (gross 95000000 plus base commission 66500 at 7 bps for 1 quarter of a 57-day validity), pushes allocated_cents over the 95000000 restrict threshold, suspends the facility and parks K2 and K3 at ON_HOLD."
