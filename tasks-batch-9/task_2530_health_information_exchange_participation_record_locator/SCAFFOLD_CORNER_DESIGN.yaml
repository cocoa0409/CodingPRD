      - name: participation_fee_variant_divergence_on_one_billing_period
        claim_type: Variant Divergence
        grounds:
          - calculations.participation_fee.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / participation_fee_provisional_vs_reconciled_diverge_on_same_billing_period
          rationale: "Both variants, their delta and the reconciliation basis are asserted as literals there."
      - name: match_score_variant_selection_by_config_mode
        claim_type: Variant Selection
        grounds:
          - calculations.match_score.variants
          - entities.MatchThresholdConfig.fields.score_variant_mode
        excluded_because:
          difficulty_instance: dual_variant_calc / match_score_deterministic_vs_probabilistic_diverge_on_same_demographic_pair
          rationale: "Variant selection by score_variant_mode and the divergent routing it produces are asserted there."
      - name: cluster_membership_recount_correct_result_after_merge
        claim_type: Correct Result
        grounds:
          - calculations.cluster_membership_recount
        excluded_because:
          difficulty_instance: compensating_invariant / unlink_restores_cluster_membership_conservation_after_a_confirmed_merge
          rationale: "member_record_count, participant_count and the conserved total are asserted before, during and after the merge there."
      - name: consent_disclosure_decision_correct_result_for_a_permitted_treatment_query
        claim_type: Correct Result
        grounds:
          - calculations.consent_disclosure_decision
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / locator_query_blocked_until_the_ccda_feed_leaves_provisioning
          rationale: "The successful arm there asserts consent_decision PERMITTED, top_candidate_score 1.0000, disclosed_record_count 1 and the single DISCLOSED audit row."
      - name: cluster_membership_recount_running_total_survives_add_and_reversal
        claim_type: aggregation
        grounds:
          - calculations.cluster_membership_recount
        excluded_because:
          difficulty_instance: compensating_invariant / unlink_restores_cluster_membership_conservation_after_a_confirmed_merge
          rationale: |
            The aggregation row's three claims - running total correct after an add, correct after a
            reversal, and the floor honoured - are exactly what that instance asserts: member_record_count
            and participant_count after the merge, the identical values restored after the unlink, and the
            conserved SUM over ACTIVE clusters equal to the CLUSTERED record count at every step.
      - name: consent_disclosure_decision_propagates_the_directive_chain_to_a_fixed_point
        claim_type: constraint_propagation
        grounds:
          - calculations.consent_disclosure_decision
        excluded_because:
          difficulty_instance: transitive_cascade / confirmed_match_link_cascades_cluster_merge_into_directive_supersession
          rationale: |
            Propagation reaching a fixed point without looping is asserted there: the merge re-points every
            directive of the losing cluster, supersedes exactly the duplicate (directive_type, scope,
            scoped_participant_id) triple, sets supersedes_directive_id once, and leaves
            active_directive_count at the deduplicated total of 1, so the propagation terminates instead of
            re-superseding the survivor.
      - name: fee_reconciliation_delta_is_applied_when_the_variant_switches
        claim_type: Reconciliation
        grounds:
          - calculations.participation_fee.variants
          - entities.ParticipationInvoice.fields.basis_variant
        excluded_because:
          difficulty_instance: dual_variant_calc / participation_fee_provisional_vs_reconciled_diverge_on_same_billing_period
          rationale: |
            That instance issues both bases over one participant and one period and asserts the ledger
            effect of the switch - the two totals to the cent plus the outstanding_balance_cents movement -
            which is the Reconciliation row's "delta correctly applied to the ledger" claim.
  - section: Validations
    instances:
      - name: quality_sample_with_impossible_counts_or_an_overlapping_window_is_rejected
        claim_type: Violation → Error
        grounds:
          - validations.priority_24
          - errors.ERR_QUALITY_SAMPLE_INVALID
          - endpoints.POST_hie_data_feeds_id_quality_samples
        distinguishing_aspect: |
          Priority 24 has three independent legs and each must fire on its own: rejected + missing
          exceeding messages_received, duplicate_count exceeding messages_received, and a
          [period_start, period_end) window overlapping an existing sample on the same feed. All three
          return ERR_QUALITY_SAMPLE_INVALID (422) and leave sample_count unchanged.
        test_recipe:
          setup:
            - "One participant at CONFORMANCE_TESTING with one ADT feed carrying an accepted June sample."
          setup_api_calls:
            - call: "POST /hie/participants"
              payload: { legal_name: "Brackenmoor Hospital", org_type: "HOSPITAL", declared_annual_patient_volume: 60000, primary_contact_email: "hie@brackenmoor.example" }
              as: HieAdmin
              captures: { pV1_id: $.data.id }
            - call: "POST /hie/participants/${pV1_id}/onboarding-transitions"
              payload: { action: "SUBMIT_FOR_LEGAL_REVIEW" }
              as: ParticipantAdmin
              as_user_id: "${pV1_id}"
            - call: "POST /hie/participants/${pV1_id}/onboarding-transitions"
              payload: { action: "EXECUTE_AGREEMENT", agreement_version: "DURSA-2026.1", signed_at: "2026-08-01T00:00:00Z" }
              as: HieAdmin
              as_user_id: "admin-legal-1"
              captures: { pV1_ver: $.data.version }
            - call: "POST /hie/participants/${pV1_id}/data-feeds"
              payload: { feed_type: "ADT", expected_participant_version: "${pV1_ver}" }
              as: HieAdmin
              captures: { feedV1_id: $.data.id }
            - call: "POST /hie/data-feeds/${feedV1_id}/quality-samples"
              payload: { period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", messages_received: 8000, messages_rejected: 100, required_fields_missing_count: 200, duplicate_count: 50, timeliness_p95_seconds: 250 }
              as: HieAdmin
          trigger:
            - call: "POST /hie/data-feeds/${feedV1_id}/quality-samples"
              payload: { period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", messages_received: 1000, messages_rejected: 600, required_fields_missing_count: 401, duplicate_count: 0, timeliness_p95_seconds: 200 }
              as: HieAdmin
              captures: { errV1_a: $.data.error_id }
            - call: "POST /hie/data-feeds/${feedV1_id}/quality-samples"
              payload: { period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z", messages_received: 1000, messages_rejected: 0, required_fields_missing_count: 0, duplicate_count: 1001, timeliness_p95_seconds: 200 }
              as: HieAdmin
              captures: { errV1_b: $.data.error_id }
            - call: "POST /hie/data-feeds/${feedV1_id}/quality-samples"
              payload: { period_start: "2026-06-15T00:00:00Z", period_end: "2026-07-15T00:00:00Z", messages_received: 1000, messages_rejected: 0, required_fields_missing_count: 0, duplicate_count: 0, timeliness_p95_seconds: 200 }
              as: HieAdmin
              captures: { errV1_c: $.data.error_id }
            - call: "GET /hie/data-feeds/${feedV1_id}"
              payload: {}
              as: HieAdmin
              captures: { feedV1_count: $.data.sample_count, feedV1_status: $.data.status }
          assert:
            - "${errV1_a} == ERR_QUALITY_SAMPLE_INVALID"
            - "${errV1_b} == ERR_QUALITY_SAMPLE_INVALID"
            - "${errV1_c} == ERR_QUALITY_SAMPLE_INVALID"
            - "${feedV1_count} == 1"
            - "${feedV1_status} == MONITORED"
      - name: quality_sample_counts_touching_the_ceiling_are_accepted_and_score_49_00
        claim_type: Satisfaction → Pass
        grounds:
          - validations.priority_24
          - calculations.participant_quality_score
          - calculations.participant_quality_score.constants.PENALTY_BY_PROVISIONAL_GRADE
        distinguishing_aspect: |
          The rule's comparison is strictly greater-than, so a sample whose rejected + missing equals
          messages_received exactly (400 + 600 == 1000) and whose duplicate_count equals
          messages_received exactly (1000) is ACCEPTED. It scores base 55.00, provisional grade D,
          penalty 6, quality_score 49.00, grade D - the only reading in the suite that exercises the D
          penalty branch - and its reject_rate 0.4000 drives the feed to DEGRADED in the same request.
        test_recipe:
          setup:
            - "One participant at CONFORMANCE_TESTING with a freshly provisioned ADT feed in PROVISIONING and no samples."
          setup_api_calls:
            - call: "POST /hie/participants"
              payload: { legal_name: "Crowmere District Hospital", org_type: "HOSPITAL", declared_annual_patient_volume: 60000, primary_contact_email: "hie@crowmere.example" }
