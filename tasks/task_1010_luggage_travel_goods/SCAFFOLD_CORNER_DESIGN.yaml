scaffold_corner_design:
  # ---------------------------------------------------------------------
  # Section: entities
  # ---------------------------------------------------------------------
  - section: entities
    instances:
      - name: product_create_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.Product, "endpoints[POST /store/products]"]
        distinguishing_aspect: "POST /store/products with all required fields returns 201 and status defaults ACTIVE."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /store/products"
              payload: { sku: "P-1", name: "Alpha", category: "BACKPACK", msrp_cents: 12000, warranty_months: 12, length_mm: 450, width_mm: 300, height_mm: 200 }
              as: Associate
              captures: { pid: $.data.id }
          assert:
            - "response HTTP 201"
            - "Product.${pid}.status == ACTIVE"
            - "Product.${pid}.sku == 'P-1'"

      - name: get_product_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Product, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /store/products/{id} with a random UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /store/products/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Associate
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP 404"
            - "response data.error_id == ERR_NOT_FOUND"

      - name: create_customer_missing_email_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Customer.fields.email, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting the required email field on POST /store/customers returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /store/customers"
              payload: { full_name: "No Email" }
              as: Associate
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP 422"
            - "response data.error_id == ERR_INVALID_REQUEST"

      - name: create_product_invalid_category_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Product.fields.category, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "A category outside {HARD_SHELL,SOFT_SIDE,BACKPACK,DUFFEL,ACCESSORY} returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /store/products"
              payload: { sku: "P-2", name: "Bad Cat", category: "SUITCASE", msrp_cents: 1000, warranty_months: 0, length_mm: 100, width_mm: 100, height_mm: 100 }
              as: Associate
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_INVALID_REQUEST"

      - name: create_sales_order_line_qty_zero_returns_validation_range
        claim_type: Type Constraints
        grounds: [entities.SalesOrderLine.fields.qty, "validations[priority=17]", "errors[ERR_VALIDATION_RANGE]"]
        distinguishing_aspect: "qty of 0 on POST /store/sales-order-lines violates qty>=1 and returns ERR_VALIDATION_RANGE (422)."
        test_recipe:
          setup: ["Customer and Product exist; a PENDING sales order exists."]
          setup_api_calls:
            - call: "POST /store/customers"
              payload: { email: "corner1@x.com", full_name: "Corner One" }
              as: Associate
              captures: { cust_id: $.data.id }
            - call: "POST /store/products"
              payload: { sku: "P-3", name: "Gamma", category: "DUFFEL", msrp_cents: 8000, warranty_months: 6, length_mm: 500, width_mm: 300, height_mm: 250 }
              as: Associate
              captures: { pid: $.data.id }
            - call: "POST /store/sales-orders"
              payload: { customer_id: "${cust_id}" }
              as: Associate
              captures: { so_id: $.data.id }
          trigger:
            - call: "POST /store/sales-order-lines"
              payload: { sales_order_id: "${so_id}", product_id: "${pid}", unit_price_cents: 8000, qty: 0 }
              as: Associate
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_VALIDATION_RANGE"

      - name: warranty_registration_computes_expiry
        claim_type: Computed Fields
        grounds: [entities.WarrantyRegistration.fields.warranty_expiry, calculations.warranty_expiry]
        distinguishing_aspect: "Registration for a 24-month product purchased 2026-06-01 computes warranty_expiry 2028-06-01."
        test_recipe:
          setup: ["Product with warranty_months 24; Customer."]
          setup_api_calls:
            - call: "POST /store/products"
              payload: { sku: "P-4", name: "Delta", category: "HARD_SHELL", msrp_cents: 30000, warranty_months: 24, length_mm: 550, width_mm: 350, height_mm: 230 }
              as: Associate
              captures: { pid: $.data.id }
            - call: "POST /store/customers"
              payload: { email: "corner2@x.com", full_name: "Corner Two" }
              as: Associate
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /store/warranty-registrations"
              payload: { product_id: "${pid}", customer_id: "${cust_id}", serial_number: "SER-4", purchase_date: "2026-06-01T00:00:00Z" }
              as: Associate
              captures: { reg_id: $.data.id }
          assert:
            - "WarrantyRegistration.${reg_id}.warranty_expiry == '2028-06-01T00:00:00Z'"

      - name: airline_created_without_version_field
        claim_type: Immutability
        grounds: [entities.Airline]
        distinguishing_aspect: "Airline has common_fields:false, so the create response carries id and created_at but no version field."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /store/airlines"
              payload: { iata_code: "DL", name: "Delta Air", carry_on_max_length_mm: 560, carry_on_max_width_mm: 350, carry_on_max_height_mm: 230, checked_linear_limit_mm: 1580 }
              as: Manager
              captures: { aid: $.data.id }
          assert:
            - "response HTTP 201"
            - "Airline.${aid} response has no 'version' field"

      - name: list_products_paginated_envelope
        claim_type: Listing
        grounds: [entities.Product, "endpoints[GET /store/products]"]
        distinguishing_aspect: "GET /store/products returns an array with pagination fields total_count and has_more."
        test_recipe:
          setup: ["Two products exist."]
          setup_api_calls:
            - call: "POST /store/products"
              payload: { sku: "P-5", name: "E1", category: "ACCESSORY", msrp_cents: 500, warranty_months: 0, length_mm: 100, width_mm: 80, height_mm: 20 }
              as: Associate
            - call: "POST /store/products"
              payload: { sku: "P-6", name: "E2", category: "ACCESSORY", msrp_cents: 600, warranty_months: 0, length_mm: 110, width_mm: 80, height_mm: 20 }
              as: Associate
          trigger:
            - call: "GET /store/products"
              payload: { limit: 1, offset: 0 }
              as: Associate
          assert:
            - "response meta+pagination present; total_count >= 2; has_more == true"

  # ---------------------------------------------------------------------
  # Section: state_machines
  # ---------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: approve_repair_from_intake_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.RepairOrder.QUOTED_to_APPROVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Approving a RepairOrder still in INTAKE (never quoted, product not recalled) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Customer; Product (ACTIVE); RepairOrder in INTAKE."]
          setup_api_calls:
            - call: "POST /store/customers"
              payload: { email: "corner3@x.com", full_name: "Corner Three" }
              as: Associate
              captures: { cust_id: $.data.id }
            - call: "POST /store/products"
              payload: { sku: "P-7", name: "Zeta", category: "HARD_SHELL", msrp_cents: 20000, warranty_months: 12, length_mm: 500, width_mm: 350, height_mm: 230 }
              as: Associate
              captures: { pid: $.data.id }
            - call: "POST /store/repair-orders"
              payload: { customer_id: "${cust_id}", product_id: "${pid}" }
              as: Associate
              captures: { ro_id: $.data.id }
          trigger:
            - call: "POST /store/repair-orders/${ro_id}/approve"
              payload: {}
              as: Manager
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_INVALID_STATE"

      - name: resolve_resolved_claim_returns_invalid_state
        claim_type: terminal_lockdown
        grounds: [state_machines.WarrantyClaim.UNDER_REVIEW_to_RESOLVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Resolving a claim already RESOLVED (terminal) returns ERR_INVALID_STATE; no further transitions."
        test_recipe:
          setup: ["Product; Customer; registration ACTIVE; claim reviewed then resolved REPLACE (RESOLVED)."]
          setup_api_calls:
            - call: "POST /store/products"
              payload: { sku: "P-8", name: "Eta", category: "HARD_SHELL", msrp_cents: 24000, warranty_months: 24, length_mm: 550, width_mm: 350, height_mm: 230 }
              as: Associate
              captures: { pid: $.data.id }
            - call: "POST /store/customers"
              payload: { email: "corner4@x.com", full_name: "Corner Four" }
              as: Associate
              captures: { cust_id: $.data.id }
            - call: "POST /store/warranty-registrations"
              payload: { product_id: "${pid}", customer_id: "${cust_id}", serial_number: "SER-8", purchase_date: "2026-06-01T00:00:00Z" }
              as: Associate
              captures: { reg_id: $.data.id, reg_ver: $.data.version }
            - call: "POST /store/warranty-claims"
              payload: { registration_id: "${reg_id}", expected_warranty_registration_version: "${reg_ver}", defect_type: "LINING", description: "torn" }
              as: Associate
              captures: { claim_id: $.data.id }
            - call: "POST /store/warranty-claims/${claim_id}/review"
              payload: {}
              as: Associate
            - call: "POST /store/warranty-claims/${claim_id}/resolve"
              payload: { resolution: "REPLACE" }
              as: Manager
          trigger:
            - call: "POST /store/warranty-claims/${claim_id}/resolve"
              payload: { resolution: "REPAIR" }
              as: Manager
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_INVALID_STATE"

      - name: capture_order_twice_returns_invalid_state
        claim_type: idempotency
        grounds: [state_machines.SalesOrder.PENDING_to_CAPTURED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A second capture on an already-CAPTURED order returns ERR_INVALID_STATE (payment axis no longer PENDING)."
        test_recipe:
          setup: ["Customer; Product; SalesOrder with one line captured once."]
          setup_api_calls:
            - call: "POST /store/customers"
              payload: { email: "corner5@x.com", full_name: "Corner Five" }
              as: Associate
              captures: { cust_id: $.data.id }
            - call: "POST /store/products"
              payload: { sku: "P-9", name: "Theta", category: "SOFT_SIDE", msrp_cents: 10000, warranty_months: 12, length_mm: 500, width_mm: 300, height_mm: 250 }
              as: Associate
              captures: { pid: $.data.id }
            - call: "POST /store/sales-orders"
              payload: { customer_id: "${cust_id}" }
              as: Associate
              captures: { so_id: $.data.id }
            - call: "POST /store/sales-order-lines"
              payload: { sales_order_id: "${so_id}", product_id: "${pid}", unit_price_cents: 10000, qty: 1 }
              as: Associate
            - call: "POST /store/sales-orders/${so_id}/capture"
              payload: {}
              as: Associate
          trigger:
            - call: "POST /store/sales-orders/${so_id}/capture"
              payload: {}
              as: Associate
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_INVALID_STATE"

      - name: recall_close_reverts_product_and_registration
        claim_type: compensation
        grounds: [state_machines.RecallNotice.PUBLISHED_to_CLOSED, state_machines.Product.RECALLED_to_ACTIVE, state_machines.WarrantyRegistration.RECALL_FLAGGED_to_ACTIVE]
        distinguishing_aspect: "Closing a published recall reverts Product RECALLED->ACTIVE and its RECALL_FLAGGED registration back to ACTIVE (compensation, no drift)."
        test_recipe:
          setup: ["Product with an ACTIVE registration; recall published (product RECALLED, registration RECALL_FLAGGED)."]
          setup_api_calls:
            - call: "POST /store/products"
              payload: { sku: "P-10", name: "Iota", category: "HARD_SHELL", msrp_cents: 30000, warranty_months: 24, length_mm: 550, width_mm: 350, height_mm: 230 }
              as: Associate
              captures: { pid: $.data.id }
            - call: "POST /store/customers"
              payload: { email: "corner6@x.com", full_name: "Corner Six" }
              as: Associate
              captures: { cust_id: $.data.id }
            - call: "POST /store/warranty-registrations"
              payload: { product_id: "${pid}", customer_id: "${cust_id}", serial_number: "SER-10", purchase_date: "2026-06-01T00:00:00Z" }
              as: Associate
              captures: { reg_id: $.data.id }
            - call: "POST /store/recall-notices"
              payload: { product_id: "${pid}", reason: "defect", remedy: "REPLACE" }
              as: Manager
              captures: { rn_id: $.data.id }
            - call: "POST /store/recall-notices/${rn_id}/publish"
              payload: {}
              as: Manager
          trigger:
            - call: "POST /store/recall-notices/${rn_id}/close"
              payload: {}
              as: Manager
          assert:
            - "Product.${pid}.status == ACTIVE"
            - "WarrantyRegistration.${reg_id}.status == ACTIVE"

      - name: recall_publish_cancels_open_special_order
        claim_type: conditional_cascade
        grounds: [state_machines.Product.ACTIVE_to_RECALLED, state_machines.SpecialOrder.REQUESTED_to_CANCELLED]
        distinguishing_aspect: "Publishing a recall cancels an open SpecialOrder (REQUESTED) for that product via the product-recall cascade."
        test_recipe:
          setup: ["Product ACTIVE; Customer; SpecialOrder REQUESTED for the product; RecallNotice DRAFT."]
          setup_api_calls:
            - call: "POST /store/products"
              payload: { sku: "P-11", name: "Kappa", category: "HARD_SHELL", msrp_cents: 30000, warranty_months: 24, length_mm: 550, width_mm: 350, height_mm: 230 }
              as: Associate
              captures: { pid: $.data.id }
            - call: "POST /store/customers"
              payload: { email: "corner7@x.com", full_name: "Corner Seven" }
              as: Associate
              captures: { cust_id: $.data.id }
            - call: "POST /store/special-orders"
              payload: { customer_id: "${cust_id}", product_id: "${pid}", quantity: 2 }
              as: Associate
              captures: { spo_id: $.data.id }
            - call: "POST /store/recall-notices"
              payload: { product_id: "${pid}", reason: "safety", remedy: "REFUND" }
              as: Manager
              captures: { rn_id: $.data.id }
          trigger:
            - call: "POST /store/recall-notices/${rn_id}/publish"
              payload: {}
              as: Manager
          assert:
            - "SpecialOrder.${spo_id}.status == CANCELLED"

      - name: special_order_source_arrive_fulfill_happy_path
        claim_type: valid_transition
        grounds: [state_machines.SpecialOrder.REQUESTED_to_SOURCED, state_machines.SpecialOrder.ARRIVED_to_FULFILLED]
        distinguishing_aspect: "A special order advances REQUESTED->SOURCED->ARRIVED->FULFILLED for an ACTIVE product."
        test_recipe:
          setup: ["Product ACTIVE; Customer; SpecialOrder REQUESTED."]
          setup_api_calls:
            - call: "POST /store/products"
              payload: { sku: "P-12", name: "Lambda", category: "DUFFEL", msrp_cents: 14000, warranty_months: 12, length_mm: 550, width_mm: 300, height_mm: 250 }
              as: Associate
              captures: { pid: $.data.id }
            - call: "POST /store/customers"
              payload: { email: "corner8@x.com", full_name: "Corner Eight" }
              as: Associate
              captures: { cust_id: $.data.id }
            - call: "POST /store/special-orders"
              payload: { customer_id: "${cust_id}", product_id: "${pid}", quantity: 1, deposit_cents: 2000 }
              as: Associate
              captures: { spo_id: $.data.id }
          trigger:
            - call: "POST /store/special-orders/${spo_id}/source"
              payload: {}
              as: Associate
            - call: "POST /store/special-orders/${spo_id}/arrive"
              payload: {}
              as: Associate
            - call: "POST /store/special-orders/${spo_id}/fulfill"
              payload: {}
              as: Associate
          assert:
            - "SpecialOrder.${spo_id}.status == FULFILLED"

      - name: cancel_special_order_from_already_cancelled_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.SpecialOrder.REQUESTED_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling a SpecialOrder already CANCELLED returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Product ACTIVE; Customer; SpecialOrder cancelled once."]
          setup_api_calls:
            - call: "POST /store/products"
              payload: { sku: "P-13", name: "Mu", category: "DUFFEL", msrp_cents: 14000, warranty_months: 12, length_mm: 550, width_mm: 300, height_mm: 250 }
              as: Associate
              captures: { pid: $.data.id }
            - call: "POST /store/customers"
              payload: { email: "corner9@x.com", full_name: "Corner Nine" }
              as: Associate
              captures: { cust_id: $.data.id }
            - call: "POST /store/special-orders"
              payload: { customer_id: "${cust_id}", product_id: "${pid}", quantity: 1 }
              as: Associate
              captures: { spo_id: $.data.id }
            - call: "POST /store/special-orders/${spo_id}/cancel"
              payload: {}
              as: Associate
          trigger:
            - call: "POST /store/special-orders/${spo_id}/cancel"
              payload: {}
              as: Associate
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_INVALID_STATE"

  # ---------------------------------------------------------------------
  # Section: calculations
  # ---------------------------------------------------------------------
  - section: calculations
    instances:
      - name: trade_in_offer_fair_condition_value
        claim_type: correct_result
        grounds: [calculations.trade_in_offer_value, entities.TradeIn.fields.offer_amount_cents]
        distinguishing_aspect: "A FAIR trade-in on a 30000 msrp product yields offer_amount_cents 6000 (30000 * 0.20)."
        test_recipe:
          setup: ["Customer (version 1); Product msrp 30000."]
          setup_api_calls:
            - call: "POST /store/customers"
              payload: { email: "corner10@x.com", full_name: "Corner Ten" }
              as: Associate
              captures: { cust_id: $.data.id, cust_ver: $.data.version }
            - call: "POST /store/products"
              payload: { sku: "P-14", name: "Nu", category: "HARD_SHELL", msrp_cents: 30000, warranty_months: 24, length_mm: 550, width_mm: 350, height_mm: 230 }
              as: Associate
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /store/trade-ins"
              payload: { customer_id: "${cust_id}", product_id: "${pid}", expected_customer_version: "${cust_ver}", condition: "FAIR" }
              as: Associate
              captures: { ti_id: $.data.id }
          assert:
            - "TradeIn.${ti_id}.offer_amount_cents == 6000"

      - name: sales_order_gift_wrap_fee_applied
        claim_type: correct_result
        grounds: [calculations.sales_order_pricing, entities.SalesOrder.fields.gift_wrap_fee_cents, entities.SalesOrder.fields.total_cents]
        distinguishing_aspect: "A gift order (BRONZE) with one line unit 10000 qty 1 yields gift_wrap_fee_cents 800 and total_cents 11600 (10000 + 800 tax + 800 wrap)."
        test_recipe:
          setup: ["BRONZE Customer; Product; gift SalesOrder with one line unit 10000 qty 1."]
          setup_api_calls:
            - call: "POST /store/customers"
              payload: { email: "corner11@x.com", full_name: "Corner Eleven" }
              as: Associate
              captures: { cust_id: $.data.id }
            - call: "POST /store/products"
              payload: { sku: "P-15", name: "Xi", category: "SOFT_SIDE", msrp_cents: 10000, warranty_months: 12, length_mm: 500, width_mm: 300, height_mm: 250 }
              as: Associate
              captures: { pid: $.data.id }
            - call: "POST /store/sales-orders"
              payload: { customer_id: "${cust_id}", is_gift: true, gift_message: "Happy trip" }
              as: Associate
              captures: { so_id: $.data.id }
            - call: "POST /store/sales-order-lines"
              payload: { sales_order_id: "${so_id}", product_id: "${pid}", unit_price_cents: 10000, qty: 1 }
              as: Associate
          trigger:
            - call: "GET /store/sales-orders/${so_id}"
              payload: {}
              as: Associate
          assert:
            - "SalesOrder.${so_id}.gift_wrap_fee_cents == 800"
            - "SalesOrder.${so_id}.total_cents == 11600"

      - name: airline_fit_checked_linear_within_limit
        claim_type: correct_result
        grounds: [calculations.airline_fit, "endpoints[GET /store/products/{id}/airline-fit]"]
        distinguishing_aspect: "A product 700/450/300 (linear 1450) against checked_linear_limit 1580 reports fits_checked true and linear_mm 1450."
        test_recipe:
          setup: ["Airline with checked_linear_limit 1580; a product 700/450/300."]
          setup_api_calls:
            - call: "POST /store/airlines"
              payload: { iata_code: "AA", name: "American", carry_on_max_length_mm: 560, carry_on_max_width_mm: 350, carry_on_max_height_mm: 230, checked_linear_limit_mm: 1580 }
              as: Manager
              captures: { aid: $.data.id }
            - call: "POST /store/products"
              payload: { sku: "P-16", name: "Omicron", category: "HARD_SHELL", msrp_cents: 40000, warranty_months: 24, length_mm: 700, width_mm: 450, height_mm: 300 }
              as: Associate
              captures: { pid: $.data.id }
          trigger:
            - call: "GET /store/products/${pid}/airline-fit"
              payload: { airline_id: "${aid}" }
              as: Associate
              captures: { lm: $.data.linear_mm }
          assert:
            - "airline-fit(${pid}).linear_mm == 1450"
            - "airline-fit(${pid}).fits_checked == true"
            - "airline-fit(${pid}).fits_carry_on == false"

  # ---------------------------------------------------------------------
  # Section: validations
  # ---------------------------------------------------------------------
  - section: validations
    instances:
      - name: duplicate_customer_email_returns_duplicate
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_DUPLICATE]", entities.Customer.fields.email]
        distinguishing_aspect: "Creating a second customer with an existing email returns ERR_DUPLICATE (409)."
        test_recipe:
          setup: ["A customer with email dup@x.com exists."]
          setup_api_calls:
            - call: "POST /store/customers"
              payload: { email: "dup@x.com", full_name: "First" }
              as: Associate
          trigger:
            - call: "POST /store/customers"
              payload: { email: "dup@x.com", full_name: "Second" }
              as: Associate
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_DUPLICATE"

      - name: duplicate_registration_serial_per_product_returns_duplicate
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_DUPLICATE]", entities.WarrantyRegistration.fields.serial_number]
        distinguishing_aspect: "A second registration with the same serial_number for the same product_id returns ERR_DUPLICATE."
        test_recipe:
          setup: ["Product; Customer; a registration with serial SER-DUP for the product."]
          setup_api_calls:
            - call: "POST /store/products"
              payload: { sku: "P-17", name: "Pi", category: "HARD_SHELL", msrp_cents: 20000, warranty_months: 24, length_mm: 550, width_mm: 350, height_mm: 230 }
              as: Associate
              captures: { pid: $.data.id }
            - call: "POST /store/customers"
              payload: { email: "corner12@x.com", full_name: "Corner Twelve" }
              as: Associate
