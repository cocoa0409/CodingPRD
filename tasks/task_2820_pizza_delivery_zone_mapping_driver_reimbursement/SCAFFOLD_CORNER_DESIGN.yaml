  - section: endpoints
    instances:
    - name: store_policy_patch_is_a_partial_update_that_bumps_the_version
      claim_type: standard_crud
      grounds: ['endpoints.PATCH /store-ops/stores/{store_id}', 'endpoints.GET /store-ops/stores/{store_id}', entities.Store.fields.delivery_fee_cents, entities.Store.fields.hot_bag_count]
      distinguishing_aspect: 'PATCH is a true partial update: the two supplied policy fields change, every omitted field keeps the value it had (defaults included), the four computed totals are re-derived rather than reset, and version advances by exactly one per write.'
      test_recipe:
        setup: ['One store created with every optional policy field omitted, so all of them hold their §1.1 defaults.']
        setup_api_calls:
        - call: POST /store-ops/_clock/set_current_utc
          payload: {current_utc: '2026-08-05T09:00:00Z'}
          as: StoreManager
          as_user_id: boot
