          assert:
            - "v0 == 1 and v1 == 2 and v2 == 3 (customer version +1 per mutation)"
            - "cv0 == 1 and cv1 == 2 (container lot version +1 on QC verdict)"

      - name: logical_clock_default_and_regression
        claim_type: clock_regression
        grounds:
          - errors[ERR_CLOCK_REGRESSION]
          - errors[ERR_DELIVERY_DATE_IN_PAST]
        distinguishing_aspect: |
          The logical clock starts at exactly 2026-08-01T00:00:00Z without any
          set call — proven by 2026-07-31 delivery rejected and 2026-08-01
          accepted; the clock then accepts equal-or-later sets (2026-08-05
          twice) and rejects a regression to 2026-08-04 with
          ERR_CLOCK_REGRESSION.
        test_recipe:
          setup:
            - "ACTIVE customer with a DRAFT formula; no clock call has been made yet"
          setup_api_calls:
            - { call: "POST /v1/customer-accounts", payload: { name: "ClockCo", credit_limit_cents: 500000, minimum_run_units: 100, pallet_deposit_cents: 2000 }, as: PlantManager, captures: { cust_id: $.data.id } }
