            - call: "POST /ppa/deals/${deal_id}/risk-events"
              payload: { event_type: "FORCE_MAJEURE", claimed_by: "DEVELOPER", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-05T23:00:00Z", description: "wildfire evacuation order" }
