scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: referral_fee_estimated_vs_final_diverges_on_identical_rate_and_care_level
        grounds:
          - calculations.referral_fee
          - entities.Placement.fields.estimated_fee_cents
          - entities.Placement.fields.final_fee_cents
          - state_machines.Placement.PENDING_MOVE_IN_to_MOVED_IN
        distinguishing_aspect: |
          This dual variant lives in the MONEY domain on Placement/ReferralInvoice: with
          contracted_monthly_rate_cents equal to the match's quoted rate (500000) and
          actual_care_level equal to the matched care level, the `estimated` variant books a
          full unprorated month (492500) while the `final` variant prorates by the day-of-month
          of actual_move_in_date (180583), so identical inputs yield two different cent amounts.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z, then advanced to 2026-06-20T12:00:00Z."
            - "Community 'Cedar Grove' (PREFERRED, referral_fee_pct 0.85, tour_slot_capacity 5, quality_rating 4.0) with one OPEN ASSISTED_LIVING inventory: total_units 5, monthly_rate_cents 500000."
            - "Advisor Ann (TX-AUS, capacity 3) assigned to inquiry Q1 whose NeedsAssessment is APPROVED with affordability_ceiling_cents 572000."
            - "Match M1 on Cedar Grove is SELECTED after one completed tour; Placement P1 is PENDING_MOVE_IN with estimated_fee_cents already stored."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /advisors"
              payload: { full_name: "Ann Reyes", email: "ann@apfm.test", region_code: "TX-AUS", is_va_certified: false, caseload_capacity: 3 }
              as: PlatformAdmin
              captures: { a1_id: $.data.id }
            - call: "POST /communities"
              payload: { name: "Cedar Grove", region_code: "TX-AUS", contract_tier: "PREFERRED", referral_fee_pct: 0.85, tour_slot_capacity: 5, quality_rating: 4.0 }
              as: PlatformAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /inventories"
              payload: { community_id: "${c1_id}", care_level: "ASSISTED_LIVING", total_units: 5, monthly_rate_cents: 500000 }
              as: PlatformAdmin
              captures: { i1_id: $.data.id, i1_v: $.data.version }
            - call: "POST /families"
              payload: { primary_contact_name: "Dana Kim", email: "dana@apfm.test", phone: "512-555-0100", relationship_to_senior: "ADULT_CHILD", state_code: "TX", senior_first_name: "Ruth", senior_age: 82 }
              as: PlatformAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /inquiries"
              payload: { family_id: "${f1_id}", origin: "WEB", region_code: "TX-AUS", requested_care_level: "ASSISTED_LIVING", target_move_in_date: "2026-06-20", declared_budget_monthly_cents: 520000 }
              as: PlatformAdmin
              captures: { q1_id: $.data.id }
            - call: "POST /inquiries/${q1_id}/assign"
              payload: { advisor_id: "${a1_id}" }
              as: PlatformAdmin
            - call: "POST /assessments"
              payload: { inquiry_id: "${q1_id}", adl_score: 6, cognitive_score: 4, mobility_score: 5, budget_monthly_cents: 520000, gross_monthly_income_cents: 320000, va_eligible: true, marital_status: "MARRIED" }
              as: Advisor
              as_user_id: "${a1_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /assessments/${s1_id}/submit"
              payload: {}
              as: Advisor
              as_user_id: "${a1_id}"
            - call: "POST /assessments/${s1_id}/review"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /matches"
              payload: { inquiry_id: "${q1_id}", community_id: "${c1_id}", care_level: "ASSISTED_LIVING" }
              as: Advisor
              as_user_id: "${a1_id}"
              captures: { m1_id: $.data.id }
            - call: "POST /matches/${m1_id}/shortlist"
              payload: {}
              as: Advisor
              as_user_id: "${a1_id}"
            - call: "POST /tours"
              payload: { match_id: "${m1_id}", scheduled_start: "2026-06-05T15:00:00Z", scheduled_end: "2026-06-05T16:00:00Z", mode: "IN_PERSON" }
              as: Advisor
              as_user_id: "${a1_id}"
              captures: { t1_id: $.data.id }
            - call: "POST /tours/${t1_id}/complete"
              payload: { outcome_rating: 4 }
              as: Advisor
              as_user_id: "${a1_id}"
            - call: "POST /matches/${m1_id}/select"
              payload: {}
              as: Advisor
              as_user_id: "${a1_id}"
            - call: "POST /placements"
              payload: { match_id: "${m1_id}", inventory_id: "${i1_id}", agreed_move_in_date: "2026-06-20", contracted_monthly_rate_cents: 500000, expected_inventory_version: "${i1_v}" }
              as: Advisor
              as_user_id: "${a1_id}"
              captures: { p1_id: $.data.id, est_fee: $.data.estimated_fee_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T12:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /placements/${p1_id}/confirm-move-in"
              payload: { actual_move_in_date: "2026-06-20", actual_care_level: "ASSISTED_LIVING" }
              as: CommunityManager
              as_user_id: "${c1_id}"
          assert:
            - "Placement.${p1_id}.estimated_fee_cents == 492500"
            - "Placement.${p1_id}.final_fee_cents == 180583"
            - "Placement.${p1_id}.final_fee_cents != Placement.${p1_id}.estimated_fee_cents"
            - "Placement.${p1_id}.residency_status == MOVED_IN"
            - "Placement.${p1_id}.billing_status == INVOICE_DRAFTED"
            - "GET /referral-invoices with placement_id=${p1_id} returns exactly 1 row with status DRAFT and final_fee_cents == 180583"

      - name: advisor_load_index_headcount_vs_acuity_weighted_on_same_caseload
        grounds:
          - calculations.advisor_load_index
          - entities.Advisor.fields.headcount_load_index
          - entities.Advisor.fields.weighted_load_index
          - entities.Inquiry.fields.priority_score
        distinguishing_aspect: |
          This dual variant lives in the STAFFING domain on Advisor, not in money: the same two
          ACTIVE CaseloadAssignment rows on a capacity-3 advisor yield headcount_load_index
          0.6667 (2/3) and weighted_load_index 0.4087 ((70.59+52.03)/300), so the two algorithms
          disagree on how loaded the identical caseload is.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "Advisor Ann in TX-AUS with caseload_capacity 3."
            - "Inquiry Q1 (ASSISTED_LIVING, target 2026-06-20, budget 520000) with priority_score 70.59 and inquiry Q2 (MEMORY_CARE, target 2026-09-30, budget 400000) with priority_score 52.03, both assigned to Ann."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /advisors"
              payload: { full_name: "Ann Reyes", email: "ann@apfm.test", region_code: "TX-AUS", is_va_certified: false, caseload_capacity: 3 }
              as: PlatformAdmin
              captures: { a1_id: $.data.id }
            - call: "POST /families"
              payload: { primary_contact_name: "Dana Kim", email: "dana@apfm.test", phone: "512-555-0100", relationship_to_senior: "ADULT_CHILD", state_code: "TX", senior_first_name: "Ruth", senior_age: 82 }
              as: PlatformAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /families"
              payload: { primary_contact_name: "Eli Ortiz", email: "eli@apfm.test", phone: "512-555-0101", relationship_to_senior: "SPOUSE", state_code: "TX", senior_first_name: "Mabel", senior_age: 79 }
              as: PlatformAdmin
              captures: { f2_id: $.data.id }
            - call: "POST /inquiries"
              payload: { family_id: "${f1_id}", origin: "WEB", region_code: "TX-AUS", requested_care_level: "ASSISTED_LIVING", target_move_in_date: "2026-06-20", declared_budget_monthly_cents: 520000 }
              as: PlatformAdmin
              captures: { q1_id: $.data.id }
            - call: "POST /inquiries"
              payload: { family_id: "${f2_id}", origin: "PHONE", region_code: "TX-AUS", requested_care_level: "MEMORY_CARE", target_move_in_date: "2026-09-30", declared_budget_monthly_cents: 400000 }
              as: PlatformAdmin
              captures: { q2_id: $.data.id }
            - call: "POST /inquiries/${q1_id}/assign"
              payload: { advisor_id: "${a1_id}" }
              as: PlatformAdmin
            - call: "POST /inquiries/${q2_id}/assign"
              payload: { advisor_id: "${a1_id}" }
              as: PlatformAdmin
          trigger:
            - call: "GET /advisors/${a1_id}"
              payload: {}
              as: PlatformAdmin
              captures: { hc: $.data.headcount_load_index, wt: $.data.weighted_load_index }
          assert:
            - "Inquiry.${q1_id}.priority_score == 70.59"
            - "Inquiry.${q2_id}.priority_score == 52.03"
            - "Advisor.${a1_id}.active_caseload_count == 2"
            - "Advisor.${a1_id}.headcount_load_index == 0.6667"
            - "Advisor.${a1_id}.weighted_load_index == 0.4087"
            - "Advisor.${a1_id}.headcount_load_index != Advisor.${a1_id}.weighted_load_index"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: inquiry_priority_score_rounds_each_weighted_term_before_summing
        grounds:
          - calculations.inquiry_priority_score
          - entities.Inquiry.fields.priority_score
          - endpoints[POST /inquiries]
        distinguishing_aspect: |
          MODE (b) — nested rounding where the order changes the cents: round-per-term-then-sum
          gives 25.65 + 27.61 + 17.33 = 70.59, while sum-then-round gives
          round(25.65 + 27.6115 + 17.334) = 70.60. The scaffold pins round-then-sum, so 70.59 is
          the only correct answer and 70.60 falsifies the implementation.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z so days_to_move is exactly 19 and urgency_norm is 78.89."
            - "One Family row exists; no advisor, community or assessment is needed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /families"
              payload: { primary_contact_name: "Dana Kim", email: "dana@apfm.test", phone: "512-555-0100", relationship_to_senior: "ADULT_CHILD", state_code: "TX", senior_first_name: "Ruth", senior_age: 82 }
              as: PlatformAdmin
              captures: { f1_id: $.data.id }
          trigger:
            - call: "POST /inquiries"
              payload: { family_id: "${f1_id}", origin: "WEB", region_code: "TX-AUS", requested_care_level: "ASSISTED_LIVING", target_move_in_date: "2026-06-20", declared_budget_monthly_cents: 520000 }
              as: PlatformAdmin
              captures: { q1_id: $.data.id, score: $.data.priority_score }
          assert:
            - "Inquiry.${q1_id}.priority_score == 70.59"
            - "Inquiry.${q1_id}.priority_score != 70.60"
            - "Inquiry.${q1_id}.status == NEW"
            - "Inquiry.${q1_id}.assigned_advisor_id == null"

      - name: match_fit_score_four_input_nested_min_max_with_conditional_branches
        grounds:
          - calculations.match_fit_score
          - entities.Match.fields.fit_score
          - entities.Match.fields.quoted_monthly_rate_cents
          - entities.CommunityInventory.fields.available_units
        distinguishing_aspect: |
          MODE (a) — a four-input non-linear formula: an exact-care conditional branch (100), a
          nested max/floor budget falloff on ratio 500000/572000 = 0.8741 giving 92.76, a scaled
          quality term (80.00) and a min-capped availability term (100.00) combine to exactly
          94.47 under the pinned sum-then-round order; removing any one branch changes the value.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "Cedar Grove (quality_rating 4.0) with an OPEN ASSISTED_LIVING pool of total_units 5, available_units 5, monthly_rate_cents 500000."
            - "Inquiry Q1 with an APPROVED NeedsAssessment: recommended_care_level ASSISTED_LIVING and affordability_ceiling_cents 572000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /advisors"
              payload: { full_name: "Ann Reyes", email: "ann@apfm.test", region_code: "TX-AUS", is_va_certified: false, caseload_capacity: 3 }
              as: PlatformAdmin
              captures: { a1_id: $.data.id }
            - call: "POST /communities"
              payload: { name: "Cedar Grove", region_code: "TX-AUS", contract_tier: "PREFERRED", referral_fee_pct: 0.85, tour_slot_capacity: 5, quality_rating: 4.0 }
              as: PlatformAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /inventories"
              payload: { community_id: "${c1_id}", care_level: "ASSISTED_LIVING", total_units: 5, monthly_rate_cents: 500000 }
              as: PlatformAdmin
              captures: { i1_id: $.data.id }
            - call: "POST /families"
              payload: { primary_contact_name: "Dana Kim", email: "dana@apfm.test", phone: "512-555-0100", relationship_to_senior: "ADULT_CHILD", state_code: "TX", senior_first_name: "Ruth", senior_age: 82 }
              as: PlatformAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /inquiries"
              payload: { family_id: "${f1_id}", origin: "WEB", region_code: "TX-AUS", requested_care_level: "ASSISTED_LIVING", target_move_in_date: "2026-06-20", declared_budget_monthly_cents: 520000 }
              as: PlatformAdmin
              captures: { q1_id: $.data.id }
            - call: "POST /inquiries/${q1_id}/assign"
              payload: { advisor_id: "${a1_id}" }
              as: PlatformAdmin
            - call: "POST /assessments"
              payload: { inquiry_id: "${q1_id}", adl_score: 6, cognitive_score: 4, mobility_score: 5, budget_monthly_cents: 520000, gross_monthly_income_cents: 320000, va_eligible: true, marital_status: "MARRIED" }
              as: Advisor
              as_user_id: "${a1_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /assessments/${s1_id}/submit"
              payload: {}
              as: Advisor
              as_user_id: "${a1_id}"
            - call: "POST /assessments/${s1_id}/review"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
              captures: { ceiling: $.data.affordability_ceiling_cents }
          trigger:
            - call: "POST /matches"
              payload: { inquiry_id: "${q1_id}", community_id: "${c1_id}", care_level: "ASSISTED_LIVING" }
              as: Advisor
              as_user_id: "${a1_id}"
              captures: { m1_id: $.data.id, fs: $.data.fit_score }
          assert:
            - "NeedsAssessment.${s1_id}.recommended_care_level == ASSISTED_LIVING"
            - "NeedsAssessment.${s1_id}.affordability_ceiling_cents == 572000"
            - "Match.${m1_id}.quoted_monthly_rate_cents == 500000"
            - "Match.${m1_id}.fit_score == 94.47"
            - "Match.${m1_id}.status == PROPOSED"
            - "Inquiry.${q1_id}.status == MATCHING"
            - "Inquiry.${q1_id}.match_count == 1"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: assessment_revision_cycle_draft_submitted_revision_requested_draft
        grounds:
          - state_machines.NeedsAssessment.SUBMITTED_to_REVISION_REQUESTED
          - state_machines.NeedsAssessment.REVISION_REQUESTED_to_DRAFT
          - entities.NeedsAssessment.fields.revision_count
        distinguishing_aspect: |
          CYCLE on NeedsAssessment: the row returns to a state it already occupied
          (DRAFT -> SUBMITTED -> REVISION_REQUESTED -> DRAFT -> SUBMITTED -> APPROVED), and
          revision_count records that the loop executed exactly once while the row still ends
          in APPROVED with a correctly computed affordability_ceiling_cents.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "Advisor Ann assigned to inquiry Q1; Ann authored NeedsAssessment S1 and it is in SUBMITTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /advisors"
              payload: { full_name: "Ann Reyes", email: "ann@apfm.test", region_code: "TX-AUS", is_va_certified: false, caseload_capacity: 3 }
              as: PlatformAdmin
              captures: { a1_id: $.data.id }
            - call: "POST /families"
              payload: { primary_contact_name: "Dana Kim", email: "dana@apfm.test", phone: "512-555-0100", relationship_to_senior: "ADULT_CHILD", state_code: "TX", senior_first_name: "Ruth", senior_age: 82 }
              as: PlatformAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /inquiries"
              payload: { family_id: "${f1_id}", origin: "WEB", region_code: "TX-AUS", requested_care_level: "ASSISTED_LIVING", target_move_in_date: "2026-06-20", declared_budget_monthly_cents: 520000 }
              as: PlatformAdmin
              captures: { q1_id: $.data.id }
            - call: "POST /inquiries/${q1_id}/assign"
              payload: { advisor_id: "${a1_id}" }
              as: PlatformAdmin
            - call: "POST /assessments"
              payload: { inquiry_id: "${q1_id}", adl_score: 6, cognitive_score: 4, mobility_score: 5, budget_monthly_cents: 520000, gross_monthly_income_cents: 320000, va_eligible: true, marital_status: "MARRIED" }
              as: Advisor
              as_user_id: "${a1_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /assessments/${s1_id}/submit"
              payload: {}
              as: Advisor
              as_user_id: "${a1_id}"
          trigger:
            - call: "POST /assessments/${s1_id}/review"
              payload: { decision: "REQUEST_REVISION", revision_note: "Confirm the mobility score with the discharge planner." }
              as: PlatformAdmin
            - call: "PATCH /assessments/${s1_id}"
              payload: { adl_score: 7 }
              as: Advisor
              as_user_id: "${a1_id}"
            - call: "POST /assessments/${s1_id}/submit"
              payload: {}
              as: Advisor
              as_user_id: "${a1_id}"
            - call: "POST /assessments/${s1_id}/review"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
          assert:
            - "NeedsAssessment.${s1_id}.revision_count == 1"
            - "NeedsAssessment.${s1_id}.status == APPROVED"
            - "NeedsAssessment.${s1_id}.revision_note == null"
            - "NeedsAssessment.${s1_id}.recommended_care_level == ASSISTED_LIVING"
            - "NeedsAssessment.${s1_id}.affordability_ceiling_cents == 572000"
            - "Inquiry.${q1_id}.status == ASSESSED"

      - name: placement_residency_and_billing_axes_advance_independently
        grounds:
          - entities.Placement.fields.residency_status
          - entities.Placement.fields.billing_status
          - state_machines.Placement.MOVED_IN_to_RESIDENT_CONFIRMED
          - state_machines.Placement.INVOICED_to_PAID
        distinguishing_aspect: |
          PARALLEL DIMENSIONS on Placement: the billing axis runs
          NOT_INVOICED -> INVOICE_DRAFTED -> INVOICED -> PAID while the residency axis is still
          MOVED_IN, and the later residency transition MOVED_IN -> RESIDENT_CONFIRMED leaves
          billing_status at PAID — neither axis gates or resets the other on the same row.
        test_recipe:
          setup:
            - "Logical clock advanced to 2026-06-20T12:00:00Z; Placement P1 is MOVED_IN with final_fee_cents 180583."
            - "Its ReferralInvoice has been issued, accepted and paid in full, so Placement.billing_status is PAID while residency_status is still MOVED_IN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /advisors"
              payload: { full_name: "Ann Reyes", email: "ann@apfm.test", region_code: "TX-AUS", is_va_certified: false, caseload_capacity: 3 }
              as: PlatformAdmin
              captures: { a1_id: $.data.id }
            - call: "POST /communities"
              payload: { name: "Cedar Grove", region_code: "TX-AUS", contract_tier: "PREFERRED", referral_fee_pct: 0.85, tour_slot_capacity: 5, quality_rating: 4.0 }
              as: PlatformAdmin
