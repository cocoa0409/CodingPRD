# =============================================================================
# PRD Benchmark Scaffold — Petting-Zoo & Mobile-Animal Party Operations
# =============================================================================

scenario: |
  964. Petting-Zoo & Mobile-Animal Party: animal roster & event booking, travel & setup,
  health/permit & handwash compliance, staff & ratio, add-on (pony/reptile show),
  weather/cancellation, school/library program, insurance/waiver

domain_name: petting-zoo-mobile-party
api_prefix: /petting-zoo

# =============================================================================
# Complexity Profile (§0.1–§0.4)
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit      # permits, health certs, handwash, waivers, insurance gate every booking
  secondary_archetype: temporal_windowing  # buffered animal rest windows, handler daily capacity, event windows
  complexity_layers:
    - optimistic_concurrency               # OCC on Booking.version for reschedule / add-on attach
    - cascading_side_effects               # health-FAIL quarantine cascade (depth 3+), cancel release cascade (depth 2)
    - dual_variant_calculation             # provisional quote vs final invoice; screening vs audited compliance score
    - derived_field_reconciliation         # Booking quote fields, Handler.scheduled_minutes_total, Animal cert expiry
  entity_topology: flat                    # peer entities joined by FK references; no nested ownership tree in URLs beyond sub-resource reads
  state_machine_shape: cyclic              # Booking CONFIRMED<->WEATHER_HOLD loop; Permit DENIED->SUBMITTED re-application loop
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties        # permit submitter (Coordinator) cannot be permit decider (ComplianceOfficer) with same operator id
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Customer contact email; unique across customers" }
      - { name: full_name, type: string, source: input, description: "Customer full name" }
      - { name: customer_type, type: enum, source: input, description: "PRIVATE | SCHOOL | LIBRARY" }

  - name: Venue
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; owning customer, taken from X-User-ID at creation" }
      - { name: name, type: string, source: input, description: "Venue display name" }
      - { name: address, type: string, source: input, description: "Street address of the event site" }
      - { name: venue_type, type: enum, source: input, description: "INDOOR | OUTDOOR | MIXED" }
      - { name: water_access, type: boolean, source: input, description: "Whether the venue has potable water access for animal care" }
      - { name: surface_type, type: enum, source: input, description: "GRASS | PAVEMENT | INDOOR_FLOOR" }
      - { name: travel_zone, type: enum, source: input, description: "ZONE_A | ZONE_B | ZONE_C — dispatch distance band from base" }
      - { name: distance_miles, type: integer, source: input, description: "One-way road miles from operator base to venue" }
      - { name: max_guest_capacity, type: integer, source: input, description: "Maximum guests the venue may host" }
      - { name: requires_animal_permit, type: boolean, source: input, description: "Whether the jurisdiction requires an ANIMAL_EXHIBITION permit" }
      - { name: requires_handwash_stations, type: boolean, source: input, description: "Whether health code requires handwash stations at this venue" }

  - name: Animal
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Animal display name" }
      - { name: species, type: enum, source: input, description: "GOAT | SHEEP | PONY | RABBIT | CHICKEN | REPTILE" }
      - { name: weight_class, type: enum, source: input, description: "SMALL | MEDIUM | LARGE — drives trailer and compliance load" }
      - { name: temperament_tier, type: integer, source: input, description: "1 (skittish) to 3 (calmest); tier-3 animals reduce compliance load", constraints: "1 <= temperament_tier <= 3" }
      - { name: base_event_fee_cents, type: integer, source: input, description: "Base per-event fee for this animal before weekend multiplier" }
      - { name: rest_buffer_hours, type: integer, source: input, default: 4, description: "Rest hours blocked before and after each confirmed event window" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | QUARANTINE | RETIRED", default: "AVAILABLE" }
      - { name: current_health_cert_expires_at, type: datetime, source: computed, description: "max(valid_until) over the animal's PASS HealthRecords; null when no PASS record exists" }

  - name: HealthRecord
    parent: Animal
    common_fields: false
    fields:
      - { name: animal_id, type: string, source: system, description: "FK -> Animal.id; from path" }
      - { name: exam_date, type: datetime, source: input, description: "When the veterinary exam occurred" }
      - { name: result, type: enum, source: input, description: "PASS | FAIL" }
      - { name: valid_until, type: datetime, source: input, description: "Certification validity horizon; ignored for FAIL results" }
      - { name: notes, type: string, source: input, description: "Free-text vet notes", default: "" }

  - name: Handler
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Handler display name" }
      - { name: certifications, type: array, source: input, description: "Array of enum REPTILE_CERTIFIED | PONY_RIDE_CERTIFIED | FIRST_AID" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE", default: "ACTIVE" }
      - { name: scheduled_minutes_total, type: integer, source: computed, default: 0, description: "Sum of event durations (minutes) over all ASSIGNED StaffAssignments; recomputed on every assign/release cascade" }

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; booking owner, taken from X-User-ID at creation" }
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; event site" }
      - { name: start_time, type: datetime, source: input, description: "Event window start (ISO8601 UTC)" }
      - { name: end_time, type: datetime, source: input, description: "Event window end (ISO8601 UTC); must be after start_time" }
      - { name: guest_count, type: integer, source: input, description: "Expected total guests" }
      - { name: child_guest_count, type: integer, source: input, description: "Expected child guests; equals required waiver signatures" }
      - { name: booking_type, type: enum, source: input, description: "PRIVATE_PARTY | SCHOOL_PROGRAM | LIBRARY_PROGRAM" }
      - { name: planned_handwash_stations, type: integer, source: input, description: "Handwash stations the customer plans to have on site" }
      - { name: status, type: enum, source: system, description: "DRAFT | QUOTED | CONFIRMED | WEATHER_HOLD | EN_ROUTE | ON_SITE_SETUP | IN_PROGRESS | COMPLETED | INVOICED | CANCELLED_CUSTOMER | CANCELLED_WEATHER | CANCELLED_COMPLIANCE", default: "DRAFT" }
      - { name: payment_status, type: enum, source: system, description: "UNPAID | DEPOSIT_PAID | PAID_IN_FULL | REFUND_PARTIAL | REFUND_FULL | FORFEITED", default: "UNPAID" }
      - { name: quote_fresh, type: boolean, source: computed, default: false, description: "True after quote until any roster/add-on/schedule mutation; confirm requires true" }
      - { name: animal_subtotal_cents, type: integer, source: computed, description: "Sum of per-line rounded animal fees at last quote" }
      - { name: addon_subtotal_cents, type: integer, source: computed, description: "Sum of add-on fees at last quote" }
      - { name: discount_cents, type: integer, source: computed, description: "Institutional discount at last quote (0 for PRIVATE_PARTY)" }
      - { name: surcharge_cents, type: integer, source: computed, description: "Liability surcharge at last quote" }
      - { name: travel_fee_cents, type: integer, source: computed, description: "Travel & setup fee at last quote" }
      - { name: guest_surcharge_cents, type: integer, source: computed, description: "Guest-count tier surcharge at last quote" }
      - { name: quoted_total_cents, type: integer, source: computed, description: "Provisional total at last quote" }
      - { name: final_total_cents, type: integer, source: computed, description: "Finalized total set by finalize-invoice; null before" }
      - { name: deposit_amount_cents, type: integer, source: computed, description: "round_half_up(0.30 * quoted_total_cents)" }
      - { name: total_paid_cents, type: integer, source: computed, default: 0, description: "Sum of PAYMENT LedgerEntry amounts for this booking" }
      - { name: required_handwash_stations, type: integer, source: computed, description: "Required stations at last quote (see handwash_requirement)" }
      - { name: required_staff_count, type: integer, source: computed, description: "Required staff at last quote (see staff_requirement)" }
      - { name: compliance_screening_score, type: integer, source: computed, description: "Screening-variant compliance score computed at quote" }
      - { name: compliance_audited_score, type: integer, source: computed, description: "Audited-variant compliance score recomputed at complete; null before" }
      - { name: actual_handwash_stations, type: integer, source: system, description: "Stations actually deployed, recorded at start-event; null before" }
      - { name: actual_attendance_count, type: integer, source: system, description: "Actual guests attended, recorded at complete; null before" }

  - name: BookingAnimal
    parent: Booking
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: system, description: "FK -> Booking.id; from path" }
      - { name: animal_id, type: string, source: input, description: "FK -> Animal.id; rostered animal attached to the booking" }
      - { name: role, type: enum, source: input, description: "PETTING_ZOO | PONY_RIDE | REPTILE_SHOW" }
      - { name: status, type: enum, source: system, description: "PROPOSED | CONFIRMED | REMOVED", default: "PROPOSED" }
      - { name: removal_reason, type: enum, source: system, description: "MANUAL | QUARANTINE | RETIRED | BOOKING_CANCELLED; null unless REMOVED" }

  - name: StaffAssignment
    parent: Booking
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: system, description: "FK -> Booking.id; from path" }
      - { name: handler_id, type: string, source: input, description: "FK -> Handler.id; assigned staff member" }
      - { name: role, type: enum, source: input, description: "LEAD | ASSISTANT" }
      - { name: status, type: enum, source: system, description: "ASSIGNED | RELEASED | COMPLETED", default: "ASSIGNED" }
      - { name: release_reason, type: enum, source: system, description: "MANUAL | BOOKING_CANCELLED; null unless RELEASED" }

  - name: AddOnRequest
    parent: Booking
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: system, description: "FK -> Booking.id; from path" }
      - { name: addon_type, type: enum, source: input, description: "PONY_RIDE | REPTILE_SHOW" }
      - { name: duration_minutes, type: integer, source: input, description: "Requested add-on duration in minutes" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | DENIED | REMOVED", default: "REQUESTED" }
      - { name: denial_reason, type: string, source: system, description: "Coordinator note when DENIED; null otherwise" }

  - name: Permit
    parent: Booking
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: system, description: "FK -> Booking.id; from path" }
      - { name: permit_type, type: enum, source: input, description: "ANIMAL_EXHIBITION | HEALTH_DEPT | FIRE_SAFETY" }
      - { name: jurisdiction, type: string, source: input, description: "Issuing jurisdiction label" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ISSUED | DENIED", default: "DRAFT" }
      - { name: submitted_by_user_id, type: string, source: system, description: "Opaque operator id captured from X-User-ID at submit" }
      - { name: decided_by_user_id, type: string, source: system, description: "Opaque operator id captured from X-User-ID at decide" }
      - { name: denial_reason, type: string, source: system, description: "Reason recorded on DENIED; cleared to null on resubmission" }

  - name: Waiver
    parent: Booking
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: system, description: "FK -> Booking.id; one waiver auto-created per booking at creation" }
      - { name: required_signatures, type: integer, source: computed, description: "Equals booking.child_guest_count at creation" }
      - { name: signed_count, type: integer, source: system, default: 0, description: "Guardian signatures collected; incremented by waiver-signatures" }
      - { name: status, type: enum, source: system, description: "PENDING | PARTIAL | COMPLETE — derived from signed_count vs required_signatures" }

  - name: InsuranceCertificate
    parent: Customer
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; from path" }
      - { name: provider, type: string, source: input, description: "Insurance provider name" }
      - { name: policy_number, type: string, source: input, description: "Policy identifier" }
      - { name: coverage_amount_cents, type: integer, source: input, description: "Liability coverage amount" }
      - { name: expires_at, type: datetime, source: input, description: "Coverage expiry; must extend past event end to count at confirm" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | VERIFIED | REJECTED", default: "SUBMITTED" }

  - name: WeatherAssessment
    parent: Booking
    common_fields: false
    fields:
      - { name: booking_id, type: string, source: system, description: "FK -> Booking.id; from path" }
      - { name: assessed_at, type: datetime, source: input, description: "When the forecast reading was taken (must be within 24h of now to justify a hold)" }
      - { name: forecast_temp_f, type: integer, source: input, description: "Forecast temperature in Fahrenheit for the event window" }
      - { name: forecast_precip_pct, type: integer, source: input, description: "Forecast precipitation probability 0-100" }
      - { name: wind_mph, type: integer, source: input, description: "Forecast sustained wind speed" }
      - { name: verdict, type: enum, source: input, description: "PROCEED | HOLD_RECOMMENDED | MANDATORY_HOLD" }

  - name: LedgerEntry
    parent: Booking
    common_fields: false
    fields:
      - { name: booking_id, type: string, source: system, description: "FK -> Booking.id; from path" }
      - { name: entry_type, type: enum, source: system, description: "PAYMENT | REFUND | FORFEIT | PENALTY | CHARGE" }
      - { name: amount_cents, type: integer, source: system, description: "Unsigned amount; direction implied by entry_type" }
      - { name: description, type: string, source: system, description: "Human-readable ledger memo" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Booking
    initial_state: DRAFT
    terminal_states: [INVOICED, CANCELLED_CUSTOMER, CANCELLED_WEATHER, CANCELLED_COMPLIANCE]
    transitions:
      - from: DRAFT
        to: QUOTED
        trigger: "POST /petting-zoo/bookings/{id}/quote"
        actor: Coordinator
        preconditions: []
        side_effects:
          - "Recompute all quote fields per booking_price (provisional variant), travel_setup_fee, line_item_rounding, institutional_discount_surcharge_order, guest tier, handwash_requirement, staff_requirement, compliance_score (screening variant)"
          - "deposit_amount_cents = round_half_up(0.30 * quoted_total_cents)"
          - "quote_fresh = true; Booking.version += 1"
      - from: QUOTED
        to: QUOTED
        trigger: "POST /petting-zoo/bookings/{id}/quote"
        actor: Coordinator
        preconditions: []
        side_effects:
          - "Re-quote with identical recomputation; quote_fresh = true; Booking.version += 1"
      - from: QUOTED
        to: CONFIRMED
        trigger: "POST /petting-zoo/bookings/{id}/confirm"
        actor: Customer
        preconditions:
          - "compliance_screening_score >= 60 (ERR_COMPLIANCE_SCORE_TOO_LOW)"
          - "planned_handwash_stations >= required_handwash_stations (ERR_HANDWASH_STATIONS_INSUFFICIENT)"
          - "every required permit type has an ISSUED Permit: ANIMAL_EXHIBITION if venue.requires_animal_permit, plus HEALTH_DEPT if booking_type IN {SCHOOL_PROGRAM, LIBRARY_PROGRAM} (ERR_PERMIT_NOT_ISSUED)"
          - "at least one BookingAnimal in CONFIRMED (ERR_NO_ANIMALS_CONFIRMED)"
          - "guest_count <= venue.max_guest_capacity (ERR_VENUE_CAPACITY_EXCEEDED)"
          - "start_time >= now + 48h (ERR_EVENT_TOO_SOON)"
          - "quote_fresh == true (ERR_QUOTE_STALE)"
          - "customer has a VERIFIED InsuranceCertificate with coverage_amount_cents >= required coverage (500000 PRIVATE_PARTY, 1000000 SCHOOL_PROGRAM/LIBRARY_PROGRAM) and expires_at > end_time (ERR_INSURANCE_NOT_VERIFIED)"
          - "total_paid_cents >= deposit_amount_cents (ERR_DEPOSIT_INSUFFICIENT)"
        side_effects:
          - "Booking.version += 1"
      - from: CONFIRMED
        to: CONFIRMED
        trigger: "POST /petting-zoo/bookings/{id}/reschedule"
        actor: Customer
        preconditions:
          - "expected_booking_version == Booking.version (ERR_STALE_BOOKING_VERSION, 412)"
          - "new_start_time > now (ERR_EVENT_IN_PAST) and new_start_time >= now + 48h (ERR_EVENT_TOO_SOON)"
          - "re-run animal buffered-window and handler capacity checks against the new window for all CONFIRMED BookingAnimals and ASSIGNED StaffAssignments (ERR_ANIMAL_SCHEDULE_CONFLICT / ERR_HANDLER_OVERBOOKED)"
        side_effects:
          - "start_time/end_time replaced; quote_fresh = false; Booking.version += 1"
      - from: WEATHER_HOLD
        to: CONFIRMED
        trigger: "POST /petting-zoo/bookings/{id}/reschedule"
        actor: Coordinator
        preconditions:
          - "same as CONFIRMED->CONFIRMED reschedule"
        side_effects:
          - "start_time/end_time replaced; quote_fresh = false; Booking.version += 1"
      - from: CONFIRMED
        to: WEATHER_HOLD
        trigger: "POST /petting-zoo/bookings/{id}/weather-hold"
        actor: Coordinator
        preconditions:
          - "weather_assessment_id references a WeatherAssessment of this booking (existence)"
          - "assessment.assessed_at >= now - 24h (ERR_ASSESSMENT_STALE)"
          - "assessment.verdict == MANDATORY_HOLD (ERR_WEATHER_HOLD_NOT_JUSTIFIED)"
        side_effects:
          - "Booking.version += 1"
      - from: WEATHER_HOLD
        to: CONFIRMED
        trigger: "POST /petting-zoo/bookings/{id}/release-weather-hold"
        actor: Coordinator
        preconditions: []
        side_effects:
          - "Booking.version += 1"
      - from: CONFIRMED
        to: EN_ROUTE
        trigger: "POST /petting-zoo/bookings/{id}/dispatch"
        actor: Coordinator
        preconditions:
          - "waiver.status == COMPLETE (ERR_WAIVER_INCOMPLETE)"
          - "count(StaffAssignment status ASSIGNED) >= required_staff_count (ERR_STAFF_RATIO_NOT_MET)"
          - "total_paid_cents >= quoted_total_cents (ERR_BALANCE_UNPAID)"
        side_effects:
          - "Booking.version += 1"
      - from: EN_ROUTE
        to: ON_SITE_SETUP
        trigger: "POST /petting-zoo/bookings/{id}/arrive"
        actor: Coordinator
        preconditions: []
        side_effects:
          - "Booking.version += 1"
      - from: ON_SITE_SETUP
        to: IN_PROGRESS
        trigger: "POST /petting-zoo/bookings/{id}/start-event"
        actor: Coordinator
        preconditions:
          - "actual_handwash_stations >= required_handwash_stations (ERR_HANDWASH_STATIONS_INSUFFICIENT)"
        side_effects:
          - "actual_handwash_stations recorded; Booking.version += 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /petting-zoo/bookings/{id}/complete"
        actor: Coordinator
        preconditions: []
        side_effects:
          - "actual_attendance_count recorded"
          - "Recompute compliance_score (audited variant) into compliance_audited_score"
          - "All ASSIGNED StaffAssignments -> COMPLETED; Handler.scheduled_minutes_total recomputed (durations of COMPLETED assignments are no longer counted)"
          - "Booking.version += 1"
      - from: COMPLETED
        to: INVOICED
        trigger: "POST /petting-zoo/bookings/{id}/finalize-invoice"
        actor: Coordinator
        preconditions: []
        side_effects:
          - "Compute final_total_cents per booking_price (final variant)"
          - "Create LedgerEntry CHARGE amount = final_total_cents"
          - "If total_paid_cents > final_total_cents: create LedgerEntry REFUND amount = total_paid_cents - final_total_cents and set payment_status = REFUND_PARTIAL"
          - "Else if total_paid_cents == final_total_cents: payment_status = PAID_IN_FULL"
          - "Booking.version += 1"
      - from: DRAFT
        to: CANCELLED_CUSTOMER
        trigger: "POST /petting-zoo/bookings/{id}/cancel reason=CUSTOMER"
        actor: Customer
        preconditions:
          - "reason == CUSTOMER when actor is Customer (ERR_FORBIDDEN otherwise)"
        side_effects:
          - "cancellation_refund waterfall (CUSTOMER variant by hours_before = start_time - now)"
          - "cancel cascade: release assignments, remove roster animals, detach add-ons (see cancel cascade below)"
      - from: QUOTED
        to: CANCELLED_CUSTOMER
        trigger: "POST /petting-zoo/bookings/{id}/cancel reason=CUSTOMER"
        actor: Customer
        preconditions:
          - "reason == CUSTOMER when actor is Customer"
        side_effects: ["same cancel cascade + refund waterfall"]
      - from: CONFIRMED
        to: CANCELLED_CUSTOMER
        trigger: "POST /petting-zoo/bookings/{id}/cancel reason=CUSTOMER"
        actor: Customer
        preconditions: ["reason == CUSTOMER when actor is Customer"]
        side_effects: ["same cancel cascade + refund waterfall"]
      - from: WEATHER_HOLD
        to: CANCELLED_CUSTOMER
        trigger: "POST /petting-zoo/bookings/{id}/cancel reason=CUSTOMER"
        actor: Customer
        preconditions: ["reason == CUSTOMER when actor is Customer"]
        side_effects: ["same cancel cascade + refund waterfall"]
      - from: CONFIRMED
        to: CANCELLED_WEATHER
        trigger: "POST /petting-zoo/bookings/{id}/cancel reason=WEATHER"
        actor: Coordinator
        preconditions: ["reason IN {WEATHER, COMPLIANCE} when actor is Coordinator (ERR_FORBIDDEN otherwise)"]
        side_effects:
          - "cancellation_refund WEATHER variant: REFUND = max(0, total_paid_cents - 2500 * count(Permit status IN {SUBMITTED, ISSUED})); FORFEIT = remainder"
          - "same cancel cascade"
      - from: WEATHER_HOLD
        to: CANCELLED_WEATHER
        trigger: "POST /petting-zoo/bookings/{id}/cancel reason=WEATHER"
        actor: Coordinator
        preconditions: []
        side_effects: ["same WEATHER refund + cancel cascade"]
      - from: CONFIRMED
        to: CANCELLED_COMPLIANCE
        trigger: "POST /petting-zoo/bookings/{id}/cancel reason=COMPLIANCE, or system cascade when last CONFIRMED BookingAnimal is removed"
        actor: Coordinator
        preconditions: []
        side_effects:
          - "cancellation_refund COMPLIANCE variant: REFUND 0; FORFEIT = total_paid_cents; PENALTY = round_half_up(0.20 * quoted_total_cents); payment_status = FORFEITED"
          - "same cancel cascade"
        note: "The system-triggered path fires from the health-FAIL quarantine cascade (see Animal machine), giving a depth-3 chain: HealthRecord FAIL -> Animal QUARANTINE -> BookingAnimal REMOVED -> Booking CANCELLED_COMPLIANCE with ledger entries."
    note: "Cancel cascade (shared): every ASSIGNED StaffAssignment -> RELEASED with release_reason=BOOKING_CANCELLED, and each release recomputes Handler.scheduled_minutes_total (link 2 of the cancel cascade); every PROPOSED/CONFIRMED BookingAnimal -> REMOVED with removal_reason=BOOKING_CANCELLED; every REQUESTED/APPROVED AddOnRequest -> REMOVED; quote_fresh = false; Booking.version += 1. Refund waterfall: REFUND/FORFEIT LedgerEntries per variant; payment_status becomes REFUND_FULL (refund == paid > 0), REFUND_PARTIAL (0 < refund < paid), FORFEITED (refund == 0 and paid > 0), unchanged UNPAID (paid == 0, no entries created)."

  - entity: Animal
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    transitions:
      - from: AVAILABLE
        to: QUARANTINE
        trigger: "POST /petting-zoo/animals/{id}/health-records with result=FAIL"
        actor: Veterinarian
        preconditions: []
        side_effects:
          - "Cascade link 1: Animal -> QUARANTINE"
          - "Cascade link 2: every BookingAnimal ba with ba.animal_id == this animal, ba.status IN {PROPOSED, CONFIRMED}, parent Booking.status NOT IN {INVOICED, CANCELLED_CUSTOMER, CANCELLED_WEATHER, CANCELLED_COMPLIANCE} -> REMOVED with removal_reason=QUARANTINE; each affected Booking.quote_fresh = false and Booking.version += 1"
          - "Cascade link 3: if such a parent Booking is CONFIRMED and its remaining CONFIRMED BookingAnimal count is 0, that Booking -> CANCELLED_COMPLIANCE with the COMPLIANCE refund variant (FORFEIT = total_paid_cents, PENALTY = round_half_up(0.20 * quoted_total_cents), payment_status = FORFEITED) and the shared cancel cascade"
      - from: QUARANTINE
        to: AVAILABLE
        trigger: "POST /petting-zoo/animals/{id}/health-records with result=PASS"
        actor: Veterinarian
        preconditions: []
        side_effects:
          - "current_health_cert_expires_at recomputed as max(valid_until) over PASS records"
      - from: AVAILABLE
        to: RETIRED
        trigger: "POST /petting-zoo/animals/{id}/retire"
        actor: Operator
        preconditions: []
        side_effects:
          - "Same BookingAnimal removal cascade as quarantine with removal_reason=RETIRED, but no Booking auto-cancel (confirmed bookings keep operating with remaining animals)"
      - from: QUARANTINE
        to: RETIRED
        trigger: "POST /petting-zoo/animals/{id}/retire"
        actor: Operator
        preconditions: []
        side_effects: []
      - from: AVAILABLE
        to: AVAILABLE
        trigger: "POST /petting-zoo/animals/{id}/health-records with result=PASS"
        actor: Veterinarian
        preconditions: []
        side_effects:
          - "current_health_cert_expires_at recomputed as max(valid_until) over PASS records"

  - entity: BookingAnimal
    initial_state: PROPOSED
    terminal_states: [REMOVED]
    transitions:
      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST /petting-zoo/bookings/{id}/animals/{bookingAnimalId}/confirm"
        actor: Coordinator
        preconditions:
          - "parent Booking.status IN {DRAFT, QUOTED} (ERR_INVALID_STATE)"
          - "Animal.status == AVAILABLE (ERR_ANIMAL_QUARANTINED)"
          - "Animal.current_health_cert_expires_at is not null and > parent Booking.end_time (ERR_HEALTH_CERT_EXPIRED)"
          - "animal buffered-window check per animal_rest_window (ERR_ANIMAL_SCHEDULE_CONFLICT)"
        side_effects:
          - "parent Booking.quote_fresh = false; Booking.version += 1"
      - from: PROPOSED
        to: REMOVED
        trigger: "DELETE /petting-zoo/bookings/{id}/animals/{bookingAnimalId} (MANUAL) or quarantine/retire/cancel cascades"
        actor: Coordinator
        preconditions: []
        side_effects:
          - "removal_reason set; parent Booking.quote_fresh = false; Booking.version += 1"
      - from: CONFIRMED
        to: REMOVED
        trigger: "DELETE /petting-zoo/bookings/{id}/animals/{bookingAnimalId} (MANUAL) or cascades"
        actor: Coordinator
        preconditions:
          - "MANUAL removal requires parent Booking.status IN {DRAFT, QUOTED} (ERR_INVALID_STATE)"
        side_effects:
          - "removal_reason set; parent Booking.quote_fresh = false; Booking.version += 1"

  - entity: StaffAssignment
    initial_state: ASSIGNED
    terminal_states: [RELEASED, COMPLETED]
    transitions:
      - from: ASSIGNED
        to: RELEASED
        trigger: "DELETE /petting-zoo/bookings/{id}/staff-assignments/{staffAssignmentId} (MANUAL) or booking cancel cascade (BOOKING_CANCELLED)"
        actor: Coordinator
        preconditions:
          - "MANUAL release requires parent Booking.status IN {DRAFT, QUOTED, CONFIRMED, WEATHER_HOLD} (ERR_INVALID_STATE)"
        side_effects:
          - "release_reason set; Handler.scheduled_minutes_total recomputed (decremented by parent booking event duration)"
      - from: ASSIGNED
        to: COMPLETED
        trigger: "parent Booking IN_PROGRESS -> COMPLETED"
        actor: system
        preconditions: []
        side_effects:
          - "Handler.scheduled_minutes_total recomputed (COMPLETED assignments no longer counted)"

  - entity: AddOnRequest
    initial_state: REQUESTED
    terminal_states: [DENIED, REMOVED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /petting-zoo/bookings/{id}/add-ons/{addOnRequestId}/decide decision=APPROVED"
        actor: Coordinator
        preconditions:
          - "REPTILE_SHOW requires at least one ASSIGNED StaffAssignment whose Handler.certifications contains REPTILE_CERTIFIED (ERR_NO_CERTIFIED_HANDLER)"
          - "PONY_RIDE requires venue.venue_type IN {OUTDOOR, MIXED} (ERR_ADDON_VENUE_INCOMPATIBLE)"
        side_effects:
          - "parent Booking.quote_fresh = false"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /petting-zoo/bookings/{id}/add-ons/{addOnRequestId}/decide decision=DENIED"
        actor: Coordinator
        preconditions: []
        side_effects:
          - "denial_reason recorded"
      - from: REQUESTED
        to: REMOVED
        trigger: "booking cancel cascade"
        actor: system
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: REMOVED
        trigger: "booking cancel cascade"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Permit
    initial_state: DRAFT
    terminal_states: [ISSUED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /petting-zoo/permits/{id}/submit"
        actor: Coordinator
        preconditions:
          - "parent Booking.start_time - now >= 336h (14 days) (ERR_PERMIT_LEAD_TIME)"
        side_effects:
          - "submitted_by_user_id = X-User-ID of the submitter"
      - from: DENIED
        to: SUBMITTED
        trigger: "POST /petting-zoo/permits/{id}/submit"
        actor: Coordinator
        preconditions:
          - "parent Booking.start_time - now >= 336h (ERR_PERMIT_LEAD_TIME)"
        side_effects:
          - "denial_reason cleared to null; submitted_by_user_id refreshed"
        note: "Re-application cycle DENIED -> SUBMITTED -> {ISSUED, DENIED}"
      - from: SUBMITTED
        to: ISSUED
        trigger: "POST /petting-zoo/permits/{id}/decide decision=ISSUED"
        actor: ComplianceOfficer
        preconditions:
          - "decision-maker X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTY)"
        side_effects:
          - "decided_by_user_id = X-User-ID of the decider"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /petting-zoo/permits/{id}/decide decision=DENIED"
        actor: ComplianceOfficer
        preconditions:
          - "decision-maker X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTY)"
        side_effects:
          - "denial_reason recorded; decided_by_user_id set"

  - entity: InsuranceCertificate
    initial_state: SUBMITTED
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /petting-zoo/insurance-certificates/{id}/verify decision=VERIFIED"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /petting-zoo/insurance-certificates/{id}/verify decision=REJECTED"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []

  - entity: Waiver
    initial_state: PENDING
    terminal_states: [COMPLETE]
    transitions:
      - from: PENDING
        to: PARTIAL
        trigger: "POST /petting-zoo/bookings/{id}/waiver-signatures with 0 < signed_count < required_signatures after increment"
        actor: Customer
        preconditions:
          - "signed_count + count <= required_signatures (ERR_WAIVER_SIGNATURE_OVERFLOW)"
        side_effects: []
      - from: PENDING
        to: COMPLETE
        trigger: "POST /petting-zoo/bookings/{id}/waiver-signatures reaching signed_count == required_signatures, or required_signatures == 0 at creation"
        actor: Customer
        preconditions: []
        side_effects: []
      - from: PARTIAL
        to: COMPLETE
        trigger: "POST /petting-zoo/bookings/{id}/waiver-signatures reaching signed_count == required_signatures"
        actor: Customer
        preconditions:
          - "signed_count + count <= required_signatures (ERR_WAIVER_SIGNATURE_OVERFLOW)"
        side_effects: []
    note: "Compound machine: status is derived from signed_count vs required_signatures after each increment."

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC on Booking.version)
# =============================================================================
concurrency_rules:
  - rule_id: booking-reschedule-stale-version
    parent_entity: Booking
    write_endpoint: "POST /petting-zoo/bookings/{id}/reschedule"
    occ_field: expected_booking_version
    description: |
      Rescheduling a Booking whose version has advanced since the client last
      observed it is rejected: another writer may already have rescheduled or
      otherwise legitimately mutated the booking, making this writer's schedule
      view stale.
    error_id: ERR_STALE_BOOKING_VERSION
    http_status: 412
  - rule_id: addon-attach-stale-quote
    parent_entity: Booking
    write_endpoint: "POST /petting-zoo/bookings/{id}/add-ons"
    occ_field: expected_booking_version
    description: |
      Attaching an AddOnRequest supersedes the booking's current quote; if the
      Booking version has advanced since the client last observed it, the
      client is pricing against a stale roster and the attach is rejected.
    error_id: ERR_STALE_BOOKING_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: booking_price
    trigger: "POST /bookings/{id}/quote (provisional variant) and POST /bookings/{id}/finalize-invoice (final variant)"
    algorithm: tiered_pricing
    formula: |
      Evaluation order is pinned and MUST be followed exactly:
      (1) animal_lines: for each in-scope BookingAnimal, line = base_event_fee_cents
          of the Animal; if the event's calendar date (start_time, UTC) is Saturday
          or Sunday, line = round_half_up(base_event_fee_cents * 1.15).
          animal_subtotal_cents = sum of the per-line rounded values
          (see line_item_rounding — round per line, then sum).
      (2) addon_subtotal_cents = sum of add-on fees for in-scope AddOnRequests:
          PONY_RIDE: 12000 flat for duration_minutes <= 60, else 12000 + 200 * (duration_minutes - 60);
          REPTILE_SHOW: 15000 flat for duration_minutes <= 45, else 15000 + 250 * (duration_minutes - 45).
      (3) subtotal = animal_subtotal_cents + addon_subtotal_cents
      (4) discount_cents = round_half_up(0.15 * subtotal) if booking_type IN
          {SCHOOL_PROGRAM, LIBRARY_PROGRAM} else 0
          (see institutional_discount_surcharge_order — discount is computed on the
          subtotal BEFORE the surcharge; the surcharge is computed on subtotal - discount).
      (5) surcharge_cents = round_half_up(0.03 * (subtotal - discount_cents))
      (6) travel_fee_cents = travel_setup_fee(zone, distance_miles, surface_type,
          in-scope animal count)
      (7) guest_surcharge_cents = tier(in-scope guests):
          <= 20 -> 0; 21..50 -> 1500; 51..100 -> 3500; > 100 -> 6000
          (boundary is inclusive at the lower edge: 21 belongs to the 1500 tier).
      (8) total = subtotal - discount_cents + surcharge_cents + travel_fee_cents + guest_surcharge_cents
    input_set: |
      Provisional variant (quote): BookingAnimals status IN {PROPOSED, CONFIRMED};
      AddOnRequests status IN {REQUESTED, APPROVED}; guests = booking.guest_count.
      Final variant (finalize-invoice): BookingAnimals status == CONFIRMED (REMOVED
      excluded); AddOnRequests status == APPROVED; guests = booking.actual_attendance_count.
    constants:
      WEEKEND_MULTIPLIER: 1.15
      INSTITUTIONAL_DISCOUNT_RATE: 0.15
      LIABILITY_SURCHARGE_RATE: 0.03
      PONY_RIDE_FLAT_CENTS: 12000
      PONY_RIDE_INCLUDED_MIN: 60
      PONY_RIDE_OVERAGE_PER_MIN: 200
      REPTILE_SHOW_FLAT_CENTS: 15000
      REPTILE_SHOW_INCLUDED_MIN: 45
      REPTILE_SHOW_OVERAGE_PER_MIN: 250
    precision: "integer cents; round_half_up at each pinned rounding point"
    variants:
      - name: provisional
        when: "POST /bookings/{id}/quote"
        difference: "Counts PROPOSED roster animals and REQUESTED add-ons; guest tier uses booked guest_count; result stored in quoted_total_cents"
      - name: final
        when: "POST /bookings/{id}/finalize-invoice"
        difference: "Counts only CONFIRMED non-REMOVED animals and APPROVED add-ons; guest tier uses actual_attendance_count; result stored in final_total_cents — same nominal booking can price differently"

  - name: line_item_rounding
    trigger: "inside booking_price step (1)"
    algorithm: aggregation
    formula: |
      Each animal line is rounded individually: line_i = round_half_up(base_i * 1.15)
      on weekend events (or base_i unchanged on weekdays); animal_subtotal_cents =
      sum(line_i). The pinned order is ROUND-PER-LINE-THEN-SUM. The alternative
      (sum base fees, multiply, then round once) yields different cents and is
      forbidden: e.g. three animals at 3343 on a weekend give 3 * round_half_up(3844.45)
      = 11532 under the pinned order, but round_half_up(10029 * 1.15) = 11533 under
      sum-then-round.
    input_set: "in-scope BookingAnimals per booking_price variant"
    constants:
      WEEKEND_MULTIPLIER: 1.15
    precision: "integer cents, round_half_up per line"

  - name: travel_setup_fee
    trigger: "inside booking_price step (6)"
    algorithm: tiered_pricing
    formula: |
      zone_base and included miles: ZONE_A -> (5000, 25); ZONE_B -> (9000, 50);
      ZONE_C -> (14000, 100).
      overage_miles = max(0, distance_miles - included_miles(zone))
      trailer_count = max(1, ceil(animal_count / 6))
      raw = zone_base(zone) + overage_miles * 85 + trailer_count * 3000
      if venue.surface_type == PAVEMENT: fee = round_half_up(raw * 1.25)
      else: fee = raw
      (>= 3 interacting inputs: zone band, distance overage, trailer capacity,
      conditional surface multiplier — nested max/ceil/conditional.)
    input_set: "venue.travel_zone, venue.distance_miles, venue.surface_type, in-scope animal count per booking_price variant"
    constants:
      ZONE_A_BASE_CENTS: 5000
      ZONE_A_INCLUDED_MI: 25
      ZONE_B_BASE_CENTS: 9000
      ZONE_B_INCLUDED_MI: 50
      ZONE_C_BASE_CENTS: 14000
      ZONE_C_INCLUDED_MI: 100
      OVERAGE_RATE_CENTS_PER_MI: 85
      TRAILER_CAPACITY_ANIMALS: 6
      TRAILER_FEE_CENTS: 3000
      HARD_SURFACE_MULTIPLIER: 1.25
    precision: "integer cents, round_half_up after surface multiplier only"

  - name: institutional_discount_surcharge_order
    trigger: "inside booking_price steps (4)-(5)"
    algorithm: constraint_propagation
    formula: |
      The dependency looks circular (surcharge applies to the discounted amount,
      discount applies to the subtotal that the surcharge conceptually inflates)
      and is pinned as a strict evaluation order:
      discount_cents = round_half_up(0.15 * subtotal) for SCHOOL_PROGRAM /
      LIBRARY_PROGRAM bookings, else 0 — computed FIRST from the raw subtotal
      (animals + add-ons only; travel and guest surcharge are never discounted);
      surcharge_cents = round_half_up(0.03 * (subtotal - discount_cents)) —
      computed SECOND from the discounted subtotal.
      Reversed order (surcharge on raw subtotal, discount on subtotal + surcharge)
      yields a different total and is forbidden: subtotal 29000 gives
      discount 4350 / surcharge 740 / net adder 5690 under the pinned order vs
      4481 / 870 / 5690-1 = 5689 net under reversed order.
    input_set: "booking.booking_type, animal_subtotal_cents, addon_subtotal_cents"
    constants:
      INSTITUTIONAL_DISCOUNT_RATE: 0.15
      LIABILITY_SURCHARGE_RATE: 0.03
    precision: "integer cents, round_half_up at each step"

  - name: deposit_amount
    trigger: "POST /bookings/{id}/quote"
    algorithm: threshold
    formula: |
      deposit_amount_cents = round_half_up(0.30 * quoted_total_cents).
      Half-cent cases round UP: quoted_total_cents 34375 -> 0.30 * 34375 = 10312.5
      -> deposit 10313.
    input_set: "quoted_total_cents"
    constants:
      DEPOSIT_RATE: 0.30
    precision: "integer cents, round_half_up"

  - name: cancellation_refund
    trigger: "POST /bookings/{id}/cancel"
    algorithm: waterfall_allocation
    formula: |
      hours_before = (start_time - now) in hours (exact fractional compare).
      CUSTOMER variant tiers (boundary is >=):
        hours_before >= 168 -> refund = 100% of total_paid_cents (no FORFEIT entry)
        72 <= hours_before < 168 -> refund = round_half_up(0.75 * total_paid_cents)
        24 <= hours_before < 72  -> refund = round_half_up(0.50 * total_paid_cents)
        hours_before < 24        -> refund = 0
      FORFEIT entry = total_paid_cents - refund (omitted when 0).
      Exactly 72.0 hours before start falls in the 75% tier (>= boundary).
      WEATHER variant: refund = max(0, total_paid_cents - 2500 * count(Permit with
      status IN {SUBMITTED, ISSUED})); FORFEIT = remainder (omitted when 0).
      COMPLIANCE variant: refund = 0; FORFEIT = total_paid_cents (omitted when 0);
      plus PENALTY entry = round_half_up(0.20 * quoted_total_cents).
      If total_paid_cents == 0, no ledger entries are created for any variant.
    input_set: "booking.start_time, logical clock now, total_paid_cents, Permit statuses, cancel reason"
    constants:
      TIER_FULL_HOURS: 168
      TIER_THREE_QUARTER_HOURS: 72
      TIER_HALF_HOURS: 24
      PERMIT_NONRECOVERABLE_CENTS: 2500
      COMPLIANCE_PENALTY_RATE: 0.20
    precision: "integer cents, round_half_up"
    variants:
      - name: customer_tiered
        when: "reason == CUSTOMER"
        difference: "tiered by hours_before with >= boundaries"
      - name: weather_net_of_permits
        when: "reason == WEATHER"
        difference: "full refund minus non-recoverable permit fees"
      - name: compliance_forfeit
        when: "reason == COMPLIANCE or system cascade"
        difference: "zero refund plus penalty charge"

  - name: compliance_score
    trigger: "POST /bookings/{id}/quote (screening variant) and POST /bookings/{id}/complete (audited variant)"
    algorithm: weighted_scoring
    formula: |
      score = 100
        - 15 per LARGE in-scope animal - 10 per MEDIUM - 5 per SMALL
        - 10 if venue.venue_type == INDOOR
        - 8 if venue.water_access == false
        - 5 * max(0, required_stations - stations_in_scope)
        - floor(max(0, guests_in_scope - 30) / 10)
        + 2 * count(in-scope animals with temperament_tier == 3), capped at +10
      clamped to [0, 100].
      required_stations per handwash_requirement (computed with the same
      variant's guest count).
      Confirm gate: compliance_screening_score >= 60.
    input_set: |
      Screening variant: animals = BookingAnimals status IN {PROPOSED, CONFIRMED};
      stations = planned_handwash_stations; guests = guest_count.
      Audited variant: animals = CONFIRMED non-REMOVED BookingAnimals;
      stations = actual_handwash_stations; guests = actual_attendance_count.
    constants:
      BASE_SCORE: 100
      LARGE_ANIMAL_LOAD: 15
      MEDIUM_ANIMAL_LOAD: 10
      SMALL_ANIMAL_LOAD: 5
      INDOOR_LOAD: 10
      NO_WATER_LOAD: 8
      STATION_SHORTFALL_LOAD: 5
      GUEST_PRESSURE_STEP: 10
      CALM_ANIMAL_BONUS: 2
      CALM_BONUS_CAP: 10
      CONFIRM_GATE: 60
    precision: "integer"
    variants:
      - name: screening
        when: "at quote"
        difference: "planned inputs (proposed roster, planned stations, booked guests) -> compliance_screening_score"
      - name: audited
        when: "at complete"
        difference: "actual inputs (confirmed non-removed roster, deployed stations, actual attendance) -> compliance_audited_score; diverges from screening for the same booking"

  - name: handwash_requirement
    trigger: "POST /bookings/{id}/quote"
    algorithm: threshold
    formula: |
      required_handwash_stations =
        (venue.requires_handwash_stations ? ceil(guests / 20) : 0)
        + (any in-scope AddOnRequest with addon_type == REPTILE_SHOW ? 1 : 0)
      guests = guest_count for the screening/quote context, actual_attendance_count
      for audited/start-event context. Boundary: guests exactly divisible by 20
      require exactly guests/20 stations (40 guests -> 2, 41 -> 3).
    input_set: "venue.requires_handwash_stations, guest count, in-scope add-ons"
    constants:
      GUESTS_PER_STATION: 20
      REPTILE_EXTRA_STATION: 1
    precision: "integer, ceil"

  - name: staff_requirement
    trigger: "POST /bookings/{id}/quote"
    algorithm: threshold
    formula: |
      petting_count = count of in-scope BookingAnimals with role == PETTING_ZOO
      handler_slots = max(1, ceil(petting_count / 4))
        + (any in-scope PONY_RIDE add-on ? 1 : 0)
        + (any in-scope REPTILE_SHOW add-on ? 1 : 0)
      required_staff_count = max(handler_slots, ceil(child_guest_count / 8))
    input_set: "in-scope BookingAnimals and AddOnRequests (quote variant), child_guest_count"
    constants:
      PETTING_ANIMALS_PER_HANDLER: 4
      CHILDREN_PER_STAFF: 8
    precision: "integer, ceil"

  - name: handler_daily_capacity
    trigger: "POST /bookings/{id}/staff-assignments"
    algorithm: threshold
    formula: |
      For the candidate Handler and the parent booking's calendar date (UTC):
      existing = all StaffAssignments with handler_id == candidate, status == ASSIGNED,
      whose parent booking is non-terminal and shares the same calendar date.
      Reject (ERR_HANDLER_OVERBOOKED) if:
        (a) strict overlap: any existing assignment's booking window [s, e) with
            s < new_end and new_start < e (adjacent windows touching at an endpoint
            are allowed), OR
        (b) aggregate capacity: sum of existing event durations (minutes) + new event
            duration > 480. Exactly 480 total minutes is allowed (<= boundary).
    input_set: "ASSIGNED StaffAssignments for the handler on the same UTC date"
    constants:
      DAILY_CAPACITY_MINUTES: 480
    precision: "integer minutes"

  - name: animal_rest_window
    trigger: "POST /bookings/{id}/animals/{bookingAnimalId}/confirm"
    algorithm: interval_merge
    formula: |
      For the candidate Animal, each other CONFIRMED BookingAnimal (parent booking
      non-terminal) occupies the buffered half-open interval
      [start - rest_buffer_hours, end + rest_buffer_hours).
      Reject (ERR_ANIMAL_SCHEDULE_CONFLICT) if the new booking's buffered interval
      intersects any existing one: existing.buffered_start < new.buffered_end AND
      new.buffered_start < existing.buffered_end.
      Touching buffered endpoints (existing.buffered_end == new.buffered_start) do
      NOT conflict.
    input_set: "CONFIRMED BookingAnimals of the same animal on non-terminal bookings"
    constants:
      DEFAULT_REST_BUFFER_HOURS: 4
    precision: "datetime exact compare"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role permitted for endpoint; entity-backed ownership (Customer may only touch own resources); cancel reason allowed for role (Customer: CUSTOMER only; Coordinator: WEATHER/COMPLIANCE only)", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: business_constraint, check: "Request body shape: required fields present, enum values valid, types correct, end_time after start_time", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 4, category: existence, check: "Path and body referenced resources exist, validated left-to-right in path order", error_id: ERR_BOOKING_NOT_FOUND, http_status: 404, applies_to: "endpoints with {id} path params (specific ERR_*_NOT_FOUND per resource)" }
  - { priority: 5, category: state, check: "Target resource in a valid from-state for the requested transition", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action/transition endpoints" }
  - { priority: 6, category: state, check: "expected_booking_version == Booking.version (OCC)", error_id: ERR_STALE_BOOKING_VERSION, http_status: 412, applies_to: "POST /bookings/{id}/reschedule, POST /bookings/{id}/add-ons" }
  - { priority: 7, category: business_safety, check: "compliance_screening_score >= 60 at confirm", error_id: ERR_COMPLIANCE_SCORE_TOO_LOW, http_status: 422, applies_to: "POST /bookings/{id}/confirm" }
  - { priority: 8, category: business_safety, check: "planned (confirm) / actual (start-event) handwash stations >= required_handwash_stations", error_id: ERR_HANDWASH_STATIONS_INSUFFICIENT, http_status: 422, applies_to: "POST /bookings/{id}/confirm, POST /bookings/{id}/start-event" }
  - { priority: 9, category: business_safety, check: "All required permit types ISSUED for the booking", error_id: ERR_PERMIT_NOT_ISSUED, http_status: 422, applies_to: "POST /bookings/{id}/confirm" }
  - { priority: 10, category: business_safety, check: "Animal.status == AVAILABLE when confirming a BookingAnimal", error_id: ERR_ANIMAL_QUARANTINED, http_status: 422, applies_to: "POST /bookings/{id}/animals/{bookingAnimalId}/confirm" }
  - { priority: 11, category: business_safety, check: "Animal.current_health_cert_expires_at not null and > booking.end_time", error_id: ERR_HEALTH_CERT_EXPIRED, http_status: 422, applies_to: "POST /bookings/{id}/animals/{bookingAnimalId}/confirm" }
  - { priority: 12, category: business_safety, check: "Waiver.status == COMPLETE before dispatch", error_id: ERR_WAIVER_INCOMPLETE, http_status: 422, applies_to: "POST /bookings/{id}/dispatch" }
  - { priority: 13, category: business_constraint, check: "At least one CONFIRMED BookingAnimal at confirm", error_id: ERR_NO_ANIMALS_CONFIRMED, http_status: 422, applies_to: "POST /bookings/{id}/confirm" }
  - { priority: 14, category: business_constraint, check: "guest_count <= venue.max_guest_capacity", error_id: ERR_VENUE_CAPACITY_EXCEEDED, http_status: 422, applies_to: "POST /bookings, POST /bookings/{id}/confirm" }
  - { priority: 15, category: business_constraint, check: "Animal buffered rest-window overlap (animal_rest_window)", error_id: ERR_ANIMAL_SCHEDULE_CONFLICT, http_status: 409, applies_to: "POST /bookings/{id}/animals/{bookingAnimalId}/confirm" }
  - { priority: 16, category: business_constraint, check: "Handler strict-overlap and 480-minute daily capacity (handler_daily_capacity)", error_id: ERR_HANDLER_OVERBOOKED, http_status: 409, applies_to: "POST /bookings/{id}/staff-assignments" }
  - { priority: 17, category: business_constraint, check: "ASSIGNED staff count >= required_staff_count at dispatch", error_id: ERR_STAFF_RATIO_NOT_MET, http_status: 422, applies_to: "POST /bookings/{id}/dispatch" }
  - { priority: 18, category: business_constraint, check: "REPTILE_SHOW approval requires an ASSIGNED REPTILE_CERTIFIED handler", error_id: ERR_NO_CERTIFIED_HANDLER, http_status: 422, applies_to: "POST /bookings/{id}/add-ons/{addOnRequestId}/decide" }
  - { priority: 19, category: business_constraint, check: "PONY_RIDE requires venue_type IN {OUTDOOR, MIXED}", error_id: ERR_ADDON_VENUE_INCOMPATIBLE, http_status: 422, applies_to: "POST /bookings/{id}/add-ons/{addOnRequestId}/decide" }
  - { priority: 20, category: business_constraint, check: "waiver signed_count + count <= required_signatures", error_id: ERR_WAIVER_SIGNATURE_OVERFLOW, http_status: 422, applies_to: "POST /bookings/{id}/waiver-signatures" }
  - { priority: 21, category: business_temporal, check: "start_time > now", error_id: ERR_EVENT_IN_PAST, http_status: 422, applies_to: "POST /bookings, POST /bookings/{id}/reschedule" }
  - { priority: 22, category: business_temporal, check: "start_time >= now + 48h", error_id: ERR_EVENT_TOO_SOON, http_status: 422, applies_to: "POST /bookings, POST /bookings/{id}/reschedule, POST /bookings/{id}/confirm" }
  - { priority: 23, category: business_temporal, check: "Permit submission at least 336h before event start", error_id: ERR_PERMIT_LEAD_TIME, http_status: 422, applies_to: "POST /permits/{id}/submit" }
  - { priority: 24, category: business_temporal, check: "Weather assessment assessed_at within 24h of now", error_id: ERR_ASSESSMENT_STALE, http_status: 422, applies_to: "POST /bookings/{id}/weather-hold" }
  - { priority: 25, category: business_temporal, check: "Weather assessment verdict == MANDATORY_HOLD", error_id: ERR_WEATHER_HOLD_NOT_JUSTIFIED, http_status: 422, applies_to: "POST /bookings/{id}/weather-hold" }
  - { priority: 26, category: business_referential, check: "quote_fresh == true at confirm (no roster/add-on/schedule mutation since last quote)", error_id: ERR_QUOTE_STALE, http_status: 409, applies_to: "POST /bookings/{id}/confirm" }
  - { priority: 27, category: business_referential, check: "Customer has VERIFIED InsuranceCertificate with coverage >= required for booking_type and expires_at > end_time", error_id: ERR_INSURANCE_NOT_VERIFIED, http_status: 422, applies_to: "POST /bookings/{id}/confirm" }
  - { priority: 28, category: business_referential, check: "No duplicate AddOnRequest of same addon_type in REQUESTED/APPROVED on the booking", error_id: ERR_ADDON_ALREADY_REQUESTED, http_status: 409, applies_to: "POST /bookings/{id}/add-ons" }
  - { priority: 29, category: business_referential, check: "Animal not already attached to the booking in PROPOSED/CONFIRMED", error_id: ERR_ANIMAL_ALREADY_ON_BOOKING, http_status: 409, applies_to: "POST /bookings/{id}/animals" }
  - { priority: 30, category: business_referential, check: "Permit decider X-User-ID != permit submitted_by_user_id (segregation of duties)", error_id: ERR_SEGREGATION_OF_DUTY, http_status: 403, applies_to: "POST /permits/{id}/decide" }
  - { priority: 31, category: business_fiscal, check: "total_paid_cents >= deposit_amount_cents at confirm", error_id: ERR_DEPOSIT_INSUFFICIENT, http_status: 422, applies_to: "POST /bookings/{id}/confirm" }
  - { priority: 32, category: business_fiscal, check: "total_paid_cents >= quoted_total_cents at dispatch", error_id: ERR_BALANCE_UNPAID, http_status: 422, applies_to: "POST /bookings/{id}/dispatch" }
  - { priority: 33, category: business_fiscal, check: "Payment must not push total_paid_cents above quoted_total_cents; payments only when status IN {QUOTED, CONFIRMED, WEATHER_HOLD}", error_id: ERR_OVERPAYMENT, http_status: 422, applies_to: "POST /bookings/{id}/payments" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/petting-zoo/customers", description: "Register a customer", roles: [Anonymous], code: 201, input: [email, full_name, customer_type], output: Customer, side_effects: [] }
  - { method: GET, path: "/petting-zoo/customers/{id}", description: "Fetch one customer", roles: [Customer, Coordinator, ComplianceOfficer, Operator], code: 200, input: [], output: Customer, side_effects: [] }
  - { method: GET, path: "/petting-zoo/customers/{id}/venues", description: "List venues owned by the customer", roles: [Customer, Coordinator], code: 200, input: [], output: "Venue[]", side_effects: [] }
  - { method: POST, path: "/petting-zoo/customers/{id}/insurance-certificates", description: "Submit a liability insurance certificate", roles: [Customer], code: 201, input: [provider, policy_number, coverage_amount_cents, expires_at], output: InsuranceCertificate, side_effects: [] }
  - { method: GET, path: "/petting-zoo/customers/{id}/insurance-certificates", description: "List the customer's insurance certificates", roles: [Customer, ComplianceOfficer, Operator], code: 200, input: [], output: "InsuranceCertificate[]", side_effects: [] }
  - { method: POST, path: "/petting-zoo/insurance-certificates/{id}/verify", description: "Verify or reject a submitted certificate", roles: [ComplianceOfficer], code: 200, input: [decision], output: InsuranceCertificate, side_effects: ["InsuranceCertificate SUBMITTED -> VERIFIED | REJECTED"] }

  - { method: POST, path: "/petting-zoo/venues", description: "Register an event venue (owned by the acting customer)", roles: [Customer], code: 201, input: [name, address, venue_type, water_access, surface_type, travel_zone, distance_miles, max_guest_capacity, requires_animal_permit, requires_handwash_stations], output: Venue, side_effects: [] }
  - { method: GET, path: "/petting-zoo/venues/{id}", description: "Fetch one venue", roles: [Customer, Coordinator, Operator], code: 200, input: [], output: Venue, side_effects: [] }

  - { method: POST, path: "/petting-zoo/animals", description: "Add an animal to the roster", roles: [Operator], code: 201, input: [name, species, weight_class, temperament_tier, base_event_fee_cents], output: Animal, side_effects: [] }
  - { method: GET, path: "/petting-zoo/animals", description: "List animals with filters and pagination", roles: [Coordinator, Operator, Veterinarian], code: 200, input: ["species?", "weight_class?", "status?", "limit?", "offset?"], output: "Animal[]", side_effects: [] }
  - { method: GET, path: "/petting-zoo/animals/{id}", description: "Fetch one animal", roles: [Coordinator, Operator, Veterinarian], code: 200, input: [], output: Animal, side_effects: [] }
  - { method: POST, path: "/petting-zoo/animals/{id}/retire", description: "Retire an animal (removal cascade with reason RETIRED)", roles: [Operator], code: 200, input: [], output: Animal, side_effects: ["Animal -> RETIRED; BookingAnimal removal cascade"] }
  - { method: POST, path: "/petting-zoo/animals/{id}/health-records", description: "File a veterinary health record; FAIL triggers the quarantine cascade", roles: [Veterinarian], code: 201, input: [exam_date, result, valid_until, "notes?"], output: HealthRecord, side_effects: ["PASS: recompute current_health_cert_expires_at; QUARANTINE -> AVAILABLE", "FAIL: AVAILABLE -> QUARANTINE; BookingAnimal REMOVED cascade; possible Booking CANCELLED_COMPLIANCE cascade"] }
  - { method: GET, path: "/petting-zoo/animals/{id}/health-records", description: "List an animal's health records", roles: [Veterinarian, Coordinator, Operator], code: 200, input: [], output: "HealthRecord[]", side_effects: [] }
  - { method: GET, path: "/petting-zoo/animals/{id}/booking-animals", description: "List booking attachments for an animal", roles: [Coordinator, Operator], code: 200, input: [], output: "BookingAnimal[]", side_effects: [] }

  - { method: POST, path: "/petting-zoo/handlers", description: "Add a staff handler", roles: [Operator], code: 201, input: [name, certifications], output: Handler, side_effects: [] }
  - { method: GET, path: "/petting-zoo/handlers", description: "List handlers", roles: [Coordinator, Operator], code: 200, input: ["status?", "limit?", "offset?"], output: "Handler[]", side_effects: [] }
  - { method: GET, path: "/petting-zoo/handlers/{id}", description: "Fetch one handler (includes scheduled_minutes_total)", roles: [Coordinator, Operator], code: 200, input: [], output: Handler, side_effects: [] }
  - { method: GET, path: "/petting-zoo/handlers/{id}/staff-assignments", description: "List a handler's assignments", roles: [Coordinator, Operator], code: 200, input: [], output: "StaffAssignment[]", side_effects: [] }

  - { method: POST, path: "/petting-zoo/bookings", description: "Create a booking (DRAFT); auto-creates its Waiver", roles: [Customer], code: 201, input: [venue_id, start_time, end_time, guest_count, child_guest_count, booking_type, planned_handwash_stations], output: Booking, side_effects: ["Waiver created with required_signatures = child_guest_count"] }
  - { method: GET, path: "/petting-zoo/bookings", description: "List bookings with filters and pagination", roles: [Customer, Coordinator, Operator, ComplianceOfficer], code: 200, input: ["customer_id?", "venue_id?", "status?", "payment_status?", "limit?", "offset?"], output: "Booking[]", side_effects: [] }
  - { method: GET, path: "/petting-zoo/bookings/{id}", description: "Fetch one booking with all computed quote fields", roles: [Customer, Coordinator, Operator, ComplianceOfficer], code: 200, input: [], output: Booking, side_effects: [] }
  - { method: POST, path: "/petting-zoo/bookings/{id}/quote", description: "Compute/recompute the provisional quote (DRAFT or QUOTED)", roles: [Coordinator], code: 200, input: [], output: Booking, side_effects: ["booking_price provisional variant; handwash_requirement; staff_requirement; compliance_score screening; deposit_amount; quote_fresh = true; increments Booking.version by 1"] }
  - { method: POST, path: "/petting-zoo/bookings/{id}/payments", description: "Record a customer payment toward the booking", roles: [Customer], code: 201, input: [amount_cents, method], output: LedgerEntry, side_effects: ["LedgerEntry PAYMENT created; total_paid_cents recomputed; payment_status advanced (UNPAID -> DEPOSIT_PAID -> PAID_IN_FULL)"] }
  - { method: POST, path: "/petting-zoo/bookings/{id}/confirm", description: "Confirm a quoted booking (full compliance gate)", roles: [Customer], code: 200, input: [], output: Booking, side_effects: ["Booking QUOTED -> CONFIRMED; increments Booking.version by 1"] }
  - { method: POST, path: "/petting-zoo/bookings/{id}/reschedule", description: "Move the event window (OCC on Booking.version)", roles: [Customer, Coordinator], code: 200, input: [new_start_time, new_end_time, expected_booking_version], output: Booking, side_effects: ["window replaced; quote_fresh = false; increments Booking.version by 1"] }
  - { method: POST, path: "/petting-zoo/bookings/{id}/cancel", description: "Cancel a booking; reason CUSTOMER (Customer) or WEATHER/COMPLIANCE (Coordinator)", roles: [Customer, Coordinator], code: 200, input: [reason], output: Booking, side_effects: ["cancellation_refund waterfall with REFUND/FORFEIT/PENALTY LedgerEntries; cancel cascade releasing StaffAssignments (Handler.scheduled_minutes_total recomputed), removing BookingAnimals and AddOnRequests; increments Booking.version by 1"] }
  - { method: POST, path: "/petting-zoo/bookings/{id}/weather-hold", description: "Place a CONFIRMED booking on weather hold using a fresh MANDATORY_HOLD assessment", roles: [Coordinator], code: 200, input: [weather_assessment_id], output: Booking, side_effects: ["Booking CONFIRMED -> WEATHER_HOLD; increments Booking.version by 1"] }
  - { method: POST, path: "/petting-zoo/bookings/{id}/release-weather-hold", description: "Release a weather hold back to CONFIRMED", roles: [Coordinator], code: 200, input: [], output: Booking, side_effects: ["Booking WEATHER_HOLD -> CONFIRMED; increments Booking.version by 1"] }
  - { method: POST, path: "/petting-zoo/bookings/{id}/dispatch", description: "Dispatch crew and trailer (CONFIRMED -> EN_ROUTE)", roles: [Coordinator], code: 200, input: [], output: Booking, side_effects: ["Booking CONFIRMED -> EN_ROUTE; increments Booking.version by 1"] }
  - { method: POST, path: "/petting-zoo/bookings/{id}/arrive", description: "Mark crew arrived, setup begins (EN_ROUTE -> ON_SITE_SETUP)", roles: [Coordinator], code: 200, input: [], output: Booking, side_effects: ["increments Booking.version by 1"] }
  - { method: POST, path: "/petting-zoo/bookings/{id}/start-event", description: "Open the event to guests after setup compliance check", roles: [Coordinator], code: 200, input: [actual_handwash_stations], output: Booking, side_effects: ["actual_handwash_stations recorded; Booking ON_SITE_SETUP -> IN_PROGRESS; increments Booking.version by 1"] }
  - { method: POST, path: "/petting-zoo/bookings/{id}/complete", description: "Close the event; audited compliance recomputed; staff completed", roles: [Coordinator], code: 200, input: [actual_attendance_count], output: Booking, side_effects: ["compliance_score audited variant; StaffAssignments ASSIGNED -> COMPLETED with Handler.scheduled_minutes_total recompute; Booking IN_PROGRESS -> COMPLETED; increments Booking.version by 1"] }
  - { method: POST, path: "/petting-zoo/bookings/{id}/finalize-invoice", description: "Finalize pricing (final variant), issue CHARGE, refund overpayment", roles: [Coordinator], code: 200, input: [], output: Booking, side_effects: ["booking_price final variant -> final_total_cents; LedgerEntry CHARGE; overpayment REFUND; Booking COMPLETED -> INVOICED; increments Booking.version by 1"] }

  - { method: POST, path: "/petting-zoo/bookings/{id}/animals", description: "Attach a roster animal to the booking (PROPOSED)", roles: [Coordinator], code: 201, input: [animal_id, role], output: BookingAnimal, side_effects: ["Booking.quote_fresh = false; increments Booking.version by 1"] }
  - { method: POST, path: "/petting-zoo/bookings/{id}/animals/{bookingAnimalId}/confirm", description: "Confirm an attached animal (health, quarantine, rest-window gates)", roles: [Coordinator], code: 200, input: [], output: BookingAnimal, side_effects: ["BookingAnimal PROPOSED -> CONFIRMED; Booking.quote_fresh = false; increments Booking.version by 1"] }
  - { method: DELETE, path: "/petting-zoo/bookings/{id}/animals/{bookingAnimalId}", description: "Manually remove an attached animal", roles: [Coordinator], code: 200, input: [], output: BookingAnimal, side_effects: ["BookingAnimal -> REMOVED reason MANUAL; Booking.quote_fresh = false; increments Booking.version by 1"] }
  - { method: GET, path: "/petting-zoo/bookings/{id}/animals", description: "List animals attached to a booking", roles: [Customer, Coordinator, Operator], code: 200, input: [], output: "BookingAnimal[]", side_effects: [] }

  - { method: POST, path: "/petting-zoo/bookings/{id}/staff-assignments", description: "Assign a handler to the booking", roles: [Coordinator], code: 201, input: [handler_id, role], output: StaffAssignment, side_effects: ["Handler.scheduled_minutes_total recomputed (incremented by event duration)"] }
  - { method: DELETE, path: "/petting-zoo/bookings/{id}/staff-assignments/{staffAssignmentId}", description: "Release a handler assignment", roles: [Coordinator], code: 200, input: [], output: StaffAssignment, side_effects: ["StaffAssignment -> RELEASED reason MANUAL; Handler.scheduled_minutes_total recomputed"] }
  - { method: GET, path: "/petting-zoo/bookings/{id}/staff-assignments", description: "List staff assigned to a booking", roles: [Customer, Coordinator, Operator], code: 200, input: [], output: "StaffAssignment[]", side_effects: [] }

  - { method: POST, path: "/petting-zoo/bookings/{id}/add-ons", description: "Request an add-on (pony ride / reptile show); OCC on Booking.version", roles: [Customer], code: 201, input: [addon_type, duration_minutes, expected_booking_version], output: AddOnRequest, side_effects: ["AddOnRequest REQUESTED; Booking.quote_fresh = false; increments Booking.version by 1"] }
  - { method: POST, path: "/petting-zoo/bookings/{id}/add-ons/{addOnRequestId}/decide", description: "Approve or deny an add-on request", roles: [Coordinator], code: 200, input: [decision, "denial_reason?"], output: AddOnRequest, side_effects: ["AddOnRequest REQUESTED -> APPROVED | DENIED; on APPROVE: Booking.quote_fresh = false"] }
  - { method: GET, path: "/petting-zoo/bookings/{id}/add-ons", description: "List add-on requests for a booking", roles: [Customer, Coordinator], code: 200, input: [], output: "AddOnRequest[]", side_effects: [] }

  - { method: POST, path: "/petting-zoo/bookings/{id}/permits", description: "Create a permit application (DRAFT) for the booking", roles: [Coordinator], code: 201, input: [permit_type, jurisdiction], output: Permit, side_effects: [] }
  - { method: POST, path: "/petting-zoo/permits/{id}/submit", description: "Submit (or resubmit after denial) a permit application", roles: [Coordinator], code: 200, input: [], output: Permit, side_effects: ["Permit DRAFT|DENIED -> SUBMITTED; submitted_by_user_id recorded; denial_reason cleared"] }
  - { method: POST, path: "/petting-zoo/permits/{id}/decide", description: "Issue or deny a submitted permit (segregation of duties enforced)", roles: [ComplianceOfficer], code: 200, input: [decision, "denial_reason?"], output: Permit, side_effects: ["Permit SUBMITTED -> ISSUED | DENIED; decided_by_user_id recorded"] }
  - { method: GET, path: "/petting-zoo/bookings/{id}/permits", description: "List permits for a booking", roles: [Customer, Coordinator, ComplianceOfficer], code: 200, input: [], output: "Permit[]", side_effects: [] }

  - { method: POST, path: "/petting-zoo/bookings/{id}/waiver-signatures", description: "Record guardian waiver signatures", roles: [Customer], code: 200, input: [count], output: Waiver, side_effects: ["Waiver.signed_count += count; status re-derived PENDING/PARTIAL/COMPLETE"] }
  - { method: GET, path: "/petting-zoo/bookings/{id}/waivers", description: "Fetch the booking's waiver (array of 0 or 1)", roles: [Customer, Coordinator], code: 200, input: [], output: "Waiver[]", side_effects: [] }

  - { method: POST, path: "/petting-zoo/bookings/{id}/weather-assessments", description: "Record a weather assessment for the event window", roles: [Coordinator], code: 201, input: [assessed_at, forecast_temp_f, forecast_precip_pct, wind_mph, verdict], output: WeatherAssessment, side_effects: [] }
  - { method: GET, path: "/petting-zoo/bookings/{id}/weather-assessments", description: "List weather assessments for a booking", roles: [Customer, Coordinator], code: 200, input: [], output: "WeatherAssessment[]", side_effects: [] }

  - { method: GET, path: "/petting-zoo/bookings/{id}/ledger-entries", description: "List the booking's payment/refund/forfeit/penalty/charge ledger", roles: [Customer, Coordinator, Operator], code: 200, input: [], output: "LedgerEntry[]", side_effects: [] }

  - { method: POST, path: "/petting-zoo/_clock/set_current_utc", description: "Test-driving endpoint: set the server's logical clock. Startup default is exactly 2026-05-01T00:00:00Z; before any set_current_utc call the logical clock reads this default and never falls back to wall-clock time.", roles: [Operator], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["logical clock advanced; expiry/lead-time/tier rules evaluate against it"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for endpoint, entity ownership mismatch, or cancel reason not allowed for role" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, invalid enum value, type violation, end_time <= start_time" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "Referenced customer id does not exist" }
  - { id: ERR_VENUE_NOT_FOUND, http: 404, condition: "Referenced venue id does not exist" }
  - { id: ERR_ANIMAL_NOT_FOUND, http: 404, condition: "Referenced animal id does not exist" }
  - { id: ERR_HANDLER_NOT_FOUND, http: 404, condition: "Referenced handler id does not exist" }
  - { id: ERR_BOOKING_NOT_FOUND, http: 404, condition: "Referenced booking id does not exist" }
  - { id: ERR_PERMIT_NOT_FOUND, http: 404, condition: "Referenced permit id does not exist" }
  - { id: ERR_ADDON_NOT_FOUND, http: 404, condition: "Referenced add-on request id does not exist" }
  - { id: ERR_CERTIFICATE_NOT_FOUND, http: 404, condition: "Referenced insurance certificate id does not exist" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "Referenced staff assignment id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a valid from-state for the requested transition (incl. terminal lockdown)" }
  - { id: ERR_STALE_BOOKING_VERSION, http: 412, condition: "expected_booking_version does not match Booking.version (OCC)" }
  - { id: ERR_COMPLIANCE_SCORE_TOO_LOW, http: 422, condition: "compliance_screening_score < 60 at confirm" }
  - { id: ERR_HANDWASH_STATIONS_INSUFFICIENT, http: 422, condition: "Planned (confirm) or actual (start-event) handwash stations below required_handwash_stations" }
  - { id: ERR_PERMIT_NOT_ISSUED, http: 422, condition: "A required permit type has no ISSUED Permit for the booking at confirm" }
  - { id: ERR_ANIMAL_QUARANTINED, http: 422, condition: "Animal.status != AVAILABLE when confirming a BookingAnimal" }
  - { id: ERR_HEALTH_CERT_EXPIRED, http: 422, condition: "Animal has no PASS health certificate valid beyond the booking end_time" }
  - { id: ERR_WAIVER_INCOMPLETE, http: 422, condition: "Waiver.status != COMPLETE at dispatch" }
  - { id: ERR_NO_ANIMALS_CONFIRMED, http: 422, condition: "No CONFIRMED BookingAnimal at confirm" }
  - { id: ERR_VENUE_CAPACITY_EXCEEDED, http: 422, condition: "guest_count exceeds venue.max_guest_capacity" }
  - { id: ERR_ANIMAL_SCHEDULE_CONFLICT, http: 409, condition: "Animal buffered rest-window intersects another confirmed booking window" }
  - { id: ERR_HANDLER_OVERBOOKED, http: 409, condition: "Handler strict window overlap or 480-minute daily capacity exceeded" }
  - { id: ERR_STAFF_RATIO_NOT_MET, http: 422, condition: "ASSIGNED staff below required_staff_count at dispatch" }
  - { id: ERR_NO_CERTIFIED_HANDLER, http: 422, condition: "REPTILE_SHOW approval without an ASSIGNED REPTILE_CERTIFIED handler" }
  - { id: ERR_ADDON_VENUE_INCOMPATIBLE, http: 422, condition: "PONY_RIDE requested for an INDOOR venue" }
  - { id: ERR_WAIVER_SIGNATURE_OVERFLOW, http: 422, condition: "Waiver signatures would exceed required_signatures" }
  - { id: ERR_EVENT_IN_PAST, http: 422, condition: "Event start_time not after the logical clock" }
  - { id: ERR_EVENT_TOO_SOON, http: 422, condition: "Event start_time less than 48h after the logical clock" }
  - { id: ERR_PERMIT_LEAD_TIME, http: 422, condition: "Permit submitted less than 336h before event start" }
  - { id: ERR_ASSESSMENT_STALE, http: 422, condition: "Weather assessment older than 24h at weather-hold" }
  - { id: ERR_WEATHER_HOLD_NOT_JUSTIFIED, http: 422, condition: "Weather hold requested with a non-MANDATORY_HOLD assessment" }
  - { id: ERR_QUOTE_STALE, http: 409, condition: "Roster/add-on/schedule mutated after the last quote; re-quote required before confirm" }
  - { id: ERR_INSURANCE_NOT_VERIFIED, http: 422, condition: "No VERIFIED insurance certificate with sufficient coverage valid past event end" }
  - { id: ERR_ADDON_ALREADY_REQUESTED, http: 409, condition: "Duplicate add-on type in REQUESTED/APPROVED on the same booking" }
  - { id: ERR_ANIMAL_ALREADY_ON_BOOKING, http: 409, condition: "Animal already attached to the booking in PROPOSED/CONFIRMED" }
  - { id: ERR_SEGREGATION_OF_DUTY, http: 403, condition: "Permit decider is the same operator id as the permit submitter" }
  - { id: ERR_DEPOSIT_INSUFFICIENT, http: 422, condition: "total_paid_cents below deposit_amount_cents at confirm" }
  - { id: ERR_BALANCE_UNPAID, http: 422, condition: "total_paid_cents below quoted_total_cents at dispatch" }
  - { id: ERR_OVERPAYMENT, http: 422, condition: "Payment would push total_paid_cents above quoted_total_cents, or booking not in a payable state" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated caller; may only register as a customer"
    identity: opaque
    exclusive_operations: ["POST /petting-zoo/customers"]
    shared_operations: []
  - name: Customer
    description: "Booking owner; manages own venues, certificates, bookings, payments, waivers, add-on requests"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /petting-zoo/venues"
      - "POST /petting-zoo/customers/{id}/insurance-certificates"
      - "POST /petting-zoo/bookings"
      - "POST /petting-zoo/bookings/{id}/payments"
      - "POST /petting-zoo/bookings/{id}/confirm"
      - "POST /petting-zoo/bookings/{id}/waiver-signatures"
      - "POST /petting-zoo/bookings/{id}/add-ons"
    shared_operations:
      - "POST /petting-zoo/bookings/{id}/reschedule"
      - "POST /petting-zoo/bookings/{id}/cancel"
      - "GET reads of own resources"
  - name: Coordinator
    description: "Operations staff; quotes, rosters, staffing, add-on decisions, permits filing, dispatch, weather holds"
    identity: opaque
    exclusive_operations:
      - "POST /petting-zoo/bookings/{id}/quote"
      - "POST /petting-zoo/bookings/{id}/animals (+confirm, DELETE)"
      - "POST /petting-zoo/bookings/{id}/staff-assignments (+DELETE)"
      - "POST /petting-zoo/bookings/{id}/add-ons/{addOnRequestId}/decide"
      - "POST /petting-zoo/bookings/{id}/permits, POST /petting-zoo/permits/{id}/submit"
      - "POST /petting-zoo/bookings/{id}/weather-assessments, weather-hold, release-weather-hold"
      - "POST /petting-zoo/bookings/{id}/dispatch, arrive, start-event, complete, finalize-invoice"
    shared_operations:
      - "POST /petting-zoo/bookings/{id}/reschedule"
      - "POST /petting-zoo/bookings/{id}/cancel"
      - "GET reads"
  - name: Veterinarian
    description: "Files animal health records; drives quarantine cycle"
    identity: opaque
    exclusive_operations:
      - "POST /petting-zoo/animals/{id}/health-records"
    shared_operations:
      - "GET /petting-zoo/animals, GET /petting-zoo/animals/{id}, GET /petting-zoo/animals/{id}/health-records"
  - name: ComplianceOfficer
    description: "Regulatory reviewer; decides permits and verifies insurance — cannot decide a permit it submitted (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /petting-zoo/permits/{id}/decide"
      - "POST /petting-zoo/insurance-certificates/{id}/verify"
    shared_operations:
      - "GET reads"
  - name: Operator
    description: "Platform operator; manages the animal roster, handler roster, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /petting-zoo/animals, POST /petting-zoo/animals/{id}/retire"
      - "POST /petting-zoo/handlers"
      - "POST /petting-zoo/_clock/set_current_utc"
    shared_operations:
      - "GET reads"
