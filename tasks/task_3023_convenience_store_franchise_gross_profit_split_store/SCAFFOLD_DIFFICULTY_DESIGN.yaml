  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: franchisee_reinstate_finalizes_counted_audit_then_refreshes_risk_band_then_promotes_tier
        grounds:
          - state_machines.Franchisee.SUSPENDED_to_ACTIVE
          - state_machines.ShrinkAudit.COUNTED_to_FINALIZED
          - state_machines.FranchiseAgreement.ACTIVE_to_TERMINATED
          - calculations.franchisee_net_worth
          - entities.FranchiseAgreement.fields.performance_tier
        distinguishing_aspect: |
          Depth 3 with each link caused by the previous link, not by the original action: the
          reinstate call finalizes a COUNTED audit (hop 1); the FINALIZED audit's charge changes
          Franchisee.open_shrink_charge_cents, which changes audit_adjusted_net_worth_cents, which
          re-derives risk_band (hop 2); the re-derived net worth crossing 15000000 pushes the
          franchisee's agreements to performance_tier PREMIER (hop 3). Nothing after hop 1 is
          triggered by the reinstate request directly.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-10T12:00:00Z. One franchisee with stated_net_worth_cents 20000000, one ACTIVE store, one ACTIVE agreement, one settlement, one draw of 5000000 recovered in full so draw_outstanding_cents is 0."
            - "One shrink audit for [2026-08-01, 2026-09-01) with book_inventory_cents 8000000, counted at physical_inventory_cents 7600000 giving shrink_cents 400000, left in COUNTED status."
            - "The franchisee is SUSPENDED. Because the suspend call cascades the store to TERMINATED, the store is reopened as TX-9090 with a fresh ACTIVE agreement before the reinstate."
          setup_api_calls:
            - call: "POST /franchise/_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T12:00:00Z" }
              as: FranchisorAdmin
            - call: "POST /franchise/franchisees"
