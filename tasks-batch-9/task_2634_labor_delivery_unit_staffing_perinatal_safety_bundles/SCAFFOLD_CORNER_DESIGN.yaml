      - name: five_delivery_mode_coherence_ids_walked_up_the_second_and_third_stage_gates_on_a_prior_cesarean_encounter
        claim_type: Error Triggerability
        grounds: |
          §1.6 ERR_FETAL_CATEGORY_BLOCKS_PHASE (422), ERR_DELIVERY_MODE_REQUIRED (422),
          ERR_CESAREAN_EVENT_NOT_DELIVERED (422), ERR_DELIVERY_MODE_CONFLICTS_HISTORY (422) and
          ERR_EPISIOTOMY_MODE_CONFLICT (422); §1.2 LaborEncounter ACTIVE_FIRST_STAGE -> SECOND_STAGE
          (category gate satisfiable only by a CATEGORY_I|CATEGORY_II reading or by a CATEGORY_III reading
          plus an EmergencyCesareanEvent in DECISION_DECLARED|TEAM_MOBILIZED) and SECOND_STAGE ->
          THIRD_STAGE_DELIVERED (four ordered preconditions); §1.5 POST /emergency-cesareans/{id}/record-delivery
          ("sets encounter.delivery_mode := CESAREAN_REPEAT when encounter.prior_cesarean == true"); §1.3
          cesarean_readiness_derivation and unit_posture_derivation (turnover_buffer 45 while OPEN).
        distinguishing_aspect: |
          All four THIRD_STAGE_DELIVERED preconditions are violated one at a time, in their declared order,
          on the SAME encounter - which is only possible because each probe is repaired before the next is
          attempted: omit the mode (required), then name a cesarean mode while the theatre event is only
          DECISION_DECLARED (not delivered), then name CESAREAN_PRIMARY on a prior_cesarean patient
          (history conflict), then tick episiotomy_performed on a cesarean mode (episiotomy conflict).
          Upstream, the SECOND_STAGE category gate is proven to be about the PAIR (reading, event) rather
          than the reading alone: the identical advance call is 422 before the event exists and 200 after,
          with no new assessment in between. A REASSESSMENT_PENDING chain is used deliberately so the
          CATEGORY_III blockage is not masked by ERR_FETAL_ESCALATION_UNRESOLVED.
        test_recipe:
          setup: |
            Readiness bootstrap first: clock 05:45, one unit with two LDR beds and one OR room, then the
            drill lap - drill scheduled 05:50 with participants [ob_staff, anes_staff], clock to 05:50,
            start, clock to 06:00, document (decision 05:50, incision 06:00, measured 10 <= 30) and validate
            as PerinatalSafetyOfficer under a user id that is not the documenter. anes_staff's OR_STANDBY
            shift is created SCHEDULED and activated only AFTER that validation, because priority 11.2
            refuses to activate an OR_STANDBY slot whose holder is not yet drill-current; once it is ACTIVE
            and anes_staff is drill-current the unit reaches READY with mean_d2i null, so posture is OPEN
            and turnover_buffer_minutes is 45. Staff: rn_bedside (RN, ADVANCED) on a BEDSIDE shift,
            rn_charge (RN, ADVANCED) on a CHARGE shift, anes (or_circulating_qualified) on the OR_STANDBY
            shift, tech (or_circulating_qualified) and neo on TRIAGE shifts, ob_staff (OB_ATTENDING)
            with no shift. One encounter with prior_cesarean true holding LDR-01 and covered ONE_TO_ONE off
            the BEDSIDE shift, so every coverage floor up to SECOND_STAGE is already satisfied.
