            - call: "POST /applications/${app_fd}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { acct_fd: $.data.opened_account_id }
            - call: "POST /accounts/${acct_fd}/transactions"
              payload: { txn_type: "DEPOSIT", amount_cents: 30000 }
              as: AccountHolder
              as_user_id: "${cust_fd}"
            - call: "POST /customers"
              payload: { legal_name: "Cred Owner", date_of_birth: "1990-01-01", tax_id_last4: "8181", country_of_residence: "US" }
              as: Teller
              captures: { cust_fc: $.data.id }
            - call: "POST /applications"
              payload: { customer_id: "${cust_fc}", product_type: "CHECKING", requested_apy_tier_code: "CHK_STD" }
              as: Teller
              captures: { app_fc: $.data.id }
            - call: "POST /applications/${app_fc}/submit"
              payload: {}
              as: Teller
              as_user_id: "teller-1"
            - call: "POST /applications/${app_fc}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { acct_fc: $.data.opened_account_id }
            - call: "POST /ach-originations"
