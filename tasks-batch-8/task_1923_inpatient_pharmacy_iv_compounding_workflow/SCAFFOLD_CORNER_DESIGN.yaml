              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /pharmacy/medication-orders/${ord_id}/verify"
              payload: {}
              as: Pharmacist
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ROLE_MISMATCH (403): header role Pharmacist conflicts with staff_role TECHNICIAN"
      - name: unauthenticated_missing_headers
        claim_type: rbac_denial
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Missing X-User-Role / X-User-ID headers on any endpoint -> ERR_UNAUTHENTICATED (401), fired before role and schema checks."
