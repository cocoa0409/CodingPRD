              as: AgencyAdmin
              captures: { ci_nu: $.data.id }
            - call: "POST /licensing/providers"
              payload: { legal_name: "Bright Start Center", county_code: "CTY-01", site_address: "12 Elm St", program_type: "CENTER", requested_capacity: 10 }
              as: Applicant
              captures: { prov: $.data.id }
            - call: "POST /licensing/inspectors"
              payload: { full_name: "Ivy Cole", county_code: "CTY-01", certified_age_groups: ["PRESCHOOL"] }
              as: AgencyAdmin
              captures: { insp: $.data.id }
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${prov}", inspector_id: "${insp}", inspection_type: "ANNUAL", scheduled_for: "2026-08-05T09:00:00Z", target_age_groups: ["PRESCHOOL"] }
              as: LicensingSupervisor
              captures: { ins: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/inspections/${ins}/start"
              as: LicensingInspector
              as_user_id: "${insp}"
            - call: "POST /licensing/violations"
              payload: { inspection_id: "${ins}", checklist_item_id: "${ci_nu}", primary_age_group: "PRESCHOOL", narrative: "Menu board blank." }
              as: LicensingInspector
              as_user_id: "${insp}"
              captures: { vio: $.data.id }
          trigger:
            - call: "POST /licensing/inspections/${ins}/submit-for-review"
              payload: { outcome: "CONDITIONAL_PASS", age_groups_observed: ["PRESCHOOL"] }
              as: LicensingInspector
              as_user_id: "${insp}"
              captures: { st: $.data.status }
            - call: "POST /licensing/inspections/${ins}/finalize"
              as: LicensingSupervisor
              captures: { fin: $.data.final_compliance_score, capreq: $.data.cap_required }
          assert:
            - "${st} == PENDING_REVIEW with HTTP 200 — no error is raised"
            - "${fin} == 99.00 and preliminary_compliance_score == 99.00 (1 point, PRESCHOOL weight 1.000)"
            - "${capreq} == true because violation_count == 1"
            - "Violation.${vio}.status == CORRECTION_PENDING and Provider.${prov}.critical_open_count == 0"

      - name: val_temporal_validation_schedule_at_the_clock_instant_rejected
        claim_type: temporal_validation
        grounds:
          - validations.priority_68_ERR_SCHEDULE_IN_PAST
          - errors[ERR_SCHEDULE_IN_PAST]
          - endpoints.POST /licensing/inspections
        distinguishing_aspect: "scheduled_for must be strictly after the clock, so the exact clock instant is refused with ERR_SCHEDULE_IN_PAST 422 while one second later is accepted — and the refused attempt leaves Inspector.scheduled_visit_count at 0."
        test_recipe:
          setup:
            - "A CENTER provider and a PRESCHOOL-certified inspector with the clock parked at 2026-08-05T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/providers"
              payload: { legal_name: "Bright Start Center", county_code: "CTY-01", site_address: "12 Elm St", program_type: "CENTER", requested_capacity: 10 }
              as: Applicant
              captures: { prov: $.data.id }
            - call: "POST /licensing/inspectors"
              payload: { full_name: "Ivy Cole", county_code: "CTY-01", certified_age_groups: ["PRESCHOOL"] }
              as: AgencyAdmin
              captures: { insp: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: AgencyAdmin
          trigger:
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${prov}", inspector_id: "${insp}", inspection_type: "ANNUAL", scheduled_for: "2026-08-04T09:00:00Z", target_age_groups: ["PRESCHOOL"] }
              as: LicensingSupervisor
              captures: { e_past: $.data.error_id }
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${prov}", inspector_id: "${insp}", inspection_type: "ANNUAL", scheduled_for: "2026-08-05T09:00:00Z", target_age_groups: ["PRESCHOOL"] }
              as: LicensingSupervisor
              captures: { e_now: $.data.error_id }
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${prov}", inspector_id: "${insp}", inspection_type: "ANNUAL", scheduled_for: "2026-08-05T09:00:01Z", target_age_groups: ["PRESCHOOL"] }
              as: LicensingSupervisor
              captures: { ins_ok: $.data.id }
          assert:
            - "${e_past} == ERR_SCHEDULE_IN_PAST with HTTP 422"
            - "${e_now} == ERR_SCHEDULE_IN_PAST with HTTP 422 — the clock instant itself is not strictly after the clock"
            - "Inspection.${ins_ok} is created with HTTP 201, scheduled_for 2026-08-05T09:00:01Z and visit_window_end 2026-08-05T11:00:01Z"
            - "Inspector.${insp}.scheduled_visit_count == 1 — only the accepted request counted"

      - name: val_aggregate_validation_roster_sizes_exceed_requested_capacity_rejected
        claim_type: aggregate_validation
        grounds:
          - validations.priority_92_ERR_ROSTER_CAPACITY_MISMATCH
          - errors[ERR_ROSTER_CAPACITY_MISMATCH]
          - endpoints.POST /licensing/age-group-rosters
          - endpoints.POST /licensing/providers/{provider_id}/submit-application
        distinguishing_aspect: "Each roster is individually legal — PRESCHOOL 20 is exactly AGE_GROUP_MAX_SIZE[PRESCHOOL] and INFANT 8 is exactly AGE_GROUP_MAX_SIZE[INFANT] — but their collective 28 exceeds the provider's requested_capacity 20, so the second creation is refused with ERR_ROSTER_CAPACITY_MISMATCH 409 and the application still submits on the surviving roster alone."
        test_recipe:
          setup:
            - "A CENTER provider with requested_capacity 20 and one DIRECTOR qualified for both age groups."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/providers"
              payload: { legal_name: "Bright Start Center", county_code: "CTY-01", site_address: "12 Elm St", program_type: "CENTER", requested_capacity: 20 }
              as: Applicant
              captures: { prov: $.data.id }
            - call: "POST /licensing/staff-members"
              payload: { provider_id: "${prov}", full_name: "Dana Reed", member_type: "DIRECTOR", date_of_birth: "1985-04-02", qualified_age_groups: ["INFANT", "PRESCHOOL"], role_title: "Director" }
              as: Applicant
              as_user_id: "${prov}"
              captures: { dir: $.data.id }
          trigger:
            - call: "POST /licensing/age-group-rosters"
              payload: { provider_id: "${prov}", age_group: "PRESCHOOL", requested_group_size: 20 }
              as: Applicant
              as_user_id: "${prov}"
              captures: { r_pre: $.data.id }
            - call: "POST /licensing/age-group-rosters"
              payload: { provider_id: "${prov}", age_group: "INFANT", requested_group_size: 8 }
              as: Applicant
              as_user_id: "${prov}"
              captures: { e_sum: $.data.error_id }
            - call: "POST /licensing/providers/${prov}/submit-application"
              as: Applicant
              as_user_id: "${prov}"
              captures: { app_st: $.data.application_status }
          assert:
            - "AgeGroupRoster.${r_pre} is created with HTTP 201 and requested_group_size 20"
            - "${e_sum} == ERR_ROSTER_CAPACITY_MISMATCH with HTTP 409 — 20 + 8 > requested_capacity 20"
            - "GET /licensing/age-group-rosters?provider_id=${prov} returns total_count == 1"
            - "${app_st} == SUBMITTED — the surviving roster sums exactly to requested_capacity"

      - name: val_conditional_validation_anonymous_complaint_with_a_name_rejected
        claim_type: conditional_validation
        grounds:
          - validations.priority_6_ERR_INVALID_REQUEST
          - entities.Complaint.fields.anonymous
          - entities.Complaint.fields.complainant_name
          - endpoints.POST /licensing/complaints
        distinguishing_aspect: "The complainant_name rule is conditional on the anonymous flag: name-plus-anonymous is ERR_INVALID_REQUEST 400, anonymous alone is accepted with complainant_name null, and the identical name is accepted once anonymous is false."
        test_recipe:
          setup:
            - "One CENTER provider; clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/providers"
              payload: { legal_name: "Bright Start Center", county_code: "CTY-01", site_address: "12 Elm St", program_type: "CENTER", requested_capacity: 10 }
              as: Applicant
              captures: { prov: $.data.id }
          trigger:
            - call: "POST /licensing/complaints"
              payload: { provider_id: "${prov}", intake_channel: "PHONE", allegation_category: "RECORDS", affected_age_group: "SCHOOL_AGE", narrative: "Records missing.", anonymous: true, complainant_name: "Jo Vega" }
              as: ComplaintIntakeSpecialist
              captures: { e_anon: $.data.error_id }
            - call: "POST /licensing/complaints"
              payload: { provider_id: "${prov}", intake_channel: "PHONE", allegation_category: "RECORDS", affected_age_group: "SCHOOL_AGE", narrative: "Records missing.", anonymous: true }
              as: ComplaintIntakeSpecialist
              captures: { c_anon: $.data.id }
            - call: "POST /licensing/complaints"
              payload: { provider_id: "${prov}", intake_channel: "PHONE", allegation_category: "RECORDS", affected_age_group: "SCHOOL_AGE", narrative: "Records missing.", anonymous: false, complainant_name: "Jo Vega" }
              as: ComplaintIntakeSpecialist
              captures: { c_named: $.data.id }
          assert:
            - "${e_anon} == ERR_INVALID_REQUEST with HTTP 400"
            - "Complaint.${c_anon}.anonymous == true and complainant_name == null (HTTP 201)"
            - "Complaint.${c_named}.anonymous == false and complainant_name == Jo Vega (HTTP 201)"
            - "Both accepted complaints are P3 with investigation_due_at 2026-09-30T00:00:00Z (RECORDS x OLDER, DETERMINATION_DAYS[P3] == 60)"
            - "GET /licensing/complaints?provider_id=${prov} returns total_count == 2"

      - name: val_priority_ordering_state_gate_precedes_clearance_gate
        claim_type: priority_ordering
        grounds:
          - validations.priority_42_ERR_INVALID_INSPECTION_STATE
          - validations.priority_55_ERR_CLEARANCE_INCOMPLETE
        excluded_because:
          difficulty_instance: priority_pair_inspection_state_beats_clearance_incomplete
          rationale: "That §1.8 instance violates both rules with one finalize call and asserts the lower-numbered state gate wins, then repairs the state so the clearance error surfaces — the whole priority-ordering claim for this pair."

      - name: val_priority_conflict_temporal_checks_precede_certification
        claim_type: priority_conflict
        grounds:
          - validations.priority_66_ERR_INSPECTOR_DOUBLE_BOOKED
          - validations.priority_74_ERR_INSPECTOR_NOT_CERTIFIED_FOR_AGE_GROUP
        excluded_because:
          difficulty_instance: priority_pair_double_booking_beats_uncertified_age_group
          rationale: "A single scheduling request that is both double-booked and outside the inspector's certified age groups is already used there to prove priority 66 is reported before priority 74."

      - name: val_cross_entity_validation_posting_reads_complaint_state
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_63_ERR_POSTING_BLOCKED_OPEN_INVESTIGATION
          - validations.priority_64_ERR_REDACTION_INCOMPLETE
        excluded_because:
          difficulty_instance: cross_entity_posting_publish_blocked_by_open_investigation
          rationale: "Publishing a posting while a sibling Complaint of the same provider sits in UNDER_INVESTIGATION, and the success once that complaint is determined, are both asserted there — including the redaction gate that precedes it."

      - name: val_cascading_validation_window_check_runs_before_membership_check
        claim_type: cascading_validation
        grounds:
          - validations.priority_71_ERR_CAP_WINDOW_CLOSED
          - validations.priority_86_ERR_VIOLATION_INSPECTION_MISMATCH
        excluded_because:
          difficulty_instance: priority_pair_cap_window_closed_beats_violation_inspection_mismatch
          rationale: "The dependent-check ordering on CAP submission — the submission-window test is resolved before the violation-membership test, so a doubly-invalid plan reports ERR_CAP_WINDOW_CLOSED — is exactly that instance's subject."

  # ---------------------------------------------------------------------------
  # Guide section 5 — From Table 5 (Endpoints). The `bulk action` row has no
  # applicable endpoint in §1.5 (no endpoint accepts a collection of targets),
  # so it yields no instance.
  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: endpoint_standard_crud_roster_patch_is_a_partial_update
        claim_type: standard_crud
        grounds:
          - endpoints.PATCH /licensing/age-group-rosters/{roster_id}
          - entities.AgeGroupRoster.fields.enrolled_count
          - entities.AgeGroupRoster.fields.staff_assigned_count
          - calculations.ratio_group_size_supervision_verification
        distinguishing_aspect: "The only PATCH in §1.5 is a true partial update: a body carrying just staff_assigned_count leaves enrolled_count and lead_staff_member_id exactly as the previous write left them, while still bumping version and re-deriving all three flags."
        test_recipe:
          setup:
            - "A CENTER provider with one PRESCHOOL roster of 10, no lead assigned, created at clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/providers"
              payload: { legal_name: "Bright Start Center", county_code: "CTY-01", site_address: "12 Elm St", program_type: "CENTER", requested_capacity: 10 }
              as: Applicant
              captures: { prov: $.data.id }
            - call: "POST /licensing/age-group-rosters"
              payload: { provider_id: "${prov}", age_group: "PRESCHOOL", requested_group_size: 10 }
              as: Applicant
              as_user_id: "${prov}"
              captures: { r_pre: $.data.id, v1: $.data.version }
          trigger:
            - call: "PATCH /licensing/age-group-rosters/${r_pre}"
              payload: { enrolled_count: 5, staff_assigned_count: 1 }
              as: Applicant
              as_user_id: "${prov}"
              captures: { rsc1: $.data.required_staff_count, v2: $.data.version }
            - call: "PATCH /licensing/age-group-rosters/${r_pre}"
              payload: { staff_assigned_count: 2 }
              as: Applicant
              as_user_id: "${prov}"
              captures: { enr2: $.data.enrolled_count, sac2: $.data.staff_assigned_count, v3: $.data.version }
            - call: "GET /licensing/age-group-rosters/${r_pre}"
              as: LicensingSupervisor
          assert:
            - "${rsc1} == 1 — ceil(5 / AGE_GROUP_RATIO[PRESCHOOL] 10)"
            - "${enr2} == 5 — the second PATCH omitted enrolled_count and must not reset it"
            - "${sac2} == 2 and lead_staff_member_id is still null"
            - "${v2} == ${v1} + 1 and ${v3} == ${v2} + 1"
            - "AgeGroupRoster.${r_pre}.ratio_compliant == true (2 >= 1)"
            - "AgeGroupRoster.${r_pre}.group_size_compliant == false — pre-licensure approved_group_size is 0, so the effective cap is 0"
            - "AgeGroupRoster.${r_pre}.supervision_compliant == false and last_verified_at == null"

      - name: endpoint_action_endpoint_leave_status_blocks_new_scheduling_only
        claim_type: action_endpoint
        grounds:
          - endpoints.POST /licensing/inspectors/{inspector_id}/leave-status
          - validations.priority_75_ERR_INSPECTOR_ON_LEAVE
          - errors[ERR_INSPECTOR_ON_LEAVE]
          - entities.Inspector.fields.status
        distinguishing_aspect: "ON_LEAVE is forward-looking only: the inspector's already-SCHEDULED visit survives untouched while a new scheduling request is refused with ERR_INSPECTOR_ON_LEAVE 409, and flipping back to ACTIVE restores scheduling without re-creating anything."
        test_recipe:
          setup:
            - "A CENTER provider and an inspector holding one SCHEDULED ANNUAL visit for 2026-08-10T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/providers"
              payload: { legal_name: "Bright Start Center", county_code: "CTY-01", site_address: "12 Elm St", program_type: "CENTER", requested_capacity: 10 }
              as: Applicant
              captures: { prov: $.data.id }
            - call: "POST /licensing/inspectors"
              payload: { full_name: "Ivy Cole", county_code: "CTY-01", certified_age_groups: ["PRESCHOOL"] }
              as: AgencyAdmin
              captures: { insp: $.data.id, insp_v1: $.data.version }
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${prov}", inspector_id: "${insp}", inspection_type: "ANNUAL", scheduled_for: "2026-08-10T09:00:00Z", target_age_groups: ["PRESCHOOL"] }
              as: LicensingSupervisor
              captures: { ins_a: $.data.id }
          trigger:
            - call: "POST /licensing/inspectors/${insp}/leave-status"
              payload: { status: "ON_LEAVE" }
              as: AgencyAdmin
              captures: { st_leave: $.data.status, insp_v2: $.data.version }
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${prov}", inspector_id: "${insp}", inspection_type: "ANNUAL", scheduled_for: "2026-08-14T09:00:00Z", target_age_groups: ["PRESCHOOL"] }
              as: LicensingSupervisor
              captures: { e_leave: $.data.error_id }
            - call: "POST /licensing/inspectors/${insp}/leave-status"
              payload: { status: "ACTIVE" }
              as: AgencyAdmin
              captures: { st_back: $.data.status }
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${prov}", inspector_id: "${insp}", inspection_type: "ANNUAL", scheduled_for: "2026-08-14T09:00:00Z", target_age_groups: ["PRESCHOOL"] }
              as: LicensingSupervisor
              captures: { ins_b: $.data.id }
          assert:
            - "${st_leave} == ON_LEAVE and ${insp_v2} == ${insp_v1} + 1"
            - "Inspection.${ins_a}.status is still SCHEDULED — going on leave voids nothing"
            - "${e_leave} == ERR_INSPECTOR_ON_LEAVE with HTTP 409"
            - "Inspector.${insp}.scheduled_visit_count == 1 after the refused request"
            - "${st_back} == ACTIVE and the identical request then returns HTTP 201 as Inspection.${ins_b}"
            - "Inspector.${insp}.scheduled_visit_count == 2 at the end"

      - name: endpoint_cross_reference_link_amendment_needs_a_pre_move_inspection
        claim_type: cross_reference_link
        grounds:
          - endpoints.POST /licensing/license-amendments/{amendment_id}/attach-inspection
          - validations.priority_51_ERR_INVALID_INSPECTION_TYPE
          - errors[ERR_INVALID_INSPECTION_TYPE]
          - state_machines.LicenseAmendment.PRE_INSPECTION_REQUIRED_to_SUBMITTED
          - concurrency_rules[amendment-create-stale-provider]
        distinguishing_aspect: "Both rows must exist and agree on type: attaching the provider's FINALIZED ANNUAL inspection is refused with ERR_INVALID_INSPECTION_TYPE 409, while its FINALIZED AMENDMENT_PRE_MOVE inspection links the SITE_MOVE amendment and moves it PRE_INSPECTION_REQUIRED to SUBMITTED."
        test_recipe:
          setup:
            - "A CENTER provider with two FINALIZED inspections — one ANNUAL on 2026-08-05 and one AMENDMENT_PRE_MOVE on 2026-08-06 — and a SITE_MOVE amendment created with the provider's current version."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/providers"
              payload: { legal_name: "Bright Start Center", county_code: "CTY-01", site_address: "12 Elm St", program_type: "CENTER", requested_capacity: 10 }
              as: Applicant
              captures: { prov: $.data.id }
            - call: "POST /licensing/inspectors"
              payload: { full_name: "Ivy Cole", county_code: "CTY-01", certified_age_groups: ["PRESCHOOL"] }
              as: AgencyAdmin
              captures: { insp: $.data.id }
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${prov}", inspector_id: "${insp}", inspection_type: "ANNUAL", scheduled_for: "2026-08-05T09:00:00Z", target_age_groups: ["PRESCHOOL"] }
              as: LicensingSupervisor
              captures: { ins_annual: $.data.id }
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${prov}", inspector_id: "${insp}", inspection_type: "AMENDMENT_PRE_MOVE", scheduled_for: "2026-08-06T09:00:00Z", target_age_groups: ["PRESCHOOL"] }
              as: LicensingSupervisor
              captures: { ins_move: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/inspections/${ins_annual}/start"
              as: LicensingInspector
              as_user_id: "${insp}"
            - call: "POST /licensing/inspections/${ins_annual}/submit-for-review"
              payload: { outcome: "PASS", age_groups_observed: ["PRESCHOOL"] }
              as: LicensingInspector
              as_user_id: "${insp}"
            - call: "POST /licensing/inspections/${ins_annual}/finalize"
              as: LicensingSupervisor
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T09:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/inspections/${ins_move}/start"
              as: LicensingInspector
              as_user_id: "${insp}"
            - call: "POST /licensing/inspections/${ins_move}/submit-for-review"
              payload: { outcome: "PASS", age_groups_observed: ["PRESCHOOL"] }
              as: LicensingInspector
              as_user_id: "${insp}"
            - call: "POST /licensing/inspections/${ins_move}/finalize"
              as: LicensingSupervisor
            - call: "GET /licensing/providers/${prov}"
              as: Applicant
              as_user_id: "${prov}"
              captures: { prov_v: $.data.version }
            - call: "POST /licensing/license-amendments"
              payload: { provider_id: "${prov}", amendment_type: "SITE_MOVE", expected_provider_version: "${prov_v}", new_site_address: "88 Oak Ave" }
              as: Applicant
              as_user_id: "${prov}"
              captures: { amd: $.data.id, amd_st: $.data.status, amd_req: $.data.requires_inspection }
          trigger:
            - call: "POST /licensing/license-amendments/${amd}/attach-inspection"
              payload: { pre_move_inspection_id: "${ins_annual}" }
              as: LicensingSupervisor
              captures: { e_type: $.data.error_id }
            - call: "POST /licensing/license-amendments/${amd}/attach-inspection"
              payload: { pre_move_inspection_id: "${ins_move}" }
              as: LicensingSupervisor
              captures: { amd_st2: $.data.status }
          assert:
            - "${amd_req} == true and ${amd_st} == PRE_INSPECTION_REQUIRED with effective_capacity_delta == 0 for SITE_MOVE"
            - "${e_type} == ERR_INVALID_INSPECTION_TYPE with HTTP 409 — the ANNUAL inspection is FINALIZED and belongs to the same provider, so only the type disqualifies it"
            - "LicenseAmendment.${amd}.pre_move_inspection_id is still null after the refusal"
            - "${amd_st2} == SUBMITTED and pre_move_inspection_id == ${ins_move}"
            - "LicenseAmendment.${amd}.version increments by exactly 1 across both trigger calls"

      - name: endpoint_computed_read_risk_assessment_defaults_to_enforcement_review
        claim_type: computed_read
        grounds:
          - endpoints.GET /licensing/providers/{provider_id}/risk-assessment
          - calculations.provider_risk_assessment
          - entities.Provider.fields.risk_tier
        distinguishing_aspect: "The computed read with variant omitted answers with variant ENFORCEMENT_REVIEW and risk_score 25.00 — points_component 15 plus CRITICAL_FLOOR_BONUS 10 — which is MODERATE, one tier above the stored LOW default the provider was born with."
        test_recipe:
          setup:
            - "A CENTER provider carrying 15 open points from a single FINALIZED CRITICAL PRESCHOOL citation at clock 2026-08-05T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/checklist-items"
              payload: { code: "SU-101", title: "Direct supervision of children", category: "SUPERVISION", default_severity: "CRITICAL", age_groups_applicable: ["INFANT", "TODDLER", "PRESCHOOL", "SCHOOL_AGE"], infant_sensitive: true }
              as: AgencyAdmin
              captures: { ci_su: $.data.id }
            - call: "POST /licensing/providers"
              payload: { legal_name: "Bright Start Center", county_code: "CTY-01", site_address: "12 Elm St", program_type: "CENTER", requested_capacity: 10 }
              as: Applicant
              captures: { prov: $.data.id }
