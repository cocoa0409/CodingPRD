      - name: appeal_regrade_binding_is_checked_before_the_appeal_state
        claim_type: priority_conflict
        grounds:
          - "validations[priority=7]"
          - "validations[priority=9]"
          - "errors[ERR_APPEAL_REGRADE_BINDING_INVALID]"
          - "errors[ERR_APPEAL_STATE_INVALID]"
          - "state_machines.Appeal.status.SAMPLE_ASSIGNED_to_UNDER_REVIEW"
        distinguishing_aspect: "A regrade carrying appeal_id has three independent bindings (appeal state SAMPLE_ASSIGNED, certificate belongs to the same request, sample equals assigned_sample_id) all collapsed into one priority-7 referential code, so it fires before the priority-9 appeal-state code that the very same FILED appeal would also violate on its own endpoints."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z."
            - "A DELEGATED area with an ACTIVE GRADING fee schedule, a certified probe, grader I0 (SAMPLING + GRADING) and ACTIVE regrader RA (GRADING)."
            - "A CORN request with a 6-portion sample, a FINAL grading result by I0 and a GRADE certificate issued by I0."
            - "A second FILE sample on the same request, used as the wrong-sample probe."
            - "An APPEAL filed by the applicant, still in FILED."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: ServiceAdmin
              payload: { current_utc: "2026-08-03T09:00:00Z" }
            - call: POST /grain-inspection/service-areas
