      - name: transfer_accept_cascade_spawns_successor_award
        grounds:
          - state_machines.TransferRequest.RELINQUISHED_to_ACCEPTED
          - state_machines.Award.ACTIVE_to_TRANSFERRED
          - entities.Award.fields.originating_transfer_id
        distinguishing_aspect: |
          Depth-3 chain from the transfer decide trigger: L1 TransferRequest RELINQUISHED -> ACCEPTED
          causes L2 the original Award ACTIVE -> TRANSFERRED with its commitment reduction, which
          itself causes L3 a successor Award to be created at the receiving institution with the
          relinquished amount and institute.committed_cents re-credited.
        test_recipe:
          setup:
            - "Funded award (total 30000000 cents, start 2027-01-01, 1 year, rate 0.5) with a RELINQUISHED transfer to a second institution effective 2027-07-01 (TIME_PRORATED 15123288); institute committed == 30000000 before accept"
