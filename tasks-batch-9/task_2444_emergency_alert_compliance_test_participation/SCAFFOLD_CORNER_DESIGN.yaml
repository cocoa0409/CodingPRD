          - "§1.6 ERR_DEVICE_STATION_MISMATCH: 'the referenced device's station_id differs from the referenced station's or test event's station_id'"
          - "§1.6 ERR_LOGGING_WINDOW_CLOSED (422): 'POST /test-log-entries when now is outside the closed interval [window_start_at, window_end_at]'"
        distinguishing_aspect: "With the clock past window_end_at, a log line naming another station's device returns ERR_DEVICE_STATION_MISMATCH while the very next call with the right device returns ERR_LOGGING_WINDOW_CLOSED — and inside the window the mismatch error still fires, so the referential check is neither skipped nor shadowed by the temporal one."
