        distinguishing_aspect: "The OLDER x SEVERE cell of the dose ladder is 8 raw hours, which OCCLUSION_MAX_DAILY_HOURS clips to 7; this is the only cell where the cap binds, so it proves the cap is applied rather than decorative."
        test_recipe:
          setup:
            - "A 10-year-old patient with a SIGNED EVALUATION, so age_band resolves to OLDER."
