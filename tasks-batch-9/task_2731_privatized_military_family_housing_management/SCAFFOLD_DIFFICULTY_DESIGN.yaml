      - name: bedroom_eligibility_child_turning_ten_on_control_date
        grounds:
          - calculations.bedroom_eligibility_determination
          - calculations.effective_control_date_determination
          - entities.Dependent.fields.date_of_birth
          - entities.WaitlistApplication.fields.bedroom_eligibility
          - endpoints.POST_/waitlist-applications
        distinguishing_aspect: |
          The metric is the SHARED_AGE_CEILING of 10, and the boundary is a
          birthday landing exactly ON effective_control_date: the formula's
          age() counts a birthday on the control date as reached, so a child
          born 2016-08-25 is 10 on control date 2026-08-25 and takes a private
          bedroom, while a child born one day later is 9 and shares a bedroom
          with his under-10 brother via ceil(2/2). One day of date-of-birth
