          setup:
            - "A tank at ERECTION_IN_PROGRESS: ACCEPTED foundation (COSINE_BEST_FIT, 8 points, baseline all 100.000 in), one ADEQUATE course fitted up, welder W-07, two vertical seams V1 and V2 on that course, both welded."
