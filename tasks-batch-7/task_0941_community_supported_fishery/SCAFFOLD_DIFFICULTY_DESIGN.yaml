  - rule_id: transitive_cascade
    instances:
      - name: discard_disposition_six_hop_cascade
        grounds:
          - state_machines.LandingLot.HOLD_to_DISCARDED
          - state_machines.SubLot.IN_TRANSIT_to_DESTROYED
          - state_machines.ShareDelivery.PACKED_to_VOIDED
          - state_machines.ShareDelivery.CHARGED_to_REFUNDED
          - state_machines.Subscription.NOT_DUE_to_SHORTFALL_FLAGGED
          - entities.Season.fields.shortfall_flag_count
        distinguishing_aspect: |
          One DISCARD disposition propagates six links deep, each caused by the previous one and
          not by the original call: lot DISCARDED causes sub-lot DESTROYED, which causes the box
          VOIDED, which causes the box REFUNDED, whose credited_count write causes the
          subscription's true_up_status SHORTFALL_FLAGGED, which causes Season.shortfall_flag_count
          to rise to 1. Its trigger is the quality disposition endpoint.
        test_recipe:
          setup:
            - "an OPEN season, a MEDIUM x PREMIUM_FINFISH x WEEKLY plan, one hub, one member"
            - "an ACTIVE fully paid HUB_PICKUP subscription joining at week 1"
            - "a 5.00 lb SALMON lot allocated to the week-1 box, split to the hub and packed, so the box is PACKED and CHARGED 4500"
            - "one breaching cold-chain leg of 25 minutes logged by hub operator hub-op-1, putting the lot on HOLD"
