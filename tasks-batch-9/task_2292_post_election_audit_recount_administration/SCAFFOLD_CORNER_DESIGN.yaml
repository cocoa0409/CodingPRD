              as: ElectionsDirector
              captures: { tb_id: "$.data.id" }
          assert:
            - "${e_c} == ERR_DUPLICATE_CONTEST_LABEL with response status 409"
            - "${e_t} == ERR_DUPLICATE_TEAM_LABEL with response status 409"
            - "the third and fourth calls return 201 with Contest.${cb_id}.contest_label == C1 and TallyTeam.${tb_id}.team_label == T-1"
