          - "state_machines.SurgeBooking.CONFIRMED_to_NO_SHOW"
        distinguishing_aspect: "Event walks SCHEDULED -> OPEN -> CLOSED -> COMPLETED purely by clock; the CONFIRMED booking is marked NO_SHOW at completion."
        test_recipe:
          setup: ["universal household ACTIVE; LEAF_SURGE event (window 2026-10-01..2026-11-01, service_date 2026-11-07, capacity 5) created at clock 2026-09-01; booking made at clock 2026-10-15"]
          setup_api_calls:
