            - { call: "POST /network/campaigns", payload: { advertiser_id: "${a_id}", name: "C1", flight_start_date: "2026-08-10", flight_end_date: "2026-08-20", contracted_impressions: 10000, cpm_cents: 2500, budget_cents: 100 }, as: SalesManager, as_user_id: "sm-1", captures: { c_id: "$.data.id" } }
            - { call: "POST /network/campaigns/${c_id}/submit", payload: {}, as: SalesManager, as_user_id: "sm-1" }
            - { call: "POST /network/campaigns/${c_id}/approve", payload: {}, as: SalesManager, as_user_id: "sm-2" }
