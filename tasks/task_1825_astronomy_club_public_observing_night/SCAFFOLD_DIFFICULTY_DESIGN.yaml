  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: booking_confirm_depends_on_event_state
        grounds:
          - state_machines.GroupVisitBooking.PENDING_to_CONFIRMED
          - state_machines.ObservingEvent.SCHEDULED_to_CANCELLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Pair: GroupVisitBooking -> ObservingEvent. Booking confirm is legal
          only while the host event is SCHEDULED or CONFIRMED; after event
          cancellation cascades bookings to CANCELLED, confirming a
          still-PENDING booking is impossible because the cascade already
          moved it — a PENDING booking on a CANCELLED event cannot exist
          post-cascade, so the guard is exercised via the event-state check
          at confirm time on a booking created pre-cancellation but never
          cascaded (PENDING branch is cascaded too) — the reachable dual
          is: confirm after event COMPLETED (terminal) must fail.
        test_recipe:
          setup:
            - "PUBLIC_NIGHT E CONFIRMED then COMPLETED; booking B PENDING created before completion (PENDING bookings are not completed by the cascade, only CONFIRMED ones are)"
          setup_api_calls:
            - call: "POST /club/membership-tiers"
              payload: { code: "FAMILY", annual_dues_cents: 180000, observatory_access_level: 2, loan_privilege: true, max_concurrent_loans: 3 }
