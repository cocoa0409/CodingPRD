  # =============================================================== errors ====
  - section: errors
    instances:
      - name: error_amenity_not_open_stub
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_AMENITY_NOT_OPEN]"
        excluded_because:
          difficulty_instance: event_venue_requires_amenity_open
          rationale: "Asserted as the first (failing) schedule leg of the named §1.8 instance."
      - name: error_event_lead_time_stub
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_EVENT_LEAD_TIME]"
        excluded_because:
          difficulty_instance: event_lead_time_vs_venue_overlap_priority
          rationale: "The priority-7 temporal error is the asserted outcome of the named §1.8 dual-failure instance."
      - name: error_venue_overlap_stub
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_VENUE_OVERLAP]"
        excluded_because:
          difficulty_instance: event_venue_half_open_adjacency
          rationale: "Interior-overlap rejection (and adjacency acceptance) is asserted in the named §1.8 instance."
      - name: error_tour_capacity_stub
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_TOUR_CAPACITY_REACHED]"
        excluded_because:
          difficulty_instance: sales_center_aggregate_capacity_overlap
          rationale: "The 4th-overlapping-booking rejection is asserted in the named §1.8 instance."
      - name: error_quorum_and_majority_stub
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_QUORUM_NOT_MET]"
          - "errors[ERR_ELECTION_MAJORITY_NOT_REACHED]"
        excluded_because:
          difficulty_instance: election_quorum_exact_boundary
          rationale: "Both vote-count failures and the successful certification are asserted in the named §1.8 instance."
      - name: error_assessment_cap_stub
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_ASSESSMENT_CAP_EXCEEDED]"
        excluded_because:
          difficulty_instance: assessment_uniform_vs_declarant_subsidy
          rationale: "The cap arithmetic (increase_pct 20.00 vs cap 20.00) is pinned in the named §1.8 instance; the override-gated failure and recovery legs live in the §1.9 calculations-section instance assessment_cap_override_flow (not a stub)."

