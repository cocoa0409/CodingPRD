          setup:
            - "Logical clock at 2026-03-01T00:00:00Z."
            - "Payer PAX is ACTIVE with min_malpractice_coverage_cents 100000000."
            - "Clinician Dana Reyes has a VERIFIED CA license and an ACTIVE malpractice policy with coverage 500000000, so both the license-geography and coverage floors are satisfied and the payer status is the only blocker."
