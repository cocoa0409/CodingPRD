scenario: "776. Résumé-Writing & Career-Coaching Service: client intake & target role/industry, package (résumé/LinkedIn/cover/coaching), draft & revision rounds, ATS-optimization & keyword, interview-prep session, satisfaction/interview guarantee, add-on & rush, delivery"
domain_name: "resume-career-coaching"
api_prefix: "/"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: flat
  # Peer entities linked by FKs (Order, Deliverable, CoachingSession, GuaranteeClaim,
  # AddOn, Payment, AtsScan, RevisionRequest) — mutations reference parents by id in
  # the path or body; there is no deep URL nesting beyond one level of sub-resource reads.
  state_machine_shape: cyclic
  # Deliverable carries a DRAFTED<->IN_REVISION revision loop; CoachingSession and
  # GuaranteeClaim add branching fork-join shapes with divergent side-effect sets.
  relationship_patterns:
    - one_to_many        # Order -> Deliverable/CoachingSession/AddOn/Payment/GuaranteeClaim; Deliverable -> RevisionRequest/AtsScan
    - cross_aggregate    # CoachingSession references Coach (a resource outside the Order aggregate)
  role_model: peer_roles
  # Client owns Orders and drives intake/revision/booking/claims; Coach owns production
  # work (drafts, ATS scans, session completion); CareerAdmin is the operational back office.
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ============================================================================
# §1.1 Entity-Relationship Table
# ============================================================================
entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Client full name."
      - name: email
        type: string
        source: input
        description: "Contact email."
      - name: status
        type: enum
        source: input
        description: "Account status. Only ACTIVE clients may create orders."
        default: ACTIVE
        constraints: "one of {ACTIVE, INACTIVE}"

  - name: Coach
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Coach full name."
      - name: email
        type: string
        source: input
        description: "Contact email."
      - name: specialty
        type: enum
        source: input
        description: "Coaching specialty."
        constraints: "one of {TECH, FINANCE, GENERAL, EXECUTIVE}"
      - name: buffer_minutes
        type: integer
        source: input
        description: "Minimum gap (minutes) required after each of this coach's sessions before the coach can start another session. Drives buffer-expanded overlap detection."
        default: 15
        constraints: ">= 0"
      - name: status
        type: enum
        source: input
        description: "Availability status. Only ACTIVE coaches may take new session bookings."
        default: ACTIVE
        constraints: "one of {ACTIVE, INACTIVE}"

  - name: PackagePlan
    parent: null
    common_fields: false
    fields:
      - name: tier
        type: enum
        source: input
        description: "Package tier."
        constraints: "one of {BASIC, PRO, EXECUTIVE}"
      - name: base_price_cents
        type: integer
        source: input
        description: "Base package price in cents (before add-ons, discounts, rush)."
        constraints: ">= 0"
      - name: included_deliverables
        type: array
        source: input
        description: "Deliverable types produced by this package; each becomes a Deliverable on order creation."
        constraints: "non-empty subset of {RESUME, LINKEDIN, COVER_LETTER}"
      - name: included_revision_rounds
        type: integer
        source: input
        description: "Free revision rounds granted to the order's revision-credit pool."
        constraints: ">= 0"
      - name: included_coaching_sessions
        type: integer
        source: input
        description: "Free coaching sessions granted to the order's session-credit pool."
        constraints: ">= 0"
      - name: includes_interview_prep
        type: boolean
        source: input
        description: "When true, one extra session credit is added to the order's session pool for interview prep."
        default: false
      - name: includes_ats
        type: boolean
        source: input
        description: "When true, ATS optimization scans are part of the package."
        default: false
      - name: guarantee_type
        type: enum
        source: input
        description: "Guarantee offered by this package."
        default: NONE
        constraints: "one of {NONE, SATISFACTION, INTERVIEW}"
      - name: rush_surcharge_pct
        type: number
        source: input
        description: "Fractional surcharge applied to the discounted subtotal when the order is rush."
        default: 0.30
        constraints: ">= 0"

  - name: Order
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: system
        description: "FK -> Client.id; set from the acting Client's X-User-ID at creation."
      - name: plan_id
        type: string
        source: input
        description: "FK -> PackagePlan.id; the package purchased."
      - name: target_role
        type: string
        source: input
        description: "Target job title the engagement is optimizing for."
      - name: target_industry
        type: string
        source: input
        description: "Target industry."
      - name: rush
        type: boolean
        source: input
        description: "Rush engagement flag; applies the plan's rush surcharge to pricing."
        default: false
      - name: requested_delivery_days
        type: integer
        source: input
        description: "Requested turnaround in days from confirmation."
        constraints: ">= 1"
      - name: coupon_code
        type: string
        source: input
        description: "Optional coupon code applied to pricing."
        default: null
        constraints: "one of {WELCOME10, SAVE50} or null"
      - name: status
        type: enum
        source: system
        description: "Order lifecycle state."
        default: INTAKE
        constraints: "one of {INTAKE, IN_PRODUCTION, READY, DELIVERED, CLOSED, REFUNDED}"
      - name: base_price_cents
        type: integer
        source: computed
        description: "Copied from PackagePlan.base_price_cents at creation."
      - name: addons_subtotal_cents
        type: integer
        source: computed
        description: "Sum of price_cents over the add-ons currently in scope for the active price variant."
      - name: discount_cents
        type: integer
        source: computed
        description: "Total discount (add-on volume discount + coupon discount) for the active price variant."
      - name: rush_surcharge_cents
        type: integer
        source: computed
        description: "Rush surcharge for the active price variant."
      - name: provisional_total_cents
        type: integer
        source: computed
        description: "Price quote computed at intake using intake-time add-ons only (order_price_quote, provisional variant)."
      - name: final_total_cents
        type: integer
        source: computed
        description: "Price quote computed at delivery using all non-cancelled add-ons (order_price_quote, final variant). Null until DELIVERED."
        default: null
      - name: amount_charged_cents
        type: integer
        source: system
        description: "Running sum of CHARGE Payment.amount_cents for this order."
        default: 0
      - name: amount_refunded_cents
        type: integer
        source: system
        description: "Running sum of REFUND Payment.amount_cents for this order."
        default: 0
      - name: net_collected_cents
        type: integer
        source: computed
        description: "amount_charged_cents - amount_refunded_cents."
      - name: revision_credits_included
        type: integer
        source: computed
        description: "Copied from PackagePlan.included_revision_rounds at creation."
      - name: revision_credits_purchased
        type: integer
        source: system
        description: "Count of EXTRA_REVISION add-ons purchased manually (each grants one revision credit)."
        default: 0
      - name: revision_credits_used
        type: integer
        source: system
        description: "Count of active (OPEN or ADDRESSED) revision rounds consumed."
        default: 0
      - name: revision_credits_remaining
        type: integer
        source: computed
        description: "max(0, revision_credits_included + revision_credits_purchased - revision_credits_used)."
      - name: sessions_included
        type: integer
        source: computed
        description: "included_coaching_sessions + (1 if includes_interview_prep else 0), from the plan."
      - name: sessions_purchased
        type: integer
        source: system
        description: "Count of EXTRA_COACHING / INTERVIEW_PREP add-ons purchased manually (each grants one session credit)."
        default: 0
      - name: sessions_used
        type: integer
        source: system
        description: "Count of non-cancelled sessions booked against this order."
        default: 0
      - name: deliverables_total
        type: integer
        source: computed
        description: "Number of Deliverables created for this order (len of plan.included_deliverables plus EXTRA_DELIVERABLE add-ons)."
      - name: deliverables_approved
        type: integer
        source: system
        description: "Count of Deliverables in APPROVED state."
        default: 0
      - name: guarantee_type
        type: enum
        source: computed
        description: "Copied from PackagePlan.guarantee_type at creation."
        constraints: "one of {NONE, SATISFACTION, INTERVIEW}"
      - name: delivered_at
        type: datetime
        source: system
        description: "Logical-clock timestamp when the order transitioned to DELIVERED. Null until then."
        default: null
      - name: deadline_at
        type: datetime
        source: computed
        description: "confirmation logical-clock time + requested_delivery_days. Set at confirm."
        default: null

  - name: Deliverable
    parent: Order
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: system
        description: "FK -> Order.id; owning order."
      - name: type
        type: enum
        source: system
        description: "Deliverable kind, seeded from the plan's included_deliverables (or an EXTRA_DELIVERABLE add-on)."
        constraints: "one of {RESUME, LINKEDIN, COVER_LETTER}"
      - name: status
        type: enum
        source: system
        description: "Deliverable lifecycle state."
        default: PENDING
        constraints: "one of {PENDING, DRAFTED, IN_REVISION, APPROVED, CANCELLED}"
      - name: revision_round_count
        type: integer
        source: system
        description: "Number of active revision rounds opened on this deliverable."
        default: 0
      - name: draft_count
        type: integer
        source: system
        description: "Number of drafts uploaded by the coach."
        default: 0
      - name: current_strict_ats_score
        type: integer
        source: computed
        description: "strict_score of the most recent AtsScan for this deliverable (by created_at). Null if none."
        default: null
      - name: current_semantic_ats_score
        type: integer
        source: computed
        description: "semantic_score of the most recent AtsScan for this deliverable (by created_at). Null if none."
        default: null

  - name: RevisionRequest
    parent: Deliverable
    common_fields: true
    fields:
      - name: deliverable_id
        type: string
        source: system
        description: "FK -> Deliverable.id; the deliverable under revision."
      - name: round_no
        type: integer
        source: system
        description: "1-based ordinal of this revision round on the deliverable."
      - name: reason
        type: string
        source: input
        description: "Client's revision instructions."
      - name: billable
        type: boolean
        source: computed
        description: "True when the order's revision-credit pool was already exhausted at request time (an overage)."
      - name: status
        type: enum
        source: system
        description: "Revision request state."
        default: OPEN
        constraints: "one of {OPEN, ADDRESSED, WITHDRAWN}"

  - name: CoachingSession
    parent: Order
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: system
        description: "FK -> Order.id; owning order (from path)."
      - name: coach_id
        type: string
        source: input
        description: "FK -> Coach.id; the coach delivering the session."
      - name: client_id
        type: string
        source: system
        description: "FK -> Client.id; denormalized from the order for client-calendar overlap checks."
      - name: session_type
        type: enum
        source: input
        description: "Session kind."
        constraints: "one of {COACHING, INTERVIEW_PREP}"
      - name: scheduled_start
        type: datetime
        source: input
        description: "Session start (ISO 8601 UTC)."
      - name: scheduled_end
        type: datetime
        source: input
        description: "Session end (ISO 8601 UTC); must be strictly after scheduled_start."
      - name: status
        type: enum
        source: system
        description: "Session state."
        default: SCHEDULED
        constraints: "one of {SCHEDULED, COMPLETED, CANCELLED, NO_SHOW}"
      - name: billable
        type: boolean
        source: computed
        description: "True when the order's session-credit pool was already exhausted at booking time (an overage)."
      - name: fee_cents
        type: integer
        source: computed
        description: "Overage fee charged for this session (0 when covered by an included/purchased credit)."

  - name: AddOn
    parent: Order
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: system
        description: "FK -> Order.id; owning order (from path)."
      - name: type
        type: enum
        source: input
        description: "Add-on kind."
        constraints: "one of {EXTRA_REVISION, EXTRA_COACHING, EXTRA_DELIVERABLE, INTERVIEW_PREP, RUSH}"
      - name: price_cents
        type: integer
        source: computed
        description: "Add-on price in cents, from ADDON_PRICES."
      - name: status
        type: enum
        source: system
        description: "Add-on state."
        default: PENDING
        constraints: "one of {PENDING, CHARGED, CANCELLED}"
      - name: auto_generated
        type: boolean
        source: system
        description: "True when the system created this add-on as an overage side-effect (billable revision/session), false for manual purchases."
        default: false
      - name: source_ref
        type: string
        source: system
        description: "Id of the RevisionRequest or CoachingSession that generated this add-on, when auto_generated."
        default: null

  - name: GuaranteeClaim
    parent: Order
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: system
        description: "FK -> Order.id; owning order (from path)."
      - name: claim_type
        type: enum
        source: input
        description: "Guarantee invoked."
        constraints: "one of {SATISFACTION, INTERVIEW}"
      - name: status
        type: enum
        source: system
        description: "Claim state."
        default: SUBMITTED
        constraints: "one of {SUBMITTED, APPROVED, REJECTED}"
      - name: refund_amount_cents
        type: integer
        source: computed
        description: "Refund issued on approval: full net_collected_cents for SATISFACTION, base_price_cents for INTERVIEW. 0 until APPROVED."
        default: 0
      - name: evidence
        type: string
        source: input
        description: "Client-supplied justification (e.g., no interviews after 90 days)."

  - name: Payment
    parent: Order
    common_fields: false
    fields:
      - name: order_id
        type: string
        source: system
        description: "FK -> Order.id; owning order."
      - name: type
        type: enum
        source: system
        description: "Ledger entry direction."
        constraints: "one of {CHARGE, REFUND}"
      - name: amount_cents
        type: integer
        source: system
        description: "Positive magnitude of the charge or refund in cents."
      - name: reason
        type: string
        source: system
        description: "What triggered this ledger entry (CONFIRM, REVISION_OVERAGE, SESSION_OVERAGE, SESSION_REFUND, GUARANTEE_REFUND)."

  - name: AtsScan
    parent: Deliverable
    common_fields: false
    fields:
      - name: deliverable_id
        type: string
        source: system
        description: "FK -> Deliverable.id; the scanned deliverable (from path)."
      - name: sections
        type: array
        source: input
        description: "Per-section keyword data: list of {name, weight, keywords_total, matched_strict, matched_semantic}."
      - name: strict_score
        type: integer
        source: computed
        description: "ATS score under exact keyword matching (ats_keyword_score, strict variant)."
      - name: semantic_score
        type: integer
        source: computed
        description: "ATS score under synonym-inclusive matching (ats_keyword_score, semantic variant)."
      - name: coverage_by_section
        type: object
        source: computed
        description: "Map of section name -> per-section strict integer coverage percent."

# ============================================================================
# §1.2 State Machine Table
# ============================================================================
state_machines:
  - entity: Order
    initial_state: INTAKE
    terminal_states: [REFUNDED]
    transitions:
      - from: INTAKE
        to: IN_PRODUCTION
        trigger: "POST /orders/{id}/confirm"
        actor: Client
        preconditions:
          - "order.status == INTAKE"
          - "acting Client owns the order (order.client_id == X-User-ID)"
        side_effects:
          - "create Payment(type=CHARGE, amount_cents=provisional_total_cents, reason=CONFIRM)"
          - "amount_charged_cents += provisional_total_cents"
          - "set deadline_at = clock_now + requested_delivery_days"
        note: "Charges the provisional quote up front; overages are charged as incurred."
      - from: IN_PRODUCTION
        to: READY
        trigger: "system: deliverables_approved reaches deliverables_total"
        actor: system
        preconditions:
          - "deliverables_approved == deliverables_total"
        side_effects: []
        note: "Bubble-up: fired as a side-effect of the last Deliverable DRAFTED->APPROVED transition."
      - from: READY
        to: DELIVERED
        trigger: "POST /orders/{id}/deliver"
        actor: CareerAdmin
        preconditions:
          - "order.status == READY"
        side_effects:
          - "compute final_total_cents via order_price_quote (final variant)"
          - "set delivered_at = clock_now"
      - from: DELIVERED
        to: CLOSED
        trigger: "POST /orders/{id}/accept"
        actor: Client
        preconditions:
          - "order.status == DELIVERED"
          - "acting Client owns the order"
        side_effects: []
      - from: DELIVERED
        to: REFUNDED
        trigger: "system: GuaranteeClaim SUBMITTED->APPROVED on this order"
        actor: system
        preconditions:
          - "order.status IN {DELIVERED, CLOSED}"
        side_effects:
          - "create Payment(type=REFUND, amount_cents=claim.refund_amount_cents, reason=GUARANTEE_REFUND)"
          - "amount_refunded_cents += claim.refund_amount_cents"
          - "for each CoachingSession of this order with status==SCHEDULED: transition it to CANCELLED (cascade; no separate session refund — the guarantee refund settles the order)"
        note: "Second hop of the guarantee cascade: the order entering REFUNDED is what cancels its scheduled sessions."
      - from: CLOSED
        to: REFUNDED
        trigger: "system: GuaranteeClaim SUBMITTED->APPROVED on this order"
        actor: system
        preconditions:
          - "order.status IN {DELIVERED, CLOSED}"
        side_effects:
          - "create Payment(type=REFUND, amount_cents=claim.refund_amount_cents, reason=GUARANTEE_REFUND)"
          - "amount_refunded_cents += claim.refund_amount_cents"
          - "for each CoachingSession of this order with status==SCHEDULED: transition it to CANCELLED (cascade)"

  - entity: Deliverable
    initial_state: PENDING
    terminal_states: [APPROVED, CANCELLED]
    transitions:
      - from: PENDING
        to: DRAFTED
        trigger: "POST /deliverables/{id}/drafts"
        actor: Coach
        preconditions:
          - "deliverable.status == PENDING"
          - "parent Order.status == IN_PRODUCTION"
        side_effects:
          - "draft_count += 1"
        note: "Cross-entity guard: first draft requires the order to be past intake."
      - from: DRAFTED
        to: IN_REVISION
        trigger: "POST /deliverables/{id}/revisions"
        actor: Client
        preconditions:
          - "deliverable.status == DRAFTED"
          - "acting Client owns the parent order"
        side_effects:
          - "create RevisionRequest(status=OPEN, round_no=revision_round_count+1)"
          - "revision_round_count += 1"
          - "run revision_billing: if order.revision_credits_used >= (revision_credits_included + revision_credits_purchased) then billable=true, create auto AddOn(EXTRA_REVISION) + CHARGE Payment (revision_overage_cascade)"
          - "order.revision_credits_used += 1"
      - from: IN_REVISION
        to: DRAFTED
        trigger: "POST /deliverables/{id}/drafts"
        actor: Coach
        preconditions:
          - "deliverable.status == IN_REVISION"
          - "parent Order.status == IN_PRODUCTION"
        side_effects:
          - "draft_count += 1"
          - "the OPEN RevisionRequest with the highest round_no -> status ADDRESSED"
        note: "Cyclic edge: coach re-drafts to close the revision round; deliverable loops back to DRAFTED."
      - from: IN_REVISION
        to: DRAFTED
        trigger: "POST /revisions/{id}/withdraw"
        actor: Client
        preconditions:
          - "deliverable.status == IN_REVISION"
          - "the revision request is OPEN and billable == false"
        side_effects:
          - "RevisionRequest.status -> WITHDRAWN"
          - "revision_round_count -= 1"
          - "order.revision_credits_used -= 1 (credit restored — compensating_invariant)"
      - from: DRAFTED
        to: APPROVED
        trigger: "POST /deliverables/{id}/approve"
        actor: Client
        preconditions:
          - "deliverable.status == DRAFTED"
          - "acting Client owns the parent order"
        side_effects:
          - "order.deliverables_approved += 1"
          - "if order.deliverables_approved == order.deliverables_total: Order IN_PRODUCTION -> READY (bubble-up)"
      - from: DRAFTED
        to: CANCELLED
        trigger: "system: parent Order -> REFUNDED"
        actor: system
        preconditions:
          - "parent Order transitioning to REFUNDED"
          - "deliverable.status IN {PENDING, DRAFTED, IN_REVISION}"
        side_effects: []
        note: "Only non-terminal deliverables are cancelled by the refund cascade."

  - entity: RevisionRequest
    initial_state: OPEN
    terminal_states: [ADDRESSED, WITHDRAWN]
    transitions:
      - from: OPEN
        to: ADDRESSED
        trigger: "POST /deliverables/{id}/drafts (coach addresses the open round)"
        actor: Coach
        preconditions:
          - "request.status == OPEN"
        side_effects: []
      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /revisions/{id}/withdraw"
        actor: Client
        preconditions:
          - "request.status == OPEN"
          - "request.billable == false"
        side_effects:
          - "see Deliverable IN_REVISION->DRAFTED withdraw edge for credit restoration"

  - entity: CoachingSession
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /sessions/{id}/complete"
        actor: Coach
        preconditions:
          - "session.status == SCHEDULED"
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /sessions/{id}/cancel"
        actor: Client
        preconditions:
          - "session.status == SCHEDULED"
          - "acting Client owns the parent order (or actor is CareerAdmin)"
        side_effects:
          - "order.sessions_used -= 1 (session credit restored)"
          - "if session.billable: create Payment(type=REFUND, amount_cents=session.fee_cents, reason=SESSION_REFUND); amount_refunded_cents += fee_cents; the auto AddOn (source_ref==session.id) -> CANCELLED (compensating_invariant, money)"
        note: "Divergent branch: user cancel refunds an overage fee."
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /sessions/{id}/no-show"
        actor: Coach
        preconditions:
          - "session.status == SCHEDULED"
        side_effects: []
        note: "Divergent branch: no-show consumes the session with no credit restoration and no refund."

  - entity: AddOn
    initial_state: PENDING
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING
        to: CHARGED
        trigger: "system: on creation the order is charged"
        actor: system
        preconditions:
          - "addon.status == PENDING"
        side_effects:
          - "create Payment(type=CHARGE, amount_cents=addon.price_cents, reason IN {REVISION_OVERAGE, SESSION_OVERAGE, MANUAL_ADDON})"
          - "amount_charged_cents += addon.price_cents"
          - "if type==EXTRA_REVISION and manual: order.revision_credits_purchased += 1"
          - "if type IN {EXTRA_COACHING, INTERVIEW_PREP} and manual: order.sessions_purchased += 1"
          - "if type==EXTRA_DELIVERABLE and manual: create a new PENDING Deliverable; order.deliverables_total += 1"
        note: "CHARGED is reached synchronously within the creating request."
      - from: CHARGED
        to: CANCELLED
        trigger: "system: the session/revision that generated this add-on is cancelled/withdrawn"
        actor: system
        preconditions:
          - "addon.status == CHARGED"
          - "addon.auto_generated == true"
        side_effects: []

  - entity: GuaranteeClaim
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /guarantee-claims/{id}/approve"
        actor: CareerAdmin
        preconditions:
          - "claim.status == SUBMITTED"
        side_effects:
          - "set refund_amount_cents = (order.net_collected_cents if claim_type==SATISFACTION else order.base_price_cents)"
          - "transition parent Order -> REFUNDED (guarantee_refund_cascade root)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /guarantee-claims/{id}/reject"
        actor: CareerAdmin
        preconditions:
          - "claim.status == SUBMITTED"
        side_effects: []
        note: "Divergent branch: rejection leaves the order untouched."

# ============================================================================
# §1.2.1 Concurrency Rules
# ============================================================================
concurrency_rules:
  - rule_id: session-book-stale-order
    parent_entity: Order
    write_endpoint: "POST /orders/{id}/sessions"
    occ_field: "expected_order_version"
    description: |
      Booking a CoachingSession against an Order whose version has advanced
      since the client last observed it is rejected. Each successful booking
      mutates the order (sessions_used and/or the ledger fields) and advances
      Order.version, so a client acting on a stale view of the order's
      remaining session credits carries an outdated expected_order_version and
      is turned away. Under natural semantics the second booking would itself
      succeed (a free slot on an active coach); the stale-version check is the
      only thing that rejects it.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ============================================================================
# §1.3 Calculation Rules Table
# ============================================================================
calculations:
  - name: order_price_quote
    trigger: "provisional variant on POST /orders (intake); final variant on POST /orders/{id}/deliver"
    algorithm: tiered_pricing
    formula: |
      # Pinned evaluation order — add-on volume discount and coupon are computed
      # on the pre-discount base/subtotal; the rush surcharge is applied LAST,
      # to the post-discount subtotal.
      addons_subtotal_cents = sum(a.price_cents for a in A)          # A depends on variant
      addon_count = len(A)
      subtotal_before_discount = base_price_cents + addons_subtotal_cents
      if addon_count >= 3:
          addon_discount = round_half_up(addons_subtotal_cents * ADDON_VOLUME_DISCOUNT_PCT)  # 0.10
      else:
          addon_discount = 0
      if coupon_code == "WELCOME10":
          coupon_discount = round_half_up(base_price_cents * 0.10)
      elif coupon_code == "SAVE50":
          coupon_discount = min(5000, subtotal_before_discount)
      else:
          coupon_discount = 0
      discount_cents = addon_discount + coupon_discount
      discounted_subtotal = max(0, subtotal_before_discount - discount_cents)
      if rush:
          rush_surcharge_cents = round_half_up(discounted_subtotal * rush_surcharge_pct)
      else:
          rush_surcharge_cents = 0
      total_cents = discounted_subtotal + rush_surcharge_cents
    input_set: "provisional: A = add-ons created at intake (order.addon_types, auto_generated=false). final: A = all AddOns with status != CANCELLED at delivery time."
    constants:
      ADDON_VOLUME_DISCOUNT_PCT: 0.10
      ADDON_PRICES: "{ EXTRA_REVISION: 4000, EXTRA_COACHING: 12000, EXTRA_DELIVERABLE: 9000, INTERVIEW_PREP: 15000, RUSH: 0 }"
      COUPON_WELCOME10_PCT: 0.10
      COUPON_SAVE50_FLAT: 5000
    precision: "integer cents, round_half_up on each intermediate rounding step"
    variants:
      - name: provisional
        when: "computed at intake, stored in provisional_total_cents"
        difference: "A includes only intake-time add-ons; overage add-ons incurred during production are excluded"
      - name: final
        when: "computed at delivery, stored in final_total_cents"
        difference: "A includes every non-cancelled add-on, including overage EXTRA_REVISION / EXTRA_COACHING add-ons generated during production"

  - name: ats_keyword_score
    trigger: "POST /deliverables/{id}/ats-scans"
    algorithm: weighted_scoring
    formula: |
      # Pinned rounding order: round EACH section's coverage to an integer
      # percent FIRST, THEN take the weight-average, THEN round the result to an
      # integer. (Round-per-section-then-aggregate; NOT aggregate-then-round.)
      W = sum(s.weight for s in sections)
      for s in sections:
          strict_pct[s]   = round_half_up(s.matched_strict   / s.keywords_total * 100)   # integer per section
          semantic_pct[s] = round_half_up(s.matched_semantic / s.keywords_total * 100)   # integer per section
      strict_score   = round_half_up( sum(strict_pct[s]   * s.weight for s in sections) / W )
      semantic_score = round_half_up( sum(semantic_pct[s] * s.weight for s in sections) / W )
      coverage_by_section = { s.name: strict_pct[s] for s in sections }
    input_set: "all sections in the request body; every section requires keywords_total > 0"
    constants: {}
    precision: "integer percent, round_half_up; per-section rounding applied BEFORE the weighted average"
    variants:
      - name: strict
        when: "exact keyword matches (matched_strict)"
        difference: "counts only literal keyword hits"
      - name: semantic
        when: "synonym-inclusive matches (matched_semantic)"
        difference: "counts synonym/related-term hits; matched_semantic >= matched_strict so semantic_score >= strict_score for the same résumé"

  - name: session_billing
    trigger: "POST /orders/{id}/sessions (booking)"
    algorithm: threshold
    formula: |
      pool = order.sessions_included + order.sessions_purchased
      if order.sessions_used < pool:
          billable = false
          fee_cents = 0
      else:
          billable = true
          fee_cents = SESSION_PRICES[session_type]     # COACHING: 12000, INTERVIEW_PREP: 15000
      # on success (after all validations pass):
      order.sessions_used += 1
      if billable:
          create AddOn(type = (EXTRA_COACHING if session_type==COACHING else INTERVIEW_PREP),
                       price_cents=fee_cents, auto_generated=true, source_ref=session.id) -> CHARGED
    input_set: "the single session being booked; pool read from the order at booking time"
    constants:
      SESSION_PRICES: "{ COACHING: 12000, INTERVIEW_PREP: 15000 }"
    precision: "integer cents"

  - name: revision_billing
    trigger: "POST /deliverables/{id}/revisions"
    algorithm: threshold
    formula: |
      pool = order.revision_credits_included + order.revision_credits_purchased
      if order.revision_credits_used < pool:
          billable = false
      else:
          billable = true
          create AddOn(type=EXTRA_REVISION, price_cents=4000, auto_generated=true,
                       source_ref=revision_request.id) -> CHARGED
      # on success:
      order.revision_credits_used += 1
    input_set: "the single revision round being opened; pool read from the order at request time"
    constants:
      EXTRA_REVISION_PRICE_CENTS: 4000
    precision: "integer cents"

# ============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# ============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "acting role is permitted to call this endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: business_constraint
    check: "request body is well-formed: required fields present, enums in range, types correct, scheduled_end strictly after scheduled_start, ATS sections non-empty with keywords_total > 0"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all write endpoints"
  - priority: 4
    category: existence
    check: "every resource named in the path exists (validated left-to-right)"
    error_id: ERR_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids (see §1.6 for the per-resource NOT_FOUND ids)"
  - priority: 5
    category: business_referential
    check: "entity_backed actor owns the target resource: Client acting on an order owns it (order.client_id == X-User-ID); Coach acting on a session is that session's coach"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Client/Coach mutations on owned resources"
  - priority: 6
    category: state
    check: "target resource is in a state that permits the requested transition (order IN_PRODUCTION for drafts/booking; deliverable DRAFTED for revision/approve; session SCHEDULED for complete/cancel/no-show; claim SUBMITTED for approve/reject; order READY for deliver; order DELIVERED/CLOSED for claims)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints (see §1.6 for the specific state error ids)"
  - priority: 7
    category: business_referential
    check: "cross-entity referential preconditions: coach is ACTIVE for a new booking; the deliverable belongs to the order; the plan offers the invoked guarantee"
    error_id: ERR_COACH_INACTIVE
    http_status: 409
    applies_to: "POST /orders/{id}/sessions; POST /orders/{id}/guarantee-claims"
  - priority: 8
    category: business_temporal
    check: "coach buffer-expanded overlap: the new session must not fall within buffer_minutes of any existing SCHEDULED session on the same coach"
    error_id: ERR_COACH_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /orders/{id}/sessions"
  - priority: 9
    category: business_temporal
    check: "client half-open overlap: the new session must not strictly overlap [start, end) any existing SCHEDULED session for the same client; back-to-back (touching endpoints) is allowed"
    error_id: ERR_CLIENT_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /orders/{id}/sessions"
  - priority: 10
    category: business_constraint
    check: "guarantee eligibility window: SATISFACTION within 14 days of delivered_at; INTERVIEW at least 90 days after delivered_at with zero completed interview-prep sessions on the order"
    error_id: ERR_CLAIM_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /orders/{id}/guarantee-claims"
  - priority: 11
    category: business_fiscal
    check: "OCC: expected_order_version equals the current Order.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /orders/{id}/sessions"

# ============================================================================
# §1.5 API Endpoint Table
# ============================================================================
endpoints:
  # --- configuration / actors ---
  - method: POST
    path: "/package-plans"
    description: "Create a package plan."
    roles: [CareerAdmin]
    code: 201
    input: [tier, base_price_cents, included_deliverables, included_revision_rounds, included_coaching_sessions, "includes_interview_prep?", "includes_ats?", "guarantee_type?", "rush_surcharge_pct?"]
    output: PackagePlan
    side_effects: []
  - method: GET
    path: "/package-plans/{id}"
    description: "Fetch a package plan."
    roles: [Client, Coach, CareerAdmin]
    code: 200
    input: []
    output: PackagePlan
    side_effects: []
  - method: GET
    path: "/package-plans"
    description: "List package plans."
    roles: [Client, Coach, CareerAdmin]
    code: 200
    input: ["tier?", "limit?", "offset?"]
    output: PackagePlan[]
    side_effects: []
  - method: POST
    path: "/clients"
    description: "Register a client."
    roles: [CareerAdmin]
    code: 201
    input: [name, email, "status?"]
    output: Client
    side_effects: []
  - method: GET
    path: "/clients/{id}"
    description: "Fetch a client."
    roles: [Client, Coach, CareerAdmin]
    code: 200
    input: []
    output: Client
    side_effects: []
  - method: POST
    path: "/coaches"
    description: "Register a coach."
    roles: [CareerAdmin]
    code: 201
    input: [name, email, specialty, "buffer_minutes?", "status?"]
    output: Coach
    side_effects: []
  - method: GET
    path: "/coaches/{id}"
    description: "Fetch a coach."
    roles: [Client, Coach, CareerAdmin]
    code: 200
    input: []
    output: Coach
    side_effects: []
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the logical clock. Server startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time. Deadlines and guarantee windows are evaluated against this logical clock."
    roles: [CareerAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["sets the logical clock used by deadline_at and guarantee eligibility"]

  # --- orders ---
  - method: POST
    path: "/orders"
    description: "Create an order (intake). Seeds one Deliverable per plan.included_deliverables and any intake add_on_types, then computes the provisional quote."
    roles: [Client]
    code: 201
    input: [plan_id, target_role, target_industry, requested_delivery_days, "rush?", "coupon_code?", "addon_types?"]
    output: Order
    side_effects:
      - "set client_id = X-User-ID"
      - "copy base_price_cents, revision_credits_included, sessions_included, guarantee_type from plan"
      - "create one Deliverable(status=PENDING) per included_deliverables type"
      - "for each addon_types entry: create a manual AddOn (CHARGED is NOT reached until confirm for intake add-ons; they count in provisional pricing)"
      - "compute provisional_total_cents, addons_subtotal_cents, discount_cents, rush_surcharge_cents via order_price_quote (provisional variant)"
      - "set deliverables_total"
  - method: GET
    path: "/orders/{id}"
    description: "Fetch an order."
    roles: [Client, Coach, CareerAdmin]
    code: 200
    input: []
    output: Order
    side_effects: []
  - method: GET
    path: "/orders"
    description: "List/filter orders. Filtered-list reverse lookup for Order.client_id and Order.plan_id."
    roles: [Client, Coach, CareerAdmin]
    code: 200
    input: ["client_id?", "plan_id?", "status?", "limit?", "offset?"]
    output: Order[]
    side_effects: []
  - method: POST
    path: "/orders/{id}/confirm"
    description: "Confirm intake: charge the provisional quote and move to production."
    roles: [Client]
    code: 200
    input: []
    output: Order
    side_effects: ["Order INTAKE -> IN_PRODUCTION (see §1.2)"]
  - method: POST
    path: "/orders/{id}/deliver"
    description: "Deliver a READY order: compute the final quote and stamp delivered_at."
    roles: [CareerAdmin]
    code: 200
    input: []
    output: Order
    side_effects: ["Order READY -> DELIVERED (see §1.2)"]
  - method: POST
    path: "/orders/{id}/accept"
    description: "Client accepts delivery, closing the order."
    roles: [Client]
    code: 200
    input: []
    output: Order
    side_effects: ["Order DELIVERED -> CLOSED"]
  - method: GET
    path: "/orders/{id}/deliverables"
    description: "List an order's deliverables (reverse lookup for Deliverable.order_id)."
    roles: [Client, Coach, CareerAdmin]
    code: 200
    input: []
    output: Deliverable[]
    side_effects: []
  - method: GET
    path: "/orders/{id}/addons"
    description: "List an order's add-ons (reverse lookup for AddOn.order_id)."
    roles: [Client, Coach, CareerAdmin]
    code: 200
    input: []
    output: AddOn[]
    side_effects: []
  - method: GET
    path: "/orders/{id}/payments"
    description: "List an order's ledger entries (reverse lookup for Payment.order_id)."
    roles: [Client, Coach, CareerAdmin]
    code: 200
    input: []
    output: Payment[]
    side_effects: []
  - method: GET
    path: "/orders/{id}/guarantee-claims"
    description: "List an order's guarantee claims (reverse lookup for GuaranteeClaim.order_id)."
    roles: [Client, Coach, CareerAdmin]
    code: 200
    input: []
    output: GuaranteeClaim[]
    side_effects: []
  - method: POST
    path: "/orders/{id}/addons"
    description: "Purchase a manual add-on on an order."
    roles: [Client]
    code: 201
    input: [type]
    output: AddOn
    side_effects: ["create AddOn then AddOn PENDING -> CHARGED (see §1.2); grants a credit / deliverable per type"]
  - method: POST
    path: "/orders/{id}/sessions"
    description: "Book a coaching or interview-prep session on an order. OCC-guarded on the order's version."
    roles: [Client]
    code: 201
    input: [coach_id, session_type, scheduled_start, scheduled_end, expected_order_version]
    output: CoachingSession
    side_effects:
      - "set client_id = order.client_id"
      - "run session_billing (may create an overage AddOn + CHARGE Payment)"
      - "order.sessions_used += 1"
      - "increments Order.version by 1"
  - method: POST
    path: "/orders/{id}/guarantee-claims"
    description: "Submit a satisfaction or interview guarantee claim on a delivered order."
    roles: [Client]
    code: 201
    input: [claim_type, evidence]
    output: GuaranteeClaim
    side_effects: ["create GuaranteeClaim(status=SUBMITTED)"]

  # --- deliverables ---
  - method: GET
    path: "/deliverables/{id}"
    description: "Fetch a deliverable."
    roles: [Client, Coach, CareerAdmin]
    code: 200
    input: []
    output: Deliverable
    side_effects: []
  - method: GET
    path: "/deliverables/{id}/revisions"
    description: "List a deliverable's revision requests (reverse lookup for RevisionRequest.deliverable_id)."
    roles: [Client, Coach, CareerAdmin]
    code: 200
    input: []
    output: RevisionRequest[]
    side_effects: []
  - method: GET
    path: "/deliverables/{id}/ats-scans"
    description: "List a deliverable's ATS scans (reverse lookup for AtsScan.deliverable_id)."
    roles: [Client, Coach, CareerAdmin]
    code: 200
    input: []
    output: AtsScan[]
    side_effects: []
  - method: POST
    path: "/deliverables/{id}/drafts"
    description: "Coach uploads a draft. First draft PENDING->DRAFTED; a re-draft IN_REVISION->DRAFTED addresses the open revision round."
    roles: [Coach]
    code: 200
    input: ["notes?"]
    output: Deliverable
    side_effects: ["Deliverable draft transition (see §1.2)"]
  - method: POST
    path: "/deliverables/{id}/revisions"
    description: "Client opens a revision round on a DRAFTED deliverable."
    roles: [Client]
    code: 201
    input: [reason]
    output: RevisionRequest
    side_effects: ["Deliverable DRAFTED -> IN_REVISION; run revision_billing (revision_overage_cascade)"]
  - method: POST
    path: "/deliverables/{id}/approve"
    description: "Client approves a DRAFTED deliverable."
    roles: [Client]
    code: 200
    input: []
    output: Deliverable
    side_effects: ["Deliverable DRAFTED -> APPROVED; bubble-up to Order READY when all approved"]
  - method: POST
    path: "/deliverables/{id}/ats-scans"
    description: "Coach runs an ATS keyword scan producing strict and semantic scores."
    roles: [Coach]
    code: 201
    input: [sections]
    output: AtsScan
    side_effects: ["compute strict_score/semantic_score via ats_keyword_score; refresh deliverable.current_strict_ats_score / current_semantic_ats_score"]

  # --- revisions ---
  - method: POST
    path: "/revisions/{id}/withdraw"
    description: "Client withdraws an OPEN, non-billable revision round, restoring the consumed credit."
    roles: [Client]
    code: 200
    input: []
    output: RevisionRequest
    side_effects: ["RevisionRequest OPEN -> WITHDRAWN; Deliverable IN_REVISION -> DRAFTED; restore revision credit (compensating_invariant)"]

  # --- sessions ---
  - method: GET
    path: "/sessions/{id}"
    description: "Fetch a coaching session."
    roles: [Client, Coach, CareerAdmin]
    code: 200
    input: []
    output: CoachingSession
    side_effects: []
  - method: GET
    path: "/sessions"
    description: "List/filter sessions. Filtered-list reverse lookup for CoachingSession.order_id, coach_id, and client_id."
    roles: [Client, Coach, CareerAdmin]
    code: 200
    input: ["order_id?", "coach_id?", "client_id?", "status?", "limit?", "offset?"]
    output: CoachingSession[]
    side_effects: []
  - method: POST
    path: "/sessions/{id}/complete"
    description: "Coach marks a session COMPLETED."
    roles: [Coach]
    code: 200
    input: []
    output: CoachingSession
    side_effects: ["CoachingSession SCHEDULED -> COMPLETED"]
  - method: POST
    path: "/sessions/{id}/cancel"
    description: "Cancel a scheduled session; refunds an overage fee and restores the session credit."
    roles: [Client, CareerAdmin]
    code: 200
    input: []
    output: CoachingSession
    side_effects: ["CoachingSession SCHEDULED -> CANCELLED (see §1.2)"]
  - method: POST
    path: "/sessions/{id}/no-show"
    description: "Coach marks a scheduled session NO_SHOW; no refund, credit stays consumed."
    roles: [Coach]
    code: 200
    input: []
    output: CoachingSession
    side_effects: ["CoachingSession SCHEDULED -> NO_SHOW"]

  # --- guarantee claims ---
  - method: GET
    path: "/guarantee-claims/{id}"
    description: "Fetch a guarantee claim."
    roles: [Client, Coach, CareerAdmin]
    code: 200
    input: []
    output: GuaranteeClaim
    side_effects: []
  - method: POST
    path: "/guarantee-claims/{id}/approve"
    description: "Admin approves a claim, issuing the refund and refunding the order (guarantee_refund_cascade)."
    roles: [CareerAdmin]
    code: 200
    input: []
    output: GuaranteeClaim
    side_effects: ["GuaranteeClaim SUBMITTED -> APPROVED; Order -> REFUNDED; cancel scheduled sessions"]
  - method: POST
    path: "/guarantee-claims/{id}/reject"
    description: "Admin rejects a claim."
    roles: [CareerAdmin]
    code: 200
    input: []
    output: GuaranteeClaim
    side_effects: ["GuaranteeClaim SUBMITTED -> REJECTED"]

# ============================================================================
# §1.6 Error Code Catalog
# ============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/unknown X-User-Role or missing X-User-ID."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Acting role not permitted for this endpoint."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "entity_backed actor is not the owner of the target resource."
  - id: ERR_VALIDATION
    http: 422
    condition: "Malformed body: missing required field, out-of-range enum, wrong type, scheduled_end <= scheduled_start, or empty/invalid ATS sections."
  - id: ERR_CLIENT_NOT_FOUND
    http: 404
    condition: "Referenced client id does not exist."
  - id: ERR_COACH_NOT_FOUND
    http: 404
    condition: "Referenced coach id does not exist."
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "Referenced package plan id does not exist."
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "Referenced order id does not exist."
  - id: ERR_DELIVERABLE_NOT_FOUND
    http: 404
    condition: "Referenced deliverable id does not exist."
  - id: ERR_REVISION_NOT_FOUND
    http: 404
    condition: "Referenced revision request id does not exist."
  - id: ERR_SESSION_NOT_FOUND
    http: 404
    condition: "Referenced session id does not exist."
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "Referenced guarantee claim id does not exist."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Generic wrong-state transition where no more specific state error applies (e.g., approve/reject a non-SUBMITTED claim, deliver a non-READY order, accept a non-DELIVERED order)."
  - id: ERR_ORDER_NOT_IN_PRODUCTION
    http: 409
    condition: "Deliverable draft or session booking attempted while the parent order is not IN_PRODUCTION."
  - id: ERR_DELIVERABLE_NOT_DRAFTED
    http: 409
    condition: "Revision or approval attempted on a deliverable not in DRAFTED state."
  - id: ERR_REVISION_NOT_WITHDRAWABLE
    http: 409
    condition: "Withdraw attempted on a revision request that is not OPEN or is billable."
  - id: ERR_SESSION_NOT_SCHEDULED
    http: 409
    condition: "complete/cancel/no-show attempted on a session not in SCHEDULED state."
  - id: ERR_COACH_INACTIVE
    http: 409
    condition: "New booking targets a coach whose status is INACTIVE."
  - id: ERR_COACH_SLOT_CONFLICT
    http: 409
    condition: "New session falls within buffer_minutes of an existing SCHEDULED session on the same coach."
  - id: ERR_CLIENT_SLOT_CONFLICT
    http: 409
    condition: "New session strictly overlaps [start,end) an existing SCHEDULED session for the same client."
  - id: ERR_ORDER_NOT_DELIVERED
    http: 409
    condition: "Guarantee claim submitted on an order not in DELIVERED or CLOSED state."
  - id: ERR_GUARANTEE_NOT_OFFERED
    http: 409
    condition: "Claim type not offered by the order's plan (plan guarantee_type mismatch or NONE)."
  - id: ERR_CLAIM_NOT_ELIGIBLE
    http: 409
    condition: "Guarantee eligibility window not met (SATISFACTION > 14 days after delivery; INTERVIEW < 90 days after delivery or interview-prep sessions were completed)."
  - id: ERR_CLAIM_ALREADY_EXISTS
    http: 409
    condition: "An open (SUBMITTED or APPROVED) claim already exists for the order."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_order_version does not match the order's current version (OCC)."

# ============================================================================
# §1.7 RBAC Matrix
# ============================================================================
roles:
  - name: Client
    description: "The résumé/coaching customer. Owns orders end-to-end: intake, confirmation, revisions, session booking, delivery acceptance, and guarantee claims."
    identity: "entity_backed:Client"
    exclusive_operations:
      - "POST /orders"
      - "POST /orders/{id}/confirm"
      - "POST /orders/{id}/accept"
      - "POST /orders/{id}/addons"
      - "POST /orders/{id}/sessions"
      - "POST /orders/{id}/guarantee-claims"
      - "POST /deliverables/{id}/revisions"
      - "POST /deliverables/{id}/approve"
      - "POST /revisions/{id}/withdraw"
    shared_operations:
      - "POST /sessions/{id}/cancel (with CareerAdmin)"
      - "GET reads"
  - name: Coach
    description: "Delivers production work: uploads drafts, runs ATS scans, completes or marks no-show on sessions."
    identity: "entity_backed:Coach"
    exclusive_operations:
      - "POST /deliverables/{id}/drafts"
      - "POST /deliverables/{id}/ats-scans"
      - "POST /sessions/{id}/complete"
      - "POST /sessions/{id}/no-show"
    shared_operations:
      - "GET reads"
  - name: CareerAdmin
    description: "Operational back office: manages plans, clients, coaches, the logical clock, order delivery, and guarantee-claim adjudication."
    identity: "opaque"
    exclusive_operations:
      - "POST /package-plans"
      - "POST /clients"
      - "POST /coaches"
      - "POST /_clock/set_current_utc"
      - "POST /orders/{id}/deliver"
      - "POST /guarantee-claims/{id}/approve"
      - "POST /guarantee-claims/{id}/reject"
    shared_operations:
      - "POST /sessions/{id}/cancel (with Client)"
      - "GET reads"
