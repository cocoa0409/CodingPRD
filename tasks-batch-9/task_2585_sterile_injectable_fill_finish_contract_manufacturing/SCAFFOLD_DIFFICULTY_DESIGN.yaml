      - name: component_demand_per_line_rounding_then_sum
        grounds:
          - calculations.component_demand_units
          - entities.BatchOrder.fields.component_demand_units
          - entities.ClientProject.fields.dosage_form
          - validations[priority=95]
        distinguishing_aspect: |
          Combinatorial mode (b): nested rounding where the ORDER of the two operations changes
          the integer answer. The pinned order applies the pack-multiple ceiling per component
          line and only then sums — target_fill_units 10000 gives VIAL 22*480 == 10560 plus
          STOPPER 11*1000 == 11000 == 21560, and the same 10000 units on a PRESYRINGE project
          gives SYRINGE 21*500 == 10500 plus PLUNGER 11*1000 == 11000 == 21500. The rejected
          sum-then-round order would return 21000 for the VIAL case; asserting 21560 and 21500
          simultaneously falsifies any implementation that sums the gross requirement first.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "FillingSuite FS-1 grade B, QUALIFIED with media_fill_valid_until 2027-03-03T00:00:00Z, operator OP-A QUALIFIED for ASEPTIC_INTERVENTION."
