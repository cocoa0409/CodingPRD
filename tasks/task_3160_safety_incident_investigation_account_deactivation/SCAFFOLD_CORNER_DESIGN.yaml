              as: PlatformAdmin
            - call: "POST /safety/platform-policies"
              payload: { region_code: "R1", sd_floor_severity: "S4" }
              as: PlatformAdmin
            - call: "POST /safety/accounts"
              payload: { account_type: "DRIVER", home_region_code: "R1", legal_name: "Dario Nunes", contact_email: "dario.nunes@example.com" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /safety/incidents"
              payload: { account_id: "${acct_id}", reporter_type: "THIRD_PARTY", incident_category: "PHYSICAL_ASSAULT" }
              as: SafetyInvestigator
              captures: { inc_id: $.data.id, inc_v: $.data.version }
            - call: "POST /safety/incidents/${inc_id}/hold"
              payload: {}
              as: SafetyInvestigator
            - call: "POST /safety/incidents/${inc_id}/evidence"
              payload: { evidence_type: "TRIP_DATA", evidence_weight: "DISPOSITIVE" }
              as: SafetyInvestigator
              captures: { ev1: $.data.id }
            - call: "POST /safety/incidents/${inc_id}/evidence"
              payload: { evidence_type: "RATINGS_HISTORY", evidence_weight: "DISPOSITIVE" }
              as: SafetyInvestigator
              captures: { ev2: $.data.id }
            - call: "POST /safety/incidents/${inc_id}/evidence/accept"
              payload: { evidence_id: "${ev1}", accepted: true }
              as: SafetyInvestigator
            - call: "POST /safety/incidents/${inc_id}/evidence/accept"
              payload: { evidence_id: "${ev2}", accepted: true }
              as: SafetyInvestigator
              captures: { inc_v_ready: $.data.version }
          trigger:
            - call: "POST /safety/incidents/${inc_id}/decision"
              payload: { decision_category: "RESTRICTED", decision_basis: "Appeal reviewer attempting to commit the primary decision rather than review it.", expected_incident_version: "${inc_v_ready}" }
              as: SafetyAppealReviewer
              captures: { reviewer_decision_err: $.data.error_id }
            - call: "POST /safety/incidents/${inc_id}/appeals"
              payload: {}
              as: SafetyAppealReviewer
              captures: { premature_appeal_err: $.data.error_id }
          assert:
            - "the appeal reviewer's decision attempt is refused with error_id == \"ERR_UNAUTHORIZED\" with HTTP 403"
            - "the appeal attempt against an undecided incident is refused with error_id == \"ERR_INVALID_STATE\" with HTTP 409, because the incident is not at DECIDED"
            - "the two refusals come from different validation priorities, so the operation-layer separation and the state layer are independently observable"
            - "SafetyIncident.${inc_id}.incident_status is still \"PENDING_DECISION\" and decision_maker_user_id is still null"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:

      - name: restriction_expiry_restores_the_account_and_freezes_the_posture
        claim_type: soft_delete
        grounds:
          - endpoints.POST_/safety/enforcement-actions/expiry-sweep
          - entities.Account.fields.safety_posture
          - calculations.risk_tier_regression_from_restriction_expiry
        distinguishing_aspect: "The standing enforcement action is retained and marked EXPIRED rather than deleted, so the account keeps a queryable history while its posture returns to OPEN and its standing count returns to zero."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. R1 policy with sd_floor_severity S4. One ACTIVE driver account whose S2-incident restriction has effective_at 2026-10-01T00:00:00Z and expires_at 2027-10-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety/platform-policies"
              payload: { region_code: "R1", sd_floor_severity: "S4", appeal_window_days: 30 }
              as: PlatformAdmin
            - call: "POST /safety/accounts"
              payload: { account_type: "DRIVER", home_region_code: "R1", legal_name: "Ema Fischer", contact_email: "ema.fischer@example.com" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /safety/incidents"
              payload: { account_id: "${acct_id}", reporter_type: "THIRD_PARTY", incident_category: "PROPERTY_DAMAGE" }
              as: SafetyInvestigator
              captures: { inc_id: $.data.id, inc_v: $.data.version }
            - call: "POST /safety/incidents/${inc_id}/hold"
              payload: {}
              as: SafetyInvestigator
            - call: "POST /safety/incidents/${inc_id}/evidence"
              payload: { evidence_type: "EXTERNAL_RECORD", evidence_weight: "DISPOSITIVE" }
              as: SafetyInvestigator
              captures: { ev1: $.data.id }
            - call: "POST /safety/incidents/${inc_id}/evidence"
              payload: { evidence_type: "TRIP_DATA", evidence_weight: "DISPOSITIVE" }
              as: SafetyInvestigator
              captures: { ev2: $.data.id }
            - call: "POST /safety/incidents/${inc_id}/evidence/accept"
              payload: { evidence_id: "${ev1}", accepted: true }
              as: SafetyInvestigator
            - call: "POST /safety/incidents/${inc_id}/evidence/accept"
              payload: { evidence_id: "${ev2}", accepted: true }
              as: SafetyInvestigator
              captures: { inc_v_ready: $.data.version }
            - call: "POST /safety/incidents/${inc_id}/decision"
              payload: { decision_category: "RESTRICTED", decision_basis: "Property damage at the provisional threshold, routed to a restriction.", expected_incident_version: "${inc_v_ready}" }
              as: SafetyInvestigator
            - call: "GET /safety/accounts/${acct_id}/enforcement-actions"
              payload: {}
              as: SafetyOperationsLead
              captures: { act_id: "$.data[0].id", act_status: "$.data[0].enforcement_status" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /safety/accounts/${acct_id}"
              payload: {}
              as: PlatformAdmin
              captures: { pre_sweep_v: $.data.version, pre_sweep_standing: $.data.standing_enforcement_count }
          trigger:
            - call: "POST /safety/enforcement-actions/expiry-sweep"
              payload: { account_id: "${acct_id}", expected_account_version: "${pre_sweep_v}" }
              as: SafetyOperationsLead
              captures: { post_status: $.data.status, post_standing: $.data.standing_enforcement_count, post_posture: $.data.safety_posture }
            - call: "GET /safety/enforcement-actions/${act_id}"
              payload: {}
              as: SafetyOperationsLead
              captures: { retained_status: $.data.enforcement_status, retained_outcome: $.data.outcome }
          assert:
            - "the sweep returns 200 with Account.${acct_id}.status == \"ACTIVE\" and standing_enforcement_count == 0 and safety_posture == \"OPEN\""
            - "the enforcement action is still retrievable at GET /safety/enforcement-actions/${act_id} with enforcement_status == \"EXPIRED\""
            - "EnforcementAction.${act_id}.outcome is still \"RESTRICTED\", so the history is retained rather than erased"
            - "GET /safety/enforcement-actions?account_id=${acct_id} returns 1 row rather than 0, so the expired action remains queryable"

      - name: dormancy_sweep_advances_links_through_both_boundaries
        claim_type: scheduled_actions
        grounds:
          - state_machines.AccountDeviceLink.transitions.LINKED_to_DORMANT
          - state_machines.AccountDeviceLink.transitions.DORMANT_to_SEVERED
          - entities.AccountDeviceLink.fields.last_seen_at
        distinguishing_aspect: "Two date-driven boundaries advance the same row in sequence, with the 180-day edge opening the dormancy band and the 365-day edge sealing it, so the sweep's effect depends entirely on clock position."
        test_recipe:
          setup:
            - "Logical clock at 2026-04-01T00:00:00Z. R1 policy published. One ACTIVE driver account and one OPEN cluster linked at that clock, so last_seen_at is 2026-04-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety/platform-policies"
              payload: { region_code: "R1", sd_floor_severity: "S4" }
              as: PlatformAdmin
            - call: "POST /safety/accounts"
              payload: { account_type: "DRIVER", home_region_code: "R1", legal_name: "Femi Adebayo", contact_email: "femi.adebayo@example.com" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /safety/device-clusters"
              payload: { cluster_key: "dc-dormancy", region_code: "R1" }
              as: PlatformAdmin
              captures: { clust_id: $.data.id }
            - call: "POST /safety/account-device-links"
              payload: { account_id: "${acct_id}", device_cluster_id: "${clust_id}", fingerprint_hash: "fp-dormancy" }
              as: SafetyInvestigator
              captures: { link_id: $.data.id, link_seen: $.data.last_seen_at, link_status0: $.data.link_status }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /safety/account-device-links/dormancy-sweep"
              payload: {}
              as: PlatformAdmin
            - call: "GET /safety/account-device-links/${link_id}"
              payload: {}
              as: SafetyOperationsLead
              captures: { status_before_180: $.data.link_status }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety/account-device-links/dormancy-sweep"
              payload: {}
              as: PlatformAdmin
            - call: "GET /safety/account-device-links/${link_id}"
              payload: {}
              as: SafetyOperationsLead
              captures: { status_after_187: $.data.link_status }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety/account-device-links/dormancy-sweep"
              payload: {}
              as: PlatformAdmin
            - call: "GET /safety/account-device-links/${link_id}"
              payload: {}
              as: SafetyOperationsLead
              captures: { status_after_365: $.data.link_status }
          assert:
            - "the link is created at link_status == \"LINKED\" with last_seen_at == \"2026-04-01T00:00:00Z\""
            - "at 2026-09-01T00:00:00Z (153 days) the sweep leaves the link at \"LINKED\", because the 180-day boundary has not been reached"
            - "at 2026-10-05T00:00:00Z (187 days) the sweep moves the link to \"DORMANT\""
            - "at 2027-04-01T00:00:00Z (365 days exactly) the sweep moves the link to \"SEVERED\", so the second boundary is inclusive at >= and not >"

      - name: config_advance_steps_the_knob_counter_and_recomputes_clusters
        claim_type: derived_field_reconciliation
        grounds:
          - endpoints.POST_/safety/config/advance
          - entities.DeviceCluster.fields.cluster_risk_generation_index
          - entities.Account.fields.policy_generation_index
        distinguishing_aspect: "A single advance call reconciles three denormalized fields across three entity types at once, and the same call against a different counter leaves the periodicity generation untouched while still re-stamping the accounts."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. R1 policy with knob_generation_index 1 and review_generation_index 1. One ACTIVE driver account and one OPEN cluster carrying that account's device link."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /safety/platform-policies"
              payload: { region_code: "R1", sd_floor_severity: "S4", knob_generation_index: 1, review_generation_index: 1 }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /safety/accounts"
              payload: { account_type: "DRIVER", home_region_code: "R1", legal_name: "Gus Lindholm", contact_email: "gus.lindholm@example.com" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, acct_gen0: $.data.policy_generation_index }
            - call: "POST /safety/device-clusters"
              payload: { cluster_key: "dc-advance", region_code: "R1" }
              as: PlatformAdmin
              captures: { clust_id: $.data.id, clust_gen0: $.data.cluster_risk_generation_index }
            - call: "POST /safety/account-device-links"
              payload: { account_id: "${acct_id}", device_cluster_id: "${clust_id}", fingerprint_hash: "fp-advance" }
              as: SafetyInvestigator
          trigger:
            - call: "POST /safety/config/advance"
              payload: { region_code: "R1", advance_counter: "knob_generation_index" }
              as: PlatformAdmin
              captures: { knob_gen: $.data.knob_generation_index, rev_gen: $.data.review_generation_index }
            - call: "GET /safety/accounts/${acct_id}"
              payload: {}
              as: PlatformAdmin
              captures: { acct_gen1: $.data.policy_generation_index }
            - call: "GET /safety/device-clusters/${clust_id}"
              payload: {}
              as: SafetyOperationsLead
              captures: { clust_gen1: $.data.cluster_risk_generation_index }
          assert:
            - "the account's policy_generation_index starts at 1, matching the policy knob_generation_index at creation"
            - "after the advance, PlatformPolicy.${pol_id}.knob_generation_index == 2 and review_generation_index is unchanged at 1, so only the named counter stepped"
            - "Account.${acct_id}.policy_generation_index == 2, re-stamped from the advanced policy"
            - "DeviceCluster.${clust_id}.cluster_risk_generation_index == 2, stamped from the advanced knob counter rather than the untouched periodicity counter"

