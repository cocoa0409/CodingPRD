        grounds:
          - validations[priority=28]
          - state_machines.Device.QUARANTINED_to_AVAILABLE
          - state_machines.TestOrder.READY_to_IN_TESTING
          - entities.Device.fields.status
          - endpoints[POST /pft-lab/devices/{device_id}/return-to-service]
        distinguishing_aspect: |
          TestSession creation is gated on a field of a different entity: with TestOrder ORD-1 held at READY
          and the payload byte-identical across both attempts, the request is refused while
          Device.status == QUARANTINED and succeeds once return-to-service flips that same Device field to
