              as: InKindOfficer
              captures: { res_after_abort: $.data.quantity_reserved, avail_after_abort: $.data.quantity_available, total_after_abort: $.data.quantity_total }
          assert:
            - "after reserve: res_after_reserve == 3 and avail_after_reserve == 7 (3 + 7 == 10)"
            - "after abort (compensating action): res_after_abort == 0 and avail_after_abort == 10 and total_after_abort == 10 — exactly the pre-reserve values"
            - "PlanLineItem.${line_id}.status == RELEASED and DonationOffer.${offer_id}.status == AVAILABLE"
            - "invariant quantity_reserved + quantity_available == quantity_total held at every observation"

