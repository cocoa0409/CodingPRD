      - name: shipper_history_base_excludes_provisional_and_out_of_window_rows
        claim_type: Input Set Filtering
        grounds:
          - calculations.shipper_history_base
          - entities.Nomination.fields.history_base_bbl
          - entities.Nomination.fields.allocation_class
        distinguishing_aspect: |
          Four history rows exist for ALPHA on this segment but only two qualify: a PROVISIONAL row
          of 90000 bbl inside the window is excluded by record_status and a FINAL row of 88000 bbl
