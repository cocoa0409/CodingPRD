      - name: appraiser_license_safety_outranks_capacity_constraint
        grounds:
          - validations[priority=51]
          - validations[priority=55]
          - calculations.appraiser_engagement_load
          - entities.Appraiser.fields.license_expires_on
          - errors[ERR_APPRAISER_LICENSE_EXPIRED]
        distinguishing_aspect: |
          A different colliding pair: business_safety (priority 51,
          ERR_APPRAISER_LICENSE_EXPIRED, 422) against business_constraint
          (priority 55, ERR_APPRAISER_CAPACITY_EXCEEDED, 409). One POST
          /appraisals violates both - engagement_end_on 2026-09-05T00:00:00Z runs
          past license_expires_on 2026-09-01T00:00:00Z AND the requested closed
          interval overlaps 2 in-flight engagements, hitting
          APPRAISER_MAX_CONCURRENT_ENGAGEMENTS - and the response MUST be
          ERR_APPRAISER_LICENSE_EXPIRED with HTTP 422.
        test_recipe:
          setup:
            - "One custodian Agency and one Parcel."
            - "One Appraiser with license_expires_on 2026-09-01T00:00:00Z and license_status ACTIVE."
            - "Two Appraisal rows in status ORDERED for that appraiser with closed engagement intervals [2026-08-02, 2026-08-20] and [2026-08-25, 2026-08-31]; these two do not overlap each other, so both were admissible, and the Parcel version has advanced to 2."
            - "The logical clock is still the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "City of Riverbend", agency_type: "MUNICIPAL", contact_email: "realproperty@riverbend.gov" }
              as: SystemAdministrator
              captures: { cust_agency_id: "$.data.id" }
            - call: "POST /parcels"
              payload: { apn: "APN-2693-010", address: "5 Foundry Row", acreage: 0.9, zoning_code: "I-1", book_value_cents: 40000000, custodian_agency_id: "${cust_agency_id}" }
              as: RealPropertyOfficer
              captures: { parcel_id: "$.data.id" }
            - call: "POST /appraisers"
              payload: { name: "Orrin Vasquez MAI", license_number: "AG-44128", license_expires_on: "2026-09-01T00:00:00Z" }
              as: SystemAdministrator
              captures: { appraiser_id: "$.data.id" }
            - call: "GET /parcels/${parcel_id}"
              payload: {}
              as: RealPropertyOfficer
              captures: { parcel_v1: "$.data.version" }
            - call: "POST /appraisals"
              payload: { parcel_id: "${parcel_id}", appraiser_id: "${appraiser_id}", method: "SALES_COMPARISON", engagement_start_on: "2026-08-02T00:00:00Z", engagement_end_on: "2026-08-20T00:00:00Z", expected_parcel_version: "${parcel_v1}" }
              as: RealPropertyOfficer
              captures: { appraisal_1_id: "$.data.id" }
            - call: "GET /parcels/${parcel_id}"
              payload: {}
              as: RealPropertyOfficer
              captures: { parcel_v2: "$.data.version" }
            - call: "POST /appraisals"
              payload: { parcel_id: "${parcel_id}", appraiser_id: "${appraiser_id}", method: "COST", engagement_start_on: "2026-08-25T00:00:00Z", engagement_end_on: "2026-08-31T00:00:00Z", expected_parcel_version: "${parcel_v2}" }
              as: RealPropertyOfficer
              captures: { appraisal_2_id: "$.data.id" }
            - call: "GET /parcels/${parcel_id}"
              payload: {}
              as: RealPropertyOfficer
              captures: { parcel_v3: "$.data.version" }
          trigger:
            - call: "POST /appraisals"
              payload: { parcel_id: "${parcel_id}", appraiser_id: "${appraiser_id}", method: "INCOME", engagement_start_on: "2026-08-20T00:00:00Z", engagement_end_on: "2026-09-05T00:00:00Z", expected_parcel_version: "${parcel_v3}" }
              as: RealPropertyOfficer
          assert:
            - "the trigger response is HTTP 422 with data.error_id == ERR_APPRAISER_LICENSE_EXPIRED"
            - "the trigger response data.error_id != ERR_APPRAISER_CAPACITY_EXCEEDED"
            - "exactly 2 Appraisal rows exist with appraiser_id == ${appraiser_id}, namely ${appraisal_1_id} and ${appraisal_2_id}, both still in status ORDERED"
            - "Parcel.${parcel_id}.version == ${parcel_v3}, i.e. the rejected create consumed no OCC token"
            - "Appraiser.${appraiser_id}.license_status == ACTIVE, proving the rejection came from the license_expires_on > engagement_end_on clause and not from a status flip"

  - rule_id: boundary_precision_check
    instances:
      - name: revert_requires_clock_strictly_after_cure_deadline_instant
        grounds:
          - validations[priority=50]
          - state_machines.Conveyance.VIOLATION_NOTICED_to_REVERTED
          - entities.Conveyance.fields.cure_deadline_at
          - calculations.statutory_window_deadlines
          - errors[ERR_CURE_PERIOD_NOT_EXPIRED]
        distinguishing_aspect: |
          The boundary metric is a TIMESTAMP INSTANT on POST
          /conveyances/{id}/revert: with violation_noticed_at
          2027-01-15T00:00:00Z and reverter_cure_period_days 30,
          cure_deadline_at is 2027-02-14T00:00:00Z, and the comparison is
          STRICT - at clock == 2027-02-14T00:00:00Z the revert is refused with
          ERR_CURE_PERIOD_NOT_EXPIRED (409) because the deadline instant itself
          belongs to the grantee, while at 2027-02-14T00:00:01Z, one second
          later, the same call succeeds.
        test_recipe:
          setup:
            - "One Fund F-GEN with priority_rank 1 and allocation_pct 1.0."
            - "One custodian Agency, one TRANSIT Agency that DECLINES its notice, one Parcel with book_value_cents 70000000, one CURED TitleCurativeItem at 250000 and an ACCEPTED Appraisal at 100000000."
            - "A Conveyance RECORDED at clock 2026-12-31T00:00:00Z from a COMPETITIVE_SALE award of amount_cents 108000000, with reverter_cure_period_days 30, so compliance_status is COMPLIANT."
