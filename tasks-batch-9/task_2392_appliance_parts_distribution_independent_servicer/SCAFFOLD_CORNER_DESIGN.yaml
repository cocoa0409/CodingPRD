              as_user_id: "${acct_b_id}"
              captures: { line_b_id: $.data.id }
          trigger:
            - call: "GET /part-orders/${order_b_id}"
              payload: {}
              as: Servicer
              as_user_id: "${acct_a_id}"
              captures: { err_scope: $.data.error_id }
