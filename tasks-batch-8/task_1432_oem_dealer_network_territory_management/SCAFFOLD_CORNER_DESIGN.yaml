# =============================================================================
# 1.9 Scaffold Corner Design - Coverage Index for Non-Difficulty Tests
# OEM Dealer Network & Territory Management
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: dealer_creation_applies_defaults_and_system_fields
        claim_type: creation_defaults_system_fields
        grounds:
          - "entities.Dealer"
          - "state_machines.Dealer"
        distinguishing_aspect: "POST /network/dealers returns 201 with server-minted UUID id, status ONBOARDING (initial state), tier BRONZE, all computed counters 0, version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /network/dealers", payload: { name: "Dealer Z1", dealer_code: "DL-Z1", region: "West", credit_limit_cents: 100000, min_stock_value_cents: 500 }, as: OemNetworkAdmin, captures: { d: $.data.id, d_v: $.data.version } }
          trigger:
            - { call: "GET /network/dealers/${d}", as: Any }
          assert:
            - "Dealer.${d}.status == ONBOARDING (initial state)"
            - "Dealer.${d}.tier == BRONZE (default)"
            - "Dealer.${d}.floorplan_utilization_cents == 0 and chargeback_balance_cents == 0 and discount_reconciliation_cents == 0 and parts_purchases_ytd_cents == 0"
            - "Dealer.${d}.stock_compliant == false (default)"
            - "Dealer.${d}.version == 1 and created_at/updated_at present"

      - name: dealer_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "entities.Dealer.fields.credit_limit_cents"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Omitting required input credit_limit_cents is rejected with ERR_INVALID_REQUEST 400 and no dealer is persisted."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /network/dealers", payload: { name: "Dealer Z2", dealer_code: "DL-Z2", region: "West", min_stock_value_cents: 500 }, as: OemNetworkAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 400"
            - "GET /network/dealers returns total_count == 0"

      - name: dealer_get_nonexistent_id_returns_not_found
        claim_type: not_found
        grounds:
          - "errors[ERR_DEALER_NOT_FOUND]"
          - "validations[priority=4]"
        distinguishing_aspect: "GET with a well-formed but unknown dealer id yields ERR_DEALER_NOT_FOUND 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /network/dealers/00000000-0000-0000-0000-000000000000", as: Any, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DEALER_NOT_FOUND"
            - "HTTP status == 404"

      - name: duplicate_dealer_code_rejected
        claim_type: type_constraints
        grounds:
          - "entities.Dealer.fields.dealer_code"
          - "errors[ERR_DUPLICATE_DEALER_CODE]"
          - "validations[priority=8]"
        distinguishing_aspect: "dealer_code uniqueness is enforced across all dealers; second create with the same code fails with ERR_DUPLICATE_DEALER_CODE 409."
        test_recipe:
          setup: ["one dealer DL-DUP exists"]
          setup_api_calls:
            - { call: "POST /network/dealers", payload: { name: "Dealer Dup", dealer_code: "DL-DUP", region: "West", credit_limit_cents: 100000, min_stock_value_cents: 0 }, as: OemNetworkAdmin }
          trigger:
            - { call: "POST /network/dealers", payload: { name: "Dealer Dup Two", dealer_code: "DL-DUP", region: "East", credit_limit_cents: 200000, min_stock_value_cents: 0 }, as: OemNetworkAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DUPLICATE_DEALER_CODE"
            - "HTTP status == 409"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: claim_pay_from_rejected_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.WarrantyClaim.SUBMITTED_to_REJECTED"
          - "errors[ERR_CLAIM_INVALID_STATE]"
        distinguishing_aspect: "A REJECTED (terminal) claim rejects pay with ERR_CLAIM_INVALID_STATE and no side effects fire."
        test_recipe:
          setup:
            - "Dealer DL-SM1 ACTIVE; claim parts 3000 labor 0 REJECTED"
          setup_api_calls:
            - { call: "POST /network/dealers", payload: { name: "Dealer SM1", dealer_code: "DL-SM1", region: "West", credit_limit_cents: 500000, min_stock_value_cents: 0 }, as: OemNetworkAdmin, captures: { d: $.data.id, d_v: $.data.version } }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-SM1", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c1: $.data.id } }
            - { call: "POST /network/certifications/${c1}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-SM2", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c2: $.data.id } }
            - { call: "POST /network/certifications/${c2}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/dealer-agreements", payload: { dealer_id: "${d}", agreement_code: "AGR-SM1", effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: OemNetworkAdmin, captures: { a: $.data.id } }
            - { call: "POST /network/dealer-agreements/${a}/activate", payload: { expected_dealer_version: "${d_v}" }, as: OemNetworkAdmin }
            - { call: "POST /network/warranty-claims", payload: { dealer_id: "${d}", unit_serial: "SM-1", parts_cost_cents: 3000, labor_hours: 0, failure_description: "hose" }, as: DealerUser, as_user_id: "${d}", captures: { cl: $.data.id } }
            - { call: "POST /network/warranty-claims/${cl}/decide", payload: { decision: "REJECT" }, as: OemAuditor }
          trigger:
            - { call: "POST /network/warranty-claims/${cl}/pay", payload: {}, as: OemAuditor, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CLAIM_INVALID_STATE"
            - "WarrantyClaim.${cl}.status == REJECTED (unchanged)"
            - "WarrantyClaim.${cl}.paid_amount_cents == null (no side effects)"

      - name: target_double_close_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.SalesTarget"
          - "errors[ERR_TARGET_NOT_OPEN]"
        distinguishing_aspect: "Closing an already-CLOSED target fails with ERR_TARGET_NOT_OPEN; idempotency is NOT allowed for close."
        test_recipe:
          setup:
            - "Dealer DL-SM2 ACTIVE; target Q3 2026 units 1; one accepted sale; clock past quarter end; target already closed once"
          setup_api_calls:
            - { call: "POST /network/dealers", payload: { name: "Dealer SM2", dealer_code: "DL-SM2", region: "West", credit_limit_cents: 500000, min_stock_value_cents: 0 }, as: OemNetworkAdmin, captures: { d: $.data.id, d_v: $.data.version } }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-SM3", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c1: $.data.id } }
            - { call: "POST /network/certifications/${c1}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-SM4", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c2: $.data.id } }
            - { call: "POST /network/certifications/${c2}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/dealer-agreements", payload: { dealer_id: "${d}", agreement_code: "AGR-SM2", effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: OemNetworkAdmin, captures: { a: $.data.id } }
            - { call: "POST /network/dealer-agreements/${a}/activate", payload: { expected_dealer_version: "${d_v}" }, as: OemNetworkAdmin }
            - { call: "POST /network/sales-targets", payload: { dealer_id: "${d}", period_year: 2026, period_quarter: 3, target_units: 1 }, as: OemSalesOps, captures: { t: $.data.id } }
            - { call: "POST /network/unit-sales", payload: { dealer_id: "${d}", unit_serial: "SM-2", sale_date: "2026-08-05", list_price_cents: 10000 }, as: DealerUser, as_user_id: "${d}", captures: { s: $.data.id } }
            - { call: "POST /network/unit-sales/${s}/decide", payload: { decision: "ACCEPT" }, as: OemSalesOps }
            - { call: "POST /network/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: OemNetworkAdmin }
            - { call: "POST /network/sales-targets/${t}/close", payload: {}, as: OemSalesOps }
          trigger:
            - { call: "POST /network/sales-targets/${t}/close", payload: {}, as: OemSalesOps, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_TARGET_NOT_OPEN"
            - "SalesTarget.${t}.status == CLOSED_MET (unchanged from first close)"

      - name: target_close_below_target_is_missed
        claim_type: valid_transition
        grounds:
          - "state_machines.SalesTarget.OPEN_to_CLOSED_MISSED"
          - "calculations.tier_discount"
        distinguishing_aspect: "achieved_units 1 < target 2 closes as CLOSED_MISSED with final rate BRONZE 0.02 (ratio 0.5 below SILVER threshold) - the failing side of the boundary."
        test_recipe:
          setup:
            - "Dealer DL-SM3 ACTIVE; target Q3 2026 units 2; exactly one accepted sale; clock past quarter end"
          setup_api_calls:
            - { call: "POST /network/dealers", payload: { name: "Dealer SM3", dealer_code: "DL-SM3", region: "West", credit_limit_cents: 500000, min_stock_value_cents: 0 }, as: OemNetworkAdmin, captures: { d: $.data.id, d_v: $.data.version } }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-SM5", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c1: $.data.id } }
            - { call: "POST /network/certifications/${c1}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-SM6", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c2: $.data.id } }
            - { call: "POST /network/certifications/${c2}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/dealer-agreements", payload: { dealer_id: "${d}", agreement_code: "AGR-SM3", effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: OemNetworkAdmin, captures: { a: $.data.id } }
            - { call: "POST /network/dealer-agreements/${a}/activate", payload: { expected_dealer_version: "${d_v}" }, as: OemNetworkAdmin }
            - { call: "POST /network/sales-targets", payload: { dealer_id: "${d}", period_year: 2026, period_quarter: 3, target_units: 2 }, as: OemSalesOps, captures: { t: $.data.id } }
            - { call: "POST /network/unit-sales", payload: { dealer_id: "${d}", unit_serial: "SM-3", sale_date: "2026-08-05", list_price_cents: 10000 }, as: DealerUser, as_user_id: "${d}", captures: { s: $.data.id } }
            - { call: "POST /network/unit-sales/${s}/decide", payload: { decision: "ACCEPT" }, as: OemSalesOps }
            - { call: "POST /network/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: OemNetworkAdmin }
          trigger:
            - { call: "POST /network/sales-targets/${t}/close", payload: {}, as: OemSalesOps, captures: { st: $.data.status } }
          assert:
            - "SalesTarget.${t}.status == CLOSED_MISSED (1 < 2)"
            - "SalesTarget.${t}.final_discount_rate == 0.02 (BRONZE)"

      - name: sale_decide_on_accepted_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.UnitSale"
          - "errors[ERR_SALE_NOT_REPORTED]"
        distinguishing_aspect: "decide is only valid from REPORTED; deciding an ACCEPTED sale fails with ERR_SALE_NOT_REPORTED."
        test_recipe:
          setup:
            - "Dealer DL-SM4 ACTIVE; target Q3 2026 units 5; sale SM-4 already ACCEPTED"
          setup_api_calls:
            - { call: "POST /network/dealers", payload: { name: "Dealer SM4", dealer_code: "DL-SM4", region: "West", credit_limit_cents: 500000, min_stock_value_cents: 0 }, as: OemNetworkAdmin, captures: { d: $.data.id, d_v: $.data.version } }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-SM7", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c1: $.data.id } }
            - { call: "POST /network/certifications/${c1}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-SM8", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c2: $.data.id } }
            - { call: "POST /network/certifications/${c2}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/dealer-agreements", payload: { dealer_id: "${d}", agreement_code: "AGR-SM4", effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: OemNetworkAdmin, captures: { a: $.data.id } }
            - { call: "POST /network/dealer-agreements/${a}/activate", payload: { expected_dealer_version: "${d_v}" }, as: OemNetworkAdmin }
            - { call: "POST /network/sales-targets", payload: { dealer_id: "${d}", period_year: 2026, period_quarter: 3, target_units: 5 }, as: OemSalesOps }
            - { call: "POST /network/unit-sales", payload: { dealer_id: "${d}", unit_serial: "SM-4", sale_date: "2026-08-05", list_price_cents: 10000 }, as: DealerUser, as_user_id: "${d}", captures: { s: $.data.id } }
            - { call: "POST /network/unit-sales/${s}/decide", payload: { decision: "ACCEPT" }, as: OemSalesOps }
          trigger:
            - { call: "POST /network/unit-sales/${s}/decide", payload: { decision: "REJECT" }, as: OemSalesOps, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SALE_NOT_REPORTED"
            - "UnitSale.${s}.status == ACCEPTED (unchanged)"

      - name: lead_route_from_accepted_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.Lead"
          - "errors[ERR_LEAD_INVALID_STATE]"
        distinguishing_aspect: "An ACCEPTED (terminal) lead cannot be re-routed: route fails with ERR_LEAD_INVALID_STATE."
        test_recipe:
          setup:
            - "Dealer DL-SM5 ACTIVE with EXCLUSIVE assignment on T-SM; lead routed and ACCEPTED"
          setup_api_calls:
            - { call: "POST /network/dealers", payload: { name: "Dealer SM5", dealer_code: "DL-SM5", region: "West", credit_limit_cents: 500000, min_stock_value_cents: 0 }, as: OemNetworkAdmin, captures: { d: $.data.id, d_v: $.data.version } }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-SM9", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c1: $.data.id } }
            - { call: "POST /network/certifications/${c1}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-SM10", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c2: $.data.id } }
            - { call: "POST /network/certifications/${c2}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/dealer-agreements", payload: { dealer_id: "${d}", agreement_code: "AGR-SM5", effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: OemNetworkAdmin, captures: { a: $.data.id } }
            - { call: "POST /network/dealer-agreements/${a}/activate", payload: { expected_dealer_version: "${d_v}" }, as: OemNetworkAdmin }
            - { call: "POST /network/territory-assignments", payload: { dealer_id: "${d}", agreement_id: "${a}", territory_code: "T-SM", coverage_type: "EXCLUSIVE", starts_on: "2026-01-01", ends_on: "2026-12-31" }, as: OemNetworkAdmin }
            - { call: "POST /network/leads", payload: { territory_code: "T-SM", product_line: "DOZER", estimated_value_cents: 100000, contact_name: "Jo" }, as: OemSalesOps, captures: { lead: $.data.id } }
            - { call: "POST /network/leads/${lead}/route", payload: {}, as: OemSalesOps }
            - { call: "POST /network/leads/${lead}/respond", payload: { response: "ACCEPT" }, as: DealerUser, as_user_id: "${d}" }
          trigger:
            - { call: "POST /network/leads/${lead}/route", payload: {}, as: OemSalesOps, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_LEAD_INVALID_STATE"
            - "Lead.${lead}.status == ACCEPTED (unchanged)"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: warranty_claim_amount_uses_gold_tier_labor_rate
        claim_type: correct_result
        grounds:
          - "calculations.warranty_claim_amount"
          - "calculations.tier_discount"
        distinguishing_aspect: "Claim amount depends on Dealer.tier at submission: after closing a quarter at ratio 6/5 = 1.2 (>= GOLD boundary) the dealer is GOLD, so parts 5000 + 2.0h * 12000 = 29000 (BRONZE would give 22000)."
        test_recipe:
          setup:
            - "Dealer DL-CC1 ACTIVE; target Q3 2026 units 5; six accepted sales (ratio 1.2 -> GOLD at close); clock past quarter end; target closed"
          setup_api_calls:
            - { call: "POST /network/dealers", payload: { name: "Dealer CC1", dealer_code: "DL-CC1", region: "West", credit_limit_cents: 500000, min_stock_value_cents: 0 }, as: OemNetworkAdmin, captures: { d: $.data.id, d_v: $.data.version } }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-CC1", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c1: $.data.id } }
            - { call: "POST /network/certifications/${c1}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-CC2", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c2: $.data.id } }
            - { call: "POST /network/certifications/${c2}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/dealer-agreements", payload: { dealer_id: "${d}", agreement_code: "AGR-CC1", effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: OemNetworkAdmin, captures: { a: $.data.id } }
            - { call: "POST /network/dealer-agreements/${a}/activate", payload: { expected_dealer_version: "${d_v}" }, as: OemNetworkAdmin }
            - { call: "POST /network/sales-targets", payload: { dealer_id: "${d}", period_year: 2026, period_quarter: 3, target_units: 5 }, as: OemSalesOps, captures: { t: $.data.id } }
            - { call: "POST /network/unit-sales", payload: { dealer_id: "${d}", unit_serial: "CC-1", sale_date: "2026-08-01", list_price_cents: 1000 }, as: DealerUser, as_user_id: "${d}", captures: { s1: $.data.id } }
            - { call: "POST /network/unit-sales/${s1}/decide", payload: { decision: "ACCEPT" }, as: OemSalesOps }
            - { call: "POST /network/unit-sales", payload: { dealer_id: "${d}", unit_serial: "CC-2", sale_date: "2026-08-02", list_price_cents: 1000 }, as: DealerUser, as_user_id: "${d}", captures: { s2: $.data.id } }
            - { call: "POST /network/unit-sales/${s2}/decide", payload: { decision: "ACCEPT" }, as: OemSalesOps }
            - { call: "POST /network/unit-sales", payload: { dealer_id: "${d}", unit_serial: "CC-3", sale_date: "2026-08-03", list_price_cents: 1000 }, as: DealerUser, as_user_id: "${d}", captures: { s3: $.data.id } }
            - { call: "POST /network/unit-sales/${s3}/decide", payload: { decision: "ACCEPT" }, as: OemSalesOps }
            - { call: "POST /network/unit-sales", payload: { dealer_id: "${d}", unit_serial: "CC-4", sale_date: "2026-08-04", list_price_cents: 1000 }, as: DealerUser, as_user_id: "${d}", captures: { s4: $.data.id } }
            - { call: "POST /network/unit-sales/${s4}/decide", payload: { decision: "ACCEPT" }, as: OemSalesOps }
            - { call: "POST /network/unit-sales", payload: { dealer_id: "${d}", unit_serial: "CC-5", sale_date: "2026-08-05", list_price_cents: 1000 }, as: DealerUser, as_user_id: "${d}", captures: { s5: $.data.id } }
            - { call: "POST /network/unit-sales/${s5}/decide", payload: { decision: "ACCEPT" }, as: OemSalesOps }
            - { call: "POST /network/unit-sales", payload: { dealer_id: "${d}", unit_serial: "CC-6", sale_date: "2026-08-06", list_price_cents: 1000 }, as: DealerUser, as_user_id: "${d}", captures: { s6: $.data.id } }
            - { call: "POST /network/unit-sales/${s6}/decide", payload: { decision: "ACCEPT" }, as: OemSalesOps }
            - { call: "POST /network/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: OemNetworkAdmin }
            - { call: "POST /network/sales-targets/${t}/close", payload: {}, as: OemSalesOps }
          trigger:
            - { call: "POST /network/warranty-claims", payload: { dealer_id: "${d}", unit_serial: "CC-X", parts_cost_cents: 5000, labor_hours: 2.0, failure_description: "pump" }, as: DealerUser, as_user_id: "${d}", captures: { cl: $.data.id } }
          assert:
            - "Dealer.${d}.tier == GOLD (ratio 1.2 >= 1.2 boundary)"
            - "WarrantyClaim.${cl}.claim_amount_cents == 29000 (5000 + 2.0 * 12000 GOLD rate)"

      - name: lead_selector_ranks_by_open_lead_count
        claim_type: correct_result
        grounds:
          - "calculations.lead_routing_selection"
        distinguishing_aspect: "Ranking beats tie-break: D1 is older (wins created_at tie-break) but already has one ROUTED lead, so the second lead routes to D2 on open_lead_count 0 < 1."
        test_recipe:
          setup:
            - "Dealers DL-CC2 (created first) and DL-CC3 ACTIVE, both SHARED on T-150 [2026-01-01, 2026-12-31)"
            - "Lead L1 routed to DL-CC2 (tie-break); lead L2 unrouted"
          setup_api_calls:
            - { call: "POST /network/dealers", payload: { name: "Dealer CC2", dealer_code: "DL-CC2", region: "West", credit_limit_cents: 500000, min_stock_value_cents: 0 }, as: OemNetworkAdmin, captures: { d1: $.data.id, d1_v: $.data.version } }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d1}", cert_code: "CTE-CC3", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d1}", captures: { x1: $.data.id } }
            - { call: "POST /network/certifications/${x1}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d1}", cert_code: "CTE-CC4", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d1}", captures: { x2: $.data.id } }
            - { call: "POST /network/certifications/${x2}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/dealer-agreements", payload: { dealer_id: "${d1}", agreement_code: "AGR-CC2", effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: OemNetworkAdmin, captures: { a1: $.data.id } }
            - { call: "POST /network/dealer-agreements/${a1}/activate", payload: { expected_dealer_version: "${d1_v}" }, as: OemNetworkAdmin }
            - { call: "POST /network/dealers", payload: { name: "Dealer CC3", dealer_code: "DL-CC3", region: "West", credit_limit_cents: 500000, min_stock_value_cents: 0 }, as: OemNetworkAdmin, captures: { d2: $.data.id, d2_v: $.data.version } }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d2}", cert_code: "CTE-CC5", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d2}", captures: { y1: $.data.id } }
            - { call: "POST /network/certifications/${y1}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d2}", cert_code: "CTE-CC6", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d2}", captures: { y2: $.data.id } }
            - { call: "POST /network/certifications/${y2}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/dealer-agreements", payload: { dealer_id: "${d2}", agreement_code: "AGR-CC3", effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: OemNetworkAdmin, captures: { a2: $.data.id } }
            - { call: "POST /network/dealer-agreements/${a2}/activate", payload: { expected_dealer_version: "${d2_v}" }, as: OemNetworkAdmin }
            - { call: "POST /network/territory-assignments", payload: { dealer_id: "${d1}", agreement_id: "${a1}", territory_code: "T-150", coverage_type: "SHARED", starts_on: "2026-01-01", ends_on: "2026-12-31" }, as: OemNetworkAdmin }
            - { call: "POST /network/territory-assignments", payload: { dealer_id: "${d2}", agreement_id: "${a2}", territory_code: "T-150", coverage_type: "SHARED", starts_on: "2026-01-01", ends_on: "2026-12-31" }, as: OemNetworkAdmin }
            - { call: "POST /network/leads", payload: { territory_code: "T-150", product_line: "LOADER", estimated_value_cents: 100000, contact_name: "One" }, as: OemSalesOps, captures: { l1: $.data.id } }
            - { call: "POST /network/leads/${l1}/route", payload: {}, as: OemSalesOps, captures: { l1_dealer: $.data.routed_dealer_id } }
            - { call: "POST /network/leads", payload: { territory_code: "T-150", product_line: "LOADER", estimated_value_cents: 200000, contact_name: "Two" }, as: OemSalesOps, captures: { l2: $.data.id } }
          trigger:
            - { call: "POST /network/leads/${l2}/route", payload: {}, as: OemSalesOps, captures: { l2_dealer: $.data.routed_dealer_id } }
          assert:
            - "Lead.${l1}.routed_dealer_id == ${d1} (tie 0==0 -> created_at ASC)"
            - "Lead.${l2}.routed_dealer_id == ${d2} (open_lead_count 0 < 1 outranks seniority)"

      - name: parts_allowance_exact_equality_and_overflow
        claim_type: boundary_edge
        grounds:
          - "calculations.parts_return_allowance"
          - "errors[ERR_ALLOWANCE_EXCEEDED]"
        distinguishing_aspect: "Allowance comparison is <= : a return whose credit exactly equals the 5% allowance (500 of 500) is accepted; a further 1-cent-over return is rejected with ERR_ALLOWANCE_EXCEEDED."
        test_recipe:
          setup:
            - "Clock set to 2026-03-01 (before June 30 -> restock 0)"
            - "Dealer DL-CC4 ACTIVE, stock compliant; purchases 10000 in 2026 -> allowance 500"
            - "Return R1 lines [{P1, 1, 500}] -> credit exactly 500; submitted and CREDITED"
            - "Return R2 lines [{P2, 1, 100}] drafted"
          setup_api_calls:
            - { call: "POST /network/_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: OemNetworkAdmin }
            - { call: "POST /network/dealers", payload: { name: "Dealer CC4", dealer_code: "DL-CC4", region: "West", credit_limit_cents: 500000, min_stock_value_cents: 1000 }, as: OemNetworkAdmin, captures: { d: $.data.id, d_v: $.data.version } }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-CC7", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c1: $.data.id } }
            - { call: "POST /network/certifications/${c1}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-CC8", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c2: $.data.id } }
            - { call: "POST /network/certifications/${c2}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/dealer-agreements", payload: { dealer_id: "${d}", agreement_code: "AGR-CC4", effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: OemNetworkAdmin, captures: { a: $.data.id } }
            - { call: "POST /network/dealer-agreements/${a}/activate", payload: { expected_dealer_version: "${d_v}" }, as: OemNetworkAdmin }
            - { call: "POST /network/dealers/${d}/stock-audit", payload: { observed_stock_value_cents: 1500 }, as: OemAuditor }
            - { call: "POST /network/dealers/${d}/parts-purchases", payload: { amount_cents: 10000 }, as: OemNetworkAdmin }
            - { call: "POST /network/parts-returns", payload: { dealer_id: "${d}", return_year: 2026, lines: [ { part_number: "P1", quantity: 1, unit_credit_cents: 500 } ] }, as: DealerUser, as_user_id: "${d}", captures: { r1: $.data.id } }
            - { call: "POST /network/parts-returns/${r1}/submit", payload: {}, as: DealerUser, as_user_id: "${d}" }
            - { call: "POST /network/parts-returns/${r1}/decide", payload: { decision: "CREDIT" }, as: OemSalesOps }
            - { call: "POST /network/parts-returns", payload: { dealer_id: "${d}", return_year: 2026, lines: [ { part_number: "P2", quantity: 1, unit_credit_cents: 100 } ] }, as: DealerUser, as_user_id: "${d}", captures: { r2: $.data.id } }
          trigger:
            - { call: "POST /network/parts-returns/${r2}/submit", payload: {}, as: DealerUser, as_user_id: "${d}", captures: { err: $.data.error_id } }
          assert:
            - "PartsReturn.${r1}.status == CREDITED (credit 500 == allowance 500 accepted; boundary is inclusive)"
            - "PartsReturn.${r1}.credit_cents == 500 and restock_pct_applied == 0"
            - "second submit: error_id == ERR_ALLOWANCE_EXCEEDED (500 + 100 > 500)"
            - "HTTP status == 402"

      - name: scorecard_empty_claims_service_score_is_100
        claim_type: correct_result
        grounds:
          - "calculations.dealer_performance_score"
        distinguishing_aspect: "Empty-set guard: with no settled claims the service denominator is 0 and service_score defaults to 100 (not a divide-by-zero); total = 0.4*0 + 0.25*100 + 0.2*0 + 0.15*0 = 25.00."
        test_recipe:
          setup:
            - "Dealer DL-CC5 exists; no targets, no claims, no certs, no stock audit"
          setup_api_calls:
            - { call: "POST /network/dealers", payload: { name: "Dealer CC5", dealer_code: "DL-CC5", region: "West", credit_limit_cents: 100000, min_stock_value_cents: 1000 }, as: OemNetworkAdmin, captures: { d: $.data.id } }
          trigger:
            - { call: "GET /network/dealers/${d}/scorecard", payload: { period_year: 2026, period_quarter: 1, variant: "STRICT" }, as: Any }
          assert:
            - "service_score == 100 (empty denominator default)"
            - "sales_score == 0 (no target for period)"
            - "training_score == 0 (0 ACTIVE certs)"
            - "parts_score == 0 (stock_compliant false)"
            - "total_score == 25.0"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: dealer_create_missing_auth_header_returns_400
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"
        distinguishing_aspect: "Priority 1: a request without X-User-ID/X-User-Role headers fails with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER 400 before any role or existence check runs (test harness omits the headers for this call)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /network/dealers", payload: { name: "NoAuth", dealer_code: "DL-NA", region: "West", credit_limit_cents: 100000, min_stock_value_cents: 0 }, as: OemNetworkAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (headers stripped by harness for this call)"
            - "HTTP status == 400"

      - name: priority_existence_beats_state_on_unknown_claim
        claim_type: priority_ordering
        grounds:
          - "validations[priority=4]"
          - "validations[priority=6]"
          - "errors[ERR_CLAIM_NOT_FOUND]"
        distinguishing_aspect: "A decide call on a non-existent claim id violates existence (p4) and would violate any state rule (p6); the 404 ERR_CLAIM_NOT_FOUND must win."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /network/warranty-claims/00000000-0000-0000-0000-000000000000/decide", payload: { decision: "APPROVE" }, as: OemAuditor, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CLAIM_NOT_FOUND"
            - "HTTP status == 404"

      - name: dealer_user_cannot_report_sale_for_other_dealer
        claim_type: violation_to_error
        grounds:
          - "validations[priority=5]"
          - "errors[ERR_DEALER_IDENTITY_MISMATCH]"
          - "roles[DealerUser]"
        distinguishing_aspect: "DealerUser identity is entity-backed: body dealer_id different from X-User-ID yields ERR_DEALER_IDENTITY_MISMATCH 403."
        test_recipe:
          setup:
            - "Two dealers DL-ID1 (actor) and DL-ID2 (victim) exist"
          setup_api_calls:
            - { call: "POST /network/dealers", payload: { name: "Dealer ID1", dealer_code: "DL-ID1", region: "West", credit_limit_cents: 100000, min_stock_value_cents: 0 }, as: OemNetworkAdmin, captures: { d1: $.data.id } }
            - { call: "POST /network/dealers", payload: { name: "Dealer ID2", dealer_code: "DL-ID2", region: "East", credit_limit_cents: 100000, min_stock_value_cents: 0 }, as: OemNetworkAdmin, captures: { d2: $.data.id } }
          trigger:
            - { call: "POST /network/unit-sales", payload: { dealer_id: "${d2}", unit_serial: "ID-1", sale_date: "2026-08-05", list_price_cents: 10000 }, as: DealerUser, as_user_id: "${d1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DEALER_IDENTITY_MISMATCH"
            - "HTTP status == 403"

      - name: stocking_noncompliant_blocks_return_submit
        claim_type: violation_to_error
        grounds:
          - "validations[priority=8]"
          - "errors[ERR_STOCKING_NONCOMPLIANT]"
          - "entities.Dealer.fields.stock_compliant"
        distinguishing_aspect: "Parts-stocking requirement gates returns: without a passing stock audit (stock_compliant false) submit fails with ERR_STOCKING_NONCOMPLIANT even when the allowance would suffice."
        test_recipe:
          setup:
            - "Dealer DL-ST1 ACTIVE with purchases 10000 (allowance 500) but NO stock audit (non-compliant by default)"
            - "Return drafted with credit 100"
          setup_api_calls:
            - { call: "POST /network/dealers", payload: { name: "Dealer ST1", dealer_code: "DL-ST1", region: "West", credit_limit_cents: 500000, min_stock_value_cents: 1000 }, as: OemNetworkAdmin, captures: { d: $.data.id, d_v: $.data.version } }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-ST1", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c1: $.data.id } }
            - { call: "POST /network/certifications/${c1}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-ST2", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c2: $.data.id } }
            - { call: "POST /network/certifications/${c2}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/dealer-agreements", payload: { dealer_id: "${d}", agreement_code: "AGR-ST1", effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: OemNetworkAdmin, captures: { a: $.data.id } }
            - { call: "POST /network/dealer-agreements/${a}/activate", payload: { expected_dealer_version: "${d_v}" }, as: OemNetworkAdmin }
            - { call: "POST /network/dealers/${d}/parts-purchases", payload: { amount_cents: 10000 }, as: OemNetworkAdmin }
            - { call: "POST /network/parts-returns", payload: { dealer_id: "${d}", return_year: 2026, lines: [ { part_number: "P1", quantity: 1, unit_credit_cents: 100 } ] }, as: DealerUser, as_user_id: "${d}", captures: { r: $.data.id } }
          trigger:
            - { call: "POST /network/parts-returns/${r}/submit", payload: {}, as: DealerUser, as_user_id: "${d}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_STOCKING_NONCOMPLIANT"
            - "PartsReturn.${r}.status == DRAFT (unchanged)"

      - name: duplicate_target_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_DUPLICATE_TARGET]"
          - "entities.SalesTarget.fields.period_quarter"
        distinguishing_aspect: "One target per (dealer, year, quarter); a second Q3-2026 target for the same dealer fails with ERR_DUPLICATE_TARGET 409."
        test_recipe:
          setup: ["Dealer DL-DT1 exists with a Q3 2026 target"]
          setup_api_calls:
            - { call: "POST /network/dealers", payload: { name: "Dealer DT1", dealer_code: "DL-DT1", region: "West", credit_limit_cents: 100000, min_stock_value_cents: 0 }, as: OemNetworkAdmin, captures: { d: $.data.id } }
            - { call: "POST /network/sales-targets", payload: { dealer_id: "${d}", period_year: 2026, period_quarter: 3, target_units: 5 }, as: OemSalesOps }
          trigger:
            - { call: "POST /network/sales-targets", payload: { dealer_id: "${d}", period_year: 2026, period_quarter: 3, target_units: 9 }, as: OemSalesOps, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DUPLICATE_TARGET"

      - name: duplicate_advance_serial_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_DUPLICATE_ADVANCE_SERIAL]"
          - "entities.FloorPlanAdvance.fields.unit_serial"
        distinguishing_aspect: "A second non-terminal advance on the same (dealer, unit_serial) fails with ERR_DUPLICATE_ADVANCE_SERIAL."
        test_recipe:
          setup: ["Dealer DL-DA1 ACTIVE with an OPEN advance on serial DA-1"]
          setup_api_calls:
            - { call: "POST /network/dealers", payload: { name: "Dealer DA1", dealer_code: "DL-DA1", region: "West", credit_limit_cents: 500000, min_stock_value_cents: 0 }, as: OemNetworkAdmin, captures: { d: $.data.id, d_v: $.data.version } }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-DA1", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c1: $.data.id } }
            - { call: "POST /network/certifications/${c1}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-DA2", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c2: $.data.id } }
            - { call: "POST /network/certifications/${c2}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/dealer-agreements", payload: { dealer_id: "${d}", agreement_code: "AGR-DA1", effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: OemNetworkAdmin, captures: { a: $.data.id } }
            - { call: "POST /network/dealer-agreements/${a}/activate", payload: { expected_dealer_version: "${d_v}" }, as: OemNetworkAdmin }
            - { call: "POST /network/floorplan-advances", payload: { dealer_id: "${d}", unit_serial: "DA-1", advance_cents: 10000 }, as: OemNetworkAdmin }
          trigger:
            - { call: "POST /network/floorplan-advances", payload: { dealer_id: "${d}", unit_serial: "DA-1", advance_cents: 5000 }, as: OemNetworkAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DUPLICATE_ADVANCE_SERIAL"

      - name: advance_over_available_credit_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_CREDIT_LIMIT_EXCEEDED]"
          - "entities.Dealer.fields.floorplan_available_cents"
        distinguishing_aspect: "Pure fiscal check on an ACTIVE dealer: advance 150000 > available 100000 yields ERR_CREDIT_LIMIT_EXCEEDED 402 (no competing violation)."
        test_recipe:
          setup: ["Dealer DL-FI1 ACTIVE, credit_limit 100000, utilization 0"]
          setup_api_calls:
            - { call: "POST /network/dealers", payload: { name: "Dealer FI1", dealer_code: "DL-FI1", region: "West", credit_limit_cents: 100000, min_stock_value_cents: 0 }, as: OemNetworkAdmin, captures: { d: $.data.id, d_v: $.data.version } }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-FI1", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c1: $.data.id } }
            - { call: "POST /network/certifications/${c1}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-FI2", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c2: $.data.id } }
            - { call: "POST /network/certifications/${c2}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/dealer-agreements", payload: { dealer_id: "${d}", agreement_code: "AGR-FI1", effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: OemNetworkAdmin, captures: { a: $.data.id } }
            - { call: "POST /network/dealer-agreements/${a}/activate", payload: { expected_dealer_version: "${d_v}" }, as: OemNetworkAdmin }
          trigger:
            - { call: "POST /network/floorplan-advances", payload: { dealer_id: "${d}", unit_serial: "FI-1", advance_cents: 150000 }, as: OemNetworkAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CREDIT_LIMIT_EXCEEDED"
            - "HTTP status == 402"

      - name: payment_exceeds_remaining_principal_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_PAYMENT_EXCEEDS_BALANCE]"
          - "state_machines.FloorPlanAdvance.OPEN_to_CURTAILED"
        distinguishing_aspect: "Payment of 60000 against remaining 50000 fails with ERR_PAYMENT_EXCEEDS_BALANCE 422; a payment of exactly 50000 succeeds and pays off."
        test_recipe:
          setup: ["Dealer DL-PM1 ACTIVE with OPEN advance of 50000 on serial PM-1"]
          setup_api_calls:
            - { call: "POST /network/dealers", payload: { name: "Dealer PM1", dealer_code: "DL-PM1", region: "West", credit_limit_cents: 100000, min_stock_value_cents: 0 }, as: OemNetworkAdmin, captures: { d: $.data.id, d_v: $.data.version } }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-PM1", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c1: $.data.id } }
            - { call: "POST /network/certifications/${c1}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/certifications", payload: { dealer_id: "${d}", cert_code: "CTE-PM2", earned_on: "2026-01-10", expires_on: "2028-01-10" }, as: DealerUser, as_user_id: "${d}", captures: { c2: $.data.id } }
            - { call: "POST /network/certifications/${c2}/decide", payload: { decision: "VERIFY" }, as: OemAuditor }
            - { call: "POST /network/dealer-agreements", payload: { dealer_id: "${d}", agreement_code: "AGR-PM1", effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: OemNetworkAdmin, captures: { a: $.data.id } }
            - { call: "POST /network/dealer-agreements/${a}/activate", payload: { expected_dealer_version: "${d_v}" }, as: OemNetworkAdmin }
            - { call: "POST /network/floorplan-advances", payload: { dealer_id: "${d}", unit_serial: "PM-1", advance_cents: 50000 }, as: OemNetworkAdmin, captures: { adv: $.data.id } }
          trigger:
            - { call: "POST /network/floorplan-advances/${adv}/payment", payload: { amount_cents: 60000 }, as: OemNetworkAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /network/floorplan-advances/${adv}/payment", payload: { amount_cents: 50000 }, as: OemNetworkAdmin }
          assert:
            - "first payment: error_id == ERR_PAYMENT_EXCEEDS_BALANCE (60000 > 50000)"
            - "second payment (exact remaining) succeeds: FloorPlanAdvance.${adv}.status == PAID_OFF"
            - "Dealer.${d}.floorplan_utilization_cents == 0"

      - name: audit_window_closed_after_365_days
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_AUDIT_WINDOW_CLOSED]"
          - "validations[priority=9]"
          - "state_machines.WarrantyClaim.PAID_to_AUDIT_FLAGGED"
        distinguishing_aspect: "Temporal rule: claim paid at 2026-08-01 can be flagged until 2027-08-01; at clock 2027-08-02 flag-audit fails with ERR_AUDIT_WINDOW_CLOSED."
        test_recipe:
          setup: ["Dealer DL-AW1 ACTIVE; claim parts 10000 PAID at default clock 2026-08-01; clock moved to 2027-08-02 (paid_at + 366 days)"]
          setup_api_calls:
            - { call: "POST /network/dealers", payload: { name: "Dealer AW1", dealer_code: "DL-AW1", region: "West", credit_limit_cents: 500000, min_stock_value_cents: 0 }, as: OemNetworkAdmin, captures: { d: $.data.id, d_v: $.data.version } }
