        grounds: ["complexity_profile.consistency_model", "state_machines.Alert.NOTIFYING_to_ACKNOWLEDGED"]
        distinguishing_aspect: "Immediate consistency: the acknowledge response body itself shows ACKNOWLEDGED, and a subsequent GET reflects the same state plus the notification flip to ACKED with no delay."
        test_recipe:
          setup: ["ACTIVE senior with caregiver+contact; MANUAL MEDIUM alert NOTIFYING"]
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: "PLUS", monthly_fee_cents: 6000, included_motion_sensors: 2, extra_sensor_fee_cents: 199, max_contacts: 5, checkin_interval_hours: 48, medication_reminders_enabled: true, wellness_report_enabled: true, wellness_report_cadence: "MONTHLY" }, as: PlatformAdmin, captures: { plan_ic: $.data.id } }
            - { call: "POST /v1/seniors", payload: { full_name: "Ic Senior", date_of_birth: "1940-01-01", address: "1 Ic St" }, as: PlatformAdmin, captures: { s_ic: $.data.id } }
            - { call: "POST /v1/subscriptions", payload: { senior_id: "${s_ic}", plan_id: "${plan_ic}" }, as: PlatformAdmin, captures: { sub_ic: $.data.id } }
            - { call: "POST /v1/sensor-kits", payload: { senior_id: "${s_ic}" }, as: PlatformAdmin, captures: { kit_ic: $.data.id } }
            - { call: "POST /v1/sensor-kits/${kit_ic}/ship", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/sensor-kits/${kit_ic}/mark-delivered", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/installers", payload: { full_name: "Inst IC", region: "R1" }, as: PlatformAdmin, captures: { inst_ic: $.data.id } }
            - { call: "POST /v1/install-appointments", payload: { senior_id: "${s_ic}", kit_id: "${kit_ic}", installer_id: "${inst_ic}", window_start: "2026-05-01T09:00:00Z", window_end: "2026-05-01T10:00:00Z" }, as: PlatformAdmin, captures: { appt_ic: $.data.id } }
            - { call: "POST /v1/install-appointments/${appt_ic}/confirm", payload: {}, as: Installer, as_user_id: "${inst_ic}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:30:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/install-appointments/${appt_ic}/complete", payload: {}, as: Installer, as_user_id: "${inst_ic}" }
            - { call: "POST /v1/subscriptions/${sub_ic}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/caregivers", payload: { senior_id: "${s_ic}", full_name: "Cg Ic", phone: "555-61" }, as: PlatformAdmin, captures: { cg_ic: $.data.id } }
            - { call: "POST /v1/contact-tree-entries", payload: { senior_id: "${s_ic}", caregiver_id: "${cg_ic}", priority_rank: 1, min_severity: "LOW", response_timeout_seconds: 7200 }, as: PlatformAdmin }
            - { call: "POST /v1/alerts", payload: { senior_id: "${s_ic}", severity: "MEDIUM" }, as: MonitoringAgent, captures: { alert_ic: $.data.id } }
          trigger:
            - { call: "POST /v1/alerts/${alert_ic}/acknowledge", payload: {}, as: Caregiver, as_user_id: "${cg_ic}", captures: { ic_st: $.data.status, ic_ack: $.data.acknowledged_by_caregiver_id } }
            - { call: "GET /v1/alerts/${alert_ic}", payload: {}, as: PlatformAdmin }
            - { call: "GET /v1/alert-notifications", payload: { alert_id: "${alert_ic}" }, as: PlatformAdmin }
          assert:
            - "ic_st == 'ACKNOWLEDGED' and ic_ack == '${cg_ic}' in the mutation response itself"
            - "GET shows status ACKNOWLEDGED; the notification list shows the single notification as ACKED"
