# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3328_same_day_catalog_fulfillment_deep_inventory_breadth
#
# One block per §0.5 Difficulty Rule; each rule carries its §0.5 minimum of
# ≥ 2 instances. Every grounds: reference resolves into SCAFFOLD.yaml §1.1–§1.7.
# Every test_recipe drives empty-DB -> precondition using only §1.5 endpoints.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: order_total_variant_divergence_after_cutoff
        grounds:
          - calculations.order_total_two_variant
          - calculations.small_line_fee_total_and_allocate
          - calculations.order_total_cents_factor_first
          - state_machines.CatalogOrder.RELEASED_ALLOCATED_to_RELEASED_PICKED
          - state_machines.CatalogOrder.PICKED_PICKED_to_PICKED_SHIPPED
          - entities.CatalogOrder.fields.order_total_cents
        distinguishing_aspect: "On the CatalogOrder money domain the two variants differ by exactly 1588 cents for identical lines: fee_own_precision yields order_total_cents 72000 while fee_tiered yields 73588, so the order total must move 72000 -> 73588 when Shipment.shipment_status becomes CUTOFF_CONFIRMED."
        test_recipe:
          setup:
            - "Logical clock 2026-09-14T08:00:00Z (Monday). DC BOS local 04:00 before its 06:00:00 cutoff, DC DAL local 03:00 before its 06:00:00 cutoff, so both have cutoff_passed false."
            - "Account Riverside Machine in region NORTHEAST, delivery_zone America/New_York."
            - "Five curated items priced 36000, 18000, 7000, 6000 and 5000 cents, each with curation_bundle_size 8 and an APPROVED curation review."
            - "One stock row per item at BOS with on_hand_units 20, so every line is fully allocatable."
            - "No shipment has been cut off yet, so CatalogOrder.total_small_line_fee_cents is still the fee_own_precision figure."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /distribution-centers"
              payload: { code: "BOS", region: "NORTHEAST", local_zone: "America/New_York", local_cutoff_time: "06:00:00", utc_offset_minutes: -240, inbound_capacity_units: 500, transit_seconds: 86400 }
              as: PlatformAdmin
              captures: { bos_dc_id: $.data.id }
            - call: "POST /distribution-centers"
              payload: { code: "DAL", region: "SOUTHWEST", local_zone: "America/Chicago", local_cutoff_time: "06:00:00", utc_offset_minutes: -300, inbound_capacity_units: 500, transit_seconds: 43200 }
              as: PlatformAdmin
              captures: { dal_dc_id: $.data.id }
            - call: "POST /accounts"
              payload: { account_name: "Riverside Machine", delivery_zone: "America/New_York", home_region: "NORTHEAST" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /suppliers"
              payload: { supplier_name: "Long Tail Fasteners", home_dc_id: "${bos_dc_id}", primary_attribute_name: "Thread Pitch", primary_attribute_value: "1.25 mm", long_tail_authorized: true, min_stock_commitment_units: 50 }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "SKU-1001", description: "Socket head cap screw M8x40", material_spec: "18-8 stainless steel", long_tail: false, unit_price_cents: 36000, unit_weight_kg: 0.50, curation_bundle_size: 8, curated_dimension_json: { nominal_length_mm: 120, nominal_width_mm: 60, nominal_height_mm: 40, drawing_revision: 3 } }
              as: CatalogCurator
              captures: { item_a_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "SKU-1002", description: "Hex bolt M10x60", material_spec: "316 stainless steel", long_tail: false, unit_price_cents: 18000, unit_weight_kg: 0.80, curation_bundle_size: 5, curated_dimension_json: { nominal_length_mm: 140, nominal_width_mm: 70, nominal_height_mm: 45, drawing_revision: 3 } }
              as: CatalogCurator
              captures: { item_b_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "SKU-1003", description: "Flat washer M8", material_spec: "18-8 stainless steel", long_tail: false, unit_price_cents: 7000, unit_weight_kg: 0.30, curation_bundle_size: 4, curated_dimension_json: { nominal_length_mm: 30, nominal_width_mm: 30, nominal_height_mm: 5, drawing_revision: 3 } }
              as: CatalogCurator
              captures: { item_c_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "SKU-1004", description: "Lock nut M8", material_spec: "18-8 stainless steel", long_tail: false, unit_price_cents: 6000, unit_weight_kg: 0.25, curation_bundle_size: 6, curated_dimension_json: { nominal_length_mm: 25, nominal_width_mm: 25, nominal_height_mm: 12, drawing_revision: 3 } }
              as: CatalogCurator
              captures: { item_d_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "SKU-1005", description: "Spring pin 5x30", material_spec: "spring steel", long_tail: true, unit_price_cents: 5000, unit_weight_kg: 0.40, curation_bundle_size: 7, curated_dimension_json: { nominal_length_mm: 60, nominal_width_mm: 20, nominal_height_mm: 20, drawing_revision: 3 } }
              as: CatalogCurator
              captures: { item_e_id: $.data.id }
            - call: "POST /items/${item_a_id}/attributes"
              payload: { attribute_name: "Thread Pitch", attribute_value: "1.25 mm", unit_of_measure: "mm" }
              as: CatalogCurator
            - call: "POST /items/${item_b_id}/attributes"
              payload: { attribute_name: "Thread Pitch", attribute_value: "1.50 mm", unit_of_measure: "mm" }
              as: CatalogCurator
            - call: "POST /items/${item_c_id}/attributes"
              payload: { attribute_name: "Inner Diameter", attribute_value: "8.40 mm", unit_of_measure: "mm" }
              as: CatalogCurator
            - call: "POST /items/${item_d_id}/attributes"
              payload: { attribute_name: "Thread Pitch", attribute_value: "1.25 mm", unit_of_measure: "mm" }
              as: CatalogCurator
            - call: "POST /items/${item_e_id}/attributes"
              payload: { attribute_name: "Pin Diameter", attribute_value: "5.00 mm", unit_of_measure: "mm" }
              as: CatalogCurator
            - call: "POST /curation-reviews"
              payload: { item_ids: ["${item_a_id}", "${item_b_id}", "${item_c_id}", "${item_d_id}", "${item_e_id}"] }
              as: CatalogCurator
              captures: { rev_id: $.data.id }
            - call: "POST /stock"
              payload: { item_id: "${item_a_id}", dc_id: "${bos_dc_id}", account_id: "${acct_id}", on_hand_units: 20, daily_demand_units: 4, inbound_daily_units: 4 }
              as: DCManager
            - call: "POST /stock"
              payload: { item_id: "${item_b_id}", dc_id: "${bos_dc_id}", account_id: "${acct_id}", on_hand_units: 20, daily_demand_units: 3, inbound_daily_units: 3 }
              as: DCManager
            - call: "POST /stock"
              payload: { item_id: "${item_c_id}", dc_id: "${bos_dc_id}", account_id: "${acct_id}", on_hand_units: 20, daily_demand_units: 2, inbound_daily_units: 2 }
              as: DCManager
            - call: "POST /stock"
              payload: { item_id: "${item_d_id}", dc_id: "${bos_dc_id}", account_id: "${acct_id}", on_hand_units: 20, daily_demand_units: 2, inbound_daily_units: 2 }
              as: DCManager
            - call: "POST /stock"
              payload: { item_id: "${item_e_id}", dc_id: "${bos_dc_id}", account_id: "${acct_id}", on_hand_units: 20, daily_demand_units: 2, inbound_daily_units: 2 }
              as: DCManager
            - call: "POST /orders"
              payload: { account_id: "${acct_id}", lines: [{ item_id: "${item_a_id}", quantity: 3 }, { item_id: "${item_b_id}", quantity: 2 }, { item_id: "${item_c_id}", quantity: 1 }, { item_id: "${item_d_id}", quantity: 1 }, { item_id: "${item_e_id}", quantity: 1 }] }
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/release"
              payload: {}
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { order_v_pre_alloc: $.data.version }
            - call: "POST /orders/${order_id}/allocate"
              payload: { expected_order_version: "${order_v_pre_alloc}" }
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { order_v_pre_pick: $.data.version }
            - call: "GET /orders/${order_id}/lines"
              payload: { limit: 100, offset: 0 }
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { line_a_id: "$.data[0].id", line_b_id: "$.data[1].id", line_c_id: "$.data[2].id", line_d_id: "$.data[3].id", line_e_id: "$.data[4].id" }
            - call: "POST /orders/${order_id}/lines/${line_a_id}/pick"
              payload: { requested_units: 3 }
              as: WarehousePicker
            - call: "POST /orders/${order_id}/lines/${line_a_id}/pick_complete"
              payload: { actual_units: 3 }
              as: WarehousePicker
            - call: "POST /orders/${order_id}/lines/${line_b_id}/pick"
              payload: { requested_units: 2 }
              as: WarehousePicker
            - call: "POST /orders/${order_id}/lines/${line_b_id}/pick_complete"
              payload: { actual_units: 2 }
              as: WarehousePicker
            - call: "POST /orders/${order_id}/lines/${line_c_id}/pick"
              payload: { requested_units: 1 }
              as: WarehousePicker
            - call: "POST /orders/${order_id}/lines/${line_c_id}/pick_complete"
              payload: { actual_units: 1 }
              as: WarehousePicker
            - call: "POST /orders/${order_id}/lines/${line_d_id}/pick"
              payload: { requested_units: 1 }
              as: WarehousePicker
            - call: "POST /orders/${order_id}/lines/${line_d_id}/pick_complete"
              payload: { actual_units: 1 }
              as: WarehousePicker
            - call: "POST /orders/${order_id}/lines/${line_e_id}/pick"
              payload: { requested_units: 1 }
              as: WarehousePicker
            - call: "POST /orders/${order_id}/lines/${line_e_id}/pick_complete"
              payload: { actual_units: 1 }
              as: WarehousePicker
          trigger:
            - call: "GET /orders/${order_id}"
              payload: {}
              as: CustomerAccount
              as_user_id: "${acct_id}"
              payload: {}
              as: CustomerAccount
              as_user_id: "${acct_id}"
            - call: "POST /orders/${order_id}/confirm_cutoff"
              payload: { expected_order_version: "${order_v_pre_pick}", service_level: "GROUND" }
              as: DCManager
          assert:
            - "before the cutoff, CatalogOrder.${order_id}.line_count == 5"
            - "before the cutoff, CatalogOrder.${order_id}.order_total_cents == 72000"
            - "before the cutoff, CatalogOrder.${order_id}.total_small_line_fee_cents == 2160"
            - "after POST /orders/${order_id}/confirm_cutoff, CatalogOrder.${order_id}.order_total_cents == 73588"
            - "after POST /orders/${order_id}/confirm_cutoff, CatalogOrder.${order_id}.total_small_line_fee_cents == 3748"
            - "the delta between the two variants is exactly 1588 cents for the identical five lines"

      - name: pipe_length_variant_divergence_before_and_after_first_cut
        grounds:
          - calculations.pipe_length_commitment_two_variant
          - state_machines.SquareFootageRequest.CUTTING_to_CUTTING
          - entities.SquareFootageRequest.fields.committed_variant
          - entities.SquareFootageRequest.fields.committed_length_feet
        distinguishing_aspect: "On the SquareFootageRequest domain the two variants differ by 400 feet for identical stock: forward_looking commits 960 feet against on_hand_only's 560, because the cut-in-progress allowance (800 ft) and the finished-goods allowance (400 ft) are different quantities while the customer's requested lengths are unchanged."
        test_recipe:
          setup:
            - "Logical clock 2026-09-14T08:00:00Z. Account Riverside Machine exists."
            - "A square-footage consignment with three cut lengths in cut-list order: 40 ft, 60 ft and 50 ft."
            - "No line has been cut yet, so request_status is QUOTED and committed_variant is FORWARD_LOOKING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { account_name: "Riverside Machine", delivery_zone: "America/New_York", home_region: "NORTHEAST" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /square-footage-requests"
              payload: { account_id: "${acct_id}", lines: [{ cut_list_ordinal: 1, requested_feet: 40 }, { cut_list_ordinal: 2, requested_feet: 60 }, { cut_list_ordinal: 3, requested_feet: 50 }] }
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { sqft_id: $.data.id, sqft_v: $.data.version }
          trigger:
            - call: "GET /square-footage-requests/${sqft_id}"
              payload: {}
              as: CustomerAccount
              as_user_id: "${acct_id}"
            - call: "POST /square-footage-requests/${sqft_id}/cut"
              payload: { cut_list_ordinal: 3 }
              as: WarehousePicker
            - call: "GET /square-footage-requests/${sqft_id}"
              payload: {}
              as: CustomerAccount
              as_user_id: "${acct_id}"
          assert:
            - "while committed_variant == FORWARD_LOOKING, SquareFootageRequest.${sqft_id}.committed_length_feet == 960"
            - "SquareFootageRequest.${sqft_id}.prior_committed_length_feet == 960 before the first cut"
            - "after the first cut, SquareFootageRequest.${sqft_id}.committed_variant == ON_HAND_ONLY"
            - "after the first cut, SquareFootageRequest.${sqft_id}.committed_length_feet == 560"
            - "after the first cut, SquareFootageRequest.${sqft_id}.prior_committed_length_feet == 960, unchanged"
            - "the delta between the two variants is exactly 400 feet for the identical stock"
  # ===========================================================================
  # Rule 2 — combinatorial formulas across different modes
  #   mode (b) nested rounding where the ORDER of rounding decides the cents
  #   mode (c) circular-looking dependency whose evaluation order must be pinned
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: order_handling_fee_nested_rounding_order
        grounds:
          - calculations.small_line_fee_total_and_allocate
          - calculations.order_total_two_variant
          - entities.CatalogOrder.fields.total_small_line_fee_cents
          - entities.CatalogOrderLine.fields.allocated_small_line_fee_cents
          - state_machines.CatalogOrder.RELEASED_ALLOCATED_to_RELEASED_PICKED
        distinguishing_aspect: "Mode (b): round the pool then allocate, never allocate then round — five eligible lines of 12000, 24000, 36000, 48000 and 60000 cents give a raw pool of 1200+2400+3600+4800+6000 = 18000; the count reduction of 250 per line brings D to 16750, the 37% order-level discount rounds to 6198, and the invariant is total_small_line_fee_cents == sum of allocated_small_line_fee_cents == 10552, with two lines carrying the leftover cent."
        test_recipe:
          setup:
            - "Logical clock 2026-09-14T08:00:00Z (Monday), DC BOS local 04:00 before its 06:00:00 cutoff."
            - "Account Riverside Machine in region NORTHEAST, delivery_zone America/New_York."
            - "Five curated items, each priced 12000 cents with curation_bundle_size 8."
            - "BOS holds 10 units of each item, so every line allocates in full."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /distribution-centers"
              payload: { code: "BOS", region: "NORTHEAST", local_zone: "America/New_York", local_cutoff_time: "06:00:00", utc_offset_minutes: -240, inbound_capacity_units: 900, transit_seconds: 86400 }
              as: PlatformAdmin
              captures: { bos_dc_id: $.data.id }
            - call: "POST /accounts"
              payload: { account_name: "Riverside Machine", delivery_zone: "America/New_York", home_region: "NORTHEAST" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "SKU-2001", description: "Metric die spring 12x50", material_spec: "chrome silicon", long_tail: false, unit_price_cents: 12000, unit_weight_kg: 0.20, curation_bundle_size: 8, curated_dimension_json: { nominal_length_mm: 50, nominal_width_mm: 12, nominal_height_mm: 12, drawing_revision: 1 } }
              as: CatalogCurator
              captures: { item_1_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "SKU-2002", description: "Metric die spring 14x63", material_spec: "chrome silicon", long_tail: false, unit_price_cents: 12000, unit_weight_kg: 0.20, curation_bundle_size: 8, curated_dimension_json: { nominal_length_mm: 63, nominal_width_mm: 14, nominal_height_mm: 14, drawing_revision: 1 } }
              as: CatalogCurator
              captures: { item_2_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "SKU-2003", description: "Metric die spring 16x80", material_spec: "chrome silicon", long_tail: false, unit_price_cents: 12000, unit_weight_kg: 0.20, curation_bundle_size: 8, curated_dimension_json: { nominal_length_mm: 80, nominal_width_mm: 16, nominal_height_mm: 16, drawing_revision: 1 } }
              as: CatalogCurator
              captures: { item_3_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "SKU-2004", description: "Metric die spring 20x100", material_spec: "chrome silicon", long_tail: false, unit_price_cents: 12000, unit_weight_kg: 0.20, curation_bundle_size: 8, curated_dimension_json: { nominal_length_mm: 100, nominal_width_mm: 20, nominal_height_mm: 20, drawing_revision: 1 } }
              as: CatalogCurator
              captures: { item_4_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "SKU-2005", description: "Metric die spring 25x125", material_spec: "chrome silicon", long_tail: false, unit_price_cents: 12000, unit_weight_kg: 0.20, curation_bundle_size: 8, curated_dimension_json: { nominal_length_mm: 125, nominal_width_mm: 25, nominal_height_mm: 25, drawing_revision: 1 } }
              as: CatalogCurator
              captures: { item_5_id: $.data.id }
            - call: "POST /items/${item_1_id}/attributes"
              payload: { attribute_name: "Wire Diameter", attribute_value: "2.00 mm", unit_of_measure: "mm" }
              as: CatalogCurator
            - call: "POST /items/${item_2_id}/attributes"
              payload: { attribute_name: "Wire Diameter", attribute_value: "2.25 mm", unit_of_measure: "mm" }
              as: CatalogCurator
            - call: "POST /items/${item_3_id}/attributes"
              payload: { attribute_name: "Wire Diameter", attribute_value: "2.50 mm", unit_of_measure: "mm" }
              as: CatalogCurator
            - call: "POST /items/${item_4_id}/attributes"
              payload: { attribute_name: "Wire Diameter", attribute_value: "2.75 mm", unit_of_measure: "mm" }
              as: CatalogCurator
            - call: "POST /items/${item_5_id}/attributes"
              payload: { attribute_name: "Wire Diameter", attribute_value: "3.00 mm", unit_of_measure: "mm" }
              as: CatalogCurator
            - call: "POST /curation-reviews"
              payload: { item_ids: ["${item_1_id}", "${item_2_id}", "${item_3_id}", "${item_4_id}", "${item_5_id}"] }
              as: CatalogCurator
            - call: "POST /stock"
              payload: { item_id: "${item_1_id}", dc_id: "${bos_dc_id}", account_id: "${acct_id}", on_hand_units: 10, daily_demand_units: 3, inbound_daily_units: 3 }
              as: DCManager
            - call: "POST /stock"
              payload: { item_id: "${item_2_id}", dc_id: "${bos_dc_id}", account_id: "${acct_id}", on_hand_units: 10, daily_demand_units: 3, inbound_daily_units: 3 }
              as: DCManager
            - call: "POST /stock"
              payload: { item_id: "${item_3_id}", dc_id: "${bos_dc_id}", account_id: "${acct_id}", on_hand_units: 10, daily_demand_units: 3, inbound_daily_units: 3 }
              as: DCManager
            - call: "POST /stock"
              payload: { item_id: "${item_4_id}", dc_id: "${bos_dc_id}", account_id: "${acct_id}", on_hand_units: 10, daily_demand_units: 3, inbound_daily_units: 3 }
              as: DCManager
            - call: "POST /stock"
              payload: { item_id: "${item_5_id}", dc_id: "${bos_dc_id}", account_id: "${acct_id}", on_hand_units: 10, daily_demand_units: 3, inbound_daily_units: 3 }
              as: DCManager
            - call: "POST /orders"
              payload: { account_id: "${acct_id}", lines: [{ item_id: "${item_1_id}", quantity: 1 }, { item_id: "${item_2_id}", quantity: 2 }, { item_id: "${item_3_id}", quantity: 3 }, { item_id: "${item_4_id}", quantity: 4 }, { item_id: "${item_5_id}", quantity: 5 }] }
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/release"
              payload: {}
              as: CustomerAccount
              as_user_id: "${acct_id}"
              captures: { order_v: $.data.version }
          trigger:
            - call: "POST /orders/${order_id}/allocate"
              payload: { expected_order_version: "${order_v}" }
              as: CustomerAccount
              as_user_id: "${acct_id}"
          assert:
            - "CatalogOrder.${order_id}.line_count == 5"
            - "CatalogOrder.${order_id}.total_small_line_fee_cents == 10552"
            - "sum of the five CatalogOrderLine.allocated_small_line_fee_cents == 10552"
            - "the three smallest lines each carry 2110 cents and the two largest each carry 2111 cents"
            - "the two lines carrying the extra cent are the two with the largest line_subtotal_cents (60000 and 48000 cents)"
            - "every CatalogOrderLine.line_total_cents == line_subtotal_cents + its own allocated_small_line_fee_cents"
            - "all five lines stay fee-eligible because each quantity <= curation_bundle_size 8, so no line's fee was zeroed by the tier test"

      - name: order_total_factor_first_evaluation_order
        grounds:
          - calculations.order_total_cents_factor_first
          - calculations.order_total_two_variant
          - entities.CatalogOrder.fields.order_total_cents
          - entities.CatalogOrderLine.fields.line_subtotal_cents
          - state_machines.CatalogOrder.PICKED_PICKED_to_PICKED_SHIPPED
        distinguishing_aspect: "Mode (c): the fee must be sized on the raw line, never on the discounted line — two 1000-cent lines give base_cents 1940 and a raw-basis fee of 100+100 = 200, so order_total_cents is 2140 and NOT 2134, which is what the circular reading (fee keyed on the already-discounted 970-cent line) would produce."
        test_recipe:
          setup:
            - "Logical clock 2026-09-14T08:00:00Z (Monday), DC BOS local 04:00 before its 06:00:00 cutoff."
            - "Account Riverside Machine in region NORTHEAST, delivery_zone America/New_York."
            - "Two curated items priced 1000 cents each with curation_bundle_size 8, so the five-line count reduction is NOT triggered and the raw per-line 3% fee stands."
            - "BOS holds 4 units of each item."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-14T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /distribution-centers"
              payload: { code: "BOS", region: "NORTHEAST", local_zone: "America/New_York", local_cutoff_time: "06:00:00", utc_offset_minutes: -240, inbound_capacity_units: 900, transit_seconds: 86400 }
              as: PlatformAdmin
              captures: { bos_dc_id: $.data.id }
            - call: "POST /accounts"
              payload: { account_name: "Riverside Machine", delivery_zone: "America/New_York", home_region: "NORTHEAST" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "SKU-2101", description: "Shim washer 0.05 mm", material_spec: "brass", long_tail: false, unit_price_cents: 1000, unit_weight_kg: 0.10, curation_bundle_size: 8, curated_dimension_json: { nominal_length_mm: 20, nominal_width_mm: 20, nominal_height_mm: 1, drawing_revision: 2 } }
