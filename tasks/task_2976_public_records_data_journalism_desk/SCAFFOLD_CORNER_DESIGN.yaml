      - name: publication_notice_gates_fire_in_priority_order_and_then_release
        claim_type: cascading
        grounds:
          - validations[priority=165]
          - validations[priority=170]
          - validations[priority=180]
          - calculations.subject_notice_sufficiency
          - state_machines.SubjectResponseRequest
        distinguishing_aspect: |
          The three subject-notice gates are strictly cascading: 165 asks whether notice was ever sent,
          170 asks whether 72 hours have elapsed, 180 asks whether two attempts are documented, and each
          one is only reachable once the previous has been satisfied. A single SubjectResponseRequest
          walks all three refusals in order on an otherwise publication-ready investigation, and an
          attempt submitted while the row is still DRAFT is rejected outright, proving the DRAFT ->
          NOTICE_ELIGIBLE hop belongs to lock-findings and not to the attempt endpoint. METHODOLOGY_ONLY
          keeps every disclosure-risk gate out of the picture, so no refusal here can be attributed to 130 or 140.
        test_recipe:
          setup:
            - "Clock at 2026-08-03T09:00:00Z. Desk (OPEN), Agency, one RELEASED RecordsRequest."
            - "Investigation with publication_mode METHODOLOGY_ONLY, one CLEAN_LOCKED dataset, an APPROVED and ALLOCATED AnalysisRun and one SME_CONFIRMED Finding - so analysis_readiness is READY but the investigation is still in ANALYSIS."
