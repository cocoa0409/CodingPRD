        claim_type: precision
        grounds:
          - calculations.changeover_writeoff_cost
          - calculations.changeover_writeoff_cost.constants.CHANGEOVER_PCT_TIER_1
          - entities.InventoryRunout.fields.changeover_expedite_cents
          - entities.InventoryRunout.fields.total_changeover_cost_cents
          - endpoints[POST /inventory-runouts/{id}/disposition]
        distinguishing_aspect: |
          A five-unit CARTON scrap produces a base of exactly 210 cents, and the tier-1
          surcharge is 210 x 0.05 = 10.5 - a true half-cent tie. round_half_up gives 11
          and a total of 221; banker's rounding gives 10 and 220; truncation gives 10
