  - name: corner_promise_variants_produce_different_dates
    claim_type: variant_divergence
    grounds:
    - calculations.delivery_promise_date.variants
    excluded_because:
      difficulty_instance: dual_variant_calc / promise_quoted_vs_recomputed_diverges_on_order_domain
      rationale: Same-data divergence between QUOTED and RECOMPUTED (2026-08-11 vs 2026-08-09) is the whole subject
        of the named §1.8 instance.
  - name: corner_line_cost_rounding_precision_is_pinned_at_the_unit_stage
    claim_type: precision
    grounds:
    - calculations.line_cost_and_order_margin
    excluded_because:
      difficulty_instance: combinatorial_formula / per_unit_rounding_before_multiplication_pins_line_cost
      rationale: The rounding mode and the rounding ORDER (round once per unit, then multiply) are asserted as 6796
        versus 6797 in the named §1.8 instance.
  - name: corner_restocking_fee_tier_boundaries
    claim_type: tiered_pricing
    grounds:
    - calculations.return_financials.constants.RESTOCK_FEE_TIER_BPS
    excluded_because:
      difficulty_instance: combinatorial_formula / return_fee_tier_keyed_on_pre_fee_base_not_on_refund
      rationale: The 20000-cent tier boundary and the pinned keying of the tier on the pre-fee base are asserted
        in the named §1.8 instance.
  - name: corner_snapshot_window_adjacency_and_overlap
    claim_type: interval_merge
    grounds:
    - calculations.available_to_promise_units
    - validations[priority=33]
    excluded_because:
      difficulty_instance: resource_temporal_overlap / snapshot_half_open_windows_reject_overlap_but_accept_exact_adjacency
      rationale: Adjacent (gap zero) accepted and nested overlap rejected are both asserted in the named §1.8 instance.
  - name: corner_fallback_chain_walk_order
    claim_type: topological
    grounds:
    - calculations.retransmit_target_selection
    excluded_because:
      difficulty_instance: non_linear_state_machine / line_backorder_retransmit_cycle_returns_to_transmitted_on_fallback_vendor
      rationale: The chain walk from the current offer to its fallback, and the resulting reroute, are asserted
        in the named §1.8 instance.
  - name: corner_reroute_reconciles_the_order_cost_delta
    claim_type: reconciliation
    grounds:
    - calculations.line_cost_and_order_margin
    - entities.DropshipOrder.fields.total_cost_cents
    excluded_because:
      difficulty_instance: non_linear_state_machine / line_backorder_retransmit_cycle_returns_to_transmitted_on_fallback_vendor
      rationale: The delta applied when the cost basis switches from commission 21249 to wholesale 17100 plus a
        500-cent surcharge is asserted as total_cost_cents 34700 in the named §1.8 instance.
- section: validations
  instances:
  - name: corner_duplicate_vendor_code_is_rejected
    claim_type: violation_to_error
    grounds:
    - validations[priority=15]
    - errors[ERR_DUPLICATE_VENDOR_CODE]
    - entities.Vendor.fields.vendor_code
    distinguishing_aspect: vendor_code is globally unique across all Vendor rows regardless of onboarding_status,
      so a second create with the same code returns 409 even though the first vendor is only DRAFT.
    test_recipe:
      setup:
      - Vendor V-DUP exists in DRAFT.
      setup_api_calls:
      - call: POST /dropship/_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /dropship/vendors
        payload:
          vendor_code: V-DUP
          legal_name: First Claimant LLC
          cost_model: COMMISSION
          commission_rate_bps: 1500
        as: PlatformAdmin
        captures:
          vdp_id: $.data.id
      trigger:
      - call: POST /dropship/vendors
        payload:
          vendor_code: V-DUP
          legal_name: Second Claimant LLC
          cost_model: WHOLESALE
          wholesale_discount_bps: 1000
        as: PlatformAdmin
        captures:
          err: $.data.error_id
      assert:
      - the response status is 409
      - the response error_id == ERR_DUPLICATE_VENDOR_CODE
      - Vendor.${vdp_id}.legal_name == "First Claimant LLC" (unchanged)
  - name: corner_duplicate_order_ref_is_rejected
    claim_type: violation_to_error
    grounds:
    - validations[priority=16]
    - errors[ERR_DUPLICATE_ORDER_REF]
    - entities.DropshipOrder.fields.order_ref
    distinguishing_aspect: 'order_ref is unique across all DropshipOrder rows. The second create is refused with
