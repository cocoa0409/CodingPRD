          - calculations.monitoring_status_projection
          - calculations.outage_severity_grade
          - calculations.excused_downtime_invariant
        distinguishing_aspect: "A false positive resolves an event without ever having been a fault: resolved_at is stamped from the clock, yet downtime_minutes stays 0 and excused stays false, so the agreement's excused_downtime_minutes must not move and no future month gets pro-rated. It is also reachable only from OPEN — a triaged event, which is the first state in which a truck roll can exist, is already too late."
