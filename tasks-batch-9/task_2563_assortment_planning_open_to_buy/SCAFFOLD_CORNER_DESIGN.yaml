              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { rc_id: $.data.id, rc_commit: $.data.commit_status, rc_fulfil: $.data.fulfillment_status }
          trigger:
            - call: "POST /otb/receipt-commitments/${rc_id}/ship"
              payload: {}
              as: VendorRep
              as_user_id: "${vendor_id}"
              captures: { ship_error: $.data.error_id }
            - call: "POST /otb/receipt-commitments/${rc_id}/receipts"
              payload: { received_units_delta: 100 }
              as: VendorRep
              as_user_id: "${vendor_id}"
              captures: { receipt_error: $.data.error_id }
            - call: "POST /otb/receipt-commitments/${rc_id}/commit"
              payload: {}
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { after_commit: $.data.commit_status, after_commit_fulfil: $.data.fulfillment_status }
            - call: "POST /otb/receipt-commitments/${rc_id}/ship"
              payload: {}
              as: VendorRep
              as_user_id: "${vendor_id}"
              captures: { shipped: $.data.fulfillment_status, shipped_commit: $.data.commit_status }
          assert:
            - "${rc_commit} == PROPOSED and ${rc_fulfil} == AWAITING_SHIP on create: both dimensions start at their declared initial states"
            - "${ship_error} == ERR_INVALID_STATE (409) and NOT ERR_NOT_COMMITMENT_VENDOR - the caller IS the commitment's vendor so priority 7 passes; the rejection is the AWAITING_SHIP -> SHIPPED precondition commit_status == COMMITTED"
            - "${receipt_error} == ERR_INVALID_STATE (409) as well, but for a structurally different reason: no receipts edge leaves AWAITING_SHIP, so the request fails on the transition table itself rather than on a cross-dimension guard"
            - "after both rejections GET /otb/receipt-commitments/${rc_id} still reports received_units 0, fulfillment_status AWAITING_SHIP and open_cost_cents 1040000, and PlanMonth.${m1_id}.otb_committed_cents is still 0"
            - "${after_commit} == COMMITTED with ${after_commit_fulfil} == AWAITING_SHIP: committing moves one dimension and deliberately leaves the other alone"
            - "${shipped} == SHIPPED with ${shipped_commit} == COMMITTED: the identical ship call now succeeds, which is what makes the earlier rejection attributable to the precondition and nothing else"

      - name: item_close_blocked_by_open_commitment_then_released
        claim_type: guarded_transitions
        grounds:
          - state_machines.AssortmentItem.transitions.CHASED_to_CLOSED
          - state_machines.ReceiptCommitment.transitions.PROPOSED_to_WITHDRAWN
          - validations[priority=9].ERR_INVALID_STATE
        distinguishing_aspect: "The close edge carries two preconditions and only the second one is contested: the item is ADOPTED, which the collapsed four-source row explicitly allows, so the rejection is entirely due to a child ReceiptCommitment sitting in commit_status PROPOSED. Withdrawing that child - which touches no PlanMonth field, because a PROPOSED commitment never entered otb_committed_cents - flips the same call to success and releases the option slot."
        test_recipe:
          setup:
            - "an APPROVED plan with M1 LOCKED_PLAN, a SLOTTED option plan with 14 slots, one ADOPTED item, and one PROPOSED commitment for that item"
          setup_api_calls:
            - call: "POST /otb/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /otb/departments"
              payload: { name: "Womens Apparel", code: "WAPP", fiscal_year: 2027, sales_target_cents: 500000000, margin_target_bps: 5600, turn_target_x100: 320 }
