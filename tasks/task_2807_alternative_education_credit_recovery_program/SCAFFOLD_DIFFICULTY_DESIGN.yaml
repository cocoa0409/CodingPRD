              payload: { name: "Cedar AEC", seat_capacity: 10, certified_teacher_fte: 4.00, support_staff_fte: 2.00, max_students_per_teacher: 12 }
              as: DistrictAdmin
              captures: { ctr_id: $.data.id, ctr_v1: $.data.version }
            - call: "POST /courses"
              payload: { code: "BIO1", title: "Biology I", subject_area: "SCIENCE", credit_value: 1.00, modality: "ONLINE", total_modules: 10, required_seat_hours: 60.00, pacing_days: 40, proctoring_required: true, proctored_exam_weight: 0.40, ncaa_approved: true, min_passing_percent: 60.00 }
              as: DistrictAdmin
              captures: { crs_id: $.data.id }
            - call: "POST /proctor-stations"
              payload: { center_id: "${ctr_id}", label: "LAB-1", station_type: "COMPUTER" }
              as: DistrictAdmin
              captures: { st_id: $.data.id }
            - call: "POST /students"
              payload: { home_school_id: "${hs_id}", state_student_id: "S-9301", full_name: "Pia Lund", cohort_year: 2027, grade_level: 11 }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /graduation-plans"
              payload: { student_id: "${stu_id}", required_credits_total: 24.00, grade_replacement_policy: "REPLACE_ON_RECOVERY", projected_completion_term: "2027-S2" }
              as: Registrar
              captures: { plan_id: $.data.id }
            - call: "POST /graduation-plans/${plan_id}/activate"
              payload: {}
              as: Registrar
            - call: "POST /referrals"
              payload: { student_id: "${stu_id}", center_id: "${ctr_id}", pathway: "CREDIT_DEFICIENCY", deficiency_credits: 6.00, behavior_incident_count: 1, days_disengaged: 6 }
              as: HomeSchoolCounselor
              as_user_id: "${hs_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/screen"
              payload: {}
              as: PlacementCoordinator
              as_user_id: "${ctr_id}"
            - call: "POST /referrals/${ref_id}/offer"
              payload: { offer_valid_days: 10, expected_center_version: "${ctr_v1}" }
              as: PlacementCoordinator
              as_user_id: "${ctr_id}"
            - call: "POST /referrals/${ref_id}/accept-offer"
              payload: { credit_policy: "COMPETENCY", start_date: "2026-08-03" }
              as: HomeSchoolCounselor
              as_user_id: "${hs_id}"
              captures: { pl_id: $.data.id, pl_v1: $.data.version }
            - call: "POST /course-enrollments"
              payload: { placement_id: "${pl_id}", course_id: "${crs_id}", enrollment_type: "NEW_CREDIT", expected_placement_version: "${pl_v1}" }
              as: AltEdTeacher
              as_user_id: "teach-01"
              captures: { enr_id: $.data.id }
            - call: "POST /course-enrollments/${enr_id}/progress"
              payload: { modules_passed_delta: 9, seat_hours_delta: 40.00, module_avg_percent: 84.00 }
              as: AltEdTeacher
              as_user_id: "teach-01"
            - call: "POST /proctor-sessions"
              payload: { course_enrollment_id: "${enr_id}", proctor_station_id: "${st_id}", scheduled_start: "2026-08-05T09:00:00Z", scheduled_end: "2026-08-05T10:00:00Z" }
              as: PlacementCoordinator
              as_user_id: "${ctr_id}"
              captures: { ps_id: $.data.id }
          trigger:
            - call: "POST /course-enrollments/${enr_id}/submit-for-award"
