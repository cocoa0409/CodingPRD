          assert:
            - "Booking.${b2_id}.status == BOOKED"
            - "Booking.${b2_id}.trainer_id == ${t2_id}"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cancel_restores_pack_seat_conservation
        grounds:
          - state_machines.Booking.BOOKED_to_CANCELLED
          - state_machines.Booking.BOOKED_to_BOOKED
          - calculations.session_pack_balance
          - entities.SessionPack.fields.sessions_remaining
        distinguishing_aspect: |
          Conserved quantity #1 = pack seat ledger: total_sessions == sessions_remaining + sessions_committed at all
          times. A free cancel (>=24h) compensates the booking commit exactly, so sessions_remaining returns to its
          pre-booking value 5 (committed back to 0) with zero drift.
        test_recipe:
          setup:
            - "SESSION_PACK engagement E ACTIVE; pack total 5 price 50000; one far-future BOOKED booking (committed=1, remaining=4)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /trainers"
              payload: { full_name: "T", email: "t17@x.com" }
              as: PlatformAdmin
              captures: { t_id: $.data.id }
            - call: "POST /clients"
              payload: { trainer_id: "${t_id}", full_name: "C", email: "c17@x.com", sex: "MALE", birth_year: 1992, height_cm: 178 }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { c_id: $.data.id }
            - call: "POST /clients/${c_id}/submit-intake"
              payload: {}
              as: Client
              as_user_id: "${c_id}"
            - call: "POST /clients/${c_id}/assess"
              payload: {}
              as: Trainer
              as_user_id: "${t_id}"
              captures: { c_ver: $.data.version }
            - call: "POST /engagements"
              payload: { client_id: "${c_id}", billing_model: "SESSION_PACK", expected_client_version: "${c_ver}" }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { e_id: $.data.id }
            - call: "POST /engagements/${e_id}/session-packs"
              payload: { total_sessions: 5, price_cents: 50000 }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { p_id: $.data.id, p_ver: $.data.version }
            - call: "POST /bookings"
              payload: { engagement_id: "${e_id}", start_utc: "2026-06-20T10:00:00Z", end_utc: "2026-06-20T11:00:00Z", session_pack_id: "${p_id}", expected_session_pack_version: "${p_ver}" }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /bookings/${b_id}/cancel"
              payload: {}
              as: Client
              as_user_id: "${c_id}"
          assert:
            - "Booking.${b_id}.status == CANCELLED"
            - "SessionPack.${p_id}.sessions_remaining == 5"
            - "Booking.${b_id}.fee_charged_cents == 0"

      - name: engagement_end_refund_wallet_conservation
        grounds:
          - state_machines.Engagement.ACTIVE_to_ENDED
          - state_machines.SessionPack.ACTIVE_to_REFUNDED
          - calculations.session_pack_balance
          - entities.Engagement.fields.wallet_credit_cents
        distinguishing_aspect: |
          Conserved quantity #2 = monetary value (cents), a DIFFERENT type than seat count: ending an engagement
          refunds exactly remaining_seats * per_session_value_cents into wallet_credit_cents. With 5 paid seats none
          consumed, wallet_credit_cents == 5*10000 == 50000, equal to price_cents paid — no money created or lost.
        test_recipe:
          setup:
            - "SESSION_PACK engagement E ACTIVE; pack total 5 price 50000; zero bookings consumed"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /trainers"
