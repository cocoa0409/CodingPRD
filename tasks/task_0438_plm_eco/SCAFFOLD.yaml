# =============================================================================
# task_0438_plm_eco — Product Lifecycle Management (PLM / ECO) seed tables
# Difficulty band: EXPERT (§0.4)
# =============================================================================

scenario: |
  438. Product Lifecycle Management (PLM/ECO): part & multi-level BOM revision,
  engineering change request/order (ECR/ECO), approval & effectivity date,
  where-used impact analysis, document/CAD vault & release, deviation/waiver,
  supplier change notice (PCN), serialization/config control

domain_name: plm-eco
api_prefix: /plm

# api_prefix is a flat top-level namespace (NOT a parent entity). Every resource
# collection is a peer under /plm — graph topology, no URL nesting except the two
# FK sub-resource reads (parts/{id}/revisions, part-revisions/{id}/bom-lines and
# change-orders/{id}/{approval-tasks,affected-items}).

complexity_profile:
  primary_archetype: graph_constraint
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - version_pinning_on_approval     # ECO pins child PartRevision ids at approval
    - scheduled_deferred_actions      # effectivity dates gate make-effective / expire
    - cascading_side_effects          # release/obsolete/conformance chains
    - optimistic_concurrency          # OCC on Part.version and PartRevision.version

  entity_topology: graph
  # Parts form a multi-level BOM DAG via BomLine edges; where-used = reverse edges;
  # cycle detection on edge insertion. Peer resources reference each other by FK.

  state_machine_shape: branching
  # ECR/ECO/Deviation/SCN fork into approve|reject with revision-loop reverts;
  # SerializedUnit carries two parallel state dimensions.

  relationship_patterns:
    - one_to_many        # Part -> PartRevision; ECO -> ApprovalTask/ChangeAffectedItem
    - many_to_many       # BomLine junction: PartRevision (parent) <-> Part (child)
    - self_referential   # BOM DAG: a PartRevision's children are Parts whose
                         # revisions have their own BomLines (multi-level)
    - cross_aggregate    # ECO governs PartRevisions; Deviation waives SerializedUnits

  role_model: segregation_of_duties
  # The user who creates/submits an ECO cannot approve it; an approver cannot
  # approve the same task twice; quality acts on deviations, supplier-mgr on PCNs.

  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Supplier legal name" }
      - { name: supplier_code, type: string, source: input, description: "Unique supplier code (uppercased, unique across all Suppliers)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | DISABLED", constraints: "ACTIVE | DISABLED" }

  - name: Part
    parent: null
    common_fields: true
    fields:
      - { name: part_number, type: string, source: input, description: "Unique part number across all Parts (uppercased)" }
      - { name: name, type: string, source: input, description: "Part description" }
      - { name: part_type, type: enum, source: input, description: "MAKE | BUY | PHANTOM", constraints: "MAKE | BUY | PHANTOM" }
      - { name: base_cost_cents, type: integer, source: input, default: 0, description: "For BUY: purchased unit cost in cents (>=0). For MAKE: labor/overhead adder added to rolled-up child cost. For PHANTOM: ignored (treated as 0)." }
      - { name: default_supplier_id, type: string, source: input, description: "FK -> Supplier.id; required when part_type=BUY, must be null otherwise" }
      - { name: released_revision_id, type: string, source: computed, default: null, description: "FK -> PartRevision.id; the single RELEASED revision of this part (null if none). Recomputed on every PartRevision release/obsolete." }
      - { name: revision_count, type: integer, source: computed, default: 0, description: "Count of PartRevision rows whose part_id == this Part.id" }

  - name: PartRevision
    parent: Part
    common_fields: true
    fields:
      - { name: part_id, type: string, source: system, description: "FK -> Part.id" }
      - { name: rev_label, type: string, source: system, description: "Revision label assigned in sequence A, B, C, ... per part_id (first revision = A)" }
      - { name: supersedes_revision_id, type: string, source: system, description: "FK -> PartRevision.id; the prior RELEASED revision this one was branched from (null for the first revision)" }
      - { name: governing_change_order_id, type: string, source: system, default: null, description: "FK -> EngineeringChangeOrder.id; the ECO whose affected-items list pins this revision for release (null until attached to an ECO)" }
      - { name: lifecycle_state, type: enum, source: system, default: WORKING, description: "WORKING | IN_REVIEW | RELEASED | OBSOLETE", constraints: "WORKING | IN_REVIEW | RELEASED | OBSOLETE" }
      - { name: planned_cost_cents, type: integer, source: computed, default: 0, description: "As-designed rolled-up cost: uses each child Part's LATEST non-OBSOLETE revision cost. See calc bom_cost_rollup variant=planned." }
      - { name: effective_cost_cents, type: integer, source: computed, default: 0, description: "As-released rolled-up cost: uses each child Part's released_revision_id cost only. See calc bom_cost_rollup variant=effective." }

  - name: BomLine
    parent: PartRevision
    common_fields: true
    fields:
      - { name: parent_revision_id, type: string, source: system, description: "FK -> PartRevision.id; the assembly revision that consumes the child" }
      - { name: child_part_id, type: string, source: input, description: "FK -> Part.id; the consumed component part" }
      - { name: quantity, type: integer, source: input, description: "Number of child parts per parent assembly (>=1)" }
      - { name: scrap_factor, type: number, source: input, default: 0, description: "Fractional scrap/yield loss applied to this line's extended cost (>=0, e.g. 0.005 = 0.5%); makes per-line rounding order observable" }
      - { name: reference_designator, type: string, source: input, default: "", description: "Optional placement note (e.g., R1, U3)" }

  - name: EngineeringChangeRequest
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Short change description" }
      - { name: affected_part_id, type: string, source: input, description: "FK -> Part.id; the part the change targets" }
      - { name: reason_code, type: enum, source: input, description: "DESIGN_DEFECT | COST_REDUCTION | SUPPLIER_CHANGE | OBSOLESCENCE", constraints: "DESIGN_DEFECT | COST_REDUCTION | SUPPLIER_CHANGE | OBSOLESCENCE" }
      - { name: source_pcn_id, type: string, source: system, default: null, description: "FK -> SupplierChangeNotice.id; set when this ECR was auto-created from an accepted PCN (null otherwise)" }
      - { name: submitted_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the Designer who submitted (opaque operator id; null while DRAFT)" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | APPROVED | REJECTED", constraints: "DRAFT | SUBMITTED | APPROVED | REJECTED" }

  - name: EngineeringChangeOrder
    parent: null
    common_fields: true
    fields:
      - { name: change_request_id, type: string, source: input, description: "FK -> EngineeringChangeRequest.id; the APPROVED ECR this ECO implements" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the ChangeAdmin who created the ECO (opaque); blocked from approving per segregation of duties" }
      - { name: required_approvals, type: integer, source: input, default: 2, description: "Quorum: number of DISTINCT approver tasks that must reach APPROVED before the ECO is APPROVED (>=1)" }
      - { name: approval_count, type: integer, source: computed, default: 0, description: "Count of ApprovalTask rows for this ECO whose decision == APPROVED" }
      - { name: effectivity_date, type: datetime, source: input, description: "ISO 8601 UTC instant at/after which the ECO may be made EFFECTIVE" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | IN_APPROVAL | APPROVED | EFFECTIVE | REJECTED | CANCELLED", constraints: "DRAFT | IN_APPROVAL | APPROVED | EFFECTIVE | REJECTED | CANCELLED" }

  - name: ApprovalTask
    parent: EngineeringChangeOrder
    common_fields: true
    fields:
      - { name: change_order_id, type: string, source: system, description: "FK -> EngineeringChangeOrder.id" }
      - { name: assignee_user_id, type: string, source: input, description: "X-User-ID of the Approver expected to decide this task (opaque)" }
      - { name: decision, type: enum, source: system, default: PENDING, description: "PENDING | APPROVED | REJECTED", constraints: "PENDING | APPROVED | REJECTED" }
      - { name: decided_by_user_id, type: string, source: system, default: null, description: "X-User-ID that recorded the decision (opaque); null while PENDING" }

  - name: ChangeAffectedItem
    parent: EngineeringChangeOrder
    common_fields: true
    fields:
      - { name: change_order_id, type: string, source: system, description: "FK -> EngineeringChangeOrder.id" }
      - { name: part_revision_id, type: string, source: input, description: "FK -> PartRevision.id; the WORKING/IN_REVIEW revision this ECO will RELEASE on effectivity" }
      - { name: pinned, type: boolean, source: system, default: false, description: "true once the ECO reaches APPROVED and the child revision ids of part_revision_id are frozen (version_pinning_on_approval)" }

  - name: Document
    parent: null
    common_fields: true
    fields:
      - { name: doc_number, type: string, source: input, description: "Unique document number across all Documents (uppercased)" }
      - { name: title, type: string, source: input, description: "Document title" }
      - { name: doc_type, type: enum, source: input, description: "CAD | DRAWING | SPEC", constraints: "CAD | DRAWING | SPEC" }
      - { name: part_id, type: string, source: input, default: null, description: "FK -> Part.id; the part this document describes (null for unattached docs)" }
      - { name: lifecycle_state, type: enum, source: system, default: WORKING, description: "WORKING | IN_REVIEW | RELEASED | OBSOLETE", constraints: "WORKING | IN_REVIEW | RELEASED | OBSOLETE" }

  - name: Deviation
    parent: null
    common_fields: true
    fields:
      - { name: part_id, type: string, source: input, description: "FK -> Part.id; the part the waiver covers" }
      - { name: change_order_id, type: string, source: input, default: null, description: "FK -> EngineeringChangeOrder.id; the ECO whose release the deviation pre-authorizes against (optional)" }
      - { name: defect_code, type: enum, source: input, description: "DIMENSIONAL | COSMETIC | MATERIAL | FUNCTIONAL", constraints: "DIMENSIONAL | COSMETIC | MATERIAL | FUNCTIONAL" }
      - { name: max_units, type: integer, source: input, description: "Max number of SerializedUnits the waiver may cover (>=1)" }
      - { name: effective_from, type: datetime, source: input, description: "ISO 8601 UTC inclusive start of the waiver window" }
      - { name: effective_to, type: datetime, source: input, description: "ISO 8601 UTC inclusive end of the waiver window (>= effective_from)" }
      - { name: covered_unit_count, type: integer, source: computed, default: 0, description: "Count of SerializedUnit rows whose deviation_id == this Deviation.id" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | GRANTED | DENIED | EXPIRED", constraints: "DRAFT | SUBMITTED | GRANTED | DENIED | EXPIRED" }

  - name: SupplierChangeNotice
    parent: null
    common_fields: true
    fields:
      - { name: supplier_id, type: string, source: input, description: "FK -> Supplier.id; the supplier issuing the notice" }
      - { name: affected_part_id, type: string, source: input, description: "FK -> Part.id; a BUY part the supplier is changing" }
      - { name: pcn_reference, type: string, source: input, description: "Supplier's external PCN reference (free text)" }
      - { name: spawned_ecr_id, type: string, source: system, default: null, description: "FK -> EngineeringChangeRequest.id; the ECR auto-created on acceptance (null until ACCEPTED)" }
      - { name: status, type: enum, source: system, default: RECEIVED, description: "RECEIVED | UNDER_ASSESSMENT | ACCEPTED | REJECTED", constraints: "RECEIVED | UNDER_ASSESSMENT | ACCEPTED | REJECTED" }

  - name: SerializedUnit
    parent: null
    common_fields: true
    fields:
      - { name: serial_number, type: string, source: input, description: "Unique serial across all SerializedUnits (uppercased)" }
      - { name: part_revision_id, type: string, source: input, description: "FK -> PartRevision.id; the as-built configuration this unit is pinned to" }
      - { name: deviation_id, type: string, source: system, default: null, description: "FK -> Deviation.id; the GRANTED waiver covering this unit's nonconformance (null otherwise)" }
      - { name: build_status, type: enum, source: system, default: PLANNED, description: "Build dimension: PLANNED | BUILT | SHIPPED", constraints: "PLANNED | BUILT | SHIPPED" }
      - { name: conformance_status, type: enum, source: system, default: CONFORMING, description: "Conformance dimension: CONFORMING | NONCONFORMING | WAIVED", constraints: "CONFORMING | NONCONFORMING | WAIVED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: PartRevision
    initial_state: WORKING
    terminal_states: [OBSOLETE]
    transitions:
      - from: WORKING
        to: IN_REVIEW
        trigger: "POST /plm/part-revisions/{id}/submit-review"
        actor: Designer
        preconditions:
          - "Revision has at least one BomLine if part_type==MAKE or PHANTOM (ERR_EMPTY_BOM)"
        side_effects:
          - "Recompute planned_cost_cents and effective_cost_cents (calc bom_cost_rollup)"

      - from: IN_REVIEW
        to: WORKING
        trigger: "POST /plm/part-revisions/{id}/return-to-work"
        actor: Designer
        preconditions: []
        side_effects: []
        note: "Revert leg — makes the PartRevision machine branching (non-linear)"

      - from: IN_REVIEW
        to: RELEASED
        trigger: "system (cascaded from EngineeringChangeOrder DRAFT/IN_APPROVAL/APPROVED -> EFFECTIVE make-effective)"
        actor: system
        preconditions:
          - "A ChangeAffectedItem links this revision to an ECO whose status is becoming EFFECTIVE (ERR_NO_GOVERNING_ECO)"
          - "governing_change_order_id ECO.status == APPROVED at make-effective time (ERR_ECO_NOT_APPROVED)"
        side_effects:
          - "Set Part.released_revision_id = this revision id"
          - "If a different prior PartRevision of the same part was RELEASED: transition it RELEASED -> OBSOLETE (cascade hop 2)"
          - "Recompute Part.revision_count"

      - from: RELEASED
        to: OBSOLETE
        trigger: "system (cascaded when a newer revision of the same part is RELEASED)"
        actor: system
        preconditions: []
        side_effects:
          - "For each SerializedUnit pinned to this revision with conformance_status==CONFORMING and not covered by a GRANTED Deviation: set conformance_status=NONCONFORMING (cascade hop 3)"

  - entity: EngineeringChangeRequest
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /plm/change-requests/{id}/submit"
        actor: Designer
        preconditions:
          - "affected_part_id Part exists (ERR_NOT_FOUND)"
        side_effects:
          - "Set submitted_by_user_id = X-User-ID"

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /plm/change-requests/{id}/approve"
        actor: ChangeAdmin
        preconditions: []
        side_effects: []

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /plm/change-requests/{id}/reject"
        actor: ChangeAdmin
        preconditions: []
        side_effects: []

      - from: REJECTED
        to: DRAFT
        trigger: "POST /plm/change-requests/{id}/reopen"
        actor: Designer
        preconditions: []
        side_effects:
          - "Clear submitted_by_user_id"
        note: "Revision loop — makes ECR machine non-linear (branching + revert)"

  - entity: EngineeringChangeOrder
    initial_state: DRAFT
    terminal_states: [EFFECTIVE, REJECTED, CANCELLED]
    transitions:
      - from: DRAFT
        to: IN_APPROVAL
        trigger: "POST /plm/change-orders/{id}/submit-for-approval"
        actor: ChangeAdmin
        preconditions:
          - "ECO has at least one ChangeAffectedItem (ERR_NO_AFFECTED_ITEMS)"
          - "ECO has at least required_approvals distinct ApprovalTask rows (ERR_INSUFFICIENT_APPROVERS)"
          - "change_request_id ECR.status == APPROVED (ERR_ECR_NOT_APPROVED) [cross-entity: ECO depends on ECR]"
        side_effects: []

      - from: IN_APPROVAL
        to: DRAFT
        trigger: "POST /plm/change-orders/{id}/recall"
        actor: ChangeAdmin
        preconditions: []
        side_effects:
          - "Reset every ApprovalTask.decision to PENDING and clear decided_by_user_id"
          - "Set approval_count = 0"
        note: "Cyclic revert leg IN_APPROVAL -> DRAFT (non-linear state machine on ECO)"

      - from: IN_APPROVAL
        to: APPROVED
        trigger: "system (auto when approval_count >= required_approvals after an ApprovalTask APPROVED decision)"
        actor: system
        preconditions:
          - "approval_count >= required_approvals (boundary: >=, not >)"
        side_effects:
          - "For each ChangeAffectedItem: set pinned=true and freeze child revision ids (version_pinning_on_approval)"

      - from: IN_APPROVAL
        to: REJECTED
        trigger: "system (auto when any ApprovalTask decision becomes REJECTED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: APPROVED
        to: EFFECTIVE
        trigger: "POST /plm/change-orders/{id}/make-effective"
        actor: ChangeAdmin
        preconditions:
          - "current clock >= effectivity_date (ERR_NOT_YET_EFFECTIVE)"
        side_effects:
          - "For each ChangeAffectedItem.part_revision_id: transition that PartRevision IN_REVIEW -> RELEASED (cascade hop 1 -> triggers PartRevision release chain)"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /plm/change-orders/{id}/cancel"
        actor: ChangeAdmin
        preconditions: []
        side_effects:
          - "Detach every ChangeAffectedItem: clear PartRevision.governing_change_order_id (compensating invariant: RELEASED-count conserved)"

      - from: IN_APPROVAL
        to: CANCELLED
        trigger: "POST /plm/change-orders/{id}/cancel"
        actor: ChangeAdmin
        preconditions: []
        side_effects:
          - "Detach every ChangeAffectedItem: clear PartRevision.governing_change_order_id and set pinned=false (compensating invariant)"

  - entity: ApprovalTask
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /plm/approval-tasks/{id}/approve"
        actor: Approver
        preconditions:
          - "Parent ECO.status == IN_APPROVAL (ERR_INVALID_STATE)"
          - "X-User-ID == assignee_user_id (ERR_NOT_TASK_ASSIGNEE)"
          - "X-User-ID != parent ECO.created_by_user_id (ERR_SEGREGATION_OF_DUTIES) [self-approval blocked]"
        side_effects:
          - "Set decided_by_user_id = X-User-ID"
          - "Increment ECO.approval_count by 1"
          - "If ECO.approval_count >= required_approvals: cascade ECO IN_APPROVAL -> APPROVED"

      - from: PENDING
        to: REJECTED
        trigger: "POST /plm/approval-tasks/{id}/reject"
        actor: Approver
        preconditions:
          - "Parent ECO.status == IN_APPROVAL (ERR_INVALID_STATE)"
          - "X-User-ID == assignee_user_id (ERR_NOT_TASK_ASSIGNEE)"
          - "X-User-ID != parent ECO.created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Set decided_by_user_id = X-User-ID"
          - "Cascade ECO IN_APPROVAL -> REJECTED"

  - entity: Document
    initial_state: WORKING
    terminal_states: [OBSOLETE]
    transitions:
      - from: WORKING
        to: IN_REVIEW
        trigger: "POST /plm/documents/{id}/submit-review"
        actor: Designer
        preconditions: []
        side_effects: []

      - from: IN_REVIEW
        to: WORKING
        trigger: "POST /plm/documents/{id}/return-to-work"
        actor: Designer
        preconditions: []
        side_effects: []

      - from: IN_REVIEW
        to: RELEASED
        trigger: "POST /plm/documents/{id}/release"
        actor: ChangeAdmin
        preconditions:
          - "If part_id set: that Part has a RELEASED revision (released_revision_id != null) (ERR_PART_NOT_RELEASED) [cross-entity: Document depends on Part]"
        side_effects: []

      - from: RELEASED
        to: OBSOLETE
        trigger: "POST /plm/documents/{id}/obsolete"
        actor: ChangeAdmin
        preconditions: []
        side_effects: []

  - entity: Deviation
    initial_state: DRAFT
    terminal_states: [DENIED, EXPIRED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /plm/deviations/{id}/submit"
        actor: Designer
        preconditions:
          - "effective_to >= effective_from (ERR_INVALID_WINDOW)"
        side_effects: []

      - from: SUBMITTED
        to: GRANTED
        trigger: "POST /plm/deviations/{id}/grant"
        actor: QualityEngineer
        preconditions:
          - "No other GRANTED Deviation for same part_id + defect_code with an inclusive [effective_from, effective_to] window overlapping this one (ERR_DEVIATION_WINDOW_OVERLAP)"
        side_effects:
          - "For each NONCONFORMING SerializedUnit pinned to a revision of part_id within window and uncovered, up to max_units (ordered by SerializedUnit.created_at ASC): set deviation_id and conformance_status=WAIVED; increment covered_unit_count"

      - from: SUBMITTED
        to: DENIED
        trigger: "POST /plm/deviations/{id}/deny"
        actor: QualityEngineer
        preconditions: []
        side_effects: []

      - from: GRANTED
        to: EXPIRED
        trigger: "POST /plm/deviations/{id}/expire"
        actor: QualityEngineer
        preconditions:
          - "current clock > effective_to (ERR_NOT_YET_EXPIRED)"
        side_effects:
          - "For each SerializedUnit whose deviation_id == this deviation and conformance_status==WAIVED: set conformance_status=NONCONFORMING and clear deviation_id; decrement covered_unit_count (compensating invariant: CONFORMING count conserved across grant+expire)"

  - entity: SupplierChangeNotice
    initial_state: RECEIVED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: RECEIVED
        to: UNDER_ASSESSMENT
        trigger: "POST /plm/supplier-change-notices/{id}/assess"
        actor: SupplierManager
        preconditions: []
        side_effects: []

      - from: UNDER_ASSESSMENT
        to: ACCEPTED
        trigger: "POST /plm/supplier-change-notices/{id}/accept"
        actor: SupplierManager
        preconditions:
          - "affected_part_id Part.part_type == BUY (ERR_PART_NOT_BUY)"
        side_effects:
          - "Create EngineeringChangeRequest{affected_part_id=affected_part_id, reason_code=SUPPLIER_CHANGE, source_pcn_id=this pcn, status=DRAFT} (cascade hop 1)"
          - "Set spawned_ecr_id = new ECR.id (cascade hop 2: PCN.spawned_ecr_id now references the created ECR)"

      - from: UNDER_ASSESSMENT
        to: REJECTED
        trigger: "POST /plm/supplier-change-notices/{id}/reject"
        actor: SupplierManager
        preconditions: []
        side_effects: []

  - entity: SerializedUnit
    initial_state: "PLANNED / CONFORMING"
    terminal_states: ["SHIPPED"]
    note: |
      Parallel state dimensions (non-linear). build_status: PLANNED -> BUILT -> SHIPPED.
      conformance_status: CONFORMING <-> NONCONFORMING <-> WAIVED, driven independently
      by release-obsolete cascades and deviation grant/expire. The two axes evolve
      independently on the same row.
    transitions:
      - from: "PLANNED"
        to: "BUILT"
        trigger: "POST /plm/serialized-units/{id}/build"
        actor: QualityEngineer
        preconditions:
          - "part_revision_id PartRevision.lifecycle_state == RELEASED (ERR_REVISION_NOT_RELEASED) [cross-entity: SerializedUnit depends on PartRevision]"
        side_effects: []
        note: "build_status dimension only"

      - from: "BUILT"
        to: "SHIPPED"
        trigger: "POST /plm/serialized-units/{id}/ship"
        actor: QualityEngineer
        preconditions:
          - "conformance_status IN {CONFORMING, WAIVED} (ERR_UNIT_NONCONFORMING)"
        side_effects: []
        note: "build_status dimension only; gated by conformance dimension"

      - from: "CONFORMING"
        to: "NONCONFORMING"
        trigger: "system (cascaded when pinned revision is OBSOLETED) OR POST /plm/serialized-units/{id}/flag-nonconforming"
        actor: "system | QualityEngineer"
        preconditions: []
        side_effects: []
        note: "conformance_status dimension"

      - from: "NONCONFORMING"
        to: "WAIVED"
        trigger: "system (cascaded when a covering Deviation is GRANTED)"
        actor: system
        preconditions: []
        side_effects: []
        note: "conformance_status dimension"

      - from: "WAIVED"
        to: "NONCONFORMING"
        trigger: "system (cascaded when covering Deviation EXPIRED)"
        actor: system
        preconditions: []
        side_effects: []
        note: "conformance_status dimension — compensating leg"

# =============================================================================
# Concurrency Rules (§1.2.1) — true CREATE-with-supersede races, OCC-resolved
# =============================================================================
concurrency_rules:
  - rule_id: revision-create-stale-part
    parent_entity: Part
    write_endpoint: "POST /plm/parts/{id}/revisions"
    occ_field: "expected_part_version"
    description: |
      Creating a new PartRevision branched from a Part whose version has advanced
      since the client last observed it is rejected. A new revision legitimately
      supersedes the prior one, so a second create against a stale Part view (its
      version already bumped by an earlier revision create) is a true conflict
      resolved by the stale-version check, not a state precondition.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: bomline-add-stale-revision
    parent_entity: PartRevision
    write_endpoint: "POST /plm/part-revisions/{id}/bom-lines"
    occ_field: "expected_part_revision_version"
    description: |
      Adding a BomLine to a WORKING PartRevision whose version has advanced since
      the client last read it is rejected. BOM lines legitimately stack, so a
      second add carrying a stale revision version (already bumped by a prior
      add) is a true conflict resolved by the stale-version check.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: bom_cost_rollup
    trigger: "POST /plm/part-revisions/{id}/submit-review; GET /plm/part-revisions/{id}/cost; any BomLine add; any descendant release/obsolete"
    algorithm: topological
    formula: |
      # Multi-level rolled-up cost of a PartRevision R (in cents).
      # Evaluation order is bottom-up over the BOM DAG (children before parents).
      # ROUNDING ORDER IS PINNED: extended cost is rounded PER BomLine, THEN summed.
      def rollup(R, variant):
        if R.part.part_type == BUY:
          return R.part.base_cost_cents                      # leaf BUY part
        total = 0
        for line in bom_lines(parent_revision_id == R.id):   # ordered by BomLine.created_at ASC
          child_part = part(line.child_part_id)
          child_rev = pick_child_revision(child_part, variant)
          if child_rev is None:                              # no usable child revision
            child_unit = child_part.base_cost_cents
          else:
            child_unit = rollup(child_rev, variant)
          raw = line.quantity * child_unit * (1 + line.scrap_factor)
          ext = round_half_up(raw)                           # ROUND PER LINE (pinned)
          total += ext                                       # THEN sum (never sum-then-round)
        if R.part.part_type == PHANTOM:
          return total                                       # PHANTOM adds no own cost
        # MAKE: add own labor/overhead adder
        return total + R.part.base_cost_cents
    input_set: |
      BomLines with parent_revision_id == R.id, processed in BomLine.created_at ASC order.
      Empty BOM (no lines): BUY -> base_cost_cents; MAKE -> base_cost_cents; PHANTOM -> 0.
    constants: {}
    precision: "integer cents; round_half_up applied per BomLine extended cost BEFORE summation"
    variants:
      - name: planned
        when: "stored in PartRevision.planned_cost_cents (as-designed)"
        difference: "pick_child_revision = the child Part's LATEST non-OBSOLETE PartRevision by rev_label sequence (newest A,B,C...). Reflects what the design intends, ignoring effectivity."
      - name: effective
        when: "stored in PartRevision.effective_cost_cents (as-released)"
        difference: "pick_child_revision = the child Part's released_revision_id only (the single RELEASED revision); if released_revision_id is null, falls to child_part.base_cost_cents. Reflects what is actually buildable today."

  - name: where_used_blast_radius
    trigger: "GET /plm/parts/{id}/where-used"
    algorithm: topological
    formula: |
      # Impact analysis for a target Part P: how many DISTINCT parent Parts
      # would be affected if P changes. Reverse-traverse BomLine edges.
      as_designed_parents = {}
      as_released_parents = {}
      for line in bom_lines(child_part_id == P.id):
        parent_rev = part_revision(line.parent_revision_id)
        parent_part = part(parent_rev.part_id)
        # as_designed: any parent revision that is NOT OBSOLETE consumes P
        if parent_rev.lifecycle_state != OBSOLETE:
          as_designed_parents.add(parent_part.id)
        # as_released: only count when parent_rev is the parent Part's released_revision_id
        if parent_part.released_revision_id == parent_rev.id:
          as_released_parents.add(parent_part.id)
      as_designed_affected_count = len(as_designed_parents)   # distinct parents
      as_released_affected_count = len(as_released_parents)
      # Transitive closure (multi-level): repeat reverse-walk until no new parents.
    input_set: "All BomLine rows with child_part_id == P.id, then their transitive reverse closure over non-OBSOLETE parent revisions."
    constants: {}
    precision: "integer counts of DISTINCT parent Part ids"
    variants:
      - name: as_designed_affected
        when: "field as_designed_affected_count in GET where-used response"
        difference: "Counts parents whose ANY non-OBSOLETE revision consumes P (broad blast radius)."
      - name: as_released_affected
        when: "field as_released_affected_count in GET where-used response"
        difference: "Counts only parents whose released_revision_id consumes P (narrow, currently-shipping blast radius)."

  - name: eco_approval_quorum
    trigger: "POST /plm/approval-tasks/{id}/approve"
    algorithm: threshold
    formula: |
      approval_count = count(ApprovalTask where change_order_id == ECO.id AND decision == APPROVED)
      eco_is_approved = approval_count >= ECO.required_approvals   # PINNED: >= , not >
    input_set: "ApprovalTask rows for the ECO with decision == APPROVED."
    constants: {}
    precision: "integer count; boundary is inclusive (>=)"

  - name: deviation_coverage
    trigger: "POST /plm/deviations/{id}/grant"
    algorithm: aggregation
    formula: |
      # Select NONCONFORMING units to waive, capped at max_units.
      candidates = [u for u in serialized_units
                    if part_revision(u.part_revision_id).part_id == dev.part_id
                    and u.conformance_status == NONCONFORMING
                    and u.deviation_id is None]
      candidates.sort(key = created_at ASC)          # deterministic order (NEVER id)
      take = candidates[:dev.max_units]
      covered_unit_count = len(take)                 # 0 when no candidates (empty-set boundary)
    input_set: "SerializedUnits of part_id with conformance_status==NONCONFORMING and deviation_id is null, ordered by created_at ASC, sliced to max_units."
    constants: {}
    precision: "integer count; covered_unit_count == 0 when candidate set empty"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_AUTH_HEADER
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Caller role is permitted for this endpoint per §1.7"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every path/body resource id resolves, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: state
    check: "Target resource is in a state from which the requested transition is allowed"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all transition endpoints

  - priority: 5
    category: business_safety
    check: "Approver may not be the ECO creator (self-approval blocked); approver must be the task assignee"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /plm/approval-tasks/{id}/approve, /reject"

  - priority: 6
    category: business_safety
    check: "Approver acting on a task must equal assignee_user_id"
    error_id: ERR_NOT_TASK_ASSIGNEE
    http_status: 403
    applies_to: "POST /plm/approval-tasks/{id}/approve, /reject"

  - priority: 7
    category: business_referential
    check: "A BomLine's child_part_id must not introduce a cycle into the BOM DAG (the child must not transitively consume the parent's part)"
    error_id: ERR_BOM_CYCLE
    http_status: 409
    applies_to: "POST /plm/part-revisions/{id}/bom-lines"

  - priority: 8
    category: business_referential
    check: "An ECO's change_request_id ECR must be APPROVED before submit-for-approval"
    error_id: ERR_ECR_NOT_APPROVED
    http_status: 409
    applies_to: "POST /plm/change-orders/{id}/submit-for-approval"

  - priority: 9
    category: business_referential
    check: "A PartRevision may only RELEASE under an APPROVED governing ECO"
    error_id: ERR_ECO_NOT_APPROVED
    http_status: 409
    applies_to: "POST /plm/change-orders/{id}/make-effective (cascade to PartRevision release)"

  - priority: 10
    category: business_constraint
    check: "ECO must have at least one ChangeAffectedItem before submit-for-approval"
    error_id: ERR_NO_AFFECTED_ITEMS
    http_status: 409
    applies_to: "POST /plm/change-orders/{id}/submit-for-approval"

  - priority: 11
    category: business_constraint
    check: "ECO must have >= required_approvals distinct ApprovalTask rows before submit-for-approval"
    error_id: ERR_INSUFFICIENT_APPROVERS
    http_status: 409
    applies_to: "POST /plm/change-orders/{id}/submit-for-approval"

  - priority: 12
    category: business_temporal
    check: "A GRANTED Deviation window [effective_from, effective_to] (inclusive both ends) must not overlap another GRANTED Deviation for the same part_id + defect_code"
    error_id: ERR_DEVIATION_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /plm/deviations/{id}/grant"

  - priority: 12.5
    category: business_constraint
    check: "A PartRevision may be governed by at most one non-terminal ECO at a time (exclusive occupancy); attaching a revision already governed by a non-terminal ECO collides"
    error_id: ERR_REVISION_ALREADY_GOVERNED
    http_status: 409
    applies_to: "POST /plm/change-orders/{id}/affected-items"

  - priority: 13
    category: business_temporal
    check: "An ECO may be made EFFECTIVE only when current clock >= effectivity_date"
    error_id: ERR_NOT_YET_EFFECTIVE
    http_status: 409
    applies_to: "POST /plm/change-orders/{id}/make-effective"

  - priority: 14
    category: business_constraint
    check: "Deviation effective_to must be >= effective_from"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /plm/deviations/{id}/submit"

  - priority: 15
    category: business_constraint
    check: "A MAKE/PHANTOM PartRevision must have at least one BomLine to enter IN_REVIEW"
    error_id: ERR_EMPTY_BOM
    http_status: 409
    applies_to: "POST /plm/part-revisions/{id}/submit-review"

  - priority: 16
    category: business_constraint
    check: "BUY part create requires default_supplier_id; MAKE/PHANTOM must omit it; quantity >=1; positive integers where required; unique part_number/serial/doc_number/supplier_code"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all create endpoints"

  - priority: 17
    category: business_referential
    check: "OCC: expected_part_version / expected_part_revision_version must equal current parent version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /plm/parts/{id}/revisions, POST /plm/part-revisions/{id}/bom-lines"

  - priority: 18
    category: business_constraint
    check: "PCN may only be ACCEPTED when affected_part_id Part.part_type == BUY"
    error_id: ERR_PART_NOT_BUY
    http_status: 409
    applies_to: "POST /plm/supplier-change-notices/{id}/accept"

  - priority: 19
    category: business_constraint
    check: "A SerializedUnit may only ship when conformance_status IN {CONFORMING, WAIVED}"
    error_id: ERR_UNIT_NONCONFORMING
    http_status: 409
    applies_to: "POST /plm/serialized-units/{id}/ship"

  - priority: 20
    category: business_constraint
    check: "Pagination params in range: 1 <= limit <= 100, offset >= 0 (conflicts with nothing; runs on list endpoints)"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all list (GET collection) endpoints"

# =============================================================================
# Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

