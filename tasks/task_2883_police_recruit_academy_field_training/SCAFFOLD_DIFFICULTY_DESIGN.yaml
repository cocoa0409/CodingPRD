  - rule_id: cross_entity_state_dependency
    instances:

      - name: session_delivery_requires_pinned_plan_revision_still_approved
        grounds:
          - state_machines[LessonPlan].transitions[APPROVED -> SUBMITTED]
          - state_machines[LessonPlan].transitions[SUBMITTED -> APPROVED]
          - state_machines[CourseSession].transitions[SCHEDULED -> DELIVERED]
          - entities.CourseSession.fields.pinned_lesson_plan_revision
          - entities.LessonPlan.fields.approved_revision_number
          - validations[priority 52 category business_safety ERR_LESSON_PLAN_NOT_APPROVED]
          - concurrency_rules[lesson-plan-revision-stale-plan]
        distinguishing_aspect: |
          Whether a CourseSession may leave SCHEDULED depends on TWO facts about a different
          entity, and satisfying only one of them is not enough. First the LessonPlan must be in
          status APPROVED - a revision submitted against an already-APPROVED plan drops it back to
          SUBMITTED (guarded by OCC on the plan's version) and the session becomes undeliverable.
          Then, once the plan is re-approved, approved_revision_number has advanced to 2 while the
          session still pins revision 1, so the identical delivery call is rejected a SECOND time
          with the same error id for a different reason. Only a session created AFTER the
          re-approval pins 2 and delivers. An implementation that checks status alone, or that
          re-points existing sessions at the new revision, passes one of the three delivery calls
          and fails the others.
        test_recipe:
          setup:
            - "One CertificationStandard requiring 6.00 PATROL hours; one AcademyClass; one CERTIFIED instructor authorized for PATROL."
            - "One LessonPlan APPROVED at revision_number 1, so approved_revision_number is 1."
            - "One CourseSession cs1 (2026-08-10T09:00:00Z - 11:00:00Z) created while the plan was APPROVED, so pinned_lesson_plan_revision is 1."
            - "A revision then submitted by the authoring instructor with the plan's current version, moving the plan APPROVED -> SUBMITTED at revision_number 2 while approved_revision_number stays 1."
            - "Logical clock at 2026-08-10T12:00:00Z, after cs1's ends_at."
          setup_api_calls:
            - call: "POST /certification-standards"
              payload: { code: "TCOLE-PIN", state_code: "TX", min_total_hours: 6.00, min_passing_score: 70.00, max_remediation_attempts: 1, max_absence_hours: 4.00, topic_requirements: [{ topic_code: "PATROL", required_hours: 6.00, exam_required: false }], fitness_event_floor_points: 10, fitness_pass_score: 60 }
              as: AcademyDirector
              as_user_id: "dir-1"
              captures: { std_id: $.data.id }
            - call: "POST /academy-classes"
              payload: { certification_standard_id: "${std_id}", class_code: "CLS-PN", start_date: "2026-08-03", planned_seats: 30 }
              as: AcademyDirector
              as_user_id: "dir-1"
              captures: { class_id: $.data.id }
            - call: "POST /instructors"
              payload: { badge_number: "B-290", full_name: "Ivy Nash" }
              as: AcademyDirector
              as_user_id: "dir-1"
              captures: { instrA: $.data.id }
            - call: "POST /instructors/${instrA}/certify"
              payload: { certification_expires_at: "2028-08-01T00:00:00Z", authorized_topic_codes: ["PATROL"], fto_certified: true }
              as: AcademyDirector
              as_user_id: "dir-1"
            - call: "POST /lesson-plans"
              payload: { instructor_id: "${instrA}", topic_code: "PATROL", title: "Patrol Operations", contact_hours: 2.00 }
              as: AcademyInstructor
              as_user_id: "${instrA}"
              captures: { lp_id: $.data.id }
            - call: "POST /lesson-plans/${lp_id}/approve"
              payload: {}
              as: AcademyDirector
              as_user_id: "dir-1"
            - call: "POST /course-sessions"
              payload: { academy_class_id: "${class_id}", lesson_plan_id: "${lp_id}", instructor_id: "${instrA}", room_code: "R1", starts_at: "2026-08-10T09:00:00Z", ends_at: "2026-08-10T11:00:00Z", min_enrollment: 1 }
              as: TrainingCoordinator
              as_user_id: "tc-1"
              captures: { cs1_id: $.data.id }
            - call: "GET /lesson-plans/${lp_id}"
              payload: {}
              as: AcademyDirector
              as_user_id: "dir-1"
              captures: { lp_v: $.data.version, approved_rev_before: $.data.approved_revision_number }
            - call: "POST /lesson-plans/${lp_id}/revisions"
