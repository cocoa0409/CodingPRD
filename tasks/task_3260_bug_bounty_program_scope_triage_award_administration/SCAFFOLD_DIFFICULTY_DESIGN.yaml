            - "adjacent version [2026-06-01, null) succeeds (201): half-open adjacency is not overlap"
            - "${err} == ERR_SCOPE_WINDOW_OVERLAP for [2026-03-01, 2026-04-01) intersecting [2026-01-01, 2026-06-01)"

      - name: blackout_closed_interval_gap_buffer
        grounds:
          - entities.Program.fields.blackout_windows
          - errors[ERR_BLACKOUT_OVERLAP]
          - concurrency_rules[program-patch-stale-version]
        distinguishing_aspect: |
          Different interval semantics on a different resource (Program.blackout_windows
          vs ScopeVersion): closed intervals [start, end] sharing an endpoint count as
          overlap, and a pairwise gap strictly less than 3600 seconds is rejected;
          exactly 3600 seconds is allowed.
        test_recipe:
          setup:
            - "program P with one blackout window [2026-10-01T00:00:00Z, 2026-10-10T00:00:00Z] installed via PATCH"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/programs"
              payload: { name: "P", bounty_pool_cents: 5000000, min_reputation: 0, response_sla_hours: 72, resolution_sla_days: 30, disclosure_window_days: 30 }
              as: PlatformAdmin
              captures: { prog: $.data.id, prog_v: $.data.version }
            - call: "PATCH /api/programs/${prog}"
              payload: { expected_program_version: "${prog_v}", blackout_windows: [{ starts_at: "2026-10-01T00:00:00Z", ends_at: "2026-10-10T00:00:00Z" }] }
              as: ProgramAdmin
              captures: { prog_v2: $.data.version }
          trigger:
            - call: "PATCH /api/programs/${prog}"
              payload: { expected_program_version: "${prog_v2}", blackout_windows: [{ starts_at: "2026-10-01T00:00:00Z", ends_at: "2026-10-10T00:00:00Z" }, { starts_at: "2026-10-10T00:30:00Z", ends_at: "2026-10-20T00:00:00Z" }] }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
            - call: "PATCH /api/programs/${prog}"
              payload: { expected_program_version: "${prog_v2}", blackout_windows: [{ starts_at: "2026-10-01T00:00:00Z", ends_at: "2026-10-10T00:00:00Z" }, { starts_at: "2026-10-10T01:00:00Z", ends_at: "2026-10-20T00:00:00Z" }] }
              as: ProgramAdmin
          assert:
            - "${err} == ERR_BLACKOUT_OVERLAP: 1800-second gap violates the >= 3600s buffer (and closed endpoints coincide)"
            - "gap of exactly 3600 seconds succeeds (200)"
            - "the rejected PATCH did not bump Program.${prog}.version (second attempt reuses ${prog_v2})"

  - rule_id: compensating_invariant
    instances:
      - name: award_approve_pay_void_pool_conservation
        grounds:
          - state_machines.Award
          - entities.Program.fields.bounty_reserved_cents
          - entities.Program.fields.available_pool_cents
        distinguishing_aspect: |
          Conserved quantity: money. The pool identity reserved + paid + available ==
          bounty_pool_cents (5000000) holds across approve (reserve 2200000), void
          (release back to 0), and a subsequent approve+pay of a 10000 BONUS; forward
          and compensating actions leave zero drift.
        test_recipe:
          setup:
            - "ACTIVE public program (pool 5000000), CRITICAL asset, researcher R with VERIFIED US tax doc (0% withholding)"
            - "report validated CRITICAL; BOUNTY award aw1 (amount 2200000) created and APPROVED"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/programs"
              payload: { name: "P", bounty_pool_cents: 5000000, min_reputation: 0, response_sla_hours: 72, resolution_sla_days: 30, disclosure_window_days: 30 }
              as: PlatformAdmin
              captures: { prog: $.data.id }
            - call: "POST /api/assets"
              payload: { program_id: "${prog}", name: "A", asset_identifier: "a.example.com", criticality: "CRITICAL" }
              as: ProgramAdmin
              captures: { asset: $.data.id }
            - call: "POST /api/scope-versions"
              payload: { program_id: "${prog}", effective_from: "2026-01-01T00:00:00Z", in_scope_asset_ids: ["${asset}"] }
              as: ProgramAdmin
            - call: "POST /api/programs/${prog}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/researchers"
              payload: { handle: "r17", email: "r17@x.com", country_code: "US" }
              as: Anonymous
              captures: { res: $.data.id }
            - call: "POST /api/researchers/${res}/tax-documents"
              payload: { document_type: "W9" }
              as: Researcher
              as_user_id: "${res}"
            - call: "POST /api/researchers/${res}/tax-documents"
              payload: { mark_verified: true }
              as: PlatformAdmin
            - call: "POST /api/reports"
              payload: { program_id: "${prog}", asset_id: "${asset}", title: "t", description: "d", vulnerability_class: "RCE" }
              as: Researcher
              as_user_id: "${res}"
              captures: { rep: $.data.id }
            - call: "POST /api/reports/${rep}/triage"
              payload: { action: "TRIAGE" }
              as: Triager
            - call: "POST /api/reports/${rep}/validate"
              payload: { impact: 9, exploitability: 8, affected_scope: 5 }
              as: Triager
            - call: "POST /api/awards"
              payload: { report_id: "${rep}", award_type: "BOUNTY" }
              as: Triager
              captures: { aw1: $.data.id }
            - call: "POST /api/awards/${aw1}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "GET /api/programs/${prog}"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /api/awards/${aw1}/void"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/awards"
              payload: { report_id: "${rep}", award_type: "BONUS", amount_cents: 10000 }
              as: Triager
              captures: { aw2: $.data.id }
            - call: "POST /api/awards/${aw2}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/awards/${aw2}/pay"
              payload: {}
              as: PlatformAdmin
            - call: "GET /api/programs/${prog}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "after approve: Program.${prog}.bounty_reserved_cents == 2200000 and available_pool_cents == 2800000 (setup-time check)"
            - "after void: reserved returns to 0 with zero drift"
            - "final: Program.${prog}.bounty_reserved_cents == 0, bounty_paid_cents == 10000, total_withheld_cents == 0, available_pool_cents == 4990000"
            - "invariant: reserved + paid + available == bounty_pool_cents == 5000000 at every step"

      - name: conduct_reverse_restores_reputation_invariant
        grounds:
          - calculations.reputation_delta
          - state_machines.Researcher
        distinguishing_aspect: |
          Conserved quantity: reputation points and strike count (distinct from money).
          Two STRIKEs (-100, suspended at strike 2) followed by two REVERSE_LAST
          compensations restore reputation_lifetime == 100, strike_count == 0, and
          status == ACTIVE exactly; one reversal alone leaves the researcher SUSPENDED
          (1 unreversed strike < 2 threshold -> ACTIVE; pinned: reversal recomputes
          status from unreversed counts).
        test_recipe:
          setup:
            - "researcher R (ACTIVE, reputation 100)"
            - "two STRIKE conduct actions applied (R SUSPENDED, reputation 0, strike_count 2)"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/researchers"
              payload: { handle: "r18", email: "r18@x.com", country_code: "US" }
              as: Anonymous
              captures: { res: $.data.id }
            - call: "POST /api/researchers/${res}/conduct-actions"
              payload: { action: "STRIKE", reason: "one" }
              as: Triager
            - call: "POST /api/researchers/${res}/conduct-actions"
              payload: { action: "STRIKE", reason: "two" }
              as: Triager
          trigger:
            - call: "POST /api/researchers/${res}/conduct-actions"
              payload: { action: "REVERSE_LAST", reason: "appeal upheld" }
              as: ProgramAdmin
            - call: "GET /api/researchers/${res}"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/researchers/${res}/conduct-actions"
              payload: { action: "REVERSE_LAST", reason: "second appeal upheld" }
              as: ProgramAdmin
            - call: "GET /api/researchers/${res}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "intermediate GET after first REVERSE_LAST: strike_count == 1, status == ACTIVE (below 2-strike threshold), reputation_lifetime == 50"
            - "after second REVERSE_LAST: Researcher.${res}.reputation_lifetime == 100"
            - "Researcher.${res}.strike_count == 0 and status == ACTIVE and suspension_ends_at == null"
            - "invariant: reputation_lifetime == 100 + sum(unreversed deltas) == 100 with zero drift"
