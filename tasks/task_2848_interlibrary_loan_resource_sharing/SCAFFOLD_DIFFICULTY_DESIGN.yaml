  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: intake_gate_reads_patron_status_blocked_written_after_an_earlier_success
        grounds:
          - validations[priority=58]
          - errors[ERR_PATRON_BLOCKED]
          - entities.Patron.fields.status
          - endpoints[PATCH /ill/patrons/{id}]
          - endpoints[POST /ill/requests]
        distinguishing_aspect: |
          The dependent pair is IllRequest → Patron: an intake payload that is byte-for-byte
          acceptable at one moment is refused at the next, purely because a write to a different
          entity (Patron.status ACTIVE → BLOCKED via PATCH /ill/patrons/{id}) happened in between.
          Nothing on the IllRequest side of the payload changed.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "Patron P-8012 ACTIVE with max_open_requests 5 and no infractions."
            - "Two distinct BibItems with local_holding_status NONE, so the payloads differ only in bib_item_id."
            - "Partner NORTHU on a single-entry LOAN rota so intake always finds a lender."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/patrons"
              payload: { external_id: "P-8012", full_name: "Lena Undergrad", email: "lena@u.edu", patron_type: "UNDERGRAD", department: "BIOL", max_open_requests: 5, max_concurrent_loans: 3, unpaid_balance_cap_cents: 5000 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { patron_id: $.data.id, status_0: $.data.status }
            - call: "POST /ill/partners"
              payload: { code: "NORTHU", name: "North University Library", consortium_code: "MIDWEST", base_lending_fee_cents: 2000, avg_turnaround_days: 4, ships_physical: true, supplies_electronic: true, allows_renewals: true, loan_period_days: 28, max_renewals: 2 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { northu_id: $.data.id }
            - call: "POST /ill/rotas"
              payload: { name: "Monograph rota", material_type: "LOAN", selection_policy: "LANDED_COST", max_attempts: 3, auto_escalate_pod: false, offer_response_hours: 48 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { rota_id: $.data.id, rota_v0: $.data.version }
            - call: "POST /ill/rota-entries"
              payload: { rota_id: "${rota_id}", expected_rota_version: "${rota_v0}", partner_id: "${northu_id}", manual_rank: 1, quoted_fee_cents: 2000, quoted_turnaround_days: 4, is_enabled: true }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/bib-items"
              payload: { title: "Marine Invertebrates of the Pacific", item_type: "BOOK", publication_year: 2015, isbn: "978-0-000-00006-6", local_holding_status: "NONE", licensed_access_status: "NONE", list_price_cents: 9000 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { bib_a_id: $.data.id }
            - call: "POST /ill/bib-items"
              payload: { title: "Coral Reef Ecology", item_type: "BOOK", publication_year: 2016, isbn: "978-0-000-00007-3", local_holding_status: "NONE", licensed_access_status: "NONE", list_price_cents: 9000 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { bib_b_id: $.data.id }
          trigger:
            - call: "POST /ill/requests"
              payload: { patron_id: "${patron_id}", bib_item_id: "${bib_a_id}", rota_id: "${rota_id}", service_type: "LOAN", delivery_mode: "PICKUP", needed_by: "2026-08-09T00:00:00Z", max_supply_fee_cents: 5000 }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { req1_id: $.data.id, req1_status: $.data.status }
            - call: "PATCH /ill/patrons/${patron_id}"
              payload: { status: "BLOCKED" }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { status_1: $.data.status, open_after_block: $.data.open_request_count }
            - call: "POST /ill/requests"
              payload: { patron_id: "${patron_id}", bib_item_id: "${bib_b_id}", rota_id: "${rota_id}", service_type: "LOAN", delivery_mode: "PICKUP", needed_by: "2026-08-09T00:00:00Z", max_supply_fee_cents: 5000 }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { err_blocked: $.data.error_id }
          assert:
            - "${status_0} == ACTIVE and ${req1_status} == SOURCING — the first intake succeeded on exactly this shape of payload"
            - "${status_1} == BLOCKED and ${open_after_block} == 1 — blocking the patron does not cancel the request already in flight"
            - "${err_blocked} == ERR_PATRON_BLOCKED with HTTP 403 — the intake gate read the Patron row, not the payload"
            - "GET /ill/requests?patron_id=${patron_id} returns total_count == 1 and the only row is ${req1_id}"
            - "GET /ill/bib-items/${bib_b_id} shows local_holding_status NONE — the refusal was not about holdings"
            - "Patron.${patron_id}.open_request_count == 1 and pending_charge_cents unchanged by the refused call"

      - name: offer_acceptance_gate_reads_partner_status_suspended_after_the_offer_opened
        grounds:
          - validations[priority=76]
          - errors[ERR_PARTNER_NOT_ELIGIBLE]
          - entities.Partner.fields.status
          - entities.SupplyOffer.fields.status
          - endpoints[PATCH /ill/partners/{id}]
          - endpoints[POST /ill/supply-offers/{id}/accept]
        distinguishing_aspect: |
          A different entity pair from the intake instance — SupplyOffer → Partner — and a different
          direction of dependency: the offer row itself stays OFFERED and perfectly valid, but
          acceptance is refused because the lender it points at was suspended after the offer was
          created. Restoring the Partner to ACTIVE makes the identical acceptance succeed.
        test_recipe:
          setup:
