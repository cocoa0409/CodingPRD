      - name: hemorrhage_activation_mints_four_items_whose_authoritative_due_dates_accumulate_to_fifty_five_minutes
        claim_type: Correct Result
        grounds:
          - calculations.bundle_checklist_template
          - entities.BundleChecklistItem.fields.due_at_activation_anchored
          - entities.BundleChecklistItem.fields.due_at_sequence_anchored
          - entities.BundleChecklistItem.fields.required_within_minutes
          - entities.SafetyBundleActivation.fields.activated_at
          - endpoints[POST /bundle-activations]
          - endpoints[GET /bundle-activations/{activationId}/checklist-items]
        distinguishing_aspect: |
          The OBSTETRIC_HEMORRHAGE template is minted server-side and its authoritative anchor is
          CUMULATIVE, not per-step: due_at_activation_anchored(n) is activated_at plus the SUM of
          required_within_minutes for every step up to n, giving +10, +25, +45, +55 minutes from a single
          06:00 activation. The fourth row is the discriminator — its own required_within_minutes is 10,
          the same as the first row's, yet its deadline is 06:55 rather than 06:10, so an implementation
          that stamps activated_at + required_within_minutes per item produces the right answer only for
          step 1 and is wrong by 20, 25 and 45 minutes on the rest. The advisory anchor is also
          deliberately sparse: due_at_sequence_anchored is populated for step_sequence 1 only and stays
          null downstream until each predecessor actually completes.
        test_recipe:
          setup: |
            Clock at 2026-08-01T06:00:00Z. One unit with one AVAILABLE LDR bed left unoccupied so the
            admission is not blocked by the DIVERT gate. One term singleton vertex encounter in
            ANTEPARTUM with no bundle of any type on it, so the 8.06 uniqueness rule is satisfied. No
            staff or shifts are needed: activation is authorised by role alone (priority 12 does not
            apply to POST /bundle-activations) and mints the checklist itself — items are never
            client-created.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
            - call: POST /obstetric-units
              payload: { unit_name: "Emberlyn Regional Maternity LDR", licensed_ldr_beds: 4, licensed_or_rooms: 1 }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { unit_id: $.data.id }
            - call: POST /obstetric-units/${unit_id}/beds
              payload: { bed_label: "LDR-01", bed_type: "LDR" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
              captures: { bed_ldr_1: $.data.id }
            - call: POST /labor-encounters
              payload: { unit_id: "${unit_id}", patient_record_code: "PRC-QBL-2727", parity: 2, gestational_age_weeks: 40 }
              as: PatientAccessCoordinator
              as_user_id: "access-coordinator-01"
              captures: { enc_id: $.data.id }
          trigger:
            - call: POST /bundle-activations
              payload: { encounter_id: "${enc_id}", bundle_type: "OBSTETRIC_HEMORRHAGE", activation_trigger: "QBL_THRESHOLD", quantitative_blood_loss_ml: 1000 }
              as: ObstetricianAttending
              as_user_id: "ob-attending-01"
              captures: { activation_id: $.data.id, activated_at: $.data.activated_at, act_status: $.data.status, stage_reached: $.data.highest_stage_reached, on_time: $.data.on_time_step_count }
            - call: GET /bundle-activations/${activation_id}/checklist-items
              payload: {}
              as: ObstetricianAttending
              as_user_id: "ob-attending-01"
              captures:
                code_1: $.data[0].step_code
                due_1: $.data[0].due_at_activation_anchored
                seq_due_1: $.data[0].due_at_sequence_anchored
                code_2: $.data[1].step_code
                due_2: $.data[1].due_at_activation_anchored
                code_3: $.data[2].step_code
                due_3: $.data[2].due_at_activation_anchored
                code_4: $.data[3].step_code
                due_4: $.data[3].due_at_activation_anchored
                mins_4: $.data[3].required_within_minutes
                gate_4: $.data[3].stage_gate
                status_4: $.data[3].status
                seq_due_4: $.data[3].due_at_sequence_anchored
          assert:
            - "HTTP 201 on the activation, HTTP 200 on the checklist listing"
            - "activated_at == \"2026-08-01T06:00:00Z\""
            - "act_status == \"ACTIVATED\""
            - "stage_reached == 0"
            - "on_time == 0"
            - "SafetyBundleActivation.${activation_id}.late_step_count == 0"
            - "SafetyBundleActivation.${activation_id}.missed_step_count == 0"
            - "SafetyBundleActivation.${activation_id}.timeliness_score == null"
            - "the listing returns exactly 4 items, ordered step_sequence ASC"
            - "code_1 == \"QBL_MEASURE\" and due_1 == \"2026-08-01T06:10:00Z\""
            - "code_2 == \"UTEROTONIC_GIVEN\" and due_2 == \"2026-08-01T06:25:00Z\""
            - "code_3 == \"TYPE_AND_SCREEN\" and due_3 == \"2026-08-01T06:45:00Z\""
            - "code_4 == \"MTP_ACTIVATED\" and due_4 == \"2026-08-01T06:55:00Z\""
            - "mins_4 == 10"
            - "gate_4 == 3"
            - "status_4 == \"PENDING\""
            - "seq_due_1 == \"2026-08-01T06:10:00Z\""
            - "seq_due_4 == null"
            - "every minted item has status PENDING, completed_at null and performed_by_staff_id null"
            - "stage_gate values are 1, 1, 2, 3 and required_within_minutes values are 10, 15, 20, 10 in step_sequence order"

      - name: an_idle_sweep_stamps_the_sweep_time_and_touches_nothing_that_is_not_yet_due
