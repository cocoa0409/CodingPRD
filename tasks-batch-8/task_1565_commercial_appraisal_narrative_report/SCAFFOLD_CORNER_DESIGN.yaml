        distinguishing_aspect: "building_sf == 100000 crosses into HIGH (>=), 99999 stays STANDARD; minimum turnarounds 25 vs 15."
        test_recipe:
          setup: ["client and two appraisers exist"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Apex Bank", client_type: "LENDER" }
              as: EngagementManager
              captures: { cl_id: $.data.id }
            - call: "POST /appraisers"
              payload: { full_name: "Ann Author", designation: "CERTIFIED_GENERAL" }
              as: EngagementManager
              captures: { aa_id: $.data.id }
            - call: "POST /appraisers"
              payload: { full_name: "Rob Reviewer", designation: "CERTIFIED_GENERAL" }
              as: EngagementManager
              captures: { rr_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${cl_id}", author_appraiser_id: "${aa_id}", reviewer_appraiser_id: "${rr_id}", property_address: "1 Big Box", property_type: "OFFICE", building_sf: 100000, intended_use: "FINANCING", intended_users: ["Apex Bank"], requested_turnaround_days: 45, planned_approach_count: 1 }
              as: EngagementManager
              captures: { eng_hi: $.data.id, tier_hi: $.data.complexity_tier, min_hi: $.data.minimum_turnaround_days }
            - call: "POST /engagements"
              payload: { client_id: "${cl_id}", author_appraiser_id: "${aa_id}", reviewer_appraiser_id: "${rr_id}", property_address: "2 Mid Ave", property_type: "OFFICE", building_sf: 99999, intended_use: "FINANCING", intended_users: ["Apex Bank"], requested_turnaround_days: 30, planned_approach_count: 1 }
              as: EngagementManager
              captures: { eng_md: $.data.id, tier_md: $.data.complexity_tier, min_md: $.data.minimum_turnaround_days }
          trigger:
            - call: "GET /engagements/${eng_hi}"
              as: EngagementManager
            - call: "GET /engagements/${eng_md}"
              as: EngagementManager
          assert:
            - "Engagement.${eng_hi}.complexity_tier == HIGH and minimum_turnaround_days == 25"
            - "Engagement.${eng_md}.complexity_tier == STANDARD and minimum_turnaround_days == 15"

