              captures: { svc_b_total: $.meta.total_count }
          assert:
            - "${err_duplicate} == ERR_ASSESSMENT_YEAR_DUPLICATE with HTTP 409"
            - "the 2027 row, the second-program row and the second-service row are all created with HTTP 201"
            - "${svc_a_total} == 3 and ${svc_b_total} == 1"
            - "${asmt_4_preparer} == assessor-5 (preparer_user_id is stamped from X-User-ID, not from the service)"
            - "OnlineService.${svc_a}.safe_harbor_status == ASSESSMENT_DUE and OnlineService.${svc_b}.safe_harbor_status == ASSESSMENT_DUE (enrolment without certification)"

      - name: open_findings_outrank_segregation_of_duties_on_certification
        claim_type: priority_ordering
        grounds:
          - validations[priority=116]
          - validations[priority=118]
          - state_machines.SafeHarborAssessment.SUBMITTED_to_CERTIFIED
          - errors[ERR_OPEN_FINDINGS_PRESENT]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: "One certification attempt violates two rules at once — three open findings and a certifier whose X-User-ID equals preparer_user_id — and priority 116 wins, so the response is ERR_OPEN_FINDINGS_PRESENT (409) and NOT ERR_SEGREGATION_OF_DUTIES (403); only after remediation drives findings to 0 does the segregation rule surface, and it is defeated only by a genuinely different user."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one service and a regulator-approved program requiring annual assessment (validity 365, grace 30)."
            - "Assessment prepared by X-User-ID dual-1 and SUBMITTED with findings_open_count 3."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /online-services"
              payload: { name: "Dual Control Kids", operator_organization: "Dual Media", service_category: "GAME", subject_matter_code: "FAMILY_MIXED" }
              as: ComplianceOfficer
              captures: { svc_id: $.data.id }
            - call: "POST /safe-harbor-programs"
              payload: { program_name: "Dual Control Seal", regulator_approved: true, annual_assessment_required: true, assessment_validity_days: 365, assessment_grace_days: 30 }
              as: ComplianceOfficer
              captures: { prog_id: $.data.id }
            - call: "POST /safe-harbor-assessments"
              payload: { service_id: "${svc_id}", program_id: "${prog_id}", assessment_year: 2026 }
              as: SafeHarborAssessor
              as_user_id: "dual-1"
              captures: { asmt_id: $.data.id, preparer: $.data.preparer_user_id }
            - call: "POST /safe-harbor-assessments/${asmt_id}/status"
              payload: { to_status: "SUBMITTED", findings_open_count: 3 }
              as: SafeHarborAssessor
              as_user_id: "dual-1"
              captures: { findings_before: $.data.findings_open_count }
          trigger:
            - call: "POST /safe-harbor-assessments/${asmt_id}/certify"
              payload: {}
              as: SafeHarborCertifier
              as_user_id: "dual-1"
              captures: { err_both_violated: $.data.error_id }
            - call: "POST /safe-harbor-assessments/${asmt_id}/status"
              payload: { to_status: "REMEDIATION_REQUIRED", remediation_note: "three findings must close" }
              as: SafeHarborCertifier
              as_user_id: "certifier-6"
              captures: { round: $.data.remediation_round }
            - call: "POST /safe-harbor-assessments/${asmt_id}/status"
              payload: { to_status: "SUBMITTED", findings_open_count: 0 }
              as: SafeHarborAssessor
              as_user_id: "dual-1"
              captures: { findings_after: $.data.findings_open_count }
            - call: "POST /safe-harbor-assessments/${asmt_id}/certify"
              payload: {}
              as: SafeHarborCertifier
              as_user_id: "dual-1"
              captures: { err_segregation: $.data.error_id }
            - call: "POST /safe-harbor-assessments/${asmt_id}/certify"
              payload: {}
              as: SafeHarborCertifier
              as_user_id: "certifier-6"
              captures: { certified_status: $.data.status, certifier: $.data.certifier_user_id, certified_at: $.data.certified_at, expires_at: $.data.expires_at }
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { sh_status: $.data.safe_harbor_status, sh_expiry: $.data.safe_harbor_expires_at, posture: $.data.compliance_posture }
          assert:
            - "${preparer} == dual-1 and ${findings_before} == 3"
            - "${err_both_violated} == ERR_OPEN_FINDINGS_PRESENT with HTTP 409 — priority 116 is evaluated before priority 118, so the 403 never appears here"
            - "${round} == 1 and ${findings_after} == 0"
            - "${err_segregation} == ERR_SEGREGATION_OF_DUTIES with HTTP 403 once the findings clause is satisfied"
            - "${certified_status} == CERTIFIED, ${certifier} == certifier-6, ${certified_at} == 2026-08-01T00:00:00Z, ${expires_at} == 2027-08-01T00:00:00Z"
            - "${sh_status} == CERTIFIED, ${sh_expiry} == 2027-08-01T00:00:00Z, ${posture} == OPEN"

      - name: valid_collection_passes_every_gate_in_the_ladder
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=110]
          - validations[priority=120]
        excluded_because:
          difficulty_instance: compensating_invariant / live_element_count_returns_to_zero_while_lifetime_count_only_grows
          rationale: "The fully-satisfied collection path — determination, active neutral screen, delivered notice, granted consent at sufficient tier, whitelisted element, effective schedule — is exercised end-to-end as the setup of the named §1.8 instance, which then asserts the resulting counters."
      - name: consent_state_gate_outranks_the_minimization_gate
        claim_type: priority_ordering
        grounds:
          - validations[priority=70]
          - validations[priority=110]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / consent_state_gate_p70_beats_minimization_p110
          rationale: "The p70-over-p110 conflict on a single collection call that violates both is asserted by the named §1.8 instance."
      - name: integration_safety_gate_outranks_the_disclosure_reference_check
        claim_type: priority_ordering
        grounds:
          - validations[priority=95]
          - validations[priority=105]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / integration_safety_gate_p95_beats_disclosure_reference_p105
          rationale: "The p95-over-p105 conflict on a single integration approval that violates both is asserted by the named §1.8 instance."
      - name: retention_overlap_check_outranks_the_disposal_method_check
        claim_type: priority_ordering
        grounds:
          - validations[priority=102]
          - validations[priority=112]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / retention_overlap_p102_beats_disposal_method_p112
          rationale: "The p102-over-p112 conflict on a single schedule creation that violates both is asserted by the named §1.8 instance."
      - name: determination_requires_at_least_one_evidence_row
        claim_type: violation_to_error
        grounds:
          - validations[priority=130]
          - errors[ERR_INSUFFICIENT_EVIDENCE]
        excluded_because:
          difficulty_instance: boundary_precision_check / determination_evidence_sufficiency_and_share_threshold_boundaries
          rationale: "ERR_INSUFFICIENT_EVIDENCE on an evidence-free service, and the fact that an unverified PANEL row does not satisfy the gate, are asserted by the named §1.8 instance."

  # ===========================================================================
  - section: endpoints
    instances:
      - name: compliance_run_reports_inline_counters_and_advances_its_own_sequence
        claim_type: computed_read
        grounds:
          - endpoints["POST /compliance-runs"]
          - entities.OnlineService.fields.compliance_run_sequence
          - calculations.compliance_posture
        distinguishing_aspect: "The run endpoint returns an inline counter object rather than an entity, and it advances OnlineService.compliance_run_sequence on every call even when all four phases find nothing to do — so two consecutive no-op runs report run_sequence 1 then 2 with every count at zero, and the service's version still increments per run."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one freshly registered service with no consents, records, integrations or assessments."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /online-services"
              payload: { name: "Empty Run Kids", operator_organization: "Run Media", service_category: "GENERAL_INTEREST_PORTAL", subject_matter_code: "FAMILY_MIXED" }
              as: ComplianceOfficer
              captures: { svc_id: $.data.id, seq_initial: $.data.compliance_run_sequence, ver_initial: $.data.version }
          trigger:
            - call: "POST /compliance-runs"
              payload: { service_id: "${svc_id}" }
              as: ComplianceOfficer
              captures: { echo_svc: $.data.service_id, run_1: $.data.run_sequence, expired_1: $.data.expired_consent_count, sched_1: $.data.scheduled_count, disp_1: $.data.disposed_count, live_1: $.data.live_child_data_element_count_after, posture_1: $.data.compliance_posture_after }
            - call: "POST /compliance-runs"
              payload: { service_id: "${svc_id}" }
              as: PrivacyEngineer
              captures: { run_2: $.data.run_sequence, expired_2: $.data.expired_consent_count, sched_2: $.data.scheduled_count, disp_2: $.data.disposed_count }
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { seq_after: $.data.compliance_run_sequence, ver_after: $.data.version, lifetime: $.data.lifetime_collected_element_count }
          assert:
            - "${seq_initial} == 0 and ${ver_initial} == 1"
            - "${echo_svc} == ${svc_id}, ${run_1} == 1, ${expired_1} == 0, ${sched_1} == 0, ${disp_1} == 0, ${live_1} == 0, ${posture_1} == OPEN"
            - "${run_2} == 2 with ${expired_2} == 0, ${sched_2} == 0, ${disp_2} == 0 (the sequence advances even on an idle run, and both roles may run it)"
            - "${seq_after} == 2 and ${ver_after} == 3 (one increment per run on top of version 1 at creation)"
            - "${lifetime} == 0 (an idle run never fabricates records)"

      - name: clock_endpoint_reports_the_new_instant_and_the_declared_startup_default
        claim_type: action_endpoint
        grounds:
          - endpoints["POST /_clock/set_current_utc"]
          - entities.OnlineService.fields.created_at
        distinguishing_aspect: "Before any clock call in this test the server is already at the declared startup default 2026-08-01T00:00:00Z — a service created first carries exactly that created_at, never real wall-clock time — and after the clock moves to 2026-09-15T12:30:00Z the endpoint echoes the new instant in its inline { current_utc } object while a newly created service is stamped with it."
        test_recipe:
          setup:
            - "NO clock call is made before the trigger: the run must rely on the declared startup default of 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /online-services"
