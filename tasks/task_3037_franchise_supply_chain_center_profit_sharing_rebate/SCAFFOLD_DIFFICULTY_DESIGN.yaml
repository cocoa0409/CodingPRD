              as: SupplyChainAdmin
            - call: "POST /supply-centers/${center_id}/routes"
              payload: { route_code: "R1", day_of_week: "MONDAY", truck_capacity_units: 10000, assigned_store_ids: ["${store_x}", "${store_y}"] }
              as: RouteCoordinator
