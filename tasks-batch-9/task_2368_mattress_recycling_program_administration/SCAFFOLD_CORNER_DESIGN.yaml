            - "GET /haulers?state_program_id=${prog_wa_id} returns data.meta.total_count == 0"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: fee_rate_schedule_initial_state_is_proposed
        claim_type: Initial State
        grounds:
          - state_machines.FeeRateSchedule.initial_state
          - endpoints["POST /fee-rate-schedules"]
        distinguishing_aspect: "A newly proposed schedule lands in PROPOSED with approved_by_user_id null and the band snapshot already frozen, never in APPROVED or ACTIVE."
        test_recipe:
          setup:
            - "CA program on the startup clock; recommended_rate_cents 1075, band [860, 1290]."
          setup_api_calls:
            - call: "POST /state-programs"
              payload: { state_code: "CA", program_name: "California Mattress Recycling Program", forecast_annual_cost_cents: 60000000, forecast_annual_units: 60000, forecast_other_revenue_cents: 3000000, reserve_target_months: 3, reserve_opening_cents: 5000000, site_credit_cents_per_unit: 305, volume_bonus_threshold_units: 500, delinquency_alert_threshold: 1 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { prog_ca_id: $.data.id, v1: $.data.version }
          trigger:
            - call: "POST /fee-rate-schedules"
              payload: { state_program_id: "${prog_ca_id}", unit_class: "MATTRESS", fee_cents_per_unit: 1100, effective_from: "2026-01-01T00:00:00Z", expected_state_program_version: "${v1}" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { sch_id: $.data.id }
          assert:
            - "Response: HTTP 201"
            - "FeeRateSchedule.${sch_id}.status == PROPOSED"
            - "FeeRateSchedule.${sch_id}.proposed_by_user_id == admin-1 and approved_by_user_id == null"
            - "FeeRateSchedule.${sch_id}.recommended_rate_cents_at_proposal == 1075, band_low_cents == 860, band_high_cents == 1290"
            - "StateProgram.${prog_ca_id}.version == 2"

      - name: fee_rate_schedule_approve_by_second_administrator_records_approver
        claim_type: Valid Transition
        grounds:
          - state_machines.FeeRateSchedule.transitions[PROPOSED -> APPROVED]
          - endpoints["POST /fee-rate-schedules/{id}/approve"]
        distinguishing_aspect: "approve by a different administrator user moves PROPOSED -> APPROVED and stamps approved_by_user_id with the acting X-User-ID, leaving effective_from untouched."
        test_recipe:
          setup:
            - "CA program with one PROPOSED MATTRESS 1100c schedule effective 2026-01-01, proposed by admin-1."
          setup_api_calls:
            - call: "POST /state-programs"
              payload: { state_code: "CA", program_name: "California Mattress Recycling Program", forecast_annual_cost_cents: 60000000, forecast_annual_units: 60000, forecast_other_revenue_cents: 3000000, reserve_target_months: 3, reserve_opening_cents: 5000000, site_credit_cents_per_unit: 305, volume_bonus_threshold_units: 500, delinquency_alert_threshold: 1 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { prog_ca_id: $.data.id, v1: $.data.version }
            - call: "POST /fee-rate-schedules"
              payload: { state_program_id: "${prog_ca_id}", unit_class: "MATTRESS", fee_cents_per_unit: 1100, effective_from: "2026-01-01T00:00:00Z", expected_state_program_version: "${v1}" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { sch_id: $.data.id }
          trigger:
            - call: "POST /fee-rate-schedules/${sch_id}/approve"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-2"
          assert:
            - "Response: HTTP 200"
            - "FeeRateSchedule.${sch_id}.status == APPROVED"
            - "FeeRateSchedule.${sch_id}.approved_by_user_id == admin-2 and proposed_by_user_id == admin-1"
            - "FeeRateSchedule.${sch_id}.effective_from == 2026-01-01T00:00:00Z and effective_to == null"

      - name: activate_before_effective_from_precondition_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.FeeRateSchedule.transitions[APPROVED -> ACTIVE].preconditions
          - validations[priority=69]
          - errors[ERR_RATE_NOT_YET_EFFECTIVE]
        distinguishing_aspect: "activate is refused while current_utc (2026-08-01) is before effective_from (2026-09-01) and succeeds unchanged once the clock is advanced to exactly effective_from."
        test_recipe:
          setup:
            - "CA program with an APPROVED MATTRESS 1100c schedule whose effective_from is 2026-09-01T00:00:00Z, one month after the startup clock."
          setup_api_calls:
            - call: "POST /state-programs"
              payload: { state_code: "CA", program_name: "California Mattress Recycling Program", forecast_annual_cost_cents: 60000000, forecast_annual_units: 60000, forecast_other_revenue_cents: 3000000, reserve_target_months: 3, reserve_opening_cents: 5000000, site_credit_cents_per_unit: 305, volume_bonus_threshold_units: 500, delinquency_alert_threshold: 1 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { prog_ca_id: $.data.id, v1: $.data.version }
            - call: "POST /fee-rate-schedules"
              payload: { state_program_id: "${prog_ca_id}", unit_class: "MATTRESS", fee_cents_per_unit: 1100, effective_from: "2026-09-01T00:00:00Z", expected_state_program_version: "${v1}" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { sch_id: $.data.id }
            - call: "POST /fee-rate-schedules/${sch_id}/approve"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-2"
          trigger:
            - call: "POST /fee-rate-schedules/${sch_id}/activate"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
            - call: "POST /fee-rate-schedules/${sch_id}/activate"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
          assert:
            - "First activate: HTTP 409 with data.error_id == ERR_RATE_NOT_YET_EFFECTIVE; FeeRateSchedule.${sch_id}.status stays APPROVED"
            - "Second activate (clock == effective_from, inclusive boundary): HTTP 200 and FeeRateSchedule.${sch_id}.status == ACTIVE"

      - name: activation_supersedes_predecessor_and_supersession_is_terminal
        claim_type: Side Effect Execution
        grounds:
          - state_machines.FeeRateSchedule.transitions[APPROVED -> ACTIVE].side_effects
          - state_machines.FeeRateSchedule.transitions[ACTIVE -> SUPERSEDED]
          - state_machines.FeeRateSchedule.terminal_states
          - validations[priority=44]
        distinguishing_aspect: "Activating the successor flips exactly the one prior ACTIVE row of the same (program, unit_class) to SUPERSEDED, and that terminal row can no longer be approved."
        test_recipe:
          setup:
            - "CA program with MATTRESS rate A 1000c on [2026-01-01, 2026-09-01) ACTIVE, and MATTRESS rate B 1100c from 2026-09-01 APPROVED."
          setup_api_calls:
            - call: "POST /state-programs"
              payload: { state_code: "CA", program_name: "California Mattress Recycling Program", forecast_annual_cost_cents: 60000000, forecast_annual_units: 60000, forecast_other_revenue_cents: 3000000, reserve_target_months: 3, reserve_opening_cents: 5000000, site_credit_cents_per_unit: 305, volume_bonus_threshold_units: 500, delinquency_alert_threshold: 1 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { prog_ca_id: $.data.id, v1: $.data.version }
            - call: "POST /fee-rate-schedules"
              payload: { state_program_id: "${prog_ca_id}", unit_class: "MATTRESS", fee_cents_per_unit: 1000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", expected_state_program_version: "${v1}" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { sch_a_id: $.data.id }
            - call: "POST /fee-rate-schedules/${sch_a_id}/approve"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-2"
            - call: "POST /fee-rate-schedules/${sch_a_id}/activate"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
            - call: "GET /state-programs/${prog_ca_id}"
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { v3: $.data.version }
            - call: "POST /fee-rate-schedules"
              payload: { state_program_id: "${prog_ca_id}", unit_class: "MATTRESS", fee_cents_per_unit: 1100, effective_from: "2026-09-01T00:00:00Z", expected_state_program_version: "${v3}" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { sch_b_id: $.data.id }
            - call: "POST /fee-rate-schedules/${sch_b_id}/approve"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-2"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
          trigger:
            - call: "POST /fee-rate-schedules/${sch_b_id}/activate"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
            - call: "POST /fee-rate-schedules/${sch_a_id}/approve"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-2"
          assert:
            - "activate response: HTTP 200 and FeeRateSchedule.${sch_b_id}.status == ACTIVE"
            - "FeeRateSchedule.${sch_a_id}.status == SUPERSEDED with effective_to == 2026-09-01T00:00:00Z"
            - "GET /fee-rate-schedules?state_program_id=${prog_ca_id}&unit_class=MATTRESS&status=ACTIVE returns data.meta.total_count == 1"
            - "re-approve of the superseded row: HTTP 409 with data.error_id == ERR_RATE_SCHEDULE_NOT_APPROVABLE (SUPERSEDED is terminal)"

      - name: second_approve_of_same_schedule_is_not_idempotent_and_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.FeeRateSchedule.transitions[PROPOSED -> APPROVED]
          - validations[priority=44]
          - errors[ERR_RATE_SCHEDULE_NOT_APPROVABLE]
        distinguishing_aspect: "Re-approving an APPROVED schedule returns 409 rather than a second 200, and approved_by_user_id keeps the first approver rather than being overwritten by the second caller."
        test_recipe:
          setup:
            - "CA program with a PROPOSED MATTRESS 1100c schedule effective 2026-01-01."
          setup_api_calls:
            - call: "POST /state-programs"
              payload: { state_code: "CA", program_name: "California Mattress Recycling Program", forecast_annual_cost_cents: 60000000, forecast_annual_units: 60000, forecast_other_revenue_cents: 3000000, reserve_target_months: 3, reserve_opening_cents: 5000000, site_credit_cents_per_unit: 305, volume_bonus_threshold_units: 500, delinquency_alert_threshold: 1 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { prog_ca_id: $.data.id, v1: $.data.version }
            - call: "POST /fee-rate-schedules"
              payload: { state_program_id: "${prog_ca_id}", unit_class: "MATTRESS", fee_cents_per_unit: 1100, effective_from: "2026-01-01T00:00:00Z", expected_state_program_version: "${v1}" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { sch_id: $.data.id }
            - call: "POST /fee-rate-schedules/${sch_id}/approve"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-2"
          trigger:
            - call: "POST /fee-rate-schedules/${sch_id}/approve"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-3"
          assert:
            - "Response: HTTP 409 with data.error_id == ERR_RATE_SCHEDULE_NOT_APPROVABLE"
            - "FeeRateSchedule.${sch_id}.status == APPROVED and approved_by_user_id == admin-2"

      - name: volume_report_second_accept_rejected_and_credit_not_paid_twice
        claim_type: Idempotency
        grounds:
          - state_machines.VolumeReport.transitions[SUBMITTED -> ACCEPTED]
          - validations[priority=52]
          - errors[ERR_VOLUME_REPORT_NOT_SUBMITTED]
          - calculations.site_volume_credit
        distinguishing_aspect: "The second accept of the same report is a 409 and neither the site credit ledger nor the site's on-hand units move a second time (163328c and 510 units stay put)."
        test_recipe:
          setup:
            - "CHAIN-S with a SUBMITTED 2026-08 report of 320 + 190 units."
          setup_api_calls:
            - call: "POST /state-programs"
              payload: { state_code: "WA", program_name: "Washington Mattress Stewardship Program", forecast_annual_cost_cents: 60000000, forecast_annual_units: 60000, forecast_other_revenue_cents: 3000000, reserve_target_months: 3, reserve_opening_cents: 5000000, site_credit_cents_per_unit: 305, volume_bonus_threshold_units: 500, delinquency_alert_threshold: 1 }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { prog_wa_id: $.data.id }
