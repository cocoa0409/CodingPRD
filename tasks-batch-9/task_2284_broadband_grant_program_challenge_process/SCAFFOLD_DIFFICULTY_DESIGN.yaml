            - call: "POST /broadband/locations"
              payload: { program_id: "${p_id}", address_id: "ADDR-0103", reported_down_mbps: 10, reported_up_mbps: 1, reported_latency_ms: 50, reported_technology: "DSL", reporting_provider_user_id: "prov-2" }
              as: EligibilityAnalyst
              as_user_id: "analyst-1"
