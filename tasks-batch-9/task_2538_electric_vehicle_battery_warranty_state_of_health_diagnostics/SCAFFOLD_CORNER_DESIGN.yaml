      - name: uniqueness_guards_reject_duplicate_vin_serial_and_campaign_code
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - validations[priority=12]
          - validations[priority=13]
        distinguishing_aspect: |
          All three natural keys are probed in one instance and each must answer with its OWN 409
          code rather than a generic ERR_INVALID_REQUEST, and the duplicate must not create a second
          row - which is proved by the listing counts, not just by the status code.
        test_recipe:
          setup:
