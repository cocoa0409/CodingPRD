# =============================================================================
# §1.8 Scaffold Difficulty Design — Bird & Aviary Supply (Expert)
# 9 rule_ids x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: boarding_provisional_vs_final_cost
        grounds:
          - calculations.boarding_cost
          - entities.BoardingReservation.fields.provisional_cost_cents
          - entities.BoardingReservation.fields.final_cost_cents
          - state_machines.BoardingReservation.CHECKED_IN_to_CHECKED_OUT
        distinguishing_aspect: |
          On BoardingReservation cost accounting the provisional variant (planned window, 3 nights x 5000 = 15000)
          diverges from the final variant (actual checkout 5 nights x 5000 + 2000 late fee = 27000).
        test_recipe:
          setup:
            - "Customer with 30000 wallet credit; BOARDING cage capacity 2, nightly_rate 5000; clock at 2026-07-01."
            - "Reservation planned 2026-07-02 -> 2026-07-05 (3 nights), checked in on 07-02, checked out late on 2026-07-06T09:00Z."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ada Board", email: "ada@x.com" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/wallet/adjustments"
              payload: { amount_cents: 30000 }
              as: StoreManager
            - call: "POST /cage-units"
              payload: { label: "B1", cage_class: "BOARDING", capacity: 2, nightly_rate_cents: 5000 }
              as: StoreManager
              captures: { cage_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T12:00:00Z" }
              as: StoreManager
            - call: "POST /boarding-reservations"
              payload: { customer_id: "${cust_id}", cage_id: "${cage_id}", planned_check_in: "2026-07-02T00:00:00Z", planned_check_out: "2026-07-05T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { res_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:00Z" }
              as: StoreManager
            - call: "POST /boarding-reservations/${res_id}/check-in"
              payload: {}
              as: AviaryStaff
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-06T09:00:00Z" }
              as: StoreManager
            - call: "POST /boarding-reservations/${res_id}/check-out"
              payload: {}
              as: AviaryStaff
              captures: { final_cost: $.data.final_cost_cents }
          assert:
            - "BoardingReservation.${res_id}.provisional_cost_cents == 15000"
            - "BoardingReservation.${res_id}.final_cost_cents == 27000"
            - "Customer.${cust_id}.wallet_credit_cents == 3000"

      - name: bird_provisional_vs_final_risk
        grounds:
          - calculations.bird_risk_score
          - entities.Bird.fields.provisional_risk_score
          - entities.Bird.fields.final_risk_score
          - state_machines.QuarantineRecord.UNDER_TEST_to_CLEARED
        distinguishing_aspect: |
          On Bird risk scoring the provisional variant (species II base 25 + import 20 = 45) diverges from the
          final variant (base 25 + 1 failed test x15 + 0 retest = 40; import ignored) — a different entity domain than boarding cost.
        test_recipe:
          setup:
            - "Species cites_appendix II; imported Bird; HOUSING cage capacity 2; clock 2026-07-01."
            - "Quarantine opened 07-01 (min_clear_at 07-15), one FAIL recorded, cleared on 2026-07-16."
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "African Grey", scientific_name: "Psittacus erithacus", cites_appendix: "II" }
              as: ComplianceOfficer
              captures: { sp_id: $.data.id }
            - call: "POST /cage-units"
              payload: { label: "H1", cage_class: "HOUSING", capacity: 2 }
              as: StoreManager
              captures: { cage_id: $.data.id }
            - call: "POST /birds"
              payload: { species_id: "${sp_id}", band_code: "B-001", imported: true, list_price_cents: 50000 }
              as: AviaryStaff
              captures: { bird_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /birds/${bird_id}/start-quarantine"
              payload: { cage_id: "${cage_id}" }
              as: AviaryStaff
              captures: { prov_risk: $.data.provisional_risk_score }
            - call: "GET /birds/${bird_id}/quarantine-records"
              payload: {}
              as: AviaryStaff
              captures: { qr_id: "$.data[0].id" }
            - call: "POST /quarantine-records/${qr_id}/start-test"
              payload: {}
              as: AviaryStaff
            - call: "POST /quarantine-records/${qr_id}/record-test-result"
              payload: { result: "FAIL" }
              as: AviaryStaff
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-16T00:00:00Z" }
              as: StoreManager
          trigger:
            - call: "POST /quarantine-records/${qr_id}/clear"
              payload: {}
              as: AviaryStaff
          assert:
            - "Bird.${bird_id}.provisional_risk_score == 45"
            - "Bird.${bird_id}.final_risk_score == 40"
            - "Bird.${bird_id}.status == CLEARED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: subscription_charge_multi_input_mode_a
        grounds:
          - calculations.subscription_monthly_charge
          - entities.FeedSubscription.fields.monthly_charge_cents
          - entities.Customer.fields.club_tier
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — tier base selection (PREMIUM=7000) + per-bird linear
          (2x1500) + conditional fresh surcharge (2500) then club-tier discount (GOLD 20%): round((7000+3000+2500)*0.8)=10000.
        test_recipe:
          setup:
            - "GOLD-tier Customer with 10000 wallet; FRESH inventory with 10 on hand."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Gil Gold", email: "gil@x.com" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/club-membership"
              payload: { club_tier: "GOLD" }
              as: StoreManager
            - call: "POST /customers/${cust_id}/wallet/adjustments"
              payload: { amount_cents: 10000 }
              as: StoreManager
            - call: "POST /inventory-items"
              payload: { sku: "FRESH-1", feed_kind: "FRESH", quantity_on_hand: 10 }
              as: StoreManager
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /feed-subscriptions"
              payload: { customer_id: "${cust_id}", tier: "PREMIUM", bird_count: 2, fresh_feed: true, fresh_item_id: "${inv_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id, charge: $.data.monthly_charge_cents }
          assert:
            - "FeedSubscription.${sub_id}.monthly_charge_cents == 10000"
            - "FeedSubscription.${sub_id}.created_charge_cents == 10000"
            - "Customer.${cust_id}.wallet_credit_cents == 0"

      - name: special_order_invoice_perline_rounding_mode_b
        grounds:
          - calculations.special_order_invoice_total
          - entities.SpecialOrder.fields.line_items
          - entities.SpecialOrder.fields.invoice_total_cents
        distinguishing_aspect: |
          Mode (b): nested rounding whose order is pinned — round each line's tax to cents THEN sum. Two lines of
          subtotal 740 at 0.075 give 55.5->56 each => 1592, whereas sum-then-round (1480x0.075=111) => 1591.
        test_recipe:
          setup:
            - "Customer with wallet; DRY build inventory with 10 on hand."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Rin Round", email: "rin@x.com" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/wallet/adjustments"
              payload: { amount_cents: 5000 }
              as: StoreManager
            - call: "POST /inventory-items"
              payload: { sku: "KIT-1", feed_kind: "DRY", quantity_on_hand: 10 }
              as: StoreManager
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /special-orders"
              payload: { customer_id: "${cust_id}", cage_item_id: "${inv_id}", build_qty: 1, line_items: [ { unit_price_cents: 740, quantity: 1, tax_rate: 0.075 }, { unit_price_cents: 740, quantity: 1, tax_rate: 0.075 } ] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id, total: $.data.invoice_total_cents }
          assert:
            - "SpecialOrder.${ord_id}.invoice_total_cents == 1592"
            - "Round-per-line-then-sum (1592) is asserted, NOT sum-then-round (1591)."

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: quarantine_retest_cycle
        grounds:
          - state_machines.QuarantineRecord.UNDER_TEST_to_OPEN
          - entities.QuarantineRecord.fields.retest_count
          - entities.QuarantineRecord.fields.status
        distinguishing_aspect: |
          QuarantineRecord is cyclic: OPEN->UNDER_TEST->OPEN repeated; after two RETEST loops retest_count==2 and
          status is back to OPEN — a non-linear (cyclic) shape on the QuarantineRecord entity.
        test_recipe:
          setup:
            - "Bird IN_QUARANTINE with an OPEN QuarantineRecord; clock 2026-07-01."
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Budgie", scientific_name: "Melopsittacus undulatus", cites_appendix: "NONE" }
              as: ComplianceOfficer
              captures: { sp_id: $.data.id }
            - call: "POST /cage-units"
              payload: { label: "H2", cage_class: "HOUSING", capacity: 1 }
              as: StoreManager
              captures: { cage_id: $.data.id }
            - call: "POST /birds"
              payload: { species_id: "${sp_id}", band_code: "B-002", list_price_cents: 8000 }
              as: AviaryStaff
              captures: { bird_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /birds/${bird_id}/start-quarantine"
              payload: { cage_id: "${cage_id}" }
              as: AviaryStaff
            - call: "GET /birds/${bird_id}/quarantine-records"
              payload: {}
              as: AviaryStaff
              captures: { qr_id: "$.data[0].id" }
          trigger:
            - call: "POST /quarantine-records/${qr_id}/start-test"
              payload: {}
              as: AviaryStaff
            - call: "POST /quarantine-records/${qr_id}/record-test-result"
              payload: { result: "RETEST" }
              as: AviaryStaff
            - call: "POST /quarantine-records/${qr_id}/start-test"
              payload: {}
              as: AviaryStaff
            - call: "POST /quarantine-records/${qr_id}/record-test-result"
              payload: { result: "RETEST" }
              as: AviaryStaff
              captures: { rc: $.data.retest_count, st: $.data.status }
          assert:
            - "QuarantineRecord.${qr_id}.retest_count == 2"
            - "QuarantineRecord.${qr_id}.status == OPEN"

      - name: special_order_parallel_payment_build_axes
        grounds:
          - state_machines.SpecialOrder.UNPAID_to_PAID
          - state_machines.SpecialOrder.QUEUED_to_IN_BUILD
          - entities.SpecialOrder.fields.payment_status
          - entities.SpecialOrder.fields.build_status
        distinguishing_aspect: |
          SpecialOrder carries two independent state dimensions: paying advances payment_status UNPAID->PAID while
          build_status stays QUEUED, and start-build advances build_status independently — parallel axes on a different entity than QuarantineRecord.
        test_recipe:
          setup:
            - "Customer with 2000 wallet; DRY inventory 5 on hand; UNPAID/QUEUED SpecialOrder invoice_total 1000."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Pax Par", email: "pax@x.com" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/wallet/adjustments"
              payload: { amount_cents: 2000 }
              as: StoreManager
            - call: "POST /inventory-items"
              payload: { sku: "KIT-2", feed_kind: "DRY", quantity_on_hand: 5 }
              as: StoreManager
              captures: { inv_id: $.data.id }
            - call: "POST /special-orders"
              payload: { customer_id: "${cust_id}", cage_item_id: "${inv_id}", build_qty: 1, line_items: [ { unit_price_cents: 1000, quantity: 1, tax_rate: 0.0 } ] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /special-orders/${ord_id}/pay"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { pay_status: $.data.payment_status, build_after_pay: $.data.build_status }
            - call: "POST /special-orders/${ord_id}/start-build"
              payload: {}
              as: StoreManager
              captures: { build_status2: $.data.build_status }
          assert:
            - "After pay: SpecialOrder.${ord_id}.payment_status == PAID and build_status == QUEUED (build axis untouched)"
            - "After start-build: SpecialOrder.${ord_id}.build_status == IN_BUILD and payment_status == PAID (payment axis untouched)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: quarantine_fail_cascade_depth3
        grounds:
          - state_machines.QuarantineRecord.OPEN_to_FAILED
          - state_machines.Bird.IN_QUARANTINE_to_REJECTED
          - entities.CageUnit.fields.current_occupancy
          - entities.CageUnit.fields.status
        distinguishing_aspect: |
          Depth-3 chain from POST /quarantine-records/{id}/fail: (1) QuarantineRecord FAILED mutates Bird->REJECTED,
          (2) the Bird mutation releases its housing CageUnit occupancy (2->... -1), (3) the occupancy change itself flips CageUnit.status OCCUPIED->AVAILABLE.
        test_recipe:
          setup:
            - "Bird IN_QUARANTINE occupying a capacity-1 HOUSING cage (cage OCCUPIED, occupancy 1); clock 2026-07-01."
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Finch", scientific_name: "Taeniopygia guttata", cites_appendix: "NONE" }
              as: ComplianceOfficer
              captures: { sp_id: $.data.id }
            - call: "POST /cage-units"
              payload: { label: "H3", cage_class: "HOUSING", capacity: 1 }
              as: StoreManager
              captures: { cage_id: $.data.id }
            - call: "POST /birds"
              payload: { species_id: "${sp_id}", band_code: "B-003", list_price_cents: 6000 }
              as: AviaryStaff
              captures: { bird_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /birds/${bird_id}/start-quarantine"
              payload: { cage_id: "${cage_id}" }
              as: AviaryStaff
            - call: "GET /birds/${bird_id}/quarantine-records"
              payload: {}
              as: AviaryStaff
              captures: { qr_id: "$.data[0].id" }
          trigger:
            - call: "POST /quarantine-records/${qr_id}/fail"
              payload: {}
              as: AviaryStaff
              captures: { qr_status: $.data.status }
          assert:
            - "QuarantineRecord.${qr_id}.status == FAILED"
            - "Bird.${bird_id}.status == REJECTED"
            - "Bird.${bird_id}.housing_cage_id == null"
            - "CageUnit.${cage_id}.current_occupancy == 0"
            - "CageUnit.${cage_id}.status == AVAILABLE"

      - name: permit_revoke_cascade_depth2
        grounds:
          - state_machines.CitesPermit.APPROVED_to_REVOKED
          - state_machines.Bird.LISTED_to_SUSPENDED
          - entities.Species.fields.status
          - entities.Species.fields.listed_bird_count
        distinguishing_aspect: |
          Depth-2 chain from POST /cites-permits/{id}/revoke: (1) permit REVOKED mutates Species->RESTRICTED,
          (2) the Species mutation flips every LISTED Bird->SUSPENDED and decrements listed_bird_count — a different originating trigger than the quarantine-fail cascade.
        test_recipe:
          setup:
            - "Species II with an APPROVED non-expired permit; one Bird cleared and LISTED (listed_bird_count 1); clock advanced past quarantine hold."
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Macaw", scientific_name: "Ara macao", cites_appendix: "II" }
              as: ComplianceOfficer
              captures: { sp_id: $.data.id }
            - call: "POST /cites-permits"
              payload: { species_id: "${sp_id}", permit_number: "CITES-100", valid_until: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { perm_id: $.data.id }
            - call: "POST /cites-permits/${perm_id}/submit"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /cites-permits/${perm_id}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /cage-units"
              payload: { label: "H4", cage_class: "HOUSING", capacity: 1 }
              as: StoreManager
              captures: { cage_id: $.data.id }
            - call: "POST /birds"
              payload: { species_id: "${sp_id}", band_code: "B-004", list_price_cents: 90000 }
              as: AviaryStaff
              captures: { bird_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /birds/${bird_id}/start-quarantine"
              payload: { cage_id: "${cage_id}" }
              as: AviaryStaff
            - call: "GET /birds/${bird_id}/quarantine-records"
              payload: {}
              as: AviaryStaff
              captures: { qr_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-16T00:00:00Z" }
              as: StoreManager
            - call: "POST /quarantine-records/${qr_id}/clear"
              payload: {}
              as: AviaryStaff
            - call: "POST /birds/${bird_id}/list-for-sale"
              payload: {}
              as: AviaryStaff
          trigger:
            - call: "POST /cites-permits/${perm_id}/revoke"
              payload: {}
              as: ComplianceOfficer
              captures: { perm_status: $.data.status }
          assert:
            - "CitesPermit.${perm_id}.status == REVOKED"
            - "Species.${sp_id}.status == RESTRICTED"
            - "Bird.${bird_id}.status == SUSPENDED"
            - "Species.${sp_id}.listed_bird_count == 0"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: list_state_beats_species_referential
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - state_machines.Bird.CLEARED_to_LISTED
        distinguishing_aspect: |
          On POST /birds/{id}/list-for-sale a Bird in INTAKE (state violation, priority 6) whose Species is RESTRICTED
          (business_referential violation, priority 8) returns ERR_INVALID_STATE — state check wins over the referential check. Pair: state vs business_referential.
        test_recipe:
          setup:
            - "Species RESTRICTED (permit approved then revoked); a fresh Bird still in INTAKE (never quarantined)."
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Cockatoo", scientific_name: "Cacatua alba", cites_appendix: "II" }
              as: ComplianceOfficer
              captures: { sp_id: $.data.id }
            - call: "POST /cites-permits"
              payload: { species_id: "${sp_id}", permit_number: "CITES-200", valid_until: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { perm_id: $.data.id }
            - call: "POST /cites-permits/${perm_id}/submit"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /cites-permits/${perm_id}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /cites-permits/${perm_id}/revoke"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /birds"
              payload: { species_id: "${sp_id}", band_code: "B-005", list_price_cents: 70000 }
              as: AviaryStaff
              captures: { bird_id: $.data.id }
          trigger:
            - call: "POST /birds/${bird_id}/list-for-sale"
              payload: {}
              as: AviaryStaff
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_INVALID_STATE (priority 6 state beats priority 8 ERR_SPECIES_RESTRICTED)"
            - "Bird.${bird_id}.status == INTAKE (unchanged)"

      - name: subscription_inventory_beats_wallet_fiscal
        grounds:
          - validations[priority=13]
          - validations[priority=14]
          - calculations.subscription_monthly_charge
        distinguishing_aspect: |
          On POST /feed-subscriptions with fresh feed, a request that both exhausts FRESH inventory (business_constraint,
          priority 13) and lacks wallet funds (business_fiscal, priority 14) returns ERR_INSUFFICIENT_INVENTORY. Pair: business_constraint vs business_fiscal.
        test_recipe:
          setup:
            - "Customer with 0 wallet; FRESH inventory with only 1 on hand; subscription needs bird_count 2 and charge 12500."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Nel Broke", email: "nel@x.com" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { sku: "FRESH-2", feed_kind: "FRESH", quantity_on_hand: 1 }
              as: StoreManager
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /feed-subscriptions"
              payload: { customer_id: "${cust_id}", tier: "PREMIUM", bird_count: 2, fresh_feed: true, fresh_item_id: "${inv_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_INSUFFICIENT_INVENTORY (priority 13 beats priority 14 ERR_INSUFFICIENT_WALLET)"
            - "Customer.${cust_id}.wallet_credit_cents == 0 (no debit applied)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: quarantine_risk_at_threshold_60_rejects_clear
        grounds:
          - calculations.bird_risk_score
          - validations[priority=9]
          - entities.QuarantineRecord.fields.failed_test_count
          - entities.QuarantineRecord.fields.retest_count
        distinguishing_aspect: |
          final_risk_score of exactly 60 (species II 25 + 2 FAIL x15 + 1 RETEST x5) is rejected at POST /quarantine-records/{id}/clear
          with ERR_RISK_TOO_HIGH_TO_CLEAR because the boundary is >= 60 (not > 60). Metric: risk score at /clear.
        test_recipe:
          setup:
            - "Bird (species II) in quarantine with failed_test_count 2 and retest_count 1; clock past min_clear_at."
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Amazon", scientific_name: "Amazona aestiva", cites_appendix: "II" }
              as: ComplianceOfficer
              captures: { sp_id: $.data.id }
            - call: "POST /cage-units"
              payload: { label: "H5", cage_class: "HOUSING", capacity: 1 }
              as: StoreManager
              captures: { cage_id: $.data.id }
            - call: "POST /birds"
              payload: { species_id: "${sp_id}", band_code: "B-006", list_price_cents: 40000 }
              as: AviaryStaff
              captures: { bird_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /birds/${bird_id}/start-quarantine"
              payload: { cage_id: "${cage_id}" }
              as: AviaryStaff
            - call: "GET /birds/${bird_id}/quarantine-records"
              payload: {}
              as: AviaryStaff
              captures: { qr_id: "$.data[0].id" }
            - call: "POST /quarantine-records/${qr_id}/start-test"
              payload: {}
              as: AviaryStaff
            - call: "POST /quarantine-records/${qr_id}/record-test-result"
              payload: { result: "FAIL" }
              as: AviaryStaff
            - call: "POST /quarantine-records/${qr_id}/record-test-result"
              payload: { result: "FAIL" }
              as: AviaryStaff
            - call: "POST /quarantine-records/${qr_id}/record-test-result"
              payload: { result: "RETEST" }
              as: AviaryStaff
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-16T00:00:00Z" }
              as: StoreManager
          trigger:
            - call: "POST /quarantine-records/${qr_id}/clear"
              payload: {}
              as: AviaryStaff
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_RISK_TOO_HIGH_TO_CLEAR (final_risk_score 60 >= threshold 60)"
            - "QuarantineRecord.${qr_id}.status == OPEN (clear rejected, record unchanged)"

      - name: cage_cleaning_buffer_exactly_12h_allowed
        grounds:
          - validations[priority=10]
          - entities.CageUnit.fields.cage_class
          - state_machines.BoardingReservation.transitions
        distinguishing_aspect: |
          A second reservation whose planned_check_in is exactly 12h (CLEANING_BUFFER_HOURS) after the first reservation's
          planned_check_out is ACCEPTED (201) because the buffer boundary is >= 12h, not > 12h. Metric: cage time-gap at POST /boarding-reservations.
        test_recipe:
          setup:
            - "One BOARDING cage; reservation R1 planned 2026-07-03 -> 2026-07-05; clock 2026-07-01."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Bo Buffer", email: "bo@x.com" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /cage-units"
              payload: { label: "B2", cage_class: "BOARDING", capacity: 1, nightly_rate_cents: 3000 }
              as: StoreManager
              captures: { cage_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /boarding-reservations"
              payload: { customer_id: "${cust_id}", cage_id: "${cage_id}", planned_check_in: "2026-07-03T00:00:00Z", planned_check_out: "2026-07-05T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { res1_id: $.data.id }
          trigger:
            - call: "POST /boarding-reservations"
              payload: { customer_id: "${cust_id}", cage_id: "${cage_id}", planned_check_in: "2026-07-05T12:00:00Z", planned_check_out: "2026-07-07T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { res2_id: $.data.id, res2_status: $.data.status }
          assert:
            - "R2 is created (201) with BoardingReservation.${res2_id}.status == RESERVED"
            - "A check-in exactly 12h after R1.planned_check_out clears the >= cleaning-buffer boundary"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: bird_listing_depends_on_species_status
        grounds:
          - state_machines.Bird.CLEARED_to_LISTED
          - entities.Species.fields.status
          - validations[priority=8]
        distinguishing_aspect: |
          A CLEARED Bird cannot move to LISTED while its owning Species.status == RESTRICTED; POST /birds/{id}/list-for-sale
          returns ERR_SPECIES_RESTRICTED. The dependency crosses the Bird->Species pair.
        test_recipe:
          setup:
            - "Bird CLEARED (quarantine cleared) of a Species whose permit was approved then revoked (Species RESTRICTED)."
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Conure", scientific_name: "Aratinga solstitialis", cites_appendix: "II" }
              as: ComplianceOfficer
              captures: { sp_id: $.data.id }
            - call: "POST /cites-permits"
              payload: { species_id: "${sp_id}", permit_number: "CITES-300", valid_until: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { perm_id: $.data.id }
            - call: "POST /cites-permits/${perm_id}/submit"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /cites-permits/${perm_id}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /cage-units"
              payload: { label: "H6", cage_class: "HOUSING", capacity: 1 }
              as: StoreManager
              captures: { cage_id: $.data.id }
            - call: "POST /birds"
              payload: { species_id: "${sp_id}", band_code: "B-007", list_price_cents: 30000 }
              as: AviaryStaff
              captures: { bird_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /birds/${bird_id}/start-quarantine"
              payload: { cage_id: "${cage_id}" }
              as: AviaryStaff
            - call: "GET /birds/${bird_id}/quarantine-records"
              payload: {}
              as: AviaryStaff
              captures: { qr_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-16T00:00:00Z" }
              as: StoreManager
            - call: "POST /quarantine-records/${qr_id}/clear"
              payload: {}
              as: AviaryStaff
            - call: "POST /cites-permits/${perm_id}/revoke"
