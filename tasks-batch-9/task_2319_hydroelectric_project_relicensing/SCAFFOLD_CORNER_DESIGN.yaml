  # ===========================================================================
  - section: rbac
    instances:
      - name: unknown_and_missing_user_identity_rejected
        claim_type: unauthorized_operations
        grounds:
          - errors[ERR_UNAUTHORIZED]
          - roles.AgencyReviewer.identity
        distinguishing_aspect: "Authentication is checked before anything else and the two entity-backed roles resolve through SettlementParty.contact_user_id, so a request with no X-User-ID header and a request whose AgencyReviewer user id backs no party row both fail with 401 rather than 403."
        test_recipe:
          setup:
            - "Project P-9051 with one study plan and no SettlementParty rows at all."
            - "The first call is issued with the X-User-ID header omitted entirely (as: none)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /relicensing/projects"
              payload: { license_number: "P-9051", project_name: "Identity Reach", installed_capacity_mw: 12.0, base_annual_generation_mwh: 250000, license_expiration_date: "2035-06-30" }
              as: Regulator
              captures: { proj: $.data.id }
            - call: "POST /relicensing/projects/${proj}/pre-application-document"
              payload: { filing_note: "PAD" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/study-plans"
              payload: { project_id: "${proj}", plan_title: "Study Plan 1" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { plan: $.data.id }
          trigger:
            - call: "GET /relicensing/projects/${proj}"
              payload: {}
              as: none
              captures: { err_missing: $.data.error_id }
            - call: "POST /relicensing/comments"
              payload: { study_plan_id: "${plan}", party_id: "00000000-0000-4000-8000-000000000000", resource_category: "RECREATION", comment_text: "ghost comment" }
              as: AgencyReviewer
              as_user_id: "u_ghost"
              captures: { err_ghost: $.data.error_id }
            - call: "GET /relicensing/comments"
              payload: { study_plan_id: "${plan}" }
              as: Regulator
          assert:
            - "${err_missing} == ERR_UNAUTHORIZED with HTTP 401 (no X-User-ID header)"
            - "${err_ghost} == ERR_UNAUTHORIZED with HTTP 401 (u_ghost resolves to no SettlementParty, so the identity is unknown rather than merely unpermitted)"
            - "the comment list for the plan returns total_count == 0"

      - name: role_exclusive_operations_across_roles_rejected
        claim_type: unauthorized_operations
        grounds:
          - roles.Licensee.exclusive_operations
          - roles.Regulator.exclusive_operations
          - roles.StateCertifier.exclusive_operations
          - roles.AgencyReviewer.exclusive_operations
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: "Every role's exclusive operations are closed to the other four: the licensee cannot register a project, the regulator cannot file the licensee's PAD, the state certifier cannot make an agency determination, a stakeholder cannot make one either even with a comment on file, and the licensee cannot decide its own certification."
        test_recipe:
          setup:
            - "Project P-9052 with a submitted study plan, an AGENCY party (u_agency), an NGO party (u_ngo) and a REQUESTED certification."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /relicensing/projects"
              payload: { license_number: "P-9052", project_name: "Role Reach", installed_capacity_mw: 12.0, base_annual_generation_mwh: 250000, license_expiration_date: "2035-06-30" }
              as: Regulator
              captures: { proj: $.data.id }
            - call: "POST /relicensing/sites"
              payload: { project_id: "${proj}", site_code: "S1", river_mile: 1.0 }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { site: $.data.id }
            - call: "POST /relicensing/projects/${proj}/pre-application-document"
              payload: { filing_note: "PAD" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/study-plans"
              payload: { project_id: "${proj}", plan_title: "Study Plan 1" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { plan: $.data.id }
            - call: "POST /relicensing/studies"
              payload: { study_plan_id: "${plan}", site_id: "${site}", resource_category: "RECREATION", study_title: "Recreation use survey", fieldwork_window_start: "2026-09-01", fieldwork_window_end: "2026-10-01" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { study: $.data.id }
            - call: "POST /relicensing/study-plans/${plan}/submit"
              payload: { submission_note: "plan for review" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/parties"
              payload: { project_id: "${proj}", party_name: "State Fish Agency", party_type: "AGENCY", has_conditioning_authority: true, vote_weight: 1, contact_user_id: "u_agency" }
              as: Regulator
            - call: "POST /relicensing/parties"
              payload: { project_id: "${proj}", party_name: "River Alliance", party_type: "NGO", vote_weight: 1, contact_user_id: "u_ngo" }
              as: Regulator
              captures: { pn: $.data.id }
            - call: "POST /relicensing/water-quality-certifications"
              payload: { project_id: "${proj}", certifying_agency_name: "State DEQ" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { wqc: $.data.id }
          trigger:
            - call: "POST /relicensing/projects"
              payload: { license_number: "P-9052-B", project_name: "Licensee Registers Itself", installed_capacity_mw: 5.0, base_annual_generation_mwh: 20000, license_expiration_date: "2035-06-30" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { err_reg: $.data.error_id }
            - call: "POST /relicensing/projects/${proj}/pre-application-document"
              payload: { filing_note: "regulator files for the licensee" }
              as: Regulator
              captures: { err_pad: $.data.error_id }
            - call: "POST /relicensing/study-plans/${plan}/determination"
              payload: { determination: "APPROVE" }
              as: StateCertifier
              as_user_id: "u_state_1"
              captures: { err_det: $.data.error_id }
            - call: "POST /relicensing/study-plans/${plan}/determination"
              payload: { determination: "APPROVE" }
              as: Stakeholder
              as_user_id: "u_ngo"
              captures: { err_det2: $.data.error_id }
            - call: "POST /relicensing/water-quality-certifications/${wqc}/decision"
              payload: { decision: "DENY", denial_reason: "licensee decides its own certification" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { err_wqc: $.data.error_id }
            - call: "GET /relicensing/study-plans/${plan}"
              payload: {}
              as: Regulator
              captures: { plan_status: $.data.status }
            - call: "GET /relicensing/water-quality-certifications/${wqc}"
              payload: {}
              as: Regulator
              captures: { wqc_status: $.data.status }
          assert:
            - "${err_reg} == ERR_ROLE_NOT_PERMITTED with HTTP 403 and no second project exists"
            - "${err_pad} == ERR_ROLE_NOT_PERMITTED with HTTP 403"
            - "${err_det} == ERR_ROLE_NOT_PERMITTED with HTTP 403"
            - "${err_det2} == ERR_ROLE_NOT_PERMITTED with HTTP 403 (a stakeholder never makes determinations)"
            - "${err_wqc} == ERR_ROLE_NOT_PERMITTED with HTTP 403"
            - "${plan_status} == UNDER_AGENCY_REVIEW and ${wqc_status} == REQUESTED (no rejected call left a partial write)"

      - name: agency_reviewer_of_another_project_cannot_comment
        claim_type: peer_roles
        grounds:
          - roles.AgencyReviewer.restrictions
          - validations[priority=12]
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: "Party registration is per project, so the same u_agency identity that is a registered party on P-9053-A is a stranger on P-9053-B: the identical comment payload is rejected on B and accepted the moment the party is registered there too."
        test_recipe:
          setup:
            - "Two projects, P-9053-A with an AGENCY party bound to u_agency and P-9053-B with a study plan but no parties."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /relicensing/projects"
              payload: { license_number: "P-9053-A", project_name: "Party Home Reach", installed_capacity_mw: 12.0, base_annual_generation_mwh: 250000, license_expiration_date: "2035-06-30" }
              as: Regulator
              captures: { proj_a: $.data.id }
            - call: "POST /relicensing/projects"
              payload: { license_number: "P-9053-B", project_name: "Foreign Reach", installed_capacity_mw: 12.0, base_annual_generation_mwh: 250000, license_expiration_date: "2035-06-30" }
              as: Regulator
              captures: { proj_b: $.data.id }
            - call: "POST /relicensing/parties"
              payload: { project_id: "${proj_a}", party_name: "State Fish Agency", party_type: "AGENCY", has_conditioning_authority: true, vote_weight: 1, contact_user_id: "u_agency" }
              as: Regulator
              captures: { pa: $.data.id }
            - call: "POST /relicensing/projects/${proj_b}/pre-application-document"
