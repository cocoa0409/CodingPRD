      - name: room_zero_buffer_allows_touching_sessions
        claim_type: satisfaction_to_pass
        grounds:
          - validations.priority_25_ERR_ROOM_TIME_CONFLICT
          - entities.ActivityRoom.fields.buffer_minutes
        distinguishing_aspect: "With buffer_minutes 0 the room interval is half-open, so a session starting exactly when the previous one ends is accepted; a session overlapping by a single minute in the same room is still refused."
        test_recipe:
          setup:
            - "one room with buffer_minutes 0 holding a SCHEDULED session 2026-09-02T10:00:00Z .. 2026-09-02T11:00:00Z"
          setup_api_calls:
            - call: "POST /recreation/programs"
              payload: { name: "Touching Program", domain: "PHYSICAL", staffing_ratio_denominator: 4, max_group_size: 10, max_supervision_tier: "TIER_3" }
              as: ActivityDirector
              captures: { prog_id: $.data.id }
            - call: "POST /recreation/rooms"
              payload: { name: "No Buffer Room", capacity: 10, buffer_minutes: 0 }
              as: ActivityDirector
              captures: { room_id: $.data.id }
            - call: "POST /recreation/sessions"
              payload: { program_id: "${prog_id}", room_id: "${room_id}", starts_at: "2026-09-02T10:00:00Z", ends_at: "2026-09-02T11:00:00Z", assigned_staff_count: 2 }
              as: ActivityDirector
              captures: { first_id: $.data.id }
          trigger:
            - call: "POST /recreation/sessions"
              payload: { program_id: "${prog_id}", room_id: "${room_id}", starts_at: "2026-09-02T11:00:00Z", ends_at: "2026-09-02T12:00:00Z", assigned_staff_count: 2 }
              as: ActivityDirector
              captures: { touching_id: $.data.id }
            - call: "POST /recreation/sessions"
              payload: { program_id: "${prog_id}", room_id: "${room_id}", starts_at: "2026-09-02T11:59:00Z", ends_at: "2026-09-02T12:30:00Z", assigned_staff_count: 2 }
              as: ActivityDirector
              captures: { overlap_err_id: $.data.error_id }
          assert:
            - "the touching session is created with status 201 and ActivitySession.${touching_id}.status == SCHEDULED"
            - "the overlapping session returns 409 and ${overlap_err_id} == \"ERR_ROOM_TIME_CONFLICT\""
            - "GET /recreation/sessions?room_id=${room_id} returns total_count 2, containing ${first_id} and ${touching_id}"
      - name: packet_windows_may_touch_but_overlap_rejected
        claim_type: temporal_validation
        grounds:
          - validations.priority_24_ERR_PACKET_WINDOW_OVERLAP
        distinguishing_aspect: "Survey windows are inclusive on both ends: 2026-08-01..2026-08-31 and 2026-09-01..2026-09-30 coexist, while a third packet spanning 2026-08-15..2026-09-15 intersects both and is refused with ERR_PACKET_WINDOW_OVERLAP."
        test_recipe:
          setup:
            - "one OPEN packet covering 2026-08-01..2026-08-31"
          setup_api_calls:
            - call: "POST /recreation/survey-packets"
              payload: { window_start: "2026-08-01", window_end: "2026-08-31" }
