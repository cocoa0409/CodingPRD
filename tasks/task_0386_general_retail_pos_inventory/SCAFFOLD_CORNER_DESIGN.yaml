              payload: {}
              as: InventoryClerk
            - call: "POST /cash-sessions"
              payload: { store_id: "${sid}", opening_float_cents: 0 }
              as: StoreManager
            - call: "POST /sales"
              payload: { store_id: "${sid}", kind: "SALE", lines: [ { product_id: "${p}", quantity: 3 } ] }
              as: Cashier
              captures: { sale_id: $.data.id, v0: $.data.version }
            - call: "POST /sales/${sale_id}/tenders"
              payload: { method: "CARD", amount_cents: 1000, expected_sale_version: "${v0}" }
              as: Cashier
          trigger:
            - call: "POST /sales/${sale_id}/tenders"
              payload: { method: "CARD", amount_cents: 1000, expected_sale_version: "${v0}" }
              as: Cashier
              captures: { eid: $.data.error_id }
          assert:
            - "Response status == 412 and data.error_id == ERR_STALE_VERSION (v0 is stale after first tender advanced Sale.version)."

      - name: occ_stale_transfer_version_on_dispatch
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[transfer-dispatch-stale]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "Dispatching a transfer with expected_transfer_version one behind the current version (${trv} - 1) -> ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Transfer A->B quantity 1 REQUESTED; source on_hand 5."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "A", code: "OTA", tax_rate_bps: 0 }
              as: StoreManager
              captures: { sa: $.data.id }
            - call: "POST /stores"
              payload: { name: "B", code: "OTB", tax_rate_bps: 0 }
              as: StoreManager
              captures: { sb: $.data.id }
            - call: "POST /products"
              payload: { sku: "POT2", barcode: "BOT2", name: "P", list_price_cents: 100 }
              as: StoreManager
              captures: { p: $.data.id }
            - call: "POST /inventory-items"
              payload: { store_id: "${sa}", product_id: "${p}", reorder_point: 0, reorder_qty: 0 }
              as: InventoryClerk
              captures: { inva: $.data.id }
            - call: "POST /count-sheets"
              payload: { inventory_item_id: "${inva}", counted_qty: 5 }
              as: InventoryClerk
              captures: { cs: $.data.id }
            - call: "POST /count-sheets/${cs}/post"
              payload: {}
              as: InventoryClerk
            - call: "POST /inventory-items"
              payload: { store_id: "${sb}", product_id: "${p}", reorder_point: 0, reorder_qty: 0 }
              as: InventoryClerk
              captures: { invb: $.data.id }
            - call: "POST /transfers"
              payload: { from_store_id: "${sa}", to_store_id: "${sb}", product_id: "${p}", quantity: 1 }
              as: InventoryClerk
              captures: { tr: $.data.id, trv: $.data.version }
          trigger:
            - call: "POST /transfers/${tr}/dispatch"
              payload: { expected_transfer_version: "${trv} - 1" }
              as: InventoryClerk
              captures: { eid: $.data.error_id }
          assert:
            - "Response status == 412 and data.error_id == ERR_STALE_VERSION (expected version is one behind current)."

      - name: derived_field_available_qty_reconciles_after_sale_commit
        claim_type: derived_field_reconciliation
        grounds: [calculations.inventory_available_and_reorder, state_machines.Sale.PENDING_to_COMMITTED]
        distinguishing_aspect: "After a SALE of 2 settles (commits), InventoryItem.on_hand 5->3, available 5->3, below_reorder recomputed — denormalized fields stay consistent."
        test_recipe:
          setup: ["Store tax_bps=0, product list 1000 on_hand 5 reorder_point 2, OPEN session. SALE 2xP."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", code: "DR1", tax_rate_bps: 0 }
              as: StoreManager
              captures: { sid: $.data.id }
            - call: "POST /products"
              payload: { sku: "PDR", barcode: "BDR", name: "P", list_price_cents: 1000 }
              as: StoreManager
              captures: { p: $.data.id }
            - call: "POST /inventory-items"
              payload: { store_id: "${sid}", product_id: "${p}", reorder_point: 2, reorder_qty: 5 }
              as: InventoryClerk
              captures: { inv: $.data.id }
            - call: "POST /count-sheets"
              payload: { inventory_item_id: "${inv}", counted_qty: 5 }
              as: InventoryClerk
              captures: { cs: $.data.id }
            - call: "POST /count-sheets/${cs}/post"
              payload: {}
              as: InventoryClerk
            - call: "POST /cash-sessions"
              payload: { store_id: "${sid}", opening_float_cents: 0 }
              as: StoreManager
            - call: "POST /sales"
              payload: { store_id: "${sid}", kind: "SALE", lines: [ { product_id: "${p}", quantity: 2 } ] }
              as: Cashier
              captures: { sale_id: $.data.id, sv: $.data.version }
          trigger:
            - call: "POST /sales/${sale_id}/tenders"
              payload: { method: "CASH", amount_cents: 2000, expected_sale_version: "${sv}" }
              as: Cashier
          assert:
            - "InventoryItem.${inv}.on_hand_qty == 3, available_qty == 3, below_reorder == false (3 > 2)."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: sale_settlement_atomic_in_single_response
        claim_type: immediate
        grounds: [state_machines.Sale.TENDERING_to_SETTLED, entities.Sale.fields.points_earned]
        distinguishing_aspect: "All settlement side effects (settled status, committed stock, points_earned) are visible in the settling tender's response and on immediate re-read; no lag."
        test_recipe:
          setup: ["Store tax_bps=0, loyalty earn 100bps. Product list 1000 loyalty_eligible on_hand 5. LoyaltyAccount LA. OPEN session. SALE 2xP total 2000 with LA attached."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", code: "IM1", tax_rate_bps: 0, loyalty_earn_rate_bps: 100 }
              as: StoreManager
              captures: { sid: $.data.id }
            - call: "POST /products"
              payload: { sku: "PIM2", barcode: "BIM2", name: "P", list_price_cents: 1000 }
              as: StoreManager
              captures: { p: $.data.id }
            - call: "POST /inventory-items"
              payload: { store_id: "${sid}", product_id: "${p}", reorder_point: 0, reorder_qty: 0 }
              as: InventoryClerk
              captures: { inv: $.data.id }
            - call: "POST /count-sheets"
              payload: { inventory_item_id: "${inv}", counted_qty: 5 }
              as: InventoryClerk
              captures: { cs: $.data.id }
            - call: "POST /count-sheets/${cs}/post"
              payload: {}
              as: InventoryClerk
            - call: "POST /loyalty-accounts"
              payload: { customer_name: "C", phone: "555-1004" }
              as: StoreManager
              captures: { la: $.data.id }
            - call: "POST /cash-sessions"
              payload: { store_id: "${sid}", opening_float_cents: 0 }
              as: StoreManager
            - call: "POST /sales"
              payload: { store_id: "${sid}", kind: "SALE", loyalty_account_id: "${la}", lines: [ { product_id: "${p}", quantity: 2 } ] }
              as: Cashier
              captures: { sale_id: $.data.id, sv: $.data.version }
            - call: "POST /sales/${sale_id}/tenders"
              payload: { method: "CASH", amount_cents: 2000, expected_sale_version: "${sv}" }
              as: Cashier
          trigger:
            - call: "GET /sales/${sale_id}"
              payload: {}
              as: Cashier
              captures: { st: $.data.settlement_status }
          assert:
            - "Sale.${sale_id}.settlement_status == SETTLED, stock_status == COMMITTED, points_earned == 20 (floor(2000*100/10000))."
            - "LoyaltyAccount.${la}.points_balance == 20 immediately after."
