              payload: { material_code: "PG-SOLV", name: "Propylene Glycol Solvent", cost_per_kg_cents: 1215, natural_status: "NATURE_IDENTICAL", potency_class: "STANDARD", max_use_ppm: 1000000 }
              as: PurchasingManager
              captures: { m3: $.data.id }
            - call: "POST /customer-briefs"
              payload: { brief_code: "BRF-0001", customer_name: "Nordic Beverages", matrix_type: "BEVERAGE_STILL", target_profile: "CITRUS_TOP_NOTE", dosage_pct: 2.5, annual_volume_kg: 1200, cost_in_use_cap_cents_per_tonne: 74425, confidentiality_tier: "TIER_1_STANDARD" }
              as: AccountManager
              captures: { b1: $.data.id }
            - call: "POST /customer-briefs/${b1}/submit"
              payload: {}
              as: AccountManager
            - call: "POST /customer-briefs/${b1}/decision"
              payload: { decision: "ACCEPTED" }
              as: TechnicalDirector
            - call: "POST /formulas"
              payload: { brief_id: "${b1}", name: "Citrus Top Note F1" }
              as: Flavorist
              captures: { f1: $.data.id }
            - call: "POST /formulas/${f1}/components"
              payload: { component_type: "RAW_MATERIAL", raw_material_id: "${m1}", weight_pct: 3.75 }
              as: Flavorist
            - call: "POST /formulas/${f1}/components"
              payload: { component_type: "RAW_MATERIAL", raw_material_id: "${m2}", weight_pct: 1.25 }
              as: Flavorist
            - call: "POST /formulas/${f1}/components"
              payload: { component_type: "RAW_MATERIAL", raw_material_id: "${m3}", weight_pct: 95.0 }
              as: Flavorist
            - call: "POST /formulas/${f1}/cost"
              payload: {}
              as: Flavorist
            - call: "POST /formulas/${f1}/submit"
              payload: {}
              as: Flavorist
              as_user_id: "u_flav_1"
            - call: "POST /formulas/${f1}/decision"
              payload: { decision: "APPROVED" }
              as: TechnicalDirector
              as_user_id: "u_dir_1"
            - call: "POST /sample-lots"
              payload: { formula_id: "${f1}", batch_size_g: 500 }
              as: LabTech
              as_user_id: "u_lab_1"
              captures: { lot: $.data.id, mass_0: $.data.available_g }
            - call: "POST /sample-lots/${lot}/qc"
              payload: { result: "PASSED" }
              as: LabTech
              as_user_id: "u_lab_2"
            - call: "POST /sample-lots/${lot}/release"
              payload: {}
              as: LabTech
              as_user_id: "u_lab_1"
            - call: "POST /retention-cabinets"
              payload: { cabinet_code: "CAB-03", capacity_slots: 4, storage_temp_c: -20 }
              as: LabTech
              captures: { cab: $.data.id }
            - call: "POST /retention-samples"
              payload: { sample_lot_id: "${lot}", cabinet_id: "${cab}", quantity_g: 120, stored_from: "2026-08-01T00:00:00Z", stored_until: "2026-11-01T00:00:00Z" }
              as: LabTech
              captures: { rs: $.data.id }
            - call: "GET /sample-lots/${lot}"
              payload: {}
              as: LabTech
              captures: { mass_1: $.data.available_g }
            - call: "POST /shipments"
              payload: { sample_lot_id: "${lot}", destination_country: "US", shipped_g: 150 }
              as: AccountManager
              captures: { sh: $.data.id }
            - call: "GET /sample-lots/${lot}"
              payload: {}
              as: LabTech
              captures: { mass_2: $.data.available_g, alloc_2: $.data.allocated_g }
          trigger:
            - call: "POST /shipments/${sh}/cancel"
              payload: { cancellation_reason: "Customer deferred the evaluation" }
              as: AccountManager
            - call: "GET /sample-lots/${lot}"
              payload: {}
              as: LabTech
              captures: { mass_3: $.data.available_g, alloc_3: $.data.allocated_g }
            - call: "POST /retention-samples/${rs}/withdraw"
              payload: { withdrawal_reason: "Retention released after customer sign-off" }
              as: LabTech
          assert:
            - "${mass_0} == 500 with allocated_g 0 at compounding"
            - "${mass_1} == 380 after the 120 g retention aliquot"
            - "${mass_2} == 230 and ${alloc_2} == 270 after the 150 g shipment (500 == 230 + 270)"
            - "${mass_3} == 380 and ${alloc_3} == 120 after the cancellation — exactly the pre-shipment value, no drift"
            - "SampleLot.${lot}.available_g == 500 and allocated_g == 0 after the withdrawal"
            - "SampleShipment.${sh}.status == CANCELLED and RetentionSample.${rs}.status == WITHDRAWN with withdrawn_at set"
            - "SampleLot.${lot}.batch_size_g == 500 == available_g + allocated_g at every one of the five observations"
            - "SampleLot.${lot}.disposition_status == RELEASED throughout (available_g never reached 0)"

      - name: cabinet_slot_count_conserved_across_two_withdrawals
        grounds:
          - calculations.retention_slot_occupancy
          - entities.RetentionCabinet.fields.slots_available
          - entities.RetentionSample.fields.slot_count
          - state_machines.RetentionSample.STORED_to_WITHDRAWN
          - validations[priority=64]
        distinguishing_aspect: |
          A different conserved quantity on a different entity: integer CABINET
          SLOTS, where capacity_slots == slots_available + the slot_count of every
          STORED row covering the clock. Withdrawal is the compensating action, and
          because slot_count is a ceil() of grams the restoration must return 3 and
          then 1 slot — not 2.4 and not the raw gram figures — bringing a full
          cabinet (0 free) back to exactly 4 free with no residue.
        test_recipe:
          setup:
            - "Brief BRF-0001 ACCEPTED, formula F1 APPROVED, one 500 g lot QC PASSED and RELEASED."
