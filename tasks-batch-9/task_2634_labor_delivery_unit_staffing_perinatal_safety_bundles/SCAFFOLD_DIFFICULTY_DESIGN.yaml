      - name: bump_and_cancel_credit_back_the_hold_time_frozen_645_and_375_while_the_untouched_165_stays_committed
        grounds:
          - invariants.induction_bed_minute_conservation
          - calculations.induction_capacity_projection
          - calculations.unit_posture_derivation
          - entities.InductionBooking.fields.projected_occupancy_minutes
          - entities.InductionBooking.fields.expected_labor_minutes
          - entities.InductionBooking.fields.bump_count
          - entities.ObstetricUnit.fields.held_bed_minutes_by_day
          - entities.ObstetricUnit.fields.committed_bed_minutes_by_day
          - entities.ObstetricUnit.fields.turnover_buffer_minutes
          - entities.Bed.fields.held_booking_id
          - state_machines.InductionBooking.CONFIRMED_to_BUMPED
          - state_machines.InductionBooking.CAPACITY_HELD_to_CANCELLED
          - endpoints[POST /induction-bookings/{bookingId}/bump]
          - endpoints[POST /induction-bookings/{bookingId}/cancel]
          - endpoints[GET /obstetric-units/{unitId}/capacity-summary]
        distinguishing_aspect: |
          The conserved quantity is a PER-DAY LEDGER of two maps, and the quantum
          returned on release is the one FROZEN AT HOLD TIME — never the value a
          re-derivation would produce at release time, and never the value the
          booking's creation instant would have produced. Three bookings on
          2026-08-27, all created while the posture is OPEN, make every wrong
          arithmetic visible in a different digit:
            * P (600 min) is held and confirmed while OPEN, so its frozen quantum
              is 600 + 45 = 645 and it sits in committed_bed_minutes_by_day.
            * R (120 min) is held and confirmed while OPEN -> 165 committed, and
              is then never touched again: it is the control.
            * Q (300 min) is held only AFTER an uncovered walk-in encounter pushes
              coverage_deficit_units to 0.5 and the posture to RATIO_STRAINED,
              which raises turnover_buffer_minutes to 75, so Q's frozen quantum is
              300 + 75 = 375, not the 345 its OPEN-posture creation would suggest.
          The compensations then run with the posture still RATIO_STRAINED:
            * bump P must remove EXACTLY 645 from committed. An implementation
              that recomputes expected_labor_minutes + current buffer removes 675
              and either drives the map 30 minutes negative or clamps at 0 and
              hides the drift; one that removes the whole committed total leaves
              R's 165 destroyed.
            * cancel Q must remove EXACTLY 375 from held. An implementation that
              froze the buffer at BOOKING CREATE time removes 345 and leaves 30
              minutes of phantom load that no live hold accounts for.
          The end state is therefore asymmetric and unforgeable:
          committed_bed_minutes_by_day[2026-08-27] == 165 (R alone) and
          held_bed_minutes_by_day[2026-08-27] == 0, exactly the values the
          invariant's SUM-over-bookings definition demands, with BUMPED and
          CANCELLED rows contributing 0 to both maps while retaining their frozen
          projected_occupancy_minutes. Bed lifecycle must agree in the same
          breath: LDR-01 and LDR-03 return to AVAILABLE with held_booking_id null
          while LDR-02 stays HELD by R, and the posture stays RATIO_STRAINED
          throughout because releasing bed-minutes has nothing to do with
          coverage_deficit_units.
        test_recipe:
          setup: |
            One unit with FIVE LDR beds (deliberately more than the three the
            fixture holds, so available_ldr_beds never reaches 0 and no
            bed-exhaustion DIVERT can rewrite the buffer or auto-bump a hold), one
            OR room and a 5000-minute day budget so priority 15 is never in play.
            Cesarean readiness is lifted to DEGRADED by one validated
            DECISION_TO_INCISION drill, because /confirm refuses at NOT_READY.
            All three ELECTIVE_39_WEEK bookings (GDM_CONTROLLED at 39 weeks, so
            bumpable — MEDICALLY_INDICATED rows are not) are created up front for
            2026-08-27 while the posture is OPEN: P at 08:00 for 600 minutes on
            LDR-01, R at 18:00 for 120 minutes on LDR-02 and Q at 20:00 for 300
            minutes on LDR-03 — three distinct beds, so validation 13.3 never
            interferes. P and R are held and confirmed while the buffer is 45. A
            walk-in ANTEPARTUM TIER_I encounter is then admitted with no care
            assignment at all, which raises coverage_deficit_units to 0.5 and the
            posture to RATIO_STRAINED (still well under the 4.0 INDUCTION_FROZEN
            threshold, so no automatic bump cascade fires) and raises the buffer to
            75; only then is Q held. The unit version is re-read immediately before
            each hold so the priority-6 OCC guard never masks the arithmetic.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-26T06:00:00Z" }
