            - "The second DELETE returns 422 with data.error_id == 'ERR_INVALID_LEASE_STATE'"
            - "GET /leases?building_id=${e1_b_id}&status=WITHDRAWN returns meta.total_count == 1"
            - "Suite.${e1_s_id}.occupancy_status is still VACANT and last_vacated_on is null — a withdrawn draft never held the suite"

