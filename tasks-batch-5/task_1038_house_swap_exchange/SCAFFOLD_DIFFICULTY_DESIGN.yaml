  # =========================================================================
  # Rule 3 — non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: exchange_request_counter_repropose_cycle
        grounds:
          - state_machines.ExchangeRequest.PROPOSED_to_COUNTERED
          - state_machines.ExchangeRequest.COUNTERED_to_PROPOSED
          - entities.ExchangeRequest.fields.status
        distinguishing_aspect: "ExchangeRequest exhibits a PROPOSED↔COUNTERED cycle: after host counter (PROPOSED→COUNTERED) then requester repropose (COUNTERED→PROPOSED) the status returns to PROPOSED — a true loop, not a linear pipeline."
        test_recipe:
          setup:
            - "Guest PLUS active; host+ACTIVE listing; guest opens a POINTS request (PROPOSED)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members/register"
              payload: { email: "g5@x.com", full_name: "Guest Five", home_city: "Boston" }
              as: Anonymous
              captures: { g: $.data.id }
            - call: "POST /members/register"
              payload: { email: "h5@x.com", full_name: "Host Five", home_city: "Denver" }
              as: Anonymous
              captures: { h: $.data.id }
            - call: "POST /memberships"
              payload: { member_id: "${g}", tier: "PLUS" }
              as: Member
              as_user_id: "${g}"
              captures: { gm: $.data.id }
            - call: "POST /memberships/${gm}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /verifications"
              payload: { member_id: "${h}", verification_type: "IDENTITY", document_ref: "doc-h" }
              as: Member
              as_user_id: "${h}"
              captures: { hv: $.data.id }
            - call: "POST /verifications/${hv}/decide"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /home-listings"
              payload: { owner_member_id: "${h}", title: "Cabin", address_city: "Denver", address_country: "US", points_per_night: 100, max_points_per_exchange: 10000, capacity: 4 }
              as: Member
              as_user_id: "${h}"
              captures: { lst: $.data.id }
            - call: "POST /home-listings/${lst}/activate"
              payload: {}
              as: Member
              as_user_id: "${h}"
              captures: { lst_v: $.data.version }
            - call: "POST /exchange-requests"
              payload: { requester_member_id: "${g}", target_listing_id: "${lst}", exchange_type: "POINTS", requested_start_date: "2026-07-10", requested_end_date: "2026-07-12" }
              as: Member
              as_user_id: "${g}"
              captures: { req: $.data.id }
          trigger:
            - call: "POST /exchange-requests/${req}/counter"
              payload: { requested_start_date: "2026-07-14", requested_end_date: "2026-07-16" }
              as: Member
              as_user_id: "${h}"
              captures: { st1: $.data.status }
            - call: "POST /exchange-requests/${req}/repropose"
              payload: { requested_start_date: "2026-07-14", requested_end_date: "2026-07-16" }
              as: Member
              as_user_id: "${g}"
              captures: { st2: $.data.status }
          assert:
            - "ExchangeRequest.${req}.status == PROPOSED after counter then repropose (was COUNTERED in between)"

      - name: dispute_review_forks_claimant_vs_respondent
        grounds:
          - state_machines.Dispute.UNDER_REVIEW_to_RESOLVED_FOR_CLAIMANT
          - state_machines.Dispute.UNDER_REVIEW_to_RESOLVED_FOR_RESPONDENT
          - entities.Dispute.fields.status
        distinguishing_aspect: "Dispute (a different entity than ExchangeRequest) branches at UNDER_REVIEW into RESOLVED_FOR_CLAIMANT (DISPUTE_PENALTY transfer + respondent trust penalty) vs RESOLVED_FOR_RESPONDENT (no side effects) — divergent side-effect sets per branch."
        test_recipe:
          setup:
            - "A COMPLETED POINTS agreement (guest settled 730, host 1270, both trust 52); host opens a dispute penalty_points 100; admin reviews it."
