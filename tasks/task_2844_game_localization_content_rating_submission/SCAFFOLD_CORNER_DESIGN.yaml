          assert:
            - "both plans scope to text_effort_units == 0.40 (menu 1.25 x 0.10 x 1.00 = 0.125 -> 0.1; hud 0.60 x 0.45 x 1.10 = 0.297 -> 0.3) with JP localization_cost_cents == 1680 and KR == 3024 (FULL_VOICE multiplier 1.80)"
            - "enter-lqa on JP returns HTTP 422 with error_id == ERR_LOCALIZATION_INCOMPLETE: delivered_unit_count 1 < required_unit_count 2"
            - "enter-lqa on KR returns the SAME HTTP 422 ERR_LOCALIZATION_INCOMPLETE for the other reason: delivered_unit_count 2 == required_unit_count 2 but voice_recorded_line_count 0 < required_voice_line_count 40"
            - "after the second JP unit is delivered, enter-lqa on JP returns HTTP 200 with status == LQA, text_effort_variant == DELIVERED_ACTUAL and text_effort_units == 0.40 (the applied_tm_match_pct values match the planned ones)"
            - "Title.localization_state stays STRINGS_LOCKED - the bubble-up to CERT_WINDOW needs EVERY market plan in {LQA, RELEASE_READY} and KR is still IN_LOCALIZATION"
            - "Title.release_gate_state == OPEN: ready_market_count is 0, release_mode is STAGGERED and days_to_release 122 >= CERT_WINDOW_DAYS 30"

      - name: budget_overage_is_the_last_gate_on_the_release_ready_ladder
        claim_type: error_triggerable
        grounds:
          - errors[ERR_BUDGET_OVERAGE]
          - validations[priority 70]
          - calculations.market_localization_cost_cents
        distinguishing_aspect: "Priority 70 sits at the very bottom of the ladder and is enforced only at mark-release-ready: scope and enter-lqa happily store a clamped localization_cost_cents with a non-zero overage_cents, and there is no endpoint that raises budget_cap_cents, so an under-budgeted plan is permanently unshippable."
        test_recipe:
          setup:
            - "Title NOVA-81 with one HUD key (60 chars, limit 80, tm 96) and a JP plan whose budget_cap_cents is 400 against a 420-cent text cost; the plan reaches LQA with a RATED ALL_AGES submission and one CLOSED defect-free LINGUISTIC pass."
          setup_api_calls:
            - call: "POST /titles"
              payload: { title_code: "NOVA-81", name: "Nova Drift 81", source_language: "EN", target_release_utc: "2026-12-01T00:00:00Z", release_mode: "STAGGERED" }
              as: LocalizationProducer
              captures: { title_id: "$.data.id" }
            - call: "POST /string-keys"
              payload: { title_id: "${title_id}", key_name: "hud.ammo", source_text: "Ammo", source_char_count: 60, ui_surface: "HUD", display_char_limit: 80, tm_match_pct: 96 }
              as: LocalizationProducer
              captures: { key_id: "$.data.id" }
            - call: "POST /market-plans"
              payload: { title_id: "${title_id}", market_code: "JP", rating_board: "CERO", target_rating: "ALL_AGES", scope_tier: "TEXT_ONLY", cultural_adaptation_required: false, budget_cap_cents: 400, required_voice_line_count: 0 }
              as: LocalizationProducer
              captures: { mp_jp: "$.data.id" }
            - call: "POST /titles/${title_id}/lock-strings"
              payload: {}
              as: LocalizationProducer
            - call: "POST /market-plans/${mp_jp}/scope"
              payload: {}
              as: LocalizationProducer
              captures: { scoped_units: "$.data.text_effort_units", scoped_cost: "$.data.localization_cost_cents", scoped_overage: "$.data.overage_cents" }
            - call: "POST /market-plans/${mp_jp}/start-localization"
              payload: {}
              as: LocalizationProducer
            - call: "GET /translation-units?market_plan_id=${mp_jp}"
              payload: {}
              as: TranslationVendor
              captures: { u_jp: "$.data[0].id" }
            - call: "PUT /translation-units/${u_jp}"
              payload: { target_text: "残弾", target_char_count: 70, applied_tm_match_pct: 96 }
              as: TranslationVendor
              captures: { overflow: "$.data.overflow_chars" }
            - call: "POST /translation-units/${u_jp}/deliver"
              payload: {}
              as: TranslationVendor
            - call: "POST /market-plans/${mp_jp}/enter-lqa"
              payload: {}
              as: LocalizationProducer
              captures: { lqa_cost: "$.data.localization_cost_cents", lqa_overage: "$.data.overage_cents" }
            - call: "GET /market-plans/${mp_jp}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { mp_v: "$.data.version" }
            - call: "POST /rating-submissions"
              payload: { market_plan_id: "${mp_jp}", disclosed_content_codes: ["VIOLENCE_STYLIZED"], footage_asset_count: 0, target_rating: "ALL_AGES", expected_market_plan_version: "${mp_v}" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { sub_id: "$.data.id" }
            - call: "POST /rating-submissions/${sub_id}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-1"
            - call: "POST /rating-submissions/${sub_id}/begin-review"
              payload: {}
              as: RatingBoardLiaison
              as_user_id: "board-1"
            - call: "POST /rating-submissions/${sub_id}/record-outcome"
              payload: { board_decision: "RATE", assigned_rating: "ALL_AGES" }
              as: RatingBoardLiaison
              as_user_id: "board-1"
            - call: "POST /qa-passes"
              payload: { market_plan_id: "${mp_jp}", pass_type: "LINGUISTIC", inspected_unit_count: 40 }
              as: LqaTester
              as_user_id: "lqa-1"
              captures: { pass_id: "$.data.id" }
            - call: "POST /qa-passes/${pass_id}/close"
              payload: {}
              as: LqaTester
              as_user_id: "lqa-2"
              captures: { density: "$.data.defect_density" }
          trigger:
            - call: "POST /market-plans/${mp_jp}/mark-release-ready"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { e_budget: "$.data.error_id" }
            - call: "GET /market-plans/${mp_jp}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { still_lqa: "$.data.status", final_overage: "$.data.overage_cents" }
            - call: "GET /titles/${title_id}"
              payload: {}
              as: LocalizationProducer
              captures: { title_state: "$.data.localization_state", ready_count: "$.data.ready_market_count" }
          assert:
            - "scope stores text_effort_units == 0.10 (0.60 x 0.10 x 1.10 = 0.066 -> 0.1), localization_cost_cents == 400 (clamped from the 420-cent subtotal) and overage_cents == 20 - the clamp is stored, the request is NOT rejected"
            - "enter-lqa recomputes under DELIVERED_ACTUAL and reports the same localization_cost_cents == 400 and overage_cents == 20"
            - "the delivered unit has overflow_chars == 0 (70 target chars against limit 80) and defect_density == 0.0000, so priorities 58 and 57 are clean"
            - "mark-release-ready returns HTTP 422 with error_id == ERR_BUDGET_OVERAGE - every earlier gate (44 passes closed, 52 no restricted code, 53 no footage-mandatory code, 59 delivery complete, 60 ALL_AGES <= ALL_AGES) is satisfied"
            - "MarketPlan.${mp_jp}.status is still LQA and overage_cents is still 20; Title.localization_state stays CERT_WINDOW with ready_market_count 0"

      - name: footage_evidence_missing_when_the_disclosure_set_demands_gameplay_video
        claim_type: error_triggerable
        grounds:
          - errors[ERR_FOOTAGE_EVIDENCE_MISSING]
        excluded_because:
          difficulty_instance: submission_submit_with_zero_footage_assets_rejected
          rationale: "That §1.8 instance already submits a package whose disclosed set intersects FOOTAGE_MANDATORY_CODES with footage_asset_count 0 and asserts the 422 at priority 53, including the boundary where a count of 1 passes."

      - name: defect_density_exactly_at_the_ceiling_blocks_the_close
        claim_type: error_triggerable
        grounds:
          - errors[ERR_DEFECT_DENSITY_EXCEEDED]
        excluded_because:
          difficulty_instance: qa_pass_close_at_defect_density_exactly_at_ceiling_rejected
          rationale: "That §1.8 instance drives defect_density to exactly 0.0500 and asserts the strict comparison rejects the close, then clears one bug to fall under the ceiling."

      - name: booth_window_conflict_on_the_buffered_interval
        claim_type: error_triggerable
        grounds:
          - errors[ERR_BOOTH_WINDOW_CONFLICT]
        excluded_because:
          difficulty_instance: booth_buffer_boundary_one_minute_early_rejected
          rationale: "That §1.8 instance books one minute inside the buffered occupied interval and asserts the 422, with the adjacent-start case accepted."

      - name: talent_daily_capacity_exceeded_across_two_booths
        claim_type: error_triggerable
        grounds:
          - errors[ERR_TALENT_DAILY_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: talent_daily_capacity_aggregates_across_booths_and_resets_per_utc_date
          rationale: "That §1.8 instance already exceeds max_daily_recording_minutes by aggregating two different booths on one UTC date and asserts the reset on the next date."

      - name: contract_territory_not_covered_for_the_market_code
        claim_type: error_triggerable
        grounds:
          - errors[ERR_CONTRACT_TERRITORY_NOT_COVERED]
        excluded_because:
          difficulty_instance: contract_territory_gap_beats_booth_window_conflict
          rationale: "That §1.8 instance books a session whose contract territory_scope omits the market_code and asserts the 422 wins over a simultaneous booth conflict at priority 62."

      - name: content_restriction_unresolved_at_release_readiness
        claim_type: error_triggerable
        grounds:
          - errors[ERR_CONTENT_RESTRICTION_UNRESOLVED]
        excluded_because:
          difficulty_instance: content_restriction_beats_budget_overage_on_release_ready
          rationale: "That §1.8 instance leaves a RESTRICTED_CODES entry in the effective disclosure set with no APPLIED removing edit and asserts the 422 at priority 52."

      - name: rating_band_mismatch_against_the_market_target
        claim_type: error_triggerable
        grounds:
          - errors[ERR_RATING_BAND_MISMATCH]
        excluded_because:
          difficulty_instance: mark_release_ready_blocked_by_governing_submission_rating_band
          rationale: "That §1.8 instance assigns a stricter rating than MarketPlan.target_rating and asserts the RATING_STRICTNESS comparison at priority 60."

      - name: appeal_budget_exhausted_after_two_appeals
        claim_type: error_triggerable
        grounds:
          - errors[ERR_MAX_APPEALS_EXCEEDED]
        excluded_because:
          difficulty_instance: rating_submission_appeal_cycle_terminates_at_max_appeals
          rationale: "That §1.8 instance walks the UNDER_REVIEW -> RATED -> UNDER_REVIEW cycle twice and asserts the third appeal is refused at priority 61."

      - name: bug_state_invalid_on_a_terminal_bug
        claim_type: error_triggerable
        grounds:
          - errors[ERR_BUG_STATE_INVALID]
        excluded_because:
          difficulty_instance: lqa_bug_triage_fork_three_way_branch_with_terminal_lockdown
          rationale: "That §1.8 instance exercises all three triage branches and asserts every further transition out of REJECTED and DUPLICATE is a 409."

      - name: submission_state_invalid_on_a_double_submit
        claim_type: error_triggerable
        grounds:
          - errors[ERR_SUBMISSION_STATE_INVALID]
        excluded_because:
          difficulty_instance: submission_state_conflict_beats_mandatory_disclosure_gap
          rationale: "That §1.8 instance submits a non-DRAFT submission that also has a disclosure gap and asserts the state error at priority 42 wins over priority 51."

      - name: session_state_invalid_on_a_cancelled_session
        claim_type: error_triggerable
        grounds:
          - errors[ERR_SESSION_STATE_INVALID]
        excluded_because:
          difficulty_instance: contract_committed_fee_returns_exactly_to_buyout_after_cancel
          rationale: "That §1.8 instance cancels a session and asserts the follow-up start/complete attempts are 409s at priority 42."

      - name: prerequisite_state_not_met_on_an_ancestor
        claim_type: error_triggerable
        grounds:
          - errors[ERR_PREREQUISITE_STATE_NOT_MET]
        excluded_because:
          difficulty_instance: start_localization_blocked_until_title_strings_locked
          rationale: "That §1.8 instance calls start-localization before the Title's strings are locked and asserts the cross-entity 409 at priority 44."

  # =========================================================================
  # 7. RBAC
  # =========================================================================
  - section: rbac
    instances:
      - name: each_of_the_seven_roles_can_perform_its_own_exclusive_operations
        claim_type: exclusive_operations_permitted
        grounds:
          - roles[LocalizationProducer].exclusive_operations
          - roles[TranslationVendor].exclusive_operations
          - roles[LqaTester].exclusive_operations
          - roles[ComplianceOfficer].exclusive_operations
          - roles[RatingBoardLiaison].exclusive_operations
          - roles[TalentAgent].shared_operations
          - roles[PlatformAdmin].exclusive_operations
        distinguishing_aspect: "One end-to-end pass in which every role executes at least one operation it exclusively owns, so a permissive-everything implementation and an over-restrictive one both fail. PlatformAdmin additionally performs a domain role's exclusive operation (POST /titles) and the clock write no other role may issue."
        test_recipe:
          setup:
            - "Title NOVA-82 with one MENU key and a JP plan at IN_LOCALIZATION; one talent with a DRAFT contract."
