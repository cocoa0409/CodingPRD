        distinguishing_aspect: |
          Threshold boundary on crew size (metric 1) reached via
          POST /refuge/permits/{id}/approve: tier is LARGE at crew_size >= 20.
          Crew 19 (MEDIUM 1.25) assesses 36250; crew 20 (LARGE 1.5) assesses
