            - "Draw D1 was submitted with 25000.20 of eligible cost (inside the cap) and returned by the lender, so it sits in RETURNED with its entries back in APPROVED."
            - "A third APPROVED CostEntry of 20000.10 has since been added, so eligible cost inside the period is now 45000.30, which is above the 45000.00 cap."
          setup_api_calls:
