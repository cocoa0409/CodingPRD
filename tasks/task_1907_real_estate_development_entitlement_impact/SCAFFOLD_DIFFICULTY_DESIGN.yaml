              captures: { assessment_id: "$.data[0].id" }
          trigger:
            - call: "POST /entitlement/applications/${app_id}/withdraw"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "GET /entitlement/assessments/${assessment_id}"
              payload: {}
              as: StaffReviewer
              as_user_id: "${rev_id}"
              captures: { a_status: $.data.status }
            - call: "GET /entitlement/hearings/${hearing_id}"
              payload: {}
