    description: "Release a quarantined lot after rework; a different person from the inspectors is required"
    roles: [QualityEngineer]
    code: 200
    input: []
    output: PackLot
    side_effects: ["adds the lot's net packed tons to Campaign.packed_tons and re-reconciles unaccounted_loss_tons"]
  - method: POST
    path: "/glass-plant/pack-lots/{pack_lot_id}/palletize"
    description: "Palletize an aged lot to the customer's pallet standard"
    roles: [WarehouseOperator]
    code: 200
    input: []
    output: PackLot
    side_effects: ["computes pallet_count via warehouse_aging_and_palletization"]
  - method: POST
    path: "/glass-plant/pack-lots/{pack_lot_id}/ship"
    description: "Ship a palletized, released lot to the customer's filling line"
    roles: [WarehouseOperator]
    code: 200
    input: []
    output: PackLot
    side_effects: ["sets shipped_at to the logical clock"]

  - method: POST
    path: "/glass-plant/complaints"
    description: "Log a line-breakage complaint against a shipped lot"
    roles: [CustomerRep]
    code: 201
    input: [customer_id, pack_lot_id, code, reported_at, affected_units, filling_line_speed_bpm]
    output: Complaint
    side_effects: ["computes breakage_ppm from the lot's net_packed_units"]
  - method: GET
    path: "/glass-plant/complaints"
    description: "List complaints, filterable by customer and by lot"
    roles: [PlantManager, QualityEngineer, CustomerRep]
    code: 200
    input: ["customer_id?", "pack_lot_id?", "status?", "attribution?", "limit?", "offset?"]
    output: Complaint[]
    side_effects: []
  - method: GET
    path: "/glass-plant/complaints/{complaint_id}"
    description: "Read one complaint including attribution and credit"
    roles: [PlantManager, QualityEngineer, CustomerRep]
    code: 200
    input: []
    output: Complaint
    side_effects: []
  - method: POST
    path: "/glass-plant/complaints/{complaint_id}/investigate"
    description: "Record the root-cause attribution for a complaint using lot traceability"
    roles: [QualityEngineer]
    code: 200
    input: [attribution, "findings?"]
    output: Complaint
    side_effects: ["records investigated_by_user_id", "returns the lot and quarantines it when attribution is PLANT or SHARED", "increments PackLot.version by 1"]
  - method: POST
    path: "/glass-plant/complaints/{complaint_id}/settle"
    description: "Settle an investigated complaint with a credit or a rejection; a second person is required"
    roles: [CustomerRep]
    code: 200
    input: [settlement]
    output: Complaint
    side_effects: ["computes affected_pallets and credit_usd", "updates Customer.credit_issued_usd, weighted_breakage_ppm and quality_standing", "suspends live lightweighting programs when the customer becomes CRITICAL", "increments Customer.version by 1"]

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role header missing or not one of the seven declared roles"
  - id: ERR_MISSING_USER_ID
    http: 401
    condition: "X-User-ID header missing or empty"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the caller's role is not listed on the endpoint"
  - id: ERR_CUSTOMER_SCOPE_VIOLATION
    http: 403
    condition: "a CustomerRep whose X-User-ID is one Customer.id acts on a program or complaint belonging to a different customer"
  - id: ERR_VALIDATION
    http: 400
    condition: "missing required field, wrong type, unknown enum value, out-of-range number, malformed timestamp, or a produced_units value below 1 on a COMPLETED close"

  - id: ERR_FURNACE_NOT_FOUND
    http: 404
    condition: "furnace id in the path or body does not exist"
  - id: ERR_CAMPAIGN_NOT_FOUND
    http: 404
    condition: "campaign id in the path or body does not exist"
  - id: ERR_BATCH_RECIPE_NOT_FOUND
    http: 404
    condition: "batch recipe id in the path or body does not exist"
  - id: ERR_COLOR_CHANGE_NOT_FOUND
    http: 404
    condition: "colour change id in the path does not exist"
  - id: ERR_FORMING_MACHINE_NOT_FOUND
    http: 404
    condition: "forming machine id in the path or body does not exist"
  - id: ERR_CUSTOMER_NOT_FOUND
    http: 404
    condition: "customer id in the path or body does not exist"
  - id: ERR_BOTTLE_DESIGN_NOT_FOUND
    http: 404
    condition: "bottle design id in the path or body, including supersedes_design_id, does not exist"
  - id: ERR_MOLD_SET_NOT_FOUND
    http: 404
    condition: "mold set id in the path or body does not exist"
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "lightweighting program id in the path does not exist"
  - id: ERR_PRODUCTION_JOB_NOT_FOUND
    http: 404
    condition: "production job id in the path does not exist"
  - id: ERR_PACK_LOT_NOT_FOUND
    http: 404
    condition: "pack lot id in the path or body does not exist"
  - id: ERR_COMPLAINT_NOT_FOUND
    http: 404
    condition: "complaint id in the path does not exist"

  - id: ERR_CAMPAIGN_STATE_INVALID
    http: 409
    condition: "campaign is not in the state the requested transition allows"
  - id: ERR_CAMPAIGN_NOT_ACTIVE
    http: 409
    condition: "a production job is created or started against a campaign that is not ACTIVE"
  - id: ERR_JOB_STATE_INVALID
    http: 409
    condition: "production job is not in the state the requested transition allows"
  - id: ERR_MOLD_SET_STATE_INVALID
    http: 409
    condition: "mold set is absent from the job, or not in the state the requested transition allows"
  - id: ERR_DESIGN_STATE_INVALID
    http: 409
    condition: "bottle design is not in the state the requested transition allows"
  - id: ERR_DESIGN_NOT_APPROVED
    http: 409
    condition: "a job is started against a bottle design that is not APPROVED"
  - id: ERR_RECIPE_NOT_APPROVED
    http: 409
    condition: "a job is started against a batch recipe whose approved flag is false"
  - id: ERR_PROGRAM_STATE_INVALID
    http: 409
    condition: "lightweighting program is not in the state the requested transition allows"
  - id: ERR_LOT_STATE_INVALID
    http: 409
    condition: "the lot's quality_status or logistics_status does not permit the requested transition"
  - id: ERR_COMPLAINT_STATE_INVALID
    http: 409
    condition: "complaint is not in the state the requested transition allows, including settling a complaint whose attribution is UNDETERMINED or CUSTOMER"
  - id: ERR_COLOR_CHANGE_STATE_INVALID
    http: 409
    condition: "colour change is not SCHEDULED when completed or aborted"
  - id: ERR_FURNACE_POSTURE_BLOCKED
    http: 409
    condition: "campaign activation on a COLD furnace, or job start on a furnace in REBUILD_DUE or COLD"
  - id: ERR_FURNACE_CAMPAIGN_CONFLICT
    http: 409
    condition: "the furnace already has a campaign in ACTIVE or WIND_DOWN"
  - id: ERR_RUNNING_JOB_PRESENT
    http: 409
    condition: "a RUNNING job blocks campaign wind-down, colour-change completion or mold-set unmount"
  - id: ERR_OPEN_JOBS_PRESENT
    http: 409
    condition: "a rebuild is scheduled while jobs on the campaign are still SCHEDULED or RUNNING"
  - id: ERR_OPEN_LOTS_PRESENT
    http: 409
    condition: "a campaign is closed while one of its lots is still PENDING_INSPECTION"

  - id: ERR_STALE_FURNACE_VERSION
    http: 412
    condition: "expected_furnace_version does not equal the furnace's current version on job create"
  - id: ERR_STALE_DESIGN_VERSION
    http: 412
    condition: "expected_design_version does not equal the design's current version on program create"

  - id: ERR_CULLET_RATIO_UNSAFE
    http: 422
    condition: "cullet_ratio_pct above the colour purity limit for the recipe's colour"
  - id: ERR_COLOR_MISMATCH
    http: 422
    condition: "the job's batch recipe colour or bottle design colour differs from the furnace's current_color"
  - id: ERR_OVER_PULL_LIMIT
    http: 422
    condition: "planned_pull_tpd above 1.15 x design_pull_tpd, or above design_pull_tpd while the furnace is RESTRICTED"
  - id: ERR_RISK_INDEX_ABOVE_CAP
    http: 422
    condition: "risk sign-off attempted on a design whose breakage_risk_index exceeds 55.00"
  - id: ERR_RISK_DELTA_ABOVE_CAP
    http: 422
    condition: "pilot decision on a program whose breakage_risk_delta exceeds 30.00"

  - id: ERR_FURNACE_MISMATCH
    http: 422
    condition: "the job's machine, recipe or campaign belongs to a different furnace than the job's furnace_id"
  - id: ERR_MOLD_SET_DESIGN_MISMATCH
    http: 422
    condition: "the mold set named on the job belongs to a different bottle design"
  - id: ERR_TARGET_WEIGHT_NOT_LIGHTER
    http: 422
    condition: "target_weight_g is not strictly less than the baseline design's nominal_weight_g"
  - id: ERR_LOT_CUSTOMER_MISMATCH
    http: 422
    condition: "the complaint's pack lot belongs to a different customer than customer_id"

  - id: ERR_WINDOW_ORDER_INVALID
    http: 422
    condition: "window_end_at is not strictly after window_start_at, or the rebuild window starts before the campaign window ends"
  - id: ERR_JOB_WINDOW_OUTSIDE_CAMPAIGN
    http: 422
    condition: "the job window is not fully contained in its campaign window"
  - id: ERR_MACHINE_WINDOW_CONFLICT
    http: 409
    condition: "the half-open job window overlaps another live job's window on the same machine once the changeover buffer is appended"
  - id: ERR_COLOR_CHANGE_WINDOW_CONFLICT
    http: 409
    condition: "the closed colour-change window overlaps another colour change on the furnace, or a job window overlaps a scheduled colour-change window"
  - id: ERR_COLOR_CHANGE_RATE_EXCEEDED
    http: 409
    condition: "more than 4 colour changes fall inside a rolling 30-day window on one furnace"
  - id: ERR_WINDOW_NOT_ELAPSED
    http: 409
    condition: "a colour change is completed before its window_end_at, or a lot is palletized before aged_until_at"

  - id: ERR_CODE_NOT_UNIQUE
    http: 409
    condition: "code, account_code or lot_code already used in the same collection"
  - id: ERR_CAVITY_CAPACITY_EXCEEDED
    http: 409
    condition: "mounting the mold set would push mounted_cavities above the machine's max_cavities"
  - id: ERR_NO_INSPECTION_RECORDS
    http: 409
    condition: "a lot release is attempted with zero inspection results recorded"
  - id: ERR_REJECTS_EXCEED_PACKED
    http: 422
    condition: "cumulative rejected_units would exceed the lot's packed_units"
  - id: ERR_AFFECTED_UNITS_EXCEED_LOT
    http: 422
    condition: "complaint affected_units exceeds the lot's net_packed_units"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the same X-User-ID performs both halves of a two-person control (risk-signoff/approve, investigate/settle, inspect/rework-release)"
  - id: ERR_PALLET_STANDARD_MISMATCH
    http: 409
    condition: "the lot's snapshot palletization_standard no longer matches the customer's current standard at ship time"

  - id: ERR_TARGET_PULL_EXCEEDS_DESIGN
    http: 422
    condition: "campaign target_pull_tpd exceeds the furnace's design_pull_tpd"
  - id: ERR_PULL_CAPACITY_EXCEEDED
    http: 409
    condition: "the job's reserved_melt_tons exceeds the campaign's remaining pull pool"

roles:
  - name: PlantManager
    description: "Owns furnaces, campaigns, machines, customers and program adoption"
    identity: opaque
    exclusive_operations:
      - "POST /glass-plant/furnaces"
      - "POST /glass-plant/campaigns"
      - "POST /glass-plant/campaigns/{campaign_id}/activate"
      - "POST /glass-plant/campaigns/{campaign_id}/wind-down"
      - "POST /glass-plant/campaigns/{campaign_id}/schedule-rebuild"
      - "POST /glass-plant/campaigns/{campaign_id}/close"
      - "POST /glass-plant/forming-machines"
      - "POST /glass-plant/customers"
      - "PATCH /glass-plant/customers/{customer_id}/palletization-standard"
      - "POST /glass-plant/lightweighting-programs/{program_id}/adopt"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all GET reads except GET /glass-plant/mold-sets ownership filters"
  - name: PlantScheduler
    description: "Schedules, starts, closes and cancels forming jobs against the pull pool"
    identity: opaque
    exclusive_operations:
      - "POST /glass-plant/production-jobs"
      - "POST /glass-plant/production-jobs/{production_job_id}/start"
      - "POST /glass-plant/production-jobs/{production_job_id}/close"
      - "POST /glass-plant/production-jobs/{production_job_id}/cancel"
    shared_operations:
      - "GET reads on furnaces, campaigns, recipes, colour changes, machines, designs, mold sets, jobs and lots"
  - name: BatchHouseTech
    description: "Owns batch recipes, cullet ratios and colour-change planning"
    identity: opaque
    exclusive_operations:
      - "POST /glass-plant/batch-recipes"
      - "POST /glass-plant/batch-recipes/{batch_recipe_id}/approve"
      - "POST /glass-plant/color-changes"
      - "POST /glass-plant/color-changes/{color_change_id}/complete"
      - "POST /glass-plant/color-changes/{color_change_id}/abort"
    shared_operations:
      - "GET reads on furnaces, campaigns, recipes, colour changes and jobs"
  - name: MoldEngineer
    description: "Owns bottle design drafting and mold set inventory"
    identity: opaque
    exclusive_operations:
      - "POST /glass-plant/bottle-designs"
      - "POST /glass-plant/bottle-designs/{bottle_design_id}/submit"
      - "POST /glass-plant/mold-sets"
      - "POST /glass-plant/mold-sets/{mold_set_id}/unmount"
      - "POST /glass-plant/mold-sets/{mold_set_id}/send-to-repair"
      - "POST /glass-plant/mold-sets/{mold_set_id}/return-from-repair"
    shared_operations:
      - "GET reads on furnaces, machines, designs, programs, mold sets and jobs"
  - name: QualityEngineer
    description: "Owns design review, risk sign-off, inspection results, lot disposition, complaint investigation and lightweighting risk"
    identity: opaque
    exclusive_operations:
      - "POST /glass-plant/bottle-designs/{bottle_design_id}/request-changes"
      - "POST /glass-plant/bottle-designs/{bottle_design_id}/risk-signoff"
      - "POST /glass-plant/bottle-designs/{bottle_design_id}/approve"
      - "POST /glass-plant/lightweighting-programs"
      - "POST /glass-plant/lightweighting-programs/{program_id}/assess-risk"
      - "POST /glass-plant/lightweighting-programs/{program_id}/suspend"
      - "POST /glass-plant/pack-lots/{pack_lot_id}/inspection-results"
      - "POST /glass-plant/pack-lots/{pack_lot_id}/release"
      - "POST /glass-plant/pack-lots/{pack_lot_id}/rework-release"
      - "POST /glass-plant/complaints/{complaint_id}/investigate"
    shared_operations:
      - "GET reads on furnaces, campaigns, recipes, colour changes, machines, customers, designs, programs, mold sets, jobs, lots, inspection results and complaints"
    note: "two-person controls: the approver must differ from the risk signer, and the rework releaser must differ from every inspector on the lot"
  - name: WarehouseOperator
    description: "Owns warehouse aging, palletization and shipment to filling lines"
    identity: opaque
    exclusive_operations:
      - "POST /glass-plant/pack-lots/{pack_lot_id}/palletize"
      - "POST /glass-plant/pack-lots/{pack_lot_id}/ship"
    shared_operations:
      - "GET reads on furnaces, customers and pack lots"
  - name: CustomerRep
    description: "Acts on behalf of one customer: pilot decisions, complaint filing and settlement"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /glass-plant/lightweighting-programs/{program_id}/customer-decision"
      - "POST /glass-plant/complaints"
      - "POST /glass-plant/complaints/{complaint_id}/settle"
    shared_operations:
      - "GET reads on customers, designs, programs, pack lots, inspection results and complaints scoped to the represented customer"
    note: "X-User-ID equals the represented Customer.id and is the only scope source; acting on another customer's program or complaint is ERR_CUSTOMER_SCOPE_VIOLATION"
