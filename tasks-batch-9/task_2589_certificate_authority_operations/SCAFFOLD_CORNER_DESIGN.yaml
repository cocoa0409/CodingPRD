            - "HsmPartition.${part_id}.state is still QUARANTINED (denying is refused, so no cascade compensation runs)"

      - name: a_ceremony_cannot_be_attested_while_its_window_is_still_open
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CEREMONY_WINDOW_OPEN]
          - validations[priority=63]
          - state_machines.KeyCeremony.transitions.WITNESSED_to_ATTESTED
        distinguishing_aspect: "The gate is on the logical clock, not on the ceremony's state: the ceremony is already WITNESSED with two distinct witnesses (so the priority 47 check passes) yet attesting at 2026-08-01T00:00:00Z is refused because the clock is strictly before window_end. The comparison is inclusive, so attesting at exactly window_end (2026-08-01T00:30:00Z) succeeds."
        test_recipe:
          setup:
            - "One WITNESSED ceremony with window 2026-08-01T00:00:00Z .. 2026-08-01T00:30:00Z while the clock is still at window_start."
