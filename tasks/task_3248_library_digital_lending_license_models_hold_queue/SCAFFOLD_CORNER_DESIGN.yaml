          assert:
            - "Patron.${patd_id}.created_at == 2026-09-01T00:00:00Z"
            - "Patron.${patd_id}.card_expires_at == 2028-08-31T00:00:00Z (default clock + 730 days)"

      - name: fulfill_with_higher_invoice_than_estimate_moves_ledger_by_actuals
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/lending/acquisition-orders/{id}/fulfill
        distinguishing_aspect: "Fulfillment may invoice above the estimate: estimate 5000 committed at approve; invoiced 5500 at fulfill leaves committed 0 and spent 5500 — the ledger delta uses the actual, not the estimate."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Library L, fund (budget 1000000), title T (ocou 5000); order approved."
          setup_api_calls:
            - *k_clock
            - *k_cons
            - *k_lib
            - *k_fund
            - *k_title
            - *k_order
            - *k_propose
            - *k_approve
          trigger:
            - call: "POST /lending/acquisition-orders/${order_id}/fulfill"
              payload: { invoiced_cost_cents: 5500 }
              as: LibraryAdmin
              as_user_id: "${lib_id}"
            - call: "GET /lending/budget-funds/${fund_id}"
              payload: {}
              as: LibraryAdmin
              as_user_id: "${lib_id}"
          assert:
            - "AcquisitionOrder.${order_id}.status == FULFILLED and invoiced_cost_cents == 5500"
            - "BudgetFund.${fund_id}.committed_cents == 0 and spent_cents == 5500"
            - "available_committed_cents == 994500 and available_actual_cents == 994500 (variants converge when nothing is committed)"

