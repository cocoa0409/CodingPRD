            - call: "POST /signing-pools"
              payload: { season_year: 2026, base_pool_cents: 5000000 }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { du_pool: $.data.id }
            - call: "POST /affiliates"
              payload: { name: "Duplicate Club", level: "HIGH_A", market_city: "Asheville", meal_stipend_cents_per_day: 2800 }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { du_aff: $.data.id }
