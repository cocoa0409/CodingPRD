  # ===========================================================================
  # Rule 3 — non_linear_state_machine: two non-linear machines on DIFFERENT
  # entities (cyclic StuffedAnimal vs branching/auto PartyReservation).
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: stuffed_animal_lost_recovery_cycle
        grounds:
          - state_machines.StuffedAnimal.COMPLETED_to_LOST_REPORTED
          - state_machines.StuffedAnimal.LOST_REPORTED_to_COMPLETED
          - state_machines.StuffedAnimal.LOST_REPORTED_to_RECOVERED
        distinguishing_aspect: |
          StuffedAnimal is cyclic: COMPLETED -> LOST_REPORTED -> COMPLETED (via
          mark-found-cancel) and COMPLETED -> LOST_REPORTED -> RECOVERED form a
          loop back through a previously visited state, unlike a linear pipeline.
        test_recipe:
          setup:
