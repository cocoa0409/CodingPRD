        distinguishing_aspect: "Each collection answers with its OWN 404 code rather than a generic one: permits give ERR_PERMIT_NOT_FOUND, standby-events give ERR_STANDBY_EVENT_NOT_FOUND, invoices give ERR_INVOICE_NOT_FOUND, engineering-reviews give ERR_REVIEW_NOT_FOUND and gear-assignments give ERR_GEAR_ASSIGNMENT_NOT_FOUND."
