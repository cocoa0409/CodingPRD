      - name: conditionally_required_and_conditionally_forbidden_fields_both_enforced
        claim_type: conditional_validation
        grounds:
          - state_machines.Appraisal.ORDERED_to_RECEIVED
          - entities.BorrowerRequest.fields.suite_code
          - validations[priority=5]
        distinguishing_aspect: "The same field flips between required and forbidden depending on a sibling enum: estimated_liquidation_expenses_usd is mandatory on a FULL_NARRATIVE appraisal and forbidden on an UPDATE, so BOTH omission and presence can be the violation. The mirror case on BorrowerRequest is a MODIFICATION carrying a LEASE_APPROVAL-only suite_code. Once the FULL_NARRATIVE appraisal is finally accepted, the conditional field selects the NET_LIQUIDATION_BASIS variant."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; loan principal 10,000,000.00 in SPECIAL_SERVICING with no advances."
            - "One UPDATE appraisal and one FULL_NARRATIVE appraisal, both ORDERED, both targeting as_of_date 2026-08-01 (no window is occupied until one is RECEIVED)."
          setup_api_calls:
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-V24", closing_date: "2026-01-15T00:00:00Z", original_controlling_class_balance_usd: 40000000 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { trust_id: "$.data.id" }
            - call: "POST /special-servicing/loans"
              payload: { trust_id: "${trust_id}", loan_number: "L-V24", original_balance_usd: 12000000, current_principal_balance_usd: 10000000, note_rate_pct: 6.0, monthly_debt_service_usd: 65000, maturity_date: "2029-06-01T00:00:00Z", securitization_value_usd: 15000000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_id: "$.data.id" }
            - call: "POST /special-servicing/transfer-events"
              payload: { loan_id: "${loan_id}", event_code: "BANKRUPTCY", occurred_on: "2026-07-01T00:00:00Z", evidence_note: "chapter 11 petition" }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "POST /special-servicing/loans/${loan_id}/servicing-status"
              payload: { to_status: "SPECIAL_SERVICING" }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "POST /special-servicing/appraisals"
              payload: { loan_id: "${loan_id}", appraisal_type: "UPDATE", ordered_on: "2026-08-01T00:00:00Z", appraiser_firm: "Acme Valuation", valuation_valid_months: 12 }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { update_id: "$.data.id" }
            - call: "POST /special-servicing/appraisals"
              payload: { loan_id: "${loan_id}", appraisal_type: "FULL_NARRATIVE", ordered_on: "2026-08-01T00:00:00Z", appraiser_firm: "Beta Valuation", valuation_valid_months: 12 }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { narrative_id: "$.data.id" }
          trigger:
            - call: "POST /special-servicing/appraisals/${update_id}/status"
              payload: { to_status: "RECEIVED", value_usd: 6000000, as_of_date: "2026-08-01T00:00:00Z", estimated_liquidation_expenses_usd: 400000 }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { forbidden_error: "$.data.error_id" }
            - call: "POST /special-servicing/appraisals/${narrative_id}/status"
              payload: { to_status: "RECEIVED", value_usd: 6000000, as_of_date: "2026-08-01T00:00:00Z" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { missing_error: "$.data.error_id" }
            - call: "POST /special-servicing/borrower-requests"
              payload: { loan_id: "${loan_id}", request_type: "MODIFICATION", processing_fee_deposit_usd: 30000, requested_terms_note: "rate cut", suite_code: "SUITE-200" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { mismatched_field_error: "$.data.error_id" }
            - call: "POST /special-servicing/appraisals/${narrative_id}/status"
              payload: { to_status: "RECEIVED", value_usd: 6000000, as_of_date: "2026-08-01T00:00:00Z", estimated_liquidation_expenses_usd: 400000 }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { narrative_status: "$.data.status", narrative_expenses: "$.data.estimated_liquidation_expenses_usd" }
            - call: "POST /special-servicing/appraisals/${narrative_id}/status"
              payload: { to_status: "ACCEPTED" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-002"
            - call: "GET /special-servicing/appraisal-reductions"
              payload: { appraisal_id: "${narrative_id}" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { ara_basis: "$.data[0].calculation_basis", ara_credit: "$.data[0].appraisal_credit_usd", ara_amount: "$.data[0].ara_amount_usd" }
          assert:
            - "UPDATE + estimated_liquidation_expenses_usd returns HTTP 400 with error_id ERR_INVALID_REQUEST — the field is conditionally FORBIDDEN"
            - "FULL_NARRATIVE without estimated_liquidation_expenses_usd returns HTTP 400 with error_id ERR_INVALID_REQUEST — the same field is conditionally REQUIRED"
            - "MODIFICATION + suite_code returns HTTP 400 with error_id ERR_INVALID_REQUEST, and no BorrowerRequest row is created"
            - "The refused UPDATE appraisal is still status ORDERED with value_usd null, so its coverage window was never claimed"
            - "The compliant FULL_NARRATIVE call succeeds: status RECEIVED, estimated_liquidation_expenses_usd 400000.00, coverage window [2026-08-01, 2027-08-01)"
            - "Its reduction uses calculation_basis NET_LIQUIDATION_BASIS with appraisal_credit_usd 5040000.00 (0.90 * 5,600,000) and ara_amount_usd 4960000.00"
            - "Had the same 6,000,000 value arrived on an UPDATE, the credit would have been 5400000.00 and the reduction 4600000.00 — the conditional field is what selects the variant"

