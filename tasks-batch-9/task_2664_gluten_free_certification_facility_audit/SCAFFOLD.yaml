scenario: |
  Generate task harder than expert level!

  2664. Gluten-Free Certification & Facility Audit (Gluten-Free Certification Organization): applicant product and ingredient review with supplier documentation, threshold standard testing plan and lot sampling frequency, facility audit for shared equipment, air handling and sanitation validation, certification issuance with mark usage rules and label review, annual surveillance audit and unannounced product testing, nonconformance, corrective action and certificate suspension, ingredient or supplier change notification requirements, consumer complaint investigation and recall interaction

domain_name: gluten-free-certification-facility-audit
api_prefix: "/gfco"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: graph_constraint
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - selector_policy

  entity_topology: graph
  # Applicant/Facility/Supplier/Ingredient/Product form a directed graph rather than a
  # single ownership tree: Ingredient is many-to-many with Product via the
  # ProductIngredient junction, Ingredient is self-referential (compound ingredient ->
  # sub-component), SupplierDocument sits on the Supplier x Ingredient edge, and
  # Nonconformance is polymorphic across Audit / LotTest / ConsumerComplaint sources.
  # URL paths are flat collections under /gfco; parents are named by FK fields in the body.

  state_machine_shape: cyclic
  # Ingredient (APPROVED -> BLOCKED -> UNDER_REVIEW -> APPROVED) and Nonconformance
  # (CA_SUBMITTED -> CA_REJECTED -> CA_SUBMITTED) are true cycles; Certificate
  # (ISSUED -> SUSPENDED -> ISSUED) is a second cycle; Product carries two independent
  # parallel state dimensions (formula_status x label_status); Audit closes through a
  # three-way branch (CLOSED_PASS | CLOSED_CONDITIONAL | CLOSED_FAIL) with divergent
  # side-effect sets per branch.

  relationship_patterns:
    - one_to_many          # Applicant -> Facility, Facility -> Audit, Product -> LotTest
    - many_to_many         # Product <-> Ingredient via ProductIngredient
    - self_referential     # Ingredient.parent_ingredient_id -> Ingredient.id
    - polymorphic          # Nonconformance.source_type over Audit | LotTest | ConsumerComplaint
    - cross_aggregate      # Certificate.applicant_id and Nonconformance.applicant_id denormalize across aggregates

  role_model: segregation_of_duties
  # The CertificationDecisionMaker who issues a Certificate must be a different
  # X-User-ID from the FieldAuditor who closed the facility's latest audit AND from the
  # CertificationReviewer who cleared the product formula. The CertificationReviewer who
  # decides a corrective-action plan must differ from the user who raised the
  # nonconformance.

  consistency_model: immediate

  difficulty_level: beyond_expert
  # 13 entities / 58 endpoints / 56 error codes / 11 calculations (2 with variants) /
  # 13 state machines / 44 validation rules / 6 roles. Explicitly above the Expert band
  # of SKILL.md 0.4 because the task
  # request asks for "harder than expert level"; the extra surface is concentrated in
  # read endpoints mandated by FK reverse-reachability, not in new mechanics.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered legal name of the applicant company.
      - name: contact_email
        type: string
        source: input
        description: Primary contact e-mail for certification correspondence.
      - name: country_code
        type: string
        source: input
        description: ISO 3166-1 alpha-2 country of incorporation.
        constraints: exactly 2 uppercase letters
      - name: current_cycle_started_on
        type: datetime
        source: computed
        description: >-
          Earliest Certificate.issued_on among Certificates of this Applicant whose
          status IN {ISSUED, SUSPENDED}; null when no such Certificate exists. Defines
          the CERTIFICATION_CYCLE window of calculations.applicant_compliance_posture.
        default: null
      - name: open_nc_penalty_points
        type: integer
        source: computed
        description: >-
          Output of calculations.open_nc_penalty_points - weighted point balance of this
          Applicant's Nonconformances whose status IN {OPEN, CA_SUBMITTED, CA_REJECTED,
          ESCALATED}.
        default: 0
      - name: active_certified_product_count
        type: integer
        source: computed
        description: >-
          Output of calculations.active_certified_product_count - count of Certificates of
          this Applicant whose status == ISSUED.
        default: 0
      - name: suspended_certificate_count
        type: integer
        source: computed
        description: Count of Certificates of this Applicant whose status == SUSPENDED.
        default: 0
      - name: revoked_certificate_count
        type: integer
        source: computed
        description: Count of Certificates of this Applicant whose status == REVOKED.
        default: 0
      - name: substantiated_complaint_count_rolling
        type: integer
        source: computed
        description: >-
          Count of ConsumerComplaints of this Applicant's Certificates whose status IN
          {SUBSTANTIATED, RECALL_COORDINATION, CLOSED} AND outcome_evidence != NO_EVIDENCE
          AND reported_on IN [clock_now - 365 days, clock_now].
        default: 0
      - name: substantiated_complaint_count_cycle
        type: integer
        source: computed
        description: >-
          Same population as substantiated_complaint_count_rolling but windowed on
          [current_cycle_started_on, clock_now]; 0 when current_cycle_started_on is null.
        default: 0
      - name: posture_score_rolling_12m
        type: number
        source: computed
        description: ROLLING_12_MONTH variant output of calculations.applicant_compliance_posture.
        default: 100
      - name: posture_score_cycle
        type: number
        source: computed
        description: CERTIFICATION_CYCLE variant output of calculations.applicant_compliance_posture.
        default: 100
      - name: compliance_posture
        type: enum
        source: computed
        description: >-
          Posture band derived from posture_score_cycle (the CERTIFICATION_CYCLE variant)
          plus the revoked-certificate override; gates Certificate issuance and
          ChangeNotification submission.
        default: GOOD_STANDING
        constraints: one of {GOOD_STANDING, WATCH, PROBATION, SUSPENDED}
      - name: fee_balance_cents
        type: integer
        source: computed
        description: >-
          Conserved fee quantity == sum of Certificate.total_fee_cents over this
          Applicant's Certificates where fee_charged == true AND fee_refunded == false.
        default: 0

  - name: Facility
    parent: Applicant
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: FK -> Applicant.id; the applicant that operates this manufacturing site.
      - name: site_name
        type: string
        source: input
        description: Human-readable site name.
      - name: shared_equipment_present
        type: boolean
        source: input
        description: True when at least one production line also runs gluten-containing product.
        default: false
      - name: gluten_containing_operations
        type: enum
        source: input
        description: Degree of physical co-location with gluten-containing operations.
        default: NONE
        constraints: one of {NONE, ADJACENT_LINES, SAME_LINE}
      - name: air_handling_class
        type: enum
        source: input
        description: Air-handling containment class of the gluten-free production area.
        constraints: one of {OPEN_PLENUM, FILTERED_ZONED, DEDICATED_NEGATIVE_PRESSURE}
      - name: sanitation_validation_status
        type: enum
        source: system
        description: Sanitation-validation lifecycle state of the facility.
        default: UNVALIDATED
        constraints: one of {UNVALIDATED, VALIDATED, EXPIRED}
      - name: sanitation_method
        type: enum
        source: system
        description: Assay used for the accepted post-sanitation swab; null while UNVALIDATED.
        default: null
        constraints: one of {R5_ELISA, G12_ELISA, COMPETITIVE_ELISA}
      - name: sanitation_swab_ppm
        type: number
        source: system
        description: Post-sanitation swab result in ppm recorded by the accepted validation.
        default: null
      - name: sanitation_validated_on
        type: datetime
        source: system
        description: Date of the accepted sanitation validation.
        default: null
      - name: sanitation_expires_on
        type: datetime
        source: computed
        description: sanitation_validated_on + SANITATION_VALIDITY_DAYS (365).
        default: null
      - name: last_closed_audit_outcome
        type: enum
        source: computed
        description: >-
          status of the Audit of this Facility with the greatest closed_on (tie-break
          created_at ASC) among Audits whose status IN {CLOSED_PASS, CLOSED_CONDITIONAL,
          CLOSED_FAIL}; NONE when no Audit has closed.
        default: NONE
        constraints: one of {NONE, CLOSED_PASS, CLOSED_CONDITIONAL, CLOSED_FAIL}
      - name: last_closed_audit_closed_on
        type: datetime
        source: computed
        description: closed_on of the Audit selected by last_closed_audit_outcome.
        default: null

  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Supplier legal name.
      - name: country_code
        type: string
        source: input
        description: ISO 3166-1 alpha-2 country of the supplying site.
        constraints: exactly 2 uppercase letters
      - name: gluten_handling_disclosed
        type: boolean
        source: input
        description: True when the supplier has disclosed handling of gluten-containing grains.
        default: false
      - name: status
        type: enum
        source: system
        description: Supplier standing in the program; SUSPENDED blocks all ingredients it supplies.
        default: ACTIVE
        constraints: one of {ACTIVE, UNDER_REVIEW, SUSPENDED}
      - name: verified_document_count
        type: integer
        source: computed
        description: Count of SupplierDocuments of this Supplier whose status == VERIFIED.
        default: 0

  - name: SupplierDocument
    parent: Supplier
    common_fields: true
    fields:
      - name: supplier_id
        type: string
        source: input
        description: FK -> Supplier.id; the supplier that issued this document.
      - name: ingredient_id
        type: string
        source: input
        description: FK -> Ingredient.id; the ingredient whose gluten status this document evidences.
      - name: doc_type
        type: enum
        source: input
        description: Document class within the supplier documentation package.
        constraints: one of {ALLERGEN_STATEMENT, PROCESS_FLOW, COA, GF_CERTIFICATE_OF_ORIGIN}
      - name: issued_on
        type: datetime
        source: input
        description: Date the supplier issued the document.
      - name: expires_on
        type: datetime
        source: input
        description: Date after which the document no longer evidences the ingredient.
      - name: lab_ppm_claim
        type: number
        source: input
        description: Gluten ppm claimed by the certificate of analysis; null for non-COA types.
        default: null
      - name: status
        type: enum
        source: system
        description: Verification lifecycle state of the document.
        default: PENDING
        constraints: one of {PENDING, VERIFIED, REJECTED, EXPIRED}
      - name: verified_by_user_id
        type: string
        source: system
        description: X-User-ID of the CertificationReviewer that decided the document.
        default: null
      - name: verified_on
        type: datetime
        source: system
        description: Logical-clock instant of the verification decision.
        default: null
      - name: rejection_reason
        type: enum
        source: system
        description: Reason recorded when status == REJECTED.
        default: null
        constraints: one of {ILLEGIBLE, PPM_ABOVE_LIMIT, EXPIRED_ON_SUBMISSION, SCOPE_MISMATCH}

  - name: Ingredient
    parent: Applicant
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: FK -> Applicant.id; the applicant that declared this ingredient.
      - name: supplier_id
        type: string
        source: input
        description: FK -> Supplier.id; the supplier of this ingredient.
      - name: parent_ingredient_id
        type: string
        source: input
        description: >-
          FK -> Ingredient.id; the compound ingredient this row is a sub-component of;
          null for top-level ingredients. Must not equal this row's own id.
        default: null
      - name: name
        type: string
        source: input
        description: Ingredient trade name.
      - name: risk_class
        type: enum
        source: input
        description: Gluten cross-contact risk class; drives required documents, threshold cap and sampling weight.
        constraints: one of {INHERENTLY_GF, GF_PROCESSED, HIGH_RISK_GRAIN}
      - name: status
        type: enum
        source: system
        description: Ingredient review lifecycle state.
        default: DRAFT
        constraints: one of {DRAFT, UNDER_REVIEW, APPROVED, REJECTED, BLOCKED}
      - name: review_cycle_count
        type: integer
        source: computed
        description: Number of times this ingredient has entered UNDER_REVIEW.
        default: 0
      - name: verified_doc_types
        type: array
        source: computed
        description: >-
          Sorted-ascending list of distinct SupplierDocument.doc_type values for
          SupplierDocuments whose ingredient_id == this id AND status == VERIFIED.
        default: []
      - name: blocked_reason
        type: enum
        source: computed
        description: Reason recorded when status == BLOCKED.
        default: null
        constraints: one of {SUPPLIER_SUSPENDED, DOCUMENT_EXPIRED, DOCUMENT_REJECTED, SUB_COMPONENT_BLOCKED}
      - name: rejection_reason
        type: enum
        source: system
        description: Reason recorded when status == REJECTED.
        default: null
        constraints: one of {DOCS_INSUFFICIENT, PPM_CLAIM_TOO_HIGH, SUPPLIER_UNDISCLOSED_GLUTEN}
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the CertificationReviewer that last decided this ingredient.
        default: null
      - name: approved_on
        type: datetime
        source: system
        description: Logical-clock instant of the most recent APPROVE decision.
        default: null

  - name: Product
    parent: Applicant
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: FK -> Applicant.id; the applicant that owns this product.
      - name: facility_id
        type: string
        source: input
        description: FK -> Facility.id; the facility where this product is manufactured.
      - name: name
        type: string
        source: input
        description: Product name as it appears on the label.
      - name: sku
        type: string
        source: input
        description: Applicant-scoped stock keeping unit; unique per applicant_id.
        constraints: unique within applicant_id
      - name: requested_mark_tier
        type: enum
        source: input
        description: Mark tier the applicant requests; caps the certified threshold.
        default: STANDARD
        constraints: one of {STANDARD, PREMIUM, ELITE}
      - name: formula_status
        type: enum
        source: system
        description: >-
          Formula/ingredient review dimension. Independent of label_status - the two
          dimensions advance through separate endpoints and separate cascades.
        default: DRAFT
        constraints: one of {DRAFT, CLEARED, REJECTED, BLOCKED}
      - name: label_status
        type: enum
        source: system
        description: >-
          Label and mark-usage review dimension. Independent of formula_status; FROZEN is
          reached only by the certificate-suspension cascade.
        default: NOT_SUBMITTED
        constraints: one of {NOT_SUBMITTED, APPROVED, REJECTED, FROZEN}
      - name: testing_plan_status
        type: enum
        source: system
        description: Whether an active threshold-standard testing plan exists for this product.
        default: NONE
        constraints: one of {NONE, ACTIVE}
      - name: testing_plan_revision
        type: integer
        source: computed
        description: Number of accepted testing plans; each new plan supersedes the prior one.
        default: 0
      - name: threshold_ppm
        type: number
        source: computed
        description: Output of calculations.threshold_standard_selection; null while testing_plan_status == NONE.
        default: null
      - name: sampling_lots_per_year
        type: integer
        source: computed
        description: Output of calculations.lot_sampling_frequency; null while testing_plan_status == NONE.
        default: null
      - name: sampling_exclusion_days
        type: integer
        source: computed
        description: >-
          max(MIN_SAMPLING_EXCLUSION_DAYS, floor(365 / sampling_lots_per_year)); length of
          the closed exclusion interval each SCHEDULED LotTest occupies on this product.
        default: null
      - name: mark_tier_granted
        type: enum
        source: system
        description: Mark tier granted by the accepted label review; NONE until label_status == APPROVED.
        default: NONE
        constraints: one of {NONE, STANDARD, PREMIUM, ELITE}
      - name: formula_cleared_by_user_id
        type: string
        source: system
        description: X-User-ID of the CertificationReviewer whose decision set formula_status == CLEARED.
        default: null
      - name: label_reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the CertificationReviewer that last decided the label.
        default: null
      - name: linked_ingredient_count
        type: integer
        source: computed
        description: Count of ProductIngredient rows whose product_id == this id.
        default: 0
      - name: blocked_ingredient_count
        type: integer
        source: computed
        description: >-
          Count of ProductIngredient rows of this product whose Ingredient.status ==
          BLOCKED.
        default: 0
      - name: last_scheduled_sample_on
        type: datetime
        source: computed
        description: >-
          Greatest LotTest.sample_collected_on among LotTests of this product whose
          test_type == SCHEDULED AND status == RECORDED; null when none exists.
        default: null
      - name: label_rejection_reason
        type: enum
        source: system
        description: Reason recorded when label_status == REJECTED.
        default: null
        constraints: one of {MARK_PLACEMENT_INVALID, UNSUPPORTED_CLAIM, MISSING_CERT_NUMBER, TIER_MISMATCH}

  - name: ProductIngredient
    parent: Product
    common_fields: false
    fields:
      - name: product_id
        type: string
        source: input
        description: FK -> Product.id; the product this line belongs to.
      - name: ingredient_id
        type: string
        source: input
        description: FK -> Ingredient.id; the ingredient consumed on this line.
      - name: inclusion_pct
        type: number
        source: input
        description: Percentage of finished-product mass contributed by this ingredient.
        constraints: 0 < inclusion_pct <= 100
      - name: is_risk_carrier
        type: boolean
        source: computed
        description: True iff the referenced Ingredient.risk_class != INHERENTLY_GF at link-creation time.

  - name: LotTest
    parent: Product
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: FK -> Product.id; the certified or pending product the lot belongs to.
      - name: lot_code
        type: string
        source: input
        description: Manufacturer lot code sampled.
      - name: test_type
        type: enum
        source: input
        description: >-
          SCHEDULED lots consume the testing plan's sampling slots and are subject to the
          exclusion interval; UNANNOUNCED and FOR_CAUSE lots are exempt from it.
        constraints: one of {SCHEDULED, UNANNOUNCED, FOR_CAUSE}
      - name: sample_collected_on
        type: datetime
        source: input
        description: Date the lot sample was collected; must be <= the logical clock.
      - name: ppm_result
        type: number
        source: input
        description: Gluten concentration reported by the laboratory, in ppm.
        constraints: ppm_result >= 0
      - name: lab_method
        type: enum
        source: input
        description: Assay used by the laboratory.
        constraints: one of {R5_ELISA, G12_ELISA, COMPETITIVE_ELISA}
      - name: threshold_applied_ppm
        type: number
        source: computed
        description: Snapshot of Product.threshold_ppm at record time; the bound the verdict compared against.
      - name: verdict
        type: enum
        source: computed
        description: Output of calculations.lot_test_verdict.
        constraints: one of {PASS, FAIL}
      - name: status
        type: enum
        source: system
        description: RECORDED until a FOR_CAUSE retest of the same lot_code supersedes it.
        default: RECORDED
        constraints: one of {RECORDED, SUPERSEDED_BY_RETEST}
      - name: nonconformance_created
        type: boolean
        source: computed
        description: True when this lot test's FAIL verdict raised a Nonconformance.
        default: false
      - name: in_recall_scope
        type: boolean
        source: computed
        description: True when calculations.recall_scope_determination selected this lot.
        default: false

  - name: Audit
    parent: Facility
    common_fields: true
    fields:
      - name: facility_id
        type: string
        source: input
        description: FK -> Facility.id; the site audited.
      - name: audit_type
        type: enum
        source: input
        description: INITIAL precedes first issuance; SURVEILLANCE is the annual audit; FOR_CAUSE follows an incident.
        constraints: one of {INITIAL, SURVEILLANCE, FOR_CAUSE}
      - name: onsite_start_at
        type: datetime
        source: input
        description: Inclusive start of the on-site occupation interval on this facility.
      - name: onsite_end_at
        type: datetime
        source: input
        description: Exclusive end of the on-site occupation interval; must be > onsite_start_at.
      - name: status
        type: enum
        source: system
        description: Audit lifecycle state; the three CLOSED_* states are the branch outcomes.
        default: SCHEDULED
        constraints: one of {SCHEDULED, IN_PROGRESS, CLOSED_PASS, CLOSED_CONDITIONAL, CLOSED_FAIL, CANCELLED}
      - name: lead_auditor_user_id
        type: string
        source: system
        description: X-User-ID of the FieldAuditor that started the audit.
        default: null
      - name: closed_by_user_id
        type: string
        source: system
        description: X-User-ID of the FieldAuditor that closed the audit; blocks that user from issuing the certificate.
        default: null
      - name: shared_equipment_verified
        type: boolean
        source: input
        description: Auditor attestation at close that shared-equipment changeover controls were verified.
        default: false
      - name: air_handling_verified
        type: boolean
        source: input
        description: Auditor attestation at close that air-handling containment was verified.
        default: false
      - name: sanitation_validation_reviewed
        type: boolean
        source: input
        description: Auditor attestation at close that the facility sanitation validation record was reviewed.
        default: false
      - name: provisional_score
        type: number
        source: computed
        description: PROVISIONAL_ONSITE variant output of calculations.audit_compliance_score, frozen at close.
        default: null
      - name: final_score
        type: number
        source: computed
        description: FINAL_ADJUDICATED variant output of calculations.audit_compliance_score, recomputed on every linked Nonconformance status change.
        default: null
      - name: finding_count
        type: integer
        source: computed
        description: Count of Nonconformances whose audit_id == this id.
        default: 0
      - name: critical_finding_count
        type: integer
        source: computed
        description: Count of Nonconformances whose audit_id == this id AND severity == CRITICAL.
        default: 0
      - name: closed_on
        type: datetime
        source: system
        description: Logical-clock instant at which the audit was closed.
        default: null

  - name: Certificate
    parent: Product
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: FK -> Product.id; the certified product.
      - name: applicant_id
        type: string
        source: system
        description: FK -> Applicant.id; denormalized from Product.applicant_id at issuance for posture aggregation.
      - name: mark_tier_granted
        type: enum
        source: computed
        description: Snapshot of Product.mark_tier_granted at issuance; governs mark usage rules.
        constraints: one of {STANDARD, PREMIUM, ELITE}
      - name: certified_threshold_ppm
        type: number
        source: computed
        description: Snapshot of Product.threshold_ppm at issuance; the ppm bound printed with the mark.
      - name: status
        type: enum
        source: system
        description: Certificate lifecycle state; ISSUED <-> SUSPENDED is a cycle, REVOKED and EXPIRED are terminal.
        default: ISSUED
        constraints: one of {ISSUED, SUSPENDED, REVOKED, EXPIRED}
      - name: surveillance_status
        type: enum
        source: computed
        description: >-
          Independent surveillance dimension recomputed by every surveillance run from
          surveillance_due_on; advances regardless of status.
        default: CURRENT
        constraints: one of {CURRENT, DUE, OVERDUE}
      - name: issued_on
        type: datetime
        source: system
        description: Logical-clock instant of issuance.
      - name: issued_by_user_id
        type: string
        source: system
        description: X-User-ID of the CertificationDecisionMaker that issued the certificate.
      - name: expires_on
        type: datetime
        source: computed
        description: issued_on + CERTIFICATE_TERM_DAYS (1095).
      - name: surveillance_due_on
        type: datetime
        source: computed
        description: Output of calculations.surveillance_schedule - issued_on + SURVEILLANCE_INTERVAL_DAYS (365).
      - name: suspension_count
        type: integer
        source: computed
        description: Number of times this certificate has entered SUSPENDED.
        default: 0
      - name: suspended_on
        type: datetime
        source: system
        description: Logical-clock instant of the most recent suspension; null while never suspended.
        default: null
      - name: suspension_reason
        type: enum
        source: system
        description: Reason recorded on the most recent suspension.
        default: null
        constraints: >-
          one of {FAILED_UNANNOUNCED_TEST, CRITICAL_NONCONFORMANCE, SURVEILLANCE_OVERDUE,
          INGREDIENT_BLOCKED, SUBSTANTIATED_COMPLAINT, CHANGE_REQUIRES_RECERT}
      - name: revoked_on
        type: datetime
        source: system
        description: Logical-clock instant of revocation.
        default: null
      - name: revocation_reason
        type: enum
        source: system
        description: Reason recorded on revocation.
        default: null
        constraints: one of {VOLUNTARY_WITHDRAWAL, UNRESOLVED_NONCONFORMANCE, REPEAT_FAILURE, FRAUD}
      - name: base_fee_cents
        type: integer
        source: computed
        description: Step 1 output of calculations.certification_fee_schedule.
      - name: surveillance_surcharge_cents
        type: integer
        source: computed
        description: Step 3 output of calculations.certification_fee_schedule.
      - name: total_fee_cents
        type: integer
        source: computed
        description: Step 4 output of calculations.certification_fee_schedule.
      - name: fee_charged
        type: boolean
        source: computed
        description: True from issuance onward; contributes total_fee_cents to Applicant.fee_balance_cents.
        default: true
      - name: fee_refunded
        type: boolean
        source: computed
        description: True after a refund-eligible revocation; removes total_fee_cents from Applicant.fee_balance_cents.
        default: false
      - name: mark_usage_locked
        type: boolean
        source: computed
        description: True whenever status != ISSUED; while true the applicant may not display the mark.
        default: false

  - name: Nonconformance
    parent: null
    common_fields: true
    fields:
      - name: applicant_id
        type: string
        source: input
        description: FK -> Applicant.id; the applicant accountable for the finding.
      - name: certificate_id
        type: string
        source: input
        description: FK -> Certificate.id; the affected certificate; null when raised before issuance.
        default: null
      - name: audit_id
        type: string
        source: input
        description: FK -> Audit.id; source audit when source_type == AUDIT; null otherwise.
        default: null
      - name: lot_test_id
        type: string
        source: input
        description: FK -> LotTest.id; source lot test when source_type == LOT_TEST; null otherwise.
        default: null
      - name: complaint_id
        type: string
        source: input
        description: FK -> ConsumerComplaint.id; source complaint when source_type == COMPLAINT; null otherwise.
        default: null
      - name: source_type
        type: enum
        source: input
        description: Polymorphic origin of the finding; determines which of the three source FKs must be present.
        constraints: one of {AUDIT, LOT_TEST, COMPLAINT, CHANGE_NOTIFICATION, SURVEILLANCE_RUN}
      - name: category
        type: enum
        source: input
        description: Finding category; drives the category multiplier of the audit score.
        constraints: >-
          one of {SHARED_EQUIPMENT, AIR_HANDLING, SANITATION, DOCUMENTATION, LABELING,
          THRESHOLD_EXCEEDANCE}
      - name: severity
        type: enum
        source: input
        description: Finding severity; drives penalty points and the corrective-action due window.
        constraints: one of {MINOR, MAJOR, CRITICAL}
      - name: description
        type: string
        source: input
        description: Narrative of the observed nonconformity.
      - name: status
        type: enum
        source: system
        description: >-
          Nonconformance lifecycle state; CA_SUBMITTED -> CA_REJECTED -> CA_SUBMITTED is a
          cycle bounded by MAX_CA_REVISIONS.
        default: OPEN
        constraints: one of {OPEN, CA_SUBMITTED, CA_ACCEPTED, CA_REJECTED, CLOSED, ESCALATED}
      - name: raised_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor that created the nonconformance; blocked from deciding its corrective action.
      - name: penalty_points
        type: integer
        source: computed
        description: SEVERITY_POINTS[severity]; contributes to Applicant.open_nc_penalty_points while not CLOSED.
      - name: ca_due_on
        type: datetime
        source: computed
        description: created_at + CA_DUE_DAYS[severity] (CRITICAL 15, MAJOR 30, MINOR 90).
      - name: ca_plan_text
        type: string
        source: system
        description: Most recently submitted corrective-action plan narrative.
        default: null
      - name: ca_revision_count
        type: integer
        source: computed
        description: Number of rejected corrective-action plans; at MAX_CA_REVISIONS the nonconformance escalates.
        default: 0
      - name: ca_decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the CertificationReviewer that decided the most recent plan.
        default: null
      - name: ca_rejection_reason
        type: enum
        source: system
        description: Reason recorded on the most recent plan rejection.
        default: null
        constraints: one of {INSUFFICIENT_ROOT_CAUSE, NO_VERIFICATION_EVIDENCE, TIMELINE_TOO_LONG}
      - name: ca_verified
        type: boolean
        source: computed
        description: True once a FieldAuditor confirmed effectiveness; halves this finding's deduction in the FINAL_ADJUDICATED audit score.
        default: false
      - name: closed_on
        type: datetime
        source: system
        description: Logical-clock instant at which status became CLOSED.
        default: null

  - name: ChangeNotification
    parent: Certificate
    common_fields: true
    fields:
      - name: certificate_id
        type: string
        source: input
        description: FK -> Certificate.id; the certificate whose certified scope the change touches.
      - name: replacement_ingredient_id
        type: string
        source: input
        description: >-
          FK -> Ingredient.id; the ingredient introduced by an INGREDIENT_SUBSTITUTION;
          null for change types that introduce no new ingredient.
        default: null
      - name: change_type
        type: enum
        source: input
        description: Class of change being notified.
        constraints: one of {INGREDIENT_SUBSTITUTION, SUPPLIER_CHANGE, FORMULA_PCT_CHANGE, FACILITY_LINE_CHANGE}
      - name: effective_on
        type: datetime
        source: input
        description: Date the applicant intends the change to take effect in production.
      - name: description
        type: string
        source: input
        description: Narrative of the change.
      - name: status
        type: enum
        source: system
        description: Assessment lifecycle state; the three accept/reject outcomes carry divergent side effects.
        default: SUBMITTED
        constraints: >-
          one of {SUBMITTED, ACCEPTED_NO_IMPACT, ACCEPTED_WITH_CONDITIONS,
          REJECTED_REQUIRES_RECERT}
      - name: notified_days_before_effective
        type: integer
        source: computed
        description: floor((effective_on - clock_now_at_creation) / 1 day); may be negative for retroactive notices.
      - name: late_notification
        type: boolean
        source: computed
        description: True iff notified_days_before_effective < CHANGE_NOTICE_DAYS (30).
        default: false
      - name: impact_level
        type: enum
        source: input
        description: Assessor's impact determination recorded at assessment time.
        default: null
        constraints: one of {NONE, LOW, HIGH}
      - name: assessed_by_user_id
        type: string
        source: system
        description: X-User-ID of the CertificationReviewer that assessed the notification.
        default: null
      - name: assessed_on
        type: datetime
        source: system
        description: Logical-clock instant of the assessment decision.
        default: null
      - name: required_retest
        type: boolean
        source: computed
        description: True when the accepted assessment obliges a FOR_CAUSE lot test before the effective date.
        default: false

  - name: ConsumerComplaint
    parent: Certificate
    common_fields: true
    fields:
      - name: certificate_id
        type: string
        source: input
        description: FK -> Certificate.id; the certificate named by the complainant.
      - name: lot_code
        type: string
        source: input
        description: Lot code printed on the pack, when the complainant supplied one.
        default: null
      - name: exposure_date
        type: datetime
        source: input
        description: Date the complainant consumed the product; anchors the recall look-back window.
      - name: symptom_severity
        type: enum
        source: input
        description: Reported clinical severity; drives triage priority and the raised nonconformance severity.
        constraints: one of {MILD, MODERATE, SEVERE, ANAPHYLAXIS}
      - name: reported_on
        type: datetime
        source: system
        description: Logical-clock instant at which the complaint was filed.
      - name: status
        type: enum
        source: system
        description: Investigation lifecycle state; CLOSED is reached only via the source nonconformance closing.
        default: RECEIVED
        constraints: >-
          one of {RECEIVED, INVESTIGATING, SUBSTANTIATED, RECALL_COORDINATION,
          UNSUBSTANTIATED, CLOSED}
      - name: triage_priority
        type: enum
        source: computed
        description: P1 for {SEVERE, ANAPHYLAXIS}, P2 for MODERATE, P3 for MILD.
        default: null
        constraints: one of {P1, P2, P3}
      - name: investigated_by_user_id
        type: string
        source: system
        description: X-User-ID of the CertificationReviewer that recorded the investigation outcome.
        default: null
      - name: outcome_evidence
        type: enum
        source: input
        description: Evidence class recorded with the investigation outcome.
        default: null
        constraints: one of {LOT_TEST_FAILURE, LABEL_ERROR, CROSS_CONTACT, NO_EVIDENCE}
      - name: recall_action
        type: enum
        source: computed
        description: Output of calculations.recall_scope_determination; NONE until the outcome is recorded.
        default: NONE
        constraints: one of {NONE, ADVISORY_ONLY, VOLUNTARY_RECALL, MANDATORY_RECALL_SUPPORT}
      - name: recall_scope_lot_codes
        type: array
        source: computed
        description: Lot codes selected by calculations.recall_scope_determination, in selection order.
        default: []
      - name: closed_on
        type: datetime
        source: system
        description: Logical-clock instant at which status became CLOSED.
        default: null

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Supplier
    state_field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: UNDER_REVIEW
        trigger: "POST /gfco/suppliers/{supplierId}/status with status=UNDER_REVIEW"
        actor: ProgramAdministrator
        preconditions: ["Supplier.status == ACTIVE"]
        side_effects:
          - "Supplier.updated_at refreshed; Supplier.version incremented by 1"
        note: Advisory state; ingredients keep their current status.
      - from: UNDER_REVIEW
        to: ACTIVE
        trigger: "POST /gfco/suppliers/{supplierId}/status with status=ACTIVE"
        actor: ProgramAdministrator
        preconditions: ["Supplier.status == UNDER_REVIEW"]
        side_effects: ["Supplier.version incremented by 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /gfco/suppliers/{supplierId}/status with status=SUSPENDED"
        actor: ProgramAdministrator
        preconditions: ["Supplier.status IN {ACTIVE, UNDER_REVIEW}"]
        side_effects:
          - "CASCADE HOP 1: every Ingredient I where I.supplier_id == this Supplier.id AND I.status == APPROVED transitions APPROVED -> BLOCKED with I.blocked_reason = SUPPLIER_SUSPENDED"
          - "CASCADE HOP 2 (caused by hop 1): for every Ingredient P where P.id == I.parent_ingredient_id of a hop-1 ingredient AND P.status == APPROVED, P transitions APPROVED -> BLOCKED with P.blocked_reason = SUB_COMPONENT_BLOCKED"
          - "CASCADE HOP 3 (caused by hops 1-2): every Product X with a ProductIngredient row referencing a now-BLOCKED Ingredient recomputes blocked_ingredient_count; when the count becomes >= 1 and X.formula_status == CLEARED, X transitions CLEARED -> BLOCKED"
          - "CASCADE HOP 4 (caused by hop 3): every Certificate C where C.product_id is a hop-3 product AND C.status == ISSUED transitions ISSUED -> SUSPENDED with C.suspension_reason = INGREDIENT_BLOCKED, C.suspended_on = clock_now, C.suspension_count incremented by 1, C.mark_usage_locked = true"
          - "CASCADE HOP 5 (caused by hop 4): every hop-4 certificate's Product transitions label_status APPROVED -> FROZEN, and the owning Applicant recomputes active_certified_product_count, suspended_certificate_count, posture_score_rolling_12m, posture_score_cycle and compliance_posture"
      - from: UNDER_REVIEW
        to: SUSPENDED
        trigger: "POST /gfco/suppliers/{supplierId}/status with status=SUSPENDED"
        actor: ProgramAdministrator
        preconditions: ["Supplier.status IN {ACTIVE, UNDER_REVIEW}"]
        side_effects: ["identical five-hop cascade as the ACTIVE -> SUSPENDED transition"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /gfco/suppliers/{supplierId}/status with status=ACTIVE"
        actor: ProgramAdministrator
        preconditions: ["Supplier.status == SUSPENDED"]
        side_effects:
          - "every Ingredient I where I.supplier_id == this Supplier.id AND I.status == BLOCKED AND I.blocked_reason == SUPPLIER_SUSPENDED transitions BLOCKED -> UNDER_REVIEW with I.review_cycle_count incremented by 1 and I.blocked_reason = null"
        note: >-
          Reinstating a supplier never auto-approves ingredients; each must be re-reviewed,
          so Products stay BLOCKED until the review APPROVES the ingredient again.

  - entity: SupplierDocument
    state_field: status
    initial_state: PENDING
    terminal_states: [REJECTED, EXPIRED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /gfco/supplier-documents/{documentId}/verification with decision=APPROVE"
        actor: CertificationReviewer
        preconditions:
          - "SupplierDocument.status == PENDING"
          - "SupplierDocument.expires_on > clock_now"
          - "for doc_type == COA: lab_ppm_claim <= COA_MAX_PPM_CLAIM[Ingredient.risk_class] (INHERENTLY_GF 20, GF_PROCESSED 10, HIGH_RISK_GRAIN 5)"
        side_effects:
          - "SupplierDocument.verified_by_user_id = X-User-ID; verified_on = clock_now"
          - "Supplier.verified_document_count recomputed"
          - "Ingredient.verified_doc_types recomputed for SupplierDocument.ingredient_id"
      - from: PENDING
        to: REJECTED
        trigger: "POST /gfco/supplier-documents/{documentId}/verification with decision=REJECT"
        actor: CertificationReviewer
        preconditions: ["SupplierDocument.status == PENDING", "rejection_reason present"]
        side_effects:
          - "CASCADE HOP 1: if the referenced Ingredient.status == APPROVED and the rejection removes a required doc_type for its risk_class, the Ingredient transitions APPROVED -> BLOCKED with blocked_reason = DOCUMENT_REJECTED"
          - "CASCADE HOP 2 (caused by hop 1): linked Products transition formula_status CLEARED -> BLOCKED"
          - "CASCADE HOP 3 (caused by hop 2): their ISSUED Certificates transition to SUSPENDED with suspension_reason = INGREDIENT_BLOCKED and the owning Applicant's posture fields are recomputed"
      - from: VERIFIED
        to: EXPIRED
        trigger: "POST /gfco/surveillance-runs (system sweep) when SupplierDocument.expires_on <= clock_now"
        actor: system
        preconditions: ["SupplierDocument.status == VERIFIED", "expires_on <= clock_now"]
        side_effects:
          - "Ingredient.verified_doc_types recomputed for SupplierDocument.ingredient_id"
          - "CASCADE: if a required doc_type for the ingredient's risk_class is now missing and Ingredient.status == APPROVED, the Ingredient transitions APPROVED -> BLOCKED with blocked_reason = DOCUMENT_EXPIRED, propagating to Products (CLEARED -> BLOCKED) and Certificates (ISSUED -> SUSPENDED, reason INGREDIENT_BLOCKED)"

  - entity: Facility
    state_field: sanitation_validation_status
    initial_state: UNVALIDATED
    terminal_states: []
    transitions:
      - from: UNVALIDATED
        to: VALIDATED
        trigger: "POST /gfco/facilities/{facilityId}/sanitation-validation"
        actor: CertificationReviewer
        preconditions:
          - "swab_ppm <= SANITATION_SWAB_LIMIT_PPM (5)"
          - "validated_on <= clock_now"
        side_effects:
          - "Facility.sanitation_swab_ppm = swab_ppm; sanitation_method = method; sanitation_validated_on = validated_on"
          - "Facility.sanitation_expires_on = validated_on + SANITATION_VALIDITY_DAYS (365)"
      - from: VALIDATED
        to: VALIDATED
        trigger: "POST /gfco/facilities/{facilityId}/sanitation-validation (re-validation)"
        actor: CertificationReviewer
        preconditions: ["swab_ppm <= SANITATION_SWAB_LIMIT_PPM (5)", "validated_on <= clock_now"]
        side_effects: ["sanitation_validated_on and sanitation_expires_on refreshed from the new validated_on"]
      - from: EXPIRED
        to: VALIDATED
        trigger: "POST /gfco/facilities/{facilityId}/sanitation-validation"
        actor: CertificationReviewer
        preconditions: ["swab_ppm <= SANITATION_SWAB_LIMIT_PPM (5)", "validated_on <= clock_now"]
        side_effects: ["sanitation_validated_on and sanitation_expires_on refreshed from the new validated_on"]
      - from: VALIDATED
        to: EXPIRED
        trigger: "POST /gfco/surveillance-runs (system sweep) when Facility.sanitation_expires_on <= clock_now"
        actor: system
        preconditions: ["Facility.sanitation_validation_status == VALIDATED", "sanitation_expires_on <= clock_now"]
        side_effects:
          - "no cascade to existing Certificates; the EXPIRED state blocks POST /gfco/certificates and POST /gfco/audits/{auditId}/close on this facility until re-validated"

  - entity: Ingredient
    state_field: status
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /gfco/ingredients/{ingredientId}/submission"
        actor: ApplicantContact
        preconditions:
          - "Ingredient.status IN {DRAFT, REJECTED, BLOCKED}"
          - "Supplier.status != SUSPENDED for Ingredient.supplier_id"
        side_effects: ["Ingredient.review_cycle_count incremented by 1", "Ingredient.blocked_reason = null"]
      - from: REJECTED
        to: UNDER_REVIEW
        trigger: "POST /gfco/ingredients/{ingredientId}/submission (resubmission after rejection)"
        actor: ApplicantContact
        preconditions: ["Ingredient.status IN {DRAFT, REJECTED, BLOCKED}", "Supplier.status != SUSPENDED"]
        side_effects: ["Ingredient.review_cycle_count incremented by 1", "Ingredient.rejection_reason = null"]
        note: Closes the review cycle UNDER_REVIEW -> REJECTED -> UNDER_REVIEW.
      - from: BLOCKED
        to: UNDER_REVIEW
        trigger: "POST /gfco/ingredients/{ingredientId}/submission (re-review after a block)"
        actor: ApplicantContact
        preconditions: ["Ingredient.status IN {DRAFT, REJECTED, BLOCKED}", "Supplier.status != SUSPENDED"]
        side_effects: ["Ingredient.review_cycle_count incremented by 1", "Ingredient.blocked_reason = null"]
        note: Closes the block cycle APPROVED -> BLOCKED -> UNDER_REVIEW -> APPROVED.
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /gfco/ingredients/{ingredientId}/review with decision=APPROVE"
        actor: CertificationReviewer
        preconditions:
          - "Ingredient.status == UNDER_REVIEW"
          - "REQUIRED_DOC_TYPES[Ingredient.risk_class] is a subset of Ingredient.verified_doc_types"
          - "no SupplierDocument of this ingredient with status == VERIFIED has expires_on <= clock_now"
          - "Supplier.status == ACTIVE for Ingredient.supplier_id"
        side_effects:
          - "Ingredient.reviewed_by_user_id = X-User-ID; approved_on = clock_now; blocked_reason = null"
          - "every Product with a ProductIngredient row referencing this ingredient recomputes blocked_ingredient_count; when it reaches 0 and Product.formula_status == BLOCKED and every linked Ingredient.status == APPROVED, the Product transitions BLOCKED -> CLEARED"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /gfco/ingredients/{ingredientId}/review with decision=REJECT"
        actor: CertificationReviewer
        preconditions: ["Ingredient.status == UNDER_REVIEW", "rejection_reason present"]
        side_effects:
          - "Ingredient.reviewed_by_user_id = X-User-ID; rejection_reason recorded"
          - "linked Products with formula_status == CLEARED transition CLEARED -> BLOCKED (blocked_ingredient_count recomputed)"
      - from: APPROVED
        to: BLOCKED
        trigger: "system cascade from Supplier suspension, SupplierDocument rejection, SupplierDocument expiry, or a sub-component Ingredient becoming BLOCKED"
        actor: system
        preconditions: ["Ingredient.status == APPROVED"]
        side_effects:
          - "Ingredient.blocked_reason set to SUPPLIER_SUSPENDED | DOCUMENT_REJECTED | DOCUMENT_EXPIRED | SUB_COMPONENT_BLOCKED per the originating cause"
          - "the parent compound Ingredient (Ingredient.parent_ingredient_id chain, upward) with status == APPROVED transitions APPROVED -> BLOCKED with blocked_reason = SUB_COMPONENT_BLOCKED"
          - "every Product linked through ProductIngredient recomputes blocked_ingredient_count and, when CLEARED, transitions CLEARED -> BLOCKED"

  - entity: Product
    dimension: formula_dimension
    state_field: formula_status
    initial_state: DRAFT
    terminal_states: []
    note: >-
      PARALLEL DIMENSION 1 of 2 on Product. formula_status and label_status advance through
      disjoint endpoints and disjoint cascades; neither transition set reads or writes the
      other dimension's field.
    transitions:
      - from: DRAFT
        to: CLEARED
        trigger: "POST /gfco/products/{productId}/formula-review with decision=CLEAR"
        actor: CertificationReviewer
        preconditions:
          - "Product.formula_status IN {DRAFT, REJECTED}"
          - "Product.linked_ingredient_count >= 1"
          - "every Ingredient referenced by a ProductIngredient row of this Product has status == APPROVED"
        side_effects: ["Product.formula_cleared_by_user_id = X-User-ID"]
      - from: DRAFT
        to: REJECTED
        trigger: "POST /gfco/products/{productId}/formula-review with decision=REJECT"
        actor: CertificationReviewer
        preconditions: ["Product.formula_status IN {DRAFT, REJECTED}", "rejection_reason present"]
        side_effects: ["Product.formula_cleared_by_user_id stays null"]
      - from: REJECTED
        to: CLEARED
        trigger: "POST /gfco/products/{productId}/formula-review with decision=CLEAR (re-review)"
        actor: CertificationReviewer
        preconditions:
          - "Product.formula_status IN {DRAFT, REJECTED}"
          - "Product.linked_ingredient_count >= 1"
          - "every linked Ingredient.status == APPROVED"
        side_effects: ["Product.formula_cleared_by_user_id = X-User-ID"]
      - from: CLEARED
        to: BLOCKED
        trigger: "system cascade when Product.blocked_ingredient_count becomes >= 1 or a linked Ingredient becomes REJECTED"
        actor: system
        preconditions: ["Product.formula_status == CLEARED"]
        side_effects:
          - "every Certificate of this Product with status == ISSUED transitions ISSUED -> SUSPENDED with suspension_reason = INGREDIENT_BLOCKED"
      - from: BLOCKED
        to: CLEARED
        trigger: "system cascade when Product.blocked_ingredient_count returns to 0 and every linked Ingredient.status == APPROVED"
        actor: system
        preconditions: ["Product.formula_status == BLOCKED", "Product.blocked_ingredient_count == 0", "every linked Ingredient.status == APPROVED"]
        side_effects:
          - "no automatic certificate reinstatement; a SUSPENDED Certificate must be reinstated explicitly by POST /gfco/certificates/{certificateId}/reinstatement"

  - entity: Product
    dimension: label_dimension
    state_field: label_status
    initial_state: NOT_SUBMITTED
    terminal_states: []
    note: PARALLEL DIMENSION 2 of 2 on Product.
    transitions:
      - from: NOT_SUBMITTED
        to: APPROVED
        trigger: "POST /gfco/products/{productId}/label-review with decision=APPROVE"
        actor: CertificationReviewer
        preconditions:
          - "Product.label_status IN {NOT_SUBMITTED, REJECTED, APPROVED}"
          - "the payload mark_tier_granted is present and equals Product.requested_mark_tier"
        side_effects:
          - "Product.mark_tier_granted = payload mark_tier_granted; label_reviewed_by_user_id = X-User-ID; label_rejection_reason = null"
      - from: REJECTED
        to: APPROVED
        trigger: "POST /gfco/products/{productId}/label-review with decision=APPROVE (re-review)"
        actor: CertificationReviewer
        preconditions: ["Product.label_status IN {NOT_SUBMITTED, REJECTED, APPROVED}", "mark_tier_granted == Product.requested_mark_tier"]
        side_effects: ["Product.mark_tier_granted set; label_rejection_reason = null"]
      - from: NOT_SUBMITTED
        to: REJECTED
        trigger: "POST /gfco/products/{productId}/label-review with decision=REJECT"
        actor: CertificationReviewer
        preconditions: ["Product.label_status IN {NOT_SUBMITTED, REJECTED, APPROVED}", "rejection_reason present"]
        side_effects: ["Product.mark_tier_granted = NONE; label_rejection_reason recorded"]
      - from: APPROVED
        to: REJECTED
        trigger: "POST /gfco/products/{productId}/label-review with decision=REJECT (label withdrawn on re-review)"
        actor: CertificationReviewer
        preconditions: ["Product.label_status IN {NOT_SUBMITTED, REJECTED, APPROVED}", "rejection_reason present"]
        side_effects: ["Product.mark_tier_granted = NONE; label_rejection_reason recorded"]
      - from: APPROVED
        to: FROZEN
        trigger: "system cascade when a Certificate of this Product leaves ISSUED (SUSPENDED, REVOKED or EXPIRED)"
        actor: system
        preconditions: ["Product.label_status == APPROVED"]
        side_effects: ["mark usage is frozen; Certificate.mark_usage_locked = true"]
      - from: FROZEN
        to: APPROVED
        trigger: "system cascade when a Certificate of this Product returns to ISSUED via POST /gfco/certificates/{certificateId}/reinstatement"
        actor: system
        preconditions: ["Product.label_status == FROZEN"]
        side_effects: ["Certificate.mark_usage_locked = false; Product.mark_tier_granted unchanged"]

  - entity: Audit
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [CLOSED_PASS, CLOSED_CONDITIONAL, CLOSED_FAIL, CANCELLED]
    note: >-
      Branching fork-join: one IN_PROGRESS state forks into three CLOSED_* outcomes whose
      side-effect sets differ (PASS opens issuance, CONDITIONAL opens issuance but keeps
      findings open, FAIL blocks issuance and suspends existing certificates).
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /gfco/audits/{auditId}/start"
        actor: FieldAuditor
        preconditions: ["Audit.status == SCHEDULED", "clock_now >= Audit.onsite_start_at"]
        side_effects: ["Audit.lead_auditor_user_id = X-User-ID"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /gfco/surveillance-runs (system sweep) when Audit.status == SCHEDULED AND clock_now >= Audit.onsite_end_at"
        actor: system
        preconditions: ["Audit.status == SCHEDULED", "clock_now >= Audit.onsite_end_at"]
        side_effects: ["the facility's on-site interval is released so a replacement audit can be scheduled over it"]
      - from: IN_PROGRESS
        to: CLOSED_PASS
        trigger: "POST /gfco/audits/{auditId}/close"
        actor: FieldAuditor
        preconditions:
          - "Audit.status == IN_PROGRESS"
          - "clock_now >= Audit.onsite_end_at"
          - "Facility.sanitation_validation_status == VALIDATED"
          - "shared_equipment_verified == true when Facility.shared_equipment_present == true"
          - "calculations.audit_compliance_score PROVISIONAL_ONSITE variant >= AUDIT_PASS_SCORE (90) AND Audit.critical_finding_count == 0"
        side_effects:
          - "Audit.provisional_score and Audit.final_score set to the PROVISIONAL_ONSITE value; closed_by_user_id = X-User-ID; closed_on = clock_now"
          - "Facility.last_closed_audit_outcome = CLOSED_PASS; last_closed_audit_closed_on = clock_now"
          - "when Audit.audit_type == SURVEILLANCE: every Certificate of a Product of this Facility with status IN {ISSUED, SUSPENDED} has surveillance_due_on reset to clock_now + SURVEILLANCE_INTERVAL_DAYS (365) and surveillance_status reset to CURRENT"
      - from: IN_PROGRESS
        to: CLOSED_CONDITIONAL
        trigger: "POST /gfco/audits/{auditId}/close"
        actor: FieldAuditor
        preconditions:
          - "Audit.status == IN_PROGRESS"
          - "clock_now >= Audit.onsite_end_at"
          - "Facility.sanitation_validation_status == VALIDATED"
          - "AUDIT_CONDITIONAL_SCORE (75) <= PROVISIONAL_ONSITE score < AUDIT_PASS_SCORE (90) AND Audit.critical_finding_count == 0"
        side_effects:
          - "Audit.provisional_score and final_score set; closed_by_user_id and closed_on set"
          - "Facility.last_closed_audit_outcome = CLOSED_CONDITIONAL"
          - "certificate issuance remains permitted, but every open Nonconformance of this audit keeps contributing penalty points, so the Applicant posture gate may still block issuance"
          - "when Audit.audit_type == SURVEILLANCE: surveillance_due_on / surveillance_status reset exactly as for CLOSED_PASS"
      - from: IN_PROGRESS
        to: CLOSED_FAIL
        trigger: "POST /gfco/audits/{auditId}/close"
        actor: FieldAuditor
        preconditions:
          - "Audit.status == IN_PROGRESS"
          - "clock_now >= Audit.onsite_end_at"
          - "Facility.sanitation_validation_status == VALIDATED"
          - "PROVISIONAL_ONSITE score < AUDIT_CONDITIONAL_SCORE (75) OR Audit.critical_finding_count >= 1"
        side_effects:
          - "Audit.provisional_score and final_score set; closed_by_user_id and closed_on set"
          - "Facility.last_closed_audit_outcome = CLOSED_FAIL, which blocks POST /gfco/certificates for every Product of this Facility"
          - "every Certificate of a Product of this Facility with status == ISSUED transitions ISSUED -> SUSPENDED with suspension_reason = CRITICAL_NONCONFORMANCE; each such Product transitions label_status APPROVED -> FROZEN; each owning Applicant recomputes its posture fields"
          - "surveillance_due_on is NOT reset even when audit_type == SURVEILLANCE"

  - entity: Certificate
    state_field: status
    initial_state: ISSUED
    terminal_states: [REVOKED, EXPIRED]
    note: "Cyclic: ISSUED -> SUSPENDED -> ISSUED can repeat without bound; suspension_count records the laps."
    transitions:
      - from: ISSUED
        to: SUSPENDED
        trigger: "POST /gfco/certificates/{certificateId}/suspension, or system cascade (INGREDIENT_BLOCKED, CRITICAL_NONCONFORMANCE, FAILED_UNANNOUNCED_TEST, SUBSTANTIATED_COMPLAINT, SURVEILLANCE_OVERDUE, CHANGE_REQUIRES_RECERT)"
        actor: CertificationDecisionMaker
        preconditions: ["Certificate.status == ISSUED"]
        side_effects:
          - "Certificate.suspended_on = clock_now; suspension_reason recorded; suspension_count incremented by 1; mark_usage_locked = true"
          - "Product.label_status APPROVED -> FROZEN"
          - "Applicant.active_certified_product_count decremented, suspended_certificate_count incremented, posture_score_rolling_12m / posture_score_cycle / compliance_posture recomputed"
          - "Applicant.fee_balance_cents unchanged (suspension never touches the fee ledger)"
      - from: SUSPENDED
        to: ISSUED
        trigger: "POST /gfco/certificates/{certificateId}/reinstatement"
        actor: CertificationDecisionMaker
        preconditions:
          - "Certificate.status == SUSPENDED"
          - "no Nonconformance N with N.certificate_id == this id has severity == CRITICAL AND status IN {OPEN, CA_SUBMITTED, CA_REJECTED, ESCALATED}"
          - "Product.formula_status == CLEARED"
          - "Certificate.surveillance_status != OVERDUE"
        side_effects:
          - "Certificate.suspension_reason = null; suspended_on = null; mark_usage_locked = false"
          - "Product.label_status FROZEN -> APPROVED"
          - "Applicant.active_certified_product_count incremented, suspended_certificate_count decremented, posture fields recomputed - restoring the exact pre-suspension values"
      - from: ISSUED
        to: REVOKED
        trigger: "POST /gfco/certificates/{certificateId}/revocation"
        actor: CertificationDecisionMaker
        preconditions: ["Certificate.status IN {ISSUED, SUSPENDED}"]
        side_effects:
          - "Certificate.revoked_on = clock_now; revocation_reason recorded; mark_usage_locked = true"
          - "Product.label_status APPROVED -> FROZEN"
          - "when revocation_reason == VOLUNTARY_WITHDRAWAL AND clock_now <= issued_on + FEE_REFUND_WINDOW_DAYS (30) AND no LotTest exists for the Product with test_type == UNANNOUNCED: Certificate.fee_refunded = true and Applicant.fee_balance_cents decreases by exactly Certificate.total_fee_cents"
          - "Applicant.active_certified_product_count decremented, revoked_certificate_count incremented, posture fields recomputed"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /gfco/certificates/{certificateId}/revocation"
        actor: CertificationDecisionMaker
        preconditions: ["Certificate.status IN {ISSUED, SUSPENDED}"]
        side_effects:
          - "same as ISSUED -> REVOKED except active_certified_product_count is already decremented, so only suspended_certificate_count decrements and revoked_certificate_count increments"
      - from: ISSUED
        to: EXPIRED
        trigger: "POST /gfco/surveillance-runs (system sweep) when Certificate.expires_on <= clock_now"
        actor: system
        preconditions: ["Certificate.status IN {ISSUED, SUSPENDED}", "expires_on <= clock_now"]
        side_effects:
          - "mark_usage_locked = true; Product.label_status APPROVED -> FROZEN; Applicant.active_certified_product_count decremented and posture fields recomputed"
      - from: SUSPENDED
        to: EXPIRED
        trigger: "POST /gfco/surveillance-runs (system sweep) when Certificate.expires_on <= clock_now"
        actor: system
        preconditions: ["Certificate.status IN {ISSUED, SUSPENDED}", "expires_on <= clock_now"]
        side_effects: ["mark_usage_locked = true; Applicant.suspended_certificate_count decremented and posture fields recomputed"]

  - entity: Certificate
    dimension: surveillance_dimension
    state_field: surveillance_status
    initial_state: CURRENT
    terminal_states: []
    note: >-
      Independent surveillance dimension on the same Certificate row; it advances on the
      logical clock regardless of the status dimension, and OVERDUE feeds back into status.
    transitions:
      - from: CURRENT
        to: DUE
        trigger: "POST /gfco/surveillance-runs when surveillance_due_on <= clock_now < surveillance_due_on + SURVEILLANCE_GRACE_DAYS (60)"
        actor: system
        preconditions: ["Certificate.status IN {ISSUED, SUSPENDED}"]
        side_effects: ["no status change; a SURVEILLANCE Audit is now expected"]
      - from: DUE
        to: OVERDUE
        trigger: "POST /gfco/surveillance-runs when clock_now >= surveillance_due_on + SURVEILLANCE_GRACE_DAYS (60)"
        actor: system
        preconditions: ["Certificate.status IN {ISSUED, SUSPENDED}"]
        side_effects:
          - "when Certificate.status == ISSUED it transitions ISSUED -> SUSPENDED with suspension_reason = SURVEILLANCE_OVERDUE, cascading to Product.label_status FROZEN and the Applicant posture recompute"
      - from: CURRENT
        to: OVERDUE
        trigger: "POST /gfco/surveillance-runs when clock_now >= surveillance_due_on + SURVEILLANCE_GRACE_DAYS (60) and no earlier run observed the DUE window"
        actor: system
        preconditions: ["Certificate.status IN {ISSUED, SUSPENDED}"]
        side_effects: ["identical to DUE -> OVERDUE"]
      - from: OVERDUE
        to: CURRENT
        trigger: "POST /gfco/audits/{auditId}/close with audit_type == SURVEILLANCE closing CLOSED_PASS or CLOSED_CONDITIONAL"
        actor: system
        preconditions: ["the closing Audit.facility_id == the Certificate's Product.facility_id"]
        side_effects: ["surveillance_due_on = clock_now + 365 days; the SURVEILLANCE_OVERDUE suspension is NOT auto-lifted - explicit reinstatement is still required"]
      - from: DUE
        to: CURRENT
        trigger: "POST /gfco/audits/{auditId}/close with audit_type == SURVEILLANCE closing CLOSED_PASS or CLOSED_CONDITIONAL"
        actor: system
        preconditions: ["the closing Audit.facility_id == the Certificate's Product.facility_id"]
        side_effects: ["surveillance_due_on = clock_now + 365 days"]

  - entity: Nonconformance
    state_field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    note: >-
      Cyclic corrective-action loop: CA_SUBMITTED -> CA_REJECTED -> CA_SUBMITTED may repeat, and
      CA_ACCEPTED -> CA_REJECTED re-enters the loop after a failed effectiveness verification.
      The loop is bounded by ca_revision_count and MAX_CA_REVISIONS (2), after which the record
      is forced to ESCALATED instead of CA_REJECTED.
    transitions:
      - from: null
        to: OPEN
        trigger: "POST /gfco/nonconformances"
        actor: FieldAuditor
        preconditions:
          - "exactly one of audit_id, lot_test_id, complaint_id, certificate_id is present and identifies the polymorphic source consistent with source_type"
        side_effects:
          - "Nonconformance.raised_by_user_id = X-User-ID; ca_due_on = created_at + CA_DUE_DAYS[severity] (CRITICAL 15, MAJOR 30, MINOR 90); ca_revision_count = 0; ca_verified = false; penalty_points = SEVERITY_POINTS[severity]"
          - "Applicant.open_nc_penalty_points recomputed from calculations.open_nc_penalty_points and the posture fields recomputed"
          - "when audit_id is present: Audit.finding_count incremented, Audit.critical_finding_count incremented when severity == CRITICAL, and Audit.final_score recomputed with the FINAL_ADJUDICATED variant"
          - "when severity == CRITICAL and the linked certificate_id (or the source's certificate) has status == ISSUED: that Certificate transitions ISSUED -> SUSPENDED with suspension_reason = CRITICAL_NONCONFORMANCE, cascading to Product.label_status FROZEN"
      - from: OPEN
        to: CA_SUBMITTED
        trigger: "POST /gfco/nonconformances/{nonconformanceId}/corrective-action-plan"
        actor: ApplicantContact
        preconditions:
          - "Nonconformance.status IN {OPEN, CA_REJECTED}"
          - "expected_nonconformance_version matches Nonconformance.version"
          - "clock_now <= Nonconformance.ca_due_on"
          - "the linked Certificate, if any, has status NOT IN {REVOKED, EXPIRED}"
        side_effects:
          - "Nonconformance.ca_plan_text recorded; updated_at = clock_now; version incremented by 1"
          - "Audit.final_score recomputed (FINAL_ADJUDICATED) when audit_id is present"
      - from: CA_REJECTED
        to: CA_SUBMITTED
        trigger: "POST /gfco/nonconformances/{nonconformanceId}/corrective-action-plan (revised plan - CYCLE)"
        actor: ApplicantContact
        preconditions:
          - "Nonconformance.status IN {OPEN, CA_REJECTED}"
          - "expected_nonconformance_version matches Nonconformance.version"
          - "clock_now <= Nonconformance.ca_due_on"
        side_effects: ["ca_plan_text replaced; updated_at = clock_now; version incremented by 1"]
      - from: CA_SUBMITTED
        to: CA_ACCEPTED
        trigger: "POST /gfco/nonconformances/{nonconformanceId}/corrective-action-decision with decision=ACCEPT"
        actor: CertificationReviewer
        preconditions:
          - "Nonconformance.status == CA_SUBMITTED"
          - "X-User-ID != Nonconformance.raised_by_user_id (segregation of duties)"
        side_effects: ["ca_decided_by_user_id = X-User-ID; ca_rejection_reason = null"]
      - from: CA_SUBMITTED
        to: CA_REJECTED
        trigger: "POST /gfco/nonconformances/{nonconformanceId}/corrective-action-decision with decision=REJECT while the incremented ca_revision_count is still below MAX_CA_REVISIONS (2)"
        actor: CertificationReviewer
        preconditions:
          - "Nonconformance.status == CA_SUBMITTED"
          - "X-User-ID != Nonconformance.raised_by_user_id"
          - "ca_rejection_reason present"
          - "ca_revision_count + 1 < MAX_CA_REVISIONS (2)"
        side_effects: ["ca_revision_count incremented by 1 BEFORE the branch is evaluated; ca_decided_by_user_id = X-User-ID"]
      - from: CA_SUBMITTED
        to: ESCALATED
        trigger: "POST /gfco/nonconformances/{nonconformanceId}/corrective-action-decision with decision=REJECT once the incremented ca_revision_count reaches MAX_CA_REVISIONS (2)"
        actor: CertificationReviewer
        preconditions:
          - "Nonconformance.status == CA_SUBMITTED"
          - "X-User-ID != Nonconformance.raised_by_user_id"
          - "ca_rejection_reason present"
          - "ca_revision_count + 1 >= MAX_CA_REVISIONS (2)"
        side_effects:
          - "ca_revision_count incremented by 1; updated_at = clock_now"
          - "Applicant.open_nc_penalty_points and posture fields recomputed"
          - "Audit.final_score recomputed with an extra ESCALATION_PENALTY (10) deduction when audit_id is present"
          - "when the linked Certificate has status == ISSUED it transitions ISSUED -> SUSPENDED with suspension_reason = CRITICAL_NONCONFORMANCE"
      - from: OPEN
        to: ESCALATED
        trigger: "POST /gfco/surveillance-runs (system sweep) when Nonconformance.status == OPEN AND clock_now > ca_due_on"
        actor: system
        preconditions: ["Nonconformance.status == OPEN", "clock_now > ca_due_on"]
        side_effects: ["identical to the CA_SUBMITTED -> ESCALATED side-effect set"]
      - from: CA_ACCEPTED
        to: CLOSED
        trigger: "POST /gfco/nonconformances/{nonconformanceId}/verification with effectiveness_confirmed=true"
        actor: FieldAuditor
        preconditions: ["Nonconformance.status == CA_ACCEPTED", "X-User-ID != Nonconformance.ca_decided_by_user_id (segregation of duties)"]
        side_effects:
          - "ca_verified = true; closed_on = clock_now"
          - "Applicant.open_nc_penalty_points and posture fields recomputed (this record no longer contributes)"
          - "Audit.final_score recomputed (FINAL_ADJUDICATED) so this record's deduction is halved"
          - "when complaint_id is present and that ConsumerComplaint.status IN {SUBSTANTIATED, RECALL_COORDINATION}: the complaint transitions to CLOSED"
      - from: CA_ACCEPTED
        to: CA_REJECTED
        trigger: "POST /gfco/nonconformances/{nonconformanceId}/verification with effectiveness_confirmed=false (CYCLE - verification failed on site)"
        actor: FieldAuditor
        preconditions: ["Nonconformance.status == CA_ACCEPTED", "X-User-ID != Nonconformance.ca_decided_by_user_id"]
        side_effects: ["ca_verified = false; ca_revision_count is NOT incremented by verification; the applicant may submit a revised plan again"]

  - entity: ChangeNotification
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED_NO_IMPACT, ACCEPTED_WITH_CONDITIONS, REJECTED_REQUIRES_RECERT]
    note: "Single-hop branching assessment; the branch is chosen by the assessed impact_level, not by the decision alone."
    transitions:
      - from: SUBMITTED
        to: ACCEPTED_NO_IMPACT
        trigger: "POST /gfco/change-notifications/{notificationId}/assessment with decision=ACCEPT and impact_level=NONE"
        actor: CertificationReviewer
        preconditions: ["ChangeNotification.status == SUBMITTED", "the linked Certificate.status NOT IN {REVOKED, EXPIRED}"]
        side_effects: ["assessed_on = clock_now; assessed_by_user_id = X-User-ID; required_retest = false"]
      - from: SUBMITTED
        to: ACCEPTED_WITH_CONDITIONS
        trigger: "POST /gfco/change-notifications/{notificationId}/assessment with decision=ACCEPT and impact_level=LOW"
        actor: CertificationReviewer
        preconditions: ["ChangeNotification.status == SUBMITTED", "the linked Certificate.status NOT IN {REVOKED, EXPIRED}"]
        side_effects:
          - "assessed_on = clock_now; assessed_by_user_id = X-User-ID; required_retest = true"
          - "the linked Certificate's Product recomputes threshold_ppm, sampling_lots_per_year and sampling_exclusion_days from the current ingredient set"
      - from: SUBMITTED
        to: REJECTED_REQUIRES_RECERT
        trigger: "POST /gfco/change-notifications/{notificationId}/assessment with decision=REJECT, or with impact_level=HIGH regardless of decision"
        actor: CertificationReviewer
        preconditions: ["ChangeNotification.status == SUBMITTED", "the linked Certificate.status NOT IN {REVOKED, EXPIRED}"]
        side_effects:
          - "assessed_on = clock_now; assessed_by_user_id = X-User-ID; required_retest = true"
          - "when the linked Certificate.status == ISSUED it transitions ISSUED -> SUSPENDED with suspension_reason = CHANGE_REQUIRES_RECERT, cascading to Product.label_status FROZEN and the Applicant posture recompute"
          - "a Nonconformance is created with source_type = CHANGE_NOTIFICATION, category = DOCUMENTATION, severity = MAJOR, certificate_id = the linked certificate, applicant_id = the certificate's applicant_id, raised_by_user_id = X-User-ID and ca_due_on = created_at + CA_DUE_DAYS[MAJOR] (30 days)"

  - entity: ConsumerComplaint
    state_field: status
    initial_state: RECEIVED
    terminal_states: [UNSUBSTANTIATED, CLOSED]
    note: "Branching investigation with a recall fork; the CLOSED state is reachable only as a cascade from the source Nonconformance being verified."
    transitions:
      - from: RECEIVED
        to: INVESTIGATING
        trigger: "POST /gfco/consumer-complaints/{complaintId}/triage"
        actor: CertificationReviewer
        preconditions: ["ConsumerComplaint.status == RECEIVED"]
        side_effects:
          - "triage_priority computed from symptom_severity (SEVERE and ANAPHYLAXIS -> P1, MODERATE -> P2, MILD -> P3)"
          - "recall_scope_lot_codes and recall_action computed per calculations.recall_scope_determination and stored on the complaint"
      - from: INVESTIGATING
        to: SUBSTANTIATED
        trigger: "POST /gfco/consumer-complaints/{complaintId}/investigation-outcome with outcome=SUBSTANTIATED while recall_action == ADVISORY_ONLY"
        actor: CertificationReviewer
        preconditions: ["ConsumerComplaint.status == INVESTIGATING", "outcome_evidence present"]
        side_effects:
          - "investigated_by_user_id = X-User-ID"
          - "a Nonconformance is created with source_type = COMPLAINT, complaint_id = this complaint, applicant_id = the certificate's applicant_id, category = THRESHOLD_EXCEEDANCE, severity = CRITICAL when symptom_severity IN {SEVERE, ANAPHYLAXIS} else MAJOR"
          - "when that Nonconformance is CRITICAL and the complaint's Certificate.status == ISSUED, the certificate transitions ISSUED -> SUSPENDED with suspension_reason = SUBSTANTIATED_COMPLAINT, cascading to Product.label_status FROZEN and the Applicant posture recompute"
          - "Applicant.substantiated_complaint_count_rolling and substantiated_complaint_count_cycle recomputed, then posture_score_rolling_12m, posture_score_cycle and compliance_posture recomputed"
      - from: INVESTIGATING
        to: RECALL_COORDINATION
        trigger: "POST /gfco/consumer-complaints/{complaintId}/investigation-outcome with outcome=SUBSTANTIATED while recall_action IN {VOLUNTARY_RECALL, MANDATORY_RECALL_SUPPORT}"
        actor: CertificationReviewer
        preconditions: ["ConsumerComplaint.status == INVESTIGATING", "outcome_evidence present"]
        side_effects: ["identical to INVESTIGATING -> SUBSTANTIATED; in addition recall_scope_lot_codes is non-empty and recall_action is VOLUNTARY_RECALL or MANDATORY_RECALL_SUPPORT"]
      - from: INVESTIGATING
        to: UNSUBSTANTIATED
        trigger: "POST /gfco/consumer-complaints/{complaintId}/investigation-outcome with outcome=UNSUBSTANTIATED"
        actor: CertificationReviewer
        preconditions: ["ConsumerComplaint.status == INVESTIGATING", "outcome_evidence present"]
        side_effects: ["investigated_by_user_id = X-User-ID; no Nonconformance is created; no certificate or posture change"]
      - from: SUBSTANTIATED
        to: CLOSED
        trigger: "POST /gfco/nonconformances/{nonconformanceId}/verification with effectiveness_confirmed=true on the Nonconformance whose complaint_id is this complaint"
        actor: system
        preconditions: ["ConsumerComplaint.status IN {SUBSTANTIATED, RECALL_COORDINATION}"]
        side_effects: ["closed_on = clock_now; the certificate suspension is NOT auto-lifted"]
      - from: RECALL_COORDINATION
        to: CLOSED
        trigger: "POST /gfco/nonconformances/{nonconformanceId}/verification with effectiveness_confirmed=true on the Nonconformance whose complaint_id is this complaint"
        actor: system
        preconditions: ["ConsumerComplaint.status IN {SUBSTANTIATED, RECALL_COORDINATION}"]
        side_effects: ["closed_on = clock_now; recall_scope_lot_codes and recall_action are left unchanged as the historical recall record"]

  - entity: LotTest
    state_field: status
    initial_state: RECORDED
    terminal_states: [SUPERSEDED_BY_RETEST]
    note: "Single-hop supersede machine; a FOR_CAUSE retest of the same lot_code retires the earlier result."
    transitions:
      - from: RECORDED
        to: SUPERSEDED_BY_RETEST
        trigger: "POST /gfco/lot-tests with test_type == FOR_CAUSE and the same product_id and lot_code as an existing RECORDED LotTest"
        actor: system
        preconditions: ["the earlier LotTest.status == RECORDED", "the earlier LotTest.sample_collected_on <= the new sample_collected_on"]
        side_effects:
          - "the superseded LotTest keeps its verdict and threshold_applied_ppm but stops contributing to calculations.recall_scope_determination (eligibility requires status == RECORDED)"
          - "the superseded LotTest's in_recall_scope is recomputed to false"

# =============================================================================
# 1.2.1 Concurrency Rules (optimistic_concurrency layer)
# =============================================================================
concurrency_rules:
  - rule_id: testing-plan-create-stale-product
    parent_entity: Product
    child_entity: Product
    contended_resource: "the product's threshold standard and lot sampling plan fields, which are recomputed wholesale from the linked ingredient set"
    write_endpoint: "POST /gfco/products/{productId}/testing-plan"
    occ_field: expected_product_version
    error_id: ERR_STALE_PRODUCT_VERSION
    http_status: 412
    rationale: >-
      A reviewer reads a Product, decides the sampling plan is correct for the ingredient set
      they just saw, and posts the testing plan. If the linked ingredient set changed after the
      read - a new ProductIngredient line, an ingredient block, a re-review - the plan the
      reviewer intended no longer matches the data, so the write must be rejected with a stale
      version rather than silently activating a plan derived from data the reviewer never saw.
    resolution: >-
      The caller must supply expected_product_version equal to the Product's current version.
      When it differs the write is rejected with ERR_STALE_PRODUCT_VERSION (412) and nothing is
      persisted; on success the Product version increments by 1 so a second attempt with the
      same expected_product_version also fails.

  - rule_id: ca-plan-submit-stale-nonconformance
    parent_entity: Nonconformance
    child_entity: Nonconformance
    contended_resource: "the corrective action plan text and the revision counter of a single nonconformance"
    write_endpoint: "POST /gfco/nonconformances/{nonconformanceId}/corrective-action-plan"
    occ_field: expected_nonconformance_version
    error_id: ERR_STALE_NONCONFORMANCE_VERSION
    http_status: 412
    rationale: >-
      An applicant contact drafts a corrective action plan against the nonconformance as they
      read it. If a reviewer rejects the previous plan or the surveillance sweep escalates the
      record in between, the applicant's plan is answering a stale record with a different
      revision count and a different due date, so it must be rejected rather than overwriting
      the newer state.
    resolution: >-
      The caller must supply expected_nonconformance_version equal to the Nonconformance's
      current version. A mismatch yields ERR_STALE_NONCONFORMANCE_VERSION (412) with no state
      change; a successful submission increments version by 1.

# =============================================================================
# 1.3 Calculation Rules
# =============================================================================
calculations:

  - name: threshold_standard_selection
    entity: Product
    output_field: threshold_ppm
    algorithm_type: constraint_propagation
    trigger: "POST /gfco/products/{productId}/testing-plan; recomputed when a ChangeNotification is accepted with impact_level == LOW"
    input_set: "every ProductIngredient row of the Product joined to its Ingredient, plus the Product's Facility and requested_mark_tier"
    constants:
      BASE_PROGRAM_PPM: 20
      MARK_TIER_PPM: "{STANDARD: 20, PREMIUM: 10, ELITE: 5}"
      RISK_CLASS_PPM: "{INHERENTLY_GF: 20, GF_PROCESSED: 15, HIGH_RISK_GRAIN: 10}"
      SHARED_EQUIPMENT_PPM: 10
      NO_SHARED_EQUIPMENT_PPM: 20
      OPERATIONS_PPM: "{NONE: 20, ADJACENT_LINES: 10, SAME_LINE: 5}"
      SAME_LINE_HIGH_RISK_PENALTY_PPM: 2
      MIN_ALLOWED_PPM: 5
    formula: >-
      STEP 1 - five independent caps are computed:
        cap_program   = BASE_PROGRAM_PPM (20)
        cap_tier      = MARK_TIER_PPM[Product.requested_mark_tier]
        cap_ingredient = min over every ProductIngredient row of the Product of
                         RISK_CLASS_PPM[that row's Ingredient.risk_class]
        cap_equipment = SHARED_EQUIPMENT_PPM (10) when Facility.shared_equipment_present == true
                        else NO_SHARED_EQUIPMENT_PPM (20)
        cap_operations = OPERATIONS_PPM[Facility.gluten_containing_operations]
      STEP 2 - raw = min(cap_program, cap_tier, cap_ingredient, cap_equipment, cap_operations).
      STEP 3 - conditional penalty, applied to the MINIMUM and not to any individual cap:
        when Facility.gluten_containing_operations == SAME_LINE
        AND at least one ProductIngredient row of the Product references an Ingredient whose
        risk_class == HIGH_RISK_GRAIN, then raw = raw - SAME_LINE_HIGH_RISK_PENALTY_PPM (2).
      STEP 4 - threshold_ppm = max(MIN_ALLOWED_PPM (5), raw).
      The order is load-bearing: the penalty is subtracted AFTER the minimum is taken and the
      floor is applied AFTER the penalty, so a SAME_LINE facility with a HIGH_RISK_GRAIN
      ingredient yields max(5, 5 - 2) == 5 rather than 3.
    precision: "integer ppm; no rounding is required because every constant and the penalty are integers"
    note: >-
      Five interacting inputs with a nested min, a conditional adjustment and a floor. Getting
      any single cap or the step order wrong changes the certified threshold and therefore every
      downstream lot verdict.

  - name: lot_sampling_frequency
    entity: Product
    output_field: sampling_lots_per_year
    algorithm_type: weighted_scoring
    trigger: "POST /gfco/products/{productId}/testing-plan; recomputed when a ChangeNotification is accepted with impact_level == LOW"
    input_set: "every ProductIngredient row of the Product joined to its Ingredient, plus the Product's freshly computed threshold_ppm"
    constants:
      BASE_LOTS_PER_YEAR: 4
      RISK_WEIGHT: "{INHERENTLY_GF: 0.25, GF_PROCESSED: 0.5, HIGH_RISK_GRAIN: 1.0}"
      THRESHOLD_MULTIPLIER_TIGHT: 2.0
      THRESHOLD_MULTIPLIER_MID: 1.5
      THRESHOLD_MULTIPLIER_LOOSE: 1.0
      LOW_INCLUSION_PCT: 2
      LOW_INCLUSION_FACTOR: 0.5
      FULL_INCLUSION_FACTOR: 1.0
      MIN_LOTS_PER_YEAR: 2
      MIN_SAMPLING_EXCLUSION_DAYS: 7
      DAYS_PER_YEAR: 365
    formula: >-
      threshold_multiplier is shared by every line and is derived from the Product's threshold_ppm:
        THRESHOLD_MULTIPLIER_TIGHT (2.0) when threshold_ppm <= 5,
        THRESHOLD_MULTIPLIER_MID (1.5) when 5 < threshold_ppm <= 10,
        THRESHOLD_MULTIPLIER_LOOSE (1.0) when threshold_ppm > 10.
      For EACH ProductIngredient row of the Product:
        inclusion_factor = LOW_INCLUSION_FACTOR (0.5) when inclusion_pct < LOW_INCLUSION_PCT (2)
                           else FULL_INCLUSION_FACTOR (1.0)
        line_lots = ROUND_HALF_UP(BASE_LOTS_PER_YEAR (4)
                                  * RISK_WEIGHT[Ingredient.risk_class]
                                  * threshold_multiplier
                                  * inclusion_factor)                     -- rounded PER LINE
      sampling_lots_per_year = max(MIN_LOTS_PER_YEAR (2), sum of line_lots over all rows)
      sampling_exclusion_days = max(MIN_SAMPLING_EXCLUSION_DAYS (7),
                                    floor(DAYS_PER_YEAR (365) / sampling_lots_per_year))
    precision: >-
      ROUND_HALF_UP to an integer is applied to EACH LINE and only then are the lines summed;
      the total is never rounded again. Rounding the sum instead of the lines is a different
      answer - two lines of 1.5 give 2 + 2 = 4 per-line but ROUND_HALF_UP(3.0) = 3 sum-first.
      sampling_exclusion_days uses floor division, never ROUND_HALF_UP.
    note: "Nested rounding: per-line ROUND_HALF_UP inside an outer sum, then an outer floor for the exclusion interval."

  - name: certification_fee_schedule
    entity: Certificate
    output_field: total_fee_cents
    algorithm_type: tiered_pricing
    trigger: "POST /gfco/certificates"
    input_set: "the Product being certified, its ProductIngredient rows and its Facility"
    constants:
      PRODUCT_BASE_FEE_CENTS: 98000
      PER_INGREDIENT_FEE_CENTS: 6000
      SHARED_EQUIPMENT_SURCHARGE_CENTS: 45000
      SURVEILLANCE_RATE_TIER_1: 0.20
      SURVEILLANCE_RATE_TIER_2: 0.15
      SURVEILLANCE_RATE_TIER_3: 0.10
      TIER_1_CEILING_CENTS: 150000
      TIER_2_CEILING_CENTS: 250000
    formula: >-
      STEP 1 - base_fee_cents = PRODUCT_BASE_FEE_CENTS (98000)
                              + PER_INGREDIENT_FEE_CENTS (6000) * Product.linked_ingredient_count
                              + (SHARED_EQUIPMENT_SURCHARGE_CENTS (45000)
                                 when Facility.shared_equipment_present == true else 0)
      STEP 2 - the surveillance rate is selected by comparing BASE_FEE_CENTS - not the total - to
               the tier ceilings:
                 base_fee_cents <  TIER_1_CEILING_CENTS (150000)                  -> 0.20
                 TIER_1_CEILING_CENTS <= base_fee_cents < TIER_2_CEILING_CENTS    -> 0.15
                 base_fee_cents >= TIER_2_CEILING_CENTS (250000)                  -> 0.10
      STEP 3 - surveillance_surcharge_cents = ROUND_HALF_UP(base_fee_cents * rate)
      STEP 4 - total_fee_cents = base_fee_cents + surveillance_surcharge_cents
      The tier lookup keying on base_fee_cents is the pinned resolution of an otherwise circular
      reading: the surcharge depends on the rate, the rate looks like it should depend on the
      billed total, and the total depends on the surcharge. Steps 1-4 run exactly once in this
      order and the rate is NEVER re-selected after step 4.
    precision: "integer cents throughout; ROUND_HALF_UP applied once, at step 3, to the surcharge only"
    note: "Circular-looking dependency resolved by an explicit evaluation order and an explicit tier key."

  - name: audit_compliance_score
    entity: Audit
    output_field: provisional_score
    algorithm_type: weighted_scoring
    trigger: "POST /gfco/audits/{auditId}/close computes the PROVISIONAL_ONSITE variant; every status change of a linked Nonconformance recomputes the FINAL_ADJUDICATED variant"
    input_set: "every Nonconformance whose audit_id == this Audit.id, filtered per variant"
    constants:
      PERFECT_SCORE: 100
      SEVERITY_POINTS: "{MINOR: 2, MAJOR: 8, CRITICAL: 25}"
      CATEGORY_MULTIPLIER: "{SHARED_EQUIPMENT: 1.5, AIR_HANDLING: 1.25, SANITATION: 1.25, DOCUMENTATION: 1.0, LABELING: 1.0, THRESHOLD_EXCEEDANCE: 1.5}"
      VERIFIED_CA_RELIEF_FACTOR: 0.5
      ESCALATION_PENALTY: 10
      AUDIT_PASS_SCORE: 90
      AUDIT_CONDITIONAL_SCORE: 75
    variants:
      - variant: PROVISIONAL_ONSITE
        applies_when: "computed once at POST /gfco/audits/{auditId}/close and then frozen in Audit.provisional_score; it is the value the CLOSED_PASS / CLOSED_CONDITIONAL / CLOSED_FAIL branch is chosen from"
        input_filter: "only Nonconformances whose audit_id == this Audit.id AND created_at <= Audit.onsite_end_at"
        formula: >-
          deduction = sum over the filtered Nonconformances of
                      SEVERITY_POINTS[severity] * CATEGORY_MULTIPLIER[category]
          provisional_score = max(0, PERFECT_SCORE (100) - ROUND_HALF_UP(deduction))
          ca_verified is IGNORED by this variant and no escalation penalty is applied.
      - variant: FINAL_ADJUDICATED
        applies_when: "recomputed into Audit.final_score on every create or status change of a Nonconformance whose audit_id == this Audit.id, including changes recorded long after the audit closed"
        input_filter: "every Nonconformance whose audit_id == this Audit.id regardless of created_at"
        formula: >-
          per_finding = SEVERITY_POINTS[severity] * CATEGORY_MULTIPLIER[category]
                        * (VERIFIED_CA_RELIEF_FACTOR (0.5) when Nonconformance.ca_verified == true else 1.0)
          escalations = ESCALATION_PENALTY (10) * count of those Nonconformances whose status == ESCALATED
          final_score = max(0, PERFECT_SCORE (100) - ROUND_HALF_UP(sum of per_finding) - escalations)
    divergence: >-
      The two variants disagree whenever a linked Nonconformance was created after
      Audit.onsite_end_at, or was verified effective (ca_verified == true), or escalated. The
      audit outcome branch is bound to the PROVISIONAL_ONSITE value forever - a later
      FINAL_ADJUDICATED improvement never reopens a CLOSED_FAIL audit.
    precision: >-
      The severity x multiplier products are summed EXACTLY as decimals and ROUND_HALF_UP is
      applied once to the total deduction; per-finding rounding would drift (8 * 1.5 = 12.0 and
      2 * 1.0 = 2.0 sum to 14.0, while a 0.5-relieved 12.0 becomes 6.0 and rounds identically,
      but 25 * 1.25 = 31.25 relieved to 15.625 must round only inside the total).
    note: "Dual-variant calculation 1 of 2: same Audit, two populations and two relief rules."

  - name: applicant_compliance_posture
    entity: Applicant
    output_field: posture_score_cycle
    algorithm_type: decay_function
    trigger: "recomputed on every Nonconformance create or status change, every Certificate status change, every ConsumerComplaint outcome, and on POST /gfco/surveillance-runs"
    input_set: "every Nonconformance whose applicant_id == this Applicant.id, every Certificate whose applicant_id == this Applicant.id, and every ConsumerComplaint of those Certificates"
    constants:
      PERFECT_POSTURE: 100
      SUSPENDED_CERT_PENALTY: 5
      SUBSTANTIATED_COMPLAINT_PENALTY: 15
      GOOD_STANDING_MIN: 85
      WATCH_MIN: 60
      ROLLING_WINDOW_DAYS: 365
    variants:
      - variant: ROLLING_12_MONTH
        applies_when: "always computed and stored in Applicant.posture_score_rolling_12m; this is the figure published to the program's public register"
        input_filter: >-
          window = [clock_now - ROLLING_WINDOW_DAYS (365 days), clock_now]; only Nonconformances
          whose created_at falls inside the window and only ConsumerComplaints whose reported_on
          falls inside the window are counted
        formula: >-
          nc_term = sum of Nonconformance.penalty_points over this Applicant's Nonconformances
                    whose status IN {OPEN, CA_SUBMITTED, CA_REJECTED, ESCALATED}
                    AND created_at inside the window
          complaint_term = SUBSTANTIATED_COMPLAINT_PENALTY (15)
                           * Applicant.substantiated_complaint_count_rolling
          posture_score_rolling_12m = max(0, PERFECT_POSTURE (100) - nc_term
                                          - SUSPENDED_CERT_PENALTY (5) * Applicant.suspended_certificate_count
                                          - complaint_term)
      - variant: CERTIFICATION_CYCLE
        applies_when: "always computed and stored in Applicant.posture_score_cycle; this is the figure the issuance gate and the ChangeNotification gate read"
        input_filter: >-
          window = [Applicant.current_cycle_started_on, clock_now], or [Applicant.created_at,
          clock_now] when current_cycle_started_on is null because no certificate has ever been
          issued; the same status filter applies
        formula: >-
          identical arithmetic to ROLLING_12_MONTH except that the window is the certification
          cycle and the complaint term uses Applicant.substantiated_complaint_count_cycle
    band_mapping: >-
      compliance_posture is derived from posture_score_cycle (the CERTIFICATION_CYCLE variant):
        posture_score_cycle >= GOOD_STANDING_MIN (85)                 -> GOOD_STANDING
        WATCH_MIN (60) <= posture_score_cycle < GOOD_STANDING_MIN     -> WATCH
        posture_score_cycle < WATCH_MIN (60)                          -> PROBATION
      OVERRIDE, applied after the band lookup and independent of the score: when at least one
      Certificate of this Applicant has status == REVOKED with revocation_reason IN
      {FRAUD, REPEAT_FAILURE}, compliance_posture is SUSPENDED.
    divergence: >-
      A cycle that began before the rolling window opens keeps counting findings the rolling
      figure has already forgotten, so an applicant carrying an old open nonconformance shows a
      perfect rolling score and a degraded cycle score at the same instant. The issuance gate
      reads only the cycle variant, so the published rolling figure never unblocks issuance.
    precision: "integer points; both variants are integers because every penalty constant is an integer"
    note: "Dual-variant calculation 2 of 2: same Applicant, two windows, and only one of them gates writes."

  - name: open_nc_penalty_points
    entity: Applicant
    output_field: open_nc_penalty_points
    algorithm_type: aggregation
    trigger: "every Nonconformance create or status change for this Applicant, and POST /gfco/surveillance-runs"
    input_set: "every Nonconformance whose applicant_id == this Applicant.id AND status IN {OPEN, CA_SUBMITTED, CA_REJECTED, ESCALATED}"
    constants:
      SEVERITY_POINTS: "{MINOR: 2, MAJOR: 8, CRITICAL: 25}"
    formula: >-
      open_nc_penalty_points = sum of SEVERITY_POINTS[severity] over the input set, with no time
      window. Records whose status is CA_ACCEPTED or CLOSED contribute 0; a record that returns
      from CA_ACCEPTED to CA_REJECTED contributes its full points again, so the aggregate must be
      recomputed from the input set rather than adjusted incrementally.
    precision: "integer"
    note: "Status-filtered aggregation that is non-monotonic because the corrective-action cycle can re-open a record."

  - name: active_certified_product_count
    entity: Applicant
    output_field: active_certified_product_count
    algorithm_type: aggregation
    trigger: "every Certificate status change and POST /gfco/surveillance-runs"
    input_set: "every Certificate whose applicant_id == this Applicant.id AND status == ISSUED"
    constants: {}
    formula: >-
      active_certified_product_count = count of the input set. SUSPENDED, REVOKED and EXPIRED
      certificates are excluded, so a suspend-then-reinstate round trip must return the count to
      its exact pre-suspension value while suspension_count keeps the historical laps.
    precision: "integer"
    note: "Conserved counter paired with Certificate.suspension_count for the compensating-invariant checks."

  - name: surveillance_schedule
    entity: Certificate
    output_field: surveillance_due_on
    algorithm_type: chronological
    trigger: "POST /gfco/certificates sets the initial schedule; POST /gfco/surveillance-runs re-derives surveillance_status; a SURVEILLANCE audit closing CLOSED_PASS or CLOSED_CONDITIONAL rebases surveillance_due_on"
    input_set: "the Certificate's issued_on, its current surveillance_due_on and the logical clock"
    constants:
      SURVEILLANCE_INTERVAL_DAYS: 365
      SURVEILLANCE_GRACE_DAYS: 60
      CERTIFICATE_TERM_DAYS: 1095
    formula: >-
      At issuance:
        surveillance_due_on = issued_on + SURVEILLANCE_INTERVAL_DAYS (365 days)
        expires_on          = issued_on + CERTIFICATE_TERM_DAYS (1095 days)
      On every POST /gfco/surveillance-runs, for each Certificate whose status IN {ISSUED, SUSPENDED}:
        clock_now <  surveillance_due_on                                       -> CURRENT
        surveillance_due_on <= clock_now < surveillance_due_on + 60 days        -> DUE
        clock_now >= surveillance_due_on + SURVEILLANCE_GRACE_DAYS (60 days)    -> OVERDUE
      Both window edges are inclusive on the left and exclusive on the right, so a certificate
      whose surveillance_due_on equals clock_now is DUE and not CURRENT, and one exactly 60 days
      past due is OVERDUE and not DUE.
      When a SURVEILLANCE Audit of the certificate's Facility closes CLOSED_PASS or
      CLOSED_CONDITIONAL: surveillance_due_on = clock_now + 365 days and surveillance_status is
      re-derived from the rules above (which yields CURRENT).
    precision: "whole days on the logical clock; a day boundary is the UTC instant, so 2027-08-11T00:00:00Z is exactly 365 days after 2026-08-11T00:00:00Z"
    note: "Two-edge threshold on a logical clock feeding an independent state dimension."

  - name: lot_test_verdict
    entity: LotTest
    output_field: verdict
    algorithm_type: threshold
    trigger: "POST /gfco/lot-tests"
    input_set: "the submitted ppm_result and the Product's threshold_ppm snapshotted into threshold_applied_ppm"
    constants:
      CRITICAL_EXCEEDANCE_FACTOR: 2
    formula: >-
      threshold_applied_ppm = Product.threshold_ppm at record time.
      verdict = FAIL when ppm_result > threshold_applied_ppm, otherwise PASS. The comparison is
      strictly greater-than, so a result exactly equal to the threshold PASSES.
      On FAIL a Nonconformance is created with source_type = LOT_TEST, category =
      THRESHOLD_EXCEEDANCE and
        severity = CRITICAL when ppm_result > CRITICAL_EXCEEDANCE_FACTOR (2) * threshold_applied_ppm
                   else MAJOR
      (again strictly greater-than: exactly twice the threshold is MAJOR, not CRITICAL), and
      LotTest.nonconformance_created = true.
      When the failing LotTest.test_type == UNANNOUNCED and the Product has a Certificate with
      status == ISSUED, that Certificate transitions ISSUED -> SUSPENDED with suspension_reason =
      FAILED_UNANNOUNCED_TEST; a failing SCHEDULED or FOR_CAUSE lot raises the nonconformance but
      does NOT suspend on its own (a CRITICAL nonconformance suspends through its own cascade).
    precision: "ppm_result is a decimal compared against an integer threshold; 10.0 against 10 PASSES and 10.1 against 10 FAILS"
    note: "Two independent strict thresholds - the verdict boundary and the CRITICAL severity boundary - on the same input."

  - name: certification_fee_refund
    entity: Certificate
    output_field: fee_refunded
    algorithm_type: threshold
    trigger: "POST /gfco/certificates/{certificateId}/revocation"
    input_set: "the Certificate's issued_on, total_fee_cents and revocation_reason, the logical clock, and the Product's LotTests"
    constants:
      FEE_REFUND_WINDOW_DAYS: 30
    formula: >-
      fee_refunded = true when ALL THREE hold:
        (1) revocation_reason == VOLUNTARY_WITHDRAWAL
        (2) clock_now <= issued_on + FEE_REFUND_WINDOW_DAYS (30 days)   -- inclusive boundary
        (3) no LotTest exists for the Certificate's Product whose test_type == UNANNOUNCED
      otherwise fee_refunded = false.
      When fee_refunded is true, Applicant.fee_balance_cents decreases by exactly
      Certificate.total_fee_cents, restoring the balance it held before this certificate was
      issued; when false the balance is untouched by the revocation.
    precision: "the window boundary is inclusive - revoking exactly 30 days after issuance refunds, 30 days plus one second does not"
    note: "Compensating money invariant: fee_balance_cents must equal the sum of total_fee_cents over certificates with fee_charged == true AND fee_refunded == false at all times."

  - name: recall_scope_determination
    entity: ConsumerComplaint
    output_field: recall_scope_lot_codes
    algorithm_type: projection
    trigger: "POST /gfco/consumer-complaints/{complaintId}/triage"
    input_set: "every LotTest whose product_id == the complaint's Certificate.product_id"
    constants:
      RECALL_LOOKBACK_DAYS: 90
      RECALL_LOT_SCOPE: 3
    formula: >-
      SELECTOR POLICY, all four elements pinned:
        (1) ELIGIBILITY - a LotTest is a candidate iff status == RECORDED (superseded retests are
            never candidates) AND sample_collected_on is inside the CLOSED interval
            [exposure_date - RECALL_LOOKBACK_DAYS (90 days), exposure_date]; a lot collected
            exactly 90 days before exposure is eligible, 91 days before is not, and a lot
            collected exactly on exposure_date is eligible.
        (2) RANKING - candidates are ordered by sample_collected_on DESC (most recent first).
        (3) TIE-BREAK - candidates sharing a sample_collected_on are ordered by created_at ASC,
            i.e. the earlier-recorded row wins the higher rank.
        (4) TAKE - the first RECALL_LOT_SCOPE (3) candidates are selected; fewer than 3 candidates
            selects all of them.
      recall_scope_lot_codes = the lot_code values of the selected LotTests in selection order.
      Each selected LotTest has in_recall_scope set to true.
      recall_action is then derived:
        no candidates at all                                     -> recall_scope_lot_codes = []
                                                                    and recall_action = ADVISORY_ONLY
        at least one SELECTED LotTest has verdict == FAIL         -> MANDATORY_RECALL_SUPPORT
        otherwise                                                -> VOLUNTARY_RECALL
      A FAIL that exists on an eligible-but-not-selected lot (rank 4 or lower) does NOT upgrade
      the action.
    precision: "day-granular closed interval on the logical clock; selection order is stable and observable in recall_scope_lot_codes"
    note: "Selector policy with an explicit empty-candidate-set rule and a rank-sensitive severity upgrade."

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; lower number wins)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the six roles declared in 1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting X-User-Role appears in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: >-
      request body shape: every non-optional field of the endpoint's input list is present, every
      enum field carries a declared value, inclusion_pct is in (0, 100], ppm_result and swab_ppm
      are >= 0, onsite_end_at > onsite_start_at, and every datetime is ISO-8601 with a Z offset
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 4
    category: existence
    check: "every templated id in the path resolves to a live row, checked left to right so the leftmost missing id decides the error"
    error_id: "ERR_APPLICANT_NOT_FOUND | ERR_FACILITY_NOT_FOUND | ERR_SUPPLIER_NOT_FOUND | ERR_SUPPLIER_DOCUMENT_NOT_FOUND | ERR_INGREDIENT_NOT_FOUND | ERR_PRODUCT_NOT_FOUND | ERR_PRODUCT_INGREDIENT_NOT_FOUND | ERR_LOT_TEST_NOT_FOUND | ERR_AUDIT_NOT_FOUND | ERR_CERTIFICATE_NOT_FOUND | ERR_NONCONFORMANCE_NOT_FOUND | ERR_COMPLAINT_NOT_FOUND | ERR_CHANGE_NOTIFICATION_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a templated path segment"

  - priority: 5
    category: existence
    check: >-
      every FK carried in the request body resolves to a live row, checked in the order the
      endpoint's input list declares them (for POST /gfco/nonconformances that is applicant_id,
      then certificate_id, then audit_id, then lot_test_id, then complaint_id)
    error_id: "ERR_<ENTITY>_NOT_FOUND matching the unresolved FK"
    http_status: 404
    applies_to: "POST /gfco/facilities, POST /gfco/ingredients, POST /gfco/supplier-documents, POST /gfco/products, POST /gfco/product-ingredients, POST /gfco/lot-tests, POST /gfco/audits, POST /gfco/certificates, POST /gfco/nonconformances, POST /gfco/change-notifications, POST /gfco/consumer-complaints"

  - priority: 6
    category: auth
    check: >-
      when X-User-Role == ApplicantContact, X-User-ID must equal the owning Applicant.id reached
      from the target resource (Facility.applicant_id, Ingredient.applicant_id,
      Product.applicant_id, Nonconformance.applicant_id, or Certificate.applicant_id via the
      change notification)
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /gfco/facilities, POST /gfco/ingredients, POST /gfco/ingredients/{ingredientId}/submission, POST /gfco/supplier-documents, POST /gfco/products, POST /gfco/product-ingredients, POST /gfco/nonconformances/{nonconformanceId}/corrective-action-plan, POST /gfco/change-notifications"

  - priority: 7
    category: state
    check: "the supplied expected_<parent>_version equals the parent row's current version"
    error_id: "ERR_STALE_PRODUCT_VERSION | ERR_STALE_NONCONFORMANCE_VERSION"
    http_status: 412
    applies_to: "POST /gfco/products/{productId}/testing-plan, POST /gfco/certificates, POST /gfco/nonconformances/{nonconformanceId}/corrective-action-plan"

  - priority: 8
    category: state
    check: "SupplierDocument.status == PENDING"
    error_id: ERR_DOCUMENT_ALREADY_DECIDED
    http_status: 409
    applies_to: "POST /gfco/supplier-documents/{documentId}/verification"

  - priority: 9
    category: state
    check: >-
      Ingredient.status is legal for the requested operation: submission requires status IN
      {DRAFT, REJECTED, BLOCKED}; review requires status == UNDER_REVIEW; linking a
      ProductIngredient requires status NOT IN {REJECTED}
    error_id: ERR_INVALID_INGREDIENT_STATE
    http_status: 409
    applies_to: "POST /gfco/ingredients/{ingredientId}/submission, POST /gfco/ingredients/{ingredientId}/review, POST /gfco/product-ingredients"

  - priority: 10
    category: state
    check: >-
      the Product dimension targeted by the operation is in a legal state: formula-review
      requires formula_status IN {DRAFT, REJECTED}; testing-plan requires formula_status ==
      CLEARED; label-review requires label_status IN {NOT_SUBMITTED, REJECTED, APPROVED};
      product-ingredient linking requires formula_status IN {DRAFT, REJECTED}
    error_id: ERR_INVALID_PRODUCT_STATE
    http_status: 409
    applies_to: "POST /gfco/products/{productId}/formula-review, POST /gfco/products/{productId}/testing-plan, POST /gfco/products/{productId}/label-review, POST /gfco/product-ingredients"

  - priority: 11
    category: state
    check: "Audit.status == SCHEDULED AND clock_now >= Audit.onsite_start_at for start; Audit.status == IN_PROGRESS AND clock_now >= Audit.onsite_end_at for close"
    error_id: ERR_INVALID_AUDIT_STATE
    http_status: 409
    applies_to: "POST /gfco/audits/{auditId}/start, POST /gfco/audits/{auditId}/close"

  - priority: 12
    category: state
    check: >-
      Certificate.status is NOT IN {REVOKED, EXPIRED}; suspension additionally requires status ==
      ISSUED. This rule does NOT cover reinstatement - a terminal certificate offered for
      reinstatement is decided by priority 13 instead, so the two rules never both fire.
    error_id: ERR_CERTIFICATE_TERMINAL
    http_status: 409
    applies_to: "POST /gfco/certificates/{certificateId}/suspension, POST /gfco/certificates/{certificateId}/revocation, POST /gfco/change-notifications, POST /gfco/consumer-complaints"

  - priority: 13
    category: state
    check: "Certificate.status == SUSPENDED; any other status including the terminal REVOKED and EXPIRED fails here"
    error_id: ERR_CERTIFICATE_NOT_SUSPENDED
    http_status: 409
    applies_to: "POST /gfco/certificates/{certificateId}/reinstatement"

  - priority: 14
    category: state
    check: >-
      Nonconformance.status is legal for the operation: corrective-action-plan requires status IN
      {OPEN, CA_REJECTED}; corrective-action-decision requires status == CA_SUBMITTED;
      verification requires status == CA_ACCEPTED
    error_id: ERR_INVALID_NONCONFORMANCE_STATE
    http_status: 409
    applies_to: "POST /gfco/nonconformances/{nonconformanceId}/corrective-action-plan, POST /gfco/nonconformances/{nonconformanceId}/corrective-action-decision, POST /gfco/nonconformances/{nonconformanceId}/verification"

  - priority: 15
    category: state
    check: "ConsumerComplaint.status == RECEIVED for triage and == INVESTIGATING for the investigation outcome"
    error_id: ERR_INVALID_COMPLAINT_STATE
    http_status: 409
    applies_to: "POST /gfco/consumer-complaints/{complaintId}/triage, POST /gfco/consumer-complaints/{complaintId}/investigation-outcome"

  - priority: 16
    category: state
    check: "ChangeNotification.status == SUBMITTED"
    error_id: ERR_INVALID_CHANGE_NOTIFICATION_STATE
    http_status: 409
    applies_to: "POST /gfco/change-notifications/{notificationId}/assessment"

  - priority: 17
    category: state
    check: "the requested Supplier status differs from the supplier's current status"
    error_id: ERR_SUPPLIER_STATUS_UNCHANGED
    http_status: 409
    applies_to: "POST /gfco/suppliers/{supplierId}/status"

  - priority: 18
    category: business_safety
    check: "swab_ppm <= SANITATION_SWAB_LIMIT_PPM (5); a swab exactly at 5 ppm is accepted and 5.1 ppm is not"
    error_id: ERR_SANITATION_SWAB_ABOVE_LIMIT
    http_status: 422
    applies_to: "POST /gfco/facilities/{facilityId}/sanitation-validation"

  - priority: 19
    category: business_safety
    check: >-
      the relevant Facility.sanitation_validation_status == VALIDATED at the moment of the call;
      EXPIRED (sanitation_expires_on reached and a surveillance run observed it) and UNVALIDATED
      both fail
    error_id: ERR_FACILITY_SANITATION_NOT_VALIDATED
    http_status: 422
    applies_to: "POST /gfco/audits/{auditId}/close, POST /gfco/certificates, POST /gfco/certificates/{certificateId}/reinstatement"

  - priority: 20
    category: business_safety
    check: >-
      the Product's Facility.last_closed_audit_outcome IN {CLOSED_PASS, CLOSED_CONDITIONAL};
      NONE (no audit has ever closed) and CLOSED_FAIL both fail
    error_id: ERR_FACILITY_AUDIT_NOT_PASSED
    http_status: 422
    applies_to: "POST /gfco/certificates"

  - priority: 21
    category: business_safety
    check: >-
      no Nonconformance of the target certificate (or, at issuance, of the product's applicant
      referencing the product's facility audits) has severity == CRITICAL AND status IN
      {OPEN, CA_SUBMITTED, CA_REJECTED, ESCALATED}
    error_id: ERR_OPEN_CRITICAL_NONCONFORMANCE
    http_status: 422
    applies_to: "POST /gfco/certificates, POST /gfco/certificates/{certificateId}/reinstatement"

  - priority: 22
    category: business_referential
    check: "the Ingredient's Supplier.status != SUSPENDED"
    error_id: ERR_SUPPLIER_SUSPENDED
    http_status: 422
    applies_to: "POST /gfco/ingredients/{ingredientId}/submission, POST /gfco/ingredients/{ingredientId}/review, POST /gfco/product-ingredients"

  - priority: 23
    category: business_referential
    check: >-
      Ingredient.verified_doc_types contains every doc_type REQUIRED_DOC_TYPES[risk_class]
      demands: INHERENTLY_GF requires {ALLERGEN_STATEMENT}; GF_PROCESSED requires
      {ALLERGEN_STATEMENT, PROCESS_FLOW}; HIGH_RISK_GRAIN requires
      {ALLERGEN_STATEMENT, PROCESS_FLOW, COA}
    error_id: ERR_REQUIRED_SUPPLIER_DOCS_MISSING
    http_status: 422
    applies_to: "POST /gfco/ingredients/{ingredientId}/review with decision=APPROVE"

  - priority: 24
    category: business_referential
    check: >-
      for doc_type == COA, lab_ppm_claim <= COA_MAX_PPM_CLAIM[risk_class] of the referenced
      Ingredient (INHERENTLY_GF 20, GF_PROCESSED 10, HIGH_RISK_GRAIN 5); a claim exactly at the
      cap is accepted
    error_id: ERR_COA_PPM_CLAIM_TOO_HIGH
    http_status: 422
    applies_to: "POST /gfco/supplier-documents/{documentId}/verification with decision=APPROVE"

  - priority: 25
    category: business_referential
    check: "every Ingredient referenced by a ProductIngredient row of the Product has status == APPROVED"
    error_id: ERR_INGREDIENT_NOT_APPROVED
    http_status: 422
    applies_to: "POST /gfco/products/{productId}/formula-review with decision=CLEAR, POST /gfco/certificates"

  - priority: 26
    category: business_referential
    check: "Product.linked_ingredient_count >= 1"
    error_id: ERR_NO_INGREDIENTS_LINKED
    http_status: 422
    applies_to: "POST /gfco/products/{productId}/formula-review with decision=CLEAR, POST /gfco/products/{productId}/testing-plan"

  - priority: 27
    category: business_referential
    check: "Product.testing_plan_status == ACTIVE"
    error_id: ERR_TESTING_PLAN_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /gfco/lot-tests, POST /gfco/certificates"

  - priority: 28
    category: business_referential
    check: "Product.label_status == APPROVED"
    error_id: ERR_LABEL_NOT_APPROVED
    http_status: 422
    applies_to: "POST /gfco/certificates"

  - priority: 29
    category: business_referential
    check: "on POST /gfco/products/{productId}/label-review with decision=APPROVE the payload mark_tier_granted must be present and equal Product.requested_mark_tier; at issuance Product.mark_tier_granted != NONE and equals Product.requested_mark_tier"
    error_id: ERR_MARK_TIER_NOT_GRANTED
    http_status: 422
    applies_to: "POST /gfco/products/{productId}/label-review with decision=APPROVE, POST /gfco/certificates"

  - priority: 30
    category: business_referential
    check: >-
      the Nonconformance's certificate_id, when present, points at a Certificate whose status is
      NOT IN {REVOKED, EXPIRED} - a corrective action cannot be filed against a certificate that
      no longer exists in force
    error_id: ERR_CERTIFICATE_TERMINAL_NO_CA
    http_status: 422
    applies_to: "POST /gfco/nonconformances/{nonconformanceId}/corrective-action-plan"

  - priority: 31
    category: business_constraint
    check: >-
      segregation of duties on X-User-ID: the certificate issuer must differ from both
      Product.formula_cleared_by_user_id and the closed_by_user_id of the facility's latest closed
      Audit; the corrective-action decider must differ from Nonconformance.raised_by_user_id; the
      effectiveness verifier must differ from Nonconformance.ca_decided_by_user_id
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /gfco/certificates, POST /gfco/nonconformances/{nonconformanceId}/corrective-action-decision, POST /gfco/nonconformances/{nonconformanceId}/verification"

  - priority: 32
    category: business_constraint
    check: "sku is unique within the owning applicant_id"
    error_id: ERR_DUPLICATE_SKU
    http_status: 409
    applies_to: "POST /gfco/products"

  - priority: 33
    category: business_constraint
    check: "no ProductIngredient row already links this product_id to this ingredient_id"
    error_id: ERR_DUPLICATE_PRODUCT_INGREDIENT
    http_status: 409
    applies_to: "POST /gfco/product-ingredients"

  - priority: 34
    category: business_constraint
    check: "no Certificate of this product_id already has status IN {ISSUED, SUSPENDED}"
    error_id: ERR_DUPLICATE_ACTIVE_CERTIFICATE
    http_status: 409
    applies_to: "POST /gfco/certificates"

  - priority: 35
    category: business_temporal
    check: >-
      the requested [onsite_start_at, onsite_end_at) interval does not overlap the interval of any
      other Audit of the same Facility whose status IN {SCHEDULED, IN_PROGRESS}; the interval is
      half-open, so a new audit starting exactly at an existing audit's onsite_end_at is accepted
    error_id: ERR_AUDIT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /gfco/audits"

  - priority: 36
    category: business_temporal
    check: "sample_collected_on <= clock_now"
    error_id: ERR_SAMPLE_DATE_IN_FUTURE
    http_status: 422
    applies_to: "POST /gfco/lot-tests"

  - priority: 37
    category: business_temporal
    check: >-
      for test_type == SCHEDULED only: sample_collected_on must fall outside the closed exclusion
      interval [previous SCHEDULED sample_collected_on, previous SCHEDULED sample_collected_on +
      Product.sampling_exclusion_days - 1 day] of every existing RECORDED SCHEDULED LotTest of the
      same Product; UNANNOUNCED and FOR_CAUSE lots are exempt
    error_id: ERR_SAMPLING_EXCLUSION_WINDOW
    http_status: 409
    applies_to: "POST /gfco/lot-tests"

  - priority: 38
    category: business_temporal
    check: >-
      the SupplierDocument's expires_on > clock_now at verification time, and every document
      counted toward REQUIRED_DOC_TYPES at ingredient review has expires_on > clock_now
    error_id: ERR_SUPPLIER_DOCUMENT_EXPIRED
    http_status: 422
    applies_to: "POST /gfco/supplier-documents/{documentId}/verification, POST /gfco/ingredients/{ingredientId}/review with decision=APPROVE"

  - priority: 39
    category: business_temporal
    check: "clock_now <= Nonconformance.ca_due_on"
    error_id: ERR_CORRECTIVE_ACTION_OVERDUE
    http_status: 422
    applies_to: "POST /gfco/nonconformances/{nonconformanceId}/corrective-action-plan"

  - priority: 40
    category: business_temporal
    check: >-
      effective_on - clock_now >= CHANGE_NOTICE_DAYS (30 days) for change_type IN
      {INGREDIENT_SUBSTITUTION, SUPPLIER_CHANGE}; a notice exactly 30 days ahead is accepted,
      29 days is not. FORMULA_PCT_CHANGE and FACILITY_LINE_CHANGE are exempt and only set the
      late_notification flag.
    error_id: ERR_LATE_CHANGE_NOTIFICATION
    http_status: 422
    applies_to: "POST /gfco/change-notifications"

  - priority: 41
    category: business_fiscal
    check: "the owning Applicant.compliance_posture NOT IN {PROBATION, SUSPENDED}"
    error_id: ERR_APPLICANT_POSTURE_BLOCKED
    http_status: 422
    applies_to: "POST /gfco/certificates, POST /gfco/certificates/{certificateId}/reinstatement, POST /gfco/change-notifications"

  - priority: 42
    category: business_referential
    check: "the referenced Facility.applicant_id equals the applicant_id supplied on the product"
    error_id: ERR_FACILITY_APPLICANT_MISMATCH
    http_status: 422
    applies_to: "POST /gfco/products"

  - priority: 43
    category: business_referential
    check: "the referenced Ingredient.supplier_id equals the supplier_id supplied on the document"
    error_id: ERR_DOCUMENT_SUPPLIER_MISMATCH
    http_status: 422
    applies_to: "POST /gfco/supplier-documents"

  - priority: 44
    category: business_referential
    check: >-
      parent_ingredient_id, when supplied, belongs to the same applicant_id and does not close a
      cycle in the parent_ingredient_id chain
    error_id: ERR_INGREDIENT_GRAPH_CYCLE
    http_status: 422
    applies_to: "POST /gfco/ingredients"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- single-resource reads (one per entity) -------------------------------
  - method: GET
    path: "/gfco/applicants/{applicantId}"
    description: "Read one applicant with its computed posture, penalty, count and fee-balance fields."
    roles: [ApplicantContact, CertificationReviewer, FieldAuditor, CertificationDecisionMaker, ProgramAdministrator]
    code: 200
    input: []
    output: Applicant
    side_effects: []

  - method: GET
    path: "/gfco/facilities/{facilityId}"
    description: "Read one facility with its sanitation-validation and last-closed-audit fields."
    roles: [ApplicantContact, CertificationReviewer, FieldAuditor, CertificationDecisionMaker, ProgramAdministrator]
    code: 200
    input: []
    output: Facility
    side_effects: []

  - method: GET
    path: "/gfco/suppliers/{supplierId}"
    description: "Read one supplier with its program standing and verified-document count."
    roles: [ApplicantContact, CertificationReviewer, FieldAuditor, ProgramAdministrator]
    code: 200
    input: []
    output: Supplier
    side_effects: []

  - method: GET
    path: "/gfco/supplier-documents/{documentId}"
    description: "Read one supplier document with its verification state."
    roles: [ApplicantContact, CertificationReviewer, FieldAuditor, ProgramAdministrator]
    code: 200
    input: []
    output: SupplierDocument
    side_effects: []

  - method: GET
    path: "/gfco/ingredients/{ingredientId}"
    description: "Read one ingredient with its review state, verified_doc_types and block reason."
    roles: [ApplicantContact, CertificationReviewer, FieldAuditor, CertificationDecisionMaker, ProgramAdministrator]
    code: 200
    input: []
    output: Ingredient
    side_effects: []

  - method: GET
    path: "/gfco/products/{productId}"
    description: "Read one product with both status dimensions, the threshold standard and the sampling plan."
    roles: [ApplicantContact, CertificationReviewer, FieldAuditor, CertificationDecisionMaker, LabTechnician, ProgramAdministrator]
    code: 200
    input: []
    output: Product
    side_effects: []

  - method: GET
    path: "/gfco/product-ingredients/{linkId}"
    description: "Read one product-to-ingredient line with its inclusion percentage."
    roles: [ApplicantContact, CertificationReviewer, FieldAuditor, ProgramAdministrator]
    code: 200
    input: []
    output: ProductIngredient
    side_effects: []

  - method: GET
    path: "/gfco/lot-tests/{lotTestId}"
    description: "Read one lot test with its applied threshold, verdict and recall-scope flag."
    roles: [ApplicantContact, CertificationReviewer, FieldAuditor, CertificationDecisionMaker, LabTechnician, ProgramAdministrator]
    code: 200
    input: []
    output: LotTest
    side_effects: []

  - method: GET
    path: "/gfco/audits/{auditId}"
    description: "Read one audit with both score variants, the finding counts and the closing actor."
    roles: [ApplicantContact, CertificationReviewer, FieldAuditor, CertificationDecisionMaker, ProgramAdministrator]
    code: 200
    input: []
    output: Audit
    side_effects: []

  - method: GET
    path: "/gfco/certificates/{certificateId}"
    description: "Read one certificate with both status dimensions, the fee breakdown and the mark-usage lock."
    roles: [ApplicantContact, CertificationReviewer, FieldAuditor, CertificationDecisionMaker, ProgramAdministrator]
    code: 200
    input: []
    output: Certificate
    side_effects: []

  - method: GET
    path: "/gfco/nonconformances/{nonconformanceId}"
    description: "Read one nonconformance with its corrective-action fields and revision counter."
    roles: [ApplicantContact, CertificationReviewer, FieldAuditor, CertificationDecisionMaker, ProgramAdministrator]
    code: 200
    input: []
    output: Nonconformance
    side_effects: []

  - method: GET
    path: "/gfco/change-notifications/{notificationId}"
    description: "Read one change notification with its assessment outcome and lateness flag."
    roles: [ApplicantContact, CertificationReviewer, CertificationDecisionMaker, ProgramAdministrator]
    code: 200
    input: []
    output: ChangeNotification
    side_effects: []

  - method: GET
    path: "/gfco/consumer-complaints/{complaintId}"
    description: "Read one consumer complaint with its triage priority, recall scope and recall action."
    roles: [CertificationReviewer, FieldAuditor, CertificationDecisionMaker, ProgramAdministrator]
    code: 200
    input: []
    output: ConsumerComplaint
    side_effects: []

  # --- filtered collection reads (FK reverse-reachability) ------------------
  - method: GET
    path: "/gfco/facilities"
    description: "List facilities, optionally filtered by the operating applicant."
    roles: [ApplicantContact, CertificationReviewer, FieldAuditor, CertificationDecisionMaker, ProgramAdministrator]
    code: 200
    input: ["applicant_id?", "sanitation_validation_status?", "limit?", "offset?"]
    output: Facility[]
    side_effects: []

  - method: GET
    path: "/gfco/supplier-documents"
    description: "List supplier documents, optionally filtered by supplier, by evidenced ingredient or by verification state."
    roles: [ApplicantContact, CertificationReviewer, FieldAuditor, ProgramAdministrator]
    code: 200
    input: ["supplier_id?", "ingredient_id?", "status?", "limit?", "offset?"]
    output: SupplierDocument[]
    side_effects: []

  - method: GET
    path: "/gfco/ingredients"
    description: "List ingredients, optionally filtered by declaring applicant, by supplier, by compound parent ingredient or by review state."
    roles: [ApplicantContact, CertificationReviewer, FieldAuditor, CertificationDecisionMaker, ProgramAdministrator]
    code: 200
    input: ["applicant_id?", "supplier_id?", "parent_ingredient_id?", "status?", "limit?", "offset?"]
    output: Ingredient[]
    side_effects: []

  - method: GET
    path: "/gfco/products"
    description: "List products, optionally filtered by owning applicant or manufacturing facility."
    roles: [ApplicantContact, CertificationReviewer, FieldAuditor, CertificationDecisionMaker, LabTechnician, ProgramAdministrator]
    code: 200
    input: ["applicant_id?", "facility_id?", "formula_status?", "limit?", "offset?"]
    output: Product[]
    side_effects: []

  - method: GET
    path: "/gfco/product-ingredients"
    description: "List product-to-ingredient lines, optionally filtered by product or by ingredient."
    roles: [ApplicantContact, CertificationReviewer, FieldAuditor, ProgramAdministrator]
    code: 200
    input: ["product_id?", "ingredient_id?", "limit?", "offset?"]
    output: ProductIngredient[]
    side_effects: []

  - method: GET
    path: "/gfco/lot-tests"
    description: "List lot tests, optionally filtered by product or by test type."
    roles: [ApplicantContact, CertificationReviewer, FieldAuditor, CertificationDecisionMaker, LabTechnician, ProgramAdministrator]
    code: 200
    input: ["product_id?", "test_type?", "verdict?", "limit?", "offset?"]
    output: LotTest[]
    side_effects: []

  - method: GET
    path: "/gfco/audits"
    description: "List audits, optionally filtered by facility or by audit state."
    roles: [ApplicantContact, CertificationReviewer, FieldAuditor, CertificationDecisionMaker, ProgramAdministrator]
    code: 200
    input: ["facility_id?", "status?", "audit_type?", "limit?", "offset?"]
    output: Audit[]
    side_effects: []

  - method: GET
    path: "/gfco/certificates"
    description: "List certificates, optionally filtered by certified product, by owning applicant or by state."
    roles: [ApplicantContact, CertificationReviewer, FieldAuditor, CertificationDecisionMaker, ProgramAdministrator]
    code: 200
    input: ["product_id?", "applicant_id?", "status?", "surveillance_status?", "limit?", "offset?"]
    output: Certificate[]
    side_effects: []

  - method: GET
    path: "/gfco/nonconformances"
    description: "List nonconformances, optionally filtered by accountable applicant, affected certificate, or any of the three polymorphic sources."
    roles: [ApplicantContact, CertificationReviewer, FieldAuditor, CertificationDecisionMaker, ProgramAdministrator]
    code: 200
    input: ["applicant_id?", "certificate_id?", "audit_id?", "lot_test_id?", "complaint_id?", "status?", "severity?", "limit?", "offset?"]
    output: Nonconformance[]
    side_effects: []

  - method: GET
    path: "/gfco/change-notifications"
    description: "List change notifications, optionally filtered by affected certificate or by the substituting replacement ingredient."
    roles: [ApplicantContact, CertificationReviewer, CertificationDecisionMaker, ProgramAdministrator]
    code: 200
    input: ["certificate_id?", "replacement_ingredient_id?", "status?", "limit?", "offset?"]
    output: ChangeNotification[]
    side_effects: []

  - method: GET
    path: "/gfco/consumer-complaints"
    description: "List consumer complaints, optionally filtered by named certificate or by investigation state."
    roles: [CertificationReviewer, FieldAuditor, CertificationDecisionMaker, ProgramAdministrator]
    code: 200
    input: ["certificate_id?", "status?", "triage_priority?", "limit?", "offset?"]
    output: ConsumerComplaint[]
    side_effects: []

  # --- applicant, supplier and facility writes ------------------------------
  - method: POST
    path: "/gfco/applicants"
    description: "Register a certification applicant. The returned id is the X-User-ID an ApplicantContact acts under."
    roles: [ProgramAdministrator]
    code: 201
    input: [legal_name, contact_email, country_code]
    output: Applicant
    side_effects:
      - "creates the Applicant with compliance_posture = GOOD_STANDING, open_nc_penalty_points = 0, active_certified_product_count = 0, suspended_certificate_count = 0, revoked_certificate_count = 0, fee_balance_cents = 0, posture_score_rolling_12m = 100 and posture_score_cycle = 100"
      - "current_cycle_started_on is null until the first certificate is issued"

  - method: POST
    path: "/gfco/suppliers"
    description: "Register an ingredient supplier in the program."
    roles: [ProgramAdministrator, CertificationReviewer]
    code: 201
    input: [name, country_code, "gluten_handling_disclosed?"]
    output: Supplier
    side_effects:
      - "creates the Supplier with status = ACTIVE, verified_document_count = 0 and gluten_handling_disclosed defaulting to false"

  - method: POST
    path: "/gfco/suppliers/{supplierId}/status"
    description: "Change a supplier's program standing; SUSPENDED starts the five-hop block cascade down to certificates and applicant posture."
    roles: [ProgramAdministrator]
    code: 200
    input: [status]
    output: Supplier
    side_effects:
      - "sets Supplier.status to the requested value"
      - "on SUSPENDED: runs the CASCADE HOP 1-5 chain declared on the Supplier state machine (ingredients BLOCKED, compound sub-component parents BLOCKED, products BLOCKED, ISSUED certificates SUSPENDED with suspension_reason = INGREDIENT_BLOCKED, product label_status FROZEN, applicant posture recomputed)"
      - "on ACTIVE from SUSPENDED: no automatic unblock - each ingredient must be resubmitted and re-reviewed"

  - method: POST
    path: "/gfco/facilities"
    description: "Declare a manufacturing site for an applicant."
    roles: [ApplicantContact]
    code: 201
    input: [applicant_id, site_name, air_handling_class, "shared_equipment_present?", "gluten_containing_operations?"]
    output: Facility
    side_effects:
      - "creates the Facility with sanitation_validation_status = UNVALIDATED, last_closed_audit_outcome = NONE, shared_equipment_present defaulting to false and gluten_containing_operations defaulting to NONE"

  - method: POST
    path: "/gfco/facilities/{facilityId}/sanitation-validation"
    description: "Record an accepted post-sanitation swab result, validating the facility for one year."
    roles: [CertificationReviewer, FieldAuditor]
    code: 200
    input: [swab_ppm, method, validated_on]
    output: Facility
    side_effects:
      - "sets sanitation_swab_ppm, sanitation_method, sanitation_validated_on = validated_on and sanitation_validation_status = VALIDATED"
      - "sets sanitation_expires_on = validated_on + SANITATION_VALIDITY_DAYS (365 days)"
      - "a later validation on the same facility replaces the previous record and re-bases sanitation_expires_on"

  # --- ingredient and supplier-document writes ------------------------------
  - method: POST
    path: "/gfco/ingredients"
    description: "Declare an ingredient, optionally as a sub-component of a compound ingredient (self-referential FK)."
    roles: [ApplicantContact]
    code: 201
    input: [applicant_id, supplier_id, name, risk_class, "parent_ingredient_id?"]
    output: Ingredient
    side_effects:
      - "creates the Ingredient with status = DRAFT, review_cycle_count = 0 and verified_doc_types = []"
      - "when parent_ingredient_id is supplied it must belong to the same applicant_id and must not create a cycle in the ingredient graph"

  - method: POST
    path: "/gfco/ingredients/{ingredientId}/submission"
    description: "Submit a drafted, rejected or previously blocked ingredient for review."
    roles: [ApplicantContact]
    code: 200
    input: []
    output: Ingredient
    side_effects:
      - "transitions Ingredient.status to UNDER_REVIEW and increments review_cycle_count by 1"
      - "clears blocked_reason and rejection_reason"

  - method: POST
    path: "/gfco/ingredients/{ingredientId}/review"
    description: "Approve or reject an ingredient under review after checking its supplier documentation package."
    roles: [CertificationReviewer]
    code: 200
    input: [decision, "rejection_reason?"]
    output: Ingredient
    side_effects:
      - "on APPROVE: status = APPROVED, approved_on = clock_now, reviewed_by_user_id = X-User-ID"
      - "on APPROVE: every Product linked to this ingredient recomputes blocked_ingredient_count, and a Product whose formula_status == BLOCKED returns to CLEARED once blocked_ingredient_count is 0 and every linked ingredient is APPROVED"
      - "on REJECT: status = REJECTED with the supplied rejection_reason, and every Product linked to this ingredient with formula_status == CLEARED transitions to BLOCKED, cascading to ISSUED certificates (SUSPENDED, INGREDIENT_BLOCKED), product label_status FROZEN and applicant posture"

  - method: POST
    path: "/gfco/supplier-documents"
    description: "Upload a supplier document evidencing the gluten status of one ingredient."
    roles: [ApplicantContact]
    code: 201
    input: [supplier_id, ingredient_id, doc_type, issued_on, expires_on, "lab_ppm_claim?"]
    output: SupplierDocument
    side_effects:
      - "creates the SupplierDocument with status = PENDING"
      - "the referenced Ingredient.supplier_id must equal the supplied supplier_id"

  - method: POST
    path: "/gfco/supplier-documents/{documentId}/verification"
    description: "Verify or reject a pending supplier document; verification is what populates the ingredient's verified_doc_types."
    roles: [CertificationReviewer]
    code: 200
    input: [decision, "rejection_reason?"]
    output: SupplierDocument
    side_effects:
      - "on APPROVE: status = VERIFIED, verified_by_user_id = X-User-ID, verified_on = clock_now; the Supplier's verified_document_count and the Ingredient's verified_doc_types are recomputed"
      - "on REJECT: status = REJECTED with the supplied rejection_reason; an APPROVED Ingredient whose required document set is no longer complete transitions APPROVED -> BLOCKED with blocked_reason = DOCUMENT_REJECTED and the block cascades to products and certificates"

  # --- product, testing-plan and lot-test writes ----------------------------
  - method: POST
    path: "/gfco/products"
    description: "Declare a product for certification at one facility."
    roles: [ApplicantContact]
    code: 201
    input: [applicant_id, facility_id, name, sku, "requested_mark_tier?"]
    output: Product
    side_effects:
      - "creates the Product with formula_status = DRAFT, label_status = NOT_SUBMITTED, testing_plan_status = NONE, testing_plan_revision = 0, mark_tier_granted = NONE, linked_ingredient_count = 0, blocked_ingredient_count = 0, threshold_ppm = null and sampling_lots_per_year = null"
      - "requested_mark_tier defaults to STANDARD; the referenced Facility.applicant_id must equal the supplied applicant_id"

  - method: POST
    path: "/gfco/product-ingredients"
    description: "Link an ingredient into a product's formula at a given inclusion percentage (many-to-many junction)."
    roles: [ApplicantContact]
    code: 201
    input: [product_id, ingredient_id, inclusion_pct]
    output: ProductIngredient
    side_effects:
      - "creates the immutable ProductIngredient line with is_risk_carrier = (Ingredient.risk_class != INHERENTLY_GF); the row carries no version field and no update endpoint exists"
      - "recomputes Product.linked_ingredient_count and Product.blocked_ingredient_count"

  - method: POST
    path: "/gfco/products/{productId}/formula-review"
    description: "Clear or reject a product's formula after reviewing every linked ingredient."
    roles: [CertificationReviewer]
    code: 200
    input: [decision, "rejection_reason?"]
    output: Product
    side_effects:
      - "on CLEAR: formula_status = CLEARED and formula_cleared_by_user_id = X-User-ID (which is the user the segregation-of-duties check at issuance compares against)"
      - "on REJECT: formula_status = REJECTED; label_status is untouched"
      - "increments Product.version by 1"

  - method: POST
    path: "/gfco/products/{productId}/testing-plan"
    description: "Activate the threshold standard and lot sampling plan for a cleared product. OCC-guarded on the product version the caller last observed."
    roles: [CertificationReviewer]
    code: 200
    input: [expected_product_version]
    output: Product
    side_effects:
      - "computes threshold_ppm from calculations.threshold_standard_selection"
      - "computes sampling_lots_per_year and sampling_exclusion_days from calculations.lot_sampling_frequency using the freshly computed threshold_ppm"
      - "sets testing_plan_status = ACTIVE and increments testing_plan_revision by 1"
      - "increments Product.version by 1"

  - method: POST
    path: "/gfco/products/{productId}/label-review"
    description: "Approve or reject a product's label and mark usage, granting the requested mark tier on approval."
    roles: [CertificationReviewer]
    code: 200
    input: [decision, "mark_tier_granted?", "rejection_reason?"]
    output: Product
    side_effects:
      - "on APPROVE: label_status = APPROVED, mark_tier_granted = the supplied tier, label_reviewed_by_user_id = X-User-ID, label_rejection_reason = null"
      - "on REJECT: label_status = REJECTED, mark_tier_granted = NONE, label_rejection_reason recorded; formula_status is untouched"
      - "increments Product.version by 1"

  - method: POST
    path: "/gfco/lot-tests"
    description: "Record a laboratory result for one production lot; the verdict is computed against the product's active threshold."
    roles: [LabTechnician]
    code: 201
    input: [product_id, lot_code, test_type, sample_collected_on, ppm_result, lab_method]
    output: LotTest
    side_effects:
      - "snapshots threshold_applied_ppm = Product.threshold_ppm and computes verdict per calculations.lot_test_verdict"
      - "on FAIL: creates a Nonconformance with source_type = LOT_TEST, category = THRESHOLD_EXCEEDANCE and the severity the calculation selects, sets nonconformance_created = true, and recomputes the applicant's penalty and posture fields"
      - "on FAIL with test_type == UNANNOUNCED: an ISSUED Certificate of the product transitions to SUSPENDED with suspension_reason = FAILED_UNANNOUNCED_TEST, cascading to label_status FROZEN"
      - "on test_type == FOR_CAUSE matching an existing RECORDED LotTest of the same product_id and lot_code: that earlier LotTest transitions RECORDED -> SUPERSEDED_BY_RETEST and its in_recall_scope is recomputed to false"
      - "updates Product.last_scheduled_sample_on when test_type == SCHEDULED"

  # --- audit writes ----------------------------------------------------------
  - method: POST
    path: "/gfco/audits"
    description: "Schedule an on-site audit over a half-open interval on one facility."
    roles: [FieldAuditor]
    code: 201
    input: [facility_id, audit_type, onsite_start_at, onsite_end_at]
    output: Audit
    side_effects:
      - "creates the Audit with status = SCHEDULED, finding_count = 0, critical_finding_count = 0, provisional_score = null and final_score = null"
      - "reserves the half-open interval [onsite_start_at, onsite_end_at) on the facility against other SCHEDULED or IN_PROGRESS audits"

  - method: POST
    path: "/gfco/audits/{auditId}/start"
    description: "Begin a scheduled audit once the logical clock reaches its on-site start."
    roles: [FieldAuditor]
    code: 200
    input: []
    output: Audit
    side_effects:
      - "transitions status SCHEDULED -> IN_PROGRESS and sets lead_auditor_user_id = X-User-ID"

  - method: POST
    path: "/gfco/audits/{auditId}/close"
    description: "Close an in-progress audit with the shared-equipment, air-handling and sanitation attestations; the outcome branch is chosen from the provisional score and the critical finding count."
    roles: [FieldAuditor]
    code: 200
    input: [shared_equipment_verified, air_handling_verified, sanitation_validation_reviewed]
    output: Audit
    side_effects:
      - "computes the PROVISIONAL_ONSITE variant of calculations.audit_compliance_score into provisional_score and copies it into final_score"
      - "selects CLOSED_PASS, CLOSED_CONDITIONAL or CLOSED_FAIL per the Audit state machine and applies that branch's side-effect set"
      - "sets closed_by_user_id = X-User-ID and closed_on = clock_now, and updates Facility.last_closed_audit_outcome and last_closed_audit_closed_on"
      - "on a SURVEILLANCE audit closing PASS or CONDITIONAL: rebases surveillance_due_on to clock_now + 365 days and re-derives surveillance_status for every certificate of the facility's products"

  # --- nonconformance and corrective action writes --------------------------
  - method: POST
    path: "/gfco/nonconformances"
    description: "Raise a nonconformance against an applicant from one of five polymorphic sources."
    roles: [FieldAuditor, CertificationReviewer]
    code: 201
    input: [applicant_id, source_type, category, severity, description, "certificate_id?", "audit_id?", "lot_test_id?", "complaint_id?"]
    output: Nonconformance
    side_effects:
      - "creates the Nonconformance with status = OPEN, raised_by_user_id = X-User-ID, penalty_points = SEVERITY_POINTS[severity], ca_revision_count = 0, ca_verified = false and ca_due_on = created_at + CA_DUE_DAYS[severity]"
      - "recomputes Applicant.open_nc_penalty_points, posture_score_rolling_12m, posture_score_cycle and compliance_posture"
      - "when audit_id is present: increments Audit.finding_count, increments Audit.critical_finding_count for CRITICAL, and recomputes Audit.final_score with the FINAL_ADJUDICATED variant"
      - "when severity == CRITICAL and the affected certificate is ISSUED: suspends it with suspension_reason = CRITICAL_NONCONFORMANCE and freezes the product label"

  - method: POST
    path: "/gfco/nonconformances/{nonconformanceId}/corrective-action-plan"
    description: "Submit or resubmit a corrective action plan. OCC-guarded on the nonconformance version the caller last observed."
    roles: [ApplicantContact]
    code: 200
    input: [expected_nonconformance_version, ca_plan_text]
    output: Nonconformance
    side_effects:
      - "records ca_plan_text and transitions status OPEN|CA_REJECTED -> CA_SUBMITTED"
      - "increments Nonconformance.version by 1"
      - "recomputes Audit.final_score when audit_id is present"

  - method: POST
    path: "/gfco/nonconformances/{nonconformanceId}/corrective-action-decision"
    description: "Accept or reject a submitted corrective action plan; the second rejection escalates instead of cycling."
    roles: [CertificationReviewer]
    code: 200
    input: [decision, "ca_rejection_reason?"]
    output: Nonconformance
    side_effects:
      - "on ACCEPT: status = CA_ACCEPTED and ca_decided_by_user_id = X-User-ID"
      - "on REJECT: increments ca_revision_count by 1 first, then transitions to CA_REJECTED while the incremented count is below MAX_CA_REVISIONS (2) or to ESCALATED once it reaches it"
      - "on ESCALATED: recomputes the applicant posture, applies the ESCALATION_PENALTY to Audit.final_score when audit_id is present, and suspends an ISSUED affected certificate with suspension_reason = CRITICAL_NONCONFORMANCE"
      - "increments Nonconformance.version by 1"

  - method: POST
    path: "/gfco/nonconformances/{nonconformanceId}/verification"
    description: "Verify on site whether an accepted corrective action was effective; failure returns the record to the corrective-action cycle."
    roles: [FieldAuditor]
    code: 200
    input: [effectiveness_confirmed]
    output: Nonconformance
    side_effects:
      - "on true: ca_verified = true, status = CLOSED, closed_on = clock_now; recomputes Applicant.open_nc_penalty_points and posture; recomputes Audit.final_score so this finding's deduction is halved; closes a linked SUBSTANTIATED or RECALL_COORDINATION ConsumerComplaint"
      - "on false: ca_verified = false and status returns to CA_REJECTED without incrementing ca_revision_count"
      - "increments Nonconformance.version by 1"

  # --- certificate writes ----------------------------------------------------
  - method: POST
    path: "/gfco/certificates"
    description: "Issue a certificate for a fully cleared product. OCC-guarded on the product version the decision maker last observed, and subject to segregation of duties against the formula clearer and the closing auditor."
    roles: [CertificationDecisionMaker]
    code: 201
    input: [product_id, expected_product_version]
    output: Certificate
    side_effects:
      - "creates the Certificate with status = ISSUED, surveillance_status = CURRENT, suspension_count = 0, mark_usage_locked = false, fee_charged = true, fee_refunded = false, issued_on = clock_now and issued_by_user_id = X-User-ID"
      - "snapshots applicant_id from Product.applicant_id, mark_tier_granted from Product.mark_tier_granted and certified_threshold_ppm from Product.threshold_ppm"
      - "computes base_fee_cents, surveillance_surcharge_cents and total_fee_cents per calculations.certification_fee_schedule and adds total_fee_cents to Applicant.fee_balance_cents"
      - "computes surveillance_due_on = issued_on + 365 days and expires_on = issued_on + 1095 days"
      - "increments Applicant.active_certified_product_count, sets Applicant.current_cycle_started_on when it was null, and recomputes the posture fields"
      - "increments Product.version by 1"

  - method: POST
    path: "/gfco/certificates/{certificateId}/suspension"
    description: "Suspend an issued certificate, locking mark usage and freezing the product label."
    roles: [CertificationDecisionMaker]
    code: 200
    input: [suspension_reason]
    output: Certificate
    side_effects:
      - "transitions status ISSUED -> SUSPENDED, sets suspended_on = clock_now and suspension_reason, increments suspension_count by 1 and sets mark_usage_locked = true"
      - "transitions Product.label_status APPROVED -> FROZEN"
      - "decrements Applicant.active_certified_product_count, increments Applicant.suspended_certificate_count and recomputes the posture fields; Applicant.fee_balance_cents is untouched"

  - method: POST
    path: "/gfco/certificates/{certificateId}/reinstatement"
    description: "Reinstate a suspended certificate once every blocking condition is cleared; every counter returns to its exact pre-suspension value."
    roles: [CertificationDecisionMaker]
    code: 200
    input: []
    output: Certificate
    side_effects:
      - "transitions status SUSPENDED -> ISSUED, clears suspended_on and suspension_reason and sets mark_usage_locked = false; suspension_count is NOT decremented"
      - "transitions Product.label_status FROZEN -> APPROVED"
      - "increments Applicant.active_certified_product_count, decrements Applicant.suspended_certificate_count and recomputes the posture fields"

  - method: POST
    path: "/gfco/certificates/{certificateId}/revocation"
    description: "Revoke a certificate permanently, refunding the fee only inside the voluntary-withdrawal window."
    roles: [CertificationDecisionMaker]
    code: 200
    input: [revocation_reason]
    output: Certificate
    side_effects:
      - "transitions status ISSUED|SUSPENDED -> REVOKED, sets revoked_on = clock_now, revocation_reason and mark_usage_locked = true"
      - "transitions Product.label_status APPROVED -> FROZEN"
      - "evaluates calculations.certification_fee_refund; when it yields true sets fee_refunded = true and subtracts total_fee_cents from Applicant.fee_balance_cents"
      - "adjusts Applicant.active_certified_product_count or suspended_certificate_count depending on the pre-revocation status, increments revoked_certificate_count and recomputes the posture fields, applying the FRAUD / REPEAT_FAILURE posture override"

  # --- consumer complaint writes --------------------------------------------
  - method: POST
    path: "/gfco/consumer-complaints"
    description: "File a consumer complaint against a certificate."
    roles: [ProgramAdministrator]
    code: 201
    input: [certificate_id, exposure_date, symptom_severity, "lot_code?"]
    output: ConsumerComplaint
    side_effects:
      - "creates the ConsumerComplaint with status = RECEIVED, reported_on = clock_now, triage_priority = null, recall_action = NONE and recall_scope_lot_codes = []"

  - method: POST
    path: "/gfco/consumer-complaints/{complaintId}/triage"
    description: "Triage a received complaint, computing its priority and its recall lot scope from the look-back selector policy."
    roles: [CertificationReviewer]
    code: 200
    input: []
    output: ConsumerComplaint
    side_effects:
      - "transitions status RECEIVED -> INVESTIGATING and sets triage_priority from symptom_severity"
      - "computes recall_scope_lot_codes and recall_action per calculations.recall_scope_determination and sets in_recall_scope = true on each selected LotTest"

  - method: POST
    path: "/gfco/consumer-complaints/{complaintId}/investigation-outcome"
    description: "Record the investigation outcome; substantiation raises a nonconformance and may fork into recall coordination."
    roles: [CertificationReviewer]
    code: 200
    input: [outcome, outcome_evidence]
    output: ConsumerComplaint
    side_effects:
      - "on UNSUBSTANTIATED: status = UNSUBSTANTIATED, investigated_by_user_id = X-User-ID and nothing else changes"
      - "on SUBSTANTIATED with recall_action == ADVISORY_ONLY: status = SUBSTANTIATED; with recall_action IN {VOLUNTARY_RECALL, MANDATORY_RECALL_SUPPORT}: status = RECALL_COORDINATION"
      - "on either substantiated branch: creates a Nonconformance with source_type = COMPLAINT, category = THRESHOLD_EXCEEDANCE and severity = CRITICAL for SEVERE or ANAPHYLAXIS else MAJOR; a CRITICAL finding suspends an ISSUED certificate with suspension_reason = SUBSTANTIATED_COMPLAINT and freezes the product label"
      - "recomputes Applicant.substantiated_complaint_count_rolling, substantiated_complaint_count_cycle and the posture fields"

  # --- change notification writes -------------------------------------------
  - method: POST
    path: "/gfco/change-notifications"
    description: "Notify the program of an ingredient, supplier, formula or facility-line change to a certified scope."
    roles: [ApplicantContact]
    code: 201
    input: [certificate_id, change_type, effective_on, description, "replacement_ingredient_id?"]
    output: ChangeNotification
    side_effects:
      - "creates the ChangeNotification with status = SUBMITTED, required_retest = false and impact_level = null"
      - "computes notified_days_before_effective = floor((effective_on - clock_now) / 1 day) and late_notification = (notified_days_before_effective < 30)"

  - method: POST
    path: "/gfco/change-notifications/{notificationId}/assessment"
    description: "Assess a submitted change notification; the impact level selects one of three divergent outcomes."
    roles: [CertificationReviewer]
    code: 200
    input: [decision, impact_level]
    output: ChangeNotification
    side_effects:
      - "sets assessed_on = clock_now, assessed_by_user_id = X-User-ID and impact_level"
      - "impact_level NONE with decision ACCEPT: status = ACCEPTED_NO_IMPACT, required_retest = false"
      - "impact_level LOW with decision ACCEPT: status = ACCEPTED_WITH_CONDITIONS, required_retest = true, and the certificate's product recomputes threshold_ppm, sampling_lots_per_year and sampling_exclusion_days"
      - "decision REJECT or impact_level HIGH: status = REJECTED_REQUIRES_RECERT, required_retest = true, an ISSUED certificate is suspended with suspension_reason = CHANGE_REQUIRES_RECERT, the product label freezes, and a MAJOR DOCUMENTATION Nonconformance with source_type = CHANGE_NOTIFICATION is created"

  # --- system sweep and test-driving endpoints -------------------------------
  - method: POST
    path: "/gfco/surveillance-runs"
    description: "Run the program surveillance sweep against the current logical clock: re-derives every certificate's surveillance dimension, expires terms, documents and facility validations, blocks ingredients, cancels abandoned audits, escalates overdue corrective actions and recomputes every applicant posture."
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output:
      run_at: string
      certificates_marked_due: integer
      certificates_marked_overdue: integer
      certificates_suspended: integer
      certificates_expired: integer
      documents_expired: integer
      ingredients_blocked: integer
      facility_validations_expired: integer
      audits_cancelled: integer
      nonconformances_escalated: integer
    side_effects:
      - "re-derives surveillance_status for every Certificate whose status IN {ISSUED, SUSPENDED} per calculations.surveillance_schedule and suspends newly OVERDUE ISSUED certificates with suspension_reason = SURVEILLANCE_OVERDUE"
      - "transitions every Certificate whose expires_on <= clock_now to EXPIRED"
      - "transitions every VERIFIED SupplierDocument whose expires_on <= clock_now to EXPIRED, and blocks every APPROVED Ingredient whose required document set is thereby incomplete with blocked_reason = DOCUMENT_EXPIRED, cascading to products and certificates"
      - "transitions every VALIDATED Facility whose sanitation_expires_on <= clock_now to EXPIRED"
      - "cancels every SCHEDULED Audit whose onsite_end_at <= clock_now"
      - "escalates every OPEN Nonconformance whose ca_due_on < clock_now"
      - "recomputes open_nc_penalty_points, active_certified_product_count, suspended_certificate_count, the two posture scores and compliance_posture for every Applicant"

  - method: POST
    path: "/gfco/_clock/set_current_utc"
    description: "Test-driving endpoint that sets the server's logical clock. The clock starts at exactly 2026-08-01T00:00:00Z on server startup and never falls back to wall-clock time; every deadline, expiry and window rule in this scaffold reads this clock."
    roles: [ProgramAdministrator]
    code: 200
    input: [to_iso8601]
    output:
      current_utc: string
    side_effects:
      - "sets the logical clock to the supplied instant; no entity is mutated and no sweep is triggered - POST /gfco/surveillance-runs must be called separately to materialise clock-driven transitions"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the six declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an ApplicantContact acts on a resource whose owning Applicant.id differs from X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting X-User-ID already performed the incompatible upstream step (formula clearance, audit closure, corrective-action decision) on the same object"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, undeclared enum value, out-of-range number, malformed datetime, or onsite_end_at <= onsite_start_at"

  - id: ERR_APPLICANT_NOT_FOUND
    http: 404
    condition: "no Applicant with the supplied id"
  - id: ERR_FACILITY_NOT_FOUND
    http: 404
    condition: "no Facility with the supplied id"
  - id: ERR_SUPPLIER_NOT_FOUND
    http: 404
    condition: "no Supplier with the supplied id"
  - id: ERR_SUPPLIER_DOCUMENT_NOT_FOUND
    http: 404
    condition: "no SupplierDocument with the supplied id"
  - id: ERR_INGREDIENT_NOT_FOUND
    http: 404
    condition: "no Ingredient with the supplied id, including an unresolvable parent_ingredient_id or replacement_ingredient_id"
  - id: ERR_PRODUCT_NOT_FOUND
    http: 404
    condition: "no Product with the supplied id"
  - id: ERR_PRODUCT_INGREDIENT_NOT_FOUND
    http: 404
    condition: "no ProductIngredient with the supplied id"
  - id: ERR_LOT_TEST_NOT_FOUND
    http: 404
    condition: "no LotTest with the supplied id"
  - id: ERR_AUDIT_NOT_FOUND
    http: 404
    condition: "no Audit with the supplied id"
  - id: ERR_CERTIFICATE_NOT_FOUND
    http: 404
    condition: "no Certificate with the supplied id"
  - id: ERR_NONCONFORMANCE_NOT_FOUND
    http: 404
    condition: "no Nonconformance with the supplied id"
  - id: ERR_COMPLAINT_NOT_FOUND
    http: 404
    condition: "no ConsumerComplaint with the supplied id"
  - id: ERR_CHANGE_NOTIFICATION_NOT_FOUND
    http: 404
    condition: "no ChangeNotification with the supplied id"

  - id: ERR_STALE_PRODUCT_VERSION
    http: 412
    condition: "expected_product_version does not equal the Product's current version"
  - id: ERR_STALE_NONCONFORMANCE_VERSION
    http: 412
    condition: "expected_nonconformance_version does not equal the Nonconformance's current version"

  - id: ERR_DOCUMENT_ALREADY_DECIDED
    http: 409
    condition: "verification attempted on a SupplierDocument whose status is not PENDING"
  - id: ERR_INVALID_INGREDIENT_STATE
    http: 409
    condition: "submission, review or linking attempted while the Ingredient is in an incompatible status"
  - id: ERR_INVALID_PRODUCT_STATE
    http: 409
    condition: "formula review, testing plan, label review or ingredient linking attempted while the targeted Product dimension is in an incompatible state"
  - id: ERR_INVALID_AUDIT_STATE
    http: 409
    condition: "start attempted on an Audit that is not SCHEDULED, or close attempted on one that is not IN_PROGRESS"
  - id: ERR_CERTIFICATE_TERMINAL
    http: 409
    condition: "suspension, revocation, change notification or complaint filing attempted against a REVOKED or EXPIRED certificate, or suspension attempted on one that is not ISSUED"
  - id: ERR_CERTIFICATE_NOT_SUSPENDED
    http: 409
    condition: "reinstatement attempted on a Certificate whose status is not SUSPENDED, including the terminal REVOKED and EXPIRED"
  - id: ERR_INVALID_NONCONFORMANCE_STATE
    http: 409
    condition: "corrective-action plan, decision or verification attempted while the Nonconformance is in an incompatible status"
  - id: ERR_INVALID_COMPLAINT_STATE
    http: 409
    condition: "triage attempted on a complaint that is not RECEIVED, or an investigation outcome recorded on one that is not INVESTIGATING"
  - id: ERR_INVALID_CHANGE_NOTIFICATION_STATE
    http: 409
    condition: "assessment attempted on a ChangeNotification whose status is not SUBMITTED"
  - id: ERR_SUPPLIER_STATUS_UNCHANGED
    http: 409
    condition: "the requested supplier status equals the supplier's current status"
  - id: ERR_DUPLICATE_SKU
    http: 409
    condition: "another Product of the same applicant_id already uses the supplied sku"
  - id: ERR_DUPLICATE_PRODUCT_INGREDIENT
    http: 409
    condition: "a ProductIngredient row already links this product_id to this ingredient_id"
  - id: ERR_DUPLICATE_ACTIVE_CERTIFICATE
    http: 409
    condition: "a Certificate of this product_id already has status ISSUED or SUSPENDED"
  - id: ERR_AUDIT_WINDOW_CONFLICT
    http: 409
    condition: "the requested half-open on-site interval overlaps a SCHEDULED or IN_PROGRESS audit of the same facility"
  - id: ERR_SAMPLING_EXCLUSION_WINDOW
    http: 409
    condition: "a SCHEDULED lot sample falls inside the closed exclusion interval of an earlier RECORDED SCHEDULED lot of the same product"

  - id: ERR_SANITATION_SWAB_ABOVE_LIMIT
    http: 422
    condition: "swab_ppm exceeds SANITATION_SWAB_LIMIT_PPM (5)"
  - id: ERR_FACILITY_SANITATION_NOT_VALIDATED
    http: 422
    condition: "the facility's sanitation_validation_status is UNVALIDATED or EXPIRED when an audit close, an issuance or a reinstatement requires VALIDATED"
  - id: ERR_FACILITY_AUDIT_NOT_PASSED
    http: 422
    condition: "the product's facility has last_closed_audit_outcome NONE or CLOSED_FAIL at issuance"
  - id: ERR_OPEN_CRITICAL_NONCONFORMANCE
    http: 422
    condition: "an unresolved CRITICAL nonconformance blocks issuance or reinstatement"
  - id: ERR_SUPPLIER_SUSPENDED
    http: 422
    condition: "the ingredient's supplier has status SUSPENDED"
  - id: ERR_REQUIRED_SUPPLIER_DOCS_MISSING
    http: 422
    condition: "the ingredient's verified_doc_types does not cover every doc_type its risk_class requires"
  - id: ERR_COA_PPM_CLAIM_TOO_HIGH
    http: 422
    condition: "a COA's lab_ppm_claim exceeds the maximum claim allowed for the ingredient's risk_class"
  - id: ERR_INGREDIENT_NOT_APPROVED
    http: 422
    condition: "a linked ingredient is not APPROVED when formula clearance or issuance requires it"
  - id: ERR_NO_INGREDIENTS_LINKED
    http: 422
    condition: "formula clearance or testing-plan activation attempted on a Product with linked_ingredient_count == 0"
  - id: ERR_TESTING_PLAN_NOT_ACTIVE
    http: 422
    condition: "a lot test or an issuance is attempted on a Product whose testing_plan_status is NONE"
  - id: ERR_LABEL_NOT_APPROVED
    http: 422
    condition: "issuance attempted while Product.label_status is not APPROVED"
  - id: ERR_MARK_TIER_NOT_GRANTED
    http: 422
    condition: "issuance attempted while Product.mark_tier_granted is NONE or differs from requested_mark_tier"
  - id: ERR_CERTIFICATE_TERMINAL_NO_CA
    http: 422
    condition: "a corrective-action plan is submitted for a nonconformance whose certificate is REVOKED or EXPIRED"
  - id: ERR_SAMPLE_DATE_IN_FUTURE
    http: 422
    condition: "sample_collected_on is after the logical clock"
  - id: ERR_SUPPLIER_DOCUMENT_EXPIRED
    http: 422
    condition: "the supplier document's expires_on is at or before the logical clock when verification or ingredient approval needs it in force"
  - id: ERR_CORRECTIVE_ACTION_OVERDUE
    http: 422
    condition: "a corrective-action plan is submitted after the nonconformance's ca_due_on"
  - id: ERR_LATE_CHANGE_NOTIFICATION
    http: 422
    condition: "an INGREDIENT_SUBSTITUTION or SUPPLIER_CHANGE notification gives less than CHANGE_NOTICE_DAYS (30) days of notice"
  - id: ERR_APPLICANT_POSTURE_BLOCKED
    http: 422
    condition: "the owning applicant's compliance_posture is PROBATION or SUSPENDED"
  - id: ERR_FACILITY_APPLICANT_MISMATCH
    http: 422
    condition: "the referenced facility belongs to a different applicant than the one supplied on the product"
  - id: ERR_DOCUMENT_SUPPLIER_MISMATCH
    http: 422
    condition: "the referenced ingredient is supplied by a different supplier than the one supplied on the document"
  - id: ERR_INGREDIENT_GRAPH_CYCLE
    http: 422
    condition: "parent_ingredient_id belongs to another applicant or would close a cycle in the ingredient parent chain"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ApplicantContact
    description: "The certified company's own representative: declares facilities, ingredients, documents, products and formula lines, and answers nonconformances with corrective action plans."
    identity: "entity_backed:Applicant"
    exclusive_operations:
      - "POST /gfco/facilities"
      - "POST /gfco/ingredients"
      - "POST /gfco/ingredients/{ingredientId}/submission"
      - "POST /gfco/supplier-documents"
      - "POST /gfco/products"
      - "POST /gfco/product-ingredients"
      - "POST /gfco/nonconformances/{nonconformanceId}/corrective-action-plan"
      - "POST /gfco/change-notifications"
    shared_operations:
      - "every GET under /gfco except /gfco/consumer-complaints and /gfco/consumer-complaints/{complaintId}"

  - name: CertificationReviewer
    description: "Program reviewer who verifies supplier documentation, reviews ingredients, formulas and labels, activates testing plans, decides corrective action plans, assesses change notifications and investigates complaints."
    identity: opaque
    exclusive_operations:
      - "POST /gfco/supplier-documents/{documentId}/verification"
      - "POST /gfco/ingredients/{ingredientId}/review"
      - "POST /gfco/products/{productId}/formula-review"
      - "POST /gfco/products/{productId}/testing-plan"
      - "POST /gfco/products/{productId}/label-review"
      - "POST /gfco/nonconformances/{nonconformanceId}/corrective-action-decision"
      - "POST /gfco/change-notifications/{notificationId}/assessment"
      - "POST /gfco/consumer-complaints/{complaintId}/triage"
      - "POST /gfco/consumer-complaints/{complaintId}/investigation-outcome"
    shared_operations:
      - "POST /gfco/suppliers"
      - "POST /gfco/facilities/{facilityId}/sanitation-validation"
      - "POST /gfco/nonconformances"
      - "every GET under /gfco"

  - name: FieldAuditor
    description: "On-site auditor who schedules, starts and closes facility audits, raises nonconformances and verifies corrective-action effectiveness."
    identity: opaque
    exclusive_operations:
      - "POST /gfco/audits"
      - "POST /gfco/audits/{auditId}/start"
      - "POST /gfco/audits/{auditId}/close"
      - "POST /gfco/nonconformances/{nonconformanceId}/verification"
    shared_operations:
      - "POST /gfco/facilities/{facilityId}/sanitation-validation"
      - "POST /gfco/nonconformances"
      - "every GET under /gfco"

  - name: CertificationDecisionMaker
    description: "Certification decision authority: the only role that issues, suspends, reinstates and revokes certificates, and the role the segregation-of-duties rule constrains hardest."
    identity: opaque
    exclusive_operations:
      - "POST /gfco/certificates"
      - "POST /gfco/certificates/{certificateId}/suspension"
      - "POST /gfco/certificates/{certificateId}/reinstatement"
      - "POST /gfco/certificates/{certificateId}/revocation"
    shared_operations:
      - "every GET under /gfco"

  - name: LabTechnician
    description: "Accredited laboratory user who records lot test results; sees products and lot tests but touches nothing else."
    identity: opaque
    exclusive_operations:
      - "POST /gfco/lot-tests"
    shared_operations:
      - "GET /gfco/products, GET /gfco/products/{productId}, GET /gfco/lot-tests, GET /gfco/lot-tests/{lotTestId}"

  - name: ProgramAdministrator
    description: "Program operations: registers applicants and suppliers, changes supplier standing, files consumer complaints, runs the surveillance sweep and drives the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /gfco/applicants"
      - "POST /gfco/suppliers/{supplierId}/status"
      - "POST /gfco/consumer-complaints"
      - "POST /gfco/surveillance-runs"
      - "POST /gfco/_clock/set_current_utc"
    shared_operations:
      - "POST /gfco/suppliers"
      - "every GET under /gfco"
