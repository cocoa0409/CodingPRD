scaffold_corner_design:

  # ==========================================================================
  # Section: entities — creation / retrieval / defaults / required fields /
  # type constraints / immutability / parent relationships
  # ==========================================================================
  - section: entities
    instances:
      - name: department_create_with_defaults
        claim_type: defaults
        grounds:
          - "entities.LegalDepartment"
        distinguishing_aspect: "Omitting budget_warning_pct, budget_critical_pct, deflection_target_pct applies defaults 0.80 / 0.95 / 0.30."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /legal-ops/departments"
              payload: { name: "D" }
              as: LegalOpsManager
              captures: { dept_id: $.data.id, warn: $.data.budget_warning_pct, crit: $.data.budget_critical_pct, defl: $.data.deflection_target_pct }
          trigger: []
          assert:
            - "warn == 0.8"
            - "crit == 0.95"
            - "defl == 0.3"

      - name: matter_create_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "entities.Matter"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Omitting required field matter_number yields 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Department, FP, PA, MT, firm, counsel exist"]
          setup_api_calls:
            - call: "POST /legal-ops/departments"
              payload: { name: "D" }
              as: LegalOpsManager
            - call: "POST /legal-ops/fiscal-periods"
              payload: { label: "FY2026", start_date: "2026-01-01", end_date: "2026-12-31" }
              as: LegalOpsManager
              captures: { fp_id: $.data.id }
            - call: "POST /legal-ops/practice-areas"
              payload: { code: "LIT", display_name: "L" }
              as: LegalOpsManager
              captures: { pa_id: $.data.id }
            - call: "POST /legal-ops/practice-areas/${pa_id}/matter-types"
              payload: { code: "LIT-C", display_name: "C" }
              as: LegalOpsManager
              captures: { mt_id: $.data.id }
            - call: "POST /legal-ops/firms"
              payload: { name: "F", tier: "TIER_1", blended_hourly_rate_cents: 25000 }
              as: LegalOpsManager
              captures: { firm_id: $.data.id }
            - call: "POST /legal-ops/in-house-counsel"
              payload: { full_name: "C", email: "c@x.com", annual_capacity_hours: 2000, loaded_hourly_cost_cents: 15000 }
              as: LegalOpsManager
              captures: { counsel_id: $.data.id }
          trigger:
            - call: "POST /legal-ops/matters"
              payload: { title: "M", practice_area_id: "${pa_id}", matter_type_id: "${mt_id}", fiscal_period_id: "${fp_id}", lead_counsel_id: "${counsel_id}", primary_firm_id: "${firm_id}" }
              as: LegalOpsAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: matter_type_negative_default_budget_rejected
        claim_type: type_constraints
        grounds:
          - "entities.MatterType"
          - "errors[ERR_INVALID_AMOUNT]"
        distinguishing_aspect: "Invalid default_budget_cents (negative integer) rejected with 422 ERR_INVALID_AMOUNT."
        test_recipe:
          setup: ["Department, PA"]
          setup_api_calls:
            - call: "POST /legal-ops/departments"
              payload: { name: "D" }
              as: LegalOpsManager
            - call: "POST /legal-ops/practice-areas"
              payload: { code: "LIT", display_name: "L" }
              as: LegalOpsManager
              captures: { pa_id: $.data.id }
          trigger:
            - call: "POST /legal-ops/practice-areas/${pa_id}/matter-types"
              payload: { code: "LIT-C", display_name: "C", default_budget_cents: -1 }
              as: LegalOpsManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_AMOUNT (negative default_budget_cents violates >= 0 constraint)"

      - name: spend_line_immutable_no_update_endpoint
        claim_type: immutability
        grounds:
          - "entities.SpendLine"
        distinguishing_aspect: "SpendLine has common_fields=false — no PATCH/PUT endpoint exists for it; reverse mutations go through invoice pay only."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /legal-ops/spend-lines/00000000-0000-0000-0000-000000000000"
              as: LegalOpsAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND (no such spend line)"
            - "No PATCH or PUT endpoint declared for /legal-ops/spend-lines/{id} in §1.5"

      - name: matter_type_requires_valid_practice_area_parent
        claim_type: parent_relationships
        grounds:
          - "entities.MatterType"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "Creating matter type under non-existent practice-area id returns 404."
        test_recipe:
          setup: ["Department exists"]
          setup_api_calls:
            - call: "POST /legal-ops/departments"
              payload: { name: "D" }
              as: LegalOpsManager
          trigger:
            - call: "POST /legal-ops/practice-areas/00000000-0000-0000-0000-000000000000/matter-types"
              payload: { code: "X", display_name: "Y" }
              as: LegalOpsManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: entity_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - "entities.Matter"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET on non-existent matter UUID returns ERR_NOT_FOUND."
        test_recipe:
          setup: ["Department"]
          setup_api_calls:
            - call: "POST /legal-ops/departments"
              payload: { name: "D" }
              as: LegalOpsManager
          trigger:
            - call: "GET /legal-ops/matters/00000000-0000-0000-0000-000000000000"
              as: LegalOpsAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: matter_actual_spend_computed_not_input
        claim_type: computed_fields
        grounds:
          - "entities.Matter.fields.actual_spend_cents"
        distinguishing_aspect: "Client cannot inject actual_spend_cents on POST /matters — the field is computed; input value ignored."
        test_recipe:
          setup: ["Department, FP, PA, MT, firm, counsel"]
          setup_api_calls:
            - call: "POST /legal-ops/departments"
              payload: { name: "D" }
              as: LegalOpsManager
            - call: "POST /legal-ops/fiscal-periods"
              payload: { label: "FY2026", start_date: "2026-01-01", end_date: "2026-12-31" }
              as: LegalOpsManager
              captures: { fp_id: $.data.id }
            - call: "POST /legal-ops/practice-areas"
              payload: { code: "LIT", display_name: "L" }
              as: LegalOpsManager
              captures: { pa_id: $.data.id }
            - call: "POST /legal-ops/practice-areas/${pa_id}/matter-types"
              payload: { code: "LIT-C", display_name: "C" }
              as: LegalOpsManager
              captures: { mt_id: $.data.id }
            - call: "POST /legal-ops/firms"
              payload: { name: "F", tier: "TIER_1", blended_hourly_rate_cents: 25000 }
              as: LegalOpsManager
              captures: { firm_id: $.data.id }
            - call: "POST /legal-ops/in-house-counsel"
              payload: { full_name: "C", email: "c@x.com", annual_capacity_hours: 2000, loaded_hourly_cost_cents: 15000 }
              as: LegalOpsManager
              captures: { counsel_id: $.data.id }
          trigger:
            - call: "POST /legal-ops/matters"
              payload: { matter_number: "LGL-2026-00001", title: "M", practice_area_id: "${pa_id}", matter_type_id: "${mt_id}", fiscal_period_id: "${fp_id}", lead_counsel_id: "${counsel_id}", primary_firm_id: "${firm_id}" }
              as: LegalOpsAnalyst
              captures: { m_spend: $.data.actual_spend_cents, m_accr: $.data.accrual_outstanding_cents }
          assert:
            - "m_spend == 0 (computed, no invoice yet)"
            - "m_accr == 0"

  # ==========================================================================
  # Section: state_machines
  # ==========================================================================
  - section: state_machines
    instances:
      - name: matter_invalid_transition_intake_to_closed
        claim_type: invalid_transition
        grounds:
          - "state_machines.Matter"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "INTAKE -> CLOSED not in transitions; rejected."
        test_recipe:
          setup: ["Full matter graph; matter in INTAKE"]
          setup_api_calls:
            - call: "POST /legal-ops/departments"
              payload: { name: "D" }
              as: LegalOpsManager
            - call: "POST /legal-ops/fiscal-periods"
              payload: { label: "FY2026", start_date: "2026-01-01", end_date: "2026-12-31" }
              as: LegalOpsManager
              captures: { fp_id: $.data.id }
            - call: "POST /legal-ops/practice-areas"
              payload: { code: "LIT", display_name: "L" }
              as: LegalOpsManager
              captures: { pa_id: $.data.id }
            - call: "POST /legal-ops/practice-areas/${pa_id}/matter-types"
              payload: { code: "LIT-C", display_name: "C" }
              as: LegalOpsManager
              captures: { mt_id: $.data.id }
            - call: "POST /legal-ops/firms"
              payload: { name: "F", tier: "TIER_1", blended_hourly_rate_cents: 25000 }
              as: LegalOpsManager
              captures: { firm_id: $.data.id }
            - call: "POST /legal-ops/in-house-counsel"
              payload: { full_name: "C", email: "c@x.com", annual_capacity_hours: 2000, loaded_hourly_cost_cents: 15000 }
              as: LegalOpsManager
              captures: { counsel_id: $.data.id }
            - call: "POST /legal-ops/matters"
              payload: { matter_number: "LGL-2026-00001", title: "M", practice_area_id: "${pa_id}", matter_type_id: "${mt_id}", fiscal_period_id: "${fp_id}", lead_counsel_id: "${counsel_id}", primary_firm_id: "${firm_id}" }
              as: LegalOpsAnalyst
              captures: { m_id: $.data.id, m_v: $.data.version }
          trigger:
            - call: "POST /legal-ops/matters/${m_id}/close"
              payload: { expected_matter_version: "${m_v}" }
              as: LegalOpsAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (INTAKE -> CLOSED not defined)"

      - name: matter_terminal_state_lockdown_archived
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.Matter"
        distinguishing_aspect: "ARCHIVED is terminal; no transition out; hold/resume/reopen all rejected."
        test_recipe:
          setup: ["Matter fully through lifecycle to ARCHIVED (period hard-closed first)"]
          setup_api_calls:
            - call: "POST /legal-ops/departments"
              payload: { name: "D" }
              as: LegalOpsManager
            - call: "POST /legal-ops/fiscal-periods"
              payload: { label: "FY2026", start_date: "2026-01-01", end_date: "2026-12-31" }
              as: LegalOpsManager
              captures: { fp_id: $.data.id }
            - call: "POST /legal-ops/practice-areas"
              payload: { code: "LIT", display_name: "L" }
              as: LegalOpsManager
              captures: { pa_id: $.data.id }
            - call: "POST /legal-ops/practice-areas/${pa_id}/matter-types"
              payload: { code: "LIT-C", display_name: "C" }
              as: LegalOpsManager
              captures: { mt_id: $.data.id }
            - call: "POST /legal-ops/firms"
              payload: { name: "F", tier: "TIER_1", blended_hourly_rate_cents: 25000 }
              as: LegalOpsManager
              captures: { firm_id: $.data.id }
            - call: "POST /legal-ops/in-house-counsel"
              payload: { full_name: "C", email: "c@x.com", annual_capacity_hours: 2000, loaded_hourly_cost_cents: 15000 }
              as: LegalOpsManager
              captures: { counsel_id: $.data.id }
            - call: "POST /legal-ops/matters"
              payload: { matter_number: "LGL-2026-00001", title: "M", practice_area_id: "${pa_id}", matter_type_id: "${mt_id}", fiscal_period_id: "${fp_id}", lead_counsel_id: "${counsel_id}", primary_firm_id: "${firm_id}" }
              as: LegalOpsAnalyst
              captures: { m_id: $.data.id }
            - call: "POST /legal-ops/matters/${m_id}/assignments"
              payload: { counsel_id: "${counsel_id}", allocated_hours: 5 }
              as: LegalOpsAnalyst
            - call: "POST /legal-ops/matters/${m_id}/activate"
              payload: {}
              as: LegalOpsAnalyst
            - call: "GET /legal-ops/matters/${m_id}"
              as: LegalOpsAnalyst
              captures: { m_v: $.data.version }
            - call: "POST /legal-ops/matters/${m_id}/close"
              payload: { expected_matter_version: "${m_v}" }
              as: LegalOpsAnalyst
            - call: "POST /legal-ops/fiscal-periods/${fp_id}/soft-close"
              payload: {}
              as: LegalOpsAnalyst
            - call: "POST /legal-ops/fiscal-periods/${fp_id}/hard-close"
              payload: {}
              as: LegalOpsManager
            - call: "POST /legal-ops/matters/${m_id}/archive"
              payload: {}
              as: LegalOpsManager
          trigger:
            - call: "POST /legal-ops/matters/${m_id}/reopen"
              payload: {}
              as: LegalOpsManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (ARCHIVED is terminal)"

      - name: matter_initial_state_is_intake
        claim_type: initial_state
        grounds:
          - "state_machines.Matter"
        distinguishing_aspect: "Newly created matter has status == INTAKE."
        test_recipe:
          setup: ["All parents"]
          setup_api_calls:
            - call: "POST /legal-ops/departments"
              payload: { name: "D" }
              as: LegalOpsManager
            - call: "POST /legal-ops/fiscal-periods"
              payload: { label: "FY2026", start_date: "2026-01-01", end_date: "2026-12-31" }
              as: LegalOpsManager
              captures: { fp_id: $.data.id }
            - call: "POST /legal-ops/practice-areas"
              payload: { code: "LIT", display_name: "L" }
              as: LegalOpsManager
              captures: { pa_id: $.data.id }
            - call: "POST /legal-ops/practice-areas/${pa_id}/matter-types"
              payload: { code: "LIT-C", display_name: "C" }
              as: LegalOpsManager
              captures: { mt_id: $.data.id }
            - call: "POST /legal-ops/firms"
              payload: { name: "F", tier: "TIER_1", blended_hourly_rate_cents: 25000 }
              as: LegalOpsManager
              captures: { firm_id: $.data.id }
            - call: "POST /legal-ops/in-house-counsel"
              payload: { full_name: "C", email: "c@x.com", annual_capacity_hours: 2000, loaded_hourly_cost_cents: 15000 }
              as: LegalOpsManager
              captures: { counsel_id: $.data.id }
          trigger:
            - call: "POST /legal-ops/matters"
              payload: { matter_number: "LGL-2026-00001", title: "M", practice_area_id: "${pa_id}", matter_type_id: "${mt_id}", fiscal_period_id: "${fp_id}", lead_counsel_id: "${counsel_id}", primary_firm_id: "${firm_id}" }
              as: LegalOpsAnalyst
              captures: { m_status: $.data.status }
          assert:
            - "m_status == INTAKE"

      - name: invoice_idempotent_second_approve_rejected
        claim_type: idempotency
        grounds:
          - "state_machines.Invoice"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Second POST approve on already-APPROVED invoice returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Matter active; invoice SUBMITTED then APPROVED"]
          setup_api_calls:
            - call: "POST /legal-ops/departments"
              payload: { name: "D" }
              as: LegalOpsManager
            - call: "POST /legal-ops/fiscal-periods"
              payload: { label: "FY2026", start_date: "2026-01-01", end_date: "2026-12-31" }
              as: LegalOpsManager
              captures: { fp_id: $.data.id }
            - call: "POST /legal-ops/practice-areas"
              payload: { code: "LIT", display_name: "L" }
              as: LegalOpsManager
              captures: { pa_id: $.data.id }
            - call: "POST /legal-ops/practice-areas/${pa_id}/matter-types"
              payload: { code: "LIT-C", display_name: "C" }
              as: LegalOpsManager
              captures: { mt_id: $.data.id }
            - call: "POST /legal-ops/firms"
              payload: { name: "F", tier: "TIER_1", blended_hourly_rate_cents: 25000 }
              as: LegalOpsManager
              captures: { firm_id: $.data.id }
            - call: "POST /legal-ops/in-house-counsel"
              payload: { full_name: "C", email: "c@x.com", annual_capacity_hours: 2000, loaded_hourly_cost_cents: 15000 }
              as: LegalOpsManager
              captures: { counsel_id: $.data.id }
            - call: "POST /legal-ops/matters"
              payload: { matter_number: "LGL-2026-00001", title: "M", practice_area_id: "${pa_id}", matter_type_id: "${mt_id}", fiscal_period_id: "${fp_id}", lead_counsel_id: "${counsel_id}", primary_firm_id: "${firm_id}" }
              as: LegalOpsAnalyst
              captures: { m_id: $.data.id }
            - call: "POST /legal-ops/matters/${m_id}/assignments"
              payload: { counsel_id: "${counsel_id}", allocated_hours: 5 }
              as: LegalOpsAnalyst
            - call: "POST /legal-ops/matters/${m_id}/activate"
              payload: {}
              as: LegalOpsAnalyst
            - call: "POST /legal-ops/invoices"
              payload: { matter_id: "${m_id}", firm_id: "${firm_id}", fiscal_period_id: "${fp_id}", invoice_number: "I-1", amount_cents: 50000 }
              as: LegalOpsAnalyst
              captures: { inv_id: $.data.id }
            - call: "POST /legal-ops/invoices/${inv_id}/approve"
              payload: {}
              as: LegalOpsAnalyst
          trigger:
            - call: "POST /legal-ops/invoices/${inv_id}/approve"
              payload: {}
              as: LegalOpsAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: matter_close_cascades_release_assignments
        claim_type: side_effect_execution
        grounds:
          - "state_machines.Matter.transitions.ACTIVE_to_CLOSED"
        distinguishing_aspect: "Closing matter releases all ACTIVE MatterAssignment rows; capacity returns to counsel."
        test_recipe:
          setup: ["Counsel cap 100; two assignments 60 + 40 on two matters; one matter closed"]
          setup_api_calls:
            - call: "POST /legal-ops/departments"
              payload: { name: "D" }
              as: LegalOpsManager
            - call: "POST /legal-ops/fiscal-periods"
              payload: { label: "FY2026", start_date: "2026-01-01", end_date: "2026-12-31" }
              as: LegalOpsManager
              captures: { fp_id: $.data.id }
            - call: "POST /legal-ops/practice-areas"
              payload: { code: "LIT", display_name: "L" }
              as: LegalOpsManager
              captures: { pa_id: $.data.id }
            - call: "POST /legal-ops/practice-areas/${pa_id}/matter-types"
              payload: { code: "LIT-C", display_name: "C" }
              as: LegalOpsManager
              captures: { mt_id: $.data.id }
            - call: "POST /legal-ops/firms"
              payload: { name: "F", tier: "TIER_1", blended_hourly_rate_cents: 25000 }
              as: LegalOpsManager
              captures: { firm_id: $.data.id }
            - call: "POST /legal-ops/in-house-counsel"
              payload: { full_name: "C", email: "c@x.com", annual_capacity_hours: 100, loaded_hourly_cost_cents: 15000 }
              as: LegalOpsManager
              captures: { counsel_id: $.data.id }
            - call: "POST /legal-ops/matters"
              payload: { matter_number: "LGL-2026-00001", title: "M1", practice_area_id: "${pa_id}", matter_type_id: "${mt_id}", fiscal_period_id: "${fp_id}", lead_counsel_id: "${counsel_id}", primary_firm_id: "${firm_id}" }
              as: LegalOpsAnalyst
              captures: { m1_id: $.data.id }
            - call: "POST /legal-ops/matters/${m1_id}/assignments"
              payload: { counsel_id: "${counsel_id}", allocated_hours: 60 }
              as: LegalOpsAnalyst
              captures: { a1_id: $.data.id }
            - call: "POST /legal-ops/matters/${m1_id}/activate"
              payload: {}
              as: LegalOpsAnalyst
            - call: "POST /legal-ops/matters"
              payload: { matter_number: "LGL-2026-00002", title: "M2", practice_area_id: "${pa_id}", matter_type_id: "${mt_id}", fiscal_period_id: "${fp_id}", lead_counsel_id: "${counsel_id}", primary_firm_id: "${firm_id}" }
              as: LegalOpsAnalyst
              captures: { m2_id: $.data.id }
            - call: "POST /legal-ops/matters/${m2_id}/assignments"
              payload: { counsel_id: "${counsel_id}", allocated_hours: 40 }
              as: LegalOpsAnalyst
            - call: "POST /legal-ops/matters/${m2_id}/activate"
              payload: {}
              as: LegalOpsAnalyst
            - call: "GET /legal-ops/in-house-counsel/${counsel_id}/utilization"
              as: LegalOpsAnalyst
              captures: { pre_util: $.data.total_allocated_hours }
            - call: "GET /legal-ops/matters/${m1_id}"
              as: LegalOpsAnalyst
              captures: { m1_v: $.data.version }
          trigger:
            - call: "POST /legal-ops/matters/${m1_id}/close"
              payload: { expected_matter_version: "${m1_v}" }
              as: LegalOpsAnalyst
            - call: "GET /legal-ops/matter-assignments/${a1_id}"
              as: LegalOpsAnalyst
              captures: { a1_status: $.data.status }
            - call: "GET /legal-ops/in-house-counsel/${counsel_id}/utilization"
              as: LegalOpsAnalyst
              captures: { post_util: $.data.total_allocated_hours }
          assert:
            - "pre_util == 100"
            - "a1_status == RELEASED (cascade)"
            - "post_util == 40 (60 hours returned)"

      - name: dashboard_publish_supersedes_prior
        claim_type: side_effect_execution
        grounds:
          - "state_machines.Dashboard.transitions.DRAFT_to_PUBLISHED"
        distinguishing_aspect: "Publishing a new dashboard for the same period supersedes any previously PUBLISHED one."
        test_recipe:
          setup: ["Period soft-closed; two DRAFT dashboards D1 and D2 for same period; D1 published"]
          setup_api_calls:
            - call: "POST /legal-ops/departments"
              payload: { name: "D" }
              as: LegalOpsManager
            - call: "POST /legal-ops/fiscal-periods"
              payload: { label: "FY2026", start_date: "2026-01-01", end_date: "2026-12-31" }
              as: LegalOpsManager
              captures: { fp_id: $.data.id }
            - call: "POST /legal-ops/fiscal-periods/${fp_id}/soft-close"
              payload: {}
              as: LegalOpsAnalyst
            - call: "POST /legal-ops/dashboards"
              payload: { fiscal_period_id: "${fp_id}", snapshot_label: "D1" }
              as: LegalOpsAnalyst
              captures: { d1_id: $.data.id, d1_v: $.data.version }
            - call: "POST /legal-ops/dashboards"
              payload: { fiscal_period_id: "${fp_id}", snapshot_label: "D2" }
              as: LegalOpsAnalyst
              captures: { d2_id: $.data.id, d2_v: $.data.version }
            - call: "POST /legal-ops/dashboards/${d1_id}/publish"
              payload: { expected_dashboard_version: "${d1_v}" }
              as: LegalOpsManager
          trigger:
            - call: "POST /legal-ops/dashboards/${d2_id}/publish"
              payload: { expected_dashboard_version: "${d2_v}" }
              as: LegalOpsManager
            - call: "GET /legal-ops/dashboards/${d1_id}"
              as: LegalOpsAnalyst
              captures: { d1_status: $.data.status }
          assert:
            - "d1_status == SUPERSEDED (side effect of D2 publish)"

  # ==========================================================================
  # Section: calculations
  # ==========================================================================
  - section: calculations
    instances:
      - name: accrual_match_fully_matched_boundary
        claim_type: correct_result
        grounds:
