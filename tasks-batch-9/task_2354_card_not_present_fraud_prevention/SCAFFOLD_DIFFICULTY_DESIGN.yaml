# =============================================================================
# task_2354 — §1.8 Scaffold Difficulty Design (test targeting index)
# 9 §0.5 rule_ids x 2 instances = 18 instances.
# Every numeric assert below was computed by executing the §1.3 formulas against
# the pinned inputs; no assert is left as an expression.
#
# Canonical setup vocabulary reused across instances:
#   BOOT-W  = the 10-call chain that stands up customer / device / address /
#             WEIGHTED rule pack P1 (rule_weight 0.40, model_weight 0.60,
#             review_floor 40.00, decline_floor 60.00, rules BEH_FAST_CHECKOUT=20
#             and hard-decline DEV_EMULATOR=45) / ACTIVE risk model M1
#             (intercept 0.05, slope 1.20).
#   With session_seconds 30 and cart_item_count 3 only BEH_FAST_CHECKOUT fires,
#   so rule_score is 20 and primary_signal_family is BEHAVIORAL.
#   model_raw_probability -> model_points -> WEIGHTED blended_score (rule_score 20):
#     0.4021 -> 53.25 -> 39.95  (APPROVE, just under the 40.00 review floor)
#     0.4028 -> 53.34 -> 40.00  (REVIEW, exactly at the review floor)
#     0.5417 -> 70.00 -> 50.00  (REVIEW)
#     0.6800 -> 86.60 -> 59.96  (REVIEW, just under the 60.00 decline floor)
#     0.6806 -> 86.67 -> 60.00  (DECLINE, exactly at the decline floor)
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: blended_score_weighted_vs_rule_dominant_diverge
        grounds:
          - calculations.blended_risk_score
          - calculations.model_point_calibration
          - entities.RulePack.fields.blend_mode
          - entities.CheckoutAssessment.fields.blended_score
          - state_machines.CheckoutAssessment.PENDING_SIGNALS_to_DECIDED_APPROVE
          - state_machines.CheckoutAssessment.PENDING_SIGNALS_to_IN_REVIEW
        distinguishing_aspect: |
          Variant divergence inside the CheckoutAssessment scoring domain: identical
          rule_score 20 and model_points 53.25 produce blended_score 39.95 under the
          WEIGHTED variant and 48.25 under the RULE_DOMINANT variant — an 8.30-point
          gap that also moves the order from the APPROVE band into the REVIEW band.
        test_recipe:
          setup:
            - "WEIGHTED pack P1 is ACTIVE over [2026-07-01T00:00:00Z, 2026-08-01T12:00:00Z) with rule_weight 0.40 / model_weight 0.60, review_floor 40.00, decline_floor 60.00."
            - "RULE_DOMINANT pack P2 carries the same BEH_FAST_CHECKOUT=20 rule and the same floors, and is ACTIVE over [2026-08-01T13:00:01Z, 2027-01-01T00:00:00Z) — 3601s after P1's window ends, clearing the 3600s activation freeze buffer."
            - "Assessment A was scored at 2026-08-01T00:00:00Z under P1; assessment B is scored at 2026-08-01T14:00:00Z under P2 with byte-identical signal inputs."
          setup_api_calls:
            - call: "POST /fraud/customers"
              payload: { email: "dual@example.com", home_country: "US", tier: "STANDARD" }
              as: CheckoutService
              captures: { cust_id: $.data.id }
            - call: "POST /fraud/devices"
              payload: { device_hash: "dev-dual-001", tz_offset_minutes: -480, emulator_flag: false }
              as: CheckoutService
              captures: { dev_id: $.data.id }
            - call: "POST /fraud/addresses"
              payload: { line1: "100 Main St", postal_code: "94105", country_code: "US", classification: "RESIDENTIAL" }
              as: CheckoutService
              captures: { addr_id: $.data.id }
            - call: "POST /fraud/rule-packs"
              payload: { version_label: "P1-weighted", blend_mode: "WEIGHTED", rule_weight: 0.40, model_weight: 0.60, review_floor_score: 40.00, decline_floor_score: 60.00, effective_from: "2026-07-01T00:00:00Z", effective_until: "2026-08-01T12:00:00Z" }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
              captures: { pack1_id: $.data.id }
            - call: "POST /fraud/rule-packs/${pack1_id}/rules"
              payload: { code: "BEH_FAST_CHECKOUT", signal_family: "BEHAVIORAL", points: 20, evaluation_order: 10, hard_decline: false }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
            - call: "POST /fraud/rule-packs/${pack1_id}/rules"
              payload: { code: "DEV_EMULATOR", signal_family: "DEVICE", points: 45, evaluation_order: 20, hard_decline: true }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
            - call: "POST /fraud/rule-packs/${pack1_id}/activate"
              payload: {}
              as: PolicyEngineer
              as_user_id: "eng-approver-2"
            - call: "POST /fraud/risk-models"
              payload: { model_version_label: "M1", calibration_intercept: 0.05, calibration_slope: 1.20 }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
              captures: { model_id: $.data.id }
            - call: "POST /fraud/risk-models/${model_id}/lifecycle"
              payload: { action: "PUBLISH_SHADOW" }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
            - call: "POST /fraud/risk-models/${model_id}/lifecycle"
              payload: { action: "PROMOTE" }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
            - call: "POST /fraud/checkout-assessments"
              payload: { customer_id: "${cust_id}", device_profile_id: "${dev_id}", shipping_address_id: "${addr_id}", billing_address_id: "${addr_id}", amount_cents: 20000, card_bin: "411111", ip_country: "US", session_seconds: 30, cart_item_count: 3, model_raw_probability: 0.4021 }
              as: CheckoutService
              captures: { asmt_a_id: $.data.id }
            - call: "POST /fraud/checkout-assessments/${asmt_a_id}/score"
              payload: {}
              as: CheckoutService
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T14:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fraud/rule-packs"
              payload: { version_label: "P2-rule-dominant", blend_mode: "RULE_DOMINANT", rule_weight: 0.40, model_weight: 0.60, review_floor_score: 40.00, decline_floor_score: 60.00, effective_from: "2026-08-01T13:00:01Z", effective_until: "2027-01-01T00:00:00Z" }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
              captures: { pack2_id: $.data.id }
            - call: "POST /fraud/rule-packs/${pack2_id}/rules"
              payload: { code: "BEH_FAST_CHECKOUT", signal_family: "BEHAVIORAL", points: 20, evaluation_order: 10, hard_decline: false }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
            - call: "POST /fraud/rule-packs/${pack2_id}/activate"
              payload: {}
              as: PolicyEngineer
              as_user_id: "eng-approver-2"
          trigger:
            - call: "POST /fraud/checkout-assessments"
              payload: { customer_id: "${cust_id}", device_profile_id: "${dev_id}", shipping_address_id: "${addr_id}", billing_address_id: "${addr_id}", amount_cents: 20000, card_bin: "411111", ip_country: "US", session_seconds: 30, cart_item_count: 3, model_raw_probability: 0.4021 }
              as: CheckoutService
              captures: { asmt_b_id: $.data.id }
            - call: "POST /fraud/checkout-assessments/${asmt_b_id}/score"
              payload: {}
              as: CheckoutService
          assert:
            - "CheckoutAssessment.${asmt_a_id}.rule_pack_id == ${pack1_id}"
            - "CheckoutAssessment.${asmt_a_id}.rule_score == 20"
            - "CheckoutAssessment.${asmt_a_id}.model_points == 53.25"
            - "CheckoutAssessment.${asmt_a_id}.blended_score == 39.95"
            - "CheckoutAssessment.${asmt_a_id}.decision == APPROVE"
            - "CheckoutAssessment.${asmt_b_id}.rule_pack_id == ${pack2_id}"
            - "CheckoutAssessment.${asmt_b_id}.rule_score == 20"
            - "CheckoutAssessment.${asmt_b_id}.model_points == 53.25"
            - "CheckoutAssessment.${asmt_b_id}.blended_score == 48.25"
            - "CheckoutAssessment.${asmt_b_id}.decision == REVIEW"
            - "CheckoutAssessment.${asmt_b_id}.state == IN_REVIEW"
            - "CheckoutAssessment.${asmt_b_id}.blended_score - CheckoutAssessment.${asmt_a_id}.blended_score == 8.30"

      - name: insult_rate_decision_cohort_vs_good_customer_cohort
        grounds:
          - calculations.rule_pack_performance_metrics
          - entities.CheckoutAssessment.fields.good_customer_at_decision
          - entities.CheckoutAssessment.fields.outcome_label
          - state_machines.ChargebackRecord.REPRESENTED_to_LOST
        distinguishing_aspect: |
          Variant divergence in the RulePack portfolio-reporting domain rather than
          in per-order scoring: over the same three terminal assessments the
          DECISION_COHORT variant reports insult_rate 0.3333 while the
          GOOD_CUSTOMER_COHORT variant reports 1.0000, because the cohort filter
          reads each assessment's frozen good_customer_at_decision snapshot.
        test_recipe:
          setup:
            - "BOOT-W is in place; pack P1 is ACTIVE over [2026-07-01T00:00:00Z, 2027-01-01T00:00:00Z)."
            - "A1 and A2 are machine-approved 15000-cent orders scored while good_customer_flag was still false, so both carry good_customer_at_decision false; after A2 the customer reaches 2 approvals / 30000 cents and the flag turns true."
            - "A3 is a 15000-cent order declined by the score band while the flag was true, so it carries good_customer_at_decision true and outcome_label UNKNOWN — a good-customer rejection."
            - "A chargeback on A1 is LOST with reason FRAUD_CNP, flipping A1.outcome_label to FRAUD."
          setup_api_calls:
            - call: "POST /fraud/customers"
              payload: { email: "insult@example.com", home_country: "US", tier: "STANDARD" }
              as: CheckoutService
              captures: { cust_id: $.data.id }
            - call: "POST /fraud/devices"
              payload: { device_hash: "dev-insult-001", tz_offset_minutes: -480, emulator_flag: false }
              as: CheckoutService
              captures: { dev_id: $.data.id }
            - call: "POST /fraud/addresses"
              payload: { line1: "100 Main St", postal_code: "94105", country_code: "US", classification: "RESIDENTIAL" }
              as: CheckoutService
              captures: { addr_id: $.data.id }
            - call: "POST /fraud/rule-packs"
              payload: { version_label: "P1-weighted", blend_mode: "WEIGHTED", rule_weight: 0.40, model_weight: 0.60, review_floor_score: 40.00, decline_floor_score: 60.00, effective_from: "2026-07-01T00:00:00Z", effective_until: "2027-01-01T00:00:00Z" }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
              captures: { pack_id: $.data.id }
            - call: "POST /fraud/rule-packs/${pack_id}/rules"
              payload: { code: "BEH_FAST_CHECKOUT", signal_family: "BEHAVIORAL", points: 20, evaluation_order: 10, hard_decline: false }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
            - call: "POST /fraud/rule-packs/${pack_id}/rules"
              payload: { code: "DEV_EMULATOR", signal_family: "DEVICE", points: 45, evaluation_order: 20, hard_decline: true }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
            - call: "POST /fraud/rule-packs/${pack_id}/activate"
              payload: {}
              as: PolicyEngineer
              as_user_id: "eng-approver-2"
            - call: "POST /fraud/risk-models"
              payload: { model_version_label: "M1", calibration_intercept: 0.05, calibration_slope: 1.20 }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
              captures: { model_id: $.data.id }
            - call: "POST /fraud/risk-models/${model_id}/lifecycle"
              payload: { action: "PUBLISH_SHADOW" }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
            - call: "POST /fraud/risk-models/${model_id}/lifecycle"
              payload: { action: "PROMOTE" }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
            - call: "POST /fraud/checkout-assessments"
              payload: { customer_id: "${cust_id}", device_profile_id: "${dev_id}", shipping_address_id: "${addr_id}", billing_address_id: "${addr_id}", amount_cents: 15000, card_bin: "411111", ip_country: "US", session_seconds: 30, cart_item_count: 3, model_raw_probability: 0.4021 }
              as: CheckoutService
              captures: { a1_id: $.data.id }
            - call: "POST /fraud/checkout-assessments/${a1_id}/score"
              payload: {}
              as: CheckoutService
            - call: "POST /fraud/checkout-assessments"
              payload: { customer_id: "${cust_id}", device_profile_id: "${dev_id}", shipping_address_id: "${addr_id}", billing_address_id: "${addr_id}", amount_cents: 15000, card_bin: "411111", ip_country: "US", session_seconds: 30, cart_item_count: 3, model_raw_probability: 0.4021 }
              as: CheckoutService
              captures: { a2_id: $.data.id }
            - call: "POST /fraud/checkout-assessments/${a2_id}/score"
              payload: {}
              as: CheckoutService
            - call: "POST /fraud/checkout-assessments"
              payload: { customer_id: "${cust_id}", device_profile_id: "${dev_id}", shipping_address_id: "${addr_id}", billing_address_id: "${addr_id}", amount_cents: 15000, card_bin: "411111", ip_country: "US", session_seconds: 30, cart_item_count: 3, model_raw_probability: 0.6806 }
              as: CheckoutService
              captures: { a3_id: $.data.id }
            - call: "POST /fraud/checkout-assessments/${a3_id}/score"
              payload: {}
              as: CheckoutService
            - call: "POST /fraud/chargebacks"
              payload: { assessment_id: "${a1_id}", reason_code: "FRAUD_CNP", amount_cents: 15000, liability_shift: false, received_at: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { cb1_id: $.data.id }
            - call: "POST /fraud/chargebacks/${cb1_id}/transition"
              payload: { action: "REPRESENT", evidence_note: "AVS match on file" }
              as: PlatformAdmin
            - call: "POST /fraud/chargebacks/${cb1_id}/transition"
              payload: { action: "LOSE" }
              as: PlatformAdmin
          trigger:
            - call: "GET /fraud/rule-packs/${pack_id}/performance"
              payload: { cohort: "DECISION_COHORT" }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
              captures: { decision_insult_rate: $.data.insult_rate }
            - call: "GET /fraud/rule-packs/${pack_id}/performance"
              payload: { cohort: "GOOD_CUSTOMER_COHORT" }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
              captures: { good_insult_rate: $.data.insult_rate }
          assert:
            - "CheckoutAssessment.${a1_id}.good_customer_at_decision == false"
            - "CheckoutAssessment.${a2_id}.good_customer_at_decision == false"
            - "CheckoutAssessment.${a3_id}.blended_score == 60.00 and decision == DECLINE"
            - "CheckoutAssessment.${a3_id}.good_customer_at_decision == true"
            - "CheckoutAssessment.${a1_id}.outcome_label == FRAUD"
            - "${decision_insult_rate} == 0.3333"
            - "DECISION_COHORT response: denominator_count == 3, approved_count == 2, declined_count == 1, false_positive_count == 1, confirmed_fraud_count == 1, fraud_capture_rate == 0.0000"
            - "${good_insult_rate} == 1.0000"
            - "GOOD_CUSTOMER_COHORT response: denominator_count == 1, approved_count == 0, declined_count == 1, false_positive_count == 1, confirmed_fraud_count == 0, fraud_capture_rate == 0.0000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: rule_dominant_nested_rounding_order_pinned
        grounds:
          - calculations.blended_risk_score
          - calculations.model_point_calibration
          - entities.CheckoutAssessment.fields.blended_score
        distinguishing_aspect: |
          Mode (b) — pinned nested rounding order. The damped model term is rounded
          to ONE decimal before the uplift multiplies it, so blended_score is 48.25;
          collapsing the two rounding steps into one yields 48.30, and the test
          discriminates the two.
        test_recipe:
          setup:
            - "The only ACTIVE pack is RULE_DOMINANT pack P2 (BEH_FAST_CHECKOUT=20, review_floor 40.00, decline_floor 60.00) over [2026-07-01T00:00:00Z, 2027-01-01T00:00:00Z)."
            - "Risk model M1 (intercept 0.05, slope 1.20) is ACTIVE."
          setup_api_calls:
            - call: "POST /fraud/customers"
              payload: { email: "nest@example.com", home_country: "US", tier: "STANDARD" }
              as: CheckoutService
              captures: { cust_id: $.data.id }
            - call: "POST /fraud/devices"
              payload: { device_hash: "dev-nest-001", tz_offset_minutes: -480, emulator_flag: false }
              as: CheckoutService
              captures: { dev_id: $.data.id }
            - call: "POST /fraud/addresses"
              payload: { line1: "100 Main St", postal_code: "94105", country_code: "US", classification: "RESIDENTIAL" }
              as: CheckoutService
              captures: { addr_id: $.data.id }
            - call: "POST /fraud/rule-packs"
              payload: { version_label: "P2-rule-dominant", blend_mode: "RULE_DOMINANT", rule_weight: 0.40, model_weight: 0.60, review_floor_score: 40.00, decline_floor_score: 60.00, effective_from: "2026-07-01T00:00:00Z", effective_until: "2027-01-01T00:00:00Z" }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
              captures: { pack_id: $.data.id }
            - call: "POST /fraud/rule-packs/${pack_id}/rules"
              payload: { code: "BEH_FAST_CHECKOUT", signal_family: "BEHAVIORAL", points: 20, evaluation_order: 10, hard_decline: false }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
            - call: "POST /fraud/rule-packs/${pack_id}/activate"
              payload: {}
              as: PolicyEngineer
              as_user_id: "eng-approver-2"
            - call: "POST /fraud/risk-models"
              payload: { model_version_label: "M1", calibration_intercept: 0.05, calibration_slope: 1.20 }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
              captures: { model_id: $.data.id }
            - call: "POST /fraud/risk-models/${model_id}/lifecycle"
              payload: { action: "PUBLISH_SHADOW" }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
            - call: "POST /fraud/risk-models/${model_id}/lifecycle"
              payload: { action: "PROMOTE" }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
            - call: "POST /fraud/checkout-assessments"
              payload: { customer_id: "${cust_id}", device_profile_id: "${dev_id}", shipping_address_id: "${addr_id}", billing_address_id: "${addr_id}", amount_cents: 20000, card_bin: "411111", ip_country: "US", session_seconds: 30, cart_item_count: 3, model_raw_probability: 0.4021 }
              as: CheckoutService
              captures: { asmt_id: $.data.id }
          trigger:
            - call: "POST /fraud/checkout-assessments/${asmt_id}/score"
              payload: {}
              as: CheckoutService
          assert:
            - "CheckoutAssessment.${asmt_id}.model_points == 53.25"
            - "CheckoutAssessment.${asmt_id}.rule_score == 20"
            - "CheckoutAssessment.${asmt_id}.blended_score == 48.25"
            - "CheckoutAssessment.${asmt_id}.blended_score != 48.30"
            - "CheckoutAssessment.${asmt_id}.decision == REVIEW"
            - "CheckoutAssessment.${asmt_id}.decision_reason == SCORE_BAND"

      - name: hard_decline_short_circuit_evaluation_order_pinned
        grounds:
          - calculations.rule_score_evaluation
          - calculations.decision_band_selection
          - entities.FraudRule.fields.evaluation_order
          - entities.FraudRule.fields.hard_decline
          - entities.CheckoutAssessment.fields.triggered_rule_codes
          - state_machines.CheckoutAssessment.PENDING_SIGNALS_to_DECIDED_DECLINE
        distinguishing_aspect: |
          Mode (c) — pinned evaluation ORDER, not rounding. A hard-decline rule at
          evaluation_order 10 short-circuits the walk, so the 30-point rule at
          evaluation_order 20 never fires: rule_score is 45 and
          triggered_rule_codes is exactly ["DEV_EMULATOR"], never 75 or a two-code
          list, even though both predicates are true.
        test_recipe:
          setup:
            - "Pack P3 is ACTIVE with DEV_EMULATOR (DEVICE, 45 points, evaluation_order 10, hard_decline true) and BEH_FAST_CHECKOUT (BEHAVIORAL, 30 points, evaluation_order 20, hard_decline false)."
            - "The device has emulator_flag true, and the checkout has session_seconds 30, so BOTH predicates are true."
          setup_api_calls:
            - call: "POST /fraud/customers"
              payload: { email: "shortc@example.com", home_country: "US", tier: "STANDARD" }
              as: CheckoutService
              captures: { cust_id: $.data.id }
            - call: "POST /fraud/devices"
              payload: { device_hash: "dev-emul-001", tz_offset_minutes: -480, emulator_flag: true }
              as: CheckoutService
              captures: { dev_id: $.data.id }
            - call: "POST /fraud/addresses"
              payload: { line1: "100 Main St", postal_code: "94105", country_code: "US", classification: "RESIDENTIAL" }
              as: CheckoutService
              captures: { addr_id: $.data.id }
            - call: "POST /fraud/rule-packs"
              payload: { version_label: "P3-shortcircuit", blend_mode: "WEIGHTED", rule_weight: 0.40, model_weight: 0.60, review_floor_score: 40.00, decline_floor_score: 60.00, effective_from: "2026-07-01T00:00:00Z", effective_until: "2027-01-01T00:00:00Z" }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
              captures: { pack_id: $.data.id }
            - call: "POST /fraud/rule-packs/${pack_id}/rules"
              payload: { code: "DEV_EMULATOR", signal_family: "DEVICE", points: 45, evaluation_order: 10, hard_decline: true }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
            - call: "POST /fraud/rule-packs/${pack_id}/rules"
              payload: { code: "BEH_FAST_CHECKOUT", signal_family: "BEHAVIORAL", points: 30, evaluation_order: 20, hard_decline: false }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
            - call: "POST /fraud/rule-packs/${pack_id}/activate"
              payload: {}
              as: PolicyEngineer
              as_user_id: "eng-approver-2"
            - call: "POST /fraud/risk-models"
              payload: { model_version_label: "M1", calibration_intercept: 0.05, calibration_slope: 1.20 }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
              captures: { model_id: $.data.id }
            - call: "POST /fraud/risk-models/${model_id}/lifecycle"
              payload: { action: "PUBLISH_SHADOW" }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
            - call: "POST /fraud/risk-models/${model_id}/lifecycle"
              payload: { action: "PROMOTE" }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
            - call: "POST /fraud/checkout-assessments"
              payload: { customer_id: "${cust_id}", device_profile_id: "${dev_id}", shipping_address_id: "${addr_id}", billing_address_id: "${addr_id}", amount_cents: 20000, card_bin: "411111", ip_country: "US", session_seconds: 30, cart_item_count: 3, model_raw_probability: 0.4021 }
              as: CheckoutService
              captures: { asmt_id: $.data.id }
          trigger:
            - call: "POST /fraud/checkout-assessments/${asmt_id}/score"
              payload: {}
              as: CheckoutService
          assert:
            - "CheckoutAssessment.${asmt_id}.rule_score == 45"
            - "CheckoutAssessment.${asmt_id}.triggered_rule_codes == [\"DEV_EMULATOR\"]"
            - "CheckoutAssessment.${asmt_id}.hard_decline_triggered == true"
            - "CheckoutAssessment.${asmt_id}.primary_signal_family == DEVICE"
