      - name: third_revision_request_is_refused_after_two_rounds
        claim_type: error_triggerable
        grounds:
          - errors[ERR_MAX_REVISION_ROUNDS_REACHED]
          - validations[priority 24]
          - state_machines.Audition.transitions
          - calculations.constants.MAX_REVISION_ROUNDS
        distinguishing_aspect: |
          MAX_REVISION_ROUNDS is 2 and the guard is revision_round < 2 evaluated BEFORE the
          increment, so exactly two revision requests succeed (revision_round 0 -> 1 -> 2)
          and the third is 409 ERR_MAX_REVISION_ROUNDS_REACHED even though the audition sits
          in the same SCORED state that admitted the first two. The refusal is not a state
          error: the audition stays SCORED and remains adjudicable.
