# =============================================================================
# §1.8 Scaffold Difficulty Design — Life Insurance Claims & Beneficiary Payout
# Test Targeting Index: 9 Difficulty Rules x 2 instances.
# Every chain replays from empty-DB using only SCAFFOLD.yaml §1.5 endpoints.
# All formula-derived literals were computed by executing the §1.3 formulas.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains: Claim vs RetainedAssetAccount)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: statutory_interest_basis_date_of_death_vs_proof_complete
        grounds:
          - calculations.statutory_interest
          - entities.Claim.fields.accrued_interest_cents
          - entities.StateStatute.fields.interest_basis
        distinguishing_aspect: |
          Identical claim data under two statutes produces different interest purely
          from the accrual-basis variant: IL (DATE_OF_DEATH, grace 30) yields
          68493 cents while NY (PROOF_OF_LOSS_COMPLETE, grace 15) yields 92466 cents
          on the same face amount and the same approve date. Claim-domain variant.
        test_recipe:
          setup:
            - "IL statute: 1000bp, DATE_OF_DEATH, grace 30; NY statute: 900bp, PROOF_OF_LOSS_COMPLETE, grace 15"
            - "Two policies (state IL / state NY), identical face 25000000 cents, issue 2024-03-01, contestability 24 -> death 2026-03-01 is exactly the boundary, so both claims are NOT contestable (strict <)"
            - "Both claims have CERTIFIED_DEATH_CERTIFICATE VERIFIED on 2026-03-11 (proof_complete_date=2026-03-11); both approved on 2026-04-10"
          setup_api_calls:
            - { call: "POST /state-statutes", payload: { state_code: "IL", annual_interest_rate_bp: 1000, interest_basis: "DATE_OF_DEATH", grace_days: 30, payment_deadline_days: 30, dormancy_years: 3, raa_minimum_cents: 100000, raa_annual_interest_rate_bp: 300 }, as: ComplianceOfficer }
            - { call: "POST /state-statutes", payload: { state_code: "NY", annual_interest_rate_bp: 900, interest_basis: "PROOF_OF_LOSS_COMPLETE", grace_days: 15, payment_deadline_days: 30, dormancy_years: 5, raa_minimum_cents: 100000, raa_annual_interest_rate_bp: 300 }, as: ComplianceOfficer }
            - { call: "POST /policies", payload: { policy_number: "P-IL-1", insured_name: "Jane Doe", insured_dob: "1960-01-01", state_code: "IL", face_amount_cents: 25000000, issue_date: "2024-03-01", contestability_months: 24 }, as: PolicyAdministrator, captures: { pol_il: $.data.id } }
            - { call: "POST /policies", payload: { policy_number: "P-NY-1", insured_name: "Jane Doe", insured_dob: "1960-01-01", state_code: "NY", face_amount_cents: 25000000, issue_date: "2024-03-01", contestability_months: 24 }, as: PolicyAdministrator, captures: { pol_ny: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-05T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /claims", payload: { policy_id: "${pol_il}", date_of_death: "2026-03-01", cause_of_death: "NATURAL" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { cl_il: $.data.id } }
            - { call: "POST /claims", payload: { policy_id: "${pol_ny}", date_of_death: "2026-03-01", cause_of_death: "NATURAL" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { cl_ny: $.data.id } }
            - { call: "POST /claims/${cl_il}/documents", payload: { doc_type: "CERTIFIED_DEATH_CERTIFICATE" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { doc_il: $.data.id } }
            - { call: "POST /claims/${cl_ny}/documents", payload: { doc_type: "CERTIFIED_DEATH_CERTIFICATE" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { doc_ny: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-11T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /claims/${cl_il}/documents/${doc_il}/review", payload: { review_result: "VERIFIED" }, as: ClaimsExaminer, as_user_id: "examiner-2" }
            - { call: "POST /claims/${cl_ny}/documents/${doc_ny}/review", payload: { review_result: "VERIFIED" }, as: ClaimsExaminer, as_user_id: "examiner-2" }
            - { call: "POST /claims/${cl_il}/begin-review", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
            - { call: "POST /claims/${cl_ny}/begin-review", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-10T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /claims/${cl_il}/approve", payload: {}, as: ClaimsApprover, as_user_id: "approver-1", captures: { il_interest: $.data.accrued_interest_cents, il_total: $.data.total_payable_cents } }
            - { call: "POST /claims/${cl_ny}/approve", payload: {}, as: ClaimsApprover, as_user_id: "approver-1", captures: { ny_interest: $.data.accrued_interest_cents, ny_total: $.data.total_payable_cents } }
          assert:
            - "Claim.${cl_il}.accrued_interest_cents == 68493  (basis 2026-03-01: 40 elapsed - 30 grace = 10 days x 25000000 x 10% / 365 = 68493.15)"
            - "Claim.${cl_il}.total_payable_cents == 25068493"
            - "Claim.${cl_ny}.accrued_interest_cents == 92466  (basis proof 2026-03-11: 30 elapsed - 15 grace = 15 days x 25000000 x 9% / 365 = 92465.75)"
            - "Claim.${cl_ny}.total_payable_cents == 25092466"
            - "il_interest != ny_interest for identical face/death/approve dates"

      - name: raa_provisional_simple_vs_final_compound_yield
        grounds:
          - calculations.raa_provisional_yield
          - calculations.raa_final_yield
          - entities.RetainedAssetAccount.fields.provisional_interest_cents
          - entities.RetainedAssetAccount.fields.interest_paid_cents
        distinguishing_aspect: |
          On the same 10000000-cent balance at the same date (2026-07-01), the
          provisional simple-yield read yields 74795 cents while the final
          monthly-compounded yield at closure yields 75188 cents.
          RetainedAssetAccount-domain variant — distinct entity domain from the
          statutory_interest instance.
        test_recipe:
          setup:
            - "TX statute: grace 365 (zero interest inside the test window), raa rate 300bp, raa min 100000, dormancy 3y"
            - "TX policy face 10000000, designation Alice PRIMARY 100%; claim approved 2026-03-05; RAA election confirmed; execute-payment on 2026-04-01 funds account (created_at 2026-04-01)"
          setup_api_calls:
            - { call: "POST /state-statutes", payload: { state_code: "TX", annual_interest_rate_bp: 1200, interest_basis: "DATE_OF_DEATH", grace_days: 365, payment_deadline_days: 30, dormancy_years: 3, raa_minimum_cents: 100000, raa_annual_interest_rate_bp: 300 }, as: ComplianceOfficer }
            - { call: "POST /policies", payload: { policy_number: "P-TX-1", insured_name: "John Roe", insured_dob: "1955-05-05", state_code: "TX", face_amount_cents: 10000000, issue_date: "2024-03-01", contestability_months: 24 }, as: PolicyAdministrator, captures: { pol: $.data.id, pol_v: $.data.version } }
            - { call: "POST /policies/${pol}/beneficiary-designations", payload: { beneficiary_name: "Alice Roe", beneficiary_type: "PRIMARY", share_percent: 100, effective_date: "2024-03-01", expected_policy_version: "${pol_v}" }, as: PolicyAdministrator, captures: { des: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-05T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /claims", payload: { policy_id: "${pol}", date_of_death: "2026-03-01" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { cl: $.data.id } }
            - { call: "POST /claims/${cl}/documents", payload: { doc_type: "CERTIFIED_DEATH_CERTIFICATE" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { doc: $.data.id } }
            - { call: "POST /claims/${cl}/documents/${doc}/review", payload: { review_result: "VERIFIED" }, as: ClaimsExaminer, as_user_id: "examiner-2" }
            - { call: "POST /claims/${cl}/begin-review", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
            - { call: "POST /claims/${cl}/beneficiary-claims", payload: { designation_id: "${des}", claimant_name: "Alice Roe", claimant_type: "NAMED_BENEFICIARY" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { bc: $.data.id } }
            - { call: "POST /beneficiary-claims/${bc}/validate", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
            - { call: "POST /claims/${cl}/approve", payload: {}, as: ClaimsApprover, as_user_id: "approver-1", captures: { cl_v: $.data.version } }
            - { call: "POST /beneficiary-claims/${bc}/elections", payload: { option: "RETAINED_ASSET_ACCOUNT", expected_claim_version: "${cl_v}" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { el: $.data.id } }
            - { call: "POST /payout-elections/${el}/confirm", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /claims/${cl}/execute-payment", payload: {}, as: ClaimsApprover, as_user_id: "approver-1" }
            - { call: "GET /retained-asset-accounts", payload: { claim_id: "${cl}" }, as: ClaimsApprover, captures: { acct: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "GET /retained-asset-accounts/${acct}", payload: {}, as: ClaimsApprover, captures: { prov: $.data.provisional_interest_cents } }
            - { call: "POST /retained-asset-accounts/${acct}/withdrawals", payload: { amount_cents: 10000000 }, as: ClaimsApprover, as_user_id: "approver-1", captures: { fin: $.data.interest_paid_cents, st: $.data.status } }
          assert:
            - "GET before closure: RetainedAssetAccount.${acct}.provisional_interest_cents == 74795  (simple: 10000000 x 3% x 91/365)"
            - "Full withdrawal response: status == CLOSED, balance_cents == 0, interest_paid_cents == 75188  (compound: 10000000 x ((1+0.03/12)^3 - 1) = 75187.66)"
            - "provisional_interest_cents (74795) != interest_paid_cents (75188) for the same balance at the same date"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (mode (b) nested rounding vs mode (a) weighted branch)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: allocation_per_beneficiary_rounding_then_remainder
        grounds:
          - calculations.beneficiary_allocation
          - entities.BeneficiaryClaim.fields.allocated_amount_cents
        distinguishing_aspect: |
          Mode (b) nested-rounding: shares 33.33/33.33/33.34 of total 999999 are
          EACH rounded half-up first (333300/333300/333400, sum 1000000), then the
          -1 remainder is assigned to the largest share holder, yielding
          333300/333300/333399 — 'sum then round' would give a different cent
          distribution. The scaffold pins per-beneficiary-round-first ordering.
        test_recipe:
          setup:
            - "TX statute (grace 365 => zero interest); policy face 999999 cents, issue 2024-03-01"
            - "Three PRIMARY designations all effective 2024-03-01: A 33.33, B 33.33, C 33.34 (sum exactly 100)"
            - "Claim (death 2026-03-01, non-contestable), certified doc VERIFIED, three beneficiary claims validated; approve on 2026-03-05 keeps interest at 0 so total_payable_cents == 999999"
          setup_api_calls:
            - { call: "POST /state-statutes", payload: { state_code: "TX", annual_interest_rate_bp: 1200, interest_basis: "DATE_OF_DEATH", grace_days: 365, payment_deadline_days: 30, dormancy_years: 3, raa_minimum_cents: 100000, raa_annual_interest_rate_bp: 300 }, as: ComplianceOfficer }
            - { call: "POST /policies", payload: { policy_number: "P-TX-2", insured_name: "Sam Poe", insured_dob: "1950-01-01", state_code: "TX", face_amount_cents: 999999, issue_date: "2024-03-01", contestability_months: 24 }, as: PolicyAdministrator, captures: { pol: $.data.id, pol_v: $.data.version } }
            - { call: "POST /policies/${pol}/beneficiary-designations", payload: { beneficiary_name: "Ann Poe", beneficiary_type: "PRIMARY", share_percent: 33.33, effective_date: "2024-03-01", expected_policy_version: "${pol_v}" }, as: PolicyAdministrator, captures: { des_a: $.data.id } }
            - { call: "GET /policies/${pol}", payload: {}, as: PolicyAdministrator, captures: { pol_v2: $.data.version } }
            - { call: "POST /policies/${pol}/beneficiary-designations", payload: { beneficiary_name: "Ben Poe", beneficiary_type: "PRIMARY", share_percent: 33.33, effective_date: "2024-03-01", expected_policy_version: "${pol_v2}" }, as: PolicyAdministrator, captures: { des_b: $.data.id } }
            - { call: "GET /policies/${pol}", payload: {}, as: PolicyAdministrator, captures: { pol_v3: $.data.version } }
            - { call: "POST /policies/${pol}/beneficiary-designations", payload: { beneficiary_name: "Cat Poe", beneficiary_type: "PRIMARY", share_percent: 33.34, effective_date: "2024-03-01", expected_policy_version: "${pol_v3}" }, as: PolicyAdministrator, captures: { des_c: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-05T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /claims", payload: { policy_id: "${pol}", date_of_death: "2026-03-01" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { cl: $.data.id } }
            - { call: "POST /claims/${cl}/documents", payload: { doc_type: "CERTIFIED_DEATH_CERTIFICATE" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { doc: $.data.id } }
            - { call: "POST /claims/${cl}/documents/${doc}/review", payload: { review_result: "VERIFIED" }, as: ClaimsExaminer, as_user_id: "examiner-2" }
            - { call: "POST /claims/${cl}/begin-review", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
            - { call: "POST /claims/${cl}/beneficiary-claims", payload: { designation_id: "${des_a}", claimant_name: "Ann Poe", claimant_type: "NAMED_BENEFICIARY" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { bc_a: $.data.id } }
            - { call: "POST /claims/${cl}/beneficiary-claims", payload: { designation_id: "${des_b}", claimant_name: "Ben Poe", claimant_type: "NAMED_BENEFICIARY" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { bc_b: $.data.id } }
            - { call: "POST /claims/${cl}/beneficiary-claims", payload: { designation_id: "${des_c}", claimant_name: "Cat Poe", claimant_type: "NAMED_BENEFICIARY" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { bc_c: $.data.id } }
            - { call: "POST /beneficiary-claims/${bc_a}/validate", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
            - { call: "POST /beneficiary-claims/${bc_b}/validate", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
            - { call: "POST /beneficiary-claims/${bc_c}/validate", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
          trigger:
            - { call: "POST /claims/${cl}/approve", payload: {}, as: ClaimsApprover, as_user_id: "approver-1", captures: { tot: $.data.total_payable_cents } }
            - { call: "GET /claims/${cl}/beneficiary-claims", payload: {}, as: ClaimsApprover, captures: { a_amt: "$.data[0].allocated_amount_cents", b_amt: "$.data[1].allocated_amount_cents", c_amt: "$.data[2].allocated_amount_cents" } }
          assert:
            - "Claim.${cl}.total_payable_cents == 999999 (TX grace 365 => interest 0)"
            - "BeneficiaryClaim list ordered created_at ASC => [A, B, C]: allocated_amount_cents == 333300, 333300, 333399"
            - "333300 + 333300 + 333399 == 999999 (remainder -1 absorbed by largest-share holder C: round(999999*33.34%)=333400 then -1)"
            - "All three BeneficiaryClaims are PAYABLE"

      - name: dmf_match_score_weighted_inputs_and_ssn_shortcircuit
        grounds:
          - calculations.dmf_match_score
          - entities.DeathMasterMatch.fields.match_score
          - state_machines.DeathMasterMatch.PENDING_REVIEW_to_CONFIRMED
        distinguishing_aspect: |
          Mode (a) multi-input conditional formula: 4 weighted equality inputs with
          an SSN exact-match short-circuit branch. SSN match pins 100 regardless of
          other fields; name+dob+zip (45+25+15) lands exactly on the >= 85
          auto-confirm threshold; name+dob alone (70) falls to manual review.
        test_recipe:
          setup:
            - "IL statute; three policies with identical insured data (name Jane Doe, dob 1960-01-01, ssn_last4 1234, zip 60601), issue 2024-03-01"
            - "Clock at 2026-06-01"
          setup_api_calls:
            - { call: "POST /state-statutes", payload: { state_code: "IL", annual_interest_rate_bp: 1000, interest_basis: "DATE_OF_DEATH", grace_days: 30, payment_deadline_days: 30, dormancy_years: 3, raa_minimum_cents: 100000, raa_annual_interest_rate_bp: 300 }, as: ComplianceOfficer }
            - { call: "POST /policies", payload: { policy_number: "P-DMF-1", insured_name: "Jane Doe", insured_dob: "1960-01-01", insured_ssn_last4: "1234", insured_zip: "60601", state_code: "IL", face_amount_cents: 5000000, issue_date: "2024-03-01" }, as: PolicyAdministrator, captures: { p1: $.data.id } }
            - { call: "POST /policies", payload: { policy_number: "P-DMF-2", insured_name: "Jane Doe", insured_dob: "1960-01-01", insured_ssn_last4: "1234", insured_zip: "60601", state_code: "IL", face_amount_cents: 5000000, issue_date: "2024-03-01" }, as: PolicyAdministrator, captures: { p2: $.data.id } }
            - { call: "POST /policies", payload: { policy_number: "P-DMF-3", insured_name: "Jane Doe", insured_dob: "1960-01-01", insured_ssn_last4: "1234", insured_zip: "60601", state_code: "IL", face_amount_cents: 5000000, issue_date: "2024-03-01" }, as: PolicyAdministrator, captures: { p3: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /policies/${p1}/death-master-matches", payload: { deceased_name: "John Smith", deceased_dob: "1941-02-03", deceased_death_date: "2026-05-20", deceased_ssn_last4: "1234" }, as: ComplianceOfficer, captures: { m1_score: $.data.match_score, m1_status: $.data.status, m1_claim: $.data.generated_claim_id } }
            - { call: "POST /policies/${p2}/death-master-matches", payload: { deceased_name: "Jane Doe", deceased_dob: "1960-01-01", deceased_death_date: "2026-05-20", deceased_zip: "60601" }, as: ComplianceOfficer, captures: { m2_score: $.data.match_score, m2_status: $.data.status, m2_claim: $.data.generated_claim_id } }
            - { call: "POST /policies/${p3}/death-master-matches", payload: { deceased_name: "Jane Doe", deceased_dob: "1960-01-01", deceased_death_date: "2026-05-20" }, as: ComplianceOfficer, captures: { m3: $.data.id, m3_score: $.data.match_score, m3_status: $.data.status } }
            - { call: "POST /death-master-matches/${m3}/review", payload: { review_outcome: "CONFIRMED" }, as: ComplianceOfficer, captures: { m3_claim: $.data.generated_claim_id } }
          assert:
            - "Match1 (SSN short-circuit): match_score == 100, status == CONFIRMED, generated_claim_id != null"
            - "Match2 (45+25+15 = 85, boundary >=): match_score == 85, status == CONFIRMED without manual review, generated_claim_id != null"
            - "Match3 (45+25 = 70): match_score == 70, status == PENDING_REVIEW until manual CONFIRMED"
            - "After review: Match3.generated_claim_id != null and the generated Claim has date_of_death == '2026-05-20', status NOTIFIED"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (BeneficiaryClaim cycle vs Claim branching fork)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: beneficiary_claim_dispute_cycle
        grounds:
          - state_machines.BeneficiaryClaim.SUBMITTED_to_VALIDATED
          - state_machines.BeneficiaryClaim.VALIDATED_to_DISPUTED
          - state_machines.BeneficiaryClaim.DISPUTED_to_VALIDATED
          - state_machines.BeneficiaryClaim.SUBMITTED_to_WITHDRAWN
        distinguishing_aspect: |
          Cyclic machine on BeneficiaryClaim: SUBMITTED -> VALIDATED -> DISPUTED
          (rival filing) -> VALIDATED (re-validation after rival WITHDRAWN). The
          loop re-enters VALIDATED — not a terminal pipeline. Entity:
          BeneficiaryClaim (distinct from the Claim instance below).
        test_recipe:
          setup:
            - "IL statute; policy face 5000000, designation Alice PRIMARY 100% effective 2024-03-01"
            - "Claim (death 2026-03-01, non-contestable) with certified doc VERIFIED; begin-review -> UNDER_REVIEW"
          setup_api_calls:
            - { call: "POST /state-statutes", payload: { state_code: "IL", annual_interest_rate_bp: 1000, interest_basis: "DATE_OF_DEATH", grace_days: 30, payment_deadline_days: 30, dormancy_years: 3, raa_minimum_cents: 100000, raa_annual_interest_rate_bp: 300 }, as: ComplianceOfficer }
            - { call: "POST /policies", payload: { policy_number: "P-CYC-1", insured_name: "Amy Doe", insured_dob: "1970-07-07", state_code: "IL", face_amount_cents: 5000000, issue_date: "2024-03-01" }, as: PolicyAdministrator, captures: { pol: $.data.id, pol_v: $.data.version } }
            - { call: "POST /policies/${pol}/beneficiary-designations", payload: { beneficiary_name: "Alice Doe", beneficiary_type: "PRIMARY", share_percent: 100, effective_date: "2024-03-01", expected_policy_version: "${pol_v}" }, as: PolicyAdministrator, captures: { des: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-05T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /claims", payload: { policy_id: "${pol}", date_of_death: "2026-03-01" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { cl: $.data.id } }
            - { call: "POST /claims/${cl}/documents", payload: { doc_type: "CERTIFIED_DEATH_CERTIFICATE" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { doc: $.data.id } }
            - { call: "POST /claims/${cl}/documents/${doc}/review", payload: { review_result: "VERIFIED" }, as: ClaimsExaminer, as_user_id: "examiner-2" }
            - { call: "POST /claims/${cl}/begin-review", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
            - { call: "POST /claims/${cl}/beneficiary-claims", payload: { designation_id: "${des}", claimant_name: "Alice Doe", claimant_type: "NAMED_BENEFICIARY" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { bc: $.data.id } }
            - { call: "POST /beneficiary-claims/${bc}/validate", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
            - { call: "POST /claims/${cl}/beneficiary-claims", payload: { designation_id: "${des}", claimant_name: "Eve Smith", claimant_type: "NAMED_BENEFICIARY" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { bc_eve: $.data.id, bc_eve_status: $.data.status } }
            - { call: "POST /beneficiary-claims/${bc_eve}/withdraw", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
          trigger:
            - { call: "POST /beneficiary-claims/${bc}/validate", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { bc_status: $.data.status } }
            - { call: "GET /claims/${cl}", payload: {}, as: ClaimsExaminer, captures: { cl_status: $.data.status } }
          assert:
            - "Rival filing left Eve's claim SUBMITTED and flipped Alice's to DISPUTED (cascade link verified in rival_beneficiary_filing_cascade)"
            - "After withdraw + re-validate: BeneficiaryClaim.${bc}.status == VALIDATED (cycle re-entry)"
            - "Claim.${cl}.status == UNDER_REVIEW (LEGAL_HOLD released via hold_return_state)"

      - name: claim_contestability_fork_and_interpleader_branch
        grounds:
          - state_machines.Claim.NOTIFIED_to_UNDER_REVIEW
          - state_machines.Claim.NOTIFIED_to_CONTESTABILITY_REVIEW
          - state_machines.Claim.LEGAL_HOLD_to_INTERPLEADED
        distinguishing_aspect: |
          Branching machine on Claim: the same trigger (begin-review) forks on the
          computed contestability_flag into CONTESTABILITY_REVIEW vs UNDER_REVIEW,
          and the LEGAL_HOLD branch exits via interpleader with a divergent
          side-effect set (interest freeze, DISPUTED -> INTERPLEADED, elections
          SUPERSEDED) unlike the approve branch. Entity: Claim.
        test_recipe:
          setup:
            - "IL statute; policyA/policyB issue 2024-03-01 contestability 24; clock 2026-03-05"
            - "ClaimA death 2026-02-28 (inside window), ClaimB death 2026-03-01 (boundary, outside); ClaimB has validated Alice claim + rival Eve filing -> LEGAL_HOLD"
          setup_api_calls:
            - { call: "POST /state-statutes", payload: { state_code: "IL", annual_interest_rate_bp: 1000, interest_basis: "DATE_OF_DEATH", grace_days: 30, payment_deadline_days: 30, dormancy_years: 3, raa_minimum_cents: 100000, raa_annual_interest_rate_bp: 300 }, as: ComplianceOfficer }
            - { call: "POST /policies", payload: { policy_number: "P-BR-A", insured_name: "Amy Doe", insured_dob: "1970-07-07", state_code: "IL", face_amount_cents: 5000000, issue_date: "2024-03-01", contestability_months: 24 }, as: PolicyAdministrator, captures: { pa: $.data.id, pa_v: $.data.version } }
            - { call: "POST /policies", payload: { policy_number: "P-BR-B", insured_name: "Bob Doe", insured_dob: "1971-08-08", state_code: "IL", face_amount_cents: 5000000, issue_date: "2024-03-01", contestability_months: 24 }, as: PolicyAdministrator, captures: { pb: $.data.id, pb_v: $.data.version } }
            - { call: "POST /policies/${pb}/beneficiary-designations", payload: { beneficiary_name: "Alice Doe", beneficiary_type: "PRIMARY", share_percent: 100, effective_date: "2024-03-01", expected_policy_version: "${pb_v}" }, as: PolicyAdministrator, captures: { des_b: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-05T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /claims", payload: { policy_id: "${pa}", date_of_death: "2026-02-28" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { cl_a: $.data.id, flag_a: $.data.contestability_flag } }
            - { call: "POST /claims", payload: { policy_id: "${pb}", date_of_death: "2026-03-01" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { cl_b: $.data.id, flag_b: $.data.contestability_flag } }
            - { call: "POST /claims/${cl_a}/begin-review", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { cl_a_status: $.data.status } }
            - { call: "POST /claims/${cl_b}/begin-review", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { cl_b_status: $.data.status } }
            - { call: "POST /claims/${cl_b}/beneficiary-claims", payload: { designation_id: "${des_b}", claimant_name: "Alice Doe", claimant_type: "NAMED_BENEFICIARY" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { bc_b: $.data.id } }
            - { call: "POST /beneficiary-claims/${bc_b}/validate", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
            - { call: "POST /claims/${cl_b}/beneficiary-claims", payload: { designation_id: "${des_b}", claimant_name: "Eve Smith", claimant_type: "NAMED_BENEFICIARY" }, as: ClaimsExaminer, as_user_id: "examiner-1" }
          trigger:
            - { call: "POST /claims/${cl_b}/refer-interpleader", payload: { court_reference: "2026-CV-0042" }, as: LegalCounsel, captures: { cl_b_final: $.data.status } }
            - { call: "GET /beneficiary-claims/${bc_b}", payload: {}, as: LegalCounsel, captures: { bc_b_final: $.data.status } }
          assert:
            - "flag_a == true and ClaimA after begin-review == CONTESTABILITY_REVIEW (fork branch 1)"
            - "flag_b == false and ClaimB after begin-review == UNDER_REVIEW (fork branch 2)"
            - "Rival filing moved ClaimB UNDER_REVIEW -> LEGAL_HOLD with hold_return_state UNDER_REVIEW"
            - "After refer-interpleader: ClaimB.status == INTERPLEADED, court_reference == '2026-CV-0042'"
            - "BeneficiaryClaim.${bc_b}.status == INTERPLEADED (branch-specific cascade, absent on approve branch)"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (rival-filing cascade depth 3 vs execute-payment depth 3)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: rival_beneficiary_filing_cascade
        grounds:
          - state_machines.BeneficiaryClaim.PAYABLE_to_DISPUTED
          - state_machines.Claim.APPROVED_to_LEGAL_HOLD
          - state_machines.PayoutElection.CONFIRMED_to_SUSPENDED
        distinguishing_aspect: |
          Depth-3 cascade from POST /claims/{id}/beneficiary-claims: rival filing
          mutates the incumbent BeneficiaryClaim to DISPUTED (link 1); that
          mutation drives Claim APPROVED -> LEGAL_HOLD (link 2); the hold mutation
          suspends the incumbent's CONFIRMED PayoutElection (link 3). Each link is
          caused by the previous link, not by the original POST.
        test_recipe:
          setup:
            - "IL statute; policy face 25000000 issue 2024-03-01; designations Alice PRIMARY 60% and Bob PRIMARY 40%, both effective 2024-03-01"
            - "Claim (death 2026-03-01) with certified doc VERIFIED; both beneficiary claims VALIDATED; approved 2026-04-10 (interest 68493, total 25068493; Alice allocated 15041096, Bob 10027397)"
            - "Alice's election LUMP_SUM created and CONFIRMED before the rival filing"
          setup_api_calls:
            - { call: "POST /state-statutes", payload: { state_code: "IL", annual_interest_rate_bp: 1000, interest_basis: "DATE_OF_DEATH", grace_days: 30, payment_deadline_days: 30, dormancy_years: 3, raa_minimum_cents: 100000, raa_annual_interest_rate_bp: 300 }, as: ComplianceOfficer }
            - { call: "POST /policies", payload: { policy_number: "P-CAS-1", insured_name: "Amy Doe", insured_dob: "1970-07-07", state_code: "IL", face_amount_cents: 25000000, issue_date: "2024-03-01" }, as: PolicyAdministrator, captures: { pol: $.data.id, pol_v: $.data.version } }
            - { call: "POST /policies/${pol}/beneficiary-designations", payload: { beneficiary_name: "Alice Doe", beneficiary_type: "PRIMARY", share_percent: 60, effective_date: "2024-03-01", expected_policy_version: "${pol_v}" }, as: PolicyAdministrator, captures: { des_a: $.data.id } }
            - { call: "GET /policies/${pol}", payload: {}, as: PolicyAdministrator, captures: { pol_v2: $.data.version } }
            - { call: "POST /policies/${pol}/beneficiary-designations", payload: { beneficiary_name: "Bob Doe", beneficiary_type: "PRIMARY", share_percent: 40, effective_date: "2024-03-01", expected_policy_version: "${pol_v2}" }, as: PolicyAdministrator, captures: { des_b: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-05T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /claims", payload: { policy_id: "${pol}", date_of_death: "2026-03-01" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { cl: $.data.id } }
            - { call: "POST /claims/${cl}/documents", payload: { doc_type: "CERTIFIED_DEATH_CERTIFICATE" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { doc: $.data.id } }
            - { call: "POST /claims/${cl}/documents/${doc}/review", payload: { review_result: "VERIFIED" }, as: ClaimsExaminer, as_user_id: "examiner-2" }
            - { call: "POST /claims/${cl}/begin-review", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
            - { call: "POST /claims/${cl}/beneficiary-claims", payload: { designation_id: "${des_a}", claimant_name: "Alice Doe", claimant_type: "NAMED_BENEFICIARY" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { bc_a: $.data.id } }
            - { call: "POST /claims/${cl}/beneficiary-claims", payload: { designation_id: "${des_b}", claimant_name: "Bob Doe", claimant_type: "NAMED_BENEFICIARY" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { bc_b: $.data.id } }
            - { call: "POST /beneficiary-claims/${bc_a}/validate", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
            - { call: "POST /beneficiary-claims/${bc_b}/validate", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-10T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /claims/${cl}/approve", payload: {}, as: ClaimsApprover, as_user_id: "approver-1", captures: { cl_v: $.data.version } }
            - { call: "POST /beneficiary-claims/${bc_a}/elections", payload: { option: "LUMP_SUM", expected_claim_version: "${cl_v}" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { el: $.data.id } }
            - { call: "POST /payout-elections/${el}/confirm", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
          trigger:
            - { call: "POST /claims/${cl}/beneficiary-claims", payload: { designation_id: "${des_a}", claimant_name: "Eve Smith", claimant_type: "NAMED_BENEFICIARY" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { bc_eve_status: $.data.status } }
            - { call: "GET /beneficiary-claims/${bc_a}", payload: {}, as: ClaimsExaminer, captures: { bc_a_status: $.data.status } }
            - { call: "GET /claims/${cl}", payload: {}, as: ClaimsExaminer, captures: { cl_status: $.data.status, cl_ret: $.data.hold_return_state, cl_total: $.data.total_payable_cents } }
            - { call: "GET /beneficiary-claims/${bc_a}/elections", payload: {}, as: ClaimsExaminer, captures: { el_status: "$.data[0].status" } }
          assert:
            - "Link 1: incumbent BeneficiaryClaim.${bc_a}.status == DISPUTED; rival filing itself stays SUBMITTED"
            - "Link 2: Claim.${cl}.status == LEGAL_HOLD and hold_return_state == APPROVED"
            - "Link 3: PayoutElection.${el}.status == SUSPENDED (was CONFIRMED)"
            - "Claim.${cl}.total_payable_cents == 25068493 (unchanged by the dispute cascade)"

      - name: execute_payment_raa_cascade
        grounds:
          - state_machines.BeneficiaryClaim.PAYABLE_to_PAID
          - entities.RetainedAssetAccount
          - state_machines.Claim.APPROVED_to_PAID
        distinguishing_aspect: |
          Depth-3 cascade from POST /claims/{id}/execute-payment (different trigger
          than rival filing): payment flips the BeneficiaryClaim PAYABLE -> PAID
          (link 1); that flip creates the RetainedAssetAccount OPEN with
          deposited=paid (link 2); the last PAYABLE reaching PAID bubbles the Claim
          to PAID with paid_at set (link 3).
        test_recipe:
          setup:
            - "TX statute (grace 365 => interest 0); policy face 10000000, Alice PRIMARY 100%"
            - "Claim approved 2026-03-05 (total 10000000, allocated 10000000); RAA election CONFIRMED; clock moved to 2026-04-01"
          setup_api_calls:
            - { call: "POST /state-statutes", payload: { state_code: "TX", annual_interest_rate_bp: 1200, interest_basis: "DATE_OF_DEATH", grace_days: 365, payment_deadline_days: 30, dormancy_years: 3, raa_minimum_cents: 100000, raa_annual_interest_rate_bp: 300 }, as: ComplianceOfficer }
            - { call: "POST /policies", payload: { policy_number: "P-CAS-2", insured_name: "John Roe", insured_dob: "1955-05-05", state_code: "TX", face_amount_cents: 10000000, issue_date: "2024-03-01" }, as: PolicyAdministrator, captures: { pol: $.data.id, pol_v: $.data.version } }
            - { call: "POST /policies/${pol}/beneficiary-designations", payload: { beneficiary_name: "Alice Roe", beneficiary_type: "PRIMARY", share_percent: 100, effective_date: "2024-03-01", expected_policy_version: "${pol_v}" }, as: PolicyAdministrator, captures: { des: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-05T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /claims", payload: { policy_id: "${pol}", date_of_death: "2026-03-01" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { cl: $.data.id } }
            - { call: "POST /claims/${cl}/documents", payload: { doc_type: "CERTIFIED_DEATH_CERTIFICATE" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { doc: $.data.id } }
            - { call: "POST /claims/${cl}/documents/${doc}/review", payload: { review_result: "VERIFIED" }, as: ClaimsExaminer, as_user_id: "examiner-2" }
            - { call: "POST /claims/${cl}/begin-review", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
            - { call: "POST /claims/${cl}/beneficiary-claims", payload: { designation_id: "${des}", claimant_name: "Alice Roe", claimant_type: "NAMED_BENEFICIARY" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { bc: $.data.id } }
            - { call: "POST /beneficiary-claims/${bc}/validate", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
            - { call: "POST /claims/${cl}/approve", payload: {}, as: ClaimsApprover, as_user_id: "approver-1", captures: { cl_v: $.data.version } }
            - { call: "POST /beneficiary-claims/${bc}/elections", payload: { option: "RETAINED_ASSET_ACCOUNT", expected_claim_version: "${cl_v}" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { el: $.data.id } }
            - { call: "POST /payout-elections/${el}/confirm", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-01T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /claims/${cl}/execute-payment", payload: {}, as: ClaimsApprover, as_user_id: "approver-1", captures: { cl_status: $.data.status, cl_paid_at: $.data.paid_at } }
            - { call: "GET /beneficiary-claims/${bc}", payload: {}, as: ClaimsApprover, captures: { bc_status: $.data.status, bc_paid: $.data.paid_amount_cents } }
            - { call: "GET /retained-asset-accounts", payload: { claim_id: "${cl}" }, as: ClaimsApprover, captures: { acct_status: "$.data[0].status", acct_balance: "$.data[0].balance_cents", acct_deposited: "$.data[0].deposited_cents" } }
          assert:
            - "Link 1: BeneficiaryClaim.${bc}.status == PAID and paid_amount_cents == 10000000"
            - "Link 2: exactly one RetainedAssetAccount exists for the claim: status OPEN, deposited_cents == 10000000, balance_cents == 10000000, last_activity_at == 2026-04-01"
            - "Link 3: Claim.${cl}.status == PAID with paid_at == 2026-04-01 (bubble-up: sum(paid) == total_payable_cents == 10000000)"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (state-vs-safety vs temporal-vs-fiscal)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: approve_state_error_beats_segregation_of_duties
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_CLAIM_NOT_UNDER_REVIEW]
          - errors[ERR_SEGREGATION_OF_DUTIES_VIOLATION]
        distinguishing_aspect: |
          Category pair state(p6) vs business_safety(p7): the approve call on a
          DENIED claim is issued by the assigned examiner's user id, violating both
          the from-state rule and segregation-of-duties; the state error
          ERR_CLAIM_NOT_UNDER_REVIEW must win because p6 < p7.
        test_recipe:
          setup:
            - "IL statute; policy; claim filed by examiner-1 with certified doc VERIFIED; claim denied by approver-1 -> DENIED"
          setup_api_calls:
            - { call: "POST /state-statutes", payload: { state_code: "IL", annual_interest_rate_bp: 1000, interest_basis: "DATE_OF_DEATH", grace_days: 30, payment_deadline_days: 30, dormancy_years: 3, raa_minimum_cents: 100000, raa_annual_interest_rate_bp: 300 }, as: ComplianceOfficer }
            - { call: "POST /policies", payload: { policy_number: "P-PRI-1", insured_name: "Amy Doe", insured_dob: "1970-07-07", state_code: "IL", face_amount_cents: 5000000, issue_date: "2024-03-01" }, as: PolicyAdministrator, captures: { pol: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-05T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /claims", payload: { policy_id: "${pol}", date_of_death: "2026-03-01" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { cl: $.data.id } }
            - { call: "POST /claims/${cl}/documents", payload: { doc_type: "CERTIFIED_DEATH_CERTIFICATE" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { doc: $.data.id } }
            - { call: "POST /claims/${cl}/documents/${doc}/review", payload: { review_result: "VERIFIED" }, as: ClaimsExaminer, as_user_id: "examiner-2" }
            - { call: "POST /claims/${cl}/begin-review", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
            - { call: "POST /claims/${cl}/deny", payload: { denial_reason: "LAPSED_COVERAGE" }, as: ClaimsApprover, as_user_id: "approver-1" }
          trigger:
            - { call: "POST /claims/${cl}/approve", payload: {}, as: ClaimsApprover, as_user_id: "examiner-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CLAIM_NOT_UNDER_REVIEW (state p6), NOT ERR_SEGREGATION_OF_DUTIES_VIOLATION (safety p7) — even though the caller's X-User-ID equals assigned_examiner_id"
            - "http status == 409"
            - "Claim.${cl}.status remains DENIED"

      - name: election_window_closed_beats_raa_minimum
        grounds:
          - validations[priority=9]
          - validations[priority=12]
          - errors[ERR_ELECTION_WINDOW_CLOSED]
          - errors[ERR_BELOW_RAA_MINIMUM]
        distinguishing_aspect: |
          Category pair business_temporal(p9) vs business_fiscal(p12): an RAA
          election made after the 30-day window whose allocated amount (50000) is
          also below the statute minimum (100000) violates both rules; the temporal
          error ERR_ELECTION_WINDOW_CLOSED must win because p9 < p12. Distinct
          category pair from the state-vs-safety instance.
        test_recipe:
          setup:
            - "TX statute (grace 365 => interest 0; raa_minimum 100000); policy face 50000 cents; Alice PRIMARY 100%"
            - "Claim approved 2026-03-05 (allocated 50000 < 100000); clock advanced to 2026-04-05 (> approved_at + 30 days = 2026-04-04)"
          setup_api_calls:
            - { call: "POST /state-statutes", payload: { state_code: "TX", annual_interest_rate_bp: 1200, interest_basis: "DATE_OF_DEATH", grace_days: 365, payment_deadline_days: 30, dormancy_years: 3, raa_minimum_cents: 100000, raa_annual_interest_rate_bp: 300 }, as: ComplianceOfficer }
            - { call: "POST /policies", payload: { policy_number: "P-PRI-2", insured_name: "Jim Poe", insured_dob: "1965-02-02", state_code: "TX", face_amount_cents: 50000, issue_date: "2024-03-01" }, as: PolicyAdministrator, captures: { pol: $.data.id, pol_v: $.data.version } }
            - { call: "POST /policies/${pol}/beneficiary-designations", payload: { beneficiary_name: "Alice Poe", beneficiary_type: "PRIMARY", share_percent: 100, effective_date: "2024-03-01", expected_policy_version: "${pol_v}" }, as: PolicyAdministrator, captures: { des: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-05T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /claims", payload: { policy_id: "${pol}", date_of_death: "2026-03-01" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { cl: $.data.id } }
            - { call: "POST /claims/${cl}/documents", payload: { doc_type: "CERTIFIED_DEATH_CERTIFICATE" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { doc: $.data.id } }
            - { call: "POST /claims/${cl}/documents/${doc}/review", payload: { review_result: "VERIFIED" }, as: ClaimsExaminer, as_user_id: "examiner-2" }
            - { call: "POST /claims/${cl}/begin-review", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
            - { call: "POST /claims/${cl}/beneficiary-claims", payload: { designation_id: "${des}", claimant_name: "Alice Poe", claimant_type: "NAMED_BENEFICIARY" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { bc: $.data.id } }
            - { call: "POST /beneficiary-claims/${bc}/validate", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
            - { call: "POST /claims/${cl}/approve", payload: {}, as: ClaimsApprover, as_user_id: "approver-1", captures: { cl_v: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-05T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /beneficiary-claims/${bc}/elections", payload: { option: "RETAINED_ASSET_ACCOUNT", expected_claim_version: "${cl_v}" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ELECTION_WINDOW_CLOSED (temporal p9), NOT ERR_BELOW_RAA_MINIMUM (fiscal p12)"
            - "http status == 409"
            - "No PayoutElection exists for BeneficiaryClaim.${bc} (list is empty)"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (months metric on POST /claims vs days metric on execute-payment)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: contestability_exactly_24_months_is_not_contestable
        grounds:
          - calculations.contestability_flag
          - entities.Claim.fields.contestability_flag
          - state_machines.Claim.NOTIFIED_to_CONTESTABILITY_REVIEW
        distinguishing_aspect: |
          Metric: calendar months. Death strictly before issue_date+24mo is
          contestable; death exactly ON the boundary date (2024-03-01 + 24mo =
          2026-03-01) is NOT (strict <). Reachable via POST /claims +
          begin-review routing.
        test_recipe:
          setup:
            - "IL statute; two policies both issued 2024-03-01 with contestability_months 24; clock 2026-03-05"
          setup_api_calls:
            - { call: "POST /state-statutes", payload: { state_code: "IL", annual_interest_rate_bp: 1000, interest_basis: "DATE_OF_DEATH", grace_days: 30, payment_deadline_days: 30, dormancy_years: 3, raa_minimum_cents: 100000, raa_annual_interest_rate_bp: 300 }, as: ComplianceOfficer }
            - { call: "POST /policies", payload: { policy_number: "P-BND-A", insured_name: "Amy Doe", insured_dob: "1970-07-07", state_code: "IL", face_amount_cents: 5000000, issue_date: "2024-03-01", contestability_months: 24 }, as: PolicyAdministrator, captures: { pa: $.data.id } }
            - { call: "POST /policies", payload: { policy_number: "P-BND-B", insured_name: "Bob Doe", insured_dob: "1971-08-08", state_code: "IL", face_amount_cents: 5000000, issue_date: "2024-03-01", contestability_months: 24 }, as: PolicyAdministrator, captures: { pb: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-05T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /claims", payload: { policy_id: "${pa}", date_of_death: "2026-02-28" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { cl_a: $.data.id, flag_a: $.data.contestability_flag } }
            - { call: "POST /claims", payload: { policy_id: "${pb}", date_of_death: "2026-03-01" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { cl_b: $.data.id, flag_b: $.data.contestability_flag } }
            - { call: "POST /claims/${cl_a}/begin-review", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { st_a: $.data.status } }
            - { call: "POST /claims/${cl_b}/begin-review", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { st_b: $.data.status } }
          assert:
            - "Claim A (death 2026-02-28, one day inside): contestability_flag == true; after begin-review status == CONTESTABILITY_REVIEW"
            - "Claim B (death 2026-03-01, exactly issue+24mo): contestability_flag == false; after begin-review status == UNDER_REVIEW"

      - name: interest_grace_day_exact_zero_vs_plus_one
        grounds:
          - calculations.statutory_interest
          - entities.Claim.fields.accrued_interest_cents
        distinguishing_aspect: |
          Metric: days elapsed vs grace_days (different metric than months in the
          contestability instance), reached through POST
          /claims/{id}/execute-payment (different endpoint). Payment at exactly
          grace_days elapsed (30) accrues 0; payment at 31 days accrues exactly
          one day (6849 cents).
        test_recipe:
          setup:
            - "IL statute (grace 30, basis DATE_OF_DEATH, 1000bp); two policies face 25000000 each with Alice PRIMARY 100%"
            - "Both claims (death 2026-03-01) fully validated and approved at clock 2026-03-31 (30 days elapsed -> provisional interest 0, allocated 25000000); LUMP_SUM elections CONFIRMED"
          setup_api_calls:
            - { call: "POST /state-statutes", payload: { state_code: "IL", annual_interest_rate_bp: 1000, interest_basis: "DATE_OF_DEATH", grace_days: 30, payment_deadline_days: 30, dormancy_years: 3, raa_minimum_cents: 100000, raa_annual_interest_rate_bp: 300 }, as: ComplianceOfficer }
            - { call: "POST /policies", payload: { policy_number: "P-GR-1", insured_name: "Amy Doe", insured_dob: "1970-07-07", state_code: "IL", face_amount_cents: 25000000, issue_date: "2024-03-01" }, as: PolicyAdministrator, captures: { p1: $.data.id, p1_v: $.data.version } }
            - { call: "POST /policies", payload: { policy_number: "P-GR-2", insured_name: "Bob Doe", insured_dob: "1971-08-08", state_code: "IL", face_amount_cents: 25000000, issue_date: "2024-03-01" }, as: PolicyAdministrator, captures: { p2: $.data.id, p2_v: $.data.version } }
            - { call: "POST /policies/${p1}/beneficiary-designations", payload: { beneficiary_name: "Alice Doe", beneficiary_type: "PRIMARY", share_percent: 100, effective_date: "2024-03-01", expected_policy_version: "${p1_v}" }, as: PolicyAdministrator, captures: { d1: $.data.id } }
            - { call: "POST /policies/${p2}/beneficiary-designations", payload: { beneficiary_name: "Alice Doe", beneficiary_type: "PRIMARY", share_percent: 100, effective_date: "2024-03-01", expected_policy_version: "${p2_v}" }, as: PolicyAdministrator, captures: { d2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-05T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /claims", payload: { policy_id: "${p1}", date_of_death: "2026-03-01" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { c1: $.data.id } }
            - { call: "POST /claims", payload: { policy_id: "${p2}", date_of_death: "2026-03-01" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { c2: $.data.id } }
            - { call: "POST /claims/${c1}/documents", payload: { doc_type: "CERTIFIED_DEATH_CERTIFICATE" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { doc1: $.data.id } }
            - { call: "POST /claims/${c2}/documents", payload: { doc_type: "CERTIFIED_DEATH_CERTIFICATE" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { doc2: $.data.id } }
            - { call: "POST /claims/${c1}/documents/${doc1}/review", payload: { review_result: "VERIFIED" }, as: ClaimsExaminer, as_user_id: "examiner-2" }
            - { call: "POST /claims/${c2}/documents/${doc2}/review", payload: { review_result: "VERIFIED" }, as: ClaimsExaminer, as_user_id: "examiner-2" }
            - { call: "POST /claims/${c1}/begin-review", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
            - { call: "POST /claims/${c2}/begin-review", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
            - { call: "POST /claims/${c1}/beneficiary-claims", payload: { designation_id: "${d1}", claimant_name: "Alice Doe", claimant_type: "NAMED_BENEFICIARY" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { bc1: $.data.id } }
            - { call: "POST /claims/${c2}/beneficiary-claims", payload: { designation_id: "${d2}", claimant_name: "Alice Doe", claimant_type: "NAMED_BENEFICIARY" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { bc2: $.data.id } }
            - { call: "POST /beneficiary-claims/${bc1}/validate", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
            - { call: "POST /beneficiary-claims/${bc2}/validate", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-31T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /claims/${c1}/approve", payload: {}, as: ClaimsApprover, as_user_id: "approver-1", captures: { c1_v: $.data.version } }
            - { call: "POST /claims/${c2}/approve", payload: {}, as: ClaimsApprover, as_user_id: "approver-1", captures: { c2_v: $.data.version } }
            - { call: "POST /beneficiary-claims/${bc1}/elections", payload: { option: "LUMP_SUM", expected_claim_version: "${c1_v}" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { e1: $.data.id } }
            - { call: "POST /beneficiary-claims/${bc2}/elections", payload: { option: "LUMP_SUM", expected_claim_version: "${c2_v}" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { e2: $.data.id } }
            - { call: "POST /payout-elections/${e1}/confirm", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
            - { call: "POST /payout-elections/${e2}/confirm", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
          trigger:
            - { call: "POST /claims/${c1}/execute-payment", payload: {}, as: ClaimsApprover, as_user_id: "approver-1", captures: { i1: $.data.accrued_interest_cents, t1: $.data.total_payable_cents } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /claims/${c2}/execute-payment", payload: {}, as: ClaimsApprover, as_user_id: "approver-1", captures: { i2: $.data.accrued_interest_cents, t2: $.data.total_payable_cents } }
            - { call: "GET /beneficiary-claims/${bc2}", payload: {}, as: ClaimsApprover, captures: { p2_paid: $.data.paid_amount_cents } }
          assert:
            - "Claim1 paid at exactly 30 days elapsed: accrued_interest_cents == 0, total_payable_cents == 25000000"
            - "Claim2 paid at 31 days elapsed: accrued_interest_cents == 6849 (1 day x 25000000 x 10% / 365 = 6849.32), total_payable_cents == 25006849"
            - "BeneficiaryClaim.${bc2}.paid_amount_cents == 25006849 (allocation re-run against refreshed total at execute-payment)"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (Claim<-DeathDocument vs BeneficiaryClaim<-Designation)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: approve_blocked_until_required_documents_verified
        grounds:
          - state_machines.Claim.UNDER_REVIEW_to_APPROVED
          - state_machines.DeathDocument.PENDING_to_VERIFIED
          - errors[ERR_REQUIRED_DOCS_INCOMPLETE]
        distinguishing_aspect: |
          Entity pair Claim <- DeathDocument: Claim's approve transition is gated
          on a DIFFERENT entity's state — every required DeathDocument must be
          VERIFIED. A PENDING certified certificate blocks approval with
          ERR_REQUIRED_DOCS_INCOMPLETE; verifying it unblocks approval.
        test_recipe:
          setup:
            - "IL statute; policy; claim (death 2026-03-01, non-contestable) in UNDER_REVIEW with one CERTIFIED_DEATH_CERTIFICATE still PENDING"
          setup_api_calls:
            - { call: "POST /state-statutes", payload: { state_code: "IL", annual_interest_rate_bp: 1000, interest_basis: "DATE_OF_DEATH", grace_days: 30, payment_deadline_days: 30, dormancy_years: 3, raa_minimum_cents: 100000, raa_annual_interest_rate_bp: 300 }, as: ComplianceOfficer }
            - { call: "POST /policies", payload: { policy_number: "P-XD-1", insured_name: "Amy Doe", insured_dob: "1970-07-07", state_code: "IL", face_amount_cents: 5000000, issue_date: "2024-03-01" }, as: PolicyAdministrator, captures: { pol: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-05T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /claims", payload: { policy_id: "${pol}", date_of_death: "2026-03-01" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { cl: $.data.id } }
            - { call: "POST /claims/${cl}/documents", payload: { doc_type: "CERTIFIED_DEATH_CERTIFICATE" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { doc: $.data.id } }
            - { call: "POST /claims/${cl}/begin-review", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
          trigger:
            - { call: "POST /claims/${cl}/approve", payload: {}, as: ClaimsApprover, as_user_id: "approver-1", captures: { err: $.data.error_id } }
            - { call: "POST /claims/${cl}/documents/${doc}/review", payload: { review_result: "VERIFIED" }, as: ClaimsExaminer, as_user_id: "examiner-2" }
            - { call: "POST /claims/${cl}/approve", payload: {}, as: ClaimsApprover, as_user_id: "approver-1", captures: { st: $.data.status } }
          assert:
            - "First approve: error_id == ERR_REQUIRED_DOCS_INCOMPLETE (409), claim stays UNDER_REVIEW"
            - "After the document is VERIFIED by a different examiner: approve succeeds, status == APPROVED"
            - "Claim.proof_complete_date == 2026-03-05 (set by the completing review)"

      - name: validate_blocked_when_designation_inactive_at_death
        grounds:
          - state_machines.BeneficiaryClaim.SUBMITTED_to_VALIDATED
          - entities.BeneficiaryDesignation.fields.effective_date
          - errors[ERR_DESIGNATION_NOT_ACTIVE_AT_DEATH]
        distinguishing_aspect: |
          Entity pair BeneficiaryClaim <- BeneficiaryDesignation (different pair
          than Claim <- DeathDocument): validation reads the designation's
          half-open active window evaluated at the CLAIM's date_of_death — a
          designation whose effective_date (2026-06-01) postdates the death
          (2026-03-01) blocks validation with ERR_DESIGNATION_NOT_ACTIVE_AT_DEATH.
        test_recipe:
          setup:
            - "IL statute; policy; designation effective 2026-06-01 (future relative to death); claim death 2026-03-01; beneficiary claim filed against that designation"
          setup_api_calls:
            - { call: "POST /state-statutes", payload: { state_code: "IL", annual_interest_rate_bp: 1000, interest_basis: "DATE_OF_DEATH", grace_days: 30, payment_deadline_days: 30, dormancy_years: 3, raa_minimum_cents: 100000, raa_annual_interest_rate_bp: 300 }, as: ComplianceOfficer }
            - { call: "POST /policies", payload: { policy_number: "P-XD-2", insured_name: "Amy Doe", insured_dob: "1970-07-07", state_code: "IL", face_amount_cents: 5000000, issue_date: "2024-03-01" }, as: PolicyAdministrator, captures: { pol: $.data.id, pol_v: $.data.version } }
            - { call: "POST /policies/${pol}/beneficiary-designations", payload: { beneficiary_name: "Late Larry", beneficiary_type: "PRIMARY", share_percent: 100, effective_date: "2026-06-01", expected_policy_version: "${pol_v}" }, as: PolicyAdministrator, captures: { des: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-05T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /claims", payload: { policy_id: "${pol}", date_of_death: "2026-03-01" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { cl: $.data.id } }
            - { call: "POST /claims/${cl}/beneficiary-claims", payload: { designation_id: "${des}", claimant_name: "Late Larry", claimant_type: "NAMED_BENEFICIARY" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { bc: $.data.id } }
          trigger:
            - { call: "POST /beneficiary-claims/${bc}/validate", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DESIGNATION_NOT_ACTIVE_AT_DEATH (422)"
            - "BeneficiaryClaim.${bc}.status remains SUBMITTED"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (half-open adjacency vs aggregate capacity)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: designation_window_overlap_vs_half_open_adjacency
        grounds:
          - validations[priority=10]
          - entities.BeneficiaryDesignation.fields.effective_date
          - entities.BeneficiaryDesignation.fields.revoked_at
          - errors[ERR_DESIGNATION_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: half-open [effective_date, date(revoked_at)) on the
          policy's same-(type,beneficiary_name) designation timeline. Overlapping
          effective dates are rejected; a new designation whose effective_date
          equals the predecessor's revocation date is ADJACENT and accepted.
          Resource: the policy's designation timeline.
        test_recipe:
          setup:
            - "IL statute; policy (version tracked via OCC); clock 2026-01-15"
            - "Designation D1: Alice PRIMARY 40% effective 2026-01-01 (ACTIVE window [2026-01-01, infinity))"
          setup_api_calls:
            - { call: "POST /state-statutes", payload: { state_code: "IL", annual_interest_rate_bp: 1000, interest_basis: "DATE_OF_DEATH", grace_days: 30, payment_deadline_days: 30, dormancy_years: 3, raa_minimum_cents: 100000, raa_annual_interest_rate_bp: 300 }, as: ComplianceOfficer }
            - { call: "POST /policies", payload: { policy_number: "P-OV-1", insured_name: "Amy Doe", insured_dob: "1970-07-07", state_code: "IL", face_amount_cents: 5000000, issue_date: "2024-03-01" }, as: PolicyAdministrator, captures: { pol: $.data.id, pol_v: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /policies/${pol}/beneficiary-designations", payload: { beneficiary_name: "Alice Doe", beneficiary_type: "PRIMARY", share_percent: 40, effective_date: "2026-01-01", expected_policy_version: "${pol_v}" }, as: PolicyAdministrator, captures: { d1: $.data.id } }
            - { call: "GET /policies/${pol}", payload: {}, as: PolicyAdministrator, captures: { pol_v2: $.data.version } }
          trigger:
            - { call: "POST /policies/${pol}/beneficiary-designations", payload: { beneficiary_name: "Alice Doe", beneficiary_type: "PRIMARY", share_percent: 50, effective_date: "2026-02-01", expected_policy_version: "${pol_v2}" }, as: PolicyAdministrator, captures: { err: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /beneficiary-designations/${d1}/revoke", payload: {}, as: PolicyAdministrator }
            - { call: "GET /policies/${pol}", payload: {}, as: PolicyAdministrator, captures: { pol_v3: $.data.version } }
            - { call: "POST /policies/${pol}/beneficiary-designations", payload: { beneficiary_name: "Alice Doe", beneficiary_type: "PRIMARY", share_percent: 100, effective_date: "2026-03-01", expected_policy_version: "${pol_v3}" }, as: PolicyAdministrator, captures: { d3_status: $.data.status } }
          assert:
            - "Overlap attempt (D2 effective 2026-02-01 inside D1's window): error_id == ERR_DESIGNATION_WINDOW_OVERLAP (409); note the 40+50=90 share total is legal, so the window rule is what fires"
            - "After revoking D1 at 2026-03-01: adjacent D3 effective exactly 2026-03-01 is accepted (201), status ACTIVE — half-open semantics"
            - "GET /policies/{id}/beneficiary-designations then shows D1 REVOKED, D3 ACTIVE, and no D2"

      - name: share_pool_aggregate_capacity_exceeded
        grounds:
          - validations[priority=10]
          - entities.BeneficiaryDesignation.fields.share_percent
          - errors[ERR_SHARE_TOTAL_EXCEEDED]
        distinguishing_aspect: |
          Interval semantics: AGGREGATE CAPACITY — concurrent designations
          co-occupy the policy's PRIMARY share pool (capacity 100); occupancy sums
          over the overlap region and the occupation that would push the sum past
          capacity is rejected. Different semantics and different resource (share
          pool, not the same-name timeline) than the half-open adjacency instance.
        test_recipe:
          setup:
            - "IL statute; policy; D1 Alice PRIMARY 60% effective 2026-01-01"
          setup_api_calls:
            - { call: "POST /state-statutes", payload: { state_code: "IL", annual_interest_rate_bp: 1000, interest_basis: "DATE_OF_DEATH", grace_days: 30, payment_deadline_days: 30, dormancy_years: 3, raa_minimum_cents: 100000, raa_annual_interest_rate_bp: 300 }, as: ComplianceOfficer }
            - { call: "POST /policies", payload: { policy_number: "P-OV-2", insured_name: "Amy Doe", insured_dob: "1970-07-07", state_code: "IL", face_amount_cents: 5000000, issue_date: "2024-03-01" }, as: PolicyAdministrator, captures: { pol: $.data.id, pol_v: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /policies/${pol}/beneficiary-designations", payload: { beneficiary_name: "Alice Doe", beneficiary_type: "PRIMARY", share_percent: 60, effective_date: "2026-01-01", expected_policy_version: "${pol_v}" }, as: PolicyAdministrator }
            - { call: "GET /policies/${pol}", payload: {}, as: PolicyAdministrator, captures: { pol_v2: $.data.version } }
          trigger:
            - { call: "POST /policies/${pol}/beneficiary-designations", payload: { beneficiary_name: "Bob Doe", beneficiary_type: "PRIMARY", share_percent: 50, effective_date: "2026-02-01", expected_policy_version: "${pol_v2}" }, as: PolicyAdministrator, captures: { err: $.data.error_id } }
            - { call: "POST /policies/${pol}/beneficiary-designations", payload: { beneficiary_name: "Bob Doe", beneficiary_type: "PRIMARY", share_percent: 40, effective_date: "2026-02-01", expected_policy_version: "${pol_v2}" }, as: PolicyAdministrator, captures: { d2_status: $.data.status } }
          assert:
            - "60% + 50% = 110 > 100: error_id == ERR_SHARE_TOTAL_EXCEEDED (422) — Bob is a different beneficiary_name so the window-overlap rule does not apply"
            - "60% + 40% = 100 (exactly at capacity): accepted, status ACTIVE — capacity check is strict >"
            - "Policy now holds two concurrent PRIMARY designations (60/40)"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (RAA cash balance vs claim payable liability)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: raa_deposit_withdrawal_cycle_conserves_balance
        grounds:
          - entities.RetainedAssetAccount.fields.balance_cents
          - entities.RetainedAssetAccount.fields.withdrawn_total_cents
          - entities.RetainedAssetAccount.fields.deposited_cents
          - state_machines.RetainedAssetAccount.OPEN_to_CLOSED
        distinguishing_aspect: |
          Conserved quantity: account principal. Invariant at every step:
          balance_cents + withdrawn_total_cents == deposited_cents. The forward
          action (deposit 10000000 via execute-payment) plus compensating
          withdrawals (4000000 then 6000000) leave 0 + 10000000 == 10000000, and
          closure posts the final yield on the closing balance (45113 cents on
          6000000 over 3 complete months) WITHOUT perturbing the principal
          invariant.
        test_recipe:
          setup:
            - "TX statute (grace 365; raa rate 300bp); policy face 10000000, Alice PRIMARY 100%"
            - "Claim approved, RAA election confirmed, execute-payment at 2026-04-01 funds account with 10000000"
          setup_api_calls:
            - { call: "POST /state-statutes", payload: { state_code: "TX", annual_interest_rate_bp: 1200, interest_basis: "DATE_OF_DEATH", grace_days: 365, payment_deadline_days: 30, dormancy_years: 3, raa_minimum_cents: 100000, raa_annual_interest_rate_bp: 300 }, as: ComplianceOfficer }
