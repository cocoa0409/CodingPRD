        grounds:
          - state_machines.DemoEvent.transitions.FULLY_STAFFED_to_UNSTAFFED
          - state_machines.EventAssignment.transitions.ASSIGNED_to_NO_SHOW
        excluded_because:
          difficulty_instance: transitive_cascade / third_strike_cascades_to_on_leave_then_releases_a_future_event_staffing
          rationale: "That instance asserts staffing_status FULLY_STAFFED -> UNSTAFFED on two separate events as a consequence of one NO_SHOW, including the RELEASED child assignment."

      - name: invoice_issue_syncs_the_manufacturer_receivable_ledger
        claim_type: ledger_sync
        grounds:
          - calculations.manufacturer_receivable_rollup
          - state_machines.EventInvoice.transitions.DRAFT_to_ISSUED
        excluded_because:
          difficulty_instance: compensating_invariant / voiding_an_issued_invoice_returns_the_receivable_to_zero_and_clears_the_hold
          rationale: "That instance reads outstanding_balance_cents before ISSUE, after ISSUE and after VOID, which covers both the sync and its reversal."

      - name: revoke_approval_compensates_the_allocation_side_effects
        claim_type: compensation
        grounds:
          - state_machines.DemoEvent.transitions.CONFIRMED_to_SUBMITTED
          - calculations.sample_allocation_waterfall
        excluded_because:
          difficulty_instance: compensating_invariant / revoking_approval_returns_the_club_week_case_pool_to_its_exact_prior_total
          rationale: "That instance asserts pool_remaining, pool_cases_used, allocated_sample_cases and approved_at all return to their pre-approval values."

      - name: staffing_and_booking_dimensions_advance_independently
        claim_type: valid_transition
        grounds:
          - state_machines.DemoEvent.transitions.UNSTAFFED_to_PARTIALLY_STAFFED
          - state_machines.DemoEvent.transitions.PARTIALLY_STAFFED_to_FULLY_STAFFED
        excluded_because:
          difficulty_instance: non_linear_state_machine / booking_and_staffing_dimensions_advance_independently_through_a_staffing_cycle
          rationale: "That instance walks UNSTAFFED -> PARTIALLY_STAFFED -> FULLY_STAFFED -> PARTIALLY_STAFFED -> FULLY_STAFFED while booking_status holds at CONFIRMED."

  # ===========================================================================
  # SECTION 3 — Calculations (§1.3)
  # ===========================================================================
  - section: calculations
    instances:

      - name: allocation_waterfall_stops_at_bucket_one_unless_the_tier_is_platinum
        claim_type: waterfall_allocation
        grounds:
          - calculations.sample_allocation_waterfall
          - entities.Manufacturer.fields.program_tier
          - entities.Product.fields.emergency_reserve_cases
          - entities.DemoEvent.fields.reserve_cases_used
        distinguishing_aspect: "Two events each requesting 8 cases against a pool of 5 and a reserve of 6 diverge on the manufacturer's tier alone: the GOLD event is allocated 5 with reserve_cases_used 0 — a partial allocation that is accepted, not rejected — while the PLATINUM event is allocated 8 as 5 from the pool plus 3 from the emergency reserve."
        test_recipe:
          setup:
            - "One club with daily_event_capacity 4 and food_station_count 1."
            - "M_gold (GOLD) owns P_gold: HOUSEHOLD, NON_FOOD, weekly_sample_case_pool 5, emergency_reserve_cases 6."
            - "M_plat (PLATINUM) owns P_plat: ELECTRONICS, NON_FOOD, identical weekly_sample_case_pool 5 and emergency_reserve_cases 6."
            - "Distinct categories keep MAX_EVENTS_PER_CATEGORY_PER_DAY 2 out of play, and both events are NON_FOOD so the single food station is irrelevant."
          setup_api_calls:
            - call: "POST /clubs"
              payload: { club_number: "C-6019", name: "Tarnbeck Club 6019", region_code: "MW", club_tier: "STANDARD", daily_event_capacity: 4, food_station_count: 1, health_permit_expires_on: "2027-06-30" }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { club_id: "$.data.id" }
            - call: "POST /manufacturers"
              payload: { legal_name: "Tarnbeck Household", billing_email: "ap@tarnbeck.example", program_tier: "GOLD", credit_limit_cents: 900000, credit_terms_days: 45 }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { gold_mfr_id: "$.data.id" }
            - call: "POST /manufacturers"
              payload: { legal_name: "Ulverwood Electronics", billing_email: "ap@ulverwood.example", program_tier: "PLATINUM", credit_limit_cents: 900000, credit_terms_days: 60 }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { plat_mfr_id: "$.data.id" }
            - call: "POST /products"
              payload: { manufacturer_id: "${gold_mfr_id}", sku: "TH-BRM-019", name: "Push Broom", category: "HOUSEHOLD", requires_food_handling: false, requires_heat_equipment: false, allergen_flag: false, unit_cost_cents: 1900, samples_per_case: 2, weekly_sample_case_pool: 5, emergency_reserve_cases: 6 }
              as: Manufacturer
              as_user_id: "${gold_mfr_id}"
              captures: { gold_product_id: "$.data.id" }
            - call: "POST /products"
              payload: { manufacturer_id: "${plat_mfr_id}", sku: "UE-SPK-019", name: "Bluetooth Speaker", category: "ELECTRONICS", requires_food_handling: false, requires_heat_equipment: false, allergen_flag: false, unit_cost_cents: 6400, samples_per_case: 2, weekly_sample_case_pool: 5, emergency_reserve_cases: 6 }
              as: Manufacturer
              as_user_id: "${plat_mfr_id}"
              captures: { plat_product_id: "$.data.id" }
            - call: "POST /demo-events"
              payload: { manufacturer_id: "${gold_mfr_id}", club_id: "${club_id}", product_id: "${gold_product_id}", event_date: "2026-09-14", day_part: "MORNING", requested_sample_cases: 8, addon_services: [] }
              as: Manufacturer
              as_user_id: "${gold_mfr_id}"
              captures: { gold_event_id: "$.data.id" }
            - call: "POST /demo-events/${gold_event_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Manufacturer
              as_user_id: "${gold_mfr_id}"
            - call: "POST /demo-events"
              payload: { manufacturer_id: "${plat_mfr_id}", club_id: "${club_id}", product_id: "${plat_product_id}", event_date: "2026-09-14", day_part: "MIDDAY", requested_sample_cases: 8, addon_services: [] }
              as: Manufacturer
              as_user_id: "${plat_mfr_id}"
              captures: { plat_event_id: "$.data.id" }
            - call: "POST /demo-events/${plat_event_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Manufacturer
              as_user_id: "${plat_mfr_id}"
          trigger:
            - call: "POST /demo-events/${gold_event_id}/transitions"
              payload: { action: "APPROVE" }
              as: ClubOperations
              as_user_id: "${club_id}"
              captures: { gold_alloc: "$.data.allocated_sample_cases", gold_pool: "$.data.pool_cases_used", gold_reserve: "$.data.reserve_cases_used", gold_state: "$.data.booking_status" }
            - call: "POST /demo-events/${plat_event_id}/transitions"
              payload: { action: "APPROVE" }
              as: ClubOperations
              as_user_id: "${club_id}"
              captures: { plat_alloc: "$.data.allocated_sample_cases", plat_pool: "$.data.pool_cases_used", plat_reserve: "$.data.reserve_cases_used" }
            - call: "GET /clubs/${club_id}/capacity?event_date=2026-09-14&product_id=${plat_product_id}"
              payload: { event_date: "2026-09-14", product_id: "${plat_product_id}" }
              as: ClubOperations
              as_user_id: "${club_id}"
              captures: { plat_pool_remaining: "$.data.pool_remaining", plat_reserve_remaining: "$.data.reserve_remaining" }
          assert:
            - "${gold_state} == CONFIRMED"
            - "${gold_alloc} == 5"
            - "${gold_pool} == 5"
            - "${gold_reserve} == 0"
            - "${gold_alloc} != 8"
            - "${plat_alloc} == 8"
            - "${plat_pool} == 5"
            - "${plat_reserve} == 3"
            - "${plat_pool_remaining} == 0"
            - "${plat_reserve_remaining} == 3"
            - "DemoEvent.${gold_event_id}.requested_sample_cases == 8"
            - "DemoEvent.${gold_event_id}.required_support_count == 0"

      - name: capacity_read_reports_the_calendar_utilization_scope_for_one_day
        claim_type: correct_result
        grounds:
          - calculations.club_day_calendar_utilization
          - endpoints[GET /clubs/{id}/capacity]
          - entities.Club.fields.daily_event_capacity
        distinguishing_aspect: "GET /clubs/{id}/capacity counts only CONFIRMED and COMPLETED events on the queried date: with one CONFIRMED HOUSEHOLD event and one still-DRAFT event on 2026-09-14 at a club of capacity 4, confirmed_count is 1, remaining_slots is 3, food_confirmed_count is 0, category_counts shows HOUSEHOLD 1, and week_start_date is the Monday 2026-09-14."
        test_recipe:
          setup:
            - "Club with daily_event_capacity 4 and food_station_count 1; NON_FOOD HOUSEHOLD product with weekly_sample_case_pool 20 and emergency_reserve_cases 0."
            - "E_confirmed requests 6 cases on 2026-09-14 and is approved; E_draft requests 2 cases on the same date and is never submitted."
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Vennhollow Goods", billing_email: "ap@vennhollow.example", program_tier: "STANDARD", credit_limit_cents: 900000, credit_terms_days: 30 }
