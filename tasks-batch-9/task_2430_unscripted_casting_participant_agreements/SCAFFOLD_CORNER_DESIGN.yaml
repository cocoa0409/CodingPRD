              as_user_id: "co_1"
              captures: { s1_recorded: $.data.recorded_at, s1_expires: $.data.expires_at, s1_outcome: $.data.outcome }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: ProductionAdmin
            - call: "POST /casting/applicants"
              payload: { casting_call_id: "${call_id}", legal_name: "Ben Okafor", date_of_birth: "1990-01-10", residency_state_code: "GA" }
              as: CastingDirector
