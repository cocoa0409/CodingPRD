# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules x 2 instances. Every setup_api_calls / trigger chain is
# replayed against SCAFFOLD.yaml §1.2/§1.4/§1.5 from empty-DB.
# Logical clock default: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: hotel_rebate_estimated_vs_final
        grounds:
          - calculations.hotel_pickup_rebate
          - entities.HotelBlock.fields.estimated_rebate_cents
          - entities.HotelBlock.fields.final_rebate_cents
        distinguishing_aspect: |
          Dual variant on the HOTEL FISCAL domain: the estimated variant's input
          set includes RESERVED/CONFIRMED bookings while the final variant counts
          only CHECKED_OUT/NO_SHOW, so the same block yields 114000 estimated vs
          108000 final cents; the impact-report variant pair lives on a different
          entity domain (event economic impact).
        test_recipe:
          setup:
            - "Event E (2026-10-08..2026-10-12); HotelBlock H: 20 rooms/night, rate 15000, nights 10-08..10-12 (80 contracted room-nights), cutoff 2026-10-01, attrition 0.20, status CONTRACTED"
            - "Booking B1: rooms 18, nights 10-08..10-12 (72 room-nights), RESERVED; Booking B2: rooms 1, same nights (4 room-nights), RESERVED"
            - "Estimated pickup set = {RESERVED, CONFIRMED, ...} -> 76 nights -> pickup_pct 0.9500 -> tier rate 0.10"
          setup_api_calls:
            - { call: "POST /api/v1/events", payload: { name: "River City Cup", sanctioning_body: "NFSA", host_city: "River City", starts_on: "2026-10-08", ends_on: "2026-10-12" }, as: CommissionAdmin, captures: { ev_id: $.data.id } }
            - { call: "POST /api/v1/events/${ev_id}/hotel-blocks", payload: { hotel_name: "Riverside Inn", contracted_rooms_per_night: 20, room_rate_cents: 15000, block_start_date: "2026-10-08", block_end_date: "2026-10-12", cutoff_date: "2026-10-01", attrition_allowance_pct: 0.20 }, as: CommissionAdmin, captures: { hb_id: $.data.id } }
            - { call: "POST /api/v1/hotel-blocks/${hb_id}/contract", payload: {}, as: CommissionAdmin }
            - { call: "POST /api/v1/hotel-blocks/${hb_id}/room-bookings", payload: { booker_type: COMMISSION, guest_name: "Block A", rooms_count: 18, check_in_date: "2026-10-08", check_out_date: "2026-10-12" }, as: CommissionAdmin, captures: { bk1: $.data.id } }
            - { call: "POST /api/v1/hotel-blocks/${hb_id}/room-bookings", payload: { booker_type: COMMISSION, guest_name: "Block B", rooms_count: 1, check_in_date: "2026-10-08", check_out_date: "2026-10-12" }, as: CommissionAdmin, captures: { bk2: $.data.id } }
            - { call: "GET /api/v1/hotel-blocks/${hb_id}", as: Any, captures: { est_before: $.data.estimated_rebate_cents } }
            - { call: "POST /api/v1/room-bookings/${bk2}/transition", payload: { action: CANCEL }, as: CommissionAdmin }
            - { call: "POST /api/v1/room-bookings/${bk1}/transition", payload: { action: CONFIRM }, as: CommissionAdmin }
            - { call: "POST /api/v1/_clock/set_current_utc", payload: { to_iso8601: "2026-10-09T00:00:00Z" }, as: CommissionAdmin }
            - { call: "POST /api/v1/room-bookings/${bk1}/transition", payload: { action: CHECK_IN }, as: CommissionAdmin }
            - { call: "POST /api/v1/_clock/set_current_utc", payload: { to_iso8601: "2026-10-13T00:00:00Z" }, as: CommissionAdmin }
            - { call: "POST /api/v1/room-bookings/${bk1}/transition", payload: { action: CHECK_OUT }, as: CommissionAdmin }
            - { call: "POST /api/v1/hotel-blocks/${hb_id}/close-cutoff", payload: {}, as: CommissionAdmin }
          trigger:
            - { call: "POST /api/v1/hotel-blocks/${hb_id}/reconcile", payload: {}, as: CommissionAdmin, captures: { fin_rebate: $.data.final_rebate_cents, fin_tier: $.data.rebate_tier, fin_pen: $.data.attrition_penalty_cents, fin_pickup: $.data.picked_up_room_nights } }
          assert:
            - "HotelBlock.${hb_id}.estimated_rebate_cents observed before reconcile == 114000 (76 picked-up nights at tier 0.10: 108000 + 6000 per-booking rounded)"
            - "HotelBlock.${hb_id}.final_rebate_cents == 108000 (72 nights x 15000 x 0.10)"
            - "HotelBlock.${hb_id}.picked_up_room_nights == 72 (B2 CANCELLED excluded from final set)"
            - "HotelBlock.${hb_id}.rebate_tier == TIER_2"
            - "HotelBlock.${hb_id}.attrition_penalty_cents == 0 (pickup 0.9000 >= floor 0.8000)"
            - "estimated variant (114000) != final variant (108000) for the same underlying bookings"

      - name: impact_spend_projected_vs_audited
        grounds:
          - calculations.impact_direct_spend
          - entities.ImpactReport.fields.projected_direct_spend_cents
          - entities.ImpactReport.fields.audited_direct_spend_cents
        distinguishing_aspect: |
          Dual variant on the EVENT ECONOMIC IMPACT domain (different domain
          from the hotel rebate pair): projected spend counts RESERVED/CONFIRMED
          bookings and planner attendance (6940000 cents) while audited spend
          counts only CHECKED_OUT/NO_SHOW bookings and auditor attendance
          (6155000 cents) on identical event data.
        test_recipe:
          setup:
            - "Full lifecycle to posture COMPLETED: bid awarded, venue+field contracted, block contracted, division U16 with 2 eligible teams, bracket published, final match played 3-1"
            - "Bookings: B1 rooms 18 (72 nights) CHECKED_OUT; B2 rooms 1 (4 nights) still CONFIRMED at submit"
            - "ImpactReport created with projected_attendance 400 by ops-admin-1"
          setup_api_calls:
            - { call: "POST /api/v1/events", payload: { name: "River City Cup", sanctioning_body: "NFSA", host_city: "River City", starts_on: "2026-10-08", ends_on: "2026-10-12" }, as: CommissionAdmin, captures: { ev_id: $.data.id, ev_v: $.data.version } }
            - { call: "POST /api/v1/events/${ev_id}/bids", payload: { expected_event_version: "${ev_v}" }, as: CommissionAdmin, captures: { bid_id: $.data.id } }
            - { call: "POST /api/v1/bids/${bid_id}/requirements", payload: { kind: INSURANCE_CERT, is_mandatory: true, weight_points: 100 }, as: CommissionAdmin, captures: { rq1: $.data.id } }
            - { call: "POST /api/v1/requirements/${rq1}/evidence", payload: { evidence_uri: "s3://ev/ins.pdf" }, as: CommissionAdmin, as_user_id: "ops-admin-1" }
            - { call: "POST /api/v1/requirements/${rq1}/verify", payload: { decision: VERIFIED }, as: SanctioningReviewer, as_user_id: "rev-9" }
            - { call: "POST /api/v1/bids/${bid_id}/submit", payload: {}, as: CommissionAdmin }
            - { call: "POST /api/v1/bids/${bid_id}/review", payload: {}, as: SanctioningReviewer, as_user_id: "rev-9" }
            - { call: "POST /api/v1/bids/${bid_id}/decide", payload: { decision: AWARDED }, as: SanctioningReviewer, as_user_id: "rev-9" }
            - { call: "POST /api/v1/events/${ev_id}/venues", payload: { name: "River Park", address: "1 Park Way", rental_fee_cents: 200000, revenue_share_pct: 0.10 }, as: CommissionAdmin, captures: { v1: $.data.id } }
            - { call: "POST /api/v1/venues/${v1}/contract", payload: { contract_uri: "s3://contracts/v1.pdf" }, as: CommissionAdmin }
            - { call: "POST /api/v1/venues/${v1}/fields", payload: { name: "Field 1", surface_type: TURF, has_lights: true, slot_minutes: 90 }, as: CommissionAdmin, captures: { f1: $.data.id } }
            - { call: "POST /api/v1/events/${ev_id}/hotel-blocks", payload: { hotel_name: "Riverside Inn", contracted_rooms_per_night: 20, room_rate_cents: 15000, block_start_date: "2026-10-08", block_end_date: "2026-10-12", cutoff_date: "2026-10-01", attrition_allowance_pct: 0.20 }, as: CommissionAdmin, captures: { hb1: $.data.id } }
            - { call: "POST /api/v1/hotel-blocks/${hb1}/contract", payload: {}, as: CommissionAdmin }
            - { call: "POST /api/v1/hotel-blocks/${hb1}/room-bookings", payload: { booker_type: COMMISSION, guest_name: "Block A", rooms_count: 18, check_in_date: "2026-10-08", check_out_date: "2026-10-12" }, as: CommissionAdmin, captures: { bk1: $.data.id } }
            - { call: "POST /api/v1/hotel-blocks/${hb1}/room-bookings", payload: { booker_type: COMMISSION, guest_name: "Block B", rooms_count: 1, check_in_date: "2026-10-08", check_out_date: "2026-10-12" }, as: CommissionAdmin, captures: { bk2: $.data.id } }
            - { call: "POST /api/v1/room-bookings/${bk1}/transition", payload: { action: CONFIRM }, as: CommissionAdmin }
            - { call: "POST /api/v1/room-bookings/${bk2}/transition", payload: { action: CONFIRM }, as: CommissionAdmin }
            - { call: "POST /api/v1/_clock/set_current_utc", payload: { to_iso8601: "2026-10-09T00:00:00Z" }, as: CommissionAdmin }
            - { call: "POST /api/v1/room-bookings/${bk1}/transition", payload: { action: CHECK_IN }, as: CommissionAdmin }
            - { call: "POST /api/v1/room-bookings/${bk1}/transition", payload: { action: CHECK_OUT }, as: CommissionAdmin }
            - { call: "GET /api/v1/events/${ev_id}", as: Any, captures: { ev_v3: $.data.version } }
            - { call: "POST /api/v1/events/${ev_id}/posture", payload: { to_posture: PLANNING, expected_event_version: "${ev_v3}" }, as: CommissionAdmin, captures: { ev_v4: $.data.version } }
            - { call: "POST /api/v1/events/${ev_id}/divisions", payload: { name: "U16", team_cap: 4, min_teams: 2, registration_fee_cents: 10000 }, as: CommissionAdmin, captures: { d1: $.data.id } }
            - { call: "POST /api/v1/events/${ev_id}/posture", payload: { to_posture: REGISTRATION_OPEN, expected_event_version: "${ev_v4}" }, as: CommissionAdmin, captures: { ev_v5: $.data.version } }
            - { call: "POST /api/v1/divisions/${d1}/teams", payload: { name: "Tigers", contact_email: "t@x.com", strength_rating: 90 }, as: CommissionAdmin, captures: { t1: $.data.id } }
            - { call: "POST /api/v1/divisions/${d1}/teams", payload: { name: "Sharks", contact_email: "s@x.com", strength_rating: 70 }, as: CommissionAdmin, captures: { t2: $.data.id } }
            - { call: "POST /api/v1/teams/${t1}/roster", payload: { roster_player_count: 12 }, as: TeamRep, as_user_id: "${t1}" }
            - { call: "POST /api/v1/teams/${t2}/roster", payload: { roster_player_count: 12 }, as: TeamRep, as_user_id: "${t2}" }
            - { call: "POST /api/v1/teams/${t1}/verify-eligibility", payload: {}, as: CommissionAdmin }
            - { call: "POST /api/v1/teams/${t2}/verify-eligibility", payload: {}, as: CommissionAdmin }
            - { call: "POST /api/v1/divisions/${d1}/lock-seeding", payload: {}, as: CommissionAdmin }
            - { call: "POST /api/v1/events/${ev_id}/posture", payload: { to_posture: COMPETITION_SETUP, expected_event_version: "${ev_v5}" }, as: CommissionAdmin, captures: { ev_v6: $.data.version } }
            - { call: "POST /api/v1/divisions/${d1}/publish-bracket", payload: {}, as: CommissionAdmin }
            - { call: "GET /api/v1/divisions/${d1}/matches", as: Any, captures: { m1: "$.data[0].id" } }
            - { call: "POST /api/v1/events/${ev_id}/posture", payload: { to_posture: LIVE, expected_event_version: "${ev_v6}" }, as: CommissionAdmin, captures: { ev_v7: $.data.version } }
            - { call: "POST /api/v1/matches/${m1}/schedule", payload: { field_id: "${f1}", scheduled_start: "2026-10-10T14:00:00Z" }, as: CommissionAdmin }
            - { call: "POST /api/v1/matches/${m1}/start", payload: {}, as: CommissionAdmin }
            - { call: "POST /api/v1/matches/${m1}/finalize", payload: { home_score: 3, away_score: 1 }, as: CommissionAdmin }
            - { call: "POST /api/v1/events/${ev_id}/posture", payload: { to_posture: COMPLETED, expected_event_version: "${ev_v7}" }, as: CommissionAdmin }
            - { call: "POST /api/v1/events/${ev_id}/impact-reports", payload: { projected_attendance: 400 }, as: CommissionAdmin, as_user_id: "ops-admin-1", captures: { rpt: $.data.id } }
            - { call: "POST /api/v1/impact-reports/${rpt}/submit", payload: {}, as: CommissionAdmin }
          trigger:
            - { call: "POST /api/v1/impact-reports/${rpt}/audit", payload: { actual_attendance: 350 }, as: CvbAuditor, as_user_id: "cvb-7", captures: { act_rn: $.data.actual_room_nights, aud_spend: $.data.audited_direct_spend_cents } }
          assert:
            - "ImpactReport.${rpt}.projected_room_nights == 76 (B1 CHECKED_OUT 72 + B2 CONFIRMED 4)"
            - "ImpactReport.${rpt}.projected_direct_spend_cents == 6940000 (1140000 charges + 400 x 14500)"
            - "ImpactReport.${rpt}.actual_room_nights == 72 (audited set excludes CONFIRMED B2)"
            - "ImpactReport.${rpt}.audited_direct_spend_cents == 6155000 (1080000 + 350 x 14500)"
            - "projected variant (6940000) != audited variant (6155000) for identical event data"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: hotel_rebate_tier_attrition_interplay
        grounds:
          - calculations.hotel_pickup_rebate
          - state_machines.HotelBlock.CUTOFF_PASSED_to_RECONCILED
        distinguishing_aspect: |
          Mode (a) combinatorial: >= 3 inputs (picked_up_room_nights,
          contracted_room_nights, room_rate_cents, attrition_allowance_pct) with
          non-linear interaction — the tier branch selects rate 0.00 at pickup
          0.7500 while a separate conditional attrition branch computes a
          30000-cent penalty; the stipend instance covers mode (b), not (a).
        test_recipe:
          setup:
            - "Event E; HotelBlock H: 20 rooms/night, rate 15000, 80 contracted room-nights, cutoff 2026-10-01, attrition 0.20 (floor 0.8000)"
            - "B1: rooms 15, nights 10-08..10-12 (60 room-nights), driven to CHECKED_OUT; pickup 60/80 = 0.7500 < 0.8000"
          setup_api_calls:
            - { call: "POST /api/v1/events", payload: { name: "River City Cup", sanctioning_body: "NFSA", host_city: "River City", starts_on: "2026-10-08", ends_on: "2026-10-12" }, as: CommissionAdmin, captures: { ev_id: $.data.id } }
            - { call: "POST /api/v1/events/${ev_id}/hotel-blocks", payload: { hotel_name: "Riverside Inn", contracted_rooms_per_night: 20, room_rate_cents: 15000, block_start_date: "2026-10-08", block_end_date: "2026-10-12", cutoff_date: "2026-10-01", attrition_allowance_pct: 0.20 }, as: CommissionAdmin, captures: { hb_id: $.data.id } }
            - { call: "POST /api/v1/hotel-blocks/${hb_id}/contract", payload: {}, as: CommissionAdmin }
            - { call: "POST /api/v1/hotel-blocks/${hb_id}/room-bookings", payload: { booker_type: COMMISSION, guest_name: "Block A", rooms_count: 15, check_in_date: "2026-10-08", check_out_date: "2026-10-12" }, as: CommissionAdmin, captures: { bk1: $.data.id } }
            - { call: "POST /api/v1/room-bookings/${bk1}/transition", payload: { action: CONFIRM }, as: CommissionAdmin }
            - { call: "POST /api/v1/_clock/set_current_utc", payload: { to_iso8601: "2026-10-09T00:00:00Z" }, as: CommissionAdmin }
            - { call: "POST /api/v1/room-bookings/${bk1}/transition", payload: { action: CHECK_IN }, as: CommissionAdmin }
            - { call: "POST /api/v1/_clock/set_current_utc", payload: { to_iso8601: "2026-10-13T00:00:00Z" }, as: CommissionAdmin }
            - { call: "POST /api/v1/room-bookings/${bk1}/transition", payload: { action: CHECK_OUT }, as: CommissionAdmin }
            - { call: "POST /api/v1/hotel-blocks/${hb_id}/close-cutoff", payload: {}, as: CommissionAdmin }
          trigger:
            - { call: "POST /api/v1/hotel-blocks/${hb_id}/reconcile", payload: {}, as: CommissionAdmin }
          assert:
            - "HotelBlock.${hb_id}.picked_up_room_nights == 60"
            - "HotelBlock.${hb_id}.rebate_tier == TIER_0 (pickup 0.7500 < 0.8000 floor)"
            - "HotelBlock.${hb_id}.final_rebate_cents == 0"
            - "HotelBlock.${hb_id}.attrition_penalty_cents == 30000 (shortfall floor(0.8*80)-60 = 4 nights x 15000 x 0.50)"

      - name: official_stipend_per_assignment_rounding
        grounds:
          - calculations.official_stipend_total
          - entities.Settlement.fields.officials_stipend_total_cents
        distinguishing_aspect: |
          Mode (b) combinatorial: nested rounding where order is pinned —
          round_half_up(9999 x 0.6) = 5999 PER ASSIGNMENT then sum gives 11998,
          whereas sum-then-round would give 11999; the hotel instance covers
          mode (a), not (b).
        test_recipe:
          setup:
            - "Event lifecycle to COMPLETED with a 2-team division; final match scheduled, started, finalized 3-1"
            - "Officials O1, O2 (TRAINEE) ACTIVE; each holds an ASSISTANT assignment on the final, ACCEPTED then WORKED"
            - "Hotel block contracted with zero bookings, then close-cutoff + reconcile so settlement certify is unblocked"
          setup_api_calls:
            - { call: "POST /api/v1/events", payload: { name: "River City Cup", sanctioning_body: "NFSA", host_city: "River City", starts_on: "2026-10-08", ends_on: "2026-10-12" }, as: CommissionAdmin, captures: { ev_id: $.data.id, ev_v: $.data.version } }
            - { call: "POST /api/v1/events/${ev_id}/bids", payload: { expected_event_version: "${ev_v}" }, as: CommissionAdmin, captures: { bid_id: $.data.id } }
            - { call: "POST /api/v1/bids/${bid_id}/requirements", payload: { kind: INSURANCE_CERT, is_mandatory: true, weight_points: 100 }, as: CommissionAdmin, captures: { rq1: $.data.id } }
            - { call: "POST /api/v1/requirements/${rq1}/evidence", payload: { evidence_uri: "s3://ev/ins.pdf" }, as: CommissionAdmin, as_user_id: "ops-admin-1" }
            - { call: "POST /api/v1/requirements/${rq1}/verify", payload: { decision: VERIFIED }, as: SanctioningReviewer, as_user_id: "rev-9" }
            - { call: "POST /api/v1/bids/${bid_id}/submit", payload: {}, as: CommissionAdmin }
            - { call: "POST /api/v1/bids/${bid_id}/review", payload: {}, as: SanctioningReviewer, as_user_id: "rev-9" }
            - { call: "POST /api/v1/bids/${bid_id}/decide", payload: { decision: AWARDED }, as: SanctioningReviewer, as_user_id: "rev-9" }
            - { call: "POST /api/v1/events/${ev_id}/venues", payload: { name: "River Park", address: "1 Park Way", rental_fee_cents: 200000, revenue_share_pct: 0.10 }, as: CommissionAdmin, captures: { v1: $.data.id } }
            - { call: "POST /api/v1/venues/${v1}/contract", payload: { contract_uri: "s3://contracts/v1.pdf" }, as: CommissionAdmin }
            - { call: "POST /api/v1/venues/${v1}/fields", payload: { name: "Field 1", surface_type: TURF, has_lights: true, slot_minutes: 90 }, as: CommissionAdmin, captures: { f1: $.data.id } }
            - { call: "POST /api/v1/events/${ev_id}/hotel-blocks", payload: { hotel_name: "Riverside Inn", contracted_rooms_per_night: 20, room_rate_cents: 15000, block_start_date: "2026-10-08", block_end_date: "2026-10-12", cutoff_date: "2026-10-01", attrition_allowance_pct: 0.20 }, as: CommissionAdmin, captures: { hb1: $.data.id } }
            - { call: "POST /api/v1/hotel-blocks/${hb1}/contract", payload: {}, as: CommissionAdmin }
            - { call: "GET /api/v1/events/${ev_id}", as: Any, captures: { ev_v3: $.data.version } }
            - { call: "POST /api/v1/events/${ev_id}/posture", payload: { to_posture: PLANNING, expected_event_version: "${ev_v3}" }, as: CommissionAdmin, captures: { ev_v4: $.data.version } }
            - { call: "POST /api/v1/events/${ev_id}/divisions", payload: { name: "U16", team_cap: 4, min_teams: 2, registration_fee_cents: 10000 }, as: CommissionAdmin, captures: { d1: $.data.id } }
            - { call: "POST /api/v1/events/${ev_id}/posture", payload: { to_posture: REGISTRATION_OPEN, expected_event_version: "${ev_v4}" }, as: CommissionAdmin, captures: { ev_v5: $.data.version } }
            - { call: "POST /api/v1/divisions/${d1}/teams", payload: { name: "Tigers", contact_email: "t@x.com", strength_rating: 90 }, as: CommissionAdmin, captures: { t1: $.data.id } }
            - { call: "POST /api/v1/divisions/${d1}/teams", payload: { name: "Sharks", contact_email: "s@x.com", strength_rating: 70 }, as: CommissionAdmin, captures: { t2: $.data.id } }
            - { call: "POST /api/v1/teams/${t1}/roster", payload: { roster_player_count: 12 }, as: TeamRep, as_user_id: "${t1}" }
            - { call: "POST /api/v1/teams/${t2}/roster", payload: { roster_player_count: 12 }, as: TeamRep, as_user_id: "${t2}" }
            - { call: "POST /api/v1/teams/${t1}/verify-eligibility", payload: {}, as: CommissionAdmin }
            - { call: "POST /api/v1/teams/${t2}/verify-eligibility", payload: {}, as: CommissionAdmin }
            - { call: "POST /api/v1/divisions/${d1}/lock-seeding", payload: {}, as: CommissionAdmin }
            - { call: "POST /api/v1/events/${ev_id}/posture", payload: { to_posture: COMPETITION_SETUP, expected_event_version: "${ev_v5}" }, as: CommissionAdmin, captures: { ev_v6: $.data.version } }
            - { call: "POST /api/v1/divisions/${d1}/publish-bracket", payload: {}, as: CommissionAdmin }
            - { call: "GET /api/v1/divisions/${d1}/matches", as: Any, captures: { m1: "$.data[0].id" } }
            - { call: "POST /api/v1/events/${ev_id}/officials", payload: { name: "Ora One", certification_level: TRAINEE }, as: CommissionAdmin, captures: { o1: $.data.id } }
            - { call: "POST /api/v1/events/${ev_id}/officials", payload: { name: "Otto Two", certification_level: TRAINEE }, as: CommissionAdmin, captures: { o2: $.data.id } }
            - { call: "POST /api/v1/officials/${o1}/transition", payload: { action: VET }, as: CommissionAdmin }
            - { call: "POST /api/v1/officials/${o1}/transition", payload: { action: ACTIVATE }, as: CommissionAdmin }
            - { call: "POST /api/v1/officials/${o2}/transition", payload: { action: VET }, as: CommissionAdmin }
            - { call: "POST /api/v1/officials/${o2}/transition", payload: { action: ACTIVATE }, as: CommissionAdmin }
            - { call: "POST /api/v1/events/${ev_id}/posture", payload: { to_posture: LIVE, expected_event_version: "${ev_v6}" }, as: CommissionAdmin, captures: { ev_v7: $.data.version } }
            - { call: "POST /api/v1/matches/${m1}/schedule", payload: { field_id: "${f1}", scheduled_start: "2026-10-10T14:00:00Z" }, as: CommissionAdmin }
            - { call: "POST /api/v1/matches/${m1}/official-assignments", payload: { official_id: "${o1}", slot_role: ASSISTANT }, as: CommissionAdmin, captures: { a1: $.data.id } }
            - { call: "POST /api/v1/matches/${m1}/official-assignments", payload: { official_id: "${o2}", slot_role: ASSISTANT }, as: CommissionAdmin, captures: { a2: $.data.id } }
            - { call: "POST /api/v1/official-assignments/${a1}/respond", payload: { response: ACCEPTED }, as: Official, as_user_id: "${o1}" }
            - { call: "POST /api/v1/official-assignments/${a2}/respond", payload: { response: ACCEPTED }, as: Official, as_user_id: "${o2}" }
