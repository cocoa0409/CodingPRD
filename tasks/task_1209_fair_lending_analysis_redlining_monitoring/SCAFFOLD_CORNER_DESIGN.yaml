          setup: ["no setup required beyond empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /fair-lending/board-reports", payload: { period_start: "2026-07-01", period_end: "2026-10-01" }, as: FairLendingAnalyst, captures: { br1: $.data.id } }
