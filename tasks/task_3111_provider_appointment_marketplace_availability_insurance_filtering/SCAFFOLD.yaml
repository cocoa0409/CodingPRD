  - id: ERR_BILLING_MODE_MISMATCH
    http: 402
    condition: "Charge-level operation against a SUBSCRIPTION practice (or per-booking sweep semantics violated)"

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated public caller (directory reads are also open to Anonymous via Any)"
    identity: opaque
    exclusive_operations:
      - "POST /marketplace/patients — patient self-registration"
    shared_operations:
      - "All GET endpoints with roles [Any]"

  - name: Patient
    description: "Registered patient; acts only on own bookings, complaints, reviews, and record"
    identity: "entity_backed:Patient"
    exclusive_operations:
      - "POST /marketplace/slots/{slot_id}/bookings — create own booking"
      - "PATCH /marketplace/patients/{patient_id} — update own insurance plan (OCC)"
      - "POST /marketplace/complaints — file complaint on own booking"
      - "POST /marketplace/reviews — review own verified visit"
    shared_operations:
      - "POST /marketplace/bookings/{booking_id}/cancel — cancel own booking (shared with PracticeStaff)"
      - "GET /marketplace/bookings, /complaints, /visit-records (own scope)"
      - "All GET endpoints with roles [Any]"

  - name: Provider
    description: "Provider account; X-User-ID equals the Provider.id it operates"
    identity: "entity_backed:Provider"
    exclusive_operations:
      - "POST /marketplace/reviews/{review_id}/flag — flag a review of itself (shared with PracticeStaff)"
    shared_operations:
      - "POST /marketplace/providers/{provider_id}/slots, /slots/bulk-publish — own calendar write-back (shared with PracticeStaff of the owning practice)"
      - "POST /marketplace/slots/{slot_id}/close — close own slot"
      - "POST /marketplace/providers/{provider_id}/appointment-types, /appointment-types/{id}/retire"
      - "POST /marketplace/attestations — attest own plan acceptance"
      - "GET /marketplace/attestations (own scope)"
      - "All GET endpoints with roles [Any]"

  - name: PracticeStaff
    description: "Practice back-office account; X-User-ID equals the Practice.id it operates"
    identity: "entity_backed:Practice"
    exclusive_operations:
      - "POST /marketplace/providers — create provider under own practice"
      - "POST /marketplace/contact-events — CRM write-back for own practice"
      - "POST /marketplace/bookings/{booking_id}/check-in, /complete, /mark-no-show"
      - "POST /marketplace/complaints/{complaint_id}/respond"
      - "POST /marketplace/invoices/{invoice_id}/dispute, /pay — own practice's invoices"
    shared_operations:
      - "Slot and appointment-type management for own practice's providers (shared with Provider)"
      - "POST /marketplace/attestations — attest for own practice's providers"
      - "POST /marketplace/bookings/{booking_id}/cancel — cancel bookings at own practice"
      - "POST /marketplace/reviews/{review_id}/flag — flag reviews of own providers"
      - "GET /marketplace/charges, /invoices, /ledger-entries (own practice scope)"
      - "All GET endpoints with roles [Any]"

  - name: OpsAdmin
    description: "Marketplace operator; owns plan catalog, attestation verification, moderation, billing runs, audits, epoch and clock"
    identity: opaque
    exclusive_operations:
      - "POST /marketplace/practices + all /practices/{id}/activate|suspend|reinstate|delist|billing-mode"
      - "POST /marketplace/providers/{id}/activate|suspend|reinstate|delist"
      - "POST /marketplace/insurance-plans, /insurance-plans/{id}/retire"
      - "POST /marketplace/attestations/{id}/verify"
      - "POST /marketplace/billing/generate-invoices"
      - "POST /marketplace/invoices/{id}/resolve-dispute, /write-off"
      - "POST /marketplace/complaints/{id}/resolve"
      - "POST /marketplace/reviews/{id}/moderate"
      - "POST /marketplace/audit-cases + run/resolve-finding/close"
      - "POST /marketplace/ops/run-epoch, POST /marketplace/_clock/set_current_utc"
    shared_operations:
      - "GET endpoints for patients, bookings, charges, invoices, ledger entries, complaints, visit-records (oversight)"
      - "All GET endpoints with roles [Any]"

  - name: Any
    description: "Pseudo-role for public read endpoints; any declared role (including Anonymous) may call; headers are still required"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /marketplace/practices, /practices/{id}, /providers, /providers/{id}, /slots, /slots/{id}, /appointment-types, /appointment-types/{id}, /insurance-plans, /insurance-plans/{id}, /reviews, /reviews/{id}"
