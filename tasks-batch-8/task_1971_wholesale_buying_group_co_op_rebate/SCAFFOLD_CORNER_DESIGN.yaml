            - call: "GET /coop/purchase-reports/${r_id}"
              payload: {}
              as: ProgramAuditor
              captures: { old_status: $.data.status }
          assert:
            - "new PurchaseReport.status == SUBMITTED"
            - "new PurchaseReport.revision_of_id == ${r_id}"
            - "new PurchaseReport.self_report_qty == 8"
            - "old PurchaseReport.${r_id}.status == SUPERSEDED"

      - name: distribution_disburse_from_approved_requires_pool
        claim_type: precondition_enforcement
        grounds:
          - state_machines.QuarterlyDistribution.APPROVED_to_DISBURSED
        distinguishing_aspect: |
          Disburse from APPROVED succeeds when pool_reserve >= net_disbursed;
          post-disburse the accruals transition to DISTRIBUTED and a
          HoldbackRelease is created in SCHEDULED.
        test_recipe:
          setup: ["Distribution D in APPROVED with non-zero totals; pool sufficient"]
          setup_api_calls:
            - call: "POST /coop/bootstrap"
              payload: { name: "T" }
              as: CoopAdmin
            - call: "POST /coop/members"
              payload: { legal_name: "M", commitment_level: "STANDARD" }
              as: CoopAdmin
              captures: { m_id: $.data.id }
            - call: "POST /coop/members/${m_id}/activate"
              payload: {}
              as: CoopAdmin
            - call: "POST /coop/suppliers"
              payload: { legal_name: "S" }
              as: CoopAdmin
              captures: { s_id: $.data.id }
            - call: "POST /coop/suppliers/${s_id}/onboard"
              payload: {}
              as: CoopAdmin
            - call: "POST /coop/suppliers/${s_id}/supplier-programs"
              payload:
                program_code: "P-DISB"
                exclusivity_required: false
                exclusivity_threshold_pct: 0
                tier_schedule: [{ min_qty: 0, rate_bps: 500 }]
                holdback_policy: "FLAT"
              as: SupplierRep
              as_user_id: "${s_id}"
              captures: { p_id: $.data.id }
            - call: "POST /coop/supplier-programs/${p_id}/open"
              payload: {}
              as: SupplierRep
              as_user_id: "${s_id}"
            - call: "POST /coop/enrollments"
              payload: { member_id: "${m_id}", program_id: "${p_id}" }
              as: CoopAdmin
              captures: { e_id: $.data.id }
            - call: "POST /coop/enrollments/${e_id}/purchase-reports"
              payload: { quarter_index: 0, self_report_qty: 50, self_report_cents: 100000 }
              as: MemberRep
              as_user_id: "${m_id}"
            - call: "POST /coop/close_quarter"
              payload: {}
              as: CoopAdmin
            - call: "POST /coop/distributions"
              payload: {}
              as: FinanceOfficer
              captures: { d_id: $.data.id, d_v: $.data.version }
            - call: "POST /coop/distributions/${d_id}/calculate"
              payload: { expected_distribution_version: "${d_v}" }
              as: FinanceOfficer
            - call: "POST /coop/distributions/${d_id}/approve"
              payload: {}
              as: FinanceOfficer
          trigger:
            - call: "POST /coop/distributions/${d_id}/disburse"
              payload: {}
              as: FinanceOfficer
              captures: { st: $.data.status }
            - call: "GET /coop/holdback-releases"
              payload: {}
              as: FinanceOfficer
              captures: { hb_status: $.data.0.status, hb_cents: $.data.0.release_cents }
          assert:
            - "QuarterlyDistribution.status == DISBURSED"
            - "HoldbackRelease[0].status == SCHEDULED"
            # final_rebate = floor(100000*500/10000)=5000; pass = floor(5000*7500/10000)=3750; retained=1250
            # holdback = floor(3750*1000/10000) = 375
            - "HoldbackRelease[0].release_cents == 375"

