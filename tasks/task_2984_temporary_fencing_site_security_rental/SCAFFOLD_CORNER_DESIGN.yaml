        distinguishing_aspect: |
          Issuing a DRAFT quote at clock 2026-08-01T00:00:00Z moves it to
          ISSUED, stamps issued_at_utc with the logical clock and
          valid_through_utc exactly 14 days later at 2026-08-15T00:00:00Z, and
          bumps Quote.version from 1 to 2 while leaving the priced money fields
          byte-identical.
