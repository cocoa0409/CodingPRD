  # ===========================================================================
  # RULE 8 — resource_temporal_overlap
  # Two different resource entities and THREE different interval geometries:
  #   8a: Facility courts  — buffer-extended half-open occupancy [start, start+D+B)
  #   8b: Team calendar    — pure UTC calendar-date bucket, no duration at all
  #   8c: Team calendar    — 240-minute start-to-start separation with the
  #                          doubleheader flag on, buffer deliberately ignored
  # 8b and 8c share the Team resource but run mutually exclusive geometries
  # selected by League.allow_same_day_doubleheader, and 8c shows a slot the
  # Facility rule admits while the Team rule rejects it.
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: facility_occupancy_extends_past_playing_end_by_the_turnaround_buffer
        grounds:
          - calculations.court_slot_capacity
          - entities.Facility.fields.turnaround_buffer_minutes
          - entities.Match.fields.scheduled_end_at
          - entities.Match.fields.courts_required
          - validations[priority=53]
        distinguishing_aspect: |
          Both rejected requests start at or after M1's scheduled_end_at 2026-08-15T21:00:00Z —
          21:00 exactly and 21:15 — yet both fail 409 ERR_FACILITY_COURTS_EXCEEDED because the
          occupancy that consumes the two courts runs to 21:30, i.e. duration 180 plus the
          facility's 30-minute turnaround buffer. An implementation that treats occupancy as
          [start, scheduled_end_at) admits both, and the teams involved in the request share no
          team with M1, so no calendar rule can be responsible for either rejection.
        test_recipe:
          setup:
            - "Section SOCAL-2026; facility fac with court_count 2 and turnaround_buffer_minutes 30; SECTION league with match_duration_minutes 180 and min_active_roster_size 2."
            - "Four teams T1..T4 of two ACTIVE 4.0 players each, all IN_PLAY."
            - "Match M1 (T1 vs T2) occupies fac from 2026-08-15T18:00:00Z with courts_required 2, so scheduled_end_at is 2026-08-15T21:00:00Z and occupancy is [18:00, 21:30)."
            - "Match M2 pairs T3 and T4 and is still PENDING, so both rejections must come from the court rule alone."
            - "Clock stays at 2026-08-08T00:00:00Z; both failed requests leave Match.version untouched, so both use expected_match_version ${m2v}."
          setup_api_calls:
