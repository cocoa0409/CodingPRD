            - { call: "POST /union-compliance/signatory-applications/${app_id}/decide", payload: { decision: "APPROVE" }, as: UnionRep }
            - { call: "POST /union-compliance/productions", payload: { producer_company_id: "${co_id}", title: "Xanthium Burr", agreement_tier: "ULTRA_LOW_BUDGET", budget_cents: 20000000 }, as: ProducerRep, as_user_id: "${co_id}", captures: { prod_id: $.data.id } }
            - { call: "GET /union-compliance/productions/${prod_id}/bonds", payload: {}, as: ProducerRep, as_user_id: "${co_id}", captures: { bond_id: "$.data[0].id" } }
            - { call: "POST /union-compliance/bonds/${bond_id}/post", payload: { amount_cents: 2500000 }, as: ProducerRep, as_user_id: "${co_id}" }
            - { call: "POST /union-compliance/grievances", payload: { production_id: "${prod_id}", category: "PAY", incident_date: "2026-07-20", description: "Rate underpayment" }, as: UnionRep, as_user_id: "ur_1", captures: { grv_id: $.data.id } }
            - { call: "POST /union-compliance/grievances/${grv_id}/accept-intake", payload: {}, as: UnionRep, as_user_id: "ur_1", captures: { grv_v: $.data.version } }
