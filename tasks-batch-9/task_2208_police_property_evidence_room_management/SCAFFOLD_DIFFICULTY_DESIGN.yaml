  - rule_id: resource_temporal_overlap
    instances:

      - name: item_custody_windows_half_open_adjacency_allowed
        grounds:
          - "calculations.item_custody_window_conflict"
          - "validations[priority=21]"
          - "errors[ERR_CUSTODY_WINDOW_CONFLICT]"
          - "entities.EvidenceItem.fields.open_transfer_count"
        distinguishing_aspect: |
          HALF-OPEN interval semantics on the EVIDENCEITEM resource: a second transfer whose released_at
          equals the first transfer's due_back_at (2026-09-15T00:00:00Z) is accepted, while one starting
          a single millisecond earlier is rejected, so adjacency is legal and only strict overlap
          conflicts.
        test_recipe:
          setup:
            - "One GENERAL item stored in G-01 under case 26-00001."
            - "An existing REQUESTED transfer to I-300 covering 2026-09-10T00:00:00Z to 2026-09-15T00:00:00Z."
          setup_api_calls:
            - *k_clock
            - *k_room
            - *k_stat_th3
            - *k_stat_ab1
            - *k_loc_g
            - *k_loc_v
            - *k_loc_r
            - *k_loc_r2
            - *k_loc_y
            - *k_tech
            - *k_tech2
            - *k_lab
            - *k_inv
            - *k_aud
            - *k_case1
            - *k_case2
            - call: "POST /evidence-items"
              payload: { case_id: "${case1_id}", item_description: "Handwriting exemplar folder", category: "GENERAL", packaging_type: "SEALED_ENVELOPE", appraised_value_cents: 800, seized_at: "2026-07-31T21:00:00Z" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
              captures: { item_id: $.data.id }
            - call: "POST /evidence-items/${item_id}/storage-assignment"
              payload: { storage_location_id: "${loc_g_id}" }
              as: EvidenceTechnician
              as_user_id: "${tech_id}"
            - call: "POST /custody-transfers"
              payload: { evidence_item_id: "${item_id}", to_custodian_id: "${inv_id}", purpose: "INVESTIGATIVE_REVIEW", released_at: "2026-09-10T00:00:00Z", due_back_at: "2026-09-15T00:00:00Z" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { transfer_a_id: $.data.id }
          trigger:
            - call: "POST /custody-transfers"
              payload: { evidence_item_id: "${item_id}", to_custodian_id: "${inv_id}", purpose: "INVESTIGATIVE_REVIEW", released_at: "2026-09-15T00:00:00Z", due_back_at: "2026-09-18T00:00:00Z" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { transfer_b_id: $.data.id, transfer_b_status: $.data.status }
            - call: "POST /custody-transfers"
              payload: { evidence_item_id: "${item_id}", to_custodian_id: "${lab_id}", purpose: "LAB_ANALYSIS", released_at: "2026-09-14T23:59:59.999Z", due_back_at: "2026-09-17T00:00:00Z" }
              as: LabAnalyst
              as_user_id: "${lab_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "The adjacent transfer is accepted with HTTP 201: ${transfer_b_status} == 'REQUESTED' and released_at == '2026-09-15T00:00:00.000Z'"
            - "The overlapping transfer returns HTTP 409 with ${err_id} == 'ERR_CUSTODY_WINDOW_CONFLICT' (2026-09-14T23:59:59.999Z < 2026-09-15T00:00:00Z)"
            - "GET /custody-transfers?evidence_item_id=${item_id} returns total_count == 2, containing only ${transfer_a_id} and ${transfer_b_id}"
            - "EvidenceItem.${item_id}.open_transfer_count == 2"
            - "Custodian.${inv_id}.open_escort_count == 2 and Custodian.${lab_id}.open_escort_count == 0"

      - name: custodian_escort_capacity_closed_interval_third_overlap_rejected
        grounds:
          - "calculations.escort_concurrency_load"
          - "validations[priority=19]"
          - "errors[ERR_ESCORT_CAPACITY_EXCEEDED]"
          - "entities.Custodian.fields.open_escort_count"
        distinguishing_aspect: |
          CLOSED interval semantics with an aggregate cap on the CUSTODIAN resource: the third transfer
          starts exactly at the first one's due_back_at (2026-09-15T00:00:00Z), and because touching
          endpoints count as overlap the load reaches MAX_CONCURRENT_ESCORTS 2 and the request is
          rejected — under the half-open rule used for item windows the load would be 1 and it would
          be accepted.
        test_recipe:
          setup:
            - "Three distinct GENERAL items stored in G-01 (capacity 2) and V-01 under case 26-00001, so item-level window conflicts cannot fire."
            - "Two open transfers to I-300: item 1 for 2026-09-10 to 2026-09-15 and item 2 for 2026-09-12 to 2026-09-16."
          setup_api_calls:
            - *k_clock
            - *k_room
            - *k_stat_th3
            - *k_stat_ab1
            - *k_loc_g
            - *k_loc_v
