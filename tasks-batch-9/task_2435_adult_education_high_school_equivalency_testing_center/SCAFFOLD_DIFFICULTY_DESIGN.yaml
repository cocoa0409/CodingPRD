              payload: { student_id: "${s}", exam_session_id: "${sess}", expected_exam_session_version: "${sess_v2}" }
              as: Registrar
              captures: { reg2: $.data.id }
          assert:
            - "checkpoint 0 (after the grant): voucher_granted_cents == 5000, voucher_balance_cents == 5000, voucher_spent_cents == 0, exam_fee_owed_cents == 0"
            - "checkpoint 1 (registered): registration ${reg} voucher_applied_cents == 3000, fee_due_cents == 0; student balance 2000, spent 3000, granted still 5000; ExamSession seats_taken == 1"
            - "checkpoint 2 (cancelled): ${reg} registration_status == CANCELLED with refunded_cents == 3000; student balance 5000, spent 0, granted 5000, exam_fee_owed_cents 0; seats_taken == 0"
            - "the second cancel returns 409 with data.error_id == ERR_REGISTRATION_NOT_OPEN and the ledger is unchanged (balance stays 5000, refunded_cents stays 3000)"
            - "checkpoint 3 (re-registered): ${reg2} voucher_applied_cents == 3000 and prior_scored_attempts == 0 (the cancelled seat is not a retake); balance 2000, spent 3000, granted 5000"
            - "at every checkpoint voucher_balance_cents + voucher_spent_cents == voucher_granted_cents exactly"

      - name: funding_cents_conserved_across_allocation_and_rescission
        conserved_quantity: "FundingPeriod.total_cents == committed_cents + available_cents, and committed_cents == the sum of allocated_cents over rows with allocation_status == COMMITTED"
