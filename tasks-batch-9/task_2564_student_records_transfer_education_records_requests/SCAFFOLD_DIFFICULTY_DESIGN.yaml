            - "Student.${late_student_id}.directory_optout_categories == []"
            - "Student.${on_time_student_id}.directory_optout_deadline_at == \"2026-08-15T00:00:00.000Z\""
            - "Student.${on_time_student_id}.directory_optout_received_at == \"2026-08-15T00:00:00.000Z\""
            - "Student.${on_time_student_id}.directory_optout_effective == true"
            - "Student.${on_time_student_id}.directory_optout_categories == [\"ADDRESS\", \"PHONE\"]"

      - name: officer_daily_minute_cap_exact_240
        grounds:
          - validations.priority_72_hearing_officer_daily_minute_cap
          - state_machines.AmendmentRequest.HEARING_SCHEDULED_to_HEARING_SCHEDULED
