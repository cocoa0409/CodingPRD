scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: athlete_create_defaults_and_system_fields
        claim_type: creation
        grounds: [entities.Athlete]
        distinguishing_aspect: "POST /v1/athletes applies documented defaults (tier FREE, heatmap_opt_out false, safety_score 100, status ACTIVE) and system fields (server-minted UUID id, created_at, version 1); client-supplied status/safety_score values in the payload are ignored."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /v1/athletes"
              payload: { email: "d_ef@x.com", display_name: "D EF", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { d_ef: $.data.id, d_tier: $.data.tier, d_score: $.data.safety_score, d_status: $.data.status, d_opt: $.data.heatmap_opt_out, d_ver: $.data.version }
          assert:
            - "tier == FREE, heatmap_opt_out == false, safety_score == 100, status == ACTIVE, version == 1"
            - "id is a server-minted UUID; created_at/updated_at are ISO8601 UTC with three fractional digits"

      - name: athlete_email_uniqueness_rejected
        claim_type: type_constraint
        grounds: [entities.Athlete.fields.email, "errors[ERR_UNIQUE_VIOLATION]"]
        distinguishing_aspect: "Second athlete registration reusing an existing email is rejected with ERR_UNIQUE_VIOLATION (409), proving global email uniqueness."
        test_recipe:
          setup: ["Athlete E1 exists with email dup@x.com"]
          setup_api_calls:
            - call: "POST /v1/athletes"
              payload: { email: "dup@x.com", display_name: "First", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
          trigger:
            - call: "POST /v1/athletes"
              payload: { email: "dup@x.com", display_name: "Second", home_lat: 38.0, home_lng: -123.0 }
              as: PlatformAdmin
              captures: { err_dup: $.data.error_id }
          assert:
            - "error_id == ERR_UNIQUE_VIOLATION, HTTP 409"

      - name: athlete_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Athlete, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a non-existent athlete UUID returns ERR_NOT_FOUND (404), the generic existence claim for the root entity."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /v1/athletes/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: PlatformAdmin
              captures: { err_nf: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND, HTTP 404"

      - name: privacy_zone_one_per_athlete
        claim_type: type_constraint
        grounds: [entities.PrivacyZone, "errors[ERR_UNIQUE_VIOLATION]"]
        distinguishing_aspect: "Creating a second PrivacyZone for the same athlete is rejected with ERR_UNIQUE_VIOLATION (409) — per-athlete cardinality 0..1."
        test_recipe:
          setup: ["Athlete ZO exists and already has one ACTIVE zone"]
          setup_api_calls:
            - call: "POST /v1/athletes"
              payload: { email: "zo_z@x.com", display_name: "ZO Z", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { zo_z: $.data.id }
            - call: "POST /v1/athletes/${zo_z}/privacy_zones"
              payload: { center_lat: 37.0, center_lng: -122.0, radius_m: 500 }
              as: Athlete
              as_user_id: "${zo_z}"
          trigger:
            - call: "POST /v1/athletes/${zo_z}/privacy_zones"
              payload: { center_lat: 38.0, center_lng: -123.0, radius_m: 300 }
              as: Athlete
              as_user_id: "${zo_z}"
              captures: { err_z2: $.data.error_id }
          assert:
            - "error_id == ERR_UNIQUE_VIOLATION, HTTP 409"

      - name: privacy_zone_radius_range_enforced
        claim_type: type_constraint
        grounds: [entities.PrivacyZone.fields.radius_m, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "radius_m below the 200m floor is rejected with ERR_VALIDATION (422) — numeric range constraint on zone geometry."
        test_recipe:
          setup: ["Athlete ZR exists"]
          setup_api_calls:
            - call: "POST /v1/athletes"
              payload: { email: "zr_z@x.com", display_name: "ZR Z", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { zr_z: $.data.id }
          trigger:
            - call: "POST /v1/athletes/${zr_z}/privacy_zones"
              payload: { center_lat: 37.0, center_lng: -122.0, radius_m: 100 }
              as: Athlete
              as_user_id: "${zr_z}"
              captures: { err_zr: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION, HTTP 422"

      - name: segment_name_sport_uniqueness_among_living
        claim_type: type_constraint
        grounds: [entities.Segment.fields.name, "errors[ERR_UNIQUE_VIOLATION]"]
        distinguishing_aspect: "A second segment with the same (name, sport_type) is rejected while the first exists in any of {DRAFT, ACTIVE, RETIRED}; the same name under a different sport_type is accepted."
        test_recipe:
          setup: ["Athlete SN created segment 'Twin Peak' RIDE (DRAFT)"]
          setup_api_calls:
            - call: "POST /v1/athletes"
              payload: { email: "sn_s@x.com", display_name: "SN S", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { sn_s: $.data.id }
            - call: "POST /v1/segments"
              payload: { creator_id: "${sn_s}", name: "Twin Peak", sport_type: "RIDE", start_lat: 47.00, start_lng: -132.00, end_lat: 47.01, end_lng: -132.00, distance_m: 1000, city: "Twinville" }
              as: Athlete
              as_user_id: "${sn_s}"
          trigger:
            - call: "POST /v1/segments"
              payload: { creator_id: "${sn_s}", name: "Twin Peak", sport_type: "RIDE", start_lat: 48.00, start_lng: -133.00, end_lat: 48.01, end_lng: -133.00, distance_m: 1000, city: "Twinville" }
              as: Athlete
              as_user_id: "${sn_s}"
              captures: { err_sn: $.data.error_id }
            - call: "POST /v1/segments"
              payload: { creator_id: "${sn_s}", name: "Twin Peak", sport_type: "RUN", start_lat: 48.00, start_lng: -133.00, end_lat: 48.01, end_lng: -133.00, distance_m: 1000, city: "Twinville" }
              as: Athlete
              as_user_id: "${sn_s}"
              captures: { seg_run: $.data.id }
          assert:
            - "Duplicate (Twin Peak, RIDE): error_id == ERR_UNIQUE_VIOLATION, HTTP 409"
            - "Same name under RUN succeeds with HTTP 201"

      - name: club_name_uniqueness_ignores_archived
        claim_type: type_constraint
        grounds: [entities.Club.fields.name, "errors[ERR_UNIQUE_VIOLATION]"]
        distinguishing_aspect: "Club name uniqueness is scoped to non-ARCHIVED clubs: reusing a live club's name fails; after archiving the first club the same name succeeds."
        test_recipe:
          setup: ["Athlete CU owns club 'Riders United' (ACTIVE)"]
          setup_api_calls:
            - call: "POST /v1/athletes"
              payload: { email: "cu_c@x.com", display_name: "CU C", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { cu_c: $.data.id }
            - call: "POST /v1/clubs"
              payload: { owner_id: "${cu_c}", name: "Riders United", sport_type: "RIDE", join_policy: "OPEN" }
              as: Athlete
              as_user_id: "${cu_c}"
              captures: { club_cu: $.data.id }
          trigger:
            - call: "POST /v1/clubs"
              payload: { owner_id: "${cu_c}", name: "Riders United", sport_type: "RUN", join_policy: "OPEN" }
              as: Athlete
              as_user_id: "${cu_c}"
              captures: { err_cu: $.data.error_id }
            - call: "POST /v1/clubs/${club_cu}/archive"
              payload: {}
              as: Athlete
              as_user_id: "${cu_c}"
            - call: "POST /v1/clubs"
              payload: { owner_id: "${cu_c}", name: "Riders United", sport_type: "RUN", join_policy: "OPEN" }
              as: Athlete
              as_user_id: "${cu_c}"
              captures: { club_cu2: $.data.id }
          assert:
            - "While first club ACTIVE: error_id == ERR_UNIQUE_VIOLATION, HTTP 409"
            - "After archive: creation succeeds with HTTP 201"

      - name: event_future_scheduling_enforced
        claim_type: type_constraint
        grounds: [entities.VirtualEvent.fields.scheduled_at, "errors[ERR_WINDOW_VIOLATION]"]
        distinguishing_aspect: "Event scheduled_at at or before the logical clock is rejected with ERR_WINDOW_VIOLATION (422) — strict future-instant constraint."
        test_recipe:
          setup: ["Clock at default 2026-09-01T00:00:00Z; athlete EO owns club EC and ACTIVE hazard-0 segment ES"]
          setup_api_calls:
            - call: "POST /v1/athletes"
              payload: { email: "eo_w@x.com", display_name: "EO W", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { eo_w: $.data.id }
            - call: "POST /v1/segments"
              payload: { creator_id: "${eo_w}", name: "Window Sprint", sport_type: "RIDE", start_lat: 49.00, start_lng: -134.00, end_lat: 49.01, end_lng: -134.00, distance_m: 1000, city: "Winville" }
              as: Athlete
              as_user_id: "${eo_w}"
              captures: { seg_w: $.data.id }
            - call: "POST /v1/segments/${seg_w}/activate"
              payload: {}
              as: Athlete
              as_user_id: "${eo_w}"
            - call: "POST /v1/clubs"
              payload: { owner_id: "${eo_w}", name: "Window Club", sport_type: "RIDE", join_policy: "OPEN" }
              as: Athlete
              as_user_id: "${eo_w}"
              captures: { club_w: $.data.id }
          trigger:
            - call: "POST /v1/clubs/${club_w}/events"
              payload: { name: "Past Race", segment_id: "${seg_w}", scheduled_at: "2026-08-01T09:00:00Z", capacity: 10 }
              as: Athlete
              as_user_id: "${eo_w}"
              captures: { err_w: $.data.error_id }
          assert:
            - "error_id == ERR_WINDOW_VIOLATION, HTTP 422"

      - name: challenge_window_end_before_start_rejected
        claim_type: type_constraint
        grounds: [entities.Challenge.fields.end_date, "errors[ERR_WINDOW_VIOLATION]"]
        distinguishing_aspect: "Challenge with end_date earlier than start_date is rejected with ERR_WINDOW_VIOLATION (422) at creation."
        test_recipe:
          setup: ["Athlete CO owns club CC (OPEN)"]
          setup_api_calls:
            - call: "POST /v1/athletes"
              payload: { email: "co_ch@x.com", display_name: "CO Ch", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { co_ch: $.data.id }
            - call: "POST /v1/clubs"
              payload: { owner_id: "${co_ch}", name: "Window Challenge Club", sport_type: "RUN", join_policy: "OPEN" }
              as: Athlete
              as_user_id: "${co_ch}"
              captures: { club_ch: $.data.id }
          trigger:
            - call: "POST /v1/clubs/${club_ch}/challenges"
              payload: { name: "Backwards", goal_type: "DISTANCE_M", goal_target: 1000, start_date: "2026-09-10", end_date: "2026-09-01", join_mode: "OPEN" }
              as: Athlete
              as_user_id: "${co_ch}"
              captures: { err_ch: $.data.error_id }
          assert:
            - "error_id == ERR_WINDOW_VIOLATION, HTTP 422"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: rsvp_decline_then_rejoin_cycle
        claim_type: valid_transition
        grounds: [state_machines.EventRSVP]
        distinguishing_aspect: "EventRSVP cyclic edge: GOING -> DECLINED -> GOING both succeed while the event is PUBLISHED and under capacity."
        test_recipe:
          setup: ["Athlete RO owns club RC, ACTIVE segment RS, event RE PUBLISHED capacity 3 at 2026-09-06T09:00:00Z; athlete RM is ACTIVE member"]
          setup_api_calls:
            - call: "POST /v1/athletes"
              payload: { email: "ro_r@x.com", display_name: "RO R", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { ro_r: $.data.id }
            - call: "POST /v1/athletes"
              payload: { email: "rm_r@x.com", display_name: "RM R", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { rm_r: $.data.id }
            - call: "POST /v1/segments"
              payload: { creator_id: "${ro_r}", name: "RSVP Sprint", sport_type: "RIDE", start_lat: 50.00, start_lng: -135.00, end_lat: 50.01, end_lng: -135.00, distance_m: 1000, city: "Rsvpville" }
              as: Athlete
              as_user_id: "${ro_r}"
              captures: { seg_r: $.data.id }
            - call: "POST /v1/segments/${seg_r}/activate"
              payload: {}
              as: Athlete
              as_user_id: "${ro_r}"
            - call: "POST /v1/clubs"
              payload: { owner_id: "${ro_r}", name: "RSVP Club", sport_type: "RIDE", join_policy: "OPEN" }
              as: Athlete
              as_user_id: "${ro_r}"
              captures: { club_r: $.data.id }
            - call: "POST /v1/clubs/${club_r}/memberships"
              payload: { athlete_id: "${rm_r}" }
              as: Athlete
              as_user_id: "${rm_r}"
            - call: "POST /v1/clubs/${club_r}/events"
              payload: { name: "Cycle Race", segment_id: "${seg_r}", scheduled_at: "2026-09-06T09:00:00Z", capacity: 3 }
              as: Athlete
              as_user_id: "${ro_r}"
              captures: { ev_r: $.data.id }
            - call: "POST /v1/events/${ev_r}/rsvps"
              payload: { athlete_id: "${rm_r}" }
              as: Athlete
              as_user_id: "${rm_r}"
              captures: { rsvp_r: $.data.id }
          trigger:
            - call: "POST /v1/events/${ev_r}/rsvps/${rsvp_r}/decline"
              payload: {}
              as: Athlete
              as_user_id: "${rm_r}"
              captures: { st_r1: $.data.status }
            - call: "POST /v1/events/${ev_r}/rsvps/${rsvp_r}/rejoin"
              payload: {}
              as: Athlete
              as_user_id: "${rm_r}"
              captures: { st_r2: $.data.status }
          assert:
            - "After decline: EventRSVP.status == DECLINED"
            - "After rejoin: EventRSVP.status == GOING"

      - name: terminal_event_lockdown
        claim_type: invalid_transition
        grounds: [state_machines.VirtualEvent, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Terminal state lockdown: RSVP to a CANCELLED event is rejected with ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Athlete TO owns club TC, ACTIVE segment TS; event TE PUBLISHED then CANCELLED; athlete TM is ACTIVE member"]
          setup_api_calls:
            - call: "POST /v1/athletes"
              payload: { email: "to_t@x.com", display_name: "TO T", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { to_t: $.data.id }
            - call: "POST /v1/athletes"
              payload: { email: "tm_t@x.com", display_name: "TM T", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { tm_t: $.data.id }
            - call: "POST /v1/segments"
              payload: { creator_id: "${to_t}", name: "Lockdown Sprint", sport_type: "RIDE", start_lat: 51.00, start_lng: -136.00, end_lat: 51.01, end_lng: -136.00, distance_m: 1000, city: "Lockville" }
              as: Athlete
              as_user_id: "${to_t}"
              captures: { seg_t: $.data.id }
            - call: "POST /v1/segments/${seg_t}/activate"
              payload: {}
              as: Athlete
              as_user_id: "${to_t}"
            - call: "POST /v1/clubs"
              payload: { owner_id: "${to_t}", name: "Lockdown Club", sport_type: "RIDE", join_policy: "OPEN" }
              as: Athlete
              as_user_id: "${to_t}"
              captures: { club_t: $.data.id }
            - call: "POST /v1/clubs/${club_t}/memberships"
              payload: { athlete_id: "${tm_t}" }
              as: Athlete
              as_user_id: "${tm_t}"
            - call: "POST /v1/clubs/${club_t}/events"
              payload: { name: "Doomed Race", segment_id: "${seg_t}", scheduled_at: "2026-09-06T09:00:00Z", capacity: 3 }
              as: Athlete
              as_user_id: "${to_t}"
              captures: { ev_t: $.data.id }
            - call: "POST /v1/clubs/${club_t}/events/${ev_t}/cancel"
              payload: {}
              as: Athlete
              as_user_id: "${to_t}"
          trigger:
            - call: "POST /v1/events/${ev_t}/rsvps"
              payload: { athlete_id: "${tm_t}" }
              as: Athlete
              as_user_id: "${tm_t}"
              captures: { err_t: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE, HTTP 409"

      - name: closed_challenge_rejects_join
        claim_type: invalid_transition
        grounds: [state_machines.Challenge, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Lazy close: after the clock passes end_date the challenge flips to CLOSED on read, and a subsequent join fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Athlete KO owns club KC (OPEN); athlete KM ACTIVE member; challenge KCH ACTIVE with window 2026-09-01..2026-09-07; clock advanced to 2026-09-08"]
          setup_api_calls:
            - call: "POST /v1/athletes"
              payload: { email: "ko_k@x.com", display_name: "KO K", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { ko_k: $.data.id }
            - call: "POST /v1/athletes"
              payload: { email: "km_k@x.com", display_name: "KM K", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { km_k: $.data.id }
            - call: "POST /v1/clubs"
              payload: { owner_id: "${ko_k}", name: "Closing Club", sport_type: "RUN", join_policy: "OPEN" }
              as: Athlete
              as_user_id: "${ko_k}"
              captures: { club_k: $.data.id }
            - call: "POST /v1/clubs/${club_k}/memberships"
              payload: { athlete_id: "${km_k}" }
              as: Athlete
              as_user_id: "${km_k}"
            - call: "POST /v1/clubs/${club_k}/challenges"
              payload: { name: "Week One", goal_type: "DISTANCE_M", goal_target: 10000, start_date: "2026-09-01", end_date: "2026-09-07", join_mode: "OPEN" }
              as: Athlete
              as_user_id: "${ko_k}"
              captures: { ch_k: $.data.id }
            - call: "POST /v1/clubs/${club_k}/challenges/${ch_k}/start"
              payload: {}
              as: Athlete
              as_user_id: "${ko_k}"
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /v1/challenges/${ch_k}"
              as: Athlete
              as_user_id: "${ko_k}"
              captures: { ch_k_state: $.data.status }
            - call: "POST /v1/challenges/${ch_k}/participations"
              payload: { athlete_id: "${km_k}" }
              as: Athlete
              as_user_id: "${km_k}"
              captures: { err_k: $.data.error_id }
          assert:
            - "GET after clock advance: Challenge.status == CLOSED (lazy close)"
            - "Join attempt: error_id == ERR_INVALID_STATE, HTTP 409"

      - name: lapsed_subscription_blocks_gated_feature
        claim_type: invalid_transition
        grounds: [state_machines.Subscription, "errors[ERR_SUBSCRIPTION_REQUIRED]"]
        distinguishing_aspect: "Lazy lapse: after the clock passes expires_at the subscription flips to LAPSED on read, and beacon creation then fails with ERR_SUBSCRIPTION_REQUIRED (402)."
        test_recipe:
          setup: ["Athlete LS has subscription expiring 2026-09-02T00:00:00Z and one safety contact; clock advanced to 2026-09-03"]
          setup_api_calls:
            - call: "POST /v1/athletes"
              payload: { email: "ls_s@x.com", display_name: "LS S", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { ls_s: $.data.id }
            - call: "POST /v1/athletes/${ls_s}/subscriptions"
              payload: { plan: "SUMMIT_MONTHLY", started_at: "2026-08-01T00:00:00Z", expires_at: "2026-09-02T00:00:00Z" }
              as: Athlete
              as_user_id: "${ls_s}"
              captures: { sub_ls: $.data.id }
            - call: "POST /v1/athletes/${ls_s}/safety_contacts"
              payload: { contact_email: "sos_ls@x.com", label: "SOS" }
              as: Athlete
              as_user_id: "${ls_s}"
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /v1/athletes/${ls_s}/subscriptions"
              as: Athlete
              as_user_id: "${ls_s}"
              captures: { sub_ls_state: "$.data[0].status" }
            - call: "POST /v1/athletes/${ls_s}/beacon_sessions"
              payload: {}
              as: Athlete
              as_user_id: "${ls_s}"
              captures: { err_ls: $.data.error_id }
          assert:
            - "Subscription read after expiry shows status == LAPSED (lazy lapse)"
            - "Beacon create: error_id == ERR_SUBSCRIPTION_REQUIRED, HTTP 402"

      - name: duplicate_upload_reconciliation
        claim_type: valid_transition
        grounds: [state_machines.Activity, entities.Activity.fields.duplicate_of_id]
        distinguishing_aspect: "Cross-device reconciliation: a second upload with the same device_source, started_at 60s later (within 120s) and equal distance completes as DUPLICATE with duplicate_of_id pointing at the canonical (earlier-created) activity and runs no segment sweep."
        test_recipe:
          setup: ["Athlete DU has uploaded one canonical activity (key du-1, started 2026-09-01T06:00:00Z)"]
          setup_api_calls:
            - call: "POST /v1/athletes"
              payload: { email: "du_d@x.com", display_name: "DU D", home_lat: 37.0, home_lng: -122.0 }
              as: PlatformAdmin
              captures: { du_d: $.data.id }
            - call: "POST /v1/athletes/${du_d}/activities"
              payload: { device_source: "garmin-edge", sport_type: "RIDE", started_at: "2026-09-01T06:00:00Z", duration_s: 600, distance_m: 2000, track_points: [{lat: 52.00, lng: -137.00, t_offset_s: 0}, {lat: 52.01, lng: -137.00, t_offset_s: 600}], start_lat: 52.00, start_lng: -137.00, end_lat: 52.01, end_lng: -137.00, idempotency_key: "du-1" }
              as: Athlete
              as_user_id: "${du_d}"
              captures: { act_du1: $.data.id }
          trigger:
            - call: "POST /v1/athletes/${du_d}/activities"
              payload: { device_source: "garmin-edge", sport_type: "RIDE", started_at: "2026-09-01T06:01:00Z", duration_s: 600, distance_m: 2000, track_points: [{lat: 52.00, lng: -137.00, t_offset_s: 0}, {lat: 52.01, lng: -137.00, t_offset_s: 600}], start_lat: 52.00, start_lng: -137.00, end_lat: 52.01, end_lng: -137.00, idempotency_key: "du-2" }
              as: Athlete
              as_user_id: "${du_d}"
              captures: { act_du2: $.data.id, st_du2: $.data.status, canon_du2: $.data.duplicate_of_id }
          assert:
