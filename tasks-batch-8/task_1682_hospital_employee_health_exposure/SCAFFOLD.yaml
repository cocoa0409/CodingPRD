# =============================================================================
# Scaffold: Hospital Employee Health & Exposure Management
# =============================================================================

scenario: |
  Hospital Employee Health & Exposure Management (hospital employee health office): pre-placement screening & immunity titer verification, annual TB/respirator fit-test cycle & compliance holds, bloodborne-pathogen exposure intake & source-patient testing consent, post-exposure prophylaxis timing & follow-up serology, work restriction/return-to-work clearance, communicable-disease exposure contact tracing among staff, injury reporting linkage to workers' compensation, vaccination campaign & declination tracking

domain_name: hospital-employee-health
api_prefix: /employee-health

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Temporal windowing"
  complexity_layers:
    - cascading_side_effects
    - rate_threshold_triggers
    - scheduled_actions
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: posture_driven
  relationship_patterns: [one_to_many, many_to_many, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Employee
    parent: null
    common_fields: true  # id, created_at, updated_at, version
    fields:
      - { name: employee_ref, type: string, source: input, description: "Unique HR badge reference supplied by the hospital", constraints: "unique across all employees" }
      - { name: full_name, type: string, source: input, description: "Employee full name" }
      - { name: job_category, type: enum, source: input, description: "NURSE | PHYSICIAN | TECH | HOUSEKEEPING | OTHER" }
      - { name: department, type: string, source: input, description: "Home department code, e.g. ICU, ED, LAB" }
      - { name: hire_date, type: datetime, source: input, description: "Hire date; used as anchor for first ROLLING_ANNIVERSARY cycle" }
      - { name: requires_respirator, type: boolean, source: input, description: "True when job duties require respirator fit testing" }
      - { name: status, type: enum, source: system, description: "PREPLACEMENT | ACTIVE | SUSPENDED ; auto-driven only (see state machine)" }
      - { name: compliance_posture, type: enum, source: computed, description: "CLEAR | ON_HOLD | WORK_EXCLUDED | RESTRICTED_DUTY ; derived per compliance_posture_derivation" }
      - { name: active_hold_count, type: integer, source: computed, default: 0, description: "Count of ComplianceHold rows with status ACTIVE for this employee" }
      - { name: open_restriction_count, type: integer, source: computed, default: 0, description: "Count of WorkRestriction rows with status ACTIVE for this employee" }

  - name: PrePlacementScreening
    parent: null
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id; screening subject" }
      - { name: status, type: enum, source: system, description: "IN_PROGRESS | CLEARED | FAILED | VOID" }
      - { name: physical_completed_at, type: datetime, source: input, description: "Set via component completion (component=PHYSICAL); null until completed" }
      - { name: tb_baseline_completed_at, type: datetime, source: input, description: "Set via component completion (component=TB_BASELINE); null until completed" }
      - { name: med_eval_completed_at, type: datetime, source: input, description: "Set via component completion (component=MED_EVAL); required only when Employee.requires_respirator is true" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the EmployeeHealthPhysician who issued the decide outcome" }
      - { name: decided_at, type: datetime, source: system, description: "Logical clock timestamp of the decide call" }

  - name: TiterResult
    parent: null
    common_fields: false  # append-only record: id + created_at only, no update endpoint
    fields:
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id; titer subject" }
      - { name: screening_id, type: string, source: input, description: "FK -> PrePlacementScreening.id; optional linkage to the pre-placement screening this result satisfies", constraints: "may be null; when present the screening must belong to the same employee" }
      - { name: disease, type: enum, source: input, description: "HEP_B | MEASLES | MUMPS | RUBELLA | VARICELLA" }
      - { name: assay_type, type: enum, source: input, description: "QUANTITATIVE | QUALITATIVE" }
      - { name: numeric_value, type: number, source: input, description: "Assay numeric value (mIU/mL or index); required when assay_type=QUANTITATIVE, ignored when QUALITATIVE" }
      - { name: qualitative_result, type: enum, source: input, description: "REACTIVE | NON_REACTIVE | EQUIVOCAL; required when assay_type=QUALITATIVE, ignored when QUANTITATIVE" }
      - { name: resulted_at, type: datetime, source: input, description: "Lab result timestamp; must not be after the current logical clock time" }
      - { name: immunity_status, type: enum, source: computed, description: "IMMUNE | NON_IMMUNE | EQUIVOCAL per immunity_interpretation" }

  - name: AnnualRequirementCycle
    parent: null
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id; cycle subject" }
      - { name: cycle_year, type: integer, source: input, description: "Calendar year this cycle covers, e.g. 2026" }
      - { name: cycle_mode, type: enum, source: input, description: "CALENDAR_YEAR | ROLLING_ANNIVERSARY; selects cycle_due_date variant" }
      - { name: tb_due_date, type: datetime, source: computed, description: "TB screening due timestamp per cycle_due_date" }
      - { name: fit_test_due_date, type: datetime, source: computed, description: "Fit-test due timestamp per cycle_due_date; null when Employee.requires_respirator is false" }
      - { name: tb_completed_at, type: datetime, source: input, description: "Set via completions endpoint (requirement_type=TB_SCREENING); null until completed" }
      - { name: fit_test_completed_at, type: datetime, source: input, description: "Set via completions endpoint (requirement_type=FIT_TEST); null until completed" }
      - { name: status, type: enum, source: system, description: "OPEN | OVERDUE | SATISFIED" }

  - name: ComplianceHold
    parent: null
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: system, description: "FK -> Employee.id; held employee" }
      - { name: cycle_id, type: string, source: system, description: "FK -> AnnualRequirementCycle.id; set when reason is TB_OVERDUE or FIT_TEST_OVERDUE, else null" }
      - { name: participation_id, type: string, source: system, description: "FK -> CampaignParticipation.id; set when reason is CAMPAIGN_DELINQUENT, else null" }
      - { name: reason, type: enum, source: system, description: "TB_OVERDUE | FIT_TEST_OVERDUE | CAMPAIGN_DELINQUENT" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RELEASED" }
      - { name: applied_at, type: datetime, source: system, description: "Logical clock timestamp when the hold was applied" }
      - { name: released_at, type: datetime, source: system, description: "Logical clock timestamp of release; null while ACTIVE" }
      - { name: released_by_user_id, type: string, source: system, description: "X-User-ID of the ComplianceOfficer who released the hold; null while ACTIVE" }

  - name: ExposureCase
    parent: null
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: system, description: "FK -> Employee.id; exposed employee" }
      - { name: exposure_type, type: enum, source: input, description: "PERCUTANEOUS | MUCOUS_MEMBRANE | SKIN_CONTACT | BITE" }
      - { name: exposure_datetime, type: datetime, source: input, description: "When the exposure occurred; must not be after the current logical clock time" }
      - { name: reported_at, type: datetime, source: system, description: "Logical clock timestamp of intake" }
      - { name: source_known, type: boolean, source: input, description: "True when the source patient is identified" }
      - { name: source_patient_ref, type: string, source: input, description: "Source patient reference; required when source_known is true, must be null when false" }
      - { name: body_fluid, type: enum, source: input, description: "BLOOD | OTHER_POTENTIALLY_INFECTIOUS | NON_INFECTIOUS" }
      - { name: risk_classification, type: enum, source: computed, description: "HIGH | MEDIUM | LOW per exposure_risk_classification" }
      - { name: case_status, type: enum, source: system, description: "REPORTED | EVALUATION | MANAGEMENT | CLOSED | SEROCONVERTED ; parallel dimension 1" }
      - { name: source_test_status, type: enum, source: system, description: "NOT_REQUIRED | CONSENT_PENDING | CONSENT_GRANTED | RESULTED | CONSENT_DECLINED | WAIVED_UNABLE ; parallel dimension 2, evolves independently of case_status" }
      - { name: pep_required, type: boolean, source: computed, description: "True when risk_classification is HIGH or MEDIUM, or after source HIV POSITIVE" }
      - { name: hiv_result, type: enum, source: input, description: "PENDING | NEGATIVE | POSITIVE | INDETERMINATE ; source patient HIV result" }
      - { name: hbv_result, type: enum, source: input, description: "PENDING | NEGATIVE | POSITIVE | INDETERMINATE ; source patient HBV result" }
      - { name: hcv_result, type: enum, source: input, description: "PENDING | NEGATIVE | POSITIVE | INDETERMINATE ; source patient HCV result" }
      - { name: source_resulted_at, type: datetime, source: input, description: "Timestamp of source patient lab results" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the intake nurse (SoD anchor: may not record source consent)" }
      - { name: consent_recorded_by_user_id, type: string, source: system, description: "X-User-ID that recorded source consent outcome; null until recorded" }

  - name: PEPRegimen
    parent: null
    common_fields: true
    fields:
      - { name: exposure_case_id, type: string, source: system, description: "FK -> ExposureCase.id; parent exposure case" }
      - { name: medication, type: enum, source: input, description: "HIV_3DRUG | HBV_HBIG | HBV_VACCINE_SERIES" }
      - { name: recommended_at, type: datetime, source: system, description: "Logical clock timestamp of recommendation (case intake)" }
      - { name: window_deadline, type: datetime, source: computed, description: "ExposureCase.exposure_datetime + PEP_WINDOW_HOURS (72h) per pep_window_assessment" }
      - { name: started_at, type: datetime, source: input, description: "First dose timestamp recorded on STARTED transition; null until started" }
      - { name: status, type: enum, source: system, description: "RECOMMENDED | STARTED | COMPLETED | DECLINED | WINDOW_EXPIRED" }

  - name: SerologyFollowUp
    parent: null
    common_fields: true
    fields:
      - { name: exposure_case_id, type: string, source: system, description: "FK -> ExposureCase.id; parent exposure case" }
      - { name: milestone, type: enum, source: system, description: "BASELINE | WEEK_6 | WEEK_12 | MONTH_6" }
      - { name: scheduled_date, type: datetime, source: computed, description: "Per serology_schedule: exposure_datetime + milestone offset" }
      - { name: window_open, type: datetime, source: computed, description: "scheduled_date - 7 days (BASELINE: exposure_datetime)" }
      - { name: window_close, type: datetime, source: computed, description: "scheduled_date + 28 days" }
      - { name: result, type: enum, source: input, description: "PENDING | NEGATIVE | POSITIVE | INDETERMINATE" }
      - { name: resulted_at, type: datetime, source: input, description: "Result timestamp; null until RESULTED" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | DUE | OVERDUE | RESULTED | WAIVED" }

  - name: WorkRestriction
    parent: null
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: system, description: "FK -> Employee.id; restricted employee" }
      - { name: exposure_case_id, type: string, source: input, description: "FK -> ExposureCase.id; optional linkage; when present the case must belong to the same employee", constraints: "may be null" }
      - { name: restriction_type, type: enum, source: input, description: "NO_PATIENT_CONTACT | NO_PROCEDURES | MODIFIED_DUTY | FULL_EXCLUSION" }
      - { name: start_date, type: datetime, source: input, description: "Restriction start (inclusive boundary of half-open interval)" }
      - { name: end_date, type: datetime, source: input, description: "Restriction end (exclusive boundary of half-open interval); null = open-ended (+infinity)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | LIFTED | EXPIRED" }
      - { name: origin, type: enum, source: system, description: "MANUAL | SEROCONVERSION | CONTACT_CONVERSION ; what created this restriction" }

  - name: ReturnToWorkClearance
    parent: null
    common_fields: true
    fields:
      - { name: restriction_id, type: string, source: system, description: "FK -> WorkRestriction.id; restriction under clearance review" }
      - { name: status, type: enum, source: system, description: "PENDING | CLEARED | DENIED" }
      - { name: requested_by_user_id, type: string, source: system, description: "X-User-ID of the requesting nurse" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the deciding physician; null while PENDING" }
      - { name: decided_at, type: datetime, source: system, description: "Logical clock timestamp of decision; null while PENDING" }
      - { name: decision_note, type: string, source: input, description: "Optional note recorded at decision", constraints: "may be null" }

  - name: CommunicableEvent
    parent: null
    common_fields: true
    fields:
      - { name: index_employee_id, type: string, source: input, description: "FK -> Employee.id; staff member who is the index case" }
      - { name: disease, type: enum, source: input, description: "COVID | INFLUENZA | PERTUSSIS | NOROVIRUS | MEASLES" }
      - { name: onset_date, type: datetime, source: input, description: "Symptom onset of the index case" }
      - { name: infectious_start, type: datetime, source: computed, description: "onset_date - DISEASE_INCUBATION_OFFSET_DAYS[disease] per contact_monitoring_window" }
      - { name: monitoring_window_days, type: integer, source: computed, description: "DISEASE_MONITORING_WINDOW_DAYS[disease] per contact_monitoring_window" }
      - { name: status, type: enum, source: system, description: "OPEN | TRACING | MONITORING | ESCALATED | CLOSED" }

  - name: ExposureContact
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: system, description: "FK -> CommunicableEvent.id; parent event" }
      - { name: contact_employee_id, type: string, source: input, description: "FK -> Employee.id; exposed staff member (must differ from event index_employee_id)", constraints: "unique per (event_id, contact_employee_id)" }
      - { name: contact_date, type: datetime, source: input, description: "Last date of infectious contact; must be within [event.infectious_start, now]" }
      - { name: monitoring_start, type: datetime, source: computed, description: "= contact_date" }
      - { name: monitoring_end, type: datetime, source: computed, description: "contact_date + event.monitoring_window_days days; contact auto-clears only when now > monitoring_end (strict)" }
      - { name: symptom_onset_reported, type: boolean, source: system, default: false, description: "Set true by report-symptom" }
      - { name: symptom_onset_date, type: datetime, source: input, description: "Reported symptom onset; null until reported" }
      - { name: status, type: enum, source: system, description: "MONITORING | CLEARED | CONVERTED_TO_CASE | LOST_TO_FOLLOWUP" }

  - name: InjuryReport
    parent: null
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: system, description: "FK -> Employee.id; injured employee" }
      - { name: exposure_case_id, type: string, source: input, description: "FK -> ExposureCase.id; optional exposure linkage; when present the case must belong to the same employee", constraints: "may be null" }
      - { name: injury_type, type: enum, source: input, description: "NEEDLESTICK | SPLASH | FALL | LIFT | OTHER" }
      - { name: injury_datetime, type: datetime, source: input, description: "When the injury occurred; must not be after the current logical clock time" }
      - { name: origin, type: enum, source: system, description: "MANUAL | PEP_LINKAGE ; PEP_LINKAGE when auto-created by a PEP STARTED transition" }
      - { name: osha_recordable, type: boolean, source: computed, description: "Per osha_recordable_determination" }
      - { name: wc_claim_number, type: string, source: system, description: "Assigned on WC_SUBMITTED: 'WC-' + zero-padded (6) sequence in creation order of submissions; null until submitted" }
      - { name: status, type: enum, source: system, description: "FILED | WC_SUBMITTED | WC_ACCEPTED | WC_DENIED | APPEALED" }

  - name: VaccinationCampaign
    parent: null
    common_fields: true
    fields:
      - { name: vaccine_type, type: enum, source: input, description: "INFLUENZA | COVID | HEP_B | TDAP" }
      - { name: window_start, type: datetime, source: input, description: "Campaign window start; CLOSED interval (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Campaign window end; CLOSED interval (inclusive); must be >= window_start" }
      - { name: department_scope, type: array, source: input, description: "List of department codes in scope, or [\"ALL\"] for house-wide" }
      - { name: status, type: enum, source: system, description: "PLANNED | OPEN | CLOSED" }

  - name: CampaignParticipation
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: system, description: "FK -> VaccinationCampaign.id; parent campaign" }
      - { name: employee_id, type: string, source: system, description: "FK -> Employee.id; participating employee" }
      - { name: status, type: enum, source: system, description: "PENDING | ADMINISTERED | DECLINED | EXEMPTED | DELINQUENT" }
      - { name: administered_at, type: datetime, source: input, description: "Vaccination timestamp; must lie within the campaign CLOSED window; null unless ADMINISTERED" }
      - { name: declined_at, type: datetime, source: system, description: "Logical clock timestamp of declination; null unless DECLINED" }
      - { name: declination_reason, type: string, source: input, description: "Required when declining; null otherwise", constraints: "may be null" }
      - { name: exemption_type, type: enum, source: input, description: "MEDICAL | RELIGIOUS ; required when exempting; null otherwise", constraints: "may be null" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Employee
    initial_state: PREPLACEMENT
    terminal_states: []
    transitions:
      - from: PREPLACEMENT
        to: ACTIVE
        trigger: "system (automatic when a PrePlacementScreening for this employee transitions to CLEARED)"
        actor: system
        preconditions:
          - "Employee.status == PREPLACEMENT"
        side_effects:
          - "Employee.version += 1; updated_at refreshed"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (automatic when a ComplianceHold transitions to ACTIVE and active_hold_count rises from 0 to 1)"
        actor: system
        preconditions:
          - "Employee.status == ACTIVE"
        side_effects:
          - "compliance_posture recomputed per compliance_posture_derivation (ON_HOLD while any hold ACTIVE)"
          - "Employee.version += 1; updated_at refreshed"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (automatic when the last ACTIVE ComplianceHold is RELEASED and active_hold_count falls to 0)"
        actor: system
        preconditions:
          - "Employee.status == SUSPENDED"
          - "active_hold_count == 0 after the release"
        side_effects:
          - "compliance_posture recomputed per compliance_posture_derivation"
          - "Employee.version += 1; updated_at refreshed"

  - entity: PrePlacementScreening
    initial_state: IN_PROGRESS
    terminal_states: [CLEARED, FAILED, VOID]
    transitions:
      - from: IN_PROGRESS
        to: CLEARED
        trigger: "POST /employee-health/pre-placement-screenings/{id}/decide with outcome=CLEARED"
        actor: EmployeeHealthPhysician
        preconditions:
          - "Screening.status == IN_PROGRESS (ERR_INVALID_STATE)"
          - "physical_completed_at and tb_baseline_completed_at are set (ERR_COMPONENT_INCOMPLETE)"
          - "med_eval_completed_at is set when Employee.requires_respirator is true (ERR_COMPONENT_INCOMPLETE)"
          - "For each disease in REQUIRED_TITER_DISEASES [HEP_B, VARICELLA], the latest TiterResult for (employee_id, disease) by resulted_at (tie-break created_at ASC later row loses; i.e. the row with the greatest resulted_at, then greatest created_at, wins) has immunity_status == IMMUNE (ERR_IMMUNITY_NOT_ESTABLISHED)"
        side_effects:
          - "decided_by_user_id / decided_at set"
          - "If Employee.status == PREPLACEMENT: Employee PREPLACEMENT -> ACTIVE"
      - from: IN_PROGRESS
        to: FAILED
        trigger: "POST /employee-health/pre-placement-screenings/{id}/decide with outcome=FAILED"
        actor: EmployeeHealthPhysician
        preconditions:
          - "Screening.status == IN_PROGRESS (ERR_INVALID_STATE)"
        side_effects:
          - "decided_by_user_id / decided_at set; employee remains PREPLACEMENT"
      - from: IN_PROGRESS
        to: VOID
        trigger: "system (automatic when a newer PrePlacementScreening is created for the same employee — create-with-supersede)"
        actor: system
        preconditions:
          - "A new screening for the same employee is being created"
        side_effects:
          - "Superseded screening becomes VOID; linked TiterResult rows remain immutable and still count toward immunity_interpretation"

  - entity: AnnualRequirementCycle
    initial_state: OPEN
    terminal_states: [SATISFIED]
    transitions:
      - from: OPEN
        to: SATISFIED
        trigger: "system (evaluated after every completions call and every clock set: tb_completed_at set AND (Employee.requires_respirator == false OR fit_test_completed_at set))"
        actor: system
        preconditions:
          - "Both required completions present"
        side_effects:
          - "Any ACTIVE ComplianceHold with cycle_id == this cycle becomes releasable (release still requires explicit call)"
      - from: OPEN
        to: OVERDUE
        trigger: "system (on POST /_clock/set_current_utc when now > tb_due_date and not satisfied; or now > fit_test_due_date when fit test required and not satisfied)"
        actor: system
        preconditions:
          - "now > tb_due_date (strict) while tb_completed_at null, or requires_respirator and now > fit_test_due_date (strict) while fit_test_completed_at null"
        side_effects:
          - "Auto-create ComplianceHold ACTIVE with reason TB_OVERDUE (TB missing) and/or FIT_TEST_OVERDUE (fit test missing), cycle_id set (CASCADE link 2)"
          - "Each new ACTIVE hold increments Employee.active_hold_count by 1 (CASCADE link 3 begins)"
          - "If Employee.status == ACTIVE and active_hold_count rose above 0: Employee ACTIVE -> SUSPENDED, posture ON_HOLD (CASCADE link 3 completes)"
      - from: OVERDUE
        to: SATISFIED
        trigger: "system (same satisfaction evaluation as OPEN -> SATISFIED; late completion is allowed)"
        actor: system
        preconditions:
          - "Both required completions present"
        side_effects:
          - "Existing cycle-linked ACTIVE holds are NOT auto-released; release remains an explicit ComplianceOfficer action"

  - entity: ComplianceHold
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /employee-health/compliance-holds/{id}/release"
        actor: ComplianceOfficer
        preconditions:
          - "Hold.status == ACTIVE (ERR_HOLD_NOT_ACTIVE)"
          - "For TB_OVERDUE / FIT_TEST_OVERDUE holds: linked AnnualRequirementCycle.status == SATISFIED (ERR_UNDERLYING_REQUIREMENT_UNMET)"
          - "For CAMPAIGN_DELINQUENT holds: linked CampaignParticipation.status in {ADMINISTERED, DECLINED, EXEMPTED} (ERR_UNDERLYING_REQUIREMENT_UNMET)"
        side_effects:
          - "released_at / released_by_user_id set"
          - "Employee.active_hold_count -= 1"
          - "If active_hold_count reaches 0 and Employee.status == SUSPENDED: Employee SUSPENDED -> ACTIVE"
          - "Employee.compliance_posture recomputed per compliance_posture_derivation"

  - entity: ExposureCase
    initial_state: "case_status=REPORTED, source_test_status=(CONSENT_PENDING if source_known else NOT_REQUIRED)"
    terminal_states: [CLOSED, SEROCONVERTED]
    note: "Two parallel dimensions on one entity: case_status and source_test_status evolve independently; transitions below are grouped by dimension."
    transitions:
      - from: "case_status REPORTED"
        to: "case_status EVALUATION"
        trigger: "POST /employee-health/exposure-cases/{id}/transition with to_state=EVALUATION"
        actor: EmployeeHealthPhysician
        preconditions:
          - "case_status == REPORTED (ERR_INVALID_STATE)"
        side_effects: []
      - from: "case_status EVALUATION"
        to: "case_status MANAGEMENT"
        trigger: "POST /employee-health/exposure-cases/{id}/transition with to_state=MANAGEMENT"
        actor: EmployeeHealthPhysician
        preconditions:
          - "case_status == EVALUATION (ERR_INVALID_STATE)"
          - "source_test_status in {NOT_REQUIRED, RESULTED, CONSENT_DECLINED, WAIVED_UNABLE} (ERR_SOURCE_TESTING_UNRESOLVED)"
        side_effects: []
      - from: "case_status MANAGEMENT"
        to: "case_status CLOSED"
        trigger: "POST /employee-health/exposure-cases/{id}/transition with to_state=CLOSED"
        actor: EmployeeHealthPhysician
        preconditions:
          - "case_status == MANAGEMENT (ERR_INVALID_STATE)"
          - "No SerologyFollowUp of this case in SCHEDULED, DUE, or OVERDUE (ERR_CASE_CLOSE_BLOCKED)"
          - "Every PEPRegimen of this case in {COMPLETED, DECLINED, WINDOW_EXPIRED} (ERR_CASE_CLOSE_BLOCKED)"
          - "No WorkRestriction with exposure_case_id == this case in ACTIVE (ERR_CASE_CLOSE_BLOCKED)"
        side_effects: []
      - from: "case_status REPORTED | EVALUATION | MANAGEMENT"
        to: "case_status SEROCONVERTED"
        trigger: "system (automatic when a SerologyFollowUp of this case with milestone != BASELINE records result POSITIVE)"
        actor: system
        preconditions:
          - "Triggered follow-up has milestone in {WEEK_6, WEEK_12, MONTH_6} and result POSITIVE (CASCADE B link 1)"
        side_effects:
          - "Auto-create WorkRestriction FULL_EXCLUSION, start_date = follow-up resulted_at, end_date null, origin SEROCONVERSION (CASCADE B link 2)"
          - "Employee.open_restriction_count += 1; compliance_posture recomputed -> WORK_EXCLUDED (CASCADE B link 3)"
      - from: "source_test_status CONSENT_PENDING"
        to: "source_test_status CONSENT_GRANTED"
        trigger: "POST /employee-health/exposure-cases/{id}/source-testing with action=RECORD_CONSENT, outcome=CONSENT_GRANTED"
        actor: EmployeeHealthNurse
        preconditions:
          - "source_test_status == CONSENT_PENDING (ERR_INVALID_STATE)"
          - "acting X-User-ID != recorded_by_user_id (ERR_SOD_SOURCE_CONSENT — segregation of duties)"
        side_effects:
          - "consent_recorded_by_user_id set"
      - from: "source_test_status CONSENT_PENDING"
        to: "source_test_status CONSENT_DECLINED"
        trigger: "POST /employee-health/exposure-cases/{id}/source-testing with action=RECORD_CONSENT, outcome=CONSENT_DECLINED"
        actor: EmployeeHealthNurse
        preconditions:
          - "source_test_status == CONSENT_PENDING (ERR_INVALID_STATE)"
          - "acting X-User-ID != recorded_by_user_id (ERR_SOD_SOURCE_CONSENT)"
        side_effects:
          - "consent_recorded_by_user_id set"
      - from: "source_test_status CONSENT_PENDING"
        to: "source_test_status WAIVED_UNABLE"
        trigger: "POST /employee-health/exposure-cases/{id}/source-testing with action=RECORD_CONSENT, outcome=WAIVED_UNABLE"
        actor: EmployeeHealthNurse
        preconditions:
          - "source_test_status == CONSENT_PENDING (ERR_INVALID_STATE)"
          - "acting X-User-ID != recorded_by_user_id (ERR_SOD_SOURCE_CONSENT)"
        side_effects:
          - "consent_recorded_by_user_id set"
      - from: "source_test_status CONSENT_GRANTED"
        to: "source_test_status RESULTED"
        trigger: "POST /employee-health/exposure-cases/{id}/source-testing with action=RECORD_RESULT"
        actor: EmployeeHealthNurse
        preconditions:
          - "source_test_status == CONSENT_GRANTED (ERR_INVALID_STATE)"
          - "hiv_result, hbv_result, hcv_result each in {NEGATIVE, POSITIVE, INDETERMINATE} (ERR_INVALID_ENUM); source_resulted_at <= now (ERR_FUTURE_RESULT_DATE)"
        side_effects:
          - "If hiv_result == POSITIVE: pep_required = true; if no PEPRegimen exists for this case, auto-create one RECOMMENDED with window_deadline recomputed from exposure_datetime (window may already be expired — it will flip to WINDOW_EXPIRED at the next clock set)"

  - entity: PEPRegimen
    initial_state: RECOMMENDED
    terminal_states: [COMPLETED, DECLINED, WINDOW_EXPIRED]
    transitions:
      - from: RECOMMENDED
        to: STARTED
        trigger: "POST /employee-health/pep-regimens/{id}/transition with to_state=STARTED"
        actor: EmployeeHealthPhysician
        preconditions:
          - "status == RECOMMENDED (ERR_INVALID_STATE)"
          - "now <= window_deadline — INCLUSIVE boundary (ERR_PEP_WINDOW_EXPIRED)"
          - "started_at >= ExposureCase.exposure_datetime and started_at <= now (ERR_COMPLETION_OUT_OF_RANGE)"
        side_effects:
          - "started_at set"
          - "Auto-create SerologyFollowUp rows for milestones WEEK_6, WEEK_12, MONTH_6 (SCHEDULED) per serology_schedule"
          - "Auto-create InjuryReport origin=PEP_LINKAGE, injury_type=NEEDLESTICK, injury_datetime=ExposureCase.exposure_datetime, status FILED, linked exposure_case_id (workers' compensation linkage)"
      - from: STARTED
        to: COMPLETED
        trigger: "POST /employee-health/pep-regimens/{id}/transition with to_state=COMPLETED"
        actor: EmployeeHealthPhysician
        preconditions:
          - "status == STARTED (ERR_INVALID_STATE)"
          - "now >= started_at + PEP_COURSE_DAYS (28 days) — INCLUSIVE boundary (ERR_PEP_COURSE_INCOMPLETE)"
        side_effects: []
      - from: RECOMMENDED
        to: DECLINED
        trigger: "POST /employee-health/pep-regimens/{id}/transition with to_state=DECLINED, acting as the exposed StaffEmployee themself (X-User-ID == case.employee_id)"
        actor: StaffEmployee
        preconditions:
          - "status == RECOMMENDED (ERR_INVALID_STATE)"
          - "acting X-User-ID == the case's employee_id (ERR_OWNERSHIP_REQUIRED — employee consent is self-only)"
        side_effects: []
      - from: RECOMMENDED
        to: WINDOW_EXPIRED
        trigger: "system (on POST /_clock/set_current_utc when now > window_deadline — STRICT boundary — and status still RECOMMENDED)"
        actor: system
        preconditions:
          - "now > window_deadline"
        side_effects: []

  - entity: SerologyFollowUp
    initial_state: SCHEDULED
    terminal_states: [RESULTED, WAIVED]
    transitions:
      - from: SCHEDULED
        to: DUE
        trigger: "system (on POST /_clock/set_current_utc when now >= window_open — INCLUSIVE boundary)"
        actor: system
        preconditions:
          - "now >= window_open"
        side_effects: []
      - from: DUE
        to: OVERDUE
        trigger: "system (on POST /_clock/set_current_utc when now > window_close — STRICT boundary)"
        actor: system
        preconditions:
          - "now > window_close"
        side_effects: []
      - from: DUE
        to: RESULTED
        trigger: "POST /employee-health/serology-follow-ups/{id}/transition with to_state=RESULTED"
        actor: EmployeeHealthNurse
        preconditions:
          - "status in {DUE, OVERDUE} (ERR_FOLLOWUP_NOT_DUE)"
          - "result in {NEGATIVE, POSITIVE, INDETERMINATE}; resulted_at <= now and resulted_at >= ExposureCase.exposure_datetime (ERR_COMPLETION_OUT_OF_RANGE)"
        side_effects:
          - "If result == POSITIVE and milestone != BASELINE: CASCADE B — case -> SEROCONVERTED, auto WorkRestriction FULL_EXCLUSION, posture WORK_EXCLUDED"
      - from: OVERDUE
        to: RESULTED
        trigger: "POST /employee-health/serology-follow-ups/{id}/transition with to_state=RESULTED"
        actor: EmployeeHealthNurse
        preconditions:
          - "status in {DUE, OVERDUE} (ERR_FOLLOWUP_NOT_DUE)"
          - "result in {NEGATIVE, POSITIVE, INDETERMINATE}; resulted_at <= now and resulted_at >= ExposureCase.exposure_datetime (ERR_COMPLETION_OUT_OF_RANGE)"
        side_effects:
          - "If result == POSITIVE and milestone != BASELINE: CASCADE B"
      - from: DUE
        to: WAIVED
        trigger: "POST /employee-health/serology-follow-ups/{id}/transition with to_state=WAIVED"
        actor: EmployeeHealthPhysician
        preconditions:
          - "status in {DUE, OVERDUE} (ERR_FOLLOWUP_NOT_DUE)"
          - "reason present and length >= 10 characters (ERR_INSUFFICIENT_JUSTIFICATION)"
        side_effects: []
      - from: OVERDUE
        to: WAIVED
        trigger: "POST /employee-health/serology-follow-ups/{id}/transition with to_state=WAIVED"
        actor: EmployeeHealthPhysician
        preconditions:
          - "status in {DUE, OVERDUE} (ERR_FOLLOWUP_NOT_DUE)"
          - "reason present and length >= 10 characters (ERR_INSUFFICIENT_JUSTIFICATION)"
        side_effects: []

  - entity: WorkRestriction
    initial_state: ACTIVE
    terminal_states: [LIFTED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: LIFTED
        trigger: "system (automatic when a ReturnToWorkClearance for this restriction is decided CLEARED)"
        actor: system
        preconditions:
          - "Clearance outcome == CLEARED"
        side_effects:
          - "Employee.open_restriction_count -= 1; compliance_posture recomputed"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (on POST /_clock/set_current_utc when end_date is not null and now >= end_date — the half-open interval [start_date, end_date) has fully elapsed)"
        actor: system
        preconditions:
          - "end_date != null and now >= end_date"
        side_effects:
          - "Employee.open_restriction_count -= 1; compliance_posture recomputed"

  - entity: ReturnToWorkClearance
    initial_state: PENDING
    terminal_states: [CLEARED, DENIED]
    transitions:
      - from: PENDING
        to: CLEARED
        trigger: "POST /employee-health/return-to-work-clearances/{id}/decide with outcome=CLEARED"
        actor: EmployeeHealthPhysician
        preconditions:
          - "Clearance.status == PENDING (ERR_INVALID_STATE)"
          - "Linked WorkRestriction.status == ACTIVE (ERR_RESTRICTION_NOT_ACTIVE)"
        side_effects:
          - "decided_by_user_id / decided_at / decision_note set"
          - "WorkRestriction ACTIVE -> LIFTED; Employee.open_restriction_count -= 1; posture recomputed"
      - from: PENDING
        to: DENIED
        trigger: "POST /employee-health/return-to-work-clearances/{id}/decide with outcome=DENIED"
        actor: EmployeeHealthPhysician
        preconditions:
          - "Clearance.status == PENDING (ERR_INVALID_STATE)"
          - "Linked WorkRestriction.status == ACTIVE (ERR_RESTRICTION_NOT_ACTIVE)"
        side_effects:
          - "decided_by_user_id / decided_at / decision_note set; restriction remains ACTIVE"

  - entity: CommunicableEvent
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: TRACING
        trigger: "POST /employee-health/communicable-events/{id}/advance with to_state=TRACING"
        actor: SafetyOfficer
        preconditions:
          - "status == OPEN (ERR_INVALID_STATE)"
        side_effects: []
      - from: TRACING
        to: MONITORING
        trigger: "POST /employee-health/communicable-events/{id}/advance with to_state=MONITORING"
        actor: SafetyOfficer
        preconditions:
          - "status == TRACING (ERR_INVALID_STATE)"
        side_effects: []
      - from: MONITORING
        to: ESCALATED
        trigger: "system (automatic when one of this event's ExposureContact rows transitions to CONVERTED_TO_CASE)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ESCALATED
        to: MONITORING
        trigger: "POST /employee-health/communicable-events/{id}/advance with to_state=MONITORING"
        actor: SafetyOfficer
        preconditions:
          - "status == ESCALATED (ERR_INVALID_STATE)"
        side_effects: []
      - from: MONITORING
        to: CLOSED
        trigger: "POST /employee-health/communicable-events/{id}/advance with to_state=CLOSED"
        actor: SafetyOfficer
        preconditions:
          - "status == MONITORING (ERR_INVALID_STATE)"
          - "All ExposureContact rows of this event in {CLEARED, CONVERTED_TO_CASE, LOST_TO_FOLLOWUP} (ERR_EVENT_CLOSE_BLOCKED)"
        side_effects: []

  - entity: ExposureContact
    initial_state: MONITORING
    terminal_states: [CLEARED, CONVERTED_TO_CASE, LOST_TO_FOLLOWUP]
    transitions:
      - from: MONITORING
        to: CLEARED
        trigger: "system (on POST /_clock/set_current_utc when now > monitoring_end — STRICT boundary — and symptom_onset_reported == false)"
        actor: system
        preconditions:
          - "now > monitoring_end and symptom_onset_reported == false"
        side_effects: []
      - from: MONITORING
        to: CONVERTED_TO_CASE
        trigger: "POST /employee-health/exposure-contacts/{id}/transition with to_state=CONVERTED_TO_CASE"
        actor: EmployeeHealthNurse
        preconditions:
          - "status == MONITORING (ERR_INVALID_STATE)"
          - "symptom_onset_reported == true (ERR_NO_SYMPTOMS_REPORTED)"
        side_effects:
          - "Parent CommunicableEvent: if status == MONITORING -> ESCALATED"
          - "Auto-create WorkRestriction FULL_EXCLUSION for contact_employee_id, start_date = now, end_date null, origin CONTACT_CONVERSION; Employee.open_restriction_count += 1; posture recomputed"
      - from: MONITORING
        to: LOST_TO_FOLLOWUP
        trigger: "POST /employee-health/exposure-contacts/{id}/transition with to_state=LOST_TO_FOLLOWUP"
        actor: SafetyOfficer
        preconditions:
          - "status == MONITORING (ERR_INVALID_STATE)"
        side_effects: []

  - entity: InjuryReport
    initial_state: FILED
    terminal_states: [WC_ACCEPTED]
    transitions:
      - from: FILED
        to: WC_SUBMITTED
        trigger: "POST /employee-health/injury-reports/{id}/transition with to_state=WC_SUBMITTED"
        actor: SafetyOfficer
        preconditions:
          - "status == FILED (ERR_INVALID_STATE)"
        side_effects:
          - "wc_claim_number assigned: 'WC-' + zero-padded 6-digit sequence number counting WC_SUBMITTED transitions in order of occurrence (1-based)"
      - from: WC_SUBMITTED
        to: WC_ACCEPTED
        trigger: "POST /employee-health/injury-reports/{id}/transition with to_state=WC_ACCEPTED"
        actor: SafetyOfficer
        preconditions:
          - "status in {WC_SUBMITTED, APPEALED} (ERR_INVALID_STATE)"
        side_effects: []
      - from: WC_SUBMITTED
        to: WC_DENIED
        trigger: "POST /employee-health/injury-reports/{id}/transition with to_state=WC_DENIED"
        actor: SafetyOfficer
        preconditions:
          - "status in {WC_SUBMITTED, APPEALED} (ERR_INVALID_STATE)"
        side_effects: []
      - from: APPEALED
        to: WC_ACCEPTED
        trigger: "POST /employee-health/injury-reports/{id}/transition with to_state=WC_ACCEPTED"
        actor: SafetyOfficer
        preconditions:
          - "status in {WC_SUBMITTED, APPEALED} (ERR_INVALID_STATE)"
        side_effects: []
      - from: APPEALED
        to: WC_DENIED
        trigger: "POST /employee-health/injury-reports/{id}/transition with to_state=WC_DENIED"
        actor: SafetyOfficer
        preconditions:
          - "status in {WC_SUBMITTED, APPEALED} (ERR_INVALID_STATE)"
        side_effects: []
      - from: WC_DENIED
        to: APPEALED
        trigger: "POST /employee-health/injury-reports/{id}/transition with to_state=APPEALED"
        actor: SafetyOfficer
        preconditions:
          - "status == WC_DENIED (ERR_INVALID_STATE)"
        side_effects: []
        note: "Cyclic loop: WC_DENIED -> APPEALED -> WC_DENIED may repeat without bound"

  - entity: VaccinationCampaign
    initial_state: PLANNED
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNED
        to: OPEN
        trigger: "POST /employee-health/vaccination-campaigns/{id}/transition with to_state=OPEN"
        actor: ComplianceOfficer
        preconditions:
          - "status == PLANNED (ERR_INVALID_STATE)"
        side_effects:
          - "Auto-create CampaignParticipation PENDING for every Employee with status == ACTIVE and (department_scope contains 'ALL' or Employee.department in department_scope); creation order deterministic: Employee.created_at ASC, tie-break Employee.employee_ref ASC"
      - from: OPEN
        to: CLOSED
        trigger: "POST /employee-health/vaccination-campaigns/{id}/transition with to_state=CLOSED"
        actor: ComplianceOfficer
        preconditions:
          - "status == OPEN (ERR_INVALID_STATE)"
          - "now > window_end — STRICT: the CLOSED window [window_start, window_end] must have fully elapsed (ERR_CAMPAIGN_WINDOW_NOT_ENDED)"
        side_effects:
          - "CASCADE A link 1: every CampaignParticipation still PENDING -> DELINQUENT"
          - "CASCADE A link 2: each DELINQUENT participation auto-creates ComplianceHold ACTIVE with reason CAMPAIGN_DELINQUENT, participation_id set"
          - "CASCADE A link 3: each new hold increments Employee.active_hold_count; employees in ACTIVE with count rising above 0 -> SUSPENDED, posture ON_HOLD"

  - entity: CampaignParticipation
    initial_state: PENDING
    terminal_states: [ADMINISTERED, DECLINED, EXEMPTED, DELINQUENT]
    transitions:
      - from: PENDING
        to: ADMINISTERED
        trigger: "POST /employee-health/campaign-participations/{id}/transition with to_state=ADMINISTERED"
        actor: EmployeeHealthNurse
        preconditions:
          - "status == PENDING (ERR_PARTICIPATION_NOT_PENDING)"
          - "administered_at within campaign CLOSED window [window_start, window_end] — both endpoints INCLUSIVE (ERR_ADMINISTER_OUTSIDE_WINDOW)"
          - "Employee.status == ACTIVE (ERR_EMPLOYEE_NOT_ACTIVE — posture gate)"
        side_effects:
          - "administered_at set"
      - from: PENDING
        to: DECLINED
        trigger: "POST /employee-health/campaign-participations/{id}/transition with to_state=DECLINED, acting as the StaffEmployee themself"
        actor: StaffEmployee
        preconditions:
          - "status == PENDING (ERR_PARTICIPATION_NOT_PENDING)"
          - "acting X-User-ID == participation.employee_id (ERR_OWNERSHIP_REQUIRED)"
          - "declination_reason present and non-empty (ERR_DECLINATION_REASON_REQUIRED)"
        side_effects:
          - "declined_at set from logical clock"
      - from: PENDING
        to: EXEMPTED
        trigger: "POST /employee-health/campaign-participations/{id}/transition with to_state=EXEMPTED"
        actor: EmployeeHealthPhysician
        preconditions:
          - "status == PENDING (ERR_PARTICIPATION_NOT_PENDING)"
          - "exemption_type in {MEDICAL, RELIGIOUS} (ERR_INVALID_ENUM)"
        side_effects: []
      - from: PENDING
        to: DELINQUENT
        trigger: "system (automatic when parent VaccinationCampaign transitions OPEN -> CLOSED — CASCADE A link 1)"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE A link 2: auto-create ComplianceHold ACTIVE reason CAMPAIGN_DELINQUENT"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: screening-create-stale-employee
    parent_entity: Employee
    write_endpoint: "POST /employee-health/employees/{id}/pre-placement-screenings"
    occ_field: "expected_employee_version"
    description: |
      Creating a PrePlacementScreening against an Employee whose version has
      advanced since the client last observed it is rejected. Creating a
      screening legitimately supersedes (VOIDs) any existing IN_PROGRESS
      screening for that employee, so a writer holding a stale employee
      version must not be allowed to void a screening it never observed.
    error_id: ERR_STALE_EMPLOYEE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: immunity_interpretation
    trigger: "TiterResult creation"
    algorithm: threshold
    formula: |
      if assay_type == QUANTITATIVE:
        threshold = TITER_THRESHOLD[disease]
        immunity_status = IMMUNE if numeric_value >= threshold else NON_IMMUNE
        # INCLUSIVE boundary: numeric_value == threshold is IMMUNE
      else (QUALITATIVE):
        immunity_status = REACTIVE -> IMMUNE ; NON_REACTIVE -> NON_IMMUNE ; EQUIVOCAL -> EQUIVOCAL
        # numeric_value is IGNORED for QUALITATIVE even when supplied
    input_set: "the new TiterResult row only"
    constants:
      TITER_THRESHOLD: { HEP_B: 10.0, MEASLES: 1.0, MUMPS: 1.0, RUBELLA: 10.0, VARICELLA: 1.0 }
      REQUIRED_TITER_DISEASES: [HEP_B, VARICELLA]
    precision: "threshold comparison on the raw numeric_value as supplied; no rounding"
    variants:
      - name: quantitative_threshold
        when: "assay_type == QUANTITATIVE"
        difference: "numeric_value compared against TITER_THRESHOLD; 8.0 mIU/mL HEP_B -> NON_IMMUNE"
      - name: qualitative_label
        when: "assay_type == QUALITATIVE"
        difference: "label alone decides; REACTIVE with numeric_value 8.0 supplied -> IMMUNE (same numeric data, opposite outcome vs quantitative_threshold)"

  - name: cycle_due_date
    trigger: "AnnualRequirementCycle creation"
    algorithm: chronological
    formula: |
      if cycle_mode == CALENDAR_YEAR:
        tb_due_date = (cycle_year)-12-31T23:59:59Z
      else (ROLLING_ANNIVERSARY):
        anchor = greatest tb_completed_at over the employee's OTHER cycles with status == SATISFIED;
                 if none exists, anchor = Employee.hire_date
        tb_due_date = anchor + 12 months (calendar-month arithmetic, same day-of-month)
      fit_test_due_date = tb_due_date when Employee.requires_respirator else null
    input_set: "employee's other AnnualRequirementCycle rows with status == SATISFIED (any cycle_year), plus Employee.hire_date"
    constants:
      ANNIVERSARY_MONTHS: 12
    precision: "timestamp arithmetic, no rounding"
    variants:
      - name: calendar_year
        when: "cycle_mode == CALENDAR_YEAR"
        difference: "due date pinned to cycle_year-12-31T23:59:59Z regardless of completion history"
      - name: rolling_anniversary
        when: "cycle_mode == ROLLING_ANNIVERSARY"
        difference: "due date = anchor + 12 months; same employee with hire_date 2025-03-10 and no prior SATISFIED cycle -> 2026-03-10T00:00:00Z, NOT 2026-12-31"

  - name: exposure_risk_classification
    trigger: "ExposureCase creation (intake)"
    algorithm: constraint_propagation
    formula: |
      if body_fluid == NON_INFECTIOUS: risk = LOW
      elif exposure_type == PERCUTANEOUS and body_fluid == BLOOD and source_known: risk = HIGH
      elif exposure_type == PERCUTANEOUS and body_fluid == BLOOD and not source_known: risk = MEDIUM
      elif exposure_type in {MUCOUS_MEMBRANE, BITE} and body_fluid == BLOOD: risk = MEDIUM
      elif exposure_type == PERCUTANEOUS and body_fluid == OTHER_POTENTIALLY_INFECTIOUS: risk = MEDIUM
      elif exposure_type in {MUCOUS_MEMBRANE, BITE} and body_fluid == OTHER_POTENTIALLY_INFECTIOUS: risk = LOW
      else (SKIN_CONTACT any fluid): risk = LOW
      pep_required = (risk in {HIGH, MEDIUM})
      if pep_required: auto-create one PEPRegimen RECOMMENDED (medication = HIV_3DRUG default),
        window_deadline = exposure_datetime + PEP_WINDOW_HOURS
      Always auto-create one SerologyFollowUp milestone=BASELINE (SCHEDULED).
    input_set: "the new ExposureCase's exposure_type, body_fluid, source_known"
    constants:
      PEP_WINDOW_HOURS: 72
    precision: "enum branch selection; no numeric rounding"
    note: ">=3 inputs with nested non-linear branches on entity state (source_known); identical exposure_type/body_fluid pairs classify differently by source_known"

  - name: campaign_coverage_rate
    trigger: "GET /employee-health/vaccination-campaigns/{id}/coverage"
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER PINNED: per-department first, then average.
      # Step 1: group the campaign's CampaignParticipation rows by Employee.department.
      # Step 2: per department d with at least one participation:
      #   dept_rate[d] = round_half_up(100.0 * count(status in {ADMINISTERED, EXEMPTED}) / count(all), 2)
      # Step 3: coverage_rate = round_half_up(mean of dept_rate values, 2)
      # The alternative order (aggregate all rows, single division, single rounding)
      # is FORBIDDEN: it produces different hundredths for the same data.
    input_set: "all CampaignParticipation rows of the campaign, every status; departments with zero participations excluded from the mean"
    constants:
      COVERAGE_DP: 2
    precision: "2 decimal places, round_half_up at BOTH steps (per-department, then mean)"
    variants: []

  - name: pep_window_assessment
    trigger: "PEPRegimen RECOMMENDED -> STARTED transition; auto-expiry evaluation on clock set"
    algorithm: threshold
    formula: |
      window_deadline = ExposureCase.exposure_datetime + 72 hours
      STARTED eligible iff now <= window_deadline          # INCLUSIVE
      auto WINDOW_EXPIRED fires iff now > window_deadline  # STRICT
    input_set: "the PEPRegimen and its ExposureCase.exposure_datetime"
    constants:
      PEP_WINDOW_HOURS: 72
      PEP_COURSE_DAYS: 28
    precision: "second precision"
    variants: []

  - name: serology_schedule
    trigger: "ExposureCase creation (BASELINE) and PEPRegimen STARTED (WEEK_6, WEEK_12, MONTH_6)"
    algorithm: interval_merge
    formula: |
      offsets: BASELINE = exposure_datetime ; WEEK_6 = +42d ; WEEK_12 = +84d ; MONTH_6 = +183d
      window_open  = scheduled_date - 7d   (BASELINE: window_open = exposure_datetime)
      window_close = scheduled_date + 28d
      status evaluation on clock set:
        SCHEDULED -> DUE iff now >= window_open   # INCLUSIVE
        DUE -> OVERDUE iff now > window_close     # STRICT
    input_set: "SerologyFollowUp rows of the case in non-terminal status"
    constants:
      WEEK_6_DAYS: 42
      WEEK_12_DAYS: 84
      MONTH_6_DAYS: 183
      WINDOW_OPEN_LEAD_DAYS: 7
      WINDOW_CLOSE_LAG_DAYS: 28
    precision: "day arithmetic on timestamps; second precision at evaluation"
    variants: []

  - name: contact_monitoring_window
    trigger: "ExposureContact creation; clear evaluation on clock set"
    algorithm: interval_merge
    formula: |
      infectious_start (on event) = onset_date - DISEASE_INCUBATION_OFFSET_DAYS[disease]
      monitoring_start = contact_date
      monitoring_end   = contact_date + DISEASE_MONITORING_WINDOW_DAYS[disease]
      auto CLEARED iff now > monitoring_end AND symptom_onset_reported == false  # STRICT
      at now == monitoring_end the contact remains MONITORING
    input_set: "ExposureContact rows in MONITORING for events not CLOSED"
    constants:
      DISEASE_INCUBATION_OFFSET_DAYS: { COVID: 2, INFLUENZA: 1, PERTUSSIS: 7, NOROVIRUS: 1, MEASLES: 4 }
      DISEASE_MONITORING_WINDOW_DAYS: { COVID: 14, INFLUENZA: 7, PERTUSSIS: 21, NOROVIRUS: 3, MEASLES: 21 }
    precision: "day arithmetic; second precision at evaluation"
    variants: []

  - name: compliance_posture_derivation
    trigger: "any change to Employee.active_hold_count, Employee.open_restriction_count, or the status/type of the employee's WorkRestriction rows"
    algorithm: constraint_propagation
    formula: |
      # EVALUATION ORDER PINNED (holds dominate restrictions):
      if active_hold_count > 0:                                    posture = ON_HOLD
      elif any ACTIVE WorkRestriction with restriction_type == FULL_EXCLUSION: posture = WORK_EXCLUDED
      elif open_restriction_count > 0:                             posture = RESTRICTED_DUTY
      else:                                                        posture = CLEAR
      # Employee.status is derived on the hold axis only:
      status = SUSPENDED iff active_hold_count > 0 else (ACTIVE if previously SUSPENDED/ACTIVE)
      # status never leaves PREPLACEMENT via this derivation (screening drives that)
    input_set: "ComplianceHold rows (status ACTIVE) and WorkRestriction rows (status ACTIVE) of the employee"
    constants: {}
    precision: "integer counts; no rounding"
    variants: []

  - name: osha_recordable_determination
    trigger: "InjuryReport creation; PEPRegimen STARTED/COMPLETED transition on a linked case"
    algorithm: constraint_propagation
    formula: |
      recordable = (injury_type == NEEDLESTICK)
                OR (exposure_case_id present AND ExposureCase.risk_classification == HIGH)
                OR (exposure_case_id present AND exists PEPRegimen of the case with status in {STARTED, COMPLETED})
      Recomputed on linkage events; stored on the InjuryReport.
    input_set: "the InjuryReport, its linked ExposureCase (if any), that case's PEPRegimen rows"
    constants: {}
    precision: "boolean"
    variants: []

  - name: annual_compliance_satisfaction
    trigger: "completions call; clock set"
    algorithm: aggregation
    formula: |
      satisfied = (tb_completed_at != null) AND (Employee.requires_respirator == false OR fit_test_completed_at != null)
      OPEN -> OVERDUE iff NOT satisfied AND (now > tb_due_date OR (requires_respirator AND now > fit_test_due_date))   # STRICT: on the due date itself the cycle stays OPEN
      (OPEN|OVERDUE) -> SATISFIED iff satisfied
    input_set: "the AnnualRequirementCycle row and its Employee.requires_respirator"
    constants: {}
    precision: "second precision, strict-greater overdue boundary"
    variants: []

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is a declared role"
    error_id: ERR_MISSING_AUTH_CONTEXT
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Acting role is permitted for this endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 2.5
    category: auth
    check: "StaffEmployee self-scope: X-User-ID must equal the target employee id (PEP DECLINED, participation DECLINED, report-symptom as StaffEmployee); consent recorder must differ from intake recorder (SoD)"
    error_id: "ERR_OWNERSHIP_REQUIRED / ERR_SOD_SOURCE_CONSENT"
    http_status: 403
    applies_to: "POST /employee-health/pep-regimens/{id}/transition (DECLINED), POST /employee-health/campaign-participations/{id}/transition (DECLINED), POST /employee-health/exposure-contacts/{id}/report-symptom, POST /employee-health/exposure-cases/{id}/source-testing (RECORD_CONSENT)"
  - priority: 3
    category: existence
    check: "Path ids exist, validated left-to-right through the path"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 3.5
    category: state
    check: "OCC: expected_employee_version must equal Employee.version (before any business check)"
    error_id: ERR_STALE_EMPLOYEE_VERSION
    http_status: 412
    applies_to: "POST /employee-health/employees/{id}/pre-placement-screenings"
  - priority: 4
    category: state
    check: "Target resource is in a valid from-state for the requested transition/action (incl. ERR_INVALID_STATE, ERR_HOLD_NOT_ACTIVE, ERR_PARTICIPATION_NOT_PENDING, ERR_CAMPAIGN_WINDOW_NOT_ENDED, ERR_FOLLOWUP_NOT_DUE, ERR_RESTRICTION_NOT_ACTIVE, ERR_SOURCE_TESTING_UNRESOLVED, ERR_CASE_CLOSE_BLOCKED, ERR_EVENT_CLOSE_BLOCKED, ERR_CYCLE_ALREADY_OPEN, ERR_NO_SYMPTOMS_REPORTED)"
    error_id: "state-family errors"
    http_status: 409
    applies_to: "all transition/action endpoints"
  - priority: 5
    category: business_safety
    check: "Safety gates: PEP start within window (ERR_PEP_WINDOW_EXPIRED); PEP course length (ERR_PEP_COURSE_INCOMPLETE); screening clearance components/immunity (ERR_COMPONENT_INCOMPLETE, ERR_IMMUNITY_NOT_ESTABLISHED); fit test only when required (ERR_FIT_TEST_NOT_REQUIRED); employee ACTIVE for vaccination (ERR_EMPLOYEE_NOT_ACTIVE)"
    error_id: "business_safety-family errors"
    http_status: 422
    applies_to: "pep-regimens transition, screenings decide, cycle completions, participations transition"
  - priority: 6
    category: business_referential
    check: "Cross-references cohere: screening_id belongs to the same employee (ERR_SCREENING_EMPLOYEE_MISMATCH); exposure_case_id on restriction/injury belongs to the same employee (ERR_CASE_EMPLOYEE_MISMATCH); contact_employee_id != event index (ERR_SELF_CONTACT); source_patient_ref present iff source_known (ERR_INVALID_REQUEST)"
    error_id: "business_referential-family errors"
    http_status: 422
    applies_to: "titer-results create, work-restrictions create, injury-reports create, contacts create, exposure-cases create"
  - priority: 7
    category: business_temporal
    check: "Timestamps not in the future and inside required windows: resulted_at/completed_at/administered_at/injury_datetime/exposure_datetime <= now (ERR_FUTURE_RESULT_DATE / ERR_COMPLETION_OUT_OF_RANGE / ERR_ADMINISTER_OUTSIDE_WINDOW); contact_date within [infectious_start, now] (ERR_CONTACT_DATE_OUT_OF_RANGE); clock monotonic (ERR_CLOCK_REGRESSION)"
    error_id: "business_temporal-family errors"
    http_status: 422
    applies_to: "all endpoints taking timestamp inputs"
  - priority: 8
    category: business_constraint
    check: "Uniqueness/overlap: one OPEN/OVERDUE cycle per employee covered by state family; WorkRestriction half-open overlap (ERR_WORK_RESTRICTION_OVERLAP); VaccinationCampaign closed-interval overlap per vaccine_type (ERR_CAMPAIGN_WINDOW_OVERLAP); ExposureContact uniqueness per (event, employee) (ERR_DUPLICATE_CONTACT); Employee.employee_ref uniqueness (ERR_DUPLICATE_EMPLOYEE_REF)"
    error_id: "business_constraint-family errors"
    http_status: 409
    applies_to: "creates of restrictions, campaigns, contacts, employees"
  - priority: 9
    category: business_constraint
    check: "Field shape: required fields present, enum members valid, window_end >= window_start, justification/reason lengths"
    error_id: "ERR_INVALID_REQUEST / ERR_INVALID_ENUM / ERR_INSUFFICIENT_JUSTIFICATION / ERR_DECLINATION_REASON_REQUIRED"
    http_status: 400
    applies_to: all

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Startup default is exactly 2026-08-01T00:00:00Z (never wall-clock). to_iso8601 must be strictly after the current logical time (ERR_CLOCK_REGRESSION). Triggers evaluation of ALL time-based auto-transitions: cycle OVERDUE + hold cascade, PEP WINDOW_EXPIRED, serology DUE/OVERDUE, contact CLEARED, restriction EXPIRED."
    roles: [ComplianceOfficer]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime, transitions_applied: integer }"
    side_effects: ["evaluates every clock-driven auto-transition in §1.2"]

  # --- Employees ---
  - method: POST
    path: "/employee-health/employees"
    description: "Register an employee with the health office"
    roles: [EmployeeHealthNurse]
    code: 201
    input: [employee_ref, full_name, job_category, department, hire_date, requires_respirator]
    output: Employee
    side_effects: ["status=PREPLACEMENT", "compliance_posture=CLEAR", "active_hold_count=0", "open_restriction_count=0"]
  - method: GET
    path: "/employee-health/employees"
    description: "List employees; StaffEmployee sees only their own row"
    roles: [EmployeeHealthNurse, EmployeeHealthPhysician, ComplianceOfficer, SafetyOfficer, StaffEmployee]
    code: 200
    input: ["status?", "compliance_posture?", "department?", "limit?", "offset?"]
    output: "Employee[]"
    side_effects: []
  - method: GET
    path: "/employee-health/employees/{id}"
    description: "Read one employee; StaffEmployee may read only their own id (ERR_OWNERSHIP_REQUIRED)"
    roles: [EmployeeHealthNurse, EmployeeHealthPhysician, ComplianceOfficer, SafetyOfficer, StaffEmployee]
    code: 200
    input: []
    output: Employee
    side_effects: []

