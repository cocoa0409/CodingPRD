          A payable carries no project_id of its own: it reaches the project through
          subcontract_id, so an unresolvable subcontract is a 404 and a valid one silently
          establishes the project association. The reverse links are query-only — the swept
          populations of an invoice are discoverable exclusively through the client_invoice_id and
          billed_invoice_id filters, never from the Invoice row itself.
