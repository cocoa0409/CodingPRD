              payload: { project_id: "${proj}", application_type: "ORIGINAL_RELICENSE", expected_project_version: "${pv}", filing_note: "relicense application" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { app: $.data.id, pin_plan: $.data.pinned_study_plan_id, pin_plan_v: $.data.pinned_study_plan_version, pin_burden: $.data.pinned_total_annual_burden_usd, pin_stl: $.data.pinned_settlement_id }
            - call: "POST /relicensing/pme-measures/${wm}/cost-estimate"
              payload: { estimate_note: "definitive estimate after filing" }
              as: Licensee
              as_user_id: "u_lic_b"
              captures: { variant: $.data.cost_estimate_variant }
            - call: "GET /relicensing/projects/${proj}"
              payload: {}
              as: Regulator
              captures: { burden_post: $.data.total_annual_burden_usd, ratio_post: $.data.burden_ratio_pct }
            - call: "GET /relicensing/applications/${app}"
              payload: {}
              as: Regulator
              captures: { pin_burden2: $.data.pinned_total_annual_burden_usd }
            - call: "POST /relicensing/applications/${app}/environmental-review"
              payload: { target_stage: "SCOPING" }
              as: Regulator
            - call: "POST /relicensing/applications/${app}/deficiency"
              payload: { deficiency_note: "update the cost exhibit" }
              as: Regulator
            - call: "POST /relicensing/applications/${app}/cure"
              payload: { cure_note: "definitive cost exhibit filed" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { pin_burden3: $.data.pinned_total_annual_burden_usd, pin_plan3: $.data.pinned_study_plan_id, fs3: $.data.filing_status }
          assert:
            - "${burden_pre} == 68326.80 (preliminary condition measure: cost 57500.00, admin 1150.00, generation value 9676.80)"
            - "${pin_plan} == ${plan}, ${pin_plan_v} == ${plan_v}, ${pin_stl} == null and ${pin_burden} == 68326.80"
            - "${variant} == DEFINITIVE"
            - "${burden_post} == 74971.80 and ${ratio_post} == 0.71 (live ledger moved)"
            - "${pin_burden2} == 68326.80 (the filing snapshot did not follow the ledger)"
            - "${fs3} == UNDER_REVIEW, ${pin_plan3} == ${plan} and ${pin_burden3} == 74971.80 (the cure re-pins from current state)"

      - name: study_listing_filter_and_pagination_interact
        claim_type: pagination_with_filtering
        grounds:
          - endpoints["GET /relicensing/studies"]
          - response_envelope.pagination_fields
        distinguishing_aspect: "The study list carries five filters plus limit/offset, and total_count always describes the filtered set, not the table: starting one study's fieldwork moves a row between two filter buckets without changing any other bucket."
        test_recipe:
          setup:
            - "Project P-9060 with sites S1 and S2 and four studies on one submitted plan: A (S1, FISH_PASSAGE, 2026-09-01 .. 2026-10-01), B (S1, WATER_QUALITY, 2026-11-01 .. 2026-12-01), C (S2, RECREATION, 2026-09-01 .. 2026-10-01), D (S2, CULTURAL, 2026-11-01 .. 2026-12-01); every site has min_rest_buffer_days 0 so the windows are disjoint."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /relicensing/projects"
              payload: { license_number: "P-9060", project_name: "Listing Reach", installed_capacity_mw: 12.0, base_annual_generation_mwh: 250000, license_expiration_date: "2035-06-30" }
              as: Regulator
              captures: { proj: $.data.id }
            - call: "POST /relicensing/sites"
              payload: { project_id: "${proj}", site_code: "S1", river_mile: 1.0, min_rest_buffer_days: 0 }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { s1: $.data.id }
            - call: "POST /relicensing/sites"
              payload: { project_id: "${proj}", site_code: "S2", river_mile: 2.0, min_rest_buffer_days: 0 }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { s2: $.data.id }
            - call: "POST /relicensing/projects/${proj}/pre-application-document"
              payload: { filing_note: "PAD" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/study-plans"
              payload: { project_id: "${proj}", plan_title: "Study Plan 1" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { plan: $.data.id }
            - call: "POST /relicensing/studies"
              payload: { study_plan_id: "${plan}", site_id: "${s1}", resource_category: "FISH_PASSAGE", study_title: "A upstream passage", fieldwork_window_start: "2026-09-01", fieldwork_window_end: "2026-10-01" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { sa: $.data.id }
            - call: "POST /relicensing/studies"
              payload: { study_plan_id: "${plan}", site_id: "${s1}", resource_category: "WATER_QUALITY", study_title: "B dissolved oxygen", fieldwork_window_start: "2026-11-01", fieldwork_window_end: "2026-12-01" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { sb: $.data.id }
            - call: "POST /relicensing/studies"
              payload: { study_plan_id: "${plan}", site_id: "${s2}", resource_category: "RECREATION", study_title: "C recreation use", fieldwork_window_start: "2026-09-01", fieldwork_window_end: "2026-10-01" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { sc: $.data.id }
            - call: "POST /relicensing/studies"
              payload: { study_plan_id: "${plan}", site_id: "${s2}", resource_category: "CULTURAL", study_title: "D ethnographic survey", fieldwork_window_start: "2026-11-01", fieldwork_window_end: "2026-12-01" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { sd: $.data.id }
            - call: "POST /relicensing/study-plans/${plan}/submit"
              payload: { submission_note: "plan for review" }
              as: Licensee
              as_user_id: "u_lic_a"
          trigger:
            - call: "GET /relicensing/studies"
              payload: { study_plan_id: "${plan}", limit: 2, offset: 0 }
              as: Regulator
              captures: { p1: "$.data[0].id" }
            - call: "GET /relicensing/studies"
              payload: { study_plan_id: "${plan}", limit: 2, offset: 2 }
              as: Regulator
              captures: { p3: "$.data[0].id" }
            - call: "GET /relicensing/studies"
              payload: { site_id: "${s1}" }
              as: Regulator
            - call: "GET /relicensing/studies"
              payload: { resource_category: "CULTURAL" }
              as: Regulator
              captures: { only_d: "$.data[0].id" }
            - call: "GET /relicensing/studies"
              payload: { fieldwork_status: "PLANNED" }
              as: Regulator
            - call: "POST /relicensing/studies/${sa}/fieldwork"
              payload: { action: "START" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "GET /relicensing/studies"
              payload: { fieldwork_status: "PLANNED" }
              as: Regulator
            - call: "GET /relicensing/studies"
              payload: { site_id: "${s1}", fieldwork_status: "IN_PROGRESS", limit: 1, offset: 0 }
              as: Regulator
              captures: { in_prog: "$.data[0].id" }
            - call: "GET /relicensing/studies"
              payload: { site_id: "${s2}", fieldwork_status: "IN_PROGRESS" }
              as: Regulator
            - call: "GET /relicensing/studies"
              payload: { study_plan_id: "${plan}", limit: 101, offset: 0 }
              as: Regulator
              captures: { err_limit: $.data.error_id }
          assert:
            - "the first page returns 2 rows with total_count == 4, limit == 2, offset == 0 and has_more == true"
            - "the second page returns 2 rows with total_count == 4, offset == 2 and has_more == false, and ${p1} != ${p3}"
            - "the site_id ${s1} filter returns total_count == 2 (A and B only)"
            - "the CULTURAL filter returns total_count == 1 with ${only_d} == ${sd}"
            - "the first PLANNED filter returns total_count == 4 and the second returns total_count == 3 after A starts"
            - "${in_prog} == ${sa} with total_count == 1 and has_more == false for the S1 plus IN_PROGRESS page"
            - "the S2 plus IN_PROGRESS filter returns total_count == 0"
            - "${err_limit} == ERR_VALIDATION with HTTP 400 (limit above 100 even with filters applied)"

      - name: wqc_condition_cascade_runs_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_layers.cascading_side_effects
          - endpoints["POST /relicensing/water-quality-certifications/{wqc_id}/decision"]
        excluded_because:
          difficulty_instance: transitive_cascade / wqc_condition_issuance_cascades_into_restricted_posture
          rationale: "The named §1.8 instance follows the full four-level chain condition -> measure -> ledger -> posture in one request and asserts every level."

      - name: both_estimate_variants_produce_their_own_numbers
        claim_type: dual_variant_calculation
        grounds:
          - complexity_layers.dual_variant_calculation
          - calculations.pme_cost_and_generation_impact
        excluded_because:
          difficulty_instance: dual_variant_calc / pme_preliminary_vs_definitive_estimate_diverge_on_both_axes
          rationale: "The named §1.8 instance asserts all six output fields under both variants and the signed delta on each axis."

      - name: the_ops_run_checkpoint_advances_the_epoch_once_per_clock_move
        claim_type: ops_run_checkpoint
        grounds:
          - complexity_layers.ops_run_checkpoint
          - endpoints["POST /relicensing/projects/{project_id}/run-compliance-sweep"]
        excluded_because:
          difficulty_instance: transitive_cascade / sweep_overdue_cascades_into_suspended_amendment_application
          rationale: "The named §1.8 instance moves the clock past a due date, runs the sweep and asserts the whole epoch advance: OVERDUE obligations, a COMPLIANCE_FLAGGED order, a FROZEN project and a SUSPENDED application."

      - name: derived_ledger_fields_reconcile_after_a_reversal
        claim_type: derived_field_reconciliation
        grounds:
          - complexity_layers.derived_field_reconciliation
          - calculations.project_burden_ledger
        excluded_because:
          difficulty_instance: compensating_invariant / settlement_withdrawal_restores_the_burden_ledger_exactly
          rationale: "The named §1.8 instance captures every ledger field before execution and after withdrawal and asserts exact restoration with no drift."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: certification_cascade_is_visible_in_the_immediately_following_read
        claim_type: immediate
        grounds:
          - consistency_model.immediate
          - calculations.project_burden_ledger
          - calculations.project_regulatory_posture
        distinguishing_aspect: "There is no lag anywhere: the certification decision response already carries its own final state, and the very next read of the project shows the measure, the recomputed ledger, the infeasibility flag and the RESTRICTED posture that the same request produced."
        test_recipe:
          setup:
            - "Small project P-9061 (base_annual_generation_mwh 10000, gross revenue 420000.00) in STUDY_PHASE with a REQUESTED certification, ledger all zeros and posture OPEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /relicensing/projects"
              payload: { license_number: "P-9061", project_name: "Immediate Reach", installed_capacity_mw: 2.5, base_annual_generation_mwh: 10000, license_expiration_date: "2035-06-30" }
              as: Regulator
              captures: { proj: $.data.id }
            - call: "POST /relicensing/projects/${proj}/pre-application-document"
              payload: { filing_note: "PAD" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/study-plans"
              payload: { project_id: "${proj}", plan_title: "Study Plan 1" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/water-quality-certifications"
              payload: { project_id: "${proj}", certifying_agency_name: "State DEQ" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { wqc: $.data.id }
            - call: "GET /relicensing/projects/${proj}"
              payload: {}
              as: Regulator
              captures: { burden0: $.data.total_annual_burden_usd, posture0: $.data.regulatory_posture, infeas0: $.data.economically_infeasible }
          trigger:
            - call: "POST /relicensing/water-quality-certifications/${wqc}/decision"
              payload: { decision: "ISSUE_WITH_CONDITIONS", conditions: [ { measure_name: "Minimum flow release", resource_category: "WATER_QUALITY", capital_cost_usd: 600000.00, annual_om_cost_usd: 20000.00, construction_start_year: 2026, implementation_months: 6, flow_release_cfs: 40, gross_head_ft: 60, release_days: 120 } ] }
              as: StateCertifier
              as_user_id: "u_state_1"
              captures: { wst: $.data.status, cc: $.data.condition_count, dec: $.data.decided_at }
            - call: "GET /relicensing/projects/${proj}"
              payload: {}
              as: Regulator
              captures: { pwqc: $.data.wqc_status, cost1: $.data.total_pme_annual_cost_usd, gen1: $.data.total_generation_loss_mwh, admin1: $.data.administrative_annual_charge_usd, burden1: $.data.total_annual_burden_usd, ratio1: $.data.burden_ratio_pct, infeas1: $.data.economically_infeasible, posture1: $.data.regulatory_posture }
            - call: "GET /relicensing/pme-measures"
              payload: { project_id: "${proj}", source: "WQC_CONDITION" }
              as: Regulator
              captures: { m1: "$.data[0].id", m1_status: "$.data[0].status", m1_variant: "$.data[0].cost_estimate_variant", m1_cost: "$.data[0].annual_cost_usd" }
            - call: "GET /relicensing/projects/${proj}"
              payload: {}
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { burden2: $.data.total_annual_burden_usd, posture2: $.data.regulatory_posture }
          assert:
            - "${burden0} == 0.00, ${infeas0} == false and ${posture0} == OPEN before the decision"
            - "the decision response itself carries ${wst} == CERTIFIED_WITH_CONDITIONS, ${cc} == 1 and ${dec} == 2026-08-01T00:00:00Z"
            - "the immediately following read shows ${pwqc} == CERTIFIED_WITH_CONDITIONS, ${cost1} == 57500.00, ${gen1} == 230.4 and ${admin1} == 1150.00"
            - "${burden1} == 68326.80, ${ratio1} == 16.27, ${infeas1} == true and ${posture1} == RESTRICTED in that same first read (no second read or delay is needed)"
            - "${m1_status} == INCLUDED, ${m1_variant} == PRELIMINARY and ${m1_cost} == 57500.00 with total_count == 1"
            - "${burden2} == ${burden1} == 68326.80 and ${posture2} == ${posture1} == RESTRICTED (repeat reads are stable, not converging)"
