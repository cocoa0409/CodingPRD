          - validations.priority_82
        excluded_because:
          difficulty_instance: promotion_revision_cycle_bounded_at_two_rounds
          rationale: |
            ERR_MAX_REVISION_ROUNDS is triggered inside the bounded-cycle instance, which walks
            DRAFT -> SUBMITTED -> CHANGES_REQUESTED -> DRAFT twice and then proves the third
            revise is refused at priority 82.

