      - name: scrapping_a_wound_roll_books_its_mass_into_the_named_pool
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /film-rolls/{id}/scrap]
          - state_machines.FilmRoll.WOUND_to_SCRAPPED
          - calculations.pool_mass_balance
        distinguishing_aspect: "The optional pool_id routes the scrapped mass: the 50.0 kg roll lands on top of the 12.0 kg the run already booked at completion, so the pool shows two generation events and 62.000 kg available."
        test_recipe:
