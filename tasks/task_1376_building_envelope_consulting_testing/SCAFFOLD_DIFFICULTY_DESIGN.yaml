            - call: "POST /engagements/${eng_id}/surveys/${srv_id}/complete"
              payload: {}
              as: FieldTechnician
            - call: "POST /engagements/${eng_id}/anomalies"
              payload: { survey_id: "${srv_id}", anomaly_type: "WATER_INGRESS", severity: "HIGH", description: "leak" }
              as: Consultant
              captures: { an1_id: $.data.id }
            - call: "POST /engagements/${eng_id}/anomalies"
              payload: { survey_id: "${srv_id}", anomaly_type: "AIR_LEAKAGE", severity: "MEDIUM", description: "draft" }
              as: Consultant
              captures: { an2_id: $.data.id }
            - call: "POST /engagements/${eng_id}/anomalies/${an1_id}/verify"
              payload: {}
              as: Consultant
            - call: "POST /engagements/${eng_id}/anomalies/${an2_id}/verify"
              payload: {}
              as: Consultant
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Principal
            - call: "POST /engagements/${eng_id}/warranty-claims"
              payload: { anomaly_id: "${an1_id}", manufacturer_name: "ACME", claimed_amount_cents: 100000 }
              as: Consultant
              captures: { claim1_id: $.data.id }
            - call: "POST /engagements/${eng_id}/warranty-claims"
              payload: { anomaly_id: "${an2_id}", manufacturer_name: "ACME", claimed_amount_cents: 200000 }
              as: Consultant
              captures: { claim2_id: $.data.id }
            - call: "POST /engagements/${eng_id}/warranty-claims/${claim1_id}/manufacturer-acknowledge"
              payload: {}
              as: ManufacturerRep
