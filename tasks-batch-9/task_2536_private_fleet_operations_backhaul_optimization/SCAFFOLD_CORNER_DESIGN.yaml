      - name: an_unrecognised_role_header_is_reported_before_any_other_objection
        claim_type: Authentication
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - errors.ERR_UNAUTHORIZED
          - validations[priority 1]
        distinguishing_aspect: "ERR_UNAUTHENTICATED (401) sits at priority 1, ahead of authorization, existence and payload validation, so a call with no X-User-Role and a call with a role name that is not one of the six both return 401 - even when the same call would also have been unauthorized, would have addressed a non-existent id, and carried an unparseable body."
        test_recipe:
          setup:
            - "Store S-6110 exists. The probes below vary only the identity headers."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FleetPlanner
            - call: "POST /fleet/stores"
              payload: { store_code: "S-6110", region_code: "MIDWEST", dock_count: 2, cases_per_hour_unload_rate: 600, dock_open_minute: 0, dock_close_minute: 1439 }
              as: FleetPlanner
              captures: { store_id: $.data.id }
          trigger:
            - call: "GET /fleet/stores/${store_id}"
              payload: {}
              as: "(no X-User-Role header sent)"
              captures: { e_no_role: $.data.error_id }
            - call: "GET /fleet/stores/${store_id}"
              payload: {}
              as: "FleetAdmin (not one of the six declared roles)"
              captures: { e_bad_role: $.data.error_id }
            - call: "GET /fleet/stores/b1e7c3aa-5f2d-4e11-9c88-0000deadbeef"
              payload: {}
              as: "(no X-User-Role header sent)"
              captures: { e_no_role_404: $.data.error_id }
            - call: "POST /fleet/stores"
              payload: { store_code: "S-6111" }
              as: "(no X-User-Role header sent)"
              captures: { e_no_role_422: $.data.error_id }
            - call: "POST /fleet/trip-stops/b1e7c3aa-5f2d-4e11-9c88-0000deadbeef/arrive"
              payload: {}
              as: Driver
              as_user_id: "(no X-User-ID header sent)"
              captures: { e_no_user: $.data.error_id }
            - call: "GET /fleet/stores/${store_id}"
              payload: {}
              as: MaintenanceCoordinator
              captures: { ok_code: $.data.store_code }
          assert:
            - "${e_no_role} == ERR_UNAUTHENTICATED with HTTP 401"
            - "${e_bad_role} == ERR_UNAUTHENTICATED with HTTP 401 - an unknown role name is not an authorization failure"
            - "${e_no_role_404} == ERR_UNAUTHENTICATED, not ERR_STORE_NOT_FOUND - priority 1 beats existence, so an anonymous caller cannot probe for ids"
            - "${e_no_role_422} == ERR_UNAUTHENTICATED, not ERR_INVALID_REQUEST - and beats payload validation too"
            - "${e_no_user} == ERR_UNAUTHENTICATED - the Driver role is entity-backed, so a missing X-User-ID is an identity failure rather than a scope failure"
            - "${ok_code} == S-6110 - with any of the six declared roles the same read succeeds"

