roles:
  - name: ProgramChair
    description: "The chair of the program under review. Owns the self-study narrative, the program's response to the reviewers, and the teach-out plan draft. Cannot approve anything about their own program."
    identity: "entity_backed:AcademicProgram"
    exclusive_operations:
      - "POST /provost/review-cycles/{id}/self-studies"
