      - name: one_owner_agent_cannot_write_on_another_owners_property_but_may_read_it
        claim_type: peer_roles
        grounds:
          - validations[priority=3]
          - errors[ERR_NOT_PROPERTY_OWNER]
          - endpoints[POST /pbra/tenant-households]
          - endpoints[GET /pbra/properties/{id}]
        distinguishing_aspect: "Ownership scoping is asymmetric and is resolved through the resource chain rather than from the request body: owner B is refused on a write against owner A's property with 403 ERR_NOT_PROPERTY_OWNER (distinct from the role-level 403 ERR_UNAUTHORIZED, since OwnerAgent is a permitted role on that endpoint), the refusal also applies to a write reached indirectly through A's contract, yet the shared GET is not owner-scoped and succeeds for B."
        test_recipe:
          setup:
            - "Owner A with property A and a contract; owner B with property B. Both act as OwnerAgent, each with X-User-ID equal to its own Owner.id."
          setup_api_calls:
            - call: "POST /pbra/owners"
              payload: { legal_name: "Cedar Ridge Housing Partners LP", tin: "27-3310011", contact_email: "agent@cedarridge.example" }
              as: ContractAdministrator
              captures: { owner_a: $.data.id }
            - call: "POST /pbra/owners"
              payload: { legal_name: "Brightwater Communities LLC", tin: "45-7781002", contact_email: "agent@brightwater.example" }
              as: ContractAdministrator
              captures: { owner_b: $.data.id }
            - call: "POST /pbra/properties"
              payload: { owner_id: "${owner_a}", project_name: "Cedar Ridge Apartments", state_code: "IL", total_units: 24, assisted_unit_count: 20, published_fmr_cents: 126000, baseline_utility_allowance_cents: 11500, has_fha_insured_mortgage: false }
              as: OwnerAgent
              as_user_id: "${owner_a}"
              captures: { prop_a: $.data.id }
            - call: "POST /pbra/hap-contracts"
              payload: { property_id: "${prop_a}", contract_type: "NEW_CONSTRUCTION", expiration_date: "2027-12-31", term_months: 12, contract_rent_per_unit_cents: 118000, monthly_debt_service_per_unit_cents: 32000, operating_expense_per_unit_cents: 61000, reserve_deposit_per_unit_cents: 4500, authorized_hap_budget_cents: 30000000 }
              as: ContractAdministrator
              captures: { contract_a: $.data.id, cv_a: $.data.version }
            - call: "POST /pbra/properties"
              payload: { owner_id: "${owner_b}", project_name: "Brightwater Court", state_code: "IL", total_units: 10, assisted_unit_count: 8, published_fmr_cents: 126000, baseline_utility_allowance_cents: 11500, has_fha_insured_mortgage: false }
              as: OwnerAgent
              as_user_id: "${owner_b}"
              captures: { prop_b: $.data.id }
          trigger:
            - call: "POST /pbra/tenant-households"
              payload: { property_id: "${prop_a}", unit_number: "101", household_name: "Interloper", annual_adjusted_income_cents: 1800000, annual_gross_income_cents: 1920000, family_size: 3 }
              as: OwnerAgent
              as_user_id: "${owner_b}"
            - call: "POST /pbra/voucher-submissions"
              payload: { contract_id: "${contract_a}", period_month: "2026-07", expected_contract_version: "${cv_a}" }
              as: OwnerAgent
              as_user_id: "${owner_b}"
            - call: "GET /pbra/properties/${prop_a}"
              payload: {}
              as: OwnerAgent
              as_user_id: "${owner_b}"
              captures: { b_reads_a: $.data.owner_id, a_units: $.data.assisted_unit_count }
            - call: "POST /pbra/tenant-households"
              payload: { property_id: "${prop_a}", unit_number: "101", household_name: "Alvarez", annual_adjusted_income_cents: 1800000, annual_gross_income_cents: 1920000, family_size: 3 }
              as: OwnerAgent
              as_user_id: "${owner_a}"
              captures: { t_ok: $.data.id, t_unit: $.data.unit_number }
          assert:
            - "The household create by ${owner_b} on ${prop_a} returns HTTP 403 with error_id ERR_NOT_PROPERTY_OWNER and no TenantHousehold row is created"
            - "The voucher create by ${owner_b} on ${contract_a} also returns HTTP 403 with error_id ERR_NOT_PROPERTY_OWNER — the chain HapContract -> Property -> Owner is walked, and the OCC version check never runs"
            - "${b_reads_a} == ${owner_a} and ${a_units} == 20 — the shared read is not owner-scoped"
            - "${t_ok} is a fresh id and ${t_unit} == 101 — the identical write by ${owner_a} succeeds, so the refusal was about identity and not about the payload"
            - "Property.${prop_b}.units_under_hap_count == 0 — nothing leaked onto owner B's property"

  - section: cross_cutting_complexity_layers
    instances:
      - name: all_three_declared_occ_rules_reject_a_stale_parent_version_and_bump_it_on_success
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[cert-create-stale-tenant]
          - concurrency_rules[voucher-create-stale-contract]
          - concurrency_rules[ua-apply-stale-property]
          - errors[ERR_STALE_TENANT_VERSION]
          - errors[ERR_STALE_CONTRACT_VERSION]
          - errors[ERR_STALE_PROPERTY_VERSION]
        distinguishing_aspect: "Each of the three declared concurrency rules is probed on its own write endpoint with its own occ_field and its own 412 error_id, the observed version is re-read immediately before each probe so the stale value is provably one behind the live row, and every successful write is shown to advance its parent's version by exactly 1 — a refusal advances nothing."
