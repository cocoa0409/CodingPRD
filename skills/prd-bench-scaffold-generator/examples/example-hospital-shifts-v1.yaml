# =============================================================================
# Example: hospital-shifts benchmark seed tables (v1)
# This file demonstrates the complete seed tables for hospital-shifts v1.
# Use as a reference when creating new benchmarks.
# =============================================================================

scenario: |
  Hospital shift scheduling system. Manages the full lifecycle of treatment plans:
  from budget planning, ward rotation scheduling, procedure definitions,
  to medical resource allocation, cost accounting, and final settlement.
  Considerations: role-based access, budget control, patient safety scoring,
  equipment certification, sterilization protocols, infection risk pairing,
  high bio-risk double billing.

domain_name: hospital-shifts
api_prefix: /treatment-plans

# =============================================================================
# Table 1: Entity Relationship Table
# =============================================================================
entities:
  - name: TreatmentPlan
    parent: null
    common_fields: true  # id, created_at, updated_at, version
    fields:
      - { name: plan_name, type: string, source: input, description: "Plan name" }
      - { name: total_budget, type: number, source: input, description: "Total budget" }
      - { name: cost_balance, type: number, source: computed, description: "Remaining budget balance, initial value = total_budget, adjusted with assignments" }
      - { name: patient_safety_score, type: number, source: computed, description: "Safety score, initial value = 0, lower is better" }
      - { name: status, type: enum, source: system, description: "PLANNING → ACTIVE → FINAL_REVIEW_PENDING → COMPLETED" }

  - name: WardRotation
    parent: TreatmentPlan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "Associated treatment plan ID" }
      - { name: name, type: string, source: input, description: "Rotation name" }
      - { name: start_minute, type: integer, source: input, description: "Start time (non-negative integer, schedule offset)" }
      - { name: end_minute, type: integer, source: input, description: "End time (must be > start_minute)" }
      - { name: status, type: enum, source: system, description: "PLANNING → READY_FOR_ASSIGNMENT / COMPLETED / CANCELLED" }

  - name: Procedure
    parent: WardRotation
    common_fields: true
    fields:
      - { name: rotation_id, type: string, source: system, description: "Associated ward rotation ID" }
      - { name: plan_id, type: string, source: system, description: "Associated treatment plan ID" }
      - { name: procedure_type, type: string, source: input, description: "Procedure type" }
      - { name: required_certification, type: enum, source: input, default: "NONE", description: "BSL-3_CERTIFIED | CARDIAC_CATHETERIZATION_LAB | NONE" }
      - { name: start_minute, type: integer, source: input, description: "Start time" }
      - { name: end_minute, type: integer, source: input, description: "End time" }
      - { name: duration_minutes, type: integer, source: computed, description: "Read-only field, = end_minute - start_minute" }
      - { name: status, type: enum, source: system, description: "PENDING → SCHEDULED / ASSIGNED / COMPLETED / CANCELLED" }

  - name: MedicalResource
    parent: TreatmentPlan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "Associated treatment plan ID" }
      - { name: resource_name, type: string, source: input, description: "Resource name" }
      - { name: resource_model, type: string, source: input, description: "Resource model" }
      - { name: operating_cost_per_minute, type: number, source: input, description: "Operating cost per minute" }
      - { name: resource_certifications, type: array, source: system, description: "Certification list, each containing id, name, applied_date" }

  - name: Assignment
    parent: TreatmentPlan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "Associated treatment plan ID" }
      - { name: procedure_id, type: string, source: input, description: "Associated procedure ID" }
      - { name: resource_id, type: string, source: input, description: "Associated resource ID" }
      - { name: override_protocol_check, type: boolean, source: input, default: false, description: "Whether to bypass safety score threshold check" }
      - { name: protocol_override_penalty_applied, type: boolean, source: computed, description: "Whether override penalty (+100 points) was actually applied" }
      - { name: is_high_biorisk, type: boolean, source: computed, description: "Whether high bio-risk triggered (resource cumulative usage > 6000 minutes)" }
      - { name: provisional_cost, type: number, source: computed, description: "Provisional cost (forward-looking calculation)" }
      - { name: final_cost, type: number, source: computed, description: "Final cost (chronological calculation, populated at finalization)" }
      - { name: status, type: enum, source: system, description: "PENDING_SCHEDULE → PROTOCOL_APPROVED → SCHEDULED → COMPLETED / REJECTED / CANCELLED" }

  - name: InfectionRiskPairing
    parent: TreatmentPlan
    common_fields: false  # immutable after creation: has id + created_at only, omits updated_at (PRD §2.9)
    fields:
      - { name: plan_id, type: string, source: system, description: "Associated treatment plan ID" }
      - { name: resource_id_1, type: string, source: input, description: "Paired resource 1" }
      - { name: resource_id_2, type: string, source: input, description: "Paired resource 2" }
      - { name: reason, type: string, source: input, required: false, description: "Pairing reason" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: TreatmentPlan
    initial_state: PLANNING
    terminal_states: [COMPLETED]
    transitions:
      - from: PLANNING
        to: ACTIVE
        trigger: POST /treatment-plans/{planId}/activate
        actor: ChargeNurse
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: FINAL_REVIEW_PENDING
        trigger: POST /treatment-plans/{planId}/initiate-final-review
        actor: ChargeNurse
        preconditions:
          - "No unresolved assignments (non-terminal: PENDING_SCHEDULE, PROTOCOL_APPROVED)"
        side_effects: []

      - from: FINAL_REVIEW_PENDING
        to: COMPLETED
        trigger: POST /treatment-plans/{planId}/finalize-plan
        actor: HospitalAdministrator
        preconditions:
          - "sum(final_costs) must not exceed total_budget (ERR_FINALIZATION_EXCEEDS_BUDGET)"
        side_effects:
          - "All SCHEDULED assignments: compute final_cost and transition to COMPLETED"
          - "All ASSIGNED procedures → COMPLETED"
          - "All rotations where every procedure is terminal → COMPLETED (per PRD §2.4, not limited to READY_FOR_ASSIGNMENT)"
          - "patient_safety_score adjusted based on final bio-risk calculation (PRD §3.7)"
          - "cost_balance finalized to total_budget - sum(all final_costs)"

  - entity: WardRotation
    initial_state: PLANNING
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNING
        to: READY_FOR_ASSIGNMENT
        trigger: PUT /treatment-plans/{planId}/ward-rotations/{rotationId}
        actor: ChargeNurse
        preconditions:
          - "Treatment plan must be ACTIVE"
          - "All procedures must be in ASSIGNED status (ERR_PROCEDURES_NOT_ASSIGNED)"
        side_effects: []

      - from: READY_FOR_ASSIGNMENT
        to: COMPLETED
        trigger: "system (automatic when all procedures reach terminal state, including during finalize-plan)"
        actor: system
        preconditions:
          - "All procedures in terminal state (COMPLETED or CANCELLED)"
        side_effects: []

      - from: PLANNING
        to: COMPLETED
        trigger: "system (automatic when all procedures reach terminal state, including during finalize-plan)"
        actor: system
        preconditions:
          - "All procedures in terminal state (COMPLETED or CANCELLED)"
        side_effects: []
        note: "PRD §2.4: PLANNING rotation procedures may all reach terminal state via finalize or cancel"

      - from: PLANNING
        to: CANCELLED
        trigger: PUT /treatment-plans/{planId}/ward-rotations/{rotationId}
        actor: ChargeNurse
        preconditions:
          - "Treatment plan must be ACTIVE"
        side_effects:
          - "All PENDING procedures → CANCELLED"
          - "All associated non-terminal assignments → cascade cancel with refund"

      - from: READY_FOR_ASSIGNMENT
        to: PLANNING
        trigger: "system (automatic demotion when assignment cancel causes procedure to leave ASSIGNED state)"
        actor: system
        preconditions:
          - "A procedure in this rotation is no longer ASSIGNED (due to associated assignment being cancelled)"
        side_effects: []
        note: "PRD §2.4: child resource changes that invalidate parent state criteria trigger automatic adjustment"

      - from: READY_FOR_ASSIGNMENT
        to: CANCELLED
        trigger: PUT /treatment-plans/{planId}/ward-rotations/{rotationId}
        actor: ChargeNurse
        preconditions:
          - "Treatment plan must be ACTIVE"
        side_effects:
          - "Same as PLANNING → CANCELLED"

  - entity: Procedure
    initial_state: PENDING
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PENDING
        to: SCHEDULED
        trigger: "system (automatic on assignment proposal)"
        actor: system
        preconditions: []
        side_effects: []
        note: "When an assignment is created, the associated procedure transitions from PENDING to SCHEDULED"

      - from: SCHEDULED
        to: ASSIGNED
        trigger: "system (automatic on assignment schedule)"
        actor: system
        preconditions: []
        side_effects: []
        note: "When the associated assignment transitions from PROTOCOL_APPROVED to SCHEDULED, the procedure becomes ASSIGNED"

      - from: SCHEDULED
        to: PENDING
        trigger: "system (automatic rollback on assignment reject/cancel)"
        actor: system
        preconditions: []
        side_effects: []
        note: "When a PENDING_SCHEDULE assignment is rejected/cancelled, the procedure reverts to PENDING"

      - from: ASSIGNED
        to: PENDING
        trigger: "system (automatic rollback on SCHEDULED assignment cancel)"
        actor: system
        preconditions: []
        side_effects: []
        note: "When a SCHEDULED assignment is cancelled, the procedure reverts to PENDING"

      - from: ASSIGNED
        to: COMPLETED
        trigger: "system (automatic during finalize-plan)"
        actor: system
        preconditions: []
        side_effects: []

      - from: PENDING
        to: CANCELLED
        trigger: POST .../procedures/{procedureId}/cancel
        actor: AttendingPhysician
        preconditions:
          - "Procedure must be in PENDING state (ERR_PROCEDURE_NOT_PENDING_FOR_CANCEL)"
        side_effects:
          - "If all procedures in the rotation are now terminal (COMPLETED/CANCELLED), rotation auto-transitions to COMPLETED (PRD §3.2 + §2.4)"

  - entity: Assignment
    initial_state: PENDING_SCHEDULE
    terminal_states: [COMPLETED, REJECTED, CANCELLED]
    transitions:
      - from: PENDING_SCHEDULE
        to: PROTOCOL_APPROVED
        trigger: POST .../assignments/{assignmentId}/protocol-approve
        actor: ChargeNurse
        preconditions: []
        side_effects: []

      - from: PENDING_SCHEDULE
        to: REJECTED
        trigger: POST .../assignments/{assignmentId}/reject
        actor: ChargeNurse
        preconditions: []
        side_effects:
          - "Procedure reverts to PENDING"
          - "Refund provisional_cost to cost_balance"
          - "Refund safety_score penalties (bio-risk penalty + override penalty)"

      - from: PENDING_SCHEDULE
        to: CANCELLED
        trigger: POST .../assignments/{assignmentId}/cancel
        actor: ChargeNurse
        preconditions: []
        side_effects:
          - "Same as REJECTED side_effects"

      - from: PROTOCOL_APPROVED
        to: SCHEDULED
        trigger: POST .../assignments/{assignmentId}/schedule
        actor: ChargeNurse
        preconditions: []
        side_effects:
          - "Procedure transitions to ASSIGNED"
          - "Recalculate provisional_cost (only non-terminal assignments with start_minute before current procedure)"
          - "Adjust cost_balance (refund old provisional, debit new provisional)"
          - "Adjust safety_score (if bio-risk status changed)"

      - from: PROTOCOL_APPROVED
        to: CANCELLED
        trigger: POST .../assignments/{assignmentId}/cancel
        actor: ChargeNurse
        preconditions: []
        side_effects:
          - "Procedure reverts to PENDING"
          - "Refund provisional_cost to cost_balance"
          - "Refund safety_score penalties"

      - from: SCHEDULED
        to: CANCELLED
        trigger: POST .../assignments/{assignmentId}/cancel
        actor: ChargeNurse
        preconditions: []
        side_effects:
          - "Procedure reverts from ASSIGNED to PENDING"
          - "Refund provisional_cost to cost_balance"
          - "Refund safety_score penalties"
          - "If rotation is READY_FOR_ASSIGNMENT, demote to PLANNING (PRD §2.4)"

      - from: SCHEDULED
        to: COMPLETED
        trigger: "system (automatic during finalize-plan)"
        actor: system
        preconditions: []
        side_effects:
          - "Calculate final_cost (chronological order)"
          - "Adjust cost_balance"
          - "If final is_high_biorisk differs from provisional, adjust patient_safety_score (PRD §3.7)"

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: provisional_cost
    trigger: "assignment proposal (creation) and scheduling (confirmation)"
    algorithm: forward_looking
    formula: |
      1. Determine the "relevant assignments set" for the resource:
         - At proposal: all non-terminal assignments
         - At scheduling: all non-terminal assignments with start_minute < current procedure's start_minute
      2. total_usage = sum(relevant assignments' duration_minutes) + current procedure's duration
      3. Check if THRESHOLD exceeded:
         if total_usage > THRESHOLD:
           excess = total_usage - THRESHOLD
           if excess >= duration:
             cost = duration * rate * MULTIPLIER   # entirely doubled
           else:
             normal_part = duration - excess
             cost = normal_part * rate + excess * rate * MULTIPLIER
         else:
           cost = duration * rate
    constants:
      THRESHOLD: 6000    # 100 hours = 6000 minutes
      MULTIPLIER: 2      # double rate beyond threshold
    precision: "2 decimal places, round_half_up"
    note: "Proposal and scheduling may produce different provisional_cost for the same assignment"

  - name: is_high_biorisk
    trigger: "Calculated in sync with provisional_cost"
    algorithm: threshold
    formula: |
      Uses the same "relevant assignments set" as provisional_cost calculation.
      if total_usage > THRESHOLD:
        is_high_biorisk = true
      else:
        is_high_biorisk = false
    constants:
      THRESHOLD: 6000

  - name: final_cost
    trigger: plan finalization
    algorithm: chronological
    formula: |
      1. Collect all SCHEDULED assignments for the resource
      2. Sort by procedure.start_minute ascending
      3. running_total = 0
      4. for each assignment in sorted order:
           running_total += duration
           if running_total > THRESHOLD:
             excess = running_total - THRESHOLD
             if excess >= duration:
               final_cost = duration * rate * MULTIPLIER
             else:
               normal_part = duration - excess
               final_cost = normal_part * rate + excess * rate * MULTIPLIER
           else:
             final_cost = duration * rate
    constants:
      THRESHOLD: 6000
      MULTIPLIER: 2
    precision: "2 decimal places, round_half_up"
    key_insight: |
      provisional_cost (forward-looking, includes all unresolved) and final_cost
      (chronological, only confirmed) may produce different results for the same
      data — this is a core testing challenge.

  - name: cost_balance_update
    trigger: "assignment create, schedule, reject, cancel, finalize"
    algorithm: aggregation
    formula: |
      Create assignment: cost_balance -= provisional_cost
      Schedule: cost_balance += old_provisional - new_provisional  (refund old, debit new)
      Reject/Cancel: cost_balance += provisional_cost  (refund)
      Finalize: cost_balance = total_budget - sum(all final_costs)
    note: "plan.updated_at and plan.version increment with each cost_balance change"

  - name: patient_safety_score
    trigger: "assignment create, schedule, reject, cancel"
    algorithm: aggregation
    formula: |
      Create assignment:
        if is_high_biorisk: safety_score += BIORISK_PENALTY
        if is_high_biorisk AND safety_score (after bio-risk penalty) >= threshold:
          if NOT override_protocol_check: reject with ERR_SAFETY_SCORE_THRESHOLD_BREACHED
          if override_protocol_check: safety_score += OVERRIDE_PENALTY
      Schedule: recalculate bio-risk status
        if was not high-biorisk but now is: safety_score += BIORISK_PENALTY
        if was high-biorisk but now is not: safety_score -= BIORISK_PENALTY
      Reject/Cancel: refund all previously assessed penalties
      Floor: max(0, score)  # never negative
    constants:
      BIORISK_PENALTY: 50
      OVERRIDE_PENALTY: 100
      THRESHOLD: 500  # blocks new assignments at this threshold (unless override)
    note: "plan.updated_at and plan.version increment with each patient_safety_score change. Validation priority: check safety_score threshold before checking budget"

  - name: sterilization_check
    trigger: assignment proposal
    algorithm: time_gap
    formula: |
      Check against the resource's entire committed schedule
      (committed = PENDING_SCHEDULE, PROTOCOL_APPROVED, SCHEDULED, COMPLETED).
      For two procedures of different procedure_type on the same resource:
        gap = later.start_minute - earlier.end_minute
        if gap < STERILIZATION_GAP:
          reject with ERR_STERILIZATION_TIME_VIOLATION
      Procedures of the same procedure_type do not require sterilization gap.
    constants:
      STERILIZATION_GAP: 30  # minutes

  - name: double_booking_check
    trigger: assignment proposal
    algorithm: overlap
    formula: |
      Check against the resource's entire committed schedule
      (committed = PENDING_SCHEDULE, PROTOCOL_APPROVED, SCHEDULED, COMPLETED).
      A resource cannot be assigned to time-overlapping procedures.
      overlap = procA.start < procB.end AND procB.start < procA.end

  - name: infection_risk_check
    trigger: assignment proposal
    algorithm: pairing
    formula: |
      If two resources are marked as an infection risk pairing:
        and one resource already has a committed assignment in a rotation
        (committed = PENDING_SCHEDULE, PROTOCOL_APPROVED, SCHEDULED, COMPLETED)
        then the other resource cannot be assigned to a procedure in the same rotation.

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "Role must have permission to perform this operation"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: existence
    check: "Resource IDs in path must exist (validated left-to-right)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND (by resource type)"
    http_status: 404
    applies_to: all nested resource endpoints
    note: "Validate planId first, then rotationId, then procedureId — return on first not found"

  - priority: 4
    category: state
    check: "Parent treatment plan must be in ACTIVE state"
    error_id: ERR_PLAN_NOT_ACTIVE
    http_status: 409
    applies_to: "Create/modify rotations, procedures, assignments, infection-risk-pairings (excludes medical-resources and certifications)"

  - priority: 5
    category: state
    check: "Target resource must be in the correct state for the current operation"
    error_id: "varies (ERR_PROCEDURE_NOT_PENDING, ERR_ASSIGNMENT_NOT_PENDING_SCHEDULE, etc.)"
    http_status: 409
    applies_to: "State transition endpoints"

  - priority: 6a
    category: business_pairing
    check: "resource_id_1 must not equal resource_id_2"
    error_id: ERR_SELF_PAIRING
    http_status: 400
    applies_to: "POST /infection-risk-pairings"

  - priority: 6b
    category: business_pairing
    check: "Same unordered resource pair must not already exist in the plan ({A,B} == {B,A})"
    error_id: ERR_DUPLICATE_PAIRING
    http_status: 409
    applies_to: "POST /infection-risk-pairings"

  - priority: 6
    category: business_safety
    check: "Resource certification must match procedure's required_certification, and certification applied_date must be <= assignment creation date"
    error_id: ERR_CERTIFICATION_MISMATCH
    http_status: 400
    applies_to: "POST /assignments (proposal)"

  - priority: 7
    category: business_safety
    check: "Same-resource time conflict: different procedure_types require >= 30 min sterilization gap; same procedure_type must not have time overlap (double-booking)"
    error_id: ERR_STERILIZATION_TIME_VIOLATION
    http_status: 409
    applies_to: "POST /assignments (proposal)"

  - priority: 8
    category: business_safety
    check: "Infection risk pairing check (paired resources cannot both be in the same rotation)"
    error_id: ERR_INFECTION_RISK
    http_status: 409
    applies_to: "POST /assignments (proposal)"

  - priority: 9
    category: business_safety
    check: "Only when assignment is high bio-risk: would the bio-risk penalty cause patient_safety_score to reach/exceed 500 threshold (and override_protocol_check is not set)"
    error_id: ERR_SAFETY_SCORE_THRESHOLD_BREACHED
    http_status: 403
    applies_to: "POST /assignments (proposal)"

  - priority: 10
    category: business_fiscal
    check: "Budget must be sufficient (provisional_cost <= cost_balance)"
    error_id: ERR_INSUFFICIENT_BUDGET
    http_status: 402
    applies_to: "POST /assignments (proposal)"

# =============================================================================
# Table 5: API Endpoint Table (28 endpoints)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- TreatmentPlan ---
  - method: POST
    path: "/treatment-plans"
    description: "Create a new Treatment Plan"
    roles: [ChargeNurse]
    code: 201
    input: [plan_name, total_budget]
    output: TreatmentPlan
    side_effects: ["cost_balance initialized to total_budget, patient_safety_score initialized to 0"]

  - method: GET
    path: "/treatment-plans"
    description: "List all Treatment Plans"
    roles: [Any]
    code: 200
    input: ["limit?, offset?"]
    output: "TreatmentPlan[]"
    side_effects: []

  - method: GET
    path: "/treatment-plans/{planId}"
    description: "Get a specific Treatment Plan"
    roles: [Any]
    code: 200
    input: []
    output: TreatmentPlan
    side_effects: []

  - method: POST
    path: "/treatment-plans/{planId}/activate"
    description: "Activate a plan"
    roles: [ChargeNurse]
    code: 200
    input: ["version?"]
    output: TreatmentPlan
    side_effects: ["status → ACTIVE"]

  # --- WardRotation ---
  - method: POST
    path: "/treatment-plans/{planId}/ward-rotations"
    description: "Create a new Ward Rotation within a Plan"
    roles: [AttendingPhysician]
    code: 201
    input: [name, start_minute, end_minute]
    output: WardRotation
    side_effects: []

  - method: GET
    path: "/treatment-plans/{planId}/ward-rotations"
    description: "List Ward Rotations for a Plan"
    roles: [Any]
    code: 200
    input: ["limit?, offset?"]
    output: "WardRotation[]"
    side_effects: []

  - method: GET
    path: "/treatment-plans/{planId}/ward-rotations/{rotationId}"
    description: "Get a specific Ward Rotation"
    roles: [Any]
    code: 200
    input: []
    output: WardRotation
    side_effects: []

  - method: PUT
    path: "/treatment-plans/{planId}/ward-rotations/{rotationId}"
    description: "Update a Ward Rotation's status"
    roles: [ChargeNurse]
    code: 200
    input: ["status, version?"]
    output: WardRotation
    side_effects: ["State transition + possible cascade cancellation"]

  # --- Procedure ---
  - method: POST
    path: "/treatment-plans/{planId}/ward-rotations/{rotationId}/procedures"
    description: "Create a new Procedure for a Rotation"
    roles: [AttendingPhysician]
    code: 201
    input: ["procedure_type, required_certification?, start_minute, end_minute"]
    output: Procedure
    side_effects: ["duration_minutes auto-calculated"]

  - method: GET
    path: "/treatment-plans/{planId}/ward-rotations/{rotationId}/procedures"
    description: "List Procedures for a Rotation"
    roles: [Any]
    code: 200
    input: ["limit?, offset?"]
    output: "Procedure[]"
    side_effects: []

  - method: GET
    path: "/treatment-plans/{planId}/ward-rotations/{rotationId}/procedures/{procedureId}"
    description: "Get a specific Procedure"
    roles: [Any]
    code: 200
    input: []
    output: Procedure
    side_effects: []

  - method: POST
    path: "/treatment-plans/{planId}/ward-rotations/{rotationId}/procedures/{procedureId}/cancel"
    description: "Cancel a specific Procedure"
    roles: [AttendingPhysician]
    code: 200
    input: ["version?"]
    output: Procedure
    side_effects:
      - "status → CANCELLED (only PENDING procedures can be cancelled)"
      - "If all procedures in the rotation are now terminal, rotation auto-transitions to COMPLETED (PRD §2.4)"

  # --- Assignment ---
  - method: POST
    path: "/treatment-plans/{planId}/assignments"
    description: "Propose a new MedicalResource assignment for a Procedure"
    roles: [AttendingPhysician]
    code: 201
    input: ["procedure_id, resource_id, override_protocol_check?"]
    output: Assignment
    side_effects:
      - "Calculate provisional_cost (forward-looking)"
      - "Debit cost_balance"
      - "Calculate is_high_biorisk"
      - "Update patient_safety_score"
      - "Procedure status → SCHEDULED"
      - "Trigger full validation chain (certification, sterilization, infection risk, safety score, budget)"

  - method: GET
    path: "/treatment-plans/{planId}/assignments"
    description: "List all Assignments for a Plan"
    roles: [Any]
    code: 200
    input: ["limit?, offset?"]
    output: "Assignment[]"
    side_effects: []

  - method: GET
    path: "/treatment-plans/{planId}/assignments/{assignmentId}"
    description: "Get a specific Assignment"
    roles: [Any]
    code: 200
    input: []
    output: Assignment
    side_effects: []

  - method: POST
    path: "/treatment-plans/{planId}/assignments/{assignmentId}/reject"
    description: "Reject a proposed Assignment"
    roles: [ChargeNurse]
    code: 200
    input: ["version?"]
    output: Assignment
    side_effects:
      - "status → REJECTED"
      - "Procedure reverts to PENDING"
      - "Refund provisional_cost to cost_balance"
      - "Refund safety_score penalties"

  - method: POST
    path: "/treatment-plans/{planId}/assignments/{assignmentId}/cancel"
    description: "Cancel an Assignment"
    roles: [ChargeNurse]
    code: 200
    input: ["version?"]
    output: Assignment
    side_effects:
      - "status → CANCELLED"
      - "Procedure reverts to PENDING (from ASSIGNED if cancelling a SCHEDULED assignment)"
      - "Refund provisional_cost to cost_balance"
      - "Refund safety_score penalties"

  - method: POST
    path: "/treatment-plans/{planId}/assignments/{assignmentId}/protocol-approve"
    description: "Protocol Approve a proposed Assignment"
    roles: [ChargeNurse]
    code: 200
    input: ["version?"]
    output: Assignment
    side_effects: ["status → PROTOCOL_APPROVED"]

  - method: POST
    path: "/treatment-plans/{planId}/assignments/{assignmentId}/schedule"
    description: "Schedule a Protocol Approved Procedure"
    roles: [ChargeNurse]
    code: 200
    input: ["version?"]
    output: Assignment
    side_effects:
      - "status → SCHEDULED"
      - "Procedure status → ASSIGNED"
      - "Recalculate provisional_cost (only non-terminal assignments with start_minute before current procedure)"
      - "Adjust cost_balance (refund old provisional + debit new provisional)"
      - "is_high_biorisk may change"
      - "patient_safety_score may be adjusted"

  # --- MedicalResource ---
  - method: POST
    path: "/treatment-plans/{planId}/medical-resources"
    description: "Create a new Medical Resource profile for a Plan"
    roles: [AttendingPhysician]
    code: 201
    input: [resource_name, resource_model, operating_cost_per_minute]
    output: MedicalResource
    side_effects: ["resource_certifications initialized to empty array"]

  - method: GET
    path: "/treatment-plans/{planId}/medical-resources"
    description: "List Medical Resource profiles for a Plan"
    roles: [Any]
    code: 200
    input: ["limit?, offset?"]
    output: "MedicalResource[]"
    side_effects: []

  - method: GET
    path: "/treatment-plans/{planId}/medical-resources/{resourceId}"
    description: "Get a specific Medical Resource profile"
    roles: [Any]
    code: 200
    input: []
    output: MedicalResource
    side_effects: []

  - method: POST
    path: "/treatment-plans/{planId}/medical-resources/{resourceId}/certifications"
    description: "Add a certification to a Medical Resource"
    roles: [AttendingPhysician]
    code: 200
    input: ["name (BSL-3_CERTIFIED | CARDIAC_CATHETERIZATION_LAB), applied_date, version?"]
    output: MedicalResource
    side_effects: ["Certification added to resource_certifications array"]

  # --- InfectionRiskPairing ---
  - method: POST
    path: "/treatment-plans/{planId}/infection-risk-pairings"
    description: "Create an Infection Risk Pairing within a Plan"
    roles: [ChargeNurse]
    code: 201
    input: ["resource_id_1, resource_id_2, reason?"]
    output: InfectionRiskPairing
    side_effects: []

  - method: GET
    path: "/treatment-plans/{planId}/infection-risk-pairings"
    description: "List Infection Risk Pairings for a Plan"
    roles: [Any]
    code: 200
    input: ["limit?, offset?"]
    output: "InfectionRiskPairing[]"
    side_effects: []

  - method: GET
    path: "/treatment-plans/{planId}/infection-risk-pairings/{pairingId}"
    description: "Get a specific Infection Risk Pairing"
    roles: [Any]
    code: 200
    input: []
    output: InfectionRiskPairing
    side_effects: []

  # --- Plan Lifecycle ---
  - method: POST
    path: "/treatment-plans/{planId}/initiate-final-review"
    description: "Move a plan to the final review pending state"
    roles: [ChargeNurse]
    code: 200
    input: ["version?"]
    output: TreatmentPlan
    side_effects:
      - "status → FINAL_REVIEW_PENDING"
      - "Precondition: no unresolved assignments (ERR_UNRESOLVED_ASSIGNMENTS_EXIST)"

  - method: POST
    path: "/treatment-plans/{planId}/finalize-plan"
    description: "Finalize costs and complete the plan"
    roles: [HospitalAdministrator]
    code: 200
    input: ["version?"]
    output: TreatmentPlan
    side_effects:
      - "status → COMPLETED"
      - "All SCHEDULED assignments → compute final_cost → COMPLETED"
      - "All ASSIGNED procedures → COMPLETED"
      - "All rotations where every procedure is terminal → COMPLETED (PRD §2.4, not limited to READY_FOR_ASSIGNMENT)"
      - "patient_safety_score adjusted based on final bio-risk calculation (PRD §3.7)"
      - "cost_balance finalized"
      - "Precondition: sum(final_costs) <= total_budget (ERR_FINALIZATION_EXCEEDS_BUDGET)"

# =============================================================================
# Table 6: Error Code Catalogue (32 error codes)
# =============================================================================
errors:
  # --- Authentication & Authorization ---
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header is missing or invalid"

  - id: ERR_INSUFFICIENT_PERMISSIONS
    http: 403
    condition: "Current role does not have permission for this operation"

  # --- Resource Not Found ---
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "Treatment plan with given planId does not exist"

  - id: ERR_ROTATION_NOT_FOUND
    http: 404
    condition: "Ward rotation with given rotationId does not exist"

  - id: ERR_PROCEDURE_NOT_FOUND
    http: 404
    condition: "Procedure with given procedureId does not exist"

  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "Medical resource with given resourceId does not exist"

  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "Assignment with given assignmentId does not exist"

  - id: ERR_PAIRING_NOT_FOUND
    http: 404
    condition: "Infection risk pairing with given pairingId does not exist"

  # --- State Constraints ---
  - id: ERR_PLAN_NOT_ACTIVE
    http: 409
    condition: "Operation requires treatment plan to be in ACTIVE state"

  - id: ERR_PLAN_NOT_IN_PLANNING
    http: 409
    condition: "Operation requires treatment plan to be in PLANNING state (e.g., activate)"

  - id: ERR_PLAN_NOT_READY_FOR_FINALIZATION
    http: 409
    condition: "finalize-plan requires plan to be in FINAL_REVIEW_PENDING state"

  - id: ERR_PROCEDURE_NOT_PENDING
    http: 409
    condition: "Procedure must be in PENDING state to create an assignment"

  - id: ERR_PROCEDURE_NOT_PENDING_FOR_CANCEL
    http: 409
    condition: "Procedure must be in PENDING state to cancel"

  - id: ERR_PROCEDURE_NOT_SCHEDULED
    http: 409
    condition: "Certain operations require procedure to be in SCHEDULED state"

  - id: ERR_ASSIGNMENT_NOT_PENDING_SCHEDULE
    http: 409
    condition: "protocol-approve/reject requires assignment to be in PENDING_SCHEDULE state"

  - id: ERR_ASSIGNMENT_NOT_PROTOCOL_APPROVED
    http: 409
    condition: "schedule requires assignment to be in PROTOCOL_APPROVED state"

  - id: ERR_ASSIGNMENT_NOT_CANCELLABLE
    http: 409
    condition: "cancel requires assignment to be in a cancellable state (non-terminal)"

  - id: ERR_ILLEGAL_ROTATION_STATE_TRANSITION
    http: 409
    condition: "Rotation state transition is invalid (e.g., from COMPLETED to another state)"

  # --- Business Validation ---
  - id: ERR_INVALID_ROTATION_MINUTES
    http: 400
    condition: "Rotation time parameters are invalid (non-integer, end <= start, negative, etc.)"

  - id: ERR_INVALID_PROCEDURE_MINUTES
    http: 400
    condition: "Procedure time parameters are invalid (non-integer, end <= start, negative, etc.)"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "General request format error (missing required fields, type mismatch, etc.)"

  - id: ERR_CERTIFICATION_MISMATCH
    http: 400
    condition: "Resource does not hold the certification required by the procedure"

  - id: ERR_STERILIZATION_TIME_VIOLATION
    http: 409
    condition: "Same-resource time conflict: insufficient sterilization gap between different types, or same-type time overlap (double-booking)"

  - id: ERR_INFECTION_RISK
    http: 409
    condition: "Paired resources cannot both have committed assignments in the same rotation"

  - id: ERR_SELF_PAIRING
    http: 400
    condition: "Cannot pair a resource with itself (resource_id_1 == resource_id_2)"

  - id: ERR_DUPLICATE_PAIRING
    http: 409
    condition: "Pairing already exists for this resource pair in the plan (unordered: {A,B} == {B,A})"

  # --- Safety & Financial ---
  - id: ERR_SAFETY_SCORE_THRESHOLD_BREACHED
    http: 403
    condition: "New assignment would cause patient_safety_score to reach/exceed 500 threshold, and override_protocol_check is not set"

  - id: ERR_INSUFFICIENT_BUDGET
    http: 402
    condition: "provisional_cost exceeds current cost_balance"

  - id: ERR_FINALIZATION_EXCEEDS_BUDGET
    http: 402
    condition: "Sum of all final_costs exceeds total_budget at finalization"

  # --- Concurrency Control ---
  - id: ERR_STALE_DATA
    http: 409
    condition: "Request version does not match server's current version (optimistic concurrency control)"

  # --- Business Logic Constraints ---
  - id: ERR_PROCEDURES_NOT_ASSIGNED
    http: 409
    condition: "Not all procedures are ASSIGNED when transitioning rotation to READY_FOR_ASSIGNMENT"

  - id: ERR_UNRESOLVED_ASSIGNMENTS_EXIST
    http: 409
    condition: "Unresolved assignments exist (PENDING_SCHEDULE or PROTOCOL_APPROVED) when initiating final review"

# =============================================================================
# RBAC Role Permission Matrix
# =============================================================================
roles:
  - name: ChargeNurse
    description: "Charge nurse, responsible for plan management and workflow approvals"
    exclusive_operations:
      - "POST /treatment-plans — Create treatment plan"
      - "POST .../activate — Activate plan"
      - "PUT .../ward-rotations/{id} — Update rotation status (including cancel)"
      - "POST .../assignments/{id}/protocol-approve — Protocol approve"
      - "POST .../assignments/{id}/schedule — Schedule assignment"
      - "POST .../assignments/{id}/reject — Reject assignment"
      - "POST .../assignments/{id}/cancel — Cancel assignment"
      - "POST .../infection-risk-pairings — Create infection risk pairing"
      - "POST .../initiate-final-review — Initiate final review"

  - name: AttendingPhysician
    description: "Attending physician, responsible for clinical resource definitions and assignment proposals"
    exclusive_operations:
      - "POST .../ward-rotations — Create ward rotation"
      - "POST .../procedures — Create procedure"
      - "POST .../procedures/{id}/cancel — Cancel procedure"
      - "POST .../medical-resources — Create medical resource"
      - "POST .../medical-resources/{id}/certifications — Add certification"
      - "POST .../assignments — Propose assignment"

  - name: HospitalAdministrator
    description: "Hospital administrator, responsible for final settlement"
    exclusive_operations:
      - "POST .../finalize-plan — Finalize plan"

  - name: Any
    description: "Shared across all roles"
    shared_operations:
      - "GET /treatment-plans — List plans"
      - "GET /treatment-plans/{planId} — Get plan details"
      - "GET .../ward-rotations — List rotations"
      - "GET .../ward-rotations/{id} — Get rotation details"
      - "GET .../procedures — List procedures"
      - "GET .../procedures/{id} — Get procedure details"
      - "GET .../assignments — List assignments"
      - "GET .../assignments/{id} — Get assignment details"
      - "GET .../medical-resources — List resources"
      - "GET .../medical-resources/{id} — Get resource details"
      - "GET .../infection-risk-pairings — List pairings"
      - "GET .../infection-risk-pairings/{id} — Get pairing details"
