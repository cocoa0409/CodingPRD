            - "Candidacy.${c_d_id}.certified_share_pct == 0.00"
            - "Candidacy.${c_d_id}.certified_votes_count == 0"
            - "Office.${o_id}.status == DECIDED"
            - "Election.${e_id}.runoff_required_office_count == 0"
            - "Election.${e_id}.turnout_pct == 62.50"
            - "Election.${e_id}.eligible_voter_count == 8"

  - rule_id: combinatorial_formula
    instances:

      - name: penalty_points_three_factor_nonlinear_composition
        grounds:
          - calculations.compliance_penalty_points
