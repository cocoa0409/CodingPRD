  - rule_id: non_linear_state_machine
    instances:

      - name: candidacy_status_revision_cycle_returns_to_under_review
        grounds:
          - state_machines.Candidacy.UNDER_REVIEW_to_RETURNED
          - state_machines.Candidacy.RETURNED_to_UNDER_REVIEW
          - state_machines.Candidacy.ELIGIBLE_to_PETITION_DEFICIENT
          - state_machines.Candidacy.PETITION_DEFICIENT_to_UNDER_REVIEW
