                limit_value: 100
                limit_unit: "PPM"
                limit_comparator: "AT_OR_BELOW"
                periodic_interval_months: 12
                base_method_fee_cents: 18700
                component_reliance_allowed: true
                severity_weight: 9
              as: ComplianceAdministrator
              captures: { rule_lead_id: "$.data.id" }
            - call: "POST /compliance/product-categories"
              payload:
                category_code: "TOY-RIDEON"
                display_name: "Ride-on toy"
                durable_infant_product: false
                intended_age_max_months: 48
                sampling_floor_units: 1
              as: ComplianceAdministrator
              captures: { category_id: "$.data.id" }
            - call: "POST /compliance/category-rule-mappings"
              payload:
                category_id: "${category_id}"
                rule_id: "${rule_lead_id}"
                applicability_condition: "ALWAYS"
                effective_from: "2026-01-01T00:00:00Z"
              as: ComplianceAdministrator
            - call: "POST /compliance/suppliers"
              payload: { legal_name: "Northwind Plastics", country_code: "VN", reliance_agreement_state: "ON_FILE" }
              as: ComplianceAdministrator
              captures: { supplier_id: "$.data.id" }
            - call: "POST /compliance/laboratories"
              payload:
                lab_name: "Meridian Test Labs"
                accreditation_body_code: "ILAC-MRA"
                independence_class: "INDEPENDENT"
                concurrent_slot_capacity: 4
              as: ComplianceAdministrator
              captures: { lab_id: "$.data.id" }
            - call: "POST /compliance/laboratories/${lab_id}/independence-attestations"
              payload: { attestation_valid_through: "2027-01-01T00:00:00Z" }
              as: ComplianceAdministrator
            - call: "POST /compliance/laboratories/${lab_id}/accreditations"
              payload:
                rule_id: "${rule_lead_id}"
                valid_from: "2026-01-01T00:00:00Z"
                valid_through: "2027-01-01T00:00:00Z"
                fee_surcharge_basis_points: 0
              as: ComplianceAdministrator
            - call: "POST /compliance/products"
              payload:
                category_id: "${category_id}"
                model_name: "Rover Ride-On 90"
                manufacture_site_code: "VN-HCM-04"
                projected_annual_units: 2000
                testing_budget_cents: 2000000
              as: ComplianceAdministrator
              captures: { product_id: "$.data.id" }
            - call: "POST /compliance/products/${product_id}/component-parts"
              payload:
                supplier_id: "${supplier_id}"
                part_name: "Painted body shell"
                material_class: "PAINTED_COATING"
                accessible_to_child: true
                small_part_when_detached: false
              as: ComplianceAdministrator
              captures: { part_id: "$.data.id" }
            - call: "POST /compliance/products/${product_id}/submit-for-certification"
              payload: { evidence_path: "COMPONENT_RELIANCE" }
              as: TestCoordinator
            - call: "POST /compliance/component-parts/${part_id}/certificates"
              payload:
                laboratory_id: "${lab_id}"
                rule_id: "${rule_lead_id}"
                measured_value: 40
                coverage_from: "2026-01-01T00:00:00Z"
                coverage_through: "2026-03-31T00:00:00Z"
              as: SupplierUser
              as_user_id: "supplier-user-northwind"
              captures: { part_certificate_first_id: "$.data.id" }
          trigger:
            - "Exactly on the buffer: POST /compliance/component-parts/${part_id}/certificates with coverage_from 2026-04-07T00:00:00Z, coverage_through 2026-06-30T00:00:00Z, laboratory ${lab_id}, rule ${rule_lead_id}, measured_value 40, as SupplierUser (user supplier-user-northwind)."
            - "One day past the buffer: the same request with coverage_from 2026-04-08T00:00:00Z."
          assert:
            - "The 2026-04-07 candidate returns HTTP 409 with error_id == \"ERR_COMPONENT_COVERAGE_OVERLAP\", because coverage_from 2026-04-07 is exactly equal to coverage_through 2026-03-31 widened by COVERAGE_BUFFER_DAYS 7 and the comparison is inclusive."
            - "The 2026-04-08 candidate returns HTTP 201 with reliance_state == \"SUBMITTED\", coverage_from == \"2026-04-08T00:00:00Z\" and supplier_id == ${supplier_id} copied from the part."
            - "GET /compliance/component-part-certificates filtered by component_part_id ${part_id} and rule_id ${rule_lead_id} returns total_count == 2 at the end, so the rejected candidate created no row."
            - "A candidate with coverage_from 2026-04-01T00:00:00Z would also be rejected — the buffer, not bare interval intersection, is what governs — while an implementation ignoring the buffer would have accepted it."
            - "Supplier.certificates_issued_count == 2 after the successful submissions, confirming the rejected request did not increment the counter."

  - rule_id: cross_entity_state_dependency
    instances:

      - name: cross_entity_test_order_start_blocked_by_laboratory_operational_state_and_by_attestation_expiry
        grounds:
          - validations[priority=18]
          - validations[priority=19]
          - state_machines.TestOrder.SCHEDULED_to_IN_TESTING
          - entities.Laboratory.fields.operational_state
          - entities.Laboratory.fields.influence_attestation_valid_through
        distinguishing_aspect: "Entity pair: TestOrder depends on Laboratory. The order is already SCHEDULED and perfectly valid on its own — nothing about the TestOrder row changes — yet the SCHEDULED -> IN_TESTING transition is refused because of the state of a different entity reached through laboratory_id. Two independent dimensions of the parent's state are probed: an explicit enum flip to BARRED, and the passage of the logical clock past influence_attestation_valid_through with no write to the Laboratory row at all. Restoring the parent unblocks the child, proving the dependency is evaluated live at transition time rather than latched when the order was booked."
        test_recipe:
          setup:
            - "Set the logical clock to 2026-08-01T00:00:00Z."
            - "Register one lead-content rule and a non-durable category with sampling_floor_units 1; map the rule ALWAYS."
            - "Register an INDEPENDENT laboratory with concurrent_slot_capacity 4, an attestation valid only through 2026-09-01T00:00:00Z, and an accreditation for the rule valid through 2027-01-01T00:00:00Z, so attestation expiry can be reached without expiring the accreditation."
            - "Register a product with one painted part, scope onto FULL_PRODUCT_TEST, activate an INITIAL plan and book one single-sample order in the window 2026-08-02..2026-08-03. The order is SCHEDULED and the laboratory is ACTIVE."
