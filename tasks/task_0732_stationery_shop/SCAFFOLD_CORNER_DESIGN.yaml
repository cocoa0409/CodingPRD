scaffold_corner_design:

  # =====================================================================
  # Entities
  # =====================================================================
  - section: entities
    instances:

      - name: create_customer_returns_201_with_all_required_fields
        claim_type: Creation
        grounds: ["entities.Customer", "endpoints"]
        distinguishing_aspect: "POST /customers with email/full_name/phone returns 201 and echoes all fields plus server-minted id/created_at/version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { email: "u@x.com", full_name: "U", phone: "555-0100" }
              as: ShopAdmin
              captures: { cu_id: "$.data.id", cu_v: "$.data.version" }
          assert:
            - "response HTTP 201"
            - "Customer.${cu_id}.email == \"u@x.com\""
            - "Customer.${cu_id}.credit_balance_cents == 0"
            - "Customer.${cu_id}.cumulative_deposits_paid_cents == 0"
            - "Customer.${cu_id}.version == 1"

      - name: get_customer_returns_stored_data
        claim_type: Retrieval
        grounds: ["entities.Customer", "endpoints"]
        distinguishing_aspect: "GET /customers/{id} returns the customer as stored."
        test_recipe:
          setup: ["Customer C exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "get@x.com", full_name: "G", phone: "555" }
              as: ShopAdmin
              captures: { c_id: "$.data.id" }
          trigger:
            - call: "GET /customers/${c_id}"
              payload: {}
              as: ShopAdmin
              captures: { c_email: "$.data.email" }
          assert:
            - "Customer.${c_id}.email == \"get@x.com\""

      - name: customer_not_found_returns_404
        claim_type: Not_Found
        grounds: ["errors[ERR_CUSTOMER_NOT_FOUND]"]
        distinguishing_aspect: "GET /customers/{id} with a random UUID returns ERR_CUSTOMER_NOT_FOUND at HTTP 404."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /customers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ShopAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response HTTP 404"
            - "response error_id == \"ERR_CUSTOMER_NOT_FOUND\""

      - name: create_customer_missing_email_returns_invalid_request
        claim_type: Required_Fields
        grounds: ["entities.Customer", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /customers without required email returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { full_name: "N", phone: "555" }
              as: ShopAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response HTTP 400"
            - "response error_id == \"ERR_INVALID_REQUEST\""

      - name: create_paper_stock_default_status_is_active
        claim_type: Defaults
        grounds: ["entities.PaperStock.fields.status"]
        distinguishing_aspect: "Omitting `status` on paper-stock create yields status=ACTIVE."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /paper-stocks"
              payload: { name: "Def", base_price_cents: 500, lead_days: 7 }
              as: ShopAdmin
              captures: { p_status: "$.data.status" }
          assert:
            - "PaperStock.status == \"ACTIVE\""

      - name: paper_stock_reserved_units_is_computed
        claim_type: Computed_Fields
        grounds: ["entities.PaperStock.fields.reserved_units"]
        distinguishing_aspect: "reserved_units is server-computed; client-supplied value in POST body is ignored (unknown field per §1.5 input list)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /paper-stocks"
              payload: { name: "Odd", base_price_cents: 500, lead_days: 7 }
              as: ShopAdmin
              captures: { rsv: "$.data.reserved_units" }
          assert:
            - "PaperStock.reserved_units == 0"

      - name: order_version_starts_at_1
        claim_type: System_Fields
        grounds: ["entities.Order.fields", "response_envelope"]
        distinguishing_aspect: "New Order has version=1 (system field via common_fields)."
        test_recipe:
          setup: ["Customer C and Design D exist."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "v@x.com", full_name: "V", phone: "555" }
              as: ShopAdmin
              captures: { c_id: "$.data.id" }
            - call: "POST /paper-stocks"
              payload: { name: "PP", base_price_cents: 500, lead_days: 7 }
              as: ShopAdmin
              captures: { p_id: "$.data.id" }
            - call: "POST /finish-options"
              payload: { name: "FF", surcharge_cents: 100, additional_lead_days: 5 }
              as: ShopAdmin
              captures: { f_id: "$.data.id" }
            - call: "POST /event-packages"
              payload: { name: "Wed", package_type: "WEDDING", deposit_pct: 0.5, min_qty: 50, proof_expiry_days: 14 }
              as: ShopAdmin
              captures: { pkg_id: "$.data.id" }
            - call: "POST /designs"
              payload: { customer_id: "${c_id}", event_package_id: "${pkg_id}", paper_stock_id: "${p_id}", finish_option_id: "${f_id}" }
              as: Customer
              captures: { d_id: "$.data.id" }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${c_id}", design_id: "${d_id}" }
              as: Customer
              captures: { o_v: "$.data.version" }
          assert:
            - "Order.version == 1"

      - name: paper_stock_invalid_enum_status_returns_invalid_request
        claim_type: Type_Constraints
        grounds: ["entities.PaperStock.fields.status", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /paper-stocks with status='ORANGE' (not in {ACTIVE, DISCONTINUED}) returns ERR_INVALID_REQUEST."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "POST /paper-stocks"
              payload: { name: "X", base_price_cents: 500, lead_days: 7, status: "ORANGE" }
              as: ShopAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == \"ERR_INVALID_REQUEST\""

      - name: design_requires_valid_customer_and_package
        claim_type: Parent_Relationships
        grounds: ["entities.Design.fields.customer_id", "errors[ERR_CUSTOMER_NOT_FOUND]"]
        distinguishing_aspect: "POST /designs with an unknown customer_id returns ERR_CUSTOMER_NOT_FOUND."
        test_recipe:
          setup:
            - "PaperStock, FinishOption, EventPackage exist; no customer with the given id."
          setup_api_calls:
            - call: "POST /paper-stocks"
              payload: { name: "PP2", base_price_cents: 500, lead_days: 7 }
              as: ShopAdmin
              captures: { p_id: "$.data.id" }
            - call: "POST /finish-options"
              payload: { name: "FF2", surcharge_cents: 100, additional_lead_days: 5 }
              as: ShopAdmin
              captures: { f_id: "$.data.id" }
            - call: "POST /event-packages"
              payload: { name: "W2", package_type: "WEDDING", deposit_pct: 0.5, min_qty: 50, proof_expiry_days: 14 }
              as: ShopAdmin
              captures: { pkg_id: "$.data.id" }
          trigger:
            - call: "POST /designs"
              payload: { customer_id: "00000000-0000-0000-0000-000000000000", event_package_id: "${pkg_id}", paper_stock_id: "${p_id}", finish_option_id: "${f_id}" }
              as: Customer
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == \"ERR_CUSTOMER_NOT_FOUND\""

  # =====================================================================
  # State Machines
  # =====================================================================
  - section: state_machines
    instances:

      - name: cancel_order_from_already_cancelled_returns_already_terminal
        claim_type: Invalid_Transitions
        grounds:
          - state_machines.Order
          - errors[ERR_ALREADY_TERMINAL]
        distinguishing_aspect: "Second cancel on a CANCELLED order returns ERR_ALREADY_TERMINAL (409), no side effects."
        test_recipe:
          setup: ["Order O cancelled from CART."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "sm1@x.com", full_name: "U", phone: "555" }
              as: ShopAdmin
              captures: { c_id: "$.data.id" }
            - call: "POST /paper-stocks"
              payload: { name: "PS", base_price_cents: 500, lead_days: 7 }
              as: ShopAdmin
              captures: { p_id: "$.data.id" }
            - call: "POST /finish-options"
              payload: { name: "FS", surcharge_cents: 100, additional_lead_days: 5 }
              as: ShopAdmin
              captures: { f_id: "$.data.id" }
            - call: "POST /event-packages"
              payload: { name: "Wed", package_type: "WEDDING", deposit_pct: 0.5, min_qty: 50, proof_expiry_days: 14 }
              as: ShopAdmin
              captures: { pkg_id: "$.data.id" }
            - call: "POST /designs"
              payload: { customer_id: "${c_id}", event_package_id: "${pkg_id}", paper_stock_id: "${p_id}", finish_option_id: "${f_id}" }
              as: Customer
              captures: { d_id: "$.data.id" }
            - call: "POST /orders"
              payload: { customer_id: "${c_id}", design_id: "${d_id}" }
              as: Customer
              captures: { o_id: "$.data.id" }
            - call: "POST /orders/${o_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
          trigger:
            - call: "POST /orders/${o_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == \"ERR_ALREADY_TERMINAL\""

      - name: proof_request_changes_from_draft_returns_invalid_state
        claim_type: Invalid_Transitions
        grounds:
          - state_machines.Proof
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /proofs/{id}/request-changes from DRAFT is not a declared transition — returns ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Order confirmed, Proof created (still DRAFT, not yet submitted)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "sm2@x.com", full_name: "U", phone: "555" }
              as: ShopAdmin
              captures: { c_id: "$.data.id" }
            - call: "POST /paper-stocks"
              payload: { name: "PS", base_price_cents: 500, lead_days: 7 }
              as: ShopAdmin
              captures: { p_id: "$.data.id" }
            - call: "POST /finish-options"
              payload: { name: "FS", surcharge_cents: 100, additional_lead_days: 5 }
              as: ShopAdmin
              captures: { f_id: "$.data.id" }
            - call: "POST /event-packages"
              payload: { name: "Wed", package_type: "WEDDING", deposit_pct: 0.5, min_qty: 50, proof_expiry_days: 14 }
              as: ShopAdmin
              captures: { pkg_id: "$.data.id" }
            - call: "POST /designers"
              payload: { full_name: "DES", active: true }
              as: ShopAdmin
              captures: { des_id: "$.data.id" }
            - call: "POST /designs"
              payload: { customer_id: "${c_id}", event_package_id: "${pkg_id}", paper_stock_id: "${p_id}", finish_option_id: "${f_id}" }
              as: Customer
              captures: { d_id: "$.data.id" }
            - call: "POST /orders"
              payload: { customer_id: "${c_id}", design_id: "${d_id}" }
              as: Customer
              captures: { o_id: "$.data.id", o_v: "$.data.version" }
            - call: "POST /orders/${o_id}/line-items"
              payload: { paper_stock_id: "${p_id}", finish_option_id: "${f_id}", quantity: 150, expected_order_version: "${o_v}" }
              as: Customer
            - call: "POST /orders/${o_id}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
            - call: "POST /designs/${d_id}/proofs"
              payload: { designer_id: "${des_id}" }
              as: Designer
              captures: { pr_id: "$.data.id" }
          trigger:
            - call: "POST /proofs/${pr_id}/request-changes"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == \"ERR_INVALID_STATE\""

      - name: new_order_starts_in_cart
        claim_type: Initial_State
        grounds: ["state_machines.Order"]
        distinguishing_aspect: "POST /orders returns an order with status=CART."
        test_recipe:
          setup: ["Customer + Design exist."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "in@x.com", full_name: "U", phone: "555" }
              as: ShopAdmin
              captures: { c_id: "$.data.id" }
            - call: "POST /paper-stocks"
              payload: { name: "PS", base_price_cents: 500, lead_days: 7 }
              as: ShopAdmin
              captures: { p_id: "$.data.id" }
            - call: "POST /finish-options"
              payload: { name: "FS", surcharge_cents: 100, additional_lead_days: 5 }
              as: ShopAdmin
              captures: { f_id: "$.data.id" }
            - call: "POST /event-packages"
              payload: { name: "Wed", package_type: "WEDDING", deposit_pct: 0.5, min_qty: 50, proof_expiry_days: 14 }
              as: ShopAdmin
              captures: { pkg_id: "$.data.id" }
            - call: "POST /designs"
              payload: { customer_id: "${c_id}", event_package_id: "${pkg_id}", paper_stock_id: "${p_id}", finish_option_id: "${f_id}" }
              as: Customer
              captures: { d_id: "$.data.id" }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${c_id}", design_id: "${d_id}" }
              as: Customer
              captures: { o_status: "$.data.status" }
          assert:
            - "Order.status == \"CART\""

      - name: delivered_order_cannot_be_cancelled
        claim_type: Terminal_State_Lockdown
        grounds:
          - state_machines.Order
          - errors[ERR_ALREADY_TERMINAL]
        distinguishing_aspect: "Cancel on DELIVERED order returns ERR_ALREADY_TERMINAL — mirrors the CANCELLED case but from a different terminal state."
        excluded_because:
          difficulty_instance: transitive_cascade / order_cancel_from_deposit_pending_depth_three_cascade
          rationale: "The cascade instance covers cancel-from-non-terminal; the terminal-lockdown claim is symmetric and enumerated as an excluded stub."

      - name: designer_cannot_submit_others_proof
        claim_type: Precondition_Enforcement
        grounds:
          - state_machines.Proof.DRAFT_to_SUBMITTED
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "Designer A submitting Proof owned by Designer B is rejected — precondition acting Designer.id == Proof.designer_id."
        test_recipe:
          setup:
            - "Order confirmed. Proof PR owned by Designer A (des_a). Designer B (des_b) also exists."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "sm3@x.com", full_name: "U", phone: "555" }
              as: ShopAdmin
              captures: { c_id: "$.data.id" }
            - call: "POST /paper-stocks"
              payload: { name: "PS", base_price_cents: 500, lead_days: 7 }
              as: ShopAdmin
              captures: { p_id: "$.data.id" }
            - call: "POST /finish-options"
              payload: { name: "FS", surcharge_cents: 100, additional_lead_days: 5 }
              as: ShopAdmin
              captures: { f_id: "$.data.id" }
            - call: "POST /event-packages"
              payload: { name: "Wed", package_type: "WEDDING", deposit_pct: 0.5, min_qty: 50, proof_expiry_days: 14 }
              as: ShopAdmin
              captures: { pkg_id: "$.data.id" }
            - call: "POST /designers"
              payload: { full_name: "DES A", active: true }
              as: ShopAdmin
              captures: { des_a: "$.data.id" }
            - call: "POST /designers"
              payload: { full_name: "DES B", active: true }
              as: ShopAdmin
              captures: { des_b: "$.data.id" }
            - call: "POST /designs"
              payload: { customer_id: "${c_id}", event_package_id: "${pkg_id}", paper_stock_id: "${p_id}", finish_option_id: "${f_id}" }
              as: Customer
              captures: { d_id: "$.data.id" }
            - call: "POST /orders"
              payload: { customer_id: "${c_id}", design_id: "${d_id}" }
              as: Customer
              captures: { o_id: "$.data.id", o_v: "$.data.version" }
            - call: "POST /orders/${o_id}/line-items"
              payload: { paper_stock_id: "${p_id}", finish_option_id: "${f_id}", quantity: 150, expected_order_version: "${o_v}" }
              as: Customer
            - call: "POST /orders/${o_id}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
            - call: "POST /designs/${d_id}/proofs"
              payload: { designer_id: "${des_a}" }
              as: Designer
              as_user_id: "${des_a}"
              captures: { pr_id: "$.data.id" }
          trigger:
            - call: "POST /proofs/${pr_id}/submit"
              payload: {}
              as: Designer
              as_user_id: "${des_b}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == \"ERR_UNAUTHORIZED\""

      - name: proof_cycle_and_parallel_dimensions_already_exercised_by_1_8
        claim_type: Valid_Transition
        grounds: ["state_machines.Proof", "state_machines.WorkOrder"]
        excluded_because:
          difficulty_instance: non_linear_state_machine / proof_cycle_changes_requested_back_to_submitted
          rationale: "Non-linear transition coverage is depth-probed by §1.8 Rule 3; per-transition happy-path claims for these two machines are collapsed here to avoid duplication."

  # =====================================================================
  # Calculations
  # =====================================================================
  - section: calculations
    instances:

      - name: rush_surcharge_at_seven_day_boundary_transition
        claim_type: Boundary
        grounds:
          - calculations.rush_surcharge_cents
          - calculations.rush_surcharge_cents.constants
        distinguishing_aspect: "At days=7 exact → 0.15 tier (12375 cents on 82500 subtotal); at days=6 → 0.30 tier (24750 cents). Inner boundary DISTINCT from 14-day outer boundary in §1.8."
        test_recipe:
          setup:
            - "Clock at 2026-04-01. Order O with subtotal 82500."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: ShopAdmin
            - call: "POST /customers"
              payload: { email: "rush7@x.com", full_name: "U", phone: "555" }
              as: ShopAdmin
              captures: { c_id: "$.data.id" }
            - call: "POST /paper-stocks"
              payload: { name: "PS", base_price_cents: 500, lead_days: 7 }
              as: ShopAdmin
              captures: { p_id: "$.data.id" }
            - call: "POST /finish-options"
              payload: { name: "FS", surcharge_cents: 100, additional_lead_days: 5 }
              as: ShopAdmin
              captures: { f_id: "$.data.id" }
            - call: "POST /event-packages"
              payload: { name: "Wed", package_type: "WEDDING", deposit_pct: 0.5, min_qty: 50, proof_expiry_days: 14 }
              as: ShopAdmin
              captures: { pkg_id: "$.data.id" }
            - call: "POST /designs"
              payload: { customer_id: "${c_id}", event_package_id: "${pkg_id}", paper_stock_id: "${p_id}", finish_option_id: "${f_id}" }
              as: Customer
              captures: { d_id: "$.data.id" }
            - call: "POST /orders"
              payload: { customer_id: "${c_id}", design_id: "${d_id}" }
              as: Customer
              captures: { o_id: "$.data.id", o_v: "$.data.version" }
            - call: "POST /orders/${o_id}/line-items"
              payload: { paper_stock_id: "${p_id}", finish_option_id: "${f_id}", quantity: 150, expected_order_version: "${o_v}" }
              as: Customer
          trigger:
            - call: "POST /orders/${o_id}/apply-rush"
              payload: { rush_deadline: "2026-04-08T00:00:00Z" }
              as: Customer
              as_user_id: "${c_id}"
              captures: { s_at_7: "$.data.rush_surcharge_cents" }
          assert:
            - "Order.rush_surcharge_cents == 12375  # days=7 → 15% of 82500"

      - name: revision_fee_starts_on_fourth_submission
        claim_type: Correct_Result
        grounds:
          - state_machines.Proof.CHANGES_REQUESTED_to_SUBMITTED
          - entities.Proof.fields.revision_fee_cents
        distinguishing_aspect: "revision 1-3 free; revision 4 adds 2500 cents; total_cents reflects the 2500 increment."
        test_recipe:
          setup:
            - "Order O confirmed, Proof PR cycled through 3 submissions."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "rev@x.com", full_name: "U", phone: "555" }
              as: ShopAdmin
              captures: { c_id: "$.data.id" }
            - call: "POST /paper-stocks"
              payload: { name: "PS", base_price_cents: 500, lead_days: 7 }
              as: ShopAdmin
              captures: { p_id: "$.data.id" }
            - call: "POST /finish-options"
              payload: { name: "FS", surcharge_cents: 100, additional_lead_days: 5 }
              as: ShopAdmin
              captures: { f_id: "$.data.id" }
            - call: "POST /event-packages"
              payload: { name: "Wed", package_type: "WEDDING", deposit_pct: 0.5, min_qty: 50, proof_expiry_days: 14 }
              as: ShopAdmin
              captures: { pkg_id: "$.data.id" }
            - call: "POST /designers"
              payload: { full_name: "DES", active: true }
              as: ShopAdmin
              captures: { des_id: "$.data.id" }
            - call: "POST /designs"
              payload: { customer_id: "${c_id}", event_package_id: "${pkg_id}", paper_stock_id: "${p_id}", finish_option_id: "${f_id}" }
              as: Customer
              captures: { d_id: "$.data.id" }
            - call: "POST /orders"
              payload: { customer_id: "${c_id}", design_id: "${d_id}" }
              as: Customer
              captures: { o_id: "$.data.id", o_v: "$.data.version" }
            - call: "POST /orders/${o_id}/line-items"
              payload: { paper_stock_id: "${p_id}", finish_option_id: "${f_id}", quantity: 150, expected_order_version: "${o_v}" }
              as: Customer
            - call: "POST /orders/${o_id}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
            - call: "POST /designs/${d_id}/proofs"
              payload: { designer_id: "${des_id}" }
              as: Designer
              captures: { pr_id: "$.data.id" }
            - call: "POST /proofs/${pr_id}/submit"
              payload: {}
              as: Designer
            - call: "POST /proofs/${pr_id}/request-changes"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
            - call: "POST /proofs/${pr_id}/submit"
              payload: {}
              as: Designer
            - call: "POST /proofs/${pr_id}/request-changes"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
            - call: "POST /proofs/${pr_id}/submit"
              payload: {}
              as: Designer
            - call: "POST /proofs/${pr_id}/request-changes"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
          trigger:
            - call: "POST /proofs/${pr_id}/submit"
              payload: {}
              as: Designer
              captures: { fee: "$.data.revision_fee_cents", rev: "$.data.current_revision_number" }
            - call: "GET /orders/${o_id}"
              payload: {}
              as: ShopAdmin
              captures: { tot: "$.data.total_cents" }
