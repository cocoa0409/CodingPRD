      - name: lease_activation_assigns_airframe_seeds_deposit_and_opens_first_period
        claim_type: Side Effect Execution
        grounds:
          - state_machines.LeaseAgreement[APPROVED -> ACTIVE]
          - calculations.monthly_utilization_charge
          - entities.UtilizationPeriod.fields.period_month
          - endpoints[POST /wetlease/leases/{leaseId}/activate]
        distinguishing_aspect: |
          All four declared side effects must be observable from one call: airframe ASSIGNED with
          assigned_lease_id set, the maintenance reserve seeded (applied 0 / remaining 500000),
          a UtilizationPeriod for 2026-09 in OPEN with the un-prorated mgh_effective_hours 5.0000
          and a zero-utilisation provisional charge of 2,400,000 cents, and the lease version at
          exactly 4 (create 1, submit 2, docket cascade 3, activate 4 - a certificate write bumps
          nothing). Implementations that open a period per lease MONTH-RANGE rather than one for
          the term-start month fail on total_count.
        test_recipe:
