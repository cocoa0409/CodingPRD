          assert:
            - "${d15_status} == \"PROSPECT\" and ${cl15_status} == \"PENDING\" before the trigger"
            - "First trigger call returns 409 and ${err15} == \"ERR_CREDIT_LINE_NOT_ACTIVE\", not ERR_DEALER_NOT_ACTIVE, because priority 61 precedes priority 62"
            - "After the first trigger call GET /floorplan/units?dealer_id=${d15} returns total_count 0 - nothing was created"
            - "${cl15_status2} == \"ACTIVE\" and the activate call also cascaded Dealer.${d15}.status to ACTIVE"
            - "Third trigger call returns 201 with ${u15_funding} == \"REGISTERED\" and ${u15_title} == \"NOT_RECEIVED\", proving the identical payload was rejected only for the grandparent's state"
            - "CreditLine.${cl15}.activated_at == \"2026-08-01T00:00:00Z\" and Dealer.${d15}.next_audit_due_at == \"2027-01-28T00:00:00Z\""

      - name: advance_funding_blocked_until_the_unit_title_dimension_reaches_lender_held
