        excluded_because:
          difficulty_instance: "dual_variant_calc / dual_variant_fraud_score_point_in_time_versus_trailing_on_affiliate"
          rationale: "The §1.8 instance materialises both fraud_risk_score variants on one affiliate and asserts the exact delta when a case is cleared and when the trailing window ages past 90 days, including the DECAY_FLOOR clamp and the CLEARED_DECAY_MULTIPLIER. The breadth claim 'both variants produce expected results and the delta on switch is correct' is fully consumed by it."

