            - { call: "POST /api/seasons/${s}/advance-posture", payload: { target_posture: "BOOKING" }, as: Owner }
            - { call: "POST /api/buyer-accounts", payload: { name: "Acme Wholesale", credit_limit_cents: 100000000 }, as: Owner, captures: { buy: $.data.id } }
            - { call: "POST /api/wholesale-orders", payload: { season_id: "${s}", buyer_account_id: "${buy}", species: "NOBLE_FIR", height_class: "H_6_7", quantity: 10, unit_price_cents: 400 }, as: WholesaleBuyer, as_user_id: "${buy}", captures: { ord: $.data.id } }
            - { call: "POST /api/wholesale-orders/${ord}/submit", payload: {}, as: WholesaleBuyer, as_user_id: "${buy}" }
          trigger:
            - { call: "POST /api/wholesale-orders/${ord}/cancel", payload: {}, as: FarmManager, captures: { st: $.data.status } }
          assert:
            - "200 with ${st} == CANCELLED (FarmManager shares cancel with WholesaleBuyer)"
            - "BuyerAccount.${buy}.exposure_cents == 0 after the shared-op cancel"

      - name: replant_approver_must_differ_from_proposer_sod
        claim_type: segregation_of_duties
        grounds: ["validations[priority=3]", "errors[ERR_SOD_VIOLATION]", "state_machines.ReplantPlan.PROPOSED_to_APPROVED", "state_machines.ReplantPlan.APPROVED_to_EXECUTED"]
        distinguishing_aspect: "Same user id holding both FarmManager and Owner roles cannot approve its own proposal (ERR_SOD_VIOLATION); a different Owner id approves and execution then creates the successor lot and flips the block back to PLANTED."
        test_recipe:
          setup: ["season; block harvested bare: lot of 50 planted, advanced to HARVESTABLE, all 50 culled (lot DEPLETED), advanced to HARVESTED; replant plan proposed by fm-carol"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { year: 2026, booking_open_at: "2026-06-01T00:00:00Z", booking_close_at: "2026-08-31T23:59:59Z", harvest_window_start: "2026-11-01", harvest_window_end: "2026-11-25", shipping_window_start: "2026-11-15T00:00:00Z", shipping_window_end: "2026-12-10T23:59:59Z" }, as: Owner, captures: { s: $.data.id } }
            - { call: "POST /api/blocks", payload: { season_id: "${s}", block_code: "B-1", acreage: 12.5 }, as: FarmManager, captures: { blk: $.data.id } }
            - { call: "POST /api/crop-lots", payload: { block_id: "${blk}", species: "NOBLE_FIR", planted_year: 2019, initial_counts: { H_4_5: 0, H_5_6: 0, H_6_7: 50, H_7_8: 0, H_8_9: 0, H_9_PLUS: 0 } }, as: FarmManager, captures: { lot: $.data.id } }
            - { call: "GET /api/crop-lots/${lot}/stand-buckets", payload: {}, as: FarmManager, captures: { b67: "$.data[2].id" } }
            - { call: "POST /api/blocks/${blk}/advance-rotation", payload: {}, as: FarmManager }
            - { call: "POST /api/blocks/${blk}/advance-rotation", payload: {}, as: FarmManager }
            - { call: "POST /api/cull-records", payload: { bucket_id: "${b67}", count: 50, reason: "DISEASE" }, as: FarmManager }
            - { call: "POST /api/blocks/${blk}/advance-rotation", payload: {}, as: FarmManager, captures: { bst: $.data.rotation_state } }
            - { call: "POST /api/replant-plans", payload: { block_id: "${blk}", species: "DOUGLAS_FIR", planned_count: 400 }, as: FarmManager, as_user_id: "fm-carol", captures: { rp: $.data.id } }
          trigger:
            - { call: "POST /api/replant-plans/${rp}/approve", payload: {}, as: Owner, as_user_id: "fm-carol" }
            - { call: "POST /api/replant-plans/${rp}/approve", payload: {}, as: Owner, as_user_id: "owner-sam", captures: { rst: $.data.status } }
            - { call: "POST /api/replant-plans/${rp}/execute", payload: {}, as: FarmManager, as_user_id: "fm-carol", captures: { newlot: $.data.created_crop_lot_id, rex: $.data.status } }
          assert:
            - "self-approval: 403 with error_id == ERR_SOD_VIOLATION; plan stays PROPOSED"
            - "independent approval: ${rst} == APPROVED with approved_by_user_id == owner-sam"
            - "execute: ${rex} == EXECUTED; Block.${blk}.rotation_state == PLANTED (was ${bst} == HARVESTED)"
            - "new lot ${newlot} exists on the block: GET /api/crop-lots/${newlot}/stand-buckets [0] is H_4_5 with baseline_count == 400, others 0"

  # ---------------------------------------------------------------------------
  - section: complexity_layers
    instances:
      - name: survey_post_stale_lot_version_occ
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[survey-post-stale-lot]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Two sequential posts against CropLot.version 1: the first succeeds (version -> 2), the second carrying the stale expected version 1 is deterministically rejected 412 — no parallelism involved."
        test_recipe:
          setup: ["season; lot H_6_7 300 (version 1); surveys A and B drafted"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { year: 2026, booking_open_at: "2026-06-01T00:00:00Z", booking_close_at: "2026-08-31T23:59:59Z", harvest_window_start: "2026-11-01", harvest_window_end: "2026-11-25", shipping_window_start: "2026-11-15T00:00:00Z", shipping_window_end: "2026-12-10T23:59:59Z" }, as: Owner, captures: { s: $.data.id } }
            - { call: "POST /api/blocks", payload: { season_id: "${s}", block_code: "B-1", acreage: 12.5 }, as: FarmManager, captures: { blk: $.data.id } }
            - { call: "POST /api/crop-lots", payload: { block_id: "${blk}", species: "NOBLE_FIR", planted_year: 2019, initial_counts: { H_4_5: 0, H_5_6: 0, H_6_7: 300, H_7_8: 0, H_8_9: 0, H_9_PLUS: 0 } }, as: FarmManager, captures: { lot: $.data.id, lotv: $.data.version } }
            - { call: "POST /api/surveys", payload: { crop_lot_id: "${lot}", surveyed_counts: { H_4_5: 0, H_5_6: 0, H_6_7: 295, H_7_8: 0, H_8_9: 0, H_9_PLUS: 0 } }, as: FarmManager, captures: { sa: $.data.id } }
            - { call: "POST /api/surveys", payload: { crop_lot_id: "${lot}", surveyed_counts: { H_4_5: 0, H_5_6: 0, H_6_7: 290, H_7_8: 0, H_8_9: 0, H_9_PLUS: 0 } }, as: FarmManager, captures: { sb: $.data.id } }
          trigger:
            - { call: "POST /api/surveys/${sa}/post", payload: { expected_crop_lot_version: "${lotv}" }, as: FarmManager, captures: { ast: $.data.status } }
            - { call: "POST /api/surveys/${sb}/post", payload: { expected_crop_lot_version: "${lotv}" }, as: FarmManager }
          assert:
            - "first post: ${ast} == POSTED (version 1 matched); CropLot.${lot}.version == 2"
            - "second post with the same captured version: 412 with error_id == ERR_STALE_VERSION"
            - "InventorySurvey.${sb}.status remains DRAFT; bucket baseline stays 295"

      - name: allocate_stale_order_version_occ
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[order-allocate-stale-order]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Partial allocation legitimately advances the order version; a second allocate carrying the pre-first-allocate version fails 412 even though inventory remains — the stale view, not the stock, is the problem."
        test_recipe:
          setup: ["season in BOOKING; lot H_6_7 50; order qty 10 submitted (version 2)"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { year: 2026, booking_open_at: "2026-06-01T00:00:00Z", booking_close_at: "2026-08-31T23:59:59Z", harvest_window_start: "2026-11-01", harvest_window_end: "2026-11-25", shipping_window_start: "2026-11-15T00:00:00Z", shipping_window_end: "2026-12-10T23:59:59Z" }, as: Owner, captures: { s: $.data.id } }
            - { call: "POST /api/blocks", payload: { season_id: "${s}", block_code: "B-1", acreage: 12.5 }, as: FarmManager, captures: { blk: $.data.id } }
            - { call: "POST /api/crop-lots", payload: { block_id: "${blk}", species: "NOBLE_FIR", planted_year: 2019, initial_counts: { H_4_5: 0, H_5_6: 0, H_6_7: 50, H_7_8: 0, H_8_9: 0, H_9_PLUS: 0 } }, as: FarmManager, captures: { lot: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: Owner }
            - { call: "POST /api/seasons/${s}/advance-posture", payload: { target_posture: "BOOKING" }, as: Owner }
            - { call: "POST /api/buyer-accounts", payload: { name: "Acme Wholesale", credit_limit_cents: 100000000 }, as: Owner, captures: { buy: $.data.id } }
            - { call: "POST /api/wholesale-orders", payload: { season_id: "${s}", buyer_account_id: "${buy}", species: "NOBLE_FIR", height_class: "H_6_7", quantity: 10, unit_price_cents: 400 }, as: WholesaleBuyer, as_user_id: "${buy}", captures: { ord: $.data.id } }
            - { call: "POST /api/wholesale-orders/${ord}/submit", payload: {}, as: WholesaleBuyer, as_user_id: "${buy}", captures: { ov: $.data.version } }
          trigger:
            - { call: "POST /api/wholesale-orders/${ord}/allocate", payload: { quantity: 4, expected_order_version: "${ov}" }, as: FarmManager, captures: { a1: $.data.allocated_now } }
            - { call: "POST /api/wholesale-orders/${ord}/allocate", payload: { quantity: 4, expected_order_version: "${ov}" }, as: FarmManager }
          assert:
            - "first allocate: ${a1} == 4 (order version advanced 2 -> 3)"
            - "second allocate replaying the stale captured version: 412 with error_id == ERR_STALE_VERSION"
            - "order allocated_qty remains 4; bucket reserved_count == 4"

      - name: ucut_tag_expiry_sweep_restores_tree
        claim_type: ops_run_checkpoint
        grounds: ["calculations.run_ops_sweeps", "state_machines.UcutTag.ACTIVE_to_EXPIRED", "entities.UcutTag.fields.expires_at"]
        distinguishing_aspect: "Tag TTL boundary at the checkpoint: a tag whose expires_at equals the run's clock is swept (<= semantics); expiry returns the tree to standing (9 -> 10) without touching ucut_sold."
        test_recipe:
          setup: ["season in HARVEST; ucut HARVESTABLE block, bucket H_6_7 standing 10; tag created at 2026-11-05T08:00:00Z (expires_at 2026-11-07T08:00:00Z)"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { year: 2026, booking_open_at: "2026-06-01T00:00:00Z", booking_close_at: "2026-08-31T23:59:59Z", harvest_window_start: "2026-11-01", harvest_window_end: "2026-11-25", shipping_window_start: "2026-11-15T00:00:00Z", shipping_window_end: "2026-12-10T23:59:59Z" }, as: Owner, captures: { s: $.data.id } }
            - { call: "POST /api/blocks", payload: { season_id: "${s}", block_code: "B-U", acreage: 4.0, ucut_designated: true }, as: FarmManager, captures: { blk: $.data.id } }
            - { call: "POST /api/crop-lots", payload: { block_id: "${blk}", species: "NORDMANN_FIR", planted_year: 2018, initial_counts: { H_4_5: 0, H_5_6: 0, H_6_7: 10, H_7_8: 0, H_8_9: 0, H_9_PLUS: 0 } }, as: FarmManager, captures: { lot: $.data.id } }
            - { call: "GET /api/crop-lots/${lot}/stand-buckets", payload: {}, as: FarmManager, captures: { b67: "$.data[2].id" } }
            - { call: "POST /api/blocks/${blk}/advance-rotation", payload: {}, as: FarmManager }
            - { call: "POST /api/blocks/${blk}/advance-rotation", payload: {}, as: FarmManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-11-05T08:00:00Z" }, as: Owner }
            - { call: "POST /api/seasons/${s}/advance-posture", payload: { target_posture: "BOOKING" }, as: Owner }
            - { call: "POST /api/seasons/${s}/advance-posture", payload: { target_posture: "HARVEST" }, as: Owner }
            - { call: "POST /api/ucut-tags", payload: { block_id: "${blk}", bucket_id: "${b67}", customer_name: "Patron E", price_cents: 6000 }, as: FarmManager, captures: { tag: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-11-07T08:00:00Z" }, as: Owner }
          trigger:
            - { call: "POST /api/seasons/${s}/run-ops", payload: {}, as: Owner, captures: { idx: $.data.ops_run_index } }
          assert:
            - "UcutTag.${tag}.status == EXPIRED (expires_at == clock is swept; <= boundary)"
            - "bucket standing_count back to 10 and tagged_active_count 0; ucut_sold_cumulative == 0 (an expiry is not a sale)"
            - "Season.${s}.ops_run_index == 1 (${idx} == 1)"

      - name: cascading_side_effects_multi_hop
        claim_type: cascading_side_effects
        grounds: ["calculations.over_reservation_sweep", "calculations.run_ops_sweeps"]
        excluded_because:
          difficulty_instance: "transitive_cascade / survey_post_overreservation_sweep_cascade"
          rationale: "The 3+-hop cascade (survey -> bucket -> allocation -> order) and the run-ops backfill cascade are both asserted end-to-end in §1.8."

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_consistency_after_allocate
        claim_type: immediate_visibility
        grounds: ["complexity_profile.consistency_model"]
        distinguishing_aspect: "Immediate consistency: the allocate response, the order read, and the bucket read all reflect the reservation within the same logical instant — no recompute or settle step exists."
        test_recipe:
          setup: ["season in BOOKING; lot H_6_7 50; order qty 12 submitted"]
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { year: 2026, booking_open_at: "2026-06-01T00:00:00Z", booking_close_at: "2026-08-31T23:59:59Z", harvest_window_start: "2026-11-01", harvest_window_end: "2026-11-25", shipping_window_start: "2026-11-15T00:00:00Z", shipping_window_end: "2026-12-10T23:59:59Z" }, as: Owner, captures: { s: $.data.id } }
            - { call: "POST /api/blocks", payload: { season_id: "${s}", block_code: "B-1", acreage: 12.5 }, as: FarmManager, captures: { blk: $.data.id } }
            - { call: "POST /api/crop-lots", payload: { block_id: "${blk}", species: "NOBLE_FIR", planted_year: 2019, initial_counts: { H_4_5: 0, H_5_6: 0, H_6_7: 50, H_7_8: 0, H_8_9: 0, H_9_PLUS: 0 } }, as: FarmManager, captures: { lot: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: Owner }
            - { call: "POST /api/seasons/${s}/advance-posture", payload: { target_posture: "BOOKING" }, as: Owner }
            - { call: "POST /api/buyer-accounts", payload: { name: "Acme Wholesale", credit_limit_cents: 100000000 }, as: Owner, captures: { buy: $.data.id } }
            - { call: "POST /api/wholesale-orders", payload: { season_id: "${s}", buyer_account_id: "${buy}", species: "NOBLE_FIR", height_class: "H_6_7", quantity: 12, unit_price_cents: 400 }, as: WholesaleBuyer, as_user_id: "${buy}", captures: { ord: $.data.id } }
            - { call: "POST /api/wholesale-orders/${ord}/submit", payload: {}, as: WholesaleBuyer, as_user_id: "${buy}", captures: { ov: $.data.version } }
          trigger:
            - { call: "POST /api/wholesale-orders/${ord}/allocate", payload: { quantity: 12, expected_order_version: "${ov}" }, as: FarmManager, captures: { tot: $.data.allocated_total, ost: $.data.order_status } }
          assert:
            - "allocate response itself: ${tot} == 12 and ${ost} == ALLOCATED"
