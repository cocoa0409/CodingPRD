  - method: POST
    path: "/mlc/audits/{id}/withdraw"
    description: "Auditor withdraws an open audit"
    roles: [MemberUser]
    code: 200
    input: []
    output: AuditEngagement
    side_effects: ["status -> WITHDRAWN", "scoped reports -> ACCEPTED", "audit credit refunded"]

  # --- CycleRun / DistributionLine ---
  - method: POST
    path: "/mlc/cycle-runs"
    description: "Open a historical-unmatched distribution cycle"
    roles: [MLCAdministrator]
    code: 201
    input: [cycle_month, pool_from_month, pool_to_month, methodology]
    output: CycleRun
    side_effects: ["status = OPEN"]

  - method: GET
    path: "/mlc/cycle-runs"
    description: "List cycle runs"
