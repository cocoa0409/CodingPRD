  - rule_id: transitive_cascade
    instances:
      - name: registration_approval_depth3_cascade
        grounds:
          - state_machines.RightsRegistration.UNDER_REVIEW_to_APPROVED
          - calculations.pool_attribution
          - entities.UsageBatch.fields.matched_play_count
          - entities.RoyaltyPool.fields.holding_cents
        distinguishing_aspect: |
          One approve call produces three chained effects where each link is caused by the
          PREVIOUS link and not by the call: link 1 changes the registration, link 2 re-derives the
          Work and therefore claim-matches a previously unmatched usage line, link 3 re-derives
          that line's batch counters and re-attributes the CALCULATED pool — so the pool's
          holding_cents falls to 0 without the pool ever being addressed.
        test_recipe:
          setup:
            - "The canonical GB/INDIVIDUAL fixture with the third line ('Neon Ledger', 50000 plays, no ISRC, no artist) left UNMATCHED at confidence 5000."
            - "The pool is CALCULATED but deliberately NOT finalized, so link 3 can re-run attribution rather than merely reclassify frozen amounts."
            - "A MASTER registration over the 'Neon Ledger' recording exists in UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /royalties/rights-holders"
              payload: { legal_name: "Northbeam Records", holder_type: "LABEL", home_territory_code: "GB", direct_deal_rate_bps: 800 }
              as: RoyaltyAdmin
              captures: { lbl: "$.data.id" }
            - call: "POST /royalties/rate-schedules"
              payload: { proceeding_ref: "CRB-2026-01", territory_code: "GB", subscription_tier: "INDIVIDUAL", revenue_share_bps: 7000, per_subscriber_minimum_cents: 500, mechanical_share_bps: 4000, performance_share_bps: 6000, statutory_floor_per_play_millicents: 100, effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: RegulatoryOfficer
              captures: { rs1: "$.data.id" }
            - call: "POST /royalties/rate-schedules/${rs1}/promulgate"
              payload: {}
