            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T00:00:00Z" }
              as: ProgramAdmin
            - call: "GET /api/premises/${prem_id}"
              as: StateAuditor
              captures: { prem_gt: $.data.disease_status }
            - call: "GET /api/premises/${prem_id}/quarantine-orders"
