            - call: "POST /culinary/lto-campaigns"
              payload: { menu_item_id: "${mi_id}", window_start: "2026-09-01T00:00:00.000Z", window_end: "2026-09-15T00:00:00.000Z", promo_price_cents: 380, forecast_units: 500, expected_menu_item_version: "${mi_v2}" }
              as: RecipeDeveloper
              captures: { lto_a: $.data.id, lto_a_region: $.data.region_code, lto_a_status: $.data.status }
