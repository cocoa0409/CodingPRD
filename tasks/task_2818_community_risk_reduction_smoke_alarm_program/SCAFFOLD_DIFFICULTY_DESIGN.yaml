  - rule_id: cross_entity_state_dependency
    instances:
      - name: route_creation_depends_on_riskzone_assessment_state
        grounds:
          - validations[priority 10 - state - ERR_ZONE_NOT_TARGETABLE]
          - state_machines.RiskZone.ASSESSED_to_TARGETED
          - errors.ERR_ZONE_NOT_TARGETABLE
          - endpoints[POST /crr/routes]
        distinguishing_aspect: |
          Entity pair CanvassRoute -> RiskZone: the child cannot be created while the parent zone is
          UNASSESSED and its risk_tier is null. Assessing the same zone unblocks the identical
          request, and the successful creation drives the zone ASSESSED -> TARGETED.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One freshly created zone that has never been assessed, so assessment_status is UNASSESSED and risk_tier is null."
            - "One ADVANCED crew."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /crr/zones"
              payload: { zone_code: "Z-RAW", name: "Unassessed Leaf", occupied_units: 2000, structure_fire_count_5yr: 15, fire_injury_count_5yr: 2, pre_1980_unit_pct: 40.0, senior_household_pct: 20.0, under5_household_pct: 8.0, disability_household_pct: 4.0, assumed_alarm_absence_pct: 50.0, daily_visit_cap: 12 }
              as: RiskAnalyst
              captures: { z_id: $.data.id, z_v0: $.data.version }
            - call: "POST /crr/crews"
              payload: { crew_code: "CREW-R1", member_count: 2, certification_level: "ADVANCED", max_daily_minutes: 480 }
              as: ProgramAdmin
              captures: { crew_id: $.data.id }
          trigger:
            - call: "POST /crr/routes"
              payload: { zone_id: "${z_id}", crew_id: "${crew_id}", service_date: "2026-08-03", window_start_utc: "2026-08-03T13:00:00Z", window_end_utc: "2026-08-03T21:00:00Z", planned_slots: 2 }
              as: CanvassCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /crr/zones/${z_id}/assessments"
              payload: { basis: "PROVISIONAL", expected_zone_version: "${z_v0}" }
              as: RiskAnalyst
              captures: { asmt_id: $.data.id }
            - call: "POST /crr/routes"
              payload: { zone_id: "${z_id}", crew_id: "${crew_id}", service_date: "2026-08-03", window_start_utc: "2026-08-03T13:00:00Z", window_end_utc: "2026-08-03T21:00:00Z", planned_slots: 2 }
              as: CanvassCoordinator
              captures: { r_id: $.data.id }
          assert:
            - "the first route creation returns 409 with response.error_id == ERR_ZONE_NOT_TARGETABLE"
            - "ZoneAssessment.${asmt_id}.risk_score == 54.52"
            - "ZoneAssessment.${asmt_id}.risk_tier == TIER_2"
            - "the second route creation returns 201 and CanvassRoute.${r_id}.status == PLANNED"
            - "RiskZone.${z_id}.assessment_status == TARGETED"
            - "RiskZone.${z_id}.risk_tier == TIER_2"

      - name: device_lot_receipt_depends_on_partner_grant_activation_state
        grounds:
          - validations[priority 10 - state - ERR_GRANT_NOT_ACTIVE]
          - state_machines.PartnerGrant.DRAFT_to_ACTIVE
          - errors.ERR_GRANT_NOT_ACTIVE
          - endpoints[POST /crr/device-lots]
        distinguishing_aspect: |
          A different entity pair - DeviceLot -> PartnerGrant - and a different parent state axis
          (funding activation rather than risk assessment). A lot cannot be received against a DRAFT
          grant; activating that grant admits the byte-identical request.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One nonprofit partner with a signed agreement."
            - "One grant over 2026-07-01..2026-12-31 left in DRAFT, funding SMOKE_10YR at 2195 cents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
