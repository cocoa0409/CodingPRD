              as: BloodBankTechnologist
            - call: "POST /blood-bank/blood-units/${u2}/release-from-quarantine"
              as: BloodBankTechnologist
          trigger:
            - call: "GET /blood-bank/par-level-policies/${pol}/posture"
              as: BloodBankSupervisor
              captures: { post: $.data.physical_posture, usable: $.data.usable_units }
          assert:
            - "usable == 2 and post == NORMAL (2 > watch 1 clears every rung)"
      - name: prospective_inbound_beyond_24h_excluded
        claim_type: input_set_filtering
        grounds:
          - "calculations.bucket_prospective_posture"
        distinguishing_aspect: "An acknowledged order with expected_delivery_at 48h out is OUTSIDE the 24h horizon: inbound_units_24h == 0 and prospective == physical."
        test_recipe:
          setup: ["clock 2026-08-10T09:00:00Z; policy RBC:O:NEG (watch 6, shortage 4, critical 2); SO with 6 RBC O NEG units ACKNOWLEDGED, expected_delivery_at 2026-08-12T09:00:00Z"]
          setup_api_calls:
            - call: "POST /blood-bank/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
