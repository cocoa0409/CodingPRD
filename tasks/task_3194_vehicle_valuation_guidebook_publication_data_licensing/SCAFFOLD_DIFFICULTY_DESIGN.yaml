              as: DataOps
              captures: { b_to: $.data.id }
            - call: "POST /batches/${b_to}/validate"
              payload: {}
              as: DataOps
            - call: "POST /batches/${b_to}/accept"
              payload: {}
              as: DataOps
            - call: "POST /valuation-series"
              payload: { configuration_id: "${cfg_to}", region_id: "${r_to}", effective_from: "2026-09-01T00:00:00Z", cadence: "WEEKLY", external_key: "ser-to" }
              as: ValuationAdmin
              captures: { s_to: $.data.id }
            - call: "POST /valuation-series/${s_to}/activate"
              payload: {}
              as: ValuationAdmin
            - call: "POST /valuation-editions"
              payload: { series_id: "${s_to}", effective_at: "2026-09-01T00:00:00Z" }
              as: ValuationAdmin
              captures: { e_to1: $.data.id }
            - call: "POST /valuation-editions/${e_to1}/publish"
              payload: {}
              as: ValuationAdmin
            - call: "POST /valuation-editions"
              payload: { series_id: "${s_to}", effective_at: "2026-09-05T00:00:00Z" }
              as: ValuationAdmin
              captures: { e_to2: $.data.id }
          trigger:
            - call: "POST /valuation-editions/${e_to2}/publish"
              payload: {}
              as: ValuationAdmin
              captures: { to_err: $.data.error_id }
          assert:
            - "to_err == ERR_CADENCE_VIOLATION"
            - "ValuationEdition.${e_to2}.status == PENDING"
            - "a third edition with effective_at == 2026-09-08T00:00:00Z (exactly 7 days after the first) publishes successfully"

      - name: market_shift_nonoverlap_per_scope_bucket
        grounds:
          - state_machines.MarketShift.DRAFT_to_ACTIVE
          - calculations.market_shift_blending
        distinguishing_aspect: |
          Different interval semantics on a different resource: MarketShift
          activation forbids overlap within the same (region, segment) scope
          bucket over intersecting effective windows, while overlapping in
          time across different buckets (region EAST + segment TRUCK) is
          legal — geometric intersection semantics, not a minimum-gap rule.
        test_recipe:
          setup:
            - "Region EAST exists; shift sh_to1 scoped (region EAST, segment null) effective 2026-09-01 is ACTIVE"
          setup_api_calls:
            - call: "POST /regions"
              payload: { region_code: "EAST", name: "East Region" }
              as: ValuationAdmin
              captures: { r_to2: $.data.id }
            - call: "POST /market-shifts"
              payload: { region_id: "${r_to2}", segment: null, effective_at: "2026-09-01T00:00:00Z", pct_adjustment: 0.02 }
              as: ValuationAdmin
              captures: { sh_to1: $.data.id }
            - call: "POST /market-shifts/${sh_to1}/activate"
              payload: {}
              as: ValuationAdmin
            - call: "POST /market-shifts"
              payload: { region_id: "${r_to2}", segment: null, effective_at: "2026-09-03T00:00:00Z", pct_adjustment: 0.01 }
              as: ValuationAdmin
              captures: { sh_to2: $.data.id }
          trigger:
            - call: "POST /market-shifts/${sh_to2}/activate"
              payload: {}
              as: ValuationAdmin
              captures: { to2_err: $.data.error_id }
          assert:
            - "to2_err == ERR_INVALID_STATE"
            - "MarketShift.${sh_to2}.status == DRAFT"
            - "a shift scoped (region EAST, segment TRUCK) effective 2026-09-03 activates successfully because its scope bucket differs"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: reject_accept_cycles_keep_rejection_counter_conserved
        grounds:
          - state_machines.TransactionBatch.RECEIVED_to_REJECTED
          - state_machines.TransactionBatch.VALIDATED_to_ACCEPTED
          - entities.Source.fields.consecutive_rejections
        distinguishing_aspect: |
          Conserved quantity: source.consecutive_rejections. Invariant —
          any sequence of k rejects followed by one accept leaves
          consecutive_rejections == 0, and reject-then-accept nets to zero
          drift; the counter must never accumulate across interleaved cycles.
        test_recipe:
          setup:
            - "Source src_ci1 (DEALER, region EAST) ACTIVE; configuration cfg_ci1 exists; two batches rejected then one batch accepted"
          setup_api_calls:
            - call: "POST /regions"
              payload: { region_code: "EAST", name: "East Region" }
              as: ValuationAdmin
              captures: { r_ci1: $.data.id }
            - call: "POST /configurations"
              payload: { make: "Acme", model: "CI", year: 2021, trim: "S", segment: "SEDAN", annual_expected_miles: 10000, external_key: "cfg-ci1" }
              as: ValuationAdmin
              captures: { cfg_ci1: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "DEALER", region_id: "${r_ci1}", name: "CI1", external_key: "src-ci1" }
              as: DataOps
              captures: { src_ci1: $.data.id }
            - call: "POST /sources/${src_ci1}/activate"
              payload: {}
              as: DataOps
            - call: "POST /batches"
              payload: { source_id: "${src_ci1}", submission_ref: "ci1-r1", items: [ { configuration_id: "${cfg_ci1}", region_id: "${r_ci1}", sold_price_cents: 1000000, sale_date: "2026-08-20", mileage: 10000 } ] }
              as: DataOps
              captures: { ci1_r1: $.data.id }
            - call: "POST /batches/${ci1_r1}/reject"
              payload: {}
              as: DataOps
            - call: "POST /batches"
              payload: { source_id: "${src_ci1}", submission_ref: "ci1-r2", items: [ { configuration_id: "${cfg_ci1}", region_id: "${r_ci1}", sold_price_cents: 1000000, sale_date: "2026-08-20", mileage: 10000 } ] }
              as: DataOps
              captures: { ci1_r2: $.data.id }
            - call: "POST /batches/${ci1_r2}/reject"
              payload: {}
              as: DataOps
            - call: "POST /batches"
              payload: { source_id: "${src_ci1}", submission_ref: "ci1-a1", items: [ { configuration_id: "${cfg_ci1}", region_id: "${r_ci1}", sold_price_cents: 1000000, sale_date: "2026-08-20", mileage: 10000 } ] }
              as: DataOps
              captures: { ci1_a1: $.data.id }
            - call: "POST /batches/${ci1_a1}/validate"
              payload: {}
              as: DataOps
            - call: "POST /batches/${ci1_a1}/accept"
              payload: {}
              as: DataOps
          trigger:
            - call: "GET /sources/${src_ci1}"
              as: DataOps
              captures: { ci1_rej: $.data.consecutive_rejections }
          assert:
            - "ci1_rej == 0"
            - "Source.${src_ci1}.status == ACTIVE (no suspension despite two earlier rejects)"
            - "a further reject after the accept sets consecutive_rejections to exactly 1, not 3"

