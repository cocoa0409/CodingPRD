        distinguishing_aspect: "The past-start guard is >= rather than >: a session pinned exactly to the startup clock value 2026-08-01T00:00:00Z is accepted, while one starting one minute earlier is refused with ERR_SESSION_IN_PAST."
        test_recipe:
