  - rule_id: non_linear_state_machine
    instances:
      - name: workup_case_clearance_and_logistics_dimensions_advance_independently
        grounds:
          - state_machines.WorkupCase.clearance_status
          - state_machines.WorkupCase.logistics_status
          - state_machines.WorkupCase.logistics_status.BOOKED_to_METHOD_SET
          - entities.WorkupCase.fields.logistics_status
          - complexity_profile.state_machine_shape
        distinguishing_aspect: |
          Non-linear on WorkupCase because the entity carries two orthogonal state dimensions plus a
          third overall one: the method decision moves logistics_status UNSCHEDULED -> METHOD_SET while
          clearance_status is still PENDING, confirming a booking does NOT move logistics_status at all,
          and cancelling the confirmed booking drives the backwards edge BOOKED -> METHOD_SET without
          touching clearance_status == CLEARED or case_status == OPEN, after which the case can re-enter
          BOOKED. A single linear status column cannot express this.
        test_recipe:
          setup:
            - "domestic registry, one capacity-1 collection center, donor D1 consented to PBSC and MARROW"
            - "a workup case opened for D1 whose method is decided BEFORE any clearance item is resulted"
            - "clock walked 2026-08-01 -> 2026-09-11T08:00Z, conditioning scheduled for 2026-10-05"
          setup_api_calls:
            - call: "POST /registry/registries"
              payload: { code: "NMDP-US", name: "National Marrow Donor Program", country_code: "US", currency_code: "USD", fx_rate_to_usd: 1.0000, is_domestic: true, cooperation_tier: 1, ct_response_deadline_hours: 168 }
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { reg_dom_id: "$.data.id" }
