            - { call: "POST /menu-items", payload: { name: "Green Machine", category: "SMOOTHIE", base_price_cents: 500, recipe: [ { ingredient_id: "${spin_id}", base_qty: 50 } ], base_calories: 200 }, as: PlatformAdmin, captures: { mi_id: $.data.id } }
            - { call: "POST /customers", payload: { email: "c9@x.com", full_name: "C Nine" }, as: Anonymous, captures: { cust_id: $.data.id } }
          trigger:
            - { call: "POST /orders", payload: { store_id: "${store_id}", lines: [ { menu_item_id: "${mi_id}", size: "SMALL", boost_ids: [] } ], redeem_points: 10 }, as: Customer, as_user_id: "${cust_id}", captures: { err: $.data.error_id } }
