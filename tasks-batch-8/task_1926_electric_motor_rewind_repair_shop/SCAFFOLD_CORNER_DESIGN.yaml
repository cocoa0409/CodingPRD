              payload: { owner_customer_id: "${cust_id}", serial_number: "M-VI", rated_kw: 30, frame_mm: 200, voltage_v: 460, manufacture_year: 2020 }
              as: ServiceManager
              captures: { mvi: $.data.id }
            - call: "POST /shops/${shop_id}/work-orders"
              payload: { customer_id: "${cust_id}", motor_id: "${mvi}", priority: "STANDARD" }
