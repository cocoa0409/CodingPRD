              as: ServiceStandardsAdmin
              captures: { hnl_id: $.data.id }
            - call: "POST /api/processing-facilities/${lax_id}/service-standard-rules"
              payload: { dest_facility_id: "${jfk_id}", mail_class: "PRIORITY", service_days: 1, non_contiguous_extra_days: 0, effective_from: "2026-01-01", expected_facility_version: "${lax_v}" }
              as: ServiceStandardsAdmin
            - call: "GET /api/processing-facilities/${lax_id}"
              payload: {}
              as: ServiceStandardsAdmin
              captures: { lax_v2: $.data.version }
            - call: "POST /api/processing-facilities/${lax_id}/service-standard-rules"
              payload: { dest_facility_id: "${hnl_id}", mail_class: "PRIORITY", service_days: 1, non_contiguous_extra_days: 0, effective_from: "2026-01-01", expected_facility_version: "${lax_v2}" }
              as: ServiceStandardsAdmin
          trigger:
            - call: "POST /api/service-standard-queries"
              payload: { origin_facility_id: "${lax_id}", dest_facility_id: "${jfk_id}", mail_class: "PRIORITY", acceptance_date: "2026-09-05", acceptance_time_local: "10:00" }
