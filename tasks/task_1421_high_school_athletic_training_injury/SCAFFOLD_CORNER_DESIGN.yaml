            - { call: "GET /athletes/${b1}", payload: {}, as: ParentGuardian, as_user_id: "g-9705", captures: { err1: $.data.error_id } }
            - { call: "GET /athletes", payload: {}, as: ParentGuardian, as_user_id: "g-9705", captures: { err2: $.data.error_id } }
          assert:
