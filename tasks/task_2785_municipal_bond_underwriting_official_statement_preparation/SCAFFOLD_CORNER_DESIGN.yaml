      - name: order_book_completeness_is_checked_before_the_compensation_inputs
        claim_type: cascading_validation
        grounds:
          - validations[pricing-order-book-complete] (priority 13, category business_safety)
          - validations[compensation-inputs-match-basis] (priority 16, category business_fiscal)
          - errors[ERR_PRICING_PRECONDITION_UNMET]
        distinguishing_aspect: |
          Two independent defects are present in one call - the deal has NO order period at all
          and the NEGOTIATED deal is priced with the COMPETITIVE input winning_bid_price_pct - and
          the priority-13 order-book check must report first, so the answer is
          ERR_PRICING_PRECONDITION_UNMET and never ERR_COMPENSATION_INPUT_MISSING. Creating and
          merely OPENING a period is still not enough: an OPEN period keeps the same refusal, so
          the rule genuinely requires a CLOSED period with allotment_run_count >= 1.
        test_recipe:
          setup:
            - "A PRICING_NEGOTIATED deal of 5,000,000 with a PRELIMINARY_POSTED statement, CLEARED disclosure, one SENIOR_MANAGER at 100.0000 and no order period whatsoever."
            - "The same firm/issuer/deal/tranche/syndicate/undertaking/statement chain as pricing_requires_a_posted_official_statement, continued through post-preliminary, but with no call to POST /bond-offerings/deals/{id}/order-periods."
          setup_api_calls:
            - call: "POST /bond-offerings/deals/${deal_id}/designate-sale-method"
              payload: { sale_method: "NEGOTIATED" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
            - call: "POST /bond-offerings/official-statements/${os_id}/post-preliminary"
              payload: {}
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
            - call: "GET /bond-offerings/deals/${deal_id}"
              payload: {}
              as: Underwriter
              as_user_id: "${uw_firm_id}"
          trigger:
            - call: "POST /bond-offerings/deals/${deal_id}/price"
              payload: { winning_bid_price_pct: 106.000 }
              as: Underwriter
              as_user_id: "${uw_firm_id}"
            - call: "POST /bond-offerings/deals/${deal_id}/order-periods"
              payload: { period_type: "INSTITUTIONAL", opens_at: "2026-08-05T13:00:00.000Z", closes_at: "2026-08-05T17:00:00.000Z", priority_policy: "STANDARD_PRIORITY" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { op_id: $.data.id }
            - call: "POST /bond-offerings/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T14:00:00.000Z" }
              as: ComplianceOfficer
            - call: "POST /bond-offerings/order-periods/${op_id}/open"
              payload: {}
              as: Underwriter
              as_user_id: "${uw_firm_id}"
            - call: "POST /bond-offerings/deals/${deal_id}/price"
              payload: { takedown_per_bond_usd: 5.000, management_fee_per_bond_usd: 2.500, expenses_per_bond_usd: 1.250 }
              as: Underwriter
              as_user_id: "${uw_firm_id}"
          assert:
            - "first call: HTTP 422 with data.error_id == 'ERR_PRICING_PRECONDITION_UNMET', proving priority 13 outranks the priority-16 compensation defect in the same request"
            - "fifth call: HTTP 422 with data.error_id == 'ERR_PRICING_PRECONDITION_UNMET' even though the compensation inputs are now correct, because OrderPeriod.${op_id}.status is OPEN and allotment_run_count is 0"
            - "Deal.${deal_id}.status is still PRICING_NEGOTIATED and gross_spread_usd is still null"

      - name: compensation_inputs_must_match_the_sale_method
        claim_type: violation_to_error
        grounds:
          - validations[compensation-inputs-match-basis] (priority 16, category business_fiscal)
          - errors[ERR_COMPENSATION_INPUT_MISSING]
        distinguishing_aspect: |
          The rule is two-sided: a NEGOTIATED deal must SUPPLY the three per-bond components and
          must FORBID winning_bid_price_pct, so both an omission (expenses_per_bond_usd missing)
          and an intrusion (winning_bid_price_pct supplied alongside the three) are 422
          ERR_COMPENSATION_INPUT_MISSING rather than ERR_INVALID_REQUEST - all four fields are
          optional in the endpoint's declared input, so this is a business rule and not a schema
          rule.
        test_recipe:
          setup:
            - "A fully priceable PRICING_NEGOTIATED deal: the chain of pricing_requires_a_posted_official_statement continued through post-preliminary, with the institutional order period opened and CLOSED so allotment_run_count is 1."
          setup_api_calls:
            - call: "POST /bond-offerings/official-statements/${os_id}/post-preliminary"
              payload: {}
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
            - call: "POST /bond-offerings/order-periods/${op_id}/close"
              payload: {}
              as: Underwriter
              as_user_id: "${uw_firm_id}"
            - call: "GET /bond-offerings/deals/${deal_id}"
              payload: {}
              as: Underwriter
              as_user_id: "${uw_firm_id}"
          trigger:
            - call: "POST /bond-offerings/deals/${deal_id}/price"
              payload: { winning_bid_price_pct: 106.000 }
              as: Underwriter
              as_user_id: "${uw_firm_id}"
            - call: "POST /bond-offerings/deals/${deal_id}/price"
              payload: { takedown_per_bond_usd: 5.000, management_fee_per_bond_usd: 2.500 }
              as: Underwriter
              as_user_id: "${uw_firm_id}"
            - call: "POST /bond-offerings/deals/${deal_id}/price"
              payload: { takedown_per_bond_usd: 5.000, management_fee_per_bond_usd: 2.500, expenses_per_bond_usd: 1.250, winning_bid_price_pct: 106.000 }
              as: Underwriter
              as_user_id: "${uw_firm_id}"
            - call: "POST /bond-offerings/deals/${deal_id}/price"
              payload: { takedown_per_bond_usd: 5.000, management_fee_per_bond_usd: 2.500, expenses_per_bond_usd: 1.250 }
              as: Underwriter
              as_user_id: "${uw_firm_id}"
          assert:
            - "first three calls: HTTP 422 with data.error_id == 'ERR_COMPENSATION_INPUT_MISSING'"
            - "Deal.${deal_id}.status is still PRICING_NEGOTIATED after each refusal"
            - "fourth call: HTTP 200, Deal.${deal_id}.gross_spread_usd == 43750.00 and gross_spread_per_bond_usd == 8.750"
            - "Deal.${deal_id}.arbitrage_yield_pct == 4.2500 and permitted_investment_yield_pct == 4.3750"

      - name: gross_spread_may_not_exhaust_the_issue_proceeds
        claim_type: violation_to_error
        grounds:
          - validations[premium-within-proceeds] (priority 16, category business_fiscal)
          - errors[ERR_PREMIUM_EXCEEDS_PROCEEDS]
        distinguishing_aspect: |
          takedown_per_bond_usd carries no declared numeric range, so a fat-finger 1100.000
          passes schema validation and reaches the fiscal rule: the spread becomes 5,518,750.00
          against an issue price of 5,302,900.00, so net proceeds would be -215,850.00 and the
          pricing must be refused. The rule tests net proceeds STRICTLY greater than zero, and
          the whole money set must remain null afterwards - no partial write.
        test_recipe:
          setup:
            - "The same fully priceable PRICING_NEGOTIATED deal of 5,000,000 (5,000 bonds) used by compensation_inputs_must_match_the_sale_method, with the order period CLOSED and the statement PRELIMINARY_POSTED."
          setup_api_calls:
            - call: "POST /bond-offerings/official-statements/${os_id}/post-preliminary"
              payload: {}
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
            - call: "POST /bond-offerings/order-periods/${op_id}/close"
              payload: {}
              as: Underwriter
              as_user_id: "${uw_firm_id}"
            - call: "GET /bond-offerings/deals/${deal_id}"
              payload: {}
              as: Underwriter
              as_user_id: "${uw_firm_id}"
          trigger:
            - call: "POST /bond-offerings/deals/${deal_id}/price"
              payload: { takedown_per_bond_usd: 1100.000, management_fee_per_bond_usd: 2.500, expenses_per_bond_usd: 1.250 }
              as: Underwriter
              as_user_id: "${uw_firm_id}"
            - call: "POST /bond-offerings/deals/${deal_id}/price"
              payload: { takedown_per_bond_usd: 5.000, management_fee_per_bond_usd: 2.500, expenses_per_bond_usd: 1.250 }
              as: Underwriter
              as_user_id: "${uw_firm_id}"
          assert:
            - "first call: HTTP 422 with data.error_id == 'ERR_PREMIUM_EXCEEDS_PROCEEDS' (per-bond spread 1103.750 over 5,000 bonds is 5,518,750.00 against an issue price of 5,302,900.00)"
            - "Deal.${deal_id}.status is still PRICING_NEGOTIATED with issue_price_total_usd, gross_spread_usd and net_proceeds_to_issuer_usd all still null"
            - "second call: HTTP 200 with net_proceeds_to_issuer_usd == 5259150.00, so nothing from the refused attempt leaked into the ledger"

      - name: bond_opinion_and_tax_certificate_may_never_be_waived
        claim_type: violation_to_error
        grounds:
          - validations[signatory-role-matches-document] (priority 12, category business_safety)
          - errors[ERR_SIGNATORY_ROLE_INVALID]
        distinguishing_aspect: |
          One rule_id covers a role mismatch on execute AND an absolute waiver ban on two
          doc_types. The waiver ban is the trap: the caller IS the ComplianceOfficer the waive
          endpoint requires, so this is not an RBAC 403 but a 422 on the document's doc_type -
          and a UNDERWRITER_RECEIPT waived by the very same caller succeeds, proving the ban is
          per-doc_type.
        test_recipe:
          setup:
            - "An AWARDED COMPETITIVE deal of 5,000,000: the chain of pricing_requires_a_posted_official_statement designated COMPETITIVE instead of NEGOTIATED and with no syndicate, priced with winning_bid_price_pct 106.000 and then awarded, so six ClosingDocuments exist in PENDING."
          setup_api_calls:
            - call: "POST /bond-offerings/deals/${deal_id}/price"
              payload: { winning_bid_price_pct: 106.000 }
              as: Underwriter
              as_user_id: "${uw_firm_id}"
            - call: "POST /bond-offerings/deals/${deal_id}/award"
              payload: {}
              as: IssuerOfficial
              as_user_id: "${issuer_id}"
            - call: "GET /bond-offerings/deals/${deal_id}/closing-documents"
              payload: { doc_type: "BOND_OPINION" }
              as: ComplianceOfficer
              captures: { opinion_id: "$.data[0].id" }
            - call: "GET /bond-offerings/deals/${deal_id}/closing-documents"
              payload: { doc_type: "TAX_CERTIFICATE" }
              as: ComplianceOfficer
              captures: { taxcert_id: "$.data[0].id" }
            - call: "GET /bond-offerings/deals/${deal_id}/closing-documents"
              payload: { doc_type: "UNDERWRITER_RECEIPT" }
              as: ComplianceOfficer
              captures: { receipt_id: "$.data[0].id" }
          trigger:
            - call: "POST /bond-offerings/closing-documents/${opinion_id}/waive"
              payload: { waiver_reason: "Counsel unavailable at closing." }
              as: ComplianceOfficer
            - call: "POST /bond-offerings/closing-documents/${taxcert_id}/waive"
              payload: { waiver_reason: "Tax counsel unavailable." }
              as: ComplianceOfficer
            - call: "POST /bond-offerings/closing-documents/${receipt_id}/execute"
              payload: { signatory_name: "Dana Reyes" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
            - call: "POST /bond-offerings/closing-documents/${receipt_id}/waive"
              payload: { waiver_reason: "Receipt delivered outside the platform." }
              as: ComplianceOfficer
          assert:
            - "first two calls: HTTP 422 with data.error_id == 'ERR_SIGNATORY_ROLE_INVALID'"
            - "ClosingDocument.${opinion_id}.execution_status and ClosingDocument.${taxcert_id}.execution_status are both still PENDING"
            - "third call: HTTP 422 with data.error_id == 'ERR_SIGNATORY_ROLE_INVALID' because the receipt's signatory_role is Underwriter, not MunicipalAdvisor"
            - "fourth call: HTTP 200 with ClosingDocument.${receipt_id}.execution_status == WAIVED"

      - name: closing_requires_every_required_document_executed_or_waived
        claim_type: violation_to_error
        grounds:
          - validations[closing-documents-complete] (priority 16, category business_fiscal)
          - errors[ERR_CLOSING_DOCS_INCOMPLETE]
        distinguishing_aspect: |
          The check is over EVERY ClosingDocument with is_required true, so closing is still
          refused when five of the six documents are done and only the sale-method-specific
          NOTICE_OF_SALE_CERTIFICATE remains PENDING. An implementation that checks the five
          universal documents, or that stops at "at least one executed", closes the deal early.
          The two higher-priority close gates are deliberately satisfied first: the statement is
          FINAL_POSTED and the handoff is READY.
        test_recipe:
          setup:
            - "The AWARDED COMPETITIVE deal of bond_opinion_and_tax_certificate_may_never_be_waived, additionally advanced with post-final and a post-issuance handoff at record_retention_years 6, so all six ClosingDocuments are PENDING and the two priority-13 close gates are already satisfied."
          setup_api_calls:
            - call: "POST /bond-offerings/deals/${deal_id}/award"
              payload: {}
              as: IssuerOfficial
              as_user_id: "${issuer_id}"
            - call: "POST /bond-offerings/official-statements/${os_id}/post-final"
              payload: {}
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
            - call: "POST /bond-offerings/deals/${deal_id}/post-issuance-handoff"
              payload: { record_retention_years: 6 }
              as: ComplianceOfficer
            - call: "GET /bond-offerings/deals/${deal_id}/closing-documents"
              payload: { doc_type: "BOND_OPINION" }
              as: ComplianceOfficer
              captures: { opinion_id: "$.data[0].id" }
            - call: "GET /bond-offerings/deals/${deal_id}/closing-documents"
              payload: { doc_type: "TAX_CERTIFICATE" }
              as: ComplianceOfficer
              captures: { taxcert_id: "$.data[0].id" }
            - call: "GET /bond-offerings/deals/${deal_id}/closing-documents"
              payload: { doc_type: "ISSUE_PRICE_CERTIFICATE" }
              as: ComplianceOfficer
              captures: { ipc_id: "$.data[0].id" }
            - call: "GET /bond-offerings/deals/${deal_id}/closing-documents"
              payload: { doc_type: "CONTINUING_DISCLOSURE_AGREEMENT" }
              as: ComplianceOfficer
              captures: { cda_id: "$.data[0].id" }
            - call: "GET /bond-offerings/deals/${deal_id}/closing-documents"
              payload: { doc_type: "UNDERWRITER_RECEIPT" }
              as: ComplianceOfficer
              captures: { receipt_id: "$.data[0].id" }
            - call: "GET /bond-offerings/deals/${deal_id}/closing-documents"
              payload: { doc_type: "NOTICE_OF_SALE_CERTIFICATE" }
              as: ComplianceOfficer
              captures: { notice_id: "$.data[0].id" }
          trigger:
            - call: "POST /bond-offerings/deals/${deal_id}/close"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /bond-offerings/closing-documents/${opinion_id}/execute"
              payload: { signatory_name: "Avery Lin" }
              as: BondCounsel
              as_user_id: bc_drafter
            - call: "POST /bond-offerings/closing-documents/${taxcert_id}/execute"
              payload: { signatory_name: "Morgan Diaz" }
              as: IssuerOfficial
              as_user_id: "${issuer_id}"
            - call: "POST /bond-offerings/closing-documents/${ipc_id}/execute"
              payload: { signatory_name: "Riley Chen" }
              as: Underwriter
              as_user_id: "${uw_firm_id}"
            - call: "POST /bond-offerings/closing-documents/${cda_id}/execute"
              payload: { signatory_name: "Morgan Diaz" }
              as: IssuerOfficial
              as_user_id: "${issuer_id}"
            - call: "POST /bond-offerings/closing-documents/${receipt_id}/execute"
              payload: { signatory_name: "Riley Chen" }
              as: Underwriter
              as_user_id: "${uw_firm_id}"
            - call: "POST /bond-offerings/deals/${deal_id}/close"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /bond-offerings/closing-documents/${notice_id}/execute"
              payload: { signatory_name: "Dana Reyes" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
            - call: "POST /bond-offerings/deals/${deal_id}/close"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "trigger call 1: HTTP 422 with data.error_id == 'ERR_CLOSING_DOCS_INCOMPLETE'"
            - "trigger call 7: HTTP 422 with the same error_id even though five of six documents are EXECUTED"
            - "Deal.${deal_id}.status is still AWARDED after both refusals"
            - "trigger call 9: HTTP 200 with Deal.${deal_id}.status == CLOSED"
            - "GET /bond-offerings/deals/${deal_id}/closing-documents with execution_status PENDING returns 0 rows"

      - name: post_issuance_handoff_requires_six_years_of_record_retention
        claim_type: violation_to_error
        grounds:
          - validations[post-issuance-handoff-ready] (priority 16, category business_fiscal)
          - errors[ERR_POST_ISSUANCE_HANDOFF_INCOMPLETE]
        distinguishing_aspect: |
          record_retention_years has no declared numeric range on the endpoint, so 5 is a
          schema-valid value that must be refused by the IRC record-retention floor of 6; 6
          exactly is accepted, making this an inclusive-boundary test on a business rule rather
          than on the request schema. Every other precondition is satisfied - the deal is PRICED
          with a non-null arbitrage yield and an ACTIVE undertaking.
        test_recipe:
          setup:
            - "A PRICED COMPETITIVE deal of 5,000,000 with an ACTIVE undertaking, taken through the chain of pricing_requires_a_posted_official_statement but designated COMPETITIVE and priced with winning_bid_price_pct 106.000."
          setup_api_calls:
            - call: "POST /bond-offerings/deals/${deal_id}/price"
              payload: { winning_bid_price_pct: 106.000 }
              as: Underwriter
              as_user_id: "${uw_firm_id}"
            - call: "GET /bond-offerings/deals/${deal_id}"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /bond-offerings/deals/${deal_id}/post-issuance-handoff"
              payload: { record_retention_years: 5 }
              as: ComplianceOfficer
            - call: "POST /bond-offerings/deals/${deal_id}/post-issuance-handoff"
              payload: { record_retention_years: 6 }
              as: ComplianceOfficer
          assert:
            - "the setup GET shows Deal.${deal_id}.status == PRICED with arbitrage_yield_pct == 4.2500 and post_issuance_handoff_status == NOT_STARTED"
            - "first call: HTTP 422 with data.error_id == 'ERR_POST_ISSUANCE_HANDOFF_INCOMPLETE'"
            - "Deal.${deal_id}.post_issuance_handoff_status is still NOT_STARTED and record_retention_years is still null"
            - "second call: HTTP 200 with post_issuance_handoff_status == READY and record_retention_years == 6"

      - name: revision_request_beyond_the_round_bound_rejected
        claim_type: violation_to_error
        grounds:
          - validations[revision-rounds-bounded] (priority 13, category business_safety)
          - errors[ERR_REVISION_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          The bound is draft_round < MAX_DRAFT_ROUNDS (4) at the moment the revision is
          requested, so the fourth request is the one that must fail.
        excluded_because:
          difficulty_instance: official_statement_revision_cycle_bounded
          rationale: |
            That §1.8 instance already drives the drafting loop through rounds 1, 2 and 3, asserts
            the accepted third request, and then asserts the fourth request returning
            ERR_REVISION_LIMIT_EXCEEDED with draft_round pinned at 4 - the identical assertion a
            corner test would make, on the identical endpoint.

      - name: bond_opinion_execution_before_the_final_statement_rejected
        claim_type: violation_to_error
        grounds:
          - validations[final-statement-before-closing] (priority 13, category business_safety)
          - errors[ERR_OS_NOT_FINAL_POSTED]
        distinguishing_aspect: |
          The bond opinion may only be signed once the deal's governing statement reaches
          FINAL_POSTED, and the same rule gates closing the deal.
        excluded_because:
          difficulty_instance: bond_opinion_execution_requires_final_official_statement
          rationale: |
            That §1.8 instance executes the BOND_OPINION on an AWARDED deal whose statement is
            still PRELIMINARY_POSTED, asserts ERR_OS_NOT_FINAL_POSTED, then posts the final
            statement and asserts the same call succeeding - the full violation-and-satisfaction
            pair for this rule_id.

      - name: overlapping_order_periods_rejected
        claim_type: violation_to_error
        grounds:
          - validations[order-period-no-overlap] (priority 14, category business_temporal)
          - errors[ERR_ORDER_PERIOD_OVERLAP]
        distinguishing_aspect: |
          Order-period windows are half-open, so a period starting exactly at another's closes_at
          is adjacent rather than overlapping and must be accepted.
        excluded_because:
          difficulty_instance: order_period_half_open_adjacency_allowed
          rationale: |
            That §1.8 instance is built precisely on this rule's boundary: it accepts the
            back-to-back period whose opens_at equals the predecessor's closes_at and rejects the
            one that starts one millisecond earlier with ERR_ORDER_PERIOD_OVERLAP, which subsumes
            any coarser violation test.

      - name: presentation_inside_the_per_agency_buffer_rejected
        claim_type: violation_to_error
        grounds:
          - validations[presentation-buffer-per-agency] (priority 14, category business_temporal)
          - errors[ERR_PRESENTATION_BUFFER_CONFLICT]
        distinguishing_aspect: |
          Two presentations for the same agency must be separated by PRESENTATION_BUFFER_MINUTES
          (60) measured on a closed interval, and a single presentation may not exceed
          MAX_PRESENTATION_MINUTES (180).
        excluded_because:
          difficulty_instance: rating_presentation_closed_interval_sixty_minute_buffer
          rationale: |
            That §1.8 instance tests the buffer at exactly 60 minutes (accepted), at 59 minutes
            (ERR_PRESENTATION_BUFFER_CONFLICT) and the duration bound at exactly 180 minutes,
            plus the freeing effect of a CANCELLED slot - a strict superset of a plain
            violation-to-error test.

      - name: high_risk_issuer_without_a_material_disclosure_section_rejected
        claim_type: conditional_validation
        grounds:
          - validations[high-risk-issuer-needs-disclosure-section] (priority 13, category business_safety)
          - errors[ERR_DISCLOSURE_RISK_SECTION_REQUIRED]
        distinguishing_aspect: |
          The extra section is demanded only when the issuer's disclosure_risk_score reaches the
          DISCLOSURE_RISK_GATE of 40, so the rule must be tested with and without the trigger.
        excluded_because:
          difficulty_instance: disclosure_risk_gate_inclusive_at_forty
          rationale: |
            That §1.8 instance already runs the with/without pair at the exact gate: an issuer
            scoring 39 posts the preliminary statement without the extra section, an issuer
            scoring exactly 40 is refused with ERR_DISCLOSURE_RISK_SECTION_REQUIRED, and adding
            an APPROVED material CONTINUING_DISCLOSURE section then clears it.

      - name: state_check_outranks_the_order_constraint_check
        claim_type: priority_ordering
        grounds:
          - validations[state-transition-legal] (priority 11, category state)
          - validations[order-type-permitted-in-period] (priority 15, category business_constraint)
        distinguishing_aspect: |
          A single request that both targets a non-OPEN period and carries an impermissible
          order_type must report the priority-11 state error, not the priority-15 constraint
          error.
        excluded_because:
          difficulty_instance: state_beats_business_constraint_on_order_entry
          rationale: |
            That §1.8 instance is exactly this two-rule collision: it posts an
            INSTITUTIONAL_PRIORITY order into a RETAIL_ONLY period that is still SCHEDULED and
            asserts ERR_ORDER_PERIOD_INVALID_STATE rather than ERR_ORDER_TYPE_NOT_PERMITTED, then
            opens the period and shows the constraint error surfacing.

      - name: safety_check_outranks_the_fiscal_check_on_syndicate_add
        claim_type: priority_ordering
        grounds:
          - validations[ma-underwriter-conflict] (priority 12, category business_safety)
          - validations[liability-shares-sum-to-whole] (priority 16, category business_fiscal)
        distinguishing_aspect: |
          Adding the municipal advisor firm with a liability share that also breaks the 100.0000
          ceiling must report the G-23 conflict, because business_safety at priority 12 outranks
          business_fiscal at priority 16.
        excluded_because:
          difficulty_instance: business_safety_beats_business_fiscal_on_syndicate_add
          rationale: |
            That §1.8 instance issues the doubly-invalid add and asserts
            ERR_MA_UNDERWRITER_CONFLICT rather than ERR_LIABILITY_PCT_SUM_INVALID, then repairs
            the firm_id and shows the fiscal error surfacing on its own - both halves of the
            ordering claim.

  # ===========================================================================
  # SECTION 5 - ENDPOINTS
  # ===========================================================================
  - section: endpoints
    instances:

      - name: deal_listing_filters_combine_and_paginate
        claim_type: standard_crud
        grounds:
          - endpoints[GET /bond-offerings/deals] input issuer_id?, municipal_advisor_firm_id?, status?, sale_method?, limit?, offset?
          - complexity_profile.complexity_layers[pagination_with_filtering]
        distinguishing_aspect: |
          The four filters must AND together and total_count must report the filtered population
          rather than the table size: three deals across two issuers with two different
          sale_methods yield 1 row for issuer_id + sale_method COMPETITIVE, and the paged request
          limit 1 offset 1 over the two deals of one issuer returns the second row with
          total_count 2 and has_more false.
        test_recipe:
          setup:
            - "Issuer Fairhaven owns Series 2026A (COMPETITIVE, PRICING_COMPETITIVE) and Series 2026B (still DRAFT); issuer Ashbury owns Series 2026C (still DRAFT)."
          setup_api_calls:
            - call: "POST /bond-offerings/firms"
              payload: { name: "Beta Municipal Advisors", firm_type: "MUNICIPAL_ADVISOR", msrb_registration_id: "MA0001" }
              as: ComplianceOfficer
              captures: { ma_firm_id: $.data.id }
            - call: "POST /bond-offerings/issuers"
              payload: { name: "City of Fairhaven", state_code: "OH", entity_type: "CITY" }
              as: ComplianceOfficer
              captures: { issuer_id: $.data.id }
            - call: "POST /bond-offerings/issuers"
              payload: { name: "City of Ashbury", state_code: "OH", entity_type: "CITY" }
              as: ComplianceOfficer
              captures: { issuer2_id: $.data.id }
            - call: "POST /bond-offerings/deals"
              payload: { issuer_id: "${issuer_id}", series_designation: "Series 2026A", tax_status: "TAX_EXEMPT", dated_date: "2026-08-01T00:00:00.000Z", expected_par_amount_usd: 5000000, municipal_advisor_firm_id: "${ma_firm_id}" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { deal_a_id: $.data.id }
            - call: "POST /bond-offerings/deals/${deal_a_id}/maturity-tranches"
              payload: { sequence_number: 1, maturity_date: "2036-08-01T00:00:00.000Z", principal_amount_usd: 5000000, coupon_rate_pct: 5.000, yield_pct: 4.250 }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
            - call: "POST /bond-offerings/deals/${deal_a_id}/submit-structure"
              payload: {}
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
            - call: "POST /bond-offerings/deals/${deal_a_id}/designate-sale-method"
              payload: { sale_method: "COMPETITIVE" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
            - call: "POST /bond-offerings/deals"
              payload: { issuer_id: "${issuer_id}", series_designation: "Series 2026B", tax_status: "TAXABLE", dated_date: "2026-08-01T00:00:00.000Z", expected_par_amount_usd: 7000000, municipal_advisor_firm_id: "${ma_firm_id}" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { deal_b_id: $.data.id }
            - call: "POST /bond-offerings/deals"
              payload: { issuer_id: "${issuer2_id}", series_designation: "Series 2026C", tax_status: "TAX_EXEMPT", dated_date: "2026-08-01T00:00:00.000Z", expected_par_amount_usd: 3000000, municipal_advisor_firm_id: "${ma_firm_id}" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { deal_c_id: $.data.id }
          trigger:
            - call: "GET /bond-offerings/deals"
              payload: { issuer_id: "${issuer_id}", sale_method: "COMPETITIVE" }
              as: ComplianceOfficer
            - call: "GET /bond-offerings/deals"
              payload: { issuer_id: "${issuer_id}", status: "DRAFT" }
              as: ComplianceOfficer
            - call: "GET /bond-offerings/deals"
              payload: { issuer_id: "${issuer_id}", limit: 1, offset: 1 }
              as: ComplianceOfficer
            - call: "GET /bond-offerings/deals"
              payload: { municipal_advisor_firm_id: "${ma_firm_id}" }
              as: ComplianceOfficer
          assert:
            - "first call: 1 row, Deal.${deal_a_id}, with total_count == 1 and has_more false"
            - "second call: 1 row, Deal.${deal_b_id}, with total_count == 1 - the COMPETITIVE deal of the same issuer is excluded by status"
            - "third call: 1 row with total_count == 2 and has_more false, so total_count counts the filtered set and not the returned page"
            - "fourth call: 3 rows with total_count == 3, spanning both issuers"

      - name: acknowledge_pins_the_analyst_to_the_engagement
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /bond-offerings/rating-engagements/{id}/acknowledge] side_effects
          - state_machines[RatingEngagement] REQUESTED -> UNDER_REVIEW
        distinguishing_aspect: |
          The action endpoint takes NO body yet has two side effects that must both land: the
          status move and assigned_analyst_user_id = X-User-Id. The pinning is what makes a
          second analyst's request-info fail with ERR_ROLE_IDENTITY_MISMATCH while the pinned
          analyst succeeds - an implementation that only flips the status leaves the engagement
          open to any analyst.
        test_recipe:
          setup:
            - "A DRAFT deal carries a REQUESTED MOODYS engagement."
          setup_api_calls:
            - call: "POST /bond-offerings/firms"
              payload: { name: "Beta Municipal Advisors", firm_type: "MUNICIPAL_ADVISOR", msrb_registration_id: "MA0001" }
              as: ComplianceOfficer
              captures: { ma_firm_id: $.data.id }
            - call: "POST /bond-offerings/issuers"
              payload: { name: "City of Fairhaven", state_code: "OH", entity_type: "CITY" }
              as: ComplianceOfficer
              captures: { issuer_id: $.data.id }
            - call: "POST /bond-offerings/deals"
              payload: { issuer_id: "${issuer_id}", series_designation: "Series 2026A", tax_status: "TAX_EXEMPT", dated_date: "2026-08-01T00:00:00.000Z", expected_par_amount_usd: 5000000, municipal_advisor_firm_id: "${ma_firm_id}" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { deal_id: $.data.id }
            - call: "POST /bond-offerings/deals/${deal_id}/rating-engagements"
              payload: { agency: "MOODYS" }
              as: MunicipalAdvisor
              as_user_id: "${ma_firm_id}"
              captures: { eng_id: $.data.id }
          trigger:
            - call: "POST /bond-offerings/rating-engagements/${eng_id}/acknowledge"
              payload: {}
              as: RatingAnalyst
              as_user_id: ra_1
