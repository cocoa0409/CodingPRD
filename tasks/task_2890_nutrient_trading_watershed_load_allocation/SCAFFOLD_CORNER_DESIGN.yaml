  - section: validations
    instances:
      - name: request_with_blank_auth_headers_is_unauthenticated
        claim_type: violation_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Priority 1 outranks everything: a blank X-User-Role, a blank X-User-ID or a role string that is not one of the seven declared roles all return 401 ERR_UNAUTHENTICATED, even when the body is otherwise valid and the role would have been forbidden anyway."
        test_recipe:
          setup:
            - "No rows are required; the checks run before any lookup."
          setup_api_calls: []
          trigger:
            - call: "POST /watersheds"
              payload: { name: "Scioto Headwaters", state_code: "OH", watershed_code: "SCR", pollutant: "TOTAL_PHOSPHORUS", baseline_year: 2020, baseline_load_lbs_yr: 120000.00, eligible_zone_codes: ["Z1", "Z2"] }
              as: ""
              as_user_id: "admin-1"
              captures: { err_1: $.data.error_id }
            - call: "POST /watersheds"
              payload: { name: "Scioto Headwaters", state_code: "OH", watershed_code: "SCR", pollutant: "TOTAL_PHOSPHORUS", baseline_year: 2020, baseline_load_lbs_yr: 120000.00, eligible_zone_codes: ["Z1", "Z2"] }
              as: ProgramAdministrator
              as_user_id: ""
              captures: { err_2: $.data.error_id }
            - call: "POST /watersheds"
              payload: { name: "Scioto Headwaters", state_code: "OH", watershed_code: "SCR", pollutant: "TOTAL_PHOSPHORUS", baseline_year: 2020, baseline_load_lbs_yr: 120000.00, eligible_zone_codes: ["Z1", "Z2"] }
              as: "WatershedCzar"
              as_user_id: "admin-1"
              captures: { err_3: $.data.error_id }
          assert:
            - "trigger call 1 responds 401 with data.error_id == \"ERR_UNAUTHENTICATED\" (X-User-Role sent as the empty string, not omitted)"
            - "trigger call 2 responds 401 with data.error_id == \"ERR_UNAUTHENTICATED\" (X-User-ID sent as the empty string)"
            - "trigger call 3 responds 401 with data.error_id == \"ERR_UNAUTHENTICATED\" (undeclared role name, not 403)"
            - "no Watershed row was created by any of the three calls"

      - name: unknown_body_field_and_out_of_range_pagination_are_rejected
        claim_type: violation_error
        grounds:
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
          - pagination_defaults
        distinguishing_aspect: "Priority 4 covers three separate shapes on the same endpoint family: an unknown body field, a decimal outside its declared range, and a limit above the declared maximum of 100 all return 422 ERR_INVALID_REQUEST rather than being silently ignored or clamped."
        test_recipe:
          setup:
            - "Watershed SCR exists so the referenced watershed resolves and the failure is attributable to the request shape."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /watersheds"
              payload: { name: "Scioto Headwaters", state_code: "OH", watershed_code: "SCR", pollutant: "TOTAL_PHOSPHORUS", baseline_year: 2020, baseline_load_lbs_yr: 120000.00, eligible_zone_codes: ["Z1", "Z2"] }
              as: ProgramAdministrator
              captures: { w_id: $.data.id }
          trigger:
            - call: "POST /reaches"
              payload: { watershed_id: "${w_id}", reach_code: "R_X1", trading_zone_code: "Z1", reach_class: "MAINSTEM", delivery_factor: 0.9000, stream_order: 3 }
              as: TmdlAnalyst
              captures: { err_1: $.data.error_id }
            - call: "POST /reaches"
              payload: { watershed_id: "${w_id}", reach_code: "R_X2", trading_zone_code: "Z1", reach_class: "MAINSTEM", delivery_factor: 1.5000 }
              as: TmdlAnalyst
              captures: { err_2: $.data.error_id }
            - call: "GET /reaches?watershed_id=${w_id}&limit=101"
              as: TmdlAnalyst
              captures: { err_3: $.data.error_id }
          assert:
            - "trigger call 1 responds 422 with data.error_id == \"ERR_INVALID_REQUEST\" (unknown field stream_order rejected, not ignored)"
            - "trigger call 2 responds 422 with data.error_id == \"ERR_INVALID_REQUEST\" (delivery_factor above the declared 1.0000 ceiling)"
            - "trigger call 3 responds 422 with data.error_id == \"ERR_INVALID_REQUEST\" (limit 101 exceeds the declared maximum of 100)"
            - "GET /reaches?watershed_id=${w_id} returns meta.total_count == 0"

      - name: duplicate_watershed_code_is_rejected_while_reach_code_uniqueness_stays_watershed_scoped
        claim_type: violation_error
        grounds:
          - validations[priority=9]
          - errors[ERR_DUPLICATE_CODE]
        distinguishing_aspect: "watershed_code is unique globally while reach_code is unique only within its watershed: the same reach_code R_OUT is accepted in a second watershed but refused a second time inside the first."
        test_recipe:
          setup:
            - "Watershed SCR (code SCR) with reach R_OUT, and a second watershed MAD (code MAD)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /watersheds"
              payload: { name: "Scioto Headwaters", state_code: "OH", watershed_code: "SCR", pollutant: "TOTAL_PHOSPHORUS", baseline_year: 2020, baseline_load_lbs_yr: 120000.00, eligible_zone_codes: ["Z1", "Z2"] }
              as: ProgramAdministrator
              captures: { w_scr_id: $.data.id }
            - call: "POST /watersheds"
              payload: { name: "Upper Mad River", state_code: "OH", watershed_code: "MAD", pollutant: "TOTAL_NITROGEN", baseline_year: 2020, baseline_load_lbs_yr: 90000.00, eligible_zone_codes: ["Z1"] }
              as: ProgramAdministrator
              captures: { w_mad_id: $.data.id }
            - call: "POST /reaches"
              payload: { watershed_id: "${w_scr_id}", reach_code: "R_OUT", trading_zone_code: "Z2", reach_class: "COMPLIANCE_POINT", delivery_factor: 1.0000 }
              as: TmdlAnalyst
              captures: { r_scr_out_id: $.data.id }
          trigger:
            - call: "POST /watersheds"
              payload: { name: "Scioto Duplicate", state_code: "OH", watershed_code: "SCR", pollutant: "TOTAL_PHOSPHORUS", baseline_year: 2021, baseline_load_lbs_yr: 100000.00, eligible_zone_codes: ["Z1"] }
              as: ProgramAdministrator
              captures: { err_1: $.data.error_id }
            - call: "POST /reaches"
              payload: { watershed_id: "${w_mad_id}", reach_code: "R_OUT", trading_zone_code: "Z1", reach_class: "COMPLIANCE_POINT", delivery_factor: 1.0000 }
              as: TmdlAnalyst
              captures: { r_mad_out_id: $.data.id }
            - call: "POST /reaches"
              payload: { watershed_id: "${w_scr_id}", reach_code: "R_OUT", trading_zone_code: "Z1", reach_class: "MAINSTEM", delivery_factor: 0.9000 }
              as: TmdlAnalyst
              captures: { err_3: $.data.error_id }
          assert:
            - "trigger call 1 responds 409 with data.error_id == \"ERR_DUPLICATE_CODE\" (watershed_code is global)"
            - "trigger call 2 responds 201 (the same reach_code in a different watershed is legal) and data.id != ${r_scr_out_id}"
            - "trigger call 3 responds 409 with data.error_id == \"ERR_DUPLICATE_CODE\" (reach_code repeats inside watershed SCR)"
            - "GET /reaches?watershed_id=${w_scr_id} returns meta.total_count == 1"
            - "GET /reaches?watershed_id=${w_mad_id} returns meta.total_count == 1"

      - name: source_assessment_pointing_at_another_watersheds_reach_is_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=8]
          - errors[ERR_WATERSHED_MISMATCH]
        distinguishing_aspect: "The reach exists, so this is not a 404: priority 8 catches the cross-watershed reference and returns 422 ERR_WATERSHED_MISMATCH, while the same call against a reach of the assessment's own watershed succeeds."
        test_recipe:
          setup:
            - "Watershed SCR with reach R_SCR and TMDL-P-2026 in DRAFT; watershed MAD with reach R_MAD."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /watersheds"
              payload: { name: "Scioto Headwaters", state_code: "OH", watershed_code: "SCR", pollutant: "TOTAL_PHOSPHORUS", baseline_year: 2020, baseline_load_lbs_yr: 120000.00, eligible_zone_codes: ["Z1", "Z2"] }
              as: ProgramAdministrator
              captures: { w_scr_id: $.data.id }
            - call: "POST /watersheds"
              payload: { name: "Upper Mad River", state_code: "OH", watershed_code: "MAD", pollutant: "TOTAL_NITROGEN", baseline_year: 2020, baseline_load_lbs_yr: 90000.00, eligible_zone_codes: ["Z1"] }
              as: ProgramAdministrator
              captures: { w_mad_id: $.data.id }
            - call: "POST /reaches"
              payload: { watershed_id: "${w_scr_id}", reach_code: "R_SCR", trading_zone_code: "Z2", reach_class: "COMPLIANCE_POINT", delivery_factor: 1.0000 }
              as: TmdlAnalyst
              captures: { r_scr_id: $.data.id }
            - call: "POST /reaches"
              payload: { watershed_id: "${w_mad_id}", reach_code: "R_MAD", trading_zone_code: "Z1", reach_class: "COMPLIANCE_POINT", delivery_factor: 1.0000 }
              as: TmdlAnalyst
              captures: { r_mad_id: $.data.id }
            - call: "POST /tmdl-assessments"
              payload: { watershed_id: "${w_scr_id}", assessment_code: "TMDL-P-2026", loading_capacity_lbs_yr: 60000.00, margin_of_safety_pct: 0.1000, background_load_lbs_yr: 6000.00, period_start_date: "2026-01-01", period_end_date: "2035-12-31" }
              as: TmdlAnalyst
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /source-assessments"
              payload: { tmdl_assessment_id: "${t_id}", reach_id: "${r_mad_id}", source_name: "Foreign Outfall", source_type: "POINT", existing_load_lbs_yr: 5000.00, controllability_index: 0.5000, status: "INVENTORIED" }
              as: TmdlAnalyst
              captures: { err_1: $.data.error_id }
            - call: "POST /source-assessments"
              payload: { tmdl_assessment_id: "${t_id}", reach_id: "${r_scr_id}", source_name: "City WWTP", source_type: "POINT", existing_load_lbs_yr: 5000.00, controllability_index: 0.5000, status: "INVENTORIED" }
              as: TmdlAnalyst
              captures: { sa_ok_id: $.data.id }
          assert:
            - "trigger call 1 responds 422 with data.error_id == \"ERR_WATERSHED_MISMATCH\" (not 404: reach ${r_mad_id} exists)"
            - "trigger call 2 responds 201 with data.reach_id == ${r_scr_id}"
            - "GET /source-assessments?tmdl_assessment_id=${t_id} returns meta.total_count == 1"

      - name: permit_on_a_nonpoint_source_assessment_is_rejected
        claim_type: violation_error
        grounds:
          - validations[priority=26]
          - errors[ERR_SOURCE_NOT_POINT]
        distinguishing_aspect: "Only POINT sources receive permits: naming the NONPOINT Upper Cropland row returns 422 ERR_SOURCE_NOT_POINT even though that row already carries a load allocation, while the POINT City WWTP row is accepted."
        test_recipe:
          setup:
            - "Watershed SCR with reaches R_OUT and R_UP; TMDL-P-2026 in DRAFT with one POINT and one NONPOINT source, both allocated by an ACTIVE run."
