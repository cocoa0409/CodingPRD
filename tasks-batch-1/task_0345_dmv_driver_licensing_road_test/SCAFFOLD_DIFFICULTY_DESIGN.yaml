  - rule_id: boundary_precision_check
    instances:
      - name: knowledge_pass_threshold_exact_80_passes
        grounds:
          - calculations.road_test_score
          - state_machines.KnowledgeTest.SCHEDULED_to_PASSED
          - entities.KnowledgeTest.fields.score_pct
        distinguishing_aspect: |
          Numeric threshold crossing on KNOWLEDGE_PASS_THRESHOLD via POST /knowledge-tests/{id}/grade:
          32/40 == 80.00% passes (>= boundary inclusive) whereas 31/40 == 77.50% fails. Metric is
          knowledge score_pct, reached through the grade endpoint.
        test_recipe:
          setup:
            - "A DriverRecord with a SCHEDULED knowledge test (40 questions) at period 0; clock at 0."
          setup_api_calls:
            - call: "POST /driver-records"
              payload: { full_name: "Kim Edge", date_of_birth: "1990-01-01", state_code: "CA" }
              as: LicenseClerk
              as_user_id: "clerk-1"
              captures: { dr_id: $.data.id }
            - call: "POST /knowledge-tests"
              payload: { driver_record_id: "${dr_id}", scheduled_period: 0 }
              as: KnowledgeProctor
              as_user_id: "kp-1"
              captures: { kt_id: $.data.id }
          trigger:
            - call: "POST /knowledge-tests/${kt_id}/grade"
              payload: { correct_answers: 32 }
              as: KnowledgeProctor
              as_user_id: "kp-1"
              captures: { sp: $.data.score_pct, st: $.data.status }
          assert:
            - "KnowledgeTest.${kt_id}.score_pct == 80.0"
            - "KnowledgeTest.${kt_id}.status == PASSED"
            - "DriverRecord.${dr_id}.knowledge_test_passed == true"

      - name: examiner_slot_touching_endpoints_do_not_conflict
        grounds:
          - validations[priority=10]
          - state_machines.RoadTestAppointment.BOOKED_to_PROCTORED
          - entities.RoadTestAppointment.fields.slot_start_period
        distinguishing_aspect: |
          Interval-adjacency boundary on RoadTestAppointment via POST /road-test-appointments: a
          second booking whose slot_start_period equals the first booking's slot_end_period does NOT
          conflict (half-open [start,end)). Metric is interval adjacency (distinct from the numeric
          score boundary), reached through the booking endpoint.
        test_recipe:
