  - rule_id: cross_entity_state_dependency
    instances:
      - name: heading_completion_blocked_while_its_tool_is_worn
        grounds:
          - validations[priority=11, error_id=ERR_INVALID_TOOL_STATE]
          - state_machines.HeadingTool.status
          - state_machines.ProductionLot.process_state.SETUP_to_HEADED
          - endpoints[POST /production-lots/{id}/complete-heading]
        distinguishing_aspect: |
          The entity pair is ProductionLot and HeadingTool: the lot is a perfectly valid SETUP lot with
          disposition IN_PROCESS, yet complete-heading fails with ERR_INVALID_TOOL_STATE purely because
          the referenced tool sits in WORN; regrinding and remounting the same tool makes the identical
          request succeed.
        test_recipe:
          setup:
            - "Part spec BX-M8-109 (blank 20.0 g, required op THREAD_ROLL), VERIFIED heat H-77410, RELEASED wire lot of 500.0 kg."
            - "Tool DIE-4S-001 rated 120000 is mounted on PRESS-3 and lot L-2640 planned 5000 is opened in SETUP."
            - "The tool is then condemned, which also holds the SETUP lot; the hold is released so the lot's own dimensions are clean and only the tool state is wrong."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T06:00:00Z" }
              as: ProcessEngineer
            - call: "POST /part-specs"
              payload: { part_number: "BX-M8-109", thread_designation: "M8x1.25", strength_class: "CLASS_10_9", qualification_program: "AUTOMOTIVE_PPAP", allowed_steel_grades: ["SAE_10B21"], blank_mass_g: 20.0, station_count_required: 4, thread_timing: "BEFORE_HEAT_TREAT", required_secondary_ops: ["THREAD_ROLL"], min_core_hardness_hv: 304, max_core_hardness_hv: 361, max_decarb_depth_mm: 0.150, plating_spec: "ZINC_CLEAR", packaging_mode: "BY_WEIGHT", nominal_pack_count: 500, pieces_per_kg: 62.5, proof_load_kn: 34.7 }
