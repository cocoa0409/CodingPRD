          Same exclusivity idea on a different resource with the OPPOSITE endpoint convention: the
          exclusive resource is a (product, chemical) reformulation slot and its intervals are
          HALF-OPEN, so a project starting exactly when another ends is accepted where the
          placement rule would have refused it, while a window straddling the seam is refused; the
          slot is also released by ABANDON because only non-terminal projects are considered.
