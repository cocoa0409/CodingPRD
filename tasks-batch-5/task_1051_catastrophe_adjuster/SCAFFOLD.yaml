# =============================================================================
# Scaffold: independent-catastrophe-adjuster (Expert band)
# =============================================================================

scenario: |
  Independent & Catastrophe Adjuster: claim assignment & deployment, inspection
  & Xactimate estimate, photo/scope & report, timekeeping & fee-schedule bill,
  cat-roster & availability, QA/re-inspection, multi-state licensing, payment

domain_name: catastrophe-adjuster
api_prefix: ""   # flat topology: peer top-level collections, FK-linked (no URL nesting)

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation      # fee-schedule vs time-and-expense; RCV vs ACV
    - cascading_side_effects        # QA-revision revert chain; payment close chain
    - optimistic_concurrency        # OCC on Assignment.version for superseding fee bills
    - rate_threshold_triggers       # tiered fee schedule breakpoints; license expiry boundary

  entity_topology: flat
  # peer entities linked by foreign keys; no nested resource URLs.

  state_machine_shape: parallel
  # Assignment carries independent work_status × billing_status dimensions;
  # Report is cyclic (revision loop); Inspection re-opens; License suspend/reinstate cycle.

  relationship_patterns:
    - one_to_many          # Claim → Assignments, Assignment → TimeEntries, Adjuster → Licenses
    - cross_aggregate      # Assignment ↔ Adjuster ↔ License; FeeBill ↔ Claim reserve
    - self_referential: false

  role_model: segregation_of_duties
  # QA reviewer of a Report must not be the field adjuster who authored it.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Adjuster
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Adjuster full name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: adjuster_type, type: enum, source: input, description: "INDEPENDENT | CAT | STAFF", constraints: "one of INDEPENDENT, CAT, STAFF" }
      - { name: home_state, type: string, source: input, description: "Two-letter home US state code" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | INACTIVE", constraints: "one of ACTIVE, INACTIVE" }

  - name: AdjusterLicense
    parent: null
    common_fields: true
    fields:
      - { name: adjuster_id, type: string, source: input, description: "FK -> Adjuster.id; license holder" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state this license authorizes" }
      - { name: license_number, type: string, source: input, description: "State-issued license number" }
      - { name: license_type, type: enum, source: input, description: "ALL_LINES | PROPERTY", constraints: "one of ALL_LINES, PROPERTY" }
      - { name: issued_at, type: datetime, source: input, description: "Issue timestamp (ISO 8601 UTC)" }
      - { name: expires_at, type: datetime, source: input, description: "Expiry timestamp (ISO 8601 UTC); license usable only while current_clock < expires_at" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING -> ACTIVE <-> SUSPENDED, ACTIVE -> EXPIRED", constraints: "one of PENDING, ACTIVE, SUSPENDED, EXPIRED" }

  - name: CatEvent
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Catastrophe event name (e.g. Hurricane Delta)" }
      - { name: peril_type, type: enum, source: input, description: "HURRICANE | FLOOD | WILDFIRE | TORNADO | HAIL | WIND", constraints: "one of HURRICANE, FLOOD, WILDFIRE, TORNADO, HAIL, WIND" }
      - { name: affected_states, type: array, source: input, description: "List of two-letter US state codes in the impact zone" }
      - { name: roster_capacity, type: integer, source: input, description: "Maximum number of concurrently rostered adjusters (positive integer)" }
      - { name: roster_filled_count, type: integer, source: computed, default: 0, description: "Count of Deployments for this event in status IN {CONFIRMED, ACTIVE}" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | CLOSED", constraints: "one of OPEN, CLOSED" }

  - name: Deployment
    parent: null
    common_fields: true
    fields:
      - { name: adjuster_id, type: string, source: input, description: "FK -> Adjuster.id; deployed adjuster" }
      - { name: cat_event_id, type: string, source: input, description: "FK -> CatEvent.id; event the adjuster is rostered to" }
      - { name: start_at, type: datetime, source: input, description: "Deployment window start (ISO 8601 UTC), inclusive" }
      - { name: end_at, type: datetime, source: input, description: "Deployment window end (ISO 8601 UTC), exclusive; must be strictly after start_at" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED -> CONFIRMED -> ACTIVE -> COMPLETED; REQUESTED/CONFIRMED/ACTIVE -> WITHDRAWN", constraints: "one of REQUESTED, CONFIRMED, ACTIVE, COMPLETED, WITHDRAWN" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: claim_number, type: string, source: input, description: "Carrier claim number" }
      - { name: policyholder_name, type: string, source: input, description: "Insured party name" }
      - { name: loss_state, type: string, source: input, description: "Two-letter US state where the loss occurred; adjuster must be licensed here" }
      - { name: peril_type, type: enum, source: input, description: "HURRICANE | FLOOD | WILDFIRE | TORNADO | HAIL | WIND | FIRE | WATER", constraints: "one of HURRICANE, FLOOD, WILDFIRE, TORNADO, HAIL, WIND, FIRE, WATER" }
      - { name: policy_type, type: enum, source: input, description: "RCV | ACV; selects estimate net_payable variant", constraints: "one of RCV, ACV" }
      - { name: cat_event_id, type: string, source: input, required: false, description: "FK -> CatEvent.id; optional catastrophe linkage (null for daily-claim work)" }
      - { name: rcv_cents, type: integer, source: computed, default: 0, description: "Replacement-cost value from the latest APPROVED Estimate on this claim (rcv_total_cents); feeds FEE_SCHEDULE billing" }
      - { name: reserve_consumed_cents, type: integer, source: computed, default: 0, description: "Sum of FeeBill.total_cents over this claim's fee bills whose status IN {SUBMITTED, APPROVED, PAID}" }
      - { name: status, type: enum, source: system, default: INTAKE, description: "INTAKE -> ASSIGNED -> IN_PROGRESS -> UNDER_REVIEW -> SETTLED -> CLOSED; CLOSED -> REOPENED -> IN_PROGRESS", constraints: "one of INTAKE, ASSIGNED, IN_PROGRESS, UNDER_REVIEW, SETTLED, CLOSED, REOPENED" }

  - name: Assignment
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; the claim being adjusted" }
      - { name: adjuster_id, type: string, source: input, description: "FK -> Adjuster.id; the adjuster the work is offered to" }
      - { name: offered_at, type: datetime, source: system, description: "When the assignment was created/offered (ISO 8601 UTC)" }
      - { name: work_status, type: enum, source: system, default: OFFERED, description: "Work dimension: OFFERED -> ACCEPTED -> FIELDWORK -> WORK_COMPLETE; OFFERED -> DECLINED; WORK_COMPLETE -> FIELDWORK on QA revision", constraints: "one of OFFERED, ACCEPTED, FIELDWORK, WORK_COMPLETE, DECLINED" }
      - { name: billing_status, type: enum, source: system, default: NOT_BILLED, description: "Billing dimension (independent of work_status): NOT_BILLED -> BILLED -> PAID; BILLED -> NOT_BILLED on void/reject", constraints: "one of NOT_BILLED, BILLED, PAID" }

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - { name: assignment_id, type: string, source: input, description: "FK -> Assignment.id; the assignment this inspection belongs to" }
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; denormalized claim for property-level spacing checks" }
      - { name: scheduled_start, type: datetime, source: input, description: "Scheduled on-site window start (ISO 8601 UTC)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Scheduled on-site window end (ISO 8601 UTC); must be strictly after scheduled_start" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED -> IN_PROGRESS -> COMPLETED; COMPLETED -> REOPENED -> IN_PROGRESS on QA revision", constraints: "one of SCHEDULED, IN_PROGRESS, COMPLETED, REOPENED" }

  - name: Estimate
    parent: null
    common_fields: true
    fields:
      - { name: inspection_id, type: string, source: input, description: "FK -> Inspection.id; the inspection this estimate documents" }
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; the claim being valued" }
      - { name: line_items, type: array, source: input, description: "Array of objects {description: string, rcv_cents: integer >=0, depreciation_pct: number in [0,100]}" }
      - { name: rcv_total_cents, type: integer, source: computed, description: "Sum of line_items[].rcv_cents (replacement cost value)" }
      - { name: acv_total_cents, type: integer, source: computed, description: "Sum over line items of round_half_up(rcv_cents * (1 - depreciation_pct/100)); rounded PER LINE then summed" }
      - { name: recoverable_depreciation_cents, type: integer, source: computed, description: "rcv_total_cents - acv_total_cents" }
      - { name: net_payable_cents, type: integer, source: computed, description: "Variant by Claim.policy_type: ACV -> acv_total_cents; RCV -> rcv_total_cents" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> APPROVED", constraints: "one of DRAFT, APPROVED" }

  - name: Report
    parent: null
    common_fields: true
    fields:
      - { name: inspection_id, type: string, source: input, description: "FK -> Inspection.id; the inspection this report covers" }
      - { name: assignment_id, type: string, source: input, description: "FK -> Assignment.id; denormalized assignment for cascade + SoD" }
      - { name: scope_narrative, type: string, source: input, description: "Free-text scope of loss narrative" }
      - { name: photo_count, type: integer, source: input, default: 0, description: "Number of photos attached (non-negative integer); submit requires >= 1" }
      - { name: qa_reviewer_id, type: string, source: system, required: false, description: "Adjuster.id of the QA reviewer who rendered the latest decision (null until first QA decision)" }
      - { name: qa_decision, type: enum, source: system, required: false, description: "APPROVED | REVISION_REQUESTED; latest QA decision (null until first QA decision)", constraints: "one of APPROVED, REVISION_REQUESTED" }
      - { name: qa_notes, type: string, source: system, required: false, description: "Latest QA reviewer notes" }
      - { name: revision_count, type: integer, source: computed, default: 0, description: "Number of REVISION_REQUESTED decisions issued so far" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> SUBMITTED -> APPROVED; SUBMITTED -> REVISION_REQUESTED -> SUBMITTED (cycle)", constraints: "one of DRAFT, SUBMITTED, APPROVED, REVISION_REQUESTED" }

  - name: TimeEntry
    parent: null
    common_fields: false
    fields:
      - { name: assignment_id, type: string, source: input, description: "FK -> Assignment.id; assignment the time is logged against" }
      - { name: work_date, type: datetime, source: input, description: "Date the work was performed (ISO 8601 UTC)" }
      - { name: activity, type: enum, source: input, description: "INSPECTION | ESTIMATING | REPORT | TRAVEL", constraints: "one of INSPECTION, ESTIMATING, REPORT, TRAVEL" }
      - { name: hours, type: number, source: input, description: "Billable hours (> 0), up to 2 decimals" }
      - { name: expense_cents, type: integer, source: input, default: 0, description: "Reimbursable expense for this entry in cents (non-negative)" }

  - name: FeeSchedule
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Fee schedule label" }
      - { name: tier1_max_rcv_cents, type: integer, source: input, description: "Inclusive upper bound of tier 1 by claim RCV (rcv <= tier1_max_rcv_cents => tier 1)" }
      - { name: tier2_max_rcv_cents, type: integer, source: input, description: "Inclusive upper bound of tier 2 (tier1_max < rcv <= tier2_max => tier 2; else tier 3)" }
      - { name: tier1_flat_fee_cents, type: integer, source: input, description: "Flat fee component for tier 1" }
      - { name: tier2_flat_fee_cents, type: integer, source: input, description: "Flat fee component for tier 2" }
      - { name: tier3_flat_fee_cents, type: integer, source: input, description: "Flat fee component for tier 3" }
      - { name: rcv_pct_bps, type: integer, source: input, description: "Percent-of-RCV component in basis points (e.g. 250 = 2.5%)" }
      - { name: pct_cap_cents, type: integer, source: input, description: "RCV is capped at this value before applying rcv_pct_bps" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Hourly labor rate for TIME_AND_EXPENSE billing" }
      - { name: cat_peril_multiplier_bps, type: integer, source: input, description: "Multiplier in bps applied to FEE_SCHEDULE base when claim.peril_type is a CAT peril (e.g. 12500 = 1.25x)" }

  - name: FeeBill
    parent: null
    common_fields: true
    fields:
      - { name: assignment_id, type: string, source: input, description: "FK -> Assignment.id; the billed assignment" }
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; denormalized claim for reserve ledger" }
      - { name: fee_schedule_id, type: string, source: input, description: "FK -> FeeSchedule.id; rate card applied" }
      - { name: billing_method, type: enum, source: input, description: "FEE_SCHEDULE | TIME_AND_EXPENSE", constraints: "one of FEE_SCHEDULE, TIME_AND_EXPENSE" }
      - { name: expected_assignment_version, type: integer, source: input, description: "OCC guard: the Assignment.version the client last observed" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Labor/fee subtotal before expenses (FEE_SCHEDULE: peril-scaled base; TIME_AND_EXPENSE: labor only)" }
      - { name: total_cents, type: integer, source: computed, description: "Amount owed (FEE_SCHEDULE: subtotal; TIME_AND_EXPENSE: subtotal + sum of TimeEntry.expense_cents)" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> SUBMITTED -> APPROVED -> PAID; SUBMITTED -> REJECTED; DRAFT/SUBMITTED/APPROVED -> VOID", constraints: "one of DRAFT, SUBMITTED, APPROVED, PAID, REJECTED, VOID" }

  - name: Payment
    parent: null
    common_fields: false
    fields:
      - { name: fee_bill_id, type: string, source: input, description: "FK -> FeeBill.id; the bill being paid" }
      - { name: amount_cents, type: integer, source: computed, description: "Equals the FeeBill.total_cents at time of payment" }
      - { name: method, type: enum, source: input, description: "ACH | CHECK", constraints: "one of ACH, CHECK" }
      - { name: paid_at, type: datetime, source: system, description: "Logical-clock timestamp when payment was recorded" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: AdjusterLicense
    initial_state: PENDING
    terminal_states: [EXPIRED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /licenses/{id}/activate"
        actor: LicensingAdmin
        preconditions:
          - "License in PENDING (ERR_LICENSE_NOT_PENDING)"
          - "current_clock < expires_at (ERR_LICENSE_EXPIRED)"
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /licenses/{id}/suspend"
        actor: LicensingAdmin
        preconditions:
          - "License in ACTIVE (ERR_LICENSE_NOT_ACTIVE)"
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /licenses/{id}/reinstate"
        actor: LicensingAdmin
        preconditions:
          - "License in SUSPENDED (ERR_LICENSE_NOT_SUSPENDED)"
          - "current_clock < expires_at (ERR_LICENSE_EXPIRED)"
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (evaluated on any use of the license when current_clock >= expires_at)"
        actor: system
        preconditions:
          - "current_clock >= expires_at"
        side_effects: []
      - from: SUSPENDED
        to: EXPIRED
        trigger: "system (evaluated on any use of the license when current_clock >= expires_at)"
        actor: system
        preconditions:
          - "current_clock >= expires_at"
        side_effects: []

  - entity: CatEvent
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /cat-events/{id}/close"
        actor: LicensingAdmin
        preconditions:
          - "CatEvent in OPEN (ERR_CAT_EVENT_NOT_OPEN)"
          - "No Deployment for this event in status IN {CONFIRMED, ACTIVE} (ERR_ROSTER_NOT_EMPTY)"
        side_effects: []

  - entity: Deployment
    initial_state: REQUESTED
    terminal_states: [COMPLETED, WITHDRAWN]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /deployments/{id}/confirm"
        actor: LicensingAdmin
        preconditions:
          - "Deployment in REQUESTED (ERR_DEPLOYMENT_NOT_REQUESTED)"
          - "CatEvent is OPEN (ERR_CAT_EVENT_NOT_OPEN)"
          - "No other Deployment for the same adjuster in status IN {CONFIRMED, ACTIVE} whose [start_at, end_at) overlaps this window (ERR_DEPLOYMENT_WINDOW_OVERLAP) [business_temporal — checked before capacity]"
          - "CatEvent.roster_filled_count < CatEvent.roster_capacity (ERR_ROSTER_CAPACITY_EXCEEDED) [business_fiscal]"
        side_effects:
          - "CatEvent.roster_filled_count += 1 (invariant: roster_filled_count == count of {CONFIRMED,ACTIVE} deployments)"
      - from: CONFIRMED
        to: ACTIVE
        trigger: "POST /deployments/{id}/activate"
        actor: LicensingAdmin
        preconditions:
          - "Deployment in CONFIRMED (ERR_DEPLOYMENT_NOT_CONFIRMED)"
          - "start_at <= current_clock < end_at (ERR_DEPLOYMENT_WINDOW_NOT_OPEN)"
        side_effects: []
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /deployments/{id}/complete"
        actor: LicensingAdmin
        preconditions:
          - "Deployment in ACTIVE (ERR_DEPLOYMENT_NOT_ACTIVE)"
        side_effects:
          - "CatEvent.roster_filled_count -= 1"
      - from: REQUESTED
        to: WITHDRAWN
        trigger: "POST /deployments/{id}/withdraw"
        actor: LicensingAdmin
        preconditions:
          - "Deployment in status IN {REQUESTED, CONFIRMED, ACTIVE} (ERR_DEPLOYMENT_NOT_WITHDRAWABLE)"
        side_effects:
          - "If prior status IN {CONFIRMED, ACTIVE}: CatEvent.roster_filled_count -= 1 (compensating; restores the invariant)"
      - from: CONFIRMED
        to: WITHDRAWN
        trigger: "POST /deployments/{id}/withdraw"
        actor: LicensingAdmin
        preconditions:
          - "Deployment in status IN {REQUESTED, CONFIRMED, ACTIVE} (ERR_DEPLOYMENT_NOT_WITHDRAWABLE)"
        side_effects:
          - "CatEvent.roster_filled_count -= 1 (compensating; restores the invariant)"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /deployments/{id}/withdraw"
        actor: LicensingAdmin
        preconditions:
          - "Deployment in status IN {REQUESTED, CONFIRMED, ACTIVE} (ERR_DEPLOYMENT_NOT_WITHDRAWABLE)"
        side_effects:
          - "CatEvent.roster_filled_count -= 1 (compensating; restores the invariant)"

  - entity: Claim
    initial_state: INTAKE
    terminal_states: [CLOSED]
    transitions:
      - from: INTAKE
        to: ASSIGNED
        trigger: "system (first Assignment created for this claim via POST /assignments)"
        actor: system
        preconditions:
          - "Claim in INTAKE"
        side_effects: []
      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "system (an Assignment for this claim is accepted via POST /assignments/{id}/accept)"
        actor: system
        preconditions:
          - "Claim in ASSIGNED"
        side_effects: []
      - from: IN_PROGRESS
        to: UNDER_REVIEW
        trigger: "system (a Report on this claim is submitted via POST /reports/{id}/submit)"
        actor: system
        preconditions:
          - "Claim in IN_PROGRESS"
        side_effects: []
      - from: UNDER_REVIEW
        to: IN_PROGRESS
        trigger: "system (cascade: QA revision on the claim's Report — see Report.SUBMITTED_to_REVISION_REQUESTED)"
        actor: system
        preconditions:
          - "Claim in UNDER_REVIEW"
        side_effects: []
      - from: UNDER_REVIEW
        to: SETTLED
        trigger: "system (the claim's Report is QA-approved via POST /reports/{id}/qa-decision decision=APPROVED)"
        actor: system
        preconditions:
          - "Claim in UNDER_REVIEW"
        side_effects: []
      - from: SETTLED
        to: CLOSED
        trigger: "system (cascade: every Assignment on this claim has billing_status == PAID — see FeeBill.APPROVED_to_PAID)"
        actor: system
        preconditions:
          - "Claim in SETTLED"
          - "All Assignments for this claim (excluding DECLINED) have billing_status == PAID"
        side_effects: []
      - from: CLOSED
        to: REOPENED
        trigger: "POST /claims/{id}/reopen"
        actor: DeskExaminer
        preconditions:
          - "Claim in CLOSED (ERR_CLAIM_NOT_CLOSED)"
        side_effects: []
      - from: REOPENED
        to: IN_PROGRESS
        trigger: "system (an Assignment on the reopened claim moves back to FIELDWORK, or a new Assignment is accepted)"
        actor: system
        preconditions:
          - "Claim in REOPENED"
        side_effects: []

  - entity: Assignment
    initial_state: OFFERED
    terminal_states: [DECLINED]
    note: "Two independent state dimensions on one row: work_status and billing_status evolve separately."
    transitions:
      # ---- work_status dimension ----
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /assignments/{id}/accept"
        actor: FieldAdjuster
        preconditions:
          - "work_status == OFFERED (ERR_ASSIGNMENT_NOT_OFFERED) [state — checked before license]"
          - "Acting adjuster owns this assignment: X-User-ID == assignment.adjuster_id (ERR_NOT_ASSIGNMENT_OWNER)"
          - "Adjuster holds an AdjusterLicense with status==ACTIVE, state_code==Claim.loss_state, and current_clock < expires_at (ERR_NO_ACTIVE_LICENSE) [business_referential — cross-entity dependency on License]"
        side_effects:
          - "If Claim.status == ASSIGNED: Claim -> IN_PROGRESS; if Claim.status == REOPENED: Claim -> IN_PROGRESS"
      - from: OFFERED
        to: DECLINED
        trigger: "POST /assignments/{id}/decline"
        actor: FieldAdjuster
        preconditions:
          - "work_status == OFFERED (ERR_ASSIGNMENT_NOT_OFFERED)"
          - "X-User-ID == assignment.adjuster_id (ERR_NOT_ASSIGNMENT_OWNER)"
        side_effects: []
      - from: ACCEPTED
        to: FIELDWORK
        trigger: "system (Inspection for this assignment moves to IN_PROGRESS via POST /inspections/{id}/start)"
        actor: system
        preconditions:
          - "work_status == ACCEPTED"
        side_effects: []
      - from: FIELDWORK
        to: WORK_COMPLETE
        trigger: "system (Report on this assignment is submitted via POST /reports/{id}/submit)"
        actor: system
        preconditions:
          - "work_status == FIELDWORK"
        side_effects: []
      - from: WORK_COMPLETE
        to: FIELDWORK
        trigger: "system (cascade: QA revision — see Report.SUBMITTED_to_REVISION_REQUESTED)"
        actor: system
        preconditions:
          - "work_status == WORK_COMPLETE"
        side_effects: []
      # ---- billing_status dimension ----
      - from: NOT_BILLED
        to: BILLED
        trigger: "system (FeeBill for this assignment is submitted via POST /fee-bills/{id}/submit)"
        actor: system
        preconditions:
          - "billing_status == NOT_BILLED"
          - "work_status == WORK_COMPLETE"
        side_effects: []
      - from: BILLED
        to: PAID
        trigger: "system (FeeBill for this assignment is paid via POST /fee-bills/{id}/pay)"
        actor: system
        preconditions:
          - "billing_status == BILLED"
        side_effects:
          - "May cascade Claim SETTLED -> CLOSED when all assignments on the claim are PAID"
      - from: BILLED
        to: NOT_BILLED
        trigger: "system (FeeBill for this assignment is rejected or voided via POST /fee-bills/{id}/reject | /void)"
        actor: system
        preconditions:
          - "billing_status == BILLED"
        side_effects: []

  - entity: Inspection
    initial_state: SCHEDULED
    terminal_states: []
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /inspections/{id}/start"
        actor: FieldAdjuster
        preconditions:
          - "Inspection in SCHEDULED (ERR_INSPECTION_NOT_SCHEDULED)"
          - "Parent Assignment.work_status == ACCEPTED (ERR_ASSIGNMENT_NOT_ACCEPTED) [cross-entity dependency]"
          - "X-User-ID == parent Assignment.adjuster_id (ERR_NOT_ASSIGNMENT_OWNER)"
        side_effects:
          - "Parent Assignment.work_status ACCEPTED -> FIELDWORK"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /inspections/{id}/complete"
        actor: FieldAdjuster
        preconditions:
          - "Inspection in IN_PROGRESS (ERR_INSPECTION_NOT_IN_PROGRESS)"
          - "X-User-ID == parent Assignment.adjuster_id (ERR_NOT_ASSIGNMENT_OWNER)"
        side_effects: []
      - from: COMPLETED
        to: REOPENED
        trigger: "system (cascade: QA revision — see Report.SUBMITTED_to_REVISION_REQUESTED)"
        actor: system
        preconditions:
          - "Inspection in COMPLETED"
        side_effects: []
      - from: REOPENED
        to: IN_PROGRESS
        trigger: "POST /inspections/{id}/start"
        actor: FieldAdjuster
        preconditions:
          - "Inspection in REOPENED (ERR_INSPECTION_NOT_SCHEDULED covers SCHEDULED|REOPENED starts)"
          - "X-User-ID == parent Assignment.adjuster_id (ERR_NOT_ASSIGNMENT_OWNER)"
        side_effects: []

  - entity: Estimate
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /estimates/{id}/approve"
        actor: FieldAdjuster
        preconditions:
          - "Estimate in DRAFT (ERR_ESTIMATE_NOT_DRAFT)"
          - "Parent Inspection.status == COMPLETED (ERR_INSPECTION_NOT_COMPLETED) [cross-entity dependency]"
          - "X-User-ID == parent Assignment.adjuster_id (ERR_NOT_ASSIGNMENT_OWNER)"
        side_effects:
          - "Claim.rcv_cents := this Estimate.rcv_total_cents (feeds FEE_SCHEDULE billing)"

  - entity: Report
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /reports/{id}/submit"
        actor: FieldAdjuster
        preconditions:
          - "Report in DRAFT (ERR_REPORT_NOT_SUBMITTABLE covers DRAFT|REVISION_REQUESTED)"
          - "X-User-ID == parent Assignment.adjuster_id (ERR_NOT_ASSIGNMENT_OWNER)"
          - "Parent Inspection.status == COMPLETED (ERR_INSPECTION_NOT_COMPLETED) [cross-entity dependency]"
          - "An APPROVED Estimate exists for the parent Inspection (ERR_ESTIMATE_NOT_APPROVED)"
          - "photo_count >= 1 (ERR_REPORT_NO_PHOTOS) [business_safety — zero-count boundary]"
        side_effects:
          - "Parent Assignment.work_status FIELDWORK -> WORK_COMPLETE"
          - "Claim.status IN_PROGRESS -> UNDER_REVIEW"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /reports/{id}/qa-decision (decision=APPROVED)"
        actor: QAReviewer
        preconditions:
          - "Report in SUBMITTED (ERR_REPORT_NOT_IN_REVIEW)"
          - "Acting QA reviewer is not the authoring adjuster: X-User-ID != parent Assignment.adjuster_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Set qa_reviewer_id = X-User-ID, qa_decision = APPROVED, qa_notes"
          - "Claim.status UNDER_REVIEW -> SETTLED"
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /reports/{id}/qa-decision (decision=REVISION_REQUESTED)"
        actor: QAReviewer
        preconditions:
          - "Report in SUBMITTED (ERR_REPORT_NOT_IN_REVIEW)"
          - "X-User-ID != parent Assignment.adjuster_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Set qa_reviewer_id = X-User-ID, qa_decision = REVISION_REQUESTED, qa_notes; revision_count += 1"
          - "CASCADE hop 1: parent Inspection COMPLETED -> REOPENED"
          - "CASCADE hop 2: caused by the Inspection reopening, parent Assignment.work_status WORK_COMPLETE -> FIELDWORK"
          - "CASCADE hop 3: caused by the Assignment reverting, Claim.status UNDER_REVIEW -> IN_PROGRESS"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /reports/{id}/submit"
        actor: FieldAdjuster
        preconditions:
          - "Report in REVISION_REQUESTED (ERR_REPORT_NOT_SUBMITTABLE covers DRAFT|REVISION_REQUESTED)"
          - "X-User-ID == parent Assignment.adjuster_id (ERR_NOT_ASSIGNMENT_OWNER)"
          - "Parent Inspection.status == COMPLETED (ERR_INSPECTION_NOT_COMPLETED)"
          - "photo_count >= 1 (ERR_REPORT_NO_PHOTOS)"
        side_effects:
          - "Parent Assignment.work_status FIELDWORK -> WORK_COMPLETE"
          - "Claim.status IN_PROGRESS -> UNDER_REVIEW"

  - entity: FeeBill
    initial_state: DRAFT
    terminal_states: [PAID, REJECTED, VOID]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /fee-bills/{id}/submit"
        actor: FieldAdjuster
        preconditions:
          - "FeeBill in DRAFT (ERR_FEE_BILL_NOT_DRAFT)"
          - "X-User-ID == parent Assignment.adjuster_id (ERR_NOT_ASSIGNMENT_OWNER)"
          - "Parent Assignment.work_status == WORK_COMPLETE (ERR_ASSIGNMENT_NOT_WORK_COMPLETE) [cross-entity dependency]"
        side_effects:
          - "Parent Assignment.billing_status NOT_BILLED -> BILLED"
          - "Claim.reserve_consumed_cents += FeeBill.total_cents (invariant: reserve == sum of {SUBMITTED,APPROVED,PAID} bills)"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /fee-bills/{id}/approve"
        actor: BillingManager
        preconditions:
          - "FeeBill in SUBMITTED (ERR_FEE_BILL_NOT_SUBMITTED)"
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /fee-bills/{id}/reject"
        actor: BillingManager
        preconditions:
          - "FeeBill in SUBMITTED (ERR_FEE_BILL_NOT_SUBMITTED)"
        side_effects:
          - "Parent Assignment.billing_status BILLED -> NOT_BILLED"
          - "Claim.reserve_consumed_cents -= FeeBill.total_cents (compensating; restores reserve invariant)"
      - from: APPROVED
        to: PAID
        trigger: "POST /fee-bills/{id}/pay"
        actor: BillingManager
        preconditions:
          - "FeeBill in APPROVED (ERR_FEE_BILL_NOT_APPROVED)"
        side_effects:
          - "Create Payment {fee_bill_id, amount_cents = FeeBill.total_cents, method, paid_at = current_clock}"
          - "CASCADE hop 1: parent Assignment.billing_status BILLED -> PAID"
          - "CASCADE hop 2: caused by the Assignment becoming PAID, if Claim is SETTLED and all its non-DECLINED assignments are PAID -> Claim.status SETTLED -> CLOSED"
      - from: DRAFT
        to: VOID
        trigger: "POST /fee-bills/{id}/void"
        actor: BillingManager
        preconditions:
          - "FeeBill in status IN {DRAFT, SUBMITTED, APPROVED} (ERR_FEE_BILL_NOT_VOIDABLE)"
        side_effects:
          - "If prior status IN {SUBMITTED, APPROVED}: Claim.reserve_consumed_cents -= FeeBill.total_cents and parent Assignment.billing_status -> NOT_BILLED (compensating)"
      - from: SUBMITTED
        to: VOID
        trigger: "POST /fee-bills/{id}/void"
        actor: BillingManager
        preconditions:
          - "FeeBill in status IN {DRAFT, SUBMITTED, APPROVED} (ERR_FEE_BILL_NOT_VOIDABLE)"
        side_effects:
          - "Claim.reserve_consumed_cents -= FeeBill.total_cents; parent Assignment.billing_status BILLED -> NOT_BILLED (compensating)"
      - from: APPROVED
        to: VOID
        trigger: "POST /fee-bills/{id}/void"
        actor: BillingManager
        preconditions:
          - "FeeBill in status IN {DRAFT, SUBMITTED, APPROVED} (ERR_FEE_BILL_NOT_VOIDABLE)"
        side_effects:
          - "Claim.reserve_consumed_cents -= FeeBill.total_cents; parent Assignment.billing_status BILLED -> NOT_BILLED (compensating)"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: fee-bill-create-stale-assignment
    parent_entity: Assignment
    write_endpoint: "POST /fee-bills"
    occ_field: "expected_assignment_version"
    description: |
      Creating a FeeBill against an Assignment whose version has advanced since
      the client last observed it is rejected. POST /fee-bills always mints a new
      DRAFT bill that supersedes (voids) any prior non-PAID bill for the same
      assignment and bumps Assignment.version; a client whose
      expected_assignment_version is stale — because a superseding bill was
      already created, or the work/billing dimension advanced — is therefore
      operating on an out-of-date view and is refused.
    error_id: ERR_STALE_ASSIGNMENT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: estimate_valuation
    trigger: "POST /estimates (create) and any recompute of a DRAFT estimate's line_items"
    algorithm: aggregation
    formula: |
      rcv_total_cents = sum(li.rcv_cents for li in line_items)

      # ACV: round EACH line to whole cents (round_half_up) THEN sum — order is pinned.
      acv_total_cents = sum( round_half_up(li.rcv_cents * (1 - li.depreciation_pct/100))
                             for li in line_items )

      recoverable_depreciation_cents = rcv_total_cents - acv_total_cents

      # net_payable variant selected by the parent Claim.policy_type:
      if Claim.policy_type == "ACV":  net_payable_cents = acv_total_cents
      if Claim.policy_type == "RCV":  net_payable_cents = rcv_total_cents
    input_set: "All line_items on the estimate; no status filter (line items are inline)."
    constants: {}
    precision: "round_half_up to whole cents, applied per line item before summing (NOT sum-then-round)"
    variants:
      - name: rcv_valuation
        when: "Claim.policy_type == RCV"
        difference: "net_payable_cents = rcv_total_cents (full replacement cost; recoverable depreciation held for later release)"
      - name: acv_valuation
        when: "Claim.policy_type == ACV"
        difference: "net_payable_cents = acv_total_cents (depreciated value only)"

  - name: fee_bill_amount
    trigger: "POST /fee-bills (create); recomputed if a DRAFT bill is re-derived"
    algorithm: tiered_pricing
    formula: |
      if billing_method == "FEE_SCHEDULE":
        rcv = Claim.rcv_cents
        if   rcv <= fs.tier1_max_rcv_cents: flat = fs.tier1_flat_fee_cents
        elif rcv <= fs.tier2_max_rcv_cents: flat = fs.tier2_flat_fee_cents
        else:                               flat = fs.tier3_flat_fee_cents
        pct_component = floor( fs.rcv_pct_bps / 10000 * min(rcv, fs.pct_cap_cents) )
        base = flat + pct_component
        if Claim.peril_type in CAT_PERILS:
          subtotal_cents = floor( base * fs.cat_peril_multiplier_bps / 10000 )   # multiply THEN floor
        else:
          subtotal_cents = base
        total_cents = subtotal_cents          # no expenses on fee-schedule bills

      if billing_method == "TIME_AND_EXPENSE":
        labor = floor( sum(te.hours for te in TimeEntries(assignment)) * fs.hourly_rate_cents )
        subtotal_cents = labor
        total_cents = labor + sum(te.expense_cents for te in TimeEntries(assignment))
    input_set: "FEE_SCHEDULE reads Claim.rcv_cents (set at estimate approval) + FeeSchedule config; TIME_AND_EXPENSE sums ALL TimeEntry rows whose assignment_id == this assignment (no status filter)."
    constants:
      CAT_PERILS: [HURRICANE, FLOOD, WILDFIRE, TORNADO]   # HAIL, WIND, FIRE, WATER are non-CAT (multiplier not applied)
    precision: "floor to whole cents; the CAT multiplier is applied to base then floored (multiply-then-floor is pinned)"
    variants:
      - name: fee_schedule_billing
        when: "billing_method == FEE_SCHEDULE"
        difference: "tiered flat fee + capped percent-of-RCV, optionally CAT-scaled; ignores logged time"
      - name: time_and_expense_billing
        when: "billing_method == TIME_AND_EXPENSE"
        difference: "hourly labor over logged TimeEntry.hours + summed expenses; ignores claim RCV and tiers"

  - name: claim_reserve_consumed
    trigger: "FeeBill submit (+=), reject/void (-=)"
    algorithm: aggregation
    formula: |
      Claim.reserve_consumed_cents = sum( fb.total_cents
        for fb in FeeBills where fb.claim_id == Claim.id
        and fb.status IN {SUBMITTED, APPROVED, PAID} )
    input_set: "FeeBills for the claim in status SUBMITTED, APPROVED, or PAID (DRAFT/REJECTED/VOID excluded)."
    constants: {}
    precision: "whole cents"

  - name: cat_event_roster_filled
    trigger: "Deployment confirm (+1), complete (-1), withdraw-from-{CONFIRMED,ACTIVE} (-1)"
    algorithm: aggregation
    formula: |
      CatEvent.roster_filled_count = count( d for d in Deployments
        where d.cat_event_id == CatEvent.id and d.status IN {CONFIRMED, ACTIVE} )
    input_set: "Deployments for the event in status CONFIRMED or ACTIVE."
    constants: {}
    precision: "integer count"

  - name: claim_rcv_selection
    trigger: "Estimate approval (POST /estimates/{id}/approve)"
    algorithm: aggregation
    formula: |
      Claim.rcv_cents = rcv_total_cents of the APPROVED Estimate for this claim with the
      latest created_at; if two estimates share created_at, the one approved most recently
      (latest updated_at) wins. (created_at/updated_at used as tie-break, never id.)
    input_set: "Estimates for the claim in status APPROVED."
    constants: {}
    precision: "whole cents"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is a known role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted to perform this operation per §1.7"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body resource ids resolve to existing entities (validated left-to-right)"
    error_id: "ERR_*_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints referencing resource ids

  - priority: 4
    category: business_referential
    check: "Segregation of duties: on a QA decision, the acting QAReviewer (X-User-ID) must not equal the authoring adjuster (parent Assignment.adjuster_id)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /reports/{id}/qa-decision"

  - priority: 5
    category: state
    check: "Ownership: entity_backed FieldAdjuster/QAReviewer acting on an assignment-scoped resource must match parent Assignment.adjuster_id"
    error_id: ERR_NOT_ASSIGNMENT_OWNER
    http_status: 403
    applies_to: "assignment accept/decline, inspection start/complete, estimate approve, report submit, fee-bill submit"

  - priority: 6
    category: concurrency
    check: "OCC: expected_assignment_version must equal current Assignment.version (checked before business logic)"
    error_id: ERR_STALE_ASSIGNMENT_VERSION
    http_status: 412
    applies_to: "POST /fee-bills"

  - priority: 7
    category: state
    check: "Target resource is in a legal state for the requested transition (per §1.2 from-states)"
    error_id: "ERR_*_NOT_* (state-specific, e.g. ERR_ASSIGNMENT_NOT_OFFERED, ERR_FEE_BILL_NOT_APPROVED)"
    http_status: 409
    applies_to: all transition endpoints

  - priority: 8
    category: business_referential
    check: "On assignment accept, the adjuster holds an ACTIVE, non-expired AdjusterLicense whose state_code == Claim.loss_state"
    error_id: ERR_NO_ACTIVE_LICENSE
    http_status: 422
    applies_to: "POST /assignments/{id}/accept"

  - priority: 9
    category: business_temporal
    check: "On deployment confirm, the [start_at, end_at) window does not overlap another {CONFIRMED,ACTIVE} deployment for the same adjuster (half-open; adjacency end==start allowed)"
    error_id: ERR_DEPLOYMENT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /deployments/{id}/confirm"

  - priority: 10
    category: business_temporal
    check: "On inspection create, the [scheduled_start, scheduled_end) window is separated from every other non-terminal Inspection on the SAME claim by >= INSPECTION_MIN_GAP_MINUTES (240); i.e. new.start >= other.end + 240min OR new.end + 240min <= other.start"
    error_id: ERR_INSPECTION_SPACING_CONFLICT
    http_status: 409
    applies_to: "POST /inspections"

  - priority: 11
    category: business_safety
    check: "On report submit, photo_count >= 1 (MIN_PHOTOS=1)"
    error_id: ERR_REPORT_NO_PHOTOS
    http_status: 422
    applies_to: "POST /reports/{id}/submit"

  - priority: 12
    category: business_fiscal
    check: "On deployment confirm, CatEvent.roster_filled_count < CatEvent.roster_capacity"
    error_id: ERR_ROSTER_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /deployments/{id}/confirm"

  - priority: 13
    category: business_constraint
    check: "start_at < end_at on Deployment; scheduled_start < scheduled_end on Inspection; hours > 0 on TimeEntry; line_items non-empty with rcv_cents>=0 and depreciation_pct in [0,100]"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /deployments, POST /inspections, POST /time-entries, POST /estimates"

  - priority: 14
    category: business_constraint
    check: "On fee-bill create with billing_method==TIME_AND_EXPENSE, at least one TimeEntry exists for the assignment (empty-set boundary)"
    error_id: ERR_NO_TIME_ENTRIES
    http_status: 422
    applies_to: "POST /fee-bills"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---------- Test-driving: logical clock ----------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-07-01T00:00:00Z; before any set call the clock reads exactly this default (never real wall-clock)."
    roles: [DeskExaminer, LicensingAdmin, BillingManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["Logical clock advances/rewinds to to_iso8601; affects license expiry, deployment windows, paid_at"]

  # ---------- Adjuster ----------
  - method: POST
    path: "/adjusters"
    description: "Create an adjuster profile"
    roles: [LicensingAdmin]
    code: 201
    input: [full_name, email, adjuster_type, home_state]
    output: Adjuster
    side_effects: []
  - method: GET
    path: "/adjusters"
    description: "List adjusters"
    roles: [DeskExaminer, LicensingAdmin, BillingManager, FieldAdjuster, QAReviewer]
    code: 200
    input: ["adjuster_type?", "home_state?", "limit?", "offset?"]
    output: "Adjuster[]"
    side_effects: []
  - method: GET
    path: "/adjusters/{id}"
    description: "Get an adjuster"
    roles: [DeskExaminer, LicensingAdmin, BillingManager, FieldAdjuster, QAReviewer]
    code: 200
    input: []
    output: Adjuster
    side_effects: []

  # ---------- AdjusterLicense ----------
  - method: POST
    path: "/licenses"
    description: "Create a license for an adjuster (starts PENDING)"
    roles: [LicensingAdmin]
    code: 201
    input: [adjuster_id, state_code, license_number, license_type, issued_at, expires_at]
    output: AdjusterLicense
    side_effects: []
  - method: GET
    path: "/licenses"
    description: "List licenses; filter by adjuster (FK reverse-reachability) or state"
    roles: [DeskExaminer, LicensingAdmin, BillingManager, FieldAdjuster, QAReviewer]
    code: 200
    input: ["adjuster_id?", "state_code?", "status?", "limit?", "offset?"]
    output: "AdjusterLicense[]"
    side_effects: []
  - method: GET
    path: "/licenses/{id}"
    description: "Get a license"
    roles: [DeskExaminer, LicensingAdmin, BillingManager, FieldAdjuster, QAReviewer]
    code: 200
    input: []
    output: AdjusterLicense
    side_effects: []
  - method: POST
    path: "/licenses/{id}/activate"
    description: "Activate a PENDING license"
    roles: [LicensingAdmin]
    code: 200
    input: []
    output: AdjusterLicense
    side_effects: ["PENDING -> ACTIVE"]
  - method: POST
    path: "/licenses/{id}/suspend"
    description: "Suspend an ACTIVE license"
    roles: [LicensingAdmin]
    code: 200
    input: []
    output: AdjusterLicense
    side_effects: ["ACTIVE -> SUSPENDED"]
  - method: POST
    path: "/licenses/{id}/reinstate"
    description: "Reinstate a SUSPENDED license"
    roles: [LicensingAdmin]
    code: 200
    input: []
    output: AdjusterLicense
    side_effects: ["SUSPENDED -> ACTIVE"]

  # ---------- CatEvent ----------
  - method: POST
    path: "/cat-events"
    description: "Create a catastrophe event with roster capacity"
    roles: [LicensingAdmin]
    code: 201
    input: [name, peril_type, affected_states, roster_capacity]
    output: CatEvent
    side_effects: ["roster_filled_count initialized to 0"]
  - method: GET
    path: "/cat-events"
    description: "List cat events"
    roles: [DeskExaminer, LicensingAdmin, BillingManager, FieldAdjuster, QAReviewer]
    code: 200
    input: ["status?", "peril_type?", "limit?", "offset?"]
    output: "CatEvent[]"
    side_effects: []
  - method: GET
    path: "/cat-events/{id}"
    description: "Get a cat event"
    roles: [DeskExaminer, LicensingAdmin, BillingManager, FieldAdjuster, QAReviewer]
    code: 200
    input: []
    output: CatEvent
    side_effects: []
  - method: POST
    path: "/cat-events/{id}/close"
    description: "Close a cat event (roster must be empty)"
    roles: [LicensingAdmin]
    code: 200
    input: []
    output: CatEvent
    side_effects: ["OPEN -> CLOSED"]

  # ---------- Deployment ----------
  - method: POST
    path: "/deployments"
    description: "Request a deployment (roster entry) for an adjuster to a cat event"
    roles: [LicensingAdmin]
    code: 201
    input: [adjuster_id, cat_event_id, start_at, end_at]
    output: Deployment
    side_effects: []
  - method: GET
    path: "/deployments"
    description: "List deployments; filter by adjuster or cat event (FK reverse-reachability)"
    roles: [DeskExaminer, LicensingAdmin, BillingManager, FieldAdjuster, QAReviewer]
    code: 200
    input: ["adjuster_id?", "cat_event_id?", "status?", "limit?", "offset?"]
    output: "Deployment[]"
    side_effects: []
  - method: GET
    path: "/deployments/{id}"
    description: "Get a deployment"
    roles: [DeskExaminer, LicensingAdmin, BillingManager, FieldAdjuster, QAReviewer]
    code: 200
    input: []
    output: Deployment
    side_effects: []
  - method: POST
    path: "/deployments/{id}/confirm"
    description: "Confirm a deployment (overlap + capacity checks; fills a roster seat)"
    roles: [LicensingAdmin]
    code: 200
    input: []
    output: Deployment
    side_effects: ["REQUESTED -> CONFIRMED", "CatEvent.roster_filled_count += 1"]
  - method: POST
    path: "/deployments/{id}/activate"
    description: "Activate a confirmed deployment when the clock is inside its window"
    roles: [LicensingAdmin]
    code: 200
    input: []
    output: Deployment
    side_effects: ["CONFIRMED -> ACTIVE"]
  - method: POST
    path: "/deployments/{id}/complete"
    description: "Complete an active deployment"
    roles: [LicensingAdmin]
    code: 200
    input: []
    output: Deployment
    side_effects: ["ACTIVE -> COMPLETED", "CatEvent.roster_filled_count -= 1"]
  - method: POST
    path: "/deployments/{id}/withdraw"
    description: "Withdraw a deployment (compensating roster release if it held a seat)"
    roles: [LicensingAdmin]
    code: 200
    input: []
    output: Deployment
    side_effects: ["-> WITHDRAWN", "If prior status IN {CONFIRMED,ACTIVE}: CatEvent.roster_filled_count -= 1"]

  # ---------- Claim ----------
  - method: POST
    path: "/claims"
    description: "Create a claim (INTAKE)"
    roles: [DeskExaminer]
    code: 201
    input: [claim_number, policyholder_name, loss_state, peril_type, policy_type, "cat_event_id?"]
    output: Claim
    side_effects: ["rcv_cents=0, reserve_consumed_cents=0, status=INTAKE"]
  - method: GET
    path: "/claims"
    description: "List claims; filter by cat event (FK reverse-reachability)"
    roles: [DeskExaminer, LicensingAdmin, BillingManager, FieldAdjuster, QAReviewer]
    code: 200
    input: ["cat_event_id?", "status?", "loss_state?", "limit?", "offset?"]
    output: "Claim[]"
    side_effects: []
  - method: GET
    path: "/claims/{id}"
    description: "Get a claim (includes computed rcv_cents and reserve_consumed_cents)"
    roles: [DeskExaminer, LicensingAdmin, BillingManager, FieldAdjuster, QAReviewer]
    code: 200
    input: []
    output: Claim
    side_effects: []
  - method: POST
    path: "/claims/{id}/reopen"
    description: "Reopen a CLOSED claim"
    roles: [DeskExaminer]
    code: 200
    input: []
    output: Claim
    side_effects: ["CLOSED -> REOPENED"]

  # ---------- Assignment ----------
  - method: POST
    path: "/assignments"
    description: "Offer an assignment (claim -> adjuster)"
    roles: [DeskExaminer]
    code: 201
    input: [claim_id, adjuster_id]
    output: Assignment
    side_effects: ["work_status=OFFERED, billing_status=NOT_BILLED", "If Claim.status==INTAKE: Claim -> ASSIGNED"]
  - method: GET
    path: "/assignments"
    description: "List assignments; filter by claim or adjuster (FK reverse-reachability)"
    roles: [DeskExaminer, LicensingAdmin, BillingManager, FieldAdjuster, QAReviewer]
    code: 200
    input: ["claim_id?", "adjuster_id?", "work_status?", "billing_status?", "limit?", "offset?"]
    output: "Assignment[]"
    side_effects: []
  - method: GET
    path: "/assignments/{id}"
    description: "Get an assignment (includes version for OCC)"
    roles: [DeskExaminer, LicensingAdmin, BillingManager, FieldAdjuster, QAReviewer]
    code: 200
    input: []
    output: Assignment
    side_effects: []
  - method: POST
    path: "/assignments/{id}/accept"
    description: "Adjuster accepts an offered assignment (license gate)"
    roles: [FieldAdjuster]
    code: 200
    input: []
    output: Assignment
    side_effects: ["OFFERED -> ACCEPTED", "Claim ASSIGNED|REOPENED -> IN_PROGRESS"]
  - method: POST
    path: "/assignments/{id}/decline"
    description: "Adjuster declines an offered assignment"
    roles: [FieldAdjuster]
    code: 200
    input: []
    output: Assignment
    side_effects: ["OFFERED -> DECLINED"]

  # ---------- Inspection ----------
  - method: POST
    path: "/inspections"
    description: "Schedule an inspection for an assignment (property spacing check)"
    roles: [FieldAdjuster]
    code: 201
    input: [assignment_id, claim_id, scheduled_start, scheduled_end]
    output: Inspection
    side_effects: ["status=SCHEDULED"]
  - method: GET
    path: "/inspections"
    description: "List inspections; filter by assignment or claim (FK reverse-reachability)"
    roles: [DeskExaminer, LicensingAdmin, BillingManager, FieldAdjuster, QAReviewer]
    code: 200
    input: ["assignment_id?", "claim_id?", "status?", "limit?", "offset?"]
    output: "Inspection[]"
    side_effects: []
  - method: GET
    path: "/inspections/{id}"
    description: "Get an inspection"
    roles: [DeskExaminer, LicensingAdmin, BillingManager, FieldAdjuster, QAReviewer]
    code: 200
    input: []
    output: Inspection
    side_effects: []
  - method: POST
    path: "/inspections/{id}/start"
    description: "Start (or restart after reopen) an inspection"
    roles: [FieldAdjuster]
    code: 200
    input: []
    output: Inspection
    side_effects: ["SCHEDULED|REOPENED -> IN_PROGRESS", "On SCHEDULED->IN_PROGRESS: parent Assignment ACCEPTED -> FIELDWORK"]
  - method: POST
    path: "/inspections/{id}/complete"
    description: "Complete an in-progress inspection"
    roles: [FieldAdjuster]
    code: 200
    input: []
    output: Inspection
    side_effects: ["IN_PROGRESS -> COMPLETED"]

  # ---------- Estimate ----------
  - method: POST
    path: "/estimates"
    description: "Create a Xactimate-style estimate (DRAFT) with line items"
    roles: [FieldAdjuster]
    code: 201
    input: [inspection_id, claim_id, line_items]
    output: Estimate
    side_effects: ["Compute rcv_total_cents, acv_total_cents, recoverable_depreciation_cents, net_payable_cents"]
  - method: GET
    path: "/estimates"
    description: "List estimates; filter by inspection or claim (FK reverse-reachability)"
    roles: [DeskExaminer, LicensingAdmin, BillingManager, FieldAdjuster, QAReviewer]
    code: 200
    input: ["inspection_id?", "claim_id?", "status?", "limit?", "offset?"]
    output: "Estimate[]"
    side_effects: []
  - method: GET
    path: "/estimates/{id}"
    description: "Get an estimate (computed RCV/ACV fields)"
    roles: [DeskExaminer, LicensingAdmin, BillingManager, FieldAdjuster, QAReviewer]
    code: 200
    input: []
    output: Estimate
    side_effects: []
  - method: POST
    path: "/estimates/{id}/approve"
    description: "Approve a DRAFT estimate (sets Claim.rcv_cents)"
    roles: [FieldAdjuster]
    code: 200
    input: []
    output: Estimate
    side_effects: ["DRAFT -> APPROVED", "Claim.rcv_cents := rcv_total_cents"]

  # ---------- Report ----------
  - method: POST
    path: "/reports"
    description: "Create a scope/photo report (DRAFT)"
    roles: [FieldAdjuster]
    code: 201
    input: [inspection_id, assignment_id, scope_narrative, "photo_count?"]
    output: Report
    side_effects: ["status=DRAFT, revision_count=0"]
  - method: GET
    path: "/reports"
    description: "List reports; filter by inspection or assignment (FK reverse-reachability)"
    roles: [DeskExaminer, LicensingAdmin, BillingManager, FieldAdjuster, QAReviewer]
    code: 200
    input: ["inspection_id?", "assignment_id?", "status?", "limit?", "offset?"]
    output: "Report[]"
    side_effects: []
  - method: GET
    path: "/reports/{id}"
    description: "Get a report (includes qa_reviewer_id, qa_decision, revision_count)"
    roles: [DeskExaminer, LicensingAdmin, BillingManager, FieldAdjuster, QAReviewer]
    code: 200
    input: []
    output: Report
    side_effects: []
  - method: POST
    path: "/reports/{id}/submit"
    description: "Submit (or resubmit) a report for QA"
    roles: [FieldAdjuster]
    code: 200
    input: []
    output: Report
    side_effects: ["DRAFT|REVISION_REQUESTED -> SUBMITTED", "Assignment FIELDWORK -> WORK_COMPLETE", "Claim IN_PROGRESS -> UNDER_REVIEW"]
  - method: POST
    path: "/reports/{id}/qa-decision"
    description: "QA reviewer approves or requests revision (SoD enforced)"
    roles: [QAReviewer]
    code: 200
    input: [decision, "qa_notes?"]
    output: Report
    side_effects: ["APPROVED: Claim -> SETTLED", "REVISION_REQUESTED cascade: Inspection -> REOPENED -> Assignment -> FIELDWORK -> Claim -> IN_PROGRESS"]

  # ---------- TimeEntry ----------
  - method: POST
    path: "/time-entries"
    description: "Log a time/expense entry against an assignment"
    roles: [FieldAdjuster]
    code: 201
    input: [assignment_id, work_date, activity, hours, "expense_cents?"]
    output: TimeEntry
    side_effects: []
  - method: GET
    path: "/time-entries"
    description: "List time entries; filter by assignment (FK reverse-reachability)"
    roles: [DeskExaminer, LicensingAdmin, BillingManager, FieldAdjuster, QAReviewer]
    code: 200
    input: ["assignment_id?", "activity?", "limit?", "offset?"]
    output: "TimeEntry[]"
    side_effects: []
  - method: GET
    path: "/time-entries/{id}"
    description: "Get a time entry"
    roles: [DeskExaminer, LicensingAdmin, BillingManager, FieldAdjuster, QAReviewer]
    code: 200
    input: []
    output: TimeEntry
    side_effects: []

  # ---------- FeeSchedule ----------
  - method: POST
    path: "/fee-schedules"
    description: "Create a fee schedule (rate card)"
    roles: [BillingManager]
    code: 201
    input: [name, tier1_max_rcv_cents, tier2_max_rcv_cents, tier1_flat_fee_cents, tier2_flat_fee_cents, tier3_flat_fee_cents, rcv_pct_bps, pct_cap_cents, hourly_rate_cents, cat_peril_multiplier_bps]
    output: FeeSchedule
    side_effects: []
  - method: GET
    path: "/fee-schedules"
    description: "List fee schedules"
    roles: [DeskExaminer, LicensingAdmin, BillingManager, FieldAdjuster, QAReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: "FeeSchedule[]"
    side_effects: []
  - method: GET
    path: "/fee-schedules/{id}"
    description: "Get a fee schedule"
    roles: [DeskExaminer, LicensingAdmin, BillingManager, FieldAdjuster, QAReviewer]
    code: 200
    input: []
    output: FeeSchedule
    side_effects: []

  # ---------- FeeBill ----------
  - method: POST
    path: "/fee-bills"
    description: "Create a fee bill (DRAFT); supersedes any prior non-PAID bill for the assignment; OCC on Assignment.version"
    roles: [FieldAdjuster]
    code: 201
    input: [assignment_id, claim_id, fee_schedule_id, billing_method, expected_assignment_version]
    output: FeeBill
    side_effects: ["Compute subtotal_cents/total_cents", "Void any prior non-PAID FeeBill for the assignment", "increments Assignment.version by 1"]
  - method: GET
    path: "/fee-bills"
    description: "List fee bills; filter by assignment, claim, or fee schedule (FK reverse-reachability)"
    roles: [DeskExaminer, LicensingAdmin, BillingManager, FieldAdjuster, QAReviewer]
    code: 200
    input: ["assignment_id?", "claim_id?", "fee_schedule_id?", "status?", "limit?", "offset?"]
    output: "FeeBill[]"
    side_effects: []
  - method: GET
    path: "/fee-bills/{id}"
    description: "Get a fee bill (computed subtotal/total)"
    roles: [DeskExaminer, LicensingAdmin, BillingManager, FieldAdjuster, QAReviewer]
    code: 200
    input: []
    output: FeeBill
    side_effects: []
  - method: POST
    path: "/fee-bills/{id}/submit"
    description: "Submit a DRAFT fee bill (debits claim reserve)"
    roles: [FieldAdjuster]
    code: 200
    input: []
    output: FeeBill
    side_effects: ["DRAFT -> SUBMITTED", "Assignment NOT_BILLED -> BILLED", "Claim.reserve_consumed_cents += total_cents"]
  - method: POST
    path: "/fee-bills/{id}/approve"
    description: "Approve a submitted fee bill"
    roles: [BillingManager]
    code: 200
    input: []
    output: FeeBill
    side_effects: ["SUBMITTED -> APPROVED"]
  - method: POST
    path: "/fee-bills/{id}/reject"
    description: "Reject a submitted fee bill (compensating reserve credit)"
    roles: [BillingManager]
    code: 200
    input: []
    output: FeeBill
    side_effects: ["SUBMITTED -> REJECTED", "Assignment BILLED -> NOT_BILLED", "Claim.reserve_consumed_cents -= total_cents"]
  - method: POST
    path: "/fee-bills/{id}/void"
    description: "Void a fee bill (compensating reserve credit if it had debited)"
    roles: [BillingManager]
    code: 200
    input: []
    output: FeeBill
    side_effects: ["DRAFT|SUBMITTED|APPROVED -> VOID", "If it had debited: Assignment -> NOT_BILLED, Claim.reserve_consumed_cents -= total_cents"]
  - method: POST
    path: "/fee-bills/{id}/pay"
    description: "Pay an approved fee bill (creates Payment; cascades to claim close)"
    roles: [BillingManager]
    code: 200
    input: [method]
    output: FeeBill
    side_effects: ["APPROVED -> PAID", "Create Payment", "Assignment BILLED -> PAID", "Cascade: Claim SETTLED -> CLOSED when all assignments PAID"]

  # ---------- Payment ----------
  - method: GET
    path: "/payments"
    description: "List payments; filter by fee bill (FK reverse-reachability)"
    roles: [DeskExaminer, LicensingAdmin, BillingManager, FieldAdjuster, QAReviewer]
    code: 200
    input: ["fee_bill_id?", "limit?", "offset?"]
    output: "Payment[]"
    side_effects: []
  - method: GET
    path: "/payments/{id}"
    description: "Get a payment"
    roles: [DeskExaminer, LicensingAdmin, BillingManager, FieldAdjuster, QAReviewer]
    code: 200
    input: []
    output: Payment
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth / authz ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role unknown" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_ASSIGNMENT_OWNER, http: 403, condition: "Acting adjuster's X-User-ID does not match the assignment's adjuster_id" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "QA reviewer is the authoring adjuster of the report" }
  # --- Not found ---
  - { id: ERR_ADJUSTER_NOT_FOUND, http: 404, condition: "Adjuster id does not exist" }
  - { id: ERR_LICENSE_NOT_FOUND, http: 404, condition: "License id does not exist" }
  - { id: ERR_CAT_EVENT_NOT_FOUND, http: 404, condition: "Cat event id does not exist" }
  - { id: ERR_DEPLOYMENT_NOT_FOUND, http: 404, condition: "Deployment id does not exist" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "Claim id does not exist" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "Assignment id does not exist" }
  - { id: ERR_INSPECTION_NOT_FOUND, http: 404, condition: "Inspection id does not exist" }
  - { id: ERR_ESTIMATE_NOT_FOUND, http: 404, condition: "Estimate id does not exist" }
  - { id: ERR_REPORT_NOT_FOUND, http: 404, condition: "Report id does not exist" }
  - { id: ERR_TIME_ENTRY_NOT_FOUND, http: 404, condition: "Time entry id does not exist" }
  - { id: ERR_FEE_SCHEDULE_NOT_FOUND, http: 404, condition: "Fee schedule id does not exist" }
  - { id: ERR_FEE_BILL_NOT_FOUND, http: 404, condition: "Fee bill id does not exist" }
  - { id: ERR_PAYMENT_NOT_FOUND, http: 404, condition: "Payment id does not exist" }
  # --- Input validation ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, type mismatch, invalid enum, start>=end, hours<=0, bad line item" }
  # --- Concurrency ---
  - { id: ERR_STALE_ASSIGNMENT_VERSION, http: 412, condition: "expected_assignment_version does not match current Assignment.version" }
  # --- License state ---
  - { id: ERR_LICENSE_NOT_PENDING, http: 409, condition: "License must be PENDING to activate" }
  - { id: ERR_LICENSE_NOT_ACTIVE, http: 409, condition: "License must be ACTIVE to suspend" }
  - { id: ERR_LICENSE_NOT_SUSPENDED, http: 409, condition: "License must be SUSPENDED to reinstate" }
  - { id: ERR_LICENSE_EXPIRED, http: 409, condition: "current_clock >= expires_at at activation/reinstatement" }
  - { id: ERR_NO_ACTIVE_LICENSE, http: 422, condition: "Adjuster lacks an ACTIVE non-expired license in the claim's loss_state" }
  # --- Cat event / deployment ---
  - { id: ERR_CAT_EVENT_NOT_OPEN, http: 409, condition: "Cat event must be OPEN" }
  - { id: ERR_ROSTER_NOT_EMPTY, http: 409, condition: "Cannot close cat event with CONFIRMED/ACTIVE deployments" }
  - { id: ERR_DEPLOYMENT_NOT_REQUESTED, http: 409, condition: "Deployment must be REQUESTED to confirm" }
  - { id: ERR_DEPLOYMENT_NOT_CONFIRMED, http: 409, condition: "Deployment must be CONFIRMED to activate" }
  - { id: ERR_DEPLOYMENT_NOT_ACTIVE, http: 409, condition: "Deployment must be ACTIVE to complete" }
  - { id: ERR_DEPLOYMENT_NOT_WITHDRAWABLE, http: 409, condition: "Deployment must be REQUESTED/CONFIRMED/ACTIVE to withdraw" }
  - { id: ERR_DEPLOYMENT_WINDOW_NOT_OPEN, http: 409, condition: "Clock is outside [start_at, end_at) at activation" }
  - { id: ERR_DEPLOYMENT_WINDOW_OVERLAP, http: 409, condition: "Deployment window overlaps another CONFIRMED/ACTIVE deployment for the same adjuster" }
  - { id: ERR_ROSTER_CAPACITY_EXCEEDED, http: 409, condition: "roster_filled_count would exceed roster_capacity" }
  # --- Inspection ---
  - { id: ERR_INSPECTION_SPACING_CONFLICT, http: 409, condition: "Inspection window within INSPECTION_MIN_GAP_MINUTES of another inspection on the same claim" }
  - { id: ERR_INSPECTION_NOT_SCHEDULED, http: 409, condition: "Inspection must be SCHEDULED or REOPENED to start" }
  - { id: ERR_INSPECTION_NOT_IN_PROGRESS, http: 409, condition: "Inspection must be IN_PROGRESS to complete" }
  - { id: ERR_INSPECTION_NOT_COMPLETED, http: 409, condition: "Parent inspection must be COMPLETED" }
  # --- Assignment ---
  - { id: ERR_ASSIGNMENT_NOT_OFFERED, http: 409, condition: "Assignment must be OFFERED to accept/decline" }
  - { id: ERR_ASSIGNMENT_NOT_ACCEPTED, http: 409, condition: "Assignment must be ACCEPTED to start inspection" }
  - { id: ERR_ASSIGNMENT_NOT_WORK_COMPLETE, http: 409, condition: "Assignment must be WORK_COMPLETE to submit a fee bill" }
  # --- Estimate / Report ---
  - { id: ERR_ESTIMATE_NOT_DRAFT, http: 409, condition: "Estimate must be DRAFT to approve" }
  - { id: ERR_ESTIMATE_NOT_APPROVED, http: 409, condition: "An APPROVED estimate is required to submit the report" }
  - { id: ERR_REPORT_NOT_SUBMITTABLE, http: 409, condition: "Report must be DRAFT or REVISION_REQUESTED to submit" }
  - { id: ERR_REPORT_NOT_IN_REVIEW, http: 409, condition: "Report must be SUBMITTED for a QA decision" }
  - { id: ERR_REPORT_NO_PHOTOS, http: 422, condition: "photo_count must be >= 1 to submit a report" }
  - { id: ERR_INVALID_DECISION, http: 400, condition: "QA decision must be APPROVED or REVISION_REQUESTED" }
  # --- Fee bill ---
  - { id: ERR_NO_TIME_ENTRIES, http: 422, condition: "TIME_AND_EXPENSE fee bill created for an assignment with zero time entries" }
  - { id: ERR_FEE_BILL_NOT_DRAFT, http: 409, condition: "Fee bill must be DRAFT to submit" }
  - { id: ERR_FEE_BILL_NOT_SUBMITTED, http: 409, condition: "Fee bill must be SUBMITTED to approve/reject" }
  - { id: ERR_FEE_BILL_NOT_APPROVED, http: 409, condition: "Fee bill must be APPROVED to pay" }
  - { id: ERR_FEE_BILL_NOT_VOIDABLE, http: 409, condition: "Fee bill must be DRAFT/SUBMITTED/APPROVED to void" }
  # --- Claim ---
  - { id: ERR_CLAIM_NOT_CLOSED, http: 409, condition: "Claim must be CLOSED to reopen" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: DeskExaminer
    description: "Carrier desk examiner: opens claims and offers assignments; reopens claims."
    identity: opaque
    exclusive_operations:
      - "POST /claims"
      - "POST /claims/{id}/reopen"
      - "POST /assignments"
    shared_operations:
      - "POST /_clock/set_current_utc (shared with LicensingAdmin, BillingManager)"
      - "GET * (all read endpoints)"

  - name: FieldAdjuster
    description: "Independent/CAT adjuster doing the fieldwork; acts only on assignments where X-User-ID == assignment.adjuster_id."
    identity: "entity_backed:Adjuster"
    exclusive_operations:
      - "POST /assignments/{id}/accept"
      - "POST /assignments/{id}/decline"
      - "POST /inspections"
      - "POST /inspections/{id}/start"
      - "POST /inspections/{id}/complete"
      - "POST /estimates"
      - "POST /estimates/{id}/approve"
      - "POST /reports"
      - "POST /reports/{id}/submit"
      - "POST /time-entries"
      - "POST /fee-bills"
      - "POST /fee-bills/{id}/submit"
    shared_operations:
      - "GET * (all read endpoints)"

  - name: QAReviewer
    description: "Senior adjuster performing QA/re-inspection review; must differ from the report's author (SoD)."
    identity: "entity_backed:Adjuster"
    exclusive_operations:
      - "POST /reports/{id}/qa-decision"
    shared_operations:
      - "GET * (all read endpoints)"

  - name: LicensingAdmin
    description: "Manages adjuster records, multi-state licenses, cat events, and the deployment roster."
    identity: opaque
    exclusive_operations:
      - "POST /adjusters"
      - "POST /licenses"
      - "POST /licenses/{id}/activate"
      - "POST /licenses/{id}/suspend"
      - "POST /licenses/{id}/reinstate"
      - "POST /cat-events"
      - "POST /cat-events/{id}/close"
      - "POST /deployments"
      - "POST /deployments/{id}/confirm"
      - "POST /deployments/{id}/activate"
      - "POST /deployments/{id}/complete"
      - "POST /deployments/{id}/withdraw"
    shared_operations:
      - "POST /_clock/set_current_utc (shared with DeskExaminer, BillingManager)"
      - "GET * (all read endpoints)"

  - name: BillingManager
    description: "Manages fee schedules and the fee-bill approval/payment lifecycle."
    identity: opaque
    exclusive_operations:
      - "POST /fee-schedules"
      - "POST /fee-bills/{id}/approve"
      - "POST /fee-bills/{id}/reject"
      - "POST /fee-bills/{id}/void"
      - "POST /fee-bills/{id}/pay"
    shared_operations:
      - "POST /_clock/set_current_utc (shared with DeskExaminer, LicensingAdmin)"
      - "GET * (all read endpoints)"
