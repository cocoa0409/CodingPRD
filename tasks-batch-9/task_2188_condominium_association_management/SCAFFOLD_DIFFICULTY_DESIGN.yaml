      - name: hearing_docket_half_open_30min_slots_touch_allowed_and_last_legal_slot_is_2030
        grounds:
          - validations[priority=30]  # ERR_HEARING_SLOT_TAKEN
          - validations[priority=54]  # ERR_SLOT_OUTSIDE_MEETING
          - validations[priority=31]  # ERR_HEARING_DOCKET_FULL
          - endpoints[POST /violation-cases/{id}/schedule-hearing]
          - state_machines.ViolationCase.NOTICE_SENT_to_HEARING_SCHEDULED
        distinguishing_aspect: |
          A DIFFERENT resource (BoardMeeting docket) under DIFFERENT interval semantics from the
          element-outage instance: HALF-OPEN 30-minute slots with NO buffer, so back-to-back
          slots that merely TOUCH are ALLOWED — the exact opposite verdict from the closed-plus-
          buffer element rule for the same touching geometry. Against an incumbent slot
