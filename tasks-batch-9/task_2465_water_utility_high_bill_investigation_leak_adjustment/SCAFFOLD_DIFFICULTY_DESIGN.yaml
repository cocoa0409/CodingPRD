            - "BoardAppeal.${appeal_id}.status == REMANDED and BoardAppeal.${appeal_id}.decision == REMAND"
            - "BoardAppeal.${appeal_id}.hearing_officer_user_id == clerk-1"
            - "HighBillInvestigation.${inv_id}.status == EVIDENCE_REQUESTED — the third visit, reached from APPEALED"
            - "HighBillInvestigation.${inv_id}.remand_count == 1"
            - "HighBillInvestigation.${inv_id}.evidence_round_count == 3"
            - "The final request-evidence returns 422 with error_id ERR_EVIDENCE_ROUND_LIMIT"
            - "HighBillInvestigation.${inv_id}.evidence_round_count is still 3 and status is still EVIDENCE_REQUESTED after the refusal"
            - "HighBillInvestigation.${inv_id}.leak_determination == CUSTOMER_SIDE_LEAK is retained across the remand back-edge"

      # -------- PARALLEL: two independent dimensions on one row --------
      - name: non_linear_parallel_service_and_credit_dimensions_move_independently
        grounds:
          - state_machines.ServiceAccount
          - calculations.account_credit_status
          - entities.ServiceAccount.fields.service_status
          - entities.ServiceAccount.fields.credit_status
          - entities.ServiceAccount.fields.shutoff_scheduled_for
          - entities.ServiceAccount.fields.open_investigation_hold_count
          - endpoints[POST /service-accounts/{id}/payments]
        distinguishing_aspect: |
          PARALLEL shape: service_status and credit_status advance on one ServiceAccount row
          without being locked together, and the test walks all three combinations. Opening an
          investigation moves service_status SHUTOFF_SCHEDULED to SHUTOFF_HELD while leaving
          credit_status at PAST_DUE and preserving shutoff_scheduled_for. A 25000-cent payment
          moves NEITHER dimension (balance 5887 is still above the 5000 threshold). A further
          887-cent payment moves BOTH (credit_status to CURRENT, which then drives service_status
          to ACTIVE and nulls shutoff_scheduled_for) while the investigation hold count stays 1.
        test_recipe:
          setup:
            - "RS-STD-2026, the four SUMMER periods, and ServiceAccount ACC-1002 with a 1.0 inch master (initial_register_value 100000) exist."
            - "Reads 100000 / 104000 / 108000 / 112000 and 124000 on 2026-07-31 give consumptions 4000, 4000, 4000 and 12000 gallons."
            - "All four bills are ISSUED: 5210 + 5210 + 5210 + 15257 = 30887 cents of receivable, so credit_status is PAST_DUE."
            - "The clock is 2026-08-01T00:00:00Z, so a shutoff scheduled now falls due 2026-08-11."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /rate-schedules"
              payload: { code: "RS-STD-2026", base_charge_cents: 1200, tier1_limit_gallons: 3000, tier1_rate_cents_per_kgal: 350, tier2_limit_gallons: 10000, tier2_rate_cents_per_kgal: 520, tier3_rate_cents_per_kgal: 890, summer_surcharge_bp: 1500, sewer_rate_cents_per_kgal: 610, sewer_cap_gallons: 12000, submeter_sewer_credit_cap_gallons: 8000, admin_fee_cents: 1500, admin_fee_waiver_threshold_cents: 10000 }
              as: SystemAdmin
              captures: { rs_id: $.data.id }
            - call: "POST /billing-periods"
              payload: { period_code: "2025-06", start_date: "2025-06-01", end_date: "2025-06-30", season: "SUMMER", rebilling_deadline_date: "2026-12-31" }
              as: SystemAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /billing-periods"
              payload: { period_code: "2025-07", start_date: "2025-07-01", end_date: "2025-07-31", season: "SUMMER", rebilling_deadline_date: "2026-12-31" }
              as: SystemAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /billing-periods"
              payload: { period_code: "2025-08", start_date: "2025-08-01", end_date: "2025-08-31", season: "SUMMER", rebilling_deadline_date: "2026-12-31" }
              as: SystemAdmin
              captures: { p3_id: $.data.id }
            - call: "POST /billing-periods"
              payload: { period_code: "2026-07", start_date: "2026-07-01", end_date: "2026-07-31", season: "SUMMER", rebilling_deadline_date: "2027-01-31" }
              as: SystemAdmin
              captures: { p4_id: $.data.id }
            - call: "POST /service-accounts"
              payload: { account_number: "ACC-1002", customer_name: "Bern Okafor", service_address: "44 Birch Rd", rate_schedule_id: "${rs_id}" }
              as: CustomerServiceRep
              captures: { acct_b_id: $.data.id }
            - call: "POST /meters"
              payload: { account_id: "${acct_b_id}", meter_serial: "MTR-B-1", meter_type: "POTABLE_MASTER", size_inches: 1.0, initial_register_value: 100000 }
              as: MeterTechnician
