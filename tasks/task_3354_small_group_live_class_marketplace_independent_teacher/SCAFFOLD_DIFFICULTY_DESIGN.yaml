              captures: { s_2_status: $.data.status }
            - call: "POST /outschool/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-10T15:00:00Z" }
              as: PlatformAdmin
            - call: "POST /outschool/_ops/run"
              payload: {}
              as: PlatformAdmin
