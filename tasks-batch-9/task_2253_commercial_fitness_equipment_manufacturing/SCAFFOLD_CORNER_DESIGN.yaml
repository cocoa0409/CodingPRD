- section: complexity_layers
  instances:
  - name: revision_create_rejects_a_stale_equipment_model_version
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[revision-create-against-stale-model]
    - validations[priority=10]
    - errors[ERR_STALE_VERSION]
    - endpoints[POST /model-revisions]
    distinguishing_aspect: The version captured when the model was created goes stale the moment the FIRST revision is added (the create increments EquipmentModel.version), so replaying that captured value
      on a second revision create returns 412 ERR_STALE_VERSION and writes nothing; re-reading the model and resubmitting the identical body succeeds.
    test_recipe:
      setup:
      - Model T900 Treadmill was created and its version was captured from the create response.
      - One revision T900-R1 was then created using that captured version, which incremented EquipmentModel.version.
      setup_api_calls:
      - call: POST /equipment-models
        payload: {name: T900 Treadmill, category: CARDIO, duty_class: FULL_COMMERCIAL, unit_list_price_cents: 479950, shipping_weight_kg: 212.5, allowed_finish_codes: [GRAPHITE]}
        as: ProductEngineer
        captures: {m1: $.data.id, m1_v: $.data.version}
      - call: POST /model-revisions
        payload: {equipment_model_id: '${m1}', revision_code: T900-R1, target_cycle_count: 600000, expected_equipment_model_version: '${m1_v}'}
        as: ProductEngineer
        captures: {r1: $.data.id}
      trigger:
      - call: GET /equipment-models/${m1}
        payload: {}
        as: ProductEngineer
      - call: POST /model-revisions
        payload: {equipment_model_id: '${m1}', revision_code: T900-R2, target_cycle_count: 650000, expected_equipment_model_version: '${m1_v}'}
        as: ProductEngineer
        captures: {err_stale: $.data.error_id}
      - call: GET /model-revisions
        payload: {equipment_model_id: '${m1}'}
        as: ProductEngineer
      - call: GET /equipment-models/${m1}
        payload: {}
        as: ProductEngineer
        captures: {m1_v2: $.data.version}
      - call: POST /model-revisions
        payload: {equipment_model_id: '${m1}', revision_code: T900-R2, target_cycle_count: 650000, expected_equipment_model_version: '${m1_v2}'}
        as: ProductEngineer
        captures: {r2: $.data.id}
      - call: GET /equipment-models/${m1}
        payload: {}
        as: ProductEngineer
      - call: GET /model-revisions
        payload: {equipment_model_id: '${m1}'}
        as: ProductEngineer
      assert:
      - after the first revision create EquipmentModel.${m1}.version is exactly 1 greater than the value captured at creation
      - replaying the captured (now stale) version returns 412 with error_id ERR_STALE_VERSION
      - immediately after the 412, GET /model-revisions?equipment_model_id=${m1} still returns total_count == 1 — nothing was written
      - the identical body sent with the freshly read version returns 201 with ModelRevision.${r2}.status == DRAFT and min_required_cycles == 500000
      - the successful create increments EquipmentModel.${m1}.version by exactly 1 again (two increments in total)
      - 'GET /model-revisions?equipment_model_id=${m1} then returns total_count == 2 ordered created_at ASC: T900-R1 then T900-R2'
  - name: requote_rejects_a_version_that_a_line_addition_invalidated
