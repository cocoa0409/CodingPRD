      - name: corner_inconclusive_inspection_blocks_resolve_until_reinspection
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.ServiceRequest.ASSIGNED_to_INSPECTED
          - state_machines.ServiceRequest.INSPECTED_to_INSPECTED
          - errors[ERR_REQUEST_NOT_VERIFIED]
        distinguishing_aspect: "An INSPECT that omits verification_status advances handling_status to INSPECTED while leaving the verification axis UNVERIFIED, so RESOLVE returns ERR_REQUEST_NOT_VERIFIED until the INSPECTED self-loop supplies FIELD_CONFIRMED."
        test_recipe:
          setup:
            - "One ServiceRequest triaged PRIORITY and ASSIGNED to an ACTIVE applicator."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
