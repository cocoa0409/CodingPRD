              payload: {  }
              as: MountainOpsDirector
              captures: { err: $.data.error_id }
            - call: "GET /mountain-ops/access-reservations/00000000-0000-0000-0000-0000000000ff"
              payload: {  }
              as: GuestServicesAgent
              captures: { err: $.data.error_id }
