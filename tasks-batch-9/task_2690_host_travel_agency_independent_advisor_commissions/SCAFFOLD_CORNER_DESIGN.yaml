              captures: { err_peer_receipt: $.data.error_id }
          assert:
            - "PEER CONFIRM: HTTP 403 and err_peer_confirm == ERR_OWNERSHIP_VIOLATION, not ERR_UNAUTHORIZED — the role is right, the row is not theirs"
            - "SHARED READ: peer_read_status == SUBMITTED, so the peer may still read the booking it cannot act on"
            - "OWNER CONFIRM: owner_confirm_status == CONFIRMED and commission_status == EXPECTED"
            - "PEER RECEIPT: HTTP 403 and err_peer_receipt == ERR_OWNERSHIP_VIOLATION; Booking.${bk_id}.received_commission_cents is still 0"
            - "Supplier.${sup_2_id}.total_outstanding_cents == 0 — no receivable was ever attributed to the peer"
            - "Supplier.${sup_1_id}.total_outstanding_cents == 0 as well, because the aging cohort only admits a booking once due_date = travel_end_date + remit_terms_days (2026-11-09) is reached"

      - name: corner_segregation_of_duties_holds_even_for_an_empty_run
        claim_type: segregation_of_duties
        grounds:
          - complexity_profile.role_model
          - validations[priority=45]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: "The two-user control is unconditional: on a run with statement_count == 0, where no money moves at all, the calculating X-User-ID is still refused at post with 409 ERR_SEGREGATION_OF_DUTIES and a second HostController user must complete it — and the identity that matters is X-User-ID, not the role."
        test_recipe:
          setup:
            - "One settlement run for 2026-08 with no advisors and no bookings, so calculate produces zero statements."
          setup_api_calls:
            - call: "POST /host-agency/settlement-runs"
              payload: { period_month: "2026-08" }
              as: HostOperations
              captures: { run_id: $.data.id }
            - call: "POST /host-agency/settlement-runs/${run_id}/calculate"
              payload: {}
              as: HostController
              as_user_id: "ctrl-1"
              captures: { calc_status: $.data.status, calc_by: $.data.calculated_by_user_id }
          trigger:
            - call: "POST /host-agency/settlement-runs/${run_id}/post"
              payload: {}
              as: HostController
              as_user_id: "ctrl-1"
              captures: { err_sod: $.data.error_id }
            - call: "POST /host-agency/settlement-runs/${run_id}/post"
              payload: {}
              as: HostController
              as_user_id: "ctrl-2"
              captures: { post_status: $.data.status, post_by: $.data.posted_by_user_id }
          assert:
            - "CALCULATED: calc_status == CALCULATED, calc_by == \"ctrl-1\" and statement_count == 0"
            - "SAME USER POSTS: HTTP 409 and err_sod == ERR_SEGREGATION_OF_DUTIES; status is still CALCULATED and posted_by_user_id is still null"
            - "SECOND USER POSTS: post_by == \"ctrl-2\" and post_status == CLOSED, since an empty run skips POSTED"
            - "the control is on X-User-ID alone: both calls carried role HostController"

  # ==========================================================================
  # 8. CROSS-CUTTING COMPLEXITY LAYERS
  # complexity_layers: [dual_variant_calculation, cascading_side_effects,
  #                     rate_threshold_triggers, optimistic_concurrency,
  #                     derived_field_reconciliation]
  # ==========================================================================
  - section: cross-cutting complexity layers
    instances:
      - name: corner_stale_advisor_version_is_rejected_on_agreement_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[agreement-create-stale-advisor]
          - errors[ERR_ADVISOR_VERSION_STALE]
          - validations[priority=35]
          - endpoints["POST /host-agency/advisors/{id}/agreements"]
        distinguishing_aspect: "The first §1.2.1 rule: two agreements prepared against the same advisor baseline cannot both land. The version read before the first signature is stale afterwards, so replaying it returns 412 ERR_ADVISOR_VERSION_STALE, nothing is superseded, and re-reading the advisor makes the identical call succeed."
        test_recipe:
          setup:
            - "Three split schedules and one DRAFT advisor whose version is captured before any agreement exists."
          setup_api_calls:
            - call: "POST /host-agency/split-schedules"
              payload: { name: "Standard 2026", tiers: [{ tier_level: 1, min_production_cents: 0, advisor_pct: 0.70 }, { tier_level: 2, min_production_cents: 5000000, advisor_pct: 0.80 }], platform_fee_tiers: [{ min_share_cents: 0, fee_pct: 0.05 }], chargeback_retention_pct: 0.10 }
              as: HostOperations
              captures: { sched_a_id: $.data.id }
            - call: "POST /host-agency/split-schedules"
              payload: { name: "Elite 2026", tiers: [{ tier_level: 1, min_production_cents: 0, advisor_pct: 0.75 }, { tier_level: 2, min_production_cents: 4000000, advisor_pct: 0.85 }], platform_fee_tiers: [{ min_share_cents: 0, fee_pct: 0.04 }] }
              as: HostOperations
              captures: { sched_b_id: $.data.id }
            - call: "POST /host-agency/split-schedules"
              payload: { name: "Legacy 2025", tiers: [{ tier_level: 1, min_production_cents: 0, advisor_pct: 0.65 }], platform_fee_tiers: [{ min_share_cents: 0, fee_pct: 0.06 }] }
              as: HostOperations
              captures: { sched_c_id: $.data.id }
            - call: "POST /host-agency/advisors"
              payload: { legal_name: "Dana Reyes", email: "dana.reyes@example.com", seller_of_travel_state: "NY" }
              as: HostOperations
              captures: { adv_id: $.data.id, adv_v0: $.data.version }
          trigger:
            - call: "POST /host-agency/advisors/${adv_id}/agreements"
              payload: { split_schedule_id: "${sched_a_id}", effective_date: "2026-01-01", post_departure_advisor_pct: 0.50, expected_advisor_version: "${adv_v0}" }
              as: HostOperations
              captures: { agr_a_id: $.data.id }
            - call: "POST /host-agency/advisors/${adv_id}/agreements"
              payload: { split_schedule_id: "${sched_b_id}", effective_date: "2026-02-01", post_departure_advisor_pct: 0.55, expected_advisor_version: "${adv_v0}" }
              as: HostOperations
              captures: { err_stale: $.data.error_id }
            - call: "GET /host-agency/advisors/${adv_id}"
              payload: {}
              as: HostOperations
              captures: { adv_v1: $.data.version }
            - call: "POST /host-agency/advisors/${adv_id}/agreements"
              payload: { split_schedule_id: "${sched_c_id}", effective_date: "2026-03-01", post_departure_advisor_pct: 0.45, expected_advisor_version: "${adv_v1}" }
              as: HostOperations
              captures: { agr_c_id: $.data.id }
          assert:
            - "FIRST WRITE: HTTP 201, AdvisorAgreement.${agr_a_id}.status == ACTIVE and the advisor's version moved from ${adv_v0} to ${adv_v0} + 1"
            - "REPLAYED BASELINE: HTTP 412 and err_stale == ERR_ADVISOR_VERSION_STALE"
            - "the rejected write is a no-op: no agreement exists for ${sched_b_id}, ${agr_a_id} is still ACTIVE, and adv_v1 == ${adv_v0} + 1 (the failed attempt did not bump the version)"
            - "FRESH BASELINE: HTTP 201 for ${agr_c_id}, which is ACTIVE while ${agr_a_id} is now SUPERSEDED"
            - "the advisor's version is ${adv_v0} + 2 after the third call: exactly one increment per successful write"
            - "GET /host-agency/advisor-agreements filtered by advisor_id returns 2 rows, never 3"

      - name: corner_stale_client_version_is_rejected_on_trust_line_append
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[trust-entry-create-stale-client]
          - errors[ERR_CLIENT_VERSION_STALE]
          - validations[priority=35]
          - endpoints["POST /host-agency/clients/{id}/trust-ledger-entries"]
        distinguishing_aspect: "The second §1.2.1 rule, on a different parent and a different occ_field: a disbursement prepared against a balance that has already moved is refused with 412 ERR_CLIENT_VERSION_STALE, so the running balance can never be computed from a stale read — and the immutable ledger gains no row from the refusal."
        test_recipe:
          setup:
            - "Priya Nair ACTIVE in CA with one owned client; the client's version is captured at creation."
          setup_api_calls:
            - call: "POST /host-agency/split-schedules"
              payload: { name: "Standard 2026", tiers: [{ tier_level: 1, min_production_cents: 0, advisor_pct: 0.70 }, { tier_level: 2, min_production_cents: 5000000, advisor_pct: 0.80 }], platform_fee_tiers: [{ min_share_cents: 0, fee_pct: 0.05 }], chargeback_retention_pct: 0.10 }
              as: HostOperations
              captures: { sched_id: $.data.id }
            - call: "POST /host-agency/advisors"
              payload: { legal_name: "Priya Nair", email: "priya.nair@example.com", seller_of_travel_state: "CA" }
              as: HostOperations
              captures: { adv_id: $.data.id, adv_v0: $.data.version }
            - call: "POST /host-agency/advisors/${adv_id}/agreements"
