  - rule_id: boundary_precision_check
    instances:
      - name: control_termination_at_exact_twenty_five_percent_notional
        grounds:
          - calculations.controlling_class_control_test
          - calculations.appraisal_reduction_amount
          - entities.Trust.fields.controlling_class_notional_usd
          - state_machines.Trust.CONTROLLING_to_CONSULTING_ONLY
          - endpoints[POST /special-servicing/appraisal-reductions/{id}/status]
        distinguishing_aspect: |
          Metric: controlling_class_notional_usd against the 25% threshold, on
          POST /appraisal-reductions/{id}/status. The comparison is inclusive (>=), so a notional of
          exactly 2,000,000.00 KEEPS control while 1,999,999.10 loses it. The one-cent gap is
          manufactured upstream: appraised values of 15,000,000 and 14,999,999 give reductions of
          6,000,000.00 and 6,000,000.90 through the 90% credit, so the boundary can only be hit if
          both the ARA rounding and the >= comparison are exact.
        test_recipe:
          setup:
            - "Two independent trusts, E and F, each with an 8,000,000.00 original controlling class balance, hence a control threshold of exactly 2,000,000.00."
            - "One loan per trust, each with current_principal_balance_usd 19,500,000.00, accrued_unpaid_interest_usd 0.00 and no advances, transferred to special servicing."
            - "Loan E carries an ACCEPTED UPDATE appraisal at 15,000,000; loan F carries an ACCEPTED UPDATE appraisal at 14,999,999."
            - "Both PROVISIONAL reductions are read back but not yet made effective."
            - "Logical clock at the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-E1", closing_date: "2026-01-15T00:00:00Z", original_controlling_class_balance_usd: 8000000 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { trust_e_id: "$.data.id" }
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-F1", closing_date: "2026-01-15T00:00:00Z", original_controlling_class_balance_usd: 8000000 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { trust_f_id: "$.data.id" }
            - call: "POST /special-servicing/loans"
              payload: { trust_id: "${trust_e_id}", loan_number: "L-E01", original_balance_usd: 20000000, current_principal_balance_usd: 19500000, accrued_unpaid_interest_usd: 0, note_rate_pct: 5.75, monthly_debt_service_usd: 118000, maturity_date: "2029-01-01T00:00:00Z", securitization_value_usd: 26000000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_e_id: "$.data.id" }
            - call: "POST /special-servicing/loans"
              payload: { trust_id: "${trust_f_id}", loan_number: "L-F01", original_balance_usd: 20000000, current_principal_balance_usd: 19500000, accrued_unpaid_interest_usd: 0, note_rate_pct: 5.75, monthly_debt_service_usd: 118000, maturity_date: "2029-01-01T00:00:00Z", securitization_value_usd: 26000000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_f_id: "$.data.id" }
            - call: "POST /special-servicing/transfer-events"
              payload: { loan_id: "${loan_e_id}", event_code: "BANKRUPTCY", occurred_on: "2026-07-01T00:00:00Z", evidence_note: "chapter 11 petition" }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "POST /special-servicing/transfer-events"
              payload: { loan_id: "${loan_f_id}", event_code: "BANKRUPTCY", occurred_on: "2026-07-01T00:00:00Z", evidence_note: "chapter 11 petition" }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "POST /special-servicing/loans/${loan_e_id}/servicing-status"
              payload: { to_status: "SPECIAL_SERVICING" }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "POST /special-servicing/loans/${loan_f_id}/servicing-status"
              payload: { to_status: "SPECIAL_SERVICING" }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "POST /special-servicing/appraisals"
              payload: { loan_id: "${loan_e_id}", appraisal_type: "UPDATE", ordered_on: "2026-08-01T00:00:00Z", appraiser_firm: "Acme Valuation", valuation_valid_months: 12 }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { appraisal_e_id: "$.data.id" }
            - call: "POST /special-servicing/appraisals/${appraisal_e_id}/status"
              payload: { to_status: "RECEIVED", value_usd: 15000000, as_of_date: "2026-08-01T00:00:00Z" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
            - call: "POST /special-servicing/appraisals/${appraisal_e_id}/status"
              payload: { to_status: "ACCEPTED" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-002"
            - call: "POST /special-servicing/appraisals"
              payload: { loan_id: "${loan_f_id}", appraisal_type: "UPDATE", ordered_on: "2026-08-01T00:00:00Z", appraiser_firm: "Acme Valuation", valuation_valid_months: 12 }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { appraisal_f_id: "$.data.id" }
            - call: "POST /special-servicing/appraisals/${appraisal_f_id}/status"
              payload: { to_status: "RECEIVED", value_usd: 14999999, as_of_date: "2026-08-01T00:00:00Z" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
            - call: "POST /special-servicing/appraisals/${appraisal_f_id}/status"
              payload: { to_status: "ACCEPTED" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-002"
            - call: "GET /special-servicing/appraisal-reductions"
              payload: { loan_id: "${loan_e_id}", status: "PROVISIONAL" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { ara_e_id: "$.data[0].id", ara_e_amount: "$.data[0].ara_amount_usd" }
            - call: "GET /special-servicing/appraisal-reductions"
              payload: { loan_id: "${loan_f_id}", status: "PROVISIONAL" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { ara_f_id: "$.data[0].id", ara_f_amount: "$.data[0].ara_amount_usd" }
          trigger:
            - call: "POST /special-servicing/appraisal-reductions/${ara_e_id}/status"
              payload: { to_status: "EFFECTIVE" }
              as: SpecialServicingCommitteeOfficer
              as_user_id: "cmte-001"
            - call: "POST /special-servicing/appraisal-reductions/${ara_f_id}/status"
              payload: { to_status: "EFFECTIVE" }
              as: SpecialServicingCommitteeOfficer
              as_user_id: "cmte-001"
            - call: "GET /special-servicing/trusts/${trust_e_id}"
              as: SpecialServicingCommitteeOfficer
              as_user_id: "cmte-001"
              captures: { e_notional: "$.data.controlling_class_notional_usd", e_control: "$.data.control_status" }
            - call: "GET /special-servicing/trusts/${trust_f_id}"
              as: SpecialServicingCommitteeOfficer
              as_user_id: "cmte-001"
              captures: { f_notional: "$.data.controlling_class_notional_usd", f_control: "$.data.control_status" }
          assert:
            - "AppraisalReduction.${ara_e_id}.ara_amount_usd == 6000000.00 and AppraisalReduction.${ara_f_id}.ara_amount_usd == 6000000.90"
            - "Trust.${trust_e_id}.total_ara_usd == 6000000.00 and controlling_class_notional_usd == 2000000.00"
            - "Trust.${trust_e_id}.control_status == CONTROLLING — exactly at the threshold, and >= is inclusive"
            - "Trust.${trust_f_id}.total_ara_usd == 6000000.90 and controlling_class_notional_usd == 1999999.10"
            - "Trust.${trust_f_id}.control_status == CONSULTING_ONLY — 90 cents past the threshold"
            - "The two trusts differ by 0.90 in total_ara_usd and land on opposite sides of the control test"

      - name: consultation_sweep_at_exact_deadline_instant
        grounds:
          - calculations.consultation_response_deadline
          - state_machines.ConsultationRequest.PENDING_to_DEEMED_CONSENTED
          - state_machines.WorkoutPlan.CONSULTATION_to_CONSENT_SATISFIED
          - endpoints[POST /special-servicing/consultations/sweep]
          - entities.ConsultationRequest.fields.deadline_at
        distinguishing_aspect: |
          Metric: the deadline_at instant against the logical clock, on POST /consultations/sweep.
          The comparison is STRICTLY greater-than at millisecond resolution: a clock of exactly
          2026-09-16T23:59:59.999Z sweeps nothing (swept_count 0, the consultation stays PENDING and
          the plan stays in CONSULTATION), and advancing one millisecond past it to
          2026-09-17T00:00:00Z sweeps exactly one consultation and pushes the plan to
          CONSENT_SATISFIED. Any implementation that compares dates rather than instants sweeps on
          the first call.
        test_recipe:
          setup:
            - "Clock set to 2026-09-01T00:00:00Z, a Tuesday, before the consultation is issued."
            - "One trust with the default consultation_response_business_days of 10 and a 40,000,000.00 controlling class balance so rights_type is CONSENT_RIGHT."
            - "One loan transferred to special servicing with a plan SCORED, RECOMMENDED and in CONSULTATION."
            - "The 10 business days skip Sep 5-6 and Sep 12-13 (weekends) and Sep 7 (pinned holiday), landing on Sep 16."
          setup_api_calls:
            - call: "POST /special-servicing/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-S2", closing_date: "2026-01-15T00:00:00Z", original_controlling_class_balance_usd: 40000000, consultation_response_business_days: 10 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { trust_id: "$.data.id" }
            - call: "POST /special-servicing/loans"
