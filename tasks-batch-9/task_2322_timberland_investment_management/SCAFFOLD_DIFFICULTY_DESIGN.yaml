  - rule_id: compensating_invariant
    instances:
      - name: harvest_block_cancel_restores_available_tons_exactly
        grounds:
          - state_machines.HarvestBlock.RESERVED_to_CANCELLED
          - entities.Stand.fields.available_tons
          - entities.Stand.fields.reserved_tons
          - calculations.harvest_block_net_revenue
        distinguishing_aspect: |
          CANCEL is the exact inverse of the reservation and nothing else: reserved_tons
          returns to 0.00 and available_tons returns to the full 4647.12 with no drift,
          the block KEEPS its planned_tons 1000.00 and provisional_net_revenue_usd
          22889.55 as a historical record (they are not zeroed the way a hazard void
          zeroes them), final_net_revenue_usd stays null, and the fund's cash is untouched
          at 400000.00 — a cancellation is not a cash event.
