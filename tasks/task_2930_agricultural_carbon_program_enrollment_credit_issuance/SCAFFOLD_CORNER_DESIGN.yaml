              payload: { name: "Prairie Verify Ltd", accreditation_id: "ACC-7781", accredited_practices: ["COVER_CROP"], max_concurrent_visits: 2 }
              as: ProgramAdmin
              captures: { vb1_id: $.data.id }
            - call: "POST /verifications"
