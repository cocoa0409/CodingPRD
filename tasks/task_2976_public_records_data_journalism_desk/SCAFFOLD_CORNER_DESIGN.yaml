              payload: { request_id: "${req_id}", investigation_id: "${inv_id}", name: "tier-1000-probe", negotiated_format: "CSV", expected_field_count: 1, sensitivity_tier: "PUBLIC" }
              as: DataReporter
              captures: { ds_1000_id: $.data.id }
            - call: "POST /records-desk/datasets/${ds_1000_id}/delivery"
              payload: { delivered_format: "CSV", record_count: 1000 }
              as: DataReporter
            - call: "POST /records-desk/datasets/${ds_1000_id}/field-definitions"
              payload: { field_name: "ward_code", data_type: "STRING", null_rate_pct: 0.0, reidentification_risk: 4, is_source_identifying: false }
              as: DataReporter
          trigger:
            - call: "GET /records-desk/investigations/${inv_id}/disclosure-risk-preview"
