scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: wage_provisional_vs_final_diverge_on_same_five_days
    grounds:
    - calculations.wage_differential_period_amount
    - entities.WageDifferentialEntry.fields.net_amount_cents
    - entities.Placement.fields.logged_hours
    - endpoints.POST /rtw/placements/{id}/wage-differential-entries
    distinguishing_aspect: 'This dual-variant instance sits in the fiscal domain on WageDifferentialEntry: PROVISIONAL and FINAL read the same five 4-hour days at the same 1875-cent rate and still post
      55003 and 52255 net cents, because PROVISIONAL rounds once after summing and withholds no offset while FINAL rounds each day before summing and withholds 5 percent.'
    test_recipe:
      setup:
      - Employee earning 120000 cents per 40-hour week on benefit_tier TIER_B.
      - Claim in claim_status RTW_ELIGIBLE with a 150000-cent weekly ceiling.
      - ACTIVE RestrictionSet with severity_index 60 (lift 20, standing 30, hours 6, keyboard 45).
      - ACTIVE Placement on a LOW-risk 1875 cent/hour job, 4 scheduled hours/day, 2026-08-03..2026-08-28, benefit_continuation_status EMPLOYER_SUBSIDIZED.
      - Five logged_hours rows of 4.0 hours covering Monday 2026-08-03 through Friday 2026-08-07.
      setup_api_calls:
      - call: POST /rtw/employees
        payload:
          full_name: Dana Ruiz
          employee_number: EMP-2201
          department_code: WHS
          pre_injury_weekly_wage_cents: 120000
          pre_injury_weekly_hours: 40
          benefit_tier: TIER_B
        as: ProgramAdmin
        captures:
          emp_id: $.data.id
      - call: POST /rtw/employees/${emp_id}/claims
        payload:
          claim_number: CLM-2201
          adjuster_user_id: adj-001
          injury_date: '2026-06-15'
        as: ProgramAdmin
        captures:
          claim_id: $.data.id
      - call: POST /rtw/claims/${claim_id}/adjuster-authorization
        payload:
          max_authorized_weekly_cost_cents: 150000
          claim_status_directive: RTW_ELIGIBLE
        as: ClaimAdjuster
        as_user_id: adj-001
        captures:
          claim_v: $.data.version
      - call: POST /rtw/treating-providers
        payload:
          full_name: Imani Okafor
          npi: '1234567890'
          specialty: Occupational Medicine
          credential_status: VERIFIED
        as: ProgramAdmin
        captures:
          prov_id: $.data.id
      - call: POST /rtw/supervisors
        payload:
          full_name: Sam Ortiz
          department_code: WHS
        as: ProgramAdmin
        captures:
          sup_id: $.data.id
      - call: POST /rtw/supervisors/${sup_id}/training-records
        payload:
          curriculum_code: RTW_CORE
          completed_on: '2026-05-01'
          valid_through: '2027-05-01'
        as: ProgramAdmin
        captures:
          train_id: $.data.id
      - call: POST /rtw/transitional-jobs
        payload:
          supervisor_id: ${sup_id}
          title: Parts Sorter
          department_code: WHS
          seat_capacity: 2
          demand_lift_lbs: 10
          demand_standing_minutes: 15
          demand_hours_per_day: 4
          demand_keyboard_minutes_per_hour: 20
          hourly_rate_cents: 1875
          risk_class: LOW
        as: ProgramAdmin
        captures:
          job_id: $.data.id
      - call: POST /rtw/claims/${claim_id}/restriction-sets
        payload:
          treating_provider_id: ${prov_id}
          expected_claim_version: ${claim_v}
          effective_from: '2026-08-01'
          valid_through: '2026-11-30'
          max_lift_lbs: 20
          max_continuous_standing_minutes: 30
          max_hours_per_day: 6
          keyboard_minutes_per_hour: 45
          overhead_reach_allowed: false
          driving_allowed: false
        as: TreatingProvider
        as_user_id: ${prov_id}
        captures:
          rs_id: $.data.id
      - call: POST /rtw/restriction-sets/${rs_id}/submit
        payload: {}
        as: TreatingProvider
        as_user_id: ${prov_id}
      - call: POST /rtw/restriction-sets/${rs_id}/verify
        payload: {}
        as: OccHealthNurse
        as_user_id: nurse-1
      - call: POST /rtw/restriction-sets/${rs_id}/activate
        payload: {}
        as: RTWCoordinator
        as_user_id: coord-1
        captures:
          rs_v: $.data.version
      - call: POST /rtw/placements
        payload:
          restriction_set_id: ${rs_id}
          transitional_job_id: ${job_id}
          start_date: '2026-08-03'
          end_date: '2026-08-28'
          scheduled_hours_per_day: 4
          expected_restriction_set_version: ${rs_v}
        as: RTWCoordinator
        as_user_id: coord-1
        captures:
          pl_id: $.data.id
      - call: POST /rtw/placements/${pl_id}/submit-to-adjuster
        payload: {}
        as: RTWCoordinator
        as_user_id: coord-1
        captures:
          dir_id: $.data.current_adjuster_directive_id
      - call: POST /rtw/adjuster-directives/${dir_id}/decide
        payload:
          decision: AUTHORIZED
          authorized_weekly_cost_cents: 120000
        as: ClaimAdjuster
        as_user_id: adj-001
      - call: POST /rtw/placements/${pl_id}/activate
        payload: {}
        as: RTWCoordinator
        as_user_id: coord-1
      - call: POST /rtw/placements/${pl_id}/hours-log
        payload:
          work_date: '2026-08-03'
          hours_worked: 4
        as: Supervisor
        as_user_id: ${sup_id}
      - call: POST /rtw/placements/${pl_id}/hours-log
        payload:
          work_date: '2026-08-04'
          hours_worked: 4
        as: Supervisor
        as_user_id: ${sup_id}
      - call: POST /rtw/placements/${pl_id}/hours-log
        payload:
          work_date: '2026-08-05'
          hours_worked: 4
        as: Supervisor
        as_user_id: ${sup_id}
      - call: POST /rtw/placements/${pl_id}/hours-log
        payload:
          work_date: '2026-08-06'
          hours_worked: 4
        as: Supervisor
        as_user_id: ${sup_id}
      - call: POST /rtw/placements/${pl_id}/hours-log
        payload:
          work_date: '2026-08-07'
          hours_worked: 4
        as: Supervisor
        as_user_id: ${sup_id}
      trigger:
      - call: POST /rtw/placements/${pl_id}/wage-differential-entries
        payload:
          variant: PROVISIONAL
          period_start: '2026-08-03'
          period_end: '2026-08-07'
        as: ProgramAdmin
        captures:
          prov_entry_id: $.data.id
          prov_net: $.data.net_amount_cents
          prov_gross: $.data.gross_differential_cents
          prov_days: $.data.counted_day_count
      - call: POST /rtw/placements/${pl_id}/wage-differential-entries
        payload:
          variant: FINAL
          period_start: '2026-08-03'
          period_end: '2026-08-07'
        as: ProgramAdmin
        captures:
          final_entry_id: $.data.id
          final_net: $.data.net_amount_cents
          final_gross: $.data.gross_differential_cents
          final_off: $.data.offset_cents
          final_tier: $.data.tier_multiplier
      - call: GET /rtw/claims/${claim_id}
        payload: {}
        as: ProgramAdmin
        captures:
          paid: $.data.wage_differential_paid_cents
      assert:
      - ${prov_days} == 5
      - ${prov_gross} == 55003
      - ${prov_net} == 55003
      - WageDifferentialEntry.${prov_entry_id}.offset_cents == 0
      - WageDifferentialEntry.${prov_entry_id}.tier_multiplier == 1.00
      - ${final_gross} == 55005
      - ${final_off} == 2750
      - ${final_net} == 52255
      - ${final_tier} == 1.00
      - ${final_net} != ${prov_net}
      - ${paid} == 107258
  - name: reinjury_risk_baseline_vs_surveillance_diverge_on_same_placement
    grounds:
    - calculations.reinjury_risk_score
    - entities.Placement.fields.reinjury_risk_score
    - entities.Placement.fields.reinjury_risk_variant
    - state_machines.Placement.COMPLIANT_to_WATCH
    distinguishing_aspect: 'This dual-variant instance sits in the safety domain on Placement rather than the fiscal domain: with the structural term fixed at 53.6667, BASELINE reports 54 because it omits
      observed events entirely while SURVEILLANCE reports 65 after one MAJOR compliance observation adds 11 undecayed points.'
    test_recipe:
      setup:
      - Same employee/claim/provider/supervisor/LOW-risk-job fixture as the wage instance.
      - One ACTIVE Placement whose BASELINE reinjury_risk_score is 54 and reinjury_risk_variant is BASELINE.
      - Logical clock at 2026-08-05T00:00:00Z so an observation dated 2026-08-04 sits 1 day back and takes decay factor 1.
      setup_api_calls:
      - call: POST /rtw/employees
        payload:
          full_name: Dana Ruiz
          employee_number: EMP-2201
          department_code: WHS
          pre_injury_weekly_wage_cents: 120000
