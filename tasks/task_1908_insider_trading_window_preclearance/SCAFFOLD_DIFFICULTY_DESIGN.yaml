  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: approval_quantity_conserved_through_match_and_void
        grounds:
          - entities.PreclearanceRequest.fields.matched_quantity
          - entities.PreclearanceRequest.fields.remaining_quantity
          - state_machines.PreclearanceRequest.APPROVED_to_VOIDED
        distinguishing_aspect: |
          Conserved quantity = share balance per request: quantity == matched_quantity +
          remaining_quantity at every checkpoint — before matching (100 = 0 + 100), after a
          40-share match (100 = 40 + 60), and after the compensating VOID releases the match
          (100 = 0 + 100). Different conserved quantity than restricted_entry_count_conserved_through_deal_cycle.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; insider policy/training current"
            - "req APPROVED for ACME BUY 100 proposed 2026-08-02T00:00:00Z, decided_at 2026-08-01T00:00:00Z"
            - "A 40-share confirmation matches; then an event window created after decided_at activates over 2026-08-02 and voids the approval"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LegalAdmin
            - call: "POST /covered-persons"
