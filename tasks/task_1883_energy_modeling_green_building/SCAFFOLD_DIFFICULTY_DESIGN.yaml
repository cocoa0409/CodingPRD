  - rule_id: compensating_invariant
    instances:
      - name: credit_create_drop_points_pool_conserved
        grounds:
          - entities.CertificationProject.fields.points_pursued_total
          - state_machines.CreditAttempt.SELECTED_to_DROPPED
        distinguishing_aspect: |
          Conserved quantity = strategy point pool: creating then dropping an
          attempt on a 6-point credit leaves project.points_pursued_total ==
          sum(points_possible over attempts with status != DROPPED) unchanged at
          0 — forward action and compensating action cancel exactly.
        test_recipe:
          setup:
            - "Project in REGISTERED with points_pursued_total == 0; library holds a regular 6-point DESIGN credit"
          setup_api_calls:
            - call: "POST /team-members"
              payload: { full_name: "Adam Admin", email: "adam@x.com", specialty: "MANAGEMENT" }
              as: ProgramAdmin
              captures: { m_admin: $.data.id }
            - call: "POST /team-members"
              payload: { full_name: "Dana Docs", email: "dana@x.com", specialty: "DOCUMENTATION" }
              as: ProgramAdmin
              captures: { m_spec: $.data.id }
            - call: "POST /credit-library-entries"
              payload: { credit_code: "SSc1", title: "Site Selection", category: "SUSTAINABLE_SITES", points_possible: 6, is_prerequisite: false, phase_eligibility: "DESIGN", requires_energy_model: false }
              as: ProgramAdmin
              captures: { e_x: $.data.id }
            - call: "POST /certification-projects"
              payload: { project_name: "Tower Q", rating_system: "LEED_BD_C", compliance_path: "PRESCRIPTIVE", gross_floor_area_sqft: 120000, target_level: "CERTIFIED", fee_budget_cents: 5000000 }
              as: ProjectAdministrator
              as_user_id: "${m_admin}"
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /credit-attempts"
              payload: { project_id: "${p_id}", credit_library_entry_id: "${e_x}", phase: "DESIGN", documentation_owner_id: "${m_spec}" }
              as: ProjectAdministrator
              as_user_id: "${m_admin}"
              captures: { a_x: $.data.id, pts_mid: $.data.points_possible }
            - call: "POST /credit-attempts/${a_x}/drop"
              as: ProjectAdministrator
              as_user_id: "${m_admin}"
            - call: "GET /certification-projects/${p_id}"
              as: Any
              captures: { pts_final: $.data.points_pursued_total }
          assert:
            - "After create: CertificationProject.${p_id}.points_pursued_total == 6 (== CreditAttempt.${a_x}.points_possible snapshot)"
            - "After drop: CreditAttempt.${a_x}.status == DROPPED and captured pts_final == 0 (invariant restored: sum over non-DROPPED == 0)"

      - name: fee_submit_withdraw_balance_conserved
        grounds:
          - calculations.certification_fee
          - state_machines.CertificationProject.DESIGN_SUBMITTED_to_STRATEGY_LOCKED
          - entities.CertificationProject.fields.fee_balance_cents
        distinguishing_aspect: |
          Conserved quantity = fee money (different conserved quantity than the
          points pool): submit-phase debits 850000 and its compensating
          withdraw-phase credits exactly 850000, so fee_balance_cents returns to
          the 5000000 budget with zero drift.
        test_recipe:
          setup:
            - "PRESCRIPTIVE project, fee_budget_cents 5000000, strategy locked, prerequisite attempt READY_FOR_SUBMITTAL"
          setup_api_calls:
            - call: "POST /team-members"
              payload: { full_name: "Adam Admin", email: "adam@x.com", specialty: "MANAGEMENT" }
              as: ProgramAdmin
              captures: { m_admin: $.data.id }
            - call: "POST /team-members"
              payload: { full_name: "Dana Docs", email: "dana@x.com", specialty: "DOCUMENTATION" }
              as: ProgramAdmin
              captures: { m_spec: $.data.id }
            - call: "POST /credit-library-entries"
              payload: { credit_code: "EAp1", title: "Fundamental Commissioning", category: "ENERGY_ATMOSPHERE", points_possible: 0, is_prerequisite: true, phase_eligibility: "BOTH", requires_energy_model: false }
              as: ProgramAdmin
              captures: { e_p: $.data.id }
            - call: "POST /certification-projects"
              payload: { project_name: "Tower R", rating_system: "LEED_BD_C", compliance_path: "PRESCRIPTIVE", gross_floor_area_sqft: 120000, target_level: "CERTIFIED", fee_budget_cents: 5000000 }
              as: ProjectAdministrator
              as_user_id: "${m_admin}"
              captures: { p_id: $.data.id }
            - call: "POST /credit-attempts"
              payload: { project_id: "${p_id}", credit_library_entry_id: "${e_p}", phase: "DESIGN", documentation_owner_id: "${m_spec}" }
              as: ProjectAdministrator
              as_user_id: "${m_admin}"
              captures: { a_p: $.data.id }
            - call: "GET /certification-projects/${p_id}"
              as: Any
              captures: { p_v: $.data.version }
            - call: "POST /certification-projects/${p_id}/lock-strategy"
              payload: { expected_project_version: "${p_v}" }
              as: ProjectAdministrator
              as_user_id: "${m_admin}"
            - call: "POST /credit-attempts/${a_p}/assign-owner"
              payload: { documentation_owner_id: "${m_spec}" }
              as: ProjectAdministrator
              as_user_id: "${m_admin}"
            - call: "POST /credit-attempts/${a_p}/mark-ready"
              as: DocumentationSpecialist
              as_user_id: "${m_spec}"
          trigger:
            - call: "POST /certification-projects/${p_id}/submit-phase"
              payload: { phase: "DESIGN" }
              as: ProjectAdministrator
              as_user_id: "${m_admin}"
              captures: { bal_after_submit: $.data.fee_balance_cents }
            - call: "POST /certification-projects/${p_id}/withdraw-phase"
              payload: { phase: "DESIGN" }
              as: ProjectAdministrator
              as_user_id: "${m_admin}"
              captures: { bal_after_withdraw: $.data.fee_balance_cents }
          assert:
            - "Captured bal_after_submit == 4150000 (5000000 - min(250000 + 5000*ceil(120000/1000), 2000000) = 5000000 - 850000)"
            - "Captured bal_after_withdraw == 5000000 == fee_budget_cents (submit+withdraw leaves fee_balance_cents unchanged)"
            - "CreditAttempt.${a_p}.status == READY_FOR_SUBMITTAL (reverted)"
            - "CertificationProject.${p_id}.status == STRATEGY_LOCKED (reverted)"
