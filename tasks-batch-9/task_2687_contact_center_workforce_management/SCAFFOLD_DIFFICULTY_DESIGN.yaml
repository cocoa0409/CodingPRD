              payload: { target_posture: "REQUIREMENTS_LOCKED" }
              as: CapacityPlanner
            - call: "POST /schedule-shifts/${sh_mon_id}/publication"
              payload: { target_publication_status: "PUBLISHED" }
              as: SchedulingManager
            - call: "POST /schedule-shifts/${sh_tue_id}/publication"
              payload: { target_publication_status: "PUBLISHED" }
              as: SchedulingManager
            - call: "POST /intraday-actions"
              payload: { planning_cycle_id: "${cyc_id}", kind: "OT_OFFER", agent_id: "${ag1_id}", schedule_shift_id: "${sh_mon_id}", target_forecast_group_id: "${fga_id}", hours: 5.0, expires_at: "2026-09-30T00:00:00Z" }
