  - rule_id: compensating_invariant
    instances:
      - name: waiver_apply_void_conserves_gross_value
        grounds:
          - calculations.claimable_amount
          - state_machines.Waiver.APPLIED_to_VOIDED
          - entities.LienClaim.fields.gross_snapshot_cents
        distinguishing_aspect: |
          Conserved quantity is MONEY: for an AMOUNT_LOCKED claim,
          verified_paid_cents + effective_waiver_cents + final_amount_cents ==
          gross_snapshot_cents (1100000) must hold after the forward action
