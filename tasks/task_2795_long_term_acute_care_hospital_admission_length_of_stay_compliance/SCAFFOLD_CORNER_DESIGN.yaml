        distinguishing_aspect: "The happy path of the interruption cycle: a 5-day ACUTE_CARE absence is inside the 9-day window, so the event ends RETURNED and the stay comes back to ADMITTED with resumed_at set - the EXPIRED branch and the buffer rule are exercised elsewhere."
