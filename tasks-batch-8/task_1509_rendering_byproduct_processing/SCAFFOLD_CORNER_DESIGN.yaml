            - { call: "POST /rendering/inbound-batches", payload: { plant_id: "${plant_id}", supplier_id: "${s2_id}", agreement_id: "${a2_id}", species: "BOVINE", weight_lbs: 6000, temperature_f: 60.0, received_at: "2026-08-02T09:00:00Z" }, as: ScalehouseOperator, as_user_id: "sh-1", captures: { b2_id: $.data.id } }
          trigger:
            - { call: "POST /rendering/inbound-batches/${b1_id}/screen", payload: { screening_result: "FAIL_PROHIBITED" }, as: ScalehouseOperator, as_user_id: "sh-1" }
            - { call: "POST /rendering/inbound-batches/${b2_id}/screen", payload: { screening_result: "FAIL_PROHIBITED" }, as: ScalehouseOperator, as_user_id: "sh-2" }
          assert:
            - "InboundBatch.${b1_id}.status == REJECTED (ZERO_TOLERANCE branch, terminal)"
            - "InboundBatch.${b2_id}.status == QUARANTINED (SORT_AND_RETURN branch, adjudicable)"

      - name: settlement_close_reopen_close_finalize_cycle
        claim_type: valid_transition
        grounds: [state_machines.PeriodSettlement]
        distinguishing_aspect: "The settlement machine cycles OPEN -> CLOSED -> REOPENED -> CLOSED -> FINALIZED; reopen clears closed_by and finalize is terminal with SoD."
        test_recipe:
          setup: ["plant with period-1 settlement OPEN"]
          setup_api_calls:
            - { call: "POST /rendering/plants", payload: { plant_name: "Plant A", location: "Dallas TX", cooker_capacity: 2, standard_cost_cents_per_lb: 38 }, as: PlantManager, captures: { plant_id: $.data.id } }
            - { call: "GET /rendering/period-settlements?plant_id=${plant_id}&period_index=1", as: Any, captures: { st_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /rendering/period-settlements/${st_id}/close", payload: {}, as: FinanceAnalyst, as_user_id: "fa-1" }
            - { call: "POST /rendering/period-settlements/${st_id}/reopen", payload: {}, as: PlantManager, as_user_id: "pmgr-1" }
            - { call: "POST /rendering/period-settlements/${st_id}/close", payload: {}, as: FinanceAnalyst, as_user_id: "fa-2" }
            - { call: "POST /rendering/period-settlements/${st_id}/finalize", payload: {}, as: PlantManager, as_user_id: "pmgr-1" }
          assert:
            - "After first close: CLOSED with closed_by 'fa-1'; after reopen: REOPENED with closed_by null"
            - "After second close: CLOSED with closed_by 'fa-2'; finalize by pmgr-1 (!= fa-2) -> FINALIZED (terminal)"

