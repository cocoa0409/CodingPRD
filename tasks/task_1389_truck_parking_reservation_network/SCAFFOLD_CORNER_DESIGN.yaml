            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R01", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-AI", full_name: "A Eye" }, as: Anonymous, captures: { d1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings", payload: { driver_id: "${d1}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-10", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d1}", captures: { b1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T15:30:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings/${b1}/check-in", payload: {}, as: Driver, as_user_id: "${d1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T11:31:00Z" }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/ops-run", payload: {}, as: NetworkAdmin }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T15:31:00Z" }, as: NetworkAdmin }
            - { call: "POST /sites/${site_id}/ops-run", payload: {}, as: NetworkAdmin }
            - { call: "GET /incidents", payload: { booking_id: "${b1}" }, as: NetworkAdmin, captures: { cat: "$.data[0].category", sev: "$.data[0].severity" } }
            - { call: "POST /sites/${site_id}/ops-run", payload: {}, as: NetworkAdmin }
            - { call: "GET /incidents", payload: { booking_id: "${b1}" }, as: NetworkAdmin }
          assert:
            - "exactly one incident exists with booking_id == the booking: category SECURITY, severity HIGH, status OPEN"
            - "a second ops-run creates no further incident (incident_escalated flag)"

      - name: rate_plan_activation_supersedes_and_reprices
        claim_type: action_endpoint
        grounds: [state_machines.RatePlan.DRAFT_to_ACTIVE, state_machines.RatePlan.ACTIVE_to_SUPERSEDED]
        distinguishing_aspect: "Activating a DRAFT plan (OCC version matches) supersedes the default plan; new quotes use the new mult_low 1.0 while already-created bookings keep pinned rates."
        test_recipe:
          setup: ["site (base 5000, default plan ACTIVE, version 1) with 1 reservable stall; booking B1 created under the default plan (quote 4500)"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", base_nightly_rate_cents: 5000 }, as: NetworkAdmin, captures: { site_id: $.data.id, sv: $.data.version } }
            - { call: "POST /sites/${site_id}/stalls", payload: { stall_number: "R01", stall_class: "STANDARD", is_reservable: true }, as: NetworkAdmin }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-RP", full_name: "R Pee" }, as: Anonymous, captures: { d1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin }
            - { call: "POST /bookings", payload: { driver_id: "${d1}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-10", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d1}", captures: { b1: $.data.id, q1: $.data.quoted_total_cents } }
            - { call: "POST /sites/${site_id}/rate-plans", payload: { mult_low: 1.0 }, as: NetworkAdmin, captures: { rp: $.data.id } }
          trigger:
            - { call: "POST /sites/${site_id}/rate-plans/${rp}/transition", payload: { to: "ACTIVE", expected_site_version: "${sv}" }, as: NetworkAdmin, captures: { rps: $.data.status } }
            - { call: "GET /sites/${site_id}/rate-plans", payload: { status: "SUPERSEDED" }, as: NetworkAdmin, captures: { sup: "$.data[0].status" } }
            - { call: "GET /bookings/${b1}", payload: {}, as: NetworkAdmin, captures: { q1after: $.data.quoted_total_cents } }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-RQ", full_name: "R Que" }, as: Anonymous, captures: { d2: $.data.id } }
            - { call: "POST /bookings", payload: { driver_id: "${d2}", site_id: "${site_id}", booking_kind: "RESERVED", arrival_date: "2026-08-12", night_count: 1, payment_mode: "DRIVER_DIRECT" }, as: Driver, as_user_id: "${d2}", captures: { q2: $.data.quoted_total_cents } }
          assert:
            - "activated plan status == ACTIVE; exactly one SUPERSEDED plan exists (the default)"
            - "B1 quoted_total_cents stays 4500 (pinned) while a new booking under the new plan quotes 5000 (mult_low 1.0)"

