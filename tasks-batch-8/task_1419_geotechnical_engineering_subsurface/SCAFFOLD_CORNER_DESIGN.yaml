  - section: endpoints
    instances:
      - name: list_borings_pagination_envelope
        claim_type: pagination
        grounds:
          - response_envelope
        distinguishing_aspect: "GET /geo/borings with limit=1 over a 2-boring plan returns meta pagination total_count == 2 and has_more == true; offset=1 returns the second page with has_more == false."
        test_recipe:
          setup: ["Project DRAFT, plan APPROVED with borings B-1 and B-2"]
          setup_api_calls:
            - { call: "POST /geo/clients", payload: { name: "Acme Dev", contact_email: "a@x.com" }, as: FirmAdmin, captures: { c_id: "$.data.id" } }
            - { call: "POST /geo/projects", payload: { client_id: "${c_id}", name: "P1", site_address: "1 Way", target_report_date: "2026-12-31T00:00:00Z", base_fee_cents: 300000, additional_auth_cap_cents: 500000, assumed_gwt_depth_ft: 10 }, as: FirmAdmin, captures: { p_id: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /geo/projects/${p_id}/boring-plans", payload: { planned_boring_count: 2, planned_total_footage_ft: 60, expected_project_version: "${p_v}" }, as: StaffEngineer, captures: { pl_id: "$.data.id" } }
            - { call: "POST /geo/boring-plans/${pl_id}/transition", payload: { to: "SUBMITTED" }, as: StaffEngineer }
            - { call: "POST /geo/boring-plans/${pl_id}/transition", payload: { to: "APPROVED" }, as: ProjectManager }
            - { call: "POST /geo/boring-plans/${pl_id}/borings", payload: { boring_no: "B-1", planned_depth_ft: 30 }, as: StaffEngineer }
            - { call: "POST /geo/boring-plans/${pl_id}/borings", payload: { boring_no: "B-2", planned_depth_ft: 30 }, as: StaffEngineer }
          trigger:
            - { call: "GET /geo/borings", payload: { boring_plan_id: "${pl_id}", limit: 1, offset: 0 }, as: StaffEngineer }
            - { call: "GET /geo/borings", payload: { boring_plan_id: "${pl_id}", limit: 1, offset: 1 }, as: StaffEngineer }
          assert:
            - "page 1: meta.total_count == 2, meta.has_more == true, data length == 1"
            - "page 2: meta.has_more == false, data length == 1"
            - "envelope carries meta.api_request_id and response_type == array"
      - name: get_boring_not_found_returns_404
        claim_type: envelope
        grounds:
          - response_envelope
          - errors[ERR_RESOURCE_NOT_FOUND]
        distinguishing_aspect: "Error responses use the fixed envelope: response_type == error and data carries error_id plus message."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /geo/borings/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: StaffEngineer, captures: { err: "$.data.error_id", msg: "$.data.message" } }
          assert:
            - "captured err == ERR_RESOURCE_NOT_FOUND"
            - "captured msg is a non-empty string; response_type == error"

