          - "errors[ERR_QUANTITY_OUT_OF_BOUNDS]"
        distinguishing_aspect: "A scan count above the agreement's max_qty is physically impossible and returns ERR_QUANTITY_OUT_OF_BOUNDS (422); counted_qty == max_qty exactly is accepted."
        test_recipe:
          setup: ["Site S, part P, agreement min 10 max 100; route started; two stops"]
          setup_api_calls:
            - call: "POST /vmi/sites"
