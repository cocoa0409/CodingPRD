          setup:
            - "One ManagementAgreement ACTIVE with base_fee_pct 0.0325, centralized_services_cap_pct 0.015, max_revision_rounds 1 and owner_review_window_days 30."
            - "An APPROVED FY2025 OperatingBudget with budgeted_revenue_cents 500000000, operating expenses 330000000, capital FF&E 15000000 and capital brand 8000000."
            - "A FY2026 OperatingBudget that has already completed one REVISION_REQUESTED round and is back in SUBMITTED with revision_round 1."
