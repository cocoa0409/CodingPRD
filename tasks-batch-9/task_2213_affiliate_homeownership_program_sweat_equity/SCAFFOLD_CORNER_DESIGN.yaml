            - "Entry ${se_2} re-read: status is still VERIFIED, hours_credited == 0, capped_hours == 0"

      - name: a_safety_hold_bars_new_shifts_until_the_posture_clears
        claim_type: cross_entity_validation
        grounds: ["validations[priority=25]", errors.ERR_SITE_UNDER_SAFETY_HOLD, entities.BuildSite.fields.safety_posture, "state_machines.BuildSite.readiness_status.READY_TO_BUILD_to_SAFETY_HOLD", "state_machines.BuildSite.readiness_status.SAFETY_HOLD_to_READY_TO_BUILD", "endpoints.POST /homeownership/build-sites/{id}/safety-posture"]
        distinguishing_aspect: "The gate is the PARENT site's field, not anything about the request: an identical shift payload is refused while safety_posture is HOLD and accepted the moment the posture is released back to CLEAR, with pre_hold_readiness_status restoring READY_TO_BUILD rather than the site staying stuck."
        test_recipe:
          setup:
            - "Canonical program with one site advanced to READY_TO_BUILD and no shifts yet. cm-1 then places a safety hold with posture HOLD, so readiness_status is SAFETY_HOLD, safety_posture is HOLD and pre_hold_readiness_status is READY_TO_BUILD. Nothing was cancelled by the cascade because no shift or assignment existed."
          setup_api_calls:
            - { call: "POST /homeownership/programs", payload: { affiliate_name: "Ridgeline Habitat", service_area_code: "TRAVIS", ami_median_income_cents: 6000000, subsidy_pool_cents: 5000000, sweat_equity_base_hours_required: 12, committee_quorum: 2 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { prog_id: $.data.id } }
            - { call: "POST /homeownership/build-sites", payload: { program_id: "${prog_id}", parcel_number: "P-1001", street_address: "12 Cedar Ln", acquisition_cost_cents: 4000000, appraised_value_cents: 15000000 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { site_id: $.data.id } }
            - { call: "POST /homeownership/build-sites/${site_id}/readiness-advance", payload: { step: "TITLE", document_reference: "TITLE-1001" }, as: ProgramAdmin, as_user_id: "admin-1" }
            - { call: "POST /homeownership/build-sites/${site_id}/readiness-advance", payload: { step: "ENVIRONMENTAL", document_reference: "ENV-1001" }, as: ProgramAdmin, as_user_id: "admin-1" }
            - { call: "POST /homeownership/build-sites/${site_id}/readiness-advance", payload: { step: "UTILITIES", document_reference: "UTL-1001" }, as: ProgramAdmin, as_user_id: "admin-1" }
            - { call: "POST /homeownership/build-sites/${site_id}/safety-posture", payload: { posture: "HOLD", incident_note: "Trench wall collapse, site closed pending inspection" }, as: ConstructionManager, as_user_id: "cm-1" }
          trigger:
            - { call: "POST /homeownership/construction-shifts", payload: { build_site_id: "${site_id}", crew_lead_user_id: "cm-1", start_at: "2026-08-05T08:00:00.000Z", end_at: "2026-08-05T12:00:00.000Z", volunteer_slots: 3 }, as: ConstructionManager, as_user_id: "cm-1", captures: { e_hold: $.data.error_id } }
            - { call: "GET /homeownership/construction-shifts", payload: { build_site_id: "${site_id}" }, as: ConstructionManager, as_user_id: "cm-1" }
            - { call: "POST /homeownership/build-sites/${site_id}/safety-posture", payload: { posture: "CLEAR", incident_note: "Inspection passed, trench reshored" }, as: ConstructionManager, as_user_id: "cm-1" }
            - { call: "POST /homeownership/construction-shifts", payload: { build_site_id: "${site_id}", crew_lead_user_id: "cm-1", start_at: "2026-08-05T08:00:00.000Z", end_at: "2026-08-05T12:00:00.000Z", volunteer_slots: 3 }, as: ConstructionManager, as_user_id: "cm-1" }
          assert:
            - "Under hold: HTTP 409 and ${e_hold} == ERR_SITE_UNDER_SAFETY_HOLD"
            - "Shift list for the site: total_count == 0 — the refused schedule created nothing"
            - "Release: HTTP 200 with readiness_status == READY_TO_BUILD (restored from pre_hold_readiness_status), safety_posture == CLEAR and pre_hold_readiness_status == null"
            - "The identical shift payload now returns HTTP 201 with status == SCHEDULED and duration_hours == 4.0"

      - name: a_shift_cannot_open_on_a_site_short_of_utilities_clearance
        claim_type: cross_entity_validation
        grounds: ["validations[priority=26]", errors.ERR_SITE_NOT_READY_TO_BUILD, entities.BuildSite.fields.readiness_status, "state_machines.BuildSite.readiness_status.ENV_CLEARED_to_READY_TO_BUILD", "state_machines.ConstructionShift.status.SCHEDULED_to_OPEN"]
        distinguishing_aspect: "The readiness gate binds at OPEN, not at schedule time: the same shift row is created without complaint on an ENV_CLEARED site, refused when opened, and opens successfully once the UTILITIES step lands — so the claim isolates which lifecycle step consults BuildSite.readiness_status."
        setup_note: "Staged on POST /construction-shifts/{id}/open, which is the single endpoint priority 26 declares in applies_to; the §1.6 condition's broader wording (scheduled or opened) is not probed at schedule time because no §1.4 row enforces it there."
        test_recipe:
          setup:
            - "Canonical program with one site advanced through TITLE and ENVIRONMENTAL only, so readiness_status is ENV_CLEARED with utilities_cleared false and safety_posture CLEAR. One shift on 2026-08-05T08:00 to 12:00 with 3 general seats has been scheduled against it and is still SCHEDULED."
          setup_api_calls:
            - { call: "POST /homeownership/programs", payload: { affiliate_name: "Ridgeline Habitat", service_area_code: "TRAVIS", ami_median_income_cents: 6000000, subsidy_pool_cents: 5000000, sweat_equity_base_hours_required: 12, committee_quorum: 2 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { prog_id: $.data.id } }
            - { call: "POST /homeownership/build-sites", payload: { program_id: "${prog_id}", parcel_number: "P-1001", street_address: "12 Cedar Ln", acquisition_cost_cents: 4000000, appraised_value_cents: 15000000 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { site_id: $.data.id } }
            - { call: "POST /homeownership/build-sites/${site_id}/readiness-advance", payload: { step: "TITLE", document_reference: "TITLE-1001" }, as: ProgramAdmin, as_user_id: "admin-1" }
            - { call: "POST /homeownership/build-sites/${site_id}/readiness-advance", payload: { step: "ENVIRONMENTAL", document_reference: "ENV-1001" }, as: ProgramAdmin, as_user_id: "admin-1" }
            - { call: "POST /homeownership/construction-shifts", payload: { build_site_id: "${site_id}", crew_lead_user_id: "cm-1", start_at: "2026-08-05T08:00:00.000Z", end_at: "2026-08-05T12:00:00.000Z", volunteer_slots: 3 }, as: ConstructionManager, as_user_id: "cm-1", captures: { shift_id: $.data.id } }
          trigger:
            - { call: "POST /homeownership/construction-shifts/${shift_id}/open", payload: {}, as: ConstructionManager, as_user_id: "cm-1", captures: { e_ready: $.data.error_id } }
            - { call: "GET /homeownership/construction-shifts/${shift_id}", as: ConstructionManager, as_user_id: "cm-1" }
            - { call: "POST /homeownership/build-sites/${site_id}/readiness-advance", payload: { step: "UTILITIES", document_reference: "UTL-1001" }, as: ProgramAdmin, as_user_id: "admin-1" }
            - { call: "POST /homeownership/construction-shifts/${shift_id}/open", payload: {}, as: ConstructionManager, as_user_id: "cm-1" }
          assert:
            - "Open on ENV_CLEARED: HTTP 409 and ${e_ready} == ERR_SITE_NOT_READY_TO_BUILD"
            - "Shift re-read: status is still SCHEDULED and its version is unchanged from creation"
            - "UTILITIES advance: HTTP 200 with readiness_status == READY_TO_BUILD and utilities_cleared == true"
            - "Re-open: HTTP 200 with status == OPEN — the same shift, the same payload, a different parent state"

      - name: shift_seat_shape_rejects_zero_seats_and_an_unnamed_trade
        claim_type: violation_to_error
        grounds: ["validations[priority=27]", "validations[priority=8]", errors.ERR_SHIFT_HAS_NO_SLOTS, errors.ERR_REQUIRED_TRADE_MISSING, entities.ConstructionShift.fields.volunteer_slots, entities.ConstructionShift.fields.required_trade_slots, entities.ConstructionShift.fields.required_trade]
        distinguishing_aspect: "volunteer_slots is declared >= 0, so a zero-seat shift clears priority 8's schema check and must be caught by priority 27's seat-inventory rule instead; and a shift that reserves two trade seats without naming a trade is refused even though both numeric fields are in range. Both violations are staged to hold under the §1.6 wording as well as the §1.4 check."
        setup_note: "ERR_SHIFT_HAS_NO_SLOTS is staged with volunteer_slots 0 AND required_trade_slots 0: the §1.4 sum rule (volunteer_slots + required_trade_slots >= 1) and the §1.6 wording (volunteer_slots of 0 or less, or required_trade_slots greater than volunteer_slots) both fail. ERR_REQUIRED_TRADE_MISSING is staged with required_trade_slots 2 <= volunteer_slots 4 so the no-slots rule cannot fire under either reading."
        test_recipe:
          setup:
            - "Canonical program with one site at READY_TO_BUILD and safety_posture CLEAR. No shift exists yet."
          setup_api_calls:
            - { call: "POST /homeownership/programs", payload: { affiliate_name: "Ridgeline Habitat", service_area_code: "TRAVIS", ami_median_income_cents: 6000000, subsidy_pool_cents: 5000000, sweat_equity_base_hours_required: 12, committee_quorum: 2 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { prog_id: $.data.id } }
            - { call: "POST /homeownership/build-sites", payload: { program_id: "${prog_id}", parcel_number: "P-1001", street_address: "12 Cedar Ln", acquisition_cost_cents: 4000000, appraised_value_cents: 15000000 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { site_id: $.data.id } }
            - { call: "POST /homeownership/build-sites/${site_id}/readiness-advance", payload: { step: "TITLE", document_reference: "TITLE-1001" }, as: ProgramAdmin, as_user_id: "admin-1" }
            - { call: "POST /homeownership/build-sites/${site_id}/readiness-advance", payload: { step: "ENVIRONMENTAL", document_reference: "ENV-1001" }, as: ProgramAdmin, as_user_id: "admin-1" }
            - { call: "POST /homeownership/build-sites/${site_id}/readiness-advance", payload: { step: "UTILITIES", document_reference: "UTL-1001" }, as: ProgramAdmin, as_user_id: "admin-1" }
          trigger:
            - { call: "POST /homeownership/construction-shifts", payload: { build_site_id: "${site_id}", crew_lead_user_id: "cm-1", start_at: "2026-08-05T08:00:00.000Z", end_at: "2026-08-05T12:00:00.000Z", volunteer_slots: 0, required_trade_slots: 0 }, as: ConstructionManager, as_user_id: "cm-1", captures: { e_slots: $.data.error_id } }
            - { call: "POST /homeownership/construction-shifts", payload: { build_site_id: "${site_id}", crew_lead_user_id: "cm-1", start_at: "2026-08-05T08:00:00.000Z", end_at: "2026-08-05T12:00:00.000Z", volunteer_slots: 4, required_trade_slots: 2 }, as: ConstructionManager, as_user_id: "cm-1", captures: { e_trade: $.data.error_id } }
            - { call: "POST /homeownership/construction-shifts", payload: { build_site_id: "${site_id}", crew_lead_user_id: "cm-1", start_at: "2026-08-05T08:00:00.000Z", end_at: "2026-08-05T12:00:00.000Z", volunteer_slots: 4, required_trade_slots: 2, required_trade: "PLUMBING" }, as: ConstructionManager, as_user_id: "cm-1" }
            - { call: "GET /homeownership/construction-shifts", payload: { build_site_id: "${site_id}" }, as: ConstructionManager, as_user_id: "cm-1" }
          assert:
            - "Zero seats: HTTP 422 and ${e_slots} == ERR_SHIFT_HAS_NO_SLOTS — not ERR_VALIDATION, because 0 is inside the declared >= 0 range for volunteer_slots"
            - "Two trade seats with no trade named: HTTP 422 and ${e_trade} == ERR_REQUIRED_TRADE_MISSING"
            - "Same payload with required_trade PLUMBING: HTTP 201, status == SCHEDULED, volunteer_slots == 4, required_trade_slots == 2, required_trade == PLUMBING"
            - "Shift list for the site: total_count == 1 — neither refused schedule appended a row, so the interval buffer rule was never consulted for them"

      - name: a_trade_seat_requires_a_matching_unexpired_certification
        claim_type: conditional_validation
        grounds: ["validations[priority=28]", errors.ERR_TRADE_CERTIFICATION_INVALID, entities.VolunteerProfile.fields.trade_certifications, entities.ConstructionShift.fields.required_trade, "endpoints.POST /homeownership/shift-assignments"]
        distinguishing_aspect: "The certification rule fires only for role == SKILLED_TRADE: the very same uncertified volunteer who is refused a trade seat is accepted on a general seat of the same shift, and a second volunteer certified in ROOFING rather than the shift's PLUMBING is refused too — so the check is trade-matching, not mere presence of a certification array."
        test_recipe:
          setup:
            - "Canonical program with a READY_TO_BUILD site and an OPEN shift on 2026-08-05T08:00 to 12:00 offering 4 general seats plus 2 PLUMBING trade seats. Volunteer U holds no certifications at all; volunteer R holds one ROOFING certification expiring 2027-12-31; volunteer P holds one PLUMBING certification expiring 2027-12-31. All three waivers run to 2027-12-31."
          setup_api_calls:
