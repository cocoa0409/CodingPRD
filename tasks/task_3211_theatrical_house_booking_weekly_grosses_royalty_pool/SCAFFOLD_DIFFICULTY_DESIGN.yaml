  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict: two dual-failure conflicts on
  # DIFFERENT error-category pairs.
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_temporal_on_approve
        grounds:
          - validations[priority=3]
          - validations[priority=5]
        distinguishing_aspect: |
          Category pair state (priority 3) vs business_temporal (priority 5):
          approving a booking that is already DECLINED while its window also
          overlaps an existing APPROVED booking must surface ERR_INVALID_STATE
          (409), never ERR_BOOKING_WINDOW_CONFLICT.
        test_recipe:
          setup:
            - "Two competing REQUESTED bookings on the same theatre with overlapping windows"
            - "Booking A approved (B cascaded to DECLINED); B's window still overlaps A's"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: HouseManager
            - call: "POST /theatres/companies"
              payload: { name: "P1Co", contact_email: "p1@x.com" }
              as: HouseManager
              captures: { comp1: $.data.id }
            - call: "POST /theatres/companies"
              payload: { name: "P2Co", contact_email: "p2@x.com" }
              as: HouseManager
              captures: { comp2: $.data.id }
            - call: "POST /theatres/houses"
              payload: { name: "OverlapHouse", capacity: 500, size_class: SMALL, is_landmark: false, base_weekly_rent_cents: 500000 }
              as: HouseManager
              captures: { house_id: $.data.id }
            - call: "POST /theatres/productions"
              payload: { company_id: "${comp1}", title: "Show A", required_size_class: SMALL, required_loadin_hours: 24, required_loadout_hours: 24 }
              as: CompanyRep
              as_user_id: "${comp1}"
              captures: { prod_a: $.data.id }
            - call: "POST /theatres/productions"
              payload: { company_id: "${comp2}", title: "Show B", required_size_class: SMALL, required_loadin_hours: 24, required_loadout_hours: 24 }
              as: CompanyRep
              as_user_id: "${comp2}"
              captures: { prod_b: $.data.id }
            - call: "POST /theatres/bookings"
              payload: { production_id: "${prod_a}", theatre_id: "${house_id}", loadin_start: "2026-09-06T00:00:00Z", run_end: "2026-11-01T00:00:00Z" }
              as: CompanyRep
              as_user_id: "${comp1}"
              captures: { bk_a: $.data.id }
            - call: "POST /theatres/bookings"
              payload: { production_id: "${prod_b}", theatre_id: "${house_id}", loadin_start: "2026-09-10T00:00:00Z", run_end: "2026-11-10T00:00:00Z" }
              as: CompanyRep
              as_user_id: "${comp2}"
              captures: { bk_b: $.data.id }
            - call: "POST /theatres/bookings/${bk_a}/approve"
              payload: {}
              as: HouseManager
          trigger:
            - call: "POST /theatres/bookings/${bk_b}/approve"
              payload: {}
              as: HouseManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE with http 409 (state priority 3 wins over business_temporal priority 5, even though B's window genuinely overlaps A's)"

      - name: business_safety_vs_business_referential_on_crew
        grounds:
          - validations[priority=4]
          - validations[priority=6]
        distinguishing_aspect: |
          Different category pair: business_safety (priority 4, union crew
          minimum) vs business_referential (priority 6, size-class fit).
          Booking-create on an undersized theatre with an also-impossible crew
          implication must surface ERR_SIZE_CLASS_MISMATCH; conversely a
          crew-assignment below union minimum on a properly sized booking
          surfaces ERR_UNION_MIN_CREW_VIOLATION — the two errors never swap
          categories.
        test_recipe:
          setup:
            - "LARGE-required production; SMALL theatre available"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: HouseManager
            - call: "POST /theatres/companies"
              payload: { name: "P3Co", contact_email: "p3@x.com" }
              as: HouseManager
              captures: { comp1: $.data.id }
            - call: "POST /theatres/houses"
              payload: { name: "TinyHouse", capacity: 300, size_class: SMALL, is_landmark: false, base_weekly_rent_cents: 300000 }
              as: HouseManager
              captures: { house_id: $.data.id }
            - call: "POST /theatres/productions"
              payload: { company_id: "${comp1}", title: "Big Show", required_size_class: LARGE, required_loadin_hours: 24, required_loadout_hours: 24 }
              as: CompanyRep
              as_user_id: "${comp1}"
              captures: { prod_a: $.data.id }
          trigger:
            - call: "POST /theatres/bookings"
              payload: { production_id: "${prod_a}", theatre_id: "${house_id}", loadin_start: "2026-09-06T00:00:00Z", run_end: "2026-11-01T00:00:00Z" }
              as: CompanyRep
              as_user_id: "${comp1}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SIZE_CLASS_MISMATCH with http 422 (business_referential category, distinct from the business_safety union-crew error)"

