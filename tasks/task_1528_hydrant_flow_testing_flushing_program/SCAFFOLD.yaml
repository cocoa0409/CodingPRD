# =============================================================================
# SCAFFOLD.yaml — Hydrant Flow Testing & Flushing Program
# =============================================================================

scenario: |
  Hydrant Flow Testing & Flushing Program (water distribution operations): hydrant inventory & inspection cycle, flow test scheduling & fire-flow result recording, unidirectional flushing sequence & valve operation, discolored-water complaint linkage & dechlorination, out-of-service hydrant tagging & fire-department notification, repair work order & parts, ISO rating documentation, private hydrant responsibility

domain_name: hydrant-flow-testing
api_prefix: /

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: FlushingProgram
    parent: null
    common_fields: true
    fields:
      - { name: program_year, type: integer, source: input, description: "Calendar year of the seasonal program" }
      - { name: season, type: enum, source: input, description: "SPRING | FALL; (program_year, season) must be unique" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED; initial OPEN", default: "OPEN" }
      - { name: hydrants_out_of_service_count, type: integer, source: computed, default: 0, description: "Count of this program's Hydrants with status OUT_OF_SERVICE; maintained by outage create/close cascades" }
      - { name: unacknowledged_notification_count, type: integer, source: computed, default: 0, description: "Count of ACTIVE HydrantOutages on this program's hydrants with notification_status PENDING" }

  - name: PressureZone
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Zone name" }
      - { name: cooldown_minutes, type: integer, source: input, default: 60, description: "Minimum minutes between the window of any two non-terminal FlushSequences in this zone" }

  - name: PrivateOwner
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Owner organization name" }
      - { name: contact_email, type: string, source: input, description: "Owner contact email" }

  - name: Hydrant
    parent: null
    common_fields: true
    fields:
      - { name: hydrant_number, type: string, source: input, description: "Globally unique hydrant tag" }
      - { name: program_id, type: string, source: input, description: "FK -> FlushingProgram.id; owning seasonal program" }
      - { name: zone_id, type: string, source: input, description: "FK -> PressureZone.id; pressure zone the hydrant sits in" }
      - { name: ownership, type: enum, source: input, description: "MUNICIPAL | PRIVATE" }
      - { name: private_owner_id, type: string, source: input, description: "FK -> PrivateOwner.id; REQUIRED iff ownership == PRIVATE, FORBIDDEN otherwise (conditional-required, violation -> ERR_INVALID_REQUEST)" }
      - { name: required_fire_flow_gpm, type: integer, source: input, description: "Required fire flow for this hydrant's location (gpm)" }
      - { name: outlet_diameter_in, type: number, source: input, default: 2.5, description: "Pumper outlet diameter in inches" }
      - { name: discharge_coefficient, type: number, source: input, default: 0.9, description: "Outlet discharge coefficient for pitot flow" }
      - { name: status, type: enum, source: system, default: "IN_SERVICE", description: "IN_SERVICE | OUT_OF_SERVICE | DECOMMISSIONED" }
      - { name: active_outage_id, type: string, source: system, description: "FK -> HydrantOutage.id; set while an outage is ACTIVE, null otherwise" }
      - { name: latest_inspection_id, type: string, source: system, description: "FK -> Inspection.id; most recently created inspection; updated on every inspection create (bumps version)" }
      - { name: last_verified_inspection_date, type: datetime, source: system, description: "performed_date of the most recently VERIFIED inspection; null until first verification" }
      - { name: inspection_tier, type: enum, source: computed, default: "CURRENT", description: "CURRENT | DUE_SOON | OVERDUE | CRITICAL; recomputed by inspection_due_tier calculation (sweep and verification)" }
      - { name: provisional_fire_flow_gpm, type: integer, source: computed, description: "flow_at_20psi_gpm of the latest non-terminal flow test (RESULTS_SUBMITTED or APPROVED); null when none" }
      - { name: approved_fire_flow_gpm, type: integer, source: computed, description: "flow_at_20psi_gpm of the latest APPROVED flow test only; null when none" }
      - { name: targeted_flush_pending, type: boolean, source: computed, default: false, description: "true while a COMPLAINT_AUTO FlushSequence for this hydrant is PLANNED or IN_PROGRESS" }

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - { name: hydrant_id, type: string, source: input, description: "FK -> Hydrant.id" }
      - { name: scheduled_date, type: datetime, source: input, description: "Planned inspection date" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | PENDING_VERIFICATION | VERIFIED | REJECTED" }
      - { name: performed_date, type: datetime, source: input, description: "Date the field work/evidence was produced; supplied at record time" }
      - { name: defects_found, type: boolean, source: input, description: "Whether defects were found; supplied at record time" }
      - { name: condition_notes, type: string, source: input, description: "Optional notes", default: "" }
      - { name: performed_by_user_id, type: string, source: system, description: "X-User-ID of the recorder" }
      - { name: verified_by_user_id, type: string, source: system, description: "X-User-ID of the verifying supervisor" }
      - { name: result, type: enum, source: computed, default: "NONE", description: "NONE | PASS | FAIL; set at verify: VERIFY with defects_found=false -> PASS, else FAIL" }

  - name: FlowTest
    parent: null
    common_fields: true
    fields:
      - { name: hydrant_id, type: string, source: input, description: "FK -> Hydrant.id" }
      - { name: window_start, type: datetime, source: input, description: "Scheduled window start (half-open interval [start, end))" }
      - { name: window_end, type: datetime, source: input, description: "Scheduled window end; must be > window_start" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | RESULTS_SUBMITTED | APPROVED | REJECTED | CANCELLED | MISSED" }
      - { name: static_psi, type: number, source: input, description: "Static pressure reading (results payload)" }
      - { name: residual_psi, type: number, source: input, description: "Residual pressure reading (results payload)" }
      - { name: pitot_psi, type: number, source: input, description: "Pitot pressure reading (results payload)" }
      - { name: pitot_flow_gpm, type: number, source: computed, description: "Pitot flow per pitot_flow calculation; null until results" }
      - { name: flow_at_20psi_gpm, type: integer, source: computed, description: "Available fire flow at 20 psi residual per flow_at_20psi calculation; null until results" }
      - { name: classification, type: enum, source: computed, default: "NONE", description: "NONE | PASS | FAIL; PASS iff flow_at_20psi_gpm >= hydrant.required_fire_flow_gpm" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID that submitted results" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID that reviewed" }
      - { name: cancel_reason, type: enum, source: system, description: "OPERATOR_CANCEL | OUTAGE_AUTO_CANCEL; null unless CANCELLED" }

  - name: FlushSequence
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> FlushingProgram.id; must equal the target hydrant's program_id (ERR_PROGRAM_MISMATCH)" }
      - { name: zone_id, type: string, source: input, description: "FK -> PressureZone.id" }
      - { name: hydrant_id, type: string, source: input, description: "FK -> Hydrant.id; flush target hydrant" }
      - { name: origin, type: enum, source: system, description: "SCHEDULED_PROGRAM (manual create) | COMPLAINT_AUTO (auto-created by complaint cluster)" }
      - { name: status, type: enum, source: system, default: "PLANNED", description: "PLANNED | IN_PROGRESS | COMPLETED | ABORTED" }
      - { name: window_start, type: datetime, source: input, description: "Planned window start" }
      - { name: window_end, type: datetime, source: input, description: "Planned window end; must be > window_start" }
      - { name: steps, type: array, source: input, description: "Ordered valve-operation steps: [{step_index, valve_tag, action: OPEN|CLOSE, status: PENDING|EXECUTED, executed_at, executed_by_user_id, flow_gpm, duration_minutes}]; step_index unique, dense from 1" }
      - { name: source_chlorine_residual_mg_L, type: number, source: input, description: "Chlorine residual measured at sequence start (dechlorination dosing basis)" }
      - { name: total_flushed_gallons, type: integer, source: computed, description: "Per flush_volume_total calculation; null until complete" }
      - { name: dechlorination_tablets_required, type: integer, source: computed, description: "Per dechlorination_tablets calculation; null until complete" }
      - { name: final_discharge_residual_mg_L, type: number, source: input, description: "Discharge chlorine residual at completion; must be <= 0.1" }

  - name: WaterQualityComplaint
    parent: null
    common_fields: true
    fields:
      - { name: hydrant_id, type: string, source: input, description: "FK -> Hydrant.id" }
      - { name: category, type: enum, source: input, description: "DISCOLORED_WATER | ODOR | TASTE | PRESSURE" }
      - { name: description, type: string, source: input, default: "", description: "Free-text description" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | LINKED | RESOLVED | DISMISSED" }
      - { name: flush_sequence_id, type: string, source: system, description: "FK -> FlushSequence.id; set when LINKED, cleared on abort compensation" }

  - name: HydrantOutage
    parent: null
    common_fields: true
    fields:
      - { name: hydrant_id, type: string, source: input, description: "FK -> Hydrant.id" }
      - { name: reason, type: enum, source: input, description: "VALVE_FAILURE | LEAK | DAMAGE | OTHER" }
      - { name: expected_return_date, type: datetime, source: input, description: "Optional expected return-to-service", default: null }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | CLOSED" }
      - { name: notification_status, type: enum, source: system, default: "PENDING", description: "PENDING | ACKNOWLEDGED; embedded fire-department notification" }
      - { name: notified_at, type: datetime, source: system, description: "Set to outage created_at (notification dispatched at tagging)" }
      - { name: ack_deadline, type: datetime, source: computed, description: "notified_at + 2 hours" }
      - { name: acknowledged_at, type: datetime, source: system, description: "Set on acknowledge" }
      - { name: acknowledged_by_user_id, type: string, source: system, description: "FireDeptLiaison X-User-ID" }
      - { name: escalated, type: boolean, source: computed, default: false, description: "Set true by sweep when clock > ack_deadline and notification still PENDING" }
      - { name: closed_at, type: datetime, source: system, description: "Set on close" }

  - name: RepairWorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: hydrant_id, type: string, source: input, description: "FK -> Hydrant.id" }
      - { name: source_inspection_id, type: string, source: system, description: "FK -> Inspection.id; set when auto-created by a FAIL verification, null otherwise" }
      - { name: description, type: string, source: input, description: "Work description" }
      - { name: budget_cap_cents, type: integer, source: input, description: "Optional budget cap; null = uncapped (budget check skipped)", default: null }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | SUBMITTED | APPROVED | COMPLETED | CANCELLED" }
      - { name: part_lines, type: array, source: input, description: "Lines [{part_id, qty, unit_price_cents, status: PENDING|RESERVED|CONSUMED|RELEASED}]; qty > 0; unit_price_cents null until approve snapshots it" }
      - { name: quoted_subtotal_cents, type: integer, source: computed, description: "Set at approve per work_order_total (quoted variant)" }
      - { name: quoted_discount_cents, type: integer, source: computed, description: "Set at approve" }
      - { name: quoted_fee_cents, type: integer, source: computed, description: "Set at approve" }
      - { name: quoted_total_cents, type: integer, source: computed, description: "Set at approve" }
      - { name: actual_total_cents, type: integer, source: computed, description: "Set at complete per work_order_total (actual variant, current Part prices)" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creator (or 'system' when auto-created by failed inspection)" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of approver" }
      - { name: last_rejection_reason, type: string, source: system, description: "Set on reject" }

  - name: Part
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Globally unique SKU" }
      - { name: name, type: string, source: input, description: "Part name" }
      - { name: unit_price_cents, type: integer, source: input, description: "Current unit price (cents)" }
      - { name: on_hand_qty, type: integer, source: input, description: "Physical quantity on hand; >= 0" }
      - { name: available_qty, type: integer, source: computed, description: "on_hand_qty minus sum of qty over all part_lines with status RESERVED across all work orders" }

  - name: ISOSnapshot
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> FlushingProgram.id; taken from the path of the create endpoint" }
      - { name: weighting_profile, type: enum, source: input, description: "MUNICIPAL_ONLY | ALL_HYDRANTS_HALF_PRIVATE" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | PUBLISHED | SUPERSEDED" }
      - { name: total_hydrants_in_scope, type: number, source: computed, description: "Weighted hydrant count at publish; null in DRAFT" }
      - { name: flow_coverage_pct, type: number, source: computed, description: "Weighted share of hydrants with an APPROVED flow test reviewed within 60 months; null in DRAFT" }
      - { name: inspection_compliance_pct, type: number, source: computed, description: "Weighted share of hydrants whose last VERIFIED inspection is within their cycle; null in DRAFT" }
      - { name: iso_points, type: number, source: computed, description: "round_half_up(100 * (0.6*flow_coverage + 0.4*inspection_compliance), 1); null in DRAFT" }
      - { name: published_at, type: datetime, source: system, description: "Set at publish" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: FlushingProgram
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /programs/{id}/close"
        actor: ProgramAdmin
        preconditions:
          - "Program must be OPEN (ERR_PROGRAM_NOT_OPEN)"
        side_effects:
          - "Program.status -> CLOSED; no child states are mutated"

  - entity: Hydrant
    initial_state: IN_SERVICE
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: IN_SERVICE
        to: OUT_OF_SERVICE
        trigger: "POST /outages (create outage for this hydrant)"
        actor: FieldOperator
        preconditions:
          - "Hydrant must be IN_SERVICE (ERR_HYDRANT_NOT_IN_SERVICE)"
          - "Hydrant's program must be OPEN (ERR_PROGRAM_NOT_OPEN)"
        side_effects:
          - "HydrantOutage created: status ACTIVE, notification_status PENDING, notified_at = now, ack_deadline = now + 2h"
          - "Hydrant.active_outage_id <- new outage id; Hydrant.version incremented"
          - "CASCADE hop 2 (from outage creation): FlushingProgram.hydrants_out_of_service_count += 1 and FlushingProgram.unacknowledged_notification_count += 1"
          - "CASCADE hop 3 (from hydrant leaving IN_SERVICE): every FlowTest of this hydrant in SCHEDULED -> CANCELLED with cancel_reason OUTAGE_AUTO_CANCEL (RESULTS_SUBMITTED and later states untouched)"
      - from: OUT_OF_SERVICE
        to: IN_SERVICE
        trigger: "POST /outages/{id}/close on the hydrant's ACTIVE outage"
        actor: FieldOperator
        preconditions:
          - "Outage must be ACTIVE (ERR_OUTAGE_NOT_ACTIVE)"
          - "Outage.notification_status must be ACKNOWLEDGED (ERR_NOTIFICATION_NOT_ACKNOWLEDGED)"
          - "No RepairWorkOrder for this hydrant in DRAFT, SUBMITTED, or APPROVED (ERR_OPEN_WORK_ORDERS_EXIST)"
        side_effects:
          - "Outage.status -> CLOSED, closed_at = now"
          - "Hydrant.status -> IN_SERVICE; Hydrant.active_outage_id <- null; Hydrant.version incremented"
          - "CASCADE: FlushingProgram.hydrants_out_of_service_count -= 1"
      - from: IN_SERVICE
        to: DECOMMISSIONED
        trigger: "POST /hydrants/{id}/decommission"
        actor: ProgramAdmin
        preconditions:
          - "Hydrant must be IN_SERVICE (ERR_HYDRANT_NOT_IN_SERVICE)"
        side_effects:
          - "Hydrant.status -> DECOMMISSIONED; excluded from ISO snapshot scope"

  - entity: Inspection
    initial_state: SCHEDULED
    terminal_states: [VERIFIED]
    transitions:
      - from: SCHEDULED
        to: PENDING_VERIFICATION
        trigger: "POST /inspections/{id}/record"
        actor: "FieldOperator (MUNICIPAL hydrant) or PrivateOwnerRep (own PRIVATE hydrant)"
        preconditions:
          - "Inspection must be SCHEDULED or REJECTED (ERR_INSPECTION_NOT_RECORDABLE)"
          - "Ownership scope: MUNICIPAL hydrant requires FieldOperator; PRIVATE hydrant requires PrivateOwnerRep whose X-User-ID == hydrant.private_owner_id (ERR_HYDRANT_OWNERSHIP_MISMATCH)"
        side_effects:
          - "performed_date, defects_found, condition_notes stored; performed_by_user_id <- X-User-ID"
      - from: REJECTED
        to: PENDING_VERIFICATION
        trigger: "POST /inspections/{id}/record (resubmission loop)"
        actor: "FieldOperator or PrivateOwnerRep (same scoping)"
        preconditions:
          - "Inspection must be SCHEDULED or REJECTED (ERR_INSPECTION_NOT_RECORDABLE)"
          - "Ownership scope as above (ERR_HYDRANT_OWNERSHIP_MISMATCH)"
        side_effects:
          - "performed_date, defects_found overwritten; performed_by_user_id <- X-User-ID"
      - from: PENDING_VERIFICATION
        to: VERIFIED
        trigger: "POST /inspections/{id}/verify with decision VERIFY"
        actor: UtilitySupervisor
        preconditions:
          - "Inspection must be PENDING_VERIFICATION (ERR_INSPECTION_NOT_PENDING_VERIFICATION)"
          - "X-User-ID != performed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "result <- PASS if defects_found == false else FAIL; verified_by_user_id <- X-User-ID"
          - "Hydrant.last_verified_inspection_date <- performed_date; Hydrant.version incremented; inspection_due_tier recomputed for the hydrant"
          - "CASCADE (result FAIL only): auto-create RepairWorkOrder(status DRAFT, hydrant_id <- inspection.hydrant_id, source_inspection_id <- inspection.id, created_by_user_id <- 'system', description <- 'Auto-generated from failed inspection')"
      - from: PENDING_VERIFICATION
        to: REJECTED
        trigger: "POST /inspections/{id}/verify with decision REJECT"
        actor: UtilitySupervisor
        preconditions:
          - "Inspection must be PENDING_VERIFICATION (ERR_INSPECTION_NOT_PENDING_VERIFICATION)"
          - "X-User-ID != performed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "verified_by_user_id <- X-User-ID; result stays NONE"

  - entity: FlowTest
    initial_state: SCHEDULED
    terminal_states: [APPROVED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: RESULTS_SUBMITTED
        trigger: "POST /flow-tests/{id}/results"
        actor: FieldOperator
        preconditions:
          - "FlowTest must be SCHEDULED (ERR_FLOW_TEST_NOT_SCHEDULED)"
          - "Logical clock must be within [window_start, window_end]: before start -> ERR_FLOW_TEST_WINDOW_NOT_STARTED; after end -> ERR_FLOW_TEST_WINDOW_EXPIRED"
          - "Pressure validity: static_psi > residual_psi AND residual_psi > 20 (ERR_PRESSURE_READING_INVALID)"
        side_effects:
          - "pitot_flow_gpm and flow_at_20psi_gpm computed; classification computed"
          - "recorded_by_user_id <- X-User-ID"
          - "Hydrant.provisional_fire_flow_gpm <- flow_at_20psi_gpm; Hydrant.version incremented"
      - from: RESULTS_SUBMITTED
        to: APPROVED
        trigger: "POST /flow-tests/{id}/review with decision APPROVE"
        actor: UtilitySupervisor
        preconditions:
          - "FlowTest must be RESULTS_SUBMITTED (ERR_FLOW_TEST_NOT_SUBMITTED)"
          - "X-User-ID != recorded_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "reviewed_by_user_id <- X-User-ID"
          - "Hydrant.approved_fire_flow_gpm <- flow_at_20psi_gpm; Hydrant.version incremented"
      - from: RESULTS_SUBMITTED
        to: REJECTED
        trigger: "POST /flow-tests/{id}/review with decision REJECT"
        actor: UtilitySupervisor
        preconditions:
          - "FlowTest must be RESULTS_SUBMITTED (ERR_FLOW_TEST_NOT_SUBMITTED)"
          - "X-User-ID != recorded_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "reviewed_by_user_id <- X-User-ID"
          - "Hydrant.provisional_fire_flow_gpm recomputed from remaining RESULTS_SUBMITTED or APPROVED tests (null if none); Hydrant.version incremented"
      - from: REJECTED
        to: SCHEDULED
        trigger: "POST /flow-tests/{id}/reschedule (retest loop)"
        actor: FieldOperator
        preconditions:
          - "FlowTest must be REJECTED or MISSED (ERR_FLOW_TEST_NOT_RESCHEDULABLE)"
          - "New window must be half-open non-overlapping with this hydrant's other SCHEDULED tests (ERR_FLOW_TEST_WINDOW_OVERLAP)"
        side_effects:
          - "window_start/window_end <- new values; status -> SCHEDULED"
      - from: MISSED
        to: SCHEDULED
        trigger: "POST /flow-tests/{id}/reschedule"
        actor: FieldOperator
        preconditions:
          - "FlowTest must be REJECTED or MISSED (ERR_FLOW_TEST_NOT_RESCHEDULABLE)"
          - "New window must be half-open non-overlapping with this hydrant's other SCHEDULED tests (ERR_FLOW_TEST_WINDOW_OVERLAP)"
        side_effects:
          - "window_start/window_end <- new values; status -> SCHEDULED"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /flow-tests/{id}/cancel"
        actor: FieldOperator
        preconditions:
          - "FlowTest must be SCHEDULED (ERR_FLOW_TEST_NOT_SCHEDULED)"
        side_effects:
          - "cancel_reason <- OPERATOR_CANCEL"
      - from: SCHEDULED
        to: MISSED
        trigger: "system (POST /programs/{id}/sweep when logical clock > window_end)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: FlushSequence
    initial_state: PLANNED
    terminal_states: [COMPLETED, ABORTED]
    transitions:
      - from: PLANNED
        to: IN_PROGRESS
        trigger: "POST /flush-sequences/{id}/start"
        actor: FieldOperator
        preconditions:
          - "Sequence must be PLANNED (ERR_SEQUENCE_NOT_PLANNED)"
          - "Hydrant must be IN_SERVICE (ERR_HYDRANT_NOT_IN_SERVICE)"
        side_effects:
          - "source_chlorine_residual_mg_L stored"
      - from: IN_PROGRESS
        to: IN_PROGRESS
        trigger: "POST /flush-sequences/{id}/execute-step (step self-transition; one step per call)"
        actor: FieldOperator
        preconditions:
          - "Sequence must be IN_PROGRESS (ERR_SEQUENCE_NOT_IN_PROGRESS)"
          - "steps[step_index] must exist and be PENDING, and every step with smaller step_index must be EXECUTED (ERR_STEP_OUT_OF_SEQUENCE)"
        side_effects:
          - "Step -> EXECUTED with executed_at = now, executed_by_user_id, flow_gpm, duration_minutes recorded"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /flush-sequences/{id}/complete"
        actor: FieldOperator
        preconditions:
          - "Sequence must be IN_PROGRESS (ERR_SEQUENCE_NOT_IN_PROGRESS)"
          - "SAFETY (higher priority): final_discharge_residual_mg_L <= 0.1 (ERR_DECHLORINATION_LIMIT_EXCEEDED)"
          - "CONSTRAINT (lower priority): every step EXECUTED (ERR_STEPS_INCOMPLETE)"
        side_effects:
          - "total_flushed_gallons computed (per-step round_half_up then sum)"
          - "dechlorination_tablets_required computed from total_flushed_gallons and source_chlorine_residual_mg_L"
          - "CASCADE: every WaterQualityComplaint with flush_sequence_id == this sequence and status LINKED -> RESOLVED"
          - "CASCADE: Hydrant.targeted_flush_pending <- false; Hydrant.version incremented"
      - from: IN_PROGRESS
        to: ABORTED
        trigger: "POST /flush-sequences/{id}/abort"
        actor: FieldOperator
        preconditions:
          - "Sequence must be IN_PROGRESS (ERR_SEQUENCE_NOT_IN_PROGRESS)"
        side_effects:
          - "COMPENSATION: every WaterQualityComplaint with flush_sequence_id == this sequence -> OPEN with flush_sequence_id cleared"
          - "COMPENSATION: Hydrant.targeted_flush_pending <- false; Hydrant.version incremented"

  - entity: WaterQualityComplaint
    initial_state: OPEN
    terminal_states: [RESOLVED, DISMISSED]
    transitions:
      - from: OPEN
        to: LINKED
        trigger: "POST /complaints/{id}/link OR system (complaint cluster auto-creation)"
        actor: FieldOperator | system
        preconditions:
          - "Complaint must be OPEN (ERR_COMPLAINT_NOT_LINKABLE)"
          - "Manual link: target FlushSequence must be PLANNED (ERR_SEQUENCE_NOT_PLANNED) and sequence.hydrant_id == complaint.hydrant_id (ERR_LINK_HYDRANT_MISMATCH)"
        side_effects:
          - "flush_sequence_id <- target sequence"
      - from: LINKED
        to: RESOLVED
        trigger: "system (linked FlushSequence COMPLETED) OR POST /complaints/{id}/close with outcome RESOLVED"
        actor: system | UtilitySupervisor
        preconditions:
          - "Manual close with RESOLVED: complaint must be LINKED and its FlushSequence must be COMPLETED (ERR_LINKED_SEQUENCE_NOT_COMPLETED)"
        side_effects: []
      - from: OPEN
        to: DISMISSED
        trigger: "POST /complaints/{id}/close with outcome DISMISSED"
        actor: UtilitySupervisor
        preconditions:
          - "DISMISSED only from OPEN; from LINKED or any terminal state -> ERR_COMPLAINT_NOT_CLOSABLE"
        side_effects: []
      - from: LINKED
        to: OPEN
        trigger: "system (linked FlushSequence ABORTED — compensation)"
        actor: system
        preconditions: []
        side_effects:
          - "flush_sequence_id <- null"

  - entity: HydrantOutage
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /outages/{id}/close"
        actor: FieldOperator
        preconditions:
          - "Outage must be ACTIVE (ERR_OUTAGE_NOT_ACTIVE)"
          - "notification_status must be ACKNOWLEDGED (ERR_NOTIFICATION_NOT_ACKNOWLEDGED)"
          - "No RepairWorkOrder for this hydrant in DRAFT, SUBMITTED, or APPROVED (ERR_OPEN_WORK_ORDERS_EXIST)"
        side_effects:
          - "Hydrant.status -> IN_SERVICE; active_outage_id cleared"
          - "FlushingProgram.hydrants_out_of_service_count -= 1"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /outages/{id}/acknowledge-notification (notification self-transition)"
        actor: FireDeptLiaison
        preconditions:
          - "notification_status must be PENDING (ERR_NOTIFICATION_ALREADY_ACKNOWLEDGED)"
        side_effects:
          - "notification_status -> ACKNOWLEDGED; acknowledged_at <- now; acknowledged_by_user_id <- X-User-ID"
          - "FlushingProgram.unacknowledged_notification_count -= 1"

  - entity: RepairWorkOrder
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /work-orders/{id}/submit"
        actor: FieldOperator
        preconditions:
          - "Work order must be DRAFT (ERR_WORK_ORDER_NOT_DRAFT)"
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /work-orders/{id}/approve"
        actor: UtilitySupervisor
        preconditions:
          - "OCC: expected_work_order_version must equal current version (ERR_STALE_VERSION)"
          - "X-User-ID != created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "Work order must be SUBMITTED (ERR_WORK_ORDER_NOT_SUBMITTED)"
          - "Every part line: Part.available_qty >= qty (ERR_INSUFFICIENT_PART_QUANTITY)"
          - "If budget_cap_cents non-null: quoted_total_cents <= budget_cap_cents (ERR_WORK_ORDER_BUDGET_EXCEEDED)"
        side_effects:
          - "quoted totals computed per work_order_total (quoted variant) with Part.unit_price_cents snapshot into each line"
          - "Each part_line.status -> RESERVED; Part.available_qty recomputed for affected parts"
          - "RepairWorkOrder.version incremented; approved_by_user_id <- X-User-ID"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /work-orders/{id}/reject (revision loop)"
        actor: UtilitySupervisor
        preconditions:
          - "Work order must be SUBMITTED (ERR_WORK_ORDER_NOT_SUBMITTED)"
        side_effects:
          - "last_rejection_reason <- input; status -> DRAFT (lines editable again)"
      - from: APPROVED
        to: COMPLETED
        trigger: "POST /work-orders/{id}/complete"
        actor: FieldOperator
        preconditions:
          - "Work order must be APPROVED (ERR_WORK_ORDER_NOT_APPROVED)"
        side_effects:
          - "Each part_line.status -> CONSUMED; Part.on_hand_qty -= qty for each line's part; Part.available_qty recomputed"
          - "actual_total_cents computed per work_order_total (actual variant) using CURRENT Part.unit_price_cents"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: FieldOperator
        preconditions:
          - "Work order must be DRAFT, SUBMITTED, or APPROVED (ERR_WORK_ORDER_NOT_CANCELLABLE)"
        side_effects: []
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: FieldOperator
        preconditions:
          - "Work order must be DRAFT, SUBMITTED, or APPROVED (ERR_WORK_ORDER_NOT_CANCELLABLE)"
        side_effects: []
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: FieldOperator
        preconditions:
          - "Work order must be DRAFT, SUBMITTED, or APPROVED (ERR_WORK_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "COMPENSATION: each part_line.status -> RELEASED; Part.available_qty recomputed (on_hand_qty untouched)"

  - entity: ISOSnapshot
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /iso-snapshots/{id}/publish"
        actor: ProgramAdmin
        preconditions:
          - "Snapshot must be DRAFT (ERR_SNAPSHOT_NOT_DRAFT)"
          - "Program must have >= 1 hydrant not in DECOMMISSIONED (ERR_NO_HYDRANTS_IN_SCOPE)"
          - "Program.unacknowledged_notification_count must be 0 (ERR_UNACKNOWLEDGED_NOTIFICATIONS)"
        side_effects:
          - "Metrics computed per iso_rating_points with the snapshot's weighting_profile and pinned at publish"
          - "published_at <- now"
          - "Any other PUBLISHED snapshot for the same program -> SUPERSEDED"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system (another snapshot of the same program is published)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: inspection-create-stale-hydrant
    parent_entity: Hydrant
    write_endpoint: "POST /inspections"
    occ_field: "expected_hydrant_version"
    description: |
      Creating an Inspection against a Hydrant whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has mutated the hydrant (a new inspection, a flow
      result, a cascade) and the current writer's view of the hydrant is
      therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: work-order-approve-stale-version
    parent_entity: RepairWorkOrder
    write_endpoint: "POST /work-orders/{id}/approve"
    occ_field: "expected_work_order_version"
    description: |
      Approving a RepairWorkOrder whose version has advanced since the
      approver last observed it is rejected. This captures the case where
      the part-line set was edited after the approver's review, so the
      approval would otherwise rest on a stale view of the order.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: pitot_flow
    trigger: "POST /flow-tests/{id}/results"
    algorithm: forward_looking
    formula: |
      pitot_flow_gpm = 29.83 * hydrant.discharge_coefficient
                       * hydrant.outlet_diameter_in^2 * sqrt(pitot_psi)
      Stored rounded to 2 decimal places, round_half_up.
    input_set: "The FlowTest's results payload plus its Hydrant's outlet constants"
    constants:
      PITOT_K: 29.83
    precision: "2 decimal places, round_half_up"

  - name: flow_at_20psi
    trigger: "POST /flow-tests/{id}/results (after pitot_flow)"
    algorithm: tiered_pricing
    formula: |
      Q20 = pitot_flow_UNROUNDED * ((static_psi - 20) / (static_psi - residual_psi)) ^ 0.54
      flow_at_20psi_gpm = round_half_up(Q20, 0 decimal places)   # whole gpm
      classification = PASS if flow_at_20psi_gpm >= hydrant.required_fire_flow_gpm else FAIL
      Evaluation order pinned: compute pitot flow unrounded, then Q20, then round once.
      Validity gate (before any arithmetic): static_psi > residual_psi AND residual_psi > 20.
    input_set: "static_psi, residual_psi, pitot_psi from results; hydrant.required_fire_flow_gpm"
    constants:
      EXTRAPOLATION_EXPONENT: 0.54
      REFERENCE_RESIDUAL_PSI: 20
    precision: "0 decimal places (whole gpm), round_half_up"

  - name: hydrant_available_fire_flow
    trigger: "FlowTest results submission, review approval, review rejection"
    algorithm: aggregation
    formula: |
      Candidate set: this hydrant's FlowTests.
      Order by recorded_at (results submission time) — fallback for equal timestamps:
      created_at ASC. Take the most recent element of the filtered set.
    input_set: "FlowTests of this hydrant; variant determines the status filter"
    precision: "whole gpm"
    variants:
      - name: provisional
        when: "Operational reads: Hydrant.provisional_fire_flow_gpm"
        difference: "Includes FlowTests in RESULTS_SUBMITTED or APPROVED"
      - name: approved
        when: "Regulatory/ISO reads: Hydrant.approved_fire_flow_gpm"
        difference: "Includes FlowTests in APPROVED only; identical data yields a different (or null) value whenever the latest test is unreviewed"

  - name: flush_volume_total
    trigger: "POST /flush-sequences/{id}/complete"
    algorithm: aggregation
    formula: |
      For each EXECUTED step i: volume_i = round_half_up(flow_gpm_i * duration_minutes_i, 0)
      total_flushed_gallons = SUM(volume_i)
      Rounding order PINNED: round each step to whole gallons first, then sum.
      (Sum-then-round is a different, forbidden order and yields a different total.)
    input_set: "EXECUTED steps of this sequence, all of which exist when completion is allowed"
    precision: "0 decimal places (whole gallons), round_half_up per step"

  - name: dechlorination_tablets
    trigger: "POST /flush-sequences/{id}/complete (after flush_volume_total)"
    algorithm: threshold
    formula: |
      chlorine_mass_mg = total_flushed_gallons * 3.785 * source_chlorine_residual_mg_L
      dechlorination_tablets_required = ceil(chlorine_mass_mg / 8500)
      Chained dependency: consumes the already-rounded total_flushed_gallons.
    input_set: "This sequence's total_flushed_gallons and source_chlorine_residual_mg_L"
    constants:
      LITERS_PER_GALLON: 3.785
      TABLET_NEUTRALIZES_MG: 8500
      DISCHARGE_LIMIT_MG_L: 0.1
    precision: "integer tablets, ceiling"

  - name: inspection_due_tier
    trigger: "POST /programs/{id}/sweep (all hydrants of the program) and after each successful inspection verify (that hydrant only)"
    algorithm: threshold
    formula: |
      cycle_months = 12 if hydrant.ownership == MUNICIPAL else 6
      baseline = hydrant.last_verified_inspection_date, else hydrant.created_at
      due_date = baseline + cycle_months months
      now = logical clock
      now <  due_date - 30 days            -> CURRENT
      due_date - 30 days <= now < due_date -> DUE_SOON
      due_date <= now < due_date + 90 days -> OVERDUE
      now >= due_date + 90 days            -> CRITICAL
      Boundaries pinned: exactly due_date -> OVERDUE; exactly due_date - 30 days -> DUE_SOON;
      exactly due_date + 90 days -> CRITICAL.
    input_set: "Hydrants of the swept program (sweep) or the single verified hydrant (verify)"
    constants:
      MUNICIPAL_CYCLE_MONTHS: 12
      PRIVATE_CYCLE_MONTHS: 6
      DUE_SOON_DAYS: 30
      CRITICAL_DAYS: 90

  - name: complaint_cluster
    trigger: "POST /complaints"
    algorithm: aggregation
    formula: |
      After inserting the new complaint:
      cluster = count of WaterQualityComplaints with
        hydrant_id == new.hydrant_id AND category == DISCOLORED_WATER
        AND status IN {OPEN, LINKED}
        AND created_at IN [now - 72 hours, now]   (both bounds inclusive)
      IF cluster >= 3
         AND hydrant.status == IN_SERVICE
         AND no FlushSequence for this hydrant with origin == COMPLAINT_AUTO
             and status IN {PLANNED, IN_PROGRESS} exists
      THEN auto-create FlushSequence(origin COMPLAINT_AUTO, program_id <- hydrant.program_id,
           zone_id <- hydrant.zone_id, hydrant_id <- hydrant.id, status PLANNED,
           window_start = now + 24h, window_end = now + 28h,
           steps = single step [{step_index 1, valve_tag 'MAIN', action OPEN, status PENDING}])
      AND every complaint counted in the cluster -> LINKED to it (flush_sequence_id set)
      AND hydrant.targeted_flush_pending <- true.
      Otherwise complaints stay OPEN and nothing else changes.
      Boundary pinned: the 3rd qualifying complaint triggers; the 2nd does not (>= 3).
    input_set: "This hydrant's DISCOLORED_WATER complaints in the rolling 72h window"
    constants:
      CLUSTER_THRESHOLD: 3
      CLUSTER_WINDOW_HOURS: 72
      AUTO_SEQUENCE_DELAY_HOURS: 24
      AUTO_SEQUENCE_DURATION_HOURS: 4

  - name: part_available_qty
    trigger: "Part create/restock; work-order approve, complete, cancel-from-APPROVED"
    algorithm: aggregation
    formula: |
      Part.available_qty = Part.on_hand_qty
        - SUM(line.qty for every part_line with status == RESERVED
              across ALL RepairWorkOrders where line.part_id == Part.id)
      Invariant: approve (reserve) followed by cancel (release) leaves available_qty
      identical to its value before the pair.
    input_set: "All RepairWorkOrder part_lines referencing this part"
    precision: "integer quantity"

  - name: work_order_total
    trigger: "POST /work-orders/{id}/approve (quoted variant); POST /work-orders/{id}/complete (actual variant)"
    algorithm: tiered_pricing
    formula: |
      Evaluation order PINNED (circular-looking dependency resolved):
      1. line_amount_i = qty_i * unit_price_i          (integer cents, no rounding)
      2. subtotal = SUM(line_amount_i)
      3. discount_pct = 10% if subtotal >= 100000 else 5% if subtotal >= 20000 else 0
      4. discount = round_half_up(subtotal * discount_pct, 0)
      5. discounted = subtotal - discount
      6. fee = 1500 if discounted < 25000 else 0       (strictly less; discounted == 25000 -> no fee)
      7. total = discounted + fee
      Tier boundaries pinned: subtotal exactly 20000 -> 5%; exactly 100000 -> 10%.
    input_set: "The work order's part lines; unit price source depends on variant"
    constants:
      DISCOUNT_TIER1_CENTS: 20000
      DISCOUNT_TIER1_PCT: 0.05
      DISCOUNT_TIER2_CENTS: 100000
      DISCOUNT_TIER2_PCT: 0.10
      HANDLING_FEE_THRESHOLD_CENTS: 25000
      HANDLING_FEE_CENTS: 1500
    precision: "integer cents; discount round_half_up"
    variants:
      - name: quoted
        when: "At approve: quoted_subtotal_cents / quoted_discount_cents / quoted_fee_cents / quoted_total_cents"
        difference: "unit_price_i <- Part.unit_price_cents snapshot taken at approve time (stored on the line)"
      - name: actual
        when: "At complete: actual_total_cents"
        difference: "unit_price_i <- CURRENT Part.unit_price_cents at completion; identical quantities yield a different total whenever a restock changed the price between approve and complete"

  - name: iso_rating_points
    trigger: "POST /iso-snapshots/{id}/publish"
    algorithm: weighted_scoring
    formula: |
      Scope: hydrants of the snapshot's program with status != DECOMMISSIONED.
      Weight w per hydrant: MUNICIPAL -> 1.0; PRIVATE -> 0.5 under ALL_HYDRANTS_HALF_PRIVATE,
      excluded entirely under MUNICIPAL_ONLY.
      flow_current(h)      = true iff h has >= 1 APPROVED FlowTest whose review time
                             is within [now - 60 months, now]
      inspection_current(h)= true iff h.last_verified_inspection_date is within
                             [now - cycle_months(h) months, now]
      flow_coverage         = SUM(w * flow_current) / SUM(w)
      inspection_compliance = SUM(w * inspection_current) / SUM(w)
      iso_points = round_half_up(100 * (0.6 * flow_coverage + 0.4 * inspection_compliance), 1)
      total_hydrants_in_scope = SUM(w)
      flow_coverage_pct = round_half_up(100 * flow_coverage, 1); same for compliance.
    input_set: "Program hydrants not DECOMMISSIONED; their APPROVED flow tests and VERIFIED inspections as of publish time"
    constants:
      FLOW_WEIGHT: 0.6
      INSPECTION_WEIGHT: 0.4
      ISO_FLOW_LOOKBACK_MONTHS: 60
      PRIVATE_WEIGHT: 0.5
    precision: "1 decimal place, round_half_up"
    variants:
      - name: municipal_only
        when: "weighting_profile == MUNICIPAL_ONLY"
        difference: "PRIVATE hydrants excluded from numerator and denominator"
      - name: half_private
        when: "weighting_profile == ALL_HYDRANTS_HALF_PRIVATE"
        difference: "PRIVATE hydrants counted at weight 0.5; identical program data yields different iso_points under the two profiles"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Request body schema: required fields present, types valid, enum values valid, unknown fields rejected, window_end > window_end-start ordering (window_end > window_start), qty > 0, conditional-required private_owner_id present iff ownership == PRIVATE"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"
  - priority: 3
    category: auth
    check: "X-User-Role must be in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 4
    category: auth
    check: "Ownership scope on POST /inspections/{id}/record: MUNICIPAL hydrant requires FieldOperator; PRIVATE hydrant requires PrivateOwnerRep with X-User-ID == hydrant.private_owner_id"
    error_id: ERR_HYDRANT_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "POST /inspections/{id}/record"
  - priority: 5
    category: existence
    check: "Path resource ids must exist (validated left-to-right); body FK references (hydrant_id, program_id, zone_id, private_owner_id, part_id, flush_sequence_id) must exist"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with resource references"
  - priority: 6
    category: auth
    check: "Segregation of duties: verify/review/approve actor X-User-ID must differ from the recorded performer/creator"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /inspections/{id}/verify, POST /flow-tests/{id}/review, POST /work-orders/{id}/approve"
  - priority: 7
    category: state
    check: "OCC: expected_hydrant_version == Hydrant.version; expected_work_order_version == RepairWorkOrder.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /inspections, POST /work-orders/{id}/approve"
  - priority: 8
    category: state
    check: "Target resource state preconditions per state machine (program OPEN, hydrant IN_SERVICE, inspection recordable/pending, flow test scheduled/submitted, sequence planned/in-progress, complaint linkable/closable, outage active, work-order draft/submitted/approved, snapshot draft, notification pending)"
    error_id: "state-specific (ERR_PROGRAM_NOT_OPEN, ERR_HYDRANT_NOT_IN_SERVICE, ERR_INSPECTION_NOT_RECORDABLE, ERR_INSPECTION_NOT_PENDING_VERIFICATION, ERR_FLOW_TEST_NOT_SCHEDULED, ERR_FLOW_TEST_NOT_SUBMITTED, ERR_FLOW_TEST_NOT_RESCHEDULABLE, ERR_SEQUENCE_NOT_PLANNED, ERR_SEQUENCE_NOT_IN_PROGRESS, ERR_COMPLAINT_NOT_LINKABLE, ERR_COMPLAINT_NOT_CLOSABLE, ERR_OUTAGE_NOT_ACTIVE, ERR_NOTIFICATION_ALREADY_ACKNOWLEDGED, ERR_NOTIFICATION_NOT_ACKNOWLEDGED, ERR_WORK_ORDER_NOT_DRAFT, ERR_WORK_ORDER_NOT_SUBMITTED, ERR_WORK_ORDER_NOT_APPROVED, ERR_WORK_ORDER_NOT_CANCELLABLE, ERR_SNAPSHOT_NOT_DRAFT)"
    http_status: 409
    applies_to: "state transition endpoints"
  - priority: 9
    category: business_safety
    check: "Pressure readings physically valid (static_psi > residual_psi AND residual_psi > 20) -> ERR_PRESSURE_READING_INVALID; discharge residual within limit (final_discharge_residual_mg_L <= 0.1) -> ERR_DECHLORINATION_LIMIT_EXCEEDED"
    error_id: "ERR_PRESSURE_READING_INVALID | ERR_DECHLORINATION_LIMIT_EXCEEDED"
    http_status: 422
    applies_to: "POST /flow-tests/{id}/results, POST /flush-sequences/{id}/complete"
  - priority: 10
    category: business_constraint
    check: "Uniqueness (hydrant_number, (program_year, season), part sku); program match (sequence.program_id == hydrant.program_id -> ERR_PROGRAM_MISMATCH); step ordering (ERR_STEP_OUT_OF_SEQUENCE); all steps executed (ERR_STEPS_INCOMPLETE); no open work orders on outage close (ERR_OPEN_WORK_ORDERS_EXIST); ISO publish gates (ERR_UNACKNOWLEDGED_NOTIFICATIONS, ERR_NO_HYDRANTS_IN_SCOPE)"
    error_id: "ERR_HYDRANT_NUMBER_NOT_UNIQUE | ERR_PROGRAM_ALREADY_EXISTS | ERR_PART_SKU_NOT_UNIQUE | ERR_PROGRAM_MISMATCH | ERR_STEP_OUT_OF_SEQUENCE | ERR_STEPS_INCOMPLETE | ERR_OPEN_WORK_ORDERS_EXIST | ERR_UNACKNOWLEDGED_NOTIFICATIONS | ERR_NO_HYDRANTS_IN_SCOPE"
    http_status: 409
    applies_to: "create and action endpoints as listed"
  - priority: 11
    category: business_temporal
    check: "Flow-test window half-open overlap on same hydrant (ERR_FLOW_TEST_WINDOW_OVERLAP); results submitted outside window (ERR_FLOW_TEST_WINDOW_NOT_STARTED before, ERR_FLOW_TEST_WINDOW_EXPIRED after); zone cooldown buffer between sequences (ERR_SEQUENCE_ZONE_COOLDOWN)"
    error_id: "ERR_FLOW_TEST_WINDOW_OVERLAP | ERR_FLOW_TEST_WINDOW_NOT_STARTED | ERR_FLOW_TEST_WINDOW_EXPIRED | ERR_SEQUENCE_ZONE_COOLDOWN"
    http_status: 409
    applies_to: "POST /flow-tests, POST /flow-tests/{id}/reschedule, POST /flow-tests/{id}/results, POST /flush-sequences"
  - priority: 12
    category: business_referential
    check: "Manual complaint link: sequence PLANNED and sequence.hydrant_id == complaint.hydrant_id (ERR_LINK_HYDRANT_MISMATCH); manual RESOLVED close requires linked sequence COMPLETED (ERR_LINKED_SEQUENCE_NOT_COMPLETED)"
    error_id: "ERR_LINK_HYDRANT_MISMATCH | ERR_LINKED_SEQUENCE_NOT_COMPLETED"
    http_status: 422
    applies_to: "POST /complaints/{id}/link, POST /complaints/{id}/close"
  - priority: 13
    category: business_fiscal
    check: "Part availability per line (Part.available_qty >= qty -> ERR_INSUFFICIENT_PART_QUANTITY), then budget cap (quoted_total_cents <= budget_cap_cents when cap non-null -> ERR_WORK_ORDER_BUDGET_EXCEEDED)"
    error_id: "ERR_INSUFFICIENT_PART_QUANTITY | ERR_WORK_ORDER_BUDGET_EXCEEDED"
    http_status: 422
    applies_to: "POST /work-orders/{id}/approve"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- FlushingProgram ---
  - method: POST
    path: "/programs"
    description: "Create a seasonal flushing program"
    roles: [ProgramAdmin]
    code: 201
    input: [program_year, season]
    output: FlushingProgram
    side_effects: ["status OPEN; counters 0"]
  - method: GET
    path: "/programs/{id}"
    description: "Get a program (including computed counters)"
    roles: [ProgramAdmin, FieldOperator, UtilitySupervisor, FireDeptLiaison, PrivateOwnerRep]
    code: 200
    input: []
    output: FlushingProgram
    side_effects: []
  - method: POST
    path: "/programs/{id}/close"
    description: "Close a program (gates new operational records)"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: FlushingProgram
    side_effects: ["status -> CLOSED"]
  - method: POST
    path: "/programs/{id}/sweep"
    description: "Ops-run checkpoint: recompute inspection tiers, expire stale flow tests to MISSED, escalate overdue notifications"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: { missed_flow_tests: integer, escalated_outages: integer, tier_recomputed_hydrants: integer }
    side_effects:
      - "inspection_due_tier recomputed for every hydrant of the program"
      - "SCHEDULED FlowTests of program hydrants with window_end < now -> MISSED"
      - "ACTIVE outages of program hydrants with notification PENDING and now > ack_deadline -> escalated = true"

  # --- PressureZone ---
  - method: POST
    path: "/zones"
    description: "Create a pressure zone"
    roles: [ProgramAdmin]
    code: 201
    input: [name, "cooldown_minutes?"]
    output: PressureZone
    side_effects: []

  # --- PrivateOwner ---
  - method: POST
    path: "/private-owners"
    description: "Register a private hydrant owner"
    roles: [ProgramAdmin]
    code: 201
    input: [name, contact_email]
    output: PrivateOwner
    side_effects: []

  # --- Hydrant ---
  - method: POST
    path: "/hydrants"
    description: "Register a hydrant in the inventory"
    roles: [ProgramAdmin]
    code: 201
    input: [hydrant_number, program_id, zone_id, ownership, "private_owner_id?", required_fire_flow_gpm, "outlet_diameter_in?", "discharge_coefficient?"]
    output: Hydrant
    side_effects: ["status IN_SERVICE; inspection_tier CURRENT; computed flow fields null"]
  - method: GET
    path: "/hydrants"
    description: "List hydrants with filters"
    roles: [ProgramAdmin, FieldOperator, UtilitySupervisor, FireDeptLiaison, PrivateOwnerRep]
    code: 200
    input: ["program_id?", "zone_id?", "private_owner_id?", "status?", "active_outage_id?", "latest_inspection_id?", "limit?", "offset?"]
    output: "Hydrant[]"
    side_effects: []
  - method: GET
    path: "/hydrants/{id}"
    description: "Get a hydrant"
    roles: [ProgramAdmin, FieldOperator, UtilitySupervisor, FireDeptLiaison, PrivateOwnerRep]
    code: 200
    input: []
    output: Hydrant
    side_effects: []
  - method: POST
    path: "/hydrants/{id}/decommission"
    description: "Decommission an in-service hydrant"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Hydrant
    side_effects: ["status -> DECOMMISSIONED"]

  # --- Inspection ---
  - method: POST
    path: "/inspections"
    description: "Open an inspection for a hydrant (OCC on hydrant version)"
    roles: [FieldOperator]
    code: 201
    input: [hydrant_id, scheduled_date, expected_hydrant_version]
    output: Inspection
    side_effects:
      - "Hydrant.latest_inspection_id <- new inspection id; increments Hydrant.version by 1"
  - method: GET
    path: "/inspections"
    description: "List inspections with filters"
    roles: [ProgramAdmin, FieldOperator, UtilitySupervisor, FireDeptLiaison, PrivateOwnerRep]
    code: 200
    input: ["hydrant_id?", "status?", "limit?", "offset?"]
    output: "Inspection[]"
    side_effects: []
  - method: GET
    path: "/inspections/{id}"
    description: "Get an inspection"
    roles: [ProgramAdmin, FieldOperator, UtilitySupervisor, FireDeptLiaison, PrivateOwnerRep]
    code: 200
    input: []
    output: Inspection
    side_effects: []
  - method: POST
    path: "/inspections/{id}/record"
    description: "Record field findings (municipal) or owner evidence (private)"
    roles: [FieldOperator, PrivateOwnerRep]
    code: 200
    input: [performed_date, defects_found, "condition_notes?"]
    output: Inspection
    side_effects: ["status -> PENDING_VERIFICATION; performed_by_user_id <- X-User-ID"]
  - method: POST
    path: "/inspections/{id}/verify"
    description: "Verify or reject recorded findings; FAIL verification auto-creates a draft work order"
    roles: [UtilitySupervisor]
    code: 200
    input: [decision]
    output: Inspection
    side_effects:
      - "decision VERIFY -> VERIFIED with result PASS|FAIL; hydrant.last_verified_inspection_date updated"
      - "result FAIL -> auto-create RepairWorkOrder in DRAFT with source_inspection_id"
      - "decision REJECT -> REJECTED"

  # --- FlowTest ---
  - method: POST
    path: "/flow-tests"
    description: "Schedule a fire-flow test"
    roles: [FieldOperator]
    code: 201
    input: [hydrant_id, window_start, window_end]
    output: FlowTest
    side_effects: ["status SCHEDULED"]
  - method: GET
    path: "/flow-tests"
    description: "List flow tests with filters"
    roles: [ProgramAdmin, FieldOperator, UtilitySupervisor, FireDeptLiaison, PrivateOwnerRep]
    code: 200
    input: ["hydrant_id?", "status?", "limit?", "offset?"]
    output: "FlowTest[]"
    side_effects: []
  - method: GET
    path: "/flow-tests/{id}"
    description: "Get a flow test"
    roles: [ProgramAdmin, FieldOperator, UtilitySupervisor, FireDeptLiaison, PrivateOwnerRep]
    code: 200
    input: []
    output: FlowTest
    side_effects: []
  - method: POST
    path: "/flow-tests/{id}/results"
    description: "Record pressure readings; computes pitot flow, flow at 20 psi, classification"
    roles: [FieldOperator]
    code: 200
    input: [static_psi, residual_psi, pitot_psi]
    output: FlowTest
    side_effects:
      - "pitot_flow and flow_at_20psi calculations; classification set"
      - "Hydrant.provisional_fire_flow_gpm <- flow_at_20psi_gpm; increments Hydrant.version by 1"
  - method: POST
    path: "/flow-tests/{id}/review"
    description: "Approve or reject submitted results"
    roles: [UtilitySupervisor]
    code: 200
    input: [decision]
    output: FlowTest
    side_effects:
      - "APPROVE -> APPROVED; Hydrant.approved_fire_flow_gpm updated; increments Hydrant.version by 1"
      - "REJECT -> REJECTED; provisional recomputed"
  - method: POST
    path: "/flow-tests/{id}/reschedule"
    description: "Reschedule a REJECTED or MISSED test (retest loop)"
    roles: [FieldOperator]
    code: 200
    input: [window_start, window_end]
    output: FlowTest
    side_effects: ["status -> SCHEDULED with new window"]
  - method: POST
    path: "/flow-tests/{id}/cancel"
    description: "Cancel a scheduled test"
    roles: [FieldOperator]
    code: 200
    input: []
    output: FlowTest
    side_effects: ["status -> CANCELLED, cancel_reason OPERATOR_CANCEL"]

  # --- FlushSequence ---
  - method: POST
    path: "/flush-sequences"
    description: "Plan a unidirectional flushing sequence"
    roles: [FieldOperator]
    code: 201
    input: [program_id, zone_id, hydrant_id, window_start, window_end, steps]
    output: FlushSequence
    side_effects: ["status PLANNED; origin SCHEDULED_PROGRAM"]
  - method: GET
    path: "/flush-sequences"
    description: "List flush sequences with filters"
    roles: [ProgramAdmin, FieldOperator, UtilitySupervisor, FireDeptLiaison, PrivateOwnerRep]
    code: 200
    input: ["program_id?", "zone_id?", "hydrant_id?", "status?", "limit?", "offset?"]
    output: "FlushSequence[]"
    side_effects: []
  - method: GET
    path: "/flush-sequences/{id}"
    description: "Get a flush sequence"
    roles: [ProgramAdmin, FieldOperator, UtilitySupervisor, FireDeptLiaison, PrivateOwnerRep]
    code: 200
    input: []
    output: FlushSequence
    side_effects: []
  - method: POST
    path: "/flush-sequences/{id}/start"
    description: "Begin execution; records source chlorine residual"
    roles: [FieldOperator]
    code: 200
    input: [source_chlorine_residual_mg_L]
    output: FlushSequence
    side_effects: ["status -> IN_PROGRESS"]
  - method: POST
    path: "/flush-sequences/{id}/execute-step"
    description: "Execute the next valve operation step in order"
    roles: [FieldOperator]
    code: 200
    input: [step_index, flow_gpm, duration_minutes]
    output: FlushSequence
    side_effects: ["steps[step_index] -> EXECUTED with measured flow and duration"]
  - method: POST
    path: "/flush-sequences/{id}/complete"
    description: "Complete the sequence; computes flushed volume and dechlorination dose; resolves linked complaints"
    roles: [FieldOperator]
    code: 200
    input: [final_discharge_residual_mg_L]
    output: FlushSequence
    side_effects:
      - "flush_volume_total and dechlorination_tablets calculations"
      - "LINKED complaints -> RESOLVED; Hydrant.targeted_flush_pending <- false"
  - method: POST
    path: "/flush-sequences/{id}/abort"
    description: "Abort an in-progress sequence; linked complaints revert to OPEN"
    roles: [FieldOperator]
    code: 200
    input: []
    output: FlushSequence
    side_effects: ["compensation: LINKED complaints -> OPEN, flush_sequence_id cleared"]

  # --- WaterQualityComplaint ---
  - method: POST
    path: "/complaints"
    description: "Log a water-quality complaint; DISCOLORED_WATER clusters may auto-create a targeted flush sequence"
    roles: [FieldOperator]
    code: 201
    input: [hydrant_id, category, "description?"]
    output: WaterQualityComplaint
    side_effects: ["complaint_cluster calculation; possible auto FlushSequence creation and LINKED cascade"]
  - method: GET
    path: "/complaints"
    description: "List complaints with filters"
    roles: [ProgramAdmin, FieldOperator, UtilitySupervisor, FireDeptLiaison, PrivateOwnerRep]
    code: 200
    input: ["hydrant_id?", "flush_sequence_id?", "status?", "limit?", "offset?"]
    output: "WaterQualityComplaint[]"
    side_effects: []
  - method: GET
    path: "/complaints/{id}"
    description: "Get a complaint"
    roles: [ProgramAdmin, FieldOperator, UtilitySupervisor, FireDeptLiaison, PrivateOwnerRep]
    code: 200
    input: []
    output: WaterQualityComplaint
    side_effects: []
  - method: POST
    path: "/complaints/{id}/link"
    description: "Manually link an open complaint to a planned sequence for the same hydrant"
    roles: [FieldOperator]
    code: 200
    input: [flush_sequence_id]
    output: WaterQualityComplaint
    side_effects: ["status -> LINKED"]
  - method: POST
    path: "/complaints/{id}/close"
    description: "Resolve (linked sequence completed) or dismiss (from OPEN) a complaint"
    roles: [UtilitySupervisor]
    code: 200
    input: [outcome]
    output: WaterQualityComplaint
    side_effects: ["status -> RESOLVED | DISMISSED"]

  # --- HydrantOutage ---
  - method: POST
    path: "/outages"
    description: "Tag a hydrant out of service; dispatches fire-department notification and cascades"
    roles: [FieldOperator]
    code: 201
    input: [hydrant_id, reason, "expected_return_date?"]
    output: HydrantOutage
    side_effects:
      - "Hydrant -> OUT_OF_SERVICE; program counters incremented"
      - "SCHEDULED flow tests of the hydrant -> CANCELLED (OUTAGE_AUTO_CANCEL)"
  - method: GET
    path: "/outages"
    description: "List outages with filters"
    roles: [ProgramAdmin, FieldOperator, UtilitySupervisor, FireDeptLiaison, PrivateOwnerRep]
    code: 200
    input: ["hydrant_id?", "status?", "limit?", "offset?"]
    output: "HydrantOutage[]"
    side_effects: []
  - method: GET
    path: "/outages/{id}"
    description: "Get an outage"
    roles: [ProgramAdmin, FieldOperator, UtilitySupervisor, FireDeptLiaison, PrivateOwnerRep]
    code: 200
    input: []
    output: HydrantOutage
    side_effects: []
  - method: POST
    path: "/outages/{id}/acknowledge-notification"
    description: "Fire department acknowledges the out-of-service notification"
    roles: [FireDeptLiaison]
    code: 200
    input: []
    output: HydrantOutage
    side_effects: ["notification_status -> ACKNOWLEDGED; program unacknowledged_notification_count -= 1"]
  - method: POST
    path: "/outages/{id}/close"
    description: "Return the hydrant to service"
    roles: [FieldOperator]
    code: 200
    input: []
    output: HydrantOutage
    side_effects: ["Hydrant -> IN_SERVICE; program hydrants_out_of_service_count -= 1"]

  # --- RepairWorkOrder ---
  - method: POST
    path: "/work-orders"
    description: "Create a draft repair work order"
    roles: [FieldOperator]
    code: 201
    input: [hydrant_id, description, "budget_cap_cents?"]
    output: RepairWorkOrder
    side_effects: ["status DRAFT; created_by_user_id <- X-User-ID"]
  - method: GET
    path: "/work-orders"
    description: "List work orders with filters"
    roles: [ProgramAdmin, FieldOperator, UtilitySupervisor, FireDeptLiaison, PrivateOwnerRep]
    code: 200
    input: ["hydrant_id?", "source_inspection_id?", "status?", "limit?", "offset?"]
    output: "RepairWorkOrder[]"
    side_effects: []
  - method: GET
    path: "/work-orders/{id}"
    description: "Get a work order"
    roles: [ProgramAdmin, FieldOperator, UtilitySupervisor, FireDeptLiaison, PrivateOwnerRep]
    code: 200
    input: []
    output: RepairWorkOrder
    side_effects: []
  - method: POST
    path: "/work-orders/{id}/part-lines"
    description: "Add a part line to a draft work order"
    roles: [FieldOperator]
    code: 200
    input: [part_id, qty]
    output: RepairWorkOrder
    side_effects: ["line appended with status PENDING; increments RepairWorkOrder.version by 1"]
  - method: POST
    path: "/work-orders/{id}/submit"
    description: "Submit a draft work order for approval"
    roles: [FieldOperator]
    code: 200
    input: []
    output: RepairWorkOrder
    side_effects: ["status -> SUBMITTED"]
  - method: POST
    path: "/work-orders/{id}/approve"
    description: "Approve a submitted work order (OCC on work order version; reserves parts; computes quoted totals)"
    roles: [UtilitySupervisor]
    code: 200
    input: [expected_work_order_version]
    output: RepairWorkOrder
    side_effects:
      - "work_order_total quoted variant computed; line price snapshots"
      - "lines -> RESERVED; Part.available_qty recomputed"
      - "increments RepairWorkOrder.version by 1"
  - method: POST
    path: "/work-orders/{id}/reject"
    description: "Reject a submitted work order back to draft (revision loop)"
    roles: [UtilitySupervisor]
    code: 200
    input: [rejection_reason]
    output: RepairWorkOrder
    side_effects: ["status -> DRAFT; last_rejection_reason set"]
  - method: POST
    path: "/work-orders/{id}/complete"
    description: "Complete an approved work order; consumes parts; computes actual totals at current prices"
    roles: [FieldOperator]
    code: 200
    input: []
    output: RepairWorkOrder
    side_effects: ["lines -> CONSUMED; Part.on_hand_qty decremented; work_order_total actual variant computed"]
  - method: POST
    path: "/work-orders/{id}/cancel"
    description: "Cancel a non-terminal work order; releases reservations when approved"
    roles: [FieldOperator]
    code: 200
    input: []
    output: RepairWorkOrder
    side_effects: ["from APPROVED: lines -> RELEASED; Part.available_qty recomputed"]

  # --- Part ---
  - method: POST
    path: "/parts"
    description: "Create a catalog part"
    roles: [ProgramAdmin]
    code: 201
    input: [sku, name, unit_price_cents, on_hand_qty]
    output: Part
    side_effects: ["available_qty <- on_hand_qty"]
  - method: GET
    path: "/parts"
    description: "List parts"
    roles: [ProgramAdmin, FieldOperator, UtilitySupervisor, FireDeptLiaison, PrivateOwnerRep]
    code: 200
    input: ["limit?", "offset?"]
    output: "Part[]"
    side_effects: []
  - method: GET
    path: "/parts/{id}"
    description: "Get a part (including computed available_qty)"
    roles: [ProgramAdmin, FieldOperator, UtilitySupervisor, FireDeptLiaison, PrivateOwnerRep]
    code: 200
    input: []
    output: Part
    side_effects: []
  - method: POST
    path: "/parts/{id}/restock"
    description: "Add stock and optionally update the unit price"
    roles: [ProgramAdmin]
    code: 200
    input: [add_qty, "new_unit_price_cents?"]
    output: Part
    side_effects: ["on_hand_qty += add_qty; unit_price_cents updated when provided"]

  # --- ISOSnapshot ---
  - method: POST
    path: "/programs/{id}/iso-snapshots"
    description: "Create a draft ISO rating snapshot for a program"
    roles: [ProgramAdmin]
    code: 201
    input: [weighting_profile]
    output: ISOSnapshot
    side_effects: ["status DRAFT; metric fields null until publish"]
  - method: GET
    path: "/iso-snapshots"
    description: "List ISO snapshots with filters"
    roles: [ProgramAdmin, FieldOperator, UtilitySupervisor, FireDeptLiaison, PrivateOwnerRep]
    code: 200
    input: ["program_id?", "status?", "limit?", "offset?"]
    output: "ISOSnapshot[]"
    side_effects: []
  - method: GET
    path: "/iso-snapshots/{id}"
    description: "Get an ISO snapshot"
    roles: [ProgramAdmin, FieldOperator, UtilitySupervisor, FireDeptLiaison, PrivateOwnerRep]
    code: 200
    input: []
    output: ISOSnapshot
    side_effects: []
  - method: POST
    path: "/iso-snapshots/{id}/publish"
    description: "Publish a snapshot; pins metrics and supersedes the previously published snapshot"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: ISOSnapshot
    side_effects: ["iso_rating_points computed and pinned; prior PUBLISHED snapshot -> SUPERSEDED"]

  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Before any call, the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock advanced to to_iso8601"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Schema violation: missing/unknown/invalid field, bad enum, window_end <= window_start, qty <= 0, private_owner_id present iff ownership == PRIVATE violated" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_HYDRANT_OWNERSHIP_MISMATCH, http: 403, condition: "Ownership scope violated on inspection record (operator on PRIVATE hydrant, owner rep on MUNICIPAL or another owner's hydrant)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Actor X-User-ID equals the performer/creator of the record under review or approval" }
  - { id: ERR_PROGRAM_NOT_FOUND, http: 404, condition: "FlushingProgram id does not exist" }
  - { id: ERR_ZONE_NOT_FOUND, http: 404, condition: "PressureZone id does not exist" }
  - { id: ERR_PRIVATE_OWNER_NOT_FOUND, http: 404, condition: "PrivateOwner id does not exist" }
  - { id: ERR_HYDRANT_NOT_FOUND, http: 404, condition: "Hydrant id does not exist" }
  - { id: ERR_INSPECTION_NOT_FOUND, http: 404, condition: "Inspection id does not exist" }
  - { id: ERR_FLOW_TEST_NOT_FOUND, http: 404, condition: "FlowTest id does not exist" }
  - { id: ERR_FLUSH_SEQUENCE_NOT_FOUND, http: 404, condition: "FlushSequence id does not exist" }
  - { id: ERR_COMPLAINT_NOT_FOUND, http: 404, condition: "WaterQualityComplaint id does not exist" }
  - { id: ERR_OUTAGE_NOT_FOUND, http: 404, condition: "HydrantOutage id does not exist" }
  - { id: ERR_WORK_ORDER_NOT_FOUND, http: 404, condition: "RepairWorkOrder id does not exist" }
  - { id: ERR_PART_NOT_FOUND, http: 404, condition: "Part id does not exist" }
  - { id: ERR_ISO_SNAPSHOT_NOT_FOUND, http: 404, condition: "ISOSnapshot id does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_PROGRAM_NOT_OPEN, http: 409, condition: "Operation requires the hydrant's/named program to be OPEN" }
  - { id: ERR_HYDRANT_NOT_IN_SERVICE, http: 409, condition: "Operation requires hydrant status IN_SERVICE" }
  - { id: ERR_INSPECTION_NOT_RECORDABLE, http: 409, condition: "Record requires inspection SCHEDULED or REJECTED" }
  - { id: ERR_INSPECTION_NOT_PENDING_VERIFICATION, http: 409, condition: "Verify requires inspection PENDING_VERIFICATION" }
  - { id: ERR_FLOW_TEST_NOT_SCHEDULED, http: 409, condition: "Results/cancel require flow test SCHEDULED" }
  - { id: ERR_FLOW_TEST_NOT_SUBMITTED, http: 409, condition: "Review requires flow test RESULTS_SUBMITTED" }
  - { id: ERR_FLOW_TEST_NOT_RESCHEDULABLE, http: 409, condition: "Reschedule requires flow test REJECTED or MISSED" }
  - { id: ERR_SEQUENCE_NOT_PLANNED, http: 409, condition: "Start/link requires flush sequence PLANNED" }
  - { id: ERR_SEQUENCE_NOT_IN_PROGRESS, http: 409, condition: "Execute-step/complete/abort require sequence IN_PROGRESS" }
  - { id: ERR_COMPLAINT_NOT_LINKABLE, http: 409, condition: "Link requires complaint OPEN" }
  - { id: ERR_COMPLAINT_NOT_CLOSABLE, http: 409, condition: "Close path invalid for the complaint's current status/outcome combination" }
  - { id: ERR_OUTAGE_NOT_ACTIVE, http: 409, condition: "Close requires outage ACTIVE" }
  - { id: ERR_NOTIFICATION_ALREADY_ACKNOWLEDGED, http: 409, condition: "Acknowledge requires notification_status PENDING" }
  - { id: ERR_NOTIFICATION_NOT_ACKNOWLEDGED, http: 409, condition: "Outage close requires notification ACKNOWLEDGED" }
  - { id: ERR_WORK_ORDER_NOT_DRAFT, http: 409, condition: "Submit/part-line add require work order DRAFT" }
  - { id: ERR_WORK_ORDER_NOT_SUBMITTED, http: 409, condition: "Approve/reject require work order SUBMITTED" }
  - { id: ERR_WORK_ORDER_NOT_APPROVED, http: 409, condition: "Complete requires work order APPROVED" }
  - { id: ERR_WORK_ORDER_NOT_CANCELLABLE, http: 409, condition: "Cancel requires work order DRAFT, SUBMITTED, or APPROVED" }
  - { id: ERR_SNAPSHOT_NOT_DRAFT, http: 409, condition: "Publish requires snapshot DRAFT" }
  - { id: ERR_PRESSURE_READING_INVALID, http: 422, condition: "static_psi <= residual_psi OR residual_psi <= 20" }
  - { id: ERR_DECHLORINATION_LIMIT_EXCEEDED, http: 422, condition: "final_discharge_residual_mg_L > 0.1 at sequence completion" }
  - { id: ERR_HYDRANT_NUMBER_NOT_UNIQUE, http: 409, condition: "hydrant_number already registered" }
  - { id: ERR_PROGRAM_ALREADY_EXISTS, http: 409, condition: "A program with this (program_year, season) already exists" }
  - { id: ERR_PART_SKU_NOT_UNIQUE, http: 409, condition: "sku already registered" }
  - { id: ERR_PROGRAM_MISMATCH, http: 422, condition: "FlushSequence.program_id differs from its hydrant's program_id" }
  - { id: ERR_STEP_OUT_OF_SEQUENCE, http: 409, condition: "Step not PENDING or an earlier step is not EXECUTED" }
  - { id: ERR_STEPS_INCOMPLETE, http: 409, condition: "Completion requires every step EXECUTED" }
  - { id: ERR_OPEN_WORK_ORDERS_EXIST, http: 409, condition: "Outage close blocked by work orders in DRAFT, SUBMITTED, or APPROVED for the hydrant" }
  - { id: ERR_UNACKNOWLEDGED_NOTIFICATIONS, http: 409, condition: "ISO publish blocked: program has unacknowledged fire-department notifications" }
  - { id: ERR_NO_HYDRANTS_IN_SCOPE, http: 422, condition: "ISO publish requires at least one non-DECOMMISSIONED hydrant in the program" }
  - { id: ERR_FLOW_TEST_WINDOW_OVERLAP, http: 409, condition: "New/rescheduled window overlaps another SCHEDULED test on the same hydrant (half-open [start, end) arithmetic; touching endpoints allowed)" }
  - { id: ERR_FLOW_TEST_WINDOW_NOT_STARTED, http: 409, condition: "Results submitted before window_start" }
  - { id: ERR_FLOW_TEST_WINDOW_EXPIRED, http: 409, condition: "Results submitted after window_end" }
  - { id: ERR_SEQUENCE_ZONE_COOLDOWN, http: 409, condition: "Gap between the new sequence window and another PLANNED/IN_PROGRESS sequence in the same zone is below cooldown_minutes (adjacency violates)" }
  - { id: ERR_LINK_HYDRANT_MISMATCH, http: 422, condition: "Complaint and target sequence reference different hydrants" }
  - { id: ERR_LINKED_SEQUENCE_NOT_COMPLETED, http: 409, condition: "Manual RESOLVED close requires the linked sequence COMPLETED" }
  - { id: ERR_INSUFFICIENT_PART_QUANTITY, http: 422, condition: "Part.available_qty below a line's qty at approval" }
  - { id: ERR_WORK_ORDER_BUDGET_EXCEEDED, http: 422, condition: "quoted_total_cents exceeds budget_cap_cents at approval" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "Utility program administrator; owns configuration, programs, inventory, parts catalog, ISO documentation, and the ops sweep"
    identity: opaque
    exclusive_operations:
      - "POST /programs, POST /programs/{id}/close, POST /programs/{id}/sweep"
      - "POST /zones, POST /private-owners, POST /hydrants, POST /hydrants/{id}/decommission"
      - "POST /parts, POST /parts/{id}/restock"
      - "POST /programs/{id}/iso-snapshots, POST /iso-snapshots/{id}/publish"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
  - name: FieldOperator
    description: "Distribution field crew; performs inspections, flow tests, flushing, tagging, complaint intake, and work-order drafting"
    identity: opaque
    exclusive_operations:
      - "POST /inspections, POST /flow-tests, POST /flow-tests/{id}/results, POST /flow-tests/{id}/reschedule, POST /flow-tests/{id}/cancel"
      - "POST /flush-sequences, POST /flush-sequences/{id}/start, POST /flush-sequences/{id}/execute-step, POST /flush-sequences/{id}/complete, POST /flush-sequences/{id}/abort"
      - "POST /complaints, POST /complaints/{id}/link"
      - "POST /outages, POST /outages/{id}/close"
      - "POST /work-orders, POST /work-orders/{id}/part-lines, POST /work-orders/{id}/submit, POST /work-orders/{id}/complete, POST /work-orders/{id}/cancel"
    shared_operations:
      - "All GET endpoints"
      - "POST /inspections/{id}/record (shared with PrivateOwnerRep, scoped by hydrant ownership)"
  - name: UtilitySupervisor
    description: "Supervisor; verifies inspections, reviews flow tests, approves work orders, closes complaints; segregation of duties forbids acting on own records"
    identity: opaque
    exclusive_operations:
      - "POST /inspections/{id}/verify, POST /flow-tests/{id}/review"
      - "POST /work-orders/{id}/approve, POST /work-orders/{id}/reject"
      - "POST /complaints/{id}/close"
    shared_operations:
      - "All GET endpoints"
  - name: FireDeptLiaison
    description: "Fire department contact; acknowledges out-of-service notifications"
    identity: opaque
    exclusive_operations:
      - "POST /outages/{id}/acknowledge-notification"
    shared_operations:
      - "All GET endpoints"
  - name: PrivateOwnerRep
    description: "Private hydrant owner's representative; may record inspection evidence only for PRIVATE hydrants whose private_owner_id equals X-User-ID"
    identity: "entity_backed:PrivateOwner"
    exclusive_operations: []
    shared_operations:
      - "All GET endpoints"
      - "POST /inspections/{id}/record (shared with FieldOperator, scoped to own PRIVATE hydrants)"
