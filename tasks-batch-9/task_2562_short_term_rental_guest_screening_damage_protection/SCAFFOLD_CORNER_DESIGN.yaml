  - section: rbac
    instances:
      - name: compliance_officer_reviews_identity_document
        claim_type: exclusive_operations
        grounds:
          - rbac.ComplianceOfficer.exclusive_operations
          - endpoints.POST_rentals_identity_documents_id_review
          - calculations.guest_verification_state
        distinguishing_aspect: "The document review is exclusive to ComplianceOfficer and stamps the acting X-User-ID: accepting one GOVERNMENT_ID returns 200 with review_state ACCEPTED and reviewed_by_user_id co-1, and because only one document is accepted the guest stays UNVERIFIED at risk_score 35 rather than earning the VERIFIED credit."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One guest with a single PENDING GOVERNMENT_ID document expiring 2030-01-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rentals/guests"
              payload: { full_name: "Doc Guest", email: "doc@guest.test", country_code: "US" }
              as: PlatformAdmin
              captures: { g1: $.data.id }
            - call: "POST /rentals/identity-documents"
              payload: { guest_id: "${g1}", doc_type: "GOVERNMENT_ID", issuing_country: "US", document_ref: "blob/gov-1", expires_on: "2030-01-01T00:00:00Z" }
              as: Guest
              as_user_id: "${g1}"
              captures: { d1: $.data.id, review_before: $.data.review_state }
          trigger:
            - call: "POST /rentals/identity-documents/${d1}/review"
              payload: { decision: "ACCEPT" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { review_after: $.data.review_state, reviewer: $.data.reviewed_by_user_id }
          assert:
            - "${review_before} == PENDING"
            - "HTTP 200 and ${review_after} == ACCEPTED and ${reviewer} == co-1"
            - "IdentityDocument.${d1}.reject_reason_code == null"
            - "Guest.${g1}.accepted_doc_count == 1 and Guest.${g1}.accepted_gov_id_count == 1"
            - "Guest.${g1}.verification_state == UNVERIFIED — VERIFIED needs at least two accepted documents"
            - "Guest.${g1}.risk_score == 35 and Guest.${g1}.risk_tier == ELEVATED"

      - name: guest_cannot_review_own_identity_document
        claim_type: unauthorized
        grounds:
          - validations.priority_2_ERR_UNAUTHORIZED
          - rbac.ComplianceOfficer.exclusive_operations
        distinguishing_aspect: "Role admission at priority 2 runs before ownership at priority 6, so the guest who owns the document is still refused with 403 ERR_UNAUTHORIZED — not ERR_NOT_RESOURCE_OWNER — and the document stays PENDING with reviewed_by_user_id null."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One guest with one PENDING SELFIE document."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rentals/guests"
              payload: { full_name: "Self Review Guest", email: "selfreview@guest.test", country_code: "US" }
              as: PlatformAdmin
              captures: { g1: $.data.id }
            - call: "POST /rentals/identity-documents"
              payload: { guest_id: "${g1}", doc_type: "SELFIE", issuing_country: "US", document_ref: "blob/selfie-1", expires_on: "2030-01-01T00:00:00Z" }
              as: Guest
              as_user_id: "${g1}"
              captures: { d1: $.data.id }
          trigger:
            - call: "POST /rentals/identity-documents/${d1}/review"
              payload: { decision: "ACCEPT" }
              as: Guest
              as_user_id: "${g1}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403"
            - "${err} == ERR_UNAUTHORIZED"
            - "${err} != ERR_NOT_RESOURCE_OWNER — the role is not admitted to the endpoint at all"
            - "IdentityDocument.${d1}.review_state == PENDING and IdentityDocument.${d1}.reviewed_by_user_id == null"
            - "Guest.${g1}.accepted_doc_count == 0 and Guest.${g1}.verification_state == PENDING_REVIEW"

      - name: guest_and_host_both_read_reservation
        claim_type: shared_operations
        grounds:
          - rbac.Guest.shared_operations
          - rbac.Host.shared_operations
          - endpoints.GET_rentals_reservations_id
        distinguishing_aspect: "The reservation read is shared: the booking Guest and the owning Host both get 200 with identical charge and screening fields, and the same read also succeeds for the out-of-party TrustAdjudicator, whose role is admitted without any ownership tie."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
