            - "Lessee with utilization_threshold_pct 50 and credit_ceiling_cents 50000000; ACTIVE FULL_SERVICE contract at the odd per_diem_rate_cents 2001 with fleet_car_cap 10; car A is placed 2026-09-04..2026-09-09 (5 days) with mileage_allowance 1000."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
