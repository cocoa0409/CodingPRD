          - state_machines.Unit.PENDING_to_REPORTED
          - entities.Unit.fields.status
        distinguishing_aspect: |
          Entity pair {LossClaim -> Unit}: a LossClaim may only transition
          DRAFT->UNDER_REVIEW when its Unit is REPORTED or ACTIVE. With the unit still
          PENDING (no accepted acreage report) the submit is rejected ERR_UNIT_NOT_REPORTED
          and the claim stays DRAFT.
