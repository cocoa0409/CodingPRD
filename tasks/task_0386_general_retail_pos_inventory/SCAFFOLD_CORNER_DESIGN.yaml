# =============================================================================
# task_0386 — General Retail POS & Inventory
# §1.9 Scaffold Corner Design (breadth coverage of testable claims)
# Taxonomy per references/claim-extraction-guide.md. §1.8-covered corners are
# emitted as excluded_because stubs. All formula asserts are literals.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_store_returns_201_with_locked_posture_and_version_1
        claim_type: Creation
        grounds: [entities.Store, endpoints]
        distinguishing_aspect: "POST /stores with all required fields -> 201; posture==LOCKED, version==1, server-minted id present."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /stores"
              payload: { name: "Flagship", code: "FLAG1", tax_rate_bps: 875 }
              as: StoreManager
              captures: { sid: $.data.id }
          assert:
            - "Response status == 201; Store.${sid}.posture == LOCKED; version == 1; tax_rate_bps == 875."
            - "Store.${sid}.loyalty_earn_rate_bps == 100 (default applied)."

      - name: get_store_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - entities.Store
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /stores/{id} for a non-existent UUID -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /stores/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StoreManager
              captures: { eid: $.data.error_id }
          assert:
            - "Response status == 404 and data.error_id == ERR_NOT_FOUND."

      - name: create_product_missing_required_sku_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Product
          - "validations[priority=5]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /products omitting required sku -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { barcode: "B-NOSKU", name: "X", list_price_cents: 100 }
              as: StoreManager
              captures: { eid: $.data.error_id }
          assert:
            - "Response status == 400 and data.error_id == ERR_INVALID_REQUEST (sku missing)."

      - name: create_product_defaults_tax_exempt_false_loyalty_eligible_true
        claim_type: Defaults
        grounds: [entities.Product]
        distinguishing_aspect: "Omitting tax_exempt and loyalty_eligible applies defaults false and true."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { sku: "DEF1", barcode: "BDEF1", name: "X", list_price_cents: 500 }
              as: StoreManager
              captures: { pid: $.data.id }
          assert:
            - "Product.${pid}.tax_exempt == false and loyalty_eligible == true and status == ACTIVE."

      - name: inventory_item_computed_available_qty_ignores_client_input
        claim_type: Computed Fields
        grounds: [entities.InventoryItem.fields.available_qty, calculations.inventory_available_and_reorder]
        distinguishing_aspect: "available_qty is computed (on_hand 0 - reserved 0 = 0) at create; any client-supplied value ignored."
        test_recipe:
          setup: ["Store and product created."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", code: "CMP1", tax_rate_bps: 0 }
              as: StoreManager
              captures: { sid: $.data.id }
            - call: "POST /products"
              payload: { sku: "PCMP", barcode: "BCMP", name: "P", list_price_cents: 100 }
              as: StoreManager
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /inventory-items"
              payload: { store_id: "${sid}", product_id: "${pid}", reorder_point: 4, reorder_qty: 10 }
              as: InventoryClerk
              captures: { inv: $.data.id }
          assert:
            - "InventoryItem.${inv}.on_hand_qty == 0, reserved_qty == 0, available_qty == 0, below_reorder == true (0 <= 4)."

      - name: duplicate_product_sku_returns_duplicate_resource
        claim_type: Type Constraints
        grounds:
          - entities.Product
          - "validations[priority=6]"
          - "errors[ERR_DUPLICATE_RESOURCE]"
        distinguishing_aspect: "Second product with the same sku -> ERR_DUPLICATE_RESOURCE (409)."
        test_recipe:
          setup: ["One product with sku DUP1 exists."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "DUP1", barcode: "BD1", name: "A", list_price_cents: 100 }
              as: StoreManager
          trigger:
            - call: "POST /products"
              payload: { sku: "DUP1", barcode: "BD2", name: "B", list_price_cents: 200 }
              as: StoreManager
              captures: { eid: $.data.error_id }
          assert:
            - "Response status == 409 and data.error_id == ERR_DUPLICATE_RESOURCE."

      - name: tenderline_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.TenderLine]
        distinguishing_aspect: "TenderLine has common_fields:false — only id + created_at; it is append-only, no version, no update endpoint exists."
        test_recipe:
          setup: ["A SETTLED SALE with one CASH tender exists; tenders are listable."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", code: "IMM1", tax_rate_bps: 0 }
              as: StoreManager
              captures: { sid: $.data.id }
            - call: "POST /products"
              payload: { sku: "PIM", barcode: "BIM", name: "P", list_price_cents: 1000 }
              as: StoreManager
              captures: { p: $.data.id }
            - call: "POST /inventory-items"
              payload: { store_id: "${sid}", product_id: "${p}", reorder_point: 0, reorder_qty: 0 }
              as: InventoryClerk
              captures: { inv: $.data.id }
            - call: "POST /count-sheets"
              payload: { inventory_item_id: "${inv}", counted_qty: 10 }
              as: InventoryClerk
              captures: { cs: $.data.id }
            - call: "POST /count-sheets/${cs}/post"
              payload: {}
              as: InventoryClerk
            - call: "POST /cash-sessions"
              payload: { store_id: "${sid}", opening_float_cents: 0 }
              as: StoreManager
            - call: "POST /sales"
              payload: { store_id: "${sid}", kind: "SALE", lines: [ { product_id: "${p}", quantity: 1 } ] }
              as: Cashier
              captures: { sale_id: $.data.id, sv: $.data.version }
            - call: "POST /sales/${sale_id}/tenders"
              payload: { method: "CASH", amount_cents: 1000, expected_sale_version: "${sv}" }
              as: Cashier
              captures: { tl: $.data.id }
          trigger:
            - call: "GET /sales/${sale_id}/tenders"
              payload: {}
              as: Cashier
              captures: { first_id: $.data.0.id }
          assert:
            - "GET /sales/${sale_id}/tenders returns a 1-element array; element has id and created_at, no version field."

  # ===========================================================================
  - section: state_machines
    instances:
      - name: void_already_settled_sale_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Sale.DRAFT_to_VOIDED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Voiding a SETTLED sale (settlement_status==SETTLED) -> ERR_INVALID_STATE; void is only defined from DRAFT/TENDERING."
        test_recipe:
          setup: ["A SALE fully settled CASH (settlement_status SETTLED)."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", code: "VS1", tax_rate_bps: 0 }
              as: StoreManager
              captures: { sid: $.data.id }
            - call: "POST /products"
              payload: { sku: "PVS", barcode: "BVS", name: "P", list_price_cents: 1000 }
              as: StoreManager
              captures: { p: $.data.id }
            - call: "POST /inventory-items"
              payload: { store_id: "${sid}", product_id: "${p}", reorder_point: 0, reorder_qty: 0 }
              as: InventoryClerk
              captures: { inv: $.data.id }
            - call: "POST /count-sheets"
              payload: { inventory_item_id: "${inv}", counted_qty: 5 }
              as: InventoryClerk
              captures: { cs: $.data.id }
            - call: "POST /count-sheets/${cs}/post"
              payload: {}
              as: InventoryClerk
            - call: "POST /cash-sessions"
              payload: { store_id: "${sid}", opening_float_cents: 0 }
              as: StoreManager
            - call: "POST /sales"
              payload: { store_id: "${sid}", kind: "SALE", lines: [ { product_id: "${p}", quantity: 1 } ] }
              as: Cashier
              captures: { sale_id: $.data.id, sv: $.data.version }
            - call: "POST /sales/${sale_id}/tenders"
              payload: { method: "CASH", amount_cents: 1000, expected_sale_version: "${sv}" }
              as: Cashier
          trigger:
            - call: "POST /sales/${sale_id}/void"
              payload: {}
              as: Cashier
              captures: { eid: $.data.error_id }
          assert:
            - "Response status == 409 and data.error_id == ERR_INVALID_STATE."

      - name: reconcile_open_session_without_request_close_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.CashDrawerSession.CLOSE_REQUESTED_to_RECONCILED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Reconcile is only defined from CLOSE_REQUESTED; reconciling a still-OPEN session -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["A cash session is OPEN (not yet close-requested)."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", code: "RC1", tax_rate_bps: 0 }
              as: StoreManager
              captures: { sid: $.data.id }
            - call: "POST /cash-sessions"
              payload: { store_id: "${sid}", opening_float_cents: 5000 }
              as: StoreManager
              captures: { sess: $.data.id }
          trigger:
            - call: "POST /cash-sessions/${sess}/reconcile"
              payload: { counted_cash_cents: 5000 }
              as: StoreManager
              captures: { eid: $.data.error_id }
          assert:
            - "Response status == 409 and data.error_id == ERR_INVALID_STATE (session is OPEN, not CLOSE_REQUESTED)."

      - name: dispatch_already_received_transfer_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Transfer.DISPATCHED_to_RECEIVED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "RECEIVED is terminal; dispatching a RECEIVED transfer -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["Transfer A->B fully RECEIVED."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "A", code: "TRA", tax_rate_bps: 0 }
              as: StoreManager
              captures: { sa: $.data.id }
            - call: "POST /stores"
              payload: { name: "B", code: "TRB", tax_rate_bps: 0 }
              as: StoreManager
              captures: { sb: $.data.id }
            - call: "POST /products"
              payload: { sku: "PTR", barcode: "BTR", name: "P", list_price_cents: 100 }
              as: StoreManager
              captures: { p: $.data.id }
            - call: "POST /inventory-items"
              payload: { store_id: "${sa}", product_id: "${p}", reorder_point: 0, reorder_qty: 0 }
              as: InventoryClerk
              captures: { inva: $.data.id }
            - call: "POST /count-sheets"
              payload: { inventory_item_id: "${inva}", counted_qty: 10 }
              as: InventoryClerk
              captures: { cs: $.data.id }
            - call: "POST /count-sheets/${cs}/post"
              payload: {}
              as: InventoryClerk
            - call: "POST /inventory-items"
              payload: { store_id: "${sb}", product_id: "${p}", reorder_point: 0, reorder_qty: 0 }
              as: InventoryClerk
              captures: { invb: $.data.id }
            - call: "POST /transfers"
              payload: { from_store_id: "${sa}", to_store_id: "${sb}", product_id: "${p}", quantity: 2 }
              as: InventoryClerk
              captures: { tr: $.data.id, trv: $.data.version }
            - call: "POST /transfers/${tr}/dispatch"
              payload: { expected_transfer_version: "${trv}" }
              as: InventoryClerk
              captures: { trv2: $.data.version }
            - call: "POST /transfers/${tr}/receive"
              payload: { received_qty: 2 }
              as: InventoryClerk
          trigger:
            - call: "POST /transfers/${tr}/dispatch"
              payload: { expected_transfer_version: "${trv2}" }
              as: InventoryClerk
              captures: { eid: $.data.error_id }
          assert:
            - "Response status == 409 and data.error_id == ERR_INVALID_STATE (RECEIVED is terminal)."

      - name: count_post_stale_after_movement_returns_count_stale
        claim_type: guarded transitions
        grounds:
          - state_machines.CountSheet.DRAFT_to_POSTED
          - "validations[priority=16]"
          - "errors[ERR_COUNT_STALE]"
        distinguishing_aspect: "CountSheet post requires on_hand_qty unchanged since open; a posted second sheet that moved on_hand invalidates the first -> ERR_COUNT_STALE."
        test_recipe:
          setup: ["InventoryItem on_hand=10. Open count sheet CS1 (snapshot 10). Then a second sheet CS2 posts on_hand to 7."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", code: "CST1", tax_rate_bps: 0 }
              as: StoreManager
              captures: { sid: $.data.id }
            - call: "POST /products"
              payload: { sku: "PCST", barcode: "BCST", name: "P", list_price_cents: 100 }
              as: StoreManager
              captures: { p: $.data.id }
            - call: "POST /inventory-items"
              payload: { store_id: "${sid}", product_id: "${p}", reorder_point: 0, reorder_qty: 0 }
              as: InventoryClerk
              captures: { inv: $.data.id }
            - call: "POST /count-sheets"
              payload: { inventory_item_id: "${inv}", counted_qty: 10 }
              as: InventoryClerk
              captures: { cs_seed: $.data.id }
            - call: "POST /count-sheets/${cs_seed}/post"
              payload: {}
              as: InventoryClerk
            - call: "POST /count-sheets"
              payload: { inventory_item_id: "${inv}", counted_qty: 9 }
              as: InventoryClerk
              captures: { cs1: $.data.id }
            - call: "POST /count-sheets"
              payload: { inventory_item_id: "${inv}", counted_qty: 7 }
              as: InventoryClerk
              captures: { cs2: $.data.id }
            - call: "POST /count-sheets/${cs2}/post"
              payload: {}
              as: InventoryClerk
          trigger:
            - call: "POST /count-sheets/${cs1}/post"
              payload: {}
              as: InventoryClerk
              captures: { eid: $.data.error_id }
          assert:
            - "Response status == 409 and data.error_id == ERR_COUNT_STALE (cs1 snapshot 10 != current on_hand 7)."

      - name: sale_parallel_dimensions_corner
        claim_type: parallel
        grounds: [state_machines.Sale.PENDING_to_COMMITTED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / sale_parallel_settlement_and_stock_dimensions_evolve_independently
          rationale: "The independent evolution of settlement_status vs stock_status is the depth probe in §1.8."

  # ===========================================================================
  - section: calculations
    instances:
      - name: bogo_50_discount_correct_on_even_quantity
        claim_type: Correct Result
        grounds: [calculations.sale_total_pricing, entities.Sale.fields.discount_cents]
        distinguishing_aspect: "BOGO_50 on product 500 x4: floor(4/2)=2 pairs * floor(500/2)=250 each => discount 500; total 1500 (tax 0)."
        test_recipe:
          setup: ["Store tax_bps=0. Product list 500. BOGO_50 promo. OPEN session."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", code: "BG1", tax_rate_bps: 0 }
              as: StoreManager
              captures: { sid: $.data.id }
            - call: "POST /products"
              payload: { sku: "PBG", barcode: "BBG", name: "P", list_price_cents: 500 }
              as: StoreManager
              captures: { p: $.data.id }
            - call: "POST /promotions"
              payload: { code: "BOGO", kind: "BOGO_50", value: 0, min_subtotal_cents: 0, stackable: false }
              as: StoreManager
            - call: "POST /cash-sessions"
              payload: { store_id: "${sid}", opening_float_cents: 0 }
              as: StoreManager
          trigger:
            - call: "POST /sales"
              payload: { store_id: "${sid}", kind: "SALE", promo_code: "BOGO", lines: [ { product_id: "${p}", quantity: 4 } ] }
              as: Cashier
              captures: { sale_id: $.data.id }
          assert:
            - "Sale.${sale_id}.merchandise_subtotal_cents == 2000, discount_cents == 500, total_due_cents == 1500."

      - name: percent_off_below_min_subtotal_rejected
        claim_type: Constants Applied
        grounds:
          - calculations.sale_total_pricing
          - "validations[priority=11]"
          - "errors[ERR_PROMO_NOT_APPLICABLE]"
        distinguishing_aspect: "PERCENT_OFF 20 with min_subtotal 5000: a 3000 subtotal is below the threshold -> ERR_PROMO_NOT_APPLICABLE."
        test_recipe:
          setup: ["Store tax_bps=0. Product list 1000. Promo PERCENT_OFF 20 min_subtotal 5000. OPEN session."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", code: "PM1", tax_rate_bps: 0 }
              as: StoreManager
              captures: { sid: $.data.id }
            - call: "POST /products"
              payload: { sku: "PPM", barcode: "BPM", name: "P", list_price_cents: 1000 }
              as: StoreManager
              captures: { p: $.data.id }
            - call: "POST /promotions"
              payload: { code: "PCT20", kind: "PERCENT_OFF", value: 20, min_subtotal_cents: 5000, stackable: false }
              as: StoreManager
            - call: "POST /cash-sessions"
              payload: { store_id: "${sid}", opening_float_cents: 0 }
              as: StoreManager
          trigger:
            - call: "POST /sales"
              payload: { store_id: "${sid}", kind: "SALE", promo_code: "PCT20", lines: [ { product_id: "${p}", quantity: 3 } ] }
              as: Cashier
              captures: { eid: $.data.error_id }
          assert:
            - "Response status == 422 and data.error_id == ERR_PROMO_NOT_APPLICABLE (subtotal 3000 < min 5000)."

      - name: cash_overpayment_yields_change_due_on_closing_tender
        claim_type: Correct Result
        grounds: [calculations.sale_total_pricing, entities.TenderLine.fields.change_due_cents, state_machines.Sale.TENDERING_to_SETTLED]
        distinguishing_aspect: "SALE total 1000, single CASH tender 1500 -> settles with change_due_cents==500; amount_cents recorded 1500."
        test_recipe:
          setup: ["Store tax_bps=0. Product list 1000, on_hand 5. OPEN session."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", code: "CH1", tax_rate_bps: 0 }
              as: StoreManager
              captures: { sid: $.data.id }
            - call: "POST /products"
              payload: { sku: "PCH", barcode: "BCH", name: "P", list_price_cents: 1000 }
              as: StoreManager
              captures: { p: $.data.id }
            - call: "POST /inventory-items"
              payload: { store_id: "${sid}", product_id: "${p}", reorder_point: 0, reorder_qty: 0 }
              as: InventoryClerk
              captures: { inv: $.data.id }
            - call: "POST /count-sheets"
              payload: { inventory_item_id: "${inv}", counted_qty: 5 }
              as: InventoryClerk
              captures: { cs: $.data.id }
            - call: "POST /count-sheets/${cs}/post"
              payload: {}
              as: InventoryClerk
            - call: "POST /cash-sessions"
              payload: { store_id: "${sid}", opening_float_cents: 0 }
              as: StoreManager
            - call: "POST /sales"
              payload: { store_id: "${sid}", kind: "SALE", lines: [ { product_id: "${p}", quantity: 1 } ] }
              as: Cashier
              captures: { sale_id: $.data.id, sv: $.data.version }
          trigger:
            - call: "POST /sales/${sale_id}/tenders"
              payload: { method: "CASH", amount_cents: 1500, expected_sale_version: "${sv}" }
              as: Cashier
              captures: { tl: $.data.id, ch: $.data.change_due_cents }
          assert:
            - "TenderLine change_due_cents == 500 and amount_cents == 1500."
            - "Sale.${sale_id}.settlement_status == SETTLED and stock_status == COMMITTED."

      - name: cash_reconciliation_variance_correct
        claim_type: Correct Result
        grounds: [calculations.cash_reconciliation, entities.CashDrawerSession.fields.variance_cents, state_machines.CashDrawerSession.CLOSE_REQUESTED_to_RECONCILED]
        distinguishing_aspect: "Opening 10000, one settled SALE total 1000 paid CASH 1500 (change 500). expected==11000; counted 10800 -> variance==-200."
        test_recipe:
          setup: ["Store tax_bps=0. Product list 1000, on_hand 5. Open session float 10000."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", code: "RX1", tax_rate_bps: 0 }
              as: StoreManager
              captures: { sid: $.data.id }
            - call: "POST /products"
              payload: { sku: "PRX", barcode: "BRX", name: "P", list_price_cents: 1000 }
              as: StoreManager
              captures: { p: $.data.id }
            - call: "POST /inventory-items"
              payload: { store_id: "${sid}", product_id: "${p}", reorder_point: 0, reorder_qty: 0 }
              as: InventoryClerk
              captures: { inv: $.data.id }
            - call: "POST /count-sheets"
              payload: { inventory_item_id: "${inv}", counted_qty: 5 }
              as: InventoryClerk
              captures: { cs: $.data.id }
            - call: "POST /count-sheets/${cs}/post"
              payload: {}
              as: InventoryClerk
            - call: "POST /cash-sessions"
              payload: { store_id: "${sid}", opening_float_cents: 10000 }
              as: StoreManager
              captures: { sess: $.data.id }
            - call: "POST /sales"
              payload: { store_id: "${sid}", kind: "SALE", lines: [ { product_id: "${p}", quantity: 1 } ] }
              as: Cashier
              captures: { sale_id: $.data.id, sv: $.data.version }
            - call: "POST /sales/${sale_id}/tenders"
              payload: { method: "CASH", amount_cents: 1500, expected_sale_version: "${sv}" }
              as: Cashier
            - call: "POST /cash-sessions/${sess}/request-close"
              payload: {}
              as: StoreManager
          trigger:
            - call: "POST /cash-sessions/${sess}/reconcile"
              payload: { counted_cash_cents: 10800 }
              as: StoreManager
              captures: { var: $.data.variance_cents }
          assert:
            - "CashDrawerSession.${sess}.expected_cash_cents == 11000 (10000 + 1500 collected - 500 change)."
            - "CashDrawerSession.${sess}.variance_cents == -200 and status == RECONCILED."

      - name: split_tender_settles_at_exact_total
        claim_type: Correct Result
        grounds: [state_machines.Sale.TENDERING_to_TENDERING, state_machines.Sale.TENDERING_to_SETTLED, entities.Sale.fields.tendered_cents]
        distinguishing_aspect: "SALE total 2000: CARD 1200 (TENDERING) then CASH 800 brings tendered to 2000 -> SETTLED exactly."
        test_recipe:
          setup: ["Store tax_bps=0. Product list 1000, on_hand 5. OPEN session. SALE 2xP total 2000, one CARD tender 1200."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", code: "SP1", tax_rate_bps: 0 }
              as: StoreManager
              captures: { sid: $.data.id }
            - call: "POST /products"
              payload: { sku: "PSP", barcode: "BSP", name: "P", list_price_cents: 1000 }
              as: StoreManager
              captures: { p: $.data.id }
            - call: "POST /inventory-items"
              payload: { store_id: "${sid}", product_id: "${p}", reorder_point: 0, reorder_qty: 0 }
              as: InventoryClerk
              captures: { inv: $.data.id }
            - call: "POST /count-sheets"
              payload: { inventory_item_id: "${inv}", counted_qty: 5 }
              as: InventoryClerk
              captures: { cs: $.data.id }
            - call: "POST /count-sheets/${cs}/post"
              payload: {}
              as: InventoryClerk
            - call: "POST /cash-sessions"
