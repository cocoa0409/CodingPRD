# =============================================================================
# PRD Benchmark Seed Tables — Peer-to-Peer Car Sharing (Turo/Getaround style)
# Difficulty: Expert
# =============================================================================

scenario: |
  580. Peer-to-Peer Car Sharing (Turo/Getaround style): host vehicle listing &
  availability calendar, dynamic daily pricing & discounts, trip booking & guest
  verification, protection-plan tier & deductible, check-in/out photos &
  odometer/fuel, incident/damage claim, host earnings & payout, late-return &
  extension

domain_name: car-sharing
# Flat topology: peer top-level collections (/hosts, /guests, /vehicles, /trips,
# /claims, /payouts, ...). Empty prefix means routes are rooted at "/".
api_prefix: "/"

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  state_machine_shape: branching        # Trip fork/branch, Claim cyclic review loop
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential            # AvailabilityBlock <-> Trip mutual reference
  role_model: peer_roles                # Host owns vehicles; Guest books trips; Admin adjudicates
  consistency_model: immediate

  entity_count: 11
  state_machine_count: 8
  calculation_count: 8
  validation_layers: 10
  endpoint_count: 55
  error_code_count: 32
  role_count: 4

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Host
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Host display name" }
      - { name: email, type: string, source: input, description: "Host contact email" }
      - { name: payout_method_ref, type: string, source: input, description: "Opaque payout destination token", default: null }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: "ACTIVE", constraints: "ACTIVE, SUSPENDED" }
      - { name: pending_balance_cents, type: integer, source: computed, description: "Estimated host earnings reserved by CONFIRMED/CHECKED_IN trips", default: 0 }
      - { name: available_balance_cents, type: integer, source: computed, description: "Finalized earnings withdrawable via payout", default: 0 }
      - { name: reserved_payout_cents, type: integer, source: computed, description: "Funds locked by REQUESTED payouts not yet paid/failed", default: 0 }
      - { name: lifetime_earnings_cents, type: integer, source: computed, description: "Cumulative finalized earnings from COMPLETED trips + claim recoveries", default: 0 }
      - { name: lifetime_paid_cents, type: integer, source: computed, description: "Cumulative PAID payout amount", default: 0 }

  - name: Guest
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Guest display name" }
      - { name: email, type: string, source: input, description: "Guest contact email" }
      - { name: verification_status, type: enum, source: system, description: "UNVERIFIED | PENDING_REVIEW | VERIFIED | REJECTED", default: "UNVERIFIED", constraints: "UNVERIFIED, PENDING_REVIEW, VERIFIED, REJECTED" }
      - { name: license_number, type: string, source: input, description: "Driver license number, set on submit-verification", default: null }
      - { name: license_state, type: string, source: input, description: "Two-letter license jurisdiction", default: null }
      - { name: license_expiry_date, type: string, source: input, description: "License expiry YYYY-MM-DD", default: null }
      - { name: driver_risk_score, type: integer, source: computed, description: "0-100 risk score; recomputed on trip completion and claim settlement", default: 0 }
      - { name: outstanding_balance_cents, type: integer, source: computed, description: "Deductibles/charges owed by guest from settled claims", default: 0 }
      - { name: at_fault_claim_count, type: integer, source: computed, description: "Count of APPROVED/SETTLED claims where guest is at fault", default: 0 }
      - { name: late_return_count, type: integer, source: computed, description: "Count of COMPLETED trips returned late", default: 0 }
      - { name: completed_trip_count, type: integer, source: computed, description: "Count of trips reaching COMPLETED", default: 0 }

  - name: ProtectionPlan
    parent: null
    common_fields: false
    fields:
      - { name: tier, type: enum, source: input, description: "BASIC | STANDARD | PREMIUM", constraints: "BASIC, STANDARD, PREMIUM" }
      - { name: deductible_cents, type: integer, source: input, description: "Guest-borne deductible per approved claim" }
      - { name: daily_premium_cents, type: integer, source: input, description: "Protection premium charged to guest per trip night" }
      - { name: coverage_limit_cents, type: integer, source: input, description: "Maximum damage covered per claim" }
      - { name: host_earnings_pct, type: number, source: input, description: "Fraction (0..1) of discounted rental subtotal the host keeps under this plan" }
      - { name: active, type: boolean, source: input, description: "Whether plan is selectable for new trips", default: true }

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - { name: host_id, type: string, source: input, description: "FK -> Host.id; owner of this vehicle" }
      - { name: make, type: string, source: input, description: "Vehicle make" }
      - { name: model, type: string, source: input, description: "Vehicle model" }
      - { name: year, type: integer, source: input, description: "Model year" }
      - { name: base_daily_price_cents, type: integer, source: input, description: "Default nightly price when no PricingRule covers a date" }
      - { name: location_city, type: string, source: input, description: "Pickup city" }
      - { name: daily_mileage_limit, type: integer, source: input, description: "Included miles per night before overage", default: 200 }
      - { name: weekly_discount_pct, type: number, source: input, description: "Fraction (0..1) off rental subtotal when nights >= 7 and < 28", default: 0.10 }
      - { name: monthly_discount_pct, type: number, source: input, description: "Fraction (0..1) off rental subtotal when nights >= 28", default: 0.25 }
      - { name: odometer_current, type: integer, source: input, description: "Current odometer reading; updated to checkout reading on trip completion", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT | LISTED | SNOOZED | UNLISTED", default: "DRAFT", constraints: "DRAFT, LISTED, SNOOZED, UNLISTED" }
      - { name: booked_night_count, type: integer, source: computed, description: "Sum of nights across this vehicle's ACTIVE BOOKED AvailabilityBlocks", default: 0 }
      - { name: completed_trip_count, type: integer, source: computed, description: "Count of COMPLETED trips on this vehicle", default: 0 }

  - name: AvailabilityBlock
    parent: null
    common_fields: true
    fields:
      - { name: vehicle_id, type: string, source: system, description: "FK -> Vehicle.id; calendar owner (path-derived for host blocks, system-set for bookings)" }
      - { name: trip_id, type: string, source: system, description: "FK -> Trip.id; set only for BOOKED blocks, null for host/maintenance blocks", default: null }
      - { name: block_type, type: enum, source: input, description: "BOOKED | HOST_BLOCKED | MAINTENANCE", default: "HOST_BLOCKED", constraints: "BOOKED, HOST_BLOCKED, MAINTENANCE" }
      - { name: start_date, type: string, source: input, description: "Inclusive start date YYYY-MM-DD (interval is half-open [start_date, end_date))" }
      - { name: end_date, type: string, source: input, description: "Exclusive end date YYYY-MM-DD" }
      - { name: nights, type: integer, source: computed, description: "end_date - start_date in days" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RELEASED | CONSUMED", default: "ACTIVE", constraints: "ACTIVE, RELEASED, CONSUMED" }

  - name: PricingRule
    parent: null
    common_fields: true
    fields:
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; vehicle whose pricing this rule overrides" }
      - { name: start_date, type: string, source: input, description: "Inclusive start date YYYY-MM-DD (interval is closed [start_date, end_date])" }
      - { name: end_date, type: string, source: input, description: "Inclusive end date YYYY-MM-DD" }
      - { name: daily_price_cents, type: integer, source: input, description: "Nightly price applied to each covered date, overriding base_daily_price_cents" }
      - { name: status, type: enum, source: system, description: "ACTIVE | WITHDRAWN", default: "ACTIVE", constraints: "ACTIVE, WITHDRAWN" }

  - name: Trip
    parent: null
    common_fields: true
    fields:
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; booked vehicle" }
      - { name: guest_id, type: string, source: input, description: "FK -> Guest.id; booking guest" }
      - { name: protection_plan_id, type: string, source: input, description: "FK -> ProtectionPlan.id; chosen protection tier" }
      - { name: start_date, type: string, source: input, description: "Trip start date YYYY-MM-DD (inclusive)" }
      - { name: end_date, type: string, source: input, description: "Trip end date YYYY-MM-DD (exclusive); nights = end - start" }
      - { name: nights, type: integer, source: computed, description: "end_date - start_date in days" }
      - { name: status, type: enum, source: system, description: "REQUESTED | CONFIRMED | CHECKED_IN | CHECKED_OUT | COMPLETED | CANCELLED | DECLINED", default: "REQUESTED", constraints: "REQUESTED, CONFIRMED, CHECKED_IN, CHECKED_OUT, COMPLETED, CANCELLED, DECLINED" }
      - { name: discounted_subtotal_cents, type: integer, source: computed, description: "Rental subtotal after length discount (locked at booking)" }
      - { name: protection_premium_cents, type: integer, source: computed, description: "plan.daily_premium_cents * nights (locked at booking)" }
      - { name: estimated_total_cents, type: integer, source: computed, description: "Provisional guest charge at booking (discounted_subtotal + premium)" }
      - { name: estimated_host_earnings_cents, type: integer, source: computed, description: "Provisional host earnings at booking (floor(discounted_subtotal * plan.host_earnings_pct))" }
      - { name: deductible_snapshot_cents, type: integer, source: computed, description: "plan.deductible_cents snapshot at booking" }
      - { name: checkin_odometer, type: integer, source: system, description: "Odometer at check-in", default: null }
      - { name: checkin_fuel_pct, type: integer, source: system, description: "Fuel percent at check-in", default: null }
      - { name: checkout_odometer, type: integer, source: system, description: "Odometer at check-out", default: null }
      - { name: checkout_fuel_pct, type: integer, source: system, description: "Fuel percent at check-out", default: null }
      - { name: scheduled_return_at, type: datetime, source: computed, description: "end_date at T11:00:00Z; the on-time return deadline" }
      - { name: actual_return_at, type: datetime, source: system, description: "Logical clock value at check-out", default: null }
      - { name: mileage_fee_cents, type: integer, source: computed, description: "Overage-mile charge computed at check-out", default: 0 }
      - { name: fuel_fee_cents, type: integer, source: computed, description: "Refuel charge computed at check-out", default: 0 }
      - { name: late_days, type: integer, source: computed, description: "Whole days late beyond grace, computed at check-out", default: 0 }
      - { name: late_fee_cents, type: integer, source: computed, description: "Late-return charge computed at check-out", default: 0 }
      - { name: final_total_cents, type: integer, source: computed, description: "Actual guest charge at check-out (subtotal+premium+mileage+fuel+late)", default: null }
      - { name: final_host_earnings_cents, type: integer, source: computed, description: "Actual host earnings at check-out (estimated_host_earnings + incidental fees)", default: null }

  - name: InspectionReport
    parent: null
    common_fields: true
    fields:
      - { name: trip_id, type: string, source: system, description: "FK -> Trip.id; owning trip (path-derived)" }
      - { name: phase, type: enum, source: system, description: "CHECK_IN | CHECK_OUT (determined by endpoint)", constraints: "CHECK_IN, CHECK_OUT" }
      - { name: odometer_reading, type: integer, source: input, description: "Odometer captured at this phase" }
      - { name: fuel_level_pct, type: integer, source: input, description: "Fuel percent 0-100 captured at this phase" }
      - { name: photo_refs, type: array, source: input, description: "Array of photo reference strings" }
      - { name: recorded_at, type: datetime, source: system, description: "Logical clock value when recorded" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: trip_id, type: string, source: system, description: "FK -> Trip.id; incident trip (path-derived)" }
      - { name: claimant, type: enum, source: input, description: "HOST | GUEST — who filed the claim", constraints: "HOST, GUEST" }
      - { name: damage_amount_cents, type: integer, source: input, description: "Assessed damage amount, must be > 0" }
      - { name: description, type: string, source: input, description: "Incident description" }
      - { name: status, type: enum, source: system, description: "FILED | UNDER_REVIEW | NEEDS_INFO | APPROVED | DENIED | SETTLED", default: "FILED", constraints: "FILED, UNDER_REVIEW, NEEDS_INFO, APPROVED, DENIED, SETTLED" }
      - { name: covered_amount_cents, type: integer, source: computed, description: "min(damage_amount, plan.coverage_limit); set on approval", default: null }
      - { name: guest_deductible_cents, type: integer, source: computed, description: "min(plan.deductible, covered_amount); set on approval", default: null }
      - { name: host_recovery_cents, type: integer, source: computed, description: "covered_amount credited to host; set on approval", default: null }
      - { name: uncovered_cents, type: integer, source: computed, description: "max(0, damage_amount - covered_amount); set on approval", default: null }
      - { name: resolution_note, type: string, source: input, description: "Adjudicator note on approve/deny", default: null }

  - name: Extension
    parent: null
    common_fields: true
    fields:
      - { name: trip_id, type: string, source: system, description: "FK -> Trip.id; trip being extended (path-derived)" }
      - { name: new_end_date, type: string, source: input, description: "Requested new (exclusive) end date YYYY-MM-DD" }
      - { name: previous_end_date, type: string, source: system, description: "Trip end_date at time of request" }
      - { name: added_nights, type: integer, source: computed, description: "new_end_date - previous_end_date in days" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | DENIED", default: "REQUESTED", constraints: "REQUESTED, APPROVED, DENIED" }
      - { name: added_earnings_cents, type: integer, source: computed, description: "Delta of estimated_host_earnings applied on approval", default: null }

  - name: Payout
    parent: null
    common_fields: true
    fields:
      - { name: host_id, type: string, source: input, description: "FK -> Host.id; payee host" }
      - { name: trip_id, type: string, source: input, description: "FK -> Trip.id; optional originating trip", default: null }
      - { name: amount_cents, type: integer, source: input, description: "Requested payout amount" }
      - { name: status, type: enum, source: system, description: "REQUESTED | PAID | FAILED", default: "REQUESTED", constraints: "REQUESTED, PAID, FAILED" }
      - { name: failure_reason, type: string, source: input, description: "Reason set on mark-failed", default: null }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Host
    field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /hosts/{id}/suspend"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["blocks new payout requests", "increments Host.version by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /hosts/{id}/reinstate"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["increments Host.version by 1"]

  - entity: Guest
    field: verification_status
    initial_state: UNVERIFIED
    terminal_states: [VERIFIED]
    transitions:
      - from: UNVERIFIED
        to: PENDING_REVIEW
        trigger: "POST /guests/{id}/submit-verification"
        actor: Guest
        preconditions: ["license_number, license_state, license_expiry_date present"]
        side_effects: ["Persist license fields on Guest"]
      - from: REJECTED
        to: PENDING_REVIEW
        trigger: "POST /guests/{id}/submit-verification (resubmit)"
        actor: Guest
        preconditions: []
        side_effects: ["Overwrite license fields"]
        note: "Cycle: rejected guests may resubmit."
      - from: PENDING_REVIEW
        to: VERIFIED
        trigger: "POST /guests/{id}/verify"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /guests/{id}/reject"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []

  - entity: Vehicle
    field: status
    initial_state: DRAFT
    terminal_states: [UNLISTED]
    transitions:
      - from: [DRAFT, SNOOZED]
        to: LISTED
        trigger: "POST /vehicles/{id}/list"
        actor: Host
        preconditions: ["acting host owns the vehicle"]
        side_effects: ["increments Vehicle.version by 1"]
      - from: LISTED
        to: SNOOZED
        trigger: "POST /vehicles/{id}/snooze"
        actor: Host
        preconditions: ["acting host owns the vehicle"]
        side_effects: ["increments Vehicle.version by 1", "existing bookings remain valid"]
      - from: [LISTED, SNOOZED]
        to: UNLISTED
        trigger: "POST /vehicles/{id}/unlist"
        actor: Host
        preconditions: ["acting host owns the vehicle", "no ACTIVE BOOKED AvailabilityBlock exists"]
        side_effects: ["increments Vehicle.version by 1"]

  - entity: Trip
    field: status
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED, DECLINED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /trips/{id}/approve"
        actor: Host
        preconditions: ["acting host owns Trip.vehicle_id"]
        side_effects:
          - "Host.pending_balance_cents += Trip.estimated_host_earnings_cents"
      - from: REQUESTED
        to: DECLINED
        trigger: "POST /trips/{id}/decline"
        actor: Host
        preconditions: ["acting host owns Trip.vehicle_id"]
        side_effects:
          - "linked BOOKED AvailabilityBlock.status -> RELEASED"
          - "Vehicle.booked_night_count -= Trip.nights"
      - from: [REQUESTED, CONFIRMED]
        to: CANCELLED
        trigger: "POST /trips/{id}/cancel"
        actor: "Guest or Host"
        preconditions: ["acting Guest owns the Trip or acting Host owns Trip.vehicle_id"]
        side_effects:
          - "CASCADE L1: linked BOOKED AvailabilityBlock.status -> RELEASED (Trip mutates AvailabilityBlock)"
          - "CASCADE L2: AvailabilityBlock release drives Vehicle.booked_night_count -= Trip.nights AND (only if prior state was CONFIRMED) Host.pending_balance_cents -= Trip.estimated_host_earnings_cents"
        note: "Depth-2 cascade (Trip -> AvailabilityBlock -> {Vehicle, Host}). From REQUESTED there is no pending credit to reverse."
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /trips/{id}/check-in"
        actor: Guest
        preconditions: ["acting Guest owns the Trip", "Vehicle.status != UNLISTED"]
        side_effects:
          - "create InspectionReport(phase=CHECK_IN)"
          - "Trip.checkin_odometer, Trip.checkin_fuel_pct set from body"
      - from: CHECKED_IN
        to: CHECKED_OUT
        trigger: "POST /trips/{id}/check-out"
        actor: Guest
        preconditions: ["acting Guest owns the Trip", "checkout odometer_reading >= Trip.checkin_odometer", "fuel_level_pct within 0..100"]
        side_effects:
          - "create InspectionReport(phase=CHECK_OUT)"
          - "Trip.checkout_odometer, Trip.checkout_fuel_pct, Trip.actual_return_at set"
          - "compute Trip.mileage_fee_cents, Trip.fuel_fee_cents, Trip.late_fee_cents, Trip.late_days"
          - "compute Trip.final_total_cents, Trip.final_host_earnings_cents (final_trip_settlement)"
          - "linked BOOKED AvailabilityBlock.status -> CONSUMED"
          - "if late_days > 0: Guest.late_return_count += 1"
      - from: CHECKED_OUT
        to: COMPLETED
        trigger: "POST /trips/{id}/complete"
        actor: Host
        preconditions: ["acting host owns Trip.vehicle_id"]
        side_effects:
          - "CASCADE L1: Host.pending_balance_cents -= Trip.estimated_host_earnings_cents; Host.available_balance_cents += Trip.final_host_earnings_cents; Host.lifetime_earnings_cents += Trip.final_host_earnings_cents (Trip mutates Host)"
          - "Vehicle.odometer_current = Trip.checkout_odometer; Vehicle.completed_trip_count += 1"
          - "Guest.completed_trip_count += 1; recompute Guest.driver_risk_score (finalized variant)"

  - entity: Extension
    field: status
    initial_state: REQUESTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /extensions/{id}/approve"
        actor: Host
        preconditions:
          - "acting host owns the trip's vehicle"
          - "Trip.status in {CONFIRMED, CHECKED_IN}"
          - "extended window does not overlap another ACTIVE BOOKED AvailabilityBlock (half-open)"
          - "Trip.nights after extension <= MAX_TRIP_NIGHTS"
        side_effects:
          - "CASCADE L1: Trip.end_date = Extension.new_end_date; recompute Trip.discounted_subtotal_cents, protection_premium_cents, estimated_total_cents, estimated_host_earnings_cents (Extension mutates Trip)"
          - "CASCADE L2: linked BOOKED AvailabilityBlock.end_date = new_end_date; recompute AvailabilityBlock.nights (Trip mutation drives AvailabilityBlock)"
          - "CASCADE L3: AvailabilityBlock night growth drives Vehicle.booked_night_count += added_nights AND Host.pending_balance_cents += Extension.added_earnings_cents (AvailabilityBlock mutation drives Vehicle + Host)"
        note: "Depth-3 cascade: Extension -> Trip -> AvailabilityBlock -> {Vehicle, Host}."
      - from: REQUESTED
        to: DENIED
        trigger: "POST /extensions/{id}/deny"
        actor: Host
        preconditions: ["acting host owns the trip's vehicle"]
        side_effects: []

  - entity: Claim
    field: status
    initial_state: FILED
    terminal_states: [DENIED, SETTLED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /claims/{id}/start-review"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: NEEDS_INFO
        trigger: "POST /claims/{id}/request-info"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: NEEDS_INFO
        to: UNDER_REVIEW
        trigger: "POST /claims/{id}/provide-info"
        actor: "Host or Guest"
        preconditions: ["acting party is the claimant or counterparty of the trip"]
        side_effects: []
        note: "Cycle: NEEDS_INFO <-> UNDER_REVIEW may repeat."
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /claims/{id}/approve"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "compute Claim.covered_amount_cents, guest_deductible_cents, host_recovery_cents, uncovered_cents (claim_settlement)"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /claims/{id}/deny"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: SETTLED
        trigger: "POST /claims/{id}/settle"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Guest.outstanding_balance_cents += Claim.guest_deductible_cents"
          - "Host.available_balance_cents += Claim.host_recovery_cents; Host.lifetime_earnings_cents += Claim.host_recovery_cents"
          - "if claimant == HOST: Guest.at_fault_claim_count += 1; recompute Guest.driver_risk_score (finalized variant)"

  - entity: Payout
    field: status
    initial_state: REQUESTED
    terminal_states: [PAID, FAILED]
    transitions:
      - from: REQUESTED
        to: PAID
        trigger: "POST /payouts/{id}/mark-paid"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Host.reserved_payout_cents -= Payout.amount_cents; Host.lifetime_paid_cents += Payout.amount_cents"
      - from: REQUESTED
        to: FAILED
        trigger: "POST /payouts/{id}/mark-failed"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Host.reserved_payout_cents -= Payout.amount_cents; Host.available_balance_cents += Payout.amount_cents (funds returned)"

  - entity: AvailabilityBlock
    field: status
    initial_state: ACTIVE
    terminal_states: [RELEASED, CONSUMED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "system: owning Trip cancelled/declined, or POST /vehicles/{id}/availability-blocks parent removed"
        actor: system
        preconditions: []
        side_effects: ["Vehicle.booked_night_count -= nights (for BOOKED blocks)"]
      - from: ACTIVE
        to: CONSUMED
        trigger: "system: owning Trip checked out"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: booking-stale-vehicle
    parent_entity: Vehicle
    write_endpoint: "POST /trips"
    occ_field: "expected_vehicle_version"
    description: |
      Booking a Trip against a Vehicle whose version has advanced since the guest
      last observed it is rejected. The guest quoted price/availability at a given
      Vehicle.version; if the host has since edited pricing or availability (each
      such edit increments Vehicle.version), the guest's view is stale and the
      booking must be re-quoted rather than committed against outdated terms.
    error_id: ERR_STALE_VEHICLE_VERSION
    http_status: 412
  - rule_id: payout-stale-host
    parent_entity: Host
    write_endpoint: "POST /payouts"
    occ_field: "expected_host_version"
    description: |
      Creating a Payout against a Host whose version has advanced since the client
      last observed it is rejected. A payout draws against Host.available_balance_cents;
      if another payout or a trip settlement has mutated the host ledger (incrementing
      Host.version) since the client read the balance, the draw is computed from a
      stale balance and must be rejected so it can be recomputed.
    error_id: ERR_STALE_HOST_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: estimated_trip_settlement
    trigger: "POST /trips (booking); recomputed on POST /extensions/{id}/approve"
    algorithm: tiered_pricing
    formula: |
      nights = days_between(start_date, end_date)         # half-open, must be >= 1
      # per-night price: PricingRule override if an ACTIVE rule's closed interval
      # [rule.start_date, rule.end_date] contains the night's date, else base.
      rental_subtotal_cents = sum over each night date d in [start_date, end_date) of price(d)
      # length discount: monthly wins over weekly (higher threshold first)
      discount_pct = MONTHLY if nights >= 28 else (WEEKLY if nights >= 7 else 0)
      # ROUNDING ORDER (pinned): sum first, THEN apply discount with floor.
      discounted_subtotal_cents = floor(rental_subtotal_cents * (1 - discount_pct))
      protection_premium_cents  = plan.daily_premium_cents * nights
      estimated_total_cents          = discounted_subtotal_cents + protection_premium_cents
      estimated_host_earnings_cents  = floor(discounted_subtotal_cents * plan.host_earnings_pct)
      deductible_snapshot_cents      = plan.deductible_cents
    input_set: "The single Trip's own dates + its Vehicle base price + covering ACTIVE PricingRules + chosen ProtectionPlan"
    constants:
      WEEKLY_THRESHOLD_NIGHTS: 7
      MONTHLY_THRESHOLD_NIGHTS: 28
    precision: "integer cents, floor truncation; discount applied to summed subtotal (NOT per-night)"
    variants:
      - name: estimate
        when: "at booking / extension approval"
        difference: "Assumes on-time return, zero mileage overage, full fuel; mileage_fee=fuel_fee=late_fee=0."

  - name: final_trip_settlement
    trigger: "POST /trips/{id}/check-out"
    algorithm: aggregation
    formula: |
      miles_driven   = checkout_odometer - checkin_odometer
      allowed_miles  = vehicle.daily_mileage_limit * nights
      overage_miles  = max(0, miles_driven - allowed_miles)          # strict '>' boundary
      mileage_fee_cents = overage_miles * MILEAGE_OVERAGE_RATE_CENTS
      fuel_deficit_pct  = max(0, checkin_fuel_pct - checkout_fuel_pct)
      fuel_fee_cents    = fuel_deficit_pct * FUEL_CHARGE_PER_PCT_CENTS
      overtime_seconds  = (actual_return_at - scheduled_return_at) in seconds - GRACE_HOURS*3600
      late_days         = 0 if overtime_seconds <= 0 else ceil(overtime_seconds / 86400)
      late_fee_cents    = late_days * floor(vehicle.base_daily_price_cents * LATE_FEE_MULTIPLIER)
      final_total_cents          = discounted_subtotal_cents + protection_premium_cents
                                   + mileage_fee_cents + fuel_fee_cents + late_fee_cents
      final_host_earnings_cents  = estimated_host_earnings_cents
                                   + mileage_fee_cents + fuel_fee_cents + late_fee_cents
    input_set: "The Trip's locked subtotal/premium/estimate + check-in and check-out inspection readings + logical clock"
    constants:
      MILEAGE_OVERAGE_RATE_CENTS: 50
      FUEL_CHARGE_PER_PCT_CENTS: 500
      LATE_FEE_MULTIPLIER: 1.5
      GRACE_HOURS: 2
    precision: "integer cents, floor truncation on late-fee per-day rate"
    variants:
      - name: final
        when: "at check-out"
        difference: "Uses actual odometer/fuel/return time; diverges from `estimate` by the incidental fees. Same trip inputs, two algorithms, two totals."

  - name: claim_settlement
    trigger: "POST /claims/{id}/approve"
    algorithm: threshold
    formula: |
      assessed              = claim.damage_amount_cents
      covered_amount_cents  = min(assessed, plan.coverage_limit_cents)
      guest_deductible_cents= min(plan.deductible_cents, covered_amount_cents)
      host_recovery_cents   = covered_amount_cents
      uncovered_cents       = max(0, assessed - covered_amount_cents)
    input_set: "One Claim's damage amount + the trip's ProtectionPlan coverage_limit and deductible"
    precision: "integer cents; nested min/max, no rounding"

  - name: driver_risk_score
    trigger: "POST /trips/{id}/complete; POST /claims/{id}/settle"
    algorithm: weighted_scoring
    formula: |
      driver_risk_score = min(100, at_fault_claim_count * AT_FAULT_WEIGHT
                                   + late_return_count * LATE_WEIGHT)
    input_set: "Guest's at_fault_claim_count and late_return_count"
    constants:
      AT_FAULT_WEIGHT: 20
      LATE_WEIGHT: 5
      MAX_SCORE: 100
    precision: "integer, capped at 100"
    variants:
      - name: provisional
        when: "read at booking time"
        difference: "Counts only outcomes from trips already COMPLETED and claims already SETTLED before this booking; excludes the in-flight trip."
      - name: finalized
        when: "recomputed on trip completion / claim settlement"
        difference: "Includes the just-completed trip's late flag and just-settled at-fault claim; diverges from provisional."

  - name: host_pending_balance
    trigger: "trip approve/cancel/complete; extension approve"
    algorithm: aggregation
    formula: |
      Host.pending_balance_cents = sum of Trip.estimated_host_earnings_cents
        for Trips with status in {CONFIRMED, CHECKED_IN} owned by this host
      Invariant (compensating): approving a Trip credits +estimated_host_earnings;
      cancelling that CONFIRMED Trip debits the identical amount, so after
      approve+cancel Host.pending_balance_cents equals its pre-approval value.
    input_set: "This host's CONFIRMED/CHECKED_IN trips"
    precision: "integer cents"

  - name: vehicle_booked_nights
    trigger: "booking create; trip cancel/decline; extension approve"
    algorithm: aggregation
    formula: |
      Vehicle.booked_night_count = sum of AvailabilityBlock.nights
        for this vehicle's AvailabilityBlocks with block_type=BOOKED and status=ACTIVE
      Invariant (compensating): booking adds +nights via a new BOOKED block;
      cancelling releases that block (status ACTIVE -> RELEASED), removing it from
      the sum, so after book+cancel Vehicle.booked_night_count returns to its
      pre-booking value.
    input_set: "This vehicle's ACTIVE BOOKED blocks"
    precision: "integer nights"

  - name: host_ledger_conservation
    trigger: "any host-balance mutation"
    algorithm: aggregation
    formula: |
      lifetime_earnings_cents = available_balance_cents + reserved_payout_cents + lifetime_paid_cents
                                + (deductions to guests are NOT part of host earnings)
      available_balance_cents >= 0 always; reserved_payout_cents >= 0 always
    input_set: "One Host's ledger fields"
    precision: "integer cents"

  - name: extension_added_earnings
    trigger: "POST /extensions/{id}/approve"
    algorithm: aggregation
    formula: |
      added_nights           = days_between(previous_end_date, new_end_date)
      new_est_host_earnings  = estimated_trip_settlement(nights = old_nights + added_nights)
      added_earnings_cents   = new_est_host_earnings - Trip.estimated_host_earnings_cents (pre-extension)
    input_set: "The Trip pre/post extension estimate"
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_AUTH_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role authorized for this operation per RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path/body resource ids exist (validated left-to-right)"
    error_id: "ERR_HOST_NOT_FOUND / ERR_GUEST_NOT_FOUND / ERR_VEHICLE_NOT_FOUND / ERR_PLAN_NOT_FOUND / ERR_TRIP_NOT_FOUND / ERR_BLOCK_NOT_FOUND / ERR_PRICING_RULE_NOT_FOUND / ERR_CLAIM_NOT_FOUND / ERR_EXTENSION_NOT_FOUND / ERR_PAYOUT_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with resource ids

  - priority: 4
    category: business_referential
    check: "entity_backed actor owns the target resource (Host owns Vehicle/Trip.vehicle; Guest owns Trip)"
    error_id: ERR_OWNERSHIP_VIOLATION
    http_status: 403
    applies_to: "host/guest mutating endpoints"

  - priority: 5
    category: state
    check: "OCC: expected_<parent>_version equals current parent.version"
    error_id: "ERR_STALE_VEHICLE_VERSION / ERR_STALE_HOST_VERSION"
    http_status: 412
    applies_to: "POST /trips, POST /payouts"

  - priority: 6
    category: state
    check: "Target resource in a valid state for the transition (includes cross-entity state: guest VERIFIED for booking, vehicle LISTED for booking, trip CHECKED_OUT/COMPLETED for claim, host ACTIVE for payout)"
    error_id: "ERR_INVALID_STATE / ERR_GUEST_NOT_VERIFIED / ERR_VEHICLE_NOT_LISTED / ERR_TRIP_NOT_CLAIMABLE / ERR_HOST_SUSPENDED"
    http_status: 409
    applies_to: "all state-changing endpoints"

  - priority: 7
    category: business_constraint
    check: "Value/format constraints: nights >= 1 (end > start); new_end_date > end_date; odometer monotonic; fuel 0..100; damage_amount > 0; nights <= MAX_TRIP_NIGHTS; payout amount >= MIN_PAYOUT_CENTS"
    error_id: "ERR_INVALID_DATE_RANGE / ERR_INVALID_ODOMETER / ERR_INVALID_FUEL_LEVEL / ERR_INVALID_CLAIM_AMOUNT / ERR_TRIP_TOO_LONG / ERR_PAYOUT_BELOW_MINIMUM"
    http_status: 422
    applies_to: "booking, extension, check-out, claim, payout"

  - priority: 8
    category: business_temporal
    check: "Requested window does not collide with an existing occupation on the resource (AvailabilityBlock half-open overlap; PricingRule closed-interval overlap)"
    error_id: "ERR_DATES_UNAVAILABLE / ERR_PRICING_RULE_OVERLAP"
    http_status: 409
    applies_to: "POST /trips, POST /extensions/{id}/approve, POST /pricing-rules, POST /vehicles/{id}/availability-blocks"

  - priority: 9
    category: business_referential
    check: "Uniqueness / linkage: a Trip may have at most one non-terminal (open) Claim; a Trip may have at most one REQUESTED Extension"
    error_id: "ERR_DUPLICATE_OPEN_CLAIM / ERR_DUPLICATE_OPEN_EXTENSION"
    http_status: 409
    applies_to: "POST /trips/{id}/claims, POST /trips/{id}/extensions"

  - priority: 10
    category: business_fiscal
    check: "Payout amount <= Host.available_balance_cents"
    error_id: ERR_INSUFFICIENT_BALANCE
    http_status: 402
    applies_to: "POST /payouts"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Hosts ---
  - { method: POST, path: "/hosts", description: "Register a host", roles: [Anonymous, PlatformAdmin], code: 201, input: [name, email, "payout_method_ref?"], output: Host, side_effects: ["status=ACTIVE"] }
  - { method: GET,  path: "/hosts/{id}", description: "Get host (with ledger)", roles: [Host, Guest, PlatformAdmin], code: 200, input: [], output: Host, side_effects: [] }
  - { method: POST, path: "/hosts/{id}/suspend", description: "Suspend a host (blocks payouts)", roles: [PlatformAdmin], code: 200, input: [], output: Host, side_effects: ["status -> SUSPENDED", "increments Host.version by 1"] }
  - { method: POST, path: "/hosts/{id}/reinstate", description: "Reinstate a suspended host", roles: [PlatformAdmin], code: 200, input: [], output: Host, side_effects: ["status -> ACTIVE", "increments Host.version by 1"] }

  # --- Guests ---
  - { method: POST, path: "/guests", description: "Register a guest", roles: [Anonymous, PlatformAdmin], code: 201, input: [name, email], output: Guest, side_effects: ["verification_status=UNVERIFIED"] }
  - { method: GET,  path: "/guests/{id}", description: "Get guest", roles: [Host, Guest, PlatformAdmin], code: 200, input: [], output: Guest, side_effects: [] }
  - { method: POST, path: "/guests/{id}/submit-verification", description: "Submit license for verification", roles: [Guest], code: 200, input: [license_number, license_state, license_expiry_date], output: Guest, side_effects: ["verification_status -> PENDING_REVIEW"] }
  - { method: POST, path: "/guests/{id}/verify", description: "Approve guest verification", roles: [PlatformAdmin], code: 200, input: [], output: Guest, side_effects: ["verification_status -> VERIFIED"] }
  - { method: POST, path: "/guests/{id}/reject", description: "Reject guest verification", roles: [PlatformAdmin], code: 200, input: ["reason?"], output: Guest, side_effects: ["verification_status -> REJECTED"] }

  # --- Protection plans ---
  - { method: POST, path: "/protection-plans", description: "Create a protection plan tier", roles: [PlatformAdmin], code: 201, input: [tier, deductible_cents, daily_premium_cents, coverage_limit_cents, host_earnings_pct], output: ProtectionPlan, side_effects: [] }
  - { method: GET,  path: "/protection-plans/{id}", description: "Get protection plan", roles: [Host, Guest, PlatformAdmin], code: 200, input: [], output: ProtectionPlan, side_effects: [] }
  - { method: GET,  path: "/protection-plans", description: "List protection plans", roles: [Host, Guest, PlatformAdmin], code: 200, input: ["active?"], output: "ProtectionPlan[]", side_effects: [] }

  # --- Vehicles ---
  - { method: POST, path: "/vehicles", description: "Create a vehicle listing (DRAFT)", roles: [Host], code: 201, input: [host_id, make, model, year, base_daily_price_cents, location_city, "daily_mileage_limit?", "weekly_discount_pct?", "monthly_discount_pct?", "odometer_current?"], output: Vehicle, side_effects: ["status=DRAFT"] }
  - { method: GET,  path: "/vehicles/{id}", description: "Get vehicle", roles: [Host, Guest, PlatformAdmin], code: 200, input: [], output: Vehicle, side_effects: [] }
  - { method: GET,  path: "/vehicles", description: "List/filter vehicles", roles: [Host, Guest, PlatformAdmin], code: 200, input: ["host_id?", "status?"], output: "Vehicle[]", side_effects: [] }
  - { method: PUT,  path: "/vehicles/{id}", description: "Edit vehicle pricing/config", roles: [Host], code: 200, input: ["base_daily_price_cents?", "daily_mileage_limit?", "weekly_discount_pct?", "monthly_discount_pct?", "location_city?", "odometer_current?"], output: Vehicle, side_effects: ["increments Vehicle.version by 1"] }
  - { method: POST, path: "/vehicles/{id}/list", description: "List the vehicle (make bookable)", roles: [Host], code: 200, input: [], output: Vehicle, side_effects: ["status -> LISTED", "increments Vehicle.version by 1"] }
  - { method: POST, path: "/vehicles/{id}/snooze", description: "Snooze listing", roles: [Host], code: 200, input: [], output: Vehicle, side_effects: ["status -> SNOOZED", "increments Vehicle.version by 1"] }
  - { method: POST, path: "/vehicles/{id}/unlist", description: "Unlist the vehicle (terminal)", roles: [Host], code: 200, input: [], output: Vehicle, side_effects: ["status -> UNLISTED", "increments Vehicle.version by 1"] }

  # --- Availability calendar ---
  - { method: POST, path: "/vehicles/{id}/availability-blocks", description: "Host blocks a calendar window", roles: [Host], code: 201, input: [start_date, end_date, "block_type?"], output: AvailabilityBlock, side_effects: ["status=ACTIVE"] }
  - { method: GET,  path: "/availability-blocks/{id}", description: "Get availability block", roles: [Host, Guest, PlatformAdmin], code: 200, input: [], output: AvailabilityBlock, side_effects: [] }
  - { method: GET,  path: "/availability-blocks", description: "List blocks by vehicle/trip", roles: [Host, Guest, PlatformAdmin], code: 200, input: ["vehicle_id?", "trip_id?", "status?"], output: "AvailabilityBlock[]", side_effects: [] }

  # --- Pricing rules ---
  - { method: POST, path: "/pricing-rules", description: "Create a dated price override", roles: [Host], code: 201, input: [vehicle_id, start_date, end_date, daily_price_cents], output: PricingRule, side_effects: ["status=ACTIVE"] }
  - { method: GET,  path: "/pricing-rules/{id}", description: "Get pricing rule", roles: [Host, Guest, PlatformAdmin], code: 200, input: [], output: PricingRule, side_effects: [] }
  - { method: GET,  path: "/pricing-rules", description: "List pricing rules by vehicle", roles: [Host, Guest, PlatformAdmin], code: 200, input: ["vehicle_id?"], output: "PricingRule[]", side_effects: [] }

  # --- Trips (booking + lifecycle) ---
  - { method: POST, path: "/trips", description: "Book a trip (REQUESTED)", roles: [Guest], code: 201, input: [vehicle_id, guest_id, protection_plan_id, start_date, end_date, expected_vehicle_version], output: Trip, side_effects: ["compute estimated_trip_settlement", "create BOOKED AvailabilityBlock", "Vehicle.booked_night_count += nights", "increments Vehicle.version by 1"] }
  - { method: GET,  path: "/trips/{id}", description: "Get trip", roles: [Host, Guest, PlatformAdmin], code: 200, input: [], output: Trip, side_effects: [] }
  - { method: GET,  path: "/trips", description: "List/filter trips", roles: [Host, Guest, PlatformAdmin], code: 200, input: ["vehicle_id?", "guest_id?", "protection_plan_id?", "status?"], output: "Trip[]", side_effects: [] }
  - { method: POST, path: "/trips/{id}/approve", description: "Host approves booking", roles: [Host], code: 200, input: [], output: Trip, side_effects: ["status -> CONFIRMED", "Host.pending_balance_cents += estimated_host_earnings_cents"] }
  - { method: POST, path: "/trips/{id}/decline", description: "Host declines booking", roles: [Host], code: 200, input: [], output: Trip, side_effects: ["status -> DECLINED", "release block", "Vehicle.booked_night_count -= nights"] }
  - { method: POST, path: "/trips/{id}/cancel", description: "Cancel a trip", roles: [Host, Guest], code: 200, input: ["reason?"], output: Trip, side_effects: ["status -> CANCELLED", "cascade: release block -> Vehicle.booked_night_count -= nights -> Host.pending_balance_cents -= estimated_host_earnings_cents (if was CONFIRMED)"] }
  - { method: POST, path: "/trips/{id}/check-in", description: "Guest checks in (odometer/fuel/photos)", roles: [Guest], code: 200, input: [odometer_reading, fuel_level_pct, photo_refs], output: Trip, side_effects: ["status -> CHECKED_IN", "create InspectionReport(CHECK_IN)"] }
  - { method: POST, path: "/trips/{id}/check-out", description: "Guest checks out; final settlement", roles: [Guest], code: 200, input: [odometer_reading, fuel_level_pct, photo_refs], output: Trip, side_effects: ["status -> CHECKED_OUT", "create InspectionReport(CHECK_OUT)", "compute final_trip_settlement", "consume block", "Guest.late_return_count += 1 if late"] }
  - { method: POST, path: "/trips/{id}/complete", description: "Host completes trip; settle earnings", roles: [Host], code: 200, input: [], output: Trip, side_effects: ["status -> COMPLETED", "pending->available ledger move", "Vehicle.odometer_current update", "Guest.driver_risk_score recompute"] }
  - { method: GET,  path: "/trips/{id}/inspections", description: "List a trip's inspection reports", roles: [Host, Guest, PlatformAdmin], code: 200, input: [], output: "InspectionReport[]", side_effects: [] }

  # --- Extensions ---
  - { method: POST, path: "/trips/{id}/extensions", description: "Guest requests a late-return extension", roles: [Guest], code: 201, input: [new_end_date], output: Extension, side_effects: ["status=REQUESTED", "snapshot previous_end_date"] }
  - { method: POST, path: "/extensions/{id}/approve", description: "Host approves extension (cascade)", roles: [Host], code: 200, input: [], output: Extension, side_effects: ["status -> APPROVED", "cascade Extension->Trip->AvailabilityBlock->{Vehicle,Host}"] }
  - { method: POST, path: "/extensions/{id}/deny", description: "Host denies extension", roles: [Host], code: 200, input: [], output: Extension, side_effects: ["status -> DENIED"] }
  - { method: GET,  path: "/extensions/{id}", description: "Get extension", roles: [Host, Guest, PlatformAdmin], code: 200, input: [], output: Extension, side_effects: [] }
  - { method: GET,  path: "/extensions", description: "List extensions by trip", roles: [Host, Guest, PlatformAdmin], code: 200, input: ["trip_id?"], output: "Extension[]", side_effects: [] }

  # --- Claims ---
  - { method: POST, path: "/trips/{id}/claims", description: "File an incident/damage claim", roles: [Host, Guest], code: 201, input: [claimant, damage_amount_cents, description], output: Claim, side_effects: ["status=FILED"] }
  - { method: POST, path: "/claims/{id}/start-review", description: "Adjudicator starts review", roles: [PlatformAdmin], code: 200, input: [], output: Claim, side_effects: ["status -> UNDER_REVIEW"] }
  - { method: POST, path: "/claims/{id}/request-info", description: "Request more info", roles: [PlatformAdmin], code: 200, input: [], output: Claim, side_effects: ["status -> NEEDS_INFO"] }
  - { method: POST, path: "/claims/{id}/provide-info", description: "Party provides requested info", roles: [Host, Guest], code: 200, input: ["note?"], output: Claim, side_effects: ["status -> UNDER_REVIEW"] }
  - { method: POST, path: "/claims/{id}/approve", description: "Approve claim; compute settlement", roles: [PlatformAdmin], code: 200, input: ["resolution_note?"], output: Claim, side_effects: ["status -> APPROVED", "compute claim_settlement"] }
  - { method: POST, path: "/claims/{id}/deny", description: "Deny claim", roles: [PlatformAdmin], code: 200, input: ["resolution_note?"], output: Claim, side_effects: ["status -> DENIED"] }
  - { method: POST, path: "/claims/{id}/settle", description: "Settle approved claim; move funds", roles: [PlatformAdmin], code: 200, input: [], output: Claim, side_effects: ["status -> SETTLED", "guest deductible + host recovery applied", "guest risk recompute if at-fault"] }
  - { method: GET,  path: "/claims/{id}", description: "Get claim", roles: [Host, Guest, PlatformAdmin], code: 200, input: [], output: Claim, side_effects: [] }
  - { method: GET,  path: "/claims", description: "List claims by trip", roles: [Host, Guest, PlatformAdmin], code: 200, input: ["trip_id?"], output: "Claim[]", side_effects: [] }

  # --- Payouts ---
  - { method: POST, path: "/payouts", description: "Host requests a payout", roles: [Host], code: 201, input: [host_id, amount_cents, expected_host_version, "trip_id?"], output: Payout, side_effects: ["status=REQUESTED", "Host.available_balance_cents -= amount", "Host.reserved_payout_cents += amount", "increments Host.version by 1"] }
  - { method: POST, path: "/payouts/{id}/mark-paid", description: "Mark payout paid", roles: [PlatformAdmin], code: 200, input: [], output: Payout, side_effects: ["status -> PAID", "reserved -= amount", "lifetime_paid += amount"] }
  - { method: POST, path: "/payouts/{id}/mark-failed", description: "Mark payout failed; return funds", roles: [PlatformAdmin], code: 200, input: ["failure_reason?"], output: Payout, side_effects: ["status -> FAILED", "reserved -= amount", "available += amount"] }
  - { method: GET,  path: "/payouts/{id}", description: "Get payout", roles: [Host, Guest, PlatformAdmin], code: 200, input: [], output: Payout, side_effects: [] }
  - { method: GET,  path: "/payouts", description: "List payouts by host/trip", roles: [Host, Guest, PlatformAdmin], code: 200, input: ["host_id?", "trip_id?"], output: "Payout[]", side_effects: [] }

  # --- Test-driving: logical clock ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set logical UTC clock. Server default before any call is 2026-05-01T00:00:00Z (never real wall-clock).", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: null, side_effects: ["logical clock advanced"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_AUTH_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/invalid" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body, missing required field, or invalid enum/type" }
  - { id: ERR_OWNERSHIP_VIOLATION, http: 403, condition: "Acting entity_backed user is not the owner of the target resource" }
  - { id: ERR_HOST_NOT_FOUND, http: 404, condition: "Host id does not exist" }
  - { id: ERR_GUEST_NOT_FOUND, http: 404, condition: "Guest id does not exist" }
  - { id: ERR_VEHICLE_NOT_FOUND, http: 404, condition: "Vehicle id does not exist" }
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "ProtectionPlan id does not exist" }
  - { id: ERR_TRIP_NOT_FOUND, http: 404, condition: "Trip id does not exist" }
  - { id: ERR_BLOCK_NOT_FOUND, http: 404, condition: "AvailabilityBlock id does not exist" }
  - { id: ERR_PRICING_RULE_NOT_FOUND, http: 404, condition: "PricingRule id does not exist" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "Claim id does not exist" }
  - { id: ERR_EXTENSION_NOT_FOUND, http: 404, condition: "Extension id does not exist" }
  - { id: ERR_PAYOUT_NOT_FOUND, http: 404, condition: "Payout id does not exist" }
  - { id: ERR_STALE_VEHICLE_VERSION, http: 412, condition: "expected_vehicle_version != Vehicle.version (OCC)" }
  - { id: ERR_STALE_HOST_VERSION, http: 412, condition: "expected_host_version != Host.version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not allowed from current state" }
  - { id: ERR_GUEST_NOT_VERIFIED, http: 409, condition: "Booking requires Guest.verification_status == VERIFIED" }
  - { id: ERR_VEHICLE_NOT_LISTED, http: 409, condition: "Booking requires Vehicle.status == LISTED" }
  - { id: ERR_TRIP_NOT_CLAIMABLE, http: 409, condition: "Claim requires Trip.status in {CHECKED_OUT, COMPLETED}" }
  - { id: ERR_HOST_SUSPENDED, http: 409, condition: "Payout requires Host.status == ACTIVE" }
  - { id: ERR_INVALID_DATE_RANGE, http: 422, condition: "end_date <= start_date (zero/negative nights) or new_end_date <= end_date" }
  - { id: ERR_INVALID_ODOMETER, http: 422, condition: "check-out odometer_reading < check-in odometer" }
  - { id: ERR_INVALID_FUEL_LEVEL, http: 422, condition: "fuel_level_pct outside 0..100" }
  - { id: ERR_INVALID_CLAIM_AMOUNT, http: 422, condition: "damage_amount_cents <= 0" }
  - { id: ERR_TRIP_TOO_LONG, http: 422, condition: "nights (incl. extension) exceed MAX_TRIP_NIGHTS (90)" }
  - { id: ERR_PAYOUT_BELOW_MINIMUM, http: 422, condition: "amount_cents < MIN_PAYOUT_CENTS (5000)" }
  - { id: ERR_DATES_UNAVAILABLE, http: 409, condition: "Requested trip/extension window overlaps an ACTIVE BOOKED block (half-open)" }
  - { id: ERR_PRICING_RULE_OVERLAP, http: 409, condition: "New PricingRule closed interval overlaps an ACTIVE rule on the vehicle" }
  - { id: ERR_DUPLICATE_OPEN_CLAIM, http: 409, condition: "Trip already has a non-terminal Claim" }
  - { id: ERR_DUPLICATE_OPEN_EXTENSION, http: 409, condition: "Trip already has a REQUESTED Extension" }
  - { id: ERR_INSUFFICIENT_BALANCE, http: 402, condition: "Payout amount_cents > Host.available_balance_cents" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated self-signup surface"
    identity: opaque
    exclusive_operations:
      - "POST /hosts — register host"
      - "POST /guests — register guest"
    shared_operations: []

  - name: Host
    description: "Vehicle owner; manages listings, pricing, availability, bookings, extensions, host claims, payouts"
    identity: "entity_backed:Host"
    exclusive_operations:
      - "POST /vehicles, PUT /vehicles/{id}, POST /vehicles/{id}/list|snooze|unlist"
      - "POST /vehicles/{id}/availability-blocks"
      - "POST /pricing-rules"
      - "POST /trips/{id}/approve|decline|complete"
      - "POST /extensions/{id}/approve|deny"
      - "POST /payouts"
    shared_operations:
      - "POST /trips/{id}/cancel (with Guest)"
      - "POST /trips/{id}/claims, POST /claims/{id}/provide-info (with Guest)"
      - "GET reads (with Guest, PlatformAdmin)"

  - name: Guest
    description: "Renter; verifies identity, books trips, checks in/out, requests extensions, files guest claims"
    identity: "entity_backed:Guest"
    exclusive_operations:
      - "POST /guests/{id}/submit-verification"
      - "POST /trips (book)"
      - "POST /trips/{id}/check-in|check-out"
      - "POST /trips/{id}/extensions"
    shared_operations:
      - "POST /trips/{id}/cancel (with Host)"
      - "POST /trips/{id}/claims, POST /claims/{id}/provide-info (with Host)"
      - "GET reads (with Host, PlatformAdmin)"

  - name: PlatformAdmin
    description: "Operator; verifies guests, manages protection plans, adjudicates claims, settles payouts, controls logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /guests/{id}/verify|reject"
      - "POST /protection-plans"
      - "POST /claims/{id}/start-review|request-info|approve|deny|settle"
      - "POST /payouts/{id}/mark-paid|mark-failed"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /hosts, POST /guests (with Anonymous)"
      - "GET reads (with Host, Guest)"
