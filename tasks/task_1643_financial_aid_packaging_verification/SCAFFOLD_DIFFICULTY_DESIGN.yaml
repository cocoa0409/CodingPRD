            - "FundType.${f_seog}.status == ACTIVE (cascade link 3: release of 200000 dropped reserved to 150000 < 350000)"
            - "FundType.${f_seog}.pool_reserved_cents == 150000"
            - "AwardPackage.${pkg_a}.status == DECLINED"

      - name: disbursement_post_aggregate_bubble_cascade
        grounds:
          - state_machines.Disbursement.ELIGIBILITY_PASSED_to_POSTED
          - state_machines.AwardLine.DISBURSING_to_DISBURSED
          - entities.AidYear.fields.total_disbursed_cents
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (disbursement post vs package
          decline): (1) Disbursement ELIGIBILITY_PASSED->POSTED adds
          scheduled_cents to AwardLine.disbursed_cents; (2) the line mutation
          where disbursed_cents == accepted_cents fires the AwardLine
          DISBURSING->DISBURSED auto-transition; FundType.pool_disbursed_cents
          and AidYear.total_disbursed_cents also increment as ledger-sync
          siblings of link 1.
