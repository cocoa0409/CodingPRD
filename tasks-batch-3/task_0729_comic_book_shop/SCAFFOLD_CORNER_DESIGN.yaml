scaffold_corner_design:
  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_customer_returns_defaults
        claim_type: Creation
        grounds: [entities.Customer, endpoints]
        distinguishing_aspect: "POST /api/customers with email+full_name returns 201 with loyalty_tier=BRONZE, store_credit_cents=0, loyalty_points_balance=0, lifetime_spend_cents=0, status=ACTIVE."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/customers"
              payload: { email: "new@x.com", full_name: "New Cust" }
              as: Clerk
              captures: { cust: $.data.id }
          assert:
            - "Customer.${cust}.loyalty_tier == BRONZE"
            - "Customer.${cust}.store_credit_cents == 0"
            - "Customer.${cust}.status == ACTIVE"

      - name: create_customer_missing_full_name_returns_validation
        claim_type: Required Fields
        grounds: [entities.Customer.fields.full_name, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /api/customers omitting full_name returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/customers"
              payload: { email: "x@x.com" }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_VALIDATION"

      - name: get_customer_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Customer, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /api/customers/{id} with an unknown id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /api/customers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: comic_issue_computed_copies_available_ignores_input
        claim_type: Computed Fields
        grounds: [entities.ComicIssue.fields.copies_available, calculations.issue_copies_available]
        distinguishing_aspect: "On create, copies_available equals copies_ordered (10) regardless of any client attempt; it is computed, not input."
        test_recipe:
          setup: ["One ACTIVE series."]
          setup_api_calls:
            - call: "POST /api/comic-series"
              payload: { title: "CF", publisher: "Acme" }
              as: Clerk
              captures: { series: $.data.id }
          trigger:
            - call: "POST /api/comic-issues"
              payload: { series_id: "${series}", issue_number: "1", cover_price_cents: 400, on_sale_date: "2026-04-01T00:00:00Z", order_cutoff_date: "2026-03-15T00:00:00Z", copies_ordered: 10 }
              as: Clerk
              captures: { issue: $.data.id }
          assert:
            - "ComicIssue.${issue}.copies_available == 10"
            - "ComicIssue.${issue}.copies_allocated == 0"

      - name: comic_issue_bad_enum_condition_backissue_validation
        claim_type: Type Constraints
        grounds: [entities.BackIssue.fields.condition, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /api/back-issues with condition='MINT' (not in {RAW,GRADED}) returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["One ACTIVE series."]
          setup_api_calls:
            - call: "POST /api/comic-series"
              payload: { title: "BI", publisher: "Acme" }
              as: Clerk
              captures: { series: $.data.id }
          trigger:
            - call: "POST /api/back-issues"
              payload: { series_id: "${series}", issue_number: "1", condition: "MINT", price_cents: 500 }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_VALIDATION"

      - name: credit_transaction_immutable_no_version
        claim_type: Immutability
        grounds: [entities.CreditTransaction]
        distinguishing_aspect: "CreditTransaction has common_fields:false — it exposes id and created_at but no version field and no update endpoint."
        test_recipe:
          setup: ["One customer credited +1000."]
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { email: "imm@x.com", full_name: "Imm" }
              as: Clerk
              captures: { cust: $.data.id }
            - call: "POST /api/customers/${cust}/credit-adjustments"
              payload: { amount_cents: 1000, reason: "ADJUSTMENT" }
              as: Manager
              captures: { txn: $.data.id }
          trigger:
            - call: "GET /api/credit-transactions/${txn}"
              payload: {}
              as: Manager
              captures: { amt: $.data.amount_cents }
          assert:
            - "CreditTransaction.${txn}.amount_cents == 1000"
            - "CreditTransaction.${txn}.balance_after_cents == 1000"

  # =========================================================================
  # State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: comic_issue_initial_state_solicited
        claim_type: Initial State
        grounds: [state_machines.ComicIssue, entities.ComicIssue.fields.status]
        distinguishing_aspect: "A newly created ComicIssue starts in SOLICITED."
        test_recipe:
          setup: ["One ACTIVE series."]
          setup_api_calls:
            - call: "POST /api/comic-series"
              payload: { title: "Init", publisher: "Acme" }
              as: Clerk
              captures: { series: $.data.id }
          trigger:
            - call: "POST /api/comic-issues"
              payload: { series_id: "${series}", issue_number: "1", cover_price_cents: 400, on_sale_date: "2026-04-01T00:00:00Z", order_cutoff_date: "2026-03-15T00:00:00Z", copies_ordered: 5 }
              as: Clerk
              captures: { issue: $.data.id }
          assert:
            - "ComicIssue.${issue}.status == SOLICITED"

      - name: comic_issue_skip_to_on_sale_invalid
        claim_type: invalid_transition
        grounds: [state_machines.ComicIssue.SOLICITED_to_ORDERED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Transitioning a SOLICITED issue directly to ON_SALE (no ORDERED step defined from SOLICITED) returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["One SOLICITED issue."]
          setup_api_calls:
            - call: "POST /api/comic-series"
              payload: { title: "Skip", publisher: "Acme" }
              as: Clerk
              captures: { series: $.data.id }
            - call: "POST /api/comic-issues"
              payload: { series_id: "${series}", issue_number: "1", cover_price_cents: 400, on_sale_date: "2026-04-01T00:00:00Z", order_cutoff_date: "2026-03-15T00:00:00Z", copies_ordered: 5 }
              as: Clerk
              captures: { issue: $.data.id }
          trigger:
            - call: "POST /api/comic-issues/${issue}/transition"
              payload: { to_status: "ON_SALE" }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: comic_issue_close_expires_open_reservations
        claim_type: Side Effect Execution
        grounds: [state_machines.ComicIssue.ON_SALE_to_CLOSED, state_machines.Reservation, entities.ComicIssue.fields.copies_reserved]
        distinguishing_aspect: "Closing an ON_SALE issue expires its RESERVED reservation (status EXPIRED) and drops copies_reserved to 0."
        test_recipe:
          setup: ["ON_SALE issue copies_ordered=5 with one RESERVED reservation qty1."]
          setup_api_calls:
            - call: "POST /api/comic-series"
              payload: { title: "Cls", publisher: "Acme" }
              as: Clerk
              captures: { series: $.data.id }
            - call: "POST /api/comic-issues"
              payload: { series_id: "${series}", issue_number: "1", cover_price_cents: 400, on_sale_date: "2026-04-01T00:00:00Z", order_cutoff_date: "2026-03-15T00:00:00Z", copies_ordered: 5 }
              as: Clerk
              captures: { issue: $.data.id }
            - call: "POST /api/comic-issues/${issue}/transition"
              payload: { to_status: "ORDERED" }
              as: Clerk
            - call: "POST /api/comic-issues/${issue}/transition"
              payload: { to_status: "ON_SALE" }
              as: Clerk
              captures: { iss_v: $.data.version }
            - call: "POST /api/customers"
              payload: { email: "cls@x.com", full_name: "Cls" }
              as: Clerk
              captures: { cust: $.data.id }
            - call: "POST /api/reservations"
              payload: { customer_id: "${cust}", issue_id: "${issue}", requested_qty: 1, expected_comic_issue_version: "${iss_v}" }
              as: Clerk
              captures: { res: $.data.id }
          trigger:
            - call: "POST /api/comic-issues/${issue}/transition"
              payload: { to_status: "CLOSED" }
              as: Clerk
          assert:
            - "Reservation.${res}.status == EXPIRED"
            - "ComicIssue.${issue}.copies_reserved == 0"

      - name: grading_terminal_pickedup_no_further_transition
        claim_type: Terminal State Lockdown
        grounds: [state_machines.GradingSubmission, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A PICKED_UP grading submission rejects any further transition (e.g. to AT_GRADER) with ERR_INVALID_STATE."
        test_recipe:
          setup: ["GradingSubmission advanced all the way to PICKED_UP."]
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { email: "term@x.com", full_name: "Term" }
              as: Clerk
              captures: { cust: $.data.id }
            - call: "POST /api/grading-submissions"
              payload: { customer_id: "${cust}", description: "book", declared_value_cents: 1000 }
              as: Clerk
              captures: { gs: $.data.id }
            - call: "POST /api/grading-submissions/${gs}/transition"
              payload: { to_status: "SUBMITTED" }
              as: Clerk
            - call: "POST /api/grading-submissions/${gs}/transition"
              payload: { to_status: "AT_GRADER" }
              as: Clerk
            - call: "POST /api/grading-submissions/${gs}/transition"
              payload: { to_status: "RETURNED", grade_result: 8.5 }
              as: Clerk
            - call: "POST /api/grading-submissions/${gs}/transition"
              payload: { to_status: "READY_FOR_PICKUP" }
              as: Clerk
            - call: "POST /api/grading-submissions/${gs}/transition"
              payload: { to_status: "PICKED_UP" }
              as: Clerk
          trigger:
            - call: "POST /api/grading-submissions/${gs}/transition"
              payload: { to_status: "AT_GRADER" }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: subscription_pause_resume_valid_cycle
        claim_type: Valid Transition
        grounds: [state_machines.PullSubscription.ACTIVE_to_PAUSED, state_machines.PullSubscription.PAUSED_to_ACTIVE]
        distinguishing_aspect: "An ACTIVE subscription can be PAUSED then resumed back to ACTIVE (cyclic)."
        test_recipe:
          setup: ["Customer with ACTIVE subscription to a series."]
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { email: "sub@x.com", full_name: "Sub" }
              as: Clerk
              captures: { cust: $.data.id }
            - call: "POST /api/comic-series"
              payload: { title: "Sc", publisher: "Acme" }
              as: Clerk
              captures: { series: $.data.id }
            - call: "POST /api/pull-subscriptions"
              payload: { customer_id: "${cust}", series_id: "${series}" }
              as: Clerk
              captures: { sub: $.data.id }
            - call: "POST /api/pull-subscriptions/${sub}/transition"
              payload: { to_status: "PAUSED" }
              as: Clerk
          trigger:
            - call: "POST /api/pull-subscriptions/${sub}/transition"
              payload: { to_status: "ACTIVE" }
              as: Clerk
          assert:
            - "PullSubscription.${sub}.status == ACTIVE"

      - name: event_complete_marks_registered_no_show
        claim_type: Side Effect Execution
        grounds: [state_machines.Event.CLOSED_to_COMPLETED, state_machines.EventRegistration]
        distinguishing_aspect: "Completing a CLOSED event flips its still-REGISTERED registration to NO_SHOW."
        test_recipe:
          setup: ["Event OPEN with one REGISTERED customer, then CLOSED."]
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { email: "cmp@x.com", full_name: "Cmp" }
              as: Clerk
              captures: { cust: $.data.id }
            - call: "POST /api/events"
              payload: { name: "Cmp", store_location: "LOCC", starts_at: "2026-05-05T10:00:00Z", ends_at: "2026-05-05T12:00:00Z", capacity: 5 }
              as: Clerk
              captures: { ev: $.data.id }
            - call: "POST /api/events/${ev}/transition"
              payload: { to_status: "OPEN" }
              as: Clerk
            - call: "POST /api/event-registrations"
              payload: { customer_id: "${cust}", event_id: "${ev}" }
              as: Clerk
              captures: { reg: $.data.id }
            - call: "POST /api/events/${ev}/transition"
              payload: { to_status: "CLOSED" }
              as: Clerk
          trigger:
            - call: "POST /api/events/${ev}/transition"
              payload: { to_status: "COMPLETED" }
              as: Clerk
          assert:
            - "EventRegistration.${reg}.status == NO_SHOW"

  # =========================================================================
  # Calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: estimated_total_computed_from_cover_price
        claim_type: Correct Result
        grounds: [entities.PreOrder.fields.estimated_total_cents]
        distinguishing_aspect: "A pre-order qty=3 on an issue cover_price_cents=450 stores estimated_total_cents == 1350."
        test_recipe:
          setup: ["Issue cover_price_cents=450."]
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { email: "est@x.com", full_name: "Est" }
              as: Clerk
              captures: { cust: $.data.id }
            - call: "POST /api/comic-series"
              payload: { title: "Est", publisher: "Acme" }
              as: Clerk
              captures: { series: $.data.id }
            - call: "POST /api/comic-issues"
              payload: { series_id: "${series}", issue_number: "1", cover_price_cents: 450, on_sale_date: "2026-04-01T00:00:00Z", order_cutoff_date: "2026-03-15T00:00:00Z", copies_ordered: 10 }
              as: Clerk
              captures: { issue: $.data.id }
          trigger:
            - call: "POST /api/pre-orders"
              payload: { customer_id: "${cust}", issue_id: "${issue}", quantity: 3 }
              as: Clerk
              captures: { po: $.data.id }
          assert:
            - "PreOrder.${po}.estimated_total_cents == 1350"

      - name: consignment_provisional_rounds_half_up
        claim_type: Precision
        grounds: [calculations.consignment_payout, entities.Consignment.fields.provisional_payout_cents]
        distinguishing_aspect: "asking_price_cents=999 with commission_pct=0.30 gives 999*0.7=699.3 -> round_half_up -> 699 provisional payout cents."
        test_recipe:
          setup: ["Consignment asking_price_cents=999, commission_pct=0.30."]
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { email: "rnd@x.com", full_name: "Rnd" }
              as: Clerk
              captures: { cust: $.data.id }
            - call: "POST /api/consignments"
              payload: { consignor_id: "${cust}", description: "rounder", asking_price_cents: 999, commission_pct: 0.30 }
              as: Clerk
              captures: { cons: $.data.id }
          trigger:
            - call: "POST /api/consignments/${cons}/transition"
              payload: { to_status: "LISTED" }
              as: Clerk
          assert:
            - "Consignment.${cons}.provisional_payout_cents == 699"

      - name: allocation_waterfall_orders_by_tier_then_created_at
        claim_type: Input Set Filtering
        grounds: [calculations.new_comic_day_allocation, state_machines.Reservation.RESERVED_to_WAITLISTED]
        distinguishing_aspect: "With copies_ordered=1 and two BRONZE reservations, the earlier-created (created_at ASC) one is ALLOCATED and the later is WAITLISTED — id plays no role in ordering."
        test_recipe:
          setup: ["ON_SALE issue copies_ordered=1; two BRONZE customers each with a RESERVED qty1 reservation created in order."]
          setup_api_calls:
            - call: "POST /api/comic-series"
              payload: { title: "Wf", publisher: "Acme" }
              as: Clerk
              captures: { series: $.data.id }
            - call: "POST /api/comic-issues"
              payload: { series_id: "${series}", issue_number: "1", cover_price_cents: 400, on_sale_date: "2026-04-01T00:00:00Z", order_cutoff_date: "2026-03-15T00:00:00Z", copies_ordered: 1 }
              as: Clerk
              captures: { issue: $.data.id }
            - call: "POST /api/comic-issues/${issue}/transition"
              payload: { to_status: "ORDERED" }
              as: Clerk
            - call: "POST /api/comic-issues/${issue}/transition"
              payload: { to_status: "ON_SALE" }
              as: Clerk
            - call: "POST /api/customers"
              payload: { email: "w1@x.com", full_name: "W1" }
              as: Clerk
              captures: { c1: $.data.id }
            - call: "POST /api/customers"
              payload: { email: "w2@x.com", full_name: "W2" }
              as: Clerk
              captures: { c2: $.data.id }
            - call: "GET /api/comic-issues/${issue}"
              payload: {}
              as: Clerk
              captures: { v1: $.data.version }
            - call: "POST /api/reservations"
              payload: { customer_id: "${c1}", issue_id: "${issue}", requested_qty: 1, expected_comic_issue_version: "${v1}" }
              as: Clerk
              captures: { r1: $.data.id }
            - call: "GET /api/comic-issues/${issue}"
              payload: {}
              as: Clerk
              captures: { v2: $.data.version }
            - call: "POST /api/reservations"
              payload: { customer_id: "${c2}", issue_id: "${issue}", requested_qty: 1, expected_comic_issue_version: "${v2}" }
              as: Clerk
              captures: { r2: $.data.id }
          trigger:
            - call: "POST /api/comic-issues/${issue}/run-allocation"
              payload: {}
              as: Clerk
          assert:
            - "Reservation.${r1}.status == ALLOCATED"
            - "Reservation.${r2}.status == WAITLISTED"

  # =========================================================================
  # Validations
  # =========================================================================
  - section: validations
    instances:
      - name: consignment_sell_without_sale_price_rejected
        claim_type: Violation → Error
        grounds: [state_machines.Consignment.LISTED_to_SOLD, "errors[ERR_SALE_PRICE_REQUIRED]"]
        distinguishing_aspect: "Selling a LISTED consignment without sale_price_cents returns ERR_SALE_PRICE_REQUIRED (422)."
        test_recipe:
          setup: ["Consignment LISTED."]
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { email: "sp@x.com", full_name: "Sp" }
              as: Clerk
              captures: { cust: $.data.id }
            - call: "POST /api/consignments"
              payload: { consignor_id: "${cust}", description: "sp", asking_price_cents: 5000 }
              as: Clerk
              captures: { cons: $.data.id }
            - call: "POST /api/consignments/${cons}/transition"
              payload: { to_status: "LISTED" }
              as: Clerk
          trigger:
            - call: "POST /api/consignments/${cons}/transition"
              payload: { to_status: "SOLD" }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_SALE_PRICE_REQUIRED"

      - name: preorder_confirm_past_cutoff_rejected
        claim_type: Temporal validation
        grounds: [state_machines.PreOrder.PENDING_to_CONFIRMED, "errors[ERR_PAST_CUTOFF]"]
        distinguishing_aspect: "Confirming a PENDING pre-order after the clock passes order_cutoff_date (issue still SOLICITED) returns ERR_PAST_CUTOFF (422)."
        test_recipe:
          setup: ["PENDING pre-order on a SOLICITED issue with cutoff 2026-03-15; clock advanced to 2026-03-20."]
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { email: "cut@x.com", full_name: "Cut" }
              as: Clerk
              captures: { cust: $.data.id }
            - call: "POST /api/comic-series"
              payload: { title: "Cut", publisher: "Acme" }
              as: Clerk
              captures: { series: $.data.id }
            - call: "POST /api/comic-issues"
              payload: { series_id: "${series}", issue_number: "1", cover_price_cents: 400, on_sale_date: "2026-04-01T00:00:00Z", order_cutoff_date: "2026-03-15T00:00:00Z", copies_ordered: 5 }
              as: Clerk
              captures: { issue: $.data.id }
            - call: "POST /api/pre-orders"
              payload: { customer_id: "${cust}", issue_id: "${issue}", quantity: 1 }
              as: Clerk
              captures: { po: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-20T00:00:00Z" }
              as: Clerk
          trigger:
            - call: "POST /api/pre-orders/${po}/transition"
              payload: { to_status: "CONFIRMED" }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_PAST_CUTOFF"

      - name: duplicate_event_registration_rejected
        claim_type: Violation → Error
        grounds: ["errors[ERR_DUPLICATE_REGISTRATION]"]
        distinguishing_aspect: "A second registration for the same customer+event while the first is REGISTERED returns ERR_DUPLICATE_REGISTRATION (409)."
        test_recipe:
          setup: ["OPEN event with one REGISTERED registration for the customer."]
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { email: "dup@x.com", full_name: "Dup" }
              as: Clerk
              captures: { cust: $.data.id }
            - call: "POST /api/events"
              payload: { name: "Dup", store_location: "LOCD", starts_at: "2026-05-06T10:00:00Z", ends_at: "2026-05-06T12:00:00Z", capacity: 5 }
              as: Clerk
              captures: { ev: $.data.id }
            - call: "POST /api/events/${ev}/transition"
              payload: { to_status: "OPEN" }
              as: Clerk
            - call: "POST /api/event-registrations"
              payload: { customer_id: "${cust}", event_id: "${ev}" }
              as: Clerk
          trigger:
            - call: "POST /api/event-registrations"
              payload: { customer_id: "${cust}", event_id: "${ev}" }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_DUPLICATE_REGISTRATION"

      - name: grading_dispute_limit_reached_rejected
        claim_type: Conditional validation
        grounds: [state_machines.GradingSubmission.RETURNED_to_AT_GRADER, "errors[ERR_DISPUTE_LIMIT_REACHED]"]
        distinguishing_aspect: "A 4th dispute (dispute_count already 3 = DISPUTE_LIMIT) on a RETURNED submission returns ERR_DISPUTE_LIMIT_REACHED (409)."
        test_recipe:
          setup: ["GradingSubmission cycled through 3 disputes (dispute_count=3), currently RETURNED."]
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { email: "dl@x.com", full_name: "DL" }
              as: Clerk
              captures: { cust: $.data.id }
            - call: "POST /api/grading-submissions"
              payload: { customer_id: "${cust}", description: "book", declared_value_cents: 1000 }
              as: Clerk
              captures: { gs: $.data.id }
            - call: "POST /api/grading-submissions/${gs}/transition"
              payload: { to_status: "SUBMITTED" }
              as: Clerk
            - call: "POST /api/grading-submissions/${gs}/transition"
              payload: { to_status: "AT_GRADER" }
              as: Clerk
            - call: "POST /api/grading-submissions/${gs}/transition"
              payload: { to_status: "RETURNED", grade_result: 8.0 }
              as: Clerk
            - call: "POST /api/grading-submissions/${gs}/transition"
              payload: { to_status: "AT_GRADER" }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /api/grading-submissions/${gs}/transition"
              payload: { to_status: "RETURNED", grade_result: 8.1 }
              as: Clerk
            - call: "POST /api/grading-submissions/${gs}/transition"
              payload: { to_status: "AT_GRADER" }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /api/grading-submissions/${gs}/transition"
              payload: { to_status: "RETURNED", grade_result: 8.2 }
              as: Clerk
            - call: "POST /api/grading-submissions/${gs}/transition"
              payload: { to_status: "AT_GRADER" }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /api/grading-submissions/${gs}/transition"
              payload: { to_status: "RETURNED", grade_result: 8.3 }
              as: Clerk
          trigger:
            - call: "POST /api/grading-submissions/${gs}/transition"
              payload: { to_status: "AT_GRADER" }
              as: Customer
              as_user_id: "${cust}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_DISPUTE_LIMIT_REACHED"
            - "GradingSubmission.${gs}.dispute_count == 3"

      - name: event_ends_before_starts_validation
        claim_type: Violation → Error
        grounds: [entities.Event.fields.ends_at, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Creating an event with ends_at <= starts_at returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/events"
              payload: { name: "Bad", store_location: "LOCX", starts_at: "2026-05-07T12:00:00Z", ends_at: "2026-05-07T10:00:00Z", capacity: 5 }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_VALIDATION"

      - name: insufficient_store_credit_only_checkout_rejected
        claim_type: Violation → Error
        grounds: [calculations.checkout_settlement, "errors[ERR_INSUFFICIENT_STORE_CREDIT]"]
        distinguishing_aspect: "pay_with_store_credit_only checkout of 5000 cents by a customer with store_credit_cents=1000 returns ERR_INSUFFICIENT_STORE_CREDIT (402)."
        test_recipe:
          setup: ["Customer with store_credit_cents=1000."]
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { email: "isc@x.com", full_name: "Isc" }
              as: Clerk
              captures: { cust: $.data.id }
            - call: "POST /api/customers/${cust}/credit-adjustments"
              payload: { amount_cents: 1000, reason: "ADJUSTMENT" }
              as: Manager
          trigger:
            - call: "POST /api/checkout"
              payload: { customer_id: "${cust}", line_items: [ { unit_price_cents: 5000, quantity: 1 } ], pay_with_store_credit_only: true }
              as: Clerk
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INSUFFICIENT_STORE_CREDIT"

  # =========================================================================
