      - name: noit_sixty_day_boundary
        grounds:
          - validations[priority=10]
          - errors[ERR_NOIT_TIMING_WINDOW]
          - state_machines.TerminationCase.DRAFT_to_NOTICE_OF_INTENT_ISSUED
        distinguishing_aspect: |
          Calendar-days metric via POST /notices (different metric and endpoint
          than the cents-tier sibling): a NOIT issued exactly 60 days before the
          termination date is valid (inclusive bound), while 59 days before is
          ERR_NOIT_TIMING_WINDOW — one day flips the outcome.
        test_recipe:
          setup:
            - "Two fresh cases, both with proposed_termination_date 2026-10-15T00:00:00Z."
          setup_api_calls:
            - { call: "POST /termination-cases", payload: { plan_name: "Sixty OK Co 401k", sponsor_ein: "123456789", plan_number: "071", proposed_termination_date: "2026-10-15T00:00:00Z" }, as: PlanAdministrator, captures: { c_ok: "$.data.id", c_ok_v: "$.data.version" } }
            - { call: "POST /termination-cases", payload: { plan_name: "Fiftynine Co 401k", sponsor_ein: "123456789", plan_number: "072", proposed_termination_date: "2026-10-15T00:00:00Z" }, as: PlanAdministrator, captures: { c_bad: "$.data.id", c_bad_v: "$.data.version" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-16T00:00:00Z" }, as: PlanAdministrator }
            - { call: "POST /notices", payload: { termination_case_id: "${c_ok}", notice_type: NOIT, action_effective_date: "2026-10-15T00:00:00Z", expected_termination_case_version: "${c_ok_v}" }, as: PlanAdministrator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-17T00:00:00Z" }, as: PlanAdministrator }
          trigger:
            - { call: "POST /notices", payload: { termination_case_id: "${c_bad}", notice_type: NOIT, action_effective_date: "2026-10-15T00:00:00Z", expected_termination_case_version: "${c_bad_v}" }, as: PlanAdministrator, captures: { err_noit: "$.data.error_id" } }
          assert:
            - "At exactly T-60 days (2026-08-16): TerminationCase.${c_ok}.status == NOTICE_OF_INTENT_ISSUED (inclusive lower bound accepted)"
            - "At T-59 days (2026-08-17): error_id == ERR_NOIT_TIMING_WINDOW, http status == 422, and TerminationCase.${c_bad}.status stays DRAFT"

      - name: zero_participant_posture_boundary
        grounds:
          - calculations.resolution_posture
          - errors[ERR_PARTICIPANTS_NOT_ALL_RESOLVED]
          - entities.TerminationCase.fields.all_participants_resolved
        distinguishing_aspect: |
          Empty-set count metric via POST
          /termination-cases/{id}/advance-to-reconciliation (different metric and
          endpoint than both siblings): with zero participants the resolved set
          vacuously equals the total, but the posture formula requires
          total_participant_count > 0, so the advance is rejected.
        test_recipe:
          setup:
            - "Case with zero participants, effectuated and in DISTRIBUTION_IN_PROGRESS."
          setup_api_calls:
            - { call: "POST /termination-cases", payload: { plan_name: "Empty Co 401k", sponsor_ein: "123456789", plan_number: "073", proposed_termination_date: "2026-10-15T00:00:00Z" }, as: PlanAdministrator, captures: { c_z: "$.data.id", c_z_v: "$.data.version" } }
            - { call: "POST /notices", payload: { termination_case_id: "${c_z}", notice_type: NOIT, action_effective_date: "2026-10-15T00:00:00Z", expected_termination_case_version: "${c_z_v}" }, as: PlanAdministrator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-15T00:00:00Z" }, as: PlanAdministrator }
            - { call: "POST /termination-cases/${c_z}/effectuate-termination", payload: {}, as: PlanAdministrator }
            - { call: "GET /termination-cases/${c_z}", payload: {}, as: PlanAdministrator, captures: { c_z_v2: "$.data.version" } }
            - { call: "POST /notices", payload: { termination_case_id: "${c_z}", notice_type: DISTRIBUTION, action_effective_date: "2026-10-20T00:00:00Z", expected_termination_case_version: "${c_z_v2}" }, as: PlanAdministrator }
            - { call: "POST /termination-cases/${c_z}/begin-distributions", payload: {}, as: PlanAdministrator }
          trigger:
            - { call: "POST /termination-cases/${c_z}/advance-to-reconciliation", payload: {}, as: PlanAdministrator, captures: { err_zp: "$.data.error_id" } }
          assert:
            - "TerminationCase.${c_z}.total_participant_count == 0 and all_participants_resolved == false (empty census does not satisfy the posture)"
            - "error_id == ERR_PARTICIPANTS_NOT_ALL_RESOLVED, http status == 409, and status stays DISTRIBUTION_IN_PROGRESS"

  - rule_id: cross_entity_state_dependency
