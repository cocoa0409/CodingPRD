          - "entities.Apprentice.fields.current_wage_step"
        distinguishing_aspect: |
          Hours-metric boundary via report submission: 1999 accumulated hours
          (with the 144-credit gate pre-satisfied) leaves step 1; one more
          submitted hour reaching exactly 2000 flips to step 2 (>=, not >).
        test_recipe:
          setup:
            - "Apprentice A INDENTURED + REGISTERED with 144 RTI credits already awarded (class completed) and 0 OJT hours."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
