# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
#
# Every instance below grounds in SCAFFOLD.yaml §1.1-§1.7 only. Deleting this
# file would leave the declared behaviour identical; it exists so the unit-test
# generator can prove coverage of the nine Difficulty Rules.
#
# Shared fixture literals used throughout (all pinned, none derived at runtime):
#   Landfill LF   : permitted_total_airspace_cy 5000000, design_footprint_sf 400000,
#                   planned_density_tons_per_cy 0.90, annual_tonnage_forecast 300000,
#                   daily_load_limit 200
#   Cell  C-1     : design_airspace_cy 1000000, design_area_sf 120001, DOUBLE_COMPOSITE
#   Cell  C-2     : design_airspace_cy 200,     design_area_sf  45001, DOUBLE_COMPOSITE
#   Estimate      : closure_unit_cost_per_sf 1.855, post_closure_annual_cost 95000.00,
#                   inflation_pct 0.03, post_closure_years 30
#                   -> post_closure_cost_total 4519664.50 (round-each-then-sum)
#   HostCommunity : posted_tipping_fee_per_ton 42.50, host_fee_per_ton 3.75,
#                   tier1_monthly_tons 100, royalty_tier1_pct 0.04,
#                   royalty_tier2_pct 0.07, minimum_annual_payment 250000
#   Logical clock : startup default 2026-08-01T00:00:00Z (never wall-clock)
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: remaining_life_survey_based_vs_ledger_based_divergence
        grounds:
          - calculations.remaining_life_projection
          - calculations.survey_density_measurement
          - entities.Landfill.fields.remaining_life_years
          - entities.Landfill.fields.planned_density_tons_per_cy
          - entities.AerialSurvey.fields.measured_density_tons_per_cy
          - state_machines.AerialSurvey.RECORDED_to_SUPERSEDED
        distinguishing_aspect: |
          The same landfill, with no other data changed, reports remaining_life_years 3.00
          under the ledger_based variant and 1.94 under the survey_based variant, because
          the ledger reads Landfill.planned_density_tons_per_cy 0.90 while the survey reads
          the field-measured 0.8333 against a surveyed remaining volume of 700000 cy rather
          than the book 1000000 cy. Variant selection is driven purely by the presence of a
          RECORDED AerialSurvey, and the 2.0-year restriction threshold is crossed by one
          variant and not the other.
        test_recipe:
          setup:
            - "One Landfill LF registered with planned_density_tons_per_cy 0.90 and annual_tonnage_forecast 300000."
            - "One Cell C-1 (design_airspace_cy 1000000) driven to QA_CERTIFIED, so Landfill.certified_airspace_cy is 1000000 and consumed_airspace_cy is 0."
            - "Zero AerialSurveys exist for LF, so the projection must fall back to the ledger."
            - "Logical clock at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /landfills"
              payload: { name: "Ridgeview MSW", permit_number: "MSW-4417", permitted_total_airspace_cy: 5000000, design_footprint_sf: 400000, planned_density_tons_per_cy: 0.90, annual_tonnage_forecast: 300000, daily_load_limit: 200 }
              as: PlatformAdmin
              captures: { lf_id: $.data.id }
            - call: "POST /cells"
              payload: { landfill_id: "${lf_id}", cell_code: "C-1", design_airspace_cy: 1000000, design_area_sf: 120001, liner_type: "DOUBLE_COMPOSITE", construction_start_date: "2026-06-01T00:00:00Z", construction_end_date: "2026-07-15T00:00:00Z" }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /cells/${c1_id}/begin-construction"
              payload: {}
              as: SiteOperator
              as_user_id: "${lf_id}"
            - call: "POST /liner-qa-packages"
              payload: { cell_id: "${c1_id}", seam_length_ft: 4000, destructive_test_count: 20, passing_test_count: 20, panel_count: 40, defect_count: 2 }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { qa1_id: $.data.id }
            - call: "POST /liner-qa-packages/${qa1_id}/begin-review"
              payload: {}
              as: CqaEngineer
              as_user_id: "cqa-engineer-2"
            - call: "POST /liner-qa-packages/${qa1_id}/approve"
              payload: { certification_reference: "CQA-2026-001" }
              as: CqaEngineer
              as_user_id: "cqa-engineer-2"
          trigger:
            - call: "GET /landfills/${lf_id}/remaining-life-projection"
              payload: {}
              as: RegulatoryAgency
              captures: { ledger_variant: $.data.variant, ledger_years: $.data.remaining_life_years, ledger_density: $.data.density_tons_per_cy }
            - call: "POST /aerial-surveys"
              payload: { landfill_id: "${lf_id}", flown_on: "2026-08-01T00:00:00Z", coverage_period_start: "2026-05-01T00:00:00Z", coverage_period_end: "2026-07-31T00:00:00Z", measured_remaining_airspace_cy: 700000, tons_placed_in_period: 250000 }
              as: SurveyorOfRecord
              as_user_id: "surveyor-1"
              captures: { s1_id: $.data.id, s1_density: $.data.measured_density_tons_per_cy, s1_consumed: $.data.airspace_consumed_in_period_cy }
            - call: "GET /landfills/${lf_id}/remaining-life-projection"
              payload: {}
              as: RegulatoryAgency
              captures: { survey_variant: $.data.variant, survey_years: $.data.remaining_life_years, survey_source: $.data.source_survey_id }
          assert:
            - "${ledger_variant} == 'ledger_based'"
            - "${ledger_density} == 0.90"
            - "${ledger_years} == 3.00"
            - "AerialSurvey.${s1_id}.airspace_consumed_in_period_cy == 300000.00"
            - "AerialSurvey.${s1_id}.measured_density_tons_per_cy == 0.8333"
            - "AerialSurvey.${s1_id}.status == 'RECORDED'"
            - "${survey_variant} == 'survey_based'"
            - "${survey_years} == 1.94"
            - "${survey_source} == ${s1_id}"
            - "the two variants disagree: 3.00 versus 1.94, a delta of 1.06 years"
            - "Landfill.${lf_id}.remaining_life_years == 1.94"
            - "Landfill.${lf_id}.operating_status == 'RESTRICTED_AIRSPACE'"

      - name: tipping_charge_gate_rate_vs_certified_scale_divergence
        grounds:
          - calculations.load_tipping_charge
          - calculations.host_community_royalty_waterfall
          - entities.WasteLoad.fields.gate_charge_amount
          - entities.WasteLoad.fields.final_charge_amount
          - entities.WasteLoad.fields.host_royalty_amount
          - state_machines.WasteLoad.UNBILLED_to_PROVISIONAL
          - state_machines.WasteLoad.PROVISIONAL_to_FINALIZED
        distinguishing_aspect: |
          One WasteLoad carries both variant outputs on the same row: gate_charge_amount
          2092.82 priced off manifest_tons 45.25 with NO royalty component, and
          final_charge_amount 1918.00 priced off certified_net_tons 40.00 WITH a 68.00
          royalty. The divergence is not a rounding artefact — the variants differ in which
          tonnage field they read and in whether the host-community royalty participates at
          all, so gate_charge_amount survives the finalisation untouched for reconciliation.
        test_recipe:
          setup:
            - "One Landfill LF with an EXECUTED HostCommunityAgreement (posted_tipping_fee_per_ton 42.50, host_fee_per_ton 3.75, tier1_monthly_tons 100, royalty_tier1_pct 0.04, royalty_tier2_pct 0.07)."
            - "Cell C-1 ACTIVE, reached through liner CQA approval, a CERTIFIED and fully funded ClosureCostEstimate, and regulatory authorization."
            - "OperatingDay D1 OPEN on 2026-08-05 with working_face_area_sf 5000 and cover_material_type ALTERNATIVE_TARP."
            - "One MSW WasteLoad L1 on D1 with manifest_tons 45.25, CLEARED, and a certified scale weight of 40.00 tons recorded."
            - "No other load exists in the month, so the royalty waterfall starts at cumulative_tons_before 0."
          setup_api_calls:
            - call: "POST /landfills"
              payload: { name: "Ridgeview MSW", permit_number: "MSW-4417", permitted_total_airspace_cy: 5000000, design_footprint_sf: 400000, planned_density_tons_per_cy: 0.90, annual_tonnage_forecast: 300000, daily_load_limit: 200 }
              as: PlatformAdmin
              captures: { lf_id: $.data.id }
            - call: "POST /cells"
              payload: { landfill_id: "${lf_id}", cell_code: "C-1", design_airspace_cy: 1000000, design_area_sf: 120001, liner_type: "DOUBLE_COMPOSITE", construction_start_date: "2026-06-01T00:00:00Z", construction_end_date: "2026-07-15T00:00:00Z" }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /cells/${c1_id}/begin-construction"
              payload: {}
              as: SiteOperator
              as_user_id: "${lf_id}"
            - call: "POST /liner-qa-packages"
              payload: { cell_id: "${c1_id}", seam_length_ft: 4000, destructive_test_count: 20, passing_test_count: 20, panel_count: 40, defect_count: 2 }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { qa1_id: $.data.id }
            - call: "POST /liner-qa-packages/${qa1_id}/begin-review"
              payload: {}
              as: CqaEngineer
              as_user_id: "cqa-engineer-2"
            - call: "POST /liner-qa-packages/${qa1_id}/approve"
              payload: { certification_reference: "CQA-2026-001" }
              as: CqaEngineer
              as_user_id: "cqa-engineer-2"
            - call: "GET /landfills/${lf_id}"
              payload: {}
              as: FinanceOfficer
              captures: { lf_v2: $.data.version }
            - call: "POST /closure-cost-estimates"
              payload: { landfill_id: "${lf_id}", estimate_year: 2026, closure_unit_cost_per_sf: 1.855, post_closure_annual_cost: 95000.00, inflation_pct: 0.03, post_closure_years: 30, expected_landfill_version: "${lf_v2}" }
              as: FinanceOfficer
              as_user_id: "finance-filer-1"
              captures: { est_id: $.data.id, req_amount: $.data.required_assurance_amount }
            - call: "POST /closure-cost-estimates/${est_id}/certify"
              payload: {}
              as: FinanceOfficer
              as_user_id: "finance-certifier-2"
            - call: "POST /closure-cost-estimates/${est_id}/fund-assurance"
              payload: { instrument_type: "TRUST_FUND", funded_amount: "${req_amount}" }
              as: FinanceOfficer
              as_user_id: "finance-certifier-2"
            - call: "POST /cells/${c1_id}/authorize-waste-placement"
              payload: { approval_reference: "AGY-2026-77" }
              as: RegulatoryAgency
              as_user_id: "agency-inspector-1"
            - call: "POST /cells/${c1_id}/activate"
              payload: {}
              as: SiteOperator
              as_user_id: "${lf_id}"
            - call: "POST /host-community-agreements"
              payload: { landfill_id: "${lf_id}", community_name: "Ridgeview Township", posted_tipping_fee_per_ton: 42.50, host_fee_per_ton: 3.75, tier1_monthly_tons: 100, royalty_tier1_pct: 0.04, royalty_tier2_pct: 0.07, minimum_annual_payment: 250000, effective_from: "2026-01-01T00:00:00Z", expires_on: "2036-01-01T00:00:00Z" }
              as: FinanceOfficer
              as_user_id: "finance-filer-1"
              captures: { hca_id: $.data.id }
            - call: "GET /landfills/${lf_id}"
              payload: {}
              as: FinanceOfficer
              captures: { lf_v3: $.data.version }
            - call: "POST /host-community-agreements/${hca_id}/execute"
              payload: { expected_landfill_version: "${lf_v3}" }
              as: FinanceOfficer
              as_user_id: "finance-filer-1"
            - call: "POST /operating-days"
              payload: { landfill_id: "${lf_id}", active_cell_id: "${c1_id}", operating_date: "2026-08-05T00:00:00Z", working_face_area_sf: 5000, cover_material_type: "ALTERNATIVE_TARP" }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { d1_id: $.data.id }
            - call: "POST /waste-loads"
              payload: { operating_day_id: "${d1_id}", hauler_ref: "H-0001", waste_stream: "MSW", manifest_tons: 45.25, load_check_result: "PASS" }
              as: ScaleOperator
              as_user_id: "${lf_id}"
              captures: { l1_id: $.data.id }
          trigger:
            - call: "POST /waste-loads/${l1_id}/clear-screening"
              payload: {}
              as: ScaleOperator
              as_user_id: "${lf_id}"
              captures: { gate_amt: $.data.gate_charge_amount, bill_1: $.data.billing_status }
            - call: "POST /waste-loads/${l1_id}/certify-weight"
              payload: { certified_net_tons: 40.00 }
              as: ScaleOperator
              as_user_id: "${lf_id}"
            - call: "POST /operating-days/${d1_id}/close"
              payload: {}
              as: SiteOperator
              as_user_id: "${lf_id}"
          assert:
            - "${bill_1} == 'PROVISIONAL'"
            - "${gate_amt} == 2092.82"
            - "WasteLoad.${l1_id}.gate_charge_amount == 2092.82 (45.25 * 42.50 = 1923.13 plus 45.25 * 3.75 = 169.69, no royalty term)"
            - "WasteLoad.${l1_id}.host_royalty_amount == 68.00"
            - "WasteLoad.${l1_id}.final_charge_amount == 1918.00 (40.00 * 42.50 = 1700.00 plus 40.00 * 3.75 = 150.00 plus royalty 68.00)"
            - "WasteLoad.${l1_id}.billing_status == 'FINALIZED'"
            - "WasteLoad.${l1_id}.screening_status == 'CLEARED'"
            - "gate_charge_amount is NOT overwritten by the finalisation: both 2092.82 and 1918.00 are readable on the same row"
            - "OperatingDay.${d1_id}.tons_placed == 40.00"
            - "OperatingDay.${d1_id}.effective_density_tons_per_cy == 0.8500"
            - "OperatingDay.${d1_id}.airspace_consumed_cy == 47.06"

  - rule_id: combinatorial_formula
    instances:

      - name: daily_airspace_density_composes_three_inputs_with_clamp
        grounds:
          - calculations.daily_airspace_consumption
          - entities.OperatingDay.fields.cover_material_type
          - entities.OperatingDay.fields.working_face_area_sf
          - entities.OperatingDay.fields.effective_density_tons_per_cy
          - entities.Landfill.fields.planned_density_tons_per_cy
          - state_machines.OperatingDay.OPEN_to_CLOSED
        distinguishing_aspect: |
          Effective density is not a single lookup: it multiplies the site's planned density
          by a cover-material factor and by a working-face size penalty, then clamps the
          product into [0.55, 0.85] and rounds to 4 decimals BEFORE the tonnage is divided
          by it. Three days on the same cell with identical tonnage 100.00 therefore consume
          125.80, 140.29 and 117.65 cubic yards. The third day proves the upper clamp is
          load-bearing (0.90 x 0.97 x 1.00 = 0.8730 is capped to 0.8500), which no single
          multiplicative rule could produce.
        test_recipe:
          setup:
            - "Landfill LF with planned_density_tons_per_cy 0.90 and daily_load_limit 200."
            - "Cell C-1 (design_airspace_cy 1000000) ACTIVE with a CERTIFIED and fully funded ClosureCostEstimate behind it."
            - "An EXECUTED HostCommunityAgreement so day close can price loads."
            - "Three OperatingDays on 2026-08-05, 2026-08-06 and 2026-08-07, each carrying exactly one CLEARED load with certified_net_tons 100.00, and each configured with a different (cover_material_type, working_face_area_sf) pair: (SOIL_6IN, 9000), (AUTO_SHRED_FINES, 20000), (ADC_FOAM, 5000)."
          setup_api_calls:
            - call: "POST /landfills"
              payload: { name: "Ridgeview MSW", permit_number: "MSW-4417", permitted_total_airspace_cy: 5000000, design_footprint_sf: 400000, planned_density_tons_per_cy: 0.90, annual_tonnage_forecast: 300000, daily_load_limit: 200 }
              as: PlatformAdmin
              captures: { lf_id: $.data.id }
            - call: "POST /cells"
              payload: { landfill_id: "${lf_id}", cell_code: "C-1", design_airspace_cy: 1000000, design_area_sf: 120001, liner_type: "DOUBLE_COMPOSITE", construction_start_date: "2026-06-01T00:00:00Z", construction_end_date: "2026-07-15T00:00:00Z" }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /cells/${c1_id}/begin-construction"
              payload: {}
              as: SiteOperator
              as_user_id: "${lf_id}"
            - call: "POST /liner-qa-packages"
              payload: { cell_id: "${c1_id}", seam_length_ft: 4000, destructive_test_count: 20, passing_test_count: 20, panel_count: 40, defect_count: 2 }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { qa1_id: $.data.id }
            - call: "POST /liner-qa-packages/${qa1_id}/begin-review"
              payload: {}
              as: CqaEngineer
              as_user_id: "cqa-engineer-2"
            - call: "POST /liner-qa-packages/${qa1_id}/approve"
              payload: { certification_reference: "CQA-2026-001" }
              as: CqaEngineer
              as_user_id: "cqa-engineer-2"
            - call: "GET /landfills/${lf_id}"
              payload: {}
              as: FinanceOfficer
              captures: { lf_v2: $.data.version }
            - call: "POST /closure-cost-estimates"
              payload: { landfill_id: "${lf_id}", estimate_year: 2026, closure_unit_cost_per_sf: 1.855, post_closure_annual_cost: 95000.00, inflation_pct: 0.03, post_closure_years: 30, expected_landfill_version: "${lf_v2}" }
              as: FinanceOfficer
              as_user_id: "finance-filer-1"
              captures: { est_id: $.data.id, req_amount: $.data.required_assurance_amount }
            - call: "POST /closure-cost-estimates/${est_id}/certify"
              payload: {}
              as: FinanceOfficer
              as_user_id: "finance-certifier-2"
            - call: "POST /closure-cost-estimates/${est_id}/fund-assurance"
              payload: { instrument_type: "SURETY_BOND", funded_amount: "${req_amount}" }
              as: FinanceOfficer
              as_user_id: "finance-certifier-2"
            - call: "POST /cells/${c1_id}/authorize-waste-placement"
              payload: { approval_reference: "AGY-2026-77" }
              as: RegulatoryAgency
              as_user_id: "agency-inspector-1"
            - call: "POST /cells/${c1_id}/activate"
              payload: {}
              as: SiteOperator
              as_user_id: "${lf_id}"
            - call: "POST /host-community-agreements"
              payload: { landfill_id: "${lf_id}", community_name: "Ridgeview Township", posted_tipping_fee_per_ton: 42.50, host_fee_per_ton: 3.75, tier1_monthly_tons: 100, royalty_tier1_pct: 0.04, royalty_tier2_pct: 0.07, minimum_annual_payment: 250000, effective_from: "2026-01-01T00:00:00Z", expires_on: "2036-01-01T00:00:00Z" }
              as: FinanceOfficer
              as_user_id: "finance-filer-1"
              captures: { hca_id: $.data.id }
            - call: "GET /landfills/${lf_id}"
              payload: {}
              as: FinanceOfficer
              captures: { lf_v3: $.data.version }
            - call: "POST /host-community-agreements/${hca_id}/execute"
              payload: { expected_landfill_version: "${lf_v3}" }
              as: FinanceOfficer
              as_user_id: "finance-filer-1"
            - call: "POST /operating-days"
              payload: { landfill_id: "${lf_id}", active_cell_id: "${c1_id}", operating_date: "2026-08-05T00:00:00Z", working_face_area_sf: 9000, cover_material_type: "SOIL_6IN" }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { dA_id: $.data.id }
            - call: "POST /waste-loads"
              payload: { operating_day_id: "${dA_id}", hauler_ref: "H-A1", waste_stream: "MSW", manifest_tons: 100.00, load_check_result: "PASS" }
              as: ScaleOperator
              as_user_id: "${lf_id}"
              captures: { lA_id: $.data.id }
            - call: "POST /waste-loads/${lA_id}/clear-screening"
              payload: {}
              as: ScaleOperator
              as_user_id: "${lf_id}"
            - call: "POST /waste-loads/${lA_id}/certify-weight"
              payload: { certified_net_tons: 100.00 }
              as: ScaleOperator
              as_user_id: "${lf_id}"
            - call: "POST /operating-days"
              payload: { landfill_id: "${lf_id}", active_cell_id: "${c1_id}", operating_date: "2026-08-06T00:00:00Z", working_face_area_sf: 20000, cover_material_type: "AUTO_SHRED_FINES" }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { dB_id: $.data.id }
            - call: "POST /waste-loads"
              payload: { operating_day_id: "${dB_id}", hauler_ref: "H-B1", waste_stream: "MSW", manifest_tons: 100.00, load_check_result: "PASS" }
              as: ScaleOperator
              as_user_id: "${lf_id}"
              captures: { lB_id: $.data.id }
            - call: "POST /waste-loads/${lB_id}/clear-screening"
              payload: {}
              as: ScaleOperator
              as_user_id: "${lf_id}"
            - call: "POST /waste-loads/${lB_id}/certify-weight"
              payload: { certified_net_tons: 100.00 }
              as: ScaleOperator
              as_user_id: "${lf_id}"
            - call: "POST /operating-days"
              payload: { landfill_id: "${lf_id}", active_cell_id: "${c1_id}", operating_date: "2026-08-07T00:00:00Z", working_face_area_sf: 5000, cover_material_type: "ADC_FOAM" }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { dC_id: $.data.id }
            - call: "POST /waste-loads"
              payload: { operating_day_id: "${dC_id}", hauler_ref: "H-C1", waste_stream: "MSW", manifest_tons: 100.00, load_check_result: "PASS" }
              as: ScaleOperator
              as_user_id: "${lf_id}"
              captures: { lC_id: $.data.id }
            - call: "POST /waste-loads/${lC_id}/clear-screening"
              payload: {}
              as: ScaleOperator
              as_user_id: "${lf_id}"
            - call: "POST /waste-loads/${lC_id}/certify-weight"
              payload: { certified_net_tons: 100.00 }
              as: ScaleOperator
              as_user_id: "${lf_id}"
          trigger:
            - call: "POST /operating-days/${dA_id}/close"
              payload: {}
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { densA: $.data.effective_density_tons_per_cy, spaceA: $.data.airspace_consumed_cy }
            - call: "POST /operating-days/${dB_id}/close"
              payload: {}
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { densB: $.data.effective_density_tons_per_cy, spaceB: $.data.airspace_consumed_cy }
            - call: "POST /operating-days/${dC_id}/close"
              payload: {}
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { densC: $.data.effective_density_tons_per_cy, spaceC: $.data.airspace_consumed_cy }
          assert:
            - "${densA} == 0.7949 (0.90 * 0.92 * 0.96, medium working face)"
            - "${spaceA} == 125.80"
            - "${densB} == 0.7128 (0.90 * 0.88 * 0.90, large working face)"
            - "${spaceB} == 140.29"
            - "${densC} == 0.8500 (0.90 * 0.97 * 1.00 = 0.8730 clamped down to the 0.85 target)"
            - "${spaceC} == 117.65"
            - "Cell.${c1_id}.consumed_airspace_cy == 383.74"
            - "Landfill.${lf_id}.consumed_airspace_cy == 383.74"
            - "Cell.${c1_id}.status == 'ACTIVE'"

      - name: closure_cost_rounds_per_cell_before_summing
        grounds:
          - calculations.closure_and_post_closure_cost
          - entities.ClosureCostEstimate.fields.closure_cost_total
          - entities.ClosureCostEstimate.fields.post_closure_cost_total
          - entities.ClosureCostEstimate.fields.required_assurance_amount
          - entities.Cell.fields.design_area_sf
          - concurrency_rules[closure-estimate-create-stale-landfill]
        distinguishing_aspect: |
          Two rounding orders are pinned in one formula and both are observable. Rounding each
          cell's closure cost to cents before summing gives 306078.72, whereas multiplying the
          summed area 165002 sf by 1.855 gives 306078.71 — a one-cent divergence that only a
          per-cell rounding order produces. In the same call the 30-year inflated post-closure
          stream must be rounded per year and then summed to 4519664.50; summing the raw terms
          and rounding once gives 4519664.49. required_assurance_amount 4825743.22 can only be
          reached if BOTH orders are honoured.
        test_recipe:
          setup:
            - "Landfill LF registered."
            - "Cell C-1 (design_area_sf 120001) and Cell C-2 (design_area_sf 45001) both driven to QA_CERTIFIED so both count toward closure area."
