      - name: mg_below_the_published_floor_blocks_execution_until_it_matches_the_floor
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=102]
          - errors.ERR_MG_BELOW_FLOOR
          - calculations.territory_value_estimate
        distinguishing_aspect: |
          The floor is not a contract field: priority 102 reads floor_value_usd 1176000.00 off the
          PUBLISHED TerritoryValuation of the same film/territory pair, so a 1000000.00 MG that passed
          creation, milestone build-up and buyer acceptance is only refused at execute. After lapsing it
          and re-offering at exactly 1176000.00 the execution succeeds, proving the comparison is
          inclusive at the floor.
        test_recipe:
          setup:
            - "PUBLISHED CAST_ADJUSTED valuation for Germany with estimate 1680000.00 and floor_value_usd 1176000.00; a buyer-accepted contract whose MG is only 1000000.00."
          setup_api_calls:
