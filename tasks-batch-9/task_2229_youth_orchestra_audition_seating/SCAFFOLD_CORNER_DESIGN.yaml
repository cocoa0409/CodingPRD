            - "trigger[3] -> 200 with data.waitlist_rank == 2 (Lou, 81.80, later created_at)"
            - "trigger[4] -> 200 with data.status == \"DECLINED\""
            - "trigger[5] -> 200 with data.status == \"OFFERED\" and data.waitlist_rank == null and data.offer_expires_at == \"2026-08-08T10:00:00Z\""
            - "trigger[6] -> 200 with data.waitlist_rank == 1 (the remainder is re-ranked from 1)"
            - "SectionQuota.${q_violin_id}.filled_count == 0 throughout (an offer is not a seat)"

      - name: audition_composite_variants_diverge_on_the_same_sheets
        claim_type: variant_selection
        grounds:
          - calculations.audition_composite.variants
          - difficulty.calculations.dual_variant
        excluded_because:
          difficulty_instance: audition_composite_provisional_vs_final_diverge
          rationale: "The two composite variants are probed at depth in 1.8 with the four-sheet fixture 81.80 / 94.60 / 66.60 / 82.40, which crosses TRIM_MIN_SCORE_COUNT and yields PROVISIONAL 81.35 against FINAL 82.10 on one audition. A breadth instance would re-run the same variant switch with a smaller sheet set."

      - name: member_calendar_overlap_uses_plain_half_open_intervals
        claim_type: interval_merge
        grounds:
          - calculations.member_event_overlap
          - errors[ERR_MEMBER_EVENT_CONFLICT]
          - difficulty.calculations.interval_semantics
        excluded_because:
          difficulty_instance: member_calendar_plain_half_open_overlap
          rationale: "The unbuffered half-open semantics of a member's own calendar - back-to-back events legal, one-minute straddle rejected - are already contrasted at depth in 1.8 against the buffered room rule, on the same clock and the same fixture shape."

      - name: aid_pool_halves_reconcile_to_the_budget
        claim_type: reconciliation
        grounds:
          - calculations.aid_cap_application
          - entities.Season.fields.aid_available_cents
          - difficulty.calculations.ledger_identity
        excluded_because:
          difficulty_instance: aid_pool_committed_plus_available_equals_budget
          rationale: "The identity aid_committed_cents + aid_available_cents == aid_budget_cents is asserted at depth in 1.8 across the full award / cap-surplus / rescind cycle, which is strictly more than a breadth reconciliation instance would check after a single award run."

  # =========================================================================
  # Table 4 (Validations) - the three main claim-type rows plus every
  # validation-category sub-row that §1.4 actually declares.
  - section: validations
    instances:
      - name: each_violated_check_reports_its_own_declared_error_id
        claim_type: violation_to_error
        grounds:
          - validations[priority=60]
          - validations[priority=61]
          - validations[priority=92]
          - errors[ERR_SLOT_INSTRUMENT_MISMATCH]
          - errors[ERR_REPERTOIRE_REQUIREMENTS_UNMET]
          - errors[ERR_MEMBER_NOT_IN_ENSEMBLE]
        distinguishing_aspect: |
          Three different violated checks map to three different error ids, never to a
          shared generic failure. Scheduling a VIOLIN audition into the CELLO slot violates
          BOTH the instrument check (60) and the excerpt check (61) - the response must be
          ERR_SLOT_INSTRUMENT_MISMATCH because 60 is the lower priority number; the same
          audition against the instrument-matched slot then isolates
          ERR_REPERTOIRE_REQUIREMENTS_UNMET; and rostering an unseated PROSPECT onto the
          ensemble calendar reports ERR_MEMBER_NOT_IN_ENSEMBLE (422).
        test_recipe:
          setup:
            - "Season in AUDITIONS_OPEN with one PHILHARMONIC ensemble and a VIOLIN quota."
            - "Two slots, each with required_excerpt_codes [\"EX9\"] and quorum 3: R1 VIOLIN"
            - "10:00-11:00 with three VIOLIN panelists, R2 CELLO 12:00-13:00 with three CELLO"
            - "panelists (both on 2026-08-12, inside the audition window)."
            - "Ada Strings (VIOLIN) has a REQUESTED audition declaring excerpt_ids [\"EX1\"] -"
            - "so EX9 is missing - and she holds no seat anywhere."
            - "One CONCERT event exists on the ensemble calendar for 2026-11-15."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: ArtisticDirector
            - call: "POST /seasons"
              payload: { name: "2026-2027 Season", year_label: "2026-27", audition_window_start: "2026-08-10T09:00:00Z", audition_window_end: "2026-08-20T18:00:00Z", tuition_base_cents: 123223, tuition_due_at: "2026-12-01T00:00:00Z", aid_budget_cents: 100000 }
              as: ArtisticDirector
              captures: { season_id: "$.data.id" }
            - call: "POST /ensembles"
              payload: { season_id: "${season_id}", name: "Philharmonic", tier: "PHILHARMONIC", min_total_size: 1, max_total_size: 4, rehearsal_weekday: "SAT" }
              as: ArtisticDirector
              captures: { ens_id: "$.data.id" }
            - call: "POST /section-quotas"
              payload: { ensemble_id: "${ens_id}", instrument: "VIOLIN", min_count: 1, target_count: 1, max_count: 2 }
              as: ArtisticDirector
              captures: { q_violin_id: "$.data.id" }
            - call: "POST /members"
              payload: { legal_name: "Ada Strings", primary_instrument: "VIOLIN", grade_level: 10, graduation_year: 2028, household_income_band: "BAND_B", years_in_org: 1 }
              as: RegistrarStaff
              captures: { m1_id: "$.data.id" }
            - call: "POST /panelists"
              payload: { display_name: "Panel V1", instrument_expertise: "VIOLIN" }
              as: ArtisticDirector
              captures: { pv1_id: "$.data.id" }
            - call: "POST /panelists"
              payload: { display_name: "Panel V2", instrument_expertise: "VIOLIN" }
              as: ArtisticDirector
              captures: { pv2_id: "$.data.id" }
            - call: "POST /panelists"
              payload: { display_name: "Panel V3", instrument_expertise: "VIOLIN" }
              as: ArtisticDirector
              captures: { pv3_id: "$.data.id" }
            - call: "POST /panelists"
              payload: { display_name: "Panel C1", instrument_expertise: "CELLO" }
              as: ArtisticDirector
              captures: { pc1_id: "$.data.id" }
            - call: "POST /panelists"
              payload: { display_name: "Panel C2", instrument_expertise: "CELLO" }
              as: ArtisticDirector
              captures: { pc2_id: "$.data.id" }
            - call: "POST /panelists"
              payload: { display_name: "Panel C3", instrument_expertise: "CELLO" }
              as: ArtisticDirector
              captures: { pc3_id: "$.data.id" }
            - call: "POST /ensemble-events"
              payload: { ensemble_id: "${ens_id}", kind: "CONCERT", start_at: "2026-11-15T19:00:00Z", end_at: "2026-11-15T21:00:00Z", venue_code: "HALL-B" }
              as: ArtisticDirector
              captures: { ev_conc_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/advance-status"
              payload: { to_status: "AUDITIONS_OPEN" }
              as: ArtisticDirector
            - call: "POST /audition-slots"
              payload: { season_id: "${season_id}", room_code: "R1", start_at: "2026-08-12T10:00:00Z", end_at: "2026-08-12T11:00:00Z", panelist_ids: ["${pv1_id}", "${pv2_id}", "${pv3_id}"], instrument_focus: "VIOLIN", required_excerpt_codes: ["EX9"], quorum_required: 3, capacity: 4 }
              as: RegistrarStaff
              captures: { slot_v_id: "$.data.id" }
            - call: "POST /audition-slots"
              payload: { season_id: "${season_id}", room_code: "R2", start_at: "2026-08-12T12:00:00Z", end_at: "2026-08-12T13:00:00Z", panelist_ids: ["${pc1_id}", "${pc2_id}", "${pc3_id}"], instrument_focus: "CELLO", required_excerpt_codes: ["EX9"], quorum_required: 3, capacity: 4 }
              as: RegistrarStaff
              captures: { slot_c_id: "$.data.id" }
            - call: "POST /auditions"
              payload: { member_id: "${m1_id}", season_id: "${season_id}", declared_program: "Bruch Concerto mvt I", excerpt_ids: ["EX1"], scale_attested: true }
              as: Guardian
              as_user_id: "${m1_id}"
              captures: { a1_id: "$.data.id" }
          trigger:
            - call: "POST /auditions/${a1_id}/schedule"
              payload: { slot_id: "${slot_c_id}" }
              as: RegistrarStaff
              captures: { err1: "$.data.error_id" }
            - call: "POST /auditions/${a1_id}/schedule"
              payload: { slot_id: "${slot_v_id}" }
