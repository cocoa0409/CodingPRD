  # ───────────────────────────────────────────────────────────────────────────
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ───────────────────────────────────────────────────────────────────────────
  - rule_id: compensating_invariant
    instances:
      - name: refund_settle_conserves_net_cash_position
        grounds:
          - state_machines.RefundRequest.APPROVED_to_SETTLED
          - state_machines.TreatmentCase.ACTIVE_to_REFUNDED
          - entities.TreatmentCase.fields.amount_collected_cents
          - entities.TreatmentCase.fields.refund_issued_cents
          - calculations.refund_amount
        distinguishing_aspect: |
          Conserved quantity = net cash the patient is out of pocket on the case, defined as
          net_paid = amount_collected_cents - refund_issued_cents. For a PATIENT_CANCEL
          settle where collected=300000 with 0 shipped steps, refund_issued=292500
          (300000 - 0 consumed - 7500 fee), so net_paid lands at exactly the restocking_fee
          7500 — forward collect + compensating refund leave net_paid equal to the withheld
          fee, no drift.
        test_recipe:
          setup:
            - "Case ACTIVE, financing paid down 300000 (collected 300000), 0 first-run steps shipped, PATIENT_CANCEL refund APPROVED."
          setup_api_calls:
            - call: "POST /clinicians"
              payload: { full_name: "Dr CE1", license_state_codes: ["CA"], role_type: "DENTIST" }
              as: BillingAdmin
              captures: { clin_id: $.data.id }
            - call: "POST /patients"
              payload: { email: "e9a@x.com", full_name: "E9a", state_code: "CA", date_of_birth: "1990-01-01" }
