              captures: { cr_a3_status: "$.data.status" }
            - call: "GET /agreements/${cr_a1}"
              payload: {}
              as: FinanceAnalyst
              captures: { cr_r_id: "$.data.id", cr_r_down: "$.data.down_payment_cents", cr_r_fee: "$.data.service_fee_cents", cr_r_n: "$.data.installment_count", cr_r_due: "$.data.first_installment_due_date", cr_r_status: "$.data.status", cr_r_ver: "$.data.version", cr_r_insured: "$.data.insured_id", cr_r_total: "$.data.total_premium_cents" }
            - call: "GET /agreements"
              payload: { limit: 2, offset: 0 }
              as: ComplianceOfficer
              captures: { cr_p1_first: "$.data[0].id" }
            - call: "GET /agreements"
              payload: { limit: 2, offset: 2 }
              as: ComplianceOfficer
              captures: { cr_p2_first: "$.data[0].id" }
            - call: "GET /agreements"
              payload: { status: "DRAFT", limit: 50 }
              as: ComplianceOfficer
              captures: { cr_draft_first: "$.data[0].id", cr_draft_status: "$.data[0].status" }
            - call: "GET /agreements"
              payload: { insured_id: "${cr_insured}", limit: 50 }
              as: ComplianceOfficer
            - call: "GET /agreements"
              payload: { producer_agent_id: "${cr_agent}", status: "VOIDED", limit: 50 }
              as: ComplianceOfficer
              captures: { cr_void_first: "$.data[0].id" }
            - call: "GET /agreements"
              payload: { limit: 0 }
              as: ComplianceOfficer
              captures: { cr_e_limit: "$.data.error_id" }
            - call: "GET /agreements/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: FinanceAnalyst
              captures: { cr_e_missing: "$.data.error_id" }
          assert:
            - "CREATE echoes every input: ${cr_a1_down} == 100000, ${cr_a1_fee} == 2000, ${cr_a1_n} == 6, ${cr_a1_due} == '2026-10-01', ${cr_a1_status} == 'DRAFT' and ${cr_a1_ver} == 1, with HTTP 201 and a non-null id, created_at and updated_at"
            - "READ is faithful: ${cr_r_id} == ${cr_a1}, ${cr_r_down} == 100000, ${cr_r_fee} == 2000, ${cr_r_n} == 6, ${cr_r_due} == '2026-10-01', ${cr_r_status} == 'DRAFT', ${cr_r_ver} == 1 and ${cr_r_insured} == ${cr_insured}; ${cr_r_total} is null because no quote has been struck"
            - "the three notes now sit in three statuses: ${cr_a1_status} == 'DRAFT', ${cr_a2_status} == 'PENDING_VERIFICATION' and ${cr_a3_status} == 'VOIDED'"
            - "PAGE 1 — GET /agreements?limit=2&offset=0 returns 2 items with total_count == 3, has_more == true, limit == 2 and offset == 0"
            - "PAGE 2 — GET /agreements?limit=2&offset=2 returns 1 item with total_count == 3, has_more == false, and ${cr_p2_first} != ${cr_p1_first}"
            - "FILTER NARROWS total_count, not just the page: GET /agreements?status=DRAFT returns total_count == 1 with ${cr_draft_first} == ${cr_a1} and ${cr_draft_status} == 'DRAFT'"
            - "GET /agreements?insured_id=${cr_insured} returns total_count == 3, and GET /agreements?producer_agent_id=${cr_agent}&status=VOIDED returns total_count == 1 with ${cr_void_first} == ${cr_a3} — the two filters compose"
            - "${cr_e_limit} == 'ERR_INVALID_REQUEST' with HTTP 400, because limit must fall in [1,100]"
            - "${cr_e_missing} == 'ERR_AGREEMENT_NOT_FOUND' with HTTP 404"
            - "NO UPDATE OR DELETE EXISTS: §1.5 declares no PUT, PATCH or DELETE on any path, so every mutation after creation runs through a named action endpoint (submit, activate, void, payments, restructure) and each one bumps version"
            - "${cr_insured_name} == 'Cascade Logistics Inc' — the Insured read-back confirms the same envelope shape on a second entity"

      - name: bulk_action_servicing_run_reports_aggregate_counts_and_skips_rather_than_rolls_back
        claim_type: bulk_action
        grounds:
          - endpoints.POST_/servicing-runs
          - endpoints.POST_/servicing-runs.side_effects
          - state_machines.PremiumFinanceAgreement_delinquency_stage
        distinguishing_aspect: |
          The sweep is the only endpoint that mutates an unbounded set of notes in one call, and its
          semantics are SKIP, not all-or-nothing: a note that needs no work is passed over without
          failing the run, and the three returned counters are aggregates over the notes that did move.
          Three notes are in scope — one delinquent, one whose first installment was paid early, one
          voided — and the run touches exactly one of them. Re-running the sweep at the same clock is
          the discriminator: a correct implementation reports zeros because nothing is newly eligible,
          while one that recomputes from due dates alone double-assesses.
        test_recipe:
          setup:
            - "the clock is advanced to 2026-08-15 and the canonical TX regime has an effective License"
            - "notes P and Q are identical 600k notes, both ACTIVE, with installments of 89941 due from 2026-10-01"
            - "note Q's first installment is paid in full on 2026-08-15, before it is ever due"
            - "note R is created and voided while still DRAFT, so it has no installments at all"
