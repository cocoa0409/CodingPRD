  - rule_id: compensating_invariant
    instances:
      - name: negotiation_cycle_conserves_quote_rate_and_case_state
        grounds:
          - state_machines.Quote.PROPOSED_to_COUNTERED
          - state_machines.Quote.COUNTERED_to_PROPOSED
