# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Babysitter & Nanny Marketplace — EXPERT band
# Breadth probe over §1.1–§1.7 testable claims not covered by §1.8.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_caregiver_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Caregiver.fields.full_name, entities.Caregiver.fields.availability_status]
        distinguishing_aspect: "POST /marketplace/caregivers with required fields -> 201; background_check_tier=NONE, verification_status=NONE, availability_status=OFFLINE."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /marketplace/_clock/set"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /marketplace/caregivers"
              payload: { full_name: "Ava", email: "ava@x.com", hourly_rate_floor_cents: 1800 }
              as: PlatformAdmin
              captures: { cg_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Caregiver.${cg_id}.background_check_tier == NONE"
            - "Caregiver.${cg_id}.verification_status == NONE"
            - "Caregiver.${cg_id}.availability_status == OFFLINE"
            - "Caregiver.${cg_id}.version == 1"

      - name: family_create_default_required_tier_basic
        claim_type: Defaults
        grounds: [entities.Family.fields.required_tier, entities.Family.fields.escrow_available_cents]
        distinguishing_aspect: "Omitting required_tier -> defaults to BASIC; escrow_available_cents initialized to wallet_balance_cents (0 when omitted)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /marketplace/_clock/set"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /marketplace/families"
              payload: { display_name: "Def", email: "def@x.com", num_children: 1 }
              as: PlatformAdmin
              captures: { fam_id: $.data.id }
          assert:
            - "Family.${fam_id}.required_tier == BASIC"
            - "Family.${fam_id}.wallet_balance_cents == 0"
            - "Family.${fam_id}.escrow_available_cents == 0"

      - name: get_caregiver_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Caregiver, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /marketplace/caregivers/{random-uuid} -> 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /marketplace/_clock/set"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /marketplace/caregivers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_booking_missing_required_field_returns_validation
        claim_type: Required Fields
        grounds: [entities.Booking.fields.scheduled_start, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /marketplace/bookings omitting scheduled_end -> 400 ERR_VALIDATION."
        test_recipe:
          setup: ["A family, caregiver, and OPEN posting exist."]
          setup_api_calls:
            - call: "POST /marketplace/_clock/set"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /marketplace/families"
              payload: { display_name: "Rq", email: "rq@x.com", num_children: 1, wallet_balance_cents: 50000 }
              as: PlatformAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /marketplace/caregivers"
              payload: { full_name: "Bea", email: "bea@x.com", hourly_rate_floor_cents: 1500 }
              as: PlatformAdmin
              captures: { cg_id: $.data.id }
            - call: "POST /marketplace/job-postings"
              payload: { family_id: "${fam_id}", title: "Rqp", care_type: "ONE_TIME", family_pay_rate_cents: 2000 }
              as: Family
              as_user_id: "${fam_id}"
              captures: { jp_id: $.data.id }
          trigger:
            - call: "POST /marketplace/bookings"
              payload: { family_id: "${fam_id}", caregiver_id: "${cg_id}", job_posting_id: "${jp_id}", agreed_rate_cents: 2000, scheduled_start: "2026-03-20T08:00:00Z" }
              as: Family
              as_user_id: "${fam_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_VALIDATION"

      - name: caregiver_rating_computed_fields_ignore_input
        claim_type: System Fields
        grounds: [entities.Caregiver.fields.rating_avg, entities.Caregiver.fields.rating_count]
        distinguishing_aspect: "A freshly created caregiver has rating_avg==0 and rating_count==0; computed fields are server-owned (no input)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /marketplace/_clock/set"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /marketplace/caregivers"
              payload: { full_name: "Cal", email: "cal@x.com", hourly_rate_floor_cents: 1500 }
              as: PlatformAdmin
              captures: { cg_id: $.data.id }
          assert:
            - "Caregiver.${cg_id}.rating_avg == 0"
            - "Caregiver.${cg_id}.rating_count == 0"
            - "Caregiver.${cg_id}.pending_earnings_cents == 0"

      - name: tax_statement_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.TaxStatement]
        distinguishing_aspect: "TaxStatement has common_fields:false — response carries id and created_at but no version field and no update endpoint."
        test_recipe:
          setup: ["A family and caregiver with one PAID payout (gross 19250, fica 1473) in tax_year 2026."]
          setup_api_calls:
            - call: "POST /marketplace/_clock/set"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /marketplace/families"
              payload: { display_name: "Tx", email: "txi@x.com", num_children: 2, required_tier: "BASIC", wallet_balance_cents: 100000 }
              as: PlatformAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /marketplace/caregivers"
              payload: { full_name: "Tina", email: "tina@x.com", hourly_rate_floor_cents: 1500 }
              as: PlatformAdmin
              captures: { cg_id: $.data.id }
            - call: "POST /marketplace/caregivers/${cg_id}/availability"
              payload: { availability_status: "AVAILABLE" }
              as: Caregiver
              as_user_id: "${cg_id}"
            - call: "POST /marketplace/background-checks"
              payload: { caregiver_id: "${cg_id}", requested_tier: "BASIC" }
              as: PlatformAdmin
              captures: { bc_id: $.data.id }
            - call: "POST /marketplace/background-checks/${bc_id}/start"
              payload: {}
              as: PlatformAdmin
            - call: "POST /marketplace/background-checks/${bc_id}/adjudicate"
              payload: { decision: "CLEAR" }
              as: PlatformAdmin
            - call: "POST /marketplace/job-postings"
              payload: { family_id: "${fam_id}", title: "Txp", care_type: "ONE_TIME", family_pay_rate_cents: 2000, required_tier: "BASIC" }
              as: Family
              as_user_id: "${fam_id}"
              captures: { jp_id: $.data.id }
            - call: "POST /marketplace/bookings"
              payload: { family_id: "${fam_id}", caregiver_id: "${cg_id}", job_posting_id: "${jp_id}", agreed_rate_cents: 2000, scheduled_start: "2026-03-15T08:00:00Z", scheduled_end: "2026-03-15T14:00:00Z", recurrence_count: 1 }
              as: Family
              as_user_id: "${fam_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /marketplace/bookings/${bk_id}/confirm"
              payload: {}
              as: Caregiver
              as_user_id: "${cg_id}"
            - call: "POST /marketplace/_clock/set"
              payload: { to_iso8601: "2026-03-15T08:00:00Z" }
              as: PlatformAdmin
            - call: "GET /marketplace/sessions"
              payload: { booking_id: "${bk_id}" }
              as: PlatformAdmin
              captures: { sess_id: "$.data[0].id" }
            - call: "POST /marketplace/sessions/${sess_id}/clock-in"
              payload: {}
              as: Caregiver
              as_user_id: "${cg_id}"
            - call: "POST /marketplace/_clock/set"
              payload: { to_iso8601: "2026-03-15T16:30:00Z" }
              as: PlatformAdmin
            - call: "POST /marketplace/sessions/${sess_id}/clock-out"
              payload: {}
              as: Caregiver
              as_user_id: "${cg_id}"
            - call: "POST /marketplace/payouts"
              payload: { caregiver_id: "${cg_id}", family_id: "${fam_id}", session_ids: ["${sess_id}"] }
              as: PlatformAdmin
              captures: { po_id: $.data.id }
            - call: "POST /marketplace/payouts/${po_id}/pay"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /marketplace/tax-statements"
              payload: { family_id: "${fam_id}", caregiver_id: "${cg_id}", tax_year: 2026 }
              as: PlatformAdmin
              captures: { ts_id: $.data.id }
          assert:
            - "response.status == 201"
            - "TaxStatement.${ts_id}.cash_wages_cents == 19250"
            - "TaxStatement.${ts_id}.fica_withheld_cents == 1473"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: decline_booking_from_declined_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Booking.OFFERED_to_DECLINED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A DECLINED booking is terminal; a second decline -> 409 ERR_INVALID_STATE, no side effects."
        test_recipe:
          setup: ["Booking OFFERED then DECLINED by caregiver."]
          setup_api_calls:
            - call: "POST /marketplace/_clock/set"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /marketplace/families"
              payload: { display_name: "Dl", email: "dl@x.com", num_children: 1, wallet_balance_cents: 50000 }
              as: PlatformAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /marketplace/caregivers"
              payload: { full_name: "Deb", email: "deb@x.com", hourly_rate_floor_cents: 1500 }
              as: PlatformAdmin
              captures: { cg_id: $.data.id }
            - call: "POST /marketplace/job-postings"
              payload: { family_id: "${fam_id}", title: "Dlp", care_type: "ONE_TIME", family_pay_rate_cents: 2000 }
              as: Family
              as_user_id: "${fam_id}"
              captures: { jp_id: $.data.id }
            - call: "POST /marketplace/bookings"
              payload: { family_id: "${fam_id}", caregiver_id: "${cg_id}", job_posting_id: "${jp_id}", agreed_rate_cents: 2000, scheduled_start: "2026-03-20T08:00:00Z", scheduled_end: "2026-03-20T12:00:00Z", recurrence_count: 1 }
              as: Family
              as_user_id: "${fam_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /marketplace/bookings/${bk_id}/decline"
              payload: {}
              as: Caregiver
              as_user_id: "${cg_id}"
          trigger:
            - call: "POST /marketplace/bookings/${bk_id}/decline"
              payload: {}
              as: Caregiver
              as_user_id: "${cg_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: clear_adjudication_sets_caregiver_tier_and_status
        claim_type: Side Effect Execution
        grounds: [state_machines.BackgroundCheck.IN_PROGRESS_to_CLEAR, entities.Caregiver.fields.background_check_tier]
        distinguishing_aspect: "CLEAR adjudication sets caregiver.verification_status=CLEAR and background_check_tier=STANDARD (requested tier)."
        test_recipe:
          setup: ["Caregiver with a STANDARD check IN_PROGRESS."]
          setup_api_calls:
            - call: "POST /marketplace/_clock/set"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /marketplace/caregivers"
              payload: { full_name: "Ela", email: "ela@x.com", hourly_rate_floor_cents: 1500 }
              as: PlatformAdmin
              captures: { cg_id: $.data.id }
            - call: "POST /marketplace/background-checks"
              payload: { caregiver_id: "${cg_id}", requested_tier: "STANDARD" }
              as: PlatformAdmin
              captures: { bc_id: $.data.id }
            - call: "POST /marketplace/background-checks/${bc_id}/start"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /marketplace/background-checks/${bc_id}/adjudicate"
              payload: { decision: "CLEAR" }
              as: PlatformAdmin
          assert:
            - "BackgroundCheck.${bc_id}.status == CLEAR"
            - "Caregiver.${cg_id}.verification_status == CLEAR"
            - "Caregiver.${cg_id}.background_check_tier == STANDARD"

      - name: consider_then_rerun_revert_loop_to_in_progress
        claim_type: Valid Transition
        grounds: [state_machines.BackgroundCheck.IN_PROGRESS_to_CONSIDER, state_machines.BackgroundCheck.CONSIDER_to_IN_PROGRESS]
        distinguishing_aspect: "CONSIDER then start re-runs the check: status goes IN_PROGRESS->CONSIDER->IN_PROGRESS and caregiver.verification_status returns to PENDING."
        test_recipe:
          setup: ["Caregiver with a BASIC check adjudicated CONSIDER."]
          setup_api_calls:
            - call: "POST /marketplace/_clock/set"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /marketplace/caregivers"
              payload: { full_name: "Fox", email: "fox@x.com", hourly_rate_floor_cents: 1500 }
              as: PlatformAdmin
              captures: { cg_id: $.data.id }
            - call: "POST /marketplace/background-checks"
              payload: { caregiver_id: "${cg_id}", requested_tier: "BASIC" }
              as: PlatformAdmin
              captures: { bc_id: $.data.id }
            - call: "POST /marketplace/background-checks/${bc_id}/start"
              payload: {}
              as: PlatformAdmin
            - call: "POST /marketplace/background-checks/${bc_id}/adjudicate"
              payload: { decision: "CONSIDER" }
              as: PlatformAdmin
          trigger:
            - call: "POST /marketplace/background-checks/${bc_id}/start"
              payload: {}
              as: PlatformAdmin
          assert:
            - "BackgroundCheck.${bc_id}.status == IN_PROGRESS"
            - "Caregiver.${cg_id}.verification_status == PENDING"

      - name: clear_check_is_terminal_no_further_adjudication
        claim_type: Terminal State Lockdown
        grounds: [state_machines.BackgroundCheck.IN_PROGRESS_to_CLEAR, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A CLEAR check is terminal; adjudicating it again -> 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["Caregiver with a BASIC check adjudicated CLEAR."]
          setup_api_calls:
            - call: "POST /marketplace/_clock/set"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /marketplace/caregivers"
              payload: { full_name: "Gem", email: "gem@x.com", hourly_rate_floor_cents: 1500 }
              as: PlatformAdmin
              captures: { cg_id: $.data.id }
            - call: "POST /marketplace/background-checks"
              payload: { caregiver_id: "${cg_id}", requested_tier: "BASIC" }
              as: PlatformAdmin
              captures: { bc_id: $.data.id }
            - call: "POST /marketplace/background-checks/${bc_id}/start"
              payload: {}
              as: PlatformAdmin
            - call: "POST /marketplace/background-checks/${bc_id}/adjudicate"
              payload: { decision: "CLEAR" }
              as: PlatformAdmin
          trigger:
            - call: "POST /marketplace/background-checks/${bc_id}/adjudicate"
              payload: { decision: "FLAGGED" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: review_publish_bubbles_caregiver_rating_aggregates
        claim_type: Bubble up
        grounds: [state_machines.Review.PENDING_MODERATION_to_PUBLISHED, entities.Caregiver.fields.rating_avg]
        distinguishing_aspect: "Publishing two reviews (4 and 5) recomputes caregiver.rating_avg=4.5, rating_count=2; hiding the 4-star recomputes to 5.0, count 1 (derived-field reconciliation)."
        test_recipe:
          setup: ["Caregiver with two COMPLETED bookings and two PENDING_MODERATION reviews (values 4 and 5)."]
          setup_api_calls:
            - call: "POST /marketplace/_clock/set"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /marketplace/families"
              payload: { display_name: "Rev", email: "rev@x.com", num_children: 1, required_tier: "BASIC", wallet_balance_cents: 200000 }
              as: PlatformAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /marketplace/caregivers"
              payload: { full_name: "Han", email: "han@x.com", hourly_rate_floor_cents: 1500 }
              as: PlatformAdmin
              captures: { cg_id: $.data.id }
            - call: "POST /marketplace/caregivers/${cg_id}/availability"
              payload: { availability_status: "AVAILABLE" }
              as: Caregiver
              as_user_id: "${cg_id}"
            - call: "POST /marketplace/background-checks"
              payload: { caregiver_id: "${cg_id}", requested_tier: "BASIC" }
              as: PlatformAdmin
              captures: { bc_id: $.data.id }
            - call: "POST /marketplace/background-checks/${bc_id}/start"
              payload: {}
              as: PlatformAdmin
            - call: "POST /marketplace/background-checks/${bc_id}/adjudicate"
              payload: { decision: "CLEAR" }
              as: PlatformAdmin
            - call: "POST /marketplace/job-postings"
              payload: { family_id: "${fam_id}", title: "Ra", care_type: "ONE_TIME", family_pay_rate_cents: 2000, required_tier: "BASIC" }
              as: Family
              as_user_id: "${fam_id}"
              captures: { jp1: $.data.id }
            - call: "POST /marketplace/bookings"
              payload: { family_id: "${fam_id}", caregiver_id: "${cg_id}", job_posting_id: "${jp1}", agreed_rate_cents: 2000, scheduled_start: "2026-04-01T08:00:00Z", scheduled_end: "2026-04-01T12:00:00Z", recurrence_count: 1 }
              as: Family
              as_user_id: "${fam_id}"
              captures: { bk1: $.data.id }
            - call: "POST /marketplace/bookings/${bk1}/confirm"
              payload: {}
              as: Caregiver
              as_user_id: "${cg_id}"
            - call: "POST /marketplace/_clock/set"
              payload: { to_iso8601: "2026-04-01T08:00:00Z" }
              as: PlatformAdmin
            - call: "GET /marketplace/sessions"
              payload: { booking_id: "${bk1}" }
              as: PlatformAdmin
              captures: { s1: "$.data[0].id" }
            - call: "POST /marketplace/sessions/${s1}/clock-in"
              payload: {}
              as: Caregiver
              as_user_id: "${cg_id}"
            - call: "POST /marketplace/_clock/set"
              payload: { to_iso8601: "2026-04-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /marketplace/sessions/${s1}/clock-out"
              payload: {}
              as: Caregiver
              as_user_id: "${cg_id}"
            - call: "POST /marketplace/reviews"
              payload: { booking_id: "${bk1}", family_id: "${fam_id}", caregiver_id: "${cg_id}", rating_value: 4 }
              as: Family
              as_user_id: "${fam_id}"
              captures: { rv1: $.data.id }
            - call: "POST /marketplace/job-postings"
              payload: { family_id: "${fam_id}", title: "Rb", care_type: "ONE_TIME", family_pay_rate_cents: 2000, required_tier: "BASIC" }
              as: Family
              as_user_id: "${fam_id}"
              captures: { jp2: $.data.id }
            - call: "POST /marketplace/bookings"
              payload: { family_id: "${fam_id}", caregiver_id: "${cg_id}", job_posting_id: "${jp2}", agreed_rate_cents: 2000, scheduled_start: "2026-04-03T08:00:00Z", scheduled_end: "2026-04-03T12:00:00Z", recurrence_count: 1 }
              as: Family
              as_user_id: "${fam_id}"
              captures: { bk2: $.data.id }
            - call: "POST /marketplace/bookings/${bk2}/confirm"
              payload: {}
              as: Caregiver
              as_user_id: "${cg_id}"
            - call: "POST /marketplace/_clock/set"
              payload: { to_iso8601: "2026-04-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "GET /marketplace/sessions"
              payload: { booking_id: "${bk2}" }
              as: PlatformAdmin
              captures: { s2: "$.data[0].id" }
            - call: "POST /marketplace/sessions/${s2}/clock-in"
              payload: {}
              as: Caregiver
              as_user_id: "${cg_id}"
            - call: "POST /marketplace/_clock/set"
              payload: { to_iso8601: "2026-04-03T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /marketplace/sessions/${s2}/clock-out"
              payload: {}
              as: Caregiver
              as_user_id: "${cg_id}"
            - call: "POST /marketplace/reviews"
              payload: { booking_id: "${bk2}", family_id: "${fam_id}", caregiver_id: "${cg_id}", rating_value: 5 }
              as: Family
              as_user_id: "${fam_id}"
              captures: { rv2: $.data.id }
            - call: "POST /marketplace/reviews/${rv1}/moderate"
              payload: { decision: "PUBLISH" }
              as: PlatformAdmin
            - call: "POST /marketplace/reviews/${rv2}/moderate"
              payload: { decision: "PUBLISH" }
              as: PlatformAdmin
          trigger:
            - call: "POST /marketplace/reviews/${rv1}/moderate"
              payload: { decision: "HIDE" }
              as: PlatformAdmin
          assert:
            - "Caregiver.${cg_id}.rating_count == 1"
            - "Caregiver.${cg_id}.rating_avg == 5.0"

      - name: clockout_from_scheduled_session_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.BookingSession.IN_PROGRESS_to_COMPLETED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Clock-out on a SCHEDULED (never clocked-in) session -> 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["Confirmed booking with a SCHEDULED session that has not been clocked in."]
          setup_api_calls:
            - call: "POST /marketplace/_clock/set"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /marketplace/families"
              payload: { display_name: "Cs", email: "cs@x.com", num_children: 1, required_tier: "BASIC", wallet_balance_cents: 100000 }
              as: PlatformAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /marketplace/caregivers"
              payload: { full_name: "Ike", email: "ike@x.com", hourly_rate_floor_cents: 1500 }
              as: PlatformAdmin
              captures: { cg_id: $.data.id }
            - call: "POST /marketplace/caregivers/${cg_id}/availability"
              payload: { availability_status: "AVAILABLE" }
              as: Caregiver
              as_user_id: "${cg_id}"
            - call: "POST /marketplace/background-checks"
              payload: { caregiver_id: "${cg_id}", requested_tier: "BASIC" }
              as: PlatformAdmin
              captures: { bc_id: $.data.id }
            - call: "POST /marketplace/background-checks/${bc_id}/start"
              payload: {}
              as: PlatformAdmin
            - call: "POST /marketplace/background-checks/${bc_id}/adjudicate"
              payload: { decision: "CLEAR" }
              as: PlatformAdmin
