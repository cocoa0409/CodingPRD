# =============================================================================
# Task 1873 — High-Voltage Cable Testing & Fault Location (cable diagnostics
# contractor). Scaffold seed tables (§1.0–§1.7). Difficulty: beyond-expert.
# =============================================================================

scenario: |
  1873. High-Voltage Cable Testing & Fault Location (cable diagnostics contractor):
  circuit isolation & test plan, diagnostic test (VLF/partial discharge) execution,
  fault pinpointing & excavation coordination, repair splice & re-test acceptance,
  customer outage window & restoration, mobile equipment scheduling, test data
  trending for replacement planning, safety grounding verification

domain_name: high-voltage-cable-testing
api_prefix: /cable-diagnostics

complexity_profile:
  primary_archetype: temporal_windowing        # outage windows, dig windows, equipment intervals
  secondary_archetype: compliance_audit        # grounding permits, two-person rules, acceptance chain
  complexity_layers:
    - optimistic_concurrency                   # OCC on CableCircuit.version and TestJob.version
    - cascading_side_effects                   # splice-accept and window-close cascades, 4-entity depth
    - dual_variant_calculation                 # formal/provisional health; as-tested/temp-corrected verdicts; standard/calibrated fault distance
    - conditional_feature_flags                # TestJob.use_temperature_correction selects verdict basis
  entity_topology: flat                        # peer entities linked by FK references
  state_machine_shape: cyclic                  # circuit IN_SERVICE→…→IN_SERVICE loop; job suspend/resume; fault reopen loop
  relationship_patterns:
    - one_to_many
    - self_referential                         # HealthAssessment.supersedes_id
    - cross_aggregate
  role_model: segregation_of_duties            # permit issuer ≠ grounding verifier ≠ releaser; executor vs customer acceptance
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table (§1.1)
# =============================================================================
entities:
  - name: CableCircuit
    parent: null
    common_fields: true
    fields:
      - { name: circuit_ref, type: string, source: input, description: "Unique contractor-side circuit reference", constraints: "unique across all circuits (ERR_DUPLICATE_CIRCUIT_REF)" }
      - { name: voltage_class, type: enum, source: input, description: "KV_15 | KV_25 | KV_35 | KV_69 — selects U0 and velocity-factor constants" }
      - { name: length_m, type: integer, source: input, description: "Circuit length in metres", constraints: "> 0" }
      - { name: installation_year, type: integer, source: input, description: "Year installed (4-digit)", constraints: "1950..2026" }
      - { name: calibrated_velocity_factor, type: number, source: input, default: null, description: "Optional site-calibrated TDR velocity factor", constraints: "null or 0.45..0.60" }
      - { name: status, type: enum, source: system, description: "IN_SERVICE | OUTAGE_PENDING | DE_ENERGIZED | GROUNDED | UNDER_TEST | TEST_COMPLETE | RESTORING — auto-driven by child entities" }
      - { name: unresolved_fault_count, type: integer, source: computed, default: 0, description: "Faults on this circuit not in CLOSED_VERIFIED" }
      - { name: resolved_fault_count_24m, type: integer, source: computed, default: 0, description: "Faults CLOSED_VERIFIED whose closed_at lies within trailing 24 months of logical clock" }
      - { name: current_health_index, type: number, source: computed, default: null, description: "Health index of the currently ADOPTED HealthAssessment; null until first adoption" }
      - { name: current_health_band, type: enum, source: computed, default: null, description: "GOOD | FAIR | POOR | CRITICAL | null" }
      - { name: replacement_recommended, type: boolean, source: computed, default: false, description: "true iff band==CRITICAL OR (band==POOR AND unresolved_fault_count >= 2); refreshed on adoption and on fault-count change" }
      - { name: approved_outage_minutes_total, type: integer, source: computed, default: 0, description: "Sum of duration_minutes over windows in {APPROVED, ACTIVE}; approve adds, cancel subtracts" }
      - { name: splice_count, type: integer, source: computed, default: 0, description: "Count of ACCEPTED RepairSplices on this circuit" }

  - name: OutageWindow
    parent: null
    common_fields: true
    fields:
      - { name: circuit_id, type: string, source: input, description: "FK -> CableCircuit.id; window owner" }
      - { name: kind, type: enum, source: input, description: "PLANNED_DIAGNOSTIC | EMERGENCY_FAULT | REPAIR_RESTORE — EMERGENCY_FAULT multiplies overrun charge by 1.25" }
      - { name: window_start, type: datetime, source: input, description: "Half-open interval start (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Half-open interval end (exclusive); must be > window_start" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | ACTIVE | CLOSED | CANCELLED" }
      - { name: duration_minutes, type: integer, source: computed, description: "= (window_end - window_start) in whole minutes" }
      - { name: restored_at, type: datetime, source: system, default: null, description: "Restoration timestamp recorded at close" }
      - { name: overrun_minutes, type: integer, source: computed, default: 0, description: "= max(0, ceil((restored_at - window_end)/60s)) at close" }
      - { name: overrun_charge_cents, type: integer, source: computed, default: 0, description: "Final overrun charge per outage_overrun_charge (actual variant)" }
      - { name: estimated_charge_cents, type: integer, source: computed, default: 0, description: "Provisional estimate computed at approve time (estimate variant)" }

  - name: TestJob
    parent: null
    common_fields: true
    fields:
      - { name: circuit_id, type: string, source: input, description: "FK -> CableCircuit.id" }
      - { name: outage_window_id, type: string, source: input, description: "FK -> OutageWindow.id; window must belong to circuit_id" }
      - { name: requested_methods, type: array, source: input, description: "Non-empty subset of VLF_TAN_DELTA | VLF_WITH_PD | PD_MAPPING" }
      - { name: approved_budget_cents, type: integer, source: input, description: "Customer-approved spend cap", constraints: "> 0" }
      - { name: use_temperature_correction, type: boolean, source: input, default: false, description: "Feature flag: official series verdict uses temperature-corrected basis when true" }
      - { name: estimate_cents, type: integer, source: computed, default: null, description: "job_estimate_cents computed at plan time; null while DRAFT" }
      - { name: committed_cost_cents, type: integer, source: computed, default: 0, description: "Sum of cost_cents over non-CANCELLED ExcavationOrders + all RepairSplices of this job's faults" }
      - { name: status, type: enum, source: system, description: "DRAFT | PLANNED | IN_PROGRESS | SUSPENDED | EVALUATION | COMPLETED | ABORTED" }

  - name: IsolationPermit
    parent: null
    common_fields: true
    fields:
      - { name: test_job_id, type: string, source: input, description: "FK -> TestJob.id; at most one non-RELEASED permit per job (ERR_PERMIT_EXISTS)" }
      - { name: isolation_points, type: array, source: input, description: "Switching/isolation point identifiers", constraints: "min 1 entry" }
      - { name: ground_count, type: integer, source: input, description: "Number of applied safety grounds", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | GROUNDING_VERIFIED | RELEASED" }
      - { name: issued_by_user_id, type: string, source: system, default: null, description: "X-User-ID captured at issue" }
      - { name: grounding_verified_by_user_id, type: string, source: system, default: null, description: "X-User-ID captured at grounding verification; must differ from issued_by_user_id" }
      - { name: released_by_user_id, type: string, source: system, default: null, description: "X-User-ID captured at release; must differ from grounding_verified_by_user_id" }

  - name: TestSeries
    parent: null
    common_fields: true
    fields:
      - { name: test_job_id, type: string, source: input, description: "FK -> TestJob.id" }
      - { name: method, type: enum, source: input, description: "VLF_TAN_DELTA | VLF_WITH_PD | PD_MAPPING; must be in job.requested_methods" }
      - { name: test_voltage_kv, type: number, source: input, description: "Applied test voltage; must be within ±5% (inclusive) of 1.5 x U0(circuit.voltage_class) for VLF methods" }
      - { name: is_retest, type: boolean, source: input, default: false, description: "Marks this series as a post-repair acceptance re-test" }
      - { name: retest_of_fault_id, type: string, source: input, default: null, description: "FK -> FaultRecord.id; required when is_retest=true, forbidden otherwise" }
      - { name: step_count, type: integer, source: system, description: "3 for VLF_TAN_DELTA/VLF_WITH_PD (0.5/1.0/1.5 x U0), 1 for PD_MAPPING" }
      - { name: status, type: enum, source: system, description: "SETUP | ENERGIZING | LOGGING | EVALUATED | ACCEPTED | INVALID" }
      - { name: verdict_as_tested, type: enum, source: computed, default: null, description: "PASS | MONITOR | FAIL computed on raw readings" }
      - { name: verdict_temperature_corrected, type: enum, source: computed, default: null, description: "Verdict computed on 20C-corrected tan-delta" }
      - { name: verdict, type: enum, source: computed, default: null, description: "Official verdict: corrected basis if job.use_temperature_correction else as-tested basis" }
      - { name: max_tan_delta_e3, type: number, source: computed, default: null, description: "Max rounded tan-delta (1e-3 units) across readings; null for PD_MAPPING" }
      - { name: max_pd_pc, type: number, source: computed, default: null, description: "Max PD level in pC across readings; null for VLF_TAN_DELTA" }

  - name: TestReading
    parent: null
    common_fields: false
    fields:
      - { name: test_series_id, type: string, source: input, description: "FK -> TestSeries.id" }
      - { name: step_index, type: integer, source: input, description: "0-based voltage step; unique per series (ERR_DUPLICATE_STEP); must be < step_count" }
      - { name: applied_voltage_kv, type: number, source: input, description: "Actual applied voltage for this step", constraints: "> 0" }
      - { name: tan_delta_e3, type: number, source: input, default: null, description: "Tan-delta in 1e-3 units; required for VLF methods, forbidden for PD_MAPPING" }
      - { name: pd_level_pc, type: number, source: input, default: null, description: "PD magnitude in pC; required for VLF_WITH_PD and PD_MAPPING, forbidden for VLF_TAN_DELTA" }
      - { name: pd_location_m, type: number, source: input, default: null, description: "PD-mapped location in metres; optional, PD_MAPPING only" }
      - { name: ambient_temp_c, type: number, source: input, description: "Ambient temperature at reading time (drives correction factor)" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the FieldTechnician" }

  - name: FaultRecord
    parent: null
    common_fields: true
    fields:
      - { name: test_job_id, type: string, source: system, description: "FK -> TestJob.id (taken from the originating series)" }
      - { name: test_series_id, type: string, source: input, description: "FK -> TestSeries.id; unique among faults (ERR_FAULT_ALREADY_RECORDED)" }
      - { name: status, type: enum, source: system, description: "SUSPECTED | PINPOINTED | EXCAVATING | REPAIRING | REPAIRED | RETESTING | CLOSED_VERIFIED | REOPENED" }
      - { name: pinpoint_method, type: enum, source: input, default: null, description: "PULSE_ECHO | ARC_REFLECTION — recorded at pinpoint" }
      - { name: trace_time_us, type: number, source: input, default: null, description: "TDR time-of-flight microseconds recorded at pinpoint", constraints: "> 0" }
      - { name: velocity_factor_used, type: number, source: computed, default: null, description: "VF applied to the selected distance" }
      - { name: pinpointed_distance_m, type: number, source: computed, default: null, description: "Selected-method distance, 0.1 m round_half_up" }
      - { name: alternate_distance_m, type: number, source: computed, default: null, description: "Distance under the OTHER velocity variant (standard vs calibrated)" }
      - { name: corridor_start_m, type: number, source: computed, default: null, description: "= round_half_up(d - max(5.0, round_half_up(0.10*d,1)), 1)" }
      - { name: corridor_end_m, type: number, source: computed, default: null, description: "= round_half_up(d + max(5.0, round_half_up(0.10*d,1)), 1)" }
      - { name: closed_at, type: datetime, source: system, default: null, description: "Set on CLOSED_VERIFIED; cleared on reopen" }

  - name: ExcavationOrder
    parent: null
    common_fields: true
    fields:
      - { name: fault_record_id, type: string, source: input, description: "FK -> FaultRecord.id; at most one excavation in {DRAFT, PERMITTED, IN_PROGRESS} per fault (ERR_EXCAVATION_EXISTS)" }
      - { name: target_location_m, type: number, source: input, description: "Dig centreline; must lie within [corridor_start_m, corridor_end_m] inclusive" }
      - { name: dig_start, type: datetime, source: input, description: "Dig window start (inclusive)" }
      - { name: dig_end, type: datetime, source: input, description: "Dig window end (inclusive containment); must be > dig_start" }
      - { name: permit_ref, type: string, source: input, description: "Municipal excavation permit reference" }
      - { name: cost_cents, type: integer, source: input, description: "Contractor excavation cost", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | PERMITTED | IN_PROGRESS | BACKFILLED | CANCELLED" }

  - name: RepairSplice
    parent: null
    common_fields: true
    fields:
      - { name: fault_record_id, type: string, source: input, description: "FK -> FaultRecord.id; at most one splice in {PLANNED,SPLICING,CURING,COMPLETED} per fault (ERR_SPLICE_EXISTS)" }
      - { name: excavation_order_id, type: string, source: input, description: "FK -> ExcavationOrder.id; its fault_record_id must equal this splice's fault_record_id (ERR_CROSS_REFERENCE_MISMATCH)" }
      - { name: splice_type, type: enum, source: input, description: "HEAT_SHRINK | COLD_SHRINK | PREMOLDED" }
      - { name: cost_cents, type: integer, source: input, description: "Splice materials+labour cost", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "PLANNED | SPLICING | CURING | COMPLETED | ACCEPTED | REJECTED" }
      - { name: cure_started_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp when CURING began" }
      - { name: completed_at, type: datetime, source: system, default: null, description: "Set on finish-curing; retest must be created strictly after this" }

  - name: MobileUnit
    parent: null
    common_fields: true
    fields:
      - { name: unit_code, type: string, source: input, description: "Unique fleet code", constraints: "unique (ERR_INVALID_REQUEST on duplicate)" }
      - { name: capabilities, type: array, source: input, description: "Subset of VLF | PD | TDR; must be non-empty" }
      - { name: max_test_voltage_kv, type: number, source: input, description: "Unit output ceiling", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | ASSIGNED | MAINTENANCE — ASSIGNED derived from open assignments" }
      - { name: committed_hours, type: number, source: computed, default: 0.0, description: "Sum of duration_hours over assignments in {RESERVED, CONFIRMED, ACTIVE}; 0.1 h round_half_up" }

  - name: EquipmentAssignment
    parent: null
    common_fields: true
    fields:
      - { name: mobile_unit_id, type: string, source: input, description: "FK -> MobileUnit.id" }
      - { name: test_job_id, type: string, source: input, description: "FK -> TestJob.id" }
      - { name: mobilize_at, type: datetime, source: input, description: "Assignment interval start (inclusive)" }
      - { name: demobilize_at, type: datetime, source: input, description: "Assignment interval end (inclusive); must be > mobilize_at" }
      - { name: duration_hours, type: number, source: computed, description: "= round_half_up((demobilize_at - mobilize_at)/3600s, 1)" }
      - { name: status, type: enum, source: system, description: "RESERVED | CONFIRMED | ACTIVE | RELEASED | CANCELLED" }

  - name: HealthAssessment
    parent: null
    common_fields: true
    fields:
      - { name: circuit_id, type: string, source: input, description: "FK -> CableCircuit.id" }
      - { name: basis, type: enum, source: input, description: "FORMAL (ACCEPTED series only) | PROVISIONAL (EVALUATED + ACCEPTED series)" }
      - { name: supersedes_id, type: string, source: system, default: null, description: "FK -> HealthAssessment.id; previous current assessment for the circuit, null when none" }
      - { name: health_index_score, type: number, source: computed, description: "0..100, 0.1 round_half_up; higher is healthier" }
      - { name: band, type: enum, source: computed, description: "GOOD (>=80) | FAIR ([60,80)) | POOR ([40,60)) | CRITICAL (<40)" }
      - { name: recommended_action, type: enum, source: computed, description: "NONE | MONITOR | PLAN_REPLACEMENT | URGENT_REPLACEMENT — band-mapped" }
      - { name: penalty_components, type: object, source: computed, description: "{ td_pen, pd_pen, fault_pen, age_pen } applied penalties" }
      - { name: status, type: enum, source: system, description: "COMPUTED | REVIEWED | ADOPTED | SUPERSEDED" }

# =============================================================================
# Table 2: State Machine Table (§1.2)
# =============================================================================
state_machines:
  - entity: CableCircuit
    initial_state: IN_SERVICE
    terminal_states: []
    transitions:
      - { from: IN_SERVICE, to: OUTAGE_PENDING, trigger: "system (an OutageWindow for this circuit becomes APPROVED)", actor: system, preconditions: [], side_effects: ["circuit updated_at/version refreshed"] }
      - { from: OUTAGE_PENDING, to: IN_SERVICE, trigger: "system (window CANCELLED and no other window of this circuit remains in {APPROVED, ACTIVE})", actor: system, preconditions: [], side_effects: [] }
      - { from: OUTAGE_PENDING, to: DE_ENERGIZED, trigger: "system (an IsolationPermit linked to a job of this circuit becomes ISSUED)", actor: system, preconditions: [], side_effects: [] }
      - { from: DE_ENERGIZED, to: GROUNDED, trigger: "system (permit becomes GROUNDING_VERIFIED)", actor: system, preconditions: [], side_effects: [] }
      - { from: GROUNDED, to: UNDER_TEST, trigger: "system (a TestSeries of the active job becomes ENERGIZING)", actor: system, preconditions: [], side_effects: [] }
      - { from: UNDER_TEST, to: TEST_COMPLETE, trigger: "system (active TestJob auto-transitions to EVALUATION)", actor: system, preconditions: [], side_effects: [] }
      - { from: TEST_COMPLETE, to: RESTORING, trigger: "system (permit becomes RELEASED)", actor: system, preconditions: [], side_effects: [] }
      - { from: RESTORING, to: IN_SERVICE, trigger: "system (the ACTIVE OutageWindow is CLOSED)", actor: system, preconditions: [], side_effects: ["cyclic return to IN_SERVICE"] }

  - entity: OutageWindow
    initial_state: REQUESTED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /cable-diagnostics/outage-windows/{id}/approve"
        actor: NetworkPlanner
        preconditions: ["circuit.status in {IN_SERVICE, OUTAGE_PENDING} (else ERR_INVALID_STATE)"]
        side_effects:
          - "circuit.approved_outage_minutes_total += duration_minutes"
          - "estimated_charge_cents := outage_overrun_charge estimate variant"
          - "circuit IN_SERVICE -> OUTAGE_PENDING"
      - from: APPROVED
        to: ACTIVE
        trigger: "POST /cable-diagnostics/outage-windows/{id}/activate"
        actor: NetworkPlanner
        preconditions: ["logical clock now satisfies window_start <= now < window_end (else ERR_WINDOW_NOT_ACTIVE)"]
        side_effects: []
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /cable-diagnostics/outage-windows/{id}/close"
        actor: NetworkPlanner
        preconditions: ["restored_at >= window_start (else ERR_INVALID_REQUEST)"]
        side_effects:
          - "restored_at stored; overrun_minutes and overrun_charge_cents computed (actual variant)"
          - "circuit.approved_outage_minutes_total -= duration_minutes"
          - "cascade hop 1: if circuit.status == RESTORING: circuit RESTORING -> IN_SERVICE; elif circuit.status == OUTAGE_PENDING and no other window of this circuit remains in {APPROVED, ACTIVE}: circuit OUTAGE_PENDING -> IN_SERVICE"
          - "cascade hop 2: every EquipmentAssignment of this circuit's jobs in {CONFIRMED, ACTIVE} -> RELEASED"
          - "cascade hop 3: each released assignment subtracts duration_hours from MobileUnit.committed_hours; a MobileUnit with no remaining {RESERVED,CONFIRMED,ACTIVE} assignments transitions ASSIGNED -> AVAILABLE"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /cable-diagnostics/outage-windows/{id}/cancel"
        actor: NetworkPlanner
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /cable-diagnostics/outage-windows/{id}/cancel"
        actor: NetworkPlanner
        preconditions: ["no non-terminal TestJob references this window (else ERR_INVALID_STATE)"]
        side_effects:
          - "circuit.approved_outage_minutes_total -= duration_minutes"
          - "if no other window of this circuit in {APPROVED, ACTIVE}: circuit OUTAGE_PENDING -> IN_SERVICE"

  - entity: TestJob
    initial_state: DRAFT
    terminal_states: [COMPLETED, ABORTED]
    transitions:
      - from: DRAFT
        to: PLANNED
        trigger: "POST /cable-diagnostics/test-jobs/{id}/plan"
        actor: NetworkPlanner
        preconditions:
          - "job_estimate_cents computed; estimate_cents <= approved_budget_cents (else ERR_BUDGET_EXCEEDED)"
        side_effects: ["estimate_cents stored"]
      - from: PLANNED
        to: PLANNED
        trigger: "POST /cable-diagnostics/test-jobs/{id}/reschedule"
        actor: NetworkPlanner
        preconditions:
          - "expected_test_job_version == job.version (else ERR_STALE_VERSION 412)"
          - "new outage_window_id references an APPROVED window of the same circuit (else ERR_INVALID_STATE)"
        side_effects:
          - "outage_window_id replaced (supersede semantics); increments TestJob.version by 1"
      - from: PLANNED
        to: IN_PROGRESS
        trigger: "POST /cable-diagnostics/test-jobs/{id}/start"
        actor: TestSupervisor
        preconditions: ["outage window status == ACTIVE (else ERR_WINDOW_NOT_ACTIVE)"]
        side_effects: []
      - from: IN_PROGRESS
        to: SUSPENDED
        trigger: "POST /cable-diagnostics/test-jobs/{id}/suspend"
        actor: TestSupervisor
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: IN_PROGRESS
        trigger: "POST /cable-diagnostics/test-jobs/{id}/resume"
        actor: TestSupervisor
        preconditions: ["outage window status == ACTIVE (else ERR_WINDOW_NOT_ACTIVE)"]
        side_effects: []
      - from: IN_PROGRESS
        to: EVALUATION
        trigger: "system (automatic when: >= 1 TestSeries exists, every TestSeries of the job is in terminal states {ACCEPTED, INVALID}, and every FaultRecord of the job is CLOSED_VERIFIED)"
        actor: system
        preconditions: []
        side_effects: ["circuit UNDER_TEST -> TEST_COMPLETE"]
      - from: EVALUATION
        to: COMPLETED
        trigger: "POST /cable-diagnostics/test-jobs/{id}/complete"
        actor: TestSupervisor
        preconditions: ["the job's IsolationPermit status == RELEASED (else ERR_PERMIT_NOT_RELEASED)"]
        side_effects: []
      - from: DRAFT
        to: ABORTED
        trigger: "POST /cable-diagnostics/test-jobs/{id}/abort"
        actor: NetworkPlanner
        preconditions: []
        side_effects: ["job's EquipmentAssignments in {RESERVED, CONFIRMED} -> CANCELLED with committed_hours adjustment"]
      - from: PLANNED
        to: ABORTED
        trigger: "POST /cable-diagnostics/test-jobs/{id}/abort"
        actor: NetworkPlanner
        preconditions: []
        side_effects: ["job's EquipmentAssignments in {RESERVED, CONFIRMED} -> CANCELLED with committed_hours adjustment"]

  - entity: IsolationPermit
    initial_state: DRAFT
    terminal_states: [RELEASED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /cable-diagnostics/isolation-permits/{id}/issue"
        actor: SafetyOfficer
        preconditions: []
        side_effects: ["issued_by_user_id := X-User-ID", "circuit OUTAGE_PENDING -> DE_ENERGIZED"]
      - from: ISSUED
        to: GROUNDING_VERIFIED
        trigger: "POST /cable-diagnostics/isolation-permits/{id}/verify-grounding"
        actor: SafetyOfficer
        preconditions: ["X-User-ID != issued_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"]
        side_effects: ["grounding_verified_by_user_id := X-User-ID", "circuit DE_ENERGIZED -> GROUNDED"]
      - from: GROUNDING_VERIFIED
        to: RELEASED
        trigger: "POST /cable-diagnostics/isolation-permits/{id}/release"
        actor: SafetyOfficer
        preconditions:
          - "X-User-ID != grounding_verified_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "job.status == EVALUATION (else ERR_INVALID_STATE)"
        side_effects: ["released_by_user_id := X-User-ID", "circuit TEST_COMPLETE -> RESTORING"]

  - entity: TestSeries
    initial_state: SETUP
    terminal_states: [ACCEPTED, INVALID]
    transitions:
      - from: SETUP
        to: ENERGIZING
        trigger: "POST /cable-diagnostics/test-series/{id}/energize"
        actor: TestSupervisor
        preconditions:
          - "job.status == IN_PROGRESS"
          - "job's IsolationPermit status == GROUNDING_VERIFIED (else ERR_GROUNDING_NOT_VERIFIED)"
          - "exists EquipmentAssignment for this job with status in {CONFIRMED, ACTIVE} and mobilize_at <= now <= demobilize_at (else ERR_NO_EQUIPMENT_ON_SITE)"
        side_effects: ["circuit GROUNDED -> UNDER_TEST"]
      - from: ENERGIZING
        to: LOGGING
        trigger: "system (first TestReading appended via POST /cable-diagnostics/test-series/{id}/readings)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ENERGIZING
        to: EVALUATED
        trigger: "POST /cable-diagnostics/test-series/{id}/evaluate"
        actor: TestSupervisor
        preconditions:
          - ">= 1 reading exists (else ERR_NO_READINGS — always fires from ENERGIZING)"
          - "all steps 0..step_count-1 have a reading (else ERR_STEP_INCOMPLETE)"
        side_effects:
          - "verdict_as_tested and verdict_temperature_corrected computed; verdict := basis selected by job.use_temperature_correction"
          - "max_tan_delta_e3 / max_pd_pc stored"
          - "if verdict == FAIL: auto-create FaultRecord SUSPECTED for (test_job_id, test_series_id)"
          - "fault auto-creation increments circuit.unresolved_fault_count by 1"
      - from: LOGGING
        to: EVALUATED
        trigger: "POST /cable-diagnostics/test-series/{id}/evaluate"
        actor: TestSupervisor
        preconditions:
          - ">= 1 reading exists (else ERR_NO_READINGS)"
          - "all steps 0..step_count-1 have a reading (else ERR_STEP_INCOMPLETE)"
        side_effects:
          - "verdict_as_tested and verdict_temperature_corrected computed; verdict := basis selected by job.use_temperature_correction"
          - "max_tan_delta_e3 / max_pd_pc stored"
          - "if verdict == FAIL: auto-create FaultRecord SUSPECTED for (test_job_id, test_series_id)"
          - "fault auto-creation increments circuit.unresolved_fault_count by 1"
      - from: EVALUATED
        to: ACCEPTED
        trigger: "POST /cable-diagnostics/test-series/{id}/accept"
        actor: NetworkPlanner
        preconditions: []
        side_effects: ["if is_retest and verdict == PASS: nothing further (splice acceptance is a separate gate)"]
      - from: EVALUATED
        to: INVALID
        trigger: "POST /cable-diagnostics/test-series/{id}/invalidate"
        actor: TestSupervisor
        preconditions: []
        side_effects: ["if is_retest: linked fault RETESTING -> REPAIRED"]

  - entity: FaultRecord
    initial_state: SUSPECTED
    terminal_states: []
    transitions:
      - from: SUSPECTED
        to: PINPOINTED
        trigger: "POST /cable-diagnostics/faults/{id}/pinpoint"
        actor: FaultCrewLead
        preconditions: []
        side_effects: ["fault_distance_corridor computed for both velocity variants; selected per use_calibrated_velocity"]
      - from: REOPENED
        to: PINPOINTED
        trigger: "POST /cable-diagnostics/faults/{id}/pinpoint"
        actor: FaultCrewLead
        preconditions: []
        side_effects: ["corridor recomputed"]
      - from: PINPOINTED
        to: EXCAVATING
        trigger: "system (linked ExcavationOrder becomes IN_PROGRESS)"
        actor: system
        preconditions: []
        side_effects: []
      - from: EXCAVATING
        to: REPAIRING
        trigger: "system (linked RepairSplice becomes SPLICING)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REPAIRING
        to: REPAIRED
        trigger: "system (splice finish-curing -> COMPLETED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REPAIRED
        to: RETESTING
        trigger: "system (a TestSeries with retest_of_fault_id == this fault is created)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RETESTING
        to: REPAIRED
        trigger: "system (retest series INVALID)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RETESTING
        to: CLOSED_VERIFIED
        trigger: "system (linked RepairSplice ACCEPTED)"
        actor: system
        preconditions: []
        side_effects:
          - "closed_at := now; circuit.unresolved_fault_count -= 1; circuit.resolved_fault_count_24m recomputed"
          - "circuit.splice_count += 1"
          - "if job gates now satisfied (all series terminal AND all faults CLOSED_VERIFIED): job IN_PROGRESS -> EVALUATION"
      - from: CLOSED_VERIFIED
        to: REOPENED
        trigger: "POST /cable-diagnostics/faults/{id}/reopen"
        actor: TestSupervisor
        preconditions: []
        side_effects: ["closed_at := null; circuit.unresolved_fault_count += 1; circuit.resolved_fault_count_24m recomputed"]
        note: "warranty failure reopens a terminal-seeming fault — cyclic loop REOPENED -> PINPOINTED -> ..."

  - entity: ExcavationOrder
    initial_state: DRAFT
    terminal_states: [BACKFILLED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PERMITTED
        trigger: "POST /cable-diagnostics/excavation-orders/{id}/permit"
        actor: FaultCrewLead
        preconditions: []
        side_effects: []
      - from: PERMITTED
        to: IN_PROGRESS
        trigger: "POST /cable-diagnostics/excavation-orders/{id}/start"
        actor: FaultCrewLead
        preconditions:
          - "dig_start <= now < dig_end (else ERR_WINDOW_NOT_ACTIVE)"
          - "the fault's job outage window status == ACTIVE (else ERR_WINDOW_NOT_ACTIVE)"
        side_effects: ["fault PINPOINTED -> EXCAVATING"]
      - from: IN_PROGRESS
        to: BACKFILLED
        trigger: "POST /cable-diagnostics/excavation-orders/{id}/backfill"
        actor: FaultCrewLead
        preconditions: ["a RepairSplice referencing this excavation exists with status in {CURING, COMPLETED} (else ERR_SPLICE_NOT_CURING)"]
        side_effects: []
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /cable-diagnostics/excavation-orders/{id}/cancel"
        actor: FaultCrewLead
        preconditions: []
        side_effects: ["job.committed_cost_cents -= cost_cents"]
      - from: PERMITTED
        to: CANCELLED
        trigger: "POST /cable-diagnostics/excavation-orders/{id}/cancel"
        actor: FaultCrewLead
        preconditions: []
        side_effects: ["job.committed_cost_cents -= cost_cents"]

  - entity: RepairSplice
    initial_state: PLANNED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: PLANNED
        to: SPLICING
        trigger: "POST /cable-diagnostics/repair-splices/{id}/start"
        actor: FaultCrewLead
        preconditions: ["fault.status == EXCAVATING (else ERR_INVALID_STATE)"]
        side_effects: ["fault EXCAVATING -> REPAIRING"]
      - from: SPLICING
        to: CURING
        trigger: "POST /cable-diagnostics/repair-splices/{id}/cure"
        actor: FaultCrewLead
        preconditions: []
        side_effects: ["cure_started_at := now"]
      - from: CURING
        to: COMPLETED
        trigger: "POST /cable-diagnostics/repair-splices/{id}/finish-curing"
        actor: FaultCrewLead
        preconditions: ["now >= cure_started_at + 24h (else ERR_CURING_INCOMPLETE); equality allowed"]
        side_effects: ["completed_at := now", "fault REPAIRING -> REPAIRED"]
      - from: COMPLETED
        to: ACCEPTED
        trigger: "POST /cable-diagnostics/repair-splices/{id}/accept"
        actor: NetworkPlanner
        preconditions:
          - "exists TestSeries with retest_of_fault_id == splice.fault_record_id, status == ACCEPTED, verdict == PASS, created_at > splice.completed_at (else ERR_RETEST_REQUIRED)"
        side_effects:
          - "fault RETESTING -> CLOSED_VERIFIED (cascades to circuit counts and possibly job EVALUATION)"
      - from: COMPLETED
        to: REJECTED
        trigger: "POST /cable-diagnostics/repair-splices/{id}/reject"
        actor: NetworkPlanner
        preconditions: []
        side_effects: ["fault (REPAIRED|RETESTING) -> REOPENED; splice cost_cents remains committed"]

  - entity: MobileUnit
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - { from: AVAILABLE, to: MAINTENANCE, trigger: "POST /cable-diagnostics/mobile-units/{id}/maintenance", actor: DispatchCoordinator, preconditions: ["no assignments in {RESERVED, CONFIRMED, ACTIVE} (else ERR_UNIT_HAS_ASSIGNMENTS)"], side_effects: [] }
      - { from: MAINTENANCE, to: AVAILABLE, trigger: "POST /cable-diagnostics/mobile-units/{id}/return-to-service", actor: DispatchCoordinator, preconditions: [], side_effects: [] }
      - { from: AVAILABLE, to: ASSIGNED, trigger: "system (an EquipmentAssignment for this unit is created)", actor: system, preconditions: [], side_effects: [] }
      - { from: ASSIGNED, to: AVAILABLE, trigger: "system (last assignment in {RESERVED, CONFIRMED, ACTIVE} becomes RELEASED or CANCELLED)", actor: system, preconditions: [], side_effects: [] }

  - entity: EquipmentAssignment
    initial_state: RESERVED
    terminal_states: [RELEASED, CANCELLED]
    transitions:
      - { from: RESERVED, to: CONFIRMED, trigger: "POST /cable-diagnostics/equipment-assignments/{id}/confirm", actor: DispatchCoordinator, preconditions: [], side_effects: [] }
      - { from: CONFIRMED, to: ACTIVE, trigger: "POST /cable-diagnostics/equipment-assignments/{id}/activate", actor: DispatchCoordinator, preconditions: ["now >= mobilize_at (else ERR_WINDOW_NOT_ACTIVE)"], side_effects: [] }
      - { from: ACTIVE, to: RELEASED, trigger: "POST /cable-diagnostics/equipment-assignments/{id}/release OR system cascade on outage-window close", actor: DispatchCoordinator, preconditions: [], side_effects: ["MobileUnit.committed_hours -= duration_hours", "if no remaining open assignments: unit ASSIGNED -> AVAILABLE"] }
      - { from: CONFIRMED, to: RELEASED, trigger: "system cascade on outage-window close only", actor: system, preconditions: [], side_effects: ["MobileUnit.committed_hours -= duration_hours", "if no remaining open assignments: unit ASSIGNED -> AVAILABLE"] }
      - { from: RESERVED, to: CANCELLED, trigger: "POST /cable-diagnostics/equipment-assignments/{id}/cancel OR system cascade on job abort", actor: DispatchCoordinator, preconditions: [], side_effects: ["MobileUnit.committed_hours -= duration_hours", "if no remaining open assignments: unit ASSIGNED -> AVAILABLE"] }
      - { from: CONFIRMED, to: CANCELLED, trigger: "POST /cable-diagnostics/equipment-assignments/{id}/cancel OR system cascade on job abort", actor: DispatchCoordinator, preconditions: [], side_effects: ["MobileUnit.committed_hours -= duration_hours", "if no remaining open assignments: unit ASSIGNED -> AVAILABLE"] }

  - entity: HealthAssessment
    initial_state: COMPUTED
    terminal_states: [SUPERSEDED]
    transitions:
      - { from: COMPUTED, to: REVIEWED, trigger: "POST /cable-diagnostics/health-assessments/{id}/review", actor: AssetEngineer, preconditions: [], side_effects: [] }
      - from: REVIEWED
        to: ADOPTED
        trigger: "POST /cable-diagnostics/health-assessments/{id}/adopt"
        actor: NetworkPlanner
        preconditions: []
        side_effects:
          - "circuit.current_health_index := health_index_score; current_health_band := band"
          - "circuit.replacement_recommended recomputed: band==CRITICAL OR (band==POOR AND unresolved_fault_count >= 2)"
      - { from: COMPUTED, to: SUPERSEDED, trigger: "system (a new HealthAssessment is created for the same circuit)", actor: system, preconditions: [], side_effects: [] }
      - { from: REVIEWED, to: SUPERSEDED, trigger: "system (a new HealthAssessment is created for the same circuit)", actor: system, preconditions: [], side_effects: [] }
      - { from: ADOPTED, to: SUPERSEDED, trigger: "system (a new HealthAssessment is created for the same circuit)", actor: system, preconditions: [], side_effects: ["circuit keeps last adopted values until next adoption"] }

# =============================================================================
# §1.2.1 Concurrency Rules (true races only; OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: health-assessment-create-stale-circuit
    parent_entity: CableCircuit
    write_endpoint: "POST /cable-diagnostics/health-assessments"
    occ_field: expected_circuit_version
    description: |
      Creating a HealthAssessment against a CableCircuit whose version has advanced
      since the client last observed it is rejected. Creation legitimately supersedes
      the circuit's current assessment, so a writer working from a stale circuit
      version must be refused with a stale-version precondition failure.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: test-job-reschedule-stale
    parent_entity: TestJob
    write_endpoint: "POST /cable-diagnostics/test-jobs/{id}/reschedule"
    occ_field: expected_test_job_version
    description: |
      Rescheduling a TestJob whose version has advanced since the client last
      observed it is rejected. A reschedule legitimately replaces the prior plan
      (new outage window), so a writer holding a stale job version must be refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table (§1.3)
# =============================================================================
calculations:
  - name: series_verdict
    trigger: "POST /cable-diagnostics/test-series/{id}/evaluate (LOGGING -> EVALUATED)"
    algorithm: threshold
    formula: |
      U0 = U0_KV[circuit.voltage_class]
      For VLF methods: steps 0,1,2 correspond to 0.5/1.0/1.5 x U0.
      Step 1: round each reading's tan_delta_e3 to 0.1 (round_half_up) BEFORE comparison.
      AS-TESTED basis uses the rounded raw values.
      CORRECTED basis: k(T) = clamp(1 + (20 - ambient_temp_c) * 0.01, 0.9, 1.1);
        td_corr = round_half_up(td_raw * k(T), 1) per reading, THEN compare.
      tan-delta part (VLF_TAN_DELTA, VLF_WITH_PD):
        FAIL if max_td >= TD_FAIL_MIN                       (boundary: >= triggers)
        else FAIL if (td[step 2] - td[step 0]) >= TIP_UP_FAIL   (boundary: >= triggers)
        else PASS if max_td < TD_PASS_MAX                   (boundary: strictly below)
        else MONITOR
      PD part (VLF_WITH_PD, PD_MAPPING):
        FAIL if max_pd >= PD_FAIL_MIN; else MONITOR if max_pd >= PD_MONITOR_MIN; else PASS
      SHEATH: n/a (method not supported).
      Basis verdict = worst part-verdict present for the method (PASS < MONITOR < FAIL).
      Official verdict = corrected basis if job.use_temperature_correction else as-tested basis.
      If official verdict == FAIL: auto-create FaultRecord (SUSPECTED).
    input_set: "All TestReadings of this series; per-method required fields validated at append time"
    constants:
      U0_KV: { KV_15: 8.7, KV_25: 14.4, KV_35: 20.3, KV_69: 39.8 }
      TD_PASS_MAX: 5.0
      TD_FAIL_MIN: 80.0
      TIP_UP_FAIL: 12.0
      PD_MONITOR_MIN: 500
      PD_FAIL_MIN: 2000
    precision: "tan-delta rounded to 0.1 (1e-3 units) round_half_up before any comparison"
    variants:
      - name: as_tested
        when: "job.use_temperature_correction == false (official verdict source)"
        difference: "uses raw rounded tan-delta; ignores ambient_temp_c"
      - name: temperature_corrected
        when: "job.use_temperature_correction == true (official verdict source)"
        difference: "applies k(T) per reading before comparison; identical raw data can flip FAIL<->MONITOR (e.g. T=35C, td 88.0 -> 79.2)"

  - name: fault_distance_corridor
    trigger: "POST /cable-diagnostics/faults/{id}/pinpoint (SUSPECTED|REOPENED -> PINPOINTED)"
    algorithm: threshold
    formula: |
      d(VF) = round_half_up(VF * VELOCITY_M_PER_US * trace_time_us / 2, 1)
      VF_standard = VF_STD[circuit.voltage_class]
      VF_calibrated = circuit.calibrated_velocity_factor if non-null else VF_standard
      selected VF = VF_calibrated if payload use_calibrated_velocity==true else VF_standard
      pinpointed_distance_m = d(selected); velocity_factor_used = selected VF
      alternate_distance_m = d(other variant)
      half_width = max(CORRIDOR_MIN_M, round_half_up(0.10 * pinpointed_distance_m, 1))
      corridor_start_m = round_half_up(pinpointed_distance_m - half_width, 1)
      corridor_end_m   = round_half_up(pinpointed_distance_m + half_width, 1)
    input_set: "single fault + its circuit constants"
    constants:
      VELOCITY_M_PER_US: 300
      VF_STD: { KV_15: 0.52, KV_25: 0.52, KV_35: 0.52, KV_69: 0.53 }
      CORRIDOR_MIN_M: 5.0
    precision: "0.1 m round_half_up; corridor bounds rounded after subtraction/addition"
    variants:
      - name: standard_velocity
        when: "use_calibrated_velocity == false"
        difference: "VF from VF_STD class table"
      - name: calibrated_velocity
        when: "use_calibrated_velocity == true AND circuit.calibrated_velocity_factor non-null"
        difference: "VF from circuit calibration; identical trace_time_us yields a different distance and corridor (e.g. t=20us on KV_15: 1560.0 m vs 1500.0 m at VF 0.50)"

  - name: outage_overrun_charge
    trigger: "OutageWindow approve (estimate variant) and close (actual variant)"
    algorithm: tiered_pricing
    formula: |
      chargeable_min = overrun_min > GRACE_MIN ? (overrun_min - GRACE_MIN) : 0
      tier minutes (marginal): T1 = min(chargeable_min, 60); T2 = min(max(chargeable_min-60,0),120); T3 = max(chargeable_min-180,0)
      mult = 1.25 if kind == EMERGENCY_FAULT else 1.0
      PINNED ROUNDING ORDER: per tier, seg_i = round_half_up(tier_min_i * RATE_i * mult, 0);
      overrun_charge_cents = seg_1 + seg_2 + seg_3   (sum AFTER per-tier rounding)
      ACTUAL variant: overrun_min = max(0, ceil((restored_at - window_end)/60s))
      ESTIMATE variant (at approve): overrun_min_est = ceil(duration_minutes * 0.10)
    input_set: "single OutageWindow"
    constants:
      GRACE_MIN: 15
      RATE_T1_CENTS_PER_MIN: 400
      RATE_T2_CENTS_PER_MIN: 650
      RATE_T3_CENTS_PER_MIN: 900
      EMERGENCY_MULT: 1.25
      ESTIMATE_OVERRUN_FRACTION: 0.10
    precision: "integer cents; per-tier round_half_up then sum (pinned)"
    variants:
      - name: estimate
        when: "window approval — provisional exposure figure"
        difference: "overrun estimated as 10% of planned duration; same formula, different input, different result vs actual close"
      - name: actual
        when: "window close"
        difference: "overrun from recorded restored_at"

  - name: health_index_score
    trigger: "POST /cable-diagnostics/health-assessments (basis selects input set)"
    algorithm: weighted_scoring
    formula: |
      Series input set (circuit's jobs' series):
        FORMAL:      status == ACCEPTED
        PROVISIONAL: status in {EVALUATED, ACCEPTED}
      td_metric  = max over included series of max_tan_delta_e3 (series with null excluded)
      pd_metric  = max over included series of max_pd_pc        (series with null excluded)
      td_pen:  metric < 5 -> 0 | [5,20) -> 20 | [20,80) -> 60 | >= 80 -> 100 ; empty set -> 0
      pd_pen:  metric < 100 -> 0 | [100,500) -> 25 | [500,2000) -> 55 | >= 2000 -> 100 ; empty set -> 0
      fault_pen = min(100, 25 * circuit.unresolved_fault_count + 10 * circuit.resolved_fault_count_24m)
      age_years = year(now) - circuit.installation_year
      age_pen = min(100, max(0, (age_years - 25) * 5))
      PINNED ORDER: penalty = round_half_up(0.35*td_pen + 0.30*pd_pen + 0.20*fault_pen + 0.15*age_pen, 1)
      (sum at full precision FIRST, then round once — per-component rounding is NOT applied)
      health_index_score = round_half_up(100 - penalty, 1)
      band: score >= 80 -> GOOD | [60,80) -> FAIR | [40,60) -> POOR | < 40 -> CRITICAL
      recommended_action: GOOD->NONE | FAIR->MONITOR | POOR->PLAN_REPLACEMENT | CRITICAL->URGENT_REPLACEMENT
    input_set: "series of all jobs on the circuit filtered by basis; circuit fault counters; installation_year"
    constants:
      W_TD: 0.35
      W_PD: 0.30
      W_FAULT: 0.20
      W_AGE: 0.15
    precision: "0.1 round_half_up; single final rounding of penalty sum"
    variants:
      - name: formal
        when: "basis == FORMAL"
        difference: "ACCEPTED series only; unconfirmed EVALUATED series excluded"
      - name: provisional
        when: "basis == PROVISIONAL"
        difference: "includes EVALUATED series; identical raw data can yield a lower score (e.g. 96.2 formal vs 75.2 provisional when a 50.0 tan-delta EVALUATED series exists)"

  - name: job_estimate_cents
    trigger: "POST /cable-diagnostics/test-jobs/{id}/plan"
    algorithm: tiered_pricing
    formula: |
      subtotal = CALLOUT_CENTS + round_half_up(PER_METER_CENTS * circuit.length_m, 0) + sum(METHOD_FEE[m] for m in requested_methods)
      PINNED EVALUATION ORDER (circular-looking dependency resolved):
        1. compute subtotal (NO surcharge included)
        2. tier := COMPLEX if subtotal > COMPLEX_THRESHOLD_CENTS else STANDARD   (strict >)
        3. rate := 0.12 if COMPLEX else 0.06
        4. estimate_cents := round_half_up(subtotal * (1 + rate), 0)
      The surcharge tier is keyed on the PRE-surcharge subtotal only.
    input_set: "single TestJob + its circuit"
    constants:
      CALLOUT_CENTS: 180000
      PER_METER_CENTS: 125
      METHOD_FEE: { VLF_TAN_DELTA: 95000, VLF_WITH_PD: 145000, PD_MAPPING: 120000 }
      COMPLEX_THRESHOLD_CENTS: 400000
      RATE_COMPLEX: 0.12
      RATE_STANDARD: 0.06
    precision: "integer cents round_half_up"

  - name: job_invoice_cents
    trigger: "GET /cable-diagnostics/test-jobs/{id}/invoice (computed on read)"
    algorithm: aggregation
    formula: |
      billable excavation line = round_half_up(excavation.cost_cents * (1 + MARKUP), 0)   per non-CANCELLED excavation
      billable splice line     = round_half_up(splice.cost_cents * (1 + MARKUP), 0)        per splice of any status
      PINNED ROUNDING ORDER: markup applied and rounded PER LINE, then summed.
      invoice_total_cents = estimate_cents + Σ excavation lines + Σ splice lines
      (Sum-then-markup yields different cents, e.g. 325586 vs 325587 on lines 100040/200040.)
    input_set: "job estimate + non-CANCELLED ExcavationOrders + all RepairSplices of the job's faults"
    constants:
      MARKUP: 0.085
    precision: "integer cents round_half_up per line"

  - name: unit_committed_hours
    trigger: "EquipmentAssignment create / release / cancel (and cascades)"
    algorithm: aggregation
    formula: |
      duration_hours(a) = round_half_up((a.demobilize_at - a.mobilize_at)/3600s, 1)
      committed_hours(unit) = round_half_up(Σ duration_hours over assignments in {RESERVED, CONFIRMED, ACTIVE}, 1)
      create adds; release/cancel subtracts the SAME stored duration_hours (no drift).
    input_set: "assignments of one MobileUnit filtered by status"
    constants: {}
    precision: "0.1 h round_half_up"

# =============================================================================
# Table 4: Validation Rules Table (§1.4, ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; role is a declared role name", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: authorization, check: "X-User-Role is listed in the endpoint's roles", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: request, check: "required body fields present; enum members valid; numeric ranges respected (length_m>0, ground_count>=1, window_end>window_start, dig_end>dig_start, demobilize_at>mobilize_at, installation_year 1950..2026, calibrated_velocity_factor null or 0.45..0.60, trace_time_us>0, applied_voltage_kv>0, cost_cents>0); method-conditional reading fields (tan_delta_e3 required for VLF methods and forbidden for PD_MAPPING; pd_level_pc required for VLF_WITH_PD/PD_MAPPING and forbidden for VLF_TAN_DELTA); retest_of_fault_id required iff is_retest=true", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all POST/PATCH endpoints" }
  - { priority: 4, category: existence, check: "path ids and body FK references exist (validated left-to-right: path segments first, then body FKs in declared input order)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all endpoints with ids" }
  - { priority: 5, category: concurrency, check: "expected_circuit_version / expected_test_job_version equals the parent's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /cable-diagnostics/health-assessments; POST /cable-diagnostics/test-jobs/{id}/reschedule" }
  - { priority: 6, category: state, check: "target entity is in an allowed from-state for the requested transition (incl. circuit IN_SERVICE for approve; window APPROVED for job create/reschedule; job PLANNED/IN_PROGRESS for permit create; circuit-busy: no non-terminal job on circuit at job create; retest series create requires linked fault status REPAIRED; fault must be in {PINPOINTED, EXCAVATING, REPAIRING} at excavation create; excavation must be IN_PROGRESS at splice create; fault EXCAVATING at splice start)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints and state-gated creates" }
  - { priority: 7, category: business_safety, check: "two-person rules: grounding verifier != permit issuer; permit releaser != grounding verifier", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 422, applies_to: "POST /cable-diagnostics/isolation-permits/{id}/verify-grounding; POST /cable-diagnostics/isolation-permits/{id}/release" }
  - { priority: 8, category: business_safety, check: "job's IsolationPermit is GROUNDING_VERIFIED before any series energizes", error_id: ERR_GROUNDING_NOT_VERIFIED, http_status: 409, applies_to: "POST /cable-diagnostics/test-series/{id}/energize" }
  - { priority: 9, category: business_safety, check: "job's IsolationPermit is RELEASED before job completion", error_id: ERR_PERMIT_NOT_RELEASED, http_status: 409, applies_to: "POST /cable-diagnostics/test-jobs/{id}/complete" }
  - { priority: 10, category: business_temporal, check: "window_start >= now (no past windows)", error_id: ERR_WINDOW_IN_PAST, http_status: 409, applies_to: "POST /cable-diagnostics/outage-windows" }
  - { priority: 11, category: business_temporal, check: "half-open overlap: new window [start,end) conflicts with any window of same circuit in {REQUESTED,APPROVED,ACTIVE}; adjacency (start == other end) is allowed", error_id: ERR_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /cable-diagnostics/outage-windows" }
  - { priority: 12, category: business_temporal, check: "logical clock inside interval: window activate requires start <= now < end; job start/resume require window ACTIVE; excavation start requires dig_start <= now < dig_end AND job window ACTIVE; assignment activate requires now >= mobilize_at", error_id: ERR_WINDOW_NOT_ACTIVE, http_status: 409, applies_to: "activate/start/resume endpoints" }
  - { priority: 13, category: business_temporal, check: "dig window containment: dig_start >= window_start AND dig_end <= window_end of the fault's job window (inclusive both edges)", error_id: ERR_DIG_OUTSIDE_OUTAGE, http_status: 409, applies_to: "POST /cable-diagnostics/excavation-orders" }
  - { priority: 14, category: business_temporal, check: "now >= cure_started_at + 24h (equality allowed)", error_id: ERR_CURING_INCOMPLETE, http_status: 409, applies_to: "POST /cable-diagnostics/repair-splices/{id}/finish-curing" }
  - { priority: 15, category: business_constraint, check: "excavation target_location_m within [corridor_start_m, corridor_end_m] inclusive of the fault", error_id: ERR_CORRIDOR_VIOLATION, http_status: 409, applies_to: "POST /cable-diagnostics/excavation-orders" }
  - { priority: 16, category: business_constraint, check: "dig windows of non-CANCELLED excavations of the same fault must not overlap (half-open on dig interval)", error_id: ERR_DIG_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /cable-diagnostics/excavation-orders" }
  - { priority: 17, category: business_constraint, check: "equipment buffer: for the same MobileUnit, new assignment conflicts with any non-terminal assignment unless gap >= 4h in both directions (mobilize_new >= demobilize_existing + 4h OR mobilize_existing >= demobilize_new + 4h); exactly 4h is allowed", error_id: ERR_UNIT_OVERLAP_BUFFER, http_status: 409, applies_to: "POST /cable-diagnostics/equipment-assignments" }
  - { priority: 18, category: business_constraint, check: "unit capabilities cover every method-implied capability of the job (VLF_TAN_DELTA->VLF, VLF_WITH_PD->{VLF,PD}, PD_MAPPING->PD) AND unit.max_test_voltage_kv >= 1.5*U0(class); unit not MAINTENANCE (ERR_INVALID_STATE); job in {PLANNED, IN_PROGRESS}", error_id: ERR_UNIT_CAPABILITY_MISMATCH, http_status: 409, applies_to: "POST /cable-diagnostics/equipment-assignments" }
  - { priority: 19, category: business_constraint, check: "unit has no open assignments when entering maintenance", error_id: ERR_UNIT_HAS_ASSIGNMENTS, http_status: 409, applies_to: "POST /cable-diagnostics/mobile-units/{id}/maintenance" }
  - { priority: 20, category: business_constraint, check: "method must be a member of job.requested_methods", error_id: ERR_METHOD_NOT_REQUESTED, http_status: 409, applies_to: "POST /cable-diagnostics/test-series" }
  - { priority: 21, category: business_constraint, check: "test_voltage_kv within ±5% inclusive of 1.5*U0(circuit.voltage_class) for VLF methods", error_id: ERR_VOLTAGE_MISMATCH, http_status: 422, applies_to: "POST /cable-diagnostics/test-series" }
  - { priority: 22, category: business_constraint, check: "at least one reading exists at evaluate", error_id: ERR_NO_READINGS, http_status: 409, applies_to: "POST /cable-diagnostics/test-series/{id}/evaluate" }
  - { priority: 23, category: business_constraint, check: "every step 0..step_count-1 has a reading at evaluate", error_id: ERR_STEP_INCOMPLETE, http_status: 409, applies_to: "POST /cable-diagnostics/test-series/{id}/evaluate" }
  - { priority: 24, category: business_constraint, check: "step_index < step_count", error_id: ERR_STEP_OUT_OF_RANGE, http_status: 422, applies_to: "POST /cable-diagnostics/test-series/{id}/readings" }
  - { priority: 25, category: business_constraint, check: "(test_series_id, step_index) unique", error_id: ERR_DUPLICATE_STEP, http_status: 409, applies_to: "POST /cable-diagnostics/test-series/{id}/readings" }
  - { priority: 26, category: business_constraint, check: "manual fault creation requires series verdict == MONITOR (FAIL auto-creates; PASS cannot raise a fault)", error_id: ERR_VERDICT_NOT_FAIL, http_status: 409, applies_to: "POST /cable-diagnostics/faults" }
  - { priority: 27, category: business_constraint, check: "no FaultRecord exists for this test_series_id", error_id: ERR_FAULT_ALREADY_RECORDED, http_status: 409, applies_to: "POST /cable-diagnostics/faults" }
  - { priority: 28, category: business_constraint, check: "no non-RELEASED IsolationPermit exists for the job", error_id: ERR_PERMIT_EXISTS, http_status: 409, applies_to: "POST /cable-diagnostics/isolation-permits" }
  - { priority: 29, category: business_constraint, check: "no RepairSplice in {PLANNED,SPLICING,CURING,COMPLETED} exists for the fault", error_id: ERR_SPLICE_EXISTS, http_status: 409, applies_to: "POST /cable-diagnostics/repair-splices; POST /cable-diagnostics/test-jobs; POST /cable-diagnostics/test-jobs/{id}/reschedule" }
  - { priority: 30, category: business_constraint, check: "no non-CANCELLED ExcavationOrder exists for the fault", error_id: ERR_EXCAVATION_EXISTS, http_status: 409, applies_to: "POST /cable-diagnostics/excavation-orders" }
  - { priority: 31, category: business_constraint, check: "no non-terminal TestJob exists for the circuit", error_id: ERR_CIRCUIT_BUSY, http_status: 409, applies_to: "POST /cable-diagnostics/test-jobs" }
  - { priority: 32, category: business_constraint, check: "a qualifying assignment exists for energize (status in {CONFIRMED,ACTIVE}, mobilize_at <= now <= demobilize_at)", error_id: ERR_NO_EQUIPMENT_ON_SITE, http_status: 409, applies_to: "POST /cable-diagnostics/test-series/{id}/energize" }
  - { priority: 33, category: business_constraint, check: "circuit_ref unique across circuits", error_id: ERR_DUPLICATE_CIRCUIT_REF, http_status: 409, applies_to: "POST /cable-diagnostics/circuits" }
  - { priority: 34, category: business_referential, check: "excavation_order.fault_record_id == splice.fault_record_id; outage window circuit_id == body circuit_id at job create and reschedule", error_id: ERR_CROSS_REFERENCE_MISMATCH, http_status: 422, applies_to: "POST /cable-diagnostics/repair-splices; POST /cable-diagnostics/test-jobs; POST /cable-diagnostics/test-jobs/{id}/reschedule" }
  - { priority: 35, category: business_referential, check: "a RepairSplice referencing this excavation exists with status in {CURING, COMPLETED}", error_id: ERR_SPLICE_NOT_CURING, http_status: 409, applies_to: "POST /cable-diagnostics/excavation-orders/{id}/backfill" }
  - { priority: 36, category: business_referential, check: "qualifying retest exists: TestSeries with retest_of_fault_id == fault, status ACCEPTED, verdict PASS, created_at > splice.completed_at", error_id: ERR_RETEST_REQUIRED, http_status: 409, applies_to: "POST /cable-diagnostics/repair-splices/{id}/accept" }
  - { priority: 37, category: business_fiscal, check: "estimate_cents <= approved_budget_cents at plan; estimate_cents + committed_cost_cents + new cost <= approved_budget_cents at excavation/splice create", error_id: ERR_BUDGET_EXCEEDED, http_status: 422, applies_to: "POST /cable-diagnostics/test-jobs/{id}/plan; POST /cable-diagnostics/excavation-orders; POST /cable-diagnostics/repair-splices" }

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table (§1.5)
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - { method: POST, path: "/cable-diagnostics/_clock/set_current_utc", description: "Set the logical clock. Startup default is exactly 2026-08-01T00:00:00Z; the clock NEVER falls back to wall-clock time.", roles: [SystemAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: datetime }", side_effects: [] }

  # --- CableCircuit ---
  - { method: POST, path: "/cable-diagnostics/circuits", description: "Register a cable circuit", roles: [SystemAdmin], code: 201, input: [circuit_ref, voltage_class, length_m, installation_year, "calibrated_velocity_factor?"], output: CableCircuit, side_effects: ["status=IN_SERVICE; all counters 0"] }
  - { method: GET, path: "/cable-diagnostics/circuits/{id}", description: "Get a circuit", roles: [SystemAdmin, NetworkPlanner, TestSupervisor, FieldTechnician, SafetyOfficer, FaultCrewLead, DispatchCoordinator, AssetEngineer], code: 200, input: [], output: CableCircuit, side_effects: [] }
  - { method: GET, path: "/cable-diagnostics/circuits", description: "List circuits with filters + pagination", roles: [SystemAdmin, NetworkPlanner, TestSupervisor, FieldTechnician, SafetyOfficer, FaultCrewLead, DispatchCoordinator, AssetEngineer], code: 200, input: ["status?", "voltage_class?", "replacement_recommended?", "limit?", "offset?"], output: "CableCircuit[]", side_effects: [] }
  - { method: GET, path: "/cable-diagnostics/circuits/{id}/outage-windows", description: "Windows of a circuit", roles: [SystemAdmin, NetworkPlanner, TestSupervisor, FieldTechnician, SafetyOfficer, FaultCrewLead, DispatchCoordinator, AssetEngineer], code: 200, input: [], output: "OutageWindow[]", side_effects: [] }
  - { method: GET, path: "/cable-diagnostics/circuits/{id}/test-jobs", description: "Jobs of a circuit", roles: [SystemAdmin, NetworkPlanner, TestSupervisor, FieldTechnician, SafetyOfficer, FaultCrewLead, DispatchCoordinator, AssetEngineer], code: 200, input: [], output: "TestJob[]", side_effects: [] }
  - { method: GET, path: "/cable-diagnostics/circuits/{id}/health-assessments", description: "Assessments of a circuit (all statuses incl. SUPERSEDED)", roles: [SystemAdmin, NetworkPlanner, TestSupervisor, FieldTechnician, SafetyOfficer, FaultCrewLead, DispatchCoordinator, AssetEngineer], code: 200, input: [], output: "HealthAssessment[]", side_effects: [] }
  - { method: GET, path: "/cable-diagnostics/circuits/{id}/trend", description: "Replacement-planning trend: adopted assessments oldest->newest plus current recommendation", roles: [NetworkPlanner, AssetEngineer], code: 200, input: [], output: "{ circuit_id: string, points: array, replacement_recommended: boolean }", side_effects: [] }

  # --- OutageWindow ---
  - { method: POST, path: "/cable-diagnostics/outage-windows", description: "Request an outage window (half-open interval; overlap + past-start validated)", roles: [NetworkPlanner], code: 201, input: [circuit_id, kind, window_start, window_end], output: OutageWindow, side_effects: ["status=REQUESTED; duration_minutes computed"] }
  - { method: GET, path: "/cable-diagnostics/outage-windows/{id}", description: "Get a window", roles: [SystemAdmin, NetworkPlanner, TestSupervisor, FieldTechnician, SafetyOfficer, FaultCrewLead, DispatchCoordinator, AssetEngineer], code: 200, input: [], output: OutageWindow, side_effects: [] }
  - { method: GET, path: "/cable-diagnostics/outage-windows", description: "List windows", roles: [SystemAdmin, NetworkPlanner, TestSupervisor, FieldTechnician, SafetyOfficer, FaultCrewLead, DispatchCoordinator, AssetEngineer], code: 200, input: ["circuit_id?", "status?", "limit?", "offset?"], output: "OutageWindow[]", side_effects: [] }
  - { method: GET, path: "/cable-diagnostics/outage-windows/{id}/test-jobs", description: "Jobs referencing a window", roles: [SystemAdmin, NetworkPlanner, TestSupervisor, FieldTechnician, SafetyOfficer, FaultCrewLead, DispatchCoordinator, AssetEngineer], code: 200, input: [], output: "TestJob[]", side_effects: [] }
  - { method: POST, path: "/cable-diagnostics/outage-windows/{id}/approve", description: "Approve a requested window", roles: [NetworkPlanner], code: 200, input: [], output: OutageWindow, side_effects: ["status APPROVED; circuit minutes += duration; estimate charge; circuit -> OUTAGE_PENDING"] }
  - { method: POST, path: "/cable-diagnostics/outage-windows/{id}/activate", description: "Activate an approved window (clock must be inside)", roles: [NetworkPlanner], code: 200, input: [], output: OutageWindow, side_effects: ["status ACTIVE"] }
  - { method: POST, path: "/cable-diagnostics/outage-windows/{id}/close", description: "Close an active window with restoration timestamp; computes overrun and fires restore cascade", roles: [NetworkPlanner], code: 200, input: [restored_at], output: OutageWindow, side_effects: ["status CLOSED; overrun computed; circuit RESTORING -> IN_SERVICE; open assignments RELEASED; units freed"] }
  - { method: POST, path: "/cable-diagnostics/outage-windows/{id}/cancel", description: "Cancel a REQUESTED or APPROVED window", roles: [NetworkPlanner], code: 200, input: [], output: OutageWindow, side_effects: ["status CANCELLED; minutes rollback when APPROVED; circuit may return to IN_SERVICE"] }

  # --- TestJob ---
  - { method: POST, path: "/cable-diagnostics/test-jobs", description: "Create a diagnostics job on an APPROVED window", roles: [NetworkPlanner], code: 201, input: [circuit_id, outage_window_id, requested_methods, approved_budget_cents, "use_temperature_correction?"], output: TestJob, side_effects: ["status=DRAFT"] }
  - { method: GET, path: "/cable-diagnostics/test-jobs/{id}", description: "Get a job", roles: [SystemAdmin, NetworkPlanner, TestSupervisor, FieldTechnician, SafetyOfficer, FaultCrewLead, DispatchCoordinator, AssetEngineer], code: 200, input: [], output: TestJob, side_effects: [] }
  - { method: GET, path: "/cable-diagnostics/test-jobs", description: "List jobs", roles: [SystemAdmin, NetworkPlanner, TestSupervisor, FieldTechnician, SafetyOfficer, FaultCrewLead, DispatchCoordinator, AssetEngineer], code: 200, input: ["circuit_id?", "outage_window_id?", "status?", "limit?", "offset?"], output: "TestJob[]", side_effects: [] }
  - { method: POST, path: "/cable-diagnostics/test-jobs/{id}/plan", description: "Plan a draft job: computes estimate and enforces budget cap", roles: [NetworkPlanner], code: 200, input: [], output: TestJob, side_effects: ["estimate_cents stored; status PLANNED"] }
  - { method: POST, path: "/cable-diagnostics/test-jobs/{id}/reschedule", description: "Move a PLANNED job to another APPROVED window of the same circuit (OCC-guarded supersede)", roles: [NetworkPlanner], code: 200, input: [outage_window_id, expected_test_job_version], output: TestJob, side_effects: ["outage_window_id replaced; increments TestJob.version by 1"] }
  - { method: POST, path: "/cable-diagnostics/test-jobs/{id}/start", description: "Start fieldwork (window must be ACTIVE)", roles: [TestSupervisor], code: 200, input: [], output: TestJob, side_effects: ["status IN_PROGRESS"] }
  - { method: POST, path: "/cable-diagnostics/test-jobs/{id}/suspend", description: "Suspend an in-progress job", roles: [TestSupervisor], code: 200, input: [], output: TestJob, side_effects: ["status SUSPENDED"] }
  - { method: POST, path: "/cable-diagnostics/test-jobs/{id}/resume", description: "Resume a suspended job (window must still be ACTIVE)", roles: [TestSupervisor], code: 200, input: [], output: TestJob, side_effects: ["status IN_PROGRESS"] }
  - { method: POST, path: "/cable-diagnostics/test-jobs/{id}/complete", description: "Complete a job in EVALUATION (permit must be RELEASED)", roles: [TestSupervisor], code: 200, input: [], output: TestJob, side_effects: ["status COMPLETED"] }
  - { method: POST, path: "/cable-diagnostics/test-jobs/{id}/abort", description: "Abort a DRAFT or PLANNED job; cancels open assignments", roles: [NetworkPlanner, TestSupervisor], code: 200, input: [], output: TestJob, side_effects: ["status ABORTED; open assignments CANCELLED"] }
  - { method: GET, path: "/cable-diagnostics/test-jobs/{id}/invoice", description: "Computed invoice: estimate + per-line marked-up excavation/splice costs", roles: [NetworkPlanner, AssetEngineer], code: 200, input: [], output: "{ estimate_cents: integer, excavation_total_cents: integer, splice_total_cents: integer, invoice_total_cents: integer }", side_effects: [] }
  - { method: GET, path: "/cable-diagnostics/test-jobs/{id}/isolation-permits", description: "Permits of a job", roles: [SystemAdmin, NetworkPlanner, TestSupervisor, FieldTechnician, SafetyOfficer, FaultCrewLead, DispatchCoordinator, AssetEngineer], code: 200, input: [], output: "IsolationPermit[]", side_effects: [] }
  - { method: GET, path: "/cable-diagnostics/test-jobs/{id}/test-series", description: "Series of a job", roles: [SystemAdmin, NetworkPlanner, TestSupervisor, FieldTechnician, SafetyOfficer, FaultCrewLead, DispatchCoordinator, AssetEngineer], code: 200, input: [], output: "TestSeries[]", side_effects: [] }
  - { method: GET, path: "/cable-diagnostics/test-jobs/{id}/faults", description: "Faults of a job", roles: [SystemAdmin, NetworkPlanner, TestSupervisor, FieldTechnician, SafetyOfficer, FaultCrewLead, DispatchCoordinator, AssetEngineer], code: 200, input: [], output: "FaultRecord[]", side_effects: [] }
  - { method: GET, path: "/cable-diagnostics/test-jobs/{id}/equipment-assignments", description: "Assignments of a job", roles: [SystemAdmin, NetworkPlanner, TestSupervisor, FieldTechnician, SafetyOfficer, FaultCrewLead, DispatchCoordinator, AssetEngineer], code: 200, input: [], output: "EquipmentAssignment[]", side_effects: [] }

  # --- IsolationPermit ---
  - { method: POST, path: "/cable-diagnostics/isolation-permits", description: "Draft an isolation/grounding permit for a PLANNED or IN_PROGRESS job", roles: [SafetyOfficer], code: 201, input: [test_job_id, isolation_points, ground_count], output: IsolationPermit, side_effects: ["status=DRAFT"] }
  - { method: GET, path: "/cable-diagnostics/isolation-permits/{id}", description: "Get a permit", roles: [SystemAdmin, NetworkPlanner, TestSupervisor, FieldTechnician, SafetyOfficer, FaultCrewLead, DispatchCoordinator, AssetEngineer], code: 200, input: [], output: IsolationPermit, side_effects: [] }
  - { method: GET, path: "/cable-diagnostics/isolation-permits", description: "List permits", roles: [SystemAdmin, NetworkPlanner, TestSupervisor, FieldTechnician, SafetyOfficer, FaultCrewLead, DispatchCoordinator, AssetEngineer], code: 200, input: ["test_job_id?", "status?", "limit?", "offset?"], output: "IsolationPermit[]", side_effects: [] }
  - { method: POST, path: "/cable-diagnostics/isolation-permits/{id}/issue", description: "Issue the permit (records issuer)", roles: [SafetyOfficer], code: 200, input: [], output: IsolationPermit, side_effects: ["status ISSUED; circuit -> DE_ENERGIZED"] }
  - { method: POST, path: "/cable-diagnostics/isolation-permits/{id}/verify-grounding", description: "Independent grounding verification (verifier != issuer)", roles: [SafetyOfficer], code: 200, input: [], output: IsolationPermit, side_effects: ["status GROUNDING_VERIFIED; circuit -> GROUNDED"] }
  - { method: POST, path: "/cable-diagnostics/isolation-permits/{id}/release", description: "Release the permit after job EVALUATION (releaser != verifier)", roles: [SafetyOfficer], code: 200, input: [], output: IsolationPermit, side_effects: ["status RELEASED; circuit -> RESTORING"] }

  # --- TestSeries / TestReading ---
  - { method: POST, path: "/cable-diagnostics/test-series", description: "Create a test series on an IN_PROGRESS job (voltage tolerance + retest gating)", roles: [TestSupervisor], code: 201, input: [test_job_id, method, test_voltage_kv, "is_retest?", "retest_of_fault_id?"], output: TestSeries, side_effects: ["status=SETUP; step_count derived; retest links move fault REPAIRED -> RETESTING"] }
  - { method: GET, path: "/cable-diagnostics/test-series/{id}", description: "Get a series", roles: [SystemAdmin, NetworkPlanner, TestSupervisor, FieldTechnician, SafetyOfficer, FaultCrewLead, DispatchCoordinator, AssetEngineer], code: 200, input: [], output: TestSeries, side_effects: [] }
  - { method: GET, path: "/cable-diagnostics/test-series", description: "List series", roles: [SystemAdmin, NetworkPlanner, TestSupervisor, FieldTechnician, SafetyOfficer, FaultCrewLead, DispatchCoordinator, AssetEngineer], code: 200, input: ["test_job_id?", "status?", "method?", "limit?", "offset?"], output: "TestSeries[]", side_effects: [] }
  - { method: POST, path: "/cable-diagnostics/test-series/{id}/energize", description: "Energize a SETUP series (grounding + equipment gates)", roles: [TestSupervisor], code: 200, input: [], output: TestSeries, side_effects: ["status ENERGIZING; circuit -> UNDER_TEST"] }
  - { method: POST, path: "/cable-diagnostics/test-series/{id}/readings", description: "Append one reading (per-step unique; method-conditional fields)", roles: [FieldTechnician], code: 201, input: [step_index, applied_voltage_kv, ambient_temp_c, "tan_delta_e3?", "pd_level_pc?", "pd_location_m?"], output: TestReading, side_effects: ["first reading: series ENERGIZING -> LOGGING"] }
  - { method: GET, path: "/cable-diagnostics/test-series/{id}/readings", description: "Readings of a series (append-only log)", roles: [SystemAdmin, NetworkPlanner, TestSupervisor, FieldTechnician, SafetyOfficer, FaultCrewLead, DispatchCoordinator, AssetEngineer], code: 200, input: [], output: "TestReading[]", side_effects: [] }
  - { method: GET, path: "/cable-diagnostics/test-series/{id}/faults", description: "Fault raised from a series (0 or 1)", roles: [SystemAdmin, NetworkPlanner, TestSupervisor, FieldTechnician, SafetyOfficer, FaultCrewLead, DispatchCoordinator, AssetEngineer], code: 200, input: [], output: "FaultRecord[]", side_effects: [] }
  - { method: POST, path: "/cable-diagnostics/test-series/{id}/evaluate", description: "Evaluate a LOGGING series: computes both verdict bases; FAIL auto-creates a fault", roles: [TestSupervisor], code: 200, input: [], output: TestSeries, side_effects: ["status EVALUATED; verdicts computed; fault auto-created on FAIL"] }
  - { method: POST, path: "/cable-diagnostics/test-series/{id}/accept", description: "Customer acceptance of an EVALUATED series", roles: [NetworkPlanner], code: 200, input: [], output: TestSeries, side_effects: ["status ACCEPTED"] }
  - { method: POST, path: "/cable-diagnostics/test-series/{id}/invalidate", description: "Invalidate an EVALUATED series", roles: [TestSupervisor], code: 200, input: [reason], output: TestSeries, side_effects: ["status INVALID; retest-linked fault RETESTING -> REPAIRED"] }

  # --- FaultRecord ---
  - { method: POST, path: "/cable-diagnostics/faults", description: "Manually raise a fault from a MONITOR-verdict series (engineering judgement)", roles: [TestSupervisor], code: 201, input: [test_series_id], output: FaultRecord, side_effects: ["status=SUSPECTED; circuit.unresolved_fault_count += 1"] }
  - { method: GET, path: "/cable-diagnostics/faults/{id}", description: "Get a fault", roles: [SystemAdmin, NetworkPlanner, TestSupervisor, FieldTechnician, SafetyOfficer, FaultCrewLead, DispatchCoordinator, AssetEngineer], code: 200, input: [], output: FaultRecord, side_effects: [] }
  - { method: GET, path: "/cable-diagnostics/faults", description: "List faults", roles: [SystemAdmin, NetworkPlanner, TestSupervisor, FieldTechnician, SafetyOfficer, FaultCrewLead, DispatchCoordinator, AssetEngineer], code: 200, input: ["test_job_id?", "test_series_id?", "status?", "limit?", "offset?"], output: "FaultRecord[]", side_effects: [] }
  - { method: POST, path: "/cable-diagnostics/faults/{id}/pinpoint", description: "Pinpoint a SUSPECTED or REOPENED fault from a TDR trace; computes both distance variants + corridor", roles: [FaultCrewLead], code: 200, input: [trace_time_us, pinpoint_method, "use_calibrated_velocity?"], output: FaultRecord, side_effects: ["status PINPOINTED; distance + corridor computed"] }
  - { method: POST, path: "/cable-diagnostics/faults/{id}/reopen", description: "Reopen a CLOSED_VERIFIED fault (warranty failure)", roles: [TestSupervisor], code: 200, input: [], output: FaultRecord, side_effects: ["status REOPENED; unresolved += 1; resolved_24m recomputed; closed_at cleared"] }
  - { method: GET, path: "/cable-diagnostics/faults/{id}/test-series", description: "Re-test series linked to a fault", roles: [SystemAdmin, NetworkPlanner, TestSupervisor, FieldTechnician, SafetyOfficer, FaultCrewLead, DispatchCoordinator, AssetEngineer], code: 200, input: [], output: "TestSeries[]", side_effects: [] }
  - { method: GET, path: "/cable-diagnostics/faults/{id}/excavation-orders", description: "Excavations of a fault", roles: [SystemAdmin, NetworkPlanner, TestSupervisor, FieldTechnician, SafetyOfficer, FaultCrewLead, DispatchCoordinator, AssetEngineer], code: 200, input: [], output: "ExcavationOrder[]", side_effects: [] }
  - { method: GET, path: "/cable-diagnostics/faults/{id}/repair-splices", description: "Splices of a fault", roles: [SystemAdmin, NetworkPlanner, TestSupervisor, FieldTechnician, SafetyOfficer, FaultCrewLead, DispatchCoordinator, AssetEngineer], code: 200, input: [], output: "RepairSplice[]", side_effects: [] }

  # --- ExcavationOrder ---
  - { method: POST, path: "/cable-diagnostics/excavation-orders", description: "Create an excavation for a PINPOINTED fault (corridor + outage containment + dig overlap + budget)", roles: [FaultCrewLead], code: 201, input: [fault_record_id, target_location_m, dig_start, dig_end, permit_ref, cost_cents], output: ExcavationOrder, side_effects: ["status=DRAFT; job.committed_cost_cents += cost_cents"] }
  - { method: GET, path: "/cable-diagnostics/excavation-orders/{id}", description: "Get an excavation", roles: [SystemAdmin, NetworkPlanner, TestSupervisor, FieldTechnician, SafetyOfficer, FaultCrewLead, DispatchCoordinator, AssetEngineer], code: 200, input: [], output: ExcavationOrder, side_effects: [] }
  - { method: GET, path: "/cable-diagnostics/excavation-orders", description: "List excavations", roles: [SystemAdmin, NetworkPlanner, TestSupervisor, FieldTechnician, SafetyOfficer, FaultCrewLead, DispatchCoordinator, AssetEngineer], code: 200, input: ["fault_record_id?", "status?", "limit?", "offset?"], output: "ExcavationOrder[]", side_effects: [] }
  - { method: GET, path: "/cable-diagnostics/excavation-orders/{id}/repair-splices", description: "Splices referencing an excavation", roles: [SystemAdmin, NetworkPlanner, TestSupervisor, FieldTechnician, SafetyOfficer, FaultCrewLead, DispatchCoordinator, AssetEngineer], code: 200, input: [], output: "RepairSplice[]", side_effects: [] }
  - { method: POST, path: "/cable-diagnostics/excavation-orders/{id}/permit", description: "Mark municipal permit granted", roles: [FaultCrewLead], code: 200, input: [], output: ExcavationOrder, side_effects: ["status PERMITTED"] }
  - { method: POST, path: "/cable-diagnostics/excavation-orders/{id}/start", description: "Start digging (clock inside dig window; job window ACTIVE)", roles: [FaultCrewLead], code: 200, input: [], output: ExcavationOrder, side_effects: ["status IN_PROGRESS; fault PINPOINTED -> EXCAVATING"] }
  - { method: POST, path: "/cable-diagnostics/excavation-orders/{id}/backfill", description: "Backfill (requires splice CURING or COMPLETED)", roles: [FaultCrewLead], code: 200, input: [], output: ExcavationOrder, side_effects: ["status BACKFILLED"] }
  - { method: POST, path: "/cable-diagnostics/excavation-orders/{id}/cancel", description: "Cancel a DRAFT or PERMITTED excavation (cost decommitted)", roles: [FaultCrewLead], code: 200, input: [], output: ExcavationOrder, side_effects: ["status CANCELLED; job.committed_cost_cents -= cost_cents"] }

  # --- RepairSplice ---
  - { method: POST, path: "/cable-diagnostics/repair-splices", description: "Create a splice on an IN_PROGRESS excavation (cross-reference + budget gates)", roles: [FaultCrewLead], code: 201, input: [fault_record_id, excavation_order_id, splice_type, cost_cents], output: RepairSplice, side_effects: ["status=PLANNED; job.committed_cost_cents += cost_cents"] }
  - { method: GET, path: "/cable-diagnostics/repair-splices/{id}", description: "Get a splice", roles: [SystemAdmin, NetworkPlanner, TestSupervisor, FieldTechnician, SafetyOfficer, FaultCrewLead, DispatchCoordinator, AssetEngineer], code: 200, input: [], output: RepairSplice, side_effects: [] }
  - { method: GET, path: "/cable-diagnostics/repair-splices", description: "List splices", roles: [SystemAdmin, NetworkPlanner, TestSupervisor, FieldTechnician, SafetyOfficer, FaultCrewLead, DispatchCoordinator, AssetEngineer], code: 200, input: ["fault_record_id?", "excavation_order_id?", "status?", "limit?", "offset?"], output: "RepairSplice[]", side_effects: [] }
  - { method: POST, path: "/cable-diagnostics/repair-splices/{id}/start", description: "Start splicing (fault must be EXCAVATING)", roles: [FaultCrewLead], code: 200, input: [], output: RepairSplice, side_effects: ["status SPLICING; fault -> REPAIRING"] }
  - { method: POST, path: "/cable-diagnostics/repair-splices/{id}/cure", description: "Begin curing", roles: [FaultCrewLead], code: 200, input: [], output: RepairSplice, side_effects: ["status CURING; cure_started_at := now"] }
  - { method: POST, path: "/cable-diagnostics/repair-splices/{id}/finish-curing", description: "Finish curing after exactly >= 24h", roles: [FaultCrewLead], code: 200, input: [], output: RepairSplice, side_effects: ["status COMPLETED; completed_at := now; fault -> REPAIRED"] }
  - { method: POST, path: "/cable-diagnostics/repair-splices/{id}/accept", description: "Customer acceptance after passing re-test", roles: [NetworkPlanner], code: 200, input: [], output: RepairSplice, side_effects: ["status ACCEPTED; fault -> CLOSED_VERIFIED with circuit/job cascades"] }
  - { method: POST, path: "/cable-diagnostics/repair-splices/{id}/reject", description: "Customer rejection (workmanship); fault reopens", roles: [NetworkPlanner], code: 200, input: [], output: RepairSplice, side_effects: ["status REJECTED; fault -> REOPENED"] }

  # --- MobileUnit / EquipmentAssignment ---
  - { method: POST, path: "/cable-diagnostics/mobile-units", description: "Register a mobile test unit", roles: [SystemAdmin], code: 201, input: [unit_code, capabilities, max_test_voltage_kv], output: MobileUnit, side_effects: ["status=AVAILABLE; committed_hours=0.0"] }
  - { method: GET, path: "/cable-diagnostics/mobile-units/{id}", description: "Get a unit", roles: [SystemAdmin, NetworkPlanner, TestSupervisor, FieldTechnician, SafetyOfficer, FaultCrewLead, DispatchCoordinator, AssetEngineer], code: 200, input: [], output: MobileUnit, side_effects: [] }
  - { method: GET, path: "/cable-diagnostics/mobile-units", description: "List units", roles: [SystemAdmin, NetworkPlanner, TestSupervisor, FieldTechnician, SafetyOfficer, FaultCrewLead, DispatchCoordinator, AssetEngineer], code: 200, input: ["status?", "limit?", "offset?"], output: "MobileUnit[]", side_effects: [] }
  - { method: POST, path: "/cable-diagnostics/mobile-units/{id}/maintenance", description: "Send an idle unit to maintenance", roles: [DispatchCoordinator], code: 200, input: [], output: MobileUnit, side_effects: ["status MAINTENANCE"] }
  - { method: POST, path: "/cable-diagnostics/mobile-units/{id}/return-to-service", description: "Return a unit from maintenance", roles: [DispatchCoordinator], code: 200, input: [], output: MobileUnit, side_effects: ["status AVAILABLE"] }
  - { method: GET, path: "/cable-diagnostics/mobile-units/{id}/equipment-assignments", description: "Assignments of a unit", roles: [SystemAdmin, NetworkPlanner, TestSupervisor, FieldTechnician, SafetyOfficer, FaultCrewLead, DispatchCoordinator, AssetEngineer], code: 200, input: [], output: "EquipmentAssignment[]", side_effects: [] }
  - { method: POST, path: "/cable-diagnostics/equipment-assignments", description: "Reserve a unit for a job (capability + 4h buffer rules)", roles: [DispatchCoordinator], code: 201, input: [mobile_unit_id, test_job_id, mobilize_at, demobilize_at], output: EquipmentAssignment, side_effects: ["status=RESERVED; duration_hours computed; unit.committed_hours += duration_hours; unit AVAILABLE -> ASSIGNED"] }
  - { method: GET, path: "/cable-diagnostics/equipment-assignments/{id}", description: "Get an assignment", roles: [SystemAdmin, NetworkPlanner, TestSupervisor, FieldTechnician, SafetyOfficer, FaultCrewLead, DispatchCoordinator, AssetEngineer], code: 200, input: [], output: EquipmentAssignment, side_effects: [] }
  - { method: GET, path: "/cable-diagnostics/equipment-assignments", description: "List assignments", roles: [SystemAdmin, NetworkPlanner, TestSupervisor, FieldTechnician, SafetyOfficer, FaultCrewLead, DispatchCoordinator, AssetEngineer], code: 200, input: ["mobile_unit_id?", "test_job_id?", "status?", "limit?", "offset?"], output: "EquipmentAssignment[]", side_effects: [] }
  - { method: POST, path: "/cable-diagnostics/equipment-assignments/{id}/confirm", description: "Confirm a reservation", roles: [DispatchCoordinator], code: 200, input: [], output: EquipmentAssignment, side_effects: ["status CONFIRMED"] }
  - { method: POST, path: "/cable-diagnostics/equipment-assignments/{id}/activate", description: "Activate once mobilize_at reached", roles: [DispatchCoordinator], code: 200, input: [], output: EquipmentAssignment, side_effects: ["status ACTIVE"] }
  - { method: POST, path: "/cable-diagnostics/equipment-assignments/{id}/release", description: "Release an ACTIVE assignment (frees committed hours)", roles: [DispatchCoordinator], code: 200, input: [], output: EquipmentAssignment, side_effects: ["status RELEASED; unit.committed_hours -= duration_hours; unit may become AVAILABLE"] }
  - { method: POST, path: "/cable-diagnostics/equipment-assignments/{id}/cancel", description: "Cancel a RESERVED or CONFIRMED assignment", roles: [DispatchCoordinator], code: 200, input: [], output: EquipmentAssignment, side_effects: ["status CANCELLED; unit.committed_hours -= duration_hours; unit may become AVAILABLE"] }

  # --- HealthAssessment ---
  - { method: POST, path: "/cable-diagnostics/health-assessments", description: "Compute a health assessment (OCC-guarded create-with-supersede)", roles: [AssetEngineer], code: 201, input: [circuit_id, basis, expected_circuit_version], output: HealthAssessment, side_effects: ["status=COMPUTED; score/band/action computed per basis; prior {COMPUTED,REVIEWED,ADOPTED} assessment -> SUPERSEDED with supersedes_id recorded; increments CableCircuit.version by 1"] }
  - { method: GET, path: "/cable-diagnostics/health-assessments/{id}", description: "Get an assessment", roles: [SystemAdmin, NetworkPlanner, TestSupervisor, FieldTechnician, SafetyOfficer, FaultCrewLead, DispatchCoordinator, AssetEngineer], code: 200, input: [], output: HealthAssessment, side_effects: [] }
  - { method: GET, path: "/cable-diagnostics/health-assessments", description: "List assessments", roles: [SystemAdmin, NetworkPlanner, TestSupervisor, FieldTechnician, SafetyOfficer, FaultCrewLead, DispatchCoordinator, AssetEngineer], code: 200, input: ["circuit_id?", "supersedes_id?", "status?", "basis?", "limit?", "offset?"], output: "HealthAssessment[]", side_effects: [] }
  - { method: POST, path: "/cable-diagnostics/health-assessments/{id}/review", description: "Engineering review of a COMPUTED assessment", roles: [AssetEngineer], code: 200, input: [], output: HealthAssessment, side_effects: ["status REVIEWED"] }
  - { method: POST, path: "/cable-diagnostics/health-assessments/{id}/adopt", description: "Customer adopts a REVIEWED assessment; updates circuit health fields", roles: [NetworkPlanner], code: 200, input: [], output: HealthAssessment, side_effects: ["status ADOPTED; circuit.current_health_index/band/replacement_recommended updated"] }

# =============================================================================
# Table 6: Error Code Catalog (§1.6)
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Authenticated role is not in the endpoint's allowed roles" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum member, out-of-range number, or method-conditional field violation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not exist (checked left-to-right)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity is not in an allowed from-state for the requested transition" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 422, condition: "Same X-User-ID attempted a step reserved for a different officer (verify != issue; release != verify)" }
  - { id: ERR_GROUNDING_NOT_VERIFIED, http: 409, condition: "Series energize attempted before the job permit reached GROUNDING_VERIFIED" }
  - { id: ERR_PERMIT_NOT_RELEASED, http: 409, condition: "Job completion attempted before permit release" }
  - { id: ERR_WINDOW_IN_PAST, http: 409, condition: "Outage window start precedes the logical clock" }
  - { id: ERR_WINDOW_OVERLAP, http: 409, condition: "Half-open overlap with a non-terminal window of the same circuit" }
  - { id: ERR_WINDOW_NOT_ACTIVE, http: 409, condition: "Clock outside the required active interval (window activate, job start/resume, excavation start, assignment activate)" }
  - { id: ERR_DIG_OUTSIDE_OUTAGE, http: 409, condition: "Dig window not contained (inclusive) within the job's outage window" }
  - { id: ERR_CURING_INCOMPLETE, http: 409, condition: "finish-curing before cure_started_at + 24h" }
  - { id: ERR_CORRIDOR_VIOLATION, http: 409, condition: "Excavation target outside the fault's pinpoint corridor" }
  - { id: ERR_DIG_WINDOW_OVERLAP, http: 409, condition: "Dig window overlaps another non-CANCELLED excavation of the same fault" }
  - { id: ERR_UNIT_OVERLAP_BUFFER, http: 409, condition: "Assignment violates the 4h inter-assignment buffer on the same unit" }
  - { id: ERR_UNIT_CAPABILITY_MISMATCH, http: 409, condition: "Unit capabilities or voltage ceiling do not cover the job's methods" }
  - { id: ERR_UNIT_HAS_ASSIGNMENTS, http: 409, condition: "Maintenance attempted while assignments are open" }
  - { id: ERR_VOLTAGE_MISMATCH, http: 422, condition: "test_voltage_kv outside ±5% (inclusive) of 1.5 x U0 for VLF methods" }
  - { id: ERR_NO_READINGS, http: 409, condition: "Evaluate attempted with zero readings" }
  - { id: ERR_STEP_INCOMPLETE, http: 409, condition: "Evaluate attempted before every step 0..step_count-1 has a reading" }
  - { id: ERR_STEP_OUT_OF_RANGE, http: 422, condition: "step_index >= step_count" }
  - { id: ERR_DUPLICATE_STEP, http: 409, condition: "A reading already exists for (test_series_id, step_index)" }
  - { id: ERR_VERDICT_NOT_FAIL, http: 409, condition: "Manual fault creation on a PASS series (FAIL auto-creates, MONITOR allowed)" }
  - { id: ERR_FAULT_ALREADY_RECORDED, http: 409, condition: "A fault already exists for this test_series_id" }
  - { id: ERR_PERMIT_EXISTS, http: 409, condition: "A non-RELEASED permit already exists for the job" }
  - { id: ERR_SPLICE_EXISTS, http: 409, condition: "An open splice already exists for the fault" }
  - { id: ERR_EXCAVATION_EXISTS, http: 409, condition: "A non-CANCELLED excavation already exists for the fault" }
  - { id: ERR_CIRCUIT_BUSY, http: 409, condition: "A non-terminal TestJob already exists for the circuit" }
  - { id: ERR_NO_EQUIPMENT_ON_SITE, http: 409, condition: "No qualifying assignment (CONFIRMED/ACTIVE, clock inside) for the job at energize" }
  - { id: ERR_DUPLICATE_CIRCUIT_REF, http: 409, condition: "circuit_ref already registered" }
  - { id: ERR_CROSS_REFERENCE_MISMATCH, http: 422, condition: "Splice's excavation belongs to a different fault" }
  - { id: ERR_SPLICE_NOT_CURING, http: 409, condition: "Backfill attempted before the linked splice reached CURING/COMPLETED" }
  - { id: ERR_RETEST_REQUIRED, http: 409, condition: "Splice acceptance without a qualifying passing re-test created after completed_at" }
  - { id: ERR_METHOD_NOT_REQUESTED, http: 409, condition: "Series method not among the job's requested_methods" }
  - { id: ERR_BUDGET_EXCEEDED, http: 422, condition: "Estimate or committed costs exceed approved_budget_cents" }

# =============================================================================
# Table 7: RBAC Matrix (§1.7)
# =============================================================================
roles:
  - name: SystemAdmin
    description: "Contractor platform operator; registers circuits and mobile units; drives the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /cable-diagnostics/circuits"
      - "POST /cable-diagnostics/mobile-units"
      - "POST /cable-diagnostics/_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]
  - name: NetworkPlanner
    description: "Customer-side outage planner; owns windows, jobs, customer acceptance of series and splices, and assessment adoption."
    identity: opaque
    exclusive_operations:
      - "POST /cable-diagnostics/outage-windows and its approve/activate/close/cancel actions"
      - "POST /cable-diagnostics/test-jobs and plan/reschedule"
      - "POST /cable-diagnostics/test-series/{id}/accept"
      - "POST /cable-diagnostics/repair-splices/{id}/accept and reject"
      - "POST /cable-diagnostics/health-assessments/{id}/adopt"
    shared_operations: ["all GET endpoints", "POST /cable-diagnostics/test-jobs/{id}/abort", "GET trend/invoice"]
  - name: TestSupervisor
    description: "Field test lead; starts/suspends/resumes/completes jobs, creates and energizes series, evaluates and invalidates, raises and reopens faults."
    identity: opaque
    exclusive_operations:
      - "POST /cable-diagnostics/test-jobs/{id}/start, suspend, resume, complete"
      - "POST /cable-diagnostics/test-series and energize/evaluate/invalidate"
      - "POST /cable-diagnostics/faults and faults/{id}/reopen"
    shared_operations: ["all GET endpoints", "POST /cable-diagnostics/test-jobs/{id}/abort"]
  - name: FieldTechnician
    description: "Operates the test set under supervision; appends readings only."
    identity: opaque
    exclusive_operations:
      - "POST /cable-diagnostics/test-series/{id}/readings"
    shared_operations: ["all GET endpoints"]
  - name: SafetyOfficer
    description: "Issues, independently verifies, and releases isolation/grounding permits; two-person rule enforced via X-User-ID."
    identity: opaque
    exclusive_operations:
      - "POST /cable-diagnostics/isolation-permits and issue/verify-grounding/release"
    shared_operations: ["all GET endpoints"]
  - name: FaultCrewLead
    description: "Repair contractor lead; pinpoints faults, runs excavations, builds splices through curing."
    identity: opaque
    exclusive_operations:
      - "POST /cable-diagnostics/faults/{id}/pinpoint"
      - "POST /cable-diagnostics/excavation-orders and permit/start/backfill/cancel"
      - "POST /cable-diagnostics/repair-splices and start/cure/finish-curing"
    shared_operations: ["all GET endpoints"]
  - name: DispatchCoordinator
    description: "Fleet dispatcher; reserves/confirms/activates/releases/cancels assignments; unit maintenance."
    identity: opaque
    exclusive_operations:
      - "POST /cable-diagnostics/mobile-units/{id}/maintenance and return-to-service"
      - "POST /cable-diagnostics/equipment-assignments and confirm/activate/release/cancel"
    shared_operations: ["all GET endpoints"]
  - name: AssetEngineer
    description: "Asset analytics; computes and reviews health assessments; reads trends and invoices."
    identity: opaque
    exclusive_operations:
      - "POST /cable-diagnostics/health-assessments"
      - "POST /cable-diagnostics/health-assessments/{id}/review"
    shared_operations: ["all GET endpoints", "GET trend/invoice"]
