            - { call: "GET /retail/routes/${r1_id}", payload: {}, as: FranchiseOwner, captures: { r1_ver_final: "$.data.version" } }
            - { call: "POST /retail/product-orders/${po_id}/status", payload: { action: SUBMIT }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { po_ver_submitted: "$.data.version" } }
