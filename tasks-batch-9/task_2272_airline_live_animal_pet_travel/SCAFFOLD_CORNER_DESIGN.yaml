            - { call: "POST /stations", payload: { iata_code: "LAX", country_code: "US", kennel_bay_count: 6 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { st_lax: $.data.id } }
            - { call: "POST /stations", payload: { iata_code: "JFK", country_code: "US", kennel_bay_count: 6 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { st_jfk: $.data.id } }
            - { call: "POST /flight-legs", payload: { flight_number: "AN101", origin_station_id: "${st_hkg}", destination_station_id: "${st_lax}", scheduled_departure_utc: "2026-09-10T02:00:00Z", scheduled_arrival_utc: "2026-09-10T15:00:00Z", forecast_high_c: 25, forecast_low_c: 15, cabin_animal_limit: 2, checked_animal_limit: 2, cargo_animal_limit: 4 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { leg1: $.data.id } }
            - { call: "POST /flight-legs", payload: { flight_number: "AN209", origin_station_id: "${st_lax}", destination_station_id: "${st_jfk}", scheduled_departure_utc: "2026-09-11T03:01:00Z", scheduled_arrival_utc: "2026-09-11T08:00:00Z", forecast_high_c: 22, forecast_low_c: 12, cabin_animal_limit: 2, checked_animal_limit: 2, cargo_animal_limit: 4 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { leg2: $.data.id } }
            - { call: "POST /reservations", payload: { passenger_name: "Chan", contact_email: "chan@example.com", routing_type: "CARGO" }, as: ReservationsAgent, as_user_id: "agent-01", captures: { res1: $.data.id } }
            - { call: "POST /animal-records", payload: { reservation_id: "${res1}", species_profile_id: "${sp_dog}", container_model_id: "${cm_k9l}", animal_name: "Mochi", breed_name: "Labrador", declared_weight_kg: 20, height_at_shoulder_cm: 35, length_nose_to_tail_cm: 50, age_weeks: 52 }, as: ReservationsAgent, as_user_id: "agent-01", captures: { an1: $.data.id } }
            - { call: "POST /animal-records/${an1}/screen", payload: {}, as: AcceptanceAgent, as_user_id: "accept-01" }
            - { call: "GET /flight-legs/${leg1}", payload: {}, as: ReservationsAgent, as_user_id: "agent-01", captures: { leg1_v1: $.data.version } }
            - { call: "POST /segment-assignments", payload: { animal_record_id: "${an1}", flight_leg_id: "${leg1}", routing_type: "CARGO", sequence_index: 1, expected_flight_leg_version: "${leg1_v1}" }, as: ReservationsAgent, as_user_id: "agent-01", captures: { seg1: $.data.id } }
            - { call: "GET /flight-legs/${leg2}", payload: {}, as: ReservationsAgent, as_user_id: "agent-01", captures: { leg2_v1: $.data.version } }
          trigger:
