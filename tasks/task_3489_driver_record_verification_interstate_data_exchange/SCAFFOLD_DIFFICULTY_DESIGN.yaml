            - call: "POST /driver-exchange/system-participations/${p_a}/grant-certification"
              payload: {}
              as: AssociationAdmin
            - call: "PATCH /driver-exchange/jurisdictions/${j_a}"
              payload: { status: "ACTIVE" }
              as: AssociationAdmin
          trigger:
            - call: "PATCH /driver-exchange/jurisdictions/${j_a}"
              payload: { status: "SUSPENDED" }
              as: AssociationAdmin
            - call: "GET /driver-exchange/jurisdictions/${j_a}/system-participations"
              payload: {}
              as: AssociationAdmin
              captures: { p_status_suspended: "$.data[0].status" }
            - call: "PATCH /driver-exchange/jurisdictions/${j_a}"
              payload: { status: "ACTIVE" }
