# =============================================================================
# PRD Benchmark Scaffold — Talent Payroll & Residuals Administration
# =============================================================================

scenario: |
  Talent Payroll & Residuals Administration (entertainment payroll company): contract terms & rate tier ingestion by union agreement, timecard/production report processing & penalty calculation (meal/rest/turnaround), taxable jurisdiction determination for shoot locations, pension/health/welfare contribution remittance, residual calculation by reuse market & window, payment distribution to guilds & performers, garnishment & loan-out corporation handling, audit & grievance response

domain_name: talent-payroll-residuals
api_prefix: /payroll

complexity_profile:
  primary_archetype: Pricing engine        # tiered rates, penalty units, market/window residual percentages
  secondary_archetype: Compliance / audit  # union grievances, segregation of duties, remittance trail
  complexity_layers:
    - dual_variant_calculation      # provisional vs final penalties; provisional vs final residuals
    - cascading_side_effects        # disburse: batch -> pay line -> timecard -> engagement -> performer
    - rate_threshold_triggers       # daily OT threshold, meal-penalty window, turnaround gap, garnishment cap
    - optimistic_concurrency        # OCC on Engagement.version for amendment (create-with-supersede)
  entity_topology: flat             # peer entities joined by FK references; no nested URL paths
  state_machine_shape: cyclic       # timecard flag/revise loop; residual dispute loop; batch recall revert
  relationship_patterns:
    - one_to_many                   # engagement -> timecards, batch -> pay lines
    - self_referential              # Engagement.supersedes_engagement_id (amendment chain)
    - polymorphic                   # PayLine.source_id -> Timecard | ResidualObligation | GrievanceCase
    - cross_aggregate               # GarnishmentOrder (performer scope) applied to PayLine (batch scope)
  role_model: segregation_of_duties # batch creator may never approve/disburse that same batch
  consistency_model: immediate      # every mutation + cascade visible in the same request's response

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: UnionAgreement
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: union_code, type: enum, source: input, description: "Guild/union identifier", constraints: "one of SAG_AFTRA | WGA | DGA | AFM | IATSE" }
      - { name: name, type: string, source: input, description: "Human-readable agreement name" }
      - { name: effective_from, type: string, source: input, description: "Inclusive window start date, ISO YYYY-MM-DD" }
      - { name: effective_to, type: string, source: input, description: "Exclusive window end date, ISO YYYY-MM-DD; must be > effective_from" }
      - { name: rate_tiers, type: array, source: input, description: "Rate tier table ingested with the agreement; each element { tier_code: string, category: enum PRINCIPAL|BACKGROUND|STUNT, day_rate_cents: integer > 0, ot_daily_threshold_minutes: integer > 0, ot_multiplier: number >= 1.0 }; tier_code unique within the array" }
      - { name: meal_penalty_cents, type: integer, source: input, description: "Flat penalty per MEAL violation unit" }
      - { name: rest_penalty_cents, type: integer, source: input, description: "Flat penalty per REST violation unit" }
      - { name: turnaround_min_hours, type: number, source: input, description: "Minimum hours between one day's wrap_time and the next day's call_time before a TURNAROUND penalty accrues" }
      - { name: phw_pension_pct, type: number, source: input, description: "Employer pension contribution as fraction of pay line gross_cents" }
      - { name: phw_health_pct, type: number, source: input, description: "Employer health contribution as fraction of pay line gross_cents" }
      - { name: phw_welfare_pct, type: number, source: input, description: "Employer welfare contribution as fraction of pay line gross_cents" }
      - { name: residual_base_pct_by_market, type: object, source: input, description: "Map of reuse market -> base percentage; keys drawn from NETWORK_REBROADCAST | SYNDICATION | STREAMING | FOREIGN | HOME_VIDEO; at least one key required" }
      - { name: status, type: enum, source: system, description: "DRAFT on creation; RATIFIED via ratify action", constraints: "DRAFT | RATIFIED" }

  - name: Production
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Production title" }
      - { name: production_company, type: string, source: input, description: "Producing company name" }
      - { name: union_agreement_id, type: string, source: input, description: "FK -> UnionAgreement.id; signatory agreement for this production" }
      - { name: production_type, type: enum, source: input, description: "Content category", constraints: "FILM | TV_SERIES | COMMERCIAL | NEW_MEDIA" }
      - { name: jurisdictions, type: array, source: input, description: "Shoot-location tax jurisdictions; each element { jurisdiction_code: string, tax_pct: number >= 0, valid_from: YYYY-MM-DD, valid_to: YYYY-MM-DD (exclusive) }; jurisdiction_code unique within the array" }
      - { name: status, type: enum, source: system, description: "Lifecycle, advanced monotonically via advance action", constraints: "PRE_PRODUCTION | SHOOTING | WRAPPED | ARCHIVED" }

  - name: Performer
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Performer legal name" }
      - { name: primary_union_code, type: enum, source: input, description: "Performer's primary guild", constraints: "SAG_AFTRA | WGA | DGA | AFM | IATSE" }
      - { name: tax_residency_state, type: string, source: input, description: "Two-letter state code used as withholding jurisdiction for residual and grievance-adjustment pay lines" }
      - { name: ytd_gross_cents, type: integer, source: computed, default: 0, description: "Sum of PayLine.gross_cents over PAID pay lines whose engagement belongs to this performer" }
      - { name: ytd_garnished_cents, type: integer, source: computed, default: 0, description: "Sum of PayLine.garnished_cents over PAID pay lines whose engagement belongs to this performer" }

  - name: Engagement
    parent: null
    common_fields: true
    fields:
      - { name: production_id, type: string, source: input, description: "FK -> Production.id" }
      - { name: union_agreement_id, type: string, source: input, description: "FK -> UnionAgreement.id; agreement whose rate tiers and penalty schedule govern this engagement" }
      - { name: performer_id, type: string, source: input, description: "FK -> Performer.id; the human who works, regardless of payee routing" }
      - { name: tier_code, type: string, source: input, description: "Must match one tier_code in the referenced UnionAgreement.rate_tiers at creation time" }
      - { name: payee_type, type: enum, source: input, description: "DIRECT = pay the performer with tax withholding; LOAN_OUT = pay the loan-out corporation gross (zero tax withholding, zero garnishment)", constraints: "DIRECT | LOAN_OUT" }
      - { name: loan_out_legal_name, type: string, source: input, description: "Required iff payee_type == LOAN_OUT; forbidden otherwise", default: null }
      - { name: loan_out_tax_id, type: string, source: input, description: "Required iff payee_type == LOAN_OUT; forbidden otherwise", default: null }
      - { name: weekly_guarantee_cents, type: integer, source: input, description: "Weekly minimum guarantee (0 = none); informational floor, not enforced as a cap" }
      - { name: guaranteed_days, type: integer, source: input, description: "Number of guaranteed work days; informational" }
      - { name: start_date, type: string, source: input, description: "Inclusive engagement window start, YYYY-MM-DD" }
      - { name: end_date, type: string, source: input, description: "Inclusive engagement window end, YYYY-MM-DD; must be >= start_date" }
      - { name: supersedes_engagement_id, type: string, source: input, default: null, description: "FK -> Engagement.id; when set, this engagement is an amendment of the referenced engagement (self-referential amendment chain)" }
      - { name: accrued_penalty_cents, type: integer, source: computed, default: 0, description: "Sum of PenaltyAssessment.amount_cents for this engagement's timecards where status == CONFIRMED (WAIVED excluded)" }
      - { name: accrued_adjustment_cents, type: integer, source: computed, default: 0, description: "Sum of PayLine.gross_cents where source_type == GRIEVANCE_ADJUSTMENT for this engagement" }
      - { name: ytd_paid_cents, type: integer, source: computed, default: 0, description: "Sum of PayLine.net_cents for this engagement where PayLine.status == PAID" }
      - { name: status, type: enum, source: system, description: "Contract lifecycle; see state_machines", constraints: "DRAFT | PENDING_APPROVAL | ACTIVE | AMENDMENT_PENDING | SUPERSEDED | WRAPPED" }

  - name: Timecard
    parent: null
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: input, description: "FK -> Engagement.id" }
      - { name: work_date, type: string, source: input, description: "Day worked, YYYY-MM-DD; must fall inside the engagement's [start_date, end_date]" }
      - { name: jurisdiction_code, type: string, source: input, description: "Shoot-location jurisdiction; must exist in the production's jurisdictions with validity covering work_date" }
      - { name: call_time, type: string, source: input, description: "ISO 8601 UTC timestamp of call" }
      - { name: first_meal_out, type: string, source: input, description: "ISO 8601 UTC timestamp when first meal break begins" }
      - { name: first_meal_in, type: string, source: input, description: "ISO 8601 UTC timestamp when first meal break ends; must be > first_meal_out" }
      - { name: wrap_time, type: string, source: input, description: "ISO 8601 UTC timestamp of wrap; must be > first_meal_in" }
      - { name: scheduled_hours, type: number, source: input, description: "Scheduled hours for the day; drives provisional penalty estimates" }
      - { name: worked_minutes, type: integer, source: computed, description: "= (wrap_time - call_time) - (first_meal_in - first_meal_out), whole minutes" }
      - { name: overtime_minutes, type: integer, source: computed, description: "= max(0, worked_minutes - tier.ot_daily_threshold_minutes), tier looked up via engagement.union_agreement_id + engagement.tier_code" }
      - { name: provisional_penalty_cents, type: integer, source: computed, description: "Estimated penalties from scheduled_hours at submission; see penalty_assessment_calculation (provisional variant)" }
      - { name: final_penalty_cents, type: integer, source: computed, description: "Actual penalties from real timestamps at approval; see penalty_assessment_calculation (final variant)" }
      - { name: day_gross_cents, type: integer, source: computed, description: "Computed at approval via daily_gross_calculation" }
      - { name: review_status, type: enum, source: system, description: "Review dimension (parallel to payment_status)", constraints: "SUBMITTED | FLAGGED | APPROVED" }
      - { name: payment_status, type: enum, source: system, description: "Payment dimension (parallel to review_status)", constraints: "UNBATCHED | BATCHED | PAID" }

  - name: PenaltyAssessment
    parent: null
    common_fields: false   # immutable ledger row: id + created_at only; status is the only mutable field (waive action)
    fields:
      - { name: timecard_id, type: string, source: system, description: "FK -> Timecard.id" }
      - { name: penalty_type, type: enum, source: system, description: "Violation category", constraints: "MEAL | REST | TURNAROUND" }
      - { name: units, type: integer, source: system, description: "Violation units (see penalty_assessment_calculation)" }
      - { name: amount_cents, type: integer, source: system, description: "units x unit price from the governing UnionAgreement" }
      - { name: status, type: enum, source: system, description: "CONFIRMED at creation (timecard approval); WAIVED via waive action", constraints: "CONFIRMED | WAIVED" }

  - name: ResidualObligation
    parent: null
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: input, description: "FK -> Engagement.id" }
      - { name: reuse_market, type: enum, source: input, description: "Reuse market", constraints: "NETWORK_REBROADCAST | SYNDICATION | STREAMING | FOREIGN | HOME_VIDEO" }
      - { name: window_start, type: string, source: input, description: "Inclusive reuse-window start, YYYY-MM-DD" }
      - { name: window_end, type: string, source: input, description: "Inclusive reuse-window end, YYYY-MM-DD; must be >= window_start (closed interval)" }
      - { name: reported_gross_receipts_cents, type: integer, source: input, description: "Reported reuse receipts for this market window (final calculation basis)" }
      - { name: base_pct, type: number, source: system, description: "Snapshot of union_agreement.residual_base_pct_by_market[reuse_market] pinned at creation; later agreement edits never retroactively change this row" }
      - { name: window_sequence, type: integer, source: system, description: "1-based ordinal of this window among the engagement's windows for the same reuse_market, ordered by window_start ASC, tie-break created_at ASC" }
      - { name: provisional_amount_cents, type: integer, source: system, description: "Estimate pinned at creation: tier day_rate_cents x base_pct (see residual_calculation, provisional variant)" }
      - { name: final_amount_cents, type: integer, source: system, description: "Computed at CALCULATED: reported_gross_receipts_cents x base_pct x window discount (see residual_calculation, final variant)" }
      - { name: status, type: enum, source: system, description: "Residual lifecycle; see state_machines", constraints: "REPORTED | CALCULATED | APPROVED | DISPUTED | BATCHED | PAID" }

  - name: PayBatch
    parent: null
    common_fields: true
    fields:
      - { name: period_label, type: string, source: input, description: "Human label for the pay period" }
      - { name: cutoff_date, type: string, source: input, description: "Sweep eligibility cutoff, YYYY-MM-DD; timecards with work_date <= cutoff and residuals with window_end <= cutoff are eligible" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the creator; segregation-of-duties anchor (approver must differ)" }
      - { name: total_gross_cents, type: integer, source: computed, default: 0, description: "Sum of PayLine.gross_cents in this batch (0 while OPEN)" }
      - { name: total_tax_cents, type: integer, source: computed, default: 0, description: "Sum of PayLine.tax_cents" }
      - { name: total_garnished_cents, type: integer, source: computed, default: 0, description: "Sum of PayLine.garnished_cents" }
      - { name: total_phw_cents, type: integer, source: computed, default: 0, description: "Sum of PayLine.phw_cents (employer-side contributions)" }
      - { name: total_net_cents, type: integer, source: computed, default: 0, description: "Sum of PayLine.net_cents" }
      - { name: status, type: enum, source: system, description: "Batch lifecycle; see state_machines", constraints: "OPEN | CLOSED | APPROVED | DISBURSED" }

  - name: PayLine
    parent: null
    common_fields: false   # immutable ledger line: id + created_at only; status flips UNPAID -> PAID on disburse
    fields:
      - { name: pay_batch_id, type: string, source: system, description: "FK -> PayBatch.id" }
      - { name: engagement_id, type: string, source: system, description: "FK -> Engagement.id (denormalized from the source for filtering and YTD rolls)" }
      - { name: source_type, type: enum, source: system, description: "Which source produced this line", constraints: "TIMECARD | RESIDUAL | GRIEVANCE_ADJUSTMENT" }
      - { name: source_id, type: string, source: system, description: "Polymorphic reference (NOT an FK): Timecard.id when source_type == TIMECARD, ResidualObligation.id when RESIDUAL, GrievanceCase.id when GRIEVANCE_ADJUSTMENT" }
      - { name: gross_cents, type: integer, source: system, description: "TIMECARD: timecard.day_gross_cents + CONFIRMED penalty sum; RESIDUAL: final_amount_cents; GRIEVANCE_ADJUSTMENT: awarded_amount_cents" }
      - { name: jurisdiction_code, type: string, source: system, description: "Withholding jurisdiction: timecard's jurisdiction_code; for RESIDUAL/GRIEVANCE_ADJUSTMENT the performer's tax_residency_state" }
      - { name: tax_cents, type: integer, source: system, description: "Withholding per jurisdiction_tax_calculation; 0 for LOAN_OUT engagements" }
      - { name: garnished_cents, type: integer, source: system, description: "Allocated by garnishment_waterfall; 0 for LOAN_OUT engagements and GRIEVANCE_ADJUSTMENT lines" }
      - { name: phw_cents, type: integer, source: system, description: "Employer pension+health+welfare on gross_cents per phw_contribution_calculation; never reduces net_cents" }
      - { name: net_cents, type: integer, source: system, description: "= gross_cents - tax_cents - garnished_cents (LOAN_OUT: == gross_cents)" }
      - { name: status, type: enum, source: system, description: "UNPAID at creation; PAID when the batch is disbursed", constraints: "UNPAID | PAID" }

  - name: GarnishmentOrder
    parent: null
    common_fields: true
    fields:
      - { name: performer_id, type: string, source: input, description: "FK -> Performer.id" }
      - { name: creditor_name, type: string, source: input, description: "Creditor named on the order" }
      - { name: order_type, type: enum, source: input, description: "Legal category", constraints: "CHILD_SUPPORT | FEDERAL_TAX_LEVY | STATE_TAX_LEVY | CREDITOR_JUDGMENT" }
      - { name: priority_rank, type: integer, source: input, description: "Waterfall priority; lower number allocates first; ties break by created_at ASC" }
      - { name: pct_of_disposable, type: number, source: input, default: null, description: "Fraction of disposable income requested; exactly one of pct_of_disposable / fixed_amount_cents must be set" }
      - { name: fixed_amount_cents, type: integer, source: input, default: null, description: "Fixed amount requested per batch; exactly one of pct_of_disposable / fixed_amount_cents must be set" }
      - { name: total_withheld_cents, type: integer, source: computed, default: 0, description: "Cumulative amount allocated to this order across disbursed batches" }
      - { name: status, type: enum, source: system, description: "ACTIVE on creation; RELEASED via release action (terminal)", constraints: "ACTIVE | RELEASED" }

  - name: RemittanceReport
    parent: null
    common_fields: true
    fields:
      - { name: pay_batch_id, type: string, source: input, description: "FK -> PayBatch.id; batch must be DISBURSED" }
      - { name: union_agreement_id, type: string, source: input, description: "FK -> UnionAgreement.id; only pay lines whose engagement uses this agreement are summed" }
      - { name: pension_cents, type: integer, source: computed, description: "Sum of per-line round_half_up(gross_cents x phw_pension_pct) over matching lines" }
      - { name: health_cents, type: integer, source: computed, description: "Sum of per-line round_half_up(gross_cents x phw_health_pct) over matching lines" }
      - { name: welfare_cents, type: integer, source: computed, description: "Sum of per-line round_half_up(gross_cents x phw_welfare_pct) over matching lines" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SUBMITTED -> ACKNOWLEDGED", constraints: "DRAFT | SUBMITTED | ACKNOWLEDGED" }

  - name: GrievanceCase
    parent: null
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: input, description: "FK -> Engagement.id under dispute" }
      - { name: pay_line_id, type: string, source: input, default: null, description: "FK -> PayLine.id; the disputed line, if the grievance targets a specific payment" }
      - { name: filed_by_user_id, type: string, source: system, description: "X-User-ID of the filing UnionAuditor" }
      - { name: category, type: enum, source: input, description: "Grievance category", constraints: "UNDERPAYMENT | PENALTY_OMITTED | RESIDUAL_MISCALC | PHW_SHORTAGE" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Amount the union claims is owed" }
      - { name: awarded_amount_cents, type: integer, source: system, default: 0, description: "Amount awarded at resolution; drives the GRIEVANCE_ADJUSTMENT pay line" }
      - { name: status, type: enum, source: system, description: "FILED -> UNDER_REVIEW -> RESOLVED, or UNDER_REVIEW -> ESCALATED -> RESOLVED", constraints: "FILED | UNDER_REVIEW | ESCALATED | RESOLVED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: UnionAgreement
    initial_state: DRAFT
    terminal_states: []   # RATIFIED agreements remain readable forever; no terminal state
    transitions:
      - from: DRAFT
        to: RATIFIED
        trigger: "POST /payroll/union-agreements/{id}/ratify"
        actor: PayrollAdmin
        preconditions:
          - "No other RATIFIED UnionAgreement with the same union_code has a half-open window [effective_from, effective_to) overlapping this one; adjacency (other.effective_to == this.effective_from or this.effective_to == other.effective_from) is allowed"
        side_effects:
          - "increments UnionAgreement.version by 1"

  - entity: Production
    initial_state: PRE_PRODUCTION
    terminal_states: [ARCHIVED]
    transitions:
      - from: PRE_PRODUCTION
        to: SHOOTING
        trigger: "POST /payroll/productions/{id}/advance"
        actor: PayrollAdmin
        preconditions: []
        side_effects:
          - "increments Production.version by 1"
      - from: SHOOTING
        to: WRAPPED
        trigger: "POST /payroll/productions/{id}/advance"
        actor: PayrollAdmin
        preconditions:
          - "No Engagement with production_id == this.id has status in {PENDING_APPROVAL, AMENDMENT_PENDING} (cross-entity gate; ACTIVE engagements are wrapped by the cascade)"
        side_effects:
          - "every Engagement with production_id == this.id and status in {ACTIVE, AMENDMENT_PENDING} transitions to WRAPPED"
          - "increments Production.version by 1"
      - from: WRAPPED
        to: ARCHIVED
        trigger: "POST /payroll/productions/{id}/advance"
        actor: PayrollAdmin
        preconditions: []
        side_effects:
          - "increments Production.version by 1"

  - entity: Engagement
    initial_state: DRAFT
    terminal_states: [WRAPPED, SUPERSEDED]
    transitions:
      - from: "(create)"
        to: DRAFT
        trigger: "POST /payroll/engagements"
        actor: ProductionAccountant
        preconditions:
          - "production_id, union_agreement_id, performer_id exist"
          - "tier_code matches a tier_code in the referenced UnionAgreement.rate_tiers"
          - "payee_type == LOAN_OUT requires loan_out_legal_name and loan_out_tax_id; payee_type == DIRECT forbids them"
          - "if supersedes_engagement_id set: target Engagement exists, target.status == ACTIVE, and expected_engagement_version == target.version (OCC)"
        side_effects:
          - "if supersedes_engagement_id set: target Engagement transitions ACTIVE -> AMENDMENT_PENDING and its version increments by 1"
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /payroll/engagements/{id}/submit"
        actor: ProductionAccountant
        preconditions:
          - "referenced UnionAgreement.status == RATIFIED"
          - "performer double-booking check: no other Engagement with the same performer_id, status in {PENDING_APPROVAL, ACTIVE, AMENDMENT_PENDING}, and closed-interval [start_date, end_date] overlapping this one (other.start_date <= this.end_date AND this.start_date <= other.end_date; shared boundary dates conflict); the engagement named by this.supersedes_engagement_id is excluded from the check"
        side_effects:
          - "increments Engagement.version by 1"
      - from: PENDING_APPROVAL
        to: ACTIVE
        trigger: "POST /payroll/engagements/{id}/approve"
        actor: PayrollSupervisor
        preconditions:
          - "referenced Production.status in {PRE_PRODUCTION, SHOOTING}"
        side_effects:
          - "if supersedes_engagement_id set: target Engagement transitions AMENDMENT_PENDING -> SUPERSEDED and its version increments by 1"
          - "increments Engagement.version by 1"
      - from: PENDING_APPROVAL
        to: DRAFT
        trigger: "POST /payroll/engagements/{id}/reject"
        actor: PayrollSupervisor
        preconditions: []
        side_effects:
          - "if supersedes_engagement_id set: target Engagement transitions AMENDMENT_PENDING -> ACTIVE and its version increments by 1 (compensation of the create-time side effect)"
          - "increments Engagement.version by 1"
      - from: ACTIVE
        to: WRAPPED
        trigger: "system cascade from Production advance SHOOTING -> WRAPPED"
        actor: system
        preconditions: []
        side_effects:
          - "increments Engagement.version by 1"
      - from: AMENDMENT_PENDING
        to: WRAPPED
        trigger: "system cascade from Production advance SHOOTING -> WRAPPED"
        actor: system
        preconditions: []
        side_effects:
          - "increments Engagement.version by 1"
      - from: AMENDMENT_PENDING
        to: SUPERSEDED
        trigger: "system cascade from approval of the amendment engagement"
        actor: system
        preconditions: []
        side_effects:
          - "increments Engagement.version by 1"
      - from: AMENDMENT_PENDING
        to: ACTIVE
        trigger: "system cascade from rejection of the amendment engagement"
        actor: system
        preconditions: []
        side_effects:
          - "increments Engagement.version by 1"

  - entity: Timecard
    initial_state: "review_status=SUBMITTED, payment_status=UNBATCHED"
    terminal_states: ["review_status=APPROVED, payment_status=PAID"]
    transitions:
      # --- review dimension (cyclic: SUBMITTED -> FLAGGED -> SUBMITTED) ---
      - from: "review_status=SUBMITTED"
        to: "review_status=FLAGGED"
        trigger: "POST /payroll/timecards/{id}/flag"
        actor: PayrollClerk
        preconditions:
          - "review_status == SUBMITTED (payment_status unrestricted)"
        side_effects:
          - "increments Timecard.version by 1"
      - from: "review_status=FLAGGED"
        to: "review_status=SUBMITTED"
        trigger: "POST /payroll/timecards/{id}/revise"
        actor: ProductionAccountant
        preconditions:
          - "review_status == FLAGGED"
        side_effects:
          - "recomputes worked_minutes, overtime_minutes, provisional_penalty_cents from the revised timestamps and scheduled_hours"
          - "increments Timecard.version by 1"
      - from: "review_status=SUBMITTED"
        to: "review_status=APPROVED"
        trigger: "POST /payroll/timecards/{id}/approve"
        actor: PayrollClerk
        preconditions:
          - "review_status == SUBMITTED"
          - "payment_status == UNBATCHED"
          - "referenced Engagement.status == ACTIVE (cross-entity gate)"
        side_effects:
          - "runs daily_gross_calculation -> sets day_gross_cents"
          - "runs penalty_assessment_calculation (final variant) -> sets final_penalty_cents and creates one PenaltyAssessment (status CONFIRMED) per violation type with units > 0"
          - "recomputes Engagement.accrued_penalty_cents for the parent engagement"
          - "increments Timecard.version by 1"
      # --- payment dimension (driven by batch lifecycle) ---
      - from: "payment_status=UNBATCHED"
        to: "payment_status=BATCHED"
        trigger: "system cascade from PayBatch close sweep (review_status must be APPROVED and work_date <= batch.cutoff_date to be swept)"
        actor: system
        preconditions: []
        side_effects:
          - "a PayLine (source_type TIMECARD) is created for this timecard"
          - "increments Timecard.version by 1"
      - from: "payment_status=BATCHED"
        to: "payment_status=UNBATCHED"
        trigger: "system cascade from PayBatch recall"
        actor: system
        preconditions: []
        side_effects:
          - "the timecard's PayLine is deleted"
          - "increments Timecard.version by 1"
      - from: "payment_status=BATCHED"
        to: "payment_status=PAID"
        trigger: "system cascade from PayBatch disburse (its PayLine flipping UNPAID -> PAID)"
        actor: system
        preconditions: []
        side_effects:
          - "recomputes Engagement.ytd_paid_cents for the parent engagement"
          - "increments Timecard.version by 1"

  - entity: PenaltyAssessment
    initial_state: CONFIRMED
    terminal_states: [WAIVED]
    transitions:
      - from: CONFIRMED
        to: WAIVED
        trigger: "POST /payroll/penalty-assessments/{id}/waive"
        actor: PayrollSupervisor
        preconditions:
          - "status == CONFIRMED"
          - "waiver_reason provided"
        side_effects:
          - "recomputes Engagement.accrued_penalty_cents for the parent engagement (compensating recompute)"

  - entity: ResidualObligation
    initial_state: REPORTED
    terminal_states: [PAID]
    transitions:
      - from: REPORTED
        to: CALCULATED
        trigger: "POST /payroll/residual-obligations/{id}/calculate"
        actor: PayrollClerk
        preconditions:
          - "referenced Engagement.union_agreement_id resolves to a UnionAgreement with status == RATIFIED (cross-entity gate)"
        side_effects:
          - "runs residual_calculation (final variant) -> sets final_amount_cents"
          - "increments ResidualObligation.version by 1"
      - from: DISPUTED
        to: CALCULATED
        trigger: "POST /payroll/residual-obligations/{id}/calculate"
        actor: PayrollClerk
        preconditions:
          - "referenced Engagement.union_agreement_id resolves to a UnionAgreement with status == RATIFIED"
        side_effects:
          - "runs residual_calculation (final variant) -> recomputes final_amount_cents from the same pinned base_pct and window_sequence"
          - "increments ResidualObligation.version by 1"
      - from: CALCULATED
        to: APPROVED
        trigger: "POST /payroll/residual-obligations/{id}/approve"
        actor: PayrollSupervisor
        preconditions: []
        side_effects:
          - "increments ResidualObligation.version by 1"
      - from: APPROVED
        to: DISPUTED
        trigger: "POST /payroll/residual-obligations/{id}/dispute"
        actor: UnionAuditor
        preconditions:
          - "dispute_reason provided"
        side_effects:
          - "increments ResidualObligation.version by 1"
      - from: APPROVED
        to: BATCHED
        trigger: "system cascade from PayBatch close sweep (window_end <= batch.cutoff_date to be swept)"
        actor: system
        preconditions: []
        side_effects:
          - "a PayLine (source_type RESIDUAL) is created for this obligation"
          - "increments ResidualObligation.version by 1"
      - from: BATCHED
        to: APPROVED
        trigger: "system cascade from PayBatch recall"
        actor: system
        preconditions: []
        side_effects:
          - "the obligation's PayLine is deleted"
          - "increments ResidualObligation.version by 1"
      - from: BATCHED
        to: PAID
        trigger: "system cascade from PayBatch disburse (its PayLine flipping UNPAID -> PAID)"
        actor: system
        preconditions: []
        side_effects:
          - "recomputes Engagement.ytd_paid_cents for the parent engagement"
          - "increments ResidualObligation.version by 1"

  - entity: PayBatch
    initial_state: OPEN
    terminal_states: [DISBURSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /payroll/pay-batches/{id}/close"
        actor: PayrollClerk
        preconditions:
          - "status == OPEN"
          - "sweep set non-empty (else ERR_BATCH_EMPTY): timecards review_status == APPROVED AND payment_status == UNBATCHED AND work_date <= cutoff_date, plus residuals status == APPROVED AND window_end <= cutoff_date"
        side_effects:
          - "creates one PayLine per swept source; per payline_net_calculation: gross -> tax -> disposable -> garnishment_waterfall (grouped by performer, sources ordered by work_date/window_start ASC then created_at ASC) -> phw -> net"
          - "swept Timecards payment_status UNBATCHED -> BATCHED; swept ResidualObligations APPROVED -> BATCHED"
          - "recomputes total_gross_cents, total_tax_cents, total_garnished_cents, total_phw_cents, total_net_cents as sums over the created PayLines"
          - "increments PayBatch.version by 1"
      - from: CLOSED
        to: APPROVED
        trigger: "POST /payroll/pay-batches/{id}/approve"
        actor: PayrollSupervisor
        preconditions:
          - "status == CLOSED"
          - "approver X-User-ID != created_by_user_id (segregation of duties)"
        side_effects:
          - "increments PayBatch.version by 1"
      - from: APPROVED
        to: OPEN
        trigger: "POST /payroll/pay-batches/{id}/recall"
        actor: PayrollSupervisor
        preconditions:
          - "status == APPROVED"
        side_effects:
          - "deletes every PayLine of the batch"
          - "each swept Timecard payment_status BATCHED -> UNBATCHED (review_status stays APPROVED); each swept ResidualObligation BATCHED -> APPROVED"
          - "resets total_gross_cents, total_tax_cents, total_garnished_cents, total_phw_cents, total_net_cents to 0"
          - "increments PayBatch.version by 1"
      - from: APPROVED
        to: DISBURSED
        trigger: "POST /payroll/pay-batches/{id}/disburse"
        actor: PayrollSupervisor
        preconditions:
          - "status == APPROVED"
        side_effects:
          - "every PayLine of the batch flips UNPAID -> PAID"
          - "each PayLine flip cascades: source Timecard payment_status BATCHED -> PAID / source ResidualObligation BATCHED -> PAID"
          - "each source flip cascades: recompute Engagement.ytd_paid_cents"
          - "each Engagement recompute cascades: recompute Performer.ytd_gross_cents and Performer.ytd_garnished_cents"
          - "each GarnishmentOrder that received an allocation updates total_withheld_cents"
          - "increments PayBatch.version by 1"

  - entity: GarnishmentOrder
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /payroll/garnishment-orders/{id}/release"
        actor: PayrollAdmin
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "future batch close sweeps exclude this order from garnishment_waterfall"
          - "increments GarnishmentOrder.version by 1"

  - entity: RemittanceReport
    initial_state: DRAFT
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /payroll/remittance-reports/{id}/submit"
        actor: PayrollClerk
        preconditions:
          - "status == DRAFT"
        side_effects:
          - "increments RemittanceReport.version by 1"
      - from: SUBMITTED
        to: ACKNOWLEDGED
        trigger: "POST /payroll/remittance-reports/{id}/acknowledge"
        actor: PayrollAdmin
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "increments RemittanceReport.version by 1"

  - entity: GrievanceCase
    initial_state: FILED
    terminal_states: [RESOLVED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /payroll/grievance-cases/{id}/respond"
        actor: PayrollClerk
        preconditions:
          - "status == FILED"
          - "response_note provided"
        side_effects:
          - "increments GrievanceCase.version by 1"
      - from: UNDER_REVIEW
        to: ESCALATED
        trigger: "POST /payroll/grievance-cases/{id}/escalate"
        actor: UnionAuditor
        preconditions:
          - "status == UNDER_REVIEW"
        side_effects:
          - "increments GrievanceCase.version by 1"
      - from: UNDER_REVIEW
        to: RESOLVED
        trigger: "POST /payroll/grievance-cases/{id}/resolve"
        actor: PayrollSupervisor
        preconditions:
          - "status in {UNDER_REVIEW, ESCALATED}"
          - "if awarded_amount_cents > 0: exactly one PayBatch with status == OPEN must exist"
        side_effects:
          - "sets awarded_amount_cents"
          - "if awarded_amount_cents > 0: creates a PayLine (source_type GRIEVANCE_ADJUSTMENT, source_id = this grievance, status UNPAID) in the OPEN PayBatch; this PayLine creation recomputes Engagement.accrued_adjustment_cents"
          - "increments GrievanceCase.version by 1"
      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /payroll/grievance-cases/{id}/resolve"
        actor: PayrollSupervisor
        preconditions:
          - "status in {UNDER_REVIEW, ESCALATED}"
          - "if awarded_amount_cents > 0: exactly one PayBatch with status == OPEN must exist"
        side_effects:
          - "sets awarded_amount_cents"
          - "if awarded_amount_cents > 0: creates a PayLine (source_type GRIEVANCE_ADJUSTMENT, source_id = this grievance, status UNPAID) in the OPEN PayBatch; this PayLine creation recomputes Engagement.accrued_adjustment_cents"
          - "increments GrievanceCase.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: engagement-amendment-stale-version
    parent_entity: Engagement
    write_endpoint: "POST /payroll/engagements"
    occ_field: expected_engagement_version
    description: |
      Creating an amendment Engagement (supersedes_engagement_id set) against
      a target Engagement whose version has advanced since the client last
      observed it is rejected. The product legitimately allows a new
      amendment to supersede the target, so the guard is the target's
      version: the create-time side effect (target ACTIVE ->
      AMENDMENT_PENDING) bumps target.version, and a second create carrying
      the earlier observed version is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: daily_gross_calculation
    trigger: "POST /payroll/timecards/{id}/approve (final, from actual timestamps)"
    algorithm: tiered_pricing
    formula: |
      tier = union_agreement.rate_tiers[engagement.tier_code]
      regular_minutes = min(worked_minutes, tier.ot_daily_threshold_minutes)
      ot_minutes      = max(0, worked_minutes - tier.ot_daily_threshold_minutes)
      hourly_cents    = tier.day_rate_cents / 8            # exact rational; rounding applied per component below
      day_gross_cents = round_half_up(regular_minutes / 60 * hourly_cents)
                      + round_half_up(ot_minutes / 60 * hourly_cents * tier.ot_multiplier)
    input_set: "The single Timecard being approved; its Engagement (tier_code, union_agreement_id); the governing UnionAgreement.rate_tiers row"
    constants:
      HOURS_PER_DAY_RATE: 8
    precision: "integer cents; round_half_up applied to each component (regular, overtime) BEFORE summing"
    variants:
      - name: scheduled_estimate
        when: "timecard creation / revise (provisional display only; never posted to a pay line)"
        difference: "uses scheduled_hours * 60 in place of worked_minutes; same formula otherwise"

  - name: penalty_assessment_calculation
    trigger: "POST /payroll/timecards (provisional variant, at create and revise) and POST /payroll/timecards/{id}/approve (final variant)"
    algorithm: threshold
    formula: |
      # Final variant (actual timestamps):
      MEAL:       meal_delay_minutes = (first_meal_out - call_time) in minutes
                  units = 1 if meal_delay_minutes > MEAL_WINDOW_MINUTES else 0
                  amount = units * agreement.meal_penalty_cents
      REST:       rest_minutes = (first_meal_in - first_meal_out) in minutes
                  units = 1 if rest_minutes < MIN_REST_MINUTES else 0
                  amount = units * agreement.rest_penalty_cents
      TURNAROUND: prev = latest Timecard of the same engagement with work_date < this.work_date
                  (tie-break none needed: work_date unique per engagement, enforced by ERR_DUPLICATE_WORK_DATE)
                  gap_hours = (this.call_time - prev.wrap_time) / 3600 seconds, fractional
                  shortfall = agreement.turnaround_min_hours - gap_hours
                  units = ceil(shortfall) if shortfall > 0 else 0      # gap exactly == turnaround_min_hours is NOT a violation
                  amount = units * round_half_up(tier.day_rate_cents / 8)
      final_penalty_cents = sum of the three amounts
      # Only violation types with units > 0 produce a PenaltyAssessment row.
    input_set: "The Timecard being approved (or created, for provisional); the previous Timecard of the same engagement if any; the governing UnionAgreement penalty constants and the engagement's rate tier"
    constants:
      MEAL_WINDOW_MINUTES: 360   # first meal must begin within 6h of call; strictly greater is a violation
      MIN_REST_MINUTES: 30       # meal break shorter than 30 minutes is a REST violation
    precision: "integer cents; ceil applied to turnaround shortfall hours; round_half_up for the hourly price"
    variants:
      - name: provisional
        when: "timecard create / revise"
        difference: "estimates from scheduled_hours only: MEAL units = 1 if scheduled_hours > 6 else 0; REST units = 0; TURNAROUND not estimable (0). provisional_penalty_cents = MEAL units * meal_penalty_cents. For identical timestamps, provisional and final routinely differ (provisional ignores actual meal timing)."

  - name: jurisdiction_tax_calculation
    trigger: "PayBatch close (per created PayLine)"
    algorithm: threshold
    formula: |
      if engagement.payee_type == LOAN_OUT: tax_cents = 0            # loan-out corps are paid gross
      else:
        if source_type == TIMECARD: jurisdiction = timecard.jurisdiction_code
        else:                        jurisdiction = performer.tax_residency_state   # RESIDUAL, GRIEVANCE_ADJUSTMENT
        jrow = production.jurisdictions[jurisdiction]  # creation-time validity already enforced for timecards;
                                                       # for residuals/adjustments, absence of a matching row => tax_pct 0
        tax_cents = round_half_up(gross_cents * jrow.tax_pct)
    input_set: "The PayLine being created; its Engagement (payee_type, production); the Production.jurisdictions table; the Performer (residency) for non-timecard lines"
    constants: {}
    precision: "integer cents, round_half_up"
    variants:
      - name: loan_out_gross
        when: "engagement.payee_type == LOAN_OUT"
        difference: "zero withholding regardless of jurisdiction; identical gross yields tax_cents == 0 instead of round_half_up(gross * tax_pct)"

  - name: garnishment_waterfall
    trigger: "PayBatch close (per performer, across that performer's lines in the batch)"
    algorithm: waterfall_allocation
    formula: |
      # Exclusions: LOAN_OUT engagements and GRIEVANCE_ADJUSTMENT lines are exempt from garnishment.
      # Process each performer's non-exempt lines in order (source work_date / window_start ASC, tie-break created_at ASC):
      disposable_run = 0
      for each line of the performer (in the order above):
          disposable = line.gross_cents - line.tax_cents
          line_cap   = round_half_up(disposable * MAX_GARNISH_PCT)
          remaining  = line_cap
          for order in performer's GarnishmentOrders where status == ACTIVE,
                       ordered by priority_rank ASC, tie-break created_at ASC:
              requested = order.fixed_amount_cents if set
                          else round_half_up(disposable * order.pct_of_disposable)   # per-order rounding BEFORE allocation
              allocated = min(requested, remaining)
              order.total_withheld_cents_pending += allocated   # applied to total_withheld_cents at disburse
              remaining -= allocated
          line.garnished_cents = line_cap - remaining
    input_set: "ACTIVE GarnishmentOrders of the performer; the performer's non-exempt PayLines in the batch being closed"
    constants:
      MAX_GARNISH_PCT: 0.25   # aggregate cap per line: total garnished on a line never exceeds 25% of that line's disposable income
    precision: "integer cents; round_half_up applied per order request BEFORE min() against remaining cap; the pinned order (round each request, then allocate) is load-bearing"

  - name: payline_net_calculation
    trigger: "PayBatch close (per PayLine, after gross and tax are known)"
    algorithm: constraint_propagation
    formula: |
      # Evaluation order is pinned to break the apparent circle
      # (garnishment cap depends on disposable, which depends on tax, which depends on gross):
      1. gross_cents  = source amount (timecard day_gross + CONFIRMED penalties | residual final_amount | grievance award)
      2. tax_cents    = jurisdiction_tax_calculation(gross_cents)
      3. disposable   = gross_cents - tax_cents
      4. garnished    = garnishment_waterfall(disposable)           # capped at round_half_up(disposable * 0.25)
      5. phw_cents    = phw_contribution_calculation(gross_cents)   # employer-side; NEVER subtracted from the line
      6. net_cents    = gross_cents - tax_cents - garnished_cents   # phw excluded by construction
    input_set: "One swept source (Timecard | ResidualObligation | GrievanceCase award) and its Engagement, Performer, UnionAgreement"
    constants: {}
    precision: "integer cents; each step rounds per its own rule before the next step consumes it"
    variants: []

  - name: phw_contribution_calculation
    trigger: "PayBatch close (per PayLine, step 5 of payline_net_calculation)"
    algorithm: aggregation
    formula: |
      pension = round_half_up(gross_cents * agreement.phw_pension_pct)
      health  = round_half_up(gross_cents * agreement.phw_health_pct)
      welfare = round_half_up(gross_cents * agreement.phw_welfare_pct)
      phw_cents = pension + health + welfare
    input_set: "The PayLine's gross_cents and the engagement's UnionAgreement PHW percentages"
    constants: {}
    precision: "integer cents; round_half_up per component BEFORE summing (pinned rounding order)"
    variants: []

  - name: residual_calculation
    trigger: "POST /payroll/residual-obligations (provisional variant) and POST /payroll/residual-obligations/{id}/calculate (final variant)"
    algorithm: tiered_pricing
    formula: |
      base_pct        = snapshot of agreement.residual_base_pct_by_market[reuse_market] taken at creation
      window_sequence = 1 + count of this engagement's ResidualObligations with the same reuse_market
                        and (window_start ASC earlier, tie-break created_at ASC)
      discount        = max(WINDOW_DISCOUNT_FLOOR, 1 - WINDOW_STEP_DISCOUNT * (window_sequence - 1))
      # Provisional (at creation):
      provisional_amount_cents = round_half_up(tier.day_rate_cents * base_pct)          # tier day rate stands in as the estimate base
      # Final (at calculate):
      final_amount_cents = round_half_up(reported_gross_receipts_cents * base_pct * discount)
    input_set: "The ResidualObligation; its Engagement's UnionAgreement (base_pct snapshot); sibling ResidualObligations of the same engagement + reuse_market for window_sequence; the engagement's rate tier (provisional base)"
    constants:
      WINDOW_STEP_DISCOUNT: 0.10   # each subsequent window for the same market discounts by 10 points
      WINDOW_DISCOUNT_FLOOR: 0.50  # discount never drops below 50%
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "creation (REPORTED state)"
        difference: "bases the estimate on the tier day rate instead of reported receipts; identical rows routinely differ between provisional and final (4500 vs 900000 in the standard fixture)"

  - name: remittance_aggregation
    trigger: "POST /payroll/remittance-reports (creation)"
    algorithm: aggregation
    formula: |
      lines = PayLines where pay_batch_id == report.pay_batch_id
              and engagement.union_agreement_id == report.union_agreement_id   # all statuses (batch already DISBURSED => all PAID)
      pension_cents = sum over lines of round_half_up(line.gross_cents * agreement.phw_pension_pct)
      health_cents  = sum over lines of round_half_up(line.gross_cents * agreement.phw_health_pct)
      welfare_cents = sum over lines of round_half_up(line.gross_cents * agreement.phw_welfare_pct)
      # per-line rounding half-up, then sum (same pinned order as phw_contribution_calculation);
      # therefore pension_cents + health_cents + welfare_cents == sum of line.phw_cents for matching lines
    input_set: "PayLines of the given batch filtered to engagements governed by the given UnionAgreement"
    constants: {}
    precision: "integer cents; round per line then sum"
    variants: []

  - name: performer_ytd_reconciliation
    trigger: "PayBatch disburse (per affected PayLine)"
    algorithm: aggregation
    formula: |
      performer.ytd_gross_cents     = sum of gross_cents over PayLines with status == PAID
                                      whose engagement.performer_id == performer.id
      performer.ytd_garnished_cents = sum of garnished_cents over the same set
      engagement.ytd_paid_cents     = sum of net_cents over PayLines with status == PAID
                                      whose engagement_id == engagement.id
      # Recomputed from the PAID set on every disburse (full recompute, not incremental),
      # so a recall before disburse never drifts: recall deletes UNPAID lines only.
    input_set: "PayLines with status == PAID, joined through Engagement to Performer"
    constants: {}
    precision: "integer cents, exact sums"
    variants: []

# =============================================================================
# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; first failure wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of the five declared roles; X-User-ID header present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Acting role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Every id referenced in the path exists, then every FK-style id field in the body (production_id, union_agreement_id, performer_id, engagement_id, supersedes_engagement_id, pay_batch_id, pay_line_id) exists; checked left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: state
    check: "Batch lifecycle gates: close requires status OPEN; approve requires CLOSED; recall and disburse require APPROVED"
    error_id: ERR_BATCH_INVALID_STATE
    http_status: 409
    applies_to: ["POST /payroll/pay-batches/{id}/close", "POST /payroll/pay-batches/{id}/approve", "POST /payroll/pay-batches/{id}/recall", "POST /payroll/pay-batches/{id}/disburse"]
  - priority: 5
    category: state
    check: "Timecard review gates: flag and approve require review_status SUBMITTED; revise requires review_status FLAGGED; approve additionally requires payment_status UNBATCHED"
    error_id: ERR_TIMECARD_INVALID_STATE
    http_status: 409
    applies_to: ["POST /payroll/timecards/{id}/flag", "POST /payroll/timecards/{id}/revise", "POST /payroll/timecards/{id}/approve"]
  - priority: 6
    category: state
    check: "Engagement gates: submit requires DRAFT; approve and reject require PENDING_APPROVAL"
    error_id: ERR_ENGAGEMENT_INVALID_STATE
    http_status: 409
    applies_to: ["POST /payroll/engagements/{id}/submit", "POST /payroll/engagements/{id}/approve", "POST /payroll/engagements/{id}/reject"]
  - priority: 7
    category: state
    check: "Residual gates: calculate requires REPORTED or DISPUTED; approve requires CALCULATED; dispute requires APPROVED"
    error_id: ERR_RESIDUAL_INVALID_STATE
    http_status: 409
    applies_to: ["POST /payroll/residual-obligations/{id}/calculate", "POST /payroll/residual-obligations/{id}/approve", "POST /payroll/residual-obligations/{id}/dispute"]
  - priority: 8
    category: state
    check: "Small-entity gates: waive requires PenaltyAssessment CONFIRMED; release requires GarnishmentOrder ACTIVE; remittance submit requires DRAFT, acknowledge requires SUBMITTED; grievance respond requires FILED, escalate requires UNDER_REVIEW, resolve requires UNDER_REVIEW or ESCALATED"
    error_id: ERR_RESOURCE_INVALID_STATE
    http_status: 409
    applies_to: ["POST /payroll/penalty-assessments/{id}/waive", "POST /payroll/garnishment-orders/{id}/release", "POST /payroll/remittance-reports/{id}/submit", "POST /payroll/remittance-reports/{id}/acknowledge", "POST /payroll/grievance-cases/{id}/respond", "POST /payroll/grievance-cases/{id}/escalate", "POST /payroll/grievance-cases/{id}/resolve"]
  - priority: 9
    category: state
    check: "Agreement gate: ratify requires UnionAgreement DRAFT"
    error_id: ERR_AGREEMENT_INVALID_STATE
    http_status: 409
    applies_to: ["POST /payroll/union-agreements/{id}/ratify"]
  - priority: 10
    category: business_safety
    check: "Segregation of duties: batch approver X-User-ID must differ from batch.created_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: ["POST /payroll/pay-batches/{id}/approve"]
  - priority: 11
    category: business_safety
    check: "Union compliance gate: engagement submit requires the referenced UnionAgreement.status == RATIFIED"
    error_id: ERR_AGREEMENT_NOT_RATIFIED
    http_status: 409
    applies_to: ["POST /payroll/engagements/{id}/submit"]
  - priority: 12
    category: business_safety
    check: "Timecard compliance gates: create and approve require Engagement.status == ACTIVE; create additionally requires the engagement's Production.status == SHOOTING"
    error_id: ERR_ENGAGEMENT_NOT_ACTIVE
    http_status: 409
    applies_to: ["POST /payroll/timecards", "POST /payroll/timecards/{id}/approve"]
  - priority: 13
    category: business_safety
    check: "Residual gates: create requires Engagement.status in {ACTIVE, WRAPPED}; calculate requires the engagement's UnionAgreement.status == RATIFIED"
    error_id: ERR_COMPLIANCE_STATE
    http_status: 409
    applies_to: ["POST /payroll/residual-obligations", "POST /payroll/residual-obligations/{id}/calculate"]
  - priority: 14
    category: business_safety
    check: "Production advance SHOOTING -> WRAPPED is blocked while any Engagement of the production has status in {PENDING_APPROVAL, AMENDMENT_PENDING} (ACTIVE engagements wrap via cascade)"
    error_id: ERR_PRODUCTION_HAS_OPEN_ENGAGEMENTS
    http_status: 409
    applies_to: ["POST /payroll/productions/{id}/advance"]
  - priority: 15
    category: business_temporal
    check: "Date shapes and containment: UnionAgreement effective_to > effective_from; Engagement end_date >= start_date; ResidualObligation window_end >= window_start; Timecard first_meal_in > first_meal_out and wrap_time > first_meal_in; Timecard.work_date inside engagement [start_date, end_date] (inclusive); timecard jurisdiction_code matches a production jurisdiction whose [valid_from, valid_to) covers work_date"
    error_id: ERR_INVALID_TEMPORAL
    http_status: 422
    applies_to: ["POST /payroll/union-agreements", "POST /payroll/engagements", "POST /payroll/residual-obligations", "POST /payroll/timecards", "POST /payroll/timecards/{id}/revise"]
  - priority: 16
    category: business_constraint
    check: "Agreement ratify rejects when another RATIFIED agreement with the same union_code has a half-open [effective_from, effective_to) window overlapping this one (other.effective_from < this.effective_to AND this.effective_from < other.effective_to); adjacency is allowed"
    error_id: ERR_AGREEMENT_WINDOW_OVERLAP
    http_status: 409
    applies_to: ["POST /payroll/union-agreements/{id}/ratify"]
  - priority: 17
    category: business_constraint
    check: "Engagement submit rejects performer double-booking: another Engagement with the same performer_id, status in {PENDING_APPROVAL, ACTIVE, AMENDMENT_PENDING}, closed-interval overlap (other.start_date <= this.end_date AND this.start_date <= other.end_date; a shared boundary date conflicts); the engagement named by supersedes_engagement_id is excluded"
    error_id: ERR_PERFORMER_DOUBLE_BOOKED
    http_status: 409
    applies_to: ["POST /payroll/engagements/{id}/submit"]
  - priority: 18
    category: business_constraint
    check: "Residual creation rejects closed-interval window overlap for the same engagement + reuse_market (other.window_start <= this.window_end AND this.window_start <= other.window_end; a shared boundary date conflicts)"
    error_id: ERR_RESIDUAL_WINDOW_OVERLAP
    http_status: 409
    applies_to: ["POST /payroll/residual-obligations"]
  - priority: 19
    category: business_constraint
    check: "One timecard per engagement per work_date"
    error_id: ERR_DUPLICATE_WORK_DATE
    http_status: 409
    applies_to: ["POST /payroll/timecards"]
  - priority: 20
    category: business_constraint
    check: "At most one PayBatch with status OPEN may exist at a time"
    error_id: ERR_OPEN_BATCH_EXISTS
    http_status: 409
    applies_to: ["POST /payroll/pay-batches"]
  - priority: 21
    category: business_referential
    check: "Engagement tier_code must exist in the referenced UnionAgreement.rate_tiers"
    error_id: ERR_TIER_NOT_FOUND
    http_status: 422
    applies_to: ["POST /payroll/engagements"]
  - priority: 22
    category: business_referential
    check: "Loan-out conditional fields: payee_type == LOAN_OUT requires loan_out_legal_name and loan_out_tax_id; payee_type == DIRECT forbids both"
    error_id: ERR_LOAN_OUT_FIELDS
    http_status: 422
    applies_to: ["POST /payroll/engagements"]
  - priority: 23
    category: business_referential
    check: "Garnishment spec: exactly one of pct_of_disposable / fixed_amount_cents must be provided"
    error_id: ERR_GARNISHMENT_SPEC_INVALID
    http_status: 422
    applies_to: ["POST /payroll/garnishment-orders"]
  - priority: 24
    category: business_referential
    check: "Residual reuse_market must have a base percentage in the engagement's agreement residual_base_pct_by_market"
    error_id: ERR_MARKET_BASE_PCT_MISSING
    http_status: 422
    applies_to: ["POST /payroll/residual-obligations"]
  - priority: 25
    category: business_fiscal
    check: "Batch close sweep set must be non-empty (eligible timecards or residuals exist)"
    error_id: ERR_BATCH_EMPTY
    http_status: 422
    applies_to: ["POST /payroll/pay-batches/{id}/close"]
  - priority: 26
    category: business_fiscal
    check: "Grievance resolve with awarded_amount_cents > 0 requires exactly one PayBatch with status OPEN to receive the adjustment line"
    error_id: ERR_NO_OPEN_BATCH
    http_status: 422
    applies_to: ["POST /payroll/grievance-cases/{id}/resolve"]
  - priority: 27
    category: state
    check: "Remittance creation requires the referenced PayBatch.status == DISBURSED (contributions are remitted only for money actually paid)"
    error_id: ERR_BATCH_NOT_DISBURSED
    http_status: 409
    applies_to: ["POST /payroll/remittance-reports"]
  - priority: 28
    category: business_constraint
    check: "Generic request-shape validation (missing required field, wrong type, unknown enum member, negative amounts) when no more specific rule above fired"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all"
  - priority: 29
    category: state
    check: "OCC: POST /payroll/engagements with supersedes_engagement_id set requires expected_engagement_version == the target engagement's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["POST /payroll/engagements"]

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
# All roles may call every GET endpoint (read surface is shared); mutations are
# role-gated per below. `as:` values in test recipes must be one of:
# PayrollAdmin | ProductionAccountant | PayrollClerk | PayrollSupervisor | UnionAuditor
endpoints:
  # --- UnionAgreement ---
  - { method: POST, path: "/payroll/union-agreements", description: "Ingest a union agreement with its rate-tier table and penalty/PHW constants; created DRAFT", roles: [PayrollAdmin], code: 201, input: [union_code, name, effective_from, effective_to, rate_tiers, meal_penalty_cents, rest_penalty_cents, turnaround_min_hours, phw_pension_pct, phw_health_pct, phw_welfare_pct, residual_base_pct_by_market], output: UnionAgreement, side_effects: ["status DRAFT"] }
  - { method: GET, path: "/payroll/union-agreements", description: "List agreements", roles: [PayrollAdmin, ProductionAccountant, PayrollClerk, PayrollSupervisor, UnionAuditor], code: 200, input: ["union_code?", "status?", "limit?", "offset?"], output: "UnionAgreement[]", side_effects: [] }
  - { method: POST, path: "/payroll/union-agreements/{id}/ratify", description: "Ratify a DRAFT agreement; rejects on half-open window overlap with another RATIFIED agreement of the same union_code", roles: [PayrollAdmin], code: 200, input: [], output: UnionAgreement, side_effects: ["DRAFT -> RATIFIED", "increments UnionAgreement.version by 1"] }

  # --- Production ---
  - { method: POST, path: "/payroll/productions", description: "Create a production with its shoot-location jurisdiction table", roles: [PayrollAdmin], code: 201, input: [title, production_company, union_agreement_id, production_type, jurisdictions], output: Production, side_effects: ["status PRE_PRODUCTION"] }
  - { method: GET, path: "/payroll/productions", description: "List productions", roles: [PayrollAdmin, ProductionAccountant, PayrollClerk, PayrollSupervisor, UnionAuditor], code: 200, input: ["union_agreement_id?", "status?", "limit?", "offset?"], output: "Production[]", side_effects: [] }
  - { method: GET, path: "/payroll/productions/{id}", description: "Read one production", roles: [PayrollAdmin, ProductionAccountant, PayrollClerk, PayrollSupervisor, UnionAuditor], code: 200, input: [], output: Production, side_effects: [] }
  - { method: POST, path: "/payroll/productions/{id}/advance", description: "Advance PRE_PRODUCTION -> SHOOTING -> WRAPPED -> ARCHIVED; WRAPPED blocked while engagements are open; wrapping cascades engagements ACTIVE/AMENDMENT_PENDING -> WRAPPED", roles: [PayrollAdmin], code: 200, input: [], output: Production, side_effects: ["Production status advance", "engagement wrap cascade", "increments Production.version by 1"] }

  # --- Performer ---
  - { method: POST, path: "/payroll/performers", description: "Register a performer", roles: [PayrollAdmin], code: 201, input: [legal_name, primary_union_code, tax_residency_state], output: Performer, side_effects: [] }
  - { method: GET, path: "/payroll/performers/{id}", description: "Read one performer (including YTD aggregates)", roles: [PayrollAdmin, ProductionAccountant, PayrollClerk, PayrollSupervisor, UnionAuditor], code: 200, input: [], output: Performer, side_effects: [] }

  # --- Engagement ---
  - { method: POST, path: "/payroll/engagements", description: "Create an engagement (contract) DRAFT; with supersedes_engagement_id it is an amendment and the target flips ACTIVE -> AMENDMENT_PENDING under OCC", roles: [ProductionAccountant], code: 201, input: [production_id, union_agreement_id, performer_id, tier_code, payee_type, "loan_out_legal_name?", "loan_out_tax_id?", weekly_guarantee_cents, guaranteed_days, start_date, end_date, "supersedes_engagement_id?", "expected_engagement_version?"], output: Engagement, side_effects: ["status DRAFT", "amendment side effect on supersede target (version bump)", "increments superseded Engagement.version by 1 when amending"] }
  - { method: GET, path: "/payroll/engagements", description: "List engagements", roles: [PayrollAdmin, ProductionAccountant, PayrollClerk, PayrollSupervisor, UnionAuditor], code: 200, input: ["production_id?", "performer_id?", "union_agreement_id?", "supersedes_engagement_id?", "status?", "limit?", "offset?"], output: "Engagement[]", side_effects: [] }
  - { method: GET, path: "/payroll/engagements/{id}", description: "Read one engagement", roles: [PayrollAdmin, ProductionAccountant, PayrollClerk, PayrollSupervisor, UnionAuditor], code: 200, input: [], output: Engagement, side_effects: [] }
  - { method: POST, path: "/payroll/engagements/{id}/submit", description: "DRAFT -> PENDING_APPROVAL; requires RATIFIED agreement; performer double-booking check", roles: [ProductionAccountant], code: 200, input: [], output: Engagement, side_effects: ["DRAFT -> PENDING_APPROVAL", "increments Engagement.version by 1"] }
  - { method: POST, path: "/payroll/engagements/{id}/approve", description: "PENDING_APPROVAL -> ACTIVE; production must be PRE_PRODUCTION or SHOOTING; amendment approval supersedes the target", roles: [PayrollSupervisor], code: 200, input: [], output: Engagement, side_effects: ["PENDING_APPROVAL -> ACTIVE", "supersede target AMENDMENT_PENDING -> SUPERSEDED", "increments Engagement.version by 1"] }
  - { method: POST, path: "/payroll/engagements/{id}/reject", description: "PENDING_APPROVAL -> DRAFT; a rejected amendment restores its target AMENDMENT_PENDING -> ACTIVE", roles: [PayrollSupervisor], code: 200, input: [], output: Engagement, side_effects: ["PENDING_APPROVAL -> DRAFT", "supersede target AMENDMENT_PENDING -> ACTIVE", "increments Engagement.version by 1"] }

  # --- Timecard ---
  - { method: POST, path: "/payroll/timecards", description: "Submit a timecard; computes worked/overtime minutes and provisional penalties; requires engagement ACTIVE, production SHOOTING, valid jurisdiction, unique work_date per engagement", roles: [ProductionAccountant], code: 201, input: [engagement_id, work_date, jurisdiction_code, call_time, first_meal_out, first_meal_in, wrap_time, scheduled_hours], output: Timecard, side_effects: ["review_status SUBMITTED, payment_status UNBATCHED", "computes worked_minutes, overtime_minutes, provisional_penalty_cents"] }
  - { method: GET, path: "/payroll/timecards", description: "List timecards", roles: [PayrollAdmin, ProductionAccountant, PayrollClerk, PayrollSupervisor, UnionAuditor], code: 200, input: ["engagement_id?", "review_status?", "payment_status?", "limit?", "offset?"], output: "Timecard[]", side_effects: [] }
  - { method: GET, path: "/payroll/timecards/{id}", description: "Read one timecard", roles: [PayrollAdmin, ProductionAccountant, PayrollClerk, PayrollSupervisor, UnionAuditor], code: 200, input: [], output: Timecard, side_effects: [] }
  - { method: POST, path: "/payroll/timecards/{id}/flag", description: "SUBMITTED -> FLAGGED for correction", roles: [PayrollClerk], code: 200, input: [flag_reason], output: Timecard, side_effects: ["review_status SUBMITTED -> FLAGGED", "increments Timecard.version by 1"] }
  - { method: POST, path: "/payroll/timecards/{id}/revise", description: "FLAGGED -> SUBMITTED with corrected timestamps; recomputes derived fields and provisional penalties", roles: [ProductionAccountant], code: 200, input: [call_time, first_meal_out, first_meal_in, wrap_time, scheduled_hours], output: Timecard, side_effects: ["review_status FLAGGED -> SUBMITTED", "recomputes worked_minutes, overtime_minutes, provisional_penalty_cents", "increments Timecard.version by 1"] }
  - { method: POST, path: "/payroll/timecards/{id}/approve", description: "SUBMITTED -> APPROVED; requires engagement ACTIVE; computes final day gross and creates CONFIRMED PenaltyAssessments", roles: [PayrollClerk], code: 200, input: [], output: Timecard, side_effects: ["review_status SUBMITTED -> APPROVED", "runs daily_gross_calculation", "runs penalty_assessment_calculation (final)", "creates PenaltyAssessment rows", "recomputes Engagement.accrued_penalty_cents", "increments Timecard.version by 1"] }

  # --- PenaltyAssessment ---
  - { method: GET, path: "/payroll/penalty-assessments", description: "List penalty assessments", roles: [PayrollAdmin, ProductionAccountant, PayrollClerk, PayrollSupervisor, UnionAuditor], code: 200, input: ["timecard_id?", "status?", "limit?", "offset?"], output: "PenaltyAssessment[]", side_effects: [] }
  - { method: GET, path: "/payroll/penalty-assessments/{id}", description: "Read one penalty assessment", roles: [PayrollAdmin, ProductionAccountant, PayrollClerk, PayrollSupervisor, UnionAuditor], code: 200, input: [], output: PenaltyAssessment, side_effects: [] }
  - { method: POST, path: "/payroll/penalty-assessments/{id}/waive", description: "CONFIRMED -> WAIVED with mandatory reason; recomputes engagement accrued penalties", roles: [PayrollSupervisor], code: 200, input: [waiver_reason], output: PenaltyAssessment, side_effects: ["CONFIRMED -> WAIVED", "recomputes Engagement.accrued_penalty_cents"] }

  # --- ResidualObligation ---
  - { method: POST, path: "/payroll/residual-obligations", description: "Report a reuse market window; snapshots base_pct, computes window_sequence and provisional amount; rejects overlapping closed windows per engagement+market", roles: [ProductionAccountant], code: 201, input: [engagement_id, reuse_market, window_start, window_end, reported_gross_receipts_cents], output: ResidualObligation, side_effects: ["status REPORTED", "pins base_pct snapshot", "computes window_sequence and provisional_amount_cents"] }
  - { method: GET, path: "/payroll/residual-obligations", description: "List residual obligations", roles: [PayrollAdmin, ProductionAccountant, PayrollClerk, PayrollSupervisor, UnionAuditor], code: 200, input: ["engagement_id?", "reuse_market?", "status?", "limit?", "offset?"], output: "ResidualObligation[]", side_effects: [] }
  - { method: GET, path: "/payroll/residual-obligations/{id}", description: "Read one residual obligation", roles: [PayrollAdmin, ProductionAccountant, PayrollClerk, PayrollSupervisor, UnionAuditor], code: 200, input: [], output: ResidualObligation, side_effects: [] }
  - { method: POST, path: "/payroll/residual-obligations/{id}/calculate", description: "REPORTED or DISPUTED -> CALCULATED; computes final_amount_cents from reported receipts x pinned base_pct x window discount; requires RATIFIED agreement", roles: [PayrollClerk], code: 200, input: [], output: ResidualObligation, side_effects: ["runs residual_calculation (final)", "increments ResidualObligation.version by 1"] }
  - { method: POST, path: "/payroll/residual-obligations/{id}/approve", description: "CALCULATED -> APPROVED (eligible for batch sweep)", roles: [PayrollSupervisor], code: 200, input: [], output: ResidualObligation, side_effects: ["CALCULATED -> APPROVED", "increments ResidualObligation.version by 1"] }
  - { method: POST, path: "/payroll/residual-obligations/{id}/dispute", description: "APPROVED -> DISPUTED with mandatory reason (union disputes the calculation)", roles: [UnionAuditor], code: 200, input: [dispute_reason], output: ResidualObligation, side_effects: ["APPROVED -> DISPUTED", "increments ResidualObligation.version by 1"] }

  # --- PayBatch / PayLine ---
  - { method: POST, path: "/payroll/pay-batches", description: "Open a pay batch; at most one OPEN batch at a time", roles: [PayrollClerk], code: 201, input: [period_label, cutoff_date], output: PayBatch, side_effects: ["status OPEN", "records created_by_user_id"] }
  - { method: GET, path: "/payroll/pay-batches/{id}", description: "Read one batch (including totals)", roles: [PayrollAdmin, ProductionAccountant, PayrollClerk, PayrollSupervisor, UnionAuditor], code: 200, input: [], output: PayBatch, side_effects: [] }
  - { method: POST, path: "/payroll/pay-batches/{id}/close", description: "OPEN -> CLOSED; sweeps eligible timecards and residuals into PayLines, running gross/tax/garnishment/PHW/net per line and batch totals", roles: [PayrollClerk], code: 200, input: [], output: PayBatch, side_effects: ["creates PayLines", "timecards UNBATCHED -> BATCHED", "residuals APPROVED -> BATCHED", "computes batch totals", "increments PayBatch.version by 1"] }
  - { method: POST, path: "/payroll/pay-batches/{id}/approve", description: "CLOSED -> APPROVED; approver must differ from creator (segregation of duties)", roles: [PayrollSupervisor], code: 200, input: [], output: PayBatch, side_effects: ["CLOSED -> APPROVED", "increments PayBatch.version by 1"] }
  - { method: POST, path: "/payroll/pay-batches/{id}/recall", description: "APPROVED -> OPEN; deletes pay lines, reverts sources, zeroes totals (compensating action)", roles: [PayrollSupervisor], code: 200, input: [], output: PayBatch, side_effects: ["deletes PayLines", "timecards BATCHED -> UNBATCHED", "residuals BATCHED -> APPROVED", "totals reset to 0", "increments PayBatch.version by 1"] }
  - { method: POST, path: "/payroll/pay-batches/{id}/disburse", description: "APPROVED -> DISBURSED; cascades PAID down pay lines to sources, recomputes engagement YTD and performer YTD, applies garnishment withholdings", roles: [PayrollSupervisor], code: 200, input: [], output: PayBatch, side_effects: ["PayLines UNPAID -> PAID", "timecards/residuals -> PAID", "recomputes Engagement.ytd_paid_cents", "recomputes Performer.ytd_gross_cents and ytd_garnished_cents", "updates GarnishmentOrder.total_withheld_cents", "increments PayBatch.version by 1"] }
  - { method: GET, path: "/payroll/pay-lines", description: "List pay lines", roles: [PayrollAdmin, ProductionAccountant, PayrollClerk, PayrollSupervisor, UnionAuditor], code: 200, input: ["pay_batch_id?", "engagement_id?", "source_type?", "limit?", "offset?"], output: "PayLine[]", side_effects: [] }
  - { method: GET, path: "/payroll/pay-lines/{id}", description: "Read one pay line", roles: [PayrollAdmin, ProductionAccountant, PayrollClerk, PayrollSupervisor, UnionAuditor], code: 200, input: [], output: PayLine, side_effects: [] }

  # --- GarnishmentOrder ---
  - { method: POST, path: "/payroll/garnishment-orders", description: "Enter a garnishment order against a performer; exactly one of pct_of_disposable / fixed_amount_cents", roles: [PayrollAdmin], code: 201, input: [performer_id, creditor_name, order_type, priority_rank, "pct_of_disposable?", "fixed_amount_cents?"], output: GarnishmentOrder, side_effects: ["status ACTIVE"] }
  - { method: GET, path: "/payroll/garnishment-orders", description: "List garnishment orders", roles: [PayrollAdmin, ProductionAccountant, PayrollClerk, PayrollSupervisor, UnionAuditor], code: 200, input: ["performer_id?", "status?", "limit?", "offset?"], output: "GarnishmentOrder[]", side_effects: [] }
  - { method: GET, path: "/payroll/garnishment-orders/{id}", description: "Read one garnishment order", roles: [PayrollAdmin, ProductionAccountant, PayrollClerk, PayrollSupervisor, UnionAuditor], code: 200, input: [], output: GarnishmentOrder, side_effects: [] }
  - { method: POST, path: "/payroll/garnishment-orders/{id}/release", description: "ACTIVE -> RELEASED; excluded from future batch waterfalls", roles: [PayrollAdmin], code: 200, input: [], output: GarnishmentOrder, side_effects: ["ACTIVE -> RELEASED", "increments GarnishmentOrder.version by 1"] }

  # --- RemittanceReport ---
  - { method: POST, path: "/payroll/remittance-reports", description: "Aggregate PHW contributions of a DISBURSED batch for one union agreement", roles: [PayrollClerk], code: 201, input: [pay_batch_id, union_agreement_id], output: RemittanceReport, side_effects: ["runs remittance_aggregation", "status DRAFT"] }
  - { method: GET, path: "/payroll/remittance-reports", description: "List remittance reports", roles: [PayrollAdmin, ProductionAccountant, PayrollClerk, PayrollSupervisor, UnionAuditor], code: 200, input: ["pay_batch_id?", "union_agreement_id?", "status?", "limit?", "offset?"], output: "RemittanceReport[]", side_effects: [] }
  - { method: GET, path: "/payroll/remittance-reports/{id}", description: "Read one remittance report", roles: [PayrollAdmin, ProductionAccountant, PayrollClerk, PayrollSupervisor, UnionAuditor], code: 200, input: [], output: RemittanceReport, side_effects: [] }
  - { method: POST, path: "/payroll/remittance-reports/{id}/submit", description: "DRAFT -> SUBMITTED to the guild fund", roles: [PayrollClerk], code: 200, input: [], output: RemittanceReport, side_effects: ["DRAFT -> SUBMITTED", "increments RemittanceReport.version by 1"] }
  - { method: POST, path: "/payroll/remittance-reports/{id}/acknowledge", description: "SUBMITTED -> ACKNOWLEDGED (fund confirmed receipt)", roles: [PayrollAdmin], code: 200, input: [], output: RemittanceReport, side_effects: ["SUBMITTED -> ACKNOWLEDGED", "increments RemittanceReport.version by 1"] }

  # --- GrievanceCase ---
  - { method: POST, path: "/payroll/grievance-cases", description: "Union files a grievance against an engagement (optionally a specific pay line)", roles: [UnionAuditor], code: 201, input: [engagement_id, "pay_line_id?", category, claimed_amount_cents, description], output: GrievanceCase, side_effects: ["status FILED", "records filed_by_user_id"] }
  - { method: GET, path: "/payroll/grievance-cases", description: "List grievance cases", roles: [PayrollAdmin, ProductionAccountant, PayrollClerk, PayrollSupervisor, UnionAuditor], code: 200, input: ["engagement_id?", "pay_line_id?", "status?", "limit?", "offset?"], output: "GrievanceCase[]", side_effects: [] }
  - { method: GET, path: "/payroll/grievance-cases/{id}", description: "Read one grievance case", roles: [PayrollAdmin, ProductionAccountant, PayrollClerk, PayrollSupervisor, UnionAuditor], code: 200, input: [], output: GrievanceCase, side_effects: [] }
  - { method: POST, path: "/payroll/grievance-cases/{id}/respond", description: "FILED -> UNDER_REVIEW with a response note", roles: [PayrollClerk], code: 200, input: [response_note], output: GrievanceCase, side_effects: ["FILED -> UNDER_REVIEW", "increments GrievanceCase.version by 1"] }
  - { method: POST, path: "/payroll/grievance-cases/{id}/escalate", description: "UNDER_REVIEW -> ESCALATED (union escalates to arbitration track)", roles: [UnionAuditor], code: 200, input: [], output: GrievanceCase, side_effects: ["UNDER_REVIEW -> ESCALATED", "increments GrievanceCase.version by 1"] }
  - { method: POST, path: "/payroll/grievance-cases/{id}/resolve", description: "UNDER_REVIEW or ESCALATED -> RESOLVED; a positive award creates a GRIEVANCE_ADJUSTMENT pay line in the OPEN batch", roles: [PayrollSupervisor], code: 200, input: [awarded_amount_cents], output: GrievanceCase, side_effects: ["sets awarded_amount_cents", "creates adjustment PayLine in the OPEN batch when award > 0", "recomputes Engagement.accrued_adjustment_cents", "increments GrievanceCase.version by 1"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or missing X-User-ID" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK id does not exist" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, wrong type, unknown enum member, or negative amount; no more specific rule fired" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_engagement_version != the supersede target's current Engagement.version (OCC)" }
  - { id: ERR_BATCH_INVALID_STATE, http: 409, condition: "Batch not in the state required by close/approve/recall/disburse (OPEN / CLOSED / APPROVED / APPROVED respectively)" }
  - { id: ERR_TIMECARD_INVALID_STATE, http: 409, condition: "Timecard review_status (or payment_status) does not permit flag/revise/approve" }
  - { id: ERR_ENGAGEMENT_INVALID_STATE, http: 409, condition: "Engagement not in the state required by submit/approve/reject" }
  - { id: ERR_RESIDUAL_INVALID_STATE, http: 409, condition: "Residual not in the state required by calculate/approve/dispute" }
  - { id: ERR_RESOURCE_INVALID_STATE, http: 409, condition: "Penalty/garnishment/remittance/grievance not in the state required by waive/release/submit/acknowledge/respond/escalate/resolve" }
  - { id: ERR_AGREEMENT_INVALID_STATE, http: 409, condition: "Ratify target is not DRAFT" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Batch approver's X-User-ID equals batch.created_by_user_id" }
  - { id: ERR_AGREEMENT_NOT_RATIFIED, http: 409, condition: "Engagement submit while the referenced UnionAgreement is still DRAFT" }
  - { id: ERR_ENGAGEMENT_NOT_ACTIVE, http: 409, condition: "Timecard create/approve while engagement is not ACTIVE (or production not SHOOTING, for create)" }
  - { id: ERR_COMPLIANCE_STATE, http: 409, condition: "Residual create requires engagement ACTIVE|WRAPPED; residual calculate requires governing agreement RATIFIED" }
  - { id: ERR_PRODUCTION_HAS_OPEN_ENGAGEMENTS, http: 409, condition: "Advance SHOOTING -> WRAPPED while engagements remain PENDING_APPROVAL or AMENDMENT_PENDING" }
  - { id: ERR_INVALID_TEMPORAL, http: 422, condition: "Date shape/containment failure: inverted windows, work_date outside engagement, jurisdiction not valid at work_date, meal/wrap ordering" }
  - { id: ERR_AGREEMENT_WINDOW_OVERLAP, http: 409, condition: "Ratify would create overlapping half-open RATIFIED windows for the same union_code" }
  - { id: ERR_PERFORMER_DOUBLE_BOOKED, http: 409, condition: "Engagement submit: performer already engaged on a closed-interval-overlapping engagement in {PENDING_APPROVAL, ACTIVE, AMENDMENT_PENDING} (supersede target excluded)" }
  - { id: ERR_RESIDUAL_WINDOW_OVERLAP, http: 409, condition: "Residual window closed-interval overlap for the same engagement + reuse_market" }
  - { id: ERR_DUPLICATE_WORK_DATE, http: 409, condition: "A timecard already exists for this engagement + work_date" }
  - { id: ERR_OPEN_BATCH_EXISTS, http: 409, condition: "PayBatch create while another batch is OPEN" }
  - { id: ERR_TIER_NOT_FOUND, http: 422, condition: "Engagement tier_code absent from the agreement's rate_tiers" }
  - { id: ERR_LOAN_OUT_FIELDS, http: 422, condition: "loan_out_legal_name / loan_out_tax_id missing on LOAN_OUT, or present on DIRECT" }
  - { id: ERR_GARNISHMENT_SPEC_INVALID, http: 422, condition: "Garnishment order sets both or neither of pct_of_disposable / fixed_amount_cents" }
  - { id: ERR_MARKET_BASE_PCT_MISSING, http: 422, condition: "Residual reuse_market has no base percentage in the engagement's agreement" }
  - { id: ERR_BATCH_EMPTY, http: 422, condition: "Batch close with an empty sweep set" }
  - { id: ERR_NO_OPEN_BATCH, http: 422, condition: "Grievance resolve with awarded_amount_cents > 0 while no batch is OPEN" }
  - { id: ERR_BATCH_NOT_DISBURSED, http: 409, condition: "Remittance creation against a batch that is not DISBURSED" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PayrollAdmin
    description: "Payroll company administrator: owns union agreement ingestion, productions, performers, garnishment orders, and fund acknowledgements"
    identity: opaque
    exclusive_operations: ["POST /payroll/union-agreements", "POST /payroll/union-agreements/{id}/ratify", "POST /payroll/productions", "POST /payroll/productions/{id}/advance", "POST /payroll/performers", "POST /payroll/garnishment-orders", "POST /payroll/garnishment-orders/{id}/release", "POST /payroll/remittance-reports/{id}/acknowledge"]
    shared_operations: ["all GET endpoints"]
  - name: ProductionAccountant
    description: "Production-side accountant: creates engagements and submits/revises timecards and residual reports"
    identity: opaque
    exclusive_operations: ["POST /payroll/engagements", "POST /payroll/engagements/{id}/submit", "POST /payroll/timecards", "POST /payroll/timecards/{id}/revise", "POST /payroll/residual-obligations"]
    shared_operations: ["all GET endpoints"]
  - name: PayrollClerk
    description: "Payroll company clerk: flags and approves timecards, calculates residuals, creates/closes batches, drafts remittances, responds to grievances; may never approve a batch"
    identity: opaque
    exclusive_operations: ["POST /payroll/timecards/{id}/flag", "POST /payroll/timecards/{id}/approve", "POST /payroll/residual-obligations/{id}/calculate", "POST /payroll/pay-batches", "POST /payroll/pay-batches/{id}/close", "POST /payroll/remittance-reports", "POST /payroll/remittance-reports/{id}/submit", "POST /payroll/grievance-cases/{id}/respond"]
    shared_operations: ["all GET endpoints"]
  - name: PayrollSupervisor
    description: "Payroll company supervisor: approves engagements and batches, recalls and disburses batches, waives penalties, resolves grievances; segregation of duties blocks approving a batch created by the same user"
    identity: opaque
    exclusive_operations: ["POST /payroll/engagements/{id}/approve", "POST /payroll/engagements/{id}/reject", "POST /payroll/penalty-assessments/{id}/waive", "POST /payroll/residual-obligations/{id}/approve", "POST /payroll/pay-batches/{id}/approve", "POST /payroll/pay-batches/{id}/recall", "POST /payroll/pay-batches/{id}/disburse", "POST /payroll/grievance-cases/{id}/resolve"]
    shared_operations: ["all GET endpoints"]
  - name: UnionAuditor
    description: "Guild/union auditor: read access to everything; files and escalates grievances; disputes residuals"
    identity: opaque
    exclusive_operations: ["POST /payroll/grievance-cases", "POST /payroll/grievance-cases/{id}/escalate", "POST /payroll/residual-obligations/{id}/dispute"]
    shared_operations: ["all GET endpoints"]
