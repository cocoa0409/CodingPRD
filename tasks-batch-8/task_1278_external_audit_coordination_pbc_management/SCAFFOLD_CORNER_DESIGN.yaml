      - name: fee_change_self_approval_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_FEE_CHANGE_SELF_APPROVAL]
        distinguishing_aspect: "ExternalAuditor who proposed a fee change cannot also resolve it; the same party is rejected."
