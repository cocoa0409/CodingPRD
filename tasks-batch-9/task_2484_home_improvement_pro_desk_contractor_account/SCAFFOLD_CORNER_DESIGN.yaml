      - name: accepted_quote_is_terminal_and_rejects_a_further_counter_offer
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.JobQuote.terminal_states
          - calculations.quote_negotiation_rollup
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "The whole negotiation runs to ACCEPTED (term clamped to the MEMBER ceiling: min(30, 15) = 15 days, term_end 2026-08-16T00:00:00Z, depth 0.2496) and a counter-offer against that terminal state returns ERR_INVALID_STATE 409 with no field movement."
        test_recipe:
          setup:
            - "Store HD-101 stocks SHINGLE-BUNDLE at 1999; MEMBER account; quote with one 8-unit line, submitted."
            - "Clock stays at 2026-08-01T00:00:00Z throughout."
          setup_api_calls:
