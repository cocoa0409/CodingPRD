            - call: "POST /alerts/${alert_id}/promote"
              payload: {}
              as: SocAnalyst
              captures: { incident_id: $.data.promoted_incident_id }
            - call: "POST /incidents/${incident_id}/escalate"
              payload: {}
              as: EngagementLead
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", kind: "VULN_SCAN", authorized_window_start: "2026-03-01T00:00:00Z", authorized_window_end: "2026-04-01T00:00:00Z", estimated_hours: 50, scope_asset_ids: ["${asset_id}"] }
              as: EngagementLead
              captures: { eng_id: $.data.id }
          trigger:
            - call: "POST /engagements/${eng_id}/authorize"
              payload: {}
              as: ClientContact
              captures: { err: $.data.error_id }
          assert:
            - "authorize returns error_id == ERR_POSTURE_LOCKDOWN (priority 8 safety beats priority 18 fiscal)"

      - name: priority_conflict_state_beats_segregation_safety_on_retest
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: |
          Pair state (priority 7, ERR_INVALID_STATE) vs business_safety segregation
          (priority 9, ERR_SEGREGATION_OF_DUTIES): a retest issued by the same user who
          submitted the finding AND while the finding is still OPEN (not REMEDIATION_SUBMITTED)
          returns ERR_INVALID_STATE, because the state precondition (priority 7) wins over
          the segregation check (priority 9).
        test_recipe:
          setup:
            - "Client; COMPLETED scan; Finding submitted by user 'lead-x' acting as EngagementLead, left in OPEN."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Seg Co", tier: "ESSENTIAL", retainer_hours_per_period: 100 }
