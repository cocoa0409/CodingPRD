# =============================================================================
# Task 1303 — Construction Equipment Fleet & Utilization
# Contractor equipment division: owned vs rented decision, internal rental
# rates & job-cost allocation, utilization tracking & idle redeployment,
# engine-hour maintenance & mechanic dispatch, lowboy transport scheduling,
# damage & abuse chargeback, fuel & telematics, replacement/disposal.
# =============================================================================

scenario: |
  Construction Equipment Fleet & Utilization (contractor equipment division):
  owned vs rented decision by project duration, internal rental rate & job cost
  allocation, utilization tracking & idle equipment redeployment, maintenance
  schedule by engine hours & mechanic dispatch, transport/lowboy scheduling
  between jobsites, damage & abuse chargeback to project, fuel & telematics
  monitoring, replacement/disposal & residual value

domain_name: equipment-fleet
api_prefix: /fleet

# =============================================================================
# §0.3 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (11 entities)
# =============================================================================
entities:
  - name: EquipmentClass
    parent: null
    common_fields: true
    fields:
      - { name: class_code, type: string, source: input, description: "Unique class code, e.g. EXC-320" }
      - { name: daily_rate_cents, type: integer, source: input, description: "Internal rental daily rate in cents for owned units of this class; >= 0" }
      - { name: external_daily_rate_cents, type: integer, source: input, description: "External rental market daily rate in cents used by own-vs-rent comparison; >= 0" }
      - { name: weekend_multiplier_bp, type: integer, source: input, description: "Weekend-day rate multiplier in basis points, e.g. 5000 = 0.5x; >= 0" }
      - { name: idle_day_multiplier_bp, type: integer, source: input, description: "Multiplier in basis points applied to days where the unit logged 0 engine hours while on rent; >= 0" }
      - { name: service_interval_hours, type: integer, source: input, description: "Engine hours between preventive services; > 0" }
      - { name: idle_alert_utilization_bp, type: integer, source: input, description: "Utilization threshold in basis points; a closed assignment whose billing-basis utilization is >= this value counts as well-utilized for redeployment scoring; 0..10000" }
      - { name: expected_life_hours, type: integer, source: input, description: "Expected economic life in engine hours for hour-based depreciation; > 0" }
      - { name: salvage_value_cents, type: integer, source: input, description: "Salvage floor for residual value in cents; >= 0" }

  - name: Equipment
    parent: null
    common_fields: true
    fields:
      - { name: unit_tag, type: string, source: input, description: "Unique human-readable unit tag, e.g. UNIT-1042" }
      - { name: class_id, type: string, source: input, description: "FK -> EquipmentClass.id; the rate/interval class of this unit" }
      - { name: ownership, type: enum, source: input, description: "OWNED | RENTED" }
      - { name: acquisition_cost_cents, type: integer, source: input, description: "Purchase cost in cents for OWNED units; required and > 0 for OWNED, must be 0 for RENTED" }
      - { name: acquisition_date, type: string, source: input, description: "ISO date (YYYY-MM-DD) the unit entered the fleet; used by straight-line residual value" }
      - { name: useful_life_months, type: integer, source: input, description: "Straight-line depreciation life in months; required and > 0 for OWNED, ignored for RENTED" }
      - { name: availability_status, type: enum, source: system, description: "IDLE | RESERVED | ON_RENT | IN_TRANSIT | DOWN | DISPOSED — parallel dimension 1" }
      - { name: maintenance_status, type: enum, source: system, description: "SERVICE_OK | SERVICE_DUE | IN_SERVICE — parallel dimension 2" }
      - { name: engine_hours_milli, type: integer, source: computed, description: "Current engine-hour meter in milli-hours (hour * 1000), monotonically derived from accepted telematics readings minus voided adjustments; >= 0" }
      - { name: hours_at_last_service_milli, type: integer, source: system, description: "Engine-hour meter (milli-hours) at the moment the last WorkOrder completed; 0 at creation" }
      - { name: hours_since_service_milli, type: integer, source: computed, description: "engine_hours_milli - hours_at_last_service_milli" }
      - { name: current_project_id, type: string, source: system, description: "FK -> Project.id; set while an ACTIVE assignment exists, null otherwise; nullable" }
      - { name: current_site_id, type: string, source: system, description: "FK -> Project.id; physical location of the unit (last delivered jobsite or home yard project); nullable" }
      - { name: disposed_at, type: datetime, source: system, description: "Timestamp of disposal; null until DISPOSED; nullable" }
      - { name: residual_value_cents, type: integer, source: computed, description: "Current residual value per residual_value calc (variant by ownership and disposal context); null until DISPOSED; nullable" }

  - name: Project
    parent: null
    common_fields: true
    fields:
      - { name: project_code, type: string, source: input, description: "Unique project code, e.g. PRJ-A" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: status, type: enum, source: system, description: "OPEN | SUSPENDED | CLOSED" }
      - { name: equipment_budget_cents, type: integer, source: input, description: "Cap on cumulative equipment charges (rental allocations + posted chargebacks); >= 0" }
      - { name: billed_total_cents, type: integer, source: computed, description: "Sum of posted AssignmentCharge.allocated_cents for assignments of this project + posted DamageReport.confirmed_charge_cents - voided chargebacks; >= 0 invariant" }
      - { name: active_assignment_count, type: integer, source: computed, description: "Count of assignments of this project in ACTIVE state" }

  - name: Assignment
    parent: null
    common_fields: true
    fields:
      - { name: equipment_id, type: string, source: input, description: "FK -> Equipment.id; unit being assigned" }
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; jobsite receiving the unit" }
      - { name: start_date, type: string, source: input, description: "ISO date (YYYY-MM-DD), inclusive interval start" }
      - { name: end_date, type: string, source: input, description: "ISO date (YYYY-MM-DD), exclusive interval end; must be > start_date" }
      - { name: status, type: enum, source: system, description: "RESERVED | ACTIVE | SUSPENDED | CLOSED | CANCELLED" }
      - { name: activated_at, type: datetime, source: system, description: "Timestamp of activation; null until ACTIVE; nullable" }
      - { name: closed_at, type: datetime, source: system, description: "Timestamp of close; null until CLOSED; nullable" }
      - { name: billable_days, type: integer, source: computed, description: "Calendar days in [start_date, min(end_date, close_date)) that are chargeable per rental_allocation; 0 until CLOSED" }
      - { name: idle_days, type: integer, source: computed, description: "Chargeable days on which accepted telematics logged 0 engine hours; 0 until CLOSED" }
      - { name: engine_hours_billed_milli, type: integer, source: computed, description: "Engine hours (milli) logged by accepted readings within the chargeable window; 0 until CLOSED" }
      - { name: utilization_elapsed_bp, type: integer, source: computed, description: "Elapsed-variant utilization in basis points, per utilization_rate (ELAPSED variant); null until CLOSED; nullable" }
      - { name: utilization_billing_bp, type: integer, source: computed, description: "Billing-variant utilization in basis points, per utilization_rate (BILLING variant); null until CLOSED; nullable" }
      - { name: close_reason, type: enum, source: system, description: "COMPLETED | EARLY_RETURN | EQUIPMENT_DOWN | PROJECT_CLOSED | REDEPLOYED; null until CLOSED or CANCELLED; nullable" }

  - name: AssignmentCharge
    parent: null
    common_fields: false
    fields:
      - { name: assignment_id, type: string, source: system, description: "FK -> Assignment.id; the closed assignment this charge belongs to" }
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; denormalized for ledger queries" }
      - { name: allocated_cents, type: integer, source: computed, description: "Internal rental allocation per rental_allocation calc; posted to project ledger at assignment close" }
      - { name: own_cost_cents, type: integer, source: computed, description: "Owned-basis cost per own_vs_rent (OWN variant) over the same window" }
      - { name: rent_cost_cents, type: integer, source: computed, description: "External-rental cost per own_vs_rent (RENT variant) over the same window" }
      - { name: cheaper_variant, type: enum, source: computed, description: "OWN | RENT | TIE — which own_vs_rent variant is cheaper for this window" }

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: equipment_id, type: string, source: input, description: "FK -> Equipment.id; unit to service" }
      - { name: kind, type: enum, source: input, description: "PREVENTIVE | REPAIR" }
      - { name: status, type: enum, source: system, description: "OPEN | DISPATCHED | IN_PROGRESS | COMPLETED | CANCELLED" }
      - { name: trigger_hours_milli, type: integer, source: system, description: "Equipment engine-hours meter (milli) at creation; diagnostic" }
      - { name: mechanic_id, type: string, source: system, description: "FK -> Mechanic.id; assigned at dispatch; null until DISPATCHED; nullable" }
      - { name: dispatched_at, type: datetime, source: system, description: "Timestamp of dispatch; null until DISPATCHED; nullable" }
      - { name: completed_at, type: datetime, source: system, description: "Timestamp of completion; null until COMPLETED; nullable" }
      - { name: notes, type: string, source: input, description: "Free-text notes; optional", default: "" }

  - name: Mechanic
    parent: null
    common_fields: true
    fields:
      - { name: mechanic_code, type: string, source: input, description: "Unique mechanic code, e.g. MECH-7" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | ON_JOB | OFF_DUTY" }
      - { name: home_project_id, type: string, source: input, description: "FK -> Project.id; mechanic's home yard/jobsite" }
      - { name: active_work_order_count, type: integer, source: computed, description: "Count of WorkOrders in DISPATCHED or IN_PROGRESS assigned to this mechanic" }

  - name: TransportJob
    parent: null
    common_fields: true
    fields:
      - { name: equipment_id, type: string, source: input, description: "FK -> Equipment.id; unit being hauled" }
      - { name: from_project_id, type: string, source: input, description: "FK -> Project.id; origin jobsite" }
      - { name: to_project_id, type: string, source: input, description: "FK -> Project.id; destination jobsite; must differ from from_project_id" }
      - { name: lowboy_id, type: string, source: input, description: "FK -> Lowboy.id; trailer performing the haul" }
      - { name: depart_at, type: datetime, source: input, description: "Planned departure timestamp (closed interval start)" }
      - { name: arrive_at, type: datetime, source: input, description: "Planned arrival timestamp (closed interval end); must be > depart_at" }
      - { name: status, type: enum, source: system, description: "PLANNED | EN_ROUTE | DELIVERED | CANCELLED" }
      - { name: assignment_id, type: string, source: input, description: "FK -> Assignment.id; the redeployment assignment this haul serves; optional, nullable", default: null }

  - name: Lowboy
    parent: null
    common_fields: true
    fields:
      - { name: lowboy_code, type: string, source: input, description: "Unique trailer code, e.g. LB-3" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | ON_Haul | OUT_OF_SERVICE" }
      - { name: capacity_units, type: integer, source: input, description: "Max simultaneous hauled units; must be 1 in v1 (single-unit trailer)" }

  - name: TelematicsReading
    parent: null
    common_fields: false
    fields:
      - { name: equipment_id, type: string, source: input, description: "FK -> Equipment.id; reporting unit" }
      - { name: recorded_date, type: string, source: input, description: "ISO date (YYYY-MM-DD) the reading applies to (service-local day)" }
      - { name: engine_hours_delta_milli, type: integer, source: input, description: "Engine hours accumulated on recorded_date in milli-hours; 0..24000" }
      - { name: fuel_used_milliliters, type: integer, source: input, description: "Fuel consumed on recorded_date in milliliters; >= 0" }
      - { name: status, type: enum, source: system, description: "ACCEPTED | VOIDED" }
      - { name: void_reason, type: string, source: input, description: "Required when voiding; null otherwise; nullable", default: null }

  - name: DamageReport
    parent: null
    common_fields: true
    fields:
      - { name: equipment_id, type: string, source: input, description: "FK -> Equipment.id; damaged unit" }
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; project charged (must equal equipment.current_project_id at filing)" }
      - { name: description, type: string, source: input, description: "Free-text damage description" }
      - { name: abuse_flag, type: boolean, source: input, description: "true = operator abuse (abuse multiplier applies); false = accidental" }
      - { name: line_items, type: array, source: input, description: "Array of {description, amount_cents} repair line items; 1..20 items, each amount_cents >= 0" }
      - { name: status, type: enum, source: system, description: "FILED | ASSESSED | DISPUTED | CONFIRMED | VOIDED" }
      - { name: assessed_charge_cents, type: integer, source: computed, description: "Charge per damage_chargeback at ASSESS time; null until ASSESSED; nullable" }
      - { name: confirmed_charge_cents, type: integer, source: computed, description: "Final posted charge per damage_chargeback at CONFIRM time; null until CONFIRMED; nullable" }
      - { name: dispute_note, type: string, source: input, description: "Required on DISPUTE; null otherwise; nullable", default: null }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Equipment
    field: availability_status
    initial_state: IDLE
    terminal_states: [DISPOSED]
    transitions:
      - from: IDLE
        to: RESERVED
        trigger: "POST /fleet/assignments (create)"
        actor: FleetAdmin
        preconditions:
          - "equipment.availability_status == IDLE"
          - "equipment.maintenance_status == SERVICE_OK"
          - "No overlapping non-terminal Assignment on this equipment (half-open interval test)"
        side_effects:
          - "assignment created in RESERVED"
          - "increments Equipment.version by 1"
      - from: RESERVED
        to: ON_RENT
        trigger: "POST /fleet/assignments/{id}/activate"
        actor: FleetAdmin
        preconditions:
          - "assignment.status == RESERVED"
          - "equipment.availability_status == RESERVED"
          - "equipment.maintenance_status == SERVICE_OK"
          - "project.status == OPEN"
          - "project.billed_total_cents + projected first-day charge <= project.equipment_budget_cents"
        side_effects:
          - "assignment.status -> ACTIVE, activated_at set"
          - "equipment.current_project_id = assignment.project_id"
          - "equipment.current_site_id = assignment.project_id"
          - "increments Equipment.version by 1"
      - from: ON_RENT
        to: IDLE
        trigger: "POST /fleet/assignments/{id}/close"
        actor: FleetAdmin
        preconditions:
          - "assignment.status == ACTIVE"
          - "No PLANNED or EN_ROUTE TransportJob references this assignment"
        side_effects:
          - "assignment.status -> CLOSED, close_reason set, closed_at set"
          - "rental_allocation computed; AssignmentCharge row created and posted to project.billed_total_cents"
          - "own_vs_rent computed on the charge window; cheaper_variant stored"
          - "utilization_rate (both variants) computed and stored on the assignment"
          - "equipment.current_project_id cleared; current_site_id unchanged"
          - "increments Equipment.version by 1"
      - from: ON_RENT
        to: DOWN
        trigger: "POST /fleet/equipment/{id}/mark-down"
        actor: FleetAdmin
        preconditions:
          - "equipment.availability_status == ON_RENT"
        side_effects:
          - "All ACTIVE assignments of this equipment -> SUSPENDED"
          - "increments Equipment.version by 1"
      - from: IDLE
        to: DOWN
        trigger: "POST /fleet/equipment/{id}/mark-down"
        actor: FleetAdmin
        preconditions:
          - "equipment.availability_status == IDLE"
        side_effects:
          - "increments Equipment.version by 1"
      - from: DOWN
        to: IDLE
        trigger: "POST /fleet/work-orders/{id}/complete (kind=REPAIR)"
        actor: Mechanic
        preconditions:
          - "work_order.status == IN_PROGRESS"
          - "work_order.equipment_id == this equipment"
          - "work_order.mechanic_id == acting mechanic (X-User-ID)"
        side_effects:
          - "work_order.status -> COMPLETED, completed_at set"
          - "equipment.hours_at_last_service_milli = equipment.engine_hours_milli"
          - "equipment.maintenance_status -> SERVICE_OK"
          - "equipment.availability_status -> IDLE"
          - "mechanic.active_work_order_count decremented; mechanic.status recomputed"
          - "Each SUSPENDED assignment of this equipment, in created_at ASC order: if project.status == OPEN then assignment -> ACTIVE (close_reason unaffected) and equipment -> ON_RENT for the first such assignment only; remaining SUSPENDED assignments stay SUSPENDED"
          - "increments Equipment.version by 1"
      - from: IDLE
        to: IN_TRANSIT
        trigger: "POST /fleet/transport-jobs (create)"
        actor: Dispatcher
        preconditions:
          - "equipment.availability_status == IDLE"
          - "equipment.current_site_id == transport_job.from_project_id"
        side_effects:
          - "transport_job created in PLANNED"
          - "increments Equipment.version by 1"
      - from: IN_TRANSIT
        to: IDLE
        trigger: "POST /fleet/transport-jobs/{id}/deliver"
        actor: Dispatcher
        preconditions:
          - "transport_job.status == EN_ROUTE"
          - "transport_job.equipment_id == this equipment"
        side_effects:
          - "transport_job.status -> DELIVERED"
          - "equipment.current_site_id = transport_job.to_project_id"
          - "lowboy.status -> AVAILABLE"
          - "increments Equipment.version by 1"
      - from: IDLE
        to: DISPOSED
        trigger: "POST /fleet/equipment/{id}/dispose"
        actor: FleetAdmin
        preconditions:
          - "equipment.availability_status == IDLE"
          - "equipment.ownership == OWNED"
          - "No OPEN or DISPATCHED or IN_PROGRESS WorkOrder for this equipment"
          - "No PLANNED or EN_ROUTE TransportJob for this equipment"
          - "No FILED or ASSESSED or DISPUTED DamageReport for this equipment"
        side_effects:
          - "residual_value computed (variant per disposal_method) and stored"
          - "equipment.disposed_at set"
          - "increments Equipment.version by 1"

  - entity: Equipment
    field: maintenance_status
    initial_state: SERVICE_OK
    terminal_states: []
    transitions:
      - from: SERVICE_OK
        to: SERVICE_DUE
        trigger: "system (telematics ingest crosses service threshold)"
        actor: system
        preconditions:
          - "equipment.hours_since_service_milli >= class.service_interval_hours * 1000 after applying the reading"
        side_effects:
          - "A PREVENTIVE WorkOrder is auto-created in OPEN for this equipment (trigger_hours_milli = engine_hours_milli) if none exists in OPEN/DISPATCHED/IN_PROGRESS"
      - from: SERVICE_DUE
        to: IN_SERVICE
        trigger: "POST /fleet/work-orders/{id}/start"
        actor: Mechanic
        preconditions:
          - "work_order.status == DISPATCHED"
          - "work_order.equipment_id == this equipment"
        side_effects:
          - "work_order.status -> IN_PROGRESS"
      - from: SERVICE_OK
        to: IN_SERVICE
        trigger: "POST /fleet/work-orders/{id}/start (kind=REPAIR)"
        actor: Mechanic
        preconditions:
          - "work_order.status == DISPATCHED"
          - "work_order.equipment_id == this equipment"
        side_effects:
          - "work_order.status -> IN_PROGRESS"
      - from: IN_SERVICE
        to: SERVICE_OK
        trigger: "POST /fleet/work-orders/{id}/complete"
        actor: Mechanic
        preconditions:
          - "work_order.status == IN_PROGRESS"
          - "work_order.equipment_id == this equipment"
          - "work_order.mechanic_id == acting mechanic (X-User-ID)"
        side_effects:
          - "equipment.hours_at_last_service_milli = equipment.engine_hours_milli"
      - from: SERVICE_DUE
        to: SERVICE_OK
        trigger: "system (telematics void un-crosses service threshold)"
        actor: system
        preconditions:
          - "A voided reading brings hours_since_service_milli < class.service_interval_hours * 1000"
          - "The auto-created PREVENTIVE WorkOrder is still OPEN (never dispatched)"
        side_effects:
          - "The OPEN auto-created WorkOrder -> CANCELLED"
      - from: IN_SERVICE
        to: SERVICE_DUE
        trigger: "POST /fleet/work-orders/{id}/cancel (kind=PREVENTIVE, from IN_PROGRESS not allowed; only DISPATCHED cancel returns to prior maintenance_status)"
        actor: FleetAdmin
        preconditions:
          - "work_order.status == DISPATCHED"
          - "equipment.hours_since_service_milli >= class.service_interval_hours * 1000"
        side_effects:
          - "mechanic.active_work_order_count decremented; mechanic.status recomputed"

  - entity: Assignment
    field: status
    initial_state: RESERVED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: RESERVED
        to: ACTIVE
        trigger: "POST /fleet/assignments/{id}/activate"
        actor: FleetAdmin
        preconditions:
          - "equipment.availability_status == RESERVED"
          - "equipment.maintenance_status == SERVICE_OK"
          - "project.status == OPEN"
          - "project.billed_total_cents + projected first-day charge <= project.equipment_budget_cents"
        side_effects:
          - "activated_at set; equipment -> ON_RENT, current_project_id set"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (equipment marked DOWN)"
        actor: system
        preconditions: []
        side_effects:
          - "billing window pauses; days while SUSPENDED are not chargeable"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (repair WorkOrder completed; earliest-created SUSPENDED assignment first)"
        actor: system
        preconditions:
          - "project.status == OPEN"
        side_effects:
          - "billing resumes; equipment -> ON_RENT when this is the reactivated assignment"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /fleet/assignments/{id}/close"
        actor: FleetAdmin
        preconditions:
          - "No PLANNED or EN_ROUTE TransportJob references this assignment"
        side_effects:
          - "rental_allocation + own_vs_rent + utilization_rate computed; AssignmentCharge posted to project ledger"
          - "equipment -> IDLE; current_project_id cleared"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /fleet/assignments/{id}/cancel"
        actor: FleetAdmin
        preconditions: []
        side_effects:
          - "equipment -> IDLE"
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /fleet/assignments/{id}/close"
        actor: FleetAdmin
        preconditions:
          - "No PLANNED or EN_ROUTE TransportJob references this assignment"
        side_effects:
          - "close_reason must be EQUIPMENT_DOWN or PROJECT_CLOSED"
          - "rental_allocation + own_vs_rent + utilization_rate computed over chargeable (non-suspended) days; AssignmentCharge posted"
          - "equipment stays DOWN (does not auto-IDLE); current_project_id cleared"

  - entity: WorkOrder
    field: status
    initial_state: OPEN
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: OPEN
        to: DISPATCHED
        trigger: "POST /fleet/work-orders/{id}/dispatch"
        actor: FleetAdmin
        preconditions:
          - "work_order.status == OPEN"
          - "mechanic.status == AVAILABLE"
          - "mechanic.active_work_order_count < 2"
        side_effects:
          - "work_order.mechanic_id set; dispatched_at set"
          - "mechanic.active_work_order_count incremented; mechanic.status recomputed (AVAILABLE if still < 2 else ON_JOB)"
      - from: DISPATCHED
        to: IN_PROGRESS
        trigger: "POST /fleet/work-orders/{id}/start"
        actor: Mechanic
        preconditions:
          - "work_order.status == DISPATCHED"
          - "work_order.mechanic_id == acting mechanic (X-User-ID)"
        side_effects:
          - "equipment.maintenance_status -> IN_SERVICE"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /fleet/work-orders/{id}/complete"
        actor: Mechanic
        preconditions:
          - "work_order.status == IN_PROGRESS"
          - "work_order.mechanic_id == acting mechanic (X-User-ID)"
        side_effects:
          - "equipment.hours_at_last_service_milli = equipment.engine_hours_milli"
          - "equipment.maintenance_status -> SERVICE_OK"
          - "If kind == REPAIR and equipment.availability_status == DOWN: availability -> IDLE and SUSPENDED-assignment reactivation cascade fires (see Equipment availability machine)"
          - "mechanic.active_work_order_count decremented; mechanic.status recomputed"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /fleet/work-orders/{id}/cancel"
        actor: FleetAdmin
        preconditions: []
        side_effects: []
      - from: DISPATCHED
        to: CANCELLED
        trigger: "POST /fleet/work-orders/{id}/cancel"
        actor: FleetAdmin
        preconditions: []
        side_effects:
          - "work_order.mechanic_id cleared"
          - "mechanic.active_work_order_count decremented; mechanic.status recomputed"
          - "equipment.maintenance_status returns to SERVICE_DUE if hours_since_service still >= threshold else SERVICE_OK"

  - entity: TransportJob
    field: status
    initial_state: PLANNED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: PLANNED
        to: EN_ROUTE
        trigger: "POST /fleet/transport-jobs/{id}/depart"
        actor: Dispatcher
        preconditions:
          - "transport_job.status == PLANNED"
          - "equipment.availability_status == IN_TRANSIT"
        side_effects:
          - "lowboy.status -> ON_Haul"
      - from: EN_ROUTE
        to: DELIVERED
        trigger: "POST /fleet/transport-jobs/{id}/deliver"
        actor: Dispatcher
        preconditions:
          - "transport_job.status == EN_ROUTE"
        side_effects:
          - "equipment.availability_status -> IDLE; current_site_id = to_project_id"
          - "lowboy.status -> AVAILABLE"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /fleet/transport-jobs/{id}/cancel"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "equipment.availability_status -> IDLE"

  - entity: DamageReport
    field: status
    initial_state: FILED
    terminal_states: [CONFIRMED, VOIDED]
    transitions:
      - from: FILED
        to: ASSESSED
        trigger: "POST /fleet/damage-reports/{id}/assess"
        actor: FleetAdmin
        preconditions:
          - "damage_report.status == FILED"
        side_effects:
          - "assessed_charge_cents computed per damage_chargeback (per-line rounding variant)"
      - from: ASSESSED
        to: DISPUTED
        trigger: "POST /fleet/damage-reports/{id}/dispute"
        actor: ProjectManager
        preconditions:
          - "damage_report.status == ASSESSED"
          - "dispute_note non-empty"
        side_effects: []
      - from: DISPUTED
        to: ASSESSED
        trigger: "POST /fleet/damage-reports/{id}/reassess"
        actor: FleetAdmin
        preconditions:
          - "damage_report.status == DISPUTED"
          - "replacement line_items supplied"
        side_effects:
          - "line_items replaced; assessed_charge_cents recomputed per damage_chargeback"
          - "increments DamageReport.version by 1 (cyclic reassessment loop, unbounded rounds)"
      - from: ASSESSED
        to: CONFIRMED
        trigger: "POST /fleet/damage-reports/{id}/confirm"
        actor: FleetAdmin
        preconditions:
          - "damage_report.status == ASSESSED"
          - "project.status == OPEN"
          - "project.billed_total_cents + assessed_charge_cents <= project.equipment_budget_cents"
        side_effects:
          - "confirmed_charge_cents = assessed_charge_cents"
          - "project.billed_total_cents += confirmed_charge_cents"
      - from: FILED
        to: VOIDED
        trigger: "POST /fleet/damage-reports/{id}/void"
        actor: FleetAdmin
        preconditions: []
        side_effects: []
      - from: ASSESSED
        to: VOIDED
        trigger: "POST /fleet/damage-reports/{id}/void"
        actor: FleetAdmin
        preconditions: []
        side_effects: []

  - entity: Project
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: SUSPENDED
        trigger: "POST /fleet/projects/{id}/suspend"
        actor: FleetAdmin
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: OPEN
        trigger: "POST /fleet/projects/{id}/resume"
        actor: FleetAdmin
        preconditions: []
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "POST /fleet/projects/{id}/close"
        actor: FleetAdmin
        preconditions:
          - "project.active_assignment_count == 0"
        side_effects: []
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /fleet/projects/{id}/close"
        actor: FleetAdmin
        preconditions:
          - "project.active_assignment_count == 0"
        side_effects: []

  - entity: Mechanic
    field: status
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: ON_JOB
        trigger: "system (active_work_order_count reaches 2 via dispatch)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ON_JOB
        to: AVAILABLE
        trigger: "system (active_work_order_count falls below 2 via complete/cancel)"
        actor: system
        preconditions: []
        side_effects: []
      - from: AVAILABLE
        to: OFF_DUTY
        trigger: "POST /fleet/mechanics/{id}/off-duty"
        actor: FleetAdmin
        preconditions:
          - "mechanic.active_work_order_count == 0"
        side_effects: []
      - from: OFF_DUTY
        to: AVAILABLE
        trigger: "POST /fleet/mechanics/{id}/on-duty"
        actor: FleetAdmin
        preconditions: []
        side_effects: []

  - entity: Lowboy
    field: status
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: ON_Haul
        trigger: "system (transport job departs)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ON_Haul
        to: AVAILABLE
        trigger: "system (transport job delivered)"
        actor: system
        preconditions: []
        side_effects: []
      - from: AVAILABLE
        to: OUT_OF_SERVICE
        trigger: "POST /fleet/lowboys/{id}/out-of-service"
        actor: Dispatcher
        preconditions: []
        side_effects: []
      - from: OUT_OF_SERVICE
        to: AVAILABLE
        trigger: "POST /fleet/lowboys/{id}/return-to-service"
        actor: Dispatcher
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: equipment-reserve-stale-version
    parent_entity: Equipment
    write_endpoint: "POST /fleet/assignments"
    occ_field: "expected_equipment_version"
    description: |
      Creating an Assignment against an Equipment whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just reserved, marked down, or disposed the
      unit and the current writer's view of the equipment is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: damage-reassess-stale-version
    parent_entity: DamageReport
    write_endpoint: "POST /fleet/damage-reports/{id}/reassess"
    occ_field: "expected_damage_report_version"
    description: |
      Reassessing a DamageReport whose version has advanced since the client
      last observed it is rejected. This captures the case where another
      writer has just reassessed (replacing line_items) or confirmed the
      report and the current writer's view of the report is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: rental_allocation
    trigger: "assignment close (from ACTIVE or SUSPENDED)"
    algorithm: tiered_pricing
    formula: |
      Inputs: assignment window [start_date, close_date) intersected with
      chargeable days (calendar days on which the assignment was ACTIVE for
      any part of that service-local day), class daily_rate_cents,
      weekend_multiplier_bp, idle_day_multiplier_bp, and the set of ACCEPTED
      telematics readings for this equipment keyed by recorded_date.
      billable_days = count of chargeable days.
      idle_days = count of chargeable days whose accepted engine_hours_delta == 0.
      engine_hours_billed_milli = sum of accepted deltas on chargeable days.
      Per-day charge, in this exact order:
        base = daily_rate_cents
        if day is Saturday or Sunday: base = round(base * weekend_multiplier_bp / 10000)
        if day is idle (accepted delta == 0): base = round(base * idle_day_multiplier_bp / 10000)
      allocated_cents = sum of per-day base over chargeable days (sum AFTER per-day rounding).
    input_set: "Assignments transitioning to CLOSED; readings with status ACCEPTED whose recorded_date falls on a chargeable day; weekends pinned to service-local calendar"
    constants:
      ROUNDING: "round_half_up to whole cents at each per-day step"
    precision: "0 decimal places (integer cents), round_half_up"
    variants: []

  - name: own_vs_rent
    trigger: "assignment close (computed on the same chargeable window as rental_allocation)"
    algorithm: forward_looking
    formula: |
      Evaluation order is pinned (circular-looking dependency broken):
        step 1: billable_days and idle_days come from rental_allocation (already computed).
        step 2: OWN variant cost (owned-basis cost of the window):
          own_cost_cents = allocated_cents
            + round( (engine_hours_billed_milli / 1000) * WEAR_RATE_CENTS_PER_HOUR )
            + (billable_days * FIXED_OWNERSHIP_CENTS_PER_DAY)
          (only meaningful for OWNED equipment; for RENTED equipment own_cost_cents
           is still computed and stored for analytics using the class internal rate)
        step 3: RENT variant cost (external market cost of the same window):
          rent_cost_cents = billable_days * class.external_daily_rate_cents
            + billable_days * EXTERNAL_RENTAL_ADMIN_CENTS_PER_DAY
        step 4: cheaper_variant = OWN if own_cost_cents < rent_cost_cents
                                 else RENT if rent_cost_cents < own_cost_cents
                                 else TIE
      Variants deliberately diverge: OWN scales with metered engine hours and
      idle-day discounts; RENT is flat per billable day regardless of usage.
    input_set: "Same chargeable-day set and ACCEPTED reading set as rental_allocation"
    constants:
      WEAR_RATE_CENTS_PER_HOUR: 900
      FIXED_OWNERSHIP_CENTS_PER_DAY: 4200
      EXTERNAL_RENTAL_ADMIN_CENTS_PER_DAY: 1500
    precision: "0 decimal places (integer cents), round_half_up"
    variants:
      - name: OWN
        when: "always computed; decision-relevant when equipment.ownership == OWNED"
        difference: "Adds per-engine-hour wear and per-day fixed ownership cost to the internal allocation; sensitive to idle-day and weekend discounts"
      - name: RENT
        when: "always computed; decision-relevant when comparing against external rental"
        difference: "Flat external daily rate plus flat admin fee per billable day; insensitive to engine hours, idle days, and weekend multipliers"

  - name: utilization_rate
    trigger: "assignment close (stored on assignment); also recomputed for redeployment scan"
    algorithm: aggregation
    formula: |
      Two variants over the SAME chargeable window (both stored):
      ELAPSED variant (calendar basis):
        utilization_elapsed_bp = round_half_up(
          (engine_hours_billed_milli / 1000) * 8 * 10000
          / (elapsed_days_in_window * 8 * 8) )
        where elapsed_days_in_window = calendar days in [start_date, close_date)
        INCLUDING suspended and weekend days; denominator pinned at
        elapsed_days_in_window * 64 (hours if the unit ran 8 h/day every day
        against an 8-hour expected day... see pinning below).
        PINNED FORM: utilization_elapsed_bp = round_half_up(
          engine_hours_billed_milli * 10000 / (elapsed_days_in_window * 8 * 1000) )
        with division by zero pinned: if elapsed_days_in_window == 0 then 0.
      BILLING variant (billable basis):
        utilization_billing_bp = round_half_up(
          engine_hours_billed_milli * 10000 / (billable_days * 8 * 1000) )
        with division by zero pinned: if billable_days == 0 then 0.
      The two variants produce different values whenever suspended or weekend
      days exist inside the window (elapsed counts them in the denominator,
      billing does not).
    input_set: "Assignments transitioning to CLOSED; ACCEPTED readings on chargeable days for the numerator; class EXPECTED_HOURS_PER_DAY = 8"
    constants:
      EXPECTED_HOURS_PER_DAY: 8
    precision: "integer basis points 0..10000 (values above 10000 are clamped to 10000), round_half_up"
    variants:
      - name: ELAPSED
        when: "fleet-wide reporting and residual-value context"
        difference: "Denominator counts every calendar day in the window including SUSPENDED days and weekends"
      - name: BILLING
        when: "redeployment scoring and idle-alert evaluation"
        difference: "Denominator counts only chargeable (non-suspended) days; weekend days are still chargeable so they count"

  - name: redeployment_scan
    trigger: "GET /fleet/equipment/{id}/redeployment-score (computed read)"
    algorithm: weighted_scoring
    formula: |
      For an IDLE equipment unit, score candidate OPEN projects for
      redeployment:
        eligible projects: status == OPEN and
          billed_total_cents + class.daily_rate_cents <= equipment_budget_cents
        score_bp = utilization_billing_bp of the unit's most recent CLOSED
          assignment on that project (0 if the unit was never assigned there)
          + 1000 if that project currently has 0 units of this class on rent
          + 100 if that project's remaining budget >= 30 * daily_rate_cents
        ranking: score_bp DESC; tie-break: project.created_at ASC; final
          tie-break: project_code ASC.
        empty-pool fallback: return empty candidate list with
          recommended_project_id = null (NOT an error).
      A unit is flagged idle_alert when, over its last IDLE_WINDOW_DAYS
      consecutive calendar days in IDLE availability with maintenance_status
      == SERVICE_OK, it has no RESERVED assignment and no PLANNED/EN_ROUTE
      transport: idle_alert == true exactly when idle_streak_days >= IDLE_WINDOW_DAYS
      (inclusive boundary).
    input_set: "Projects with status OPEN; assignments of this equipment with status CLOSED; assignments of any equipment with status ACTIVE for the class-presence bonus"
    constants:
      IDLE_WINDOW_DAYS: 5
      EXPECTED_HOURS_PER_DAY: 8
    precision: "integer basis points for score components"
    variants: []

  - name: damage_chargeback
    trigger: "damage report assess / reassess"
    algorithm: aggregation
    formula: |
      Rounding order is PINNED (mode (b) nested rounding):
        step 1: per line item, adjusted = round(amount_cents * abuse_multiplier_bp / 10000)
          where abuse_multiplier_bp = ABUSE_MULTIPLIER_BP if abuse_flag else 10000.
        step 2: subtotal = sum of per-line adjusted values (sum AFTER per-line rounding).
        step 3: assessed_charge_cents = min(subtotal, CHARGE_CAP_CENTS).
      Note the deliberate divergence from the alternative 'sum-then-round':
        round(sum(amount_cents) * multiplier) can differ by cents from
        sum(round(each * multiplier)); the scaffold pins per-line-then-sum.
    input_set: "DamageReport.line_items (1..20 items) at assess time; reassess replaces line_items and recomputes from scratch"
    constants:
      ABUSE_MULTIPLIER_BP: 15000
      CHARGE_CAP_CENTS: 5000000
    precision: "0 decimal places (integer cents), round_half_up per line"
    variants: []

  - name: residual_value
    trigger: "equipment dispose"
    algorithm: decay_function
    formula: |
      Two depreciation variants; the variant is selected by disposal context:
      STRAIGHT_LINE variant (ownership == OWNED and disposal_method == SALE):
        age_months = whole calendar months between acquisition_date and
          disposed_at date (partial final month discarded).
        depreciation = (acquisition_cost_cents - salvage_value_cents)
          * min(age_months, useful_life_months) / useful_life_months
        residual = acquisition_cost_cents - round(depreciation)
      HOUR_BASED variant (ownership == OWNED and disposal_method == SCRAP):
        hours_used = engine_hours_milli / 1000 (exact, milli precision kept
          until final rounding).
        depreciation = (acquisition_cost_cents - salvage_value_cents)
          * min(hours_used, expected_life_hours) / expected_life_hours
        residual = acquisition_cost_cents - round(depreciation)
      Both variants floor at class.salvage_value_cents:
        residual = max(residual, salvage_value_cents).
      RENTED units cannot be disposed (validation), so no variant applies.
      The two variants diverge whenever calendar age and metered hours do not
      progress at the class's expected pace.
    input_set: "Equipment with ownership == OWNED transitioning to DISPOSED; class expected_life_hours and salvage_value_cents"
    constants: {}
    precision: "0 decimal places (integer cents), round_half_up at final rounding only"
    variants:
      - name: STRAIGHT_LINE
        when: "disposal_method == SALE"
        difference: "Time-based decay over useful_life_months; engine hours ignored"
      - name: HOUR_BASED
        when: "disposal_method == SCRAP"
        difference: "Usage-based decay over class.expected_life_hours; calendar age ignored"

  - name: service_threshold
    trigger: "telematics ingest (accept or void)"
    algorithm: threshold
    formula: |
      hours_since_service_milli = engine_hours_milli - hours_at_last_service_milli
      Threshold crossing on ACCEPT:
        if hours_since_service_milli >= class.service_interval_hours * 1000
           AND maintenance_status == SERVICE_OK
          -> maintenance_status = SERVICE_DUE; auto-create PREVENTIVE WorkOrder (OPEN)
             unless one already exists in OPEN/DISPATCHED/IN_PROGRESS.
      Boundary: crossing is INCLUSIVE (>=). Exactly at
        service_interval_hours * 1000 triggers.
      Un-crossing on VOID:
        recompute engine_hours_milli excluding the voided reading;
        if hours_since_service_milli < class.service_interval_hours * 1000
           AND maintenance_status == SERVICE_DUE
           AND the auto-created WorkOrder is still OPEN
          -> maintenance_status = SERVICE_OK; that WorkOrder -> CANCELLED.
    input_set: "TelematicsReadings of this equipment with status ACCEPTED (voided readings excluded from the meter)"
    constants: {}
    precision: "milli-hour integer arithmetic; no rounding"
    variants: []

  - name: transport_overlap
    trigger: "transport job create"
    algorithm: interval_merge
    formula: |
      Two DISTINCT interval semantics:
      (1) Equipment assignment window (half-open, day granularity):
          an Assignment window [start_date, end_date) overlaps another
          non-terminal Assignment window on the same equipment iff
          start_date < other.end_date AND other.start_date < end_date.
          Adjacent windows (end_date == other.start_date) do NOT overlap.
      (2) Lowboy transport window (closed, timestamp granularity, with buffer):
          a TransportJob occupies its lowboy over the CLOSED interval
          [depart_at, arrive_at + TURNAROUND_HOURS hours).
          Two jobs on the same lowboy conflict iff
          depart_at < other.arrive_at + TURNAROUND_HOURS h
          AND other.depart_at < arrive_at + TURNAROUND_HOURS h.
          A job departing exactly at other.arrive_at + TURNAROUND_HOURS h is
          allowed (the buffered interval is half-open at its buffered end).
    input_set: "Assignments of the equipment with status RESERVED/ACTIVE/SUSPENDED; TransportJobs of the lowboy with status PLANNED/EN_ROUTE"
    constants:
      TURNAROUND_HOURS: 4
    precision: "date arithmetic at day granularity; timestamp arithmetic at minute granularity"
    variants: []

  - name: budget_guard
    trigger: "assignment activate; damage confirm"
    algorithm: threshold
    formula: |
      Project equipment budget gate, INCLUSIVE at the cap:
        activation allowed iff
          project.billed_total_cents + projected_first_day_charge <= equipment_budget_cents
        where projected_first_day_charge = class.daily_rate_cents with no
          weekend or idle multiplier applied (projection is deliberately
          pessimistic-free: the raw daily rate).
        damage confirm allowed iff
          project.billed_total_cents + assessed_charge_cents <= equipment_budget_cents
        A charge that lands billed_total_cents EXACTLY on
        equipment_budget_cents is allowed (inclusive <=).
    input_set: "Project with status OPEN; class.daily_rate_cents; DamageReport.assessed_charge_cents"
    constants: {}
    precision: "integer cents; no rounding"
    variants: []

  - name: fuel_burn_rate
    trigger: "GET /fleet/equipment/{id}/fuel-summary (computed read)"
    algorithm: aggregation
    formula: |
      Over the inclusive date window [from_date, to_date] (query params):
        total_fuel_ml = sum of fuel_used_milliliters over ACCEPTED readings
          with from_date <= recorded_date <= to_date
        total_hours_milli = sum of engine_hours_delta_milli over the same set
        burn_ml_per_hour = if total_hours_milli == 0 then null
          else round_half_up(total_fuel_ml * 1000 / total_hours_milli)
      Window is INCLUSIVE at both ends (contrast with assignment half-open
      windows) — recorded_date == from_date and recorded_date == to_date both
      count.
    input_set: "TelematicsReadings of this equipment with status ACCEPTED and recorded_date inside the inclusive window"
    constants: {}
    precision: "integer ml/hour, round_half_up"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and names a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per §1.5 roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path-template resources exist (left-to-right: equipment, project, assignment, work order, mechanic, transport job, lowboy, damage report, class)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Body-referenced FK ids exist (equipment_id, project_id, class_id, mechanic_id, lowboy_id, assignment_id)"
    error_id: ERR_REF_NOT_FOUND
    http_status: 422
    applies_to: "endpoints with body FKs"

  - priority: 5
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, dates parseable, numeric ranges respected (engine_hours_delta_milli 0..24000, line_items 1..20, end_date > start_date, arrive_at > depart_at, to_project_id != from_project_id)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 6
    category: business_referential
    check: "Ownership-typed field constraints: acquisition_cost_cents > 0 and useful_life_months > 0 required when ownership == OWNED; acquisition_cost_cents must be 0 when ownership == RENTED"
    error_id: ERR_OWNERSHIP_FIELD_MISMATCH
    http_status: 422
    applies_to: "POST /fleet/equipment"

  - priority: 7
    category: state
    check: "Target resource is in a state from which the requested transition exists (per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 8
    category: state
    check: "Equipment availability permits the operation: assignment create requires availability_status == IDLE; activate requires == RESERVED; mark-down requires IDLE or ON_RENT; dispose requires == IDLE; transport create requires == IDLE"
    error_id: ERR_EQUIPMENT_NOT_AVAILABLE
    http_status: 409
    applies_to: "equipment-gated endpoints"

  - priority: 9
    category: business_safety
    check: "Maintenance gate: assignment create/activate require maintenance_status == SERVICE_OK; a unit in SERVICE_DUE or IN_SERVICE cannot be committed to a project"
    error_id: ERR_SERVICE_DUE
    http_status: 409
    applies_to: "POST /fleet/assignments, POST /fleet/assignments/{id}/activate"

  - priority: 10
    category: business_temporal
    check: "Assignment half-open window does not overlap any non-terminal assignment on the same equipment (transport_overlap semantics (1))"
    error_id: ERR_ASSIGNMENT_OVERLAP
    http_status: 409
    applies_to: "POST /fleet/assignments"

  - priority: 11
    category: business_temporal
    check: "Transport job buffered closed interval does not conflict with any PLANNED/EN_ROUTE job on the same lowboy (transport_overlap semantics (2)); also equipment origin: equipment.current_site_id must equal from_project_id"
    error_id: ERR_TRANSPORT_CONFLICT
    http_status: 409
    applies_to: "POST /fleet/transport-jobs"

  - priority: 12
    category: business_referential
    check: "Damage report project must equal equipment.current_project_id at filing time (unit must be ON_RENT at that project)"
    error_id: ERR_PROJECT_MISMATCH
    http_status: 422
    applies_to: "POST /fleet/damage-reports"

  - priority: 13
    category: business_referential
    check: "Mechanic ownership of work: work-order start/complete require work_order.mechanic_id == X-User-ID"
    error_id: ERR_NOT_ASSIGNED_MECHANIC
    http_status: 403
    applies_to: "POST /fleet/work-orders/{id}/start, POST /fleet/work-orders/{id}/complete"

  - priority: 14
    category: business_constraint
    check: "Mechanic capacity: dispatch requires mechanic.status == AVAILABLE and active_work_order_count < 2"
    error_id: ERR_MECHANIC_UNAVAILABLE
    http_status: 409
    applies_to: "POST /fleet/work-orders/{id}/dispatch"

  - priority: 15
    category: business_constraint
    check: "Dispose requires OWNED ownership"
    error_id: ERR_RENTED_UNIT
    http_status: 422
    applies_to: "POST /fleet/equipment/{id}/dispose"

  - priority: 16
    category: business_referential
    check: "Dispose blocked by open work: no OPEN/DISPATCHED/IN_PROGRESS WorkOrder, no PLANNED/EN_ROUTE TransportJob, no FILED/ASSESSED/DISPUTED DamageReport on this equipment"
    error_id: ERR_OPEN_WORK
    http_status: 409
    applies_to: "POST /fleet/equipment/{id}/dispose"

  - priority: 17
    category: business_referential
    check: "Assignment close blocked while a PLANNED or EN_ROUTE TransportJob references this assignment"
    error_id: ERR_TRANSPORT_PENDING
    http_status: 409
    applies_to: "POST /fleet/assignments/{id}/close"

  - priority: 18
    category: business_fiscal
    check: "Project budget guard (inclusive <=) for activation and damage confirm per budget_guard"
    error_id: ERR_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /fleet/assignments/{id}/activate, POST /fleet/damage-reports/{id}/confirm"

  - priority: 19
    category: state
    check: "Project must be OPEN for assignment activate and damage confirm"
    error_id: ERR_PROJECT_NOT_OPEN
    http_status: 409
    applies_to: "POST /fleet/assignments/{id}/activate, POST /fleet/damage-reports/{id}/confirm"

  - priority: 20
    category: business_constraint
    check: "OCC: expected_<parent>_version must equal the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /fleet/assignments, POST /fleet/damage-reports/{id}/reassess"

  - priority: 21
    category: business_constraint
    check: "Telematics uniqueness: at most one ACCEPTED reading per (equipment_id, recorded_date); a second reading for the same pair is rejected while the first is ACCEPTED"
    error_id: ERR_DUPLICATE_READING
    http_status: 409
    applies_to: "POST /fleet/equipment/{id}/readings"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/fleet/_clock/set_current_utc"
    description: "Set the logical clock. Before any call, the clock defaults to exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time."
    roles: [FleetAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock advanced; all date/timestamp derivations use this clock"]

  # --- EquipmentClass ---
  - method: POST
    path: "/fleet/equipment-classes"
    description: "Create an equipment class (rates, service interval, thresholds)"
    roles: [FleetAdmin]
    code: 201
    input: [class_code, daily_rate_cents, external_daily_rate_cents, weekend_multiplier_bp, idle_day_multiplier_bp, service_interval_hours, idle_alert_utilization_bp, expected_life_hours, salvage_value_cents]
    output: EquipmentClass
    side_effects: []

  - method: GET
    path: "/fleet/equipment-classes/{id}"
    description: "Get one equipment class"
    roles: [FleetAdmin, ProjectManager, Mechanic, Dispatcher]
    code: 200
    input: []
    output: EquipmentClass
    side_effects: []

  - method: GET
    path: "/fleet/equipment-classes"
    description: "List equipment classes"
    roles: [FleetAdmin, ProjectManager, Mechanic, Dispatcher]
    code: 200
    input: ["limit?", "offset?"]
    output: EquipmentClass[]
    side_effects: []

  # --- Equipment ---
  - method: POST
    path: "/fleet/equipment"
    description: "Register an equipment unit"
    roles: [FleetAdmin]
    code: 201
    input: [unit_tag, class_id, ownership, acquisition_cost_cents, acquisition_date, useful_life_months]
    output: Equipment
    side_effects: ["availability_status=IDLE, maintenance_status=SERVICE_OK, engine_hours_milli=0, hours_at_last_service_milli=0"]

  - method: GET
    path: "/fleet/equipment/{id}"
    description: "Get one equipment unit"
    roles: [FleetAdmin, ProjectManager, Mechanic, Dispatcher]
    code: 200
    input: []
    output: Equipment
    side_effects: []

  - method: GET
    path: "/fleet/equipment"
    description: "List equipment; optional filters"
    roles: [FleetAdmin, ProjectManager, Mechanic, Dispatcher]
    code: 200
    input: ["class_id?", "availability_status?", "current_site_id?", "current_project_id?", "limit?", "offset?"]
    output: Equipment[]
    side_effects: []

  - method: POST
    path: "/fleet/equipment/{id}/mark-down"
    description: "Mark a unit DOWN (breakdown)"
    roles: [FleetAdmin]
    code: 200
    input: []
    output: Equipment
    side_effects: ["ACTIVE assignments -> SUSPENDED", "increments Equipment.version by 1"]

  - method: POST
    path: "/fleet/equipment/{id}/dispose"
    description: "Dispose an OWNED unit and compute residual value"
    roles: [FleetAdmin]
    code: 200
    input: [disposal_method]
    output: Equipment
    side_effects: ["residual_value computed per variant (SALE -> STRAIGHT_LINE, SCRAP -> HOUR_BASED)", "availability_status -> DISPOSED", "increments Equipment.version by 1"]

  - method: GET
    path: "/fleet/equipment/{id}/redeployment-score"
    description: "Computed read: redeployment candidates + idle_alert for an IDLE unit"
    roles: [FleetAdmin, ProjectManager]
    code: 200
    input: []
    output: { idle_alert: boolean, idle_streak_days: integer, recommended_project_id: string, candidates: array }
    side_effects: []

  - method: GET
    path: "/fleet/equipment/{id}/fuel-summary"
    description: "Computed read: fuel burn over an inclusive date window"
    roles: [FleetAdmin, ProjectManager]
    code: 200
    input: [from_date, to_date]
    output: { total_fuel_ml: integer, total_hours_milli: integer, burn_ml_per_hour: integer }
    side_effects: []

  - method: GET
    path: "/fleet/equipment/{id}/readings"
    description: "List telematics readings of a unit (sub-resource reverse reachability)"
    roles: [FleetAdmin, ProjectManager, Mechanic, Dispatcher]
    code: 200
    input: ["limit?", "offset?"]
    output: TelematicsReading[]
    side_effects: []

  - method: GET
    path: "/fleet/equipment/{id}/assignments"
    description: "List assignments of a unit (sub-resource reverse reachability)"
    roles: [FleetAdmin, ProjectManager, Mechanic, Dispatcher]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Assignment[]
    side_effects: []

  - method: GET
    path: "/fleet/equipment/{id}/work-orders"
    description: "List work orders of a unit (sub-resource reverse reachability)"
    roles: [FleetAdmin, ProjectManager, Mechanic, Dispatcher]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: WorkOrder[]
    side_effects: []

  - method: GET
    path: "/fleet/equipment/{id}/damage-reports"
    description: "List damage reports of a unit (sub-resource reverse reachability)"
    roles: [FleetAdmin, ProjectManager, Mechanic, Dispatcher]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: DamageReport[]
    side_effects: []

  - method: GET
    path: "/fleet/equipment/{id}/transport-jobs"
    description: "List transport jobs of a unit (sub-resource reverse reachability)"
    roles: [FleetAdmin, ProjectManager, Mechanic, Dispatcher]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: TransportJob[]
    side_effects: []

  # --- Telematics ---
  - method: POST
    path: "/fleet/equipment/{id}/readings"
    description: "Ingest a telematics reading for a unit"
    roles: [FleetAdmin]
    code: 201
    input: [recorded_date, engine_hours_delta_milli, fuel_used_milliliters]
    output: TelematicsReading
    side_effects: ["equipment.engine_hours_milli += delta", "service_threshold evaluated (may flip maintenance_status and auto-create WorkOrder)", "increments Equipment.version by 1 when meter changes"]

  - method: POST
    path: "/fleet/readings/{id}/void"
    description: "Void a reading (meter adjustment compensation)"
    roles: [FleetAdmin]
    code: 200
    input: [void_reason]
    output: TelematicsReading
    side_effects: ["reading.status -> VOIDED", "equipment.engine_hours_milli -= delta", "service_threshold re-evaluated (may un-cross and cancel OPEN auto WorkOrder)", "increments Equipment.version by 1 when meter changes"]

  # --- Project ---
  - method: POST
