# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3375_campus_recruiting_marketplace_employer_approval_student_access
#
# Depth probe: 2 instances per §0.5 rule (9 rules x 2 = 18 instances).
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 and is reproducible from
# empty-DB via its setup_api_calls chain. YAML anchors defined at first use
# (&d_*) are reused across instances in this file; each reuse re-executes the
# calls against a fresh empty database, so captures rebind per instance.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: fraud_risk_auto_vs_analyst_screening
        grounds:
          - calculations.fraud_risk_score
          - state_machines.Employer.PENDING_to_DOMAIN_VERIFIED
          - state_machines.Employer.DOMAIN_VERIFIED_to_APPROVED
        distinguishing_aspect: "On the Employer (trust-scoring) domain, the auto_screen variant computed from registration fields yields 25 (STANDARD), while the analyst_screen variant with analyst_signal_adjustment=30 over the SAME employer data yields 55 (ELEVATED) — two valid algorithms, two different scores and tiers."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Employer Acme Corp registered (PENDING) and domain-verified; auto_screen has run."
          setup_api_calls:
            - &d_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &d_emp
              call: "POST /employers"
              payload: { company_name: "Acme Corp", website_domain: "acme.com", contact_email: "hr@acme.com" }
              as: Anonymous
              captures: { emp_id: $.data.id, emp_tok: $.data.domain_verification_token }
            - &d_emp_verify
              call: "POST /employers/${emp_id}/verify-domain"
              payload: { verification_token: "${emp_tok}" }
              as: EmployerRecruiter
              as_user_id: "${emp_id}"
          trigger:
            - call: "POST /employers/${emp_id}/screen"
              payload: { decision: "CLEAR", analyst_signal_adjustment: 30 }
              as: PlatformAdmin
          assert:
            - "after verify-domain (auto variant): Employer.${emp_id}.fraud_risk_score == 25 (50 - 25 email-domain match) and trust_tier == STANDARD"
            - "after screen (analyst variant): Employer.${emp_id}.fraud_risk_score == 55 (25 + 30) and fraud_risk_score != 25"
            - "Employer.${emp_id}.trust_tier == ELEVATED (51 <= 55 <= 79), not the auto variant's STANDARD"
            - "Employer.${emp_id}.status == APPROVED (CLEAR permitted: tier != HIGH_RISK) and screen_count == 1"

      - name: outcome_rates_respondent_vs_cohort_denominators
        grounds:
          - calculations.outcome_report_rates
          - entities.Student.fields.outcome_status
          - endpoints.GET_/universities/{id}/outcome-report
        distinguishing_aspect: "On the University (first-destination statistics) domain, the respondent-denominator variant reports 0.6666 while the cohort-denominator variant reports 0.5455 over the SAME 11 alumni — a different entity domain from fraud_risk_auto_vs_analyst_screening, and a materially different pair of numbers."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. University ACTIVE with 11 alumni: CS x4 (EMPLOYED, SEEKING, OTHER, UNREPORTED), BIO x7 (EMPLOYED, EMPLOYED, EMPLOYED, GRAD_SCHOOL, GRAD_SCHOOL, SEEKING, UNREPORTED)."
          setup_api_calls:
            - *d_clock
            - &d_uni
              call: "POST /universities"
              payload: { name: "State University", primary_domain: "stateu.edu", employer_daily_message_cap: 10 }
              as: PlatformAdmin
              captures: { uni_id: $.data.id }
            - &d_uni_active
              call: "POST /universities/${uni_id}/transition"
              payload: { to: "ACTIVE" }
              as: PlatformAdmin
            - &d_cs1
              call: "POST /students"
              payload: { university_id: "${uni_id}", email: "cs1@stateu.edu", full_name: "Cs One", major: "CS", graduation_year: 2026, work_authorization: "US_CITIZEN" }
