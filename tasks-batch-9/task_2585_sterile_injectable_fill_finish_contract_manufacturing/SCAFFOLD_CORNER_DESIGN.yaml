      - name: qp_release_fee_tier_is_selected_once_from_the_pre_discount_total
        claim_type: tiered_pricing
        grounds:
          - calculations.qp_release_fee_cents
          - state_machines.BatchOrder.quality_status.QP_REVIEW_to_RELEASED
          - entities.QpReleaseDecision.fields.fee_cents
        distinguishing_aspect: "With final_releasable_units 8750 the subtotal is 150000 + 8750*40 = 500000, the NONE surcharge is 0 and the pre-discount total is exactly 500000 — the 3% tier boundary. The tier is chosen once from that pre-discount figure, so the fee is 500000 - 15000 = 485000; re-deriving the tier from the discounted 485000 would fall into the 0% tier and wrongly yield 500000."
        test_recipe:
          setup:
            - "The full B-001 chain filled at 9000 units with a VISUAL_INSPECTION check of sample 9000 / reject 190 (defect rate 190/9000 < 0.025 so it PASSES), FILL_WEIGHT and CCI destructive samples of 40 and 20, review closed by 'qa-001' -> final_releasable_units 9000 - 190 - 60 - 0 = 8750."
            - "No deviation exists on the batch, so max_open_deviation_class is NONE."
