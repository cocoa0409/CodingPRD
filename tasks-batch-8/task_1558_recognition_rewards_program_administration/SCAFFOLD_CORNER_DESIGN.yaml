            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-02-28T00:00:00Z" }, as: HRAdmin }
            - { call: "POST /api/programs/${prog}/anniversary-scans", payload: {}, as: HRAdmin, captures: { st28: "$.data[0].status" } }
            - { call: "GET /api/employees/${emp}", payload: {}, as: HRAdmin, captures: { avail: $.data.available_points } }
