  - rule_id: cross_entity_state_dependency
    instances:
      - name: application_award_requires_window_closed
        grounds:
          - state_machines.AllocationWindow.CLOSED_to_ALLOCATED
          - state_machines.PermitApplication.UNDER_REVIEW_to_AWARDED
          - errors[ERR_INVALID_WINDOW_STATE]
        distinguishing_aspect: |
          Entity pair PermitApplication x AllocationWindow: the UNDER_REVIEW -> AWARDED
          transition exists only inside a run-allocation executed while the WINDOW is CLOSED;
          running it while the window is OPEN fails with ERR_INVALID_WINDOW_STATE and no
          application changes state.
        test_recipe:
          setup:
            - "Org, facility, published schedule; window OPEN with one SUBMITTED application"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: AthleticsAdmin }
            - { call: "POST /organizations", payload: { name: "Riverview SC", classification: "RESIDENT", org_type: "YOUTH_LEAGUE", prior_seasons_active: 3 }, as: AthleticsAdmin, captures: { o_id: $.data.id } }
            - { call: "POST /facilities", payload: { name: "Memorial Field 1", facility_class: "RECTANGLE", has_lights: true, capacity: 120, weekly_prime_hour_cap: 12, nightly_light_block_cap: 16 }, as: AthleticsAdmin, captures: { f_id: $.data.id } }
            - { call: "POST /fee-schedules", payload: { name: "2026 Standard", effective_from: "2026-07-01T00:00:00Z", hourly_resident_cents: 2000, hourly_nonresident_cents: 3250, hourly_commercial_cents: 5000, lights_block_cents: 700, nonresident_surcharge_pct: 15, commercial_surcharge_pct: 25, tournament_day_cents: 24000, tournament_day_min_minutes: 360, deposit_pct: 25, min_deposit_cents: 5000 }, as: AthleticsAdmin, captures: { fs_id: $.data.id } }
            - { call: "POST /fee-schedules/${fs_id}/publish", payload: {}, as: AthleticsAdmin }
            - { call: "POST /allocation-windows", payload: { season_code: "2026-FALL", opens_at: "2026-08-01T00:00:00Z", closes_at: "2026-08-20T23:59:59Z", prime_cap_hours_per_org: 10, max_tournament_days_per_org: 2 }, as: AthleticsAdmin, captures: { w_id: $.data.id } }
            - { call: "POST /allocation-windows/${w_id}/open", payload: {}, as: AthleticsAdmin }
            - { call: "POST /permit-applications", payload: { window_id: "${w_id}", facility_id: "${f_id}", event_date: "2026-08-10", start_minute: 1080, end_minute: 1200, event_type: "LEAGUE_GAME", wants_lights: false, headcount: 40 }, as: OrgCoordinator, as_user_id: "${o_id}", captures: { a_id: $.data.id } }
          trigger:
            - { call: "POST /allocation-windows/${w_id}/run-allocation", payload: {}, as: AthleticsAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /allocation-windows/${w_id}/close", payload: {}, as: AthleticsAdmin }
            - { call: "POST /allocation-windows/${w_id}/run-allocation", payload: {}, as: AthleticsAdmin, captures: { w_st: $.data.status } }
            - { call: "GET /permit-applications/${a_id}", payload: {}, as: AthleticsAdmin, captures: { a_st: $.data.status } }
          assert:
            - "run-allocation while OPEN: error_id == ERR_INVALID_WINDOW_STATE"
            - "Application still SUBMITTED after the rejected run (no sweep had occurred yet)"
            - "After close + run: window ALLOCATED and application AWARDED"

