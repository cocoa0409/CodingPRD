  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: urgency_prognosis_threshold_boundary
        claim_type: constants_applied
        grounds: ["calculations.urgency_classification"]
        distinguishing_aspect: "prognosis_months 6 -> RAPID (<= inclusive), 7 -> STANDARD, absent -> STANDARD; urgency is frozen on the wish at creation."
        test_recipe:
          setup: ["Chapter; two children referred with prognosis 6 and 7, both certified and approved."]
          setup_api_calls:
            - call: "POST /wish-grant/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: NationalAdmin
            - call: "POST /wish-grant/chapters"
              payload: { name: "Metro Chapter", territory_zip_prefixes: ["900"], fiscal_year_budget_cents: 2000000, target_avg_cost_per_wish_cents: 800000 }
              as: NationalAdmin
              captures: { ch_id: $.data.id }
            - call: "POST /wish-grant/referrals"
              payload: { child_full_name: "Lila Monroe", child_date_of_birth: "2016-03-10", child_zip_code: "90012", parent_email: "monroe@example.org", diagnosis_summary: "leukemia", source_type: "FAMILY", prognosis_months: 6 }
              as: ReferralSource
              captures: { ref6_id: $.data.id }
            - call: "POST /wish-grant/referrals/${ref6_id}/certify"
              payload: { qualifying_condition: "ONCOLOGY" }
              as: MedicalProvider
            - call: "POST /wish-grant/referrals/${ref6_id}/determine"
              payload: { decision: "APPROVED" }
              as: EligibilityReviewer
              captures: { wish6_id: $.data.wish_id }
            - call: "POST /wish-grant/referrals"
              payload: { child_full_name: "Theo Alvarez", child_date_of_birth: "2015-06-15", child_zip_code: "90044", parent_email: "alvarez@example.org", diagnosis_summary: "cardiomyopathy", source_type: "MEDICAL_PROFESSIONAL", prognosis_months: 7 }
              as: ReferralSource
              captures: { ref7_id: $.data.id }
            - call: "POST /wish-grant/referrals/${ref7_id}/certify"
              payload: { qualifying_condition: "CARDIAC" }
              as: MedicalProvider
            - call: "POST /wish-grant/referrals/${ref7_id}/determine"
              payload: { decision: "APPROVED" }
              as: EligibilityReviewer
              captures: { wish7_id: $.data.wish_id }
          trigger:
            - call: "GET /wish-grant/wishes/${wish6_id}"
              as: WishCoordinator
              captures: { urg6: $.data.urgency }
            - call: "GET /wish-grant/wishes/${wish7_id}"
              as: WishCoordinator
              captures: { urg7: $.data.urgency }
          assert:
            - "urg6 == RAPID (6 <= 6, boundary inclusive)"
            - "urg7 == STANDARD (7 > 6)"

      - name: rapid_sla_deadline_boundary
        claim_type: correct_result
        grounds: ["calculations.rapid_sla_deadline", "validations[priority=19]"]
        distinguishing_aspect: "A RAPID wish determined 2026-09-01 has deadline 2026-09-15: event_start 2026-09-16 fails ERR_URGENT_SLA_VIOLATION while 2026-09-15 (== deadline, inclusive) succeeds."
        test_recipe:
