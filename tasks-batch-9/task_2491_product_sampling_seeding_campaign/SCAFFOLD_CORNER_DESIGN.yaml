        claim_type: flat_topology
        grounds:
          - complexity_profile.entity_topology
          - validations[priority 8]
          - errors[ERR_SHIPMENT_NOT_FOUND]
          - endpoints[POST /diversion-cases]
        distinguishing_aspect: "The topology is flat, so DiversionCase links two independent roots by foreign key; with a real panelist_id and an absent sample_shipment_id the left-to-right sweep passes the panelist and fails on the shipment with ERR_SHIPMENT_NOT_FOUND, not ERR_PANELIST_NOT_FOUND."
