              captures: { s1_id: "$.data.id" }
            - call: "POST /support-surface-orders"
              payload: { patient_id: "${p1_id}", unit_id: "${u1_id}", support_surface_id: "${s1_id}", rental_start: "2026-08-01T00:00:00Z", rental_end: "2026-08-06T00:00:00Z", authorized_days: 5, consult_request_id: "${c1_id}" }
              as: MaterialsCoordinator
              captures: { o1_id: "$.data.id" }
            - call: "GET /units/${u1_id}"
              payload: {}
              as: MaterialsCoordinator
              captures: { u1_v: "$.data.version" }
            - call: "POST /support-surface-orders/${o1_id}/approve"
              payload: { expected_unit_version: "${u1_v}" }
              as: MaterialsCoordinator
          trigger:
            - call: "POST /consult-requests/${c1_id}/cancel"
              payload: { reason: "Patient refused the specialty surface and the consult." }
              as: WocProgramDirector
          assert:
            - "HOP 1 — ConsultRequest.${c1_id}.status == CANCELLED and WocNurse.${n1_id}.active_consult_load == 0"
            - "HOP 1 — WocNurse.${n1_id}.mentored_consult_count == 0: a cancel is not a completed consult"
            - "HOP 2 — SupportSurfaceOrder.${o1_id}.billing_status == RELEASED"
            - "HOP 2 — SupportSurfaceOrder.${o1_id}.fulfillment_status == APPROVED (unchanged): only orders still at REQUESTED are moved to DENIED, and this one was already APPROVED"
            - "HOP 3 — Unit.${u1_id}.rental_encumbered_cents == 0, rental_released_cents == 105000, rental_committed_cents == 0, rental_available_cents == 500000"
            - "SupportSurface.${s1_id}.status == IN_USE — the cancel cascade releases money but does not reclaim the physical asset"
            - "No PressureInjuryCase and no DressingProtocol exist for this consult, so hops 2b, 2c and 3b are no-ops and Patient.${p1_id}.pending_outpatient_followup_count == 0"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: order_state_beats_budget_on_approve
        grounds:
          - validations[priority=12]
          - validations[priority=72]
          - state_machines.SupportSurfaceOrder.REQUESTED_to_DENIED
          - entities.Unit.fields.rental_available_cents
        distinguishing_aspect: |
          Category pair `state` (priority 12, ERR_ORDER_NOT_PENDING, 409) versus
          `business_fiscal` (priority 72, ERR_RENTAL_BUDGET_EXCEEDED, 402). The
          order is already DENIED and its authorized_cost_cents 105000 exceeds
          the unit's rental_available_cents 100000, so BOTH rules are violated by
          the same approve call; the 409 must win and the 402 must never surface.
        test_recipe:
          setup:
            - "Unit 3E exists with rental_budget_cap_cents 100000, so rental_available_cents is 100000."
            - "SupportSurface BED-030 is at daily_rate_cents 20000."
            - "Patient MRN-B1 is ADMITTED on 3E."
            - "A 5-day order with authorized_cost_cents 105000 (projected 100000 + tier-2 fee 5000) has already been DENIED, so fulfillment_status is DENIED and billing_status is UNBILLED."
            - "105000 > 100000, so the fiscal ceiling is also violated."
          setup_api_calls:
            - call: "POST /units"
              payload: { unit_code: "3E", name: "Three East", bed_count: 18, rental_budget_cap_cents: 100000 }
              as: WocProgramDirector
              captures: { u1_id: "$.data.id" }
            - call: "POST /patients"
              payload: { mrn: "MRN-B1", unit_id: "${u1_id}", admitted_at: "2026-07-30T00:00:00Z" }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { p1_id: "$.data.id" }
            - call: "POST /support-surfaces"
              payload: { asset_tag: "BED-030", surface_class: "ALTERNATING_PRESSURE", daily_rate_cents: 20000, vendor_name: "AirBeds Inc" }
              as: MaterialsCoordinator
              captures: { s1_id: "$.data.id" }
            - call: "POST /support-surface-orders"
              payload: { patient_id: "${p1_id}", unit_id: "${u1_id}", support_surface_id: "${s1_id}", rental_start: "2026-08-01T00:00:00Z", rental_end: "2026-08-06T00:00:00Z", authorized_days: 5 }
              as: MaterialsCoordinator
              captures: { o1_id: "$.data.id" }
            - call: "POST /support-surface-orders/${o1_id}/deny"
              payload: { denial_reason: "Attending withdrew the request." }
              as: MaterialsCoordinator
            - call: "GET /units/${u1_id}"
              payload: {}
              as: MaterialsCoordinator
              captures: { u1_v: "$.data.version" }
          trigger:
            - call: "POST /support-surface-orders/${o1_id}/approve"
              payload: { expected_unit_version: "${u1_v}" }
              as: MaterialsCoordinator
          assert:
            - "HTTP status is 409 and data.error_id == ERR_ORDER_NOT_PENDING"
            - "data.error_id != ERR_RENTAL_BUDGET_EXCEEDED and the status is not 402, even though authorized_cost_cents 105000 > rental_available_cents 100000"
            - "SupportSurfaceOrder.${o1_id}.fulfillment_status == DENIED and billing_status == UNBILLED (unchanged)"
            - "Unit.${u1_id}.rental_encumbered_cents == 0 and rental_available_cents == 100000 (unchanged)"
            - "SupportSurface.${s1_id}.status == AVAILABLE (unchanged)"

      - name: segregation_beats_poa_window_on_validate
        grounds:
          - validations[priority=30]
          - validations[priority=40]
          - state_machines.SkinAssessment.PENDING_VALIDATION_to_VALIDATED
          - calculations.poa_determination
          - entities.SkinAssessment.fields.staged_by_nurse_id
        distinguishing_aspect: |
          A different category pair from the other instance in this rule:
          `business_safety` (priority 30, ERR_SEGREGATION_OF_DUTIES, 422) versus
          `business_temporal` (priority 40, ERR_POA_WINDOW_CLOSED, 422). Both
          rules return 422, so the test cannot distinguish them by status code —
          only the error_id proves the ordering. The staging nurse validates her
          own assessment AND claims present-on-admission 11 days after the POA
          window closed.
        test_recipe:
          setup:
            - "Unit 7W exists; WocNurse Nina is CERTIFIED."
            - "Patient MRN-P1 was ADMITTED on 7W at 2026-07-20T00:00:00Z, so the POA window closed at 2026-07-21T00:00:00Z."
            - "Nina staged a SACRUM assessment for MRN-P1 with observed_at 2026-08-01T00:00:00Z; it is PENDING_VALIDATION and staged_by_nurse_id is Nina."
            - "The logical clock is at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /units"
              payload: { unit_code: "7W", name: "Seven West", bed_count: 24, rental_budget_cap_cents: 500000 }
              as: WocProgramDirector
              captures: { u1_id: "$.data.id" }
            - call: "POST /woc-nurses"
              payload: { full_name: "Nina Stage", home_unit_id: "${u1_id}", ce_credits: 30 }
              as: WocProgramDirector
              captures: { n1_id: "$.data.id" }
            - call: "POST /woc-nurses/${n1_id}/competency-signoffs"
              payload: { signed_off_at: "2026-08-01T00:00:00Z", competency_domain: "WOUND_STAGING" }
              as: WocProgramDirector
            - call: "POST /woc-nurses/${n1_id}/competency-signoffs"
              payload: { signed_off_at: "2026-08-01T00:00:00Z", competency_domain: "TRIAGE" }
              as: WocProgramDirector
            - call: "POST /woc-nurses/${n1_id}/advance"
              payload: {}
              as: WocProgramDirector
            - call: "POST /woc-nurses/${n1_id}/certify"
              payload: { cert_expires_at: "2028-08-01T00:00:00Z" }
              as: WocProgramDirector
            - call: "POST /patients"
              payload: { mrn: "MRN-P1", unit_id: "${u1_id}", admitted_at: "2026-07-20T00:00:00Z", comorbidity_count: 0, device_related_risk: false }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { p1_id: "$.data.id" }
            - call: "POST /consult-requests"
              payload: { patient_id: "${p1_id}", requesting_unit_id: "${u1_id}", consult_type: "WOUND", reported_stage: "STAGE_2", clinical_note: "Sacral wound noted on rounds." }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { c1_id: "$.data.id" }
            - call: "POST /consult-requests/${c1_id}/triage"
              payload: {}
              as: WocNurse
              as_user_id: "${n1_id}"
            - call: "POST /consult-requests/${c1_id}/assign"
              payload: { assigned_nurse_id: "${n1_id}" }
              as: WocProgramDirector
            - call: "GET /patients/${p1_id}"
              payload: {}
              as: WocNurse
              as_user_id: "${n1_id}"
              captures: { p1_v: "$.data.version" }
            - call: "POST /skin-assessments"
              payload: { consult_request_id: "${c1_id}", patient_id: "${p1_id}", anatomic_location: "SACRUM", observed_stage: "STAGE_2", measured_area_cm2: 6, observed_at: "2026-08-01T00:00:00Z", expected_patient_version: "${p1_v}", present_on_admission_claimed: true }
              as: WocNurse
              as_user_id: "${n1_id}"
              captures: { a1_id: "$.data.id" }
          trigger:
            - call: "POST /skin-assessments/${a1_id}/validate"
              payload: { confirmed_stage: "STAGE_2", present_on_admission_confirmed: true }
              as: WocNurse
              as_user_id: "${n1_id}"
          assert:
            - "HTTP status is 422 and data.error_id == ERR_SEGREGATION_OF_DUTIES"
            - "data.error_id != ERR_POA_WINDOW_CLOSED, even though observed_at 2026-08-01T00:00:00Z is 11 days past admitted_at + POA_WINDOW_HOURS = 2026-07-21T00:00:00Z"
            - "SkinAssessment.${a1_id}.validation_status == PENDING_VALIDATION (unchanged)"
            - "SkinAssessment.${a1_id}.poa_determination == null, confirmed_stage == null, validated_by_user_id == null"
            - "Patient.${p1_id}.poa_skin_assessment_documented == false"
            - "Unit.${u1_id}.open_hapi_rca_count == 0 and survey_posture == OPEN — no cascade hop ran"

  - rule_id: boundary_precision_check
    instances:
      - name: acuity_exactly_seventy_maps_to_p1
        grounds:
          - calculations.consult_acuity_score
          - entities.ConsultRequest.fields.priority_band
          - entities.ConsultRequest.fields.sla_due_at
          - state_machines.ConsultRequest.REQUESTED_to_TRIAGED
        distinguishing_aspect: |
          The P1_THRESHOLD comparison is `acuity_score >= 70.0`, so a WOUND
          consult scoring EXACTLY 70.0 (STAGE_3 60 + two comorbidities 10, times
          multiplier 1.00) must land in P1 with a 4-hour SLA, while the same
          consult with one comorbidity scores 65.0 and lands in P2 with a 24-hour
          SLA. A `>` implementation puts 70.0 in P2 and shifts the deadline by 20
          hours.
        test_recipe:
          setup:
            - "Unit 7W exists; WocNurse Nina is CERTIFIED."
            - "Patient MRN-T2 is ADMITTED on 7W with comorbidity_count 2 and device_related_risk false."
            - "Patient MRN-T1 is ADMITTED on 7W with comorbidity_count 1 and device_related_risk false."
            - "Both have a WOUND ConsultRequest in status REQUESTED with reported_stage STAGE_3."
            - "The logical clock is at its 2026-08-01T00:00:00Z default, so triaged_at is exactly that instant."
          setup_api_calls:
            - call: "POST /units"
              payload: { unit_code: "7W", name: "Seven West", bed_count: 24, rental_budget_cap_cents: 500000 }
              as: WocProgramDirector
              captures: { u1_id: "$.data.id" }
            - call: "POST /woc-nurses"
              payload: { full_name: "Nina Stage", home_unit_id: "${u1_id}", ce_credits: 30 }
              as: WocProgramDirector
              captures: { n1_id: "$.data.id" }
            - call: "POST /woc-nurses/${n1_id}/competency-signoffs"
              payload: { signed_off_at: "2026-08-01T00:00:00Z", competency_domain: "TRIAGE" }
              as: WocProgramDirector
            - call: "POST /woc-nurses/${n1_id}/competency-signoffs"
              payload: { signed_off_at: "2026-08-01T00:00:00Z", competency_domain: "WOUND_STAGING" }
              as: WocProgramDirector
            - call: "POST /woc-nurses/${n1_id}/advance"
              payload: {}
              as: WocProgramDirector
            - call: "POST /woc-nurses/${n1_id}/certify"
              payload: { cert_expires_at: "2028-08-01T00:00:00Z" }
              as: WocProgramDirector
            - call: "POST /patients"
              payload: { mrn: "MRN-T2", unit_id: "${u1_id}", admitted_at: "2026-07-30T00:00:00Z", comorbidity_count: 2, device_related_risk: false }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { p_hi_id: "$.data.id" }
            - call: "POST /patients"
              payload: { mrn: "MRN-T1", unit_id: "${u1_id}", admitted_at: "2026-07-30T00:00:00Z", comorbidity_count: 1, device_related_risk: false }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { p_lo_id: "$.data.id" }
            - call: "POST /consult-requests"
              payload: { patient_id: "${p_hi_id}", requesting_unit_id: "${u1_id}", consult_type: "WOUND", reported_stage: "STAGE_3", clinical_note: "Full thickness sacral loss, two comorbidities." }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { c_hi_id: "$.data.id" }
            - call: "POST /consult-requests"
              payload: { patient_id: "${p_lo_id}", requesting_unit_id: "${u1_id}", consult_type: "WOUND", reported_stage: "STAGE_3", clinical_note: "Full thickness sacral loss, one comorbidity." }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { c_lo_id: "$.data.id" }
          trigger:
            - call: "POST /consult-requests/${c_hi_id}/triage"
              payload: {}
              as: WocNurse
              as_user_id: "${n1_id}"
            - call: "POST /consult-requests/${c_lo_id}/triage"
              payload: {}
              as: WocNurse
              as_user_id: "${n1_id}"
          assert:
            - "ConsultRequest.${c_hi_id}.acuity_score == 70.0 exactly ((60 + min(25, 5*2) + 0 + 0) * 1.00), not 70 and not 70.00 rounded from something else"
            - "ConsultRequest.${c_hi_id}.priority_band == P1 because the comparison is acuity_score >= P1_THRESHOLD 70.0"
            - "ConsultRequest.${c_hi_id}.sla_due_at == 2026-08-01T04:00:00Z (triaged_at + SLA_HOURS_BY_BAND[P1] = 4h)"
            - "ConsultRequest.${c_lo_id}.acuity_score == 65.0 ((60 + min(25, 5*1)) * 1.00)"
            - "ConsultRequest.${c_lo_id}.priority_band == P2 and sla_due_at == 2026-08-02T00:00:00Z (triaged_at + 24h)"
            - "The 5.0-point difference between the two consults moves the SLA deadline by exactly 20 hours"
            - "ConsultRequest.${c_hi_id}.acuity_variant == INTAKE_PROVISIONAL and ConsultRequest.${c_lo_id}.acuity_variant == INTAKE_PROVISIONAL"

      - name: empty_at_risk_denominator_yields_zero_incidence
        grounds:
          - calculations.unit_survey_metric
          - entities.Unit.fields.last_incidence_rate
          - entities.SurveyObservation.fields.at_risk
          - state_machines.SurveyRound.LOCKED_to_PUBLISHED
          - validations[priority=60]
        distinguishing_aspect: |
          The incidence denominator counts only at_risk == true rows, so a unit
          that contributed exactly one observation with at_risk false has a ZERO
          denominator and must publish last_incidence_rate as exactly 0.00 with
          two decimals — never null, never a division error — while a peer unit
          in the same round publishes 100.00. This is the divide-by-zero boundary
          of the same formula, not a threshold comparison.
        test_recipe:
          setup:
            - "Units 7W and 8E both exist."
            - "WocNurse Nina is CERTIFIED and observes for both units."
            - "Patient MRN-Z1 is ADMITTED on 7W; patient MRN-Z2 is ADMITTED on 8E."
            - "One INCIDENCE round covers 2026-08-01T00:00:00Z..2026-08-05T00:00:00Z with participating_unit_ids [7W, 8E]."
            - "7W contributes exactly one observation: injury_present false, classification NONE, at_risk false."
            - "8E contributes exactly one observation: injury_present true, classification HAPI, onset_at 2026-08-03T00:00:00Z, at_risk true."
          setup_api_calls:
            - call: "POST /units"
              payload: { unit_code: "7W", name: "Seven West", bed_count: 24, rental_budget_cap_cents: 500000 }
              as: WocProgramDirector
              captures: { u1_id: "$.data.id" }
            - call: "POST /units"
              payload: { unit_code: "8E", name: "Eight East", bed_count: 20, rental_budget_cap_cents: 500000 }
              as: WocProgramDirector
              captures: { u2_id: "$.data.id" }
            - call: "POST /woc-nurses"
              payload: { full_name: "Nina Stage", home_unit_id: "${u1_id}", ce_credits: 30 }
              as: WocProgramDirector
              captures: { n1_id: "$.data.id" }
            - call: "POST /woc-nurses/${n1_id}/competency-signoffs"
              payload: { signed_off_at: "2026-08-01T00:00:00Z", competency_domain: "SURVEY_METHOD" }
              as: WocProgramDirector
            - call: "POST /woc-nurses/${n1_id}/competency-signoffs"
              payload: { signed_off_at: "2026-08-01T00:00:00Z", competency_domain: "WOUND_STAGING" }
              as: WocProgramDirector
            - call: "POST /woc-nurses/${n1_id}/advance"
              payload: {}
              as: WocProgramDirector
            - call: "POST /woc-nurses/${n1_id}/certify"
              payload: { cert_expires_at: "2028-08-01T00:00:00Z" }
              as: WocProgramDirector
            - call: "POST /patients"
              payload: { mrn: "MRN-Z1", unit_id: "${u1_id}", admitted_at: "2026-07-30T00:00:00Z" }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { z1_id: "$.data.id" }
            - call: "POST /patients"
              payload: { mrn: "MRN-Z2", unit_id: "${u2_id}", admitted_at: "2026-07-30T00:00:00Z" }
              as: UnitCharge
              as_user_id: "${u2_id}"
              captures: { z2_id: "$.data.id" }
            - call: "POST /survey-rounds"
              payload: { round_type: "INCIDENCE", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-05T00:00:00Z", participating_unit_ids: ["${u1_id}", "${u2_id}"] }
              as: WocProgramDirector
              captures: { r1_id: "$.data.id" }
            - call: "POST /survey-rounds/${r1_id}/open"
              payload: {}
              as: WocProgramDirector
            - call: "POST /survey-observations"
              payload: { survey_round_id: "${r1_id}", unit_id: "${u1_id}", patient_id: "${z1_id}", observer_nurse_id: "${n1_id}", observed_at: "2026-08-03T00:00:00Z", injury_present: false, classification: "NONE", at_risk: false }
              as: WocNurse
              as_user_id: "${n1_id}"
            - call: "POST /survey-observations"
              payload: { survey_round_id: "${r1_id}", unit_id: "${u2_id}", patient_id: "${z2_id}", observer_nurse_id: "${n1_id}", observed_at: "2026-08-03T00:00:00Z", injury_present: true, classification: "HAPI", observed_stage: "STAGE_2", onset_at: "2026-08-03T00:00:00Z", at_risk: true }
              as: WocNurse
              as_user_id: "${n1_id}"
            - call: "POST /survey-rounds/${r1_id}/lock"
              payload: {}
              as: WocProgramDirector
          trigger:
            - call: "POST /survey-rounds/${r1_id}/publish"
              payload: {}
              as: WocProgramDirector
            - call: "GET /survey-rounds/${r1_id}/unit-report"
              payload: {}
              as: WocProgramDirector
              captures: { report_total: "$.data.observation_total" }
          assert:
            - "Unit.${u1_id}.last_incidence_rate == 0.00 exactly — the only 7W observation has at_risk false, so inc_denominator is 0 and the formula returns EMPTY_DENOMINATOR_RESULT"
            - "Unit.${u1_id}.last_incidence_rate is not null and the publish call returns HTTP 200, not a 5xx from a division by zero"
            - "Unit.${u2_id}.last_incidence_rate == 100.00 (round_half_up(100 * 1 / 1, 2))"
            - "${report_total} == 2"
            - "SurveyRound.${r1_id}.status == PUBLISHED and observation_count == 2"
            - "Unit.${u1_id}.last_prevalence_rate == null — publishing an INCIDENCE round never writes the prevalence field"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: assign_blocked_when_nurse_lapsed
        grounds:
          - validations[priority=32]
          - state_machines.WocNurse.CERTIFIED_to_LAPSED
          - state_machines.ConsultRequest.TRIAGED_to_ASSIGNED
          - entities.WocNurse.fields.certification_status
          - entities.WocNurse.fields.max_consult_load
        distinguishing_aspect: |
          The blocking dependency runs ConsultRequest -> WocNurse: the consult is
          in a perfectly legal TRIAGED state and the payload is well-formed, yet
          the transition is refused purely because the TARGET nurse's
          certification_status is LAPSED. The gate is on a different entity's
          state, and lapse also drops max_consult_load to 0 without touching
          active_consult_load.
