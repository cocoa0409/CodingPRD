          setup:
            - "Canonical program (ami 6000000). Household X verifies 1800000 annual income and 90000 monthly housing cost, giving ami_pct exactly 0.3000, cost burden 0.60, a 4-person household in 1 bedroom with 3 deficiencies (need 100), dti 0.0667 with credit 640 and 24 on-time months (ability 100) and willingness 80, so composite is 95.0 and it is SELECTED. The build site is appraised at 40000000 cents. A DRAFT application pins income_basis 1800000 and appraised 40000000."
