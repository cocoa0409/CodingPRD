  # ===========================================================================
  - section: state_machines
    instances:

      - name: license_application_is_created_in_draft_initial_state
        claim_type: initial_state
        grounds:
          - state_machines.LicenseApplication.initial_state
        distinguishing_aspect: "A freshly created application sits in DRAFT with submitted_at and decided_at null, so no workflow field has been touched by the create itself."
        test_recipe:
          setup:
            - "Board OH, an approved BSN program and nurse Dana Reed exist."
          setup_api_calls:
            - call: "POST /state-board-configs"
              payload: { state_code: "OH", board_name: "Ohio Board of Nursing", compact_member: true }
              as: SystemAdmin
              captures: { board_id: $.data.id }
            - call: "POST /education-programs"
              payload: { state_board_config_id: "${board_id}", program_code: "OH-BSN-01", program_name: "Buckeye BSN", degree_level: "BSN", nclex_first_time_pass_rate_bp: 8800, approval_expires_on: "2032-01-01T00:00:00Z" }
              as: SystemAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /nurses"
              payload: { home_board_config_id: "${board_id}", full_name: "Dana Reed", birth_year: 1988, ssn_last4: "4417", declared_primary_state: "OH" }
              as: LicensureAnalyst
              captures: { nurse_id: $.data.id }
          trigger:
            - call: "POST /license-applications"
              payload: { nurse_id: "${nurse_id}", board_config_id: "${board_id}", pathway: "EXAMINATION", credential_type: "RN", education_program_id: "${prog_id}", nclex_result: "PASS" }
              as: LicensureAnalyst
              captures: { app_id: $.data.id }
          assert:
            - "HTTP status is 201 and data.status == DRAFT"
            - "data.submitted_at is null and data.decided_at is null"
            - "data.screening_status == NOT_ORDERED and data.board_decision == NONE"
            - "GET /license-applications/${app_id} still reports status DRAFT"

      - name: deficiency_then_resubmission_cycle_reaches_screening_in_progress
        claim_type: valid_transition
        grounds:
          - state_machines.LicenseApplication.transitions.SUBMITTED_to_DEFICIENT
          - state_machines.LicenseApplication.transitions.DEFICIENT_to_SUBMITTED
          - complexity_profile.state_machine_shape
        distinguishing_aspect: "The SUBMITTED <-> DEFICIENT loop is traversed once and the counter is monotone: the resubmission restamps submitted_at but does NOT reset deficiency_cycle_count, and the cycle still terminates in the forward path SUBMITTED -> QUALIFICATION_VERIFIED -> SCREENING_IN_PROGRESS in a single request."
        test_recipe:
          setup:
            - "Board OH, an approved BSN program and nurse Dana Reed exist, and an EXAMINATION RN application with nclex_result PASS is DRAFT."
          setup_api_calls:
            - call: "POST /state-board-configs"
              payload: { state_code: "OH", board_name: "Ohio Board of Nursing", compact_member: true }
              as: SystemAdmin
              captures: { board_id: $.data.id }
            - call: "POST /education-programs"
              payload: { state_board_config_id: "${board_id}", program_code: "OH-BSN-01", program_name: "Buckeye BSN", degree_level: "BSN", nclex_first_time_pass_rate_bp: 8800, approval_expires_on: "2032-01-01T00:00:00Z" }
              as: SystemAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /nurses"
              payload: { home_board_config_id: "${board_id}", full_name: "Dana Reed", birth_year: 1988, ssn_last4: "4417", declared_primary_state: "OH" }
              as: LicensureAnalyst
              captures: { nurse_id: $.data.id }
            - call: "POST /license-applications"
              payload: { nurse_id: "${nurse_id}", board_config_id: "${board_id}", pathway: "EXAMINATION", credential_type: "RN", education_program_id: "${prog_id}", nclex_result: "PASS" }
              as: LicensureAnalyst
              captures: { app_id: $.data.id }
            - call: "POST /license-applications/${app_id}/submit"
              payload: {}
              as: LicensureAnalyst
          trigger:
            - call: "POST /license-applications/${app_id}/deficiency"
              payload: { reason_note: "transcript missing seal" }
              as: LicensureAnalyst
              captures: { after_def_status: $.data.status, after_def_count: $.data.deficiency_cycle_count }
            - call: "POST /license-applications/${app_id}/submit"
              payload: {}
              as: LicensureAnalyst
              captures: { after_resub_status: $.data.status, after_resub_count: $.data.deficiency_cycle_count }
            - call: "POST /license-applications/${app_id}/qualification-verification"
              payload: {}
              as: LicensureAnalyst
              captures: { final_status: $.data.status, final_screening: $.data.screening_status }
          assert:
            - "${after_def_status} == DEFICIENT and ${after_def_count} == 1"
            - "${after_resub_status} == SUBMITTED and ${after_resub_count} == 1 — the counter does not rewind"
            - "${final_status} == SCREENING_IN_PROGRESS — QUALIFICATION_VERIFIED is passed through in the same request"
            - "${final_screening} == REQUESTED"
            - "data.decided_at is still null and data.board_decision == NONE"

      - name: submitting_an_already_submitted_application_is_rejected
        claim_type: idempotency
        grounds:
          - state_machines.LicenseApplication.transitions.DRAFT_to_SUBMITTED
          - validations[priority=10]
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "The submit action is not idempotent: a second call from SUBMITTED matches no outgoing submit edge, so it is a 409 ERR_INVALID_STATE and submitted_at is not restamped."
        test_recipe:
          setup:
            - "Board OH, an approved BSN program, nurse Dana Reed and a SUBMITTED EXAMINATION RN application exist."
          setup_api_calls:
            - call: "POST /state-board-configs"
              payload: { state_code: "OH", board_name: "Ohio Board of Nursing", compact_member: true }
              as: SystemAdmin
              captures: { board_id: $.data.id }
            - call: "POST /education-programs"
              payload: { state_board_config_id: "${board_id}", program_code: "OH-BSN-01", program_name: "Buckeye BSN", degree_level: "BSN", nclex_first_time_pass_rate_bp: 8800, approval_expires_on: "2032-01-01T00:00:00Z" }
              as: SystemAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /nurses"
              payload: { home_board_config_id: "${board_id}", full_name: "Dana Reed", birth_year: 1988, ssn_last4: "4417", declared_primary_state: "OH" }
              as: LicensureAnalyst
              captures: { nurse_id: $.data.id }
            - call: "POST /license-applications"
              payload: { nurse_id: "${nurse_id}", board_config_id: "${board_id}", pathway: "EXAMINATION", credential_type: "RN", education_program_id: "${prog_id}", nclex_result: "PASS" }
              as: LicensureAnalyst
              captures: { app_id: $.data.id }
            - call: "POST /license-applications/${app_id}/submit"
              payload: {}
              as: LicensureAnalyst
          trigger:
            - call: "POST /license-applications/${app_id}/submit"
              payload: {}
              as: LicensureAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409 and ${err} == ERR_INVALID_STATE"
            - "GET /license-applications/${app_id} still reports status SUBMITTED and deficiency_cycle_count == 0"

      - name: withdrawn_application_is_terminal_and_refuses_submit
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.LicenseApplication.terminal_states
          - state_machines.LicenseApplication.transitions.SUBMITTED_to_WITHDRAWN
        distinguishing_aspect: "WITHDRAWN is terminal, so neither submit nor withdrawal can move the row again even though withdrawal was legal one call earlier."
        test_recipe:
          setup:
            - "A SUBMITTED EXAMINATION RN application exists for nurse Dana Reed under board OH."
          setup_api_calls:
            - call: "POST /state-board-configs"
              payload: { state_code: "OH", board_name: "Ohio Board of Nursing", compact_member: true }
              as: SystemAdmin
              captures: { board_id: $.data.id }
            - call: "POST /education-programs"
              payload: { state_board_config_id: "${board_id}", program_code: "OH-BSN-01", program_name: "Buckeye BSN", degree_level: "BSN", nclex_first_time_pass_rate_bp: 8800, approval_expires_on: "2032-01-01T00:00:00Z" }
              as: SystemAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /nurses"
              payload: { home_board_config_id: "${board_id}", full_name: "Dana Reed", birth_year: 1988, ssn_last4: "4417", declared_primary_state: "OH" }
              as: LicensureAnalyst
              captures: { nurse_id: $.data.id }
            - call: "POST /license-applications"
              payload: { nurse_id: "${nurse_id}", board_config_id: "${board_id}", pathway: "EXAMINATION", credential_type: "RN", education_program_id: "${prog_id}", nclex_result: "PASS" }
              as: LicensureAnalyst
              captures: { app_id: $.data.id }
            - call: "POST /license-applications/${app_id}/submit"
              payload: {}
              as: LicensureAnalyst
            - call: "POST /license-applications/${app_id}/withdrawal"
              payload: {}
              as: LicensureAnalyst
              captures: { withdrawn_status: $.data.status }
          trigger:
            - call: "POST /license-applications/${app_id}/submit"
              payload: {}
              as: LicensureAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "${withdrawn_status} == WITHDRAWN and decided_at == 2026-08-01T00:00:00.000Z"
            - "HTTP status is 409 and ${err} == ERR_INVALID_STATE"
            - "a second POST /license-applications/${app_id}/withdrawal also returns 409 ERR_INVALID_STATE"

      - name: board_approval_over_a_disqualifying_screening_returns_disqualifying_offense
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=17]
          - errors.ERR_DISQUALIFYING_OFFENSE
          - state_machines.LicenseApplication.transitions.SCREENING_FLAGGED_to_BOARD_REVIEW
        distinguishing_aspect: "FEL-A with a 2023 disposition falls inside the 7-year lookback from the 2026-08-01 clock, so the board cannot vote APPROVED_UNCONDITIONAL: the row stays in BOARD_REVIEW with screening_status DISQUALIFYING rather than moving to APPROVED."
        test_recipe:
          setup:
            - "Board OH keeps its default disqualifying_offense_codes [FEL-A, SEX-1] and criminal_lookback_years 7."
            - "An EXAMINATION RN application reported one FEL-A offence disposed 2023-05-01, which flagged screening and auto-advanced the application to BOARD_REVIEW."
          setup_api_calls:
            - call: "POST /state-board-configs"
              payload: { state_code: "OH", board_name: "Ohio Board of Nursing", compact_member: true }
              as: SystemAdmin
              captures: { board_id: $.data.id }
