      - name: window_conflict_errors_excluded_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_INSTALLER_WINDOW_CONFLICT]", "errors[ERR_SENIOR_WINDOW_CONFLICT]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / installer_overlap_half_open_with_travel_buffer and senior_overlap_closed_interval_touching_endpoints
