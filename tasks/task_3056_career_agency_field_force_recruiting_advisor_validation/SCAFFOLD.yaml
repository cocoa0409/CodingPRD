    description: "Evaluate the window: recompute attainment per §1.3 and drive PASS/FAIL"
    roles: [ManagingDirector]
    code: 200
    input: [""]
    output: ValidationPeriod
    side_effects: ["achieved_production_cents recomputed", "status → PASSED or FAILED", "contract and advisor posture updated", "on PASS: override and credit recomputation cascade"]
  - method: POST
    path: "/agency/validation-periods/{id}/extend"
    description: "Extend an open, missed validation window"
    roles: [ManagingDirector]
    code: 200
    input: ["new_end_date"]
    output: ValidationPeriod
    side_effects: ["end_date widened", "extension_count += 1", "status → EXTENDED"]

  # --- ProductLicense ---
  - method: POST
    path: "/agency/advisors/{id}/licensing/lock-remediation"
    description: "Set the advisor's licensing_locked flag so that later licence-expiry demotions are suppressed"
    roles: [ManagingDirector]
    code: 200
    input: []
    output: Advisor
    side_effects: ["advisor.licensing_locked = true"]
  - method: POST
    path: "/agency/advisors/{id}/licensing/unlock-remediation"
    description: "Clear the advisor's licensing_locked flag"
    roles: [ManagingDirector]
    code: 200
    input: []
    output: Advisor
    side_effects: ["advisor.licensing_locked = false"]
  - method: POST
    path: "/agency/product-licenses"
    description: "Record a state insurance licence in PENDING"
    roles: [LicensingCoordinator]
    code: 201
    input: ["advisor_id", "product_line", "license_number", "effective_date", "expires_at", "appointment_required?"]
    output: ProductLicense
    side_effects: ["status = PENDING", "advisor.insurance_license_status = PENDING", "overlap check against existing half-open licence intervals"]
  - method: GET
    path: "/agency/product-licenses/{id}"
    description: "Get one product licence"
    roles: [Any]
    code: 200
    input: [""]
    output: ProductLicense
    side_effects: []
  - method: POST
    path: "/agency/product-licenses/{id}/activate"
    description: "Activate a pending licence and re-evaluate requested appointments"
    roles: [LicensingCoordinator]
    code: 200
    input: [""]
    output: ProductLicense
    side_effects: ["status → ACTIVE", "advisor.insurance_license_status recomputed", "requested appointments re-evaluated per §1.3 appointment_sequencing_gate"]
  - method: POST
    path: "/agency/product-licenses/{id}/renew"
    description: "Renew a lapsed licence"
    roles: [LicensingCoordinator]
    code: 200
    input: ["expires_at"]
    output: ProductLicense
    side_effects: ["status → ACTIVE", "expires_at extended", "advisor.insurance_license_status recomputed"]
  - method: GET
    path: "/agency/product-licenses/{id}/carrier-appointments"
    description: "List the carrier appointments that require this licence"
    roles: [Any]
    code: 200
    input: ["appointment_status?", "limit?", "offset?"]
    output: "CarrierAppointment[]"
    side_effects: []

  # --- SecuritiesRegistration ---
  - method: POST
    path: "/agency/securities-registrations"
    description: "Record a FINRA registration in PENDING"
    roles: [LicensingCoordinator]
    code: 201
    input: ["advisor_id", "registration_type", "crd_number", "effective_date", "expires_at", "prerequisite_registration_id?"]
    output: SecuritiesRegistration
    side_effects: ["status = PENDING", "advisor.securities_registration_status = PENDING", "overlap check against existing closed registration intervals"]
  - method: GET
    path: "/agency/securities-registrations"
    description: "List securities registrations with filtering"
    roles: [Any]
    code: 200
    input: ["advisor_id?", "registration_type?", "status?", "limit?", "offset?"]
    output: "SecuritiesRegistration[]"
    side_effects: []
  - method: GET
    path: "/agency/securities-registrations/{id}"
    description: "Get one securities registration"
    roles: [Any]
    code: 200
    input: [""]
    output: SecuritiesRegistration
    side_effects: []
  - method: POST
    path: "/agency/securities-registrations/{id}/activate"
    description: "Activate a pending registration once its prerequisite gate is satisfied"
    roles: [LicensingCoordinator]
    code: 200
    input: [""]
    output: SecuritiesRegistration
    side_effects: ["status → ACTIVE", "advisor.securities_registration_status recomputed", "dependent registrations re-evaluated"]
  - method: GET
    path: "/agency/securities-registrations/{id}/dependents"
    description: "List registrations whose prerequisite is this registration"
    roles: [Any]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "SecuritiesRegistration[]"
    side_effects: []

  # --- CarrierAppointment ---
  - method: POST
    path: "/agency/carrier-appointments"
    description: "Request a carrier appointment against one of the advisor's licences"
    roles: [LicensingCoordinator]
    code: 201
    input: ["advisor_id", "requires_license_id", "carrier_name", "state_code", "requested_date"]
    output: CarrierAppointment
    side_effects: ["appointment_status = REQUESTED", "advisor.appointment_status = REQUESTED"]
  - method: GET
    path: "/agency/carrier-appointments/{id}"
    description: "Get one carrier appointment"
    roles: [Any]
    code: 200
    input: [""]
    output: CarrierAppointment
    side_effects: []
  - method: POST
    path: "/agency/carrier-appointments/{id}/approve"
    description: "Approve a requested appointment after re-checking the licence gate"
    roles: [LicensingCoordinator]
    code: 200
    input: [""]
    output: CarrierAppointment
    side_effects: ["appointment_status → APPROVED", "appointment_date = clock", "advisor.appointment_status recomputed"]
  - method: POST
    path: "/agency/carrier-appointments/{id}/reject"
    description: "Reject a requested appointment"
    roles: [LicensingCoordinator]
    code: 200
    input: [""]
    output: CarrierAppointment
    side_effects: ["appointment_status → REJECTED", "advisor.appointment_status recomputed"]

  # --- Policy ---
  - method: POST
    path: "/agency/policies"
    description: "Write a policy and create its commission credits and overrides"
    roles: [ManagingDirector]
    code: 201
    input: ["policy_number", "writing_advisor_id", "carrier_name", "product_line", "annual_premium_cents", "issue_date", "is_advanced_commission?"]
    output: Policy
    side_effects: ["status = ISSUED", "§1.3 commission_credit_allocation creates the credit rows", "§1.3 override_allocation accrues overrides along the sponsoring chain", "team_production_cents recomputed"]
  - method: GET
    path: "/agency/policies"
    description: "List policies with filtering"
    roles: [Any]
    code: 200
    input: ["writing_advisor_id?", "product_line?", "status?", "orphaned?", "limit?", "offset?"]
    output: "Policy[]"
    side_effects: []
  - method: GET
    path: "/agency/policies/{id}"
    description: "Get one policy"
    roles: [Any]
    code: 200
    input: [""]
    output: Policy
    side_effects: []
  - method: POST
    path: "/agency/policies/{id}/activate"
    description: "Put an issued policy in force after the licensing and appointment gate"
    roles: [ManagingDirector]
    code: 200
    input: [""]
    output: Policy
    side_effects: ["status → ACTIVE", "months_inforce = 0"]
  - method: POST
    path: "/agency/policies/{id}/lapse"
    description: "Lapse an in-force policy and assess chargebacks"
    roles: [ManagingDirector]
    code: 200
    input: ["lapse_date"]
    output: Policy
    side_effects: ["status → LAPSED", "months_inforce recomputed", "§1.3 chargeback_assessment cascades to credits and then to overrides"]
  - method: POST
    path: "/agency/policies/{id}/reinstate"
    description: "Reinstate a lapsed policy, reversing its chargebacks without refunding recoveries"
    roles: [ManagingDirector]
    code: 200
    input: [""]
    output: Policy
    side_effects: ["status → ACTIVE", "lapse_date cleared", "charged-back credits revert to PAID with assessed amount 0"]
  - method: POST
    path: "/agency/policies/{id}/surrender"
    description: "Surrender a policy, assessing full-commission chargebacks"
    roles: [ManagingDirector]
    code: 200
    input: [""]
    output: Policy
    side_effects: ["status → SURRENDERED", "§1.3 chargeback_assessment with reason SURRENDER"]
  - method: POST
    path: "/agency/policies/{id}/terminate"
    description: "Terminate a surrendered policy and close any pending orphan assignment"
    roles: [ManagingDirector]
    code: 200
    input: [""]
    output: Policy
    side_effects: ["status → TERMINATED", "pending orphan assignment → REJECTED"]
  - method: GET
    path: "/agency/policies/{id}/joint-work-cases"
    description: "List the joint work cases of a policy"
    roles: [Any]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "JointWorkCase[]"
    side_effects: []
  - method: GET
    path: "/agency/policies/{id}/commission-credits"
    description: "List the commission credits of a policy"
    roles: [Any]
    code: 200
    input: ["credit_type?", "status?", "limit?", "offset?"]
    output: "CommissionCredit[]"
    side_effects: []
  - method: GET
    path: "/agency/policies/{id}/orphan-policy-assignments"
    description: "List the orphan reassignments of a policy"
    roles: [Any]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "OrphanPolicyAssignment[]"
    side_effects: []

  # --- JointWorkCase ---
  - method: POST
    path: "/agency/joint-work-cases"
    description: "Open a joint work case splitting a policy's credit between two advisors"
    roles: [FinancialRep]
    code: 201
    input: ["policy_id", "lead_advisor_id", "support_advisor_id", "split_pct_lead", "expected_policy_version"]
    output: JointWorkCase
    side_effects: ["status = OPEN", "increments Policy.version by 1"]
  - method: GET
    path: "/agency/joint-work-cases/{id}"
    description: "Get one joint work case"
    roles: [Any]
    code: 200
    input: [""]
    output: JointWorkCase
    side_effects: []
  - method: POST
    path: "/agency/joint-work-cases/{id}/submit"
    description: "Submit a joint case, reallocating credit and cascading overrides"
    roles: [FinancialRep]
    code: 200
    input: [""]
    output: JointWorkCase
    side_effects: ["status → SUBMITTED", "§1.3 commission_credit_allocation re-splits", "§1.3 override_allocation recomputes sponsors and the office cap"]
  - method: POST
    path: "/agency/joint-work-cases/{id}/close"
    description: "Close a submitted joint case"
    roles: [ManagingDirector]
    code: 200
    input: [""]
    output: JointWorkCase
    side_effects: ["status → CLOSED"]
  - method: POST
    path: "/agency/joint-work-cases/{id}/void"
    description: "Void a joint case, restoring the primary credit"
    roles: [FinancialRep, ManagingDirector]
    code: 200
    input: [""]
    output: JointWorkCase
    side_effects: ["status → VOIDED", "split credits VOIDED, primary restored to credit_pct 1.00", "team production and overrides recomputed"]
  - method: POST
    path: "/agency/joint-work-cases/{id}/reopen"
    description: "Reopen a voided joint case"
    roles: [FinancialRep]
    code: 200
    input: [""]
    output: JointWorkCase
    side_effects: ["status → OPEN", "submitted_at cleared"]

  # --- CommissionCredit ---
  - method: GET
    path: "/agency/commission-credits/{id}"
    description: "Get one commission credit"
    roles: [Any]
    code: 200
    input: [""]
    output: CommissionCredit
    side_effects: []
  - method: POST
    path: "/agency/commission-credits/{id}/pay"
    description: "Pay an accrued credit if posture allows"
    roles: [ManagingDirector]
    code: 200
    input: [""]
    output: CommissionCredit
    side_effects: ["status → PAID", "advanced_paid_cents = net_commission_cents"]
  - method: POST
    path: "/agency/commission-credits/{id}/void"
    description: "Void an unrecovered accrued credit"
    roles: [ManagingDirector]
    code: 200
    input: [""]
    output: CommissionCredit
    side_effects: ["status → VOIDED", "gross_commission_cents = 0", "team_production_cents recomputed"]
  - method: POST
    path: "/agency/commission-credits/{id}/recover"
    description: "Recover part or all of an assessed chargeback"
    roles: [ManagingDirector]
    code: 200
    input: ["amount_cents"]
    output: CommissionCredit
    side_effects: ["recovered_cents increased", "advisor.chargeback_balance_cents reduced", "status → RECOVERED when fully recovered"]

  # --- PersistencyRecord ---
  - method: POST
    path: "/agency/persistency-records"
    description: "Open a provisional persistency measurement"
    roles: [ManagingDirector]
    code: 201
    input: ["advisor_id", "measurement_period", "measurement_start", "measurement_end", "policies_issued", "policies_persisted"]
    output: PersistencyRecord
    side_effects: ["status = PROVISIONAL"]
  - method: GET
    path: "/agency/persistency-records/{id}"
    description: "Get one persistency record"
    roles: [Any]
    code: 200
    input: [""]
    output: PersistencyRecord
    side_effects: []
  - method: POST
    path: "/agency/persistency-records/{id}/dispute"
    description: "Dispute a provisional measurement"
    roles: [FinancialRep]
    code: 200
    input: [""]
    output: PersistencyRecord
    side_effects: ["status → DISPUTED"]
  - method: POST
    path: "/agency/persistency-records/{id}/resolve-dispute"
    description: "Return a disputed measurement to provisional"
    roles: [ManagingDirector]
    code: 200
    input: [""]
    output: PersistencyRecord
    side_effects: ["status → PROVISIONAL"]
  - method: POST
    path: "/agency/persistency-records/{id}/finalize"
    description: "Finalize the measurement, selecting the tier and accruing the renewal commission"
    roles: [ManagingDirector]
    code: 200
    input: [""]
    output: PersistencyRecord
    side_effects: ["§1.3 persistency_rate_and_renewal computes pct, tier and renewal", "status → FINALIZED", "advisor.renewal_commission_cents increased", "RENEWAL CommissionCredit created", "INELIGIBLE tier demotes the advisor to AT_RISK"]

  # --- OrphanPolicyAssignment ---
  - method: GET
    path: "/agency/orphan-policy-assignments/{id}"
    description: "Get one orphan policy assignment"
    roles: [Any]
    code: 200
    input: [""]
    output: OrphanPolicyAssignment
    side_effects: []
  - method: POST
    path: "/agency/orphan-policy-assignments/{id}/assign"
