  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: coach_overlap_closed_interval_with_turnaround_buffer
        grounds:
          - state_machines.Coach.AVAILABLE_to_ASSIGNED
          - validations[priority=10]
          - errors[ERR_COACH_OVERLAP]
        distinguishing_aspect: "Coach semantics = closed interval + 1-day TURNAROUND_BUFFER: Dep1 ends 08-05, assigning the same coach to Dep2 starting 08-06 is rejected (08-06 <= 08-05 + 1 buffer) with ERR_COACH_OVERLAP."
        test_recipe:
          setup:
            - "Coach ASSIGNED to Dep1 [2026-08-01,2026-08-05]; Dep2 [2026-08-06,2026-08-08] published."
          setup_api_calls:
            - call: "POST /api/tour-products"
              payload: { name: "Ovl1", duration_days: 5, base_price_per_person_cents: 100000, deposit_per_person_cents: 20000 }
