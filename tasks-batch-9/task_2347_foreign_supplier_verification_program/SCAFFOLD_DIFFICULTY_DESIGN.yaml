            - "error_id == ERR_SUPPLIER_NOT_APPROVED"
            - "SupplierFoodPair.${pair3}.entry_eligibility_status == ELIGIBLE"
            - "SupplierFoodPair.${pair3}.exemption_status == VERIFIED"
            - "SupplierFoodPair.${pair3}.modified_requirements_only == true"
