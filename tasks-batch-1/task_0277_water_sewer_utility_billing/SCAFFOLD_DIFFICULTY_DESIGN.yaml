      - name: bill_cycle_window_excludes_period_end_read
        grounds:
          - entities.BillingCycle.fields.period_end
          - calculations.tiered_water_volumetric
          - entities.Bill.fields.potable_consumption_gallons
        distinguishing_aspect: |
          A read whose read_date equals the cycle period_end (exclusive boundary) is NOT included in
          the bill's potable_consumption, whereas reads strictly inside [period_start, period_end) are.
