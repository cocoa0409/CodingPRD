    instances:
      - name: error_envelope_shape_not_found
        claim_type: violation_to_error
        grounds: [response_envelope, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Error responses follow the fixed envelope: response_type 'error' with data.error_id and data.message, plus meta.api_request_id."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - call: "GET /lots/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProductionPlanner
              captures: { err: $.data.error_id, msg: $.data.message }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_NOT_FOUND and data.message is a non-empty string"
            - "meta.api_request_id present"

