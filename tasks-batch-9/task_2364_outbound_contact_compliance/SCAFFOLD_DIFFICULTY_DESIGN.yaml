scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: abandonment_rate_regulatory_vs_internal_divergence
    grounds:
    - calculations.abandonment_rate
    - entities.Campaign.fields.regulatory_abandonment_rate_pct
    - entities.Campaign.fields.internal_abandonment_rate_pct
    - state_machines.ContactAttempt.PENDING_to_MACHINE_ANSWERED
    distinguishing_aspect: 'Dual-variant calculation in the Campaign (dialer-operations) domain: the same three dispositions yield regulatory 50.00 (live-answer denominator) and internal 33.33 (live + machine denominator), and only the regulatory figure is compared against DialerProfile.abandonment_limit_pct.'
    test_recipe:
      setup:
      - logical clock at 2026-08-03T00:00:00Z (recipient local 17:00, inside the CA 08:00-21:00 window)
      - CA calling-window policy ACTIVE 2026-07-01 -> 2027-01-01, no holidays, ONE_PARTY recording regime
      - contact +14155550101 in CA at UTC-420 with attempt_budget_total 3, WIRELESS, RND-checked (NO_DATA)
      - APPROVED VOICE script covering CA; ACTIVE EXPRESS_WRITTEN VOICE consent captured under it
      - APPROVED PREDICTIVE dialer profile with abandonment_limit_pct 50.00, amd_enabled true, 5 agents (waiver on file)
      - ACTIVE MARKETING campaign launched after a COMPLETED NATIONAL+INTERNAL scrub (eligible_target_count 1)
      - attempt 1 recorded CONNECTED_LIVE at 00:00Z, attempt 2 recorded ABANDONED at 00:31Z, attempt 3 still PENDING at 01:02Z
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-03T00:00:00Z'
        as: PlatformAdmin
      - call: POST /compliance/calling-window-policies
        payload:
          state_code: CA
          window_start_local: 08:00
          window_end_local: '21:00'
          recording_consent_regime: ONE_PARTY
          effective_from: '2026-07-01T00:00:00Z'
          effective_to: '2027-01-01T00:00:00Z'
        as: PlatformAdmin
        captures:
          pol_ca_id: $.data.id
      - call: POST /compliance/contacts
        payload:
          phone_number: '+14155550101'
          state_code: CA
          utc_offset_minutes: -420
          time_zone_label: America/Los_Angeles
          phone_type: WIRELESS
          attempt_budget_total: 3
        as: PlatformAdmin
        captures:
          c1_id: $.data.id
          c1_v: $.data.version
      - call: POST /compliance/agent-scripts
        payload:
          name: CA VOICE Script
          channel: VOICE
          disclosure_blocks:
          - IDENTIFICATION
          - PURPOSE
          - OPT_OUT
          recording_consent_mode: ONE_PARTY
          covered_state_codes:
          - CA
        as: CampaignManager
        captures:
          scr_id: $.data.id
      - call: POST /compliance/agent-scripts/${scr_id}/submit-review
        payload: {}
        as: CampaignManager
      - call: POST /compliance/agent-scripts/${scr_id}/approve
        payload:
          approval_note: Disclosures cleared
        as: ComplianceOfficer
        as_user_id: officer-script-approver
      - call: POST /compliance/consent-records
        payload:
          contact_id: ${c1_id}
          channel: VOICE
          consent_type: EXPRESS_WRITTEN
          capture_method: WEB_FORM
          disclosure_script_id: ${scr_id}
          disclosure_text_version: 1
          signature_evidence: evidence-c1-voice
          expected_contact_version: ${c1_v}
        as: ComplianceOfficer
        captures:
          cons1_id: $.data.id
      - call: POST /compliance/contacts/${c1_id}/number-status-check
        payload:
          claimed_consent_date: '2026-07-15'
        as: DialerOperator
      - call: POST /compliance/suppression-entries
        payload:
          list_type: NATIONAL
          phone_number: '+18005550000'
          source: FTC_DNC_DOWNLOAD
          source_refreshed_at: '2026-08-01T00:00:00Z'
        as: ComplianceOfficer
      - call: POST /compliance/dialer-profiles
        payload:
          mode: PREDICTIVE
          agents_available: 5
          abandonment_limit_pct: 50.0
          amd_enabled: true
          amd_abandon_on_machine: false
          abandon_message_seconds: 2
        as: DialerOperator
        captures:
          dp_id: $.data.id
      - call: POST /compliance/dialer-profiles/${dp_id}/approve
        payload:
          waiver_reference: WVR-2026-0142
        as: ComplianceOfficer
        as_user_id: officer-profile-approver
      - call: POST /compliance/campaigns
        payload:
          name: CA Aug Outreach
          channel: VOICE
          campaign_purpose: MARKETING
          target_state_codes:
          - CA
          dialer_profile_id: ${dp_id}
          agent_script_id: ${scr_id}
        as: CampaignManager
        captures:
          camp_id: $.data.id
          camp_v: $.data.version
      - call: POST /compliance/scrub-jobs
        payload:
          campaign_id: ${camp_id}
          list_types:
          - NATIONAL
          - INTERNAL
          expected_campaign_version: ${camp_v}
        as: CampaignManager
        captures:
          job_id: $.data.id
      - call: POST /compliance/scrub-jobs/${job_id}/execute
        payload: {}
        as: CampaignManager
      - call: GET /compliance/campaigns/${camp_id}
        payload: {}
        as: CampaignManager
        captures:
          camp_v2: $.data.version
      - call: POST /compliance/campaigns/${camp_id}/launch
        payload:
          certification_note: Certified for CA outreach
          expected_campaign_version: ${camp_v2}
        as: ComplianceOfficer
        as_user_id: officer-launcher
      - call: POST /compliance/contact-attempts
        payload:
          campaign_id: ${camp_id}
          contact_id: ${c1_id}
          channel: VOICE
        as: DialerOperator
        captures:
          a1: $.data.id
          a1_lines: $.data.max_lines_snapshot
      - call: POST /compliance/contact-attempts/${a1}/outcome
        payload:
          outcome: CONNECTED_LIVE
          agent_connect_seconds: 1
        as: DialerOperator
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-03T00:31:00Z'
        as: PlatformAdmin
      - call: POST /compliance/contact-attempts
        payload:
          campaign_id: ${camp_id}
          contact_id: ${c1_id}
          channel: VOICE
        as: DialerOperator
        captures:
          a2: $.data.id
          a2_lines: $.data.max_lines_snapshot
      - call: POST /compliance/contact-attempts/${a2}/outcome
        payload:
          outcome: ABANDONED
          abandon_message_played: true
        as: DialerOperator
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-03T01:02:00Z'
        as: PlatformAdmin
      - call: POST /compliance/contact-attempts
        payload:
          campaign_id: ${camp_id}
          contact_id: ${c1_id}
          channel: VOICE
        as: DialerOperator
        captures:
          a3: $.data.id
          a3_lines: $.data.max_lines_snapshot
      trigger:
      - call: POST /compliance/contact-attempts/${a3}/outcome
        payload:
          outcome: MACHINE_ANSWERED
        as: DialerOperator
      assert:
      - ContactAttempt.${a3}.outcome == MACHINE_ANSWERED
      - Campaign.${camp_id}.live_answer_count_today == 2
      - Campaign.${camp_id}.abandoned_count_today == 1
      - Campaign.${camp_id}.machine_count_today == 1
      - Campaign.${camp_id}.regulatory_abandonment_rate_pct == 50.00
      - Campaign.${camp_id}.internal_abandonment_rate_pct == 33.33
      - Campaign.${camp_id}.regulatory_abandonment_rate_pct - Campaign.${camp_id}.internal_abandonment_rate_pct == 16.67
      - Campaign.${camp_id}.status == ACTIVE and Campaign.${camp_id}.suspension_reason == null (50.00 is not > the 50.00 limit)
      - DialerProfile.${dp_id}.status == APPROVED
  - name: complaint_risk_provisional_vs_adjudicated_divergence
    grounds:
    - calculations.complaint_risk_score
    - calculations.statutory_exposure
    - calculations.contact_risk_tier
    - state_machines.Complaint.OPEN_to_SUBSTANTIATED
