          assert: ["trigger response error_id == ERR_MISSING_USER_CONTEXT (X-User-Role header omitted by the test client)"]

  # -------------------------------------------------- cross-cutting layers
  - section: cross_cutting_complexity_layers
    instances:
      - name: proof_create_stale_order_version_returns_conflict
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[proof-create-stale-order]
          - errors[ERR_STALE_ORDER_VERSION]
          - endpoints
        distinguishing_aspect: "After one proof creation advances the order version, a second POST /design-proofs still carrying the previously observed expected_order_version returns ERR_STALE_ORDER_VERSION (412)."
        test_recipe:
          setup: ["An order at version 1; one proof already created (order now at version 2), with the client still holding the version-1 value."]
          setup_api_calls:
            - call: "POST /memorials/cemeteries"
              payload: { name: "Restful Pines", allowed_materials: ["GRANITE"], max_height_cm: 90, max_width_cm: 75, max_base_width_cm: 80, requires_permit: false, permit_fee_cents: 0 }
              as: Admin
              captures: { cem: $.data.id }
            - call: "POST /memorials/customers"
              payload: { full_name: "Jane Doe", email: "jane@example.com" }
              as: Admin
              captures: { cust: $.data.id }
            - call: "POST /memorials/orders"
              payload: { customer_id: "${cust}", cemetery_id: "${cem}", subject_type: "HUMAN", material: "GRANITE", height_cm: 60, width_cm: 40, base_width_cm: 50, estimated_line_char_counts: [20, 20] }
              as: Customer
              as_user_id: "${cust}"
              captures: { ord: $.data.id, ov: $.data.version }
            - call: "POST /memorials/design-proofs"
              payload: { order_id: "${ord}", expected_order_version: "${ov}", engraving_text: "Draft One", line_char_counts: [21, 31] }
              as: Designer
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /memorials/design-proofs"
              payload: { order_id: "${ord}", expected_order_version: "${ov}", engraving_text: "Draft Two", line_char_counts: [21, 31] }
              as: Designer
              captures: { err: $.data.error_id }
          assert: ["trigger response error_id == ERR_STALE_ORDER_VERSION"]

