          Nothing in the chain is deferred to the nightly run: the single scoring call's own response
          already carries the new report status, and reads issued immediately afterwards - with no
          scoring run in existence at all (GET /scoring-runs total_count 0) - show the BasicScore row,
          the carrier's alert roll-up and the screening-risk projection already consistent with it.
