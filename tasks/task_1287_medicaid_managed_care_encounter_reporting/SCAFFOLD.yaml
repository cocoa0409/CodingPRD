# =============================================================================
# Medicaid Managed Care Encounter Reporting — benchmark seed tables
# =============================================================================

scenario: |
  Medicaid Managed Care Encounter Reporting (Medicaid MCO encounter unit): encounter data collection from claims & delegated entities, format/edit validation against state companion guide, submission cycle & error correction resubmission, completeness/accuracy audit & financial penalty exposure, capitation reconciliation & risk-adjustment linkage, provider data quality feedback loop, state reporting deadlines & extension, void/replace transaction handling

domain_name: medicaid-mco-encounter-reporting
api_prefix: /programs

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers: [optimistic_concurrency, cascading_side_effects, dual_variant_calculation, rate_threshold_triggers]
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, self_referential, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Program
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "MCO program display name" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code of the state Medicaid agency" }
      - { name: companion_guide_version, type: string, source: input, description: "State companion guide version edits are validated against (e.g. CG-2026.1)" }
      - { name: completeness_threshold, type: number, source: input, default: 0.98, description: "Audit PASS requires eligibility-benchmark completeness >= this value" }
      - { name: accuracy_threshold, type: number, source: input, default: 0.95, description: "Audit PASS requires sample accuracy >= this value" }
      - { name: provider_yellow_threshold, type: number, source: input, default: 0.02, description: "Provider scorecard error_rate >= this => tier YELLOW" }
      - { name: provider_red_threshold, type: number, source: input, default: 0.05, description: "Provider scorecard error_rate >= this => tier RED" }
      - { name: penalty_cap_percent, type: number, source: input, default: 0.10, description: "Audit penalty capped at this fraction of the cycle capitation statement provisional_paid_cents" }
      - { name: penalty_threshold_cents, type: integer, source: input, description: "Posture flips to RESTRICTED when penalties_outstanding_cents >= this value (>=, boundary inclusive)" }
      - { name: posture, type: enum, source: computed, description: "OPEN | RESTRICTED; derived from penalties_outstanding_cents vs penalty_threshold_cents; gates batch transmit" }
      - { name: penalties_outstanding_cents, type: integer, source: computed, description: "Sum of amount_cents over PenaltyAssessment status in {ASSESSED, APPEALED, UPHELD} plus reduced_amount_cents over status REDUCED; excludes WAIVED and PAID" }

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; owning program" }
      - { name: medicaid_id, type: string, source: input, description: "State-issued Medicaid ID; unique per program" }
      - { name: aid_category, type: enum, source: input, description: "TANF | SSI | DUAL | EXPANSION | CHIP; drives capitation rate lookup" }
      - { name: enrolled_from, type: datetime, source: input, description: "Enrollment start date (YYYY-MM-DD), inclusive" }
      - { name: enrolled_to, type: datetime, source: input, default: null, description: "Enrollment end date (YYYY-MM-DD), inclusive; null = open-ended" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DISENROLLED" }

  - name: Provider
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; owning program" }
      - { name: npi, type: string, source: input, description: "10-digit NPI; digits only; unique per program" }
      - { name: taxonomy_code, type: string, source: input, description: "Provider taxonomy code" }
      - { name: contract_status, type: enum, source: system, description: "ACTIVE | SUSPENDED" }
      - { name: quality_tier, type: enum, source: computed, description: "GREEN | YELLOW | RED; mirrors tier of the provider's most recently updated ProviderScorecard; GREEN when none" }

  - name: Submitter
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; owning program" }
      - { name: name, type: string, source: input, description: "Delegated entity display name" }
      - { name: trading_partner_id, type: string, source: input, description: "Trading partner / submitter code; unique per program" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED" }

  - name: SubmissionCycle
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; owning program" }
      - { name: label, type: string, source: input, description: "Cycle label, e.g. 2026-08" }
      - { name: window_start_at, type: datetime, source: input, description: "Service-date window start (ISO8601); half-open [window_start_at, window_end_at); adjacency with a sibling cycle is allowed" }
      - { name: window_end_at, type: datetime, source: input, description: "Service-date window end, exclusive" }
      - { name: submission_deadline_at, type: datetime, source: input, description: "State submission deadline" }
      - { name: effective_deadline_at, type: datetime, source: computed, description: "= requested_new_deadline_at when extension_status == APPROVED, else submission_deadline_at" }
      - { name: extension_status, type: enum, source: system, default: "NONE", description: "NONE | PENDING | APPROVED | DENIED; a new request while PENDING supersedes the pending request (OCC-guarded)" }
      - { name: requested_new_deadline_at, type: datetime, source: system, default: null, description: "Deadline carried by the latest extension request" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED" }
      - { name: intake_encounter_count, type: integer, source: computed, description: "Count of Encounter with attributed_cycle_id = this cycle and status != SUPERSEDED" }
      - { name: net_accepted_encounter_count, type: integer, source: computed, description: "Count of Encounter with attributed_cycle_id = this cycle and status == ACKNOWLEDGED" }
      - { name: net_accepted_paid_cents, type: integer, source: computed, description: "Sum of paid_amount_cents over Encounter with attributed_cycle_id = this cycle and status == ACKNOWLEDGED" }
      - { name: risk_computed_at, type: datetime, source: system, default: null, description: "Set when compute-risk-scores last ran for this cycle; null = never" }

  - name: CapitationRateSchedule
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; owning program" }
      - { name: aid_category, type: enum, source: input, description: "TANF | SSI | DUAL | EXPANSION | CHIP" }
      - { name: pmpm_cents, type: integer, source: input, description: "Per-member-per-month capitation rate in cents; > 0" }
      - { name: effective_from, type: datetime, source: input, description: "Effective window start date (YYYY-MM-DD), INCLUSIVE (closed interval)" }
      - { name: effective_to, type: datetime, source: input, description: "Effective window end date (YYYY-MM-DD), INCLUSIVE (closed interval); adjacency to another schedule of the same (program_id, aid_category) counts as overlap" }
    note: "Schedules are immutable once created; no update/retire endpoint exists."

  - name: Encounter
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id; owning program" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; enrolled member receiving service" }
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id; rendering provider" }
      - { name: submitter_id, type: string, source: input, default: null, description: "FK -> Submitter.id; delegated entity that submitted; null = direct MCO intake. REQUIRED and must equal X-User-ID when caller role is DelegatedSubmitter" }
      - { name: attributed_cycle_id, type: string, source: computed, description: "FK -> SubmissionCycle.id; the OPEN cycle of program_id whose half-open window contains service_from_date (ERR_NO_CYCLE_FOR_SERVICE_DATE if none)" }
      - { name: batch_id, type: string, source: system, default: null, description: "FK -> SubmissionBatch.id; batch currently staging this encounter; null when unstaged" }
      - { name: replaces_encounter_id, type: string, source: system, default: null, description: "FK -> Encounter.id; original encounter this record replaces (set by the replace endpoint); null for originals" }
      - { name: encounter_ref, type: string, source: input, description: "Submitter-assigned reference; unique per (program_id, submitter scope) among encounters with status not in {SUPERSEDED, VOIDED}" }
      - { name: service_from_date, type: datetime, source: input, description: "Service start date (YYYY-MM-DD); drives cycle attribution" }
      - { name: service_to_date, type: datetime, source: input, description: "Service end date (YYYY-MM-DD)" }
      - { name: place_of_service, type: string, source: input, description: "CMS place-of-service code, e.g. 11" }
      - { name: diagnosis_codes, type: array, source: input, description: "ICD-10 diagnosis codes; first 3 chars map to HCC weight table for risk scoring" }
      - { name: paid_amount_cents, type: integer, source: input, description: "Plan-paid header amount; must equal the sum of lines[].paid_amount_cents" }
      - { name: correction_sequence, type: integer, source: system, default: 0, description: "0 for originals; replacement = original.correction_sequence + 1" }
      - { name: validation_run_seq, type: integer, source: system, default: 0, description: "Increments on every validate/correct run; findings carry the run_seq that produced them" }
      - { name: status, type: enum, source: system, description: "RECEIVED | VALIDATED | REJECTED | STAGED | SUBMITTED | ACKNOWLEDGED | DENIED | VOIDED | SUPERSEDED" }

  - name: EncounterLine
    parent: Encounter
    common_fields: false
    fields:
      - { name: encounter_id, type: string, source: system, description: "FK -> Encounter.id; parent encounter" }
      - { name: line_number, type: integer, source: input, description: "1-based line number; unique within encounter" }
      - { name: procedure_code, type: string, source: input, description: "CPT/HCPCS procedure code, 5 alphanumeric chars" }
      - { name: modifiers, type: array, source: input, default: [], description: "Up to 4 procedure modifiers" }
      - { name: units, type: integer, source: input, description: "Service units; >= 1" }
      - { name: billed_amount_cents, type: integer, source: input, description: "Line billed amount; >= 0" }
      - { name: paid_amount_cents, type: integer, source: input, description: "Line paid amount; 0 <= paid <= billed" }

  - name: ValidationFinding
    parent: Encounter
    common_fields: false
    fields:
      - { name: encounter_id, type: string, source: system, description: "FK -> Encounter.id; encounter the finding belongs to" }
      - { name: run_seq, type: integer, source: system, description: "Encounter.validation_run_seq value of the validate/correct run (or 0 for STATE_ACK origin)" }
      - { name: edit_code, type: string, source: system, description: "Companion-guide edit id: E101_SERVICE_DATE_ORDER | E102_DIAG_FORMAT | E201_MEMBER_NOT_ELIGIBLE | E202_PROVIDER_INACTIVE | E301_DUPLICATE_SUSPECT | E302_UNITS_HIGH, or a state ack code of form E5xx" }
      - { name: tier, type: enum, source: system, description: "SYNTAX | REFERENTIAL | BUSINESS" }
      - { name: severity, type: enum, source: system, description: "FATAL (encounter REJECTED / state DENIED) | WARN (accepted with warning)" }
      - { name: origin, type: enum, source: system, description: "MCO_EDIT (validate/correct run) | STATE_ACK (state acknowledgment denial)" }
      - { name: field_path, type: string, source: system, description: "Dotted path of offending field" }
      - { name: message, type: string, source: system, description: "Human-readable edit description" }

  - name: SubmissionBatch
    parent: null
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: input, description: "FK -> SubmissionCycle.id; cycle this batch reports into (must be OPEN at create)" }
      - { name: status, type: enum, source: system, description: "DRAFT | SEALED | TRANSMITTED | ACKNOWLEDGED | PARTIAL | REJECTED_BATCH | RECONCILED | DISCARDED" }
      - { name: encounter_count, type: integer, source: computed, description: "Current count of staged encounters (batch_id = this batch)" }
      - { name: total_paid_cents, type: integer, source: computed, description: "Current sum of paid_amount_cents over staged encounters" }
      - { name: sealed_encounter_count, type: integer, source: system, default: null, description: "Snapshot of encounter_count frozen at seal; null while DRAFT" }
      - { name: sealed_total_paid_cents, type: integer, source: system, default: null, description: "Snapshot of total_paid_cents frozen at seal; null while DRAFT" }
      - { name: sealed_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the sealer; segregation-of-duties anchor" }
      - { name: transmitted_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the transmitter" }
      - { name: transmitted_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of transmit" }
      - { name: late, type: boolean, source: computed, default: false, description: "true iff transmitted_at > cycle.effective_deadline_at (strictly; equality is on-time)" }

  - name: Audit
    parent: null
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: input, description: "FK -> SubmissionCycle.id; audited cycle; at most one Audit per cycle" }
      - { name: sample_size, type: integer, source: input, description: "Accuracy sample size; >= 1" }
      - { name: defect_count, type: integer, source: input, description: "Defective encounters found in sample; 0 <= defect_count <= sample_size" }
      - { name: completeness_intake_rate, type: number, source: computed, description: "net_accepted_encounter_count / intake_encounter_count (0 when intake is 0); 4dp round_half_up; informational variant" }
      - { name: completeness_eligibility_rate, type: number, source: computed, description: "net_accepted_encounter_count / ceil(member_months * ENCOUNTERS_PER_MEMBER_MONTH); 4dp round_half_up; the determination-governing variant" }
      - { name: accuracy_rate, type: number, source: computed, description: "round_half_up(1 - defect_count / sample_size, 4)" }
      - { name: determination, type: enum, source: computed, description: "PASS | FAIL; PASS iff completeness_eligibility_rate >= program.completeness_threshold AND accuracy_rate >= program.accuracy_threshold (both >=, boundary inclusive)" }
      - { name: status, type: enum, source: system, description: "DRAFT | DETERMINED" }

  - name: PenaltyAssessment
    parent: null
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: system, description: "FK -> SubmissionCycle.id; cycle the penalty attaches to" }
      - { name: audit_id, type: string, source: system, default: null, description: "FK -> Audit.id; source audit; null for LATE_SUBMISSION penalties" }
      - { name: reason, type: enum, source: system, description: "COMPLETENESS | ACCURACY | COMBINED | LATE_SUBMISSION" }
      - { name: amount_cents, type: integer, source: computed, description: "Assessed amount per penalty_amount calculation" }
      - { name: reduced_amount_cents, type: integer, source: system, default: null, description: "Reduced amount set by resolve decision REDUCED; 0 <= reduced < amount_cents" }
      - { name: status, type: enum, source: system, description: "ASSESSED | APPEALED | UPHELD | WAIVED | REDUCED | PAID" }

  - name: CapitationStatement
    parent: null
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: input, description: "FK -> SubmissionCycle.id; at most one statement per cycle" }
      - { name: member_months, type: integer, source: computed, description: "Count of members whose enrollment overlaps the cycle window by >= 1 day" }
      - { name: provisional_paid_cents, type: integer, source: computed, description: "Sum over member-months of round_half_up(pmpm_cents * 1.0); provisional variant uses risk 1.0 for every member" }
      - { name: final_amount_cents, type: integer, source: computed, default: null, description: "Sum of per-member round_half_up(pmpm_cents * normalized_score), then * (1 - WITHHOLD_PERCENT) round_half_up iff the cycle audit determination is FAIL; null until reconciled" }
      - { name: adjustment_cents, type: integer, source: computed, default: null, description: "= final_amount_cents - provisional_paid_cents; negative = recovery owed by MCO" }
      - { name: withhold_applied, type: boolean, source: computed, default: false, description: "true iff WITHHOLD_PERCENT was applied in the final computation" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL_ISSUED | RECONCILED" }

  - name: RiskScoreSnapshot
    parent: null
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: system, description: "FK -> SubmissionCycle.id; scoring cycle" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; scored member" }
      - { name: raw_score, type: number, source: computed, description: "Sum of HCC_WEIGHTS over distinct 3-char diagnosis prefixes on the member's ACKNOWLEDGED encounters in the cycle window; 4dp" }
      - { name: normalized_score, type: number, source: computed, description: "raw_score / program average raw_score across enrolled members; all 1.0 when average is 0; 4dp round_half_up" }
      - { name: status, type: enum, source: system, description: "COMPUTED | APPLIED (APPLIED once a statement reconcile consumes it)" }

  - name: ProviderScorecard
    parent: null
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: system, description: "FK -> SubmissionCycle.id; measurement cycle" }
      - { name: provider_id, type: string, source: system, description: "FK -> Provider.id; measured provider" }
      - { name: run_count, type: integer, source: computed, default: 0, description: "Validation runs (validate/correct) executed for this provider's encounters attributed to this cycle" }
      - { name: fatal_finding_count, type: integer, source: computed, default: 0, description: "Cumulative FATAL findings across those runs, plus 1 per STATE_ACK denial" }
      - { name: error_rate, type: number, source: computed, description: "fatal_finding_count / max(run_count, 1); 4dp round_half_up" }
      - { name: tier, type: enum, source: computed, description: "GREEN | YELLOW | RED; error_rate >= program.provider_red_threshold => RED; >= provider_yellow_threshold => YELLOW; else GREEN (>= boundary inclusive)" }
      - { name: status, type: enum, source: system, description: "OPEN | ACKNOWLEDGED (remediation acknowledged; lifts the RED staging hold for this cycle)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Encounter
    initial_state: RECEIVED
    terminal_states: [VOIDED, SUPERSEDED]
    transitions:
      - from: RECEIVED
        to: VALIDATED
        trigger: "POST /programs/encounters/{id}/validate"
        actor: McoEncounterOps
        preconditions:
          - "status == RECEIVED (ERR_INVALID_STATE_TRANSITION otherwise)"
          - "Companion-guide edit run produces zero FATAL findings"
        side_effects:
          - "validation_run_seq += 1; ValidationFinding rows persisted with origin MCO_EDIT and this run_seq"
          - "ProviderScorecard for (provider_id, attributed_cycle_id) auto-created if absent; run_count += 1; fatal_finding_count += FATAL count of this run (0); error_rate and tier recomputed; Provider.quality_tier mirrors latest scorecard tier"
      - from: RECEIVED
        to: REJECTED
        trigger: "POST /programs/encounters/{id}/validate"
        actor: McoEncounterOps
        preconditions:
          - "status == RECEIVED"
          - "Edit run produces >= 1 FATAL finding"
        side_effects:
          - "validation_run_seq += 1; findings persisted (origin MCO_EDIT)"
          - "Scorecard run_count += 1; fatal_finding_count += FATAL count; tier recompute may flip provider to YELLOW/RED"
      - from: REJECTED
        to: VALIDATED
        trigger: "POST /programs/encounters/{id}/correct"
        actor: McoEncounterOps
        preconditions:
          - "status == REJECTED (ERR_INVALID_STATE_TRANSITION otherwise)"
          - "Re-run of edits over corrected fields produces zero FATAL"
        side_effects:
          - "validation_run_seq += 1; new findings appended with new run_seq (prior findings retained)"
          - "Scorecard run_count += 1; fatal_finding_count += FATAL count of this run; tier recomputed"
      - from: REJECTED
        to: REJECTED
        trigger: "POST /programs/encounters/{id}/correct"
        actor: McoEncounterOps
        preconditions:
          - "status == REJECTED"
          - "Re-run still produces >= 1 FATAL"
        side_effects:
          - "validation_run_seq += 1; findings appended; scorecard run_count/fatal_finding_count updated (correction loop counts against quality)"
      - from: VALIDATED
        to: STAGED
        trigger: "POST /programs/batches/{id}/encounters"
        actor: McoEncounterOps
        preconditions:
          - "Batch status == DRAFT (ERR_BATCH_SEALED otherwise)"
          - "status == VALIDATED and batch_id is null (ERR_ENCOUNTER_NOT_STAGEABLE otherwise)"
          - "attributed_cycle_id == batch.cycle_id (ERR_CYCLE_MISMATCH)"
          - "No RED hold: scorecard for (provider_id, attributed_cycle_id) tier != RED or its status == ACKNOWLEDGED (ERR_PROVIDER_QUALITY_HOLD)"
          - "OCC: expected_batch_version == batch.version (ERR_STALE_VERSION)"
        side_effects:
          - "batch_id set; batch.encounter_count / total_paid_cents recomputed; batch.version += 1"
      - from: STAGED
        to: SUBMITTED
        trigger: "POST /programs/batches/{id}/transmit"
        actor: McoCompliance
        preconditions:
          - "Parent batch transitions SEALED -> TRANSMITTED"
        side_effects:
          - "All staged encounters move to SUBMITTED with the batch"
      - from: STAGED
        to: VALIDATED
        trigger: "system (batch full rejection rework: TRANSMITTED -> REJECTED_BATCH -> DRAFT)"
        actor: system
        preconditions:
          - "Parent batch acknowledge produced all-DENIED outcome"
        side_effects:
          - "batch_id cleared; encounter returns to VALIDATED for correction/rework"
      - from: SUBMITTED
        to: ACKNOWLEDGED
        trigger: "POST /programs/batches/{id}/acknowledge with outcome ACCEPTED"
        actor: StateAgency
        preconditions:
          - "status == SUBMITTED and parent batch TRANSMITTED"
        side_effects:
          - "cycle.net_accepted_encounter_count += 1; cycle.net_accepted_paid_cents += paid_amount_cents (cycle_net_accepted calculation)"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /programs/batches/{id}/acknowledge with outcome DENIED + edit_code"
        actor: StateAgency
        preconditions:
          - "status == SUBMITTED and parent batch TRANSMITTED"
        side_effects:
          - "ValidationFinding created (tier BUSINESS, severity FATAL, origin STATE_ACK, run_seq 0, supplied edit_code)"
          - "Cascade link 1: scorecard fatal_finding_count += 1 (run_count unchanged)"
          - "Cascade link 2: error_rate recomputed; if it crosses program.provider_red_threshold the scorecard tier becomes RED"
          - "Cascade link 3: Provider.quality_tier mirrors the new tier; subsequent staging of this provider's encounters for this cycle is held (ERR_PROVIDER_QUALITY_HOLD)"
      - from: DENIED
        to: SUPERSEDED
        trigger: "POST /programs/encounters/{id}/replace"
        actor: McoEncounterOps
        preconditions:
          - "status in {DENIED, ACKNOWLEDGED} (ERR_ENCOUNTER_NOT_REPLACEABLE otherwise)"
        side_effects:
          - "New Encounter created in RECEIVED with replaces_encounter_id = this id and correction_sequence = this.correction_sequence + 1; member/provider/submitter inherited"
          - "This encounter's version += 1"
      - from: ACKNOWLEDGED
        to: SUPERSEDED
        trigger: "POST /programs/encounters/{id}/replace"
        actor: McoEncounterOps
        preconditions:
          - "status in {DENIED, ACKNOWLEDGED}"
        side_effects:
          - "Replacement created as above; version += 1"
          - "cycle.net_accepted_encounter_count -= 1; cycle.net_accepted_paid_cents -= paid_amount_cents (void/replace ledger compensation leg)"
      - from: ACKNOWLEDGED
        to: VOIDED
        trigger: "POST /programs/encounters/{id}/void"
        actor: McoEncounterOps
        preconditions:
          - "status == ACKNOWLEDGED (ERR_ENCOUNTER_NOT_VOIDABLE otherwise)"
        side_effects:
          - "cycle.net_accepted_encounter_count -= 1; cycle.net_accepted_paid_cents -= paid_amount_cents"

  - entity: SubmissionBatch
    initial_state: DRAFT
    terminal_states: [RECONCILED, DISCARDED]
    transitions:
      - from: DRAFT
        to: SEALED
        trigger: "POST /programs/batches/{id}/seal"
        actor: McoEncounterOps
        preconditions:
          - "status == DRAFT (ERR_INVALID_STATE_TRANSITION otherwise)"
          - "encounter_count >= 1 (ERR_EMPTY_BATCH)"
        side_effects:
          - "sealed_encounter_count = encounter_count; sealed_total_paid_cents = total_paid_cents; sealed_by_user_id = X-User-ID (batch_seal_totals)"
      - from: SEALED
        to: DRAFT
        trigger: "POST /programs/batches/{id}/unseal"
        actor: McoEncounterOps
        preconditions:
          - "status == SEALED"
        side_effects:
          - "sealed_encounter_count = null; sealed_total_paid_cents = null; sealed_by_user_id = null (encounters remain STAGED)"
      - from: SEALED
        to: TRANSMITTED
        trigger: "POST /programs/batches/{id}/transmit"
        actor: McoCompliance
        preconditions:
          - "status == SEALED (ERR_INVALID_STATE_TRANSITION otherwise)"
          - "Cycle status == OPEN (ERR_CYCLE_CLOSED)"
          - "Program posture == OPEN (ERR_PROGRAM_RESTRICTED)"
          - "Segregation of duties: X-User-ID != sealed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "transmitted_at = current logical clock; transmitted_by_user_id = X-User-ID; staged encounters -> SUBMITTED"
          - "late = transmitted_at > cycle.effective_deadline_at (equality is on-time)"
          - "Cascade link 1: when late, system creates PenaltyAssessment(reason LATE_SUBMISSION, status ASSESSED, amount = LATE_FLAT_CENTS + LATE_PER_DAY_CENTS * floor((transmitted_at - effective_deadline_at)/86400))"
          - "Cascade link 2: program.penalties_outstanding_cents += that amount"
          - "Cascade link 3: posture recomputed; outstanding >= penalty_threshold_cents flips Program to RESTRICTED, gating further transmits"
      - from: TRANSMITTED
        to: ACKNOWLEDGED
        trigger: "POST /programs/batches/{id}/acknowledge (all outcomes ACCEPTED)"
        actor: StateAgency
        preconditions:
          - "status == TRANSMITTED; outcomes cover each SUBMITTED encounter exactly once (ERR_ACK_INCOMPLETE)"
        side_effects:
          - "Per-encounter ACKNOWLEDGED side effects fire (cycle net accepted ledger increments)"
      - from: TRANSMITTED
        to: PARTIAL
        trigger: "POST /programs/batches/{id}/acknowledge (mixed ACCEPTED/DENIED)"
        actor: StateAgency
        preconditions:
          - "status == TRANSMITTED; outcomes complete (ERR_ACK_INCOMPLETE); >= 1 ACCEPTED and >= 1 DENIED"
        side_effects:
          - "ACCEPTED legs increment cycle ledger; DENIED legs fire the denial cascade (finding -> scorecard -> tier)"
      - from: TRANSMITTED
        to: REJECTED_BATCH
        trigger: "POST /programs/batches/{id}/acknowledge (all DENIED)"
        actor: StateAgency
        preconditions:
          - "status == TRANSMITTED; outcomes complete; every outcome DENIED"
        side_effects:
          - "DENIED side effects do NOT fire on individual encounters; whole-file rejection returns encounters instead"
      - from: REJECTED_BATCH
        to: DRAFT
        trigger: "system (immediate, same request as the all-DENIED acknowledge)"
        actor: system
        preconditions: []
        side_effects:
          - "All staged encounters -> VALIDATED with batch_id cleared; sealed snapshots cleared; sealed_by_user_id cleared; batch.version += 1"
      - from: ACKNOWLEDGED
        to: RECONCILED
        trigger: "POST /programs/batches/{id}/reconcile"
        actor: McoEncounterOps
        preconditions:
          - "status == ACKNOWLEDGED"
        side_effects: []
      - from: PARTIAL
        to: RECONCILED
        trigger: "POST /programs/batches/{id}/reconcile"
        actor: McoEncounterOps
        preconditions:
          - "status == PARTIAL"
          - "Zero encounters with batch_id = this batch remain in DENIED (each replaced or voided first) (ERR_BATCH_HAS_UNRESOLVED_DENIALS)"
        side_effects: []
      - from: DRAFT
        to: DISCARDED
        trigger: "system (cycle close discards never-transmitted drafts)"
        actor: system
        preconditions:
          - "Parent cycle close executes"
        side_effects:
          - "Any STAGED encounters -> VALIDATED with batch_id cleared"

  - entity: SubmissionCycle
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /programs/cycles/{id}/close"
        actor: StateAgency
        preconditions:
          - "status == OPEN"
          - "current logical clock > effective_deadline_at (ERR_CYCLE_NOT_CLOSABLE)"
          - "No batch of this cycle in {SEALED, TRANSMITTED, ACKNOWLEDGED, PARTIAL} (ERR_CYCLE_NOT_CLOSABLE); DRAFT batches are DISCARDED by the close"
          - "An Audit for this cycle exists with status DETERMINED (ERR_CYCLE_NOT_CLOSABLE)"
          - "A CapitationStatement for this cycle exists with status RECONCILED (ERR_CYCLE_NOT_CLOSABLE)"
        side_effects:
          - "DRAFT batches -> DISCARDED; their STAGED encounters -> VALIDATED with batch_id cleared"
    note: "extension_status is a parallel field-level dimension on OPEN cycles: NONE -> PENDING (request-extension; a request while PENDING supersedes the pending request under OCC), PENDING -> APPROVED (approve-extension; effective_deadline_at := requested_new_deadline_at), PENDING -> DENIED (deny-extension). From DENIED or APPROVED a new request-extension returns to PENDING."

  - entity: Audit
    initial_state: DRAFT
    terminal_states: [DETERMINED]
    transitions:
      - from: DRAFT
        to: DETERMINED
        trigger: "POST /programs/audits/{id}/determine"
        actor: StateAgency
        preconditions:
          - "status == DRAFT (ERR_INVALID_STATE_TRANSITION otherwise)"
          - "A CapitationStatement exists for the cycle (ERR_STATEMENT_REQUIRED)"
        side_effects:
          - "Computes completeness_intake_rate, completeness_eligibility_rate, accuracy_rate, determination"
          - "Cascade link 1: determination == FAIL creates PenaltyAssessment(status ASSESSED, amount per penalty_amount, reason COMPLETENESS | ACCURACY | COMBINED by which component(s) failed)"
          - "Cascade link 2: program.penalties_outstanding_cents += amount"
          - "Cascade link 3: posture recomputed; outstanding >= penalty_threshold_cents flips Program to RESTRICTED"
          - "Cascade link 4: RESTRICTED posture blocks subsequent batch transmit (ERR_PROGRAM_RESTRICTED)"

  - entity: PenaltyAssessment
    initial_state: ASSESSED
    terminal_states: [WAIVED, PAID]
    transitions:
      - from: ASSESSED
        to: APPEALED
        trigger: "POST /programs/penalties/{id}/appeal"
        actor: McoCompliance
        preconditions:
          - "status == ASSESSED"
        side_effects: []
      - from: APPEALED
        to: UPHELD
        trigger: "POST /programs/penalties/{id}/resolve {decision: UPHELD}"
        actor: StateAgency
        preconditions:
          - "status == APPEALED (ERR_INVALID_STATE_TRANSITION otherwise)"
        side_effects: []
      - from: APPEALED
        to: WAIVED
        trigger: "POST /programs/penalties/{id}/resolve {decision: WAIVED}"
        actor: StateAgency
        preconditions:
          - "status == APPEALED"
        side_effects:
          - "program.penalties_outstanding_cents -= amount_cents (compensating leg); posture recomputed"
      - from: APPEALED
        to: REDUCED
        trigger: "POST /programs/penalties/{id}/resolve {decision: REDUCED, reduced_amount_cents}"
        actor: StateAgency
        preconditions:
          - "status == APPEALED"
          - "0 <= reduced_amount_cents < amount_cents (ERR_INVALID_REQUEST otherwise)"
        side_effects:
          - "program.penalties_outstanding_cents -= (amount_cents - reduced_amount_cents); posture recomputed"
      - from: ASSESSED
        to: PAID
        trigger: "POST /programs/penalties/{id}/pay"
        actor: McoFinance
        preconditions:
          - "status in {ASSESSED, UPHELD, REDUCED} (ERR_INVALID_STATE_TRANSITION otherwise; APPEALED must be resolved first)"
        side_effects:
          - "program.penalties_outstanding_cents -= effective amount (reduced_amount_cents when REDUCED, else amount_cents); posture recomputed"
      - from: UPHELD
        to: PAID
        trigger: "POST /programs/penalties/{id}/pay"
        actor: McoFinance
        preconditions:
          - "status in {ASSESSED, UPHELD, REDUCED}"
        side_effects:
          - "program.penalties_outstanding_cents -= amount_cents; posture recomputed"
      - from: REDUCED
        to: PAID
        trigger: "POST /programs/penalties/{id}/pay"
        actor: McoFinance
        preconditions:
          - "status in {ASSESSED, UPHELD, REDUCED}"
        side_effects:
          - "program.penalties_outstanding_cents -= reduced_amount_cents; posture recomputed"

  - entity: CapitationStatement
    initial_state: PROVISIONAL_ISSUED
    terminal_states: [RECONCILED]
    transitions:
      - from: PROVISIONAL_ISSUED
        to: RECONCILED
        trigger: "POST /programs/capitation-statements/{id}/reconcile"
        actor: McoFinance
        preconditions:
          - "status == PROVISIONAL_ISSUED (ERR_INVALID_STATE_TRANSITION otherwise)"
          - "cycle.risk_computed_at is not null (ERR_SNAPSHOTS_REQUIRED)"
        side_effects:
          - "Computes final_amount_cents (per-member rounding, then withhold step) and adjustment_cents = final - provisional"
          - "All cycle RiskScoreSnapshots -> APPLIED"
    note: "Created directly into PROVISIONAL_ISSUED by POST /programs/capitation-statements."

  - entity: Member
    initial_state: ACTIVE
    terminal_states: [DISENROLLED]
    transitions:
      - from: ACTIVE
        to: DISENROLLED
        trigger: "POST /programs/members/{id}/disenroll"
        actor: McoEncounterOps
        preconditions:
          - "status == ACTIVE (ERR_INVALID_STATE_TRANSITION otherwise)"
        side_effects:
          - "enrolled_to := disenrolled_date; encounter validation E201 fires for service dates outside [enrolled_from, enrolled_to]"

  - entity: Provider
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /programs/providers/{id}/suspend"
        actor: McoEncounterOps
        preconditions:
          - "contract_status == ACTIVE (ERR_INVALID_STATE_TRANSITION otherwise)"
        side_effects:
          - "Encounter create names a SUSPENDED provider fails with ERR_PROVIDER_SUSPENDED; edit E202 fires at validate for in-flight encounters"
    note: "contract_status machine is ACTIVE -> SUSPENDED (no reactivation in this surface); quality_tier is a computed orthogonal dimension driven by ProviderScorecard."

  - entity: Submitter
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /programs/submitters/{id}/suspend"
        actor: McoEncounterOps
        preconditions:
          - "status == ACTIVE (ERR_INVALID_STATE_TRANSITION otherwise)"
        side_effects:
          - "Encounter create carrying this submitter_id fails with ERR_SUBMITTER_SUSPENDED"

  - entity: ProviderScorecard
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /programs/scorecards/{id}/acknowledge-remediation"
        actor: McoEncounterOps
        preconditions:
          - "status == OPEN and tier == RED (ERR_INVALID_STATE_TRANSITION otherwise; remediation applies only to RED holds)"
        side_effects:
          - "Staging hold for (provider_id, cycle_id) lifts; tier itself remains RED as the historical measurement"
    note: "Auto-created (OPEN, tier GREEN, counters 0) on the provider's first validation run attributed to the cycle."

  - entity: RiskScoreSnapshot
    initial_state: COMPUTED
    terminal_states: []
    transitions:
      - from: COMPUTED
        to: APPLIED
        trigger: "system (capitation statement reconcile consumes the cycle snapshots)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: batch-add-encounter-occ
    parent_entity: SubmissionBatch
    write_endpoint: "POST /programs/batches/{id}/encounters"
    occ_field: "expected_batch_version"
    description: |
      Adding an encounter to a DRAFT batch with an expected_batch_version that
      no longer matches the batch's current version is rejected. Both adds are
      otherwise legitimate for a DRAFT batch, so the version pin is the only
      thing that serializes two writers who each read the batch earlier.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: extension-request-occ
    parent_entity: SubmissionCycle
    write_endpoint: "POST /programs/cycles/{id}/request-extension"
    occ_field: "expected_cycle_version"
    description: |
      Requesting an extension against a cycle whose version has advanced since
      the client last observed it is rejected. A fresh extension request while
      one is PENDING legitimately supersedes the pending request, so the OCC
      pin on the cycle version is the only serialization point for two writers
      amending the same cycle's extension posture.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: completeness_rate
    trigger: "Audit determine (POST /programs/audits/{id}/determine)"
    algorithm: aggregation
    formula: |
      numerator   = cycle.net_accepted_encounter_count   # ACKNOWLEDGED minus voided/superseded
      member_months = count of members with enrollment overlapping cycle window >= 1 day
      expected    = ceil(member_months * ENCOUNTERS_PER_MEMBER_MONTH)
      intake_denominator = cycle.intake_encounter_count  # all attributed encounters except SUPERSEDED
      completeness_intake_rate      = round_half_up(numerator / intake_denominator, 4)   # 0 when intake == 0
      completeness_eligibility_rate = round_half_up(numerator / expected, 4)             # 0 when expected == 0
    input_set: "Encounter rows with attributed_cycle_id = audit.cycle_id; Member rows of the program whose [enrolled_from, enrolled_to] overlaps the cycle window"
    constants:
      ENCOUNTERS_PER_MEMBER_MONTH: 0.5
    precision: "4 decimal places, round_half_up"
    variants:
      - name: intake_based
        when: "Informational / operations view"
        difference: "Denominator is the intake encounter count; rejected-but-received encounters depress the rate"
      - name: eligibility_benchmark
        when: "State determination (the governing variant)"
        difference: "Denominator is eligibility-derived expected volume ceil(member_months * 0.5); identical numerator yields a different rate (e.g. 3 accepted / 4 intake = 0.75 vs 3 / ceil(4*0.5)=2 = 1.5)"

  - name: accuracy_rate
    trigger: "Audit determine"
    algorithm: aggregation
    formula: |
      accuracy_rate = round_half_up(1 - defect_count / sample_size, 4)
      PASS component iff accuracy_rate >= program.accuracy_threshold   # boundary inclusive
    input_set: "Audit.sample_size and Audit.defect_count pinned at audit creation"
    precision: "4 decimal places, round_half_up"

  - name: penalty_amount
    trigger: "Audit determine with determination FAIL; or batch transmit with late == true"
    algorithm: threshold
    formula: |
      # Audit-driven penalty (mode: nested min/max over >= 3 inputs)
      deficient_points = max(0, (program.completeness_threshold - completeness_eligibility_rate)) * 100
                       + max(0, (program.accuracy_threshold       - accuracy_rate)) * 100
      raw_cents   = deficient_points * RATE_PER_POINT_CENTS
      cap_cents   = round_half_up(program.penalty_cap_percent * statement.provisional_paid_cents, 0)
      amount_cents = min(raw_cents, cap_cents)
      reason = COMBINED if both components failed; COMPLETENESS if only completeness failed; ACCURACY if only accuracy failed
      # Late-submission penalty (separate shape, uncapped)
      days_late = floor((transmitted_at - cycle.effective_deadline_at) / 86400)   # seconds; transmit exactly at deadline => not late
      late_amount_cents = LATE_FLAT_CENTS + LATE_PER_DAY_CENTS * days_late         # +1 second late => days_late = 0 => flat only
    input_set: "Audit rates; the cycle's CapitationStatement.provisional_paid_cents for the cap; transmit timestamp for the late variant"
    constants:
      RATE_PER_POINT_CENTS: 50000
      LATE_FLAT_CENTS: 500000
      LATE_PER_DAY_CENTS: 100000
    precision: "integer cents; deficient points computed from 4dp rates"

  - name: capitation_amount
    trigger: "POST /programs/capitation-statements (provisional variant); POST /programs/capitation-statements/{id}/reconcile (final variant)"
    algorithm: aggregation
    formula: |
      # Member-month: a member counts once iff [enrolled_from, enrolled_to] overlaps [window_start, window_end) by >= 1 day
      # Rate lookup: ACTIVE-effective CapitationRateSchedule of (program, member.aid_category) whose CLOSED
      #   [effective_from, effective_to] contains cycle.window_start date; missing => ERR_RATE_NOT_FOUND
      # PINNED ROUNDING ORDER (nested rounding, order matters):
      #   1. per member: line_cents = round_half_up(pmpm_cents * risk_score, 0)
      #   2. sum lines:    subtotal  = sum(line_cents)
      #   3. withhold:     final     = round_half_up(subtotal * (1 - WITHHOLD_PERCENT), 0)   # final variant only, iff audit FAIL
      # Summing unrounded products first and rounding once is FORBIDDEN (produces different cents).
      provisional: risk_score = 1.0 for every member  =>  provisional_paid_cents = sum(round_half_up(pmpm, 0)) = sum(pmpm)
      final:       risk_score = RiskScoreSnapshot.normalized_score (0 when member has no snapshot encounters; snapshots exist for all enrolled)
      adjustment_cents = final_amount_cents - provisional_paid_cents
    input_set: "Members enrolled-overlapping the cycle window; their aid_category rate schedules; cycle RiskScoreSnapshots (final only); cycle Audit determination (withhold gate, final only)"
    constants:
      WITHHOLD_PERCENT: 0.05
    precision: "integer cents, round_half_up at each pinned step"
    variants:
      - name: provisional
        when: "Statement creation (paid during the cycle before encounter data is complete)"
        difference: "Risk score pinned at 1.0 for all members; no completeness withhold"
      - name: final
        when: "Reconcile after risk scores computed"
        difference: "Uses normalized risk scores; applies 5% withhold when the cycle audit determination is FAIL; same member-months can yield a materially different total (e.g. 270000 provisional vs 340000 final)"

  - name: risk_score_normalization
    trigger: "POST /programs/cycles/{id}/compute-risk-scores"
    algorithm: weighted_scoring
    formula: |
      # PINNED EVALUATION ORDER (breaks the circular-looking raw<->average dependency):
      #   pass 1: raw[m]     = sum of HCC_WEIGHTS[p] over DISTINCT 3-char prefixes p of diagnosis_codes
      #                        on m's ACKNOWLEDGED encounters with service_from_date inside the cycle window;
      #                        unknown prefixes contribute 0; members with no such encounters => raw 0
      #   pass 2: avg        = sum(raw) / count(enrolled-overlapping members)          # denominator includes zero-raw members
      #   pass 3: normalized[m] = round_half_up(raw[m] / avg, 4);  avg == 0 => normalized = 1.0 for all
      # Re-running before any reconcile overwrites existing COMPUTED rows in place (same snapshot ids, version += 1);
      # re-running after snapshots are APPLIED is rejected (ERR_INVALID_STATE_TRANSITION).
    input_set: "Members enrolled-overlapping the cycle window; ACKNOWLEDGED encounters attributed to the cycle"
    constants:
      HCC_WEIGHTS: { "E11": 0.8, "I50": 1.2, "F32": 0.4, "J45": 0.3, "N18": 1.0 }
    precision: "4 decimal places, round_half_up"

  - name: provider_error_rate
    trigger: "Encounter validate/correct run; state acknowledgment DENIED leg"
    algorithm: threshold
    formula: |
      run_count += 1 on each validate/correct run for encounters of (provider, attributed cycle)
      fatal_finding_count += FATAL findings of that run; += 1 per STATE_ACK denial (run_count unchanged)
      error_rate = round_half_up(fatal_finding_count / max(run_count, 1), 4)
      tier = RED    if error_rate >= program.provider_red_threshold      # 0.05 default; boundary inclusive
             YELLOW if error_rate >= program.provider_yellow_threshold   # 0.02 default
             GREEN  otherwise
    input_set: "ValidationFinding rows by run for the (provider_id, cycle_id) pair"
    precision: "4 decimal places, round_half_up"

  - name: cycle_net_accepted
    trigger: "Encounter SUBMITTED -> ACKNOWLEDGED; ACKNOWLEDGED -> VOIDED; ACKNOWLEDGED -> SUPERSEDED"
    algorithm: aggregation
    formula: |
      net_accepted_encounter_count = count(Encounter where attributed_cycle_id = cycle.id and status == ACKNOWLEDGED)
      net_accepted_paid_cents      = sum(paid_amount_cents over the same set)
      # Compensating invariant: voiding or superseding ACKNOWLEDGED encounter X decrements by (1, X.paid);
      # the replacement reaching ACKNOWLEDGED re-increments by (1, replacement.paid).
    input_set: "Encounter rows attributed to the cycle"
    precision: "integer"

  - name: batch_seal_totals
    trigger: "POST /programs/batches/{id}/seal"
    algorithm: aggregation
    formula: |
      sealed_encounter_count = count(encounters with batch_id = batch.id)            # == encounter_count at seal time
      sealed_total_paid_cents = sum(paid_amount_cents over the same encounters)
      # Frozen snapshots: unseal clears them back to null; live counters keep tracking staged set while DRAFT.
    input_set: "Encounters with batch_id = batch.id at seal time"
    precision: "integer"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers present; role is a declared role", error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http_status: 400, applies_to: "all" }
  - { priority: 2, category: auth, check: "Caller role is listed in the endpoint's roles; DelegatedSubmitter may only act with submitter_id == X-User-ID", error_id: ERR_FORBIDDEN_FOR_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Request body well-formed; all required fields present; scalar types valid; unknown fields ignored", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 4, category: existence, check: "Path and body referenced ids exist (program, cycle, member, provider, submitter, encounter, batch, audit, penalty, statement, scorecard)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all endpoints with ids" }
  - { priority: 5, category: state, check: "State preconditions of the target resource: ERR_INVALID_STATE_TRANSITION (generic), ERR_BATCH_SEALED (add-encounter on non-DRAFT), ERR_CYCLE_CLOSED (batch create / transmit on CLOSED cycle), ERR_ENCOUNTER_NOT_STAGEABLE (add of non-VALIDATED or already-staged), ERR_ENCOUNTER_NOT_REPLACEABLE (replace from outside {DENIED, ACKNOWLEDGED}), ERR_ENCOUNTER_NOT_VOIDABLE (void from non-ACKNOWLEDGED), ERR_EXTENSION_NOT_PENDING (approve/deny with extension_status != PENDING)", error_id: ERR_INVALID_STATE_TRANSITION, http_status: 409, applies_to: "action endpoints" }
  - { priority: 6, category: state, check: "OCC: expected_batch_version == batch.version on batch add-encounter; expected_cycle_version == cycle.version on request-extension", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /programs/batches/{id}/encounters; POST /programs/cycles/{id}/request-extension" }
  - { priority: 7, category: business_safety, check: "Program posture gate: posture == RESTRICTED blocks transmit", error_id: ERR_PROGRAM_RESTRICTED, http_status: 409, applies_to: "POST /programs/batches/{id}/transmit" }
  - { priority: 8, category: business_safety, check: "Segregation of duties: transmitter X-User-ID must differ from sealed_by_user_id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /programs/batches/{id}/transmit" }
  - { priority: 9, category: business_safety, check: "Suspended parties: provider contract_status == SUSPENDED blocks encounter create (ERR_PROVIDER_SUSPENDED); submitter status == SUSPENDED blocks encounter create carrying that submitter (ERR_SUBMITTER_SUSPENDED)", error_id: ERR_PROVIDER_SUSPENDED, http_status: 409, applies_to: "POST /programs/encounters" }
  - { priority: 10, category: business_safety, check: "Provider quality hold: scorecard for (encounter.provider_id, encounter.attributed_cycle_id) tier == RED and status != ACKNOWLEDGED blocks staging", error_id: ERR_PROVIDER_QUALITY_HOLD, http_status: 409, applies_to: "POST /programs/batches/{id}/encounters" }
  - { priority: 11, category: business_referential, check: "Cycle attribution: an OPEN cycle of the program whose half-open window contains service_from_date must exist", error_id: ERR_NO_CYCLE_FOR_SERVICE_DATE, http_status: 422, applies_to: "POST /programs/encounters; POST /programs/encounters/{id}/correct; POST /programs/encounters/{id}/replace" }
  - { priority: 12, category: business_referential, check: "Encounter attributed_cycle_id must equal batch.cycle_id when staging", error_id: ERR_CYCLE_MISMATCH, http_status: 409, applies_to: "POST /programs/batches/{id}/encounters" }
  - { priority: 13, category: business_referential, check: "Rate coverage: every aid_category with >= 1 enrolled-overlapping member has a CapitationRateSchedule whose closed window covers cycle.window_start date", error_id: ERR_RATE_NOT_FOUND, http_status: 422, applies_to: "POST /programs/capitation-statements" }
  - { priority: 14, category: business_referential, check: "A CapitationStatement for the cycle must exist before audit determination (penalty cap base)", error_id: ERR_STATEMENT_REQUIRED, http_status: 409, applies_to: "POST /programs/audits/{id}/determine" }
  - { priority: 15, category: business_referential, check: "Risk snapshots must have been computed for the cycle before reconcile (cycle.risk_computed_at not null)", error_id: ERR_SNAPSHOTS_REQUIRED, http_status: 409, applies_to: "POST /programs/capitation-statements/{id}/reconcile" }
  - { priority: 16, category: business_fiscal, check: "Header paid_amount_cents must equal the sum of lines[].paid_amount_cents", error_id: ERR_HEADER_LINES_PAID_MISMATCH, http_status: 422, applies_to: "POST /programs/encounters; POST /programs/encounters/{id}/correct; POST /programs/encounters/{id}/replace" }
  - { priority: 17, category: business_fiscal, check: "Each line: 0 <= paid_amount_cents <= billed_amount_cents; units >= 1", error_id: ERR_PAID_EXCEEDS_BILLED, http_status: 422, applies_to: "POST /programs/encounters; POST /programs/encounters/{id}/correct; POST /programs/encounters/{id}/replace" }
  - { priority: 18, category: business_temporal, check: "Cycle windows of one program are half-open and must not overlap; adjacency (start == other.end) is allowed; window_end_at > window_start_at", error_id: ERR_CYCLE_OVERLAP, http_status: 409, applies_to: "POST /programs/cycles" }
  - { priority: 19, category: business_temporal, check: "Rate schedule closed windows must not overlap per (program_id, aid_category); adjacency (new.effective_from == existing.effective_to) IS overlap", error_id: ERR_RATE_SCHEDULE_OVERLAP, http_status: 409, applies_to: "POST /programs/rate-schedules" }
  - { priority: 20, category: business_temporal, check: "Extension request allowed only while now <= cycle.effective_deadline_at (boundary inclusive)", error_id: ERR_EXTENSION_WINDOW_CLOSED, http_status: 409, applies_to: "POST /programs/cycles/{id}/request-extension" }
  - { priority: 21, category: business_temporal, check: "requested_new_deadline_at must be strictly greater than cycle.effective_deadline_at", error_id: ERR_EXTENSION_REGRESSION, http_status: 422, applies_to: "POST /programs/cycles/{id}/request-extension" }
  - { priority: 22, category: business_temporal, check: "Cycle close timing/completeness: now > effective_deadline_at, no batch in {SEALED, TRANSMITTED, ACKNOWLEDGED, PARTIAL}, audit DETERMINED, statement RECONCILED", error_id: ERR_CYCLE_NOT_CLOSABLE, http_status: 409, applies_to: "POST /programs/cycles/{id}/close" }
  - { priority: 23, category: business_constraint, check: "encounter_ref unique per (program_id, submitter scope) among encounters with status not in {SUPERSEDED, VOIDED}", error_id: ERR_DUPLICATE_ENCOUNTER_REF, http_status: 409, applies_to: "POST /programs/encounters; POST /programs/encounters/{id}/replace" }
  - { priority: 24, category: business_constraint, check: "At most one Audit per cycle", error_id: ERR_AUDIT_EXISTS, http_status: 409, applies_to: "POST /programs/audits" }
  - { priority: 25, category: business_constraint, check: "At most one CapitationStatement per cycle", error_id: ERR_STATEMENT_EXISTS, http_status: 409, applies_to: "POST /programs/capitation-statements" }
  - { priority: 26, category: business_constraint, check: "Seal requires encounter_count >= 1", error_id: ERR_EMPTY_BATCH, http_status: 409, applies_to: "POST /programs/batches/{id}/seal" }
  - { priority: 27, category: business_constraint, check: "Acknowledge outcomes must cover each SUBMITTED encounter of the batch exactly once, no extras; DENIED outcomes require edit_code matching ^E5[0-9]{2}_", error_id: ERR_ACK_INCOMPLETE, http_status: 422, applies_to: "POST /programs/batches/{id}/acknowledge" }
  - { priority: 28, category: business_constraint, check: "Audit sample sanity: sample_size >= 1 and 0 <= defect_count <= sample_size", error_id: ERR_AUDIT_SAMPLE_INVALID, http_status: 422, applies_to: "POST /programs/audits" }
  - { priority: 29, category: business_constraint, check: "PARTIAL batch reconcile requires zero remaining DENIED encounters in the batch", error_id: ERR_BATCH_HAS_UNRESOLVED_DENIALS, http_status: 409, applies_to: "POST /programs/batches/{id}/reconcile" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Program & clock ---
  - { method: POST, path: "/programs", description: "Create an MCO program with penalty/threshold configuration", roles: [StateAgency], code: 201, input: [name, state_code, companion_guide_version, penalty_threshold_cents, 'completeness_threshold?', 'accuracy_threshold?', 'provider_yellow_threshold?', 'provider_red_threshold?', 'penalty_cap_percent?'], output: Program, side_effects: ["posture=OPEN, penalties_outstanding_cents=0"] }
  - { method: GET, path: "/programs/{id}", description: "Get a program (posture, outstanding penalties)", roles: [StateAgency, McoEncounterOps, McoCompliance, McoFinance, DelegatedSubmitter], code: 200, input: [], output: Program, side_effects: [] }
  - { method: POST, path: "/_clock/set_current_utc", description: "Test-driving logical clock. Before any call the clock reads exactly 2026-08-01T00:00:00Z (fixed startup default, never wall-clock); this endpoint sets it. All deadline/late/window logic reads this clock.", roles: [StateAgency], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["sets the logical clock"] }

  # --- Members ---
  - { method: POST, path: "/programs/members", description: "Enroll a member", roles: [McoEncounterOps], code: 201, input: [program_id, medicaid_id, aid_category, enrolled_from, 'enrolled_to?'], output: Member, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/programs/members/{id}", description: "Get a member", roles: [StateAgency, McoEncounterOps, McoCompliance, McoFinance, DelegatedSubmitter], code: 200, input: [], output: Member, side_effects: [] }
  - { method: GET, path: "/programs/members", description: "List members", roles: [StateAgency, McoEncounterOps, McoCompliance, McoFinance, DelegatedSubmitter], code: 200, input: [ 'program_id?', 'status?', 'aid_category?', 'limit?', 'offset?'], output: "Member[]", side_effects: [] }
  - { method: POST, path: "/programs/members/{id}/disenroll", description: "Disenroll a member effective disenrolled_date (sets enrolled_to)", roles: [McoEncounterOps], code: 200, input: [disenrolled_date], output: Member, side_effects: ["status -> DISENROLLED, enrolled_to := disenrolled_date"] }

  # --- Providers ---
  - { method: POST, path: "/programs/providers", description: "Register a provider (npi must be 10 digits)", roles: [McoEncounterOps], code: 201, input: [program_id, npi, taxonomy_code], output: Provider, side_effects: ["contract_status=ACTIVE, quality_tier=GREEN"] }
  - { method: GET, path: "/programs/providers/{id}", description: "Get a provider", roles: [StateAgency, McoEncounterOps, McoCompliance, McoFinance, DelegatedSubmitter], code: 200, input: [], output: Provider, side_effects: [] }
  - { method: GET, path: "/programs/providers", description: "List providers", roles: [StateAgency, McoEncounterOps, McoCompliance, McoFinance, DelegatedSubmitter], code: 200, input: [ 'program_id?', 'contract_status?', 'quality_tier?', 'limit?', 'offset?'], output: "Provider[]", side_effects: [] }
  - { method: POST, path: "/programs/providers/{id}/suspend", description: "Suspend a provider's contract", roles: [McoEncounterOps], code: 200, input: [], output: Provider, side_effects: ["contract_status -> SUSPENDED"] }

  # --- Submitters (delegated entities) ---
  - { method: POST, path: "/programs/submitters", description: "Register a delegated entity / trading partner", roles: [McoEncounterOps], code: 201, input: [program_id, name, trading_partner_id], output: Submitter, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/programs/submitters/{id}", description: "Get a submitter", roles: [StateAgency, McoEncounterOps, McoCompliance, McoFinance, DelegatedSubmitter], code: 200, input: [], output: Submitter, side_effects: [] }
  - { method: GET, path: "/programs/submitters", description: "List submitters", roles: [StateAgency, McoEncounterOps, McoCompliance, McoFinance, DelegatedSubmitter], code: 200, input: [ 'program_id?', 'status?', 'limit?', 'offset?'], output: "Submitter[]", side_effects: [] }
  - { method: POST, path: "/programs/submitters/{id}/suspend", description: "Suspend a delegated submitter", roles: [McoEncounterOps], code: 200, input: [], output: Submitter, side_effects: ["status -> SUSPENDED"] }

  # --- Submission cycles ---
  - { method: POST, path: "/programs/cycles", description: "Create a submission cycle (half-open window; overlap rejected, adjacency allowed)", roles: [StateAgency], code: 201, input: [program_id, label, window_start_at, window_end_at, submission_deadline_at], output: SubmissionCycle, side_effects: ["status=OPEN, extension_status=NONE, effective_deadline_at=submission_deadline_at"] }
  - { method: GET, path: "/programs/cycles/{id}", description: "Get a cycle (tallies, deadlines, extension posture)", roles: [StateAgency, McoEncounterOps, McoCompliance, McoFinance, DelegatedSubmitter], code: 200, input: [], output: SubmissionCycle, side_effects: [] }
  - { method: GET, path: "/programs/cycles", description: "List cycles", roles: [StateAgency, McoEncounterOps, McoCompliance, McoFinance, DelegatedSubmitter], code: 200, input: [ 'program_id?', 'status?', 'limit?', 'offset?'], output: "SubmissionCycle[]", side_effects: [] }
  - { method: POST, path: "/programs/cycles/{id}/close", description: "Close a cycle after reconciliation (discards DRAFT batches)", roles: [StateAgency], code: 200, input: [], output: SubmissionCycle, side_effects: ["status -> CLOSED; DRAFT batches -> DISCARDED with their encounters returned to VALIDATED"] }
  - { method: POST, path: "/programs/cycles/{id}/compute-risk-scores", description: "Compute/overwrite RiskScoreSnapshots for enrolled members from ACKNOWLEDGED encounters", roles: [McoFinance], code: 200, input: [], output: "RiskScoreSnapshot[]", side_effects: ["risk_score_normalization; cycle.risk_computed_at set; rejected with ERR_INVALID_STATE_TRANSITION if snapshots already APPLIED"] }
  - { method: POST, path: "/programs/cycles/{id}/request-extension", description: "Request a deadline extension (supersedes a PENDING request; OCC-guarded)", roles: [McoCompliance], code: 200, input: [requested_new_deadline_at, reason, expected_cycle_version], output: SubmissionCycle, side_effects: ["extension_status -> PENDING, requested_new_deadline_at set, cycle.version += 1"] }
  - { method: POST, path: "/programs/cycles/{id}/approve-extension", description: "State approves the pending extension", roles: [StateAgency], code: 200, input: [], output: SubmissionCycle, side_effects: ["extension_status -> APPROVED; effective_deadline_at := requested_new_deadline_at"] }
  - { method: POST, path: "/programs/cycles/{id}/deny-extension", description: "State denies the pending extension", roles: [StateAgency], code: 200, input: [], output: SubmissionCycle, side_effects: ["extension_status -> DENIED; effective_deadline_at unchanged"] }

  # --- Capitation rate schedules ---
  - { method: POST, path: "/programs/rate-schedules", description: "Create a capitation rate schedule (closed window; overlap per aid_category rejected, adjacency counts as overlap)", roles: [StateAgency], code: 201, input: [program_id, aid_category, pmpm_cents, effective_from, effective_to], output: CapitationRateSchedule, side_effects: [] }
  - { method: GET, path: "/programs/rate-schedules/{id}", description: "Get a rate schedule", roles: [StateAgency, McoEncounterOps, McoCompliance, McoFinance, DelegatedSubmitter], code: 200, input: [], output: CapitationRateSchedule, side_effects: [] }
  - { method: GET, path: "/programs/rate-schedules", description: "List rate schedules", roles: [StateAgency, McoEncounterOps, McoCompliance, McoFinance, DelegatedSubmitter], code: 200, input: [ 'program_id?', 'aid_category?', 'limit?', 'offset?'], output: "CapitationRateSchedule[]", side_effects: [] }

  # --- Encounters ---
  - { method: POST, path: "/programs/encounters", description: "Intake an encounter (direct or via delegated submitter); runs structural checks, attributes cycle, starts RECEIVED", roles: [McoEncounterOps, DelegatedSubmitter], code: 201, input: [program_id, member_id, provider_id, encounter_ref, service_from_date, service_to_date, place_of_service, diagnosis_codes, paid_amount_cents, lines, 'submitter_id?'], output: Encounter, side_effects: ["status=RECEIVED, attributed_cycle_id computed, cycle.intake_encounter_count += 1"] }
  - { method: GET, path: "/programs/encounters/{id}", description: "Get an encounter", roles: [StateAgency, McoEncounterOps, McoCompliance, McoFinance, DelegatedSubmitter], code: 200, input: [], output: Encounter, side_effects: [] }
  - { method: GET, path: "/programs/encounters", description: "List/filter encounters", roles: [StateAgency, McoEncounterOps, McoCompliance, McoFinance, DelegatedSubmitter], code: 200, input: [ 'program_id?', 'member_id?', 'provider_id?', 'submitter_id?', 'attributed_cycle_id?', 'batch_id?', 'replaces_encounter_id?', 'status?', 'limit?', 'offset?'], output: "Encounter[]", side_effects: [] }
  - { method: GET, path: "/programs/encounters/{id}/lines", description: "List lines of an encounter", roles: [StateAgency, McoEncounterOps, McoCompliance, McoFinance, DelegatedSubmitter], code: 200, input: [ 'limit?', 'offset?'], output: "EncounterLine[]", side_effects: [] }
  - { method: GET, path: "/programs/encounters/{id}/findings", description: "List validation findings of an encounter (all runs)", roles: [StateAgency, McoEncounterOps, McoCompliance, McoFinance, DelegatedSubmitter], code: 200, input: [ 'run_seq?', 'severity?', 'limit?', 'offset?'], output: "ValidationFinding[]", side_effects: [] }
  - { method: POST, path: "/programs/encounters/{id}/validate", description: "Run companion-guide edits (E1xx syntax, E2xx referential, E3xx business); VALIDATED or REJECTED", roles: [McoEncounterOps], code: 200, input: [], output: Encounter, side_effects: ["findings persisted; scorecard run_count/fatal_finding_count updated; tier recomputed"] }
  - { method: POST, path: "/programs/encounters/{id}/correct", description: "Correct a REJECTED encounter and re-run edits (correction loop; in place)", roles: [McoEncounterOps], code: 200, input: [ 'service_from_date?', 'service_to_date?', 'place_of_service?', 'diagnosis_codes?', 'paid_amount_cents?', 'lines?'], output: Encounter, side_effects: ["new validation run; findings appended; scorecard updated"] }
  - { method: POST, path: "/programs/encounters/{id}/replace", description: "Void/replace pair: supersede a DENIED or ACKNOWLEDGED encounter and create its replacement in RECEIVED", roles: [McoEncounterOps], code: 201, input: [encounter_ref, service_from_date, service_to_date, place_of_service, diagnosis_codes, paid_amount_cents, lines], output: Encounter, side_effects: ["original -> SUPERSEDED (version += 1); replacement correction_sequence = original + 1; if original was ACKNOWLEDGED the cycle net accepted ledger decrements"] }
  - { method: POST, path: "/programs/encounters/{id}/void", description: "Void an ACKNOWLEDGED encounter", roles: [McoEncounterOps], code: 200, input: [ 'void_reason?'], output: Encounter, side_effects: ["status -> VOIDED; cycle net accepted ledger decrements"] }

  # --- Submission batches ---
  - { method: POST, path: "/programs/batches", description: "Create a DRAFT batch for an OPEN cycle", roles: [McoEncounterOps], code: 201, input: [cycle_id], output: SubmissionBatch, side_effects: ["status=DRAFT"] }
  - { method: GET, path: "/programs/batches/{id}", description: "Get a batch", roles: [StateAgency, McoEncounterOps, McoCompliance, McoFinance, DelegatedSubmitter], code: 200, input: [], output: SubmissionBatch, side_effects: [] }
  - { method: GET, path: "/programs/batches", description: "List batches", roles: [StateAgency, McoEncounterOps, McoCompliance, McoFinance, DelegatedSubmitter], code: 200, input: [ 'cycle_id?', 'status?', 'limit?', 'offset?'], output: "SubmissionBatch[]", side_effects: [] }
  - { method: POST, path: "/programs/batches/{id}/encounters", description: "Stage a VALIDATED encounter into a DRAFT batch (OCC: expected_batch_version)", roles: [McoEncounterOps], code: 200, input: [encounter_id, expected_batch_version], output: SubmissionBatch, side_effects: ["encounter -> STAGED; encounter_count/total_paid_cents recomputed; batch.version += 1"] }
  - { method: POST, path: "/programs/batches/{id}/seal", description: "Seal a non-empty DRAFT batch (freezes snapshot totals)", roles: [McoEncounterOps], code: 200, input: [], output: SubmissionBatch, side_effects: ["status -> SEALED; batch_seal_totals; sealed_by_user_id = X-User-ID"] }
  - { method: POST, path: "/programs/batches/{id}/unseal", description: "Reopen a SEALED batch to DRAFT (clears seal snapshot)", roles: [McoEncounterOps], code: 200, input: [], output: SubmissionBatch, side_effects: ["status -> DRAFT; seal snapshot cleared"] }
  - { method: POST, path: "/programs/batches/{id}/transmit", description: "Transmit a SEALED batch to the state (deadline/posture/SoD gates; late transmit spawns penalty cascade)", roles: [McoCompliance], code: 200, input: [], output: SubmissionBatch, side_effects: ["status -> TRANSMITTED; encounters -> SUBMITTED; late flag computed; late penalty cascade when late"] }
  - { method: POST, path: "/programs/batches/{id}/acknowledge", description: "State acknowledgment with per-encounter outcomes: [{encounter_id, outcome: ACCEPTED|DENIED, edit_code?}]; all-ACCEPTED => ACKNOWLEDGED, mixed => PARTIAL, all-DENIED => REJECTED_BATCH then auto-return to DRAFT", roles: [StateAgency], code: 200, input: [outcomes], output: SubmissionBatch, side_effects: ["per-encounter ACK/DENIED transitions; cycle net accepted ledger; denial -> scorecard cascade"] }
  - { method: POST, path: "/programs/batches/{id}/reconcile", description: "Reconcile an ACKNOWLEDGED batch, or a PARTIAL batch whose DENIED encounters have all been replaced/voided", roles: [McoEncounterOps], code: 200, input: [], output: SubmissionBatch, side_effects: ["status -> RECONCILED"] }

  # --- Audits ---
  - { method: POST, path: "/programs/audits", description: "Open a completeness/accuracy audit for a cycle (sample pinned at creation; one per cycle)", roles: [StateAgency], code: 201, input: [cycle_id, sample_size, defect_count], output: Audit, side_effects: ["status=DRAFT"] }
  - { method: GET, path: "/programs/audits/{id}", description: "Get an audit", roles: [StateAgency, McoEncounterOps, McoCompliance, McoFinance, DelegatedSubmitter], code: 200, input: [], output: Audit, side_effects: [] }
  - { method: GET, path: "/programs/audits", description: "List audits", roles: [StateAgency, McoEncounterOps, McoCompliance, McoFinance, DelegatedSubmitter], code: 200, input: [ 'cycle_id?', 'status?', 'limit?', 'offset?'], output: "Audit[]", side_effects: [] }
  - { method: POST, path: "/programs/audits/{id}/determine", description: "Compute rates, render PASS/FAIL determination, spawn penalty cascade on FAIL", roles: [StateAgency], code: 200, input: [], output: Audit, side_effects: ["completeness_rate + accuracy_rate computed; determination; FAIL creates PenaltyAssessment and recomputes program posture"] }

  # --- Penalties ---
  - { method: GET, path: "/programs/penalties/{id}", description: "Get a penalty assessment", roles: [StateAgency, McoEncounterOps, McoCompliance, McoFinance, DelegatedSubmitter], code: 200, input: [], output: PenaltyAssessment, side_effects: [] }
  - { method: GET, path: "/programs/penalties", description: "List penalty assessments", roles: [StateAgency, McoEncounterOps, McoCompliance, McoFinance, DelegatedSubmitter], code: 200, input: [ 'cycle_id?', 'audit_id?', 'status?', 'limit?', 'offset?'], output: "PenaltyAssessment[]", side_effects: [] }
  - { method: POST, path: "/programs/penalties/{id}/appeal", description: "MCO appeals an ASSESSED penalty", roles: [McoCompliance], code: 200, input: [], output: PenaltyAssessment, side_effects: ["status -> APPEALED"] }
  - { method: POST, path: "/programs/penalties/{id}/resolve", description: "State resolves an appealed penalty: decision UPHELD | WAIVED | REDUCED (reduced_amount_cents required iff REDUCED)", roles: [StateAgency], code: 200, input: [decision, 'reduced_amount_cents?'], output: PenaltyAssessment, side_effects: ["status transition; program.penalties_outstanding_cents and posture recomputed on WAIVED/REDUCED"] }
  - { method: POST, path: "/programs/penalties/{id}/pay", description: "MCO finance pays an ASSESSED/UPHELD/REDUCED penalty", roles: [McoFinance], code: 200, input: [], output: PenaltyAssessment, side_effects: ["status -> PAID; program.penalties_outstanding_cents and posture recomputed"] }

  # --- Capitation statements ---
  - { method: POST, path: "/programs/capitation-statements", description: "Create and issue the provisional statement for a cycle (one per cycle)", roles: [McoFinance], code: 201, input: [cycle_id], output: CapitationStatement, side_effects: ["member_months and provisional_paid_cents computed (risk 1.0); status=PROVISIONAL_ISSUED"] }
  - { method: GET, path: "/programs/capitation-statements/{id}", description: "Get a statement", roles: [StateAgency, McoEncounterOps, McoCompliance, McoFinance, DelegatedSubmitter], code: 200, input: [], output: CapitationStatement, side_effects: [] }
  - { method: GET, path: "/programs/capitation-statements", description: "List statements", roles: [StateAgency, McoEncounterOps, McoCompliance, McoFinance, DelegatedSubmitter], code: 200, input: [ 'cycle_id?', 'status?', 'limit?', 'offset?'], output: "CapitationStatement[]", side_effects: [] }
  - { method: POST, path: "/programs/capitation-statements/{id}/reconcile", description: "Compute final amount from risk snapshots (+ completeness withhold on audit FAIL) and post the reconciliation adjustment", roles: [McoFinance], code: 200, input: [], output: CapitationStatement, side_effects: ["final_amount_cents, adjustment_cents, withhold_applied computed; status -> RECONCILED; snapshots -> APPLIED"] }

  # --- Risk snapshots ---
  - { method: GET, path: "/programs/risk-snapshots/{id}", description: "Get a risk score snapshot", roles: [StateAgency, McoEncounterOps, McoCompliance, McoFinance, DelegatedSubmitter], code: 200, input: [], output: RiskScoreSnapshot, side_effects: [] }
  - { method: GET, path: "/programs/risk-snapshots", description: "List risk score snapshots", roles: [StateAgency, McoEncounterOps, McoCompliance, McoFinance, DelegatedSubmitter], code: 200, input: [ 'cycle_id?', 'member_id?', 'status?', 'limit?', 'offset?'], output: "RiskScoreSnapshot[]", side_effects: [] }

  # --- Provider scorecards ---
  - { method: GET, path: "/programs/scorecards/{id}", description: "Get a provider scorecard", roles: [StateAgency, McoEncounterOps, McoCompliance, McoFinance, DelegatedSubmitter], code: 200, input: [], output: ProviderScorecard, side_effects: [] }
  - { method: GET, path: "/programs/scorecards", description: "List provider scorecards", roles: [StateAgency, McoEncounterOps, McoCompliance, McoFinance, DelegatedSubmitter], code: 200, input: [ 'cycle_id?', 'provider_id?', 'tier?', 'limit?', 'offset?'], output: "ProviderScorecard[]", side_effects: [] }
  - { method: POST, path: "/programs/scorecards/{id}/acknowledge-remediation", description: "Acknowledge remediation for a RED scorecard; lifts the staging hold for that provider+cycle", roles: [McoEncounterOps], code: 200, input: [], output: ProviderScorecard, side_effects: ["status -> ACKNOWLEDGED; staging hold lifted"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/malformed, or role not declared" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Role not permitted on endpoint, or DelegatedSubmitter acting outside its own submitter_id" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, invalid scalar/enum value, negative amounts, reduced_amount_cents out of range" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced id does not exist" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Target resource state does not allow the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_batch_version / expected_cycle_version does not match current version (OCC)" }
  - { id: ERR_PROGRAM_RESTRICTED, http: 409, condition: "Program posture RESTRICTED blocks batch transmit" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Transmitter X-User-ID equals sealed_by_user_id" }
  - { id: ERR_PROVIDER_SUSPENDED, http: 409, condition: "Encounter create names a SUSPENDED provider" }
  - { id: ERR_SUBMITTER_SUSPENDED, http: 409, condition: "Encounter create carries a SUSPENDED submitter" }
  - { id: ERR_PROVIDER_QUALITY_HOLD, http: 409, condition: "Provider's scorecard for the encounter's cycle is RED and remediation not acknowledged; staging blocked" }
  - { id: ERR_NO_CYCLE_FOR_SERVICE_DATE, http: 422, condition: "No OPEN cycle window of the program contains service_from_date" }
  - { id: ERR_CYCLE_MISMATCH, http: 409, condition: "Encounter attributed_cycle_id differs from batch.cycle_id at staging" }
  - { id: ERR_RATE_NOT_FOUND, http: 422, condition: "No rate schedule covers the cycle window start for an enrolled member's aid_category" }
  - { id: ERR_STATEMENT_REQUIRED, http: 409, condition: "Audit determine requires the cycle's capitation statement to exist" }
  - { id: ERR_SNAPSHOTS_REQUIRED, http: 409, condition: "Statement reconcile requires compute-risk-scores to have run for the cycle" }
  - { id: ERR_HEADER_LINES_PAID_MISMATCH, http: 422, condition: "Header paid_amount_cents != sum of lines' paid_amount_cents" }
  - { id: ERR_PAID_EXCEEDS_BILLED, http: 422, condition: "A line has paid_amount_cents > billed_amount_cents, or units < 1" }
  - { id: ERR_CYCLE_OVERLAP, http: 409, condition: "New cycle window overlaps an existing cycle of the program (half-open; adjacency allowed)" }
  - { id: ERR_RATE_SCHEDULE_OVERLAP, http: 409, condition: "New rate schedule overlaps an existing schedule of the same (program, aid_category) (closed interval; adjacency is overlap)" }
  - { id: ERR_EXTENSION_WINDOW_CLOSED, http: 409, condition: "Extension requested after the current effective deadline (strictly greater)" }
  - { id: ERR_EXTENSION_REGRESSION, http: 422, condition: "requested_new_deadline_at <= current effective_deadline_at" }
  - { id: ERR_CYCLE_NOT_CLOSABLE, http: 409, condition: "Cycle close preconditions unmet (deadline not passed, unreconciled batch, audit not DETERMINED, or statement not RECONCILED)" }
  - { id: ERR_CYCLE_CLOSED, http: 409, condition: "Batch create or transmit against a CLOSED cycle" }
  - { id: ERR_DUPLICATE_ENCOUNTER_REF, http: 409, condition: "encounter_ref already used within (program, submitter scope) by a non-SUPERSEDED, non-VOIDED encounter" }
  - { id: ERR_AUDIT_EXISTS, http: 409, condition: "An audit already exists for the cycle" }
  - { id: ERR_STATEMENT_EXISTS, http: 409, condition: "A capitation statement already exists for the cycle" }
  - { id: ERR_EMPTY_BATCH, http: 409, condition: "Seal attempted with zero staged encounters" }
  - { id: ERR_ACK_INCOMPLETE, http: 422, condition: "Acknowledge outcomes do not cover each SUBMITTED encounter exactly once, or DENIED outcome missing E5xx edit_code" }
  - { id: ERR_AUDIT_SAMPLE_INVALID, http: 422, condition: "sample_size < 1 or defect_count outside [0, sample_size]" }
  - { id: ERR_BATCH_HAS_UNRESOLVED_DENIALS, http: 409, condition: "PARTIAL batch reconcile attempted while DENIED encounters remain in the batch" }
  - { id: ERR_ENCOUNTER_NOT_STAGEABLE, http: 409, condition: "Encounter not VALIDATED or already staged when added to a batch" }
  - { id: ERR_ENCOUNTER_NOT_REPLACEABLE, http: 409, condition: "Replace attempted from a status outside {DENIED, ACKNOWLEDGED}" }
  - { id: ERR_ENCOUNTER_NOT_VOIDABLE, http: 409, condition: "Void attempted from a status other than ACKNOWLEDGED" }
  - { id: ERR_EXTENSION_NOT_PENDING, http: 409, condition: "Approve/deny attempted while extension_status != PENDING" }
  - { id: ERR_BATCH_SEALED, http: 409, condition: "Add-encounter attempted on a batch not in DRAFT" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: StateAgency
    description: "State Medicaid agency regulator: configures program/cycles/rates, acknowledges batches, audits, decides extensions and penalty appeals, closes cycles"
    identity: opaque
    exclusive_operations:
      - "POST /programs"
      - "POST /programs/cycles; POST /programs/cycles/{id}/close"
      - "POST /programs/cycles/{id}/approve-extension; POST /programs/cycles/{id}/deny-extension"
      - "POST /programs/rate-schedules"
      - "POST /programs/batches/{id}/acknowledge"
      - "POST /programs/audits; POST /programs/audits/{id}/determine"
      - "POST /programs/penalties/{id}/resolve"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
  - name: McoEncounterOps
    description: "MCO encounter intake/operations team: roster management, encounter intake/validation/correction/void/replace, batch build/seal/reconcile, scorecard remediation"
    identity: opaque
    exclusive_operations:
      - "POST /programs/members; POST /programs/members/{id}/disenroll"
      - "POST /programs/providers; POST /programs/providers/{id}/suspend"
      - "POST /programs/submitters; POST /programs/submitters/{id}/suspend"
      - "POST /programs/encounters/{id}/validate; POST /programs/encounters/{id}/correct; POST /programs/encounters/{id}/replace; POST /programs/encounters/{id}/void"
      - "POST /programs/batches; POST /programs/batches/{id}/encounters; POST /programs/batches/{id}/seal; POST /programs/batches/{id}/unseal; POST /programs/batches/{id}/reconcile"
      - "POST /programs/scorecards/{id}/acknowledge-remediation"
    shared_operations:
      - "POST /programs/encounters (shared with DelegatedSubmitter)"
      - "All GET endpoints"
  - name: McoCompliance
    description: "MCO compliance officer: transmits batches to the state, requests deadline extensions, appeals penalties"
    identity: opaque
    exclusive_operations:
      - "POST /programs/batches/{id}/transmit"
      - "POST /programs/cycles/{id}/request-extension"
      - "POST /programs/penalties/{id}/appeal"
    shared_operations:
      - "All GET endpoints"
  - name: McoFinance
    description: "MCO finance: capitation statements, risk score computation, penalty payment"
    identity: opaque
    exclusive_operations:
      - "POST /programs/capitation-statements; POST /programs/capitation-statements/{id}/reconcile"
      - "POST /programs/cycles/{id}/compute-risk-scores"
      - "POST /programs/penalties/{id}/pay"
    shared_operations:
      - "All GET endpoints"
  - name: DelegatedSubmitter
    description: "Delegated entity submitting encounters on behalf of providers; X-User-ID must equal the Submitter id and payloads must carry that submitter_id"
    identity: "entity_backed:Submitter"
    exclusive_operations: []
    shared_operations:
      - "POST /programs/encounters (shared with McoEncounterOps; submitter_id required and must equal X-User-ID)"
      - "All GET endpoints"
