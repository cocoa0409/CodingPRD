  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_prescription_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[rx-create-stale-visit]
          - errors[ERR_STALE_PRESCRIPTION_VERSION]
          - entities.Visit.fields.prescription_version
        distinguishing_aspect: "Two strictly sequential controlled-rx supersede creates: the first (same drug) supersedes the prior and bumps Visit.prescription_version 1->2; a second carrying the now-stale expected_visit_prescription_version (1) -> ERR_STALE_PRESCRIPTION_VERSION (412)."
        test_recipe:
          setup:
            - "Clock 2026-04-01. Physician dea_number, CA controlled authority. Cash patient. VIDEO visit cleared (prescription_version 0)."
            - "First controlled rx (schedule IV, drug Lorazepam) authored ACTIVE without OCC token (initial create, no prior to supersede; version stays 0... see chain)."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { current_utc: "2026-04-01T09:00:00.000Z" }
              as: Anonymous
            - call: "POST /physicians"
              payload: { full_name: "Dr Vega", npi: "1234567890", dea_number: "BV1234567", home_state_code: "CA" }
              as: Anonymous
              captures: { phys_id: $.data.id }
            - call: "POST /physicians/${phys_id}/state-licenses"
              payload: { state_code: "CA", issuance_type: "FULL", controlled_substance_authority: true, effective_date: "2026-01-01T00:00:00.000Z", expiration_date: "2027-01-01T00:00:00.000Z" }
              as: LicensingBoard
            - call: "POST /patients"
              payload: { full_name: "Pat B", email: "b@x.com", residence_state_code: "CA" }
              as: Anonymous
              captures: { pat_b: $.data.id }
            - call: "POST /visits"
              payload: { physician_id: "${phys_id}", patient_id: "${pat_b}", modality: "VIDEO", scheduled_at: "2026-04-02T10:00:00.000Z", determined_state_code: "CA", list_fee_cents: 10000 }
              as: Patient
              as_user_id: "${pat_b}"
              captures: { v_id: $.data.id }
            - call: "POST /visits/${v_id}/run-compliance"
              payload: {}
              as: Physician
              as_user_id: "${phys_id}"
              captures: { v_ver0: $.data.prescription_version }
            - call: "POST /visits/${v_id}/prescriptions"
              payload: { drug_name: "Lorazepam", dea_schedule: "IV", days_supply: 30, expected_visit_prescription_version: "${v_ver0}" }
              as: Physician
              as_user_id: "${phys_id}"
              captures: { rx1: $.data.id }
            - call: "GET /visits/${v_id}"
              payload: {}
              as: Physician
              as_user_id: "${phys_id}"
              captures: { v_ver1: $.data.prescription_version }
            - call: "POST /visits/${v_id}/prescriptions"
              payload: { drug_name: "Lorazepam", dea_schedule: "IV", days_supply: 30, expected_visit_prescription_version: "${v_ver1}" }
              as: Physician
              as_user_id: "${phys_id}"
              captures: { rx2: $.data.id }
          trigger:
            - call: "POST /visits/${v_id}/prescriptions"
              payload: { drug_name: "Lorazepam", dea_schedule: "IV", days_supply: 30, expected_visit_prescription_version: "${v_ver1}" }
              as: Physician
              as_user_id: "${phys_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the first rx (rx1, no prior) does not bump prescription_version; the second supersede (rx2) bumps it from ${v_ver1} (0) to 1"
            - "the trigger call, still carrying the stale ${v_ver1} (0), returns status 412 and data.error_id == ERR_STALE_PRESCRIPTION_VERSION"

