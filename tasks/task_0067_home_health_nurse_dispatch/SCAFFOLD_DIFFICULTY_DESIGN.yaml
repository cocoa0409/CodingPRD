              as: IntakeCoordinator
            - call: "POST /episodes/${ep_id}/activate"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /episodes/${ep_id}/visits"
              payload: { clinician_id: "${rn_id}", discipline: "RN", scheduled_start: "2026-02-03T09:00:00Z", scheduled_end: "2026-02-03T10:00:00Z" }
