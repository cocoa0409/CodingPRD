  # ============================================================ complexity_layers
  - section: complexity_layers
    instances:
      - name: occ_requote_stale_version_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[requote-stale-trip-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Two strictly sequential requotes carrying the same observed version: the first succeeds (version advances), the second is rejected 412 because its expected version is now stale — the OCC check (p6) fires even though the QUOTE_DRAFT state would also fail requote."
        test_recipe:
          setup: ["clock; trip leg REV 60 QUOTED; capture version v1 from the quote response"]
          setup_api_calls:
            - { call: "POST /charter/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /charter/trip-requests", payload: { customer_name: "Cust OC", customer_email: "oc@x.com", requested_category: "LIGHT_JET", origin_icao: "KLAX", destination_icao: "KTEB", departure_at: "2026-08-10T10:00:00Z", passenger_count: 0, international: false }, as: SalesAgent, captures: { trip_oc: $.data.id } }
            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_oc}", seq_no: 1, leg_type: "REVENUE", origin_icao: "KLAX", destination_icao: "KTEB", block_minutes: 60, fuel_stop: false }, as: SalesAgent }
            - { call: "POST /charter/trip-requests/${trip_oc}/quote", payload: {}, as: SalesAgent, captures: { trip_oc_v1: $.data.version } }
          trigger:
            - { call: "POST /charter/trip-requests/${trip_oc}/requote", payload: { expected_trip_request_version: "${trip_oc_v1}" }, as: SalesAgent, captures: { oc_st: $.data.status, oc_v2: $.data.version } }
            - { call: "POST /charter/trip-requests/${trip_oc}/requote", payload: { expected_trip_request_version: "${trip_oc_v1}" }, as: SalesAgent, captures: { err_oc: $.data.error_id } }
          assert:
            - "First requote: 200, status == QUOTE_DRAFT, version == ${trip_oc_v1} + 1"
            - "Second requote with the same captured version: HTTP 412 with error_id == ERR_STALE_VERSION"

      - name: occ_assignment_create_stale_version_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[assignment-create-stale-trip-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Same OCC discipline on the assignment-create write path: after a first create bumps TripRequest.version, a second create carrying the pre-create version is rejected 412 (CREATE-with-supersede is guarded by the parent's version)."
        test_recipe:
          setup: ["owner + two aircraft; trip leg REV 60 BOOKED 67500; capture trip version v from the book response"]
          setup_api_calls:
            - { call: "POST /charter/aircraft-owners", payload: { name: "Owner OA", contact_email: "oa@x.com", revenue_share_pct: 80 }, as: OpsAdmin, captures: { own_oa: $.data.id } }
            - { call: "POST /charter/aircraft", payload: { owner_id: "${own_oa}", tail_number: "N505OA", category: "LIGHT_JET", home_base_icao: "KLAX", seats: 8, hourly_rate_cents: 240000, on_ops_spec: true, initial_airframe_minutes: 0, next_check_due_minutes: 60000 }, as: OpsAdmin, captures: { ac_oa1: $.data.id } }
            - { call: "POST /charter/aircraft", payload: { owner_id: "${own_oa}", tail_number: "N506OA", category: "LIGHT_JET", home_base_icao: "KLAX", seats: 8, hourly_rate_cents: 240000, on_ops_spec: true, initial_airframe_minutes: 0, next_check_due_minutes: 60000 }, as: OpsAdmin, captures: { ac_oa2: $.data.id } }
            - { call: "POST /charter/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /charter/trip-requests", payload: { customer_name: "Cust OA", customer_email: "oa2@x.com", requested_category: "LIGHT_JET", origin_icao: "KLAX", destination_icao: "KTEB", departure_at: "2026-08-10T10:00:00Z", passenger_count: 0, international: false }, as: SalesAgent, captures: { trip_oa: $.data.id } }
            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_oa}", seq_no: 1, leg_type: "REVENUE", origin_icao: "KLAX", destination_icao: "KTEB", block_minutes: 60, fuel_stop: false }, as: SalesAgent }
            - { call: "POST /charter/trip-requests/${trip_oa}/quote", payload: {}, as: SalesAgent }
            - { call: "POST /charter/trip-requests/${trip_oa}/book", payload: { deposit_cents: 67500 }, as: SalesAgent, captures: { trip_oa_v: $.data.version } }
          trigger:
            - { call: "POST /charter/aircraft-assignments", payload: { trip_request_id: "${trip_oa}", aircraft_id: "${ac_oa1}", expected_trip_request_version: "${trip_oa_v}" }, as: DispatchManager, captures: { asg_oa1: $.data.id } }
            - { call: "POST /charter/aircraft-assignments", payload: { trip_request_id: "${trip_oa}", aircraft_id: "${ac_oa2}", expected_trip_request_version: "${trip_oa_v}" }, as: DispatchManager, captures: { err_oa: $.data.error_id } }
          assert:
            - "First create: 201 TENTATIVE (bumps TripRequest.version)"
            - "Second create with the stale captured version: HTTP 412 with error_id == ERR_STALE_VERSION"

      - name: clock_default_is_fixed_2026_08_01
        claim_type: scheduled_actions
        grounds: [endpoints, calculations.time_based_expiry]
        distinguishing_aspect: "With no set_current_utc call at all, the logical clock is exactly 2026-08-01T00:00:00Z: a quote issued against the default clock gets quote_valid_until == 2026-08-03T00:00:00Z (default + 48h)."
        test_recipe:
          setup: ["empty DB; the clock is NEVER set in this scenario"]
          setup_api_calls:
            - { call: "POST /charter/trip-requests", payload: { customer_name: "Cust CK0", customer_email: "ck0@x.com", requested_category: "LIGHT_JET", origin_icao: "KLAX", destination_icao: "KTEB", departure_at: "2026-08-20T10:00:00Z", passenger_count: 0, international: false }, as: SalesAgent, captures: { trip_ck0: $.data.id } }
            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_ck0}", seq_no: 1, leg_type: "REVENUE", origin_icao: "KLAX", destination_icao: "KTEB", block_minutes: 60, fuel_stop: false }, as: SalesAgent }
          trigger:
            - { call: "POST /charter/trip-requests/${trip_ck0}/quote", payload: {}, as: SalesAgent, captures: { ck0_valid: $.data.quote_valid_until } }
          assert:
            - "TripRequest.${trip_ck0}.quote_valid_until == 2026-08-03T00:00:00Z (proves the fixed default clock, not wall-clock)"

      - name: tsa_expiry_via_clock
        claim_type: scheduled_actions
        grounds: [state_machines.Passenger.CLEARED_to_EXPIRED, calculations.time_based_expiry]
        distinguishing_aspect: "A CLEARED screening lapses exactly when the clock passes screened_at + 72h; the passenger must be re-screened (EXPIRED is screenable again)."
        test_recipe:
          setup: ["trip QUOTED; passenger screened CLEARED at 2026-08-01T00:00:00Z; clock advanced to 2026-08-04T01:00:00Z (73h later)"]
          setup_api_calls:
            - { call: "POST /charter/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /charter/trip-requests", payload: { customer_name: "Cust TS", customer_email: "ts@x.com", requested_category: "LIGHT_JET", origin_icao: "KLAX", destination_icao: "KTEB", departure_at: "2026-08-10T10:00:00Z", passenger_count: 1, international: false }, as: SalesAgent, captures: { trip_ts: $.data.id } }
            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_ts}", seq_no: 1, leg_type: "REVENUE", origin_icao: "KLAX", destination_icao: "KTEB", block_minutes: 60, fuel_stop: false }, as: SalesAgent }
            - { call: "POST /charter/trip-requests/${trip_ts}/quote", payload: {}, as: SalesAgent }
            - { call: "POST /charter/passengers", payload: { trip_request_id: "${trip_ts}", full_name: "Pax TS", date_of_birth: "1993-03-03" }, as: SalesAgent, captures: { pax_ts: $.data.id } }
            - { call: "POST /charter/passengers/${pax_ts}/screen", payload: { outcome: "CLEARED" }, as: ComplianceOfficer, captures: { pax_ts_st: $.data.tsa_status } }
          trigger:
            - { call: "POST /charter/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T01:00:00Z" }, as: OpsAdmin }
            - { call: "GET /charter/passengers/${pax_ts}", payload: {}, as: OpsAdmin, captures: { pax_ts_st2: $.data.tsa_status } }
          assert:
            - "Before advance: tsa_status == CLEARED"
            - "After advancing the clock 73h: tsa_status == EXPIRED"

      - name: permit_expiry_via_clock
        claim_type: scheduled_actions
        grounds: [state_machines.OverflightPermit.GRANTED_to_EXPIRED, calculations.time_based_expiry]
        distinguishing_aspect: "A GRANTED permit lapses when the clock passes decided_at + 30 days (2026-08-01T00:00:00Z grant expires by 2026-09-01)."
        test_recipe:
          setup: ["international trip QUOTED; permit MX/LANDING decided GRANTED at 2026-08-01T00:00:00Z; clock advanced to 2026-09-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /charter/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /charter/trip-requests", payload: { customer_name: "Cust PE", customer_email: "pe@x.com", requested_category: "LIGHT_JET", origin_icao: "KLAX", destination_icao: "MMCZ", departure_at: "2026-10-10T10:00:00Z", passenger_count: 0, international: true }, as: SalesAgent, captures: { trip_pe: $.data.id } }
            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_pe}", seq_no: 1, leg_type: "REVENUE", origin_icao: "KLAX", destination_icao: "MMCZ", block_minutes: 60, fuel_stop: false }, as: SalesAgent }
            - { call: "POST /charter/trip-requests/${trip_pe}/quote", payload: {}, as: SalesAgent }
            - { call: "POST /charter/overflight-permits", payload: { trip_request_id: "${trip_pe}", country_code: "MX", permit_type: "LANDING", required: true }, as: SalesAgent, captures: { per_pe: $.data.id } }
            - { call: "POST /charter/overflight-permits/${per_pe}/decide", payload: { decision: "GRANTED" }, as: ComplianceOfficer, captures: { per_pe_st: $.data.status } }
          trigger:
            - { call: "POST /charter/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "GET /charter/overflight-permits/${per_pe}", payload: {}, as: OpsAdmin, captures: { per_pe_st2: $.data.status } }
          assert:
            - "Before advance: status == GRANTED"
            - "After advancing 31 days: status == EXPIRED"

      - name: window_auto_activation_holds_aircraft
        claim_type: scheduled_actions
        grounds: [state_machines.MaintenanceWindow.PLANNED_to_ACTIVE, state_machines.Aircraft.AVAILABLE_to_MAINTENANCE_HOLD]
        distinguishing_aspect: "Advancing the clock into a PLANNED window's interval activates it and puts the aircraft on MAINTENANCE_HOLD without any direct aircraft write."
        test_recipe:
          setup: ["owner + aircraft N606WA; window 2026-08-01T00:00:00Z..2026-08-02T00:00:00Z created while clock is 2026-08-01T00:00:00Z; clock advanced to 2026-08-01T12:00:00Z"]
          setup_api_calls:
            - { call: "POST /charter/aircraft-owners", payload: { name: "Owner WA", contact_email: "wa@x.com", revenue_share_pct: 80 }, as: OpsAdmin, captures: { own_wa: $.data.id } }
            - { call: "POST /charter/aircraft", payload: { owner_id: "${own_wa}", tail_number: "N606WA", category: "LIGHT_JET", home_base_icao: "KLAX", seats: 8, hourly_rate_cents: 240000, on_ops_spec: true, initial_airframe_minutes: 0, next_check_due_minutes: 60000 }, as: OpsAdmin, captures: { ac_wa: $.data.id } }
            - { call: "POST /charter/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /charter/maintenance-windows", payload: { aircraft_id: "${ac_wa}", window_type: "AOG_REPAIR", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-02T00:00:00Z" }, as: MaintenanceController, captures: { win_wa: $.data.id } }
          trigger:
            - { call: "POST /charter/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T12:00:00Z" }, as: OpsAdmin }
            - { call: "GET /charter/maintenance-windows/${win_wa}", payload: {}, as: OpsAdmin, captures: { win_wa_st: $.data.status } }
            - { call: "GET /charter/aircraft/${ac_wa}", payload: {}, as: OpsAdmin, captures: { ac_wa_st: $.data.status } }
          assert:
            - "MaintenanceWindow.${win_wa}.status == ACTIVE"
            - "Aircraft.${ac_wa}.status == MAINTENANCE_HOLD"

      - name: window_complete_resets_check_due_and_releases_aircraft
        claim_type: scheduled_actions
        grounds: [state_machines.MaintenanceWindow.ACTIVE_to_COMPLETED, entities.Aircraft.fields.next_check_due_minutes]
        distinguishing_aspect: "Completing an INSPECTION_100H window sets next_check_due_minutes = total_airframe_minutes + 6000 and returns the held aircraft to AVAILABLE (derived-field reconciliation)."
        test_recipe:
          setup: ["owner + aircraft N707WC (initial 0, due 500); INSPECTION_100H window 2026-08-01T00:00:00Z..2026-08-02T00:00:00Z activated by clock advance to 2026-08-01T12:00:00Z"]
          setup_api_calls:
            - { call: "POST /charter/aircraft-owners", payload: { name: "Owner WC2", contact_email: "wc2@x.com", revenue_share_pct: 80 }, as: OpsAdmin, captures: { own_wc2: $.data.id } }
            - { call: "POST /charter/aircraft", payload: { owner_id: "${own_wc2}", tail_number: "N707WC", category: "LIGHT_JET", home_base_icao: "KLAX", seats: 8, hourly_rate_cents: 240000, on_ops_spec: true, initial_airframe_minutes: 0, next_check_due_minutes: 500 }, as: OpsAdmin, captures: { ac_wc2: $.data.id } }
            - { call: "POST /charter/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /charter/maintenance-windows", payload: { aircraft_id: "${ac_wc2}", window_type: "INSPECTION_100H", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-02T00:00:00Z" }, as: MaintenanceController, captures: { win_wc2: $.data.id } }
            - { call: "POST /charter/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T12:00:00Z" }, as: OpsAdmin }
          trigger:
            - { call: "POST /charter/maintenance-windows/${win_wc2}/complete", payload: {}, as: MaintenanceController, captures: { win_wc2_st: $.data.status } }
            - { call: "GET /charter/aircraft/${ac_wc2}", payload: {}, as: OpsAdmin, captures: { ac_wc2_st: $.data.status, ac_wc2_due: $.data.next_check_due_minutes } }
          assert:
            - "MaintenanceWindow.${win_wc2}.status == COMPLETED"
            - "Aircraft.${ac_wc2}.next_check_due_minutes == 6000 (total_airframe_minutes 0 + 6000) and status == AVAILABLE"

      - name: adjacent_buffered_assignments_allowed
        claim_type: satisfaction_passes
        grounds: [state_machines.AircraftAssignment.TENTATIVE_to_CONFIRMED, entities.AircraftAssignment.fields.occupied_start_at]
        distinguishing_aspect: "Half-open adjacency: trip2 departing at 13:30 (occupied start 12:45) touches trip1's occupied end (12:45) without intersecting — confirm succeeds."
        test_recipe:
          setup: ["owner + aircraft; trip1 dep 2026-08-10T10:00:00Z leg REV 120 CONFIRMED (occupied [09:15, 12:45)); trip2 dep 2026-08-10T13:30:00Z leg REV 60 BOOKED with TENTATIVE assignment"]
          setup_api_calls:
            - { call: "POST /charter/aircraft-owners", payload: { name: "Owner AJ", contact_email: "aj@x.com", revenue_share_pct: 80 }, as: OpsAdmin, captures: { own_aj: $.data.id } }
            - { call: "POST /charter/aircraft", payload: { owner_id: "${own_aj}", tail_number: "N808AJ", category: "LIGHT_JET", home_base_icao: "KLAX", seats: 8, hourly_rate_cents: 240000, on_ops_spec: true, initial_airframe_minutes: 0, next_check_due_minutes: 60000 }, as: OpsAdmin, captures: { ac_aj: $.data.id } }
            - { call: "POST /charter/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /charter/trip-requests", payload: { customer_name: "Cust AJ1", customer_email: "aj1@x.com", requested_category: "LIGHT_JET", origin_icao: "KLAX", destination_icao: "KTEB", departure_at: "2026-08-10T10:00:00Z", passenger_count: 0, international: false }, as: SalesAgent, captures: { trip_aj1: $.data.id } }
            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_aj1}", seq_no: 1, leg_type: "REVENUE", origin_icao: "KLAX", destination_icao: "KTEB", block_minutes: 120, fuel_stop: false }, as: SalesAgent }
            - { call: "POST /charter/trip-requests/${trip_aj1}/quote", payload: {}, as: SalesAgent }
            - { call: "POST /charter/trip-requests/${trip_aj1}/book", payload: { deposit_cents: 135000 }, as: SalesAgent, captures: { trip_aj1_v: $.data.version } }
            - { call: "POST /charter/aircraft-assignments", payload: { trip_request_id: "${trip_aj1}", aircraft_id: "${ac_aj}", expected_trip_request_version: "${trip_aj1_v}" }, as: DispatchManager, captures: { asg_aj1: $.data.id } }
            - { call: "POST /charter/aircraft-assignments/${asg_aj1}/confirm", payload: {}, as: DispatchManager }
            - { call: "POST /charter/trip-requests", payload: { customer_name: "Cust AJ2", customer_email: "aj2@x.com", requested_category: "LIGHT_JET", origin_icao: "KTEB", destination_icao: "KLAX", departure_at: "2026-08-10T13:30:00Z", passenger_count: 0, international: false }, as: SalesAgent, captures: { trip_aj2: $.data.id } }
            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_aj2}", seq_no: 1, leg_type: "REVENUE", origin_icao: "KTEB", destination_icao: "KLAX", block_minutes: 60, fuel_stop: false }, as: SalesAgent }
            - { call: "POST /charter/trip-requests/${trip_aj2}/quote", payload: {}, as: SalesAgent }
            - { call: "POST /charter/trip-requests/${trip_aj2}/book", payload: { deposit_cents: 67500 }, as: SalesAgent, captures: { trip_aj2_v: $.data.version } }
            - { call: "POST /charter/aircraft-assignments", payload: { trip_request_id: "${trip_aj2}", aircraft_id: "${ac_aj}", expected_trip_request_version: "${trip_aj2_v}" }, as: DispatchManager, captures: { asg_aj2: $.data.id } }
          trigger:
            - { call: "POST /charter/aircraft-assignments/${asg_aj2}/confirm", payload: {}, as: DispatchManager, captures: { asg_aj2_st: $.data.status } }
          assert: ["HTTP 200; AircraftAssignment.${asg_aj2}.status == CONFIRMED (12:45 == 12:45 adjacency allowed under half-open semantics)"]

      - name: dispatch_balance_not_settled_alone
        claim_type: violation_to_error
        grounds: ["errors[ERR_BALANCE_NOT_SETTLED]", "validations[priority=11]"]
        distinguishing_aspect: "With every safety gate satisfied, the fiscal gate alone rejects dispatch: collected 67500 < quoted 270000."
        test_recipe:
          setup: ["owner + aircraft + PIC vetted + confirmed; trip leg REV 60 BOOKED with deposit only (67500), 0 pax, domestic"]
          setup_api_calls:
            - { call: "POST /charter/aircraft-owners", payload: { name: "Owner BS", contact_email: "bs@x.com", revenue_share_pct: 80 }, as: OpsAdmin, captures: { own_bs: $.data.id } }
            - { call: "POST /charter/aircraft", payload: { owner_id: "${own_bs}", tail_number: "N909BS", category: "LIGHT_JET", home_base_icao: "KLAX", seats: 8, hourly_rate_cents: 240000, on_ops_spec: true, initial_airframe_minutes: 0, next_check_due_minutes: 60000 }, as: OpsAdmin, captures: { ac_bs: $.data.id } }
            - { call: "POST /charter/crew-members", payload: { name: "Pic BS", base_icao: "KLAX", qualified_categories: ["LIGHT_JET"] }, as: OpsAdmin, captures: { crew_bs: $.data.id } }
            - { call: "POST /charter/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /charter/trip-requests", payload: { customer_name: "Cust BS", customer_email: "bs2@x.com", requested_category: "LIGHT_JET", origin_icao: "KLAX", destination_icao: "KTEB", departure_at: "2026-08-10T10:00:00Z", passenger_count: 0, international: false }, as: SalesAgent, captures: { trip_bs: $.data.id } }
            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_bs}", seq_no: 1, leg_type: "REVENUE", origin_icao: "KLAX", destination_icao: "KTEB", block_minutes: 60, fuel_stop: false }, as: SalesAgent }
            - { call: "POST /charter/trip-requests/${trip_bs}/quote", payload: {}, as: SalesAgent }
            - { call: "POST /charter/trip-requests/${trip_bs}/book", payload: { deposit_cents: 67500 }, as: SalesAgent, captures: { trip_bs_v: $.data.version } }
            - { call: "POST /charter/aircraft-assignments", payload: { trip_request_id: "${trip_bs}", aircraft_id: "${ac_bs}", expected_trip_request_version: "${trip_bs_v}" }, as: DispatchManager, captures: { asg_bs: $.data.id } }
            - { call: "POST /charter/aircraft-assignments/${asg_bs}/confirm", payload: {}, as: DispatchManager }
            - { call: "POST /charter/crew-assignments", payload: { trip_request_id: "${trip_bs}", crew_member_id: "${crew_bs}", duty_role: "PIC" }, as: DispatchManager, captures: { ca_bs: $.data.id } }
            - { call: "POST /charter/crew-assignments/${ca_bs}/vet", payload: {}, as: DispatchManager }
          trigger:
            - { call: "POST /charter/trip-requests/${trip_bs}/dispatch", payload: {}, as: DispatchManager, captures: { err_bs: $.data.error_id } }
          assert: ["HTTP 402 with error_id == ERR_BALANCE_NOT_SETTLED"]

  # ============================================================ consistency_model
  - section: consistency_model
    instances:
      - name: immediate_consistency_book_response
        claim_type: immediate
        grounds: [complexity_profile.consistency_model, calculations.payment_posture]
        distinguishing_aspect: "Immediate consistency: the book response itself carries status == BOOKED, payment_posture == DEPOSIT_PAID, and collected_cents == 67500 — no re-read needed."
        test_recipe:
          setup: ["clock; trip leg REV 60 QUOTED (270000)"]
          setup_api_calls:
            - { call: "POST /charter/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /charter/trip-requests", payload: { customer_name: "Cust IC", customer_email: "ic@x.com", requested_category: "LIGHT_JET", origin_icao: "KLAX", destination_icao: "KTEB", departure_at: "2026-08-10T10:00:00Z", passenger_count: 0, international: false }, as: SalesAgent, captures: { trip_ic: $.data.id } }
            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_ic}", seq_no: 1, leg_type: "REVENUE", origin_icao: "KLAX", destination_icao: "KTEB", block_minutes: 60, fuel_stop: false }, as: SalesAgent }
            - { call: "POST /charter/trip-requests/${trip_ic}/quote", payload: {}, as: SalesAgent }
          trigger:
            - { call: "POST /charter/trip-requests/${trip_ic}/book", payload: { deposit_cents: 67500 }, as: SalesAgent, captures: { ic_st: $.data.status, ic_pp: $.data.payment_posture, ic_col: $.data.collected_cents } }
          assert:
            - "Book response: status == BOOKED, payment_posture == DEPOSIT_PAID, collected_cents == 67500 (all derived fields visible in the same response)"

      - name: immediate_consistency_completion_cascade
        claim_type: immediate
        grounds: [complexity_profile.consistency_model, state_machines.TripRequest.DISPATCHED_to_COMPLETED]
        excluded_because:
          difficulty_instance: flight_log_final_leg_cascade
          rationale: "The final-leg POST's cascade (trip COMPLETED, aircraft hold, tentative release, statement) is asserted there immediately after the triggering call."
