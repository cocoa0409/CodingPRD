        captures:
          err: $.data.error_id
      assert:
      - error_id == ERR_TAP_LINES_NOT_READY (HTTP 409); bush stays TAPPING
  - name: window_auto_close_via_sweep
    claim_type: valid_transition
    grounds:
    - state_machines.WeatherWindow.OPEN_to_CLOSED
    - endpoints[POST /sugarhouse/seasons/{id}/run-sweep]
    distinguishing_aspect: run-sweep with clock at/past closes_at auto-transitions the OPEN window to CLOSED (system transition, ops-run checkpoint layer).
    test_recipe:
      setup:
      - window OPEN; clock moved to 2027-03-10T00:00:00Z (== closes_at)
      setup_api_calls:
      - call: POST /sugarhouse/_clock/set_current_utc
        payload:
          to_iso8601: '2027-02-15T00:00:00Z'
        as: SugarhouseManager
      - call: POST /sugarhouse/seasons
        payload:
          year: 2027
          opens_on: '2027-02-01'
          closes_on: '2027-04-15'
          planned_taps: 10000
        as: SugarhouseManager
