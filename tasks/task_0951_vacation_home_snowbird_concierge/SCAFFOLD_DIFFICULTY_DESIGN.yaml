              payload: { owner_id: "${owner_id}", label: "Interval Inn", address_line: "65 Overlap Way", state_code: "FL", travel_distance_miles: 18.0, rental_program_enrolled: true }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /property-care/service-plans"
              payload: { tier: "STANDARD", monthly_fee_cents: 19986, included_visit_units: 4, covered_visit_types: ["ROUTINE_WATCH"] }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /property-care/subscriptions"
              payload: { property_id: "${prop_id}", service_plan_id: "${plan_id}", started_on: "2026-06-01T00:00:00Z" }
              as: AccountManager
              captures: { sub_id: $.data.id }
            - call: "POST /property-care/subscriptions/${sub_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /property-care/checklist-templates"
              payload: { visit_type: "ROUTINE_WATCH", version_label: "2026.1", item_codes: ["EXT_WALK"], critical_item_codes: [] }
              as: PlatformAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /property-care/properties/${prop_id}/rental-turnovers"
              payload: { checkout_at: "2026-06-10T11:00:00Z", checkin_at: "2026-06-12T15:00:00Z", guest_reference: "BK-9002" }
              as: Dispatcher
              captures: { turn_id: $.data.id }
            - call: "POST /property-care/visits"
              payload: { property_id: "${prop_id}", checklist_template_id: "${tmpl_id}", visit_type: "ROUTINE_WATCH", trigger_source: "SCHEDULED", scheduled_start_at: "2026-06-05T13:00:00Z", scheduled_end_at: "2026-06-05T15:00:00Z" }
              as: Dispatcher
              captures: { visit_id: $.data.id }
            - call: "POST /property-care/visits/${visit_id}/defer"
              payload: { defer_reason: "WEATHER" }
              as: Dispatcher
          trigger:
            - call: "POST /property-care/visits/${visit_id}/reschedule"
              payload: { scheduled_start_at: "2026-06-11T09:00:00Z", scheduled_end_at: "2026-06-11T11:00:00Z" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response data.error_id == ERR_TURNOVER_WINDOW_OVERLAP"
            - "Visit.${visit_id}.status == DEFERRED and Visit.${visit_id}.scheduled_start_at == 2026-06-05T13:00:00.000Z"
            - "Visit.${visit_id}.deferral_count == 1"

      - name: access_grant_closed_interval_aggregate_capacity_on_physical_key
        grounds:
          - calculations.access_grant_capacity
          - validations[priority=51]
          - errors[ERR_ACCESS_CAPACITY_EXCEEDED]
          - state_machines.AccessGrant.PENDING_to_ACTIVE
          - entities.KeyAsset.fields.copies_total
          - entities.KeyAsset.fields.active_grant_count
        distinguishing_aspect: |
          Interval semantics 2 on the KeyAsset resource: CLOSED interval with an AGGREGATE
          capacity of copies_total rather than an exclusion. Two grants whose windows merely
          TOUCH at 12:00 are counted as concurrent (the opposite of the turnover rule), and
          with copies_total 1 the second activation is rejected while the first stays ACTIVE.
          A PHYSICAL key is used so that grant creation performs no code rotation.
        test_recipe:
          setup:
            - "A Z2 Property with a PHYSICAL KeyAsset labelled 'Spare front key' and copies_total 1."
            - "An ELIGIBLE LOCKSMITH vendor rated 4.2."
            - "Grant A over [2026-06-11T10:00:00Z, 2026-06-11T12:00:00Z] is created and activated at 2026-06-11T10:30:00Z."
            - "Grant B over [2026-06-11T12:00:00Z, 2026-06-11T14:00:00Z] is created; because the key is PHYSICAL no rotation occurs, so both grants carry rotation_index_at_grant 0."
          setup_api_calls:
            - call: "POST /property-care/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-11T10:30:00Z" }
              as: PlatformAdmin
