  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: resource_study_additional_round_writes_across_parallel_dimensions
        grounds:
          - state_machines.ResourceStudy.UNDER_REVIEW_to_ADDITIONAL_REQUIRED
          - state_machines.ResourceStudy.COMPLETED_to_IN_PROGRESS
          - entities.ResourceStudy.fields.additional_round_count
          - validations[priority=44]
        distinguishing_aspect: |
          ResourceStudy carries two independent dimensions (fieldwork_status and review_status) that
          advance separately on the forward path, but REQUIRE_ADDITIONAL writes both at once: it sets
          review_status ADDITIONAL_REQUIRED and drags fieldwork_status COMPLETED back to IN_PROGRESS,
          so a second report is impossible until fieldwork is completed again, and the third
          REQUIRE_ADDITIONAL is refused because additional_round_count has reached 2.
        test_recipe:
          setup:
            - "Project at STUDY_PHASE with a study plan submitted into UNDER_AGENCY_REVIEW (so fieldwork may start), a NONE-sensitivity site and one WATER_QUALITY study."
            - "An AGENCY party with conditioning authority bound to u_agency."
            - "The study has fieldwork_status COMPLETED and review_status UNDER_REVIEW after one report."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /relicensing/projects"
              payload: { license_number: "P-4417", project_name: "Two Dimension Creek", installed_capacity_mw: 12.0, base_annual_generation_mwh: 250000, license_expiration_date: "2033-12-31" }
              as: Regulator
              captures: { proj: $.data.id }
