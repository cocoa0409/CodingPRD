scenario: |
  Generate task harder than expert level!

  2572. Age-Restricted Delivery Verification (retail delivery compliance): product classification by
  restriction type with jurisdiction-level delivery permissibility rules, order-time age attestation and
  pre-verification against identity data sources, delivery-time identification check requirements with
  acceptable document types and scanning, refusal handling for intoxicated or underage recipients with
  return and refund procedures, courier training, certification and audit with secret shopper compliance
  testing, signature and photo capture retention for regulatory audit, restricted hours, dry jurisdiction
  and quantity limit enforcement, violation investigation, license risk assessment and corrective action
  with delivery partners

domain_name: age-restricted-delivery-verification

# Empty prefix: every resource collection is a top-level path (`/orders`, `/couriers`,
# `/violation-cases`). The entity graph is peer-shaped rather than a single ownership
# tree, so there is no honest single top-level resource to nest everything under.
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint

  entity_topology: graph
  # Peer aggregates linked by foreign keys in several directions plus a polymorphic
  # subject on ViolationCase (delivery_attempt_id XOR secret_shopper_test_id) and a
  # cross-aggregate edge SecretShopperTest -> Order. Not a tree.

  state_machine_shape: parallel
  # Order carries two independent dimensions (compliance_state x fulfillment_state) that
  # advance on different triggers; ViolationCase and CorrectiveActionPlan are cyclic;
  # DeliveryAttempt is a branching fork with divergent side-effect sets per branch;
  # DeliveryPartner.posture is a derived aggregate that gates child operations.

  relationship_patterns:
    - one_to_many
    - polymorphic
    - cross_aggregate

  role_model: segregation_of_duties
  # The ComplianceOfficer user who substantiates a ViolationCase is barred from reviewing
  # or verifying the CorrectiveActionPlan filed against that same case. Layered on top of
  # peer ownership: Customer owns orders, PartnerManager owns couriers, Courier owns attempts.

  consistency_model: immediate

  difficulty_level: beyond_expert
  # 15 entities / 65 endpoints / 60 error codes / 8 calculations (2 dual-variant) /
  # 8 state machines (2 cyclic, 2 parallel dimensions on Order, 1 branching fork,
  # 1 compound courier gate, 1 posture-derived partner gate).

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------

entities:
  - name: Jurisdiction
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: Regulatory jurisdiction code
        constraints: "unique across all Jurisdiction rows; pattern `[A-Z]{2}-[A-Z0-9]{2,6}`"
      - name: name
        type: string
        source: input
        description: Human-readable jurisdiction name
      - name: dry_status
        type: enum
        source: input
        description: Alcohol-delivery posture of the jurisdiction
        constraints: "one of {WET, DAMP, DRY}"
      - name: utc_offset_minutes
        type: integer
        source: input
        description: Fixed offset from UTC used to derive local wall-clock minutes; no DST modelling
        constraints: "-720 <= value <= 840"
      - name: active_policy_count
        type: integer
        source: computed
        description: "Count of RestrictionPolicy rows whose jurisdiction_id equals this row's id (all effective periods, no status filter)"
        default: 0

  - name: RestrictionPolicy
    parent: Jurisdiction
    common_fields: true
    fields:
      - name: jurisdiction_id
        type: string
        source: input
        description: "FK -> Jurisdiction.id; the jurisdiction whose delivery rules this row encodes"
      - name: restriction_type
        type: enum
        source: input
        description: Product restriction class this policy governs
        constraints: "one of {ALCOHOL, TOBACCO_VAPE, CANNABIS, PHARMACY_OTC_RESTRICTED, AEROSOL_SOLVENT}"
      - name: permissibility
        type: enum
        source: input
        description: Whether delivery of this restriction class is allowed in this jurisdiction
        constraints: "one of {PERMITTED, PERMIT_REQUIRED, PROHIBITED}"
      - name: min_age_years
        type: integer
        source: input
        description: Minimum completed age in years required of both purchaser and recipient
        constraints: "18 <= value <= 25"
      - name: delivery_window_start_minute
        type: integer
        source: input
        description: Inclusive start of the permitted local delivery window, minutes since local midnight
        constraints: "0 <= value <= 1439"
      - name: delivery_window_end_minute
        type: integer
        source: input
        description: Exclusive end of the permitted local delivery window, minutes since local midnight
        constraints: "0 <= value <= 1440; when end <= start the window wraps past local midnight"
      - name: unit_scale_factor
        type: number
        source: input
        description: Jurisdiction-specific multiplier converting product restricted units into local regulatory units
        constraints: "0.01 <= value <= 5.00, 2 decimal places"
      - name: max_units_per_order
        type: number
        source: input
        description: Ceiling on a single order's restricted-unit exposure for this restriction class
        constraints: "> 0, 2 decimal places"
      - name: rolling_window_days
        type: integer
        source: input
        description: Length in days of the per-recipient rolling quantity window
        constraints: "1 <= value <= 365"
      - name: max_units_per_window
        type: number
        source: input
        description: Ceiling on restricted units delivered to one customer inside rolling_window_days
        constraints: "> 0, 2 decimal places"
      - name: acceptable_document_types
        type: array
        source: input
        description: "Identification document types a courier may accept at the door; MAY be the empty array, in which case no document is acceptable"
        constraints: "subset of {DRIVERS_LICENSE, PASSPORT, STATE_ID, MILITARY_ID, TRIBAL_ID}"
      - name: requires_scan
        type: boolean
        source: input
        description: Whether the document must be machine-scanned (barcode/MRZ) rather than visually inspected
      - name: effective_from
        type: string
        source: input
        description: "Inclusive first calendar date (YYYY-MM-DD) on which this policy governs"
      - name: effective_to
        type: string
        source: input
        description: "Inclusive last calendar date (YYYY-MM-DD) on which this policy governs"
        constraints: "effective_to >= effective_from"

  - name: Product
    parent: null
    common_fields: true
    fields:
      - name: sku
        type: string
        source: input
        description: Catalog identifier
        constraints: "unique across all Product rows"
      - name: name
        type: string
        source: input
        description: Product display name
      - name: restriction_type
        type: enum
        source: input
        description: Restriction class used to select the governing RestrictionPolicy
        constraints: "one of {NONE, ALCOHOL, TOBACCO_VAPE, CANNABIS, PHARMACY_OTC_RESTRICTED, AEROSOL_SOLVENT}"
      - name: restricted_units_per_item
        type: number
        source: input
        description: Regulatory units contributed by one unit of this product before jurisdiction scaling
        constraints: ">= 0, up to 2 decimal places; MUST be 0 when restriction_type == NONE"
      - name: list_price_cents
        type: integer
        source: input
        description: Unit price in cents copied onto each OrderLine at line creation
        constraints: "> 0"

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Customer legal name
      - name: email
        type: string
        source: input
        description: Contact email
        constraints: "unique across all Customer rows"
      - name: jurisdiction_id
        type: string
        source: input
        description: "FK -> Jurisdiction.id; the customer's home/billing jurisdiction"
      - name: attested_dob
        type: string
        source: input
        description: "Self-attested date of birth (YYYY-MM-DD), written by the age-attestation endpoint; null until attested"
        default: null
      - name: attestation_at
        type: datetime
        source: system
        description: Logical-clock instant at which the attestation was recorded
        default: null
      - name: attestation_channel
        type: enum
        source: input
        description: How the attestation was collected
        constraints: "one of {WEB_CHECKBOX, MOBILE_APP, PHONE_AGENT}"
        default: null
      - name: attestation_state
        type: enum
        source: computed
        description: "ATTESTED when the attested age at attestation_at is >= GLOBAL_MIN_ATTESTATION_AGE_YEARS; ATTESTATION_REJECTED when below it; NOT_ATTESTED before any attestation"
        constraints: "one of {NOT_ATTESTED, ATTESTED, ATTESTATION_REJECTED}"
        default: NOT_ATTESTED
      - name: latest_identity_check_result
        type: enum
        source: computed
        description: "result of the IdentityCheck row for this customer with status == VALID and the greatest created_at; NONE when no such row exists"
        constraints: "one of {NONE, MATCH, PARTIAL, NO_MATCH}"
        default: NONE
      - name: refusal_strikes
        type: integer
        source: computed
        description: "Count of DeliveryAttempt rows in state REFUSED whose refusal_reason is in {UNDERAGE_RECIPIENT, INTOXICATED_RECIPIENT, ID_MISMATCH, NO_ACCEPTABLE_ID} across all this customer's orders"
        default: 0
      - name: blocked_until
        type: datetime
        source: computed
        description: "Set to (the strike-triggering attempt's started_at + CUSTOMER_BLOCK_DAYS days) when refusal_strikes reaches CUSTOMER_BLOCK_STRIKE_THRESHOLD; null otherwise"
        default: null

  - name: IdentityCheck
    parent: Customer
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the customer being pre-verified"
      - name: provider
        type: enum
        source: input
        description: Identity data source consulted
        constraints: "one of {STATE_DMV_GATEWAY, NATIONAL_ID_VENDOR, TELCO_VERIFY}"
      - name: provided_dob
        type: string
        source: input
        description: "Date of birth (YYYY-MM-DD) submitted to the provider"
      - name: source_dob
        type: string
        source: input
        description: "Date of birth (YYYY-MM-DD) returned by the provider's authoritative record; may disagree with provided_dob"
      - name: source_signals
        type: array
        source: input
        description: "Array of objects { source_type, matched } with source_type in {GOVERNMENT_ID_DB, CREDIT_BUREAU, MOBILE_CARRIER, WATCHLIST_NEGATIVE} and matched boolean; each source_type may appear at most once"
      - name: confidence
        type: number
        source: computed
        description: Weighted match confidence produced by calculations.identity_prevalidation_confidence
        constraints: "0.0000 <= value <= 1.0000, 4 decimal places"
      - name: result
        type: enum
        source: computed
        description: Banded interpretation of confidence
        constraints: "one of {MATCH, PARTIAL, NO_MATCH}"
      - name: verified_dob
        type: string
        source: computed
        description: "source_dob when result == MATCH; provided_dob when result == PARTIAL; null when result == NO_MATCH"
      - name: status
        type: enum
        source: computed
        description: "VALID on creation; EXPIRED once the logical clock reaches expires_at; SUPERSEDED when a newer IdentityCheck is created for the same customer_id"
        constraints: "one of {VALID, EXPIRED, SUPERSEDED}"
        default: VALID
      - name: validity_days
        type: integer
        source: input
        description: Days for which this pre-verification remains usable
        constraints: "1 <= value <= 365"
      - name: expires_at
        type: datetime
        source: computed
        description: "created_at + validity_days days"

  - name: Order
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the purchaser and intended recipient of record"
      - name: delivery_jurisdiction_id
        type: string
        source: input
        description: "FK -> Jurisdiction.id; the jurisdiction of the delivery address, which governs permissibility (may differ from the customer's home jurisdiction)"
      - name: delivery_partner_id
        type: string
        source: input
        description: "FK -> DeliveryPartner.id; the last-mile partner contracted for this order"
      - name: scheduled_delivery_at
        type: datetime
        source: input
        description: Promised delivery instant in UTC, used for order-time restricted-hours evaluation
      - name: delivery_fee_cents
        type: integer
        source: input
        description: Delivery fee charged to the customer
        constraints: ">= 0"
      - name: item_subtotal_cents
        type: integer
        source: computed
        description: "Sum of OrderLine.line_total_cents over all lines of this order regardless of line_state"
        default: 0
      - name: charged_cents
        type: integer
        source: computed
        description: "item_subtotal_cents + delivery_fee_cents, frozen at submit"
        default: 0
      - name: provisional_restricted_units
        type: number
        source: computed
        description: Output of calculations.order_restricted_unit_exposure variant PROVISIONAL_AT_SUBMIT
        default: 0.00
      - name: final_restricted_units
        type: number
        source: computed
        description: "Output of calculations.order_restricted_unit_exposure variant FINAL_AT_HANDOVER; null until a handover occurs"
        default: null
      - name: restocking_fee_cents
        type: integer
        source: computed
        description: Retained restocking fee produced by calculations.refusal_return_settlement
        default: 0
      - name: refunded_cents
        type: integer
        source: computed
        description: Amount returned to the customer by calculations.refusal_return_settlement
        default: 0
      - name: retained_cents
        type: integer
        source: computed
        description: "charged_cents - refunded_cents; the conserved-money residual"
        default: 0
      - name: compliance_state
        type: enum
        source: computed
        description: Compliance dimension of the order lifecycle
        constraints: "one of {DRAFT_UNVERIFIED, AUTO_CLEARED, PREVERIFIED, PENDING_COMPLIANCE_REVIEW, COMPLIANCE_CLEARED, COMPLIANCE_BLOCKED}"
        default: DRAFT_UNVERIFIED
      - name: fulfillment_state
        type: enum
        source: computed
        description: Physical-fulfilment dimension of the order lifecycle, advancing independently of compliance_state
        constraints: "one of {CREATED, SUBMITTED, DISPATCHED, HELD_AT_HUB, OUT_FOR_DELIVERY, DELIVERED, RETURN_IN_TRANSIT, RETURN_COMPLETED}"
        default: CREATED
      - name: restriction_types
        type: array
        source: computed
        description: "Distinct Product.restriction_type values other than NONE across this order's lines with line_state == INCLUDED, sorted ascending as strings"
        default: []
      - name: applied_policy_ids
        type: array
        source: computed
        description: "RestrictionPolicy ids selected at submit, one per element of restriction_types, ordered to match restriction_types"
        default: []
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock instant of a successful submit
        default: null
      - name: dispatched_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent dispatch
        default: null
      - name: delivered_at
        type: datetime
        source: system
        description: DeliveryAttempt.started_at of the attempt that handed the order over
        default: null
      - name: hold_reason
        type: string
        source: system
        description: Populated when a partner-posture cascade forces the order into HELD_AT_HUB
        default: null
      - name: clearance_actor_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer who last decided a manual clearance; opaque operator id, never compared to an entity id"
        default: null

  - name: OrderLine
    parent: Order
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; the order this line belongs to"
      - name: product_id
        type: string
        source: input
        description: "FK -> Product.id; the catalog product ordered"
      - name: quantity
        type: integer
        source: input
        description: Number of units ordered on this line
        constraints: "1 <= value <= 500"
      - name: unit_price_cents
        type: integer
        source: computed
        description: "Product.list_price_cents snapshotted at line creation"
      - name: units_per_item_snapshot
        type: number
        source: computed
        description: "Product.restricted_units_per_item snapshotted at line creation; the PROVISIONAL_AT_SUBMIT variant reads this snapshot"
      - name: line_total_cents
        type: integer
        source: computed
        description: "quantity * unit_price_cents"
      - name: line_restricted_units
        type: number
        source: computed
        description: "Per-line rounded restricted units from the most recent evaluation of calculations.order_restricted_unit_exposure; 0.00 before submit"
        default: 0.00
      - name: line_state
        type: enum
        source: computed
        description: "INCLUDED on creation; WITHDRAWN once a return settlement completes for the order"
        constraints: "one of {INCLUDED, WITHDRAWN}"
        default: INCLUDED

  - name: DeliveryPartner
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Partner legal entity name
      - name: contract_tier
        type: enum
        source: input
        description: Commercial tier that sets the license-risk multiplier
        constraints: "one of {STANDARD, PREFERRED, PROBATIONARY}"
      - name: license_reference
        type: string
        source: input
        description: Delivery licence reference held by the partner
        constraints: "unique across all DeliveryPartner rows"
      - name: license_risk_score
        type: number
        source: computed
        description: Output of calculations.partner_license_risk_score variant ROLLING_90D
        default: 0.00
      - name: lifetime_risk_score
        type: number
        source: computed
        description: Output of calculations.partner_license_risk_score variant LIFETIME_WEIGHTED
        default: 0.00
      - name: open_case_count
        type: integer
        source: computed
        description: "Count of ViolationCase rows for this partner with state IN {OPEN, UNDER_INVESTIGATION, PENDING_PARTNER_RESPONSE}"
        default: 0
      - name: open_critical_case_count
        type: integer
        source: computed
        description: "Count of ViolationCase rows for this partner with state IN {OPEN, UNDER_INVESTIGATION, PENDING_PARTNER_RESPONSE} and severity == CRITICAL"
        default: 0
      - name: posture
        type: enum
        source: computed
        description: Derived gate on all child operations, recomputed by calculations.partner_posture_derivation
        constraints: "one of {OPEN, RESTRICTED, SUSPENDED}"
        default: OPEN

  - name: Courier
    parent: DeliveryPartner
    common_fields: true
    fields:
      - name: delivery_partner_id
        type: string
        source: input
        description: "FK -> DeliveryPartner.id; the partner that employs this courier"
      - name: full_name
        type: string
        source: input
        description: Courier legal name
      - name: hired_at
        type: string
        source: input
        description: "Hire date (YYYY-MM-DD)"
      - name: compliance_score
        type: number
        source: computed
        description: Output of calculations.courier_compliance_score
        default: 100.00
      - name: compliant_handover_count
        type: integer
        source: computed
        description: "Count of DeliveryAttempt rows for this courier in state HANDED_OVER whose id_check_compliant flag is true"
        default: 0
      - name: certification_state
        type: enum
        source: computed
        description: "Courier-level gate derived from certification rows and compliance_score"
        constraints: "one of {UNCERTIFIED, CERTIFIED, SUSPENDED}"
        default: UNCERTIFIED
      - name: dispatch_eligible
        type: boolean
        source: computed
        description: "true iff certification_state == CERTIFIED and the employing partner's posture != SUSPENDED"
        default: false

  - name: CourierCertification
    parent: Courier
    common_fields: true
    fields:
      - name: courier_id
        type: string
        source: input
        description: "FK -> Courier.id; the certified courier"
      - name: restriction_type
        type: enum
        source: input
        description: Restriction class this certification authorises the courier to deliver
        constraints: "one of {ALCOHOL, TOBACCO_VAPE, CANNABIS, PHARMACY_OTC_RESTRICTED, AEROSOL_SOLVENT}"
      - name: training_score
        type: integer
        source: input
        description: Score achieved on the restriction-specific training assessment
        constraints: "0 <= value <= 100"
      - name: training_completed_at
        type: string
        source: input
        description: "Date (YYYY-MM-DD) the training assessment was completed"
      - name: valid_days
        type: integer
        source: input
        description: Certification validity length in days
        constraints: "30 <= value <= 1095"
      - name: issued_at
        type: datetime
        source: system
        description: Logical-clock instant of issuance or most recent renewal
      - name: expires_at
        type: datetime
        source: computed
        description: "issued_at + valid_days days"
      - name: renewal_count
        type: integer
        source: computed
        description: Number of times this certification row has been renewed
        default: 0
      - name: state
        type: enum
        source: computed
        description: Certification lifecycle state
        constraints: "one of {ACTIVE, EXPIRED, SUSPENDED, REVOKED}"
        default: ACTIVE
      - name: revocation_reason
        type: string
        source: input
        description: Reason recorded when a ComplianceOfficer revokes the certification
        default: null

  - name: DeliveryAttempt
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; the order being delivered"
      - name: courier_id
        type: string
        source: input
        description: "FK -> Courier.id; the courier at the door"
      - name: started_at
        type: datetime
        source: input
        description: Courier-device instant the attempt began; the delivery-time evaluation instant for hours, certification and age rules
      - name: state
        type: enum
        source: computed
        description: Attempt lifecycle state
        constraints: "one of {INITIATED, ID_VERIFIED, ID_REJECTED, HANDED_OVER, REFUSED, ABORTED}"
        default: INITIATED
      - name: document_type
        type: enum
        source: input
        description: Identification document presented at the door
        constraints: "one of {DRIVERS_LICENSE, PASSPORT, STATE_ID, MILITARY_ID, TRIBAL_ID}"
        default: null
      - name: document_expires_on
        type: string
        source: input
        description: "Expiry date (YYYY-MM-DD) printed on the presented document"
        default: null
      - name: scan_performed
        type: boolean
        source: input
        description: Whether the document was machine-scanned rather than visually inspected
        default: null
      - name: scanned_dob
        type: string
        source: input
        description: "Date of birth (YYYY-MM-DD) read from the document"
        default: null
      - name: recipient_name
        type: string
        source: input
        description: Name of the person who took delivery or presented identification
        default: null
      - name: recipient_age_years
        type: integer
        source: computed
        description: "Completed years between scanned_dob and started_at, by calendar comparison"
        default: null
      - name: id_check_compliant
        type: boolean
        source: computed
        description: "true iff the attempt reached ID_VERIFIED with an acceptable document type and, when the policy demands it, a performed scan"
        default: false
      - name: refusal_reason
        type: enum
        source: input
        description: Reason the courier refused the handover
        constraints: "one of {UNDERAGE_RECIPIENT, INTOXICATED_RECIPIENT, NO_ACCEPTABLE_ID, ID_MISMATCH, RECIPIENT_ABSENT, COURIER_FAULT}"
        default: null
      - name: observed_indicators
        type: array
        source: input
        description: Free-text observations supporting an intoxication or impairment refusal
        default: []
      - name: abort_reason
        type: string
        source: system
        description: Populated when a certification-suspension cascade aborts the attempt
        default: null

  - name: CaptureArtifact
    parent: DeliveryAttempt
    common_fields: false
    fields:
      - name: delivery_attempt_id
        type: string
        source: input
        description: "FK -> DeliveryAttempt.id; the attempt this artifact evidences"
      - name: kind
        type: enum
        source: input
        description: Kind of retained evidence
        constraints: "one of {SIGNATURE, PHOTO_ID, PHOTO_HANDOFF}"
      - name: content_hash
        type: string
        source: input
        description: SHA-256 hex digest of the stored artifact bytes
        constraints: "64 lowercase hex characters; unique across all CaptureArtifact rows"
      - name: captured_at
        type: datetime
        source: input
        description: Instant the artifact was captured on the courier device
      - name: retention_until
        type: datetime
        source: computed
        description: "captured_at + CAPTURE_RETENTION_DAYS days; the regulatory audit retention horizon"

  - name: SecretShopperTest
    parent: null
    common_fields: true
    fields:
      - name: courier_id
        type: string
        source: input
        description: "FK -> Courier.id; the courier under test"
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; the decoy order used to stage the test"
      - name: scenario_type
        type: enum
        source: input
        description: Compliance scenario staged at the door
        constraints: "one of {UNDERAGE_PRESENTER, NO_ID_PRESENTED, EXPIRED_DOCUMENT, INTOXICATION_CUES}"
      - name: scheduled_at
        type: datetime
        source: input
        description: Planned execution instant of the test
      - name: expected_outcome
        type: enum
        source: input
        description: Compliant behaviour the auditor expects from the courier
        constraints: "one of {REFUSAL, HANDOVER}"
      - name: observed_outcome
        type: enum
        source: input
        description: Behaviour actually observed at the door
        constraints: "one of {REFUSAL, HANDOVER}"
        default: null
      - name: findings
        type: string
        source: input
        description: Auditor narrative recorded with the outcome
        default: null
      - name: verdict
        type: enum
        source: computed
        description: "PASS when observed_outcome == expected_outcome; FAIL otherwise; PENDING before an outcome is recorded"
        constraints: "one of {PENDING, PASS, FAIL}"
        default: PENDING
      - name: recorded_at
        type: datetime
        source: system
        description: Logical-clock instant the outcome was recorded
        default: null

  - name: ViolationCase
    parent: null
    common_fields: true
    fields:
      - name: delivery_partner_id
        type: string
        source: input
        description: "FK -> DeliveryPartner.id; the partner accountable for the alleged violation"
      - name: delivery_attempt_id
        type: string
        source: input
        description: "FK -> DeliveryAttempt.id; null when the case originates from a secret shopper test"
        default: null
      - name: secret_shopper_test_id
        type: string
        source: input
        description: "FK -> SecretShopperTest.id; null when the case originates from a delivery attempt"
        default: null
      - name: severity
        type: enum
        source: input
        description: Severity asserted when the case was opened
        constraints: "one of {MINOR, MAJOR, CRITICAL}"
      - name: assessed_severity
        type: enum
        source: input
        description: "Severity confirmed at decision time; drives risk scoring. Null until a SUBSTANTIATED decision is recorded"
        constraints: "one of {MINOR, MAJOR, CRITICAL}"
        default: null
      - name: summary
        type: string
        source: input
        description: Narrative of the alleged violation
      - name: state
        type: enum
        source: computed
        description: Investigation state
        constraints: "one of {OPEN, UNDER_INVESTIGATION, PENDING_PARTNER_RESPONSE, SUBSTANTIATED, DISMISSED, CLOSED_VERIFIED}"
        default: OPEN
      - name: investigation_rounds
        type: integer
        source: computed
        description: Number of times the case has entered UNDER_INVESTIGATION
        default: 0
      - name: decided_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent SUBSTANTIATED or DISMISSED decision; the age anchor for risk decay"
        default: null
      - name: substantiated_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer who recorded the SUBSTANTIATED decision; opaque operator id, used only for the segregation-of-duties comparison"
        default: null
      - name: risk_contribution
        type: number
        source: computed
        description: "This case's rounded ROLLING_90D contribution to its partner's license_risk_score; 0.00 whenever state != SUBSTANTIATED"
        default: 0.00
      - name: response_due_at
        type: datetime
        source: input
        description: "Deadline by which the accountable partner must answer; written when the case moves to PENDING_PARTNER_RESPONSE"
        default: null
      - name: partner_response_text
        type: string
        source: input
        description: Narrative supplied by the partner when answering the case
        default: null
      - name: notes
        type: string
        source: input
        description: "Free-text note recorded by the most recent response request, decision or reopen"
        default: null
      - name: origin
        type: enum
        source: computed
        description: "AUTO_REFUSAL when the case was opened by a refusal cascade, AUTO_SHOPPER_FAIL when opened by a failed secret shopper test, MANUAL when opened by a ComplianceOfficer"
        constraints: "one of {AUTO_REFUSAL, AUTO_SHOPPER_FAIL, MANUAL}"

  - name: CorrectiveActionPlan
    parent: ViolationCase
    common_fields: true
    fields:
      - name: violation_case_id
        type: string
        source: input
        description: "FK -> ViolationCase.id; the substantiated case this plan remediates"
      - name: remediation_items
        type: array
        source: input
        description: Array of remediation commitment strings
        constraints: "1 <= length <= 12"
      - name: due_at
        type: datetime
        source: input
        description: Committed completion instant for all remediation items
      - name: state
        type: enum
        source: computed
        description: Plan review lifecycle state
        constraints: "one of {SUBMITTED, ACCEPTED, REVISION_REQUESTED, VERIFIED, FAILED_VERIFICATION, SUPERSEDED}"
        default: SUBMITTED
      - name: revision_round
        type: integer
        source: computed
        description: "Number of resubmissions of this plan row; guarded by MAX_REVISION_ROUNDS"
        default: 0
      - name: reviewed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer who last reviewed this plan; opaque operator id"
        default: null
      - name: verified_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer who recorded the verification outcome; opaque operator id"
        default: null
      - name: verification_outcome
        type: enum
        source: input
        description: Outcome recorded by the verification step
        constraints: "one of {PASSED, FAILED}"
        default: null
      - name: notes
        type: string
        source: input
        description: Reviewer or verifier notes
        default: null

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------

state_machines:
  # -- Order, dimension 1 of 2: compliance -----------------------------------
  - entity: Order.compliance_state
    initial_state: DRAFT_UNVERIFIED
    terminal_states: [COMPLIANCE_BLOCKED]
    note: |
      Dimension 1 of Order's two parallel state dimensions. It advances only on submit,
      manual clearance, and the partner-posture cascade. It never advances on dispatch,
      attempt creation, handover, refusal or return settlement — those move
      Order.fulfillment_state only. The two dimensions are independent: an order may sit
      in (PREVERIFIED, RETURN_IN_TRANSIT) or in (COMPLIANCE_BLOCKED, SUBMITTED).
    transitions:
      - from: DRAFT_UNVERIFIED
        to: AUTO_CLEARED
        trigger: "POST /orders/{id}/submit"
        actor: Customer
        preconditions:
          - "Order.fulfillment_state == CREATED"
          - "Order has at least one OrderLine"
          - "every line's Product.restriction_type == NONE, so restriction_types == []"
        side_effects:
          - "sets Order.item_subtotal_cents = sum of OrderLine.line_total_cents over all lines"
          - "sets Order.charged_cents = item_subtotal_cents + delivery_fee_cents"
          - "sets Order.provisional_restricted_units = 0.00 and Order.applied_policy_ids = []"
          - "advances Order.fulfillment_state CREATED -> SUBMITTED and stamps Order.submitted_at"
        note: "Zero-restricted-line orders bypass attestation, pre-verification, hours, quota and door-side ID rules entirely."
      - from: DRAFT_UNVERIFIED
        to: PREVERIFIED
        trigger: "POST /orders/{id}/submit"
        actor: Customer
        preconditions:
          - "Order.fulfillment_state == CREATED"
          - "restriction_types is non-empty"
          - "Customer.attestation_state == ATTESTED"
          - "for every element of restriction_types a RestrictionPolicy exists for (Order.delivery_jurisdiction_id, restriction_type) whose [effective_from, effective_to] closed date interval contains the local date of Order.scheduled_delivery_at"
          - "Customer.blocked_until is null or Customer.blocked_until <= logical clock now"
          - "no selected policy has permissibility == PROHIBITED, and the dry/permit rules of validations[priority=50] pass"
          - "the IdentityCheck row for Customer with status == VALID and greatest created_at exists and has result == MATCH"
          - "the completed age of that IdentityCheck.verified_dob at the local date of Order.scheduled_delivery_at is >= max(min_age_years) over the selected policies"
          - "the local delivery minute of Order.scheduled_delivery_at is inside every selected policy's half-open window"
          - "calculations.order_restricted_unit_exposure PROVISIONAL_AT_SUBMIT per restriction type <= that policy's max_units_per_order"
          - "provisional exposure + calculations.customer_window_units_consumed <= that policy's max_units_per_window"
        side_effects:
          - "sets Order.item_subtotal_cents, Order.charged_cents, Order.restriction_types and Order.applied_policy_ids"
          - "runs calculations.order_restricted_unit_exposure variant PROVISIONAL_AT_SUBMIT, writing Order.provisional_restricted_units and each OrderLine.line_restricted_units"
          - "advances Order.fulfillment_state CREATED -> SUBMITTED and stamps Order.submitted_at"
      - from: DRAFT_UNVERIFIED
        to: PENDING_COMPLIANCE_REVIEW
        trigger: "POST /orders/{id}/submit"
        actor: Customer
        preconditions:
          - "every precondition of the DRAFT_UNVERIFIED -> PREVERIFIED transition holds except that the newest VALID IdentityCheck has result == PARTIAL"
        side_effects:
          - "same exposure, subtotal and applied-policy side effects as the PREVERIFIED branch"
          - "advances Order.fulfillment_state CREATED -> SUBMITTED and stamps Order.submitted_at"
        note: "PARTIAL pre-verification routes the order to a human ComplianceOfficer instead of blocking it."
      - from: DRAFT_UNVERIFIED
        to: COMPLIANCE_BLOCKED
        trigger: "POST /orders/{id}/submit"
        actor: Customer
        preconditions:
          - "every precondition of the DRAFT_UNVERIFIED -> PREVERIFIED transition holds except that the newest VALID IdentityCheck has result == NO_MATCH"
        side_effects:
          - "same exposure, subtotal and applied-policy side effects as the PREVERIFIED branch"
          - "advances Order.fulfillment_state CREATED -> SUBMITTED and stamps Order.submitted_at"
          - "the order is permanently undeliverable: POST /orders/{id}/dispatch is rejected with ERR_INVALID_ORDER_STATE from this state"
      - from: PENDING_COMPLIANCE_REVIEW
        to: COMPLIANCE_CLEARED
        trigger: "POST /orders/{id}/clearance with decision == CLEAR"
        actor: ComplianceOfficer
        preconditions:
          - "Order.compliance_state == PENDING_COMPLIANCE_REVIEW"
          - "the DeliveryPartner named by Order.delivery_partner_id has posture != SUSPENDED"
        side_effects:
          - "stores X-User-ID in Order.clearance_actor_user_id"
          - "clears Order.hold_reason"
      - from: PENDING_COMPLIANCE_REVIEW
        to: COMPLIANCE_BLOCKED
        trigger: "POST /orders/{id}/clearance with decision == BLOCK"
        actor: ComplianceOfficer
        preconditions:
          - "Order.compliance_state == PENDING_COMPLIANCE_REVIEW"
        side_effects:
          - "stores X-User-ID in Order.clearance_actor_user_id"
          - "when Order.fulfillment_state == DISPATCHED or HELD_AT_HUB it is forced back to SUBMITTED and Order.dispatched_at is cleared"
      - from: PREVERIFIED
        to: PENDING_COMPLIANCE_REVIEW
        trigger: "system: DeliveryPartner.posture transitions OPEN -> RESTRICTED or RESTRICTED -> SUSPENDED (cascade link 4)"
        actor: system
        preconditions:
          - "Order.delivery_partner_id names the reposturing partner"
          - "Order.fulfillment_state == DISPATCHED"
        side_effects:
          - "sets Order.hold_reason = 'PARTNER_POSTURE_' plus the partner's new posture"
          - "advances Order.fulfillment_state DISPATCHED -> HELD_AT_HUB and clears Order.dispatched_at"
        note: "Revert edge. Orders already OUT_FOR_DELIVERY are not recalled by a posture change; only DISPATCHED ones are held."
      - from: COMPLIANCE_CLEARED
        to: PENDING_COMPLIANCE_REVIEW
        trigger: "system: DeliveryPartner.posture transitions OPEN -> RESTRICTED or RESTRICTED -> SUSPENDED (cascade link 4)"
        actor: system
        preconditions:
          - "Order.delivery_partner_id names the reposturing partner"
          - "Order.fulfillment_state == DISPATCHED"
        side_effects:
          - "sets Order.hold_reason = 'PARTNER_POSTURE_' plus the partner's new posture"
          - "advances Order.fulfillment_state DISPATCHED -> HELD_AT_HUB and clears Order.dispatched_at"

  # -- Order, dimension 2 of 2: fulfillment -----------------------------------
  - entity: Order.fulfillment_state
    initial_state: CREATED
    terminal_states: [DELIVERED, RETURN_COMPLETED]
    note: |
      Dimension 2 of Order's two parallel state dimensions. Contains the cycle
      DISPATCHED -> HELD_AT_HUB -> DISPATCHED, so an order can be held and re-dispatched
      any number of times without touching Order.compliance_state on the way back.
    transitions:
      - from: CREATED
        to: SUBMITTED
        trigger: "POST /orders/{id}/submit"
        actor: Customer
        preconditions:
          - "Order.fulfillment_state == CREATED"
          - "Order has at least one OrderLine"
        side_effects:
          - "drives the matching Order.compliance_state branch out of DRAFT_UNVERIFIED"
          - "freezes Order.charged_cents"
      - from: SUBMITTED
        to: DISPATCHED
        trigger: "POST /orders/{id}/dispatch"
        actor: PartnerManager
        preconditions:
          - "Order.fulfillment_state == SUBMITTED"
          - "Order.compliance_state IN {AUTO_CLEARED, PREVERIFIED, COMPLIANCE_CLEARED}"
          - "X-User-ID == Order.delivery_partner_id"
          - "the DeliveryPartner has posture != SUSPENDED"
        side_effects:
          - "stamps Order.dispatched_at with the logical clock"
          - "clears Order.hold_reason"
      - from: HELD_AT_HUB
        to: DISPATCHED
        trigger: "POST /orders/{id}/dispatch"
        actor: PartnerManager
        preconditions:
          - "Order.fulfillment_state == HELD_AT_HUB"
          - "Order.compliance_state IN {AUTO_CLEARED, PREVERIFIED, COMPLIANCE_CLEARED}"
          - "X-User-ID == Order.delivery_partner_id"
          - "the DeliveryPartner has posture != SUSPENDED"
        side_effects:
          - "stamps Order.dispatched_at with the logical clock"
          - "clears Order.hold_reason"
        note: "Cycle edge. A held order that was pushed to PENDING_COMPLIANCE_REVIEW must first be cleared by a ComplianceOfficer."
      - from: DISPATCHED
        to: HELD_AT_HUB
        trigger: "system: DeliveryPartner.posture worsens (cascade link 4)"
        actor: system
        preconditions:
          - "Order.delivery_partner_id names the reposturing partner"
          - "Order.fulfillment_state == DISPATCHED"
        side_effects:
          - "sets Order.hold_reason and clears Order.dispatched_at"
          - "drives Order.compliance_state PREVERIFIED|COMPLIANCE_CLEARED -> PENDING_COMPLIANCE_REVIEW"
      - from: DISPATCHED
        to: OUT_FOR_DELIVERY
        trigger: "POST /delivery-attempts"
        actor: Courier
        preconditions:
          - "Order.fulfillment_state == DISPATCHED"
          - "Order.compliance_state IN {AUTO_CLEARED, PREVERIFIED, COMPLIANCE_CLEARED}"
          - "the Courier's delivery_partner_id == Order.delivery_partner_id"
          - "the Courier has certification_state == CERTIFIED"
        side_effects:
          - "creates a DeliveryAttempt row in state INITIATED"
      - from: OUT_FOR_DELIVERY
        to: DELIVERED
        trigger: "POST /delivery-attempts/{id}/handover"
        actor: Courier
        preconditions:
          - "the attempt is in state ID_VERIFIED, or the order's restriction_types == [] and the attempt is in state INITIATED"
        side_effects:
          - "runs calculations.order_restricted_unit_exposure variant FINAL_AT_HANDOVER, writing Order.final_restricted_units"
          - "stamps Order.delivered_at = DeliveryAttempt.started_at"
          - "increments Courier.compliant_handover_count and recomputes Courier.compliance_score"
      - from: OUT_FOR_DELIVERY
        to: RETURN_IN_TRANSIT
        trigger: "POST /delivery-attempts/{id}/refuse"
        actor: Courier
        preconditions:
          - "the attempt is in state INITIATED, ID_VERIFIED or ID_REJECTED"
        side_effects:
          - "cascade link 1: attempt -> REFUSED; see the DeliveryAttempt machine for links 2-4"
      - from: OUT_FOR_DELIVERY
        to: RETURN_IN_TRANSIT
        trigger: "system: a certification-suspension cascade aborts the open attempt (cascade link 3)"
        actor: system
        preconditions:
          - "a DeliveryAttempt for this order held by the affected courier is in state INITIATED, ID_VERIFIED or ID_REJECTED"
        side_effects:
          - "the attempt moves to ABORTED with abort_reason = 'CERTIFICATION_SUSPENDED'"
          - "sets Order.hold_reason = 'COURIER_CERTIFICATION_SUSPENDED'"
      - from: RETURN_IN_TRANSIT
        to: RETURN_COMPLETED
        trigger: "POST /orders/{id}/return-settlement"
        actor: PlatformAdmin
        preconditions:
          - "Order.fulfillment_state == RETURN_IN_TRANSIT"
          - "restock_confirmed == true"
        side_effects:
          - "runs calculations.refusal_return_settlement, writing Order.restocking_fee_cents, Order.refunded_cents and Order.retained_cents"
          - "sets every OrderLine.line_state INCLUDED -> WITHDRAWN"
          - "sets Order.final_restricted_units = 0.00 so the order stops consuming the customer's rolling window"

  # -- DeliveryAttempt: branching fork with divergent side-effect sets ---------
  - entity: DeliveryAttempt
    initial_state: INITIATED
    terminal_states: [HANDED_OVER, REFUSED, ABORTED]
    note: |
      Fork at INITIATED into three branches ({ID_VERIFIED, ID_REJECTED, REFUSED}) whose
      side-effect sets differ: the ID_VERIFIED branch credits the courier, the ID_REJECTED
      branch is inert, and the REFUSED branch launches the four-link violation cascade.
    transitions:
      - from: INITIATED
        to: ID_VERIFIED
        trigger: "POST /delivery-attempts/{id}/id-check"
        actor: Courier
        preconditions:
          - "DeliveryAttempt.state == INITIATED"
          - "X-User-ID == DeliveryAttempt.courier_id"
          - "for every element of Order.restriction_types the courier holds a CourierCertification with that restriction_type in state ACTIVE at DeliveryAttempt.started_at"
          - "document_type is a member of every selected policy's acceptable_document_types"
          - "scan_performed == true whenever any selected policy has requires_scan == true"
          - "document_expires_on >= the local date of DeliveryAttempt.started_at"
          - "scanned_dob equals Customer.attested_dob"
          - "recipient_age_years >= max(min_age_years) over the selected policies"
        side_effects:
          - "writes document_type, document_expires_on, scan_performed, scanned_dob, recipient_name"
          - "computes recipient_age_years from scanned_dob and started_at"
          - "sets id_check_compliant = true"
      - from: INITIATED
        to: ID_REJECTED
        trigger: "POST /delivery-attempts/{id}/id-check"
        actor: Courier
        preconditions:
          - "every precondition of the INITIATED -> ID_VERIFIED transition holds except that recipient_age_years < max(min_age_years) over the selected policies"
        side_effects:
          - "writes the same document fields and recipient_age_years"
          - "sets id_check_compliant = false"
          - "no violation case is opened at this point: an ID_REJECTED attempt is a compliant courier reading the document correctly"
        note: "Divergent branch. The order stays OUT_FOR_DELIVERY until the courier records the refusal."
      - from: ID_VERIFIED
        to: HANDED_OVER
        trigger: "POST /delivery-attempts/{id}/handover"
        actor: Courier
        preconditions:
          - "DeliveryAttempt.state == ID_VERIFIED"
          - "X-User-ID == DeliveryAttempt.courier_id"
          - "CaptureArtifact rows exist for this attempt with kind SIGNATURE and with kind PHOTO_HANDOFF"
          - "a CaptureArtifact with kind PHOTO_ID exists whenever any selected policy has requires_scan == true"
        side_effects:
          - "advances Order.fulfillment_state OUT_FOR_DELIVERY -> DELIVERED and stamps Order.delivered_at"
          - "runs calculations.order_restricted_unit_exposure variant FINAL_AT_HANDOVER"
          - "increments Courier.compliant_handover_count, then recomputes Courier.compliance_score"
      - from: INITIATED
        to: HANDED_OVER
        trigger: "POST /delivery-attempts/{id}/handover"
        actor: Courier
        preconditions:
          - "DeliveryAttempt.state == INITIATED"
          - "Order.restriction_types == [] (nothing on the order is age-restricted)"
          - "CaptureArtifact rows exist for this attempt with kind SIGNATURE and with kind PHOTO_HANDOFF"
        side_effects:
          - "advances Order.fulfillment_state OUT_FOR_DELIVERY -> DELIVERED"
          - "sets Order.final_restricted_units = 0.00"
          - "leaves id_check_compliant false, so Courier.compliant_handover_count does NOT increase"
        note: "Empty-restriction-set edge: no door-side ID check is demanded, and no compliance credit is earned."
      - from: INITIATED
        to: REFUSED
        trigger: "POST /delivery-attempts/{id}/refuse"
        actor: Courier
        preconditions:
          - "DeliveryAttempt.state == INITIATED"
          - "X-User-ID == DeliveryAttempt.courier_id"
          - "refusal_reason IN {NO_ACCEPTABLE_ID, INTOXICATED_RECIPIENT, RECIPIENT_ABSENT, COURIER_FAULT}"
        side_effects:
          - "cascade link 1: advances Order.fulfillment_state OUT_FOR_DELIVERY -> RETURN_IN_TRANSIT"
          - "cascade link 2 (fires only because link 1 recorded a compliance refusal): when refusal_reason IN {UNDERAGE_RECIPIENT, ID_MISMATCH, NO_ACCEPTABLE_ID, INTOXICATED_RECIPIENT} the system opens a ViolationCase with origin AUTO_REFUSAL, delivery_attempt_id = this attempt, delivery_partner_id = Order.delivery_partner_id, state OPEN and severity from constants REFUSAL_SEVERITY_MAP"
          - "cascade link 3 (fires only because link 2 created a case): DeliveryPartner.open_case_count and open_critical_case_count are recomputed, then calculations.partner_posture_derivation runs and may move DeliveryPartner.posture"
          - "cascade link 4 (fires only because link 3 changed posture): every Order of that partner in fulfillment_state DISPATCHED moves to HELD_AT_HUB and its compliance_state PREVERIFIED|COMPLIANCE_CLEARED moves to PENDING_COMPLIANCE_REVIEW, processed in Order.created_at ASC order"
          - "recomputes Customer.refusal_strikes and, at the CUSTOMER_BLOCK_STRIKE_THRESHOLD, sets Customer.blocked_until = started_at + CUSTOMER_BLOCK_DAYS days"
      - from: ID_REJECTED
        to: REFUSED
        trigger: "POST /delivery-attempts/{id}/refuse"
        actor: Courier
        preconditions:
          - "DeliveryAttempt.state == ID_REJECTED"
          - "X-User-ID == DeliveryAttempt.courier_id"
          - "refusal_reason IN {UNDERAGE_RECIPIENT, ID_MISMATCH, NO_ACCEPTABLE_ID}"
        side_effects:
          - "identical four-link cascade to the INITIATED -> REFUSED edge"
      - from: ID_VERIFIED
        to: REFUSED
        trigger: "POST /delivery-attempts/{id}/refuse"
        actor: Courier
        preconditions:
          - "DeliveryAttempt.state == ID_VERIFIED"
          - "X-User-ID == DeliveryAttempt.courier_id"
          - "refusal_reason IN {INTOXICATED_RECIPIENT, RECIPIENT_ABSENT, COURIER_FAULT}"
        side_effects:
          - "identical four-link cascade to the INITIATED -> REFUSED edge, except that a COURIER_FAULT or RECIPIENT_ABSENT refusal skips link 2 entirely and therefore links 3 and 4 as well"
        note: "Age was verified but the recipient was visibly impaired; the refusal is still mandatory."
      - from: INITIATED
        to: ABORTED
        trigger: "system: the courier's CourierCertification for a restriction type on this order moves ACTIVE -> SUSPENDED (cascade link 3)"
        actor: system
        preconditions:
          - "DeliveryAttempt.state IN {INITIATED, ID_VERIFIED, ID_REJECTED}"
        side_effects:
          - "sets abort_reason = 'CERTIFICATION_SUSPENDED'"
          - "advances Order.fulfillment_state OUT_FOR_DELIVERY -> RETURN_IN_TRANSIT"
      - from: ID_VERIFIED
        to: ABORTED
        trigger: "system: the courier's CourierCertification moves ACTIVE -> SUSPENDED (cascade link 3)"
        actor: system
        preconditions:
          - "DeliveryAttempt.state IN {INITIATED, ID_VERIFIED, ID_REJECTED}"
        side_effects:
          - "sets abort_reason = 'CERTIFICATION_SUSPENDED'"
          - "advances Order.fulfillment_state OUT_FOR_DELIVERY -> RETURN_IN_TRANSIT"

  # -- ViolationCase: cyclic investigation ------------------------------------
  - entity: ViolationCase
    initial_state: OPEN
    terminal_states: [CLOSED_VERIFIED]
    note: |
      Two distinct cycles: PENDING_PARTNER_RESPONSE -> UNDER_INVESTIGATION (partner answers)
      and SUBSTANTIATED|DISMISSED -> UNDER_INVESTIGATION (reopen). Reopening a substantiated
      case must withdraw its risk contribution, which is the compensating half of the
      license-risk invariant.
    transitions:
      - from: OPEN
        to: UNDER_INVESTIGATION
        trigger: "POST /violation-cases/{id}/investigate"
        actor: ComplianceOfficer
        preconditions:
          - "ViolationCase.state == OPEN"
        side_effects:
          - "increments ViolationCase.investigation_rounds"
      - from: UNDER_INVESTIGATION
        to: PENDING_PARTNER_RESPONSE
        trigger: "POST /violation-cases/{id}/request-partner-response"
        actor: ComplianceOfficer
        preconditions:
          - "ViolationCase.state == UNDER_INVESTIGATION"
          - "response_due_at > the logical clock now"
        side_effects: ["records the questions on the case"]
      - from: PENDING_PARTNER_RESPONSE
        to: UNDER_INVESTIGATION
        trigger: "POST /violation-cases/{id}/partner-response"
        actor: PartnerManager
        preconditions:
          - "ViolationCase.state == PENDING_PARTNER_RESPONSE"
          - "X-User-ID == ViolationCase.delivery_partner_id"
        side_effects:
          - "increments ViolationCase.investigation_rounds"
        note: "Cycle edge 1. The case may bounce between these two states any number of times."
      - from: UNDER_INVESTIGATION
        to: SUBSTANTIATED
        trigger: "POST /violation-cases/{id}/decide with decision == SUBSTANTIATED"
        actor: ComplianceOfficer
        preconditions:
          - "ViolationCase.state == UNDER_INVESTIGATION"
          - "assessed_severity is supplied"
        side_effects:
          - "stamps ViolationCase.decided_at with the logical clock and stores X-User-ID in ViolationCase.substantiated_by_user_id"
          - "recomputes DeliveryPartner.open_case_count, open_critical_case_count, license_risk_score and lifetime_risk_score"
          - "writes ViolationCase.risk_contribution from calculations.partner_license_risk_score variant ROLLING_90D"
          - "runs calculations.partner_posture_derivation, which may move DeliveryPartner.posture and cascade to that partner's DISPATCHED orders in Order.created_at ASC order"
      - from: UNDER_INVESTIGATION
        to: DISMISSED
        trigger: "POST /violation-cases/{id}/decide with decision == DISMISSED"
        actor: ComplianceOfficer
        preconditions:
          - "ViolationCase.state == UNDER_INVESTIGATION"
        side_effects:
          - "stamps ViolationCase.decided_at, leaves substantiated_by_user_id null, sets assessed_severity null and risk_contribution 0.00"
          - "recomputes the partner's counts and both risk-score variants, then re-derives posture"
      - from: SUBSTANTIATED
        to: UNDER_INVESTIGATION
        trigger: "POST /violation-cases/{id}/reopen"
        actor: ComplianceOfficer
        preconditions:
          - "ViolationCase.state IN {SUBSTANTIATED, DISMISSED}"
        side_effects:
          - "clears ViolationCase.decided_at, assessed_severity, substantiated_by_user_id and sets risk_contribution 0.00"
          - "increments ViolationCase.investigation_rounds"
          - "recomputes the partner's license_risk_score and lifetime_risk_score with this case removed from the SUBSTANTIATED set, then re-derives posture"
          - "sets every CorrectiveActionPlan of this case in state IN {SUBMITTED, ACCEPTED, REVISION_REQUESTED, FAILED_VERIFICATION} to SUPERSEDED"
        note: "Cycle edge 2 and the compensating half of the license-risk invariant."
      - from: DISMISSED
        to: UNDER_INVESTIGATION
        trigger: "POST /violation-cases/{id}/reopen"
        actor: ComplianceOfficer
        preconditions:
          - "ViolationCase.state IN {SUBSTANTIATED, DISMISSED}"
        side_effects:
          - "increments ViolationCase.investigation_rounds and clears decided_at"
      - from: SUBSTANTIATED
        to: CLOSED_VERIFIED
        trigger: "system: a CorrectiveActionPlan of this case reaches state VERIFIED"
        actor: system
        preconditions:
          - "ViolationCase.state == SUBSTANTIATED"
          - "the plan's verification_outcome == PASSED"
        side_effects:
          - "halves the case's risk contribution via the CAP_VERIFIED_CREDIT factor, then recomputes both partner risk-score variants and re-derives posture"

  # -- CorrectiveActionPlan: cyclic revision loop -----------------------------
  - entity: CorrectiveActionPlan
    initial_state: SUBMITTED
    terminal_states: [VERIFIED, SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /corrective-action-plans/{id}/review with decision == ACCEPT"
        actor: ComplianceOfficer
        preconditions:
          - "CorrectiveActionPlan.state == SUBMITTED"
          - "the parent ViolationCase.state == SUBSTANTIATED"
          - "X-User-ID != the parent ViolationCase.substantiated_by_user_id"
        side_effects: ["stores X-User-ID in reviewed_by_user_id"]
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /corrective-action-plans/{id}/review with decision == REQUEST_REVISION"
        actor: ComplianceOfficer
        preconditions:
          - "CorrectiveActionPlan.state == SUBMITTED"
          - "the parent ViolationCase.state == SUBSTANTIATED"
          - "X-User-ID != the parent ViolationCase.substantiated_by_user_id"
        side_effects: ["stores X-User-ID in reviewed_by_user_id"]
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /corrective-action-plans/{id}/resubmit"
        actor: PartnerManager
        preconditions:
          - "CorrectiveActionPlan.state IN {REVISION_REQUESTED, FAILED_VERIFICATION}"
          - "X-User-ID == the parent ViolationCase.delivery_partner_id"
          - "CorrectiveActionPlan.revision_round < MAX_REVISION_ROUNDS"
        side_effects:
          - "increments CorrectiveActionPlan.revision_round"
          - "replaces remediation_items and due_at"
        note: "Cycle edge. The loop is bounded by MAX_REVISION_ROUNDS; the fourth resubmission is rejected."
      - from: ACCEPTED
        to: VERIFIED
        trigger: "POST /corrective-action-plans/{id}/verify with verification_outcome == PASSED"
        actor: ComplianceOfficer
        preconditions:
          - "CorrectiveActionPlan.state == ACCEPTED"
          - "X-User-ID != the parent ViolationCase.substantiated_by_user_id"
        side_effects:
          - "drives the parent ViolationCase SUBSTANTIATED -> CLOSED_VERIFIED"
          - "applies the CAP_VERIFIED_CREDIT factor to that case's risk contribution and recomputes both partner risk-score variants, then re-derives posture"
      - from: ACCEPTED
        to: FAILED_VERIFICATION
        trigger: "POST /corrective-action-plans/{id}/verify with verification_outcome == FAILED"
        actor: ComplianceOfficer
        preconditions:
          - "CorrectiveActionPlan.state == ACCEPTED"
          - "X-User-ID != the parent ViolationCase.substantiated_by_user_id"
        side_effects:
          - "leaves the parent ViolationCase in SUBSTANTIATED, so no risk credit is applied"
      - from: FAILED_VERIFICATION
        to: SUBMITTED
        trigger: "POST /corrective-action-plans/{id}/resubmit"
        actor: PartnerManager
        preconditions:
          - "CorrectiveActionPlan.state IN {REVISION_REQUESTED, FAILED_VERIFICATION}"
          - "X-User-ID == the parent ViolationCase.delivery_partner_id"
          - "CorrectiveActionPlan.revision_round < MAX_REVISION_ROUNDS"
        side_effects:
          - "increments CorrectiveActionPlan.revision_round"
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system: a newer CorrectiveActionPlan is created for the same ViolationCase via POST /violation-cases/{id}/corrective-action-plans"
        actor: system
        preconditions:
          - "CorrectiveActionPlan.state IN {SUBMITTED, ACCEPTED, REVISION_REQUESTED, FAILED_VERIFICATION}"
        side_effects: ["no risk-score change; superseded plans never earn CAP_VERIFIED_CREDIT"]

  # -- CourierCertification: cyclic lapse/renew -------------------------------
  - entity: CourierCertification
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: POST /_clock/set_current_utc advances the clock to or past expires_at"
        actor: system
        preconditions:
          - "CourierCertification.state == ACTIVE"
          - "the new clock value >= CourierCertification.expires_at"
        side_effects:
          - "re-derives Courier.certification_state and Courier.dispatch_eligible"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: Courier.compliance_score falls below CERT_SUSPENSION_SCORE_THRESHOLD (cascade link 2)"
        actor: system
        preconditions:
          - "CourierCertification.state == ACTIVE"
          - "the recomputed Courier.compliance_score < CERT_SUSPENSION_SCORE_THRESHOLD"
        side_effects:
          - "cascade link 3 (fires only because link 2 suspended the certification): every DeliveryAttempt of this courier in state INITIATED, ID_VERIFIED or ID_REJECTED moves to ABORTED and its Order moves OUT_FOR_DELIVERY -> RETURN_IN_TRANSIT, processed in DeliveryAttempt.created_at ASC order"
          - "re-derives Courier.certification_state and Courier.dispatch_eligible"
      - from: EXPIRED
        to: ACTIVE
        trigger: "POST /courier-certifications/{id}/renew"
        actor: PartnerManager
        preconditions:
          - "CourierCertification.state IN {EXPIRED, SUSPENDED}"
          - "X-User-ID == the courier's delivery_partner_id"
          - "training_score >= CERT_MIN_TRAINING_SCORE when the row is EXPIRED, or >= CERT_REMEDIAL_TRAINING_SCORE when the row is SUSPENDED"
          - "the logical clock now minus training_completed_at is <= TRAINING_FRESHNESS_DAYS days"
        side_effects:
          - "sets issued_at to the logical clock, recomputes expires_at, increments renewal_count"
          - "re-derives Courier.certification_state and Courier.dispatch_eligible"
        note: "Cycle edge 1: ACTIVE -> EXPIRED -> ACTIVE."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /courier-certifications/{id}/renew"
        actor: PartnerManager
        preconditions:
          - "CourierCertification.state IN {EXPIRED, SUSPENDED}"
          - "X-User-ID == the courier's delivery_partner_id"
          - "training_score >= CERT_REMEDIAL_TRAINING_SCORE"
          - "the logical clock now minus training_completed_at is <= TRAINING_FRESHNESS_DAYS days"
        side_effects:
          - "sets issued_at to the logical clock, recomputes expires_at, increments renewal_count"
          - "re-derives Courier.certification_state and Courier.dispatch_eligible"
        note: "Cycle edge 2: remedial reinstatement demands the higher score bar."
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /courier-certifications/{id}/revoke"
        actor: ComplianceOfficer
        preconditions:
          - "CourierCertification.state IN {ACTIVE, EXPIRED, SUSPENDED}"
        side_effects:
          - "stores revocation_reason"
          - "re-derives Courier.certification_state and Courier.dispatch_eligible"
          - "aborts the courier's open DeliveryAttempt rows exactly as the SUSPENDED cascade does"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /courier-certifications/{id}/revoke"
        actor: ComplianceOfficer
        preconditions:
          - "CourierCertification.state IN {ACTIVE, EXPIRED, SUSPENDED}"
        side_effects: ["stores revocation_reason and re-derives the courier's gates"]

  # -- Courier: compound, derived from certification rows and score -----------
  - entity: Courier.certification_state
    initial_state: UNCERTIFIED
    terminal_states: []
    note: "Compound machine: the value is a pure function of the courier's CourierCertification rows and compliance_score, re-derived after every event that touches either."
    transitions:
      - from: UNCERTIFIED
        to: CERTIFIED
        trigger: "system: re-derivation after POST /courier-certifications or POST /courier-certifications/{id}/renew"
        actor: system
        preconditions:
          - "at least one CourierCertification for this courier is in state ACTIVE"
          - "Courier.compliance_score >= COURIER_SUSPENSION_SCORE_THRESHOLD"
        side_effects: ["sets Courier.dispatch_eligible = true when the employing partner's posture != SUSPENDED"]
      - from: CERTIFIED
        to: SUSPENDED
        trigger: "system: re-derivation after a Courier.compliance_score recomputation"
        actor: system
        preconditions:
          - "Courier.compliance_score < COURIER_SUSPENSION_SCORE_THRESHOLD"
        side_effects: ["sets Courier.dispatch_eligible = false"]
      - from: CERTIFIED
        to: UNCERTIFIED
        trigger: "system: re-derivation after the last ACTIVE certification expires, is suspended or is revoked"
        actor: system
        preconditions:
          - "no CourierCertification for this courier is in state ACTIVE"
          - "Courier.compliance_score >= COURIER_SUSPENSION_SCORE_THRESHOLD"
        side_effects: ["sets Courier.dispatch_eligible = false"]
      - from: SUSPENDED
        to: CERTIFIED
        trigger: "system: re-derivation after a renewal restores an ACTIVE certification and the score recovers"
        actor: system
        preconditions:
          - "Courier.compliance_score >= COURIER_SUSPENSION_SCORE_THRESHOLD"
          - "at least one CourierCertification for this courier is in state ACTIVE"
        side_effects: ["sets Courier.dispatch_eligible = true when the employing partner's posture != SUSPENDED"]

  # -- DeliveryPartner.posture: derived aggregate gate ------------------------
  - entity: DeliveryPartner.posture
    initial_state: OPEN
    terminal_states: []
    note: "Cyclic derived gate. Every edge is produced by calculations.partner_posture_derivation, never by a direct endpoint."
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system: partner_posture_derivation after a case decision, case creation, reopen, CAP verification or POST /_clock/set_current_utc"
        actor: system
        preconditions:
          - "license_risk_score >= POSTURE_RESTRICTED_SCORE or open_case_count >= POSTURE_RESTRICTED_OPEN_CASES"
          - "not (license_risk_score >= POSTURE_SUSPENDED_SCORE or open_critical_case_count >= POSTURE_SUSPENDED_CRITICAL_CASES)"
        side_effects:
          - "cascade link 4: every Order of this partner in fulfillment_state DISPATCHED moves to HELD_AT_HUB with hold_reason set, and its compliance_state PREVERIFIED|COMPLIANCE_CLEARED moves to PENDING_COMPLIANCE_REVIEW, processed in Order.created_at ASC order"
          - "re-derives Courier.dispatch_eligible for every courier of this partner"
      - from: RESTRICTED
        to: SUSPENDED
        trigger: "system: partner_posture_derivation"
        actor: system
        preconditions:
          - "license_risk_score >= POSTURE_SUSPENDED_SCORE or open_critical_case_count >= POSTURE_SUSPENDED_CRITICAL_CASES"
        side_effects:
          - "same cascade link 4 as above"
          - "sets Courier.dispatch_eligible = false for every courier of this partner"
          - "POST /orders/{id}/dispatch is rejected with ERR_PARTNER_SUSPENDED while in this posture"
      - from: OPEN
        to: SUSPENDED
        trigger: "system: partner_posture_derivation"
        actor: system
        preconditions:
          - "license_risk_score >= POSTURE_SUSPENDED_SCORE or open_critical_case_count >= POSTURE_SUSPENDED_CRITICAL_CASES"
        side_effects: ["same cascade link 4 and courier de-eligibility as the RESTRICTED -> SUSPENDED edge"]
      - from: SUSPENDED
        to: RESTRICTED
        trigger: "system: partner_posture_derivation after a reopen, dismissal or CAP verification lowers the score"
        actor: system
        preconditions:
          - "license_risk_score >= POSTURE_RESTRICTED_SCORE or open_case_count >= POSTURE_RESTRICTED_OPEN_CASES"
          - "not (license_risk_score >= POSTURE_SUSPENDED_SCORE or open_critical_case_count >= POSTURE_SUSPENDED_CRITICAL_CASES)"
        side_effects:
          - "re-derives Courier.dispatch_eligible for every courier of this partner"
          - "does NOT release orders already in HELD_AT_HUB; releasing them requires POST /orders/{id}/dispatch"
      - from: RESTRICTED
        to: OPEN
        trigger: "system: partner_posture_derivation after the score and open-case counts fall below both restricted thresholds"
        actor: system
        preconditions:
          - "license_risk_score < POSTURE_RESTRICTED_SCORE and open_case_count < POSTURE_RESTRICTED_OPEN_CASES"
        side_effects:
          - "re-derives Courier.dispatch_eligible for every courier of this partner"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules  (OCC on the parent entity's `version` only)
# ---------------------------------------------------------------------------

concurrency_rules:
  - rule_id: identity-check-create-stale-customer
    parent_entity: Customer
    write_endpoint: "POST /customers/{id}/identity-checks"
    occ_field: "expected_customer_version"
    description: |
      Creating an IdentityCheck against a Customer whose version has advanced since the
      client last observed it is rejected. A new pre-verification legitimately supersedes
      the customer's previous VALID IdentityCheck and rewrites
      Customer.latest_identity_check_result, so a writer holding a stale view of the
      customer would silently discard a pre-verification it never saw.
    error_id: ERR_STALE_CUSTOMER_VERSION
    http_status: 412

  - rule_id: cap-create-stale-violation-case
    parent_entity: ViolationCase
    write_endpoint: "POST /violation-cases/{id}/corrective-action-plans"
    occ_field: "expected_violation_case_version"
    description: |
      Creating a CorrectiveActionPlan against a ViolationCase whose version has advanced
      since the client last observed it is rejected. A new plan legitimately supersedes
      every earlier non-terminal plan on the case, so a writer working from a stale view
      of the case would supersede a plan whose review it never observed.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------

calculations:
  - name: order_restricted_unit_exposure
    trigger: "POST /orders/{id}/submit (variant PROVISIONAL_AT_SUBMIT) and POST /delivery-attempts/{id}/handover (variant FINAL_AT_HANDOVER)"
    algorithm: aggregation
    formula: |
      # Evaluated once per element of Order.restriction_types. `eval_instant` and
      # `included_states` are supplied by the variant.
      #
      # ROUNDING ORDER IS PINNED: round EVERY line to 2 decimal places FIRST, then sum
      # the rounded line values, then round the sum again to 2 decimal places.
      # Summing the unrounded products and rounding once at the end is FORBIDDEN and
      # yields a different value (worked example below).
      policy = effective_policy(Order.delivery_jurisdiction_id, restriction_type, local_date(eval_instant))
      exposure = 0.00
      for L in OrderLine rows of Order sorted by OrderLine.created_at ASC:
          if Product(L.product_id).restriction_type != restriction_type: continue
          if L.line_state not in included_states: continue
          units_per_item = variant_units_per_item(L)          # see variants
          raw = Decimal(L.quantity) * Decimal(units_per_item) * Decimal(policy.unit_scale_factor)
          L.line_restricted_units = round_half_up(raw, 2)     # PER-LINE ROUNDING, step 1
          exposure = exposure + L.line_restricted_units
      exposure = round_half_up(exposure, 2)                   # SUM ROUNDING, step 2
      return exposure
      #
      # Worked divergence (quantities 3, 2, 1 with units_per_item 1.50, 0.75, 0.05 and
      # unit_scale_factor 1.15):
      #   pinned order  : round(5.175)=5.18, round(1.725)=1.73, round(0.0575)=0.06 -> 6.97
      #   forbidden order: round(5.175 + 1.725 + 0.0575) = round(6.9575)          -> 6.96
      # A max_units_per_order of 6.96 therefore REJECTS this order under the pinned
      # order and ACCEPTS it under the forbidden one.
    input_set: |
      OrderLine rows of the order whose Product.restriction_type equals the restriction
      type under evaluation and whose line_state is in the variant's included_states.
      Lines are visited in OrderLine.created_at ASC order; the sum is order-insensitive,
      so no tie-break is required, but the visit order is pinned anyway so that the
      per-line values written back to OrderLine.line_restricted_units are deterministic.
    constants:
      EXPOSURE_DECIMALS: 2
      ROUNDING: round_half_up
    precision: "2 decimal places, round_half_up, applied twice (per line, then to the sum)"
    variants:
      - name: PROVISIONAL_AT_SUBMIT
        when: "POST /orders/{id}/submit; written to Order.provisional_restricted_units"
        difference: |
          eval_instant = Order.scheduled_delivery_at; included_states = {INCLUDED};
          variant_units_per_item(L) = OrderLine.units_per_item_snapshot (the value copied
          from Product at line creation). Selects the RestrictionPolicy effective on the
          local date of the PROMISED delivery.
      - name: FINAL_AT_HANDOVER
        when: "POST /delivery-attempts/{id}/handover; written to Order.final_restricted_units"
        difference: |
          eval_instant = DeliveryAttempt.started_at; included_states = {INCLUDED};
          variant_units_per_item(L) = the live Product.restricted_units_per_item.
          Selects the RestrictionPolicy effective on the local date of the ACTUAL doorstep
          instant. When a later policy row for the same (jurisdiction, restriction_type)
          carries a different unit_scale_factor, the two variants return different numbers
          for byte-identical order data — e.g. 6.97 provisional at factor 1.15 versus 7.87
          final at factor 1.30.

  - name: partner_license_risk_score
    trigger: "POST /violation-cases/{id}/decide, POST /violation-cases/{id}/reopen, POST /corrective-action-plans/{id}/verify, and POST /_clock/set_current_utc"
    algorithm: weighted_scoring
    formula: |
      # `now` is the logical clock. Both variants share this skeleton and differ only in
      # the inclusion predicate and the age weight.
      tier_multiplier = { STANDARD: 1.00, PREFERRED: 0.80, PROBATIONARY: 1.50 }[partner.contract_tier]
      raw = 0.00
      for C in ViolationCase rows where C.delivery_partner_id == partner.id
              and C.state IN {SUBSTANTIATED, CLOSED_VERIFIED}
              sorted by C.decided_at ASC, then C.created_at ASC:
          age_days = floor((now - C.decided_at) / 86400 seconds)
          if not variant_includes(age_days): continue
          weight = variant_weight(age_days)
          base = SEVERITY_POINTS[C.assessed_severity] * weight
          if C.state == CLOSED_VERIFIED: base = base * CAP_VERIFIED_CREDIT
          raw = raw + round_half_up(base, 2)          # per-case rounding, pinned
      return min(SCORE_CEILING, round_half_up(raw * tier_multiplier, 2))
      #
      # partner.license_risk_score  := variant ROLLING_90D
      # partner.lifetime_risk_score := variant LIFETIME_WEIGHTED
      # ViolationCase.risk_contribution := that case's ROLLING_90D per-case rounded term.
    input_set: |
      ViolationCase rows of the partner with state IN {SUBSTANTIATED, CLOSED_VERIFIED}.
      OPEN, UNDER_INVESTIGATION, PENDING_PARTNER_RESPONSE and DISMISSED cases contribute
      zero points; they influence posture only through open_case_count and
      open_critical_case_count. Cases are visited in decided_at ASC then created_at ASC
      order (never by id).
    constants:
      SEVERITY_POINTS: { MINOR: 5, MAJOR: 15, CRITICAL: 40 }
      ROLLING_WINDOW_DAYS: 90
      DECAY_STEP_DAYS: 90
      DECAY_PER_STEP: 0.10
      DECAY_FLOOR: 0.25
      CAP_VERIFIED_CREDIT: 0.50
      SCORE_CEILING: 100.00
    precision: "2 decimal places, round_half_up, applied per case and once more to the tier-multiplied total"
    variants:
      - name: ROLLING_90D
        when: "written to DeliveryPartner.license_risk_score; the variant that drives posture derivation"
        difference: |
          variant_includes(age_days) = (age_days <= ROLLING_WINDOW_DAYS);
          variant_weight(age_days) = 1.00. Cases older than 90 days vanish entirely.
      - name: LIFETIME_WEIGHTED
        when: "written to DeliveryPartner.lifetime_risk_score and reported by GET /delivery-partners/{id}/risk-assessment; never used for posture"
        difference: |
          variant_includes(age_days) = true (every substantiated case, forever);
          variant_weight(age_days) = max(DECAY_FLOOR, 1.00 - DECAY_PER_STEP * floor(age_days / DECAY_STEP_DAYS)).
          For a STANDARD partner holding a CRITICAL case decided 28 days ago, a MAJOR case
          decided 23 days ago and a MINOR case decided 240 days ago, ROLLING_90D returns
          55.00 while LIFETIME_WEIGHTED returns 59.00 from the same rows.

  - name: partner_posture_derivation
    trigger: "immediately after every partner_license_risk_score recomputation and after every change to open_case_count or open_critical_case_count"
    algorithm: threshold
    formula: |
      # Evaluated strictly AFTER license_risk_score has been rewritten, so the posture
      # never feeds back into its own inputs.
      if license_risk_score >= POSTURE_SUSPENDED_SCORE
         or open_critical_case_count >= POSTURE_SUSPENDED_CRITICAL_CASES:
          posture = SUSPENDED
      elif license_risk_score >= POSTURE_RESTRICTED_SCORE
         or open_case_count >= POSTURE_RESTRICTED_OPEN_CASES:
          posture = RESTRICTED
      else:
          posture = OPEN
    input_set: "DeliveryPartner.license_risk_score (ROLLING_90D variant only), open_case_count and open_critical_case_count as recomputed in the same request"
    constants:
      POSTURE_SUSPENDED_SCORE: 60.00
      POSTURE_RESTRICTED_SCORE: 25.00
      POSTURE_RESTRICTED_OPEN_CASES: 3
      POSTURE_SUSPENDED_CRITICAL_CASES: 2
    precision: "comparisons use >= on 2-decimal values; a score of exactly 25.00 is RESTRICTED and exactly 60.00 is SUSPENDED"

  - name: refusal_return_settlement
    trigger: "POST /orders/{id}/return-settlement"
    algorithm: waterfall_allocation
    formula: |
      # EVALUATION ORDER IS PINNED. The restocking tier is keyed on
      # gross_refundable_cents, which is computed BEFORE any fee is deducted. Keying the
      # tier on the post-fee refund (the reading the prose invites, because the fee is
      # "a percentage of the refund") is FORBIDDEN and yields a different number.
      reason = the refusal_reason of the DeliveryAttempt of this order in state REFUSED
               with the greatest started_at (ties broken by created_at ASC)
      # step 1 - gross refundable, BEFORE fees
      gross_refundable_cents = Order.item_subtotal_cents
      # step 2 - tier lookup keyed on step 1's value
      if   gross_refundable_cents < RESTOCK_TIER_1_MAX:  tier_bps = 0
      elif gross_refundable_cents < RESTOCK_TIER_2_MAX:  tier_bps = RESTOCK_TIER_2_BPS
      else:                                              tier_bps = RESTOCK_TIER_3_BPS
      # step 3 - fee, floored to whole cents
      if reason IN RESTOCK_WAIVED_REASONS: restocking_fee_cents = 0
      else: restocking_fee_cents = floor(gross_refundable_cents * tier_bps / 10000)
      # step 4 - delivery fee is refunded only when the platform was at fault
      fee_refund_cents = Order.delivery_fee_cents if reason IN FEE_REFUND_REASONS else 0
      # step 5 - settle
      refunded_cents = gross_refundable_cents - restocking_fee_cents + fee_refund_cents
      retained_cents = Order.charged_cents - refunded_cents
      # INVARIANT (money conservation):
      #   refunded_cents + retained_cents == Order.charged_cents, exactly, always.
      #
      # Worked divergence (item_subtotal 20400, delivery_fee 600, reason UNDERAGE_RECIPIENT):
      #   pinned order   : gross 20400 -> tier 800 bps -> fee 1632 -> refunded 18768, retained 2232
      #   forbidden order: tier keyed on the post-fee refund 18768 -> 500 bps -> refunded 19380
    input_set: "the order's own charged_cents, item_subtotal_cents and delivery_fee_cents, plus the refusal_reason of its most recent REFUSED DeliveryAttempt"
    constants:
      RESTOCK_TIER_1_MAX: 5000
      RESTOCK_TIER_2_MAX: 20000
      RESTOCK_TIER_2_BPS: 500
      RESTOCK_TIER_3_BPS: 800
      RESTOCK_WAIVED_REASONS: [COURIER_FAULT]
      FEE_REFUND_REASONS: [COURIER_FAULT]
    precision: "integer cents throughout; the fee is floored (never rounded) so the platform never over-refunds"

  - name: identity_prevalidation_confidence
    trigger: "POST /customers/{id}/identity-checks"
    algorithm: weighted_scoring
    formula: |
      confidence = 0.0000
      for s in source_signals sorted by SIGNAL_WEIGHT key order
              [GOVERNMENT_ID_DB, CREDIT_BUREAU, MOBILE_CARRIER, WATCHLIST_NEGATIVE]:
          if s.matched == true: confidence = confidence + SIGNAL_WEIGHT[s.source_type]
      confidence = round_half_up(confidence, 4)
      if provided_dob != source_dob and any signal with source_type == GOVERNMENT_ID_DB has matched == true:
          confidence = max(0.0000, round_half_up(confidence - DOB_MISMATCH_PENALTY, 4))
      if   confidence >= MATCH_THRESHOLD:   result = MATCH
      elif confidence >= PARTIAL_THRESHOLD: result = PARTIAL
      else:                                 result = NO_MATCH
      verified_dob = source_dob if result == MATCH else (provided_dob if result == PARTIAL else null)
      # Boundary: confidence exactly 0.8500 is MATCH (>=, not >). GOVERNMENT_ID_DB +
      # CREDIT_BUREAU + WATCHLIST_NEGATIVE all matched = 0.5000 + 0.2500 + 0.1000 = 0.8500.
      # All four matched with a dob disagreement = 1.0000 - 0.2000 = 0.8000 -> PARTIAL.
    input_set: "only the source_signals supplied on this request; earlier IdentityCheck rows for the same customer are never consulted"
    constants:
      SIGNAL_WEIGHT: { GOVERNMENT_ID_DB: 0.50, CREDIT_BUREAU: 0.25, MOBILE_CARRIER: 0.15, WATCHLIST_NEGATIVE: 0.10 }
      DOB_MISMATCH_PENALTY: 0.20
      MATCH_THRESHOLD: 0.8500
      PARTIAL_THRESHOLD: 0.6000
    precision: "4 decimal places, round_half_up"

  - name: courier_compliance_score
    trigger: "POST /secret-shopper-tests/{id}/record-outcome, POST /violation-cases/{id}/decide, POST /violation-cases/{id}/reopen, and POST /delivery-attempts/{id}/handover"
    algorithm: weighted_scoring
    formula: |
      penalties = 0.00
      for T in SecretShopperTest rows where T.courier_id == courier.id and T.verdict == FAIL
              sorted by T.recorded_at ASC, then T.created_at ASC:
          penalties = penalties + SHOPPER_FAIL_PENALTY
      for C in ViolationCase rows where C.state IN {SUBSTANTIATED, CLOSED_VERIFIED}
              and C.delivery_attempt_id is not null
              and the DeliveryAttempt named by C.delivery_attempt_id has courier_id == courier.id
              sorted by C.decided_at ASC, then C.created_at ASC:
          penalties = penalties + CASE_PENALTY[C.assessed_severity]
      bonus = min(HANDOVER_BONUS_CAP, HANDOVER_BONUS_PER * courier.compliant_handover_count)
      score = round_half_up(BASE_SCORE + penalties + bonus, 2)
      return max(0.00, min(100.00, score))
      # Two FAIL secret shopper tests and nothing else: 100.00 - 25.00 - 25.00 = 50.00,
      # which is below CERT_SUSPENSION_SCORE_THRESHOLD (70.00) and therefore suspends
      # every ACTIVE CourierCertification of that courier.
    input_set: "all FAIL SecretShopperTest rows of the courier (no time window), all SUBSTANTIATED/CLOSED_VERIFIED ViolationCase rows attached to that courier's attempts, and the courier's compliant_handover_count"
    constants:
      BASE_SCORE: 100.00
      SHOPPER_FAIL_PENALTY: -25.00
      CASE_PENALTY: { MINOR: -8.00, MAJOR: -18.00, CRITICAL: -35.00 }
      HANDOVER_BONUS_PER: 1.00
      HANDOVER_BONUS_CAP: 10.00
      CERT_SUSPENSION_SCORE_THRESHOLD: 70.00
      COURIER_SUSPENSION_SCORE_THRESHOLD: 40.00
    precision: "2 decimal places, round_half_up, clamped to [0.00, 100.00]"

  - name: delivery_permissibility_evaluation
    trigger: "POST /orders/{id}/submit (using Order.scheduled_delivery_at) and POST /delivery-attempts (using DeliveryAttempt.started_at)"
    algorithm: interval_merge
    formula: |
      # Restricted-hours geometry. The window is HALF-OPEN on the local minute axis:
      # start is inclusive, end is exclusive.
      local_minute(t) = ((floor(epoch_minutes(t)) + jurisdiction.utc_offset_minutes) mod 1440)
      m = local_minute(eval_instant)
      if policy.delivery_window_end_minute > policy.delivery_window_start_minute:
          in_window = (policy.delivery_window_start_minute <= m
                       and m < policy.delivery_window_end_minute)
      else:                              # window wraps past local midnight
          in_window = (m >= policy.delivery_window_start_minute
                       or m < policy.delivery_window_end_minute)
      # Dry / permit geometry, evaluated BEFORE the window check (validations priority 50
      # precedes priority 60).
      if policy.permissibility == PROHIBITED: -> ERR_DELIVERY_PROHIBITED_IN_JURISDICTION
      if restriction_type == ALCOHOL and jurisdiction.dry_status == DRY: -> ERR_DRY_JURISDICTION_PROHIBITED
      if jurisdiction.dry_status == DAMP and policy.permissibility != PERMIT_REQUIRED: -> ERR_PERMIT_REQUIRED
      if not in_window: -> ERR_OUTSIDE_RESTRICTED_HOURS
      # Boundary: with utc_offset_minutes -240 and window [600, 1320), a scheduled instant
      # of 2026-08-21T01:59:00Z is local minute 1319 and PASSES, while
      # 2026-08-21T02:00:00Z is local minute 1320 and FAILS.
    input_set: "the RestrictionPolicy selected for (Order.delivery_jurisdiction_id, restriction_type) whose closed [effective_from, effective_to] date interval contains the local date of the evaluation instant"
    constants:
      MINUTES_PER_DAY: 1440
    precision: "integer minutes; the local minute is computed by flooring to whole minutes before the offset is applied"

  - name: customer_window_units_consumed
    trigger: "POST /orders/{id}/submit, as the aggregate half of the rolling quantity-limit check"
    algorithm: aggregation
    formula: |
      # Half-open lookback: [anchor - rolling_window_days days, anchor).
      anchor = Order.scheduled_delivery_at
      window_start = anchor - policy.rolling_window_days days
      consumed = 0.00
      for O in Order rows where O.customer_id == this order's customer_id
              and O.id != this order's id
              and O.fulfillment_state == DELIVERED
              and O.delivered_at >= window_start
              and O.delivered_at < anchor
              and restriction_type IN O.restriction_types
              sorted by O.delivered_at ASC, then O.created_at ASC:
          consumed = consumed + O.final_restricted_units
      return round_half_up(consumed, 2)
      # Orders in RETURN_COMPLETED never appear here: the return settlement resets
      # final_restricted_units to 0.00 AND moves the order out of DELIVERED, so a refused
      # and returned order releases the units it had consumed.
    input_set: |
      Order rows of the same customer with fulfillment_state == DELIVERED exactly (never
      SUBMITTED, DISPATCHED, OUT_FOR_DELIVERY, RETURN_IN_TRANSIT or RETURN_COMPLETED)
      whose delivered_at lies in the half-open window, and whose restriction_types contains
      the restriction type under evaluation. The sum is order-insensitive; the visit order
      is pinned to delivered_at ASC then created_at ASC for reproducibility, never by id.
    constants:
      QUOTA_DECIMALS: 2
    precision: "2 decimal places, round_half_up"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (evaluated in strictly ascending priority order;
#      the FIRST violated rule determines the response, and no later rule is
#      evaluated)
# ---------------------------------------------------------------------------

validations:
  - priority: 10
    category: auth
    check: "`X-User-ID` header is present and non-empty on every request"
    error_id: ERR_MISSING_AUTH_HEADER
    http_status: 401
    applies_to: all

  - priority: 20
    category: auth
    check: "the caller's role is listed in the endpoint's `roles:`"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 25
    category: auth
    check: |
      Peer-ownership scope. A Customer caller may only touch Orders whose customer_id
      equals `X-User-ID` and Customers whose id equals `X-User-ID`. A PartnerManager may
      only touch DeliveryPartner rows, Couriers, CourierCertifications, Orders and
      ViolationCases whose owning delivery_partner_id equals `X-User-ID`. A Courier may
      only touch DeliveryAttempt rows whose courier_id equals `X-User-ID`.
    error_id: ERR_FORBIDDEN_RESOURCE_SCOPE
    http_status: 403
    applies_to: "all Customer-, PartnerManager- and Courier-scoped endpoints"

  - priority: 26
    category: auth
    check: |
      Segregation of duties. On `POST /corrective-action-plans/{id}/review` and
      `POST /corrective-action-plans/{id}/verify`, `X-User-ID` MUST NOT equal the parent
      ViolationCase's substantiated_by_user_id: the officer who substantiated a case may
      not sign off on the remediation of that same case.
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /corrective-action-plans/{id}/review, POST /corrective-action-plans/{id}/verify"

  - priority: 30
    category: existence
    check: "every id in the request PATH resolves to a live row, validated left-to-right"
    error_id: "ERR_JURISDICTION_NOT_FOUND | ERR_PRODUCT_NOT_FOUND | ERR_CUSTOMER_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_ORDER_LINE_NOT_FOUND | ERR_PARTNER_NOT_FOUND | ERR_COURIER_NOT_FOUND | ERR_CERTIFICATION_NOT_FOUND | ERR_ATTEMPT_NOT_FOUND | ERR_SHOPPER_TEST_NOT_FOUND | ERR_CASE_NOT_FOUND | ERR_PLAN_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 32
    category: existence
    check: "every FK supplied in the request BODY resolves to a live row, validated in the field order declared by the endpoint's `input:`"
    error_id: "ERR_JURISDICTION_NOT_FOUND | ERR_PRODUCT_NOT_FOUND | ERR_CUSTOMER_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_PARTNER_NOT_FOUND | ERR_COURIER_NOT_FOUND"
    http_status: 404
    applies_to: "all POST endpoints that accept FK fields"

  - priority: 35
    category: business_constraint
    check: |
      Request shape: required fields present, JSON types correct, enum members valid,
      declared numeric ranges respected, and date/timestamp strings parseable.
      `limit` outside [1, 100] or `offset` < 0 also lands here.
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all

  - priority: 36
    category: business_constraint
    check: |
      Cross-field semantics inside one request body: RestrictionPolicy.effective_to >=
      effective_from; delivery_window_start_minute != delivery_window_end_minute; a
      `source_signals` array whose `source_type` values are not distinct; and
      CorrectiveActionPlan.due_at > the logical clock now.
    error_id: ERR_INCONSISTENT_FIELDS
    http_status: 422
    applies_to: "POST /restriction-policies, POST /customers/{id}/identity-checks, POST /violation-cases/{id}/corrective-action-plans"

  - priority: 38
    category: state
    check: "the supplied `expected_<parent>_version` equals the parent row's current `version` (§1.2.1)"
    error_id: "ERR_STALE_CUSTOMER_VERSION | ERR_STALE_CASE_VERSION"
    http_status: 412
    applies_to: "POST /customers/{id}/identity-checks, POST /violation-cases/{id}/corrective-action-plans"

  - priority: 40
    category: state
    check: |
      The target row is in a state from which the requested transition exists in §1.2.
      Order carries two dimensions: submit checks fulfillment_state == CREATED, dispatch
      checks fulfillment_state IN {SUBMITTED, HELD_AT_HUB} AND compliance_state IN
      {AUTO_CLEARED, PREVERIFIED, COMPLIANCE_CLEARED}, return-settlement checks
      fulfillment_state == RETURN_IN_TRANSIT.
    error_id: "ERR_INVALID_ORDER_STATE | ERR_INVALID_ATTEMPT_STATE | ERR_INVALID_CASE_STATE | ERR_INVALID_PLAN_STATE | ERR_INVALID_CERTIFICATION_STATE | ERR_ORDER_HAS_NO_LINES"
    http_status: 409
    applies_to: "every transition endpoint"

  - priority: 45
    category: business_referential
    check: |
      Policy resolution. For every element of the order's restriction_types, exactly one
      RestrictionPolicy must exist for (delivery_jurisdiction_id, restriction_type) whose
      closed [effective_from, effective_to] date interval contains the local date of the
      evaluation instant. Zero matching rows is a hard failure; the scaffold's overlap
      rule at priority 62 guarantees there is never more than one.
    error_id: ERR_NO_EFFECTIVE_POLICY
    http_status: 422
    applies_to: "POST /orders/{id}/submit, POST /delivery-attempts, POST /delivery-attempts/{id}/id-check"

  - priority: 50
    category: business_safety
    check: |
      Jurisdiction permissibility, evaluated per restriction type in the order
      PROHIBITED, then dry status, then permit posture:
      (a) the selected policy has permissibility == PROHIBITED;
      (b) restriction_type == ALCOHOL and the jurisdiction's dry_status == DRY;
      (c) the jurisdiction's dry_status == DAMP and the selected policy's permissibility
          != PERMIT_REQUIRED.
    error_id: "ERR_DELIVERY_PROHIBITED_IN_JURISDICTION | ERR_DRY_JURISDICTION_PROHIBITED | ERR_PERMIT_REQUIRED"
    http_status: 422
    applies_to: "POST /orders/{id}/submit, POST /delivery-attempts"

  - priority: 52
    category: business_safety
    check: |
      Delivery-partner and courier authority:
      (a) the DeliveryPartner's posture == SUSPENDED;
      (b) the Courier's delivery_partner_id != the Order's delivery_partner_id;
      (c) the Courier's certification_state != CERTIFIED;
      (d) at door-side ID check, the courier lacks an ACTIVE CourierCertification for
          some element of the order's restriction_types.
    error_id: "ERR_PARTNER_SUSPENDED | ERR_COURIER_PARTNER_MISMATCH | ERR_COURIER_NOT_CERTIFIED | ERR_CERTIFICATION_MISSING_FOR_RESTRICTION"
    http_status: 422
    applies_to: "POST /orders/{id}/dispatch, POST /delivery-attempts, POST /delivery-attempts/{id}/id-check"

  - priority: 54
    category: business_safety
    check: |
      Door-side identification, evaluated in this fixed sub-order:
      (a) document_type is not a member of every selected policy's
          acceptable_document_types (an empty acceptable_document_types rejects every
          document, including a well-formed one);
      (b) some selected policy has requires_scan == true and scan_performed == false;
      (c) document_expires_on < the local date of DeliveryAttempt.started_at;
      (d) scanned_dob != Customer.attested_dob.
    error_id: "ERR_DOCUMENT_TYPE_NOT_ACCEPTABLE | ERR_SCAN_REQUIRED | ERR_DOCUMENT_EXPIRED | ERR_RECIPIENT_IDENTITY_MISMATCH"
    http_status: 422
    applies_to: "POST /delivery-attempts/{id}/id-check"

  - priority: 56
    category: business_safety
    check: |
      Purchaser eligibility at submit time, evaluated in this fixed sub-order:
      (a) Customer.attestation_state != ATTESTED;
      (b) Customer.blocked_until is set and > the logical clock now;
      (c) no IdentityCheck of the customer has status == VALID;
      (d) the newest VALID IdentityCheck has result == NO_MATCH is NOT an error — it
          routes the order to COMPLIANCE_BLOCKED instead;
      (e) the completed age of the newest VALID IdentityCheck's verified_dob at the local
          date of scheduled_delivery_at is < max(min_age_years) over the selected policies.
    error_id: "ERR_ATTESTATION_REQUIRED | ERR_CUSTOMER_DELIVERY_BLOCKED | ERR_IDENTITY_PREVERIFICATION_REQUIRED | ERR_PURCHASER_UNDERAGE"
    http_status: 422
    applies_to: "POST /orders/{id}/submit"

  - priority: 58
    category: business_safety
    check: |
      Capture completeness before handover: a CaptureArtifact with kind SIGNATURE and one
      with kind PHOTO_HANDOFF must exist for the attempt, plus one with kind PHOTO_ID
      whenever any selected policy has requires_scan == true.
    error_id: ERR_CAPTURE_INCOMPLETE
    http_status: 422
    applies_to: "POST /delivery-attempts/{id}/handover"

  - priority: 60
    category: business_temporal
    check: |
      Temporal admissibility of a single instant:
      (a) the local delivery minute of the evaluation instant falls outside the selected
          policy's half-open [delivery_window_start_minute, delivery_window_end_minute)
          window;
      (b) Order.scheduled_delivery_at <= the logical clock now at submit time;
      (c) `response_due_at` <= the logical clock now;
      (d) at certification renewal, the logical clock now minus training_completed_at
          exceeds TRAINING_FRESHNESS_DAYS days.
    error_id: "ERR_OUTSIDE_RESTRICTED_HOURS | ERR_SCHEDULED_TIME_IN_PAST | ERR_RESPONSE_DUE_NOT_FUTURE | ERR_TRAINING_STALE"
    http_status: 422
    applies_to: "POST /orders/{id}/submit, POST /delivery-attempts, POST /violation-cases/{id}/request-partner-response, POST /courier-certifications/{id}/renew"

  - priority: 62
    category: business_temporal
    check: |
      Interval-occupation conflicts. Two rules with deliberately DIFFERENT geometry:
      (a) Courier attempt occupation is HALF-OPEN with a zero buffer — a new
          DeliveryAttempt occupies [started_at, started_at + COURIER_ATTEMPT_DWELL_MINUTES)
          on its courier, and collides with any non-terminal (INITIATED, ID_VERIFIED,
          ID_REJECTED) attempt of the same courier whose half-open interval intersects it.
          Exact adjacency (new.started_at == old end) is PERMITTED.
      (b) RestrictionPolicy effective periods are CLOSED-CLOSED on calendar dates for a
          given (jurisdiction_id, restriction_type) — a new policy whose
          [effective_from, effective_to] shares even a single date with an existing row is
          rejected. Exact adjacency in the closed sense (new.effective_from ==
          old.effective_to) IS a collision, unlike rule (a).
    error_id: "ERR_COURIER_SLOT_CONFLICT | ERR_POLICY_PERIOD_OVERLAP"
    http_status: 409
    applies_to: "POST /delivery-attempts, POST /restriction-policies"

  - priority: 65
    category: business_constraint
    check: |
      Structural constraints:
      (a) Jurisdiction.code and Product.sku are globally unique;
      (b) at most one CaptureArtifact per (delivery_attempt_id, kind);
      (c) a ViolationCase must reference exactly one subject — delivery_attempt_id XOR
          secret_shopper_test_id;
      (d) CorrectiveActionPlan.revision_round must be < MAX_REVISION_ROUNDS on resubmit;
      (e) OrderLine.quantity >= 1 and a submitted order must have at least one line.
    error_id: "ERR_DUPLICATE_CODE | ERR_DUPLICATE_CAPTURE_KIND | ERR_CASE_SUBJECT_INVALID | ERR_REVISION_LIMIT_REACHED"
    http_status: 409
    applies_to: "POST /jurisdictions, POST /products, POST /delivery-attempts/{id}/captures, POST /violation-cases, POST /corrective-action-plans/{id}/resubmit"

  - priority: 70
    category: business_fiscal
    check: |
      Quantity ceilings, checked last so that every safety and temporal objection is
      reported first:
      (a) per-order — the PROVISIONAL_AT_SUBMIT exposure for a restriction type exceeds
          that policy's max_units_per_order;
      (b) per-window — provisional exposure plus
          calculations.customer_window_units_consumed exceeds max_units_per_window.
    error_id: "ERR_ORDER_UNIT_LIMIT_EXCEEDED | ERR_WINDOW_UNIT_LIMIT_EXCEEDED"
    http_status: 422
    applies_to: "POST /orders/{id}/submit"

# Declared priority-conflict pairs (each testable by a single dual-failure request):
#   Pair 1 - business_safety(50, ERR_DRY_JURISDICTION_PROHIBITED) beats
#            business_temporal(60, ERR_OUTSIDE_RESTRICTED_HOURS).
#   Pair 2 - state(40, ERR_INVALID_ORDER_STATE) beats
#            business_fiscal(70, ERR_ORDER_UNIT_LIMIT_EXCEEDED).

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table   (65 endpoints; every path is top-level because
#      api_prefix is the empty string)
# ---------------------------------------------------------------------------

endpoints:
  # --- logical clock (test-driving endpoint, §1.5 ladder step 3) -------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: |
      Sets the server's logical clock to an arbitrary UTC instant. The server's startup
      DEFAULT logical clock time is exactly 2026-08-01T00:00:00Z: before any call to this
      endpoint the clock reads 2026-08-01T00:00:00Z and MUST NOT fall back to real
      wall-clock time. Every deadline, expiry, window and decay rule in this scaffold
      reads the logical clock, never the host clock. Advancing the clock also runs the
      epoch sweep described in the side effects, in the fixed order listed.
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: datetime, expired_identity_check_count: integer, expired_certification_count: integer, repostured_partner_count: integer }
    side_effects:
      - "sets the logical clock to current_utc; moving the clock backwards is rejected with ERR_CLOCK_REWIND"
      - "sweep step 1: every IdentityCheck with status == VALID and expires_at <= current_utc becomes EXPIRED, then each affected Customer.latest_identity_check_result is re-derived"
      - "sweep step 2: every CourierCertification with state == ACTIVE and expires_at <= current_utc becomes EXPIRED, then each affected Courier.certification_state and dispatch_eligible are re-derived"
      - "sweep step 3: every DeliveryPartner has license_risk_score and lifetime_risk_score recomputed (risk decay is clock-dependent), then calculations.partner_posture_derivation runs and may cascade to that partner's DISPATCHED orders in Order.created_at ASC order"
      - "returns the inline object { current_utc, expired_identity_check_count, expired_certification_count, repostured_partner_count }"

  # --- jurisdictions & policies --------------------------------------------
  - method: POST
    path: "/jurisdictions"
    description: "Registers a regulatory jurisdiction with its dry status and fixed UTC offset."
    roles: [PlatformAdmin]
    code: 201
    input: [code, name, dry_status, utc_offset_minutes]
    output: Jurisdiction
    side_effects: ["sets active_policy_count = 0"]

  - method: GET
    path: "/jurisdictions/{id}"
    description: "Reads one jurisdiction including its derived active_policy_count."
    roles: [PlatformAdmin, ComplianceOfficer, PartnerManager]
    code: 200
    input: []
    output: Jurisdiction
    side_effects: []

  - method: GET
    path: "/jurisdictions"
    description: "Lists jurisdictions, optionally filtered by dry status, ordered by created_at ASC."
    roles: [PlatformAdmin, ComplianceOfficer, PartnerManager]
    code: 200
    input: ["dry_status?", "limit?", "offset?"]
    output: Jurisdiction[]
    side_effects: []

  - method: POST
    path: "/restriction-policies"
    description: |
      Publishes a RestrictionPolicy for one (jurisdiction, restriction_type) over a closed
      calendar-date effective period. Effective periods for the same pair must not share
      even a single date (validations priority 62 rule (b)).
    roles: [PlatformAdmin]
    code: 201
    input: [jurisdiction_id, restriction_type, permissibility, min_age_years, delivery_window_start_minute, delivery_window_end_minute, unit_scale_factor, max_units_per_order, rolling_window_days, max_units_per_window, acceptable_document_types, requires_scan, effective_from, effective_to]
    output: RestrictionPolicy
    side_effects: ["increments Jurisdiction.active_policy_count on the referenced jurisdiction"]

  - method: GET
    path: "/restriction-policies/{id}"
    description: "Reads one restriction policy."
    roles: [PlatformAdmin, ComplianceOfficer, PartnerManager]
    code: 200
    input: []
    output: RestrictionPolicy
    side_effects: []

  - method: GET
    path: "/jurisdictions/{id}/restriction-policies"
    description: "Lists every restriction policy of a jurisdiction (all effective periods), ordered by effective_from ASC then created_at ASC."
    roles: [PlatformAdmin, ComplianceOfficer, PartnerManager]
    code: 200
    input: ["restriction_type?", "limit?", "offset?"]
    output: RestrictionPolicy[]
    side_effects: []

  # --- products -------------------------------------------------------------
  - method: POST
    path: "/products"
    description: "Registers a catalog product and its restriction classification."
    roles: [PlatformAdmin]
    code: 201
    input: [sku, name, restriction_type, restricted_units_per_item, list_price_cents]
    output: Product
    side_effects: []

  - method: GET
    path: "/products/{id}"
    description: "Reads one product."
    roles: [PlatformAdmin, ComplianceOfficer, Customer]
    code: 200
    input: []
    output: Product
    side_effects: []

  - method: GET
    path: "/products"
    description: "Lists products, optionally filtered by restriction_type, ordered by created_at ASC."
    roles: [PlatformAdmin, ComplianceOfficer, Customer]
    code: 200
    input: ["restriction_type?", "limit?", "offset?"]
    output: Product[]
    side_effects: []

  # --- customers ------------------------------------------------------------
  - method: POST
    path: "/customers"
    description: "Registers a customer in NOT_ATTESTED state with no identity pre-verification."
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, email, jurisdiction_id]
    output: Customer
    side_effects: ["sets attestation_state = NOT_ATTESTED, latest_identity_check_result = NONE, refusal_strikes = 0"]

  - method: GET
    path: "/customers/{id}"
    description: "Reads one customer including derived attestation and identity fields."
    roles: [PlatformAdmin, ComplianceOfficer, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: GET
    path: "/customers"
    description: "Lists customers, optionally filtered by home jurisdiction and attestation state, ordered by created_at ASC."
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: ["jurisdiction_id?", "attestation_state?", "limit?", "offset?"]
    output: Customer[]
    side_effects: []

  - method: POST
    path: "/customers/{id}/age-attestation"
    description: |
      Records the customer's self-attested date of birth. An attested age below
      GLOBAL_MIN_ATTESTATION_AGE_YEARS does NOT raise an error: it is recorded and the
      customer lands in attestation_state ATTESTATION_REJECTED, which the submit rule at
      validations priority 56 then refuses.
    roles: [Customer]
    code: 200
    input: [attested_dob, attestation_channel]
    output: Customer
    side_effects:
      - "writes attested_dob, attestation_channel and attestation_at (from the logical clock)"
      - "derives attestation_state as ATTESTED or ATTESTATION_REJECTED"
      - "increments Customer.version by 1"

  - method: POST
    path: "/customers/{id}/identity-checks"
    description: |
      Runs an identity pre-verification against a data source and stores the result. OCC:
      the caller must supply the Customer.version it last observed, because a successful
      check supersedes the customer's previous VALID IdentityCheck and rewrites
      Customer.latest_identity_check_result.
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 201
    input: [expected_customer_version, provider, provided_dob, source_dob, source_signals, validity_days]
    output: IdentityCheck
    side_effects:
      - "runs calculations.identity_prevalidation_confidence, writing confidence, result and verified_dob"
      - "sets status = VALID and expires_at = created_at + validity_days days"
      - "sets every earlier IdentityCheck of this customer with status == VALID to SUPERSEDED"
      - "re-derives Customer.latest_identity_check_result"
      - "increments Customer.version by 1"

  - method: GET
    path: "/customers/{id}/identity-checks"
    description: "Lists a customer's identity pre-verifications, newest last, ordered by created_at ASC."
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: IdentityCheck[]
    side_effects: []

  # --- orders ---------------------------------------------------------------
  - method: POST
    path: "/orders"
    description: "Opens an order in compliance_state DRAFT_UNVERIFIED and fulfillment_state CREATED with no lines."
    roles: [Customer]
    code: 201
    input: [customer_id, delivery_jurisdiction_id, delivery_partner_id, scheduled_delivery_at, delivery_fee_cents]
    output: Order
    side_effects: ["sets restriction_types = [], applied_policy_ids = [], charged_cents = 0"]

  - method: GET
    path: "/orders/{id}"
    description: "Reads one order including both state dimensions and every money and exposure field."
    roles: [PlatformAdmin, ComplianceOfficer, PartnerManager, Customer, Courier]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: GET
    path: "/orders"
    description: "Lists orders filtered by any combination of customer, delivery jurisdiction, partner and either state dimension, ordered by created_at ASC."
    roles: [PlatformAdmin, ComplianceOfficer, PartnerManager, Customer]
    code: 200
    input: ["customer_id?", "delivery_jurisdiction_id?", "delivery_partner_id?", "compliance_state?", "fulfillment_state?", "limit?", "offset?"]
    output: Order[]
    side_effects: []

  - method: POST
    path: "/orders/{id}/lines"
    description: "Adds a line to a CREATED order, snapshotting the product's price and restricted units."
    roles: [Customer]
    code: 201
    input: [product_id, quantity]
    output: OrderLine
    side_effects:
      - "snapshots unit_price_cents and units_per_item_snapshot from the product"
      - "computes line_total_cents = quantity * unit_price_cents"
      - "recomputes Order.item_subtotal_cents and Order.restriction_types"
      - "rejected with ERR_INVALID_ORDER_STATE unless Order.fulfillment_state == CREATED"

  - method: GET
    path: "/order-lines/{id}"
    description: "Reads one order line including its per-line restricted-unit figure."
    roles: [PlatformAdmin, ComplianceOfficer, Customer]
    code: 200
    input: []
    output: OrderLine
    side_effects: []

  - method: GET
    path: "/order-lines"
    description: "Lists order lines filtered by order or product, ordered by created_at ASC."
    roles: [PlatformAdmin, ComplianceOfficer, Customer]
    code: 200
    input: ["order_id?", "product_id?", "line_state?", "limit?", "offset?"]
    output: OrderLine[]
    side_effects: []

  - method: POST
    path: "/orders/{id}/submit"
    description: |
      Submits the order. Runs the whole order-time compliance battery in validation
      priority order and routes compliance_state to AUTO_CLEARED, PREVERIFIED,
      PENDING_COMPLIANCE_REVIEW or COMPLIANCE_BLOCKED depending on the newest VALID
      IdentityCheck's result. Always advances fulfillment_state CREATED -> SUBMITTED on
      success.
    roles: [Customer]
    code: 200
    input: []
    output: Order
    side_effects:
      - "freezes item_subtotal_cents and charged_cents"
      - "runs calculations.order_restricted_unit_exposure variant PROVISIONAL_AT_SUBMIT and writes each OrderLine.line_restricted_units"
      - "runs calculations.customer_window_units_consumed for the rolling quota check"
      - "runs calculations.delivery_permissibility_evaluation at Order.scheduled_delivery_at"
      - "writes applied_policy_ids and stamps submitted_at"

  - method: GET
    path: "/orders/{id}/compliance-evaluation"
    description: |
      Computed read that replays the order-time compliance battery against the CURRENT
      logical clock and current policy rows without mutating anything, exposing every
      intermediate the submit rule uses.
    roles: [PlatformAdmin, ComplianceOfficer, Customer]
    code: 200
    input: []
    output: { order_id: string, restriction_types: array, applied_policy_ids: array, provisional_restricted_units: number, per_type_exposure: array, window_units_consumed: number, local_delivery_minute: integer, in_delivery_window: boolean, purchaser_age_years: integer, min_age_required: integer, identity_result: enum, would_route_to: enum, first_blocking_error_id: string }
    side_effects:
      - "returns the inline object { order_id, restriction_types, applied_policy_ids, provisional_restricted_units, per_type_exposure, window_units_consumed, local_delivery_minute, in_delivery_window, purchaser_age_years, min_age_required, identity_result, would_route_to, first_blocking_error_id }"

  - method: POST
    path: "/orders/{id}/clearance"
    description: "Manual compliance decision on an order sitting in PENDING_COMPLIANCE_REVIEW."
    roles: [ComplianceOfficer]
    code: 200
    input: [decision]
    output: Order
    side_effects:
      - "moves compliance_state to COMPLIANCE_CLEARED (decision CLEAR) or COMPLIANCE_BLOCKED (decision BLOCK)"
      - "stores X-User-ID in clearance_actor_user_id and clears hold_reason on CLEAR"
      - "on BLOCK, forces fulfillment_state DISPATCHED|HELD_AT_HUB back to SUBMITTED and clears dispatched_at"

  - method: POST
    path: "/orders/{id}/dispatch"
    description: "Partner accepts the order for last-mile delivery, from SUBMITTED or HELD_AT_HUB."
    roles: [PartnerManager]
    code: 200
    input: []
    output: Order
    side_effects:
      - "advances fulfillment_state to DISPATCHED, stamps dispatched_at, clears hold_reason"
      - "rejected with ERR_PARTNER_SUSPENDED when the partner's posture == SUSPENDED"

  - method: POST
    path: "/orders/{id}/return-settlement"
    description: |
      Closes out a refused delivery: computes the restocking fee, refund and retained
      amount by the pinned waterfall, and withdraws every line so the order stops
      consuming the customer's rolling window.
    roles: [PlatformAdmin]
    code: 200
    input: [restock_confirmed]
    output: Order
    side_effects:
      - "runs calculations.refusal_return_settlement, writing restocking_fee_cents, refunded_cents and retained_cents"
      - "advances fulfillment_state RETURN_IN_TRANSIT -> RETURN_COMPLETED"
      - "sets every OrderLine.line_state to WITHDRAWN and Order.final_restricted_units to 0.00"
      - "preserves the invariant refunded_cents + retained_cents == charged_cents"

  # --- delivery partners ----------------------------------------------------
  - method: POST
    path: "/delivery-partners"
    description: "Registers a last-mile delivery partner in posture OPEN with zero risk."
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, contract_tier, license_reference]
    output: DeliveryPartner
    side_effects: ["sets license_risk_score = 0.00, lifetime_risk_score = 0.00, open_case_count = 0, posture = OPEN"]

  - method: GET
    path: "/delivery-partners/{id}"
    description: "Reads one delivery partner including both risk-score variants and the derived posture."
    roles: [PlatformAdmin, ComplianceOfficer, PartnerManager]
    code: 200
    input: []
    output: DeliveryPartner
    side_effects: []

  - method: GET
    path: "/delivery-partners"
    description: "Lists delivery partners, optionally filtered by posture or contract tier, ordered by created_at ASC."
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: ["posture?", "contract_tier?", "limit?", "offset?"]
    output: DeliveryPartner[]
    side_effects: []

  - method: GET
    path: "/delivery-partners/{id}/risk-assessment"
    description: |
      Computed read exposing BOTH variants of calculations.partner_license_risk_score side
      by side against the current logical clock, together with the per-case breakdown that
      produced them, so the ROLLING_90D / LIFETIME_WEIGHTED divergence is observable
      without mutating anything.
    roles: [PlatformAdmin, ComplianceOfficer, PartnerManager]
    code: 200
    input: []
    output: { delivery_partner_id: string, evaluated_at: datetime, contract_tier: enum, tier_multiplier: number, rolling_90d_score: number, lifetime_weighted_score: number, open_case_count: integer, open_critical_case_count: integer, posture: enum, case_breakdown: array }
    side_effects:
      - "returns the inline object { delivery_partner_id, evaluated_at, contract_tier, tier_multiplier, rolling_90d_score, lifetime_weighted_score, open_case_count, open_critical_case_count, posture, case_breakdown }"
      - "case_breakdown is an array of { violation_case_id, assessed_severity, decided_at, age_days, included_in_rolling, rolling_points, lifetime_weight, lifetime_points } ordered by decided_at ASC then created_at ASC"

  # --- couriers -------------------------------------------------------------
  - method: POST
    path: "/couriers"
    description: "Registers a courier employed by a delivery partner, starting UNCERTIFIED with compliance_score 100.00."
    roles: [PartnerManager]
    code: 201
    input: [delivery_partner_id, full_name, hired_at]
    output: Courier
    side_effects: ["sets compliance_score = 100.00, certification_state = UNCERTIFIED, dispatch_eligible = false"]

  - method: GET
    path: "/couriers/{id}"
    description: "Reads one courier including compliance_score and the derived certification gate."
    roles: [PlatformAdmin, ComplianceOfficer, PartnerManager, Courier]
    code: 200
    input: []
    output: Courier
    side_effects: []

  - method: GET
    path: "/couriers"
    description: "Lists couriers filtered by employing partner and certification state, ordered by created_at ASC."
    roles: [PlatformAdmin, ComplianceOfficer, PartnerManager]
    code: 200
    input: ["delivery_partner_id?", "certification_state?", "limit?", "offset?"]
    output: Courier[]
    side_effects: []

  # --- courier certifications ----------------------------------------------
  - method: POST
    path: "/courier-certifications"
    description: "Issues a restriction-specific certification to a courier after training."
    roles: [PartnerManager]
    code: 201
    input: [courier_id, restriction_type, training_score, training_completed_at, valid_days]
    output: CourierCertification
    side_effects:
      - "sets issued_at from the logical clock, expires_at = issued_at + valid_days days, state = ACTIVE, renewal_count = 0"
      - "re-derives Courier.certification_state and Courier.dispatch_eligible"
      - "rejected with ERR_TRAINING_SCORE_TOO_LOW when training_score < CERT_MIN_TRAINING_SCORE"

  - method: GET
    path: "/courier-certifications/{id}"
    description: "Reads one courier certification."
    roles: [PlatformAdmin, ComplianceOfficer, PartnerManager, Courier]
    code: 200
    input: []
    output: CourierCertification
    side_effects: []

  - method: GET
    path: "/couriers/{id}/certifications"
    description: "Lists a courier's certifications across every restriction type and state, ordered by created_at ASC."
    roles: [PlatformAdmin, ComplianceOfficer, PartnerManager, Courier]
    code: 200
    input: ["restriction_type?", "state?", "limit?", "offset?"]
    output: CourierCertification[]
    side_effects: []

  - method: POST
    path: "/courier-certifications/{id}/renew"
    description: |
      Reinstates an EXPIRED or SUSPENDED certification. A SUSPENDED row demands the higher
      CERT_REMEDIAL_TRAINING_SCORE bar; both demand training completed within
      TRAINING_FRESHNESS_DAYS of the logical clock.
    roles: [PartnerManager]
    code: 200
    input: [training_score, training_completed_at, valid_days]
    output: CourierCertification
    side_effects:
      - "moves state EXPIRED|SUSPENDED -> ACTIVE, re-stamps issued_at and expires_at, increments renewal_count"
      - "re-derives Courier.certification_state and Courier.dispatch_eligible"

  - method: POST
    path: "/courier-certifications/{id}/revoke"
    description: "Permanently revokes a certification and aborts the courier's open delivery attempts."
    roles: [ComplianceOfficer]
    code: 200
    input: [revocation_reason]
    output: CourierCertification
    side_effects:
      - "moves state ACTIVE|EXPIRED|SUSPENDED -> REVOKED"
      - "moves every DeliveryAttempt of this courier in state INITIATED, ID_VERIFIED or ID_REJECTED to ABORTED in DeliveryAttempt.created_at ASC order, and each such Order OUT_FOR_DELIVERY -> RETURN_IN_TRANSIT"
      - "re-derives Courier.certification_state and Courier.dispatch_eligible"

  # --- delivery attempts ----------------------------------------------------
  - method: POST
    path: "/delivery-attempts"
    description: |
      A certified courier arrives at the door. Re-evaluates jurisdiction permissibility and
      restricted hours at started_at (not at the promised time) and reserves the courier's
      half-open dwell interval.
    roles: [Courier]
    code: 201
    input: [order_id, courier_id, started_at]
    output: DeliveryAttempt
    side_effects:
      - "advances Order.fulfillment_state DISPATCHED -> OUT_FOR_DELIVERY"
      - "runs calculations.delivery_permissibility_evaluation at started_at"
      - "occupies [started_at, started_at + COURIER_ATTEMPT_DWELL_MINUTES) on the courier; a collision with another non-terminal attempt raises ERR_COURIER_SLOT_CONFLICT"

  - method: GET
    path: "/delivery-attempts/{id}"
    description: "Reads one delivery attempt including the door-side ID fields and refusal or abort reason."
    roles: [PlatformAdmin, ComplianceOfficer, PartnerManager, Courier]
    code: 200
    input: []
    output: DeliveryAttempt
    side_effects: []

  - method: GET
    path: "/delivery-attempts"
    description: "Lists delivery attempts filtered by order, courier or state, ordered by created_at ASC."
    roles: [PlatformAdmin, ComplianceOfficer, PartnerManager, Courier]
    code: 200
    input: ["order_id?", "courier_id?", "state?", "limit?", "offset?"]
    output: DeliveryAttempt[]
    side_effects: []

  - method: POST
    path: "/delivery-attempts/{id}/id-check"
    description: |
      Records the door-side identification check. Forks the attempt to ID_VERIFIED when the
      recipient is old enough and to ID_REJECTED when the document is valid and acceptable
      but the recipient is underage. Unacceptable document types, a missing mandatory scan,
      an expired document and a DOB that disagrees with the purchaser's attestation are all
      hard errors rather than branches.
    roles: [Courier]
    code: 200
    input: [document_type, document_expires_on, scan_performed, scanned_dob, recipient_name]
    output: DeliveryAttempt
    side_effects:
      - "computes recipient_age_years by calendar comparison of scanned_dob against started_at"
      - "sets state to ID_VERIFIED with id_check_compliant = true, or ID_REJECTED with id_check_compliant = false"

  - method: POST
    path: "/delivery-attempts/{id}/handover"
    description: "Completes the delivery. Requires the retention captures to already exist."
    roles: [Courier]
    code: 200
    input: [recipient_name]
    output: DeliveryAttempt
    side_effects:
      - "moves the attempt to HANDED_OVER and Order.fulfillment_state OUT_FOR_DELIVERY -> DELIVERED"
      - "runs calculations.order_restricted_unit_exposure variant FINAL_AT_HANDOVER, writing Order.final_restricted_units"
      - "stamps Order.delivered_at = DeliveryAttempt.started_at"
      - "increments Courier.compliant_handover_count when id_check_compliant is true, then recomputes calculations.courier_compliance_score"

  - method: POST
    path: "/delivery-attempts/{id}/refuse"
    description: |
      Records a mandatory refusal at the door. A compliance refusal reason launches the
      four-link cascade: attempt REFUSED -> auto ViolationCase -> partner counts and
      posture -> that partner's DISPATCHED orders are held and pushed back to
      PENDING_COMPLIANCE_REVIEW.
    roles: [Courier]
    code: 200
    input: ["refusal_reason", "observed_indicators?"]
    output: DeliveryAttempt
    side_effects:
      - "cascade link 1: attempt -> REFUSED and Order.fulfillment_state OUT_FOR_DELIVERY -> RETURN_IN_TRANSIT"
      - "cascade link 2: opens a ViolationCase with origin AUTO_REFUSAL when refusal_reason IN {UNDERAGE_RECIPIENT, ID_MISMATCH, NO_ACCEPTABLE_ID, INTOXICATED_RECIPIENT}, severity from REFUSAL_SEVERITY_MAP"
      - "cascade link 3: recomputes DeliveryPartner.open_case_count and open_critical_case_count, then runs calculations.partner_posture_derivation"
      - "cascade link 4: when the posture worsened, moves that partner's DISPATCHED orders to HELD_AT_HUB and their compliance_state PREVERIFIED|COMPLIANCE_CLEARED to PENDING_COMPLIANCE_REVIEW, in Order.created_at ASC order"
      - "recomputes Customer.refusal_strikes and may set Customer.blocked_until"

  - method: POST
    path: "/delivery-attempts/{id}/captures"
    description: "Stores a signature or photo capture against the attempt for regulatory audit retention."
    roles: [Courier]
    code: 201
    input: [kind, content_hash, captured_at]
    output: CaptureArtifact
    side_effects:
      - "computes retention_until = captured_at + CAPTURE_RETENTION_DAYS days"
      - "immutable row: CaptureArtifact carries no version field and has no update or delete endpoint"
      - "at most one capture per (delivery_attempt_id, kind); a duplicate raises ERR_DUPLICATE_CAPTURE_KIND"

  - method: GET
    path: "/delivery-attempts/{id}/captures"
    description: "Lists the retained captures of an attempt, ordered by created_at ASC."
    roles: [PlatformAdmin, ComplianceOfficer, PartnerManager, Courier]
    code: 200
    input: ["kind?", "limit?", "offset?"]
    output: CaptureArtifact[]
    side_effects: []

  # --- secret shopper testing ----------------------------------------------
  - method: POST
    path: "/secret-shopper-tests"
    description: "Schedules a secret-shopper compliance test against a courier using a decoy order."
    roles: [SecretShopperAuditor]
    code: 201
    input: [courier_id, order_id, scenario_type, scheduled_at, expected_outcome]
    output: SecretShopperTest
    side_effects: ["sets verdict = PENDING and recorded_at = null"]

  - method: GET
    path: "/secret-shopper-tests/{id}"
    description: "Reads one secret-shopper test including its verdict."
    roles: [PlatformAdmin, ComplianceOfficer, SecretShopperAuditor]
    code: 200
    input: []
    output: SecretShopperTest
    side_effects: []

  - method: GET
    path: "/secret-shopper-tests"
    description: "Lists secret-shopper tests filtered by courier, decoy order or verdict, ordered by created_at ASC."
    roles: [PlatformAdmin, ComplianceOfficer, SecretShopperAuditor]
    code: 200
    input: ["courier_id?", "order_id?", "verdict?", "limit?", "offset?"]
    output: SecretShopperTest[]
    side_effects: []

  - method: POST
    path: "/secret-shopper-tests/{id}/record-outcome"
    description: |
      Records what the courier actually did at the door. A FAIL verdict launches the
      three-link cascade: courier compliance_score drops -> ACTIVE certifications are
      suspended once it falls under CERT_SUSPENSION_SCORE_THRESHOLD -> that courier's open
      delivery attempts are aborted and their orders sent back as returns.
    roles: [SecretShopperAuditor]
    code: 200
    input: ["observed_outcome", "findings?"]
    output: SecretShopperTest
    side_effects:
      - "derives verdict as PASS or FAIL and stamps recorded_at from the logical clock"
      - "cascade link 1: recomputes calculations.courier_compliance_score for the courier under test"
      - "cascade link 2: when the recomputed score < CERT_SUSPENSION_SCORE_THRESHOLD, every ACTIVE CourierCertification of that courier moves to SUSPENDED in created_at ASC order"
      - "cascade link 3: because those certifications were suspended, every DeliveryAttempt of that courier in state INITIATED, ID_VERIFIED or ID_REJECTED moves to ABORTED and its Order moves OUT_FOR_DELIVERY -> RETURN_IN_TRANSIT"
      - "opens a ViolationCase with origin AUTO_SHOPPER_FAIL and severity MAJOR on a FAIL verdict"

  # --- violation investigation ---------------------------------------------
  - method: POST
    path: "/violation-cases"
    description: "A ComplianceOfficer opens a case manually against exactly one subject: a delivery attempt XOR a secret-shopper test."
    roles: [ComplianceOfficer]
    code: 201
    input: ["delivery_partner_id", "delivery_attempt_id?", "secret_shopper_test_id?", "severity", "summary"]
    output: ViolationCase
    side_effects:
      - "sets state = OPEN, origin = MANUAL, investigation_rounds = 0, risk_contribution = 0.00"
      - "recomputes DeliveryPartner.open_case_count and open_critical_case_count, then runs calculations.partner_posture_derivation"

  - method: GET
    path: "/violation-cases/{id}"
    description: "Reads one violation case including its risk contribution and investigation round count."
    roles: [PlatformAdmin, ComplianceOfficer, PartnerManager]
    code: 200
    input: []
    output: ViolationCase
    side_effects: []

  - method: GET
    path: "/violation-cases"
    description: "Lists violation cases filtered by partner, subject attempt, subject shopper test, state or origin, ordered by created_at ASC."
    roles: [PlatformAdmin, ComplianceOfficer, PartnerManager]
    code: 200
    input: ["delivery_partner_id?", "delivery_attempt_id?", "secret_shopper_test_id?", "state?", "origin?", "limit?", "offset?"]
    output: ViolationCase[]
    side_effects: []

  - method: POST
    path: "/violation-cases/{id}/investigate"
    description: "Opens the investigation on a case in OPEN."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ViolationCase
    side_effects: ["moves state OPEN -> UNDER_INVESTIGATION and increments investigation_rounds"]

  - method: POST
    path: "/violation-cases/{id}/request-partner-response"
    description: "Puts the case to the partner with a response deadline that must lie in the future."
    roles: [ComplianceOfficer]
    code: 200
    input: ["response_due_at", "notes?"]
    output: ViolationCase
    side_effects: ["moves state UNDER_INVESTIGATION -> PENDING_PARTNER_RESPONSE"]

  - method: POST
    path: "/violation-cases/{id}/partner-response"
    description: "The accountable partner answers, returning the case to investigation. This edge closes the first cycle."
    roles: [PartnerManager]
    code: 200
    input: [partner_response_text]
    output: ViolationCase
    side_effects: ["moves state PENDING_PARTNER_RESPONSE -> UNDER_INVESTIGATION and increments investigation_rounds"]

  - method: POST
    path: "/violation-cases/{id}/decide"
    description: |
      Substantiates or dismisses the case. A SUBSTANTIATED decision writes the case's risk
      contribution, both partner risk-score variants and may worsen the partner's posture,
      which cascades to that partner's dispatched orders.
    roles: [ComplianceOfficer]
    code: 200
    input: ["decision", "assessed_severity?", "notes?"]
    output: ViolationCase
    side_effects:
      - "moves state UNDER_INVESTIGATION -> SUBSTANTIATED or DISMISSED and stamps decided_at"
      - "on SUBSTANTIATED, stores X-User-ID in substantiated_by_user_id and writes risk_contribution"
      - "recomputes DeliveryPartner.license_risk_score (ROLLING_90D) and lifetime_risk_score (LIFETIME_WEIGHTED), open_case_count and open_critical_case_count"
      - "runs calculations.partner_posture_derivation and cascades to that partner's DISPATCHED orders"
      - "recomputes calculations.courier_compliance_score for the courier of the case's subject attempt, when the case has one"

  - method: POST
    path: "/violation-cases/{id}/reopen"
    description: |
      Reopens a decided case. This is the compensating action for the risk-points
      invariant: it withdraws the case's entire risk contribution, so a
      decide(SUBSTANTIATED) followed by reopen followed by decide(DISMISSED) must return
      DeliveryPartner.license_risk_score to the exact value it held before the first
      decision.
    roles: [ComplianceOfficer]
    code: 200
    input: [notes]
    output: ViolationCase
    side_effects:
      - "moves state SUBSTANTIATED|DISMISSED -> UNDER_INVESTIGATION, clears decided_at, assessed_severity and substantiated_by_user_id, sets risk_contribution = 0.00"
      - "increments investigation_rounds and increments ViolationCase.version by 1"
      - "recomputes both partner risk-score variants with this case excluded, then re-derives posture"
      - "sets every CorrectiveActionPlan of this case in a non-terminal state to SUPERSEDED"

  - method: POST
    path: "/violation-cases/{id}/corrective-action-plans"
    description: |
      The accountable partner files a corrective action plan against a SUBSTANTIATED case.
      OCC: the caller must supply the ViolationCase.version it last observed, because a new
      plan supersedes every earlier non-terminal plan on the case.
    roles: [PartnerManager]
    code: 201
    input: [expected_violation_case_version, remediation_items, due_at]
    output: CorrectiveActionPlan
    side_effects:
      - "sets state = SUBMITTED and revision_round = 0"
      - "sets every earlier CorrectiveActionPlan of this case in state SUBMITTED, ACCEPTED, REVISION_REQUESTED or FAILED_VERIFICATION to SUPERSEDED"
      - "increments ViolationCase.version by 1"

  - method: GET
    path: "/violation-cases/{id}/corrective-action-plans"
    description: "Lists the corrective action plans filed against a case, ordered by created_at ASC."
    roles: [PlatformAdmin, ComplianceOfficer, PartnerManager]
    code: 200
    input: ["state?", "limit?", "offset?"]
    output: CorrectiveActionPlan[]
    side_effects: []

  - method: GET
    path: "/corrective-action-plans/{id}"
    description: "Reads one corrective action plan including its revision round and verification outcome."
    roles: [PlatformAdmin, ComplianceOfficer, PartnerManager]
    code: 200
    input: []
    output: CorrectiveActionPlan
    side_effects: []

  - method: POST
    path: "/corrective-action-plans/{id}/review"
    description: |
      A ComplianceOfficer accepts the plan or sends it back for revision. Segregation of
      duties: the officer who substantiated the parent case may not review its plan.
    roles: [ComplianceOfficer]
    code: 200
    input: ["decision", "notes?"]
    output: CorrectiveActionPlan
    side_effects: ["moves state SUBMITTED -> ACCEPTED or REVISION_REQUESTED and stores X-User-ID in reviewed_by_user_id"]

  - method: POST
    path: "/corrective-action-plans/{id}/resubmit"
    description: "The partner revises a plan that was sent back or that failed verification. Bounded by MAX_REVISION_ROUNDS."
    roles: [PartnerManager]
    code: 200
    input: [remediation_items, due_at]
    output: CorrectiveActionPlan
    side_effects:
      - "moves state REVISION_REQUESTED|FAILED_VERIFICATION -> SUBMITTED and increments revision_round"
      - "rejected with ERR_REVISION_LIMIT_REACHED once revision_round has reached MAX_REVISION_ROUNDS"

  - method: POST
    path: "/corrective-action-plans/{id}/verify"
    description: |
      A ComplianceOfficer verifies remediation. PASSED closes the parent case as
      CLOSED_VERIFIED and applies the CAP_VERIFIED_CREDIT factor to its risk contribution;
      FAILED leaves the case substantiated with no credit.
    roles: [ComplianceOfficer]
    code: 200
    input: ["verification_outcome", "notes?"]
    output: CorrectiveActionPlan
    side_effects:
      - "moves state ACCEPTED -> VERIFIED or FAILED_VERIFICATION and stores X-User-ID in verified_by_user_id"
      - "on PASSED, moves the parent ViolationCase SUBSTANTIATED -> CLOSED_VERIFIED, applies CAP_VERIFIED_CREDIT and recomputes both partner risk-score variants, then re-derives posture"

# ---------------------------------------------------------------------------
# Domain-wide constants referenced by §1.2–§1.5 but not owned by any single
# calculation. Values are fixed for the whole system.
# ---------------------------------------------------------------------------

domain_constants:
  DEFAULT_LOGICAL_CLOCK_UTC: "2026-08-01T00:00:00Z"
  GLOBAL_MIN_ATTESTATION_AGE_YEARS: 18
  CUSTOMER_BLOCK_STRIKE_THRESHOLD: 3
  CUSTOMER_BLOCK_DAYS: 30
  CAPTURE_RETENTION_DAYS: 2555
  COURIER_ATTEMPT_DWELL_MINUTES: 20
  CERT_MIN_TRAINING_SCORE: 80
  CERT_REMEDIAL_TRAINING_SCORE: 90
  TRAINING_FRESHNESS_DAYS: 90
  MAX_REVISION_ROUNDS: 3
  REFUSAL_SEVERITY_MAP:
    UNDERAGE_RECIPIENT: CRITICAL
    ID_MISMATCH: MAJOR
    NO_ACCEPTABLE_ID: MINOR
    INTOXICATED_RECIPIENT: MAJOR

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog  (60 codes)
# ---------------------------------------------------------------------------

errors:
  # -- authentication / authorization ---------------------------------------
  - id: ERR_MISSING_AUTH_HEADER
    http: 401
    condition: "`X-User-ID` or `X-User-Role` header absent or empty"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the caller's role is not listed in the endpoint's `roles:`"
  - id: ERR_FORBIDDEN_RESOURCE_SCOPE
    http: 403
    condition: "an entity-backed caller addresses a resource owned by a different Customer, DeliveryPartner or Courier"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the ComplianceOfficer reviewing or verifying a corrective action plan is the same user who substantiated the parent violation case"

  # -- existence -------------------------------------------------------------
  - id: ERR_JURISDICTION_NOT_FOUND
    http: 404
    condition: "no Jurisdiction row for the supplied id"
  - id: ERR_POLICY_NOT_FOUND
    http: 404
    condition: "no RestrictionPolicy row for the supplied id"
  - id: ERR_PRODUCT_NOT_FOUND
    http: 404
    condition: "no Product row for the supplied id"
  - id: ERR_CUSTOMER_NOT_FOUND
    http: 404
    condition: "no Customer row for the supplied id"
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "no Order row for the supplied id"
  - id: ERR_ORDER_LINE_NOT_FOUND
    http: 404
    condition: "no OrderLine row for the supplied id"
  - id: ERR_PARTNER_NOT_FOUND
    http: 404
    condition: "no DeliveryPartner row for the supplied id"
  - id: ERR_COURIER_NOT_FOUND
    http: 404
    condition: "no Courier row for the supplied id"
  - id: ERR_CERTIFICATION_NOT_FOUND
    http: 404
    condition: "no CourierCertification row for the supplied id"
  - id: ERR_ATTEMPT_NOT_FOUND
    http: 404
    condition: "no DeliveryAttempt row for the supplied id"
  - id: ERR_SHOPPER_TEST_NOT_FOUND
    http: 404
    condition: "no SecretShopperTest row for the supplied id"
  - id: ERR_CASE_NOT_FOUND
    http: 404
    condition: "no ViolationCase row for the supplied id"
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "no CorrectiveActionPlan row for the supplied id"

  # -- request shape / semantics --------------------------------------------
  - id: ERR_VALIDATION
    http: 400
    condition: "missing required field, wrong JSON type, unknown enum member, numeric range violation, unparseable date, or `limit`/`offset` outside the declared bounds"
  - id: ERR_INCONSISTENT_FIELDS
    http: 422
    condition: "cross-field contradiction inside one body: effective_to < effective_from, delivery_window_end_minute == delivery_window_start_minute, duplicate `source_type` in source_signals, or a corrective-action due_at that is not in the future"

  # -- optimistic concurrency (§1.2.1) --------------------------------------
  - id: ERR_STALE_CUSTOMER_VERSION
    http: 412
    condition: "`expected_customer_version` does not equal the Customer row's current `version` on POST /customers/{id}/identity-checks"
  - id: ERR_STALE_CASE_VERSION
    http: 412
    condition: "`expected_violation_case_version` does not equal the ViolationCase row's current `version` on POST /violation-cases/{id}/corrective-action-plans"

  # -- state preconditions ---------------------------------------------------
  - id: ERR_INVALID_ORDER_STATE
    http: 409
    condition: "the requested order transition does not exist from the order's current (compliance_state, fulfillment_state) pair"
  - id: ERR_INVALID_ATTEMPT_STATE
    http: 409
    condition: "the requested delivery-attempt transition does not exist from the attempt's current state"
  - id: ERR_INVALID_CASE_STATE
    http: 409
    condition: "the requested violation-case transition does not exist from the case's current state"
  - id: ERR_INVALID_PLAN_STATE
    http: 409
    condition: "the requested corrective-action-plan transition does not exist from the plan's current state"
  - id: ERR_INVALID_CERTIFICATION_STATE
    http: 409
    condition: "renewal attempted on a certification that is ACTIVE or REVOKED, or revocation attempted on a certification that is already REVOKED"
  - id: ERR_ORDER_HAS_NO_LINES
    http: 409
    condition: "submit attempted on an order with zero OrderLine rows"
  - id: ERR_CLOCK_REWIND
    http: 409
    condition: "`current_utc` is earlier than the logical clock's current value"

  # -- policy resolution -----------------------------------------------------
  - id: ERR_NO_EFFECTIVE_POLICY
    http: 422
    condition: "no RestrictionPolicy exists for some (delivery jurisdiction, restriction_type) pair whose closed effective period contains the local date of the evaluation instant"

  # -- jurisdiction safety ---------------------------------------------------
  - id: ERR_DELIVERY_PROHIBITED_IN_JURISDICTION
    http: 422
    condition: "the selected policy's permissibility is PROHIBITED"
  - id: ERR_DRY_JURISDICTION_PROHIBITED
    http: 422
    condition: "an ALCOHOL restriction type is delivered into a jurisdiction whose dry_status is DRY"
  - id: ERR_PERMIT_REQUIRED
    http: 422
    condition: "the delivery jurisdiction's dry_status is DAMP but the selected policy's permissibility is not PERMIT_REQUIRED"

  # -- partner / courier authority ------------------------------------------
  - id: ERR_PARTNER_SUSPENDED
    http: 422
    condition: "the delivery partner's derived posture is SUSPENDED at dispatch, attempt creation or manual clearance"
  - id: ERR_COURIER_PARTNER_MISMATCH
    http: 422
    condition: "the courier's delivery_partner_id differs from the order's delivery_partner_id"
  - id: ERR_COURIER_NOT_CERTIFIED
    http: 422
    condition: "the courier's derived certification_state is not CERTIFIED at attempt creation"
  - id: ERR_CERTIFICATION_MISSING_FOR_RESTRICTION
    http: 422
    condition: "the courier holds no ACTIVE CourierCertification for some restriction type present on the order at the door-side ID check"
  - id: ERR_TRAINING_SCORE_TOO_LOW
    http: 422
    condition: "training_score is below CERT_MIN_TRAINING_SCORE at issuance, or below CERT_REMEDIAL_TRAINING_SCORE when reinstating a SUSPENDED certification"

  # -- door-side identification ---------------------------------------------
  - id: ERR_DOCUMENT_TYPE_NOT_ACCEPTABLE
    http: 422
    condition: "the presented document_type is not a member of every selected policy's acceptable_document_types, including the empty-array case where no document is acceptable"
  - id: ERR_SCAN_REQUIRED
    http: 422
    condition: "a selected policy has requires_scan true but scan_performed is false"
  - id: ERR_DOCUMENT_EXPIRED
    http: 422
    condition: "document_expires_on is earlier than the local date of the attempt's started_at"
  - id: ERR_RECIPIENT_IDENTITY_MISMATCH
    http: 422
    condition: "scanned_dob does not equal the purchaser's attested_dob"
  - id: ERR_REFUSAL_REASON_NOT_ALLOWED
    http: 422
    condition: "refusal_reason is not in the set permitted from the attempt's current state (for example UNDERAGE_RECIPIENT from ID_VERIFIED, where age was already confirmed)"

  # -- purchaser eligibility -------------------------------------------------
  - id: ERR_ATTESTATION_REQUIRED
    http: 422
    condition: "the customer's attestation_state is NOT_ATTESTED or ATTESTATION_REJECTED when a restricted order is submitted"
  - id: ERR_CUSTOMER_DELIVERY_BLOCKED
    http: 422
    condition: "the customer's blocked_until is later than the logical clock now"
  - id: ERR_IDENTITY_PREVERIFICATION_REQUIRED
    http: 422
    condition: "the customer has no IdentityCheck with status VALID when a restricted order is submitted"
  - id: ERR_PURCHASER_UNDERAGE
    http: 422
    condition: "the completed age of the newest VALID IdentityCheck's verified_dob at the local delivery date is below the strictest min_age_years among the selected policies"

  # -- evidence retention ----------------------------------------------------
  - id: ERR_CAPTURE_INCOMPLETE
    http: 422
    condition: "handover attempted without a SIGNATURE capture, without a PHOTO_HANDOFF capture, or without a PHOTO_ID capture when a selected policy requires scanning"

  # -- temporal --------------------------------------------------------------
  - id: ERR_OUTSIDE_RESTRICTED_HOURS
    http: 422
    condition: "the local delivery minute of the evaluation instant lies outside the selected policy's half-open delivery window"
  - id: ERR_SCHEDULED_TIME_IN_PAST
    http: 422
    condition: "Order.scheduled_delivery_at is not later than the logical clock now at submit time"
  - id: ERR_RESPONSE_DUE_NOT_FUTURE
    http: 422
    condition: "`response_due_at` is not later than the logical clock now"
  - id: ERR_TRAINING_STALE
    http: 422
    condition: "training_completed_at is more than TRAINING_FRESHNESS_DAYS days before the logical clock now"

  # -- interval occupation ---------------------------------------------------
  - id: ERR_COURIER_SLOT_CONFLICT
    http: 409
    condition: "the new attempt's half-open [started_at, started_at + COURIER_ATTEMPT_DWELL_MINUTES) interval intersects a non-terminal attempt of the same courier; exact adjacency does not conflict"
  - id: ERR_POLICY_PERIOD_OVERLAP
    http: 409
    condition: "a new RestrictionPolicy's closed [effective_from, effective_to] date interval shares at least one calendar date with an existing policy for the same (jurisdiction_id, restriction_type); touching endpoints do conflict"

  # -- structural constraints ------------------------------------------------
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "a uniqueness-constrained identifier is reused: Jurisdiction.code, Product.sku, DeliveryPartner.license_reference, Customer.email or CaptureArtifact.content_hash"
  - id: ERR_DUPLICATE_CAPTURE_KIND
    http: 409
    condition: "a second CaptureArtifact of the same kind is stored against one delivery attempt"
  - id: ERR_CASE_SUBJECT_INVALID
    http: 409
    condition: "a violation case supplies neither or both of delivery_attempt_id and secret_shopper_test_id"
  - id: ERR_REVISION_LIMIT_REACHED
    http: 409
    condition: "resubmission attempted when revision_round has already reached MAX_REVISION_ROUNDS"
  - id: ERR_RESTOCK_NOT_CONFIRMED
    http: 422
    condition: "return settlement requested with restock_confirmed false"

  # -- quantity ceilings -----------------------------------------------------
  - id: ERR_ORDER_UNIT_LIMIT_EXCEEDED
    http: 422
    condition: "the order's PROVISIONAL_AT_SUBMIT restricted-unit exposure for a restriction type exceeds that policy's max_units_per_order"
  - id: ERR_WINDOW_UNIT_LIMIT_EXCEEDED
    http: 422
    condition: "provisional exposure plus the customer's already-consumed rolling-window units exceeds the policy's max_units_per_window"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------

roles:
  - name: PlatformAdmin
    description: "Platform operator who seeds regulatory reference data, registers customers and partners, drives the logical clock and settles returns."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /jurisdictions"
      - "POST /restriction-policies"
      - "POST /products"
      - "POST /customers"
      - "POST /delivery-partners"
      - "POST /orders/{id}/return-settlement"
    shared_operations:
      - "POST /customers/{id}/identity-checks (shared with ComplianceOfficer)"
      - "every GET read endpoint"

  - name: Customer
    description: "The purchaser and recipient of record. Attests their own age, builds and submits their own orders."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /customers/{id}/age-attestation"
      - "POST /orders"
      - "POST /orders/{id}/lines"
      - "POST /orders/{id}/submit"
    shared_operations:
      - "GET /customers/{id}, GET /orders, GET /orders/{id}, GET /order-lines, GET /order-lines/{id}, GET /orders/{id}/compliance-evaluation, GET /products, GET /products/{id}"
    note: "X-User-ID must equal the Customer.id being addressed and the customer_id of any order touched, else ERR_FORBIDDEN_RESOURCE_SCOPE."

  - name: PartnerManager
    description: "Operator at a delivery partner. Manages couriers and their certifications, accepts orders for dispatch, answers violation cases and files corrective action plans."
    identity: "entity_backed:DeliveryPartner"
    exclusive_operations:
      - "POST /couriers"
      - "POST /courier-certifications"
      - "POST /courier-certifications/{id}/renew"
      - "POST /orders/{id}/dispatch"
      - "POST /violation-cases/{id}/partner-response"
      - "POST /violation-cases/{id}/corrective-action-plans"
      - "POST /corrective-action-plans/{id}/resubmit"
    shared_operations:
      - "GET /delivery-partners/{id}, GET /delivery-partners/{id}/risk-assessment, GET /couriers, GET /couriers/{id}, GET /couriers/{id}/certifications, GET /courier-certifications/{id}, GET /orders, GET /orders/{id}, GET /delivery-attempts, GET /delivery-attempts/{id}, GET /delivery-attempts/{id}/captures, GET /violation-cases, GET /violation-cases/{id}, GET /violation-cases/{id}/corrective-action-plans, GET /corrective-action-plans/{id}, GET /jurisdictions, GET /jurisdictions/{id}, GET /jurisdictions/{id}/restriction-policies, GET /restriction-policies/{id}"
    note: "X-User-ID must equal the DeliveryPartner.id that owns the addressed courier, certification, order or case, else ERR_FORBIDDEN_RESOURCE_SCOPE."

  - name: Courier
    description: "The person at the door. Opens delivery attempts, records the identification check, captures signature and photo evidence, and completes or refuses the handover."
    identity: "entity_backed:Courier"
    exclusive_operations:
      - "POST /delivery-attempts"
      - "POST /delivery-attempts/{id}/id-check"
      - "POST /delivery-attempts/{id}/handover"
      - "POST /delivery-attempts/{id}/refuse"
      - "POST /delivery-attempts/{id}/captures"
    shared_operations:
      - "GET /orders/{id}, GET /couriers/{id}, GET /couriers/{id}/certifications, GET /courier-certifications/{id}, GET /delivery-attempts, GET /delivery-attempts/{id}, GET /delivery-attempts/{id}/captures"
    note: "X-User-ID must equal the Courier.id named by the attempt's courier_id, else ERR_FORBIDDEN_RESOURCE_SCOPE."

  - name: ComplianceOfficer
    description: "Regulatory reviewer. Clears or blocks flagged orders, revokes certifications, runs violation investigations, and signs off corrective action plans filed by partners."
    identity: opaque
    exclusive_operations:
      - "POST /orders/{id}/clearance"
      - "POST /courier-certifications/{id}/revoke"
      - "POST /violation-cases"
      - "POST /violation-cases/{id}/investigate"
      - "POST /violation-cases/{id}/request-partner-response"
      - "POST /violation-cases/{id}/decide"
      - "POST /violation-cases/{id}/reopen"
      - "POST /corrective-action-plans/{id}/review"
      - "POST /corrective-action-plans/{id}/verify"
    shared_operations:
      - "POST /customers/{id}/identity-checks (shared with PlatformAdmin)"
      - "every GET read endpoint"
    note: "Segregation of duties: the X-User-ID that substantiated a case is barred from that case's plan review and verification, even though the role is permitted."

  - name: SecretShopperAuditor
    description: "Independent auditor who stages and records secret-shopper compliance tests against couriers."
    identity: opaque
    exclusive_operations:
      - "POST /secret-shopper-tests"
      - "POST /secret-shopper-tests/{id}/record-outcome"
    shared_operations:
      - "GET /secret-shopper-tests, GET /secret-shopper-tests/{id}, GET /couriers/{id}, GET /orders/{id}"
