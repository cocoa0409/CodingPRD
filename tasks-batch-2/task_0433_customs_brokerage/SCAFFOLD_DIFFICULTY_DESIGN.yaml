          assert:
            - "CustomsEntry.${entry_id}.total_duties_owed_cents == 69735"
            - "Bond.${bond_id}.outstanding_liability_cents == 69735"

      - name: psc_grant_keeps_statement_total_equal_to_sum_of_entry_owed
        grounds:
          - state_machines.PostSummaryCorrection.SUBMITTED_to_GRANTED
          - entities.MonthlyStatement.fields.statement_total_cents
          - entities.CustomsEntry.fields.total_duties_owed_cents
        distinguishing_aspect: |
          Conserved quantity #2 (different from bond liability) — statement.statement_total_cents MUST
          equal the sum of total_duties_owed_cents over its RELEASED/LIQUIDATED entries after a granted
          PSC. Liquidated entry owed 54800 sits on the statement; granting a +200000 delta PSC adds
          10000, so both the entry owed total and the statement total must become 64800 with no drift.
        test_recipe:
          setup:
            - "A LIQUIDATED general entry (owed 54800) on the 2026-06 statement; a SUBMITTED PSC delta +200000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
