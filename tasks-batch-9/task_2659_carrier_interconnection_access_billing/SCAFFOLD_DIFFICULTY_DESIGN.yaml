  - name: measurement_cascade_trunk_group_to_order_to_agreement_posture
    grounds:
    - state_machines.TrunkGroup.NONE_to_AUGMENT_ORDERED
    - calculations.trunk_sizing_and_blocking
    - entities.TrunkAugmentOrder.fields.triggering_measurement_id
    - entities.TrunkGroup.fields.open_augment_order_count
    - entities.InterconnectionAgreement.fields.capacity_posture
    distinguishing_aspect: |
      Depth-3 cascade triggered by traffic-measurement ingest: the measurement moves TrunkGroup.augment_status to AUGMENT_ORDERED; because augment_status moved, a PENDING TrunkAugmentOrder is created and open_augment_order_count increments; because a PENDING order now exists, the parent agreement's poi_augment_pending_count increments and capacity_posture is recomputed to CONSTRAINED. The triggering transition is trunk-group measurement ingest, not the factor-audit transition used by this rule's depth-4 cascade.
    test_recipe:
      setup:
      - An EFFECTIVE agreement with poi_facility_capacity_trunks 192 and capacity_posture NORMAL.
      - One IN_SERVICE TWO_WAY trunk group at DLLSTXCTDS0 with 48 provisioned trunks, forecast 1200.00 CCS, augment_status NONE.
      - Logical clock at the 2026-08-01T00:00:00Z default.
      setup_api_calls:
      - call: POST /interconnection/carriers
        payload:
          carrier_name: Northstar Telecom LLC
          ocn: '9241'
          carrier_type: ILEC
        as: PlatformAdmin
        captures:
          car_id: $.data.id
          car_v0: $.data.version
