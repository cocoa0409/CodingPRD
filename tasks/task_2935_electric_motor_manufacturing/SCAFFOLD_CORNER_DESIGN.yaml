      - name: path_existence_is_reported_before_body_foreign_keys_but_after_role_and_schema
        claim_type: priority_ordering
        grounds:
          - validations[priority=2]
          - validations[priority=10]
          - validations[priority=20]
          - validations[priority=22]
          - errors[ERR_UNAUTHORIZED]
          - errors[ERR_INVALID_REQUEST]
          - errors[ERR_SUBASSEMBLY_NOT_FOUND]
          - errors[ERR_OVEN_NOT_FOUND]
          - errors[ERR_WORK_ORDER_NOT_FOUND]
        distinguishing_aspect: |
          The impregnate endpoint carries a path id AND a body foreign key, so one call can violate
          two existence rules at once. With both ids unknown the answer must name the path resource
          (priority 20), never the oven (priority 22); with only the oven unknown it must name the
          oven; and the same doubly-unknown call returns the role error under a forbidden role and
          the schema error under an inverted window, showing that priorities 2 and 10 both precede
          any existence lookup.
        test_recipe:
          setup:
            - "Work order WO1 in build_status RELEASED with StatorBuild SB1 in WOUND, plus curing oven OVEN-A."
            - "The id 00000000-0000-4000-8000-000000000000 belongs to no row of any collection."
