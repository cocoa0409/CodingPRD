            - call: "POST /statements/${s1_id}/finalize"
              payload: { expected_contract_version: "${cv1}" }
              as: Publisher
              captures: { sub_income: $.data.subsidiary_income_cents }
          assert:
            - "SubsidiaryRight.${r_void_id}.status == VOID"
            - "SubsidiaryRight.${r_keep_id}.status == STATEMENTED"
            - "SubsidiaryRight.${r_keep_id}.statement_id == ${s1_id}"
            - "AuthorStatement.${s1_id}.subsidiary_income_cents == 400000"

  # ===================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===================================================================
  - rule_id: transitive_cascade
    instances:
      - name: finalize_cascades_reserve_liquidation_then_author_credit_depth3
        grounds:
          - state_machines.AuthorStatement.DRAFT_to_FINALIZED
          - state_machines.ReturnsReserve.HELD_to_LIQUIDATED
          - entities.ReturnsReserve.fields.released_cents
          - entities.AuthorStatement.fields.reserve_released_cents
          - entities.Contract.fields.unrecouped_advance_cents
        distinguishing_aspect: |
          Depth-3 chain from the statement-finalize trigger: (1) Statement S3 DRAFT->FINALIZED mutates the statement;
          (2) that finalize flips reserve R1 HELD->LIQUIDATED setting released_cents=281250 (link caused by hop 1);
          (3) R1's release in turn credits S3.reserve_released_cents=281250 which feeds period_earnings and thus
          debits Contract.unrecouped_advance_cents (link caused by hop 2) — each hop is caused by the previous one.
        test_recipe:
          setup:
            - "Same contract/period build as royalty_provisional_vs_final: reserve R1 (held 468750, eligible_seq 3) from S1; advance=2000000 already fully recouped at S1; P2(400 ret) and P3(200 ret) posted."
            - "Statement S3 for period seq3 is in DRAFT, period CLOSED."
          setup_api_calls:
            - call: "POST /authors"
              payload: { full_name: "A Seven", email: "a7@x.com" }
              as: Publisher
              captures: { author_id: $.data.id }
            - call: "POST /contracts"
              payload: { author_id: "${author_id}", advance_cents: 1000000, reserve_pct: 0.25, reserve_hold_periods: 2 }
