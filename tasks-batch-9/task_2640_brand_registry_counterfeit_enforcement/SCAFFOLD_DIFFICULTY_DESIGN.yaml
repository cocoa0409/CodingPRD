        distinguishing_aspect: |
          A single request violates a state rule (priority 20, category state) and a
          fiscal rule (priority 80, category business_fiscal); the response is
          ERR_INVALID_STATE / 409 and never ERR_TEST_BUY_BUDGET_EXCEEDED / 402, and
          the same payload against a DRAFT claim proves the fiscal rule really would
          have fired.
