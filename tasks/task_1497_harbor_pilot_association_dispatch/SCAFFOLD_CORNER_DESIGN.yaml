        as: AssociationAdmin
      - call: POST /pilotage/vessel-orders
        payload:
          vessel_name: MV Own
          gt: 8000
          draft_dm: 90
          order_type: ARRIVAL
          eta: '2026-08-10T00:00:00Z'
        as: VesselAgent
        as_user_id: agent-1
        captures:
          o1_id: $.data.id
          o_v: $.data.version
      trigger:
      - call: PATCH /pilotage/vessel-orders/${o1_id}
        payload:
          eta: '2026-08-12T00:00:00Z'
          expected_order_version: ${o_v}
        as: VesselAgent
        as_user_id: agent-2
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_FORBIDDEN (ownership beats OCC)
      - VesselOrder(o1_id).version remains 1
  - name: order_create_eta_equal_or_past_returns_422
    claim_type: violation_to_error
    grounds:
    - validations[priority=18]
    - errors[ERR_ETA_IN_PAST]
    distinguishing_aspect: 'ETA must be strictly after the clock: eta == 2026-08-01T00:00:00Z (exactly now) and eta in the past both fail ERR_ETA_IN_PAST.'
    test_recipe:
