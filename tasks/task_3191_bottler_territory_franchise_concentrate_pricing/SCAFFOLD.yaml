    path: "/bottler/bottler-agreements/{id}/activate"
    description: "Activate a DRAFT agreement; enforces mandatory product line obligations"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: BottlerAgreement
    side_effects: ["Territory.status -> FRANCHISED when previously OPEN", "rejects second concurrent ACTIVE agreement in same territory (ERR_TERRITORY_HAS_ACTIVE_AGREEMENT)"]
  - method: POST
    path: "/bottler/bottler-agreements/{id}/suspend"
    description: "Suspend an ACTIVE agreement"
    roles: [BrandOwnerAdmin]
