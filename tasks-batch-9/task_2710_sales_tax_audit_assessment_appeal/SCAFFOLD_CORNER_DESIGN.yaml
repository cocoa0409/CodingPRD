              payload: { project_name: "Grocery 2026 strict", industry_naics_code: "445110", industry_error_rate_bp: 4200, selection_mode: "THRESHOLD", selection_threshold_score: 400, selection_quota: 5 }
              as: SelectionAnalyst
              captures: { proj_strict: "$.data.id" }
            - call: "POST /industry-projects"
              payload: { project_name: "Grocery 2026 open", industry_naics_code: "445110", industry_error_rate_bp: 4200, selection_mode: "THRESHOLD", selection_threshold_score: 200, selection_quota: 5 }
              as: SelectionAnalyst
              captures: { proj_open: "$.data.id" }
          trigger:
            - call: "POST /industry-projects/${proj_strict}/selection-runs"
              payload: {}
              as: SelectionAnalyst
            - call: "GET /audit-leads"
              payload: { industry_project_id: "${proj_strict}", limit: 10, offset: 0 }
              as: SelectionAnalyst
            - call: "POST /industry-projects/${proj_open}/selection-runs"
              payload: {}
              as: SelectionAnalyst
            - call: "GET /audit-leads"
              payload: { industry_project_id: "${proj_open}", limit: 10, offset: 0 }
              as: SelectionAnalyst
          assert:
            - "trigger call 1: response.status == 422 and response.data.error_id == ERR_NO_ELIGIBLE_CANDIDATES"
            - "trigger call 2: total_count == 0 (the failed run left no leads at all)"
            - "IndustryProject.${proj_strict}.scored_lead_count == 0 and selections_used == 0 and last_run_at is null"
            - "trigger call 3: response.status == 200"
            - "trigger call 4: total_count == 2; the lead for ${harbor_id} has risk_score 314, score_variant FULL, rank_position 1, status SELECTED; the lead for ${summit_id} has risk_score 172, rank_position 2, status NOT_SELECTED"
            - "IndustryProject.${proj_open}.scored_lead_count == 2, selections_used == 1, selections_remaining == 4, last_cutoff_score == 314"

