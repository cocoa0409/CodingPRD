          - state_machines.LeaseFleetCar.HELD_to_ASSIGNED
        distinguishing_aspect: "A placement naming a lessee that is not the lessee of the referenced contract is rejected with ERR_LESSEE_MISMATCH and HTTP 409, while the byte-identical payload naming the contract's own lessee is accepted with HTTP 201 and status ACTIVE."
        test_recipe:
          setup:
            - "Empty DB; logical clock pinned to 2026-09-01T00:00:00Z."
            - "Car type LM-100 (BOXCAR, build_hours 1, regulatory_life_years 15, line_count_family LM_LINE) with one WS-LM-1 WHEELSET bill-of-material row at qty_per_car 1 and on_hand_qty 100."
            - "A RETAINED order of quantity 1 (planned_shop_days 1, order_date 2026-09-01, required_delivery_date 2026-09-20) is reserved, released, changed over on LM-L1 for [2026-09-02, 2026-09-03) and completed on 2026-09-03, producing one HELD car."
            - "Two lessees exist with ample credit: \"Contract Holder Rail Co\" (the contract's lessee) and \"Other Lessee Rail Co\"; ACTIVE NET contract LM-C1 (per_diem_rate_cents 2000, liability_bearer LESSEE, term 2026-09-01..2027-09-01, fleet_car_cap 10) belongs to the first."
            - "Both calls under test use the identical window 2026-09-05..2026-10-05 and mileage_allowance 1000, differing only in lessee_id, so priority 22 is the sole discriminator."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/car-types"
              payload: { model_code: "LM-100", car_class: "BOXCAR", build_hours: 1, regulatory_life_years: 15, line_count_family: "LM_LINE" }
              as: ProductionPlanner
              captures: { ct_id: $.data.id }
            - call: "POST /api/v1/components"
              payload: { part_number: "WS-LM-1", component_class: "WHEELSET", unit_cost_cents: 1000, lead_time_days: 5, on_hand_qty: 100 }
              as: SupplyChainCoordinator
              captures: { ws_id: $.data.id }
            - call: "POST /api/v1/car-type-component-requirements"
              payload: { car_type_id: "${ct_id}", component_id: "${ws_id}", qty_per_car: 1 }
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders"
              payload: { car_type_id: "${ct_id}", quantity: 1, planned_shop_days: 1, disposition: "RETAINED", priority_rank: 1, order_date: "2026-09-01", required_delivery_date: "2026-09-20" }
              as: ProductionPlanner
              captures: { po_id: $.data.id }
            - call: "POST /api/v1/production-orders/${po_id}/reserve-components"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${po_id}/release"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/v1/production-lines/LM-L1/changeover"
              payload: { production_order_id: "${po_id}", scheduled_start_date: "2026-09-02", scheduled_end_date: "2026-09-03" }
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${po_id}/complete"
              payload: { completed_qty: 1, completion_date: "2026-09-03" }
              as: ProductionPlanner
            - call: "GET /api/v1/lease-fleet-cars?production_order_id=${po_id}"
              payload: {}
              as: LeaseAdministrator
              captures: { car_id: "$.data[0].id" }
            - call: "POST /api/v1/lessees"
              payload: { legal_name: "Contract Holder Rail Co", credit_tier: "A", utilization_threshold_pct: 50, credit_ceiling_cents: 100000000 }
              as: LeaseAdministrator
              captures: { lessee_x: $.data.id }
            - call: "POST /api/v1/lessees"
              payload: { legal_name: "Other Lessee Rail Co", credit_tier: "B", utilization_threshold_pct: 50, credit_ceiling_cents: 100000000 }
              as: LeaseAdministrator
              captures: { lessee_y: $.data.id }
            - call: "POST /api/v1/lease-contracts"
              payload: { lessee_id: "${lessee_x}", lease_type: "NET", per_diem_rate_cents: 2000, liability_bearer: "LESSEE", term_start_date: "2026-09-01", term_end_date: "2027-09-01", fleet_car_cap: 10 }
              as: LeaseAdministrator
              captures: { lc_id: $.data.id, lc_lessee: $.data.lessee_id }
            - call: "POST /api/v1/lease-contracts/${lc_id}/activate"
              payload: {}
              as: LeaseAdministrator
          trigger:
            - call: "POST /api/v1/car-assignments"
              payload: { lease_fleet_car_id: "${car_id}", lease_contract_id: "${lc_id}", lessee_id: "${lessee_y}", start_date: "2026-09-05", end_date: "2026-10-05", mileage_allowance: 1000 }
              as: LeaseAdministrator
              captures: { err_lessee: $.data.error_id }
            - call: "POST /api/v1/car-assignments"
              payload: { lease_fleet_car_id: "${car_id}", lease_contract_id: "${lc_id}", lessee_id: "${lessee_x}", start_date: "2026-09-05", end_date: "2026-10-05", mileage_allowance: 1000 }
              as: LeaseAdministrator
              captures: { ok_asg_id: $.data.id, ok_asg_status: $.data.status, ok_asg_rate: $.data.per_diem_rate_cents }
            - call: "GET /api/v1/lease-fleet-cars/${car_id}"
              payload: {}
              as: PlatformAdmin
              captures: { car_status_after: $.data.status, car_contract_after: $.data.lease_contract_id }
          assert:
            - "LeaseContract ${lc_id}.lessee_id == ${lc_lessee} == ${lessee_x}, the contract's own lessee"
            - "The mismatched placement returns HTTP 409 with data.error_id == ${err_lessee} == \"ERR_LESSEE_MISMATCH\""
            - "The comparison is on the body's lessee_id: ${lessee_y} != the contract's lessee ${lessee_x}"
            - "The identical payload naming ${lessee_x} is accepted with HTTP 201, id ${ok_asg_id}, data.status == ${ok_asg_status} == \"ACTIVE\" and per_diem_rate_cents snapshotted as ${ok_asg_rate} == 2000"
            - "The accepted placement moved the car: LeaseFleetCar ${car_id}.status == ${car_status_after} == \"ASSIGNED\" and lease_contract_id == ${car_contract_after} == ${lc_id}"
            - "The rejected call wrote nothing: the accepted placement is the car's first, so no phantom placement blocked it"

      - name: validation_p23_unsettled_returns_already_asserted_by_difficulty_design
        claim_type: Violation → Error
        grounds:
          - validations[priority=23]
          - errors[ERR_UNSETTLED_RETURNS]
          - state_machines.LeaseFleetCar.UNDER_REPAIR_to_HELD
          - entities.CarReturn.fields.settlement_status
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / settle_returns_gated_on_car_return_settlement
          rationale: "Asserted as the failure path of the named §1.8 instance: its first trigger POST /api/v1/lease-fleet-cars/{id}/settle-returns returns HTTP 409 with data.error_id == \"ERR_UNSETTLED_RETURNS\" (captured as ${err_blocked}) while the car is already UNDER_REPAIR and its CarReturn is still PENDING, and the same instance proves the gate opens once POST /api/v1/car-returns/{id}/settle sets settlement_status SETTLED, after which the identical call returns HTTP 200 with status HELD."

      - name: validation_p24_car_type_not_covered_by_retrofit_program_returns_capacity_exceeded
        claim_type: Violation → Error
        grounds:
          - validations[priority=24]
          - errors[ERR_CAPACITY_EXCEEDED]
          - entities.RetrofitProgramCarType.fields.car_type_id
          - entities.LeaseFleetCar.fields.car_type_id
          - state_machines.LeaseFleetCar.HELD_to_UNDER_REPAIR
        distinguishing_aspect: "A retrofit work order naming a program that covers only car type A, for a car of car type B, is rejected with ERR_CAPACITY_EXCEEDED and HTTP 409, while the identical call against a car of the covered type A is accepted with HTTP 201 and status SCHEDULED."
        test_recipe:
          setup:
            - "Empty DB; logical clock pinned to 2026-09-01T00:00:00Z."
            - "Two car types: R24-A-100 (BOXCAR, build_hours 1, regulatory_life_years 15, line_count_family R24_A_LINE) and R24-B-100 (TANK, build_hours 1, regulatory_life_years 15, line_count_family R24_B_LINE), each with one WS-R24-1 WHEELSET bill-of-material row at qty_per_car 1 and on_hand_qty 100."
            - "A RETAINED order of quantity 1 is reserved, released, changed over and completed on 2026-09-03 for each car type, producing one HELD car per type (regulatory_life_end_date 2041-09-03 clears priority 8)."
            - "Retrofit program R24-MAND-1 (required_shop_days_per_car 2, compliance_deadline_date 2027-01-01, no required component) stays PLANNED and is linked to car type R24-A-100 only through a RetrofitProgramCarType row, so car type R24-B-100 is uncovered."
            - "Both work-order calls use a 2-day window inside the deadline on distinct shop lines, so priority 9 and priority 10 pass and priority 24 is the only live check."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/car-types"
              payload: { model_code: "R24-A-100", car_class: "BOXCAR", build_hours: 1, regulatory_life_years: 15, line_count_family: "R24_A_LINE" }
              as: ProductionPlanner
              captures: { ct_a: $.data.id }
            - call: "POST /api/v1/car-types"
              payload: { model_code: "R24-B-100", car_class: "TANK", build_hours: 1, regulatory_life_years: 15, line_count_family: "R24_B_LINE" }
              as: ProductionPlanner
              captures: { ct_b: $.data.id }
            - call: "POST /api/v1/components"
              payload: { part_number: "WS-R24-1", component_class: "WHEELSET", unit_cost_cents: 1000, lead_time_days: 5, on_hand_qty: 100 }
              as: SupplyChainCoordinator
              captures: { ws_id: $.data.id }
            - call: "POST /api/v1/car-type-component-requirements"
              payload: { car_type_id: "${ct_a}", component_id: "${ws_id}", qty_per_car: 1 }
              as: ProductionPlanner
            - call: "POST /api/v1/car-type-component-requirements"
              payload: { car_type_id: "${ct_b}", component_id: "${ws_id}", qty_per_car: 1 }
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders"
              payload: { car_type_id: "${ct_a}", quantity: 1, planned_shop_days: 1, disposition: "RETAINED", priority_rank: 1, order_date: "2026-09-01", required_delivery_date: "2026-09-20" }
              as: ProductionPlanner
              captures: { po_a: $.data.id }
            - call: "POST /api/v1/production-orders/${po_a}/reserve-components"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${po_a}/release"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/v1/production-lines/R24-A-L1/changeover"
              payload: { production_order_id: "${po_a}", scheduled_start_date: "2026-09-02", scheduled_end_date: "2026-09-03" }
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${po_a}/complete"
              payload: { completed_qty: 1, completion_date: "2026-09-03" }
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders"
              payload: { car_type_id: "${ct_b}", quantity: 1, planned_shop_days: 1, disposition: "RETAINED", priority_rank: 1, order_date: "2026-09-01", required_delivery_date: "2026-09-20" }
              as: ProductionPlanner
              captures: { po_b: $.data.id }
            - call: "POST /api/v1/production-orders/${po_b}/reserve-components"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${po_b}/release"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/v1/production-lines/R24-B-L1/changeover"
              payload: { production_order_id: "${po_b}", scheduled_start_date: "2026-09-02", scheduled_end_date: "2026-09-03" }
              as: ProductionPlanner
            - call: "POST /api/v1/production-orders/${po_b}/complete"
              payload: { completed_qty: 1, completion_date: "2026-09-03" }
              as: ProductionPlanner
            - call: "GET /api/v1/lease-fleet-cars?production_order_id=${po_a}"
              payload: {}
              as: LeaseAdministrator
              captures: { car_a: "$.data[0].id", car_a_type: "$.data[0].car_type_id" }
            - call: "GET /api/v1/lease-fleet-cars?production_order_id=${po_b}"
              payload: {}
              as: LeaseAdministrator
              captures: { car_b: "$.data[0].id", car_b_type: "$.data[0].car_type_id" }
            - call: "POST /api/v1/retrofit-programs"
              payload: { mandate_code: "R24-MAND-1", description: "Coverage-scoped retrofit mandate", compliance_deadline_date: "2027-01-01", required_shop_days_per_car: 2 }
              as: RegulatoryRetrofitist
              captures: { prog_id: $.data.id, prog_status: $.data.status }
            - call: "POST /api/v1/retrofit-program-car-types"
              payload: { retrofit_program_id: "${prog_id}", car_type_id: "${ct_a}" }
              as: RegulatoryRetrofitist
          trigger:
            - call: "POST /api/v1/retrofit-work-orders"
              payload: { retrofit_program_id: "${prog_id}", lease_fleet_car_id: "${car_b}", shop_line: "R24-SHOP-1", scheduled_start_date: "2026-10-01", scheduled_end_date: "2026-10-03", component_qty_consumed: 1 }
              as: ProductionPlanner
