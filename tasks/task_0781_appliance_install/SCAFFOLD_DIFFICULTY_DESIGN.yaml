# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules x 2 instances = 18 instances. Every grounds ref resolves into SCAFFOLD.yaml §1.1-§1.7.
# Clock default before any /_clock/set_current_utc call: 2026-03-01T00:00:00Z.
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: workorder_quoted_vs_final_price_diverge
        grounds:
          - calculations.work_order_quoted_price
          - calculations.work_order_final_price
          - entities.WorkOrder.fields.quoted_price_cents
          - entities.WorkOrder.fields.final_price_cents
          - state_machines.WorkOrder.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: "On the WorkOrder pricing domain: the provisional quote (19500) omits bundle discount, parts and zone surcharge, while the final price (27550) includes all three, so the two variants disagree for identical add-on selection."
        test_recipe:
          setup:
            - "One approved TV_MOUNT pro in zone SF; retailer commission 1000bps."
            - "Rich work order: base 12000, 3 add-ons (3000+2500+2000), 2 parts (1500x2@2000bps, 800x1@5000bps), after-hours window 20:00-21:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T21:30:00Z" }
              as: PlatformAdmin
            - call: "POST /retailers"
              payload: { name: "BestBuy SF", commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { ret_id: $.data.id }
            - call: "POST /service-zones"
              payload: { zone_code: "SF-94103", name: "SF Central", max_concurrent_appointments: 5, coverage_active: true }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Ada C", email: "ada@x.com", phone: "555", address_line: "1 Main" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /pros"
              payload: { full_name: "Pat Pro", email: "pat@x.com", service_zone_id: "${zone_id}", skills: ["TV_MOUNT"] }
              as: PlatformAdmin
              captures: { pro_id: $.data.id }
            - call: "POST /pros/${pro_id}/applications"
              payload: { background_check_ref: "BG-1" }
              as: PlatformAdmin
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: PlatformAdmin
            - call: "POST /install-tasks"
              payload: { task_code: "TV_MOUNT_STD", name: "Standard TV Mount", category: "TV_MOUNT", required_skill: "TV_MOUNT", base_price_cents: 12000, estimated_minutes: 60, warranty_days: 30 }
              as: PlatformAdmin
              captures: { task_id: $.data.id }
            - call: "POST /add-ons"
              payload: { addon_code: "CABLE_CONCEAL", name: "Cable Conceal", category: "TV_MOUNT", price_cents: 3000 }
              as: PlatformAdmin
              captures: { a1_id: $.data.id }
            - call: "POST /add-ons"
              payload: { addon_code: "SOUNDBAR", name: "Soundbar Mount", category: "TV_MOUNT", price_cents: 2500 }
              as: PlatformAdmin
              captures: { a2_id: $.data.id }
            - call: "POST /add-ons"
              payload: { addon_code: "SURGE", name: "Surge Protector", category: "TV_MOUNT", price_cents: 2000 }
              as: PlatformAdmin
              captures: { a3_id: $.data.id }
            - call: "POST /work-orders"
              payload: { retailer_id: "${ret_id}", customer_id: "${cust_id}", install_task_id: "${task_id}", service_zone_id: "${zone_id}", product_sku: "TV-55", product_category: "TV_MOUNT", scope_notes: "mount + conceal" }
              as: Retailer
              as_user_id: "${ret_id}"
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { scheduled_start: "2026-03-05T20:00:00Z", scheduled_end: "2026-03-05T21:00:00Z", selected_addon_ids: ["${a1_id}", "${a2_id}", "${a3_id}"] }
              as: Retailer
              as_user_id: "${ret_id}"
              captures: { wo_v: $.data.version, quoted: $.data.quoted_price_cents }
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: { expected_work_order_version: "${wo_v}" }
              as: PlatformAdmin
            - call: "GET /assignments?work_order_id=${wo_id}"
              payload: {}
              as: PlatformAdmin
              captures: { asg_id: "$.data[0].id" }
            - call: "POST /assignments/${asg_id}/accept"
              payload: {}
              as: Pro
              as_user_id: "${pro_id}"
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: Pro
              as_user_id: "${pro_id}"
            - call: "POST /work-orders/${wo_id}/parts"
              payload: { name: "Bracket", unit_cost_cents: 1500, quantity: 2, markup_bps: 2000 }
              as: Pro
              as_user_id: "${pro_id}"
            - call: "POST /work-orders/${wo_id}/parts"
              payload: { name: "HDMI", unit_cost_cents: 800, quantity: 1, markup_bps: 5000 }
              as: Pro
              as_user_id: "${pro_id}"
          trigger:
            - call: "POST /work-orders/${wo_id}/complete"
              payload: {}
              as: Pro
              as_user_id: "${pro_id}"
              captures: { final: $.data.final_price_cents }
          assert:
            - "WorkOrder.${wo_id}.quoted_price_cents == 19500"
            - "WorkOrder.${wo_id}.final_price_cents == 27550"
            - "WorkOrder.${wo_id}.final_price_cents != WorkOrder.${wo_id}.quoted_price_cents"

      - name: pro_payout_provisional_vs_final_diverge
        grounds:
          - calculations.pro_payout
          - entities.PayoutRecord.fields.payout_cents
          - state_machines.PayoutRecord.PENDING_to_RELEASED
          - state_machines.WorkOrder.COMPLETED_to_CLOSED
        distinguishing_aspect: "On the Pro-payout domain (distinct from WorkOrder pricing): provisional payout is 9000, but the final RELEASED payout after one redo is 9000 - 3000 = 6000, so the redo penalty makes the two variants diverge."
        test_recipe:
          setup:
            - "Simple WO base 12000, no add-ons, no parts, std-hours 09:00-10:00Z; approved pro; completed then one warranty redo then completed again; warranty elapsed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T09:30:00Z" }
              as: PlatformAdmin
            - call: "POST /retailers"
              payload: { name: "R", commission_rate_bps: 1000 }
              as: PlatformAdmin
              captures: { ret_id: $.data.id }
            - call: "POST /service-zones"
              payload: { zone_code: "SF-1", name: "Z", max_concurrent_appointments: 5, coverage_active: true }
              as: PlatformAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "C", email: "c@x.com", phone: "5", address_line: "1" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /pros"
              payload: { full_name: "P", email: "p@x.com", service_zone_id: "${zone_id}", skills: ["TV_MOUNT"] }
              as: PlatformAdmin
              captures: { pro_id: $.data.id }
            - call: "POST /pros/${pro_id}/applications"
              payload: { background_check_ref: "BG" }
              as: PlatformAdmin
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: PlatformAdmin
            - call: "POST /install-tasks"
              payload: { task_code: "T", name: "T", category: "TV_MOUNT", required_skill: "TV_MOUNT", base_price_cents: 12000, estimated_minutes: 60, warranty_days: 30 }
              as: PlatformAdmin
              captures: { task_id: $.data.id }
            - call: "POST /work-orders"
              payload: { retailer_id: "${ret_id}", customer_id: "${cust_id}", install_task_id: "${task_id}", service_zone_id: "${zone_id}", product_sku: "S", product_category: "TV_MOUNT" }
              as: Retailer
              as_user_id: "${ret_id}"
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { scheduled_start: "2026-03-05T09:00:00Z", scheduled_end: "2026-03-05T10:00:00Z" }
              as: Retailer
              as_user_id: "${ret_id}"
              captures: { wo_v: $.data.version }
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: { expected_work_order_version: "${wo_v}" }
              as: PlatformAdmin
            - call: "GET /assignments?work_order_id=${wo_id}"
              payload: {}
              as: PlatformAdmin
              captures: { asg_id: "$.data[0].id" }
            - call: "POST /assignments/${asg_id}/accept"
              payload: {}
              as: Pro
              as_user_id: "${pro_id}"
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: Pro
              as_user_id: "${pro_id}"
            - call: "POST /work-orders/${wo_id}/complete"
              payload: {}
              as: Pro
              as_user_id: "${pro_id}"
              captures: { pv: $.data.final_price_cents }
            - call: "POST /work-orders/${wo_id}/request-redo"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { wo_v2: $.data.version }
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: { expected_work_order_version: "${wo_v2}" }
              as: PlatformAdmin
            - call: "GET /assignments?work_order_id=${wo_id}"
              payload: {}
              as: PlatformAdmin
              captures: { asg2_id: "$.data[1].id" }
            - call: "POST /assignments/${asg2_id}/accept"
              payload: {}
              as: Pro
              as_user_id: "${pro_id}"
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: Pro
              as_user_id: "${pro_id}"
            - call: "POST /work-orders/${wo_id}/complete"
              payload: {}
              as: Pro
              as_user_id: "${pro_id}"
            - call: "GET /payout-records?work_order_id=${wo_id}"
              payload: {}
              as: PlatformAdmin
              captures: { payout_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-06T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /work-orders/${wo_id}/close"
              payload: {}
              as: PlatformAdmin
          assert:
            - "PayoutRecord.${payout_id}.status == RELEASED"
            - "PayoutRecord.${payout_id}.payout_cents == 6000"
            - "Provisional payout at first completion was 9000; final RELEASED payout 6000 differs by REDO_PENALTY_CENTS(3000) * redo_count(1)"

  - rule_id: combinatorial_formula
    instances:
