            - call: "GET /qa-cert/submission-packages/${pkg}"
              as: Any
              captures: { strict: $.data.readiness_strict_pct }
          assert:
            - "item TRC-PS-02 status == WAIVED with waiver_status == APPROVED"
            - "checklist waived_count == 1 and failed_count == 0"
            - "package readiness_strict_pct == 25.00 (1 of 4 items pass-equivalent)"

  # ========================================================== calculations ====
  - section: calculations
    instances:
      - name: sla_breach_strictly_greater_boundary
        claim_type: correct_result
        grounds:
          - calculations.bug_triage_sla_breach
        distinguishing_aspect: "BLOCKER triage SLA is 24h with a STRICTLY-greater comparison: an ops run at exactly created_at + 24h does not breach; one second later does. Both legs are asserted on the same bug."
        test_recipe:
          setup:
            - "Clock 2026-08-03T00:00:00Z; title T; build IN_TEST; BLOCKER bug created (created_at == 2026-08-03T00:00:00Z)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /qa-cert/titles"
              payload: { title_code: "CL-SLA", name: "Cl Sla", platform_codes: ["PS5"], target_launch_date: "2026-11-01", cert_budget_total_cents: 1000 }
              as: ReleaseManager
              captures: { tid: $.data.id }
            - call: "POST /qa-cert/builds"
              payload: { title_id: "${tid}", platform_code: "PS5", version_string: "1.0.0" }
              as: QALead
              captures: { bid: $.data.id }
            - { call: "POST /qa-cert/builds/${bid}/transition", payload: { to_status: "IN_TEST" }, as: QALead }
            - call: "POST /qa-cert/bugs"
              payload: { title_id: "${tid}", build_id: "${bid}", severity: "BLOCKER", category: "PERFORMANCE" }
              as: QALead
              captures: { bug: $.data.id }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /qa-cert/ops/run", payload: {}, as: PlatformAdmin }
            - call: "GET /qa-cert/bugs/${bug}"
              as: Any
              captures: { br1: $.data.sla_breached }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:01Z" }, as: PlatformAdmin }
            - { call: "POST /qa-cert/ops/run", payload: {}, as: PlatformAdmin }
            - call: "GET /qa-cert/bugs/${bug}"
              as: Any
              captures: { br2: $.data.sla_breached }
          assert:
            - "at exactly created_at + 24h: sla_breached == false (strictly-greater comparison, not >=)"
            - "at created_at + 24h + 1s: sla_breached == true"

      - name: age_rating_bundle_tier_thresholds
        claim_type: constants_applied
        grounds:
          - calculations.age_rating_filing_fee
        distinguishing_aspect: "The 10% bundle discount engages at exactly 2 other active (FILED/GRANTED) filings: ESRB files at 40000 (0 others), PEGI at 25000 (1 other — no discount), CERO at 16200 (2 others — round_half_up(18000 x 0.9))."
        test_recipe:
          setup: ["Title T, budget 1000000"]
          setup_api_calls:
            - call: "POST /qa-cert/titles"
              payload: { title_code: "CL-BND", name: "Cl Bnd", platform_codes: ["PS5"], target_launch_date: "2026-11-01", cert_budget_total_cents: 1000000 }
              as: ReleaseManager
              captures: { tid: $.data.id }
            - call: "POST /qa-cert/age-rating-filings"
              payload: { title_id: "${tid}", territory: "ESRB", content_descriptors: ["VIOLENCE"] }
              as: ReleaseManager
              captures: { f1: $.data.id }
            - call: "POST /qa-cert/age-rating-filings"
              payload: { title_id: "${tid}", territory: "PEGI", content_descriptors: ["VIOLENCE"] }
              as: ReleaseManager
              captures: { f2: $.data.id }
            - call: "POST /qa-cert/age-rating-filings"
              payload: { title_id: "${tid}", territory: "CERO", content_descriptors: ["VIOLENCE"] }
              as: ReleaseManager
              captures: { f3: $.data.id }
          trigger:
            - call: "POST /qa-cert/age-rating-filings/${f1}/transition"
              payload: { to_status: "FILED" }
              as: ReleaseManager
              captures: { fee1: $.data.fee_cents }
            - call: "POST /qa-cert/age-rating-filings/${f2}/transition"
              payload: { to_status: "FILED" }
              as: ReleaseManager
              captures: { fee2: $.data.fee_cents }
            - call: "POST /qa-cert/age-rating-filings/${f3}/transition"
              payload: { to_status: "FILED" }
              as: ReleaseManager
              captures: { fee3: $.data.fee_cents }
          assert:
            - "ESRB fee_cents == 40000 (no other active filings)"
            - "PEGI fee_cents == 25000 (1 other active — below BUNDLE_MIN_OTHER_FILINGS = 2)"
            - "CERO fee_cents == 16200 (2 others active — 10% discount on 18000)"

      - name: lock_coverage_threshold_boundary
        claim_type: precision
        grounds:
          - calculations.entry_coverage
          - "state_machines.LocalizationPack.LQA_to_LOCKED"
          - "errors[ERR_COVERAGE_BELOW_LOCK_THRESHOLD]"
        distinguishing_aspect: "LOCK gates at >= 98.00 text and >= 95.00 audio coverage with 2dp rounding: pack A at exactly 98.00/95.00 locks; pack B at 97.00 fails. The >= boundary (not >) is the pinned behavior."
        test_recipe:
          setup: ["Title T; pack A (text 100, audio 200); pack B (text 100, audio 0)"]
          setup_api_calls:
            - call: "POST /qa-cert/titles"
              payload: { title_code: "CL-COV", name: "Cl Cov", platform_codes: ["PS5"], target_launch_date: "2026-11-01", cert_budget_total_cents: 1000 }
              as: ReleaseManager
              captures: { tid: $.data.id }
            - call: "POST /qa-cert/localization-packs"
              payload: { title_id: "${tid}", locale: "fr-FR", is_required: true, text_asset_total: 100, audio_asset_total: 200 }
              as: ReleaseManager
              captures: { pa: $.data.id }
            - call: "POST /qa-cert/localization-packs"
              payload: { title_id: "${tid}", locale: "de-DE", is_required: false, text_asset_total: 100, audio_asset_total: 0 }
              as: ReleaseManager
              captures: { pb: $.data.id }
            - { call: "POST /qa-cert/localization-packs/${pa}/transition", payload: { axis: "TRANSLATION", to_status: "TRANSLATING", translated_text_assets: 98, translated_audio_assets: 190 }, as: ReleaseManager }
            - { call: "POST /qa-cert/localization-packs/${pa}/transition", payload: { axis: "TRANSLATION", to_status: "LQA" }, as: ReleaseManager }
            - { call: "POST /qa-cert/localization-packs/${pb}/transition", payload: { axis: "TRANSLATION", to_status: "TRANSLATING", translated_text_assets: 97, translated_audio_assets: 0 }, as: ReleaseManager }
            - { call: "POST /qa-cert/localization-packs/${pb}/transition", payload: { axis: "TRANSLATION", to_status: "LQA" }, as: ReleaseManager }
          trigger:
            - call: "POST /qa-cert/localization-packs/${pa}/transition"
              payload: { axis: "TRANSLATION", to_status: "LOCKED" }
              as: ReleaseManager
              captures: { sta: $.data.translation_status }
            - call: "POST /qa-cert/localization-packs/${pb}/transition"
              payload: { axis: "TRANSLATION", to_status: "LOCKED" }
              as: ReleaseManager
              captures: { err: $.data.error_id }
          assert:
            - "pack A (98.00 text / 95.00 audio): translation_status == LOCKED (equality passes)"
            - "pack B (97.00 text): error_id == ERR_COVERAGE_BELOW_LOCK_THRESHOLD, http 409"
            - "pack B audio total 0 yields audio_coverage_pct 100.00 and does not interfere"

