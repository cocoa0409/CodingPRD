  - section: validations
    instances:

      - name: duplicate_institution_ipeds_code_is_rejected
        claim_type: violation_to_error
        grounds: [validations.priority_10_uniqueness_institution_code, errors.ERR_DUPLICATE_IPEDS_CODE, 'endpoints."POST /nil/collectives"']
        distinguishing_aspect: "institution_ipeds_code is unique across the whole platform, not per home_state_code, so a second collective reusing the code must be refused even with a different name and state."
        test_recipe:
          setup: ["One collective already registered with institution_ipeds_code 023100."]
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Ipeds First", institution_name: "Ipeds Institution", institution_ipeds_code: "023100", home_state_code: "TX", association_ruleset: "NCAA_2024" }
              as: PlatformAdmin
              captures: { col_first: $.data.id }
          trigger:
            - call: "POST /nil/collectives"
              payload: { name: "Ipeds Second", institution_name: "Other Institution", institution_ipeds_code: "023100", home_state_code: "OH", association_ruleset: "NAIA" }
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_DUPLICATE_IPEDS_CODE"
            - "The response status is 409."
            - "GET /nil/collectives returns exactly one collective, so no second row was created."
            - "A third request with institution_ipeds_code 023101 and everything else identical to the rejected one succeeds with 201."

      - name: tier_rank_dues_inversion_is_rejected_on_open
        claim_type: violation_to_error
        grounds: [validations.priority_34_tier_rank_dues_monotonic, errors.ERR_TIER_RANK_DUES_INVERSION, state_machines.sm_membership_tier_status]
        distinguishing_aspect: "The monotonic dues check runs at OPEN time and compares only against tiers that are already OPEN, so a DRAFT tier with inverted dues can be created without error and is caught only when it is opened."
        test_recipe:
          setup:
            - "One collective with an OPEN tier at benefit_rank 1 and annual_dues_cents 100000."
            - "A second tier at benefit_rank 2 with annual_dues_cents 50000, created successfully and left in DRAFT."
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Monotonic Collective", institution_name: "Monotonic Institution", institution_ipeds_code: "023200", home_state_code: "CA", association_ruleset: "NCAA_2026" }
              as: PlatformAdmin
              captures: { col_id: $.data.id }
            - call: "POST /nil/collectives/${col_id}/membership-tiers"
              payload: { tier_code: "T1", tier_name: "Mono Base", annual_dues_cents: 100000, benefit_rank: 1 }
              as: CollectiveDirector
              captures: { tier_low: $.data.id }
            - call: "POST /nil/membership-tiers/${tier_low}/transitions"
              payload: { action: "OPEN" }
              as: CollectiveDirector
            - call: "POST /nil/collectives/${col_id}/membership-tiers"
              payload: { tier_code: "T2", tier_name: "Mono Inverted", annual_dues_cents: 50000, benefit_rank: 2 }
              as: CollectiveDirector
              captures: { tier_bad: $.data.id, tier_bad_status: $.data.tier_status }
          trigger:
            - call: "POST /nil/membership-tiers/${tier_bad}/transitions"
              payload: { action: "OPEN" }
              as: CollectiveDirector
              captures: { err_id: $.data.error_id }
          assert:
            - "${tier_bad_status} == DRAFT"
            - "Creating the inverted tier returned 201, so the check is not applied at creation time."
            - "${err_id} == ERR_TIER_RANK_DUES_INVERSION"
            - "The response status is 422."
            - "MembershipTier.${tier_bad}.tier_status == DRAFT"
            - "A tier at benefit_rank 2 with annual_dues_cents 150000 opens successfully, proving the rule permits the strictly increasing case."

      - name: submission_without_evidence_fails_then_passes_with_one_record
        claim_type: satisfaction_to_pass
        grounds: [validations.priority_31_evidence_minimum_documentation, global_constants.MIN_EVIDENCE_RECORDS, 'endpoints."POST /nil/deliverables/{id}/submissions"']
        distinguishing_aspect: "MIN_EVIDENCE_RECORDS is 1, so the same submission body must fail at evidence_count 0 and succeed at evidence_count 1 with no other change; the failing attempt must not increment submission_count."
        test_recipe:
          setup:
            - "One collective, one ENROLLED athlete, one ACTIVE contract worth 100000 with disclosure ACCEPTED, funded by a settled contribution of gross 200000 (net 194970)."
            - "One APPEARANCE deliverable worth 100000 with no evidence records yet."
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Evidence Collective", institution_name: "Evidence Institution", institution_ipeds_code: "023300", home_state_code: "OH", association_ruleset: "NCAA_2024" }
              as: PlatformAdmin
              captures: { col_id: $.data.id }
            - call: "POST /nil/collectives/${col_id}/membership-tiers"
              payload: { tier_code: "T2", tier_name: "Evid Club", annual_dues_cents: 60000, benefit_rank: 2 }
              as: CollectiveDirector
              captures: { tier_id: $.data.id }
            - call: "POST /nil/membership-tiers/${tier_id}/transitions"
              payload: { action: "OPEN" }
              as: CollectiveDirector
            - call: "POST /nil/donor-members"
              payload: { collective_id: "${col_id}", membership_tier_id: "${tier_id}", display_name: "Evid Donor", email: "evid@example.com" }
              as: CollectiveDirector
              captures: { donor_id: $.data.id }
            - call: "POST /nil/contributions"
              payload: { donor_member_id: "${donor_id}", gross_amount_cents: 200000, source_kind: "ONE_TIME_GIFT", designation: "UNRESTRICTED", processor_outcome: "APPROVE" }
              as: TreasuryOfficer
              captures: { contrib_id: $.data.id }
            - call: "POST /nil/athletes"
              payload: { collective_id: "${col_id}", full_name: "Evid Athlete", portal_user_id: "ath-evid", sport: "SOFTBALL", class_year: 2028 }
              as: CollectiveDirector
              captures: { ath_id: $.data.id }
            - call: "POST /nil/deal-contracts"
              payload: { collective_id: "${col_id}", athlete_id: "${ath_id}", total_value_cents: 100000, effective_start_at: "2026-08-01T00:00:00Z", effective_end_at: "2026-12-31T00:00:00Z", funding_designation: "UNRESTRICTED" }
              as: CollectiveDirector
              captures: { dc_id: $.data.id }
            - call: "POST /nil/deal-contracts/${dc_id}/compliance-submissions"
              payload: { state_law_citation: "OH-3345.56", association_rule_citation: "NCAA-2024-12.5" }
              as: CollectiveDirector
            - call: "POST /nil/deal-contracts/${dc_id}/compliance-decisions"
              payload: { decision: "ACCEPT" }
              as: InstitutionReviewer
            - call: "POST /nil/deal-contracts/${dc_id}/activation"
              payload: {}
              as: CollectiveDirector
            - call: "POST /nil/deal-contracts/${dc_id}/deliverables"
              payload: { deliverable_kind: "APPEARANCE", unit_value_cents: 100000, due_at: "2026-09-01T00:00:00Z" }
              as: CollectiveDirector
              captures: { del_id: $.data.id, evidence_before: $.data.evidence_count }
          trigger:
            - call: "POST /nil/deliverables/${del_id}/submissions"
              payload: { performed_at: "2026-08-05T00:00:00Z" }
              as: CollectiveDirector
              captures: { err_id: $.data.error_id }
            - call: "POST /nil/deliverables/${del_id}/evidence"
              payload: { evidence_kind: "SIGNED_ATTENDANCE_SHEET", reference_label: "evid-sheet-1" }
              as: CollectiveDirector
              captures: { evidence_after: $.data.evidence_count }
            - call: "POST /nil/deliverables/${del_id}/submissions"
              payload: { performed_at: "2026-08-05T00:00:00Z" }
              as: CollectiveDirector
              captures: { status_after: $.data.status, submission_count_after: $.data.submission_count }
          assert:
            - "${evidence_before} == 0"
            - "${err_id} == ERR_EVIDENCE_INSUFFICIENT"
            - "The rejected submission returned 422 and left Deliverable.${del_id}.submission_count at 0 and status PENDING."
            - "${evidence_after} == 1"
            - "${status_after} == SUBMITTED"
            - "${submission_count_after} == 1"
            - "Deliverable.${del_id}.late_flag == false"

      - name: charity_hours_shortfall_applies_only_to_charity_work_deliverables
        claim_type: conditional_validation
        grounds: [validations.priority_32_charity_hours_documented, entities.Deliverable.fields.required_charity_hours_tenths, entities.Deliverable.fields.charity_hours_tenths]
        distinguishing_aspect: "Priority 32 is conditional on deliverable_kind: a SOCIAL_POST submitted with no charity hours passes, while a CHARITY_WORK deliverable requiring 40 tenths fails at 39 tenths and passes at exactly 40, so the comparison is inclusive and kind-gated."
        test_recipe:
