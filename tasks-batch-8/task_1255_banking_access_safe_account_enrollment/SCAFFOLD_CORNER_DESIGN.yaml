            - { call: "POST /api/outreach-campaigns", payload: { name: "One Cent Over", zip_cluster: "90001", window_start: "2026-08-01", window_end: "2026-09-01", budget_cents: 1, per_conversion_cents: 1000 }, as: CoalitionAdmin, captures: { err: $.data.error_id } }
          assert:
            - "Second campaign created (cluster sum 500000 <= 500000, equality allowed)"
            - "Third fails with error_id == ERR_CAMPAIGN_BUDGET_EXCEEDED (500001 > 500000)"

