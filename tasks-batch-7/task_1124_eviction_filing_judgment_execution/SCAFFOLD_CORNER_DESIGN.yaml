      - call: POST /api/cases/${c}/notices
        payload:
          notice_type: PAY_OR_QUIT
          served_on: '2026-05-02'
          claimed_rent_owed_cents: 100000
          expected_case_version: ${cv}
        as: Landlord
        as_user_id: ${ll}
      - call: POST /api/_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-06T00:00:01Z'
        as: PlatformAdmin
      - call: POST /api/ops/runs
        payload: {}
        as: CourtClerk
      - call: POST /api/cases/${c}/filing-packages
        payload:
          claimed_amount_cents: 100000
          defendant_names:
          - Dee A
          jury_demanded: false
          efiled: false
        as: Landlord
        as_user_id: ${ll}
        captures:
          p1: $.data.id
      - call: POST /api/filing-packages/${p1}/fee-payments
        payload:
          amount_cents: 27250
        as: Landlord
        as_user_id: ${ll}
      trigger:
      - call: POST /api/filing-packages/${p1}/review
        payload:
          decision: REJECT
          rejection_reason: wrong caption
        as: CourtClerk
        as_user_id: clerk-a
        captures:
          p1_st: $.data.status
      - call: POST /api/cases/${c}/filing-packages
        payload:
          claimed_amount_cents: 100000
          defendant_names:
          - Dee A
          jury_demanded: false
          efiled: false
        as: Landlord
        as_user_id: ${ll}
        captures:
          p2: $.data.id
      - call: POST /api/filing-packages/${p2}/fee-payments
        payload:
          amount_cents: 27250
        as: Landlord
        as_user_id: ${ll}
      - call: POST /api/filing-packages/${p2}/review
        payload:
          decision: ACCEPT
        as: CourtClerk
        as_user_id: clerk-a
        captures:
          p2_st: $.data.status
      - call: GET /api/cases/${c}
        payload: {}
        as: CourtClerk
        captures:
          c_st: $.data.status
      assert:
      - p1_st == REJECTED
      - p2_st == ACCEPTED
      - c_st == FILED (refile cycle completed)
  - name: dismiss_after_judgment_rejected
    claim_type: invalid_transition
