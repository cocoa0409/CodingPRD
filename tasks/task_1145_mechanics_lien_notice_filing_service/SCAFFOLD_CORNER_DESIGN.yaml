  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_span_create_stale_version
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[span-create-stale-project]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Project.version: a second span create replaying the pre-first-create version is rejected 412 ERR_STALE_VERSION, while the correctly-versioned create succeeded and bumped the version."
        test_recipe:
          setup: ["CA project at version 1 (just created); client has observed version 1"]
          setup_api_calls:
            - { call: "POST /lien/companies", payload: { name: "OC1 Co", contact_email: "o1@x.com" }, as: PlatformAdmin, captures: { comp_id: $.data.id } }
            - { call: "POST /lien/projects", payload: { name: "OC1 Job", state_code: "CA", county: "Kern", project_type: "COMMERCIAL_PRIVATE", property_legal_description: "Lot 70", contract_value_cents: 100, approved_extras_cents: 0, retainage_held_cents: 0 }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { proj_id: $.data.id, pv0: $.data.version } }
          trigger:
            - { call: "POST /lien/furnishing-spans", payload: { project_id: "${proj_id}", span_kind: "BASE_CONTRACT", start_date: "2026-05-02", end_date: "2026-06-10", expected_project_version: "${pv0}" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { sp1: $.data.id } }
            - { call: "POST /lien/furnishing-spans", payload: { project_id: "${proj_id}", span_kind: "CHANGE_ORDER", start_date: "2026-06-11", end_date: "2026-06-20", expected_project_version: "${pv0}" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { err: $.data.error_id } }
            - { call: "GET /lien/projects/${proj_id}", payload: {}, as: OpsAgent, captures: { pv_now: $.data.version } }
          assert:
            - "First create succeeds with expected_project_version == ${pv0}"
            - "Second create replaying ${pv0} returns ERR_STALE_VERSION (412): the first create bumped Project.version"
            - "Project.${proj_id}.version == ${pv0} + 1 (exactly one mutation applied)"

      - name: occ_balance_adjust_stale_version
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[balance-adjust-stale-company]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Company.version: two sequential balance adjustments against the same observed version — the first succeeds (balance 5000, version 2), the second with the stale version returns 412."
        test_recipe:
          setup: ["Company at version 1, balance 0"]
          setup_api_calls:
            - { call: "POST /lien/companies", payload: { name: "OC2 Co", contact_email: "o2@x.com" }, as: PlatformAdmin, captures: { comp_id: $.data.id, cv0: $.data.version } }
          trigger:
            - { call: "POST /lien/companies/${comp_id}/balance-adjustments", payload: { amount_cents: 5000, reason: "load", expected_company_version: "${cv0}" }, as: PlatformAdmin, captures: { bal1: $.data.prepaid_balance_cents, v1: $.data.version } }
            - { call: "POST /lien/companies/${comp_id}/balance-adjustments", payload: { amount_cents: 5000, reason: "load2", expected_company_version: "${cv0}" }, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "First adjustment: prepaid_balance_cents == 5000 and version == 2"
            - "Second adjustment replaying the observed version returns ERR_STALE_VERSION (412); balance remains 5000"

      - name: clock_default_fixed_at_startup
        claim_type: scheduled_actions
        grounds: [endpoints, state_machines.NoticeOrder.DRAFT_to_EXPIRED]
        distinguishing_aspect: "With no set_current_utc call, the logical clock reads exactly 2026-05-01T00:00:00Z: a DRAFT notice with deadline 2026-05-22 is still DRAFT when read, regardless of real wall-clock time."
