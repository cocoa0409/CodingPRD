            - "vR2 completes against the already-VERIFIED event: billing_status == BILLABLE_CONFIRMED immediately at completion (no separate verify needed)"
            - "DRAFT invoice reconciles: subtotal_cents == 90000 (two SERVICE lines) — live recompute, no regeneration call"

      - name: observation_out_of_window_rejected_and_late_observation_inert
        claim_type: input_set_filtering
        grounds:
          - calculations.verified_accumulation_inches
          - validations[priority=19]
        distinguishing_aspect: "Event-sourcing input-set rules: an observation with observed_at outside [window_start, window_end+6h] is rejected outright (ERR_OBSERVATION_OUT_OF_WINDOW); an in-window observation posted AFTER verification does not alter the frozen verified value while the event stays VERIFIED."
        test_recipe:
          setup: ["Event eO verified at 2.1 from NOAA+DTN; no challenge"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T07:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /storm-events", payload: { region_code: "NE", window_start: "2026-12-10T00:00:00Z", window_end: "2026-12-10T08:00:00Z", reported_accumulation_inches: 2.0, reported_source_name: "NOAA" }, as: OpsDispatcher, captures: { eO: $.data.id } }
            - { call: "POST /observations", payload: { storm_event_id: "${eO}", source_name: "NOAA", observed_at: "2026-12-10T07:30:00Z", accumulation_inches: 2.0 }, as: PlatformAdmin }
            - { call: "POST /observations", payload: { storm_event_id: "${eO}", source_name: "DTN", observed_at: "2026-12-10T08:00:00Z", accumulation_inches: 2.1 }, as: PlatformAdmin }
            - { call: "POST /storm-events/${eO}/verify", as: OpsDispatcher, captures: { ver1: $.data.verified_accumulation_inches } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-11T09:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /observations", payload: { storm_event_id: "${eO}", source_name: "NOAA", observed_at: "2026-12-10T20:00:00Z", accumulation_inches: 9.9 }, as: PlatformAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /observations", payload: { storm_event_id: "${eO}", source_name: "ON_SITE_SENSOR", observed_at: "2026-12-10T08:30:00Z", accumulation_inches: 0.5 }, as: PlatformAdmin }
            - { call: "GET /storm-events/${eO}", as: OpsDispatcher, captures: { ver2: $.data.verified_accumulation_inches, st2: $.data.status } }
          assert:
            - "Out-of-window observation (20:00 > 08:00+6h=14:00): error_id == ERR_OBSERVATION_OUT_OF_WINDOW"
            - "Late-arriving in-window observation is accepted (append-only log) but the VERIFIED event is inert: verified_accumulation_inches stays 2.1 and status stays VERIFIED (change requires the challenge/re-verify cycle)"

  # ===========================================================================
  - section: validations
    instances:
      - name: visit_site_gap_buffer_conflict_rejected
        claim_type: violation_to_error
        grounds:
          - calculations.visit_site_gap_rule
          - validations[priority=17]
        distinguishing_aspect: "Buffer semantics: a second visit at the same site starting 60 minutes after the first one's scheduled end violates the 90-minute buffer; starting at exactly +90 minutes is legal."
        test_recipe:
          setup: ["ACTIVE per-push contract; event; first visit scheduled 09:00-10:00"]
