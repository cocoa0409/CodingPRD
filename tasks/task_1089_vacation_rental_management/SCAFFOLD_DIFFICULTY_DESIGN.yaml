            - { call: "POST /permits", payload: { property_id: "${p16}", permit_number: "PN16", jurisdiction_code: "TX-ATX", occupancy_tax_pct: 10, issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }, as: PropertyManager, captures: { perm16: "$.data.id" } }
            - { call: "POST /permits/${perm16}/activate", payload: {}, as: PropertyManager }
            - { call: "POST /properties/${p16}/list", payload: {}, as: PropertyManager }
            - { call: "POST /guests", payload: { full_name: "G16", email: "g16@x.com" }, as: Anonymous, captures: { g16: "$.data.id" } }
            - { call: "POST /bookings", payload: { property_id: "${p16}", guest_id: "${g16}", check_in: "2026-07-01T00:00:00Z", check_out: "2026-07-04T00:00:00Z" }, as: PropertyManager, captures: { b16: "$.data.id" } }
            - { call: "POST /vendors", payload: { name: "Clean16", vendor_type: "CLEANER", email: "c16@x.com" }, as: PropertyManager, captures: { vc16: "$.data.id" } }
            - { call: "POST /turnover-tasks", payload: { booking_id: "${b16}", property_id: "${p16}", assigned_vendor_id: "${vc16}", scheduled_window_start: "2026-07-04T10:00:00Z", scheduled_window_end: "2026-07-04T13:00:00Z" }, as: PropertyManager, captures: { ta: "$.data.id" } }
          trigger:
            - { call: "POST /turnover-tasks", payload: { booking_id: "${b16}", property_id: "${p16}", assigned_vendor_id: "${vc16}", scheduled_window_start: "2026-07-04T14:00:00Z", scheduled_window_end: "2026-07-04T16:00:00Z" }, as: PropertyManager, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_VENDOR_UNAVAILABLE"

