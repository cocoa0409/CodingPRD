              captures: { s_b3: "$.data.id" }
            - call: "POST /scheduling/appointments"
              payload: { counselor_id: "${c16}", student_id: "${s_b1}", start_at: "2026-05-11T09:00:00Z", end_at: "2026-05-11T09:30:00Z" }
              as: Counselor
              as_user_id: "${c16}"
              captures: { ap_base: "$.data.id" }
          trigger:
            - call: "POST /scheduling/appointments"
              payload: { counselor_id: "${c16}", student_id: "${s_b2}", start_at: "2026-05-11T09:30:00Z", end_at: "2026-05-11T10:00:00Z" }
              as: Counselor
              as_user_id: "${c16}"
              captures: { adj_err: "$.data.error_id" }
            - call: "POST /scheduling/appointments"
              payload: { counselor_id: "${c16}", student_id: "${s_b2}", start_at: "2026-05-11T09:39:00Z", end_at: "2026-05-11T10:09:00Z" }
              as: Counselor
              as_user_id: "${c16}"
              captures: { nine_min_err: "$.data.error_id" }
            - call: "POST /scheduling/appointments"
