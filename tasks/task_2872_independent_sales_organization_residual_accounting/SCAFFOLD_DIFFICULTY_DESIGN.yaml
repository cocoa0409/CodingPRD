              as: IsoAdmin
              captures: { mx: $.data.id }
            - call: "POST /merchants/${mx}/activate"
              payload: {}
              as: IsoAdmin
            - call: "POST /merchants"
              payload: { owning_agent_id: "${ay}", processor_program_id: "${p1}", mid: "MID-A002", monthly_minimum_cents: 2500, per_transaction_fee_cents: 15, equipment_lease_monthly_cents: 3900, boarded_on: "2026-04-10" }
              as: IsoAdmin
              captures: { my: $.data.id }
            - call: "POST /merchants/${my}/activate"
              payload: {}
