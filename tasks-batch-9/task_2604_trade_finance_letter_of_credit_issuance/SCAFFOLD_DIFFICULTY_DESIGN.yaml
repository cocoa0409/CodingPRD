# =========================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_ids x 2 instances = 18 instances.
#
# Shared conventions used by every setup chain below:
#   * The service starts at logical clock 2026-08-01T00:00:00Z; every chain
#     moves it forward with POST /_clock/set_current_utc before doing anything
#     time-sensitive. The clock never moves backwards.
#   * Opaque-role X-User-IDs are pinned literals ("co_1", "co_2", "tfo_1",
#     "tfo_2", "dx_1", "cmp_1", "cmp_2", "sysop_1") so segregation-of-duties
#     comparisons are reproducible.
#   * entity_backed roles send the backing row's id as X-User-ID, so
#     `as: CorrespondentBank` always carries `as_user_id: "${<bank>_id}"`.
#   * Every asserted numeric literal was produced by executing the pinned
#     §1.3 formula against the pinned §1.3 constants.
# =========================================================================
scaffold_difficulty_design:

  # =======================================================================
  # RULE 1 - dual_variant_calc
  # =======================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: facility_allocation_provisional_vs_committed
        grounds:
          - calculations.credit_allocation_exposure
          - calculations.issuance_charges
          - calculations.facility_exposure_ledger
          - entities.DocumentaryCredit.fields.provisional_allocation_cents
          - entities.DocumentaryCredit.fields.committed_allocation_cents
          - entities.CreditFacility.fields.allocated_cents
          - state_machines.DocumentaryCredit.APPROVED_to_ISSUED
        distinguishing_aspect: |
          This instance's dual variant lives in the CREDIT-FACILITY EXPOSURE domain
          (CreditFacility limit occupancy): the provisional_draft variant forces
          tolerance_eff_pct and tenor_eff_days to zero and writes nothing to the
          facility, while committed_issuance honours both and debits the facility, so
          the SAME credit yields provisional_allocation_cents == 100000000 and
          committed_allocation_cents == 105787500 - a 5787500 divergence on the same row.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z."
            - "One applicant with kyc_status CLEARED and one USD facility of limit_cents 200000000, collateral_required_pct 20, collateral_posted_cents 0."
            - "One advising bank and one beneficiary."
            - "One DRAFT credit of amount_cents 100000000, tolerance_pct 5, available_by ACCEPTANCE, tenor_days 90, incoterm FOB, latest_shipment_date 2026-10-31, expiry_date 2026-11-30, presentation_period_days 21, carrying an invoice requirement and a bill-of-lading requirement."
            - "That credit driven to status APPROVED by a credit officer who is NOT its drafter."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: SystemOperator
              as_user_id: "sysop_1"
            - call: "POST /applicants"
              payload: { legal_name: "Meridian Textiles SA", country_code: "DE", industry_code: "1310", internal_risk_grade: "BBB", kyc_status: "CLEARED" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { app_id: $.data.id }
            - call: "POST /applicants/${app_id}/facilities"
              payload: { currency: "USD", limit_cents: 200000000, collateral_required_pct: 20, facility_expiry_date: "2027-06-30" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { fac_id: $.data.id }
            - call: "POST /banks"
              payload: { bank_name: "Harborline Bank", swift_bic: "HRBLSGSG", country_code: "SG", country_risk_score: 25, credit_rating: "A", confirmation_appetite_cents: 200000000 }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { adv_bank_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { beneficiary_name: "Andaman Weaving Ltd", country_code: "SG", nominated_bank_id: "${adv_bank_id}" }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { ben_id: $.data.id }
            - call: "POST /credits"
              payload: { applicant_id: "${app_id}", beneficiary_id: "${ben_id}", facility_id: "${fac_id}", advising_bank_id: "${adv_bank_id}", currency: "USD", amount_cents: 100000000, available_by: "ACCEPTANCE", tenor_days: 90, tolerance_pct: 5, incoterm: "FOB", incoterm_place: "Port of Singapore", latest_shipment_date: "2026-10-31", expiry_date: "2026-11-30", expiry_place: "Frankfurt", presentation_period_days: 21 }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { credit_id: $.data.id, prov_alloc: $.data.provisional_allocation_cents }
            - call: "POST /credits/${credit_id}/documentary-requirements"
              payload: { doc_type: "COMMERCIAL_INVOICE", originals_required: 1, copies_required: 2, issuer_constraint: "Beneficiary", is_mandatory: true }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
            - call: "POST /credits/${credit_id}/documentary-requirements"
              payload: { doc_type: "BILL_OF_LADING", originals_required: 3, copies_required: 1, issuer_constraint: "Carrier", is_mandatory: true }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
            - call: "POST /credits/${credit_id}/submit-for-approval"
              payload: { submission_note: "terms agreed with applicant" }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
            - call: "POST /credits/${credit_id}/approve"
              payload: { decision: "APPROVE", approval_note: "within facility appetite" }
              as: CreditOfficer
              as_user_id: "co_2"
          trigger:
            - call: "POST /credits/${credit_id}/issue"
              payload: { issue_note: "issued by SWIFT MT700" }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { comm_alloc: $.data.committed_allocation_cents }
          assert:
            - "DocumentaryCredit.${credit_id}.provisional_allocation_cents == 100000000"
            - "DocumentaryCredit.${credit_id}.max_drawable_cents == 105000000"
            - "DocumentaryCredit.${credit_id}.gross_exposure_cents == 105787500"
            - "DocumentaryCredit.${credit_id}.committed_allocation_cents == 105787500"
            - "${comm_alloc} - ${prov_alloc} == 5787500"
            - "DocumentaryCredit.${credit_id}.commission_bps_applied == 7"
            - "DocumentaryCredit.${credit_id}.base_commission_cents == 148103"
            - "DocumentaryCredit.${credit_id}.confirmation_charge_cents == 0"
            - "DocumentaryCredit.${credit_id}.total_charge_cents == 148103"
            - "DocumentaryCredit.${credit_id}.chargeable_utilisation_cents == 105935603"
            - "DocumentaryCredit.${credit_id}.presentation_deadline_date == \"2026-11-21\""
            - "DocumentaryCredit.${credit_id}.status == ISSUED"
            - "CreditFacility.${fac_id}.allocated_cents == 105935603"
            - "CreditFacility.${fac_id}.available_cents == 94064397"
            - "CreditFacility.${fac_id}.utilisation_posture == OPEN"
            - "CreditFacility.${fac_id}.status == ACTIVE"

      - name: settlement_proceeds_sight_vs_negotiation
        grounds:
          - calculations.settlement_proceeds
          - entities.SettlementClaim.fields.variant_applied
          - entities.SettlementClaim.fields.net_proceeds_cents
          - entities.SettlementClaim.fields.discount_cents
          - entities.Presentation.fields.drawn_amount_cents
          - state_machines.Presentation.CLAIM_LODGED_to_PAID
          - state_machines.Presentation.CLAIM_LODGED_to_NEGOTIATED
        distinguishing_aspect: |
          This instance's dual variant lives in the PRESENTATION-SETTLEMENT domain
          (SettlementClaim proceeds), a different entity domain from the facility
          exposure instance above: two credits differing only in available_by receive
          byte-identical presentations of drawn_amount_cents 8002000, and SIGHT_HONOUR
          pays net_proceeds_cents 7984896 while NEGOTIATION_UNDER_DISCOUNT pays
          7888471 - a 96425 divergence driven by a 12-vs-20 bps commission plus a
          90023 discount charge.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z, then advanced to 2026-09-14T09:00:00Z."
            - "One applicant with a USD facility of limit_cents 50000000."
            - "One bank acting as advising bank, nominated bank and presenting bank."
            - "Credit S: amount_cents 10000000, available_by SIGHT_PAYMENT, tenor_days 0, ISSUED."
            - "Credit N: amount_cents 10000000, available_by NEGOTIATION, tenor_days 90, ISSUED."
            - "Each credit carries an invoice requirement and a bill-of-lading requirement, incoterm FOB."
            - "Each credit receives a presentation of two invoices (3001000 and 5001000) plus one bill of lading, all with benign screening fields, submitted and concluded COMPLYING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: SystemOperator
              as_user_id: "sysop_1"
            - call: "POST /applicants"
              payload: { legal_name: "Rhine Valley Importers GmbH", country_code: "DE", industry_code: "4610", internal_risk_grade: "A", kyc_status: "CLEARED" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { app_id: $.data.id }
            - call: "POST /applicants/${app_id}/facilities"
              payload: { currency: "USD", limit_cents: 50000000, collateral_required_pct: 0, facility_expiry_date: "2027-06-30" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { fac_id: $.data.id }
            - call: "POST /banks"
              payload: { bank_name: "Straits Commercial Bank", swift_bic: "STCBSGSG", country_code: "SG", country_risk_score: 20, credit_rating: "AA", confirmation_appetite_cents: 100000000 }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { bank_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { beneficiary_name: "Kallang Garments Pte Ltd", country_code: "SG", nominated_bank_id: "${bank_id}" }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { ben_id: $.data.id }
            - call: "POST /credits"
              payload: { applicant_id: "${app_id}", beneficiary_id: "${ben_id}", facility_id: "${fac_id}", advising_bank_id: "${bank_id}", currency: "USD", amount_cents: 10000000, available_by: "SIGHT_PAYMENT", tenor_days: 0, tolerance_pct: 0, incoterm: "FOB", incoterm_place: "Port of Singapore", latest_shipment_date: "2026-10-31", expiry_date: "2026-11-30", expiry_place: "Frankfurt", presentation_period_days: 21 }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { credit_s_id: $.data.id }
            - call: "POST /credits/${credit_s_id}/documentary-requirements"
              payload: { doc_type: "COMMERCIAL_INVOICE", originals_required: 1, copies_required: 2, issuer_constraint: "Beneficiary", is_mandatory: true }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
            - call: "POST /credits/${credit_s_id}/documentary-requirements"
              payload: { doc_type: "BILL_OF_LADING", originals_required: 1, copies_required: 1, issuer_constraint: "Carrier", is_mandatory: true }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
            - call: "POST /credits/${credit_s_id}/submit-for-approval"
              payload: { submission_note: "sight leg" }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
            - call: "POST /credits/${credit_s_id}/approve"
              payload: { decision: "APPROVE", approval_note: "ok" }
              as: CreditOfficer
              as_user_id: "co_2"
            - call: "POST /credits/${credit_s_id}/issue"
              payload: { issue_note: "sight leg issued" }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
            - call: "POST /credits"
              payload: { applicant_id: "${app_id}", beneficiary_id: "${ben_id}", facility_id: "${fac_id}", advising_bank_id: "${bank_id}", currency: "USD", amount_cents: 10000000, available_by: "NEGOTIATION", tenor_days: 90, tolerance_pct: 0, incoterm: "FOB", incoterm_place: "Port of Singapore", latest_shipment_date: "2026-10-31", expiry_date: "2026-11-30", expiry_place: "Frankfurt", presentation_period_days: 21 }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { credit_n_id: $.data.id }
            - call: "POST /credits/${credit_n_id}/documentary-requirements"
              payload: { doc_type: "COMMERCIAL_INVOICE", originals_required: 1, copies_required: 2, issuer_constraint: "Beneficiary", is_mandatory: true }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
            - call: "POST /credits/${credit_n_id}/documentary-requirements"
              payload: { doc_type: "BILL_OF_LADING", originals_required: 1, copies_required: 1, issuer_constraint: "Carrier", is_mandatory: true }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
            - call: "POST /credits/${credit_n_id}/submit-for-approval"
              payload: { submission_note: "negotiation leg" }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
            - call: "POST /credits/${credit_n_id}/approve"
              payload: { decision: "APPROVE", approval_note: "ok" }
              as: CreditOfficer
              as_user_id: "co_2"
            - call: "POST /credits/${credit_n_id}/issue"
              payload: { issue_note: "negotiation leg issued" }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-14T09:00:00Z" }
              as: SystemOperator
              as_user_id: "sysop_1"
            - call: "POST /presentations"
              payload: { credit_id: "${credit_s_id}", presenting_bank_id: "${bank_id}", cover_letter_reference: "CL-S-0001" }
              as: CorrespondentBank
              as_user_id: "${bank_id}"
              captures: { pres_s_id: $.data.id }
            - call: "POST /presentations/${pres_s_id}/documents"
              payload: { doc_type: "COMMERCIAL_INVOICE", originals_presented: 1, copies_presented: 2, issue_date: "2026-09-08", invoice_amount_cents: 3001000, goods_description: "Cotton trousers", hs_code: "620342", consignee_country: "DE", transit_country_codes: ["SG"], issuer_name: "Kallang Garments Pte Ltd" }
              as: CorrespondentBank
              as_user_id: "${bank_id}"
            - call: "POST /presentations/${pres_s_id}/documents"
              payload: { doc_type: "COMMERCIAL_INVOICE", originals_presented: 1, copies_presented: 2, issue_date: "2026-09-08", invoice_amount_cents: 5001000, goods_description: "Cotton trousers", hs_code: "620342", consignee_country: "DE", transit_country_codes: ["SG"], issuer_name: "Kallang Garments Pte Ltd" }
              as: CorrespondentBank
              as_user_id: "${bank_id}"
            - call: "POST /presentations/${pres_s_id}/documents"
              payload: { doc_type: "BILL_OF_LADING", originals_presented: 1, copies_presented: 1, issue_date: "2026-09-09", shipment_date: "2026-09-09", goods_description: "Cotton trousers", consignee_country: "DE", transit_country_codes: ["SG"], issuer_name: "Pacific Liner Services" }
              as: CorrespondentBank
              as_user_id: "${bank_id}"
            - call: "POST /presentations/${pres_s_id}/submit"
              payload: { submission_note: "complete set" }
              as: CorrespondentBank
              as_user_id: "${bank_id}"
            - call: "POST /presentations/${pres_s_id}/conclude-examination"
              payload: { conclusion_note: "documents comply" }
              as: DocumentExaminer
              as_user_id: "dx_1"
            - call: "POST /presentations"
              payload: { credit_id: "${credit_n_id}", presenting_bank_id: "${bank_id}", cover_letter_reference: "CL-N-0001" }
              as: CorrespondentBank
              as_user_id: "${bank_id}"
              captures: { pres_n_id: $.data.id }
            - call: "POST /presentations/${pres_n_id}/documents"
              payload: { doc_type: "COMMERCIAL_INVOICE", originals_presented: 1, copies_presented: 2, issue_date: "2026-09-08", invoice_amount_cents: 3001000, goods_description: "Cotton trousers", hs_code: "620342", consignee_country: "DE", transit_country_codes: ["SG"], issuer_name: "Kallang Garments Pte Ltd" }
              as: CorrespondentBank
              as_user_id: "${bank_id}"
            - call: "POST /presentations/${pres_n_id}/documents"
              payload: { doc_type: "COMMERCIAL_INVOICE", originals_presented: 1, copies_presented: 2, issue_date: "2026-09-08", invoice_amount_cents: 5001000, goods_description: "Cotton trousers", hs_code: "620342", consignee_country: "DE", transit_country_codes: ["SG"], issuer_name: "Kallang Garments Pte Ltd" }
              as: CorrespondentBank
              as_user_id: "${bank_id}"
            - call: "POST /presentations/${pres_n_id}/documents"
              payload: { doc_type: "BILL_OF_LADING", originals_presented: 1, copies_presented: 1, issue_date: "2026-09-09", shipment_date: "2026-09-09", goods_description: "Cotton trousers", consignee_country: "DE", transit_country_codes: ["SG"], issuer_name: "Pacific Liner Services" }
              as: CorrespondentBank
              as_user_id: "${bank_id}"
            - call: "POST /presentations/${pres_n_id}/submit"
              payload: { submission_note: "complete set" }
              as: CorrespondentBank
              as_user_id: "${bank_id}"
            - call: "POST /presentations/${pres_n_id}/conclude-examination"
              payload: { conclusion_note: "documents comply" }
              as: DocumentExaminer
              as_user_id: "dx_1"
          trigger:
            - call: "POST /presentations/${pres_s_id}/settlement-claims"
              payload: { claim_type: "PAYMENT", claimed_amount_cents: 8002000, claim_note: "sight honour" }
              as: CorrespondentBank
              as_user_id: "${bank_id}"
              captures: { claim_s_id: $.data.id }
            - call: "POST /settlement-claims/${claim_s_id}/settle"
              payload: { settlement_note: "paid at sight" }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { net_s: $.data.net_proceeds_cents }
            - call: "POST /presentations/${pres_n_id}/settlement-claims"
              payload: { claim_type: "NEGOTIATION", claimed_amount_cents: 8002000, claim_note: "negotiated with recourse" }
              as: CorrespondentBank
              as_user_id: "${bank_id}"
              captures: { claim_n_id: $.data.id }
