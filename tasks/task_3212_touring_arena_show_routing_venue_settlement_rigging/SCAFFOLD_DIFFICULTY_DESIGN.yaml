              captures: { scale_id: $.data.id }
            - call: "POST /tours/${tour_id}/engagements/${eng_id}/ticket-sales"
              payload: { ticket_scale_id: "${scale_id}", quantity: 1000 }
              as: BoxOfficeManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tours/${tour_id}/engagements/${eng_id}/settlement/reconcile"
              payload: {}
              as: TourManager
              captures: { settle_id: $.data.id }
            - call: "GET /tours/${tour_id}"
              payload: {}
              as: TourManager
              captures: { tour_gross_before: $.data.total_gross_cents }
          trigger:
            - call: "POST /tours/${tour_id}/engagements/${eng_id}/settlement/dispute"
              payload: {}
              as: VenueBooker
            - call: "POST /tours/${tour_id}/engagements/${eng_id}/settlement/resolve-dispute"
              payload: {}
              as: TourManager
            - call: "GET /tours/${tour_id}"
              payload: {}
              as: TourManager
              captures: { tour_gross_after: $.data.total_gross_cents }
          assert:
            - "tour_gross_before == 10000000"
            - "tour_gross_after == 10000000 (invariant preserved)"
            - "tour_gross_after == tour_gross_before (no drift across the dispute-resolve cycle)"

      - name: open_engagement_count_invariant_under_create_and_cancel
        grounds:
          - entities.Tour.fields.open_engagement_count
          - state_machines.Engagement.HOLD_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: Tour.open_engagement_count. Invariant:
          (count after create) - (count after cancel) == 0. The forward action
          (engagement create) and its compensating action (cancel while HOLD)
          leave the count unchanged. Different conserved quantity from
          instance 1 (count vs monetary total).
        test_recipe:
          setup:
            - "Tour T with open_engagement_count == 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tours"
              payload: { name: "T", home_base_city: "Tampa", season_start_on: "2026-09-01T00:00:00Z", season_end_on: "2027-06-30T00:00:00Z", market_cooldown_days: 30, royalty_reserve_pct: 0 }
              as: TourManager
              captures: { tour_id: $.data.id }
            - call: "POST /tours/${tour_id}/open-routing"
              payload: {}
              as: TourManager
            - call: "POST /venues"
              payload: { name: "V", market_code: "DAL", capacity_seats: 10000, load_in_dock_doors: 4, union_rule_set: "NON_UNION", default_rent_cents: 4000000, percentage_share_pct: 0.30 }
              as: VenueBooker
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/date-avails"
              payload: { opens_at: "2026-09-10T00:00:00Z", closes_at: "2026-09-15T00:00:00Z", priority_rank: 10 }
              as: VenueBooker
              captures: { avail_id: $.data.id, avail_v: $.data.version }
          trigger:
            - call: "POST /tours/${tour_id}/engagements"
              payload: { venue_id: "${venue_id}", date_avail_id: "${avail_id}", load_in_at: "2026-09-10T08:00:00Z", first_show_at: "2026-09-11T19:00:00Z", load_out_at: "2026-09-13T23:00:00Z", deal_type: "FLAT_RENT", agreed_rent_cents: 4000000, expected_avail_version: "${avail_v}" }
              as: TourManager
              captures: { eng_id: $.data.id }
            - call: "GET /tours/${tour_id}"
              payload: {}
              as: TourManager
              captures: { count_after_create: $.data.open_engagement_count }
            - call: "POST /tours/${tour_id}/engagements/${eng_id}/cancel"
              payload: {}
              as: TourManager
            - call: "GET /tours/${tour_id}"
              payload: {}
              as: TourManager
              captures: { count_after_cancel: $.data.open_engagement_count }
          assert:
            - "count_after_create == 1"
            - "count_after_cancel == 0"
            - "count_after_create - count_after_cancel == 1 (forward action adds 1)"
            - "count_after_cancel == 0 (compensating action restores the conserved quantity to baseline)"




