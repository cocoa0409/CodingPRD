            - { call: "POST /nuclear-medicine/dose-vials", payload: { order_id: "${ord}", delivery_id: "${del}" }, as: Radiopharmacist, captures: { vial: $.data.id } }
            - { call: "POST /nuclear-medicine/dose-vials/${vial}/calibrate", payload: { measured_activity_mbq: 220 }, as: Radiopharmacist, as_user_id: "rp-1" }
            - { call: "POST /nuclear-medicine/procedure-appointments", payload: { order_id: "${ord}", room_id: "${room}", start_at: "2026-08-01T10:00:00Z", end_at: "2026-08-01T10:30:00Z" }, as: NuclearMedicineTechnologist, as_user_id: "tech-1" }
            - { call: "POST /nuclear-medicine/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:45:00Z" }, as: DepartmentAdmin }
            - { call: "POST /nuclear-medicine/spill-incidents", payload: { room_id: "${room}", isotope_product_id: "${iso}", estimated_activity_mbq: 10, occurred_at: "2026-08-01T08:45:00Z" }, as: NuclearMedicineTechnologist, as_user_id: "tech-1" }
            - { call: "POST /nuclear-medicine/licenses/${lic}/suspend", payload: {}, as: DepartmentAdmin }
