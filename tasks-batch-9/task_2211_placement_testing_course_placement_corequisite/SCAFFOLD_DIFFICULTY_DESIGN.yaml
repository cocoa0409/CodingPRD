            - "One SCORED MATH attempt raw_score 160 -> scaled_score 1000, so the evidence-verification precondition is satisfiable by either route."
            - "The determination therefore lands at base_confidence_score 69.9, one tenth BELOW CONFIDENCE_VERIFY_MIN, i.e. placement_state PROVISIONAL and evidence_state UNVERIFIED."
