            - call: "POST /delivery/parcels"
              payload: { tracking_code: "P-IMM", weight_kg: 1.0 }
              as: SortAssociate
              captures: { p1: $.data.id }
            - call: "POST /delivery/parcels/${p1}/sort"
              payload: { center_id: "${c1}" }
              as: SortAssociate
            - call: "POST /delivery/routes"
              payload: { driver_id: "${d1}", origin_center_id: "${c1}", service_date: "2026-07-30", max_stops: 5 }
              as: DispatchManager
              captures: { r1: $.data.id }
            - call: "POST /delivery/stops"
              payload: { route_id: "${r1}", parcel_id: "${p1}", sequence: 1, window_start_min: 540, window_end_min: 600 }
              as: DispatchManager
          trigger:
            - call: "GET /delivery/parcels/${p1}"
              payload: {}
              as: DispatchManager
              captures: { st: $.data.status }
          assert:
            - "Parcel.${p1}.status == ROUTED"
