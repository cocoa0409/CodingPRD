        distinguishing_aspect: |
          Category pair business_referential (membership serviceability, priority 9) vs
          business_referential sub-check (member coverage, priority 10): opening a call
          on a LAPSED membership with a REMOVED requesting member must surface
          ERR_MEMBERSHIP_NOT_SERVICEABLE, not ERR_MEMBER_NOT_COVERED — two referential
          checks where declaration order decides.
