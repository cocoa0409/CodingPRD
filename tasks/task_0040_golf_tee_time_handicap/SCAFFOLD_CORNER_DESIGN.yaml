  # =====================================================================
  - section: errors
    instances:
      - name: error_stale_tee_time_version_already_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_TEE_TIME_VERSION]", "concurrency_rules[booking-create-stale-teetime]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / teetime_auto_full_depends_on_booking_confirmed_count
          rationale: "OCC stale-version path is exercised directly by the dedicated concurrency corner instance below; this stub avoids duplicate enumeration of the same error."

      - name: occ_stale_tee_time_version_conflict
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_TEE_TIME_VERSION]", "concurrency_rules[booking-create-stale-teetime]", entities.TeeTime.fields.version]
        distinguishing_aspect: "After a first booking advances TeeTime.version, a second booking still carrying the pre-advance expected_tee_time_version is rejected 412 ERR_STALE_TEE_TIME_VERSION."
        test_recipe:
          setup: ["FOURSOME slot at version v0; GA books (version advances to v1). GB then books with the stale v0. Clock 2026-06-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProShop
            - call: "POST /golf/courses"
              payload: { name: "OccCrs", course_rating: 70.0, slope_rating: 113, peak_fee_cents: 8000, offpeak_fee_cents: 5000 }
              as: ProShop
              captures: { c_id: $.data.id }
            - call: "POST /golf/golfers"
              payload: { full_name: "GA", membership_tier: "PUBLIC" }
              as: ProShop
              captures: { ga: $.data.id }
            - call: "POST /golf/golfers"
              payload: { full_name: "GB", membership_tier: "PUBLIC" }
              as: ProShop
              captures: { gb: $.data.id }
            - call: "POST /golf/tee-times"
              payload: { course_id: "${c_id}", start_utc: "2026-07-06T09:00:00Z", local_hour: 9, group_type: "FOURSOME" }
              as: ProShop
              captures: { tt_id: $.data.id, v0: $.data.version }
            - call: "POST /golf/tee-times/${tt_id}/bookings"
              payload: { golfer_id: "${ga}", expected_tee_time_version: "${v0}" }
              as: Golfer
              as_user_id: "${ga}"
              captures: { bk_a: $.data.id }
          trigger:
            - call: "POST /golf/tee-times/${tt_id}/bookings"
              payload: { golfer_id: "${gb}", expected_tee_time_version: "${v0}" }
              as: Golfer
              as_user_id: "${gb}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_TEE_TIME_VERSION"

      - name: golfer_time_conflict_already_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_GOLFER_TIME_CONFLICT]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / golfer_calendar_halfopen_overlap_adjacency_allowed
          rationale: "ERR_GOLFER_TIME_CONFLICT is asserted as the failure path of the named §1.8 overlap instance."

      - name: tee_interval_conflict_already_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_TEE_INTERVAL_CONFLICT]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / course_teesheet_buffer_spacing_conflict
          rationale: "ERR_TEE_INTERVAL_CONFLICT is asserted as the failure path of the named §1.8 buffer instance."

