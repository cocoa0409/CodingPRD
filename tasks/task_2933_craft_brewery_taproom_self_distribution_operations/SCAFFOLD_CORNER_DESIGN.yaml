      - name: reinstate_after_revoked_notice_is_refused
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Brewery.SUSPENDED_to_REVOKED
          - errors.ERR_NOTICE_TRANSITION_INVALID
        distinguishing_aspect: "REVOKED is the brewer's-notice terminal state: no action - not even REINSTATE, which is legal from SUSPENDED - may leave it. The licenses stay SUSPENDED, so the lockdown is observable one entity away as well."
        test_recipe:
          setup:
            - "Brewery created, notice ACTIVATEd, then SUSPENDed with a reason, then REVOKEd with a reason."
            - "One ID license existed before the suspension and is therefore SUSPENDED."
          setup_api_calls:
            - call: "POST /brewery"
              payload: { legal_name: "Cascade Ridge Brewing", home_state_code: "OR", ttb_brewers_notice_number: "BR-OR-4417" }
              as: BreweryAdmin
              captures: { brewery_id: $.data.id }
            - call: "POST /brewery/notice"
              payload: { action: "ACTIVATE" }
              as: StateRegulator
            - call: "POST /state-licenses"
              payload: { state_code: "ID", license_type: "SELF_DISTRIBUTION", annual_barrel_cap: 1000.00, franchise_state: false, effective_from_utc: "2026-01-01T00:00:00Z", expires_at_utc: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { lic_id: $.data.id }
            - call: "POST /brewery/notice"
              payload: { action: "SUSPEND", reason: "records inspection failure" }
              as: StateRegulator
            - call: "POST /brewery/notice"
              payload: { action: "REVOKE", reason: "notice surrendered after repeat findings" }
              as: StateRegulator
          trigger:
            - call: "POST /brewery/notice"
              payload: { action: "REINSTATE" }
              as: StateRegulator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_NOTICE_TRANSITION_INVALID"
            - "Brewery.notice_status == REVOKED"
            - "Brewery.suspension_reason == 'notice surrendered after repeat findings'"
            - "StateLicense.${lic_id}.status == SUSPENDED"

