            - "captured ${har_st} == SETTLED (distribution settles the approved harvest)"

      - name: rollover_closed_season_rejected
        claim_type: action_endpoint
        grounds: [state_machines.Season.OPEN_to_CLOSED, "errors[ERR_SEASON_NOT_CLOSABLE]"]
