    side_effects: []
  - method: GET
    path: "/event-blocks/{id}/appointments"
    description: "List appointments belonging to a block (FK reverse-reachability for Appointment.event_block_id)"
    roles: [FrontDesk, FinanceManager, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: "Appointment[]"
    side_effects: []
  - method: POST
    path: "/event-blocks/{id}/deposit"
    description: "Record a deposit payment against the block"
    roles: [FrontDesk, FinanceManager]
    code: 200
    input: [amount_cents]
    output: EventBlock
    side_effects: ["deposit_paid_cents increased by amount_cents; increments EventBlock.version by 1"]
  - method: POST
    path: "/event-blocks/{id}/confirm"
    description: "Confirm a held block (deposit met, >=2 appointments)"
    roles: [FrontDesk]
    code: 200
    input: [expected_event_block_version]
    output: EventBlock
    side_effects: ["status HOLD->CONFIRMED; chairs locked; increments EventBlock.version by 1"]
  - method: POST
    path: "/event-blocks/{id}/reopen"
    description: "Reopen a CONFIRMED block to revision"
    roles: [FrontDesk]
    code: 200
    input: [expected_event_block_version]
    output: EventBlock
    side_effects: ["status CONFIRMED->HOLD; increments EventBlock.version by 1"]
  - method: POST
    path: "/event-blocks/{id}/close"
    description: "Close a block after all appointments terminal"
    roles: [FrontDesk]
    code: 200
    input: [expected_event_block_version]
    output: EventBlock
    side_effects: ["status CHECKED_IN->CLOSED; chairs released; increments EventBlock.version by 1"]
  - method: POST
    path: "/event-blocks/{id}/cancel"
    description: "Cancel a block; cascades cancel to its appointments"
    roles: [FrontDesk]
    code: 200
    input: [expected_event_block_version]
    output: EventBlock
    side_effects: ["status->CANCELLED; CASCADE cancel each BOOKED/CHECKED_IN appointment; chairs released; deposit forfeited; increments EventBlock.version by 1"]

  # ---- Appointment ----
  - method: POST
    path: "/appointments"
    description: "Book an appointment (standalone or into an event block)"
    roles: [FrontDesk, Member]
    code: 201
    input: [member_id, chair_id, stylist_id, style_service_id, start_minute, payment_method, "event_block_id?", "expected_event_block_version?"]
    output: Appointment
    side_effects:
      - "lifecycle_status=BOOKED; settlement_status=UNSETTLED"
      - "scheduled_duration_minutes/end_minute computed; pricing computed (calc: appointment_service_pricing)"
      - "blowout credits drawn (calc: blowout_credit_balance); PREPAY hold placed if payment_method==PREPAY"
      - "if event_block_id present: validates expected_event_block_version (OCC), chair/window membership, then increments EventBlock.version by 1"
  - method: GET
    path: "/appointments"
    description: "List appointments (filter by member_id, chair_id, stylist_id, style_service_id, event_block_id)"
    roles: [FrontDesk, FinanceManager, Stylist, Member]
    code: 200
    input: ["member_id?", "chair_id?", "stylist_id?", "style_service_id?", "event_block_id?", "limit?", "offset?"]
    output: "Appointment[]"
    side_effects: []
  - method: GET
    path: "/appointments/{id}"
    description: "Get an appointment (pricing, splits, statuses)"
    roles: [FrontDesk, FinanceManager, Stylist, Member]
    code: 200
    input: []
    output: Appointment
    side_effects: []
  - method: POST
    path: "/appointments/{id}/add-ons"
    description: "Attach an add-on to a BOOKED appointment; re-prices and re-times"
    roles: [FrontDesk]
    code: 201
    input: [add_on_id]
    output: AppointmentAddOn
    side_effects: ["captured price/duration snapshot; appointment scheduled_duration/end recomputed; pricing recomputed (calc: appointment_service_pricing); chair overlap re-validated for new end"]
  - method: GET
    path: "/appointments/{id}/add-ons"
    description: "List add-ons attached to an appointment (FK reverse-reachability for AppointmentAddOn.appointment_id)"
    roles: [FrontDesk, FinanceManager, Stylist, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: "AppointmentAddOn[]"
    side_effects: []
  - method: GET
    path: "/appointment-add-ons"
    description: "List appointment add-on attachments (filter by appointment_id, add_on_id; FK reverse-reachability for AppointmentAddOn.add_on_id)"
    roles: [FrontDesk, FinanceManager, Stylist, Member]
    code: 200
    input: ["appointment_id?", "add_on_id?", "limit?", "offset?"]
    output: "AppointmentAddOn[]"
    side_effects: []
  - method: GET
    path: "/appointment-add-ons/{id}"
    description: "Get a single appointment add-on attachment"
    roles: [FrontDesk, FinanceManager, Stylist, Member]
    code: 200
    input: []
    output: AppointmentAddOn
    side_effects: []
  - method: POST
    path: "/appointments/{id}/check-in"
    description: "Check in a BOOKED appointment (ON_TIME or LATE)"
    roles: [FrontDesk]
    code: 200
    input: [arrival_status, "late_minutes?"]
    output: Appointment
    side_effects: ["lifecycle_status BOOKED->CHECKED_IN; if LATE beyond grace, late_fee added (calc: late_fee); if block appointment, EventBlock CONFIRMED->CHECKED_IN cascade"]
  - method: POST
    path: "/appointments/{id}/start"
    description: "Stylist starts service"
    roles: [Stylist]
    code: 200
    input: []
    output: Appointment
    side_effects: ["lifecycle_status CHECKED_IN->IN_SERVICE"]
  - method: POST
    path: "/appointments/{id}/complete"
    description: "Stylist completes service"
    roles: [Stylist]
    code: 200
    input: []
    output: Appointment
    side_effects: ["lifecycle_status IN_SERVICE->COMPLETED"]
  - method: POST
    path: "/appointments/{id}/no-show"
    description: "Mark a BOOKED appointment as no-show"
    roles: [FrontDesk]
    code: 200
    input: []
    output: Appointment
    side_effects: ["lifecycle_status BOOKED->NO_SHOW; settlement VOIDED; Member.no_show_strikes++ (calc: no_show_strikes); CASCADE Member.status->SUSPENDED at threshold; credits forfeited; chair released"]
  - method: POST
    path: "/appointments/{id}/cancel"
    description: "Cancel a BOOKED/CHECKED_IN appointment"
    roles: [FrontDesk, Member]
    code: 200
    input: []
    output: Appointment
    side_effects: ["lifecycle_status->CANCELLED; settlement VOIDED; credits refunded; PREPAY hold released; chair released"]
  - method: POST
    path: "/appointments/{id}/settle"
    description: "Settle a COMPLETED appointment; captures tip and computes splits"
    roles: [FinanceManager]
    code: 200
    input: ["tip_cents?"]
    output: Appointment
    side_effects:
      - "settlement_status UNSETTLED->SETTLED"
      - "tip_split + commission_split computed (calc: tip_split, commission_split)"
      - "if PREPAY: Member.prepay_balance_cents debited by service_charge_cents (calc: prepay_balance)"
      - "Stylist.earned_commission_cents + earned_tips_cents recomputed (CASCADE)"

  # ---- Product (config/retail) ----
  - method: POST
    path: "/products"
    description: "Create a retail product"
    roles: [FrontDesk, FinanceManager]
    code: 201
    input: [sku, name, unit_price_cents, initial_stock, "retail_commission_pct?"]
    output: Product
    side_effects: ["stock_qty=initial_stock"]
  - method: GET
    path: "/products"
    description: "List products"
    roles: [FrontDesk, FinanceManager, Stylist, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: "Product[]"
    side_effects: []
  - method: GET
    path: "/products/{id}"
    description: "Get a product"
    roles: [FrontDesk, FinanceManager, Stylist, Member]
    code: 200
    input: []
    output: Product
    side_effects: []
  - method: POST
    path: "/products/{id}/restock"
    description: "Add units to a product's stock"
    roles: [FrontDesk, FinanceManager]
    code: 200
    input: [quantity]
    output: Product
    side_effects: ["stock_qty increased by quantity"]

  # ---- RetailSale ----
  - method: POST
    path: "/retail-sales"
    description: "Record a retail sale; decrements stock, computes stylist retail commission"
    roles: [FrontDesk]
    code: 201
    input: [product_id, member_id, quantity, "attributed_stylist_id?"]
    output: RetailSale
    side_effects: ["status=SOLD; Product.stock_qty decremented (calc); retail_commission_cents computed (calc: retail_commission); attributed Stylist.earned_commission_cents recomputed (CASCADE)"]
  - method: GET
    path: "/retail-sales"
    description: "List retail sales (filter by product_id, member_id, attributed_stylist_id)"
    roles: [FrontDesk, FinanceManager, Stylist]
    code: 200
    input: ["product_id?", "member_id?", "attributed_stylist_id?", "limit?", "offset?"]
    output: "RetailSale[]"
    side_effects: []
  - method: GET
    path: "/retail-sales/{id}"
    description: "Get a retail sale"
    roles: [FrontDesk, FinanceManager, Stylist]
    code: 200
    input: []
    output: RetailSale
    side_effects: []
  - method: POST
    path: "/retail-sales/{id}/void"
    description: "Void a retail sale; restocks and reverses commission"
    roles: [FrontDesk]
    code: 200
    input: []
    output: RetailSale
    side_effects: ["status SOLD->VOIDED; Product.stock_qty restored (CASCADE); retail commission reversed (CASCADE)"]

  # ---- PackagePurchase ----
  - method: POST
    path: "/package-purchases"
    description: "Buy a prepaid blowout-credit package for a member"
    roles: [FrontDesk, FinanceManager]
    code: 201
    input: [member_id, credits_purchased, price_cents, expected_member_version]
    output: PackagePurchase
    side_effects: ["status=ACTIVE; Member.blowout_credit_balance += credits_purchased (calc: blowout_credit_balance); increments Member.version by 1"]
  - method: GET
    path: "/package-purchases"
    description: "List package purchases (filter by member_id)"
    roles: [FrontDesk, FinanceManager, Member]
    code: 200
    input: ["member_id?", "limit?", "offset?"]
    output: "PackagePurchase[]"
    side_effects: []
  - method: GET
    path: "/package-purchases/{id}"
    description: "Get a package purchase"
    roles: [FrontDesk, FinanceManager, Member]
    code: 200
    input: []
    output: PackagePurchase
    side_effects: []
  - method: POST
    path: "/package-purchases/{id}/refund"
    description: "Refund an unused package; reverses credits, credits prepay"
    roles: [FinanceManager]
    code: 200
    input: [expected_member_version]
    output: PackagePurchase
    side_effects: ["status ACTIVE->REFUNDED; Member.blowout_credit_balance -= credits_purchased (compensating); Member.prepay_balance_cents += price_cents; increments Member.version by 1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # auth
  - { id: ERR_MISSING_AUTH_CONTEXT, http: 401, condition: "X-User-ID or X-User-Role header missing/malformed" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_OWNER, http: 403, condition: "Member acting on a resource they do not own" }
  - { id: ERR_NOT_ASSIGNED_STYLIST, http: 403, condition: "Stylist acting on an appointment they are not assigned to" }
  # validation
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing required field, illegal enum, or value out of declared constraint range" }
  # not found
  - { id: ERR_MEMBER_NOT_FOUND, http: 404, condition: "Member id does not exist" }
  - { id: ERR_CHAIR_NOT_FOUND, http: 404, condition: "Chair id does not exist" }
  - { id: ERR_STYLIST_NOT_FOUND, http: 404, condition: "Stylist id does not exist" }
  - { id: ERR_STYLE_SERVICE_NOT_FOUND, http: 404, condition: "StyleService id does not exist" }
  - { id: ERR_ADD_ON_NOT_FOUND, http: 404, condition: "AddOn id does not exist" }
  - { id: ERR_EVENT_BLOCK_NOT_FOUND, http: 404, condition: "EventBlock id does not exist" }
  - { id: ERR_APPOINTMENT_NOT_FOUND, http: 404, condition: "Appointment id does not exist" }
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "Product id does not exist" }
  - { id: ERR_SALE_NOT_FOUND, http: 404, condition: "RetailSale id does not exist" }
  - { id: ERR_PACKAGE_NOT_FOUND, http: 404, condition: "PackagePurchase id does not exist" }
  # appointment lifecycle state
  - { id: ERR_APPOINTMENT_NOT_BOOKED, http: 409, condition: "Operation requires appointment lifecycle_status==BOOKED" }
  - { id: ERR_APPOINTMENT_NOT_CHECKED_IN, http: 409, condition: "start requires lifecycle_status==CHECKED_IN" }
  - { id: ERR_APPOINTMENT_NOT_IN_SERVICE, http: 409, condition: "complete requires lifecycle_status==IN_SERVICE" }
  - { id: ERR_APPOINTMENT_NOT_COMPLETED, http: 409, condition: "settle requires lifecycle_status==COMPLETED" }
  - { id: ERR_APPOINTMENT_NOT_CANCELLABLE, http: 409, condition: "cancel requires lifecycle_status in {BOOKED, CHECKED_IN}" }
  - { id: ERR_NO_SHOW_TOO_EARLY, http: 409, condition: "no-show before appointment start_minute (clock current_minute < start_minute)" }
  # settlement state
  - { id: ERR_ALREADY_SETTLED, http: 409, condition: "settle on an appointment whose settlement_status != UNSETTLED" }
  # member
  - { id: ERR_MEMBER_SUSPENDED, http: 409, condition: "check-in/booking subject member is SUSPENDED" }
  - { id: ERR_MEMBER_NOT_SUSPENDED, http: 409, condition: "reinstate on a member not SUSPENDED" }
  # event block state
  - { id: ERR_EVENT_BLOCK_NOT_HOLD, http: 409, condition: "confirm requires EventBlock.status==HOLD" }
  - { id: ERR_EVENT_BLOCK_NOT_CONFIRMED, http: 409, condition: "reopen requires EventBlock.status==CONFIRMED" }
  - { id: ERR_EVENT_BLOCK_NOT_CLOSEABLE, http: 409, condition: "close requires EventBlock.status==CHECKED_IN" }
  - { id: ERR_EVENT_BLOCK_NOT_CANCELLABLE, http: 409, condition: "cancel requires EventBlock.status in {HOLD, CONFIRMED}" }
  - { id: ERR_BLOCK_IN_PROGRESS, http: 409, condition: "reopen blocked because a block appointment is CHECKED_IN/IN_SERVICE/COMPLETED" }
  - { id: ERR_DEPOSIT_NOT_MET, http: 409, condition: "confirm requires deposit_paid_cents >= deposit_cents" }
  - { id: ERR_BLOCK_UNDERFILLED, http: 409, condition: "confirm requires >= 2 BOOKED appointments in the block" }
  - { id: ERR_BLOCK_HAS_OPEN_APPOINTMENTS, http: 409, condition: "close requires all block appointments in terminal lifecycle_status" }
  # retail / package state
  - { id: ERR_SALE_NOT_VOIDABLE, http: 409, condition: "void requires RetailSale.status==SOLD" }
  - { id: ERR_PACKAGE_NOT_REFUNDABLE, http: 409, condition: "refund requires PackagePurchase.status==ACTIVE" }
  - { id: ERR_CREDITS_ALREADY_USED, http: 409, condition: "package refund blocked: member's available credits < credits_purchased" }
  # temporal / scheduling
  - { id: ERR_OUTSIDE_OPERATING_WINDOW, http: 422, condition: "appointment window outside chair or stylist operating hours" }
  - { id: ERR_CHAIR_DOUBLE_BOOKED, http: 409, condition: "appointment+turnover-buffer interval overlaps another on the chair" }
  - { id: ERR_STYLIST_DOUBLE_BOOKED, http: 409, condition: "appointment interval overlaps another for the stylist (no buffer)" }
  - { id: ERR_BLOCK_CHAIR_OR_WINDOW_MISMATCH, http: 422, condition: "event-block appointment chair not reserved or window mismatch" }
  - { id: ERR_CHAIR_RESERVED_FOR_BLOCK, http: 409, condition: "standalone booking on a chair reserved by a CONFIRMED block during its window" }
  - { id: ERR_SERVICE_OR_ADDON_INACTIVE, http: 409, condition: "service or attached add-on is inactive at booking/attach" }
  # fiscal
  - { id: ERR_INSUFFICIENT_STOCK, http: 409, condition: "retail sale quantity exceeds product stock_qty" }
  - { id: ERR_INSUFFICIENT_PREPAY, http: 402, condition: "PREPAY settlement exceeds member prepay_balance_cents" }
  # concurrency
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match current parent version (OCC)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FrontDesk
    description: "Front-desk operator: scheduling, check-in, retail, configuration, event blocks"
    identity: opaque
    exclusive_operations:
      - "POST /style-services, POST /add-ons — menu configuration"
      - "POST /members, POST /stylists, POST /chairs — resource creation"
      - "POST /members/{id}/reinstate — reinstate suspended member"
      - "POST /event-blocks and lifecycle (confirm/reopen/close/cancel)"
      - "POST /appointments/{id}/check-in — check in"
      - "POST /appointments/{id}/no-show — mark no-show"
      - "POST /appointments/{id}/add-ons — attach add-on"
      - "POST /retail-sales, POST /retail-sales/{id}/void — retail"
    shared_operations:
      - "POST /appointments — book (shared with Member)"
      - "POST /appointments/{id}/cancel — cancel (shared with Member)"
      - "POST /members/{id}/prepay, POST /event-blocks/{id}/deposit (shared with FinanceManager)"
      - "POST /products, POST /products/{id}/restock, POST /package-purchases (shared with FinanceManager)"
      - "POST /_clock/set_current_utc (shared with FinanceManager)"
      - "all GET reads"

  - name: FinanceManager
    description: "Finance: membership plans, settlement, payouts, package refunds"
    identity: opaque
    exclusive_operations:
      - "POST /membership-plans — plan configuration"
      - "POST /appointments/{id}/settle — settle and split tip/commission"
      - "POST /package-purchases/{id}/refund — refund a package"
    shared_operations:
      - "POST /members/{id}/prepay, POST /event-blocks/{id}/deposit (shared with FrontDesk)"
      - "POST /products, POST /products/{id}/restock, POST /package-purchases (shared with FrontDesk)"
      - "POST /_clock/set_current_utc (shared with FrontDesk)"
      - "all GET reads"

  - name: Stylist
    description: "Stylist: starts and completes their own assigned appointments"
    identity: "entity_backed:Stylist"
    exclusive_operations:
      - "POST /appointments/{id}/start — start own service (X-User-ID == appointment.stylist_id)"
      - "POST /appointments/{id}/complete — complete own service"
    shared_operations:
      - "GET reads of appointments, stylists, services, add-ons, chairs, products, retail-sales"

  - name: Member
    description: "Member (customer): books and cancels own appointments"
    identity: "entity_backed:Member"
    exclusive_operations: []
    shared_operations:
      - "POST /appointments — book own appointment (X-User-ID == member_id; shared with FrontDesk)"
      - "POST /appointments/{id}/cancel — cancel own appointment (shared with FrontDesk)"
      - "GET reads of own member, own appointments, own packages, blocks, menu"
