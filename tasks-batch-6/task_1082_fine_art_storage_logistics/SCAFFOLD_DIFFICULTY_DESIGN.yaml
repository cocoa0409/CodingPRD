              as: Registrar
              captures: { art_id: $.data.id }
            - call: "POST /crates"
              payload: { artwork_id: "${art_id}", crate_type: "HARD", internal_length_cm: 120, internal_width_cm: 80, internal_height_cm: 15 }
              as: Coordinator
              captures: { crate_id: $.data.id }
