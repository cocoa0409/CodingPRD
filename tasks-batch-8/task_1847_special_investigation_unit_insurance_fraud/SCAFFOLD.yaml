scenario: |
  1847. Special Investigation Unit & Insurance Fraud (insurer SIU): red-flag referral intake & scoring,
  investigation assignment & evidence gathering (statement/surveillance/records), claim delay/denial
  coordination with adjuster, state fraud bureau referral requirement & deadlines, provider/organized
  ring pattern analysis, restitution & recovery tracking, EUO (examination under oath) scheduling,
  SIU training & regulatory reporting.

domain_name: siu-fraud
api_prefix: /siu

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - scheduled_deferred_actions
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: SIUCase
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; the claim under investigation" }
      - { name: opened_by_referral_id, type: string, source: system, description: "FK -> RedFlagReferral.id; referral that triggered case open" }
      - { name: case_number, type: string, source: system, description: "Server-minted SIU-YYYY-NNNNNN case number" }
      - { name: status, type: enum, source: system, description: "INTAKE → OPEN → UNDER_INVESTIGATION → EUO_PENDING → DECISION_PENDING → CLOSED_SUBSTANTIATED | CLOSED_UNSUBSTANTIATED | CLOSED_INSUFFICIENT | REFERRED_TO_BUREAU" , constraints: "see state_machines.SIUCase" }
      - { name: priority, type: enum, source: computed, description: "Derived from referral score band: LOW|MEDIUM|HIGH|CRITICAL" }
      - { name: suspicion_score, type: integer, source: computed, description: "Cached copy of referral.suspicion_score at case open; never recomputed afterwards" }
      - { name: investigation_deadline_at, type: datetime, source: computed, description: "Opened_at + INVESTIGATION_WINDOW_DAYS; drives escalation" }
      - { name: decision_due_at, type: datetime, source: computed, description: "When adjuster decision must be recorded; set when entering DECISION_PENDING" }
      - { name: assigned_investigator_id, type: string, source: system, description: "FK -> Investigator.id; current lead investigator (null until assigned)", default: null }
      - { name: substantiated_fraud_cents, type: integer, source: computed, description: "Total substantiated fraud amount across evidence items with status=ADMITTED and materiality=SUBSTANTIVE", default: 0 }
      - { name: euo_required, type: boolean, source: computed, description: "True when suspicion_score >= EUO_SCORE_THRESHOLD at OPEN, or when under-investigation evidence raises score above threshold", default: false }
      - { name: bureau_referral_required, type: boolean, source: computed, description: "True when substantiated_fraud_cents >= BUREAU_REFERRAL_MIN_CENTS OR when claim state code mandates mandatory referral", default: false }
      - { name: closed_reason, type: enum, source: input, description: "Required on closure: SUBSTANTIATED|UNSUBSTANTIATED|INSUFFICIENT_EVIDENCE|WITHDRAWN_BY_ADJUSTER", default: null }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: policy_number, type: string, source: input, description: "Insured's policy number" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state code governing claim; drives bureau rules" }
      - { name: adjuster_id, type: string, source: input, description: "FK -> Adjuster.id; owning adjuster" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Total claimed amount in cents" }
      - { name: status, type: enum, source: system, description: "PENDING → UNDER_SIU_REVIEW → PAYMENT_DELAYED | DENIED | PAID | CLOSED" }
      - { name: payment_hold_reason, type: enum, source: system, description: "Null | SIU_INVESTIGATION | EUO_NONAPPEARANCE | FRAUD_CONFIRMED", default: null }
      - { name: paid_amount_cents, type: integer, source: computed, description: "Sum of completed payouts; increments only on PAID transition", default: 0 }

  - name: Adjuster
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Adjuster full name" }
      - { name: email, type: string, source: input, description: "Work email (unique)" }
      - { name: state_licenses, type: array, source: input, description: "Array of two-letter state codes the adjuster is licensed in" }
      - { name: active, type: boolean, source: input, description: "Employment status", default: true }

  - name: RedFlagReferral
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; claim being flagged" }
      - { name: submitted_by_role, type: enum, source: input, description: "ADJUSTER|PROVIDER|EXTERNAL_TIP|AUTOMATED_RULE" }
      - { name: red_flag_codes, type: array, source: input, description: "Array of red-flag codes (see calculations.red_flag_score constants)" }
      - { name: narrative, type: string, source: input, description: "Free-text description of suspicion" }
      - { name: suspicion_score, type: integer, source: computed, description: "Weighted sum of red_flag_codes per calculations.red_flag_score" }
      - { name: score_band, type: enum, source: computed, description: "LOW|MEDIUM|HIGH|CRITICAL derived from suspicion_score per thresholds" }
      - { name: status, type: enum, source: system, description: "SUBMITTED → TRIAGED → ACCEPTED (creates SIUCase) | DECLINED | DUPLICATE_LINKED" }
      - { name: decline_reason, type: string, source: input, description: "Required when transitioning to DECLINED", default: null }
      - { name: duplicate_of_referral_id, type: string, source: input, description: "FK -> RedFlagReferral.id; set when transitioning to DUPLICATE_LINKED", default: null }

  - name: Investigator
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Investigator name" }
      - { name: email, type: string, source: input, description: "Work email (unique)" }
      - { name: badge_number, type: string, source: input, description: "SIU badge identifier (unique)" }
      - { name: state_certifications, type: array, source: input, description: "States investigator is certified to operate in" }
      - { name: max_active_cases, type: integer, source: input, description: "Caseload capacity ceiling (>=1, <=20)" }
      - { name: active_case_count, type: integer, source: computed, description: "Count of Assignment rows with status=ACTIVE for this investigator", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | TERMINATED", default: "ACTIVE" }
      - { name: training_current_through, type: datetime, source: computed, description: "Latest completed TrainingRecord.valid_until; drives eligibility for high-priority cases", default: null }

  - name: Assignment
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> SIUCase.id" }
      - { name: investigator_id, type: string, source: input, description: "FK -> Investigator.id" }
      - { name: assigned_by_user_id, type: string, source: system, description: "X-User-ID of assigning SIUManager (segregation-of-duties audit)" }
      - { name: status, type: enum, source: system, description: "ACTIVE → REASSIGNED | COMPLETED | TERMINATED" }
      - { name: assigned_at, type: datetime, source: system, description: "Timestamp of assignment" }
      - { name: completed_at, type: datetime, source: system, description: "Timestamp when COMPLETED", default: null }

  - name: Evidence
    parent: SIUCase
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> SIUCase.id" }
      - { name: submitted_by_investigator_id, type: string, source: system, description: "FK -> Investigator.id who logged evidence" }
      - { name: evidence_type, type: enum, source: input, description: "STATEMENT | SURVEILLANCE | RECORDS | SOCIAL_MEDIA | PRIOR_CLAIM_HISTORY" }
      - { name: collected_at, type: datetime, source: input, description: "When evidence was collected (<= now)" }
      - { name: custodian, type: string, source: input, description: "Chain-of-custody custodian name" }
      - { name: materiality, type: enum, source: input, description: "IMMATERIAL | SUPPORTING | SUBSTANTIVE" }
      - { name: fraud_amount_cents, type: integer, source: input, description: "Portion of claim amount attributable to this evidence; 0 for non-monetary" }
      - { name: status, type: enum, source: system, description: "LOGGED → UNDER_REVIEW → ADMITTED | EXCLUDED | SEALED" }
      - { name: sealed_at, type: datetime, source: system, description: "When sealed (immutable); null otherwise", default: null }

  - name: EUOSession
    parent: SIUCase
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> SIUCase.id" }
      - { name: scheduled_start_at, type: datetime, source: input, description: "EUO start (must be in the future when scheduled)" }
      - { name: scheduled_end_at, type: datetime, source: input, description: "EUO end (> scheduled_start_at)" }
      - { name: location, type: string, source: input, description: "Physical or virtual location" }
      - { name: insured_attendee_name, type: string, source: input, description: "Name of insured required to appear" }
      - { name: status, type: enum, source: system, description: "SCHEDULED → NOTICE_SENT → CONDUCTED | NO_SHOW | RESCHEDULED | CANCELLED" }
      - { name: notice_sent_at, type: datetime, source: system, description: "When notice was dispatched; drives statutory notice window", default: null }
      - { name: conducted_at, type: datetime, source: system, description: "Actual completion timestamp", default: null }
      - { name: transcript_received, type: boolean, source: system, description: "True once court-reporter transcript uploaded", default: false }
      - { name: no_show_count, type: integer, source: computed, description: "Increments each time session transitions to NO_SHOW", default: 0 }

  - name: FraudBureauReferral
    parent: SIUCase
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> SIUCase.id" }
      - { name: state_code, type: string, source: system, description: "Copied from Claim.state_code at filing" }
      - { name: filed_at, type: datetime, source: system, description: "When submitted to bureau; null until FILED", default: null }
      - { name: deadline_at, type: datetime, source: computed, description: "Case.substantiated_date + state-specific bureau_window_days" }
      - { name: status, type: enum, source: system, description: "DRAFT → FILED → ACKNOWLEDGED | REJECTED_BY_BUREAU | LATE_FILED" }
      - { name: ack_received_at, type: datetime, source: system, description: "Bureau ack timestamp", default: null }
      - { name: late_filing, type: boolean, source: computed, description: "True when filed_at > deadline_at", default: false }

  - name: ProviderPattern
    parent: null
    common_fields: true
    fields:
      - { name: provider_npi, type: string, source: input, description: "National Provider Identifier" }
      - { name: provider_name, type: string, source: input, description: "Provider legal name" }
      - { name: ring_signature, type: string, source: input, description: "Hash of linked attributes (address/phone/bank) used for ring clustering" }
      - { name: linked_case_ids, type: array, source: system, description: "SIUCase.id list linked via shared ring_signature", default: [] }
      - { name: pattern_score, type: integer, source: computed, description: "Per calculations.provider_pattern_score" }
      - { name: escalation_status, type: enum, source: system, description: "MONITORING → ESCALATED_TO_NICB | CLEARED | MERGED_INTO_RING" }
      - { name: parent_pattern_id, type: string, source: input, description: "FK -> ProviderPattern.id; self-referential merge target when MERGED_INTO_RING", default: null }

  - name: RestitutionLedger
    parent: SIUCase
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> SIUCase.id" }
      - { name: target_amount_cents, type: integer, source: input, description: "Court-ordered or agreed restitution total" }
      - { name: recovered_amount_cents, type: integer, source: computed, description: "Sum of RecoveryPayment.amount_cents with status=CLEARED minus reversed", default: 0 }
      - { name: outstanding_amount_cents, type: integer, source: computed, description: "target - recovered; never negative", default: 0 }
      - { name: status, type: enum, source: system, description: "OPEN → PARTIALLY_RECOVERED → FULLY_RECOVERED | WRITTEN_OFF" }

  - name: RecoveryPayment
    parent: RestitutionLedger
    common_fields: true
    fields:
      - { name: ledger_id, type: string, source: system, description: "FK -> RestitutionLedger.id" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount in cents (>0)" }
      - { name: received_at, type: datetime, source: input, description: "When payment was received" }
      - { name: method, type: enum, source: input, description: "CHECK | ACH | WIRE | WAGE_GARNISHMENT | POLICY_OFFSET" }
      - { name: status, type: enum, source: system, description: "PENDING → CLEARED | RETURNED | REVERSED" }
      - { name: reversed_at, type: datetime, source: system, description: "When reversed", default: null }

  - name: TrainingRecord
    parent: Investigator
    common_fields: true
    fields:
      - { name: investigator_id, type: string, source: system, description: "FK -> Investigator.id" }
      - { name: course_code, type: string, source: input, description: "Course identifier (e.g., SIU-ANNUAL-2026)" }
      - { name: completed_at, type: datetime, source: input, description: "Course completion timestamp" }
      - { name: valid_until, type: datetime, source: input, description: "Certification expiration; must be > completed_at" }
      - { name: credit_hours, type: integer, source: input, description: "Credit hours earned (>=1)" }

  - name: RegulatoryReport
    parent: null
    common_fields: true
    fields:
      - { name: period_start_at, type: datetime, source: input, description: "Reporting period start (inclusive)" }
      - { name: period_end_at, type: datetime, source: input, description: "Reporting period end (exclusive); must be > start" }
      - { name: state_code, type: string, source: input, description: "Two-letter state this report covers" }
      - { name: report_type, type: enum, source: input, description: "QUARTERLY_SIU_ACTIVITY | ANNUAL_ANTI_FRAUD_PLAN | BUREAU_LATE_FILING_SUMMARY" }
      - { name: total_cases_opened, type: integer, source: computed, description: "Cases opened in period for state", default: 0 }
      - { name: total_cases_closed_substantiated, type: integer, source: computed, description: "Closed-substantiated in period", default: 0 }
      - { name: total_restitution_recovered_cents, type: integer, source: computed, description: "Recovered in period", default: 0 }
      - { name: late_bureau_filings, type: integer, source: computed, description: "FraudBureauReferral with late_filing=true in period", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT → SUBMITTED → ACCEPTED | REJECTED_BY_REGULATOR" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: SIUCase
    initial_state: INTAKE
    terminal_states: [CLOSED_SUBSTANTIATED, CLOSED_UNSUBSTANTIATED, CLOSED_INSUFFICIENT, REFERRED_TO_BUREAU]
    transitions:
      - from: INTAKE
        to: OPEN
        trigger: "POST /siu/cases/{caseId}/open"
        actor: SIUManager
        preconditions:
          - "Referral that opened the case is in ACCEPTED status"
          - "No other SIUCase for same claim_id is in a non-terminal status"
        side_effects:
          - "Set suspicion_score = referral.suspicion_score (snapshot)"
          - "Compute investigation_deadline_at = opened_at + INVESTIGATION_WINDOW_DAYS (45d)"
          - "Compute euo_required flag from threshold"
          - "Claim.status: PENDING → UNDER_SIU_REVIEW; payment_hold_reason=SIU_INVESTIGATION"
          - "SIUCase.version increments by 1"
      - from: OPEN
        to: UNDER_INVESTIGATION
        trigger: "POST /siu/cases/{caseId}/assignments (first ACTIVE assignment)"
        actor: SIUManager
        preconditions:
          - "Investigator.status == ACTIVE"
          - "Investigator.active_case_count < investigator.max_active_cases"
          - "Investigator.state_certifications CONTAINS claim.state_code"
        side_effects:
          - "Create Assignment (status=ACTIVE)"
          - "Investigator.active_case_count += 1"
          - "SIUCase.assigned_investigator_id := investigator.id"
      - from: UNDER_INVESTIGATION
        to: EUO_PENDING
        trigger: "POST /siu/cases/{caseId}/euo-sessions (when case.euo_required==true)"
        actor: SIUInvestigator
        preconditions:
          - "Case has at least 1 Evidence with status=ADMITTED"
        side_effects:
          - "Block any new Evidence transitions to ADMITTED until EUO reaches CONDUCTED or NO_SHOW (preserves testimony context)"
      - from: EUO_PENDING
        to: UNDER_INVESTIGATION
        trigger: "POST /siu/cases/{caseId}/euo-sessions/{euoId}/conduct  OR  POST /siu/cases/{caseId}/euo-sessions/{euoId}/no-show"
        actor: SIUInvestigator
        preconditions: []
        side_effects:
          - "On conduct: transcript_received=true on session"
          - "On no-show: session.no_show_count += 1; if no_show_count >= 2, Claim.payment_hold_reason := EUO_NONAPPEARANCE"
      - from: UNDER_INVESTIGATION
        to: DECISION_PENDING
        trigger: "POST /siu/cases/{caseId}/submit-for-decision"
        actor: SIUInvestigator
        preconditions:
          - "If case.euo_required==true then at least one EUOSession in CONDUCTED or no_show_count >= 2"
          - "At least 1 Evidence in ADMITTED status"
        side_effects:
          - "decision_due_at := now + DECISION_WINDOW_DAYS (30d)"
      - from: DECISION_PENDING
        to: CLOSED_SUBSTANTIATED
        trigger: "POST /siu/cases/{caseId}/close (closed_reason=SUBSTANTIATED)"
        actor: SIUManager
        preconditions:
          - "substantiated_fraud_cents > 0"
          - "Segregation of duties: closing manager MUST NOT equal assigned investigator's user id"
        side_effects:
          - "Claim.status: UNDER_SIU_REVIEW|PAYMENT_DELAYED → DENIED; payment_hold_reason := FRAUD_CONFIRMED"
          - "Create RestitutionLedger with target_amount_cents = substantiated_fraud_cents (auto-create)"
          - "If bureau_referral_required: auto-create FraudBureauReferral (DRAFT) with deadline_at = now + state-specific window"
          - "ProviderPattern: for each Evidence linked to provider_npi, link case id and recompute pattern_score"
      - from: DECISION_PENDING
        to: CLOSED_UNSUBSTANTIATED
        trigger: "POST /siu/cases/{caseId}/close (closed_reason=UNSUBSTANTIATED)"
        actor: SIUManager
        preconditions: []
        side_effects:
          - "Claim.status: UNDER_SIU_REVIEW|PAYMENT_DELAYED → PENDING (re-release to adjuster); payment_hold_reason := null"
      - from: DECISION_PENDING
        to: CLOSED_INSUFFICIENT
        trigger: "POST /siu/cases/{caseId}/close (closed_reason=INSUFFICIENT_EVIDENCE)"
        actor: SIUManager
        preconditions: []
        side_effects:
          - "Claim.status: UNDER_SIU_REVIEW|PAYMENT_DELAYED → PENDING; payment_hold_reason := null"
      - from: CLOSED_SUBSTANTIATED
        to: REFERRED_TO_BUREAU
        trigger: "POST /siu/cases/{caseId}/bureau-referrals/{referralId}/file (when bureau referral reaches FILED)"
        actor: SIUManager
        preconditions:
          - "Bureau referral late_filing computed; if filed_at > deadline_at → status=LATE_FILED but case still transitions"
        side_effects:
          - "FraudBureauReferral.status: DRAFT → FILED; filed_at = now"
      - from: OPEN
        to: CLOSED_INSUFFICIENT
        trigger: "POST /siu/cases/{caseId}/close (closed_reason=INSUFFICIENT_EVIDENCE)"
        actor: SIUManager
        preconditions:
          - "No Evidence in ADMITTED status exists"
        side_effects:
          - "Claim.status: UNDER_SIU_REVIEW → PENDING; payment_hold_reason := null"

  - entity: RedFlagReferral
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, DECLINED, DUPLICATE_LINKED]
    transitions:
      - from: SUBMITTED
        to: TRIAGED
        trigger: "POST /siu/referrals/{referralId}/triage"
        actor: SIUManager
        preconditions: []
        side_effects:
          - "Recompute suspicion_score and score_band (calculations.red_flag_score)"
      - from: TRIAGED
        to: ACCEPTED
        trigger: "POST /siu/referrals/{referralId}/accept"
        actor: SIUManager
        preconditions:
          - "claim.status == PENDING (else ERR_CLAIM_ALREADY_UNDER_SIU)"
          - "No non-terminal SIUCase for claim"
        side_effects:
          - "Auto-create SIUCase with opened_by_referral_id = this referral"
          - "Claim.status: PENDING → UNDER_SIU_REVIEW"
      - from: TRIAGED
        to: DECLINED
        trigger: "POST /siu/referrals/{referralId}/decline"
        actor: SIUManager
        preconditions:
          - "decline_reason must be non-empty"
        side_effects: []
      - from: TRIAGED
        to: DUPLICATE_LINKED
        trigger: "POST /siu/referrals/{referralId}/link-duplicate"
        actor: SIUManager
        preconditions:
          - "duplicate_of_referral_id references a RedFlagReferral in ACCEPTED status"
          - "Referral.claim_id == duplicate_of.claim_id"
        side_effects: []

  - entity: Claim
    initial_state: PENDING
    terminal_states: [DENIED, PAID, CLOSED]
    transitions:
      - from: PENDING
        to: UNDER_SIU_REVIEW
        trigger: "system (on RedFlagReferral ACCEPTED)"
        actor: system
        preconditions: []
        side_effects:
          - "payment_hold_reason := SIU_INVESTIGATION"
      - from: UNDER_SIU_REVIEW
        to: PAYMENT_DELAYED
        trigger: "POST /siu/claims/{claimId}/delay-payment"
        actor: Adjuster
        preconditions:
          - "Case for this claim is in UNDER_INVESTIGATION or EUO_PENDING or DECISION_PENDING"
          - "Delay must not exceed statutory window (delay_until <= now + state delay cap)"
        side_effects: []
      - from: PAYMENT_DELAYED
        to: UNDER_SIU_REVIEW
        trigger: "POST /siu/claims/{claimId}/release-delay"
        actor: Adjuster
        preconditions: []
        side_effects: []
      - from: UNDER_SIU_REVIEW
        to: DENIED
        trigger: "system (on SIUCase CLOSED_SUBSTANTIATED)"
        actor: system
        preconditions: []
        side_effects:
          - "payment_hold_reason := FRAUD_CONFIRMED"
      - from: PAYMENT_DELAYED
        to: DENIED
        trigger: "system (on SIUCase CLOSED_SUBSTANTIATED)"
        actor: system
        preconditions: []
        side_effects:
          - "payment_hold_reason := FRAUD_CONFIRMED"
      - from: UNDER_SIU_REVIEW
        to: PENDING
        trigger: "system (on SIUCase CLOSED_UNSUBSTANTIATED or CLOSED_INSUFFICIENT)"
        actor: system
        preconditions: []
        side_effects:
          - "payment_hold_reason := null"
      - from: PENDING
        to: PAID
        trigger: "POST /siu/claims/{claimId}/pay"
        actor: Adjuster
        preconditions:
          - "claim.status == PENDING (NOT UNDER_SIU_REVIEW or PAYMENT_DELAYED)"
          - "No SIUCase in non-terminal status for this claim"
        side_effects:
          - "paid_amount_cents := claimed_amount_cents"
      - from: PENDING
        to: CLOSED
        trigger: "POST /siu/claims/{claimId}/close-claim"
        actor: Adjuster
        preconditions: []
        side_effects: []

  - entity: Assignment
    initial_state: ACTIVE
    terminal_states: [REASSIGNED, COMPLETED, TERMINATED]
    transitions:
      - from: ACTIVE
        to: REASSIGNED
        trigger: "POST /siu/cases/{caseId}/assignments (new assignment on same case)"
        actor: SIUManager
        preconditions:
          - "Existing ACTIVE assignment on the case is automatically REASSIGNED"
        side_effects:
          - "Old assignment.status := REASSIGNED; old investigator.active_case_count -= 1"
          - "New assignment ACTIVE; new investigator.active_case_count += 1"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (on SIUCase terminal close)"
        actor: system
        preconditions: []
        side_effects:
          - "Investigator.active_case_count -= 1"
          - "completed_at := now"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /siu/assignments/{assignmentId}/terminate"
        actor: SIUManager
        preconditions:
          - "SIUCase.status NOT IN terminal_states"
        side_effects:
          - "Investigator.active_case_count -= 1"
          - "Case.assigned_investigator_id := null"
          - "Case.status: UNDER_INVESTIGATION → OPEN (bubble-up demotion)"

  - entity: Evidence
    initial_state: LOGGED
    terminal_states: [ADMITTED, EXCLUDED, SEALED]
    transitions:
      - from: LOGGED
        to: UNDER_REVIEW
        trigger: "POST /siu/cases/{caseId}/evidence/{evidenceId}/submit-review"
        actor: SIUInvestigator
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: ADMITTED
        trigger: "POST /siu/cases/{caseId}/evidence/{evidenceId}/admit"
        actor: SIUManager
        preconditions:
          - "Segregation of duties: admit actor MUST NOT equal evidence.submitted_by_investigator_id"
          - "Case NOT IN EUO_PENDING (frozen during EUO)"
        side_effects:
          - "If materiality=SUBSTANTIVE: case.substantiated_fraud_cents += fraud_amount_cents"
          - "Recompute bureau_referral_required on case"
      - from: UNDER_REVIEW
        to: EXCLUDED
        trigger: "POST /siu/cases/{caseId}/evidence/{evidenceId}/exclude"
        actor: SIUManager
        preconditions: []
        side_effects: []
      - from: ADMITTED
        to: SEALED
        trigger: "POST /siu/cases/{caseId}/evidence/{evidenceId}/seal"
        actor: SIUManager
        preconditions:
          - "Case.status == CLOSED_SUBSTANTIATED"
        side_effects:
          - "sealed_at := now"
          - "Sealed evidence is excluded from future recompute of substantiated_fraud_cents"
      - from: UNDER_REVIEW
        to: LOGGED
        trigger: "POST /siu/cases/{caseId}/evidence/{evidenceId}/return-for-more-work"
        actor: SIUManager
        preconditions: []
        side_effects: []
        note: "Cyclic review loop"

  - entity: EUOSession
    initial_state: SCHEDULED
    terminal_states: [CONDUCTED, NO_SHOW, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: NOTICE_SENT
        trigger: "POST /siu/cases/{caseId}/euo-sessions/{euoId}/send-notice"
        actor: SIUInvestigator
        preconditions:
          - "scheduled_start_at - now >= STATE_NOTICE_MIN_DAYS (typically 10d) — else ERR_EUO_NOTICE_WINDOW_VIOLATION"
        side_effects:
          - "notice_sent_at := now"
      - from: NOTICE_SENT
        to: CONDUCTED
        trigger: "POST /siu/cases/{caseId}/euo-sessions/{euoId}/conduct"
        actor: SIUInvestigator
        preconditions:
          - "now >= scheduled_start_at"
        side_effects:
          - "conducted_at := now; transcript_received := true"
          - "Case.status: EUO_PENDING → UNDER_INVESTIGATION"
      - from: NOTICE_SENT
        to: NO_SHOW
        trigger: "POST /siu/cases/{caseId}/euo-sessions/{euoId}/no-show"
        actor: SIUInvestigator
        preconditions:
          - "now >= scheduled_end_at"
        side_effects:
          - "no_show_count += 1"
          - "Case.status: EUO_PENDING → UNDER_INVESTIGATION"
          - "If no_show_count >= 2: Claim.payment_hold_reason := EUO_NONAPPEARANCE; Claim.status := PAYMENT_DELAYED"
      - from: SCHEDULED
        to: RESCHEDULED
        trigger: "POST /siu/cases/{caseId}/euo-sessions/{euoId}/reschedule"
        actor: SIUInvestigator
        preconditions:
          - "now < scheduled_start_at"
        side_effects:
          - "Create new EUOSession with new times; old session status := RESCHEDULED (terminal)"
      - from: NOTICE_SENT
        to: CANCELLED
        trigger: "POST /siu/cases/{caseId}/euo-sessions/{euoId}/cancel"
        actor: SIUManager
        preconditions:
          - "now < scheduled_start_at"
        side_effects:
          - "Case.status: EUO_PENDING → UNDER_INVESTIGATION"

  - entity: FraudBureauReferral
    initial_state: DRAFT
    terminal_states: [FILED, ACKNOWLEDGED, REJECTED_BY_BUREAU, LATE_FILED]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /siu/cases/{caseId}/bureau-referrals/{referralId}/file"
        actor: SIUManager
        preconditions:
          - "Case.status == CLOSED_SUBSTANTIATED"
        side_effects:
          - "filed_at := now; late_filing := (filed_at > deadline_at)"
          - "If late_filing: status := LATE_FILED; else status := FILED"
          - "Case.status: CLOSED_SUBSTANTIATED → REFERRED_TO_BUREAU"
      - from: FILED
        to: ACKNOWLEDGED
        trigger: "POST /siu/cases/{caseId}/bureau-referrals/{referralId}/acknowledge"
        actor: SIUManager
        preconditions: []
        side_effects:
          - "ack_received_at := now"
      - from: FILED
        to: REJECTED_BY_BUREAU
        trigger: "POST /siu/cases/{caseId}/bureau-referrals/{referralId}/reject"
        actor: SIUManager
        preconditions: []
        side_effects: []

  - entity: RestitutionLedger
    initial_state: OPEN
    terminal_states: [FULLY_RECOVERED, WRITTEN_OFF]
    transitions:
      - from: OPEN
        to: PARTIALLY_RECOVERED
        trigger: "system (on first RecoveryPayment reaching CLEARED)"
        actor: system
        preconditions: []
        side_effects:
          - "outstanding_amount_cents := target - recovered"
      - from: PARTIALLY_RECOVERED
        to: FULLY_RECOVERED
        trigger: "system (when outstanding_amount_cents reaches 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: WRITTEN_OFF
        trigger: "POST /siu/cases/{caseId}/restitution-ledgers/{ledgerId}/write-off"
        actor: SIUManager
        preconditions:
          - "outstanding_amount_cents > 0"
          - "Case.status IN terminal_states"
        side_effects: []
      - from: PARTIALLY_RECOVERED
        to: WRITTEN_OFF
        trigger: "POST /siu/cases/{caseId}/restitution-ledgers/{ledgerId}/write-off"
        actor: SIUManager
        preconditions:
          - "Case.status IN terminal_states"
        side_effects: []

  - entity: RecoveryPayment
    initial_state: PENDING
    terminal_states: [CLEARED, RETURNED, REVERSED]
    transitions:
      - from: PENDING
        to: CLEARED
        trigger: "POST /siu/ledgers/{ledgerId}/payments/{paymentId}/clear"
        actor: SIUManager
        preconditions: []
        side_effects:
          - "Ledger.recovered_amount_cents += amount_cents; recompute outstanding"
      - from: PENDING
        to: RETURNED
        trigger: "POST /siu/ledgers/{ledgerId}/payments/{paymentId}/return"
        actor: SIUManager
        preconditions: []
        side_effects: []
      - from: CLEARED
        to: REVERSED
        trigger: "POST /siu/ledgers/{ledgerId}/payments/{paymentId}/reverse"
        actor: SIUManager
        preconditions: []
        side_effects:
          - "Ledger.recovered_amount_cents -= amount_cents"
          - "Ledger.status: FULLY_RECOVERED → PARTIALLY_RECOVERED (compensation)"
          - "reversed_at := now"

  - entity: ProviderPattern
    initial_state: MONITORING
    terminal_states: [ESCALATED_TO_NICB, CLEARED, MERGED_INTO_RING]
    transitions:
      - from: MONITORING
        to: ESCALATED_TO_NICB
        trigger: "POST /siu/provider-patterns/{patternId}/escalate"
        actor: SIUManager
        preconditions:
          - "pattern_score >= ESCALATION_THRESHOLD (60)"
        side_effects: []
      - from: MONITORING
        to: CLEARED
        trigger: "POST /siu/provider-patterns/{patternId}/clear"
        actor: SIUManager
        preconditions:
          - "All linked cases are in terminal states"
        side_effects: []
      - from: MONITORING
        to: MERGED_INTO_RING
        trigger: "POST /siu/provider-patterns/{patternId}/merge"
        actor: SIUManager
        preconditions:
          - "parent_pattern_id references another ProviderPattern in MONITORING status"
          - "parent_pattern.ring_signature == this pattern.ring_signature"
        side_effects:
          - "linked_case_ids appended to parent_pattern"
          - "Recompute parent pattern_score"

  - entity: RegulatoryReport
    initial_state: DRAFT
    terminal_states: [SUBMITTED, ACCEPTED, REJECTED_BY_REGULATOR]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /siu/reports/{reportId}/submit"
        actor: SIUManager
        preconditions:
          - "All metrics computed (calculations.regulatory_report_metrics)"
        side_effects: []
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /siu/reports/{reportId}/accept"
        actor: SIUManager
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: REJECTED_BY_REGULATOR
        trigger: "POST /siu/reports/{reportId}/reject"
        actor: SIUManager
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: case-assignment-stale-case-version
    parent_entity: SIUCase
    write_endpoint: "POST /siu/cases/{caseId}/assignments"
    occ_field: "expected_case_version"
    description: |
      Creating an Assignment against an SIUCase whose version has advanced since
      the client last observed it is rejected. Captures the case where another
      SIUManager has just reassigned the case and the current writer's view is
      stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: evidence-admit-stale-case-version
    parent_entity: SIUCase
    write_endpoint: "POST /siu/cases/{caseId}/evidence/{evidenceId}/admit"
    occ_field: "expected_case_version"
    description: |
      Admitting evidence against an SIUCase whose version has advanced since
      the client last observed it is rejected. Captures the case where another
      admit/exclude/close has just mutated the case's substantiated_fraud_cents.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: bureau-filing-stale-referral-version
    parent_entity: FraudBureauReferral
    write_endpoint: "POST /siu/cases/{caseId}/bureau-referrals/{referralId}/file"
    occ_field: "expected_referral_version"
    description: |
      Filing a bureau referral whose version has advanced since the client last
      observed it is rejected. Prevents double-filing when an ack raced in.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: ledger-payment-clear-stale-ledger-version
    parent_entity: RestitutionLedger
    write_endpoint: "POST /siu/ledgers/{ledgerId}/payments/{paymentId}/clear"
    occ_field: "expected_ledger_version"
    description: |
      Clearing a payment against a ledger whose version has advanced is
      rejected. Prevents double-counting when two clears hit the same ledger.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: red_flag_score
    trigger: "On RedFlagReferral creation AND on triage recompute"
    algorithm: weighted_scoring
    description: "Multi-factor suspicion score from red-flag codes"
    input_set: "referral.red_flag_codes array"
    formula: |
      score = 0
      for code in red_flag_codes:
          score += CODE_WEIGHT[code]
      if len(red_flag_codes) >= 3:
          score += COMBINATION_BONUS
      if claim.claimed_amount_cents >= HIGH_VALUE_CLAIM_CENTS:
          score = round(score * HIGH_VALUE_MULTIPLIER)
      score_band = LOW if score < LOW_MAX else MEDIUM if score < MED_MAX else HIGH if score < HIGH_MAX else CRITICAL
    constants:
      CODE_WEIGHT:
        PRIOR_FRAUD_CONVICTION: 35
        STAGED_ACCIDENT_PATTERN: 25
        INFLATED_BILLING: 20
        PHANTOM_TREATMENT: 22
        UNWITNESSED_LOSS: 12
        POST_POLICY_BIND_CLAIM: 15
        IDENTITY_MISMATCH: 18
        DUPLICATE_CLAIM_CROSS_INSURER: 30
        EXCESSIVE_TREATMENT_FREQUENCY: 14
        PROVIDER_ON_WATCHLIST: 28
      COMBINATION_BONUS: 15
      HIGH_VALUE_CLAIM_CENTS: 25000000
      HIGH_VALUE_MULTIPLIER: 1.25
      LOW_MAX: 20
      MED_MAX: 40
      HIGH_MAX: 70
    precision: "integer score; round_half_up when multiplying"
    variants:
      - name: provisional_at_intake
        when: "At referral creation"
        difference: "Uses raw formula above"
      - name: triage_adjusted
        when: "At TRIAGED transition; SIUManager may pass modifier_overrides {code:weight} replacing CODE_WEIGHT for that recompute"
        difference: "Same shape but with override map; produces different score than provisional for identical input codes"

  - name: substantiated_fraud_total
    trigger: "On every Evidence transition to ADMITTED (forward) and on any Evidence transition out of ADMITTED to SEALED (compensation)"
    algorithm: aggregation
    description: "Running total of substantiated fraud on a case"
    input_set: "Evidence rows for case WHERE status=ADMITTED AND materiality=SUBSTANTIVE"
    formula: |
      substantiated_fraud_cents = sum(evidence.fraud_amount_cents for evidence in case.evidence
                                     WHERE evidence.status == ADMITTED
                                     AND evidence.materiality == SUBSTANTIVE)
      bureau_referral_required = (substantiated_fraud_cents >= BUREAU_REFERRAL_MIN_CENTS) OR
                                 (claim.state_code IN MANDATORY_REFERRAL_STATES AND substantiated_fraud_cents > 0)
    constants:
      BUREAU_REFERRAL_MIN_CENTS: 500000
      MANDATORY_REFERRAL_STATES: ["CA", "FL", "NY", "NJ"]
    precision: "integer cents, no rounding"
    variants:
      - name: provisional_at_admit
        when: "Evidence admitted while case OPEN/UNDER_INVESTIGATION"
        difference: "Updates running total only; does not gate closure"
      - name: final_at_close
        when: "Case closes as CLOSED_SUBSTANTIATED"
        difference: "Ledger target is locked to this snapshot; sealed evidence subtracts from total"

  - name: provider_pattern_score
    trigger: "On ProviderPattern creation AND whenever a case is linked (case closes substantiated with provider evidence)"
    algorithm: weighted_scoring
    description: "Organized-ring pattern scoring"
    input_set: "linked_case_ids, evidence types across linked cases, claim states"
    formula: |
      base = len(linked_case_ids) * PER_CASE_WEIGHT
      if len(linked_case_ids) >= RING_SIZE_THRESHOLD:
          base += RING_BONUS
      distinct_states = len({claim.state_code for case in linked_cases})
      if distinct_states >= 2:
          base += MULTI_STATE_BONUS
      distinct_evidence_types = len({evidence.evidence_type across linked case evidence with status=ADMITTED})
      score = base + distinct_evidence_types * EVIDENCE_DIVERSITY_WEIGHT
      score = min(score, MAX_SCORE)
    constants:
      PER_CASE_WEIGHT: 12
      RING_SIZE_THRESHOLD: 3
      RING_BONUS: 20
      MULTI_STATE_BONUS: 15
      EVIDENCE_DIVERSITY_WEIGHT: 4
      MAX_SCORE: 100
      ESCALATION_THRESHOLD: 60
    precision: "integer score, cap at MAX_SCORE"
    variants:
      - name: standard
        when: "Default computation"
        difference: "Uses constants as declared"
      - name: merged_into_ring
        when: "Pattern is MERGED_INTO_RING; parent score uses combined linked_case_ids"
        difference: "Parent's score counts merged children — same formula but expanded input_set"

  - name: regulatory_report_metrics
    trigger: "On RegulatoryReport submit"
    algorithm: aggregation
    description: "Computes the four metric fields for a period+state"
    input_set: "All SIUCase with claim.state_code=report.state_code overlapping period"
    formula: |
      total_cases_opened = count(case where case.created_at in [period_start_at, period_end_at))
      total_cases_closed_substantiated = count(case where case.status==CLOSED_SUBSTANTIATED AND case.updated_at in [period_start_at, period_end_at))
      total_restitution_recovered_cents = sum(recovery_payment.amount_cents
                                              WHERE recovery_payment.status==CLEARED
                                              AND recovery_payment.received_at in [period_start_at, period_end_at)
                                              AND ledger.case.claim.state_code == report.state_code)
      late_bureau_filings = count(bureau_referral where late_filing==true
                                   AND filed_at in [period_start_at, period_end_at)
                                   AND state_code == report.state_code)
    constants: {}
    precision: "integers and cents, no rounding"

  - name: bureau_deadline_computation
    trigger: "On case CLOSED_SUBSTANTIATED transition (creates FraudBureauReferral)"
    algorithm: threshold
    description: "Per-state bureau filing deadline"
    input_set: "claim.state_code"
    formula: |
      window_days = STATE_BUREAU_WINDOW_DAYS.get(claim.state_code, DEFAULT_BUREAU_WINDOW_DAYS)
      deadline_at = case.closed_at + window_days * 86400 seconds
      # Boundary: filing exactly at deadline_at is ON TIME (filed_at <= deadline_at)
      # late_filing := filed_at > deadline_at  (strict greater-than)
    constants:
      STATE_BUREAU_WINDOW_DAYS:
        CA: 30
        NY: 30
        FL: 60
        NJ: 45
        TX: 30
      DEFAULT_BUREAU_WINDOW_DAYS: 45
    precision: "second-precision timestamps"

  - name: payment_delay_window
    trigger: "On POST /siu/claims/{claimId}/delay-payment"
    algorithm: threshold
    description: "Statutory payment-delay window per state; exceeding rejects"
    input_set: "claim.state_code, requested delay_until"
    formula: |
      cap_days = STATE_DELAY_CAP_DAYS.get(claim.state_code, DEFAULT_DELAY_CAP_DAYS)
      max_delay_until = now + cap_days * 86400
      if delay_until > max_delay_until: reject ERR_DELAY_WINDOW_EXCEEDED
      # Boundary: delay_until == max_delay_until is allowed (<=)
    constants:
      STATE_DELAY_CAP_DAYS:
        CA: 30
        NY: 30
        FL: 90
        NJ: 60
        TX: 45
      DEFAULT_DELAY_CAP_DAYS: 30
    precision: "second-precision"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is authorized for the endpoint per §1.7 RBAC"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path-templated resource ids (claim_id, case_id, evidence_id, etc.) resolve"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Body-referenced FK ids resolve (e.g., duplicate_of_referral_id, parent_pattern_id)"
    error_id: ERR_FK_NOT_FOUND
    http_status: 404
    applies_to: "POST endpoints with FK fields in body"
  - priority: 5
    category: state
    check: "Target resource state-machine precondition holds (e.g., referral in TRIAGED for accept)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: state
    check: "Cross-entity state guard (e.g., case for claim must be UNDER_INVESTIGATION to admit evidence)"
    error_id: ERR_CASE_NOT_IN_REQUIRED_STATE
    http_status: 409
    applies_to: "action endpoints gated on parent case status"
  - priority: 7
    category: business_safety
    check: "Segregation-of-duties: actor not same user as prior step's actor"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /siu/cases/{caseId}/evidence/{evidenceId}/admit, POST /siu/cases/{caseId}/close, POST /siu/cases/{caseId}/bureau-referrals/{referralId}/acknowledge"
  - priority: 8
    category: business_safety
    check: "Investigator eligibility: status=ACTIVE, state_certifications contain claim.state_code, active_case_count < max_active_cases"
    error_id: ERR_INVESTIGATOR_INELIGIBLE
    http_status: 422
    applies_to: "POST /siu/cases/{caseId}/assignments"
  - priority: 9
    category: business_temporal
    check: "EUO notice window: scheduled_start_at - now >= STATE_NOTICE_MIN_DAYS"
    error_id: ERR_EUO_NOTICE_WINDOW_VIOLATION
    http_status: 422
    applies_to: "POST /siu/cases/{caseId}/euo-sessions/{euoId}/send-notice"
  - priority: 10
    category: business_temporal
    check: "EUO temporal ordering: scheduled_end_at > scheduled_start_at; no overlap with another active session for same case"
    error_id: ERR_EUO_TEMPORAL_CONFLICT
    http_status: 422
    applies_to: "POST /siu/cases/{caseId}/euo-sessions"
  - priority: 11
    category: business_temporal
    check: "Payment delay window: delay_until <= now + state cap days"
    error_id: ERR_DELAY_WINDOW_EXCEEDED
    http_status: 422
    applies_to: "POST /siu/claims/{claimId}/delay-payment"
  - priority: 12
    category: business_constraint
    check: "Uniqueness: at most one non-terminal SIUCase per claim"
    error_id: ERR_CASE_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /siu/referrals/{referralId}/accept"
  - priority: 13
    category: business_constraint
    check: "EUO required flag consistency: cannot transition to EUO_PENDING unless euo_required==true"
    error_id: ERR_EUO_NOT_REQUIRED
    http_status: 422
    applies_to: "POST /siu/cases/{caseId}/euo-sessions"
  - priority: 14
    category: business_constraint
    check: "Materiality vs amount consistency: materiality=SUBSTANTIVE requires fraud_amount_cents > 0"
    error_id: ERR_MATERIALITY_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /siu/cases/{caseId}/evidence"
  - priority: 15
    category: business_constraint
    check: "Duplicate referral linkage integrity: duplicate_of must be ACCEPTED and same claim_id"
    error_id: ERR_DUPLICATE_LINK_INVALID
    http_status: 422
    applies_to: "POST /siu/referrals/{referralId}/link-duplicate"
  - priority: 16
    category: business_referential
    check: "Provider pattern merge integrity: parent_pattern must exist, MONITORING, ring_signature match, and not self"
    error_id: ERR_PATTERN_MERGE_INVALID
    http_status: 422
    applies_to: "POST /siu/provider-patterns/{patternId}/merge"
  - priority: 17
    category: business_fiscal
    check: "RecoveryPayment.amount_cents must not exceed ledger.outstanding_amount_cents at time of clear"
    error_id: ERR_RECOVERY_EXCEEDS_OUTSTANDING
    http_status: 422
    applies_to: "POST /siu/ledgers/{ledgerId}/payments/{paymentId}/clear"
  - priority: 18
    category: business_fiscal
    check: "Restitution target: target_amount_cents > 0 AND target <= claim.claimed_amount_cents"
    error_id: ERR_RESTITUTION_TARGET_INVALID
    http_status: 422
    applies_to: "POST /siu/cases/{caseId}/restitution-ledgers"
  - priority: 19
    category: business_temporal
    check: "TrainingRecord valid_until > completed_at AND credit_hours >= 1"
    error_id: ERR_TRAINING_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /siu/investigators/{investigatorId}/training-records"
  - priority: 20
    category: business_constraint
    check: "Report period: period_end_at > period_start_at AND period_end_at <= now"
    error_id: ERR_REPORT_PERIOD_INVALID
    http_status: 422
    applies_to: "POST /siu/reports"
  - priority: 21
    category: state
    check: "OCC optimistic concurrency: expected_<parent>_version matches current"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /siu/cases/{caseId}/assignments, POST /siu/cases/{caseId}/evidence/{evidenceId}/admit, POST /siu/cases/{caseId}/bureau-referrals/{referralId}/file, POST /siu/ledgers/{ledgerId}/payments/{paymentId}/clear"
  - priority: 22
    category: business_temporal
    check: "Bureau referral deadline: late_filing computed; filing always allowed but flagged"
    error_id: ERR_BUREAU_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /siu/cases/{caseId}/bureau-referrals/{referralId}/file"
    note: "This validation never blocks filing; it only fires when strict-mode flag enforce_bureau_deadline=true is passed in body. Default false."

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ----- claims -----
  - { method: POST, path: "/siu/claims", description: "Register a new claim", roles: [Adjuster], code: 201, input: [policy_number, state_code, adjuster_id, claimed_amount_cents], output: Claim, side_effects: [] }
  - { method: GET, path: "/siu/claims/{claimId}", description: "Fetch claim", roles: [Adjuster, SIUManager, SIUInvestigator, SIUComplianceOfficer], code: 200, input: [], output: Claim, side_effects: [] }
  - { method: GET, path: "/siu/claims", description: "List claims (filterable)", roles: [Adjuster, SIUManager, SIUInvestigator, SIUComplianceOfficer], code: 200, input: ["status?", "state_code?", "adjuster_id?"], output: "Claim[]", side_effects: [] }
  - { method: POST, path: "/siu/claims/{claimId}/pay", description: "Mark claim paid", roles: [Adjuster], code: 200, input: [], output: Claim, side_effects: ["Claim.status := PAID"] }
  - { method: POST, path: "/siu/claims/{claimId}/close-claim", description: "Close claim without payment", roles: [Adjuster], code: 200, input: [], output: Claim, side_effects: [] }
  - { method: POST, path: "/siu/claims/{claimId}/delay-payment", description: "Adjuster-driven payment delay under SIU coordination", roles: [Adjuster], code: 200, input: [delay_until, reason], output: Claim, side_effects: ["Claim.status := PAYMENT_DELAYED"] }
  - { method: POST, path: "/siu/claims/{claimId}/release-delay", description: "Release payment delay", roles: [Adjuster], code: 200, input: [], output: Claim, side_effects: ["Claim.status := UNDER_SIU_REVIEW"] }
  - { method: GET, path: "/siu/claims/{claimId}/cases", description: "Cases for a claim", roles: [Adjuster, SIUManager, SIUInvestigator, SIUComplianceOfficer], code: 200, input: [], output: "SIUCase[]", side_effects: [] }
  - { method: GET, path: "/siu/claims/{claimId}/referrals", description: "Referrals for a claim", roles: [Adjuster, SIUManager, SIUInvestigator, SIUComplianceOfficer], code: 200, input: [], output: "RedFlagReferral[]", side_effects: [] }

  # ----- adjusters -----
  - { method: POST, path: "/siu/adjusters", description: "Register adjuster", roles: [SIUManager], code: 201, input: [full_name, email, state_licenses], output: Adjuster, side_effects: [] }
  - { method: GET, path: "/siu/adjusters/{adjusterId}", description: "Fetch adjuster", roles: [Adjuster, SIUManager, SIUComplianceOfficer], code: 200, input: [], output: Adjuster, side_effects: [] }

  # ----- referrals -----
  - { method: POST, path: "/siu/referrals", description: "Submit red-flag referral", roles: [Adjuster, SIUInvestigator], code: 201, input: [claim_id, submitted_by_role, red_flag_codes, narrative], output: RedFlagReferral, side_effects: ["Compute suspicion_score via calculations.red_flag_score"] }
  - { method: GET, path: "/siu/referrals/{referralId}", description: "Fetch referral", roles: [Adjuster, SIUManager, SIUInvestigator, SIUComplianceOfficer], code: 200, input: [], output: RedFlagReferral, side_effects: [] }
  - { method: GET, path: "/siu/referrals", description: "List referrals (filterable)", roles: [SIUManager, SIUInvestigator, SIUComplianceOfficer], code: 200, input: ["status?", "claim_id?", "score_band?", "duplicate_of_referral_id?"], output: "RedFlagReferral[]", side_effects: [] }
  - { method: POST, path: "/siu/referrals/{referralId}/triage", description: "Triage referral", roles: [SIUManager], code: 200, input: ["modifier_overrides?"], output: RedFlagReferral, side_effects: ["Recompute score per triage_adjusted variant"] }
  - { method: POST, path: "/siu/referrals/{referralId}/accept", description: "Accept referral; creates SIUCase", roles: [SIUManager], code: 201, input: [], output: SIUCase, side_effects: ["Create SIUCase", "Claim.status := UNDER_SIU_REVIEW"] }
  - { method: POST, path: "/siu/referrals/{referralId}/decline", description: "Decline referral", roles: [SIUManager], code: 200, input: [decline_reason], output: RedFlagReferral, side_effects: [] }
  - { method: POST, path: "/siu/referrals/{referralId}/link-duplicate", description: "Link as duplicate", roles: [SIUManager], code: 200, input: [duplicate_of_referral_id], output: RedFlagReferral, side_effects: [] }

  # ----- cases -----
  - { method: GET, path: "/siu/cases/{caseId}", description: "Fetch case", roles: [Adjuster, SIUManager, SIUInvestigator, SIUComplianceOfficer], code: 200, input: [], output: SIUCase, side_effects: [] }
  - { method: GET, path: "/siu/cases", description: "List cases", roles: [Adjuster, SIUManager, SIUInvestigator, SIUComplianceOfficer], code: 200, input: ["status?", "state_code?", "assigned_investigator_id?", "priority?", "claim_id?", "opened_by_referral_id?"], output: "SIUCase[]", side_effects: [] }
  - { method: POST, path: "/siu/cases/{caseId}/open", description: "Open an INTAKE case", roles: [SIUManager], code: 200, input: [], output: SIUCase, side_effects: ["Snapshot suspicion_score", "Compute deadlines"] }
  - { method: POST, path: "/siu/cases/{caseId}/submit-for-decision", description: "Investigator submits case for decision", roles: [SIUInvestigator], code: 200, input: [], output: SIUCase, side_effects: ["Set decision_due_at"] }
  - { method: POST, path: "/siu/cases/{caseId}/close", description: "Close case", roles: [SIUManager], code: 200, input: [closed_reason], output: SIUCase, side_effects: ["Claim status update", "Create RestitutionLedger if substantiated", "Auto-create FraudBureauReferral if required"] }

  # ----- investigators -----
  - { method: POST, path: "/siu/investigators", description: "Register investigator", roles: [SIUManager], code: 201, input: [full_name, email, badge_number, state_certifications, max_active_cases], output: Investigator, side_effects: [] }
  - { method: GET, path: "/siu/investigators/{investigatorId}", description: "Fetch investigator", roles: [SIUManager, SIUInvestigator, SIUComplianceOfficer], code: 200, input: [], output: Investigator, side_effects: [] }
  - { method: GET, path: "/siu/investigators", description: "List investigators", roles: [SIUManager, SIUComplianceOfficer], code: 200, input: ["status?"], output: "Investigator[]", side_effects: [] }
  - { method: GET, path: "/siu/investigators/{investigatorId}/assignments", description: "Assignments for investigator", roles: [SIUManager, SIUInvestigator, SIUComplianceOfficer], code: 200, input: [], output: "Assignment[]", side_effects: [] }
  - { method: GET, path: "/siu/investigators/{investigatorId}/training-records", description: "Training records", roles: [SIUManager, SIUInvestigator, SIUComplianceOfficer], code: 200, input: [], output: "TrainingRecord[]", side_effects: [] }
  - { method: GET, path: "/siu/training-records", description: "List all training records (filterable)", roles: [SIUManager, SIUInvestigator, SIUComplianceOfficer], code: 200, input: ["investigator_id?", "course_code?"], output: "TrainingRecord[]", side_effects: [] }
  - { method: GET, path: "/siu/training-records/{recordId}", description: "Fetch training record by id", roles: [SIUManager, SIUInvestigator, SIUComplianceOfficer], code: 200, input: [], output: TrainingRecord, side_effects: [] }
  - { method: POST, path: "/siu/investigators/{investigatorId}/training-records", description: "Log training", roles: [SIUInvestigator, SIUManager], code: 201, input: [course_code, completed_at, valid_until, credit_hours], output: TrainingRecord, side_effects: ["Recompute investigator.training_current_through"] }
  - { method: POST, path: "/siu/investigators/{investigatorId}/suspend", description: "Suspend investigator", roles: [SIUManager], code: 200, input: [reason], output: Investigator, side_effects: ["Status := SUSPENDED; active assignments unaffected"] }
  - { method: POST, path: "/siu/investigators/{investigatorId}/reinstate", description: "Reinstate investigator", roles: [SIUManager], code: 200, input: [], output: Investigator, side_effects: ["Status := ACTIVE"] }

  # ----- assignments -----
  - { method: POST, path: "/siu/cases/{caseId}/assignments", description: "Assign investigator (OCC on case)", roles: [SIUManager], code: 201, input: [investigator_id, expected_case_version], output: Assignment, side_effects: ["Old ACTIVE assignment → REASSIGNED", "Update investigator active_case_count", "Increments SIUCase.version by 1"] }
  - { method: GET, path: "/siu/assignments/{assignmentId}", description: "Fetch assignment", roles: [SIUManager, SIUInvestigator, SIUComplianceOfficer], code: 200, input: [], output: Assignment, side_effects: [] }
  - { method: GET, path: "/siu/cases/{caseId}/assignments", description: "Assignments for case", roles: [SIUManager, SIUInvestigator, SIUComplianceOfficer], code: 200, input: [], output: "Assignment[]", side_effects: [] }
  - { method: GET, path: "/siu/assignments", description: "List assignments (filterable)", roles: [SIUManager, SIUInvestigator, SIUComplianceOfficer], code: 200, input: ["case_id?", "investigator_id?", "status?"], output: "Assignment[]", side_effects: [] }
  - { method: POST, path: "/siu/assignments/{assignmentId}/terminate", description: "Terminate active assignment", roles: [SIUManager], code: 200, input: [reason], output: Assignment, side_effects: ["Investigator.active_case_count -= 1", "Case demoted UNDER_INVESTIGATION → OPEN"] }

  # ----- evidence -----
  - { method: POST, path: "/siu/cases/{caseId}/evidence", description: "Log evidence", roles: [SIUInvestigator], code: 201, input: [evidence_type, collected_at, custodian, materiality, fraud_amount_cents], output: Evidence, side_effects: [] }
  - { method: GET, path: "/siu/cases/{caseId}/evidence/{evidenceId}", description: "Fetch evidence", roles: [SIUManager, SIUInvestigator, SIUComplianceOfficer], code: 200, input: [], output: Evidence, side_effects: [] }
  - { method: GET, path: "/siu/cases/{caseId}/evidence", description: "List evidence for case", roles: [SIUManager, SIUInvestigator, SIUComplianceOfficer], code: 200, input: ["status?", "evidence_type?"], output: "Evidence[]", side_effects: [] }
  - { method: GET, path: "/siu/evidence", description: "List all evidence (filterable)", roles: [SIUManager, SIUInvestigator, SIUComplianceOfficer], code: 200, input: ["case_id?", "submitted_by_investigator_id?", "status?", "evidence_type?"], output: "Evidence[]", side_effects: [] }
  - { method: GET, path: "/siu/evidence/{evidenceId}", description: "Fetch evidence by id", roles: [SIUManager, SIUInvestigator, SIUComplianceOfficer], code: 200, input: [], output: Evidence, side_effects: [] }
  - { method: POST, path: "/siu/cases/{caseId}/evidence/{evidenceId}/submit-review", description: "Submit for review", roles: [SIUInvestigator], code: 200, input: [], output: Evidence, side_effects: [] }
  - { method: POST, path: "/siu/cases/{caseId}/evidence/{evidenceId}/admit", description: "Admit evidence (OCC on case)", roles: [SIUManager], code: 200, input: [expected_case_version], output: Evidence, side_effects: ["If SUBSTANTIVE: case.substantiated_fraud_cents += fraud_amount_cents", "Increments SIUCase.version by 1"] }
  - { method: POST, path: "/siu/cases/{caseId}/evidence/{evidenceId}/exclude", description: "Exclude evidence", roles: [SIUManager], code: 200, input: [reason], output: Evidence, side_effects: [] }
  - { method: POST, path: "/siu/cases/{caseId}/evidence/{evidenceId}/return-for-more-work", description: "Return evidence to LOGGED", roles: [SIUManager], code: 200, input: [note], output: Evidence, side_effects: [] }
  - { method: POST, path: "/siu/cases/{caseId}/evidence/{evidenceId}/seal", description: "Seal admitted evidence post-closure", roles: [SIUManager], code: 200, input: [], output: Evidence, side_effects: ["sealed_at := now", "subtract from substantiated_fraud_cents if SUBSTANTIVE"] }

  # ----- EUO -----
  - { method: POST, path: "/siu/cases/{caseId}/euo-sessions", description: "Schedule EUO", roles: [SIUInvestigator], code: 201, input: [scheduled_start_at, scheduled_end_at, location, insured_attendee_name], output: EUOSession, side_effects: ["Case.status: UNDER_INVESTIGATION → EUO_PENDING (if first session)"] }
  - { method: GET, path: "/siu/cases/{caseId}/euo-sessions", description: "List EUOs for case", roles: [SIUManager, SIUInvestigator, SIUComplianceOfficer], code: 200, input: ["status?"], output: "EUOSession[]", side_effects: [] }
  - { method: GET, path: "/siu/euo-sessions", description: "List all EUO sessions (filterable)", roles: [SIUManager, SIUInvestigator, SIUComplianceOfficer], code: 200, input: ["case_id?", "status?"], output: "EUOSession[]", side_effects: [] }
  - { method: GET, path: "/siu/euo-sessions/{euoId}", description: "Fetch EUO session by id", roles: [SIUManager, SIUInvestigator, SIUComplianceOfficer], code: 200, input: [], output: EUOSession, side_effects: [] }
  - { method: GET, path: "/siu/cases/{caseId}/euo-sessions/{euoId}", description: "Fetch EUO", roles: [SIUManager, SIUInvestigator, SIUComplianceOfficer], code: 200, input: [], output: EUOSession, side_effects: [] }
  - { method: POST, path: "/siu/cases/{caseId}/euo-sessions/{euoId}/send-notice", description: "Send EUO notice", roles: [SIUInvestigator], code: 200, input: [], output: EUOSession, side_effects: ["notice_sent_at := now"] }
  - { method: POST, path: "/siu/cases/{caseId}/euo-sessions/{euoId}/conduct", description: "Mark EUO conducted", roles: [SIUInvestigator], code: 200, input: [], output: EUOSession, side_effects: ["Case.status: EUO_PENDING → UNDER_INVESTIGATION"] }
  - { method: POST, path: "/siu/cases/{caseId}/euo-sessions/{euoId}/no-show", description: "Mark EUO no-show", roles: [SIUInvestigator], code: 200, input: [], output: EUOSession, side_effects: ["no_show_count += 1", "Possibly Claim.payment_hold_reason := EUO_NONAPPEARANCE"] }
  - { method: POST, path: "/siu/cases/{caseId}/euo-sessions/{euoId}/reschedule", description: "Reschedule EUO (creates new session)", roles: [SIUInvestigator], code: 201, input: [scheduled_start_at, scheduled_end_at, location], output: EUOSession, side_effects: ["Old session → RESCHEDULED"] }
  - { method: POST, path: "/siu/cases/{caseId}/euo-sessions/{euoId}/cancel", description: "Cancel EUO", roles: [SIUManager], code: 200, input: [reason], output: EUOSession, side_effects: ["Case.status: EUO_PENDING → UNDER_INVESTIGATION"] }

  # ----- bureau referral -----
  - { method: GET, path: "/siu/cases/{caseId}/bureau-referrals", description: "List bureau referrals for case", roles: [SIUManager, SIUInvestigator, SIUComplianceOfficer], code: 200, input: [], output: "FraudBureauReferral[]", side_effects: [] }
  - { method: GET, path: "/siu/bureau-referrals", description: "List all bureau referrals (filterable)", roles: [SIUManager, SIUInvestigator, SIUComplianceOfficer], code: 200, input: ["case_id?", "status?", "state_code?"], output: "FraudBureauReferral[]", side_effects: [] }
  - { method: GET, path: "/siu/bureau-referrals/{referralId}", description: "Fetch bureau referral by id", roles: [SIUManager, SIUComplianceOfficer], code: 200, input: [], output: FraudBureauReferral, side_effects: [] }
  - { method: GET, path: "/siu/cases/{caseId}/bureau-referrals/{referralId}", description: "Fetch bureau referral", roles: [SIUManager, SIUComplianceOfficer], code: 200, input: [], output: FraudBureauReferral, side_effects: [] }
  - { method: POST, path: "/siu/cases/{caseId}/bureau-referrals/{referralId}/file", description: "File bureau referral (OCC on referral)", roles: [SIUManager], code: 200, input: [expected_referral_version, "enforce_bureau_deadline?"], output: FraudBureauReferral, side_effects: ["filed_at := now", "case.status := REFERRED_TO_BUREAU", "Increments FraudBureauReferral.version by 1"] }
  - { method: POST, path: "/siu/cases/{caseId}/bureau-referrals/{referralId}/acknowledge", description: "Record bureau ack", roles: [SIUManager], code: 200, input: [], output: FraudBureauReferral, side_effects: ["ack_received_at := now"] }
  - { method: POST, path: "/siu/cases/{caseId}/bureau-referrals/{referralId}/reject", description: "Record bureau rejection", roles: [SIUManager], code: 200, input: [reason], output: FraudBureauReferral, side_effects: [] }

  # ----- provider patterns -----
  - { method: POST, path: "/siu/provider-patterns", description: "Register provider pattern", roles: [SIUInvestigator, SIUManager], code: 201, input: [provider_npi, provider_name, ring_signature], output: ProviderPattern, side_effects: [] }
  - { method: GET, path: "/siu/provider-patterns/{patternId}", description: "Fetch pattern", roles: [SIUManager, SIUInvestigator, SIUComplianceOfficer], code: 200, input: [], output: ProviderPattern, side_effects: [] }
  - { method: GET, path: "/siu/provider-patterns", description: "List patterns", roles: [SIUManager, SIUInvestigator, SIUComplianceOfficer], code: 200, input: ["escalation_status?", "ring_signature?", "parent_pattern_id?"], output: "ProviderPattern[]", side_effects: [] }
  - { method: POST, path: "/siu/provider-patterns/{patternId}/escalate", description: "Escalate to NICB", roles: [SIUManager], code: 200, input: [], output: ProviderPattern, side_effects: [] }
  - { method: POST, path: "/siu/provider-patterns/{patternId}/clear", description: "Clear pattern", roles: [SIUManager], code: 200, input: [], output: ProviderPattern, side_effects: [] }
  - { method: POST, path: "/siu/provider-patterns/{patternId}/merge", description: "Merge into another pattern", roles: [SIUManager], code: 200, input: [parent_pattern_id], output: ProviderPattern, side_effects: ["linked_case_ids appended to parent", "Recompute parent score"] }

  # ----- restitution -----
  - { method: POST, path: "/siu/cases/{caseId}/restitution-ledgers", description: "Manually create restitution ledger (when not auto-created)", roles: [SIUManager], code: 201, input: [target_amount_cents], output: RestitutionLedger, side_effects: [] }
  - { method: GET, path: "/siu/cases/{caseId}/restitution-ledgers", description: "List ledgers for case", roles: [SIUManager, SIUInvestigator, SIUComplianceOfficer], code: 200, input: [], output: "RestitutionLedger[]", side_effects: [] }
  - { method: GET, path: "/siu/ledgers", description: "List all ledgers (filterable)", roles: [SIUManager, SIUInvestigator, SIUComplianceOfficer], code: 200, input: ["case_id?", "status?"], output: "RestitutionLedger[]", side_effects: [] }
  - { method: GET, path: "/siu/ledgers/{ledgerId}", description: "Fetch ledger", roles: [SIUManager, SIUComplianceOfficer], code: 200, input: [], output: RestitutionLedger, side_effects: [] }
  - { method: GET, path: "/siu/ledgers/{ledgerId}/payments", description: "List payments", roles: [SIUManager, SIUComplianceOfficer], code: 200, input: [], output: "RecoveryPayment[]", side_effects: [] }
  - { method: GET, path: "/siu/recovery-payments", description: "List all recovery payments (filterable)", roles: [SIUManager, SIUComplianceOfficer], code: 200, input: ["ledger_id?", "status?", "method?"], output: "RecoveryPayment[]", side_effects: [] }
  - { method: GET, path: "/siu/recovery-payments/{paymentId}", description: "Fetch recovery payment by id", roles: [SIUManager, SIUComplianceOfficer], code: 200, input: [], output: RecoveryPayment, side_effects: [] }
  - { method: POST, path: "/siu/ledgers/{ledgerId}/payments", description: "Record recovery payment", roles: [SIUManager], code: 201, input: [amount_cents, received_at, method], output: RecoveryPayment, side_effects: [] }
  - { method: POST, path: "/siu/ledgers/{ledgerId}/payments/{paymentId}/clear", description: "Clear payment (OCC on ledger)", roles: [SIUManager], code: 200, input: [expected_ledger_version], output: RecoveryPayment, side_effects: ["Ledger.recovered_amount_cents += amount", "Increments RestitutionLedger.version by 1"] }
  - { method: POST, path: "/siu/ledgers/{ledgerId}/payments/{paymentId}/return", description: "Return payment", roles: [SIUManager], code: 200, input: [reason], output: RecoveryPayment, side_effects: [] }
  - { method: POST, path: "/siu/ledgers/{ledgerId}/payments/{paymentId}/reverse", description: "Reverse cleared payment", roles: [SIUManager], code: 200, input: [reason], output: RecoveryPayment, side_effects: ["Ledger.recovered_amount_cents -= amount", "Ledger may revert FULLY_RECOVERED → PARTIALLY_RECOVERED"] }
  - { method: POST, path: "/siu/cases/{caseId}/restitution-ledgers/{ledgerId}/write-off", description: "Write off outstanding", roles: [SIUManager], code: 200, input: [reason], output: RestitutionLedger, side_effects: [] }

  # ----- reports -----
  - { method: POST, path: "/siu/reports", description: "Create regulatory report (DRAFT)", roles: [SIUComplianceOfficer], code: 201, input: [period_start_at, period_end_at, state_code, report_type], output: RegulatoryReport, side_effects: [] }
  - { method: GET, path: "/siu/reports/{reportId}", description: "Fetch report", roles: [SIUManager, SIUComplianceOfficer], code: 200, input: [], output: RegulatoryReport, side_effects: [] }
  - { method: GET, path: "/siu/reports", description: "List reports", roles: [SIUManager, SIUComplianceOfficer], code: 200, input: ["status?", "state_code?", "report_type?"], output: "RegulatoryReport[]", side_effects: [] }
  - { method: POST, path: "/siu/reports/{reportId}/compute", description: "Compute metrics", roles: [SIUComplianceOfficer], code: 200, input: [], output: RegulatoryReport, side_effects: ["calculations.regulatory_report_metrics runs"] }
  - { method: POST, path: "/siu/reports/{reportId}/submit", description: "Submit report", roles: [SIUComplianceOfficer], code: 200, input: [], output: RegulatoryReport, side_effects: [] }
  - { method: POST, path: "/siu/reports/{reportId}/accept", description: "Record regulator acceptance", roles: [SIUComplianceOfficer], code: 200, input: [], output: RegulatoryReport, side_effects: [] }
  - { method: POST, path: "/siu/reports/{reportId}/reject", description: "Record regulator rejection", roles: [SIUComplianceOfficer], code: 200, input: [reason], output: RegulatoryReport, side_effects: [] }

  # ----- test-driving endpoints -----
  - { method: POST, path: "/siu/_clock/set_current_utc", description: "Set logical clock. Server default: 2026-08-01T00:00:00Z before any set_current_utc call. Deterministic; never falls back to wall-clock.", roles: [SIUManager, SIUComplianceOfficer], code: 200, input: [to_iso8601], output: { now_iso8601: "string" }, side_effects: [] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/malformed X-User-Role or X-User-ID" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-templated id not found" }
  - { id: ERR_FK_NOT_FOUND, http: 404, condition: "Body FK reference not found" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "State-machine precondition fails" }
  - { id: ERR_CASE_NOT_IN_REQUIRED_STATE, http: 409, condition: "Cross-entity state guard fails (case not in required status)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 422, condition: "Same actor attempts step A and step B that must be segregated" }
  - { id: ERR_INVESTIGATOR_INELIGIBLE, http: 422, condition: "Investigator fails status/certification/capacity check" }
  - { id: ERR_EUO_NOTICE_WINDOW_VIOLATION, http: 422, condition: "Notice sent inside statutory minimum window" }
  - { id: ERR_EUO_TEMPORAL_CONFLICT, http: 422, condition: "EUO end<=start or overlaps another active session for same case" }
  - { id: ERR_DELAY_WINDOW_EXCEEDED, http: 422, condition: "Requested delay_until beyond state statutory cap" }
  - { id: ERR_CASE_ALREADY_OPEN, http: 409, condition: "A non-terminal SIUCase already exists for the claim" }
  - { id: ERR_CLAIM_ALREADY_UNDER_SIU, http: 409, condition: "Accept attempted when claim already UNDER_SIU_REVIEW or beyond" }
  - { id: ERR_EUO_NOT_REQUIRED, http: 422, condition: "Schedule EUO attempted when case.euo_required==false" }
  - { id: ERR_MATERIALITY_AMOUNT_MISMATCH, http: 422, condition: "materiality=SUBSTANTIVE with fraud_amount_cents==0, or IMMATERIAL with >0" }
  - { id: ERR_DUPLICATE_LINK_INVALID, http: 422, condition: "Duplicate linkage target invalid (not ACCEPTED or different claim)" }
  - { id: ERR_PATTERN_MERGE_INVALID, http: 422, condition: "Pattern merge integrity violation" }
  - { id: ERR_RECOVERY_EXCEEDS_OUTSTANDING, http: 422, condition: "Clear would drive recovered > target" }
  - { id: ERR_RESTITUTION_TARGET_INVALID, http: 422, condition: "Target not in (0, claim.claimed_amount_cents]" }
  - { id: ERR_TRAINING_WINDOW_INVALID, http: 422, condition: "valid_until <= completed_at or credit_hours < 1" }
  - { id: ERR_REPORT_PERIOD_INVALID, http: 422, condition: "period_end<=start or period_end in future" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_*_version mismatch" }
  - { id: ERR_BUREAU_DEADLINE_PASSED, http: 422, condition: "enforce_bureau_deadline=true and now > deadline_at" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, or invalid enum value" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Adjuster
    description: "Front-line claim adjuster; registers claims, submits referrals, coordinates payment delay"
    identity: "entity_backed:Adjuster"
    exclusive_operations:
      - "POST /siu/claims"
      - "POST /siu/claims/{claimId}/pay"
      - "POST /siu/claims/{claimId}/close-claim"
      - "POST /siu/claims/{claimId}/delay-payment"
      - "POST /siu/claims/{claimId}/release-delay"
    shared_operations:
      - "GET /siu/claims/**"
      - "GET /siu/cases/**"
      - "POST /siu/referrals (shared with SIUInvestigator)"
  - name: SIUManager
    description: "SIU manager; triages referrals, assigns investigators, admits evidence, closes cases, files bureau referrals"
    identity: "opaque"
