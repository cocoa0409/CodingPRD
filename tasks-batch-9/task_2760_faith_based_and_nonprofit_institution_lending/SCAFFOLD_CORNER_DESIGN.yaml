              captures: { e_wp: $.data.error_id }
          assert:
            - "Every one of the eleven responses is HTTP 404 with response_type == \"error\""
            - "${e_inst} == \"ERR_INSTITUTION_NOT_FOUND\", ${e_gp} == \"ERR_GIVING_PERIOD_NOT_FOUND\", ${e_gov} == \"ERR_GOVERNANCE_AUTHORIZATION_NOT_FOUND\", ${e_camp} == \"ERR_PLEDGE_CAMPAIGN_NOT_FOUND\""
            - "${e_pledge} == \"ERR_PLEDGE_NOT_FOUND\", ${e_asset} == \"ERR_COLLATERAL_ASSET_NOT_FOUND\", ${e_app} == \"ERR_LOAN_APPLICATION_NOT_FOUND\", ${e_loan} == \"ERR_LOAN_NOT_FOUND\""
            - "${e_draw} == \"ERR_DRAW_REQUEST_NOT_FOUND\", ${e_cov} == \"ERR_COVENANT_NOT_FOUND\", ${e_wp} == \"ERR_WORKOUT_PLAN_NOT_FOUND\""

      - name: loan_application_body_fk_to_unknown_packet_returns_not_found
        claim_type: parent_relationships
        grounds:
          - entities.LoanApplication.fields.governance_authorization_id
          - validations[priority=6]
          - errors[ERR_GOVERNANCE_AUTHORIZATION_NOT_FOUND]
        distinguishing_aspect: "A body-level FK is resolved as strictly as a path id: an application citing an unknown governance_authorization_id is 404 ERR_GOVERNANCE_AUTHORIZATION_NOT_FOUND even though its institution_id resolves fine."
