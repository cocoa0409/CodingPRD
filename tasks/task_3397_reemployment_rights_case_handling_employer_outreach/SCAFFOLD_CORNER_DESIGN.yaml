          assert:
            - "rn == 1 and rd == 2026-09-15T00:00:00Z"
            - "ReemploymentCase.${case_id}.status == AWAITING_RESPONSE and open_round_count == 1"
            - "the round's status == PROPOSED and responded_at is null"

      - name: fk_reverse_subresources_return_only_own_children
        claim_type: Computed read
        grounds:
