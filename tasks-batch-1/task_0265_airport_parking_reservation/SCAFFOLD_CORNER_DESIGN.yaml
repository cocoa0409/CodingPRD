scaffold_corner_design:
  # ===========================================================================
  # Entities
  # ===========================================================================
  - section: entities
    instances:
      - name: create_lot_returns_201_with_initialized_counters
        claim_type: Creation
        grounds:
          - entities.Lot.fields.available_standard_count
          - entities.Lot.fields.available_ev_count
        distinguishing_aspect: "POST /lots with all required fields → 201; available_standard_count==standard_capacity, available_oversized_count==oversized_capacity, available_ev_count==ev_capacity, version==1."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-30T09:00:00Z" }
              as: FacilityAdmin
          trigger:
            - call: "POST /lots"
              payload: { name: "L-create", kind: "GARAGE", standard_capacity: 10, oversized_capacity: 4, ev_capacity: 2, in_out_allowed: true }
              as: FacilityAdmin
              captures: { lot_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Lot.${lot_id}.available_standard_count == 10"
            - "Lot.${lot_id}.available_oversized_count == 4"
            - "Lot.${lot_id}.available_ev_count == 2"
            - "Lot.${lot_id}.version == 1"

      - name: get_reservation_returns_stored_entity
        claim_type: Retrieval
        grounds: [entities.Reservation.fields.occupancy_status]
        distinguishing_aspect: "GET /reservations/{id} returns the reservation with occupancy_status==BOOKED and settlement_status==UNSETTLED for a fresh non-prepaid booking."
        test_recipe:
          setup:
            - "Clock 2026-06-30T09:00:00Z; SURFACE_LOT cap 5; DAILY plan; STANDARD vehicle; one non-prepaid BOOKED reservation."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-30T09:00:00Z" }
              as: FacilityAdmin
            - call: "POST /customers"
              payload: { email: "ce1@x.com", full_name: "CE1" }
              as: FacilityAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /lots"
              payload: { name: "Lce1", kind: "SURFACE_LOT", standard_capacity: 5, oversized_capacity: 0, ev_capacity: 0, in_out_allowed: false }
              as: FacilityAdmin
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /rate-plans"
              payload: { lot_id: "${lot_id}", rate_mode: "DAILY", daily_cap_cents: 2000 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", plate: "STDce1", size_class: "STANDARD", is_ev: false }
              as: FacilityAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /reservations"
              payload: { customer_id: "${cust_id}", lot_id: "${lot_id}", vehicle_id: "${veh_id}", rate_plan_id: "${rp_id}", scheduled_start: "2026-07-01T10:00:00Z", scheduled_end: "2026-07-02T10:00:00Z", prepaid: false, expected_lot_version: "${lot_v}" }
              as: FacilityAdmin
              captures: { res_id: $.data.id }
          trigger:
            - call: "GET /reservations/${res_id}"
              payload: {}
              as: FacilityAdmin
              captures: { occ: $.data.occupancy_status, settle: $.data.settlement_status }
          assert:
            - "Reservation.${res_id}.occupancy_status == BOOKED"
            - "Reservation.${res_id}.settlement_status == UNSETTLED"

      - name: list_lots_paginated_envelope
        claim_type: Listing
        grounds: [entities.Lot]
        distinguishing_aspect: "GET /lots returns a paginated array envelope with total_count and has_more; two lots created → total_count==2."
        test_recipe:
          setup:
            - "Empty DB; two lots created."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-30T09:00:00Z" }
              as: FacilityAdmin
            - call: "POST /lots"
              payload: { name: "Lp1", kind: "SURFACE_LOT", standard_capacity: 1, oversized_capacity: 0, ev_capacity: 0, in_out_allowed: false }
              as: FacilityAdmin
            - call: "POST /lots"
              payload: { name: "Lp2", kind: "GARAGE", standard_capacity: 2, oversized_capacity: 0, ev_capacity: 0, in_out_allowed: false }
              as: FacilityAdmin
          trigger:
            - call: "GET /lots"
              payload: { limit: 10, offset: 0 }
              as: FacilityAdmin
          assert:
            - "response_type == array"
            - "meta total_count == 2 and has_more == false"

      - name: get_lot_not_found_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /lots/{random-uuid} → ERR_NOT_FOUND with HTTP 404."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-30T09:00:00Z" }
              as: FacilityAdmin
          trigger:
            - call: "GET /lots/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FacilityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: create_reservation_missing_required_field_returns_validation
        claim_type: Required Fields
        grounds: ["errors[ERR_VALIDATION]", "entities.Reservation.fields.scheduled_end"]
        distinguishing_aspect: "POST /reservations omitting scheduled_end (a required input) → ERR_VALIDATION 400 before any business logic."
        test_recipe:
          setup:
            - "Clock 2026-06-30T09:00:00Z; SURFACE_LOT cap 5; DAILY plan; STANDARD vehicle."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-30T09:00:00Z" }
              as: FacilityAdmin
            - call: "POST /customers"
              payload: { email: "crv@x.com", full_name: "CRV" }
              as: FacilityAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /lots"
              payload: { name: "Lcrv", kind: "SURFACE_LOT", standard_capacity: 5, oversized_capacity: 0, ev_capacity: 0, in_out_allowed: false }
              as: FacilityAdmin
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /rate-plans"
              payload: { lot_id: "${lot_id}", rate_mode: "DAILY", daily_cap_cents: 2000 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", plate: "STDcrv", size_class: "STANDARD", is_ev: false }
              as: FacilityAdmin
              captures: { veh_id: $.data.id }
          trigger:
            - call: "POST /reservations"
              payload: { customer_id: "${cust_id}", lot_id: "${lot_id}", vehicle_id: "${veh_id}", rate_plan_id: "${rp_id}", scheduled_start: "2026-07-01T10:00:00Z", expected_lot_version: "${lot_v}" }
              as: FacilityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"
            - "HTTP status == 400"

      - name: vehicle_default_is_ev_false_applied
        claim_type: Defaults
        grounds: [entities.Vehicle.fields.is_ev]
        distinguishing_aspect: "POST /vehicles omitting is_ev → is_ev defaults to false in the stored entity."
        test_recipe:
          setup: ["Clock set; one customer."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-30T09:00:00Z" }
              as: FacilityAdmin
            - call: "POST /customers"
              payload: { email: "cvd@x.com", full_name: "CVD" }
              as: FacilityAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", plate: "VDEF", size_class: "STANDARD" }
              as: FacilityAdmin
              captures: { veh_id: $.data.id, is_ev: $.data.is_ev }
          assert:
            - "Vehicle.${veh_id}.is_ev == false"

      - name: reservation_stall_class_computed_from_vehicle_ev
        claim_type: Computed Fields
        grounds: [entities.Reservation.fields.stall_class, entities.Vehicle.fields.is_ev]
        distinguishing_aspect: "Reservation.stall_class is computed as EV when the vehicle is_ev==true even though the vehicle's size_class is STANDARD; no stall_class is accepted from the request body."
        test_recipe:
          setup:
            - "Clock 2026-06-30T09:00:00Z; GARAGE ev_capacity=2; DAILY plan with ev_surcharge; EV STANDARD-size vehicle."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-30T09:00:00Z" }
              as: FacilityAdmin
            - call: "POST /customers"
              payload: { email: "cev@x.com", full_name: "CEV" }
              as: FacilityAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /lots"
              payload: { name: "Lev", kind: "GARAGE", standard_capacity: 0, oversized_capacity: 0, ev_capacity: 2, in_out_allowed: false }
              as: FacilityAdmin
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /rate-plans"
              payload: { lot_id: "${lot_id}", rate_mode: "DAILY", daily_cap_cents: 3000, ev_surcharge_cents_per_day: 400 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", plate: "EVX", size_class: "STANDARD", is_ev: true }
              as: FacilityAdmin
              captures: { veh_id: $.data.id }
          trigger:
            - call: "POST /reservations"
              payload: { customer_id: "${cust_id}", lot_id: "${lot_id}", vehicle_id: "${veh_id}", rate_plan_id: "${rp_id}", scheduled_start: "2026-07-01T10:00:00Z", scheduled_end: "2026-07-02T10:00:00Z", prepaid: false, expected_lot_version: "${lot_v}" }
              as: FacilityAdmin
              captures: { res_id: $.data.id }
          assert:
            - "Reservation.${res_id}.stall_class == EV"
            - "Lot.${lot_id}.available_ev_count == 1 after the booking"

      - name: create_vehicle_invalid_size_class_enum_rejected
        claim_type: Type Constraints
        grounds: ["entities.Vehicle.fields.size_class", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /vehicles with size_class='HUGE' (not in {STANDARD, OVERSIZED}) → ERR_VALIDATION 400."
        test_recipe:
          setup: ["Clock set; one customer."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-30T09:00:00Z" }
              as: FacilityAdmin
            - call: "POST /customers"
              payload: { email: "cven@x.com", full_name: "CVEN" }
              as: FacilityAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", plate: "BADENUM", size_class: "HUGE", is_ev: false }
              as: FacilityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"
            - "HTTP status == 400"

      - name: paymenttxn_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.PaymentTxn]
        distinguishing_aspect: "PaymentTxn has common_fields:false → its create-emitted rows expose id and created_at but no version field; there is no update endpoint for PaymentTxn."
        test_recipe:
          setup:
            - "Clock 2026-06-30T09:00:00Z; SURFACE_LOT cap5; HOURLY plan; PREPAID reservation (≥24h lead, no policy → no discount) producing one AUTHORIZATION PaymentTxn."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-30T09:00:00Z" }
              as: FacilityAdmin
            - call: "POST /customers"
              payload: { email: "cpt@x.com", full_name: "CPT" }
              as: FacilityAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /lots"
              payload: { name: "Lpt", kind: "SURFACE_LOT", standard_capacity: 5, oversized_capacity: 0, ev_capacity: 0, in_out_allowed: false }
              as: FacilityAdmin
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /rate-plans"
              payload: { lot_id: "${lot_id}", rate_mode: "HOURLY", hourly_cents: 300, daily_cap_cents: 2000 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", plate: "STDpt", size_class: "STANDARD", is_ev: false }
              as: FacilityAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /reservations"
              payload: { customer_id: "${cust_id}", lot_id: "${lot_id}", vehicle_id: "${veh_id}", rate_plan_id: "${rp_id}", scheduled_start: "2026-07-01T10:00:00Z", scheduled_end: "2026-07-02T10:00:00Z", prepaid: true, expected_lot_version: "${lot_v}" }
              as: FacilityAdmin
              captures: { res_id: $.data.id }
          trigger:
            - call: "GET /reservations/${res_id}/payment-txns"
              payload: {}
              as: FacilityAdmin
          assert:
            - "the AUTHORIZATION PaymentTxn row has id and created_at but no version field"
            - "PaymentTxn AUTHORIZATION amount_cents == 4000"

      - name: create_vehicle_nonexistent_customer_returns_404
        claim_type: Parent Relationships
        grounds: ["entities.Vehicle.fields.customer_id", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /vehicles with a customer_id that does not exist → ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Clock set; no customer with the referenced id."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-30T09:00:00Z" }
              as: FacilityAdmin
          trigger:
            - call: "POST /vehicles"
              payload: { customer_id: "00000000-0000-4000-8000-0000000000aa", plate: "ORPHAN", size_class: "STANDARD", is_ev: false }
              as: FacilityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

  # ===========================================================================
  # State Machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: checkout_from_booked_without_checkin_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Reservation.CHECKED_IN_to_CHECKED_OUT
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /reservations/{id}/check-out while occupancy_status==BOOKED (never checked in) → ERR_INVALID_STATE 409; no charge computed."
        test_recipe:
          setup:
            - "Clock 2026-06-30T09:00:00Z; SURFACE_LOT cap5; DAILY plan; one BOOKED non-prepaid reservation."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-30T09:00:00Z" }
              as: FacilityAdmin
            - call: "POST /customers"
              payload: { email: "cis@x.com", full_name: "CIS" }
              as: FacilityAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /lots"
              payload: { name: "Lis", kind: "SURFACE_LOT", standard_capacity: 5, oversized_capacity: 0, ev_capacity: 0, in_out_allowed: false }
              as: FacilityAdmin
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /rate-plans"
              payload: { lot_id: "${lot_id}", rate_mode: "DAILY", daily_cap_cents: 2000 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", plate: "STDis", size_class: "STANDARD", is_ev: false }
              as: FacilityAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /reservations"
              payload: { customer_id: "${cust_id}", lot_id: "${lot_id}", vehicle_id: "${veh_id}", rate_plan_id: "${rp_id}", scheduled_start: "2026-07-01T10:00:00Z", scheduled_end: "2026-07-02T10:00:00Z", prepaid: false, expected_lot_version: "${lot_v}" }
              as: FacilityAdmin
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /reservations/${res_id}/check-out"
              payload: {}
              as: LotOperator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: cancel_from_cancelled_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Reservation.BOOKED_to_CANCELLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A second POST /reservations/{id}/cancel on an already-CANCELLED reservation → ERR_INVALID_STATE 409 (terminal state, no further transitions); idempotency edge."
        test_recipe:
          setup:
            - "Clock 2026-06-30T09:00:00Z; SURFACE_LOT cap5; DAILY plan; one reservation already CANCELLED."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-30T09:00:00Z" }
              as: FacilityAdmin
            - call: "POST /customers"
              payload: { email: "ctl@x.com", full_name: "CTL" }
              as: FacilityAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /lots"
              payload: { name: "Ltl", kind: "SURFACE_LOT", standard_capacity: 5, oversized_capacity: 0, ev_capacity: 0, in_out_allowed: false }
              as: FacilityAdmin
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /rate-plans"
              payload: { lot_id: "${lot_id}", rate_mode: "DAILY", daily_cap_cents: 2000 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", plate: "STDtl", size_class: "STANDARD", is_ev: false }
              as: FacilityAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /reservations"
              payload: { customer_id: "${cust_id}", lot_id: "${lot_id}", vehicle_id: "${veh_id}", rate_plan_id: "${rp_id}", scheduled_start: "2026-07-01T10:00:00Z", scheduled_end: "2026-07-02T10:00:00Z", prepaid: false, expected_lot_version: "${lot_v}" }
              as: FacilityAdmin
              captures: { res_id: $.data.id }
            - call: "POST /reservations/${res_id}/cancel"
              payload: {}
              as: FacilityAdmin
          trigger:
            - call: "POST /reservations/${res_id}/cancel"
              payload: {}
              as: FacilityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: gate_exit_on_in_out_disallowed_lot_returns_error
        claim_type: guarded transitions
        grounds:
          - state_machines.Reservation.CHECKED_IN_to_OUT_TEMP
          - validations[priority=10]
          - errors[ERR_IN_OUT_NOT_ALLOWED]
        distinguishing_aspect: "POST /reservations/{id}/gate-exit on a CHECKED_IN reservation whose lot has in_out_allowed==false → ERR_IN_OUT_NOT_ALLOWED 409; occupancy stays CHECKED_IN."
        test_recipe:
          setup:
            - "Clock 2026-07-01T10:00:00Z; SURFACE_LOT in_out_allowed=false cap5; reservation checked in."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-30T09:00:00Z" }
              as: FacilityAdmin
            - call: "POST /customers"
              payload: { email: "cio@x.com", full_name: "CIO" }
              as: FacilityAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /lots"
              payload: { name: "Lio", kind: "SURFACE_LOT", standard_capacity: 5, oversized_capacity: 0, ev_capacity: 0, in_out_allowed: false }
              as: FacilityAdmin
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /rate-plans"
              payload: { lot_id: "${lot_id}", rate_mode: "DAILY", daily_cap_cents: 2000 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", plate: "STDio", size_class: "STANDARD", is_ev: false }
              as: FacilityAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /reservations"
              payload: { customer_id: "${cust_id}", lot_id: "${lot_id}", vehicle_id: "${veh_id}", rate_plan_id: "${rp_id}", scheduled_start: "2026-07-01T10:00:00Z", scheduled_end: "2026-07-02T10:00:00Z", prepaid: false, expected_lot_version: "${lot_v}" }
              as: FacilityAdmin
              captures: { res_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-07-01T10:00:00Z" }
              as: FacilityAdmin
            - call: "POST /reservations/${res_id}/check-in"
              payload: {}
              as: LotOperator
          trigger:
            - call: "POST /reservations/${res_id}/gate-exit"
              payload: {}
              as: LotOperator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_IN_OUT_NOT_ALLOWED"
            - "HTTP status == 409"

      - name: depart_from_scheduled_without_boarding_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.ShuttleTrip.BOARDING_to_DEPARTED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /shuttle-trips/{id}/depart while status==SCHEDULED (open-boarding skipped) → ERR_INVALID_STATE 409."
        test_recipe:
          setup:
            - "Clock 2026-07-01T09:00:00Z; SURFACE_LOT; one SCHEDULED shuttle trip."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-07-01T09:00:00Z" }
              as: FacilityAdmin
            - call: "POST /lots"
              payload: { name: "Lsd", kind: "SURFACE_LOT", standard_capacity: 2, oversized_capacity: 0, ev_capacity: 0, in_out_allowed: false }
              as: FacilityAdmin
              captures: { lot_id: $.data.id }
            - call: "POST /shuttle-trips"
              payload: { lot_id: "${lot_id}", depart_at: "2026-07-01T10:00:00Z", seat_capacity: 4 }
              as: FacilityAdmin
              captures: { trip_id: $.data.id }
          trigger:
            - call: "POST /shuttle-trips/${trip_id}/depart"
              payload: {}
              as: LotOperator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: check_in_twice_idempotency_second_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.Reservation.BOOKED_to_CHECKED_IN
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A second POST /reservations/{id}/check-in on an already CHECKED_IN reservation → ERR_INVALID_STATE 409; actual_in unchanged."
        test_recipe:
          setup:
            - "Clock 2026-07-01T10:00:00Z; SURFACE_LOT cap5; reservation checked in."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-30T09:00:00Z" }
              as: FacilityAdmin
            - call: "POST /customers"
              payload: { email: "cci@x.com", full_name: "CCI" }
              as: FacilityAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /lots"
              payload: { name: "Lci", kind: "SURFACE_LOT", standard_capacity: 5, oversized_capacity: 0, ev_capacity: 0, in_out_allowed: false }
              as: FacilityAdmin
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /rate-plans"
              payload: { lot_id: "${lot_id}", rate_mode: "DAILY", daily_cap_cents: 2000 }
