              as: ProgramAdministrator
              captures: { agr_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /licensing/products"
              payload: { sku: "SHP", name: "Perp Dev", license_model: "PER_DEVICE", license_kind: "PERPETUAL", edition: "STANDARD", family: "DEV", annual_unit_price_cents: 60000, license_mobility: false }
              as: ProgramAdministrator
              captures: { p_perp: $.data.id }
            - call: "POST /licensing/products"
              payload: { sku: "SHS", name: "Subs Dev", license_model: "PER_DEVICE", license_kind: "SUBSCRIPTION", edition: "STANDARD", family: "DEV", annual_unit_price_cents: 60000, license_mobility: false }
              as: ProgramAdministrator
              captures: { p_subs: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/entitlements"
              payload: { product_id: "${p_perp}", quantity: 25 }
              as: LicensingSpecialist
            - call: "POST /licensing/agreements/${agr_id}/entitlements"
              payload: { product_id: "${p_subs}", quantity: 20 }
              as: LicensingSpecialist
            - call: "POST /licensing/agreements/${agr_id}/deployments"
              payload: { product_id: "${p_perp}", scope: "DEVICE", deployment_date: "2026-09-02", device_count: 40, hosting: "ON_PREMISES" }
              as: CustomerAdmin
              as_user_id: "${org_id}"
            - call: "POST /licensing/agreements/${agr_id}/deployments"
              payload: { product_id: "${p_subs}", scope: "DEVICE", deployment_date: "2026-09-02", device_count: 40, hosting: "ON_PREMISES" }
              as: CustomerAdmin
              as_user_id: "${org_id}"
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2029-07-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /licensing/agreements/${agr_id}/renewal-review"
              payload: {}
              as: LicensingSpecialist
            - call: "POST /licensing/agreements/${agr_id}/decline-renewal"
              payload: { decision: "NON_RENEW" }
              as: CustomerAdmin
              as_user_id: "${org_id}"
          trigger:
            - call: "GET /licensing/agreements/${agr_id}/shortfall-assessment"
              as: LicensingSpecialist
          assert:
            - "perpetual product line: required_licenses == 40, perpetual_quantity == 25, effective_coverage == 25, shortfall == 15"
            - "subscription product line: required_licenses == 40, subscription_quantity == 20, effective_coverage == 0, shortfall == 40"
            - "assessment.agreement_status == NON_RENEWED"
      - name: cloud_consumption_partial_cap_and_exhaustion
        claim_type: correct_result
        grounds:
          - calculations.cloud_consumption_waterfall
          - state_machines.CloudCommitment.ACTIVE_to_EXHAUSTED
        distinguishing_aspect: "Waterfall cap: a 70000-cent request against a commitment with 40000 remaining consumes exactly 40000 (consumed_cents, not the request), drives consumed == committed, and transitions the commitment to EXHAUSTED."
        test_recipe:
          setup: ["ACTIVE agreement; ACTIVE commitment of 100000 cents expiring 2028-01-01; one prior consumption of 60000"]
          setup_api_calls:
            - call: "POST /licensing/organizations"
              payload: { legal_name: "Wf Org", qualified_device_count: 100 }
              as: ProgramAdministrator
              captures: { org_id: $.data.id }
            - call: "POST /licensing/agreements"
              payload: { organization_id: "${org_id}", enrollment_number: "E-WF-1", start_date: "2026-09-01", end_date: "2029-08-31" }
              as: ProgramAdministrator
              captures: { agr_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /licensing/agreements/${agr_id}/cloud-commitments"
              payload: { committed_amount_cents: 100000, expires_on: "2028-01-01" }
              as: LicensingSpecialist
              captures: { com_id: $.data.id }
            - call: "POST /licensing/cloud-commitments/${com_id}/consumption-events"
              payload: { requested_cents: 60000 }
              as: CustomerAdmin
              as_user_id: "${org_id}"
              captures: { ev1_consumed: $.data.consumed_cents }
          trigger:
            - call: "POST /licensing/cloud-commitments/${com_id}/consumption-events"
              payload: { requested_cents: 70000 }
              as: CustomerAdmin
              as_user_id: "${org_id}"
              captures: { ev2_consumed: $.data.consumed_cents }
            - call: "GET /licensing/cloud-commitments/${com_id}"
              as: LicensingSpecialist
              captures: { com_status: $.data.status, com_consumed: $.data.consumed_amount_cents }
          assert:
            - "first event consumed_cents == 60000"
            - "second event consumed_cents == 40000 (capped at remaining balance; the 30000 excess is dropped)"
            - "commitment consumed_amount_cents == 100000 and status == EXHAUSTED"

