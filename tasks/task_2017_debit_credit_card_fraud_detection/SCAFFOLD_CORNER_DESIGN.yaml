  - section: endpoints
    instances:
      - name: response_envelope_success_and_error_shape
        claim_type: standard_crud
        grounds:
          - response_envelope
        distinguishing_aspect: "Success responses carry meta.api_request_id + response_type object/array; failures carry response_type error with data.error_id and data.message."
        test_recipe:
          setup: ["One account exists"]
          setup_api_calls:
            - { call: "POST /fraudops/accounts", payload: { account_number: "ACCT-EP1", cardholder_name: "Ep One", home_country: "US" }, as: FraudOpsManager, captures: { acct: "$.data.id" } }
          trigger:
            - { call: "GET /fraudops/accounts/${acct}", as: FraudOpsManager }
            - { call: "GET /fraudops/cards/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: FraudOpsManager, captures: { err: "$.data.error_id" } }
          assert:
            - "success: meta.api_request_id present, meta.api_request_timestamp present, response_type == object, data holds the account"
            - "failure: response_type == error, data.error_id == ERR_NOT_FOUND, data.message present"
      - name: fraud_alert_list_filter_by_status
        claim_type: standard_crud
        grounds:
          - endpoints["GET /fraudops/fraud-alerts"]
        distinguishing_aspect: "The alert_status filter partitions the queue: after claiming one of two alerts, alert_status=OPEN returns exactly the unclaimed one."
        test_recipe:
          setup: ["Account/card; manual alerts A1 (left OPEN) and A2 (claimed -> IN_REVIEW)"]
          setup_api_calls:
            - { call: "POST /fraudops/accounts", payload: { account_number: "ACCT-EP2", cardholder_name: "Ep Two", home_country: "US" }, as: FraudOpsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /fraudops/cards", payload: { account_id: "${acct}", pan_token: "PT-EP2", product_type: "CREDIT", network: "VISA" }, as: FraudOpsManager, captures: { card: "$.data.id" } }
            - { call: "POST /fraudops/fraud-alerts", payload: { account_id: "${acct}", card_id: "${card}" }, as: FraudAnalyst, captures: { a1: "$.data.id" } }
            - { call: "POST /fraudops/fraud-alerts", payload: { account_id: "${acct}", card_id: "${card}" }, as: FraudAnalyst, captures: { a2: "$.data.id" } }
            - { call: "POST /fraudops/fraud-alerts/${a2}/claim", as: FraudAnalyst, as_user_id: "analyst-1" }
          trigger:
            - { call: "GET /fraudops/fraud-alerts?alert_status=OPEN&account_id=${acct}", as: FraudOpsManager }
          assert:
            - "filtered list total_count == 1 and the single element is ${a1} (A2 filtered out as IN_REVIEW)"
      - name: metrics_endpoint_returns_declared_fields
        claim_type: computed_read
        grounds:
          - endpoints["GET /fraudops/rule-sets/{id}/metrics"]
          - calculations.false_positive_monitor
        distinguishing_aspect: "The computed read returns every declared metric field with correct zero/non-zero values on a minimal population."
        test_recipe:
          setup: ["GLOBAL ruleset active; one APPROVE txn (1000 CNP US -> 40)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FraudOpsManager }
            - { call: "POST /fraudops/accounts", payload: { account_number: "ACCT-EP3", cardholder_name: "Ep Three", home_country: "US" }, as: FraudOpsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /fraudops/cards", payload: { account_id: "${acct}", pan_token: "PT-EP3", product_type: "CREDIT", network: "VISA" }, as: FraudOpsManager, captures: { card: "$.data.id" } }
            - { call: "POST /fraudops/rule-sets", payload: { scope: "GLOBAL", base_score: 10, review_threshold: 60, decline_threshold: 100, amount_tiers: [{min_amount_cents: 0, points: 5}, {min_amount_cents: 25000, points: 20}, {min_amount_cents: 100000, points: 45}], channel_weights: {CHIP: 0, CONTACTLESS: 5, CNP: 25, ATM: 30}, cross_border_weight: 20, high_risk_multiplier: 2, watch_weight: 15, compromised_weight: 50 }, as: FraudAnalyst, as_user_id: "analyst-1", captures: { rs: "$.data.id" } }
            - { call: "POST /fraudops/rule-sets/${rs}/activate", as: FraudOpsManager, as_user_id: "mgr-1" }
            - { call: "POST /fraudops/auth-transactions", payload: { card_id: "${card}", amount_cents: 1000, merchant_id: "M-EP3", merchant_category_code: "5411", channel: "CNP", origin_country: "US" }, as: NetworkGateway }
          trigger:
            - { call: "GET /fraudops/rule-sets/${rs}/metrics", as: FraudOpsManager }
          assert:
            - "all ten fields present: scored_count/approved_count/review_count/declined_count/confirmed_fraud_count/confirmed_legit_count/fp_rate_review_basis_bp/fp_rate_decline_basis_bp/missed_declines_under_current/gross_confirmed_loss_cents"
            - "scored_count == 1, approved_count == 1, review_count == 0, declined_count == 0, both fp rates == 0, missed_declines_under_current == 0"
      - name: cardholder_respond_creates_contact_and_resolves
        claim_type: action_endpoint
        grounds:
          - endpoints["POST /fraudops/fraud-alerts/{id}/respond"]
          - state_machines.FraudAlert.IN_REVIEW_to_RESOLVED_FRAUD
        distinguishing_aspect: "The cardholder self-service path works even from OPEN (unclaimed): it creates a COMPLETED IN_APP contact and resolves with the standard FRAUD side effects (card soft-block)."
        test_recipe:
          setup: ["Account/card; one OPEN manual alert (never claimed)"]
          setup_api_calls:
            - { call: "POST /fraudops/accounts", payload: { account_number: "ACCT-EP4", cardholder_name: "Ep Four", home_country: "US" }, as: FraudOpsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /fraudops/cards", payload: { account_id: "${acct}", pan_token: "PT-EP4", product_type: "DEBIT", network: "MASTERCARD" }, as: FraudOpsManager, captures: { card: "$.data.id" } }
            - { call: "POST /fraudops/fraud-alerts", payload: { account_id: "${acct}", card_id: "${card}" }, as: FraudAnalyst, captures: { al: "$.data.id" } }
          trigger:
            - { call: "POST /fraudops/fraud-alerts/${al}/respond", payload: { outcome: "CONFIRMED_FRAUD" }, as: Cardholder, as_user_id: "${acct}" }
            - { call: "GET /fraudops/verification-contacts?alert_id=${al}", as: FraudOpsManager, captures: { vc: "$.data[0].id" } }
            - { call: "GET /fraudops/cards/${card}", as: FraudOpsManager }
          assert:
            - "FraudAlert.${al}.alert_status == RESOLVED_FRAUD (respond works from OPEN via the system path)"
            - "exactly one VerificationContact: channel == IN_APP, contact_status == COMPLETED, outcome == CONFIRMED_FRAUD, created_by_user_id == SYSTEM"
            - "Card.${card}.card_status == SOFT_BLOCKED with block_reason == CONFIRMED_FRAUD"
      - name: card_create_on_suspended_account_rejected
        claim_type: conditional_action
        grounds:
          - endpoints["POST /fraudops/cards"]
          - errors[ERR_ACCOUNT_NOT_ACTIVE]
        distinguishing_aspect: "Card issuance is gated on the account's state: SUSPENDED blocks creation; after reinstate the identical payload succeeds."
        test_recipe:
          setup: ["Account suspended"]
          setup_api_calls:
            - { call: "POST /fraudops/accounts", payload: { account_number: "ACCT-EP5", cardholder_name: "Ep Five", home_country: "US" }, as: FraudOpsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /fraudops/accounts/${acct}/suspend", as: FraudOpsManager }
          trigger:
            - { call: "POST /fraudops/cards", payload: { account_id: "${acct}", pan_token: "PT-EP5", product_type: "CREDIT", network: "VISA" }, as: FraudOpsManager, captures: { err: "$.data.error_id" } }
            - { call: "POST /fraudops/accounts/${acct}/reinstate", as: FraudOpsManager }
            - { call: "POST /fraudops/cards", payload: { account_id: "${acct}", pan_token: "PT-EP5", product_type: "CREDIT", network: "VISA" }, as: FraudOpsManager, captures: { card: "$.data.id" } }
          assert:
            - "while SUSPENDED: 409 ERR_ACCOUNT_NOT_ACTIVE"
            - "after reinstate: 201, Card.${card}.card_status == ACTIVE"

  - section: errors
    instances:
      - name: scoring_without_active_ruleset_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_NO_ACTIVE_RULESET]
          - calculations.authorization_scoring
        distinguishing_aspect: "Intake with no ACTIVE ruleset covering the card's scope (only a DRAFT exists) fails 409 — the only error path of the scoring endpoint."
