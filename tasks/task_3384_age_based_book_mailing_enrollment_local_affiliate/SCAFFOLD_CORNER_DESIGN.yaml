              payload: { affiliate_id: "${aff_a_id}", full_name: "Read Me", family_name: "Me", birth_date: "2025-12-25T00:00:00Z", mailing_address: { line1: "7 Read Rd", city: "Nashville", region: "TN", postal_code: "37204", country: "US" } }
              as: AffiliateCoordinator
              as_user_id: "${aff_a_id}"
              captures: { rm_id: $.data.id }
            - call: "GET /library/children/${rm_id}"
