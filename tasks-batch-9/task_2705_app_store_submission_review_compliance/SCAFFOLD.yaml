    side_effects:
      - "action DISPUTE (ComplianceOfficer only) -> DISPUTED; RECONCILE and DISMISS (PlatformPolicyAdmin only) -> RECONCILED / DISMISSED"
      - "RECONCILE requires an exact four-attribute match in Submission.declared_privacy_items (ERR_DISCLOSURE_STILL_MISSING)"
      - "DISMISS is refused for severity == CRITICAL (ERR_WAIVER_NOT_PERMITTED)"
      - "Recomputes both disclosure_accuracy_score variants and, for CRITICAL findings, AppRecord.compliance_posture; exempt from the posture gate"

