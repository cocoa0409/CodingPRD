      - name: protest_review_remand_cycle_unlocks_escalation_at_round_two
        grounds:
          - state_machines.Protest.FILED_to_UNDER_REVIEW
          - state_machines.Protest.UNDER_REVIEW_to_REMANDED
          - state_machines.Protest.REMANDED_to_UNDER_REVIEW
          - state_machines.Protest.UNDER_REVIEW_to_ESCALATED
          - state_machines.Protest.ESCALATED_to_ASSOCIATION_RULED
          - validations[priority=20]
        distinguishing_aspect: |
          Protest is a cyclic machine whose exit is gated on the loop counter: the
          UNDER_REVIEW -> REMANDED -> UNDER_REVIEW cycle raises review_round from 1 to 2, and a
          SCORE_ERROR protest can only reach ESCALATED once review_round >= 2 - the same
