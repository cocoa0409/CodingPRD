            - call: "POST /exams/${amd_exam_id}/amend"
              payload: { density_category: "B", amendment_reason: "Density re-scored on comparison with priors" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
          assert:
            - "L1 — Exam.${amd_exam_id}.report_status == AMENDED and amendment_count == 1 and density_category == B"
            - "L2 — NotificationLetter.${amd_letter_id}.status == SUPERSEDED"
            - "L3 — Exam.${amd_exam_id}.notification_status == PENDING"
            - "L3 — Exam.${amd_exam_id}.notification_deadline_at == null"
            - "L3 — Facility.${fac_id}.open_notice_obligations == 1"
            - "Exam.${amd_exam_id}.follow_up_status == NOT_REQUIRED (the cascade never touches the follow-up dimension)"
            - "Exam.${amd_exam_id}.interpreted_late == false (interpreted 2026-08-01, report_due_at 2026-07-31 for the routine 30-day turnaround was already re-derived to 2026-07-31 and the exam was read after it) — assert interpreted_late == true"
            - "The compliance run that preceded the trigger reported letters_marked_delivered == 1"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: unit_out_of_service_state_error_outranks_technologist_qualification_error
        grounds:
          - validations[priority=41]
          - validations[priority=50]
          - errors[ERR_UNIT_NOT_IN_SERVICE]
          - errors[ERR_TECHNOLOGIST_NOT_QUALIFIED]
        distinguishing_aspect: |
          Error-category pair STATE (priority 41, ERR_UNIT_NOT_IN_SERVICE, 409)
          versus BUSINESS_SAFETY (priority 50, ERR_TECHNOLOGIST_NOT_QUALIFIED,
          422): both conditions hold on the same POST /exams call, and the
          response must be the 409 state error, never the 422 safety error.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; CT policy, facility, one DBT_3D unit, qualified staff."
            - "A second TECHNOLOGIST created with initial_training_hours 10 and initial_read_volume 5, both below the 40/25 thresholds, so qualification_status is PROVISIONAL."
            - "A CRITICAL DETECTOR equipment failure on the only unit, so operational_state is OUT_OF_SERVICE and the facility posture is SUSPENDED."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_phys
            - *c_tech
            - *c_rad
            - &c_pv_tech
              call: "POST /facilities/${fac_id}/personnel"
              payload: { full_name: "Ute Untrained", role_type: "TECHNOLOGIST", initial_qualification_on: "2026-01-10T00:00:00Z", initial_training_hours: 10, initial_read_volume: 5, modality_certifications: ["DM_2D", "DBT_3D"] }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { pv_tech_id: $.data.id }
            - &c_crit_failure
              call: "POST /units/${unit_id}/equipment-failures"
              payload: { failure_code: "DETECTOR", severity: "CRITICAL", detected_at: "2026-07-30T00:00:00Z" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { crit_fail_id: $.data.id }
          trigger:
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${pv_tech_id}", patient_ref: "PT-9301", patient_state_code: "CT", exam_type: "SCREENING", performed_at: "2026-07-31T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${pv_tech_id}"
          assert:
            - "HTTP status == 409"
            - "error_id == \"ERR_UNIT_NOT_IN_SERVICE\""
            - "error_id != \"ERR_TECHNOLOGIST_NOT_QUALIFIED\""
            - "GET /exams?unit_id=${unit_id} returns total_count == 0 — no Exam row was created"
            - "MammographyUnit.${unit_id}.total_images_acquired == 0"

      - name: packet_exam_unit_mismatch_outranks_closed_reaccreditation_window
        grounds:
          - validations[priority=56]
          - validations[priority=63]
          - errors[ERR_EXAM_UNIT_MISMATCH]
          - errors[ERR_REACCREDITATION_WINDOW_CLOSED]
        distinguishing_aspect: |
          Error-category pair BUSINESS_REFERENTIAL (priority 56,
          ERR_EXAM_UNIT_MISMATCH, 422) versus BUSINESS_TEMPORAL (priority 63,
          ERR_REACCREDITATION_WINDOW_CLOSED, 409) — a different pair from the
          state/business_safety conflict: the packet cites two exams acquired on
          the other unit AND the submitting unit's certificate lapsed on
          2029-07-31 while the clock reads 2029-08-01, and the referential error
          must win.
        test_recipe:
          setup:
            - "Logical clock starts at 2026-08-01T00:00:00Z; CT policy, funded facility (1000000 cents), two units (DBT_3D 'SEL-9001' and DM_2D 'PRI-2200'), qualified staff."
            - "Two interpreted exams on the DBT_3D unit and two interpreted exams on the DM_2D unit."
            - "A packet of the DBT_3D unit's own two exams passed review, so that unit is ACCREDITED with accreditation_expires_on 2029-07-31T00:00:00Z and reaccreditation_attempts_remaining back to 3."
            - "The clock is then moved to 2029-08-01T00:00:00Z, one day past the certificate, so the reaccreditation window is closed."
