            - { call: "POST /customers/${cb}/exemption-designations", payload: { phase: "PHASE_II" }, as: BSAOfficer, as_user_id: "officer-a", captures: { e2: $.data.error_id } }
          assert:
            - "e1 == 'ERR_EXEMPTION_PHASE_MISMATCH'"
            - "e2 == 'ERR_EXEMPTION_PHASE_MISMATCH'"

      - name: phase_i_listed_business_requires_stock_exchange
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_PHASE_I_BASIS_INVALID]"]
        distinguishing_aspect: "BUSINESS_LISTED + PHASE_I without stock_exchange fails at APPROVE (not create) with ERR_PHASE_I_BASIS_INVALID; after deny, a corrected designation with stock_exchange approves cleanly."
        test_recipe:
          setup: ["customer BUSINESS_LISTED opened 2020-01-01; designation #1 without stock_exchange PENDING_REVIEW"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /customers", payload: { legal_name: "ListCo", tin: "31-3131313", customer_type: "BUSINESS_LISTED", account_opened_date: "2020-01-01T00:00:00Z" }, as: BranchManager, captures: { c1: $.data.id } }
            - { call: "POST /customers/${c1}/exemption-designations", payload: { phase: "PHASE_I" }, as: BSAOfficer, as_user_id: "officer-a", captures: { ex1: $.data.id } }
          trigger:
            - { call: "POST /exemption-designations/${ex1}/approve", as: BSAOfficer, as_user_id: "officer-b", captures: { e: $.data.error_id } }
            - { call: "POST /exemption-designations/${ex1}/deny", payload: { reason: "missing exchange" }, as: BSAOfficer, as_user_id: "officer-b" }
            - { call: "POST /customers/${c1}/exemption-designations", payload: { phase: "PHASE_I", stock_exchange: "NYSE" }, as: BSAOfficer, as_user_id: "officer-a", captures: { ex2: $.data.id } }
            - { call: "POST /exemption-designations/${ex2}/approve", as: BSAOfficer, as_user_id: "officer-b", captures: { st: $.data.status } }
          assert:
            - "e == 'ERR_PHASE_I_BASIS_INVALID'"
            - "st == 'ACTIVE' with stock_exchange supplied"

      - name: ctr_snapshot_stale_at_file_then_recover
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_CTR_SNAPSHOT_STALE]"]
        distinguishing_aspect: "A VALIDATED CTR whose frozen snapshot diverged (one extra same-day deposit) cannot be filed (ERR_CTR_SNAPSHOT_STALE); the recovery path return-to-draft -> validate -> file succeeds with the refreshed snapshot."
        test_recipe:
          setup: ["branch, customer tin 32-3232323; deposit 1100000 on 2026-08-01 -> CTR; validated (snapshot 1100000); clock 2026-08-01T09:00:00Z"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /branches", payload: { name: "Main", branch_code: "BR1" }, as: SystemAdmin, captures: { br1: $.data.id } }
            - { call: "POST /customers", payload: { legal_name: "Stale Stan", tin: "32-3232323", customer_type: "INDIVIDUAL", account_opened_date: "2026-01-15T00:00:00Z" }, as: BranchManager, captures: { c1: $.data.id } }
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 1100000, occurred_at: "2026-08-01T08:00:00Z" }, as: Teller }
            - { call: "GET /ctrs", payload: { customer_id: "${c1}" }, as: BSAOfficer, captures: { ctr1: "$.data[0].id" } }
            - { call: "POST /ctrs/${ctr1}/validate", as: ComplianceAnalyst, as_user_id: "analyst-x" }
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 1, occurred_at: "2026-08-01T08:30:00Z" }, as: Teller }
          trigger:
            - { call: "POST /ctrs/${ctr1}/file", payload: { filing_channel: "EFILE" }, as: BSAOfficer, as_user_id: "officer-y", captures: { e: $.data.error_id } }
            - { call: "POST /ctrs/${ctr1}/return-to-draft", as: ComplianceAnalyst, as_user_id: "analyst-x" }
            - { call: "POST /ctrs/${ctr1}/validate", as: ComplianceAnalyst, as_user_id: "analyst-x" }
            - { call: "POST /ctrs/${ctr1}/file", payload: { filing_channel: "EFILE" }, as: BSAOfficer, as_user_id: "officer-y", captures: { st: $.data.status, snap: $.data.snapshot_cash_in_cents } }
          assert:
            - "e == 'ERR_CTR_SNAPSHOT_STALE' (frozen 1100000 != current 1100001)"
            - "st == 'FILED' and snap == 1100001 (snapshot refreshed via return-to-draft)"

      - name: duplicate_case_number_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_DUPLICATE_CASE_NUMBER]"]
        distinguishing_aspect: "case_number uniqueness is global across regulators and disjoint scopes: a second case with the same number fails even when no scope overlap exists."
        test_recipe:
          setup: ["existing case FINCEN CASE-500 scope [2025-01-01, 2025-06-30)"]
          setup_api_calls:
            - { call: "POST /examination-cases", payload: { regulator: "FINCEN", case_number: "CASE-500", scope_start_date: "2025-01-01", scope_end_date: "2025-06-30" }, as: Examiner, captures: { k1: $.data.id } }
          trigger:
            - { call: "POST /examination-cases", payload: { regulator: "OCC", case_number: "CASE-500", scope_start_date: "2026-01-01", scope_end_date: "2026-06-30" }, as: Examiner, captures: { e: $.data.error_id } }
          assert:
            - "e == 'ERR_DUPLICATE_CASE_NUMBER'"

      - name: finding_target_must_resolve_per_type
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_FINDING_TARGET_NOT_FOUND]"]
        distinguishing_aspect: "A finding whose target_id does not resolve for the declared target_type fails with 404 ERR_FINDING_TARGET_NOT_FOUND (polymorphic reference integrity)."
        test_recipe:
          setup: ["case FINCEN CASE-600 in FIELDWORK"]
          setup_api_calls:
            - { call: "POST /examination-cases", payload: { regulator: "FINCEN", case_number: "CASE-600", scope_start_date: "2025-01-01", scope_end_date: "2026-01-01" }, as: Examiner, captures: { k1: $.data.id } }
            - { call: "POST /examination-cases/${k1}/begin-fieldwork", as: Examiner }
          trigger:
            - { call: "POST /examination-cases/${k1}/findings", payload: { severity: "OBSERVATION", target_type: "CTR", target_id: "00000000-0000-0000-0000-000000000000", description: "ghost ctr" }, as: Examiner, captures: { e: $.data.error_id } }
          assert:
            - "e == 'ERR_FINDING_TARGET_NOT_FOUND'"

      - name: ctr_incomplete_missing_tin_fixed_by_patch
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_CTR_INCOMPLETE]", "concurrency_rules[customer-profile-stale-update]"]
        distinguishing_aspect: "A CTR for a customer without TIN fails validation with ERR_CTR_INCOMPLETE; after a BranchManager PATCHes tin (OCC), the same validate call succeeds — cross-entity completeness."
        test_recipe:
          setup: ["branch; customer WITHOUT tin; deposit 1100000 on 2026-08-01 -> DRAFT CTR; clock 2026-08-01T09:00:00Z"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /branches", payload: { name: "Main", branch_code: "BR1" }, as: SystemAdmin, captures: { br1: $.data.id } }
            - { call: "POST /customers", payload: { legal_name: "No Tin Nina", customer_type: "INDIVIDUAL", account_opened_date: "2026-01-15T00:00:00Z" }, as: BranchManager, captures: { c1: $.data.id, c_v: $.data.version } }
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 1100000, occurred_at: "2026-08-01T08:00:00Z" }, as: Teller }
            - { call: "GET /ctrs", payload: { customer_id: "${c1}" }, as: BSAOfficer, captures: { ctr1: "$.data[0].id" } }
          trigger:
            - { call: "POST /ctrs/${ctr1}/validate", as: ComplianceAnalyst, as_user_id: "analyst-x", captures: { e: $.data.error_id } }
            - { call: "PATCH /customers/${c1}", payload: { tin: "33-3333330", expected_customer_version: "${c_v}" }, as: BranchManager, captures: { c_v2: $.data.version } }
            - { call: "POST /ctrs/${ctr1}/validate", as: ComplianceAnalyst, as_user_id: "analyst-x", captures: { st: $.data.status } }
          assert:
            - "e == 'ERR_CTR_INCOMPLETE'"
            - "c_v2 == 2 (PATCH bumped Customer.version)"
            - "st == 'VALIDATED'"

      - name: double_void_rejected_already_voided
        claim_type: idempotency
        grounds: ["validations[priority=6]", "errors[ERR_TRANSACTION_ALREADY_VOIDED]"]
        distinguishing_aspect: "Voiding the same transaction twice is not idempotent-success: the second void returns 409 ERR_TRANSACTION_ALREADY_VOIDED and totals do not shift again."
        test_recipe:
          setup: ["branch, customer; deposit 500000 on 2026-08-01; voided once; clock 2026-08-01T09:00:00Z"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /branches", payload: { name: "Main", branch_code: "BR1" }, as: SystemAdmin, captures: { br1: $.data.id } }
            - { call: "POST /customers", payload: { legal_name: "Double Doug", tin: "34-3434340", customer_type: "INDIVIDUAL", account_opened_date: "2026-01-15T00:00:00Z" }, as: BranchManager, captures: { c1: $.data.id } }
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 500000, occurred_at: "2026-08-01T08:00:00Z" }, as: Teller, captures: { txn1: $.data.id } }
            - { call: "POST /cash-transactions/${txn1}/void", payload: { void_reason: "first" }, as: Teller, as_user_id: "teller-1" }
          trigger:
            - { call: "POST /cash-transactions/${txn1}/void", payload: { void_reason: "second" }, as: Teller, as_user_id: "teller-1", captures: { e: $.data.error_id } }
            - { call: "GET /daily-aggregations", payload: { customer_id: "${c1}", business_date: "2026-08-01" }, as: BSAOfficer, captures: { tot: "$.data[0].total_cash_in_cents" } }
          assert:
            - "e == 'ERR_TRANSACTION_ALREADY_VOIDED'"
            - "tot == 0 (no double subtraction)"

      - name: missing_auth_headers_return_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without X-User-Role / X-User-ID headers is rejected 401 ERR_UNAUTHENTICATED before role checks (priority 1 before 2)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /customers", captures: { e: $.data.error_id } }
          assert:
            - "e == 'ERR_UNAUTHENTICATED'"

      - name: sod_ctr_file_same_operator_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "Segregation of duties compares operator ids across roles: the BSAOfficer whose X-User-ID equals the validating analyst's id cannot file the CTR."
        test_recipe:
          setup: ["branch, customer tin 35-3535353; deposit 1100000 -> CTR validated by operator 'shared-op'"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /branches", payload: { name: "Main", branch_code: "BR1" }, as: SystemAdmin, captures: { br1: $.data.id } }
            - { call: "POST /customers", payload: { legal_name: "SoD Sid", tin: "35-3535353", customer_type: "INDIVIDUAL", account_opened_date: "2026-01-15T00:00:00Z" }, as: BranchManager, captures: { c1: $.data.id } }
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 1100000, occurred_at: "2026-08-01T08:00:00Z" }, as: Teller }
            - { call: "GET /ctrs", payload: { customer_id: "${c1}" }, as: BSAOfficer, captures: { ctr1: "$.data[0].id" } }
            - { call: "POST /ctrs/${ctr1}/validate", as: ComplianceAnalyst, as_user_id: "shared-op" }
          trigger:
            - { call: "POST /ctrs/${ctr1}/file", payload: { filing_channel: "EFILE" }, as: BSAOfficer, as_user_id: "shared-op", captures: { e: $.data.error_id } }
            - { call: "POST /ctrs/${ctr1}/file", payload: { filing_channel: "EFILE" }, as: BSAOfficer, as_user_id: "officer-y", captures: { st: $.data.status } }
          assert:
            - "e == 'ERR_SEGREGATION_OF_DUTIES'"
            - "st == 'FILED' when a different officer files"

      - name: sod_exemption_approve_same_requester_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "The requesting officer cannot approve their own designation request (requester != approver), independent of the CTR filer/validator pair."
        test_recipe:
          setup: ["customer GOVERNMENT_AGENCY; designation requested by officer-a"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /customers", payload: { legal_name: "SoD City", customer_type: "GOVERNMENT_AGENCY", account_opened_date: "2020-01-01T00:00:00Z" }, as: BranchManager, captures: { c1: $.data.id } }
            - { call: "POST /customers/${c1}/exemption-designations", payload: { phase: "PHASE_I" }, as: BSAOfficer, as_user_id: "officer-a", captures: { ex1: $.data.id } }
          trigger:
            - { call: "POST /exemption-designations/${ex1}/approve", as: BSAOfficer, as_user_id: "officer-a", captures: { e: $.data.error_id } }
            - { call: "POST /exemption-designations/${ex1}/approve", as: BSAOfficer, as_user_id: "officer-b", captures: { st: $.data.status } }
          assert:
            - "e == 'ERR_SEGREGATION_OF_DUTIES'"
            - "st == 'ACTIVE' when another officer approves"

      - name: sod_exemption_review_same_designator_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_SEGREGATION_OF_DUTIES]", state_machines.ExemptionDesignation.REVIEW_DUE_to_ACTIVE]
        distinguishing_aspect: "Annual review SoD binds to designated_by_officer_id: the officer who approved the designation cannot pass its annual review; a third officer can."
        test_recipe:
          setup: ["GOVERNMENT_AGENCY designation approved by officer-b at 2026-01-02 (review_due 2027-01-02); clock advanced to 2027-01-03 -> REVIEW_DUE"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-02T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /customers", payload: { legal_name: "SoD Review City", customer_type: "GOVERNMENT_AGENCY", account_opened_date: "2020-01-01T00:00:00Z" }, as: BranchManager, captures: { c1: $.data.id } }
            - { call: "POST /customers/${c1}/exemption-designations", payload: { phase: "PHASE_I" }, as: BSAOfficer, as_user_id: "officer-a", captures: { ex1: $.data.id } }
            - { call: "POST /exemption-designations/${ex1}/approve", as: BSAOfficer, as_user_id: "officer-b" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-01-03T00:00:00Z" }, as: SystemAdmin }
            - { call: "GET /exemption-designations/${ex1}", as: BSAOfficer, captures: { ex_v: $.data.version, ex_st: $.data.status } }
          trigger:
            - { call: "POST /exemption-designations/${ex1}/complete-review", payload: { outcome: "PASS", expected_exemption_version: "${ex_v}" }, as: BSAOfficer, as_user_id: "officer-b", captures: { e: $.data.error_id } }
            - { call: "POST /exemption-designations/${ex1}/complete-review", payload: { outcome: "PASS", expected_exemption_version: "${ex_v}" }, as: BSAOfficer, as_user_id: "officer-c", captures: { st: $.data.status } }
          assert:
            - "ex_st == 'REVIEW_DUE'"
            - "e == 'ERR_SEGREGATION_OF_DUTIES' (reviewer == designated_by_officer_id)"
            - "st == 'ACTIVE' (third officer passes review; failed SoD attempt did not consume the version)"


  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: rbac_teller_cannot_file_ctr_returns_unauthorized
        claim_type: rbac_exclusive_denial
        grounds: [roles.BSAOfficer, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "CTR filing is exclusive to BSAOfficer: a Teller calling POST /ctrs/{id}/file gets 403 ERR_UNAUTHORIZED before any state or fiscal check."
        test_recipe:
          setup: ["branch, customer tin 36-3636363; deposit 1100000 -> CTR validated -> VALIDATED; clock 2026-08-01T09:00:00Z"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /branches", payload: { name: "Main", branch_code: "BR1" }, as: SystemAdmin, captures: { br1: $.data.id } }
            - { call: "POST /customers", payload: { legal_name: "Rbac Rita", tin: "36-3636363", customer_type: "INDIVIDUAL", account_opened_date: "2026-01-15T00:00:00Z" }, as: BranchManager, captures: { c1: $.data.id } }
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 1100000, occurred_at: "2026-08-01T08:00:00Z" }, as: Teller }
            - { call: "GET /ctrs", payload: { customer_id: "${c1}" }, as: BSAOfficer, captures: { ctr1: "$.data[0].id" } }
            - { call: "POST /ctrs/${ctr1}/validate", as: ComplianceAnalyst, as_user_id: "analyst-x" }
          trigger:
            - { call: "POST /ctrs/${ctr1}/file", payload: { filing_channel: "EFILE" }, as: Teller, captures: { e: $.data.error_id } }
          assert:
            - "e == 'ERR_UNAUTHORIZED'"
            - "CTR.${ctr1}.status == 'VALIDATED' (unchanged)"

      - name: rbac_examiner_cannot_post_transactions_but_can_read
        claim_type: rbac_exclusive_denial
        grounds: [roles.Examiner, roles.Teller, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "Examiner is read-only over operational data: POST /cash-transactions as Examiner is denied, while GET /ctrs as Examiner succeeds (shared read surface)."
        test_recipe:
          setup: ["branch, customer; clock 2026-08-01T09:00:00Z"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /branches", payload: { name: "Main", branch_code: "BR1" }, as: SystemAdmin, captures: { br1: $.data.id } }
            - { call: "POST /customers", payload: { legal_name: "Rbac Rex", tin: "37-3737373", customer_type: "INDIVIDUAL", account_opened_date: "2026-01-15T00:00:00Z" }, as: BranchManager, captures: { c1: $.data.id } }
          trigger:
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 100, occurred_at: "2026-08-01T08:00:00Z" }, as: Examiner, captures: { e: $.data.error_id } }
            - { call: "GET /ctrs", payload: {}, as: Examiner, captures: { ok: $.meta.total_count } }
          assert:
            - "e == 'ERR_UNAUTHORIZED'"
            - "ok == 0 (read succeeds, empty list)"

      - name: rbac_analyst_cannot_approve_exemption
        claim_type: rbac_exclusive_denial
        grounds: [roles.BSAOfficer, roles.ComplianceAnalyst, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "Exemption approval is exclusive to BSAOfficer: ComplianceAnalyst (who can triage alerts and validate CTRs) is denied at approve."
        test_recipe:
          setup: ["customer GOVERNMENT_AGENCY; designation PENDING_REVIEW requested by officer-a"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /customers", payload: { legal_name: "Rbac City", customer_type: "GOVERNMENT_AGENCY", account_opened_date: "2020-01-01T00:00:00Z" }, as: BranchManager, captures: { c1: $.data.id } }
            - { call: "POST /customers/${c1}/exemption-designations", payload: { phase: "PHASE_I" }, as: BSAOfficer, as_user_id: "officer-a", captures: { ex1: $.data.id } }
          trigger:
            - { call: "POST /exemption-designations/${ex1}/approve", as: ComplianceAnalyst, as_user_id: "analyst-x", captures: { e: $.data.error_id } }
          assert:
            - "e == 'ERR_UNAUTHORIZED'"
            - "ExemptionDesignation.${ex1}.status == 'PENDING_REVIEW'"

      - name: rbac_manager_cannot_disposition_alert
        claim_type: rbac_exclusive_denial
        grounds: [roles.BSAOfficer, roles.BranchManager, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "Alert disposition (dismiss/refer/reopen) is exclusive to BSAOfficer; BranchManager (who owns customer lifecycle) is denied, while ComplianceAnalyst CAN begin-review (positive control for peer-role split)."
        test_recipe:
          setup: ["branch, customer; manual alert OPEN -> UNDER_REVIEW (by analyst)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /branches", payload: { name: "Main", branch_code: "BR1" }, as: SystemAdmin, captures: { br1: $.data.id } }
            - { call: "POST /customers", payload: { legal_name: "Rbac Ray", tin: "38-3838383", customer_type: "INDIVIDUAL", account_opened_date: "2026-01-15T00:00:00Z" }, as: BranchManager, captures: { c1: $.data.id } }
            - { call: "POST /structuring-alerts", payload: { customer_id: "${c1}", window_start_date: "2026-07-27", window_end_date: "2026-07-31", note: "tip" }, as: BSAOfficer, as_user_id: "officer-z", captures: { al1: $.data.id } }
            - { call: "POST /structuring-alerts/${al1}/begin-review", as: ComplianceAnalyst, as_user_id: "analyst-x", captures: { st: $.data.status } }
          trigger:
            - { call: "POST /structuring-alerts/${al1}/dismiss", payload: { disposition_note: "nope" }, as: BranchManager, captures: { e: $.data.error_id } }
          assert:
            - "st == 'UNDER_REVIEW' (analyst's shared-operation positive control)"
            - "e == 'ERR_UNAUTHORIZED'"

  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_customer_patch_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[customer-profile-stale-update]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "PATCH /customers/{id} carries expected_customer_version: a correct version succeeds and bumps version (1 -> 2); replaying the same observed version is rejected 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["customer created (version 1)"]
          setup_api_calls:
            - { call: "POST /customers", payload: { legal_name: "Occ Olga", customer_type: "INDIVIDUAL", account_opened_date: "2026-01-15T00:00:00Z" }, as: BranchManager, captures: { c1: $.data.id, c_v: $.data.version } }
          trigger:
            - { call: "PATCH /customers/${c1}", payload: { tin: "39-3939393", expected_customer_version: "${c_v}" }, as: BranchManager, captures: { v2: $.data.version } }
            - { call: "PATCH /customers/${c1}", payload: { legal_name: "Occ Olga Renamed", expected_customer_version: "${c_v}" }, as: BranchManager, captures: { e: $.data.error_id } }
          assert:
            - "v2 == 2"
            - "e == 'ERR_STALE_VERSION' (the second writer's view of version 1 is stale)"
            - "Customer.${c1}.legal_name == 'Occ Olga' (losing write discarded)"

      - name: occ_ctr_amend_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[ctr-amend-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Amending a FILED CTR with an expected_ctr_version one behind the current version is rejected 412 (OCC fires at priority 5, before the state and temporal checks); with the fresh version the same call succeeds."
        test_recipe:
          setup: ["branch, customer tin 41-4141414; deposit 1100000 -> CTR validated + FILED; clock 2026-08-01T09:00:00Z"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /branches", payload: { name: "Main", branch_code: "BR1" }, as: SystemAdmin, captures: { br1: $.data.id } }
            - { call: "POST /customers", payload: { legal_name: "Occ Carl", tin: "41-4141414", customer_type: "INDIVIDUAL", account_opened_date: "2026-01-15T00:00:00Z" }, as: BranchManager, captures: { c1: $.data.id } }
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 1100000, occurred_at: "2026-08-01T08:00:00Z" }, as: Teller }
            - { call: "GET /ctrs", payload: { customer_id: "${c1}" }, as: BSAOfficer, captures: { ctr1: "$.data[0].id" } }
            - { call: "POST /ctrs/${ctr1}/validate", as: ComplianceAnalyst, as_user_id: "analyst-x" }
            - { call: "POST /ctrs/${ctr1}/file", payload: { filing_channel: "EFILE" }, as: BSAOfficer, as_user_id: "officer-y" }
            - { call: "GET /ctrs/${ctr1}", as: BSAOfficer, captures: { ctr_v: $.data.version } }
          trigger:
            - { call: "POST /ctrs/${ctr1}/amendments", payload: { amendment_reason: "stale attempt", expected_ctr_version: "${ctr_v} - 1" }, as: BSAOfficer, as_user_id: "officer-y", captures: { e: $.data.error_id } }
            - { call: "POST /ctrs/${ctr1}/amendments", payload: { amendment_reason: "fresh attempt", expected_ctr_version: "${ctr_v}" }, as: BSAOfficer, as_user_id: "officer-y", captures: { succ: $.data.id } }
          assert:
            - "e == 'ERR_STALE_VERSION'"
            - "succ non-null and CTR.${ctr1}.status == 'SUPERSEDED'"

      - name: occ_exemption_review_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[exemption-review-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "complete-review OCC: an expected_exemption_version below current is rejected 412 even when all business rules pass; the fresh version completes the review."
        test_recipe:
          setup: ["GOVERNMENT_AGENCY designation approved 2026-01-02 (officer-b); clock 2027-01-03 -> REVIEW_DUE"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-02T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /customers", payload: { legal_name: "Occ City", customer_type: "GOVERNMENT_AGENCY", account_opened_date: "2020-01-01T00:00:00Z" }, as: BranchManager, captures: { c1: $.data.id } }
            - { call: "POST /customers/${c1}/exemption-designations", payload: { phase: "PHASE_I" }, as: BSAOfficer, as_user_id: "officer-a", captures: { ex1: $.data.id } }
            - { call: "POST /exemption-designations/${ex1}/approve", as: BSAOfficer, as_user_id: "officer-b" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-01-03T00:00:00Z" }, as: SystemAdmin }
            - { call: "GET /exemption-designations/${ex1}", as: BSAOfficer, captures: { ex_v: $.data.version } }
          trigger:
            - { call: "POST /exemption-designations/${ex1}/complete-review", payload: { outcome: "PASS", expected_exemption_version: "${ex_v} - 1" }, as: BSAOfficer, as_user_id: "officer-c", captures: { e: $.data.error_id } }
            - { call: "POST /exemption-designations/${ex1}/complete-review", payload: { outcome: "PASS", expected_exemption_version: "${ex_v}" }, as: BSAOfficer, as_user_id: "officer-c", captures: { st: $.data.status } }
          assert:
            - "e == 'ERR_STALE_VERSION'"
            - "st == 'ACTIVE'"

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_read_after_write_consistency
        claim_type: immediate_consistency
        grounds: [complexity_profile, calculations.daily_cash_aggregation]
        distinguishing_aspect: "Consistency model is immediate: the very next GET after a deposit reflects the recomputed aggregation (totals, counts, ctr_required) in the same clock tick — no eventual-consistency lag."
        test_recipe:
          setup: ["branch, customer; clock 2026-08-01T09:00:00Z"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /branches", payload: { name: "Main", branch_code: "BR1" }, as: SystemAdmin, captures: { br1: $.data.id } }
            - { call: "POST /customers", payload: { legal_name: "Consistent Kim", tin: "42-4242424", customer_type: "INDIVIDUAL", account_opened_date: "2026-01-15T00:00:00Z" }, as: BranchManager, captures: { c1: $.data.id } }
          trigger:
            - { call: "POST /cash-transactions", payload: { customer_id: "${c1}", branch_id: "${br1}", direction: "CASH_IN", amount_cents: 1100000, occurred_at: "2026-08-01T08:00:00Z" }, as: Teller }
            - { call: "GET /daily-aggregations", payload: { customer_id: "${c1}", business_date: "2026-08-01" }, as: Teller, captures: { tot: "$.data[0].total_cash_in_cents", req: "$.data[0].ctr_required" } }
            - { call: "GET /ctrs", payload: { customer_id: "${c1}" }, as: Teller, captures: { ctrs: $.meta.total_count } }
          assert:
            - "tot == 1100000 and req == true (visible in the immediately-following read)"
            - "ctrs == 1 (auto-created DRAFT also immediately visible)"

