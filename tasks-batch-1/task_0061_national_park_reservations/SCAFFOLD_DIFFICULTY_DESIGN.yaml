scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dual_variant_camp_group_vs_tent_pricing
        grounds:
          - calculations.camp_total
          - entities.Campsite.fields.site_type
          - entities.Campsite.fields.group_extra_person_cents
        distinguishing_aspect: |
          Same nights and party_size produce a different total on a GROUP site
          (base + extra-person surcharge per night) than on a TENT site
          (flat base per night) — two algorithm branches on the Campsite domain.
        test_recipe:
          setup:
            - "One park; one tent campsite base 4000c/night; one group campsite base 10000c covering 10 persons, extra 500c/person; clock fixed."
          setup_api_calls:
            - call: "POST /v1/parks"
              payload: { code: "YOSE", name: "Yosemite", utc_offset_minutes: -480 }
              as: system
              captures: { park_id: $.data.id }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { now_utc: "2026-06-01T00:00:00Z" }
              as: park_admin
            - call: "POST /v1/accounts"
              payload: { email: "pa@x.com", full_name: "PA", birth_date: "1980-01-01", role: "park_admin", home_park_id: "${park_id}" }
              as: system
              captures: { pa_id: $.data.id }
            - call: "POST /v1/accounts"
              payload: { email: "v@x.com", full_name: "V", birth_date: "1990-01-01" }
              as: visitor
              captures: { v_id: $.data.id }
            - call: "POST /v1/campsites"
              payload: { park_id: "${park_id}", site_number: "T1", site_type: "tent", max_occupancy: 6, base_nightly_cents: 4000 }
              as: park_admin
              as_user_id: "${pa_id}"
              captures: { tent_id: $.data.id }
            - call: "POST /v1/campsites"
              payload: { park_id: "${park_id}", site_number: "G1", site_type: "group", max_occupancy: 30, base_nightly_cents: 0, group_base_cents: 10000, group_included_persons: 10, group_extra_person_cents: 500 }
              as: park_admin
              as_user_id: "${pa_id}"
              captures: { group_id: $.data.id }
          trigger:
            - call: "POST /v1/camp-reservations"
              payload: { campsite_id: "${tent_id}", account_id: "${v_id}", check_in: "2026-06-10", check_out: "2026-06-12", party_size: 4 }
              as: visitor
              as_user_id: "${v_id}"
              captures: { tent_resv: $.data.id, tent_total: $.data.total_cents }
            - call: "POST /v1/camp-reservations"
              payload: { campsite_id: "${group_id}", account_id: "${v_id}", check_in: "2026-06-10", check_out: "2026-06-12", party_size: 15 }
              as: visitor
              as_user_id: "${v_id}"
              captures: { group_resv: $.data.id, group_total: $.data.total_cents }
          assert:
            - "tent reservation total_cents == 8000"   # 4000 * 2 nights
            - "group reservation total_cents == 25000"  # (10000 + 500*5) * 2 nights
            - "group reservation total_cents != tent reservation total_cents"

      - name: dual_variant_backcountry_fee_vs_lottery_permit_fee
        grounds:
          - calculations.backcountry_fee
          - calculations.lottery_selection
          - entities.Trailhead.fields.per_person_per_night_cents
          - entities.LotteryDraw.fields.permit_fee_per_person_cents
        distinguishing_aspect: |
          The BackcountryPermit fee algorithm (flat reservation fee + per-person
          per-night variable) differs in kind from the LotteryApplication permit
          fee (flat per-person, no nights and no flat reservation fee) — two
          fee formulas on two different entity domains, yielding different cents
          for the same person count.
        test_recipe:
          setup:
            - "One park; one trailhead (flat 500c, 800c/person/night); one lottery draw permit fee 1500c/person; clock fixed inside the lottery application window."
          setup_api_calls:
            - call: "POST /v1/parks"
              payload: { code: "ZION", name: "Zion", utc_offset_minutes: -420 }
              as: system
              captures: { park_id: $.data.id }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { now_utc: "2026-06-01T00:00:00Z" }
              as: park_admin
            - call: "POST /v1/accounts"
              payload: { email: "pa2@x.com", full_name: "PA2", birth_date: "1980-01-01", role: "park_admin", home_park_id: "${park_id}" }
              as: system
              captures: { pa_id: $.data.id }
            - call: "POST /v1/accounts"
              payload: { email: "v2@x.com", full_name: "V2", birth_date: "1990-01-01" }
              as: visitor
              captures: { v_id: $.data.id }
            - call: "POST /v1/trailheads"
              payload: { park_id: "${park_id}", name: "TH1", daily_exit_quota: 10, reservation_fee_cents: 500, per_person_per_night_cents: 800 }
              as: park_admin
              as_user_id: "${pa_id}"
              captures: { th_id: $.data.id }
            - call: "POST /v1/wilderness-zones"
              payload: { park_id: "${park_id}", name: "Z1", nightly_party_quota: 5 }
              as: park_admin
              as_user_id: "${pa_id}"
              captures: { z1_id: $.data.id }
            - call: "POST /v1/lottery-draws"
              payload: { park_id: "${park_id}", objective: "the_wave", use_date: "2026-09-01", daily_quota: 20, application_open_at: "2026-05-01T00:00:00Z", application_close_at: "2026-07-01T00:00:00Z", draw_at: "2026-07-02T00:00:00Z", permit_fee_per_person_cents: 1500 }
              as: park_admin
              as_user_id: "${pa_id}"
              captures: { draw_id: $.data.id }
          trigger:
            - call: "POST /v1/backcountry-permits"
              payload: { park_id: "${park_id}", account_id: "${v_id}", trailhead_id: "${th_id}", entry_date: "2026-08-01", nights: 2, party_size: 3, zone_nights: [ { zone_id: "${z1_id}", date: "2026-08-01" }, { zone_id: "${z1_id}", date: "2026-08-02" } ] }
              as: visitor
              as_user_id: "${v_id}"
              captures: { permit_id: $.data.id, permit_fee: $.data.fee_cents }
            - call: "POST /v1/lottery-draws/${draw_id}/applications"
              payload: { account_id: "${v_id}", party_size: 3 }
              as: visitor
              as_user_id: "${v_id}"
              captures: { app_id: $.data.id, app_fee: $.data.application_fee_cents }
          assert:
            - "backcountry permit fee_cents == 5300"   # 500 + 800*3*2
            - "lottery application application_fee_cents == 1000"  # draw default
            - "backcountry permit fee_cents != 1500*3 (permit fee would be 4500 on award, structurally different formula)"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: combinatorial_group_pricing_three_inputs_nonlinear
        grounds:
          - calculations.camp_total
          - entities.Campsite.fields.group_included_persons
          - entities.Campsite.fields.group_extra_person_cents
        distinguishing_aspect: |
          Mode (a): camp_total for a group site combines three inputs
          (group_base, max(0, party_size-included)*extra, nights) with a
          non-linear max(0,...) gate on the extra-person term.
        test_recipe:
          setup:
            - "Group site base 10000c covering 10, extra 500c; reservation of 8 persons (below included → zero surcharge) for 3 nights."
          setup_api_calls:
            - call: "POST /v1/parks"
              payload: { code: "GRCA", name: "Grand Canyon", utc_offset_minutes: -420 }
              as: system
              captures: { park_id: $.data.id }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { now_utc: "2026-06-01T00:00:00Z" }
              as: park_admin
            - call: "POST /v1/accounts"
              payload: { email: "pa3@x.com", full_name: "PA3", birth_date: "1980-01-01", role: "park_admin", home_park_id: "${park_id}" }
              as: system
              captures: { pa_id: $.data.id }
            - call: "POST /v1/accounts"
              payload: { email: "v3@x.com", full_name: "V3", birth_date: "1990-01-01" }
              as: visitor
              captures: { v_id: $.data.id }
            - call: "POST /v1/campsites"
              payload: { park_id: "${park_id}", site_number: "G9", site_type: "group", max_occupancy: 30, base_nightly_cents: 0, group_base_cents: 10000, group_included_persons: 10, group_extra_person_cents: 500 }
              as: park_admin
              as_user_id: "${pa_id}"
              captures: { group_id: $.data.id }
          trigger:
            - call: "POST /v1/camp-reservations"
              payload: { campsite_id: "${group_id}", account_id: "${v_id}", check_in: "2026-06-10", check_out: "2026-06-13", party_size: 8 }
              as: visitor
              as_user_id: "${v_id}"
              captures: { resv_id: $.data.id, total: $.data.total_cents }
          assert:
            - "total_cents == 30000"   # max(0, 8-10)=0 → (10000 + 0) * 3 nights

      - name: combinatorial_cancel_refund_pct_then_round_half_up
        grounds:
          - calculations.cancel_refund
          - calculations.backcountry_fee
          - entities.BackcountryPermit.fields.refunded_cents
        distinguishing_aspect: |
          Mode (b): the refund pins ONE rounding step — round_half_up applied to
          (refundable_base * pct/100) after subtracting the flat non-refundable
          reservation fee — so an odd refundable base at 25% rounds half-up to a
          specific cent, not floor/truncate.
        test_recipe:
          setup:
            - "Confirmed backcountry permit; cancellation 4 days before entry (25% band); refundable base chosen so 25% has a half-cent that rounds up."
          setup_api_calls:
            - call: "POST /v1/parks"
              payload: { code: "SEKI", name: "Sequoia", utc_offset_minutes: -480 }
              as: system
              captures: { park_id: $.data.id }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { now_utc: "2026-06-01T00:00:00Z" }
              as: park_admin
            - call: "POST /v1/accounts"
              payload: { email: "pa4@x.com", full_name: "PA4", birth_date: "1980-01-01", role: "park_admin", home_park_id: "${park_id}" }
              as: system
              captures: { pa_id: $.data.id }
            - call: "POST /v1/accounts"
              payload: { email: "v4@x.com", full_name: "V4", birth_date: "1990-01-01" }
              as: visitor
              captures: { v_id: $.data.id }
            - call: "POST /v1/trailheads"
              payload: { park_id: "${park_id}", name: "TH2", daily_exit_quota: 10, reservation_fee_cents: 500, per_person_per_night_cents: 333 }
              as: park_admin
              as_user_id: "${pa_id}"
              captures: { th_id: $.data.id }
            - call: "POST /v1/wilderness-zones"
              payload: { park_id: "${park_id}", name: "Z2", nightly_party_quota: 5 }
              as: park_admin
              as_user_id: "${pa_id}"
              captures: { z_id: $.data.id }
            - call: "POST /v1/backcountry-permits"
              payload: { park_id: "${park_id}", account_id: "${v_id}", trailhead_id: "${th_id}", entry_date: "2026-06-05", nights: 1, party_size: 3, zone_nights: [ { zone_id: "${z_id}", date: "2026-06-05" } ] }
              as: visitor
              as_user_id: "${v_id}"
              captures: { permit_id: $.data.id, fee: $.data.fee_cents }
            - call: "POST /v1/backcountry-permits/${permit_id}/confirm"
              payload: {}
              as: visitor
              as_user_id: "${v_id}"
          trigger:
            - call: "POST /v1/backcountry-permits/${permit_id}/cancel"
              payload: {}
              as: visitor
              as_user_id: "${v_id}"
              captures: { refunded: $.data.refunded_cents }
          assert:
            - "fee_cents == 1499"            # 500 + 333*3*1
            - "refunded_cents == 250"        # refundable_base = 1499-500 = 999; 25% = 249.75 → round_half_up 250
            - "Account.${v_id}.credit_balance_cents == 250"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: branching_camp_reservation_confirm_vs_cancel_paths
        grounds:
          - state_machines.CampReservation.held_to_confirmed
          - state_machines.CampReservation.held_to_cancelled
          - state_machines.CampReservation.confirmed_to_checked_in
        distinguishing_aspect: |
          CampReservation forks from held into {confirmed, cancelled, expired}
          with divergent side-effects (confirm captures payment; cancel voids
          and cascades a waitlist offer) — a branching, non-linear shape on the
          CampReservation entity.
        test_recipe:
          setup:
            - "One tent site; one held reservation; clock inside booking window."
          setup_api_calls:
            - call: "POST /v1/parks"
              payload: { code: "ACAD", name: "Acadia", utc_offset_minutes: -300 }
              as: system
              captures: { park_id: $.data.id }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { now_utc: "2026-06-01T00:00:00Z" }
              as: park_admin
            - call: "POST /v1/accounts"
              payload: { email: "pa5@x.com", full_name: "PA5", birth_date: "1980-01-01", role: "park_admin", home_park_id: "${park_id}" }
              as: system
              captures: { pa_id: $.data.id }
            - call: "POST /v1/accounts"
              payload: { email: "v5@x.com", full_name: "V5", birth_date: "1990-01-01" }
              as: visitor
              captures: { v_id: $.data.id }
            - call: "POST /v1/campsites"
              payload: { park_id: "${park_id}", site_number: "T5", site_type: "tent", max_occupancy: 6, base_nightly_cents: 4000 }
              as: park_admin
              as_user_id: "${pa_id}"
              captures: { site_id: $.data.id }
            - call: "POST /v1/camp-reservations"
              payload: { campsite_id: "${site_id}", account_id: "${v_id}", check_in: "2026-06-20", check_out: "2026-06-22", party_size: 2 }
              as: visitor
              as_user_id: "${v_id}"
              captures: { resv_id: $.data.id }
          trigger:
            - call: "POST /v1/camp-reservations/${resv_id}/confirm"
              payload: {}
              as: visitor
              as_user_id: "${v_id}"
              captures: { st: $.data.status }
          assert:
            - "CampReservation.${resv_id}.status == confirmed"
            - "CampReservation.${resv_id}.hold_expires_at == null"

      - name: branching_lottery_application_won_accept_vs_decline
        grounds:
          - state_machines.LotteryApplication.submitted_to_won
          - state_machines.LotteryApplication.won_to_awarded
          - state_machines.LotteryApplication.won_to_declined
        distinguishing_aspect: |
          LotteryApplication forks from won into {awarded, declined} with
          divergent side-effects (accept captures a permit fee; decline releases
          persons to the pool) — a branching, non-linear shape on a different
          entity than CampReservation.
        test_recipe:
          setup:
            - "Draw with quota 6; one application party 2 that wins; clock advanced past draw_at; draw run."
          setup_api_calls:
            - call: "POST /v1/parks"
              payload: { code: "OLYM", name: "Olympic", utc_offset_minutes: -480 }
              as: system
              captures: { park_id: $.data.id }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { now_utc: "2026-05-10T00:00:00Z" }
              as: park_admin
            - call: "POST /v1/accounts"
              payload: { email: "pa6@x.com", full_name: "PA6", birth_date: "1980-01-01", role: "park_admin", home_park_id: "${park_id}" }
              as: system
              captures: { pa_id: $.data.id }
            - call: "POST /v1/accounts"
              payload: { email: "v6@x.com", full_name: "V6", birth_date: "1990-01-01" }
              as: visitor
              captures: { v_id: $.data.id }
            - call: "POST /v1/lottery-draws"
              payload: { park_id: "${park_id}", objective: "half_dome_cables", use_date: "2026-09-01", daily_quota: 6, application_open_at: "2026-05-01T00:00:00Z", application_close_at: "2026-06-01T00:00:00Z", draw_at: "2026-06-02T00:00:00Z", permit_fee_per_person_cents: 1000 }
              as: park_admin
              as_user_id: "${pa_id}"
              captures: { draw_id: $.data.id }
            - call: "POST /v1/lottery-draws/${draw_id}/applications"
              payload: { account_id: "${v_id}", party_size: 2 }
              as: visitor
              as_user_id: "${v_id}"
              captures: { app_id: $.data.id }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { now_utc: "2026-06-02T01:00:00Z" }
              as: park_admin
            - call: "POST /v1/lottery-draws/${draw_id}/draw"
              payload: {}
              as: park_admin
              as_user_id: "${pa_id}"
          trigger:
            - call: "POST /v1/lottery-applications/${app_id}/accept"
              payload: {}
              as: visitor
              as_user_id: "${v_id}"
              captures: { st: $.data.status, pp: $.data.permit_payment_id }
          assert:
            - "LotteryApplication.${app_id}.status == awarded"
            - "LotteryApplication.${app_id}.permit_payment_id is not null"
            - "Payment(permit_payment_id).amount_cents == 2000"   # 1000 * 2

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cascade_camp_cancel_offer_claim_creates_reservation
        grounds:
          - state_machines.CampReservation.confirmed_to_cancelled
          - state_machines.WaitlistEntry.waiting_to_offered
          - state_machines.WaitlistEntry.offered_to_claimed
        distinguishing_aspect: |
          Depth >= 3 cascade: cancelling a confirmed CampReservation (A) frees
          dates which flips the lowest-position WaitlistEntry waiting->offered
          (B); that B, when claimed, itself creates a new confirmed
          CampReservation (C) — each link caused by the previous, not by the
          original cancel.
        test_recipe:
          setup:
            - "One tent site; confirmed reservation R by visitor A; a waiting WaitlistEntry W (position 1) for the identical range by visitor B; clock inside window."
          setup_api_calls:
            - call: "POST /v1/parks"
              payload: { code: "ROMO", name: "Rocky Mtn", utc_offset_minutes: -420 }
              as: system
              captures: { park_id: $.data.id }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { now_utc: "2026-06-01T00:00:00Z" }
              as: park_admin
            - call: "POST /v1/accounts"
              payload: { email: "pa7@x.com", full_name: "PA7", birth_date: "1980-01-01", role: "park_admin", home_park_id: "${park_id}" }
              as: system
              captures: { pa_id: $.data.id }
            - call: "POST /v1/accounts"
              payload: { email: "a7@x.com", full_name: "A7", birth_date: "1990-01-01" }
              as: visitor
              captures: { a_id: $.data.id }
            - call: "POST /v1/accounts"
              payload: { email: "b7@x.com", full_name: "B7", birth_date: "1990-01-01" }
              as: visitor
              captures: { b_id: $.data.id }
            - call: "POST /v1/campsites"
              payload: { park_id: "${park_id}", site_number: "T7", site_type: "tent", max_occupancy: 6, base_nightly_cents: 4000 }
              as: park_admin
              as_user_id: "${pa_id}"
              captures: { site_id: $.data.id, site_v0: $.data.version }
            - call: "POST /v1/camp-reservations"
              payload: { campsite_id: "${site_id}", account_id: "${a_id}", check_in: "2026-06-25", check_out: "2026-06-27", party_size: 2 }
              as: visitor
              as_user_id: "${a_id}"
              captures: { r_id: $.data.id }
            - call: "POST /v1/camp-reservations/${r_id}/confirm"
              payload: {}
              as: visitor
              as_user_id: "${a_id}"
            - call: "GET /v1/campsites/${site_id}"
              payload: {}
              as: visitor
              as_user_id: "${b_id}"
              captures: { site_v1: $.data.version }
            - call: "POST /v1/waitlist-entries"
              payload: { campsite_id: "${site_id}", account_id: "${b_id}", check_in: "2026-06-25", check_out: "2026-06-27", party_size: 2, expected_campsite_version: "${site_v1}" }
              as: visitor
              as_user_id: "${b_id}"
              captures: { w_id: $.data.id }
          trigger:
            - call: "POST /v1/camp-reservations/${r_id}/cancel"
              payload: {}
              as: visitor
              as_user_id: "${a_id}"
            - call: "GET /v1/waitlist-entries/${w_id}"
              payload: {}
              as: visitor
              as_user_id: "${b_id}"
              captures: { w_status_after_cancel: $.data.status }
            - call: "POST /v1/waitlist-entries/${w_id}/claim"
              payload: {}
              as: visitor
              as_user_id: "${b_id}"
              captures: { new_resv_id: $.data.id, new_resv_status: $.data.status, origin: $.data.origin_waitlist_id }
          assert:
            - "after cancel WaitlistEntry.${w_id}.status == offered"
            - "after claim WaitlistEntry.${w_id}.status == claimed"
            - "new CampReservation.${new_resv_id}.status == confirmed"
            - "new CampReservation.${new_resv_id}.origin_waitlist_id == ${w_id}"

      - name: cascade_lottery_draw_win_sets_deadline_then_ops_lapse_releases
        grounds:
          - state_machines.LotteryApplication.submitted_to_won
          - state_machines.LotteryApplication.won_to_declined
          - entities.LotteryDraw.fields.awarded_count
        distinguishing_aspect: |
          Depth >= 2 cascade from a different trigger: running the draw flips an
          application submitted->won and bumps draw.awarded_count (A->B); a later
          ops sweep past the award deadline flips that won->declined which itself
          decrements draw.awarded_count back (B->C), restoring the pool.
        test_recipe:
          setup:
            - "Draw quota 4; one application party 2; draw run so it wins and awarded_count=2; clock advanced past award_accept_deadline (draw_at+72h)."
          setup_api_calls:
            - call: "POST /v1/parks"
              payload: { code: "GLAC", name: "Glacier", utc_offset_minutes: -420 }
              as: system
              captures: { park_id: $.data.id }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { now_utc: "2026-05-10T00:00:00Z" }
              as: park_admin
            - call: "POST /v1/accounts"
              payload: { email: "pa8@x.com", full_name: "PA8", birth_date: "1980-01-01", role: "park_admin", home_park_id: "${park_id}" }
              as: system
              captures: { pa_id: $.data.id }
            - call: "POST /v1/accounts"
              payload: { email: "v8@x.com", full_name: "V8", birth_date: "1990-01-01" }
              as: visitor
              captures: { v_id: $.data.id }
            - call: "POST /v1/lottery-draws"
              payload: { park_id: "${park_id}", objective: "half_dome_cables", use_date: "2026-09-01", daily_quota: 4, application_open_at: "2026-05-01T00:00:00Z", application_close_at: "2026-06-01T00:00:00Z", draw_at: "2026-06-02T00:00:00Z", permit_fee_per_person_cents: 1000 }
              as: park_admin
              as_user_id: "${pa_id}"
              captures: { draw_id: $.data.id }
            - call: "POST /v1/lottery-draws/${draw_id}/applications"
              payload: { account_id: "${v_id}", party_size: 2 }
              as: visitor
