# =============================================================================
# PRD Benchmark Seed Tables — Dog Show & Performance Trial Management
# Sections §1.0–§1.7. Difficulty design → SCAFFOLD_DIFFICULTY_DESIGN.yaml
#                     Corner design    → SCAFFOLD_CORNER_DESIGN.yaml
# =============================================================================

scenario: |
  2902. Dog Show & Performance Trial Management (kennel club event committee): event application
  with club approval, judge panel selection and assignment limits, entry processing with breed,
  class and armband assignment along with entry limits by judge, ring schedule construction with
  judging speed standards and conflict resolution for handlers in multiple rings, conformation
  judging progression through breed, group and best in show with points calculation toward
  championships, performance events including agility, obedience and rally with course design,
  measuring and scoring rules, results reporting to the registry for title recording, health and
  welfare rules including bitches in season and temperature restrictions, protest and
  disqualification procedures

domain_name: dog-show-trials
api_prefix: /dog-shows

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §0.1–§0.3 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency
    - conditional_feature_flags

  entity_topology: flat
  # Every entity is a peer addressed at `/dog-shows/<collection>/{id}`; parentage is
  # expressed exclusively through FK fields in request bodies, never through nested
  # URL paths. The only sub-resource reads are the two reverse-reachability GETs
  # (`/shows/{id}/registry-filings`, `/entries/{id}/performance-runs`).

  state_machine_shape: branching
  # Show is a branching fork with a revision loop (SUBMITTED → {APPROVED, RETURNED},
  # RETURNED → SUBMITTED). Protest is cyclic (UNDER_REVIEW ⇄ EVIDENCE_REQUESTED).
  # Entry carries two independent state dimensions (entry_status × welfare_status).
  # RingBlock carries a PUBLISHED → PUBLISHED self-loop (reschedule).

  relationship_patterns:
    - one_to_many          # Show → ShowClass, Show → Entry, Entry → PerformanceRun
    - many_to_many         # Show ⇄ Judge through JudgePanelSlot
    - self_referential     # ShowClass.parent_class_id (breed → group → best-in-show),
                           # Entry.promoted_from_entry_id, RingBlock.superseded_block_id
    - cross_aggregate      # Entry.points_awarded reconciles into Dog.championship_points_total

  role_model: segregation_of_duties
  # The SanctionOfficer user id that approved a Show may not decide a Protest on that
  # Show; a Judge holding a slot on a feeder BREED class may not be assigned to the
  # GROUP class that class advances into.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 12 entities / 54 endpoints / 55 error codes / 14 calculations (2 carrying variants) /
  # 7 state machines. Density target: every calculation reads fields written by another
  # entity's transition, so no table can be implemented in isolation.

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Club
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Legal name of the kennel club applying to host events.
      - name: club_code
        type: string
        source: input
        description: Short club identifier, unique across all clubs.
        constraints: "3-8 uppercase alphanumerics; unique"
      - name: region_code
        type: string
        source: input
        description: Registry region the club belongs to.
        constraints: "one of NE, SE, MW, WC"
      - name: sanction_status
        type: enum
        source: input
        default: ACTIVE
        description: Registry standing of the club; only ACTIVE clubs may have a show application approved.
        constraints: "ACTIVE | PROBATION | SUSPENDED"
      - name: annual_event_allowance
        type: integer
        source: input
        default: 2
        description: Maximum number of shows of this club that may reach APPROVED or beyond in the calendar year of show_date.
        constraints: ">= 0"
      - name: events_approved_count
        type: integer
        source: computed
        default: 0
        description: "Count of Shows with club_id == this club and status IN {APPROVED, IN_PROGRESS, COMPLETED, RESULTS_FILED}."
      - name: sanction_note
        type: string
        source: input
        default: null
        description: Free-text note explaining a PROBATION or SUSPENDED standing.

  - name: Show
    parent: null
    common_fields: true
    fields:
      - name: club_id
        type: string
        source: input
        description: FK -> Club.id; the club that applied to host this show.
      - name: show_name
        type: string
        source: input
        description: Public name of the show.
      - name: show_date
        type: string
        source: input
        description: Calendar date the show is judged, YYYY-MM-DD; all ring blocks must start on this date.
        constraints: "YYYY-MM-DD"
      - name: show_type
        type: enum
        source: input
        description: Which class levels the show may host.
        constraints: "CONFORMATION | PERFORMANCE | COMBINED"
      - name: venue_name
        type: string
        source: input
        description: Venue the show is held at.
      - name: outdoor_venue
        type: boolean
        source: input
        description: True when rings are outdoors; only outdoor shows are subject to heat advisory gating.
      - name: entry_open_at
        type: datetime
        source: input
        description: Inclusive instant entries start being accepted, ISO 8601 UTC with three fractional digits.
      - name: entry_close_at
        type: datetime
        source: input
        description: Inclusive instant entries stop being accepted, ISO 8601 UTC with three fractional digits.
      - name: max_total_entries
        type: integer
        source: input
        description: Hard cap on handler-submitted entries across all classes of this show.
        constraints: ">= 1"
      - name: championship_points_scale
        type: enum
        source: input
        description: Default counting rule for championship points; a ShowClass may override it.
        constraints: "SCALE_A | SCALE_B"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: Application and operating lifecycle of the show.
        constraints: "DRAFT | SUBMITTED | RETURNED | APPROVED | IN_PROGRESS | COMPLETED | RESULTS_FILED"
      - name: submitted_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant of the most recent submit.
      - name: approval_decided_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant of the most recent approve or return decision.
      - name: approved_by_user_id
        type: string
        source: system
        default: null
        description: X-User-Id of the SanctionOfficer that approved this show; used by the segregation-of-duties check on protest decisions.
      - name: return_reason
        type: string
        source: system
        default: null
        description: Reason text supplied with the most recent return decision.
      - name: revision_count
        type: integer
        source: computed
        default: 0
        description: Number of times this show has been returned to the club; incremented on every SUBMITTED -> RETURNED transition.
      - name: armband_high_water
        type: integer
        source: system
        default: 0
        description: Highest armband number issued in this show so far; the next new armband is this value plus one.
      - name: confirmed_entry_count
        type: integer
        source: computed
        default: 0
        description: "Count of Entry with show_id == this show, source == HANDLER_SUBMITTED and entry_status IN {CONFIRMED, CHECKED_IN, JUDGED}."
      - name: fee_charged_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of Entry.entry_fee_cents over every Entry of this show (per-entry values already rounded)."
      - name: fee_refunded_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of Entry.fee_refunded_cents over every Entry of this show."
      - name: fee_retained_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of the retention withheld from every refund issued by this show."
      - name: fee_collected_cents
        type: integer
        source: computed
        default: 0
        description: "fee_charged_cents minus fee_refunded_cents; the conserved money quantity reconciled against the sum of Entry.net_fee_cents."
      - name: fee_assessment_delta_cents
        type: integer
        source: computed
        default: 0
        description: Signed cents difference between fee_charged_cents after the most recent close-entries re-assessment and its value before that re-assessment; negative when the retroactive household discount applies.
      - name: levy_total_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of Entry.levy_cents over every Entry of this show; each addend is rounded before summing."
      - name: points_awarded_total
        type: integer
        source: computed
        default: 0
        description: "Sum of Entry.points_awarded over every Entry of this show; the conserved points quantity."
      - name: temperature_reading_count
        type: integer
        source: computed
        default: 0
        description: Number of temperature readings recorded against this show.
      - name: current_heat_index_c
        type: number
        source: computed
        default: null
        description: Heat index in Celsius derived from the most recent temperature reading, one decimal place.
      - name: current_advisory_level
        type: enum
        source: computed
        default: null
        description: Welfare advisory derived from current_heat_index_c; null until the first temperature reading.
        constraints: "GREEN | AMBER | RED"

  - name: Judge
    parent: null
    common_fields: true
    fields:
      - name: judge_number
        type: string
        source: input
        description: Registry judge licence number, unique across judges.
        constraints: unique
      - name: full_name
        type: string
        source: input
        description: Judge's name as printed in the catalog.
      - name: approved_breed_group_codes
        type: array
        source: input
        description: Breed group codes this judge is licensed to judge in conformation.
        constraints: "subset of [SPORTING, HOUND, WORKING, TERRIER, TOY, NON_SPORTING, HERDING]"
      - name: approved_performance_disciplines
        type: array
        source: input
        description: Performance disciplines this judge is licensed to judge.
        constraints: "subset of [AGILITY, OBEDIENCE, RALLY]"
      - name: home_region_code
        type: string
        source: input
        description: Region the judge is domiciled in.
        constraints: "one of NE, SE, MW, WC"
      - name: max_daily_dog_count
        type: integer
        source: input
        default: 175
        description: Maximum number of dogs this judge may be scheduled to judge on one show_date.
        constraints: ">= 1"
      - name: status
        type: enum
        source: input
        default: ACTIVE
        description: Licence standing; only ACTIVE judges may be proposed for a panel slot.
        constraints: "ACTIVE | PROVISIONAL | SUSPENDED"
      - name: confirmed_slot_count
        type: integer
        source: computed
        default: 0
        description: "Count of JudgePanelSlot with judge_id == this judge and slot_status == CONFIRMED."

  - name: JudgePanelSlot
    parent: null
    common_fields: true
    fields:
      - name: show_id
        type: string
        source: input
        description: FK -> Show.id; the show this panel slot belongs to.
      - name: judge_id
        type: string
        source: input
        description: FK -> Judge.id; the judge invited into the panel.
      - name: panel_role
        type: enum
        source: input
        description: Which class levels this slot may be assigned to.
        constraints: "BREED_JUDGE | GROUP_JUDGE | BIS_JUDGE | PERFORMANCE_JUDGE"
      - name: slot_status
        type: enum
        source: system
        default: PROPOSED
        description: Invitation lifecycle of the slot.
        constraints: "PROPOSED | CONFIRMED | DECLINED"
      - name: responded_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant the judge accepted or declined.
      - name: decline_reason
        type: string
        source: system
        default: null
        description: Reason text supplied with a DECLINE response.
      - name: assigned_class_count
        type: integer
        source: computed
        default: 0
        description: "Count of ShowClass with assigned_slot_id == this slot."
      - name: assigned_dog_capacity
        type: integer
        source: computed
        default: 0
        description: "Sum over ShowClass with assigned_slot_id == this slot of the count of Entry in that class with entry_status IN {CONFIRMED, CHECKED_IN, JUDGED}."

  - name: ShowClass
    parent: null
    common_fields: true
    fields:
      - name: show_id
        type: string
        source: input
        description: FK -> Show.id; the show this class is offered at.
      - name: class_code
        type: string
        source: input
        description: Catalog code of the class, unique within the show.
        constraints: "unique within (show_id)"
      - name: class_level
        type: enum
        source: input
        description: Which stage of judging this class represents.
        constraints: "BREED | GROUP | BEST_IN_SHOW | PERFORMANCE"
      - name: breed_code
        type: string
        source: input
        default: null
        description: Breed eligible for this class; required when class_level == BREED, forbidden otherwise.
      - name: group_code
        type: string
        source: input
        default: null
        description: "Breed group of the class; required when class_level IN {BREED, GROUP}, forbidden otherwise."
        constraints: "one of SPORTING, HOUND, WORKING, TERRIER, TOY, NON_SPORTING, HERDING"
      - name: discipline
        type: enum
        source: input
        default: null
        description: Performance discipline; required when class_level == PERFORMANCE, forbidden otherwise.
        constraints: "AGILITY | OBEDIENCE | RALLY"
      - name: jump_height_cm
        type: integer
        source: input
        default: null
        description: Jump height the course is set at; required when class_level == PERFORMANCE and discipline == AGILITY.
        constraints: "one of 20, 30, 40, 50, 60"
      - name: entry_limit
        type: integer
        source: input
        description: Maximum number of entries that may reach CONFIRMED in this class.
        constraints: ">= 1"
      - name: points_scale_override
        type: enum
        source: input
        default: null
        description: When non-null this overrides Show.championship_points_scale for this class only.
        constraints: "SCALE_A | SCALE_B"
      - name: parent_class_id
        type: string
        source: input
        default: null
        description: "FK -> ShowClass.id; the class this class's winner advances into (BREED -> GROUP -> BEST_IN_SHOW). Null for terminal classes."
      - name: assigned_slot_id
        type: string
        source: system
        default: null
        description: FK -> JudgePanelSlot.id; set by the assign-judge action, null until then.
      - name: status
        type: enum
        source: system
        default: OPEN
        description: Judging lifecycle of the class.
        constraints: "OPEN | CLOSED | SCHEDULED | COMPLETED | ABANDONED"
      - name: entry_count
        type: integer
        source: computed
        default: 0
        description: "Count of Entry with class_id == this class and entry_status IN {CONFIRMED, CHECKED_IN, JUDGED}."
      - name: present_count
        type: integer
        source: computed
        default: 0
        description: "Count of Entry with class_id == this class and entry_status IN {CHECKED_IN, JUDGED}."
      - name: counted_dog_count
        type: integer
        source: computed
        default: 0
        description: Dog count that fed the most recent points award for this class; frozen at completion time, 0 before completion.
      - name: base_points
        type: integer
        source: computed
        default: 0
        description: Championship points awarded to this class's first placement, frozen at completion time; 0 before completion and 0 for an ABANDONED class. Feeder classes expose this value to their parent class's award formula.
      - name: completed_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant this class reached COMPLETED or ABANDONED; anchors the protest filing window.
      - name: final_assessment_done
        type: boolean
        source: computed
        default: false
        description: True once close-entries has re-assessed every confirmed entry fee of this class under the final variant.

  - name: Handler
    parent: null
    common_fields: true
    fields:
      - name: handler_name
        type: string
        source: input
        description: Name of the person handling dogs in the ring.
      - name: member_number
        type: string
        source: input
        description: Registry membership number, unique across handlers.
        constraints: unique
      - name: region_code
        type: string
        source: input
        description: Region the handler is registered in.
        constraints: "one of NE, SE, MW, WC"
      - name: status
        type: enum
        source: input
        default: ACTIVE
        description: Eligibility standing; SUSPENDED handlers may neither submit entries nor file protests.
        constraints: "ACTIVE | SUSPENDED"
      - name: suspension_reason
        type: string
        source: input
        default: null
        description: Reason text recorded when status is SUSPENDED.

  - name: Dog
    parent: null
    common_fields: true
    fields:
      - name: registration_number
        type: string
        source: input
        description: Registry number of the dog, unique across dogs.
        constraints: unique
      - name: call_name
        type: string
        source: input
        description: Everyday name of the dog.
      - name: breed_code
        type: string
        source: input
        description: Breed of the dog; must equal ShowClass.breed_code for any BREED class it is entered in.
      - name: group_code
        type: string
        source: input
        description: Breed group of the dog's breed.
        constraints: "one of SPORTING, HOUND, WORKING, TERRIER, TOY, NON_SPORTING, HERDING"
      - name: sex
        type: enum
        source: input
        description: Sex of the dog; only a BITCH can be declared in season.
        constraints: "DOG | BITCH"
      - name: birth_date
        type: string
        source: input
        description: Date of birth, YYYY-MM-DD; the dog must be at least MIN_ENTRY_AGE_MONTHS old on Show.show_date.
        constraints: "YYYY-MM-DD"
      - name: owner_handler_id
        type: string
        source: input
        description: FK -> Handler.id; the handler that owns and records this dog.
      - name: measured_height_cm
        type: number
        source: system
        default: null
        description: Height at the withers recorded by the most recent measurement, one decimal place.
      - name: measurement_status
        type: enum
        source: system
        default: UNMEASURED
        description: Measuring card the dog holds; agility entries require TEMP_CARD or PERMANENT_CARD.
        constraints: "UNMEASURED | TEMP_CARD | PERMANENT_CARD"
      - name: championship_points_total
        type: integer
        source: computed
        default: 0
        description: "Sum of Entry.points_awarded over every Entry with dog_id == this dog."
      - name: majors_count
        type: integer
        source: computed
        default: 0
        description: "Count of Entry with dog_id == this dog and points_awarded >= MAJOR_MIN_POINTS."
      - name: qualifying_leg_counts
        type: object
        source: computed
        default: {}
        description: "Map from discipline to the number of PerformanceRun rows with run_result == QUALIFIED for entries of this dog, e.g. {\"AGILITY\": 2}."
      - name: title_codes
        type: array
        source: computed
        default: []
        description: "Titles recorded for this dog by an accepted RegistryFiling; subset of [CH, AX, CD, RN], appended in the fixed order CH, AX, CD, RN."

  - name: Entry
    parent: null
    common_fields: true
    fields:
      - name: show_id
        type: string
        source: input
        description: FK -> Show.id; the show this entry competes at.
      - name: class_id
        type: string
        source: input
        description: FK -> ShowClass.id; the class this entry competes in.
      - name: dog_id
        type: string
        source: input
        description: FK -> Dog.id; the dog entered.
      - name: handler_id
        type: string
        source: input
        description: FK -> Handler.id; the handler presenting the dog in the ring.
      - name: promoted_from_entry_id
        type: string
        source: system
        default: null
        description: "FK -> Entry.id; set on entries the system creates when a class winner advances into parent_class_id. Null for handler-submitted entries."
      - name: source
        type: enum
        source: system
        default: HANDLER_SUBMITTED
        description: Whether the entry was submitted by a handler or synthesized by a promotion cascade.
        constraints: "HANDLER_SUBMITTED | PROMOTION"
      - name: entry_status
        type: enum
        source: system
        default: RECEIVED
        description: "Competition dimension of the entry's state; evolves independently of welfare_status."
        constraints: "RECEIVED | CONFIRMED | CHECKED_IN | JUDGED | ABSENT | WITHDRAWN | DISQUALIFIED"
      - name: welfare_status
        type: enum
        source: system
        default: CLEAR
        description: "Health and welfare dimension of the entry's state; evolves independently of entry_status."
        constraints: "CLEAR | SEASON_DECLARED | HEAT_HOLD"
      - name: armband_number
        type: integer
        source: system
        default: null
        description: Armband issued at confirmation; reused across all entries of the same dog within one show.
      - name: entry_fee_cents
        type: integer
        source: computed
        default: 0
        description: Assessed fee for this entry in cents; overwritten when the final variant runs at close-entries.
      - name: levy_cents
        type: integer
        source: computed
        default: 0
        description: Catalog levy component of this entry's fee, rounded to whole cents before it is summed into Show.levy_total_cents.
      - name: fee_refunded_cents
        type: integer
        source: computed
        default: 0
        description: Net cash refunded on this entry after retention.
      - name: net_fee_cents
        type: integer
        source: computed
        default: 0
        description: "entry_fee_cents minus fee_refunded_cents; the per-entry addend of the money conservation invariant."
      - name: fee_basis
        type: enum
        source: computed
        default: PROVISIONAL
        description: Which fee variant produced the current entry_fee_cents.
        constraints: "PROVISIONAL | FINAL"
      - name: placement
        type: integer
        source: computed
        default: null
        description: Ribbon position awarded at class completion, 1 is best; null when unplaced or vacated.
        constraints: ">= 1 and <= 4"
      - name: points_awarded
        type: integer
        source: computed
        default: 0
        description: Championship points credited to this entry; recomputed whenever the class result is amended.
      - name: conflict_deferred
        type: boolean
        source: computed
        default: false
        description: True while this entry is held to the end of its ring block because its handler is committed to an overlapping block in another ring.

  - name: RingBlock
    parent: null
    common_fields: true
    fields:
      - name: show_id
        type: string
        source: input
        description: FK -> Show.id; the show whose ring is occupied.
      - name: class_id
        type: string
        source: input
        description: FK -> ShowClass.id; the class judged in this block.
      - name: slot_id
        type: string
        source: input
        description: FK -> JudgePanelSlot.id; the panel slot whose judge officiates this block.
      - name: ring_number
        type: integer
        source: input
        description: Physical ring the block occupies; the ring resource is keyed on (show_id, ring_number).
        constraints: ">= 1 and <= 12"
      - name: block_start_at
        type: datetime
        source: input
        description: Inclusive start instant of the block, ISO 8601 UTC with three fractional digits; must fall on Show.show_date.
      - name: block_end_at
        type: datetime
        source: computed
        description: Exclusive end instant of the block; block_start_at plus judging_minutes_estimate minutes.
      - name: superseded_block_id
        type: string
        source: system
        default: null
        description: "FK -> RingBlock.id; set to the PLANNED block this block replaced when a class is re-planned."
      - name: scheduled_dog_count
        type: integer
        source: computed
        default: 0
        description: "Count of Entry with class_id == this block's class and entry_status IN {CONFIRMED, CHECKED_IN, JUDGED}."
      - name: conflict_free_minutes
        type: integer
        source: computed
        default: 0
        description: Judging span in minutes EXCLUDING deferral buffers; the interval geometry used only by handler_ring_conflict_resolution overlap detection.
      - name: judging_minutes_estimate
        type: integer
        source: computed
        default: 0
        description: Whole minutes the block is expected to occupy the ring, including per-deferred-dog buffer.
      - name: deferred_dog_count
        type: integer
        source: computed
        default: 0
        description: "Count of Entry in this block's class with conflict_deferred == true."
      - name: block_status
        type: enum
        source: system
        default: PLANNED
        description: Publication lifecycle of the block.
        constraints: "PLANNED | PUBLISHED | SUPERSEDED | COMPLETED"
      - name: published_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant the block was most recently published.

  - name: PerformanceRun
    parent: null
    common_fields: false
    fields:
      - name: entry_id
        type: string
        source: input
        description: FK -> Entry.id; the performance entry that ran the course.
      - name: discipline
        type: enum
        source: computed
        description: Copied from the entry's ShowClass.discipline at creation; drives which scoring branch applies.
        constraints: "AGILITY | OBEDIENCE | RALLY"
      - name: course_yardage_m
        type: number
        source: input
        description: Measured course length in metres, as designed by the judge.
        constraints: "> 0"
      - name: standard_course_time_s
        type: number
        source: input
        description: Standard course time in seconds published for the course.
        constraints: "> 0"
      - name: actual_time_s
        type: number
        source: input
        description: Time the dog took to complete the course, in seconds.
        constraints: ">= 0"
      - name: faults_count
        type: integer
        source: input
        default: 0
        description: Number of scored faults (knocked bars, missed contacts, handler errors).
        constraints: ">= 0"
      - name: refusals_count
        type: integer
        source: input
        default: 0
        description: Number of refusals at obstacles.
        constraints: ">= 0"
      - name: obedience_deductions
        type: number
        source: input
        default: 0
        description: Total point deductions from the obedience or rally score sheet.
        constraints: ">= 0"
      - name: time_faults
        type: number
        source: computed
        default: 0
        description: Whole seconds over the standard course time, never negative.
      - name: total_faults
        type: number
        source: computed
        default: 0
        description: Combined fault load used by the agility branch.
      - name: final_score
        type: number
        source: computed
        default: 0
        description: Score on the discipline's own scale after all deductions.
      - name: run_result
        type: enum
        source: computed
        description: Outcome of the run.
        constraints: "QUALIFIED | NQ | ELIMINATED"
      - name: title_leg_awarded
        type: boolean
        source: computed
        default: false
        description: True when this run counts as a qualifying leg toward a performance title.

  - name: Protest
    parent: null
    common_fields: true
    fields:
      - name: show_id
        type: string
        source: input
        description: FK -> Show.id; the show the protest concerns.
      - name: entry_id
        type: string
        source: input
        description: FK -> Entry.id; the entry whose result or eligibility is protested.
      - name: filed_by_handler_id
        type: string
        source: input
        description: FK -> Handler.id; the handler that filed the protest.
      - name: protest_type
        type: enum
        source: input
        description: Grounds of the protest.
        constraints: "MEASUREMENT | ELIGIBILITY | JUDGING_CONDUCT | WELFARE"
      - name: statement
        type: string
        source: input
        description: Written grounds submitted with the protest.
      - name: deposit_cents
        type: integer
        source: input
        description: Deposit lodged with the protest; must be at least PROTEST_DEPOSIT_MIN_CENTS.
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        default: FILED
        description: Hearing lifecycle of the protest; the review loop may run several rounds.
        constraints: "FILED | UNDER_REVIEW | EVIDENCE_REQUESTED | UPHELD | DISMISSED"
      - name: review_round
        type: integer
        source: computed
        default: 0
        description: Number of times the protest has entered UNDER_REVIEW; increments on every entry into that state.
      - name: evidence_request
        type: string
        source: system
        default: null
        description: Text of the most recent evidence request issued by the committee.
      - name: evidence_note
        type: string
        source: system
        default: null
        description: Text of the most recent evidence the handler resubmitted.
      - name: reviewed_by_user_id
        type: string
        source: system
        default: null
        description: X-User-Id of the SanctionOfficer that decided the protest.
      - name: resolution_code
        type: enum
        source: system
        default: null
        description: Remedy applied when the protest is decided.
        constraints: "DISQUALIFY_ENTRY | VACATE_PLACEMENT | NO_ACTION | WARNING"
      - name: deposit_refunded
        type: boolean
        source: computed
        default: false
        description: True when the deposit was returned, which happens exactly when status becomes UPHELD.
      - name: decided_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant the protest was decided.

  - name: RegistryFiling
    parent: null
    common_fields: true
    fields:
      - name: show_id
        type: string
        source: input
        description: FK -> Show.id; the show whose results are reported to the registry.
      - name: filing_status
        type: enum
        source: system
        default: PENDING
        description: Adjudication lifecycle of the filing at the registry.
        constraints: "PENDING | ACCEPTED | REJECTED_INCOMPLETE"
      - name: title_records_count
        type: integer
        source: computed
        default: 0
        description: Number of title codes this filing recorded onto dogs when it was accepted.
      - name: championship_points_total_filed
        type: integer
        source: computed
        default: 0
        description: "Sum of Entry.points_awarded over every Entry of the show at the moment of the most recent filing recomputation."
      - name: filed_at
        type: datetime
        source: system
        description: Logical-clock instant the filing was created.
      - name: adjudicated_at
        type: datetime
        source: system
        default: null
        description: Logical-clock instant of the most recent accept or reject decision.
      - name: reject_reason
        type: string
        source: system
        default: null
        description: Reason text recorded with a REJECT decision.
      - name: amendment_count
        type: integer
        source: computed
        default: 0
        description: Number of times an accepted filing was reopened to PENDING by a later upheld protest.

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Show
    initial_state: DRAFT
    terminal_states: []
    shape: branching_with_revision_loop
    note: |
      Fork at SUBMITTED (approve vs return) with a revision loop back through SUBMITTED,
      plus a RESULTS_FILED <-> COMPLETED loop driven by registry amendments.
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /dog-shows/shows/{id}/submit"
        actor: ClubOfficer
        preconditions:
          - "show.status == DRAFT"
          - "X-User-Id == show.club_id"
          - "club.sanction_status == ACTIVE"
          - "club.events_approved_count < club.annual_event_allowance"
          - "show.entry_open_at < show.entry_close_at"
          - "show.entry_close_at < show.show_date at 00:00:00.000Z"
        side_effects:
          - "show.submitted_at = logical clock"
          - "increments Show.version by 1"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /dog-shows/shows/{id}/submit"
        actor: ClubOfficer
        preconditions:
          - "show.status == RETURNED"
          - "X-User-Id == show.club_id"
          - "club.sanction_status == ACTIVE"
          - "club.events_approved_count < club.annual_event_allowance"
        side_effects:
          - "show.submitted_at = logical clock"
          - "show.return_reason is cleared to null"
          - "increments Show.version by 1"
        note: "Revision loop; revision_count is NOT decremented, it only ever grows."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /dog-shows/shows/{id}/approve"
        actor: SanctionOfficer
        preconditions:
          - "show.status == SUBMITTED"
          - "club.sanction_status == ACTIVE"
          - "club.events_approved_count < club.annual_event_allowance"
        side_effects:
          - "show.approved_by_user_id = X-User-Id of the deciding SanctionOfficer"
          - "show.approval_decided_at = logical clock"
          - "Club.events_approved_count recomputed (this show now counts)"
          - "increments Show.version by 1"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /dog-shows/shows/{id}/return"
        actor: SanctionOfficer
        preconditions:
          - "show.status == SUBMITTED"
        side_effects:
          - "show.return_reason = return_reason from the request body"
          - "show.approval_decided_at = logical clock"
          - "show.revision_count incremented by 1"
          - "increments Show.version by 1"
      - from: APPROVED
        to: IN_PROGRESS
        trigger: "POST /dog-shows/shows/{id}/open-day"
        actor: ShowSecretary
        preconditions:
          - "show.status == APPROVED"
          - "at least one ShowClass exists with show_id == show.id"
          - "every ShowClass with show_id == show.id has status IN {CLOSED, SCHEDULED}"
        side_effects:
          - "increments Show.version by 1"
        note: "Compound precondition: the show cannot open until every class has closed entries."
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /dog-shows/shows/{id}/close"
        actor: ShowSecretary
        preconditions:
          - "show.status == IN_PROGRESS"
          - "every ShowClass with show_id == show.id has status IN {COMPLETED, ABANDONED}"
        side_effects:
          - "increments Show.version by 1"
      - from: COMPLETED
        to: RESULTS_FILED
        trigger: "system event: RegistryFiling of this show transitions PENDING -> ACCEPTED"
        actor: system
        preconditions:
          - "show.status == COMPLETED"
        side_effects:
          - "increments Show.version by 1"
      - from: RESULTS_FILED
        to: COMPLETED
        trigger: "system event: RegistryFiling of this show transitions ACCEPTED -> PENDING because an upheld protest amended the results"
        actor: system
        preconditions:
          - "show.status == RESULTS_FILED"
        side_effects:
          - "increments Show.version by 1"
      - from: APPROVED
        to: APPROVED
        trigger: "POST /dog-shows/shows/{id}/temperature-readings"
        actor: ShowSecretary
        preconditions:
          - "show.status == APPROVED"
        side_effects:
          - "recompute heat_advisory_evaluation onto show.current_heat_index_c and show.current_advisory_level"
          - "show.temperature_reading_count incremented by 1"
          - "increments Show.version by 1"
      - from: IN_PROGRESS
        to: IN_PROGRESS
        trigger: "POST /dog-shows/shows/{id}/temperature-readings"
        actor: ShowSecretary
        preconditions:
          - "show.status == IN_PROGRESS"
        side_effects:
          - "recompute heat_advisory_evaluation onto show.current_heat_index_c and show.current_advisory_level"
          - "show.temperature_reading_count incremented by 1"
          - "when the new current_advisory_level == RED and show.outdoor_venue == true: every Entry of this show whose class_level == PERFORMANCE and whose welfare_status == CLEAR moves welfare_status CLEAR -> HEAT_HOLD"
          - "when the new current_advisory_level != RED: every Entry of this show whose welfare_status == HEAT_HOLD moves welfare_status HEAT_HOLD -> CLEAR"
          - "increments Show.version by 1"

  - entity: JudgePanelSlot
    initial_state: PROPOSED
    terminal_states: [DECLINED]
    shape: branching
    transitions:
      - from: null
        to: PROPOSED
        trigger: "POST /dog-shows/panel-slots"
        actor: ShowSecretary
        preconditions:
          - "show.status IN {SUBMITTED, APPROVED}"
          - "judge.status == ACTIVE"
          - "panel_role IN {BREED_JUDGE, GROUP_JUDGE, BIS_JUDGE} requires judge.approved_breed_group_codes to be non-empty; PERFORMANCE_JUDGE requires judge.approved_performance_disciplines to be non-empty"
          - "count of JudgePanelSlot with this show_id, this judge_id and slot_status IN {PROPOSED, CONFIRMED} < MAX_SLOTS_PER_JUDGE_PER_SHOW"
          - "no JudgePanelSlot exists for this judge with slot_status == CONFIRMED whose Show.show_date == this show.show_date and whose show_id != this show_id"
          - "expected_judge_version == judge.version"
        side_effects:
          - "increments Judge.version by 1"
      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST /dog-shows/panel-slots/{id}/respond with decision ACCEPT"
        actor: Judge
        preconditions:
          - "slot.slot_status == PROPOSED"
          - "X-User-Id == slot.judge_id"
          - "no other JudgePanelSlot of this judge with slot_status == CONFIRMED has a Show with the same show_date and a different show_id"
        side_effects:
          - "slot.responded_at = logical clock"
          - "Judge.confirmed_slot_count recomputed"
          - "increments Judge.version by 1"
          - "increments JudgePanelSlot.version by 1"
      - from: PROPOSED
        to: DECLINED
        trigger: "POST /dog-shows/panel-slots/{id}/respond with decision DECLINE"
        actor: Judge
        preconditions:
          - "slot.slot_status == PROPOSED"
          - "X-User-Id == slot.judge_id"
        side_effects:
          - "slot.responded_at = logical clock; slot.decline_reason = decline_reason from the request body"
          - "conditional cascade: every RingBlock with slot_id == slot.id whose block_status == PLANNED moves to SUPERSEDED (a PUBLISHED block is unreachable here because publish requires slot_status == CONFIRMED)"
          - "no ShowClass assignment has to be undone: POST /dog-shows/classes/{id}/assign-judge requires slot_status == CONFIRMED, so a slot that is still PROPOSED at DECLINE time is never named by any ShowClass.assigned_slot_id"
          - "increments Judge.version by 1"

  - entity: ShowClass
    initial_state: OPEN
    terminal_states: [COMPLETED, ABANDONED]
    shape: branching_with_revert
    transitions:
      - from: null
        to: OPEN
        trigger: "POST /dog-shows/classes"
        actor: ShowSecretary
        preconditions:
          - "show.status IN {SUBMITTED, APPROVED}"
          - "class_level == PERFORMANCE requires show.show_type IN {PERFORMANCE, COMBINED}; class_level IN {BREED, GROUP, BEST_IN_SHOW} requires show.show_type IN {CONFORMATION, COMBINED}"
          - "class_code is unique within show_id"
          - "when parent_class_id is non-null the parent must belong to the same show and satisfy: BREED -> GROUP, GROUP -> BEST_IN_SHOW; any other pairing is rejected"
          - "class_level == PERFORMANCE requires parent_class_id to be null"
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "POST /dog-shows/classes/{id}/close-entries"
        actor: ShowSecretary
        preconditions:
          - "class.status == OPEN"
          - "show.status IN {APPROVED, IN_PROGRESS}"
        side_effects:
          - "run entry_fee_assessment variant final_at_class_close over every Entry of this class with entry_status IN {CONFIRMED, CHECKED_IN}: entry_fee_cents and levy_cents overwritten, fee_basis set to FINAL"
          - "class.final_assessment_done = true"
          - "Show.fee_charged_cents, Show.levy_total_cents and Show.fee_collected_cents recomputed from the re-assessed entries"
          - "Entry.net_fee_cents recomputed for every re-assessed entry"
          - "increments ShowClass.version by 1"
      - from: CLOSED
        to: SCHEDULED
        trigger: "system event: a RingBlock of this class transitions PLANNED -> PUBLISHED"
        actor: system
        preconditions:
          - "class.status == CLOSED"
        side_effects:
          - "increments ShowClass.version by 1"
      - from: SCHEDULED
        to: CLOSED
        trigger: "system event: the last RingBlock of this class with block_status == PUBLISHED moves to SUPERSEDED"
        actor: system
        preconditions:
          - "class.status == SCHEDULED"
          - "no RingBlock with class_id == class.id retains block_status == PUBLISHED after the move"
        side_effects:
          - "increments ShowClass.version by 1"
        note: "Revert leg of the scheduling loop; CLOSED -> SCHEDULED -> CLOSED may repeat."
      - from: CLOSED
        to: COMPLETED
        trigger: "POST /dog-shows/classes/{id}/complete"
        actor: Judge
        preconditions:
          - "class.status == CLOSED"
          - "show.status == IN_PROGRESS"
          - "class.assigned_slot_id is non-null and X-User-Id == JudgePanelSlot(class.assigned_slot_id).judge_id"
          - "class.present_count >= 1"
          - "placements is a set of distinct entry_ids, all belonging to this class with entry_status == CHECKED_IN, whose placement values are exactly 1..k where k == min(MAX_PLACEMENTS, class.present_count)"
        side_effects:
          - "cascade: see calculations.championship_points_award; class.counted_dog_count and class.base_points frozen, every placed entry gets placement and points_awarded, every CHECKED_IN entry moves entry_status CHECKED_IN -> JUDGED"
          - "cascade: Dog.championship_points_total, Dog.majors_count recomputed for every dog that gained points"
          - "cascade: Show.points_awarded_total recomputed"
          - "cascade: when class.parent_class_id is non-null a promotion Entry is created in the parent class with source PROMOTION, entry_status CHECKED_IN, welfare_status CLEAR, entry_fee_cents 0, levy_cents 0, armband_number inherited from the winning entry and promoted_from_entry_id set to the winning entry"
          - "cascade: every RingBlock of this class with block_status == PUBLISHED moves to COMPLETED"
          - "increments ShowClass.version by 1"
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /dog-shows/classes/{id}/complete"
        actor: Judge
        preconditions:
          - "class.status == SCHEDULED"
          - "show.status == IN_PROGRESS"
          - "class.assigned_slot_id is non-null and X-User-Id == JudgePanelSlot(class.assigned_slot_id).judge_id"
          - "class.present_count >= 1"
          - "placements satisfies the same shape rule as the CLOSED -> COMPLETED transition"
        side_effects:
          - "identical to the CLOSED -> COMPLETED side-effect set"
      - from: CLOSED
        to: ABANDONED
        trigger: "POST /dog-shows/classes/{id}/complete with placements == []"
        actor: Judge
        preconditions:
          - "class.status == CLOSED"
          - "show.status == IN_PROGRESS"
          - "class.assigned_slot_id is non-null and X-User-Id == JudgePanelSlot(class.assigned_slot_id).judge_id"
          - "class.present_count == 0"
        side_effects:
          - "class.counted_dog_count = 0 and class.base_points = 0"
          - "no Entry of this class changes entry_status; no points are awarded; no promotion Entry is created"
          - "every RingBlock of this class with block_status == PUBLISHED moves to COMPLETED"
          - "increments ShowClass.version by 1"
      - from: SCHEDULED
        to: ABANDONED
        trigger: "POST /dog-shows/classes/{id}/complete with placements == []"
        actor: Judge
        preconditions:
          - "class.status == SCHEDULED"
          - "show.status == IN_PROGRESS"
          - "class.assigned_slot_id is non-null and X-User-Id == JudgePanelSlot(class.assigned_slot_id).judge_id"
          - "class.present_count == 0"
        side_effects:
          - "identical to the CLOSED -> ABANDONED side-effect set"

  - entity: Entry
    initial_state: RECEIVED
    initial_welfare_state: CLEAR
    terminal_states: [WITHDRAWN, DISQUALIFIED]
    shape: parallel_dimensions
    note: |
      Entry carries two independent state axes on the same row. The competition axis is
      entry_status (RECEIVED -> CONFIRMED -> CHECKED_IN -> JUDGED, with ABSENT, WITHDRAWN and
      DISQUALIFIED exits). The welfare axis is welfare_status (CLEAR <-> HEAT_HOLD, CLEAR ->
      SEASON_DECLARED). A welfare-axis move never changes entry_status except for the single
      declared coupling on declare-season, and a HEAT_HOLD entry still checks in normally.
      State names are disjoint across the two axes, so every transition below is unambiguous.
    transitions:
      - from: null
        to: RECEIVED
        trigger: "POST /dog-shows/entries"
        actor: Handler
        preconditions:
          - "X-User-Id == handler_id"
          - "handler.status == ACTIVE"
          - "show.status == APPROVED"
          - "show.entry_open_at <= logical clock <= show.entry_close_at"
          - "class.show_id == show_id and class.status == OPEN"
          - "when class.class_level == BREED: dog.breed_code == class.breed_code"
          - "when class.class_level == GROUP or BEST_IN_SHOW: handler-submitted entries are rejected (these classes are reachable only by promotion)"
          - "when class.class_level == PERFORMANCE and class.discipline == AGILITY: dog.measurement_status IN {TEMP_CARD, PERMANENT_CARD} and the dog's measured_height_cm maps to class.jump_height_cm per calculations.agility_jump_height_eligibility"
          - "dog age on show.show_date >= MIN_ENTRY_AGE_MONTHS"
          - "no other Entry exists with the same (show_id, class_id, dog_id) and entry_status IN {RECEIVED, CONFIRMED, CHECKED_IN, JUDGED, ABSENT}"
          - "the class's Entry population in RECEIVED, CONFIRMED, CHECKED_IN or JUDGED stays at or below class.entry_limit once this entry is added (this population is wider than the computed ShowClass.entry_count, which counts only CONFIRMED, CHECKED_IN and JUDGED)"
          - "the show's Entry population in those same four statuses, across every class, stays at or below show.max_total_entries once this entry is added"
        side_effects:
          - "entry_status = RECEIVED, welfare_status = CLEAR, source = HANDLER_SUBMITTED, entry_fee_cents = 0"
      - from: RECEIVED
        to: CONFIRMED
        trigger: "POST /dog-shows/entries/{id}/confirm"
        actor: ShowSecretary
        preconditions:
          - "entry.entry_status == RECEIVED"
          - "entry.welfare_status == CLEAR"
          - "show.status IN {APPROVED, IN_PROGRESS}"
          - "class.status == OPEN"
          - "handler.status == ACTIVE"
          - "class.entry_count < class.entry_limit (defensive re-check; the creation-time gate on the RECEIVED-inclusive population already guarantees it, so a confirmation can never be the request that breaches the limit)"
          - "when class.assigned_slot_id is non-null: judge_daily_dog_load for that slot's judge on show.show_date, counting this entry, <= judge.max_daily_dog_count"
        side_effects:
          - "armband_number assigned per calculations.armband_assignment; Show.armband_high_water advanced when a new armband is minted"
          - "entry_fee_cents and levy_cents set by calculations.entry_fee_assessment variant provisional_at_confirmation; fee_basis = PROVISIONAL; net_fee_cents = entry_fee_cents"
          - "Show.fee_charged_cents, Show.levy_total_cents, Show.fee_collected_cents, Show.confirmed_entry_count recomputed"
          - "ShowClass.entry_count recomputed; JudgePanelSlot.assigned_dog_capacity recomputed for the class's assigned slot"
          - "every RingBlock of this class with block_status IN {PLANNED, PUBLISHED} recomputes scheduled_dog_count, judging_minutes_estimate and block_end_at"
          - "increments Entry.version by 1"
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /dog-shows/entries/{id}/check-in with attendance PRESENT"
        actor: ShowSecretary
        preconditions:
          - "entry.entry_status == CONFIRMED"
          - "entry.welfare_status != SEASON_DECLARED"
          - "show.status == IN_PROGRESS"
          - "class.status IN {CLOSED, SCHEDULED}"
        side_effects:
          - "ShowClass.present_count recomputed"
          - "increments Entry.version by 1"
        note: "welfare_status == HEAT_HOLD does NOT block check-in; the two axes are independent."
      - from: CONFIRMED
        to: ABSENT
        trigger: "POST /dog-shows/entries/{id}/check-in with attendance ABSENT"
        actor: ShowSecretary
        preconditions:
          - "entry.entry_status == CONFIRMED"
          - "show.status == IN_PROGRESS"
          - "class.status IN {CLOSED, SCHEDULED}"
        side_effects:
          - "ShowClass.present_count recomputed; ShowClass.entry_count recomputed (ABSENT leaves the entry_count set)"
          - "JudgePanelSlot.assigned_dog_capacity recomputed; every RingBlock of this class with block_status IN {PLANNED, PUBLISHED} recomputes scheduled_dog_count, judging_minutes_estimate and block_end_at"
          - "no fee is refunded; the entry keeps its entry_fee_cents and net_fee_cents"
          - "increments Entry.version by 1"
      - from: CHECKED_IN
        to: JUDGED
        trigger: "system event: the entry's ShowClass transitions to COMPLETED"
        actor: system
        preconditions:
          - "entry.entry_status == CHECKED_IN"
        side_effects:
          - "placement and points_awarded written per calculations.championship_points_award"
          - "increments Entry.version by 1"
      - from: CONFIRMED
        to: WITHDRAWN
        trigger: "POST /dog-shows/entries/{id}/declare-season"
        actor: Handler
        preconditions:
          - "entry.entry_status == CONFIRMED"
          - "X-User-Id == entry.handler_id"
          - "dog.sex == BITCH"
          - "show.status IN {APPROVED, IN_PROGRESS}"
        side_effects:
          - "welfare_status CLEAR -> SEASON_DECLARED on the same request"
          - "refund computed by calculations.withdrawal_refund_settlement; Entry.fee_refunded_cents and Entry.net_fee_cents written; Show.fee_refunded_cents, Show.fee_retained_cents and Show.fee_collected_cents recomputed"
          - "cascade link 1 -> 2: ShowClass.entry_count and JudgePanelSlot.assigned_dog_capacity recomputed because the entry left the CONFIRMED set"
          - "cascade link 2 -> 3: every RingBlock of this class with block_status IN {PLANNED, PUBLISHED} recomputes scheduled_dog_count, judging_minutes_estimate and block_end_at because the class entry count changed"
          - "cascade link 3 -> 4: handler_ring_conflict_resolution re-runs for every PUBLISHED block of this show whose interval geometry changed, flipping Entry.conflict_deferred and recomputing RingBlock.deferred_dog_count, judging_minutes_estimate and block_end_at on the affected blocks"
          - "increments Entry.version by 1"
      - from: CHECKED_IN
        to: WITHDRAWN
        trigger: "POST /dog-shows/entries/{id}/declare-season"
        actor: Handler
        preconditions:
          - "entry.entry_status == CHECKED_IN"
          - "X-User-Id == entry.handler_id"
          - "dog.sex == BITCH"
          - "show.status == IN_PROGRESS"
        side_effects:
          - "identical to the CONFIRMED -> WITHDRAWN side-effect set, plus ShowClass.present_count recomputed"
      - from: CHECKED_IN
        to: DISQUALIFIED
        trigger: "system event: a Protest on this entry is decided UPHELD with resolution_code DISQUALIFY_ENTRY"
        actor: system
        preconditions:
          - "entry.entry_status == CHECKED_IN"
        side_effects:
          - "placement cleared to null; points_awarded set to 0"
          - "ShowClass.present_count and ShowClass.entry_count recomputed"
          - "increments Entry.version by 1"
      - from: JUDGED
        to: DISQUALIFIED
        trigger: "system event: a Protest on this entry is decided UPHELD with resolution_code DISQUALIFY_ENTRY"
        actor: system
        preconditions:
          - "entry.entry_status == JUDGED"
        side_effects:
          - "cascade link 1: placement cleared to null; points_awarded set to 0"
          - "cascade link 2: because a placement was vacated, every remaining JUDGED entry of the class with a placement greater than the vacated one moves up by exactly one position and championship_points_award re-runs over the class, so class.counted_dog_count, class.base_points and each remaining entry's points_awarded are rewritten"
          - "cascade link 3: because entry points changed, Dog.championship_points_total, Dog.majors_count and Show.points_awarded_total are recomputed for every affected dog"
          - "cascade link 4: because dog points changed, any RegistryFiling of this show with filing_status == ACCEPTED moves ACCEPTED -> PENDING, amendment_count increments, title codes no longer supported by the recomputed totals are removed from Dog.title_codes, and Show moves RESULTS_FILED -> COMPLETED"
          - "increments Entry.version by 1"
      - from: CLEAR
        to: SEASON_DECLARED
        trigger: "POST /dog-shows/entries/{id}/declare-season"
        actor: Handler
        preconditions:
          - "entry.welfare_status == CLEAR"
          - "dog.sex == BITCH"
        side_effects:
          - "the competition axis moves to WITHDRAWN in the same request (the only coupling between the two axes)"
      - from: CLEAR
        to: HEAT_HOLD
        trigger: "system event: a temperature reading raises Show.current_advisory_level to RED on an outdoor show"
        actor: system
        preconditions:
          - "entry.welfare_status == CLEAR"
          - "the entry's ShowClass.class_level == PERFORMANCE"
          - "show.outdoor_venue == true"
        side_effects:
          - "entry_status is unchanged"
          - "increments Entry.version by 1"
      - from: HEAT_HOLD
        to: CLEAR
        trigger: "system event: a later temperature reading drops Show.current_advisory_level below RED"
        actor: system
        preconditions:
          - "entry.welfare_status == HEAT_HOLD"
        side_effects:
          - "entry_status is unchanged"
          - "increments Entry.version by 1"

  - entity: RingBlock
    initial_state: PLANNED
    terminal_states: [SUPERSEDED, COMPLETED]
    shape: branching_with_self_loop
    transitions:
      - from: null
        to: PLANNED
        trigger: "POST /dog-shows/ring-blocks"
        actor: ShowSecretary
        preconditions:
          - "show.status IN {APPROVED, IN_PROGRESS}"
          - "expected_show_version == show.version"
          - "class.show_id == show_id and class.status IN {OPEN, CLOSED, SCHEDULED}"
          - "slot.show_id == show_id and slot.slot_status IN {PROPOSED, CONFIRMED}"
          - "slot.panel_role is compatible with class.class_level: BREED_JUDGE->BREED, GROUP_JUDGE->GROUP, BIS_JUDGE->BEST_IN_SHOW, PERFORMANCE_JUDGE->PERFORMANCE"
          - "block_start_at falls on show.show_date"
          - "ring_occupancy_overlap finds no conflict against other RingBlocks of the same (show_id, ring_number) with block_status IN {PLANNED, PUBLISHED}, excluding any block being superseded by this create"
          - "judge_rest_separation finds no conflict against other RingBlocks of the same slot's judge with block_status IN {PLANNED, PUBLISHED}"
          - "judge_daily_dog_load for the slot's judge on show.show_date, including this block, <= judge.max_daily_dog_count"
        side_effects:
          - "scheduled_dog_count, judging_minutes_estimate and block_end_at computed by calculations.ring_block_duration"
          - "create-with-supersede: any existing RingBlock of the same class_id with block_status IN {PLANNED, PUBLISHED} moves to SUPERSEDED and its id is written to the new block's superseded_block_id; when the superseded block was PUBLISHED and no PUBLISHED block remains for the class, ShowClass moves SCHEDULED -> CLOSED"
          - "increments Show.version by 1"
      - from: PLANNED
        to: SUPERSEDED
        trigger: "system event: a newer RingBlock is created for the same class_id (create-with-supersede), or the block's JudgePanelSlot transitions PROPOSED -> DECLINED"
        actor: system
        preconditions:
          - "block.block_status == PLANNED"
        side_effects:
          - "the block stops occupying the ring and is excluded from every overlap, rest-buffer and capacity computation"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system event: a newer RingBlock is created for the same class_id (create-with-supersede); a published block's slot is necessarily CONFIRMED, so a DECLINE can never reach this transition"
        actor: system
        preconditions:
          - "block.block_status == PUBLISHED"
        side_effects:
          - "the block stops occupying the ring"
          - "when no other PUBLISHED block remains for the class, ShowClass moves SCHEDULED -> CLOSED"
          - "every Entry of the class with conflict_deferred == true is re-evaluated by handler_ring_conflict_resolution"
      - from: PLANNED
        to: PUBLISHED
        trigger: "POST /dog-shows/ring-blocks/{id}/publish"
        actor: ShowSecretary
        preconditions:
          - "block.block_status == PLANNED"
          - "slot.slot_status == CONFIRMED"
          - "class.status == CLOSED"
          - "not (show.outdoor_venue == true and show.current_advisory_level == RED and class.class_level == PERFORMANCE)"
          - "ring_occupancy_overlap finds no conflict"
          - "judge_rest_separation finds no conflict"
        side_effects:
          - "block.published_at = logical clock"
          - "ShowClass moves CLOSED -> SCHEDULED"
          - "handler_ring_conflict_resolution runs: colliding entries get conflict_deferred = true, deferred_dog_count and judging_minutes_estimate recomputed on the later-starting block, block_end_at recomputed"
          - "increments RingBlock.version by 1"
      - from: PUBLISHED
        to: PUBLISHED
        trigger: "POST /dog-shows/ring-blocks/{id}/reschedule"
        actor: ShowSecretary
        preconditions:
          - "block.block_status == PUBLISHED"
          - "expected_show_version == show.version"
          - "block_start_at falls on show.show_date"
          - "ring_occupancy_overlap finds no conflict against other blocks, ignoring this block's own current interval"
          - "judge_rest_separation finds no conflict, ignoring this block's own current interval"
        side_effects:
          - "block_start_at overwritten; judging_minutes_estimate and block_end_at recomputed"
          - "handler_ring_conflict_resolution re-runs across every PUBLISHED block of the show"
          - "increments Show.version by 1 and increments RingBlock.version by 1"
        note: "Self-loop: a published block may be re-timed any number of times."
      - from: PUBLISHED
        to: COMPLETED
        trigger: "system event: the block's ShowClass transitions to COMPLETED or ABANDONED"
        actor: system
        preconditions:
          - "block.block_status == PUBLISHED"
        side_effects:
          - "the block stops occupying the ring for future overlap checks"

  - entity: Protest
    initial_state: FILED
    terminal_states: [UPHELD, DISMISSED]
    shape: cyclic
    note: "UNDER_REVIEW <-> EVIDENCE_REQUESTED may loop any number of times; review_round counts entries into UNDER_REVIEW."
    transitions:
      - from: null
        to: FILED
        trigger: "POST /dog-shows/protests"
        actor: Handler
        preconditions:
          - "X-User-Id == filed_by_handler_id"
          - "handler.status == ACTIVE"
          - "show.status IN {IN_PROGRESS, COMPLETED, RESULTS_FILED}"
          - "entry.show_id == show_id"
          - "deposit_cents >= PROTEST_DEPOSIT_MIN_CENTS"
          - "protest_window_open per calculations.protest_window_evaluation"
          - "no other Protest exists on the same entry_id with status IN {FILED, UNDER_REVIEW, EVIDENCE_REQUESTED}"
        side_effects:
          - "status = FILED, review_round = 0, deposit_refunded = false"
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /dog-shows/protests/{id}/begin-review"
        actor: SanctionOfficer
        preconditions:
          - "protest.status == FILED"
        side_effects:
          - "review_round incremented by 1"
          - "increments Protest.version by 1"
      - from: UNDER_REVIEW
        to: EVIDENCE_REQUESTED
        trigger: "POST /dog-shows/protests/{id}/request-evidence"
        actor: SanctionOfficer
        preconditions:
          - "protest.status == UNDER_REVIEW"
        side_effects:
          - "evidence_request written from the request body"
          - "increments Protest.version by 1"
      - from: EVIDENCE_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /dog-shows/protests/{id}/resubmit-evidence"
        actor: Handler
        preconditions:
          - "protest.status == EVIDENCE_REQUESTED"
          - "X-User-Id == protest.filed_by_handler_id"
        side_effects:
          - "evidence_note written from the request body"
          - "review_round incremented by 1"
          - "increments Protest.version by 1"
        note: "Closes the review cycle; the committee may request evidence again from UNDER_REVIEW."
      - from: UNDER_REVIEW
        to: UPHELD
        trigger: "POST /dog-shows/protests/{id}/decide with decision UPHOLD"
        actor: SanctionOfficer
        preconditions:
          - "protest.status == UNDER_REVIEW"
          - "X-User-Id != Show(protest.show_id).approved_by_user_id"
          - "resolution_code IN {DISQUALIFY_ENTRY, VACATE_PLACEMENT, WARNING}"
        side_effects:
          - "reviewed_by_user_id = X-User-Id; decided_at = logical clock; deposit_refunded = true"
          - "when resolution_code == DISQUALIFY_ENTRY: the protested Entry moves to DISQUALIFIED and the four-link cascade documented on Entry.JUDGED_to_DISQUALIFIED runs"
          - "when resolution_code == VACATE_PLACEMENT: the protested Entry keeps entry_status but placement is cleared and points_awarded set to 0, remaining placements move up by one, and the same points and filing recomputation cascade runs"
          - "when resolution_code == WARNING: no result is changed"
          - "increments Protest.version by 1"
      - from: UNDER_REVIEW
        to: DISMISSED
        trigger: "POST /dog-shows/protests/{id}/decide with decision DISMISS"
        actor: SanctionOfficer
        preconditions:
          - "protest.status == UNDER_REVIEW"
          - "X-User-Id != Show(protest.show_id).approved_by_user_id"
          - "resolution_code == NO_ACTION"
        side_effects:
          - "reviewed_by_user_id = X-User-Id; decided_at = logical clock; deposit_refunded stays false (the deposit is forfeited)"
          - "no result is changed"
          - "increments Protest.version by 1"

  - entity: RegistryFiling
    initial_state: PENDING
    terminal_states: [REJECTED_INCOMPLETE]
    shape: branching_with_reopen_loop
    transitions:
      - from: null
        to: PENDING
        trigger: "POST /dog-shows/registry-filings"
        actor: ShowSecretary
        preconditions:
          - "show.status == COMPLETED"
          - "every ShowClass of the show has status IN {COMPLETED, ABANDONED}"
          - "no Protest of the show has status IN {FILED, UNDER_REVIEW, EVIDENCE_REQUESTED}"
          - "no RegistryFiling of the show has filing_status IN {PENDING, ACCEPTED}"
        side_effects:
          - "filed_at = logical clock"
          - "championship_points_total_filed = Show.points_awarded_total at this instant"
          - "title_records_count = 0 until the filing is accepted"
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /dog-shows/registry-filings/{id}/adjudicate with decision ACCEPT"
        actor: RegistryOfficer
        preconditions:
          - "filing.filing_status == PENDING"
          - "show.status == COMPLETED"
          - "no Protest of the show has status IN {FILED, UNDER_REVIEW, EVIDENCE_REQUESTED}"
        side_effects:
          - "adjudicated_at = logical clock"
          - "title recording: for every Dog with an Entry in this show, calculations.title_recording appends any newly earned title code to Dog.title_codes; title_records_count = number of codes appended"
          - "championship_points_total_filed recomputed from Show.points_awarded_total"
          - "Show moves COMPLETED -> RESULTS_FILED"
          - "increments RegistryFiling.version by 1"
      - from: PENDING
        to: REJECTED_INCOMPLETE
        trigger: "POST /dog-shows/registry-filings/{id}/adjudicate with decision REJECT"
        actor: RegistryOfficer
        preconditions:
          - "filing.filing_status == PENDING"
        side_effects:
          - "adjudicated_at = logical clock; reject_reason written from the request body"
          - "no title is recorded; Show.status is unchanged"
          - "a replacement filing may be created because REJECTED_INCOMPLETE does not block creation"
          - "increments RegistryFiling.version by 1"
      - from: ACCEPTED
        to: PENDING
        trigger: "system event: a Protest of this show is decided UPHELD with resolution_code IN {DISQUALIFY_ENTRY, VACATE_PLACEMENT}"
        actor: system
        preconditions:
          - "filing.filing_status == ACCEPTED"
        side_effects:
          - "amendment_count incremented by 1"
          - "championship_points_total_filed recomputed from the amended Show.points_awarded_total"
          - "every title code in Dog.title_codes that calculations.title_recording no longer supports is removed and title_records_count recomputed"
          - "Show moves RESULTS_FILED -> COMPLETED"
          - "increments RegistryFiling.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's version — the only sanctioned mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: ring-block-create-stale-show
    parent_entity: Show
    write_endpoint: "POST /dog-shows/ring-blocks"
    occ_field: "expected_show_version"
    description: |
      Creating a RingBlock for a class that already holds a PLANNED block legitimately
      supersedes that block under the create-with-supersede rule, so a create carrying a
      Show version older than the stored one cannot be distinguished from a re-plan of a
      schedule the client has not yet seen. The scaffold therefore rejects any create whose
      expected_show_version does not equal the stored Show.version, because the schedule the
      client based the block on is stale.
    error_id: ERR_STALE_SHOW_VERSION
    http_status: 412
  - rule_id: panel-slot-propose-stale-judge
    parent_entity: Judge
    write_endpoint: "POST /dog-shows/panel-slots"
    occ_field: "expected_judge_version"
    description: |
      A judge may legitimately hold up to MAX_SLOTS_PER_JUDGE_PER_SHOW slots, so a second
      proposal against the same judge is a valid operation rather than a state violation.
      Because each proposal and response changes the judge's confirmed_slot_count and
      daily-load headroom, a proposal whose expected_judge_version does not equal the stored
      Judge.version is rejected: the load picture the secretary selected the judge from is stale.
    error_id: ERR_STALE_JUDGE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculations
# ---------------------------------------------------------------------------
calculations:
  - name: entry_fee_assessment
    algorithm_type: tiered_pricing
    trigger: "POST /dog-shows/entries/{id}/confirm (variant provisional_at_confirmation) and POST /dog-shows/classes/{id}/close-entries (variant final_at_class_close, re-assessed for every Entry of the closing class)"
    inputs:
      - "Entry.id, Entry.show_id, Entry.class_id, Entry.dog_id, Entry.handler_id, Entry.created_at"
      - "ShowClass.class_level of the entry's class"
      - "the set of sibling Entry rows of the same Show (statuses filtered per variant)"
    constants:
      BASE_ENTRY_FEE_CENTS: 3500
      PERFORMANCE_ENTRY_FEE_CENTS: 2800
      FIRST_ENTRY_SURCHARGE_CENTS: 900
      CATALOG_LEVY_PCT: 0.075
      SAME_DOG_DISCOUNT_PCT: 0.15
      HOUSEHOLD_DISCOUNT_PCT: 0.10
      HOUSEHOLD_DISCOUNT_MIN_ENTRIES: 3
    formula: |
      # --- step 1: base fee by class level -------------------------------------
      base_cents = (class.class_level == "PERFORMANCE")
                     ? PERFORMANCE_ENTRY_FEE_CENTS
                     : BASE_ENTRY_FEE_CENTS
      # --- step 2: counted set (THE ONLY THING THE TWO VARIANTS DISAGREE ON) ---
      counted = { E in Entry : E.show_id == entry.show_id
                               and E.entry_status IN <variant counted_statuses> }
      # deterministic ranking; created_at ASC is the sole ordering key,
      # tie-broken by armband_number ASC (unique within a show)
      handler_counted   = { E in counted : E.handler_id == entry.handler_id }
      handler_rank      = 1 + |{ E in handler_counted : E.created_at < entry.created_at }|
      same_dog_counted  = { E in counted : E.dog_id == entry.dog_id }
      same_dog_rank     = 1 + |{ E in same_dog_counted : E.created_at < entry.created_at }|
      # --- step 3: first-entry surcharge --------------------------------------
      surcharge_cents = (handler_rank == 1) ? FIRST_ENTRY_SURCHARGE_CENTS : 0
      # --- step 4: catalog levy, ROUNDED PER ENTRY BEFORE ANY SUMMATION -------
      levy_cents = round_half_up(base_cents * CATALOG_LEVY_PCT)   # 3500 -> 263, 2800 -> 210
      # --- step 5: gross -------------------------------------------------------
      gross_cents = base_cents + surcharge_cents + levy_cents
      # --- step 6: additive discount percentages ------------------------------
      discount_pct = ((same_dog_rank >= 2) ? SAME_DOG_DISCOUNT_PCT : 0.00)
                   + ((|handler_counted| >= HOUSEHOLD_DISCOUNT_MIN_ENTRIES) ? HOUSEHOLD_DISCOUNT_PCT : 0.00)
      # --- step 7: net entry fee ----------------------------------------------
      entry.entry_fee_cents = round_half_up(gross_cents * (1 - discount_pct))
      entry.levy_cents      = levy_cents
      entry.net_fee_cents   = entry.entry_fee_cents - entry.fee_refunded_cents
      # --- step 8: show ledger, summed from ALREADY-ROUNDED per-entry values --
      show.levy_total_cents  = SUM over assessed entries of E.levy_cents
      show.fee_charged_cents = SUM over assessed entries of E.entry_fee_cents
      show.fee_collected_cents = show.fee_charged_cents - show.fee_refunded_cents
    precision: "integer cents; round_half_up applied twice and only twice per entry (levy in step 4, net in step 7); the show ledger never re-rounds"
    variants:
      - name: provisional_at_confirmation
        applies_when: "a single Entry transitions RECEIVED -> CONFIRMED via POST /dog-shows/entries/{id}/confirm"
        counted_statuses: ["CONFIRMED", "CHECKED_IN", "JUDGED"]
        detail: "the confirming entry itself is counted as CONFIRMED; entries still RECEIVED are invisible, so the household discount can only appear from the third confirmation onward and earlier entries keep the fee they were assessed at their own confirmation instant"
      - name: final_at_class_close
        applies_when: "ShowClass transitions OPEN -> CLOSED via POST /dog-shows/classes/{id}/close-entries; every Entry of that class is re-assessed in created_at ASC order"
        counted_statuses: ["CONFIRMED", "CHECKED_IN"]
        detail: "the whole confirmed population of the show is visible at once, so the household discount is applied retroactively to every entry of the closing handler; JUDGED and ABSENT entries drop out of the counted set. Sets Entry.fee_basis = \"FINAL\" (it is \"PROVISIONAL\" until then) and ShowClass.final_assessment_done = true."
    reconciliation: "on close-entries, Show.fee_charged_cents is recomputed as the sum of the re-assessed Entry.entry_fee_cents values (never incremented by a delta), and Show.fee_assessment_delta_cents is set to (new fee_charged_cents - previous fee_charged_cents), which is negative when the retroactive household discount applies"
    empty_input_behavior: "closing a class with zero CONFIRMED entries leaves Show.fee_charged_cents unchanged and sets Show.fee_assessment_delta_cents = 0"

  - name: armband_assignment
    algorithm_type: aggregation
    trigger: "POST /dog-shows/entries/{id}/confirm, immediately before entry_fee_assessment"
    inputs: ["Entry.show_id", "Entry.dog_id", "Show.armband_high_water", "sibling Entry rows of the same show and dog"]
    constants:
      ARMBAND_FIRST_NUMBER: 1
    formula: |
      prior = { E in Entry : E.show_id == entry.show_id
                             and E.dog_id == entry.dog_id
                             and E.armband_number != null }
      if prior is non-empty:
          entry.armband_number = MIN over prior of E.armband_number      # one armband per dog per show
          show.armband_high_water is NOT advanced
      else:
          entry.armband_number = show.armband_high_water + 1
          show.armband_high_water = entry.armband_number
    precision: "integers, strictly monotonic per show; a number is never reused for a different dog even after WITHDRAWN or DISQUALIFIED"
    empty_input_behavior: "the first confirmation of a show mints armband 1 from armband_high_water = 0"
    notes: "an Entry created by placement promotion (promoted_from_entry_id != null) inherits the source entry's armband_number verbatim and never mints a new one"

  - name: withdrawal_refund_settlement
    algorithm_type: threshold
    trigger: "POST /dog-shows/entries/{id}/declare-season, on the CONFIRMED -> WITHDRAWN and CHECKED_IN -> WITHDRAWN competition-axis transitions"
    inputs: ["Entry.entry_fee_cents", "Show.fee_collected_cents as it stands BEFORE this refund"]
    constants:
      REFUND_RETENTION_TIER_HIGH_MIN_CENTS: 20000
      REFUND_RETENTION_TIER_HIGH_PCT: 0.10
      REFUND_RETENTION_TIER_MID_MIN_CENTS: 10000
      REFUND_RETENTION_TIER_MID_PCT: 0.05
      REFUND_RETENTION_TIER_LOW_PCT: 0.00
    formula: |
      refund_gross_cents = entry.entry_fee_cents
      # PINNED: the tier is keyed on the PRE-REFUND ledger balance, read once,
      # before any field of this withdrawal is written. It is never re-derived
      # from the post-refund balance.
      tier_basis_cents = show.fee_collected_cents            # pre-refund snapshot
      retention_pct = (tier_basis_cents >= REFUND_RETENTION_TIER_HIGH_MIN_CENTS) ? REFUND_RETENTION_TIER_HIGH_PCT
                    : (tier_basis_cents >= REFUND_RETENTION_TIER_MID_MIN_CENTS)  ? REFUND_RETENTION_TIER_MID_PCT
                    : REFUND_RETENTION_TIER_LOW_PCT
      retention_cents  = round_half_up(refund_gross_cents * retention_pct)
      refund_net_cents = refund_gross_cents - retention_cents
      entry.fee_refunded_cents  = refund_net_cents
      entry.net_fee_cents       = entry.entry_fee_cents - entry.fee_refunded_cents
      show.fee_refunded_cents  += refund_net_cents
      show.fee_retained_cents  += retention_cents
      show.fee_collected_cents  = show.fee_charged_cents - show.fee_refunded_cents
    precision: "integer cents; round_half_up on the retention only, the net is a subtraction so no second rounding can drift"
    empty_input_behavior: "a withdrawal taken while the pre-refund Show.fee_collected_cents is still below REFUND_RETENTION_TIER_MID_MIN_CENTS falls in the LOW tier, so retention is 0 and the handler is refunded the entry_fee_cents in full"
    notes: "a withdrawal never re-assesses any other Entry's fee, so the household discount already granted to siblings is not clawed back"

  - name: championship_points_award
    algorithm_type: tiered_pricing
    trigger: "POST /dog-shows/classes/{id}/complete"
    inputs:
      - "ShowClass.class_level, ShowClass.points_scale_override, Show.championship_points_scale"
      - "the Entry population of the class with their entry_status values"
      - "the placements array submitted with the request (Entry ids, first placement is the class winner)"
      - "ShowClass.base_points of every COMPLETED feeder class (F.parent_class_id == class.id)"
    constants:
      POINTS_TABLE:
        - {min_dogs: 0,  max_dogs: 1,    points: 0}
        - {min_dogs: 2,  max_dogs: 4,    points: 1}
        - {min_dogs: 5,  max_dogs: 9,    points: 2}
        - {min_dogs: 10, max_dogs: 17,   points: 3}
        - {min_dogs: 18, max_dogs: 29,   points: 4}
        - {min_dogs: 30, max_dogs: null, points: 5}
      MAJOR_MIN_POINTS: 2
      GROUP_WIN_BONUS_POINTS: 2
      BIS_BONUS_POINTS: 3
      POINTS_CAP_PER_CLASS: 5
      MAX_PLACEMENTS: 4
    formula: |
      # --- effective scale: class override wins, else the show default -------
      effective_scale = (class.points_scale_override != null)
                          ? class.points_scale_override
                          : show.championship_points_scale
      counted = { E in Entry : E.class_id == class.id
                               and E.entry_status IN <variant counted_statuses> }
      counted_dog_count = |counted|
      tier_points = the POINTS_TABLE row whose min_dogs <= counted_dog_count <= max_dogs
      # --- level-specific winner points --------------------------------------
      if class.class_level IN {"BREED", "PERFORMANCE"}:
          winner_points = tier_points
      else:
          feeder_max = MAX over { F in ShowClass : F.parent_class_id == class.id
                                                   and F.status == "COMPLETED" } of F.base_points
                       (0 when that set is empty)
          bonus = (class.class_level == "GROUP") ? GROUP_WIN_BONUS_POINTS : BIS_BONUS_POINTS
          winner_points = MIN(POINTS_CAP_PER_CLASS, feeder_max + bonus)
      class.counted_dog_count = counted_dog_count
      class.base_points = winner_points
      # --- distribution -------------------------------------------------------
      placements[0].points_awarded = winner_points
      every other Entry of the class: points_awarded = 0
      # --- rollups ------------------------------------------------------------
      dog.championship_points_total = SUM over that dog's entries of E.points_awarded
      dog.majors_count = |{ E of that dog : E.points_awarded >= MAJOR_MIN_POINTS }|
      show.points_awarded_total = SUM over the show's entries of E.points_awarded
    precision: "whole points only, no rounding; POINTS_CAP_PER_CLASS is applied after the bonus, so a capped class still records base_points == 5"
    variants:
      - name: scale_a_entered_count
        applies_when: "effective_scale == \"SCALE_A\" (the traditional entered-dog count)"
        counted_statuses: ["CONFIRMED", "CHECKED_IN", "JUDGED", "ABSENT"]
        detail: "absentees still inflate the divisor, so a class can award points on dogs that never entered the ring"
      - name: scale_b_present_count
        applies_when: "effective_scale == \"SCALE_B\" (the present-dog count)"
        counted_statuses: ["CHECKED_IN", "JUDGED"]
        detail: "only dogs actually in the ring count; ABSENT and never-checked-in CONFIRMED entries drop out and can push the class down a POINTS_TABLE tier or to zero points"
    reconciliation: "when a protest DQs the winner, the class is re-completed with the promoted placement list, the DQ'd entry's points_awarded is zeroed, its dog's championship_points_total and majors_count are recomputed from scratch (never decremented), and Show.points_awarded_total is re-summed"
    empty_input_behavior: "counted_dog_count == 0 falls in the first POINTS_TABLE row and yields 0 points; a class whose present count is 0 is ABANDONED instead of COMPLETED and awards nothing at all"
    notes: "DISQUALIFIED and WITHDRAWN entries are excluded under BOTH scales, which is the only status treatment the two variants agree on"

  - name: ring_block_duration
    algorithm_type: aggregation
    trigger: "POST /dog-shows/ring-blocks, POST /dog-shows/ring-blocks/{id}/reschedule, and any recomputation driven by handler_ring_conflict_resolution or by a change to the class's scheduled dog population"
    inputs: ["ShowClass.class_level of the block's class", "the block's class Entry population", "RingBlock.deferred_dog_count"]
    constants:
      DOGS_PER_HOUR_CONFORMATION: 25
      DOGS_PER_HOUR_PERFORMANCE: 15
      GROUP_JUDGING_OVERHEAD_MINUTES: 10
      CONFLICT_BUFFER_MINUTES_PER_DOG: 3
      MINUTES_PER_HOUR: 60
    formula: |
      scheduled_dog_count = |{ E in Entry : E.class_id == block.class_id
                                            and E.entry_status IN {"CONFIRMED","CHECKED_IN","JUDGED"} }|
      rate = (class.class_level == "PERFORMANCE") ? DOGS_PER_HOUR_PERFORMANCE
                                                  : DOGS_PER_HOUR_CONFORMATION
      base_minutes = ceil(scheduled_dog_count * MINUTES_PER_HOUR / rate)
      overhead_minutes = (class.class_level IN {"GROUP","BEST_IN_SHOW"}) ? GROUP_JUDGING_OVERHEAD_MINUTES : 0
      # geometry A - conflict-free span, used ONLY by handler_ring_conflict_resolution
      block.conflict_free_minutes = base_minutes + overhead_minutes
      block.scheduled_dog_count = scheduled_dog_count
      # geometry B - real ring occupancy, used by ring_occupancy_overlap and judge_rest_separation
      block.judging_minutes_estimate = base_minutes + overhead_minutes
                                     + block.deferred_dog_count * CONFLICT_BUFFER_MINUTES_PER_DOG
      block.block_end_at = block.block_start_at + block.judging_minutes_estimate minutes
    precision: "integer minutes; the ceiling is taken on the division only and never on the sum, so 3 conformation dogs -> ceil(180/25) = 8 minutes, not 3 * ceil(60/25) = 9"
    empty_input_behavior: "scheduled_dog_count == 0 gives base_minutes 0, so a BREED block with no confirmed dogs is a zero-length half-open interval that can never overlap anything"

  - name: handler_ring_conflict_resolution
    algorithm_type: constraint_propagation
    trigger: "POST /dog-shows/ring-blocks/{id}/publish, POST /dog-shows/ring-blocks/{id}/reschedule, POST /dog-shows/entries/{id}/confirm, POST /dog-shows/entries/{id}/declare-season"
    inputs: ["every PUBLISHED RingBlock of the show with its conflict_free_minutes", "the CONFIRMED/CHECKED_IN Entry population of each of those blocks' classes"]
    constants:
      CONFLICT_BUFFER_MINUTES_PER_DOG: 3
      MAX_CONFLICT_PASSES: 1
    formula: |
      # PINNED interval geometry: overlap detection uses the CONFLICT-FREE span
      # [block_start_at, block_start_at + conflict_free_minutes), which excludes
      # deferral buffers. This makes the propagation a single-pass fixed point -
      # widening a block's block_end_at can never create a new conflict.
      clear every Entry.conflict_deferred to false
      for each unordered pair (X, Y) of the show's PUBLISHED blocks with X.ring_number != Y.ring_number:
          if X.conflict_free_span intersects Y.conflict_free_span (half-open, adjacency is NOT an intersection):
              later = the block with the greater block_start_at
                      (tie-break: the greater created_at; created_at is unique per row)
              earlier = the other block
              for each Handler H having at least one Entry with
                  entry_status IN {"CONFIRMED","CHECKED_IN"} in earlier.class_id
                  AND at least one such Entry in later.class_id:
                      set conflict_deferred = true on every such Entry of H in later.class_id
      for each affected block:
          block.deferred_dog_count = |{ E in Entry : E.class_id == block.class_id and E.conflict_deferred }|
          recompute block.judging_minutes_estimate and block.block_end_at via ring_block_duration
    precision: "minute-resolution instants; the +3 minutes per deferred dog is added to the occupancy geometry only"
    empty_input_behavior: "when no pair of published blocks intersects, every conflict_deferred is set to false, every deferred_dog_count collapses to 0, and each block_end_at shrinks back to its unbuffered value - the no-op fallback is an explicit clear, not a skip"

  - name: ring_occupancy_overlap
    algorithm_type: interval_merge
    trigger: "POST /dog-shows/ring-blocks, POST /dog-shows/ring-blocks/{id}/reschedule"
    inputs: ["candidate block_start_at and its computed block_end_at", "every RingBlock on the same (show_id, ring_number) with block_status IN {PLANNED, PUBLISHED}"]
    constants:
      RING_TURNAROUND_BUFFER_MINUTES: 0
    formula: |
      resource_key = (block.show_id, block.ring_number)
      occupying = { B in RingBlock : (B.show_id, B.ring_number) == resource_key
                                     and B.block_status IN {"PLANNED","PUBLISHED"}
                                     and B.id != candidate.id
                                     and B.id != candidate.superseded_block_id }
      conflict = EXISTS B in occupying such that
                     candidate.block_start_at < B.block_end_at
                 AND B.block_start_at < candidate.block_end_at
      # half-open [start, end) with a zero buffer: touching endpoints are legal
      conflict -> ERR_RING_BLOCK_OVERLAP (409)
    precision: "second-resolution instants compared with strict inequality; candidate.block_start_at == B.block_end_at is NOT a conflict"
    empty_input_behavior: "the first block in a ring has an empty occupying set and always passes"
    notes: "CANCELLED and SUPERSEDED blocks release the ring immediately; the block named by superseded_block_id is excluded so a reschedule may reuse the slot it is vacating"

  - name: judge_rest_separation
    algorithm_type: interval_merge
    trigger: "POST /dog-shows/ring-blocks, POST /dog-shows/ring-blocks/{id}/reschedule"
    inputs: ["the candidate block's span", "every RingBlock whose panel slot names the same Judge, across every show, with block_status IN {PLANNED, PUBLISHED}"]
    constants:
      JUDGE_REST_BUFFER_MINUTES: 30
    formula: |
      judge_id = JudgePanelSlot(candidate.slot_id).judge_id
      occupying = { B in RingBlock : JudgePanelSlot(B.slot_id).judge_id == judge_id
                                     and B.block_status IN {"PLANNED","PUBLISHED"}
                                     and B.id != candidate.id
                                     and B.id != candidate.superseded_block_id }
      separated(candidate, B) =
             candidate.block_start_at >= B.block_end_at + JUDGE_REST_BUFFER_MINUTES
          OR B.block_start_at         >= candidate.block_end_at + JUDGE_REST_BUFFER_MINUTES
      conflict = EXISTS B in occupying such that NOT separated(candidate, B)
      conflict -> ERR_JUDGE_REST_BUFFER_VIOLATION (409)
    precision: "minute-resolution buffer compared with >= , so a gap of exactly 30 minutes is legal and a gap of 29 minutes is a violation; a zero gap (adjacency) is a violation even though the same adjacency is legal for ring occupancy"
    empty_input_behavior: "a judge with no other blocks always passes"

  - name: judge_daily_dog_load
    algorithm_type: aggregation
    trigger: "POST /dog-shows/entries/{id}/confirm, POST /dog-shows/classes/{id}/assign-judge"
    inputs: ["JudgePanelSlot.assigned_dog_capacity", "the Entry population of every class assigned to that slot"]
    constants:
      MAX_DOGS_PER_JUDGE_PER_DAY: 175
      MAX_SLOTS_PER_JUDGE_PER_SHOW: 3
      MAX_SHOWS_PER_JUDGE_PER_DAY: 1
    formula: |
      slot_load(S) = |{ E in Entry : ShowClass(E.class_id).assigned_slot_id == S.id
                                      and E.entry_status IN {"CONFIRMED","CHECKED_IN","JUDGED"} }|
      judge_daily_load(judge, date) =
          SUM over { S in JudgePanelSlot : S.judge_id == judge
                                           and S.slot_status IN {"PROPOSED","CONFIRMED"}
                                           and Show(S.show_id).show_date == date } of slot_load(S)
      slot.assigned_dog_capacity = MIN(judge.max_daily_dog_count, MAX_DOGS_PER_JUDGE_PER_DAY)
      # aggregate gate: each individual confirmation is legal on its own
      judge_daily_load(judge, show.show_date) after this confirmation
          must be <= slot.assigned_dog_capacity, else ERR_JUDGE_DOG_LIMIT_EXCEEDED (409)
      |{ S : S.judge_id == judge and S.show_id == show.id
             and S.slot_status IN {"PROPOSED","CONFIRMED"} }| <= MAX_SLOTS_PER_JUDGE_PER_SHOW
          else ERR_JUDGE_ASSIGNMENT_LIMIT (409)
    precision: "integer dog counts; the limit is inclusive, so the confirmation that lands exactly on assigned_dog_capacity succeeds and the next one fails"
    empty_input_behavior: "a slot with no assigned classes has slot_load 0 and never blocks a confirmation"

  - name: heat_advisory_evaluation
    algorithm_type: threshold
    trigger: "POST /dog-shows/shows/{id}/temperature-readings"
    inputs: ["recorded_temp_c", "relative_humidity_pct"]
    constants:
      HUMIDITY_ADJUSTMENT_TABLE:
        - {max_humidity_pct: 40,   adjustment_c: 0.0}
        - {max_humidity_pct: 60,   adjustment_c: 1.5}
        - {max_humidity_pct: 80,   adjustment_c: 3.0}
        - {max_humidity_pct: null, adjustment_c: 5.0}
      ADVISORY_AMBER_MIN_C: 26.0
      ADVISORY_RED_MIN_C: 32.0
    formula: |
      humidity_adjustment_c = the first HUMIDITY_ADJUSTMENT_TABLE row whose
          max_humidity_pct is null or relative_humidity_pct <= max_humidity_pct
      heat_index_c = round_half_up(recorded_temp_c + humidity_adjustment_c, 1)
      advisory_level = (heat_index_c >= ADVISORY_RED_MIN_C)   ? "RED"
                     : (heat_index_c >= ADVISORY_AMBER_MIN_C) ? "AMBER"
                     : "GREEN"
      show.current_advisory_level = advisory_level
      show.current_heat_index_c = heat_index_c
      show.temperature_reading_count += 1
      # the welfare cascade is scoped exactly as state_machines.Entry declares it:
      # only entries of a PERFORMANCE class, and only on an outdoor show
      if advisory_level == "RED" and show.outdoor_venue == true:
          every Entry of the show whose class.class_level == "PERFORMANCE"
          and whose welfare_status == "CLEAR" moves to HEAT_HOLD
      if advisory_level != "RED" or show.outdoor_venue == false:
          every Entry of the show in welfare_status HEAT_HOLD returns to CLEAR
    precision: "one decimal place, round_half_up; the comparisons are >= so a heat_index_c of exactly 32.0 is RED and 31.9 is AMBER"
    empty_input_behavior: "a show with temperature_reading_count == 0 has current_advisory_level null and imposes no welfare restriction; GREEN is only ever written by a reading whose heat_index_c is below ADVISORY_AMBER_MIN_C"

  - name: performance_run_scoring
    algorithm_type: weighted_scoring
    trigger: "POST /dog-shows/performance-runs"
    inputs: ["discipline", "faults_count", "refusals_count", "obedience_deductions", "actual_time_s", "standard_course_time_s", "course_yardage_m"]
    constants:
      AGILITY_BASE_SCORE: 100.0
      AGILITY_FAULT_POINTS: 5.0
      AGILITY_REFUSAL_POINTS: 5.0
      AGILITY_ELIMINATION_REFUSALS: 3
      AGILITY_MAX_YARDS_PER_SECOND: 5.0
      OBEDIENCE_MAX_SCORE: 200.0
      OBEDIENCE_QUALIFYING_MIN: 170.0
      RALLY_MAX_SCORE: 100.0
      RALLY_FAULT_POINTS: 3.0
      RALLY_QUALIFYING_MIN: 70.0
    formula: |
      time_faults = MAX(0, ceil(actual_time_s - standard_course_time_s))
      if discipline == "AGILITY":
          total_faults = faults_count * AGILITY_FAULT_POINTS
                       + refusals_count * AGILITY_REFUSAL_POINTS
                       + time_faults
          final_score = MAX(0.0, AGILITY_BASE_SCORE - total_faults)
          run_result = (refusals_count >= AGILITY_ELIMINATION_REFUSALS) ? "ELIMINATED"
                     : (total_faults == 0)                             ? "QUALIFIED"
                     : "NQ"
      if discipline == "OBEDIENCE":
          total_faults = obedience_deductions
          final_score = OBEDIENCE_MAX_SCORE - obedience_deductions
          run_result = (final_score >= OBEDIENCE_QUALIFYING_MIN) ? "QUALIFIED" : "NQ"
      if discipline == "RALLY":
          total_faults = obedience_deductions
                       + faults_count * RALLY_FAULT_POINTS
                       + time_faults
          final_score = MAX(0.0, RALLY_MAX_SCORE - total_faults)
          run_result = (final_score >= RALLY_QUALIFYING_MIN) ? "QUALIFIED" : "NQ"
      title_leg_awarded = (run_result == "QUALIFIED")
      if title_leg_awarded: dog.qualifying_leg_counts[discipline] += 1
    precision: "final_score to one decimal place, round_half_up; time_faults is a whole-second ceiling so 30.1s over a 30.0s standard course time is 1 fault, not 0.1"
    empty_input_behavior: "a run with zero faults, zero refusals, zero deductions and actual_time_s <= standard_course_time_s qualifies at the discipline's maximum score"
    notes: "AGILITY elimination on refusals is evaluated BEFORE the fault total, so a run with 3 refusals is ELIMINATED even when the arithmetic score is still above zero; standard_course_time_s must be >= ceil(course_yardage_m / AGILITY_MAX_YARDS_PER_SECOND) or the run is rejected with ERR_COURSE_DESIGN_INVALID"

  - name: agility_jump_height_eligibility
    algorithm_type: threshold
    trigger: "POST /dog-shows/entries (when the target class has class_level PERFORMANCE and discipline AGILITY), POST /dog-shows/dogs/{id}/measurement"
    inputs: ["Dog.measured_height_cm", "Dog.measurement_status", "ShowClass.jump_height_cm"]
    constants:
      JUMP_HEIGHT_TABLE:
        - {max_measured_cm: 25, jump_height_cm: 20}
        - {max_measured_cm: 35, jump_height_cm: 30}
        - {max_measured_cm: 45, jump_height_cm: 40}
        - {max_measured_cm: 55, jump_height_cm: 50}
        - {max_measured_cm: null, jump_height_cm: 60}
    formula: |
      if dog.measurement_status == "UNMEASURED": -> ERR_MEASUREMENT_REQUIRED (409)
      eligible_jump_height_cm = the first JUMP_HEIGHT_TABLE row whose
          max_measured_cm is null or dog.measured_height_cm <= max_measured_cm
      class.jump_height_cm must equal eligible_jump_height_cm, else ERR_JUMP_HEIGHT_MISMATCH (409)
    precision: "one decimal place on measured_height_cm; the table bounds are inclusive, so exactly 35.0 cm maps to the 30 cm jump height and 35.1 cm maps to 40 cm"
    empty_input_behavior: "a non-AGILITY class has jump_height_cm null and the rule is skipped entirely"

  - name: protest_window_evaluation
    algorithm_type: chronological
    trigger: "POST /dog-shows/protests"
    inputs: ["current logical clock", "ShowClass.status and ShowClass.completed_at of the protested entry's class", "Show.status"]
    constants:
      PROTEST_WINDOW_HOURS: 24
      PROTEST_DEPOSIT_MIN_CENTS: 5000
    formula: |
      class = ShowClass(entry.class_id)
      if class.status IN {"COMPLETED","ABANDONED"}:
          window_open = (now <= class.completed_at + PROTEST_WINDOW_HOURS hours)
      else:
          window_open = (show.status == "IN_PROGRESS")
      not window_open -> ERR_PROTEST_WINDOW_EXPIRED (409)
      deposit_cents >= PROTEST_DEPOSIT_MIN_CENTS else ERR_PROTEST_DEPOSIT_INSUFFICIENT (402)
    precision: "second-resolution instants; the comparison is <= so a filing at exactly completed_at + 24h is accepted and one second later is rejected"
    empty_input_behavior: "a class with completed_at null is necessarily not COMPLETED, so the show-status branch is taken"

  - name: title_recording
    algorithm_type: projection
    trigger: "POST /dog-shows/registry-filings/{id}/adjudicate with decision ACCEPT"
    inputs: ["Dog.championship_points_total", "Dog.majors_count", "Dog.qualifying_leg_counts", "Dog.title_codes", "every Dog with at least one JUDGED Entry in the filed show"]
    constants:
      CHAMPION_TITLE_POINTS: 3
      CHAMPION_TITLE_MAJORS_REQUIRED: 1
      MAJOR_MIN_POINTS: 2
      PERFORMANCE_TITLE_LEGS_REQUIRED: 3
      TITLE_CODE_ORDER: ["CH", "AX", "CD", "RN"]
    formula: |
      earned = {}
      if dog.championship_points_total >= CHAMPION_TITLE_POINTS
         and dog.majors_count >= CHAMPION_TITLE_MAJORS_REQUIRED:            earned += "CH"
      if dog.qualifying_leg_counts["AGILITY"]   >= PERFORMANCE_TITLE_LEGS_REQUIRED: earned += "AX"
      if dog.qualifying_leg_counts["OBEDIENCE"] >= PERFORMANCE_TITLE_LEGS_REQUIRED: earned += "CD"
      if dog.qualifying_leg_counts["RALLY"]     >= PERFORMANCE_TITLE_LEGS_REQUIRED: earned += "RN"
      # append in TITLE_CODE_ORDER, skipping codes already present
      newly_recorded = [c in TITLE_CODE_ORDER : c in earned and c not in dog.title_codes]
      dog.title_codes = dog.title_codes + newly_recorded
      # compensation on re-adjudication after an upheld protest:
      dog.title_codes = [c in dog.title_codes : c in earned]
      filing.title_records_count = |newly_recorded|
    precision: "whole counts; the thresholds are >= so exactly 3 points with exactly 1 major earns CH"
    empty_input_behavior: "a filing whose dogs earn nothing is still ACCEPTED with title_records_count 0"

# ---------------------------------------------------------------------------
# 1.4 Validation Rules (evaluated in ascending priority; the FIRST violated
#     rule decides the response and no later rule is evaluated)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "Both X-User-Id and X-User-Role headers are present and non-empty on every endpoint"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is one of ClubOfficer, SanctionOfficer, ShowSecretary, Judge, Handler, RegistryOfficer, and that role appears in the target endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every path parameter resolves to an existing row, validated left to right; the leftmost unresolved segment decides the error_id"
    error_id: "ERR_SHOW_NOT_FOUND | ERR_JUDGE_NOT_FOUND | ERR_SLOT_NOT_FOUND | ERR_CLASS_NOT_FOUND | ERR_DOG_NOT_FOUND | ERR_ENTRY_NOT_FOUND | ERR_RING_BLOCK_NOT_FOUND | ERR_PROTEST_NOT_FOUND | ERR_FILING_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path parameter"

  - priority: 4
    category: request_shape
    check: "Request body contains every required field with the declared type; enum fields carry a declared member; integer money and count fields are non-negative; limit is within 1..100 and offset >= 0; unknown extra body fields are ignored rather than rejected"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 5
    category: existence
    check: "Every foreign key supplied in the request body resolves to an existing row, validated in the field order declared by the endpoint's input list"
    error_id: "ERR_CLUB_NOT_FOUND | ERR_SHOW_NOT_FOUND | ERR_JUDGE_NOT_FOUND | ERR_SLOT_NOT_FOUND | ERR_CLASS_NOT_FOUND | ERR_DOG_NOT_FOUND | ERR_HANDLER_NOT_FOUND | ERR_ENTRY_NOT_FOUND"
    http_status: 404
    applies_to: "POST /dog-shows/shows, POST /dog-shows/panel-slots, POST /dog-shows/classes, POST /dog-shows/classes/{id}/assign-judge, POST /dog-shows/dogs, POST /dog-shows/entries, POST /dog-shows/ring-blocks, POST /dog-shows/performance-runs, POST /dog-shows/protests, POST /dog-shows/registry-filings"

  - priority: 6
    category: auth
    check: "For an entity_backed role, X-User-Id must equal the id of the entity the operation acts for: a ClubOfficer may only create or submit a Show whose club_id is the caller, a Judge may only respond to a JudgePanelSlot whose judge_id is the caller, a Handler may only create an Entry naming itself as handler_id, may only declare a season or resubmit evidence for its own Entry or Protest, and may only file a Protest naming itself as filed_by_handler_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /dog-shows/shows, POST /dog-shows/shows/{id}/submit, POST /dog-shows/panel-slots/{id}/respond, POST /dog-shows/entries, POST /dog-shows/entries/{id}/declare-season, POST /dog-shows/protests, POST /dog-shows/protests/{id}/resubmit-evidence"

  - priority: 7
    category: auth
    check: "Segregation of duties: (a) the X-User-Id recorded in Show.approved_by_user_id may not decide a Protest on that show; (b) a Judge whose panel slot is assigned to a feeder class may not have a slot assigned to that class's parent_class_id class"
    error_id: ERR_SEGREGATION_CONFLICT
    http_status: 403
    applies_to: "POST /dog-shows/protests/{id}/decide, POST /dog-shows/classes/{id}/assign-judge"

  - priority: 8
    category: state
    check: "The target entity is in a state from which the requested transition is declared in §1.2. Seven states carry a domain-specific error_id (submit from a non-DRAFT show, entry creation on a show not APPROVED, a panel slot that is not CONFIRMED, a class that is not OPEN, a class not yet CLOSED or SCHEDULED at check-in, a class of the show still not COMPLETED at filing time, a protest that is not UNDER_REVIEW); every other undeclared transition returns the generic ERR_INVALID_STATE"
    error_id: "ERR_SHOW_NOT_IN_DRAFT | ERR_SHOW_NOT_ACCEPTING_ENTRIES | ERR_SLOT_NOT_CONFIRMED | ERR_CLASS_NOT_OPEN | ERR_CLASS_NOT_READY | ERR_CLASSES_NOT_COMPLETE | ERR_PROTEST_NOT_IN_REVIEW | ERR_INVALID_STATE"
    http_status: 409
    applies_to: "every action endpoint that drives a §1.2 transition"

  - priority: 9
    category: concurrency
    check: "expected_show_version equals Show.version (POST /dog-shows/ring-blocks, POST /dog-shows/ring-blocks/{id}/reschedule) and expected_judge_version equals Judge.version (POST /dog-shows/panel-slots), per the §1.2.1 concurrency rules"
    error_id: "ERR_STALE_SHOW_VERSION | ERR_STALE_JUDGE_VERSION"
    http_status: 412
    applies_to: "POST /dog-shows/ring-blocks, POST /dog-shows/ring-blocks/{id}/reschedule, POST /dog-shows/panel-slots"

  - priority: 10
    category: business_safety
    check: "When Show.outdoor_venue is true and Show.current_advisory_level is RED, no PERFORMANCE-class work may proceed: publishing or rescheduling a RingBlock whose class_level is PERFORMANCE, completing a PERFORMANCE class, or recording a PerformanceRun. Conformation classes are unaffected, and check-in is deliberately NOT gated, so an Entry in welfare_status HEAT_HOLD still checks in normally."
    error_id: ERR_HEAT_RESTRICTION_ACTIVE
    http_status: 409
    applies_to: "POST /dog-shows/ring-blocks/{id}/publish, POST /dog-shows/ring-blocks/{id}/reschedule, POST /dog-shows/classes/{id}/complete, POST /dog-shows/performance-runs"

  - priority: 11
    category: business_safety
    check: "An Entry whose welfare_status is SEASON_DECLARED may not be confirmed or checked in, and a new Entry may not be created for a dog that already has a SEASON_DECLARED entry at that show; declare-season itself requires Dog.sex == BITCH"
    error_id: ERR_BITCH_IN_SEASON
    http_status: 409
    applies_to: "POST /dog-shows/entries, POST /dog-shows/entries/{id}/confirm, POST /dog-shows/entries/{id}/check-in, POST /dog-shows/entries/{id}/declare-season"

  - priority: 12
    category: business_safety
    check: "Handler.status is ACTIVE for the entry's handler_id and for the protest's filed_by_handler_id; a SUSPENDED handler can neither enter dogs nor file protests"
    error_id: ERR_HANDLER_SUSPENDED
    http_status: 403
    applies_to: "POST /dog-shows/entries, POST /dog-shows/entries/{id}/confirm, POST /dog-shows/protests"

  - priority: 13
    category: business_safety
    check: "The dog's age in whole months at Show.show_date is at least MIN_ENTRY_AGE_MONTHS (6)"
    error_id: ERR_DOG_UNDER_MINIMUM_AGE
    http_status: 409
    applies_to: "POST /dog-shows/entries"

  - priority: 14
    category: business_referential
    check: "Club.sanction_status is ACTIVE when a show application is created or submitted, and Judge.status is ACTIVE when a panel slot is proposed or a class is assigned to that slot"
    error_id: "ERR_CLUB_NOT_ACTIVE | ERR_JUDGE_NOT_ACTIVE"
    http_status: 409
    applies_to: "POST /dog-shows/shows, POST /dog-shows/shows/{id}/submit, POST /dog-shows/panel-slots, POST /dog-shows/classes/{id}/assign-judge"

  - priority: 15
    category: business_referential
    check: "Judge licensing: the group_code of the class being assigned appears in Judge.approved_breed_group_codes for a BREED, GROUP or BEST_IN_SHOW class"
    error_id: ERR_JUDGE_NOT_APPROVED_FOR_GROUP
    http_status: 409
    applies_to: "POST /dog-shows/classes/{id}/assign-judge"

  - priority: 16
    category: business_referential
    check: "Judge licensing: the discipline of a PERFORMANCE class appears in Judge.approved_performance_disciplines"
    error_id: ERR_JUDGE_NOT_APPROVED_FOR_DISCIPLINE
    http_status: 409
    applies_to: "POST /dog-shows/classes/{id}/assign-judge"

  - priority: 17
    category: business_referential
    check: "JudgePanelSlot.panel_role matches the class_level of the class being assigned: BREED_JUDGE->BREED, GROUP_JUDGE->GROUP, BIS_JUDGE->BEST_IN_SHOW, PERFORMANCE_JUDGE->PERFORMANCE; the slot must also belong to the same show as the class"
    error_id: ERR_PANEL_ROLE_MISMATCH
    http_status: 409
    applies_to: "POST /dog-shows/classes/{id}/assign-judge"

  - priority: 18
    category: business_referential
    check: "parent_class_id, when supplied, names a class of the same show whose class_level is exactly one rung above the child (BREED->GROUP, GROUP->BEST_IN_SHOW); a PERFORMANCE class may not have a parent and may not be a parent"
    error_id: ERR_PARENT_CLASS_LEVEL_INVALID
    http_status: 409
    applies_to: "POST /dog-shows/classes"

  - priority: 19
    category: business_referential
    check: "Dog.breed_code equals ShowClass.breed_code for a BREED class and Dog.group_code equals ShowClass.group_code for a GROUP class"
    error_id: ERR_BREED_MISMATCH
    http_status: 409
    applies_to: "POST /dog-shows/entries"

  - priority: 20
    category: business_referential
    check: "For an AGILITY class the dog's measurement_status is not UNMEASURED (agility_jump_height_eligibility)"
    error_id: ERR_MEASUREMENT_REQUIRED
    http_status: 409
    applies_to: "POST /dog-shows/entries"

  - priority: 21
    category: business_referential
    check: "For an AGILITY class the class's jump_height_cm equals the height the dog's measured_height_cm maps to through JUMP_HEIGHT_TABLE"
    error_id: ERR_JUMP_HEIGHT_MISMATCH
    http_status: 409
    applies_to: "POST /dog-shows/entries"

  - priority: 22
    category: business_referential
    check: "A PerformanceRun may only be recorded against an Entry whose class_level is PERFORMANCE and whose entry_status is CHECKED_IN, and standard_course_time_s must be at least ceil(course_yardage_m / AGILITY_MAX_YARDS_PER_SECOND) for the AGILITY discipline"
    error_id: ERR_COURSE_DESIGN_INVALID
    http_status: 409
    applies_to: "POST /dog-shows/performance-runs"

  - priority: 23
    category: business_temporal
    check: "The logical clock is within [Show.entry_open_at, Show.entry_close_at] when an entry is created; the bounds are inclusive at both ends"
    error_id: ERR_ENTRY_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /dog-shows/entries"

  - priority: 24
    category: business_temporal
    check: "ring_occupancy_overlap finds no PLANNED or PUBLISHED block on the same (show_id, ring_number) whose half-open [block_start_at, block_end_at) interval intersects the candidate's"
    error_id: ERR_RING_BLOCK_OVERLAP
    http_status: 409
    applies_to: "POST /dog-shows/ring-blocks, POST /dog-shows/ring-blocks/{id}/reschedule"

  - priority: 25
    category: business_temporal
    check: "judge_rest_separation finds every other PLANNED or PUBLISHED block of the same judge separated from the candidate by at least JUDGE_REST_BUFFER_MINUTES (30), a gap of exactly 30 minutes being legal"
    error_id: ERR_JUDGE_REST_BUFFER_VIOLATION
    http_status: 409
    applies_to: "POST /dog-shows/ring-blocks, POST /dog-shows/ring-blocks/{id}/reschedule"

  - priority: 26
    category: business_temporal
    check: "protest_window_evaluation reports the filing window open for the protested entry's class"
    error_id: ERR_PROTEST_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /dog-shows/protests"

  - priority: 27
    category: business_constraint
    check: "No other Entry of the same (show_id, class_id, dog_id) exists in a status other than WITHDRAWN or DISQUALIFIED"
    error_id: ERR_DUPLICATE_ENTRY
    http_status: 409
    applies_to: "POST /dog-shows/entries"

  - priority: 28
    category: business_constraint
    check: "The class's Entry population in RECEIVED, CONFIRMED, CHECKED_IN and JUDGED stays at or below ShowClass.entry_limit after this entry is added; the gate counts RECEIVED rows even though the computed ShowClass.entry_count does not"
    error_id: ERR_CLASS_ENTRY_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /dog-shows/entries"

  - priority: 29
    category: business_constraint
    check: "The show's total entry population, counting the same four statuses across all its classes, stays at or below Show.max_total_entries"
    error_id: ERR_SHOW_ENTRY_CAP_REACHED
    http_status: 409
    applies_to: "POST /dog-shows/entries"

  - priority: 30
    category: business_constraint
    check: "A judge holds at most MAX_SLOTS_PER_JUDGE_PER_SHOW (3) PROPOSED or CONFIRMED slots at one show and at most MAX_SHOWS_PER_JUDGE_PER_DAY (1) show on any Show.show_date"
    error_id: ERR_JUDGE_ASSIGNMENT_LIMIT
    http_status: 409
    applies_to: "POST /dog-shows/panel-slots"

  - priority: 31
    category: business_constraint
    check: "judge_daily_dog_load for the judge on Show.show_date, after this confirmation, is at or below JudgePanelSlot.assigned_dog_capacity; the confirmation landing exactly on the capacity succeeds"
    error_id: ERR_JUDGE_DOG_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /dog-shows/entries/{id}/confirm"

  - priority: 32
    category: business_constraint
    check: "The placements array on class completion holds exactly min(MAX_PLACEMENTS, ShowClass.present_count) distinct members, each a CHECKED_IN Entry of that class and none DISQUALIFIED; the array is empty exactly when present_count is 0, which abandons the class instead of completing it"
    error_id: ERR_PLACEMENT_SET_INVALID
    http_status: 409
    applies_to: "POST /dog-shows/classes/{id}/complete"

  - priority: 33
    category: business_constraint
    check: "A show has at most one RegistryFiling that is not REJECTED_INCOMPLETE, and every non-ABANDONED class of the show has status COMPLETED before a filing is created"
    error_id: "ERR_FILING_ALREADY_OPEN | ERR_CLASSES_NOT_COMPLETE"
    http_status: 409
    applies_to: "POST /dog-shows/registry-filings"

  - priority: 34
    category: business_constraint
    check: "No Protest of the show is in FILED, UNDER_REVIEW or EVIDENCE_REQUESTED when a filing is created or adjudicated"
    error_id: ERR_OPEN_PROTEST_BLOCKS_FILING
    http_status: 409
    applies_to: "POST /dog-shows/registry-filings, POST /dog-shows/registry-filings/{id}/adjudicate"

  - priority: 35
    category: business_constraint
    check: "A PERMANENT_CARD measurement may not be overwritten by a later measurement of any card_type"
    error_id: ERR_MEASUREMENT_LOCKED
    http_status: 409
    applies_to: "POST /dog-shows/dogs/{id}/measurement"

  - priority: 36
    category: business_fiscal
    check: "Club.events_approved_count is strictly below Club.annual_event_allowance when a show application is submitted"
    error_id: ERR_CLUB_ALLOWANCE_EXHAUSTED
    http_status: 409
    applies_to: "POST /dog-shows/shows/{id}/submit"

  - priority: 37
    category: business_fiscal
    check: "Protest.deposit_cents is at least PROTEST_DEPOSIT_MIN_CENTS (5000)"
    error_id: ERR_PROTEST_DEPOSIT_INSUFFICIENT
    http_status: 402
    applies_to: "POST /dog-shows/protests"

validation_priority_notes:
  ladder_shape: "auth (1-2) -> path existence (3) -> request shape (4) -> body FK existence (5) -> ownership and segregation (6-7) -> state (8) -> optimistic concurrency (9) -> welfare and safety (10-13) -> referential and licensing (14-22) -> temporal (23-26) -> constraint and capacity (27-35) -> fiscal (36-37)"
  designed_conflicts:
    - pair: "business_safety (10) vs business_temporal (24)"
      scenario: "POST /dog-shows/ring-blocks/{id}/reschedule while the show's current_advisory_level is RED and the requested block_start_at also collides with another PUBLISHED block in the same ring"
      winner: ERR_HEAT_RESTRICTION_ACTIVE
      loser: ERR_RING_BLOCK_OVERLAP
    - pair: "state (8) vs business_fiscal (36)"
      scenario: "POST /dog-shows/shows/{id}/submit on a show already in APPROVED that belongs to a club whose events_approved_count has reached its annual_event_allowance"
      winner: ERR_SHOW_NOT_IN_DRAFT
      loser: ERR_CLUB_ALLOWANCE_EXHAUSTED
  cascading_checks:
    - "priority 21 (jump height) can only be evaluated after priority 20 (measurement present) has passed, so an unmeasured dog entering an agility class always reports ERR_MEASUREMENT_REQUIRED and never ERR_JUMP_HEIGHT_MISMATCH"
    - "priority 31 (judge dog load) reads JudgePanelSlot.assigned_dog_capacity, which only exists once priority 17 has allowed the class to be assigned to a slot; an unassigned class can never raise ERR_JUDGE_DOG_LIMIT_EXCEEDED"

# ---------------------------------------------------------------------------
# 1.5 API Endpoints  (api_prefix /dog-shows; every collection is flat and every
#     primary path parameter is spelled {id})
# ---------------------------------------------------------------------------
endpoints:
  # --- Clubs ---------------------------------------------------------------
  - method: POST
    path: "/dog-shows/clubs"
    description: "Register a kennel club with the sanctioning body."
    roles: [SanctionOfficer]
    code: 201
    input: [name, club_code, region_code, "sanction_status?", "annual_event_allowance?", "sanction_note?"]
    output: Club
    side_effects: ["events_approved_count initialised to 0"]

  - method: GET
    path: "/dog-shows/clubs/{id}"
    description: "Read one club including its consumed event allowance."
    roles: [SanctionOfficer, ClubOfficer, ShowSecretary, Judge, Handler, RegistryOfficer]
    code: 200
    input: []
    output: Club
    side_effects: []

  # --- Judges --------------------------------------------------------------
  - method: POST
    path: "/dog-shows/judges"
    description: "License a judge with breed-group and performance-discipline approvals."
    roles: [SanctionOfficer]
    code: 201
    input: [judge_number, full_name, approved_breed_group_codes, approved_performance_disciplines, home_region_code, "max_daily_dog_count?", "status?"]
    output: Judge
    side_effects: ["confirmed_slot_count initialised to 0"]

  - method: GET
    path: "/dog-shows/judges/{id}"
    description: "Read one judge, including the version an OCC panel proposal must pin."
    roles: [SanctionOfficer, ClubOfficer, ShowSecretary, Judge, Handler, RegistryOfficer]
    code: 200
    input: []
    output: Judge
    side_effects: []

  # --- Handlers ------------------------------------------------------------
  - method: POST
    path: "/dog-shows/handlers"
    description: "Register a handler or exhibitor as a club member."
    roles: [SanctionOfficer, ShowSecretary]
    code: 201
    input: [handler_name, member_number, region_code, "status?", "suspension_reason?"]
    output: Handler
    side_effects: []

  - method: GET
    path: "/dog-shows/handlers/{id}"
    description: "Read one handler including suspension state."
    roles: [SanctionOfficer, ClubOfficer, ShowSecretary, Judge, Handler, RegistryOfficer]
    code: 200
    input: []
    output: Handler
    side_effects: []

  # --- Shows ---------------------------------------------------------------
  - method: POST
    path: "/dog-shows/shows"
    description: "Create a show application in DRAFT for the calling club officer's club."
    roles: [ClubOfficer]
    code: 201
    input: [club_id, show_name, show_date, show_type, venue_name, outdoor_venue, entry_open_at, entry_close_at, max_total_entries, championship_points_scale]
    output: Show
    side_effects: ["status = DRAFT", "revision_count = 0", "armband_high_water = 0", "every money and points counter initialised to 0", "current_advisory_level = null until the first temperature reading"]

  - method: GET
    path: "/dog-shows/shows/{id}"
    description: "Read one show with its ledger, heat advisory and version."
    roles: [SanctionOfficer, ClubOfficer, ShowSecretary, Judge, Handler, RegistryOfficer]
    code: 200
    input: []
    output: Show
    side_effects: []

  - method: GET
    path: "/dog-shows/shows"
    description: "List shows, filterable by hosting club and status."
    roles: [SanctionOfficer, ClubOfficer, ShowSecretary, Judge, Handler, RegistryOfficer]
    code: 200
    input: ["club_id?", "status?", "show_date?", "limit?", "offset?"]
    output: Show[]
    side_effects: []

  - method: POST
    path: "/dog-shows/shows/{id}/submit"
    description: "Submit a DRAFT or RETURNED application for sanctioning; consumes one unit of the club's annual event allowance."
    roles: [ClubOfficer]
    code: 200
    input: []
    output: Show
    side_effects: ["status DRAFT|RETURNED -> SUBMITTED", "submitted_at stamped from the logical clock", "on the RETURNED -> SUBMITTED leg: return_reason cleared to null (revision_count is never decremented)", "increments Show.version by 1"]

  - method: POST
    path: "/dog-shows/shows/{id}/approve"
    description: "Approve a SUBMITTED application; the approving user id is recorded and later barred from deciding protests on this show."
    roles: [SanctionOfficer]
    code: 200
    input: []
    output: Show
    side_effects: ["status SUBMITTED -> APPROVED", "approved_by_user_id = X-User-Id", "approval_decided_at stamped", "Club.events_approved_count incremented", "increments Show.version by 1"]

  - method: POST
    path: "/dog-shows/shows/{id}/return"
    description: "Return a SUBMITTED application to the club for revision."
    roles: [SanctionOfficer]
    code: 200
    input: [return_reason]
    output: Show
    side_effects: ["status SUBMITTED -> RETURNED", "return_reason stored", "revision_count incremented", "increments Show.version by 1"]

  - method: POST
    path: "/dog-shows/shows/{id}/open-day"
    description: "Open show day, moving an APPROVED show to IN_PROGRESS."
    roles: [ShowSecretary]
    code: 200
    input: []
    output: Show
    side_effects: ["status APPROVED -> IN_PROGRESS", "increments Show.version by 1"]

  - method: POST
    path: "/dog-shows/shows/{id}/close"
    description: "Close an IN_PROGRESS show once every class has reached a terminal state."
    roles: [ShowSecretary]
    code: 200
    input: []
    output: Show
    side_effects: ["status IN_PROGRESS -> COMPLETED", "increments Show.version by 1"]

  - method: POST
    path: "/dog-shows/shows/{id}/temperature-readings"
    description: "Record a venue temperature and humidity reading; runs heat_advisory_evaluation and may put performance entries on a welfare hold."
    roles: [ShowSecretary]
    code: 200
    input: [recorded_temp_c, relative_humidity_pct]
    output: Show
    side_effects: ["current_heat_index_c and current_advisory_level recomputed per calculations.heat_advisory_evaluation", "temperature_reading_count incremented", "Entry.welfare_status CLEAR <-> HEAT_HOLD flips for the show's PERFORMANCE entries when the level crosses RED", "increments Show.version by 1"]

  # --- Judge panel slots ---------------------------------------------------
  - method: POST
    path: "/dog-shows/panel-slots"
    description: "Propose a panel slot inviting a judge onto a show's panel. Pins the judge's version for optimistic concurrency."
    roles: [ShowSecretary]
    code: 201
    input: [show_id, judge_id, panel_role, expected_judge_version]
    output: JudgePanelSlot
    side_effects: ["slot_status = PROPOSED", "assigned_class_count = 0", "assigned_dog_capacity = min(Judge.max_daily_dog_count, MAX_DOGS_PER_JUDGE_PER_DAY)", "increments Judge.version by 1"]

  - method: GET
    path: "/dog-shows/panel-slots/{id}"
    description: "Read one panel slot."
    roles: [SanctionOfficer, ClubOfficer, ShowSecretary, Judge, Handler, RegistryOfficer]
    code: 200
    input: []
    output: JudgePanelSlot
    side_effects: []

  - method: GET
    path: "/dog-shows/panel-slots"
    description: "List panel slots, filterable by show, judge and status."
    roles: [SanctionOfficer, ClubOfficer, ShowSecretary, Judge, Handler, RegistryOfficer]
    code: 200
    input: ["show_id?", "judge_id?", "slot_status?", "panel_role?", "limit?", "offset?"]
    output: JudgePanelSlot[]
    side_effects: []

  - method: POST
    path: "/dog-shows/panel-slots/{id}/respond"
    description: "The invited judge accepts or declines the slot; declining supersedes every ring block that named it."
    roles: [Judge]
    code: 200
    input: [decision, "decline_reason?"]
    output: JudgePanelSlot
    side_effects: ["slot_status PROPOSED -> CONFIRMED or PROPOSED -> DECLINED", "responded_at stamped", "on ACCEPT: Judge.confirmed_slot_count incremented", "on DECLINE: every RingBlock with this slot_id in block_status PLANNED moves to SUPERSEDED; no ShowClass.assigned_slot_id can name a PROPOSED slot, so no class assignment is undone", "increments JudgePanelSlot.version by 1"]

  # --- Show classes --------------------------------------------------------
  - method: POST
    path: "/dog-shows/classes"
    description: "Offer a class at a show; BREED and GROUP classes may name the parent class their winner advances into."
    roles: [ShowSecretary]
    code: 201
    input: [show_id, class_code, class_level, entry_limit, "breed_code?", "group_code?", "discipline?", "jump_height_cm?", "points_scale_override?", "parent_class_id?"]
    output: ShowClass
    side_effects: ["status = OPEN", "entry_count, present_count, counted_dog_count and base_points initialised to 0", "final_assessment_done = false"]

  - method: GET
    path: "/dog-shows/classes/{id}"
    description: "Read one class with its counts and frozen points tier."
    roles: [SanctionOfficer, ClubOfficer, ShowSecretary, Judge, Handler, RegistryOfficer]
    code: 200
    input: []
    output: ShowClass
    side_effects: []

  - method: GET
    path: "/dog-shows/classes"
    description: "List classes, filterable by show, feeder parent, assigned panel slot, level and status."
    roles: [SanctionOfficer, ClubOfficer, ShowSecretary, Judge, Handler, RegistryOfficer]
    code: 200
    input: ["show_id?", "parent_class_id?", "assigned_slot_id?", "class_level?", "status?", "limit?", "offset?"]
    output: ShowClass[]
    side_effects: []

  - method: POST
    path: "/dog-shows/classes/{id}/assign-judge"
    description: "Attach a CONFIRMED panel slot to a class, enforcing licensing, panel-role pairing and the feeder-versus-parent segregation of duties."
    roles: [ShowSecretary]
    code: 200
    input: [slot_id]
    output: ShowClass
    side_effects: ["assigned_slot_id set", "JudgePanelSlot.assigned_class_count incremented and assigned_dog_capacity recomputed", "increments ShowClass.version by 1"]

  - method: POST
    path: "/dog-shows/classes/{id}/close-entries"
    description: "Close entries for a class and re-run entry_fee_assessment in its final_at_class_close variant over every entry of the class."
    roles: [ShowSecretary]
    code: 200
    input: []
    output: ShowClass
    side_effects: ["status OPEN -> CLOSED", "final_assessment_done = true", "every Entry of the class is re-assessed, fee_basis = FINAL", "Show.fee_charged_cents, Show.levy_total_cents, Show.fee_collected_cents recomputed and Show.fee_assessment_delta_cents written", "increments ShowClass.version by 1"]

  - method: POST
    path: "/dog-shows/classes/{id}/complete"
    description: "The assigned judge records placements, which awards championship points, moves placed and present entries to JUDGED, and promotes the winner into the parent class. An empty placements array abandons the class."
    roles: [Judge]
    code: 200
    input: [placements]
    output: ShowClass
    side_effects: ["status CLOSED|SCHEDULED -> COMPLETED, or -> ABANDONED when placements is empty", "completed_at stamped from the logical clock", "counted_dog_count and base_points written per calculations.championship_points_award", "each CHECKED_IN Entry moves to JUDGED with its placement and points_awarded", "Dog.championship_points_total and Dog.majors_count recomputed; Show.points_awarded_total recomputed", "when parent_class_id is set and the class completed with a winner: a promotion Entry is created in the parent class with source = PROMOTION and the winner's armband_number", "every PUBLISHED RingBlock of this class moves to COMPLETED", "increments ShowClass.version by 1"]

  # --- Dogs ----------------------------------------------------------------
  - method: POST
    path: "/dog-shows/dogs"
    description: "Register a dog against its owning handler."
    roles: [Handler]
    code: 201
    input: [registration_number, call_name, breed_code, group_code, sex, birth_date, owner_handler_id]
    output: Dog
    side_effects: ["measurement_status = UNMEASURED", "championship_points_total = 0, majors_count = 0, qualifying_leg_counts = {AGILITY: 0, OBEDIENCE: 0, RALLY: 0}, title_codes = []"]

  - method: GET
    path: "/dog-shows/dogs/{id}"
    description: "Read one dog with its points, majors, qualifying legs and recorded titles."
    roles: [SanctionOfficer, ClubOfficer, ShowSecretary, Judge, Handler, RegistryOfficer]
    code: 200
    input: []
    output: Dog
    side_effects: []

  - method: GET
    path: "/dog-shows/dogs"
    description: "List dogs, filterable by owning handler and breed."
    roles: [SanctionOfficer, ClubOfficer, ShowSecretary, Judge, Handler, RegistryOfficer]
    code: 200
    input: ["owner_handler_id?", "breed_code?", "measurement_status?", "limit?", "offset?"]
    output: Dog[]
    side_effects: []

  - method: POST
    path: "/dog-shows/dogs/{id}/measurement"
    description: "A judge records an official wicket measurement and issues a temporary or permanent card; a permanent card can never be overwritten."
    roles: [Judge]
    code: 200
    input: [measured_height_cm, card_type]
    output: Dog
    side_effects: ["measured_height_cm and measurement_status written", "increments Dog.version by 1"]

  # --- Entries -------------------------------------------------------------
  - method: POST
    path: "/dog-shows/entries"
    description: "A handler enters a dog in an OPEN class of an APPROVED show inside the entry window."
    roles: [Handler]
    code: 201
    input: [show_id, class_id, dog_id, handler_id]
    output: Entry
    side_effects: ["entry_status = RECEIVED, welfare_status = CLEAR, source = HANDLER_SUBMITTED", "entry_fee_cents = 0 until confirmation", "ShowClass.entry_count recomputed"]

  - method: GET
    path: "/dog-shows/entries/{id}"
    description: "Read one entry with its armband, money, placement and both status axes."
    roles: [SanctionOfficer, ClubOfficer, ShowSecretary, Judge, Handler, RegistryOfficer]
    code: 200
    input: []
    output: Entry
    side_effects: []

  - method: GET
    path: "/dog-shows/entries"
    description: "List entries, filterable by show, class, dog, handler, promotion source and either status axis."
    roles: [SanctionOfficer, ClubOfficer, ShowSecretary, Judge, Handler, RegistryOfficer]
    code: 200
    input: ["show_id?", "class_id?", "dog_id?", "handler_id?", "promoted_from_entry_id?", "entry_status?", "welfare_status?", "conflict_deferred?", "limit?", "offset?"]
    output: Entry[]
    side_effects: []

  - method: POST
    path: "/dog-shows/entries/{id}/confirm"
    description: "The show secretary confirms an entry, minting its armband and assessing the provisional fee."
    roles: [ShowSecretary]
    code: 200
    input: []
    output: Entry
    side_effects: ["entry_status RECEIVED -> CONFIRMED", "armband_number assigned per calculations.armband_assignment", "entry_fee_cents, levy_cents and net_fee_cents set by calculations.entry_fee_assessment variant provisional_at_confirmation; fee_basis = PROVISIONAL", "Show money counters and confirmed_entry_count recomputed", "ShowClass.entry_count and JudgePanelSlot.assigned_dog_capacity recomputed", "every PLANNED or PUBLISHED RingBlock of the class recomputes scheduled_dog_count, judging_minutes_estimate and block_end_at, then handler_ring_conflict_resolution re-runs", "increments Entry.version by 1"]

  - method: POST
    path: "/dog-shows/entries/{id}/check-in"
    description: "Mark a confirmed entry present or absent at the ring. Not gated by the heat advisory, so a HEAT_HOLD entry still checks in."
    roles: [ShowSecretary]
    code: 200
    input: [attendance]
    output: Entry
    side_effects: ["entry_status CONFIRMED -> CHECKED_IN when attendance is PRESENT, CONFIRMED -> ABSENT when attendance is ABSENT", "ShowClass.present_count recomputed", "increments Entry.version by 1"]

  - method: POST
    path: "/dog-shows/entries/{id}/declare-season"
    description: "The owning handler declares a bitch in season, which moves the welfare axis to SEASON_DECLARED, withdraws the entry with a refund, and cascades through the class, the panel slot and the ring schedule."
    roles: [Handler]
    code: 200
    input: []
    output: Entry
    side_effects: ["welfare_status CLEAR -> SEASON_DECLARED and entry_status CONFIRMED|CHECKED_IN -> WITHDRAWN in the same request", "refund written per calculations.withdrawal_refund_settlement; Entry.fee_refunded_cents and net_fee_cents updated; Show.fee_refunded_cents, fee_retained_cents and fee_collected_cents recomputed", "ShowClass.entry_count, present_count and JudgePanelSlot.assigned_dog_capacity recomputed", "every PLANNED or PUBLISHED RingBlock of the class recomputes scheduled_dog_count, judging_minutes_estimate and block_end_at", "handler_ring_conflict_resolution re-runs over the show's PUBLISHED blocks, flipping Entry.conflict_deferred and RingBlock.deferred_dog_count", "increments Entry.version by 1"]

  # --- Ring blocks ---------------------------------------------------------
  - method: POST
    path: "/dog-shows/ring-blocks"
    description: "Plan a judging block for a class in a numbered ring. Pins the show's version for optimistic concurrency and derives the block's end from the judging-speed standard."
    roles: [ShowSecretary]
    code: 201
    input: [show_id, class_id, slot_id, ring_number, block_start_at, expected_show_version]
    output: RingBlock
    side_effects: ["block_status = PLANNED", "scheduled_dog_count, conflict_free_minutes, judging_minutes_estimate and block_end_at computed per calculations.ring_block_duration", "create-with-supersede: any existing block of the same class_id with block_status IN {PLANNED, PUBLISHED} moves to SUPERSEDED and its id is recorded in superseded_block_id; when the superseded block was PUBLISHED and no PUBLISHED block remains for the class, ShowClass moves SCHEDULED -> CLOSED", "increments Show.version by 1"]

  - method: GET
    path: "/dog-shows/ring-blocks/{id}"
    description: "Read one ring block with both interval geometries."
    roles: [SanctionOfficer, ClubOfficer, ShowSecretary, Judge, Handler, RegistryOfficer]
    code: 200
    input: []
    output: RingBlock
    side_effects: []

  - method: GET
    path: "/dog-shows/ring-blocks"
    description: "List ring blocks, filterable by show, class, panel slot, ring, status and superseded predecessor."
    roles: [SanctionOfficer, ClubOfficer, ShowSecretary, Judge, Handler, RegistryOfficer]
    code: 200
    input: ["show_id?", "class_id?", "slot_id?", "ring_number?", "block_status?", "superseded_block_id?", "limit?", "offset?"]
    output: RingBlock[]
    side_effects: []

  - method: POST
    path: "/dog-shows/ring-blocks/{id}/publish"
    description: "Publish a planned block to the printed schedule, which requires its panel slot to be CONFIRMED and runs handler_ring_conflict_resolution across the show."
    roles: [ShowSecretary]
    code: 200
    input: []
    output: RingBlock
    side_effects: ["block_status PLANNED -> PUBLISHED", "published_at stamped", "the block's ShowClass moves CLOSED -> SCHEDULED", "handler_ring_conflict_resolution re-runs over every PUBLISHED block of the show, setting Entry.conflict_deferred and recomputing deferred_dog_count, judging_minutes_estimate and block_end_at", "increments RingBlock.version by 1"]

  - method: POST
    path: "/dog-shows/ring-blocks/{id}/reschedule"
    description: "Move a published block to a new start time, re-checking ring occupancy and the judge rest buffer. Pins the show's version for optimistic concurrency."
    roles: [ShowSecretary]
    code: 200
    input: [block_start_at, expected_show_version]
    output: RingBlock
    side_effects: ["block_status PUBLISHED -> PUBLISHED with a new block_start_at and recomputed block_end_at", "handler_ring_conflict_resolution re-runs over the show's PUBLISHED blocks", "increments RingBlock.version by 1", "increments Show.version by 1"]

  # --- Performance runs ----------------------------------------------------
  - method: POST
    path: "/dog-shows/performance-runs"
    description: "Record an agility, obedience or rally run for a checked-in performance entry; scoring decides whether the run earns a title leg."
    roles: [Judge]
    code: 201
    input: [entry_id, course_yardage_m, standard_course_time_s, actual_time_s, "faults_count?", "refusals_count?", "obedience_deductions?"]
    output: PerformanceRun
    side_effects: ["discipline copied from the entry's ShowClass", "time_faults, total_faults, final_score, run_result and title_leg_awarded computed per calculations.performance_run_scoring", "on a QUALIFIED run: Dog.qualifying_leg_counts for that discipline is incremented"]

  - method: GET
    path: "/dog-shows/entries/{id}/performance-runs"
    description: "List the performance runs recorded against one entry; the only discovery channel for these append-only rows."
    roles: [SanctionOfficer, ClubOfficer, ShowSecretary, Judge, Handler, RegistryOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: PerformanceRun[]
    side_effects: []

  # --- Protests ------------------------------------------------------------
  - method: POST
    path: "/dog-shows/protests"
    description: "A handler files a protest against an entry within the protest window, backed by a deposit."
    roles: [Handler]
    code: 201
    input: [show_id, entry_id, filed_by_handler_id, protest_type, statement, deposit_cents]
    output: Protest
    side_effects: ["status = FILED", "review_round = 0", "deposit_refunded = false"]

  - method: GET
    path: "/dog-shows/protests/{id}"
    description: "Read one protest with its review round and resolution."
    roles: [SanctionOfficer, ClubOfficer, ShowSecretary, Judge, Handler, RegistryOfficer]
    code: 200
    input: []
    output: Protest
    side_effects: []

  - method: GET
    path: "/dog-shows/protests"
    description: "List protests, filterable by show, protested entry, filing handler and status."
    roles: [SanctionOfficer, ClubOfficer, ShowSecretary, Judge, Handler, RegistryOfficer]
    code: 200
    input: ["show_id?", "entry_id?", "filed_by_handler_id?", "status?", "limit?", "offset?"]
    output: Protest[]
    side_effects: []

  - method: POST
    path: "/dog-shows/protests/{id}/begin-review"
    description: "A sanction officer opens the hearing on a filed protest."
    roles: [SanctionOfficer]
    code: 200
    input: []
    output: Protest
    side_effects: ["status FILED -> UNDER_REVIEW", "review_round incremented by 1 (0 -> 1 on the first review)", "reviewed_by_user_id is NOT written here - it records the officer that decides the protest", "increments Protest.version by 1"]

  - method: POST
    path: "/dog-shows/protests/{id}/request-evidence"
    description: "Adjourn the hearing pending further evidence from the filing handler."
    roles: [SanctionOfficer]
    code: 200
    input: [evidence_request]
    output: Protest
    side_effects: ["status UNDER_REVIEW -> EVIDENCE_REQUESTED", "evidence_request stored", "increments Protest.version by 1"]

  - method: POST
    path: "/dog-shows/protests/{id}/resubmit-evidence"
    description: "The filing handler supplies the requested evidence, reopening the hearing for another round."
    roles: [Handler]
    code: 200
    input: [evidence_note]
    output: Protest
    side_effects: ["status EVIDENCE_REQUESTED -> UNDER_REVIEW", "evidence_note stored", "review_round incremented", "increments Protest.version by 1"]

  - method: POST
    path: "/dog-shows/protests/{id}/decide"
    description: "A sanction officer other than the show's approver upholds or dismisses the protest; upholding disqualifies the entry and cascades through placements, points, titles and the registry filing."
    roles: [SanctionOfficer]
    code: 200
    input: [decision, "resolution_code?"]
    output: Protest
    side_effects: ["status UNDER_REVIEW -> UPHELD or -> DISMISSED", "decided_at stamped; resolution_code stored", "on UPHELD with DISQUALIFY_ENTRY: the protested Entry moves CHECKED_IN|JUDGED -> DISQUALIFIED, remaining placements move up one position, championship_points_award re-runs over the class, affected Dog and Show points totals are recomputed, any ACCEPTED RegistryFiling of the show reverts to PENDING with amendment_count incremented, unsupported Dog.title_codes are removed and the Show moves RESULTS_FILED -> COMPLETED", "on UPHELD: deposit_refunded = true", "increments Protest.version by 1"]

  # --- Registry filings ----------------------------------------------------
  - method: POST
    path: "/dog-shows/registry-filings"
    description: "The show secretary files completed results with the national registry."
    roles: [ShowSecretary]
    code: 201
    input: [show_id]
    output: RegistryFiling
    side_effects: ["filing_status = PENDING", "filed_at stamped", "championship_points_total_filed snapshot from Show.points_awarded_total", "title_records_count = 0, amendment_count = 0"]

  - method: GET
    path: "/dog-shows/registry-filings/{id}"
    description: "Read one registry filing."
    roles: [SanctionOfficer, ClubOfficer, ShowSecretary, Judge, Handler, RegistryOfficer]
    code: 200
    input: []
    output: RegistryFiling
    side_effects: []

  - method: GET
    path: "/dog-shows/shows/{id}/registry-filings"
    description: "List the registry filings raised for one show, including superseded and rejected ones."
    roles: [SanctionOfficer, ClubOfficer, ShowSecretary, Judge, Handler, RegistryOfficer]
    code: 200
    input: ["filing_status?", "limit?", "offset?"]
    output: RegistryFiling[]
    side_effects: []

  - method: POST
    path: "/dog-shows/registry-filings/{id}/adjudicate"
    description: "The registry officer accepts the filing and records earned titles, or rejects it as incomplete."
    roles: [RegistryOfficer]
    code: 200
    input: [decision, "reject_reason?"]
    output: RegistryFiling
    side_effects: ["filing_status PENDING -> ACCEPTED or PENDING -> REJECTED_INCOMPLETE", "adjudicated_at stamped", "on ACCEPT: calculations.title_recording appends earned codes to Dog.title_codes, title_records_count written, and the Show moves COMPLETED -> RESULTS_FILED", "increments RegistryFiling.version by 1"]

  # --- Test-driving clock --------------------------------------------------
  - method: POST
    path: "/dog-shows/_clock/set_current_utc"
    description: "Set the server's logical clock, which every window, buffer and timestamp rule reads. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time."
    roles: [SanctionOfficer, ClubOfficer, ShowSecretary, Judge, Handler, RegistryOfficer]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["the logical clock used by every subsequent request is set to to_iso8601", "no entity is mutated and no version is incremented"]

# ---------------------------------------------------------------------------
# 1.6 Error Catalog
# ---------------------------------------------------------------------------
errors:
  # --- authentication, authorization, request shape ------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Id or X-User-Role header missing or empty on any request"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "X-User-Role is not a declared role, or is not listed in the target endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "An entity_backed caller acts on a resource that belongs to a different club, judge or handler"
  - id: ERR_SEGREGATION_CONFLICT
    http: 403
    condition: "The sanction officer who approved the show tries to decide a protest on it, or a judge already assigned to a feeder class is assigned that class's parent class"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required body field, wrong type, undeclared enum member, negative money or count, or limit/offset outside 1..100 / >= 0"

  # --- existence -----------------------------------------------------------
  - id: ERR_CLUB_NOT_FOUND
    http: 404
    condition: "club_id in a path or body does not resolve to a Club"
  - id: ERR_SHOW_NOT_FOUND
    http: 404
    condition: "show_id in a path or body does not resolve to a Show"
  - id: ERR_JUDGE_NOT_FOUND
    http: 404
    condition: "judge_id in a path or body does not resolve to a Judge"
  - id: ERR_SLOT_NOT_FOUND
    http: 404
    condition: "slot_id in a path or body does not resolve to a JudgePanelSlot"
  - id: ERR_CLASS_NOT_FOUND
    http: 404
    condition: "class_id or parent_class_id does not resolve to a ShowClass"
  - id: ERR_HANDLER_NOT_FOUND
    http: 404
    condition: "handler_id, owner_handler_id or filed_by_handler_id does not resolve to a Handler"
  - id: ERR_DOG_NOT_FOUND
    http: 404
    condition: "dog_id in a path or body does not resolve to a Dog"
  - id: ERR_ENTRY_NOT_FOUND
    http: 404
    condition: "entry_id in a path or body, or an id inside a placements array, does not resolve to an Entry"
  - id: ERR_RING_BLOCK_NOT_FOUND
    http: 404
    condition: "The ring-block path id does not resolve to a RingBlock"
  - id: ERR_PROTEST_NOT_FOUND
    http: 404
    condition: "The protest path id does not resolve to a Protest"
  - id: ERR_FILING_NOT_FOUND
    http: 404
    condition: "The registry-filing path id does not resolve to a RegistryFiling"

  # --- state ---------------------------------------------------------------
  - id: ERR_SHOW_NOT_IN_DRAFT
    http: 409
    condition: "POST /dog-shows/shows/{id}/submit on a show whose status is not DRAFT or RETURNED"
  - id: ERR_SHOW_NOT_ACCEPTING_ENTRIES
    http: 409
    condition: "An entry, panel slot, class or ring block is created against a show that is not in the state that operation requires (entries need APPROVED; ring blocks need APPROVED or IN_PROGRESS)"
  - id: ERR_SLOT_NOT_CONFIRMED
    http: 409
    condition: "A class is assigned to, or a ring block published against, a JudgePanelSlot whose slot_status is not CONFIRMED"
  - id: ERR_CLASS_NOT_OPEN
    http: 409
    condition: "An entry is created or confirmed against, or close-entries is called on, a class whose status is not OPEN"
  - id: ERR_CLASS_NOT_READY
    http: 409
    condition: "An entry is checked in while its class status is neither CLOSED nor SCHEDULED, or a class is completed from a status other than CLOSED or SCHEDULED"
  - id: ERR_CLASSES_NOT_COMPLETE
    http: 409
    condition: "A registry filing is created while some non-ABANDONED class of the show has not reached COMPLETED, or the show is closed with a class still open"
  - id: ERR_PROTEST_NOT_IN_REVIEW
    http: 409
    condition: "request-evidence or decide is called on a protest whose status is not UNDER_REVIEW, or resubmit-evidence on one that is not EVIDENCE_REQUESTED"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Any other transition attempted from a state where §1.2 does not declare it, including every repeat of an already-applied action and every attempt out of a terminal state"

  # --- optimistic concurrency ---------------------------------------------
  - id: ERR_STALE_SHOW_VERSION
    http: 412
    condition: "expected_show_version does not equal the Show's current version on ring-block creation or reschedule"
  - id: ERR_STALE_JUDGE_VERSION
    http: 412
    condition: "expected_judge_version does not equal the Judge's current version on panel-slot proposal"

  # --- welfare and safety --------------------------------------------------
  - id: ERR_HEAT_RESTRICTION_ACTIVE
    http: 409
    condition: "The show's current_advisory_level is RED and the request would publish, reschedule, judge or run dogs"
  - id: ERR_BITCH_IN_SEASON
    http: 409
    condition: "An entry with welfare_status SEASON_DECLARED is confirmed or checked in, a dog with a season-declared entry at that show is entered again, or declare-season is called for a dog whose sex is not BITCH"
  - id: ERR_HANDLER_SUSPENDED
    http: 403
    condition: "The acting or named handler has status SUSPENDED"
  - id: ERR_DOG_UNDER_MINIMUM_AGE
    http: 409
    condition: "The dog is younger than MIN_ENTRY_AGE_MONTHS whole months on the show date"

  # --- referential and licensing ------------------------------------------
  - id: ERR_CLUB_NOT_ACTIVE
    http: 409
    condition: "The hosting club's sanction_status is not ACTIVE when a show is created or submitted"
  - id: ERR_JUDGE_NOT_ACTIVE
    http: 409
    condition: "The judge's status is not ACTIVE when a panel slot is proposed or a class is assigned"
  - id: ERR_JUDGE_NOT_APPROVED_FOR_GROUP
    http: 409
    condition: "The class's group_code is absent from Judge.approved_breed_group_codes"
  - id: ERR_JUDGE_NOT_APPROVED_FOR_DISCIPLINE
    http: 409
    condition: "The performance class's discipline is absent from Judge.approved_performance_disciplines"
  - id: ERR_PANEL_ROLE_MISMATCH
    http: 409
    condition: "The slot's panel_role does not pair with the class's class_level, or the slot belongs to a different show than the class"
  - id: ERR_PARENT_CLASS_LEVEL_INVALID
    http: 409
    condition: "parent_class_id names a class of another show, or one that is not exactly one rung above the child, or a PERFORMANCE class is used as parent or child"
  - id: ERR_BREED_MISMATCH
    http: 409
    condition: "The dog's breed_code or group_code does not match the class it is entered in"
  - id: ERR_MEASUREMENT_REQUIRED
    http: 409
    condition: "An agility entry is attempted for a dog whose measurement_status is UNMEASURED"
  - id: ERR_JUMP_HEIGHT_MISMATCH
    http: 409
    condition: "The class's jump_height_cm differs from the height the dog's measured_height_cm maps to"
  - id: ERR_MEASUREMENT_LOCKED
    http: 409
    condition: "A new measurement is recorded for a dog whose measurement_status is already PERMANENT_CARD"
  - id: ERR_COURSE_DESIGN_INVALID
    http: 409
    condition: "standard_course_time_s is below the yardage-derived minimum, or a run is recorded against a non-performance or non-checked-in entry"

  # --- temporal ------------------------------------------------------------
  - id: ERR_ENTRY_WINDOW_CLOSED
    http: 409
    condition: "The logical clock is outside the inclusive [entry_open_at, entry_close_at] window"
  - id: ERR_RING_BLOCK_OVERLAP
    http: 409
    condition: "The candidate block's half-open interval intersects another PLANNED or PUBLISHED block in the same ring of the same show"
  - id: ERR_JUDGE_REST_BUFFER_VIOLATION
    http: 409
    condition: "Another block of the same judge is separated from the candidate by less than JUDGE_REST_BUFFER_MINUTES"
  - id: ERR_PROTEST_WINDOW_EXPIRED
    http: 409
    condition: "A protest is filed more than PROTEST_WINDOW_HOURS after the class completed, or against a class of a show that is neither taking entries nor in progress"

  # --- constraint and capacity --------------------------------------------
  - id: ERR_DUPLICATE_ENTRY
    http: 409
    condition: "The same dog is already entered in the same class of the same show in a non-terminal or judged status"
  - id: ERR_CLASS_ENTRY_LIMIT_REACHED
    http: 409
    condition: "The class already holds entry_limit entries in RECEIVED, CONFIRMED, CHECKED_IN or JUDGED"
  - id: ERR_SHOW_ENTRY_CAP_REACHED
    http: 409
    condition: "The show already holds max_total_entries entries across all its classes"
  - id: ERR_JUDGE_ASSIGNMENT_LIMIT
    http: 409
    condition: "The judge already holds MAX_SLOTS_PER_JUDGE_PER_SHOW slots at this show, or a slot at another show on the same show_date"
  - id: ERR_JUDGE_DOG_LIMIT_EXCEEDED
    http: 409
    condition: "Confirming this entry would push the judge's daily dog load above the slot's assigned_dog_capacity"
  - id: ERR_PLACEMENT_SET_INVALID
    http: 409
    condition: "placements does not hold exactly min(MAX_PLACEMENTS, ShowClass.present_count) distinct members - too few, more than MAX_PLACEMENTS, a repeat, or an entry that is not a CHECKED_IN member of this class"
  - id: ERR_FILING_ALREADY_OPEN
    http: 409
    condition: "The show already has a RegistryFiling whose filing_status is not REJECTED_INCOMPLETE"
  - id: ERR_OPEN_PROTEST_BLOCKS_FILING
    http: 409
    condition: "A protest of the show is still FILED, UNDER_REVIEW or EVIDENCE_REQUESTED when a filing is created or adjudicated"

  # --- fiscal --------------------------------------------------------------
  - id: ERR_CLUB_ALLOWANCE_EXHAUSTED
    http: 409
    condition: "Club.events_approved_count has reached Club.annual_event_allowance when a show is submitted"
  - id: ERR_PROTEST_DEPOSIT_INSUFFICIENT
    http: 402
    condition: "deposit_cents is below PROTEST_DEPOSIT_MIN_CENTS"

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: ClubOfficer
    identity: "entity_backed:Club"
    description: "An officer of the host kennel club. X-User-Id is the Club id; the officer may only touch shows of that club."
    exclusive_operations:
      - "POST /dog-shows/shows"
      - "POST /dog-shows/shows/{id}/submit"
    shared_operations:
      - "every GET endpoint"
    denied_operations:
      - "POST /dog-shows/shows/{id}/approve (SanctionOfficer only, so no club approves its own application)"
      - "POST /dog-shows/classes, POST /dog-shows/panel-slots, POST /dog-shows/ring-blocks (ShowSecretary only)"
      - "POST /dog-shows/classes/{id}/complete (Judge only)"

  - name: SanctionOfficer
    identity: "opaque"
    description: "Sanctioning body officer. X-User-Id is an opaque staff identifier that is recorded on approval and on protest review."
    exclusive_operations:
      - "POST /dog-shows/clubs"
      - "POST /dog-shows/judges"
      - "POST /dog-shows/shows/{id}/approve"
      - "POST /dog-shows/shows/{id}/return"
      - "POST /dog-shows/protests/{id}/begin-review"
      - "POST /dog-shows/protests/{id}/request-evidence"
      - "POST /dog-shows/protests/{id}/decide"
    shared_operations:
      - "POST /dog-shows/handlers (shared with ShowSecretary)"
      - "every GET endpoint"
    denied_operations:
      - "POST /dog-shows/shows and POST /dog-shows/shows/{id}/submit (ClubOfficer only)"
      - "POST /dog-shows/protests/{id}/decide on a show this same X-User-Id approved (ERR_SEGREGATION_CONFLICT)"
      - "POST /dog-shows/registry-filings/{id}/adjudicate (RegistryOfficer only)"

  - name: ShowSecretary
    identity: "opaque"
    description: "Show secretary running the event: panel, classes, entries, ring schedule, temperature log and registry filing."
    exclusive_operations:
      - "POST /dog-shows/shows/{id}/open-day"
      - "POST /dog-shows/shows/{id}/close"
      - "POST /dog-shows/shows/{id}/temperature-readings"
      - "POST /dog-shows/panel-slots"
      - "POST /dog-shows/classes"
      - "POST /dog-shows/classes/{id}/assign-judge"
      - "POST /dog-shows/classes/{id}/close-entries"
      - "POST /dog-shows/entries/{id}/confirm"
      - "POST /dog-shows/entries/{id}/check-in"
      - "POST /dog-shows/ring-blocks"
      - "POST /dog-shows/ring-blocks/{id}/publish"
      - "POST /dog-shows/ring-blocks/{id}/reschedule"
      - "POST /dog-shows/registry-filings"
    shared_operations:
      - "POST /dog-shows/handlers (shared with SanctionOfficer)"
      - "every GET endpoint"
    denied_operations:
      - "POST /dog-shows/classes/{id}/complete and POST /dog-shows/performance-runs (Judge only)"
      - "POST /dog-shows/entries and POST /dog-shows/entries/{id}/declare-season (Handler only)"
      - "POST /dog-shows/registry-filings/{id}/adjudicate (RegistryOfficer only)"

  - name: Judge
    identity: "entity_backed:Judge"
    description: "Licensed judge. X-User-Id is the Judge id; a judge may only answer its own panel slot invitations."
    exclusive_operations:
      - "POST /dog-shows/panel-slots/{id}/respond"
      - "POST /dog-shows/dogs/{id}/measurement"
      - "POST /dog-shows/classes/{id}/complete"
      - "POST /dog-shows/performance-runs"
    shared_operations:
      - "every GET endpoint"
    denied_operations:
      - "POST /dog-shows/panel-slots (ShowSecretary only, so no judge invites itself)"
      - "POST /dog-shows/panel-slots/{id}/respond for a slot whose judge_id is a different judge (ERR_NOT_RESOURCE_OWNER)"
      - "POST /dog-shows/entries and POST /dog-shows/entries/{id}/confirm"

  - name: Handler
    identity: "entity_backed:Handler"
    description: "Exhibitor or handler. X-User-Id is the Handler id; entries, season declarations and protests are bound to that id."
    exclusive_operations:
      - "POST /dog-shows/dogs"
      - "POST /dog-shows/entries"
      - "POST /dog-shows/entries/{id}/declare-season"
      - "POST /dog-shows/protests"
      - "POST /dog-shows/protests/{id}/resubmit-evidence"
    shared_operations:
      - "every GET endpoint"
    denied_operations:
      - "POST /dog-shows/entries with a handler_id other than X-User-Id (ERR_NOT_RESOURCE_OWNER)"
      - "POST /dog-shows/entries/{id}/confirm and POST /dog-shows/entries/{id}/check-in (ShowSecretary only)"
      - "POST /dog-shows/protests/{id}/begin-review and POST /dog-shows/protests/{id}/decide (SanctionOfficer only)"

  - name: RegistryOfficer
    identity: "opaque"
    description: "National registry officer who accepts results filings and records titles."
    exclusive_operations:
      - "POST /dog-shows/registry-filings/{id}/adjudicate"
    shared_operations:
      - "every GET endpoint"
    denied_operations:
      - "POST /dog-shows/registry-filings (ShowSecretary only, so the filer never adjudicates its own filing)"
      - "POST /dog-shows/classes/{id}/complete and POST /dog-shows/protests/{id}/decide"

rbac_notes:
  segregation_of_duties:
    - "Approval versus adjudication: the X-User-Id stored in Show.approved_by_user_id is barred from POST /dog-shows/protests/{id}/decide on that show, so a second sanction officer must hear the protest."
    - "Filing versus adjudication: ShowSecretary raises the RegistryFiling and only RegistryOfficer may adjudicate it."
    - "Feeder versus parent judging: a Judge holding a panel slot assigned to a BREED class may not have a slot assigned to that class's parent GROUP class."
  entity_backed_identity:
    - "ClubOfficer: X-User-Id must equal Show.club_id"
    - "Judge: X-User-Id must equal JudgePanelSlot.judge_id, and for class completion the judge of the class's assigned_slot_id"
    - "Handler: X-User-Id must equal Entry.handler_id, Dog.owner_handler_id or Protest.filed_by_handler_id"
  role_denial_error: "Role not listed on the endpoint returns ERR_ROLE_NOT_PERMITTED (403); a listed role acting on someone else's resource returns ERR_NOT_RESOURCE_OWNER (403)"
