    output: WaitlistEntry
    side_effects: ["status -> SEATED", "guest.no_show_count decremented if > 0", "increments entry.version"]

  - method: POST
    path: "/api/waitlist/{entry_id}/cancel"
    description: "Cancel a waitlist entry"
