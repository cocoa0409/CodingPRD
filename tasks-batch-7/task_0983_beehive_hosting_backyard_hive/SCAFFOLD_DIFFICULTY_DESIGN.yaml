            - "HoneyAllocation.${alloc}.host_kg == 0.202 (pinned order: 0.101 + 0.101; sum-then-round would give 0.201)"
            - "HoneyAllocation.${alloc}.effective_bps == 1000"
            - "HoneyAllocation.${alloc}.reserve_kg == 0.060 (round3(2.010 * 0.03), no edu portion)"
            - "HoneyAllocation.${alloc}.operator_kg == 1.748 (2.010 - 0.202 - 0.060)"

      - name: reserve_pool_pinned_evaluation_order
        grounds:
          - calculations.season_pool_and_reserve
          - calculations.honey_share_allocation
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — host share is computed WITH the 200 bps education
          bonus, then the reserve is topped up BY the same education portion; the scaffold pins
          order (1) pool, (2) host share, (3) edu portion, (4) reserve tier, (5) reserve top-up,
          (6) operator remainder. On pool 17.800 kg: host 5.251, edu portion 0.356, reserve
