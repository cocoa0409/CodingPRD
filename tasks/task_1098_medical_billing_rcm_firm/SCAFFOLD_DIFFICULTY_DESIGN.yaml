            - call: "POST /rcm/claims/${claim_a}/lines"
              payload: { cpt_code: "99213", units: 1, charge_amount_cents: 1250 }
              as: Coder
            - call: "POST /rcm/claims/${claim_a}/scrub"
              payload: {}
              as: Coder
