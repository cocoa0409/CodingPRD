# =============================================================================
# SCAFFOLD: real-estate-pre-licensing-school (task_1355)
# State-approved real estate school: course approval & seat-time rules,
# enrollment & proctoring, pass-rate reporting, CE credit reporting,
# instructor approval & renewal, refunds, multi-state equivalency,
# certificates & audit records.
# =============================================================================

scenario: |
  Real Estate Pre-Licensing School & Continuing Education (state-approved real estate school): course approval by state commission & seat-time rules, student enrollment & progress/proctoring requirements, exam prep & pass-rate reporting obligations, CE credit reporting to licensing authority, instructor approval & course renewal cycle, refund/withdrawal policy, multi-state course equivalency, certificate issuance & audit records

domain_name: real-estate-pre-licensing-school
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - scheduled_actions
  entity_topology: flat          # peer entities joined by FK references; URLs are top-level collections
  state_machine_shape: cyclic    # approval/renewal loops, report correction loop, enrollment regression loop
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential            # CreditReport.amendment_of_id
    - polymorphic                 # AuditEvent.entity_id points at any entity type
  role_model: segregation_of_duties   # proctor of an exam MUST NOT be the offering's instructor of record
  consistency_model: immediate

# =============================================================================
# Table 1.0: Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity-Relationship Table
# common_fields: true  => id (server-minted UUID, identity only), created_at,
#                        updated_at (refreshed on every mutation incl. cascades),
#                        version (integer, starts 1, +1 per mutation)
# All rule dates are ISO calendar dates (YYYY-MM-DD); the logical clock is a
# UTC datetime; "today" means the clock's UTC calendar date.
# =============================================================================
entities:
  - name: School
    parent: null
    common_fields: true
    fields:
      - { name: school_name, type: string, source: input, description: "Legal school name" }
      - { name: school_code, type: string, source: input, description: "Unique school code, used in certificate numbers", constraints: "globally unique" }
      - { name: home_state_code, type: string, source: input, description: "2-letter state code of primary licensure" }
      - { name: pass_rate_threshold_bps, type: integer, source: input, default: 6000, description: "First-attempt pass-rate floor in basis points; below it the school is placed on PROBATION", constraints: "0..10000" }
      - { name: director_user_id, type: string, source: system, description: "X-User-ID of the SchoolDirector who created the school; scopes SchoolDirector operations" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | LICENSED | SUSPENDED | REVOKED" }
      - { name: posture, type: enum, source: computed, description: "GOOD_STANDING | PROBATION; derived from first-attempt pass rate evaluations during the regulatory sweep" }
      - { name: last_evaluation_attempt_count, type: integer, source: computed, description: "First-attempt count observed at the most recent pass-rate evaluation; 0 before any evaluation" }
      - { name: last_evaluation_first_attempt_pass_rate_bps, type: integer, source: computed, description: "First-attempt pass rate in bps at the most recent evaluation; null before any evaluation", constraints: "nullable" }

  - name: Course
    parent: null
    common_fields: true
    fields:
      - { name: school_id, type: string, source: input, description: "FK -> School.id; owning school" }
      - { name: course_code, type: string, source: input, description: "Course code", constraints: "unique within (school_id)" }
      - { name: title, type: string, source: input, description: "Course title" }
      - { name: course_type, type: enum, source: input, description: "PRE_LICENSING | CONTINUING_ED" }
      - { name: required_seat_minutes, type: integer, source: input, description: "State-mandated seat time in minutes", constraints: "> 0" }
      - { name: tuition_cents, type: integer, source: input, description: "Catalog tuition in cents", constraints: ">= 0" }
      - { name: pass_score_pct, type: integer, source: input, description: "Minimum final-exam score percent to pass (inclusive)", constraints: "1..100" }
      - { name: max_exam_attempts, type: integer, source: input, default: 2, description: "Maximum non-INVALIDATED exam attempts per enrollment", constraints: ">= 1" }
      - { name: completion_deadline_days, type: integer, source: input, description: "Days after offering end_date by which the enrollment must complete", constraints: ">= 1" }
      - { name: ce_credit_hours, type: number, source: input, default: 0, description: "CE credit hours granted on completion; only courses with ce_credit_hours > 0 appear on credit reports", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | RETIRED" }

  - name: CourseApproval
    parent: null
    common_fields: true
    fields:
      - { name: course_id, type: string, source: system, description: "FK -> Course.id; from path" }
      - { name: state_code, type: string, source: input, description: "2-letter state code the approval applies to" }
      - { name: application_round, type: integer, source: system, description: "Starts at 1; +1 on every resubmit and on every approved renewal" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | DENIED | EXPIRING | RENEWAL_PENDING | EXPIRED" }
      - { name: valid_from, type: datetime, source: system, description: "Approval validity start (calendar date), set from the decide payload when decision=APPROVED; null otherwise", constraints: "nullable" }
      - { name: valid_until, type: datetime, source: system, description: "Approval validity end (calendar date), set from the decide payload when decision=APPROVED; null otherwise", constraints: "nullable" }
      - { name: decided_at, type: datetime, source: system, description: "Clock timestamp of the most recent decide call; null until first decision", constraints: "nullable" }

  - name: Instructor
    parent: null
    common_fields: true
    fields:
      - { name: school_id, type: string, source: input, description: "FK -> School.id; employing school" }
      - { name: full_name, type: string, source: input, description: "Instructor full name" }
      - { name: license_number, type: string, source: input, description: "State instructor license number", constraints: "unique within (school_id)" }

  - name: InstructorApproval
    parent: null
    common_fields: true
    fields:
      - { name: instructor_id, type: string, source: system, description: "FK -> Instructor.id; from path" }
      - { name: state_code, type: string, source: input, description: "2-letter state code the instructor approval applies to" }
      - { name: application_round, type: integer, source: system, description: "Starts at 1; +1 on every resubmit and on every approved renewal" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | DENIED | EXPIRING | RENEWAL_PENDING | EXPIRED" }
      - { name: valid_from, type: datetime, source: system, description: "Validity start (calendar date) set from decide payload when APPROVED; null otherwise", constraints: "nullable" }
      - { name: valid_until, type: datetime, source: system, description: "Validity end (calendar date) set from decide payload when APPROVED; null otherwise", constraints: "nullable" }
      - { name: decided_at, type: datetime, source: system, description: "Clock timestamp of the most recent decide; null until decided", constraints: "nullable" }

  - name: CourseOffering
    parent: null
    common_fields: true
    fields:
      - { name: course_id, type: string, source: input, description: "FK -> Course.id" }
      - { name: instructor_id, type: string, source: input, description: "FK -> Instructor.id; instructor of record" }
      - { name: state_code, type: string, source: input, description: "2-letter state code the offering is delivered/credited in" }
      - { name: start_date, type: datetime, source: input, description: "First class day (calendar date)" }
      - { name: end_date, type: datetime, source: input, description: "Last class day (calendar date)", constraints: "must be >= start_date" }
      - { name: capacity, type: integer, source: input, description: "Maximum seats", constraints: ">= 1" }
      - { name: delivery_mode, type: enum, source: input, description: "IN_PERSON | DISTANCE" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | IN_SESSION | COMPLETED | CANCELLED" }
      - { name: enrolled_count, type: integer, source: computed, description: "Count of enrollments whose academic_status is NOT IN {WITHDRAWN, FAILED, EXPIRED}" }
      - { name: seats_available, type: integer, source: computed, description: "capacity - enrolled_count; invariant: capacity == enrolled_count + seats_available" }

  - name: Student
    parent: null
    common_fields: true
    fields:
      - { name: school_id, type: string, source: input, description: "FK -> School.id" }
      - { name: full_name, type: string, source: input, description: "Student full name" }
      - { name: email, type: string, source: input, description: "Student email", constraints: "unique within (school_id), case-insensitive" }
      - { name: license_goal_state, type: string, source: input, description: "2-letter state code the student seeks licensure in" }

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; optional for role Student (defaults to X-User-ID), required for Registrar" }
      - { name: offering_id, type: string, source: input, description: "FK -> CourseOffering.id" }
      - { name: academic_status, type: enum, source: system, description: "ENROLLED | IN_PROGRESS | SEAT_TIME_MET | EXAM_PASSED | COMPLETED | WITHDRAWN | FAILED | EXPIRED" }
      - { name: payment_status, type: enum, source: system, description: "PENDING | PAID | PARTIALLY_REFUNDED | REFUNDED | VOIDED; parallel dimension independent of academic_status" }
      - { name: scholarship_cents, type: integer, source: input, default: 0, description: "Scholarship applied at enrollment", constraints: ">= 0" }
      - { name: charge_total_cents, type: integer, source: computed, description: "Order total per calculation order_total_cents; pinned at creation" }
      - { name: paid_cents, type: integer, source: computed, description: "Amount captured via pay; 0 until PAID" }
      - { name: retained_cents, type: integer, source: computed, description: "paid_cents - granted refund once a refund is PAID; invariant: paid_cents == retained_cents + granted_refund_cents" }
      - { name: verified_seat_minutes, type: integer, source: computed, description: "Sum of minutes over AttendanceRecords with status VERIFIED (raw, uncapped)" }
      - { name: creditable_seat_minutes, type: integer, source: computed, description: "Seat minutes creditable after applying the daily cap (see calculation creditable_seat_minutes)" }
      - { name: completion_fraction_bps, type: integer, source: computed, description: "round_half_up(creditable_seat_minutes * 10000 / required_seat_minutes); may exceed 10000" }
      - { name: exam_attempts_used, type: integer, source: computed, description: "Count of ExamAttempts with status IN {SCHEDULED, PROCTORED, SCORED, NO_SHOW} (INVALIDATED excluded)" }
      - { name: deadline_date, type: datetime, source: computed, description: "offering.end_date + course.completion_deadline_days (calendar date)" }
      - { name: enrolled_at, type: datetime, source: system, description: "Clock timestamp at creation" }
      - { name: withdrawn_at, type: datetime, source: system, description: "Clock timestamp of withdrawal; null until withdrawn", constraints: "nullable" }
      - { name: withdrawal_reason, type: enum, source: system, description: "VOLUNTARY | ADMINISTRATIVE | SCHOOL_CANCELLED; SCHOOL_CANCELLED only via offering cancel cascade; null until withdrawn", constraints: "nullable" }

  - name: AttendanceRecord
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id; from path" }
      - { name: session_date, type: datetime, source: input, description: "Calendar date of the class session; must lie within [offering.start_date, offering.end_date]" }
      - { name: minutes, type: integer, source: input, description: "Minutes attended in this session", constraints: "1..1440" }
      - { name: recorded_by_instructor_id, type: string, source: system, description: "X-User-ID of the recording Instructor (must equal offering.instructor_id)" }
      - { name: status, type: enum, source: system, description: "VERIFIED | VOID; created VERIFIED, void flips to VOID; VOID excluded from all seat-minute sums" }

  - name: ExamAttempt
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id; from path" }
      - { name: attempt_number, type: integer, source: computed, description: "exam_attempts_used at creation + 1" }
      - { name: scheduled_at, type: datetime, source: input, description: "Scheduled exam start (UTC datetime)" }
      - { name: proctor_instructor_id, type: string, source: input, description: "FK -> Instructor.id; assigned proctor; MUST NOT equal the offering's instructor_id (segregation of duties)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | PROCTORED | SCORED | NO_SHOW | INVALIDATED" }
      - { name: score_pct, type: integer, source: input, description: "Final score percent, supplied on score; null until SCORED", constraints: "0..100; nullable" }
      - { name: outcome, type: enum, source: computed, description: "PASSED if score_pct >= course.pass_score_pct else FAILED; null until SCORED", constraints: "nullable" }
      - { name: invalidation_reason, type: string, source: system, description: "Reason recorded on invalidate; null otherwise", constraints: "nullable" }
      - { name: verified_at, type: datetime, source: system, description: "Clock timestamp of proctor verification; null until PROCTORED", constraints: "nullable" }
      - { name: scored_at, type: datetime, source: system, description: "Clock timestamp of scoring; null until SCORED", constraints: "nullable" }

  - name: Certificate
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id; from path; at most one Certificate per enrollment" }
      - { name: certificate_number, type: string, source: system, description: "Format: {school_code}-{issue_year}-{seq:04d}; seq = count of all certificates ever issued by the school in the issue calendar year + 1 (REVOKED included; never reused)" }
      - { name: credit_hours_pinned, type: number, source: system, description: "course.ce_credit_hours pinned at issuance" }
      - { name: issue_date, type: datetime, source: system, description: "Calendar date of issuance (clock date)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | REVOKED" }
      - { name: revoked_reason, type: string, source: system, description: "Reason on revocation; null while ACTIVE", constraints: "nullable" }
      - { name: revoked_at, type: datetime, source: system, description: "Clock timestamp of revocation; null while ACTIVE", constraints: "nullable" }

  - name: RefundRequest
    parent: null
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id; auto-created by withdrawal when payment_status == PAID; at most one per enrollment" }
      - { name: reason, type: enum, source: system, description: "Copied from enrollment.withdrawal_reason: VOLUNTARY | ADMINISTRATIVE | SCHOOL_CANCELLED" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | DENIED | PAID" }
      - { name: completion_fraction_bps_at_withdrawal, type: integer, source: system, description: "Enrollment completion_fraction_bps frozen at withdrawal" }
      - { name: scheduled_refund_cents, type: integer, source: computed, description: "Refund per published tier schedule (calculation refund_scheduled_cents)" }
      - { name: statutory_refund_cents, type: integer, source: computed, description: "Refund per statutory pro-rata rule (calculation refund_statutory_cents)" }
      - { name: granted_refund_cents, type: integer, source: computed, description: "max(scheduled_refund_cents, statutory_refund_cents); the student always receives the greater of the two" }
      - { name: denial_reason, type: string, source: system, description: "Reason supplied on deny; null otherwise", constraints: "nullable" }
      - { name: decided_at, type: datetime, source: system, description: "Clock timestamp of approve/deny; null while PENDING", constraints: "nullable" }
      - { name: paid_at, type: datetime, source: system, description: "Clock timestamp of refund payment; null until PAID", constraints: "nullable" }

  - name: CreditReport
    parent: null
    common_fields: true
    fields:
      - { name: school_id, type: string, source: input, description: "FK -> School.id" }
      - { name: period_start, type: datetime, source: input, description: "Reporting window start (calendar date, inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Reporting window end (calendar date, inclusive)", constraints: ">= period_start" }
      - { name: amendment_of_id, type: string, source: system, description: "FK -> CreditReport.id; set on amendment reports created via POST /credit-reports/{id}/amendments or by the certificate-revocation cascade; null on base reports", constraints: "nullable" }
      - { name: reason, type: string, source: input, description: "Amendment reason (required for amendments; optional on base reports)", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACKNOWLEDGED | REJECTED" }
      - { name: line_items, type: array, source: computed, description: "Snapshot at creation: [{certificate_id, enrollment_id, student_id, credit_hours}]; base report: ACTIVE certificates of the school with issue_date in [period_start, period_end] and credit_hours_pinned > 0, credit_hours rounded per-line to nearest 0.5 (round_half_up); amendment: lines of the parent report whose certificate is REVOKED at amendment time, with credit_hours negated" }
      - { name: total_credit_hours, type: number, source: computed, description: "Sum of line_items.credit_hours AFTER per-line rounding (rounding per line, then sum — order pinned)" }
      - { name: reporting_deadline_date, type: datetime, source: computed, description: "period_end + 30 calendar days" }
      - { name: submitted_at, type: datetime, source: system, description: "Clock timestamp of most recent submit; null while never submitted", constraints: "nullable" }
      - { name: late_days, type: integer, source: computed, description: "max(0, submit calendar date - reporting_deadline_date) in days; computed on submit" }
      - { name: late_fee_cents, type: integer, source: computed, description: "min(50000, 5000 + 1000 * late_days) when late_days >= 1 else 0" }
      - { name: submission_count, type: integer, source: system, description: "Number of successful submits; starts 0" }

  - name: EquivalencyGrant
    parent: null
    common_fields: true
    fields:
      - { name: course_id, type: string, source: input, description: "FK -> Course.id" }
      - { name: home_state_code, type: string, source: input, description: "State where the course holds a direct APPROVED CourseApproval" }
      - { name: recognized_state_code, type: string, source: input, description: "State recognizing the course via equivalency; MUST differ from home_state_code" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | REVOKED | SUPERSEDED" }

  - name: AuditEvent
    parent: null
    common_fields: false
    fields:
      - { name: entity_type, type: string, source: system, description: "Entity name of the mutated resource (e.g. Enrollment)" }
      - { name: entity_id, type: string, source: system, description: "Id of the mutated resource; polymorphic reference resolved via entity_type (NOT a foreign key)" }
      - { name: event_type, type: string, source: system, description: "Mutation name, e.g. ENROLLMENT_CREATED, STATUS_CHANGE, CASCADED_REVOCATION" }
      - { name: actor_role, type: string, source: system, description: "X-User-Role of the actor; 'system' for sweep/cascade events" }
      - { name: actor_id, type: string, source: system, description: "X-User-ID of the actor; 'system' for sweep/cascade events" }
      - { name: detail, type: object, source: system, description: "Event payload: {from_status?, to_status?, note?}" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: School
    initial_state: PROVISIONAL
    terminal_states: [REVOKED]
    note: "status is actor-driven; posture is system-derived (GOOD_STANDING <-> PROBATION loop) during the regulatory sweep"
    transitions:
      - { from: PROVISIONAL, to: LICENSED, trigger: "POST /schools/{id}/license", actor: StateCommission, preconditions: [], side_effects: ["AuditEvent STATUS_CHANGE"] }
      - { from: LICENSED, to: SUSPENDED, trigger: "POST /schools/{id}/suspend", actor: StateCommission, preconditions: [], side_effects: ["AuditEvent STATUS_CHANGE"] }
      - { from: SUSPENDED, to: LICENSED, trigger: "POST /schools/{id}/reinstate", actor: StateCommission, preconditions: [], side_effects: ["AuditEvent STATUS_CHANGE"] }
      - { from: PROVISIONAL, to: REVOKED, trigger: "POST /schools/{id}/revoke", actor: StateCommission, preconditions: [], side_effects: ["AuditEvent STATUS_CHANGE"] }
      - { from: LICENSED, to: REVOKED, trigger: "POST /schools/{id}/revoke", actor: StateCommission, preconditions: [], side_effects: ["AuditEvent STATUS_CHANGE"] }
      - { from: SUSPENDED, to: REVOKED, trigger: "POST /schools/{id}/revoke", actor: StateCommission, preconditions: [], side_effects: ["AuditEvent STATUS_CHANGE"] }
      - from: GOOD_STANDING
        to: PROBATION
        trigger: "system (regulatory sweep pass-rate evaluation)"
        actor: system
        preconditions:
          - "first-attempt count in trailing 90-day window >= 10"
          - "first_attempt_pass_rate_bps < school.pass_rate_threshold_bps (strictly less; equality does NOT trigger)"
        side_effects: ["posture = PROBATION", "last_evaluation_* fields updated", "AuditEvent STATUS_CHANGE"]
        note: "posture dimension; guards approval submissions and offering publish (ERR_SCHOOL_ON_PROBATION)"
      - from: PROBATION
        to: GOOD_STANDING
        trigger: "system (regulatory sweep pass-rate evaluation)"
        actor: system
        preconditions:
          - "first-attempt count in trailing 90-day window >= 10"
          - "first_attempt_pass_rate_bps >= school.pass_rate_threshold_bps"
        side_effects: ["posture = GOOD_STANDING", "last_evaluation_* fields updated", "AuditEvent STATUS_CHANGE"]
        note: "when first-attempt count < 10 the sweep leaves posture unchanged (small-sample suppression, sticky posture)"

  - entity: Course
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /courses/{id}/activate"
        actor: SchoolDirector
        preconditions:
          - "at least one CourseApproval of this course has status APPROVED (ERR_COURSE_NOT_APPROVED_ANYWHERE)"
        side_effects: ["AuditEvent STATUS_CHANGE"]
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /courses/{id}/retire"
        actor: SchoolDirector
        preconditions:
          - "no CourseOffering of this course in status DRAFT, PUBLISHED, or IN_SESSION (ERR_COURSE_HAS_OPEN_OFFERINGS)"
        side_effects: ["AuditEvent STATUS_CHANGE"]

  - entity: CourseApproval
    initial_state: PENDING
    terminal_states: [EXPIRED]
    note: "cyclic renewal loop APPROVED -> EXPIRING -> RENEWAL_PENDING -> APPROVED; DENIED -> PENDING resubmit loop; singleton per (course_id, state_code)"
    transitions:
      - { from: PENDING, to: APPROVED, trigger: "POST /approvals/{id}/decide with decision=APPROVED", actor: StateCommission, preconditions: ["valid_from and valid_until supplied", "valid_until >= valid_from (ERR_INVALID_VALIDITY_WINDOW)"], side_effects: ["valid_from/valid_until/decided_at set", "every EquivalencyGrant of this course with home_state_code == this.state_code and status SUSPENDED -> ACTIVE", "AuditEvent STATUS_CHANGE"] }
      - { from: PENDING, to: DENIED, trigger: "POST /approvals/{id}/decide with decision=DENIED", actor: StateCommission, preconditions: [], side_effects: ["decided_at set", "AuditEvent STATUS_CHANGE"] }
      - { from: DENIED, to: PENDING, trigger: "POST /approvals/{id}/resubmit", actor: ComplianceOfficer, preconditions: [], side_effects: ["application_round += 1", "decided_at = null", "AuditEvent STATUS_CHANGE"] }
      - { from: APPROVED, to: EXPIRING, trigger: "system (regulatory sweep: valid_until - today <= 30 days and today <= valid_until)", actor: system, preconditions: [], side_effects: ["AuditEvent STATUS_CHANGE"] }
      - { from: EXPIRING, to: EXPIRED, trigger: "system (regulatory sweep: today > valid_until)", actor: system, preconditions: [], side_effects: ["every EquivalencyGrant of this course with home_state_code == this.state_code and status ACTIVE -> SUSPENDED", "AuditEvent STATUS_CHANGE"] }
      - { from: EXPIRING, to: RENEWAL_PENDING, trigger: "POST /approvals/{id}/renew", actor: ComplianceOfficer, preconditions: [], side_effects: ["AuditEvent STATUS_CHANGE"] }
      - { from: EXPIRED, to: RENEWAL_PENDING, trigger: "POST /approvals/{id}/renew (late renewal)", actor: ComplianceOfficer, preconditions: ["today <= valid_until + 30 days (ERR_APPROVAL_RENEWAL_WINDOW_CLOSED)"], side_effects: ["AuditEvent STATUS_CHANGE"] }
      - { from: RENEWAL_PENDING, to: APPROVED, trigger: "POST /approvals/{id}/decide with decision=APPROVED", actor: StateCommission, preconditions: ["valid_from and valid_until supplied", "valid_until >= valid_from (ERR_INVALID_VALIDITY_WINDOW)"], side_effects: ["application_round += 1", "valid_from/valid_until/decided_at set", "every EquivalencyGrant of this course with home_state_code == this.state_code and status SUSPENDED -> ACTIVE", "AuditEvent STATUS_CHANGE"] }
      - { from: RENEWAL_PENDING, to: EXPIRED, trigger: "POST /approvals/{id}/decide with decision=DENIED", actor: StateCommission, preconditions: [], side_effects: ["decided_at set", "every EquivalencyGrant of this course with home_state_code == this.state_code and status ACTIVE -> SUSPENDED", "AuditEvent STATUS_CHANGE"] }

  - entity: InstructorApproval
    initial_state: PENDING
    terminal_states: [EXPIRED]
    note: "same cyclic shape as CourseApproval but on a different entity; no equivalency side effects"
    transitions:
      - { from: PENDING, to: APPROVED, trigger: "POST /instructor-approvals/{id}/decide with decision=APPROVED", actor: StateCommission, preconditions: ["valid_from and valid_until supplied", "valid_until >= valid_from (ERR_INVALID_VALIDITY_WINDOW)"], side_effects: ["valid_from/valid_until/decided_at set", "AuditEvent STATUS_CHANGE"] }
      - { from: PENDING, to: DENIED, trigger: "POST /instructor-approvals/{id}/decide with decision=DENIED", actor: StateCommission, preconditions: [], side_effects: ["decided_at set", "AuditEvent STATUS_CHANGE"] }
      - { from: DENIED, to: PENDING, trigger: "POST /instructor-approvals/{id}/resubmit", actor: Registrar, preconditions: [], side_effects: ["application_round += 1", "decided_at = null", "AuditEvent STATUS_CHANGE"] }
      - { from: APPROVED, to: EXPIRING, trigger: "system (regulatory sweep: valid_until - today <= 30 days and today <= valid_until)", actor: system, preconditions: [], side_effects: ["AuditEvent STATUS_CHANGE"] }
      - { from: EXPIRING, to: EXPIRED, trigger: "system (regulatory sweep: today > valid_until)", actor: system, preconditions: [], side_effects: ["AuditEvent STATUS_CHANGE"] }
      - { from: EXPIRING, to: RENEWAL_PENDING, trigger: "POST /instructor-approvals/{id}/renew", actor: Registrar, preconditions: [], side_effects: ["AuditEvent STATUS_CHANGE"] }
      - { from: EXPIRED, to: RENEWAL_PENDING, trigger: "POST /instructor-approvals/{id}/renew (late renewal)", actor: Registrar, preconditions: ["today <= valid_until + 30 days (ERR_APPROVAL_RENEWAL_WINDOW_CLOSED)"], side_effects: ["AuditEvent STATUS_CHANGE"] }
      - { from: RENEWAL_PENDING, to: APPROVED, trigger: "POST /instructor-approvals/{id}/decide with decision=APPROVED", actor: StateCommission, preconditions: ["valid_from and valid_until supplied", "valid_until >= valid_from (ERR_INVALID_VALIDITY_WINDOW)"], side_effects: ["application_round += 1", "valid_from/valid_until/decided_at set", "AuditEvent STATUS_CHANGE"] }
      - { from: RENEWAL_PENDING, to: EXPIRED, trigger: "POST /instructor-approvals/{id}/decide with decision=DENIED", actor: StateCommission, preconditions: [], side_effects: ["decided_at set", "AuditEvent STATUS_CHANGE"] }

  - entity: CourseOffering
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /offerings/{id}/publish"
        actor: SchoolDirector
        preconditions:
          - "school of the course has status LICENSED (ERR_SCHOOL_NOT_LICENSED)"
          - "school posture is GOOD_STANDING (ERR_SCHOOL_ON_PROBATION)"
          - "course status is ACTIVE (ERR_COURSE_NOT_ACTIVE)"
          - "course authorized in offering.state_code: CourseApproval(course, state_code).status == APPROVED OR an EquivalencyGrant (course, recognized_state_code == state_code) with status ACTIVE (ERR_COURSE_NOT_AUTHORIZED_IN_STATE)"
          - "InstructorApproval(instructor_id, state_code).status == APPROVED (ERR_INSTRUCTOR_NOT_APPROVED_IN_STATE)"
        side_effects: ["AuditEvent STATUS_CHANGE"]
      - from: PUBLISHED
        to: IN_SESSION
        trigger: "system (regulatory sweep: today >= start_date)"
        actor: system
        preconditions: []
        side_effects: ["AuditEvent STATUS_CHANGE"]
      - from: IN_SESSION
        to: COMPLETED
        trigger: "system (regulatory sweep: today > end_date)"
        actor: system
        preconditions: []
        side_effects: ["AuditEvent STATUS_CHANGE"]
      - from: PUBLISHED
        to: CANCELLED
        trigger: "POST /offerings/{id}/cancel"
        actor: SchoolDirector
        preconditions: []
        side_effects:
          - "CASCADE L1: every Enrollment of this offering with academic_status IN {ENROLLED, IN_PROGRESS, SEAT_TIME_MET, EXAM_PASSED} -> WITHDRAWN with withdrawal_reason=SCHOOL_CANCELLED, withdrawn_at=now (EXAM_PASSED enrollments have no certificate yet — certificate issuance requires EXAM_PASSED and is blocked once WITHDRAWN)"
          - "CASCADE L2: for each such enrollment with payment_status == PAID, a RefundRequest is auto-created (status PENDING, reason SCHOOL_CANCELLED, scheduled=statutory=granted=paid_cents); payment_status == PENDING enrollments flip to VOIDED"
          - "CASCADE L3: enrolled_count and seats_available recomputed on this offering (each withdrawal decrements enrolled_count)"
          - "AuditEvent CASCADED_CANCELLATION on the offering and STATUS_CHANGE per enrollment"
      - from: IN_SESSION
        to: CANCELLED
        trigger: "POST /offerings/{id}/cancel"
        actor: SchoolDirector
        preconditions: []
        side_effects: ["same L1-L3 cascade as PUBLISHED -> CANCELLED"]
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /offerings/{id}/cancel"
        actor: SchoolDirector
        preconditions: []
        side_effects: ["AuditEvent STATUS_CHANGE"]

  - entity: Enrollment
    initial_state: ENROLLED
    terminal_states: [WITHDRAWN, FAILED, EXPIRED]
    note: "parallel dimensions: academic_status (this machine) x payment_status (PENDING -> PAID -> PARTIALLY_REFUNDED|REFUNDED; PENDING -> VOIDED on withdrawal) evolve independently; COMPLETED is a non-terminal apex state because exam invalidation regresses it to SEAT_TIME_MET"
    transitions:
      - { from: ENROLLED, to: IN_PROGRESS, trigger: "system (first VERIFIED AttendanceRecord created)", actor: system, preconditions: [], side_effects: ["AuditEvent STATUS_CHANGE"] }
      - { from: IN_PROGRESS, to: SEAT_TIME_MET, trigger: "system (creditable_seat_minutes >= course.required_seat_minutes after attendance create; >= is inclusive, equality qualifies)", actor: system, preconditions: [], side_effects: ["AuditEvent STATUS_CHANGE"] }
      - { from: SEAT_TIME_MET, to: IN_PROGRESS, trigger: "system (attendance void drops creditable_seat_minutes below required_seat_minutes)", actor: system, preconditions: [], side_effects: ["AuditEvent STATUS_CHANGE"], note: "regression loop IN_PROGRESS <-> SEAT_TIME_MET" }
      - { from: SEAT_TIME_MET, to: EXAM_PASSED, trigger: "system (ExamAttempt scored with outcome PASSED)", actor: system, preconditions: [], side_effects: ["AuditEvent STATUS_CHANGE"] }
      - { from: EXAM_PASSED, to: SEAT_TIME_MET, trigger: "system (the passing ExamAttempt is INVALIDATED)", actor: system, preconditions: [], side_effects: ["AuditEvent STATUS_CHANGE"], note: "regression loop SEAT_TIME_MET <-> EXAM_PASSED; enrollment is again exam-eligible" }
      - { from: EXAM_PASSED, to: COMPLETED, trigger: "POST /enrollments/{id}/certificate", actor: Registrar, preconditions: ["academic_status == EXAM_PASSED (ERR_ENROLLMENT_STATE_INVALID); uniqueness is implied since issuance moves the enrollment to COMPLETED"], side_effects: ["Certificate created (status ACTIVE, number assigned, hours pinned)", "AuditEvent STATUS_CHANGE + CERTIFICATE_ISSUED"] }
      - { from: COMPLETED, to: SEAT_TIME_MET, trigger: "system (the passing ExamAttempt is INVALIDATED)", actor: system, preconditions: [], side_effects: ["CASCADE: the enrollment's Certificate -> REVOKED with revoked_reason='EXAM_INVALIDATED'", "AuditEvent STATUS_CHANGE + CASCADED_REVOCATION"], note: "regression out of terminal COMPLETED; certificate revocation itself cascades to credit-report amendment drafting" }
      - { from: SEAT_TIME_MET, to: FAILED, trigger: "system (ExamAttempt scored outcome FAILED AND exam_attempts_used == course.max_exam_attempts)", actor: system, preconditions: [], side_effects: ["AuditEvent STATUS_CHANGE"] }
      - { from: ENROLLED, to: WITHDRAWN, trigger: "POST /enrollments/{id}/withdraw", actor: "Registrar or Student (self)", preconditions: ["reason IN {VOLUNTARY, ADMINISTRATIVE} (ERR_WITHDRAWAL_REASON_INVALID)"], side_effects: ["withdrawal side effects W1-W3 (see note)"] }
      - { from: IN_PROGRESS, to: WITHDRAWN, trigger: "POST /enrollments/{id}/withdraw", actor: "Registrar or Student (self)", preconditions: ["reason IN {VOLUNTARY, ADMINISTRATIVE}"], side_effects: ["withdrawal side effects W1-W3"] }
      - { from: SEAT_TIME_MET, to: WITHDRAWN, trigger: "POST /enrollments/{id}/withdraw", actor: "Registrar or Student (self)", preconditions: ["reason IN {VOLUNTARY, ADMINISTRATIVE}"], side_effects: ["withdrawal side effects W1-W3"] }
      - { from: ENROLLED, to: EXPIRED, trigger: "system (regulatory sweep: today > deadline_date)", actor: system, preconditions: [], side_effects: ["AuditEvent STATUS_CHANGE"] }
      - { from: IN_PROGRESS, to: EXPIRED, trigger: "system (regulatory sweep: today > deadline_date)", actor: system, preconditions: [], side_effects: ["AuditEvent STATUS_CHANGE"] }
      - { from: SEAT_TIME_MET, to: EXPIRED, trigger: "system (regulatory sweep: today > deadline_date)", actor: system, preconditions: [], side_effects: ["AuditEvent STATUS_CHANGE"] }
      - { from: EXAM_PASSED, to: EXPIRED, trigger: "system (regulatory sweep: today > deadline_date)", actor: system, preconditions: [], side_effects: ["AuditEvent STATUS_CHANGE"] }
    withdrawal_side_effects_note: |
      W1: withdrawn_at=now (or effective_date when supplied), withdrawal_reason set.
      W2: if payment_status == PAID, auto-create RefundRequest (PENDING) with
          completion_fraction_bps_at_withdrawal frozen and scheduled/statutory/granted
          computed; if payment_status == PENDING, payment_status -> VOIDED (no RefundRequest).
      W3: offering enrolled_count/seats_available recomputed.

  - entity: ExamAttempt
    initial_state: SCHEDULED
    terminal_states: [SCORED, NO_SHOW, INVALIDATED]
    transitions:
      - { from: SCHEDULED, to: PROCTORED, trigger: "POST /exam-attempts/{id}/verify", actor: Proctor, preconditions: ["X-User-ID == proctor_instructor_id (ERR_FORBIDDEN_SCOPE)"], side_effects: ["verified_at set", "AuditEvent STATUS_CHANGE"] }
      - { from: PROCTORED, to: SCORED, trigger: "POST /exam-attempts/{id}/score", actor: Instructor, preconditions: ["X-User-ID == offering.instructor_id (ERR_FORBIDDEN_SCOPE)", "0 <= score_pct <= 100 (ERR_SCORE_OUT_OF_RANGE)"], side_effects: ["outcome computed (PASSED when score_pct >= course.pass_score_pct, inclusive)", "scored_at set", "if PASSED: enrollment SEAT_TIME_MET -> EXAM_PASSED", "if FAILED and exam_attempts_used == course.max_exam_attempts: enrollment SEAT_TIME_MET -> FAILED", "AuditEvent STATUS_CHANGE"] }
      - { from: SCHEDULED, to: NO_SHOW, trigger: "system (regulatory sweep: now > scheduled_at + 24h)", actor: system, preconditions: [], side_effects: ["AuditEvent STATUS_CHANGE"], note: "NO_SHOW consumes an attempt (counts in exam_attempts_used)" }
      - { from: SCHEDULED, to: INVALIDATED, trigger: "POST /exam-attempts/{id}/invalidate", actor: "Proctor (assigned) or SchoolDirector", preconditions: [], side_effects: ["invalidation_reason set", "attempt_number slots of INVALIDATED attempts are excluded from exam_attempts_used", "AuditEvent STATUS_CHANGE"] }
      - { from: PROCTORED, to: INVALIDATED, trigger: "POST /exam-attempts/{id}/invalidate", actor: "Proctor (assigned) or SchoolDirector", preconditions: [], side_effects: ["as SCHEDULED -> INVALIDATED"] }
      - { from: SCORED, to: INVALIDATED, trigger: "POST /exam-attempts/{id}/invalidate", actor: "Proctor (assigned) or SchoolDirector", preconditions: [], side_effects: ["CASCADE L1: if outcome was PASSED, enrollment EXAM_PASSED -> SEAT_TIME_MET or COMPLETED -> SEAT_TIME_MET", "CASCADE L2: on COMPLETED regression the enrollment's Certificate ACTIVE -> REVOKED (revoked_reason='EXAM_INVALIDATED')", "CASCADE L3: the certificate revocation fires the report-amendment cascade (see Certificate machine)", "AuditEvent STATUS_CHANGE + CASCADED_REVOCATION"] }

  - entity: Certificate
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - { from: ACTIVE, to: REVOKED, trigger: "POST /certificates/{id}/revoke OR system (exam-invalidation cascade)", actor: "StateCommission, SchoolDirector, or system", preconditions: [], side_effects: ["revoked_reason/revoked_at set", "CASCADE: for every CreditReport with status ACKNOWLEDGED whose line_items reference this certificate AND which has no existing DRAFT/SUBMITTED amendment, auto-create an amendment CreditReport (status DRAFT, amendment_of_id = that report, line_items = the revoked certificate's line(s) with credit_hours negated, total_credit_hours negative)", "AuditEvent CASCADED_REVOCATION"] }

  - entity: RefundRequest
    initial_state: PENDING
    terminal_states: [PAID, DENIED]
    transitions:
      - { from: PENDING, to: APPROVED, trigger: "POST /refund-requests/{id}/approve", actor: SchoolDirector, preconditions: [], side_effects: ["decided_at set", "AuditEvent STATUS_CHANGE"] }
      - { from: PENDING, to: DENIED, trigger: "POST /refund-requests/{id}/deny", actor: SchoolDirector, preconditions: ["denial_reason supplied (ERR_INVALID_REQUEST)"], side_effects: ["decided_at set", "enrollment payment_status unchanged (stays PAID)", "AuditEvent STATUS_CHANGE"] }
      - { from: APPROVED, to: PAID, trigger: "POST /refund-requests/{id}/pay", actor: Registrar, preconditions: [], side_effects: ["paid_at set", "enrollment.retained_cents = paid_cents - granted_refund_cents", "enrollment.payment_status -> REFUNDED when granted_refund_cents == paid_cents else PARTIALLY_REFUNDED", "AuditEvent STATUS_CHANGE"] }

  - entity: CreditReport
    initial_state: DRAFT
    terminal_states: [ACKNOWLEDGED]
    note: "correction cycle SUBMITTED -> REJECTED -> DRAFT -> SUBMITTED; submission_count monotonically increases"
    transitions:
      - { from: DRAFT, to: SUBMITTED, trigger: "POST /credit-reports/{id}/submit", actor: ComplianceOfficer, preconditions: [], side_effects: ["submitted_at = now", "late_days and late_fee_cents computed", "submission_count += 1", "AuditEvent STATUS_CHANGE"] }
      - { from: SUBMITTED, to: ACKNOWLEDGED, trigger: "POST /credit-reports/{id}/acknowledge", actor: StateCommission, preconditions: [], side_effects: ["AuditEvent STATUS_CHANGE"] }
      - { from: SUBMITTED, to: REJECTED, trigger: "POST /credit-reports/{id}/reject", actor: StateCommission, preconditions: ["reason supplied (ERR_INVALID_REQUEST)"], side_effects: ["AuditEvent STATUS_CHANGE"] }
      - { from: REJECTED, to: DRAFT, trigger: "POST /credit-reports/{id}/revise", actor: ComplianceOfficer, preconditions: [], side_effects: ["line_items and total_credit_hours recomputed from current certificate states", "submitted_at = null", "AuditEvent STATUS_CHANGE"] }

  - entity: EquivalencyGrant
    initial_state: ACTIVE
    terminal_states: [REVOKED, SUPERSEDED]
    transitions:
      - { from: ACTIVE, to: SUSPENDED, trigger: "system (source CourseApproval(course_id, home_state_code) leaves APPROVED -> EXPIRED)", actor: system, preconditions: [], side_effects: ["AuditEvent STATUS_CHANGE"] }
      - { from: SUSPENDED, to: ACTIVE, trigger: "system (source CourseApproval returns to APPROVED via renewal approval)", actor: system, preconditions: [], side_effects: ["AuditEvent STATUS_CHANGE"], note: "auto-resume loop ACTIVE <-> SUSPENDED" }
      - { from: ACTIVE, to: REVOKED, trigger: "POST /equivalency-grants/{id}/revoke", actor: "StateCommission or ComplianceOfficer", preconditions: [], side_effects: ["AuditEvent STATUS_CHANGE"] }
      - { from: SUSPENDED, to: REVOKED, trigger: "POST /equivalency-grants/{id}/revoke", actor: "StateCommission or ComplianceOfficer", preconditions: [], side_effects: ["AuditEvent STATUS_CHANGE"] }
      - { from: ACTIVE, to: SUPERSEDED, trigger: "system (a new EquivalencyGrant created for the same (course_id, home_state_code, recognized_state_code))", actor: system, preconditions: [], side_effects: ["AuditEvent STATUS_CHANGE"] }
      - { from: SUSPENDED, to: SUPERSEDED, trigger: "system (a new EquivalencyGrant created for the same (course_id, home_state_code, recognized_state_code))", actor: system, preconditions: [], side_effects: ["AuditEvent STATUS_CHANGE"] }

# =============================================================================
# Table 1.2.1: Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: offering-update-stale-version
    parent_entity: CourseOffering
    write_endpoint: "PUT /offerings/{id}"
    occ_field: "expected_offering_version"
    description: |
      Updating a CourseOffering (reschedule or capacity change) is rejected when
      expected_offering_version does not match the offering's current version,
      because another writer has modified the offering since the client last
      observed it and the client's edit would silently overwrite that change.
    error_id: ERR_STALE_OFFERING_VERSION
    http_status: 412
  - rule_id: grant-create-stale-course
    parent_entity: Course
    write_endpoint: "POST /equivalency-grants"
    occ_field: "expected_course_version"
    description: |
      Creating an EquivalencyGrant supersedes any existing ACTIVE/SUSPENDED grant
      for the same (course_id, home_state_code, recognized_state_code); the create
      is rejected when expected_course_version does not match the course's current
      version, because another writer's grant creation has already superseded the
      grant state the client observed.
    error_id: ERR_STALE_COURSE_VERSION
    http_status: 412
  - rule_id: report-amendment-stale-version
    parent_entity: CreditReport
    write_endpoint: "POST /credit-reports/{id}/amendments"
    occ_field: "expected_credit_report_version"
    description: |
      Creating an amendment against an ACKNOWLEDGED CreditReport is rejected when
      expected_credit_report_version does not match the report's current version,
      because the report has changed (e.g. another amendment was created against
      it) since the client last observed it.
    error_id: ERR_STALE_CREDIT_REPORT_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: creditable_seat_minutes
    trigger: "AttendanceRecord create or void on an enrollment"
    algorithm: chronological
    formula: |
      Process the enrollment's AttendanceRecords with status == VERIFIED in
      chronological order (session_date ASC, ties broken by created_at ASC),
      keeping a per-calendar-day running total:
        for each record: credited = min(record.minutes, max(0, DAILY_CREDIT_CAP_MINUTES - day_total[record.session_date]))
        day_total[record.session_date] += credited
        creditable_seat_minutes = sum of credited over all records
      verified_seat_minutes = sum of record.minutes over VERIFIED records (raw, uncapped)
      completion_fraction_bps = round_half_up(creditable_seat_minutes * 10000 / course.required_seat_minutes) to integer
      Recomputed in full after every create/void; then the enrollment auto-transitions
      IN_PROGRESS -> SEAT_TIME_MET when creditable_seat_minutes >= required_seat_minutes,
      and regresses SEAT_TIME_MET -> IN_PROGRESS when a void drops it below.
    input_set: "AttendanceRecords of the enrollment with status VERIFIED; VOID records excluded"
    constants:
      DAILY_CREDIT_CAP_MINUTES: 480
    precision: "integer minutes; fraction in integer bps, round_half_up"
    variants:
      - name: raw_vs_creditable
        when: "verified_seat_minutes vs creditable_seat_minutes on the same data"
        difference: "a single 500-minute day contributes 500 to verified but only 480 to creditable; the two fields diverge whenever any day exceeds the cap"

  - name: refund_scheduled_cents
    trigger: "withdrawal auto-creating a RefundRequest"
    algorithm: tiered_pricing
    formula: |
      Let f = enrollment.completion_fraction_bps_at_withdrawal (integer bps), T = enrollment.paid_cents.
      Branch on withdrawal reason first:
        SCHOOL_CANCELLED: refund = T                      (100%, no admin fee)
        ADMINISTRATIVE:   pct = tier_pct(f); refund = round_half_up(T * pct)          (admin fee waived)
        VOLUNTARY:        pct = tier_pct(f); refund = max(0, round_half_up(T * pct) - ADMIN_FEE_CENTS)
      tier_pct(f) — boundaries are inclusive on the LOWER refund tier:
        f <= 1000  -> 0.90
        f <= 2500  -> 0.75
        f <= 5000  -> 0.50
        f >  5000  -> 0.00
    input_set: "the withdrawing enrollment (paid_cents, completion_fraction_bps_at_withdrawal, withdrawal_reason)"
    constants:
      ADMIN_FEE_CENTS: 5000
    precision: "integer cents; tier percentage applied with round_half_up to integer cents BEFORE fee subtraction"
    variants:
      - name: scheduled_vs_statutory
        when: "same withdrawal inputs"
        difference: "scheduled uses the published tier table on completion fraction; statutory uses daily pro-rata — e.g. T=50000, f=1000, VOLUNTARY gives scheduled 40000 vs statutory 29000; granted = max of the two"

  - name: refund_statutory_cents
    trigger: "withdrawal auto-creating a RefundRequest"
    algorithm: tiered_pricing
    formula: |
      Daily pro-rata with NESTED ROUNDING — rounding order is pinned and MUST NOT be changed:
        total_days    = (offering.end_date - offering.start_date).days + 1
        elapsed_days  = clamp((withdrawal calendar date - offering.start_date).days + 1, 0, total_days)
        daily_rate    = round_half_up(enrollment.paid_cents / total_days)      # ROUND FIRST, to integer cents
        earned_cents  = daily_rate * elapsed_days                              # exact integer multiply, NO further rounding
        statutory     = max(0, enrollment.paid_cents - earned_cents - STATUTORY_ADMIN_FEE_CENTS)
      Rounding the daily rate before multiplying (vs rounding only at the end) changes the
      result — e.g. paid 50000 over total_days 3 with elapsed 2: pinned order gives
      daily_rate 16667 -> earned 33334 -> statutory 15666; round-at-end would give 15667.
    input_set: "the withdrawing enrollment (paid_cents) and its offering window (start_date, end_date) plus withdrawal calendar date"
    constants:
      STATUTORY_ADMIN_FEE_CENTS: 1000
    precision: "integer cents; round_half_up at exactly the pinned step"

  - name: granted_refund_cents
    trigger: "RefundRequest creation"
    algorithm: aggregation
    formula: |
      granted_refund_cents = max(scheduled_refund_cents, statutory_refund_cents)
      The student always receives the greater of the published-schedule and statutory refunds.
    input_set: "the RefundRequest's two computed variants"
    precision: "integer cents"

  - name: order_total_cents
    trigger: "enrollment creation"
    algorithm: tiered_pricing
    formula: |
      Circular-looking dependency (fee tier is keyed on the charge the fee feeds into) —
      evaluation order is PINNED, computed once in this exact order:
        1. scholarship_applied = min(enrollment.scholarship_cents, floor(course.tuition_cents / 2))
        2. discounted_tuition  = course.tuition_cents - scholarship_applied
        3. registration_fee    = 2500 if discounted_tuition >= 100000 else 1500   # tier keyed on DISCOUNTED tuition, not on the final total
        4. charge_total_cents  = discounted_tuition + registration_fee
      Examples: tuition 50000 + scholarship 30000 -> cap 25000 -> discounted 25000 -> fee 1500 -> total 26500;
      tuition 150000 + scholarship 0 -> discounted 150000 -> fee 2500 -> total 152500.
    input_set: "course.tuition_cents and enrollment.scholarship_cents at creation; pinned for the enrollment's lifetime"
    constants:
      REGISTRATION_FEE_HIGH_CENTS: 2500
      REGISTRATION_FEE_LOW_CENTS: 1500
      FEE_TIER_THRESHOLD_CENTS: 100000
    precision: "integer cents; floor() for the scholarship cap"

  - name: pass_rate_bps
    trigger: "regulatory sweep school evaluation (trailing 90-day window ending today) and GET /schools/{id}/pass-rate-summary"
    algorithm: threshold
    formula: |
      Window W = [today - 90 days, today] (both inclusive).
      first_set = ExamAttempts of the school with attempt_number == 1 AND status == SCORED AND scored_at date in W
      all_set   = ExamAttempts of the school with status == SCORED AND scored_at date in W
      first_attempt_pass_rate_bps = round_half_up(count(first_set with outcome PASSED) * 10000 / count(first_set))  # null when count == 0
      all_attempts_pass_rate_bps  = round_half_up(count(all_set with outcome PASSED) * 10000 / count(all_set))      # null when count == 0
      Posture rule (sweep only):
        count(first_set) >= 10 AND first_attempt_pass_rate_bps < school.pass_rate_threshold_bps -> PROBATION
        count(first_set) >= 10 AND first_attempt_pass_rate_bps >= threshold -> GOOD_STANDING
        count(first_set) < 10 -> posture unchanged (small-sample suppression)
      Boundary: equality with the threshold does NOT trigger probation (<, not <=).
    input_set: "ExamAttempts of the school's enrollments; NO_SHOW and INVALIDATED attempts excluded from both sets"
    constants:
      PASS_RATE_WINDOW_DAYS: 90
      PASS_RATE_MIN_ATTEMPTS: 10
    precision: "integer bps, round_half_up"
    variants:
      - name: first_attempt_vs_all_attempts
        when: "same scoring data"
        difference: "FIRST_ATTEMPT counts attempt_number == 1 only; ALL_ATTEMPTS includes retakes — e.g. 10 first attempts with 5 passes plus 5 retakes with 4 passes gives first 5000 bps vs all 6000 bps; probation keys on FIRST_ATTEMPT only"

  - name: late_fee_cents
    trigger: "CreditReport submit"
    algorithm: threshold
    formula: |
      late_days = max(0, (submit calendar date - reporting_deadline_date).days)
      late_fee_cents = 0 when late_days == 0
                       min(LATE_FEE_CAP_CENTS, LATE_FEE_BASE_CENTS + LATE_FEE_PER_DAY_CENTS * late_days) when late_days >= 1
      Boundary: submitting exactly on reporting_deadline_date yields late_days == 0 and no fee;
      the cap binds from late_days == 45 upward (5000 + 1000*45 = 50000 == cap).
    input_set: "the CreditReport's reporting_deadline_date and the clock date at submit"
    constants:
      LATE_FEE_BASE_CENTS: 5000
      LATE_FEE_PER_DAY_CENTS: 1000
      LATE_FEE_CAP_CENTS: 50000
      REPORTING_DEADLINE_DAYS: 30
    precision: "integer cents and integer days"

  - name: enrolled_count_seats
    trigger: "enrollment create, withdrawal, expiry, FAILED transition, offering cancel cascade, capacity update"
    algorithm: aggregation
    formula: |
      enrolled_count   = count of the offering's enrollments with academic_status NOT IN {WITHDRAWN, FAILED, EXPIRED}
      seats_available  = capacity - enrolled_count
      INVARIANT: capacity == enrolled_count + seats_available at all times.
    input_set: "all enrollments of the offering"
    precision: "integer"

  - name: exam_attempts_used
    trigger: "ExamAttempt create, score, invalidate, NO_SHOW sweep"
    algorithm: aggregation
    formula: |
      exam_attempts_used = count of the enrollment's ExamAttempts with status IN {SCHEDULED, PROCTORED, SCORED, NO_SHOW}
      INVALIDATED attempts do NOT consume a slot. attempt_number of a new attempt = exam_attempts_used + 1.
      Creation is rejected when exam_attempts_used >= course.max_exam_attempts (ERR_EXAM_ATTEMPTS_EXHAUSTED):
      with max 2, attempt_number 2 is allowed and a third attempt is rejected.
    input_set: "all ExamAttempts of the enrollment"
    precision: "integer"

  - name: certificate_number_assignment
    trigger: "certificate issuance"
    algorithm: aggregation
    formula: |
      seq = count of ALL certificates ever issued by the school in the issue calendar year
            (statuses ACTIVE and REVOKED both counted; revocation never frees a number) + 1
      certificate_number = school.school_code + "-" + issue_year + "-" + zero_pad(seq, 4)
      INVARIANT: certificates_issued_total(year) == count(ACTIVE, year) + count(REVOKED, year); numbers are never reused.
    input_set: "certificates of the school with issue_date in the issue calendar year"
    precision: "integer sequence"

  - name: credit_report_line_totals
    trigger: "CreditReport creation (base or amendment) and revise recompute"
    algorithm: aggregation
    formula: |
      Base report at creation: line per certificate of the school with status ACTIVE at creation time,
      issue_date within [period_start, period_end] (inclusive both ends), credit_hours_pinned > 0:
        line.credit_hours = round_half_up(certificate.credit_hours_pinned * 2) / 2     # per-line rounding to nearest 0.5
      Amendment report at creation: lines of the parent report whose certificate is REVOKED at amendment time,
      with credit_hours negated (already-rounded values negated, no re-rounding).
      total_credit_hours = sum of line.credit_hours AFTER per-line rounding (round per line, THEN sum — order pinned;
      summing raw hours then rounding yields different results, e.g. lines 7.24 + 0.24 round to 7.0 + 0.0 = 7.0 vs raw-sum 7.48 -> 7.5).
      Line ordering: certificate issue_date ASC, tie-break certificate created_at ASC.
    input_set: "base: ACTIVE certificates of the school in window; amendment: parent report lines"

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority; lower number wins
# when a single request violates several rules)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers present; X-User-Role is a declared role; for entity_backed roles (Student, Instructor, Proctor) X-User-ID must reference an existing entity of the backing type", error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http_status: 400, applies_to: "all endpoints" }
  - { priority: 2, category: auth, check: "X-User-Role is listed in the endpoint's roles", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all endpoints" }
  - { priority: 3, category: business_constraint, check: "Request shape: required fields present, unknown fields rejected, enums valid, integers in range (minutes 1..1440, score_pct 0..100, capacity >= 1, scholarship_cents >= 0), ISO dates parseable; pagination limit 1..100 and offset >= 0", error_id: "ERR_INVALID_REQUEST | ERR_INVALID_ENUM | ERR_SCORE_OUT_OF_RANGE | ERR_ATTENDANCE_MINUTES_INVALID | ERR_INVALID_PAGINATION_PARAMETERS", http_status: 400, applies_to: "all endpoints" }
  - { priority: 4, category: existence, check: "Path ids exist, validated left-to-right; body-supplied FK references (school_id, course_id, offering_id, student_id, instructor_id, proctor_instructor_id) must exist", error_id: "ERR_<RESOURCE>_NOT_FOUND", http_status: 404, applies_to: "all endpoints" }
  - { priority: 5, category: auth, check: "Scope/ownership: SchoolDirector only on schools with director_user_id == X-User-ID and their descendant resources; Student only on own records (student_id == X-User-ID); Instructor only on offerings where instructor_id == X-User-ID; Proctor only on attempts where proctor_instructor_id == X-User-ID. Immediately after scope, OCC-guarded endpoints evaluate expected_*_version against the parent's current version (ERR_STALE_*, 412) BEFORE any state or business rule", error_id: "ERR_FORBIDDEN_SCOPE | ERR_STALE_OFFERING_VERSION | ERR_STALE_COURSE_VERSION | ERR_STALE_CREDIT_REPORT_VERSION", http_status: "403 for scope; 412 for OCC mismatch", applies_to: "scoped endpoints; OCC endpoints (PUT /offerings/{id}, POST /equivalency-grants, POST /credit-reports/{id}/amendments)" }
  - { priority: 6, category: state, check: "Target resource (and gated cross-entity parents) in a valid state for the operation: school LICENSED where required (ERR_SCHOOL_NOT_LICENSED / ERR_SCHOOL_TERMINAL), course ACTIVE (ERR_COURSE_NOT_ACTIVE), offering PUBLISHED for enrollment (ERR_OFFERING_NOT_OPEN), enrollment in a withdrawable/payable state (ERR_ENROLLMENT_STATE_INVALID), enrollment SEAT_TIME_MET for attempt creation (ERR_SEAT_TIME_NOT_MET), attempt in correct lifecycle state (ERR_EXAM_ATTEMPT_STATE_INVALID), approval PENDING/RENEWAL_PENDING for decide and DENIED for resubmit and EXPIRING/EXPIRED for renew (ERR_APPROVAL_STATE_INVALID), refund PENDING for approve/deny and APPROVED for pay (ERR_REFUND_STATE_INVALID), report DRAFT for submit, SUBMITTED for acknowledge/reject, REJECTED for revise, ACKNOWLEDGED for amendments (ERR_REPORT_STATE_INVALID), grant ACTIVE/SUSPENDED for revoke (ERR_GRANT_STATE_INVALID), course activation requires an APPROVED approval (ERR_COURSE_NOT_APPROVED_ANYWHERE), retire requires no open offerings (ERR_COURSE_HAS_OPEN_OFFERINGS)", error_id: "ERR_SCHOOL_NOT_LICENSED | ERR_SCHOOL_TERMINAL | ERR_COURSE_NOT_ACTIVE | ERR_OFFERING_NOT_OPEN | ERR_ENROLLMENT_STATE_INVALID | ERR_SEAT_TIME_NOT_MET | ERR_EXAM_ATTEMPT_STATE_INVALID | ERR_APPROVAL_STATE_INVALID | ERR_REFUND_STATE_INVALID | ERR_REPORT_STATE_INVALID | ERR_GRANT_STATE_INVALID | ERR_COURSE_NOT_APPROVED_ANYWHERE | ERR_COURSE_HAS_OPEN_OFFERINGS", http_status: 409, applies_to: "state-transition and state-gated endpoints" }
  - { priority: 7, category: business_safety, check: "Regulatory safety: school posture GOOD_STANDING for course-approval submissions/renewals and offering publish (ERR_SCHOOL_ON_PROBATION); segregation of duties — proctor_instructor_id MUST NOT equal the offering's instructor_id (ERR_PROCTOR_IS_INSTRUCTOR)", error_id: "ERR_SCHOOL_ON_PROBATION | ERR_PROCTOR_IS_INSTRUCTOR", http_status: 422, applies_to: "POST /courses/{id}/approvals, POST /approvals/{id}/renew, POST /offerings/{id}/publish, POST /enrollments/{id}/exam-attempts" }
  - { priority: 8, category: business_temporal, check: "Temporal windows and overlaps: offering end_date >= start_date and start_date >= today at create/update (ERR_INVALID_OFFERING_WINDOW); student MUST NOT hold another enrollment with academic_status NOT IN {WITHDRAWN, FAILED, EXPIRED} whose offering window overlaps under half-open semantics [start_date, end_date) — adjacency (one ends the day the other starts... i.e. new.start >= existing.end OR new.end <= existing.start) is allowed (ERR_STUDENT_SCHEDULE_CONFLICT); instructor's non-CANCELLED offerings require one full rest day between windows: conflict unless new.start_date >= existing.end_date + 2 days OR new.end_date + 2 days <= existing.start_date (ERR_INSTRUCTOR_SCHEDULE_CONFLICT) — e.g. an offering ending 2026-09-10 blocks a new start on 2026-09-11 but allows 2026-09-12; proctor MUST NOT hold another attempt with status IN {SCHEDULED, PROCTORED} on the same calendar date (ERR_PROCTOR_SCHEDULE_CONFLICT); attendance session_date within [offering.start_date, offering.end_date] (ERR_ATTENDANCE_OUT_OF_WINDOW); report period_end >= period_start (ERR_REPORT_WINDOW_INVALID); base (non-amendment) reports of one school MUST NOT have overlapping [period_start, period_end] under CLOSED-interval semantics — adjacency (a.period_end == b.period_start) IS a conflict (ERR_REPORT_PERIOD_OVERLAP); late renewal only within 30 days after valid_until (ERR_APPROVAL_RENEWAL_WINDOW_CLOSED); decide requires valid_until >= valid_from (ERR_INVALID_VALIDITY_WINDOW)", error_id: "ERR_INVALID_OFFERING_WINDOW | ERR_STUDENT_SCHEDULE_CONFLICT | ERR_INSTRUCTOR_SCHEDULE_CONFLICT | ERR_PROCTOR_SCHEDULE_CONFLICT | ERR_ATTENDANCE_OUT_OF_WINDOW | ERR_REPORT_WINDOW_INVALID | ERR_REPORT_PERIOD_OVERLAP | ERR_APPROVAL_RENEWAL_WINDOW_CLOSED | ERR_INVALID_VALIDITY_WINDOW", http_status: "409 for *_SCHEDULE_CONFLICT and ERR_REPORT_PERIOD_OVERLAP; 422 for window/domain errors", applies_to: "offering create/update, enrollment create, attempt create, attendance create, report create, approval renew/decide" }
  - { priority: 9, category: business_referential, check: "Referenced-entity state coherence: course authorized in offering.state_code via APPROVED CourseApproval or ACTIVE EquivalencyGrant (ERR_COURSE_NOT_AUTHORIZED_IN_STATE); InstructorApproval(instructor, state) APPROVED (ERR_INSTRUCTOR_NOT_APPROVED_IN_STATE); grant source CourseApproval(course, home_state_code) APPROVED (ERR_SOURCE_APPROVAL_NOT_APPROVED). Within this priority the evaluation order is pinned: course authorization, then instructor approval, then grant source approval", error_id: "ERR_COURSE_NOT_AUTHORIZED_IN_STATE | ERR_INSTRUCTOR_NOT_APPROVED_IN_STATE | ERR_SOURCE_APPROVAL_NOT_APPROVED", http_status: 422, applies_to: "POST /offerings/{id}/publish, POST /equivalency-grants" }
  - { priority: 10, category: business_constraint, check: "Uniqueness, capacity, and count limits: school_code globally unique (ERR_DUPLICATE_SCHOOL_CODE); course_code unique per school (ERR_DUPLICATE_COURSE_CODE); student email unique per school case-insensitive (ERR_DUPLICATE_STUDENT_EMAIL); instructor license_number unique per school (ERR_DUPLICATE_INSTRUCTOR_LICENSE); one CourseApproval/InstructorApproval per (parent, state_code) (ERR_APPROVAL_ALREADY_EXISTS); offering seats_available >= 1 at enrollment (ERR_OFFERING_FULL); exam_attempts_used < max_exam_attempts (ERR_EXAM_ATTEMPTS_EXHAUSTED); updated capacity >= enrolled_count (ERR_CAPACITY_BELOW_ENROLLED); grant home_state_code != recognized_state_code (ERR_GRANT_SAME_STATE); withdrawal reason IN {VOLUNTARY, ADMINISTRATIVE} (ERR_WITHDRAWAL_REASON_INVALID)", error_id: "ERR_DUPLICATE_SCHOOL_CODE | ERR_DUPLICATE_COURSE_CODE | ERR_DUPLICATE_STUDENT_EMAIL | ERR_DUPLICATE_INSTRUCTOR_LICENSE | ERR_APPROVAL_ALREADY_EXISTS | ERR_OFFERING_FULL | ERR_EXAM_ATTEMPTS_EXHAUSTED | ERR_CAPACITY_BELOW_ENROLLED | ERR_GRANT_SAME_STATE | ERR_WITHDRAWAL_REASON_INVALID", http_status: "409 for duplicate/capacity/count errors; 400 for ERR_WITHDRAWAL_REASON_INVALID", applies_to: "create endpoints, PUT /offerings/{id}, POST /enrollments/{id}/withdraw" }
  - { priority: 11, category: business_fiscal, check: "Money: pay amount_cents MUST equal charge_total_cents exactly (ERR_PAYMENT_AMOUNT_MISMATCH); refund amounts are system-computed only (client-supplied amounts rejected as unknown fields)", error_id: ERR_PAYMENT_AMOUNT_MISMATCH, http_status: 422, applies_to: "POST /enrollments/{id}/pay" }

# =============================================================================
# Table 1.5: API Endpoint Table
# staff4 = StateCommission, SchoolDirector, Registrar, ComplianceOfficer
# Every mutating endpoint additionally appends an AuditEvent (omitted from
# per-endpoint side_effects for brevity; declared once here).
# =============================================================================
endpoints:
  # --- system / test-driving ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical UTC clock. Before any call, the clock reads exactly 2026-08-01T00:00:00Z (server startup default; never falls back to wall-clock time).", roles: [ComplianceOfficer], code: 200, input: [to_iso8601], output: "{ current_utc: datetime }", side_effects: ["all date arithmetic ('today') now evaluates against the new clock"] }
  - { method: POST, path: "/_admin/run-regulatory-sweep", description: "Advance the regulatory epoch in pinned order: (1) APPROVED approvals within 30 days of valid_until -> EXPIRING; EXPIRING past valid_until -> EXPIRED (course approvals cascade grants ACTIVE->SUSPENDED); (2) PUBLISHED offerings with today >= start_date -> IN_SESSION; IN_SESSION with today > end_date -> COMPLETED; (3) non-terminal enrollments with today > deadline_date -> EXPIRED; (4) SCHEDULED attempts with now > scheduled_at + 24h -> NO_SHOW; (5) school pass-rate evaluation over trailing 90 days (posture transitions)", roles: [ComplianceOfficer], code: 200, input: [], output: "{ approvals_expired: integer, instructor_approvals_expired: integer, grants_suspended: integer, offerings_advanced: integer, enrollments_expired: integer, attempts_no_show: integer, schools_evaluated: integer }", side_effects: ["each entity advances at most ONE state hop per sweep run (no same-run double hops)", "transitions per sweep order", "each transition appends AuditEvent"] }

  # --- schools ---
  - { method: POST, path: "/schools", description: "Register a school (status PROVISIONAL, posture GOOD_STANDING); director_user_id = X-User-ID", roles: [SchoolDirector], code: 201, input: [school_name, school_code, home_state_code, "pass_rate_threshold_bps?"], output: School, side_effects: [] }
  - { method: GET, path: "/schools", description: "List schools", roles: [StateCommission, SchoolDirector, Registrar, ComplianceOfficer], code: 200, input: ["status?", "limit?", "offset?"], output: "School[]", side_effects: [] }
  - { method: GET, path: "/schools/{id}", description: "Get a school", roles: [StateCommission, SchoolDirector, Registrar, ComplianceOfficer], code: 200, input: [], output: School, side_effects: [] }
  - { method: POST, path: "/schools/{id}/license", description: "License a PROVISIONAL school", roles: [StateCommission], code: 200, input: [], output: School, side_effects: ["status PROVISIONAL -> LICENSED"] }
  - { method: POST, path: "/schools/{id}/suspend", description: "Suspend a LICENSED school", roles: [StateCommission], code: 200, input: [], output: School, side_effects: ["status LICENSED -> SUSPENDED"] }
  - { method: POST, path: "/schools/{id}/reinstate", description: "Reinstate a SUSPENDED school", roles: [StateCommission], code: 200, input: [], output: School, side_effects: ["status SUSPENDED -> LICENSED"] }
  - { method: POST, path: "/schools/{id}/revoke", description: "Revoke a school's license (terminal)", roles: [StateCommission], code: 200, input: [], output: School, side_effects: ["status -> REVOKED"] }
  - { method: GET, path: "/schools/{id}/pass-rate-summary", description: "Computed pass-rate summary over the trailing 90-day window ending today (does not mutate posture)", roles: [StateCommission, SchoolDirector, ComplianceOfficer], code: 200, input: [], output: "{ window_start: datetime, window_end: datetime, first_attempt_count: integer, first_attempt_pass_rate_bps: integer, all_attempt_count: integer, all_attempts_pass_rate_bps: integer, posture: string }", side_effects: [] }

  # --- courses ---
  - { method: POST, path: "/courses", description: "Create a course (status DRAFT); school must be LICENSED and director-scoped", roles: [SchoolDirector], code: 201, input: [school_id, course_code, title, course_type, required_seat_minutes, tuition_cents, pass_score_pct, completion_deadline_days, "max_exam_attempts?", "ce_credit_hours?"], output: Course, side_effects: ["status = DRAFT"] }
  - { method: GET, path: "/courses", description: "List courses", roles: [StateCommission, SchoolDirector, Registrar, ComplianceOfficer], code: 200, input: ["school_id?", "status?", "course_type?", "limit?", "offset?"], output: "Course[]", side_effects: [] }
  - { method: GET, path: "/courses/{id}", description: "Get a course", roles: [StateCommission, SchoolDirector, Registrar, ComplianceOfficer], code: 200, input: [], output: Course, side_effects: [] }
  - { method: POST, path: "/courses/{id}/activate", description: "Activate a DRAFT course (requires >= 1 APPROVED CourseApproval)", roles: [SchoolDirector], code: 200, input: [], output: Course, side_effects: ["status DRAFT -> ACTIVE"] }
  - { method: POST, path: "/courses/{id}/retire", description: "Retire an ACTIVE course (requires no DRAFT/PUBLISHED/IN_SESSION offerings)", roles: [SchoolDirector], code: 200, input: [], output: Course, side_effects: ["status ACTIVE -> RETIRED"] }

  # --- course approvals ---
  - { method: POST, path: "/courses/{id}/approvals", description: "Submit a course-approval application to a state commission (singleton per course+state)", roles: [ComplianceOfficer], code: 201, input: [state_code], output: CourseApproval, side_effects: ["status = PENDING, application_round = 1"] }
  - { method: GET, path: "/courses/{id}/approvals", description: "List approval applications of a course", roles: [StateCommission, SchoolDirector, Registrar, ComplianceOfficer], code: 200, input: ["limit?", "offset?"], output: "CourseApproval[]", side_effects: [] }
  - { method: GET, path: "/approvals/{id}", description: "Get a single course-approval application", roles: [StateCommission, SchoolDirector, Registrar, ComplianceOfficer], code: 200, input: [], output: CourseApproval, side_effects: [] }
  - { method: POST, path: "/approvals/{id}/decide", description: "Commission decision on a PENDING or RENEWAL_PENDING application; APPROVED requires valid_from + valid_until", roles: [StateCommission], code: 200, input: [decision, "valid_from?", "valid_until?"], output: CourseApproval, side_effects: ["PENDING -> APPROVED|DENIED or RENEWAL_PENDING -> APPROVED|EXPIRED", "on APPROVED: suspended grants of this course+state resume ACTIVE"] }
  - { method: POST, path: "/approvals/{id}/resubmit", description: "Resubmit a DENIED application (round + 1)", roles: [ComplianceOfficer], code: 200, input: [], output: CourseApproval, side_effects: ["DENIED -> PENDING, application_round += 1"] }
  - { method: POST, path: "/approvals/{id}/renew", description: "Submit a renewal from EXPIRING, or late renewal from EXPIRED within 30 days after valid_until", roles: [ComplianceOfficer], code: 200, input: [], output: CourseApproval, side_effects: ["EXPIRING|EXPIRED -> RENEWAL_PENDING"] }

  # --- instructors & their approvals ---
  - { method: POST, path: "/instructors", description: "Register an instructor", roles: [Registrar], code: 201, input: [school_id, full_name, license_number], output: Instructor, side_effects: [] }
  - { method: GET, path: "/instructors", description: "List instructors", roles: [StateCommission, SchoolDirector, Registrar, ComplianceOfficer], code: 200, input: ["school_id?", "limit?", "offset?"], output: "Instructor[]", side_effects: [] }
  - { method: GET, path: "/instructors/{id}", description: "Get an instructor", roles: [StateCommission, SchoolDirector, Registrar, ComplianceOfficer], code: 200, input: [], output: Instructor, side_effects: [] }
  - { method: POST, path: "/instructors/{id}/approvals", description: "Submit an instructor-approval application for a state (singleton per instructor+state)", roles: [Registrar], code: 201, input: [state_code], output: InstructorApproval, side_effects: ["status = PENDING, application_round = 1"] }
  - { method: GET, path: "/instructors/{id}/approvals", description: "List approval applications of an instructor", roles: [StateCommission, SchoolDirector, Registrar, ComplianceOfficer], code: 200, input: ["limit?", "offset?"], output: "InstructorApproval[]", side_effects: [] }
  - { method: GET, path: "/instructor-approvals/{id}", description: "Get a single instructor-approval application", roles: [StateCommission, SchoolDirector, Registrar, ComplianceOfficer], code: 200, input: [], output: InstructorApproval, side_effects: [] }
  - { method: POST, path: "/instructor-approvals/{id}/decide", description: "Commission decision on an instructor application", roles: [StateCommission], code: 200, input: [decision, "valid_from?", "valid_until?"], output: InstructorApproval, side_effects: ["PENDING -> APPROVED|DENIED or RENEWAL_PENDING -> APPROVED|EXPIRED"] }
  - { method: POST, path: "/instructor-approvals/{id}/resubmit", description: "Resubmit a DENIED instructor application", roles: [Registrar], code: 200, input: [], output: InstructorApproval, side_effects: ["DENIED -> PENDING, application_round += 1"] }
  - { method: POST, path: "/instructor-approvals/{id}/renew", description: "Renew an EXPIRING instructor approval, or late-renew an EXPIRED one within 30 days", roles: [Registrar], code: 200, input: [], output: InstructorApproval, side_effects: ["EXPIRING|EXPIRED -> RENEWAL_PENDING"] }

  # --- offerings ---
  - { method: POST, path: "/offerings", description: "Create a course offering (status DRAFT); validates window and instructor rest-gap conflict", roles: [SchoolDirector], code: 201, input: [course_id, instructor_id, state_code, start_date, end_date, capacity, delivery_mode], output: CourseOffering, side_effects: ["status = DRAFT", "enrolled_count = 0, seats_available = capacity"] }
  - { method: GET, path: "/offerings", description: "List offerings", roles: [StateCommission, SchoolDirector, Registrar, ComplianceOfficer, Student], code: 200, input: ["school_id?", "course_id?", "instructor_id?", "state_code?", "status?", "limit?", "offset?"], output: "CourseOffering[]", side_effects: [] }
  - { method: GET, path: "/offerings/{id}", description: "Get an offering", roles: [StateCommission, SchoolDirector, Registrar, ComplianceOfficer, Student], code: 200, input: [], output: CourseOffering, side_effects: [] }
  - { method: PUT, path: "/offerings/{id}", description: "Reschedule/resize a DRAFT or PUBLISHED offering; OCC-guarded (increments version by 1)", roles: [SchoolDirector], code: 200, input: ["start_date?", "end_date?", "capacity?", expected_offering_version], output: CourseOffering, side_effects: ["window and instructor rest-gap re-validated", "capacity >= enrolled_count enforced", "increments CourseOffering.version by 1"] }
  - { method: POST, path: "/offerings/{id}/publish", description: "Publish a DRAFT offering for enrollment (state authorization + instructor approval + probation gate)", roles: [SchoolDirector], code: 200, input: [], output: CourseOffering, side_effects: ["status DRAFT -> PUBLISHED"] }
  - { method: POST, path: "/offerings/{id}/cancel", description: "Cancel an offering; cascades withdrawals (SCHOOL_CANCELLED) and auto-created 100% refund requests", roles: [SchoolDirector], code: 200, input: [], output: CourseOffering, side_effects: ["status -> CANCELLED", "enrollment cascade L1-L3 per CourseOffering machine"] }

  # --- students ---
  - { method: POST, path: "/students", description: "Register a student", roles: [Registrar], code: 201, input: [school_id, full_name, email, license_goal_state], output: Student, side_effects: [] }
  - { method: GET, path: "/students", description: "List students", roles: [StateCommission, SchoolDirector, Registrar, ComplianceOfficer], code: 200, input: ["school_id?", "email?", "limit?", "offset?"], output: "Student[]", side_effects: [] }
  - { method: GET, path: "/students/{id}", description: "Get a student (Student role: self only)", roles: [StateCommission, SchoolDirector, Registrar, ComplianceOfficer, Student], code: 200, input: [], output: Student, side_effects: [] }

  # --- enrollments ---
  - { method: POST, path: "/enrollments", description: "Enroll a student in a PUBLISHED offering of a LICENSED school; computes charge_total_cents (order_total_cents), deadline_date; consumes one seat", roles: [Registrar, Student], code: 201, input: [offering_id, "student_id?", "scholarship_cents?"], output: Enrollment, side_effects: ["academic_status = ENROLLED, payment_status = PENDING", "enrolled_count/seats_available recomputed", "student_id defaults to X-User-ID for role Student and MUST equal it when supplied"] }
  - { method: GET, path: "/enrollments", description: "List enrollments (Student role: only own)", roles: [StateCommission, SchoolDirector, Registrar, ComplianceOfficer, Student], code: 200, input: ["student_id?", "offering_id?", "academic_status?", "payment_status?", "limit?", "offset?"], output: "Enrollment[]", side_effects: [] }
  - { method: GET, path: "/enrollments/{id}", description: "Get an enrollment (Student role: own only)", roles: [StateCommission, SchoolDirector, Registrar, ComplianceOfficer, Student], code: 200, input: [], output: Enrollment, side_effects: [] }
  - { method: POST, path: "/enrollments/{id}/withdraw", description: "Withdraw an enrollment (reason VOLUNTARY or ADMINISTRATIVE); auto-creates RefundRequest when PAID", roles: [Registrar, Student], code: 200, input: [reason, "effective_date?"], output: Enrollment, side_effects: ["academic_status -> WITHDRAWN", "withdrawal side effects W1-W3"] }
  - { method: POST, path: "/enrollments/{id}/pay", description: "Capture full payment; amount must equal charge_total_cents exactly", roles: [Registrar, Student], code: 200, input: [amount_cents], output: Enrollment, side_effects: ["payment_status PENDING -> PAID", "paid_cents = amount_cents"] }

  # --- attendance ---
  - { method: POST, path: "/enrollments/{id}/attendance-records", description: "Record a verified seat-time session (actor must be the offering's instructor; enrollment academic_status must be ENROLLED, IN_PROGRESS, or SEAT_TIME_MET)", roles: [Instructor], code: 201, input: [session_date, minutes], output: AttendanceRecord, side_effects: ["status = VERIFIED", "ENROLLED -> IN_PROGRESS on first record", "creditable_seat_minutes recomputed; auto SEAT_TIME_MET at >= required"] }
  - { method: GET, path: "/enrollments/{id}/attendance-records", description: "List attendance records of an enrollment", roles: [StateCommission, SchoolDirector, Registrar, ComplianceOfficer, Instructor, Student], code: 200, input: ["limit?", "offset?"], output: "AttendanceRecord[]", side_effects: [] }
  - { method: POST, path: "/attendance-records/{id}/void", description: "Void an attendance record (excluded from sums; may regress SEAT_TIME_MET -> IN_PROGRESS); forbidden once enrollment is EXAM_PASSED or COMPLETED", roles: [Instructor], code: 200, input: [], output: AttendanceRecord, side_effects: ["status VERIFIED -> VOID", "creditable recomputed; possible regression"] }

  # --- exam attempts ---
  - { method: POST, path: "/enrollments/{id}/exam-attempts", description: "Schedule a proctored final-exam attempt (requires SEAT_TIME_MET; proctor != offering instructor; attempt_number computed)", roles: [Registrar], code: 201, input: [scheduled_at, proctor_instructor_id], output: ExamAttempt, side_effects: ["status = SCHEDULED", "attempt_number = exam_attempts_used + 1"] }
  - { method: GET, path: "/enrollments/{id}/exam-attempts", description: "List exam attempts of an enrollment", roles: [StateCommission, SchoolDirector, Registrar, ComplianceOfficer, Student], code: 200, input: ["limit?", "offset?"], output: "ExamAttempt[]", side_effects: [] }
  - { method: GET, path: "/exam-attempts", description: "List exam attempts (filterable by proctor)", roles: [StateCommission, SchoolDirector, Registrar, ComplianceOfficer], code: 200, input: ["proctor_instructor_id?", "enrollment_id?", "status?", "limit?", "offset?"], output: "ExamAttempt[]", side_effects: [] }
  - { method: GET, path: "/exam-attempts/{id}", description: "Get an exam attempt", roles: [StateCommission, SchoolDirector, Registrar, ComplianceOfficer, Proctor], code: 200, input: [], output: ExamAttempt, side_effects: [] }
  - { method: POST, path: "/exam-attempts/{id}/verify", description: "Assigned proctor verifies identity/attendance (SCHEDULED -> PROCTORED)", roles: [Proctor], code: 200, input: [], output: ExamAttempt, side_effects: ["verified_at set"] }
  - { method: POST, path: "/exam-attempts/{id}/score", description: "Offering's instructor scores a PROCTORED attempt; outcome PASSED when score_pct >= course.pass_score_pct", roles: [Instructor], code: 200, input: [score_pct], output: ExamAttempt, side_effects: ["status PROCTORED -> SCORED", "outcome computed", "enrollment transitions on PASSED / on final FAILED"] }
  - { method: POST, path: "/exam-attempts/{id}/invalidate", description: "Invalidate an attempt for a proctoring violation; SCORED-PASSED invalidation cascades enrollment regression, certificate revocation, and report-amendment drafting", roles: [Proctor, SchoolDirector], code: 200, input: [reason], output: ExamAttempt, side_effects: ["status -> INVALIDATED", "invalidation_reason set", "cascades per ExamAttempt machine"] }

  # --- certificates ---
  - { method: POST, path: "/enrollments/{id}/certificate", description: "Issue the completion certificate (requires EXAM_PASSED); enrollment -> COMPLETED", roles: [Registrar], code: 201, input: [], output: Certificate, side_effects: ["certificate_number assigned (per-school per-year sequence)", "credit_hours_pinned set", "enrollment EXAM_PASSED -> COMPLETED"] }
  - { method: GET, path: "/certificates", description: "List certificates (Student role: only own)", roles: [StateCommission, SchoolDirector, Registrar, ComplianceOfficer, Student], code: 200, input: ["enrollment_id?", "student_id?", "status?", "limit?", "offset?"], output: "Certificate[]", side_effects: [] }
  - { method: GET, path: "/certificates/{id}", description: "Get a certificate (Student role: own only)", roles: [StateCommission, SchoolDirector, Registrar, ComplianceOfficer, Student], code: 200, input: [], output: Certificate, side_effects: [] }
  - { method: POST, path: "/certificates/{id}/revoke", description: "Revoke a certificate; cascades report-amendment drafting on ACKNOWLEDGED reports", roles: [StateCommission, SchoolDirector], code: 200, input: [reason], output: Certificate, side_effects: ["status ACTIVE -> REVOKED", "amendment cascade per Certificate machine"] }

  # --- refunds ---
  - { method: GET, path: "/refund-requests", description: "List refund requests (Student role: only own)", roles: [StateCommission, SchoolDirector, Registrar, ComplianceOfficer, Student], code: 200, input: ["enrollment_id?", "status?", "limit?", "offset?"], output: "RefundRequest[]", side_effects: [] }
  - { method: GET, path: "/refund-requests/{id}", description: "Get a refund request (Student role: own only)", roles: [StateCommission, SchoolDirector, Registrar, ComplianceOfficer, Student], code: 200, input: [], output: RefundRequest, side_effects: [] }
  - { method: POST, path: "/refund-requests/{id}/approve", description: "Approve a PENDING refund request", roles: [SchoolDirector], code: 200, input: [], output: RefundRequest, side_effects: ["status PENDING -> APPROVED", "decided_at set"] }
  - { method: POST, path: "/refund-requests/{id}/deny", description: "Deny a PENDING refund request", roles: [SchoolDirector], code: 200, input: [denial_reason], output: RefundRequest, side_effects: ["status PENDING -> DENIED", "decided_at set"] }
  - { method: POST, path: "/refund-requests/{id}/pay", description: "Pay an APPROVED refund; updates enrollment retained_cents and payment_status", roles: [Registrar], code: 200, input: [], output: RefundRequest, side_effects: ["status APPROVED -> PAID", "paid_at set", "enrollment retained_cents / payment_status updated"] }

  # --- credit reports ---
  - { method: POST, path: "/credit-reports", description: "Create a base CE credit report for a school and period (DRAFT; line_items snapshot computed)", roles: [ComplianceOfficer], code: 201, input: [school_id, period_start, period_end, "reason?"], output: CreditReport, side_effects: ["line_items snapshot + per-line rounding", "reporting_deadline_date = period_end + 30 days"] }
  - { method: GET, path: "/credit-reports", description: "List credit reports", roles: [StateCommission, SchoolDirector, ComplianceOfficer], code: 200, input: ["school_id?", "status?", "amendment_of_id?", "limit?", "offset?"], output: "CreditReport[]", side_effects: [] }
  - { method: GET, path: "/credit-reports/{id}", description: "Get a credit report", roles: [StateCommission, SchoolDirector, ComplianceOfficer], code: 200, input: [], output: CreditReport, side_effects: [] }
  - { method: POST, path: "/credit-reports/{id}/submit", description: "Submit a DRAFT report to the licensing authority; computes late_days and late_fee_cents", roles: [ComplianceOfficer], code: 200, input: [], output: CreditReport, side_effects: ["status DRAFT -> SUBMITTED", "submitted_at/late_days/late_fee_cents set", "submission_count += 1"] }
  - { method: POST, path: "/credit-reports/{id}/acknowledge", description: "Licensing authority acknowledges a SUBMITTED report (terminal)", roles: [StateCommission], code: 200, input: [], output: CreditReport, side_effects: ["status SUBMITTED -> ACKNOWLEDGED"] }
  - { method: POST, path: "/credit-reports/{id}/reject", description: "Licensing authority rejects a SUBMITTED report", roles: [StateCommission], code: 200, input: [reason], output: CreditReport, side_effects: ["status SUBMITTED -> REJECTED"] }
  - { method: POST, path: "/credit-reports/{id}/revise", description: "Return a REJECTED report to DRAFT for correction (recomputes line_items)", roles: [ComplianceOfficer], code: 200, input: [], output: CreditReport, side_effects: ["status REJECTED -> DRAFT", "line_items recomputed", "submitted_at = null"] }
  - { method: POST, path: "/credit-reports/{id}/amendments", description: "Create an amendment report against an ACKNOWLEDGED report; OCC-guarded (increments version by 1)", roles: [ComplianceOfficer], code: 201, input: [reason, expected_credit_report_version], output: CreditReport, side_effects: ["new CreditReport DRAFT with amendment_of_id = reportId and negated revoked lines", "increments CreditReport.version by 1"] }

  # --- equivalency grants ---
  - { method: POST, path: "/equivalency-grants", description: "Create a multi-state equivalency grant; supersedes any existing ACTIVE/SUSPENDED grant for the same (course, home, recognized); OCC-guarded (increments Course.version by 1)", roles: [ComplianceOfficer], code: 201, input: [course_id, home_state_code, recognized_state_code, expected_course_version], output: EquivalencyGrant, side_effects: ["existing same-key grant -> SUPERSEDED", "increments Course.version by 1"] }
  - { method: GET, path: "/equivalency-grants", description: "List equivalency grants", roles: [StateCommission, SchoolDirector, ComplianceOfficer], code: 200, input: ["course_id?", "recognized_state_code?", "status?", "limit?", "offset?"], output: "EquivalencyGrant[]", side_effects: [] }
  - { method: GET, path: "/equivalency-grants/{id}", description: "Get an equivalency grant", roles: [StateCommission, SchoolDirector, ComplianceOfficer], code: 200, input: [], output: EquivalencyGrant, side_effects: [] }
  - { method: POST, path: "/equivalency-grants/{id}/revoke", description: "Revoke an ACTIVE or SUSPENDED grant (terminal)", roles: [StateCommission, ComplianceOfficer], code: 200, input: [], output: EquivalencyGrant, side_effects: ["status -> REVOKED"] }

  # --- audit ---
  - { method: GET, path: "/audit-events", description: "List append-only audit events, ordered created_at ASC", roles: [StateCommission, SchoolDirector, Registrar, ComplianceOfficer], code: 200, input: ["entity_type?", "entity_id?", "event_type?", "limit?", "offset?"], output: "AuditEvent[]", side_effects: [] }

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID / X-User-Role missing, unknown role, or entity_backed role id not found" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not in the endpoint's roles list" }
  - { id: ERR_FORBIDDEN_SCOPE, http: 403, condition: "Actor outside resource scope (director/student/instructor/proctor ownership mismatch)" }
  # --- request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, unknown field, or unparseable value" }
  - { id: ERR_INVALID_ENUM, http: 400, condition: "Enum field value not in the declared set" }
  - { id: ERR_INVALID_PAGINATION_PARAMETERS, http: 400, condition: "limit outside 1..100 or offset < 0" }
  - { id: ERR_ATTENDANCE_MINUTES_INVALID, http: 400, condition: "minutes outside 1..1440" }
  - { id: ERR_SCORE_OUT_OF_RANGE, http: 400, condition: "score_pct outside 0..100" }
  - { id: ERR_WITHDRAWAL_REASON_INVALID, http: 400, condition: "Manual withdrawal reason not in {VOLUNTARY, ADMINISTRATIVE} (SCHOOL_CANCELLED is cascade-only)" }
  # --- not found ---
  - { id: ERR_SCHOOL_NOT_FOUND, http: 404, condition: "schoolId does not exist" }
  - { id: ERR_COURSE_NOT_FOUND, http: 404, condition: "courseId does not exist" }
  - { id: ERR_APPROVAL_NOT_FOUND, http: 404, condition: "approvalId does not exist" }
  - { id: ERR_INSTRUCTOR_NOT_FOUND, http: 404, condition: "instructorId does not exist" }
  - { id: ERR_INSTRUCTOR_APPROVAL_NOT_FOUND, http: 404, condition: "instructor-approvals approvalId does not exist" }
  - { id: ERR_OFFERING_NOT_FOUND, http: 404, condition: "offeringId does not exist" }
  - { id: ERR_STUDENT_NOT_FOUND, http: 404, condition: "studentId does not exist" }
  - { id: ERR_ENROLLMENT_NOT_FOUND, http: 404, condition: "enrollmentId does not exist" }
  - { id: ERR_ATTENDANCE_RECORD_NOT_FOUND, http: 404, condition: "recordId does not exist" }
  - { id: ERR_EXAM_ATTEMPT_NOT_FOUND, http: 404, condition: "attemptId does not exist" }
  - { id: ERR_CERTIFICATE_NOT_FOUND, http: 404, condition: "certificateId does not exist" }
  - { id: ERR_REFUND_REQUEST_NOT_FOUND, http: 404, condition: "refundRequestId does not exist" }
  - { id: ERR_CREDIT_REPORT_NOT_FOUND, http: 404, condition: "reportId does not exist" }
  - { id: ERR_GRANT_NOT_FOUND, http: 404, condition: "grantId does not exist" }
  # --- state ---
  - { id: ERR_SCHOOL_NOT_LICENSED, http: 409, condition: "Operation requires school status LICENSED (covers PROVISIONAL and SUSPENDED)" }
  - { id: ERR_SCHOOL_TERMINAL, http: 409, condition: "Operation on a REVOKED school" }
  - { id: ERR_COURSE_NOT_ACTIVE, http: 409, condition: "Operation requires course status ACTIVE (offering create/publish)" }
  - { id: ERR_COURSE_NOT_APPROVED_ANYWHERE, http: 409, condition: "Course activation requires at least one APPROVED CourseApproval" }
  - { id: ERR_COURSE_HAS_OPEN_OFFERINGS, http: 409, condition: "Course retire blocked by offerings in DRAFT/PUBLISHED/IN_SESSION" }
  - { id: ERR_OFFERING_NOT_OPEN, http: 409, condition: "Enrollment requires offering status PUBLISHED" }
  - { id: ERR_OFFERING_NOT_CANCELLABLE, http: 409, condition: "Cancel requires offering status DRAFT, PUBLISHED, or IN_SESSION" }
  - { id: ERR_ENROLLMENT_STATE_INVALID, http: 409, condition: "Enrollment not in a valid state for this operation (withdraw/pay/void/certificate/attempt)" }
  - { id: ERR_SEAT_TIME_NOT_MET, http: 409, condition: "Exam-attempt creation requires academic_status SEAT_TIME_MET" }
  - { id: ERR_EXAM_ATTEMPT_STATE_INVALID, http: 409, condition: "Attempt not in the required state (verify needs SCHEDULED; score needs PROCTORED)" }
  - { id: ERR_APPROVAL_STATE_INVALID, http: 409, condition: "Approval not in the required state for decide/resubmit/renew" }
  - { id: ERR_REFUND_STATE_INVALID, http: 409, condition: "Refund request not in the required state (approve/deny need PENDING; pay needs APPROVED)" }
  - { id: ERR_REPORT_STATE_INVALID, http: 409, condition: "Credit report not in the required state for submit/acknowledge/reject/revise/amendments" }
  - { id: ERR_GRANT_STATE_INVALID, http: 409, condition: "Grant not ACTIVE or SUSPENDED for revoke" }
  # --- temporal ---
  - { id: ERR_INVALID_OFFERING_WINDOW, http: 422, condition: "end_date < start_date or start_date before today" }
  - { id: ERR_STUDENT_SCHEDULE_CONFLICT, http: 409, condition: "Student holds a non-terminal enrollment whose offering window overlaps (half-open semantics; adjacency allowed)" }
  - { id: ERR_INSTRUCTOR_SCHEDULE_CONFLICT, http: 409, condition: "Instructor has a non-CANCELLED offering within the 1-day rest gap of the new window" }
  - { id: ERR_PROCTOR_SCHEDULE_CONFLICT, http: 409, condition: "Proctor already assigned a SCHEDULED/PROCTORED attempt on the same calendar date" }
  - { id: ERR_ATTENDANCE_OUT_OF_WINDOW, http: 422, condition: "session_date outside [offering.start_date, offering.end_date]" }
  - { id: ERR_REPORT_WINDOW_INVALID, http: 422, condition: "period_end < period_start" }
  - { id: ERR_REPORT_PERIOD_OVERLAP, http: 409, condition: "Another base report of the school overlaps [period_start, period_end] (closed-interval; adjacency counts)" }
  - { id: ERR_APPROVAL_RENEWAL_WINDOW_CLOSED, http: 422, condition: "Late renewal attempted more than 30 days after valid_until" }
  - { id: ERR_INVALID_VALIDITY_WINDOW, http: 422, condition: "decision=APPROVED with missing valid_from/valid_until or valid_until < valid_from" }
  # --- regulatory / referential ---
  - { id: ERR_SCHOOL_ON_PROBATION, http: 422, condition: "School posture PROBATION blocks approval submissions/renewals and offering publish" }
  - { id: ERR_PROCTOR_IS_INSTRUCTOR, http: 422, condition: "proctor_instructor_id equals the offering's instructor_id (segregation of duties)" }
  - { id: ERR_COURSE_NOT_AUTHORIZED_IN_STATE, http: 422, condition: "No APPROVED CourseApproval and no ACTIVE EquivalencyGrant covers the offering's state_code" }
  - { id: ERR_INSTRUCTOR_NOT_APPROVED_IN_STATE, http: 422, condition: "No APPROVED InstructorApproval for the instructor in the offering's state" }
  - { id: ERR_SOURCE_APPROVAL_NOT_APPROVED, http: 422, condition: "Grant creation requires CourseApproval(course, home_state_code) APPROVED" }
  # --- constraint / capacity ---
  - { id: ERR_DUPLICATE_SCHOOL_CODE, http: 409, condition: "school_code already registered" }
  - { id: ERR_DUPLICATE_COURSE_CODE, http: 409, condition: "course_code already exists within the school" }
  - { id: ERR_DUPLICATE_STUDENT_EMAIL, http: 409, condition: "email already registered within the school (case-insensitive)" }
  - { id: ERR_DUPLICATE_INSTRUCTOR_LICENSE, http: 409, condition: "license_number already exists within the school" }
  - { id: ERR_APPROVAL_ALREADY_EXISTS, http: 409, condition: "An approval already exists for (parent, state_code)" }
  - { id: ERR_OFFERING_FULL, http: 409, condition: "seats_available == 0 (enrolled_count == capacity)" }
  - { id: ERR_EXAM_ATTEMPTS_EXHAUSTED, http: 409, condition: "exam_attempts_used >= course.max_exam_attempts" }
  - { id: ERR_CAPACITY_BELOW_ENROLLED, http: 409, condition: "Updated capacity < current enrolled_count" }
  - { id: ERR_GRANT_SAME_STATE, http: 409, condition: "home_state_code == recognized_state_code" }
  # --- fiscal ---
  - { id: ERR_PAYMENT_AMOUNT_MISMATCH, http: 422, condition: "amount_cents != charge_total_cents" }
  # --- OCC ---
  - { id: ERR_STALE_OFFERING_VERSION, http: 412, condition: "expected_offering_version != current CourseOffering.version" }
  - { id: ERR_STALE_COURSE_VERSION, http: 412, condition: "expected_course_version != current Course.version" }
  - { id: ERR_STALE_CREDIT_REPORT_VERSION, http: 412, condition: "expected_credit_report_version != current CreditReport.version" }

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: StateCommission
    description: "State real-estate commission reviewer; decides approvals, licenses/suspends schools, acknowledges/rejects credit reports"
    identity: opaque
    exclusive_operations:
      - "POST /schools/{id}/license | suspend | reinstate | revoke"
      - "POST /approvals/{id}/decide and POST /instructor-approvals/{id}/decide"
      - "POST /credit-reports/{id}/acknowledge and /reject"
    shared_operations:
      - "GET read endpoints for schools, courses, approvals, instructors, offerings, enrollments, exam-attempts, certificates, refund-requests, credit-reports, equivalency-grants, audit-events"
      - "POST /certificates/{id}/revoke (shared with SchoolDirector)"
      - "POST /equivalency-grants/{id}/revoke (shared with ComplianceOfficer)"

  - name: SchoolDirector
    description: "School operator; owns schools via School.director_user_id; manages courses, offerings, and refund decisions"
    identity: opaque
    exclusive_operations:
      - "POST /schools"
      - "POST /courses, POST /courses/{id}/activate, POST /courses/{id}/retire"
      - "POST /offerings, PUT /offerings/{id}, POST /offerings/{id}/publish, POST /offerings/{id}/cancel"
      - "POST /refund-requests/{id}/approve and /deny"
    shared_operations:
      - "GET read endpoints (staff set)"
      - "POST /exam-attempts/{id}/invalidate (shared with the assigned Proctor)"
      - "POST /certificates/{id}/revoke (shared with StateCommission)"

  - name: Registrar
    description: "School registrar; manages students, enrollments, instructor approvals, exam scheduling, certificates, refund payout"
    identity: opaque
    exclusive_operations:
      - "POST /students"
      - "POST /instructors and POST /instructors/{id}/approvals, POST /instructor-approvals/{id}/resubmit and /renew"
      - "POST /enrollments/{id}/exam-attempts"
      - "POST /enrollments/{id}/certificate"
      - "POST /refund-requests/{id}/pay"
    shared_operations:
      - "POST /enrollments, POST /enrollments/{id}/withdraw, POST /enrollments/{id}/pay (shared with Student self-service)"
      - "GET read endpoints (staff set)"

  - name: ComplianceOfficer
    description: "School compliance officer; files course approvals, equivalency grants, CE credit reports; runs the regulatory sweep and controls the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /courses/{id}/approvals, POST /approvals/{id}/resubmit and /renew"
      - "POST /equivalency-grants"
      - "POST /credit-reports, POST /credit-reports/{id}/submit, /revise, /amendments"
      - "POST /_clock/set_current_utc, POST /_admin/run-regulatory-sweep"
    shared_operations:
      - "GET read endpoints (staff set)"
      - "POST /equivalency-grants/{id}/revoke (shared with StateCommission)"

  - name: Instructor
    description: "Instructor of record; records/voids attendance and scores exams for own offerings only (X-User-ID == Instructor.id)"
    identity: "entity_backed:Instructor"
    exclusive_operations:
      - "POST /enrollments/{id}/attendance-records"
      - "POST /attendance-records/{id}/void"
      - "POST /exam-attempts/{id}/score"
    shared_operations:
      - "GET /enrollments/{id}/attendance-records"

  - name: Proctor
    description: "Credentialed instructor acting as exam proctor (X-User-ID == Instructor.id of the assigned proctor); MUST NOT be the offering's instructor of record for the same attempt"
    identity: "entity_backed:Instructor"
    exclusive_operations:
      - "POST /exam-attempts/{id}/verify"
    shared_operations:
      - "POST /exam-attempts/{id}/invalidate (shared with SchoolDirector)"
      - "GET /exam-attempts/{id}"

  - name: Student
    description: "Student self-service (X-User-ID == Student.id); enrolls self, pays, withdraws, reads own records"
    identity: "entity_backed:Student"
    exclusive_operations: []
    shared_operations:
      - "POST /enrollments (self only: student_id defaults to / must equal X-User-ID)"
      - "POST /enrollments/{id}/withdraw and /pay (own enrollments only)"
      - "GET /offerings, GET /offerings/{id} (catalog browsing)"
      - "GET /students/{id} (self), GET /enrollments*, GET /certificates*, GET /refund-requests*, GET /enrollments/{id}/exam-attempts, GET /enrollments/{id}/attendance-records (own only)"
