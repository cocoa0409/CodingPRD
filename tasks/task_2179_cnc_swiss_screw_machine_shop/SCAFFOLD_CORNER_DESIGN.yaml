      assert:
      - ${under} == IN_SERVICE
      - ${under_p} == 99
      - ${at} == LIFE_EXPIRED
      - ${at_p} == 100
      - Machine.${m1}.status == DOWN
      - Machine.${m2}.status == AVAILABLE
