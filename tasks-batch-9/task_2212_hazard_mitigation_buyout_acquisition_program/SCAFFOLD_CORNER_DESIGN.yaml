# SCAFFOLD_CORNER_DESIGN.yaml - task_2212 Hazard Mitigation Buyout & Acquisition Program
#
# Breadth probe (SKILL.md 1.9) over the nine sections of references/claim-extraction-guide.md.
# Depth is covered by SCAFFOLD_DIFFICULTY_DESIGN.yaml; corners already asserted there are emitted
# as `excluded_because:` stubs.
#
# Shared conventions (identical to the difficulty design file):
#   * The logical clock starts at 2026-08-01T00:00:00Z; every chain pins it explicitly with
#     POST /_clock/set_current_utc as its first call.
#   * SubrecipientCoordinator is entity_backed:MitigationProject, so its X-User-ID is the project
#     id -> `as_user_id: "${proj}"`.
#   * grant_program FMA avoids the conditional disaster_declaration_number requirement (P4).
#   * MitigationProject.cost_share_federal_pct defaults to 0.75; no chain overrides it.
#   * Parcels and benefit-cost analyses must be created while the project is DRAFT or SUBMITTED
#     (P24), so they always precede submit/approve.
#   * SoD-2 forces two ProgramAdministrator ids ("pa-validator" validates the BCA, "pa-approver"
#     approves the project); SoD-1 forces three appraiser ids ("sa-1" authors the INITIAL, "ra-1"
#     reviews it and authors the REVIEW, "ra-2" accepts the REVIEW).
#   * Parcel.version / MitigationProject.version are re-read with a GET immediately before every
#     OCC write, except where a deliberately stale capture is the point of the test.
#   * "The golden path" below means: project created -> parcel created -> BCA validated -> project
#     submitted and approved -> pre-event FMV 20000000 -> participation VOLUNTARY_CONFIRMED ->
#     INITIAL appraisal 20000000 ACCEPTED -> REVIEW appraisal 20000000 ACCEPTED (parcel
#     VALUE_ESTABLISHED) -> offer created at net_offer_cents 21400000.
scaffold_corner_design:

  - section: entities
    instances:

      - name: project_creation_returns_the_success_envelope_with_declared_system_defaults
        claim_type: creation
        grounds:
          - entities.MitigationProject
          - endpoints.POST_mitigation-projects
          - response_envelope.success
        distinguishing_aspect: |
          A create call carrying only the required inputs returns 201 with response_type "object",
          a meta block, and every system/computed field seeded to its declared default - status
          DRAFT, version 1, all six money and count rollups at 0 and viability_status NONVIABLE -
          rather than null or absent.
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
          trigger:
            - call: "POST /mitigation-projects"
              payload: { project_code: "ENT-CREATE-1", grant_program: "FMA", subrecipient_name: "City of Riverbend", total_federal_share_cap_cents: 500000000, period_of_performance_end_date: "2028-12-31" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { proj: "$.data.id" }
          assert:
            - "the trigger call returns 201"
            - "response_type == object"
            - "meta.api_request_id is present and meta.api_request_timestamp is present"
            - "MitigationProject.${proj}.status == DRAFT"
            - "MitigationProject.${proj}.version == 1"
            - "MitigationProject.${proj}.cost_share_federal_pct == 0.75"
            - "MitigationProject.${proj}.federal_obligated_cents == 0"
            - "MitigationProject.${proj}.program_income_balance_cents == 0"
            - "MitigationProject.${proj}.protected_open_space_acres == 0"
            - "MitigationProject.${proj}.participating_parcel_count == 0"
            - "MitigationProject.${proj}.holdout_parcel_count == 0"
            - "MitigationProject.${proj}.contiguous_open_space_parcel_count == 0"
            - "MitigationProject.${proj}.neighborhood_viability_ratio == 0"
            - "MitigationProject.${proj}.viability_status == NONVIABLE"
            - "MitigationProject.${proj}.validated_bcr == null"
            - "MitigationProject.${proj}.validated_by_user_id == null"
            - "MitigationProject.${proj}.id and created_at and updated_at are non-null"

      - name: parcel_creation_applies_declared_defaults_for_omitted_optional_inputs
        claim_type: defaults
        grounds:
          - entities.Parcel.fields.substantial_damage_pct
          - entities.Parcel.fields.participation_status
          - entities.Parcel.fields.acquisition_status
          - endpoints.POST_mitigation-projects_project_id_parcels
        distinguishing_aspect: |
          Omitting substantial_damage_pct yields the declared default 0 (not null), and the two
          independent status dimensions start at NOT_CONTACTED and NOT_STARTED while
          dob_deduction_total_cents starts at 0 and every system valuation field stays null.
        test_recipe:
          setup:
            - "One MitigationProject in DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "POST /mitigation-projects"
              payload: { project_code: "ENT-DEFAULT-1", grant_program: "FMA", subrecipient_name: "City of Riverbend", total_federal_share_cap_cents: 500000000, period_of_performance_end_date: "2028-12-31" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { proj: "$.data.id" }
          trigger:
            - call: "POST /mitigation-projects/${proj}/parcels"
              payload: { project_id: "${proj}", apn: "APN-DEF-1", site_address: "1101 River Rd", acreage: 0.34, occupancy_type: "OWNER_OCCUPIED", structure_type: "SINGLE_FAMILY" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { p1: "$.data.id" }
          assert:
            - "the trigger call returns 201"
            - "Parcel.${p1}.substantial_damage_pct == 0"
            - "Parcel.${p1}.participation_status == NOT_CONTACTED"
            - "Parcel.${p1}.acquisition_status == NOT_STARTED"
            - "Parcel.${p1}.dob_deduction_total_cents == 0"
            - "Parcel.${p1}.pre_event_fmv_cents == null"
            - "Parcel.${p1}.pre_event_value_basis == null"
            - "Parcel.${p1}.pre_event_value_determined_at == null"
            - "Parcel.${p1}.voluntary_acknowledgement_signed_on == null"
            - "Parcel.${p1}.version == 1"

      - name: parcel_listing_with_filter_and_pagination_reports_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET_parcels
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          With three parcels on project A and one on project B, GET /parcels?project_id=A&limit=2
          returns exactly 2 rows with total_count 3 and has_more true, and the offset=2 page returns
          the remaining 1 row with has_more false - the filter is applied before the count, so
          project B's parcel is absent from both the rows and the total.
        test_recipe:
          setup:
            - "Project A in DRAFT with three parcels (APN-LIST-1..3); project B in DRAFT with one parcel (APN-LIST-9)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "POST /mitigation-projects"
              payload: { project_code: "ENT-LIST-A", grant_program: "FMA", subrecipient_name: "City of Riverbend", total_federal_share_cap_cents: 500000000, period_of_performance_end_date: "2028-12-31" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { proj_a: "$.data.id" }
            - call: "POST /mitigation-projects"
              payload: { project_code: "ENT-LIST-B", grant_program: "FMA", subrecipient_name: "Town of Eastmoor", total_federal_share_cap_cents: 500000000, period_of_performance_end_date: "2028-12-31" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { proj_b: "$.data.id" }
            - call: "POST /mitigation-projects/${proj_a}/parcels"
              payload: { project_id: "${proj_a}", apn: "APN-LIST-1", site_address: "1201 River Rd", acreage: 0.34, occupancy_type: "OWNER_OCCUPIED", structure_type: "SINGLE_FAMILY" }
              as: SubrecipientCoordinator
              as_user_id: "${proj_a}"
              captures: { pa1: "$.data.id" }
            - call: "POST /mitigation-projects/${proj_a}/parcels"
              payload: { project_id: "${proj_a}", apn: "APN-LIST-2", site_address: "1202 River Rd", acreage: 0.41, occupancy_type: "TENANT_OCCUPIED", structure_type: "MULTI_FAMILY" }
              as: SubrecipientCoordinator
              as_user_id: "${proj_a}"
              captures: { pa2: "$.data.id" }
            - call: "POST /mitigation-projects/${proj_a}/parcels"
              payload: { project_id: "${proj_a}", apn: "APN-LIST-3", site_address: "1203 River Rd", acreage: 1.25, occupancy_type: "VACANT", structure_type: "NONE" }
              as: SubrecipientCoordinator
              as_user_id: "${proj_a}"
              captures: { pa3: "$.data.id" }
            - call: "POST /mitigation-projects/${proj_b}/parcels"
              payload: { project_id: "${proj_b}", apn: "APN-LIST-9", site_address: "9 Eastmoor Way", acreage: 0.50, occupancy_type: "VACANT", structure_type: "NONE" }
              as: SubrecipientCoordinator
              as_user_id: "${proj_b}"
              captures: { pb1: "$.data.id" }
          trigger:
            - call: "GET /parcels"
              payload: { project_id: "${proj_a}", limit: 2, offset: 0 }
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "GET /parcels"
              payload: { project_id: "${proj_a}", limit: 2, offset: 2 }
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "GET /parcels"
              payload: { occupancy_type: "VACANT" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
          assert:
            - "the first trigger call returns 200 and response_type == array"
            - "the first trigger call returns 2 rows with meta pagination total_count == 3, limit == 2, offset == 0 and has_more == true"
            - "the second trigger call returns 1 row with total_count == 3, offset == 2 and has_more == false"
            - "neither page contains Parcel.${pb1}"
            - "the third trigger call returns 2 rows (Parcel.${pa3} and Parcel.${pb1}) with total_count == 2 and limit == 10 applied by default"

      - name: unknown_ids_in_every_entity_family_return_the_family_specific_not_found
        claim_type: not_found
        grounds:
          - validations.priority_5
          - validations.priority_6
          - validations.priority_7
          - validations.priority_8
          - validations.priority_9
          - validations.priority_10
          - validations.priority_11
          - validations.priority_12
          - validations.priority_13
          - validations.priority_14
          - validations.priority_15
          - validations.priority_16
          - validations.priority_17
          - validations.priority_18
          - validations.priority_19
        distinguishing_aspect: |
          Fifteen read endpoints called with the syntactically valid but unknown id
          00000000-0000-0000-0000-000000000000 each return 404 with the error_id specific to that
          entity family - never a shared generic ERR_NOT_FOUND and never 422 for a well-formed id.
        test_recipe:
          setup:
            - "Empty database apart from the pinned clock; no ids exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
          trigger:
            - call: "GET /mitigation-projects/00000000-0000-0000-0000-000000000000"
              payload: { project_id: "00000000-0000-0000-0000-000000000000" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "GET /benefit-cost-analyses/00000000-0000-0000-0000-000000000000"
              payload: { bca_id: "00000000-0000-0000-0000-000000000000" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "GET /parcels/00000000-0000-0000-0000-000000000000"
              payload: { parcel_id: "00000000-0000-0000-0000-000000000000" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "GET /appraisals/00000000-0000-0000-0000-000000000000"
              payload: { appraisal_id: "00000000-0000-0000-0000-000000000000" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "GET /dob-records/00000000-0000-0000-0000-000000000000"
              payload: { dob_record_id: "00000000-0000-0000-0000-000000000000" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "GET /purchase-offers/00000000-0000-0000-0000-000000000000"
              payload: { offer_id: "00000000-0000-0000-0000-000000000000" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "GET /relocation-cases/00000000-0000-0000-0000-000000000000"
              payload: { case_id: "00000000-0000-0000-0000-000000000000" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "GET /closing-records/00000000-0000-0000-0000-000000000000"
              payload: { closing_id: "00000000-0000-0000-0000-000000000000" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "GET /demolition-contractors/00000000-0000-0000-0000-000000000000"
              payload: { contractor_id: "00000000-0000-0000-0000-000000000000" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "GET /demolition-work-orders/00000000-0000-0000-0000-000000000000"
              payload: { work_order_id: "00000000-0000-0000-0000-000000000000" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "GET /utility-disconnections/00000000-0000-0000-0000-000000000000"
              payload: { disconnection_id: "00000000-0000-0000-0000-000000000000" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "GET /deed-restrictions/00000000-0000-0000-0000-000000000000"
              payload: { restriction_id: "00000000-0000-0000-0000-000000000000" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "GET /program-income-entries/00000000-0000-0000-0000-000000000000"
              payload: { entry_id: "00000000-0000-0000-0000-000000000000" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "GET /parcel-adjacencies/00000000-0000-0000-0000-000000000000"
              payload: { adjacency_id: "00000000-0000-0000-0000-000000000000" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "GET /monitoring-inspections/00000000-0000-0000-0000-000000000000"
              payload: { inspection_id: "00000000-0000-0000-0000-000000000000" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
          assert:
            - "every trigger call returns 404 with response_type == error"
            - "call 1 data.error_id == ERR_PROJECT_NOT_FOUND"
            - "call 2 data.error_id == ERR_BCA_NOT_FOUND"
            - "call 3 data.error_id == ERR_PARCEL_NOT_FOUND"
            - "call 4 data.error_id == ERR_APPRAISAL_NOT_FOUND"
            - "call 5 data.error_id == ERR_DOB_RECORD_NOT_FOUND"
            - "call 6 data.error_id == ERR_OFFER_NOT_FOUND"
            - "call 7 data.error_id == ERR_RELOCATION_CASE_NOT_FOUND"
            - "call 8 data.error_id == ERR_CLOSING_NOT_FOUND"
            - "call 9 data.error_id == ERR_CONTRACTOR_NOT_FOUND"
            - "call 10 data.error_id == ERR_WORK_ORDER_NOT_FOUND"
            - "call 11 data.error_id == ERR_DISCONNECTION_NOT_FOUND"
            - "call 12 data.error_id == ERR_DEED_RESTRICTION_NOT_FOUND"
            - "call 13 data.error_id == ERR_LEDGER_ENTRY_NOT_FOUND"
            - "call 14 data.error_id == ERR_ADJACENCY_NOT_FOUND"
            - "call 15 data.error_id == ERR_INSPECTION_NOT_FOUND"

      - name: project_creation_missing_required_subrecipient_name_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations.priority_4
          - entities.MitigationProject.fields.subrecipient_name
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          Omitting the required input subrecipient_name returns 422 ERR_INVALID_REQUEST and creates
          nothing - GET /mitigation-projects afterwards still reports total_count 0 - proving the
          body-shape gate runs before any persistence.
        test_recipe:
          setup:
            - "Empty database apart from the pinned clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
          trigger:
            - call: "POST /mitigation-projects"
              payload: { project_code: "ENT-REQ-1", grant_program: "FMA", total_federal_share_cap_cents: 500000000, period_of_performance_end_date: "2028-12-31" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "GET /mitigation-projects"
              payload: { limit: 10, offset: 0 }
              as: ProgramAdministrator
              as_user_id: "pa-1"
          assert:
            - "the first trigger call returns 422 and data.error_id == ERR_INVALID_REQUEST"
            - "the second trigger call returns 200 with total_count == 0"

      - name: parcel_creation_with_invalid_enum_and_out_of_range_numbers_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - validations.priority_4
          - entities.Parcel.fields.occupancy_type
          - entities.Parcel.fields.acreage
          - entities.DemolitionContractor.fields.max_concurrent_work_orders
        distinguishing_aspect: |
          Three separate shape violations all collapse to 422 ERR_INVALID_REQUEST: an
          occupancy_type outside its declared enum, a non-positive acreage, and a
          max_concurrent_work_orders of 11 which exceeds the declared 1..10 range.
        test_recipe:
          setup:
            - "One MitigationProject in DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "POST /mitigation-projects"
              payload: { project_code: "ENT-TYPE-1", grant_program: "FMA", subrecipient_name: "City of Riverbend", total_federal_share_cap_cents: 500000000, period_of_performance_end_date: "2028-12-31" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { proj: "$.data.id" }
          trigger:
            - call: "POST /mitigation-projects/${proj}/parcels"
              payload: { project_id: "${proj}", apn: "APN-TYPE-1", site_address: "1301 River Rd", acreage: 0.34, occupancy_type: "SEASONAL_RENTAL", structure_type: "SINGLE_FAMILY" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
            - call: "POST /mitigation-projects/${proj}/parcels"
              payload: { project_id: "${proj}", apn: "APN-TYPE-2", site_address: "1302 River Rd", acreage: 0, occupancy_type: "VACANT", structure_type: "NONE" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
            - call: "POST /demolition-contractors"
              payload: { name: "Overbooked Wrecking", license_no: "DEM-OB", asbestos_certified: true, max_concurrent_work_orders: 11 }
              as: ProgramAdministrator
              as_user_id: "pa-1"
          assert:
            - "all three trigger calls return 422 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /parcels?project_id=${proj} returns total_count == 0"
            - "GET /demolition-contractors returns total_count == 0"

      - name: immutable_child_rows_carry_no_version_and_expose_no_mutation_endpoint
        claim_type: immutability
        grounds:
          - entities.ParcelAdjacency
          - entities.MonitoringInspection
          - entities.ProgramIncomeLedgerEntry
          - endpoints.GET_parcel-adjacencies_adjacency_id
        distinguishing_aspect: |
          ParcelAdjacency, MonitoringInspection and ProgramIncomeLedgerEntry are declared
          common_fields false: their rows expose id and created_at but no version and no updated_at,
          and the endpoint surface offers only POST-create and GET-read for them - correction happens
          by posting a compensating row (ProgramIncomeLedgerEntry) or not at all.
        test_recipe:
          setup:
            - "One APPROVED MitigationProject with two parcels and one ParcelAdjacency linking them."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "POST /mitigation-projects"
              payload: { project_code: "ENT-IMM-1", grant_program: "FMA", subrecipient_name: "City of Riverbend", total_federal_share_cap_cents: 500000000, period_of_performance_end_date: "2028-12-31" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { proj: "$.data.id" }
            - call: "POST /mitigation-projects/${proj}/parcels"
              payload: { project_id: "${proj}", apn: "APN-IMM-1", site_address: "1401 River Rd", acreage: 0.34, occupancy_type: "VACANT", structure_type: "NONE" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { p1: "$.data.id" }
            - call: "POST /mitigation-projects/${proj}/parcels"
              payload: { project_id: "${proj}", apn: "APN-IMM-2", site_address: "1402 River Rd", acreage: 0.41, occupancy_type: "VACANT", structure_type: "NONE" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { p2: "$.data.id" }
            - call: "POST /mitigation-projects/${proj}/benefit-cost-analyses"
              payload: { project_id: "${proj}", analysis_method: "PRE_CALCULATED_BENEFIT", hazard_type: "RIVERINE_FLOOD", sfha_zone: "AE", annualized_loss_avoided_cents: 4000000, project_useful_life_years: 30, mitigation_cost_cents: 45000000 }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { bca: "$.data.id" }
            - call: "POST /benefit-cost-analyses/${bca}/validate"
              payload: { bca_id: "${bca}", decision: "VALIDATE" }
              as: ProgramAdministrator
              as_user_id: "pa-validator"
            - call: "POST /mitigation-projects/${proj}/submit"
              payload: { project_id: "${proj}" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
            - call: "POST /mitigation-projects/${proj}/approve"
              payload: { project_id: "${proj}", decision: "APPROVE" }
              as: ProgramAdministrator
              as_user_id: "pa-approver"
            - call: "POST /parcel-adjacencies"
              payload: { project_id: "${proj}", parcel_a_id: "${p1}", parcel_b_id: "${p2}", shared_boundary_feet: 120.5 }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { adj: "$.data.id" }
          trigger:
            - call: "GET /parcel-adjacencies/${adj}"
              payload: { adjacency_id: "${adj}" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
          assert:
            - "the trigger call returns 200"
            - "ParcelAdjacency.${adj}.id and created_at are present"
            - "the ParcelAdjacency payload contains no version field and no updated_at field"
            - "ParcelAdjacency.${adj}.shared_boundary_feet == 120.5"
            - "no PATCH, PUT or DELETE endpoint is declared for /parcel-adjacencies, /monitoring-inspections or /program-income-entries"

      - name: computed_offer_amounts_ignore_client_supplied_extra_field_values
        claim_type: computed_fields
        grounds:
          - entities.PurchaseOffer.fields.net_offer_cents
          - entities.PurchaseOffer.fields.incentive_cents
          - calculations.net_offer_amount
          - endpoints.POST_parcels_parcel_id_purchase-offers
        distinguishing_aspect: |
          The create call smuggles net_offer_cents 1 and incentive_cents 1 into the body as extra
          fields; the server derives 21400000 and 1400000 from the appraisal and the incentive tier
          instead, proving those fields are computed rather than accepted inputs.
        test_recipe:
          setup:
            - "The golden path up to and including the ACCEPTED REVIEW appraisal at 20000000 on an OWNER_OCCUPIED parcel with no DOB records."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "POST /mitigation-projects"
