              payload: {}
              as: AssetManager
              as_user_id: "u_am_1"
              captures: { v1: $.data.version }
            - call: "POST /market-rent-schedules"
              payload: { community_id: "${c}", product_type: "DETACHED", effective_from: "2026-09-01T00:00:00Z", repricing_mode: "MANUAL", asking_rent_cents: 900000, expected_community_version: "${v1}" }
              as: AssetManager
              as_user_id: "u_am_1"
              captures: { s_late: $.data.id }
            - call: "GET /communities/${c}"
              payload: {}
              as: AssetManager
              as_user_id: "u_am_1"
              captures: { v2: $.data.version }
            - call: "POST /market-rent-schedules"
              payload: { community_id: "${c}", product_type: "DETACHED", effective_from: "2026-08-01T00:00:00Z", repricing_mode: "MANUAL", asking_rent_cents: 270000, expected_community_version: "${v2}" }
              as: AssetManager
              as_user_id: "u_am_1"
              captures: { s_early: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: AssetManager
              as_user_id: "u_am_1"
            - call: "POST /communities/${c}/absorption-reviews"
              payload: { product_type: "DETACHED", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-08T00:00:00Z", planned_absorption_units: 3 }
              as: AssetManager
              as_user_id: "u_am_1"
              captures: { rev: $.data.id }
            - call: "GET /communities/${c}"
              payload: {}
              as: AssetManager
              as_user_id: "u_am_1"
              captures: { v3: $.data.version }
          trigger:
            - call: "POST /market-rent-schedules"
              payload: { community_id: "${c}", product_type: "DETACHED", effective_from: "2026-10-01T00:00:00Z", repricing_mode: "ABSORPTION_INDEXED", expected_community_version: "${v3}" }
              as: AssetManager
              as_user_id: "u_am_1"
          assert:
            - "MarketRentSchedule.${s_late}.status == SUPERSEDED even though its effective_from 2026-09-01 is the latest of the pair, and MarketRentSchedule.${s_early}.status == PUBLISHED"
            - "The indexed publication returns HTTP 409 with data.error_id == ERR_SCHEDULE_ALREADY_SUPERSEDED, not a 201 repricing off 270000 and not ERR_RENT_SCHEDULE_NOT_FOUND"
            - "No new schedule is created: GET /market-rent-schedules filtered by community_id ${c} and product_type DETACHED reports total_count == 2"
            - "Community.${c}.version is unchanged by the refusal, so a retry with ${v3} would still be version-current"
            - "AbsorptionReview.${rev} is untouched — the baseline check runs before the review lookup"

