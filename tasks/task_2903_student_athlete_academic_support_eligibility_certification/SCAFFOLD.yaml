# =============================================================================
# PRD Benchmark Scaffold — Student-Athlete Academic Support & Eligibility
# Certification (university athletics academic services)
# =============================================================================

scenario: |
  2903. Student-Athlete Academic Support & Eligibility Certification (university
  athletics academic services): initial and continuing eligibility certification
  against progress-toward-degree benchmarks, degree applicability of coursework and
  major declaration deadlines, study hall requirements and tutor assignment by risk
  tier, missed class time policy for competition travel and instructor notification,
  academic progress rate calculation and retention/eligibility point tracking,
  impermissible academic assistance prevention and tutor training, transfer
  eligibility evaluation and academic record review, appeal and waiver submission
  for eligibility exceptions

domain_name: athletics-academic-eligibility
api_prefix: /athletics

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# -----------------------------------------------------------------------------
# §0.1–§0.3 Complexity Profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  difficulty_level: expert_plus
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - ops_run_checkpoint

  entity_topology: graph
  # DegreeApplicabilityRule is a (DegreeProgram x Course) junction; Enrollment is a
  # (StudentAthlete x Course x Term) junction; TutorAssignment is a (Tutor x Enrollment)
  # junction; EligibilityAppeal references itself through predecessor_appeal_id.

  state_machine_shape: cyclic
  # EligibilityCertification cycles CERTIFIED -> REVOKED -> RESTORED -> REVOKED;
  # EligibilityAppeal cycles SUBMITTED -> COMMITTEE_REVIEW -> REVISION_REQUESTED -> SUBMITTED;
  # TutorAssignment cycles ACTIVE -> SUSPENDED -> ACTIVE; StudentAthlete carries two
  # independent state dimensions (eligibility_state and support_status) on one row.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # The AcademicAdvisor who requests a certification may not decide it; the
  # AppealsCommittee member who decides an appeal may not be its submitter.

  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  # ---------------------------------------------------------------- Term ------
  - name: Term
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Registrar term code, e.g. 2026FA"
        constraints: "matches ^[0-9]{4}(FA|SP|SU)$; unique across all Terms"
      - name: term_index
        type: integer
        source: input
        description: "Monotonic ordinal of this term in the academic calendar; the sole ordering key for every chronological calculation in this scaffold"
        constraints: ">= 1; unique across all Terms"
      - name: term_type
        type: enum
        source: input
        description: "Calendar slot of the term"
        constraints: "one of FALL, SPRING, SUMMER"
      - name: catalog_year
        type: integer
        source: input
        description: "Degree catalog year in force during this term; read by the CATALOG_AT_CERTIFICATION audit variant"
        constraints: ">= 2000"
      - name: start_date
        type: datetime
        source: input
        description: "ISO 8601 UTC instant at which the term begins; INCLUSIVE bound of the term window"
      - name: end_date
        type: datetime
        source: input
        description: "ISO 8601 UTC instant at which the term ends; EXCLUSIVE bound of the term window. Must be strictly after start_date"
      - name: full_time_credit_minimum
        type: integer
        source: input
        description: "Completed resident credit hours a student must hold in this term for the term to count as a completed full-time term"
        default: 12
        constraints: ">= 1"
      - name: is_apr_reporting_term
        type: boolean
        source: input
        description: "When true this term participates in academic-progress-rate point accounting"
        default: true
      - name: apr_status
        type: enum
        source: computed
        description: "OPEN until the APR close checkpoint runs for this term, CLOSED afterwards; CLOSED freezes every certification and appeal bound to the term"
        default: OPEN
        constraints: "one of OPEN, CLOSED"
      - name: apr_points_possible
        type: integer
        source: computed
        description: "Sum of 2 points per student in the APR cohort of this term, written by the APR close checkpoint"
        default: 0
      - name: apr_points_earned
        type: number
        source: computed
        description: "Sum of retention + eligibility points awarded by the APR close checkpoint for this term"
        default: 0
      - name: squad_apr
        type: number
        source: computed
        description: "1000 * apr_points_earned / apr_points_possible, round_half_up to 0 decimals; null when apr_points_possible == 0"
        default: null

  # ------------------------------------------------------- DegreeProgram ------
  - name: DegreeProgram
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Program code, e.g. KINE-BS"
        constraints: "unique across all DegreePrograms"
      - name: name
        type: string
        source: input
        description: "Human-readable program name"
      - name: catalog_year
        type: integer
        source: input
        description: "Catalog year in which this program record was published"
      - name: total_required_credits
        type: number
        source: input
        description: "Degree-applicable credit hours required to graduate; denominator of progress_pct"
        constraints: "> 0"
      - name: min_progress_gpa
        type: number
        source: input
        description: "Minimum cumulative GPA required for a PASS benchmark_result"
        default: 2.0
        constraints: ">= 0 and <= 4.0"
      - name: major_declaration_deadline_term_count
        type: integer
        source: input
        description: "Number of completed full-time terms after which a student must have declared this major; exceeding it blocks CONTINUING certification"
        default: 4
        constraints: ">= 1"
      - name: max_elective_credits_countable
        type: number
        source: input
        description: "Cap on the total ELECTIVE-classified credits the degree audit may count for this program"
        default: 12
        constraints: ">= 0"

  # -------------------------------------------------------------- Course ------
  - name: Course
    parent: null
    common_fields: true
    fields:
      - name: subject_code
        type: string
        source: input
        description: "Subject prefix, e.g. KINE; must appear in a tutor's subject_codes before that tutor may support the course"
      - name: course_number
        type: string
        source: input
        description: "Catalog number, e.g. 190"
        constraints: "(subject_code, course_number) unique across all Courses"
      - name: title
        type: string
        source: input
        description: "Course title"
      - name: credit_hours
        type: number
        source: input
        description: "Credit hours of record for the course"
        constraints: "> 0 and <= 12"
      - name: is_remedial
        type: boolean
        source: input
        description: "When true, credits count toward the degree audit only for terms with term_index <= StudentAthlete.entry_term_index + 1 and only up to REMEDIAL_CREDIT_CAP"
        default: false
      - name: meeting_days
        type: array
        source: input
        description: "ISO weekday numbers (1=Monday .. 7=Sunday) on which the course meets; drives missed-class meeting enumeration"
        default: []
      - name: meeting_start_minute_utc
        type: integer
        source: input
        description: "Minutes after 00:00 UTC at which each meeting starts"
        default: 600
        constraints: ">= 0 and <= 1439"
      - name: meeting_duration_minutes
        type: integer
        source: input
        description: "Length of one class meeting in minutes"
        default: 50
        constraints: "> 0 and <= 480"
      - name: instructor_user_id
        type: string
        source: input
        description: "Opaque operator id of the Instructor of record (compared against X-User-ID for Instructor actions); NOT an entity foreign key"

  # ------------------------------------------- DegreeApplicabilityRule --------
  - name: DegreeApplicabilityRule
    parent: null
    common_fields: true
    fields:
      - name: degree_program_id
        type: string
        source: input
        description: "FK -> DegreeProgram.id; the program whose degree audit this classification governs"
      - name: course_id
        type: string
        source: input
        description: "FK -> Course.id; the course being classified"
      - name: effective_catalog_year
        type: integer
        source: input
        description: "Catalog year for which this classification is in force; the audit variant decides which catalog year is read"
      - name: applicability
        type: enum
        source: input
        description: "CORE counts in full, ELECTIVE counts against the program elective cap, NOT_APPLICABLE counts zero"
        constraints: "one of CORE, ELECTIVE, NOT_APPLICABLE; (degree_program_id, course_id, effective_catalog_year) unique"
      - name: max_countable_credits
        type: number
        source: input
        description: "Per-rule ceiling on the credits this course may contribute; when null the enrollment's full earned_credit_hours is eligible"
        default: null
        constraints: ">= 0 when present"

  # ------------------------------------------------------ StudentAthlete ------
  - name: StudentAthlete
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Student name"
      - name: sport_code
        type: enum
        source: input
        description: "Sport squad the student competes for; the APR cohort key"
        constraints: "one of MBB, WBB, FB, BASE, SOC, TRACK"
      - name: entry_term_index
        type: integer
        source: input
        description: "Term.term_index of the term in which the student first enrolled"
        constraints: ">= 1"
      - name: entry_catalog_year
        type: integer
        source: input
        description: "Catalog year in force at entry; read by the CATALOG_AT_ENTRY audit variant"
      - name: transfer_status
        type: enum
        source: input
        description: "NATIVE for first-time enrollees, INCOMING_TRANSFER for students whose record includes external coursework"
        default: NATIVE
        constraints: "one of NATIVE, INCOMING_TRANSFER"
      - name: declared_program_id
        type: string
        source: input
        description: "FK -> DegreeProgram.id; null until the major declaration is filed"
        default: null
      - name: major_declared_term_index
        type: integer
        source: computed
        description: "Term.term_index in force (per the logical clock) when the current major declaration was filed; null while declared_program_id is null"
        default: null
      - name: eligibility_state
        type: enum
        source: computed
        description: "Certification dimension, derived from the governing EligibilityCertification of the highest-term_index Term for which a non-SUPERSEDED certification exists"
        default: NOT_CERTIFIED
        constraints: "one of NOT_CERTIFIED, PROVISIONALLY_CERTIFIED, CERTIFIED, INELIGIBLE, RESTORED_BY_WAIVER"
      - name: support_status
        type: enum
        source: computed
        description: "Academic-support dimension, derived from risk_tier, apr_points_forfeited and substantiated incidents; evolves independently of eligibility_state on the same row"
        default: SUPPORT_NORMAL
        constraints: "one of SUPPORT_NORMAL, SUPPORT_MANDATED, SUPPORT_PROBATION, SUPPORT_WITHHELD"
      - name: cumulative_gpa
        type: number
        source: computed
        description: "Credit-weighted GPA over Enrollment rows with status == COMPLETED, credit_source == RESIDENT and grade IN {A,B,C,D,F}; round_half_up to 3 decimals; 0.000 when the input set is empty"
        default: 0
      - name: completed_full_time_terms
        type: integer
        source: computed
        description: "Count of distinct Terms in which the student's COMPLETED RESIDENT enrollment credit_hours sum to >= Term.full_time_credit_minimum"
        default: 0
      - name: degree_applicable_credits
        type: number
        source: computed
        description: "Output of degree_applicable_credit_audit under the pinned audit variant; round_half_up to 2 decimals"
        default: 0
      - name: progress_pct
        type: number
        source: computed
        description: "degree_applicable_credits / DegreeProgram.total_required_credits, round_half_up to 4 decimals; 0.0 while declared_program_id is null"
        default: 0
      - name: transfer_credits_accepted
        type: number
        source: computed
        description: "Output of transfer_credit_acceptance; 0 for students with transfer_status == NATIVE"
        default: 0
      - name: risk_score
        type: number
        source: computed
        description: "Output of academic_risk_score under the pinned risk variant; round_half_up to 2 decimals"
        default: 0
      - name: risk_tier
        type: enum
        source: computed
        description: "Threshold banding of risk_score: TIER_1 < 20, TIER_2 [20,40), TIER_3 [40,65), TIER_4 >= 65"
        default: TIER_1
        constraints: "one of TIER_1, TIER_2, TIER_3, TIER_4"
      - name: required_study_hall_hours
        type: number
        source: computed
        description: "Output of support_requirement_hours; weekly study-hall hours the student owes"
        default: 0
      - name: missed_class_units_allowance
        type: number
        source: input
        description: "Season budget of missed-class units the student may be charged"
        default: 9.0
        constraints: ">= 0"
      - name: missed_class_units_charged
        type: number
        source: computed
        description: "Sum of MissedClassRequest.missed_units over rows with status IN {DRAFT, PENDING_ACKNOWLEDGEMENT, ACKNOWLEDGED, DISPUTED}; round_half_up to 2 decimals"
        default: 0
      - name: missed_class_units_remaining
        type: number
        source: computed
        description: "missed_class_units_allowance - missed_class_units_charged; the conserved budget invariant is allowance == charged + remaining at all times"
        default: 9.0
      - name: apr_points_possible
        type: integer
        source: computed
        description: "Running total of 2 points per APR-closed term in which the student was in the cohort"
        default: 0
      - name: apr_points_earned
        type: number
        source: computed
        description: "Running total of retention + eligibility points awarded across APR-closed terms"
        default: 0
      - name: apr_points_forfeited
        type: number
        source: computed
        description: "Running total of points lost across APR-closed terms; the conserved point invariant is apr_points_possible == apr_points_earned + apr_points_forfeited"
        default: 0
      - name: substantiated_penalty_points
        type: number
        source: computed
        description: "Sum of ComplianceIncident.penalty_points_assessed over rows for this student with status IN {SUBSTANTIATED, REMEDIATED}"
        default: 0

  # ---------------------------------------------------------- Enrollment ------
  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - name: student_athlete_id
        type: string
        source: input
        description: "FK -> StudentAthlete.id; the enrolled student"
      - name: course_id
        type: string
        source: input
        description: "FK -> Course.id; the course of record"
      - name: term_id
        type: string
        source: input
        description: "FK -> Term.id; the term of record"
      - name: credit_hours
        type: number
        source: input
        description: "Credit hours of record; when omitted the referenced Course.credit_hours is copied at creation"
        default: null
        constraints: "> 0 and <= 12 when present"
      - name: credit_source
        type: enum
        source: input
        description: "RESIDENT for coursework taken at this institution, TRANSFER for external coursework on an incoming transfer's record"
        default: RESIDENT
        constraints: "one of RESIDENT, TRANSFER"
      - name: status
        type: enum
        source: computed
        description: "Lifecycle of the enrollment; TRANSFER rows are created directly in COMPLETED"
        default: ENROLLED
        constraints: "one of ENROLLED, COMPLETED, DROPPED, WITHDRAWN, INCOMPLETE"
      - name: grade
        type: enum
        source: computed
        description: "Letter grade recorded by the registrar; null until an outcome is recorded"
        default: null
        constraints: "one of A, B, C, D, F when present"
      - name: grade_points
        type: number
        source: computed
        description: "Grade points for the letter grade: A=4.0, B=3.0, C=2.0, D=1.0, F=0.0; null while grade is null"
        default: null
      - name: earned_credit_hours
        type: number
        source: computed
        description: "credit_hours when status == COMPLETED and grade_points >= 1.0, otherwise 0"
        default: 0
      - name: degree_applicable_credits_counted
        type: number
        source: computed
        description: "Credits this enrollment contributed the last time degree_applicable_credit_audit ran for its student"
        default: 0
      - name: is_full_time_countable
        type: boolean
        source: computed
        description: "True when status == COMPLETED and credit_source == RESIDENT; such rows feed completed_full_time_terms"
        default: false
      - name: outcome_recorded_at
        type: datetime
        source: computed
        description: "Logical-clock instant at which the terminal outcome was recorded; null while status == ENROLLED"
        default: null

  # ---------------------------------------------- EligibilityCertification ----
  - name: EligibilityCertification
    parent: null
    common_fields: true
    fields:
      - name: student_athlete_id
        type: string
        source: input
        description: "FK -> StudentAthlete.id; subject of the certification"
      - name: term_id
        type: string
        source: input
        description: "FK -> Term.id; the competition term this certification governs"
      - name: certification_type
        type: enum
        source: input
        description: "INITIAL for the entry term of a NATIVE student, TRANSFER for the entry term of an INCOMING_TRANSFER, CONTINUING for every later term"
        constraints: "one of INITIAL, CONTINUING, TRANSFER"
      - name: status
        type: enum
        source: computed
        description: "Certification lifecycle; only one non-SUPERSEDED row may exist per (student_athlete_id, term_id)"
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, CERTIFIED, DENIED, REVOKED, RESTORED, SUPERSEDED"
      - name: audit_variant
        type: enum
        source: computed
        description: "Variant of degree_applicable_credit_audit pinned for this certification: CATALOG_AT_ENTRY when major_declared_term_index <= entry_term_index, else CATALOG_AT_CERTIFICATION"
        constraints: "one of CATALOG_AT_ENTRY, CATALOG_AT_CERTIFICATION"
      - name: degree_applicable_credits_counted
        type: number
        source: computed
        description: "Snapshot of degree_applicable_credit_audit output at the moment of creation, plus credit_relief_applied"
        default: 0
      - name: required_progress_pct
        type: number
        source: computed
        description: "Progress-toward-degree benchmark for this certification, from progress_benchmark_evaluation"
        default: 0
      - name: progress_pct
        type: number
        source: computed
        description: "degree_applicable_credits_counted / DegreeProgram.total_required_credits, round_half_up to 4 decimals"
        default: 0
      - name: gpa_at_certification
        type: number
        source: computed
        description: "Snapshot of StudentAthlete.cumulative_gpa at creation or at the latest re-evaluation"
        default: 0
      - name: completed_full_time_terms_counted
        type: integer
        source: computed
        description: "Count of completed full-time terms with term_index < the certification term's term_index"
        default: 0
      - name: benchmark_result
        type: enum
        source: computed
        description: "PASS when progress_pct >= required_progress_pct AND gpa_at_certification >= DegreeProgram.min_progress_gpa, else FAIL"
        default: FAIL
        constraints: "one of PASS, FAIL"
      - name: failure_reasons
        type: array
        source: computed
        description: "Benchmark failure codes in fixed order: PROGRESS_BELOW_BENCHMARK before GPA_BELOW_MINIMUM; empty when benchmark_result == PASS"
        default: []
      - name: credit_relief_applied
        type: number
        source: computed
        description: "Degree-applicable credits granted by a GRANTED EligibilityAppeal and folded into this certification"
        default: 0
      - name: requested_by_user_id
        type: string
        source: system
        description: "X-User-ID of the AcademicAdvisor who created the certification"
      - name: decided_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the CertificationOfficer who decided; segregation of duties forbids equality with requested_by_user_id"
        default: null
      - name: decided_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the CERTIFY or DENY decision"
        default: null

  # --------------------------------------------------------------- Tutor ------
  - name: Tutor
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Tutor name"
      - name: subject_codes
        type: array
        source: input
        description: "Course subject_code values this tutor is cleared to support"
        default: []
      - name: status
        type: enum
        source: computed
        description: "Training and standing of the tutor; only TRAINED tutors may hold ACTIVE assignments or have sessions logged"
        default: UNTRAINED
        constraints: "one of UNTRAINED, TRAINED, EXPIRED, SUSPENDED, TERMINATED"
      - name: training_completed_term_index
        type: integer
        source: computed
        description: "Term.term_index in force (per the logical clock) when compliance training was last completed"
        default: null
      - name: training_valid_through_term_index
        type: integer
        source: computed
        description: "training_completed_term_index + TRAINING_VALIDITY_TERMS - 1; sessions in later terms are rejected"
        default: null
      - name: penalty_points
        type: number
        source: computed
        description: "Sum of penalty_points_assessed over ComplianceIncident rows naming this tutor with status IN {SUBSTANTIATED, REMEDIATED}"
        default: 0
      - name: max_weekly_hours
        type: number
        source: input
        description: "Ceiling on the sum of weekly_hours across this tutor's ACTIVE assignments"
        default: 20
        constraints: "> 0 and <= 40"
      - name: assigned_weekly_hours
        type: number
        source: computed
        description: "Sum of TutorAssignment.weekly_hours over rows with status == ACTIVE; the conserved capacity invariant is assigned_weekly_hours == that sum after every transition"
        default: 0

  # ----------------------------------------------------- TutorAssignment ------
  - name: TutorAssignment
    parent: null
    common_fields: true
    fields:
      - name: tutor_id
        type: string
        source: input
        description: "FK -> Tutor.id; the assigned tutor"
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the student/course/term context of the tutoring"
      - name: weekly_hours
        type: number
        source: input
        description: "Contracted tutoring hours per week"
        constraints: "> 0 and <= 10"
      - name: status
        type: enum
        source: computed
        description: "Assignment lifecycle; ACTIVE and SUSPENDED alternate freely until a terminal transition"
        default: PROPOSED
        constraints: "one of PROPOSED, ACTIVE, SUSPENDED, COMPLETED, TERMINATED"
      - name: suspension_count
        type: integer
        source: computed
        description: "Number of ACTIVE -> SUSPENDED transitions this assignment has undergone"
        default: 0
      - name: terminated_reason
        type: enum
        source: computed
        description: "Why the assignment ended; written on the transition into TERMINATED or COMPLETED"
        default: null
        constraints: "one of TUTOR_SUSPENDED, SPECIALIST_REQUEST, TERM_CLOSED, INCIDENT_SUBSTANTIATED, ENROLLMENT_DROPPED when present"
      - name: logged_hours
        type: number
        source: computed
        description: "Sum of SupportSession.hours_credited over sessions referencing this assignment; round_half_up to 2 decimals"
        default: 0

  # ------------------------------------------------------- SupportSession -----
  - name: SupportSession
    parent: null
    common_fields: false
    fields:
      - name: student_athlete_id
        type: string
        source: input
        description: "FK -> StudentAthlete.id; the student who attended"
      - name: tutor_assignment_id
        type: string
        source: input
        description: "FK -> TutorAssignment.id; null for an unsupervised STUDY_HALL session"
        default: null
      - name: session_type
        type: enum
        source: input
        description: "STUDY_HALL for monitored independent work, TUTOR_SESSION for supervised tutoring (requires tutor_assignment_id)"
        constraints: "one of STUDY_HALL, TUTOR_SESSION"
      - name: start_at
        type: datetime
        source: input
        description: "ISO 8601 UTC instant at which the session begins; INCLUSIVE bound of the occupied interval"
      - name: end_at
        type: datetime
        source: input
        description: "ISO 8601 UTC instant at which the session ends; EXCLUSIVE bound of the occupied interval. Must be strictly after start_at"
      - name: hours_credited
        type: number
        source: computed
        description: "(end_at - start_at) in minutes / 60, round_half_up to 2 decimals"
        default: 0
      - name: term_index_of_record
        type: integer
        source: computed
        description: "term_index of the unique Term whose [start_date, end_date) window contains start_at; the session is rejected when no such Term exists"
      - name: logged_by_user_id
        type: string
        source: system
        description: "X-User-ID of the LearningSpecialist or Tutor who logged the session"

  # ----------------------------------------------------- CompetitionEvent -----
  - name: CompetitionEvent
    parent: null
    common_fields: true
    fields:
      - name: sport_code
        type: enum
        source: input
        description: "Squad travelling to the event"
        constraints: "one of MBB, WBB, FB, BASE, SOC, TRACK"
      - name: term_id
        type: string
        source: input
        description: "FK -> Term.id; the term containing the travel window"
      - name: event_type
        type: enum
        source: input
        description: "Competition category; selects missed_class_unit_multiplier"
        constraints: "one of REGULAR_SEASON, CONFERENCE_CHAMPIONSHIP, POSTSEASON, EXHIBITION"
      - name: departure_at
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the travel party departs; INCLUSIVE bound of the travel window"
      - name: return_at
        type: datetime
        source: input
        description: "ISO 8601 UTC instant the travel party returns; EXCLUSIVE bound of the travel window. Must be strictly after departure_at"
      - name: status
        type: enum
        source: computed
        description: "Travel lifecycle; missed-class requests may only be filed against a TRAVEL_APPROVED event"
        default: SCHEDULED
        constraints: "one of SCHEDULED, TRAVEL_APPROVED, IN_TRAVEL, COMPLETED, CANCELLED"
      - name: missed_class_unit_multiplier
        type: number
        source: computed
        description: "1.0 for REGULAR_SEASON and EXHIBITION, 0.5 for CONFERENCE_CHAMPIONSHIP, 0.0 for POSTSEASON (exempt travel)"
        default: 1.0
      - name: charged_units_total
        type: number
        source: computed
        description: "Sum of MissedClassRequest.missed_units over rows for this event with status IN {DRAFT, PENDING_ACKNOWLEDGEMENT, ACKNOWLEDGED, DISPUTED}; round_half_up to 2 decimals"
        default: 0

  # -------------------------------------------------- MissedClassRequest ------
  - name: MissedClassRequest
    parent: null
    common_fields: true
    fields:
      - name: competition_event_id
        type: string
        source: input
        description: "FK -> CompetitionEvent.id; the travel that causes the absence"
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the course whose meetings are missed"
      - name: status
        type: enum
        source: computed
        description: "Notification lifecycle; DRAFT, PENDING_ACKNOWLEDGEMENT, ACKNOWLEDGED and DISPUTED all hold the charged units, CANCELLED and VOIDED release them"
        default: DRAFT
        constraints: "one of DRAFT, PENDING_ACKNOWLEDGEMENT, ACKNOWLEDGED, DISPUTED, CANCELLED, VOIDED"
      - name: missed_meeting_count
        type: integer
        source: computed
        description: "Number of course meetings whose [meeting_start, meeting_end) window overlaps the travel window by at least one minute"
        default: 0
      - name: missed_units_gross
        type: number
        source: computed
        description: "Sum of per-meeting units, each rounded to 2 decimals BEFORE summing (see missed_class_units)"
        default: 0
      - name: missed_units
        type: number
        source: computed
        description: "missed_units_gross * CompetitionEvent.missed_class_unit_multiplier, round_half_up to 2 decimals; the amount charged against the student's allowance"
        default: 0
      - name: instructor_user_id
        type: string
        source: computed
        description: "Opaque operator id copied from the enrolled Course.instructor_user_id at notification; the only id permitted to acknowledge or dispute"
        default: null
      - name: notified_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the instructor notification; null while status == DRAFT"
        default: null
      - name: acknowledgement_deadline_at
        type: datetime
        source: computed
        description: "notified_at + ACKNOWLEDGEMENT_WINDOW_HOURS (72); acknowledging or disputing after this instant is rejected"
        default: null
      - name: instructor_response_note
        type: string
        source: input
        description: "Free-text note supplied with the instructor's acknowledgement or dispute"
        default: null
      - name: dispute_count
        type: integer
        source: computed
        description: "Number of times the instructor has moved this request into DISPUTED"
        default: 0

  # ------------------------------------------------------ EligibilityAppeal ---
  - name: EligibilityAppeal
    parent: null
    common_fields: true
    fields:
      - name: certification_id
        type: string
        source: input
        description: "FK -> EligibilityCertification.id; the DENIED or REVOKED decision under appeal"
      - name: predecessor_appeal_id
        type: string
        source: input
        description: "FK -> EligibilityAppeal.id; the REVISION_REQUESTED appeal round this row continues; null on a first-round appeal"
        default: null
      - name: appeal_type
        type: enum
        source: input
        description: "Basis of the waiver request"
        constraints: "one of PROGRESS_WAIVER, MISSED_CLASS_EXCEPTION, TRANSFER_EXCEPTION, ASSISTANCE_REINSTATEMENT"
      - name: status
        type: enum
        source: computed
        description: "Appeal lifecycle; REVISION_REQUESTED returns to SUBMITTED for another committee round"
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, COMMITTEE_REVIEW, GRANTED, DENIED, REVISION_REQUESTED, WITHDRAWN"
      - name: round_number
        type: integer
        source: computed
        description: "1 on first submission, incremented on every REVISION_REQUESTED -> SUBMITTED transition; capped at MAX_APPEAL_ROUNDS"
        default: 1
      - name: requested_credit_relief
        type: number
        source: input
        description: "Degree-applicable credits the appeal asks the committee to waive"
        default: 0
        constraints: ">= 0 and <= 12"
      - name: granted_credit_relief
        type: number
        source: computed
        description: "Credits actually granted at the GRANT decision; folded into the certification's credit_relief_applied"
        default: 0
      - name: rationale
        type: string
        source: input
        description: "Narrative supporting the waiver"
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the AcademicAdvisor who created the appeal"
      - name: decided_by_user_id
        type: string
        source: computed
        description: "X-User-ID of the AppealsCommittee member who decided; segregation of duties forbids equality with submitted_by_user_id"
        default: null
      - name: decided_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the committee decision"
        default: null

  # ------------------------------------------------------ ComplianceIncident --
  - name: ComplianceIncident
    parent: null
    common_fields: true
    fields:
      - name: student_athlete_id
        type: string
        source: input
        description: "FK -> StudentAthlete.id; the student who received the assistance"
      - name: tutor_id
        type: string
        source: input
        description: "FK -> Tutor.id; the tutor implicated, null when no tutor is involved"
        default: null
      - name: discovered_session_id
        type: string
        source: input
        description: "FK -> SupportSession.id; the logged session in which the conduct was observed, null when the report is not session-based"
        default: null
      - name: incident_type
        type: enum
        source: input
        description: "Category of impermissible academic assistance"
        constraints: "one of IMPERMISSIBLE_WORK_COMPLETION, UNAUTHORIZED_EXAM_ASSISTANCE, UNTRAINED_TUTOR_SESSION, EXCESSIVE_TUTOR_HOURS"
      - name: severity
        type: enum
        source: input
        description: "Severity assigned at substantiation; supplied with the SUBSTANTIATE action and null before it"
        default: null
        constraints: "one of LEVEL_I, LEVEL_II, LEVEL_III when present"
      - name: status
        type: enum
        source: computed
        description: "Investigation lifecycle"
        default: REPORTED
        constraints: "one of REPORTED, UNDER_INVESTIGATION, SUBSTANTIATED, UNSUBSTANTIATED, REMEDIATED"
      - name: penalty_points_assessed
        type: number
        source: computed
        description: "INCIDENT_POINTS[severity] written at substantiation: LEVEL_I=1, LEVEL_II=2, LEVEL_III=3; 0 otherwise"
        default: 0
      - name: narrative
        type: string
        source: input
        description: "Description of the reported conduct"
      - name: reported_by_user_id
        type: string
        source: system
        description: "X-User-ID of the reporter"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------- EligibilityCertification ----
  # Shape: branching with revert plus a cycle (CERTIFIED -> REVOKED -> RESTORED -> REVOKED).
  - entity: EligibilityCertification
    state_field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /athletics/certifications/{certification_id}/status with action=SUBMIT"
        actor: AcademicAdvisor
        preconditions:
          - "certification.status == DRAFT"
          - "Term(certification.term_id).apr_status == OPEN"
          - "StudentAthlete(certification.student_athlete_id).support_status != SUPPORT_WITHHELD"
          - "when certification_type == CONTINUING: StudentAthlete.declared_program_id IS NOT NULL"
          - "when certification_type == CONTINUING and StudentAthlete.completed_full_time_terms > DegreeProgram.major_declaration_deadline_term_count: rejected"
          - "when certification_type == TRANSFER: StudentAthlete.completed_full_time_terms >= 1 counting only Enrollment rows with credit_source == RESIDENT"
        side_effects:
          - "re-runs degree_applicable_credit_audit and progress_benchmark_evaluation and rewrites degree_applicable_credits_counted, progress_pct, required_progress_pct, gpa_at_certification, completed_full_time_terms_counted, benchmark_result, failure_reasons"
          - "increments EligibilityCertification.version by 1"
      - from: SUBMITTED
        to: CERTIFIED
        trigger: "POST /athletics/certifications/{certification_id}/status with action=CERTIFY"
        actor: CertificationOfficer
        preconditions:
          - "certification.status == SUBMITTED"
          - "certification.benchmark_result == PASS"
          - "Term(certification.term_id).apr_status == OPEN"
          - "X-User-ID != certification.requested_by_user_id (segregation of duties)"
        side_effects:
          - "writes decided_by_user_id = X-User-ID and decided_at = logical clock"
          - "because status became CERTIFIED, StudentAthlete.eligibility_state is re-derived to CERTIFIED when declared_program_id IS NOT NULL, otherwise to PROVISIONALLY_CERTIFIED"
          - "increments StudentAthlete.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /athletics/certifications/{certification_id}/status with action=DENY"
        actor: CertificationOfficer
        preconditions:
          - "certification.status == SUBMITTED"
          - "Term(certification.term_id).apr_status == OPEN"
          - "X-User-ID != certification.requested_by_user_id (segregation of duties)"
        side_effects:
          - "writes decided_by_user_id = X-User-ID and decided_at = logical clock"
          - "because status became DENIED, StudentAthlete.eligibility_state is re-derived to INELIGIBLE"
          - "increments StudentAthlete.version by 1"
      - from: CERTIFIED
        to: REVOKED
        trigger: "POST /athletics/certifications/{certification_id}/status with action=REVOKE, or system cascade from a SUBSTANTIATED LEVEL_III ComplianceIncident"
        actor: CertificationOfficer | system
        preconditions:
          - "certification.status IN {CERTIFIED, RESTORED}"
          - "Term(certification.term_id).apr_status == OPEN"
        side_effects:
          - "because status became REVOKED, StudentAthlete.eligibility_state is re-derived to INELIGIBLE"
          - "increments StudentAthlete.version by 1"
      - from: RESTORED
        to: REVOKED
        trigger: "POST /athletics/certifications/{certification_id}/status with action=REVOKE"
        actor: CertificationOfficer | system
        preconditions:
          - "certification.status == RESTORED"
          - "Term(certification.term_id).apr_status == OPEN"
        side_effects:
          - "because status became REVOKED, StudentAthlete.eligibility_state is re-derived to INELIGIBLE"
          - "increments StudentAthlete.version by 1"
        note: "Closes the cycle CERTIFIED -> REVOKED -> RESTORED -> REVOKED; a certification may be restored and revoked any number of times while the term stays OPEN."
      - from: DENIED
        to: RESTORED
        trigger: "system cascade from POST /athletics/appeals/{appeal_id}/status with action=GRANT"
        actor: system
        preconditions:
          - "certification.status IN {DENIED, REVOKED}"
          - "the granting appeal's re-evaluated benchmark_result == PASS after credit_relief_applied is folded in"
          - "Term(certification.term_id).apr_status == OPEN"
        side_effects:
          - "adds granted_credit_relief to credit_relief_applied and re-runs progress_benchmark_evaluation"
          - "because status became RESTORED, StudentAthlete.eligibility_state is re-derived to RESTORED_BY_WAIVER"
          - "increments StudentAthlete.version by 1"
      - from: REVOKED
        to: RESTORED
        trigger: "system cascade from POST /athletics/appeals/{appeal_id}/status with action=GRANT"
        actor: system
        preconditions:
          - "certification.status == REVOKED"
          - "the granting appeal's re-evaluated benchmark_result == PASS after credit_relief_applied is folded in"
          - "Term(certification.term_id).apr_status == OPEN"
        side_effects:
          - "adds granted_credit_relief to credit_relief_applied and re-runs progress_benchmark_evaluation"
          - "because status became RESTORED, StudentAthlete.eligibility_state is re-derived to RESTORED_BY_WAIVER"
          - "increments StudentAthlete.version by 1"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system cascade from POST /athletics/certifications creating a new row for the same (student_athlete_id, term_id)"
        actor: system
        preconditions:
          - "the existing row's status == DRAFT"
        side_effects:
          - "the superseded row keeps its snapshot fields frozen and accepts no further transitions"
          - "increments EligibilityCertification.version by 1 on the superseded row"

  # -------------------------------------------------------- EligibilityAppeal -
  # Shape: cyclic (REVISION_REQUESTED -> SUBMITTED) with a bounded round counter.
  - entity: EligibilityAppeal
    state_field: status
    initial_state: DRAFT
    terminal_states: [GRANTED, DENIED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /athletics/appeals/{appeal_id}/status with action=SUBMIT"
        actor: AcademicAdvisor
        preconditions:
          - "appeal.status == DRAFT"
          - "EligibilityCertification(appeal.certification_id).status IN {DENIED, REVOKED}"
          - "Term of the appealed certification has apr_status == OPEN"
        side_effects:
          - "sets round_number = 1"
      - from: SUBMITTED
        to: COMMITTEE_REVIEW
        trigger: "POST /athletics/appeals/{appeal_id}/status with action=OPEN_REVIEW"
        actor: AppealsCommittee
        preconditions:
          - "appeal.status == SUBMITTED"
          - "Term of the appealed certification has apr_status == OPEN"
        side_effects:
          - "no field changes beyond status and updated_at"
      - from: COMMITTEE_REVIEW
        to: GRANTED
        trigger: "POST /athletics/appeals/{appeal_id}/status with action=GRANT"
        actor: AppealsCommittee
        preconditions:
          - "appeal.status == COMMITTEE_REVIEW"
          - "Term of the appealed certification has apr_status == OPEN"
          - "X-User-ID != appeal.submitted_by_user_id (segregation of duties)"
          - "granted_credit_relief <= appeal.requested_credit_relief"
        side_effects:
          - "writes granted_credit_relief, decided_by_user_id, decided_at"
          - "because granted_credit_relief was written, EligibilityCertification.credit_relief_applied increases and progress_benchmark_evaluation re-runs on that certification"
          - "because the certification's benchmark_result flipped to PASS, the certification transitions DENIED|REVOKED -> RESTORED"
          - "because the certification became RESTORED, StudentAthlete.eligibility_state becomes RESTORED_BY_WAIVER and degree_applicable_credits is rewritten"
          - "increments StudentAthlete.version by 1"
      - from: COMMITTEE_REVIEW
        to: DENIED
        trigger: "POST /athletics/appeals/{appeal_id}/status with action=DENY"
        actor: AppealsCommittee
        preconditions:
          - "appeal.status == COMMITTEE_REVIEW"
          - "Term of the appealed certification has apr_status == OPEN"
          - "X-User-ID != appeal.submitted_by_user_id (segregation of duties)"
        side_effects:
          - "writes decided_by_user_id and decided_at; the appealed certification keeps its status"
      - from: COMMITTEE_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /athletics/appeals/{appeal_id}/status with action=REQUEST_REVISION"
        actor: AppealsCommittee
        preconditions:
          - "appeal.status == COMMITTEE_REVIEW"
          - "appeal.round_number < MAX_APPEAL_ROUNDS"
          - "Term of the appealed certification has apr_status == OPEN"
        side_effects:
          - "writes decided_by_user_id and decided_at for the round"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /athletics/appeals/{appeal_id}/status with action=SUBMIT"
        actor: AcademicAdvisor
        preconditions:
          - "appeal.status == REVISION_REQUESTED"
          - "appeal.round_number < MAX_APPEAL_ROUNDS"
          - "Term of the appealed certification has apr_status == OPEN"
        side_effects:
          - "increments round_number by 1 and clears decided_by_user_id and decided_at"
        note: "This edge closes the revision cycle; a fourth submission is rejected because round_number would exceed MAX_APPEAL_ROUNDS."
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /athletics/appeals/{appeal_id}/status with action=WITHDRAW"
        actor: AcademicAdvisor
        preconditions:
          - "appeal.status IN {DRAFT, SUBMITTED, REVISION_REQUESTED}"
        side_effects:
          - "the appeal accepts no further transitions"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /athletics/appeals/{appeal_id}/status with action=WITHDRAW"
        actor: AcademicAdvisor
        preconditions:
          - "appeal.status IN {DRAFT, SUBMITTED, REVISION_REQUESTED}"
        side_effects:
          - "the appeal accepts no further transitions"

  # ---------------------------------- StudentAthlete (dimension 1 of 2) -------
  # Independent state dimension: eligibility_state, derived from the governing
  # certification. Evolves without reference to support_status.
  - entity: StudentAthlete
    state_field: eligibility_state
    initial_state: NOT_CERTIFIED
    terminal_states: []
    transitions:
      - from: NOT_CERTIFIED
        to: CERTIFIED
        trigger: "system re-derivation after a certification reaches CERTIFIED"
        actor: system
        preconditions:
          - "the governing certification (highest Term.term_index among non-SUPERSEDED rows for this student) has status == CERTIFIED"
          - "student.declared_program_id IS NOT NULL"
        side_effects:
          - "no other field changes; support_status is untouched by this transition"
      - from: NOT_CERTIFIED
        to: PROVISIONALLY_CERTIFIED
        trigger: "system re-derivation after a certification reaches CERTIFIED"
        actor: system
        preconditions:
          - "the governing certification has status == CERTIFIED"
          - "student.declared_program_id IS NULL"
        side_effects:
          - "no other field changes"
      - from: PROVISIONALLY_CERTIFIED
        to: CERTIFIED
        trigger: "POST /athletics/student-athletes/{student_athlete_id}/major-declaration"
        actor: AcademicAdvisor
        preconditions:
          - "the governing certification has status == CERTIFIED"
          - "declared_program_id transitions from NULL to a DegreeProgram id"
        side_effects:
          - "writes major_declared_term_index from the logical clock's term"
          - "because declared_program_id was written, degree_applicable_credit_audit re-runs and degree_applicable_credits and progress_pct are rewritten"
      - from: CERTIFIED
        to: INELIGIBLE
        trigger: "system re-derivation after the governing certification reaches DENIED or REVOKED"
        actor: system
        preconditions:
          - "the governing certification has status IN {DENIED, REVOKED}"
        side_effects:
          - "no other field changes; support_status is untouched by this transition"
      - from: INELIGIBLE
        to: RESTORED_BY_WAIVER
        trigger: "system re-derivation after the governing certification reaches RESTORED"
        actor: system
        preconditions:
          - "the governing certification has status == RESTORED"
        side_effects:
          - "no other field changes"
      - from: RESTORED_BY_WAIVER
        to: INELIGIBLE
        trigger: "system re-derivation after the governing certification is revoked again"
        actor: system
        preconditions:
          - "the governing certification has status == REVOKED"
        side_effects:
          - "no other field changes"

  # ---------------------------------- StudentAthlete (dimension 2 of 2) -------
  # Independent state dimension: support_status, a pure function of risk_tier,
  # apr_points_forfeited and substantiated incidents. Recomputed after every
  # mutation that touches those inputs, never by a certification decision.
  - entity: StudentAthlete
    state_field: support_status
    initial_state: SUPPORT_NORMAL
    terminal_states: []
    transitions:
      - from: SUPPORT_NORMAL
        to: SUPPORT_MANDATED
        trigger: "system re-derivation after risk_score is recomputed (enrollment outcome, missed-class charge or release, tutor-assignment status change)"
        actor: system
        preconditions:
          - "no ComplianceIncident for this student has status IN {SUBSTANTIATED, REMEDIATED} with severity == LEVEL_III"
          - "apr_points_forfeited < 2"
          - "risk_tier IN {TIER_2, TIER_3}"
        side_effects:
          - "required_study_hall_hours is rewritten by support_requirement_hours"
      - from: SUPPORT_MANDATED
        to: SUPPORT_NORMAL
        trigger: "system re-derivation after risk_score is recomputed downward"
        actor: system
        preconditions:
          - "risk_tier == TIER_1"
          - "apr_points_forfeited < 2"
          - "no LEVEL_III substantiated incident exists for this student"
        side_effects:
          - "required_study_hall_hours is rewritten by support_requirement_hours"
      - from: SUPPORT_MANDATED
        to: SUPPORT_PROBATION
        trigger: "system re-derivation after risk_score recompute or after POST /athletics/terms/{term_id}/apr-close"
        actor: system
        preconditions:
          - "risk_tier == TIER_4 OR apr_points_forfeited >= 2"
          - "no LEVEL_III substantiated incident exists for this student"
        side_effects:
          - "required_study_hall_hours is rewritten by support_requirement_hours"
      - from: SUPPORT_NORMAL
        to: SUPPORT_PROBATION
        trigger: "system re-derivation after POST /athletics/terms/{term_id}/apr-close forfeits both points"
        actor: system
        preconditions:
          - "apr_points_forfeited >= 2"
          - "no LEVEL_III substantiated incident exists for this student"
        side_effects:
          - "required_study_hall_hours is rewritten by support_requirement_hours"
      - from: SUPPORT_PROBATION
        to: SUPPORT_MANDATED
        trigger: "system re-derivation after risk_score is recomputed downward"
        actor: system
        preconditions:
          - "risk_tier IN {TIER_2, TIER_3}"
          - "apr_points_forfeited < 2"
          - "no LEVEL_III substantiated incident exists for this student"
        side_effects:
          - "required_study_hall_hours is rewritten by support_requirement_hours"
      - from: SUPPORT_PROBATION
        to: SUPPORT_WITHHELD
        trigger: "system cascade from POST /athletics/compliance-incidents/{incident_id}/status with action=SUBSTANTIATE and severity=LEVEL_III"
        actor: system
        preconditions:
          - "a ComplianceIncident for this student has status == SUBSTANTIATED with severity == LEVEL_III"
        side_effects:
          - "blocks certification submission and every SupportSession log for this student"
      - from: SUPPORT_MANDATED
        to: SUPPORT_WITHHELD
        trigger: "system cascade from POST /athletics/compliance-incidents/{incident_id}/status with action=SUBSTANTIATE and severity=LEVEL_III"
        actor: system
        preconditions:
          - "a ComplianceIncident for this student has status == SUBSTANTIATED with severity == LEVEL_III"
        side_effects:
          - "blocks certification submission and every SupportSession log for this student"
      - from: SUPPORT_NORMAL
        to: SUPPORT_WITHHELD
        trigger: "system cascade from POST /athletics/compliance-incidents/{incident_id}/status with action=SUBSTANTIATE and severity=LEVEL_III"
        actor: system
        preconditions:
          - "a ComplianceIncident for this student has status == SUBSTANTIATED with severity == LEVEL_III"
        side_effects:
          - "blocks certification submission and every SupportSession log for this student"
      - from: SUPPORT_WITHHELD
        to: SUPPORT_MANDATED
        trigger: "system cascade from POST /athletics/compliance-incidents/{incident_id}/status with action=REMEDIATE"
        actor: system
        preconditions:
          - "every LEVEL_III incident for this student has status == REMEDIATED"
          - "risk_tier IN {TIER_2, TIER_3} and apr_points_forfeited < 2"
        side_effects:
          - "required_study_hall_hours is rewritten by support_requirement_hours"

  # -------------------------------------------------------------- Enrollment --
  - entity: Enrollment
    state_field: status
    initial_state: ENROLLED
    terminal_states: [COMPLETED, DROPPED, WITHDRAWN]
    transitions:
      - from: ENROLLED
        to: COMPLETED
        trigger: "POST /athletics/enrollments/{enrollment_id}/outcome with action=RECORD_GRADE"
        actor: Registrar
        preconditions:
          - "enrollment.status IN {ENROLLED, INCOMPLETE}"
          - "grade IN {A, B, C, D, F} is supplied"
          - "Term(enrollment.term_id).apr_status == OPEN"
        side_effects:
          - "writes grade, grade_points, earned_credit_hours, is_full_time_countable, outcome_recorded_at"
          - "because earned_credit_hours changed, StudentAthlete.cumulative_gpa, completed_full_time_terms, degree_applicable_credits and progress_pct are recomputed"
          - "because those inputs changed, academic_risk_score re-runs and rewrites risk_score and risk_tier"
          - "because risk_tier changed, support_requirement_hours re-runs and rewrites required_study_hall_hours, then support_status is re-derived"
          - "increments StudentAthlete.version by 1"
      - from: INCOMPLETE
        to: COMPLETED
        trigger: "POST /athletics/enrollments/{enrollment_id}/outcome with action=RECORD_GRADE"
        actor: Registrar
        preconditions:
          - "enrollment.status == INCOMPLETE"
          - "grade IN {A, B, C, D, F} is supplied"
          - "Term(enrollment.term_id).apr_status == OPEN"
        side_effects:
          - "same recomputation chain as ENROLLED -> COMPLETED"
      - from: ENROLLED
        to: INCOMPLETE
        trigger: "POST /athletics/enrollments/{enrollment_id}/outcome with action=MARK_INCOMPLETE"
        actor: Registrar
        preconditions:
          - "enrollment.status == ENROLLED"
          - "Term(enrollment.term_id).apr_status == OPEN"
        side_effects:
          - "earned_credit_hours stays 0 and the term does not count as a completed full-time term"
      - from: ENROLLED
        to: DROPPED
        trigger: "POST /athletics/enrollments/{enrollment_id}/outcome with action=DROP"
        actor: Registrar
        preconditions:
          - "enrollment.status == ENROLLED"
          - "Term(enrollment.term_id).apr_status == OPEN"
        side_effects:
          - "sets earned_credit_hours = 0 and degree_applicable_credits_counted = 0"
          - "because the enrollment left ENROLLED, every TutorAssignment referencing it with status IN {PROPOSED, ACTIVE} moves to TERMINATED with terminated_reason = ENROLLMENT_DROPPED, ordered by TutorAssignment.created_at ASC"
          - "because those assignments left ACTIVE, Tutor.assigned_weekly_hours is decreased by each assignment's weekly_hours"
          - "because assigned tutor hours fell, support_requirement_hours re-runs for the student and support_status is re-derived"
      - from: ENROLLED
        to: WITHDRAWN
        trigger: "POST /athletics/enrollments/{enrollment_id}/outcome with action=WITHDRAW"
        actor: Registrar
        preconditions:
          - "enrollment.status IN {ENROLLED, INCOMPLETE}"
          - "Term(enrollment.term_id).apr_status == OPEN"
        side_effects:
          - "sets earned_credit_hours = 0; the term cannot become a completed full-time term through this row"
          - "the same TutorAssignment termination cascade as DROP runs"

  # ------------------------------------------------------------------- Tutor --
  # Shape: cyclic (TRAINED -> EXPIRED -> TRAINED, TRAINED -> SUSPENDED -> TRAINED).
  - entity: Tutor
    state_field: status
    initial_state: UNTRAINED
    terminal_states: [TERMINATED]
    transitions:
      - from: UNTRAINED
        to: TRAINED
        trigger: "POST /athletics/tutors/{tutor_id}/status with action=COMPLETE_TRAINING"
        actor: LearningSpecialist
        preconditions:
          - "tutor.status IN {UNTRAINED, EXPIRED}"
        side_effects:
          - "writes training_completed_term_index from the Term containing the logical clock and training_valid_through_term_index = training_completed_term_index + TRAINING_VALIDITY_TERMS - 1"
      - from: EXPIRED
        to: TRAINED
        trigger: "POST /athletics/tutors/{tutor_id}/status with action=COMPLETE_TRAINING"
        actor: LearningSpecialist
        preconditions:
          - "tutor.status == EXPIRED"
        side_effects:
          - "rewrites training_completed_term_index and training_valid_through_term_index from the current logical clock"
        note: "Retraining closes the TRAINED -> EXPIRED -> TRAINED cycle."
      - from: TRAINED
        to: EXPIRED
        trigger: "system cascade from POST /athletics/terms/{term_id}/apr-close"
        actor: system
        preconditions:
          - "tutor.status == TRAINED"
          - "tutor.training_valid_through_term_index <= the closed Term.term_index"
        side_effects:
          - "because the tutor expired, every TutorAssignment of this tutor with status IN {PROPOSED, ACTIVE} whose Enrollment.term_id == the closed term moves to COMPLETED with terminated_reason = TERM_CLOSED, ordered by TutorAssignment.created_at ASC"
          - "because those assignments left ACTIVE, Tutor.assigned_weekly_hours is decreased by each assignment's weekly_hours"
      - from: TRAINED
        to: SUSPENDED
        trigger: "POST /athletics/tutors/{tutor_id}/status with action=SUSPEND, or system cascade when penalty_points >= TUTOR_SUSPENSION_POINT_THRESHOLD"
        actor: LearningSpecialist | system
        preconditions:
          - "tutor.status IN {TRAINED, EXPIRED}"
        side_effects:
          - "because the tutor was suspended, every TutorAssignment of this tutor with status IN {PROPOSED, ACTIVE} moves to TERMINATED with terminated_reason = TUTOR_SUSPENDED, ordered by TutorAssignment.created_at ASC"
          - "because those assignments left ACTIVE, Tutor.assigned_weekly_hours is decreased by each assignment's weekly_hours to a floor of 0"
          - "because assigned tutor hours fell, support_requirement_hours re-runs for every affected StudentAthlete and support_status is re-derived"
      - from: EXPIRED
        to: SUSPENDED
        trigger: "POST /athletics/tutors/{tutor_id}/status with action=SUSPEND, or system cascade when penalty_points reaches TUTOR_SUSPENSION_POINT_THRESHOLD"
        actor: LearningSpecialist | system
        preconditions:
          - "tutor.status == EXPIRED"
        side_effects:
          - "every PROPOSED or ACTIVE TutorAssignment of the tutor is TERMINATED with terminated_reason = TUTOR_SUSPENDED in created_at ASC order and assigned_weekly_hours is released"
      - from: SUSPENDED
        to: TRAINED
        trigger: "POST /athletics/tutors/{tutor_id}/status with action=REINSTATE"
        actor: LearningSpecialist
        preconditions:
          - "tutor.status == SUSPENDED"
          - "every ComplianceIncident naming this tutor with status == SUBSTANTIATED has been moved to REMEDIATED"
        side_effects:
          - "assigned_weekly_hours stays at its post-termination value; new assignments must be created to rebuild capacity"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /athletics/tutors/{tutor_id}/status with action=TERMINATE"
        actor: LearningSpecialist
        preconditions:
          - "tutor.status == SUSPENDED"
        side_effects:
          - "the tutor accepts no further transitions and may not be named on new assignments"

  # --------------------------------------------------------- TutorAssignment --
  # Shape: cyclic (ACTIVE -> SUSPENDED -> ACTIVE).
  - entity: TutorAssignment
    state_field: status
    initial_state: PROPOSED
    terminal_states: [COMPLETED, TERMINATED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /athletics/tutor-assignments/{assignment_id}/status with action=ACTIVATE"
        actor: LearningSpecialist
        preconditions:
          - "assignment.status == PROPOSED"
          - "Tutor(assignment.tutor_id).status == TRAINED"
          - "Enrollment(assignment.enrollment_id).status == ENROLLED"
          - "Tutor.assigned_weekly_hours + assignment.weekly_hours <= Tutor.max_weekly_hours"
        side_effects:
          - "increases Tutor.assigned_weekly_hours by assignment.weekly_hours"
          - "because assigned tutor hours rose, support_requirement_hours re-runs for the student and required_study_hall_hours is rewritten, then support_status is re-derived"
          - "increments StudentAthlete.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /athletics/tutor-assignments/{assignment_id}/status with action=SUSPEND"
        actor: LearningSpecialist
        preconditions:
          - "assignment.status == ACTIVE"
        side_effects:
          - "increments suspension_count by 1"
          - "decreases Tutor.assigned_weekly_hours by assignment.weekly_hours"
          - "because assigned tutor hours fell, support_requirement_hours re-runs for the student and support_status is re-derived"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /athletics/tutor-assignments/{assignment_id}/status with action=REINSTATE"
        actor: LearningSpecialist
        preconditions:
          - "assignment.status == SUSPENDED"
          - "Tutor(assignment.tutor_id).status == TRAINED"
          - "Tutor.assigned_weekly_hours + assignment.weekly_hours <= Tutor.max_weekly_hours"
        side_effects:
          - "increases Tutor.assigned_weekly_hours by assignment.weekly_hours"
          - "because assigned tutor hours rose, support_requirement_hours re-runs for the student and support_status is re-derived"
        note: "Closes the ACTIVE -> SUSPENDED -> ACTIVE cycle; suspension_count is monotonic."
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /athletics/tutor-assignments/{assignment_id}/status with action=TERMINATE, or system cascade from tutor suspension, enrollment drop or LEVEL_III incident substantiation"
        actor: LearningSpecialist | system
        preconditions:
          - "assignment.status IN {PROPOSED, ACTIVE, SUSPENDED}"
        side_effects:
          - "writes terminated_reason (SPECIALIST_REQUEST for the explicit action, TUTOR_SUSPENDED / ENROLLMENT_DROPPED / INCIDENT_SUBSTANTIATED for the cascades)"
          - "decreases Tutor.assigned_weekly_hours by assignment.weekly_hours when the previous status was ACTIVE, leaving assigned_weekly_hours equal to the sum of weekly_hours over the tutor's remaining ACTIVE assignments"
          - "because assigned tutor hours fell, support_requirement_hours re-runs for the student and support_status is re-derived"
      - from: PROPOSED
        to: TERMINATED
        trigger: "POST /athletics/tutor-assignments/{assignment_id}/status with action=TERMINATE, or system cascade from tutor suspension or enrollment drop"
        actor: LearningSpecialist | system
        preconditions:
          - "assignment.status == PROPOSED"
        side_effects:
          - "writes terminated_reason; Tutor.assigned_weekly_hours is unchanged because a PROPOSED assignment never held capacity"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /athletics/tutor-assignments/{assignment_id}/status with action=COMPLETE, or system cascade from POST /athletics/terms/{term_id}/apr-close"
        actor: LearningSpecialist | system
        preconditions:
          - "assignment.status IN {PROPOSED, ACTIVE}"
        side_effects:
          - "writes terminated_reason = TERM_CLOSED for the checkpoint cascade"
          - "decreases Tutor.assigned_weekly_hours by assignment.weekly_hours when the previous status was ACTIVE"

  # ------------------------------------------------------- CompetitionEvent ---
  - entity: CompetitionEvent
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: TRAVEL_APPROVED
        trigger: "POST /athletics/competition-events/{event_id}/status with action=APPROVE_TRAVEL"
        actor: AthleticsOperations
        preconditions:
          - "event.status == SCHEDULED"
          - "Term(event.term_id).apr_status == OPEN"
        side_effects:
          - "missed-class requests may now be filed against this event"
      - from: TRAVEL_APPROVED
        to: IN_TRAVEL
        trigger: "POST /athletics/competition-events/{event_id}/status with action=DEPART"
        actor: AthleticsOperations
        preconditions:
          - "event.status == TRAVEL_APPROVED"
          - "the logical clock is >= event.departure_at"
        side_effects:
          - "no new missed-class request may be created once the event leaves TRAVEL_APPROVED"
      - from: IN_TRAVEL
        to: COMPLETED
        trigger: "POST /athletics/competition-events/{event_id}/status with action=COMPLETE"
        actor: AthleticsOperations
        preconditions:
          - "event.status == IN_TRAVEL"
          - "the logical clock is >= event.return_at"
        side_effects:
          - "charged units stay charged; the event accepts no further transitions"
      - from: TRAVEL_APPROVED
        to: CANCELLED
        trigger: "POST /athletics/competition-events/{event_id}/status with action=CANCEL"
        actor: AthleticsOperations
        preconditions:
          - "event.status IN {SCHEDULED, TRAVEL_APPROVED}"
        side_effects:
          - "because the event was cancelled, every MissedClassRequest for it with status IN {DRAFT, PENDING_ACKNOWLEDGEMENT, ACKNOWLEDGED, DISPUTED} moves to VOIDED, ordered by MissedClassRequest.created_at ASC"
          - "because those requests left the charged set, each student's missed_class_units_charged decreases by that request's missed_units and missed_class_units_remaining increases by the same amount, and CompetitionEvent.charged_units_total becomes 0"
          - "because missed_class_units_charged changed, academic_risk_score re-runs for each affected student and rewrites risk_score and risk_tier"
          - "because risk_tier changed, support_requirement_hours re-runs and rewrites required_study_hall_hours, then support_status is re-derived"
          - "increments StudentAthlete.version by 1 for each affected student"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /athletics/competition-events/{event_id}/status with action=CANCEL"
        actor: AthleticsOperations
        preconditions:
          - "event.status == SCHEDULED"
        side_effects:
          - "no missed-class request can exist yet, so no unit release occurs"

  # ----------------------------------------------------- MissedClassRequest ---
  # Shape: branching with a revert cycle (DISPUTED -> PENDING_ACKNOWLEDGEMENT).
  - entity: MissedClassRequest
    state_field: status
    initial_state: DRAFT
    terminal_states: [CANCELLED, VOIDED]
    transitions:
      - from: DRAFT
        to: PENDING_ACKNOWLEDGEMENT
        trigger: "POST /athletics/missed-class-requests/{request_id}/status with action=NOTIFY_INSTRUCTOR"
        actor: AcademicAdvisor
        preconditions:
          - "request.status == DRAFT"
          - "CompetitionEvent(request.competition_event_id).status == TRAVEL_APPROVED"
          - "the logical clock is at least NOTIFICATION_LEAD_DAYS days before CompetitionEvent.departure_at"
        side_effects:
          - "writes notified_at = logical clock, acknowledgement_deadline_at = notified_at + ACKNOWLEDGEMENT_WINDOW_HOURS, and instructor_user_id copied from the enrolled Course.instructor_user_id"
      - from: PENDING_ACKNOWLEDGEMENT
        to: ACKNOWLEDGED
        trigger: "POST /athletics/missed-class-requests/{request_id}/status with action=ACKNOWLEDGE"
        actor: Instructor
        preconditions:
          - "request.status == PENDING_ACKNOWLEDGEMENT"
          - "X-User-ID == request.instructor_user_id"
          - "the logical clock is <= request.acknowledgement_deadline_at"
        side_effects:
          - "stores instructor_response_note; the charged units stay charged"
      - from: PENDING_ACKNOWLEDGEMENT
        to: DISPUTED
        trigger: "POST /athletics/missed-class-requests/{request_id}/status with action=DISPUTE"
        actor: Instructor
        preconditions:
          - "request.status == PENDING_ACKNOWLEDGEMENT"
          - "X-User-ID == request.instructor_user_id"
          - "the logical clock is <= request.acknowledgement_deadline_at"
        side_effects:
          - "increments dispute_count by 1 and stores instructor_response_note; the charged units stay charged"
      - from: DISPUTED
        to: PENDING_ACKNOWLEDGEMENT
        trigger: "POST /athletics/missed-class-requests/{request_id}/status with action=NOTIFY_INSTRUCTOR"
        actor: AcademicAdvisor
        preconditions:
          - "request.status == DISPUTED"
          - "CompetitionEvent(request.competition_event_id).status == TRAVEL_APPROVED"
          - "request.dispute_count <= MAX_DISPUTE_ROUNDS"
        side_effects:
          - "rewrites notified_at and acknowledgement_deadline_at from the current logical clock"
        note: "Re-notification closes the PENDING_ACKNOWLEDGEMENT -> DISPUTED -> PENDING_ACKNOWLEDGEMENT cycle."
      - from: ACKNOWLEDGED
        to: CANCELLED
        trigger: "POST /athletics/missed-class-requests/{request_id}/status with action=CANCEL"
        actor: AcademicAdvisor
        preconditions:
          - "request.status IN {DRAFT, PENDING_ACKNOWLEDGEMENT, ACKNOWLEDGED, DISPUTED}"
          - "CompetitionEvent(request.competition_event_id).status IN {SCHEDULED, TRAVEL_APPROVED}"
        side_effects:
          - "because the request left the charged set, StudentAthlete.missed_class_units_charged decreases by request.missed_units and missed_class_units_remaining increases by the same amount, restoring missed_class_units_allowance == charged + remaining exactly"
          - "decreases CompetitionEvent.charged_units_total by request.missed_units"
          - "because missed_class_units_charged changed, academic_risk_score and support_requirement_hours re-run and support_status is re-derived"
          - "increments StudentAthlete.version by 1"
      - from: PENDING_ACKNOWLEDGEMENT
        to: CANCELLED
        trigger: "POST /athletics/missed-class-requests/{request_id}/status with action=CANCEL"
        actor: AcademicAdvisor
        preconditions:
          - "request.status IN {DRAFT, PENDING_ACKNOWLEDGEMENT, ACKNOWLEDGED, DISPUTED}"
        side_effects:
          - "same unit-release chain as ACKNOWLEDGED -> CANCELLED"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /athletics/missed-class-requests/{request_id}/status with action=CANCEL"
        actor: AcademicAdvisor
        preconditions:
          - "request.status == DRAFT"
        side_effects:
          - "same unit-release chain as ACKNOWLEDGED -> CANCELLED"
      - from: DISPUTED
        to: CANCELLED
        trigger: "POST /athletics/missed-class-requests/{request_id}/status with action=CANCEL"
        actor: AcademicAdvisor
        preconditions:
          - "request.status == DISPUTED"
        side_effects:
          - "same unit-release chain as ACKNOWLEDGED -> CANCELLED"
      - from: DRAFT
        to: VOIDED
        trigger: "system cascade from POST /athletics/competition-events/{event_id}/status with action=CANCEL"
        actor: system
        preconditions:
          - "the parent CompetitionEvent transitioned to CANCELLED"
        side_effects:
          - "same unit-release chain as the CANCEL action"
      - from: PENDING_ACKNOWLEDGEMENT
        to: VOIDED
        trigger: "system cascade from POST /athletics/competition-events/{event_id}/status with action=CANCEL"
        actor: system
        preconditions:
          - "the parent CompetitionEvent transitioned to CANCELLED"
        side_effects:
          - "same unit-release chain as the CANCEL action"
      - from: DISPUTED
        to: VOIDED
        trigger: "system cascade from POST /athletics/competition-events/{event_id}/status with action=CANCEL"
        actor: system
        preconditions:
          - "the parent CompetitionEvent transitioned to CANCELLED"
        side_effects:
          - "same unit-release chain as the CANCEL action"
      - from: ACKNOWLEDGED
        to: VOIDED
        trigger: "system cascade from POST /athletics/competition-events/{event_id}/status with action=CANCEL"
        actor: system
        preconditions:
          - "the parent CompetitionEvent transitioned to CANCELLED"
        side_effects:
          - "same unit-release chain as the CANCEL action, applied to every non-terminal request of the event in created_at ASC order"

  # ---------------------------------------------------- ComplianceIncident ----
  - entity: ComplianceIncident
    state_field: status
    initial_state: REPORTED
    terminal_states: [UNSUBSTANTIATED, REMEDIATED]
    transitions:
      - from: REPORTED
        to: UNDER_INVESTIGATION
        trigger: "POST /athletics/compliance-incidents/{incident_id}/status with action=OPEN_INVESTIGATION"
        actor: ComplianceOfficer
        preconditions:
          - "incident.status == REPORTED"
        side_effects:
          - "no field changes beyond status and updated_at"
      - from: UNDER_INVESTIGATION
        to: SUBSTANTIATED
        trigger: "POST /athletics/compliance-incidents/{incident_id}/status with action=SUBSTANTIATE and a severity"
        actor: ComplianceOfficer
        preconditions:
          - "incident.status == UNDER_INVESTIGATION"
          - "severity IN {LEVEL_I, LEVEL_II, LEVEL_III} is supplied"
        side_effects:
          - "writes severity and penalty_points_assessed = INCIDENT_POINTS[severity]; StudentAthlete.substantiated_penalty_points increases by the same amount and, when incident.tutor_id IS NOT NULL, Tutor.penalty_points increases by the same amount"
          - "because Tutor.penalty_points reached TUTOR_SUSPENSION_POINT_THRESHOLD, that Tutor transitions TRAINED -> SUSPENDED or EXPIRED -> SUSPENDED; a tutor already UNTRAINED, SUSPENDED or TERMINATED keeps its status"
          - "because the Tutor became SUSPENDED, each of its TutorAssignment rows with status IN {PROPOSED, ACTIVE} transitions to TERMINATED with terminated_reason = TUTOR_SUSPENDED in created_at ASC order and Tutor.assigned_weekly_hours drops by each ACTIVE assignment's weekly_hours"
          - "because those assignments left ACTIVE, support_requirement_hours re-runs for each affected StudentAthlete (the tutor credit falls, so required_study_hall_hours rises) and support_status is re-derived"
          - "when severity == LEVEL_III, the reported student's support_status becomes SUPPORT_WITHHELD and the student's governing certification transitions CERTIFIED|RESTORED -> REVOKED, which re-derives eligibility_state to INELIGIBLE"
          - "increments StudentAthlete.version by 1"
      - from: UNDER_INVESTIGATION
        to: UNSUBSTANTIATED
        trigger: "POST /athletics/compliance-incidents/{incident_id}/status with action=UNSUBSTANTIATE"
        actor: ComplianceOfficer
        preconditions:
          - "incident.status == UNDER_INVESTIGATION"
        side_effects:
          - "penalty_points_assessed stays 0; no penalty propagates to the student or the tutor"
      - from: SUBSTANTIATED
        to: REMEDIATED
        trigger: "POST /athletics/compliance-incidents/{incident_id}/status with action=REMEDIATE"
        actor: ComplianceOfficer
        preconditions:
          - "incident.status == SUBSTANTIATED"
        side_effects:
          - "penalty_points_assessed and the accumulated points stay in place (points are never rolled back)"
          - "because the LEVEL_III incident is now REMEDIATED, support_status is re-derived out of SUPPORT_WITHHELD"

  # ------------------------------------------------------------------- Term ---
  - entity: Term
    state_field: apr_status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /athletics/terms/{term_id}/apr-close"
        actor: ComplianceOfficer
        preconditions:
          - "term.apr_status == OPEN"
          - "term.is_apr_reporting_term == true"
          - "the logical clock is >= term.end_date"
          - "every Term with a lower term_index and is_apr_reporting_term == true has apr_status == CLOSED"
        side_effects:
          - "runs apr_points_award over the term cohort and writes Term.apr_points_possible, Term.apr_points_earned, Term.squad_apr and each cohort StudentAthlete's apr_points_possible, apr_points_earned, apr_points_forfeited"
          - "because apr_points_forfeited changed, support_status is re-derived for each cohort student"
          - "because the term closed, every Tutor with status == TRAINED and training_valid_through_term_index <= term.term_index transitions to EXPIRED"
          - "because those tutors expired, their PROPOSED and ACTIVE assignments in this term transition to COMPLETED with terminated_reason = TERM_CLOSED and Tutor.assigned_weekly_hours is reduced accordingly"
          - "every certification and appeal bound to this term is frozen: later transitions are rejected with ERR_APR_TERM_CLOSED"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: certification-create-stale-student
    parent_entity: StudentAthlete
    write_endpoint: "POST /athletics/certifications"
    occ_field: "expected_student_athlete_version"
    description: |
      Creating an EligibilityCertification against a StudentAthlete whose version has
      advanced since the client last observed it is rejected. Certification creation is a
      legitimate supersede operation: a new row for the same (student_athlete_id, term_id)
      pushes any existing DRAFT row to SUPERSEDED and re-snapshots the audit, so a writer
      holding a stale view of the student would otherwise supersede a draft it never saw
      and freeze an out-of-date credit snapshot. The check is a stale-version comparison
      against StudentAthlete.version, not a timing rule.
    error_id: ERR_STALE_STUDENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculations
# =============================================================================
calculations:
  - name: degree_applicable_credit_audit
    algorithm: aggregation
    output_field: "StudentAthlete.degree_applicable_credits (and the frozen copy EligibilityCertification.degree_applicable_credits_counted)"
    input_set: |
      All Enrollment rows of the student with status == COMPLETED and grade_points > 0.00
      (grade IN {A, B, C, D}), each joined to the DegreeApplicabilityRule row whose
      degree_program_id == StudentAthlete.declared_program_id, course_id == Enrollment.course_id
      and effective_catalog_year == the catalog year chosen by the variant. Enrollment rows with
      status IN {ENROLLED, DROPPED, WITHDRAWN, INCOMPLETE, FAILED} and rows whose grade == F
      (grade_points == 0.00) are excluded.
    variants:
      - name: CATALOG_AT_ENTRY
        when: "The request omits audit_variant, or certification_type == INITIAL."
        difference: "effective_catalog_year = StudentAthlete.entry_catalog_year."
      - name: CATALOG_AT_CERTIFICATION
        when: "audit_variant == CATALOG_AT_CERTIFICATION is supplied, or certification_type == TRANSFER (forced)."
        difference: "effective_catalog_year = Term(certification.term_id).catalog_year, so a course whose applicability changed between catalog years resolves to the newer DegreeApplicabilityRule row. On GET /athletics/student-athletes/{student_athlete_id}/eligibility-summary, where no certification is in scope, effective_catalog_year = the catalog_year of the Term with the greatest term_index that holds at least one Enrollment of this student."
    formula: |
      Step 1 - classify. For each input enrollment resolve applicability from the matched
      DegreeApplicabilityRule. When no rule row exists for the (declared_program_id, course_id,
      effective_catalog_year) triple, applicability is treated as NOT_APPLICABLE.
      Step 2 - per-course cap. countable_i = min(Enrollment.earned_credit_hours,
      DegreeApplicabilityRule.max_countable_credits) when max_countable_credits IS NOT NULL,
      else countable_i = Enrollment.earned_credit_hours.
      Step 3 - core sum. core_total = sum of countable_i over rows with applicability == CORE.
      Step 4 - elective sum with a program cap. Walk the rows with applicability == ELECTIVE in
      the order Term.term_index ASC, then Course.subject_code ASC, then Course.course_number ASC,
      then Enrollment.created_at ASC, adding countable_i while the running elective total stays
      at or below DegreeProgram.max_elective_credits_countable; the row that would cross the cap
      contributes only the remaining headroom and every later elective row contributes 0.
      elective_total = that capped running total.
      Step 5 - remedial cap. remedial_total = sum of countable_i over rows where
      Course.is_remedial == true AND Term.term_index <= StudentAthlete.entry_term_index + 1,
      capped at REMEDIAL_CREDIT_CAP; remedial rows in later terms contribute 0. Remedial rows are
      excluded from Steps 3 and 4.
      Step 6 - transfer. transfer_total = StudentAthlete.transfer_credits_accepted.
      Step 7 - degree_applicable_credits = core_total + elective_total + remedial_total +
      transfer_total, rounded to 2 decimals, ROUND_HALF_UP.
      Step 8 - null-program path. When StudentAthlete.declared_program_id IS NULL (only
      reachable for certification_type == INITIAL), no DegreeApplicabilityRule can match, so
      core_total, elective_total and remedial_total are all 0.00 and
      degree_applicable_credits = transfer_credits_accepted.
    constants:
      REMEDIAL_CREDIT_CAP: 6
    precision: "2 decimal places, ROUND_HALF_UP"
    trigger:
      - "POST /athletics/enrollments/{enrollment_id}/outcome (any action)"
      - "POST /athletics/student-athletes/{student_athlete_id}/major-declaration"
      - "POST /athletics/degree-applicability-rules"
      - "POST /athletics/certifications (freezes the snapshot onto the certification)"

  - name: progress_benchmark_evaluation
    algorithm: threshold
    output_field: "EligibilityCertification.benchmark_result (and StudentAthlete.progress_pct)"
    input_set: |
      One StudentAthlete plus the degree_applicable_credit_audit result for the same
      audit_variant, plus DegreeProgram(declared_program_id).total_required_credits and
      StudentAthlete.completed_full_time_terms.
    formula: |
      Step 0 - null-program path. When StudentAthlete.declared_program_id IS NULL,
      progress_pct = 0.0000, required_progress_pct = 0.0000, and gpa_ok compares
      cumulative_gpa against PROVISIONAL_MIN_GPA instead of DegreeProgram.min_progress_gpa;
      Steps 1 to 5 are skipped and benchmark_result = PASS exactly when gpa_ok.
      Step 1 - progress_pct = degree_applicable_credits / DegreeProgram.total_required_credits,
      rounded to 4 decimals, ROUND_HALF_UP.
      Step 2 - n = StudentAthlete.completed_full_time_terms.
      required_progress_pct = 0.0000 when n < PTD_GRACE_TERMS, otherwise
      min(1.0000, PTD_PCT_PER_TERM * n) rounded to 4 decimals, ROUND_HALF_UP.
      Step 3 - gpa_ok = StudentAthlete.cumulative_gpa >= DegreeProgram.min_progress_gpa.
      Step 4 - progress_ok = progress_pct >= required_progress_pct. The comparison is
      inclusive: a progress_pct exactly equal to required_progress_pct is a pass.
      Step 5 - benchmark_result = PASS when gpa_ok AND progress_ok; otherwise FAIL, and
      failure_reasons lists GPA_BELOW_MINIMUM and/or PROGRESS_BELOW_BENCHMARK in that fixed
      order.
      Step 6 - when EligibilityAppeal relief has been granted for this certification,
      credit_relief_applied = the granted_credit_relief of the GRANTED appeal with the highest
      round_number (ties broken by created_at ASC) and Step 1 is recomputed with
      degree_applicable_credits + credit_relief_applied.
    constants:
      PTD_GRACE_TERMS: 2
      PTD_PCT_PER_TERM: 0.10
      PROVISIONAL_MIN_GPA: 1.80
    precision: "progress_pct and required_progress_pct at 4 decimal places, ROUND_HALF_UP"
    trigger:
      - "POST /athletics/certifications"
      - "POST /athletics/certifications/{certification_id}/status"
      - "POST /athletics/appeals/{appeal_id}/status with action=GRANT"
      - "GET /athletics/student-athletes/{student_athlete_id}/eligibility-summary"

  - name: academic_risk_score
    algorithm: weighted_scoring
    output_field: "StudentAthlete.risk_score and StudentAthlete.risk_tier"
    input_set: |
      One StudentAthlete: cumulative_gpa, progress_pct, required_progress_pct,
      missed_class_units_charged, missed_class_units_allowance, and the substantiated
      ComplianceIncident rows of that student (status IN {SUBSTANTIATED, REMEDIATED}).
      Incidents with status IN {REPORTED, UNDER_INVESTIGATION, UNSUBSTANTIATED} are excluded.
    variants:
      - name: TERM_SNAPSHOT
        when: "risk_variant is omitted and StudentAthlete.completed_full_time_terms < RISK_CUMULATIVE_MIN_TERMS, or risk_variant == TERM_SNAPSHOT is requested while that count is still below the minimum."
        difference: "gpa_component is the credit-weighted grade_points average over only the Enrollment rows whose term_id == the student's highest term_index term holding at least one COMPLETED enrollment, instead of the lifetime cumulative_gpa."
      - name: CUMULATIVE
        when: "risk_variant == CUMULATIVE is explicitly requested, or StudentAthlete.completed_full_time_terms >= RISK_CUMULATIVE_MIN_TERMS; at or above that count this variant is forced even if risk_variant == TERM_SNAPSHOT is requested."
        difference: "gpa_component is StudentAthlete.cumulative_gpa over every COMPLETED enrollment, so an improving student scores lower risk than the term-snapshot variant and a declining student scores higher."
    formula: |
      Step 1 - gpa_gap = max(0.00, GPA_FLOOR_FOR_RISK - gpa_component), where gpa_component is
      the variant-selected GPA. gpa_points = min(100.00, gpa_gap / GPA_FLOOR_FOR_RISK * 100.00).
      Step 2 - progress_gap = max(0.0000, required_progress_pct - progress_pct).
      progress_points = min(100.00, progress_gap * 400.00).
      Step 3 - missed_ratio = missed_class_units_charged / missed_class_units_allowance.
      missed_points = min(100.00, missed_ratio * 100.00).
      Step 4 - incident_points = min(100.00, sum of penalty_points_assessed over the included
      incidents * 25.00).
      Step 5 - risk_score = round(WEIGHT_GPA * gpa_points + WEIGHT_PROGRESS * progress_points +
      WEIGHT_MISSED * missed_points + WEIGHT_INCIDENT * incident_points, 2) with ROUND_HALF_UP.
      Each component is rounded to 2 decimals before weighting, and the weighted sum is rounded
      once at the end.
      Step 6 - risk_tier = TIER_1 when risk_score < 20.00; TIER_2 when 20.00 <= risk_score <
      40.00; TIER_3 when 40.00 <= risk_score < 65.00; TIER_4 when risk_score >= 65.00.
    constants:
      WEIGHT_GPA: 0.40
      WEIGHT_PROGRESS: 0.25
      WEIGHT_MISSED: 0.20
      WEIGHT_INCIDENT: 0.15
      GPA_FLOOR_FOR_RISK: 2.30
      RISK_CUMULATIVE_MIN_TERMS: 2
      INCIDENT_POINTS: { LEVEL_I: 1, LEVEL_II: 2, LEVEL_III: 3 }
    precision: "risk_score at 2 decimal places, ROUND_HALF_UP; the four weights sum to 1.00"
    trigger:
      - "POST /athletics/enrollments/{enrollment_id}/outcome"
      - "POST /athletics/missed-class-requests"
      - "POST /athletics/missed-class-requests/{request_id}/status with action=CANCEL"
      - "POST /athletics/competition-events/{event_id}/status with action=CANCEL"
      - "POST /athletics/compliance-incidents/{incident_id}/status"
      - "GET /athletics/student-athletes/{student_athlete_id}/eligibility-summary"

  - name: support_requirement_hours
    algorithm: tiered_pricing
    output_field: "StudentAthlete.required_study_hall_hours"
    input_set: |
      One StudentAthlete: risk_tier, missed_class_units_charged, and that student's
      TutorAssignment rows with status == ACTIVE (their weekly_hours). Assignments with status
      IN {PROPOSED, SUSPENDED, COMPLETED, TERMINATED} are excluded.
    formula: |
      Step 1 - base_hours = BASE_STUDY_HALL_HOURS[risk_tier].
      Step 2 - travel_offset = min(TRAVEL_OFFSET_CAP, floor(missed_class_units_charged /
      TRAVEL_UNITS_PER_OFFSET_HOUR)).
      Step 3 - gross_hours = base_hours + travel_offset.
      Step 4 - tutor_credit_cap is selected from the GROSS bracket, not from the post-credit
      figure: tutor_credit_cap = TUTOR_CREDIT_CAP_HIGH when gross_hours >=
      TUTOR_CREDIT_BRACKET_HOURS, otherwise TUTOR_CREDIT_CAP_LOW.
      Step 5 - tutor_hours = sum of weekly_hours over the ACTIVE TutorAssignment rows.
      tutor_credit = min(tutor_credit_cap, TUTOR_CREDIT_RATE * tutor_hours).
      Step 6 - required_study_hall_hours = max(0.0, gross_hours - tutor_credit), rounded to
      1 decimal, ROUND_HALF_UP.
      The four steps are applied in exactly this order: base, then travel offset, then the
      gross-bracket cap selection, then the tutor credit subtraction.
    constants:
      BASE_STUDY_HALL_HOURS: { TIER_1: 0.0, TIER_2: 4.0, TIER_3: 8.0, TIER_4: 12.0 }
      TRAVEL_UNITS_PER_OFFSET_HOUR: 3
      TRAVEL_OFFSET_CAP: 4
      TUTOR_CREDIT_BRACKET_HOURS: 10.0
      TUTOR_CREDIT_CAP_HIGH: 4.0
      TUTOR_CREDIT_CAP_LOW: 2.0
      TUTOR_CREDIT_RATE: 0.5
    precision: "1 decimal place, ROUND_HALF_UP"
    trigger:
      - "POST /athletics/tutor-assignments/{assignment_id}/status"
      - "POST /athletics/missed-class-requests"
      - "POST /athletics/missed-class-requests/{request_id}/status with action=CANCEL"
      - "POST /athletics/competition-events/{event_id}/status with action=CANCEL"
      - "POST /athletics/compliance-incidents/{incident_id}/status with action=SUBSTANTIATE"
      - "GET /athletics/student-athletes/{student_athlete_id}/eligibility-summary"

  - name: missed_class_units
    algorithm: interval_merge
    output_field: "MissedClassRequest.missed_units (and the running StudentAthlete.missed_class_units_charged)"
    input_set: |
      One CompetitionEvent travel window [departure_at, return_at) and one Enrollment whose
      Course has meeting_days, meeting_start_minute_utc and meeting_duration_minutes. Only the
      Course meeting occurrences whose ISO weekday is in meeting_days and whose meeting interval
      [meeting_start, meeting_start + meeting_duration_minutes) lies inside the term window
      [Term.start_date, Term.end_date) are considered.
    formula: |
      Step 1 - enumerate every course meeting occurrence between departure_at and return_at.
      An occurrence counts as missed when its meeting interval overlaps the travel window on a
      strictly positive measure; a meeting that starts exactly at return_at, or ends exactly at
      departure_at, does not count (both windows are half-open).
      Step 2 - missed_meeting_count = the number of counted occurrences.
      Step 3 - per-occurrence units. For each counted occurrence,
      unit_i = round(overlap_minutes_i / MISSED_CLASS_UNIT_MINUTES, 2) with ROUND_HALF_UP,
      where overlap_minutes_i is the length in whole minutes of the intersection of the meeting
      interval with the travel window.
      Step 4 - missed_units_gross = sum of the already-rounded unit_i values. The rounding is
      applied per occurrence and only then summed; summing the raw overlap minutes first and
      rounding once at the end is not the specified order.
      Step 5 - missed_units = round(missed_units_gross *
      CompetitionEvent.missed_class_unit_multiplier, 2) with ROUND_HALF_UP.
      Step 6 - the charge posts to the student: missed_class_units_charged increases by
      missed_units and missed_class_units_remaining = missed_class_units_allowance -
      missed_class_units_charged.
    constants:
      MISSED_CLASS_UNIT_MINUTES: 60
      DEFAULT_MISSED_CLASS_ALLOWANCE: 9.0
    precision: "2 decimal places, ROUND_HALF_UP, applied per meeting occurrence and again to the multiplier product"
    trigger:
      - "POST /athletics/missed-class-requests"

  - name: apr_points_award
    algorithm: chronological
    output_field: "Term.apr_points_possible, Term.apr_points_earned, Term.squad_apr and each cohort StudentAthlete's apr_points_possible / apr_points_earned / apr_points_forfeited"
    input_set: |
      Every StudentAthlete with entry_term_index <= Term.term_index that holds at least one
      Enrollment in this Term with status IN {ENROLLED, COMPLETED, INCOMPLETE}, processed in the
      order entry_term_index ASC, then created_at ASC. A student with no enrollment in the term,
      or whose only enrollments in the term are DROPPED or WITHDRAWN, is excluded from both the
      numerator and the denominator.
    variants:
      - name: PROJECTED
        when: "The next Term by term_index exists and its apr_status == OPEN."
        difference: "The retention point is awarded on intent: at least one Enrollment with status == ENROLLED in that next Term suffices."
      - name: OBSERVED
        when: "The next Term by term_index has apr_status == CLOSED; when no next Term row exists at all, the retention point is awarded by default."
        difference: "The retention point requires realised attendance: at least one Enrollment with status == COMPLETED in that next Term, so a student who enrolled and then dropped everything forfeits the point the PROJECTED variant would have granted."
    formula: |
      Step 1 - each cohort student contributes APR_POINTS_PER_STUDENT possible points for the
      term (one eligibility point and one retention point).
      Step 2 - eligibility point: 1 when the student has an EligibilityCertification for this
      term with status IN {CERTIFIED, RESTORED}, else 0.
      Step 3 - retention point: 1 or 0 by the variant rule above.
      Step 4 - the student's apr_points_earned increases by the sum of Steps 2 and 3, its
      apr_points_possible increases by APR_POINTS_PER_STUDENT, and apr_points_forfeited is set
      so that apr_points_possible == apr_points_earned + apr_points_forfeited holds exactly
      after every close.
      Step 5 - Term.apr_points_possible and Term.apr_points_earned are the cohort sums.
      Step 6 - squad_apr = round(Term.apr_points_earned / Term.apr_points_possible *
      APR_SCALE, 0) with ROUND_HALF_UP when Term.apr_points_possible > 0; when
      Term.apr_points_possible == 0 the squad_apr is NULL rather than 0.
      Step 7 - a student whose squad contribution is below APR_FORFEIT_ALERT_POINTS earned out
      of APR_POINTS_PER_STUDENT possible has support_status re-derived to SUPPORT_MANDATED.
    constants:
      APR_POINTS_PER_STUDENT: 2
      APR_SCALE: 1000
      APR_FORFEIT_ALERT_POINTS: 1
    precision: "point counts are integers; squad_apr is an integer 0..1000, ROUND_HALF_UP"
    trigger:
      - "POST /athletics/terms/{term_id}/apr-close"

  - name: transfer_credit_acceptance
    algorithm: waterfall_allocation
    output_field: "StudentAthlete.transfer_credits_accepted"
    input_set: |
      Every Enrollment of the student with credit_source == TRANSFER and status == COMPLETED,
      joined to the DegreeApplicabilityRule row for the student's declared_program_id and the
      catalog year selected by degree_applicable_credit_audit's active variant. Resident
      enrollments (credit_source == RESIDENT) are excluded.
    formula: |
      Step 1 - order the input rows by Term.term_index ASC, then Course.subject_code ASC, then
      Course.course_number ASC, then Enrollment.created_at ASC.
      Step 2 - bucket 1, CORE. Fill CORE-applicable rows first, each contributing
      min(earned_credit_hours, max_countable_credits when not null), while the running total
      stays at or below TRANSFER_CORE_CAP; the crossing row contributes only the headroom.
      Step 3 - bucket 2, ELECTIVE. Only after bucket 1 is exhausted or has no more rows, fill
      ELECTIVE-applicable rows the same way against TRANSFER_ELECTIVE_CAP.
      Step 4 - rows with applicability == NOT_APPLICABLE and every row after a cap is reached
      contribute 0; the remainder is discarded rather than spilling into the other bucket.
      Step 5 - transfer_credits_accepted = min(TRANSFER_CREDIT_CAP, bucket 1 total + bucket 2
      total), rounded to 2 decimals, ROUND_HALF_UP.
      Step 6 - residency gate: when the student's transfer_status == INCOMING_TRANSFER and the
      student has fewer than TRANSFER_RESIDENCY_TERMS terms with a COMPLETED resident
      enrollment, a TRANSFER certification is rejected with ERR_TRANSFER_RESIDENCY_NOT_MET; the
      accepted-credit figure itself is still computed and stored.
    constants:
      TRANSFER_CORE_CAP: 40.00
      TRANSFER_ELECTIVE_CAP: 20.00
      TRANSFER_CREDIT_CAP: 60.00
      TRANSFER_RESIDENCY_TERMS: 1
    precision: "2 decimal places, ROUND_HALF_UP"
    trigger:
      - "POST /athletics/enrollments/{enrollment_id}/outcome"
      - "POST /athletics/certifications with certification_type=TRANSFER"

  - name: tutor_compliance_penalty
    algorithm: decay_function
    output_field: "Tutor.penalty_points and Tutor.status"
    input_set: |
      Every ComplianceIncident with tutor_id == the tutor and status IN {SUBSTANTIATED,
      REMEDIATED}. Incidents with status IN {REPORTED, UNDER_INVESTIGATION, UNSUBSTANTIATED}
      contribute nothing.
    formula: |
      Step 1 - raw_points = sum of penalty_points_assessed over the included incidents,
      processed in created_at ASC order.
      Step 2 - decay. An incident whose parent term is more than PENALTY_DECAY_TERMS reporting
      terms older than the newest CLOSED reporting term contributes
      max(0, penalty_points_assessed - PENALTY_DECAY_STEP) instead of its full value; decay is
      applied once per elapsed decay window and never below 0.
      Step 3 - penalty_points = the decayed sum, an integer.
      Step 4 - suspension threshold. When penalty_points >=
      TUTOR_SUSPENSION_POINT_THRESHOLD and the tutor's status is TRAINED or EXPIRED, the tutor
      transitions to SUSPENDED; at exactly TUTOR_SUSPENSION_POINT_THRESHOLD - 1 the tutor stays
      in its current status. A tutor already UNTRAINED, SUSPENDED or TERMINATED accumulates the
      points without any status change.
      Step 5 - training validity. training_valid_through_term_index =
      training_completed_term_index + TRAINING_VALIDITY_TERMS - 1; a TRAINED tutor whose
      training_valid_through_term_index is at or below the term being closed transitions to
      EXPIRED.
      Step 6 - reinstatement resets the curve: a SUSPENDED tutor that completes training again
      returns to TRAINED with penalty_points unchanged but a fresh
      training_completed_term_index, so the decay window restarts from that term.
    constants:
      TUTOR_SUSPENSION_POINT_THRESHOLD: 3
      TRAINING_VALIDITY_TERMS: 3
      PENALTY_DECAY_TERMS: 2
      PENALTY_DECAY_STEP: 1
    precision: "integer points; no fractional penalty is ever stored"
    trigger:
      - "POST /athletics/compliance-incidents/{incident_id}/status"
      - "POST /athletics/tutors/{tutor_id}/status"
      - "POST /athletics/terms/{term_id}/apr-close"

  - name: academic_standing_rollup
    algorithm: aggregation
    output_field: "StudentAthlete.cumulative_gpa, StudentAthlete.completed_full_time_terms and Enrollment.is_full_time_countable"
    input_set: |
      Every Enrollment of the student with status == COMPLETED (grade IS NOT NULL). Enrollments
      with status IN {ENROLLED, DROPPED, WITHDRAWN, INCOMPLETE} contribute to neither the GPA
      nor the full-time term count.
    formula: |
      Step 1 - grade scale: A 4.00, B 3.00, C 2.00, D 1.00, F 0.00. grade_points is written on
      the enrollment when the grade is recorded.
      Step 2 - attempted credits. attempted_i = Enrollment.credit_hours, which defaults to
      Course.credit_hours when the enrollment omitted it. earned_credit_hours = attempted_i when
      grade_points > 0.00, otherwise 0.00 (an F is attempted but not earned).
      Step 3 - cumulative_gpa = sum(grade_points_i * attempted_i) / sum(attempted_i) over the
      input set, rounded to 2 decimals ROUND_HALF_UP. With an empty input set cumulative_gpa is
      0.00.
      Step 4 - per-term full-time test. For each Term, term_attempted = sum(attempted_i) over
      the student's COMPLETED enrollments in that term. The term counts as a full-time term when
      term_attempted >= Term.full_time_credit_minimum; the comparison is inclusive, so a term
      with exactly 12 attempted credits against a minimum of 12 counts.
      Step 5 - Enrollment.is_full_time_countable = true for every COMPLETED enrollment whose
      term passed Step 4, false otherwise.
      Step 6 - completed_full_time_terms = the number of distinct Terms that passed Step 4.
    constants:
      GRADE_POINTS: { A: 4.00, B: 3.00, C: 2.00, D: 1.00, F: 0.00 }
    precision: "cumulative_gpa at 2 decimal places, ROUND_HALF_UP; completed_full_time_terms is an integer"
    trigger:
      - "POST /athletics/enrollments/{enrollment_id}/outcome"
      - "GET /athletics/student-athletes/{student_athlete_id}/eligibility-summary"

# =============================================================================
# §1.4 Validation Rules (evaluated strictly in ascending priority; the first
#      violated rule decides the response and no later rule is evaluated)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-empty strings. A header sent as an empty string, or omitted entirely, fails here."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of the ten role names declared in §1.7 and that role appears in the called endpoint's roles list."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "For Instructor-scoped actions on MissedClassRequest, X-User-ID equals MissedClassRequest.instructor_user_id."
    error_id: ERR_NOT_COURSE_INSTRUCTOR
    http_status: 403
    applies_to: "POST /athletics/missed-class-requests/{request_id}/status with action IN {ACKNOWLEDGE, DISPUTE}"

  - priority: 3
    category: auth
    check: "For Tutor-scoped writes, X-User-ID equals the Tutor row's id referenced by the TutorAssignment of the session being logged."
    error_id: ERR_NOT_ASSIGNED_TUTOR
    http_status: 403
    applies_to: "POST /athletics/support-sessions"

  - priority: 3
    category: auth
    check: "For StudentAthlete-scoped reads, X-User-ID equals the StudentAthlete row's id named in the path."
    error_id: ERR_NOT_OWN_RECORD
    http_status: 403
    applies_to: "GET /athletics/student-athletes/{student_athlete_id}, GET /athletics/student-athletes/{student_athlete_id}/eligibility-summary"

  - priority: 4
    category: existence
    check: "Every id in the path exists, validated left to right; then every FK id in the body exists, validated in the field order declared by the endpoint's input list. Each entity has its own 404 error_id."
    error_id: ERR_STUDENT_ATHLETE_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: business_constraint
    check: "The request body parses as a JSON object, every required input field is present, every enum field carries a declared value, every numeric field is within its declared range, and no unknown field is present (unknown fields are ignored rather than rejected)."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 6
    category: business_temporal
    check: "Any supplied instant pair satisfies start < end strictly (start_at < end_at, departure_at < return_at, start_date < end_date)."
    error_id: ERR_INVALID_TIME_WINDOW
    http_status: 422
    applies_to: "POST /athletics/terms, POST /athletics/competition-events, POST /athletics/support-sessions"

  - priority: 7
    category: state
    check: "expected_student_athlete_version equals the current StudentAthlete.version. Checked after the body is well-formed and before any target-state check, so a stale version on a request that would also fail a state precondition returns the 412."
    error_id: ERR_STALE_STUDENT_VERSION
    http_status: 412
    applies_to: "POST /athletics/certifications"

  - priority: 8
    category: state
    check: "The governing Term has apr_status == OPEN. Once a term is APR-closed, no certification, appeal, enrollment-outcome or missed-class write bound to that term is accepted."
    error_id: ERR_APR_TERM_CLOSED
    http_status: 409
    applies_to: "POST /athletics/certifications, POST /athletics/certifications/{certification_id}/status, POST /athletics/appeals, POST /athletics/appeals/{appeal_id}/status, POST /athletics/enrollments/{enrollment_id}/outcome, POST /athletics/missed-class-requests"

  - priority: 9
    category: state
    check: "The target entity's current state is a declared from-state for the requested action in its §1.2 state machine. Terminal states admit no action."
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "every POST /athletics/**/{id}/status endpoint plus POST /athletics/terms/{term_id}/apr-close and POST /athletics/enrollments/{enrollment_id}/outcome"

  - priority: 9
    category: state
    check: "Closing a term for APR requires the logical clock to be at or after Term.end_date."
    error_id: ERR_APR_TERM_NOT_ENDED
    http_status: 409
    applies_to: "POST /athletics/terms/{term_id}/apr-close"

  - priority: 9
    category: state
    check: "Closing a term for APR requires every reporting Term with a lower term_index to already have apr_status == CLOSED."
    error_id: ERR_APR_PRIOR_TERM_OPEN
    http_status: 409
    applies_to: "POST /athletics/terms/{term_id}/apr-close"

  - priority: 10
    category: state
    check: "The parent CompetitionEvent referenced by a new MissedClassRequest has status == TRAVEL_APPROVED. An event still SCHEDULED, already IN_TRAVEL, COMPLETED or CANCELLED cannot accrue new requests. This cross-entity state check outranks every business rule below, so a request that both targets a SCHEDULED event and would exceed the student's missed-class allowance returns this error, not the allowance error."
    error_id: ERR_EVENT_NOT_TRAVEL_APPROVED
    http_status: 409
    applies_to: "POST /athletics/missed-class-requests"

  - priority: 10
    category: state
    check: "Granting or denying an appeal requires the linked EligibilityCertification to be in status DENIED or REVOKED; an appeal against a CERTIFIED certification has nothing to except."
    error_id: ERR_APPEAL_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /athletics/appeals, POST /athletics/appeals/{appeal_id}/status"

  - priority: 11
    category: business_safety
    check: "A TutorAssignment may only be created or activated for a Tutor with status == TRAINED. An UNTRAINED tutor is rejected here even when every referential and capacity condition holds."
    error_id: ERR_TUTOR_NOT_TRAINED
    http_status: 422
    applies_to: "POST /athletics/tutor-assignments, POST /athletics/tutor-assignments/{assignment_id}/status with action IN {ACTIVATE, REINSTATE}"

  - priority: 11
    category: business_safety
    check: "A TutorAssignment may not be created or activated for a Tutor whose status == EXPIRED (training_valid_through_term_index has lapsed) or SUSPENDED or TERMINATED."
    error_id: ERR_TUTOR_TRAINING_EXPIRED
    http_status: 422
    applies_to: "POST /athletics/tutor-assignments, POST /athletics/tutor-assignments/{assignment_id}/status with action IN {ACTIVATE, REINSTATE}"

  - priority: 11
    category: business_safety
    check: "A SupportSession of session_type == TUTOR_SESSION may not be logged for a student whose support_status == SUPPORT_WITHHELD, and may not be logged against a TutorAssignment whose tutor has an incident with status == SUBSTANTIATED and severity == LEVEL_III involving that same student."
    error_id: ERR_IMPERMISSIBLE_ASSISTANCE_BLOCK
    http_status: 422
    applies_to: "POST /athletics/support-sessions"

  - priority: 11
    category: business_safety
    check: "The user who submitted a certification may not decide it, and the user who submitted an appeal may not decide that appeal: decided_by_user_id must differ from requested_by_user_id / submitted_by_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /athletics/certifications/{certification_id}/status with action IN {CERTIFY, DENY}, POST /athletics/appeals/{appeal_id}/status with action IN {GRANT, DENY}"

  - priority: 12
    category: business_referential
    check: "The Tutor's subject_codes list contains the subject_code of the Course behind the assignment's Enrollment. Ordered after the safety checks, so an untrained tutor with a subject mismatch reports the training error."
    error_id: ERR_TUTOR_SUBJECT_MISMATCH
    http_status: 422
    applies_to: "POST /athletics/tutor-assignments"

  - priority: 12
    category: business_referential
    check: "A CONTINUING or TRANSFER certification requires StudentAthlete.declared_program_id IS NOT NULL. An INITIAL certification is accepted with a null declared_program_id and yields the provisional path instead."
    error_id: ERR_MAJOR_NOT_DECLARED
    http_status: 422
    applies_to: "POST /athletics/certifications"

  - priority: 12
    category: business_referential
    check: "An Enrollment supplied to a MissedClassRequest belongs to the same StudentAthlete as every other request of the event's roster, and its Course.instructor_user_id is non-empty so notification has a recipient."
    error_id: ERR_ENROLLMENT_NOT_NOTIFIABLE
    http_status: 422
    applies_to: "POST /athletics/missed-class-requests"

  - priority: 12
    category: business_referential
    check: "A TRANSFER certification requires at least one Enrollment with credit_source == TRANSFER and status == COMPLETED; an INITIAL or CONTINUING certification requires that no TRANSFER-source enrollment is being counted for the first time."
    error_id: ERR_TRANSFER_CREDIT_SOURCE_INVALID
    http_status: 422
    applies_to: "POST /athletics/certifications"

  - priority: 12
    category: business_referential
    check: "certification_type matches the term: INITIAL is only valid when Term.term_index == StudentAthlete.entry_term_index; CONTINUING only when Term.term_index > entry_term_index; TRANSFER only when StudentAthlete.transfer_status == INCOMING_TRANSFER."
    error_id: ERR_CERTIFICATION_TYPE_TERM_MISMATCH
    http_status: 422
    applies_to: "POST /athletics/certifications"

  - priority: 13
    category: business_temporal
    check: "The major declaration deadline has not passed: the term in which the declaration is recorded satisfies term_index <= StudentAthlete.entry_term_index + DegreeProgram.major_declaration_deadline_term_count - 1."
    error_id: ERR_MAJOR_DECLARATION_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /athletics/student-athletes/{student_athlete_id}/major-declaration"

  - priority: 13
    category: business_temporal
    check: "Instructor notification happens at least NOTIFICATION_LEAD_DAYS (7) days before CompetitionEvent.departure_at; the boundary is inclusive, so notification exactly 7 days ahead is accepted and 6 days 23 hours is rejected."
    error_id: ERR_NOTIFICATION_LEAD_TIME_VIOLATION
    http_status: 422
    applies_to: "POST /athletics/missed-class-requests/{request_id}/status with action=NOTIFY_INSTRUCTOR"

  - priority: 13
    category: business_temporal
    check: "An instructor acknowledgement or dispute arrives at or before acknowledgement_deadline_at (notified_at + ACKNOWLEDGEMENT_WINDOW_HOURS (72)); the boundary instant itself is accepted."
    error_id: ERR_ACKNOWLEDGEMENT_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /athletics/missed-class-requests/{request_id}/status with action IN {ACKNOWLEDGE, DISPUTE}"

  - priority: 13
    category: business_temporal
    check: "A SupportSession lies inside its term of record: start_at >= Term.start_date and end_at <= Term.end_date, with the term window half-open on end_date."
    error_id: ERR_SESSION_OUTSIDE_TERM
    http_status: 422
    applies_to: "POST /athletics/support-sessions"

  - priority: 13
    category: business_temporal
    check: "A TRANSFER certification requires the student to have completed at least TRANSFER_RESIDENCY_TERMS terms holding a COMPLETED resident enrollment."
    error_id: ERR_TRANSFER_RESIDENCY_NOT_MET
    http_status: 422
    applies_to: "POST /athletics/certifications"

  - priority: 14
    category: business_constraint
    check: "No two SupportSession rows of the same StudentAthlete overlap. Windows are half-open [start_at, end_at): a session starting exactly when another ends is accepted, one minute of true overlap is rejected."
    error_id: ERR_STUDENT_SESSION_OVERLAP
    http_status: 409
    applies_to: "POST /athletics/support-sessions"

  - priority: 14
    category: business_constraint
    check: "Two SupportSession rows whose tutor_assignment_id rows belong to the same Tutor are separated by at least TUTOR_TRAVEL_BUFFER_MINUTES (20) of clear time between the earlier end_at and the later start_at; a 20-minute gap is accepted and a 10-minute gap is rejected."
    error_id: ERR_TUTOR_BUFFER_VIOLATION
    http_status: 409
    applies_to: "POST /athletics/support-sessions"

  - priority: 14
    category: business_constraint
    check: "At most one non-terminal Enrollment exists per (student_athlete_id, course_id, term_id)."
    error_id: ERR_DUPLICATE_ENROLLMENT
    http_status: 409
    applies_to: "POST /athletics/enrollments"

  - priority: 14
    category: business_constraint
    check: "At most one DegreeApplicabilityRule exists per (degree_program_id, course_id, effective_catalog_year)."
    error_id: ERR_DUPLICATE_APPLICABILITY_RULE
    http_status: 409
    applies_to: "POST /athletics/degree-applicability-rules"

  - priority: 14
    category: business_constraint
    check: "An appeal chain for one certification holds at most MAX_APPEAL_ROUNDS (3) rounds: a new appeal whose predecessor_appeal_id chain already has round_number == 3 is rejected, a REQUEST_REVISION or SUBMIT on an appeal already at round_number == 3 is rejected, and a re-notification chain holds at most MAX_DISPUTE_ROUNDS (2) disputes."
    error_id: ERR_APPEAL_ROUNDS_EXHAUSTED
    http_status: 409
    applies_to: "POST /athletics/appeals, POST /athletics/appeals/{appeal_id}/status with action IN {REQUEST_REVISION, SUBMIT}, POST /athletics/missed-class-requests/{request_id}/status with action=NOTIFY_INSTRUCTOR"

  - priority: 15
    category: business_fiscal
    check: "A new MissedClassRequest's computed missed_units does not exceed StudentAthlete.missed_class_units_remaining. Evaluated last, so any state, safety, referential or temporal violation on the same request wins over this budget check."
    error_id: ERR_MISSED_CLASS_ALLOWANCE_EXCEEDED
    http_status: 422
    applies_to: "POST /athletics/missed-class-requests"

  - priority: 15
    category: business_fiscal
    check: "Tutor.assigned_weekly_hours + the new assignment's weekly_hours does not exceed Tutor.max_weekly_hours (20)."
    error_id: ERR_TUTOR_WEEKLY_HOURS_EXCEEDED
    http_status: 422
    applies_to: "POST /athletics/tutor-assignments, POST /athletics/tutor-assignments/{assignment_id}/status with action IN {ACTIVATE, REINSTATE}"

  - priority: 15
    category: business_fiscal
    check: "The sum of weekly_hours over a student's ACTIVE TutorAssignment rows plus the new assignment does not exceed TIER_WEEKLY_HOUR_CAP[StudentAthlete.risk_tier] (TIER_1 2.0, TIER_2 4.0, TIER_3 8.0, TIER_4 10.0)."
    error_id: ERR_TIER_HOURS_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /athletics/tutor-assignments, POST /athletics/tutor-assignments/{assignment_id}/status with action IN {ACTIVATE, REINSTATE}"

# =============================================================================
# §1.5 API Endpoints (every path is under api_prefix /athletics)
# =============================================================================
