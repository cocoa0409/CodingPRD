            - { call: "POST /dispatch/desks", payload: { code: "KW", region: "WEST", max_dispatchers: 2 }, as: DispatchSupervisor, captures: { kw: $.data.id } }
            - { call: "POST /dispatch/desk-shifts", payload: { dispatcher_id: "${da}", desk_id: "${kw}", shift_start_utc: "2026-05-01T06:00:00Z", shift_end_utc: "2026-05-01T14:00:00Z" }, as: DispatchSupervisor, captures: { sha: $.data.id } }
            - { call: "POST /dispatch/desk-shifts", payload: { dispatcher_id: "${db}", desk_id: "${kw}", shift_start_utc: "2026-05-01T06:00:00Z", shift_end_utc: "2026-05-01T14:00:00Z" }, as: DispatchSupervisor, captures: { shb: $.data.id } }
            - { call: "POST /dispatch/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: DispatchSupervisor }
          trigger:
            - { call: "POST /dispatch/legs", payload: { flight_no: "FD852", dep_station_id: "${sta}", arr_station_id: "${stb}", aircraft_id: "${ac1}", captain_id: "${c1}", distance_nm: 400, sched_dep_utc: "2026-05-01T12:00:00Z", sched_arr_utc: "2026-05-01T13:00:00Z" }, as: Dispatcher, as_user_id: "${da}", captures: { new_leg: $.data.id, new_leg_disp: $.data.dispatcher_id } }
          assert:
            - "new_leg_disp == ${db} — flat tie (1 == 1) broken by weighted_load_score (1 < 3)"

      - name: cascading_side_effects_covered
        claim_type: violation_to_error
        grounds: [calculations.delay_auto_amend, calculations.weather_revalidation]
        excluded_because:
          difficulty_instance: transitive_cascade / delay_threshold_cascade_to_signatures
          rationale: "N-level cascade verified end-to-end (leg -> release -> signatures) there and in weather_replace_cascade_to_release_amendment."

      - name: dual_variant_calculation_covered
        claim_type: correct_result
        grounds: [calculations.trip_fuel, calculations.dispatcher_workload]
        excluded_because:
          difficulty_instance: dual_variant_calc / trip_fuel_forecast_vs_worst_case_divergence
          rationale: "Both variants' outputs asserted as literals; the workload dual-variant is asserted in dispatcher_workload_flat_vs_departure_weighted."

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_visibility_after_create
        claim_type: correct_result
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "immediate consistency: a created entity is fully readable with all computed defaults in the very next request (no lag, no reconciliation window)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /dispatch/desks", payload: { code: "KZ", region: "NORTH", max_dispatchers: 3 }, as: DispatchSupervisor, captures: { kz: $.data.id } }
          trigger:
            - { call: "GET /dispatch/desks/${kz}", as: DispatchSupervisor, captures: { kz_free: $.data.free_slots, kz_cnt: $.data.active_shift_count } }
          assert:
            - "GET returns code KZ, region NORTH, max_dispatchers 3, kz_cnt == 0, kz_free == 3, version == 1 — visible immediately"
