            - { call: "POST /transparency/payers", payload: { name: "PA", payer_type: "COMMERCIAL" }, as: TransparencyOfficer, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_FORBIDDEN_ROLE (http 403)"]

