  - section: validations
    instances:

      - name: duplicate_dba_code_on_a_second_distributor_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=30]
          - errors.ERR_DUPLICATE_DBA_CODE
        distinguishing_aspect: |
          Uniqueness on dba_code is global (unlike manufacturer_sku, which is
          unique per deal, and source_reference, which is unique per
          distributor), so a second distributor with a different name but the
          same code must still be refused, and the refusal must not create a row.
        test_recipe:
          setup:
            - "One Distributor exists with dba_code METRO-01."
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Metro Foodservice", dba_code: "METRO-01", contracted_markup_bps: 900 }
              as: GpoAdmin
              captures: { dist_id: $.data.id }
          trigger:
            - call: "POST /distributors"
              payload: { name: "Metro Foodservice of New England", dba_code: "METRO-01", contracted_markup_bps: 450 }
              as: GpoAdmin
              captures: { e1: $.data.error_id }
          assert:
            - "409 with data.error_id == ERR_DUPLICATE_DBA_CODE and a non-empty data.message"
            - "the envelope reports response_type == error and meta.api_request_id is present"
            - "GET /distributors returns total_count == 1 and the surviving row is still name == Metro Foodservice with contracted_markup_bps == 900"
            - "a third create with dba_code METRO-02 succeeds, proving the rejection was about the code and not about the name"

      - name: tier_split_that_balances_to_exactly_10000_bps_is_accepted
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=27]
          - errors.ERR_TIER_SPLIT_NOT_BALANCED
        distinguishing_aspect: |
          The balance rule is an exact equality, not a range: 7500+2500 and
          1+9999 both pass, while 7500+2501 (one bp over) and 7500+2499 (one bp
          under) both fail. Testing only the over case would let an
          implementation that checks `<= 10000` slip through.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /program-tiers"
              payload: { tier_code: "ELITE", member_share_bps: 7500, gpo_retention_bps: 2500, admin_fee_bps_low: 300, admin_fee_bps_high: 150, compliance_min_ratio_bps: 8000, markup_cap_bps: 700, dispute_window_days: 45 }
              as: GpoAdmin
              captures: { tier_id: $.data.id }
            - call: "POST /program-tiers"
