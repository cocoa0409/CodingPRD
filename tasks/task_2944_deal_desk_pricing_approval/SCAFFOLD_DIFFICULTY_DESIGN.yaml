      - name: step_decide_conflict_segregation_of_duties_wins_over_delegation_scope
        grounds:
          - validations[priority=10]
          - validations[priority=12]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_DELEGATION_SCOPE_EXCEEDED]
          - entities.DelegationGrant.fields.max_discount_pct
        distinguishing_aspect: |
          A different error-category pair from the state-versus-fiscal collision: business_safety
          (priority 10, ERR_SEGREGATION_OF_DUTIES, 403) against business_constraint (priority 12,
          ERR_DELEGATION_SCOPE_EXCEEDED, 422). The acting user u-dual-1 both owns the quote and holds a
          tier-2 delegation capped at 0.18 while the quote's final_blended_discount_pct is 0.246053, so
          both rules fire on one decide call and the response must be the 403 safety error; were the
          segregation rule absent the identical call would return ERR_DELEGATION_SCOPE_EXCEEDED.
        test_recipe:
          setup:
            - "The base configuration and account from the anchored chain."
            - "One quote owned by u-dual-1, term_months 36, payment_terms_days 30, with Core Platform 250 at 0.05 and Premium Support 250 at 0.00: final_net_total_cents 28273018, final_blended_discount_pct 0.246053, required_approval_level 2, final_margin_pct 0.681675 (above the floor, so no exception is needed)."
            - "The quote is submitted and its level-1 step is APPROVED by u-desk-1, so a level-2 step assigned to SalesDirector is PENDING."
            - "u-dir-1 (SalesDirector) has delegated tier level 2 to u-dual-1 for 2026-08-01T00:00:00Z..2026-08-31T00:00:00Z with max_discount_pct 0.18."
          setup_api_calls:
            - *bc_clock
            - *bc_policy
            - *bc_tier1
            - *bc_tier2
            - *bc_tier3
            - *bc_tier4
            - *bc_activate
            - *bc_core
            - *bc_support
            - *bc_service
            - *bc_usage
            - *bc_vt1
            - *bc_vt2
            - *bc_vt3
            - *bc_bundle
            - *bc_account
            - call: "POST /quotes"
              payload: { account_id: "${acct_id}", title: "Northwind Dual Hat Deal", term_months: 36, payment_terms_days: 30, billing_frequency: "ANNUAL" }
              as: SalesRep
              as_user_id: "u-dual-1"
              captures: { q_id: $.data.id }
            - call: "POST /quote-lines"
              payload: { quote_id: "${q_id}", product_id: "${core_id}", quantity: 250, requested_discount_pct: 0.05 }
              as: SalesRep
              as_user_id: "u-dual-1"
              captures: { core_line_id: $.data.id }
            - call: "POST /quote-lines"
              payload: { quote_id: "${q_id}", product_id: "${sup_id}", quantity: 250, requested_discount_pct: 0.00 }
              as: SalesRep
              as_user_id: "u-dual-1"
              captures: { sup_line_id: $.data.id }
            - call: "POST /delegation-grants"
              payload: { grantee_user_id: "u-dual-1", tier_level: 2, max_discount_pct: 0.18, starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-31T00:00:00Z" }
              as: SalesDirector
              as_user_id: "u-dir-1"
              captures: { grant_id: $.data.id }
            - call: "POST /quotes/${q_id}/submit"
              payload: {}
              as: SalesRep
              as_user_id: "u-dual-1"
            - call: "GET /approval-steps"
              payload: { decision: "PENDING" }
              as: DealDeskAnalyst
              captures: { step1_id: "$.data[0].id", req_id: "$.data[0].approval_request_id" }
            - call: "POST /approval-steps/${step1_id}/decide"
              payload: { decision: "APPROVE", decision_note: "Desk ok" }
              as: DealDeskAnalyst
              as_user_id: "u-desk-1"
            - call: "GET /approval-steps"
