              as: Anonymous
              captures: { ch_hc: $.data.id }
            - call: "POST /api/channels/${ch_hc}/content-items"
              payload: { title: "Half Cent Item", duration_seconds: 300, category_code: "MUSIC" }
              as: Creator
              as_user_id: "${ch_hc}"
              captures: { i_hc: $.data.id }
            - call: "POST /api/channels/${ch_hc}/content-items/${i_hc}/requests-review"
              payload: {}
              as: Creator
