  - section: "Table 6 Errors"
    instances:
      - name: path_ids_that_do_not_resolve_return_each_entity_specific_not_found
        claim_type: "Not Found"
        grounds:
          - validations.priority_10
          - errors[ERR_BUILDER_NOT_FOUND]
          - errors[ERR_HOMEOWNER_NOT_FOUND]
          - errors[ERR_POLICY_NOT_FOUND]
          - errors[ERR_COVERAGE_TERM_NOT_FOUND]
          - errors[ERR_TRANSFER_NOT_FOUND]
          - errors[ERR_ESCALATION_CASE_NOT_FOUND]
          - errors[ERR_NEUTRAL_NOT_FOUND]
          - errors[ERR_RESERVE_ENTRY_NOT_FOUND]
        distinguishing_aspect: "Eight read endpoints are probed with the same syntactically valid but unused uuid and each answers with its own entity-specific 404 code rather than a shared generic one, which is what priority 10's left-to-right path resolution promises."
        test_recipe:
          setup:
            - "empty database - no row of any kind exists, so no probe can accidentally resolve"
          setup_api_calls: []
          trigger:
            - call: "GET /warranty/builders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
              captures: { e_builder: $.data.error_id }
            - call: "GET /warranty/homeowners/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
              captures: { e_homeowner: $.data.error_id }
            - call: "GET /warranty/policies/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
              captures: { e_policy: $.data.error_id }
            - call: "GET /warranty/coverage-terms/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
              captures: { e_term: $.data.error_id }
            - call: "GET /warranty/transfers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
              captures: { e_transfer: $.data.error_id }
            - call: "GET /warranty/escalation-cases/00000000-0000-4000-8000-000000000000"
