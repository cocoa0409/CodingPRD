  - rule_id: transitive_cascade
    instances:
      - name: excursion_unacceptable_cascades_to_lot_depletion_and_resupply
        grounds:
          - state_machines.TemperatureExcursion.OPEN_to_RESOLVED_UNACCEPTABLE
          - state_machines.Kit.QUARANTINED_EXCURSION_to_DESTRUCTION_PENDING
          - state_machines.Lot.ACTIVE_to_DEPLETED
        distinguishing_aspect: |
          Depth-3 cascade triggered by the excursion assessment: assess
          UNACCEPTABLE mutates Kits (QUARANTINED_EXCURSION -> DESTRUCTION_PENDING);
          each kit's mutation forces a Lot usable-count recompute which flips the
          lot ACTIVE -> DEPLETED; the DEPLETED flip itself auto-creates a resupply
          shipment of replacement kits in IN_TRANSIT. Each link is caused by the
          previous link, not by the assess call directly.
