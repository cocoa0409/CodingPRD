              as: AgentAdmin
            - call: "POST /transfer-requests"
              payload: { from_account_id: "${acct_a}", to_account_id: "${acct_b}", issuer_id: "${iss}", share_quantity: 100, expected_account_version: "${a_v}" }
              as: TransferExaminer
              captures: { t1: $.data.id }
            - call: "GET /accounts/${acct_a}"
              as: TransferExaminer
              captures: { a_v2: $.data.version }
            - call: "POST /transfer-requests"
              payload: { from_account_id: "${acct_a}", to_account_id: "${acct_b}", issuer_id: "${iss}", share_quantity: 100, expected_account_version: "${a_v2}" }
              as: TransferExaminer
