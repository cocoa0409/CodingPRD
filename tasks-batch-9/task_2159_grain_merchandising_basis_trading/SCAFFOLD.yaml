# =============================================================================
# PRD Benchmark Seed Tables — Grain Merchandising & Basis Trading
# Difficulty band: beyond Expert (§0.4) — 12 entities, 54 endpoints,
# 8 calculations, 7 state machines, 2 OCC rules, 6 roles.
# =============================================================================

scenario: |
  desgin task harder than expert level.!!!!2159. Grain Merchandising & Basis Trading (ADM/Cargill grain desk): bid posting by delivery period & location, purchase contract types (cash/HTA/basis/deferred), futures hedging & margin call management, delivery application & contract roll, quality discount schedule at intake, position reporting & risk limits, freight/rail car acquisition, default & contract cancellation

domain_name: grain-merchandising-basis-trading
api_prefix: /grain

# -----------------------------------------------------------------------------
# Step 0: Complexity Profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity is a peer collection directly under /grain; parentage is
  # expressed only through FK fields carried in request bodies, never through
  # nested URL paths.

  state_machine_shape: parallel
  # PurchaseContract carries three independent axes on one row
  # (pricing_status x delivery_status x status); Bid and HedgePosition are
  # cyclic; DeliveryTicket and FreightBooking are branching with compensation.

  relationship_patterns:
    - one_to_many
    - self_referential      # PurchaseContract.rolled_from_contract_id
    - cross_aggregate       # DeliveryTicket -> FreightBooking, PurchaseContract -> HedgePosition

  role_model: segregation_of_duties
  consistency_model: immediate

# -----------------------------------------------------------------------------
# 1.0 Response Envelope (FIXED — verbatim)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: TradingDesk
    parent: null
    common_fields: true
    fields:
      - { name: desk_code, type: string, source: input, description: "Short unique code for the merchandising desk", constraints: "unique across all TradingDesk rows" }
      - { name: name, type: string, source: input, description: "Human-readable desk name" }
      - { name: credit_line_usd, type: number, source: input, description: "Total clearing credit line available to the desk, in USD", constraints: "> 0" }
      - { name: margin_requirement_usd, type: number, source: computed, description: "Sum over HedgePosition rows of this desk with status IN {OPEN, MARGIN_CALL} of lots_open * INITIAL_MARGIN_USD_PER_LOT[commodity_code]", default: 0 }
      - { name: open_margin_call_usd, type: number, source: computed, description: "Sum of call_amount_usd over MarginCall rows with status == OPEN whose HedgePosition belongs to this desk", default: 0 }
      - { name: credit_utilization, type: number, source: computed, description: "round_half_up((margin_requirement_usd + open_margin_call_usd) / credit_line_usd, 4)", default: 0 }
      - { name: available_credit_usd, type: number, source: computed, description: "round_half_up(credit_line_usd - margin_requirement_usd - open_margin_call_usd, 2)" }
      - { name: posture, type: enum, source: computed, description: "Derived gate over all desk write operations", default: NORMAL, constraints: "NORMAL | RESTRICTED | FROZEN" }
      - { name: committed_hedge_lots, type: integer, source: computed, description: "Sum of lots_committed over HedgePosition rows of this desk with status IN {OPEN, MARGIN_CALL}; the conserved quantity for the contract create/cancel invariant", default: 0 }
      - { name: open_bushel_commitment, type: number, source: computed, description: "Sum over PurchaseContract rows of this desk with status == ACTIVE of (bushels - delivered_bushels); the conserved quantity for the delivery apply/reverse invariant", default: 0 }
      - { name: unpriced_bushels, type: number, source: computed, description: "Sum over PurchaseContract rows of this desk with status == ACTIVE of contract.unpriced_bushels", default: 0 }
      - { name: realized_hedge_pnl_usd, type: number, source: computed, description: "Running sum of realized_pnl_usd booked by this desk's HedgePosition rows", default: 0 }

  - name: ElevatorLocation
    parent: null
    common_fields: true
    fields:
      - { name: desk_id, type: string, source: input, description: "FK -> TradingDesk.id; the desk that owns this country elevator" }
      - { name: location_code, type: string, source: input, description: "Short code for the elevator", constraints: "unique across all ElevatorLocation rows" }
      - { name: name, type: string, source: input, description: "Elevator name" }
      - { name: intake_capacity_bushels, type: integer, source: input, description: "Maximum bushels of ACTIVE purchase contracts whose delivery windows may overlap at this elevator", constraints: "> 0" }
      - { name: rail_served, type: boolean, source: input, description: "True when the elevator has a rail spur and may host FreightBooking rows", default: false }
      - { name: committed_intake_bushels, type: number, source: computed, description: "Sum of bushels over PurchaseContract rows at this location with status == ACTIVE", default: 0 }

  - name: DiscountSchedule
    parent: null
    common_fields: true
    fields:
      - { name: commodity_code, type: enum, source: input, description: "Commodity the schedule grades", constraints: "CORN | SOYBEANS | HRW_WHEAT" }
      - { name: effective_from, type: datetime, source: input, description: "ISO 8601 UTC instant from which this schedule may be activated" }
      - { name: moisture_standard_pct, type: number, source: input, description: "Moisture percentage at or below which no shrink and no moisture discount apply", default: 15.0 }
      - { name: shrink_factor_pct_per_point, type: number, source: input, description: "Shrink percentage applied per whole point of moisture above moisture_standard_pct", default: 1.18 }
      - { name: tiers, type: array, source: input, description: "Discount tier rows, each an object { factor, direction, threshold_value, unit_step, rate_cents_per_bushel_per_step }", constraints: "factor IN {MOISTURE, TEST_WEIGHT, FOREIGN_MATERIAL, DAMAGE}; direction IN {ABOVE, BELOW}; at most one tier row per factor; non-empty" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ACTIVE -> SUPERSEDED", default: DRAFT, constraints: "DRAFT | ACTIVE | SUPERSEDED" }

  - name: RiskLimit
    parent: null
    common_fields: true
    fields:
      - { name: desk_id, type: string, source: input, description: "FK -> TradingDesk.id; the desk this limit governs" }
      - { name: commodity_code, type: enum, source: input, description: "Commodity the limit governs", constraints: "CORN | SOYBEANS | HRW_WHEAT" }
      - { name: max_unpriced_bushels, type: integer, source: input, description: "Ceiling on desk.unpriced_bushels for this commodity", constraints: ">= 0" }
      - { name: max_net_short_lots, type: integer, source: input, description: "Ceiling on the absolute value of the desk's net short futures lots for this commodity", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE until a newer RiskLimit for the same (desk_id, commodity_code) supersedes it", default: ACTIVE, constraints: "ACTIVE | SUPERSEDED" }

  - name: RailFleet
    parent: null
    common_fields: true
    fields:
      - { name: home_location_id, type: string, source: input, description: "FK -> ElevatorLocation.id; the elevator the fleet is homed at" }
      - { name: fleet_code, type: string, source: input, description: "Short code for the rail car set", constraints: "unique across all RailFleet rows" }
      - { name: car_count, type: integer, source: input, description: "Number of cars in the set; a FreightBooking may not request more", constraints: "> 0" }

  - name: Bid
    parent: null
    common_fields: true
    fields:
      - { name: location_id, type: string, source: input, description: "FK -> ElevatorLocation.id; where the bid is posted" }
      - { name: commodity_code, type: enum, source: input, description: "Commodity bid for", constraints: "CORN | SOYBEANS | HRW_WHEAT" }
      - { name: futures_month, type: string, source: input, description: "Board month the basis is quoted against", constraints: "format YYYY-MM" }
      - { name: delivery_period_start, type: string, source: input, description: "First delivery date covered by the bid (YYYY-MM-DD)" }
      - { name: delivery_period_end, type: string, source: input, description: "Last delivery date covered by the bid (YYYY-MM-DD), inclusive", constraints: ">= delivery_period_start" }
      - { name: basis_cents, type: number, source: input, description: "Posted basis in cents per bushel relative to futures_month; may be negative" }
      - { name: max_bushels, type: integer, source: input, description: "Maximum aggregate bushels the desk will contract against this bid", constraints: "> 0" }
      - { name: expires_at, type: datetime, source: input, description: "ISO 8601 UTC instant at or after which the bid auto-transitions to EXPIRED" }
      - { name: contracted_bushels, type: number, source: computed, description: "Sum of bushels over PurchaseContract rows referencing this bid with status IN {ACTIVE, SETTLED, ROLLED}", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT -> ACTIVE <-> SUSPENDED; ACTIVE -> WITHDRAWN | EXPIRED", default: DRAFT, constraints: "DRAFT | ACTIVE | SUSPENDED | WITHDRAWN | EXPIRED" }

  - name: HedgePosition
    parent: null
    common_fields: true
    fields:
      - { name: desk_id, type: string, source: input, description: "FK -> TradingDesk.id; the desk that carries the futures position" }
      - { name: commodity_code, type: enum, source: input, description: "Commodity of the board position", constraints: "CORN | SOYBEANS | HRW_WHEAT" }
      - { name: futures_month, type: string, source: input, description: "Board month", constraints: "format YYYY-MM" }
      - { name: side, type: enum, source: input, description: "SHORT sells futures against cash length; LONG buys futures", constraints: "SHORT | LONG" }
      - { name: lots_open, type: integer, source: input, description: "Open futures lots on the board; each lot is CONTRACT_UNIT_BUSHELS bushels", constraints: "> 0 at creation" }
      - { name: avg_entry_price_cents, type: number, source: input, description: "Volume-weighted entry price in cents per bushel, recomputed on add-lots to 4 decimal places" }
      - { name: lots_committed, type: integer, source: computed, description: "Sum of hedge_lots_assigned over PurchaseContract rows pointing at this position with status == ACTIVE", default: 0 }
      - { name: lots_available, type: integer, source: computed, description: "lots_open - lots_committed", default: 0 }
      - { name: posted_margin_usd, type: number, source: computed, description: "Initial margin posted for lots_open plus the sum of cured MarginCall payments on this position", default: 0 }
      - { name: last_settlement_price_cents, type: number, source: system, description: "Most recent board settlement price marked against this position; initialised to avg_entry_price_cents at creation" }
      - { name: unrealized_pnl_usd, type: number, source: computed, description: "Mark-to-market profit or loss at last_settlement_price_cents", default: 0 }
      - { name: realized_pnl_usd, type: number, source: computed, description: "Profit or loss booked when lots are lifted by contract settlement or by liquidation", default: 0 }
      - { name: status, type: enum, source: system, description: "OPEN <-> MARGIN_CALL; either may go to LIQUIDATED", default: OPEN, constraints: "OPEN | MARGIN_CALL | LIQUIDATED" }

  - name: PurchaseContract
    parent: null
    common_fields: true
    fields:
      - { name: bid_id, type: string, source: input, description: "FK -> Bid.id; the posted bid the contract was struck against" }
      - { name: desk_id, type: string, source: system, description: "FK -> TradingDesk.id; copied from the bid's elevator at creation" }
      - { name: location_id, type: string, source: system, description: "FK -> ElevatorLocation.id; copied from the bid at creation" }
      - { name: hedge_position_id, type: string, source: input, description: "FK -> HedgePosition.id; the board position that carries this contract's hedge lots" }
      - { name: rolled_from_contract_id, type: string, source: system, description: "FK -> PurchaseContract.id; set on the successor produced by a roll, null otherwise", default: null }
      - { name: contract_type, type: enum, source: input, description: "CASH fixes futures and basis at creation; HTA fixes futures only; BASIS fixes basis only; DEFERRED fixes neither", constraints: "CASH | HTA | BASIS | DEFERRED" }
      - { name: commodity_code, type: enum, source: system, description: "Copied from the bid at creation", constraints: "CORN | SOYBEANS | HRW_WHEAT" }
      - { name: futures_month, type: string, source: system, description: "Copied from the bid at creation, or from the new hedge position on a roll" }
      - { name: seller_name, type: string, source: input, description: "Producer or counterparty selling the grain" }
      - { name: bushels, type: number, source: input, description: "Contracted bushels", constraints: "> 0" }
      - { name: delivery_start, type: string, source: input, description: "First delivery date (YYYY-MM-DD)" }
      - { name: delivery_end, type: string, source: input, description: "Last delivery date (YYYY-MM-DD), inclusive", constraints: ">= delivery_start" }
      - { name: settlement_basis, type: enum, source: input, description: "Selects the delivery settlement variant used when grading tickets against this contract", default: SHRINK_FIRST, constraints: "SHRINK_FIRST | GROSS_GRADE" }
      - { name: futures_price_cents, type: number, source: system, description: "Fixed futures leg in cents per bushel; set at creation for CASH and HTA, otherwise the volume-weighted average of FILLED FUTURES PricingOrder rows", default: null }
      - { name: basis_cents, type: number, source: system, description: "Fixed basis leg in cents per bushel; copied from the bid at creation for CASH and BASIS, otherwise the volume-weighted average of FILLED BASIS PricingOrder rows", default: null }
      - { name: roll_adjustment_cents, type: number, source: system, description: "Cumulative price adjustment carried over from contract rolls", default: 0 }
      - { name: gross_unit_price_cents, type: number, source: computed, description: "futures_price_cents + basis_cents + roll_adjustment_cents; null while either leg is unset", default: null }
      - { name: priced_futures_bushels, type: number, source: computed, description: "Bushels whose futures leg is fixed", default: 0 }
      - { name: priced_basis_bushels, type: number, source: computed, description: "Bushels whose basis leg is fixed", default: 0 }
      - { name: unpriced_bushels, type: number, source: computed, description: "bushels - min(priced_futures_bushels, priced_basis_bushels)", default: 0 }
      - { name: hedge_lots_assigned, type: integer, source: computed, description: "round_half_up(bushels / CONTRACT_UNIT_BUSHELS) lots reserved on hedge_position_id while status == ACTIVE", default: 0 }
      - { name: delivered_bushels, type: number, source: computed, description: "Sum of net_bushels over DeliveryTicket rows on this contract with status == APPLIED", default: 0 }
      - { name: settled_value_usd, type: number, source: computed, description: "Sum of settlement_value_usd over DeliveryTicket rows on this contract with status == APPLIED", default: 0 }
      - { name: damages_usd, type: number, source: computed, description: "Market-loss or replacement-cost damages assessed on cancellation or default", default: 0 }
      - { name: termination_reason, type: string, source: system, description: "Free text captured when the contract is cancelled or defaulted", default: null }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the Merchandiser that created the contract; used for the segregation-of-duties check on cancel" }
      - { name: pricing_locked, type: boolean, source: computed, description: "Set true while the owning desk's posture is FROZEN; blocks new PricingOrder rows on this contract", default: false }
      - { name: pricing_status, type: enum, source: computed, description: "UNPRICED | PARTIALLY_PRICED | FULLY_PRICED, derived from priced_futures_bushels and priced_basis_bushels", default: UNPRICED, constraints: "UNPRICED | PARTIALLY_PRICED | FULLY_PRICED" }
      - { name: delivery_status, type: enum, source: computed, description: "OPEN | PARTIALLY_DELIVERED | COMPLETE, derived from delivered_bushels", default: OPEN, constraints: "OPEN | PARTIALLY_DELIVERED | COMPLETE" }
      - { name: status, type: enum, source: system, description: "Lifecycle axis, independent of pricing_status and delivery_status", default: ACTIVE, constraints: "ACTIVE | SETTLED | CANCELLED | DEFAULTED | ROLLED" }

  - name: PricingOrder
    parent: null
    common_fields: false
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> PurchaseContract.id; the contract leg being fixed" }
      - { name: component, type: enum, source: input, description: "Which floating leg this order fixes", constraints: "FUTURES | BASIS" }
      - { name: bushels, type: number, source: input, description: "Bushels priced by this order", constraints: "> 0" }
      - { name: price_cents, type: number, source: input, description: "Price in cents per bushel for the named component" }
      - { name: placed_by_user_id, type: string, source: system, description: "X-User-ID of the actor that placed the order" }

  - name: MarginCall
    parent: null
    common_fields: true
    fields:
      - { name: hedge_position_id, type: string, source: input, description: "FK -> HedgePosition.id; the position whose equity fell below maintenance" }
      - { name: call_amount_usd, type: number, source: system, description: "USD needed to restore the position to initial margin" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock instant at which the call was issued" }
      - { name: cure_deadline_at, type: datetime, source: system, description: "issued_at plus MARGIN_CALL_CURE_HOURS; a cure at exactly this instant is still accepted" }
      - { name: cured_amount_usd, type: number, source: system, description: "USD actually paid to cure the call", default: 0 }
      - { name: status, type: enum, source: system, description: "OPEN -> CURED | DEFAULTED", default: OPEN, constraints: "OPEN | CURED | DEFAULTED" }

  - name: DeliveryTicket
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> PurchaseContract.id; the contract the load is applied against" }
      - { name: location_id, type: string, source: input, description: "FK -> ElevatorLocation.id; the elevator that took the load in" }
      - { name: freight_booking_id, type: string, source: input, description: "FK -> FreightBooking.id; set when the load moves by rail, null for truck", default: null }
      - { name: discount_schedule_id, type: string, source: system, description: "FK -> DiscountSchedule.id; the ACTIVE schedule pinned at grading time" }
      - { name: gross_bushels, type: number, source: input, description: "Scale weight converted to bushels before shrink", constraints: "> 0" }
      - { name: moisture_pct, type: number, source: input, description: "Measured moisture percentage", constraints: ">= 0" }
      - { name: test_weight_lbs, type: number, source: input, description: "Measured test weight in pounds per bushel", constraints: "> 0" }
      - { name: foreign_material_pct, type: number, source: input, description: "Measured foreign material percentage", constraints: ">= 0" }
      - { name: damage_pct, type: number, source: input, description: "Measured total damage percentage", constraints: ">= 0" }
      - { name: shrink_pct, type: number, source: computed, description: "Moisture shrink percentage applied under the SHRINK_FIRST variant; always 0 under GROSS_GRADE", default: 0 }
      - { name: net_bushels, type: number, source: computed, description: "Bushels credited to the contract after shrink, 2 decimal places", default: 0 }
      - { name: discount_total_usd, type: number, source: computed, description: "Sum of per-factor quality discount amounts, each rounded to cents before summing", default: 0 }
      - { name: gross_contract_value_usd, type: number, source: computed, description: "net_bushels * contract.gross_unit_price_cents / 100, rounded to cents; null when the contract has no fixed gross unit price", default: null }
      - { name: service_fee_cents_per_bushel, type: number, source: computed, description: "Merchandising service fee tier selected from gross_contract_value_usd", default: null }
      - { name: net_unit_price_cents, type: number, source: computed, description: "contract.gross_unit_price_cents - service_fee_cents_per_bushel", default: null }
      - { name: settlement_value_usd, type: number, source: computed, description: "Extended net value of the load after service fee and quality discounts; null when the contract is not fully priced", default: null }
      - { name: disposition_reason, type: string, source: system, description: "Free text captured when the ticket is rejected or reversed", default: null }
      - { name: graded_by_user_id, type: string, source: system, description: "X-User-ID of the GrainInspector that graded the ticket" }
      - { name: status, type: enum, source: system, description: "GRADED -> APPLIED -> REVERSED, or GRADED -> REJECTED", default: GRADED, constraints: "GRADED | APPLIED | REJECTED | REVERSED" }

  - name: FreightBooking
    parent: null
    common_fields: true
    fields:
      - { name: fleet_id, type: string, source: input, description: "FK -> RailFleet.id; the rail car set reserved" }
      - { name: contract_id, type: string, source: input, description: "FK -> PurchaseContract.id; the contract the cars will move" }
      - { name: cars_requested, type: integer, source: input, description: "Cars requested from the fleet", constraints: "> 0" }
      - { name: placement_at, type: datetime, source: input, description: "ISO 8601 UTC instant the cars are spotted at the elevator" }
      - { name: release_at, type: datetime, source: input, description: "ISO 8601 UTC instant the cars are released", constraints: "> placement_at" }
      - { name: occupancy_end_at, type: datetime, source: computed, description: "release_at plus FLEET_TURNAROUND_HOURS; the exclusive upper bound of the fleet occupancy interval" }
      - { name: substitution_count, type: integer, source: computed, description: "Number of times the booking has been moved to a different fleet", default: 0 }
      - { name: cancellation_reason, type: string, source: system, description: "Free text captured when the booking is cancelled", default: null }
      - { name: status, type: enum, source: system, description: "REQUESTED -> CONFIRMED -> COMPLETED; REQUESTED loops on itself on substitution; REQUESTED or CONFIRMED -> CANCELLED", default: REQUESTED, constraints: "REQUESTED | CONFIRMED | COMPLETED | CANCELLED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Bid
    initial_state: DRAFT
    terminal_states: [WITHDRAWN, EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /grain/bids/{bidId}/activate"
        actor: Merchandiser
        preconditions:
          - "no other Bid row with status IN {ACTIVE, SUSPENDED} shares this bid's (location_id, commodity_code, futures_month, delivery_period_start)"
          - "logical clock now < bid.expires_at"
        side_effects:
          - "bid.status := ACTIVE; bid becomes eligible as the bid_id of new PurchaseContract rows"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /grain/bids/{bidId}/suspend"
        actor: Merchandiser
        preconditions: ["bid.status == ACTIVE"]
        side_effects:
          - "bid.status := SUSPENDED; PurchaseContract creation against this bid is rejected with ERR_BID_NOT_ACTIVE"
        note: "Cycle leg 1 of 2 — a suspended bid can be re-activated without re-creating it."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /grain/bids/{bidId}/activate"
        actor: Merchandiser
        preconditions:
          - "no other Bid row with status IN {ACTIVE, SUSPENDED} shares this bid's (location_id, commodity_code, futures_month, delivery_period_start)"
          - "logical clock now < bid.expires_at"
        side_effects:
          - "bid.status := ACTIVE"
        note: "Cycle leg 2 of 2 — SUSPENDED -> ACTIVE closes the ACTIVE <-> SUSPENDED loop."
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /grain/bids/{bidId}/withdraw"
        actor: Merchandiser
        preconditions: ["bid.status IN {ACTIVE, SUSPENDED}"]
        side_effects:
          - "bid.status := WITHDRAWN; the bid stops being an eligible market-price or replacement-price source for cancellation damages"
      - from: SUSPENDED
        to: WITHDRAWN
        trigger: "POST /grain/bids/{bidId}/withdraw"
        actor: Merchandiser
        preconditions: ["bid.status IN {ACTIVE, SUSPENDED}"]
        side_effects:
          - "bid.status := WITHDRAWN"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc advancing the logical clock to or past bid.expires_at"
        actor: system
        preconditions: ["bid.status IN {ACTIVE, SUSPENDED}", "new logical clock now >= bid.expires_at"]
        side_effects:
          - "bid.status := EXPIRED; the bid id is returned in the clock endpoint's expired_bid_ids"
      - from: SUSPENDED
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc advancing the logical clock to or past bid.expires_at"
        actor: system
        preconditions: ["bid.status IN {ACTIVE, SUSPENDED}", "new logical clock now >= bid.expires_at"]
        side_effects:
          - "bid.status := EXPIRED"

  - entity: DiscountSchedule
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /grain/discount-schedules/{scheduleId}/activate"
        actor: DeskAdmin
        preconditions:
          - "schedule.status == DRAFT"
          - "logical clock now >= schedule.effective_from"
        side_effects:
          - "schedule.status := ACTIVE"
          - "every other DiscountSchedule row with the same commodity_code and status == ACTIVE transitions ACTIVE -> SUPERSEDED"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "activation of a newer DiscountSchedule for the same commodity_code"
        actor: system
        preconditions: ["schedule.status == ACTIVE", "a different DiscountSchedule with the same commodity_code is being activated"]
        side_effects:
          - "schedule.status := SUPERSEDED; DeliveryTicket rows already pinned to it keep their discount_schedule_id and their computed amounts"

  - entity: RiskLimit
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /grain/risk-limits creating a newer limit for the same (desk_id, commodity_code)"
        actor: RiskOfficer
        preconditions: ["limit.status == ACTIVE", "the incoming limit shares this row's (desk_id, commodity_code)"]
        side_effects:
          - "limit.status := SUPERSEDED; the incoming row becomes the single ACTIVE limit for that (desk_id, commodity_code)"
          - "TradingDesk.version increments by 1"

  - entity: HedgePosition
    initial_state: OPEN
    terminal_states: [LIQUIDATED]
    transitions:
      - from: OPEN
        to: OPEN
        trigger: "POST /grain/hedge-positions/{positionId}/mark-to-market where account equity stays at or above maintenance margin"
        actor: FuturesTrader
        preconditions:
          - "position.status == OPEN"
          - "posted_margin_usd + unrealized_pnl_usd >= lots_open * MAINTENANCE_MARGIN_USD_PER_LOT[commodity_code] after the mark"
        side_effects:
          - "position.last_settlement_price_cents := settlement_price_cents; position.unrealized_pnl_usd recomputed by mark_to_market_equity"
        note: "Self-loop: marking a healthy position leaves it OPEN."
      - from: OPEN
        to: MARGIN_CALL
        trigger: "POST /grain/hedge-positions/{positionId}/mark-to-market where account equity falls below maintenance margin"
        actor: FuturesTrader
        preconditions:
          - "position.status == OPEN"
          - "posted_margin_usd + unrealized_pnl_usd < lots_open * MAINTENANCE_MARGIN_USD_PER_LOT[commodity_code] after the mark"
        side_effects:
          - "position.last_settlement_price_cents := settlement_price_cents; position.unrealized_pnl_usd recomputed"
          - "CASCADE HOP 1 — a MarginCall row is created with status OPEN, call_amount_usd from margin_call_amount, issued_at = logical clock now, cure_deadline_at = issued_at + MARGIN_CALL_CURE_HOURS"
          - "CASCADE HOP 2 — because that MarginCall now exists, TradingDesk.open_margin_call_usd increases by call_amount_usd and available_credit_usd / credit_utilization are recomputed by desk_credit_posture"
          - "CASCADE HOP 3 — because credit_utilization crossed a posture breakpoint, TradingDesk.posture is rewritten (RESTRICTED at >= 0.8000, FROZEN at >= 1.0000)"
          - "CASCADE HOP 4 — because TradingDesk.posture became FROZEN, pricing_locked := true on every PurchaseContract of that desk with status == ACTIVE and pricing_status != FULLY_PRICED"
      - from: MARGIN_CALL
        to: OPEN
        trigger: "POST /grain/margin-calls/{marginCallId}/cure"
        actor: RiskOfficer
        preconditions:
          - "the MarginCall referencing this position has status == OPEN"
          - "logical clock now <= call.cure_deadline_at"
          - "payment_usd >= call.call_amount_usd"
        side_effects:
          - "MarginCall.status := CURED; MarginCall.cured_amount_usd := payment_usd"
          - "position.posted_margin_usd += payment_usd; position.status := OPEN"
          - "TradingDesk.open_margin_call_usd, available_credit_usd, credit_utilization and posture recomputed"
          - "when posture leaves FROZEN, pricing_locked := false on every ACTIVE PurchaseContract of that desk"
        note: "Cycle leg — OPEN -> MARGIN_CALL -> OPEN can repeat any number of times on one position."
      - from: OPEN
        to: LIQUIDATED
        trigger: "POST /grain/hedge-positions/{positionId}/liquidate"
        actor: FuturesTrader
        preconditions:
          - "position.status == OPEN"
          - "position.lots_committed == 0"
        side_effects:
          - "position.realized_pnl_usd += side_sign * (settlement_price_cents - avg_entry_price_cents) * lots_open * CONTRACT_UNIT_BUSHELS / 100, rounded to cents"
          - "position.posted_margin_usd := 0; position.unrealized_pnl_usd := 0; position.status := LIQUIDATED"
          - "TradingDesk.margin_requirement_usd, committed_hedge_lots, available_credit_usd, credit_utilization, posture and realized_hedge_pnl_usd recomputed"
      - from: MARGIN_CALL
        to: LIQUIDATED
        trigger: "POST /grain/hedge-positions/{positionId}/liquidate on a position whose OPEN MarginCall is past its cure deadline"
        actor: FuturesTrader
        preconditions:
          - "position.status == MARGIN_CALL"
          - "the OPEN MarginCall on this position has cure_deadline_at < logical clock now"
        side_effects:
          - "MarginCall.status := DEFAULTED"
          - "position.realized_pnl_usd += side_sign * (settlement_price_cents - avg_entry_price_cents) * lots_open * CONTRACT_UNIT_BUSHELS / 100, rounded to cents; posted_margin_usd := 0; unrealized_pnl_usd := 0; status := LIQUIDATED"
          - "TradingDesk.margin_requirement_usd, open_margin_call_usd, committed_hedge_lots, available_credit_usd, credit_utilization, realized_hedge_pnl_usd and posture recomputed"
        note: "Forced liquidation has NO lots_committed == 0 precondition, unlike the OPEN -> LIQUIDATED leg; ACTIVE contracts pointing at the position keep hedge_lots_assigned but the position drops out of TradingDesk.committed_hedge_lots and TradingDesk.margin_requirement_usd because both filter status IN {OPEN, MARGIN_CALL}."

  - entity: MarginCall
    initial_state: OPEN
    terminal_states: [CURED, DEFAULTED]
    transitions:
      - from: OPEN
        to: CURED
        trigger: "POST /grain/margin-calls/{marginCallId}/cure"
        actor: RiskOfficer
        preconditions:
          - "call.status == OPEN"
          - "logical clock now <= call.cure_deadline_at"
          - "payment_usd >= call.call_amount_usd"
        side_effects:
          - "call.cured_amount_usd := payment_usd; the owning HedgePosition transitions MARGIN_CALL -> OPEN"
      - from: OPEN
        to: DEFAULTED
        trigger: "POST /grain/hedge-positions/{positionId}/liquidate on the owning position after cure_deadline_at has passed"
        actor: FuturesTrader
        preconditions: ["call.status == OPEN", "logical clock now > call.cure_deadline_at", "the owning HedgePosition has status == MARGIN_CALL"]
        side_effects:
          - "the owning HedgePosition transitions MARGIN_CALL -> LIQUIDATED"

  - entity: PurchaseContract
    initial_state: ACTIVE
    terminal_states: [SETTLED, CANCELLED, DEFAULTED, ROLLED]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /grain/pricing-orders fixing a floating leg (pricing_status axis advances independently of status)"
        actor: Merchandiser
        preconditions:
          - "contract.status == ACTIVE"
          - "contract.pricing_locked == false"
          - "the named component is still floating for at least `bushels` bushels"
          - "for component == FUTURES, the contract's HedgePosition has status == OPEN"
        side_effects:
          - "priced_futures_bushels or priced_basis_bushels increases by the order's bushels"
          - "futures_price_cents or basis_cents is rewritten as the volume-weighted average of FILLED PricingOrder rows for that component, rounded to 4 decimal places"
          - "unpriced_bushels, gross_unit_price_cents and pricing_status recomputed; TradingDesk.unpriced_bushels recomputed"
          - "when pricing_status becomes FULLY_PRICED and delivery_status is already COMPLETE, the contract also transitions ACTIVE -> SETTLED"
        note: "Parallel dimension 1 of 3 — pricing_status advances UNPRICED -> PARTIALLY_PRICED -> FULLY_PRICED without touching delivery_status."
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /grain/delivery-tickets/{ticketId}/apply or /reverse (delivery_status axis advances independently of pricing_status)"
        actor: Merchandiser
        preconditions:
          - "contract.status == ACTIVE"
        side_effects:
          - "delivered_bushels and delivery_status recomputed; TradingDesk.open_bushel_commitment recomputed"
        note: "Parallel dimension 2 of 3 — delivery_status advances OPEN -> PARTIALLY_DELIVERED -> COMPLETE and reverses back on ticket reversal, while pricing_status is untouched."
      - from: ACTIVE
        to: SETTLED
        trigger: "system, when delivery_status becomes COMPLETE while pricing_status == FULLY_PRICED (raised by ticket apply or by the last pricing order)"
        actor: system
        preconditions:
          - "contract.status == ACTIVE"
          - "contract.delivered_bushels >= contract.bushels"
          - "contract.pricing_status == FULLY_PRICED"
        side_effects:
          - "CASCADE HOP 3 (of the delivery-apply chain) — hedge lots are lifted: HedgePosition.lots_open -= hedge_lots_assigned, lots_committed recomputed, realized_pnl_usd += side_sign * (last_settlement_price_cents - avg_entry_price_cents) * hedge_lots_assigned * CONTRACT_UNIT_BUSHELS / 100, posted_margin_usd -= hedge_lots_assigned * INITIAL_MARGIN_USD_PER_LOT[commodity_code]"
          - "CASCADE HOP 4 — because HedgePosition.lots_open and posted_margin_usd changed, TradingDesk.margin_requirement_usd, committed_hedge_lots, open_bushel_commitment, unpriced_bushels, available_credit_usd, credit_utilization, realized_hedge_pnl_usd and posture are recomputed"
          - "CASCADE HOP 5 — because TradingDesk.posture left FROZEN, pricing_locked := false on every ACTIVE PurchaseContract of that desk"
        note: "Parallel dimension 3 of 3 — the status axis is the only one that reaches a terminal value."
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /grain/purchase-contracts/{contractId}/cancel"
        actor: RiskOfficer
        preconditions:
          - "contract.status == ACTIVE"
          - "the acting X-User-ID differs from contract.created_by_user_id"
          - "the damages_method's price source resolves to at least one eligible Bid"
        side_effects:
          - "contract.damages_usd := cancellation_damages under the requested variant; contract.termination_reason := cancellation_reason"
          - "hedge lots are released: HedgePosition.lots_committed recomputed downward by hedge_lots_assigned"
          - "ElevatorLocation.committed_intake_bushels and TradingDesk.committed_hedge_lots, open_bushel_commitment, unpriced_bushels recomputed"
      - from: ACTIVE
        to: DEFAULTED
        trigger: "POST /grain/purchase-contracts/{contractId}/declare-default"
        actor: RiskOfficer
        preconditions:
          - "contract.status == ACTIVE"
          - "contract.delivery_status != COMPLETE"
          - "logical clock now > contract.delivery_end + DEFAULT_GRACE_DAYS (end-of-day UTC of delivery_end plus the grace period)"
        side_effects:
          - "contract.damages_usd := cancellation_damages under the MARKET_LOSS variant; contract.termination_reason := default_reason"
          - "hedge lots are released and ElevatorLocation.committed_intake_bushels / TradingDesk aggregates recomputed exactly as on cancel"
      - from: ACTIVE
        to: ROLLED
        trigger: "POST /grain/purchase-contracts/{contractId}/roll"
        actor: Merchandiser
        preconditions:
          - "contract.status == ACTIVE"
          - "contract.delivery_status != COMPLETE"
          - "contract.pricing_locked == false"
          - "new_hedge_position_id references a HedgePosition with status == OPEN on the same desk and commodity with lots_available >= the successor's hedge_lots_assigned"
        side_effects:
          - "a successor PurchaseContract is created with rolled_from_contract_id := this contract's id, bushels := bushels - delivered_bushels, futures_month := the new position's futures_month, roll_adjustment_cents := roll_spread_cents - ROLL_SERVICE_FEE_CENTS, and the same contract_type, settlement_basis, bid_id, seller_name and basis_cents"
          - "this contract's hedge lots are released on the old HedgePosition and committed on the new one by the successor"
          - "TradingDesk.committed_hedge_lots, open_bushel_commitment and unpriced_bushels recomputed"

  - entity: DeliveryTicket
    initial_state: GRADED
    terminal_states: [REJECTED, REVERSED]
    transitions:
      - from: GRADED
        to: APPLIED
        trigger: "POST /grain/delivery-tickets/{ticketId}/apply"
        actor: Merchandiser
        preconditions:
          - "ticket.status == GRADED"
          - "contract.status == ACTIVE"
          - "ticket.net_bushels <= contract.bushels - contract.delivered_bushels"
          - "when ticket.freight_booking_id is set, that FreightBooking has status == CONFIRMED"
        side_effects:
          - "CASCADE HOP 1 — contract.delivered_bushels += ticket.net_bushels; contract.settled_value_usd += ticket.settlement_value_usd (treated as 0 when null); contract.delivery_status recomputed"
          - "CASCADE HOP 2 — because delivered_bushels now satisfies delivered_bushels >= contract.bushels while pricing_status == FULLY_PRICED, contract.status transitions ACTIVE -> SETTLED (which carries hops 3, 4 and 5)"
          - "when ticket.freight_booking_id is set, that FreightBooking transitions CONFIRMED -> COMPLETED, freeing its RailFleet occupancy interval"
          - "TradingDesk.open_bushel_commitment recomputed"
      - from: GRADED
        to: REJECTED
        trigger: "POST /grain/delivery-tickets/{ticketId}/reject"
        actor: GrainInspector
        preconditions: ["ticket.status == GRADED"]
        side_effects:
          - "ticket.disposition_reason := rejection_reason; no contract, hedge, desk or freight field changes"
      - from: APPLIED
        to: REVERSED
        trigger: "POST /grain/delivery-tickets/{ticketId}/reverse"
        actor: GrainInspector
        preconditions:
          - "ticket.status == APPLIED"
          - "contract.status == ACTIVE"
        side_effects:
          - "COMPENSATION — contract.delivered_bushels -= ticket.net_bushels; contract.settled_value_usd -= ticket.settlement_value_usd (treated as 0 when null); contract.delivery_status recomputed"
          - "TradingDesk.open_bushel_commitment recomputed back to its pre-apply value"
          - "ticket.disposition_reason := reversal_reason; the ticket's computed grading fields are preserved unchanged"

  - entity: FreightBooking
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: REQUESTED
        trigger: "POST /grain/freight-bookings/{bookingId}/substitute"
        actor: FreightCoordinator
        preconditions:
          - "booking.status == REQUESTED"
          - "new_fleet_id references a RailFleet whose home_location_id equals the booking's contract location"
          - "cars_requested <= new fleet.car_count"
          - "the booking's [placement_at, occupancy_end_at) interval does not intersect any REQUESTED or CONFIRMED booking already on new_fleet_id"
        side_effects:
          - "booking.fleet_id := new_fleet_id; booking.substitution_count += 1; RailFleet.version increments by 1 on the new fleet"
        note: "Self-loop: substitution re-targets the booking without leaving REQUESTED."
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /grain/freight-bookings/{bookingId}/confirm"
        actor: FreightCoordinator
        preconditions: ["booking.status == REQUESTED"]
        side_effects:
          - "booking.status := CONFIRMED; DeliveryTicket rows carrying this booking id may now be applied"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "system, when a DeliveryTicket carrying this booking id is applied"
        actor: system
        preconditions: ["booking.status == CONFIRMED"]
        side_effects:
          - "booking.status := COMPLETED; the fleet occupancy interval stops blocking new bookings"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /grain/freight-bookings/{bookingId}/cancel"
        actor: FreightCoordinator
        preconditions: ["booking.status IN {REQUESTED, CONFIRMED}"]
        side_effects:
          - "booking.cancellation_reason := cancellation_reason; the fleet occupancy interval stops blocking new bookings"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /grain/freight-bookings/{bookingId}/cancel"
        actor: FreightCoordinator
        preconditions: ["booking.status IN {REQUESTED, CONFIRMED}"]
        side_effects:
          - "booking.cancellation_reason := cancellation_reason; the fleet occupancy interval stops blocking new bookings"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on a parent entity's `version`)
# =============================================================================
concurrency_rules:
  - rule_id: risk-limit-create-stale-desk
    parent_entity: TradingDesk
    write_endpoint: "POST /grain/risk-limits"
    occ_field: "expected_desk_version"
    description: |
      Creating a RiskLimit against a TradingDesk whose version has advanced
      since the client last observed it is rejected. A new limit legitimately
      supersedes the prior ACTIVE limit for the same (desk_id,
      commodity_code), so a writer holding a stale view of the desk would
      silently retire a limit it never read.
    error_id: ERR_STALE_DESK_VERSION
    http_status: 412

  - rule_id: freight-booking-create-stale-fleet
    parent_entity: RailFleet
    write_endpoint: "POST /grain/freight-bookings"
    occ_field: "expected_fleet_version"
    description: |
      Creating a FreightBooking against a RailFleet whose version has advanced
      since the client last observed it is rejected. A non-intersecting
      booking is legitimately accepted on its own merits, so the stale-version
      check is the only signal that the fleet's occupancy picture the client
      reasoned about is no longer the current one.
    error_id: ERR_STALE_FLEET_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: delivery_net_bushels
    trigger: "POST /grain/delivery-tickets — evaluated once at grading time and frozen on the ticket"
    algorithm: threshold
    formula: |
      schedule := the DiscountSchedule with status == ACTIVE and
                  commodity_code == contract.commodity_code
                  (none -> reject with ERR_NO_ACTIVE_DISCOUNT_SCHEDULE)
      ticket.discount_schedule_id := schedule.id

      if contract.settlement_basis == SHRINK_FIRST:
          excess_points := max(0, moisture_pct - schedule.moisture_standard_pct)
          shrink_pct    := excess_points * schedule.shrink_factor_pct_per_point
          net_bushels   := round_half_up(gross_bushels * (1 - shrink_pct / 100), 2)
      else:   # GROSS_GRADE
          shrink_pct    := 0
          net_bushels   := round_half_up(gross_bushels, 2)
    input_set: "The single DiscountSchedule with status == ACTIVE for the contract's commodity_code; SUPERSEDED and DRAFT schedules are never consulted."
    constants:
      MOISTURE_STANDARD_PCT_DEFAULT: 15.0
      SHRINK_FACTOR_PCT_PER_POINT_DEFAULT: 1.18
    precision: "shrink_pct exact; net_bushels 2 decimal places, round_half_up"
    variants:
      - name: SHRINK_FIRST
        when: "contract.settlement_basis == SHRINK_FIRST (the default)"
        difference: "Moisture above standard removes bushels through shrink and contributes NO cents-per-bushel discount; every other factor is extended on the shrunk net_bushels."
      - name: GROSS_GRADE
        when: "contract.settlement_basis == GROSS_GRADE"
        difference: "No bushels are removed (net_bushels == gross_bushels); moisture above standard instead becomes a cents-per-bushel drying charge drawn from the MOISTURE tier, and every factor is extended on the full gross bushels."

  - name: quality_discount_total
    trigger: "POST /grain/delivery-tickets — evaluated once at grading time and frozen on the ticket"
    algorithm: tiered_pricing
    formula: |
      # Factors are evaluated in this exact order and never any other:
      FACTOR_ORDER := [MOISTURE, TEST_WEIGHT, FOREIGN_MATERIAL, DAMAGE]

      for each factor f in FACTOR_ORDER:
          tier := the schedule.tiers row with tier.factor == f (absent -> rate_f := 0)

          if f == MOISTURE and contract.settlement_basis == SHRINK_FIRST:
              rate_f := 0            # shrink already took the moisture penalty
          else if tier.direction == ABOVE:
              steps_f := ceil(max(0, measured_f - tier.threshold_value) / tier.unit_step)
              rate_f  := steps_f * tier.rate_cents_per_bushel_per_step
          else:   # BELOW
              steps_f := ceil(max(0, tier.threshold_value - measured_f) / tier.unit_step)
              rate_f  := steps_f * tier.rate_cents_per_bushel_per_step

          # ROUNDING ORDER IS PINNED: extend and round EACH factor to cents,
          # THEN sum the rounded per-factor amounts. Summing the rates first
          # and rounding once at the end is explicitly NOT the rule and can
          # differ by a cent.
          amount_f := round_half_up(net_bushels * rate_f / 100, 2)

      discount_total_usd := sum of amount_f over FACTOR_ORDER

      # measured_f mapping:
      #   MOISTURE -> moisture_pct, TEST_WEIGHT -> test_weight_lbs,
      #   FOREIGN_MATERIAL -> foreign_material_pct, DAMAGE -> damage_pct
    input_set: "Exactly the tier rows of ticket.discount_schedule_id; at most one tier per factor. A factor with no tier row contributes 0.00."
    constants:
      FACTOR_ORDER: "[MOISTURE, TEST_WEIGHT, FOREIGN_MATERIAL, DAMAGE]"
    precision: "each per-factor amount 2 decimal places, round_half_up, BEFORE summation; the sum is exact"

  - name: ticket_settlement_value
    trigger: "POST /grain/delivery-tickets — evaluated once at grading time and frozen on the ticket"
    algorithm: tiered_pricing
    formula: |
      # Circular-looking dependency, pinned to this exact evaluation order:
      #   the service fee tier is keyed on the GROSS contract value, which is
      #   computed from the price BEFORE the fee is subtracted. The tier is
      #   never re-derived from the post-fee value, even when the post-fee
      #   value falls into a different tier.
      if contract.gross_unit_price_cents is null:
          gross_contract_value_usd     := null
          service_fee_cents_per_bushel := null
          net_unit_price_cents         := null
          settlement_value_usd         := null
      else:
          # step 1 — gross extension
          gross_contract_value_usd := round_half_up(
              net_bushels * contract.gross_unit_price_cents / 100, 2)
          # step 2 — fee tier keyed on the step-1 value
          if   gross_contract_value_usd <  SERVICE_FEE_TIER_1_CEILING_USD:
              service_fee_cents_per_bushel := SERVICE_FEE_TIER_1_CENTS
          elif gross_contract_value_usd <  SERVICE_FEE_TIER_2_CEILING_USD:
              service_fee_cents_per_bushel := SERVICE_FEE_TIER_2_CENTS
          else:
              service_fee_cents_per_bushel := SERVICE_FEE_TIER_3_CENTS
          # step 3 — net unit price
          net_unit_price_cents := contract.gross_unit_price_cents
                                  - service_fee_cents_per_bushel
          # step 4 — net extension, then quality discounts
          settlement_value_usd := round_half_up(
              net_bushels * net_unit_price_cents / 100, 2) - discount_total_usd
    input_set: "Only the grading ticket's own net_bushels and its contract's gross_unit_price_cents; no other ticket on the contract participates."
    constants:
      SERVICE_FEE_TIER_1_CEILING_USD: 50000.00
      SERVICE_FEE_TIER_2_CEILING_USD: 250000.00
      SERVICE_FEE_TIER_1_CENTS: 3.0
      SERVICE_FEE_TIER_2_CENTS: 2.0
      SERVICE_FEE_TIER_3_CENTS: 1.0
    precision: "gross_contract_value_usd and settlement_value_usd 2 decimal places, round_half_up; the tier comparison uses the rounded gross_contract_value_usd"

  - name: contract_hedge_lots
    trigger: "POST /grain/purchase-contracts and POST /grain/purchase-contracts/{contractId}/roll"
    algorithm: threshold
    formula: |
      hedge_lots_assigned := round_half_up(bushels / CONTRACT_UNIT_BUSHELS)
      # exactly-half cases round UP: 12500 bushels -> 2.5 lots -> 3 lots
      require position.lots_open - position.lots_committed >= hedge_lots_assigned
             else ERR_INSUFFICIENT_HEDGE_LOTS
    input_set: "The contract's own bushels; lots_committed counts only PurchaseContract rows on the same HedgePosition with status == ACTIVE."
    constants:
      CONTRACT_UNIT_BUSHELS: 5000
    precision: "integer lots, round_half_up at the .5 boundary"

  - name: hedge_avg_entry_price
    trigger: "POST /grain/hedge-positions/{positionId}/add-lots"
    algorithm: aggregation
    formula: |
      avg_entry_price_cents := round_half_up(
          (old_avg_entry_price_cents * old_lots_open + fill_price_cents * lots)
          / (old_lots_open + lots), 4)
      lots_open := old_lots_open + lots
      posted_margin_usd := round_half_up(
          lots_open * INITIAL_MARGIN_USD_PER_LOT[commodity_code], 2)
    input_set: "Only the position's own prior lots_open and avg_entry_price_cents plus this fill."
    constants:
      INITIAL_MARGIN_USD_PER_LOT: "{ CORN: 1650.00, SOYBEANS: 3300.00, HRW_WHEAT: 2200.00 }"
    precision: "avg_entry_price_cents 4 decimal places, round_half_up; posted_margin_usd 2 decimal places"

  - name: weighted_average_leg_price
    trigger: "POST /grain/pricing-orders"
    algorithm: aggregation
    formula: |
      orders := PricingOrder rows with contract_id == contract.id and
                component == this order's component, INCLUDING the new one,
                processed in created_at ASC order
      priced_bushels := sum of o.bushels over orders
      leg_price_cents := round_half_up(
          sum of (o.price_cents * o.bushels) over orders / priced_bushels, 4)

      if component == FUTURES: contract.futures_price_cents := leg_price_cents
                               contract.priced_futures_bushels := priced_bushels
      else:                    contract.basis_cents := leg_price_cents
                               contract.priced_basis_bushels := priced_bushels

      contract.unpriced_bushels := contract.bushels
          - min(contract.priced_futures_bushels, contract.priced_basis_bushels)
      contract.pricing_status :=
          FULLY_PRICED     if priced_futures_bushels >= bushels
                              and priced_basis_bushels >= bushels
          UNPRICED         if priced_futures_bushels == 0
                              and priced_basis_bushels == 0
          PARTIALLY_PRICED otherwise
    input_set: "Only FILLED PricingOrder rows on the same contract and component; CASH and HTA contracts carry their creation-time futures fix as priced_futures_bushels == bushels and accept no FUTURES orders."
    constants: {}
    precision: "leg price 4 decimal places, round_half_up"

  - name: mark_to_market_equity
    trigger: "POST /grain/hedge-positions/{positionId}/mark-to-market and POST /grain/hedge-positions/{positionId}/liquidate"
    algorithm: aggregation
    formula: |
      side_sign := -1 when position.side == SHORT, +1 when position.side == LONG
      unrealized_pnl_usd := round_half_up(
          side_sign * (settlement_price_cents - avg_entry_price_cents)
          * lots_open * CONTRACT_UNIT_BUSHELS / 100, 2)
      account_equity_usd := round_half_up(posted_margin_usd + unrealized_pnl_usd, 2)
      maintenance_usd := round_half_up(
          lots_open * MAINTENANCE_MARGIN_USD_PER_LOT[commodity_code], 2)
      breached := account_equity_usd < maintenance_usd
    input_set: "The single HedgePosition being marked; other positions on the same desk are untouched."
    constants:
      CONTRACT_UNIT_BUSHELS: 5000
      MAINTENANCE_MARGIN_USD_PER_LOT: "{ CORN: 1500.00, SOYBEANS: 3000.00, HRW_WHEAT: 2000.00 }"
    precision: "2 decimal places, round_half_up; the maintenance comparison is strict `<` so equity exactly equal to maintenance does NOT call"

  - name: margin_call_amount
    trigger: "HedgePosition transition OPEN -> MARGIN_CALL raised by POST /grain/hedge-positions/{positionId}/mark-to-market"
    algorithm: threshold
    formula: |
      # Three interacting inputs (lots, posted margin, mark-to-market P&L),
      # a per-commodity tiered rate, and a sign branch on side.
      initial_usd := round_half_up(
          lots_open * INITIAL_MARGIN_USD_PER_LOT[commodity_code], 2)
      call_amount_usd := round_half_up(
          max(0, initial_usd - account_equity_usd), 2)
      issued_at        := logical clock now
      cure_deadline_at := issued_at + MARGIN_CALL_CURE_HOURS hours
    input_set: "One HedgePosition and the mark_to_market_equity result computed in the same request."
    constants:
      INITIAL_MARGIN_USD_PER_LOT: "{ CORN: 1650.00, SOYBEANS: 3300.00, HRW_WHEAT: 2200.00 }"
      MARGIN_CALL_CURE_HOURS: 24
    precision: "2 decimal places, round_half_up"

  - name: desk_credit_posture
    trigger: "any mutation that changes a HedgePosition's lots_open/status, creates or resolves a MarginCall, or settles/cancels/defaults/rolls a PurchaseContract"
    algorithm: threshold
    formula: |
      margin_requirement_usd := round_half_up(sum over HedgePosition p of this desk
          with p.status IN {OPEN, MARGIN_CALL} of
          p.lots_open * INITIAL_MARGIN_USD_PER_LOT[p.commodity_code], 2)
      open_margin_call_usd := round_half_up(sum of m.call_amount_usd over
          MarginCall m with m.status == OPEN whose position belongs to this desk, 2)
      available_credit_usd := round_half_up(
          credit_line_usd - margin_requirement_usd - open_margin_call_usd, 2)
      credit_utilization := round_half_up(
          (margin_requirement_usd + open_margin_call_usd) / credit_line_usd, 4)

      posture := FROZEN      if credit_utilization >= 1.0000
                 RESTRICTED  if credit_utilization >= 0.8000
                 NORMAL      otherwise

      committed_hedge_lots := sum of p.lots_committed over the same OPEN/MARGIN_CALL set
      open_bushel_commitment := sum of (c.bushels - c.delivered_bushels) over
          PurchaseContract c of this desk with c.status == ACTIVE
      unpriced_bushels := sum of c.unpriced_bushels over the same ACTIVE set
      realized_hedge_pnl_usd := sum of p.realized_pnl_usd over ALL HedgePosition
          rows of this desk regardless of status
    input_set: "HedgePosition rows filtered to status IN {OPEN, MARGIN_CALL} for margin and lots; PurchaseContract rows filtered to status == ACTIVE for bushels; MarginCall rows filtered to status == OPEN."
    constants:
      POSTURE_RESTRICTED_AT: 0.8000
      POSTURE_FROZEN_AT: 1.0000
    precision: "USD 2 decimal places, credit_utilization 4 decimal places, both round_half_up; both posture breakpoints are inclusive `>=`"

  - name: cancellation_damages
    trigger: "PurchaseContract transitions ACTIVE -> CANCELLED and ACTIVE -> DEFAULTED"
    algorithm: forward_looking
    formula: |
      if contract.pricing_status != FULLY_PRICED:
          damages_usd := 0.00      # no bid lookup is performed at all
      else:
          undelivered_bushels := contract.bushels - contract.delivered_bushels
          futures_ref_cents   := contract.hedge_position.last_settlement_price_cents

          # --- variant-specific basis source (see variants below) ---
          reference_basis_cents := <per-variant selector>

          market_unit_price_cents := futures_ref_cents + reference_basis_cents
          damages_usd := round_half_up(
              max(0, market_unit_price_cents - contract.gross_unit_price_cents)
              * undelivered_bushels / 100, 2)
              + <per-variant admin fee>
    input_set: "Bid rows with status == ACTIVE only; DRAFT, SUSPENDED, WITHDRAWN and EXPIRED bids are never eligible price sources."
    constants:
      REPLACEMENT_ADMIN_FEE_USD: 250.00
    precision: "2 decimal places, round_half_up; the max(0, ...) floor means a fallen market yields exactly 0.00, never a negative credit"
    variants:
      - name: MARKET_LOSS
        when: "damages_method == MARKET_LOSS on cancel, and always on declare-default"
        difference: |
          reference_basis_cents comes from the LOCAL bid only.
            eligibility : Bid.status == ACTIVE
                          AND Bid.location_id == contract.location_id
                          AND Bid.commodity_code == contract.commodity_code
                          AND Bid.delivery_period_start <= contract.delivery_end
                          AND contract.delivery_end <= Bid.delivery_period_end
            ranking     : created_at DESC (most recently posted local bid wins)
            tie-break   : basis_cents DESC, then created_at DESC is already unique
            empty pool  : reject the request with ERR_NO_MARKET_BID (422)
          admin fee: 0.00
      - name: REPLACEMENT_COST
        when: "damages_method == REPLACEMENT_COST on cancel"
        difference: |
          reference_basis_cents comes from the DESK-WIDE replacement pool.
            eligibility : Bid.status == ACTIVE
                          AND Bid.commodity_code == contract.commodity_code
                          AND Bid.location_id IN (ElevatorLocation ids whose
                              desk_id == contract.desk_id)
                          AND Bid.delivery_period_start <= contract.delivery_end
                          AND contract.delivery_end <= Bid.delivery_period_end
            ranking     : basis_cents DESC (the dearest basis the desk must pay
                          to replace the bushels)
            tie-break   : created_at ASC
            empty pool  : reject the request with ERR_NO_REPLACEMENT_BID (422)
          admin fee: REPLACEMENT_ADMIN_FEE_USD (250.00), added after rounding

  - name: desk_position_report
    trigger: "GET /grain/trading-desks/{deskId}/position-report"
    algorithm: aggregation
    formula: |
      scope := PurchaseContract rows of this desk with status == ACTIVE,
               narrowed to commodity_code when the query parameter is supplied
      cash_long_bushels := sum of (c.bushels - c.delivered_bushels) over scope
      unpriced_bushels  := sum of c.unpriced_bushels over scope
      net_futures_lots  := sum over HedgePosition p of this desk with
                           p.status IN {OPEN, MARGIN_CALL} (narrowed the same way)
                           of (side_sign(p) * p.lots_open)
      required_hedge_lots := round_half_up(cash_long_bushels / CONTRACT_UNIT_BUSHELS)
      hedge_coverage_ratio := 0 when required_hedge_lots == 0,
                              else round_half_up(
                                  abs(net_futures_lots) / required_hedge_lots, 4)
      limit := the RiskLimit with status == ACTIVE for
               (desk_id, commodity_code); when the report is not narrowed to a
               single commodity_code, or no such row exists,
               risk_limit_status := "NO_LIMIT"
      risk_limit_status := "BREACH" when unpriced_bushels > limit.max_unpriced_bushels
                               or abs(min(0, net_futures_lots)) > limit.max_net_short_lots
                           else "WITHIN"
    input_set: "ACTIVE contracts and OPEN/MARGIN_CALL hedge positions only; SETTLED, CANCELLED, DEFAULTED, ROLLED contracts and LIQUIDATED positions are excluded."
    constants:
      CONTRACT_UNIT_BUSHELS: 5000
    precision: "bushels 2 decimal places, lots integer, hedge_coverage_ratio 4 decimal places round_half_up; an empty scope yields zeros and NEVER a division by zero"

# =============================================================================
# 1.4 Validation Rules Table (evaluated strictly in ascending priority order;
#     the FIRST failing row decides the response)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every id embedded in the path resolves to a stored row, checked left to right"
    error_id: "ERR_TRADING_DESK_NOT_FOUND | ERR_LOCATION_NOT_FOUND | ERR_DISCOUNT_SCHEDULE_NOT_FOUND | ERR_RISK_LIMIT_NOT_FOUND | ERR_RAIL_FLEET_NOT_FOUND | ERR_BID_NOT_FOUND | ERR_HEDGE_POSITION_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_PRICING_ORDER_NOT_FOUND | ERR_MARGIN_CALL_NOT_FOUND | ERR_DELIVERY_TICKET_NOT_FOUND | ERR_FREIGHT_BOOKING_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path id"
  - priority: 4
    category: existence
    check: "every foreign-key id in the request body resolves to a stored row, checked in the order the fields appear in the endpoint's input list"
    error_id: "ERR_TRADING_DESK_NOT_FOUND | ERR_LOCATION_NOT_FOUND | ERR_BID_NOT_FOUND | ERR_HEDGE_POSITION_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_RAIL_FLEET_NOT_FOUND | ERR_FREIGHT_BOOKING_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint whose input carries an FK field"
  - priority: 5
    category: business_constraint
    check: "required input fields are present, enum values are members of their declared sets, numbers respect their declared ranges, dates parse as YYYY-MM-DD and datetimes as ISO 8601 UTC"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 6
    category: business_constraint
    check: "expected_desk_version equals the current TradingDesk.version"
    error_id: ERR_STALE_DESK_VERSION
    http_status: 412
    applies_to: "POST /grain/risk-limits"
  - priority: 7
    category: business_constraint
    check: "expected_fleet_version equals the current RailFleet.version"
    error_id: ERR_STALE_FLEET_VERSION
    http_status: 412
    applies_to: "POST /grain/freight-bookings"
  - priority: 8
    category: state
    check: "the target row's own lifecycle state permits the requested transition (Bid activate/suspend/withdraw, DiscountSchedule activate, FreightBooking confirm/substitute/cancel, MarginCall cure, HedgePosition mark-to-market/add-lots/liquidate)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /grain/bids/{bidId}/activate, POST /grain/bids/{bidId}/suspend, POST /grain/bids/{bidId}/withdraw, POST /grain/discount-schedules/{scheduleId}/activate, POST /grain/freight-bookings/{bookingId}/confirm, POST /grain/freight-bookings/{bookingId}/substitute, POST /grain/freight-bookings/{bookingId}/cancel, POST /grain/margin-calls/{marginCallId}/cure, POST /grain/hedge-positions/{positionId}/add-lots, POST /grain/hedge-positions/{positionId}/mark-to-market, POST /grain/hedge-positions/{positionId}/liquidate"
  - priority: 9
    category: state
    check: "the referenced PurchaseContract has status == ACTIVE"
    error_id: ERR_CONTRACT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /grain/pricing-orders, POST /grain/delivery-tickets, POST /grain/delivery-tickets/{ticketId}/apply, POST /grain/delivery-tickets/{ticketId}/reverse, POST /grain/purchase-contracts/{contractId}/cancel, POST /grain/purchase-contracts/{contractId}/declare-default, POST /grain/purchase-contracts/{contractId}/roll, POST /grain/freight-bookings"
  - priority: 10
    category: state
    check: "the DeliveryTicket is in the state the action requires — GRADED for apply and reject, APPLIED for reverse"
    error_id: ERR_TICKET_NOT_GRADED
    http_status: 409
    applies_to: "POST /grain/delivery-tickets/{ticketId}/apply, POST /grain/delivery-tickets/{ticketId}/reject, POST /grain/delivery-tickets/{ticketId}/reverse"
  - priority: 11
    category: state
    check: "the referenced Bid has status == ACTIVE"
    error_id: ERR_BID_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /grain/purchase-contracts"
  - priority: 12
    category: state
    check: "the referenced HedgePosition has status == OPEN"
    error_id: ERR_HEDGE_POSITION_NOT_OPEN
    http_status: 409
    applies_to: "POST /grain/purchase-contracts, POST /grain/purchase-contracts/{contractId}/roll, POST /grain/pricing-orders with component == FUTURES"
  - priority: 13
    category: state
    check: "when the DeliveryTicket carries a freight_booking_id, that FreightBooking has status == CONFIRMED"
    error_id: ERR_FREIGHT_BOOKING_NOT_CONFIRMED
    http_status: 409
    applies_to: "POST /grain/delivery-tickets/{ticketId}/apply"
  - priority: 14
    category: business_referential
    check: "the HedgePosition's desk_id, commodity_code and futures_month all equal the bid's elevator desk_id, the bid's commodity_code and the bid's futures_month (for a roll: the successor's futures_month is taken from the new position, but desk_id and commodity_code must still match)"
    error_id: ERR_HEDGE_POSITION_MISMATCH
    http_status: 422
    applies_to: "POST /grain/purchase-contracts, POST /grain/purchase-contracts/{contractId}/roll"
  - priority: 15
    category: business_referential
    check: "the DeliveryTicket's location_id equals the contract's location_id"
    error_id: ERR_LOCATION_MISMATCH
    http_status: 422
    applies_to: "POST /grain/delivery-tickets"
  - priority: 16
    category: business_referential
    check: "the contract's ElevatorLocation has rail_served == true and the RailFleet's home_location_id equals the contract's location_id"
    error_id: ERR_LOCATION_NOT_RAIL_SERVED
    http_status: 422
    applies_to: "POST /grain/freight-bookings, POST /grain/freight-bookings/{bookingId}/substitute"
  - priority: 17
    category: business_referential
    check: "bid.delivery_period_start <= delivery_start <= delivery_end <= bid.delivery_period_end (closed interval containment on both ends)"
    error_id: ERR_DELIVERY_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /grain/purchase-contracts, POST /grain/purchase-contracts/{contractId}/roll"
  - priority: 18
    category: business_temporal
    check: "the logical clock is strictly before bid.expires_at"
    error_id: ERR_BID_EXPIRED
    http_status: 422
    applies_to: "POST /grain/bids/{bidId}/activate"
  - priority: 19
    category: business_temporal
    check: "the logical clock is at or before call.cure_deadline_at (an exact-instant cure is accepted)"
    error_id: ERR_MARGIN_CALL_EXPIRED
    http_status: 422
    applies_to: "POST /grain/margin-calls/{marginCallId}/cure"
  - priority: 20
    category: business_temporal
    check: "the logical clock is strictly after contract.delivery_end plus DEFAULT_GRACE_DAYS, measured as 23:59:59.999Z of delivery_end plus 10 days"
    error_id: ERR_GRACE_PERIOD_NOT_ELAPSED
    http_status: 422
    applies_to: "POST /grain/purchase-contracts/{contractId}/declare-default"
  - priority: 21
    category: business_safety
    check: "contract.pricing_locked is false — checked BEFORE the desk posture gate, so a pricing order against a locked contract on a FROZEN desk reports the contract-level lock, not the desk-level freeze"
    error_id: ERR_PRICING_LOCKED
    http_status: 409
    applies_to: "POST /grain/pricing-orders, POST /grain/purchase-contracts/{contractId}/roll"
  - priority: 22
    category: business_safety
    check: "the owning TradingDesk's posture is not FROZEN"
    error_id: ERR_DESK_FROZEN
    http_status: 409
    applies_to: "POST /grain/purchase-contracts, POST /grain/pricing-orders, POST /grain/purchase-contracts/{contractId}/roll"
  - priority: 23
    category: business_safety
    check: "when contract_type == DEFERRED, the owning TradingDesk's posture is not RESTRICTED"
    error_id: ERR_DESK_RESTRICTED
    http_status: 409
    applies_to: "POST /grain/purchase-contracts"
  - priority: 24
    category: business_safety
    check: "when an ACTIVE RiskLimit exists for (desk_id, commodity_code), desk.unpriced_bushels + the new contract's unpriced_bushels must NOT be strictly greater than max_unpriced_bushels; a projected total exactly equal to the ceiling is accepted. With no ACTIVE RiskLimit the check is skipped entirely."
    error_id: ERR_RISK_LIMIT_BREACH
    http_status: 422
    applies_to: "POST /grain/purchase-contracts"
  - priority: 25
    category: business_safety
    check: "the acting X-User-ID differs from contract.created_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /grain/purchase-contracts/{contractId}/cancel"
  - priority: 26
    category: business_constraint
    check: "no other Bid with status IN {ACTIVE, SUSPENDED} shares (location_id, commodity_code, futures_month, delivery_period_start)"
    error_id: ERR_DUPLICATE_BID
    http_status: 409
    applies_to: "POST /grain/bids/{bidId}/activate"
  - priority: 27
    category: business_constraint
    check: "the half-open occupancy interval [placement_at, release_at + FLEET_TURNAROUND_HOURS) does not intersect the interval of any FreightBooking on the same RailFleet with status IN {REQUESTED, CONFIRMED}; touching endpoints do NOT intersect"
    error_id: ERR_FLEET_UNAVAILABLE
    http_status: 409
    applies_to: "POST /grain/freight-bookings, POST /grain/freight-bookings/{bookingId}/substitute"
  - priority: 28
    category: business_constraint
    check: "the sum of bushels over ACTIVE PurchaseContract rows at the same ElevatorLocation whose CLOSED delivery date interval [delivery_start, delivery_end] intersects the new contract's closed interval — endpoints touching DOES count as intersecting — plus the new contract's bushels, must not exceed location.intake_capacity_bushels"
    error_id: ERR_LOCATION_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /grain/purchase-contracts, POST /grain/purchase-contracts/{contractId}/roll"
  - priority: 29
    category: business_constraint
    check: "a DiscountSchedule with status == ACTIVE exists for the contract's commodity_code"
    error_id: ERR_NO_ACTIVE_DISCOUNT_SCHEDULE
    http_status: 422
    applies_to: "POST /grain/delivery-tickets"
  - priority: 30
    category: business_constraint
    check: "for a FULLY_PRICED contract under MARKET_LOSS, at least one Bid satisfies the MARKET_LOSS eligibility filter"
    error_id: ERR_NO_MARKET_BID
    http_status: 422
    applies_to: "POST /grain/purchase-contracts/{contractId}/cancel with damages_method == MARKET_LOSS, POST /grain/purchase-contracts/{contractId}/declare-default"
  - priority: 31
    category: business_constraint
    check: "for a FULLY_PRICED contract under REPLACEMENT_COST, at least one Bid satisfies the REPLACEMENT_COST eligibility filter"
    error_id: ERR_NO_REPLACEMENT_BID
    http_status: 422
    applies_to: "POST /grain/purchase-contracts/{contractId}/cancel with damages_method == REPLACEMENT_COST"
  - priority: 32
    category: business_fiscal
    check: "cars_requested <= fleet.car_count"
    error_id: ERR_CARS_EXCEED_FLEET
    http_status: 422
    applies_to: "POST /grain/freight-bookings, POST /grain/freight-bookings/{bookingId}/substitute"
  - priority: 33
    category: business_fiscal
    check: "position.lots_open - position.lots_committed >= round_half_up(bushels / CONTRACT_UNIT_BUSHELS)"
    error_id: ERR_INSUFFICIENT_HEDGE_LOTS
    http_status: 422
    applies_to: "POST /grain/purchase-contracts, POST /grain/purchase-contracts/{contractId}/roll"
  - priority: 34
    category: business_fiscal
    check: "bid.contracted_bushels + the new contract's bushels <= bid.max_bushels"
    error_id: ERR_BID_MAX_BUSHELS_EXCEEDED
    http_status: 422
    applies_to: "POST /grain/purchase-contracts"
  - priority: 35
    category: business_fiscal
    check: "the named component still has floating bushels — CASH accepts no orders at all, HTA accepts only BASIS, BASIS accepts only FUTURES — and the order's bushels do not exceed the component's remaining floating bushels"
    error_id: ERR_CONTRACT_ALREADY_PRICED
    http_status: 422
    applies_to: "POST /grain/pricing-orders"
  - priority: 36
    category: business_fiscal
    check: "ticket.net_bushels <= contract.bushels - contract.delivered_bushels"
    error_id: ERR_BUSHELS_EXCEEDED
    http_status: 422
    applies_to: "POST /grain/delivery-tickets/{ticketId}/apply"
  - priority: 37
    category: business_fiscal
    check: "payment_usd >= call.call_amount_usd"
    error_id: ERR_CURE_AMOUNT_INSUFFICIENT
    http_status: 422
    applies_to: "POST /grain/margin-calls/{marginCallId}/cure"

# =============================================================================
# 1.5 API Endpoint Table  (flat topology — every collection is a peer under
# /grain; parentage travels in request bodies, never in the URL)
# =============================================================================
endpoints:
  # --- TradingDesk ----------------------------------------------------------
  - method: POST
    path: "/grain/trading-desks"
    description: "Register a merchandising desk with its clearing credit line"
    roles: [DeskAdmin]
    code: 201
    input: [desk_code, name, credit_line_usd]
    output: TradingDesk
    side_effects: ["posture initialised to NORMAL; all computed aggregates initialised to 0"]
  - method: GET
    path: "/grain/trading-desks"
    description: "List trading desks"
    roles: [DeskAdmin, Merchandiser, FuturesTrader, RiskOfficer, GrainInspector, FreightCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: TradingDesk[]
    side_effects: []
  - method: GET
    path: "/grain/trading-desks/{deskId}"
    description: "Read one trading desk including its live posture and credit aggregates"
    roles: [DeskAdmin, Merchandiser, FuturesTrader, RiskOfficer, GrainInspector, FreightCoordinator]
    code: 200
    input: []
    output: TradingDesk
    side_effects: []
  - method: GET
    path: "/grain/trading-desks/{deskId}/position-report"
    description: "Computed read: cash length, unpriced exposure, net futures lots, hedge coverage and risk-limit status for the desk, optionally narrowed to one commodity"
    roles: [DeskAdmin, Merchandiser, FuturesTrader, RiskOfficer]
    code: 200
    input: ["commodity_code?"]
    output: { desk_id: string, commodity_code: string, cash_long_bushels: number, unpriced_bushels: number, net_futures_lots: integer, required_hedge_lots: integer, hedge_coverage_ratio: number, margin_requirement_usd: number, open_margin_call_usd: number, credit_utilization: number, posture: string, risk_limit_status: string }
    side_effects: []

  # --- ElevatorLocation -----------------------------------------------------
  - method: POST
    path: "/grain/elevator-locations"
    description: "Register a country elevator under a desk"
    roles: [DeskAdmin]
    code: 201
    input: ["desk_id", "location_code", "name", "intake_capacity_bushels", "rail_served?"]
    output: ElevatorLocation
    side_effects: ["committed_intake_bushels initialised to 0"]
  - method: GET
    path: "/grain/elevator-locations"
    description: "List elevators, optionally filtered to one desk"
    roles: [DeskAdmin, Merchandiser, FuturesTrader, RiskOfficer, GrainInspector, FreightCoordinator]
    code: 200
    input: ["desk_id?", "limit?", "offset?"]
    output: ElevatorLocation[]
    side_effects: []
  - method: GET
    path: "/grain/elevator-locations/{locationId}"
    description: "Read one elevator"
    roles: [DeskAdmin, Merchandiser, FuturesTrader, RiskOfficer, GrainInspector, FreightCoordinator]
    code: 200
    input: []
    output: ElevatorLocation
    side_effects: []

  # --- DiscountSchedule -----------------------------------------------------
  - method: POST
    path: "/grain/discount-schedules"
    description: "Draft a quality discount schedule for one commodity"
    roles: [DeskAdmin]
    code: 201
    input: ["commodity_code", "effective_from", "tiers", "moisture_standard_pct?", "shrink_factor_pct_per_point?"]
    output: DiscountSchedule
    side_effects: ["status initialised to DRAFT; the schedule is not consulted at grading until activated"]
  - method: POST
    path: "/grain/discount-schedules/{scheduleId}/activate"
    description: "Activate a drafted schedule, superseding the previous ACTIVE schedule for the same commodity"
    roles: [DeskAdmin]
    code: 200
    input: []
    output: DiscountSchedule
    side_effects: ["status DRAFT -> ACTIVE", "the prior ACTIVE schedule for the same commodity_code transitions ACTIVE -> SUPERSEDED"]
  - method: GET
    path: "/grain/discount-schedules"
    description: "List discount schedules"
    roles: [DeskAdmin, Merchandiser, FuturesTrader, RiskOfficer, GrainInspector, FreightCoordinator]
    code: 200
    input: ["commodity_code?", "status?", "limit?", "offset?"]
    output: DiscountSchedule[]
    side_effects: []
  - method: GET
    path: "/grain/discount-schedules/{scheduleId}"
    description: "Read one discount schedule with its tier rows"
    roles: [DeskAdmin, Merchandiser, FuturesTrader, RiskOfficer, GrainInspector, FreightCoordinator]
    code: 200
    input: []
    output: DiscountSchedule
    side_effects: []

  # --- RiskLimit ------------------------------------------------------------
  - method: POST
    path: "/grain/risk-limits"
    description: "Publish a new risk limit for a desk and commodity; supersedes the prior ACTIVE limit. Guarded by optimistic concurrency on the desk's version."
    roles: [RiskOfficer]
    code: 201
    input: [desk_id, commodity_code, max_unpriced_bushels, max_net_short_lots, expected_desk_version]
    output: RiskLimit
    side_effects: ["the prior ACTIVE RiskLimit for the same (desk_id, commodity_code) transitions ACTIVE -> SUPERSEDED", "increments TradingDesk.version by 1"]
  - method: GET
    path: "/grain/risk-limits"
    description: "List risk limits, optionally filtered by desk, commodity or status"
    roles: [DeskAdmin, Merchandiser, FuturesTrader, RiskOfficer, GrainInspector, FreightCoordinator]
    code: 200
    input: ["desk_id?", "commodity_code?", "status?", "limit?", "offset?"]
    output: RiskLimit[]
    side_effects: []
  - method: GET
    path: "/grain/risk-limits/{riskLimitId}"
    description: "Read one risk limit"
    roles: [DeskAdmin, Merchandiser, FuturesTrader, RiskOfficer, GrainInspector, FreightCoordinator]
    code: 200
    input: []
    output: RiskLimit
    side_effects: []

  # --- RailFleet ------------------------------------------------------------
  - method: POST
    path: "/grain/rail-fleets"
    description: "Register a rail car set homed at an elevator"
    roles: [FreightCoordinator]
    code: 201
    input: [home_location_id, fleet_code, car_count]
    output: RailFleet
    side_effects: []
  - method: GET
    path: "/grain/rail-fleets"
    description: "List rail fleets, optionally filtered to one home elevator"
    roles: [DeskAdmin, Merchandiser, FuturesTrader, RiskOfficer, GrainInspector, FreightCoordinator]
    code: 200
    input: ["home_location_id?", "limit?", "offset?"]
    output: RailFleet[]
    side_effects: []
  - method: GET
    path: "/grain/rail-fleets/{fleetId}"
    description: "Read one rail fleet"
    roles: [DeskAdmin, Merchandiser, FuturesTrader, RiskOfficer, GrainInspector, FreightCoordinator]
    code: 200
    input: []
    output: RailFleet
    side_effects: []

  # --- Bid ------------------------------------------------------------------
  - method: POST
    path: "/grain/bids"
    description: "Draft a posted bid for a delivery period at one elevator"
    roles: [Merchandiser]
    code: 201
    input: [location_id, commodity_code, futures_month, delivery_period_start, delivery_period_end, basis_cents, max_bushels, expires_at]
    output: Bid
    side_effects: ["status initialised to DRAFT; contracted_bushels initialised to 0"]
  - method: POST
    path: "/grain/bids/{bidId}/activate"
    description: "Post the bid to the market (DRAFT -> ACTIVE or SUSPENDED -> ACTIVE)"
    roles: [Merchandiser]
    code: 200
    input: []
    output: Bid
    side_effects: ["status becomes ACTIVE; the bid becomes an eligible contract source and an eligible damages price source"]
  - method: POST
    path: "/grain/bids/{bidId}/suspend"
    description: "Pull the bid off the board without cancelling it (ACTIVE -> SUSPENDED)"
    roles: [Merchandiser]
    code: 200
    input: []
    output: Bid
    side_effects: ["status becomes SUSPENDED"]
  - method: POST
    path: "/grain/bids/{bidId}/withdraw"
    description: "Permanently withdraw the bid"
    roles: [Merchandiser]
    code: 200
    input: []
    output: Bid
    side_effects: ["status becomes WITHDRAWN; the bid stops being an eligible damages price source"]
  - method: GET
    path: "/grain/bids"
    description: "List bids, optionally filtered by elevator, commodity or status"
    roles: [DeskAdmin, Merchandiser, FuturesTrader, RiskOfficer, GrainInspector, FreightCoordinator]
    code: 200
    input: ["location_id?", "commodity_code?", "status?", "limit?", "offset?"]
    output: Bid[]
    side_effects: []
  - method: GET
    path: "/grain/bids/{bidId}"
    description: "Read one bid"
    roles: [DeskAdmin, Merchandiser, FuturesTrader, RiskOfficer, GrainInspector, FreightCoordinator]
    code: 200
    input: []
    output: Bid
    side_effects: []

  # --- HedgePosition --------------------------------------------------------
  - method: POST
    path: "/grain/hedge-positions"
    description: "Open a board position for a desk, commodity and futures month"
    roles: [FuturesTrader]
    code: 201
    input: [desk_id, commodity_code, futures_month, side, lots_open, avg_entry_price_cents]
    output: HedgePosition
    side_effects: ["posted_margin_usd := lots_open * INITIAL_MARGIN_USD_PER_LOT[commodity_code]", "last_settlement_price_cents := avg_entry_price_cents", "TradingDesk.margin_requirement_usd, available_credit_usd, credit_utilization and posture recomputed"]
  - method: POST
    path: "/grain/hedge-positions/{positionId}/add-lots"
    description: "Add lots to an OPEN position and re-average the entry price"
    roles: [FuturesTrader]
    code: 200
    input: [lots, fill_price_cents]
    output: HedgePosition
    side_effects: ["avg_entry_price_cents recomputed by hedge_avg_entry_price to 4 decimal places", "lots_open increases; posted_margin_usd recomputed", "TradingDesk.margin_requirement_usd, credit_utilization and posture recomputed"]
  - method: POST
    path: "/grain/hedge-positions/{positionId}/mark-to-market"
    description: "Mark the position at a new board settlement price; issues a MarginCall when account equity falls below maintenance margin"
    roles: [FuturesTrader]
    code: 200
    input: [settlement_price_cents]
    output: HedgePosition
    side_effects: ["last_settlement_price_cents and unrealized_pnl_usd recomputed by mark_to_market_equity", "on breach: status OPEN -> MARGIN_CALL and a MarginCall row is created with call_amount_usd from margin_call_amount", "TradingDesk.open_margin_call_usd, available_credit_usd, credit_utilization and posture recomputed", "when posture becomes FROZEN, pricing_locked := true on every ACTIVE contract of the desk whose pricing_status != FULLY_PRICED"]
  - method: POST
    path: "/grain/hedge-positions/{positionId}/liquidate"
    description: "Close the position at a settlement price. From OPEN this requires lots_committed == 0; from MARGIN_CALL it is the forced-liquidation path and requires the OPEN MarginCall to be past its cure deadline."
    roles: [FuturesTrader]
    code: 200
    input: [settlement_price_cents]
    output: HedgePosition
    side_effects: ["realized_pnl_usd booked; posted_margin_usd := 0; unrealized_pnl_usd := 0; status := LIQUIDATED", "from MARGIN_CALL the OPEN MarginCall transitions OPEN -> DEFAULTED", "TradingDesk.margin_requirement_usd, open_margin_call_usd, committed_hedge_lots, available_credit_usd, credit_utilization, realized_hedge_pnl_usd and posture recomputed"]
  - method: GET
    path: "/grain/hedge-positions"
    description: "List hedge positions, optionally filtered by desk, commodity or status"
    roles: [DeskAdmin, Merchandiser, FuturesTrader, RiskOfficer, GrainInspector, FreightCoordinator]
    code: 200
    input: ["desk_id?", "commodity_code?", "status?", "limit?", "offset?"]
    output: HedgePosition[]
    side_effects: []
  - method: GET
    path: "/grain/hedge-positions/{positionId}"
    description: "Read one hedge position"
    roles: [DeskAdmin, Merchandiser, FuturesTrader, RiskOfficer, GrainInspector, FreightCoordinator]
    code: 200
    input: []
    output: HedgePosition
    side_effects: []

  # --- PurchaseContract -----------------------------------------------------
  - method: POST
    path: "/grain/purchase-contracts"
    description: "Strike a purchase contract against a posted bid. futures_price_cents is REQUIRED for contract_type CASH and HTA and MUST be omitted for BASIS and DEFERRED."
    roles: [Merchandiser]
    code: 201
    input: ["bid_id", "hedge_position_id", "contract_type", "bushels", "seller_name", "delivery_start", "delivery_end", "futures_price_cents?", "settlement_basis?"]
    output: PurchaseContract
    side_effects: ["desk_id, location_id, commodity_code and futures_month copied from the bid; created_by_user_id := X-User-ID", "basis_cents copied from bid.basis_cents for CASH and BASIS; futures_price_cents taken from input for CASH and HTA", "hedge_lots_assigned computed by contract_hedge_lots and committed on the HedgePosition", "Bid.contracted_bushels, ElevatorLocation.committed_intake_bushels, TradingDesk.committed_hedge_lots, open_bushel_commitment and unpriced_bushels recomputed"]
  - method: POST
    path: "/grain/purchase-contracts/{contractId}/roll"
    description: "Roll the undelivered balance of a contract into a later futures month, creating a successor contract and retiring this one"
    roles: [Merchandiser]
    code: 201
    input: [new_hedge_position_id, new_delivery_start, new_delivery_end, roll_spread_cents]
    output: PurchaseContract
    side_effects: ["this contract transitions ACTIVE -> ROLLED and releases its hedge lots", "a successor PurchaseContract is created with rolled_from_contract_id set, bushels := bushels - delivered_bushels and roll_adjustment_cents := roll_spread_cents - ROLL_SERVICE_FEE_CENTS", "TradingDesk.committed_hedge_lots, open_bushel_commitment and unpriced_bushels recomputed"]
  - method: POST
    path: "/grain/purchase-contracts/{contractId}/cancel"
    description: "Mutually cancel a contract and assess buyout damages under the requested variant"
    roles: [RiskOfficer]
    code: 200
    input: [damages_method, cancellation_reason]
    output: PurchaseContract
    side_effects: ["status ACTIVE -> CANCELLED; damages_usd computed by cancellation_damages under the requested variant; termination_reason stored", "hedge lots released; ElevatorLocation.committed_intake_bushels and TradingDesk aggregates recomputed"]
  - method: POST
    path: "/grain/purchase-contracts/{contractId}/declare-default"
    description: "Declare seller default after the delivery grace period; damages always use the MARKET_LOSS variant"
    roles: [RiskOfficer]
    code: 200
    input: [default_reason]
    output: PurchaseContract
    side_effects: ["status ACTIVE -> DEFAULTED; damages_usd computed by cancellation_damages under MARKET_LOSS; termination_reason stored", "hedge lots released; ElevatorLocation.committed_intake_bushels and TradingDesk aggregates recomputed"]
  - method: GET
    path: "/grain/purchase-contracts"
    description: "List purchase contracts with filters covering every foreign key the entity declares"
    roles: [DeskAdmin, Merchandiser, FuturesTrader, RiskOfficer, GrainInspector, FreightCoordinator]
    code: 200
    input: ["bid_id?", "desk_id?", "location_id?", "hedge_position_id?", "rolled_from_contract_id?", "status?", "limit?", "offset?"]
    output: PurchaseContract[]
    side_effects: []
  - method: GET
    path: "/grain/purchase-contracts/{contractId}"
    description: "Read one purchase contract including all three state axes and every computed price and bushel field"
    roles: [DeskAdmin, Merchandiser, FuturesTrader, RiskOfficer, GrainInspector, FreightCoordinator]
    code: 200
    input: []
    output: PurchaseContract
    side_effects: []

  # --- PricingOrder ---------------------------------------------------------
  - method: POST
    path: "/grain/pricing-orders"
    description: "Fix all or part of a floating leg on a contract. Either the Merchandiser or the FuturesTrader may place an order on either component."
    roles: [Merchandiser, FuturesTrader]
    code: 201
    input: [contract_id, component, bushels, price_cents]
    output: PricingOrder
    side_effects: ["contract.futures_price_cents or basis_cents rewritten by weighted_average_leg_price", "contract.priced_futures_bushels / priced_basis_bushels / unpriced_bushels / gross_unit_price_cents / pricing_status recomputed", "TradingDesk.unpriced_bushels recomputed", "when pricing_status becomes FULLY_PRICED while delivery_status == COMPLETE, the contract transitions ACTIVE -> SETTLED"]
  - method: GET
    path: "/grain/pricing-orders"
    description: "List pricing orders, optionally filtered by contract or component"
    roles: [DeskAdmin, Merchandiser, FuturesTrader, RiskOfficer, GrainInspector, FreightCoordinator]
    code: 200
    input: ["contract_id?", "component?", "limit?", "offset?"]
    output: PricingOrder[]
    side_effects: []
  - method: GET
    path: "/grain/pricing-orders/{pricingOrderId}"
    description: "Read one pricing order (immutable event row: id and created_at only, no version)"
    roles: [DeskAdmin, Merchandiser, FuturesTrader, RiskOfficer, GrainInspector, FreightCoordinator]
    code: 200
    input: []
    output: PricingOrder
    side_effects: []

  # --- MarginCall -----------------------------------------------------------
  - method: POST
    path: "/grain/margin-calls/{marginCallId}/cure"
    description: "Wire variation margin to cure an open call and return the position to OPEN"
    roles: [RiskOfficer]
    code: 200
    input: [payment_usd]
    output: MarginCall
    side_effects: ["status OPEN -> CURED; cured_amount_usd stored", "HedgePosition.posted_margin_usd += payment_usd and status MARGIN_CALL -> OPEN", "TradingDesk.open_margin_call_usd, available_credit_usd, credit_utilization and posture recomputed; pricing_locked cleared when posture leaves FROZEN"]
  - method: GET
    path: "/grain/margin-calls"
    description: "List margin calls, optionally filtered by position or status"
    roles: [DeskAdmin, Merchandiser, FuturesTrader, RiskOfficer, GrainInspector, FreightCoordinator]
    code: 200
    input: ["hedge_position_id?", "status?", "limit?", "offset?"]
    output: MarginCall[]
    side_effects: []
  - method: GET
    path: "/grain/margin-calls/{marginCallId}"
    description: "Read one margin call"
    roles: [DeskAdmin, Merchandiser, FuturesTrader, RiskOfficer, GrainInspector, FreightCoordinator]
    code: 200
    input: []
    output: MarginCall
    side_effects: []

  # --- DeliveryTicket -------------------------------------------------------
  - method: POST
    path: "/grain/delivery-tickets"
    description: "Grade an inbound load against a contract; shrink, discounts and settlement value are computed and frozen at this moment"
    roles: [GrainInspector]
    code: 201
    input: ["contract_id", "location_id", "gross_bushels", "moisture_pct", "test_weight_lbs", "foreign_material_pct", "damage_pct", "freight_booking_id?"]
    output: DeliveryTicket
    side_effects: ["discount_schedule_id pinned to the ACTIVE schedule for the contract's commodity", "shrink_pct and net_bushels computed by delivery_net_bushels under the contract's settlement_basis", "discount_total_usd computed by quality_discount_total", "gross_contract_value_usd, service_fee_cents_per_bushel, net_unit_price_cents and settlement_value_usd computed by ticket_settlement_value", "graded_by_user_id := X-User-ID; status := GRADED; no contract, hedge or desk field changes yet"]
  - method: POST
    path: "/grain/delivery-tickets/{ticketId}/apply"
    description: "Apply a graded ticket to its contract, advancing the delivery axis and firing the settlement cascade"
    roles: [Merchandiser]
    code: 200
    input: []
    output: DeliveryTicket
    side_effects: ["status GRADED -> APPLIED", "contract.delivered_bushels, settled_value_usd and delivery_status updated", "when delivery completes a FULLY_PRICED contract, contract.status ACTIVE -> SETTLED with the hedge-lift, desk-recompute and pricing-unlock cascade hops", "a linked FreightBooking transitions CONFIRMED -> COMPLETED", "TradingDesk.open_bushel_commitment recomputed"]
  - method: POST
    path: "/grain/delivery-tickets/{ticketId}/reject"
    description: "Reject a graded load outright; nothing is applied to the contract"
    roles: [GrainInspector]
    code: 200
    input: [rejection_reason]
    output: DeliveryTicket
    side_effects: ["status GRADED -> REJECTED; disposition_reason stored; no other row changes"]
  - method: POST
    path: "/grain/delivery-tickets/{ticketId}/reverse"
    description: "Reverse an applied ticket, unwinding every bushel and value effect it had on the contract"
    roles: [GrainInspector]
    code: 200
    input: [reversal_reason]
    output: DeliveryTicket
    side_effects: ["status APPLIED -> REVERSED; disposition_reason stored", "contract.delivered_bushels, settled_value_usd and delivery_status restored to their pre-apply values", "TradingDesk.open_bushel_commitment restored to its pre-apply value"]
  - method: GET
    path: "/grain/delivery-tickets"
    description: "List delivery tickets with filters covering every foreign key the entity declares"
    roles: [DeskAdmin, Merchandiser, FuturesTrader, RiskOfficer, GrainInspector, FreightCoordinator]
    code: 200
    input: ["contract_id?", "location_id?", "freight_booking_id?", "discount_schedule_id?", "status?", "limit?", "offset?"]
    output: DeliveryTicket[]
    side_effects: []
  - method: GET
    path: "/grain/delivery-tickets/{ticketId}"
    description: "Read one delivery ticket with every frozen grading result"
    roles: [DeskAdmin, Merchandiser, FuturesTrader, RiskOfficer, GrainInspector, FreightCoordinator]
    code: 200
    input: []
    output: DeliveryTicket
    side_effects: []

  # --- FreightBooking -------------------------------------------------------
  - method: POST
    path: "/grain/freight-bookings"
    description: "Reserve a rail car set for a contract over a placement window. Guarded by optimistic concurrency on the fleet's version."
    roles: [FreightCoordinator]
    code: 201
    input: [fleet_id, contract_id, cars_requested, placement_at, release_at, expected_fleet_version]
    output: FreightBooking
    side_effects: ["occupancy_end_at := release_at + FLEET_TURNAROUND_HOURS", "status initialised to REQUESTED; substitution_count initialised to 0", "increments RailFleet.version by 1"]
  - method: POST
    path: "/grain/freight-bookings/{bookingId}/confirm"
    description: "Confirm a requested booking so its cars may carry an applied delivery ticket"
    roles: [FreightCoordinator]
    code: 200
    input: []
    output: FreightBooking
    side_effects: ["status REQUESTED -> CONFIRMED"]
  - method: POST
    path: "/grain/freight-bookings/{bookingId}/substitute"
    description: "Move a still-REQUESTED booking onto a different rail fleet without leaving the REQUESTED state"
    roles: [FreightCoordinator]
    code: 200
    input: [new_fleet_id]
    output: FreightBooking
    side_effects: ["fleet_id := new_fleet_id; substitution_count += 1; status stays REQUESTED", "increments RailFleet.version by 1 on the new fleet"]
  - method: POST
    path: "/grain/freight-bookings/{bookingId}/cancel"
    description: "Cancel a booking and free the fleet occupancy interval"
    roles: [FreightCoordinator]
    code: 200
    input: [cancellation_reason]
    output: FreightBooking
    side_effects: ["status -> CANCELLED; cancellation_reason stored; the interval stops blocking new bookings on that fleet"]
  - method: GET
    path: "/grain/freight-bookings"
    description: "List freight bookings, optionally filtered by fleet, contract or status"
    roles: [DeskAdmin, Merchandiser, FuturesTrader, RiskOfficer, GrainInspector, FreightCoordinator]
    code: 200
    input: ["fleet_id?", "contract_id?", "status?", "limit?", "offset?"]
    output: FreightBooking[]
    side_effects: []
  - method: GET
    path: "/grain/freight-bookings/{bookingId}"
    description: "Read one freight booking"
    roles: [DeskAdmin, Merchandiser, FuturesTrader, RiskOfficer, GrainInspector, FreightCoordinator]
    code: 200
    input: []
    output: FreightBooking
    side_effects: []

  # --- Test-driving endpoint (outside the public business surface) ----------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. The clock's startup default is exactly 2026-08-01T00:00:00Z and it never falls back to real wall-clock time. Advancing the clock to or past an ACTIVE or SUSPENDED Bid's expires_at transitions that bid to EXPIRED."
    roles: [DeskAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string, expired_bid_ids: array }
    side_effects: ["Bid rows with status IN {ACTIVE, SUSPENDED} and expires_at <= the new clock value transition to EXPIRED and their ids are returned in expired_bid_ids"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the six declared roles" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "the acting role is not listed on the endpoint" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "missing required field, enum value outside its declared set, number outside its declared range, or malformed date/datetime" }
  - { id: ERR_TRADING_DESK_NOT_FOUND, http: 404, condition: "deskId in the path or desk_id in the body does not resolve" }
  - { id: ERR_LOCATION_NOT_FOUND, http: 404, condition: "locationId in the path or location_id / home_location_id in the body does not resolve" }
  - { id: ERR_DISCOUNT_SCHEDULE_NOT_FOUND, http: 404, condition: "scheduleId in the path does not resolve" }
  - { id: ERR_RISK_LIMIT_NOT_FOUND, http: 404, condition: "riskLimitId in the path does not resolve" }
  - { id: ERR_RAIL_FLEET_NOT_FOUND, http: 404, condition: "fleetId in the path or fleet_id / new_fleet_id in the body does not resolve" }
  - { id: ERR_BID_NOT_FOUND, http: 404, condition: "bidId in the path or bid_id in the body does not resolve" }
  - { id: ERR_HEDGE_POSITION_NOT_FOUND, http: 404, condition: "positionId in the path or hedge_position_id / new_hedge_position_id in the body does not resolve" }
  - { id: ERR_CONTRACT_NOT_FOUND, http: 404, condition: "contractId in the path or contract_id in the body does not resolve" }
  - { id: ERR_PRICING_ORDER_NOT_FOUND, http: 404, condition: "pricingOrderId in the path does not resolve" }
  - { id: ERR_MARGIN_CALL_NOT_FOUND, http: 404, condition: "marginCallId in the path does not resolve" }
  - { id: ERR_DELIVERY_TICKET_NOT_FOUND, http: 404, condition: "ticketId in the path does not resolve" }
  - { id: ERR_FREIGHT_BOOKING_NOT_FOUND, http: 404, condition: "bookingId in the path or freight_booking_id in the body does not resolve" }
  - { id: ERR_STALE_DESK_VERSION, http: 412, condition: "expected_desk_version does not equal the current TradingDesk.version on POST /grain/risk-limits" }
  - { id: ERR_STALE_FLEET_VERSION, http: 412, condition: "expected_fleet_version does not equal the current RailFleet.version on POST /grain/freight-bookings" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "the target Bid, DiscountSchedule, FreightBooking, MarginCall or HedgePosition is not in a state that permits the requested action" }
  - { id: ERR_CONTRACT_NOT_ACTIVE, http: 409, condition: "the referenced PurchaseContract's status is not ACTIVE" }
  - { id: ERR_TICKET_NOT_GRADED, http: 409, condition: "apply or reject on a ticket whose status is not GRADED, or reverse on a ticket whose status is not APPLIED" }
  - { id: ERR_BID_NOT_ACTIVE, http: 409, condition: "PurchaseContract creation against a Bid whose status is not ACTIVE" }
  - { id: ERR_HEDGE_POSITION_NOT_OPEN, http: 409, condition: "the referenced HedgePosition's status is not OPEN" }
  - { id: ERR_FREIGHT_BOOKING_NOT_CONFIRMED, http: 409, condition: "applying a ticket whose freight_booking_id points at a booking that is not CONFIRMED" }
  - { id: ERR_HEDGE_POSITION_MISMATCH, http: 422, condition: "the hedge position's desk_id, commodity_code or futures_month does not agree with the bid" }
  - { id: ERR_LOCATION_MISMATCH, http: 422, condition: "the delivery ticket's location_id differs from the contract's location_id" }
  - { id: ERR_LOCATION_NOT_RAIL_SERVED, http: 422, condition: "the contract's elevator has rail_served == false, or the fleet is not homed at that elevator" }
  - { id: ERR_DELIVERY_WINDOW_INVALID, http: 422, condition: "the requested delivery window is not contained in the bid's closed delivery period, or delivery_end precedes delivery_start" }
  - { id: ERR_BID_EXPIRED, http: 422, condition: "activating a bid when the logical clock is at or past its expires_at" }
  - { id: ERR_MARGIN_CALL_EXPIRED, http: 422, condition: "curing a margin call when the logical clock is strictly after cure_deadline_at" }
  - { id: ERR_GRACE_PERIOD_NOT_ELAPSED, http: 422, condition: "declaring default before delivery_end plus DEFAULT_GRACE_DAYS has elapsed" }
  - { id: ERR_DESK_FROZEN, http: 409, condition: "the owning desk's posture is FROZEN" }
  - { id: ERR_DESK_RESTRICTED, http: 409, condition: "creating a DEFERRED contract while the owning desk's posture is RESTRICTED" }
  - { id: ERR_PRICING_LOCKED, http: 409, condition: "placing a pricing order on, or rolling, a contract whose pricing_locked is true" }
  - { id: ERR_RISK_LIMIT_BREACH, http: 422, condition: "the projected desk unpriced bushels would strictly exceed the ACTIVE RiskLimit's max_unpriced_bushels" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "the acting X-User-ID on cancel equals the contract's created_by_user_id" }
  - { id: ERR_DUPLICATE_BID, http: 409, condition: "activating a bid that collides with another ACTIVE or SUSPENDED bid on (location_id, commodity_code, futures_month, delivery_period_start)" }
  - { id: ERR_FLEET_UNAVAILABLE, http: 409, condition: "the requested fleet occupancy interval intersects an existing REQUESTED or CONFIRMED booking on the same fleet" }
  - { id: ERR_LOCATION_CAPACITY_EXCEEDED, http: 409, condition: "committed bushels over overlapping delivery windows at the elevator would exceed intake_capacity_bushels" }
  - { id: ERR_NO_ACTIVE_DISCOUNT_SCHEDULE, http: 422, condition: "no DiscountSchedule with status ACTIVE exists for the contract's commodity_code at grading time" }
  - { id: ERR_NO_MARKET_BID, http: 422, condition: "the MARKET_LOSS eligibility filter selects no Bid for a FULLY_PRICED contract" }
  - { id: ERR_NO_REPLACEMENT_BID, http: 422, condition: "the REPLACEMENT_COST eligibility filter selects no Bid for a FULLY_PRICED contract" }
  - { id: ERR_CARS_EXCEED_FLEET, http: 422, condition: "cars_requested exceeds the fleet's car_count" }
  - { id: ERR_INSUFFICIENT_HEDGE_LOTS, http: 422, condition: "the hedge position's lots_available is smaller than the contract's hedge_lots_assigned" }
  - { id: ERR_BID_MAX_BUSHELS_EXCEEDED, http: 422, condition: "the bid's contracted_bushels plus the new contract's bushels exceeds max_bushels" }
  - { id: ERR_CONTRACT_ALREADY_PRICED, http: 422, condition: "a pricing order names a component that is already fully fixed for the contract, is disallowed for the contract_type, or exceeds the component's remaining floating bushels" }
  - { id: ERR_BUSHELS_EXCEEDED, http: 422, condition: "applying a ticket whose net_bushels exceeds the contract's undelivered balance" }
  - { id: ERR_CURE_AMOUNT_INSUFFICIENT, http: 422, condition: "payment_usd is smaller than the call's call_amount_usd" }

# =============================================================================
# 1.7 RBAC Matrix (segregation of duties)
# =============================================================================
roles:
  - name: DeskAdmin
    description: "Reference-data operator: stands up desks, elevators and quality discount schedules, and drives the logical clock. Never touches a bid, a contract, a hedge or a ticket."
    identity: opaque
    exclusive_operations:
      - "POST /grain/trading-desks"
      - "POST /grain/elevator-locations"
      - "POST /grain/discount-schedules"
      - "POST /grain/discount-schedules/{scheduleId}/activate"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "every GET endpoint"

  - name: Merchandiser
    description: "Posts bids, strikes and rolls purchase contracts, places pricing orders on either leg, and applies graded tickets to contracts. Cannot cancel a contract it created (segregation of duties) and cannot touch the futures book."
    identity: opaque
    exclusive_operations:
      - "POST /grain/bids"
      - "POST /grain/bids/{bidId}/activate"
      - "POST /grain/bids/{bidId}/suspend"
      - "POST /grain/bids/{bidId}/withdraw"
      - "POST /grain/purchase-contracts"
      - "POST /grain/purchase-contracts/{contractId}/roll"
      - "POST /grain/delivery-tickets/{ticketId}/apply"
    shared_operations:
      - "POST /grain/pricing-orders (either component)"
      - "every GET endpoint"

  - name: FuturesTrader
    description: "Owns the board: opens, grows, marks and liquidates hedge positions, and may also place pricing orders on either leg. Cannot create bids or contracts and cannot cure a margin call."
    identity: opaque
    exclusive_operations:
      - "POST /grain/hedge-positions"
      - "POST /grain/hedge-positions/{positionId}/add-lots"
      - "POST /grain/hedge-positions/{positionId}/mark-to-market"
      - "POST /grain/hedge-positions/{positionId}/liquidate"
    shared_operations:
      - "POST /grain/pricing-orders (either component)"
      - "every GET endpoint"

  - name: RiskOfficer
    description: "Sets risk limits, wires variation margin to cure calls, and terminates contracts by cancellation or default. Cannot create the exposure it polices — no bids, no contracts, no hedges."
    identity: opaque
    exclusive_operations:
      - "POST /grain/risk-limits"
      - "POST /grain/margin-calls/{marginCallId}/cure"
      - "POST /grain/purchase-contracts/{contractId}/cancel"
      - "POST /grain/purchase-contracts/{contractId}/declare-default"
    shared_operations:
      - "every GET endpoint"

  - name: GrainInspector
    description: "Grades inbound loads and disposes of them by rejection or reversal. Grades the ticket but never applies it — application is the Merchandiser's act."
    identity: opaque
    exclusive_operations:
      - "POST /grain/delivery-tickets"
      - "POST /grain/delivery-tickets/{ticketId}/reject"
      - "POST /grain/delivery-tickets/{ticketId}/reverse"
    shared_operations:
      - "every GET endpoint"

  - name: FreightCoordinator
    description: "Acquires and re-targets rail car sets. Owns fleets and bookings and nothing else."
    identity: opaque
    exclusive_operations:
      - "POST /grain/rail-fleets"
      - "POST /grain/freight-bookings"
      - "POST /grain/freight-bookings/{bookingId}/confirm"
      - "POST /grain/freight-bookings/{bookingId}/substitute"
      - "POST /grain/freight-bookings/{bookingId}/cancel"
    shared_operations:
      - "every GET endpoint"
