            - { call: "POST /pulp-batches/${pb_id}/start", payload: {}, as: MachineOperator, as_user_id: "mo_1" }
            - { call: "POST /pulp-batches/${pb_id}/screen", payload: {}, as: MachineOperator, as_user_id: "mo_1" }
            - { call: "POST /pulp-batches/${pb_id}/clean", payload: { measured_reject_tons: 4.500 }, as: MachineOperator, as_user_id: "mo_1" }
            - { call: "POST /pulp-batches/${pb_id}/approve", payload: {}, as: QualityLab, as_user_id: "ql_cert" }
