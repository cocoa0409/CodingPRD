          Mode (c) circular-looking dependency: the PARTIAL -> SUBMITTED
          transition mutates partial_count and submitted_count, which are the
          very inputs of response_rate. The scaffold pins evaluation order:
          decrement partial THEN increment submitted THEN recompute rate once —
