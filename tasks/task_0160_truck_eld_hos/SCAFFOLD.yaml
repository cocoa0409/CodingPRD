scenario: |
  Truck ELD Electronic Log & HOS: driver identity binding, 11/14/70-Hour rules,
  Sleeper Berth split, Personal Conveyance, FMCSA violation reporting,
  Adverse Conditions exemption.

domain_name: truck-eld-hos
api_prefix: /drivers

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - cascading_side_effects
    - derived_field_reconciliation
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
    - self_referential
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Driver
    parent: null
    common_fields: true
    fields:
      - name: cdl_number
        type: string
        source: input
        description: Commercial Driver License number, unique across drivers.
        constraints: "unique; uppercase alphanumeric; 6-20 chars"
      - name: full_name
        type: string
        source: input
        description: Driver legal name.
      - name: carrier_id
        type: string
        source: input
        description: FK to Carrier.id; the motor carrier the driver works for.
      - name: cycle_type
        type: enum
        source: input
        description: HOS cycle the driver is on.
        constraints: "values: SEVENTY_HOUR_EIGHT_DAY, SIXTY_HOUR_SEVEN_DAY"
        default: SEVENTY_HOUR_EIGHT_DAY
      - name: duty_status
        type: enum
        source: computed
        description: Current duty status; mirrors latest DutyEvent.new_status.
        constraints: "values: OFF_DUTY, SLEEPER_BERTH, DRIVING, ON_DUTY_NOT_DRIVING, PERSONAL_CONVEYANCE, YARD_MOVES"
        default: OFF_DUTY
      - name: bound_vehicle_id
        type: string
        source: computed
        description: FK to Vehicle.id while driver is bound to a vehicle; null when unbound. Set by POST /drivers/{id}/bind, cleared by POST /drivers/{id}/unbind.
        default: null
      - name: bound_eld_device_id
        type: string
        source: computed
        description: FK to ELDDevice.id while driver is bound; mirrors Vehicle.eld_device_id at bind time.
        default: null
      - name: home_terminal_timezone
        type: string
        source: input
        description: IANA timezone of the driver's home terminal; used to anchor 24-hour DailyLog boundaries.
        default: "America/New_York"
      - name: last_34_hour_restart_completed_at
        type: datetime
        source: computed
        description: UTC instant the driver most recently completed an unbroken 34-hour OFF_DUTY/SLEEPER_BERTH window; null if never. Updated as a side effect of duty status changes.
        default: null

  - name: Carrier
    parent: null
    common_fields: true
    fields:
      - name: dot_number
        type: string
        source: input
        description: USDOT number of the motor carrier.
        constraints: "unique; digits only; 5-8 chars"
      - name: legal_name
        type: string
        source: input
        description: Carrier legal name.
      - name: safety_contact_user_id
        type: string
        source: input
        description: Opaque user id of the CarrierSafetyOfficer responsible for FMCSA reporting.

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - name: vin
        type: string
        source: input
        description: Vehicle Identification Number.
        constraints: "unique; 17 chars; uppercase alphanumeric excluding I,O,Q"
      - name: carrier_id
        type: string
        source: input
        description: FK to Carrier.id; vehicle is owned by this carrier.
      - name: eld_device_id
        type: string
        source: input
        description: FK to ELDDevice.id; the device installed in this vehicle.
        constraints: "unique among vehicles; one ELD per vehicle"
      - name: current_driver_id
        type: string
        source: computed
        description: FK to Driver.id while a driver is bound to this vehicle; null otherwise. Mutually exclusive with other vehicles for the same driver.
        default: null
      - name: odometer_miles
        type: number
        source: computed
        description: Last odometer reading reported by the ELD device, in miles. Monotonically non-decreasing per vehicle.
        default: 0

  - name: ELDDevice
    parent: null
    common_fields: true
    fields:
      - name: serial_number
        type: string
        source: input
        description: Manufacturer serial number of the device.
        constraints: "unique; 6-32 chars"
      - name: firmware_version
        type: string
        source: input
        description: Semver firmware version, e.g. "3.4.1".
      - name: certified_for_fmcsa
        type: boolean
        source: input
        description: True if device is on the FMCSA registered ELD list.
        default: true

  - name: DutyEvent
    parent: Driver
    common_fields: false
    fields:
      - name: driver_id
        type: string
        source: input
        description: FK to Driver.id; the driver this event belongs to.
      - name: vehicle_id
        type: string
        source: input
        description: FK to Vehicle.id; null only when new_status is OFF_DUTY or SLEEPER_BERTH and no vehicle is currently bound.
        default: null
      - name: new_status
        type: enum
        source: input
        description: Duty status entered at event_time.
        constraints: "values: OFF_DUTY, SLEEPER_BERTH, DRIVING, ON_DUTY_NOT_DRIVING, PERSONAL_CONVEYANCE, YARD_MOVES"
      - name: event_time
        type: datetime
        source: input
        description: UTC instant the driver entered new_status. Must be >= the latest accepted DutyEvent.event_time for this driver (strict monotonic per driver).
      - name: latitude
        type: number
        source: input
        description: Decimal degrees, -90 to 90.
        constraints: "-90 <= value <= 90"
      - name: longitude
        type: number
        source: input
        description: Decimal degrees, -180 to 180.
        constraints: "-180 <= value <= 180"
      - name: odometer_miles
        type: number
        source: input
        description: Vehicle odometer reading at event_time, in miles. Must be >= the latest accepted DutyEvent.odometer_miles for the same vehicle.
        default: null
      - name: annotation
        type: string
        source: input
        description: Free-text remark required for PERSONAL_CONVEYANCE and YARD_MOVES events.
        default: null
      - name: edit_state
        type: enum
        source: computed
        description: Lifecycle of this event record. ACTIVE on insertion; flips to SUPERSEDED when a driver edit produces a replacement.
        constraints: "values: ACTIVE, SUPERSEDED"
        default: ACTIVE
      - name: superseded_by_event_id
        type: string
        source: computed
        description: FK to DutyEvent.id that replaced this record via driver edit; null while ACTIVE.
        default: null
      - name: daily_log_id
        type: string
        source: computed
        description: FK to DailyLog.id; the 24-hour log this event was assigned to at write time. Set by the create transition; never reassigned.
      - name: adverse_conditions_exemption_id
        type: string
        source: input
        description: FK to AdverseConditionsExemption.id; required when driver claims adverse-conditions extension on a DRIVING event past the unextended 11-hour or 14-hour limit.
        default: null

  - name: DailyLog
    parent: Driver
    common_fields: true
    fields:
      - name: driver_id
        type: string
        source: input
        description: FK to Driver.id; the driver this RODS belongs to.
      - name: log_date
        type: string
        source: input
        description: Calendar date in YYYY-MM-DD, in driver.home_terminal_timezone. Unique per (driver_id, log_date).
        constraints: "unique together with driver_id"
      - name: status
        type: enum
        source: computed
        description: Certification lifecycle.
        constraints: "values: UNCERTIFIED, CERTIFIED, RECERTIFIED"
        default: UNCERTIFIED
      - name: certified_at
        type: datetime
        source: computed
        description: UTC instant the driver most recently certified this log; null while UNCERTIFIED.
        default: null
      - name: certification_count
        type: integer
        source: computed
        description: Number of times this log has been certified. 0 while UNCERTIFIED; increments by 1 each certify transition.
        default: 0
      - name: total_driving_minutes
        type: integer
        source: computed
        description: Sum over DutyEvent intervals on this log_date where new_status == DRIVING and edit_state == ACTIVE, clipped to the log window.
        default: 0
      - name: total_on_duty_minutes
        type: integer
        source: computed
        description: Sum over DutyEvent intervals where new_status IN {DRIVING, ON_DUTY_NOT_DRIVING, YARD_MOVES} and edit_state == ACTIVE, clipped to the log window. Excludes PERSONAL_CONVEYANCE and SLEEPER_BERTH.
        default: 0
      - name: integrity_hash
        type: string
        source: computed
        description: SHA-256 hex of canonical-JSON of ACTIVE DutyEvents for this log; recomputed on every edit, certify, and recertify.
        default: null

  - name: Violation
    parent: Driver
    common_fields: true
    fields:
      - name: driver_id
        type: string
        source: input
        description: FK to Driver.id.
      - name: triggering_duty_event_id
        type: string
        source: computed
        description: FK to DutyEvent.id whose acceptance produced this violation.
      - name: rule_code
        type: enum
        source: computed
        description: FMCSA rule that was breached.
        constraints: "values: ELEVEN_HOUR_DRIVING, FOURTEEN_HOUR_WINDOW, SEVENTY_HOUR_CYCLE, SIXTY_HOUR_CYCLE"
      - name: detected_at
        type: datetime
        source: system
        description: UTC instant the violation was detected (server clock at the triggering POST).
      - name: status
        type: enum
        source: computed
        description: Violation lifecycle.
        constraints: "values: OPEN, ACKNOWLEDGED, REPORTED, RESOLVED"
        default: OPEN
      - name: reported_to_fmcsa_at
        type: datetime
        source: computed
        description: UTC instant the violation was reported to FMCSA; null until reported.
        default: null
      - name: fmcsa_report_id
        type: string
        source: computed
        description: External tracking id returned by the FMCSA submission endpoint stub.
        default: null
      - name: overage_minutes
        type: integer
        source: computed
        description: Minutes by which the limit was exceeded at detection.

  - name: AdverseConditionsExemption
    parent: Driver
    common_fields: true
    fields:
      - name: driver_id
        type: string
        source: input
        description: FK to Driver.id.
      - name: declared_at
        type: datetime
        source: input
        description: UTC instant the driver declared adverse conditions; must be within the driver's current 14-hour window.
      - name: reason
        type: string
        source: input
        description: Free-text justification (weather, traffic, road closure, etc.); minimum 10 chars.
        constraints: "length >= 10"
      - name: status
        type: enum
        source: computed
        description: Exemption lifecycle.
        constraints: "values: ACTIVE, CONSUMED, EXPIRED"
        default: ACTIVE
      - name: extra_minutes_granted
        type: integer
        source: system
        description: Fixed at 120 (two hours) on creation.
        default: 120
      - name: applies_to_log_date
        type: string
        source: computed
        description: The log_date (in driver's home_terminal_timezone) of the 14-hour window the exemption attaches to; computed from declared_at.

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Driver.duty_status
    initial_state: OFF_DUTY
    terminal_states: []
    transitions:
      - from: OFF_DUTY
        to: DRIVING
        trigger: "POST /drivers/{id}/duty-events with new_status=DRIVING"
        actor: Driver
        preconditions:
          - "Driver.bound_vehicle_id IS NOT NULL"
          - "available_driving_hours.minutes_remaining > 0"
          - "available_on_duty_window.minutes_remaining > 0"
          - "cycle_hours_remaining.minutes_remaining > 0"
        side_effects:
          - "Append DutyEvent(new_status=DRIVING)"
          - "Driver.duty_status := DRIVING"
          - "Recompute DailyLog.total_driving_minutes and total_on_duty_minutes for log_date"
          - "Recompute DailyLog.integrity_hash"
      - from: OFF_DUTY
        to: SLEEPER_BERTH
        trigger: "POST /drivers/{id}/duty-events with new_status=SLEEPER_BERTH"
        actor: Driver
        preconditions: []
        side_effects:
          - "Append DutyEvent(new_status=SLEEPER_BERTH)"
          - "Driver.duty_status := SLEEPER_BERTH"
          - "If continuous OFF_DUTY+SLEEPER_BERTH window now totals >= 34h, set Driver.last_34_hour_restart_completed_at := event_time (cascade depth 1 of 3 for the cycle-reset chain)"
      - from: OFF_DUTY
        to: ON_DUTY_NOT_DRIVING
        trigger: "POST /drivers/{id}/duty-events with new_status=ON_DUTY_NOT_DRIVING"
        actor: Driver
        preconditions:
          - "Driver.bound_vehicle_id IS NOT NULL OR annotation explains pre-trip"
          - "cycle_hours_remaining.minutes_remaining > 0"
        side_effects:
          - "Append DutyEvent"
          - "Driver.duty_status := ON_DUTY_NOT_DRIVING"
          - "Recompute DailyLog.total_on_duty_minutes for log_date"
      - from: OFF_DUTY
        to: PERSONAL_CONVEYANCE
        trigger: "POST /drivers/{id}/duty-events with new_status=PERSONAL_CONVEYANCE"
        actor: Driver
        preconditions:
          - "Driver.bound_vehicle_id IS NOT NULL"
          - "annotation IS NOT NULL AND length(annotation) >= 10"
        side_effects:
          - "Append DutyEvent"
          - "Driver.duty_status := PERSONAL_CONVEYANCE"
          - "Time accrues to neither driving nor on-duty totals (per 49 CFR 395.8)"
      - from: DRIVING
        to: ON_DUTY_NOT_DRIVING
        trigger: "POST /drivers/{id}/duty-events with new_status=ON_DUTY_NOT_DRIVING"
        actor: Driver
        preconditions: []
        side_effects:
          - "Append DutyEvent"
          - "Driver.duty_status := ON_DUTY_NOT_DRIVING"
          - "Recompute DailyLog.total_driving_minutes (closes the DRIVING interval)"
      - from: DRIVING
        to: OFF_DUTY
        trigger: "POST /drivers/{id}/duty-events with new_status=OFF_DUTY"
        actor: Driver
        preconditions: []
        side_effects:
          - "Append DutyEvent"
          - "Driver.duty_status := OFF_DUTY"
          - "Close DRIVING interval on DailyLog; recompute total_driving_minutes and integrity_hash"
          - "Cascade depth 2: if available_driving_hours.minutes_remaining_at_event_time < 0 OR available_on_duty_window.minutes_remaining_at_event_time < 0 OR cycle_hours_remaining.minutes_remaining_at_event_time < 0, create Violation(status=OPEN); this in turn triggers a notification record on the Carrier (cascade depth 3)"
      - from: DRIVING
        to: SLEEPER_BERTH
        trigger: "POST /drivers/{id}/duty-events with new_status=SLEEPER_BERTH"
        actor: Driver
        preconditions: []
        side_effects:
          - "Append DutyEvent"
          - "Driver.duty_status := SLEEPER_BERTH"
          - "Close DRIVING interval on DailyLog"
      - from: SLEEPER_BERTH
        to: DRIVING
        trigger: "POST /drivers/{id}/duty-events with new_status=DRIVING"
        actor: Driver
        preconditions:
          - "Driver.bound_vehicle_id IS NOT NULL"
          - "sleeper_berth_qualifying_pair_minutes_remaining > 0 OR continuous_off_duty_minutes >= 600"
          - "available_driving_hours.minutes_remaining > 0"
        side_effects:
          - "Append DutyEvent(new_status=DRIVING)"
          - "Driver.duty_status := DRIVING"
          - "Recompute DailyLog.total_driving_minutes"
      - from: SLEEPER_BERTH
        to: OFF_DUTY
        trigger: "POST /drivers/{id}/duty-events with new_status=OFF_DUTY"
        actor: Driver
        preconditions: []
        side_effects:
          - "Append DutyEvent"
          - "Driver.duty_status := OFF_DUTY"
          - "Continuous OFF_DUTY+SLEEPER_BERTH window continues accruing toward 10h reset or 34h restart"
      - from: ON_DUTY_NOT_DRIVING
        to: DRIVING
        trigger: "POST /drivers/{id}/duty-events with new_status=DRIVING"
        actor: Driver
        preconditions:
          - "Driver.bound_vehicle_id IS NOT NULL"
          - "available_driving_hours.minutes_remaining > 0"
          - "available_on_duty_window.minutes_remaining > 0"
        side_effects:
          - "Append DutyEvent"
          - "Driver.duty_status := DRIVING"
      - from: ON_DUTY_NOT_DRIVING
        to: OFF_DUTY
        trigger: "POST /drivers/{id}/duty-events with new_status=OFF_DUTY"
        actor: Driver
        preconditions: []
        side_effects:
          - "Append DutyEvent"
          - "Driver.duty_status := OFF_DUTY"
      - from: PERSONAL_CONVEYANCE
        to: OFF_DUTY
        trigger: "POST /drivers/{id}/duty-events with new_status=OFF_DUTY"
        actor: Driver
        preconditions: []
        side_effects:
          - "Append DutyEvent"
          - "Driver.duty_status := OFF_DUTY"
      - from: PERSONAL_CONVEYANCE
        to: DRIVING
        trigger: "POST /drivers/{id}/duty-events with new_status=DRIVING"
        actor: Driver
        preconditions:
          - "Driver.bound_vehicle_id IS NOT NULL"
          - "available_driving_hours.minutes_remaining > 0"
        side_effects:
          - "Append DutyEvent(new_status=DRIVING)"
          - "Driver.duty_status := DRIVING"
      - from: YARD_MOVES
        to: ON_DUTY_NOT_DRIVING
        trigger: "POST /drivers/{id}/duty-events with new_status=ON_DUTY_NOT_DRIVING"
        actor: Driver
        preconditions: []
        side_effects:
          - "Append DutyEvent"
          - "Driver.duty_status := ON_DUTY_NOT_DRIVING"
      - from: ON_DUTY_NOT_DRIVING
        to: YARD_MOVES
        trigger: "POST /drivers/{id}/duty-events with new_status=YARD_MOVES"
        actor: Driver
        preconditions:
          - "Driver.bound_vehicle_id IS NOT NULL"
          - "annotation IS NOT NULL AND length(annotation) >= 10"
        side_effects:
          - "Append DutyEvent"
          - "Driver.duty_status := YARD_MOVES"
          - "Time accrues to on-duty totals but NOT to driving totals"

  - entity: Driver.binding_state
    initial_state: UNBOUND
    terminal_states: []
    transitions:
      - from: UNBOUND
        to: BOUND
        trigger: "POST /drivers/{id}/bind with vehicle_id"
        actor: Driver
        preconditions:
          - "Driver.duty_status == OFF_DUTY"
          - "Vehicle.current_driver_id IS NULL"
          - "Vehicle.carrier_id == Driver.carrier_id"
          - "ELDDevice.certified_for_fmcsa == true"
        side_effects:
          - "Driver.bound_vehicle_id := vehicle_id"
          - "Driver.bound_eld_device_id := Vehicle.eld_device_id"
          - "Vehicle.current_driver_id := driver_id"
      - from: BOUND
        to: UNBOUND
        trigger: "POST /drivers/{id}/unbind"
        actor: Driver
        preconditions:
          - "Driver.duty_status IN {OFF_DUTY, SLEEPER_BERTH}"
        side_effects:
          - "Driver.bound_vehicle_id := null"
          - "Driver.bound_eld_device_id := null"
          - "Vehicle.current_driver_id := null"

  - entity: DailyLog
    initial_state: UNCERTIFIED
    terminal_states: []
    transitions:
      - from: UNCERTIFIED
        to: CERTIFIED
        trigger: "POST /drivers/{id}/daily-logs/{logId}/certify"
        actor: Driver
        preconditions:
          - "All ACTIVE DutyEvents on log_date have been appended (driver attestation)"
          - "DailyLog.log_date < today in Driver.home_terminal_timezone"
        side_effects:
          - "DailyLog.status := CERTIFIED"
          - "DailyLog.certified_at := server_now()"
          - "DailyLog.certification_count := 1"
          - "DailyLog.integrity_hash := SHA256(canonical(ACTIVE DutyEvents))"
      - from: CERTIFIED
        to: RECERTIFIED
        trigger: "POST /drivers/{id}/duty-events/{eventId}/edit (driver edits an event whose daily_log was already CERTIFIED)"
        actor: Driver
        preconditions:
          - "DutyEvent.edit_state == ACTIVE"
          - "Server clock < event_time + 8 days (FMCSA edit window)"
        side_effects:
          - "Old DutyEvent.edit_state := SUPERSEDED, .superseded_by_event_id := new_event.id"
          - "DailyLog.status := RECERTIFIED"
          - "DailyLog.certification_count += 1"
          - "DailyLog.integrity_hash := SHA256(canonical(ACTIVE DutyEvents))"
          - "Re-evaluate Violations for the affected window: open ones may RESOLVE; new ones may OPEN"
      - from: RECERTIFIED
        to: RECERTIFIED
        trigger: "POST /drivers/{id}/duty-events/{eventId}/edit (subsequent edit)"
        actor: Driver
        preconditions:
          - "Server clock < event_time + 8 days"
        side_effects:
          - "DailyLog.certification_count += 1"
          - "DailyLog.integrity_hash recomputed"

  - entity: Violation
    initial_state: OPEN
    terminal_states: [REPORTED, RESOLVED]
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /violations/{id}/acknowledge"
        actor: Driver
        preconditions:
          - "Violation.status == OPEN"
        side_effects:
          - "Violation.status := ACKNOWLEDGED"
      - from: OPEN
        to: RESOLVED
        trigger: "Side-effect of DailyLog RECERTIFIED transition (driver edited the triggering event such that the violation no longer holds)"
        actor: system
        preconditions:
          - "Recomputed minutes_remaining_at_triggering_event_time >= 0 after edit"
        side_effects:
          - "Violation.status := RESOLVED"
      - from: ACKNOWLEDGED
        to: REPORTED
        trigger: "POST /violations/{id}/report-to-fmcsa"
        actor: CarrierSafetyOfficer
        preconditions:
          - "Violation.status == ACKNOWLEDGED"
          - "Driver.carrier_id == acting CarrierSafetyOfficer.carrier_id"
        side_effects:
          - "Violation.status := REPORTED"
          - "Violation.reported_to_fmcsa_at := server_now()"
          - "Violation.fmcsa_report_id := generate()"
      - from: ACKNOWLEDGED
        to: RESOLVED
        trigger: "Side-effect of DailyLog RECERTIFIED transition (edit eliminates overage)"
        actor: system
        preconditions:
          - "Recomputed minutes_remaining_at_triggering_event_time >= 0 after edit"
        side_effects:
          - "Violation.status := RESOLVED"

  - entity: AdverseConditionsExemption
    initial_state: ACTIVE
    terminal_states: [CONSUMED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: CONSUMED
        trigger: "First DutyEvent with adverse_conditions_exemption_id == this.id and new_status == DRIVING such that the event_time is past the unextended 11- or 14-hour limit"
        actor: system
        preconditions:
          - "AdverseConditionsExemption.status == ACTIVE"
          - "AdverseConditionsExemption.declared_at within driver's current 14-hour window"
        side_effects:
          - "AdverseConditionsExemption.status := CONSUMED"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /_clock/advance crossing midnight (driver home terminal tz) of applies_to_log_date OR driver enters OFF_DUTY/SLEEPER_BERTH continuously for >= 10h"
        actor: system
        preconditions:
          - "AdverseConditionsExemption.status == ACTIVE"
        side_effects:
          - "AdverseConditionsExemption.status := EXPIRED"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two clients POST /drivers/{id}/duty-events simultaneously for the same driver, both with event_time later than the latest stored event_time."
    guarantee: "Exactly one event is appended; the loser is rejected because the event_time is no longer strictly greater than the newly latest stored event_time."
    error_id: ERR_DUTY_EVENT_OUT_OF_ORDER
    http_status: 409
    serialization: "First-writer-wins on (driver_id, event_time); the writer that commits second sees a stored event_time >= its event_time and is rejected."

  - scenario: "Two carriers POST /drivers/{id}/bind for the same Driver with two different Vehicles, both observe duty_status=OFF_DUTY and Vehicle.current_driver_id=null."
    guarantee: "At most one bind succeeds; the second loses because Driver.bound_vehicle_id is no longer null."
    error_id: ERR_DRIVER_ALREADY_BOUND
    http_status: 409
    serialization: "First-writer-wins on Driver.bound_vehicle_id."

  - scenario: "Two drivers POST /drivers/{id}/bind for the same Vehicle simultaneously."
    guarantee: "At most one bind succeeds; the second loses because Vehicle.current_driver_id is no longer null."
    error_id: ERR_VEHICLE_ALREADY_BOUND
    http_status: 409
    serialization: "First-writer-wins on Vehicle.current_driver_id."

  - scenario: "Driver POSTs /drivers/{id}/daily-logs/{logId}/certify while a concurrent POST /drivers/{id}/duty-events appends a new event on log_date."
    guarantee: "Exactly one succeeds. If certify commits first, the event append is rejected with ERR_LOG_ALREADY_CERTIFIED (the event would be against a CERTIFIED log; driver must use the edit endpoint). If event append commits first, certify is rejected because integrity_hash changed."
    error_id: ERR_LOG_ALREADY_CERTIFIED
    http_status: 409
    serialization: "First-writer-wins on DailyLog.integrity_hash + status."

  - scenario: "Two CarrierSafetyOfficers POST /violations/{id}/report-to-fmcsa simultaneously."
    guarantee: "Exactly one report is generated; the second loses because Violation.status has already advanced to REPORTED."
    error_id: ERR_INVALID_VIOLATION_STATE
    http_status: 409
    serialization: "First-writer-wins on Violation.status."

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: available_driving_hours
    trigger: "Evaluated on every POST /drivers/{id}/duty-events with new_status=DRIVING (precondition) and on GET /drivers/{id}/hos-snapshot."
    algorithm: threshold
    formula: |
      # Closes the most recent open DRIVING interval at event_time (or now).
      # 11-hour driving limit, optionally extended by adverse conditions.
      most_recent_qualifying_break_end = latest instant T such that
          continuous_off_duty_or_sleeper_minutes_ending_at(T) >= 600
          (i.e., 10 consecutive hours OFF_DUTY+SLEEPER_BERTH; PERSONAL_CONVEYANCE
          does NOT count toward this break; YARD_MOVES does NOT count)
      driving_minutes_since_break = sum over ACTIVE DutyEvent intervals on driver
          where new_status == DRIVING
          AND interval intersects [most_recent_qualifying_break_end, event_time)
          (PERSONAL_CONVEYANCE and YARD_MOVES intervals contribute 0 minutes)
      base_limit_minutes = 660
      extra = (variant == ADVERSE_EXTENDED) ? 120 : 0
      minutes_remaining = (base_limit_minutes + extra) - driving_minutes_since_break
    input_set: "All DutyEvent rows with driver_id == Driver.id and edit_state == ACTIVE."
    constants:
      BASE_LIMIT_MINUTES: 660
      ADVERSE_EXTRA_MINUTES: 120
      QUALIFYING_BREAK_MINUTES: 600
    precision: "Integer minutes; truncate toward zero."
    variants:
      - name: UNEXTENDED
        when: "No ACTIVE AdverseConditionsExemption attaches to the current 14-hour window."
        difference: "extra = 0; base_limit_minutes = 660."
      - name: ADVERSE_EXTENDED
        when: "An AdverseConditionsExemption.status == ACTIVE exists with applies_to_log_date == current_log_date AND declared_at within current 14-hour window."
        difference: "extra = 120; base_limit_minutes still 660 — the cap is 660+120=780 minutes from the break."

  - name: available_on_duty_window
    trigger: "Evaluated on every POST /drivers/{id}/duty-events with new_status IN {DRIVING, ON_DUTY_NOT_DRIVING, YARD_MOVES} and on GET /drivers/{id}/hos-snapshot."
    algorithm: threshold
    formula: |
      # 14-hour window from first on-duty after a qualifying break.
      window_start = first ACTIVE DutyEvent.event_time after most_recent_qualifying_break_end
          where new_status IN {DRIVING, ON_DUTY_NOT_DRIVING, YARD_MOVES}
      wall_clock_elapsed_minutes = (event_time - window_start).total_minutes
      base_window_minutes = 840
      extra = (variant == ADVERSE_EXTENDED) ? 120 : 0
      minutes_remaining = (base_window_minutes + extra) - wall_clock_elapsed_minutes
      # NOTE: this is wall-clock elapsed, not on-duty accumulated; OFF_DUTY,
      # SLEEPER_BERTH, and PERSONAL_CONVEYANCE intervals still consume the window.
    input_set: "All DutyEvent rows with driver_id == Driver.id and edit_state == ACTIVE."
    constants:
      BASE_WINDOW_MINUTES: 840
      ADVERSE_EXTRA_MINUTES: 120
      QUALIFYING_BREAK_MINUTES: 600
    precision: "Integer minutes; truncate toward zero."
    variants:
      - name: UNEXTENDED
        when: "No ACTIVE AdverseConditionsExemption attaches to the current window."
        difference: "extra = 0; cap = 840 minutes wall-clock."
      - name: ADVERSE_EXTENDED
        when: "AdverseConditionsExemption.status == ACTIVE attaches to this window."
        difference: "extra = 120; cap = 960 minutes wall-clock."

  - name: cycle_hours_remaining
    trigger: "Evaluated on every POST /drivers/{id}/duty-events with new_status IN {DRIVING, ON_DUTY_NOT_DRIVING, YARD_MOVES} and on GET /drivers/{id}/hos-snapshot."
    algorithm: aggregation
    formula: |
      # Rolling 7-day (60h cycle) or 8-day (70h cycle) on-duty total,
      # optionally reset by a 34-hour restart.
      if Driver.last_34_hour_restart_completed_at IS NOT NULL
         AND Driver.last_34_hour_restart_completed_at > window_lower_bound:
          effective_window_start = Driver.last_34_hour_restart_completed_at
      else:
          if Driver.cycle_type == SEVENTY_HOUR_EIGHT_DAY:
              effective_window_start = event_time - timedelta(days=8)
              cycle_cap_minutes = 4200
          else:  # SIXTY_HOUR_SEVEN_DAY
              effective_window_start = event_time - timedelta(days=7)
              cycle_cap_minutes = 3600
      on_duty_minutes_in_window = sum over ACTIVE DutyEvent intervals
          where new_status IN {DRIVING, ON_DUTY_NOT_DRIVING, YARD_MOVES}
          AND interval intersects [effective_window_start, event_time)
          (PERSONAL_CONVEYANCE and SLEEPER_BERTH and OFF_DUTY contribute 0)
      minutes_remaining = cycle_cap_minutes - on_duty_minutes_in_window
    input_set: "All ACTIVE DutyEvent rows for this driver across the rolling window."
    constants:
      SEVENTY_HOUR_CAP_MINUTES: 4200
      SIXTY_HOUR_CAP_MINUTES: 3600
      RESTART_MIN_MINUTES: 2040
    precision: "Integer minutes; truncate toward zero."
    variants:
      - name: ROLLING_WINDOW
        when: "Driver.last_34_hour_restart_completed_at IS NULL OR older than rolling window start."
        difference: "Window start = event_time - 7 or 8 days; pure rolling sum."
      - name: POST_RESTART
        when: "Driver completed an unbroken 34-hour OFF_DUTY+SLEEPER_BERTH window since the rolling window start."
        difference: "Window start = Driver.last_34_hour_restart_completed_at; on-duty minutes before that instant are excluded."

  - name: sleeper_berth_pair_qualifies
    trigger: "Evaluated as a precondition on POST /drivers/{id}/duty-events with from=SLEEPER_BERTH to=DRIVING when the most_recent_qualifying_break_end check fails."
    algorithm: interval_merge
    formula: |
      # The sleeper-berth split lets a driver pair two off-duty periods that
      # together meet the 10h reset, provided one of them is >= 7h SLEEPER_BERTH
      # and the other is >= 2h OFF_DUTY or SLEEPER_BERTH.
      # Both periods must be unbroken and consist solely of SLEEPER_BERTH for the
      # >= 7h leg; the other leg may be SLEEPER_BERTH or OFF_DUTY.
      # The two periods together must sum to >= 10h.
      # Evaluation order (pinned):
      #   1. Find the most recent unbroken SLEEPER_BERTH run ending at event_time
      #      whose length >= 7h. Call its start S1, end E1, length L1.
      #   2. Find the most recent OFF_DUTY-or-SLEEPER_BERTH run ending at or
      #      before S1, length >= 2h. Call its start S2, end E2, length L2.
      #      Required: E2 <= S1 (the pair must be ordered, not overlapping).
      #   3. Required: L1 + L2 >= 600 minutes.
      #   4. The pair "resets" the driving and on-duty windows AT E1.
      # If step 1 or 2 produces no candidate, the pair does not qualify.
      qualifies = (L1 >= 420 AND L2 >= 120 AND L1 + L2 >= 600 AND E2 <= S1)
    input_set: "All ACTIVE DutyEvent rows for this driver in the last 36 hours."
    constants:
      LONG_LEG_MIN_MINUTES: 420
      SHORT_LEG_MIN_MINUTES: 120
      COMBINED_MIN_MINUTES: 600
    precision: "Integer minutes."
    variants:
      - name: SEVEN_THREE_SPLIT
        when: "L1 in [420, 480), L2 >= 180."
        difference: "Pair is 7h SLEEPER_BERTH + 3h OFF_DUTY/SLEEPER_BERTH."
      - name: EIGHT_TWO_SPLIT
        when: "L1 >= 480, L2 in [120, 180)."
        difference: "Pair is 8h SLEEPER_BERTH + 2h OFF_DUTY/SLEEPER_BERTH."

  - name: daily_log_integrity_hash
    trigger: "Side-effect of every transition that mutates DailyLog (event append on log_date, event edit, certify, recertify)."
    algorithm: projection
    formula: |
      # Tamper-evident hash over the canonical projection of ACTIVE events.
      events = [e for e in DutyEvent
                if e.driver_id == DailyLog.driver_id
                AND e.daily_log_id == DailyLog.id
                AND e.edit_state == ACTIVE]
      sorted_events = sorted(events, key=lambda e: (e.event_time, e.id))
      canonical = json.dumps(
          [{"event_time": e.event_time.isoformat(timespec="milliseconds")+"Z",
            "new_status": e.new_status,
            "vehicle_id": e.vehicle_id,
            "odometer_miles": float(e.odometer_miles or 0),
            "latitude": round(e.latitude, 6),
            "longitude": round(e.longitude, 6),
            "annotation": e.annotation or ""}
           for e in sorted_events],
          separators=(",", ":"),
          ensure_ascii=False,
      )
      hash = sha256(canonical.encode("utf-8")).hexdigest()
    input_set: "Only ACTIVE DutyEvents on this DailyLog. SUPERSEDED and REJECTED are excluded."
    constants: {}
    precision: "Lowercase hex; 64 chars."
    variants:
      - name: SINGLE
        when: "Default."
        difference: "No variants — single deterministic hash."

# =============================================================================
# §1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_MISSING_AUTH
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is permitted for this endpoint per RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Driver/Vehicle/ELDDevice/DutyEvent/DailyLog/Violation/AdverseConditionsExemption referenced in path or body exists; validated left-to-right in path."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: state
    check: "Driver.bound_vehicle_id IS NOT NULL when posting any DutyEvent whose new_status IN {DRIVING, ON_DUTY_NOT_DRIVING, YARD_MOVES, PERSONAL_CONVEYANCE}."
    error_id: ERR_DRIVER_NOT_BOUND
    http_status: 409
    applies_to: "POST /drivers/{id}/duty-events"

  - priority: 5
    category: state
    check: "DailyLog.status == UNCERTIFIED OR transitioning via the edit endpoint; cannot append a new DutyEvent on a CERTIFIED or RECERTIFIED log_date directly."
    error_id: ERR_LOG_ALREADY_CERTIFIED
    http_status: 409
    applies_to: "POST /drivers/{id}/duty-events"

  - priority: 6
    category: state
    check: "Violation.status == OPEN for acknowledge; == ACKNOWLEDGED for report-to-fmcsa."
    error_id: ERR_INVALID_VIOLATION_STATE
    http_status: 409
    applies_to: "POST /violations/{id}/acknowledge, POST /violations/{id}/report-to-fmcsa"

  - priority: 7
    category: business_safety
    check: "DutyEvent.event_time is strictly greater than the latest accepted DutyEvent.event_time for this driver (strict monotonic per driver)."
    error_id: ERR_DUTY_EVENT_OUT_OF_ORDER
    http_status: 409
    applies_to: "POST /drivers/{id}/duty-events"

  - priority: 8
    category: business_safety
    check: "PERSONAL_CONVEYANCE and YARD_MOVES events carry an annotation of length >= 10."
    error_id: ERR_ANNOTATION_REQUIRED
    http_status: 422
    applies_to: "POST /drivers/{id}/duty-events"

  - priority: 9
    category: business_safety
    check: "For from=SLEEPER_BERTH to=DRIVING: either continuous_off_duty_or_sleeper_minutes >= 600 OR sleeper_berth_pair_qualifies == true."
    error_id: ERR_INSUFFICIENT_REST
    http_status: 409
    applies_to: "POST /drivers/{id}/duty-events"

  - priority: 10
    category: business_safety
    check: "available_driving_hours.minutes_remaining > 0 at event_time when new_status == DRIVING (using ADVERSE_EXTENDED variant if adverse_conditions_exemption_id is supplied and ACTIVE)."
    error_id: ERR_ELEVEN_HOUR_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /drivers/{id}/duty-events"

  - priority: 11
    category: business_safety
    check: "available_on_duty_window.minutes_remaining > 0 at event_time when new_status IN {DRIVING, ON_DUTY_NOT_DRIVING, YARD_MOVES}."
    error_id: ERR_FOURTEEN_HOUR_WINDOW_EXCEEDED
    http_status: 409
    applies_to: "POST /drivers/{id}/duty-events"

  - priority: 12
    category: business_safety
    check: "cycle_hours_remaining.minutes_remaining > 0 at event_time when new_status IN {DRIVING, ON_DUTY_NOT_DRIVING, YARD_MOVES}."
    error_id: ERR_CYCLE_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /drivers/{id}/duty-events"

  - priority: 13
    category: business_referential
    check: "DutyEvent.vehicle_id IS NOT NULL when new_status IN {DRIVING, ON_DUTY_NOT_DRIVING, YARD_MOVES, PERSONAL_CONVEYANCE}; AND vehicle_id == Driver.bound_vehicle_id."
    error_id: ERR_VEHICLE_MISMATCH
    http_status: 422
    applies_to: "POST /drivers/{id}/duty-events"

  - priority: 14
    category: business_referential
    check: "ELDDevice.certified_for_fmcsa == true when binding Driver to Vehicle."
    error_id: ERR_ELD_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /drivers/{id}/bind"

  - priority: 15
    category: business_referential
    check: "Vehicle.carrier_id == Driver.carrier_id when binding."
    error_id: ERR_CROSS_CARRIER_BIND
    http_status: 422
    applies_to: "POST /drivers/{id}/bind"

  - priority: 16
    category: business_constraint
    check: "Driver.duty_status == OFF_DUTY when binding; == OFF_DUTY or SLEEPER_BERTH when unbinding."
    error_id: ERR_INVALID_DUTY_STATUS_FOR_BIND
    http_status: 409
    applies_to: "POST /drivers/{id}/bind, POST /drivers/{id}/unbind"

  - priority: 17
    category: business_constraint
    check: "Vehicle.current_driver_id IS NULL when binding."
    error_id: ERR_VEHICLE_ALREADY_BOUND
    http_status: 409
    applies_to: "POST /drivers/{id}/bind"

  - priority: 18
    category: business_constraint
    check: "Driver.bound_vehicle_id IS NULL when binding (driver not already bound elsewhere)."
    error_id: ERR_DRIVER_ALREADY_BOUND
    http_status: 409
    applies_to: "POST /drivers/{id}/bind"

  - priority: 19
    category: business_temporal
    check: "DailyLog.log_date is strictly less than today in Driver.home_terminal_timezone when certifying."
    error_id: ERR_LOG_NOT_YET_CERTIFIABLE
    http_status: 422
    applies_to: "POST /drivers/{id}/daily-logs/{logId}/certify"

  - priority: 20
    category: business_temporal
    check: "Edit request to a DutyEvent: server_now < event_time + 8 days (FMCSA edit window)."
    error_id: ERR_EDIT_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /drivers/{id}/duty-events/{eventId}/edit"

  - priority: 21
    category: business_referential
    check: "adverse_conditions_exemption_id (if supplied) references an AdverseConditionsExemption with status == ACTIVE and driver_id == Driver.id and applies_to_log_date == current log_date."
    error_id: ERR_EXEMPTION_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /drivers/{id}/duty-events"

  - priority: 22
    category: business_constraint
    check: "DutyEvent.odometer_miles >= latest accepted odometer_miles for the same vehicle (monotonic non-decreasing per vehicle)."
    error_id: ERR_ODOMETER_DECREASED
    http_status: 422
    applies_to: "POST /drivers/{id}/duty-events"

  - priority: 23
    category: business_constraint
    check: "Pagination params (limit in [1,100], offset >= 0) and request bodies pass schema validation (types, enums, lat/lon ranges)."
    error_id: ERR_INVALID_INPUT
    http_status: 400
    applies_to: "all"

  - priority: 24
    category: business_constraint
    check: "Optimistic concurrency: when client provides `version` on a mutating request to a versioned resource, it must equal the stored version."
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "PATCH/PUT on versioned resources"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Carrier / Vehicle / ELDDevice setup ----
  - method: POST
    path: "/carriers"
    description: "Register a motor carrier."
    roles: [PlatformAdmin]
    code: 201
    input: [dot_number, legal_name, safety_contact_user_id]
    output: Carrier
    side_effects: []

  - method: GET
    path: "/carriers/{carrier_id}"
    description: "Fetch carrier."
    roles: [PlatformAdmin, CarrierSafetyOfficer, FMCSAAuditor]
    code: 200
    input: []
    output: Carrier
    side_effects: []

  - method: POST
    path: "/eld-devices"
    description: "Register an ELD device."
    roles: [PlatformAdmin]
    code: 201
    input: [serial_number, firmware_version, "certified_for_fmcsa?"]
    output: ELDDevice
    side_effects: []

  - method: GET
    path: "/eld-devices/{device_id}"
    description: "Fetch device."
    roles: [PlatformAdmin, CarrierSafetyOfficer, FMCSAAuditor]
    code: 200
    input: []
    output: ELDDevice
    side_effects: []

  - method: POST
    path: "/vehicles"
    description: "Register a vehicle and pair it with an ELD device."
    roles: [CarrierSafetyOfficer]
    code: 201
    input: [vin, carrier_id, eld_device_id]
    output: Vehicle
    side_effects: []

  - method: GET
    path: "/vehicles/{vehicle_id}"
    description: "Fetch vehicle."
    roles: [CarrierSafetyOfficer, Driver, FMCSAAuditor]
    code: 200
    input: []
    output: Vehicle
    side_effects: []

  # ---- Driver identity ----
  - method: POST
    path: "/drivers"
    description: "Register a driver."
    roles: [CarrierSafetyOfficer]
    code: 201
    input: [cdl_number, full_name, carrier_id, "cycle_type?", "home_terminal_timezone?"]
    output: Driver
    side_effects: []

  - method: GET
    path: "/drivers/{driver_id}"
    description: "Fetch driver."
    roles: [Driver, CarrierSafetyOfficer, FMCSAAuditor]
    code: 200
    input: []
    output: Driver
    side_effects: []

  - method: POST
    path: "/drivers/{driver_id}/bind"
    description: "Bind driver to a vehicle (driver identity binding to ELD)."
    roles: [Driver]
    code: 200
    input: [vehicle_id]
    output: Driver
    side_effects:
      - "Driver.bound_vehicle_id, Driver.bound_eld_device_id, Vehicle.current_driver_id mutated atomically"

  - method: POST
    path: "/drivers/{driver_id}/unbind"
    description: "Unbind driver from current vehicle."
    roles: [Driver]
    code: 200
    input: []
    output: Driver
    side_effects:
      - "Driver.bound_vehicle_id, Driver.bound_eld_device_id, Vehicle.current_driver_id cleared atomically"

  # ---- Duty events (the heart of the system) ----
  - method: POST
    path: "/drivers/{driver_id}/duty-events"
    description: "Append a duty-status change event for the driver. Triggers HOS calculations and may create a Violation."
    roles: [Driver]
    code: 201
    input:
      - new_status
      - event_time
      - latitude
      - longitude
      - vehicle_id?
      - odometer_miles?
      - annotation?
      - adverse_conditions_exemption_id?
    output: DutyEvent
    side_effects:
      - "Driver.duty_status updated"
      - "DailyLog.total_driving_minutes, total_on_duty_minutes recomputed"
      - "DailyLog.integrity_hash recomputed"
      - "AdverseConditionsExemption.status may transition ACTIVE→CONSUMED"
      - "Violation may be created if a limit was exceeded at event_time"
      - "Driver.last_34_hour_restart_completed_at may be set when a 34h OFF_DUTY+SLEEPER_BERTH run completes"

  - method: GET
    path: "/drivers/{driver_id}/duty-events"
    description: "List a driver's duty events. Supports filter by edit_state, from/to event_time, daily_log_id; pagination."
    roles: [Driver, CarrierSafetyOfficer, FMCSAAuditor]
    code: 200
    input: ["edit_state?", "from?", "to?", "daily_log_id?", "limit?", "offset?"]
    output: "DutyEvent[]"
    side_effects: []

  - method: POST
    path: "/drivers/{driver_id}/duty-events/{event_id}/edit"
    description: "Driver edits an earlier event by supplying a corrected version. Old event becomes SUPERSEDED; new event is ACTIVE."
    roles: [Driver]
    code: 201
    input: ["new_status?", "event_time?", "latitude?", "longitude?", "odometer_miles?", "annotation?"]
    output: DutyEvent
    side_effects:
      - "Old DutyEvent.edit_state := SUPERSEDED"
      - "DailyLog.status moves UNCERTIFIED|CERTIFIED→RECERTIFIED; certification_count += 1"
      - "DailyLog.integrity_hash recomputed"
      - "Open Violations may RESOLVE; new Violations may OPEN"

  - method: GET
    path: "/drivers/{driver_id}/hos-snapshot"
    description: "Return the driver's current HOS view: driving/window/cycle minutes remaining, with both UNEXTENDED and ADVERSE_EXTENDED variants if an active exemption applies."
    roles: [Driver, CarrierSafetyOfficer, FMCSAAuditor]
    code: 200
    input: []
    output: HOSSnapshot
    side_effects: []

  # ---- Daily Logs (RODS) ----
  - method: GET
    path: "/drivers/{driver_id}/daily-logs"
    description: "List a driver's daily logs. Filter by status, log_date range; pagination."
    roles: [Driver, CarrierSafetyOfficer, FMCSAAuditor]
    code: 200
    input: ["status?", "from_date?", "to_date?", "limit?", "offset?"]
    output: "DailyLog[]"
    side_effects: []

  - method: GET
    path: "/drivers/{driver_id}/daily-logs/{log_id}"
    description: "Fetch a daily log including integrity hash and totals."
    roles: [Driver, CarrierSafetyOfficer, FMCSAAuditor]
    code: 200
    input: []
    output: DailyLog
    side_effects: []

  - method: POST
    path: "/drivers/{driver_id}/daily-logs/{log_id}/certify"
    description: "Driver certifies a daily log. Triggers integrity hash freeze for that snapshot."
    roles: [Driver]
    code: 200
    input: []
    output: DailyLog
    side_effects:
      - "DailyLog.status := CERTIFIED"
      - "DailyLog.certified_at := server_now()"
      - "DailyLog.certification_count := 1"

  # ---- Violations ----
  - method: GET
    path: "/violations"
    description: "List violations. Filter by driver_id, carrier_id, status, rule_code; pagination."
    roles: [CarrierSafetyOfficer, FMCSAAuditor]
    code: 200
    input: ["driver_id?", "carrier_id?", "status?", "rule_code?", "limit?", "offset?"]
    output: "Violation[]"
    side_effects: []

  - method: GET
    path: "/violations/{violation_id}"
    description: "Fetch a violation."
    roles: [Driver, CarrierSafetyOfficer, FMCSAAuditor]
    code: 200
    input: []
    output: Violation
    side_effects: []

  - method: POST
    path: "/violations/{violation_id}/acknowledge"
    description: "Driver acknowledges a violation."
    roles: [Driver]
    code: 200
    input: []
    output: Violation
    side_effects:
      - "Violation.status := ACKNOWLEDGED"

  - method: POST
    path: "/violations/{violation_id}/report-to-fmcsa"
    description: "Carrier safety officer reports an acknowledged violation to FMCSA."
    roles: [CarrierSafetyOfficer]
    code: 200
    input: []
    output: Violation
    side_effects:
      - "Violation.status := REPORTED"
      - "Violation.reported_to_fmcsa_at := server_now()"
      - "Violation.fmcsa_report_id := generated"

  # ---- Adverse Conditions Exemption ----
  - method: POST
    path: "/drivers/{driver_id}/adverse-conditions"
    description: "Driver declares adverse conditions for the current 14-hour window."
    roles: [Driver]
    code: 201
    input: [declared_at, reason]
    output: AdverseConditionsExemption
    side_effects:
      - "Exemption attached to current 14-hour window; applies_to_log_date computed"

  - method: GET
    path: "/drivers/{driver_id}/adverse-conditions"
    description: "List a driver's adverse-conditions declarations."
    roles: [Driver, CarrierSafetyOfficer, FMCSAAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "AdverseConditionsExemption[]"
    side_effects: []

  # ---- Test driving endpoints (required by §1.5 testability-completeness) ----
  - method: POST
    path: "/_clock/advance"
    description: "Test-driving endpoint: advance the server clock to a target ISO 8601 UTC instant. Required to reach time-gated states (DailyLog.log_date < today, AdverseConditionsExemption.EXPIRED at midnight, edit-window expiry at 8 days)."
    roles: [PlatformAdmin]
    code: 200
    input: [to]
    output: ClockState
    side_effects:
      - "Server clock advanced; AdverseConditionsExemption rows may transition ACTIVE→EXPIRED if their applies_to_log_date midnight is crossed"

  - method: GET
    path: "/_clock"
    description: "Test-driving endpoint: read current server clock."
    roles: [PlatformAdmin, Driver, CarrierSafetyOfficer, FMCSAAuditor]
    code: 200
    input: []
    output: ClockState
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_MISSING_AUTH
    http: 401
    condition: "X-User-Role or X-User-ID header missing or unparsable."

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Acting role is not in the endpoint's RBAC allow-list."

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path or referenced resource id does not exist."

  - id: ERR_INVALID_INPUT
    http: 400
    condition: "Request body schema invalid: missing required field, wrong type, enum out of range, latitude/longitude out of range, pagination out of range."

  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "Client-supplied version does not match stored version on a versioned resource."

  - id: ERR_DUTY_EVENT_OUT_OF_ORDER
    http: 409
    condition: "DutyEvent.event_time is not strictly greater than the latest accepted DutyEvent.event_time for this driver."

  - id: ERR_DRIVER_NOT_BOUND
    http: 409
    condition: "Driver attempted a DutyEvent requiring a bound vehicle while Driver.bound_vehicle_id IS NULL."

  - id: ERR_DRIVER_ALREADY_BOUND
    http: 409
    condition: "Bind attempt while Driver.bound_vehicle_id IS NOT NULL."

  - id: ERR_VEHICLE_ALREADY_BOUND
    http: 409
    condition: "Bind attempt while Vehicle.current_driver_id IS NOT NULL."

  - id: ERR_INVALID_DUTY_STATUS_FOR_BIND
    http: 409
    condition: "Bind requires Driver.duty_status == OFF_DUTY; unbind requires OFF_DUTY or SLEEPER_BERTH."

  - id: ERR_CROSS_CARRIER_BIND
    http: 422
    condition: "Vehicle.carrier_id != Driver.carrier_id at bind time."

  - id: ERR_ELD_NOT_CERTIFIED
    http: 422
    condition: "ELDDevice.certified_for_fmcsa == false at bind time."

  - id: ERR_VEHICLE_MISMATCH
    http: 422
    condition: "DutyEvent.vehicle_id != Driver.bound_vehicle_id for an on-vehicle status."

  - id: ERR_ELEVEN_HOUR_LIMIT_EXCEEDED
    http: 409
    condition: "available_driving_hours.minutes_remaining <= 0 at event_time for a DRIVING event."

  - id: ERR_FOURTEEN_HOUR_WINDOW_EXCEEDED
    http: 409
    condition: "available_on_duty_window.minutes_remaining <= 0 at event_time for an on-duty event."

  - id: ERR_CYCLE_LIMIT_EXCEEDED
    http: 409
    condition: "cycle_hours_remaining.minutes_remaining <= 0 at event_time for an on-duty event."

  - id: ERR_INSUFFICIENT_REST
    http: 409
    condition: "Transition SLEEPER_BERTH→DRIVING with neither a 10h continuous reset nor a qualifying sleeper-berth split."

  - id: ERR_ANNOTATION_REQUIRED
    http: 422
    condition: "PERSONAL_CONVEYANCE or YARD_MOVES event without an annotation of length >= 10."

  - id: ERR_EXEMPTION_NOT_ACTIVE
    http: 422
    condition: "adverse_conditions_exemption_id references an exemption that is not ACTIVE, belongs to a different driver, or does not attach to the current log_date."

  - id: ERR_ODOMETER_DECREASED
    http: 422
    condition: "DutyEvent.odometer_miles < latest accepted odometer_miles for the same vehicle."

  - id: ERR_LOG_ALREADY_CERTIFIED
    http: 409
    condition: "Appending a DutyEvent on a log_date whose DailyLog.status != UNCERTIFIED; or a certify race lost on integrity_hash."

  - id: ERR_LOG_NOT_YET_CERTIFIABLE
    http: 422
    condition: "Certifying a DailyLog whose log_date is today or in the future (driver home terminal timezone)."

  - id: ERR_EDIT_WINDOW_EXPIRED
    http: 422
    condition: "Driver edit submitted after event_time + 8 days."

  - id: ERR_INVALID_VIOLATION_STATE
    http: 409
    condition: "Acknowledge requires Violation.status == OPEN; report-to-fmcsa requires ACKNOWLEDGED."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Driver
    description: "A commercial driver. Authenticates as the entity acted upon for personal duty events, log certification, and vehicle binding."
    identity: "entity_backed:Driver"
    exclusive_operations:
      - "POST /drivers/{driver_id}/bind"
      - "POST /drivers/{driver_id}/unbind"
      - "POST /drivers/{driver_id}/duty-events"
      - "POST /drivers/{driver_id}/duty-events/{event_id}/edit"
      - "POST /drivers/{driver_id}/daily-logs/{log_id}/certify"
      - "POST /violations/{violation_id}/acknowledge"
      - "POST /drivers/{driver_id}/adverse-conditions"
    shared_operations:
      - "GET /drivers/{driver_id}"
      - "GET /drivers/{driver_id}/duty-events"
      - "GET /drivers/{driver_id}/daily-logs"
      - "GET /drivers/{driver_id}/daily-logs/{log_id}"
      - "GET /drivers/{driver_id}/hos-snapshot"
      - "GET /drivers/{driver_id}/adverse-conditions"
      - "GET /violations/{violation_id}"
      - "GET /vehicles/{vehicle_id}"
      - "GET /_clock"

  - name: CarrierSafetyOfficer
    description: "A safety officer at a motor carrier. Registers fleet assets, lists violations and logs, and reports violations to FMCSA."
    identity: "opaque"
    exclusive_operations:
      - "POST /vehicles"
      - "POST /drivers"
      - "POST /violations/{violation_id}/report-to-fmcsa"
    shared_operations:
      - "GET /carriers/{carrier_id}"
      - "GET /eld-devices/{device_id}"
      - "GET /vehicles/{vehicle_id}"
      - "GET /drivers/{driver_id}"
      - "GET /drivers/{driver_id}/duty-events"
      - "GET /drivers/{driver_id}/daily-logs"
      - "GET /drivers/{driver_id}/daily-logs/{log_id}"
      - "GET /drivers/{driver_id}/hos-snapshot"
      - "GET /drivers/{driver_id}/adverse-conditions"
      - "GET /violations"
      - "GET /violations/{violation_id}"
      - "GET /_clock"

  - name: FMCSAAuditor
    description: "External federal auditor with read-only access across carriers, drivers, logs, and violations."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "GET /carriers/{carrier_id}"
      - "GET /eld-devices/{device_id}"
      - "GET /vehicles/{vehicle_id}"
      - "GET /drivers/{driver_id}"
      - "GET /drivers/{driver_id}/duty-events"
      - "GET /drivers/{driver_id}/daily-logs"
      - "GET /drivers/{driver_id}/daily-logs/{log_id}"
      - "GET /drivers/{driver_id}/hos-snapshot"
      - "GET /drivers/{driver_id}/adverse-conditions"
      - "GET /violations"
      - "GET /violations/{violation_id}"
      - "GET /_clock"

  - name: PlatformAdmin
    description: "Operator of the ELD platform. Registers carriers and ELD devices and drives the test clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /carriers"
      - "POST /eld-devices"
      - "POST /_clock/advance"
    shared_operations:
      - "GET /carriers/{carrier_id}"
      - "GET /eld-devices/{device_id}"
      - "GET /_clock"
