      - name: advance_creation_syncs_loan_and_trust_advance_ledgers
        claim_type: ledger_sync
        grounds:
          - endpoints.POST_advances.side_effects
          - entities.Loan.fields.advances_outstanding_usd
          - entities.Trust.fields.total_advances_outstanding_usd
        distinguishing_aspect: "Two derived ledgers at two levels must reconcile after every advance: the loan-level sum and the trust-level sum across ALL loans of the trust. The trust roll-up is deliberately not filtered by servicing_status, so an advance on a loan still in MASTER_SERVICING lands in the trust total, and both ledgers carry principal only — the 30/360 accrued interest that each advance reports on read is excluded."
