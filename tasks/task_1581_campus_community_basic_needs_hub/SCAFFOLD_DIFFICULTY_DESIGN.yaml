            - call: "POST /clients/${c_id}/assessments/${a_id}/verify"
              payload: { expected_client_version: "${c_v}" }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
            - call: "POST /partner-agencies"
              payload: { agency_name: "Housing Navigators", service_categories: ["HOUSING_PLACEMENT"], weekly_capacity: 10 }
              as: HubAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /clients/${c_id}/referrals"
              payload: { agency_id: "${ag_id}", service_category: "HOUSING_PLACEMENT" }
              as: IntakeCoordinator
              as_user_id: "${coord_id}"
              captures: { r_id: $.data.id }
            - call: "POST /partner-agencies/${ag_id}/pause"
              payload: {}
              as: HubAdmin
          trigger:
            - call: "POST /referrals/${r_id}/send"
              payload: {}
