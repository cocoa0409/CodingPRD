            - "http_status == 422"

  # ==========================================================================
  # Rule 6 — boundary_precision_check (two DIFFERENT metrics/endpoints)
  # ==========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: union_threshold_exactly_three_flips
        grounds:
          - calculations.union_eligibility_tafthartley
          - entities.Talent.fields.union_engagement_count_365d
        distinguishing_aspect: |
          Numeric threshold metric: union_engagement_count_365d crossing the
          >=3 boundary. At count==2 talent stays NON_UNION; confirming the
          THIRD union-covered booking (count becomes exactly 3) flips status to
          ELIGIBLE_PENDING. Reached via the booking confirm endpoint.
        test_recipe:
          setup:
            - "NON_UNION talent with TWO CONFIRMED union-covered bookings inside the window; a third submission at OFFER_PENDING with ACCEPTED offer + EXECUTED memo"
          setup_api_calls:
            - { call: "POST /casting/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: CastingDirector }
            - call: "POST /casting/productions"
              payload: { title: "UP", production_type: "TV_SERIES", union_signatory: true, shoot_city: "LA", shoot_state: "CA", start_date: "2026-08-01T00:00:00Z", wrap_date: "2026-09-30T00:00:00Z", casting_office_id: "office-1" }
              as: CastingDirector
              captures: { prod_id: $.data.id }
            - call: "POST /casting/talents"
