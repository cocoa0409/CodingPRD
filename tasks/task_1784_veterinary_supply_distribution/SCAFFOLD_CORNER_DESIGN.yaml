    - state_machines.OrderLine.ALLOCATED_to_SHIPPED
    - state_machines.Order.APPROVED_to_SHIPPED
    distinguishing_aspect: 'Dispatch converts reservation into outbound stock in one atomic step: line ALLOCATED -> SHIPPED, lot qty_on_hand 10 -> 8 and qty_allocated 2 -> 0 (conservation holds), order
      APPROVED -> SHIPPED.'
    test_recipe:
