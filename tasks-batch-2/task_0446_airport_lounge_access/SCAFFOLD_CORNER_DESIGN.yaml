# =============================================================================
# Task 0446 — Airport Lounge Access
# SCAFFOLD_CORNER_DESIGN.yaml  (§1.9 breadth probe / coverage index)
# Walks references/claim-extraction-guide.md against SCAFFOLD.yaml §1.1-§1.7.
# section/claim_type values come from the guide's nine sections.
# excluded_because: stubs cite a §1.8 instance by name (no test_recipe).
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: entity_create_lounge_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Lounge, endpoints]
        distinguishing_aspect: "POST /lounges with all required fields returns 201; status defaults OPEN, occupancy and settlement_balance default 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /lounges"
              payload: { name: "Create L", airport_code: "SFO", capacity: 10, settlement_rate_cents: 1200, guest_fee_cents: 1000, day_pass_price_cents: 4000 }
              as: NetworkAdmin
              captures: { l_id: $.data.id, l_status: $.data.status, l_occ: $.data.current_occupancy, l_bal: $.data.settlement_balance_cents, l_v: $.data.version }
          assert:
            - "HTTP 201; Lounge.${l_id}.status == OPEN; current_occupancy == 0; settlement_balance_cents == 0; version == 1"

      - name: entity_get_member_returns_stored
        claim_type: Retrieval
        grounds: [entities.Member, endpoints]
        distinguishing_aspect: "GET /memberships/{id} returns the enrolled member with its plan_id and computed counters."
        test_recipe:
          setup: ["One plan, one member enrolled on it."]
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "STANDARD", included_visits_per_year: 0, included_guest_visits_per_year: 0, overage_charge_cents: 5000, guest_charge_cents: 2500, min_card_status: "BASIC", annual_fee_cents: 0 }
              as: NetworkAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", full_name: "Stored Member" }
              as: NetworkAdmin
              captures: { m_id: $.data.id }
          trigger:
            - call: "GET /memberships/${m_id}"
              payload: {}
              as: NetworkAdmin
              captures: { got_plan: $.data.plan_id, got_standing: $.data.standing }
          assert:
            - "Member.${m_id}.plan_id == ${plan_id}; standing == GOOD; visits_used == 0; wallet_balance_cents == 0"

      - name: entity_list_lounges_paginated_envelope
        claim_type: Listing
        grounds: [entities.Lounge, endpoints]
        distinguishing_aspect: "GET /lounges returns a paginated array envelope with total_count and has_more."
        test_recipe:
          setup: ["Two lounges created."]
          setup_api_calls:
            - call: "POST /lounges"
              payload: { name: "L1", airport_code: "AAA", capacity: 5, settlement_rate_cents: 1000, guest_fee_cents: 500, day_pass_price_cents: 3000 }
              as: NetworkAdmin
            - call: "POST /lounges"
              payload: { name: "L2", airport_code: "BBB", capacity: 5, settlement_rate_cents: 1000, guest_fee_cents: 500, day_pass_price_cents: 3000 }
              as: NetworkAdmin
          trigger:
            - call: "GET /lounges?limit=1&offset=0"
              payload: {}
              as: NetworkAdmin
              captures: { total: $.meta }
          assert:
            - "response_type == array; meta.total_count == 2; has_more == true with limit 1; data length == 1"

      - name: entity_get_member_not_found
        claim_type: Not Found
        grounds: [entities.Member, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /memberships/{nonexistent} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /memberships/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: NetworkAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404; error_id == ERR_NOT_FOUND"

      - name: entity_create_lounge_missing_required_field
        claim_type: Required Fields
        grounds: [entities.Lounge.fields.capacity, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /lounges missing required capacity returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /lounges"
              payload: { name: "No Cap", airport_code: "SFO", settlement_rate_cents: 1200, guest_fee_cents: 1000, day_pass_price_cents: 4000 }
              as: NetworkAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400; error_id == ERR_INVALID_REQUEST (capacity required)"

      - name: entity_visit_guest_count_default_zero
        claim_type: Defaults
        grounds: [entities.Visit.fields.guest_count]
        distinguishing_aspect: "POST /visits omitting guest_count defaults to 0, occupant_count 1."
        test_recipe:
          setup: ["Plan, member with active card, open lounge."]
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "PRESTIGE", included_visits_per_year: 10, included_guest_visits_per_year: 5, overage_charge_cents: 5000, guest_charge_cents: 2500, min_card_status: "BASIC", annual_fee_cents: 0 }
              as: NetworkAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /lounges"
              payload: { name: "LDef", airport_code: "SEA", capacity: 10, settlement_rate_cents: 1200, guest_fee_cents: 1000, day_pass_price_cents: 4000 }
              as: NetworkAdmin
              captures: { l_id: $.data.id, l_v0: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", full_name: "Def Member" }
              as: NetworkAdmin
              captures: { m_id: $.data.id }
            - call: "POST /eligibility-cards"
              payload: { member_id: "${m_id}", card_status: "BASIC", fare_class: "ECONOMY", valid_until: "2027-01-01T00:00:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "POST /visits"
              payload: { member_id: "${m_id}", lounge_id: "${l_id}", expected_lounge_version: "${l_v0}" }
              as: NetworkAdmin
              captures: { v_id: $.data.id, gc: $.data.guest_count, oc: $.data.occupant_count }
          assert:
            - "Visit.${v_id}.guest_count == 0; occupant_count == 1"

      - name: entity_visit_computed_occupant_count_ignores_input
        claim_type: Computed Fields
        grounds: [entities.Visit.fields.occupant_count, entities.Visit.fields.entry_mode]
        distinguishing_aspect: "occupant_count is computed (1 + guest_count); a client cannot set it directly — it is not in POST /visits input."
        test_recipe:
          setup: ["Plan, member with active card, open lounge."]
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "PRESTIGE", included_visits_per_year: 10, included_guest_visits_per_year: 5, overage_charge_cents: 5000, guest_charge_cents: 2500, min_card_status: "BASIC", annual_fee_cents: 0 }
              as: NetworkAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /lounges"
              payload: { name: "LComp", airport_code: "LAX", capacity: 10, settlement_rate_cents: 1200, guest_fee_cents: 1000, day_pass_price_cents: 4000 }
              as: NetworkAdmin
              captures: { l_id: $.data.id, l_v0: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", full_name: "Comp Member" }
              as: NetworkAdmin
              captures: { m_id: $.data.id }
            - call: "POST /eligibility-cards"
              payload: { member_id: "${m_id}", card_status: "BASIC", fare_class: "ECONOMY", valid_until: "2027-01-01T00:00:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "POST /visits"
              payload: { member_id: "${m_id}", lounge_id: "${l_id}", guest_count: 2, guest_names: ["A","B"], expected_lounge_version: "${l_v0}" }
              as: NetworkAdmin
              captures: { v_id: $.data.id, oc: $.data.occupant_count, mode: $.data.entry_mode }
          assert:
            - "Visit.${v_id}.occupant_count == 3 (1 + 2 guests); entry_mode == ALLOTMENT"

      - name: entity_member_system_fields_generated
        claim_type: System Fields
        grounds: [entities.Member.fields.membership_year_start]
        distinguishing_aspect: "membership_year_start is system-stamped to the logical clock at enrolment; client cannot set it."
        test_recipe:
          setup: ["Clock set to a fixed instant, then a member enrolled."]
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "STANDARD", included_visits_per_year: 0, included_guest_visits_per_year: 0, overage_charge_cents: 5000, guest_charge_cents: 2500, min_card_status: "BASIC", annual_fee_cents: 0 }
              as: NetworkAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", full_name: "Sys Member" }
              as: NetworkAdmin
              captures: { m_id: $.data.id, ys: $.data.membership_year_start }
          assert:
            - "Member.${m_id}.membership_year_start == 2026-03-15T00:00:00.000Z (stamped from logical clock)"

      - name: entity_card_invalid_enum_rejected
        claim_type: Type Constraints
        grounds: [entities.EligibilityCard.fields.card_status, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /eligibility-cards with card_status not in {BASIC,SILVER,GOLD} returns ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["A plan and member."]
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "PRESTIGE", included_visits_per_year: 10, included_guest_visits_per_year: 5, overage_charge_cents: 5000, guest_charge_cents: 2500, min_card_status: "BASIC", annual_fee_cents: 0 }
              as: NetworkAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", full_name: "Enum Member" }
              as: NetworkAdmin
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /eligibility-cards"
              payload: { member_id: "${m_id}", card_status: "PLATINUM", fare_class: "ECONOMY", valid_until: "2027-01-01T00:00:00Z" }
              as: NetworkAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400; error_id == ERR_INVALID_REQUEST (PLATINUM is not a valid card_status)"

      - name: entity_settlement_immutable_no_update_no_version
        claim_type: Immutability
        grounds: [entities.Settlement]
        distinguishing_aspect: "Settlement is common_fields:false (id + created_at only); no version field and no update endpoint — only get/list and the reverse transition."
        test_recipe:
          setup: ["A completed visit producing a settlement."]
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "PRESTIGE", included_visits_per_year: 10, included_guest_visits_per_year: 5, overage_charge_cents: 5000, guest_charge_cents: 2500, min_card_status: "BASIC", annual_fee_cents: 0 }
              as: NetworkAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /lounges"
              payload: { name: "LImm", airport_code: "ORD", capacity: 10, settlement_rate_cents: 1200, guest_fee_cents: 1000, day_pass_price_cents: 4000 }
              as: NetworkAdmin
              captures: { l_id: $.data.id, l_v0: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", full_name: "Imm Member" }
              as: NetworkAdmin
              captures: { m_id: $.data.id }
            - call: "POST /eligibility-cards"
              payload: { member_id: "${m_id}", card_status: "BASIC", fare_class: "ECONOMY", valid_until: "2027-01-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /visits"
              payload: { member_id: "${m_id}", lounge_id: "${l_id}", guest_count: 0, expected_lounge_version: "${l_v0}" }
              as: NetworkAdmin
              captures: { v_id: $.data.id }
            - call: "POST /visits/${v_id}/check-in"
              payload: {}
              as: LoungeAgent
              as_user_id: "${l_id}"
            - call: "POST /visits/${v_id}/complete"
              payload: {}
              as: LoungeAgent
              as_user_id: "${l_id}"
          trigger:
            - call: "GET /settlements?visit_id=${v_id}"
              payload: {}
              as: NetworkAdmin
              captures: { s_status: "$.data[0].status", s_amount: "$.data[0].amount_cents" }
          assert:
            - "Settlement for ${v_id}: status == PAYABLE, amount_cents == 1200; no version field present on the Settlement"

      - name: entity_visit_wrong_lounge_parent_not_found
        claim_type: Parent Relationships
        grounds: [entities.Visit.fields.lounge_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /visits referencing a non-existent lounge_id returns ERR_NOT_FOUND."
        test_recipe:
          setup: ["Plan and member with active card; a real lounge exists (for a valid observed version) but the hold targets a different, non-existent lounge_id. Existence (404) is checked before OCC."]
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "PRESTIGE", included_visits_per_year: 10, included_guest_visits_per_year: 5, overage_charge_cents: 5000, guest_charge_cents: 2500, min_card_status: "BASIC", annual_fee_cents: 0 }
              as: NetworkAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /lounges"
              payload: { name: "LReal", airport_code: "SFO", capacity: 10, settlement_rate_cents: 1200, guest_fee_cents: 1000, day_pass_price_cents: 4000 }
              as: NetworkAdmin
              captures: { real_l_id: $.data.id, real_l_v0: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", full_name: "Orphan Member" }
              as: NetworkAdmin
              captures: { m_id: $.data.id }
            - call: "POST /eligibility-cards"
              payload: { member_id: "${m_id}", card_status: "BASIC", fare_class: "ECONOMY", valid_until: "2027-01-01T00:00:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "POST /visits"
              payload: { member_id: "${m_id}", lounge_id: "00000000-0000-4000-8000-0000000000aa", guest_count: 0, expected_lounge_version: "${real_l_v0}" }
              as: NetworkAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404; error_id == ERR_NOT_FOUND (target lounge does not exist; existence is checked before OCC, so the version value is moot)"

      - name: entity_flat_topology_fk_validated
        claim_type: Creation
        grounds: [entities.EligibilityCard.fields.member_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Flat topology FK integrity: POST /eligibility-cards with a non-existent member_id returns ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB (no member with the id)."]
          setup_api_calls: []
          trigger:
            - call: "POST /eligibility-cards"
              payload: { member_id: "00000000-0000-4000-8000-0000000000bb", card_status: "GOLD", fare_class: "FIRST", valid_until: "2027-01-01T00:00:00Z" }
              as: NetworkAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404; error_id == ERR_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: sm_checkin_already_checked_in_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Visit.HELD_to_CHECKED_IN, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Checking in a Visit already CHECKED_IN returns ERR_INVALID_STATE; no double occupancy."
        test_recipe:
          setup: ["A checked-in visit."]
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "PRESTIGE", included_visits_per_year: 10, included_guest_visits_per_year: 5, overage_charge_cents: 5000, guest_charge_cents: 2500, min_card_status: "BASIC", annual_fee_cents: 0 }
              as: NetworkAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /lounges"
              payload: { name: "LSM1", airport_code: "DEN", capacity: 10, settlement_rate_cents: 1200, guest_fee_cents: 1000, day_pass_price_cents: 4000 }
              as: NetworkAdmin
              captures: { l_id: $.data.id, l_v0: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", full_name: "SM Member" }
              as: NetworkAdmin
              captures: { m_id: $.data.id }
            - call: "POST /eligibility-cards"
              payload: { member_id: "${m_id}", card_status: "BASIC", fare_class: "ECONOMY", valid_until: "2027-01-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /visits"
              payload: { member_id: "${m_id}", lounge_id: "${l_id}", guest_count: 0, expected_lounge_version: "${l_v0}" }
              as: NetworkAdmin
              captures: { v_id: $.data.id }
            - call: "POST /visits/${v_id}/check-in"
              payload: {}
              as: LoungeAgent
              as_user_id: "${l_id}"
          trigger:
            - call: "POST /visits/${v_id}/check-in"
              payload: {}
              as: LoungeAgent
              as_user_id: "${l_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; error_id == ERR_INVALID_STATE; Visit.${v_id}.status stays CHECKED_IN"

      - name: sm_complete_terminal_completed_locked
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Visit.CHECKED_IN_to_COMPLETED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Completing a Visit already COMPLETED (terminal) returns ERR_INVALID_STATE; no second settlement."
        test_recipe:
          setup: ["A completed visit."]
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "PRESTIGE", included_visits_per_year: 10, included_guest_visits_per_year: 5, overage_charge_cents: 5000, guest_charge_cents: 2500, min_card_status: "BASIC", annual_fee_cents: 0 }
              as: NetworkAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /lounges"
              payload: { name: "LSM2", airport_code: "PHX", capacity: 10, settlement_rate_cents: 1200, guest_fee_cents: 1000, day_pass_price_cents: 4000 }
              as: NetworkAdmin
              captures: { l_id: $.data.id, l_v0: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", full_name: "SM2 Member" }
              as: NetworkAdmin
              captures: { m_id: $.data.id }
            - call: "POST /eligibility-cards"
              payload: { member_id: "${m_id}", card_status: "BASIC", fare_class: "ECONOMY", valid_until: "2027-01-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /visits"
              payload: { member_id: "${m_id}", lounge_id: "${l_id}", guest_count: 0, expected_lounge_version: "${l_v0}" }
              as: NetworkAdmin
              captures: { v_id: $.data.id }
            - call: "POST /visits/${v_id}/check-in"
              payload: {}
              as: LoungeAgent
              as_user_id: "${l_id}"
            - call: "POST /visits/${v_id}/complete"
              payload: {}
              as: LoungeAgent
              as_user_id: "${l_id}"
          trigger:
            - call: "POST /visits/${v_id}/complete"
              payload: {}
              as: LoungeAgent
              as_user_id: "${l_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; error_id == ERR_INVALID_STATE (COMPLETED is terminal)"

      - name: sm_cancel_checked_in_visit_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Visit.HELD_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancel is only defined from HELD; cancelling a CHECKED_IN visit returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["A checked-in visit (cancel only valid from HELD)."]
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "PRESTIGE", included_visits_per_year: 10, included_guest_visits_per_year: 5, overage_charge_cents: 5000, guest_charge_cents: 2500, min_card_status: "BASIC", annual_fee_cents: 0 }
              as: NetworkAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /lounges"
              payload: { name: "LSM3", airport_code: "MIA", capacity: 10, settlement_rate_cents: 1200, guest_fee_cents: 1000, day_pass_price_cents: 4000 }
              as: NetworkAdmin
              captures: { l_id: $.data.id, l_v0: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", full_name: "SM3 Member" }
              as: NetworkAdmin
              captures: { m_id: $.data.id }
            - call: "POST /eligibility-cards"
              payload: { member_id: "${m_id}", card_status: "BASIC", fare_class: "ECONOMY", valid_until: "2027-01-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /visits"
              payload: { member_id: "${m_id}", lounge_id: "${l_id}", guest_count: 0, expected_lounge_version: "${l_v0}" }
              as: NetworkAdmin
              captures: { v_id: $.data.id }
            - call: "POST /visits/${v_id}/check-in"
              payload: {}
              as: LoungeAgent
              as_user_id: "${l_id}"
          trigger:
            - call: "POST /visits/${v_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; error_id == ERR_INVALID_STATE"

      - name: sm_shower_complete_already_cancelled_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.ShowerReservation.BOOKED_to_CANCELLED, state_machines.ShowerReservation.BOOKED_to_COMPLETED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A CANCELLED ShowerReservation cannot be completed; complete is only defined from BOOKED."
        test_recipe:
          setup: ["A booked shower reservation, then cancelled."]
          setup_api_calls:
            - call: "POST /membership-plans"
              payload: { tier: "PRESTIGE", included_visits_per_year: 10, included_guest_visits_per_year: 5, overage_charge_cents: 5000, guest_charge_cents: 2500, min_card_status: "BASIC", annual_fee_cents: 0 }
              as: NetworkAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /lounges"
              payload: { name: "LShSm", airport_code: "HNL", capacity: 10, settlement_rate_cents: 1200, guest_fee_cents: 1000, day_pass_price_cents: 4000 }
              as: NetworkAdmin
              captures: { l_id: $.data.id, l_v0: $.data.version }
            - call: "POST /shower-suites"
              payload: { lounge_id: "${l_id}", label: "Suite A", turnover_minutes: 0 }
