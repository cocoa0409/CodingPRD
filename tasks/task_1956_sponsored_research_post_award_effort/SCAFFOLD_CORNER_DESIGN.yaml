        distinguishing_aspect: "Certifying 10.00 against charged 3.47 (variance 6.53 > 5.00 tolerance) without a payroll_adjustment_note -> 422 ERR_VARIANCE_NOTE_REQUIRED; adding the note passes and stores variance_pp 6.53."
