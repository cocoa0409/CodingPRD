        claim_type: derived_field_reconciliation
        grounds: [entities.Invoice.fields.status, calculations.account_balance]
        distinguishing_aspect: "Flagging an ISSUED invoice OVERDUE (after due_on per clock) leaves the contract account_balance_cents unchanged because both ISSUED and OVERDUE count toward the balance."
        test_recipe:
          setup: ["A contract with one ISSUED visit invoice total 6000 (account_balance 6000), due_on 2026-03-01, clock advanced past due_on."]
