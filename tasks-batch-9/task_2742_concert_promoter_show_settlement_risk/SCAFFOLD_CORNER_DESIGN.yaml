              as: TourAccountant
              captures: { cy_rc3: $.data.resubmit_count, cy_amt3: $.data.amount_cents }
            # ---- ledger is still untouched mid-cycle -------------------
            - call: "GET /budget-lines/${cy_bl_id}"
              payload: {}
              as: TourAccountant
              captures: { cy_mid_actual: $.data.actual_cents }
            # ---- exit the loop through the terminal state ---------------
            - call: "POST /vendor-invoices/${cy_vi_id}/verify"
              payload: {}
              as: TourAccountant
              as_user_id: "u_acct_v4"
            - call: "POST /vendor-invoices/${cy_vi_id}/approve"
              payload: {}
              as: TourAccountant
              as_user_id: "u_acct_approver"
              captures: { cy_v_after_approve: $.data.version }
            - call: "GET /budget-lines/${cy_bl_id}"
              payload: {}
              as: TourAccountant
            - call: "GET /shows/${cy_sh_id}"
              payload: {}
              as: TourAccountant
            # ---- a fourth dispute after the loop has ended -------------
            - call: "POST /vendor-invoices/${cy_vi_id}/dispute"
              payload: { dispute_reason: "Too late - the row is already approved" }
              as: TourAccountant
              captures: { cy_e_terminal: $.data.error_id }
            - call: "GET /vendor-invoices/${cy_vi_id}"
              payload: {}
              as: TourAccountant
          assert:
            - "LAP COUNTER IS MONOTONIC — ${cy_rc1} == 1, ${cy_rc2} == 2, ${cy_rc3} == 3; resubmit_count only ever increases and is never reset by a verify or an approve"
            - "NO ROUND LIMIT — all three DISPUTED -> SUBMITTED resubmissions returned 200; there is no ERR_NEGOTIATION_ROUNDS_EXHAUSTED analogue on VendorInvoice, which is exactly what distinguishes this cycle from the Offer cycle"
            - "AMOUNT IS REPLACED, NOT ACCUMULATED — ${cy_amt1} == 130000, ${cy_amt2} == 118000, ${cy_amt3} == 105000 (an implementation that adds the resubmitted amount would read 230000 on lap 1)"
            - "DOCUMENTATION FOLLOWS THE AMOUNT — invoice documentation_ref == 'PKT-004' and dispute_reason == null after the third RESUBMIT"
            - "VERIFICATION IS VOIDED BY EVERY DISPUTE — ${cy_lap1_verified} == null on the lap-1 dispute response, and the same holds on laps 2 and 3; the final verified_by_user_id == 'u_acct_v4' and approved_by_user_id == 'u_acct_approver'"
            - "LEDGER UNTOUCHED MID-CYCLE — ${cy_mid_actual} == 0: only APPROVED invoices feed actual_cents, so after three laps the line still reads actual_cents 0, variance_cents -100000, variance_pct -100.00, variance_status WITHIN_TOLERANCE, settlement_expense_cents 0"
            - "LEDGER MOVES ONLY ON APPROVAL — after approve the line reads actual_cents 105000, variance_cents 5000, variance_pct 5.00, variance_status WITHIN_TOLERANCE, settlement_expense_cents 105000, and show.total_actual_expense_cents == 105000 with budget_posture ON_BUDGET"
            - "LOOP TERMINATION — ${cy_e_terminal} == ERR_ALREADY_TERMINAL 409 (NOT ERR_INVALID_STATE): APPROVED is in VendorInvoice.terminal_states, and priority 18 is evaluated before priority 17"
            - "NO DRIFT ON THE REFUSED CALL — invoice status is still APPROVED, resubmit_count is still 3, amount_cents is still 105000 and version == ${cy_v_after_approve}"

      - name: parallel_dimensions_show_status_and_sales_status_are_independent
