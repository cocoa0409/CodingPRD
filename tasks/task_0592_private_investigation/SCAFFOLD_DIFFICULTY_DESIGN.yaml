  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: skip_trace_bulk_hit_rate_engages_at_exactly_25_hits
        grounds:
          - calculations.search_cost
          - entities.SkipTraceSearch.fields.hit_count
          - entities.SkipTraceSearch.fields.cost_cents
          - state_machines.SkipTraceSearch.REQUESTED_to_COMPLETED
        distinguishing_aspect: |
          Numeric threshold boundary on the hit_count metric, reachable through
          POST /skip-trace-searches/{id}/execute: at hit_count 24 every hit bills the 40-cent standard
          rate (TLO: 900 + 960 = 1860), and the 25th hit — and only the 25th and beyond — bills the
          20-cent bulk rate (1880, i.e. +20 not +40). BULK_HIT_THRESHOLD is >=, not >.
        test_recipe:
          setup:
            - "ACTIVE CA case with a 500000-cent retainer, LEAD-assigned CA-licensed investigator."
            - "Two REQUESTED TLO skip-trace searches with LITIGATION purpose."
