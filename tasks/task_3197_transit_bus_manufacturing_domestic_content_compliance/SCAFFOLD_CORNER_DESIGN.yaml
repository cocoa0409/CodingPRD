              payload: { agency_id: "${ag_id}", base_quantity: 0, base_unit_price_cents: 50000000, base_contract_year: 2027, escalation_index: PPI_1413 }
              as: ProcurementOfficer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FISCAL_VIOLATION"

      - name: training_cancel_after_date_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_DEADLINE_PASSED]", state_machines.TrainingSession]
        distinguishing_aspect: "Cancelling a training session when the logical clock is at or after its scheduled_date fails with ERR_DEADLINE_PASSED."
        test_recipe:
