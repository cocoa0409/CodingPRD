              payload: { name: "Front A", zone_type: "SHOWROOM_FRONT", capacity_sqft: 200 }
              as: FloorOperator
              as_user_id: "floor-1"
              captures: { zone_front_id: $.data.id }
            - call: "POST /consignment-items/${item_id}/place"
              payload: { placement_zone_id: "${zone_front_id}", tag_code: "TAG-001" }
              as: FloorOperator
              as_user_id: "floor-1"
            - call: "POST /consignment-items/${item_id}/inventory-flag"
              payload: { flag: "MISSING" }
              as: FloorOperator
              as_user_id: "floor-1"
          trigger:
            - call: "POST /consignment-items/${item_id}/inventory-flag"
              payload: { flag: "RECOVERED" }
              as: FloorOperator
              as_user_id: "floor-1"
          assert:
            - "HTTP 200 and data.inventory_state == \"IN_CUSTODY\""
            - "data.lifecycle_state == \"ON_FLOOR\", untouched, because only the WRITTEN_OFF_INV branch resets it to AWAITING_PLACEMENT"
            - "data.placement_zone_id == ${zone_front_id} and data.current_price_cents == 51000"
            - "GET /consignors/${cons_id}/ledger-entries returns total_count == 1 with data[0].entry_type == \"PICKUP_SURCHARGE_DEBIT\" and no SHRINKAGE_RECOVERY_DEBIT present"
            - "GET /consignors/${cons_id} reports unclaimed_balance_cents == -17000 and lifetime_credits_cents == 0"
            - "GET /floor-zones/${zone_front_id} reports occupied_sqft == 20, unchanged, because SHRINKAGE_MISSING pieces were already counted"

      # ---- shape and side-effect-pattern rows carried by §1.8 ----------------
      - name: cyclic_shape_loop_termination_walk
        claim_type: cyclic
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.DamageClaim
        distinguishing_aspect: "The DamageClaim SUBMITTED -> INFO_REQUESTED -> SUBMITTED loop must terminate on the third pass rather than cycling forever."
        excluded_because:
          difficulty_instance: damage_claim_info_request_cycle_terminates_on_third_pass
          rationale: "That §1.8 instance drives the loop twice, proves the third resubmit answers ERR_CLAIM_RESUBMIT_LIMIT, and asserts resubmit_count is pinned at the cap — the full cyclic-shape claim including the termination condition."

      - name: parallel_dimension_independence_walk
        claim_type: parallel
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.ConsignmentItem.lifecycle_state
          - state_machines.ConsignmentItem.inventory_state
        distinguishing_aspect: "lifecycle_state and inventory_state are independent dimensions whose combined state must stay coherent."
        excluded_because:
          difficulty_instance: item_lifecycle_and_inventory_dimensions_advance_independently
          rationale: "That §1.8 instance advances each dimension while holding the other fixed and asserts all four visited combinations, which is exactly the parallel-shape claim."

      - name: guarded_transition_cross_entity_precondition_walk
        claim_type: guarded_transitions
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.ConsignmentItem.lifecycle_state.transitions.AWAITING_PLACEMENT_to_ON_FLOOR.preconditions
        distinguishing_aspect: "AWAITING_PLACEMENT -> ON_FLOOR is guarded on a DIFFERENT entity's state: the governing ConsignmentAgreement must still be ACTIVE."
        excluded_because:
          difficulty_instance: placement_blocked_by_expired_governing_agreement
          rationale: "That §1.8 instance expires the agreement under an otherwise placeable piece and shows the identical call succeeding before and failing after, covering both halves of the guarded-transition claim."

      - name: cascade_down_and_cross_entity_side_effect_walk
        claim_type: cascade_down
        grounds:
          - endpoints[POST /consignment-items/{id}/receive].side_effects
          - calculations.lot_bundle_list_price
          - calculations.clearance_relocation_selector
        distinguishing_aspect: "One receive on a lot component must repropagate the parent's price, its markdown, its clearance relocation and the occupancy of both zones."
        excluded_because:
          difficulty_instance: component_downgrade_cascades_lot_price_into_clearance_relocation
          rationale: "That §1.8 instance walks the whole depth-5 chain and asserts every link, including the two FloorZone rows on either side of the relocation."

      - name: ledger_sync_side_effect_walk
        claim_type: ledger_sync
        grounds:
          - endpoints[POST /sales].side_effects
          - entities.Consignor.fields.unclaimed_balance_cents
        distinguishing_aspect: "A sale must keep the consignor's derived balance in step with the appended ledger entry and may flip the consignor's own status as a consequence."
        excluded_because:
          difficulty_instance: sale_credit_cascades_through_ledger_into_consignor_reinstatement
          rationale: "That §1.8 instance reconciles the balance before and after the credit and proves the SUSPENDED -> ACTIVE reinstatement rides on the same write."

      - name: compensation_side_effect_walk
        claim_type: compensation
        grounds:
          - endpoints[POST /consignment-items/{id}/inventory-flag].side_effects
          - calculations.floor_zone_utilization
        distinguishing_aspect: "Undoing a write-off must reverse every original side effect with no residual drift in the zone's square footage or the ledger balance."
        excluded_because:
          difficulty_instance: write_off_then_recovery_and_replacement_restores_zone_square_footage
          rationale: "That §1.8 instance asserts the ledger nets to zero and the zone returns to its exact pre-write-off occupied_sqft, which is the compensation claim in full."

  # ==========================================================================
  # 3. CALCULATIONS
  # ==========================================================================
  - section: calculations
    instances:
      - name: grade_a_dining_piece_prices_at_thirty_five_thousand_seven_hundred
        claim_type: correct_result
        grounds:
          - calculations.photo_screening_score
          - calculations.item_list_price
        distinguishing_aspect: "Pins both stages on one known input: photo_score round_half_up(0.45*8.0 + 0.30*9.0 + 0.25*9.0, 2) == 8.55 -> grade A, then list_price_cents round_half_up(round_half_up(40000*0.85) * 1.05) == 35700. The DINING category factor 1.05 is above 1, so a wrong or omitted category factor lands on 34000 instead of 35700."
        test_recipe:
          setup:
            - "a STD-2026 schedule with one step, consignor Alpha, an ACTIVE agreement, and one DINING piece declared at 40000"
          setup_api_calls:
            - call: "POST /price-schedules"
              payload: { name: "STD-2026", unsold_trigger_day: 120, election_window_days: 14 }
              as: GalleryManager
              as_user_id: "mgr-1"
              captures: { sched_id: $.data.id }
            - call: "POST /price-schedule-steps"
              payload: { schedule_id: "${sched_id}", sequence: 1, start_day_offset: 0, markdown_pct: 0.00, min_price_cents: 0 }
              as: GalleryManager
              as_user_id: "mgr-1"
            - call: "POST /consignors"
              payload: { display_name: "Alpha", email: "alpha@example.com", address_line: "1 A St", floor_number: 1, has_elevator: false }
              as: GalleryManager
              as_user_id: "mgr-1"
              captures: { cons_id: $.data.id }
            - call: "POST /consignment-agreements"
              payload: { consignor_id: "${cons_id}", price_schedule_id: "${sched_id}", term_days: 365 }
              as: GalleryManager
              as_user_id: "mgr-1"
              captures: { agr_id: $.data.id }
            - call: "POST /consignment-agreements/${agr_id}/activate"
              payload: {}
              as: GalleryManager
              as_user_id: "mgr-1"
            - call: "POST /consignment-items"
              payload: { agreement_id: "${agr_id}", title: "Teak dining table", category: "DINING", declared_value_cents: 40000, photo_count: 5, volume_cuft: 20, footprint_sqft: 15 }
              as: IntakeAppraiser
              as_user_id: "appraiser-1"
              captures: { item_id: $.data.id }
          trigger:
            - call: "POST /consignment-items/${item_id}/screen"
              payload: { decision: "ACCEPT", photo_surface_score: 8.0, photo_structure_score: 9.0, photo_completeness_score: 9.0 }
              as: IntakeAppraiser
              as_user_id: "appraiser-1"
          assert:
            - "HTTP 200 and data.photo_score == 8.55"
            - "data.provisional_condition_grade == \"A\" and data.condition_grade == \"A\""
            - "data.provisional_list_price_cents == 35700 and data.list_price_cents == 35700 and data.current_price_cents == 35700"
            - "data.markdown_sequence == 0, because the markdown clock only starts at placement"

      - name: the_photo_weights_round_half_up_across_the_c_grade_boundary
        claim_type: weighted_scoring
        grounds:
          - calculations.photo_screening_score
          - calculations.item_list_price
        distinguishing_aspect: "Sub-scores 5.0 / 4.5 / 3.58 make the exact weighted sum 0.45*5.0 + 0.30*4.5 + 0.25*3.58 == 4.495, which sits one half-cent below the C boundary of 4.50 and must round HALF_UP to 4.50 -> grade C. Truncation, HALF_DOWN, or any drift in the weight vector yields 4.49 -> grade D and a list price of 24000 instead of 33000, so the assert separates the rounding mode from the weights."
        test_recipe:
          setup:
            - "a STD-2026 schedule with one step, consignor Alpha, an ACTIVE agreement, and one CASEGOOD piece declared at 60000 (category factor exactly 1.00, so the grade factor is the only multiplier in play)"
            - "grade C requires photo_score >= 4.50 and grade D requires >= 3.00"
          setup_api_calls:
            - call: "POST /price-schedules"
              payload: { name: "STD-2026", unsold_trigger_day: 120, election_window_days: 14 }
              as: GalleryManager
              as_user_id: "mgr-1"
              captures: { sched_id: $.data.id }
