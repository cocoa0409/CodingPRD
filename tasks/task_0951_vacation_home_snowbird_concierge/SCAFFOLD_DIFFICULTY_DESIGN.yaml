          setup:
            - "One ELIGIBLE PLUMBING vendor rated 4.0 at 8500 cents per hour with MANAGED billing."
            - "Two APPROVED ROUTINE work orders on two TRIAGED PLUMBING findings of the same completed visit, each estimated at 2.0 hours and 5000 parts so each totals 25960 and auto-approves."
