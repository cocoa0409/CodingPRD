      - name: preliminary_and_final_bases_diverge_and_the_read_never_persists
        claim_type: Variant Selection
        grounds: "§1.3 spot_credit_settlement variants (PRELIMINARY when basis omitted or PRELIMINARY, FINAL on request and on the ON_AIR -> CLOSED transition); §1.5 GET /playlists/{id}/reconciliation input [basis?] side_effects 'computed and returned, not persisted'; §1.2 Playlist ON_AIR -> CLOSED sweep"
        distinguishing_aspect: "Three reads of the same graph return three different totals: the default (PRELIMINARY) basis returns 0 while both spots are still SCHEDULED, an explicit FINAL read on the same still-ON_AIR playlist returns 200000 because the two never-scheduled spots are credited in full, and the FINAL basis after the CLOSE sweep returns 400000 because the two swept spots have become NOT_AIRED. An implementation that persists the FINAL read, or that treats basis as cosmetic, produces one number for all three."
        test_recipe:
          setup: "Reference air graph at 11:59:00Z: ORD-2026-0001 has 4 ordered spots at 100000 cents each, exactly 2 of them placed as items 2 and 3 of the ON_AIR playlist."
          setup_api_calls: *air_chain_1159
          trigger:
            - call: "GET /playlists/${pl1_id}/reconciliation"
              as: TrafficCoordinator
              captures: { rc_default: "$.data.reconciliation_credit_cents" }
            - call: "GET /playlists/${pl1_id}/reconciliation"
              payload: { basis: FINAL }
              as: TrafficCoordinator
              captures: { rc_final_open: "$.data.reconciliation_credit_cents" }
            - call: "GET /spot-orders/${ord1_id}"
              as: TrafficCoordinator
            - *clk_1200
            - *cue1
            - *start1
            - *clk_1230
            - *end1
            - call: "POST /playlists/${pl1_id}/state"
              payload: { target_status: CLOSED }
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
            - call: "GET /playlists/${pl1_id}/reconciliation"
              payload: { basis: FINAL }
              as: TrafficCoordinator
              captures: { rc_final_closed: "$.data.reconciliation_credit_cents" }
            - call: "GET /spot-orders/${ord1_id}"
              as: TrafficCoordinator
          assert:
            - "${rc_default} == 0 — omitting basis selects PRELIMINARY, and items 2 and 3 are still SCHEDULED, hence PENDING, hence excluded from the credit"
            - "the pre-close GET /spot-orders read shows scheduled_spots 2, unplaced_spots 2, credited_spots 0, credit_accrued_cents 0 and status OPEN"
            - "${rc_final_open} == 200000 — the FINAL basis credits the 2 unplaced spots at round_half_up(400000/4) == 100000 each, but still excludes the 2 PENDING items"
            - "the FINAL read did NOT mutate anything: the immediately following GET /spot-orders still reports credit_accrued_cents 0 and status OPEN (the endpoint's side_effects say 'computed and returned, not persisted')"
            - "${rc_final_closed} == 400000 — the CLOSE sweep turned items 2..7 into SKIPPED, so the 2 placed spots are NOT_AIRED at 100000 each on top of the 200000 unplaced credit"
            - "after the CLOSE, SpotOrder.${ord1_id}.credit_accrued_cents == 400000, aired_spots 0, short_aired_spots 0, scheduled_spots 0, credited_spots 2, unplaced_spots 2 and status CLOSED_WITH_CREDIT"
            - "calculations.spot_inventory_conservation is satisfied exactly once: 4 == 0 + 0 + 0 + 2 + 2 — each unplaced spot is counted ONCE, in unplaced_spots, while its money still enters credit_accrued_cents through the FINAL unplaced_credit term"
            - "Playlist.${pl1_id}.reconciliation_credit_cents is persisted as 400000 by the CLOSED transition and equals the last FINAL read"
            - "item 1 (PROGRAM, no spot_order_id) never enters any counter — the input set is 'PlaylistItem rows whose spot_order_id equals the order' only"

      - name: notification_deadlines_use_two_different_epochs_and_the_due_boundary_is_on_time
        claim_type: Constants Applied
        grounds: "§1.3 regulatory_notification_deadline (due_utc = triggering_utc + NOTIFY_WINDOW_SECONDS for POWER_REDUCTION/RESUMPTION, = detection_utc + NOTIFY_WINDOW_SECONDS for OUTAGE; status_after_file = FILED if logical_now <= due_utc else LATE_FILED; NOTIFY_WINDOW_SECONDS 86400); §1.2 RegulatoryNotification PENDING -> OVERDUE on 'due_utc < logical_now'; §1.4 priority 23 and 42"
        distinguishing_aspect: "The OUTAGE row's triggering_utc is the outage start but its clock starts at the DETECTION instant, so an implementation that uses one epoch for all kinds puts the OUTAGE deadline 1800 seconds early. Filing at exactly due_utc is on time, and a clock landing exactly on due_utc does not flip the row to OVERDUE — one second later it does."
        test_recipe:
          setup: "One transmitter at full power on a clock at 2026-08-01T09:00:00Z."
          setup_api_calls:
            - *clk_t0
            - *op_eng
            - *tx1
          trigger:
            - call: "POST /transmitters/${tx1_id}/power-state"
              payload: { target_state: REDUCED_POWER, power_pct: 60 }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
            - call: "GET /transmitters/${tx1_id}/notifications"
              payload: { kind: POWER_REDUCTION }
              as: ComplianceOfficer
              captures: { n_pr_id: "$.data[0].id", n_pr_due: "$.data[0].due_utc" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T09:00:00Z" }
              as: StationAdmin
            - call: "GET /regulatory-notifications/${n_pr_id}"
              as: ComplianceOfficer
            - call: "POST /regulatory-notifications/${n_pr_id}/file"
              payload: { filed_reference: "FCC-PR-0001", narrative: "Power reduced to 60 pct for antenna work.", filed_utc: "2026-08-01T09:00:00Z" }
              as: ComplianceOfficer
              captures: { n_pr_filed: "$.data.filed_utc" }
            - call: "POST /regulatory-notifications/${n_pr_id}/file"
              payload: { filed_reference: "FCC-PR-0001-DUP", narrative: "Duplicate filing." }
              as: ComplianceOfficer
              captures: { refile_err: "$.data.error_id" }
            - call: "POST /transmitters/${tx1_id}/power-state"
              payload: { target_state: OFF_AIR, reason: "Antenna feedline failure" }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T09:30:00Z" }
              as: StationAdmin
            - call: "GET /transmitters/${tx1_id}/notifications"
              payload: { kind: OUTAGE }
              as: ComplianceOfficer
              captures: { n_out_id: "$.data[0].id", n_out_due: "$.data[0].due_utc", n_out_trig: "$.data[0].triggering_utc" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:30:01Z" }
              as: StationAdmin
            - call: "GET /regulatory-notifications/${n_out_id}"
              as: ComplianceOfficer
            - call: "POST /regulatory-notifications/${n_out_id}/file"
              payload: { filed_reference: "FCC-OUT-0001", narrative: "Filed after the window.", filed_utc: "2026-08-04T00:00:00Z" }
              as: ComplianceOfficer
              captures: { future_err: "$.data.error_id" }
            - call: "POST /regulatory-notifications/${n_out_id}/file"
              payload: { filed_reference: "FCC-OUT-0001", narrative: "Filed after the window." }
              as: ComplianceOfficer
              captures: { n_out_status: "$.data.status" }
            - call: "GET /transmitters/${tx1_id}"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
          assert:
            - "${n_pr_due} == 2026-08-02T09:00:00Z == triggering_utc 2026-08-01T09:00:00Z + NOTIFY_WINDOW_SECONDS 86400"
            - "the clock landing EXACTLY on due_utc leaves the row PENDING: checkpoint step (b) flips only rows with due_utc < logical_now"
            - "the on-time filing returns status FILED because the comparison is logical_now <= due_utc — equality is on time"
            - "${n_pr_filed} == 2026-08-02T09:00:00Z: filed_utc is written from the logical clock and the supplied 2026-08-01T09:00:00Z input value is ignored (RegulatoryNotification.filed_utc is source: system)"
            - "${refile_err} == ERR_NOTIFICATION_INVALID_STATE with HTTP 409 — FILED and LATE_FILED are terminal, so filings are not idempotent (priority 23)"
            - "${n_out_trig} == 2026-08-02T09:00:00Z (the outage start) but ${n_out_due} == 2026-08-03T09:30:00Z == DETECTION instant 2026-08-02T09:30:00Z + 86400 — the OUTAGE kind uses the detection epoch, so the deadline is 1800 seconds LATER than triggering_utc + 86400"
            - "the OUTAGE row is created by checkpoint step (a) at exactly OUTAGE_NOTIFY_AFTER_SECONDS 1800 of OFF_AIR time, and outage_seconds == 1800"
            - "one second past due_utc the checkpoint flips the row PENDING -> OVERDUE (version incremented) — no background job does this, only POST /_clock/set_current_utc"
            - "${future_err} == ERR_EVENT_TIMESTAMP_IN_FUTURE with HTTP 409: priority 42 rejects a filed_utc beyond the logical clock even though filing an OVERDUE row is otherwise legal"
            - "${n_out_status} == LATE_FILED with filed_utc == 2026-08-03T09:30:01Z — OVERDUE -> LATE_FILED records the missed window and is terminal"
            - "Transmitter.${tx1_id}.notification_pending_count is 1 after the POWER_REDUCTION row is raised, 0 once it is FILED, 1 again while the OUTAGE row is PENDING or OVERDUE, and 0 after the LATE_FILED filing — the counter spans {PENDING, OVERDUE} only"
            - "§1.2 also declares a direct PENDING -> LATE_FILED edge so the filing endpoint decides lateness itself and does not depend on the checkpoint having run"

      - name: air_check_variant_adds_a_capped_fault_penalty_and_never_moves_the_asset
        claim_type: Variant Divergence
        grounds: "§1.3 asset_technical_score variants (INGEST forces fault_penalty 0 and drives RECEIVED -> QC_PASSED/QC_FAILED; AIR_CHECK adds min(FAULT_PENALTY_CAP 40, sum(FAULT_POINTS)) over RESOLVED faults linked to items in {PLAYED, TRUNCATED} and 'never changes Asset.status'); §1.4 priority 20 (AIR_CHECK requires status QC_PASSED or QC_WAIVED)"
        distinguishing_aspect: "The same asset with an empty defect list and a perfect duration scores 100 on INGEST and 60 on AIR_CHECK. The fault sum is 45 but the cap clamps it to 40; a fault left MITIGATED and a RESOLVED fault attached to an item of the SAME asset that never aired are both excluded. The AIR_CHECK verdict is FAIL and the asset stays QC_PASSED, so an implementation that reuses the INGEST status branch demotes a perfectly airable asset."
        test_recipe:
          setup: "Reference air graph with item 1 (asset HN-PROG-01) PLAYED at its full 1800 seconds and item 7 (the SAME asset) still SCHEDULED; the asset's INGEST report scored 100."
          setup_api_calls: *air_chain_1159
          trigger:
            - *clk_1200
            - *cue1
            - *start1
            - *clk_1230
            - *end1
            - call: "POST /technical-faults"
              payload: { fault_code: AUDIO_LOSS, severity: MINOR, detected_utc: "2026-08-01T12:30:00Z", channel_id: "${ch1_id}", playlist_item_id: "${it1_id}", notes: "Left channel dropout during the program." }
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              captures: { f_al_id: "$.data.id", f_al_sev: "$.data.severity" }
            - call: "POST /technical-faults"
              payload: { fault_code: CAPTION_LOSS, severity: CRITICAL, detected_utc: "2026-08-01T12:30:00Z", channel_id: "${ch1_id}", playlist_item_id: "${it1_id}", notes: "Caption service dropped." }
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              captures: { f_cl_id: "$.data.id", f_cl_sev: "$.data.severity" }
            - call: "POST /technical-faults"
              payload: { fault_code: AUTOMATION_STALL, severity: MINOR, detected_utc: "2026-08-01T12:30:00Z", channel_id: "${ch1_id}", playlist_item_id: "${it1_id}", notes: "Automation list stalled once." }
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              captures: { f_as_id: "$.data.id" }
            - call: "POST /technical-faults"
              payload: { fault_code: BLACK_FRAME, severity: MAJOR, detected_utc: "2026-08-01T12:30:00Z", channel_id: "${ch1_id}", playlist_item_id: "${it7_id}", notes: "Black frames on the element that has not aired yet." }
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              captures: { f_bf_id: "$.data.id" }
            - call: "POST /technical-faults/${f_al_id}/state"
              payload: { target_state: ACKNOWLEDGED }
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
            - call: "POST /technical-faults/${f_al_id}/state"
              payload: { target_state: MITIGATED, mitigation_code: "AUDIO_PATH_REPATCHED" }
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
            - call: "POST /technical-faults/${f_al_id}/state"
              payload: { target_state: RESOLVED, cleared_utc: "2026-08-01T12:30:00Z" }
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
            - call: "POST /technical-faults/${f_cl_id}/state"
              payload: { target_state: ACKNOWLEDGED }
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
            - call: "POST /technical-faults/${f_cl_id}/state"
              payload: { target_state: MITIGATED, mitigation_code: "CAPTION_ENCODER_RESET" }
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
            - call: "POST /technical-faults/${f_cl_id}/state"
              payload: { target_state: RESOLVED, cleared_utc: "2026-08-01T12:30:00Z" }
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
            - call: "POST /technical-faults/${f_as_id}/state"
              payload: { target_state: ACKNOWLEDGED }
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
            - call: "POST /technical-faults/${f_as_id}/state"
              payload: { target_state: MITIGATED, mitigation_code: "LIST_RELOADED" }
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
            - call: "POST /technical-faults/${f_bf_id}/state"
              payload: { target_state: ACKNOWLEDGED }
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
            - call: "POST /technical-faults/${f_bf_id}/state"
              payload: { target_state: MITIGATED, mitigation_code: "VIDEO_SERVER_RESTART" }
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
            - call: "POST /technical-faults/${f_bf_id}/state"
              payload: { target_state: RESOLVED, cleared_utc: "2026-08-01T12:30:00Z" }
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
            - call: "GET /assets/${aprog_id}"
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              captures: { aprog_v3: "$.data.version" }
            - call: "POST /assets/${aprog_id}/qc-reports"
              payload: { expected_asset_version: "${aprog_v3}", inspected_by_operator_id: "${op_qc_id}", basis: AIR_CHECK, defect_codes: [], measured_duration_seconds: 1800 }
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              captures: { q_air_id: "$.data.id", q_air_score: "$.data.technical_score" }
            - call: "GET /assets/${aprog_id}"
              as: QCTechnician
              as_user_id: "${op_qc_id}"
            - call: "GET /technical-faults"
              payload: { playlist_item_id: "${it1_id}" }
              as: QCTechnician
              as_user_id: "${op_qc_id}"
          assert:
            - "${f_al_sev} == MAJOR and ${f_cl_sev} == MINOR — severity is COMPUTED from FAULT_SEVERITY {AUDIO_LOSS: MAJOR, CAPTION_LOSS: MINOR} and the supplied severity input (MINOR, CRITICAL) is ignored"
            - "${q_air_score} == 60 == 100 - min(FAULT_PENALTY_CAP 40, AUDIO_LOSS 25 + CAPTION_LOSS 20 == 45) — the cap bites, so 55 is the wrong answer"
            - "QCReport.${q_air_id}.fault_penalty_points == 40 and defect_penalty 0 and duration_penalty 0 (measured 1800 == expected) and loudness_penalty 0"
            - "the AUTOMATION_STALL fault (8 points) is excluded: it stopped at MITIGATED and the linkage set is state == RESOLVED only"
            - "the BLACK_FRAME fault (18 points) is excluded even though it is RESOLVED and attached to an item of the SAME asset, because item 7 is still SCHEDULED and the linkage requires playout_status IN {PLAYED, TRUNCATED}"
            - "QCReport.${q_air_id}.verdict == FAIL (60 < PASS_WITH_EXCEPTION_MIN 70)"
            - "Asset.${aprog_id}.status is STILL QC_PASSED after the failing AIR_CHECK report — the AIR_CHECK variant never touches Asset.status"
            - "Asset.${aprog_id}.technical_score_aircheck == 60 while technical_score_ingest is unchanged at 100 — the two bases write different columns"
            - "the INGEST report ${qc_prog_id} is NOT superseded by an AIR_CHECK report: superseding is per basis (§1.3 input_set)"
            - "GET /technical-faults?playlist_item_id=${it1_id} returns total_count 3 and every row carries duration_seconds computed on clear (0 here, since detection and clearing share the logical instant 12:30:00Z)"
            - "an AIR_CHECK report on an asset whose status is RECEIVED or QC_FAILED is refused by priority 20 with ERR_ASSET_INVALID_STATE (409) — AIR_CHECK presupposes QC_PASSED or QC_WAIVED"

      - name: makegood_round_trip_reverses_the_rounded_credit_exactly_with_no_drift
        claim_type: Reconciliation
        grounds: "§1.3 spot_inventory_conservation (INVARIANT_SPOTS and the F / F' compensating-action form: 'credit_accrued_cents returns to EXACTLY its pre-F value ... no rounding drift accrues across any number of preempt/makegood cycles'); §1.2 SpotOrder PARTIALLY_CREDITED -> OPEN; §1.5 POST /spot-orders/{id}/makegoods; §1.4 priority 24"
        distinguishing_aspect: "per_spot_rate_cents is 1000.5, so the accrual adds round_half_up(1000.5) == 1001 and the makegood must subtract the SAME rounded 1001 rather than the exact rational — two cycles therefore return the order to exactly 0 cents rather than leaving 1 or 2 cents of drift. The skipped spot is the LAST item of the timeline, so the compensating placement re-establishes contiguity instead of a hole, and the placement at exactly makegood_deadline_utc is allowed while one second later it is not."
        test_recipe:
          setup: "Channel 12.2 with a 2-spot order at 100-second units for 2001 cents and a two-element playlist whose trailing element is that order's only placed spot; the playlist is ON_AIR from its preroll boundary 13:55:00Z."
          setup_api_calls:
            - *clk_t0
            - *op_eng
            - *tx1
            - *mux1
            - *ch1
            - *mux1_read_v2
            - *ch2
            - *op_mco
            - *op_qc
            - *as_prog
            - *dl_prog
            - *qc_prog
            - *as_spot
            - *dl_spot
            - *qc_spot
            - call: "POST /spot-orders"
              payload: { channel_id: "${ch2_id}", advertiser_name: "Nordkapp Rail", order_reference: "ORD-2026-0006", ordered_spots: 2, unit_duration_seconds: 100, rate_cents_total: 2001, daypart: DAYTIME, priority_class: PREEMPTIBLE, makegood_deadline_utc: "2026-08-01T14:10:00Z" }
              as: TrafficCoordinator
              captures: { ord6_id: "$.data.id" }
            - call: "POST /playlists"
              payload:
                channel_id: "${ch2_id}"
                broadcast_day: "2026-08-01"
                schedule_start_utc: "2026-08-01T14:00:00Z"
                window_duration_seconds: 200
                items:
                  - { sequence_number: 1, element_kind: PROGRAM, asset_id: "${aprog_id}", scheduled_start_utc: "2026-08-01T14:00:00Z", scheduled_duration_seconds: 100, max_trim_seconds: 0 }
                  - { sequence_number: 2, element_kind: COMMERCIAL, asset_id: "${aspot_id}", spot_order_id: "${ord6_id}", scheduled_start_utc: "2026-08-01T14:01:40Z", scheduled_duration_seconds: 100, max_trim_seconds: 0 }
              as: TrafficCoordinator
              captures: { plmg_id: "$.data.id" }
            - call: "POST /playlists/${plmg_id}/state"
              payload: { target_status: VALIDATED }
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
            - *ch2_onair
            - call: "POST /playlists/${plmg_id}/state"
              payload: { target_status: ARMED }
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T13:55:00Z" }
              as: StationAdmin
            - call: "POST /playlists/${plmg_id}/state"
              payload: { target_status: ON_AIR }
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
            - call: "GET /playlists/${plmg_id}/items"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              captures: { g1_id: "$.data[0].id", g2_id: "$.data[1].id" }
          trigger:
            - call: "GET /spot-orders/${ord6_id}"
              as: TrafficCoordinator
              captures: { pre_f_credit: "$.data.credit_accrued_cents" }
            - call: "POST /playlist-items/${g2_id}/playout-events"
              payload: { event_kind: SKIP, event_utc: "2026-08-01T13:55:00Z" }
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
            - call: "GET /spot-orders/${ord6_id}"
              as: TrafficCoordinator
              captures: { post_f_credit: "$.data.credit_accrued_cents" }
            - call: "GET /playlists/${plmg_id}"
              as: TrafficCoordinator
              captures: { plmg_v2: "$.data.version" }
            - call: "POST /spot-orders/${ord6_id}/makegoods"
              payload: { target_playlist_id: "${plmg_id}", expected_playlist_version: "${plmg_v2}", sequence_number: 3, scheduled_start_utc: "2026-08-01T14:01:40Z", scheduled_duration_seconds: 100 }
              as: TrafficCoordinator
              captures: { mg1_id: "$.data.id", mg1_flag: "$.data.is_makegood", mg1_replaces: "$.data.replaces_item_id" }
            - call: "GET /spot-orders/${ord6_id}"
              as: TrafficCoordinator
              captures: { post_fprime_credit: "$.data.credit_accrued_cents", post_fprime_status: "$.data.status" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T14:10:00Z" }
              as: StationAdmin
            - call: "POST /playlist-items/${mg1_id}/playout-events"
              payload: { event_kind: SKIP, event_utc: "2026-08-01T14:10:00Z" }
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
            - call: "GET /playlists/${plmg_id}"
              as: TrafficCoordinator
              captures: { plmg_v3: "$.data.version" }
            - call: "POST /spot-orders/${ord6_id}/makegoods"
              payload: { target_playlist_id: "${plmg_id}", expected_playlist_version: "${plmg_v3}", sequence_number: 4, scheduled_start_utc: "2026-08-01T14:01:40Z", scheduled_duration_seconds: 100 }
              as: TrafficCoordinator
              captures: { mg2_id: "$.data.id" }
            - call: "GET /spot-orders/${ord6_id}"
              as: TrafficCoordinator
              captures: { cycle2_credit: "$.data.credit_accrued_cents" }
            - call: "GET /playlists/${plmg_id}"
              as: TrafficCoordinator
              captures: { plmg_v4: "$.data.version" }
            - call: "POST /spot-orders/${ord6_id}/makegoods"
              payload: { target_playlist_id: "${plmg_id}", expected_playlist_version: "${plmg_v4}", sequence_number: 5, scheduled_start_utc: "2026-08-01T14:03:20Z", scheduled_duration_seconds: 100 }
              as: TrafficCoordinator
              captures: { no_credit_err: "$.data.error_id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T14:10:01Z" }
              as: StationAdmin
            - call: "POST /playlist-items/${mg2_id}/playout-events"
              payload: { event_kind: SKIP, event_utc: "2026-08-01T14:10:01Z" }
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
            - call: "GET /playlists/${plmg_id}"
              as: TrafficCoordinator
              captures: { plmg_v5: "$.data.version" }
            - call: "POST /spot-orders/${ord6_id}/makegoods"
              payload: { target_playlist_id: "${plmg_id}", expected_playlist_version: "${plmg_v5}", sequence_number: 5, scheduled_start_utc: "2026-08-01T14:01:40Z", scheduled_duration_seconds: 100 }
              as: TrafficCoordinator
              captures: { deadline_err: "$.data.error_id" }
          assert:
            - "per_spot_rate_cents == 2001/2 == 1000.5 and round_half_up(1000.5) == 1001"
            - "${pre_f_credit} == 0 with scheduled_spots 1, credited_spots 0, unplaced_spots 1 and status OPEN — INVARIANT_SPOTS: 2 == 1 + 0 + 0 + 0 + 1"
            - "F (the SKIP) accrues the FULL per-spot credit: ${post_f_credit} == 1001, credited_spots 1, scheduled_spots 0, status PARTIALLY_CREDITED, and one AsRunEntry(event_kind=SKIP) is appended — INVARIANT_SPOTS: 2 == 0 + 0 + 0 + 1 + 1"
            - "the SKIP does not break playlist_timeline_integrity: SKIPPED items are removed before the contiguity walk and the skipped element was the LAST one, so the remaining timeline is item 1 alone, 14:00:00 -> 14:01:40"
            - "${mg1_flag} == true, ${mg1_replaces} == ${g2_id}, element_kind == COMMERCIAL, playout_status == SCHEDULED and spot_order_id == ${ord6_id} — the makegood is a NEW item that points at the credited one"
            - "sequence_number 3 keeps the dense 1..N run intact (priority 56) and the new item starts exactly where item 1 ends, so the walk sees no gap and no overlap"
            - "${post_fprime_credit} == 0 EXACTLY — F' subtracts the same rounded 1001, not the 1000.5 rational; ${post_fprime_status} == OPEN because no credit remains"
            - "after F': credited_spots 0, scheduled_spots 1, unplaced_spots 1 — the replaced item drops out of the ledger, which is the only reading that keeps INVARIANT_SPOTS at 2 == 1 + 0 + 0 + 0 + 1"
            - "${cycle2_credit} == 0 after the SECOND full cycle — accumulated drift after two round trips is exactly 0 cents, which a per-cycle floor() or a re-derivation from the exact rational would not achieve"
            - "the second placement is made at logical_now == makegood_deadline_utc 2026-08-01T14:10:00Z and is PERMITTED (the guard is logical_now <= deadline)"
            - "${no_credit_err} == ERR_NO_CREDITED_SPOT_TO_MAKEGOOD (409): with credited_spots back at 0 there is nothing to compensate, and the attempt also would have left a timeline gap"
            - "${deadline_err} == ERR_MAKEGOOD_DEADLINE_PASSED (409) one second past the deadline, even though credited_spots is 1 again — the deadline guard is evaluated on the logical clock, not on wall time"
            - "commercial_inventory_by_hour is recomputed on every placement and the skipped predecessors are excluded, so hour '0' never double-counts the compensating spot"
            - "priority 24 additionally blocks placements on a FULLY_AIRED or CLOSED_WITH_CREDIT order with ERR_ORDER_FULLY_SETTLED"

  # ===========================================================================
  - section: validations
    instances:

      - name: auth_ladder_1_to_7_is_evaluated_in_priority_order
        claim_type: Priority Ordering
        grounds: "§1.4 priorities 1-7 (ERR_MISSING_AUTH_HEADERS 401, ERR_UNKNOWN_ROLE 401, ERR_OPERATOR_NOT_FOUND 401, ERR_ROLE_IDENTITY_MISMATCH 403, ERR_ROLE_NOT_PERMITTED 403, ERR_OPERATOR_SUSPENDED 403 'PRIORITY PAIR (a)', ERR_OPERATOR_CERTIFICATION_EXPIRED 403 with the inclusive expiry boundary); §1.7 entity_backed vs opaque roles"
        distinguishing_aspect: "Seven rules all guard the same call and each pair is separated by one deliberate mutation: a real QC operator claiming MasterControlOperator gets the IDENTITY mismatch (4) rather than the authorization denial (5); a suspended operator whose certification also lapsed gets SUSPENDED (6), not EXPIRED (7); and the same suspended operator can still issue GETs. Certification expiring exactly at the logical clock is still VALID, one second later it is not."
        test_recipe:
          setup: "Four operators (engineer, MCO, QC, plus an MCO whose certification expires exactly at 2026-08-01T09:00:00Z and an MCO who is suspended with a lapsed certification), one transmitter, one multiplex and channel 12.1."
          setup_api_calls:
            - *clk_t0
            - *op_eng
            - *op_mco
            - *op_qc
            - *tx1
            - *mux1
            - *ch1
            - call: "POST /operators"
              payload: { full_name: "Ivar Boundary", role_class: MASTER_CONTROL, override_authority: NONE, certification_expires_utc: "2026-08-01T09:00:00Z" }
              as: StationAdmin
              captures: { op_exp_id: "$.data.id", op_exp_state: "$.data.certification_state" }
            - call: "POST /operators"
              payload: { full_name: "Sonja Suspended", role_class: MASTER_CONTROL, override_authority: NONE, certification_expires_utc: "2026-12-31T00:00:00Z" }
              as: StationAdmin
              captures: { op_sus_id: "$.data.id" }
            - call: "POST /operators/${op_sus_id}/status"
              payload: { status: SUSPENDED, certification_expires_utc: "2026-07-01T00:00:00Z" }
              as: StationAdmin
              captures: { op_sus_status: "$.data.status" }
          trigger:
            - call: "POST /channels/${ch1_id}/air-state"
              payload: { target_air_status: STANDBY }
              as: MasterControlOperator
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { e_nf: "$.data.error_id" }
            - call: "POST /channels/${ch1_id}/air-state"
              payload: { target_air_status: STANDBY }
              as: MasterControlOperator
              as_user_id: "${op_qc_id}"
              captures: { e_mismatch: "$.data.error_id" }
            - call: "POST /channels/${ch1_id}/air-state"
              payload: { target_air_status: STANDBY }
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              captures: { e_denied: "$.data.error_id" }
            - call: "POST /channels/${ch1_id}/air-state"
              payload: { target_air_status: EAS_OVERRIDE }
              as: MasterControlOperator
              as_user_id: "${op_sus_id}"
              captures: { e_susp: "$.data.error_id" }
            - call: "GET /channels/${ch1_id}"
              as: MasterControlOperator
              as_user_id: "${op_sus_id}"
              captures: { sus_read_posture: "$.data.posture" }
            - call: "POST /channels/${ch1_id}/air-state"
              payload: { target_air_status: STANDBY }
              as: MasterControlOperator
              as_user_id: "${op_exp_id}"
              captures: { air_after_boundary: "$.data.air_status" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:01Z" }
              as: StationAdmin
            - call: "POST /channels/${ch1_id}/air-state"
              payload: { target_air_status: ON_AIR }
              as: MasterControlOperator
              as_user_id: "${op_exp_id}"
              captures: { e_expired: "$.data.error_id" }
            - call: "GET /operators/${op_exp_id}"
              as: StationAdmin
              captures: { op_exp_state2: "$.data.certification_state" }
            - call: "GET /channels/${ch1_id}"
              as: MasterControlOperator
              as_user_id: "${op_exp_id}"
          assert:
            - "a request with no X-User-Id or an empty X-User-Role returns ERR_MISSING_AUTH_HEADERS (401) BEFORE any body parsing, so a body that also omits required fields never reaches priority 8 (rule 1 applies to GETs too)"
            - "X-User-Role: masterControlOperator (wrong case) returns ERR_UNKNOWN_ROLE (401) — matching is case-sensitive against the seven §1.7 names"
            - "${e_nf} == ERR_OPERATOR_NOT_FOUND with HTTP 401: an entity_backed role must resolve to an Operator row; the same unknown id under TrafficCoordinator, ComplianceOfficer or StationAdmin skips rule 3 entirely"
            - "${e_mismatch} == ERR_ROLE_IDENTITY_MISMATCH with HTTP 403 — the QC operator exists but claims MasterControlOperator, and this is decided at priority 4, BEFORE the endpoint's roles list is consulted"
            - "${e_denied} == ERR_ROLE_NOT_PERMITTED with HTTP 403: QCTechnician is not in the air-state roles list, and this fires only once identity is consistent"
            - "${op_sus_status} == SUSPENDED and ${e_susp} == ERR_OPERATOR_SUSPENDED (403) — PRIORITY PAIR (a): the target_air_status EAS_OVERRIDE is also unreachable (priority 15) and the operator's certification also lapsed (priority 7), yet 6 wins over both"
            - "${sus_read_posture} is returned normally: rule 6 applies to POST/PATCH only, so a suspended operator retains read access"
            - "${op_exp_state} == VALID at creation and ${air_after_boundary} == STANDBY: with logical_now EXACTLY equal to certification_expires_utc the mutation is allowed (the guard is logical_now <= expiry)"
            - "${e_expired} == ERR_OPERATOR_CERTIFICATION_EXPIRED (403) one second later, and ${op_exp_state2} == EXPIRED — the re-derivation happens on the clock checkpoint, step (e)"
            - "the final GET /channels/${ch1_id} with the expired operator still succeeds: rule 7 is enforced on the listed air-critical mutations only, never on GETs"
            - "every error response carries the standard envelope: meta.api_request_id, meta.api_request_timestamp, response_type object and data.error_id / data.message"

      - name: field_shape_then_existence_then_occ_then_state_ladder
        claim_type: Priority Ordering
        grounds: "§1.4 priorities 8-13 (ERR_MISSING_REQUIRED_FIELD 422, ERR_INVALID_ENUM_VALUE 422, ERR_INVALID_FIELD_VALUE 422, path existence 404, body-FK existence 404 'checked AFTER path existence and BEFORE optimistic concurrency', ERR_STALE_*_VERSION 412 'PRIORITY PAIR (d)')"
        distinguishing_aspect: "Each request violates two rules at once and must report the lower-numbered one: missing field beats bad enum, bad enum beats out-of-range value, out-of-range value beats an unknown body FK, an unknown path id beats an unknown body FK, an unknown body FK beats a stale version, and a stale version beats the 409 state error. An implementation that validates FKs before field shape, or state before OCC, reports the wrong code on five of the six."
        test_recipe:
          setup: "Transmitter, MUX-A, channel 12.1 and asset HN-PROG-01 delivered and INGEST-graded (so its version has advanced past ${aprog_v2} and its status is QC_PASSED, which is invalid for a second INGEST report)."
          setup_api_calls:
            - *clk_t0
            - *op_eng
            - *op_qc
            - *tx1
            - *mux1
            - *ch1
            - *mux1_read_v2
            - *as_prog
            - *dl_prog
            - *qc_prog
          trigger:
            - call: "POST /channels"
              payload: { multiplex_id: "${mux1_id}", expected_multiplex_version: "${mux1_v2}", call_sign: "WXYZ-DT9", service_class: NOT_A_CLASS, resolution_class: HD_720P, requested_bitrate_kbps: 6000, floor_bitrate_kbps: 5000, priority_rank: 9 }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { e_missing: "$.data.error_id" }
            - call: "POST /channels"
              payload: { multiplex_id: "${mux1_id}", expected_multiplex_version: "${mux1_v2}", call_sign: "WXYZ-DT9", channel_number: "12.9", service_class: primary, resolution_class: HD_720P, requested_bitrate_kbps: -6000, floor_bitrate_kbps: 5000, priority_rank: 9 }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { e_enum: "$.data.error_id" }
            - call: "POST /channels"
              payload: { multiplex_id: "00000000-0000-0000-0000-000000000000", expected_multiplex_version: "${mux1_v2}", call_sign: "WXYZ-DT9", channel_number: "12.9", service_class: PRIMARY, resolution_class: HD_720P, requested_bitrate_kbps: -6000, floor_bitrate_kbps: 5000, priority_rank: 9 }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { e_range: "$.data.error_id" }
            - call: "POST /assets/00000000-0000-0000-0000-000000000000/qc-reports"
              payload: { expected_asset_version: "${aprog_v2}", inspected_by_operator_id: "00000000-0000-0000-0000-000000000000", basis: INGEST, defect_codes: [], measured_duration_seconds: 1800 }
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              captures: { e_path404: "$.data.error_id" }
            - call: "POST /assets/${aprog_id}/qc-reports"
              payload: { expected_asset_version: "${aprog_v2}", inspected_by_operator_id: "00000000-0000-0000-0000-000000000000", basis: INGEST, defect_codes: [], measured_duration_seconds: 1800 }
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              captures: { e_fk404: "$.data.error_id" }
            - call: "POST /assets/${aprog_id}/qc-reports"
              payload: { expected_asset_version: "${aprog_v2}", inspected_by_operator_id: "${op_qc_id}", basis: INGEST, defect_codes: [], measured_duration_seconds: 1800 }
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              captures: { e_stale: "$.data.error_id" }
            - call: "GET /assets/${aprog_id}"
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              captures: { aprog_v3b: "$.data.version" }
            - call: "POST /assets/${aprog_id}/qc-reports"
              payload: { expected_asset_version: "${aprog_v3b}", inspected_by_operator_id: "${op_qc_id}", basis: INGEST, defect_codes: [], measured_duration_seconds: 1800 }
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              captures: { e_state: "$.data.error_id" }
          assert:
            - "${e_missing} == ERR_MISSING_REQUIRED_FIELD (422): channel_number is absent AND service_class is not a declared literal — priority 8 beats priority 9"
            - "${e_enum} == ERR_INVALID_ENUM_VALUE (422): 'primary' is the right word in the wrong case and requested_bitrate_kbps is negative — priority 9 beats priority 10, and enum matching is case-sensitive"
            - "${e_range} == ERR_INVALID_FIELD_VALUE (422): the negative bitrate is reported even though multiplex_id resolves to nothing — priority 10 beats the body-FK 404 at priority 12"
            - "${e_path404} == ERR_ASSET_NOT_FOUND (404): the unknown path id wins over the unknown inspected_by_operator_id in the body — path existence (11) is checked left to right before body FKs (12)"
            - "${e_fk404} == ERR_OPERATOR_REFERENCE_NOT_FOUND (404) once the path resolves: the body FK error is reported even though expected_asset_version ${aprog_v2} is already stale — 12 beats 13"
            - "${e_stale} == ERR_STALE_ASSET_VERSION with HTTP 412 once the FKs resolve: the INGEST report against a QC_PASSED asset is ALSO a state violation (priority 16, 409) but PRIORITY PAIR (d) makes the 412 win"
            - "${e_state} == ERR_ASSET_INVALID_STATE (409) only when the version is current — this is the last rung of the ladder and proves the earlier codes were not coincidental"
            - "no partial write happens on any of the seven rejections: Asset.${aprog_id}.version, status and technical_score_ingest are unchanged and no QCReport row is created"
            - "each response uses exactly the declared HTTP status: 422 for 8-10, 404 for 11-12, 412 for 13, 409 for 14-24"

      - name: every_state_rule_14_to_24_rejects_its_own_undeclared_move_with_409
        claim_type: Violation → Error
        grounds: "§1.4 priorities 14-24 (ERR_TRANSMITTER_INVALID_STATE, ERR_CHANNEL_INVALID_AIR_STATE, ERR_ASSET_INVALID_STATE, ERR_PLAYLIST_INVALID_STATE, ERR_ITEM_INVALID_PLAYOUT_STATE twice, ERR_FEED_WINDOW_INVALID_STATE, ERR_OVERRIDE_INVALID_STATE, ERR_FAULT_INVALID_STATE, ERR_NOTIFICATION_INVALID_STATE, ERR_ORDER_FULLY_SETTLED), all 409"
        distinguishing_aspect: "Each of the eleven state rules owns one endpoint, and the reflexive move that an implementation is most likely to treat as a no-op (FULL_POWER -> FULL_POWER, a second CUE, a second file) is explicitly undeclared. Two different rules (18 and 19) share one error id, so the id alone does not identify the guard."
        test_recipe:
          setup: "Reference air graph at 12:00:00Z with item 1 CUED; transmitter at FULL_POWER, channel 12.1 ON_AIR, playlist ON_AIR, asset HN-PROG-01 QC_PASSED."
          setup_api_calls: *air_chain_1159
          trigger:
            - *clk_1200
            - *cue1
            - call: "POST /transmitters/${tx1_id}/power-state"
              payload: { target_state: FULL_POWER }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { e_tx: "$.data.error_id" }
            - call: "POST /channels/${ch1_id}/air-state"
              payload: { target_air_status: EAS_OVERRIDE }
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              captures: { e_air: "$.data.error_id" }
            - call: "POST /assets/${aprog_id}/qc-waivers"
              payload: { waived_by_operator_id: "${op_pd_id}", waiver_justification: "Program director cleared this asset." }
              as: ProgramDirector
              as_user_id: "${op_pd_id}"
              captures: { e_asset: "$.data.error_id" }
            - call: "POST /playlists/${pl1_id}/state"
              payload: { target_status: ARMED }
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              captures: { e_pl: "$.data.error_id" }
            - call: "POST /playlist-items/${it3_id}/playout-events"
              payload: { event_kind: END, event_utc: "2026-08-01T12:00:00Z", measured_duration_seconds: 30, source: AUTOMATION }
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              captures: { e_item_end: "$.data.error_id" }
            - call: "POST /playlist-items/${it2_id}/playout-events"
              payload: { event_kind: CUE, event_utc: "2026-08-01T12:00:00Z" }
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              captures: { e_item_cue: "$.data.error_id" }
            - call: "POST /technical-faults"
              payload: { fault_code: AUTOMATION_STALL, severity: MINOR, detected_utc: "2026-08-01T12:00:00Z", channel_id: "${ch1_id}" }
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              captures: { f_v3_id: "$.data.id" }
            - call: "POST /technical-faults/${f_v3_id}/state"
              payload: { target_state: MITIGATED, mitigation_code: "LIST_RELOADED" }
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              captures: { e_fault: "$.data.error_id" }
          assert:
            - "${e_tx} == ERR_TRANSMITTER_INVALID_STATE (409): FULL_POWER -> FULL_POWER is not a declared transition, while REDUCED_POWER -> REDUCED_POWER is (a re-derate) — the reflexive edge is legal for exactly one of the two"
            - "${e_air} == ERR_CHANNEL_INVALID_AIR_STATE (409): EAS_OVERRIDE is reachable only through the override cascade and never through the air-state endpoint"
            - "${e_asset} == ERR_ASSET_INVALID_STATE (409): qc-waivers requires QC_FAILED and the asset is QC_PASSED — note the justification here is 35 characters, so the 422 at priority 34 is not what surfaces"
            - "${e_pl} == ERR_PLAYLIST_INVALID_STATE (409): ON_AIR -> ARMED does not exist; the only edge out of ON_AIR is CLOSED"
            - "${e_item_end} == ERR_ITEM_INVALID_PLAYOUT_STATE (409) from rule 18: an END event needs a PLAYING item and item 3 is SCHEDULED"
            - "${e_item_cue} == ERR_ITEM_INVALID_PLAYOUT_STATE (409) from rule 19: item 1 is already CUED and only one item of a playlist may be CUED at a time — the SAME error id as rule 18, so tests must distinguish the two by scenario, not by code"
            - "${e_fault} == ERR_FAULT_INVALID_STATE (409): DETECTED -> MITIGATED is not an edge; the fault must be ACKNOWLEDGED first, even though the mitigation_code is supplied"
            - "ERR_FEED_WINDOW_INVALID_STATE (20) is reachable by joining an already JOINED or BROKEN_AWAY window; ERR_OVERRIDE_INVALID_STATE (21) by activating an ACTIVE_CRAWL override or releasing a PENDING one; ERR_NOTIFICATION_INVALID_STATE (23) by re-filing a FILED row; ERR_ORDER_FULLY_SETTLED (24) by placing a makegood on a CLOSED_WITH_CREDIT order"
            - "all eleven rules return HTTP 409 and no row is mutated: every entity's version is unchanged after each rejection"

      - name: waiver_safety_ladder_28_32_33_34_and_the_two_inclusive_boundaries
        claim_type: Priority Ordering
        grounds: "§1.4 priorities 28 (ERR_SELF_AUTHORIZATION_FORBIDDEN 409), 32 (ERR_CAPTION_REQUIREMENT_UNMET 409, 'outranks the score threshold at 33'), 33 (ERR_QC_WAIVER_SCORE_TOO_LOW 409, 'exactly 40 is waivable; 39 is not'), 34 (ERR_WAIVER_JUSTIFICATION_REQUIRED 422, 'exactly 20 characters is accepted, 19 is not'); §1.5 POST /assets/{id}/qc-waivers roles [ProgramDirector, StationAdmin]"
        distinguishing_aspect: "One endpoint, four stacked guards, and every attempt violates at least two of them so the winner is decided purely by priority: a missing caption track outranks a low score, a self-authorization outranks both, and the 19-character justification only surfaces once everything above it is clean. The score pair 39/40 and the length pair 19/20 pin both inclusive boundaries in the same instance."
        test_recipe:
          setup: "Three QC_FAILED assets: one with captions_required true and no caption track (score 80), one scoring 39, one scoring exactly 40. All three were inspected by the SAME QC operator."
          setup_api_calls:
            - *clk_t0
            - *op_qc
            - *op_pd
            - call: "POST /assets"
              payload: { house_number: "HN-W-CAP", title: "No Caption Track", source: FILE_DELIVERY, expected_duration_seconds: 1800, delivery_deadline_utc: "2026-08-01T10:00:00Z", required_resolution_class: HD_1080I, captions_required: true }
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              captures: { w1_id: "$.data.id" }
            - call: "POST /assets/${w1_id}/delivery"
              payload: { received_utc: "2026-08-01T09:00:00Z", measured_duration_seconds: 1800, video_codec: H264, delivered_resolution_class: HD_1080I, frame_rate: 29.97, audio_loudness_lkfs: -24.0, audio_channel_config: STEREO_2_0, caption_present: false }
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              captures: { w1_v2: "$.data.version" }
            - call: "POST /assets/${w1_id}/qc-reports"
              payload: { expected_asset_version: "${w1_v2}", inspected_by_operator_id: "${op_qc_id}", basis: INGEST, defect_codes: [CAPTION_MISSING], measured_duration_seconds: 1800 }
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              captures: { w1_score: "$.data.technical_score" }
            - call: "POST /assets"
              payload: { house_number: "HN-W-39", title: "Score Thirty Nine", source: FILE_DELIVERY, expected_duration_seconds: 1800, delivery_deadline_utc: "2026-08-01T10:00:00Z", required_resolution_class: HD_1080I, captions_required: false }
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              captures: { w2_id: "$.data.id" }
            - call: "POST /assets/${w2_id}/delivery"
              payload: { received_utc: "2026-08-01T09:00:00Z", measured_duration_seconds: 1818, video_codec: H264, delivered_resolution_class: HD_1080I, frame_rate: 29.97, audio_loudness_lkfs: -20.0, audio_channel_config: STEREO_2_0, caption_present: false }
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              captures: { w2_v2: "$.data.version" }
            - call: "POST /assets/${w2_id}/qc-reports"
              payload: { expected_asset_version: "${w2_v2}", inspected_by_operator_id: "${op_qc_id}", basis: INGEST, defect_codes: [LOUDNESS_OUT_OF_SPEC, VIDEO_ARTIFACT], measured_duration_seconds: 1818 }
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              captures: { w2_score: "$.data.technical_score" }
            - call: "POST /assets"
              payload: { house_number: "HN-W-40", title: "Score Exactly Forty", source: FILE_DELIVERY, expected_duration_seconds: 1800, delivery_deadline_utc: "2026-08-01T10:00:00Z", required_resolution_class: HD_1080I, captions_required: false }
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              captures: { w3_id: "$.data.id" }
            - call: "POST /assets/${w3_id}/delivery"
              payload: { received_utc: "2026-08-01T09:00:00Z", measured_duration_seconds: 1780, video_codec: H264, delivered_resolution_class: HD_1080I, frame_rate: 29.97, audio_loudness_lkfs: -24.0, audio_channel_config: STEREO_2_0, caption_present: true, caption_language: "en-US" }
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              captures: { w3_v2: "$.data.version" }
            - call: "POST /assets/${w3_id}/qc-reports"
              payload: { expected_asset_version: "${w3_v2}", inspected_by_operator_id: "${op_qc_id}", basis: INGEST, defect_codes: [VIDEO_ARTIFACT, CAPTION_MISSING], measured_duration_seconds: 1780 }
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              captures: { w3_score: "$.data.technical_score" }
          trigger:
            - call: "POST /assets/${w1_id}/qc-waivers"
              payload: { waived_by_operator_id: "${op_pd_id}", waiver_justification: "Network cleared it." }
              as: ProgramDirector
              as_user_id: "${op_pd_id}"
              captures: { e_caption: "$.data.error_id" }
            - call: "POST /assets/${w2_id}/qc-waivers"
              payload: { waived_by_operator_id: "${op_pd_id}", waiver_justification: "Network cleared it." }
              as: ProgramDirector
              as_user_id: "${op_pd_id}"
              captures: { e_score: "$.data.error_id" }
            - call: "POST /assets/${w3_id}/qc-waivers"
              payload: { waived_by_operator_id: "${op_qc_id}", waiver_justification: "Network cleared it." }
              as: ProgramDirector
              as_user_id: "${op_pd_id}"
              captures: { e_self: "$.data.error_id" }
            - call: "POST /assets/${w3_id}/qc-waivers"
              payload: { waived_by_operator_id: "${op_pd_id}", waiver_justification: "Network cleared it." }
              as: ProgramDirector
              as_user_id: "${op_pd_id}"
              captures: { e_just: "$.data.error_id" }
            - call: "POST /assets/${w3_id}/qc-waivers"
              payload: { waived_by_operator_id: "${op_pd_id}", waiver_justification: "Network cleared this" }
              as: ProgramDirector
              as_user_id: "${op_pd_id}"
              captures: { w3_status: "$.data.status" }
          assert:
            - "${w1_score} == 80 (CAPTION_MISSING 20, no duration or loudness penalty) yet the verdict is FAIL because captions_required and caption_present == false — a high score does not save it"
            - "${w2_score} == 39 == 100 - (LOUDNESS_OUT_OF_SPEC 12 + VIDEO_ARTIFACT 10) - min(30, ceil(18/2)*3 == 27) - loudness_penalty 12 (delivered -20.0 is 4.0 off TARGET_LKFS, beyond the 2.0 tolerance) — the defect CODE and the measured LOUDNESS are independent penalties"
            - "${w3_score} == 40 == 100 - (VIDEO_ARTIFACT 10 + CAPTION_MISSING 20) - min(30, ceil(20/2)*3 == 30 capped) — exactly the waiver floor"
            - "${e_caption} == ERR_CAPTION_REQUIREMENT_UNMET (409): priority 32 outranks the 19-character justification at 34, and a missing caption track is non-waivable at ANY score"
            - "${e_score} == ERR_QC_WAIVER_SCORE_TOO_LOW (409): 39 < WAIVER_MIN_SCORE 40, reported before the justification length"
            - "${e_self} == ERR_SELF_AUTHORIZATION_FORBIDDEN (409): waived_by_operator_id equals the governing report's inspected_by_operator_id, and priority 28 outranks both 33 and 34"
            - "${e_just} == ERR_WAIVER_JUSTIFICATION_REQUIRED with HTTP 422 (not 409) once the score and the signer are acceptable: 'Network cleared it.' is 19 characters"
            - "${w3_status} == QC_WAIVED with the 20-character justification 'Network cleared this' — exactly 20 is accepted, proving the pair 19/20 is inclusive on the upper side"
            - "the successful waiver also flips every PlaylistItem referencing the asset from clearance_status BLOCKED to CLEARED and recomputes Playlist.blocked_item_count"
            - "a governing report containing AUDIO_LOSS is refused with ERR_CAPTION_REQUIREMENT_UNMET as well (§1.2 waiver precondition), so the id covers two non-waivable conditions"
            - "the INGEST report on ${w1_id} is ACCEPTED (201) even though rule 32 also lists qc-reports: the verdict formula already forces FAIL, so no report can carry the asset to QC_PASSED with a missing caption track"

      - name: as_run_time_order_beats_future_timestamps_and_the_clock_never_repeats
        claim_type: Priority Ordering
        grounds: "§1.4 priority 41 (ERR_PLAYOUT_EVENT_OUT_OF_ORDER, 'evaluated first', BOUNDARY 'event_utc exactly equal to logical_now, or exactly equal to the previous entry's event_utc, is accepted'), 42 (ERR_EVENT_TIMESTAMP_IN_FUTURE), 43 (ERR_CLOCK_NOT_MONOTONIC, 'an equal value is refused')"
        distinguishing_aspect: "The as-run log has two independent time guards and the older-than-previous test runs first; both boundaries are inclusive, while the clock's own boundary is EXCLUSIVE — equality is accepted for events and refused for the clock, which is the opposite convention on purpose."
        test_recipe:
          setup: "Reference air graph at 12:00:00Z with item 1 CUED and STARTed, so the newest AsRunEntry for the playlist is dated exactly 12:00:00Z."
          setup_api_calls: *air_chain_1159
          trigger:
            - *clk_1200
            - *cue1
            - *start1
            - call: "POST /playlist-items/${it1_id}/playout-events"
              payload: { event_kind: END, event_utc: "2026-08-01T12:00:01Z", measured_duration_seconds: 1800, source: AUTOMATION }
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              captures: { e_future: "$.data.error_id" }
            - call: "POST /playlist-items/${it1_id}/playout-events"
              payload: { event_kind: END, event_utc: "2026-08-01T11:59:59Z", measured_duration_seconds: 1800, source: AUTOMATION }
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              captures: { e_order: "$.data.error_id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T12:00:00Z" }
              as: StationAdmin
              captures: { e_clock_equal: "$.data.error_id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T11:59:59Z" }
              as: StationAdmin
              captures: { e_clock_back: "$.data.error_id" }
            - call: "POST /playlist-items/${it1_id}/playout-events"
              payload: { event_kind: END, event_utc: "2026-08-01T12:00:00Z", measured_duration_seconds: 1800, source: OPERATOR }
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              captures: { asrun_ok_id: "$.data.id" }
            - call: "GET /playlists/${pl1_id}/as-run"
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
          assert:
            - "${e_future} == ERR_EVENT_TIMESTAMP_IN_FUTURE (409): 12:00:01 is one second past the logical clock, and the ordering test passes because it is after the previous entry"
            - "${e_order} == ERR_PLAYOUT_EVENT_OUT_OF_ORDER (409): 11:59:59 is before the newest AsRunEntry, and this is decided at priority 41 — a timestamp that is BOTH out of order and in the future reports 41, never 42"
            - "${e_clock_equal} == ERR_CLOCK_NOT_MONOTONIC (409): the clock refuses an EQUAL value even though playout events accept equality — the two boundary conventions are deliberately opposite"
            - "${e_clock_back} == ERR_CLOCK_NOT_MONOTONIC (409) for a backwards value, and the logical clock still reads 2026-08-01T12:00:00Z afterwards"
            - "the final END event with event_utc EXACTLY equal to both logical_now and the previous entry's timestamp is ACCEPTED (201) and AsRunEntry.${asrun_ok_id}.source == OPERATOR"
            - "GET /playlists/${pl1_id}/as-run returns the three entries CUE, START, END in event_utc order; ties keep insertion order, so the append-only log is still totally ordered"
            - "no rejected event leaves a row behind: the as-run total_count is exactly 3, and PlaylistItem.${it1_id}.version advanced only for the accepted transitions"
            - "the other temporal rules are exercised elsewhere in this index: 35/36 (schedule gap and overlap) and 46 (arm variance +-30 vs 31) in the playlist validation instances, 37/38/39 (feed overlap, join guard, encoder peak) in the feed-window instance, 40 (one non-terminal override per channel) in the override instance, and 44 (makegood deadline) in the settlement instance"

      - name: delivery_grace_window_then_expiry_sweep_then_redelivery_refusal
        claim_type: Priority Ordering
        grounds: "§1.4 priority 45 (ERR_DELIVERY_DEADLINE_PASSED, 'BOUNDARY: received_utc exactly at deadline is on time (late_delivery false); deadline + 1 is late but accepted; deadline + 3600 is the last accepted instant'), priority 16 (ERR_ASSET_INVALID_STATE), §1.5 POST /_clock/set_current_utc step (c) 'EXPECTED -> EXPIRED for assets past delivery_deadline_utc + 3600 s with the CASCADE B' clearance chain'"
        distinguishing_aspect: "Four assets share one deadline and differ only in when they are delivered: exactly at the deadline (on time), exactly at deadline + 3600 (late but accepted), one second later (the sweep has already made it EXPIRED, so priority 16 outranks 45), and a QC_FAILED asset that the sweep can NEVER touch — for which rule 45 is the only guard and therefore the only reachable error. An implementation that expires on >= grace, or that lets the sweep touch non-EXPECTED assets, gets two of the four wrong."
        test_recipe:
          setup: "Four assets created at 09:00:00Z, all with delivery_deadline_utc 2026-08-01T10:00:00Z; the fourth is delivered on time and INGEST-graded to a FAIL so it sits in QC_FAILED."
          setup_api_calls:
            - *clk_t0
            - *op_qc
            - call: "POST /assets"
              payload: { house_number: "HN-D-ONTIME", title: "On Time", source: FILE_DELIVERY, expected_duration_seconds: 1800, delivery_deadline_utc: "2026-08-01T10:00:00Z", required_resolution_class: HD_1080I, captions_required: false }
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              captures: { d1_id: "$.data.id" }
            - call: "POST /assets"
              payload: { house_number: "HN-D-GRACE", title: "Last Accepted Instant", source: FILE_DELIVERY, expected_duration_seconds: 1800, delivery_deadline_utc: "2026-08-01T10:00:00Z", required_resolution_class: HD_1080I, captions_required: false }
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              captures: { d2_id: "$.data.id" }
            - call: "POST /assets"
              payload: { house_number: "HN-D-EXPIRED", title: "One Second Too Late", source: FILE_DELIVERY, expected_duration_seconds: 1800, delivery_deadline_utc: "2026-08-01T10:00:00Z", required_resolution_class: HD_1080I, captions_required: false }
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              captures: { d3_id: "$.data.id" }
            - call: "POST /assets"
              payload: { house_number: "HN-D-REDELIVER", title: "Failed Then Redelivered", source: FILE_DELIVERY, expected_duration_seconds: 1800, delivery_deadline_utc: "2026-08-01T10:00:00Z", required_resolution_class: HD_1080I, captions_required: false }
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              captures: { d4_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T10:00:00Z" }
              as: StationAdmin
            - call: "POST /assets/${d4_id}/delivery"
              payload: { received_utc: "2026-08-01T10:00:00Z", measured_duration_seconds: 1900, video_codec: H264, delivered_resolution_class: HD_1080I, frame_rate: 29.97, audio_loudness_lkfs: -24.0, audio_channel_config: STEREO_2_0, caption_present: true, caption_language: "en-US" }
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              captures: { d4_v2: "$.data.version" }
            - call: "POST /assets/${d4_id}/qc-reports"
              payload: { expected_asset_version: "${d4_v2}", inspected_by_operator_id: "${op_qc_id}", basis: INGEST, defect_codes: [AUDIO_LOSS], measured_duration_seconds: 1900 }
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              captures: { d4_score: "$.data.technical_score" }
          trigger:
            - call: "POST /assets/${d1_id}/delivery"
              payload: { received_utc: "2026-08-01T10:00:00Z", measured_duration_seconds: 1800, video_codec: H264, delivered_resolution_class: HD_1080I, frame_rate: 29.97, audio_loudness_lkfs: -24.0, audio_channel_config: STEREO_2_0, caption_present: true, caption_language: "en-US" }
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              captures: { d1_late: "$.data.late_delivery", d1_status: "$.data.status" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T11:00:00Z" }
              as: StationAdmin
            - call: "GET /assets/${d2_id}"
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              captures: { d2_status_pre: "$.data.status" }
            - call: "POST /assets/${d2_id}/delivery"
              payload: { received_utc: "2026-08-01T11:00:00Z", measured_duration_seconds: 1800, video_codec: H264, delivered_resolution_class: HD_1080I, frame_rate: 29.97, audio_loudness_lkfs: -24.0, audio_channel_config: STEREO_2_0, caption_present: true, caption_language: "en-US" }
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              captures: { d2_late: "$.data.late_delivery", d2_status: "$.data.status" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T11:00:01Z" }
              as: StationAdmin
            - call: "GET /assets/${d3_id}"
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              captures: { d3_status: "$.data.status" }
            - call: "POST /assets/${d3_id}/delivery"
              payload: { received_utc: "2026-08-01T11:00:01Z", measured_duration_seconds: 1800, video_codec: H264, delivered_resolution_class: HD_1080I, frame_rate: 29.97, audio_loudness_lkfs: -24.0, audio_channel_config: STEREO_2_0, caption_present: true, caption_language: "en-US" }
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              captures: { e_expired_state: "$.data.error_id" }
            - call: "GET /assets/${d4_id}"
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              captures: { d4_status: "$.data.status" }
            - call: "POST /assets/${d4_id}/delivery"
              payload: { received_utc: "2026-08-01T11:00:01Z", measured_duration_seconds: 1800, video_codec: H264, delivered_resolution_class: HD_1080I, frame_rate: 29.97, audio_loudness_lkfs: -24.0, audio_channel_config: STEREO_2_0, caption_present: true, caption_language: "en-US" }
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              captures: { e_deadline: "$.data.error_id" }
          assert:
            - "${d4_score} == 45 == 100 - AUDIO_LOSS 25 - min(30, ceil(100/2)*3 == 150 capped to 30) and the verdict is FAIL both on score and on the CRITICAL defect, so ${d4_status} == QC_FAILED"
            - "${d1_late} == false and ${d1_status} == RECEIVED: received_utc EXACTLY at delivery_deadline_utc is on time"
            - "${d2_status_pre} == EXPECTED at logical_now == deadline + 3600 — the sweep fires on 'past' the grace, so exactly at the grace instant the asset survives"
            - "${d2_late} == true and ${d2_status} == RECEIVED: deadline + 3600 is the LAST accepted instant, and lateness is recorded rather than rejected"
            - "${d3_status} == EXPIRED one second later: checkpoint step (c) swept it and ran the CASCADE B' clearance chain, flipping any item that referenced it to clearance_status BLOCKED and bumping Playlist.blocked_item_count"
            - "${e_expired_state} == ERR_ASSET_INVALID_STATE (409, priority 16) — once the sweep has run, the state rule outranks ERR_DELIVERY_DEADLINE_PASSED at priority 45"
            - "${d4_status} == QC_FAILED and NOT EXPIRED: checkpoint step (c) only sweeps assets in status EXPECTED, so a failed asset awaiting redelivery is never expired by the clock"
            - "${e_deadline} == ERR_DELIVERY_DEADLINE_PASSED (409) for that redelivery — the ONLY path on which rule 45 is observable, because every EXPECTED asset beyond the grace has already become EXPIRED"
            - "a delivery at deadline + 1 second would be accepted with late_delivery true — the three-way distinction on time / late-but-accepted / refused is what separates the two error ids"

      - name: channel_shape_and_uniqueness_constraints_47_to_55_each_own_their_error
        claim_type: Violation → Error
        grounds: "§1.4 priorities 47 (ERR_DUPLICATE_CHANNEL_NUMBER, station-wide), 49 (ERR_DUPLICATE_HOUSE_NUMBER, 'never recycled'), 50 (ERR_DUPLICATE_ORDER_REFERENCE), 51 (ERR_SUBCHANNEL_PARENT_REQUIRED / ERR_PRIMARY_CHANNEL_PARENT_FORBIDDEN, 'the required error id is selected by the submitted service_class'), 52 (ERR_INVALID_CHANNEL_PARENT, one level deep), 53 (ERR_CROSS_MULTIPLEX_PARENT), 54 (ERR_BITRATE_FLOOR_EXCEEDS_REQUEST), 55 (ERR_BITRATE_FLOOR_BELOW_RESOLUTION_MINIMUM)"
        distinguishing_aspect: "The self-referential shape rules form their own three-step ladder (presence 51 -> depth 52 -> same-multiplex 53) and rule 51 emits one of TWO ids depending on the submitted service_class. Uniqueness is station-wide, not per multiplex, so 12.1 cannot be reused on MUX-B; and the two bitrate-shape rules are ordered so that a floor that is both above the request and below the resolution minimum reports 54."
        test_recipe:
          setup: "MUX-A (38800/800) with 12.1 PRIMARY and 12.2 SUBCHANNEL, MUX-B (20000/500) with 20.1 PRIMARY, one asset HN-PROG-01 and one order ORD-2026-0001; both multiplex versions are re-read so no attempt is masked by the priority-13 OCC check."
          setup_api_calls:
            - *clk_t0
            - *op_eng
            - *op_qc
            - *tx1
            - *mux1
            - *ch1
            - *mux1_read_v2
            - *ch2
            - *mux2
            - *ch_other
            - *as_prog
            - *ord1
            - call: "GET /multiplexes/${mux1_id}"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { v7_mux1_v: "$.data.version" }
            - call: "GET /multiplexes/${mux2_id}"
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { v7_mux2_v: "$.data.version" }
          trigger:
            - call: "POST /channels"
              payload: { multiplex_id: "${mux2_id}", expected_multiplex_version: "${v7_mux2_v}", call_sign: "WABC-DT2", channel_number: "12.1", service_class: PRIMARY, resolution_class: HD_720P, requested_bitrate_kbps: 6000, floor_bitrate_kbps: 5000, priority_rank: 2 }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { e_dupnum: "$.data.error_id" }
            - call: "POST /channels"
              payload: { multiplex_id: "${mux1_id}", expected_multiplex_version: "${v7_mux1_v}", call_sign: "WXYZ-DT3", channel_number: "12.3", service_class: SUBCHANNEL, resolution_class: SD_480I, requested_bitrate_kbps: 4000, floor_bitrate_kbps: 2000, priority_rank: 3 }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { e_nosub: "$.data.error_id" }
            - call: "POST /channels"
              payload: { multiplex_id: "${mux1_id}", expected_multiplex_version: "${v7_mux1_v}", call_sign: "WXYZ-DT4", channel_number: "12.4", service_class: PRIMARY, parent_channel_id: "${ch1_id}", resolution_class: SD_480I, requested_bitrate_kbps: 4000, floor_bitrate_kbps: 2000, priority_rank: 4 }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { e_primpar: "$.data.error_id" }
            - call: "POST /channels"
              payload: { multiplex_id: "${mux1_id}", expected_multiplex_version: "${v7_mux1_v}", call_sign: "WXYZ-DT5", channel_number: "12.5", service_class: SUBCHANNEL, parent_channel_id: "${ch2_id}", resolution_class: SD_480I, requested_bitrate_kbps: 4000, floor_bitrate_kbps: 2000, priority_rank: 5 }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { e_depth: "$.data.error_id" }
            - call: "POST /channels"
              payload: { multiplex_id: "${mux2_id}", expected_multiplex_version: "${v7_mux2_v}", call_sign: "WABC-DT3", channel_number: "20.2", service_class: SUBCHANNEL, parent_channel_id: "${ch1_id}", resolution_class: SD_480I, requested_bitrate_kbps: 4000, floor_bitrate_kbps: 2000, priority_rank: 2 }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { e_crossmux: "$.data.error_id" }
            - call: "POST /channels"
              payload: { multiplex_id: "${mux1_id}", expected_multiplex_version: "${v7_mux1_v}", call_sign: "WXYZ-DT6", channel_number: "12.6", service_class: SUBCHANNEL, parent_channel_id: "${ch1_id}", resolution_class: SD_480I, requested_bitrate_kbps: 1500, floor_bitrate_kbps: 1800, priority_rank: 6 }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { e_floorreq: "$.data.error_id" }
            - call: "POST /channels"
              payload: { multiplex_id: "${mux1_id}", expected_multiplex_version: "${v7_mux1_v}", call_sign: "WXYZ-DT7", channel_number: "12.7", service_class: SUBCHANNEL, parent_channel_id: "${ch1_id}", resolution_class: SD_480I, requested_bitrate_kbps: 3000, floor_bitrate_kbps: 1999, priority_rank: 7 }
              as: BroadcastEngineer
              as_user_id: "${op_eng_id}"
              captures: { e_floormin: "$.data.error_id" }
            - call: "POST /assets"
              payload: { house_number: "HN-PROG-01", title: "Recycled House Number", source: FILE_DELIVERY, expected_duration_seconds: 600, delivery_deadline_utc: "2026-08-01T20:00:00Z", required_resolution_class: HD_1080I, captions_required: false }
              as: QCTechnician
              as_user_id: "${op_qc_id}"
              captures: { e_duphouse: "$.data.error_id" }
            - call: "POST /spot-orders"
              payload: { channel_id: "${ch2_id}", advertiser_name: "Second Advertiser", order_reference: "ORD-2026-0001", ordered_spots: 2, unit_duration_seconds: 30, rate_cents_total: 50000, daypart: DAYTIME, priority_class: REMNANT, makegood_deadline_utc: "2026-08-31T00:00:00Z" }
              as: TrafficCoordinator
              captures: { e_duporder: "$.data.error_id" }
          assert:
            - "${e_dupnum} == ERR_DUPLICATE_CHANNEL_NUMBER (409): 12.1 already exists on MUX-A and uniqueness spans the whole station, so a different multiplex does not free the number"
            - "${e_nosub} == ERR_SUBCHANNEL_PARENT_REQUIRED with HTTP 422: service_class SUBCHANNEL and parent_channel_id absent"
            - "${e_primpar} == ERR_PRIMARY_CHANNEL_PARENT_FORBIDDEN with HTTP 422: the SAME rule 51 emits the opposite id when a PRIMARY channel supplies a parent"
            - "${e_depth} == ERR_INVALID_CHANNEL_PARENT (409): 12.2 is itself a SUBCHANNEL, and the parent chain is exactly one level deep (a self-reference is rejected by the same rule)"
            - "${e_crossmux} == ERR_CROSS_MULTIPLEX_PARENT (409): the parent 12.1 is PRIMARY so rule 52 passes, isolating rule 53 — the parent must live on the multiplex named in the body"
            - "${e_floorreq} == ERR_BITRATE_FLOOR_EXCEEDS_REQUEST with HTTP 422: floor 1800 > requested 1500 AND 1800 is below the SD_480I minimum 2000, and priority 54 beats 55"
            - "${e_floormin} == ERR_BITRATE_FLOOR_BELOW_RESOLUTION_MINIMUM with HTTP 422: 1999 is one kbps under the SD_480I minimum 2000, while 2000 exactly would be accepted"
            - "${e_duphouse} == ERR_DUPLICATE_HOUSE_NUMBER (409): house numbers are never recycled, not even after RETRACTED or EXPIRED"
            - "${e_duporder} == ERR_DUPLICATE_ORDER_REFERENCE (409) even on a different channel — order_reference is unique across all orders"
            - "not one of these nine rejections creates a row or bumps Multiplex.version: after the trigger block, GET /multiplexes/${mux1_id} still returns version ${v7_mux1_v} and channel_count 2"
            - "the remaining constraint rules are covered elsewhere: 48 (ERR_ANCHOR_ITEM_NOT_FOUND, deliberately AFTER 37/38/39) in the feed-window instance, 56 (ERR_SEQUENCE_NUMBER_CONFLICT) in the revision and makegood instances, 57 (ERR_SUBSTITUTE_RESOLUTION_MISMATCH) in the substitute instance, 58 (ERR_TRIM_EXCEEDS_MAX, inclusive at exactly max_trim_seconds) in the backtiming instance"

