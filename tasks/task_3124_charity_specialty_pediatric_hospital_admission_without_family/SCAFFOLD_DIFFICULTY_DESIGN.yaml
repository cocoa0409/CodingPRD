# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task: task_3124_charity_specialty_pediatric_hospital_admission_without_family
#
# Depth probe: 9 difficulty rules x 2 instances each. Every instance grounds in
# SCAFFOLD.yaml §1.1–§1.7 and carries a structured, replayable test_recipe.
#
# Common fixture conventions used across instances:
#   - Logical clock starts at the server default 2026-09-01T00:00:00Z unless a
#     setup call sets it explicitly.
#   - Hospital H-PDX: latitude 45.0, longitude -122.0, annual_capacity varies
#     per instance.
#   - DOB math uses whole-month floors against the logical clock.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: claim_allowed_amount_per_line_vs_on_total
        grounds:
          - calculations.claim_allowed_amount
          - entities.Claim.fields.estimated_allowed_cents
          - entities.Claim.fields.adjudicated_amount_cents
        distinguishing_aspect: |
          Same two charge lines [3333, 3333] produce estimated_allowed_cents == 4132
          (round each line at 0.62, then sum) but adjudicated_amount_cents == 4000
          (sum 6666, apply 0.60, round once) — two valid rounding orders over the
          billing domain that MUST NOT converge.
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Hospital H1 (capacity 5) with an ACTIVE ORTHOPEDIC program P1 (ages 0..215 months, non-staged so no CarePlan), an ACTIVE community-physician referral source RS1 (country US)."
            - "Application A1 for patient DOB 2020-01-01 (80 months at submission, in scope) accepted through the full committee flow; a VERIFIED InsurancePolicy with coverage_exists true attached BEFORE acceptance so the auto-created BillingAccount links it."
          setup_api_calls:
            - call: "POST /charity-care/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /charity-care/hospitals"
              payload: { hospital_code: "H1", name: "Hospital One", city: "Portland", state_code: "OR", latitude: 45.0, longitude: -122.0, annual_capacity: 5 }
              as: NetworkAdmin
              captures: { h1: $.data.id }
            - call: "POST /charity-care/hospitals/${h1}/programs"
              payload: { category: "ORTHOPEDIC", accepts_international: false, min_age_months: 0, max_age_months: 215, staged_care_required: false }
              as: NetworkAdmin
              captures: { p1: $.data.id }
            - call: "POST /charity-care/referral-sources"
              payload: { source_type: "COMMUNITY_PHYSICIAN", display_name: "Dr. Rivera", contact_email: "rivera@example.org", country_code: "US" }
              as: NetworkAdmin
              captures: { rs1: $.data.id }
            - call: "POST /charity-care/applications"
              payload: { patient_full_name: "Kid One", patient_date_of_birth: "2020-01-01T00:00:00Z", condition_category: "ORTHOPEDIC", referral_source_id: "${rs1}", program_id: "${p1}", home_latitude: 45.0, home_longitude: -121.0 }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { a1: $.data.id, a1_v0: $.data.version }
            - call: "POST /charity-care/applications/${a1}/insurance-policies"
              payload: { payer_name: "PayerCo", policy_number: "POL-1", coverage_exists: true }
              as: IntakeCoordinator
              as_user_id: "ic-1"
            - call: "POST /charity-care/applications/${a1}/open-review"
              payload: {}
              as: ReviewCommitteeMember
              as_user_id: "rcm-1"
            - call: "POST /charity-care/applications/${a1}/vote"
              payload: { vote: "ACCEPT", vote_weight: 1 }
              as: ReviewCommitteeMember
              as_user_id: "rcm-1"
            - call: "POST /charity-care/applications/${a1}/vote"
              payload: { vote: "ACCEPT", vote_weight: 2 }
              as: ReviewCommitteeMember
              as_user_id: "rcm-2"
            - call: "POST /charity-care/applications/${a1}/decide"
              payload: { decision: "ACCEPT", decision_reason: "in scope", expected_application_version: "${a1_v0} + 3" }
              as: ReviewCommitteeMember
              as_user_id: "rcm-3"
            - call: "GET /charity-care/applications/${a1}/billing-account"
              payload: {}
              as: BillingSpecialist
              as_user_id: "bs-1"
              captures: { ba1: "$.data[0].id" }
          trigger:
            - call: "POST /charity-care/billing-accounts/${ba1}/claims"
              payload: { service_date: "2026-09-02T00:00:00Z", lines: [{ cpt_code: "27447", charge_cents: 3333 }, { cpt_code: "27486", charge_cents: 3333 }] }
              as: BillingSpecialist
              as_user_id: "bs-1"
              captures: { cl1: $.data.id, cl1_est: $.data.estimated_allowed_cents }
            - call: "POST /charity-care/claims/${cl1}/adjudicate"
              payload: {}
              as: BillingSpecialist
              as_user_id: "bs-1"
              captures: { cl1_adj: $.data.adjudicated_amount_cents }
          assert:
            - "Claim.${cl1}.estimated_allowed_cents == 4132"
            - "Claim.${cl1}.adjudicated_amount_cents == 4000"
            - "Claim.${cl1}.estimated_allowed_cents != Claim.${cl1}.adjudicated_amount_cents"
            - "BillingAccount.${ba1}.insurance_paid_cents == 4000"
            - "BillingAccount.${ba1}.charity_writeoff_cents == 2666"
            - "BillingAccount.${ba1}.family_balance_cents == 0"

      - name: distance_eligibility_straight_line_vs_road
        grounds:
          - calculations.distance_eligibility
          - entities.TravelSupportGrant.fields.straight_line_distance_miles
          - entities.TravelSupportGrant.fields.road_distance_miles
          - entities.TravelSupportGrant.fields.distance_eligible
        distinguishing_aspect: |
          A home at straight-line 79.9 miles (provisional reading: ineligible, below
          100.0) becomes road distance 103.9 (final reading: eligible) — the two
          distance variants disagree on eligibility itself for the same coordinates,
          and only the road variant may gate distance_eligible. Entity domain:
          TravelSupportGrant, distinct from the billing domain of the sibling instance.
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Hospital H1 (45.0, -122.0, capacity 5) with ACTIVE ORTHOPEDIC program P1 (0..215 months, non-staged); referral source RS1 (US)."
            - "Application A1 DOB 2020-01-01, home at (45.0, -120.364), accepted."
          setup_api_calls:
            - call: "POST /charity-care/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /charity-care/hospitals"
              payload: { hospital_code: "H1", name: "Hospital One", city: "Portland", state_code: "OR", latitude: 45.0, longitude: -122.0, annual_capacity: 5 }
              as: NetworkAdmin
              captures: { h1: $.data.id }
            - call: "POST /charity-care/hospitals/${h1}/programs"
              payload: { category: "ORTHOPEDIC", accepts_international: false, min_age_months: 0, max_age_months: 215, staged_care_required: false }
              as: NetworkAdmin
              captures: { p1: $.data.id }
            - call: "POST /charity-care/referral-sources"
              payload: { source_type: "COMMUNITY_PHYSICIAN", display_name: "Dr. Rivera", contact_email: "rivera@example.org", country_code: "US" }
              as: NetworkAdmin
              captures: { rs1: $.data.id }
            - call: "POST /charity-care/applications"
              payload: { patient_full_name: "Kid Two", patient_date_of_birth: "2020-01-01T00:00:00Z", condition_category: "ORTHOPEDIC", referral_source_id: "${rs1}", program_id: "${p1}", home_latitude: 45.0, home_longitude: -120.364 }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { a1: $.data.id, a1_v0: $.data.version }
            - call: "POST /charity-care/applications/${a1}/open-review"
              payload: {}
              as: ReviewCommitteeMember
              as_user_id: "rcm-1"
            - call: "POST /charity-care/applications/${a1}/vote"
              payload: { vote: "ACCEPT", vote_weight: 1 }
              as: ReviewCommitteeMember
              as_user_id: "rcm-1"
            - call: "POST /charity-care/applications/${a1}/vote"
              payload: { vote: "ACCEPT", vote_weight: 2 }
              as: ReviewCommitteeMember
              as_user_id: "rcm-2"
            - call: "POST /charity-care/applications/${a1}/decide"
              payload: { decision: "ACCEPT", decision_reason: "in scope", expected_application_version: "${a1_v0} + 3" }
              as: ReviewCommitteeMember
              as_user_id: "rcm-3"
          trigger:
            - call: "POST /charity-care/applications/${a1}/travel-support-grants"
              payload: { grant_type: "TRAVEL_AND_LODGING" }
              as: CareCoordinator
              as_user_id: "cc-1"
              captures: { g1: $.data.id }
          assert:
            - "TravelSupportGrant.${g1}.straight_line_distance_miles == 79.9"
            - "TravelSupportGrant.${g1}.road_distance_miles == 103.9"
            - "TravelSupportGrant.${g1}.distance_eligible == true   # final road variant governs; provisional 79.9 < 100.0 would say false"
            - "TravelSupportGrant.${g1}.nightly_lodging_stipend_cents == 15000"
            - "TravelSupportGrant.${g1}.travel_allowance_cents == 6032   # 58 * round(103.9) = 58 * 104"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: travel_stipend_tiering_three_input_nonlinear
        grounds:
          - calculations.travel_stipend_tiering
          - entities.TravelSupportGrant.fields.nightly_lodging_stipend_cents
          - entities.TravelSupportGrant.fields.travel_allowance_cents
        distinguishing_aspect: |
          Mode (a): a formula with 3 inputs (grant_type, road_distance_miles,
          distance_eligible) and non-linear interaction — tiered selection at 100.0/300.0
          nested inside a min() cap. A LODGING grant at road 3100.5 earns 22500 stipend
          and 0 allowance; a TRAVEL grant at the same distance earns 0 stipend and the
          capped 100000 allowance (58*3100 = 179800 would exceed the cap); TRAVEL_AND_LODGING
          at road 195.0 earns 15000 + 11310. One formula, three divergent branches.
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Hospital H1 (45.0, -122.0, capacity 10) with ACTIVE ORTHOPEDIC program P1 (0..215 months, non-staged); referral source RS1 (US)."
            - "Three accepted applications: A-far (home 40.0, -75.0 -> road 3100.5), A-mid (home 45.0, -118.9298 -> road 195.0), A-mid2 (same coordinates as A-mid)."
          setup_api_calls:
            - call: "POST /charity-care/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /charity-care/hospitals"
              payload: { hospital_code: "H1", name: "Hospital One", city: "Portland", state_code: "OR", latitude: 45.0, longitude: -122.0, annual_capacity: 10 }
              as: NetworkAdmin
              captures: { h1: $.data.id }
            - call: "POST /charity-care/hospitals/${h1}/programs"
              payload: { category: "ORTHOPEDIC", accepts_international: false, min_age_months: 0, max_age_months: 215, staged_care_required: false }
              as: NetworkAdmin
              captures: { p1: $.data.id }
            - call: "POST /charity-care/referral-sources"
              payload: { source_type: "COMMUNITY_PHYSICIAN", display_name: "Dr. Rivera", contact_email: "rivera@example.org", country_code: "US" }
              as: NetworkAdmin
              captures: { rs1: $.data.id }
            - call: "POST /charity-care/applications"
              payload: { patient_full_name: "Kid Far", patient_date_of_birth: "2020-01-01T00:00:00Z", condition_category: "ORTHOPEDIC", referral_source_id: "${rs1}", program_id: "${p1}", home_latitude: 40.0, home_longitude: -75.0 }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { afar: $.data.id, afar_v0: $.data.version }
            - call: "POST /charity-care/applications/${afar}/open-review"
              payload: {}
              as: ReviewCommitteeMember
              as_user_id: "rcm-1"
            - call: "POST /charity-care/applications/${afar}/vote"
              payload: { vote: "ACCEPT", vote_weight: 2 }
              as: ReviewCommitteeMember
              as_user_id: "rcm-1"
            - call: "POST /charity-care/applications/${afar}/vote"
              payload: { vote: "ACCEPT", vote_weight: 1 }
              as: ReviewCommitteeMember
              as_user_id: "rcm-2"
            - call: "POST /charity-care/applications/${afar}/decide"
              payload: { decision: "ACCEPT", decision_reason: "ok", expected_application_version: "${afar_v0} + 3" }
              as: ReviewCommitteeMember
              as_user_id: "rcm-3"
            - call: "POST /charity-care/applications"
              payload: { patient_full_name: "Kid Mid", patient_date_of_birth: "2020-01-01T00:00:00Z", condition_category: "ORTHOPEDIC", referral_source_id: "${rs1}", program_id: "${p1}", home_latitude: 45.0, home_longitude: -118.9298 }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { amid: $.data.id, amid_v0: $.data.version }
            - call: "POST /charity-care/applications/${amid}/open-review"
              payload: {}
              as: ReviewCommitteeMember
              as_user_id: "rcm-1"
            - call: "POST /charity-care/applications/${amid}/vote"
              payload: { vote: "ACCEPT", vote_weight: 2 }
              as: ReviewCommitteeMember
              as_user_id: "rcm-1"
            - call: "POST /charity-care/applications/${amid}/vote"
              payload: { vote: "ACCEPT", vote_weight: 1 }
              as: ReviewCommitteeMember
              as_user_id: "rcm-2"
            - call: "POST /charity-care/applications/${amid}/decide"
              payload: { decision: "ACCEPT", decision_reason: "ok", expected_application_version: "${amid_v0} + 3" }
              as: ReviewCommitteeMember
              as_user_id: "rcm-3"
          trigger:
            - call: "POST /charity-care/applications/${afar}/travel-support-grants"
              payload: { grant_type: "LODGING" }
              as: CareCoordinator
              as_user_id: "cc-1"
              captures: { g_lodge: $.data.id }
            - call: "POST /charity-care/applications/${afar}/travel-support-grants"
              payload: { grant_type: "TRAVEL" }
              as: CareCoordinator
              as_user_id: "cc-1"
              captures: { g_trav: $.data.id }
            - call: "POST /charity-care/applications/${amid}/travel-support-grants"
              payload: { grant_type: "TRAVEL_AND_LODGING" }
              as: CareCoordinator
              as_user_id: "cc-1"
              captures: { g_both: $.data.id }
          assert:
            - "TravelSupportGrant.${g_lodge}.nightly_lodging_stipend_cents == 22500   # road 3100.5 >= 300.0 tier2"
            - "TravelSupportGrant.${g_lodge}.travel_allowance_cents == 0             # LODGING never pays mileage"
            - "TravelSupportGrant.${g_trav}.nightly_lodging_stipend_cents == 0"
            - "TravelSupportGrant.${g_trav}.travel_allowance_cents == 100000         # 58*3100 = 179800 capped at TRAVEL_CAP_CENTS"
            - "TravelSupportGrant.${g_both}.road_distance_miles == 195.0"
            - "TravelSupportGrant.${g_both}.nightly_lodging_stipend_cents == 15000   # 100.0 <= 195.0 < 300.0 tier1"
            - "TravelSupportGrant.${g_both}.travel_allowance_cents == 11310          # 58 * 195, under cap"

      - name: claim_rounding_order_per_line_then_sum_vs_sum_then_round
        grounds:
          - calculations.claim_allowed_amount
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters and the scaffold pins both
          orders — provisional rounds each line THEN sums (3333->2066 twice = 4132),
          final sums THEN rounds once (6666 * 0.60 = 3999.6 -> 4000). A second
          triple-line claim [101,202,305] confirms the rule is not an artifact of
          one line count: provisional 63+125+189 = 377 vs final round(608*0.60)=365.
          Distinct mode from the sibling instance's tiered-threshold formula.
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Same accepted-with-insurance setup as claim_allowed_amount_per_line_vs_on_total: hospital H1 capacity 5, program P1 ORTHOPEDIC non-staged, source RS1, application A1 DOB 2020-01-01 with VERIFIED coverage policy, accepted; billing account BA1 linked."
          setup_api_calls:
            - call: "POST /charity-care/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /charity-care/hospitals"
              payload: { hospital_code: "H1", name: "Hospital One", city: "Portland", state_code: "OR", latitude: 45.0, longitude: -122.0, annual_capacity: 5 }
              as: NetworkAdmin
              captures: { h1: $.data.id }
            - call: "POST /charity-care/hospitals/${h1}/programs"
              payload: { category: "ORTHOPEDIC", accepts_international: false, min_age_months: 0, max_age_months: 215, staged_care_required: false }
              as: NetworkAdmin
              captures: { p1: $.data.id }
            - call: "POST /charity-care/referral-sources"
              payload: { source_type: "COMMUNITY_PHYSICIAN", display_name: "Dr. Rivera", contact_email: "rivera@example.org", country_code: "US" }
              as: NetworkAdmin
              captures: { rs1: $.data.id }
            - call: "POST /charity-care/applications"
              payload: { patient_full_name: "Kid One", patient_date_of_birth: "2020-01-01T00:00:00Z", condition_category: "ORTHOPEDIC", referral_source_id: "${rs1}", program_id: "${p1}", home_latitude: 45.0, home_longitude: -121.0 }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { a1: $.data.id, a1_v0: $.data.version }
            - call: "POST /charity-care/applications/${a1}/insurance-policies"
              payload: { payer_name: "PayerCo", policy_number: "POL-1", coverage_exists: true }
              as: IntakeCoordinator
              as_user_id: "ic-1"
            - call: "POST /charity-care/applications/${a1}/open-review"
              payload: {}
              as: ReviewCommitteeMember
              as_user_id: "rcm-1"
            - call: "POST /charity-care/applications/${a1}/vote"
              payload: { vote: "ACCEPT", vote_weight: 1 }
              as: ReviewCommitteeMember
              as_user_id: "rcm-1"
            - call: "POST /charity-care/applications/${a1}/vote"
              payload: { vote: "ACCEPT", vote_weight: 2 }
              as: ReviewCommitteeMember
              as_user_id: "rcm-2"
            - call: "POST /charity-care/applications/${a1}/decide"
              payload: { decision: "ACCEPT", decision_reason: "ok", expected_application_version: "${a1_v0} + 3" }
              as: ReviewCommitteeMember
              as_user_id: "rcm-3"
            - call: "GET /charity-care/applications/${a1}/billing-account"
              payload: {}
              as: BillingSpecialist
              as_user_id: "bs-1"
              captures: { ba1: "$.data[0].id" }
          trigger:
            - call: "POST /charity-care/billing-accounts/${ba1}/claims"
              payload: { service_date: "2026-09-02T00:00:00Z", lines: [{ cpt_code: "99213", charge_cents: 101 }, { cpt_code: "99214", charge_cents: 202 }, { cpt_code: "99215", charge_cents: 305 }] }
              as: BillingSpecialist
              as_user_id: "bs-1"
              captures: { cl2: $.data.id }
            - call: "POST /charity-care/claims/${cl2}/adjudicate"
              payload: {}
              as: BillingSpecialist
              as_user_id: "bs-1"
          assert:
            - "Claim.${cl2}.submitted_amount_cents == 608"
            - "Claim.${cl2}.estimated_allowed_cents == 377      # 63 + 125 + 189, per-line rounding"
            - "Claim.${cl2}.adjudicated_amount_cents == 365     # round(608 * 0.60) = round(364.8)"
            - "BillingAccount.${ba1}.charity_writeoff_cents == 243   # 608 - 365"
            - "BillingAccount.${ba1}.family_balance_cents == 0"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: application_review_info_request_cycle_rounds_increment
        grounds:
          - state_machines.PatientApplication.INFO_REQUESTED_to_PENDING_REVIEW
          - state_machines.PatientApplication.PENDING_REVIEW_to_INFO_REQUESTED
          - entities.PatientApplication.fields.review_round
        distinguishing_aspect: |
          PatientApplication runs a true cycle PENDING_REVIEW -> INFO_REQUESTED ->
          PENDING_REVIEW (twice here): review_round goes 1 -> 2 -> 3 and votes cast on
          round 1 do NOT count toward the round-3 quorum — the cycle resets the
          per-round vote tally, which a linear pipeline could never exhibit.
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Hospital H1 capacity 5, program P1 ORTHOPEDIC (0..215, non-staged), source RS1. Application A1 DOB 2020-01-01 submitted and opened."
          setup_api_calls:
            - call: "POST /charity-care/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /charity-care/hospitals"
              payload: { hospital_code: "H1", name: "Hospital One", city: "Portland", state_code: "OR", latitude: 45.0, longitude: -122.0, annual_capacity: 5 }
              as: NetworkAdmin
              captures: { h1: $.data.id }
            - call: "POST /charity-care/hospitals/${h1}/programs"
              payload: { category: "ORTHOPEDIC", accepts_international: false, min_age_months: 0, max_age_months: 215, staged_care_required: false }
              as: NetworkAdmin
              captures: { p1: $.data.id }
            - call: "POST /charity-care/referral-sources"
              payload: { source_type: "COMMUNITY_PHYSICIAN", display_name: "Dr. Rivera", contact_email: "rivera@example.org", country_code: "US" }
              as: NetworkAdmin
              captures: { rs1: $.data.id }
            - call: "POST /charity-care/applications"
              payload: { patient_full_name: "Kid Cycle", patient_date_of_birth: "2020-01-01T00:00:00Z", condition_category: "ORTHOPEDIC", referral_source_id: "${rs1}", program_id: "${p1}", home_latitude: 45.0, home_longitude: -121.0 }
              as: IntakeCoordinator
              as_user_id: "ic-1"
              captures: { a1: $.data.id, a1_v0: $.data.version }
            - call: "POST /charity-care/applications/${a1}/open-review"
              payload: {}
              as: ReviewCommitteeMember
              as_user_id: "rcm-1"
            - call: "POST /charity-care/applications/${a1}/vote"
              payload: { vote: "ACCEPT", vote_weight: 2 }
              as: ReviewCommitteeMember
              as_user_id: "rcm-1"
            - call: "POST /charity-care/applications/${a1}/request-info"
              payload: {}
              as: ReviewCommitteeMember
              as_user_id: "rcm-2"
            - call: "POST /charity-care/applications/${a1}/resubmit-info"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "ic-1"
            - call: "POST /charity-care/applications/${a1}/request-info"
              payload: {}
              as: ReviewCommitteeMember
              as_user_id: "rcm-2"
            - call: "POST /charity-care/applications/${a1}/resubmit-info"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "ic-1"
          trigger:
            - call: "GET /charity-care/applications/${a1}"
              payload: {}
              as: ReviewCommitteeMember
              as_user_id: "rcm-1"
              captures: { a1_v_now: $.data.version }
            - call: "POST /charity-care/applications/${a1}/decide"
              payload: { decision: "ACCEPT", decision_reason: "round-3 decide on stale round-1 votes only", expected_application_version: "${a1_v_now}" }
              as: ReviewCommitteeMember
              as_user_id: "rcm-3"
              captures: { decide_err: $.data.error_id }
          assert:
            - "PatientApplication.${a1}.review_round == 3"
            - "PatientApplication.${a1}.status == PENDING_REVIEW after two full cycles"
            - "the decide call returns 409 and decide_err == ERR_QUORUM_NOT_MET   # round-1 vote_weight 2 does not carry into round 3"
