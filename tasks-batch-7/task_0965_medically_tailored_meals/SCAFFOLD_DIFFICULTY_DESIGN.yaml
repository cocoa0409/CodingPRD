  # ---------------------------------------------------------------- rule 7 ---
  - rule_id: cross_entity_state_dependency
    instances:
      - name: freeze_requires_member_active
        grounds:
          - state_machines.MenuCycle.PLANNED_to_FROZEN
          - state_machines.Member.ACTIVE_to_SUSPENDED
          - errors[ERR_MEMBER_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair MenuCycle->Member: a fully compliant cycle cannot freeze
          while its Member is SUSPENDED — the valid transition set of the cycle
          depends on the parent member's state, not on any cycle field.
        test_recipe:
          setup:
            - "Member ACTIVE with ACCEPTED referral, ACTIVE prescription, compliant PLANNED cycle; member then SUSPENDED"
          setup_api_calls:
            - { call: "POST /mtm/members", payload: { full_name: "M Thirteen", payer_type: "MEDICAID_WAIVER", payer_member_id: "W-310", allergies: [], income_fpl_percent: 130, household_size: 2 }, as: CareCoordinator, captures: { m_id: $.data.id, m_v0: $.data.version } }
