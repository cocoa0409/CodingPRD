          - errors.ERR_SOLICITATION_ALREADY_RESOLVED
        distinguishing_aspect: "One owner declining moves exactly one unit from pending_count to declined_count, stamps decline_reason OWNER_DECLINE and responded_at at the clock, decrements only that device's pending_solicitation_count, leaves the request SOLICITING because two neighbours are still pending, and makes the second decline attempt fail with 409 ERR_SOLICITATION_ALREADY_RESOLVED."
