  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: policy_issue_requires_commitment_issued
        grounds:
          - state_machines.Policy.PENDING_to_ISSUED
          - state_machines.Commitment.DRAFT_to_ISSUED
          - validations[priority=7]
        distinguishing_aspect: |
          Policy PENDING -> ISSUED is gated on the SEPARATE Commitment entity's state ==
          ISSUED: with the commitment left DRAFT the issue is rejected
          ERR_COMMITMENT_NOT_ISSUED. Entity pair: Policy -> Commitment.
        test_recipe:
          setup:
            - "An order with a DRAFT commitment (no open exceptions) and a PENDING OWNER policy bound to it."
          setup_api_calls:
            - call: "POST /title/agencies"
              payload: { name: "Acme Title", remit_split_pct: 0.82 }
              as: Underwriter
              captures: { ag_id: $.data.id }
            - call: "POST /title/orders"
              payload: { agency_id: "${ag_id}", parcel_id: "APN-14", county: "King", transaction_type: "PURCHASE", sales_price_cents: 25000000, loan_amount_cents: 0 }
              as: Agency
              as_user_id: "${ag_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /title/orders/${o_id}/commitments"
              payload: { effective_date: "2026-01-05T00:00:00Z", expiry_date: "2026-07-05T00:00:00Z", schedule_a_estate: "FEE_SIMPLE", insured_amount_cents: 25000000, expected_order_version: "${o_v}" }
              as: TitleOfficer
              captures: { c_id: $.data.id }
            - call: "POST /title/orders/${o_id}/policies"
              payload: { commitment_id: "${c_id}", policy_type: "OWNER", coverage_amount_cents: 25000000 }
              as: Underwriter
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /title/policies/${p_id}/transitions"
              payload: { to_status: "ISSUED" }
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_COMMITMENT_NOT_ISSUED"
            - "Policy.${p_id}.status == PENDING"

      - name: disbursement_approve_requires_order_disbursable
        grounds:
          - state_machines.Disbursement.REQUESTED_to_APPROVED
          - entities.Order.fields.status
          - validations[priority=7]
        distinguishing_aspect: |
          Disbursement REQUESTED -> APPROVED is gated on the SEPARATE Order entity's
          status IN {CLEAR_TO_CLOSE, CLOSED}: with the order still OPENED the approve is
          rejected ERR_ORDER_NOT_DISBURSABLE. Entity pair: Disbursement -> Order
          (different from Policy -> Commitment).
        test_recipe:
          setup:
            - "An order in OPENED with a REQUESTED disbursement (any amount)."
          setup_api_calls:
            - call: "POST /title/agencies"
              payload: { name: "Acme Title", remit_split_pct: 0.82 }
              as: Underwriter
              captures: { ag_id: $.data.id }
            - call: "POST /title/orders"
              payload: { agency_id: "${ag_id}", parcel_id: "APN-15", county: "King", transaction_type: "PURCHASE", sales_price_cents: 25000000, loan_amount_cents: 0 }
              as: Agency
              as_user_id: "${ag_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /title/orders/${o_id}/disbursements"
              payload: { payee: "Seller", amount_cents: 1000, purpose: "SELLER_PROCEEDS", wire_window_start: "2026-01-20T09:00:00Z", wire_window_end: "2026-01-20T10:00:00Z", expected_order_version: "${o_v}" }
              as: Underwriter
              captures: { disb_id: $.data.id }
          trigger:
            - call: "POST /title/disbursements/${disb_id}/transitions"
              payload: { to_status: "APPROVED" }
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ORDER_NOT_DISBURSABLE"
            - "Disbursement.${disb_id}.status == REQUESTED"

