# =============================================================================
# §1.8 Scaffold Difficulty Design — Catalog Circulation Planning (task 2784)
#
# Test-targeting index for the nine §0.5 Difficulty Rules. Every instance grounds
# exclusively in elements declared in SCAFFOLD.yaml §1.1–§1.7; deleting this file
# would leave the declared behaviour identical.
#
# All numeric assert values were computed by executing the referenced
# calculations[].formula bodies as code against the pinned fixtures below.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  # RULE 1 — dual_variant_calc  (2 instances, different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: line_demand_forecast_gross_vs_net_diverge_on_holdout_line
        grounds:
          - calculations.line_demand_forecast
          - calculations.drop_provisional_cost_per_book
          - calculations.drop_cost_per_book
          - calculations.drop_allocation_waterfall
          - calculations.line_profitability
          - entities.CirculationLine.fields.gross_forecast_demand_cents
          - entities.CirculationLine.fields.forecast_demand_cents
          - entities.CirculationLine.fields.holdout_quantity
          - entities.CirculationLine.fields.mailable_quantity
        distinguishing_aspect: |
          Entity domain = CirculationLine demand: the two variants of
          line_demand_forecast run over DIFFERENT INPUT SETS on the same row
          (PRE_MERGE_GROSS over requested_quantity 95000, POST_MERGE_NET over
          mailable_quantity 27000), so on one single line the persisted
          gross_forecast_demand_cents (108965000) and forecast_demand_cents
          (30969000) differ by a factor the audience cap and the 1000 bps holdout
          carve-out fully explain, and only the NET figure reaches
          CirculationPlan.planned_demand_cents.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Season FW26 on the default rate card (print 2600, paper 92 c/lb, 40 milli-oz/page, 88 usable sq in/page, postage estimate 55, cogs 5800 bps)."
            - "One leaf HousefileSegment S_PREMIUM with housefile_count 30000, historical_response_rate_bps 620, avg_order_value_cents 18500 (rfm_score 1000, BEST, PREMIUM_FULL)."
            - "CirculationPlan P1 with budget_cents 20000000, one COMPLETED housefile-only MergePurgeRun."
            - "Drop 1 at page_count 94, in_home_date 2026-09-15, carrying one HOUSEFILE line that requests 95000 books against a 30000-name audience with holdout_pct_bps 1000."
          setup_api_calls:
            - call: "POST /catalog-circulation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /catalog-circulation/seasons"
              payload: { season_code: "FW26", fiscal_year: 2026 }
              as: PlatformAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_code: "S_PREMIUM", recency_days: 45, orders_12mo: 7, ltv_cents: 62000, housefile_count: 30000, avg_order_value_cents: 18500, historical_response_rate_bps: 620 }
              as: CirculationPlanner
              captures: { seg_premium_id: "$.data.id" }
            - call: "POST /catalog-circulation/circulation-plans"
              payload: { season_id: "${season_id}", plan_code: "P1", budget_cents: 20000000 }
              as: CirculationPlanner
              captures: { plan_id: "$.data.id", plan_v1: "$.data.version" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/merge-purge-runs"
              payload: { expected_plan_version: "${plan_v1}", input_rental_ids: [] }
              as: ListBroker
              captures: { mp1_id: "$.data.id" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/drops"
              payload: { drop_number: 1, in_home_date: "2026-09-15", page_count: 94 }
              as: CirculationPlanner
              captures: { drop_id: "$.data.id" }
            - call: "POST /catalog-circulation/drops/${drop_id}/circulation-lines"
              payload: { audience_type: "HOUSEFILE", housefile_segment_id: "${seg_premium_id}", requested_quantity: 95000, is_holdout: true, holdout_pct_bps: 1000 }
              as: CirculationPlanner
              captures: { line_id: "$.data.id", line_gross_at_create: "$.data.gross_forecast_demand_cents" }
          trigger:
            - call: "POST /catalog-circulation/drops/${drop_id}/allocate"
              payload: {}
              as: CirculationPlanner
          assert:
            - "MergePurgeRun.${mp1_id}.status == COMPLETED"
            - "MergePurgeRun.${mp1_id}.gross_input_names == 30000 and net_mailable_names == 30000"
            - "CirculationLine.${line_id}.effective_response_bps == 620"
            - "CirculationLine.${line_id}.gross_forecast_demand_cents == 108965000  # PRE_MERGE_GROSS: floor(95000*620/10000)=5890 orders * 18500"
            - "CirculationLine.${line_id}.gross_forecast_demand_cents == ${line_gross_at_create}  # the gross variant is frozen at line creation and is NOT re-based by allocate"
            - "CirculationLine.${line_id}.allocated_quantity == 30000  # clamped by the 30000-name audience cap, not by the 95000 request"
            - "CirculationLine.${line_id}.holdout_quantity == 3000"
            - "CirculationLine.${line_id}.mailable_quantity == 27000"
            - "CirculationLine.${line_id}.forecast_demand_cents == 30969000  # POST_MERGE_NET: floor(27000*620/10000)=1674 orders * 18500"
            - "CirculationLine.${line_id}.gross_forecast_demand_cents != CirculationLine.${line_id}.forecast_demand_cents"
            - "CirculationLine.${line_id}.unit_cost_cents == 309  # provisional at requested 95000: printing 232 + paper 22 + postage 55"
            - "CirculationLine.${line_id}.committed_cost_cents == 9270000  # 30000 allocated * 309, holdout included"
            - "Drop.${drop_id}.provisional_cost_per_book_cents == 309"
            - "Drop.${drop_id}.planned_quantity == 30000"
            - "Drop.${drop_id}.print_rebate_bps == 0  # planned 30000 sits BELOW the 40000 rebate band the provisional 95000 request qualified for"
            - "Drop.${drop_id}.cost_per_book_cents == 321  # printing 244 + paper 22 + postage 55, ESTIMATED_POSTAGE"
            - "CirculationLine.${line_id}.gross_margin_cents == 13006980  # round_half_up(30969000 * 4200 / 10000), computed from the NET variant"
            - "CirculationLine.${line_id}.circulation_cost_cents == 8667000  # 27000 mailable * 321, holdout NOT charged"
            - "CirculationLine.${line_id}.contribution_cents == 4339980"
            - "CirculationPlan.${plan_id}.planned_demand_cents == 30969000  # the roll-up consumes the NET variant only"
            - "CirculationPlan.${plan_id}.committed_cost_cents == 9270000"
            - "CirculationPlan.${plan_id}.uncommitted_budget_cents == 10730000"

      - name: matchback_last_touch_vs_fractional_credit_same_drop_differently
        grounds:
          - calculations.matchback_attribution
          - state_machines.MatchbackRun.OPEN_to_SUPERSEDED
          - state_machines.Drop.measurement_status.PENDING_to_MATCHBACK_OPEN
          - entities.MatchbackRun.fields.attribution_variant
          - entities.MatchbackRun.fields.attributed_demand_cents
          - concurrency_rules[matchback-create-stale-drop]
        distinguishing_aspect: |
          Entity domain = MatchbackRun attribution (a different entity domain from
          the CirculationLine demand instance): on one identical fixture — a single
          20000-cent online order with exactly three qualifying contacts (MAIL from
          drop 1, EMAIL, DIGITAL) — LAST_TOUCH_MAIL credits drop 1 the whole 20000
          cents while FRACTIONAL_MULTI_TOUCH credits it 6668 (floor share 6666 plus
          the entire 2-cent remainder, because drop 1's MAIL is the EARLIEST
          qualifying contact, not the last).
        test_recipe:
          setup:
            - "Logical clock stepped 2026-08-01 -> 2026-09-20 -> 2026-10-05T12:00:00Z."
            - "Season FW26 on the default rate card (fatigue_suppression_threshold 100, fatigue_window_days 90); no SuppressionRule rows, so no contact cap applies."
            - "Segment S_PREMIUM (30000 names, 620 bps, AOV 18500)."
            - "Plan P1 (budget 20000000) approved by a director who is neither the coster nor the submitter; drop 1 (page_count 64, in_home 2026-09-20) fully presorted as a single 20000-piece FIVE_DIGIT batch and MAILED."
            - "Exactly three ContactEvent rows on S_PREMIUM: the cascade MAIL of 2026-09-20, a manual EMAIL of 2026-10-01, a manual DIGITAL of 2026-10-03 (fatigue_score 30+12+6 = 48, below the threshold, so nothing is suppressed)."
            - "One ingested online order for S_PREMIUM: 20000 cents on 2026-10-05T12:00:00Z."
          setup_api_calls:
            - call: "POST /catalog-circulation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /catalog-circulation/seasons"
              payload: { season_code: "FW26", fiscal_year: 2026 }
              as: PlatformAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_code: "S_PREMIUM", recency_days: 45, orders_12mo: 7, ltv_cents: 62000, housefile_count: 30000, avg_order_value_cents: 18500, historical_response_rate_bps: 620 }
              as: CirculationPlanner
              captures: { seg_premium_id: "$.data.id" }
            - call: "POST /catalog-circulation/circulation-plans"
              payload: { season_id: "${season_id}", plan_code: "P1", budget_cents: 20000000 }
              as: CirculationPlanner
              captures: { plan_id: "$.data.id", plan_v1: "$.data.version" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/merge-purge-runs"
              payload: { expected_plan_version: "${plan_v1}", input_rental_ids: [] }
              as: ListBroker
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/drops"
              payload: { drop_number: 1, in_home_date: "2026-09-20", page_count: 64 }
              as: CirculationPlanner
              captures: { drop_id: "$.data.id" }
            - call: "POST /catalog-circulation/drops/${drop_id}/circulation-lines"
              payload: { audience_type: "HOUSEFILE", housefile_segment_id: "${seg_premium_id}", requested_quantity: 20000 }
              as: CirculationPlanner
              captures: { line_id: "$.data.id" }
            - call: "POST /catalog-circulation/drops/${drop_id}/allocate"
              payload: {}
              as: CirculationPlanner
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/cost"
              payload: {}
              as: CirculationPlanner
              as_user_id: "u-planner-1"
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/submit-review"
              payload: {}
              as: CirculationPlanner
              as_user_id: "u-planner-1"
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/approve"
              payload: {}
              as: CirculationDirector
              as_user_id: "u-director-9"
            - call: "POST /catalog-circulation/drops/${drop_id}/presort-batches"
              payload: { declared_tier: "FIVE_DIGIT", piece_count: 20000 }
              as: CirculationPlanner
            - call: "POST /catalog-circulation/drops/${drop_id}/presort"
              payload: {}
              as: CirculationPlanner
            - call: "POST /catalog-circulation/_clock/set_current_utc"
              payload: { current_utc: "2026-09-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /catalog-circulation/drops/${drop_id}/mail"
              payload: {}
              as: CirculationPlanner
            - call: "POST /catalog-circulation/_clock/set_current_utc"
              payload: { current_utc: "2026-10-05T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /catalog-circulation/contact-events"
              payload: { housefile_segment_id: "${seg_premium_id}", channel: "EMAIL", contact_date: "2026-10-01", source: "MANUAL" }
              as: MarketingAnalyst
            - call: "POST /catalog-circulation/contact-events"
              payload: { housefile_segment_id: "${seg_premium_id}", channel: "DIGITAL", contact_date: "2026-10-03", source: "MANUAL" }
              as: MarketingAnalyst
            - call: "POST /catalog-circulation/_online-orders/ingest"
              payload: { orders: [{ external_order_id: "O-1", housefile_segment_id: "${seg_premium_id}", order_date: "2026-10-05T12:00:00Z", demand_cents: 20000 }] }
              as: PlatformAdmin
            - call: "GET /catalog-circulation/drops/${drop_id}"
              payload: {}
              as: MarketingAnalyst
              captures: { drop_v_pre_lt: "$.data.version" }
          trigger:
            - call: "POST /catalog-circulation/drops/${drop_id}/matchback-runs"
              payload: { expected_drop_version: "${drop_v_pre_lt}", attribution_variant: "LAST_TOUCH_MAIL", attribution_window_days: 30 }
              as: MarketingAnalyst
              captures: { run_lt_id: "$.data.id" }
            - call: "GET /catalog-circulation/drops/${drop_id}"
              payload: {}
              as: MarketingAnalyst
              captures: { drop_v_pre_fr: "$.data.version" }
            - call: "POST /catalog-circulation/drops/${drop_id}/matchback-runs"
              payload: { expected_drop_version: "${drop_v_pre_fr}", attribution_variant: "FRACTIONAL_MULTI_TOUCH", attribution_window_days: 30 }
              as: MarketingAnalyst
              captures: { run_fr_id: "$.data.id" }
          assert:
            - "HousefileSegment.${seg_premium_id}.fatigue_score == 48  # MAIL@15d 30 + EMAIL@4d 12 + DIGITAL@2d 6"
            - "HousefileSegment.${seg_premium_id}.contact_strategy == PREMIUM_FULL  # 48 < threshold 100, nothing suppressed"
            - "Drop.${drop_id}.cost_per_book_cents == 221  # printing 166 + paper 15 + presorted postage 40"
            - "MatchbackRun.${run_lt_id}.attribution_variant == LAST_TOUCH_MAIL"
            - "MatchbackRun.${run_lt_id}.matched_order_count == 1"
            - "MatchbackRun.${run_lt_id}.attributed_order_count == 1"
            - "MatchbackRun.${run_lt_id}.unmatched_order_count == 0"
            - "MatchbackRun.${run_lt_id}.attributed_demand_cents == 20000  # the single MAIL touch takes the whole order"
            - "MatchbackRun.${run_fr_id}.attribution_variant == FRACTIONAL_MULTI_TOUCH"
            - "MatchbackRun.${run_fr_id}.attributed_demand_cents == 6668  # floor(20000/3)=6666 plus the whole 2-cent remainder, awarded to the EARLIEST contact (the 2026-09-20 MAIL)"
            - "MatchbackRun.${run_fr_id}.attributed_order_count == 1 and unmatched_order_count == 0"
            - "MatchbackRun.${run_lt_id}.attributed_demand_cents != MatchbackRun.${run_fr_id}.attributed_demand_cents"
            - "MatchbackRun.${run_lt_id}.status == SUPERSEDED  # the second run supersedes the first"
            - "MatchbackRun.${run_fr_id}.status == OPEN"
            - "Drop.${drop_id}.measurement_status == MATCHBACK_OPEN"
            - "Drop.${drop_id}.production_status == MAILED  # attribution never touches the production dimension"

  # ===========================================================================
  # RULE 2 — combinatorial_formula  (3 instances, one per §0.5 mode a/b/c)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: presort_tier_fallback_weight_surcharge_and_automation_share_compose
        grounds:
          - calculations.drop_postage_total
          - calculations.drop_piece_weight
          - calculations.drop_cost_per_book
          - entities.PostalPresortBatch.fields.effective_tier
          - entities.PostalPresortBatch.fields.weight_surcharge_cents_per_piece
          - entities.PostalPresortBatch.fields.batch_postage_cents
          - entities.Drop.fields.automation_share_bps
          - entities.Drop.fields.automation_qualified
          - state_machines.Drop.production_status.PLANNED_to_PRESORTED
        distinguishing_aspect: |
          MODE (a) — a ≥3-input non-linear formula: drop_postage_total combines FOUR
          independent inputs (per-batch declared_tier, per-batch piece_count against
          that tier's minimum, the drop-level weight surcharge derived from
          page_count, and the drop-level automation share against planned_quantity)
          multiplicatively, not additively. At page_count 148 with batches
          FIVE_DIGIT/149 and THREE_DIGIT/19851 the 149-piece batch misses the
          150-piece minimum and falls back to MIXED_AADC (rate 58, not 42), the
          17-cent weight surcharge is folded into each per-piece rate BEFORE
          multiplication, and the surviving automation share of 9925 bps clears the
          9000 bps gate, yielding postage_total_cents 1241937 — a figure no single
          input predicts.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; season FW26 on the default rate card."
            - "Segment S_PREMIUM (30000 names, 620 bps, AOV 18500); plan P1 budget 20000000 with a COMPLETED housefile-only merge-purge run."
            - "Drop 1 at page_count 148 (weight_oz_milli 5920, i.e. 1920 milli-oz above the 4000 free allowance) carrying one HOUSEFILE line for 20000 books, allocated, costed, submitted and APPROVED."
            - "Two presort batches covering exactly the 20000 planned pieces: a 149-piece batch declared FIVE_DIGIT (below the 150-piece tier minimum) and a 19851-piece batch declared THREE_DIGIT."
          setup_api_calls:
            - call: "POST /catalog-circulation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /catalog-circulation/seasons"
              payload: { season_code: "FW26", fiscal_year: 2026 }
              as: PlatformAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_code: "S_PREMIUM", recency_days: 45, orders_12mo: 7, ltv_cents: 62000, housefile_count: 30000, avg_order_value_cents: 18500, historical_response_rate_bps: 620 }
              as: CirculationPlanner
              captures: { seg_premium_id: "$.data.id" }
            - call: "POST /catalog-circulation/circulation-plans"
              payload: { season_id: "${season_id}", plan_code: "P1", budget_cents: 20000000 }
              as: CirculationPlanner
              captures: { plan_id: "$.data.id", plan_v1: "$.data.version" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/merge-purge-runs"
              payload: { expected_plan_version: "${plan_v1}", input_rental_ids: [] }
              as: ListBroker
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/drops"
              payload: { drop_number: 1, in_home_date: "2026-09-15", page_count: 148 }
              as: CirculationPlanner
              captures: { drop_id: "$.data.id", drop_weight: "$.data.weight_oz_milli" }
            - call: "POST /catalog-circulation/drops/${drop_id}/circulation-lines"
              payload: { audience_type: "HOUSEFILE", housefile_segment_id: "${seg_premium_id}", requested_quantity: 20000 }
              as: CirculationPlanner
              captures: { line_id: "$.data.id" }
            - call: "POST /catalog-circulation/drops/${drop_id}/allocate"
              payload: {}
              as: CirculationPlanner
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/cost"
              payload: {}
              as: CirculationPlanner
              as_user_id: "u-planner-1"
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/submit-review"
              payload: {}
              as: CirculationPlanner
              as_user_id: "u-planner-1"
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/approve"
              payload: {}
              as: CirculationDirector
              as_user_id: "u-director-9"
            - call: "POST /catalog-circulation/drops/${drop_id}/presort-batches"
              payload: { declared_tier: "FIVE_DIGIT", piece_count: 149 }
              as: CirculationPlanner
              captures: { batch_small_id: "$.data.id" }
            - call: "POST /catalog-circulation/drops/${drop_id}/presort-batches"
              payload: { declared_tier: "THREE_DIGIT", piece_count: 19851 }
              as: CirculationPlanner
              captures: { batch_big_id: "$.data.id" }
          trigger:
            - call: "POST /catalog-circulation/drops/${drop_id}/presort"
              payload: {}
              as: CirculationPlanner
          assert:
            - "${drop_weight} == 5920  # 148 pages * 40 milli-oz per page"
            - "PostalPresortBatch.${batch_small_id}.effective_tier == MIXED_AADC  # 149 < the 150-piece FIVE_DIGIT minimum"
            - "PostalPresortBatch.${batch_small_id}.rate_cents_per_piece == 58"
            - "PostalPresortBatch.${batch_small_id}.weight_surcharge_cents_per_piece == 17  # round_half_up(1920 * 9 / 1000)"
            - "PostalPresortBatch.${batch_small_id}.batch_postage_cents == 11175  # 149 * (58 + 17), surcharge added to the RATE before multiplying"
            - "PostalPresortBatch.${batch_small_id}.is_automation_qualified == false"
            - "PostalPresortBatch.${batch_big_id}.effective_tier == THREE_DIGIT"
            - "PostalPresortBatch.${batch_big_id}.rate_cents_per_piece == 47"
            - "PostalPresortBatch.${batch_big_id}.batch_postage_cents == 1270464  # 19851 * (47 + 17)"
            - "PostalPresortBatch.${batch_big_id}.is_automation_qualified == true"
            - "Drop.${drop_id}.automation_share_bps == 9925  # floor(19851 * 10000 / 20000); the 149 fallback pieces are excluded from the numerator"
            - "Drop.${drop_id}.automation_qualified == true"
            - "Drop.${drop_id}.postage_total_cents == 1241937  # 11175 + 1270464 = 1281639 raw, less the all-or-nothing discount 2 * 19851 = 39702"
            - "Drop.${drop_id}.postage_cents_per_book == 62  # round_half_up(1241937 / 20000)"
            - "Drop.${drop_id}.printing_cents_per_book == 385 and Drop.${drop_id}.paper_cents_per_book == 34"
            - "Drop.${drop_id}.cost_per_book_cents == 481"
            - "Drop.${drop_id}.cost_basis == PRESORTED_ACTUAL"
            - "Drop.${drop_id}.production_status == PRESORTED"
            - "CirculationLine.${line_id}.committed_cost_cents == 9480000  # frozen at the provisional 474, untouched by presort"
            - "CirculationLine.${line_id}.circulation_cost_cents == 9620000  # 20000 mailable * the FINAL 481"
            - "CirculationLine.${line_id}.contribution_cents == 14800"
            - "CirculationPlan.${plan_id}.planned_contribution_cents == 14800"

      - name: cost_per_book_per_component_rounding_order_pinned_at_306
        grounds:
          - calculations.drop_cost_per_book
          - calculations.drop_postage_total
          - calculations.drop_provisional_cost_per_book
          - calculations.line_profitability
          - entities.Drop.fields.printing_cents_per_book
          - entities.Drop.fields.paper_cents_per_book
          - entities.Drop.fields.postage_cents_per_book
          - entities.Drop.fields.cost_per_book_cents
        distinguishing_aspect: |
          MODE (b) — nested rounding order pinned: cost_per_book_cents sums THREE
          independently ROUND_HALF_UP-ed components rather than rounding the exact
          sum. At page_count 94, planned_quantity 50000 and presorted postage
          2580000 the exact components are 232.18 + 21.62 + 51.60 = 305.40; the
          pinned per-component reading is 232 + 22 + 52 = 306, so an implementation
          that rounds the total instead lands on 305 and this instance fails.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; season FW26 on the default rate card."
            - "One leaf segment S_BIG with housefile_count 50000, historical_response_rate_bps 620, avg_order_value_cents 18500."
            - "Plan P1 budget 20000000 with a COMPLETED housefile-only merge-purge run, APPROVED by a third operator."
            - "Drop 1 at page_count 94 with a single HOUSEFILE line requesting 50000 books, fully allocated (planned_quantity 50000, rebate band 500 bps)."
            - "Presort coverage of exactly 50000 pieces split 20000 FIVE_DIGIT / 30000 MIXED_AADC, so the automation share is only 4000 bps and no discount applies."
          setup_api_calls:
            - call: "POST /catalog-circulation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /catalog-circulation/seasons"
              payload: { season_code: "FW26", fiscal_year: 2026 }
              as: PlatformAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_code: "S_BIG", recency_days: 45, orders_12mo: 7, ltv_cents: 62000, housefile_count: 50000, avg_order_value_cents: 18500, historical_response_rate_bps: 620 }
              as: CirculationPlanner
              captures: { seg_big_id: "$.data.id" }
            - call: "POST /catalog-circulation/circulation-plans"
