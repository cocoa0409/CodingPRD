          - entities.SettlementBatch.fields.status
        distinguishing_aspect: "A freshly created SettlementBatch is OPEN with record_count 0, total_assessed_cents 0 and finalized_at null."
        test_recipe:
          setup:
            - "Clock at 2026-09-03T00:00:00Z; one platform; one US/USD acquirer."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /processing-platforms"
              payload: { name: "PLAT-NA-1", region_code: "NA", max_concurrent_windows: 1, blackout_buffer_days: 3 }
