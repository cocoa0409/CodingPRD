# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 breadth probe for
# task_2772 Zoological Animal Transfer & Species Survival Planning
#
# Walked row-by-row against references/claim-extraction-guide.md. Section names
# and claim_type values are taken from that guide; corners already asserted by a
# §1.8 instance are emitted as excluded_because stubs with no test_recipe.
#
# Shared fixture vocabulary (identical to SCAFFOLD_DIFFICULTY_DESIGN.yaml):
#   Cedar Ridge Zoo   US-CA  ACCREDITED  40 slots  disposition policy on file
#   Harbor Bay Zoo    US-TX  ACCREDITED  40 slots  disposition policy on file
#   Panthera uncia    SSP_RED  target 300  studbook keeper "K. Ahlgren"
#   M1 CR-101 MALE   2019-05-10  founder 12.45   at Cedar Ridge
#   F1 HB-201 FEMALE 2020-03-15  founder 30.00   at Harbor Bay
#   Logical clock default 2026-08-01T00:00:00Z unless a call moves it.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: institution_creation_returns_declared_defaults
        claim_type: creation
        grounds:
          - entities.Institution
          - endpoints[POST /institutions]
          - response_envelope.success
        distinguishing_aspect: "POST /institutions with all six declared inputs returns 201 with version 1, both slot counters at 0 and both balances at 0.00, proving the computed fields are initialised rather than left null."
        test_recipe:
          setup: ["Empty database. Clock at its 2026-08-01T00:00:00Z default."]
          setup_api_calls: []
          trigger:
            - call: "POST /institutions"
              payload: { name: "Cedar Ridge Zoo", jurisdiction_code: "US-CA", accreditation_status: "ACCREDITED", accreditation_expires_on: "2028-12-31", holding_capacity_slots: 40, disposition_policy_on_file: true }
              as: AccreditationAdmin
              captures: { sender_id: $.data.id }
          assert:
            - "Response status is 201 and response_type is 'object'"
            - "meta.api_request_id and meta.api_request_timestamp are present"
            - "Institution.${sender_id}.name == 'Cedar Ridge Zoo' and jurisdiction_code == 'US-CA'"
            - "Institution.${sender_id}.holding_capacity_slots == 40 and disposition_policy_on_file == true"
            - "Institution.${sender_id}.occupied_slots == 0 and reserved_slots == 0"
            - "Institution.${sender_id}.transfer_credit_balance == 0.00 and compliance_points_balance == 0.00"
            - "Institution.${sender_id}.version == 1 and created_at == updated_at"

      - name: animal_creation_omits_optional_parents_and_applies_state_defaults
        claim_type: defaults
        grounds:
          - entities.Animal.fields.location_status
          - entities.Animal.fields.genetic_designation
          - entities.Animal.fields.crate_training_sessions_count
          - entities.Animal.fields.sire_id
          - endpoints[POST /animals]
        distinguishing_aspect: "Creating an animal without sire_id or dam_id succeeds and stamps the declared defaults location_status HELD, genetic_designation UNEVALUATED, crate_training_sessions_count 0, last_crate_session_on null, pending_recommendation_id null."
        test_recipe:
          setup: ["Cedar Ridge Zoo and a DRAFT Panthera uncia program exist."]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Cedar Ridge Zoo", jurisdiction_code: "US-CA", accreditation_status: "ACCREDITED", accreditation_expires_on: "2028-12-31", holding_capacity_slots: 40, disposition_policy_on_file: true }
              as: AccreditationAdmin
              captures: { sender_id: $.data.id }
            - call: "POST /species-programs"
              payload: { taxon_name: "Panthera uncia", program_type: "SSP_RED", target_population_size: 300, studbook_keeper_name: "K. Ahlgren" }
              as: AccreditationAdmin
              captures: { program_id: $.data.id }
          trigger:
            - call: "POST /animals"
              payload: { species_program_id: "${program_id}", holding_institution_id: "${sender_id}", owning_institution_id: "${sender_id}", local_id: "CR-101", sex: "MALE", birth_date: "2019-05-10", founder_representation_pct: 12.45 }
              as: Registrar
              as_user_id: "${sender_id}"
              captures: { m1_id: $.data.id }
          assert:
            - "Response status is 201"
            - "Animal.${m1_id}.location_status == HELD"
            - "Animal.${m1_id}.genetic_designation == UNEVALUATED"
            - "Animal.${m1_id}.crate_training_sessions_count == 0"
            - "Animal.${m1_id}.last_crate_session_on == null"
            - "Animal.${m1_id}.pending_recommendation_id == null"
            - "Animal.${m1_id}.sire_id == null and dam_id == null"
            - "Animal.${m1_id}.version == 1"

      - name: get_species_program_returns_stored_row
        claim_type: retrieval
        grounds:
          - endpoints[GET /species-programs/{speciesProgramId}]
          - entities.SpeciesProgram
        distinguishing_aspect: "GET /species-programs/{id} echoes exactly what POST stored, including plan_status DRAFT, current_plan_cycle 1 and open_recommendation_count 0."
        test_recipe:
          setup: ["One DRAFT species program exists."]
          setup_api_calls:
            - call: "POST /species-programs"
              payload: { taxon_name: "Panthera uncia", program_type: "SSP_RED", target_population_size: 300, studbook_keeper_name: "K. Ahlgren" }
              as: AccreditationAdmin
              captures: { program_id: $.data.id }
          trigger:
            - call: "GET /species-programs/${program_id}"
              payload: {}
              as: ProgramCoordinator
              as_user_id: "${program_id}"
          assert:
            - "Response status is 200 and response_type is 'object'"
            - "SpeciesProgram.${program_id}.taxon_name == 'Panthera uncia' and program_type == SSP_RED"
            - "SpeciesProgram.${program_id}.target_population_size == 300"
            - "SpeciesProgram.${program_id}.plan_status == DRAFT"
            - "SpeciesProgram.${program_id}.current_plan_cycle == 1"
            - "SpeciesProgram.${program_id}.open_recommendation_count == 0"
            - "SpeciesProgram.${program_id}.cycle_closed_on == null"

      - name: list_animals_filtered_by_holder_and_paginated
        claim_type: listing
        grounds:
          - endpoints[GET /animals]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "GET /animals?holding_institution_id=<Cedar Ridge>&limit=1&offset=0 returns exactly one of the two Cedar Ridge animals with total_count 2 and has_more true, and offset=2 returns an empty page with has_more false."
        test_recipe:
          setup: ["Cedar Ridge Zoo holds M1 and M2; Harbor Bay Zoo holds F1."]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Cedar Ridge Zoo", jurisdiction_code: "US-CA", accreditation_status: "ACCREDITED", accreditation_expires_on: "2028-12-31", holding_capacity_slots: 40, disposition_policy_on_file: true }
              as: AccreditationAdmin
              captures: { sender_id: $.data.id }
            - call: "POST /institutions"
              payload: { name: "Harbor Bay Zoo", jurisdiction_code: "US-TX", accreditation_status: "ACCREDITED", accreditation_expires_on: "2028-12-31", holding_capacity_slots: 40, disposition_policy_on_file: true }
              as: AccreditationAdmin
              captures: { receiver_id: $.data.id }
            - call: "POST /species-programs"
              payload: { taxon_name: "Panthera uncia", program_type: "SSP_RED", target_population_size: 300, studbook_keeper_name: "K. Ahlgren" }
              as: AccreditationAdmin
              captures: { program_id: $.data.id }
            - call: "POST /animals"
              payload: { species_program_id: "${program_id}", holding_institution_id: "${sender_id}", owning_institution_id: "${sender_id}", local_id: "CR-101", sex: "MALE", birth_date: "2019-05-10", founder_representation_pct: 12.45 }
              as: Registrar
              as_user_id: "${sender_id}"
            - call: "POST /animals"
              payload: { species_program_id: "${program_id}", holding_institution_id: "${sender_id}", owning_institution_id: "${sender_id}", local_id: "CR-102", sex: "MALE", birth_date: "2019-09-01", founder_representation_pct: 22.00 }
              as: Registrar
              as_user_id: "${sender_id}"
            - call: "POST /animals"
              payload: { species_program_id: "${program_id}", holding_institution_id: "${receiver_id}", owning_institution_id: "${receiver_id}", local_id: "HB-201", sex: "FEMALE", birth_date: "2020-03-15", founder_representation_pct: 30.00 }
              as: Registrar
              as_user_id: "${receiver_id}"
          trigger:
            - call: "GET /animals"
              payload: { holding_institution_id: "${sender_id}", limit: 1, offset: 0 }
              as: AccreditationAdmin
            - call: "GET /animals"
              payload: { holding_institution_id: "${sender_id}", limit: 1, offset: 2 }
              as: AccreditationAdmin
            - call: "GET /animals"
              payload: { location_status: "HELD" }
              as: AccreditationAdmin
          assert:
            - "First call: response_type is 'array', data holds 1 animal, total_count == 2, has_more == true, limit == 1, offset == 0"
            - "First call: the returned animal's holding_institution_id == ${sender_id}"
            - "Second call: data is empty, total_count == 2, has_more == false"
            - "Third call: total_count == 3 with the default limit 10 and offset 0 applied, has_more == false"

      - name: get_animal_unknown_id_returns_animal_not_found
        claim_type: not_found
        grounds:
          - validations[priority=30, error_id=ERR_ANIMAL_NOT_FOUND]
          - errors[ERR_ANIMAL_NOT_FOUND]
          - response_envelope.error
        distinguishing_aspect: "GET /animals/{id} for an id that was never minted returns 404 with data.error_id ERR_ANIMAL_NOT_FOUND and response_type 'error', not an empty 200 object."
        test_recipe:
          setup: ["Cedar Ridge Zoo exists so the caller has a valid Registrar identity; no animals exist."]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Cedar Ridge Zoo", jurisdiction_code: "US-CA", accreditation_status: "ACCREDITED", accreditation_expires_on: "2028-12-31", holding_capacity_slots: 40, disposition_policy_on_file: true }
              as: AccreditationAdmin
              captures: { sender_id: $.data.id }
          trigger:
            - call: "GET /animals/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Registrar
              as_user_id: "${sender_id}"
          assert:
            - "Response status is 404"
            - "response_type == 'error' and data.error_id == 'ERR_ANIMAL_NOT_FOUND'"
            - "data.message is a non-empty string"

      - name: create_animal_without_sex_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=25, error_id=ERR_INVALID_REQUEST]
          - entities.Animal.fields.sex
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting the required input field sex is rejected at priority 25 with 400 ERR_INVALID_REQUEST before any existence check runs, so a bad species_program_id in the same body never surfaces."
        test_recipe:
          setup: ["Cedar Ridge Zoo and a species program exist."]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Cedar Ridge Zoo", jurisdiction_code: "US-CA", accreditation_status: "ACCREDITED", accreditation_expires_on: "2028-12-31", holding_capacity_slots: 40, disposition_policy_on_file: true }
              as: AccreditationAdmin
              captures: { sender_id: $.data.id }
            - call: "POST /species-programs"
              payload: { taxon_name: "Panthera uncia", program_type: "SSP_RED", target_population_size: 300, studbook_keeper_name: "K. Ahlgren" }
              as: AccreditationAdmin
              captures: { program_id: $.data.id }
          trigger:
            - call: "POST /animals"
              payload: { species_program_id: "${program_id}", holding_institution_id: "${sender_id}", owning_institution_id: "${sender_id}", local_id: "CR-101", birth_date: "2019-05-10", founder_representation_pct: 12.45 }
              as: Registrar
              as_user_id: "${sender_id}"
          assert:
            - "Response status is 400 and data.error_id == 'ERR_INVALID_REQUEST'"
            - "No Animal row is created: GET /animals returns total_count == 0"

      - name: create_animal_with_unknown_sex_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - validations[priority=25, error_id=ERR_INVALID_REQUEST]
          - entities.Animal.fields.sex
        distinguishing_aspect: "A well-formed body carrying sex 'NEUTER', which is outside the declared MALE|FEMALE|UNDETERMINED enum, is rejected with 400 ERR_INVALID_REQUEST by the same priority-25 rule that catches missing fields."
        test_recipe:
          setup: ["Cedar Ridge Zoo and a species program exist."]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Cedar Ridge Zoo", jurisdiction_code: "US-CA", accreditation_status: "ACCREDITED", accreditation_expires_on: "2028-12-31", holding_capacity_slots: 40, disposition_policy_on_file: true }
              as: AccreditationAdmin
              captures: { sender_id: $.data.id }
            - call: "POST /species-programs"
              payload: { taxon_name: "Panthera uncia", program_type: "SSP_RED", target_population_size: 300, studbook_keeper_name: "K. Ahlgren" }
              as: AccreditationAdmin
              captures: { program_id: $.data.id }
          trigger:
            - call: "POST /animals"
              payload: { species_program_id: "${program_id}", holding_institution_id: "${sender_id}", owning_institution_id: "${sender_id}", local_id: "CR-101", sex: "NEUTER", birth_date: "2019-05-10", founder_representation_pct: 12.45 }
              as: Registrar
              as_user_id: "${sender_id}"
          assert:
            - "Response status is 400 and data.error_id == 'ERR_INVALID_REQUEST'"
            - "GET /animals returns total_count == 0"

      - name: animal_system_fields_stamped_and_version_increments_on_write
        claim_type: system_fields
        grounds:
          - entities.Animal.fields.last_crate_session_on
          - endpoints[POST /animals/{animalId}/crate-training-sessions]
          - complexity_profile.complexity_layers
        distinguishing_aspect: "id, created_at, updated_at and version are server-minted: the animal is created at version 1 and one crate-training session raises it to version 2 while created_at is unchanged and last_crate_session_on is stamped from the submitted session_date."
        test_recipe:
          setup: ["Cedar Ridge Zoo holds M1. Clock at its 2026-08-01T00:00:00Z default."]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Cedar Ridge Zoo", jurisdiction_code: "US-CA", accreditation_status: "ACCREDITED", accreditation_expires_on: "2028-12-31", holding_capacity_slots: 40, disposition_policy_on_file: true }
              as: AccreditationAdmin
              captures: { sender_id: $.data.id }
            - call: "POST /species-programs"
              payload: { taxon_name: "Panthera uncia", program_type: "SSP_RED", target_population_size: 300, studbook_keeper_name: "K. Ahlgren" }
              as: AccreditationAdmin
              captures: { program_id: $.data.id }
            - call: "POST /animals"
              payload: { species_program_id: "${program_id}", holding_institution_id: "${sender_id}", owning_institution_id: "${sender_id}", local_id: "CR-101", sex: "MALE", birth_date: "2019-05-10", founder_representation_pct: 12.45 }
              as: Registrar
              as_user_id: "${sender_id}"
              captures: { m1_id: $.data.id, m1_v1: $.data.version }
          trigger:
            - call: "POST /animals/${m1_id}/crate-training-sessions"
              payload: { session_date: "2026-07-28", trainer_name: "T Rios", duration_minutes: 25 }
              as: Registrar
              as_user_id: "${sender_id}"
          assert:
            - "The captured ${m1_v1} == 1"
            - "Animal.${m1_id}.version == 2 after the session"
            - "Animal.${m1_id}.created_at is unchanged and updated_at is now 2026-08-01T00:00:00Z"
            - "Animal.${m1_id}.crate_training_sessions_count == 1"
            - "Animal.${m1_id}.last_crate_session_on == 2026-07-28"

      - name: crate_training_session_on_unknown_animal_returns_animal_not_found
        claim_type: parent_relationships
        grounds:
          - endpoints[POST /animals/{animalId}/crate-training-sessions]
          - validations[priority=30, error_id=ERR_ANIMAL_NOT_FOUND]
        distinguishing_aspect: "The nested crate-training route validates its path parent first: an unknown animalId returns 404 ERR_ANIMAL_NOT_FOUND rather than 400 for the body or 403 for the actor."
        test_recipe:
          setup: ["Cedar Ridge Zoo exists; no animals exist."]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Cedar Ridge Zoo", jurisdiction_code: "US-CA", accreditation_status: "ACCREDITED", accreditation_expires_on: "2028-12-31", holding_capacity_slots: 40, disposition_policy_on_file: true }
              as: AccreditationAdmin
              captures: { sender_id: $.data.id }
          trigger:
            - call: "POST /animals/00000000-0000-4000-8000-0000000000aa/crate-training-sessions"
              payload: { session_date: "2026-07-28", trainer_name: "T Rios", duration_minutes: 25 }
              as: Registrar
              as_user_id: "${sender_id}"
          assert:
            - "Response status is 404 and data.error_id == 'ERR_ANIMAL_NOT_FOUND'"

      - name: create_animal_with_unknown_species_program_returns_program_not_found
        claim_type: flat
        grounds:
          - complexity_profile.entity_topology
          - validations[priority=30, error_id=ERR_SPECIES_PROGRAM_NOT_FOUND]
          - entities.Animal.fields.species_program_id
        distinguishing_aspect: "Flat-topology FK integrity: a body FK that names no existing row is rejected with 404 ERR_SPECIES_PROGRAM_NOT_FOUND, and body FKs are checked in the §1.1 field order so the program is reported before the institutions."
        test_recipe:
          setup: ["Cedar Ridge Zoo exists; no species program exists."]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Cedar Ridge Zoo", jurisdiction_code: "US-CA", accreditation_status: "ACCREDITED", accreditation_expires_on: "2028-12-31", holding_capacity_slots: 40, disposition_policy_on_file: true }
              as: AccreditationAdmin
              captures: { sender_id: $.data.id }
          trigger:
            - call: "POST /animals"
              payload: { species_program_id: "00000000-0000-4000-8000-0000000000bb", holding_institution_id: "${sender_id}", owning_institution_id: "${sender_id}", local_id: "CR-101", sex: "MALE", birth_date: "2019-05-10", founder_representation_pct: 12.45 }
              as: Registrar
              as_user_id: "${sender_id}"
          assert:
            - "Response status is 404 and data.error_id == 'ERR_SPECIES_PROGRAM_NOT_FOUND'"
            - "GET /animals returns total_count == 0"

      - name: recommendation_computed_verdict_fields_are_server_derived
        claim_type: computed_fields
        grounds:
          - entities.PopulationRecommendation.fields.projected_offspring_inbreeding
          - calculations.kinship_and_pairing_verdict
        excluded_because:
          difficulty_instance: dual_variant_calc / pedigree_only_vs_molecular_projected_inbreeding
          rationale: "That instance pins kinship_coefficient, projected_offspring_inbreeding and pairing_verdict as computed outputs under both analysis modes on creation, including the case where a submitted molecular_similarity_pct is stored but ignored."

  - section: state_machines
    instances:
      - name: transfer_agreement_initial_state_is_draft
        claim_type: initial_state
        grounds:
          - state_machines[TransferAgreement].initial_state
          - endpoints[POST /transfer-agreements]
          - entities.TransferAgreement.fields.round_number
        distinguishing_aspect: "A freshly founded agreement is DRAFT with round_number 0 and last_action_institution_id null, so the very first offer is round 1 and no counterparty-turn history exists yet."
        test_recipe:
          setup: ["Both institutions, a PUBLISHED program, M1 at Cedar Ridge, F1 at Harbor Bay, and an ENDORSED BREED_WITH recommendation for M1 exist."]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Cedar Ridge Zoo", jurisdiction_code: "US-CA", accreditation_status: "ACCREDITED", accreditation_expires_on: "2028-12-31", holding_capacity_slots: 40, disposition_policy_on_file: true }
              as: AccreditationAdmin
              captures: { sender_id: $.data.id }
            - call: "POST /institutions"
              payload: { name: "Harbor Bay Zoo", jurisdiction_code: "US-TX", accreditation_status: "ACCREDITED", accreditation_expires_on: "2028-12-31", holding_capacity_slots: 40, disposition_policy_on_file: true }
              as: AccreditationAdmin
              captures: { receiver_id: $.data.id }
            - call: "POST /species-programs"
              payload: { taxon_name: "Panthera uncia", program_type: "SSP_RED", target_population_size: 300, studbook_keeper_name: "K. Ahlgren" }
              as: AccreditationAdmin
              captures: { program_id: $.data.id }
            - call: "POST /species-programs/${program_id}/publish-plan"
              payload: {}
              as: ProgramCoordinator
              as_user_id: "${program_id}"
            - call: "POST /animals"
              payload: { species_program_id: "${program_id}", holding_institution_id: "${sender_id}", owning_institution_id: "${sender_id}", local_id: "CR-101", sex: "MALE", birth_date: "2019-05-10", founder_representation_pct: 12.45 }
              as: Registrar
              as_user_id: "${sender_id}"
              captures: { m1_id: $.data.id, m1_v1: $.data.version }
            - call: "POST /animals"
              payload: { species_program_id: "${program_id}", holding_institution_id: "${receiver_id}", owning_institution_id: "${receiver_id}", local_id: "HB-201", sex: "FEMALE", birth_date: "2020-03-15", founder_representation_pct: 30.00 }
              as: Registrar
              as_user_id: "${receiver_id}"
              captures: { f1_id: $.data.id }
            - call: "POST /population-recommendations"
              payload: { species_program_id: "${program_id}", recommendation_type: "BREED_WITH", subject_animal_id: "${m1_id}", paired_animal_id: "${f1_id}", sending_institution_id: "${sender_id}", receiving_institution_id: "${receiver_id}", analysis_mode: "PEDIGREE_ONLY", priority_rank: 1, expires_on: "2026-12-31", expected_subject_animal_version: "${m1_v1}" }
              as: ProgramCoordinator
              as_user_id: "${program_id}"
              captures: { rec_id: $.data.id }
            - call: "POST /population-recommendations/${rec_id}/endorse"
              payload: {}
              as: Registrar
              as_user_id: "${sender_id}"
          trigger:
            - call: "POST /transfer-agreements"
              payload: { recommendation_id: "${rec_id}", animal_id: "${m1_id}", sending_institution_id: "${sender_id}", receiving_institution_id: "${receiver_id}", ownership_disposition: "OWNERSHIP_TRANSFER", offspring_disposition_rule: "SPLIT_50_50", breeding_rights: "FULL", transport_cost_share_pct: 51.0 }
              as: Registrar
              as_user_id: "${sender_id}"
              captures: { ta_id: $.data.id }
          assert:
            - "Response status is 201"
            - "TransferAgreement.${ta_id}.status == DRAFT"
            - "TransferAgreement.${ta_id}.round_number == 0"
            - "TransferAgreement.${ta_id}.last_action_institution_id == null"
            - "TransferAgreement.${ta_id}.provisional_credit_points == null and final_credit_points == null"
            - "TransferAgreement.${ta_id}.executed_at == null and delivered_at == null"
            - "TransferAgreement.${ta_id}.transfer_scope == INTERSTATE, derived from US-CA sending and US-TX receiving"
            - "TransferAgreement.${ta_id}.version == 1"

      - name: publish_plan_moves_program_to_published_and_unlocks_recommendations
        claim_type: valid_transition
        grounds:
          - state_machines[SpeciesProgram].transitions[DRAFT->PUBLISHED]
          - endpoints[POST /species-programs/{speciesProgramId}/publish-plan]
        distinguishing_aspect: "publish-plan flips plan_status DRAFT -> PUBLISHED while leaving current_plan_cycle at 1 (the first publication does not advance the cycle), and the recommendation that was blocked a moment earlier now succeeds."
        test_recipe:
          setup: ["Cedar Ridge Zoo, a DRAFT program and M1 exist."]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Cedar Ridge Zoo", jurisdiction_code: "US-CA", accreditation_status: "ACCREDITED", accreditation_expires_on: "2028-12-31", holding_capacity_slots: 40, disposition_policy_on_file: true }
              as: AccreditationAdmin
              captures: { sender_id: $.data.id }
            - call: "POST /species-programs"
              payload: { taxon_name: "Panthera uncia", program_type: "SSP_RED", target_population_size: 300, studbook_keeper_name: "K. Ahlgren" }
              as: AccreditationAdmin
              captures: { program_id: $.data.id }
            - call: "POST /animals"
              payload: { species_program_id: "${program_id}", holding_institution_id: "${sender_id}", owning_institution_id: "${sender_id}", local_id: "CR-101", sex: "MALE", birth_date: "2019-05-10", founder_representation_pct: 12.45 }
