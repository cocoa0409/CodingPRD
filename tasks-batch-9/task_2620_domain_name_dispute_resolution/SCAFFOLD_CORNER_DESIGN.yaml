        grounds:
          - state_machines.Case.FILED_to_DEFICIENT
          - state_machines.Case.DEFICIENT_to_FILED
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: non_linear_state_machine / case_deficiency_correction_cycle_runs_twice_then_hits_the_round_limit
          rationale: "That instance drives the cyclic shape end to end - two full FILED -> DEFICIENT -> FILED laps, the notice rows moving OPEN -> CURED, and the third notice rejected by MAX_DEFICIENCY_ROUNDS - which is exactly the cyclic loop-count claim for this machine."

      - name: decision_status_and_publication_status_are_independent_dimensions
