              payload: { bed_id: "${bed_p}", check_in_date: "2026-08-13", planned_nights: 1 }
              as: ShelterCoordinator
              as_user_id: "${sc_id}"
              captures: { s_p2: $.data.id, s_p2_status: $.data.status }
          assert:
            - "plain bed: back-to-back turnover allowed — stay ${s_n2} RESERVED at check_in 2026-08-12 == prior checkout day"
            - "PET bed: ${s_p} has check_out_exclusive 2026-08-12 but buffer_until_exclusive 2026-08-13"
            - "PET bed: check_in 2026-08-12 -> 409 ERR_BED_NOT_AVAILABLE (inside the sanitation buffer)"
            - "PET bed: check_in 2026-08-13 -> RESERVED (buffer expired; half-open edge at buffer_until is free)"

      - name: client_double_booking_night_intersection_with_turnover_allowed
        grounds:
          - calculations.shelter_stay_windows
          - errors[ERR_CLIENT_STAY_OVERLAP]
        distinguishing_aspect: |
          Resource = Client, semantics = CLOSED night-set intersection (no buffer concept):
          a client holding nights {08-10, 08-11} on bed A is rejected for a second stay whose
          first night is 08-11 (shared night), yet a stay starting 08-12 — the prior stay's
          checkout day — is fine because the night sets are disjoint. Different entity and
          different interval arithmetic from the PET-buffer bed rule (which forbids the
          08-12 turnover the client rule permits).
        test_recipe:
          setup:
            - "Shelter-eligible ACTIVE client; two plain AVAILABLE beds A and B"
            - "Stay s1 on bed A: [2026-08-10, +2n) occupying nights 08-10 and 08-11"
          setup_api_calls:
