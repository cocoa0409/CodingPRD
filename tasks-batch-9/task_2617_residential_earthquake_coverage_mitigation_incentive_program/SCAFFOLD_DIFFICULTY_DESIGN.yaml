              payload: { policy_id: "${pol_id}", event_id: "${ev_id}", structural_damage_cents: 20000000, cosmetic_damage_cents: 5000000, contents_damage_cents: 2500000, loss_of_use_cents: 1200000, expected_event_version: "${ev_v}" }
              as: ClaimAdjuster
              captures: { cl_id: $.data.id }
