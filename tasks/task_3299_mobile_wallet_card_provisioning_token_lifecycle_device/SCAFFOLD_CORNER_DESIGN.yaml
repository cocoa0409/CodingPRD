              as: IssuerOperator
              captures: { a1: $.data.id }
            - call: "POST /payment-tokens/${tok_id}/authorizations"
              payload: { cryptogram: "ok2", amount_cents: 2000, currency: "USD", merchant_id: "m-2", merchant_category: "GENERAL", biometric_verified: true }
