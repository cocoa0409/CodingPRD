        distinguishing_aspect: "Auth (priority 1) precedes existence (priority 4): a request with no X-User-Role/X-User-ID against a non-existent cycle id returns 401 ERR_UNAUTHENTICATED, never 404."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/cycles/00000000-0000-0000-0000-0000000000ab", captures: { err: $.data.error_id } }
