      - name: tag_void_restores_bag_accounting
        grounds:
          - calculations.tag_bag_accounting
          - state_machines.CertificationTag.ISSUED_to_VOIDED
          - state_machines.SeedLot.certification_status_TAGGED_to_PASSED
        distinguishing_aspect: |
          A THIRD CONSERVED QUANTITY - tagged bag inventory, expressed as SeedLot.tagged_bag_count == the sum of
          bag_count over the lot's ISSUED tags, with the contract-level roll-up
          certified_units_total == the sum of final_clean_units over TAGGED lots. Voiding the only tag must walk
          both ledgers back and return the certification axis to PASSED, while leaving the physical bag_count
          untouched: bags still exist, they are simply no longer certified.
        test_recipe:
          setup:
            - "Golden lot bagged at 34501.25 kg with bag_count 1380 and final_clean_units 1380.05"
            - "INITIAL sample passed at germination 96.0 / purity 99.6, and all 1380 bags carry one CERTIFIED tag"
