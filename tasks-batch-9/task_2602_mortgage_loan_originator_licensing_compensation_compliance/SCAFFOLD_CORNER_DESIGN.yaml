      - name: withdraw_loan_cascades_submitted_pricing_exception_to_withdrawn
        claim_type: side_effect_execution
        grounds:
          - state_machines.LoanApplication.TAKEN_to_WITHDRAWN
          - state_machines.PricingException.SUBMITTED_to_WITHDRAWN
          - entities.PricingException.fields.comp_impact_cents
        distinguishing_aspect: |
          Withdrawing a LOCKED loan drives both declared side effects: the loan's SUBMITTED
          PricingException moves to WITHDRAWN with comp_impact_cents 0 and
          decided_by_user_id null, and the loan's compensation_status is reset to
          NOT_APPLICABLE.
        test_recipe:
          setup:
            - "Originator 2200001 with an ACTIVE, sponsored CA licence; one loan locked at
               20000000 cents; one SUBMITTED PricingException on that loan for a 150000-cent
               concession (cap floor(20000000*2/100) = 400000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /originators"
              payload: { nmls_unique_id: "2200001", legal_name: "Avery Lane", hire_date: "2024-01-15T00:00:00Z" }
