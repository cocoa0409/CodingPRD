              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { err: $.data.error_id }
          assert:
            - "seq_status_now == READY (permit expiry does not cascade the sequence state)"
            - "err == ERR_PERMIT_MISSING_OR_WINDOW_MISMATCH, http 422 — execution create re-checks Permit window at the current clock (2026-08-11 > valid_until 2026-08-10)"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (performer half-open vs facility buffered)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: ro_rehearsal_performer_half_open
        grounds:
          - calculations.overlap_checks
          - validations[priority=10]
        distinguishing_aspect: |
          Resource: StuntPerformer; interval semantics: half-open [start, end) with ZERO buffer — a 10:30-11:30
          rehearsal conflicts with an existing 10:00-11:00 booking, while exact adjacency (11:00-12:00) is
          allowed. Distinct from the facility rule's 30-minute buffered semantics.
        test_recipe:
          setup:
            - "ACTIVE production; DESIGN_LOCKED LOW/FIGHT sequence; QUALIFIED FIGHT performer with rehearsal 10:00-11:00"
          setup_api_calls:
            - call: "POST /api/productions"
              payload: { name: "Overlap Prod", total_budget_cents: 10000000 }
              as: ProductionExecutive
              captures: { prod_id: $.data.id }
            - call: "POST /api/productions/${prod_id}/file-insurance"
              payload: { declared_exposure_cents: 50000000 }
              as: ProductionExecutive
            - call: "POST /api/productions/${prod_id}/activate"
              as: ProductionExecutive
            - call: "POST /api/stunt-sequences"
              payload: { production_id: "${prod_id}", name: "Ov Seq", hazard_class: "FIGHT", risk_category: "LOW", scheduled_execution_start: "2026-08-05T00:00:00Z", scheduled_execution_end: "2026-08-06T00:00:00Z", required_equipment_ids: [] }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { seq_id: $.data.id, seq_v: $.data.version }
            - call: "POST /api/risk-assessments"
              payload: { production_id: "${prod_id}", sequence_id: "${seq_id}", severity_rating: 2, likelihood_rating: 2, expected_sequence_version: "${seq_v}" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { ra_id: $.data.id }
            - call: "POST /api/risk-assessments/${ra_id}/submit"
              as: StuntCoordinator
              as_user_id: "coord-1"
            - call: "POST /api/risk-assessments/${ra_id}/approve"
              as: SafetyOfficer
              as_user_id: "so-1"
            - call: "POST /api/stunt-sequences/${seq_id}/lock-design"
              as: StuntCoordinator
              as_user_id: "coord-1"
            - call: "POST /api/performers"
              payload: { production_id: "${prod_id}", first_name: "Noa", last_name: "Fo", base_day_rate_cents: 150000, union_status: "NON_UNION" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { perf_id: $.data.id }
            - call: "POST /api/certifications"
              payload: { performer_id: "${perf_id}", discipline: "FIGHT", level: "BASIC", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: StuntCoordinator
              as_user_id: "coord-1"
            - call: "POST /api/rehearsals"
              payload: { production_id: "${prod_id}", sequence_id: "${seq_id}", performer_id: "${perf_id}", facility: "Stage 1", scheduled_start: "2026-08-02T10:00:00Z", scheduled_end: "2026-08-02T11:00:00Z" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /api/rehearsals"
              payload: { production_id: "${prod_id}", sequence_id: "${seq_id}", performer_id: "${perf_id}", facility: "Stage 1", scheduled_start: "2026-08-02T10:30:00Z", scheduled_end: "2026-08-02T11:30:00Z" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { err_overlap: $.data.error_id }
            - call: "POST /api/rehearsals"
              payload: { production_id: "${prod_id}", sequence_id: "${seq_id}", performer_id: "${perf_id}", facility: "Stage 1", scheduled_start: "2026-08-02T11:00:00Z", scheduled_end: "2026-08-02T12:00:00Z" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { r3: $.data.id, r3_status: $.data.status }
          assert:
            - "Overlap rejected: err_overlap == ERR_REHEARSAL_CONFLICT, http 409 (10:30 < 11:00 and 10:00 < 11:30)"
            - "Exact adjacency allowed: r3_status == SCHEDULED (11:00 == existing end — half-open semantics)"

      - name: ro_meeting_facility_buffered_gap
        grounds:
          - calculations.overlap_checks
          - validations[priority=10]
        distinguishing_aspect: |
          Resource: facility (a string field on SafetyMeeting, a different resource entity than the performer);
          interval semantics: symmetric 1800-second buffer — a meeting starting 20 minutes after another ends at
          the same facility is rejected, while a gap of exactly 1800 seconds is allowed (strict <).
        test_recipe:
          setup:
            - "ACTIVE production; two DESIGN_LOCKED sequences; meeting A at Stage 9, 10:00-11:00"
          setup_api_calls:
            - call: "POST /api/productions"
              payload: { name: "Facility Prod", total_budget_cents: 10000000 }
              as: ProductionExecutive
              captures: { prod_id: $.data.id }
            - call: "POST /api/productions/${prod_id}/file-insurance"
              payload: { declared_exposure_cents: 50000000 }
              as: ProductionExecutive
            - call: "POST /api/productions/${prod_id}/activate"
              as: ProductionExecutive
            - call: "POST /api/stunt-sequences"
              payload: { production_id: "${prod_id}", name: "Fac Seq 1", hazard_class: "FIGHT", risk_category: "LOW", scheduled_execution_start: "2026-08-05T00:00:00Z", scheduled_execution_end: "2026-08-06T00:00:00Z", required_equipment_ids: [] }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { seq1: $.data.id, seq1_v: $.data.version }
            - call: "POST /api/risk-assessments"
              payload: { production_id: "${prod_id}", sequence_id: "${seq1}", severity_rating: 2, likelihood_rating: 2, expected_sequence_version: "${seq1_v}" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { ra1: $.data.id }
            - call: "POST /api/risk-assessments/${ra1}/submit"
              as: StuntCoordinator
              as_user_id: "coord-1"
            - call: "POST /api/risk-assessments/${ra1}/approve"
              as: SafetyOfficer
              as_user_id: "so-1"
            - call: "POST /api/stunt-sequences/${seq1}/lock-design"
              as: StuntCoordinator
              as_user_id: "coord-1"
            - call: "POST /api/stunt-sequences"
              payload: { production_id: "${prod_id}", name: "Fac Seq 2", hazard_class: "FIGHT", risk_category: "LOW", scheduled_execution_start: "2026-08-05T00:00:00Z", scheduled_execution_end: "2026-08-06T00:00:00Z", required_equipment_ids: [] }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { seq2: $.data.id, seq2_v: $.data.version }
            - call: "POST /api/risk-assessments"
              payload: { production_id: "${prod_id}", sequence_id: "${seq2}", severity_rating: 2, likelihood_rating: 2, expected_sequence_version: "${seq2_v}" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { ra2: $.data.id }
            - call: "POST /api/risk-assessments/${ra2}/submit"
              as: StuntCoordinator
              as_user_id: "coord-1"
            - call: "POST /api/risk-assessments/${ra2}/approve"
              as: SafetyOfficer
              as_user_id: "so-1"
            - call: "POST /api/stunt-sequences/${seq2}/lock-design"
              as: StuntCoordinator
              as_user_id: "coord-1"
            - call: "POST /api/safety-meetings"
              payload: { production_id: "${prod_id}", sequence_id: "${seq1}", facility: "Stage 9", scheduled_start: "2026-08-03T10:00:00Z", scheduled_end: "2026-08-03T11:00:00Z" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { mtg_a: $.data.id }
          trigger:
            - call: "POST /api/safety-meetings"
              payload: { production_id: "${prod_id}", sequence_id: "${seq2}", facility: "Stage 9", scheduled_start: "2026-08-03T11:20:00Z", scheduled_end: "2026-08-03T12:00:00Z" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { err_buf: $.data.error_id }
            - call: "POST /api/safety-meetings"
              payload: { production_id: "${prod_id}", sequence_id: "${seq2}", facility: "Stage 9", scheduled_start: "2026-08-03T11:30:00Z", scheduled_end: "2026-08-03T12:00:00Z" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { mtg_b: $.data.id, mtg_b_status: $.data.status }
          assert:
            - "20-minute gap rejected: err_buf == ERR_FACILITY_BUFFER_CONFLICT, http 409 (11:20 < 11:00 + 1800s)"
            - "Exactly 1800s gap allowed: mtg_b_status == SCHEDULED (11:30 == 11:00 + 1800s — strict < boundary)"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (money on Production; minutes on Sequence/Performer)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: ci_committed_pay_conservation
        grounds:
          - entities.Production.fields.committed_pay_cents
          - state_machines.PayAdjustment.AGREED_to_VOIDED
          - state_machines.StuntSequence (cancel transition)
          - calculations.production_cost_rollup
        distinguishing_aspect: |
          Conserved quantity: money. Invariant: Production.committed_pay_cents == SUM(final_amount_cents) over
          AGREED PayAdjustments. Forward action (agree, +220000) paired with its compensating action (sequence
          cancel voids the agreement, -220000) leaves the quantity at its original value 0.
        test_recipe:
          setup:
            - "Production SETUP budget 10000000; LOW/FIGHT DRAFT sequence; QUALIFIED performer; adjustment AGREED"
          setup_api_calls:
            - call: "POST /api/productions"
              payload: { name: "Money Prod", total_budget_cents: 10000000 }
              as: ProductionExecutive
              captures: { prod_id: $.data.id }
            - call: "POST /api/stunt-sequences"
              payload: { production_id: "${prod_id}", name: "Money Seq", hazard_class: "FIGHT", risk_category: "LOW", scheduled_execution_start: "2026-08-05T00:00:00Z", scheduled_execution_end: "2026-08-06T00:00:00Z", required_equipment_ids: [] }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { seq_id: $.data.id }
            - call: "POST /api/performers"
              payload: { production_id: "${prod_id}", first_name: "Pam", last_name: "Fi", base_day_rate_cents: 200000, union_status: "NON_UNION" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { perf_id: $.data.id }
            - call: "POST /api/certifications"
              payload: { performer_id: "${perf_id}", discipline: "FIGHT", level: "BASIC", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: StuntCoordinator
              as_user_id: "coord-1"
            - call: "POST /api/pay-adjustments"
              payload: { production_id: "${prod_id}", sequence_id: "${seq_id}", performer_id: "${perf_id}", adjustment_type: "HAZARD_BUMP", base_amount_cents: 200000, requested_pct: 0.10 }
              as: Performer
              as_user_id: "${perf_id}"
              captures: { adj_id: $.data.id }
            - call: "POST /api/pay-adjustments/${adj_id}/agree"
              as: StuntCoordinator
              as_user_id: "coord-1"
          trigger:
            - call: "GET /api/productions/${prod_id}"
              as: ProductionExecutive
              captures: { committed_mid: $.data.committed_pay_cents }
            - call: "POST /api/stunt-sequences/${seq_id}/cancel"
              payload: { reason: "scene cut" }
              as: StuntCoordinator
              as_user_id: "coord-1"
            - call: "GET /api/pay-adjustments/${adj_id}"
              as: ProductionExecutive
              captures: { adj_status: $.data.status }
            - call: "GET /api/productions/${prod_id}"
              as: ProductionExecutive
              captures: { committed_end: $.data.committed_pay_cents }
          assert:
            - "After agree: committed_mid == 220000 (200000 + 20000)"
            - "After sequence cancel: PayAdjustment.${adj_id}.status == VOIDED (compensation executed)"
            - "committed_end == 0 — forward + compensating actions leave committed_pay_cents unchanged"

      - name: ci_rehearsal_minutes_conservation
        grounds:
          - entities.StuntSequence.fields.completed_rehearsal_minutes
          - entities.StuntPerformer.fields.completed_rehearsal_minutes
          - state_machines.Rehearsal.COMPLETED_to_VOIDED
        distinguishing_aspect: |
          Conserved quantity: rehearsal time (different type than money). Invariant: completed_rehearsal_minutes
          == SUM(duration_minutes of COMPLETED rehearsals). Complete (+90 on sequence and performer) paired with
          void-completion (-90) returns both aggregates to 0, and completed_rehearsal_count returns to 0.
        test_recipe:
          setup:
            - "ACTIVE production; DESIGN_LOCKED LOW/FIGHT sequence; QUALIFIED performer; one 90-minute rehearsal COMPLETED"
          setup_api_calls:
            - call: "POST /api/productions"
              payload: { name: "Time Prod", total_budget_cents: 10000000 }
              as: ProductionExecutive
              captures: { prod_id: $.data.id }
            - call: "POST /api/productions/${prod_id}/file-insurance"
              payload: { declared_exposure_cents: 50000000 }
              as: ProductionExecutive
            - call: "POST /api/productions/${prod_id}/activate"
              as: ProductionExecutive
            - call: "POST /api/stunt-sequences"
              payload: { production_id: "${prod_id}", name: "Time Seq", hazard_class: "FIGHT", risk_category: "LOW", scheduled_execution_start: "2026-08-05T00:00:00Z", scheduled_execution_end: "2026-08-06T00:00:00Z", required_equipment_ids: [] }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { seq_id: $.data.id, seq_v: $.data.version }
            - call: "POST /api/risk-assessments"
              payload: { production_id: "${prod_id}", sequence_id: "${seq_id}", severity_rating: 2, likelihood_rating: 2, expected_sequence_version: "${seq_v}" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { ra_id: $.data.id }
            - call: "POST /api/risk-assessments/${ra_id}/submit"
              as: StuntCoordinator
              as_user_id: "coord-1"
            - call: "POST /api/risk-assessments/${ra_id}/approve"
              as: SafetyOfficer
              as_user_id: "so-1"
            - call: "POST /api/stunt-sequences/${seq_id}/lock-design"
              as: StuntCoordinator
              as_user_id: "coord-1"
            - call: "POST /api/performers"
              payload: { production_id: "${prod_id}", first_name: "Quinn", last_name: "Si", base_day_rate_cents: 150000, union_status: "NON_UNION" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { perf_id: $.data.id }
            - call: "POST /api/certifications"
              payload: { performer_id: "${perf_id}", discipline: "FIGHT", level: "BASIC", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: StuntCoordinator
              as_user_id: "coord-1"
            - call: "POST /api/rehearsals"
              payload: { production_id: "${prod_id}", sequence_id: "${seq_id}", performer_id: "${perf_id}", facility: "Stage 1", scheduled_start: "2026-08-02T10:00:00Z", scheduled_end: "2026-08-02T11:30:00Z" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { reh_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T10:30:00Z" }
              as: ProductionExecutive
            - call: "POST /api/rehearsals/${reh_id}/complete"
              as: StuntCoordinator
              as_user_id: "coord-1"
          trigger:
            - call: "GET /api/stunt-sequences/${seq_id}"
              as: StuntCoordinator
              captures: { seq_min_mid: $.data.completed_rehearsal_minutes, seq_cnt_mid: $.data.completed_rehearsal_count }
            - call: "GET /api/performers/${perf_id}"
              as: StuntCoordinator
              captures: { perf_min_mid: $.data.completed_rehearsal_minutes }
            - call: "POST /api/rehearsals/${reh_id}/void-completion"
              payload: { reason: "logged in error" }
              as: SafetyOfficer
              as_user_id: "so-1"
            - call: "GET /api/stunt-sequences/${seq_id}"
              as: StuntCoordinator
              captures: { seq_min_end: $.data.completed_rehearsal_minutes, seq_cnt_end: $.data.completed_rehearsal_count }
            - call: "GET /api/performers/${perf_id}"
              as: StuntCoordinator
              captures: { perf_min_end: $.data.completed_rehearsal_minutes }
            - call: "GET /api/rehearsals/${reh_id}"
              as: StuntCoordinator
              captures: { reh_status: $.data.status }
          assert:
            - "After complete: seq_min_mid == 90 and seq_cnt_mid == 1 and perf_min_mid == 90"
            - "reh_status == VOIDED after the compensating action"
            - "seq_min_end == 0 and seq_cnt_end == 0 and perf_min_end == 0 — forward + compensation conserve the totals"
