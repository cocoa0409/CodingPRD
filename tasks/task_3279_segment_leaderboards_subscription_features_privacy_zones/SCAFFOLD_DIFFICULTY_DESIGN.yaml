            - call: "POST /v1/athletes/${am_cas}/activities"
              payload: { device_source: "mobile-app", sport_type: "RUN", started_at: "2026-09-01T10:00:00Z", duration_s: 3600, distance_m: 12000, track_points: [{lat: 39.00, lng: -124.00, t_offset_s: 0}, {lat: 39.10, lng: -124.00, t_offset_s: 3600}], start_lat: 39.00, start_lng: -124.00, end_lat: 39.10, end_lng: -124.00, idempotency_key: "cas-1" }
              as: Athlete
              as_user_id: "${am_cas}"
          trigger:
            - call: "POST /v1/clubs/${club_cas}/archive"
              payload: {}
              as: Athlete
              as_user_id: "${ao_cas}"
            - call: "GET /v1/challenges/${ch_cas}"
              as: Athlete
              as_user_id: "${ao_cas}"
              captures: { ch_cas_state: $.data.status }
            - call: "GET /v1/participations/${part_cas}"
              as: Athlete
              as_user_id: "${am_cas}"
              captures: { part_cas_state: $.data.status, part_cas_prog: $.data.progress_value }
          assert:
            - "Club.${club_cas}.status == ARCHIVED"
            - "Challenge.${ch_cas}.status == CANCELLED (hop 1)"
            - "ChallengeParticipation.${part_cas}.status == WITHDRAWN (hop 2 caused by hop 1, not by the archive directly)"
            - "ChallengeParticipation.${part_cas}.progress_value == 12000 (frozen at cascade time)"

      - name: flag_uphold_autohide_cascade
        grounds:
          - state_machines.Flag
          - state_machines.Activity.flag_status
          - state_machines.SegmentEffort
          - entities.Athlete.fields.safety_score
        distinguishing_aspect: |
          Depth-3 chain from a DIFFERENT trigger (flag uphold, not club
          archive): Flag OPEN -> UPHELD drives SegmentEffort FLAGGED ->
          EXCLUDED (hop 1), drives host Activity flag_status FLAGGED ->
          CONFIRMED (hop 2), whose safety_score penalty crossing below 50 sets
          auto_hidden on ALL of the athlete's COMPLETED activities (hop 3).
        test_recipe:
          setup:
            - "Athlete V (violator, safety_score 100) and athlete Q (reporter) exist"
            - "Segment SU: RUN 1000m ACTIVE"
            - "V has three COMPLETED RUN activities A1, A2, A3; each matched SU with a legit 100s effort (efforts E1, E2, E3 ELIGIBLE)"
