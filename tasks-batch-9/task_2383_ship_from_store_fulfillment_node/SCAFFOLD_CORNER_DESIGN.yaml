            - "GET /order-lines?order_id=${o1} still reports total_count 1"
            - "CustomerOrder.${o1}.total_units == 2 and unassigned_units == 2"

      - name: a_second_line_is_accepted_while_the_order_is_still_unrouted
        claim_type: satisfaction_to_pass
        grounds:
          - validations.priority_12
          - endpoints.POST /fulfillment-network/orders/{order_id}/lines
        distinguishing_aspect: "The same priority-12 check passes when routing_status is still UNROUTED: the second line is created, total_units rises 2 -> 5 and the order version reaches 3, proving the refusal above is state-driven rather than a blanket single-line rule."
        test_recipe:
          setup:
            - "Clock 09:00; SKU-A and SKU-B exist; order O1 has exactly one line SKU-A x2 and no RoutingRun."
          setup_api_calls:
            - call: "POST /fulfillment-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: NetworkPlanner
            - call: "POST /fulfillment-network/skus"
              payload: { sku_code: "SKU-A", unit_weight_grams: 800, unit_price_cents: 4500, package_class: "MEDIUM", hazmat_flag: false }
              as: NetworkPlanner
              captures: { sku_a: "$.data.id" }
            - call: "POST /fulfillment-network/skus"
              payload: { sku_code: "SKU-B", unit_weight_grams: 250, unit_price_cents: 1900, package_class: "SMALL", hazmat_flag: false }
              as: NetworkPlanner
              captures: { sku_b: "$.data.id" }
            - call: "POST /fulfillment-network/orders"
              payload: { order_code: "O-B101", customer_ref: "C-311", destination_zone: 4, service_level: "GROUND", promised_ship_by_utc: "2026-08-03T15:00:00Z" }
              as: CustomerCare
              captures: { o1: "$.data.id" }
