      - name: label_uniqueness_is_scoped_to_the_owning_election
        claim_type: Error Triggerable
        grounds:
          - errors[ERR_DUPLICATE_CONTEST_LABEL]
          - errors[ERR_DUPLICATE_TEAM_LABEL]
          - validations[priority=35]
        distinguishing_aspect: |
          Both labels are unique per election, not globally: repeating C1 or T-1 inside election ST-01 is
          refused 409, while the identical labels are accepted in election ST-02 in the same request
          sequence.
        test_recipe:
          setup:
            - "Two elections, ST-01 holding contest C1 and team T-1, and ST-02 holding nothing yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
