        distinguishing_aspect: |
          The defaults are load-bearing rather than cosmetic: a writer created with no credits lands on
          STAFF_WRITER (so a STORY_EDITOR seat for them would be refused), a seat created with no
          episodic_guarantee_count gets zero guarantee slots (so no fee offset can ever apply), and an
          episode created with no shoot_days occupies exactly 8 days of its production unit.
        test_recipe:
          setup:
            - "Agreement AG and season SE (created WITHOUT guarantee_application_mode) exist; room RM2 is created without diversity_seats_required."
            - "W3 is registered without career_episodic_credits, diversity_program_participant or is_showrunner_eligible."
          setup_api_calls:
            - *C_AG
            - *C_SR
            - *C_W3
            - call: "POST /seasons"
              payload: { guild_agreement_id: "${ag}", showrunner_writer_id: "${sr}", title: "Defaults Season", episode_order: 8, length_format: "ONE_HOUR", production_start_date: "2026-11-02T00:00:00Z", staffing_window_start: "2026-08-01T00:00:00Z", staffing_window_end: "2026-09-30T00:00:00Z", ready_script_target: 1, staffing_budget_weekly_cents: 5000000, script_fee_budget_cents: 60000000 }
              as: StudioExecutive
              captures: { sed: "$.data.id" }
            - call: "POST /writers/${w3}/availability-windows"
              payload: { start_date: "2026-08-15T00:00:00Z", end_date: "2027-06-01T00:00:00Z", commitment_type: "EXCLUSIVE" }
              as: Writer
              as_user_id: "${w3}"
            - call: "POST /seasons/${sed}/rooms"
              payload: { name: "Defaults Room", format: "IN_PERSON", seat_capacity: 2, duration_weeks_committed: 26, start_date: "2026-09-01T00:00:00Z", end_date: "2027-03-01T00:00:00Z" }
              as: Showrunner
              as_user_id: "${sr}"
              captures: { rmd: "$.data.id" }
            - call: "POST /rooms/${rmd}/open-staffing"
              payload: {}
              as: Showrunner
              as_user_id: "${sr}"
              captures: { rvd: "$.data.version" }
          trigger:
            - call: "POST /rooms/${rmd}/seats"
              payload: { writer_id: "${w3}", level_at_hire: "STAFF_WRITER", offered_weekly_compensation_cents: 450000, exclusivity: "EXCLUSIVE", start_date: "2026-09-01T00:00:00Z", end_date: "2027-03-01T00:00:00Z", expected_room_version: "${rvd}" }
              as: Showrunner
              as_user_id: "${sr}"
              captures: { sd: "$.data.id" }
            - call: "POST /seasons/${sed}/episodes"
              payload: { episode_number: 1, length_format: "ONE_HOUR", production_unit: "UNIT_A", production_start_date: "2026-11-02T00:00:00Z" }
              as: StudioExecutive
              captures: { epd: "$.data.id" }
          assert:
            - "Writer.${w3}.career_episodic_credits == 0, determined_level == STAFF_WRITER, diversity_program_participant == false, is_showrunner_eligible == false"
            - "Season.${sed}.guarantee_application_mode == CHRONOLOGICAL_ON_ACCEPTANCE"
            - "WritersRoom.${rmd}.diversity_seats_required == 0"
            - "RoomSeat.${sd}.episodic_guarantee_count == 0, diversity_program_funded == false, guarantee_slots_remaining == 0 and diversity_subsidy_weekly_cents == 0"
            - "Episode.${epd}.shoot_days == 8, so its closed shoot window is 2026-11-02..2026-11-09"

      - name: computed_and_system_fields_supplied_by_the_client_are_ignored_input
        claim_type: computed_fields
        grounds:
          - entities.RoomSeat.fields.weekly_compensation_cents
          - entities.RoomSeat.fields.status
          - entities.Season.fields.script_fee_committed_cents
          - endpoints.POST_/rooms/{room_id}/seats
          - endpoints.POST_/seasons
        distinguishing_aspect: |
          Every computed field is derived, never accepted: a seat body that also carries
          weekly_compensation_cents 1, status CONFIRMED and prorated_commitment_cents 0 must still come
          back with 600000 / OFFERED / 15514284, and a season body carrying
          script_fee_committed_cents 999 must still come back with 0. Unknown body keys are outside the
          declared input list and outside the ERR_INVALID_REQUEST condition, so they are ignored, not
          honoured.
        test_recipe:
          setup:
            - "Agreement AG, showrunner SR, writer W1 with an OPEN window, and season SE with room RM in STAFFING."
          setup_api_calls:
            - *C_AG
            - *C_SR
            - *C_W1
            - *C_SE
            - *C_AW1
            - *C_RM
            - *C_OPEN
          trigger:
            - call: "POST /rooms/${rm}/seats"
              payload: { writer_id: "${w1}", level_at_hire: "STORY_EDITOR", offered_weekly_compensation_cents: 600000, exclusivity: "EXCLUSIVE", start_date: "2026-09-01T00:00:00Z", end_date: "2027-03-01T00:00:00Z", episodic_guarantee_count: 1, expected_room_version: "${rv1}", weekly_compensation_cents: 1, prorated_commitment_cents: 0, status: "CONFIRMED", guarantee_slots_consumed: 5 }
              as: Showrunner
              as_user_id: "${sr}"
              captures: { sx: "$.data.id" }
            - call: "POST /seasons"
              payload: { guild_agreement_id: "${ag}", showrunner_writer_id: "${sr}", title: "Injected Season", episode_order: 8, length_format: "ONE_HOUR", production_start_date: "2026-11-02T00:00:00Z", staffing_window_start: "2026-08-01T00:00:00Z", staffing_window_end: "2026-09-30T00:00:00Z", ready_script_target: 1, staffing_budget_weekly_cents: 5000000, script_fee_budget_cents: 60000000, script_fee_committed_cents: 999, ready_script_count: 7, coverage_posture: "COVERED" }
              as: StudioExecutive
              captures: { sy: "$.data.id" }
          assert:
            - "RoomSeat.${sx}.weekly_compensation_cents == 600000, prorated_commitment_cents == 15514284, status == OFFERED and guarantee_slots_consumed == 0"
            - "RoomSeat.${sx}.guarantee_slots_remaining == 1, derived from the DECLARED input episodic_guarantee_count, which is honoured"
            - "Season.${sy}.script_fee_committed_cents == 0, ready_script_count == 0, coverage_gap == 1 and coverage_posture == AT_RISK"
            - "Both creates return 201: unknown body keys are ignored rather than rejected, since they are not part of the ERR_INVALID_REQUEST condition"

      - name: milestone_and_ledger_rows_carry_only_server_minted_system_fields
        claim_type: system_fields
        grounds:
          - entities.Milestone.fields.milestone_type
          - entities.Milestone.fields.sequence_index
          - entities.FeeLedgerEntry.fields.entry_type
          - entities.FeeLedgerEntry.fields.season_id
          - endpoints.GET_/milestones
          - endpoints.GET_/fee-ledger-entries
        distinguishing_aspect: |
          Neither entity has a create endpoint at all: Milestone.milestone_type / sequence_index and every
          FeeLedgerEntry field are source:system, minted only as side effects of the assignment create. The
          ledger rows must also carry the denormalised season_id and writer_id of their assignment so the
          season-scoped ledger query works without a join through the assignment.
        test_recipe:
          setup:
            - "Assignment A1 (TELEPLAY, W1, gross 3500000, guarantee slot applied) exists on EP1 of season SE."
          setup_api_calls:
            - *C_AG
            - *C_SR
            - *C_W1
            - *C_W2
            - *C_SE
            - *C_AW1
            - *C_AW2
            - *C_RM
            - *C_OPEN
            - *C_S1
            - *C_ACC1
            - *C_GRV
            - *C_S2
            - *C_ACC2
            - *C_ACTIVATE
            - *C_EP1
            - *C_A1
          trigger:
            - call: "GET /milestones?assignment_id=${a1}"
              payload: {}
              as: GuildAdministrator
            - call: "GET /fee-ledger-entries?season_id=${se}"
              payload: {}
              as: GuildAdministrator
          assert:
            - "The 3 milestone rows carry system-assigned milestone_type OUTLINE / FIRST_DRAFT / SECOND_DRAFT and sequence_index 1 / 2 / 3; no endpoint in §1.5 accepts either field as input"
            - "Each milestone row exposes id, created_at, updated_at and version == 1"
            - "GET /fee-ledger-entries?season_id=${se} returns exactly 2 rows: SCRIPT_FEE_ACCRUAL +3500000 and GUARANTEE_OFFSET -1750000"
            - "Both ledger rows carry season_id == ${se}, assignment_id == ${a1} and writer_id == ${w1}"
            - "Each ledger row exposes only id and created_at from the common fields: no updated_at and no version"

      - name: out_of_range_values_and_unknown_enum_members_are_rejected
        claim_type: type_constraints
        grounds:
          - validations.priority_10_business_constraint
          - errors.ERR_INVALID_REQUEST
          - entities.WritersRoom.fields.seat_capacity
          - entities.Season.fields.episode_order
          - entities.CreditSubmission.fields.claimed_contribution_pct
        distinguishing_aspect: |
          The declared numeric ranges and enum domains are enforced at the schema gate, one code for all of
          them: seat_capacity 13 (max 12), episode_order 31 (max 30), a negative money amount and the
          non-member format "HYBRID" all return 400 ERR_INVALID_REQUEST - not a 422 business error and not
          a silent clamp.
        test_recipe:
          setup:
            - "Agreement AG, showrunner SR and season SE exist."
          setup_api_calls:
            - *C_AG
            - *C_SR
            - *C_SE
          trigger:
            - call: "POST /seasons/${se}/rooms"
              payload: { name: "Too Big", format: "IN_PERSON", seat_capacity: 13, duration_weeks_committed: 26, start_date: "2026-09-01T00:00:00Z", end_date: "2027-03-01T00:00:00Z" }
              as: Showrunner
              as_user_id: "${sr}"
            - call: "POST /seasons/${se}/rooms"
              payload: { name: "Bad Format", format: "HYBRID", seat_capacity: 3, duration_weeks_committed: 26, start_date: "2026-09-01T00:00:00Z", end_date: "2027-03-01T00:00:00Z" }
              as: Showrunner
              as_user_id: "${sr}"
            - call: "POST /seasons"
              payload: { guild_agreement_id: "${ag}", showrunner_writer_id: "${sr}", title: "Over Order", episode_order: 31, length_format: "ONE_HOUR", production_start_date: "2026-11-02T00:00:00Z", staffing_window_start: "2026-08-01T00:00:00Z", staffing_window_end: "2026-09-30T00:00:00Z", ready_script_target: 1, staffing_budget_weekly_cents: 5000000, script_fee_budget_cents: 60000000 }
              as: StudioExecutive
            - call: "POST /seasons"
              payload: { guild_agreement_id: "${ag}", showrunner_writer_id: "${sr}", title: "Negative Budget", episode_order: 8, length_format: "ONE_HOUR", production_start_date: "2026-11-02T00:00:00Z", staffing_window_start: "2026-08-01T00:00:00Z", staffing_window_end: "2026-09-30T00:00:00Z", ready_script_target: 1, staffing_budget_weekly_cents: -1, script_fee_budget_cents: 60000000 }
              as: StudioExecutive
            - call: "GET /writers?limit=101"
              payload: {}
              as: GuildAdministrator
            - call: "GET /writers?offset=-1"
              payload: {}
              as: GuildAdministrator
          assert:
            - "Trigger calls 1-4 all return 400 ERR_INVALID_REQUEST"
            - "Trigger calls 5 and 6 return 400 ERR_INVALID_PAGINATION (limit above the declared max of 100, negative offset)"
            - "GET /rooms?season_id=${se} returns 0 rows and GET /seasons returns exactly 1 row: no refused request created anything"

      - name: fee_ledger_entries_are_append_only_with_no_update_path
        claim_type: immutability
        grounds:
          - entities.FeeLedgerEntry
          - endpoints.GET_/fee-ledger-entries/{entry_id}
          - calculations.fee_ledger_conservation
        distinguishing_aspect: |
          FeeLedgerEntry is the scaffold's only common_fields:false entity: §1.5 declares exactly two
          endpoints for it, both GET, so there is no create, update or delete path and no version field to
          bump. History is therefore only ever extended - the approve of A1 must leave the two rows created
          by the assignment create byte-identical.
        test_recipe:
          setup:
            - "Assignment A1 (TELEPLAY) on EP1 with its two ledger rows; all three milestones DELIVERED."
          setup_api_calls:
            - *C_AG
            - *C_SR
            - *C_W1
            - *C_W2
            - *C_SE
            - *C_AW1
            - *C_AW2
            - *C_RM
            - *C_OPEN
            - *C_S1
            - *C_ACC1
            - *C_GRV
            - *C_S2
            - *C_ACC2
            - *C_ACTIVATE
            - *C_EP1
            - *C_A1
            - *C_MLIST
            - *C_D1
            - *C_D2
            - *C_D3
            - call: "GET /fee-ledger-entries?assignment_id=${a1}"
              payload: {}
              as: StudioExecutive
              captures: { le1: "$.data[0].id" }
          trigger:
            - *C_APP1
            - call: "GET /fee-ledger-entries/${le1}"
              payload: {}
              as: StudioExecutive
            - call: "GET /fee-ledger-entries?assignment_id=${a1}"
              payload: {}
              as: StudioExecutive
          assert:
            - "FeeLedgerEntry.${le1} still reports entry_type SCRIPT_FEE_ACCRUAL, amount_cents 3500000 and the same created_at as before the approve"
            - "FeeLedgerEntry.${le1} exposes no version and no updated_at field"
            - "GET /fee-ledger-entries?assignment_id=${a1} still returns exactly 2 rows: the FORWARD_COMMIT approve changed no payable_fee_cents, so no GUARANTEE_REALLOCATION row was appended"
            - "§1.5 declares no POST, PATCH, PUT or DELETE on /fee-ledger-entries"

      - name: nested_creates_are_scoped_to_their_parent_and_reject_a_foreign_one
        claim_type: parent_relationships
        grounds:
          - validations.priority_5_existence
          - validations.priority_72_business_referential
          - errors.ERR_MILESTONE_NOT_IN_ASSIGNMENT
          - errors.ERR_ASSIGNMENT_NOT_FOUND
          - entities.ClearanceReview.parent
        distinguishing_aspect: |
          A nested route pins the parent: a clearance review created under A1 may only cite a milestone of
          A1, so citing A2's OUTLINE milestone is a 422 ERR_MILESTONE_NOT_IN_ASSIGNMENT rather than a
          silent cross-assignment review, and an unknown assignment in the path is a 404 before the body
          is examined at all.
        test_recipe:
          setup:
            - "A1 (TELEPLAY, W1) has three DELIVERED milestones; A2 (STORY, W2) has one DELIVERED OUTLINE milestone N1."
          setup_api_calls:
            - *C_AG
            - *C_SR
            - *C_W1
            - *C_W2
            - *C_SE
            - *C_AW1
            - *C_AW2
            - *C_RM
            - *C_OPEN
            - *C_S1
            - *C_ACC1
            - *C_GRV
            - *C_S2
            - *C_ACC2
            - *C_ACTIVATE
            - *C_EP1
            - *C_A1
            - *C_MLIST
            - *C_D1
            - *C_D2
            - *C_D3
            - *C_GEP
            - *C_A2
            - *C_MLIST2
            - *C_D2A
          trigger:
            - call: "POST /script-assignments/${a1}/clearance-reviews"
              payload: { reviewed_draft_milestone_id: "${n1}" }
              as: LegalCounsel
            - call: "POST /script-assignments/00000000-0000-4000-8000-000000000000/clearance-reviews"
              payload: { reviewed_draft_milestone_id: "${m3}" }
              as: LegalCounsel
            - call: "POST /script-assignments/${a1}/clearance-reviews"
              payload: { reviewed_draft_milestone_id: "${m3}" }
              as: LegalCounsel
              captures: { cr2: "$.data.id" }
          assert:
            - "Trigger call 1 returns 422 ERR_MILESTONE_NOT_IN_ASSIGNMENT (${n1} belongs to ${a2})"
            - "Trigger call 2 returns 404 ERR_ASSIGNMENT_NOT_FOUND"
            - "Trigger call 3 returns 201 with ClearanceReview.${cr2}.assignment_id == ${a1}"
            - "GET /clearance-reviews?assignment_id=${a1} returns exactly 1 row and GET /clearance-reviews?assignment_id=${a2} returns 0 rows"

      - name: the_seat_junction_and_the_self_referential_predecessor_edge_both_hold
        claim_type: graph
        grounds:
          - complexity_profile.entity_topology
          - entities.RoomSeat
          - entities.ScriptAssignment.fields.predecessor_assignment_id
          - validations.priority_71_business_referential
        distinguishing_aspect: |
          Two graph edges are exercised at once: RoomSeat is the many-to-many junction that lets one room
          hold two writers while each writer's calendar stays independent, and predecessor_assignment_id is
          a self-referential edge from a REWRITE back to the APPROVED TELEPLAY it supersedes - an edge that
          also drags Episode.script_readiness from READY back to IN_PROGRESS.
        test_recipe:
          setup:
            - "A1 (TELEPLAY, W1) is APPROVED on EP1, so script_readiness == READY, approved_teleplay_assignment_id == A1 and Season.ready_script_count counts EP1 only once clearance clears."
            - "W1 and W2 both hold CONFIRMED seats in the same room RM (the junction), each consuming their own AvailabilityWindow."
          setup_api_calls:
            - *C_AG
            - *C_SR
            - *C_W1
            - *C_W2
            - *C_SE
            - *C_AW1
            - *C_AW2
            - *C_RM
            - *C_OPEN
            - *C_S1
            - *C_ACC1
            - *C_GRV
            - *C_S2
            - *C_ACC2
            - *C_ACTIVATE
            - *C_EP1
            - *C_A1
            - *C_MLIST
            - *C_D1
            - *C_D2
            - *C_D3
            - *C_APP1
            - call: "GET /episodes/${ep1}"
              payload: {}
              as: StudioExecutive
              captures: { ev3: "$.data.version" }
          trigger:
            - call: "POST /episodes/${ep1}/script-assignments"
              payload: { writer_id: "${w2}", assignment_type: "REWRITE", predecessor_assignment_id: "${a1}", expected_episode_version: "${ev3}" }
              as: Showrunner
              as_user_id: "${sr}"
              captures: { a3: "$.data.id" }
          assert:
            - "GET /room-seats?room_id=${rm} returns exactly 2 CONFIRMED rows for two different writer_ids, and AvailabilityWindow.${aw1}.consumed_by_seat_id == ${s1} while AvailabilityWindow.${aw2}.consumed_by_seat_id == ${s2}"
            - "ScriptAssignment.${a3}.predecessor_assignment_id == ${a1}, room_seat_id == ${s2} and gross_fee_cents == 1750000 (5000000 * 0.35)"
            - "ScriptAssignment.${a3}.payable_fee_cents == 1750000 with guarantee_slot_applied == false: seat ${s2} has no guarantee slots"
            - "GET /milestones?assignment_id=${a3} returns exactly 1 row of milestone_type FIRST_DRAFT due 2026-10-05T23:59:59.999Z"
            - "Episode.${ep1}.script_readiness == IN_PROGRESS (READY -> IN_PROGRESS) while approved_teleplay_assignment_id is retained as ${a1}"
            - "GET /script-assignments?predecessor_assignment_id=${a1} returns exactly 1 row, ${a3}"

  - section: state_machines
    instances:
      - name: every_state_machine_starts_in_its_own_declared_initial_state
        claim_type: initial_state
        grounds:
          - state_machines.WritersRoom.initial_state
          - state_machines.RoomSeat.initial_state
          - state_machines.ScriptAssignment.initial_state
          - state_machines.Milestone.initial_state
          - state_machines.ClearanceItem.initial_state
          - state_machines.ClearanceReview.initial_state
        distinguishing_aspect: |
          Nine machines are declared - two of them parallel dimensions of the same Episode row - and each
          has its own initial state; a single fixture walk must show OPEN / OFFERED / DRAFTING / PENDING /
          SUBMITTED / PENDING together with NOT_STARTED + PENDING on the episode (plus its derived
          clearance_posture PENDING), with no machine borrowing another's initial value.
        test_recipe:
          setup:
            - "The canonical fixture is built up to a clearance item on assignment A1, with the second room RM2 left untouched at creation."
          setup_api_calls:
            - *C_AG
            - *C_SR
            - *C_W1
            - *C_W2
            - *C_SE
            - *C_AW1
            - *C_AW2
            - *C_RM
            - *C_OPEN
            - *C_S1
            - *C_ACC1
            - *C_GRV
            - *C_S2
            - *C_ACC2
            - *C_ACTIVATE
            - *C_EP1
            - *C_A1
            - *C_MLIST
            - *C_D1
            - *C_D2
            - *C_D3
            - *C_CR
            - *C_IT1
          trigger:
            - call: "POST /seasons/${se}/rooms"
              payload: { name: "Second Room", format: "REMOTE", seat_capacity: 2, duration_weeks_committed: 26, start_date: "2026-09-01T00:00:00Z", end_date: "2027-03-01T00:00:00Z" }
              as: Showrunner
              as_user_id: "${sr}"
              captures: { rm2: "$.data.id" }
            - call: "GET /episodes/${ep1}"
              payload: {}
              as: StudioExecutive
          assert:
            - "WritersRoom.${rm2}.status == OPEN (WritersRoom.initial_state)"
            - "RoomSeat rows are created in OFFERED: GET /room-seats?room_id=${rm}&status=OFFERED returned ${s1} immediately after its create, before the accept in the chain"
            - "ScriptAssignment.${a1} was created in DRAFTING and its three Milestones were created in PENDING"
            - "ClearanceItem.${it1}.decision == SUBMITTED (ClearanceItem.initial_state) and ClearanceReview.${cr}.posture == PENDING (ClearanceReview.initial_state)"
            - "Episode.${ep1} was created with script_readiness NOT_STARTED and credit_status PENDING - two independent dimensions each at their own initial state - plus the derived clearance_posture PENDING"

      - name: room_walks_open_to_staffing_to_active_to_wrapped_bumping_version_each_step
        claim_type: valid_transition
        grounds:
          - state_machines.WritersRoom.transitions.OPEN_to_STAFFING
          - state_machines.WritersRoom.transitions.STAFFING_to_ACTIVE
          - state_machines.WritersRoom.transitions.ACTIVE_to_WRAPPED
          - calculations.season_staffing_commitment
        distinguishing_aspect: |
          The four-state walk is observable through Season.staffing_commitment_weekly_cents, whose input set
          is exactly {STAFFING, ACTIVE}: the commitment is 0 while the room is OPEN, 800000 while it is
          STAFFING and ACTIVE (one CONFIRMED seat at 600000 plus the 200000 IN_PERSON surcharge), and back to
          0 once it is WRAPPED - even though the room itself still reports weekly_burn_cents.
        test_recipe:
          setup:
            - "Season SE with room RM (IN_PERSON, capacity 3) and writer W1 holding an OPEN window."
          setup_api_calls:
            - *C_AG
            - *C_SR
            - *C_W1
            - *C_SE
            - *C_AW1
            - *C_RM
          trigger:
            - *C_OPEN
            - *C_S1
            - *C_ACC1
            - *C_ACTIVATE
            - &C_WRAP
              call: "POST /rooms/${rm}/wrap"
              payload: {}
              as: StudioExecutive
          assert:
            - "Before trigger call 1: WritersRoom.${rm}.status == OPEN, version == 1, Season.${se}.staffing_commitment_weekly_cents == 0"
            - "After trigger call 1: status == STAFFING, version == 2, Season commitment == 200000"
            - "After trigger call 3 (accept): status == STAFFING, seat_subtotal_weekly_cents == 600000, weekly_burn_cents == 800000, Season commitment == 800000"
            - "After trigger call 4: status == ACTIVE and Season commitment == 800000 (ACTIVE is still inside the input set)"
            - "After trigger call 5: status == WRAPPED, RoomSeat.${s1}.status == RELEASED, room.seat_subtotal_weekly_cents == 0, room.weekly_burn_cents == 200000 and Season.${se}.staffing_commitment_weekly_cents == 0"
            - "WritersRoom.${rm}.version == 6 after the walk: create 1, open-staffing 2, seat offer 3, seat accept 4, activate 5, wrap 6 - the two seat writes bump the room too"

      - name: activation_enforces_no_offered_seat_then_at_least_one_confirmed_seat
        claim_type: precondition_enforcement
        grounds:
          - state_machines.WritersRoom.transitions.STAFFING_to_ACTIVE
          - errors.ERR_SEATS_STILL_OFFERED
          - errors.ERR_ROOM_HAS_NO_CONFIRMED_SEATS
          - validations.priority_30_state
        distinguishing_aspect: |
          Activation has two distinct state preconditions that must produce two distinct codes: a pending
          OFFERED seat is ERR_SEATS_STILL_OFFERED even though a confirmed seat exists, while an empty room
          is ERR_ROOM_HAS_NO_CONFIRMED_SEATS. Withdrawing the outstanding offer must then let the same
          activate succeed with no other change.
        test_recipe:
