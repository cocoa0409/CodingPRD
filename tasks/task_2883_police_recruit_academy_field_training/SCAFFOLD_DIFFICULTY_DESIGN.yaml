  # ===========================================================================

  - rule_id: transitive_cascade
    instances:

      - name: revoke_instructor_cascades_plan_session_projected_hours_class_at_risk
        grounds:
          - state_machines[Instructor].transitions[CERTIFIED -> REVOKED]
          - state_machines[LessonPlan].transitions[APPROVED -> REVISION_REQUESTED]
          - state_machines[CourseSession].transitions[SCHEDULED -> CANCELLED]
          - state_machines[AttendanceRecord].transitions[PROVISIONAL -> VOIDED]
          - state_machines[AcademyClass].transitions[IN_SESSION -> AT_RISK]
          - entities.AcademyClass.fields.projected_topic_hours
          - endpoints[POST /instructors/{instructorId}/revoke-certification]
        distinguishing_aspect: |
          One write walks four entity levels: L1 Instructor CERTIFIED -> REVOKED, L2 every APPROVED
          LessonPlan of that author -> REVISION_REQUESTED with approved_revision_number nulled,
          L3 every CourseSession pinned to those plans and still SCHEDULED / UNDER_MIN_ENROLLMENT
          -> CANCELLED (voiding their PROVISIONAL AttendanceRecord rows), L4 the AcademyClass
          re-derives projected_topic_hours from the surviving sessions and drops IN_SESSION ->
          AT_RISK. Each level's guard matters: the already-DELIVERED session is NOT cancelled and
          its CREDITED row is NOT voided, so credited_topic_hours_total and the recruit's
          credited_hours_total are untouched while projected_topic_hours falls from 6.00 to 2.00.
          Stopping at L2 or L3, or cascading to terminal children too, changes the observable state.
        test_recipe:
          setup:
            - "One CertificationStandard requiring 6.00 PATROL hours, one AcademyClass, one Recruit cleared through all four screenings and in pipeline_stage ACADEMY."
            - "One CERTIFIED instructor authorized for PATROL who authored the single APPROVED LessonPlan (approved_revision_number 1)."
            - "Three 2.00-hour PATROL CourseSessions pinned to that plan: cs1 DELIVERED (its AttendanceRecord CREDITED, credited_hours 2.00), cs2 SCHEDULED with one PROVISIONAL AttendanceRecord, cs3 SCHEDULED with no attendance."
            - "Before the trigger: AcademyClass.status IN_SESSION, projected_topic_hours PATROL 6.00 (2.00 DELIVERED + 2.00 + 2.00 SCHEDULED), credited_topic_hours_total 2.00."
