            - call: "GET /birth-center/clients/${client_id}"
              payload: {}
              as: BillingClerk
          assert:
            - "response HTTP status == 200"
            - "response data.id == ${client_id}"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_plan_create_stale_episode_version
        claim_type: optimistic_concurrency
        grounds: ['concurrency_rules[plan-create-stale-episode]', 'validations[priority=21]', 'errors[ERR_STALE_VERSION]']
        distinguishing_aspect: |
          After reading Episode at version V, an adjudication bumps Episode.version; a payment-plan
          create still carrying expected_episode_version=V -> ERR_STALE_VERSION (412).
        test_recipe:
          setup: ["Standard kit+package+client+episode; claim SUBMITTED; client has read the episode version."]
          setup_api_calls:
            - call: "POST /birth-center/supply-kits"
              payload: { sku: "BK1", name: "Birth Kit", on_hand_count: 5 }
              as: CenterAdmin
            - call: "POST /birth-center/care-packages"
              payload: { code: "PKG_BIRTH", package_type: "BIRTH", global_fee_cents: 800000, prenatal_visits_included: 3, postpartum_visits_included: 2, kit_sku: "BK1" }
              as: CenterAdmin
            - call: "POST /birth-center/clients"
              payload: { full_name: "Ada A", date_of_birth: "1994-03-02", parity: 0 }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /birth-center/episodes"
              payload: { client_id: "${client_id}", package_code: "PKG_BIRTH", edd: "2026-08-01" }
              as: IntakeCoordinator
              captures: { ep_id: $.data.id }
            - call: "POST /birth-center/insurance-claims"
              payload: { episode_id: "${ep_id}" }
              as: BillingClerk
              captures: { claim_id: $.data.id }
            - call: "GET /birth-center/episodes/${ep_id}"
              payload: {}
              as: BillingClerk
              captures: { ep_v_stale: $.data.version }
            - call: "POST /birth-center/insurance-claims/${claim_id}/adjudicate"
              payload: { allowed_amount_cents: 600000, paid_amount_cents: 540000 }
              as: BillingClerk
          trigger:
            - call: "POST /birth-center/payment-plans"
              payload: { episode_id: "${ep_id}", installment_count: 2, expected_episode_version: "${ep_v_stale}" }
              as: BillingClerk
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 412"
            - "response error_id == ERR_STALE_VERSION"

      - name: occ_booking_create_stale_room_version
        claim_type: optimistic_concurrency
        grounds: ['concurrency_rules[booking-create-stale-room]', 'validations[priority=21]', 'errors[ERR_STALE_VERSION]']
        distinguishing_aspect: |
          After a first booking advances Room.version, a second booking create still carrying the
          original expected_room_version -> ERR_STALE_VERSION (412).
        test_recipe:
          setup: ["Two episodes; Room R1; client read room version 1; first booking advances room version."]
          setup_api_calls:
            - call: "POST /birth-center/supply-kits"
              payload: { sku: "BK1", name: "Birth Kit", on_hand_count: 5 }
              as: CenterAdmin
            - call: "POST /birth-center/care-packages"
              payload: { code: "PKG_BIRTH", package_type: "BIRTH", global_fee_cents: 800000, prenatal_visits_included: 3, postpartum_visits_included: 2, kit_sku: "BK1" }
              as: CenterAdmin
            - call: "POST /birth-center/clients"
              payload: { full_name: "Ada A", date_of_birth: "1994-03-02", parity: 0 }
              as: IntakeCoordinator
              captures: { c1_id: $.data.id }
            - call: "POST /birth-center/clients"
              payload: { full_name: "Bea B", date_of_birth: "1992-05-09", parity: 1 }
              as: IntakeCoordinator
              captures: { c2_id: $.data.id }
            - call: "POST /birth-center/episodes"
              payload: { client_id: "${c1_id}", package_code: "PKG_BIRTH", edd: "2026-08-01" }
              as: IntakeCoordinator
              captures: { e1_id: $.data.id }
            - call: "POST /birth-center/episodes"
              payload: { client_id: "${c2_id}", package_code: "PKG_BIRTH", edd: "2026-09-01" }
              as: IntakeCoordinator
              captures: { e2_id: $.data.id }
            - call: "POST /birth-center/rooms"
              payload: { name: "Garden Suite", turnover_minutes: 0 }
              as: CenterAdmin
              captures: { room_id: $.data.id, room_v_stale: $.data.version }
            - call: "POST /birth-center/bookings"
              payload: { episode_id: "${e1_id}", room_id: "${room_id}", starts_at: "2026-02-01T00:00:00Z", ends_at: "2026-02-02T00:00:00Z", expected_room_version: "${room_v_stale}" }
              as: CenterAdmin
          trigger:
            - call: "POST /birth-center/bookings"
              payload: { episode_id: "${e2_id}", room_id: "${room_id}", starts_at: "2026-03-01T00:00:00Z", ends_at: "2026-03-02T00:00:00Z", expected_room_version: "${room_v_stale}" }
              as: CenterAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 412"
            - "response error_id == ERR_STALE_VERSION"

      - name: version_increments_on_mutation
        claim_type: optimistic_concurrency
        grounds: [entities.Episode.fields.version, state_machines.Episode.transitions.PLANNING_to_ACTIVE]
        distinguishing_aspect: "Episode.version starts at 1 and increments to 2 after an activate mutation."
        test_recipe:
          setup: ["Standard kit+package+client+episode (version 1)."]
          setup_api_calls:
            - call: "POST /birth-center/supply-kits"
              payload: { sku: "BK1", name: "Birth Kit", on_hand_count: 5 }
              as: CenterAdmin
            - call: "POST /birth-center/care-packages"
              payload: { code: "PKG_BIRTH", package_type: "BIRTH", global_fee_cents: 800000, prenatal_visits_included: 3, postpartum_visits_included: 2, kit_sku: "BK1" }
              as: CenterAdmin
            - call: "POST /birth-center/clients"
              payload: { full_name: "Ada A", date_of_birth: "1994-03-02", parity: 0 }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /birth-center/episodes"
              payload: { client_id: "${client_id}", package_code: "PKG_BIRTH", edd: "2026-08-01" }
              as: IntakeCoordinator
              captures: { ep_id: $.data.id, v0: $.data.version }
          trigger:
            - call: "POST /birth-center/episodes/${ep_id}/activate"
              payload: {}
              as: Midwife
              captures: { v1: $.data.version }
          assert:
            - "create response Episode.${ep_id}.version == 1"
            - "after activate, Episode.${ep_id}.version == 2"

      - name: cascade_write_off_voids_charges
        claim_type: cascading_side_effects
        grounds: [state_machines.Episode.transitions.UNBILLED_to_WRITTEN_OFF, entities.Charge.fields.status]
        distinguishing_aspect: "write-off voids the episode's DRAFT GLOBAL_FEE charge (status -> VOID) and zeroes the balance."
        test_recipe:
          setup: ["Standard kit+package+client+episode (GLOBAL_FEE charge DRAFT)."]
          setup_api_calls:
            - call: "POST /birth-center/supply-kits"
              payload: { sku: "BK1", name: "Birth Kit", on_hand_count: 5 }
              as: CenterAdmin
            - call: "POST /birth-center/care-packages"
              payload: { code: "PKG_BIRTH", package_type: "BIRTH", global_fee_cents: 800000, prenatal_visits_included: 3, postpartum_visits_included: 2, kit_sku: "BK1" }
              as: CenterAdmin
            - call: "POST /birth-center/clients"
              payload: { full_name: "Ada A", date_of_birth: "1994-03-02", parity: 0 }
              as: IntakeCoordinator
              captures: { client_id: $.data.id }
            - call: "POST /birth-center/episodes"
              payload: { client_id: "${client_id}", package_code: "PKG_BIRTH", edd: "2026-08-01" }
              as: IntakeCoordinator
              captures: { ep_id: $.data.id }
            - call: "GET /birth-center/episodes/${ep_id}/charges"
              payload: {}
              as: BillingClerk
              captures: { gc_id: $.data.0.id }
          trigger:
            - call: "POST /birth-center/episodes/${ep_id}/write-off"
              payload: {}
              as: BillingClerk
          assert:
            - "after trigger, Charge.${gc_id}.status == VOID"
            - "after trigger, Episode.${ep_id}.financial_status == WRITTEN_OFF and balance_due_cents == 0"

      - name: dual_variant_adjudicated_excluded
        claim_type: dual_variant_calculation
        grounds: [calculations.charge_client_responsibility]
        excluded_because:
          difficulty_instance: dual_variant_calc / dvc_charge_estimate_vs_adjudicated
          rationale: "Estimate-vs-adjudicated variant delta is the named §1.8 instance."

