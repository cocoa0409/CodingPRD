      - name: stale_parent_versions_are_refused_on_every_declared_occ_endpoint
        claim_type: optimistic_concurrency
        grounds:
          - complexity_profile.complexity_layers[optimistic_concurrency]
          - concurrency_rules[run-create-stale-market]
          - concurrency_rules[universe-create-stale-market]
          - concurrency_rules[impact-analysis-stale-change]
        distinguishing_aspect: "All three declared concurrency rules in one sequence, each with the SAME payload replayed at the refreshed version to prove the write itself was sound. The interleaving is the point: a universe write invalidates the version a run writer is holding and vice versa, both bump the market, yet publishing a vintage bumps nothing - so the OCC token only advances on the writes whose side-effect lists say it does."
        test_recipe:
          setup:
            - "CHAIN C complete with CODE DMA-697, RANK 197, T 1, B 2000, BUDGET 500000, PERSONS 2, SERIAL MT-002096, LABEL RS-C85, opened by stat-opener-97 and published by stat-publisher-97; the 2026Q3 vintage was published at 2026-08-01T00:00:00Z and the clock now reads 2026-08-11T00:00:00Z."
