# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required field missing, field type mismatch, enum value outside the declared set, or numeric field violating its >= bound (e.g. committed_amount_cents < 1, requested_cents < 1, quantity < 1)."
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role not a declared role."
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for the endpoint, or entity_backed role's X-User-ID does not own the target resource."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path-parameter or body reference does not exist (validated left-to-right)."
  - id: ERR_DUPLICATE_SKU
    http: 409
    condition: "POST /products with a sku that already exists."
  - id: ERR_DUPLICATE_ENROLLMENT
    http: 409
    condition: "POST /agreements with an enrollment_number that already exists."
  - id: ERR_DUPLICATE_ENTITLEMENT
    http: 409
    condition: "POST /agreements/{id}/entitlements for a (agreement_id, product_id) pair that already has an entitlement."
  - id: ERR_DUPLICATE_TRUE_UP
    http: 409
    condition: "POST /agreements/{id}/true-up-reports when a non-REJECTED report already exists for the anniversary."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "State-machine precondition failed: the transition is not allowed from the entity's current status."
  - id: ERR_AGREEMENT_NOT_ACTIVE
    http: 409
    condition: "Mutation requires agreement.status == ACTIVE but the agreement is in another status."
  - id: ERR_ANNIVERSARY_CLOSED
    http: 409
    condition: "Snapshot or true-up report creation targets an anniversary whose true_up_closed == true."
  - id: ERR_ENTITLEMENT_LOCKED_BY_REVIEW
    http: 409
    condition: "Entitlement mutation while a TrueUpReport for the agreement is SUBMITTED or ACCEPTED."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC mismatch: expected_*_version does not equal the parent's current version (agreement renew, entitlement adjust)."
  - id: ERR_REPORT_EMPTY
    http: 422
    condition: "POST /true-up-reports/{id}/submit on a report with zero lines."
  - id: ERR_ACTIVATION_WINDOW_MISSED
    http: 422
    condition: "Activate attempted after agreement.start_date has passed."
  - id: ERR_RENEWAL_WINDOW
    http: 422
    condition: "renewal-review outside [end_date - 90 days, end_date]."
  - id: ERR_INVALID_ANNIVERSARY_SEQUENCE
    http: 422
    condition: "Anniversary year_index out of 1..3, not strictly increasing, or period dates out of order / before agreement start."
  - id: ERR_INVALID_DATE_RANGE
    http: 422
    condition: "deployment_date in the future, effective_on in the past, or end_date < start_date."
  - id: ERR_BENEFIT_EXPIRED
    http: 422
    condition: "Redemption against a grant whose expires_on is before the current logical clock date."
  - id: ERR_REDEMPTION_EXCEEDS_REMAINING
    http: 422
    condition: "Redemption quantity > grant.quantity_remaining or < 1."
  - id: ERR_COMMITMENT_EXPIRED
    http: 422
    condition: "Consumption event against a commitment whose expires_on is before the current logical clock date (commitment transitions to EXPIRED)."
  - id: ERR_SCOPE_MISMATCH
    http: 422
    condition: "Deployment.scope inconsistent with product.license_model, or scope-dependent numeric fields missing/out of range."
  - id: ERR_HOSTING_NOT_AUTHORIZED
    http: 422
    condition: "SERVER deployment to THIRD_PARTY_DATACENTER without product license_mobility or without an APPROVED, effective HostingAuthorization."
  - id: ERR_LICENSE_MOBILITY_REQUIRED
    http: 422
    condition: "HostingAuthorization requested for a product with license_mobility == false."
  - id: ERR_STEP_UP_INVALID
    http: 422
    condition: "Step-up target product in a different family, edition not strictly higher, license_kind mismatch, or quantity < 1."
  - id: ERR_QUANTITY_BELOW_BASELINE
    http: 422
    condition: "PATCH /entitlements/{id} would set quantity below locked_baseline_quantity."
  - id: ERR_MONTHS_OUT_OF_RANGE
    http: 422
    condition: "TrueUpLine.months_growth outside 1..12."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdministrator
    description: "Vendor-side program administrator: owns organizations, agreement lifecycle creation/activation/renewal/expiry, product catalog, anniversaries, and the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /organizations, PATCH /organizations/{id}"
      - "POST /agreements, POST /agreements/{id}/activate, POST /agreements/{id}/renew, POST /agreements/{id}/expire"
      - "POST /products"
      - "POST /agreements/{id}/anniversaries"
