            - call: "POST /comm-services/contracts/${c_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /comm-services/contracts/${c_id}/rate-schedules"
              payload: { local_per_minute_cents: 18, intrastate_per_minute_cents: 21, interstate_per_minute_cents: 25, international_per_minute_cents: 25, connection_fee_cents: 200, message_price_cents: 15, video_session_fee_cents: 500 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /comm-services/rate-schedules/${s_id}/activate"
              payload: { expected_contract_version: "${c_v}" }
              as: PlatformAdmin
            - call: "POST /comm-services/facilities/${fac_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /comm-services/inmates"
              payload: { facility_id: "${fac_id}", booking_number: "B-8002", full_name: "Inmate Budget" }
              as: FacilityStaff
              captures: { inm_id: $.data.id }
            - call: "POST /comm-services/accounts"
              payload: { facility_id: "${fac_id}", inmate_id: "${inm_id}", funding_model: "PREPAID", owner_name: "Fam Budget", owner_contact: "fbu@x.com" }
              as: FacilityStaff
              captures: { acct_id: $.data.id }
            - call: "POST /comm-services/accounts/${acct_id}/deposits"
              payload: { amount_cents: 1025 }
              as: AccountHolder
              as_user_id: "${acct_id}"
            - call: "GET /comm-services/facilities/${fac_id}/video-availability"
              payload: { date: "2026-09-19" }
              as: FacilityStaff
              captures: { avail0: $.data.bookable_minutes }
          trigger:
            - call: "POST /comm-services/video-sessions"
              payload: { facility_id: "${fac_id}", inmate_id: "${inm_id}", account_id: "${acct_id}", visitor_name: "VB", scheduled_start: "2026-09-19T10:00:00Z", scheduled_end: "2026-09-19T10:30:00Z" }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /comm-services/video-sessions/${sess_id}/confirm"
              payload: {}
              as: FacilityStaff
            - call: "GET /comm-services/facilities/${fac_id}/video-availability"
              payload: { date: "2026-09-19" }
              as: FacilityStaff
              captures: { avail1: $.data.bookable_minutes, booked1: $.data.booked_minutes }
            - call: "POST /comm-services/video-sessions/${sess_id}/cancel"
              payload: {}
              as: AccountHolder
              as_user_id: "${acct_id}"
            - call: "GET /comm-services/facilities/${fac_id}/video-availability"
              payload: { date: "2026-09-19" }
              as: FacilityStaff
              captures: { avail2: $.data.bookable_minutes, booked2: $.data.booked_minutes }
          assert:
            - "avail0 == 1440 (2 booths x 720 window-minutes; creation alone consumes nothing)"
            - "after confirm: booked1 == 30 and avail1 == 1410"
            - "after cancel: booked2 == 0 and avail2 == 1440 — the booth-minute budget is conserved exactly"
            - "Account.${acct_id}.balance_cents returns to 1000 (VIDEO_CHARGE -500 then VIDEO_REFUND +500)"
