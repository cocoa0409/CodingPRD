scaffold_corner_design:
- section: entities
  instances:
  - name: agent_creation_applies_defaults
    claim_type: creation_with_defaults
    grounds:
    - entities.Agent.fields.commission_tier
    - entities.Agent.fields.quality_score
    - entities.Agent.fields.status
    distinguishing_aspect: Omitting commission_tier yields STANDARD, quality_score
      100, status ACTIVE, version 1 — input-computed fields are server-owned.
    test_recipe:
      setup:
      - empty database
      setup_api_calls:
      - call: POST /agents
        payload:
          legal_name: Solo Agent
          agent_code: SA01
          capabilities:
          - BOOKING
          home_market: Fresno
        as: VanLineAdmin
        captures:
          ag: $.data.id
      trigger:
      - call: GET /agents/${ag}
        as: VanLineAdmin
      assert:
      - Agent.${ag}.commission_tier == 'STANDARD' (default applied)
      - Agent.${ag}.quality_score == 100 and ytd_linehaul_share_cents == 0
      - Agent.${ag}.status == 'ACTIVE' and version == 1 and created_at == '2026-05-01T00:00:00Z'
        (default logical clock)
  - name: agent_creation_rejected_duplicate_code
    claim_type: violation_to_error
    grounds:
    - validations[priority=15]
    - errors[ERR_DUPLICATE_AGENT_CODE]
    distinguishing_aspect: Second agent with the same agent_code is rejected; uniqueness
      is global, not per-market.
    test_recipe:
      setup:
      - one agent with agent_code DUP1 exists
      setup_api_calls:
      - call: POST /agents
        payload:
          legal_name: First
          agent_code: DUP1
          capabilities:
          - BOOKING
          home_market: Fresno
        as: VanLineAdmin
      trigger:
      - call: POST /agents
        payload:
          legal_name: Second
          agent_code: DUP1
          capabilities:
          - HAULING
          home_market: Tulsa
        as: VanLineAdmin
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_DUPLICATE_AGENT_CODE
      - GET /agents returns exactly 1 row (total_count == 1)
  - name: weight_ticket_net_weight_computed_and_immutable
    claim_type: computed_fields
    grounds:
    - entities.WeightTicket.fields.net_weight_lbs
    - entities.WeightTicket
    distinguishing_aspect: 'net_weight_lbs is computed as gross - tare (client input
      ignored), and the entity exposes no update endpoint (common_fields: false).'
    test_recipe:
      setup:
      - order BOOKED (agents, tariff, customer, estimate accepted, assignments confirmed)
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-01T00:00:00Z'
        as: VanLineAdmin
      - call: POST /agents
        payload:
          legal_name: Booking Co
          agent_code: CB01
          capabilities:
          - BOOKING
          home_market: Chicago
        as: VanLineAdmin
        captures:
          ag_b: $.data.id
      - call: POST /agents
        payload:
          legal_name: Origin Co
          agent_code: CO01
          capabilities:
          - ORIGIN
          home_market: Chicago
        as: VanLineAdmin
        captures:
          ag_o: $.data.id
      - call: POST /agents
        payload:
          legal_name: Haul Co
          agent_code: CH01
          capabilities:
          - HAULING
          home_market: Chicago
        as: VanLineAdmin
        captures:
          ag_h: $.data.id
      - call: POST /agents
        payload:
          legal_name: Dest Co
          agent_code: CD01
          capabilities:
          - DESTINATION
          home_market: Denver
        as: VanLineAdmin
        captures:
          ag_d: $.data.id
      - call: POST /customers
        payload:
          full_name: C Ship
          email: cship@x.com
          phone: 555-1000
        as: VanLineAdmin
        captures:
          cust: $.data.id
      - call: POST /tariffs
        payload:
          tariff_code: T-C1
          effective_start: '2026-01-01T00:00:00Z'
          effective_end: '2027-01-01T00:00:00Z'
          base_rate_cents_per_cwt: 4500
          mileage_bands:
          - min_miles: 0
            max_miles: 999999
            rate_multiplier: 1.0
          fuel_surcharge_pct: 0.1
          sit_daily_rate_cents_per_cwt: 250
          hourly_labor_rate_cents: 4000
        as: VanLineAdmin
        captures:
          tar: $.data.id
      - call: POST /tariffs/${tar}/publish
        payload: {}
        as: VanLineAdmin
      - call: POST /orders
        payload:
          customer_id: ${cust}
          tariff_id: ${tar}
          pricing_mode: NON_BINDING
          origin_city: Chicago
          origin_state: IL
          destination_city: Denver
          destination_state: CO
          mileage: 1200
          pickup_date: '2026-06-10T00:00:00Z'
        as: BookingAgent
        as_user_id: ${ag_b}
        captures:
          ord: $.data.id
          ord_v: $.data.version
      - call: POST /orders/${ord}/valuation-coverages
        payload:
          coverage_type: RELEASED_VALUE
          declared_value_cents: 0
          deductible_cents: 0
          expected_order_version: ${ord_v}
        as: BookingAgent
        as_user_id: ${ag_b}
      - call: GET /orders/${ord}
        as: VanLineAdmin
        captures:
          ord_v2: $.data.version
      - call: POST /orders/${ord}/estimates
        payload:
          estimate_kind: NON_BINDING
          estimated_weight_lbs: 8000
          packing_services_cents: 0
          expected_order_version: ${ord_v2}
        as: BookingAgent
        as_user_id: ${ag_b}
        captures:
          est: $.data.id
      - call: POST /estimates/${est}/accept
        payload: {}
        as: Customer
        as_user_id: ${cust}
      - call: POST /orders/${ord}/agent-assignments
        payload:
          agent_id: ${ag_o}
          role: ORIGIN
        as: BookingAgent
        as_user_id: ${ag_b}
        captures:
          as_o: $.data.id
      - call: POST /orders/${ord}/agent-assignments
        payload:
          agent_id: ${ag_h}
          role: HAULING
        as: BookingAgent
        as_user_id: ${ag_b}
        captures:
          as_h: $.data.id
      - call: POST /orders/${ord}/agent-assignments
        payload:
          agent_id: ${ag_d}
          role: DESTINATION
        as: BookingAgent
        as_user_id: ${ag_b}
        captures:
          as_d: $.data.id
      - call: POST /order-agent-assignments/${as_o}/confirm
        payload: {}
        as: OriginAgent
        as_user_id: ${ag_o}
      - call: POST /order-agent-assignments/${as_h}/confirm
        payload: {}
        as: HaulingAgent
        as_user_id: ${ag_h}
      - call: POST /order-agent-assignments/${as_d}/confirm
        payload: {}
        as: DestinationAgent
        as_user_id: ${ag_d}
      - call: POST /orders/${ord}/book
        payload: {}
        as: BookingAgent
        as_user_id: ${ag_b}
      trigger:
      - call: POST /orders/${ord}/weight-tickets
        payload:
          scale_location: S1
          weighed_at: '2026-06-10T09:00:00Z'
          tare_weight_lbs: 14000
          gross_weight_lbs: 23000
        as: HaulingAgent
        as_user_id: ${ag_h}
        captures:
          wt: $.data.id
      assert:
      - WeightTicket.${wt}.net_weight_lbs == 9000 (23000 - 14000, computed)
      - WeightTicket.${wt}.ticket_kind == 'ORIGINAL' and supersedes_ticket_id is null
        and reweigh_request_id is null
      - MoveOrder.${ord}.actual_weight_lbs == 9000 and authoritative_weight_ticket_id
        == ${wt}
  - name: order_list_filtered_by_customer_fk
    claim_type: listing
    grounds:
    - entities.MoveOrder.fields.customer_id
    - endpoints
