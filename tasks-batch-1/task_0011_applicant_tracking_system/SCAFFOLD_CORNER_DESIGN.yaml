  # ===================================================================
  # cross_cutting_complexity_layers — OCC, derived-field reconciliation,
  # scheduled actions (clock-driven), cascading side effects
  # ===================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_offer_version_on_vp_approve
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[offer-second-approval-stale-offer]
          - errors[ERR_STALE_VERSION]
          - validations[priority=19]
        distinguishing_aspect: |
          OCC rule offer-second-approval-stale-offer: VP's /approve carries
          expected_offer_version equal to the version BEFORE the CompApprover step. Because the
          CompApprover step already bumped offer.version, the VP's stale version triggers
          ERR_STALE_VERSION (412).
        test_recipe:
          setup:
            - "Offer in PENDING_APPROVAL after CompApprover step (offer.version bumped)"
            - "VP attempts approve carrying the PRE-CompApprover version"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-12-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ats/departments"
              payload: { name: "OccDept", cost_center_code: "OCC-001", hiring_budget_cents: 100000000 }
              as: PlatformAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /ats/requisitions"
              payload: { department_id: "${dept_id}", title: "OccRole", target_level: "MID", base_salary_min_cents: 10000000, base_salary_max_cents: 15000000, openings: 1 }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { req_id: $.data.id }
            - call: "POST /ats/requisitions/${req_id}/submit"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
            - call: "POST /ats/requisitions/${req_id}/approve"
              payload: {}
              as: HiringManager
              as_user_id: "hm_bob"
            - call: "POST /ats/candidates"
              payload: { full_name: "Occ Cand", email: "occc@example.com", source_channel: "DIRECT" }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { cand_id: $.data.id }
            - call: "POST /ats/applications"
              payload: { candidate_id: "${cand_id}", requisition_id: "${req_id}" }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { app_id: $.data.id }
            - call: "POST /ats/applications/${app_id}/screen"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
            - call: "POST /ats/offers"
              payload: { application_id: "${app_id}", base_salary_cents: 12000000, signing_bonus_cents: 0 }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { offer_id: $.data.id, offer_v_pre: $.data.version }
            - call: "POST /ats/offers/${offer_id}/approve"
              payload: { expected_offer_version: "${offer_v_pre}" }
              as: CompApprover
              as_user_id: "comp_carol"
              captures: { offer_v_after_comp: $.data.version }
          trigger:
            - call: "POST /ats/offers/${offer_id}/approve"
              payload: { expected_offer_version: "${offer_v_pre}" }
              as: VP
              as_user_id: "vp_dave"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 412"
            - "error_id == 'ERR_STALE_VERSION'"
            - "Offer.status remains PENDING_APPROVAL (no transition)"

      - name: occ_stale_requisition_version_on_cancel
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[requisition-cancel-stale-version]
          - errors[ERR_STALE_VERSION]
          - validations[priority=19]
        distinguishing_aspect: |
          OCC rule requisition-cancel-stale-version: cancel carries an old expected_requisition_version.
          Because the approval transition advanced version, sending the version the client saw at
          DRAFT time triggers ERR_STALE_VERSION (412).
        test_recipe:
          setup:
            - "Requisition R approved (version advanced); cancel attempt uses pre-approve version"
          setup_api_calls:
            - call: "POST /ats/departments"
              payload: { name: "Occ2Dept", cost_center_code: "OCC-002", hiring_budget_cents: 100000000 }
              as: PlatformAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /ats/requisitions"
              payload: { department_id: "${dept_id}", title: "Occ2Role", target_level: "MID", base_salary_min_cents: 10000000, base_salary_max_cents: 15000000, openings: 1 }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { req_id: $.data.id, req_v_initial: $.data.version }
            - call: "POST /ats/requisitions/${req_id}/submit"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
            - call: "POST /ats/requisitions/${req_id}/approve"
              payload: {}
              as: HiringManager
              as_user_id: "hm_bob"
          trigger:
            - call: "POST /ats/requisitions/${req_id}/cancel"
              payload: { expected_requisition_version: "${req_v_initial}" }
              as: HiringManager
              as_user_id: "hm_bob"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 412"
            - "error_id == 'ERR_STALE_VERSION'"
            - "JobRequisition.status remains APPROVED"

      - name: cascading_side_effects_revoke_cancels_bgc_and_voids_referral_bonus
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Offer.EXTENDED_to_REVOKED
          - state_machines.BackgroundCheck.INITIATED_to_CANCELLED
          - state_machines.ReferralBonus.PENDING_BGC_to_VOID
        distinguishing_aspect: |
          POST /ats/offers/{id}/revoke from EXTENDED triggers two parallel cascades:
          BackgroundCheck INITIATED→CANCELLED and ReferralBonus PENDING_BGC→VOID. Both children
          must be in terminal states after the revoke.
        test_recipe:
          setup:
            - "Offer in EXTENDED with linked BGC INITIATED and ReferralBonus PENDING_BGC (REFERRAL candidate)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ats/departments"
              payload: { name: "CscRevDept", cost_center_code: "CSR-001", hiring_budget_cents: 100000000 }
              as: PlatformAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /ats/requisitions"
