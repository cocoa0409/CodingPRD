              payload: { full_name: "Dmitri Jalen", email: "dmitri.jalen@uni.edu", appointment_type: "FACULTY", home_department: "Civil Engineering" }
              as: SystemAdmin
              captures: { inv_id: $.data.id }
            - call: "GET /investigators/${inv_id}"
              payload: {}
              as: SystemAdmin
              captures: { inv_ver1: $.data.version }
            - call: "POST /disclosures"
              payload: { investigator_id: "${inv_id}", cycle_label: "2026-ANNUAL", disclosure_type: "ANNUAL", expected_investigator_version: "${inv_ver1}" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { d1_id: $.data.id }
            - call: "GET /investigators/${inv_id}"
              payload: {}
              as: SystemAdmin
              captures: { inv_ver2: $.data.version }
          trigger:
            - call: "POST /disclosures"
              payload: { investigator_id: "${inv_id}", cycle_label: "2026-ANNUAL", disclosure_type: "ANNUAL", expected_investigator_version: "${inv_ver2}" }
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "POST /disclosures/${d1_id}/submit"
              payload: {}
              as: Investigator
              as_user_id: "${inv_id}"
            - call: "GET /investigators/${inv_id}"
              payload: {}
              as: SystemAdmin
              captures: { inv_ver3: $.data.version }
            - call: "POST /disclosures"
              payload: { investigator_id: "${inv_id}", cycle_label: "2026-ANNUAL", disclosure_type: "ANNUAL", expected_investigator_version: "${inv_ver3}" }
              as: Investigator
              as_user_id: "${inv_id}"
              captures: { d2_id: $.data.id }
          assert:
            - "the first trigger create returns 409 with data.error_id == ERR_DUPLICATE_DISCLOSURE_CYCLE (not 412, because the supplied version was current)"
            - "the second trigger create returns 201"
            - "Disclosure.${d1_id}.review_status == SUPERSEDED and its plan_status is untouched at NOT_REQUIRED"
            - "Disclosure.${d2_id}.review_status == DRAFT with revision_round == 0"
            - "GET /disclosures?investigator_id=${inv_id} returns total_count == 2"

      - name: security_status_write_by_system_admin_returns_403_before_404
        claim_type: priority_ordering
        grounds:
          - validations.priority_2_role_check
          - validations.priority_4_path_existence
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "Role authorization at priority 2 runs before path existence at priority 4, so a SystemAdmin call to the officer-only security-status endpoint on a nonexistent project is 403 ERR_UNAUTHORIZED and must not leak the 404."
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /projects/00000000-0000-0000-0000-000000000000/security-status"
              payload: { to_status: "CLEARED" }
              as: SystemAdmin
          assert:
            - "response code 403 with data.error_id == ERR_UNAUTHORIZED, never ERR_PROJECT_NOT_FOUND"

