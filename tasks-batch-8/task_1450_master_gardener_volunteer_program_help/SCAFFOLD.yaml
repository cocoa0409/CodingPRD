# =============================================================================
# PRD Benchmark Scaffold — Master Gardener Volunteer Program & Help Desk
# =============================================================================

scenario: |
  Master Gardener Volunteer Program & Help Desk (extension master gardener program): applicant selection & training course completion, volunteer hour & continuing education requirement for recertification, help desk shift scheduling & inquiry logging, plant/pest diagnosis referral to specialists, community project approval & hour crediting, demonstration garden maintenance rotation, event outreach staffing, annual recertification & inactive status

domain_name: master-gardener-program
api_prefix: /

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit        # annual recertification gates, hour/CE thresholds, audit trail of credit decisions
  secondary_archetype: temporal_windowing    # help-desk / outreach shift windows, garden rotation weeks, SLA deadlines
  complexity_layers:
    - optimistic_concurrency                 # OCC on ProgramCycle / CommunityProject / Specialist versions
    - cascading_side_effects                 # cycle close -> record -> volunteer -> signup -> shift (4-deep)
    - rate_threshold_triggers                # recert thresholds, capacity boundaries, no-show strike limit, SLA
    - derived_field_reconciliation           # record totals & volunteer recognition recomputed on every ledger event
  entity_topology: graph                     # self-referential inquiries, polymorphic credit sources, junction entities
  state_machine_shape: cyclic                # volunteer ACTIVE<->INACTIVE, referral return loop, project revision loop, shift FULL->OPEN revert
  relationship_patterns:
    - one_to_many
    - many_to_many                           # Volunteer <-> Shift via ShiftSignup; Volunteer <-> ProgramCycle via TrainingEnrollment
    - self_referential                       # Inquiry.follow_up_of_id; RotationAssignment.swapped_to_id
    - polymorphic                            # CreditEntry.source_type/source_id -> Shift | RotationAssignment | CommunityProject
    - cross_aggregate                        # RotationAssignment.cycle_id derived by window containment
  role_model: segregation_of_duties          # project approver may not close the same project
  consistency_model: immediate               # all side effects visible in the same request / follow-up reads

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table (13 entities)
# =============================================================================
entities:
  - name: ProgramCycle
    parent: null
    common_fields: true
    fields:
      - { name: year_label, type: string, source: input, description: "Human label for the program year, e.g. '2026'" }
      - { name: start_date, type: string, source: input, description: "First day of the cycle, ISO 8601 date (YYYY-MM-DD), inclusive" }
      - { name: end_date, type: string, source: input, description: "Last day of the cycle, ISO 8601 date (YYYY-MM-DD), inclusive; must be >= start_date" }
      - { name: admission_capacity, type: integer, source: input, description: "Maximum number of ACCEPTED applications for this cycle; >= 1" }
      - { name: accepted_count, type: integer, source: computed, description: "Count of applications currently in ACCEPTED status for this cycle", default: 0 }
      - { name: hour_requirement, type: number, source: input, description: "Approved service hours required for recertification; multiple of 0.25, > 0" }
      - { name: ce_requirement, type: number, source: input, description: "Approved continuing-education hours required for recertification; multiple of 0.25, >= 0" }
      - { name: training_module_count, type: integer, source: input, description: "Modules a trainee must complete to pass training; >= 1" }
      - { name: training_pass_quiz_average, type: number, source: input, description: "Minimum quiz average (0-100) to pass training; completion passes when quiz_average >= this value" }
      - { name: training_capacity, type: integer, source: input, description: "Maximum ENROLLED training enrollments in this cycle; >= 1" }
      - { name: enrolled_count, type: integer, source: computed, description: "Count of TrainingEnrollments in ENROLLED status for this cycle", default: 0 }
      - { name: recert_opens_at, type: datetime, source: input, description: "Earliest instant begin-recertification may be invoked (logical clock must be >= this)" }
      - { name: priority_counties, type: array, source: input, description: "County names earning the +4 application composite bonus", default: [] }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | RECERTIFICATION | CLOSED", constraints: "initial DRAFT; see state machine" }

  - name: Application
    parent: null
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: input, description: "FK -> ProgramCycle.id; cycle this application targets" }
      - { name: applicant_name, type: string, source: input, description: "Applicant full name" }
      - { name: email, type: string, source: input, description: "Applicant contact email" }
      - { name: county, type: string, source: input, description: "Applicant county of residence" }
      - { name: prior_gardening_years, type: integer, source: input, description: "Self-reported years of gardening experience; >= 0" }
      - { name: essay_score, type: integer, source: input, description: "Reviewer essay score 0-100, supplied via the score endpoint" }
      - { name: interview_score, type: integer, source: input, description: "Reviewer interview score 0-100, supplied via the score endpoint" }
      - { name: composite_score, type: number, source: computed, description: "application_composite_score result; null until scored", default: null }
      - { name: status, type: enum, source: system, description: "SUBMITTED | SCORED | ACCEPTED | WAITLISTED | REJECTED" }
      - { name: decided_at, type: datetime, source: system, description: "Timestamp of the last decide/promote transition; null until then", default: null }

  - name: Volunteer
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> Application.id; the accepted application that created this volunteer" }
      - { name: full_name, type: string, source: system, description: "Copied from Application.applicant_name at creation" }
      - { name: email, type: string, source: system, description: "Copied from Application.email at creation" }
      - { name: status, type: enum, source: system, description: "TRAINEE | ACTIVE | INACTIVE | EXITED | WITHDRAWN; cyclic ACTIVE<->INACTIVE", constraints: "initial TRAINEE" }
      - { name: consecutive_shortfall_cycles, type: integer, source: system, description: "Consecutive cycles ending SHORTFALL; reset to 0 on RECERTIFIED; reaching 2 auto-exits the volunteer", default: 0 }
      - { name: no_show_strikes, type: integer, source: system, description: "Count of ShiftSignups marked NO_SHOW; reaching NO_SHOW_LIMIT (3) blocks new signups", default: 0 }
      - { name: lifetime_base_hours, type: number, source: computed, description: "Sum of official service hours from CLOSED cycles' records plus the current non-closed cycle's raw official service hours (outreach unmultiplied)", default: 0.0 }
      - { name: recognition_tier, type: enum, source: computed, description: "BRONZE | SILVER | GOLD from lifetime_base_hours (SILVER >= 20.0, GOLD >= 40.0)", default: "BRONZE" }
      - { name: recognition_points, type: number, source: computed, description: "lifetime_base_hours + GOLD outreach bonus (0.25 x current-cycle official OUTREACH hours when tier == GOLD); evaluation order pinned in recognition_tier_and_points", default: 0.0 }

  - name: TrainingEnrollment
    parent: null
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: input, description: "FK -> ProgramCycle.id" }
      - { name: volunteer_id, type: string, source: input, description: "FK -> Volunteer.id; must reference a TRAINEE volunteer at creation" }
      - { name: modules_completed, type: integer, source: input, description: "Modules finished so far; updated via the progress endpoint", default: 0 }
      - { name: quiz_average, type: number, source: input, description: "Running quiz average 0-100; updated via the progress endpoint", default: 0.0 }
      - { name: status, type: enum, source: system, description: "ENROLLED | COMPLETED | FAILED | DROPPED", constraints: "initial ENROLLED" }
      - { name: completed_at, type: datetime, source: system, description: "Set when status becomes COMPLETED or FAILED", default: null }

  - name: CreditEntry
    parent: null
    common_fields: true
    fields:
      - { name: volunteer_id, type: string, source: system, description: "FK -> Volunteer.id; taken from the path on manual creation" }
      - { name: cycle_id, type: string, source: input, description: "FK -> ProgramCycle.id; cycle the hours credit toward" }
      - { name: entry_kind, type: enum, source: input, description: "SERVICE | CONTINUING_ED" }
      - { name: activity_type, type: enum, source: input, description: "HELP_DESK | OUTREACH | GARDEN | PROJECT | OTHER; required when entry_kind == SERVICE, forbidden otherwise", default: null }
      - { name: provider, type: string, source: input, description: "CE provider name; required when entry_kind == CONTINUING_ED", default: null }
      - { name: title, type: string, source: input, description: "CE course title; required when entry_kind == CONTINUING_ED", default: null }
      - { name: activity_date, type: string, source: input, description: "ISO 8601 date the hours were worked; must fall inside [cycle.start_date, cycle.end_date] inclusive" }
      - { name: hours, type: number, source: input, description: "Hours claimed; must be a positive multiple of 0.25 and <= 12.0" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | REJECTED | VOIDED", constraints: "initial PENDING" }
      - { name: source_type, type: enum, source: input, description: "NONE | PROJECT; SHIFT and ROTATION values are reserved for system-generated entries", default: "NONE" }
      - { name: source_id, type: string, source: input, description: "Polymorphic source reference resolved via source_type (PROJECT -> CommunityProject.id, SHIFT -> Shift.id, ROTATION -> RotationAssignment.id); required when source_type != NONE; not a canonical FK", default: null }
      - { name: note, type: string, source: input, description: "Free-text note", default: null }
      - { name: decided_at, type: datetime, source: system, description: "Timestamp of approve/reject/revoke decision", default: null }

  - name: RecertificationRecord
    parent: null
    common_fields: true
    fields:
      - { name: volunteer_id, type: string, source: system, description: "FK -> Volunteer.id" }
      - { name: cycle_id, type: string, source: system, description: "FK -> ProgramCycle.id" }
      - { name: status, type: enum, source: system, description: "PENDING | RECERTIFIED | SHORTFALL", constraints: "initial PENDING; finalized only by cycle close" }
      - { name: hardship_exemption, type: boolean, source: system, description: "Set true via grant-exemption; halves effective requirements", default: false }
      - { name: exemption_reason, type: string, source: system, description: "Reason recorded at grant-exemption", default: null }
      - { name: provisional_service_hours, type: number, source: computed, description: "Sum of PENDING + APPROVED SERVICE entry hours for (volunteer, cycle); no project cap applied", default: 0.0 }
      - { name: provisional_ce_hours, type: number, source: computed, description: "Sum of PENDING + APPROVED CONTINUING_ED entry hours for (volunteer, cycle)", default: 0.0 }
      - { name: official_service_hours, type: number, source: computed, description: "Sum of APPROVED SERVICE hours with per-project cap applied (project_credit_cap)", default: 0.0 }
      - { name: official_ce_hours, type: number, source: computed, description: "Sum of APPROVED CONTINUING_ED hours", default: 0.0 }
      - { name: effective_hour_requirement, type: number, source: computed, description: "cycle.hour_requirement x (0.5 if hardship_exemption else 1.0), rounded half-up to nearest 0.25", default: null }
      - { name: effective_ce_requirement, type: number, source: computed, description: "cycle.ce_requirement x (0.5 if hardship_exemption else 1.0), rounded half-up to nearest 0.25", default: null }
      - { name: evaluated_at, type: datetime, source: system, description: "Last evaluate timestamp", default: null }
      - { name: finalized_at, type: datetime, source: system, description: "Set when cycle close finalizes the record", default: null }

  - name: Shift
    parent: null
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: input, description: "FK -> ProgramCycle.id" }
      - { name: kind, type: enum, source: input, description: "HELP_DESK | OUTREACH" }
      - { name: location, type: string, source: input, description: "Physical/virtual location; the resource unit for the half-open overlap rule" }
      - { name: start_time, type: datetime, source: input, description: "Shift start (ISO 8601 UTC)" }
      - { name: end_time, type: datetime, source: input, description: "Shift end; must be strictly after start_time" }
      - { name: capacity, type: integer, source: input, description: "Maximum SIGNED_UP signups; 1..20" }
      - { name: filled_count, type: integer, source: computed, description: "Count of signups in SIGNED_UP status", default: 0 }
      - { name: status, type: enum, source: system, description: "OPEN | FULL | COMPLETED | CANCELLED; FULL -> OPEN auto-revert on cancellation", constraints: "initial OPEN" }

  - name: ShiftSignup
    parent: null
    common_fields: true
    fields:
      - { name: shift_id, type: string, source: system, description: "FK -> Shift.id; taken from the path" }
      - { name: volunteer_id, type: string, source: input, description: "FK -> Volunteer.id; must equal X-User-ID for the Volunteer role" }
      - { name: status, type: enum, source: system, description: "SIGNED_UP | COMPLETED | NO_SHOW | CANCELLED", constraints: "initial SIGNED_UP" }
      - { name: signed_up_at, type: datetime, source: system, description: "Signup timestamp" }
      - { name: completed_entry_id, type: string, source: system, description: "FK -> CreditEntry.id; the PENDING credit entry minted when this signup completed", default: null }

  - name: Inquiry
    parent: null
    common_fields: true
    fields:
      - { name: shift_id, type: string, source: system, description: "FK -> Shift.id; help-desk shift during which the inquiry was logged; taken from the path" }
      - { name: volunteer_id, type: string, source: input, description: "FK -> Volunteer.id; logging volunteer; must equal X-User-ID for the Volunteer role" }
      - { name: subject, type: string, source: input, description: "One-line subject" }
      - { name: contact_name, type: string, source: input, description: "Name of the person asking" }
      - { name: details, type: string, source: input, description: "Inquiry details" }
      - { name: category, type: enum, source: system, description: "PLANT_ID | PEST | PLANT_DISEASE | SOIL | GENERAL; set by triage", default: null }
      - { name: status, type: enum, source: system, description: "LOGGED | TRIAGED | REFERRED | CLOSED", constraints: "initial LOGGED" }
      - { name: resolution, type: enum, source: system, description: "NONE | ANSWERED_AT_DESK | SPECIALIST_DIAGNOSIS", default: "NONE" }
      - { name: answer_text, type: string, source: system, description: "Desk answer text", default: null }
      - { name: follow_up_of_id, type: string, source: input, description: "FK -> Inquiry.id; set when this inquiry is a follow-up to a CLOSED inquiry", default: null }
      - { name: resolved_at, type: datetime, source: system, description: "Set when status becomes CLOSED", default: null }

  - name: DiagnosisReferral
    parent: null
    common_fields: true
    fields:
      - { name: inquiry_id, type: string, source: system, description: "FK -> Inquiry.id; taken from the path" }
      - { name: specialist_id, type: string, source: system, description: "FK -> Specialist.id; current assignee; null while RETURNED" }
      - { name: last_specialist_id, type: string, source: system, description: "FK -> Specialist.id; most recent specialist who returned the referral; excluded from the next selection", default: null }
      - { name: status, type: enum, source: system, description: "OPEN | IN_REVIEW | ANSWERED | RETURNED; RETURNED -> OPEN via reassign (cycle)", constraints: "initial OPEN" }
      - { name: due_at, type: datetime, source: system, description: "SLA deadline = referral creation time + 48h (referral_sla_due_at); refreshed on each reassign" }
      - { name: reassignment_count, type: integer, source: system, description: "Number of reassign transitions", default: 0 }
      - { name: diagnosis_text, type: string, source: system, description: "Specialist diagnosis; set on answer", default: null }
      - { name: return_reason, type: string, source: system, description: "Reason recorded on the latest return", default: null }
      - { name: answered_at, type: datetime, source: system, description: "Answer timestamp", default: null }
      - { name: answered_by_specialist_id, type: string, source: system, description: "FK -> Specialist.id; audit snapshot of answering specialist", default: null }
      - { name: returned_at, type: datetime, source: system, description: "Latest return timestamp", default: null }
      - { name: returned_by_specialist_id, type: string, source: system, description: "FK -> Specialist.id; audit snapshot of latest returning specialist", default: null }

  - name: Specialist
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Specialist display name" }
      - { name: specialty, type: enum, source: input, description: "PLANT_ID | PEST | PLANT_DISEASE | SOIL | GENERAL" }
      - { name: max_concurrent_referrals, type: integer, source: input, description: "Capacity quota of OPEN + IN_REVIEW referrals; >= 1" }
      - { name: accepting_referrals, type: boolean, source: input, description: "Whether the specialist participates in auto-selection", default: true }
      - { name: open_referral_count, type: integer, source: computed, description: "Referrals with specialist_id == this and status IN (OPEN, IN_REVIEW)", default: 0 }
      - { name: answered_count, type: integer, source: computed, description: "Lifetime count of referrals this specialist answered", default: 0 }
      - { name: late_referral_count, type: integer, source: computed, description: "Lifetime count of answers where answered_at > due_at", default: 0 }
      - { name: returned_count, type: integer, source: computed, description: "Lifetime count of returns performed by this specialist", default: 0 }
      - { name: rolling_score, type: number, source: computed, description: "specialist_performance_score ROLLING variant: 100 - 5 x late - 3 x returned over resolutions in the trailing 90 days from the logical clock; floor 0", default: 100.0 }
      - { name: lifetime_score, type: number, source: computed, description: "specialist_performance_score LIFETIME variant: same penalties over all time; floor 0", default: 100.0 }

  - name: CommunityProject
    parent: null
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: input, description: "FK -> ProgramCycle.id" }
      - { name: organizer_volunteer_id, type: string, source: input, description: "FK -> Volunteer.id; organizing volunteer; must equal X-User-ID for the Volunteer role" }
      - { name: title, type: string, source: input, description: "Project title" }
      - { name: description, type: string, source: input, description: "Scope description" }
      - { name: estimated_hours_per_volunteer, type: number, source: input, description: "Organizer estimate of per-volunteer hours; > 0, multiple of 0.25" }
      - { name: max_creditable_hours_per_volunteer, type: number, source: computed, description: "Cap computed at approval: min(round_half_up(estimated_hours_per_volunteer x 1.25, 2dp), 20.0); null until APPROVED", default: null }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of the coordinator who approved; the same user may not close the project (segregation of duties)", default: null }
      - { name: feedback, type: string, source: system, description: "Latest reviewer feedback", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | UNDER_REVIEW | REVISION_REQUESTED | APPROVED | REJECTED | CLOSED; REVISION_REQUESTED -> UNDER_REVIEW resubmission cycle", constraints: "initial DRAFT" }

  - name: RotationAssignment
    parent: null
    common_fields: true
    fields:
      - { name: bed_code, type: string, source: input, description: "Demonstration-garden bed identifier; the resource unit for the closed-week overlap rule" }
      - { name: volunteer_id, type: string, source: input, description: "FK -> Volunteer.id" }
      - { name: cycle_id, type: string, source: system, description: "FK -> ProgramCycle.id; derived: the unique OPEN cycle whose [start_date, end_date] contains week_start" }
      - { name: week_start, type: string, source: input, description: "ISO 8601 date; MUST be a Monday" }
      - { name: week_end, type: string, source: computed, description: "week_start + 6 days (Sunday), inclusive; occupation interval is the closed day-granularity range [week_start, week_end]" }
      - { name: status, type: enum, source: system, description: "ASSIGNED | COMPLETED | MISSED | SWAPPED", constraints: "initial ASSIGNED" }
      - { name: actual_hours, type: number, source: input, description: "Hours worked, reported at completion; 0.5..8.0 multiple of 0.25", default: null }
      - { name: swapped_to_id, type: string, source: system, description: "FK -> RotationAssignment.id; replacement assignment created by swap", default: null }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ProgramCycle
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /program-cycles/{cycleId}/open"
        actor: ProgramCoordinator
        preconditions:
          - "Cycle is DRAFT (ERR_INVALID_CYCLE_STATE)"
        side_effects:
          - "Provision a PENDING RecertificationRecord for every Volunteer with status ACTIVE that has no record for this cycle; recompute each provisioned record's totals"
      - from: OPEN
        to: RECERTIFICATION
        trigger: "POST /program-cycles/{cycleId}/begin-recertification"
        actor: ProgramCoordinator
        preconditions:
          - "Cycle is OPEN (ERR_INVALID_CYCLE_STATE)"
          - "Logical clock >= recert_opens_at (ERR_RECERT_WINDOW_NOT_OPEN)"
        side_effects:
          - "All CreditEntry writes for this cycle (create, approve, reject, revoke) become frozen: subsequent attempts fail with ERR_CYCLE_NOT_OPEN"
      - from: RECERTIFICATION
        to: CLOSED
        trigger: "POST /program-cycles/{cycleId}/close"
        actor: ProgramCoordinator
        preconditions:
          - "Cycle is RECERTIFICATION (ERR_INVALID_CYCLE_STATE)"
        side_effects:
          - "Link 1: finalize every PENDING RecertificationRecord in this cycle (volunteer created_at ASC order): compute official totals, set status RECERTIFIED or SHORTFALL per recertification_outcome, set finalized_at"
          - "Link 2: for each RECERTIFIED record, its Volunteer stays ACTIVE and consecutive_shortfall_cycles resets to 0; for each SHORTFALL record, its Volunteer transitions ACTIVE -> INACTIVE and consecutive_shortfall_cycles increments by 1"
          - "Link 3: each volunteer deactivated at link 2 runs the deactivation cascade: SIGNED_UP ShiftSignups -> CANCELLED, PENDING CreditEntries -> VOIDED, ENROLLED TrainingEnrollments -> DROPPED"
          - "Link 4: each signup cancelled at link 3 decrements its Shift.filled_count by 1; a shift that was FULL reverts to OPEN"
          - "Any volunteer whose consecutive_shortfall_cycles reaches 2 at link 2 transitions INACTIVE -> EXITED (terminal)"

  - entity: Application
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: SCORED
        trigger: "POST /applications/{applicationId}/score"
        actor: ProgramCoordinator
        preconditions:
          - "Application is SUBMITTED (ERR_APPLICATION_NOT_SUBMITTED)"
          - "Parent cycle status IN (DRAFT, OPEN) (ERR_CYCLE_NOT_ACCEPTING_APPLICATIONS)"
        side_effects:
          - "composite_score computed per application_composite_score"
      - from: SCORED
        to: ACCEPTED
        trigger: "POST /applications/{applicationId}/decide with decision=ACCEPT"
        actor: ProgramCoordinator
        preconditions:
          - "Application is SCORED (ERR_APPLICATION_NOT_SCORED)"
          - "cycle.accepted_count < cycle.admission_capacity (ERR_NO_SEATS_AVAILABLE)"
        side_effects:
          - "cycle.accepted_count += 1"
          - "Create Volunteer: status TRAINEE, full_name/email copied from the application, application_id set; decided_at stamped"
      - from: SCORED
        to: WAITLISTED
        trigger: "POST /applications/{applicationId}/decide with decision=WAITLIST"
        actor: ProgramCoordinator
        preconditions:
          - "Application is SCORED (ERR_APPLICATION_NOT_SCORED)"
        side_effects: ["decided_at stamped"]
      - from: SCORED
        to: REJECTED
        trigger: "POST /applications/{applicationId}/decide with decision=REJECT"
        actor: ProgramCoordinator
        preconditions:
          - "Application is SCORED (ERR_APPLICATION_NOT_SCORED)"
        side_effects: ["decided_at stamped"]
      - from: WAITLISTED
        to: ACCEPTED
        trigger: "POST /applications/{applicationId}/decide with decision=ACCEPT, or POST /program-cycles/{cycleId}/promote-waitlisted (selector-driven)"
        actor: ProgramCoordinator
        preconditions:
          - "Application is WAITLISTED (ERR_APPLICATION_NOT_SCORED)"
          - "cycle.accepted_count < cycle.admission_capacity (ERR_NO_SEATS_AVAILABLE)"
        side_effects:
          - "cycle.accepted_count += 1"
          - "Create Volunteer (TRAINEE) as in SCORED -> ACCEPTED; decided_at stamped"
      - from: WAITLISTED
        to: REJECTED
        trigger: "POST /applications/{applicationId}/decide with decision=REJECT"
        actor: ProgramCoordinator
        preconditions:
          - "Application is WAITLISTED (ERR_APPLICATION_NOT_SCORED)"
        side_effects: ["decided_at stamped"]

  - entity: Volunteer
    initial_state: TRAINEE
    terminal_states: [WITHDRAWN, EXITED]
    transitions:
      - from: TRAINEE
        to: ACTIVE
        trigger: "system (automatic when a TrainingEnrollment for this volunteer completes)"
        actor: system
        preconditions: []
        side_effects:
          - "Provision a PENDING RecertificationRecord for the enrollment's cycle if that cycle is OPEN and no record exists for (volunteer, cycle); totals initialized to 0.0"
      - from: ACTIVE
        to: INACTIVE
        trigger: "system (cycle close finalizes this volunteer's record as SHORTFALL)"
        actor: system
        preconditions: []
        side_effects:
          - "consecutive_shortfall_cycles += 1"
          - "Deactivation cascade: SIGNED_UP ShiftSignups -> CANCELLED (each decrements its Shift.filled_count; a FULL shift reverts to OPEN), PENDING CreditEntries -> VOIDED, ENROLLED TrainingEnrollments -> DROPPED"
          - "If consecutive_shortfall_cycles reaches 2, continue to INACTIVE -> EXITED in the same close run"
      - from: INACTIVE
        to: ACTIVE
        trigger: "POST /volunteers/{volunteerId}/reactivate"
        actor: ProgramCoordinator
        preconditions:
          - "Volunteer is INACTIVE (ERR_VOLUNTEER_NOT_INACTIVE)"
          - "At least one ProgramCycle is OPEN (ERR_NO_OPEN_CYCLE); the target cycle is the OPEN cycle with the latest start_date, tie broken by created_at ASC"
        side_effects:
          - "Provision a PENDING RecertificationRecord for the target cycle (none may exist for (volunteer, cycle)); totals initialized to 0.0"
      - from: INACTIVE
        to: EXITED
        trigger: "system (cycle close raises consecutive_shortfall_cycles to 2)"
        actor: system
        preconditions: []
        side_effects: []
      - from: TRAINEE
        to: WITHDRAWN
        trigger: "POST /volunteers/{volunteerId}/withdraw"
        actor: ProgramCoordinator | Volunteer (self)
        preconditions: []
        side_effects: ["Deactivation cascade (signups cancelled, PENDING entries VOIDED, ENROLLED enrollments DROPPED)"]
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /volunteers/{volunteerId}/withdraw"
        actor: ProgramCoordinator | Volunteer (self)
        preconditions: []
        side_effects: ["Deactivation cascade (signups cancelled, PENDING entries VOIDED, ENROLLED enrollments DROPPED)"]
      - from: INACTIVE
        to: WITHDRAWN
        trigger: "POST /volunteers/{volunteerId}/withdraw"
        actor: ProgramCoordinator | Volunteer (self)
        preconditions: []
        side_effects: ["Deactivation cascade (signups cancelled, PENDING entries VOIDED, ENROLLED enrollments DROPPED)"]

  - entity: TrainingEnrollment
    initial_state: ENROLLED
    terminal_states: [COMPLETED, FAILED, DROPPED]
    transitions:
      - from: ENROLLED
        to: COMPLETED
        trigger: "POST /training-enrollments/{enrollmentId}/complete"
        actor: ProgramCoordinator
        preconditions:
          - "Enrollment is ENROLLED (ERR_ENROLLMENT_NOT_ENROLLED)"
          - "Cycle of the enrollment is OPEN (ERR_CYCLE_NOT_OPEN)"
          - "modules_completed >= cycle.training_module_count AND quiz_average >= cycle.training_pass_quiz_average — otherwise the transition goes to FAILED instead (both outcomes are valid results of this trigger, never an error)"
        side_effects:
          - "cycle.enrolled_count -= 1; completed_at stamped"
          - "Cascade: volunteer TRAINEE -> ACTIVE (which provisions the PENDING RecertificationRecord)"
      - from: ENROLLED
        to: FAILED
        trigger: "POST /training-enrollments/{enrollmentId}/complete"
        actor: ProgramCoordinator
        preconditions:
          - "Enrollment is ENROLLED (ERR_ENROLLMENT_NOT_ENROLLED)"
          - "Cycle of the enrollment is OPEN (ERR_CYCLE_NOT_OPEN)"
        side_effects:
          - "cycle.enrolled_count -= 1; completed_at stamped"
          - "Volunteer remains TRAINEE; a fresh enrollment may be created (no ENROLLED duplicate remains)"
      - from: ENROLLED
        to: DROPPED
        trigger: "system (volunteer withdrawal or deactivation cascade)"
        actor: system
        preconditions: []
        side_effects: ["cycle.enrolled_count -= 1"]

  - entity: CreditEntry
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED, VOIDED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /credit-entries/{entryId}/approve"
        actor: ProgramCoordinator
        preconditions:
          - "Entry is PENDING (ERR_ENTRY_NOT_PENDING)"
          - "Entry's cycle is OPEN (ERR_CYCLE_NOT_OPEN)"
        side_effects:
          - "decided_at stamped; recompute the (volunteer, cycle) RecertificationRecord totals (credit_totals) and the volunteer recognition fields (recognition_tier_and_points)"
      - from: PENDING
        to: REJECTED
        trigger: "POST /credit-entries/{entryId}/reject"
        actor: ProgramCoordinator
        preconditions:
          - "Entry is PENDING (ERR_ENTRY_NOT_PENDING)"
          - "Entry's cycle is OPEN (ERR_CYCLE_NOT_OPEN)"
        side_effects:
          - "decided_at stamped; recompute record totals (rejected entries count toward neither provisional nor official totals)"
      - from: APPROVED
        to: VOIDED
        trigger: "POST /credit-entries/{entryId}/revoke"
        actor: ProgramCoordinator
        preconditions:
          - "Entry is APPROVED (ERR_ENTRY_NOT_APPROVED)"
          - "Entry's cycle is OPEN (ERR_CYCLE_NOT_OPEN)"
        side_effects:
          - "decided_at stamped; recompute record totals and volunteer recognition fields (official totals lose the entry's hours)"
      - from: PENDING
        to: VOIDED
        trigger: "system (project close voids PENDING project-sourced entries; volunteer deactivation voids all PENDING entries)"
        actor: system
        preconditions: []
        side_effects: ["Recompute the affected record totals"]

  - entity: RecertificationRecord
    initial_state: PENDING
    terminal_states: [RECERTIFIED, SHORTFALL]
    transitions:
      - from: PENDING
        to: RECERTIFIED
        trigger: "system (POST /program-cycles/{cycleId}/close finalization)"
        actor: system
        preconditions:
          - "official_service_hours >= effective_hour_requirement AND official_ce_hours >= effective_ce_requirement (recertification_outcome)"
        side_effects: ["finalized_at stamped; volunteer stays ACTIVE; consecutive_shortfall_cycles reset to 0"]
      - from: PENDING
        to: SHORTFALL
        trigger: "system (POST /program-cycles/{cycleId}/close finalization)"
        actor: system
        preconditions:
          - "recertification_outcome thresholds not met"
        side_effects: ["finalized_at stamped; volunteer ACTIVE -> INACTIVE cascade per ProgramCycle close links 2-4"]

  - entity: Shift
    initial_state: OPEN
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: OPEN
        to: FULL
        trigger: "system (a signup raises filled_count to capacity)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FULL
        to: OPEN
        trigger: "system (a signup cancellation lowers filled_count below capacity)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: COMPLETED
        trigger: "POST /shifts/{shiftId}/complete"
        actor: ProgramCoordinator
        preconditions:
          - "Shift is OPEN or FULL (ERR_SHIFT_NOT_CANCELLABLE when CANCELLED; ERR_SHIFT_NOT_COMPLETED... see note) — specifically complete requires status IN (OPEN, FULL) else ERR_INVALID_SHIFT_STATE"
          - "Logical clock >= end_time (ERR_SHIFT_NOT_ENDED)"
        side_effects: []
      - from: FULL
        to: COMPLETED
        trigger: "POST /shifts/{shiftId}/complete"
        actor: ProgramCoordinator
        preconditions:
          - "Shift is OPEN or FULL (else ERR_INVALID_SHIFT_STATE)"
          - "Logical clock >= end_time (ERR_SHIFT_NOT_ENDED)"
        side_effects: []
      - from: OPEN
        to: CANCELLED
        trigger: "POST /shifts/{shiftId}/cancel"
        actor: ProgramCoordinator
        preconditions:
          - "Shift is OPEN or FULL (else ERR_SHIFT_NOT_CANCELLABLE)"
        side_effects:
          - "All SIGNED_UP signups -> CANCELLED; filled_count set to 0 (no FULL -> OPEN revert fires because the shift is terminal)"
      - from: FULL
        to: CANCELLED
        trigger: "POST /shifts/{shiftId}/cancel"
        actor: ProgramCoordinator
        preconditions:
          - "Shift is OPEN or FULL (else ERR_SHIFT_NOT_CANCELLABLE)"
        side_effects:
          - "All SIGNED_UP signups -> CANCELLED; filled_count set to 0"

  - entity: ShiftSignup
    initial_state: SIGNED_UP
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: SIGNED_UP
        to: COMPLETED
        trigger: "POST /shift-signups/{signupId}/complete"
        actor: ProgramCoordinator
        preconditions:
          - "Signup is SIGNED_UP (ERR_SIGNUP_NOT_SIGNED_UP)"
          - "Parent shift is COMPLETED (ERR_SHIFT_NOT_COMPLETED)"
        side_effects:
          - "Mint a PENDING CreditEntry: volunteer_id = signup.volunteer_id, cycle_id = shift.cycle_id, entry_kind SERVICE, activity_type = HELP_DESK when shift.kind == HELP_DESK else OUTREACH, activity_date = date portion of shift.start_time, hours = shift_credit_hours(shift), source_type SHIFT, source_id = shift.id; set completed_entry_id"
      - from: SIGNED_UP
        to: NO_SHOW
        trigger: "POST /shift-signups/{signupId}/mark-no-show"
        actor: ProgramCoordinator
        preconditions:
          - "Signup is SIGNED_UP (ERR_SIGNUP_NOT_SIGNED_UP)"
          - "Parent shift is COMPLETED (ERR_SHIFT_NOT_COMPLETED)"
        side_effects:
          - "volunteer.no_show_strikes += 1 (reaching 3 blocks future signups)"
      - from: SIGNED_UP
        to: CANCELLED
        trigger: "POST /shift-signups/{signupId}/cancel, or system cascade (shift cancellation, volunteer deactivation/withdrawal)"
        actor: Volunteer (self) | ProgramCoordinator | system
        preconditions:
          - "Signup is SIGNED_UP (ERR_SIGNUP_NOT_SIGNED_UP)"
          - "For the explicit endpoint only: logical clock < shift.start_time (ERR_CANCELLATION_WINDOW_CLOSED); the system cascade has no clock precondition"
        side_effects:
          - "shift.filled_count -= 1; if the shift was FULL it reverts to OPEN (skipped when the cancellation originates from the shift's own cancellation)"

  - entity: Inquiry
    initial_state: LOGGED
    terminal_states: [CLOSED]
    transitions:
      - from: LOGGED
        to: TRIAGED
        trigger: "POST /inquiries/{inquiryId}/triage"
        actor: ProgramCoordinator
        preconditions:
          - "Inquiry is LOGGED (ERR_INQUIRY_NOT_LOGGED)"
        side_effects: ["category set from the request"]
      - from: TRIAGED
        to: CLOSED
        trigger: "POST /inquiries/{inquiryId}/answer"
        actor: Volunteer (the logging volunteer)
        preconditions:
          - "Inquiry is TRIAGED (ERR_INQUIRY_NOT_TRIAGED)"
          - "X-User-ID == inquiry.volunteer_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects: ["resolution = ANSWERED_AT_DESK; answer_text and resolved_at stamped"]
      - from: TRIAGED
        to: REFERRED
        trigger: "system (POST /inquiries/{inquiryId}/referrals creates a DiagnosisReferral)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REFERRED
        to: CLOSED
        trigger: "system (the open DiagnosisReferral is answered)"
        actor: system
        preconditions: []
        side_effects: ["resolution = SPECIALIST_DIAGNOSIS; resolved_at stamped"]

  - entity: DiagnosisReferral
    initial_state: OPEN
    terminal_states: [ANSWERED]
    transitions:
      - from: OPEN
        to: IN_REVIEW
        trigger: "POST /diagnosis-referrals/{referralId}/start-review"
        actor: Specialist (assignee)
        preconditions:
          - "Referral is OPEN (ERR_REFERRAL_NOT_OPEN)"
          - "X-User-ID == referral.specialist_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects: []
      - from: IN_REVIEW
        to: ANSWERED
        trigger: "POST /diagnosis-referrals/{referralId}/answer"
        actor: Specialist (assignee)
        preconditions:
          - "Referral is IN_REVIEW (ERR_REFERRAL_NOT_IN_REVIEW)"
          - "X-User-ID == referral.specialist_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "diagnosis_text set; answered_at = logical clock; answered_by_specialist_id = assignee"
          - "specialist.open_referral_count -= 1; specialist.answered_count += 1"
          - "If answered_at > due_at (strictly greater; equality is on time): specialist.late_referral_count += 1"
          - "Inquiry REFERRED -> CLOSED (resolution SPECIALIST_DIAGNOSIS)"
          - "specialist.rolling_score and lifetime_score recomputed (specialist_performance_score)"
      - from: IN_REVIEW
        to: RETURNED
        trigger: "POST /diagnosis-referrals/{referralId}/return"
        actor: Specialist (assignee)
        preconditions:
          - "Referral is IN_REVIEW (ERR_REFERRAL_NOT_IN_REVIEW)"
          - "X-User-ID == referral.specialist_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "return_reason set; returned_at = logical clock; returned_by_specialist_id = assignee"
          - "specialist.open_referral_count -= 1; specialist.returned_count += 1"
          - "last_specialist_id = specialist_id; specialist_id set to null"
          - "specialist.rolling_score and lifetime_score recomputed"
      - from: RETURNED
        to: OPEN
        trigger: "POST /diagnosis-referrals/{referralId}/reassign"
        actor: ProgramCoordinator
        preconditions:
          - "Referral is RETURNED (ERR_REFERRAL_NOT_RETURNED)"
        side_effects:
          - "Assignee chosen by specialist_assignment_selector with last_specialist_id excluded from the candidate pool (explicit specialist_id equal to last_specialist_id fails with ERR_INVALID_REQUEST)"
          - "New assignee open_referral_count += 1; reassignment_count += 1; due_at = logical clock + 48h (fresh SLA per reassignment)"

  - entity: CommunityProject
    initial_state: DRAFT
    terminal_states: [CLOSED, REJECTED]
    transitions:
      - from: DRAFT
        to: UNDER_REVIEW
        trigger: "POST /projects/{projectId}/submit"
        actor: Volunteer (organizer)
        preconditions:
          - "Project is DRAFT or REVISION_REQUESTED (ERR_PROJECT_NOT_EDITABLE)"
          - "X-User-ID == project.organizer_volunteer_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects: []
      - from: REVISION_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /projects/{projectId}/submit"
        actor: Volunteer (organizer)
        preconditions:
          - "Project is DRAFT or REVISION_REQUESTED (ERR_PROJECT_NOT_EDITABLE)"
          - "X-User-ID == project.organizer_volunteer_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /projects/{projectId}/approve"
        actor: ProgramCoordinator
        preconditions:
          - "Project is UNDER_REVIEW (ERR_PROJECT_NOT_UNDER_REVIEW)"
        side_effects:
          - "approved_by_user_id = X-User-ID"
          - "max_creditable_hours_per_volunteer = min(round_half_up(estimated_hours_per_volunteer x 1.25, 2 decimals), 20.0)"
      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /projects/{projectId}/request-revision"
        actor: ProgramCoordinator
        preconditions:
          - "Project is UNDER_REVIEW (ERR_PROJECT_NOT_UNDER_REVIEW)"
        side_effects: ["feedback set from request"]
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /projects/{projectId}/reject"
        actor: ProgramCoordinator
        preconditions:
          - "Project is UNDER_REVIEW (ERR_PROJECT_NOT_UNDER_REVIEW)"
        side_effects: ["feedback set from request"]
      - from: APPROVED
        to: CLOSED
        trigger: "POST /projects/{projectId}/close"
        actor: ProgramCoordinator
        preconditions:
          - "Project is APPROVED (ERR_PROJECT_NOT_APPROVED)"
          - "Segregation of duties: X-User-ID != project.approved_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Cascade link 1: every PENDING CreditEntry with source_type PROJECT and source_id == this project -> VOIDED"
          - "Cascade link 2: recompute the RecertificationRecord totals of every volunteer whose entry was voided at link 1"

  - entity: RotationAssignment
    initial_state: ASSIGNED
    terminal_states: [COMPLETED, MISSED, SWAPPED]
    transitions:
      - from: ASSIGNED
        to: COMPLETED
        trigger: "POST /rotation-assignments/{assignmentId}/complete"
        actor: ProgramCoordinator
        preconditions:
          - "Assignment is ASSIGNED (ERR_ASSIGNMENT_NOT_ASSIGNED)"
          - "Logical clock >= week_start + 7 days 00:00:00Z (ERR_WEEK_NOT_ENDED)"
          - "actual_hours in request is 0.5..8.0 and a multiple of 0.25 (ERR_INVALID_FIELD_VALUE)"
        side_effects:
          - "Mint a PENDING CreditEntry: volunteer_id, cycle_id = assignment.cycle_id, entry_kind SERVICE, activity_type GARDEN, activity_date = week_end, hours = actual_hours, source_type ROTATION, source_id = assignment.id"
      - from: ASSIGNED
        to: MISSED
        trigger: "POST /rotation-assignments/{assignmentId}/mark-missed"
        actor: ProgramCoordinator
        preconditions:
          - "Assignment is ASSIGNED (ERR_ASSIGNMENT_NOT_ASSIGNED)"
          - "Logical clock >= week_start + 7 days 00:00:00Z (ERR_WEEK_NOT_ENDED)"
        side_effects: []
      - from: ASSIGNED
        to: SWAPPED
        trigger: "POST /rotation-assignments/{assignmentId}/swap"
        actor: ProgramCoordinator
        preconditions:
          - "Assignment is ASSIGNED (ERR_ASSIGNMENT_NOT_ASSIGNED)"
          - "Logical clock < week_start + 7 days 00:00:00Z (ERR_SWAP_WINDOW_CLOSED)"
          - "new_volunteer_id references an ACTIVE volunteer (ERR_VOLUNTEER_NOT_ACTIVE)"
          - "The replacement assignment passes all creation rules (bed-week overlap treats SWAPPED/terminal assignments as non-blocking; consecutive-week limit evaluated for the new volunteer)"
        side_effects:
          - "Create a new RotationAssignment: status ASSIGNED, same bed_code, week_start, week_end, cycle_id; volunteer_id = new_volunteer_id; this assignment's swapped_to_id points at the new assignment"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC — the only sanctioned write-write mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: cycle-config-stale-update
    parent_entity: ProgramCycle
    write_endpoint: "PUT /program-cycles/{cycleId}"
    occ_field: "expected_cycle_version"
    description: |
      Updating a ProgramCycle's configuration (requirements, capacity, recert
      window, priority counties) is rejected when the client's
      expected_cycle_version does not match the cycle's current version: another
      permitted update has advanced the version since the client last observed
      the cycle, so the client's configuration base is stale.
    error_id: ERR_STALE_CYCLE_VERSION
    http_status: 412
  - rule_id: project-amend-stale-version
    parent_entity: CommunityProject
    write_endpoint: "PUT /projects/{projectId}"
    occ_field: "expected_project_version"
    description: |
      Amending a CommunityProject's draft/revision content is rejected when
      expected_project_version does not match the project's current version:
      a prior accepted amendment (or a state transition such as submit) has
      advanced the version since the client last observed the project.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
  - rule_id: specialist-update-stale-version
    parent_entity: Specialist
    write_endpoint: "PATCH /specialists/{specialistId}"
    occ_field: "expected_specialist_version"
    description: |
      Updating a Specialist's capacity or availability flag is rejected when
      expected_specialist_version does not match the specialist's current
      version: another permitted update has advanced the version since the
      client last observed the specialist.
    error_id: ERR_STALE_SPECIALIST_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: application_composite_score
    trigger: "POST /applications/{applicationId}/score"
    algorithm: weighted_scoring
    formula: |
      experience_bonus(years) =
          8 if years >= 10
          5 if 5 <= years <= 9
          3 if 2 <= years <= 4
          0 otherwise
      county_bonus = 4 if application.county IN cycle.priority_counties else 0
      raw = ESSAY_WEIGHT * essay_score + INTERVIEW_WEIGHT * interview_score
            + experience_bonus(prior_gardening_years) + county_bonus
      composite_score = min(COMPOSITE_CAP, round_half_up(raw, 1 decimal))
      Non-linear elements: tiered experience bonus, conditional county bonus,
      hard cap at 100. Evaluation is exactly this order (weights first, then
      bonuses, then cap).
    input_set: "the single application being scored plus its cycle's priority_counties"
    constants:
      ESSAY_WEIGHT: 0.4
      INTERVIEW_WEIGHT: 0.6
      COUNTY_PRIORITY_BONUS: 4
      COMPOSITE_CAP: 100
    precision: "1 decimal place, round_half_up"

  - name: credit_totals
    trigger: "CreditEntry approve / reject / revoke / system-void; RecertificationRecord evaluate; cycle close; volunteer recognition recompute"
    algorithm: aggregation
    formula: |
      For a (volunteer, cycle) pair:
        provisional_service_hours =
            sum(hours of CreditEntry where entry_kind == SERVICE
                AND status IN (PENDING, APPROVED))                      -- NO caps
        provisional_ce_hours =
            sum(hours where entry_kind == CONTINUING_ED AND status IN (PENDING, APPROVED))
        official_service_hours =
            non_project = sum(hours where entry_kind == SERVICE AND status == APPROVED
                              AND NOT (source_type == PROJECT))
            project_part = project_credit_cap applied per source project (see that rule)
            official_service_hours = non_project + project_part
        official_ce_hours =
            sum(hours where entry_kind == CONTINUING_ED AND status == APPROVED)
      REJECTED and VOIDED entries count toward NEITHER provisional NOR official totals.
      The GOLD outreach multiplier NEVER applies to record totals; it only feeds
      recognition_points (see recognition_tier_and_points).
    input_set: "all CreditEntry rows matching (volunteer_id, cycle_id); status filter as above"
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "provisional_* fields on RecertificationRecord"
        difference: "includes PENDING entries and applies no per-project cap, so identical entry data yields a larger or equal number than the official variant"
      - name: official
        when: "official_* fields; the only variant consulted by recertification_outcome at cycle close"
        difference: "APPROVED entries only; project-sourced hours truncated at the project's max_creditable_hours_per_volunteer"

  - name: project_credit_cap
    trigger: "inside credit_totals (official variant) whenever APPROVED entries with source_type == PROJECT exist"
    algorithm: waterfall_allocation
    formula: |
      For one volunteer and one project P (cap = P.max_creditable_hours_per_volunteer):
        Process the volunteer's APPROVED CreditEntries with source_id == P.id in
        chronological order: activity_date ASC, tie broken by created_at ASC.
        running = 0
        for each entry:
            remaining = cap - running
            counted = min(entry.hours, max(remaining, 0))
            running += counted
        project_contribution = running   (excess hours are silently not credited)
    input_set: "APPROVED SERVICE CreditEntries of one volunteer with source_type == PROJECT, grouped by source_id"
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: shift_credit_hours
    trigger: "POST /shift-signups/{signupId}/complete (minting the CreditEntry)"
    algorithm: rounding_pipeline
    formula: |
      minutes = (shift.end_time - shift.start_time) in whole minutes
      credited_hours = round_half_up(minutes / 15) * 0.25
      The rounding is applied PER SHIFT ENTRY at mint time; volunteer totals then
      SUM the already-rounded per-entry values. The alternative order
      (sum raw minutes across shifts, then round once) is explicitly NOT used;
      the two orders diverge (e.g. 100 min + 70 min yields 3.00 per-entry vs
      2.75 sum-then-round).
    input_set: "the single shift backing the completed signup"
    constants:
      QUARTER_MINUTES: 15
    precision: "0.25-hour quantum, round_half_up"

  - name: recertification_outcome
    trigger: "POST /program-cycles/{cycleId}/close (per PENDING record); previewed field-level by POST /recertification-records/{recordId}/evaluate"
    algorithm: threshold
    formula: |
      effective_hour_requirement = round_half_up(cycle.hour_requirement * (HARDSHIP_FACTOR if hardship_exemption else 1.0) * 4) / 4
      effective_ce_requirement   = round_half_up(cycle.ce_requirement   * (HARDSHIP_FACTOR if hardship_exemption else 1.0) * 4) / 4
      outcome = RECERTIFIED if official_service_hours >= effective_hour_requirement
                            AND official_ce_hours >= effective_ce_requirement
                else SHORTFALL
      Boundary semantics: equality PASSES (>=). 40.0 against a 40.0 requirement
      recertifies; 39.75 shortfalls.
    input_set: "one RecertificationRecord plus its cycle's requirements"
    constants:
      HARDSHIP_FACTOR: 0.5
    precision: "requirements rounded half-up to nearest 0.25; comparisons exact"
    variants:
      - name: hardship
        when: "hardship_exemption == true on the record"
        difference: "both requirements multiplied by 0.5 before the >= comparison"

  - name: recognition_tier_and_points
    trigger: "CreditEntry approve / reject / revoke for the volunteer; record evaluate; cycle close"
    algorithm: constraint_propagation
    formula: |
      CIRCULAR-LOOKING DEPENDENCY — evaluation order is pinned and normative:
        Step 1: lifetime_base_hours =
                  sum(official_service_hours of records whose cycle is CLOSED)
                  + current non-closed cycle's official_service_hours
                  (raw — the GOLD outreach multiplier is NOT applied here)
        Step 2: recognition_tier =
                  GOLD   if lifetime_base_hours >= TIER_GOLD_MIN
                  SILVER if lifetime_base_hours >= TIER_SILVER_MIN
                  BRONZE otherwise        (equality advances the tier)
        Step 3: recognition_points =
                  lifetime_base_hours
                  + (GOLD_OUTREACH_BONUS * current-cycle official SERVICE hours
                     with activity_type == OUTREACH, only when tier == GOLD)
      Because Step 2 reads only the unmultiplied base, a volunteer crossing
      TIER_GOLD_MIN via outreach hours still earns the bonus afterwards, but the
      bonus itself never feeds back into the tier.
    input_set: "the volunteer's RecertificationRecords across cycles plus current-cycle APPROVED SERVICE entries"
    constants:
      TIER_SILVER_MIN: 20.0
      TIER_GOLD_MIN: 40.0
      GOLD_OUTREACH_BONUS: 0.25
    precision: "2 decimal places, round_half_up"

  - name: specialist_performance_score
    trigger: "referral answer or return; both fields recomputed on every read of the specialist"
    algorithm: aggregation
    formula: |
      For specialist S, consider referrals where S performed the resolution:
        late events:      answered_by_specialist_id == S AND answered_at > due_at
        returned events:  returned_by_specialist_id == S (latest return per referral)
      penalty(events) = 5 * count(late) + 3 * count(returned)
      LIFETIME variant:  events over all time
      ROLLING variant:   events whose resolution timestamp (answered_at /
                         returned_at) is >= (logical clock - ROLLING_WINDOW_DAYS)
      score = max(SCORE_FLOOR, 100 - penalty(events))
      Identical event history yields different scores whenever old resolutions
      fall outside the rolling window.
    input_set: "DiagnosisReferral rows resolved by this specialist; window filter as above; a referral returned multiple times counts only its latest return"
    constants:
      LATE_PENALTY: 5
      RETURN_PENALTY: 3
      ROLLING_WINDOW_DAYS: 90
      SCORE_FLOOR: 0
    precision: "integer arithmetic; score is an integer"
    variants:
      - name: rolling
        when: "rolling_score field; the variant consulted by specialist_assignment_selector ranking"
        difference: "only resolutions within the trailing 90 days of the logical clock are penalized"
      - name: lifetime
        when: "lifetime_score field; the variant used for annual review reporting"
        difference: "all resolutions ever are penalized"

  - name: referral_sla_due_at
    trigger: "DiagnosisReferral creation and each reassign"
    algorithm: chronological
    formula: |
      due_at = (logical clock at creation/reassignment) + SLA_HOURS hours
      An answer is LATE iff answered_at > due_at (strictly greater; an answer at
      exactly due_at is on time).
    input_set: "the single referral"
    constants:
      SLA_HOURS: 48
    precision: "second precision on ISO 8601 UTC timestamps"

  - name: waitlist_promotion_order
    trigger: "POST /program-cycles/{cycleId}/promote-waitlisted"
    algorithm: selector
    formula: |
      Candidate set: Applications of the cycle with status == WAITLISTED.
      Ranking: composite_score DESC, tie broken by created_at ASC.
      The top-ranked application is promoted to ACCEPTED (seat check applies).
      Empty candidate set -> ERR_WAITLIST_EMPTY. No seat -> ERR_NO_SEATS_AVAILABLE
      (seat check precedes candidate evaluation).
    input_set: "WAITLISTED applications of the cycle"
    constants: {}
    precision: "exact"

  - name: specialist_assignment_selector
    trigger: "POST /inquiries/{inquiryId}/referrals (specialist_id omitted) and POST /diagnosis-referrals/{referralId}/reassign (specialist_id omitted)"
    algorithm: selector
    formula: |
      Candidate set: specialists with accepting_referrals == true
                     AND open_referral_count < max_concurrent_referrals
                     AND (specialty == inquiry.category OR specialty == GENERAL-fallback rule below)
      Specialty rule: first consider only specialty == inquiry.category; if that
      pool is empty, consider specialty == GENERAL. If both empty ->
      ERR_NO_SPECIALIST_AVAILABLE.
      Exclusion on retry: for reassign, last_specialist_id is removed from the
      candidate pool before ranking.
      Ranking: open_referral_count ASC, then rolling_score DESC, then
      created_at ASC. The top-ranked specialist is assigned.
    input_set: "all Specialist rows"
    constants: {}
    precision: "exact"

  - name: consecutive_week_count
    trigger: "POST /rotation-assignments and POST /rotation-assignments/{assignmentId}/swap"
    algorithm: chronological
    formula: |
      For (volunteer, bed_code): consider RotationAssignments with status
      IN (ASSIGNED, COMPLETED) whose weeks form an unbroken Monday-to-Monday
      chain ending immediately before the new week_start.
      consecutive = length of that chain (0 if none).
      The new assignment is rejected when consecutive >= CONSECUTIVE_WEEK_LIMIT
      (i.e. a volunteer may hold at most 2 consecutive weeks on the same bed;
      the third consecutive week fails ERR_CONSECUTIVE_WEEK_LIMIT).
      Weeks on OTHER beds do not count; a gap week resets the chain.
    input_set: "RotationAssignments of the volunteer with the same bed_code, status filter as above, ordered by week_start ASC"
    constants:
      CONSECUTIVE_WEEK_LIMIT: 2
    precision: "week-granularity; exact"

  - name: overlap_rules
    trigger: "POST /shifts; POST /shifts/{shiftId}/signups; POST /rotation-assignments (+ swap)"
    algorithm: interval_merge
    formula: |
      THREE distinct interval semantics, by resource:
      (A) Shift location (half-open datetimes, zero buffer):
          two shifts at the same location with status != CANCELLED conflict iff
          [start_time, end_time) intersect — i.e. new.start < existing.end AND
          existing.start < new.end. Back-to-back (new.start == existing.end) is
          ALLOWED. -> ERR_SHIFT_LOCATION_CONFLICT
      (B) Volunteer signup schedule (buffered adjacency):
          the new shift S conflicts with any shift T the volunteer is SIGNED_UP
          for iff NOT (S.start >= T.end + buffer OR T.start >= S.end + buffer),
          where buffer = 30 minutes when S.location != T.location else 0.
          A cross-location gap of exactly 30 minutes passes; 29 minutes fails;
          same-location back-to-back passes. -> ERR_SIGNUP_SCHEDULE_CONFLICT
      (C) Garden bed week (closed day-granularity intervals):
          two assignments for the same bed_code with status IN (ASSIGNED,
          COMPLETED) conflict iff [week_start, week_end] closed ranges
          intersect — i.e. new.week_start <= existing.week_end AND
          existing.week_start <= new.week_end. Adjacent weeks (next Monday ==
          prior week_end + 1 day) are disjoint and allowed.
          -> ERR_BED_WEEK_CONFLICT
    input_set: "per rule: non-CANCELLED shifts at the location / the volunteer's SIGNED_UP signups / same-bed ASSIGNED+COMPLETED assignments"
    constants:
      TRAVEL_BUFFER_MINUTES: 30
    precision: "second precision for datetimes; day precision for weeks"

  - name: no_show_strike_gate
    trigger: "POST /shifts/{shiftId}/signups"
    algorithm: threshold
    formula: |
      Signup is rejected when volunteer.no_show_strikes >= NO_SHOW_LIMIT.
      Boundary: 2 strikes passes; exactly 3 blocks. Strikes only ever
      increment (mark-no-show) and never reset within a volunteer's lifetime.
    input_set: "the signing-up volunteer"
    constants:
      NO_SHOW_LIMIT: 3
    precision: "integer; exact"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "The caller's role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Schema: required fields present, types valid, enum members valid, static ranges hold (hours a positive multiple of 0.25 and <= 12.0; capacity 1..20; end_time > start_time; essay/interview 0..100; week_start is a Monday; actual_hours 0.5..8.0 step 0.25; estimated_hours_per_volunteer > 0 step 0.25)"
    error_id: "ERR_INVALID_REQUEST / ERR_INVALID_FIELD_VALUE / ERR_MISSING_KIND_FIELDS (SERVICE without activity_type or CONTINUING_ED without provider+title)"
    http_status: "400 / 422"
    applies_to: all write endpoints

  - priority: 4
    category: existence
    check: "Path ids and body reference ids (cycle_id, volunteer_id, source_id, specialist_id, follow_up_of_id, new_volunteer_id) resolve to existing resources, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 5
    category: auth
    check: "Entity-backed ownership: Volunteer role's X-User-ID equals the target volunteer (path volunteerId, signup.volunteer_id, inquiry.volunteer_id, project.organizer_volunteer_id); Specialist role's X-User-ID equals referral.specialist_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "self-scoped volunteer/specialist endpoints"

  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version in the request equals the parent's current version"
    error_id: "ERR_STALE_CYCLE_VERSION / ERR_STALE_PROJECT_VERSION / ERR_STALE_SPECIALIST_VERSION"
    http_status: 412
    applies_to: "PUT /program-cycles/{cycleId}, PUT /projects/{projectId}, PATCH /specialists/{specialistId}"

  - priority: 7
    category: state
    check: "Parent posture: credit-entry create/approve/reject/revoke, shift create, project create, enrollment create/progress/complete require the cycle OPEN; application create/score/decide/promote require DRAFT or OPEN; cycle config edit requires DRAFT or OPEN"
    error_id: "ERR_CYCLE_NOT_OPEN / ERR_CYCLE_NOT_ACCEPTING_APPLICATIONS / ERR_CYCLE_NOT_EDITABLE"
    http_status: 409
    applies_to: cycle-scoped write endpoints

  - priority: 8
    category: state
    check: "Target resource is in the required from-state for the transition (application SCORED, volunteer ACTIVE/INACTIVE, enrollment ENROLLED, entry PENDING/APPROVED, record PENDING, shift OPEN/FULL/COMPLETED, signup SIGNED_UP, inquiry LOGGED/TRIAGED, referral OPEN/IN_REVIEW/RETURNED, project DRAFT/UNDER_REVIEW/REVISION_REQUESTED/APPROVED, assignment ASSIGNED). Intra-priority tie-break: when both the target resource's own state and a related resource's state fail at this priority, the target resource's own state error is returned first."
    error_id: "ERR_APPLICATION_NOT_SUBMITTED, ERR_APPLICATION_NOT_SCORED, ERR_VOLUNTEER_NOT_ACTIVE, ERR_VOLUNTEER_NOT_INACTIVE, ERR_ENROLLMENT_NOT_ENROLLED, ERR_ENTRY_NOT_PENDING, ERR_ENTRY_NOT_APPROVED, ERR_RECORD_NOT_PENDING, ERR_SHIFT_NOT_OPEN, ERR_SHIFT_NOT_CANCELLABLE, ERR_SHIFT_NOT_COMPLETED, ERR_INVALID_CYCLE_STATE, ERR_SIGNUP_NOT_SIGNED_UP, ERR_INQUIRY_NOT_LOGGED, ERR_INQUIRY_NOT_TRIAGED, ERR_REFERRAL_NOT_OPEN, ERR_REFERRAL_NOT_IN_REVIEW, ERR_REFERRAL_NOT_RETURNED, ERR_PROJECT_NOT_EDITABLE, ERR_PROJECT_NOT_UNDER_REVIEW, ERR_PROJECT_NOT_APPROVED, ERR_ASSIGNMENT_NOT_ASSIGNED"
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 9
    category: business_safety
    check: "Segregation of duties: the coordinator closing a project must not be the coordinator recorded in approved_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /projects/{projectId}/close"

  - priority: 10
    category: business_constraint
    check: "Uniqueness/capacity/overlap: duplicate ENROLLED enrollment per (volunteer, cycle); training_capacity; admission seats; specialist referral capacity; duplicate SIGNED_UP signup per (volunteer, shift); no-show strike limit; shift location overlap; signup travel-buffer overlap; bed-week overlap; consecutive-week limit; referral already open for inquiry"
    error_id: "ERR_DUPLICATE_ENROLLMENT, ERR_TRAINING_FULL, ERR_NO_SEATS_AVAILABLE, ERR_SPECIALIST_AT_CAPACITY, ERR_DUPLICATE_SIGNUP, ERR_NO_SHOW_LIMIT_REACHED, ERR_SHIFT_LOCATION_CONFLICT, ERR_SIGNUP_SCHEDULE_CONFLICT, ERR_BED_WEEK_CONFLICT, ERR_CONSECUTIVE_WEEK_LIMIT, ERR_REFERRAL_ALREADY_OPEN, ERR_WAITLIST_EMPTY (no candidates to select)"
    http_status: 409
    applies_to: creation and selection endpoints

  - priority: 11
    category: business_temporal
    check: "Clock/window rules: activity_date inside cycle window; logical clock >= recert_opens_at; clock >= shift.end_time to complete; clock < shift.start_time to cancel or to sign up; clock inside [start_time, end_time) to log an inquiry (waived for follow-ups); clock >= week_start+7d to complete/miss a rotation week; clock < week_start+7d to swap; exactly one OPEN cycle contains a rotation week_start"
    error_id: "ERR_ACTIVITY_OUTSIDE_CYCLE_WINDOW, ERR_RECERT_WINDOW_NOT_OPEN, ERR_SHIFT_NOT_ENDED, ERR_CANCELLATION_WINDOW_CLOSED, ERR_SIGNUP_WINDOW_CLOSED, ERR_OUTSIDE_SHIFT_WINDOW, ERR_WEEK_NOT_ENDED, ERR_SWAP_WINDOW_CLOSED, ERR_NO_OPEN_CYCLE"
    http_status: "422 for ERR_ACTIVITY_OUTSIDE_CYCLE_WINDOW; 409 for the rest"
    applies_to: time-gated endpoints

  - priority: 12
    category: business_referential
    check: "Cross-entity reference consistency: explicit specialist specialty must equal inquiry.category or GENERAL; project-sourced entries must reference an APPROVED or CLOSED project; inquiry logging requires the referenced shift to be kind HELP_DESK and the logging volunteer to hold a SIGNED_UP or COMPLETED signup on that shift; follow_up_of_id target must be CLOSED; inquiry category required before referral (TRIAGED)"
    error_id: "ERR_SPECIALTY_MISMATCH, ERR_PROJECT_NOT_CREDITABLE, ERR_SHIFT_KIND_NOT_HELP_DESK, ERR_NO_SHIFT_SIGNUP, ERR_FOLLOW_UP_TARGET_NOT_CLOSED"
    http_status: 409
    applies_to: referral creation, credit-entry creation, inquiry creation

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Default before any call: exactly 2026-08-01T00:00:00Z (the server MUST NOT fall back to wall-clock time). All time-gated rules read this clock."
    roles: [ProgramCoordinator]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock advanced to to_iso8601"]

  # --- ProgramCycle ---
  - method: POST
    path: "/program-cycles"
    description: "Create a program cycle (status DRAFT)"
    roles: [ProgramCoordinator]
    code: 201
    input: [year_label, start_date, end_date, admission_capacity, hour_requirement, ce_requirement, training_module_count, training_pass_quiz_average, training_capacity, recert_opens_at, "priority_counties?"]
    output: ProgramCycle
    side_effects: ["status DRAFT; accepted_count 0; enrolled_count 0; version 1"]

  - method: GET
    path: "/program-cycles"
    description: "List program cycles"
    roles: [ProgramCoordinator, Volunteer, Specialist]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ProgramCycle[]"
    side_effects: []

  - method: GET
    path: "/program-cycles/{cycleId}"
    description: "Get a program cycle"
    roles: [ProgramCoordinator, Volunteer, Specialist]
    code: 200
    input: []
    output: ProgramCycle
    side_effects: []

  - method: PUT
    path: "/program-cycles/{cycleId}"
    description: "Edit cycle configuration (OCC-guarded); only while DRAFT or OPEN (ERR_CYCLE_NOT_EDITABLE)"
    roles: [ProgramCoordinator]
    code: 200
    input: [expected_cycle_version, "admission_capacity?", "hour_requirement?", "ce_requirement?", "training_capacity?", "recert_opens_at?", "priority_counties?"]
    output: ProgramCycle
    side_effects: ["increments ProgramCycle.version by 1"]

  - method: POST
    path: "/program-cycles/{cycleId}/open"
    description: "Open the cycle (DRAFT -> OPEN)"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: ProgramCycle
    side_effects: ["provision PENDING RecertificationRecords for ACTIVE volunteers lacking one"]

  - method: POST
    path: "/program-cycles/{cycleId}/begin-recertification"
    description: "OPEN -> RECERTIFICATION; requires logical clock >= recert_opens_at"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: ProgramCycle
    side_effects: ["credit-entry writes for the cycle freeze (ERR_CYCLE_NOT_OPEN)"]

  - method: POST
    path: "/program-cycles/{cycleId}/close"
    description: "RECERTIFICATION -> CLOSED; finalizes all PENDING records and cascades volunteer statuses"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: ProgramCycle
    side_effects:
      - "finalize PENDING RecertificationRecords to RECERTIFIED or SHORTFALL"
      - "SHORTFALL -> volunteer ACTIVE->INACTIVE (+deactivation cascade) and consecutive_shortfall_cycles += 1; reaching 2 -> EXITED"
      - "RECERTIFIED -> consecutive_shortfall_cycles reset to 0"

  - method: POST
    path: "/program-cycles/{cycleId}/promote-waitlisted"
    description: "Promote the top-ranked WAITLISTED application per waitlist_promotion_order"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: Application
    side_effects: ["promoted application -> ACCEPTED; Volunteer (TRAINEE) created; accepted_count += 1"]

  # --- Application ---
  - method: POST
    path: "/applications"
    description: "Submit an application to a cycle (cycle must be DRAFT or OPEN)"
    roles: [ProgramCoordinator]
    code: 201
    input: [cycle_id, applicant_name, email, county, prior_gardening_years]
    output: Application
    side_effects: ["status SUBMITTED"]

  - method: GET
    path: "/applications"
    description: "List applications"
    roles: [ProgramCoordinator, Volunteer, Specialist]
    code: 200
    input: ["cycle_id?", "status?", "limit?", "offset?"]
    output: "Application[]"
    side_effects: []

  - method: GET
    path: "/applications/{applicationId}"
    description: "Get an application"
    roles: [ProgramCoordinator, Volunteer, Specialist]
    code: 200
    input: []
    output: Application
    side_effects: []

  - method: POST
    path: "/applications/{applicationId}/score"
    description: "Enter review scores; computes composite_score; SUBMITTED -> SCORED"
    roles: [ProgramCoordinator]
    code: 200
    input: [essay_score, interview_score]
    output: Application
    side_effects: ["composite_score computed per application_composite_score"]

  - method: POST
    path: "/applications/{applicationId}/decide"
    description: "Decide a SCORED (or WAITLISTED) application: ACCEPT | WAITLIST | REJECT"
    roles: [ProgramCoordinator]
    code: 200
    input: [decision]
    output: Application
    side_effects: ["ACCEPT: seat check, accepted_count += 1, create Volunteer (TRAINEE)"]

  # --- Volunteer ---
  - method: GET
    path: "/volunteers"
    description: "List volunteers"
    roles: [ProgramCoordinator, Volunteer, Specialist]
    code: 200
    input: ["status?", "application_id?", "limit?", "offset?"]
    output: "Volunteer[]"
    side_effects: []

  - method: GET
    path: "/volunteers/{volunteerId}"
    description: "Get a volunteer"
    roles: [ProgramCoordinator, Volunteer, Specialist]
    code: 200
    input: []
    output: Volunteer
    side_effects: []

  - method: POST
    path: "/volunteers/{volunteerId}/withdraw"
    description: "Withdraw a volunteer (TRAINEE/ACTIVE/INACTIVE -> WITHDRAWN); deactivation cascade"
    roles: [ProgramCoordinator, Volunteer]
    code: 200
    input: []
    output: Volunteer
    side_effects: ["signups CANCELLED, PENDING entries VOIDED, ENROLLED enrollments DROPPED"]

  - method: POST
    path: "/volunteers/{volunteerId}/reactivate"
    description: "INACTIVE -> ACTIVE; requires an OPEN cycle; provisions a PENDING recertification record"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: Volunteer
    side_effects: ["PENDING RecertificationRecord provisioned in the target OPEN cycle"]

  # --- TrainingEnrollment ---
  - method: POST
    path: "/training-enrollments"
    description: "Enroll a TRAINEE volunteer in a cycle's training course"
    roles: [ProgramCoordinator]
    code: 201
    input: [cycle_id, volunteer_id]
    output: TrainingEnrollment
    side_effects: ["cycle.enrolled_count += 1"]

  - method: GET
    path: "/training-enrollments"
    description: "List training enrollments"
    roles: [ProgramCoordinator, Volunteer, Specialist]
    code: 200
    input: ["cycle_id?", "volunteer_id?", "status?", "limit?", "offset?"]
    output: "TrainingEnrollment[]"
    side_effects: []

  - method: GET
    path: "/training-enrollments/{enrollmentId}"
    description: "Get a training enrollment"
    roles: [ProgramCoordinator, Volunteer, Specialist]
    code: 200
    input: []
    output: TrainingEnrollment
    side_effects: []

  - method: POST
    path: "/training-enrollments/{enrollmentId}/progress"
    description: "Record module/quiz progress (ENROLLED only, cycle OPEN)"
    roles: [ProgramCoordinator]
    code: 200
    input: [modules_completed, quiz_average]
    output: TrainingEnrollment
    side_effects: []

  - method: POST
    path: "/training-enrollments/{enrollmentId}/complete"
    description: "Finalize training: thresholds met -> COMPLETED (volunteer activates), else FAILED"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: TrainingEnrollment
    side_effects: ["COMPLETED: volunteer TRAINEE -> ACTIVE and PENDING record provisioned; enrolled_count -= 1"]

  # --- CreditEntry ---
  - method: POST
    path: "/volunteers/{volunteerId}/credit-entries"
    description: "Log a service-hour or continuing-education entry (volunteer self-service)"
    roles: [Volunteer]
    code: 201
    input: [cycle_id, entry_kind, activity_date, hours, "activity_type?", "provider?", "title?", "source_type?", "source_id?", "note?"]
    output: CreditEntry
    side_effects: ["status PENDING; recompute of provisional totals happens on next evaluate/read"]

  - method: GET
    path: "/credit-entries"
    description: "List credit entries"
    roles: [ProgramCoordinator, Volunteer, Specialist]
    code: 200
    input: ["volunteer_id?", "cycle_id?", "entry_kind?", "status?", "source_type?", "source_id?", "limit?", "offset?"]
    output: "CreditEntry[]"
    side_effects: []

  - method: GET
    path: "/credit-entries/{entryId}"
    description: "Get a credit entry"
    roles: [ProgramCoordinator, Volunteer, Specialist]
    code: 200
    input: []
    output: CreditEntry
    side_effects: []

  - method: POST
    path: "/credit-entries/{entryId}/approve"
    description: "Approve a PENDING entry (cycle must be OPEN)"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: CreditEntry
    side_effects: ["recompute record totals (credit_totals) and volunteer recognition fields"]

  - method: POST
    path: "/credit-entries/{entryId}/reject"
    description: "Reject a PENDING entry (cycle must be OPEN)"
    roles: [ProgramCoordinator]
    code: 200
    input: ["reason?"]
    output: CreditEntry
    side_effects: ["recompute record totals"]

  - method: POST
    path: "/credit-entries/{entryId}/revoke"
    description: "Revoke an APPROVED entry (APPROVED -> VOIDED; compensating action for approve)"
    roles: [ProgramCoordinator]
    code: 200
    input: [reason]
    output: CreditEntry
    side_effects: ["recompute record totals and volunteer recognition fields"]

  # --- RecertificationRecord ---
  - method: GET
    path: "/recertification-records"
    description: "List recertification records"
    roles: [ProgramCoordinator, Volunteer, Specialist]
    code: 200
    input: ["volunteer_id?", "cycle_id?", "status?", "limit?", "offset?"]
    output: "RecertificationRecord[]"
    side_effects: []

  - method: GET
    path: "/recertification-records/{recordId}"
    description: "Get a recertification record"
    roles: [ProgramCoordinator, Volunteer, Specialist]
    code: 200
    input: []
    output: RecertificationRecord
    side_effects: []

  - method: POST
    path: "/recertification-records/{recordId}/evaluate"
    description: "Recompute and store provisional/official totals and effective requirements (record must be PENDING)"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: RecertificationRecord
    side_effects: ["evaluated_at stamped; totals recomputed per credit_totals; effective requirements per recertification_outcome"]

  - method: POST
    path: "/recertification-records/{recordId}/grant-exemption"
    description: "Grant a hardship exemption (halves effective requirements); record must be PENDING"
    roles: [ProgramCoordinator]
    code: 200
    input: [reason]
    output: RecertificationRecord
    side_effects: ["hardship_exemption = true; exemption_reason set"]

  # --- Shift ---
  - method: POST
    path: "/shifts"
    description: "Create a help-desk or outreach shift (cycle OPEN; location overlap rule A)"
    roles: [ProgramCoordinator]
    code: 201
    input: [cycle_id, kind, location, start_time, end_time, capacity]
    output: Shift
    side_effects: ["status OPEN; filled_count 0"]

  - method: GET
    path: "/shifts"
    description: "List shifts"
    roles: [ProgramCoordinator, Volunteer, Specialist]
    code: 200
    input: ["cycle_id?", "kind?", "location?", "status?", "limit?", "offset?"]
    output: "Shift[]"
    side_effects: []

  - method: GET
    path: "/shifts/{shiftId}"
    description: "Get a shift"
    roles: [ProgramCoordinator, Volunteer, Specialist]
    code: 200
    input: []
    output: Shift
    side_effects: []

  - method: POST
    path: "/shifts/{shiftId}/cancel"
    description: "Cancel an OPEN/FULL shift; SIGNED_UP signups cascade to CANCELLED"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: Shift
    side_effects: ["SIGNED_UP signups -> CANCELLED; filled_count -> 0"]

  - method: POST
    path: "/shifts/{shiftId}/complete"
    description: "Mark a shift COMPLETED once the logical clock >= end_time"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: Shift
    side_effects: []

  # --- ShiftSignup ---
  - method: POST
    path: "/shifts/{shiftId}/signups"
    description: "Volunteer signs up for a shift (capacity, strike gate, travel-buffer overlap rule B)"
    roles: [Volunteer]
    code: 201
    input: [volunteer_id]
    output: ShiftSignup
    side_effects: ["shift.filled_count += 1; shift OPEN -> FULL when filled_count reaches capacity"]

  - method: GET
    path: "/shift-signups"
    description: "List shift signups"
    roles: [ProgramCoordinator, Volunteer, Specialist]
    code: 200
    input: ["shift_id?", "volunteer_id?", "status?", "completed_entry_id?", "limit?", "offset?"]
    output: "ShiftSignup[]"
    side_effects: []

  - method: GET
    path: "/shift-signups/{signupId}"
    description: "Get a shift signup"
    roles: [ProgramCoordinator, Volunteer, Specialist]
    code: 200
    input: []
    output: ShiftSignup
    side_effects: []

  - method: POST
    path: "/shift-signups/{signupId}/cancel"
    description: "Cancel a SIGNED_UP signup before the shift starts"
    roles: [ProgramCoordinator, Volunteer]
    code: 200
    input: []
    output: ShiftSignup
    side_effects: ["shift.filled_count -= 1; FULL -> OPEN revert"]

  - method: POST
    path: "/shift-signups/{signupId}/complete"
    description: "Mark attendance after the shift completed; mints the PENDING credit entry (quarter-rounded)"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: ShiftSignup
    side_effects: ["mint PENDING CreditEntry (source_type SHIFT); completed_entry_id set"]

  - method: POST
    path: "/shift-signups/{signupId}/mark-no-show"
    description: "Mark a no-show after the shift completed; increments no_show_strikes"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: ShiftSignup
    side_effects: ["volunteer.no_show_strikes += 1"]

  # --- Inquiry ---
  - method: POST
    path: "/shifts/{shiftId}/inquiries"
    description: "Log a help-desk inquiry during a shift window (waived for follow-ups to CLOSED inquiries)"
    roles: [Volunteer]
    code: 201
    input: [volunteer_id, subject, contact_name, details, "follow_up_of_id?"]
    output: Inquiry
    side_effects: ["status LOGGED"]

  - method: GET
    path: "/inquiries"
    description: "List inquiries"
    roles: [ProgramCoordinator, Volunteer, Specialist]
    code: 200
    input: ["shift_id?", "volunteer_id?", "status?", "category?", "follow_up_of_id?", "limit?", "offset?"]
    output: "Inquiry[]"
    side_effects: []

  - method: GET
    path: "/inquiries/{inquiryId}"
    description: "Get an inquiry"
    roles: [ProgramCoordinator, Volunteer, Specialist]
    code: 200
    input: []
    output: Inquiry
    side_effects: []

  - method: POST
    path: "/inquiries/{inquiryId}/triage"
    description: "Triage a LOGGED inquiry; sets its category"
    roles: [ProgramCoordinator]
    code: 200
    input: [category]
    output: Inquiry
    side_effects: ["status LOGGED -> TRIAGED"]

  - method: POST
    path: "/inquiries/{inquiryId}/answer"
    description: "The logging volunteer answers a TRIAGED inquiry at the desk"
    roles: [Volunteer]
    code: 200
    input: [answer_text]
    output: Inquiry
    side_effects: ["TRIAGED -> CLOSED; resolution ANSWERED_AT_DESK; resolved_at stamped"]

  # --- DiagnosisReferral ---
  - method: POST
    path: "/inquiries/{inquiryId}/referrals"
    description: "Refer a TRIAGED inquiry to a specialist (explicit specialist_id or auto-selection per specialist_assignment_selector)"
    roles: [ProgramCoordinator]
    code: 201
    input: ["specialist_id?", "note?"]
    output: DiagnosisReferral
    side_effects: ["inquiry TRIAGED -> REFERRED; assignee open_referral_count += 1; due_at = clock + 48h"]

  - method: GET
    path: "/diagnosis-referrals"
    description: "List diagnosis referrals"
    roles: [ProgramCoordinator, Volunteer, Specialist]
    code: 200
    input: ["inquiry_id?", "specialist_id?", "last_specialist_id?", "answered_by_specialist_id?", "returned_by_specialist_id?", "status?", "limit?", "offset?"]
    output: "DiagnosisReferral[]"
    side_effects: []

  - method: GET
    path: "/diagnosis-referrals/{referralId}"
    description: "Get a diagnosis referral"
    roles: [ProgramCoordinator, Volunteer, Specialist]
    code: 200
    input: []
    output: DiagnosisReferral
    side_effects: []

  - method: POST
    path: "/diagnosis-referrals/{referralId}/start-review"
    description: "Assigned specialist starts review (OPEN -> IN_REVIEW)"
    roles: [Specialist]
    code: 200
    input: []
    output: DiagnosisReferral
    side_effects: []

  - method: POST
    path: "/diagnosis-referrals/{referralId}/answer"
    description: "Assigned specialist answers (IN_REVIEW -> ANSWERED); closes the inquiry; SLA late check"
    roles: [Specialist]
    code: 200
    input: [diagnosis_text]
    output: DiagnosisReferral
    side_effects: ["inquiry REFERRED -> CLOSED; open_referral_count -= 1; answered_count += 1; late_referral_count += 1 iff answered_at > due_at"]

  - method: POST
    path: "/diagnosis-referrals/{referralId}/return"
    description: "Assigned specialist returns the referral to the pool (IN_REVIEW -> RETURNED)"
    roles: [Specialist]
    code: 200
    input: [return_reason]
    output: DiagnosisReferral
    side_effects: ["open_referral_count -= 1; returned_count += 1; last_specialist_id set; specialist_id null"]

  - method: POST
    path: "/diagnosis-referrals/{referralId}/reassign"
    description: "Reassign a RETURNED referral (RETURNED -> OPEN); auto-selection excludes last_specialist_id"
    roles: [ProgramCoordinator]
    code: 200
    input: ["specialist_id?", "note?"]
    output: DiagnosisReferral
    side_effects: ["new assignee open_referral_count += 1; reassignment_count += 1; due_at refreshed to clock + 48h"]

  # --- Specialist ---
  - method: POST
    path: "/specialists"
    description: "Register a specialist"
    roles: [ProgramCoordinator]
    code: 201
    input: [name, specialty, max_concurrent_referrals, "accepting_referrals?"]
    output: Specialist
    side_effects: ["counters 0; scores 100.0"]

  - method: GET
    path: "/specialists"
    description: "List specialists"
    roles: [ProgramCoordinator, Volunteer, Specialist]
    code: 200
    input: ["specialty?", "accepting_referrals?", "limit?", "offset?"]
    output: "Specialist[]"
    side_effects: []

  - method: GET
    path: "/specialists/{specialistId}"
    description: "Get a specialist"
    roles: [ProgramCoordinator, Volunteer, Specialist]
    code: 200
    input: []
    output: Specialist
    side_effects: []

  - method: PATCH
    path: "/specialists/{specialistId}"
    description: "Update specialist capacity/availability (OCC-guarded)"
    roles: [ProgramCoordinator]
    code: 200
    input: [expected_specialist_version, "max_concurrent_referrals?", "accepting_referrals?"]
    output: Specialist
    side_effects: ["increments Specialist.version by 1"]

  # --- CommunityProject ---
  - method: POST
    path: "/projects"
    description: "Propose a community project (organizer self-service; cycle OPEN)"
    roles: [Volunteer]
    code: 201
    input: [cycle_id, organizer_volunteer_id, title, description, estimated_hours_per_volunteer]
    output: CommunityProject
    side_effects: ["status DRAFT"]

  - method: GET
    path: "/projects"
    description: "List community projects"
    roles: [ProgramCoordinator, Volunteer, Specialist]
    code: 200
    input: ["cycle_id?", "organizer_volunteer_id?", "status?", "limit?", "offset?"]
    output: "CommunityProject[]"
    side_effects: []

  - method: GET
    path: "/projects/{projectId}"
    description: "Get a community project"
    roles: [ProgramCoordinator, Volunteer, Specialist]
    code: 200
    input: []
    output: CommunityProject
    side_effects: []

  - method: PUT
    path: "/projects/{projectId}"
    description: "Amend a DRAFT or REVISION_REQUESTED project (OCC-guarded; organizer only)"
    roles: [Volunteer]
    code: 200
    input: [expected_project_version, "title?", "description?", "estimated_hours_per_volunteer?"]
    output: CommunityProject
    side_effects: ["increments CommunityProject.version by 1"]

  - method: POST
    path: "/projects/{projectId}/submit"
    description: "Submit for review (DRAFT or REVISION_REQUESTED -> UNDER_REVIEW)"
    roles: [Volunteer]
    code: 200
    input: []
    output: CommunityProject
    side_effects: []

  - method: POST
    path: "/projects/{projectId}/approve"
    description: "Approve an UNDER_REVIEW project; records approver; computes the per-volunteer credit cap"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: CommunityProject
    side_effects: ["approved_by_user_id set; max_creditable_hours_per_volunteer = min(round_half_up(estimated x 1.25, 2), 20.0)"]

  - method: POST
    path: "/projects/{projectId}/request-revision"
    description: "Send an UNDER_REVIEW project back for revision (REVISION_REQUESTED; resubmission loop)"
    roles: [ProgramCoordinator]
    code: 200
    input: [feedback]
    output: CommunityProject
    side_effects: ["feedback set"]

  - method: POST
    path: "/projects/{projectId}/reject"
    description: "Reject an UNDER_REVIEW project (terminal)"
    roles: [ProgramCoordinator]
    code: 200
    input: [reason]
    output: CommunityProject
    side_effects: ["feedback set"]

  - method: POST
    path: "/projects/{projectId}/close"
    description: "Close an APPROVED project; segregation of duties vs approved_by_user_id; voids PENDING project entries"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: CommunityProject
    side_effects: ["PENDING project-sourced CreditEntries -> VOIDED; affected records recomputed"]

  # --- RotationAssignment ---
  - method: POST
    path: "/rotation-assignments"
    description: "Assign a volunteer to a garden bed for a week (Monday start; closed-week overlap rule C; consecutive-week limit)"
    roles: [ProgramCoordinator]
    code: 201
    input: [bed_code, volunteer_id, week_start]
    output: RotationAssignment
    side_effects: ["cycle_id derived from the OPEN cycle containing week_start; week_end = week_start + 6 days"]

  - method: GET
    path: "/rotation-assignments"
    description: "List rotation assignments"
    roles: [ProgramCoordinator, Volunteer, Specialist]
    code: 200
    input: ["bed_code?", "volunteer_id?", "cycle_id?", "status?", "swapped_to_id?", "limit?", "offset?"]
    output: "RotationAssignment[]"
    side_effects: []

  - method: GET
    path: "/rotation-assignments/{assignmentId}"
    description: "Get a rotation assignment"
    roles: [ProgramCoordinator, Volunteer, Specialist]
    code: 200
    input: []
    output: RotationAssignment
    side_effects: []

  - method: POST
    path: "/rotation-assignments/{assignmentId}/complete"
    description: "Complete a rotation week after it ends; mints a PENDING GARDEN credit entry with actual_hours"
    roles: [ProgramCoordinator]
    code: 200
    input: [actual_hours]
    output: RotationAssignment
    side_effects: ["mint PENDING CreditEntry (source_type ROTATION)"]

  - method: POST
    path: "/rotation-assignments/{assignmentId}/mark-missed"
    description: "Mark a rotation week missed after it ends"
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: RotationAssignment
    side_effects: []

  - method: POST
    path: "/rotation-assignments/{assignmentId}/swap"
    description: "Swap an ASSIGNED week to another ACTIVE volunteer; original -> SWAPPED and a replacement is created"
    roles: [ProgramCoordinator]
    code: 200
    input: [new_volunteer_id]
    output: RotationAssignment
    side_effects: ["original -> SWAPPED with swapped_to_id set; new ASSIGNED assignment returned"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth & scope ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or the role is not a declared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "The caller's role is not in the endpoint's roles" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Entity-backed identity mismatch: volunteer/specialist acting on a resource owned by a different identity" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path id or referenced body id does not resolve to an existing resource" }

  # --- Schema / value ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, invalid enum member, or malformed value" }
  - { id: ERR_INVALID_FIELD_VALUE, http: 422, condition: "Static range/quantum violation: hours not a positive multiple of 0.25 or > 12.0; capacity outside 1..20; end_time <= start_time; scores outside 0..100; week_start not a Monday; actual_hours outside 0.5..8.0 or off-quantum; estimated_hours_per_volunteer <= 0 or off-quantum" }
  - { id: ERR_MISSING_KIND_FIELDS, http: 422, condition: "SERVICE entry without activity_type, or CONTINUING_ED entry without provider+title, or manual source_type SHIFT/ROTATION" }

  # --- OCC ---
  - { id: ERR_STALE_CYCLE_VERSION, http: 412, condition: "expected_cycle_version does not match the cycle's current version" }
  - { id: ERR_STALE_PROJECT_VERSION, http: 412, condition: "expected_project_version does not match the project's current version" }
  - { id: ERR_STALE_SPECIALIST_VERSION, http: 412, condition: "expected_specialist_version does not match the specialist's current version" }

  # --- Cycle posture ---
  - { id: ERR_CYCLE_NOT_OPEN, http: 409, condition: "Operation requires the cycle to be OPEN (credit-entry writes, shift creation, project creation, training writes)" }
  - { id: ERR_CYCLE_NOT_EDITABLE, http: 409, condition: "Cycle configuration edit attempted while RECERTIFICATION or CLOSED" }
  - { id: ERR_CYCLE_NOT_ACCEPTING_APPLICATIONS, http: 409, condition: "Application create/score/decide/promote attempted while cycle is RECERTIFICATION or CLOSED" }
  - { id: ERR_NO_OPEN_CYCLE, http: 409, condition: "Reactivation or rotation-week derivation finds no OPEN cycle (for rotations: no OPEN cycle whose window contains week_start)" }
  - { id: ERR_RECERT_WINDOW_NOT_OPEN, http: 409, condition: "begin-recertification before recert_opens_at on the logical clock" }
  - { id: ERR_INVALID_CYCLE_STATE, http: 409, condition: "Cycle transition invoked from a wrong from-state (open on non-DRAFT, begin-recertification on non-OPEN, close on non-RECERTIFICATION)" }

  # --- Application ---
  - { id: ERR_APPLICATION_NOT_SUBMITTED, http: 409, condition: "score requires the application to be SUBMITTED" }
  - { id: ERR_APPLICATION_NOT_SCORED, http: 409, condition: "decide requires SCORED (or WAITLISTED for ACCEPT/REJECT); also fires for terminal applications" }
  - { id: ERR_NO_SEATS_AVAILABLE, http: 409, condition: "ACCEPT decision or promotion while accepted_count == admission_capacity" }
  - { id: ERR_WAITLIST_EMPTY, http: 409, condition: "promote-waitlisted with a seat available but no WAITLISTED applications" }

  # --- Volunteer ---
  - { id: ERR_VOLUNTEER_NOT_ACTIVE, http: 409, condition: "Operation requires volunteer status ACTIVE (credit entries, signups, projects, rotation assignments)" }
  - { id: ERR_VOLUNTEER_NOT_INACTIVE, http: 409, condition: "reactivate requires status INACTIVE" }

  # --- Training ---
  - { id: ERR_ENROLLMENT_NOT_ENROLLED, http: 409, condition: "progress/complete requires ENROLLED status" }
  - { id: ERR_TRAINING_FULL, http: 409, condition: "enrolled_count == training_capacity for the cycle" }
  - { id: ERR_DUPLICATE_ENROLLMENT, http: 409, condition: "An ENROLLED enrollment already exists for (volunteer, cycle)" }

  # --- CreditEntry ---
  - { id: ERR_ENTRY_NOT_PENDING, http: 409, condition: "approve/reject requires PENDING status" }
  - { id: ERR_ENTRY_NOT_APPROVED, http: 409, condition: "revoke requires APPROVED status" }
  - { id: ERR_ACTIVITY_OUTSIDE_CYCLE_WINDOW, http: 422, condition: "activity_date falls outside [cycle.start_date, cycle.end_date] inclusive" }
  - { id: ERR_PROJECT_NOT_CREDITABLE, http: 409, condition: "source_type PROJECT references a project not in APPROVED or CLOSED status" }

  # --- Recertification ---
  - { id: ERR_RECORD_NOT_PENDING, http: 409, condition: "evaluate/grant-exemption requires the record to be PENDING" }

  # --- Shift ---
  - { id: ERR_SHIFT_LOCATION_CONFLICT, http: 409, condition: "Half-open overlap with a non-CANCELLED shift at the same location" }
  - { id: ERR_SHIFT_NOT_OPEN, http: 409, condition: "Signup requires shift status OPEN (FULL, COMPLETED, CANCELLED all fail)" }
  - { id: ERR_SHIFT_NOT_ENDED, http: 409, condition: "complete requires logical clock >= end_time" }
  - { id: ERR_SHIFT_NOT_COMPLETED, http: 409, condition: "signup complete/mark-no-show requires the parent shift COMPLETED" }
  - { id: ERR_SHIFT_NOT_CANCELLABLE, http: 409, condition: "cancel requires OPEN or FULL" }
  - { id: ERR_INVALID_SHIFT_STATE, http: 409, condition: "complete requires OPEN or FULL" }

  # --- ShiftSignup ---
  - { id: ERR_SIGNUP_NOT_SIGNED_UP, http: 409, condition: "complete/mark-no-show/cancel requires SIGNED_UP status" }
  - { id: ERR_DUPLICATE_SIGNUP, http: 409, condition: "A SIGNED_UP signup already exists for (volunteer, shift)" }
  - { id: ERR_NO_SHOW_LIMIT_REACHED, http: 409, condition: "volunteer.no_show_strikes >= 3 blocks new signups" }
  - { id: ERR_SIGNUP_SCHEDULE_CONFLICT, http: 409, condition: "Travel-buffer overlap with another SIGNED_UP shift (30 min cross-location, 0 same-location)" }
  - { id: ERR_CANCELLATION_WINDOW_CLOSED, http: 409, condition: "Signup cancellation attempted at or after shift start_time" }
  - { id: ERR_SIGNUP_WINDOW_CLOSED, http: 409, condition: "Signup attempted at or after shift start_time" }

  # --- Inquiry ---
  - { id: ERR_SHIFT_KIND_NOT_HELP_DESK, http: 409, condition: "Inquiries may only be logged on HELP_DESK shifts" }
  - { id: ERR_NO_SHIFT_SIGNUP, http: 409, condition: "The logging volunteer has no SIGNED_UP or COMPLETED signup on the shift" }
  - { id: ERR_OUTSIDE_SHIFT_WINDOW, http: 409, condition: "Inquiry logged while the logical clock is outside [start_time, end_time) (waived for follow-ups)" }
  - { id: ERR_FOLLOW_UP_TARGET_NOT_CLOSED, http: 409, condition: "follow_up_of_id references an inquiry not yet CLOSED" }
  - { id: ERR_INQUIRY_NOT_LOGGED, http: 409, condition: "triage requires LOGGED status" }
  - { id: ERR_INQUIRY_NOT_TRIAGED, http: 409, condition: "answer/referral requires TRIAGED status" }

  # --- DiagnosisReferral ---
  - { id: ERR_REFERRAL_ALREADY_OPEN, http: 409, condition: "The inquiry already has a referral in OPEN, IN_REVIEW, or RETURNED status (RETURNED must be reassigned, not replaced)" }
  - { id: ERR_NO_SPECIALIST_AVAILABLE, http: 409, condition: "Auto-selection found no accepting, under-capacity specialist of the matching specialty (or GENERAL fallback)" }
  - { id: ERR_SPECIALIST_AT_CAPACITY, http: 409, condition: "Explicit specialist_id has open_referral_count >= max_concurrent_referrals" }
  - { id: ERR_SPECIALTY_MISMATCH, http: 409, condition: "Explicit specialist specialty neither matches the inquiry category nor is GENERAL" }
  - { id: ERR_REFERRAL_NOT_OPEN, http: 409, condition: "start-review requires OPEN status" }
  - { id: ERR_REFERRAL_NOT_IN_REVIEW, http: 409, condition: "answer/return requires IN_REVIEW status" }
  - { id: ERR_REFERRAL_NOT_RETURNED, http: 409, condition: "reassign requires RETURNED status" }

  # --- CommunityProject ---
  - { id: ERR_PROJECT_NOT_EDITABLE, http: 409, condition: "PUT/submit requires DRAFT or REVISION_REQUESTED" }
  - { id: ERR_PROJECT_NOT_UNDER_REVIEW, http: 409, condition: "approve/request-revision/reject requires UNDER_REVIEW" }
  - { id: ERR_PROJECT_NOT_APPROVED, http: 409, condition: "close requires APPROVED" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Project close attempted by the same X-User-ID recorded in approved_by_user_id" }

  # --- RotationAssignment ---
  - { id: ERR_BED_WEEK_CONFLICT, http: 409, condition: "Closed-week overlap with an ASSIGNED or COMPLETED assignment on the same bed_code" }
  - { id: ERR_CONSECUTIVE_WEEK_LIMIT, http: 409, condition: "Volunteer already holds 2 consecutive weeks on this bed; the third consecutive week is rejected" }
  - { id: ERR_WEEK_NOT_ENDED, http: 409, condition: "complete/mark-missed require logical clock >= week_start + 7 days" }
  - { id: ERR_SWAP_WINDOW_CLOSED, http: 409, condition: "swap requires logical clock < week_start + 7 days" }
  - { id: ERR_ASSIGNMENT_NOT_ASSIGNED, http: 409, condition: "complete/mark-missed/swap requires ASSIGNED status" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramCoordinator
    description: "Extension program staff; administers cycles, admissions, training, credit decisions, shifts, referrals assignment, project review, garden rotation, and the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST/PUT /program-cycles and all /program-cycles/{id}/ action endpoints"
      - "POST /applications and score/decide endpoints"
      - "POST /volunteers/{id}/reactivate"
      - "POST /training-enrollments and progress/complete"
      - "POST /credit-entries/{id}/approve|reject|revoke"
      - "POST /recertification-records/{id}/evaluate|grant-exemption"
      - "POST /shifts, /shifts/{id}/cancel|complete"
      - "POST /shift-signups/{id}/complete|mark-no-show"
      - "POST /inquiries/{id}/triage"
      - "POST /inquiries/{id}/referrals, /diagnosis-referrals/{id}/reassign"
      - "POST/PATCH /specialists"
      - "POST /projects/{id}/approve|request-revision|reject|close"
      - "POST /rotation-assignments and complete/mark-missed/swap"
    shared_operations:
      - "All GET endpoints"
      - "POST /volunteers/{id}/withdraw (shared with the volunteer themself)"
      - "POST /shift-signups/{id}/cancel (shared with the signed-up volunteer)"

  - name: Volunteer
    description: "Master gardener volunteer (or trainee); logs own hours/CE, staffs shifts, logs and desk-answers inquiries, proposes and amends own community projects"
    identity: "entity_backed:Volunteer"
    exclusive_operations:
      - "POST /volunteers/{volunteerId}/credit-entries (own id)"
      - "POST /shifts/{shiftId}/signups (self)"
      - "POST /shifts/{shiftId}/inquiries (self, while staffed on the shift)"
      - "POST /inquiries/{id}/answer (the logging volunteer)"
      - "POST /projects (self as organizer), PUT /projects/{id}, POST /projects/{id}/submit (organizer)"
    shared_operations:
      - "All GET endpoints"
      - "POST /volunteers/{id}/withdraw (self)"
      - "POST /shift-signups/{id}/cancel (self)"

  - name: Specialist
    description: "Subject-matter specialist receiving plant/pest diagnosis referrals"
    identity: "entity_backed:Specialist"
    exclusive_operations:
      - "POST /diagnosis-referrals/{id}/start-review (assignee)"
      - "POST /diagnosis-referrals/{id}/answer (assignee)"
      - "POST /diagnosis-referrals/{id}/return (assignee)"
    shared_operations:
      - "All GET endpoints"
