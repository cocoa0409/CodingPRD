# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — ASC Scheduling
# 9 rule_ids x >= 2 instances each. All numeric asserts pre-computed as literals.
# Every call resolves to a §1.5 endpoint; OCC version inputs use ${var}.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: estimated_vs_actual_case_cost_diverge
        grounds:
          - calculations.estimated_case_cost
          - calculations.actual_case_cost
          - entities.SurgicalCase.fields.estimated_cost_cents
          - entities.SurgicalCase.fields.actual_cost_cents
          - state_machines.SurgicalCase.IN_RECOVERY_to_COMPLETED
        distinguishing_aspect: |
          Same SurgicalCase, two algorithms on the SurgicalCase cost domain: the booking-time
          estimate (60 sched min, MAC) = 78000 cents; the completion-time actual (78 min,
          18 over, MAC, overrun penalty 16500) = 152790 cents. The two values differ.
        test_recipe:
          setup:
            - "Facility (turnover 25, hp_validity 30); OR with prime [420,960); MD anesthesiologist; Phase-II recovery bay; MAC procedure scheduled_minutes=60; patient; surgical day OPEN; HELD block [480,600) (alloc 120)."
            - "One case booked at start_min=480 (sched 60 inherited), anesthesia + recovery assigned, cleared, day locked, started, moved to recovery."
          setup_api_calls:
            - call: "POST /asc/facilities"
              payload: { name: "ASC A", turnover_minutes: 25, hp_validity_days: 30 }
              as: Scheduler
              captures: { fac_id: $.data.id }
            - call: "POST /asc/facilities/${fac_id}/clock"
              payload: { to_iso8601: "2026-07-01T00:00:00.000Z" }
              as: Scheduler
            - call: "POST /asc/operating-rooms"
              payload: { facility_id: "${fac_id}", room_label: "OR-1", prime_time_start_min: 420, prime_time_end_min: 960 }
              as: ORManager
              captures: { or_id: $.data.id }
            - call: "POST /asc/recovery-bays"
              payload: { facility_id: "${fac_id}", bay_label: "PACU-1", phase2_capable: true }
              as: ORManager
              captures: { bay_id: $.data.id }
            - call: "POST /asc/anesthesiologists"
              payload: { facility_id: "${fac_id}", full_name: "Dr Gas", credential: "MD", active: true }
              as: ORManager
              captures: { anes_id: $.data.id }
            - call: "POST /asc/surgeons"
              payload: { facility_id: "${fac_id}", full_name: "Dr Cut", npi: "1234567890", active: true }
              as: Scheduler
              captures: { surg_id: $.data.id }
            - call: "POST /asc/procedures"
              payload: { facility_id: "${fac_id}", cpt_code: "29881", description: "Knee scope", scheduled_minutes: 60, cms_payment_indicator: "COVERED_ASC", cms_base_rate_cents: 150000, requires_phase2: false, anesthesia_class: "MAC" }
              as: BillingAnalyst
              captures: { proc_id: $.data.id }
            - call: "POST /asc/patients"
              payload: { facility_id: "${fac_id}", mrn: "MRN1", full_name: "Pat One", date_of_birth: "1980-01-01" }
              as: Scheduler
              captures: { pat_id: $.data.id }
            - call: "POST /asc/surgical-days"
              payload: { facility_id: "${fac_id}", service_date: "2026-07-15" }
              as: Scheduler
              captures: { day_id: $.data.id }
            - call: "POST /asc/surgeon-blocks"
              payload: { surgical_day_id: "${day_id}", surgeon_id: "${surg_id}", operating_room_id: "${or_id}", start_min: 480, end_min: 600 }
              as: Scheduler
              captures: { blk_id: $.data.id, blk_v: $.data.version }
            - call: "POST /asc/surgeon-blocks/${blk_id}/cases"
              payload: { expected_block_version: "${blk_v}", patient_id: "${pat_id}", procedure_id: "${proc_id}", start_min: 480, anesthesiologist_id: "${anes_id}", recovery_bay_id: "${bay_id}" }
              as: Scheduler
              captures: { case_id: $.data.id, est_cost: $.data.estimated_cost_cents }
            - call: "POST /asc/surgical-cases/${case_id}/clearance-checks"
              payload: { check_type: "HP_REVIEW", outcome: "PASS" }
              as: PreOpNurse
            - call: "POST /asc/surgical-cases/${case_id}/clear"
              payload: { hp_signed_at: "2026-07-10T00:00:00.000Z" }
              as: PreOpNurse
            - call: "POST /asc/surgical-days/${day_id}/lock"
              payload: {}
              as: Scheduler
            - call: "POST /asc/surgical-cases/${case_id}/start"
              payload: {}
              as: ORManager
            - call: "POST /asc/surgical-cases/${case_id}/to-recovery"
              payload: {}
              as: ORManager
          trigger:
            - call: "POST /asc/surgical-cases/${case_id}/complete"
              payload: { actual_minutes: 78 }
              as: ORManager
              captures: { act_cost: $.data.actual_cost_cents }
          assert:
            - "SurgicalCase.${case_id}.estimated_cost_cents == 78000"
            - "SurgicalCase.${case_id}.actual_cost_cents == 152790"
            - "SurgicalCase.${case_id}.estimated_cost_cents != SurgicalCase.${case_id}.actual_cost_cents"

      - name: projected_vs_actual_anesthesia_coverage_load
        grounds:
          - calculations.anesthesia_coverage_load_estimate
          - calculations.anesthesia_coverage_load_actual
          - entities.Anesthesiologist.fields.full_name
          - state_machines.SurgicalCase.IN_RECOVERY_to_COMPLETED
        distinguishing_aspect: |
          Different entity domain (Anesthesiologist staffing, not SurgicalCase cost): one completed
          case actual=78 vs scheduled=60 makes projected load (60/480 -> 12.5) diverge from actual
          load (78/480 -> 16.3) for the same anesthesiologist/day.
        test_recipe:
          setup:
            - "Facility, OR, Phase-II bay, MD anesthesiologist, MAC proc (60 min), patient, day, block [480,600)."
            - "One case booked start 480, anesthesia+recovery assigned, cleared, day locked, started, to recovery, COMPLETED with actual_minutes=78."
          setup_api_calls:
            - call: "POST /asc/facilities"
              payload: { name: "ASC B", turnover_minutes: 25, hp_validity_days: 30 }
              as: Scheduler
              captures: { fac_id: $.data.id }
            - call: "POST /asc/facilities/${fac_id}/clock"
              payload: { to_iso8601: "2026-07-01T00:00:00.000Z" }
              as: Scheduler
            - call: "POST /asc/operating-rooms"
              payload: { facility_id: "${fac_id}", room_label: "OR-1" }
              as: ORManager
              captures: { or_id: $.data.id }
            - call: "POST /asc/recovery-bays"
              payload: { facility_id: "${fac_id}", bay_label: "PACU-1", phase2_capable: true }
              as: ORManager
              captures: { bay_id: $.data.id }
            - call: "POST /asc/anesthesiologists"
              payload: { facility_id: "${fac_id}", full_name: "Dr Gas", credential: "MD" }
              as: ORManager
              captures: { anes_id: $.data.id }
            - call: "POST /asc/surgeons"
              payload: { facility_id: "${fac_id}", full_name: "Dr Cut", npi: "1234567890" }
              as: Scheduler
              captures: { surg_id: $.data.id }
            - call: "POST /asc/procedures"
              payload: { facility_id: "${fac_id}", cpt_code: "29881", description: "Knee scope", scheduled_minutes: 60, cms_payment_indicator: "COVERED_ASC", cms_base_rate_cents: 150000, anesthesia_class: "MAC" }
              as: BillingAnalyst
              captures: { proc_id: $.data.id }
            - call: "POST /asc/patients"
              payload: { facility_id: "${fac_id}", mrn: "MRN1", full_name: "Pat One", date_of_birth: "1980-01-01" }
              as: Scheduler
              captures: { pat_id: $.data.id }
            - call: "POST /asc/surgical-days"
              payload: { facility_id: "${fac_id}", service_date: "2026-07-15" }
              as: Scheduler
              captures: { day_id: $.data.id }
            - call: "POST /asc/surgeon-blocks"
              payload: { surgical_day_id: "${day_id}", surgeon_id: "${surg_id}", operating_room_id: "${or_id}", start_min: 480, end_min: 600 }
              as: Scheduler
              captures: { blk_id: $.data.id, blk_v: $.data.version }
            - call: "POST /asc/surgeon-blocks/${blk_id}/cases"
              payload: { expected_block_version: "${blk_v}", patient_id: "${pat_id}", procedure_id: "${proc_id}", start_min: 480, anesthesiologist_id: "${anes_id}", recovery_bay_id: "${bay_id}" }
              as: Scheduler
              captures: { case_id: $.data.id }
            - call: "POST /asc/surgical-cases/${case_id}/clearance-checks"
              payload: { check_type: "HP_REVIEW", outcome: "PASS" }
              as: PreOpNurse
            - call: "POST /asc/surgical-cases/${case_id}/clear"
              payload: { hp_signed_at: "2026-07-10T00:00:00.000Z" }
              as: PreOpNurse
            - call: "POST /asc/surgical-days/${day_id}/lock"
              payload: {}
              as: Scheduler
            - call: "POST /asc/surgical-cases/${case_id}/start"
              payload: {}
              as: ORManager
            - call: "POST /asc/surgical-cases/${case_id}/to-recovery"
              payload: {}
              as: ORManager
            - call: "POST /asc/surgical-cases/${case_id}/complete"
              payload: { actual_minutes: 78 }
              as: ORManager
          trigger:
            - call: "GET /asc/anesthesiologists/${anes_id}/coverage-load"
              payload: { service_date: "2026-07-15", basis: "PROJECTED" }
              as: BillingAnalyst
              captures: { proj_pct: $.data.coverage_load_pct }
            - call: "GET /asc/anesthesiologists/${anes_id}/coverage-load"
              payload: { service_date: "2026-07-15", basis: "ACTUAL" }
              as: BillingAnalyst
              captures: { act_pct: $.data.coverage_load_pct }
          assert:
            - "first trigger (PROJECTED) data.coverage_load_pct == 12.5"
            - "second trigger (ACTUAL) data.coverage_load_pct == 16.3"
            - "PROJECTED.coverage_load_pct != ACTUAL.coverage_load_pct"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: overrun_tiered_penalty_marginal_banding
        grounds:
          - calculations.overrun_tiered_penalty
          - calculations.actual_case_cost
          - state_machines.SurgicalCase.IN_RECOVERY_to_COMPLETED
        distinguishing_aspect: |
          Mode (a): >=3 inputs (overrun_min + two breakpoints + three marginal rates) with tiered
          selection and nested min/max. actual=106 vs sched=60 -> overrun 46 -> band1 15*800 +
          band2 30*1500 + band3 1*3000 = 12000+45000+3000 = 60000 penalty; actual cost = labor
          106*1200=127200 + MAC 18000 + 0 implant + 60000 = 205200.
        test_recipe:
          setup:
            - "Facility/OR/bay/MD-anesthesia/MAC-proc(60)/patient/day; block [480,720) alloc 240; one case booked 480, no implants, cleared, day locked, started, to recovery."
          setup_api_calls:
            - call: "POST /asc/facilities"
              payload: { name: "ASC C", turnover_minutes: 25, hp_validity_days: 30 }
              as: Scheduler
              captures: { fac_id: $.data.id }
            - call: "POST /asc/facilities/${fac_id}/clock"
              payload: { to_iso8601: "2026-07-01T00:00:00.000Z" }
              as: Scheduler
            - call: "POST /asc/operating-rooms"
              payload: { facility_id: "${fac_id}", room_label: "OR-1" }
              as: ORManager
              captures: { or_id: $.data.id }
            - call: "POST /asc/recovery-bays"
              payload: { facility_id: "${fac_id}", bay_label: "PACU-1", phase2_capable: true }
              as: ORManager
              captures: { bay_id: $.data.id }
            - call: "POST /asc/anesthesiologists"
              payload: { facility_id: "${fac_id}", full_name: "Dr Gas", credential: "MD" }
              as: ORManager
              captures: { anes_id: $.data.id }
            - call: "POST /asc/surgeons"
              payload: { facility_id: "${fac_id}", full_name: "Dr Cut", npi: "1234567890" }
              as: Scheduler
              captures: { surg_id: $.data.id }
            - call: "POST /asc/procedures"
              payload: { facility_id: "${fac_id}", cpt_code: "29881", description: "Knee scope", scheduled_minutes: 60, cms_payment_indicator: "COVERED_ASC", cms_base_rate_cents: 150000, anesthesia_class: "MAC" }
              as: BillingAnalyst
              captures: { proc_id: $.data.id }
            - call: "POST /asc/patients"
              payload: { facility_id: "${fac_id}", mrn: "MRN1", full_name: "Pat One", date_of_birth: "1980-01-01" }
              as: Scheduler
              captures: { pat_id: $.data.id }
            - call: "POST /asc/surgical-days"
              payload: { facility_id: "${fac_id}", service_date: "2026-07-15" }
              as: Scheduler
              captures: { day_id: $.data.id }
            - call: "POST /asc/surgeon-blocks"
              payload: { surgical_day_id: "${day_id}", surgeon_id: "${surg_id}", operating_room_id: "${or_id}", start_min: 480, end_min: 720 }
              as: Scheduler
              captures: { blk_id: $.data.id, blk_v: $.data.version }
            - call: "POST /asc/surgeon-blocks/${blk_id}/cases"
              payload: { expected_block_version: "${blk_v}", patient_id: "${pat_id}", procedure_id: "${proc_id}", start_min: 480, anesthesiologist_id: "${anes_id}", recovery_bay_id: "${bay_id}" }
              as: Scheduler
              captures: { case_id: $.data.id }
            - call: "POST /asc/surgical-cases/${case_id}/clearance-checks"
              payload: { check_type: "HP_REVIEW", outcome: "PASS" }
              as: PreOpNurse
            - call: "POST /asc/surgical-cases/${case_id}/clear"
              payload: { hp_signed_at: "2026-07-10T00:00:00.000Z" }
              as: PreOpNurse
            - call: "POST /asc/surgical-days/${day_id}/lock"
              payload: {}
              as: Scheduler
            - call: "POST /asc/surgical-cases/${case_id}/start"
              payload: {}
              as: ORManager
            - call: "POST /asc/surgical-cases/${case_id}/to-recovery"
              payload: {}
              as: ORManager
          trigger:
            - call: "POST /asc/surgical-cases/${case_id}/complete"
              payload: { actual_minutes: 106 }
              as: ORManager
              captures: { act_cost: $.data.actual_cost_cents }
          assert:
            - "SurgicalCase.${case_id}.actual_cost_cents == 205200"

      - name: asc_payment_grouping_pinned_evaluation_order
        grounds:
          - calculations.asc_payment_grouping
          - entities.Procedure.fields.cms_payment_indicator
          - entities.Procedure.fields.device_offset_pct
          - entities.SurgicalCase.fields.cms_payment_cents
          - state_machines.CaseImplant.RESERVED_to_CONSUMED
        distinguishing_aspect: |
          Mode (c): circular-looking dependency pinned to STEP1->STEP2(device offset)->STEP3(multi-proc
          reduction on the post-offset grouped). DEVICE_INTENSIVE base 200000, device_offset_pct 30,
          one device implant unit 12345 qty 2 consumed (24690). device_offset = min(rhu(200000*0.30)=60000,
          24690) = 24690 -> grouped 224690. This is the patient's 2nd completed case on the day, so
          multi-proc reduction applies AFTER offset: rhu(224690*0.5) = 112345.
        test_recipe:
          setup:
            - "Facility(turnover 0)/OR/bay/MD-anesthesia/patient; two procedures (COVERED 30 min first; DEVICE_INTENSIVE base 200000 offset 30, 30 min); device SupplyItem unit 12345 on_hand 10; day; block [480,600); both cases SAME patient SAME day; first completed, second has device implant consumed 2 then completed."
          setup_api_calls:
            - call: "POST /asc/facilities"
              payload: { name: "ASC D", turnover_minutes: 0, hp_validity_days: 30 }
              as: Scheduler
              captures: { fac_id: $.data.id }
            - call: "POST /asc/facilities/${fac_id}/clock"
              payload: { to_iso8601: "2026-07-01T00:00:00.000Z" }
              as: Scheduler
            - call: "POST /asc/operating-rooms"
              payload: { facility_id: "${fac_id}", room_label: "OR-1" }
              as: ORManager
              captures: { or_id: $.data.id }
            - call: "POST /asc/recovery-bays"
              payload: { facility_id: "${fac_id}", bay_label: "PACU-1", phase2_capable: true }
              as: ORManager
              captures: { bay_id: $.data.id }
            - call: "POST /asc/anesthesiologists"
              payload: { facility_id: "${fac_id}", full_name: "Dr Gas", credential: "MD" }
              as: ORManager
              captures: { anes_id: $.data.id }
            - call: "POST /asc/surgeons"
              payload: { facility_id: "${fac_id}", full_name: "Dr Cut", npi: "1234567890" }
              as: Scheduler
              captures: { surg_id: $.data.id }
            - call: "POST /asc/procedures"
              payload: { facility_id: "${fac_id}", cpt_code: "11111", description: "First proc", scheduled_minutes: 30, cms_payment_indicator: "COVERED_ASC", cms_base_rate_cents: 100000, anesthesia_class: "MAC" }
              as: BillingAnalyst
              captures: { proc1_id: $.data.id }
            - call: "POST /asc/procedures"
              payload: { facility_id: "${fac_id}", cpt_code: "22222", description: "Device proc", scheduled_minutes: 30, cms_payment_indicator: "DEVICE_INTENSIVE", cms_base_rate_cents: 200000, anesthesia_class: "MAC", device_offset_pct: 30 }
              as: BillingAnalyst
              captures: { proc2_id: $.data.id }
            - call: "POST /asc/supply-items"
              payload: { facility_id: "${fac_id}", sku: "DEV1", description: "Implant", unit_cost_cents: 12345, is_device: true, on_hand_qty: 10 }
              as: ORManager
              captures: { item_id: $.data.id }
            - call: "POST /asc/patients"
              payload: { facility_id: "${fac_id}", mrn: "MRN1", full_name: "Pat One", date_of_birth: "1980-01-01" }
              as: Scheduler
              captures: { pat_id: $.data.id }
            - call: "POST /asc/surgical-days"
              payload: { facility_id: "${fac_id}", service_date: "2026-07-15" }
              as: Scheduler
              captures: { day_id: $.data.id }
            - call: "POST /asc/surgeon-blocks"
              payload: { surgical_day_id: "${day_id}", surgeon_id: "${surg_id}", operating_room_id: "${or_id}", start_min: 480, end_min: 600 }
              as: Scheduler
              captures: { blk_id: $.data.id, blk_v0: $.data.version }
            - call: "POST /asc/surgeon-blocks/${blk_id}/cases"
              payload: { expected_block_version: "${blk_v0}", patient_id: "${pat_id}", procedure_id: "${proc1_id}", start_min: 480, anesthesiologist_id: "${anes_id}", recovery_bay_id: "${bay_id}" }
              as: Scheduler
              captures: { case1_id: $.data.id, blk_v1: $.data.version }
            - call: "POST /asc/surgeon-blocks/${blk_id}/cases"
              payload: { expected_block_version: "${blk_v1}", patient_id: "${pat_id}", procedure_id: "${proc2_id}", start_min: 510, anesthesiologist_id: "${anes_id}", recovery_bay_id: "${bay_id}" }
              as: Scheduler
              captures: { case2_id: $.data.id }
            - call: "POST /asc/surgical-cases/${case2_id}/implants"
              payload: { supply_item_id: "${item_id}", planned_qty: 2 }
              as: ORManager
              captures: { imp_id: $.data.id }
            - call: "PATCH /asc/case-implants/${imp_id}"
              payload: { consumed_qty: 2 }
              as: ORManager
            - call: "POST /asc/surgical-cases/${case1_id}/clearance-checks"
              payload: { check_type: "HP_REVIEW", outcome: "PASS" }
              as: PreOpNurse
            - call: "POST /asc/surgical-cases/${case1_id}/clear"
              payload: { hp_signed_at: "2026-07-10T00:00:00.000Z" }
              as: PreOpNurse
            - call: "POST /asc/surgical-cases/${case2_id}/clearance-checks"
              payload: { check_type: "HP_REVIEW", outcome: "PASS" }
              as: PreOpNurse
            - call: "POST /asc/surgical-cases/${case2_id}/clear"
              payload: { hp_signed_at: "2026-07-10T00:00:00.000Z" }
              as: PreOpNurse
            - call: "POST /asc/surgical-days/${day_id}/lock"
              payload: {}
              as: Scheduler
            - call: "POST /asc/surgical-cases/${case1_id}/start"
              payload: {}
              as: ORManager
            - call: "POST /asc/surgical-cases/${case1_id}/to-recovery"
              payload: {}
              as: ORManager
            - call: "POST /asc/surgical-cases/${case1_id}/complete"
              payload: { actual_minutes: 30 }
              as: ORManager
            - call: "POST /asc/surgical-cases/${case2_id}/start"
              payload: {}
              as: ORManager
            - call: "POST /asc/surgical-cases/${case2_id}/to-recovery"
              payload: {}
              as: ORManager
          trigger:
            - call: "POST /asc/surgical-cases/${case2_id}/complete"
              payload: { actual_minutes: 30 }
              as: ORManager
              captures: { pay2: $.data.cms_payment_cents }
          assert:
            - "SurgicalCase.${case2_id}.cms_payment_cents == 112345"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: case_parallel_dimensions_evolve_independently
        grounds:
          - state_machines.SurgicalCase.PENDING_CLEARANCE_to_ON_HOLD
          - state_machines.SurgicalCase.ON_HOLD_to_PENDING_CLEARANCE
          - entities.SurgicalCase.fields.case_status
          - entities.SurgicalCase.fields.clearance_status
        distinguishing_aspect: |
          Parallel dimensions on SurgicalCase: clearance_status moves PENDING_CLEARANCE -> ON_HOLD ->
          PENDING_CLEARANCE while case_status stays SCHEDULED throughout — the two axes are independent.
        test_recipe:
          setup:
            - "Facility/OR/surgeon/MAC-proc(60)/patient/day; block [480,600); one case booked 480 (case_status SCHEDULED, clearance PENDING_CLEARANCE); one FAIL clearance check drives clearance to ON_HOLD."
          setup_api_calls:
            - call: "POST /asc/facilities"
              payload: { name: "ASC E", turnover_minutes: 25, hp_validity_days: 30 }
              as: Scheduler
              captures: { fac_id: $.data.id }
            - call: "POST /asc/operating-rooms"
              payload: { facility_id: "${fac_id}", room_label: "OR-1" }
              as: ORManager
              captures: { or_id: $.data.id }
            - call: "POST /asc/surgeons"
              payload: { facility_id: "${fac_id}", full_name: "Dr Cut", npi: "1234567890" }
              as: Scheduler
              captures: { surg_id: $.data.id }
            - call: "POST /asc/procedures"
              payload: { facility_id: "${fac_id}", cpt_code: "29881", description: "Knee scope", scheduled_minutes: 60, cms_payment_indicator: "COVERED_ASC", cms_base_rate_cents: 150000, anesthesia_class: "MAC" }
              as: BillingAnalyst
              captures: { proc_id: $.data.id }
            - call: "POST /asc/patients"
              payload: { facility_id: "${fac_id}", mrn: "MRN1", full_name: "Pat One", date_of_birth: "1980-01-01" }
              as: Scheduler
              captures: { pat_id: $.data.id }
            - call: "POST /asc/surgical-days"
              payload: { facility_id: "${fac_id}", service_date: "2026-07-15" }
              as: Scheduler
              captures: { day_id: $.data.id }
            - call: "POST /asc/surgeon-blocks"
              payload: { surgical_day_id: "${day_id}", surgeon_id: "${surg_id}", operating_room_id: "${or_id}", start_min: 480, end_min: 600 }
              as: Scheduler
              captures: { blk_id: $.data.id, blk_v: $.data.version }
            - call: "POST /asc/surgeon-blocks/${blk_id}/cases"
              payload: { expected_block_version: "${blk_v}", patient_id: "${pat_id}", procedure_id: "${proc_id}", start_min: 480 }
              as: Scheduler
              captures: { case_id: $.data.id }
            - call: "POST /asc/surgical-cases/${case_id}/clearance-checks"
              payload: { check_type: "LABS", outcome: "FAIL" }
              as: PreOpNurse
          trigger:
            - call: "POST /asc/surgical-cases/${case_id}/clearance-reset"
              payload: {}
              as: PreOpNurse
