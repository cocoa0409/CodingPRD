              as: ClaimsAuditor
              as_user_id: "u-auditor-1"
              captures: { cb_id: $.data.id, cb_status: $.data.status, cb_amt: $.data.amount_cents, cb_reason: $.data.reason }
            - call: "GET /incentives/claims/${c2}"
              payload: {}
              as: ClaimsAuditor
              as_user_id: "u-auditor-1"
