            - "LaborLine.${l2}.status == NOT_STARTED (clock-in rejected)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: core_charge_return_restores_core_deposit_total
        grounds:
          - state_machines.CoreCharge.CHARGED_to_CORE_RETURNED
          - entities.RepairOrder.fields.core_deposit_total_cents
          - entities.CoreCharge.fields.deposit_cents
          - entities.CoreCharge.fields.refunded_cents
        distinguishing_aspect: |
          Conserved quantity = RepairOrder.core_deposit_total_cents, pinned as
          sum(CoreCharge.deposit_cents where status==CHARGED). Charging a core
          (+6000) then returning it (-6000) leaves the total back at 0; refunded
          equals the deposit.
        test_recipe:
          setup:
            - "Markup tier covering 8000; RO ESTIMATE; one cored part qty2 deposit 3000/unit -> CoreCharge deposit 6000 (total=6000)"
          setup_api_calls:
            - call: "POST /markup-tiers"
              payload: { tier_index: 0, lower_bound_cents: 0, upper_bound_cents: 20000, markup_pct: 0.40 }
              as: PartsManager
            - call: "POST /customers"
              payload: { full_name: "Pa Owner", phone: "555-16", email: "pa@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", vin: "VINCC01", make: "Dodge", model: "Ram", model_year: 2019, odometer_miles: 40000 }
              as: ShopManager
              captures: { veh_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}", tax_rate: 0.0 }
              as: ShopManager
              captures: { ro_id: $.data.id }
            - call: "POST /repair-orders/${ro_id}/part-lines"
              payload: { part_number: "CC-1", description: "Caliper", quantity: 2, unit_cost_cents: 8000, markup_mode: "FLAT_BRACKET", has_core: true, core_deposit_cents: 3000 }
              as: PartsManager
              captures: { pl_id: $.data.id }
            - call: "GET /core-charges"
              payload: {}
              as: PartsManager
              captures: { cc_id: "$.data[0].id", cc_dep: "$.data[0].deposit_cents" }
          trigger:
            - call: "POST /core-charges/${cc_id}/return"
              payload: {}
              as: PartsManager
              captures: { ref: $.data.refunded_cents }
            - call: "GET /repair-orders/${ro_id}"
              payload: {}
              as: PartsManager
              captures: { core_total: $.data.core_deposit_total_cents }
          assert:
            - "CoreCharge.${cc_id}.deposit_cents == 6000 before return"
            - "CoreCharge.${cc_id}.refunded_cents == 6000 after return"
            - "RepairOrder.${ro_id}.core_deposit_total_cents == 0 (deposit +6000 then -6000 nets to 0)"

      - name: warranty_comeback_debit_preserves_shop_banked_flat_hours
        grounds:
          - state_machines.RepairOrder.IN_PROGRESS_to_COMPLETED
          - calculations.warranty_comeback_window
          - calculations.technician_efficiency
          - entities.Technician.fields.banked_flat_hours
        distinguishing_aspect: |
          Conserved quantity = Technician.banked_flat_hours (a DIFFERENT quantity
          than the core deposit): the original RO credits +2.0 book hours to the
          tech; completing the within-warranty comeback's is_warranty rework debits
          -2.0 from the same tech, netting banked_flat_hours back to 0.0 so free
          rework does not inflate efficiency.
        test_recipe:
          setup:
            - "Clock set to 2026-01-01; op WARR book 2.0 rate 12000"
            - "Original RO closed at 2026-01-01 with vehicle odometer 40000, tech credited +2.0/+1.5 hours"
            - "Clock advanced to 2026-02-01 (within 90 days / 4000 miles); comeback RO created against the original"
            - "Comeback has one is_warranty labor line (book 2.0) by a different tech, completed"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T08:00:00Z" }
              as: ShopManager
            - call: "POST /labor-operations"
              payload: { op_code: "WARR", description: "Transmission", book_hours: 2.0, default_rate_cents: 12000 }
              as: ShopManager
              captures: { op_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Orig Tech" }
              as: ShopManager
              captures: { tech_o: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Comeback Tech" }
              as: ShopManager
              captures: { tech_c: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Wa Owner", phone: "555-17", email: "wa@x.com" }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
