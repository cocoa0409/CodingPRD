      - name: rebooking_is_allowed_on_the_deadline_instant_and_refused_one_second_later
        claim_type: temporal_validation
        grounds: >-
          validations[priority=56] ("the logical clock is at or before
          Event.rebook_deadline_at (inclusive)") -> ERR_REBOOK_WINDOW_CLOSED 422
          on POST /bookings/{id}/rebook; state_machines.Event
          SCHEDULED -> POSTPONED ("rebook_deadline_at = logical_now +
          REBOOK_WINDOW_DAYS (= 21) days") and its hop-2 cascade freezing live
          bookings into REBOOK_PENDING.
        distinguishing_aspect: >-
          The deadline is derived from the POSTPONEMENT instant rather than from
          the event date, and it is inclusive: with the postponement taken at the
          default clock the boundary lands on 2026-08-22T00:00:00.000Z, where one
          frozen booking rebooks successfully, while a sibling booking one second
          later is refused. Two bookings are frozen by the same cascade so the two
          calls differ only in the clock.
        test_recipe:
          setup: >-
            Simple pricing fixture (no rights deal) with two 5-unit CORPORATE
            bookings, then POST /events/{id}/postpone at the default clock, which
            drives both bookings to REBOOK_PENDING and stamps
            rebook_deadline_at = 2026-08-22T00:00:00.000Z.
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /events", payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { ev_id: "$.data.id" } }
            - { call: "POST /package-products", payload: { event_id: "${ev_id}", name: "Bronze Hospitality", tier: "BRONZE", tickets_per_package: 2, min_margin_pct: 0.1000 }, as: CommercialManager, as_user_id: u_pricer, captures: { pkg_id: "$.data.id" } }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "TICKET", descriptor: "Category 1 seat pair", quantity: 2, unit_cost_cents: 50000, markup_pct: 0.2000, sequence_no: 1 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-products/${pkg_id}/price", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { pkg_v: "$.data.version" } }
            - { call: "POST /package-products/${pkg_id}/publish", payload: { expected_package_product_version: "${pkg_v}" }, as: CommercialDirector, as_user_id: u_director }
            - { call: "POST /clients", payload: { name: "Northbridge Capital", client_type: "CORPORATE", credit_limit_cents: 50000000 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { cl_id: "$.data.id" } }
            - { call: "POST /bookings", payload: { client_id: "${cl_id}", package_product_id: "${pkg_id}", channel: "CORPORATE", units: 5 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { b1: "$.data.id" } }
            - { call: "POST /bookings", payload: { client_id: "${cl_id}", package_product_id: "${pkg_id}", channel: "CORPORATE", units: 5 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { b2: "$.data.id" } }
            - { call: "POST /events/${ev_id}/postpone", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { ev_status: "$.data.status", deadline: "$.data.rebook_deadline_at", pc: "$.data.postponement_count" } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-22T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /bookings/${b1}/rebook", payload: { target_package_product_id: "${pkg_id}" }, as: ClientServiceAgent, as_user_id: u_csa, captures: { r1_status: "$.data.fulfillment_status", r1_count: "$.data.rebook_count" } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-22T00:00:01Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /bookings/${b2}/rebook", payload: { target_package_product_id: "${pkg_id}" }, as: ClientServiceAgent, as_user_id: u_csa, captures: { e_late: "$.data.error_id" } }
            - { call: "GET /bookings/${b2}", payload: {}, as: ClientServiceAgent, as_user_id: u_csa, captures: { b2_status: "$.data.fulfillment_status", b2_count: "$.data.rebook_count" } }
          assert: >-
            The postponement stamps ${ev_status} == "POSTPONED",
            ${pc} == 1 and ${deadline} == "2026-08-22T00:00:00.000Z"
            (= the postponement instant + 21 days, not anything derived from the
            event date).
            Rebooking exactly ON that instant succeeds: ${r1_status} ==
            "RESERVED" with ${r1_count} == 1.
            One second later the identical call on the sibling booking answers 422
            with ${e_late} == "ERR_REBOOK_WINDOW_CLOSED", and the booking is
            untouched: ${b2_status} == "REBOOK_PENDING" with ${b2_count} == 0.

      - name: installment_payment_must_match_the_scheduled_amount_to_the_cent
        claim_type: violation_to_error
        grounds: >-
          validations[priority=70] ("amount_cents_paid equals
          PaymentInstallment.amount_cents exactly — partial and over payments are
          rejected") -> ERR_INSTALLMENT_AMOUNT_MISMATCH 422, and
          validations[priority=46] ("installment_state IN {SCHEDULED, OVERDUE}")
          -> ERR_INSTALLMENT_NOT_PAYABLE 409, both on
          POST /payment-installments/{id}/pay.
        distinguishing_aspect: >-
          Both sides of "exactly" are probed one cent apart on the SAME
          installment — 167615 and 167617 against a 167616 line — so an
          implementation using `<=` accepts the underpayment and one using `>=`
          accepts the overpayment. The exact payment then succeeds and the replay
          of that very call switches error class from 422 to a 409 state conflict,
          which pins the payment as non-idempotent rather than merely
          amount-checked.
        test_recipe:
          setup: >-
            Simple pricing fixture (no rights deal) with one 5-unit CORPORATE
            booking netting 558720, whose schedule is 167616 / 223488 / 167616.
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /events", payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { ev_id: "$.data.id" } }
            - { call: "POST /package-products", payload: { event_id: "${ev_id}", name: "Bronze Hospitality", tier: "BRONZE", tickets_per_package: 2, min_margin_pct: 0.1000 }, as: CommercialManager, as_user_id: u_pricer, captures: { pkg_id: "$.data.id" } }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "TICKET", descriptor: "Category 1 seat pair", quantity: 2, unit_cost_cents: 50000, markup_pct: 0.2000, sequence_no: 1 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-products/${pkg_id}/price", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { pkg_v: "$.data.version" } }
            - { call: "POST /package-products/${pkg_id}/publish", payload: { expected_package_product_version: "${pkg_v}" }, as: CommercialDirector, as_user_id: u_director }
            - { call: "POST /clients", payload: { name: "Northbridge Capital", client_type: "CORPORATE", credit_limit_cents: 50000000 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { cl_id: "$.data.id" } }
            - { call: "POST /bookings", payload: { client_id: "${cl_id}", package_product_id: "${pkg_id}", channel: "CORPORATE", units: 5 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { bk_id: "$.data.id" } }
            - { call: "GET /payment-installments", payload: { booking_id: "${bk_id}", limit: 10, offset: 0 }, as: FinanceController, as_user_id: u_fin, captures: { i1: "$.data[0].id", i1_amt: "$.data[0].amount_cents", i1_state: "$.data[0].installment_state" } }
          trigger:
            - { call: "POST /payment-installments/${i1}/pay", payload: { amount_cents_paid: 167615 }, as: FinanceController, as_user_id: u_fin, captures: { e_under: "$.data.error_id" } }
            - { call: "POST /payment-installments/${i1}/pay", payload: { amount_cents_paid: 167617 }, as: FinanceController, as_user_id: u_fin, captures: { e_over: "$.data.error_id" } }
            - { call: "POST /payment-installments/${i1}/pay", payload: { amount_cents_paid: 167616 }, as: FinanceController, as_user_id: u_fin, captures: { p_state: "$.data.installment_state", p_amt: "$.data.paid_amount_cents", p_at: "$.data.paid_at" } }
            - { call: "POST /payment-installments/${i1}/pay", payload: { amount_cents_paid: 167616 }, as: FinanceController, as_user_id: u_fin, captures: { e_replay: "$.data.error_id" } }
            - { call: "GET /bookings/${bk_id}", payload: {}, as: FinanceController, as_user_id: u_fin, captures: { bk_paid: "$.data.paid_cents", bk_pay_state: "$.data.payment_status" } }
            - { call: "GET /clients/${cl_id}", payload: {}, as: FinanceController, as_user_id: u_fin, captures: { cl_out: "$.data.outstanding_cents" } }
          assert: >-
            Setup: ${i1_amt} == 167616 with ${i1_state} == "SCHEDULED".
            One cent short answers 422 with
            ${e_under} == "ERR_INSTALLMENT_AMOUNT_MISMATCH"; one cent long answers
            422 with the same ${e_over} == "ERR_INSTALLMENT_AMOUNT_MISMATCH".
            The exact amount answers 200: ${p_state} == "PAID",
            ${p_amt} == 167616 and ${p_at} == "2026-08-01T00:00:00.000Z".
            Replaying that identical successful call answers 409 with
            ${e_replay} == "ERR_INSTALLMENT_NOT_PAYABLE" — a state conflict, not
            an amount conflict — and the money moved exactly once:
            ${bk_paid} == 167616, ${bk_pay_state} == "DEPOSIT_PAID" and
            ${cl_out} == 391104 (= 558720 - 167616).

      - name: publish_is_refused_below_the_margin_floor_and_allowed_once_a_component_lifts_it
        claim_type: satisfaction_to_pass
        grounds: >-
          validations[priority=71] ("PackageProduct.margin_pct >=
          PackageProduct.min_margin_pct") -> ERR_MARGIN_BELOW_FLOOR 422 on
          POST /package-products/{id}/publish; validations[priority=44] (adding a
          component or pricing requires package_status IN {DRAFT, PRICED});
          calculations.package_product_pricing (margin_pct = (list_price_cents -
          base_cost_cents) / list_price_cents).
        distinguishing_aspect: >-
          The floor is crossed by CHANGING the package rather than by comparing
          two packages: a single low-markup component leaves margin_pct 0.1667
          against a 0.5000 floor, then a second high-markup component and a
          re-price lift it to 0.5238 and the identical publish call succeeds. The
          rejected publish deliberately carries the CORRECT
          expected_package_product_version and a publisher distinct from the
          pricer, so neither priority 32 nor priority 51 can be blamed for the
          422.
        test_recipe:
          setup: "Canonical event with a DRAFT BRONZE package whose min_margin_pct is 0.5000 and one component at markup 0.2000, priced."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /events", payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { ev_id: "$.data.id" } }
            - { call: "POST /package-products", payload: { event_id: "${ev_id}", name: "Thin Margin Bronze", tier: "BRONZE", tickets_per_package: 2, min_margin_pct: 0.5000 }, as: CommercialManager, as_user_id: u_pricer, captures: { pkg_id: "$.data.id" } }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "TICKET", descriptor: "Category 1 seat pair", quantity: 2, unit_cost_cents: 50000, markup_pct: 0.2000, sequence_no: 1 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-products/${pkg_id}/price", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { v1: "$.data.version", base1: "$.data.base_cost_cents", list1: "$.data.list_price_cents", m1: "$.data.margin_pct", st1: "$.data.package_status" } }
          trigger:
            - { call: "POST /package-products/${pkg_id}/publish", payload: { expected_package_product_version: "${v1}" }, as: CommercialDirector, as_user_id: u_director, captures: { e_floor: "$.data.error_id" } }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "EXPERIENCE", descriptor: "Pitchside pre-match access", quantity: 1, unit_cost_cents: 100000, markup_pct: 2.0000, sequence_no: 2 }, as: CommercialManager, as_user_id: u_pricer, captures: { c2_cost: "$.data.line_cost_cents", c2_price: "$.data.line_price_cents" } }
            - { call: "POST /package-products/${pkg_id}/price", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { v2: "$.data.version", base2: "$.data.base_cost_cents", sub2: "$.data.component_price_subtotal_cents", list2: "$.data.list_price_cents", m2: "$.data.margin_pct" } }
            - { call: "POST /package-products/${pkg_id}/publish", payload: { expected_package_product_version: "${v2}" }, as: CommercialDirector, as_user_id: u_director, captures: { st2: "$.data.package_status", pub_by: "$.data.published_by_user_id", pub_at: "$.data.published_at" } }
          assert: >-
            After the first pricing ${st1} == "PRICED" with ${base1} == 100000,
            ${list1} == 120000 and ${m1} == 0.1667.
            Publishing answers 422 with ${e_floor} == "ERR_MARGIN_BELOW_FLOOR"
            (the version was current and the publisher u_director is not the
            pricer u_pricer, so priorities 32 and 51 are both satisfied), and the
            package stays PRICED — proven by the fact that the next
            POST /package-components succeeds under priority 44 with
            ${c2_cost} == 100000 and ${c2_price} == 300000.
            Re-pricing gives ${base2} == 200000, ${sub2} == 420000,
            ${list2} == 420000 and ${m2} == 0.5238
            (= round_half_up_4(220000 / 420000)) — now at or above the floor —
            and the identical publish call answers 200 with
            ${st2} == "PUBLISHED", ${pub_by} == "u_director" and
            ${pub_at} == "2026-08-01T00:00:00.000Z". ${v2} > ${v1}.

      - name: allocate_requires_both_a_matching_channel_and_a_released_deal
        claim_type: cross_entity_validation
        grounds: >-
          validations[priority=72] ("the Booking's channel equals the
          AllocationBlock's channel, and the block's RightsDeal.deal_status IN
          {PARTIALLY_RELEASED, FULLY_RELEASED}") -> ERR_CHANNEL_OR_DEAL_MISMATCH
          422 on POST /bookings/{id}/allocate.
        distinguishing_aspect: >-
          The single rule is a conjunction of two unrelated joins, so the fixture
          carries two deals on one event: a FULLY_RELEASED deal with a CORPORATE
          block and a merely COMMITTED deal with an INDIVIDUAL block. An
          INDIVIDUAL booking fails on the channel arm against the first block and
          on the deal-status arm against the second, and a CORPORATE booking then
          succeeds against the first — so an implementation that checks only one
          arm passes exactly one of the two rejections.
        test_recipe:
          setup: >-
            Canonical event; deal A contracted 40 (guaranteed_minimum 0) with a
            CORPORATE block target 40, fully released; deal B contracted 40
            committed but never released, with an INDIVIDUAL block target 40;
            published BRONZE package; one client; one 5-unit INDIVIDUAL booking
            and one 5-unit CORPORATE booking, both RESERVED.
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /events", payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { ev_id: "$.data.id" } }
            - { call: "POST /rights-deals", payload: { event_id: "${ev_id}", rights_holder_name: "Meridian FC", inventory_type: "TICKET", contracted_units: 40, guaranteed_minimum_units: 0, unit_cost_cents: 8000 }, as: RightsManager, as_user_id: u_rights, captures: { dealA: "$.data.id" } }
            - { call: "POST /rights-deals/${dealA}/commit", payload: {}, as: RightsManager, as_user_id: u_rights }
            - { call: "POST /allocation-blocks", payload: { rights_deal_id: "${dealA}", channel: "CORPORATE", target_units: 40, priority_rank: 1 }, as: CommercialManager, as_user_id: u_pricer, captures: { blkA: "$.data.id" } }
            - { call: "POST /release-tranches", payload: { rights_deal_id: "${dealA}", promised_units: 40, promised_release_at: "2026-10-01T00:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { trA: "$.data.id" } }
            - { call: "GET /rights-deals/${dealA}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { dealA_v: "$.data.version" } }
            - { call: "POST /release-tranches/${trA}/confirm", payload: { confirmed_units: 40, expected_rights_deal_version: "${dealA_v}" }, as: RightsManager, as_user_id: u_rights }
            - { call: "POST /rights-deals", payload: { event_id: "${ev_id}", rights_holder_name: "Meridian Hospitality BV", inventory_type: "HOSPITALITY_SPACE", contracted_units: 40, guaranteed_minimum_units: 0, unit_cost_cents: 6000 }, as: RightsManager, as_user_id: u_rights, captures: { dealB: "$.data.id" } }
            - { call: "POST /rights-deals/${dealB}/commit", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { dealB_st: "$.data.deal_status" } }
            - { call: "POST /allocation-blocks", payload: { rights_deal_id: "${dealB}", channel: "INDIVIDUAL", target_units: 40, priority_rank: 1 }, as: CommercialManager, as_user_id: u_pricer, captures: { blkB: "$.data.id" } }
            - { call: "POST /package-products", payload: { event_id: "${ev_id}", name: "Bronze Hospitality", tier: "BRONZE", tickets_per_package: 2, min_margin_pct: 0.1000 }, as: CommercialManager, as_user_id: u_pricer, captures: { pkg_id: "$.data.id" } }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "TICKET", descriptor: "Category 1 seat pair", quantity: 2, unit_cost_cents: 50000, markup_pct: 0.2000, sequence_no: 1 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-products/${pkg_id}/price", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { pkg_v: "$.data.version" } }
            - { call: "POST /package-products/${pkg_id}/publish", payload: { expected_package_product_version: "${pkg_v}" }, as: CommercialDirector, as_user_id: u_director }
            - { call: "POST /clients", payload: { name: "Northbridge Capital", client_type: "CORPORATE", credit_limit_cents: 50000000 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { cl_id: "$.data.id" } }
            - { call: "POST /bookings", payload: { client_id: "${cl_id}", package_product_id: "${pkg_id}", channel: "INDIVIDUAL", units: 5 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { bk_ind: "$.data.id" } }
            - { call: "POST /bookings", payload: { client_id: "${cl_id}", package_product_id: "${pkg_id}", channel: "CORPORATE", units: 5 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { bk_corp: "$.data.id" } }
          trigger:
            - { call: "GET /allocation-blocks/${blkA}", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { blkA_v: "$.data.version", blkA_alloc: "$.data.allocated_units" } }
            - { call: "POST /bookings/${bk_ind}/allocate", payload: { allocation_block_id: "${blkA}", expected_allocation_block_version: "${blkA_v}" }, as: ClientServiceAgent, as_user_id: u_csa, captures: { e_channel: "$.data.error_id" } }
            - { call: "GET /allocation-blocks/${blkB}", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { blkB_v: "$.data.version" } }
            - { call: "POST /bookings/${bk_ind}/allocate", payload: { allocation_block_id: "${blkB}", expected_allocation_block_version: "${blkB_v}" }, as: ClientServiceAgent, as_user_id: u_csa, captures: { e_deal: "$.data.error_id" } }
            - { call: "POST /bookings/${bk_corp}/allocate", payload: { allocation_block_id: "${blkA}", expected_allocation_block_version: "${blkA_v}" }, as: ClientServiceAgent, as_user_id: u_csa, captures: { ok_status: "$.data.fulfillment_status", ok_block: "$.data.allocation_block_id" } }
            - { call: "GET /allocation-blocks/${blkA}", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { blkA_committed: "$.data.committed_units" } }
          assert: >-
            Setup: ${dealB_st} == "COMMITTED" and ${blkA_alloc} == 40.
            The INDIVIDUAL booking against the CORPORATE block answers 422 with
            ${e_channel} == "ERR_CHANNEL_OR_DEAL_MISMATCH" (channel arm — the
            deal behind that block IS fully released).
            The same booking against the channel-matching INDIVIDUAL block answers
            422 with ${e_deal} == "ERR_CHANNEL_OR_DEAL_MISMATCH" (deal-status arm
            — a merely COMMITTED deal has released nothing), and it reports before
            priority 81 even though that block also has 0 allocated units.
            The CORPORATE booking against the CORPORATE block answers 200 with
            ${ok_status} == "ALLOCATED" and ${ok_block} == "${blkA}", and
            ${blkA_committed} == 10 (5 units * 2 tickets), so neither rejection
            consumed inventory. The version ${blkA_v} is still current at the
            third call because the two rejections did not touch the block.

      - name: allocation_availability_is_tested_net_of_committed_units
        claim_type: aggregate_validation
        grounds: >-
          validations[priority=81] ("AllocationBlock.allocated_units -
          AllocationBlock.committed_units >= Booking.units *
          PackageProduct.tickets_per_package") ->
          ERR_ALLOCATION_UNITS_UNAVAILABLE 422 on POST /bookings/{id}/allocate.
        distinguishing_aspect: >-
          Availability is an aggregate over the block's existing commitments, not
          a per-request check against allocated_units: the second 10-unit booking
          lands on exactly the remaining 20 ticket units and must be accepted (the
          `>=` boundary), while a 1-unit booking needing only 2 more units is
          refused because the block is now exactly full. The package's
          tickets_per_package of 2 also means the unit count in the request is not
          the unit count consumed, so an implementation comparing raw
          Booking.units accepts the third call.
        test_recipe:
          setup: >-
            Canonical event; 40-unit deal (guaranteed_minimum 0) fully released
            into a single CORPORATE block with target 40, so allocated_units is 40
            and committed_units is 0; published BRONZE package with
            tickets_per_package 2; one client with a 50000000 limit; three
            RESERVED CORPORATE bookings of 10, 10 and 1 units.
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /events", payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { ev_id: "$.data.id" } }
            - { call: "POST /rights-deals", payload: { event_id: "${ev_id}", rights_holder_name: "Meridian FC", inventory_type: "TICKET", contracted_units: 40, guaranteed_minimum_units: 0, unit_cost_cents: 8000 }, as: RightsManager, as_user_id: u_rights, captures: { deal_id: "$.data.id" } }
            - { call: "POST /rights-deals/${deal_id}/commit", payload: {}, as: RightsManager, as_user_id: u_rights }
            - { call: "POST /allocation-blocks", payload: { rights_deal_id: "${deal_id}", channel: "CORPORATE", target_units: 40, priority_rank: 1 }, as: CommercialManager, as_user_id: u_pricer, captures: { blk_id: "$.data.id" } }
            - { call: "POST /release-tranches", payload: { rights_deal_id: "${deal_id}", promised_units: 40, promised_release_at: "2026-10-01T00:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { tr_id: "$.data.id" } }
            - { call: "GET /rights-deals/${deal_id}", payload: {}, as: RightsManager, as_user_id: u_rights, captures: { deal_v: "$.data.version" } }
            - { call: "POST /release-tranches/${tr_id}/confirm", payload: { confirmed_units: 40, expected_rights_deal_version: "${deal_v}" }, as: RightsManager, as_user_id: u_rights }
            - { call: "POST /package-products", payload: { event_id: "${ev_id}", name: "Bronze Hospitality", tier: "BRONZE", tickets_per_package: 2, min_margin_pct: 0.1000 }, as: CommercialManager, as_user_id: u_pricer, captures: { pkg_id: "$.data.id" } }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "TICKET", descriptor: "Category 1 seat pair", quantity: 2, unit_cost_cents: 50000, markup_pct: 0.2000, sequence_no: 1 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-products/${pkg_id}/price", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { pkg_v: "$.data.version" } }
            - { call: "POST /package-products/${pkg_id}/publish", payload: { expected_package_product_version: "${pkg_v}" }, as: CommercialDirector, as_user_id: u_director }
            - { call: "POST /clients", payload: { name: "Northbridge Capital", client_type: "CORPORATE", credit_limit_cents: 50000000 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { cl_id: "$.data.id" } }
            - { call: "POST /bookings", payload: { client_id: "${cl_id}", package_product_id: "${pkg_id}", channel: "CORPORATE", units: 10 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { bk1: "$.data.id" } }
            - { call: "POST /bookings", payload: { client_id: "${cl_id}", package_product_id: "${pkg_id}", channel: "CORPORATE", units: 10 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { bk2: "$.data.id" } }
            - { call: "POST /bookings", payload: { client_id: "${cl_id}", package_product_id: "${pkg_id}", channel: "CORPORATE", units: 1 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { bk3: "$.data.id" } }
          trigger:
            - { call: "GET /allocation-blocks/${blk_id}", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { v1: "$.data.version", a1: "$.data.allocated_units", c1: "$.data.committed_units" } }
            - { call: "POST /bookings/${bk1}/allocate", payload: { allocation_block_id: "${blk_id}", expected_allocation_block_version: "${v1}" }, as: ClientServiceAgent, as_user_id: u_csa, captures: { s1: "$.data.fulfillment_status" } }
            - { call: "GET /allocation-blocks/${blk_id}", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { v2: "$.data.version", c2: "$.data.committed_units" } }
            - { call: "POST /bookings/${bk2}/allocate", payload: { allocation_block_id: "${blk_id}", expected_allocation_block_version: "${v2}" }, as: ClientServiceAgent, as_user_id: u_csa, captures: { s2: "$.data.fulfillment_status" } }
            - { call: "GET /allocation-blocks/${blk_id}", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { v3: "$.data.version", c3: "$.data.committed_units", st3: "$.data.block_state" } }
            - { call: "POST /bookings/${bk3}/allocate", payload: { allocation_block_id: "${blk_id}", expected_allocation_block_version: "${v3}" }, as: ClientServiceAgent, as_user_id: u_csa, captures: { e_full: "$.data.error_id" } }
            - { call: "GET /allocation-blocks/${blk_id}", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { v4: "$.data.version", c4: "$.data.committed_units" } }
            - { call: "GET /bookings/${bk3}", payload: {}, as: ClientServiceAgent, as_user_id: u_csa, captures: { s3: "$.data.fulfillment_status", blk3: "$.data.allocation_block_id" } }
          assert: >-
            Start: ${a1} == 40 with ${c1} == 0.
            First 10-unit booking allocates (${s1} == "ALLOCATED") and consumes
            20 ticket units: ${c2} == 20.
            The second 10-unit booking needs exactly the 20 units that remain and
            is ACCEPTED (${s2} == "ALLOCATED"), leaving ${c3} == 40 — the `>=`
            boundary is inside the rule. ${st3} == "EXHAUSTED" throughout, since
            block_state tracks allocation against target and not sales.
            The 1-unit booking needs only 2 more units and answers 422 with
            ${e_full} == "ERR_ALLOCATION_UNITS_UNAVAILABLE"; nothing changed
            (${v4} == ${v3} and ${c4} == 40) and the booking is untouched:
            ${s3} == "RESERVED" with ${blk3} == null.
            The version chain ${v1} < ${v2} < ${v3} shows each accepted allocate
            bumped the block exactly once.

      - name: an_on_hold_client_cannot_book_until_the_sweep_restores_it
        claim_type: violation_to_error
        grounds: >-
          validations[priority=80] ("Client.client_status == ACTIVE") ->
          ERR_CLIENT_NOT_ACTIVE 422 on POST /bookings;
          state_machines.Client ACTIVE -> ON_HOLD (1 <= overdue_installment_count
          <= 2 after the run's OVERDUE sweep) and ON_HOLD -> ACTIVE (0 overdue);
          endpoints "POST /operations/daily-run".
        distinguishing_aspect: >-
          The client's booking privilege is not a stored flag but a consequence of
          the installment sweep, so the same POST /bookings payload is refused and
          then accepted with no client mutation in between — only a payment and a
          second daily-run. The overdue count is kept at 1 so the client lands in
          ON_HOLD rather than BLOCKED, which is the state whose recovery edge back
          to ACTIVE exists.
        test_recipe:
          setup: >-
            Simple pricing fixture (no rights deal) with one 5-unit CORPORATE
            booking whose first installment of 167616 is due 2026-08-04; the clock
            is then moved to 2026-08-05 and one daily-run is taken.
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /events", payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { ev_id: "$.data.id" } }
            - { call: "POST /package-products", payload: { event_id: "${ev_id}", name: "Bronze Hospitality", tier: "BRONZE", tickets_per_package: 2, min_margin_pct: 0.1000 }, as: CommercialManager, as_user_id: u_pricer, captures: { pkg_id: "$.data.id" } }
            - { call: "POST /package-components", payload: { package_product_id: "${pkg_id}", component_type: "TICKET", descriptor: "Category 1 seat pair", quantity: 2, unit_cost_cents: 50000, markup_pct: 0.2000, sequence_no: 1 }, as: CommercialManager, as_user_id: u_pricer }
            - { call: "POST /package-products/${pkg_id}/price", payload: {}, as: CommercialManager, as_user_id: u_pricer, captures: { pkg_v: "$.data.version" } }
            - { call: "POST /package-products/${pkg_id}/publish", payload: { expected_package_product_version: "${pkg_v}" }, as: CommercialDirector, as_user_id: u_director }
            - { call: "POST /clients", payload: { name: "Northbridge Capital", client_type: "CORPORATE", credit_limit_cents: 50000000 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { cl_id: "$.data.id", cl_st0: "$.data.client_status" } }
            - { call: "POST /bookings", payload: { client_id: "${cl_id}", package_product_id: "${pkg_id}", channel: "CORPORATE", units: 5 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { bk1: "$.data.id" } }
            - { call: "GET /payment-installments", payload: { booking_id: "${bk1}", limit: 10, offset: 0 }, as: FinanceController, as_user_id: u_fin, captures: { i1: "$.data[0].id", i1_due: "$.data[0].due_at" } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-05T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /operations/daily-run", payload: {}, as: OperationsManager, as_user_id: u_ops, captures: { od1: "$.data.overdue_installment_count", cc1: "$.data.client_status_change_count" } }
            - { call: "GET /clients/${cl_id}", payload: {}, as: ClientServiceAgent, as_user_id: u_csa, captures: { cl_st1: "$.data.client_status", cl_oc1: "$.data.overdue_installment_count" } }
            - { call: "POST /bookings", payload: { client_id: "${cl_id}", package_product_id: "${pkg_id}", channel: "CORPORATE", units: 5 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { e_hold: "$.data.error_id" } }
            - { call: "POST /payment-installments/${i1}/pay", payload: { amount_cents_paid: 167616 }, as: FinanceController, as_user_id: u_fin, captures: { i1_state: "$.data.installment_state", i1_days: "$.data.days_overdue" } }
            - { call: "POST /operations/daily-run", payload: {}, as: OperationsManager, as_user_id: u_ops, captures: { od2: "$.data.overdue_installment_count", cc2: "$.data.client_status_change_count" } }
            - { call: "GET /clients/${cl_id}", payload: {}, as: ClientServiceAgent, as_user_id: u_csa, captures: { cl_st2: "$.data.client_status", cl_oc2: "$.data.overdue_installment_count" } }
            - { call: "POST /bookings", payload: { client_id: "${cl_id}", package_product_id: "${pkg_id}", channel: "CORPORATE", units: 5 }, as: ClientServiceAgent, as_user_id: u_csa, captures: { bk2: "$.data.id", bk2_status: "$.data.fulfillment_status" } }
          assert: >-
            The client starts ${cl_st0} == "ACTIVE" and its first installment is
            due ${i1_due} == "2026-08-04T00:00:00.000Z".
            One daily-run past that date reports ${od1} == 1 and ${cc1} == 1, and
            the client reads ${cl_st1} == "ON_HOLD" with ${cl_oc1} == 1 — one
            overdue line, so ON_HOLD and not BLOCKED.
            The identical booking payload now answers 422 with
            ${e_hold} == "ERR_CLIENT_NOT_ACTIVE".
            Paying the overdue line succeeds (an OVERDUE installment is payable
            under priority 46): ${i1_state} == "PAID" with ${i1_days} == 1.
            The second daily-run reports ${od2} == 0 and ${cc2} == 1, restoring
            ${cl_st2} == "ACTIVE" with ${cl_oc2} == 0, and the same booking
            payload finally answers 201 with ${bk2_status} == "RESERVED".

      - name: critical_risk_gates_new_bookings_unless_the_agent_acknowledges_it
        claim_type: conditional_validation
        grounds: >-
          validations[priority=52] ("when the Event's risk_posture == CRITICAL the
          request carries risk_override_ack == true") -> ERR_EVENT_RISK_CRITICAL
          422 on POST /bookings; calculations.event_fulfillment_risk_score
          (gap_component 40 + lapse_component 30 = 70 = CRITICAL_THRESHOLD);
          state_machines.ReleaseTranche PENDING -> LAPSED on
          POST /operations/daily-run.
        distinguishing_aspect: >-
          The rule fires only in one posture band, so the fixture crosses the
          threshold DURING the test: the first booking is accepted with no ack at
          all while the posture is ELEVATED (score 40), and after a daily-run
          lapses both tranches the score lands on exactly 70 and the same call
          shape is refused unless risk_override_ack is true. The success-with-ack
          call uses a freshly created client, because the original client is
          ON_HOLD by then — otherwise priority 80 would mask the point.
        test_recipe:
          setup: >-
            Canonical event with a 60-unit TICKET deal (guaranteed_minimum 20,
            unit_cost 8000) committed and two 30-unit tranches promised for
            2026-09-01 and 2026-09-15; published BRONZE package; one client.
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: OperationsManager, as_user_id: u_ops }
            - { call: "POST /events", payload: { name: "Continental Cup Final", sport: "FOOTBALL", venue_name: "Meridian Stadium", hospitality_zone_codes: ["ZONE_A", "ZONE_B"], event_date: "2027-02-01T15:00:00.000Z" }, as: RightsManager, as_user_id: u_rights, captures: { ev_id: "$.data.id" } }
