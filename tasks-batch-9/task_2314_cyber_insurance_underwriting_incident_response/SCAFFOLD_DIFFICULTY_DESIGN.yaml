  - rule_id: transitive_cascade
    instances:
      - name: scan_completion_four_hop_cascade_reaches_account_counter
        grounds:
          - state_machines.ExternalScan.PENDING_to_COMPLETED
          - state_machines.Application.SUBMITTED_to_UNDERWRITING
          - state_machines.Application.UNDERWRITING_to_REMEDIATION_REQUIRED
          - entities.ControlAttestation.fields.verified_level
          - entities.Application.fields.mandatory_gap_control_keys
          - entities.InsuredAccount.fields.open_remediation_count
          - calculations.control_posture_score
        distinguishing_aspect: |
          Depth-4 chain triggered by scan completion: hop 1 stores the findings, hop 2 fires because the
          findings changed (rewriting ControlAttestation.verified_level), hop 3 fires because the attestation
          rows changed (re-scoring the Application and, on a mandatory gap, moving it to
          REMEDIATION_REQUIRED), and hop 4 fires because the Application entered that state (incrementing
          InsuredAccount.open_remediation_count) - no hop is caused directly by the scan call.
        test_recipe:
          setup:
            - "Full five-row control catalog; OFFLINE_BACKUPS is mandatory with min_level_required FULL and weight 25."
            - "Aurora Health account with open_remediation_count 0."
            - "Application in SUBMITTED with attestations FULL/FULL/FULL/FULL/PARTIAL, attested_control_score 95.00, verified_control_score null and mandatory_gap_count 0."
            - "One PENDING ExternalScan on that application; logical clock at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /cyber/control-requirements"
              payload: { control_key: "MFA_PRIVILEGED", min_level_required: "FULL", weight: 30, is_mandatory: true }
              as: Underwriter
              as_user_id: "u-underwriter-1"
            - call: "POST /cyber/control-requirements"
