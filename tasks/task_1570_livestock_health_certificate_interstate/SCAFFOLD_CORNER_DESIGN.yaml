      - name: positive_test_infection_cascade
        claim_type: side_effect_execution
        grounds:
          - state_machines.TestRecord.RESULT_PENDING_to_POSITIVE
          - state_machines.Certificate.DRAFT_to_REJECTED
          - entities.QuarantineOrder.fields.reason
          - entities.QuarantineOrder.fields.issued_by_user_id
        distinguishing_aspect: |
          A POSITIVE result fires the full infection cascade: premises ->
          INFECTED, an auto-created QuarantineOrder (reason
          AUTO_POSITIVE_TEST:<test_record_id>, issued_by_user_id 'system',
          30-day window from the clock), and every DRAFT/PENDING_REVIEW
          certificate from the premises -> REJECTED with
          reject_reason AUTO_POSITIVE_TEST.
        test_recipe:
          setup:
            - "Premises P (30 head); NEGATIVE test T1 relied on by certB (PENDING_REVIEW); certA still DRAFT; PENDING test T2; clock 2026-08-10"
          setup_api_calls:
