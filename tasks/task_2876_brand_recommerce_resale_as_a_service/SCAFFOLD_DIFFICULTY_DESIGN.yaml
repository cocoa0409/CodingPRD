  - rule_id: resource_temporal_overlap
    instances:
      - name: refurb_bay_window_conflict_uses_closed_interval_plus_sanitation_buffer
        grounds:
          - validations[priority=66]
          - errors[ERR_BAY_WINDOW_CONFLICT]
          - global_constants.SANITATION_BUFFER_MINUTES
          - entities.RefurbOrder.fields.window_start_at
          - entities.RefurbOrder.fields.window_end_at
        distinguishing_aspect: |
          Resource entity: RefurbBay. Interval semantics: CLOSED on both ends and inflated by
          SANITATION_BUFFER_MINUTES = 60 on both sides — so a window that merely touches an
          existing end instant conflicts, a 30-minute gap conflicts, and a gap of exactly 60
          minutes does not. The tightest legal booking is therefore end + 60 minutes.
        test_recipe:
          setup:
            - "Two accepted OUTERWEAR grade B trade-ins for the same customer at the same store, yielding units U1 and U2 both in lifecycle_state INTAKE."
            - "Exactly one CLEANING bay at that store."
            - "U1 booked into that bay for [2026-08-01T09:00:00Z, 2026-08-01T11:00:00Z], left SCHEDULED (non-terminal, so it occupies the bay)."
          setup_api_calls:
            - call: "POST /recommerce/grade-policies"
              payload: { product_category: "OUTERWEAR", condition_grade: "B", base_credit_pct_bp: 2000, resale_price_pct_bp: 3900, refurb_budget_cap_pct_bp: 3000, restock_fee_pct_bp: 1200, warranty_days: 30 }
              as: ProgramAdmin
              as_user_id: "admin-001"
            - call: "POST /recommerce/credit-policies"
              payload: { code: "CORE-2026", expiry_days: 180, mail_in_bonus_pct_bp: 1000, max_redemption_pct_bp: 5000, min_cash_remainder_minor: 500, eligible_assortment: "BOTH" }
              as: ProgramAdmin
              as_user_id: "admin-001"
            - call: "POST /recommerce/store-locations"
              payload: { code: "ST-01", region_code: "US-CA" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { store_id: "$.data.id" }
            - call: "POST /recommerce/store-locations/${store_id}/refurb-bays"
              payload: { code: "BAY-C1", bay_type: "CLEANING" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { bay_id: "$.data.id" }
            - call: "POST /recommerce/customers"
              payload: { email: "ava@example.com", full_name: "Ava Reyes", loyalty_tier: "PLUS" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { cust_id: "$.data.id" }
            - call: "POST /recommerce/trade-ins"
              payload: { customer_id: "${cust_id}", store_location_id: "${store_id}", channel: "MAIL_IN", product_category: "OUTERWEAR", declared_grade: "B", msrp_minor: 50000, item_mass_grams: 1400 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ti1_id: "$.data.id" }
            - call: "POST /recommerce/trade-ins/${ti1_id}/receive"
              payload: {}
              as: IntakeAgent
              as_user_id: "intake-001"
            - call: "POST /recommerce/trade-ins/${ti1_id}/authenticate"
              payload: { authenticity_result: "GENUINE", assessed_grade: "B" }
              as: Authenticator
              as_user_id: "auth-001"
            - call: "POST /recommerce/trade-ins/${ti1_id}/disposition"
              payload: { decision: "ACCEPT", ownership_treatment: "OWNED_INVENTORY" }
              as: Authenticator
              as_user_id: "auth-001"
            - call: "GET /recommerce/resale-units?trade_in_id=${ti1_id}"
              as: RefurbTechnician
              as_user_id: "tech-001"
              captures: { u1_id: "$.data[0].id", u1_ver: "$.data[0].version" }
            - call: "POST /recommerce/trade-ins"
              payload: { customer_id: "${cust_id}", store_location_id: "${store_id}", channel: "MAIL_IN", product_category: "OUTERWEAR", declared_grade: "B", msrp_minor: 50000, item_mass_grams: 1300 }
              as: Customer
