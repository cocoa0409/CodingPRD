      - name: missing_or_unknown_auth_headers_return_unauthenticated
        claim_type: error_triggerability
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "Three distinct header defects — no X-User-Role, no X-User-ID, and a role string that is not one of the six declared roles — all return ERR_UNAUTHENTICATED (401), and none of them is downgraded to a 403."
        test_recipe:
          setup:
            - "Empty database; the clock has been set once so the service is live."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EnforcementPlanner
          trigger:
            - call: "GET /fare-zones"
              payload: {}
              as: "<no X-User-Role header sent>"
              captures: { err_a1: $.data.error_id }
            - call: "GET /fare-zones"
              payload: {}
              as: EnforcementPlanner
              as_user_id: "<no X-User-ID header sent>"
              captures: { err_a2: $.data.error_id }
            - call: "GET /fare-zones"
              payload: {}
              as: "FareAuditor"
              captures: { err_a3: $.data.error_id }
          assert:
            - "all three calls return HTTP 401 with ${err_a1} == ${err_a2} == ${err_a3} == ERR_UNAUTHENTICATED"
            - "the unknown role FareAuditor yields 401 (rule 2), never 403 — the role must exist before the endpoint's roles list is consulted"
            - "an empty-string X-User-ID is treated as absent by rule 1"

