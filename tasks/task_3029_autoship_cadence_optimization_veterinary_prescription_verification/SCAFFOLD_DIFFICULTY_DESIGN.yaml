              payload: { product_id: "${prod_i1}", cadence_days: 14, default_quantity: 1 }
              as: Customer
              as_user_id: "${pet_i1b}"
              captures: { item_i1b: "$.data.id" }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /v1/autoship-plans/${plan_i1}/items/${item_i1}"
              payload: {}
              as: Customer
              as_user_id: "${pet_i1}"
              captures: { item_i1_v: "$.data.version" }
            - call: "GET /v1/autoship-plans/${plan_i1b}/items/${item_i1b}"
              payload: {}
              as: Customer
              as_user_id: "${pet_i1b}"
              captures: { item_i1b_v: "$.data.version" }
          trigger:
            - call: "POST /v1/autoship-plans/${plan_i1}/items/${item_i1}/cadence"
              payload: { expected_item_version: "${item_i1_v}", cadence_days: 28 }
              as: Customer
              as_user_id: "${pet_i1}"
              captures: { ok_overlap_i1: "$.data.item_status" }
            - call: "POST /v1/autoship-plans/${plan_i1b}/items/${item_i1b}/cadence"
              payload: { expected_item_version: "${item_i1b_v}", cadence_days: 28 }
              as: Customer
              as_user_id: "${pet_i1b}"
              captures: { err_overlap_i1: "$.data.error_id" }
          assert:
            - "both requests build the identical window [2026-09-02, 2026-09-30) from the 2026-09-02 logical date and cadence_days 28"
            - "against blackout_start_date 2026-09-30 the window is adjacent and accepted: AutoshipItem.${item_i1}.item_status == ${ok_overlap_i1} == \"ACTIVE\" with http status 200"
            - "against blackout_start_date 2026-09-29 the same window conflicts and is refused with error_id == ${err_overlap_i1} == \"ERR_CADENCE_WINDOW_OVERLAP\" and http status 409"
            - "the refused attempt wrote nothing: AutoshipItem.${item_i1b}.cadence_days == 14 and version == ${item_i1b_v}"
            - "a window of the same length beginning exactly on blackout_end_date 2026-10-06 is accepted because the blackout interval is half-open at its end"

