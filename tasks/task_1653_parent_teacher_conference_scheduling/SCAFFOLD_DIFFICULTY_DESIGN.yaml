  - rule_id: transitive_cascade
    instances:
      - name: no_show_restriction_cascade_depth5
        grounds:
          - state_machines.Booking.CONFIRMED_to_NO_SHOW
          - state_machines.Family.ACTIVE_to_RESTRICTED
          - calculations.no_show_strike_restriction
        distinguishing_aspect: |
          Depth-5 chain from a single attendance mark: mark NO_SHOW -> Booking NO_SHOW +
          AttendanceRecord -> Family.no_show_strike_count recomputed to 2 (>= threshold 2) ->
          Family RESTRICTED -> future CONFIRMED Booking b3 CANCELLED (FAMILY_RESTRICTED) ->
          b3's InterpreterRequest CANCELLED and slot 2 reopened. Each link is caused by the
          previous one, not by the original request.
        test_recipe:
          setup:
            - "Window (threshold 2) progressed to IN_PROGRESS; clock 2026-10-05T15:46:00Z"
            - "Family F with students st1..st3 linked to T1; bookings b1 (slot 0), b2 (slot 1) both already marked... no: b1 marked NO_SHOW (strike 1) at 15:30; b2 CONFIRMED (slot 1); b3 CONFIRMED (slot 2, starts 15:50 > clock) with interpreter request r3 REQUESTED"
