  - rule_id: compensating_invariant
    instances:
      - name: fiscal_account_identity_survives_partial_payment_then_termination
        grounds:
          - entities.DistrictFiscalAccount.fields.authorized_cents
          - entities.DistrictFiscalAccount.fields.available_cents
          - entities.DistrictFiscalAccount.fields.encumbered_cents
          - entities.DistrictFiscalAccount.fields.disbursed_cents
          - state_machines.Placement.ACTIVE_to_TERMINATED.CASCADE-A_LINK_1
          - state_machines.Placement.ACTIVE_to_TERMINATED.CASCADE-A_LINK_3
        distinguishing_aspect: |
          The invariant authorized_cents == available_cents + encumbered_cents + disbursed_cents
          must hold at EVERY observable point, including after a partial payment has converted
          part of an encumbrance into a disbursement and after termination releases the
          remainder. Termination must release contract minus paid (5760000 - 799411 = 4960589),
          NOT the whole 5760000 — releasing the gross double-counts the 799411 already paid and
          pushes available_cents 799411 over authorized_cents, breaking the identity.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z advanced to 2026-09-01, 2026-11-02 then 2026-11-10T09:00:00Z."
