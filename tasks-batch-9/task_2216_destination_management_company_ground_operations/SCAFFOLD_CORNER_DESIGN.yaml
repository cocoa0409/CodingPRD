          rationale: "That instance asserts mark-ready fails with ERR_NO_ACTIVE_SUPPLIER_CONTRACT before countersignature and succeeds after."

      - name: program_not_in_execution_error
        claim_type: triggerable
        grounds: ["errors[ERR_PROGRAM_NOT_IN_EXECUTION]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / staff_check_in_blocked_until_program_in_execution
          rationale: "That instance asserts staff check-in is blocked by the program's execution_status and unblocked by start-execution."

      - name: every_entity_lookup_with_an_unknown_id_returns_not_found
        claim_type: triggerable
        grounds: ["errors[ERR_VENUE_NOT_FOUND]", "errors[ERR_SUPPLIER_NOT_FOUND]", "errors[ERR_CONTRACT_NOT_FOUND]", "errors[ERR_ELEMENT_NOT_FOUND]", "errors[ERR_PERMIT_NOT_FOUND]", "errors[ERR_STAFF_MEMBER_NOT_FOUND]", "errors[ERR_STAFF_ASSIGNMENT_NOT_FOUND]", "errors[ERR_RECONCILIATION_LINE_NOT_FOUND]", "errors[ERR_SETTLEMENT_PAYMENT_NOT_FOUND]"]
        distinguishing_aspect: "Every single-resource read resolves its own path parameter, so each of the nine remaining lookups must answer HTTP 404 with its own entity-specific error id rather than a shared generic one; the same absent id is used everywhere, which proves the id is per-entity and not per-request."
        test_recipe:
          setup: ["Logical clock 2026-08-01T00:00:00Z; the store is empty of every entity, so the sentinel id 00000000-0000-0000-0000-0000000000ff belongs to nothing."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "GET /dmc/venues/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: ProgramDirector
              captures: { e_venue: $.data.error_id }
            - call: "GET /dmc/suppliers/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: ProgramDirector
              captures: { e_supplier: $.data.error_id }
            - call: "GET /dmc/supplier-contracts/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: ProgramDirector
              captures: { e_contract: $.data.error_id }
            - call: "GET /dmc/program-elements/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: ProgramDirector
              captures: { e_element: $.data.error_id }
            - call: "GET /dmc/permits/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PermitOfficer
              captures: { e_permit: $.data.error_id }
            - call: "GET /dmc/staff-members/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: ProgramDirector
              captures: { e_staff: $.data.error_id }
            - call: "GET /dmc/staff-assignments/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: ProgramDirector
              captures: { e_assignment: $.data.error_id }
            - call: "GET /dmc/reconciliation-lines/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: Controller
              captures: { e_line: $.data.error_id }
            - call: "GET /dmc/settlement-payments/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: Controller
              captures: { e_payment: $.data.error_id }
          assert:
            - "every one of the nine trigger calls returns HTTP 404"
            - "${e_venue} == ERR_VENUE_NOT_FOUND"
            - "${e_supplier} == ERR_SUPPLIER_NOT_FOUND"
            - "${e_contract} == ERR_CONTRACT_NOT_FOUND"
            - "${e_element} == ERR_ELEMENT_NOT_FOUND"
            - "${e_permit} == ERR_PERMIT_NOT_FOUND"
            - "${e_staff} == ERR_STAFF_MEMBER_NOT_FOUND"
            - "${e_assignment} == ERR_STAFF_ASSIGNMENT_NOT_FOUND"
            - "${e_line} == ERR_RECONCILIATION_LINE_NOT_FOUND"
            - "${e_payment} == ERR_SETTLEMENT_PAYMENT_NOT_FOUND"
            - "the nine captured error ids are pairwise distinct"

      - name: element_set_mutation_after_lock_design_rejected
        claim_type: triggerable
        grounds: ["errors[ERR_PROGRAM_DESIGN_LOCKED]"]
        distinguishing_aspect: "The design lock freezes the element set, not the whole program: with a correct expected_program_version in hand the create and the patch both still fail with HTTP 409 ERR_PROGRAM_DESIGN_LOCKED, so the rejection is a state guard and not an optimistic-concurrency miss."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; one ACTIVE Venue; one APPROVED Supplier."
            - "Program 2026-09-10..2026-09-14 with exactly one element, then lock-design so execution_status is DESIGN_LOCKED and version is 3."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /dmc/venues"
              payload: { name: "Locked Design Ballroom", capacity_seated: 100, capacity_reception: 200, turnover_buffer_minutes: 90, requires_special_venue_permit: false, status: "ACTIVE" }
              as: ProgramDirector
              captures: { venue_id: $.data.id }
            - call: "POST /dmc/suppliers"
              payload: { legal_name: "Locked Design Caterer", supplier_type: "VENUE_SERVICES", insurance_expires_on: "2027-01-31", insurance_liability_limit_cents: 500000000, coi_verified: true, status: "APPROVED" }
              as: SupplierManager
              captures: { sup_id: $.data.id }
            - call: "POST /dmc/programs"
              payload: { client_name: "Locked Design Client", group_name: "Locked Design Group", arrival_date: "2026-09-10", departure_date: "2026-09-14", guaranteed_count: 20, markup_pct: 0.18 }
              as: ProgramDirector
              captures: { prog_id: $.data.id, prog_v1: $.data.version }
            - call: "POST /dmc/program-elements"
              payload: { program_id: "${prog_id}", supplier_id: "${sup_id}", venue_id: "${venue_id}", element_type: "ACTIVITY", title: "Locked Design Anchor", starts_at: "2026-09-11T09:00:00Z", ends_at: "2026-09-11T13:00:00Z", planned_headcount: 20, guaranteed_headcount: 20, per_person_cost_cents: 4000, expected_program_version: "${prog_v1}" }
              as: ProgramDirector
              captures: { el_id: $.data.id }
            - call: "POST /dmc/programs/${prog_id}/lock-design"
              payload: {}
              as: ProgramDirector
              captures: { prog_v3: $.data.version }
          trigger:
            - call: "POST /dmc/program-elements"
              payload: { program_id: "${prog_id}", supplier_id: "${sup_id}", venue_id: "${venue_id}", element_type: "DINE_AROUND", title: "Late Addition Dine-Around", starts_at: "2026-09-12T19:00:00Z", ends_at: "2026-09-12T22:00:00Z", planned_headcount: 20, guaranteed_headcount: 20, per_person_cost_cents: 6000, expected_program_version: "${prog_v3}" }
              as: ProgramDirector
              captures: { e_create: $.data.error_id }
            - call: "PATCH /dmc/program-elements/${el_id}"
              payload: { title: "Renamed While Locked" }
              as: ProgramDirector
              captures: { e_patch: $.data.error_id }
          assert:
            - "both trigger calls return HTTP 409"
            - "${e_create} == ERR_PROGRAM_DESIGN_LOCKED"
            - "${e_patch} == ERR_PROGRAM_DESIGN_LOCKED"
            - "${e_create} != ERR_VERSION_CONFLICT"
            - "Program.${prog_id}.execution_status == DESIGN_LOCKED"
            - "Program.${prog_id}.element_count == 1"
            - "Program.${prog_id}.version == 3"
            - "ProgramElement.${el_id}.title == Locked Design Anchor"

      - name: lock_design_and_confirm_on_an_element_free_program_rejected
        claim_type: triggerable
        grounds: ["errors[ERR_PROGRAM_HAS_NO_ELEMENTS]"]
        distinguishing_aspect: "Both entry points into the design ladder carry the same emptiness guard, so a program with element_count 0 cannot be locked and cannot be confirmed; the program stays DRAFT at version 1 and no failed attempt leaks a version bump."
        test_recipe:
