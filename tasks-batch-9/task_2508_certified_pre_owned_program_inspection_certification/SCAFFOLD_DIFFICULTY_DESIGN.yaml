  - rule_id: compensating_invariant
    instances:
      - name: fee_ledger_conservation_on_post_audit_credit
        grounds:
          - entities.Dealer.fields.fee_billed_cents_total
          - entities.Dealer.fields.fee_credited_cents_total
          - entities.Dealer.fields.fee_balance_cents
          - entities.Certification.fields.fee_credited_cents
          - state_machines.Certification.UNDER_AUDIT_to_DECERTIFIED
          - state_machines.Certification.ACTIVE_to_DECERTIFIED
        distinguishing_aspect: |
          The dealer ledger must satisfy fee_balance_cents == fee_billed_cents_total -
          fee_credited_cents_total after two decertifications that are deliberately asymmetric: the
          post-audit failure credits the full 120400 while the administrative decertification credits
          nothing. An implementation that credits on every decertification drives the balance to 0 and
          an implementation that credits on none leaves it at 240800; only the correct compensation
          yields 120400 with both counters non-trivial.
        test_recipe:
          setup:
            - "One dealer, one technician, the published MPI-172 template and two identical vehicles (in_service_date 2022-02-01, 62000 miles), inspected 3 hours 1 minute apart."
            - "Certifications C1 and C2 are both approved at the default clock 2026-08-01T00:00:00Z, each billing 120400, so fee_billed_cents_total is 240800."
