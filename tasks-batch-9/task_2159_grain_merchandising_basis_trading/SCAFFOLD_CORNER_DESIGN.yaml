        distinguishing_aspect: "Authentication is checked at priority 1, ahead of authorization: a create-desk request with no X-User-Role header at all returns ERR_UNAUTHENTICATED (401), not ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup:
