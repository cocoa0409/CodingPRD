# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3362_audit_independence_monitoring_partner_rotation_client_acceptance
#
# Breadth probe. Every claim the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners already
# covered by a §1.8 instance appear as `excluded_because:` stubs with no
# test_recipe. Section and claim_type values come from
# references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: client_create_applies_defaults_and_system_fields
        claim_type: Creation
        grounds:
          - entities.Client
          - endpoints.POST_/audit/clients
        distinguishing_aspect: "A client posted with only the three required fields comes back 201 with status PROSPECT, naf_approved_fee_cents 0, aggregate_independence_status CLEAR, open_finding_count 0 and version 1 — none of which were supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /audit/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /audit/clients"
              payload: { legal_name: "Harbor Point Shipping", industry_code: "MANUFACTURING", jurisdiction_country: "US" }
              as: PlatformAdmin
              captures: { cli_hp: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Client.${cli_hp}.legal_name == \"Harbor Point Shipping\" and industry_code == MANUFACTURING and jurisdiction_country == \"US\""
            - "Client.${cli_hp}.is_public_interest_entity == false and naf_annual_cap_cents == 0"
            - "Client.${cli_hp}.status == PROSPECT and aggregate_independence_status == CLEAR and open_finding_count == 0"
            - "Client.${cli_hp}.parent_client_id is null"
            - "Client.${cli_hp}.version == 1 and id, created_at and updated_at are server-minted"

      - name: client_parent_filter_returns_only_the_controlled_group_children
        claim_type: Parent Relationships
        grounds:
          - entities.Client.fields.parent_client_id
          - endpoints.GET_/audit/clients
        distinguishing_aspect: "The self-referential parent_client_id is honoured as a list filter: of three clients only the one whose parent_client_id names the group parent is returned, and the parent itself is excluded."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One group parent client plus two subsidiaries, only one of which names the parent."
          setup_api_calls:
            - call: "POST /audit/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /audit/clients"
              payload: { legal_name: "Tessellate Holdings", industry_code: "TECH", jurisdiction_country: "US" }
              as: PlatformAdmin
              captures: { cli_parent: $.data.id }
            - call: "POST /audit/clients"
              payload: { legal_name: "Tessellate Labs", industry_code: "TECH", jurisdiction_country: "US", parent_client_id: "${cli_parent}" }
              as: PlatformAdmin
              captures: { cli_sub: $.data.id }
            - call: "POST /audit/clients"
              payload: { legal_name: "Tessellate Europe BV", industry_code: "TECH", jurisdiction_country: "DE" }
              as: PlatformAdmin
              captures: { cli_free: $.data.id }
          trigger:
            - call: "GET /audit/clients"
              payload: { parent_client_id: "${cli_parent}" }
              as: PlatformAdmin
          assert:
            - "exactly one row is returned and its id equals ${cli_sub}"
            - "Client.${cli_parent} is not returned by its own parent filter"
            - "Client.${cli_free} is not returned because its parent_client_id is null"
            - "GET /audit/clients with no filter returns all three rows"

      - name: professional_create_rejects_client_supplied_computed_field
        claim_type: Computed Fields
        grounds:
          - entities.Professional.fields.active_workload_points
          - entities.Professional.fields.availability
          - validations[priority=1]
        distinguishing_aspect: "Computed fields are not client-writable: posting active_workload_points alongside the required fields is rejected with ERR_INVALID_REQUEST rather than silently ignored."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One affiliate exists."
          setup_api_calls:
            - call: "POST /audit/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /audit/affiliates"
              payload: { firm_name: "Deloitte & Touche LLP", country_code: "US", network_tier: "MEMBER_FIRM", independence_framework: "SEC_RESTRICTED" }
              as: PlatformAdmin
              captures: { aff_m: $.data.id }
          trigger:
            - call: "POST /audit/professionals"
              payload: { full_name: "Ingrid Solberg", grade: "DIRECTOR", home_affiliate_id: "${aff_m}", rotation_role_class: "NONE", active_workload_points: 55 }
              as: PlatformAdmin
              captures: { err_prof: $.data.error_id }
          assert:
            - "the response is rejected with error_id ERR_INVALID_REQUEST"
            - "no Professional row exists for full_name \"Ingrid Solberg\""
            - "the same POST without active_workload_points succeeds and the stored active_workload_points is 0, not 55"

      - name: engagement_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/audit/engagements
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "total_count counts the whole filtered set while the page is bounded by limit, and has_more flips false exactly on the last page."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One client with three engagements and a second client with one engagement."
          setup_api_calls:
            - call: "POST /audit/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /audit/clients"
              payload: { legal_name: "Alder Creek Mills", industry_code: "MANUFACTURING", jurisdiction_country: "US" }
              as: PlatformAdmin
              captures: { cli_ac: $.data.id }
            - call: "POST /audit/clients"
              payload: { legal_name: "Alder Creek Timber", industry_code: "MANUFACTURING", jurisdiction_country: "CA" }
              as: PlatformAdmin
              captures: { cli_act: $.data.id }
            - call: "POST /audit/engagements"
              payload: { client_id: "${cli_ac}", engagement_type: "STATUTORY_AUDIT", fiscal_year_end: "2026-12-31T00:00:00Z" }
              as: EngagementPartner
              as_user_id: "ep-hollis"
            - call: "POST /audit/engagements"
              payload: { client_id: "${cli_ac}", engagement_type: "STATUTORY_AUDIT", fiscal_year_end: "2027-12-31T00:00:00Z" }
              as: EngagementPartner
              as_user_id: "ep-hollis"
            - call: "POST /audit/engagements"
              payload: { client_id: "${cli_ac}", engagement_type: "REVIEW_ENGAGEMENT", fiscal_year_end: "2028-12-31T00:00:00Z" }
              as: EngagementPartner
              as_user_id: "ep-hollis"
            - call: "POST /audit/engagements"
              payload: { client_id: "${cli_act}", engagement_type: "STATUTORY_AUDIT", fiscal_year_end: "2026-12-31T00:00:00Z" }
              as: EngagementPartner
              as_user_id: "ep-hollis"
          trigger:
            - call: "GET /audit/engagements"
              payload: { limit: 2, offset: 0 }
              as: EngagementPartner
              as_user_id: "ep-hollis"
            - call: "GET /audit/engagements"
              payload: { limit: 2, offset: 2 }
              as: EngagementPartner
              as_user_id: "ep-hollis"
            - call: "GET /audit/engagements"
              payload: { client_id: "${cli_ac}" }
              as: EngagementPartner
              as_user_id: "ep-hollis"
          assert:
            - "the first page returns 2 rows with total_count == 4 and has_more == true"
            - "the second page returns 2 rows with total_count == 4 and has_more == false"
            - "the client-filtered call returns 3 rows with total_count == 3"
            - "the default limit is 10 and the default offset is 0 when neither is supplied"

      - name: integrity_assessment_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.IntegrityAssessment.fields.assessed_on
          - endpoints.POST_/audit/client-acceptances/{id}/integrity-assessments
          - validations[priority=1]
        distinguishing_aspect: "Omitting the assessed_on field is a schema violation at priority 1 and short-circuits before the acceptance is even consulted for state."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One client, one engagement and one DRAFT acceptance."
          setup_api_calls:
            - call: "POST /audit/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /audit/clients"
              payload: { legal_name: "Fenwick Robotics", industry_code: "TECH", jurisdiction_country: "GB" }
              as: PlatformAdmin
              captures: { cli_fr: $.data.id }
            - call: "POST /audit/engagements"
              payload: { client_id: "${cli_fr}", engagement_type: "STATUTORY_AUDIT", fiscal_year_end: "2026-12-31T00:00:00Z" }
              as: EngagementPartner
              as_user_id: "ep-hollis"
              captures: { eng_fr: $.data.id }
            - call: "POST /audit/client-acceptances"
              payload: { client_id: "${cli_fr}", engagement_id: "${eng_fr}", proposed_by: "P. Rao", industry_expertise_required: "TECH" }
              as: ClientAcceptanceCommittee
              captures: { acc_fr: $.data.id }
          trigger:
            - call: "POST /audit/client-acceptances/${acc_fr}/integrity-assessments"
              payload: { source_type: "LITIGATION", severity: "HIGH", score_impact: 15 }
              as: ClientAcceptanceCommittee
              captures: { err_ia: $.data.error_id }
          assert:
            - "the response is rejected with error_id ERR_INVALID_REQUEST at http 400"
            - "no IntegrityAssessment row was created and ClientAcceptance.${acc_fr}.integrity_score is unchanged at 100"

      - name: non_audit_service_invalid_enum_returns_400
        claim_type: Type Constraints
        grounds:
          - entities.NonAuditService.fields.service_category
          - validations[priority=1]
        distinguishing_aspect: "A service_category outside the declared enum is rejected at priority 1 rather than being coerced or stored."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One client exists."
          setup_api_calls:
            - call: "POST /audit/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /audit/clients"
              payload: { legal_name: "Quarry Lake Cement", industry_code: "MANUFACTURING", jurisdiction_country: "US" }
              as: PlatformAdmin
              captures: { cli_ql: $.data.id }
          trigger:
            - call: "POST /audit/non-audit-services"
              payload: { client_id: "${cli_ql}", service_category: "TAX_PREPARATION_AND_PLANNING", fee_cents: 250000 }
              as: AuditCommitteeLiaison
              captures: { err_enum: $.data.error_id }
          assert:
            - "the response is rejected with error_id ERR_INVALID_REQUEST at http 400"
            - "the same call with service_category TAX_PREPARATION succeeds with status DRAFT"
            - "a negative fee_cents is likewise rejected with ERR_INVALID_REQUEST"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: finding_closed_is_terminal_for_every_action
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.IndependenceFinding.RE_TEST_to_CLOSED
          - entities.IndependenceFinding.fields.status
        distinguishing_aspect: "Once a finding reaches CLOSED every action, including the ones that are legal one hop earlier, is rejected with ERR_INVALID_STATE and no side effect fires."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One client, one engagement, one professional and one finding already advanced to CLOSED."
          setup_api_calls:
            - call: "POST /audit/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /audit/affiliates"
              payload: { firm_name: "Deloitte & Touche LLP", country_code: "US", network_tier: "MEMBER_FIRM", independence_framework: "SEC_RESTRICTED" }
              as: PlatformAdmin
              captures: { aff_n: $.data.id }
            - call: "POST /audit/clients"
              payload: { legal_name: "Wexford Ceramics", industry_code: "MANUFACTURING", jurisdiction_country: "US" }
              as: PlatformAdmin
              captures: { cli_wx: $.data.id }
            - call: "POST /audit/professionals"
              payload: { full_name: "Karin Vogel", grade: "SENIOR_MANAGER", home_affiliate_id: "${aff_n}", rotation_role_class: "NONE" }
              as: PlatformAdmin
              captures: { pro_kv: $.data.id }
            - call: "POST /audit/engagements"
              payload: { client_id: "${cli_wx}", engagement_type: "STATUTORY_AUDIT", fiscal_year_end: "2026-12-31T00:00:00Z" }
              as: EngagementPartner
              as_user_id: "ep-hollis"
              captures: { eng_wx: $.data.id, eng_wx_v: $.data.version }
            - call: "POST /audit/independence-findings"
              payload: { professional_id: "${pro_kv}", engagement_id: "${eng_wx}", origin: "DECLARATION", origin_ref_id: "decl-wx-1", finding_type: "WORKLOAD_LIMIT", severity: "LOW", discovered_on: "2026-08-01T00:00:00Z", expected_engagement_version: "${eng_wx_v}" }
              as: IndependenceOfficer
              captures: { fnd_wx: $.data.id }
            - call: "POST /audit/independence-findings/${fnd_wx}/transitions"
              payload: { action: "CLOSE_NO_ACTION" }
              as: IndependenceOfficer
          trigger:
            - call: "POST /audit/independence-findings/${fnd_wx}/transitions"
              payload: { action: "START_REMEDIATION" }
              as: IndependenceOfficer
              captures: { err_term1: $.data.error_id }
            - call: "POST /audit/independence-findings/${fnd_wx}/transitions"
              payload: { action: "PASS_RETEST" }
              as: IndependenceOfficer
              captures: { err_term2: $.data.error_id }
          assert:
            - "both calls are rejected with error_id ERR_INVALID_STATE at http 409"
            - "IndependenceFinding.${fnd_wx}.status is still CLOSED and closed_on is unchanged"
            - "Engagement.${eng_wx}.independence_status is CLEAR — the rejected calls fired no recompute"

      - name: quality_review_invalid_state_on_terminal_row
        claim_type: Invalid Transitions
        grounds:
          - state_machines.QualityReview.SCHEDULED_to_IN_PROGRESS
          - state_machines.QualityReview.IN_PROGRESS_to_PASSED
          - entities.QualityReview.fields.status
        distinguishing_aspect: "START is legal only from SCHEDULED: on an already PASSED row it is rejected, and a PASS with a non-zero deficiency_count is rejected before any transition is applied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One engagement, one reviewer and one review already advanced to PASSED with deficiency_count 0."
          setup_api_calls:
            - call: "POST /audit/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /audit/affiliates"
              payload: { firm_name: "Deloitte & Touche LLP", country_code: "US", network_tier: "MEMBER_FIRM", independence_framework: "SEC_RESTRICTED" }
              as: PlatformAdmin
              captures: { aff_p: $.data.id }
            - call: "POST /audit/clients"
              payload: { legal_name: "Pemberton Rail", industry_code: "MANUFACTURING", jurisdiction_country: "US" }
              as: PlatformAdmin
              captures: { cli_pb: $.data.id }
            - call: "POST /audit/professionals"
              payload: { full_name: "Alice Nakamura", grade: "PARTNER", home_affiliate_id: "${aff_p}", rotation_role_class: "EQ_REVIEWER" }
              as: PlatformAdmin
              captures: { pro_an: $.data.id }
            - call: "POST /audit/engagements"
              payload: { client_id: "${cli_pb}", engagement_type: "STATUTORY_AUDIT", fiscal_year_end: "2026-12-31T00:00:00Z" }
              as: EngagementPartner
              as_user_id: "ep-hollis"
              captures: { eng_pb: $.data.id }
            - call: "POST /audit/quality-reviews"
              payload: { engagement_id: "${eng_pb}", reviewer_id: "${pro_an}", review_type: "ENGAGEMENT_QUALITY_REVIEW", received_on: "2026-08-01T00:00:00Z", due_on: "2026-10-01T00:00:00Z", deficiency_count: 0 }
              as: QualityReviewer
              as_user_id: "${pro_an}"
              captures: { rev_pb: $.data.id }
            - call: "POST /audit/quality-reviews/${rev_pb}/transitions"
              payload: { action: "START" }
              as: QualityReviewer
              as_user_id: "${pro_an}"
            - call: "POST /audit/quality-reviews/${rev_pb}/transitions"
              payload: { action: "PASS" }
              as: QualityReviewer
              as_user_id: "${pro_an}"
          trigger:
            - call: "POST /audit/quality-reviews/${rev_pb}/transitions"
              payload: { action: "START" }
              as: QualityReviewer
              as_user_id: "${pro_an}"
              captures: { err_qr1: $.data.error_id }
            - call: "POST /audit/quality-reviews/${rev_pb}/transitions"
              payload: { action: "FAIL" }
              as: QualityReviewer
              as_user_id: "${pro_an}"
              captures: { err_qr2: $.data.error_id }
          assert:
            - "the START call is rejected with ERR_INVALID_STATE because PASSED has no outgoing transition"
            - "the FAIL call is rejected with ERR_INVALID_STATE (and would also fail the deficiency_count > 0 precondition)"
            - "QualityReview.${rev_pb}.status is still PASSED and Engagement.${eng_pb}.quality_review_required is false"

      - name: engagement_close_ends_every_active_assignment
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Engagement.ACTIVE_to_CLOSED
          - entities.Engagement.fields.assigned_workload_points
          - entities.Professional.fields.active_workload_points
        distinguishing_aspect: "The CLOSE transition's side effect is a real cascade: every ACTIVE assignment on the engagement is ended and each affected professional's workload total drops, rather than the engagement alone changing state."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One ACTIVE engagement staffed with a LEAD_PARTNER and an ENGAGEMENT_MANAGER, both ACTIVE."
          setup_api_calls:
            - call: "POST /audit/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /audit/affiliates"
              payload: { firm_name: "Deloitte & Touche LLP", country_code: "US", network_tier: "MEMBER_FIRM", independence_framework: "SEC_RESTRICTED" }
              as: PlatformAdmin
              captures: { aff_q: $.data.id }
            - call: "POST /audit/clients"
              payload: { legal_name: "Selby Textiles", industry_code: "RETAIL", jurisdiction_country: "US" }
              as: PlatformAdmin
              captures: { cli_sb2: $.data.id }
            - call: "POST /audit/professionals"
              payload: { full_name: "Ruth Adeyemi", grade: "PARTNER", home_affiliate_id: "${aff_q}", rotation_role_class: "LEAD_PARTNER" }
              as: PlatformAdmin
              captures: { pro_ra: $.data.id }
            - call: "POST /audit/professionals"
              payload: { full_name: "Peter Nowak", grade: "SENIOR_MANAGER", home_affiliate_id: "${aff_q}", rotation_role_class: "NONE" }
              as: PlatformAdmin
              captures: { pro_pn: $.data.id }
            - call: "POST /audit/engagements"
              payload: { client_id: "${cli_sb2}", engagement_type: "STATUTORY_AUDIT", fiscal_year_end: "2026-12-31T00:00:00Z" }
              as: EngagementPartner
              as_user_id: "ep-hollis"
              captures: { eng_sb2: $.data.id }
            - call: "POST /audit/client-acceptances"
              payload: { client_id: "${cli_sb2}", engagement_id: "${eng_sb2}", proposed_by: "P. Rao", industry_expertise_required: "RETAIL", industry_expertise_confirmed: true }
              as: ClientAcceptanceCommittee
              captures: { acc_sb2: $.data.id }
            - call: "POST /audit/client-acceptances/${acc_sb2}/integrity-assessments"
              payload: { source_type: "CREDIT_EVENT", severity: "LOW", score_impact: 5, assessed_on: "2026-08-01T00:00:00Z", resolved: true }
              as: ClientAcceptanceCommittee
            - call: "POST /audit/client-acceptances/${acc_sb2}/submit"
              payload: {}
              as: ClientAcceptanceCommittee
            - call: "POST /audit/client-acceptances/${acc_sb2}/decision"
              payload: { decision: "APPROVE", decision_notes: "clean" }
              as: ClientAcceptanceCommittee
            - call: "GET /audit/engagements/${eng_sb2}"
              payload: {}
              as: EngagementPartner
              as_user_id: "ep-hollis"
              captures: { eng_sb2_v: $.data.version }
            - call: "POST /audit/role-assignments"
              payload: { engagement_id: "${eng_sb2}", professional_id: "${pro_ra}", role: "LEAD_PARTNER", started_on: "2026-09-01T00:00:00Z", scheduled_end_on: "2027-09-01T00:00:00Z", expected_engagement_version: "${eng_sb2_v}" }
              as: EngagementPartner
              as_user_id: "ep-hollis"
              captures: { asg_ra: $.data.id }
            - call: "GET /audit/engagements/${eng_sb2}"
              payload: {}
              as: EngagementPartner
              as_user_id: "ep-hollis"
              captures: { eng_sb2_v2: $.data.version }
            - call: "POST /audit/role-assignments"
              payload: { engagement_id: "${eng_sb2}", professional_id: "${pro_pn}", role: "ENGAGEMENT_MANAGER", started_on: "2026-09-01T00:00:00Z", scheduled_end_on: "2027-09-01T00:00:00Z", expected_engagement_version: "${eng_sb2_v2}" }
              as: EngagementPartner
              as_user_id: "ep-hollis"
              captures: { asg_pn: $.data.id }
          trigger:
            - call: "POST /audit/engagements/${eng_sb2}/transitions"
              payload: { action: "CLOSE" }
              as: EngagementPartner
              as_user_id: "ep-hollis"
            - call: "GET /audit/professionals/${pro_ra}"
              payload: {}
              as: PlatformAdmin
            - call: "GET /audit/engagements/${eng_sb2}"
              payload: {}
              as: EngagementPartner
              as_user_id: "ep-hollis"
          assert:
            - "Engagement.${eng_sb2}.status == CLOSED and assigned_workload_points == 0"
            - "EngagementRoleAssignment.${asg_ra}.status == ENDED and EngagementRoleAssignment.${asg_pn}.status == ENDED with ended_on set to the logical clock"
            - "Professional.${pro_ra}.active_workload_points == 0 after the cascade"
            - "Engagement.${eng_sb2}.lead_partner_id is null"

      - name: attestation_waive_cannot_apply_to_member_firm_on_multinational
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.AffiliateAttestation.PENDING_to_WAIVED
          - entities.Affiliate.fields.network_tier
        distinguishing_aspect: "The WAIVE precondition is a genuine cross-entity gate: a MEMBER_FIRM on a multinational engagement may not waive, while the same affiliate on a domestic engagement or an ALLIANCE tier affiliate on the same engagement may."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One client, one multinational engagement, one MEMBER_FIRM affiliate and one ALLIANCE affiliate, each with a PENDING attestation on that engagement."
          setup_api_calls:
            - call: "POST /audit/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /audit/affiliates"
              payload: { firm_name: "Deloitte & Touche LLP", country_code: "US", network_tier: "MEMBER_FIRM", independence_framework: "SEC_RESTRICTED" }
              as: PlatformAdmin
              captures: { aff_mf: $.data.id }
            - call: "POST /audit/affiliates"
