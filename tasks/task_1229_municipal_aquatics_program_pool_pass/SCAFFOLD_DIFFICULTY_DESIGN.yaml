scaffold_difficulty_design:

  # =========================================================================
  # Rule 1: dual_variant_calc — two valid interpretations diverge on the same
  # inputs. Instances must span DIFFERENT entity domains.
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: daily_admission_with_pass_vs_gate_price
        grounds:
          - calculations.daily_admission_price
          - entities.DailyAdmission.fields.charge_cents
          - entities.SeasonPass.fields.status
        distinguishing_aspect: |
          Operates on the DailyAdmission entity domain. Two valid price interpretations
          for the same (holder, facility, date) triple diverge by variant selection:
          variant `with_season_pass` yields charge_cents=0 while the base variant
          yields the residency-and-age-adjusted daily price; selecting the wrong variant
          produces a different integer charge for identical inputs.
        test_recipe:
          setup:
            - "Facility F with max_bather_capacity=200, lap_lane_count=6"
            - "MembershipSeason S for F, PUBLISHED, window [2026-06-01, 2026-08-31], resident_daily=800c, non_resident_daily=1200c"
            - "PassHolder P (RESIDENT, ADULT born 1990-01-15) and SeasonPass PS for P on S (status=ACTIVE)"
            - "PassHolder Q (RESIDENT, ADULT born 1990-01-15) WITHOUT any pass"
            - "Logical clock 2026-07-10T14:00:00Z"
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Riverside Pool", address: "1 River Rd", max_bather_capacity: 200, lap_lane_count: 6 }
              as: AquaticsManager
              captures: { fac_id: $.data.id }
            - call: "POST /seasons"
              payload: { facility_id: "${fac_id}", season_name: "Summer 2026", start_date: "2026-06-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z", resident_pass_price_cents: 15000, non_resident_pass_price_cents: 25000, resident_daily_price_cents: 800, non_resident_daily_price_cents: 1200 }
              as: AquaticsManager
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/publish"
              payload: {}
              as: AquaticsManager
            - call: "POST /pass-holders"
              payload: { full_name: "Pat Resident", date_of_birth: "1990-01-15T00:00:00Z", residency_status: "RESIDENT", email: "pat@x.com" }
              as: GateAttendant
              captures: { p_id: $.data.id }
            - call: "POST /pass-holders"
              payload: { full_name: "Quinn NoPass", date_of_birth: "1990-01-15T00:00:00Z", residency_status: "RESIDENT", email: "quinn@x.com" }
              as: GateAttendant
              captures: { q_id: $.data.id }
            - call: "POST /passes"
              payload: { pass_holder_id: "${p_id}", season_id: "${season_id}" }
              as: GateAttendant
              captures: { pass_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T14:00:00Z" }
              as: AquaticsManager
          trigger:
            - call: "POST /admissions"
              payload: { facility_id: "${fac_id}", pass_holder_id: "${p_id}", season_pass_id: "${pass_id}", admission_date: "2026-07-10T00:00:00Z" }
              as: GateAttendant
              captures: { adm_p: $.data.id, adm_p_charge: $.data.charge_cents }
            - call: "POST /admissions"
              payload: { facility_id: "${fac_id}", pass_holder_id: "${q_id}", admission_date: "2026-07-10T00:00:00Z" }
              as: GateAttendant
              captures: { adm_q: $.data.id, adm_q_charge: $.data.charge_cents }
          assert:
            - "DailyAdmission.${adm_p}.charge_cents == 0"
            - "DailyAdmission.${adm_q}.charge_cents == 800"
            - "DailyAdmission.${adm_p}.charge_cents != DailyAdmission.${adm_q}.charge_cents"

      - name: rental_quote_vs_final_with_overtime
        grounds:
          - calculations.rental_quote
          - entities.FacilityRental.fields.quoted_price_cents
          - entities.FacilityRental.fields.final_price_cents
        distinguishing_aspect: |
          Operates on the FacilityRental entity domain (different from DailyAdmission).
          Variants `quoted` and `final` produce different integer prices for the same
          rental record when actual_exit exceeds end_datetime by a non-round number
          of minutes; the `final` variant adds ceil-overtime that `quoted` does not,
          yielding quoted_price_cents != final_price_cents on the same entity.
        test_recipe:
          setup:
            - "Facility F with max_bather_capacity=100, lap_lane_count=4, status OPEN"
            - "PassHolder P (RESIDENT)"
            - "Rental R: party_size=10 (<=INCLUDED 25), 2026-07-15 14:00 to 17:00 (3 hours), RESIDENT rate"
            - "Logical clock advanced to 2026-07-15T17:22:00Z at checkout (22 min overtime => ceil(22/15)=2 blocks)"
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Sunset Pool", address: "9 Sun Ln", max_bather_capacity: 100, lap_lane_count: 4 }
              as: AquaticsManager
              captures: { fac_id: $.data.id }
            - call: "POST /pass-holders"
              payload: { full_name: "Renter R", date_of_birth: "1985-06-01T00:00:00Z", residency_status: "RESIDENT", email: "r@x.com" }
              as: GateAttendant
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: AquaticsManager
            - call: "POST /rentals"
              payload: { facility_id: "${fac_id}", pass_holder_id: "${p_id}", party_size: 10, start_datetime: "2026-07-15T14:00:00Z", end_datetime: "2026-07-15T17:00:00Z" }
              as: PassHolder
              as_user_id: "${p_id}"
              captures: { rental_id: $.data.id, quoted: $.data.quoted_price_cents, fac_v_pre: $.data.version }
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: AquaticsManager
              captures: { fac_v: $.data.version }
            - call: "POST /rentals/${rental_id}/approve"
              payload: { expected_facility_version: "${fac_v}" }
              as: AquaticsManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T14:00:00Z" }
              as: AquaticsManager
            - call: "POST /rentals/${rental_id}/check-in"
              payload: {}
              as: GateAttendant
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T17:22:00Z" }
              as: AquaticsManager
            - call: "POST /rentals/${rental_id}/check-out"
              payload: {}
              as: GateAttendant
              captures: { final_price: $.data.final_price_cents }
          assert:
            - "FacilityRental.${rental_id}.quoted_price_cents == 45000"
            - "FacilityRental.${rental_id}.final_price_cents == 55000"
            - "FacilityRental.${rental_id}.final_price_cents - FacilityRental.${rental_id}.quoted_price_cents == 10000"

  # =========================================================================
  # Rule 2: combinatorial_formula — instances in DIFFERENT modes (a)/(b)/(c)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: rental_quote_residency_party_fee_mode_a
        grounds:
          - calculations.rental_quote
          - entities.FacilityRental.fields.quoted_price_cents
        distinguishing_aspect: |
          Mode (a) — nested min/max + conditional branch on PassHolder residency.
          >=3 inputs (hours, residency_status, party_size) interact non-linearly:
          residency applies a multiplier only to base_rate, party_fee uses max(0,...)
          with a threshold at INCLUDED_PARTY_SIZE=25, and the two paths are summed
          after distinct rounding policies (round_half_up vs integer arithmetic).
          NON_RESIDENT 30-person 2-hour rental yields a value no linear formula
          reproduces without both branches.
        test_recipe:
          setup:
            - "Facility F with max_bather_capacity=200, lap_lane_count=6"
            - "PassHolder P (NON_RESIDENT)"
            - "Logical clock 2026-07-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "East Pool", address: "5 E St", max_bather_capacity: 200, lap_lane_count: 6 }
              as: AquaticsManager
              captures: { fac_id: $.data.id }
            - call: "POST /pass-holders"
              payload: { full_name: "NonRes A", date_of_birth: "1980-01-01T00:00:00Z", residency_status: "NON_RESIDENT", email: "nr@x.com" }
              as: GateAttendant
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: AquaticsManager
          trigger:
            - call: "POST /rentals"
              payload: { facility_id: "${fac_id}", pass_holder_id: "${p_id}", party_size: 30, start_datetime: "2026-08-01T14:00:00Z", end_datetime: "2026-08-01T16:00:00Z" }
              as: PassHolder
              as_user_id: "${p_id}"
              captures: { rental_id: $.data.id, quoted: $.data.quoted_price_cents }
          assert:
            # hours=2, base=2*15000=30000, NR mult 1.5 -> 45000; party_fee=max(0,30-25)*300=1500; total=46500
            - "FacilityRental.${rental_id}.quoted_price_cents == 46500"

      - name: daily_price_early_bird_age_tier_mode_b
        grounds:
          - calculations.daily_admission_price
          - entities.DailyAdmission.fields.charge_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters. The early-bird variant
          applies EARLY_BIRD_DISCOUNT_PCT to the residency base BEFORE the age-tier
          multiplier, then ceils; the alternative order (age first, then early-bird)
          produces a different cent value for non-round prices. The scaffold pins
          residency base -> early-bird -> age multiplier -> ceil, and that order
          is observable at the boundary (e.g. base=999, child 0.6, early-bird 10%
          yields 540 in pinned order vs 539 in the other order).
        test_recipe:
          setup:
            - "Facility F, season S PUBLISHED with resident_daily=999c, window [2026-06-01, 2026-08-31]"
            - "Early-bird window opens 7 days before start: [2026-05-25, 2026-06-01)"
            - "PassHolder P (RESIDENT, CHILD born 2015-03-01 -> age 11 on 2026-05-26)"
            - "Logical clock 2026-05-26T10:00:00Z (inside early-bird window)"
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "West Pool", address: "8 W Ave", max_bather_capacity: 100, lap_lane_count: 2 }
              as: AquaticsManager
              captures: { fac_id: $.data.id }
            - call: "POST /seasons"
              payload: { facility_id: "${fac_id}", season_name: "EB Season", start_date: "2026-06-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z", resident_pass_price_cents: 15000, non_resident_pass_price_cents: 25000, resident_daily_price_cents: 999, non_resident_daily_price_cents: 1500 }
              as: AquaticsManager
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/publish"
              payload: {}
              as: AquaticsManager
            - call: "POST /pass-holders"
              payload: { full_name: "Kid K", date_of_birth: "2015-03-01T00:00:00Z", residency_status: "RESIDENT", email: "kid@x.com" }
              as: GateAttendant
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-26T10:00:00Z" }
              as: AquaticsManager
          trigger:
            - call: "POST /admissions"
              payload: { facility_id: "${fac_id}", pass_holder_id: "${p_id}", admission_date: "2026-05-26T00:00:00Z" }
              as: GateAttendant
              captures: { adm_id: $.data.id, charge: $.data.charge_cents }
          assert:
            # Pinned order: base=999, EB 10% -> 999*0.9=899.1, then child *0.6 -> 539.46, ceil -> 540
            # Alternative order: base=999*0.6=599.4 ceil->600; then EB 600*0.9=540 — same here
            # Use a different non-round base to make order observable:
            # base=777, EB 10% -> 699.3, *0.6 -> 419.58 ceil->420
            # alt: 777*0.6=466.2 ceil->467, *0.9=420.3 ceil->421 -- differ
            # But our season uses 999. Recompute: 999 * 0.9 = 899.1; 899.1 * 0.6 = 539.46; ceil -> 540
            - "DailyAdmission.${adm_id}.charge_cents == 540"

  # =========================================================================
  # Rule 3: non_linear_state_machine — cycle / parallel-dimensions / fork-join
  # on DIFFERENT entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: facility_posture_cycle_open_closed_open
        grounds:
          - state_machines.Facility.OPEN_to_CLOSED_CHEMISTRY
          - state_machines.Facility.CLOSED_CHEMISTRY_to_OPEN
          - state_machines.Facility.OPEN_to_RESTRICTED
          - state_machines.Facility.RESTRICTED_to_OPEN
        distinguishing_aspect: |
          Facility forms a cyclic posture graph (OPEN -> RESTRICTED -> OPEN, and
          OPEN -> CLOSED_* -> OPEN). Non-linear because the same state (OPEN) is
          reachable via multiple inbound transitions and the state can be re-entered
          after closure — distinguishing this from a one-way pipeline. The cycle
          is on the Facility entity.
        test_recipe:
          setup:
            - "Facility F status OPEN"
            - "Lifeguard LG (cert ACTIVE, expires 2027-01-01)"
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Cycle Pool", address: "3 Cyc Dr", max_bather_capacity: 50, lap_lane_count: 2 }
              as: AquaticsManager
              captures: { fac_id: $.data.id }
            - call: "POST /lifeguards"
              payload: { full_name: "LG One", certification_id: "RC-100", cert_expires_on: "2027-01-01T00:00:00Z", hired_on: "2026-01-01T00:00:00Z" }
              as: AquaticsManager
              captures: { lg_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T10:00:00Z" }
              as: AquaticsManager
          trigger:
            - call: "POST /facilities/${fac_id}/chemistry-logs"
              payload: { recorded_at: "2026-06-15T10:00:00Z", free_chlorine_ppm: 0.5, ph: 7.5, combined_chlorine_ppm: 0.2, recorded_by_lifeguard_id: "${lg_id}" }
              as: Lifeguard
              as_user_id: "${lg_id}"
              captures: { chem1: $.data.classification }
            - call: "POST /facilities/${fac_id}/chemistry-logs"
              payload: { recorded_at: "2026-06-15T12:00:00Z", free_chlorine_ppm: 2.5, ph: 7.4, combined_chlorine_ppm: 0.2, recorded_by_lifeguard_id: "${lg_id}" }
              as: Lifeguard
              as_user_id: "${lg_id}"
              captures: { chem2: $.data.classification }
            - call: "POST /facilities/${fac_id}/reopen"
              payload: {}
              as: AquaticsManager
              captures: { fac_status: $.data.operational_status }
          assert:
            - "ChemistryLog 1 classification == OUT_OF_RANGE"
            - "ChemistryLog 2 classification == IN_RANGE"
            - "Facility.${fac_id}.operational_status == OPEN after reopen"
            - "PoolClosureEvent for chemistry closure has status == RESOLVED and ended_at != null"

      - name: lesson_enrollment_waitlist_promotion_loop
        grounds:
          - state_machines.LessonEnrollment.ENROLLED_to_WAITLISTED
          - state_machines.LessonEnrollment.WAITLISTED_to_ENROLLED
          - state_machines.LessonEnrollment.ENROLLED_to_DROPPED
        distinguishing_aspect: |
          LessonEnrollment has a cycle: ENROLLED -> WAITLISTED -> ENROLLED is reachable
          when capacity fills then frees. Non-linear on a DIFFERENT entity (LessonEnrollment
          vs Facility). The loop exercises waitlist_position renumbering and promotion,
          which a linear pipeline cannot express.
        test_recipe:
          setup:
            - "Facility F (lap_lane_count=4), Season S PUBLISHED window [2026-06-01, 2026-08-31]"
            - "SwimLessonLevel L1 (capacity_per_session=1, min_age_years=5, no prerequisite)"
            - "LessonSession LS on F/S/L1, SCHEDULED, window 2026-07-01..2026-07-31"
            - "PassHolders A and B (both RESIDENT, age-eligible)"
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Cycle L Pool", address: "12 Ln", max_bather_capacity: 100, lap_lane_count: 4 }
              as: AquaticsManager
              captures: { fac_id: $.data.id }
            - call: "POST /seasons"
              payload: { facility_id: "${fac_id}", season_name: "S26", start_date: "2026-06-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z", resident_pass_price_cents: 10000, non_resident_pass_price_cents: 15000, resident_daily_price_cents: 500, non_resident_daily_price_cents: 800 }
              as: AquaticsManager
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/publish"
              payload: {}
              as: AquaticsManager
            - call: "POST /lesson-levels"
              payload: { level_code: "L1", display_name: "Water Acclimation", min_age_years: 5, capacity_per_session: 1 }
              as: AquaticsManager
              captures: { level_id: $.data.id }
            - call: "POST /lesson-sessions"
              payload: { facility_id: "${fac_id}", level_id: "${level_id}", season_id: "${season_id}", start_datetime: "2026-07-01T09:00:00Z", end_datetime: "2026-07-31T10:00:00Z", lanes_required: 1 }
              as: AquaticsManager
              captures: { sess_id: $.data.id }
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: AquaticsManager
              captures: { fac_v: $.data.version }
            - call: "POST /lesson-sessions/${sess_id}/schedule"
              payload: { expected_facility_version: "${fac_v}" }
              as: AquaticsManager
            - call: "POST /pass-holders"
              payload: { full_name: "A", date_of_birth: "2015-01-01T00:00:00Z", residency_status: "RESIDENT", email: "a@x.com" }
              as: GateAttendant
              captures: { pa_id: $.data.id }
            - call: "POST /pass-holders"
              payload: { full_name: "B", date_of_birth: "2015-06-01T00:00:00Z", residency_status: "RESIDENT", email: "b@x.com" }
              as: GateAttendant
              captures: { pb_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: AquaticsManager
            - call: "POST /enrollments"
              payload: { lesson_session_id: "${sess_id}", pass_holder_id: "${pa_id}" }
              as: GateAttendant
              captures: { enr_a: $.data.id, enr_a_status: $.data.status }
            - call: "POST /enrollments"
              payload: { lesson_session_id: "${sess_id}", pass_holder_id: "${pb_id}" }
              as: GateAttendant
              captures: { enr_b: $.data.id, enr_b_status: $.data.status, enr_b_pos: $.data.waitlist_position }
          trigger:
            - call: "POST /enrollments/${enr_a}/drop"
              payload: {}
              as: PassHolder
              as_user_id: "${pa_id}"
          assert:
            - "LessonEnrollment.${enr_a}.status == DROPPED"
            - "LessonEnrollment.${enr_b}.status == ENROLLED"
            - "LessonEnrollment.${enr_b}.waitlist_position == null"
            - "LessonSession.${sess_id}.enrolled_count == 1"

  # =========================================================================
  # Rule 4: transitive_cascade — at least one depth-3 chain, at least one
  # depth-2 chain, from DIFFERENT triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: weather_closure_depth3_cascade
        grounds:
          - state_machines.Facility.OPEN_to_CLOSED_WEATHER
          - state_machines.DailyAdmission.ENTERED_to_RAIN_CHECKED
          - calculations.rain_check_refund
          - state_machines.LaneAllocation.RESERVED_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 cascade triggered by POST /facilities/{id}/closures with reason
          WEATHER: (1) PoolClosureEvent created; (2) DailyAdmission ENTERED ->
          RAIN_CHECKED which (3) triggers rain_check_refund computation crediting
          the holder; the LaneAllocation cancellation is a parallel hop from (1),
          not a sibling of (2). Different trigger from the incident cascade below.
        test_recipe:
          setup:
            - "Facility F OPEN, max_bather_capacity=200"
            - "Season S PUBLISHED [2026-06-01, 2026-08-31], resident_daily=1000c"
            - "PassHolder P (RESIDENT, ADULT)"
            - "DailyAdmission AD issued 2026-07-20 and ENTERED at 10:00"
            - "LaneAllocation LA RESERVED overlapping 2026-07-20 11:00-12:00"
            - "Logical clock 2026-07-20T10:30:00Z (elapsed 30 min -> FULL_REFUND)"
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Wx Pool", address: "1 Wx", max_bather_capacity: 200, lap_lane_count: 4 }
              as: AquaticsManager
              captures: { fac_id: $.data.id }
            - call: "POST /seasons"
              payload: { facility_id: "${fac_id}", season_name: "S", start_date: "2026-06-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z", resident_pass_price_cents: 10000, non_resident_pass_price_cents: 15000, resident_daily_price_cents: 1000, non_resident_daily_price_cents: 1500 }
              as: AquaticsManager
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/publish"
              payload: {}
              as: AquaticsManager
            - call: "POST /pass-holders"
              payload: { full_name: "WxPat", date_of_birth: "1990-01-01T00:00:00Z", residency_status: "RESIDENT", email: "wx@x.com" }
              as: GateAttendant
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-20T09:55:00Z" }
              as: AquaticsManager
            - call: "POST /admissions"
              payload: { facility_id: "${fac_id}", pass_holder_id: "${p_id}", admission_date: "2026-07-20T00:00:00Z" }
              as: GateAttendant
              captures: { adm_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-20T10:00:00Z" }
              as: AquaticsManager
            - call: "POST /admissions/${adm_id}/enter"
              payload: {}
              as: GateAttendant
            - call: "POST /lane-allocations"
              payload: { facility_id: "${fac_id}", purpose: "SWIM_TEAM", start_datetime: "2026-07-20T11:00:00Z", end_datetime: "2026-07-20T12:00:00Z", lane_count: 2 }
              as: AquaticsManager
              captures: { la_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-20T10:30:00Z" }
              as: AquaticsManager
          trigger:
            - call: "POST /facilities/${fac_id}/closures"
              payload: { closure_reason: "WEATHER", started_at: "2026-07-20T10:30:00Z" }
              as: AquaticsManager
              captures: { closure_id: $.data.id, rain_check: $.data.rain_check_issuance }
          assert:
            - "PoolClosureEvent.${closure_id}.closure_reason == WEATHER"
            - "PoolClosureEvent.${closure_id}.rain_check_issuance == FULL_REFUND"
            - "DailyAdmission.${adm_id}.status == RAIN_CHECKED"
            - "LaneAllocation.${la_id}.status == CANCELLED"
            - "Facility.${fac_id}.operational_status == CLOSED_WEATHER"
            - "Facility.${fac_id}.current_bather_count == 0"

      - name: incident_confirm_depth2_ban_cascade
        grounds:
          - state_machines.IncidentReport.SUBMITTED_to_CONFIRMED
          - state_machines.SeasonPass.ACTIVE_to_REVOKED
          - entities.PassHolder.fields.strike_count
          - entities.PassHolder.fields.banned_until
        distinguishing_aspect: |
          Depth-2 cascade triggered by POST /incident-reports/{id}/confirm on a
          MAJOR report: (1) IncidentReport -> CONFIRMED, which (2) sets
          PassHolder.banned_until AND increments strike_count, which in turn
          (3) flips each ACTIVE SeasonPass for that holder to REVOKED. Different
          trigger from weather-closure cascade above.
        test_recipe:
          setup:
            - "Facility F OPEN"
            - "Season S PUBLISHED [2026-06-01, 2026-08-31]"
            - "PassHolder P with ACTIVE SeasonPass PS"
            - "Lifeguard LG with ACTIVE cert"
            - "IncidentReport IR (DRAFT then SUBMITTED, severity=MAJOR, involved=P)"
            - "Logical clock 2026-07-05T12:00:00Z"
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Inc Pool", address: "2 Inc", max_bather_capacity: 100, lap_lane_count: 2 }
              as: AquaticsManager
              captures: { fac_id: $.data.id }
            - call: "POST /seasons"
              payload: { facility_id: "${fac_id}", season_name: "S", start_date: "2026-06-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z", resident_pass_price_cents: 10000, non_resident_pass_price_cents: 15000, resident_daily_price_cents: 500, non_resident_daily_price_cents: 800 }
              as: AquaticsManager
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/publish"
              payload: {}
              as: AquaticsManager
            - call: "POST /pass-holders"
              payload: { full_name: "Offender", date_of_birth: "1990-01-01T00:00:00Z", residency_status: "RESIDENT", email: "off@x.com" }
              as: GateAttendant
              captures: { p_id: $.data.id }
            - call: "POST /passes"
              payload: { pass_holder_id: "${p_id}", season_id: "${season_id}" }
              as: GateAttendant
              captures: { pass_id: $.data.id }
            - call: "POST /lifeguards"
              payload: { full_name: "Guard G", certification_id: "RC-1", cert_expires_on: "2027-01-01T00:00:00Z", hired_on: "2026-01-01T00:00:00Z" }
              as: AquaticsManager
              captures: { lg_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T12:00:00Z" }
              as: AquaticsManager
            - call: "POST /incident-reports"
              payload: { facility_id: "${fac_id}", reporting_lifeguard_id: "${lg_id}", involved_pass_holder_id: "${p_id}", incident_type: "RULE_VIOLATION", occurred_at: "2026-07-05T11:30:00Z", severity: "MAJOR", narrative: "Assaulted staff" }
              as: Lifeguard
              as_user_id: "${lg_id}"
              captures: { ir_id: $.data.id }
            - call: "POST /incident-reports/${ir_id}/submit"
              payload: {}
              as: Lifeguard
              as_user_id: "${lg_id}"
          trigger:
            - call: "POST /incident-reports/${ir_id}/confirm"
              payload: {}
              as: AquaticsManager
          assert:
            - "IncidentReport.${ir_id}.status == CONFIRMED"
            - "PassHolder.${p_id}.strike_count == 1"
            - "PassHolder.${p_id}.banned_until != null"
            - "PassHolder.${p_id}.banned_until == 2026-08-04T12:00:00Z"
            - "SeasonPass.${pass_id}.status == REVOKED"

  # =========================================================================
  # Rule 5: priority_pair_validation_conflict — different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_vs_business_safety_banned_enter_on_closed
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_FACILITY_CLOSED]
          - errors[ERR_HOLDER_BANNED]
        distinguishing_aspect: |
          Pair is (state, business_safety): a DailyAdmission whose facility is
          CLOSED_WEATHER *and* whose holder is banned. The scaffold orders
          business_safety checks (priority 8, ERR_FACILITY_CLOSED) BEFORE
          holder-ban checks (priority 9, ERR_HOLDER_BANNED). Reversing the
          priority yields ERR_HOLDER_BANNED instead — distinguishing the pinned
          order.
        test_recipe:
          setup:
            - "Facility F CLOSED_WEATHER (after a weather closure)"
            - "PassHolder P banned_until = 2026-08-04 (after a confirmed MAJOR incident)"
            - "DailyAdmission AD issued to P before the ban took effect, status ISSUED"
            - "Logical clock 2026-07-10T14:00:00Z"
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "PC Pool", address: "1 PC", max_bather_capacity: 100, lap_lane_count: 2 }
              as: AquaticsManager
              captures: { fac_id: $.data.id }
            - call: "POST /seasons"
              payload: { facility_id: "${fac_id}", season_name: "S", start_date: "2026-06-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z", resident_pass_price_cents: 10000, non_resident_pass_price_cents: 15000, resident_daily_price_cents: 500, non_resident_daily_price_cents: 800 }
              as: AquaticsManager
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/publish"
              payload: {}
              as: AquaticsManager
            - call: "POST /pass-holders"
              payload: { full_name: "P Banned", date_of_birth: "1990-01-01T00:00:00Z", residency_status: "RESIDENT", email: "pb@x.com" }
              as: GateAttendant
              captures: { p_id: $.data.id }
            - call: "POST /lifeguards"
              payload: { full_name: "LG", certification_id: "RC-9", cert_expires_on: "2027-01-01T00:00:00Z", hired_on: "2026-01-01T00:00:00Z" }
              as: AquaticsManager
              captures: { lg_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T12:00:00Z" }
              as: AquaticsManager
            - call: "POST /incident-reports"
              payload: { facility_id: "${fac_id}", reporting_lifeguard_id: "${lg_id}", involved_pass_holder_id: "${p_id}", incident_type: "RULE_VIOLATION", occurred_at: "2026-07-05T12:00:00Z", severity: "MAJOR", narrative: "x" }
              as: Lifeguard
              as_user_id: "${lg_id}"
              captures: { ir_id: $.data.id }
            - call: "POST /incident-reports/${ir_id}/submit"
              payload: {}
              as: Lifeguard
              as_user_id: "${lg_id}"
            - call: "POST /incident-reports/${ir_id}/confirm"
              payload: {}
              as: AquaticsManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T08:00:00Z" }
              as: AquaticsManager
            # Admission must be issued while holder is already banned -> would fail
            # So issue admission BEFORE the ban: reorder. Instead, confirm a second incident AFTER admission issued.
            # Simpler: use a different holder for admission, then ban that holder via a second incident AFTER admission.
            # Reset: use holder Q for admission (no ban), then confirm a fresh MAJOR against Q.
            - call: "POST /pass-holders"
              payload: { full_name: "Q", date_of_birth: "1990-01-01T00:00:00Z", residency_status: "RESIDENT", email: "q@x.com" }
              as: GateAttendant
              captures: { q_id: $.data.id }
            - call: "POST /admissions"
              payload: { facility_id: "${fac_id}", pass_holder_id: "${q_id}", admission_date: "2026-07-10T00:00:00Z" }
              as: GateAttendant
              captures: { adm_q: $.data.id }
            - call: "POST /incident-reports"
              payload: { facility_id: "${fac_id}", reporting_lifeguard_id: "${lg_id}", involved_pass_holder_id: "${q_id}", incident_type: "RULE_VIOLATION", occurred_at: "2026-07-10T08:30:00Z", severity: "MAJOR", narrative: "y" }
              as: Lifeguard
              as_user_id: "${lg_id}"
              captures: { ir2_id: $.data.id }
            - call: "POST /incident-reports/${ir2_id}/submit"
              payload: {}
              as: Lifeguard
              as_user_id: "${lg_id}"
            - call: "POST /incident-reports/${ir2_id}/confirm"
              payload: {}
              as: AquaticsManager
            - call: "POST /facilities/${fac_id}/closures"
              payload: { closure_reason: "WEATHER", started_at: "2026-07-10T09:00:00Z" }
              as: AquaticsManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T14:00:00Z" }
              as: AquaticsManager
          trigger:
            - call: "POST /admissions/${adm_q}/enter"
              payload: {}
              as: GateAttendant
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FACILITY_CLOSED"
            - "error_id != ERR_HOLDER_BANNED"

      - name: business_temporal_vs_business_fiscal_rental_approve
        grounds:
          - validations[priority=11]
          - validations[priority=19]
          - errors[ERR_RENTAL_OVERLAP]
          - errors[ERR_RENTAL_CAPACITY]
        distinguishing_aspect: |
          Pair is (business_temporal, business_fiscal): a FacilityRental whose window
          overlaps an existing APPROVED rental AND whose party_size exceeds the
          facility's max_bather_capacity. Priority 11 (temporal overlap) fires
          ERR_RENTAL_OVERLAP; priority 19 (capacity) would fire ERR_RENTAL_CAPACITY.
          The scaffold pins temporal before fiscal — distinguishing this pair from
          the (state, safety) pair above.
        test_recipe:
          setup:
            - "Facility F with max_bather_capacity=20, lap_lane_count=2"
            - "PassHolder A and B (both RESIDENT)"
            - "Rental R1 for A APPROVED on window 2026-08-01 14:00-16:00"
            - "Rental R2 for B REQUESTED on overlapping window 2026-08-01 15:00-17:00 with party_size=50 (exceeds capacity)"
            - "Logical clock 2026-07-20T00:00:00Z"
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Small Pool", address: "3 Small", max_bather_capacity: 20, lap_lane_count: 2 }
              as: AquaticsManager
              captures: { fac_id: $.data.id }
            - call: "POST /pass-holders"
              payload: { full_name: "A", date_of_birth: "1990-01-01T00:00:00Z", residency_status: "RESIDENT", email: "a2@x.com" }
              as: GateAttendant
              captures: { pa: $.data.id }
            - call: "POST /pass-holders"
              payload: { full_name: "B", date_of_birth: "1990-01-01T00:00:00Z", residency_status: "RESIDENT", email: "b2@x.com" }
              as: GateAttendant
              captures: { pb: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-20T00:00:00Z" }
              as: AquaticsManager
            - call: "POST /rentals"
              payload: { facility_id: "${fac_id}", pass_holder_id: "${pa}", party_size: 10, start_datetime: "2026-08-01T14:00:00Z", end_datetime: "2026-08-01T16:00:00Z" }
              as: PassHolder
              as_user_id: "${pa}"
              captures: { r1: $.data.id }
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: AquaticsManager
              captures: { fv1: $.data.version }
            - call: "POST /rentals/${r1}/approve"
              payload: { expected_facility_version: "${fv1}" }
              as: AquaticsManager
            - call: "POST /rentals"
              payload: { facility_id: "${fac_id}", pass_holder_id: "${pb}", party_size: 50, start_datetime: "2026-08-01T15:00:00Z", end_datetime: "2026-08-01T17:00:00Z" }
              as: PassHolder
              as_user_id: "${pb}"
              captures: { r2: $.data.id }
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: AquaticsManager
              captures: { fv2: $.data.version }
          trigger:
            - call: "POST /rentals/${r2}/approve"
              payload: { expected_facility_version: "${fv2}" }
              as: AquaticsManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_RENTAL_OVERLAP"
            - "error_id != ERR_RENTAL_CAPACITY"

  # =========================================================================
  # Rule 6: boundary_precision_check — different metrics, different endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: chemistry_ph_boundary_strict_inequality
        grounds:
          - calculations.chemistry_classification
          - validations[priority=18]
          - entities.ChemistryLog.fields.classification
        distinguishing_aspect: |
          Metric: pH threshold. The scaffold pins strict inequality: ph == 7.8 is
          IN_RANGE but ph == 7.81 is OUT_OF_RANGE. Endpoint: POST /facilities/{id}/
          chemistry-logs. Different metric AND different endpoint from the
          bather-capacity boundary below.
        test_recipe:
          setup:
            - "Facility F OPEN"
            - "Lifeguard LG ACTIVE"
            - "Logical clock 2026-06-15T10:00:00Z"
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Chem Pool", address: "9 Chem", max_bather_capacity: 50, lap_lane_count: 2 }
              as: AquaticsManager
              captures: { fac_id: $.data.id }
            - call: "POST /lifeguards"
              payload: { full_name: "LG Chem", certification_id: "RC-2", cert_expires_on: "2027-01-01T00:00:00Z", hired_on: "2026-01-01T00:00:00Z" }
              as: AquaticsManager
              captures: { lg_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T10:00:00Z" }
              as: AquaticsManager
          trigger:
            - call: "POST /facilities/${fac_id}/chemistry-logs"
              payload: { recorded_at: "2026-06-15T10:00:00Z", free_chlorine_ppm: 2.5, ph: 7.8, combined_chlorine_ppm: 0.2, recorded_by_lifeguard_id: "${lg_id}" }
              as: Lifeguard
              as_user_id: "${lg_id}"
              captures: { log1_class: $.data.classification }
            - call: "POST /facilities/${fac_id}/chemistry-logs"
              payload: { recorded_at: "2026-06-15T11:00:00Z", free_chlorine_ppm: 2.5, ph: 7.81, combined_chlorine_ppm: 0.2, recorded_by_lifeguard_id: "${lg_id}" }
              as: Lifeguard
              as_user_id: "${lg_id}"
              captures: { log2_class: $.data.classification }
          assert:
            - "ChemistryLog at ph=7.8 has classification == IN_RANGE"
            - "ChemistryLog at ph=7.81 has classification == OUT_OF_RANGE"
            - "After ph=7.81 log, Facility.operational_status == CLOSED_CHEMISTRY"

      - name: bather_capacity_at_max_boundary
        grounds:
          - calculations.bather_load_staffing_requirement
          - validations[priority=20]
          - entities.Facility.fields.current_bather_count
        distinguishing_aspect: |
          Metric: bather-count integer threshold. Endpoint: POST /admissions/{id}/enter.
          Boundary is `current_bather_count < max_bather_capacity` — entering the
          final seat (count goes from N-1 to N) succeeds; the next enter is rejected
          with ERR_FACILITY_AT_CAPACITY. Distinct metric (integer count) and endpoint
          from the chemistry-ph boundary above.
        test_recipe:
          setup:
            - "Facility F with max_bather_capacity=2"
            - "Season S PUBLISHED [2026-06-01, 2026-08-31]"
            - "PassHolders P1, P2, P3 (RESIDENT, ADULT)"
            - "Three ISSUED admissions for 2026-07-05"
            - "Logical clock 2026-07-05T10:00:00Z"
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "Tiny Pool", address: "1 Tiny", max_bather_capacity: 2, lap_lane_count: 0 }
              as: AquaticsManager
              captures: { fac_id: $.data.id }
            - call: "POST /seasons"
              payload: { facility_id: "${fac_id}", season_name: "S", start_date: "2026-06-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z", resident_pass_price_cents: 10000, non_resident_pass_price_cents: 15000, resident_daily_price_cents: 500, non_resident_daily_price_cents: 800 }
              as: AquaticsManager
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/publish"
              payload: {}
              as: AquaticsManager
            - call: "POST /pass-holders"
              payload: { full_name: "P1", date_of_birth: "1990-01-01T00:00:00Z", residency_status: "RESIDENT", email: "p1@x.com" }
              as: GateAttendant
              captures: { p1: $.data.id }
            - call: "POST /pass-holders"
              payload: { full_name: "P2", date_of_birth: "1990-01-01T00:00:00Z", residency_status: "RESIDENT", email: "p2@x.com" }
              as: GateAttendant
              captures: { p2: $.data.id }
            - call: "POST /pass-holders"
              payload: { full_name: "P3", date_of_birth: "1990-01-01T00:00:00Z", residency_status: "RESIDENT", email: "p3@x.com" }
              as: GateAttendant
              captures: { p3: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T10:00:00Z" }
              as: AquaticsManager
            - call: "POST /admissions"
              payload: { facility_id: "${fac_id}", pass_holder_id: "${p1}", admission_date: "2026-07-05T00:00:00Z" }
              as: GateAttendant
              captures: { a1: $.data.id }
            - call: "POST /admissions"
              payload: { facility_id: "${fac_id}", pass_holder_id: "${p2}", admission_date: "2026-07-05T00:00:00Z" }
              as: GateAttendant
              captures: { a2: $.data.id }
            - call: "POST /admissions"
              payload: { facility_id: "${fac_id}", pass_holder_id: "${p3}", admission_date: "2026-07-05T00:00:00Z" }
              as: GateAttendant
              captures: { a3: $.data.id }
          trigger:
            - call: "POST /admissions/${a1}/enter"
              payload: {}
              as: GateAttendant
            - call: "POST /admissions/${a2}/enter"
              payload: {}
              as: GateAttendant
            - call: "POST /admissions/${a3}/enter"
              payload: {}
              as: GateAttendant
              captures: { err: $.data.error_id }
          assert:
            - "DailyAdmission.${a1}.status == ENTERED"
            - "DailyAdmission.${a2}.status == ENTERED"
            - "DailyAdmission.${a3}.status == ISSUED"
            - "error_id for third enter == ERR_FACILITY_AT_CAPACITY"
            - "Facility.${fac_id}.current_bather_count == 2"

  # =========================================================================
  # Rule 7: cross_entity_state_dependency — different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: admission_enter_gated_by_facility_posture
        grounds:
          - state_machines.DailyAdmission.ISSUED_to_ENTERED
          - state_machines.Facility.OPEN_to_CLOSED_CHEMISTRY
          - validations[priority=8]
        distinguishing_aspect: |
          Entity pair: DailyAdmission depends on Facility. The ISSUED -> ENTERED
          transition requires Facility.operational_status IN {OPEN, RESTRICTED};
          a CLOSED_CHEMISTRY facility rejects the admission enter with
          ERR_FACILITY_CLOSED. Different entity pair than the lesson/lane rule below.
        test_recipe:
          setup:
            - "Facility F OPEN, Season S PUBLISHED [2026-06-01, 2026-08-31]"
            - "PassHolder P (RESIDENT, ADULT), Admission AD ISSUED for 2026-07-12"
            - "Lifeguard LG ACTIVE"
            - "Logical clock 2026-07-12T09:00:00Z"
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "DepPool", address: "1 Dep", max_bather_capacity: 100, lap_lane_count: 2 }
              as: AquaticsManager
              captures: { fac_id: $.data.id }
            - call: "POST /seasons"
              payload: { facility_id: "${fac_id}", season_name: "S", start_date: "2026-06-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z", resident_pass_price_cents: 10000, non_resident_pass_price_cents: 15000, resident_daily_price_cents: 500, non_resident_daily_price_cents: 800 }
              as: AquaticsManager
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/publish"
              payload: {}
              as: AquaticsManager
            - call: "POST /pass-holders"
              payload: { full_name: "DP", date_of_birth: "1990-01-01T00:00:00Z", residency_status: "RESIDENT", email: "dp@x.com" }
              as: GateAttendant
              captures: { p_id: $.data.id }
            - call: "POST /lifeguards"
              payload: { full_name: "LG", certification_id: "RC-3", cert_expires_on: "2027-01-01T00:00:00Z", hired_on: "2026-01-01T00:00:00Z" }
              as: AquaticsManager
              captures: { lg_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-12T09:00:00Z" }
              as: AquaticsManager
            - call: "POST /admissions"
              payload: { facility_id: "${fac_id}", pass_holder_id: "${p_id}", admission_date: "2026-07-12T00:00:00Z" }
              as: GateAttendant
              captures: { adm: $.data.id }
            - call: "POST /facilities/${fac_id}/chemistry-logs"
              payload: { recorded_at: "2026-07-12T09:30:00Z", free_chlorine_ppm: 6.0, ph: 7.5, combined_chlorine_ppm: 0.2, recorded_by_lifeguard_id: "${lg_id}" }
              as: Lifeguard
              as_user_id: "${lg_id}"
          trigger:
            - call: "POST /admissions/${adm}/enter"
              payload: {}
              as: GateAttendant
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FACILITY_CLOSED"
            - "DailyAdmission.${adm}.status == ISSUED"
            - "Facility.${fac_id}.operational_status == CLOSED_CHEMISTRY"

      - name: lesson_session_schedule_gated_by_lane_availability
        grounds:
          - state_machines.LessonSession.DRAFT_to_SCHEDULED
          - state_machines.LaneAllocation
          - validations[priority=12]
        distinguishing_aspect: |
          Entity pair: LessonSession depends on LaneAllocation. Scheduling a
          LessonSession requires sum of overlapping RESERVED lane_counts +
          lanes_required <= facility.lap_lane_count. Existing RESERVED allocations
          block the session's state transition. Different pair than
          DailyAdmission -> Facility.
        test_recipe:
          setup:
            - "Facility F with lap_lane_count=2"
            - "Season S PUBLISHED [2026-06-01, 2026-08-31]"
            - "SwimLessonLevel L1"
            - "LaneAllocation LA (SWIM_TEAM, lane_count=2) RESERVED overlapping 2026-07-08 09:00-11:00"
            - "LessonSession LS (DRAFT, lanes_required=1) window 2026-07-08 09:00-10:00"
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "LanePool", address: "5 Lp", max_bather_capacity: 100, lap_lane_count: 2 }
              as: AquaticsManager
              captures: { fac_id: $.data.id }
            - call: "POST /seasons"
              payload: { facility_id: "${fac_id}", season_name: "S", start_date: "2026-06-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z", resident_pass_price_cents: 10000, non_resident_pass_price_cents: 15000, resident_daily_price_cents: 500, non_resident_daily_price_cents: 800 }
              as: AquaticsManager
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/publish"
              payload: {}
              as: AquaticsManager
            - call: "POST /lesson-levels"
              payload: { level_code: "L1", display_name: "Lvl1", min_age_years: 5, capacity_per_session: 5 }
              as: AquaticsManager
              captures: { level_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-20T00:00:00Z" }
              as: AquaticsManager
            - call: "POST /lane-allocations"
              payload: { facility_id: "${fac_id}", purpose: "SWIM_TEAM", start_datetime: "2026-07-08T09:00:00Z", end_datetime: "2026-07-08T11:00:00Z", lane_count: 2 }
              as: AquaticsManager
              captures: { la_id: $.data.id }
            - call: "POST /lesson-sessions"
              payload: { facility_id: "${fac_id}", level_id: "${level_id}", season_id: "${season_id}", start_datetime: "2026-07-08T09:00:00Z", end_datetime: "2026-07-08T10:00:00Z", lanes_required: 1 }
              as: AquaticsManager
              captures: { sess_id: $.data.id }
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: AquaticsManager
              captures: { fv: $.data.version }
          trigger:
            - call: "POST /lesson-sessions/${sess_id}/schedule"
              payload: { expected_facility_version: "${fv}" }
              as: AquaticsManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_LANE_CAPACITY_EXCEEDED"
            - "LessonSession.${sess_id}.status == DRAFT"

  # =========================================================================
  # Rule 8: resource_temporal_overlap — different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: rental_exclusive_use_strict_overlap
        grounds:
          - validations[priority=11]
          - entities.FacilityRental
        distinguishing_aspect: |
          Interval semantics: half-open [start, end) on the WHOLE facility.
          Touching endpoints (one rental's end == another's start) do NOT conflict.
          Resource: Facility (whole-facility exclusive). Different from the
          lane-allocation rule below, which uses AGGREGATE capacity semantics.
        test_recipe:
          setup:
            - "Facility F (lap_lane_count=0, max_bather_capacity=100)"
            - "PassHolder A and B (RESIDENT)"
            - "Rental R1 for A APPROVED 2026-08-10 14:00-16:00"
            - "Rental R2 for B REQUESTED 2026-08-10 16:00-18:00 (touching endpoint)"
            - "Rental R3 for B REQUESTED 2026-08-10 15:59-18:00 (1-min overlap)"
            - "Logical clock 2026-07-25T00:00:00Z"
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "ExclPool", address: "9 Ex", max_bather_capacity: 100, lap_lane_count: 0 }
              as: AquaticsManager
              captures: { fac_id: $.data.id }
            - call: "POST /pass-holders"
              payload: { full_name: "A", date_of_birth: "1990-01-01T00:00:00Z", residency_status: "RESIDENT", email: "ra@x.com" }
              as: GateAttendant
              captures: { pa: $.data.id }
            - call: "POST /pass-holders"
              payload: { full_name: "B", date_of_birth: "1990-01-01T00:00:00Z", residency_status: "RESIDENT", email: "rb@x.com" }
              as: GateAttendant
              captures: { pb: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-25T00:00:00Z" }
              as: AquaticsManager
            - call: "POST /rentals"
              payload: { facility_id: "${fac_id}", pass_holder_id: "${pa}", party_size: 10, start_datetime: "2026-08-10T14:00:00Z", end_datetime: "2026-08-10T16:00:00Z" }
              as: PassHolder
              as_user_id: "${pa}"
              captures: { r1: $.data.id }
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: AquaticsManager
              captures: { fv1: $.data.version }
            - call: "POST /rentals/${r1}/approve"
              payload: { expected_facility_version: "${fv1}" }
              as: AquaticsManager
            - call: "POST /rentals"
              payload: { facility_id: "${fac_id}", pass_holder_id: "${pb}", party_size: 10, start_datetime: "2026-08-10T16:00:00Z", end_datetime: "2026-08-10T18:00:00Z" }
              as: PassHolder
              as_user_id: "${pb}"
              captures: { r2: $.data.id }
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: AquaticsManager
              captures: { fv2: $.data.version }
            - call: "POST /rentals"
              payload: { facility_id: "${fac_id}", pass_holder_id: "${pb}", party_size: 10, start_datetime: "2026-08-10T15:59:00Z", end_datetime: "2026-08-10T18:00:00Z" }
              as: PassHolder
              as_user_id: "${pb}"
              captures: { r3: $.data.id }
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: AquaticsManager
              captures: { fv3: $.data.version }
          trigger:
            - call: "POST /rentals/${r2}/approve"
              payload: { expected_facility_version: "${fv2}" }
              as: AquaticsManager
              captures: { r2_status: $.data.status }
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: AquaticsManager
              captures: { fv_after_r2: $.data.version }
            - call: "POST /rentals/${r3}/approve"
              payload: { expected_facility_version: "${fv_after_r2}" }
              as: AquaticsManager
              captures: { err: $.data.error_id }
          assert:
            - "FacilityRental.${r2}.status == APPROVED"
            - "error_id for R3 approve == ERR_RENTAL_OVERLAP"
            - "FacilityRental.${r3}.status == REQUESTED"

      - name: lane_allocation_aggregate_capacity_overlap
        grounds:
          - validations[priority=12]
          - entities.LaneAllocation
        distinguishing_aspect: |
          Interval semantics: AGGREGATE CAPACITY on a per-instant basis — the sum
          of lane_count over overlapping RESERVED allocations plus the new
          lane_count must not exceed facility.lap_lane_count. Unlike the rental
          rule (binary exclusive use), this allows partial overlap as long as the
          aggregate fits. Resource: LaneAllocation lane-pool. Different semantics
          AND different resource from the rental rule above.
        test_recipe:
          setup:
            - "Facility F with lap_lane_count=4"
            - "LaneAllocation LA1 (SWIM_TEAM, lane_count=2) RESERVED 2026-07-15 09:00-11:00"
            - "LaneAllocation LA2 (LAP_SWIM, lane_count=2) RESERVED 2026-07-15 10:00-12:00 (overlaps LA1 by 1 hour, sum=4 fits)"
            - "LaneAllocation LA3 (SWIM_TEAM, lane_count=1) REQUESTED 2026-07-15 10:30-11:30 (would push overlap to 5 > 4)"
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "LaneAggPool", address: "3 La", max_bather_capacity: 100, lap_lane_count: 4 }
              as: AquaticsManager
              captures: { fac_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: AquaticsManager
            - call: "POST /lane-allocations"
              payload: { facility_id: "${fac_id}", purpose: "SWIM_TEAM", start_datetime: "2026-07-15T09:00:00Z", end_datetime: "2026-07-15T11:00:00Z", lane_count: 2 }
              as: AquaticsManager
              captures: { la1: $.data.id }
            - call: "POST /lane-allocations"
              payload: { facility_id: "${fac_id}", purpose: "LAP_SWIM", start_datetime: "2026-07-15T10:00:00Z", end_datetime: "2026-07-15T12:00:00Z", lane_count: 2 }
              as: AquaticsManager
              captures: { la2: $.data.id }
          trigger:
            - call: "POST /lane-allocations"
              payload: { facility_id: "${fac_id}", purpose: "SWIM_TEAM", start_datetime: "2026-07-15T10:30:00Z", end_datetime: "2026-07-15T11:30:00Z", lane_count: 1 }
              as: AquaticsManager
              captures: { err: $.data.error_id }
          assert:
            - "LaneAllocation LA1 status == RESERVED"
            - "LaneAllocation LA2 status == RESERVED"
            - "error_id for LA3 creation == ERR_LANE_CAPACITY_EXCEEDED"

  # =========================================================================
  # Rule 9: compensating_invariant — different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: bather_count_enter_exit_invariant
        grounds:
          - state_machines.DailyAdmission.ISSUED_to_ENTERED
          - state_machines.DailyAdmission.ENTERED_to_EXITED
          - entities.Facility.fields.current_bather_count
        distinguishing_aspect: |
          Conserved quantity: Facility.current_bather_count. Invariant: for any
          DailyAdmission, the enter/exit pair leaves current_bather_count unchanged
          (count_after_pair == count_before_pair). Forward action = POST enter;
          compensating action = POST exit. Different quantity than the lane-pool
          invariant below.
        test_recipe:
          setup:
            - "Facility F, Season S PUBLISHED"
            - "PassHolder P (RESIDENT, ADULT), Admission AD ISSUED for 2026-07-18"
            - "Logical clock 2026-07-18T10:00:00Z"
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "InvPool", address: "4 Inv", max_bather_capacity: 100, lap_lane_count: 2 }
              as: AquaticsManager
              captures: { fac_id: $.data.id, count0: $.data.current_bather_count }
            - call: "POST /seasons"
              payload: { facility_id: "${fac_id}", season_name: "S", start_date: "2026-06-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z", resident_pass_price_cents: 10000, non_resident_pass_price_cents: 15000, resident_daily_price_cents: 500, non_resident_daily_price_cents: 800 }
              as: AquaticsManager
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/publish"
              payload: {}
              as: AquaticsManager
            - call: "POST /pass-holders"
              payload: { full_name: "Inv", date_of_birth: "1990-01-01T00:00:00Z", residency_status: "RESIDENT", email: "inv@x.com" }
              as: GateAttendant
              captures: { p_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-18T10:00:00Z" }
              as: AquaticsManager
            - call: "POST /admissions"
              payload: { facility_id: "${fac_id}", pass_holder_id: "${p_id}", admission_date: "2026-07-18T00:00:00Z" }
              as: GateAttendant
              captures: { adm: $.data.id }
          trigger:
            - call: "POST /admissions/${adm}/enter"
              payload: {}
              as: GateAttendant
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: AquaticsManager
              captures: { count_after_enter: $.data.current_bather_count }
            - call: "POST /admissions/${adm}/exit"
              payload: {}
              as: GateAttendant
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: AquaticsManager
              captures: { count_after_exit: $.data.current_bather_count }
          assert:
            - "Facility.${fac_id}.current_bather_count after enter == 1"
            - "Facility.${fac_id}.current_bather_count after exit == 0"
            - "count_after_exit == count_before_enter"

      - name: lane_pool_reserve_release_invariant
        grounds:
          - state_machines.LaneAllocation
          - state_machines.LessonSession.DRAFT_to_SCHEDULED
          - state_machines.LessonSession.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          Conserved quantity: sum of lane_count across RESERVED LaneAllocations
          at a facility at a given instant. Invariant: LessonSession schedule
          (forward action, creates RESERVED allocation) paired with completion
          (compensating action, transitions allocation to RELEASED) leaves the
          instantaneous RESERVED lane-count sum unchanged. Different quantity
          than bather_count above.
        test_recipe:
          setup:
            - "Facility F with lap_lane_count=4"
            - "Season S PUBLISHED [2026-06-01, 2026-08-31]"
            - "SwimLessonLevel L1"
            - "Pre-existing LaneAllocation LA0 (SWIM_TEAM, lane_count=1) RESERVED 2026-07-01 08:00-12:00"
            - "LessonSession LS DRAFT 2026-07-01 09:00-10:00, lanes_required=2"
            - "Logical clock 2026-06-25T00:00:00Z initially"
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "LpPool", address: "7 Lp", max_bather_capacity: 100, lap_lane_count: 4 }
              as: AquaticsManager
              captures: { fac_id: $.data.id }
            - call: "POST /seasons"
              payload: { facility_id: "${fac_id}", season_name: "S", start_date: "2026-06-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z", resident_pass_price_cents: 10000, non_resident_pass_price_cents: 15000, resident_daily_price_cents: 500, non_resident_daily_price_cents: 800 }
              as: AquaticsManager
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/publish"
              payload: {}
              as: AquaticsManager
            - call: "POST /lesson-levels"
              payload: { level_code: "L1", display_name: "Lvl1", min_age_years: 5, capacity_per_session: 10 }
              as: AquaticsManager
              captures: { level_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-25T00:00:00Z" }
              as: AquaticsManager
            - call: "POST /lane-allocations"
              payload: { facility_id: "${fac_id}", purpose: "SWIM_TEAM", start_datetime: "2026-07-01T08:00:00Z", end_datetime: "2026-07-01T12:00:00Z", lane_count: 1 }
              as: AquaticsManager
              captures: { la0: $.data.id }
            - call: "POST /lesson-sessions"
              payload: { facility_id: "${fac_id}", level_id: "${level_id}", season_id: "${season_id}", start_datetime: "2026-07-01T09:00:00Z", end_datetime: "2026-07-01T10:00:00Z", lanes_required: 2 }
              as: AquaticsManager
              captures: { sess_id: $.data.id }
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: AquaticsManager
              captures: { fv: $.data.version }
          trigger:
            - call: "POST /lesson-sessions/${sess_id}/schedule"
              payload: { expected_facility_version: "${fv}" }
              as: AquaticsManager
            - call: "GET /lane-allocations"
              payload: { facility_id: "${fac_id}", status: "RESERVED" }
              as: AquaticsManager
              captures: { reserved_count_during: $.meta.total_count }
            # Advance clock past end_datetime to trigger auto-complete + release
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T10:00:01Z" }
              as: AquaticsManager
            - call: "GET /lesson-sessions/${sess_id}"
              payload: {}
              as: AquaticsManager
              captures: { sess_status: $.data.status }
            - call: "GET /lane-allocations"
              payload: { facility_id: "${fac_id}", status: "RESERVED" }
              as: AquaticsManager
              captures: { reserved_count_after: $.meta.total_count }
          assert:
            - "During session, RESERVED lane-count sum at facility == 3 (1 from LA0 + 2 from lesson allocation)"
            - "After completion, LessonSession.${sess_id}.status == COMPLETED"
            - "After completion, RESERVED lane-count sum at facility == 1 (LA0 only)"
            - "The lesson's auto-created LaneAllocation status == RELEASED"
