            - { call: "POST /api/budgets", payload: { program_id: "${prog}", department_id: "${dept}", period_start_date: "2026-01-01", period_end_date: "2027-01-01", allocated_points: 10000 }, as: FinanceAdmin }
            - { call: "POST /api/employees", payload: { employee_ref: "M1", full_name: "Mgr", department_id: "${dept}", hire_date: "2020-03-01", state_code: "CA" }, as: HRAdmin, captures: { mgr: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "E1", full_name: "Emp", department_id: "${dept}", manager_id: "${mgr}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin, captures: { emp: $.data.id } }
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${emp}", type: MANAGER, points_requested: 100, reason_code: DELIVERY, message: "mine", idempotency_key: "val-sa-1" }, as: Manager, as_user_id: "${mgr}", captures: { nom: $.data.id, nom_v: $.data.version } }
          trigger:
            - { call: "POST /api/nominations/${nom}/approve", payload: { expected_nomination_version: "${nom_v}" }, as: Manager, as_user_id: "${mgr}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_SELF_APPROVAL"
            - "Nomination.${nom}.status remains PENDING_REVIEW"

      - name: manager_out_of_chain_approval_rejected
        claim_type: cross_entity_validation
        grounds: ["validations[priority=11]", "errors[ERR_NOMINEE_NOT_IN_SCOPE]"]
        distinguishing_aspect: "A Manager-role approver who is NOT in the nominee's transitive manager chain is rejected ERR_NOMINEE_NOT_IN_SCOPE; an HRAdmin approving the same nomination succeeds."
        test_recipe:
          setup: ["nominee reports to mgrA; mgrB (unrelated) attempts approval; HRAdmin succeeds afterwards"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "P", max_points_per_nomination: 1000, point_cost_rate_cents: 0.5, state_rate_map: { CA: 0.093 } }, as: HRAdmin, captures: { prog: $.data.id } }
