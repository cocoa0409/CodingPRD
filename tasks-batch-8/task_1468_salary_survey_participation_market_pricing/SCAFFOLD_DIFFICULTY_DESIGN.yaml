          assert:
            - "MarketComposite.${comp_id}.blended_p50_cents == 10682617 (0.75*10173921 + 0.25*12208706, round_half_up at final sum)"
            - "MarketComposite.${comp_id}.source_count == 2"

      - name: aging_geo_industry_rounding_order
        grounds:
          - calculations.aging_adjustment
          - calculations.geographic_differential
          - calculations.industry_cut_premium
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters. The scaffold pins the
          order: aging → geographic_differential → industry_cut_premium → blend,
          with round_half_up to whole cents at each step. A different order
          (e.g., industry before geo) produces a different final cent amount
          for the same inputs. The test uses p50=9999999 which provably
