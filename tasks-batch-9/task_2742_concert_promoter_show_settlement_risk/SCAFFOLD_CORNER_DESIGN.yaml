# =============================================================================
# task_2742 — Concert Promoter Show Settlement & Risk
# §1.9 Scaffold Corner Design — the BREADTH probe.
#
# Walked row-by-row against references/claim-extraction-guide.md. Every
# `section:` is one of the guide's nine sections and every `claim_type:` is a row
# from that section's table; no category is invented. Corners already asserted by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml are emitted as `excluded_because:` stubs that
# name the covering §1.8 instance.
#
# Rows skipped as non-applicable to this scaffold:
#   entities / Immutability      — every §1.1 entity declares common_fields: true
#   entities / topology graph    — entity_topology is flat, no junction entity
#   state_machines / compound    — no parent state is derived from children
#   endpoints / Bulk action      — §1.5 declares no bulk endpoint
#   calculations / tiered_pricing, topological, decay_function, interval_merge,
#                  projection, weighted_scoring-drift — no calculation declares
#                  those algorithm types except market_performance_index, which
#                  IS covered below
#   layers / soft_delete, idempotency, bulk_operations, scheduled_actions,
#            multi_tenancy, derived_field_reconciliation-flags,
#            conditional_feature_flags, pagination_with_filtering-cursor —
#            complexity_layers declares only dual_variant_calculation,
#            cascading_side_effects, rate_threshold_triggers and
#            optimistic_concurrency
#   consistency / eventual, saga — consistency_model is immediate
#
# Shorthand used in `setup:` prose: "BASE(<market>, <artist>, <venue>)" always
# expands to the four creates spelled out in that instance's setup_api_calls.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # SECTION 1 — entities
  # ===========================================================================
  - section: entities
    instances:
      - name: market_creation_returns_201_with_every_computed_field_at_its_declared_default
        claim_type: Creation
        grounds:
          - "entities.Market"
          - "endpoints[POST /markets]"
        distinguishing_aspect: |
          POST /markets with all three required inputs returns 201 and a body in which the three
          input fields echo and ALL SIX computed fields sit at their §1.1 defaults — including
          exposure_utilization_pct 0.00 (a two-decimal number, not the integer 0) and
          risk_posture OPEN, which is the band 0.00 falls in rather than a hardcoded literal.
        test_recipe:
          setup:
            - "Empty database; the logical clock is pinned so created_at is deterministic in shape."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: RiskOfficer
          trigger:
            - call: "POST /markets"
              payload: { name: "Mid-Atlantic", region_code: "MATL", guarantee_exposure_limit_cents: 8000000 }
              as: RiskOfficer
              captures: { c_mk_id: $.data.id, c_mk_version: $.data.version }
          assert:
            - "HTTP 201 and the envelope is { meta: { api_request_id, api_request_timestamp }, response_type: 'object', data: {...} }"
            - "Inputs echo exactly: name == 'Mid-Atlantic', region_code == 'MATL', guarantee_exposure_limit_cents == 8000000"
            - "Computed defaults: committed_guarantee_cents == 0, at_risk_guarantee_cents == 0, exposure_utilization_pct == 0.00, settled_show_count == 0, performance_index == 0"
            - "risk_posture == OPEN — derived by banding 0.00 (<= POSTURE_OPEN_MAX_PCT 70), not stored from input"
            - "System fields: ${c_mk_id} is a bare UUID with no type prefix, ${c_mk_version} == 1, created_at == updated_at on a freshly created row"

      - name: get_show_returns_the_stored_row_including_the_system_copied_market_id
        claim_type: Retrieval
        grounds:
          - "entities.Show"
          - "endpoints[GET /shows/{show_id}]"
        distinguishing_aspect: |
          GET /shows/{show_id} returns the persisted row, and the read is the only way to observe
          Show.market_id, which is `source: system` — copied from Venue.market_id at creation and
          never re-derived. The GET must return the copy, not a join performed at read time.
        test_recipe:
          setup:
            - "One Market, one Artist, one Venue in that market, and one PLANNED CO_PROMOTE show at that venue."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: RiskOfficer
            - call: "POST /markets"
              payload: { name: "Southeast", region_code: "SEA", guarantee_exposure_limit_cents: 9000000 }
              as: RiskOfficer
              captures: { g_mk_id: $.data.id }
            - call: "POST /artists"
              payload: { name: "Pinewood Static", agency: "Magnolia Talent", tier: "CLUB", historical_sellthrough_pct: 47.50, withholding_pct: 0 }
              as: TalentBuyer
              captures: { g_ar_id: $.data.id }
            - call: "POST /venues"
              payload: { market_id: "${g_mk_id}", name: "Magnolia Room", gross_capacity: 800, facility_fee_cents_per_ticket: 200, ticket_tax_pct: 5.00 }
              as: TalentBuyer
              captures: { g_vn_id: $.data.id }
            - call: "POST /shows"
              payload: { artist_id: "${g_ar_id}", venue_id: "${g_vn_id}", event_at: "2026-10-03T02:00:00.000Z", load_in_at: "2026-10-02T14:00:00.000Z", load_out_at: "2026-10-03T08:00:00.000Z", announce_at: "2026-08-12T15:00:00.000Z", venue_arrangement: "CO_PROMOTE", copromote_venue_share_pct: 12.50, venue_expense_pct_production: 40.00 }
              as: TalentBuyer
              captures: { g_sh_id: $.data.id }
          trigger:
            - call: "GET /shows/${g_sh_id}"
              payload: {}
              as: TourAccountant
              captures: { g_read_market_id: $.data.market_id }
          assert:
            - "HTTP 200 with response_type 'object' and data.id == ${g_sh_id}"
            - "${g_read_market_id} == ${g_mk_id} — market_id was copied from Venue.market_id at creation even though POST /shows never accepted a market_id input"
            - "artist_id == ${g_ar_id}, venue_id == ${g_vn_id}, venue_arrangement == CO_PROMOTE, copromote_venue_share_pct == 12.50, venue_expense_pct_production == 40.00"
            - "Defaults on the unsupplied percentages: venue_expense_pct_marketing == 0, venue_expense_pct_staffing == 0, venue_expense_pct_hospitality == 0, rental_fee_cents == 0"
            - "show_status == PLANNED, sales_status == PRE_SALE, budget_posture == ON_BUDGET, rescheduled_from_show_id == null, exposure_override_limit_cents == null"
            - "Every money and count field is 0: committed_guarantee_cents, gross_sold_cents, paid_tickets_sold, comp_tickets_issued, held_tickets, transferred_in_gross_cents, transferred_in_paid_tickets, adjusted_gross_cents, total_budgeted_expense_cents, total_actual_expense_cents, breakeven_cents, projected_adjusted_gross_cents, projected_promoter_net_cents, refund_liability_cents"

      - name: list_shows_filters_by_show_status_and_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - "endpoints[GET /shows]"
          - "response_envelope.pagination_fields"
          - "response_envelope.pagination_defaults"
        distinguishing_aspect: |
          GET /shows composes the show_status filter with limit/offset: the filter narrows the set
          BEFORE pagination, so total_count reports the filtered cardinality (3) and not the table
          cardinality (5), and has_more is computed against that filtered count. The default limit
          is 10, so an unpaged call returns all five.
        test_recipe:
          setup:
            - "One Market, one Venue and five Artists (one per show, so no artist rest buffer can interfere)."
            - "Five PLANNED shows at that venue with pairwise non-overlapping load windows."
            - "Three of the five are then CONFIRMED by accepting a 1000000 FLAT_GUARANTEE offer each; two are left PLANNED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: RiskOfficer
            - call: "POST /markets"
              payload: { name: "Listing Market", region_code: "LST", guarantee_exposure_limit_cents: 20000000 }
              as: RiskOfficer
              captures: { l_mk_id: $.data.id }
            - call: "POST /venues"
              payload: { market_id: "${l_mk_id}", name: "Index Hall", gross_capacity: 1000, facility_fee_cents_per_ticket: 0, ticket_tax_pct: 0 }
              as: TalentBuyer
              captures: { l_vn_id: $.data.id }
            - call: "POST /artists"
              payload: { name: "Act One", agency: "Index Talent", tier: "CLUB", historical_sellthrough_pct: 40.00, withholding_pct: 0 }
              as: TalentBuyer
              captures: { l_ar1_id: $.data.id }
            - call: "POST /artists"
              payload: { name: "Act Two", agency: "Index Talent", tier: "CLUB", historical_sellthrough_pct: 41.00, withholding_pct: 0 }
              as: TalentBuyer
              captures: { l_ar2_id: $.data.id }
            - call: "POST /artists"
              payload: { name: "Act Three", agency: "Index Talent", tier: "CLUB", historical_sellthrough_pct: 42.00, withholding_pct: 0 }
              as: TalentBuyer
              captures: { l_ar3_id: $.data.id }
            - call: "POST /artists"
              payload: { name: "Act Four", agency: "Index Talent", tier: "CLUB", historical_sellthrough_pct: 43.00, withholding_pct: 0 }
              as: TalentBuyer
              captures: { l_ar4_id: $.data.id }
            - call: "POST /artists"
              payload: { name: "Act Five", agency: "Index Talent", tier: "CLUB", historical_sellthrough_pct: 44.00, withholding_pct: 0 }
              as: TalentBuyer
              captures: { l_ar5_id: $.data.id }
            - call: "POST /shows"
              payload: { artist_id: "${l_ar1_id}", venue_id: "${l_vn_id}", event_at: "2026-10-02T02:00:00.000Z", load_in_at: "2026-10-01T14:00:00.000Z", load_out_at: "2026-10-02T08:00:00.000Z", announce_at: "2026-08-20T15:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 50000 }
              as: TalentBuyer
              captures: { l_sh1_id: $.data.id, l_sh1_v: $.data.version }
            - call: "POST /shows"
              payload: { artist_id: "${l_ar2_id}", venue_id: "${l_vn_id}", event_at: "2026-10-04T02:00:00.000Z", load_in_at: "2026-10-03T14:00:00.000Z", load_out_at: "2026-10-04T08:00:00.000Z", announce_at: "2026-08-20T15:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 50000 }
              as: TalentBuyer
              captures: { l_sh2_id: $.data.id, l_sh2_v: $.data.version }
            - call: "POST /shows"
              payload: { artist_id: "${l_ar3_id}", venue_id: "${l_vn_id}", event_at: "2026-10-06T02:00:00.000Z", load_in_at: "2026-10-05T14:00:00.000Z", load_out_at: "2026-10-06T08:00:00.000Z", announce_at: "2026-08-20T15:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 50000 }
              as: TalentBuyer
              captures: { l_sh3_id: $.data.id, l_sh3_v: $.data.version }
            - call: "POST /shows"
              payload: { artist_id: "${l_ar4_id}", venue_id: "${l_vn_id}", event_at: "2026-10-08T02:00:00.000Z", load_in_at: "2026-10-07T14:00:00.000Z", load_out_at: "2026-10-08T08:00:00.000Z", announce_at: "2026-08-20T15:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 50000 }
              as: TalentBuyer
              captures: { l_sh4_id: $.data.id }
            - call: "POST /shows"
              payload: { artist_id: "${l_ar5_id}", venue_id: "${l_vn_id}", event_at: "2026-10-10T02:00:00.000Z", load_in_at: "2026-10-09T14:00:00.000Z", load_out_at: "2026-10-10T08:00:00.000Z", announce_at: "2026-08-20T15:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 50000 }
              as: TalentBuyer
              captures: { l_sh5_id: $.data.id }
            - call: "POST /offers"
              payload: { show_id: "${l_sh1_id}", expected_show_version: "${l_sh1_v}", deal_structure: "FLAT_GUARANTEE", guarantee_cents: 1000000, deposit_cents: 0, expense_cap_cents: 1000000 }
              as: TalentBuyer
              captures: { l_of1_id: $.data.id }
            - call: "POST /offers/${l_of1_id}/submit"
              payload: {}
              as: TalentBuyer
            - call: "POST /offers/${l_of1_id}/accept"
              payload: {}
              as: ArtistRep
              as_user_id: "${l_ar1_id}"
            - call: "POST /offers"
              payload: { show_id: "${l_sh2_id}", expected_show_version: "${l_sh2_v}", deal_structure: "FLAT_GUARANTEE", guarantee_cents: 1000000, deposit_cents: 0, expense_cap_cents: 1000000 }
              as: TalentBuyer
              captures: { l_of2_id: $.data.id }
            - call: "POST /offers/${l_of2_id}/submit"
              payload: {}
              as: TalentBuyer
            - call: "POST /offers/${l_of2_id}/accept"
              payload: {}
              as: ArtistRep
              as_user_id: "${l_ar2_id}"
            - call: "POST /offers"
              payload: { show_id: "${l_sh3_id}", expected_show_version: "${l_sh3_v}", deal_structure: "FLAT_GUARANTEE", guarantee_cents: 1000000, deposit_cents: 0, expense_cap_cents: 1000000 }
              as: TalentBuyer
              captures: { l_of3_id: $.data.id }
            - call: "POST /offers/${l_of3_id}/submit"
              payload: {}
              as: TalentBuyer
            - call: "POST /offers/${l_of3_id}/accept"
              payload: {}
              as: ArtistRep
              as_user_id: "${l_ar3_id}"
          trigger:
            - call: "GET /shows"
              payload: {}
              as: RiskOfficer
            - call: "GET /shows"
              payload: { show_status: "CONFIRMED", limit: 2, offset: 0 }
              as: RiskOfficer
            - call: "GET /shows"
              payload: { show_status: "CONFIRMED", limit: 2, offset: 2 }
              as: RiskOfficer
            - call: "GET /shows"
              payload: { venue_id: "${l_vn_id}", show_status: "PLANNED" }
              as: RiskOfficer
          assert:
            - "UNPAGED — response_type == 'array', total_count == 5, has_more == false, and data holds 5 rows because pagination_defaults.limit is 10"
            - "FILTER BEFORE PAGE, page 1 — total_count == 3 (only the CONFIRMED shows), has_more == true, limit == 2, offset == 0, and data holds exactly 2 rows"
            - "FILTER BEFORE PAGE, page 2 — total_count == 3 (unchanged by the offset), has_more == false, offset == 2, and data holds exactly 1 row"
            - "The union of the two pages is exactly {${l_sh1_id}, ${l_sh2_id}, ${l_sh3_id}} with no row appearing twice"
            - "COMPOSED FILTERS — venue_id + show_status PLANNED returns total_count == 2 and the ids are exactly {${l_sh4_id}, ${l_sh5_id}}"
            - "Every returned row carries the full Show shape (not a summary projection): show_status, sales_status and budget_posture are present on each"

      - name: unknown_uuids_return_the_entity_specific_not_found_error_id
        claim_type: Not Found
        grounds:
          - "validations[priority=4]"
          - "validations[priority=5]"
          - "validations[priority=6]"
          - "validations[priority=7]"
          - "validations[priority=8]"
          - "validations[priority=9]"
          - "validations[priority=10]"
          - "validations[priority=11]"
          - "validations[priority=12]"
          - "validations[priority=13]"
          - "validations[priority=14]"
        distinguishing_aspect: |
          All eleven entities have their own 404 error_id. A single generic ERR_NOT_FOUND, or reusing
          ERR_SHOW_NOT_FOUND for a missing settlement, fails this instance. Each probe uses the same
          syntactically valid but unallocated UUID, so the only variable is which endpoint is called.
        test_recipe:
          setup:
            - "Empty database apart from the clock; no entity of any type has been created, so every id below is unallocated."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: RiskOfficer
          trigger:
            - call: "GET /markets/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: RiskOfficer
              captures: { nf_market: $.data.error_id }
            - call: "GET /artists/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: RiskOfficer
              captures: { nf_artist: $.data.error_id }
            - call: "GET /venues/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: RiskOfficer
              captures: { nf_venue: $.data.error_id }
            - call: "GET /shows/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: RiskOfficer
              captures: { nf_show: $.data.error_id }
            - call: "GET /offers/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: RiskOfficer
              captures: { nf_offer: $.data.error_id }
            - call: "GET /budget-lines/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: RiskOfficer
              captures: { nf_budget_line: $.data.error_id }
            - call: "GET /vendor-invoices/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: RiskOfficer
              captures: { nf_invoice: $.data.error_id }
            - call: "GET /ticket-tiers/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: RiskOfficer
              captures: { nf_tier: $.data.error_id }
            - call: "GET /ticket-holds/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: RiskOfficer
              captures: { nf_hold: $.data.error_id }
            - call: "GET /settlements/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: RiskOfficer
              captures: { nf_settlement: $.data.error_id }
            - call: "GET /cancellation-events/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: RiskOfficer
              captures: { nf_cancellation: $.data.error_id }
          assert:
            - "${nf_market} == ERR_MARKET_NOT_FOUND, HTTP 404"
            - "${nf_artist} == ERR_ARTIST_NOT_FOUND, HTTP 404"
            - "${nf_venue} == ERR_VENUE_NOT_FOUND, HTTP 404"
            - "${nf_show} == ERR_SHOW_NOT_FOUND, HTTP 404"
            - "${nf_offer} == ERR_OFFER_NOT_FOUND, HTTP 404"
            - "${nf_budget_line} == ERR_BUDGET_LINE_NOT_FOUND, HTTP 404"
            - "${nf_invoice} == ERR_VENDOR_INVOICE_NOT_FOUND, HTTP 404"
            - "${nf_tier} == ERR_TICKET_TIER_NOT_FOUND, HTTP 404"
            - "${nf_hold} == ERR_TICKET_HOLD_NOT_FOUND, HTTP 404"
            - "${nf_settlement} == ERR_SETTLEMENT_NOT_FOUND, HTTP 404"
            - "${nf_cancellation} == ERR_CANCELLATION_EVENT_NOT_FOUND, HTTP 404"
            - "Every response uses the error envelope: response_type == 'error' and data carries both error_id and a non-empty message"

      - name: offer_creation_with_any_required_input_omitted_is_rejected
        claim_type: Required Fields
        grounds:
          - "endpoints[POST /offers].input"
          - "validations[priority=3]"
        distinguishing_aspect: |
          POST /offers declares six required inputs and two optional ones. Omitting any ONE of the six
          returns ERR_INVALID_REQUEST 400 and creates nothing; the two optional percentages may be
          omitted freely. This separates "declared in input" from "required in input" — a schema that
          treats versus_pct as required would pass the six probes and fail the control.
        test_recipe:
          setup:
            - "One Market, one Artist, one Venue and one PLANNED show; the show's version is captured for the OCC field."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: RiskOfficer
            - call: "POST /markets"
              payload: { name: "Required Market", region_code: "REQ", guarantee_exposure_limit_cents: 9000000 }
              as: RiskOfficer
              captures: { rf_mk_id: $.data.id }
            - call: "POST /artists"
              payload: { name: "Required Act", agency: "Req Talent", tier: "THEATER", historical_sellthrough_pct: 60.00 }
              as: TalentBuyer
              captures: { rf_ar_id: $.data.id }
            - call: "POST /venues"
              payload: { market_id: "${rf_mk_id}", name: "Required Hall", gross_capacity: 1200, facility_fee_cents_per_ticket: 150, ticket_tax_pct: 4.00 }
              as: TalentBuyer
              captures: { rf_vn_id: $.data.id }
            - call: "POST /shows"
              payload: { artist_id: "${rf_ar_id}", venue_id: "${rf_vn_id}", event_at: "2026-11-05T02:00:00.000Z", load_in_at: "2026-11-04T14:00:00.000Z", load_out_at: "2026-11-05T08:00:00.000Z", announce_at: "2026-08-15T15:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 120000 }
              as: TalentBuyer
              captures: { rf_sh_id: $.data.id, rf_sh_v: $.data.version }
          trigger:
            - call: "POST /offers"
              payload: { expected_show_version: "${rf_sh_v}", deal_structure: "FLAT_GUARANTEE", guarantee_cents: 2000000, deposit_cents: 0, expense_cap_cents: 1000000 }
              as: TalentBuyer
              captures: { rf_no_show: $.data.error_id }
            - call: "POST /offers"
              payload: { show_id: "${rf_sh_id}", deal_structure: "FLAT_GUARANTEE", guarantee_cents: 2000000, deposit_cents: 0, expense_cap_cents: 1000000 }
              as: TalentBuyer
              captures: { rf_no_version: $.data.error_id }
            - call: "POST /offers"
              payload: { show_id: "${rf_sh_id}", expected_show_version: "${rf_sh_v}", guarantee_cents: 2000000, deposit_cents: 0, expense_cap_cents: 1000000 }
              as: TalentBuyer
              captures: { rf_no_structure: $.data.error_id }
            - call: "POST /offers"
              payload: { show_id: "${rf_sh_id}", expected_show_version: "${rf_sh_v}", deal_structure: "FLAT_GUARANTEE", deposit_cents: 0, expense_cap_cents: 1000000 }
              as: TalentBuyer
              captures: { rf_no_guarantee: $.data.error_id }
            - call: "POST /offers"
              payload: { show_id: "${rf_sh_id}", expected_show_version: "${rf_sh_v}", deal_structure: "FLAT_GUARANTEE", guarantee_cents: 2000000, expense_cap_cents: 1000000 }
              as: TalentBuyer
              captures: { rf_no_deposit: $.data.error_id }
            - call: "POST /offers"
              payload: { show_id: "${rf_sh_id}", expected_show_version: "${rf_sh_v}", deal_structure: "FLAT_GUARANTEE", guarantee_cents: 2000000, deposit_cents: 0 }
              as: TalentBuyer
              captures: { rf_no_cap: $.data.error_id }
            - call: "POST /offers"
              payload: { show_id: "${rf_sh_id}", expected_show_version: "${rf_sh_v}", deal_structure: "FLAT_GUARANTEE", guarantee_cents: 2000000, deposit_cents: 0, expense_cap_cents: 1000000 }
              as: TalentBuyer
              captures: { rf_control_id: $.data.id }
            - call: "GET /offers"
              payload: { show_id: "${rf_sh_id}" }
              as: TalentBuyer
          assert:
            - "All six omission probes return HTTP 400 with error_id ERR_INVALID_REQUEST: ${rf_no_show}, ${rf_no_version}, ${rf_no_structure}, ${rf_no_guarantee}, ${rf_no_deposit}, ${rf_no_cap}"
            - "CONTROL — the seventh call omits BOTH optional inputs (versus_pct, backend_split_artist_pct) and returns HTTP 201 with a non-null ${rf_control_id}"
            - "GET /offers filtered to the show returns total_count == 1 — none of the six rejected calls persisted a row"
            - "The control row carries versus_pct == 0 and backend_split_artist_pct == 0, the declared defaults for the omitted optionals"

      - name: omitted_optional_inputs_fall_back_to_their_declared_defaults
        claim_type: Defaults
        grounds:
          - "entities.Artist.withholding_pct"
          - "entities.Show.rental_fee_cents"
          - "entities.BudgetLine.is_artist_deductible"
          - "entities.Offer.versus_pct"
          - "entities.TicketHold.expires_at"
        distinguishing_aspect: |
          Five different default flavours are asserted in one sweep: a numeric zero (withholding_pct),
          a boolean false (is_artist_deductible), a null (TicketHold.expires_at), a percentage zero
          that must NOT be confused with null (Offer.versus_pct), and the four venue expense
          percentages that default to 0 on a RENTAL show. A `null` where `0` is declared — or the
          reverse — fails.
        test_recipe:
          setup:
            - "Nothing pre-existing; each create below deliberately omits every optional input it has."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: RiskOfficer
            - call: "POST /markets"
