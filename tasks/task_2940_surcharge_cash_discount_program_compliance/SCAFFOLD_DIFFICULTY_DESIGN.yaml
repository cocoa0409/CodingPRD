  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: program_cycle_active_suspend_resume_disable_reactivate
        grounds:
          - state_machines.SurchargeProgram.ACTIVE_to_SUSPENDED
          - state_machines.SurchargeProgram.SUSPENDED_to_ACTIVE
          - state_machines.SurchargeProgram.DISABLED_to_SUSPENDED
          - entities.SurchargeProgram.fields.status
          - entities.SurchargeProgram.fields.disable_reason
        distinguishing_aspect: |
          The CYCLE lives on SurchargeProgram: the same row traverses ACTIVE -> SUSPENDED -> ACTIVE and then
          ACTIVE -> DISABLED -> SUSPENDED -> ACTIVE, re-entering ACTIVE twice, and disable_reason is rewritten on
          every hop (OPERATOR_SUSPENSION -> NONE -> JURISDICTION_PROHIBITION -> OPERATOR_SUSPENSION -> NONE).
        test_recipe:
          setup:
            - "Jurisdiction AZ (surcharge permitted, cap 4.0, empty required artifact set)."
            - "One ACTIVE SURCHARGE program of one merchant on docA with a VISA/ALL rate rule at 2.19 percent and an EFFECTIVE VISA registration; logical clock 2026-08-31T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /jurisdictions"
              payload: { state_code: "AZ", surcharge_permitted: true, surcharge_cap_pct: 4.0, cash_discount_permitted: true, price_posting_required: false, disclosure_signage_required: false, receipt_line_item_required: false, ag_enforcement_posture: "PERMISSIVE" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { jur_az_id: $.data.id }
            - call: "POST /merchants"
              payload: { jurisdiction_id: "${jur_az_id}", legal_name: "Sonoran Supply Co", mcc: "5734" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { merch_id: $.data.id, merch_v0: $.data.version }
            - call: "POST /merchants/${merch_id}/cost-documentations"
              payload: { base_mdr_pct: 1.85, assessment_pct: 0.14, per_item_fee_cents: 10, evidence_uri: "s3://acq/az/2026-07.pdf", expected_merchant_version: "${merch_v0}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { doc_a_id: $.data.id }
            - call: "POST /surcharge-programs"
              payload: { merchant_id: "${merch_id}", jurisdiction_id: "${jur_az_id}", cost_documentation_id: "${doc_a_id}", program_type: "SURCHARGE", consistency_scope: "BRAND_LEVEL" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { prog_id: $.data.id, prog_v0: $.data.version }
            - call: "POST /surcharge-programs/${prog_id}/rate-rules"
              payload: { brand: "VISA", product_tier: "ALL", rate_pct: 2.19, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", expected_program_version: "${prog_v0}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /surcharge-programs/${prog_id}/network-registrations"
              payload: { network: "VISA", registration_ref: "VS-2940-AZ-001" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { reg_id: $.data.id }
            - call: "POST /network-registrations/${reg_id}/decision"
              payload: { decision: "ACKNOWLEDGE", decision_note: "accepted" }
              as: NetworkAuditor
              as_user_id: "auditor-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /network-registrations/${reg_id}/effectuate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /surcharge-programs/${prog_id}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /surcharge-programs/${prog_id}/status-actions"
              payload: { action: "SUSPEND", reason: "internal compliance review" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /surcharge-programs/${prog_id}/status-actions"
              payload: { action: "RESUME", reason: "review closed" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /jurisdictions/${jur_az_id}/law-changes"
              payload: { surcharge_permitted: false, surcharge_cap_pct: null }
              as: StateRegulator
              as_user_id: "regulator-1"
            - call: "POST /jurisdictions/${jur_az_id}/law-changes"
              payload: { surcharge_permitted: true, surcharge_cap_pct: 4.0 }
