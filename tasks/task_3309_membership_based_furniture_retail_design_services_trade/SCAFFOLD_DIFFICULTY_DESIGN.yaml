scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: quote_vs_settlement_repricing_on_promo_release
        grounds:
          - calculations.order_line_pricing
          - state_machines.SourceBook.IN_PRINT_to_RELEASED
          - state_machines.Order.QUOTE_to_CONFIRMED
        distinguishing_aspect: |
          Order-domain dual variant: identical lines priced under the provisional_quote variant
          (quote_total_cents frozen at first line addition, 219900) diverge from the
          final_settlement variant (total_cents recomputed at confirm after the source book
          release flips promo_active, 199900). Same data, two valid algorithms, different totals.
        test_recipe:
          setup:
            - "Gallery exists; STOCK product list 200000; retail guest QUOTE order with one line qty 1 (quote_total 219900 = 200000 + 19900 fee)"
            - "SourceBook covering the product is IN_PRINT with print_ready_date 2026-09-01; clock advanced to 2026-09-22 (>= print_ready + 21d) and cycle run so promo is active before confirm"
          setup_api_calls:
            - { call: "POST /galleries", payload: { name: "Gallery A", region: "WEST", daily_route_minutes_capacity: 480 }, as: PlatformAdmin, captures: { gid: $.data.id } }
            - { call: "POST /products", payload: { sku: "SOFA-01", name: "Sofa", list_price_cents: 200000, line_kind: "STOCK" }, as: PlatformAdmin, captures: { pid: $.data.id } }
            - { call: "POST /orders", payload: { gallery_id: "${gid}" }, as: GalleryAssociate, captures: { oid: $.data.id } }
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", qty: 1 }, as: GalleryAssociate, captures: { lid: $.data.id } }
            - { call: "POST /source-books", payload: { title: "Fall Book", product_ids: ["${pid}"], print_ready_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-22T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /_ops/run_daily_cycle", payload: {}, as: PlatformAdmin }
          trigger:
            - { call: "POST /orders/${oid}/confirm", payload: {}, as: GalleryAssociate, captures: { final_total: $.data.total_cents, quote_total: $.data.quote_total_cents, final_status: $.data.status } }
          assert:
            - "Order.${oid}.quote_total_cents == 219900 (provisional variant frozen at first line addition: 200000 + 19900 fee)"
            - "Order.${oid}.total_cents == 199900 (final settlement re-price with promo: round_half_up(200000*0.90)=180000 + 19900 fee)"
            - "Order.${oid}.status == READY_FOR_DELIVERY (zero custom lines pass straight through CONFIRMED)"

      - name: member_gross_vs_net_savings
        grounds:
          - calculations.membership_savings
          - entities.Member.fields.lifetime_gross_savings_cents
          - entities.Member.fields.lifetime_net_savings_cents
        distinguishing_aspect: |
          Member-domain dual variant (different entity domain than order pricing): the same
          delivered order yields lifetime_gross_savings_cents == 50000 (raw discount granted)
          but lifetime_net_savings_cents == 32500 (gross minus 17500 fee). Same delivery event,
          two valid figures.
        test_recipe:
          setup:
            - "Member enrolled at default clock 2026-09-01 (fee 17500 charged, ACTIVE, auto_renew false)"
            - "Member order: one line, STOCK product list 100000, qty 2 -> member price 150000; confirmed (READY_FOR_DELIVERY) and delivered via appointment on 2026-09-05"
          setup_api_calls:
            - { call: "POST /galleries", payload: { name: "Gallery B", region: "EAST", daily_route_minutes_capacity: 480 }, as: PlatformAdmin, captures: { gid: $.data.id } }
            - { call: "POST /members", payload: { email: "m1@x.com", full_name: "M One", auto_renew: false, payment_token: "tok" }, as: Anonymous, captures: { mid: $.data.id } }
            - { call: "POST /products", payload: { sku: "CHAIR-01", name: "Chair", list_price_cents: 100000, line_kind: "STOCK" }, as: PlatformAdmin, captures: { pid: $.data.id } }
            - { call: "POST /orders", payload: { gallery_id: "${gid}", member_id: "${mid}" }, as: Member, as_user_id: "${mid}", captures: { oid: $.data.id } }
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", qty: 2 }, as: Member, as_user_id: "${mid}" }
            - { call: "POST /orders/${oid}/confirm", payload: {}, as: Member, as_user_id: "${mid}" }
            - { call: "POST /delivery-appointments", payload: { order_id: "${oid}", gallery_id: "${gid}", delivery_date: "2026-09-05", duration_minutes: 60, room_placement: true, assembly_required: true }, as: GalleryAssociate, captures: { aid: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T08:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /_ops/run_daily_cycle", payload: {}, as: PlatformAdmin }
            - { call: "POST /delivery-appointments/${aid}/record-outcome", payload: { outcome: "COMPLETED", packaging_removed: true }, as: HubOperator }
          trigger:
            - { call: "GET /members/${mid}", payload: {}, as: PlatformAdmin, captures: { gross: $.data.lifetime_gross_savings_cents, net: $.data.lifetime_net_savings_cents } }
          assert:
            - "Member.${mid}.lifetime_gross_savings_cents == 50000 ((100000*2) - 150000)"
            - "Member.${mid}.lifetime_net_savings_cents == 32500 (50000 - 17500 fee)"
            - "Member.${mid}.fee_paid_total_cents == 17500"

  - rule_id: combinatorial_formula
    instances:
      - name: custom_deposit_floor_and_rate_by_tier
        grounds:
          - calculations.custom_deposit
          - entities.OrderLine.fields.deposit_cents
        distinguishing_aspect: |
          Mode (a): >= 3 inputs (list price, qty, pricing tier) with non-linear interaction —
          nested max(round(line*rate), floor) where BOTH rate and floor branch on tier.
          Member tier: max(round(90000*0.50), 50000) = 50000 (floor binds).
          Trade TIER_2: max(round(72000*0.25), 25000) = 25000 (floor binds).
        test_recipe:
          setup:
            - "Gallery; CUSTOM product list 120000 STANDARD fabric"
            - "Member order with one custom line (charged 90000); VERIFIED TIER_2 trade account order with one custom line of the same product (charged 72000)"
          setup_api_calls:
            - { call: "POST /galleries", payload: { name: "Gallery C", region: "WEST", daily_route_minutes_capacity: 480 }, as: PlatformAdmin, captures: { gid: $.data.id } }
            - { call: "POST /products", payload: { sku: "CUS-01", name: "Custom Sofa", list_price_cents: 120000, line_kind: "CUSTOM" }, as: PlatformAdmin, captures: { pid: $.data.id } }
            - { call: "POST /members", payload: { email: "m2@x.com", full_name: "M Two", auto_renew: false, payment_token: "tok" }, as: Anonymous, captures: { mid: $.data.id } }
            - { call: "POST /orders", payload: { gallery_id: "${gid}", member_id: "${mid}" }, as: Member, as_user_id: "${mid}", captures: { omid: $.data.id } }
            - { call: "POST /orders/${omid}/lines", payload: { product_id: "${pid}", qty: 1 }, as: Member, as_user_id: "${mid}", captures: { lmid: $.data.id } }
            - { call: "POST /trade-accounts", payload: { email: "t1@x.com", business_name: "Design Co", credential_document_id: "doc1", license_number: "LIC1" }, as: Anonymous, captures: { tid: $.data.id } }
            - { call: "POST /trade-accounts/${tid}/verify", payload: { decision: "APPROVE", tier: "TIER_2" }, as: TradeReviewer }
            - { call: "POST /orders", payload: { gallery_id: "${gid}", trade_account_id: "${tid}" }, as: TradeDesigner, as_user_id: "${tid}", captures: { otid: $.data.id } }
            - { call: "POST /orders/${otid}/lines", payload: { product_id: "${pid}", qty: 1 }, as: TradeDesigner, as_user_id: "${tid}", captures: { ltid: $.data.id } }
          trigger:
            - { call: "GET /orders/${omid}", payload: {}, as: PlatformAdmin, captures: { m_due: $.data.deposit_due_cents, m_sub: $.data.subtotal_cents } }
            - { call: "GET /orders/${otid}", payload: {}, as: PlatformAdmin, captures: { t_due: $.data.deposit_due_cents, t_sub: $.data.subtotal_cents } }
          assert:
            - "Order.${omid}.subtotal_cents == 90000 (round_half_up(120000*0.75))"
            - "Order.${omid}.deposit_due_cents == 50000 (floor binds over 45000)"
            - "Order.${otid}.subtotal_cents == 72000 (round_half_up(120000*0.60), promo ignored for trade)"
            - "Order.${otid}.deposit_due_cents == 25000 (trade floor binds over 18000)"

      - name: restocking_per_line_round_then_sum
        grounds:
          - calculations.restocking_refund
          - state_machines.ReturnRequest.REQUESTED_to_SETTLED
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — pinned per-line round then sum.
          Two lines charged 1003 each: per-line round_half_up(0.15*1003)=150 each, summed 300;
          the rejected sum-then-round alternative would give round(0.15*2006)=301.
        test_recipe:
          setup:
            - "Retail guest order with two STOCK lines of product list 1003, qty 1 each; confirmed and delivered 2026-09-05"
          setup_api_calls:
            - { call: "POST /galleries", payload: { name: "Gallery D", region: "WEST", daily_route_minutes_capacity: 480 }, as: PlatformAdmin, captures: { gid: $.data.id } }
            - { call: "POST /products", payload: { sku: "LAMP-01", name: "Lamp", list_price_cents: 1003, line_kind: "STOCK" }, as: PlatformAdmin, captures: { pid: $.data.id } }
            - { call: "POST /orders", payload: { gallery_id: "${gid}" }, as: GalleryAssociate, captures: { oid: $.data.id } }
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", qty: 1 }, as: GalleryAssociate, captures: { l1: $.data.id } }
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", qty: 1 }, as: GalleryAssociate, captures: { l2: $.data.id } }
            - { call: "POST /orders/${oid}/confirm", payload: {}, as: GalleryAssociate }
            - { call: "POST /delivery-appointments", payload: { order_id: "${oid}", gallery_id: "${gid}", delivery_date: "2026-09-05", duration_minutes: 30, room_placement: false, assembly_required: false }, as: GalleryAssociate, captures: { aid: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T08:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /_ops/run_daily_cycle", payload: {}, as: PlatformAdmin }
            - { call: "POST /delivery-appointments/${aid}/record-outcome", payload: { outcome: "COMPLETED", packaging_removed: true }, as: HubOperator }
          trigger:
            - { call: "POST /returns", payload: { order_id: "${oid}", order_line_ids: ["${l1}", "${l2}"] }, as: GalleryAssociate, captures: { rid: $.data.id } }
            - { call: "POST /returns/${rid}/settle", payload: { decision: "APPROVE" }, as: GalleryAssociate, captures: { fee: $.data.restocking_fee_cents, refund: $.data.refund_cents } }
          assert:
            - "ReturnRequest.${rid}.restocking_fee_cents == 300 (150 per line, per-line rounding then sum)"
            - "ReturnRequest.${rid}.refund_cents == 1706 (2006 - 300)"

      - name: evaluation_order_fee_waiver_subtotal_then_fee
        grounds:
          - calculations.order_total
          - entities.Order.fields.white_glove_fee_cents
        distinguishing_aspect: |
          Mode (c): circular-looking dependency (fee waived by subtotal, total = subtotal + fee)
          pinned to evaluation order: per-line discount -> subtotal -> waiver check -> fee -> total.
          Member order qty 3 of list 400000: subtotal 900000 < 1000000 -> fee 19900 -> 919900;
          amending to qty 4: subtotal 1200000 >= 1000000 -> fee 0 -> 1200000.
        test_recipe:
          setup:
            - "Member order with one STOCK line, product list 400000, qty 3 (QUOTE)"
          setup_api_calls:
            - { call: "POST /galleries", payload: { name: "Gallery E", region: "WEST", daily_route_minutes_capacity: 480 }, as: PlatformAdmin, captures: { gid: $.data.id } }
            - { call: "POST /members", payload: { email: "m3@x.com", full_name: "M Three", auto_renew: false, payment_token: "tok" }, as: Anonymous, captures: { mid: $.data.id } }
            - { call: "POST /products", payload: { sku: "TBL-01", name: "Table", list_price_cents: 400000, line_kind: "STOCK" }, as: PlatformAdmin, captures: { pid: $.data.id } }
            - { call: "POST /orders", payload: { gallery_id: "${gid}", member_id: "${mid}" }, as: Member, as_user_id: "${mid}", captures: { oid: $.data.id } }
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", qty: 3 }, as: Member, as_user_id: "${mid}", captures: { lid: $.data.id } }
            - { call: "GET /orders/${oid}", payload: {}, as: PlatformAdmin, captures: { total_a: $.data.total_cents, fee_a: $.data.white_glove_fee_cents, quote_a: $.data.quote_total_cents } }
          trigger:
            - { call: "DELETE /orders/${oid}/lines/${lid}", payload: {}, as: Member, as_user_id: "${mid}" }
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", qty: 4 }, as: Member, as_user_id: "${mid}" }
            - { call: "GET /orders/${oid}", payload: {}, as: PlatformAdmin, captures: { total_b: $.data.total_cents, fee_b: $.data.white_glove_fee_cents } }
          assert:
            - "First read: total_cents == 919900 and white_glove_fee_cents == 19900 (subtotal 900000 below threshold)"
            - "First read: quote_total_cents == 919900 (frozen at first line addition)"
            - "After amendment: subtotal 1200000 >= 1000000 so white_glove_fee_cents == 0 and total_cents == 1200000"

  - rule_id: non_linear_state_machine
    instances:
      - name: member_grace_renewal_cycle
        grounds:
          - state_machines.Member.ACTIVE_to_GRACE
          - state_machines.Member.GRACE_to_ACTIVE
        distinguishing_aspect: |
          Member machine is cyclic: ACTIVE -> GRACE (ops-run, auto_renew false) -> ACTIVE
          (member renewal) loops back to the origin state with a new period; a purely linear
          machine could not express the renewal loop.
        test_recipe:
          setup:
            - "Member enrolled at default clock 2026-09-01 with auto_renew false (period ends 2027-09-01); clock advanced to 2027-09-02"
          setup_api_calls:
            - { call: "POST /members", payload: { email: "m4@x.com", full_name: "M Four", auto_renew: false, payment_token: "tok" }, as: Anonymous, captures: { mid: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-09-02T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /_ops/run_daily_cycle", payload: {}, as: PlatformAdmin }
            - { call: "GET /members/${mid}", payload: {}, as: PlatformAdmin, captures: { st1: $.data.status, ge1: $.data.grace_end } }
          trigger:
            - { call: "POST /members/${mid}/renew", payload: { payment_token: "tok2" }, as: Member, as_user_id: "${mid}", captures: { st2: $.data.status, ps2: $.data.current_period_start, fee2: $.data.fee_paid_total_cents } }
          assert:
            - "After cycle: Member.${mid}.status == GRACE and grace_end == 2027-10-01T00:00:00Z"
            - "After renew: Member.${mid}.status == ACTIVE (cycle closed), current_period_start == 2027-09-02T00:00:00Z, fee_paid_total_cents == 35000"

      - name: production_slot_commit_release_recommit_cycle
        grounds:
          - state_machines.ProductionSlot.OPEN_to_COMMITTED
          - state_machines.ProductionSlot.COMMITTED_to_OPEN
        distinguishing_aspect: |
          ProductionSlot machine is cyclic (OPEN -> COMMITTED -> OPEN -> COMMITTED): removing a
          custom line from a CONFIRMED order releases the slot, and a different line can be
          committed into the same slot afterwards. Different entity than the Member cycle.
        test_recipe:
          setup:
            - "Member order with two CUSTOM lines of product list 120000 (deposit 50000 each, due 100000); confirmed with exact deposit -> CONFIRMED, both lines DEPOSIT_PAID"
            - "Slot 2026-09-10T09:00-12:00Z (180 min) on the order's gallery; line 1 committed into the slot"
          setup_api_calls:
            - { call: "POST /galleries", payload: { name: "Gallery F", region: "WEST", daily_route_minutes_capacity: 480 }, as: PlatformAdmin, captures: { gid: $.data.id } }
            - { call: "POST /members", payload: { email: "m5@x.com", full_name: "M Five", auto_renew: false, payment_token: "tok" }, as: Anonymous, captures: { mid: $.data.id } }
            - { call: "POST /products", payload: { sku: "CUS-02", name: "Custom Bed", list_price_cents: 120000, line_kind: "CUSTOM" }, as: PlatformAdmin, captures: { pid: $.data.id } }
            - { call: "POST /orders", payload: { gallery_id: "${gid}", member_id: "${mid}" }, as: Member, as_user_id: "${mid}", captures: { oid: $.data.id } }
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", qty: 1 }, as: Member, as_user_id: "${mid}", captures: { l1: $.data.id } }
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", qty: 1 }, as: Member, as_user_id: "${mid}", captures: { l2: $.data.id } }
            - { call: "POST /orders/${oid}/confirm", payload: { deposit_payment_cents: 100000 }, as: Member, as_user_id: "${mid}" }
            - { call: "POST /production-slots", payload: { gallery_id: "${gid}", starts_at: "2026-09-10T09:00:00Z", ends_at: "2026-09-10T12:00:00Z" }, as: ProductionPlanner, captures: { sid: $.data.id } }
            - { call: "POST /orders/${oid}/lines/${l1}/schedule-production", payload: { production_slot_id: "${sid}" }, as: ProductionPlanner }
            - { call: "GET /orders/${oid}", payload: {}, as: PlatformAdmin, captures: { ovar: $.data.version } }
            - { call: "GET /galleries/${gid}", payload: {}, as: PlatformAdmin, captures: { res1: $.data.reserved_production_minutes } }
          trigger:
            - { call: "DELETE /orders/${oid}/lines/${l1}", payload: { expected_order_version: "${ovar}" }, as: Member, as_user_id: "${mid}" }
            - { call: "GET /production-slots/${sid}", payload: {}, as: ProductionPlanner, captures: { st_mid: $.data.status } }
            - { call: "POST /orders/${oid}/lines/${l2}/schedule-production", payload: { production_slot_id: "${sid}" }, as: ProductionPlanner, captures: { st_end: $.data.status } }
          assert:
            - "Before removal: Gallery.reserved_production_minutes == 180 and slot COMMITTED"
            - "After line-1 removal: slot ${sid} status == OPEN (cycle back to origin), line ${l1} production_status == RELEASED, deposit forfeited"
            - "After line-2 schedule: slot ${sid} status == COMMITTED again (second loop iteration)"

  - rule_id: transitive_cascade
    instances:
      - name: member_lapse_consultation_order_cascade
        grounds:
          - state_machines.Member.GRACE_to_LAPSED
          - state_machines.DesignConsultation.SCHEDULED_to_CANCELLED
          - calculations.order_line_pricing
        distinguishing_aspect: |
          Depth-3 chain from the GRACE->LAPSED trigger: member lapse mutates each SCHEDULED
          consultation to CANCELLED (hop 2); each cancellation itself re-prices the attached
          QUOTE order to RETAIL (hop 3). The order mutation is caused by the consultation
          cancellation, not directly by the lapse.
        test_recipe:
          setup:
            - "Member (auto_renew false) with a QUOTE order holding one STOCK line list 100000 (member quote total 94900 = 75000 + 19900)"
            - "A SCHEDULED design consultation attached to that order; clock advanced past grace_end to 2027-10-02"
          setup_api_calls:
            - { call: "POST /galleries", payload: { name: "Gallery G", region: "WEST", daily_route_minutes_capacity: 480 }, as: PlatformAdmin, captures: { gid: $.data.id } }
            - { call: "POST /members", payload: { email: "m6@x.com", full_name: "M Six", auto_renew: false, payment_token: "tok" }, as: Anonymous, captures: { mid: $.data.id } }
            - { call: "POST /products", payload: { sku: "DESK-01", name: "Desk", list_price_cents: 100000, line_kind: "STOCK" }, as: PlatformAdmin, captures: { pid: $.data.id } }
            - { call: "POST /orders", payload: { gallery_id: "${gid}", member_id: "${mid}" }, as: Member, as_user_id: "${mid}", captures: { oid: $.data.id } }
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", qty: 1 }, as: Member, as_user_id: "${mid}" }
            - { call: "POST /design-consultations", payload: { member_id: "${mid}", order_id: "${oid}", scheduled_at: "2026-09-03T10:00:00Z" }, as: Member, as_user_id: "${mid}", captures: { cid: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-10-02T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /_ops/run_daily_cycle", payload: {}, as: PlatformAdmin }
            - { call: "GET /members/${mid}", payload: {}, as: PlatformAdmin, captures: { mst: $.data.status } }
            - { call: "GET /design-consultations/${cid}", payload: {}, as: PlatformAdmin, captures: { cst: $.data.status } }
            - { call: "GET /orders/${oid}", payload: {}, as: PlatformAdmin, captures: { tier2: $.data.pricing_tier, total2: $.data.total_cents } }
          assert:
            - "Member.${mid}.status == LAPSED"
            - "DesignConsultation.${cid}.status == CANCELLED (hop 2)"
            - "Order.${oid}.pricing_tier == RETAIL and total_cents == 119900 (hop 3 re-price: 100000 + 19900; member quote was 94900)"

      - name: sourcebook_release_promo_repricing_cascade
        grounds:
          - state_machines.SourceBook.IN_PRINT_to_RELEASED
          - entities.Product.fields.promo_active
          - calculations.order_line_pricing
        distinguishing_aspect: |
          Depth-3 chain from a different trigger (ops-run source book release): release mutates
          each listed Product's promo_active to true (hop 2); each promo flip itself re-prices
          every QUOTE order containing the product (hop 3). Different originating transition
          than the member-lapse cascade.
        test_recipe:
          setup:
            - "Retail guest QUOTE order with one line of product list 200000 (quote total 219900)"
            - "SourceBook covering the product IN_PRINT with print_ready_date 2026-09-01; clock at 2026-09-22 (print lead 21d elapsed)"
          setup_api_calls:
            - { call: "POST /galleries", payload: { name: "Gallery H", region: "WEST", daily_route_minutes_capacity: 480 }, as: PlatformAdmin, captures: { gid: $.data.id } }
            - { call: "POST /products", payload: { sku: "RUG-01", name: "Rug", list_price_cents: 200000, line_kind: "STOCK" }, as: PlatformAdmin, captures: { pid: $.data.id } }
            - { call: "POST /orders", payload: { gallery_id: "${gid}" }, as: GalleryAssociate, captures: { oid: $.data.id } }
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", qty: 1 }, as: GalleryAssociate }
            - { call: "POST /source-books", payload: { title: "Winter Book", product_ids: ["${pid}"], print_ready_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { sbid: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-22T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /_ops/run_daily_cycle", payload: {}, as: PlatformAdmin }
            - { call: "GET /products/${pid}", payload: {}, as: PlatformAdmin, captures: { promo: $.data.promo_active } }
            - { call: "GET /orders/${oid}", payload: {}, as: PlatformAdmin, captures: { total2: $.data.total_cents, qtotal: $.data.quote_total_cents } }
          assert:
            - "Product.${pid}.promo_active == true (hop 2)"
            - "Order.${oid}.total_cents == 199900 (hop 3 re-price: 180000 + 19900) while quote_total_cents stays 219900"
            - "SourceBook.${sbid}.status == RELEASED (observable via release side effects)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: confirm_state_error_beats_fiscal_error
        grounds:
          - validations[priority=4]
          - validations[priority=8]
          - errors[ERR_MEMBERSHIP_NOT_ACTIVE]
          - errors[ERR_DEPOSIT_REQUIRED]
        distinguishing_aspect: |
          Pair state (p4) vs business_fiscal (p8): confirm of a custom-line order by a LAPSED
          member with no deposit_payment_cents violates both; the state error
          ERR_MEMBERSHIP_NOT_ACTIVE wins over ERR_DEPOSIT_REQUIRED.
        test_recipe:
          setup:
            - "Member (auto_renew false) with QUOTE order holding one CUSTOM line (deposit_due 50000); member lapsed via cycle at 2027-10-02"
          setup_api_calls:
            - { call: "POST /galleries", payload: { name: "Gallery I", region: "WEST", daily_route_minutes_capacity: 480 }, as: PlatformAdmin, captures: { gid: $.data.id } }
            - { call: "POST /members", payload: { email: "m7@x.com", full_name: "M Seven", auto_renew: false, payment_token: "tok" }, as: Anonymous, captures: { mid: $.data.id } }
            - { call: "POST /products", payload: { sku: "CUS-03", name: "Custom Chair", list_price_cents: 120000, line_kind: "CUSTOM" }, as: PlatformAdmin, captures: { pid: $.data.id } }
            - { call: "POST /orders", payload: { gallery_id: "${gid}", member_id: "${mid}" }, as: Member, as_user_id: "${mid}", captures: { oid: $.data.id } }
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", qty: 1 }, as: Member, as_user_id: "${mid}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-10-02T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /_ops/run_daily_cycle", payload: {}, as: PlatformAdmin }
          trigger:
            - { call: "POST /orders/${oid}/confirm", payload: {}, as: Member, as_user_id: "${mid}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_MEMBERSHIP_NOT_ACTIVE (state p4 wins over fiscal p8 ERR_DEPOSIT_REQUIRED)"
            - "Order.${oid} remains QUOTE"

      - name: add_line_referential_error_beats_temporal_error
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_PRODUCT_UNAVAILABLE]
          - errors[ERR_QUOTE_EXPIRED]
        distinguishing_aspect: |
          Pair business_referential (p5) vs business_temporal (p6): adding a DISCONTINUED
          product to a quote whose quote_expires_at has passed violates both; the referential
          error ERR_PRODUCT_UNAVAILABLE wins over ERR_QUOTE_EXPIRED. Different category pair
          than state-vs-fiscal.
        test_recipe:
          setup:
            - "Retail guest QUOTE order created at default clock (quote_expires_at 2026-09-15T00:00:00Z); product created DISCONTINUED; clock advanced to 2026-09-16"
          setup_api_calls:
            - { call: "POST /galleries", payload: { name: "Gallery J", region: "WEST", daily_route_minutes_capacity: 480 }, as: PlatformAdmin, captures: { gid: $.data.id } }
            - { call: "POST /products", payload: { sku: "OLD-01", name: "Old Lamp", list_price_cents: 5000, line_kind: "STOCK", status: "DISCONTINUED" }, as: PlatformAdmin, captures: { pid: $.data.id } }
            - { call: "POST /orders", payload: { gallery_id: "${gid}" }, as: GalleryAssociate, captures: { oid: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-16T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", qty: 1 }, as: GalleryAssociate, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PRODUCT_UNAVAILABLE (referential p5 wins over temporal p6 ERR_QUOTE_EXPIRED)"

  - rule_id: boundary_precision_check
    instances:
      - name: fee_waiver_threshold_exact_vs_below
        grounds:
          - calculations.order_total
          - errors[ERR_ORDER_EMPTY]
        distinguishing_aspect: |
          Money-threshold boundary (>= vs >): discounted subtotal of exactly 1000000 waives the
          white-glove fee; 999999 does not. Exercised through POST /orders/{id}/confirm.
        test_recipe:
          setup:
            - "Two retail guest QUOTE orders: A with one line list 1000000, B with one line list 999999"
          setup_api_calls:
            - { call: "POST /galleries", payload: { name: "Gallery K", region: "WEST", daily_route_minutes_capacity: 480 }, as: PlatformAdmin, captures: { gid: $.data.id } }
            - { call: "POST /products", payload: { sku: "BIG-01", name: "Big Sofa", list_price_cents: 1000000, line_kind: "STOCK" }, as: PlatformAdmin, captures: { pa: $.data.id } }
            - { call: "POST /products", payload: { sku: "BIG-02", name: "Almost Big", list_price_cents: 999999, line_kind: "STOCK" }, as: PlatformAdmin, captures: { pb: $.data.id } }
            - { call: "POST /orders", payload: { gallery_id: "${gid}" }, as: GalleryAssociate, captures: { oa: $.data.id } }
            - { call: "POST /orders/${oa}/lines", payload: { product_id: "${pa}", qty: 1 }, as: GalleryAssociate }
            - { call: "POST /orders", payload: { gallery_id: "${gid}" }, as: GalleryAssociate, captures: { ob: $.data.id } }
            - { call: "POST /orders/${ob}/lines", payload: { product_id: "${pb}", qty: 1 }, as: GalleryAssociate }
          trigger:
            - { call: "POST /orders/${oa}/confirm", payload: {}, as: GalleryAssociate, captures: { fee_a: $.data.white_glove_fee_cents, tot_a: $.data.total_cents } }
            - { call: "POST /orders/${ob}/confirm", payload: {}, as: GalleryAssociate, captures: { fee_b: $.data.white_glove_fee_cents, tot_b: $.data.total_cents } }
          assert:
            - "Order A (subtotal exactly 1000000): white_glove_fee_cents == 0, total_cents == 1000000 (>= is inclusive)"
            - "Order B (subtotal 999999): white_glove_fee_cents == 19900, total_cents == 1019899"

      - name: cancellation_window_day30_inclusive
        grounds:
          - calculations.membership_period_math
          - state_machines.Member.ACTIVE_to_CANCELLED_REFUNDED
          - state_machines.Member.ACTIVE_to_CANCELLED
        distinguishing_aspect: |
          Time-window boundary (day-30 inclusive) on a different metric and endpoint than the
          fee waiver: cancel at exactly period_start + 30 days refunds the fee
          (CANCELLED_REFUNDED); one second later does not (CANCELLED).
        test_recipe:
          setup:
            - "Two members A and B both enrolled at the default clock 2026-09-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /members", payload: { email: "ma@x.com", full_name: "M A", auto_renew: false, payment_token: "tok" }, as: Anonymous, captures: { ma: $.data.id } }
            - { call: "POST /members", payload: { email: "mb@x.com", full_name: "M B", auto_renew: false, payment_token: "tok" }, as: Anonymous, captures: { mb: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /members/${ma}/cancel", payload: {}, as: Member, as_user_id: "${ma}", captures: { sta: $.data.status, feea: $.data.fee_paid_total_cents } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:01Z" }, as: PlatformAdmin }
            - { call: "POST /members/${mb}/cancel", payload: {}, as: Member, as_user_id: "${mb}", captures: { stb: $.data.status, feeb: $.data.fee_paid_total_cents } }
          assert:
            - "Member A at exactly +30d: status == CANCELLED_REFUNDED and fee_paid_total_cents == 0 (17500 refunded)"
            - "Member B at +30d+1s: status == CANCELLED and fee_paid_total_cents == 17500 (no refund)"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: confirm_gated_by_member_standing
        grounds:
          - state_machines.Order.QUOTE_to_CONFIRMED
          - entities.Member.fields.status
          - errors[ERR_MEMBERSHIP_NOT_ACTIVE]
        distinguishing_aspect: |
          Order -> Member pair: an Order's QUOTE->CONFIRMED transition evaluates the linked
          Member's status; GRACE standing still passes the gate (member benefits retained
          through grace), proving the dependency reads the other entity's state.
        test_recipe:
          setup:
            - "Member (auto_renew false) moved to GRACE by cycle at 2027-09-02; member has a QUOTE order created while ACTIVE with one STOCK line list 100000"
          setup_api_calls:
            - { call: "POST /galleries", payload: { name: "Gallery L", region: "WEST", daily_route_minutes_capacity: 480 }, as: PlatformAdmin, captures: { gid: $.data.id } }
            - { call: "POST /members", payload: { email: "m8@x.com", full_name: "M Eight", auto_renew: false, payment_token: "tok" }, as: Anonymous, captures: { mid: $.data.id } }
            - { call: "POST /products", payload: { sku: "STOOL-01", name: "Stool", list_price_cents: 100000, line_kind: "STOCK" }, as: PlatformAdmin, captures: { pid: $.data.id } }
            - { call: "POST /orders", payload: { gallery_id: "${gid}", member_id: "${mid}" }, as: Member, as_user_id: "${mid}", captures: { oid: $.data.id } }
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", qty: 1 }, as: Member, as_user_id: "${mid}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-09-02T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /_ops/run_daily_cycle", payload: {}, as: PlatformAdmin }
          trigger:
            - { call: "POST /orders/${oid}/confirm", payload: {}, as: Member, as_user_id: "${mid}", captures: { st: $.data.status } }
          assert:
            - "Member.${mid}.status == GRACE at confirm time"
            - "Confirm succeeds: Order.${oid}.status == READY_FOR_DELIVERY (GRACE retains member standing)"

      - name: return_gated_by_completed_delivery
        grounds:
          - state_machines.ReturnRequest
          - entities.DeliveryAppointment.fields.status
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          ReturnRequest -> DeliveryAppointment pair (different pair than Order->Member): return
          creation requires the order to have reached DELIVERED via a COMPLETED appointment; a
          READY_FOR_DELIVERY order with no completed delivery rejects with ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Member order with one STOCK line confirmed (READY_FOR_DELIVERY); no delivery appointment completed"
          setup_api_calls:
            - { call: "POST /galleries", payload: { name: "Gallery M", region: "WEST", daily_route_minutes_capacity: 480 }, as: PlatformAdmin, captures: { gid: $.data.id } }
            - { call: "POST /members", payload: { email: "m9@x.com", full_name: "M Nine", auto_renew: false, payment_token: "tok" }, as: Anonymous, captures: { mid: $.data.id } }
            - { call: "POST /products", payload: { sku: "LAMP-02", name: "Lamp2", list_price_cents: 50000, line_kind: "STOCK" }, as: PlatformAdmin, captures: { pid: $.data.id } }
            - { call: "POST /orders", payload: { gallery_id: "${gid}", member_id: "${mid}" }, as: Member, as_user_id: "${mid}", captures: { oid: $.data.id } }
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", qty: 1 }, as: Member, as_user_id: "${mid}", captures: { lid: $.data.id } }
            - { call: "POST /orders/${oid}/confirm", payload: {}, as: Member, as_user_id: "${mid}" }
          trigger:
            - { call: "POST /returns", payload: { order_id: "${oid}", order_line_ids: ["${lid}"] }, as: Member, as_user_id: "${mid}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE (order not DELIVERED: no COMPLETED appointment exists)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: production_slot_half_open_adjacency
        grounds:
          - calculations.slot_overlap_check
          - errors[ERR_SLOT_OVERLAP]
        distinguishing_aspect: |
          ProductionSlot resource, half-open interval semantics: [09:00,12:00) then [12:00,15:00)
          is adjacent and allowed; [11:00,13:00) strictly overlaps and is rejected with
          ERR_SLOT_OVERLAP. Purely pairwise geometric overlap, no capacity aggregation.
        test_recipe:
          setup:
            - "Gallery; one OPEN slot 2026-09-10 09:00-12:00"
          setup_api_calls:
            - { call: "POST /galleries", payload: { name: "Gallery N", region: "WEST", daily_route_minutes_capacity: 480 }, as: PlatformAdmin, captures: { gid: $.data.id } }
            - { call: "POST /production-slots", payload: { gallery_id: "${gid}", starts_at: "2026-09-10T09:00:00Z", ends_at: "2026-09-10T12:00:00Z" }, as: ProductionPlanner, captures: { s1: $.data.id } }
            - { call: "POST /production-slots", payload: { gallery_id: "${gid}", starts_at: "2026-09-10T12:00:00Z", ends_at: "2026-09-10T15:00:00Z" }, as: ProductionPlanner, captures: { s2: $.data.id } }
          trigger:
            - { call: "POST /production-slots", payload: { gallery_id: "${gid}", starts_at: "2026-09-10T11:00:00Z", ends_at: "2026-09-10T13:00:00Z" }, as: ProductionPlanner, captures: { err: $.data.error_id } }
          assert:
            - "Adjacent slot ${s2} was created successfully (201, half-open: starts_at == prior ends_at does not overlap)"
            - "Overlapping slot rejected: error_id == ERR_SLOT_OVERLAP"

      - name: route_daily_aggregate_capacity_budget
        grounds:
          - calculations.route_capacity_check
          - errors[ERR_ROUTE_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          DeliveryAppointment resource with aggregate-capacity interval semantics (different
          from the slot's pairwise half-open geometry): each appointment consumes
          duration + 30 buffer from the gallery's daily 480-minute budget; the third
          appointment (230 + 230 + 130 = 590 > 480) is rejected even though its own interval
          does not pairwise-overlap anything.
        test_recipe:
          setup:
            - "Gallery with daily_route_minutes_capacity 480; three retail guest orders confirmed to READY_FOR_DELIVERY; two 200-minute appointments already booked on 2026-09-05 (230 each consumed)"
          setup_api_calls:
            - { call: "POST /galleries", payload: { name: "Gallery O", region: "WEST", daily_route_minutes_capacity: 480 }, as: PlatformAdmin, captures: { gid: $.data.id } }
            - { call: "POST /products", payload: { sku: "BOX-01", name: "Box", list_price_cents: 10000, line_kind: "STOCK" }, as: PlatformAdmin, captures: { pid: $.data.id } }
            - { call: "POST /orders", payload: { gallery_id: "${gid}" }, as: GalleryAssociate, captures: { o1: $.data.id } }
            - { call: "POST /orders/${o1}/lines", payload: { product_id: "${pid}", qty: 1 }, as: GalleryAssociate }
            - { call: "POST /orders/${o1}/confirm", payload: {}, as: GalleryAssociate }
            - { call: "POST /orders", payload: { gallery_id: "${gid}" }, as: GalleryAssociate, captures: { o2: $.data.id } }
            - { call: "POST /orders/${o2}/lines", payload: { product_id: "${pid}", qty: 1 }, as: GalleryAssociate }
            - { call: "POST /orders/${o2}/confirm", payload: {}, as: GalleryAssociate }
            - { call: "POST /orders", payload: { gallery_id: "${gid}" }, as: GalleryAssociate, captures: { o3: $.data.id } }
            - { call: "POST /orders/${o3}/lines", payload: { product_id: "${pid}", qty: 1 }, as: GalleryAssociate }
            - { call: "POST /orders/${o3}/confirm", payload: {}, as: GalleryAssociate }
            - { call: "POST /delivery-appointments", payload: { order_id: "${o1}", gallery_id: "${gid}", delivery_date: "2026-09-05", duration_minutes: 200, room_placement: true, assembly_required: true }, as: GalleryAssociate, captures: { a1: $.data.id } }
            - { call: "POST /delivery-appointments", payload: { order_id: "${o2}", gallery_id: "${gid}", delivery_date: "2026-09-05", duration_minutes: 200, room_placement: true, assembly_required: false }, as: GalleryAssociate, captures: { a2: $.data.id } }
          trigger:
            - { call: "POST /delivery-appointments", payload: { order_id: "${o3}", gallery_id: "${gid}", delivery_date: "2026-09-05", duration_minutes: 100, room_placement: false, assembly_required: false }, as: GalleryAssociate, captures: { err: $.data.error_id } }
          assert:
            - "Appointments ${a1} and ${a2} booked (230 + 230 = 460 <= 480)"
            - "Third appointment rejected: error_id == ERR_ROUTE_CAPACITY_EXCEEDED (460 + 130 = 590 > 480)"

  - rule_id: compensating_invariant
    instances:
      - name: route_minutes_restored_on_failed_delivery
        grounds:
          - state_machines.DeliveryAppointment.OUT_FOR_DELIVERY_to_FAILED
          - entities.Gallery.fields.booked_route_minutes
          - calculations.route_capacity_check
        distinguishing_aspect: |
          Conserved quantity: gallery daily booked route minutes. Booking a 200-minute
          appointment adds 230 (with buffer); recording FAILED releases exactly the same 230,
          returning booked_route_minutes for the date to its pre-booking value (empty map).
        test_recipe:
          setup:
            - "Gallery cap 480; retail guest order confirmed READY_FOR_DELIVERY; 200-minute appointment booked on 2026-09-05; clock advanced to 2026-09-05 and cycle run (OUT_FOR_DELIVERY)"
          setup_api_calls:
            - { call: "POST /galleries", payload: { name: "Gallery P", region: "WEST", daily_route_minutes_capacity: 480 }, as: PlatformAdmin, captures: { gid: $.data.id } }
            - { call: "POST /products", payload: { sku: "BOX-02", name: "Box2", list_price_cents: 10000, line_kind: "STOCK" }, as: PlatformAdmin, captures: { pid: $.data.id } }
            - { call: "POST /orders", payload: { gallery_id: "${gid}" }, as: GalleryAssociate, captures: { oid: $.data.id } }
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", qty: 1 }, as: GalleryAssociate }
            - { call: "POST /orders/${oid}/confirm", payload: {}, as: GalleryAssociate }
            - { call: "POST /delivery-appointments", payload: { order_id: "${oid}", gallery_id: "${gid}", delivery_date: "2026-09-05", duration_minutes: 200, room_placement: true, assembly_required: true }, as: GalleryAssociate, captures: { aid: $.data.id } }
            - { call: "GET /galleries/${gid}", payload: {}, as: PlatformAdmin, captures: { booked_before: $.data.booked_route_minutes } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T08:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /_ops/run_daily_cycle", payload: {}, as: PlatformAdmin }
          trigger:
            - { call: "POST /delivery-appointments/${aid}/record-outcome", payload: { outcome: "FAILED", failure_reason: "customer unavailable" }, as: HubOperator }
            - { call: "GET /galleries/${gid}", payload: {}, as: PlatformAdmin, captures: { booked_after: $.data.booked_route_minutes } }
          assert:
            - "Before failure: Gallery.booked_route_minutes == {\"2026-09-05\": 230}"
            - "After FAILED: Gallery.booked_route_minutes == {} (forward booking + compensating release conserve the quantity)"

      - name: production_minutes_restored_on_line_removal
        grounds:
          - state_machines.ProductionSlot.COMMITTED_to_OPEN
          - entities.Gallery.fields.reserved_production_minutes
          - state_machines.Order.CONFIRMED_to_CONFIRMED
        distinguishing_aspect: |
          Conserved quantity: gallery reserved production minutes (different quantity than
          route minutes). Committing a 180-minute slot reserves 180; removing the committed
          custom line from the CONFIRMED order releases the slot and returns
          reserved_production_minutes to 0 with the slot back to OPEN.
        test_recipe:
          setup:
            - "Member order with one CUSTOM line (deposit 50000) confirmed with exact deposit; slot 2026-09-10 09:00-12:00 (180 min) committed to the line"
          setup_api_calls:
            - { call: "POST /galleries", payload: { name: "Gallery Q", region: "WEST", daily_route_minutes_capacity: 480 }, as: PlatformAdmin, captures: { gid: $.data.id } }
            - { call: "POST /members", payload: { email: "m10@x.com", full_name: "M Ten", auto_renew: false, payment_token: "tok" }, as: Anonymous, captures: { mid: $.data.id } }
            - { call: "POST /products", payload: { sku: "CUS-04", name: "Custom Ottoman", list_price_cents: 120000, line_kind: "CUSTOM" }, as: PlatformAdmin, captures: { pid: $.data.id } }
            - { call: "POST /orders", payload: { gallery_id: "${gid}", member_id: "${mid}" }, as: Member, as_user_id: "${mid}", captures: { oid: $.data.id } }
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", qty: 1 }, as: Member, as_user_id: "${mid}", captures: { lid: $.data.id } }
            - { call: "POST /orders/${oid}/confirm", payload: { deposit_payment_cents: 50000 }, as: Member, as_user_id: "${mid}" }
            - { call: "POST /production-slots", payload: { gallery_id: "${gid}", starts_at: "2026-09-10T09:00:00Z", ends_at: "2026-09-10T12:00:00Z" }, as: ProductionPlanner, captures: { sid: $.data.id } }
            - { call: "POST /orders/${oid}/lines/${lid}/schedule-production", payload: { production_slot_id: "${sid}" }, as: ProductionPlanner }
            - { call: "GET /galleries/${gid}", payload: {}, as: PlatformAdmin, captures: { res_before: $.data.reserved_production_minutes } }
            - { call: "GET /orders/${oid}", payload: {}, as: PlatformAdmin, captures: { ovar: $.data.version } }
          trigger:
            - { call: "DELETE /orders/${oid}/lines/${lid}", payload: { expected_order_version: "${ovar}" }, as: Member, as_user_id: "${mid}" }
            - { call: "GET /galleries/${gid}", payload: {}, as: PlatformAdmin, captures: { res_after: $.data.reserved_production_minutes } }
            - { call: "GET /production-slots/${sid}", payload: {}, as: ProductionPlanner, captures: { slot_after: $.data.status } }
          assert:
            - "Before removal: Gallery.reserved_production_minutes == 180"
            - "After removal: Gallery.reserved_production_minutes == 0 (compensating release conserves the quantity)"
            - "ProductionSlot.${sid}.status == OPEN and committed_order_line_id == null"
