              as: IrbAdmin
              captures: { rev_h: $.data.id }
            - call: "POST /irb/protocols"
              payload: { title: "Cascade Study", claimed_review_level: "EXPEDITED", risk_level: "MINIMAL" }
              as: PrincipalInvestigator
