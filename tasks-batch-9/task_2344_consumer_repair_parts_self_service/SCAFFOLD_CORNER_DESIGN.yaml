              payload: {}
              as: ProgramAdmin
              captures: { part_version_before: $.data.version }
          trigger:
            - call: "GET /repair-program/part-catalog-items/${part_id}/demand-forecast"
              payload: { model_id: "${model_id}", horizon_months: 12 }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { variant: $.data.variant, trailing: $.data.trailing_units, pipeline: $.data.pipeline_units, band: $.data.obsolescence_band, mult: $.data.band_multiplier, projected: $.data.projected_units, pct: $.data.safety_stock_pct, buffer: $.data.mandated_buffer_units, recommended: $.data.recommended_stock_units }
            - call: "GET /repair-program/part-catalog-items/${part_id}/demand-forecast"
              payload: { model_id: "${model_id}", horizon_months: 12 }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { recommended_again: $.data.recommended_stock_units, projected_again: $.data.projected_units }
            - call: "GET /repair-program/part-catalog-items/${part_id}"
              payload: {}
              as: ProgramAdmin
              captures: { part_version_after: $.data.version }
            - call: "GET /repair-program/part-catalog-items/${part_id}/demand-forecast"
              payload: { model_id: "${model_id}" }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { e1: $.data.error_id }
          assert:
            - "${ob_status} == OPEN and ${parts_until} == 2026-11-01T23:59:59.999Z; ${order_state} == CLOSED"
            - "${variant} == TRAILING_ONLY, ${trailing} == 4 and ${pipeline} == 0"
            - "${band} == LONG_TAIL and ${mult} == 1.80 — 81 whole months since 2019-11-01 exceeds 60"
            - "${projected} == 14.40 — (4 / 6) * 12 * 1.80"
            - "${pct} == 0.30 because the unrounded 14.4 is below 50"
            - "${buffer} == 1 — ceil((4 / 6) * 2 months remaining * 0.25) = ceil(0.3333)"
            - "${recommended} == 20 — ceil(14.4 * 1.30) = 19 plus the 1 mandated buffer unit"
            - "${projected_again} == ${projected} and ${recommended_again} == ${recommended}"
            - "${part_version_after} == ${part_version_before} — the computed read persisted nothing"
            - "${e1} == ERR_INVALID_REQUEST with HTTP 400 — horizon_months is a required query parameter"

      - name: deliver_closes_a_plain_order_outright_but_holds_a_service_bearing_order_open
