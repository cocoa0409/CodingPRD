  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_fiscal_priority_conflict_check_in_no_show
        grounds:
          - validations[priority=5]
          - validations[priority=16]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_INSUFFICIENT_CREDITS]
        distinguishing_aspect: |
          State (priority 5, ERR_INVALID_STATE) vs business_fiscal (priority 16,
          ERR_INSUFFICIENT_CREDITS). Setup a Reservation that is already NO_SHOW (state
          terminal) AND whose DiningPlan would also fail the credit check if it were
          re-evaluated. POST /reservations/{id}/confirm fails BOTH: state wins per
          priority order → ERR_INVALID_STATE (not ERR_INSUFFICIENT_CREDITS).
