            - "d2_status == LEGAL_REVIEW with d2_by == ANALYST-1; d3_status == PUBLISHED with d3_by == LEGAL-1 and d3_at == 2026-08-01T00:00:00Z"

      - name: illegal_triggers_on_the_three_enrollment_dimensions
        claim_type: Invalid Transitions
        grounds: ["state_machines.EnrollmentApplication.transitions", "validations[priority=18]", "validations[priority=20]", "validations[priority=22]", "validations[priority=23]", "validations[priority=26]"]
        distinguishing_aspect: "Each enrollment dimension refuses triggers that belong to another dimension's current position, with its own error rather than a generic one."
        test_recipe:
          setup:
            - "Mini fixture. Application R has accepted the agreement, passed identity and paid its kit, so its rollup status is READY_FOR_APPROVAL."
            - "Application P was created with an identity_document_reference (identity_status PENDING_REVIEW, attempt 1)."
