  - rule_id: non_linear_state_machine
    instances:
      - name: exclusion_term_counter_cycle_to_impasse
        grounds:
          - state_machines.ExclusionTerm.PROPOSED_to_COUNTERED
          - state_machines.ExclusionTerm.COUNTERED_to_PROPOSED
          - state_machines.ExclusionTerm.COUNTERED_to_IMPASSE
          - entities.ExclusionTerm.fields.round_count
          - entities.ExclusionTerm.fields.last_actor_role
          - validations[priority=42]
          - validations[priority=43]
          - validations[priority=56]
        distinguishing_aspect: |
          The ExclusionTerm machine is cyclic, not monotone: PROPOSED -> COUNTERED -> PROPOSED
          revisits an already-occupied state, and the single trigger POST .../counter resolves to
          three different targets depending on round_count (COUNTERED, back to PROPOSED, then the
          terminal IMPASSE at MAX_NEGOTIATION_ROUNDS 4). The loop is closed by a counter rather than
          by a distinct trigger, alternating actors are mandatory on every hop, and the terminal
          IMPASSE poisons the parent quote so that binding fails afterwards.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "An ELEVATED Vantiq Bio Inc submission scored INDICATIVE with an OFFERED quote (10,000,000 limit, 250,000 retention, 5,000,000 Side C sublimit, gross premium 236,468.57)."
            - "The auto-created mandatory CONDUCT ExclusionTerm has been AGREED by the RiskManager, so ERR_MANDATORY_EXCLUSION_MISSING can no longer mask the later accept failure."
            - "A second ExclusionTerm of type PRIOR_ACTS is open in PROPOSED with round_count 1 and last_actor_role Underwriter."
          setup_api_calls:
            - call: "POST /dno/insureds"
              payload: { legal_name: "Vantiq Bio Inc", sector_code: "BIOTECH", exchange_listing: "LISTED", market_cap_usd: 1800000000, fiscal_year_end: "12-31", entity_capacity_cap_usd: 25000000 }
