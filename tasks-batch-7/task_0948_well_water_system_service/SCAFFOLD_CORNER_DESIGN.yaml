        claim_type: Violation to Error
        grounds: ["validations[priority=69]", "errors[ERR_SALT_DELIVERY_EXCEEDS_CAPACITY]", "errors[ERR_VALIDATION]", "calculations.salt_next_due_date", "concurrency_rules[salt-delivery-stale-plan]"]
        distinguishing_aspect: |
          A delivery landing EXACTLY on SALT_TANK_CAPACITY_LBS 300.0 is allowed, so an
          empty tank accepts 300.0 lbs and salt_remaining_lbs becomes 300.0; any
          further 40.0 lb delivery would reach 340.0 and is refused 422
          ERR_SALT_DELIVERY_EXCEEDS_CAPACITY; and a 39.9 lb delivery is refused 400
          ERR_VALIDATION at G8 for falling under SALT_DELIVERY_MIN_LBS 40.0 even though
          it would ALSO breach capacity - G8 outranks G9. With monthly_salt_lbs still
          0.0 (no softener accepted) salt_next_due_date stays null. An implementation
          that treats the capacity bound as exclusive rejects the first delivery.
        test_recipe:
          setup:
            - "One account, property and well, and one ACTIVE MaintenancePlan with salt_remaining_lbs 0.0, monthly_salt_lbs 0.0 and last_salt_delivery_date null."
            - "Logical clock at 2026-06-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /water-service/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /water-service/accounts"
