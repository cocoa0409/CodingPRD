  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: consumer_volume_limit_exact_equality_clears_then_one_bottle_breaches
        grounds:
          - validations.priority_80.ERR_CONSUMER_VOLUME_LIMIT_EXCEEDED
          - calculations.consumer_rolling_volume_liters
          - entities.StateRule.fields.per_consumer_limit_liters
          - state_machines.Order.DRAFT_to_CLEARED
          - state_machines.Order.DRAFT_to_OVERRIDE_PENDING
          - calculations.order_charge_evaluation_chain.constants.FEE_WAIVER_THRESHOLD_CENTS
        distinguishing_aspect: |
          The per-consumer headroom check is exercised at exactly the limit and at the smallest possible
          step past it: 22.500 + 4.500 == 27.000 must CLEAR (equality clears), and adding one further 750 ml
          bottle takes the running total to 27.750 and must park the order in OVERRIDE_PENDING. Liters are
          compared at 3-decimal precision, so a rounding of the running total to 2 decimals or a strict
          less-than comparison both break exactly one of the two arms.
        test_recipe:
          setup:
            - "Winery Estate 1 holds an ACTIVE TX permit and an APPROVED GSO enrollment; Consumer Ada is ID-verified. Clock 2026-08-01."
            - "The TX per_consumer_limit_liters is 27.000 over a ROLLING_12_MONTHS window."
            - "A MANUAL_ADJUSTMENT of 22.500 L dated 2026-07-15 already sits in the window, leaving exactly 4.500 L of headroom."
            - "Order A (6 x 750 ml @ 4200 c) is exactly 4.500 L and was screened: it lands precisely on the limit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dtc/wineries"
              payload: { name: "Estate 1", ttb_permit_number: "TTB-1001", home_state_code: "CA", annual_production_gallons: 120000 }
