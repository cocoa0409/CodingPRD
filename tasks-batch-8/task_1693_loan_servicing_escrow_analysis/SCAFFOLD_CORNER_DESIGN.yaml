  - section: validations
    instances:
      - name: duplicate_active_case_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=16]", "errors[ERR_DUPLICATE_ACTIVE_CASE]"]
        distinguishing_aspect: "Second non-terminal case with same loan+error_type rejected; a different error_type on the same loan is allowed."
        test_recipe:
          setup: ["Loan LN-VAL-1 ACTIVE (escrow_required false); case ANALYSIS_ERROR already RECEIVED"]
          setup_api_calls:
            - { call: "POST /servicing/loans", payload: { loan_number: "LN-VAL-1", borrower_name: "Dup Case", principal_balance_cents: 22000000, monthly_pi_cents: 140000, closing_date: "2026-07-01", escrow_required: false }, as: ComplianceOfficer, as_user_id: "co_1", captures: { loan_id: $.data.id } }
            - { call: "POST /servicing/loans/${loan_id}/activate", payload: {}, as: ComplianceOfficer, as_user_id: "co_1" }
            - { call: "POST /servicing/loans/${loan_id}/error-cases", payload: { error_type: "ANALYSIS_ERROR", description: "first" }, as: Borrower, as_user_id: "${loan_id}", captures: { case_id: $.data.id } }
          trigger:
            - { call: "POST /servicing/loans/${loan_id}/error-cases", payload: { error_type: "ANALYSIS_ERROR", description: "duplicate" }, as: Borrower, as_user_id: "${loan_id}", captures: { err: $.data.error_id } }
            - { call: "POST /servicing/loans/${loan_id}/error-cases", payload: { error_type: "UNTIMELY_DISBURSEMENT", description: "different type ok" }, as: Borrower, as_user_id: "${loan_id}", captures: { case2_id: $.data.id } }
          assert:
            - "err == ERR_DUPLICATE_ACTIVE_CASE"
            - "ErrorResolutionCase.${case2_id}.status == RECEIVED (different error_type allowed)"

