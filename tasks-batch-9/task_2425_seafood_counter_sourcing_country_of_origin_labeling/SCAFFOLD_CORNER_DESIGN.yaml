              payload: {}
              as: MerchandisingLead
              as_user_id: "merch-lead-1"
              captures: { published_statement: $.data.cool_statement, published_status: $.data.status }
            - call: "POST /seafood-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:00:00Z" }
              as: ChainAdmin
            - call: "POST /seafood-ops/ad-items/${item_one}/close"
              payload: {}
              as: MerchandisingLead
              as_user_id: "merch-lead-1"
            - call: "POST /seafood-ops/ad-items"
              payload: { counter_id: "${counter_id}", lot_id: "${lot_id}", headline: "Cod Special Continues", ad_start_at: "2026-08-01T12:00:00Z", ad_end_at: "2026-08-01T16:00:00Z" }
              as: MerchandisingLead
