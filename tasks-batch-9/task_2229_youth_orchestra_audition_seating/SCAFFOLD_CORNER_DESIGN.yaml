      - name: placement_write_gated_by_the_target_ensembles_own_state
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=41]
          - errors[ERR_ENSEMBLE_NOT_ACCEPTING_PLACEMENTS]
          - state_machines.Ensemble.transitions
        distinguishing_aspect: |
          The write is on Placement but the gate reads two OTHER entities: priority 41
          demands Season.status == PLACEMENT and Ensemble.roster_state == FORMING. Ada's
          acceptance filled the section to its target, which bubbled the ensemble to SEATED
          and the season on to IN_SEASON, so Ben's offer is refused with
          ERR_ENSEMBLE_NOT_ACCEPTING_PLACEMENTS - even though his own audition is
          ADJUDICATED, his tier is admissible, and the section aggregate (filled 1 + offered
          0 < max 2) would still allow one more offer.
        test_recipe:
          setup:
            - "Season that has reached IN_SEASON through the acceptance cascade."
            - "The PHILHARMONIC ensemble (min_total_size 1) has a VIOLIN quota min 1 / target 1"
            - "/ max 2; Ada Strings accepted her offer, so filled_count is 1, balance_state is"
            - "FULL and roster_state is SEATED."
            - "Ben Bow's audition is ADJUDICATED at 81.80 with tier_recommendation PHILHARMONIC"
            - "and he holds no placement. The live Ensemble.version is in ${ens_v9}."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
