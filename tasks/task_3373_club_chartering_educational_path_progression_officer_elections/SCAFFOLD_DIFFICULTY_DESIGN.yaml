          setup:
            - "Club Riverside Voices is ORGANIZING at cycle 0 with club_dues_cents 3000"
            - "Ada is enrolled, pays cycle 0 and holds a DYNAMIC_LEADERSHIP path plus an entry in the club's INTERNATIONAL_SPEECH contest"
            - "One close-cycle has already rolled the club to cycle 1 and issued Ada a cycle-1 invoice"
