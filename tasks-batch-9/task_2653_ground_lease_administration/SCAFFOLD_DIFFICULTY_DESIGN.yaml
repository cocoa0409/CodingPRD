      - name: sublease_overlap_is_keyed_by_unit_while_the_area_cap_is_keyed_by_lease
        grounds:
          - validations.priority_10_interval_overlap
          - validations.priority_14_sublet_area
          - errors.ERR_SUBLET_AREA_EXCEEDED
          - calculations.transfer_fee
          - calculations.sublease_inclusion_base
          - state_machines.TransferRequest.SUBMITTED_to_CONSENT_GRANTED
        distinguishing_aspect: |
          Two conservation rules with different keys apply to the same population. The interval rule is
          per premises_unit_code, so a sublease that fully time-overlaps an ACTIVE one is refused on
          UNIT-A but accepted on UNIT-B; the area rule is per lease, so a term that only touches on
          UNIT-A - passing the interval rule - is still refused because 150000 + 60000 exceeds the 200000
          envelope, while 150000 + 50000 lands exactly on the cap and is allowed. An implementation that
          keys either rule the other way, or treats the cap as exclusive, gets a different verdict on
          three of these four calls.
