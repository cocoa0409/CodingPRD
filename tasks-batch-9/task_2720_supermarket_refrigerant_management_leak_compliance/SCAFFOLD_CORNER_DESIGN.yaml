          assert:
            - "the first three calls return HTTP 403 with error_id ERR_STORE_SCOPE_VIOLATION and success == false"
            - "the system read is refused because RefrigerantSystem.${sysB_id}.store_id is ${storeB_id}, i.e. scope follows the owning store of the target resource, not the URL collection"
            - "none of the three returns 404 - the resources exist and the scope rule at priority 7 fires before any not-found check at priorities 4 and 5"
            - "Inspection.${inspB_id}.status is still OPEN with responded_at null after the refused response"
            - "the fourth call returns HTTP 200 for ${storeA_id}, and the same read as ComplianceManager returns 200 for ${storeB_id} - only StoreManager is scoped"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: service_record_with_a_stale_system_version_is_refused_with_precondition_failed
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.service-record-create-stale-system
          - errors.ERR_STALE_SYSTEM_VERSION
          - validations[priority=8]
        distinguishing_aspect: "The §1.2.1 rule for POST /service-records: the very act of filing a record bumps RefrigerantSystem.version, so a client that reads once and writes twice is refused on the second write with 412 - and the refusal must be on the version token alone, since the second body would otherwise be accepted and would push the rolling leak rate to exactly 20.0 percent and open a LeakEvent."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, one 100 lb system charged to 80.0 (version 1), one UNIVERSAL technician, one HIGH-certified machine, one cylinder holding 40.0 lb. The version is read ONCE, then a first record consumes it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Northgate Market", store_code: "NG-001", state_code: "CA", region: "WEST" }
              as: ComplianceManager
              captures: { store_id: $.data.id }
            - call: "POST /refrigerant-types"
              payload: { name: "R-404A", gwp: 3922, pressure_class: "HIGH", ods_class: "HFC", phasedown_status: "RESTRICTED_NEW_EQUIPMENT" }
              as: ComplianceManager
              captures: { rt404_id: $.data.id }
            - call: "POST /systems"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", system_category: "COMMERCIAL_REFRIGERATION", full_charge_lbs: 100.0, initial_charge_lbs: 80.0, installed_on: "2025-01-15T00:00:00Z", leak_rate_method: "ROLLING_AVERAGE" }
              as: ComplianceManager
              captures: { sys1_id: $.data.id, sys_v_at_create: $.data.version }
            - call: "POST /technicians"
              payload: { full_name: "Marek Olsen", epa_certification_number: "EPA-608-22222", certification_type: "UNIVERSAL", certification_expires_on: "2027-12-31T00:00:00Z" }
              as: ComplianceManager
              captures: { tech2_id: $.data.id }
            - call: "POST /recovery-equipment"
              payload: { store_id: "${store_id}", assigned_technician_id: "${tech2_id}", equipment_serial: "RM-9001", certified_to_standard: "AHRI_740_2016", certified_for_pressure_class: "HIGH", last_verification_on: "2026-06-01T00:00:00Z" }
              as: ComplianceManager
              captures: { eq1_id: $.data.id }
            - call: "POST /cylinders"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", cylinder_serial: "CYL-0001", nominal_capacity_lbs: 50.0, initial_contents_lbs: 40.0 }
              as: ComplianceManager
              captures: { cyl1_id: $.data.id }
            - call: "GET /systems/${sys1_id}"
              payload: {}
              as: ComplianceManager
              captures: { sys1_v: $.data.version }
            - call: "POST /service-records"
              payload: { system_id: "${sys1_id}", technician_id: "${tech2_id}", recovery_equipment_id: "${eq1_id}", cylinder_id: "${cyl1_id}", service_type: "ADD_REFRIGERANT", refrigerant_added_lbs: 10.0, performed_at: "2026-08-01T00:00:00Z", duration_minutes: 30, expected_system_version: "${sys1_v}" }
              as: Technician
              as_user_id: "${tech2_id}"
              captures: { rec1_id: $.data.id }
            - call: "GET /systems/${sys1_id}"
              payload: {}
              as: ComplianceManager
              captures: { sys1_v2: $.data.version, rate_after_first: $.data.leak_rate_pct }
          trigger:
            - call: "POST /service-records"
              payload: { system_id: "${sys1_id}", technician_id: "${tech2_id}", recovery_equipment_id: "${eq1_id}", cylinder_id: "${cyl1_id}", service_type: "ADD_REFRIGERANT", refrigerant_added_lbs: 10.0, performed_at: "2026-08-01T04:00:00Z", duration_minutes: 30, expected_system_version: "${sys1_v}" }
              as: Technician
              as_user_id: "${tech2_id}"
              captures: { e_stale: $.data.error_id }
            - call: "POST /service-records"
              payload: { system_id: "${sys1_id}", technician_id: "${tech2_id}", recovery_equipment_id: "${eq1_id}", cylinder_id: "${cyl1_id}", service_type: "ADD_REFRIGERANT", refrigerant_added_lbs: 10.0, performed_at: "2026-08-01T04:00:00Z", duration_minutes: 30, expected_system_version: "${sys1_v2}" }
              as: Technician
              as_user_id: "${tech2_id}"
              captures: { rec2_id: $.data.id, rec2_rate_after: $.data.leak_rate_pct_after, rec2_charge_after: $.data.system_charge_after_lbs }
          assert:
            - "the system is created with version 1 and the first record leaves version 2 with current_charge_lbs 90.0 and leak_rate_pct 10.0"
            - "first trigger: HTTP 412 with error_id ERR_STALE_SYSTEM_VERSION (it carries version 1 while the system is at 2)"
            - "after the refusal nothing moved: GET /service-records?system_id=${sys1_id} still returns total_count 1, current_charge_lbs is still 90.0, version is still 2, and no LeakEvent exists"
            - "the 412 is not ERR_CHARGE_EXCEEDS_NAMEPLATE - 90.0 + 10.0 = 100.0 is exactly at nameplate and would have been accepted"
            - "second trigger: HTTP 201 with the refreshed token, version becomes 3, leak_rate_pct becomes 20.0 and a LeakEvent is opened - proving the only defect in the first attempt was the stale token"

      - name: retrofit_plan_with_a_stale_system_version_is_refused_before_it_can_supersede
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.retrofit-plan-create-supersede-stale-system
          - errors.ERR_STALE_SYSTEM_VERSION
          - validations[priority=8]
          - state_machines.RetrofitPlan.DRAFT_to_SUPERSEDED
        distinguishing_aspect: "The second §1.2.1 rule guards a destructive create: filing a plan silently supersedes any DRAFT plan on the same system, so a client holding a version token from before someone else's plan must be refused. The intervening write here is another plan create (not a service record), which is what makes the supersede hazard real rather than hypothetical."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, one 100 lb R-404A system (version 1) and an ALLOWED lower-GWP target R-448A. Two clients read version 1; the first files a DRAFT plan, which advances the system to version 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Northgate Market", store_code: "NG-001", state_code: "CA", region: "WEST" }
              as: ComplianceManager
              captures: { store_id: $.data.id }
            - call: "POST /refrigerant-types"
              payload: { name: "R-404A", gwp: 3922, pressure_class: "HIGH", ods_class: "HFC", phasedown_status: "RESTRICTED_NEW_EQUIPMENT" }
              as: ComplianceManager
              captures: { rt404_id: $.data.id }
            - call: "POST /refrigerant-types"
              payload: { name: "R-448A", gwp: 1387, pressure_class: "HIGH", ods_class: "HFO", phasedown_status: "ALLOWED" }
              as: ComplianceManager
              captures: { rt448_id: $.data.id }
            - call: "POST /systems"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", system_category: "COMMERCIAL_REFRIGERATION", full_charge_lbs: 100.0, initial_charge_lbs: 80.0, installed_on: "2025-01-15T00:00:00Z", leak_rate_method: "ROLLING_AVERAGE" }
              as: ComplianceManager
              captures: { sys1_id: $.data.id }
            - call: "GET /systems/${sys1_id}"
              payload: {}
              as: ComplianceManager
              captures: { sys1_v: $.data.version }
            - call: "POST /retrofit-plans"
              payload: { system_id: "${sys1_id}", plan_type: "RETROFIT", target_refrigerant_type_id: "${rt448_id}", due_on: "2026-10-01T00:00:00Z", estimated_cost_usd: 120000.00, expected_system_version: "${sys1_v}" }
              as: ComplianceManager
              captures: { plan1_id: $.data.id, plan1_status: $.data.status }
            - call: "GET /systems/${sys1_id}"
              payload: {}
              as: ComplianceManager
              captures: { sys1_v2: $.data.version }
          trigger:
            - call: "POST /retrofit-plans"
              payload: { system_id: "${sys1_id}", plan_type: "RETIRE", due_on: "2026-11-01T00:00:00Z", estimated_cost_usd: 45000.00, expected_system_version: "${sys1_v}" }
              as: ComplianceManager
              captures: { e_stale: $.data.error_id }
            - call: "POST /retrofit-plans"
              payload: { system_id: "${sys1_id}", plan_type: "RETIRE", due_on: "2026-11-01T00:00:00Z", estimated_cost_usd: 45000.00, expected_system_version: "${sys1_v2}" }
              as: ComplianceManager
              captures: { plan2_id: $.data.id, plan2_status: $.data.status }
          assert:
            - "the first plan is created with status DRAFT and the system moves from version 1 to version 2"
            - "first trigger: HTTP 412 with error_id ERR_STALE_SYSTEM_VERSION"
            - "after the refusal RetrofitPlan.${plan1_id}.status is still DRAFT (not SUPERSEDED), GET /retrofit-plans?system_id=${sys1_id} returns total_count 1 and the system is still at version 2"
            - "the 412 is not ERR_RETROFIT_TARGET_REQUIRED - a RETIRE plan legitimately omits target_refrigerant_type_id"
            - "second trigger: HTTP 201, RetrofitPlan.${plan1_id}.status becomes SUPERSEDED, the new plan is DRAFT and the system reaches version 3"

      - name: system_version_increments_on_every_parent_bumping_write_and_never_on_a_read
        claim_type: optimistic_concurrency
        grounds:
          - entities.RefrigerantSystem.fields.version
          - endpoints.POST_/service-records.side_effects
          - endpoints.POST_/retrofit-plans.side_effects
          - endpoints.POST_/service-records/{id}/void.side_effects
        distinguishing_aspect: "The monotonic ledger behind the OCC token: version is 1 at creation and advances by exactly one on each of the three distinct write families that touch a system (record, plan, void), while an arbitrary number of GET reads in between leave it untouched - so a client can distinguish 'someone else wrote' from 'I re-read'."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, one 100 lb R-404A system, an ALLOWED R-448A target, one UNIVERSAL technician, one HIGH-certified machine and one cylinder holding 40.0 lb."
          setup_api_calls:
