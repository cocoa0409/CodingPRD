              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /routes/${route_id}/open"
              payload: {}
              as: Dispatcher
              captures: { route_v: $.data.version }
            - call: "POST /donors"
              payload: { email: "d7@x.com", full_name: "D Seven", address: "7 A St", region_code: "CA-BAY" }
              as: Anonymous
              captures: { donor_id: $.data.id }
            - call: "POST /pickup-requests"
              payload: { donor_id: "${donor_id}", partner_id: "${partner_id}", pickup_mode: "ATTENDED", disposition: "DONATION", address: "7 A St" }
              as: Donor
              as_user_id: "${donor_id}"
              captures: { req_id: $.data.id }
            - call: "POST /pickup-requests/${req_id}/items"
              payload: { category: "HOUSEHOLD", volume_cf: 25, weight_lbs: 10, declared_value_cents: 1005, declared_condition: "GOOD" }
              as: Donor
              as_user_id: "${donor_id}"
            - call: "POST /pickup-requests/${req_id}/items"
              payload: { category: "HOUSEHOLD", volume_cf: 25, weight_lbs: 10, declared_value_cents: 1005, declared_condition: "GOOD" }
              as: Donor
              as_user_id: "${donor_id}"
            - call: "POST /pickup-requests/${req_id}/schedule"
              payload: { route_id: "${route_id}", slot_start: "2026-03-15T10:00:00Z", slot_end: "2026-03-15T10:30:00Z", expected_route_version: "${route_v}" }
              as: Dispatcher
          trigger:
            - call: "POST /pickup-requests/${req_id}/complete"
              payload: { measured_volume_cf: 50 }
              as: Driver
          assert:
            - "GET /donation-receipts?request_id=${req_id} data[0].final_value_cents == 1408"
