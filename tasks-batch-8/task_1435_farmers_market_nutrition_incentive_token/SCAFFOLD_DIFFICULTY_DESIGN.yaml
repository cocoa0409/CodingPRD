            - "no Issuance created; Program.match_pool_remaining_cents still 100000"

      - name: safety_beats_temporal_on_flagged_token_after_window
        grounds:
          - validations[priority=16]
          - validations[priority=22]
        distinguishing_aspect: |
          Category pair business_safety vs business_temporal (different pair than state/fiscal): the token is
          FLAGGED AND the 7-day submission window has expired; the fraud quarantine (priority 16) must win
          over the window error (priority 22).
        test_recipe:
          setup:
            - "Base setup; issuance charge 300; vendor redeemed serial 200001; token then FLAGGED via Auditor fraud case"
            - "Day CLOSED; logical clock advanced to 2026-08-09T12:00:00Z (window closed at 2026-08-08T14:00:00Z)"
          setup_api_calls:
