        distinguishing_aspect: "The scaffold declares no true multi-id bulk endpoint, so the line endpoint is the closest bulk shape: each post recomputes tire_count and total_weight_lbs from the child set rather than incrementing a counter, which is observable because a mid-sequence rejection leaves the totals exactly at the last accepted value."
