  - rule_id: priority_pair_validation_conflict
    instances:
      - name: blackout_activate_state_beats_temporal
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors[ERR_BLACKOUT_NOT_SCHEDULED]
          - errors[ERR_BLACKOUT_NOT_IN_WINDOW]
        distinguishing_aspect: |
          Error-category pair state (priority 6) vs business_temporal (priority
          10): activating an already-COMPLETED blackout after its window violates
          both the from-state rule and the [start_at, end_at) window rule; the
          state error ERR_BLACKOUT_NOT_SCHEDULED must win.
        test_recipe:
          setup:
            - "Case in DRAFT with blackout [2026-09-01, 2026-09-05) SCHEDULED at the default clock; BLACKOUT_ADVISORY notice issued 2026-08-01 (31 days before start, inside [60,30]-day window) covering start 2026-09-01; blackout activated at 2026-09-03 and completed at 2026-09-06."
          setup_api_calls:
            - { call: "POST /termination-cases", payload: { plan_name: "Prio One Co 401k", sponsor_ein: "123456789", plan_number: "060", proposed_termination_date: "2026-10-15T00:00:00Z" }, as: PlanAdministrator, captures: { c_pr1: "$.data.id", c_pr1_v: "$.data.version" } }
            - { call: "POST /blackout-periods", payload: { termination_case_id: "${c_pr1}", start_at: "2026-09-01T00:00:00Z", end_at: "2026-09-05T00:00:00Z", outgoing_recordkeeper: "OldRK", incoming_recordkeeper: "NewRK" }, as: PlanAdministrator, captures: { b_pr1: "$.data.id" } }
            - { call: "POST /notices", payload: { termination_case_id: "${c_pr1}", notice_type: BLACKOUT_ADVISORY, action_effective_date: "2026-09-01T00:00:00Z", expected_termination_case_version: "${c_pr1_v}" }, as: PlanAdministrator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-03T00:00:00Z" }, as: PlanAdministrator }
            - { call: "POST /blackout-periods/${b_pr1}/activate", payload: {}, as: Recordkeeper }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-06T00:00:00Z" }, as: PlanAdministrator }
            - { call: "POST /blackout-periods/${b_pr1}/complete", payload: {}, as: Recordkeeper }
          trigger:
            - { call: "POST /blackout-periods/${b_pr1}/activate", payload: {}, as: Recordkeeper, captures: { err_pr1: "$.data.error_id" } }
          assert:
            - "Second activation at 2026-09-06 violates BOTH state (COMPLETED) and temporal (now >= end_at) rules"
            - "error_id == ERR_BLACKOUT_NOT_SCHEDULED (state, priority 6, beats business_temporal, priority 10) and http status == 409"

      - name: sod_beats_zero_balance
        grounds:
          - validations[priority=7]
          - validations[priority=12]
          - errors[ERR_SEGREGATION_OF_DUTIES_VIOLATION]
          - errors[ERR_ZERO_BALANCE_TRANSFER]
        distinguishing_aspect: |
          Error-category pair business_safety (priority 7) vs business_fiscal
          (priority 12) — a different pair than the sibling instance: a
          forfeiture filed by the same user who exhausted the search on a
          zero-balance participant violates both segregation-of-duties and the
          non-zero-balance rule; ERR_SEGREGATION_OF_DUTIES_VIOLATION must win.
        test_recipe:
          setup:
            - "Case in DISTRIBUTION_IN_PROGRESS with one participant, balance 0 cents vested 100%, MISSING; search case fully exhausted by user admin-1 (snapshot 0); SEARCH_PROTOCOL_SUMMARY log present."
          setup_api_calls:
