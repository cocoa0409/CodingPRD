# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Sports Game Licensing, Roster Updates & Likeness Royalties
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: royalty_accrual_provisional_vs_final_variants
        grounds:
          - calculations.royalty_accrual
          - state_machines.RoyaltyStatement.OPEN_to_PROVISIONAL
          - state_machines.RoyaltyStatement.PROVISIONAL_to_FINALIZED
        distinguishing_aspect: |
          Entity domain = LicenseAgreement royalty ledger. The PROVISIONAL variant
          includes pending_sales_cents in the accrual base while the FINAL variant
          excludes it; identical gross/returns inputs therefore yield different
          accrued_royalty_cents between compute-provisional and finalize.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z (startup default)"
            - "LicenseAgreement A1 ACTIVE, PERCENT_OF_NET, mg_recoupable=false, term 2026-01-01..2026-12-31"
            - "RoyaltyStatement S1 OPEN for 2026-08-01..2026-08-31 with gross_sales_cents=1000000, returns_cents=100000, pending_sales_cents=200000"
          setup_api_calls:
            - call: "POST /licensing/agreements"
              payload: { licensor_type: "LEAGUE", licensor_name: "Pro Football League", exclusivity_scope: "CATEGORY", sport_category: "AMFOOT_PRO", term_start_on: "2026-01-01", term_end_on: "2026-12-31", royalty_model: "PERCENT_OF_NET", royalty_rate_bps: 1000, minimum_guarantee_cents: 0, mg_recoupable: false, audit_window_days: 90 }
              as: LicensingAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /licensing/royalty-statements"
              payload: { agreement_id: "${agr_id}", period_start_on: "2026-08-01", period_end_on: "2026-08-31", gross_sales_cents: 1000000, returns_cents: 100000, pending_sales_cents: 200000 }
              as: FinanceController
              captures: { stmt_id: $.data.id }
            - call: "POST /licensing/royalty-statements/${stmt_id}/compute-provisional"
              payload: {}
              as: FinanceController
              captures: { prov_accrual: $.data.accrued_royalty_cents }
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: LicensingAdmin
          trigger:
            - call: "POST /licensing/royalty-statements/${stmt_id}/finalize"
              payload: {}
              as: FinanceController
              captures: { final_accrual: $.data.accrued_royalty_cents }
          assert:
            - "provisional accrued_royalty_cents == 90000 (base = 1000000-100000 = 900000; 900000*1000/10000)"
            - "final accrued_royalty_cents == 70000 (base = 1000000-200000-100000 = 700000; 700000*1000/10000)"
            - "RoyaltyStatement.${stmt_id}.statement_status == FINALIZED"
            - "final != provisional (delta 20000 == 200000*1000/10000 on the pending slice)"

      - name: prize_pool_projected_vs_final_variants
        grounds:
          - calculations.prize_pool_split
          - state_machines.TournamentPrize.PLANNED_to_PROJECTED
          - state_machines.TournamentPrize.PROJECTED_to_PAYABLE
        distinguishing_aspect: |
          Entity domain = TournamentProgram prize administration (distinct from the
          royalty ledger). PROJECTED pool counts REGISTERED+CONFIRMED entry fees;
          FINAL pool counts CONFIRMED only, so identical entries yield different
          pool_vc and different prize amounts between projection and record-results.
        test_recipe:
          setup:
            - "Agreement ACTIVE (AMFOOT_PRO, 2026 term); season LIVE; clock 2026-09-01"
            - "Program P league_sanctioned=true, entry_fee_vc=1000, registration window 2026-08-01..2026-12-01, registration OPEN"
            - "Prize rows: placement 1 share 6000 bps; placement 2 share 4000 bps"
            - "Wallets W1, W2, W3 OPEN funded with 5000 vc each; W4 OPEN funded with exactly 1000"
            - "Entries E1(W1), E2(W2), E3(W3), E4(W4) all REGISTERED with fee_paid=true (fee debited at registration)"
            - "A REFUND credit of 1000 referencing E4 is posted to W4, flipping E4.fee_paid=false"
          setup_api_calls:
            - call: "POST /licensing/agreements"
              payload: { licensor_type: "LEAGUE", licensor_name: "Pro Football League", exclusivity_scope: "NONE", sport_category: "AMFOOT_PRO", term_start_on: "2026-01-01", term_end_on: "2026-12-31", royalty_model: "PERCENT_OF_NET", royalty_rate_bps: 1000, minimum_guarantee_cents: 0, mg_recoupable: false, audit_window_days: 90 }
              as: LicensingAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /licensing/seasons"
              payload: { title_code: "PIGSKIN26", sport_category: "AMFOOT_PRO", season_label: "2026-27", agreement_id: "${agr_id}", season_opens_on: "2026-08-01", season_closes_on: "2027-02-01" }
              as: LiveOpsManager
              captures: { season_id: $.data.id }
            - call: "POST /licensing/roster-batches"
              payload: { season_id: "${season_id}", batch_label: "LAUNCH_ROSTER", submitted_by: "op-1" }
              as: RosterOperator
              captures: { batch0_id: $.data.id }
            - call: "POST /licensing/athletes"
              payload: { full_name: "Pro Quarterback", sport_category: "AMFOOT_PRO", athlete_class: "ACTIVE_PRO", college_opt_in: false }
              as: RightsOfficer
              captures: { ath_id: $.data.id }
            - call: "POST /licensing/likeness-grants"
              payload: { athlete_id: "${ath_id}", agreement_id: "${agr_id}", grant_kind: "GROUP_PA", term_start_on: "2026-01-01", term_end_on: "2026-12-31", royalty_share_bps: 500, payment_destination: "pa-escrow-1" }
              as: RightsOfficer
              captures: { grant_id: $.data.id }
            - call: "POST /licensing/likeness-grants/${grant_id}/grant"
              payload: {}
              as: RightsOfficer
            - call: "POST /licensing/roster-batches/${batch0_id}/entries"
              payload: { athlete_id: "${ath_id}", entry_kind: "ADD", overall_rating: 90 }
              as: RosterOperator
            - call: "POST /licensing/roster-batches/${batch0_id}/validate"
              payload: {}
              as: RosterOperator
            - call: "GET /licensing/seasons/${season_id}"
              payload: {}
              as: LiveOpsManager
              captures: { season_v0: $.data.version }
            - call: "POST /licensing/roster-batches/${batch0_id}/publish"
              payload: { expected_season_version: "${season_v0}" }
              as: RosterReviewer
              as_user_id: "reviewer-9"
            - call: "POST /licensing/seasons/${season_id}/launch"
              payload: {}
              as: LiveOpsManager
            - call: "POST /licensing/tournaments"
              payload: { season_id: "${season_id}", program_label: "LEAGUE_CUP_Q1", league_sanctioned: true, entry_fee_vc: 1000, registration_opens_at: "2026-08-01T00:00:00Z", registration_closes_at: "2026-12-01T00:00:00Z" }
              as: LiveOpsManager
              captures: { prog_id: $.data.id }
            - call: "POST /licensing/tournaments/${prog_id}/prizes"
              payload: { placement: 1, share_bps: 6000 }
              as: LiveOpsManager
            - call: "POST /licensing/tournaments/${prog_id}/prizes"
              payload: { placement: 2, share_bps: 4000 }
              as: LiveOpsManager
            - call: "POST /licensing/tournaments/${prog_id}/open-registration"
              payload: {}
              as: LiveOpsManager
            - call: "POST /licensing/wallets"
              payload: { season_id: "${season_id}", owner_tag: "player-one" }
              as: LiveOpsManager
              captures: { w1_id: $.data.id }
            - call: "POST /licensing/wallets"
              payload: { season_id: "${season_id}", owner_tag: "player-two" }
              as: LiveOpsManager
              captures: { w2_id: $.data.id }
            - call: "POST /licensing/wallets"
              payload: { season_id: "${season_id}", owner_tag: "player-three" }
              as: LiveOpsManager
              captures: { w3_id: $.data.id }
            - call: "POST /licensing/wallets"
              payload: { season_id: "${season_id}", owner_tag: "player-four" }
              as: LiveOpsManager
              captures: { w4_id: $.data.id }
            - call: "POST /licensing/wallets/${w1_id}/ledger-entries"
              payload: { direction: "CREDIT", amount_vc: 5000, reason_code: "GRANT" }
              as: LiveOpsManager
            - call: "POST /licensing/wallets/${w2_id}/ledger-entries"
              payload: { direction: "CREDIT", amount_vc: 5000, reason_code: "GRANT" }
              as: LiveOpsManager
            - call: "POST /licensing/wallets/${w3_id}/ledger-entries"
              payload: { direction: "CREDIT", amount_vc: 5000, reason_code: "GRANT" }
              as: LiveOpsManager
            - call: "POST /licensing/wallets/${w4_id}/ledger-entries"
              payload: { direction: "CREDIT", amount_vc: 1000, reason_code: "GRANT" }
              as: LiveOpsManager
            - call: "POST /licensing/tournaments/${prog_id}/entries"
              payload: { wallet_id: "${w1_id}" }
              as: LiveOpsManager
              captures: { e1_id: $.data.id }
            - call: "POST /licensing/tournaments/${prog_id}/entries"
              payload: { wallet_id: "${w2_id}" }
              as: LiveOpsManager
              captures: { e2_id: $.data.id }
            - call: "POST /licensing/tournaments/${prog_id}/entries"
              payload: { wallet_id: "${w3_id}" }
              as: LiveOpsManager
              captures: { e3_id: $.data.id }
            - call: "POST /licensing/tournaments/${prog_id}/entries"
              payload: { wallet_id: "${w4_id}" }
              as: LiveOpsManager
              captures: { e4_id: $.data.id }
            - call: "POST /licensing/wallets/${w4_id}/ledger-entries"
              payload: { direction: "CREDIT", amount_vc: 1000, reason_code: "REFUND", reference_id: "${e4_id}" }
              as: LiveOpsManager
            - call: "GET /licensing/tournaments/${prog_id}/prizes"
              payload: {}
              as: LiveOpsManager
              captures: { proj_p1: "$.data[0].projected_amount_vc" }
          trigger:
            - call: "POST /licensing/tournaments/${prog_id}/close-registration"
              payload: {}
              as: LiveOpsManager
            - call: "POST /licensing/tournaments/${prog_id}/record-results"
              payload: { placements: [ { entry_id: "${e1_id}", placement: 1 }, { entry_id: "${e2_id}", placement: 2 }, { entry_id: "${e3_id}", placement: 3 } ] }
              as: LiveOpsManager
            - call: "GET /licensing/tournaments/${prog_id}/prizes"
              payload: {}
              as: LiveOpsManager
              captures: { final_p1: "$.data[0].final_amount_vc" }
          assert:
            - "PROJECTED pool with 4 registered entries = 4000 vc; placement-1 projected_amount_vc == floor(4000*6000/10000) = 2400"
            - "FINAL pool with 3 CONFIRMED entries = 3000 vc; placement-1 final_amount_vc == floor(3000*6000/10000) = 1800"
            - "placement-2 final_amount_vc == floor(3000*4000/10000) = 1200"
            - "TournamentEntry.${e4_id}.entry_status == REFUNDED after close-registration (fee_paid flipped false by the REFUND credit)"
            - "projected_amount_vc (2400) != final_amount_vc (1800) for placement 1 — variant divergence"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (different modes)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: royalty_tiered_formula_mode_a
        grounds:
          - calculations.royalty_accrual
        distinguishing_aspect: |
          Mode (a): a >=3-input formula with non-linear interaction — tiered rate
          selection with nested min/max over (gross, returns, pending) plus an
          mg_recoupable conditional branch; the same statement computed under
          different constant positions lands in different tiers.
        test_recipe:
          setup:
            - "Agreement A1 ACTIVE PERCENT_OF_NET mg_recoupable=false"
            - "Statement with gross_sales_cents=250000000, returns_cents=60000000, pending_sales_cents=0 so net = 190000000 straddling tier1 (50M) and tier2 (200M)"
          setup_api_calls:
            - call: "POST /licensing/agreements"
              payload: { licensor_type: "LEAGUE", licensor_name: "Hoops League", exclusivity_scope: "NONE", sport_category: "BASKET_PRO", term_start_on: "2026-01-01", term_end_on: "2026-12-31", royalty_model: "PERCENT_OF_NET", royalty_rate_bps: 1000, minimum_guarantee_cents: 0, mg_recoupable: false, audit_window_days: 60 }
              as: LicensingAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /licensing/royalty-statements"
              payload: { agreement_id: "${agr_id}", period_start_on: "2026-08-01", period_end_on: "2026-08-31", gross_sales_cents: 250000000, returns_cents: 60000000, pending_sales_cents: 0 }
              as: FinanceController
              captures: { stmt_id: $.data.id }
          trigger:
            - call: "POST /licensing/royalty-statements/${stmt_id}/compute-provisional"
              payload: {}
              as: FinanceController
              captures: { accr: $.data.accrued_royalty_cents }
          assert:
            - "tier1 = 50000000*1000/10000 = 5000000"
            - "tier2 = (190000000-50000000)*1200/10000 = 140000000*1200/10000 = 16800000"
            - "tier3 = 0 (base 190000000 <= 200000000 cap)"
            - "accrued_royalty_cents == 21800000 (round_half_up already integral)"

      - name: prize_pool_floor_per_row_then_remainder_mode_b
        grounds:
          - calculations.prize_pool_split
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the scaffold pins
          floor-per-row FIRST and then assigns the remainder to placement 1;
          computing 'sum then round' or 'round_half_up per row' yields a
          different placement-1 amount for the same pool.
        test_recipe:
          setup:
            - "Season LIVE; program entry_fee_vc=333, three CONFIRMED entries => pool = 999"
            - "Prize rows: placement 1 share 3333 bps; placement 2 share 3333 bps; placement 3 share 3334 bps (total 10000)"
          setup_api_calls:
            - call: "POST /licensing/agreements"
              payload: { licensor_type: "LEAGUE", licensor_name: "Futbol Intl", exclusivity_scope: "NONE", sport_category: "SOCCER_INTL", term_start_on: "2026-01-01", term_end_on: "2026-12-31", royalty_model: "PERCENT_OF_NET", royalty_rate_bps: 1000, minimum_guarantee_cents: 0, mg_recoupable: false, audit_window_days: 30 }
              as: LicensingAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /licensing/seasons"
              payload: { title_code: "FUTBOL26", sport_category: "SOCCER_INTL", season_label: "2026-27", agreement_id: "${agr_id}", season_opens_on: "2026-08-01", season_closes_on: "2027-02-01" }
              as: LiveOpsManager
              captures: { season_id: $.data.id }
            - call: "POST /licensing/roster-batches"
              payload: { season_id: "${season_id}", batch_label: "LAUNCH", submitted_by: "op-1" }
              as: RosterOperator
              captures: { batch_id: $.data.id }
            - call: "POST /licensing/athletes"
              payload: { full_name: "Striker One", sport_category: "SOCCER_INTL", athlete_class: "ACTIVE_PRO", college_opt_in: false }
              as: RightsOfficer
              captures: { ath_id: $.data.id }
            - call: "POST /licensing/likeness-grants"
              payload: { athlete_id: "${ath_id}", agreement_id: "${agr_id}", grant_kind: "GROUP_PA", term_start_on: "2026-01-01", term_end_on: "2026-12-31", royalty_share_bps: 100, payment_destination: "pa-escrow-2" }
              as: RightsOfficer
              captures: { grant_id: $.data.id }
            - call: "POST /licensing/likeness-grants/${grant_id}/grant"
              payload: {}
              as: RightsOfficer
            - call: "POST /licensing/roster-batches/${batch_id}/entries"
              payload: { athlete_id: "${ath_id}", entry_kind: "ADD", overall_rating: 88 }
              as: RosterOperator
            - call: "POST /licensing/roster-batches/${batch_id}/validate"
              payload: {}
              as: RosterOperator
            - call: "GET /licensing/seasons/${season_id}"
              payload: {}
              as: LiveOpsManager
              captures: { sv: $.data.version }
            - call: "POST /licensing/roster-batches/${batch_id}/publish"
              payload: { expected_season_version: "${sv}" }
              as: RosterReviewer
              as_user_id: "reviewer-9"
            - call: "POST /licensing/seasons/${season_id}/launch"
              payload: {}
              as: LiveOpsManager
            - call: "POST /licensing/tournaments"
              payload: { season_id: "${season_id}", program_label: "CUP333", league_sanctioned: true, entry_fee_vc: 333, registration_opens_at: "2026-08-01T00:00:00Z", registration_closes_at: "2026-12-01T00:00:00Z" }
              as: LiveOpsManager
              captures: { prog_id: $.data.id }
            - call: "POST /licensing/tournaments/${prog_id}/prizes"
              payload: { placement: 1, share_bps: 3333 }
              as: LiveOpsManager
            - call: "POST /licensing/tournaments/${prog_id}/prizes"
              payload: { placement: 2, share_bps: 3333 }
              as: LiveOpsManager
            - call: "POST /licensing/tournaments/${prog_id}/prizes"
              payload: { placement: 3, share_bps: 3334 }
              as: LiveOpsManager
            - call: "POST /licensing/tournaments/${prog_id}/open-registration"
              payload: {}
              as: LiveOpsManager
            - call: "POST /licensing/wallets"
              payload: { season_id: "${season_id}", owner_tag: "p1" }
              as: LiveOpsManager
              captures: { w1: $.data.id }
            - call: "POST /licensing/wallets"
              payload: { season_id: "${season_id}", owner_tag: "p2" }
              as: LiveOpsManager
              captures: { w2: $.data.id }
            - call: "POST /licensing/wallets"
              payload: { season_id: "${season_id}", owner_tag: "p3" }
              as: LiveOpsManager
              captures: { w3: $.data.id }
            - call: "POST /licensing/wallets/${w1}/ledger-entries"
              payload: { direction: "CREDIT", amount_vc: 1000, reason_code: "GRANT" }
              as: LiveOpsManager
            - call: "POST /licensing/wallets/${w2}/ledger-entries"
              payload: { direction: "CREDIT", amount_vc: 1000, reason_code: "GRANT" }
              as: LiveOpsManager
            - call: "POST /licensing/wallets/${w3}/ledger-entries"
              payload: { direction: "CREDIT", amount_vc: 1000, reason_code: "GRANT" }
              as: LiveOpsManager
            - call: "POST /licensing/tournaments/${prog_id}/entries"
              payload: { wallet_id: "${w1}" }
              as: LiveOpsManager
              captures: { e1: $.data.id }
            - call: "POST /licensing/tournaments/${prog_id}/entries"
              payload: { wallet_id: "${w2}" }
              as: LiveOpsManager
              captures: { e2: $.data.id }
            - call: "POST /licensing/tournaments/${prog_id}/entries"
              payload: { wallet_id: "${w3}" }
              as: LiveOpsManager
              captures: { e3: $.data.id }
            - call: "POST /licensing/tournaments/${prog_id}/close-registration"
              payload: {}
              as: LiveOpsManager
          trigger:
            - call: "POST /licensing/tournaments/${prog_id}/record-results"
              payload: { placements: [ { entry_id: "${e1}", placement: 1 }, { entry_id: "${e2}", placement: 2 }, { entry_id: "${e3}", placement: 3 } ] }
              as: LiveOpsManager
            - call: "GET /licensing/tournaments/${prog_id}/prizes"
              payload: {}
              as: LiveOpsManager
          assert:
            - "pool = 3*333 = 999"
            - "floor per row: p1 = floor(999*3333/10000) = floor(332.9667) = 332; p2 = 332; p3 = floor(999*3334/10000) = floor(333.0666) = 333"
            - "remainder = 999 - (332+332+333) = 2 assigned to placement 1"
            - "TournamentPrize(placement=1).final_amount_vc == 334"
            - "TournamentPrize(placement=2).final_amount_vc == 332"
            - "TournamentPrize(placement=3).final_amount_vc == 333"
            - "A naive round_half_up-per-row implementation would give p1 = 333 (off by 1); sum-then-round would distribute differently; the pinned order is floor-then-remainder-to-first"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: likeness_grant_granted_suspended_granted_cycle
        grounds:
          - state_machines.LikenessGrant.GRANTED_to_SUSPENDED
          - state_machines.LikenessGrant.SUSPENDED_to_GRANTED
        distinguishing_aspect: |
          Entity = LikenessGrant: a true cycle GRANTED -> SUSPENDED -> GRANTED
          (reinstate), not a linear pipeline; the second GRANTED leg must restore
          athlete ELIGIBLE and release HELD drops.
        test_recipe:
          setup:
            - "Agreement ACTIVE; athlete with GROUP_PA grant GRANTED; season LIVE with a RELEASED PLAYER_CARD drop featuring the athlete"
          setup_api_calls:
            - call: "POST /licensing/agreements"
              payload: { licensor_type: "PLAYERS_ASSOCIATION", licensor_name: "Players Assoc", exclusivity_scope: "NONE", sport_category: "AMFOOT_PRO", term_start_on: "2026-01-01", term_end_on: "2026-12-31", royalty_model: "PERCENT_OF_NET", royalty_rate_bps: 1000, minimum_guarantee_cents: 0, mg_recoupable: false, audit_window_days: 90 }
              as: LicensingAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /licensing/athletes"
              payload: { full_name: "Cyc Athlete", sport_category: "AMFOOT_PRO", athlete_class: "ACTIVE_PRO", college_opt_in: false }
              as: RightsOfficer
              captures: { ath_id: $.data.id }
            - call: "POST /licensing/likeness-grants"
              payload: { athlete_id: "${ath_id}", agreement_id: "${agr_id}", grant_kind: "GROUP_PA", term_start_on: "2026-01-01", term_end_on: "2026-12-31", royalty_share_bps: 200, payment_destination: "pa-escrow-3" }
              as: RightsOfficer
              captures: { grant_id: $.data.id }
            - call: "POST /licensing/likeness-grants/${grant_id}/grant"
              payload: {}
              as: RightsOfficer
            - call: "POST /licensing/seasons"
              payload: { title_code: "PIGSKIN26", sport_category: "AMFOOT_PRO", season_label: "2026-27", agreement_id: "${agr_id}", season_opens_on: "2026-08-01", season_closes_on: "2027-02-01" }
              as: LiveOpsManager
              captures: { season_id: $.data.id }
            - call: "POST /licensing/roster-batches"
              payload: { season_id: "${season_id}", batch_label: "LAUNCH", submitted_by: "op-1" }
              as: RosterOperator
              captures: { batch_id: $.data.id }
            - call: "POST /licensing/roster-batches/${batch_id}/entries"
              payload: { athlete_id: "${ath_id}", entry_kind: "ADD", overall_rating: 85 }
              as: RosterOperator
            - call: "POST /licensing/roster-batches/${batch_id}/validate"
              payload: {}
              as: RosterOperator
            - call: "GET /licensing/seasons/${season_id}"
              payload: {}
              as: LiveOpsManager
              captures: { sv: $.data.version }
            - call: "POST /licensing/roster-batches/${batch_id}/publish"
              payload: { expected_season_version: "${sv}" }
              as: RosterReviewer
              as_user_id: "reviewer-1"
            - call: "POST /licensing/seasons/${season_id}/launch"
              payload: {}
              as: LiveOpsManager
            - call: "POST /licensing/content-drops"
              payload: { season_id: "${season_id}", drop_kind: "PLAYER_CARD", drop_label: "QB Card", featured_athlete_id: "${ath_id}", price_vc: 100, scheduled_start_at: "2026-08-15T00:00:00Z", scheduled_end_at: "2026-12-15T00:00:00Z" }
