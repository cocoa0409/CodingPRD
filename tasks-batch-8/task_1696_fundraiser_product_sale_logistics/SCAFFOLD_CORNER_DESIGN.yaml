      - name: group_adjustment_running_balance_and_seq
        claim_type: correct_result
        grounds: ["calculations.group_balance", "entities.ProceedsLedgerEntry.fields.seq"]
        distinguishing_aspect: "Chronological replay: two manual adjustments (+500, -200) produce seq 1/2 with running balance_after_cents 500 then 300."
        test_recipe:
          setup: ["campaign DRAFT with one group"]
          setup_api_calls:
            - { call: "POST /fundraiser/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FundraiserAdmin }
            - call: "POST /fundraiser/campaigns"
