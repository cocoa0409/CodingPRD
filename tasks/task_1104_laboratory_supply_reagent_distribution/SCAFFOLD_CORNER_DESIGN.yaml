      - name: fifo_policy_prefers_earliest_received_lot
        claim_type: correct_result
        grounds: [calculations.fefo_allocation_selection, entities.StorageZone.fields.rotation_policy]
        distinguishing_aspect: "Under FIFO the same physical layout inverts: the reservation lands on the EARLIEST-RECEIVED lot even though its expiry (2026-06-29) is later."
        test_recipe:
          setup:
            - "FIFO zone; same two lots as fefo_prefers_earliest_expiry_lot (L1 received first, later expiry; L2 received second, earlier expiry)"
