              payload: { appointment_start: "2026-07-31T09:00:00Z" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { sc_err2: $.data.error_id }
            - call: "POST /supplemental-orders/${dense_order_id}/schedule"
              payload: { appointment_start: "2026-08-01T00:00:00Z" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
          assert:
            - "Schedule before determination — HTTP status == 409 and error_id == \"ERR_COVERAGE_NOT_DETERMINED\", even though 2026-08-05 is a legal instant"
            - "SupplementalScreeningOrder.${dense_order_id}.status == RECOMMENDED and appointment_start == null after that rejection"
            - "Backdated schedule after determination — HTTP status == 422 and error_id == \"ERR_APPOINTMENT_IN_PAST\""
            - "Schedule exactly at the clock — HTTP status == 200, status == SCHEDULED, appointment_start == \"2026-08-01T00:00:00Z\", appointment_end == \"2026-08-01T00:30:00Z\" (ULTRASOUND lasts 30 minutes)"
            - "Exam.${dense_exam_id}.follow_up_status == PENDING"
            - "SupplementalScreeningOrder.${dense_order_id}.coverage_outcome == COVERED_NO_COST_SHARE and coverage_tier == TIER_1 (CT mandates no cost sharing)"

      - name: deposit_must_be_positive_and_prepaid_credit_must_cover_the_application_fee
        claim_type: violation_to_error
        grounds:
          - validations[priority=80]
          - validations[priority=81]
          - errors[ERR_INVALID_DEPOSIT_AMOUNT]
          - errors[ERR_INSUFFICIENT_PREPAID_CREDIT]
          - calculations.fee_escrow_ledger
        distinguishing_aspect: "The two fiscal guards are distinct: a zero-cent deposit is refused 422 without touching the ledger, an otherwise perfect two-exam packet is refused 402 while prepaid_credit_cents is below 250000, and the identical packet succeeds the moment exactly 250000 has been deposited — leaving prepaid 0 and held 250000."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; CT policy; one facility with no funding; one DBT_3D unit; qualified staff."
            - "Two SCREENING exams interpreted BI-RADS 1 with density B."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_phys
            - *c_tech
            - *c_rad
            - *c_two_exams_a
            - *c_two_exams_a_read
            - *c_two_exams_b
            - *c_two_exams_b_read
            - call: "GET /units/${unit_id}"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { fi_u_v: $.data.version }
          trigger:
            - call: "POST /facilities/${fac_id}/funding-deposits"
              payload: { amount_cents: 0, memo: "Zero-cent deposit" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { fi_err1: $.data.error_id }
            - call: "POST /units/${unit_id}/clinical-image-reviews"
              payload: { exam_ids: ["${pk_a_id}", "${pk_b_id}"], expected_unit_version: "${fi_u_v}", reviewer_note: "Filed with an empty account" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { fi_err2: $.data.error_id }
            - call: "POST /facilities/${fac_id}/funding-deposits"
              payload: { amount_cents: 250000, memo: "Exactly one application fee" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
            - call: "POST /units/${unit_id}/clinical-image-reviews"
              payload: { exam_ids: ["${pk_a_id}", "${pk_b_id}"], expected_unit_version: "${fi_u_v}", reviewer_note: "Filed once funded" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { fi_sub_id: $.data.id }
          assert:
            - "Zero-cent deposit — HTTP status == 422 and error_id == \"ERR_INVALID_DEPOSIT_AMOUNT\""
            - "After that rejection — Facility.${fac_id}.total_funded_cents == 0 and prepaid_credit_cents == 0"
            - "Unfunded packet — HTTP status == 402 and error_id == \"ERR_INSUFFICIENT_PREPAID_CREDIT\""
            - "After the 250000 deposit — Facility.${fac_id}.total_funded_cents == 250000 and prepaid_credit_cents == 250000"
            - "Funded packet — HTTP status == 201, ClinicalImageReviewSubmission.${fi_sub_id}.status == SUBMITTED, fee_held_cents == 250000"
            - "Facility.${fac_id}.prepaid_credit_cents == 0, fee_held_cents == 250000, fee_consumed_cents == 0, total_funded_cents == 250000"
            - "MammographyUnit.${unit_id}.reaccreditation_attempts_remaining == 2 — the rejected attempt did not consume one"

      - name: unqualified_technologist_and_uncertified_modality_both_block_an_exam
        claim_type: violation_to_error
        grounds:
          - validations[priority=50]
          - validations[priority=52]
          - errors[ERR_TECHNOLOGIST_NOT_QUALIFIED]
          - errors[ERR_MODALITY_NOT_CERTIFIED]
        distinguishing_aspect: "Two different technologists fail POST /exams for two different reasons at two different priorities: one is PROVISIONAL because 10 initial hours miss the 40-hour floor (422 priority 50), the other is QUALIFIED but certified only for DM_2D on a DBT_3D unit (422 priority 52)."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; CT policy; one facility; one DBT_3D unit; qualified base staff."
            - "One extra technologist with 10 initial hours and 5 initial exams (PROVISIONAL) certified for DM_2D and DBT_3D."
            - "One extra technologist with 45 initial hours and 30 initial exams (QUALIFIED) certified only for DM_2D."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_phys
            - *c_tech
            - *c_rad
            - call: "POST /facilities/${fac_id}/personnel"
              payload: { full_name: "Provi Tech", role_type: "TECHNOLOGIST", initial_qualification_on: "2026-06-01T00:00:00Z", initial_training_hours: 10, initial_read_volume: 5, modality_certifications: ["DM_2D", "DBT_3D"] }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { prov_tech_id: $.data.id }
            - call: "POST /facilities/${fac_id}/personnel"
              payload: { full_name: "Duo Tech", role_type: "TECHNOLOGIST", initial_qualification_on: "2024-02-01T00:00:00Z", initial_training_hours: 45, initial_read_volume: 30, modality_certifications: ["DM_2D"] }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { dm_tech_id: $.data.id }
          trigger:
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${prov_tech_id}", patient_ref: "PT-QL-1", patient_state_code: "CT", exam_type: "SCREENING", performed_at: "2026-07-20T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${prov_tech_id}"
              captures: { ql_err1: $.data.error_id }
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${dm_tech_id}", patient_ref: "PT-QL-2", patient_state_code: "CT", exam_type: "SCREENING", performed_at: "2026-07-20T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${dm_tech_id}"
              captures: { ql_err2: $.data.error_id }
          assert:
            - "Personnel.${prov_tech_id}.qualification_status == PROVISIONAL (10 < 40 and 5 < 25)"
            - "First call — HTTP status == 422 and error_id == \"ERR_TECHNOLOGIST_NOT_QUALIFIED\""
            - "Personnel.${dm_tech_id}.qualification_status == QUALIFIED and modality_certifications == [\"DM_2D\"]"
            - "Second call — HTTP status == 422 and error_id == \"ERR_MODALITY_NOT_CERTIFIED\" (the unit is DBT_3D)"
            - "GET /exams returns total_count == 0"
            - "MammographyUnit.${unit_id}.total_images_acquired == 0 and image_based_repeat_rate_pct == null"

      - name: a_lapsed_physician_cannot_interpret
        claim_type: violation_to_error
        grounds:
          - validations[priority=51]
          - errors[ERR_PHYSICIAN_NOT_QUALIFIED]
          - state_machines.Personnel.qualification_status.QUALIFIED_to_LAPSED
        distinguishing_aspect: "Interpretation is gated on the physician's live qualification_status, not on their credentials at hire: once the radiologist's expired grace period lapses the qualification, the same interpret call that would have succeeded is refused 422 while the technologist — never reviewed — still acquires exams normally."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; CT policy (ce_grace_days 90); one facility; one DBT_3D unit; qualified staff with no credits."
            - "The radiologist alone is reviewed at 2026-08-01 (ce_status GRACE, ce_deadline_at 2026-10-30) and reviewed again at 2026-10-31, which lapses the qualification."
            - "One SCREENING exam is then acquired at 2026-10-31 by the never-reviewed technologist."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_phys
            - *c_tech
            - *c_rad
            - call: "POST /personnel/${rad_id}/qualification-reviews"
              payload: { review_note: "First review — no credits on file" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-31T00:00:00Z" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
            - call: "POST /personnel/${rad_id}/qualification-reviews"
              payload: { review_note: "Grace expired" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-LP-1", patient_state_code: "CT", exam_type: "SCREENING", performed_at: "2026-10-30T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { lp_exam_id: $.data.id }
          trigger:
            - call: "POST /exams/${lp_exam_id}/interpret"
              payload: { birads_assessment: 1, density_category: "B" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
              captures: { lp_err: $.data.error_id }
          assert:
            - "Personnel.${rad_id}.qualification_status == LAPSED and ce_status == DEFICIENT"
            - "Personnel.${tech_id}.qualification_status == QUALIFIED and ce_status == COMPLIANT (never reviewed, so never moved)"
            - "Interpret — HTTP status == 422 and error_id == \"ERR_PHYSICIAN_NOT_QUALIFIED\""
            - "Exam.${lp_exam_id}.report_status == AWAITING_INTERPRETATION, interpreting_physician_id == null, interpreted_at == null"
            - "The exam itself was created successfully, proving priority 50 passed for the technologist while priority 51 failed for the physician"
            - "Facility.${fac_id}.compliance_posture == CONDITIONAL"

      - name: a_technologist_cannot_be_given_an_audit_cycle
        claim_type: violation_to_error
        grounds:
          - validations[priority=59]
          - errors[ERR_NOT_AN_INTERPRETING_PHYSICIAN]
        distinguishing_aspect: "The audit-cycle owner must be an INTERPRETING_PHYSICIAN by role_type, so addressing the technologist returns 422 ERR_NOT_AN_INTERPRETING_PHYSICIAN — a referential check distinct from the priority 6 ERR_NOT_INTERPRETING_PHYSICIAN that governs who may act on a read."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; CT policy; one facility; one DBT_3D unit; qualified staff."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_phys
            - *c_tech
            - *c_rad
          trigger:
            - call: "POST /personnel/${tech_id}/audit-cycles"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }
              as: QualityAssuranceOfficer
              as_user_id: "qa-1"
              captures: { na_err1: $.data.error_id }
            - call: "POST /personnel/${phys_id}/audit-cycles"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z" }
              as: QualityAssuranceOfficer
              as_user_id: "qa-1"
              captures: { na_err2: $.data.error_id }
          assert:
            - "Both calls — HTTP status == 422 and error_id == \"ERR_NOT_AN_INTERPRETING_PHYSICIAN\""
            - "GET /personnel/${tech_id}/audit-cycles returns total_count == 0"
            - "GET /personnel/${phys_id}/audit-cycles returns total_count == 0"
            - "GET /personnel/${rad_id}/audit-cycles returns total_count == 0 — nothing was silently re-homed onto the eligible radiologist"

      - name: the_full_screening_notification_and_supplemental_path_passes_every_guard
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=40]
          - validations[priority=50]
          - validations[priority=51]
          - validations[priority=74]
          - validations[priority=75]
          - validations[priority=76]
        distinguishing_aspect: "A single dense-density patient is carried acquisition -> interpretation -> letter -> send -> supplemental order -> coverage -> schedule -> completion with no error at any step, which pins the happy path against over-eager guards: notably a CONDITIONAL facility posture must NOT block scheduling, only a SUSPENDED one does."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; CT policy; one facility (posture CONDITIONAL because its single unit's survey_compliance is OVERDUE); one DBT_3D unit; qualified staff."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_phys
            - *c_tech
            - *c_rad
          trigger:
            - *c_dense_exam
            - *c_dense_read
            - call: "GET /exams/${dense_exam_id}"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { hp_exam_v: $.data.version }
            - call: "POST /exams/${dense_exam_id}/notification-letters"
              payload: { expected_exam_version: "${hp_exam_v}", dispatch_channel: "MAIL" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { hp_letter_id: $.data.id }
            - call: "POST /notification-letters/${hp_letter_id}/send"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
            - *c_dense_order
            - call: "POST /supplemental-orders/${dense_order_id}/coverage-determination"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
            - call: "POST /supplemental-orders/${dense_order_id}/schedule"
              payload: { appointment_start: "2026-08-01T09:00:00Z" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
            - call: "POST /supplemental-orders/${dense_order_id}/complete"
              payload: { completion_note: "Ultrasound performed, BI-RADS 2" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
          assert:
            - "Every call in the chain returns 200 or 201 — no error envelope anywhere"
            - "Exam.${dense_exam_id}.report_status == INTERPRETED_FINAL, notification_status == SENT, follow_up_status == COMPLETED"
            - "Exam.${dense_exam_id}.report_due_at == \"2026-08-19T00:00:00Z\" and interpreted_late == false"
            - "Exam.${dense_exam_id}.notification_deadline_at == \"2026-08-22T00:00:00Z\" (CT's 21-day ceiling)"
            - "NotificationLetter.${hp_letter_id}.status == SENT, letter_type == COMBINED, density_statement_code == FDA_DENSE, reading_grade_level == 8"
            - "SupplementalScreeningOrder.${dense_order_id}.status == COMPLETED, completed_at == \"2026-08-01T00:00:00Z\", appointment_end == \"2026-08-01T09:30:00Z\""
            - "SupplementalScreeningOrder.${dense_order_id}.coverage_outcome == COVERED_NO_COST_SHARE, coverage_tier == TIER_1, allowed_amount_cents == 31500, covered_amount_cents == 31500, patient_responsibility_cents == 0"
            - "Facility.${fac_id}.compliance_posture == CONDITIONAL throughout and open_notice_obligations == 1 (the letter is sent but not yet assumed delivered)"

      - name: state_error_outranks_the_qualification_error
        claim_type: priority_ordering
        grounds:
          - validations[priority=41]
          - validations[priority=50]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / unit_out_of_service_state_error_outranks_technologist_qualification_error
          rationale: "That instance violates both rules in one request and asserts that only the priority 41 state error is returned."

      - name: referential_error_outranks_the_temporal_error
        claim_type: priority_ordering
        grounds:
          - validations[priority=56]
          - validations[priority=63]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / packet_exam_unit_mismatch_outranks_closed_reaccreditation_window
          rationale: "That instance violates the referential and the temporal rule together and asserts the referential error wins."

      - name: safety_error_outranks_the_fiscal_error
        claim_type: priority_ordering
        grounds:
          - validations[priority=54]
          - validations[priority=81]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / open_level_1_finding_outranks_insufficient_prepaid_credit
          rationale: "That instance violates the safety and the fiscal rule together and asserts the safety error wins."

  # ===========================================================================
  - section: endpoints
    instances:

      - name: list_filters_compose_with_pagination_and_the_default_page_size
        claim_type: standard_crud
        grounds:
          - entities.MammographyUnit.fields.operational_state
          - entities.Facility.fields.state_policy_id
        distinguishing_aspect: "Filtering and paging are applied in that order and total_count reports the FILTERED population, not the table: three units of which one is out of service, read with operational_state=IN_SERVICE, limit=1, offset=1, yields one row with total_count 2 and has_more false, while the unfiltered read yields total_count 3 under the default limit of 10."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; CT policy; the primary facility plus a second facility on the same policy."
            - "Three units in the primary facility: SEL-9001 (DBT_3D), SEL-9002 (DM_2D) and SEL-9003 (DBT_3D)."
            - "A DETECTOR / MAJOR equipment failure on SEL-9003 pulls it out of service."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - &c_unit2
              call: "POST /facilities/${fac_id}/units"
              payload: { manufacturer: "GE", model_serial: "SEL-9002", modality: "DM_2D", accreditation_expires_on: "2027-06-30T00:00:00Z" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { unit2_id: $.data.id }
            - call: "POST /facilities/${fac_id}/units"
              payload: { manufacturer: "Hologic", model_serial: "SEL-9003", modality: "DBT_3D", accreditation_expires_on: "2027-06-30T00:00:00Z" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { unit3_id: $.data.id }
            - call: "POST /facilities"
              payload: { name: "Second Harbor Imaging", state_policy_id: "${pol_ct_id}", accreditation_body: "STATE_CERTIFIED" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { pg_fac2_id: $.data.id }
            - *c_phys
            - *c_tech
            - *c_rad
            - call: "POST /units/${unit3_id}/equipment-failures"
              payload: { failure_code: "DETECTOR", severity: "MAJOR", detected_at: "2026-07-30T00:00:00Z" }
              as: MedicalPhysicist
              as_user_id: "${phys_id}"
              captures: { pg_fail_id: $.data.id }
          trigger:
            - call: "GET /facilities/${fac_id}/units"
              payload: { operational_state: "IN_SERVICE", limit: 1, offset: 1 }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
            - call: "GET /facilities/${fac_id}/units"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
            - call: "GET /state-policies/${pol_ct_id}/facilities"
              payload: { limit: 1, offset: 0 }
              as: AccreditationBodyReviewer
              as_user_id: "reviewer-1"
          assert:
            - "Filtered page — response_type == \"array\", exactly 1 item returned, total_count == 2, limit == 1, offset == 1, has_more == false"
            - "Filtered page — MammographyUnit.${unit3_id} does not appear (it is OUT_OF_SERVICE)"
            - "Unfiltered read — 3 items returned, total_count == 3, limit == 10, offset == 0, has_more == false"
            - "Policy-scoped facilities read — 1 item returned, total_count == 2, has_more == true"
            - "MammographyUnit.${unit3_id}.operational_state == OUT_OF_SERVICE and EquipmentFailureEvent.${pg_fail_id}.requires_post_repair_survey == true"
            - "Facility.${fac_id}.compliance_posture == CONDITIONAL — one out-of-service PROVISIONAL unit is not a level-1 predicate"

      - name: a_packet_is_all_or_nothing_and_never_partially_accepted
        claim_type: bulk_action
        grounds:
          - validations[priority=56]
          - errors[ERR_EXAM_UNIT_MISMATCH]
          - calculations.fee_escrow_ledger
        distinguishing_aspect: "The packet endpoint takes a set of exam ids and is transactional: a three-id packet whose third id belongs to a sibling unit is rejected 422 with the first two ids NOT provisionally recorded, no fee escrowed and no attempt consumed — and the corrected three-id packet then stores all three at once."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; CT policy; the facility funded with 1000000 cents; two DBT_3D units; qualified staff."
            - "Three interpreted exams on unit 1 and one interpreted exam on unit 2."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_unit2
            - *c_phys
            - *c_tech
            - *c_rad
            - *c_fund
            - *c_two_exams_a
            - *c_two_exams_a_read
            - *c_two_exams_b
            - *c_two_exams_b_read
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-BK-C", patient_state_code: "CT", exam_type: "SCREENING", performed_at: "2026-07-22T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { bk_c_id: $.data.id }
            - call: "POST /exams/${bk_c_id}/interpret"
              payload: { birads_assessment: 1, density_category: "B" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
            - call: "POST /exams"
              payload: { unit_id: "${unit2_id}", technologist_id: "${tech_id}", patient_ref: "PT-BK-X", patient_state_code: "CT", exam_type: "SCREENING", performed_at: "2026-07-23T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { bk_x_id: $.data.id }
            - call: "POST /exams/${bk_x_id}/interpret"
              payload: { birads_assessment: 1, density_category: "B" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
            - call: "GET /units/${unit_id}"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { bk_u_v: $.data.version }
          trigger:
            - call: "POST /units/${unit_id}/clinical-image-reviews"
              payload: { exam_ids: ["${pk_a_id}", "${pk_b_id}", "${bk_x_id}"], expected_unit_version: "${bk_u_v}", reviewer_note: "Third id is from the sibling unit" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { bk_err: $.data.error_id }
            - call: "POST /units/${unit_id}/clinical-image-reviews"
              payload: { exam_ids: ["${pk_a_id}", "${pk_b_id}", "${bk_c_id}"], expected_unit_version: "${bk_u_v}", reviewer_note: "All three ids belong to this unit" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { bk_sub_id: $.data.id }
          assert:
            - "Mixed packet — HTTP status == 422 and error_id == \"ERR_EXAM_UNIT_MISMATCH\""
            - "After the rejection — GET /units/${unit_id}/clinical-image-reviews returns total_count == 0 (no partially built packet exists)"
            - "After the rejection — Facility.${fac_id}.prepaid_credit_cents == 1000000 and fee_held_cents == 0"
            - "After the rejection — MammographyUnit.${unit_id}.reaccreditation_attempts_remaining == 3 and version == ${bk_u_v}"
            - "Corrected packet — HTTP status == 201, ClinicalImageReviewSubmission.${bk_sub_id}.exam_ids has exactly 3 entries and attempt_number == 1"
            - "Corrected packet — status == SUBMITTED, fee_held_cents == 250000, Facility.prepaid_credit_cents == 750000, fee_consumed_cents == 0"
            - "MammographyUnit.${unit_id}.reaccreditation_attempts_remaining == 2"

      - name: repeat_record_links_only_to_a_failure_on_the_same_unit
        claim_type: cross_reference_link
        grounds:
          - validations[priority=58]
          - errors[ERR_FAILURE_UNIT_MISMATCH]
          - entities.RepeatImagingRecord.fields.equipment_failure_id
          - calculations.unit_repeat_rate
        distinguishing_aspect: "The optional equipment_failure_id must point at a failure on the SAME unit as the exam: the sibling unit's failure is refused 422 while the own-unit failure is accepted, and only the accepted link moves the unit's image ledger — proving the reference is validated before the aggregate is touched."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; CT policy; the facility with two DBT_3D units; qualified staff."
            - "One SCREENING exam of 4 images on unit 1."
            - "One DISPLAY / MINOR failure on unit 1 and one DISPLAY / MINOR failure on unit 2 — neither is qualifying, so both units stay in service."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_unit2
            - *c_phys
            - *c_tech
            - *c_rad
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-XR-1", patient_state_code: "CT", exam_type: "SCREENING", performed_at: "2026-07-20T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { xr_exam_id: $.data.id }
            - call: "POST /units/${unit_id}/equipment-failures"
              payload: { failure_code: "DISPLAY", severity: "MINOR", detected_at: "2026-07-19T00:00:00Z" }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { xr_fail_own_id: $.data.id }
            - call: "POST /units/${unit2_id}/equipment-failures"
              payload: { failure_code: "DISPLAY", severity: "MINOR", detected_at: "2026-07-19T00:00:00Z" }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { xr_fail_other_id: $.data.id }
          trigger:
            - call: "POST /exams/${xr_exam_id}/repeat-records"
              payload: { reason_code: "EQUIPMENT_FAILURE", repeat_image_count: 2, equipment_failure_id: "${xr_fail_other_id}" }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { xr_err: $.data.error_id }
            - call: "POST /exams/${xr_exam_id}/repeat-records"
              payload: { reason_code: "EQUIPMENT_FAILURE", repeat_image_count: 2, equipment_failure_id: "${xr_fail_own_id}" }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { xr_rec_id: $.data.id }
            - call: "GET /repeat-records"
              payload: { equipment_failure_id: "${xr_fail_own_id}" }
              as: QualityAssuranceOfficer
              as_user_id: "qa-1"
          assert:
            - "Sibling-unit link — HTTP status == 422 and error_id == \"ERR_FAILURE_UNIT_MISMATCH\""
            - "After the rejection — Exam.${xr_exam_id}.repeat_image_count == 0 and MammographyUnit.${unit_id}.total_images_acquired == 4"
            - "Own-unit link — HTTP status == 201, RepeatImagingRecord.${xr_rec_id}.equipment_failure_id == ${xr_fail_own_id}, retracted == false, documented_at == \"2026-08-01T00:00:00Z\""
            - "Exam.${xr_exam_id}.repeat_image_count == 2"
            - "MammographyUnit.${unit_id}.repeat_images_acquired == 2 and total_images_acquired == 6"
            - "MammographyUnit.${unit_id}.image_based_repeat_rate_pct == 33.33 and patient_based_repeat_rate_pct == 100.00 and repeat_rate_flag == true"
            - "MammographyUnit.${unit2_id}.total_images_acquired == 0 and image_based_repeat_rate_pct == null"
            - "GET /repeat-records?equipment_failure_id=${xr_fail_own_id} returns total_count == 1"

      - name: interpretation_retroactively_tightens_the_report_due_date_and_flags_it_late
        claim_type: computed_read
        grounds:
          - calculations.report_turnaround_and_followup_clock
          - entities.Exam.fields.report_due_at
          - entities.Exam.fields.interpreted_late
        distinguishing_aspect: "report_due_at is written twice from two different policy constants: at acquisition it is performed_at + 30 routine days (2026-08-19), and at interpretation an urgent BI-RADS 4 rewrites it to performed_at + 7 urgent days (2026-07-27) — a date already in the past, which is why interpreted_late flips to true even though the read happened on the same day the exam was still nominally on time."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; CT policy (report_turnaround_days 30, urgent_report_turnaround_days 7); one facility; one DBT_3D unit; qualified staff."
            - "One SCREENING exam performed 2026-07-20 and read for the first time at 2026-08-01."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_phys
            - *c_tech
            - *c_rad
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-UR-1", patient_state_code: "CT", exam_type: "SCREENING", performed_at: "2026-07-20T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { ur_exam_id: $.data.id }
            - call: "GET /exams/${ur_exam_id}"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
          trigger:
            - call: "POST /exams/${ur_exam_id}/interpret"
              payload: { birads_assessment: 4, density_category: "D" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
            - call: "GET /exams/${ur_exam_id}"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
          assert:
            - "Before interpretation — Exam.${ur_exam_id}.report_due_at == \"2026-08-19T00:00:00Z\", interpreted_at == null, interpreted_late == false"
            - "After interpretation — Exam.${ur_exam_id}.report_due_at == \"2026-07-27T00:00:00Z\" (the urgent seven-day window measured from performed_at, not from the clock)"
            - "Exam.${ur_exam_id}.interpreted_at == \"2026-08-01T00:00:00Z\" and interpreted_late == true"
            - "Exam.${ur_exam_id}.report_status == INTERPRETED_FINAL, notification_status == PENDING, recall_flag == false (BI-RADS 4 is not a recall; only BI-RADS 0 is)"
            - "Exam.${ur_exam_id}.density_category == D"
            - "Facility.${fac_id}.open_notice_obligations == 1"

      - name: action_endpoints_enforce_their_declared_preconditions
        claim_type: action_endpoint
        grounds:
          - state_machines.ClinicalImageReviewSubmission.status.REVISION_REQUIRED_to_SUBMITTED
        excluded_because:
          difficulty_instance: non_linear_state_machine / clinical_image_review_revision_loop_returns_to_submitted
          rationale: "That instance drives the review/resubmit action pair around the whole loop and asserts every precondition and side effect on each pass."

      - name: restore_is_only_allowed_once_the_repair_is_evidenced
        claim_type: conditional_action
        grounds:
          - state_machines.EquipmentFailureEvent.status.OPEN_to_REPAIR_VERIFIED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / unit_restore_blocked_until_a_post_repair_survey_passes
          rationale: "That instance calls restore under both conditions — no qualifying survey and then a PASSED POST_REPAIR survey — which is exactly the conditional-action claim."

      - name: withdraw_is_only_allowed_from_an_open_submission
        claim_type: conditional_action
        grounds:
          - state_machines.ClinicalImageReviewSubmission.status.SUBMITTED_to_WITHDRAWN
        excluded_because:
          difficulty_instance: compensating_invariant / submission_withdrawal_restores_the_fee_ledger_identity_without_drift
          rationale: "That instance exercises the withdraw action from SUBMITTED and asserts the full compensating ledger, covering the conditional gate and its effects."

  # ===========================================================================
  # §1.6 defines no claim types of its own, so every instance below reuses
  # violation_to_error: each declared error id is driven from the API surface
  # and asserted by id and status. Errors already driven by §1.8 are stubbed.
  - section: errors
    instances:

      - name: every_unknown_path_id_returns_its_own_not_found_code
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_STATE_POLICY_NOT_FOUND]
          - errors[ERR_SURVEY_NOT_FOUND]
          - errors[ERR_INSPECTION_NOT_FOUND]
          - errors[ERR_SUBMISSION_NOT_FOUND]
          - errors[ERR_EXAM_NOT_FOUND]
          - errors[ERR_LETTER_NOT_FOUND]
          - errors[ERR_ORDER_NOT_FOUND]
          - errors[ERR_FAILURE_EVENT_NOT_FOUND]
          - errors[ERR_REPEAT_RECORD_NOT_FOUND]
          - errors[ERR_AUDIT_CYCLE_NOT_FOUND]
        distinguishing_aspect: "Every resource family owns a distinct 404 code rather than a shared generic one: ten reads of the same syntactically valid but absent id return ten different error_id values, so a client can tell which link in a path was dangling."
        test_recipe:
          setup:
            - "Empty database; the logical clock is pinned to 2026-08-01T00:00:00Z. The literal id 00000000-0000-0000-0000-000000000000 is never allocated."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /state-policies/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { nf_policy: $.data.error_id }
            - call: "GET /physicist-surveys/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { nf_survey: $.data.error_id }
            - call: "GET /inspections/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { nf_inspection: $.data.error_id }
            - call: "GET /clinical-image-reviews/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { nf_submission: $.data.error_id }
            - call: "GET /exams/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { nf_exam: $.data.error_id }
            - call: "GET /notification-letters/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { nf_letter: $.data.error_id }
            - call: "GET /supplemental-orders/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { nf_order: $.data.error_id }
            - call: "GET /equipment-failures/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { nf_failure: $.data.error_id }
            - call: "GET /repeat-records/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { nf_repeat: $.data.error_id }
            - call: "GET /audit-cycles/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { nf_cycle: $.data.error_id }
          assert:
            - "Every one of the ten reads returns HTTP status 404 with response_type \"error\" and a populated meta.api_request_id"
            - "${nf_policy} == \"ERR_STATE_POLICY_NOT_FOUND\""
            - "${nf_survey} == \"ERR_SURVEY_NOT_FOUND\""
            - "${nf_inspection} == \"ERR_INSPECTION_NOT_FOUND\""
            - "${nf_submission} == \"ERR_SUBMISSION_NOT_FOUND\""
            - "${nf_exam} == \"ERR_EXAM_NOT_FOUND\""
            - "${nf_letter} == \"ERR_LETTER_NOT_FOUND\""
            - "${nf_order} == \"ERR_ORDER_NOT_FOUND\""
            - "${nf_failure} == \"ERR_FAILURE_EVENT_NOT_FOUND\""
            - "${nf_repeat} == \"ERR_REPEAT_RECORD_NOT_FOUND\""
            - "${nf_cycle} == \"ERR_AUDIT_CYCLE_NOT_FOUND\""
            - "The ten error_id values are pairwise distinct"

      - name: submission_and_letter_actions_are_rejected_from_the_wrong_state
        claim_type: violation_to_error
        grounds:
          - validations[priority=40]
          - errors[ERR_SUBMISSION_NOT_REVIEWABLE]
          - errors[ERR_SUBMISSION_NOT_REVISABLE]
          - errors[ERR_SUBMISSION_NOT_WITHDRAWABLE]
          - errors[ERR_LETTER_NOT_SENT]
        distinguishing_aspect: "The three submission actions each own a distinct 409 code even though they all fail for the same reason (the submission is PASSED): review wants SUBMITTED, resubmit wants REVISION_REQUIRED, withdraw wants SUBMITTED, and mark-undeliverable wants a SENT letter — so a QUEUED letter yields ERR_LETTER_NOT_SENT rather than a generic conflict. The withdraw and resubmit attempts carry the *current* unit version, proving the 409 is a state verdict and not a masked 412."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; CT policy; facility funded with 1000000 cents; one DBT_3D unit; qualified staff; two interpreted screening exams."
            - "One packet has been filed and reviewed PASS, so the submission is PASSED, the unit is ACCREDITED and reaccreditation_attempts_remaining is back to 3."
            - "A lay-summary letter has been generated for the first exam, so it sits in QUEUED (never sent)."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_phys
            - *c_tech
            - *c_rad
            - *c_fund
            - *c_two_exams_a
            - *c_two_exams_a_read
            - *c_two_exams_b
            - *c_two_exams_b_read
            - call: "GET /units/${unit_id}"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { ws_u_v1: $.data.version }
            - call: "POST /units/${unit_id}/clinical-image-reviews"
              payload: { exam_ids: ["${pk_a_id}", "${pk_b_id}"], expected_unit_version: "${ws_u_v1}", reviewer_note: "Initial accreditation packet" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { ws_sub_id: $.data.id }
            - call: "POST /clinical-image-reviews/${ws_sub_id}/review"
              payload: { decision: "PASS", reviewer_note: "Image quality acceptable" }
              as: AccreditationBodyReviewer
              as_user_id: "reviewer-1"
            - call: "GET /exams/${pk_a_id}"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { ws_e_v1: $.data.version }
            - call: "POST /exams/${pk_a_id}/notification-letters"
              payload: { expected_exam_version: "${ws_e_v1}", dispatch_channel: "MAIL" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { ws_letter_id: $.data.id }
            - call: "GET /units/${unit_id}"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { ws_u_v2: $.data.version }
          trigger:
            - call: "POST /clinical-image-reviews/${ws_sub_id}/review"
              payload: { decision: "REVISION_REQUIRED", deficiency_categories: ["POSITIONING"], reviewer_note: "Second opinion" }
              as: AccreditationBodyReviewer
              as_user_id: "reviewer-1"
              captures: { ws_review_err: $.data.error_id }
            - call: "POST /clinical-image-reviews/${ws_sub_id}/resubmit"
              payload: { exam_ids: ["${pk_a_id}", "${pk_b_id}"], expected_unit_version: "${ws_u_v2}", reviewer_note: "Trying to revise a passed packet" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { ws_resubmit_err: $.data.error_id }
            - call: "POST /clinical-image-reviews/${ws_sub_id}/withdraw"
              payload: { expected_unit_version: "${ws_u_v2}", withdrawal_reason: "Trying to withdraw a passed packet" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { ws_withdraw_err: $.data.error_id }
            - call: "POST /notification-letters/${ws_letter_id}/mark-undeliverable"
              payload: { undeliverable_reason: "Returned to sender" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { ws_letter_err: $.data.error_id }
          assert:
            - "Review attempt — HTTP status == 409 and ${ws_review_err} == \"ERR_SUBMISSION_NOT_REVIEWABLE\""
            - "Resubmit attempt — HTTP status == 409 and ${ws_resubmit_err} == \"ERR_SUBMISSION_NOT_REVISABLE\""
            - "Withdraw attempt — HTTP status == 409 and ${ws_withdraw_err} == \"ERR_SUBMISSION_NOT_WITHDRAWABLE\" (not 412: the supplied version is current)"
            - "Mark-undeliverable attempt — HTTP status == 409 and ${ws_letter_err} == \"ERR_LETTER_NOT_SENT\""
            - "ClinicalImageReviewSubmission.${ws_sub_id}.status is still PASSED and attempt_number is still 1"
            - "NotificationLetter.${ws_letter_id}.status is still QUEUED and undeliverable_reason is still null"
            - "MammographyUnit.${unit_id}.accreditation_status == ACCREDITED, reaccreditation_attempts_remaining == 3, and version == ${ws_u_v2} (no failed attempt bumped it)"
            - "Facility.${fac_id}.prepaid_credit_cents == 750000, fee_held_cents == 0, fee_consumed_cents == 250000"

      - name: order_and_exam_actions_are_rejected_from_the_wrong_state
        claim_type: violation_to_error
        grounds:
          - validations[priority=40]
          - errors[ERR_ORDER_NOT_DETERMINABLE]
          - errors[ERR_ORDER_NOT_SCHEDULABLE]
          - errors[ERR_ORDER_NOT_COMPLETABLE]
          - errors[ERR_EXAM_NOT_INTERPRETABLE]
          - errors[ERR_EXAM_NOT_AMENDABLE]
        distinguishing_aspect: "One COMPLETED order and one RECOMMENDED order on the same exam fail opposite actions: the COMPLETED one cannot be re-determined or re-scheduled, the RECOMMENDED one cannot be completed. On the exam side, a second interpretation is refused as ERR_EXAM_NOT_INTERPRETABLE while an amendment of a never-interpreted exam is refused as ERR_EXAM_NOT_AMENDABLE rather than as an ownership failure, because the ownership guard is a no-op when the exam carries no interpreting_physician_id yet."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; CT policy; facility (capacity 2); one DBT_3D unit; qualified staff."
            - "One dense screening exam interpreted BI-RADS 1 / density C, with an ULTRASOUND order carried all the way to COMPLETED and a second MRI order left in RECOMMENDED."
            - "A second exam is acquired and left in AWAITING_INTERPRETATION."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_tech
            - *c_rad
            - *c_dense_exam
            - *c_dense_read
            - *c_dense_order
            - call: "POST /supplemental-orders/${dense_order_id}/coverage-determination"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
            - call: "POST /supplemental-orders/${dense_order_id}/schedule"
              payload: { appointment_start: "2026-08-10T14:00:00Z" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
            - call: "POST /supplemental-orders/${dense_order_id}/complete"
              payload: { completion_note: "Ultrasound performed" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
            - call: "POST /exams/${dense_exam_id}/supplemental-orders"
              payload: { modality: "MRI", recommendation_note: "Second-line MRI recommended" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
              captures: { ws2_mri_id: $.data.id }
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-SC-9", patient_state_code: "CT", exam_type: "SCREENING", performed_at: "2026-07-25T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { ws2_raw_exam_id: $.data.id }
          trigger:
            - call: "POST /supplemental-orders/${dense_order_id}/coverage-determination"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { ws2_det_err: $.data.error_id }
            - call: "POST /supplemental-orders/${dense_order_id}/schedule"
              payload: { appointment_start: "2026-08-20T14:00:00Z" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { ws2_sched_err: $.data.error_id }
            - call: "POST /supplemental-orders/${ws2_mri_id}/complete"
              payload: { completion_note: "Never scheduled" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { ws2_comp_err: $.data.error_id }
            - call: "POST /exams/${dense_exam_id}/interpret"
              payload: { birads_assessment: 2, density_category: "C" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
              captures: { ws2_interp_err: $.data.error_id }
            - call: "POST /exams/${ws2_raw_exam_id}/amend"
              payload: { birads_assessment: 2, amendment_reason: "Amending an unread exam" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
              captures: { ws2_amend_err: $.data.error_id }
          assert:
            - "Re-determination — HTTP status == 409 and ${ws2_det_err} == \"ERR_ORDER_NOT_DETERMINABLE\""
            - "Re-scheduling — HTTP status == 409 and ${ws2_sched_err} == \"ERR_ORDER_NOT_SCHEDULABLE\" (priority 40 is reached before the coverage and appointment-instant guards)"
            - "Completing the RECOMMENDED order — HTTP status == 409 and ${ws2_comp_err} == \"ERR_ORDER_NOT_COMPLETABLE\""
            - "Second interpretation — HTTP status == 409 and ${ws2_interp_err} == \"ERR_EXAM_NOT_INTERPRETABLE\""
            - "Amending the unread exam — HTTP status == 409 and ${ws2_amend_err} == \"ERR_EXAM_NOT_AMENDABLE\" (not 403 ERR_NOT_INTERPRETING_PHYSICIAN)"
            - "SupplementalScreeningOrder.${dense_order_id}.status is still COMPLETED with its original completed_at"
            - "SupplementalScreeningOrder.${ws2_mri_id}.status is still RECOMMENDED and coverage_outcome is still UNDETERMINED"
            - "Exam.${dense_exam_id}.birads_assessment is still 1, amendment_count == 0, and report_status == INTERPRETED_FINAL"
            - "Exam.${ws2_raw_exam_id}.report_status is still AWAITING_INTERPRETATION and interpreting_physician_id is still null"

      - name: audit_failure_and_repeat_actions_are_rejected_when_already_final
        claim_type: violation_to_error
        grounds:
          - validations[priority=40]
          - errors[ERR_AUDIT_CYCLE_NOT_CLOSABLE]
          - errors[ERR_FAILURE_ALREADY_RESOLVED]
          - errors[ERR_REPEAT_RECORD_ALREADY_RETRACTED]
        distinguishing_aspect: "Three idempotency-looking retries are all rejected rather than silently absorbed: closing a LOCKED cycle, restoring a REPAIR_VERIFIED failure and retracting an already-retracted repeat record each return their own 409 code, and none of them re-runs its side effects (locked_at, resolved_at and the unit image ledger are untouched)."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; CT policy; facility; one DBT_3D unit; a technologist and a radiologist."
            - "An audit cycle for 2026-01-01..2026-07-01 has been closed under PPV1_SCREENING, so it is LOCKED."
            - "One exam carries a POSITIONING repeat record that has already been retracted."
            - "One MINOR DISPLAY equipment failure (non-qualifying, so the unit never left service) has already been restored."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_tech
            - *c_rad
            - *c_cycle
            - *c_two_exams_a
            - call: "POST /exams/${pk_a_id}/repeat-records"
              payload: { reason_code: "POSITIONING", repeat_image_count: 1 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { ws3_rr_id: $.data.id }
            - call: "POST /repeat-records/${ws3_rr_id}/retract"
              payload: { retraction_reason: "Logged against the wrong patient" }
              as: QualityAssuranceOfficer
              as_user_id: "qa-1"
            - call: "POST /units/${unit_id}/equipment-failures"
              payload: { failure_code: "DISPLAY", severity: "MINOR", detected_at: "2026-07-28T00:00:00Z" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { ws3_fail_id: $.data.id }
            - call: "POST /equipment-failures/${ws3_fail_id}/restore"
              payload: { repair_note: "Review monitor recalibrated" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
            - call: "POST /audit-cycles/${cycle_id}/close"
              payload: { variant: "PPV1_SCREENING" }
              as: QualityAssuranceOfficer
              as_user_id: "qa-1"
          trigger:
            - call: "POST /audit-cycles/${cycle_id}/close"
              payload: { variant: "PPV3_BIOPSY_ALL" }
              as: QualityAssuranceOfficer
              as_user_id: "qa-1"
              captures: { ws3_close_err: $.data.error_id }
            - call: "POST /equipment-failures/${ws3_fail_id}/restore"
              payload: { repair_note: "Restoring twice" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { ws3_restore_err: $.data.error_id }
            - call: "POST /repeat-records/${ws3_rr_id}/retract"
              payload: { retraction_reason: "Retracting twice" }
              as: QualityAssuranceOfficer
              as_user_id: "qa-1"
              captures: { ws3_retract_err: $.data.error_id }
          assert:
            - "Second close — HTTP status == 409 and ${ws3_close_err} == \"ERR_AUDIT_CYCLE_NOT_CLOSABLE\""
            - "RadiologistAuditCycle.${cycle_id}.status is still LOCKED, variant_at_close is still \"PPV1_SCREENING\" and locked_at is still \"2026-08-01T00:00:00Z\""
            - "Second restore — HTTP status == 409 and ${ws3_restore_err} == \"ERR_FAILURE_ALREADY_RESOLVED\""
            - "EquipmentFailureEvent.${ws3_fail_id}.status is still REPAIR_VERIFIED, resolved_at is still \"2026-08-01T00:00:00Z\" and repair_note is still \"Review monitor recalibrated\""
            - "MammographyUnit.${unit_id}.operational_state == IN_SERVICE throughout (a MINOR DISPLAY failure never pulled it out of service, so requires_post_repair_survey was false and the post-repair-survey guard never engaged)"
            - "Second retract — HTTP status == 409 and ${ws3_retract_err} == \"ERR_REPEAT_RECORD_ALREADY_RETRACTED\""
            - "RepeatImagingRecord.${ws3_rr_id}.retracted is still true and retraction_reason is still \"Logged against the wrong patient\""
            - "MammographyUnit.${unit_id}.total_images_acquired == 4 and repeat_images_acquired == 0 (the retraction was applied exactly once)"

      - name: a_second_open_packet_on_the_same_unit_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=71]
          - errors[ERR_SUBMISSION_ALREADY_OPEN]
          - calculations.fee_escrow_ledger
        distinguishing_aspect: "The one-open-packet-per-unit rule is enforced at priority 71, after the packet-shape and version checks: a second well-formed packet with the current unit version and a fully funded facility still returns 409 ERR_SUBMISSION_ALREADY_OPEN, and crucially the rejected attempt escrows no second fee and burns no attempt."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; CT policy; facility funded with 1000000 cents; one DBT_3D unit; qualified staff; two interpreted screening exams."
            - "One packet citing both exams has been filed and is still SUBMITTED, so reaccreditation_attempts_remaining is 2 and 250000 cents are held."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_tech
            - *c_rad
            - *c_fund
            - *c_two_exams_a
            - *c_two_exams_a_read
            - *c_two_exams_b
            - *c_two_exams_b_read
            - call: "GET /units/${unit_id}"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { so_u_v1: $.data.version }
            - call: "POST /units/${unit_id}/clinical-image-reviews"
              payload: { exam_ids: ["${pk_a_id}", "${pk_b_id}"], expected_unit_version: "${so_u_v1}", reviewer_note: "First packet" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { so_sub_id: $.data.id }
            - call: "GET /units/${unit_id}"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { so_u_v2: $.data.version }
          trigger:
            - call: "POST /units/${unit_id}/clinical-image-reviews"
              payload: { exam_ids: ["${pk_a_id}", "${pk_b_id}"], expected_unit_version: "${so_u_v2}", reviewer_note: "Second packet while the first is open" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { so_err: $.data.error_id }
          assert:
            - "HTTP status == 409 and ${so_err} == \"ERR_SUBMISSION_ALREADY_OPEN\""
            - "GET /units/${unit_id}/clinical-image-reviews returns total_count == 1 and the only row is ${so_sub_id} with status SUBMITTED and attempt_number 1"
            - "MammographyUnit.${unit_id}.reaccreditation_attempts_remaining == 2 and version == ${so_u_v2} (the rejected packet neither burned an attempt nor bumped the version)"
            - "Facility.${fac_id}.prepaid_credit_cents == 750000, fee_held_cents == 250000, fee_consumed_cents == 0, total_funded_cents == 1000000"

      - name: cross_entity_gate_errors_are_raised_from_the_blocking_entity
        claim_type: violation_to_error
        grounds:
          - errors[ERR_POST_REPAIR_SURVEY_MISSING]
          - errors[ERR_FACILITY_SUSPENDED]
          - errors[ERR_PACKET_EXAM_NOT_FINAL]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / unit_restore_blocked_until_a_post_repair_survey_passes
          rationale: "The three cross-entity gate errors are each driven end to end by a §1.8 cross_entity_state_dependency instance — the restore gate here, ERR_FACILITY_SUSPENDED by supplemental_scheduling_blocked_while_the_facility_posture_is_suspended and ERR_PACKET_EXAM_NOT_FINAL by packet_submission_requires_every_cited_exam_to_be_interpreted_final — each asserting the code, the 409 and the unchanged blocked entity."

      - name: priority_masking_errors_are_asserted_in_conflicting_pairs
        claim_type: violation_to_error
        grounds:
          - errors[ERR_UNIT_NOT_IN_SERVICE]
          - errors[ERR_TECHNOLOGIST_NOT_QUALIFIED]
          - errors[ERR_EXAM_UNIT_MISMATCH]
          - errors[ERR_REACCREDITATION_WINDOW_CLOSED]
          - errors[ERR_OPEN_LEVEL_1_FINDING]
          - errors[ERR_INSUFFICIENT_PREPAID_CREDIT]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / unit_out_of_service_state_error_outranks_technologist_qualification_error
          rationale: "Each of these six codes is asserted by a §1.8 priority_pair_validation_conflict instance that arranges both violations at once and pins the winner, which is strictly stronger than driving either code alone."

      - name: interval_overlap_errors_are_asserted_at_their_boundaries
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SURVEY_WINDOW_OVERLAP]
          - errors[ERR_SUPPLEMENTAL_CAPACITY_CONFLICT]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / survey_windows_are_half_open_so_adjacent_windows_are_accepted
          rationale: "Both overlap codes are driven at the exact abutting instant by the two §1.8 resource_temporal_overlap instances, which also assert the accepted side of the boundary."

      - name: packet_shape_and_fee_errors_are_asserted_against_the_ledger
        claim_type: violation_to_error
        grounds:
          - errors[ERR_PACKET_TOO_SMALL]
          - errors[ERR_INSUFFICIENT_PREPAID_CREDIT]
        excluded_because:
          difficulty_instance: compensating_invariant / submission_withdrawal_restores_the_fee_ledger_identity_without_drift
          rationale: "The packet-shape and fee codes are asserted in §1.8 together with the fee ledger identity (a rejected packet must escrow nothing), and the corner validations section already re-drives ERR_PACKET_TOO_SMALL ahead of the fee check."

  # ===========================================================================
  # §1.7 — Table 7 defines no claim-type table, so the three bullet rows are
  # used as claim types (can_perform_own_operations,
  # cannot_perform_other_roles_operations) plus the segregation_of_duties row
  # required by complexity_profile.role_model. The header-level authentication
  # rows reuse violation_to_error, as Table 6 does.
  - section: rbac
    instances:

      - name: unauthenticated_and_unknown_role_requests_are_rejected_before_any_business_rule
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "401 is decided from the headers alone and strictly before validation: a request with no X-User-Role, a request whose X-User-Role is a plausible but undeclared role name (\"Radiologist\"), and a POST /facilities with an empty body and no headers all return ERR_UNAUTHENTICATED — the last one proves the auth gate outranks the priority 20 body validation that would otherwise say ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; CT policy; one facility; one DBT_3D unit."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
          trigger:
            - call: "GET /units/${unit_id}"
              payload: {}
              as: ""
              captures: { un_missing: $.data.error_id }
            - call: "GET /units/${unit_id}"
              payload: {}
              as: "Radiologist"
              as_user_id: "someone-1"
              captures: { un_unknown: $.data.error_id }
            - call: "POST /facilities"
              payload: {}
              as: ""
              captures: { un_novalidate: $.data.error_id }
          assert:
            - "Missing X-User-Role / X-User-ID — HTTP status == 401 and ${un_missing} == \"ERR_UNAUTHENTICATED\""
            - "Undeclared role name — HTTP status == 401 and ${un_unknown} == \"ERR_UNAUTHENTICATED\""
            - "Unauthenticated POST with an empty body — HTTP status == 401 and ${un_novalidate} == \"ERR_UNAUTHENTICATED\" (never ERR_INVALID_REQUEST)"
            - "All three responses carry response_type \"error\" and a populated meta.api_request_id / meta.api_request_timestamp"
            - "No Facility row was created: GET /state-policies/${pol_ct_id}/facilities returns total_count == 1"

      - name: each_role_performs_its_own_exclusive_operations
        claim_type: can_perform_own_operations
        grounds:
          - validations[priority=2]
          - state_machines.PhysicistSurvey.status.DRAFT_to_PASSED
          - state_machines.ClinicalImageReviewSubmission.status.SUBMITTED_to_PASSED
          - state_machines.MammographyUnit.accreditation_status.PROVISIONAL_to_ACCREDITED
        distinguishing_aspect: "All seven roles are exercised on an exclusive operation inside one workflow: the coordinator registers and funds and files, the technologist acquires, the physician interprets, the physicist opens and decides the survey, the accreditation body reviewer decides the packet, the inspector records an inspection and the QA officer records the pathology outcome — each returning 2xx, which is the positive half of the RBAC matrix."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; CT policy created by the accreditation body reviewer (a shared operation); facility funded with 1000000 cents; one DBT_3D unit; qualified staff; two interpreted screening exams; one DRAFT ANNUAL survey; one SUBMITTED packet citing both exams."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_phys
            - *c_tech
            - *c_rad
            - *c_fund
            - *c_two_exams_a
            - *c_two_exams_a_read
            - *c_two_exams_b
            - *c_two_exams_b_read
            - *c_draft_survey
            - call: "GET /units/${unit_id}"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { rb_u_v1: $.data.version }
            - call: "POST /units/${unit_id}/clinical-image-reviews"
              payload: { exam_ids: ["${pk_a_id}", "${pk_b_id}"], expected_unit_version: "${rb_u_v1}", reviewer_note: "Initial accreditation packet" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { rb_sub_id: $.data.id }
          trigger:
            - call: "POST /physicist-surveys/${draft_survey_id}/submit"
              payload: { phantom_score: 7.0, mean_glandular_dose_mgy: 2.00, outcome_note: "Within limits" }
              as: MedicalPhysicist
              as_user_id: "${phys_id}"
            - call: "POST /clinical-image-reviews/${rb_sub_id}/review"
              payload: { decision: "PASS", reviewer_note: "Image quality acceptable" }
              as: AccreditationBodyReviewer
              as_user_id: "reviewer-1"
            - call: "POST /facilities/${fac_id}/inspections"
              payload: { inspection_date: "2026-07-29T00:00:00Z", inspector_findings_level: "NONE" }
              as: FdaInspector
              as_user_id: "inspector-1"
              captures: { rb_insp_id: $.data.id }
            - call: "POST /exams/${pk_a_id}/outcome"
              payload: { biopsy_performed: true, pathology_result: "BENIGN" }
              as: QualityAssuranceOfficer
              as_user_id: "qa-1"
          assert:
            - "Survey submit — HTTP status == 200, PhysicistSurvey.${draft_survey_id}.status == PASSED and MammographyUnit.${unit_id}.survey_compliance == CURRENT"
            - "Packet review — HTTP status == 200, ClinicalImageReviewSubmission.${rb_sub_id}.status == PASSED and MammographyUnit.${unit_id}.accreditation_status == ACCREDITED"
            - "Inspection — HTTP status == 201 and AnnualInspection.${rb_insp_id}.status == RECORDED"
            - "Outcome — HTTP status == 200, Exam.${pk_a_id}.pathology_result == BENIGN, biopsy_performed == true and outcome_recorded_at == \"2026-08-01T00:00:00Z\""
            - "The coordinator's exclusive creates (facility, unit, personnel, funding deposit, packet), the technologist's exclusive POST /exams and the physician's exclusive interpret all returned 2xx during setup"
            - "Facility.${fac_id}.compliance_posture == COMPLIANT (accredited unit, current survey, no findings, no deficient staff)"

      - name: no_role_can_reach_another_roles_exclusive_operation
        claim_type: cannot_perform_other_roles_operations
        grounds:
          - validations[priority=2]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "Eight crossings of the peer boundary all return 403 ERR_FORBIDDEN_ROLE and change nothing: the QA officer cannot register a facility, the coordinator cannot open a survey or close an inspection, the physician cannot acquire an exam, the technologist cannot interpret or retract, the accreditation body reviewer cannot close an audit cycle and the physicist cannot award credits. The role check sits at priority 2, so it fires even when the request body and the target state are otherwise perfect."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; CT policy; one facility; one DBT_3D unit; qualified staff."
            - "One exam with a POSITIONING repeat record, one OPEN audit cycle for the radiologist and one RECORDED inspection with no findings."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_phys
            - *c_tech
            - *c_rad
            - *c_cycle
            - *c_two_exams_a
            - call: "POST /exams/${pk_a_id}/repeat-records"
              payload: { reason_code: "POSITIONING", repeat_image_count: 1 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { rb3_rr_id: $.data.id }
            - call: "POST /facilities/${fac_id}/inspections"
              payload: { inspection_date: "2026-07-29T00:00:00Z", inspector_findings_level: "NONE" }
              as: FdaInspector
              as_user_id: "inspector-1"
              captures: { rb3_insp_id: $.data.id }
          trigger:
            - call: "POST /facilities"
              payload: { name: "Rogue Center", state_policy_id: "${pol_ct_id}", accreditation_body: "ACR" }
              as: QualityAssuranceOfficer
              as_user_id: "qa-1"
              captures: { rb3_e1: $.data.error_id }
            - call: "POST /units/${unit_id}/physicist-surveys"
              payload: { survey_type: "ANNUAL", effective_start: "2026-07-01T00:00:00Z", effective_end: "2027-07-01T00:00:00Z" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { rb3_e2: $.data.error_id }
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-9001", patient_state_code: "CT", exam_type: "SCREENING", performed_at: "2026-07-22T00:00:00Z", original_image_count: 4 }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
              captures: { rb3_e3: $.data.error_id }
            - call: "POST /exams/${pk_a_id}/interpret"
              payload: { birads_assessment: 1, density_category: "B" }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { rb3_e4: $.data.error_id }
            - call: "POST /repeat-records/${rb3_rr_id}/retract"
              payload: { retraction_reason: "Self-service retraction" }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { rb3_e5: $.data.error_id }
            - call: "POST /inspections/${rb3_insp_id}/close"
              payload: { closure_note: "Closing our own inspection" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { rb3_e6: $.data.error_id }
            - call: "POST /audit-cycles/${cycle_id}/close"
              payload: { variant: "PPV1_SCREENING" }
              as: AccreditationBodyReviewer
              as_user_id: "reviewer-1"
              captures: { rb3_e7: $.data.error_id }
            - call: "POST /personnel/${rad_id}/credits"
              payload: { credit_type: "CATEGORY_1_CE", awarded_on: "2026-07-01T00:00:00Z", ce_hours: 5.00, source_note: "Physicist-awarded credit" }
              as: MedicalPhysicist
              as_user_id: "${phys_id}"
              captures: { rb3_e8: $.data.error_id }
          assert:
            - "All eight attempts return HTTP status == 403 and ${rb3_e1} == ${rb3_e2} == ${rb3_e3} == ${rb3_e4} == ${rb3_e5} == ${rb3_e6} == ${rb3_e7} == ${rb3_e8} == \"ERR_FORBIDDEN_ROLE\""
            - "GET /state-policies/${pol_ct_id}/facilities returns total_count == 1 (no rogue facility)"
            - "GET /units/${unit_id}/physicist-surveys returns total_count == 0"
            - "GET /exams returns total_count == 1 and Exam.${pk_a_id}.report_status is still AWAITING_INTERPRETATION"
            - "RepeatImagingRecord.${rb3_rr_id}.retracted is still false"
            - "AnnualInspection.${rb3_insp_id}.status is still RECORDED and closed_at is null"
            - "RadiologistAuditCycle.${cycle_id}.status is still OPEN and locked_at is null"
            - "GET /personnel/${rad_id}/credits returns total_count == 0 (no QualificationCredit row was written) and Personnel.${rad_id}.ce_hours_36mo is unchanged"

      - name: shared_operations_accept_every_listed_role_and_reject_the_rest
        claim_type: can_perform_own_operations
        grounds:
          - validations[priority=2]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "Shared operations are genuinely shared and not merely owned by their first listed role: the compliance run succeeds for both the coordinator and the QA officer but 403s for the inspector; equipment failures can be filed by the physicist and by the technologist; a repeat record can be documented by the coordinator as well as the technologist; a supplemental order can be recommended by the coordinator as well as the physician; the state policy can be created by the inspector as well as the reviewer; and every GET is open to an entity-backed role."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; CT policy; one facility; one DBT_3D unit; qualified staff."
            - "One dense screening exam interpreted BI-RADS 1 / density C."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_phys
            - *c_tech
            - *c_rad
            - *c_dense_exam
            - *c_dense_read
          trigger:
            - call: "POST /facilities/${fac_id}/compliance-runs"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
            - call: "POST /facilities/${fac_id}/compliance-runs"
              payload: {}
              as: QualityAssuranceOfficer
              as_user_id: "qa-1"
            - call: "POST /facilities/${fac_id}/compliance-runs"
              payload: {}
              as: FdaInspector
              as_user_id: "inspector-1"
              captures: { sh_run_err: $.data.error_id }
            - call: "POST /units/${unit_id}/equipment-failures"
              payload: { failure_code: "DISPLAY", severity: "MINOR", detected_at: "2026-07-28T00:00:00Z" }
              as: MedicalPhysicist
              as_user_id: "${phys_id}"
              captures: { sh_fail_a: $.data.id }
            - call: "POST /units/${unit_id}/equipment-failures"
              payload: { failure_code: "SOFTWARE", severity: "MINOR", detected_at: "2026-07-29T00:00:00Z" }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { sh_fail_b: $.data.id }
            - call: "POST /exams/${dense_exam_id}/repeat-records"
              payload: { reason_code: "MOTION", repeat_image_count: 1 }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { sh_rr_id: $.data.id }
            - call: "POST /exams/${dense_exam_id}/supplemental-orders"
              payload: { modality: "MRI", recommendation_note: "Coordinator-entered recommendation" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { sh_order_id: $.data.id }
            - call: "POST /state-policies"
              payload: { state_code: "NV", density_notice_rule: "FEDERAL_ONLY", lay_summary_max_reading_grade: 8, lay_summary_deadline_days: 30, supplemental_coverage_mandate: "NONE" }
              as: FdaInspector
              as_user_id: "inspector-1"
              captures: { sh_pol_nv_id: $.data.id }
            - call: "GET /units/${unit_id}/equipment-failures"
              payload: { status: "OPEN" }
              as: Technologist
              as_user_id: "${tech_id}"
          assert:
            - "Compliance run as the coordinator — HTTP status == 200 with ran_at == \"2026-08-01T00:00:00Z\""
            - "Compliance run as the QA officer — HTTP status == 200 with ran_at == \"2026-08-01T00:00:00Z\""
            - "Compliance run as the inspector — HTTP status == 403 and ${sh_run_err} == \"ERR_FORBIDDEN_ROLE\", and Facility.${fac_id}.last_compliance_run_at is unchanged by the rejected call"
            - "Both equipment failures are created (HTTP 201) with status OPEN and requires_post_repair_survey false, and MammographyUnit.${unit_id}.operational_state is still IN_SERVICE"
            - "Repeat record ${sh_rr_id} created by the coordinator — HTTP status == 201 and MammographyUnit.${unit_id}.repeat_images_acquired == 1"
            - "Supplemental order ${sh_order_id} recommended by the coordinator — HTTP status == 201 with status RECOMMENDED"
            - "State policy ${sh_pol_nv_id} created by the inspector — HTTP status == 201 with state_code \"NV\""
            - "GET /units/${unit_id}/equipment-failures as the technologist — HTTP status == 200 with total_count == 2"

      - name: segregation_of_duties_separates_the_reader_from_the_auditor_and_the_author_from_the_decider
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: "X-User-ID, not the role, decides these three: a QualityAssuranceOfficer request is refused when its X-User-ID is the exam's own interpreting physician, and again when it is the audited radiologist closing their own cycle, and a MedicalPhysicist request is refused when the submitter is not the physicist who opened the survey. Each is immediately retried by the correct identity with a byte-identical body and succeeds, proving the rejection was an identity verdict and not a role or state verdict."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; CT policy; one facility; one DBT_3D unit; qualified staff plus a second MEDICAL_PHYSICIST."
            - "One interpreted screening exam, one OPEN audit cycle for the radiologist covering 2026-01-01..2026-07-01, and one DRAFT ANNUAL survey opened by the first physicist."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_phys
            - *c_tech
            - *c_rad
            - call: "POST /facilities/${fac_id}/personnel"
              payload: { full_name: "Priya Physicist", role_type: "MEDICAL_PHYSICIST", initial_qualification_on: "2024-05-01T00:00:00Z", initial_training_hours: 30, initial_read_volume: 4, modality_certifications: ["DM_2D", "DBT_3D"] }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { sd_phys2_id: $.data.id }
            - *c_cycle
            - *c_two_exams_a
            - *c_two_exams_a_read
            - *c_draft_survey
          trigger:
            - call: "POST /exams/${pk_a_id}/outcome"
              payload: { biopsy_performed: true, pathology_result: "BENIGN" }
              as: QualityAssuranceOfficer
              as_user_id: "${rad_id}"
              captures: { sd_outcome_err: $.data.error_id }
            - call: "POST /audit-cycles/${cycle_id}/close"
              payload: { variant: "PPV1_SCREENING" }
              as: QualityAssuranceOfficer
              as_user_id: "${rad_id}"
              captures: { sd_close_err: $.data.error_id }
            - call: "POST /physicist-surveys/${draft_survey_id}/submit"
              payload: { phantom_score: 7.0, mean_glandular_dose_mgy: 2.00, outcome_note: "Submitted by a colleague" }
              as: MedicalPhysicist
              as_user_id: "${sd_phys2_id}"
              captures: { sd_submit_err: $.data.error_id }
            - call: "POST /exams/${pk_a_id}/outcome"
              payload: { biopsy_performed: true, pathology_result: "BENIGN" }
              as: QualityAssuranceOfficer
              as_user_id: "qa-1"
            - call: "POST /audit-cycles/${cycle_id}/close"
              payload: { variant: "PPV1_SCREENING" }
              as: QualityAssuranceOfficer
              as_user_id: "qa-1"
            - call: "POST /physicist-surveys/${draft_survey_id}/submit"
              payload: { phantom_score: 7.0, mean_glandular_dose_mgy: 2.00, outcome_note: "Submitted by the author" }
              as: MedicalPhysicist
              as_user_id: "${phys_id}"
          assert:
            - "Outcome by the interpreting physician — HTTP status == 403 and ${sd_outcome_err} == \"ERR_SEGREGATION_OF_DUTIES\""
            - "Cycle close by the audited radiologist — HTTP status == 403 and ${sd_close_err} == \"ERR_SEGREGATION_OF_DUTIES\""
            - "Survey submit by the second physicist — HTTP status == 403 and ${sd_submit_err} == \"ERR_SEGREGATION_OF_DUTIES\" (the role is correct and the survey is DRAFT, so only the identity differs)"
            - "Outcome by qa-1 — HTTP status == 200, Exam.${pk_a_id}.pathology_result == BENIGN and outcome_recorded_at == \"2026-08-01T00:00:00Z\""
            - "Cycle close by qa-1 — HTTP status == 200, RadiologistAuditCycle.${cycle_id}.status == LOCKED, variant_at_close == \"PPV1_SCREENING\" and locked_at == \"2026-08-01T00:00:00Z\""
            - "Survey submit by ${phys_id} — HTTP status == 200, PhysicistSurvey.${draft_survey_id}.status == PASSED, decided_at == \"2026-08-01T00:00:00Z\" and MammographyUnit.${unit_id}.survey_compliance == CURRENT"
            - "None of the three rejected calls left a partial write: before the retries Exam.${pk_a_id}.outcome_recorded_at was null, the cycle was OPEN and the survey was DRAFT with phantom_score null"

      - name: ownership_is_checked_against_the_acting_personnel_row
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=3]
          - validations[priority=6]
          - errors[ERR_ACTOR_NOT_AT_FACILITY]
          - errors[ERR_NOT_INTERPRETING_PHYSICIAN]
        distinguishing_aspect: "Entity-backed roles are scoped twice over: a fully qualified technologist employed by a *different* facility cannot acquire an exam on this facility's unit (403 ERR_ACTOR_NOT_AT_FACILITY at priority 3, ahead of the qualification checks), and a second qualified interpreting physician at the *same* facility cannot amend a colleague's report (403 ERR_NOT_INTERPRETING_PHYSICIAN at priority 6) — while the owning physician's identical amendment succeeds."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; CT policy; the primary facility with one DBT_3D unit and qualified staff, plus a second INTERPRETING_PHYSICIAN at the same facility."
            - "A second facility on the same policy with its own qualified TECHNOLOGIST."
            - "One screening exam on the primary unit, interpreted BI-RADS 1 / density B by the primary radiologist."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_phys
            - *c_tech
            - *c_rad
            - *c_rad2
            - call: "POST /facilities"
              payload: { name: "Bayside Imaging", state_policy_id: "${pol_ct_id}", accreditation_body: "ACR" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { ow_fac2_id: $.data.id }
            - call: "POST /facilities/${ow_fac2_id}/personnel"
              payload: { full_name: "Tara Tech", role_type: "TECHNOLOGIST", initial_qualification_on: "2024-02-10T00:00:00Z", initial_training_hours: 50, initial_read_volume: 40, modality_certifications: ["DM_2D", "DBT_3D"] }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { ow_tech2_id: $.data.id }
            - *c_two_exams_a
            - *c_two_exams_a_read
          trigger:
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${ow_tech2_id}", patient_ref: "PT-7001", patient_state_code: "CT", exam_type: "SCREENING", performed_at: "2026-07-24T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${ow_tech2_id}"
              captures: { ow_exam_err: $.data.error_id }
            - call: "POST /exams/${pk_a_id}/amend"
              payload: { birads_assessment: 2, amendment_reason: "Colleague amendment" }
              as: InterpretingPhysician
              as_user_id: "${rad2_id}"
              captures: { ow_amend_err: $.data.error_id }
            - call: "POST /exams/${pk_a_id}/amend"
              payload: { birads_assessment: 2, amendment_reason: "Reader-corrected assessment" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
          assert:
            - "Foreign technologist — HTTP status == 403 and ${ow_exam_err} == \"ERR_ACTOR_NOT_AT_FACILITY\" (priority 3, not the priority 50 qualification check: the actor is QUALIFIED and certified for DBT_3D)"
            - "GET /exams returns total_count == 1 (no exam was written for the foreign technologist)"
            - "Colleague amendment — HTTP status == 403 and ${ow_amend_err} == \"ERR_NOT_INTERPRETING_PHYSICIAN\""
            - "Before the owning physician's retry, Exam.${pk_a_id}.birads_assessment is still 1 and amendment_count == 0"
            - "Owning physician's amendment — HTTP status == 200, Exam.${pk_a_id}.report_status == AMENDED, birads_assessment == 2, amendment_count == 1 and interpreting_physician_id is still ${rad_id}"

  # ===========================================================================
  # §1.0 complexity_layers = [cascading_side_effects, dual_variant_calculation,
  # optimistic_concurrency, ops_run_checkpoint]. One instance per §1.2.1
  # concurrency rule, one version-monotonicity instance, one checkpoint
  # instance; the two layers whose whole point is §1.8's depth are stubbed.
  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_unit_version_is_rejected_on_packet_create_and_on_resubmit
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[cirs-create-stale-unit]
          - concurrency_rules[cirs-resubmit-stale-unit]
          - validations[priority=30]
          - errors[ERR_STALE_UNIT_VERSION]
          - calculations.fee_escrow_ledger
        distinguishing_aspect: "Both unit-scoped OCC rules are driven with a genuinely superseded version (the one observed before the first packet was filed, never a fabricated number): the replayed create returns 412 ERR_STALE_UNIT_VERSION rather than the 409 ERR_SUBMISSION_ALREADY_OPEN it would earn on its merits, because priority 30 sits ahead of priority 71 — and the resubmit carrying the same stale version is refused even though the packet really is REVISION_REQUIRED. Neither rejection burns an attempt or escrows a second fee, and the immediately following resubmit with the current version succeeds."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; CT policy; facility funded with 1000000 cents; one DBT_3D unit; qualified staff; two interpreted screening exams."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_tech
            - *c_rad
            - *c_fund
            - *c_two_exams_a
            - *c_two_exams_a_read
            - *c_two_exams_b
            - *c_two_exams_b_read
            - call: "GET /units/${unit_id}"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { occ_u_v1: $.data.version }
          trigger:
            - call: "POST /units/${unit_id}/clinical-image-reviews"
              payload: { exam_ids: ["${pk_a_id}", "${pk_b_id}"], expected_unit_version: "${occ_u_v1}", reviewer_note: "First packet, current version" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { occ_sub_id: $.data.id }
            - call: "POST /units/${unit_id}/clinical-image-reviews"
              payload: { exam_ids: ["${pk_a_id}", "${pk_b_id}"], expected_unit_version: "${occ_u_v1}", reviewer_note: "Replay of the first packet on a stale view" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { occ_create_err: $.data.error_id }
            - call: "POST /clinical-image-reviews/${occ_sub_id}/review"
              payload: { decision: "REVISION_REQUIRED", deficiency_categories: ["POSITIONING"], reviewer_note: "Positioning deficiencies" }
              as: AccreditationBodyReviewer
              as_user_id: "reviewer-1"
            - call: "POST /clinical-image-reviews/${occ_sub_id}/resubmit"
              payload: { exam_ids: ["${pk_a_id}", "${pk_b_id}"], expected_unit_version: "${occ_u_v1}", reviewer_note: "Resubmit on the pre-submission view" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { occ_resubmit_err: $.data.error_id }
            - call: "GET /units/${unit_id}"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { occ_u_v3: $.data.version }
            - call: "POST /clinical-image-reviews/${occ_sub_id}/resubmit"
              payload: { exam_ids: ["${pk_a_id}", "${pk_b_id}"], expected_unit_version: "${occ_u_v3}", reviewer_note: "Resubmit on the current view" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
          assert:
            - "First create — HTTP status == 201, MammographyUnit.${unit_id}.reaccreditation_attempts_remaining == 2 and Facility.${fac_id}.fee_held_cents == 250000"
            - "Replayed create — HTTP status == 412 and ${occ_create_err} == \"ERR_STALE_UNIT_VERSION\" (not 409 ERR_SUBMISSION_ALREADY_OPEN: priority 30 precedes priority 71)"
            - "After the replayed create — attempts still 2, fee_held_cents still 250000, prepaid_credit_cents still 750000, and GET /units/${unit_id}/clinical-image-reviews total_count == 1"
            - "Stale resubmit — HTTP status == 412 and ${occ_resubmit_err} == \"ERR_STALE_UNIT_VERSION\", with ClinicalImageReviewSubmission.${occ_sub_id}.status still REVISION_REQUIRED and attempt_number still 1"
            - "${occ_u_v3} > ${occ_u_v1} (the create and the review each advanced the unit's version)"
            - "Current-version resubmit — HTTP status == 200, ClinicalImageReviewSubmission.${occ_sub_id}.status == SUBMITTED, attempt_number == 2, MammographyUnit.${unit_id}.reaccreditation_attempts_remaining == 1"
            - "Facility.${fac_id}.total_funded_cents == 1000000 == prepaid_credit_cents + fee_held_cents + fee_consumed_cents at every step"

      - name: stale_exam_version_is_rejected_on_letter_generation_even_when_the_state_allows_it
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[letter-generate-stale-exam]
          - validations[priority=30]
          - errors[ERR_STALE_EXAM_VERSION]
          - state_machines.NotificationLetter.status.QUEUED_to_SUPERSEDED
        distinguishing_aspect: "The same stale exam version is rejected twice for two different reasons, which is what makes the OCC rule falsifiable: immediately after generation the state check would also have refused the replay, but after the amendment reopens the notification obligation the state check would have PASSED — and the replay still returns 412 ERR_STALE_EXAM_VERSION. Only re-reading the exam yields a version that works."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; CT policy; one facility; one DBT_3D unit; qualified staff."
            - "One dense screening exam interpreted BI-RADS 1 / density C, so notification_status is PENDING."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_tech
            - *c_rad
            - *c_dense_exam
            - *c_dense_read
            - call: "GET /exams/${dense_exam_id}"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { occ_e_v1: $.data.version }
          trigger:
            - call: "POST /exams/${dense_exam_id}/notification-letters"
              payload: { expected_exam_version: "${occ_e_v1}", dispatch_channel: "MAIL" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { occ_letter_1: $.data.id }
            - call: "POST /exams/${dense_exam_id}/notification-letters"
              payload: { expected_exam_version: "${occ_e_v1}", dispatch_channel: "MAIL" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { occ_letter_err_a: $.data.error_id }
            - call: "POST /exams/${dense_exam_id}/amend"
              payload: { birads_assessment: 2, amendment_reason: "Assessment corrected on review" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
            - call: "POST /exams/${dense_exam_id}/notification-letters"
              payload: { expected_exam_version: "${occ_e_v1}", dispatch_channel: "MAIL" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { occ_letter_err_b: $.data.error_id }
            - call: "GET /exams/${dense_exam_id}"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { occ_e_v3: $.data.version }
            - call: "POST /exams/${dense_exam_id}/notification-letters"
              payload: { expected_exam_version: "${occ_e_v3}", dispatch_channel: "MAIL" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { occ_letter_2: $.data.id }
          assert:
            - "First generation — HTTP status == 201, NotificationLetter.${occ_letter_1}.status == QUEUED and Exam.${dense_exam_id}.notification_status == GENERATED"
            - "Replay on the stale version — HTTP status == 412 and ${occ_letter_err_a} == \"ERR_STALE_EXAM_VERSION\" (priority 30 precedes the priority 40 state check that would also have refused it)"
            - "After the amendment — Exam.${dense_exam_id}.report_status == AMENDED, notification_status == PENDING and NotificationLetter.${occ_letter_1}.status == SUPERSEDED"
            - "Replay on the stale version after the amendment — HTTP status == 412 and ${occ_letter_err_b} == \"ERR_STALE_EXAM_VERSION\", even though the exam is now in a state that permits generation"
            - "${occ_e_v3} > ${occ_e_v1}"
            - "Generation on the re-read version — HTTP status == 201, NotificationLetter.${occ_letter_2}.status == QUEUED and Exam.${dense_exam_id}.notification_status == GENERATED"
            - "GET /exams/${dense_exam_id}/notification-letters returns total_count == 2 (exactly one letter per successful generation; neither 412 mailed anything)"

      - name: version_increments_once_per_write_and_never_on_a_read
        claim_type: optimistic_concurrency
        grounds:
          - validations[priority=30]
          - entities.MammographyUnit.fields.accreditation_status
          - entities.Exam.fields.report_status
          - state_machines.ClinicalImageReviewSubmission.status.SUBMITTED_to_PASSED
        distinguishing_aspect: "The version counter is per entity and per request: a unit starts at 1, is untouched by repeated GETs and by the creation of a child event that does not modify it (a MINOR DISPLAY failure leaves it IN_SERVICE), and advances by exactly 1 for each request that does modify it (packet create, then the PASS review) — while the exam's own counter advances independently on interpretation. Nothing jumps by 2 even though a single request writes several of the unit's fields."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; CT policy; facility funded with 1000000 cents; one DBT_3D unit; qualified staff."
            - "Two screening exams are acquired; the first one's version is observed before and after its interpretation."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_tech
            - *c_rad
            - *c_fund
            - *c_two_exams_a
            - call: "GET /exams/${pk_a_id}"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { vm_e_v1: $.data.version }
            - *c_two_exams_a_read
            - *c_two_exams_b
            - *c_two_exams_b_read
          trigger:
            - call: "GET /units/${unit_id}"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { vm_u_v1: $.data.version }
            - call: "GET /units/${unit_id}"
              payload: {}
              as: FdaInspector
              as_user_id: "inspector-1"
              captures: { vm_u_v1b: $.data.version }
            - call: "POST /units/${unit_id}/equipment-failures"
              payload: { failure_code: "DISPLAY", severity: "MINOR", detected_at: "2026-07-30T00:00:00Z" }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { vm_fail_id: $.data.id }
            - call: "GET /units/${unit_id}"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { vm_u_v2: $.data.version }
            - call: "POST /units/${unit_id}/clinical-image-reviews"
              payload: { exam_ids: ["${pk_a_id}", "${pk_b_id}"], expected_unit_version: "${vm_u_v2}", reviewer_note: "Initial accreditation packet" }
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { vm_sub_id: $.data.id }
            - call: "GET /units/${unit_id}"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { vm_u_v3: $.data.version }
            - call: "POST /clinical-image-reviews/${vm_sub_id}/review"
              payload: { decision: "PASS", reviewer_note: "Accredited" }
              as: AccreditationBodyReviewer
              as_user_id: "reviewer-1"
            - call: "GET /units/${unit_id}"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { vm_u_v4: $.data.version }
            - call: "GET /exams/${pk_a_id}"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { vm_e_v2: $.data.version }
          assert:
            - "${vm_u_v1} == 1 and ${vm_u_v1b} == 1 (two reads by two different roles change nothing)"
            - "${vm_u_v2} == 1: creating the MINOR DISPLAY failure wrote a child row but no unit field, so the unit's version did not move and operational_state is still IN_SERVICE"
            - "EquipmentFailureEvent.${vm_fail_id}.version == 1 and requires_post_repair_survey == false"
            - "${vm_u_v3} == ${vm_u_v2} + 1 (the packet create wrote reaccreditation_attempts_remaining and bumped the version once, not twice)"
            - "${vm_u_v4} == ${vm_u_v3} + 1 (the PASS review wrote accreditation_status, accreditation_expires_on and reaccreditation_attempts_remaining in one request, and the version advanced by exactly 1)"
            - "MammographyUnit.${unit_id}.accreditation_status == ACCREDITED and reaccreditation_attempts_remaining == 3"
            - "${vm_e_v1} == 1 and ${vm_e_v2} == ${vm_e_v1} + 1 (the interpretation advanced the exam's own counter; the unit's writes never touched it)"
            - "ClinicalImageReviewSubmission.${vm_sub_id}.version == 2 (created, then reviewed)"

      - name: multi_level_cascades_are_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - state_machines.MammographyUnit.operational_state.IN_SERVICE_to_OUT_OF_SERVICE
          - state_machines.SupplementalScreeningOrder.status.COVERAGE_DETERMINED_to_REFERRED_OUT
          - calculations.facility_compliance_posture
        excluded_because:
          difficulty_instance: transitive_cascade / failing_survey_cascades_five_levels_to_external_followup
          rationale: "The cascading_side_effects layer is the whole subject of the two §1.8 transitive_cascade instances: one walks survey_compliance -> operational_state -> posture -> order REFERRED_OUT -> exam PENDING_EXTERNAL in a single request, the other walks the amendment chain and asserts the ordering and the reopened obligation. Repeating a shallower cascade here would add no coverage."

      - name: both_calculation_variants_are_exercised_on_the_same_data
        claim_type: dual_variant_calculation
        grounds:
          - calculations.radiologist_audit_metrics
          - calculations.unit_repeat_rate
          - calculations.supplemental_coverage_determination
        excluded_because:
          difficulty_instance: dual_variant_calc / ppv1_versus_ppv3_variant_divergence_on_radiologist_audit_cycle
          rationale: "All three variant-bearing calculations are driven twice over identical data by the three §1.8 dual_variant_calc instances (PPV1 vs PPV3, image-based vs patient-based repeat rate, and the coverage-mandate variants), each asserting the pre-computed divergence rather than just the shape."

      - name: the_compliance_run_checkpoint_is_a_no_op_when_replayed_at_the_same_instant
        claim_type: ops_run_checkpoint
        grounds:
          - calculations.ce_and_volume_compliance
          - calculations.report_turnaround_and_followup_clock
          - calculations.facility_compliance_posture
          - entities.Facility.fields.last_compliance_run_at
        distinguishing_aspect: "The run is a checkpoint over the facility, not a per-request trigger: the first run at 2026-08-01 moves all three staff to GRACE (their qualifying read volume fell outside the 730-day lookback, though nothing was overdue enough to be DEFICIENT) and reports the survey-overdue census, and an immediate second run at the identical clock instant reports every *movement* counter as 0 while repeating the same census and the same posture. No entity version moves during the replay, which is what proves the counters are deltas and the census is not."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; CT policy (ce_grace_days 90, report_turnaround_days 30, followup_grace_days 60); one facility; one DBT_3D unit whose survey_compliance is the default OVERDUE."
            - "Three staff (physicist, technologist, radiologist), all QUALIFIED and COMPLIANT at creation."
            - "One screening exam performed 2026-07-20 and interpreted, so its report was never late."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_phys
            - *c_tech
            - *c_rad
            - *c_two_exams_a
            - *c_two_exams_a_read
          trigger:
            - call: "POST /facilities/${fac_id}/compliance-runs"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
            - call: "GET /personnel/${rad_id}"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { ck_rad_v1: $.data.version }
            - call: "POST /facilities/${fac_id}/compliance-runs"
              payload: {}
              as: QualityAssuranceOfficer
              as_user_id: "qa-1"
            - call: "GET /personnel/${rad_id}"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { ck_rad_v2: $.data.version }
          assert:
            - "First run — HTTP status == 200, ran_at == \"2026-08-01T00:00:00Z\", units_survey_overdue == 1, units_marked_reaccreditation_due == 0, exams_marked_delayed == 0, letters_marked_delivered == 0, orders_marked_lost == 0, personnel_moved_to_grace == 3, personnel_moved_to_deficient == 0, compliance_posture == \"CONDITIONAL\""
            - "After the first run — Personnel.${rad_id}.ce_status == GRACE, qualification_status still QUALIFIED, ce_deadline_at == \"2026-10-30T00:00:00Z\" (clock + ce_grace_days 90) and last_qualification_review_at == \"2026-08-01T00:00:00Z\""
            - "Facility.${fac_id}.last_compliance_run_at == \"2026-08-01T00:00:00Z\""
            - "Second run at the same instant — HTTP status == 200, ran_at == \"2026-08-01T00:00:00Z\", units_survey_overdue == 1 (the census repeats), and every movement counter is 0: units_marked_reaccreditation_due, exams_marked_delayed, letters_marked_delivered, orders_marked_lost, personnel_moved_to_grace, personnel_moved_to_deficient"
            - "Second run — compliance_posture == \"CONDITIONAL\" (the fixed point is unchanged)"
            - "${ck_rad_v2} == ${ck_rad_v1}: the replay rewrote nothing, so no version advanced and ce_deadline_at is still \"2026-10-30T00:00:00Z\" (it was not pushed out by a second grace grant)"
            - "Exam.${pk_a_id}.report_status is still INTERPRETED_FINAL after both runs (its report_due_at of 2026-08-19 is still in the future)"

  # ===========================================================================
  # §1.0 consistency_model = immediate: every write, including its cascades, is
  # visible in the same response and in an immediate re-read — never after a
  # delay, a retry or a sweep.
  - section: consistency_model
    instances:

      - name: a_write_and_its_derived_fields_are_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - calculations.report_turnaround_and_followup_clock
          - entities.Exam.fields.report_due_at
          - entities.Exam.fields.interpreted_late
          - state_machines.Exam.report_status.AWAITING_INTERPRETATION_to_INTERPRETED_FINAL
        distinguishing_aspect: "The interpretation response already carries every field the request derived — the retroactively tightened report_due_at (2026-07-27, the urgent 7-day rule replacing the routine 30-day one), interpreted_late true, recall_flag true and notification_status PENDING — and an immediate re-read returns exactly the same values, so nothing is computed lazily on first read."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; CT policy (report_turnaround_days 30, urgent_report_turnaround_days 7); one facility; one DBT_3D unit; qualified staff."
            - "One screening exam performed 2026-07-20 and still AWAITING_INTERPRETATION, carrying the routine due date 2026-08-19."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_tech
            - *c_rad
            - *c_dense_exam
          trigger:
            - call: "POST /exams/${dense_exam_id}/interpret"
              payload: { birads_assessment: 4, density_category: "C" }
              as: InterpretingPhysician
              as_user_id: "${rad_id}"
            - call: "GET /exams/${dense_exam_id}"
              payload: {}
              as: QualityAssuranceOfficer
              as_user_id: "qa-1"
          assert:
            - "The interpret response itself (HTTP 200) carries report_status \"INTERPRETED_FINAL\", interpreted_at \"2026-08-01T00:00:00Z\", report_due_at \"2026-07-27T00:00:00Z\", interpreted_late true, recall_flag true, density_category \"C\", notification_status \"PENDING\" and interpreting_physician_id == ${rad_id}"
            - "The immediate re-read by a different role returns byte-identical values for all of those fields"
            - "Exam.${dense_exam_id}.version is the same integer in both responses (the read did not advance it)"
            - "Before the interpretation the stored report_due_at was \"2026-08-19T00:00:00Z\" (performed_at + 30 routine days); no sweep or second request was needed to rewrite it to the urgent deadline"

      - name: cross_entity_cascades_are_visible_immediately_after_the_triggering_request
        claim_type: immediate
        grounds:
          - state_machines.MammographyUnit.operational_state.IN_SERVICE_to_OUT_OF_SERVICE
          - calculations.facility_compliance_posture
          - validations[priority=41]
          - errors[ERR_UNIT_NOT_IN_SERVICE]
        distinguishing_aspect: "A qualifying DETECTOR failure is filed and the unit is already unusable in the very next request: the failure response reports requires_post_repair_survey true, an immediate read of the unit shows OUT_OF_SERVICE with an advanced version, an immediate read of the facility shows the recomputed posture, and an exam acquisition attempted straight afterwards is refused 409 ERR_UNIT_NOT_IN_SERVICE. Nothing waits for a compliance run."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z; CT policy; one facility; one DBT_3D unit IN_SERVICE; qualified staff."
          setup_api_calls:
            - *c_clock
            - *c_pol_ct
            - *c_fac
            - *c_unit
            - *c_phys
            - *c_tech
            - *c_rad
            - call: "GET /units/${unit_id}"
              payload: {}
              as: AccreditationCoordinator
              as_user_id: "coord-1"
              captures: { im_u_v1: $.data.version }
          trigger:
            - call: "POST /units/${unit_id}/equipment-failures"
              payload: { failure_code: "DETECTOR", severity: "MAJOR", detected_at: "2026-07-31T00:00:00Z" }
              as: MedicalPhysicist
              as_user_id: "${phys_id}"
              captures: { im_fail_id: $.data.id }
            - call: "GET /units/${unit_id}"
              payload: {}
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { im_u_v2: $.data.version }
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: Technologist
              as_user_id: "${tech_id}"
            - call: "POST /exams"
              payload: { unit_id: "${unit_id}", technologist_id: "${tech_id}", patient_ref: "PT-8001", patient_state_code: "CT", exam_type: "SCREENING", performed_at: "2026-08-01T00:00:00Z", original_image_count: 4 }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { im_exam_err: $.data.error_id }
          assert:
            - "Failure response (HTTP 201) carries status \"OPEN\", severity \"MAJOR\", failure_code \"DETECTOR\" and requires_post_repair_survey true"
            - "Immediate unit read — operational_state == \"OUT_OF_SERVICE\", accreditation_status still \"PROVISIONAL\" and ${im_u_v2} == ${im_u_v1} + 1"
            - "Immediate facility read — compliance_posture == \"CONDITIONAL\" in the same response, with no second request needed to recompute it"
            - "Exam acquisition — HTTP status == 409 and ${im_exam_err} == \"ERR_UNIT_NOT_IN_SERVICE\", and GET /exams returns total_count == 0"
