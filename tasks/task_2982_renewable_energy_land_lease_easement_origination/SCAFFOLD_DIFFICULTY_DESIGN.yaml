  # ==========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: consent_grant_cascade_to_landowner_posture
        depth: 4
        grounds:
          - state_machines.NeighborConsent.REQUESTED_to_GRANTED
          - calculations.buildable_acres_derivation
          - state_machines.Parcel.SCREENING_to_QUALIFIED
          - state_machines.Landowner.PROSPECT_to_ENGAGED
          - entities.Parcel.fields.consent_released_acres
          - entities.NeighborConsent.fields.released_acres
        distinguishing_aspect: |
          Four-hop chain rooted at a NeighborConsent grant, ending in a different
          entity from the one written: consent GRANTED -> parcel acreage
          recomputed (released 16.00, encumbered 35.00 -> 19.00, buildable
          65.00 -> 81.00) -> parcel SCREENING -> QUALIFIED because buildable
          finally clears MIN_BUILDABLE_ACRES 80.00 -> Landowner PROSPECT ->
          ENGAGED. The acreage numbers are chosen so the chain only completes
          because the release is exactly large enough; the screening score never
          moves, which isolates the acreage path.
        test_recipe:
          setup:
            - "One Landowner 'Trinity Draw Family Trust' in PROSPECT, w9_on_file true."
            - "Exactly two SetbackRule rows for jurisdiction_code 48375, published before the parcel: PROPERTY_LINE with encumbrance_rate_per_acre 0.2000 and consent_waivable true, and OCCUPIED_DWELLING with encumbrance_rate_per_acre 0.1500 and consent_waivable false."
            - "One Parcel of 100.00 gross acres in county 48375, slope 4.0, grade B: slope_excluded_acres 0.00, raw_setback_acres 35.00 (20.00 + 15.00), buildable_acres 65.00, screening_score 82.15, screening_tier PRIORITY, status SCREENING because 65.00 < MIN_BUILDABLE_ACRES 80.00. The landowner is therefore still PROSPECT."
            - "One NeighborConsent in REQUESTED against the waivable PROPERTY_LINE rule, requested at the default clock 2026-08-01T00:00:00Z with consent_expiry_days 60."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Trinity Draw Family Trust", entity_type: "TRUST", mailing_state: "TX", contact_email: "trustee@trinitydraw.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l4_id: "$.data.id", l4_status0: "$.data.status" }
            - call: "POST /land-origination/setback-rules"
              payload: { jurisdiction_code: "48375", rule_type: "PROPERTY_LINE", setback_feet: 200, encumbrance_rate_per_acre: 0.2000, consent_waivable: true }
              as: TitleCounsel
              as_user_id: "tc-user-01"
              captures: { sr_w_id: "$.data.id" }
            - call: "POST /land-origination/setback-rules"
              payload: { jurisdiction_code: "48375", rule_type: "OCCUPIED_DWELLING", setback_feet: 600, encumbrance_rate_per_acre: 0.1500, consent_waivable: false }
              as: TitleCounsel
              as_user_id: "tc-user-01"
              captures: { sr_nw_id: "$.data.id" }
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-2375-901", county_fips: "48375", landowner_id: "${l4_id}", gross_acres: 100.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p_cons_id: "$.data.id", buildable0: "$.data.buildable_acres", pstatus0: "$.data.status" }
            - call: "POST /land-origination/neighbor-consents"
              payload: { parcel_id: "${p_cons_id}", setback_rule_id: "${sr_w_id}", neighbor_name: "H. Alvarado", consent_expiry_days: 60 }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { nc_id: "$.data.id" }
          trigger:
            - call: "POST /land-origination/neighbor-consents/${nc_id}/grant"
              payload: {}
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { nc_released: "$.data.released_acres" }
          assert:
            - "${l4_status0} == PROSPECT, ${buildable0} == 65.00, ${pstatus0} == SCREENING before the trigger"
            - "hop 1: NeighborConsent.${nc_id}.status == GRANTED and granted_at == 2026-08-01T00:00:00Z"
            - "hop 2: ${nc_released} == 16.00 (20.00 * CONSENT_RELEASE_FRACTION 0.80), Parcel.${p_cons_id}.consent_released_acres == 16.00, setback_encumbered_acres == 19.00, buildable_acres == 81.00"
            - "hop 3: Parcel.${p_cons_id}.status == QUALIFIED"
            - "hop 4: Landowner.${l4_id}.status == ENGAGED"
            - "Parcel.${p_cons_id}.raw_setback_acres == 35.00 (unchanged; the release lands in consent_released_acres, not in the raw figure)"
            - "Parcel.${p_cons_id}.screening_score == 82.15 and screening_tier == PRIORITY (unchanged, so the cascade is attributable to acreage alone)"
            - "gross_acres 100.00 == slope_excluded_acres 0.00 + setback_encumbered_acres 19.00 + buildable_acres 81.00"

      - name: curative_clear_releases_successor_and_rescores
        depth: 4
        grounds:
          - state_machines.TitleCurativeItem.OPEN_to_CLEARED
          - state_machines.TitleCurativeItem.BLOCKED_to_OPEN
          - entities.Parcel.fields.blocking_curative_open_count
          - entities.Parcel.fields.curative_cost_cents
          - calculations.parcel_screening_score.variants.FIELD_VERIFIED
        distinguishing_aspect: |
          A chain rooted in a different trigger family (title curative work, not
          neighbor consent) that propagates along the curative dependency edge
          rather than the acreage path: clearing item A releases its successor B
          from BLOCKED to OPEN, which drops blocking_curative_open_count from 2
          to 1, which re-scores the parcel under FIELD_VERIFIED from 67.15 (grade
          stepped to D) to 75.90 (grade stepped to C). Crucially the chain then
          STOPS: the parcel stays SCREENING and the landowner stays PROSPECT
          because one BLOCKING item is still open — the opposite terminal outcome
          from the consent instance above.
        test_recipe:
          setup:
            - "One Landowner 'Caprock Ranch Holdings LLC' in PROSPECT, three 48453 SetbackRule rows, and the 125.00-acre Parcel with buildable_acres 100.00."
            - "The parcel rescreened under FIELD_VERIFIED with zero curative items, so screen_mode is FIELD_VERIFIED and screening_score is still 82.15 with status QUALIFIED."
            - "TitleCurativeItem A: BLOCKING MINERAL_SEVERANCE, curative_cost_cents 450000, raised by tc-user-01, status OPEN. The parcel re-scores to 75.90 (grade B stepped one rung to C) and reverts to SCREENING, so the landowner falls back to PROSPECT."
            - "TitleCurativeItem B: BLOCKING MORTGAGE_SUBORDINATION, curative_cost_cents 275000, raised by tc-user-01 with blocks_item_id pointing at A, so it starts BLOCKED. blocking_curative_open_count becomes 2 and the parcel re-scores to 67.15 (two steps, grade D)."
