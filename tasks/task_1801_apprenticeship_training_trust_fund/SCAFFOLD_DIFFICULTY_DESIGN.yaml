              captures: { err: $.data.error_id }
          assert:
            - "posture_hold == COMPLIANCE_HOLD (E2's overdue DRAFT flipped the fund)"
            - "err == ERR_FUND_ON_COMPLIANCE_HOLD"
            - "EquipmentPurchase.${pur_id}.status == REQUESTED (unchanged)"
            - "FundingAllocation.${alloc_id}.encumbered_cents == 0"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: instructor_buffer_overlap
        grounds:
          - "calculations.instructor_overlap_check"
          - "errors[ERR_INSTRUCTOR_SCHEDULE_CONFLICT]"
        distinguishing_aspect: |
          Buffered interval semantics on the instructor resource: a gap of 29
          minutes after an existing class conflicts, while a gap of exactly 30
          minutes (the turnover buffer, gap >= 30) is accepted.
        test_recipe:
          setup: ["Fund F; class C1 instructor inst-1 scheduled 600-720 in SHOP-A."]
          setup_api_calls:
            - call: "POST /trust-funds"
              payload: { name: "JATC Training Fund" }
              as: TrustAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /classes"
              payload: { trust_fund_id: "${fund_id}", course_code: "CN-101", instructor_user_id: "inst-1", instructor_name: "I. Mason", instructor_rate_cents_per_hour: 6000, facility: "SHOP-A", rti_credit_value: 8, capacity: 10, start_minute: 600, end_minute: 720 }
              as: TrustAdmin
              captures: { cls1_id: $.data.id }
          trigger:
            - call: "POST /classes"
              payload: { trust_fund_id: "${fund_id}", course_code: "CN-102", instructor_user_id: "inst-1", instructor_name: "I. Mason", instructor_rate_cents_per_hour: 6000, facility: "SHOP-B", rti_credit_value: 8, capacity: 10, start_minute: 749, end_minute: 800 }
              as: TrustAdmin
              captures: { err: $.data.error_id }
            - call: "POST /classes"
              payload: { trust_fund_id: "${fund_id}", course_code: "CN-103", instructor_user_id: "inst-1", instructor_name: "I. Mason", instructor_rate_cents_per_hour: 6000, facility: "SHOP-C", rti_credit_value: 8, capacity: 10, start_minute: 750, end_minute: 870 }
              as: TrustAdmin
              captures: { cls3_id: $.data.id }
          assert:
            - "err == ERR_INSTRUCTOR_SCHEDULE_CONFLICT (gap 29 < 30-minute buffer)"
            - "TrainingClass.${cls3_id}.status == SCHEDULED (gap 30 == buffer is allowed)"

      - name: facility_half_open_overlap
        grounds:
          - "calculations.facility_overlap_check"
          - "errors[ERR_FACILITY_SCHEDULE_CONFLICT]"
        distinguishing_aspect: |
          Half-open [start, end) semantics on the facility resource (different
          resource and different interval arithmetic than the instructor buffer):
          a class starting exactly when another ends (adjacency, zero gap) is
          allowed, while a one-minute earlier start conflicts.
        test_recipe:
          setup: ["Fund F; class C1 facility SHOP-A scheduled 600-720 (instructor inst-a)."]
          setup_api_calls:
            - call: "POST /trust-funds"
              payload: { name: "JATC Training Fund" }
              as: TrustAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /classes"
              payload: { trust_fund_id: "${fund_id}", course_code: "CN-101", instructor_user_id: "inst-a", instructor_name: "A. One", instructor_rate_cents_per_hour: 6000, facility: "SHOP-A", rti_credit_value: 8, capacity: 10, start_minute: 600, end_minute: 720 }
              as: TrustAdmin
              captures: { cls1_id: $.data.id }
          trigger:
            - call: "POST /classes"
              payload: { trust_fund_id: "${fund_id}", course_code: "CN-102", instructor_user_id: "inst-b", instructor_name: "B. Two", instructor_rate_cents_per_hour: 6000, facility: "SHOP-A", rti_credit_value: 8, capacity: 10, start_minute: 720, end_minute: 740 }
              as: TrustAdmin
              captures: { cls2_id: $.data.id }
            - call: "POST /classes"
              payload: { trust_fund_id: "${fund_id}", course_code: "CN-103", instructor_user_id: "inst-c", instructor_name: "C. Three", instructor_rate_cents_per_hour: 6000, facility: "SHOP-A", rti_credit_value: 8, capacity: 10, start_minute: 719, end_minute: 740 }
              as: TrustAdmin
              captures: { err: $.data.error_id }
          assert:
            - "TrainingClass.${cls2_id}.status == SCHEDULED (start 720 == C1 end: half-open adjacency allowed)"
            - "err == ERR_FACILITY_SCHEDULE_CONFLICT (start 719 overlaps C1's [600, 720))"

  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: compensating_allocation_encumbrance
        grounds:
          - "calculations.allocation_remaining_cents"
          - "state_machines.EquipmentPurchase.REQUESTED_to_APPROVED"
          - "state_machines.EquipmentPurchase.APPROVED_to_CANCELLED"
        distinguishing_aspect: |
          Conserved quantity is allocation budget: approve (encumber +200000)
          followed by cancel (encumber -200000) returns encumbered_cents and
          remaining_cents to their pre-approval values with zero drift.
        test_recipe:
          setup:
            - "Funded fund (received 500000). Allocation A ACTIVE 500000 (proposed by admin-1, approved by cm-1); fund available 0. Purchase P 200000 REQUESTED by admin-1."
          setup_api_calls:
            - call: "POST /trust-funds"
              payload: { name: "JATC Training Fund" }
              as: TrustAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /employers"
              payload: { trust_fund_id: "${fund_id}", legal_name: "Ampere Electric LLC", agreement_rate_cents_per_hour: 500 }
              as: TrustAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /apprentices"
              payload: { trust_fund_id: "${fund_id}", employer_id: "${emp_id}", full_name: "Rae Torres", trade: "INSIDE_WIREMAN", journeyman_base_rate_cents: 4000 }
              as: TrustAdmin
              captures: { app_id: $.data.id }
            - call: "POST /apprentices/${app_id}/submit-registration"
              payload: { agency: "STATE" }
              as: TrustAdmin
            - call: "POST /apprentices/${app_id}/record-registration-decision"
              payload: { outcome: "REGISTERED" }
              as: TrustAdmin
            - call: "POST /apprentices/${app_id}/indenture"
              payload: {}
              as: TrustAdmin
            - call: "POST /contribution-reports"
              payload: { employer_id: "${emp_id}", period_year: 2026, period_month: 3, lines: [{ apprentice_id: "${app_id}", ojt_hours: 1000 }] }
              as: EmployerRep
              as_user_id: "${emp_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /contribution-reports/${rep_id}/submit"
              payload: {}
              as: EmployerRep
              as_user_id: "${emp_id}"
            - call: "POST /contribution-reports/${rep_id}/remit"
              payload: { amount_tendered_cents: 500000 }
              as: EmployerRep
              as_user_id: "${emp_id}"
            - call: "POST /funding-allocations"
              payload: { trust_fund_id: "${fund_id}", category: "EQUIPMENT", fiscal_year: 2026, amount_cents: 500000 }
              as: TrustAdmin
              as_user_id: "admin-1"
              captures: { alloc_id: $.data.id }
            - call: "GET /trust-funds/${fund_id}"
              as: TrustAdmin
              captures: { fund_v: $.data.version }
            - call: "POST /funding-allocations/${alloc_id}/approve"
              payload: { expected_trust_fund_version: "${fund_v}" }
              as: CommitteeMember
              as_user_id: "cm-1"
            - call: "POST /equipment-purchases"
              payload: { allocation_id: "${alloc_id}", description: "Cable tray bender", amount_cents: 200000 }
              as: TrustAdmin
              as_user_id: "admin-1"
              captures: { pur_id: $.data.id }
          trigger:
            - call: "POST /equipment-purchases/${pur_id}/approve"
              payload: {}
              as: CommitteeMember
              as_user_id: "cm-1"
            - call: "GET /funding-allocations/${alloc_id}"
              as: TrustAdmin
              captures: { enc_mid: $.data.encumbered_cents, rem_mid: $.data.remaining_cents }
            - call: "POST /equipment-purchases/${pur_id}/cancel"
              payload: {}
              as: TrustAdmin
            - call: "GET /funding-allocations/${alloc_id}"
              as: TrustAdmin
              captures: { enc_end: $.data.encumbered_cents, rem_end: $.data.remaining_cents }
          assert:
            - "enc_mid == 200000 (forward action encumbered)"
            - "rem_mid == 300000"
            - "enc_end == 0 (compensation restored the invariant)"
            - "rem_end == 500000"
            - "TrustFund.${fund_id}.available_cents == 0 (unchanged across the pair)"

      - name: compensating_apprentice_hours
        grounds:
          - "state_machines.ContributionReport.SUBMITTED_to_FLAGGED"
          - "state_machines.ContributionReport.FLAGGED_to_SUBMITTED"
          - "entities.Apprentice.fields.ojt_hours_accumulated"
        distinguishing_aspect: |
          Conserved quantity is credited OJT hours (a different quantity than
          allocation budget): submit credits 100 hours, flag suspends the report,
          and resubmission with identical lines must debit-before-credit so the
          apprentice still holds exactly 100 hours, not 200 and not 0.
        test_recipe:
          setup: ["Employer E (rate 500); apprentice A INDENTURED + REGISTERED; report R submitted with a 100-hour line."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: TrustAdmin
            - call: "POST /trust-funds"
              payload: { name: "JATC Training Fund" }
              as: TrustAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /employers"
              payload: { trust_fund_id: "${fund_id}", legal_name: "Ampere Electric LLC", agreement_rate_cents_per_hour: 500 }
              as: TrustAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /apprentices"
              payload: { trust_fund_id: "${fund_id}", employer_id: "${emp_id}", full_name: "Rae Torres", trade: "INSIDE_WIREMAN", journeyman_base_rate_cents: 4000 }
              as: TrustAdmin
              captures: { app_id: $.data.id }
            - call: "POST /apprentices/${app_id}/submit-registration"
              payload: { agency: "STATE" }
              as: TrustAdmin
            - call: "POST /apprentices/${app_id}/record-registration-decision"
              payload: { outcome: "REGISTERED" }
              as: TrustAdmin
            - call: "POST /apprentices/${app_id}/indenture"
              payload: {}
              as: TrustAdmin
            - call: "POST /contribution-reports"
              payload: { employer_id: "${emp_id}", period_year: 2026, period_month: 6, lines: [{ apprentice_id: "${app_id}", ojt_hours: 100 }] }
              as: EmployerRep
              as_user_id: "${emp_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /contribution-reports/${rep_id}/submit"
              payload: {}
              as: EmployerRep
              as_user_id: "${emp_id}"
          trigger:
            - call: "POST /contribution-reports/${rep_id}/flag"
              payload: { reason: "audit review" }
              as: TrustAdmin
            - call: "POST /contribution-reports/${rep_id}/resubmit"
              payload: { lines: [{ apprentice_id: "${app_id}", ojt_hours: 100 }] }
              as: EmployerRep
              as_user_id: "${emp_id}"
              captures: { due2: $.data.contribution_due_cents }
            - call: "GET /apprentices/${app_id}"
              as: TrustAdmin
              captures: { hours_end: $.data.ojt_hours_accumulated }
          assert:
            - "hours_end == 100 (no double-credit, no lost credit)"
            - "due2 == 50000 (recomputed identically at the unchanged rate)"
            - "Employer.${emp_id}.outstanding_cents == 50000"
