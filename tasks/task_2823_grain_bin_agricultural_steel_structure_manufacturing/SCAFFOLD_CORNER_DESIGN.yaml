              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              captures: { d1_id: $.data.id, d1_ver: $.data.version }
            - call: "POST /bin-designs/${d1_id}/analyses"
              payload: { design_method: "ASD", expected_bin_design_version: "${d1_ver}" }
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              captures: { an_id: $.data.id }
            - call: "POST /bin-designs/${d1_id}/submit-review"
              payload: {}
