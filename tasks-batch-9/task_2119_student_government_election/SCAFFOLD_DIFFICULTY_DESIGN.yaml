  - rule_id: compensating_invariant
    instances:

      - name: signature_verify_then_void_restores_valid_count
        grounds:
          - calculations.petition_ledger_conservation
          - calculations.petition_signature_valid_count
          - state_machines.PetitionSignature.SUBMITTED_to_VERIFIED
          - state_machines.PetitionSignature.VERIFIED_to_VOIDED
          - entities.Candidacy.fields.petition_signature_total_count
        distinguishing_aspect: |
          The conserved quantity is a row count: Candidacy.petition_signature_total_count stays 2
          across the verify/void pair while petition_signature_valid_count returns to exactly 1,
          its value before the forward action, and the five sub-counters still sum to the total.
        test_recipe:
          setup:
            - "One election in PETITIONING with one office requiring 2 valid signatures."
            - "Candidacy c_a is UNDER_REVIEW with two signatures: sig1 already VERIFIED and sig2 still SUBMITTED."
            - "Before the trigger the counters read valid 1, ineligible 0, pending 1, rejected 0, voided 0, total 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ElectionCommissioner
              as_user_id: "commissioner-1"
            - call: "POST /elections"
              payload: { title: "Fall 2026 SGA General", academic_year: "2026-2027", petition_deadline: "2026-09-01T00:00:00Z", spending_cap_cents: 50000, poster_cap: 50, quorum_pct: 25.00, runoff_threshold_pct: 50.00 }
              as: ElectionCommissioner
              as_user_id: "commissioner-1"
              captures: { e_id: $.data.id }
            - call: "POST /offices"
              payload: { election_id: "${e_id}", name: "President", eligible_class_years: ["JUNIOR", "SENIOR"], required_signature_count: 2, term_start_date: "2026-10-01T00:00:00Z", term_end_date: "2027-05-31T00:00:00Z" }
              as: ElectionCommissioner
              as_user_id: "commissioner-1"
              captures: { o_id: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Ava Stone", student_number: "S-1901", class_year: "SENIOR", gpa: 3.50, credits_completed: 95 }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { s_a_id: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Signer One", student_number: "S-1902", class_year: "JUNIOR", gpa: 3.00, credits_completed: 60 }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { s_g1_id: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Signer Two", student_number: "S-1903", class_year: "SENIOR", gpa: 3.00, credits_completed: 92 }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { s_g2_id: $.data.id }
            - call: "POST /elections/${e_id}/open-petitioning"
              payload: {}
              as: ElectionCommissioner
              as_user_id: "commissioner-1"
            - call: "POST /candidacies"
              payload: { election_id: "${e_id}", office_id: "${o_id}", student_id: "${s_a_id}" }
              as: Candidate
              as_user_id: "${s_a_id}"
              captures: { c_a_id: $.data.id }
            - call: "POST /candidacies/${c_a_id}/submit-petition"
              payload: {}
              as: Candidate
              as_user_id: "${s_a_id}"
            - call: "POST /petition-signatures"
              payload: { candidacy_id: "${c_a_id}", signer_student_id: "${s_g1_id}", signed_at: "2026-08-05T00:00:00Z" }
              as: StudentVoter
              as_user_id: "${s_g1_id}"
              captures: { sig1_id: $.data.id }
            - call: "POST /petition-signatures"
              payload: { candidacy_id: "${c_a_id}", signer_student_id: "${s_g2_id}", signed_at: "2026-08-06T00:00:00Z" }
              as: StudentVoter
              as_user_id: "${s_g2_id}"
              captures: { sig2_id: $.data.id }
            - call: "POST /petition-signatures/${sig1_id}/adjudicate"
              payload: { outcome: "VERIFIED" }
              as: ElectionCommissioner
              as_user_id: "commissioner-1"
          trigger:
            - call: "POST /petition-signatures/${sig2_id}/adjudicate"
              payload: { outcome: "VERIFIED" }
              as: ElectionCommissioner
              as_user_id: "commissioner-1"
            - call: "POST /petition-signatures/${sig2_id}/void"
              payload: { reason: "Signer was not enrolled on the signing date" }
              as: ElectionCommissioner
              as_user_id: "commissioner-1"
          assert:
            - "between the two trigger calls Candidacy.${c_a_id}.petition_signature_valid_count == 2"
            - "Candidacy.${c_a_id}.petition_signature_valid_count == 1"
            - "Candidacy.${c_a_id}.petition_signature_ineligible_count == 0"
            - "Candidacy.${c_a_id}.petition_signature_pending_count == 0"
            - "Candidacy.${c_a_id}.petition_signature_rejected_count == 0"
            - "Candidacy.${c_a_id}.petition_signature_voided_count == 1"
            - "Candidacy.${c_a_id}.petition_signature_total_count == 2"
            - "Candidacy.${c_a_id}.petition_signature_valid_count + Candidacy.${c_a_id}.petition_signature_ineligible_count + Candidacy.${c_a_id}.petition_signature_pending_count + Candidacy.${c_a_id}.petition_signature_rejected_count + Candidacy.${c_a_id}.petition_signature_voided_count == 2"
            - "PetitionSignature.${sig2_id}.status == VOIDED"
            - "Candidacy.${c_a_id}.status == UNDER_REVIEW"

      - name: expense_approve_then_reverse_restores_committed_cents
        grounds:
          - calculations.spend_ledger_conservation
          - calculations.campaign_spend_assessment
          - state_machines.CampaignExpense.REPORTED_to_APPROVED
          - state_machines.CampaignExpense.APPROVED_to_REVERSED
          - entities.Candidacy.fields.spending_reported_cents
        distinguishing_aspect: |
          A different kind of conserved quantity — money in cents rather than row counts:
          spending_reported_cents holds at 19500 across the approve/reverse pair while
          spending_committed_cents falls by exactly the 7000 cents of the reversed line and
          spending_reversed_cents rises by exactly 7000.
        test_recipe:
          setup:
            - "One election in PETITIONING with spending_cap_cents 500000 and one office."
            - "Candidacy c_a (status DRAFT) holds two REPORTED expenses: 12500 cents and 7000 cents."
            - "Before the trigger spending_reported_cents is 19500, spending_committed_cents is 19500 and spending_reversed_cents is 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ElectionCommissioner
              as_user_id: "commissioner-1"
            - call: "POST /elections"
              payload: { title: "Fall 2026 SGA General", academic_year: "2026-2027", petition_deadline: "2026-09-01T00:00:00Z", spending_cap_cents: 500000, poster_cap: 100, quorum_pct: 25.00, runoff_threshold_pct: 50.00 }
              as: ElectionCommissioner
              as_user_id: "commissioner-1"
              captures: { e_id: $.data.id }
            - call: "POST /offices"
              payload: { election_id: "${e_id}", name: "President", eligible_class_years: ["JUNIOR", "SENIOR"], required_signature_count: 0, term_start_date: "2026-10-01T00:00:00Z", term_end_date: "2027-05-31T00:00:00Z" }
              as: ElectionCommissioner
              as_user_id: "commissioner-1"
              captures: { o_id: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Ava Stone", student_number: "S-2201", class_year: "SENIOR", gpa: 3.50, credits_completed: 95 }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { s_a_id: $.data.id }
            - call: "POST /elections/${e_id}/open-petitioning"
              payload: {}
              as: ElectionCommissioner
              as_user_id: "commissioner-1"
            - call: "POST /candidacies"
              payload: { election_id: "${e_id}", office_id: "${o_id}", student_id: "${s_a_id}" }
              as: Candidate
              as_user_id: "${s_a_id}"
              captures: { c_a_id: $.data.id }
            - call: "POST /campaign-expenses"
              payload: { candidacy_id: "${c_a_id}", category: "POSTER", amount_cents: 12500, incurred_at: "2026-08-05T00:00:00Z", quantity: 30 }
              as: Candidate
              as_user_id: "${s_a_id}"
              captures: { x1_id: $.data.id }
            - call: "POST /campaign-expenses"
              payload: { candidacy_id: "${c_a_id}", category: "MERCH", amount_cents: 7000, incurred_at: "2026-08-06T00:00:00Z" }
              as: Candidate
              as_user_id: "${s_a_id}"
              captures: { x2_id: $.data.id }
          trigger:
            - call: "POST /campaign-expenses/${x2_id}/approve"
              payload: {}
              as: ElectionCommissioner
              as_user_id: "commissioner-1"
            - call: "POST /campaign-expenses/${x2_id}/reverse"
              payload: { reason: "Vendor refunded the order" }
              as: ElectionCommissioner
              as_user_id: "commissioner-1"
          assert:
            - "between the two trigger calls Candidacy.${c_a_id}.spending_committed_cents == 19500"
            - "Candidacy.${c_a_id}.spending_committed_cents == 12500"
            - "Candidacy.${c_a_id}.spending_reversed_cents == 7000"
            - "Candidacy.${c_a_id}.spending_reported_cents == 19500"
            - "Candidacy.${c_a_id}.spending_committed_cents + Candidacy.${c_a_id}.spending_reversed_cents == 19500"
            - "Candidacy.${c_a_id}.poster_count == 30"
            - "CampaignExpense.${x2_id}.status == REVERSED"
