      - name: finding_closure_cascade_posture_permit_analysis_revocation
        grounds:
          - state_machines.CriticalFinding.restriction_action.NONE_to_CLOSE
          - calculations.service_posture
          - calculations.inspection_interval_months
          - state_machines.PermitApplication.APPROVED_to_REVOKED
          - calculations.permit_bridge_rating_factor
        distinguishing_aspect: |
          Imposing CLOSE on a critical finding reaches four hops away into an entity the caller never
          names: (1) the finding's restriction dimension, (2) the Bridge service_posture and its
          shortened inspection interval, (3) every PermitBridgeAnalysis routed over that bridge is
          re-decided to DENIED with reason BRIDGE_CLOSED even though the analysis previously read
          ALLOWED with rating factor 1.000, (4) the already-APPROVED PermitApplication is driven to
          REVOKED. The permit was approved on numbers that are still valid; only the closure
          invalidates it, so an implementation that recomputes rating factors instead of honouring
          the posture override gets hop 3 wrong.
