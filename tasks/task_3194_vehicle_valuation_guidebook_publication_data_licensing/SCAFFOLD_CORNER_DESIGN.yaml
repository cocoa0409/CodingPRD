              payload: {}
              as: DataOps
            - call: "POST /valuation-series"
              payload: { configuration_id: "${cfg_exp}", region_id: "${r_exp}", effective_from: "2026-09-01T00:00:00Z", cadence: "WEEKLY", external_key: "ser-exp" }
              as: ValuationAdmin
              captures: { s_exp: $.data.id }
            - call: "POST /valuation-series/${s_exp}/activate"
              payload: {}
              as: ValuationAdmin
            - call: "POST /valuation-editions"
              payload: { series_id: "${s_exp}", effective_at: "2026-09-01T00:00:00Z" }
              as: ValuationAdmin
              captures: { e_exp: $.data.id }
            - call: "POST /valuation-editions/${e_exp}/publish"
              payload: {}
              as: ValuationAdmin
            - call: "POST /consumer-profiles"
              payload: { email: "exp@x.com", full_name: "Exp" }
              as: Consumer
              captures: { cons_exp: $.data.id }
            - call: "POST /cash-offers"
              payload: { edition_id: "${e_exp}", funding_dealer_id: "${src_exp}", consumer_id: "${cons_exp}", mileage: 20000, age_years: 2, declared_condition_tier: "GOOD", option_ids: [] }
