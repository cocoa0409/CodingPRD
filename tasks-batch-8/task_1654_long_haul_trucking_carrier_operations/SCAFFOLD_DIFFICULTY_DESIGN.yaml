            - { call: "POST /tractors", payload: { unit_number: "T-9", home_terminal: "DAL", odometer_miles: 100000, current_state_code: "TX", tank_capacity_gallons: 200, current_fuel_gallons: 150 }, as: FleetAdmin, captures: { tr: $.data.id } }
