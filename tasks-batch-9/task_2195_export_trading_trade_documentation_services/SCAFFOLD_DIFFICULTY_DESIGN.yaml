            - call: "POST /export-orders/${order_id}/shipment-lines"
              payload: { line_no: 1, goods_description: "CNC lathe module", hs_code: "845811", quantity: 120.000, uom: "EA", unit_price_usd: 1000.0000, line_discount_pct: 0, net_weight_kg: 1800.000, gross_weight_kg: 2000.000, package_count: 12 }
