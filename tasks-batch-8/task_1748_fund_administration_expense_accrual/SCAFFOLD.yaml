# =============================================================================
# SCAFFOLD.yaml — Fund Administration & Expense Accrual
# §1.0–§1.7 seed tables. Difficulty design (§1.8) and corner design (§1.9)
# live in SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Fund Administration & Expense Accrual (fund administrator): daily accounting & security pricing/valuation hierarchy, expense accrual & expense cap/waiver reimbursement, income & distribution calculation, financial statement & regulatory filing preparation, custodian & broker reconciliation breaks, performance calculation & benchmark comparison, fee calculation for adviser/administrator, audit support & year-end close

domain_name: fund-administration-expense-accrual
api_prefix: /

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation      # provisional vs final-priced NAV; ACT/365 vs ACT/360 accruals
    - rate_threshold_triggers       # annualized expense-ratio cap breach at strict > boundary
    - cascading_side_effects        # price override / break resolution / distribution reinvest chains
    - optimistic_concurrency        # OCC on NavRecord.version for finalize
  entity_topology: flat             # peer entities joined by FK references; no nested create paths
  state_machine_shape: cyclic       # NavRecord FINAL<->REOPENED loop, Filing amendment loop, Break reopen loop
  relationship_patterns:
    - one_to_many                   # Fund->ShareClass, ShareClass->Position/NavRecord/..., Security->PriceObservation
    - cross_aggregate               # ReconciliationBreak -> Position; cap test reads ExpenseAccrual + WaiverAgreement
  role_model: segregation_of_duties # preparer (FundAccountant/ComplianceOfficer) cannot approve own work (FundController)
  consistency_model: immediate      # every mutation + cascade is atomic within the request
  difficulty_level: expert          # 13 entities / 52 endpoints; scenario spans 8 distinct fund-admin workflows

# =============================================================================
# §1.1 Entity-Relationship Table
# Conventions: dates are ISO "YYYY-MM-DD" strings; money is a decimal number at
# 2dp half-up; nav_per_share at 4dp half-up. All entities carry common_fields
# (id, created_at, updated_at, version) unless common_fields: false.
# =============================================================================
entities:
  - name: Fund
    parent: null
    common_fields: true
    fields:
      - { name: fund_name, type: string, source: input, description: "Legal fund name" }
      - { name: ticker, type: string, source: input, description: "Fund ticker; unique across all funds", constraints: "unique" }
      - { name: base_currency, type: enum, source: input, description: "USD | EUR | GBP" }
      - { name: fiscal_year_end, type: string, source: input, description: "Fiscal year end as MM-DD, e.g. 12-31" }
      - { name: adviser_name, type: string, source: input, description: "Investment adviser legal name" }
      - { name: admin_fee_bps, type: number, source: input, description: "Administrator annual fee in basis points of net assets", constraints: "> 0" }
      - { name: adviser_fee_tiers, type: array, source: input, description: "Ordered marginal fee tiers [{up_to_net_assets: number|null, rate_bps: number}]; last tier must use up_to_net_assets null", constraints: "non-empty, ascending up_to_net_assets, exactly one null (last)" }
      - { name: day_count_convention, type: enum, source: input, description: "ACT_365 | ACT_360 — drives expense_accrual_daily variant" }
      - { name: last_closed_fiscal_year_end, type: string, source: system, description: "ISO date of last completed fiscal-year close; null until first close", default: null }

  - name: ShareClass
    parent: null
    common_fields: true
    fields:
      - { name: fund_id, type: string, source: input, description: "FK -> Fund.id" }
      - { name: class_ticker, type: string, source: input, description: "Share class ticker; unique within the fund", constraints: "unique per fund_id" }
      - { name: distribution_frequency, type: enum, source: input, description: "DAILY | MONTHLY | QUARTERLY | ANNUALLY" }
      - { name: shares_outstanding, type: number, source: system, description: "Starts 0; changed only by capital-activity and distribution reinvestment", default: 0 }
      - { name: retained_income, type: number, source: system, description: "Undistributed income balance (2dp); INCOME_POSTING increases, distribution pay decreases", default: 0 }

  - name: Security
    parent: null
    common_fields: true
    fields:
      - { name: security_identifier, type: string, source: input, description: "CUSIP/SEDOL; unique across all securities", constraints: "unique" }
      - { name: description, type: string, source: input, description: "Security description" }
      - { name: asset_class, type: enum, source: input, description: "EQUITY | FIXED_INCOME | CASH_EQUIVALENT | DERIVATIVE" }
      - { name: default_pricing_level, type: enum, source: input, description: "LEVEL_1 | LEVEL_2 | LEVEL_3 — expected valuation-hierarchy level" }
      - { name: currency, type: enum, source: input, description: "USD | EUR | GBP" }

  - name: Position
    parent: null
    common_fields: true
    fields:
      - { name: share_class_id, type: string, source: input, description: "FK -> ShareClass.id; the benchmark administers each class's portfolio sleeve separately" }
      - { name: security_id, type: string, source: input, description: "FK -> Security.id" }
      - { name: quantity, type: number, source: input, description: "Held quantity at creation; afterwards mutated only by reconciliation-break resolution", constraints: "> 0 at creation" }
      - { name: cost_basis_total, type: number, source: input, description: "Total cost basis (2dp)" }
      - { name: opened_date, type: string, source: input, description: "ISO date the position was opened" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED — auto-CLOSED when a break adjustment sets quantity to exactly 0", default: "OPEN" }

  - name: PriceObservation
    parent: null
    common_fields: true
    fields:
      - { name: security_id, type: string, source: input, description: "FK -> Security.id" }
      - { name: price_date, type: string, source: input, description: "ISO date the price is for; must be <= logical clock date" }
      - { name: price, type: number, source: input, description: "Observed price (as quoted, up to 4dp)", constraints: "> 0" }
      - { name: source, type: enum, source: input, description: "EXCHANGE_CLOSE | PRICING_SERVICE | BROKER_QUOTE on manual create; FAIR_VALUE_COMMITTEE is reserved — set only by the override endpoint" }
      - { name: pricing_level, type: enum, source: input, description: "LEVEL_1 | LEVEL_2 | LEVEL_3" }
      - { name: is_fair_value_override, type: boolean, source: system, description: "true only on observations created by POST /price-observations/{id}/override", default: false }
      - { name: status, type: enum, source: system, description: "SUBMITTED -> APPROVED -> OVERRIDDEN; SUBMITTED -> OVERRIDDEN also allowed", default: "SUBMITTED" }

  - name: NavRecord
    parent: null
    common_fields: true
    fields:
      - { name: share_class_id, type: string, source: input, description: "FK -> ShareClass.id" }
      - { name: accounting_date, type: string, source: input, description: "ISO date of this accounting record; unique per share class and strictly later than all existing records for the class" }
      - { name: status, type: enum, source: system, description: "ESTIMATED -> FINAL -> REOPENED -> FINAL (cycle)", default: "ESTIMATED" }
      - { name: pricing_variant_used, type: enum, source: computed, description: "PROVISIONAL while ESTIMATED; FINAL_PRICED once FINAL/REOPENED" }
      - { name: gross_asset_value, type: number, source: computed, description: "Sum of round2(quantity x selected price) over OPEN positions of the class, per security_price_selection under the record's variant" }
      - { name: expense_accrual_total, type: number, source: computed, description: "Sum of accrued_amount for the class's accruals on accounting_date with status IN {ESTIMATED, POSTED}" }
      - { name: total_net_assets, type: number, source: computed, description: "round2(gross_asset_value - expense_accrual_total)" }
      - { name: nav_per_share, type: number, source: computed, description: "round4(total_net_assets / shares_outstanding) under the record's variant" }
      - { name: provisional_nav_per_share, type: number, source: computed, description: "What-if nav_per_share under the PROVISIONAL variant (SUBMITTED+APPROVED prices eligible)" }
      - { name: final_nav_per_share, type: number, source: computed, description: "What-if nav_per_share under the FINAL_PRICED variant (APPROVED only); null if any held security lacks an APPROVED observation for accounting_date" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the creator; segregation-of-duties reference for finalize" }

  - name: ExpenseAccrual
    parent: null
    common_fields: true
    fields:
      - { name: share_class_id, type: string, source: input, description: "FK -> ShareClass.id" }
      - { name: accrual_date, type: string, source: input, description: "ISO date; must match an existing ESTIMATED NavRecord for the class (manual creates)" }
      - { name: category, type: enum, source: input, description: "ADMIN_FEE | CUSTODY_FEE | AUDIT_FEE | LEGAL_FEE | OTHER; ADMIN_FEE rows are system-generated only" }
      - { name: annual_rate_bps, type: number, source: input, description: "Annual rate in basis points; system-set from Fund.admin_fee_bps for ADMIN_FEE rows", constraints: "> 0" }
      - { name: base_net_assets, type: number, source: system, description: "Accrual base: prior FINAL record's total_net_assets, or current gross_asset_value when no prior FINAL exists" }
      - { name: accrued_amount, type: number, source: computed, description: "round2(base_net_assets x annual_rate_bps / 10000 / DAY_COUNT) per expense_accrual_daily" }
      - { name: status, type: enum, source: system, description: "ESTIMATED -> POSTED (on NavRecord finalize); returns to ESTIMATED if the record is reopened", default: "ESTIMATED" }

  - name: WaiverAgreement
    parent: null
    common_fields: true
    fields:
      - { name: share_class_id, type: string, source: input, description: "FK -> ShareClass.id" }
      - { name: cap_bps, type: number, source: input, description: "Annualized net expense cap in basis points", constraints: "> 0" }
      - { name: effective_from, type: string, source: input, description: "ISO first covered day (inclusive, closed interval)" }
      - { name: effective_to, type: string, source: input, description: "ISO last covered day (inclusive, closed interval); must be >= effective_from" }
      - { name: recovery_window_months, type: integer, source: input, description: "Months a waiver remains recoupable", constraints: "1..36" }
      - { name: status, type: enum, source: computed, description: "ACTIVE while logical clock date <= effective_to, else EXPIRED (derived, never stored)" }
      - { name: recoverable_balance, type: number, source: computed, description: "Sum of remaining_amount over the agreement's WAIVER ledger entries" }

  - name: WaiverLedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: waiver_agreement_id, type: string, source: system, description: "FK -> WaiverAgreement.id" }
      - { name: entry_type, type: enum, source: system, description: "WAIVER (created by expense_cap_test_and_waiver) | RECOUPMENT (created by recoupments endpoint)" }
      - { name: amount, type: number, source: system, description: "Positive 2dp amount" }
      - { name: entry_date, type: string, source: system, description: "WAIVER: accounting_date of the triggering NavRecord; RECOUPMENT: recoup_date" }
      - { name: expires_at, type: string, source: system, description: "WAIVER only: entry_date + recovery_window_months (same day-of-month, clamped to month end); null on RECOUPMENT" }
      - { name: remaining_amount, type: number, source: system, description: "WAIVER: starts equal to amount, drawn down by recoupment_waterfall; RECOUPMENT: 0" }

  - name: Distribution
    parent: null
    common_fields: true
    fields:
      - { name: share_class_id, type: string, source: input, description: "FK -> ShareClass.id" }
      - { name: declaration_date, type: string, source: input, description: "ISO declaration date" }
      - { name: ex_date, type: string, source: input, description: "ISO ex-dividend date" }
      - { name: record_date, type: string, source: input, description: "ISO record date" }
      - { name: payable_date, type: string, source: input, description: "ISO payable date; ordering declaration_date < ex_date <= record_date <= payable_date" }
      - { name: distributable_amount, type: number, source: system, description: "ShareClass.retained_income snapshot at declaration" }
      - { name: shares_snapshot, type: number, source: system, description: "ShareClass.shares_outstanding snapshot at declaration" }
      - { name: income_per_share, type: number, source: computed, description: "round4(distributable_amount / shares_snapshot) — per-share rounding happens FIRST per distribution_per_share" }
      - { name: total_amount, type: number, source: computed, description: "round2(income_per_share x shares_snapshot) — multiply AFTER per-share rounding" }
      - { name: status, type: enum, source: system, description: "DECLARED -> PAID | CANCELLED", default: "DECLARED" }
      - { name: reinvested_shares, type: number, source: system, description: "Shares issued on reinvested payment; null unless paid with reinvest=true", default: null }
      - { name: paid_at, type: datetime, source: system, description: "Logical-clock timestamp of payment; null until PAID", default: null }

  - name: ReconciliationBreak
    parent: null
    common_fields: true
    fields:
      - { name: fund_id, type: string, source: input, description: "FK -> Fund.id (denormalized scope for escalation sweep and filing gates)" }
      - { name: position_id, type: string, source: input, description: "FK -> Position.id" }
      - { name: break_type, type: enum, source: input, description: "CUSTODIAN_POSITION | BROKER_POSITION" }
      - { name: break_date, type: string, source: input, description: "ISO date of the reconciliation statement" }
      - { name: counterparty_quantity, type: number, source: input, description: "Quantity per custodian/broker statement", constraints: ">= 0" }
      - { name: book_quantity, type: number, source: system, description: "Position.quantity at break creation" }
      - { name: variance, type: number, source: computed, description: "counterparty_quantity - book_quantity; creating a break with variance == 0 is rejected" }
      - { name: resolution_type, type: enum, source: system, description: "null | NO_CHANGE | ADJUST_POSITION — set by resolve", default: null }
      - { name: prior_book_quantity, type: number, source: system, description: "Position.quantity captured before an ADJUST_POSITION resolution; restored by reopen", default: null }
      - { name: status, type: enum, source: system, description: "OPEN -> ESCALATED (sweep) -> RESOLVED; OPEN -> RESOLVED; RESOLVED -> OPEN (reopen)", default: "OPEN" }

  - name: FeeInvoice
    parent: null
    common_fields: true
    fields:
      - { name: fund_id, type: string, source: input, description: "FK -> Fund.id" }
      - { name: fee_type, type: enum, source: input, description: "ADVISER (tiered schedule) | ADMINISTRATOR (flat admin_fee_bps)" }
      - { name: period_start, type: string, source: input, description: "ISO first day of fee period (inclusive); must tile contiguously after the previous invoice for the same fund+fee_type" }
      - { name: period_end, type: string, source: input, description: "ISO last day of fee period (inclusive); must be >= period_start" }
      - { name: average_daily_net_assets, type: number, source: computed, description: "Mean of fund daily total net assets over FINAL NavRecords in the period (adviser_fee_tiered)" }
      - { name: gross_fee, type: number, source: computed, description: "Tiered (ADVISER) or flat (ADMINISTRATOR) fee before waiver offset" }
      - { name: waiver_offset, type: number, source: computed, description: "Sum of WAIVER ledger amounts with entry_date inside the period across the fund's classes" }
      - { name: net_fee, type: number, source: computed, description: "round2(max(0, gross_fee - waiver_offset))" }
      - { name: status, type: enum, source: system, description: "DRAFT -> APPROVED -> PAID", default: "DRAFT" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creator; segregation-of-duties reference for approve" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of approver; null until APPROVED", default: null }

  - name: RegulatoryFiling
    parent: null
    common_fields: true
    fields:
      - { name: fund_id, type: string, source: input, description: "FK -> Fund.id" }
      - { name: filing_type, type: enum, source: input, description: "N_PORT | N_CEN | ANNUAL_REPORT | SEMI_ANNUAL_REPORT" }
      - { name: period_end, type: string, source: input, description: "ISO period end; must be strictly before the logical clock date at approval time" }
      - { name: filing_deadline, type: string, source: system, description: "period_end + 60 days (N_PORT, ANNUAL_REPORT, SEMI_ANNUAL_REPORT) or + 75 days (N_CEN)" }
      - { name: status, type: enum, source: system, description: "DRAFT -> PENDING_REVIEW -> APPROVED -> FILED -> AMENDED -> PENDING_REVIEW (amendment cycle)", default: "DRAFT" }
      - { name: filed_at, type: datetime, source: system, description: "Logical-clock timestamp of latest filing; null until first FILED", default: null }
      - { name: filed_after_deadline, type: boolean, source: computed, description: "true when the latest filing date is strictly after filing_deadline" }
      - { name: prepared_by_user_id, type: string, source: system, description: "X-User-ID of creator (ComplianceOfficer); segregation-of-duties reference for approve" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of approver; null until APPROVED", default: null }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: NavRecord
    initial_state: ESTIMATED
    terminal_states: []
    transitions:
      - from: ESTIMATED
        to: FINAL
        trigger: "POST /nav-records/{nav_record_id}/finalize"
        actor: FundController
        preconditions:
          - "expected_nav_record_version matches current version (ERR_STALE_NAV_VERSION)"
          - "Caller X-User-ID != created_by_user_id (ERR_SOD_VIOLATION)"
          - "Every OPEN Position's security of the class has no SUBMITTED PriceObservation on accounting_date (ERR_PRICE_NOT_APPROVED)"
          - "Every OPEN Position's security has >= 1 APPROVED PriceObservation on accounting_date (ERR_PRICE_NOT_APPROVED)"
        side_effects:
          - "Recompute all computed fields under FINAL_PRICED variant; pricing_variant_used -> FINAL_PRICED"
          - "ExpenseAccrual rows for (share_class_id, accounting_date) move ESTIMATED -> POSTED"
          - "Runs expense_cap_test_and_waiver: on breach creates a WAIVER WaiverLedgerEntry; that entry's creation updates WaiverAgreement.recoverable_balance"
          - "increments NavRecord.version by 1"
      - from: REOPENED
        to: FINAL
        trigger: "POST /nav-records/{nav_record_id}/finalize"
        actor: FundController
        preconditions:
          - "Same as ESTIMATED -> FINAL"
        side_effects:
          - "Same as ESTIMATED -> FINAL (full recompute, accrual posting, cap test, version increment)"
      - from: FINAL
        to: REOPENED
        trigger: "POST /nav-records/{nav_record_id}/reopen"
        actor: FundController
        preconditions:
          - "This record is the latest (greatest accounting_date) NavRecord for the class (ERR_NAV_NOT_LATEST)"
          - "accounting_date falls after Fund.last_closed_fiscal_year_end (or no close yet) (ERR_NAV_LOCKED_FISCAL_CLOSED)"
        side_effects:
          - "ExpenseAccrual rows for (share_class_id, accounting_date) move POSTED -> ESTIMATED"
          - "Recompute computed fields (FINAL_PRICED variant); increments NavRecord.version by 1"
      - from: FINAL
        to: REOPENED
        trigger: "system (POST /price-observations/{price_observation_id}/override on an observation whose price_date equals this record's accounting_date, where this record is the latest NavRecord for a class holding that security)"
        actor: system
        preconditions: []
        side_effects:
          - "Triggered by the price-override cascade: record recomputes under FINAL_PRICED with the new selected price"
          - "If the record is the class's first record (accrual base is gross_asset_value), its ExpenseAccrual rows are recomputed; that recomputation re-runs expense_cap_test_and_waiver, which may create a WAIVER WaiverLedgerEntry, updating WaiverAgreement.recoverable_balance"
          - "increments NavRecord.version by 1"

  - entity: PriceObservation
    initial_state: SUBMITTED
    terminal_states: [OVERRIDDEN]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /price-observations/{price_observation_id}/approve"
        actor: PricingCommittee
        preconditions: []
        side_effects:
          - "Recompute the ESTIMATED NavRecord (if any) for each class holding the security on price_date; increments that NavRecord.version by 1"
      - from: SUBMITTED
        to: OVERRIDDEN
        trigger: "POST /price-observations/{price_observation_id}/override"
        actor: PricingCommittee
        preconditions: []
        side_effects:
          - "Creates a new PriceObservation: source=FAIR_VALUE_COMMITTEE, is_fair_value_override=true, status=APPROVED, same security_id and price_date, price=override_price"
          - "If the price_date's NavRecord for a holding class is FINAL and is the class's latest record: NavRecord FINAL -> REOPENED cascade (see NavRecord system transition)"
          - "If that NavRecord is ESTIMATED: recompute it in place; increments NavRecord.version by 1"
      - from: APPROVED
        to: OVERRIDDEN
        trigger: "POST /price-observations/{price_observation_id}/override"
        actor: PricingCommittee
        preconditions: []
        side_effects:
          - "Same side effects as SUBMITTED -> OVERRIDDEN"

  - entity: ExpenseAccrual
    initial_state: ESTIMATED
    terminal_states: []
    transitions:
      - from: ESTIMATED
        to: POSTED
        trigger: "system (NavRecord finalize for the same share_class_id + accrual_date)"
        actor: system
        preconditions: []
        side_effects:
          - "Included in NavRecord.expense_accrual_total as POSTED"
      - from: POSTED
        to: ESTIMATED
        trigger: "system (NavRecord reopen for the same share_class_id + accrual_date)"
        actor: system
        preconditions: []
        side_effects:
          - "accrued_amount recomputed if the record is the class's first (base = gross_asset_value)"

  - entity: Distribution
    initial_state: DECLARED
    terminal_states: [PAID, CANCELLED]
    transitions:
      - from: DECLARED
        to: PAID
        trigger: "POST /distributions/{distribution_id}/pay"
        actor: FundController
        preconditions:
          - "Logical clock date >= payable_date (ERR_DISTRIBUTION_NOT_PAYABLE)"
          - "If reinvest=true: a FINAL NavRecord exists for the class with accounting_date <= payable_date (ERR_NAV_NOT_FINAL)"
        side_effects:
          - "ShareClass.retained_income decreases by total_amount; paid_at set"
          - "If reinvest=true: reinvested_shares = round4(total_amount / nav_per_share of the FINAL NavRecord with greatest accounting_date <= payable_date); ShareClass.shares_outstanding increases by reinvested_shares"
          - "That shares_outstanding mutation recomputes the class's latest ESTIMATED NavRecord (if one exists); increments that NavRecord.version by 1"
      - from: DECLARED
        to: CANCELLED
        trigger: "POST /distributions/{distribution_id}/cancel"
        actor: FundController
        preconditions: []
        side_effects:
          - "No balance movement: retained_income and shares_outstanding unchanged (compensating invariant with declare)"

  - entity: ReconciliationBreak
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: ESCALATED
        trigger: "POST /reconciliation-breaks/escalate-overdue (system sweep)"
        actor: FundController
        preconditions:
          - "Logical clock date > break_date + BREAK_ESCALATION_DAYS (5 days); a break exactly 5 days old is NOT escalated"
        side_effects:
          - "ESCALATED breaks block RegulatoryFiling approve and fiscal-year-close"
      - from: OPEN
        to: RESOLVED
        trigger: "POST /reconciliation-breaks/{reconciliation_break_id}/resolve"
        actor: FundController
        preconditions: []
        side_effects:
          - "resolution_type=ADJUST_POSITION: prior_book_quantity = Position.quantity; Position.quantity = counterparty_quantity; Position auto-CLOSED if quantity becomes exactly 0"
          - "That Position mutation recomputes the class's latest ESTIMATED NavRecord (if any): gross_asset_value, and (first-record base rule) ExpenseAccrual amounts, then expense_accrual_total, total_net_assets, nav_per_share; increments that NavRecord.version by 1"
      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /reconciliation-breaks/{reconciliation_break_id}/resolve"
        actor: FundController
        preconditions: []
        side_effects:
          - "Same side effects as OPEN -> RESOLVED"
      - from: RESOLVED
        to: OPEN
        trigger: "POST /reconciliation-breaks/{reconciliation_break_id}/reopen"
        actor: FundController
        preconditions: []
        side_effects:
          - "Compensation: if resolution_type was ADJUST_POSITION, Position.quantity is restored to prior_book_quantity (CLOSED position with restored quantity > 0 returns to OPEN); resolution_type cleared"
          - "That Position restoration recomputes the class's latest ESTIMATED NavRecord (if any), same chain as resolve; increments that NavRecord.version by 1"

  - entity: FeeInvoice
    initial_state: DRAFT
    terminal_states: [PAID]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /fee-invoices/{fee_invoice_id}/approve"
        actor: FundController
        preconditions:
          - "Caller X-User-ID != created_by_user_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "approved_by_user_id set"
      - from: APPROVED
        to: PAID
        trigger: "POST /fee-invoices/{fee_invoice_id}/pay"
        actor: FundController
        preconditions: []
        side_effects: []

  - entity: RegulatoryFiling
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: PENDING_REVIEW
        trigger: "POST /regulatory-filings/{regulatory_filing_id}/submit-review"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: AMENDED
        to: PENDING_REVIEW
        trigger: "POST /regulatory-filings/{regulatory_filing_id}/submit-review"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: PENDING_REVIEW
        to: APPROVED
        trigger: "POST /regulatory-filings/{regulatory_filing_id}/approve"
        actor: FundController
        preconditions:
          - "Caller X-User-ID != prepared_by_user_id (ERR_SOD_VIOLATION)"
          - "No ReconciliationBreak with fund_id = filing's fund in status ESCALATED (ERR_BREAK_ESCALATED_BLOCKS)"
          - "period_end < logical clock date (ERR_PERIOD_NOT_ENDED)"
        side_effects:
          - "approved_by_user_id set"
      - from: APPROVED
        to: FILED
        trigger: "POST /regulatory-filings/{regulatory_filing_id}/file"
        actor: ComplianceOfficer
        preconditions:
          - "No ReconciliationBreak with fund_id = filing's fund in status ESCALATED (ERR_BREAK_ESCALATED_BLOCKS)"
        side_effects:
          - "filed_at set to logical clock; filed_after_deadline recomputed"
      - from: FILED
        to: AMENDED
        trigger: "POST /regulatory-filings/{regulatory_filing_id}/amend"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "approved_by_user_id cleared; amendment cycle re-enters at PENDING_REVIEW via submit-review"

  - entity: Position
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "system (ReconciliationBreak resolve with ADJUST_POSITION setting quantity to exactly 0)"
        actor: system
        preconditions: []
        side_effects:
          - "CLOSED positions are excluded from NavRecord valuation and from ERR_MISSING_PRICE / price-approval checks"
      - from: CLOSED
        to: OPEN
        trigger: "system (ReconciliationBreak reopen restoring prior_book_quantity > 0)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: nav-finalize-stale-version
    parent_entity: NavRecord
    write_endpoint: "POST /nav-records/{nav_record_id}/finalize"
    occ_field: "expected_nav_record_version"
    description: |
      Finalizing a NavRecord whose version has advanced since the client last
      observed it (for example because a manual ExpenseAccrual create, a price
      approval, or a cascade recomputed the record and bumped its version) is
      rejected: the client would finalize numbers it never saw. The client must
      re-read the record and resubmit with the current version.
    error_id: ERR_STALE_NAV_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# DAY_COUNT = 365 for ACT_365 funds, 360 for ACT_360 funds.
# round2 = 2dp round_half_up; round4 = 4dp round_half_up.
# =============================================================================
calculations:
  - name: security_price_selection
    trigger: "NavRecord creation, NavRecord recompute (price approve / fair-value override / break adjustment / reinvest cascades), and the provisional/final preview fields"
    algorithm: selector
    formula: |
      Candidate set for (security_id, price_date): PriceObservations with matching
      security_id and price_date whose status is in the variant's eligible set.
      Ranking (descending priority):
        1. is_fair_value_override DESC (a committee override always wins)
        2. pricing_level ASC (LEVEL_1 beats LEVEL_2 beats LEVEL_3)
        3. created_at DESC (within identical level, the latest submission wins)
      Fallback: if the candidate set is empty under the record's variant, that
      security has no selected price (blocks nav creation / nulls final preview).
      id is never used in selection, ranking, or tie-breaks.
    input_set: "PriceObservations for the security on the accounting_date; eligibility differs per variant"
    constants:
      LEVEL_ORDER: { LEVEL_1: 1, LEVEL_2: 2, LEVEL_3: 3 }
    precision: "prices used as quoted (up to 4dp); no rounding at selection"
    variants:
      - name: PROVISIONAL
        when: "NavRecord.status == ESTIMATED (and provisional_nav_per_share preview)"
        difference: "eligible statuses = {SUBMITTED, APPROVED} — unapproved quotes are admissible"
      - name: FINAL_PRICED
        when: "NavRecord.status IN {FINAL, REOPENED} (and final_nav_per_share preview)"
        difference: "eligible statuses = {APPROVED} — identical positions can price differently once SUBMITTED rows are excluded"

  - name: nav_computation
    trigger: "NavRecord creation and every recompute"
    algorithm: aggregation
    formula: |
      For each Position of the class with status OPEN:
        market_value_p = round2(quantity_p x selected_price_p)   # round PER POSITION first
      gross_asset_value = sum(market_value_p)                    # then sum
      expense_accrual_total = sum(accrued_amount of ExpenseAccrual for
        (share_class_id, accounting_date) with status IN {ESTIMATED, POSTED})
      total_net_assets = round2(gross_asset_value - expense_accrual_total)
      nav_per_share = round4(total_net_assets / ShareClass.shares_outstanding)
      Rounding order is pinned: per-position round2 BEFORE the sum. Summing raw
      products and rounding once yields different cents and is non-conformant.
    input_set: "OPEN Positions of the class; ExpenseAccruals of the class on accounting_date in {ESTIMATED, POSTED}"
    precision: "2dp half-up per position and for TNA; 4dp half-up for nav_per_share"

  - name: expense_accrual_daily
    trigger: "NavRecord creation (auto ADMIN_FEE row), POST /expense-accruals (manual rows), and recomputes of a class's first record"
    algorithm: chronological
    formula: |
      base_net_assets = total_net_assets of the class's FINAL NavRecord with the
        greatest accounting_date strictly before accrual_date; if no such FINAL
        record exists, base_net_assets = current gross_asset_value of the
        (ESTIMATED) record being built.
      accrued_amount = round2(base_net_assets x annual_rate_bps / 10000 / DAY_COUNT)
    input_set: "The class's NavRecords (FINAL only, accounting_date < accrual_date) for the base; Fund.admin_fee_bps for ADMIN_FEE rows"
    constants:
      ACT_365: 365
      ACT_360: 360
    precision: "2 decimal places, round_half_up"
    variants:
      - name: ACT_365
        when: "Fund.day_count_convention == ACT_365"
        difference: "divides by 365 — smaller daily accrual than ACT_360 for identical base and rate"
      - name: ACT_360
        when: "Fund.day_count_convention == ACT_360"
        difference: "divides by 360 — e.g. base 52340.00 at 10bps yields 0.15 vs 0.14 under ACT_365"

  - name: expense_cap_test_and_waiver
    trigger: "NavRecord finalize, and the recompute leg of the price-override cascade on a FINAL record"
    algorithm: threshold
    formula: |
      Evaluation order is pinned (breaks the apparent circle between accruals,
      net assets, and the cap):
        (1) select prices; (2) per-position market values -> gross_asset_value;
        (3) accruals from accrual base (per expense_accrual_daily);
        (4) total_net_assets = gross_asset_value - expense_accrual_total;
        (5) nav_per_share; (6) the cap ratio uses accrual base — never TNA;
        (7) any waiver is booked on the agreement ledger only and does NOT
            change the triggering record's TNA.
      Let A = expense_accrual_total, B = base_net_assets of that date's accruals
      (all rows of the class on accounting_date share one base).
      annualized_ratio_bps = round4(A x 365 / B x 10000)
      Agreement = the WaiverAgreement of the class with status ACTIVE whose
      [effective_from, effective_to] covers accounting_date (at most one exists
      per class per day by ERR_CAP_AGREEMENT_OVERLAP).
      Breach iff annualized_ratio_bps > cap_bps  (STRICTLY greater;
      ratio == cap is NOT a breach).
      waiver_amount = round2(min(A, (annualized_ratio_bps - cap_bps) / 10000 x B / 365))
      If waiver_amount > 0: create WaiverLedgerEntry(type=WAIVER,
        amount=waiver_amount, entry_date=accounting_date,
        expires_at=entry_date + recovery_window_months,
        remaining_amount=waiver_amount).
    input_set: "The class's accruals on accounting_date; the covering ACTIVE WaiverAgreement"
    constants:
      ANNUALIZATION_DAYS: 365
    precision: "ratio at 4dp half-up; waiver at 2dp half-up"

  - name: adviser_fee_tiered
    trigger: "POST /fee-invoices"
    algorithm: tiered_pricing
    formula: |
      days = (period_end - period_start).days + 1            # inclusive day count
      Per calendar date d in [period_start, period_end]:
        fund_tna_d = sum of total_net_assets over FINAL NavRecords (all classes
        of the fund) with accounting_date == d. Dates with no FINAL record are
        excluded from both numerator and denominator.
      If no date in the period has any FINAL record: ERR_NO_FINAL_NAV_IN_PERIOD.
      average_daily_net_assets = sum(fund_tna_d) / count(dates with FINAL records)
      ADVISER gross (marginal tiers, Fund.adviser_fee_tiers ascending):
        prev = 0; units = 0
        for tier in tiers:
          hi = tier.up_to_net_assets or +inf
          units += max(0, min(average_daily_net_assets, hi) - prev) x tier.rate_bps
          prev = hi
      ADMINISTRATOR gross units = average_daily_net_assets x Fund.admin_fee_bps
      gross_fee = round2(units / 10000 x days / 365)
      waiver_offset = sum of WaiverLedgerEntry.amount with entry_type=WAIVER and
        entry_date in [period_start, period_end] over all agreements of the fund's classes
      net_fee = round2(max(0, gross_fee - waiver_offset))
    input_set: "FINAL NavRecords of the fund's classes in the period; Fund.adviser_fee_tiers / admin_fee_bps; WAIVER entries in the period"
    constants:
      FEE_YEAR_DAYS: 365
    precision: "2 decimal places, round_half_up; ADNA unrounded until the final multiplication"

  - name: distribution_per_share
    trigger: "POST /distributions (computed at declaration from snapshots)"
    algorithm: aggregation
    formula: |
      distributable_amount = ShareClass.retained_income at declaration (snapshot)
      shares_snapshot = ShareClass.shares_outstanding at declaration (snapshot)
      income_per_share = round4(distributable_amount / shares_snapshot)   # per-share FIRST
      total_amount = round2(income_per_share x shares_snapshot)           # multiply AFTER
      Multiplying first and rounding the total (round2(distributable_amount))
      yields a different payable and is non-conformant: e.g. retained 51.00 over
      100000 shares -> income_per_share 0.0005, total_amount 50.00, not 51.00.
    input_set: "ShareClass.retained_income and shares_outstanding snapshots"
    precision: "4dp half-up per share; 2dp half-up total"

  - name: recoupment_waterfall
    trigger: "POST /waiver-agreements/{waiver_agreement_id}/recoupments"
    algorithm: waterfall_allocation
    formula: |
      Eligible entries: the agreement's WaiverLedgerEntry rows with
      entry_type=WAIVER, remaining_amount > 0, and expires_at >= recoup_date
      (window is INCLUSIVE: a recoupment dated exactly expires_at is allowed).
      If no eligible entries: ERR_RECOUP_WINDOW_EXPIRED.
      If amount > sum(eligible remaining_amount): ERR_RECOUP_AMOUNT_EXCEEDS_BALANCE.
      Draw order: entry_date ASC, then created_at ASC. Take
      min(remaining_amount, amount_left) from each until amount is satisfied.
      Create one RECOUPMENT entry (amount=requested, entry_date=recoup_date).
      recoverable_balance recomputes as sum of remaining_amount over WAIVER rows.
    input_set: "WAIVER entries of the agreement"
    precision: "2 decimal places, round_half_up"

  - name: break_variance
    trigger: "POST /reconciliation-breaks and resolve/reopen"
    algorithm: constraint_propagation
    formula: |
      variance = counterparty_quantity - book_quantity (book = Position.quantity at creation)
      resolve ADJUST_POSITION: prior_book_quantity = Position.quantity;
        Position.quantity = counterparty_quantity; Position CLOSED iff result == 0.
      reopen: Position.quantity = prior_book_quantity; Position re-OPENs if restored > 0.
      Compensating invariant: resolve(ADJUST_POSITION) followed by reopen leaves
      Position.quantity exactly equal to its pre-resolve value.
    input_set: "The linked Position"
    precision: "quantities unrounded integers/decimal quantities as entered"

  - name: performance_return
    trigger: "GET /share-classes/{share_class_id}/performance"
    algorithm: aggregation
    formula: |
      begin = FINAL NavRecord of the class with smallest accounting_date >= from_date
      end   = FINAL NavRecord of the class with largest  accounting_date <= to_date
      If either is absent: ERR_NO_FINAL_NAV_IN_PERIOD.
      dps = sum(income_per_share of PAID Distributions of the class with
        payable_date in (begin.accounting_date, end.accounting_date])
      period_return_pct = round4(((end.nav_per_share + dps) / begin.nav_per_share - 1) x 100)
      excess_return_pct = round4(period_return_pct - benchmark_return_pct)
    input_set: "FINAL NavRecords of the class; PAID Distributions of the class"
    precision: "4 decimal places, round_half_up"

  - name: trial_balance_composition
    trigger: "GET /funds/{fund_id}/trial-balance"
    algorithm: aggregation
    formula: |
      For each ShareClass of the fund: take the FINAL NavRecord with greatest
      accounting_date <= as_of_date (classes without one contribute zero).
      total_market_value = sum(gross_asset_value); total_accrued_expenses =
      sum(expense_accrual_total); total_net_assets = sum(total_net_assets).
      If no class has a FINAL record <= as_of_date: ERR_NO_FINAL_NAV_IN_PERIOD.
    input_set: "FINAL NavRecords of the fund's classes with accounting_date <= as_of_date"
    precision: "2 decimal places, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — first match wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of the declared roles; X-User-ID header present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: existence
    check: "Every id in the path resolves to an existing resource"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 3
    category: auth
    check: "Caller role is in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 4
    category: existence
    check: "Request body shape: required fields present, no unknown fields, correct types/enums, numeric ranges (price > 0, quantity > 0 at create, counterparty_quantity >= 0, cap_bps > 0, annual_rate_bps > 0, recovery_window_months in 1..36, effective_to >= effective_from, period_end >= period_start, amount > 0, shares > 0 when supplied, to_iso8601 well-formed); body must not contain system fields id/created_at/updated_at/version"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all
  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is defined (e.g. finalize only from ESTIMATED/REOPENED, pay only from DECLARED, approve only from PENDING_REVIEW, file only from APPROVED, amend only from FILED, override only from SUBMITTED/APPROVED, resolve only from OPEN/ESCALATED, reopen only from RESOLVED/FINAL-latest); recoupment only against a WaiverAgreement whose derived status is ACTIVE (ERR_AGREEMENT_NOT_ACTIVE)"
    error_id: "ERR_INVALID_STATE | ERR_AGREEMENT_NOT_ACTIVE"
    http_status: 409
    applies_to: "all state-transition endpoints; POST /waiver-agreements/{id}/recoupments (agreement status)"
  - priority: 5b
    category: state
    check: "OCC: expected_nav_record_version must equal the NavRecord's current version at finalize"
    error_id: ERR_STALE_NAV_VERSION
    http_status: 412
    applies_to: "POST /nav-records/{id}/finalize"
  - priority: 6
    category: business_safety
    check: "Segregation of duties: on finalize/approve endpoints the caller's X-User-ID must differ from the resource's created_by_user_id / prepared_by_user_id"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "POST /nav-records/{id}/finalize, POST /fee-invoices/{id}/approve, POST /regulatory-filings/{id}/approve"
  - priority: 7
    category: business_safety
    check: "Compliance gates: no ReconciliationBreak in ESCALATED for the fund (filing approve/file); fiscal-year-close requires every NavRecord of the fund's classes in the fiscal year FINAL, no break OPEN or ESCALATED, every RegulatoryFiling whose period_end lies in the fiscal year FILED"
    error_id: "ERR_BREAK_ESCALATED_BLOCKS | ERR_FISCAL_CLOSE_BLOCKED"
    http_status: 409
    applies_to: "POST /regulatory-filings/{id}/approve, POST /regulatory-filings/{id}/file, POST /funds/{id}/fiscal-year-close"
  - priority: 8
    category: business_temporal
    check: "Temporal rules against the logical clock: price_date <= clock date; filing period_end < clock date at approve; distribution payable_date <= clock date at pay; recoup requires eligible unexpired waiver entries; clock moves strictly forward; fiscal_year_end_date must be <= logical clock date"
    error_id: "ERR_PRICE_DATE_FUTURE | ERR_PERIOD_NOT_ENDED | ERR_DISTRIBUTION_NOT_PAYABLE | ERR_RECOUP_WINDOW_EXPIRED | ERR_CLOCK_REGRESSION"
    http_status: 422
    applies_to: "POST /price-observations, POST /regulatory-filings/{id}/approve, POST /distributions/{id}/pay, POST /waiver-agreements/{id}/recoupments, POST /_clock/set_current_utc, POST /funds/{id}/fiscal-year-close"
  - priority: 9
    category: business_constraint
    check: "Constraint checks: fund ticker unique (ERR_TICKER_ALREADY_EXISTS); class ticker unique per fund (ERR_TICKER_ALREADY_EXISTS); NavRecord accounting_date strictly later than all existing for the class (ERR_NAV_DATE_NOT_SEQUENTIAL); at most one non-OVERRIDDEN PriceObservation per (security_id, price_date, source) (ERR_DUPLICATE_PRICE_SOURCE); manual PriceObservation source must not be FAIR_VALUE_COMMITTEE (ERR_OVERRIDE_SOURCE_RESERVED); NavRecord create requires every OPEN position's security to have >= 1 observation of any status on accounting_date (ERR_MISSING_PRICE); finalize requires no SUBMITTED and >= 1 APPROVED observation per held security (ERR_PRICE_NOT_APPROVED); manual accrual requires matching ESTIMATED NavRecord (ERR_NO_ESTIMABLE_NAV) and non-ADMIN_FEE category (ERR_CATEGORY_SYSTEM_MANAGED); waiver agreements of one class have non-overlapping closed day-intervals among status=ACTIVE (ERR_CAP_AGREEMENT_OVERLAP); fee invoice period_start == previous period_end + 1 day for same fund+fee_type when a prior invoice in {DRAFT, APPROVED, PAID} exists (ERR_FEE_PERIOD_NOT_CONTIGUOUS); fee period contains >= 1 FINAL record (ERR_NO_FINAL_NAV_IN_PERIOD); break requires variance != 0 (ERR_NO_VARIANCE); distribution date ordering declaration < ex <= record <= payable (ERR_DISTRIBUTION_DATE_ORDER); distribution declare requires the class's latest NavRecord FINAL (ERR_NAV_NOT_FINAL); reinvest pay requires a FINAL record <= payable_date (ERR_NAV_NOT_FINAL); reopen requires latest record (ERR_NAV_NOT_LATEST) and fiscal year open (ERR_NAV_LOCKED_FISCAL_CLOSED); performance/trial-balance require FINAL records in range (ERR_NO_FINAL_NAV_IN_PERIOD)"
    error_id: "ERR_TICKER_ALREADY_EXISTS | ERR_NAV_DATE_NOT_SEQUENTIAL | ERR_DUPLICATE_PRICE_SOURCE | ERR_OVERRIDE_SOURCE_RESERVED | ERR_MISSING_PRICE | ERR_PRICE_NOT_APPROVED | ERR_NO_ESTIMABLE_NAV | ERR_CATEGORY_SYSTEM_MANAGED | ERR_CAP_AGREEMENT_OVERLAP | ERR_FEE_PERIOD_NOT_CONTIGUOUS | ERR_NO_FINAL_NAV_IN_PERIOD | ERR_NO_VARIANCE | ERR_DISTRIBUTION_DATE_ORDER | ERR_NAV_NOT_FINAL | ERR_NAV_NOT_LATEST | ERR_NAV_LOCKED_FISCAL_CLOSED"
    http_status: "409 | 422"
    applies_to: "create and transition endpoints per rule"
  - priority: 10
    category: business_fiscal
    check: "Fiscal checks last: NavRecord create requires shares_outstanding > 0 (ERR_NO_SHARES_OUTSTANDING); REDEMPTION shares <= shares_outstanding (ERR_REDEMPTION_EXCEEDS_SHARES); recoup amount <= eligible unexpired balance (ERR_RECOUP_AMOUNT_EXCEEDS_BALANCE); distribution declare requires retained_income > 0 (ERR_NO_DISTRIBUTABLE_INCOME)"
    error_id: "ERR_NO_SHARES_OUTSTANDING | ERR_REDEMPTION_EXCEEDS_SHARES | ERR_RECOUP_AMOUNT_EXCEEDS_BALANCE | ERR_NO_DISTRIBUTABLE_INCOME"
    http_status: 422
    applies_to: "POST /nav-records, POST /share-classes/{id}/capital-activity, POST /waiver-agreements/{id}/recoupments, POST /distributions"

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table (52 endpoints)
# Roles shorthand: ALL = [FundAccountant, FundController, PricingCommittee, ComplianceOfficer]
# =============================================================================
endpoints:
  # --- Fund ---
  - { method: POST, path: "/funds", description: "Create a fund", roles: [FundController], code: 201, input: [fund_name, ticker, base_currency, fiscal_year_end, adviser_name, admin_fee_bps, adviser_fee_tiers, day_count_convention], output: Fund, side_effects: ["last_closed_fiscal_year_end = null"] }
  - { method: GET, path: "/funds/{fund_id}/trial-balance", description: "Audit-support computed read: trial balance aggregates from the latest FINAL NavRecords <= as_of_date", roles: [FundAccountant, FundController, PricingCommittee, ComplianceOfficer], code: 200, input: [as_of_date], output: "{ as_of_date: string, total_market_value: number, total_accrued_expenses: number, total_net_assets: number }", side_effects: [] }
  - { method: POST, path: "/funds/{fund_id}/fiscal-year-close", description: "Year-end close: requires fiscal_year_end_date matching the fund fiscal MM-DD and <= the logical clock date, all in-year NavRecords FINAL, no OPEN/ESCALATED breaks, all in-year filings FILED; locks reopen for the closed year", roles: [FundController], code: 200, input: [fiscal_year_end_date], output: Fund, side_effects: ["Fund.last_closed_fiscal_year_end = fiscal_year_end_date", "NavRecords with accounting_date in the closed fiscal year can no longer be reopened"] }

  # --- ShareClass ---
  - { method: POST, path: "/share-classes", description: "Create a share class for a fund", roles: [FundController], code: 201, input: [fund_id, class_ticker, distribution_frequency], output: ShareClass, side_effects: ["shares_outstanding = 0, retained_income = 0"] }
  - { method: GET, path: "/share-classes/{share_class_id}", description: "Get a share class", roles: [FundAccountant, FundController, PricingCommittee, ComplianceOfficer], code: 200, input: [], output: ShareClass, side_effects: [] }
  - { method: GET, path: "/share-classes", description: "List share classes, optionally filtered by fund", roles: [FundAccountant, FundController, PricingCommittee, ComplianceOfficer], code: 200, input: ["fund_id?", "limit?", "offset?"], output: "ShareClass[]", side_effects: [] }
  - { method: POST, path: "/share-classes/{share_class_id}/capital-activity", description: "Record SUBSCRIPTION (shares += shares), REDEMPTION (shares -= shares), or INCOME_POSTING (retained_income += amount)", roles: [FundAccountant], code: 200, input: [activity_type, activity_date, "shares?", "amount?"], output: ShareClass, side_effects: ["SUBSCRIPTION/REDEMPTION require shares > 0; INCOME_POSTING requires amount > 0; REDEMPTION of exactly all shares is allowed", "increments ShareClass.version by 1"] }
  - { method: GET, path: "/share-classes/{share_class_id}/performance", description: "Performance vs benchmark over [from_date, to_date] per performance_return", roles: [FundAccountant, FundController, PricingCommittee, ComplianceOfficer], code: 200, input: [from_date, to_date, benchmark_return_pct], output: "{ begin_nav_per_share: number, end_nav_per_share: number, distributions_per_share_total: number, period_return_pct: number, benchmark_return_pct: number, excess_return_pct: number }", side_effects: [] }

  # --- Security ---
  - { method: POST, path: "/securities", description: "Create a security", roles: [FundAccountant], code: 201, input: [security_identifier, description, asset_class, default_pricing_level, currency], output: Security, side_effects: [] }
  - { method: GET, path: "/securities/{security_id}", description: "Get a security", roles: [FundAccountant, FundController, PricingCommittee, ComplianceOfficer], code: 200, input: [], output: Security, side_effects: [] }
  - { method: GET, path: "/securities/{id}/prices", description: "List price observations of a security (FK reverse reachability)", roles: [FundAccountant, FundController, PricingCommittee, ComplianceOfficer], code: 200, input: ["price_date?", "status?", "limit?", "offset?"], output: "PriceObservation[]", side_effects: [] }

  # --- Position ---
  - { method: POST, path: "/positions", description: "Open a position for a share class", roles: [FundAccountant], code: 201, input: [share_class_id, security_id, quantity, cost_basis_total, opened_date], output: Position, side_effects: ["status = OPEN"] }
  - { method: GET, path: "/positions/{position_id}", description: "Get a position", roles: [FundAccountant, FundController, PricingCommittee, ComplianceOfficer], code: 200, input: [], output: Position, side_effects: [] }
  - { method: GET, path: "/positions", description: "List positions filtered by class/security/status", roles: [FundAccountant, FundController, PricingCommittee, ComplianceOfficer], code: 200, input: ["share_class_id?", "security_id?", "status?", "limit?", "offset?"], output: "Position[]", side_effects: [] }

  # --- PriceObservation ---
  - { method: POST, path: "/price-observations", description: "Submit a price observation (SUBMITTED)", roles: [FundAccountant], code: 201, input: [security_id, price_date, price, source, pricing_level], output: PriceObservation, side_effects: ["status = SUBMITTED", "recomputes the ESTIMATED NavRecord (if any) of each class holding the security on price_date"] }
  - { method: POST, path: "/price-observations/{price_observation_id}/approve", description: "Approve a SUBMITTED observation", roles: [PricingCommittee], code: 200, input: [], output: PriceObservation, side_effects: ["status -> APPROVED", "recomputes affected ESTIMATED NavRecords; increments their version"] }
  - { method: POST, path: "/price-observations/{price_observation_id}/override", description: "Fair-value override: supersedes this observation with a FAIR_VALUE_COMMITTEE APPROVED observation", roles: [PricingCommittee], code: 201, input: [override_price, pricing_level], output: PriceObservation, side_effects: ["original -> OVERRIDDEN; new observation created APPROVED with is_fair_value_override=true", "FINAL latest NavRecord on price_date -> REOPENED + recompute cascade (incl. accrual recompute and cap re-test on first-record bases)", "ESTIMATED record on price_date -> recompute in place; increments version"] }

  # --- NavRecord ---
  - { method: POST, path: "/nav-records", description: "Create the daily accounting record for a class (ESTIMATED) and auto-generate its ADMIN_FEE accrual", roles: [FundAccountant], code: 201, input: [share_class_id, accounting_date], output: NavRecord, side_effects: ["computes nav_computation fields under PROVISIONAL variant", "creates one ADMIN_FEE ExpenseAccrual (ESTIMATED) per expense_accrual_daily"] }
  - { method: GET, path: "/nav-records/{nav_record_id}", description: "Get a NavRecord", roles: [FundAccountant, FundController, PricingCommittee, ComplianceOfficer], code: 200, input: [], output: NavRecord, side_effects: [] }
  - { method: GET, path: "/nav-records", description: "List NavRecords filtered by class/status/date", roles: [FundAccountant, FundController, PricingCommittee, ComplianceOfficer], code: 200, input: ["share_class_id?", "status?", "accounting_date?", "limit?", "offset?"], output: "NavRecord[]", side_effects: [] }
  - { method: POST, path: "/nav-records/{nav_record_id}/finalize", description: "Finalize an ESTIMATED or REOPENED record (OCC-guarded; preparer cannot finalize own record)", roles: [FundController], code: 200, input: [expected_nav_record_version], output: NavRecord, side_effects: ["status -> FINAL; FINAL_PRICED recompute", "date's accruals ESTIMATED -> POSTED", "runs expense_cap_test_and_waiver (may create WAIVER ledger entry, updating WaiverAgreement.recoverable_balance)", "increments NavRecord.version by 1"] }
  - { method: POST, path: "/nav-records/{nav_record_id}/reopen", description: "Reopen the latest FINAL record (blocked once the fiscal year is closed)", roles: [FundController], code: 200, input: [], output: NavRecord, side_effects: ["status -> REOPENED", "date's accruals POSTED -> ESTIMATED", "recompute; increments NavRecord.version by 1"] }

  # --- ExpenseAccrual ---
  - { method: POST, path: "/expense-accruals", description: "Manually add a non-ADMIN_FEE accrual to an ESTIMATED NavRecord's date", roles: [FundAccountant], code: 201, input: [share_class_id, accrual_date, category, annual_rate_bps], output: ExpenseAccrual, side_effects: ["recomputes the matching ESTIMATED NavRecord (expense_accrual_total, total_net_assets, nav_per_share); increments NavRecord.version by 1"] }
  - { method: GET, path: "/expense-accruals/{expense_accrual_id}", description: "Get a single accrual", roles: [FundAccountant, FundController, PricingCommittee, ComplianceOfficer], code: 200, input: [], output: ExpenseAccrual, side_effects: [] }
  - { method: GET, path: "/expense-accruals", description: "List accruals filtered by class/date/category/status", roles: [FundAccountant, FundController, PricingCommittee, ComplianceOfficer], code: 200, input: ["share_class_id?", "accrual_date?", "category?", "status?", "limit?", "offset?"], output: "ExpenseAccrual[]", side_effects: [] }

  # --- WaiverAgreement / WaiverLedgerEntry ---
  - { method: POST, path: "/waiver-agreements", description: "Create an expense-cap agreement for a class (closed day-interval; overlap with ACTIVE agreements rejected)", roles: [FundController], code: 201, input: [share_class_id, cap_bps, effective_from, effective_to, recovery_window_months], output: WaiverAgreement, side_effects: [] }
  - { method: GET, path: "/waiver-agreements", description: "List waiver agreements filtered by class", roles: [FundAccountant, FundController, PricingCommittee, ComplianceOfficer], code: 200, input: ["share_class_id?", "limit?", "offset?"], output: "WaiverAgreement[]", side_effects: [] }
  - { method: GET, path: "/waiver-agreements/{waiver_agreement_id}", description: "Get an agreement incl. derived status and recoverable_balance", roles: [FundAccountant, FundController, PricingCommittee, ComplianceOfficer], code: 200, input: [], output: WaiverAgreement, side_effects: [] }
  - { method: POST, path: "/waiver-agreements/{waiver_agreement_id}/recoupments", description: "Recoup previously waived amounts via recoupment_waterfall", roles: [FundController], code: 201, input: [amount, recoup_date], output: WaiverLedgerEntry, side_effects: ["creates RECOUPMENT entry", "draws down remaining_amount of eligible WAIVER entries oldest-first", "WaiverAgreement.recoverable_balance recomputes; increments WaiverAgreement.version by 1"] }
  - { method: GET, path: "/waiver-agreements/{id}/ledger", description: "List the agreement's waiver/recoupment ledger entries (FK reverse reachability)", roles: [FundAccountant, FundController, PricingCommittee, ComplianceOfficer], code: 200, input: ["limit?", "offset?"], output: "WaiverLedgerEntry[]", side_effects: [] }

  # --- Distribution ---
  - { method: POST, path: "/distributions", description: "Declare a distribution; per-share and total computed from snapshots", roles: [FundAccountant], code: 201, input: [share_class_id, declaration_date, ex_date, record_date, payable_date], output: Distribution, side_effects: ["snapshots distributable_amount and shares_snapshot", "computes income_per_share then total_amount per distribution_per_share"] }
  - { method: GET, path: "/distributions/{distribution_id}", description: "Get a distribution", roles: [FundAccountant, FundController, PricingCommittee, ComplianceOfficer], code: 200, input: [], output: Distribution, side_effects: [] }
  - { method: GET, path: "/distributions", description: "List distributions filtered by class/status", roles: [FundAccountant, FundController, PricingCommittee, ComplianceOfficer], code: 200, input: ["share_class_id?", "status?", "limit?", "offset?"], output: "Distribution[]", side_effects: [] }
  - { method: POST, path: "/distributions/{distribution_id}/pay", description: "Pay a DECLARED distribution; optional reinvestment issues shares at the latest FINAL nav <= payable_date", roles: [FundController], code: 200, input: [reinvest], output: Distribution, side_effects: ["status -> PAID; retained_income -= total_amount; paid_at set", "reinvest=true: shares_outstanding += round4(total_amount / nav_per_share)", "reinvest cascades into recompute of the class's latest ESTIMATED NavRecord (if any), bumping its version"] }
  - { method: POST, path: "/distributions/{distribution_id}/cancel", description: "Cancel a DECLARED distribution (compensation: no balance movement)", roles: [FundController], code: 200, input: [], output: Distribution, side_effects: ["status -> CANCELLED"] }

  # --- ReconciliationBreak ---
  - { method: POST, path: "/reconciliation-breaks", description: "Record a custodian/broker position break (variance must be non-zero)", roles: [FundAccountant], code: 201, input: [fund_id, position_id, break_type, break_date, counterparty_quantity], output: ReconciliationBreak, side_effects: ["book_quantity = Position.quantity; variance computed; status = OPEN"] }
  - { method: GET, path: "/reconciliation-breaks/{reconciliation_break_id}", description: "Get a break", roles: [FundAccountant, FundController, PricingCommittee, ComplianceOfficer], code: 200, input: [], output: ReconciliationBreak, side_effects: [] }
  - { method: GET, path: "/reconciliation-breaks", description: "List breaks filtered by fund/position/status", roles: [FundAccountant, FundController, PricingCommittee, ComplianceOfficer], code: 200, input: ["fund_id?", "position_id?", "status?", "limit?", "offset?"], output: "ReconciliationBreak[]", side_effects: [] }
  - { method: POST, path: "/reconciliation-breaks/{reconciliation_break_id}/resolve", description: "Resolve a break (NO_CHANGE or ADJUST_POSITION)", roles: [FundController], code: 200, input: [resolution_type], output: ReconciliationBreak, side_effects: ["ADJUST_POSITION: Position.quantity = counterparty_quantity (auto-CLOSE at 0; prior_book_quantity captured)", "recomputes the class's latest ESTIMATED NavRecord (GAV, first-record accruals, totals), bumping its version"] }
  - { method: POST, path: "/reconciliation-breaks/{reconciliation_break_id}/reopen", description: "Reopen a RESOLVED break with full compensation of its position adjustment", roles: [FundController], code: 200, input: [], output: ReconciliationBreak, side_effects: ["status -> OPEN", "ADJUST_POSITION compensation: Position.quantity restored to prior_book_quantity", "recomputes the class's latest ESTIMATED NavRecord (if any), bumping its version"] }
  - { method: POST, path: "/reconciliation-breaks/escalate-overdue", description: "Sweep: OPEN breaks with break_date more than BREAK_ESCALATION_DAYS (5) before the logical clock date become ESCALATED", roles: [FundController], code: 200, input: [], output: "{ escalated_count: integer }", side_effects: ["each escalated break increments ReconciliationBreak.version by 1"] }

  # --- FeeInvoice ---
  - { method: POST, path: "/fee-invoices", description: "Create an adviser/administrator fee invoice (contiguous tiling per fund+fee_type)", roles: [FundAccountant], code: 201, input: [fund_id, fee_type, period_start, period_end], output: FeeInvoice, side_effects: ["computes average_daily_net_assets, gross_fee, waiver_offset, net_fee per adviser_fee_tiered"] }
  - { method: GET, path: "/fee-invoices/{fee_invoice_id}", description: "Get a fee invoice", roles: [FundAccountant, FundController, PricingCommittee, ComplianceOfficer], code: 200, input: [], output: FeeInvoice, side_effects: [] }
  - { method: GET, path: "/fee-invoices", description: "List fee invoices filtered by fund/type/status", roles: [FundAccountant, FundController, PricingCommittee, ComplianceOfficer], code: 200, input: ["fund_id?", "fee_type?", "status?", "limit?", "offset?"], output: "FeeInvoice[]", side_effects: [] }
  - { method: POST, path: "/fee-invoices/{fee_invoice_id}/approve", description: "Approve a DRAFT invoice (segregation of duties: approver != creator)", roles: [FundController], code: 200, input: [], output: FeeInvoice, side_effects: ["status -> APPROVED; approved_by_user_id set"] }
  - { method: POST, path: "/fee-invoices/{fee_invoice_id}/pay", description: "Pay an APPROVED invoice", roles: [FundController], code: 200, input: [], output: FeeInvoice, side_effects: ["status -> PAID"] }

  # --- RegulatoryFiling ---
  - { method: POST, path: "/regulatory-filings", description: "Create a regulatory filing (DRAFT); filing_deadline derived from type", roles: [ComplianceOfficer], code: 201, input: [fund_id, filing_type, period_end], output: RegulatoryFiling, side_effects: ["filing_deadline = period_end + 60 days (N_PORT/ANNUAL_REPORT/SEMI_ANNUAL_REPORT) or + 75 days (N_CEN)"] }
  - { method: GET, path: "/regulatory-filings/{regulatory_filing_id}", description: "Get a filing", roles: [FundAccountant, FundController, PricingCommittee, ComplianceOfficer], code: 200, input: [], output: RegulatoryFiling, side_effects: [] }
  - { method: GET, path: "/regulatory-filings", description: "List filings filtered by fund/type/status", roles: [FundAccountant, FundController, PricingCommittee, ComplianceOfficer], code: 200, input: ["fund_id?", "filing_type?", "status?", "limit?", "offset?"], output: "RegulatoryFiling[]", side_effects: [] }
  - { method: POST, path: "/regulatory-filings/{regulatory_filing_id}/submit-review", description: "Submit DRAFT or AMENDED filing for review", roles: [ComplianceOfficer], code: 200, input: [], output: RegulatoryFiling, side_effects: ["status -> PENDING_REVIEW"] }
  - { method: POST, path: "/regulatory-filings/{regulatory_filing_id}/approve", description: "Approve a PENDING_REVIEW filing (SoD vs preparer; gated on ESCALATED breaks and period end)", roles: [FundController], code: 200, input: [], output: RegulatoryFiling, side_effects: ["status -> APPROVED; approved_by_user_id set"] }
  - { method: POST, path: "/regulatory-filings/{regulatory_filing_id}/file", description: "File an APPROVED filing; lateness computed against filing_deadline", roles: [ComplianceOfficer], code: 200, input: [], output: RegulatoryFiling, side_effects: ["status -> FILED; filed_at set; filed_after_deadline recomputed"] }
  - { method: POST, path: "/regulatory-filings/{regulatory_filing_id}/amend", description: "Amend a FILED filing (opens the amendment cycle back to PENDING_REVIEW)", roles: [ComplianceOfficer], code: 200, input: [], output: RegulatoryFiling, side_effects: ["status -> AMENDED; approved_by_user_id cleared"] }

  # --- Test-driving logical clock ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock (test-driving endpoint). Startup default is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock; clock moves strictly forward", roles: [FundAccountant, FundController, PricingCommittee, ComplianceOfficer], code: 200, input: [to_iso8601], output: "{ current_utc: datetime }", side_effects: ["all clock-derived rules (price dates, escalation sweep, deadlines, waiver expiry, agreement status) evaluate against this clock"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID header" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not resolve to an existing resource" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Caller role not in the endpoint's roles" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body: missing required field, unknown field (incl. system fields), wrong type/enum, or violated numeric range" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition requested from a state where it is not defined" }
  - { id: ERR_STALE_NAV_VERSION, http: 412, condition: "expected_nav_record_version does not match the NavRecord's current version (OCC)" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Approver/finalizer is the same user who prepared the resource (segregation of duties)" }
  - { id: ERR_BREAK_ESCALATED_BLOCKS, http: 409, condition: "Filing approve/file while a fund ReconciliationBreak is ESCALATED" }
  - { id: ERR_FISCAL_CLOSE_BLOCKED, http: 409, condition: "Fiscal-year close while any in-year NavRecord is not FINAL, any break is OPEN/ESCALATED, or any in-year filing is not FILED" }
  - { id: ERR_PRICE_DATE_FUTURE, http: 422, condition: "price_date is after the logical clock date" }
  - { id: ERR_PERIOD_NOT_ENDED, http: 422, condition: "Filing period_end is not strictly before the logical clock date at approval, or fiscal_year_end_date is after the logical clock date at fiscal-year close" }
  - { id: ERR_DISTRIBUTION_NOT_PAYABLE, http: 422, condition: "Pay attempted before payable_date (logical clock date < payable_date)" }
  - { id: ERR_RECOUP_WINDOW_EXPIRED, http: 422, condition: "Recoupment requested but no WAIVER entry is unexpired with remaining balance (window check is inclusive of expires_at)" }
  - { id: ERR_CLOCK_REGRESSION, http: 422, condition: "set_current_utc to a timestamp not strictly after the current logical clock" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "Recoupment against a WaiverAgreement whose derived status is EXPIRED (clock date > effective_to)" }
  - { id: ERR_TICKER_ALREADY_EXISTS, http: 409, condition: "Fund ticker already exists, or class_ticker already exists within the fund" }
  - { id: ERR_NAV_DATE_NOT_SEQUENTIAL, http: 409, condition: "NavRecord accounting_date is not strictly later than all existing records for the class" }
  - { id: ERR_DUPLICATE_PRICE_SOURCE, http: 409, condition: "A non-OVERRIDDEN PriceObservation already exists for (security_id, price_date, source)" }
  - { id: ERR_OVERRIDE_SOURCE_RESERVED, http: 422, condition: "Manual price create with source FAIR_VALUE_COMMITTEE; only the override endpoint may produce it" }
  - { id: ERR_MISSING_PRICE, http: 422, condition: "NavRecord create: an OPEN position's security has no PriceObservation of any status on accounting_date" }
  - { id: ERR_PRICE_NOT_APPROVED, http: 409, condition: "Finalize: a held security has a SUBMITTED observation, or lacks any APPROVED observation, on accounting_date" }
  - { id: ERR_NO_ESTIMABLE_NAV, http: 422, condition: "Manual accrual accrual_date does not match an ESTIMATED NavRecord of the class" }
  - { id: ERR_CATEGORY_SYSTEM_MANAGED, http: 422, condition: "Manual accrual with category ADMIN_FEE; ADMIN_FEE rows are generated by NavRecord creation only" }
  - { id: ERR_CAP_AGREEMENT_OVERLAP, http: 409, condition: "New agreement's closed [effective_from, effective_to] intersects another ACTIVE agreement of the class (shared endpoint day counts as overlap)" }
  - { id: ERR_FEE_PERIOD_NOT_CONTIGUOUS, http: 409, condition: "Fee invoice period_start is not exactly one day after the previous invoice's period_end for the same fund+fee_type" }
  - { id: ERR_NO_FINAL_NAV_IN_PERIOD, http: 422, condition: "Fee/performance/trial-balance computation found no FINAL NavRecord in the required window" }
  - { id: ERR_NO_VARIANCE, http: 422, condition: "Break creation with counterparty_quantity == Position.quantity (zero variance)" }
  - { id: ERR_DISTRIBUTION_DATE_ORDER, http: 422, condition: "Distribution dates violate declaration_date < ex_date <= record_date <= payable_date" }
  - { id: ERR_NAV_NOT_FINAL, http: 409, condition: "Operation requires a FINAL NavRecord (distribution declare: latest record; reinvest pay: latest <= payable_date) but none qualifies" }
  - { id: ERR_NAV_NOT_LATEST, http: 409, condition: "Reopen requested on a NavRecord that is not the class's latest" }
  - { id: ERR_NAV_LOCKED_FISCAL_CLOSED, http: 409, condition: "Reopen requested for a record inside an already-closed fiscal year" }
  - { id: ERR_NO_SHARES_OUTSTANDING, http: 422, condition: "NavRecord create while the class has shares_outstanding == 0" }
  - { id: ERR_REDEMPTION_EXCEEDS_SHARES, http: 422, condition: "REDEMPTION shares exceed current shares_outstanding" }
  - { id: ERR_RECOUP_AMOUNT_EXCEEDS_BALANCE, http: 422, condition: "Recoupment amount exceeds the sum of unexpired WAIVER remaining_amount" }
  - { id: ERR_NO_DISTRIBUTABLE_INCOME, http: 422, condition: "Distribution declared while retained_income == 0" }

# =============================================================================
# §1.7 RBAC Matrix — segregation_of_duties model (all roles are opaque operator
# ids; SoD compares X-User-ID against stored *_by_user_id fields)
# =============================================================================
roles:
  - name: FundAccountant
    description: "Daily operations preparer: prices, NAV creation, accruals, capital activity, distributions, breaks, fee invoices"
    identity: opaque
    exclusive_operations:
      - "POST /price-observations"
      - "POST /nav-records"
      - "POST /expense-accruals"
      - "POST /share-classes/{id}/capital-activity"
      - "POST /distributions"
      - "POST /reconciliation-breaks"
      - "POST /fee-invoices"
      - "POST /securities"
      - "POST /positions"
    shared_operations:
      - "All GET endpoints"
      - "POST /_clock/set_current_utc"
  - name: FundController
    description: "Approval and control: finalizes/reopens NAV, manages waiver agreements and recoupments, pays/cancels distributions, resolves breaks, approves/pays fees, approves filings, runs fiscal-year close"
    identity: opaque
    exclusive_operations:
      - "POST /funds and POST /share-classes"
      - "POST /funds/{id}/fiscal-year-close"
      - "POST /nav-records/{id}/finalize and /reopen"
      - "POST /waiver-agreements and /recoupments"
      - "POST /distributions/{id}/pay and /cancel"
      - "POST /reconciliation-breaks/{id}/resolve and /reopen and /escalate-overdue"
      - "POST /fee-invoices/{id}/approve and /pay"
      - "POST /regulatory-filings/{id}/approve"
    shared_operations:
      - "All GET endpoints"
      - "POST /_clock/set_current_utc"
  - name: PricingCommittee
    description: "Valuation governance: approves prices and issues fair-value overrides"
    identity: opaque
    exclusive_operations:
      - "POST /price-observations/{id}/approve"
      - "POST /price-observations/{id}/override"
    shared_operations:
      - "All GET endpoints"
      - "POST /_clock/set_current_utc"
  - name: ComplianceOfficer
    description: "Regulatory reporting preparer: creates, submits, files, and amends filings (approve is reserved to FundController for segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /regulatory-filings"
      - "POST /regulatory-filings/{id}/submit-review"
      - "POST /regulatory-filings/{id}/file"
      - "POST /regulatory-filings/{id}/amend"
    shared_operations:
      - "All GET endpoints"
      - "POST /_clock/set_current_utc"
