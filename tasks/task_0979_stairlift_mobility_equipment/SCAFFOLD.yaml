  - method: POST
    path: "/stairlift-ops/install-jobs/{id}/cancel"
    description: "Cancel a SCHEDULED InstallJob"
    roles: [InstallCoordinator]
    code: 200
    input: []
    output: InstallJob
    side_effects: []

  # --- ServicePlan ---
  - method: POST
    path: "/stairlift-ops/agreements/{id}/service-plans"
    description: "Attach a ServicePlan to an INSTALLED Agreement"
    roles: [InstallCoordinator, SalesRep]
    code: 201
    input: [tier]
    output: ServicePlan
    side_effects: ["monthly_fee_cents computed (service_plan_fee, dual-variant on waiver)", "coverage_cap_cents set by tier", "next_service_due_utc := now + 180 days"]

  - method: GET
    path: "/stairlift-ops/agreements/{id}/service-plans"
    description: "List ServicePlans for Agreement"
    roles: [PlatformAdmin, InstallCoordinator, SalesRep, ClaimsAdjuster, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: "ServicePlan[]"
    side_effects: []

  - method: GET
    path: "/stairlift-ops/service-plans/{id}"
