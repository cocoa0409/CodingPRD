      - name: corner_void_reverses_the_execution_side_effects
        claim_type: Action endpoint
        grounds: ["endpoints.POST_/uro/agreements/{id}/void"]
        excluded_because:
          difficulty_instance: "compensating_invariant / void_after_execute_restores_the_committed_reimbursement_ledger_to_the_cent"
          rationale: "That instance already exercises void end to end - both dimensions move to VOIDED and VOIDED_OUT, the ledger returns to its exact pre-execution value and the posture is recomputed from the restored ledger - which is the action-endpoint claim for this route."

  # ===========================================================================
  # Error-catalog coverage note. Every one of the 43 error ids is triggered by an
  # instance in this file or by a named scaffold_difficulty_design instance:
  #   ERR_UNAUTHENTICATED / ERR_UNAUTHORIZED / ERR_INVALID_REQUEST -> validations section
  #   the 14 *_NOT_FOUND ids -> the walk below (path ids) plus the body-FK asserts
  #   ERR_OWNER_SCOPE_VIOLATION -> validations, ERR_PROJECT_CLOSED -> endpoints
  #   ERR_INVALID_STATE_TRANSITION -> state_machines, ERR_STALE_VERSION -> cross_cutting
  #   ERR_AUTHORITY_EXCEEDED -> validations, ERR_PRIOR_RIGHTS_NOT_ISSUED /
  #   ERR_PERMIT_NOT_GRANTED -> validations, the rest -> the instances below or the
  #   difficulty instances cited by the two stubs at the end of this section.
  - section: errors
    instances:
      - name: every_unknown_path_id_maps_to_its_own_not_found_error_and_never_a_generic_one
        claim_type: Not Found
        grounds: ["validations[priority=4]", "validations[priority=5]", "errors[ERR_PROJECT_NOT_FOUND]", "errors[ERR_OWNER_NOT_FOUND]", "errors[ERR_FACILITY_NOT_FOUND]", "errors[ERR_INVESTIGATION_NOT_FOUND]", "errors[ERR_CONFLICT_NOT_FOUND]", "errors[ERR_DETERMINATION_NOT_FOUND]", "errors[ERR_PLAN_NOT_FOUND]", "errors[ERR_PERMIT_NOT_FOUND]", "errors[ERR_SLOT_NOT_FOUND]", "errors[ERR_COMMITMENT_NOT_FOUND]", "errors[ERR_AGREEMENT_NOT_FOUND]", "errors[ERR_DOCUMENT_NOT_FOUND]", "errors[ERR_FINDING_NOT_FOUND]", "errors[ERR_CLAIM_NOT_FOUND]"]
        distinguishing_aspect: "The catalog carries fourteen distinct not-found ids, one per entity, and each read must return its own: a single ERR_NOT_FOUND, or borrowing the parent's id on a nested route, fails. The walk uses well-formed UUIDs that were never created, so the answer is 404 rather than the 400 a malformed id would earn, and the same distinction is then checked on the priority-5 body foreign keys where the reported id must name the missing referent rather than the entity being created."
        test_recipe:
          setup: ["No rows are needed; every id below is a well-formed UUID that was never issued."]
          setup_api_calls: []
          trigger:
            - { call: "GET /uro/projects/11111111-1111-4111-8111-111111111101", payload: {}, as: ProgramAdmin }
            - { call: "GET /uro/utility-owners/11111111-1111-4111-8111-111111111102", payload: {}, as: ProgramAdmin }
            - { call: "GET /uro/facilities/11111111-1111-4111-8111-111111111103", payload: {}, as: ProgramAdmin }
            - { call: "GET /uro/investigations/11111111-1111-4111-8111-111111111104", payload: {}, as: ProgramAdmin }
            - { call: "GET /uro/conflicts/11111111-1111-4111-8111-111111111105", payload: {}, as: ProgramAdmin }
            - { call: "GET /uro/prior-rights/11111111-1111-4111-8111-111111111106", payload: {}, as: ProgramAdmin }
            - { call: "GET /uro/relocation-plans/11111111-1111-4111-8111-111111111107", payload: {}, as: ProgramAdmin }
            - { call: "GET /uro/permits/11111111-1111-4111-8111-111111111108", payload: {}, as: ProgramAdmin }
            - { call: "GET /uro/joint-trench-slots/11111111-1111-4111-8111-111111111109", payload: {}, as: ProgramAdmin }
            - { call: "GET /uro/commitments/11111111-1111-4111-8111-11111111110a", payload: {}, as: ProgramAdmin }
            - { call: "GET /uro/agreements/11111111-1111-4111-8111-11111111110b", payload: {}, as: ProgramAdmin }
            - { call: "GET /uro/cost-documents/11111111-1111-4111-8111-11111111110c", payload: {}, as: ProgramAdmin }
            - { call: "GET /uro/audit-findings/11111111-1111-4111-8111-11111111110d", payload: {}, as: ProgramAdmin }
            - { call: "GET /uro/delay-claims/11111111-1111-4111-8111-11111111110e", payload: {}, as: ProgramAdmin }
          assert:
            - "all fourteen reads return 404, each with its own error_id in catalog order: ERR_PROJECT_NOT_FOUND, ERR_OWNER_NOT_FOUND, ERR_FACILITY_NOT_FOUND, ERR_INVESTIGATION_NOT_FOUND, ERR_CONFLICT_NOT_FOUND, ERR_DETERMINATION_NOT_FOUND, ERR_PLAN_NOT_FOUND, ERR_PERMIT_NOT_FOUND, ERR_SLOT_NOT_FOUND, ERR_COMMITMENT_NOT_FOUND, ERR_AGREEMENT_NOT_FOUND, ERR_DOCUMENT_NOT_FOUND, ERR_FINDING_NOT_FOUND, ERR_CLAIM_NOT_FOUND"
            - "the nested listings behave the same way: GET /uro/conflicts/{unknown}/relocation-plans and GET /uro/agreements/{unknown}/cost-documents return ERR_CONFLICT_NOT_FOUND and ERR_AGREEMENT_NOT_FOUND, never an empty 200 page"
            - "priority-5 body foreign keys name the referent: POST /uro/prior-rights with an unknown conflict_id returns ERR_CONFLICT_NOT_FOUND, POST /uro/facilities with an unknown owner_id returns ERR_OWNER_NOT_FOUND, POST /uro/agreements with an unknown plan_id returns ERR_PLAN_NOT_FOUND and POST /uro/delay-claims with an unknown commitment_id returns ERR_COMMITMENT_NOT_FOUND"
            - "no row is created or modified by any call"

      - name: an_auditor_reusing_the_executing_officers_user_id_is_refused
        claim_type: Violation → Error
        grounds: ["validations[priority=7]", "errors[ERR_SEGREGATION_OF_DUTIES]", "rbac.ExternalAuditor"]
        distinguishing_aspect: "The audit right is only meaningful if the auditor is not the person who executed the agreement, and the rule compares X-User-ID values across two different roles: the ExternalAuditor sending X-User-ID officer-1 is refused with ERR_SEGREGATION_OF_DUTIES 403 because ReimbursementAgreement.executed_by_user_id is officer-1, while auditor-1 succeeds on the identical body. Checking the role alone, or comparing roles instead of user ids, passes the wrong request."
        test_recipe:
          setup: ["Base chain to an agreement executed by X-User-ID officer-1."]
