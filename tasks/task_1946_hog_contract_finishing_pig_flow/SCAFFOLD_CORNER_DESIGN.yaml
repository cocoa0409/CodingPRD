            - { call: "POST /contracts", payload: { grower_id: "${grower_id}", site_id: "${site_id}", base_pay_cents_per_head: 4000, bonus_cap_cents_per_head: 1200, fcr_target: 2.60, adg_target_lbs: 1.90, mortality_threshold_pct: 5.00, feed_budget_lbs_per_head: 650, structural_owner_pct: 100, equipment_owner_pct: 50, routine_owner_pct: 0, effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: IntegratorAdmin, captures: { contract_id: $.data.id } }
            - { call: "POST /contracts/${contract_id}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /barns", payload: { site_id: "${site_id}", barn_code: "B1", capacity_head: 1200, floor_space_sqft: 9600 }, as: IntegratorAdmin, captures: { barn1: $.data.id, barn1_v: $.data.version } }
            - { call: "POST /barns", payload: { site_id: "${site_id}", barn_code: "B2", capacity_head: 1200, floor_space_sqft: 9600 }, as: IntegratorAdmin, captures: { barn2: $.data.id, barn2_v: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-02-15T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /pig-groups", payload: { barn_id: "${barn1}", contract_id: "${contract_id}", placement_date: "2026-03-02", target_market_date: "2026-07-13", head_placed: 500, avg_start_weight_lbs: 50.0, expected_barn_version: "${barn1_v}" }, as: FieldTech, captures: { g1: $.data.id } }
            - { call: "POST /pig-groups", payload: { barn_id: "${barn2}", contract_id: "${contract_id}", placement_date: "2026-03-02", target_market_date: "2026-07-13", head_placed: 500, avg_start_weight_lbs: 50.0, expected_barn_version: "${barn2_v}" }, as: FieldTech, captures: { g2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-02T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /pig-groups/${g1}/confirm-placement", payload: {}, as: FieldTech }
            - { call: "POST /pig-groups/${g2}/confirm-placement", payload: {}, as: FieldTech }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-06T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /pig-groups/${g1}/mortality-reports", payload: { report_date: "2026-03-05", mortality_count: 2, cull_count: 0, reason_code: "OTHER" }, as: Grower, as_user_id: "${grower_id}" }
            - { call: "POST /pig-groups/${g1}/mortality-reports", payload: { report_date: "2026-03-06", mortality_count: 1, cull_count: 2, reason_code: "OTHER" }, as: Grower, as_user_id: "${grower_id}" }
            - { call: "POST /pig-groups/${g2}/mortality-reports", payload: { report_date: "2026-03-06", mortality_count: 7, cull_count: 0, reason_code: "DISEASE" }, as: Grower, as_user_id: "${grower_id}" }
          trigger:
            - { call: "GET /pig-groups/${g1}/mortality-reports", payload: {}, as: FieldTech, captures: { n: "$.data[0].mortality_count" } }
          assert:
            - "List for G1: total_count == 2; first report mortality_count == 2 (${n}); G2's 7-death report absent"
            - "G1 aggregates: mortality_total == 3, cull_total == 2, head_current == 495"

      - name: settlement_preview_computed_read_covered
        claim_type: computed_read
        grounds: [calculations.settlement_pay]
        excluded_because:
          difficulty_instance: settlement_provisional_vs_final_divergence
          rationale: "Preview endpoint values asserted there (bonus 360000, total 4360000)."

  # ============================================================ errors
  - section: errors
    instances:
      - name: duplicate_slot_rejected
        claim_type: violation_to_error
        grounds: [ "errors[ERR_DUPLICATE_SLOT]"]
        distinguishing_aspect: "(plant_code, slot_date, shift) uniqueness: identical tuple -> 409; same date+plant with different shift is fine."
        test_recipe:
          setup: ["slot P1 2026-07-13 AM exists"]
          setup_api_calls:
            - { call: "POST /packer-slots", payload: { plant_code: "P1", slot_date: "2026-07-13", shift: "AM", capacity_head: 500, min_weight_lbs: 240, max_weight_lbs: 320 }, as: IntegratorAdmin, captures: { slot1: $.data.id } }
          trigger:
            - { call: "POST /packer-slots", payload: { plant_code: "P1", slot_date: "2026-07-13", shift: "AM", capacity_head: 300, min_weight_lbs: 240, max_weight_lbs: 320 }, as: IntegratorAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /packer-slots", payload: { plant_code: "P1", slot_date: "2026-07-13", shift: "PM", capacity_head: 300, min_weight_lbs: 240, max_weight_lbs: 320 }, as: IntegratorAdmin, captures: { slot2: $.data.id } }
          assert:
            - "Duplicate tuple -> 409 ERR_DUPLICATE_SLOT (${err})"
            - "Different shift -> 201 (${slot2} non-null)"

      - name: contract_site_overlap_rejected
        claim_type: violation_to_error
        grounds: [ "errors[ERR_CONTRACT_SITE_OVERLAP]", state_machines.Contract]
        distinguishing_aspect: "At most one ACTIVE contract per site: second activation on the same site -> 409."
        test_recipe:
          setup: ["site S, grower G, contracts C1 ACTIVE and C2 DRAFT on S"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", state_code: "IA", county: "Sioux" }, as: IntegratorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /growers", payload: { legal_name: "G", grower_code: "G-1", email: "g@x.com" }, as: IntegratorAdmin, captures: { grower_id: $.data.id } }
            - { call: "POST /contracts", payload: { grower_id: "${grower_id}", site_id: "${site_id}", base_pay_cents_per_head: 4000, bonus_cap_cents_per_head: 1200, fcr_target: 2.60, adg_target_lbs: 1.90, mortality_threshold_pct: 5.00, feed_budget_lbs_per_head: 650, structural_owner_pct: 100, equipment_owner_pct: 50, routine_owner_pct: 0, effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: IntegratorAdmin, captures: { c1: $.data.id } }
            - { call: "POST /contracts/${c1}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /contracts", payload: { grower_id: "${grower_id}", site_id: "${site_id}", base_pay_cents_per_head: 4100, bonus_cap_cents_per_head: 1200, fcr_target: 2.60, adg_target_lbs: 1.90, mortality_threshold_pct: 5.00, feed_budget_lbs_per_head: 650, structural_owner_pct: 100, equipment_owner_pct: 50, routine_owner_pct: 0, effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: IntegratorAdmin, captures: { c2: $.data.id } }
          trigger:
            - { call: "POST /contracts/${c2}/activate", payload: {}, as: IntegratorAdmin, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 409; error_id == ERR_CONTRACT_SITE_OVERLAP (${err}); C2 stays DRAFT"

      - name: empty_and_future_report_rejected
        claim_type: violation_to_error
        grounds: [ "errors[ERR_EMPTY_REPORT]", "errors[ERR_REPORT_DATE_OUT_OF_RANGE]", calculations.group_head_reconciliation]
        distinguishing_aspect: "Zero-quantity report (0 dead, 0 culled) is rejected; a report dated after the clock is rejected; both leave aggregates unchanged."
        test_recipe:
          setup: ["group PLACED 500 head; clock 2026-03-10"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "S", state_code: "IA", county: "Sioux" }, as: IntegratorAdmin, captures: { site_id: $.data.id } }
