          assert:
            - "the first renewal (at exactly grace_deadline) succeeds: Domain.${dom_id}.expires_on == 2028-01-15T00:00:00Z"
            - "the first renewal mints a RENEW invoice with base_cents == 850 and total_cents == 850 (non-premium, no surcharge)"
            - "the second renewal (after the new grace_deadline 2028-02-29T00:00:00Z has passed and the domain has auto-renewed and lapsed) is rejected 409"

