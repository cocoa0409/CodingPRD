              as: ComplianceOfficer
              captures: { hold_id: "$.data[0].id" }
            - call: "GET /employee-health/employees/${emp_id}"
              as: ComplianceOfficer
          assert:
            - "CampaignParticipation.${part_id}.status == DELINQUENT (link 1)"
            - "ComplianceHold.${hold_id}: status == ACTIVE, reason == CAMPAIGN_DELINQUENT, participation_id == ${part_id} (link 2 caused by link 1, not by the close directly)"
            - "Employee.${emp_id}: status == SUSPENDED, compliance_posture == ON_HOLD, active_hold_count == 1 (link 3 caused by link 2)"

      - name: serology_positive_seroconversion_cascade
        grounds:
          - state_machines.SerologyFollowUp.DUE_to_RESULTED
          - state_machines.ExposureCase
          - state_machines.WorkRestriction
          - calculations.compliance_posture_derivation
        distinguishing_aspect: |
          Depth-3 chain triggered by POST .../serology-follow-ups/{id}/transition RESULTED
          with result=POSITIVE on a WEEK_6 milestone: the positive result drives the case
          to SEROCONVERTED (link 1); the SEROCONVERTED transition itself auto-creates a
          FULL_EXCLUSION WorkRestriction ACTIVE (link 2); that restriction's activation
          recomputes Employee posture to WORK_EXCLUDED with open_restriction_count == 1
          (link 3). Distinct trigger from the campaign-close cascade.
        test_recipe:
          setup:
            - "Employee E1 ACTIVE; MEDIUM-risk source-unknown case with PEP STARTED 2026-08-01T12:00:00Z; WEEK_6 follow-up DUE at clock 2026-09-03T10:00:00Z (window_open, inclusive); BASELINE already RESULTED NEGATIVE"
          setup_api_calls:
            - call: "POST /employee-health/employees"
              payload: { employee_ref: "E-TC2", full_name: "Sero Convert", job_category: "NURSE", department: "ED", hire_date: "2025-01-05T00:00:00Z", requires_respirator: false }
              as: EmployeeHealthNurse
