              payload: { item_code: "BOWL", display_name: "Chicken Bowl", base_price_cents: 1095 }
              as: StoreManager
              captures: { item_bowl: $.data.id }
            - call: "POST /api/v1/menu-items/${item_bowl}/recipe-components"
              payload: { ingredient_id: "${ing_chicken}", standard_grams: 120 }
              as: StoreManager
            - call: "POST /api/v1/stores/${store_id}/production-windows"
              payload: { interval_start: "2026-09-01T10:15:00Z", interval_end: "2026-09-01T10:30:00Z" }
              as: StoreManager
            - call: "POST /api/v1/stores/${store_id}/orders"
              payload: { channel: "IN_STORE", lines: [{ menu_item_id: "${item_bowl}", quantity: 1, customizations: [] }] }
              as: LineWorker
              as_user_id: "lw-1"
              captures: { order_first: $.data.id }
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:01:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /api/v1/menu-items/${item_bowl}"
              payload: {}
              as: GeneralManager
              as_user_id: "gm-quinn"
              captures: { supp_state: $.data.suppression_state }
            - call: "POST /api/v1/stores/${store_id}/orders"
              payload: { channel: "IN_STORE", lines: [{ menu_item_id: "${item_bowl}", quantity: 1, customizations: [] }] }
              as: LineWorker
              as_user_id: "lw-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "MenuItem.${item_bowl}.suppression_state == SUPPRESSED_ALL"
            - "the response status is 409 and error_id == ERR_ITEM_SUPPRESSED"
            - "no Order row is created for the rejected request"

  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: production_window_half_open_overlap_rejected
        grounds:
          - errors.ERR_WINDOW_OVERLAP
          - entities.ProductionWindow.fields.interval_start
          - entities.ProductionWindow.fields.interval_end
        distinguishing_aspect: |
          Half-open [start, end) interval semantics on the ProductionWindow
          resource: a new window 10:15-10:30 rejects an overlapping 10:20-10:35
          (ERR_WINDOW_OVERLAP) but ACCEPTS an exactly-adjacent 10:30-10:45
          because the end of one equals the start of the next (gap 0 is legal).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T10:00:00Z. Store S15."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/stores"
              payload: { store_code: "S15", name: "Store Fifteen", digital_line_capacity_per_interval: 10, instore_line_capacity_per_interval: 50, pacing_interval_minutes: 15, overage_threshold_pct: 0.8, marketplace_commission_pct: 0.22 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /api/v1/stores/${store_id}/production-windows"
              payload: { interval_start: "2026-09-01T10:15:00Z", interval_end: "2026-09-01T10:30:00Z" }
              as: StoreManager
              captures: { win1: $.data.id }
          trigger:
            - call: "POST /api/v1/stores/${store_id}/production-windows"
              payload: { interval_start: "2026-09-01T10:20:00Z", interval_end: "2026-09-01T10:35:00Z" }
              as: StoreManager
              captures: { err_overlap: $.data.error_id }
            - call: "POST /api/v1/stores/${store_id}/production-windows"
              payload: { interval_start: "2026-09-01T10:30:00Z", interval_end: "2026-09-01T10:45:00Z" }
              as: StoreManager
              captures: { win2: $.data.id }
          assert:
            - "the overlapping 10:20-10:35 window fails 409 ERR_WINDOW_OVERLAP"
            - "the adjacent 10:30-10:45 window succeeds (201) because [10:15,10:30) and [10:30,10:45) are disjoint under half-open semantics"
            - "ProductionWindow.${win2}.status == OPEN"

      - name: hold_time_discard_fires_at_exactly_discard_at
        grounds:
          - entities.IngredientBatch.fields.discard_at
          - state_machines.IngredientBatch
          - calculations.fifo_consumption
        distinguishing_aspect: |
          DIFFERENT interval semantics from production windows: a batch's TTL
          expires AT the discard boundary — the clock reaching discard_at
          (discard_at <= now) flips ACTIVE -> EXPIRED. This is an inclusive
          firing threshold on a point-in-time TTL, whereas production windows
          use half-open [start, end) adjacency (gap 0 legal). One second before
          discard_at the batch is still ACTIVE.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T09:00:00Z. Store S16. BOWL on chicken (hold_time 60min)."
            - "Chicken batch 1000g cooked at 09:00 => discard_at 10:00."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/stores"
              payload: { store_code: "S16", name: "Store Sixteen", digital_line_capacity_per_interval: 10, instore_line_capacity_per_interval: 50, pacing_interval_minutes: 15, overage_threshold_pct: 0.8, marketplace_commission_pct: 0.22 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /api/v1/ingredients"
              payload: { ingredient_code: "CHICKEN", display_name: "Chicken", unit_cost_cents_per_gram: 2.1, par_level_grams: 5000, hold_time_minutes: 60, batch_size_grams: 3000 }
              as: PlatformAdmin
              captures: { ing_chicken: $.data.id }
            - call: "POST /api/v1/ingredients/${ing_chicken}/batches"
              payload: { store_id: "${store_id}", cooked_at: "2026-09-01T09:00:00Z", grams_cooked: 1000 }
              as: StoreManager
              captures: { batch_id: $.data.id }
            - call: "POST /api/v1/stores/${store_id}/menu-items"
              payload: { item_code: "BOWL", display_name: "Chicken Bowl", base_price_cents: 1095 }
              as: StoreManager
              captures: { item_bowl: $.data.id }
            - call: "POST /api/v1/menu-items/${item_bowl}/recipe-components"
              payload: { ingredient_id: "${ing_chicken}", standard_grams: 120 }
              as: StoreManager
            - call: "POST /api/v1/stores/${store_id}/production-windows"
              payload: { interval_start: "2026-09-01T10:15:00Z", interval_end: "2026-09-01T10:30:00Z" }
              as: StoreManager
          trigger:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:59:59Z" }
              as: PlatformAdmin
            - call: "GET /api/v1/batches/${batch_id}"
              payload: {}
              as: GeneralManager
              as_user_id: "gm-quinn"
              captures: { status_before: $.data.status }
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:00:00Z" }
              as: PlatformAdmin
            - call: "GET /api/v1/batches/${batch_id}"
              payload: {}
              as: GeneralManager
              as_user_id: "gm-quinn"
              captures: { status_at: $.data.status }
          assert:
            - "at 09:59:59 (one second before discard_at) the batch is still ACTIVE"
            - "at exactly 10:00:00 (== discard_at) the batch is EXPIRED (inclusive firing threshold, discard_at <= now)"
            - "this inclusive point-in-time TTL differs from the HALF-OPEN adjacency of production windows (where [10:15,10:30) and [10:30,10:45) coexist)"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: order_cancel_restores_capacity_and_grams
        grounds:
          - state_machines.Order
          - entities.Store.fields.digital_interval_load
          - entities.Ingredient.fields.on_hand_grams
        distinguishing_aspect: |
          Conserved quantity = committed digital capacity + ingredient grams.
          A digital order commits entree_count to the window and consumes grams;
          its CANCEL must leave Store.digital_interval_load and
          Ingredient.on_hand_grams exactly where they were before the order
          (forward + compensate == identity on both counters).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T10:00:00Z. Store S17, BOWL (chicken 120g). Chicken batch 10000g."
            - "One window. Record baseline on_hand and load."
