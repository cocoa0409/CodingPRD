scaffold_corner_design:

  # ===========================================================================
  # 1. From Table 1 (Entities)
  # ===========================================================================
  - section: Entities
    instances:

      - name: student_created_with_only_required_fields_gets_declared_defaults
        claim_type: Creation
        grounds: [entities.Student, "endpoints[POST /students]"]
        distinguishing_aspect: |
          A create carrying ONLY the three required fields must materialise every
          declared default and every computed field, including the two per-subject
          maps. remaining_attempts must arrive fully populated at 3 per subject
          rather than empty, because the retake budget invariant reads it before any
          attempt exists.
        test_recipe:
          setup:
            - "Logical clock left at its startup default 2026-08-01T00:00:00Z."
            - "Empty database; no courses, rules or attempts exist."
          setup_api_calls: []
          trigger:
            - call: "POST /students"
              payload: { student_number: "S-MIN-1", full_name: "Minimal Student", race_ethnicity_code: "UNKNOWN" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { sid: $.data.id, first_gen: $.data.first_generation, pell: $.data.pell_eligible, el: $.data.el_status, tstatus: $.data.hs_transcript_status, gpa: $.data.hs_gpa, pathway: $.data.self_guided_pathway, counts: $.data.attempt_counts, remaining: $.data.remaining_attempts, pstatus: $.data.placement_status, hold: $.data.advising_hold, ver: $.data.version }
          assert:
            - "HTTP 201 and ${sid} is a UUID with no type prefix"
            - "${first_gen} == false and ${pell} == false — declared boolean defaults"
            - "${el} == \"NOT_EL\" and ${tstatus} == \"NONE\" — declared enum defaults"
            - "${gpa} == null and ${pathway} == null — no measure supplied, no measure invented"
            - "${counts} == { MATH: 0, ENGLISH: 0, ESL: 0 } and ${remaining} == { MATH: 3, ENGLISH: 3, ESL: 3 } — both maps fully populated at MAX_ATTEMPTS_PER_SUBJECT, not empty objects"
            - "${pstatus} == \"UNPLACED\" and ${hold} == false"
            - "${ver} == 1 — the version counter starts at 1, not 0"

      - name: test_administration_get_returns_stored_window_and_derived_duration
        claim_type: Retrieval
        grounds: [entities.TestAdministration, "endpoints[GET /test-administrations/{administration_id}]"]
        distinguishing_aspect: |
          The read must return the stored window verbatim AND the derived
          duration_minutes, which is never supplied by the client. A four-hour
          window that crosses midnight is used so a naive same-day subtraction
          cannot produce the right answer.
        test_recipe:
          setup:
            - "Logical clock left at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /test-administrations"
              payload: { room_code: "T20", subject_area: "ENGLISH", proctor_user_id: "proctor-20", starts_at: "2026-09-10T22:00:00Z", ends_at: "2026-09-11T02:00:00Z", seat_capacity: 12 }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { adm: $.data.id }
          trigger:
            - call: "GET /test-administrations/${adm}"
              payload: {}
              as: Proctor
              as_user_id: "proctor-20"
              captures: { room: $.data.room_code, subj: $.data.subject_area, proc: $.data.proctor_user_id, st: $.data.starts_at, en: $.data.ends_at, cap: $.data.seat_capacity, mins: $.data.duration_minutes, booked: $.data.seats_booked, status: $.data.status }
          assert:
            - "${room} == \"T20\", ${subj} == \"ENGLISH\", ${proc} == \"proctor-20\", ${cap} == 12"
            - "${st} == \"2026-09-10T22:00:00Z\" and ${en} == \"2026-09-11T02:00:00Z\" — stored verbatim"
            - "${mins} == 240 — derived across the midnight boundary, not from a same-day clock difference"
            - "${booked} == 0 and ${status} == \"SCHEDULED\""

      - name: students_list_paginates_with_limit_offset_and_total_count
        claim_type: Listing
        grounds: [response_envelope.pagination_fields, "endpoints[GET /students]"]
        distinguishing_aspect: |
          total_count must report the size of the FILTERED set rather than the page,
          and has_more must be computed from offset + returned rather than from the
          page being full. The third page of a three-row set returns one row with
          has_more false, which is where an off-by-one shows up.
        test_recipe:
          setup:
            - "Logical clock left at its startup default 2026-08-01T00:00:00Z."
            - "Exactly three Students exist, created in a known order."
          setup_api_calls:
            - call: "POST /students"
              payload: { student_number: "P-1", full_name: "Page One", race_ethnicity_code: "ASIAN" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { p1: $.data.id }
            - call: "POST /students"
              payload: { student_number: "P-2", full_name: "Page Two", race_ethnicity_code: "ASIAN" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { p2: $.data.id }
            - call: "POST /students"
              payload: { student_number: "P-3", full_name: "Page Three", race_ethnicity_code: "WHITE" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { p3: $.data.id }
          trigger:
            - call: "GET /students"
              payload: { limit: 2, offset: 0 }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { page1_first: "$.data[0].student_number" }
            - call: "GET /students"
              payload: { limit: 2, offset: 2 }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { page2_first: "$.data[0].student_number" }
            - call: "GET /students"
              payload: { student_number: "P-3" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { filtered_first: "$.data[0].student_number" }
          assert:
            - "PAGE 1: response_type == \"array\", meta present, limit 2, offset 0, total_count 3, has_more true, 2 rows returned, ${page1_first} == \"P-1\""
            - "PAGE 2: limit 2, offset 2, total_count 3, has_more FALSE, 1 row returned, ${page2_first} == \"P-3\" — has_more comes from offset + returned < total_count, not from the page being under-full"
            - "FILTERED by student_number: total_count 1, 1 row returned, has_more false and ${filtered_first} == \"P-3\" — total_count reflects the filtered set, not the table"
            - "an omitted limit applies the declared default of 10 and an omitted offset applies 0"

      - name: get_student_with_unknown_uuid_returns_student_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_STUDENT_NOT_FOUND]", "validations[priority=5]"]
        distinguishing_aspect: |
          A well-formed but unknown path UUID must produce the entity-specific 404
          from the priority 5 catalogue, in the error envelope shape, and must not
          be confused with the 400 reserved for malformed input.
        test_recipe:
          setup:
            - "Logical clock left at its startup default 2026-08-01T00:00:00Z."
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /students/11111111-2222-4333-8444-555555555555"
              payload: {}
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { err: $.data.error_id, msg: $.data.message }
          assert:
            - "${err} == \"ERR_STUDENT_NOT_FOUND\" with HTTP 404"
            - "${err} != \"ERR_INVALID_REQUEST\" — the UUID is well formed, so this is existence and not shape"
            - "${msg} is a non-empty string and response_type == \"error\" with meta.api_request_id present"

      - name: create_course_without_units_rejected_as_invalid_request
        claim_type: Required Fields
        grounds: [entities.Course.fields.units, "validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: |
          units carries source input with NO default, so omitting it is a shape
          error at priority 4 — which sits ABOVE the existence checks, so a payload
          that omits units AND names a nonexistent FK still answers 400. The rule
          also has to reject an unknown body key, since the priority 4 check
          forbids unknown fields.
        test_recipe:
          setup:
            - "Logical clock left at its startup default 2026-08-01T00:00:00Z."
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /courses"
              payload: { course_code: "MATH-100", title: "College Algebra", subject_area: "MATH", level_rank: 100 }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { err_missing: $.data.error_id }
            - call: "POST /courses"
              payload: { course_code: "MATH-100", title: "College Algebra", subject_area: "MATH", level_rank: 100, units: 4.0, is_support_course: false, transfer_level: true }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { cid: $.data.id, cunits: $.data.units, cstatus: $.data.status }
          assert:
            - "${err_missing} == \"ERR_INVALID_REQUEST\" with HTTP 400 and no Course row is created"
            - "${cunits} == 4.0 and ${cstatus} == \"ACTIVE\" — the same payload with units supplied succeeds"
            - "a body carrying an undeclared key such as enrolled_count also answers ERR_INVALID_REQUEST (400): computed fields are not writable"

      - name: section_created_with_declared_pairing_and_counter_defaults
        claim_type: Defaults
        grounds: [entities.Section, "endpoints[POST /sections]"]
        distinguishing_aspect: |
          role_in_pair defaults to the sentinel string NONE rather than null, and
          available_seats is already populated at create time from
          calculations.section_available_seats variant committed_only — so a brand
          new PLANNED section advertises its full capacity even though it cannot
          take registrations yet.
        test_recipe:
          setup:
            - "Logical clock left at its startup default 2026-08-01T00:00:00Z."
            - "One ACTIVE Course MATH-100 with units 4.0 exists."
          setup_api_calls:
            - call: "POST /courses"
              payload: { course_code: "MATH-100", title: "College Algebra", subject_area: "MATH", level_rank: 100, units: 4.0, is_support_course: false, transfer_level: true }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { c_100: $.data.id }
          trigger:
            - call: "POST /sections"
              payload: { course_id: "${c_100}", term_code: "2026FA", room_code: "R700", meets_start_at: "2026-09-01T17:00:00Z", meets_end_at: "2026-09-01T18:00:00Z", seat_capacity: 25 }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { sec: $.data.id, status: $.data.status, pairing: $.data.pairing_state, role: $.data.role_in_pair, link: $.data.linked_section_id, taken: $.data.seats_taken, held: $.data.seats_held, wait: $.data.waitlist_count, avail: $.data.available_seats, ver: $.data.version }
          assert:
            - "${status} == \"PLANNED\" — the declared initial state, not OPEN"
            - "${pairing} == \"UNPAIRED\" and ${role} == \"NONE\" and ${link} == null — role_in_pair is the sentinel NONE, never null"
            - "${taken} == 0 and ${held} == 0 and ${wait} == 0"
            - "${avail} == 25 — committed_only gives max(0, 25 - 0) at create time"
            - "${ver} == 1"

      - name: course_success_counters_recomputed_from_posted_grades
        claim_type: Computed Fields
        grounds: [entities.Course.fields.success_rate, "endpoints[POST /registrations/{registration_id}/grade]"]
        distinguishing_aspect: |
          success_rate divides by the COMPLETED count, not by enrolled_count, and it
          is null rather than 0 while no registration has been graded. Two students
          graded A and D therefore walk the field null -> 1.0 -> 0.5 while
          enrolled_count sits still at 2 the whole time.
        test_recipe:
          setup:
            - "Logical clock left at its startup default 2026-08-01T00:00:00Z."
            - "Course MATH-050 (MATH, level_rank 50, units 5.0) with no requisite edges, so the closure returns SATISFIED."
            - "One ACTIVE PlacementRule TRANSCRIPT_GPA -> MATH-050 (min_hs_gpa 2.0, V1)."
            - "Section secG of MATH-050, term 2026FA, seat_capacity 5, OPEN."
            - "Students SE1 and SE2 (hs_gpa 2.50 VERIFIED, transcript 2025-06-01T00:00:00Z), each with a determination placing MATH-050, both ENROLLED."
          setup_api_calls:
            - call: "POST /courses"
              payload: { course_code: "MATH-050", title: "Pre-Algebra", subject_area: "MATH", level_rank: 50, units: 5.0, is_support_course: false, transfer_level: false }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { c_050: $.data.id }
            - call: "POST /placement-rules"
              payload: { subject_area: "MATH", measure_type: "TRANSCRIPT_GPA", target_course_id: "${c_050}", priority_rank: 10, min_hs_gpa: 2.0, effective_from: "2026-07-01T00:00:00Z", version_label: "V1" }
              as: AssessmentDirector
              as_user_id: "director-1"
              captures: { rule: $.data.id }
            - call: "POST /placement-rules/${rule}/activate"
              payload: {}
              as: AssessmentDirector
              as_user_id: "director-1"
            - call: "POST /sections"
              payload: { course_id: "${c_050}", term_code: "2026FA", room_code: "R710", meets_start_at: "2026-09-01T17:00:00Z", meets_end_at: "2026-09-01T18:00:00Z", seat_capacity: 5 }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { secg: $.data.id }
            - call: "POST /sections/${secg}/status"
              payload: { target_status: "OPEN" }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { secg_v0: $.data.version }
            - call: "POST /students"
              payload: { student_number: "SE1", full_name: "Student E One", race_ethnicity_code: "HISPANIC", hs_gpa: 2.50, hs_transcript_status: "VERIFIED", transcript_recorded_at: "2025-06-01T00:00:00Z" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { se1: $.data.id, se1_v: $.data.version }
            - call: "POST /placement-determinations"
              payload: { student_id: "${se1}", subject_area: "MATH", expected_student_version: "${se1_v}" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { det1: $.data.id }
            - call: "POST /registrations"
              payload: { student_id: "${se1}", section_id: "${secg}", expected_section_version: "${secg_v0}" }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { reg1: $.data.id }
            - call: "POST /registrations/${reg1}/confirm"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { reg1_state: $.data.state }
            - call: "POST /students"
              payload: { student_number: "SE2", full_name: "Student E Two", race_ethnicity_code: "WHITE", hs_gpa: 2.50, hs_transcript_status: "VERIFIED", transcript_recorded_at: "2025-06-01T00:00:00Z" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { se2: $.data.id, se2_v: $.data.version }
            - call: "POST /placement-determinations"
              payload: { student_id: "${se2}", subject_area: "MATH", expected_student_version: "${se2_v}" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { det2: $.data.id }
            - call: "GET /sections/${secg}"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { secg_v1: $.data.version }
            - call: "POST /registrations"
              payload: { student_id: "${se2}", section_id: "${secg}", expected_section_version: "${secg_v1}" }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { reg2: $.data.id }
            - call: "POST /registrations/${reg2}/confirm"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { reg2_state: $.data.state }
          trigger:
            - call: "GET /courses/${c_050}"
              payload: {}
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { enr_0: $.data.enrolled_count, suc_0: $.data.success_count, rate_0: $.data.success_rate }
            - call: "POST /registrations/${reg1}/grade"
              payload: { final_grade: "A" }
              as: Instructor
              as_user_id: "instructor-1"
              captures: { reg1_graded: $.data.state, reg1_success: $.data.success, reg1_graded_at: $.data.graded_at }
            - call: "GET /courses/${c_050}"
              payload: {}
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { enr_1: $.data.enrolled_count, suc_1: $.data.success_count, rate_1: $.data.success_rate }
            - call: "POST /registrations/${reg2}/grade"
              payload: { final_grade: "D" }
              as: Instructor
              as_user_id: "instructor-1"
              captures: { reg2_graded: $.data.state, reg2_success: $.data.success }
            - call: "GET /courses/${c_050}"
              payload: {}
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { enr_2: $.data.enrolled_count, suc_2: $.data.success_count, rate_2: $.data.success_rate }
            - call: "GET /sections/${secg}"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { secg_taken: $.data.seats_taken, secg_avail: $.data.available_seats }
          assert:
            - "${reg1_state} == \"ENROLLED\" and ${reg2_state} == \"ENROLLED\" (setup)"
            - "BEFORE ANY GRADE: ${enr_0} == 2, ${suc_0} == 0, ${rate_0} == null — null, NOT 0.0, because no Registration is COMPLETED yet"
            - "${reg1_graded} == \"COMPLETED\", ${reg1_success} == true, ${reg1_graded_at} == \"2026-08-01T00:00:00Z\""
            - "AFTER GRADE A: ${enr_1} == 2, ${suc_1} == 1, ${rate_1} == 1.0 — the denominator is the COMPLETED count (1), not enrolled_count (2)"
            - "${reg2_graded} == \"COMPLETED\" and ${reg2_success} == false — D is not in {A, B, C, P}"
            - "AFTER GRADE D: ${enr_2} == 2, ${suc_2} == 1, ${rate_2} == 0.5 — round(1 / 2, 4)"
            - "${secg_taken} == 2 and ${secg_avail} == 3 — grading does NOT release the seat, so COMPLETED still counts in seats_taken"

      - name: registration_system_fields_are_server_minted_and_version_starts_at_one
        claim_type: System Fields
        grounds: [entities.Registration, "endpoints[POST /registrations]"]
        distinguishing_aspect: |
          The four common fields are server-owned: id is a bare UUID with no type
          prefix, created_at and updated_at are ISO 8601 UTC with three fractional
          digits, and version starts at 1. The parent Section's version increments
          on the very same call, which is what later OCC reads depend on.
        test_recipe:
          setup:
            - "Logical clock left at its startup default 2026-08-01T00:00:00Z."
            - "Course MATH-050 with no requisite edges; one ACTIVE PlacementRule TRANSCRIPT_GPA -> MATH-050 (min_hs_gpa 2.0, V1)."
            - "Section secH of MATH-050, seat_capacity 5, OPEN; its version is captured immediately before the hold."
            - "Student SH (hs_gpa 2.50 VERIFIED) with a determination placing MATH-050."
          setup_api_calls:
            - call: "POST /courses"
              payload: { course_code: "MATH-050", title: "Pre-Algebra", subject_area: "MATH", level_rank: 50, units: 5.0, is_support_course: false, transfer_level: false }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { c_050: $.data.id }
            - call: "POST /placement-rules"
              payload: { subject_area: "MATH", measure_type: "TRANSCRIPT_GPA", target_course_id: "${c_050}", priority_rank: 10, min_hs_gpa: 2.0, effective_from: "2026-07-01T00:00:00Z", version_label: "V1" }
              as: AssessmentDirector
              as_user_id: "director-1"
              captures: { rule: $.data.id }
            - call: "POST /placement-rules/${rule}/activate"
              payload: {}
              as: AssessmentDirector
              as_user_id: "director-1"
            - call: "POST /sections"
              payload: { course_id: "${c_050}", term_code: "2026FA", room_code: "R720", meets_start_at: "2026-09-01T17:00:00Z", meets_end_at: "2026-09-01T18:00:00Z", seat_capacity: 5 }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { sech: $.data.id, sech_v_create: $.data.version }
            - call: "POST /sections/${sech}/status"
              payload: { target_status: "OPEN" }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { sech_v_open: $.data.version }
            - call: "POST /students"
              payload: { student_number: "SH", full_name: "Student H", race_ethnicity_code: "BLACK", hs_gpa: 2.50, hs_transcript_status: "VERIFIED", transcript_recorded_at: "2025-06-01T00:00:00Z" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { sh: $.data.id, sh_v: $.data.version }
            - call: "POST /placement-determinations"
              payload: { student_id: "${sh}", subject_area: "MATH", expected_student_version: "${sh_v}" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { det_h: $.data.id }
          trigger:
            - call: "POST /registrations"
              payload: { student_id: "${sh}", section_id: "${sech}", expected_section_version: "${sech_v_open}" }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { reg: $.data.id, reg_created: $.data.created_at, reg_updated: $.data.updated_at, reg_ver: $.data.version, reg_grade: $.data.final_grade, reg_units: $.data.term_units_at_confirm, reg_denial: $.data.denial_reason, reg_coreq: $.data.coreq_registration_id }
            - call: "GET /sections/${sech}"
              payload: {}
              as: Registrar
              as_user_id: "registrar-1"
              captures: { sech_v_after: $.data.version, sech_held: $.data.seats_held }
          assert:
            - "${sech_v_create} == 1 and ${sech_v_open} == 2 — the status write incremented the Section's version"
            - "${reg} is a bare UUID with no \"reg_\" or similar prefix"
            - "${reg_created} and ${reg_updated} are equal ISO 8601 UTC instants with three fractional digits, and neither was supplied by the client"
            - "${reg_ver} == 1"
            - "${reg_grade} == null, ${reg_units} == null, ${reg_denial} == null, ${reg_coreq} == null — nothing is invented at hold time"
            - "${sech_v_after} == 3 and ${sech_held} == 1 — the hold bumped the OCC parent exactly once"

      - name: placement_rule_rejects_unknown_measure_type_and_out_of_range_priority
        claim_type: Type Constraints
        grounds: [entities.PlacementRule, "validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: |
          Three separate shape rules on one endpoint: an enum member outside the
          declared set, a numeric field outside its declared 1-999 range, and the
          cross-field ordering constraint min_hs_gpa < max_hs_gpa. All three answer
          the same 400 at priority 4, and none of them is allowed to slip through to
          the activate step where it would surface as a different error.
        test_recipe:
          setup:
            - "Logical clock left at its startup default 2026-08-01T00:00:00Z."
            - "One ACTIVE Course MATH-100 exists."
          setup_api_calls:
            - call: "POST /courses"
              payload: { course_code: "MATH-100", title: "College Algebra", subject_area: "MATH", level_rank: 100, units: 4.0, is_support_course: false, transfer_level: true }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { c_100: $.data.id }
          trigger:
            - call: "POST /placement-rules"
              payload: { subject_area: "MATH", measure_type: "PORTFOLIO", target_course_id: "${c_100}", priority_rank: 10, min_hs_gpa: 2.0, effective_from: "2026-07-01T00:00:00Z", version_label: "V1" }
              as: AssessmentDirector
              as_user_id: "director-1"
              captures: { err_enum: $.data.error_id }
            - call: "POST /placement-rules"
              payload: { subject_area: "MATH", measure_type: "TRANSCRIPT_GPA", target_course_id: "${c_100}", priority_rank: 0, min_hs_gpa: 2.0, effective_from: "2026-07-01T00:00:00Z", version_label: "V1" }
              as: AssessmentDirector
              as_user_id: "director-1"
              captures: { err_range: $.data.error_id }
            - call: "POST /placement-rules"
              payload: { subject_area: "MATH", measure_type: "TRANSCRIPT_GPA", target_course_id: "${c_100}", priority_rank: 10, min_hs_gpa: 3.0, max_hs_gpa: 2.0, effective_from: "2026-07-01T00:00:00Z", version_label: "V1" }
              as: AssessmentDirector
              as_user_id: "director-1"
              captures: { err_order: $.data.error_id }
            - call: "POST /placement-rules"
              payload: { subject_area: "MATH", measure_type: "TRANSCRIPT_GPA", target_course_id: "${c_100}", priority_rank: 1, min_hs_gpa: 2.0, max_hs_gpa: 4.5, effective_from: "2026-07-01T00:00:00Z", version_label: "V1" }
              as: AssessmentDirector
              as_user_id: "director-1"
              captures: { ok_id: $.data.id, ok_status: $.data.status, ok_coreq: $.data.coreq_required, ok_activated: $.data.activated_at }
          assert:
            - "${err_enum} == \"ERR_INVALID_REQUEST\" with HTTP 400 — PORTFOLIO is not in {TRANSCRIPT_GPA, TEST_SCORE, SELF_GUIDED}"
            - "${err_range} == \"ERR_INVALID_REQUEST\" with HTTP 400 — priority_rank 0 is below the declared 1-999 range"
            - "${err_order} == \"ERR_INVALID_REQUEST\" with HTTP 400 — min_hs_gpa < max_hs_gpa is declared on the field itself"
            - "${ok_status} == \"DRAFT\", ${ok_coreq} == false, ${ok_activated} == null — the boundary-legal payload succeeds and no rule is born ACTIVE"
            - "no PlacementRule row exists for any of the three rejected payloads"

      - name: course_requisite_with_unknown_requisite_course_returns_course_not_found
        claim_type: Parent Relationships
        grounds: [entities.CourseRequisite.fields.requisite_course_id, "validations[priority=6]", "errors[ERR_COURSE_NOT_FOUND]"]
        distinguishing_aspect: |
          Body foreign keys are validated at priority 6 in the order the endpoint's
          input list declares them, so a payload whose course_id is valid but whose
          requisite_course_id is unknown answers ERR_COURSE_NOT_FOUND — and the same
          404 is produced when BOTH are unknown, since the first failure wins.
        test_recipe:
          setup:
            - "Logical clock left at its startup default 2026-08-01T00:00:00Z."
            - "One ACTIVE Course MATH-050 exists; no course carries the probe UUID."
          setup_api_calls:
            - call: "POST /courses"
              payload: { course_code: "MATH-050", title: "Pre-Algebra", subject_area: "MATH", level_rank: 50, units: 5.0, is_support_course: false, transfer_level: false }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { c_050: $.data.id }
          trigger:
            - call: "POST /course-requisites"
              payload: { course_id: "${c_050}", requisite_course_id: "11111111-2222-4333-8444-555555555555", requisite_type: "PREREQUISITE", min_grade: "C", enforcement: "BLOCKING" }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { err_fk: $.data.error_id }
            - call: "POST /courses"
              payload: { course_code: "READ-050", title: "College Reading", subject_area: "ENGLISH", level_rank: 50, units: 3.0, is_support_course: false, transfer_level: false }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { c_read: $.data.id }
            - call: "POST /course-requisites"
              payload: { course_id: "${c_050}", requisite_course_id: "${c_read}", requisite_type: "PREREQUISITE" }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { req: $.data.id, req_grade: $.data.min_grade, req_enf: $.data.enforcement, req_status: $.data.status }
          assert:
            - "${err_fk} == \"ERR_COURSE_NOT_FOUND\" with HTTP 404 and no CourseRequisite row is created"
            - "${req_grade} == \"C\" and ${req_enf} == \"BLOCKING\" and ${req_status} == \"ACTIVE\" — the omitted optional fields take their declared defaults"
            - "GET /course-requisites/${req} returns the same row, and GET /courses/${c_050}/requisites lists it with total_count 1 — reverse reachability from the FK"

      - name: prerequisite_cycle_rejected_for_self_edge_and_for_two_hop_loop
        claim_type: "graph topology: cycle-related constraints"
        grounds: ["errors[ERR_REQUISITE_CYCLE]", "validations[priority=14]", calculations.prerequisite_satisfaction_closure]
        distinguishing_aspect: |
          entity_topology is graph, and CourseRequisite is the self-referential
          junction, so the cycle check is the topology's load-bearing constraint. It
          must fire on the degenerate self-edge AND on a two-hop loop closed from the
          other direction, while a diamond (two courses sharing one prerequisite) is
          NOT a cycle and must be accepted. Only ACTIVE PREREQUISITE edges are
          traversed, so a COREQUISITE edge closing the same loop is legal.
        test_recipe:
          setup:
            - "Logical clock left at its startup default 2026-08-01T00:00:00Z."
            - "Courses MATH-050, MATH-100, READ-050 and MATH-100S, all ACTIVE."
            - "One ACTIVE BLOCKING PREREQUISITE edge MATH-100 -> MATH-050 exists before the probes."
          setup_api_calls:
            - call: "POST /courses"
              payload: { course_code: "MATH-050", title: "Pre-Algebra", subject_area: "MATH", level_rank: 50, units: 5.0, is_support_course: false, transfer_level: false }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { c_050: $.data.id }
            - call: "POST /courses"
              payload: { course_code: "MATH-100", title: "College Algebra", subject_area: "MATH", level_rank: 100, units: 4.0, is_support_course: false, transfer_level: true }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { c_100: $.data.id }
            - call: "POST /courses"
              payload: { course_code: "READ-050", title: "College Reading", subject_area: "ENGLISH", level_rank: 50, units: 3.0, is_support_course: false, transfer_level: false }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { c_read: $.data.id }
            - call: "POST /courses"
              payload: { course_code: "MATH-100S", title: "Algebra Support", subject_area: "MATH", level_rank: 100, units: 2.0, is_support_course: true, transfer_level: false }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { c_100s: $.data.id }
            - call: "POST /course-requisites"
              payload: { course_id: "${c_100}", requisite_course_id: "${c_050}", requisite_type: "PREREQUISITE", min_grade: "C", enforcement: "BLOCKING" }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { edge_100_050: $.data.id }
          trigger:
            - call: "POST /course-requisites"
              payload: { course_id: "${c_050}", requisite_course_id: "${c_050}", requisite_type: "PREREQUISITE", min_grade: "C", enforcement: "BLOCKING" }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { err_self: $.data.error_id }
            - call: "POST /course-requisites"
              payload: { course_id: "${c_050}", requisite_course_id: "${c_100}", requisite_type: "PREREQUISITE", min_grade: "C", enforcement: "BLOCKING" }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { err_loop: $.data.error_id }
            - call: "POST /course-requisites"
              payload: { course_id: "${c_050}", requisite_course_id: "${c_100}", requisite_type: "COREQUISITE" }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { coreq_ok: $.data.id, coreq_ok_type: $.data.requisite_type }
            - call: "POST /course-requisites"
              payload: { course_id: "${c_100s}", requisite_course_id: "${c_050}", requisite_type: "PREREQUISITE", min_grade: "C", enforcement: "BLOCKING" }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { diamond_ok: $.data.id, diamond_status: $.data.status }
            - call: "POST /course-requisites"
              payload: { course_id: "${c_050}", requisite_course_id: "${c_read}", requisite_type: "PREREQUISITE", min_grade: "C", enforcement: "BLOCKING" }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { chain_ok: $.data.id }
            - call: "POST /course-requisites"
              payload: { course_id: "${c_read}", requisite_course_id: "${c_100}", requisite_type: "PREREQUISITE", min_grade: "C", enforcement: "BLOCKING" }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { err_three_hop: $.data.error_id }
          assert:
            - "SELF EDGE: ${err_self} == \"ERR_REQUISITE_CYCLE\" with HTTP 409 — the degenerate case is explicitly in scope"
            - "TWO HOP: ${err_loop} == \"ERR_REQUISITE_CYCLE\" with HTTP 409 — MATH-100 already requires MATH-050, so MATH-050 requiring MATH-100 closes the loop"
            - "${coreq_ok_type} == \"COREQUISITE\" — the SAME pair of courses in the SAME direction is legal as a corequisite, because only PREREQUISITE edges are traversed"
            - "DIAMOND: ${diamond_status} == \"ACTIVE\" — MATH-100S and MATH-100 sharing the prerequisite MATH-050 is not a cycle"
            - "THREE HOP: ${chain_ok} is created (MATH-050 -> READ-050), then ${err_three_hop} == \"ERR_REQUISITE_CYCLE\" — READ-050 -> MATH-100 closes MATH-100 -> MATH-050 -> READ-050 -> MATH-100, so the walk is transitive and not depth-1"
            - "no CourseRequisite row exists for any rejected payload"

  # ===========================================================================
  # 2. From Table 2 (State Machines)
  # ===========================================================================
  - section: State Machines
    instances:

      - name: newly_created_entities_start_in_their_declared_initial_states
        claim_type: Initial State
        grounds: [state_machines.Section, state_machines.TestAdministration, state_machines.PlacementRule, state_machines.PrerequisiteOverride, state_machines.CourseRequisite]
        distinguishing_aspect: |
          Five machines, five different initial states, all asserted from the create
          response rather than from a follow-up read — and none of them is the
          "obvious" active state: a Section is PLANNED not OPEN, a rule is DRAFT not
          ACTIVE, a requisite edge is ACTIVE immediately with no activation step at
          all, and an override is ISSUED with a null consumer.
        test_recipe:
          setup:
            - "Logical clock left at its startup default 2026-08-01T00:00:00Z."
            - "Empty database."
          setup_api_calls:
            - call: "POST /courses"
              payload: { course_code: "MATH-050", title: "Pre-Algebra", subject_area: "MATH", level_rank: 50, units: 5.0, is_support_course: false, transfer_level: false }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { c_050: $.data.id, c_status: $.data.status }
            - call: "POST /courses"
              payload: { course_code: "READ-050", title: "College Reading", subject_area: "ENGLISH", level_rank: 50, units: 3.0, is_support_course: false, transfer_level: false }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { c_read: $.data.id }
            - call: "POST /students"
              payload: { student_number: "SI", full_name: "Student I", race_ethnicity_code: "MULTI" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { si: $.data.id }
          trigger:
            - call: "POST /course-requisites"
              payload: { course_id: "${c_050}", requisite_course_id: "${c_read}", requisite_type: "PREREQUISITE", min_grade: "C", enforcement: "BLOCKING" }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { req: $.data.id, req_status: $.data.status }
            - call: "POST /placement-rules"
              payload: { subject_area: "MATH", measure_type: "TRANSCRIPT_GPA", target_course_id: "${c_050}", priority_rank: 10, min_hs_gpa: 2.0, effective_from: "2026-07-01T00:00:00Z", version_label: "V1" }
              as: AssessmentDirector
              as_user_id: "director-1"
              captures: { rule_status: $.data.status, rule_activated: $.data.activated_at }
            - call: "POST /sections"
              payload: { course_id: "${c_050}", term_code: "2026FA", room_code: "R730", meets_start_at: "2026-09-01T17:00:00Z", meets_end_at: "2026-09-01T18:00:00Z", seat_capacity: 5 }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { sec_status: $.data.status, sec_pairing: $.data.pairing_state }
            - call: "POST /test-administrations"
              payload: { room_code: "T30", subject_area: "MATH", proctor_user_id: "proctor-30", starts_at: "2026-09-05T09:00:00Z", ends_at: "2026-09-05T11:00:00Z", seat_capacity: 8 }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { adm_status: $.data.status }
            - call: "POST /prerequisite-overrides"
              payload: { student_id: "${si}", course_id: "${c_050}", requisite_id: "${req}", justification: "Departmental waiver on file.", expires_at: "2026-12-01T00:00:00Z" }
              as: Instructor
              as_user_id: "instructor-1"
              captures: { ovr_state: $.data.state, ovr_consumer: $.data.consumed_by_registration_id, ovr_issuer: $.data.issued_by_user_id }
          assert:
            - "${c_status} == \"ACTIVE\" — Course has no draft stage"
            - "${req_status} == \"ACTIVE\" — CourseRequisite is enforceable from creation; there is no activate endpoint for it"
            - "${rule_status} == \"DRAFT\" and ${rule_activated} == null — a rule is NOT consulted by the selector until activation"
            - "${sec_status} == \"PLANNED\" and ${sec_pairing} == \"UNPAIRED\""
            - "${adm_status} == \"SCHEDULED\""
            - "${ovr_state} == \"ISSUED\", ${ovr_consumer} == null, ${ovr_issuer} == \"instructor-1\" — issued_by_user_id is taken from X-User-ID, not from the body"

      - name: manual_no_show_keeps_the_ordinal_slot_and_advances_the_next_tier
        claim_type: Valid Transition
        grounds: [state_machines.TestAttempt.BOOKED_to_NO_SHOW, "endpoints[POST /test-attempts/{attempt_id}/no-show]", calculations.retake_eligibility_window]
        distinguishing_aspect: |
          A no-show costs the student nothing in budget yet still costs them a tier:
          the abandoned attempt KEEPS its ordinal slot, so the next scored attempt is
          ordinal 2 and draws the 30-day tier instead of the 14-day tier. Treating a
          no-show as if it never happened yields 2026-08-15 instead of 2026-08-31,
          and dropping it from the pool the way a void does yields the same wrong
          answer.
        test_recipe:
          setup:
            - "Logical clock left at its startup default 2026-08-01T00:00:00Z."
            - "Session E1: room T31, proctor-31, 2026-08-01T00:00:00Z-02:00:00Z, seat_capacity 5, driven to OPEN — the window brackets the clock so check-in is legal."
            - "Student SJ with no transcript; NO PlacementDetermination exists."
          setup_api_calls:
            - call: "POST /test-administrations"
              payload: { room_code: "T31", subject_area: "MATH", proctor_user_id: "proctor-31", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-01T02:00:00Z", seat_capacity: 5 }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { e1: $.data.id }
            - call: "POST /test-administrations/${e1}/status"
              payload: { target_status: "OPEN" }
              as: Proctor
              as_user_id: "proctor-31"
            - call: "POST /students"
              payload: { student_number: "SJ", full_name: "Student J", race_ethnicity_code: "NHPI" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { sj: $.data.id }
            - call: "POST /test-attempts"
              payload: { student_id: "${sj}", administration_id: "${e1}" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { att1: $.data.id, att1_state: $.data.state }
          trigger:
            - call: "POST /test-attempts/${att1}/no-show"
              payload: {}
              as: Proctor
              as_user_id: "proctor-31"
              captures: { att1_after: $.data.state, att1_gate: $.data.next_eligible_at, att1_ord: $.data.attempt_ordinal }
            - call: "GET /students/${sj}"
              payload: {}
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { sj_counts: $.data.attempt_counts, sj_remaining: $.data.remaining_attempts }
            - call: "POST /test-attempts"
              payload: { student_id: "${sj}", administration_id: "${e1}" }
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { att2: $.data.id, att2_state: $.data.state }
            - call: "POST /test-attempts/${att2}/check-in"
              payload: {}
              as: Proctor
              as_user_id: "proctor-31"
            - call: "POST /test-attempts/${att2}/score"
              payload: { raw_score: 100 }
              as: Proctor
              as_user_id: "proctor-31"
              captures: { att2_ord: $.data.attempt_ordinal, att2_gate: $.data.next_eligible_at, att2_scaled: $.data.scaled_score }
            - call: "GET /students/${sj}"
              payload: {}
              as: AssessmentStaff
              as_user_id: "staff-1"
              captures: { sj_counts2: $.data.attempt_counts, sj_remaining2: $.data.remaining_attempts }
          assert:
            - "${att1_state} == \"BOOKED\" (setup)"
            - "${att1_after} == \"NO_SHOW\" and ${att1_gate} == null and ${att1_ord} == 1 — the slot is kept"
            - "${sj_counts}.MATH == 0 and ${sj_remaining}.MATH == 3 — a no-show consumes no budget"
            - "${att2_state} == \"BOOKED\" — a second booking in the SAME session is allowed, because ERR_ATTEMPT_ALREADY_OPEN only looks at BOOKED and CHECKED_IN and the retake gate is null with no SCORED attempt"
            - "${att2_ord} == 2 — the NO_SHOW attempt stays in the ordinal pool"
            - "${att2_gate} == \"2026-08-31T00:00:00Z\" — tier 2 (30 days) from scored_at 2026-08-01, NOT the tier 1 answer 2026-08-15"
            - "${att2_scaled} == 625 — round(100 * 6.25, 0)"
            - "${sj_counts2}.MATH == 1 and ${sj_remaining2}.MATH == 2 — only the scored attempt charged the budget, so the sum is still 3"

      - name: activating_a_rule_whose_target_course_is_retired_is_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.PlacementRule.DRAFT_to_ACTIVE, "validations[priority=9]", "errors[ERR_COURSE_RETIRED]"]
        distinguishing_aspect: |
          The transition's own from-state is satisfied and its measure bounds are
          complete, but a cross-entity precondition on the target Course blocks it.
          The rule is drafted AFTER the retire specifically so the retire cascade
          cannot have swept it — proving the check is evaluated at activation time
          rather than inherited from the cascade.
        test_recipe:
          setup:
            - "Logical clock left at its startup default 2026-08-01T00:00:00Z."
            - "Course MATH-100 is created and immediately retired; it has no Sections, so ERR_COURSE_HAS_LIVE_SECTIONS does not fire."
            - "Course MATH-050 stays ACTIVE as the control."
            - "Both rules are drafted AFTER the retire, so neither was touched by the retire's HOP 1 cascade."
          setup_api_calls:
            - call: "POST /courses"
              payload: { course_code: "MATH-100", title: "College Algebra", subject_area: "MATH", level_rank: 100, units: 4.0, is_support_course: false, transfer_level: true }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { c_100: $.data.id }
            - call: "POST /courses"
              payload: { course_code: "MATH-050", title: "Pre-Algebra", subject_area: "MATH", level_rank: 50, units: 5.0, is_support_course: false, transfer_level: false }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { c_050: $.data.id }
            - call: "POST /courses/${c_100}/retire"
              payload: {}
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { c_100_status: $.data.status }
            - call: "POST /placement-rules"
              payload: { subject_area: "MATH", measure_type: "TRANSCRIPT_GPA", target_course_id: "${c_100}", priority_rank: 10, min_hs_gpa: 3.0, effective_from: "2026-07-01T00:00:00Z", version_label: "V1" }
              as: AssessmentDirector
              as_user_id: "director-1"
              captures: { rule_dead: $.data.id, rule_dead_status: $.data.status }
            - call: "POST /placement-rules"
              payload: { subject_area: "MATH", measure_type: "TRANSCRIPT_GPA", target_course_id: "${c_050}", priority_rank: 20, min_hs_gpa: 2.0, max_hs_gpa: 3.0, effective_from: "2026-07-01T00:00:00Z", version_label: "V1" }
              as: AssessmentDirector
              as_user_id: "director-1"
              captures: { rule_live: $.data.id }
          trigger:
            - call: "POST /placement-rules/${rule_dead}/activate"
              payload: {}
              as: AssessmentDirector
              as_user_id: "director-1"
              captures: { err_retired: $.data.error_id }
            - call: "GET /placement-rules/${rule_dead}"
              payload: {}
              as: AssessmentDirector
              as_user_id: "director-1"
              captures: { rule_dead_after: $.data.status, rule_dead_activated: $.data.activated_at }
            - call: "POST /placement-rules/${rule_live}/activate"
              payload: {}
              as: AssessmentDirector
              as_user_id: "director-1"
              captures: { rule_live_status: $.data.status, rule_live_activated: $.data.activated_at }
          assert:
            - "${c_100_status} == \"RETIRED\" and ${rule_dead_status} == \"DRAFT\" (setup)"
            - "${err_retired} == \"ERR_COURSE_RETIRED\" with HTTP 409 — priority 9 cross-entity precondition"
            - "${rule_dead_after} == \"DRAFT\" and ${rule_dead_activated} == null — the refused activation is not partial"
            - "${rule_live_status} == \"ACTIVE\" and ${rule_live_activated} == \"2026-08-01T00:00:00Z\" — activated_at is stamped from the logical clock, not from wall time"

      - name: resubmitting_an_appeal_that_was_never_info_requested_is_rejected
        claim_type: Invalid Transitions
        grounds: [state_machines.PlacementAppeal, "validations[priority=8]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: |
          resubmit is declared only from INFO_REQUESTED. From the initial SUBMITTED
          state the transition does not exist, so the answer is the generic
          ERR_INVALID_STATE at priority 8 rather than any of the appeal-specific
          errors, and the revision_round counter must not move. The same trigger
          fired from INFO_REQUESTED is the control that proves the endpoint works.
        test_recipe:
          setup:
            - "Logical clock left at its startup default 2026-08-01T00:00:00Z."
            - "Courses MATH-050 and MATH-100, both ACTIVE; one ACTIVE PlacementRule TRANSCRIPT_GPA -> MATH-050 (min_hs_gpa 2.0, V1)."
            - "Student SK2 (hs_gpa 2.50 VERIFIED, transcript 2025-06-01T00:00:00Z) with a determination placing MATH-050."
            - "An appeal requesting MATH-100 is filed by the student and left in SUBMITTED."
          setup_api_calls:
            - call: "POST /courses"
              payload: { course_code: "MATH-050", title: "Pre-Algebra", subject_area: "MATH", level_rank: 50, units: 5.0, is_support_course: false, transfer_level: false }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { c_050: $.data.id }
            - call: "POST /courses"
              payload: { course_code: "MATH-100", title: "College Algebra", subject_area: "MATH", level_rank: 100, units: 4.0, is_support_course: false, transfer_level: true }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { c_100: $.data.id }
            - call: "POST /placement-rules"
              payload: { subject_area: "MATH", measure_type: "TRANSCRIPT_GPA", target_course_id: "${c_050}", priority_rank: 10, min_hs_gpa: 2.0, effective_from: "2026-07-01T00:00:00Z", version_label: "V1" }
              as: AssessmentDirector
