      - name: landlord_payment_period_overlap_and_gap_rejected
        resource_entity: GroundLease
        resource_dimension: "the paid-through timeline of one ground lease"
        interval_semantics: "inclusive-inclusive whole-calendar-month periods that must tile the timeline exactly: the next period must start on paid_through_date + 1 day, so neither re-covering a paid day nor skipping a month is admissible"
        expected_error: "ERR_PAYMENT_PERIOD_OVERLAP then ERR_PAYMENT_PERIOD_GAP"
        expected_status: "409 then 422"
        grounds:
          - validations.priority_26
          - validations.priority_27
          - calculations.landlord_payment_amount
          - entities.GroundLease.fields.paid_through_date
        distinguishing_aspect: |
          A third interval convention on a third resource: inclusive-inclusive month periods that
          must TILE a timeline with neither overlap nor gap. The same endpoint therefore has two
          distinct failure directions around the identical anchor date 2026-10-31 — starting on or
          before it re-covers paid ground (409) and starting after 2026-11-01 leaves a hole (422) —
          while the only admissible start is exactly 2026-11-01.
        test_recipe:
          setup:
            - "Tower T12 with an ACTIVE ground lease under a landlord holding a W-9: base rent 400000 cents, 2.5% simple escalator, commencement 2020-06-01, so the rent evaluated anywhere in 2026 is 460000 cents per month."
            - "One payment already covers 2026-08-01..2026-10-31 (3 months, 1380000 cents), leaving paid_through_date at 2026-10-31."
          setup_api_calls:
            - call: "POST /tower-colo/towers"
              payload: { site_name: "T12 Wash", structure_type: "MONOPOLE", rated_capacity_load_units: 6000, min_colocation_elevation_ft: 50, max_elevation_ft: 250, ground_space_total_sqft: 12000 }
              as: PortfolioAdmin
              captures: { t12_id: $.data.id }
            - call: "POST /tower-colo/landlords"
              payload: { legal_name: "Wash Basin Holdings", remit_contact_email: "ap@wash.example", w9_on_file: true }
              as: PortfolioAdmin
              captures: { ll12_id: $.data.id }
            - call: "POST /tower-colo/ground-leases"
              payload: { tower_id: "${t12_id}", landlord_id: "${ll12_id}", base_monthly_rent_cents: 400000, escalator_pct: 2.5, commencement_date: "2020-06-01", term_end_date: "2031-05-31", renewal_option_count: 2, renewal_term_years: 5, buyout_price_cents: 12000000 }
              as: PortfolioAdmin
              captures: { gl12_id: $.data.id }
            - call: "POST /tower-colo/landlord-payments"
              payload: { ground_lease_id: "${gl12_id}", period_start_date: "2026-08-01", period_end_date: "2026-10-31" }
              as: PortfolioAdmin
          trigger:
            - call: "POST /tower-colo/landlord-payments"
              payload: { ground_lease_id: "${gl12_id}", period_start_date: "2026-10-01", period_end_date: "2026-12-31" }
              as: PortfolioAdmin
            - call: "POST /tower-colo/landlord-payments"
              payload: { ground_lease_id: "${gl12_id}", period_start_date: "2026-12-01", period_end_date: "2027-01-31" }
              as: PortfolioAdmin
          assert:
            - "trigger call 1 returns status 409 with error_id ERR_PAYMENT_PERIOD_OVERLAP"
            - "trigger call 2 returns status 422 with error_id ERR_PAYMENT_PERIOD_GAP"
            - "GroundLease.${gl12_id}.paid_through_date == 2026-10-31"
            - "GroundLease.${gl12_id}.current_monthly_rent_cents == 460000"
            - "GET /tower-colo/ground-leases/${gl12_id}/landlord-payments returns total_count == 1 with $.data[0].months_covered == 3 and $.data[0].amount_cents == 1380000"

  - rule_id: compensating_invariant
    instances:
