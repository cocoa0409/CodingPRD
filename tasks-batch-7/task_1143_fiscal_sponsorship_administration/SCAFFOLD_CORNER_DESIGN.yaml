            - { call: "POST /fsa/projects/${p}/exit-plans", payload: { successor_entity_name: "X", successor_ein: "11-1111111", reason: "r" }, as: ProjectLead, as_user_id: "${p}", captures: { ep: $.data.id } }
            - { call: "POST /fsa/exit-plans/${ep}/signoff", payload: { party: "SPONSOR_BOARD" }, as: SponsorAdmin, as_user_id: user_sa_1, captures: { e_exit: $.data.error_id } }
            - { call: "POST /fsa/projects/${p}/donations", payload: { amount_cents: 100000, donor_name: "D", donor_email: "d@x.org", payment_method: "CARD" }, as: Donor, as_user_id: user_donor_1, captures: { d: $.data.id } }
            - { call: "POST /fsa/donations/${d}/receive", payload: {}, as: FinanceOfficer, as_user_id: user_fo_1 }
            - { call: "POST /fsa/projects/${p}/disbursement-requests", payload: { amount_cents: 5000, purpose: "x", payee_type: "VENDOR", payee_name: "V", spend_date: "2026-06-01" }, as: ProjectLead, as_user_id: "${p}", captures: { dr: $.data.id } }
            - { call: "POST /fsa/disbursement-requests/${dr}/submit", payload: {}, as: ProjectLead, as_user_id: "${p}" }
            - { call: "POST /fsa/disbursement-requests/${dr}/sponsor-approve", payload: { decision: "APPROVE" }, as: SponsorAdmin, as_user_id: user_sa_1, captures: { e_disb: $.data.error_id } }
          assert:
            - "e_fund == ERR_FUND_NOT_ACTIVE (adjustment on PENDING fund)"
            - "e_proj == ERR_PROJECT_NOT_ACTIVE (terminate on PROPOSED project)"
            - "e_agr == ERR_AGREEMENT_NOT_ACTIVE (second countersign on ACTIVE agreement)"
            - "e_rev == ERR_REVIEW_STATE_INVALID (issue-findings on CLOSED review)"
            - "e_exit == ERR_EXIT_STATE_INVALID (signoff on PROPOSED exit plan, before due diligence)"
            - "e_disb == ERR_DISBURSEMENT_STATE_INVALID (sponsor-approve on SUBMITTED, not PENDING_SPONSOR)"

