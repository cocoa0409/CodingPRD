  # ===========================================================================
  - section: rbac
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: Violation → Error
        grounds:
          - "validations[priority=10]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "A request with no X-User-Role / X-User-ID headers returns 401 ERR_UNAUTHENTICATED before any existence or state check runs."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: NONE
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 401 and ${err_id} == ERR_UNAUTHENTICATED"
            - "no Building row is created"

      - name: facility_manager_cannot_accept_dispatch_forbidden_role
        claim_type: peer_roles
        grounds:
          - "validations[priority=20]"
          - "errors[ERR_FORBIDDEN_ROLE]"
          - roles.VendorTech
        distinguishing_aspect: "accept is VendorTech-exclusive: a FacilityManager calling it gets 403 ERR_FORBIDDEN_ROLE, and the dispatch stays OFFERED."
        test_recipe:
          setup: ["One OFFERED dispatch."]
          setup_api_calls:
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b1: $.data.id }
            - call: "POST /fm/vendors"
              payload: { name: "CoolAir", trade: "HVAC", hourly_rate: 100.00, sla_response_minutes: 60, sla_resolve_minutes: 240 }
              as: FacilityManager
              captures: { v1: $.data.id }
            - call: "POST /fm/work-orders"
              payload: { building_id: "${b1}", wo_type: "CORRECTIVE", priority: "P3", estimated_labor_hours: 1, estimated_parts_cost: 0 }
              as: FacilityManager
              captures: { wo1: $.data.id, wo1_v: $.data.version }
            - call: "POST /fm/work-orders/${wo1}/dispatches"
              payload: { vendor_id: "${v1}", expected_work_order_version: "${wo1_v}" }
              as: FacilityManager
              captures: { d1: $.data.id }
          trigger:
            - call: "POST /fm/dispatches/${d1}/accept"
              payload: {}
              as: FacilityManager
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 403 and ${err_id} == ERR_FORBIDDEN_ROLE"
            - "Dispatch.${d1}.status == OFFERED and WorkOrder.${wo1}.status == DISPATCHED"

      - name: vendor_tech_cannot_complete_another_vendors_shift
        claim_type: Segregation of duties
        grounds:
          - "validations[priority=40]"
          - "errors[ERR_NOT_RESOURCE_OWNER]"
          - roles.VendorTech
        distinguishing_aspect: "VendorTech identity is entity_backed:Vendor — completing a shift whose vendor_id != X-User-ID returns 403 ERR_NOT_RESOURCE_OWNER while the rightful vendor succeeds."
        test_recipe:
          setup: ["Two janitorial vendors; one SCHEDULED shift belonging to the first."]
          setup_api_calls:
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
