            - "StressScenario.${sc_sev_id}.static_min_leverage_ratio_bps == 1246"
            - "StressScenario.${sc_sev_id}.static_breach_year_index == 0"
            - "StressScenario.${sc_sev_id}.dynamic_min_leverage_ratio_bps == 636"
            - "StressScenario.${sc_sev_id}.dynamic_breach_year_index == 3"
            - "StressScenario.${sc_sev_id}.governing_variant == DYNAMIC_GROWTH"
            - "StressScenario.${sc_sev_id}.governing_min_leverage_ratio_bps == 636"
            - "StressScenario.${sc_sev_id}.governing_breach_year_index == 3"
            - "BusinessPlan.${p_id}.stress_scenario_count == 1"
            - "BusinessPlan.${p_id}.breach_scenario_count == 1"
            - "BusinessPlan.${p_id}.worst_governing_min_leverage_ratio_bps == 636"
            - "the two variant minima differ by exactly 610 bps on identical inputs"
      - name: escrow_subscription_basis_vs_cleared_basis_divergence
        grounds:
          - calculations.escrow_position
          - entities.CapitalRaise.fields.pledged_gross_cents
