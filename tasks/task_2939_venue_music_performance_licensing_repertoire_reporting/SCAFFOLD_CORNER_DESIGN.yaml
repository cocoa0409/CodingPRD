        distinguishing_aspect: "The floor is applied to the pre-apportionment amount and only then is the society share taken, so a 29520-cent scaled fee is lifted to the 30000 floor and the SESAC 500 bp share yields 1500 cents, which is far below the floor and is nonetheless correct."
