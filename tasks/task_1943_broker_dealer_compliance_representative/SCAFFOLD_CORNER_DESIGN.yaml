# =============================================================================
# Task 1943 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Enumerative coverage of §1.1–§1.7 claims not already probed by §1.8.
# claim_type values per references/claim-extraction-guide.md.
# All chains replay-verified against SCAFFOLD.yaml §1.2/§1.4/§1.5/§1.6.
# Names are unique across the union of this file and SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# =============================================================================

scaffold_corner_design:
  # ------------------------------------------------------------------
  - section: entities
    instances:
      - name: inspection_create_defaults_and_computed
        claim_type: creation
        grounds: [entities.BranchInspection, entities.BranchOffice.fields.next_inspection_due_date]
        distinguishing_aspect: "Create returns 201 with system/computed fields initialized: status SCHEDULED, counts 0, version 1, started_at/completed_date null; the OCC side effect bumps the branch to version 2."
        test_recipe:
          setup: ["Empty DB; one branch at default clock 2026-08-01"]
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "Init Branch", region: "E" }
              as: FirmAdmin
              captures: { in_br: $.data.id, in_br_v: $.data.version }
          trigger:
            - call: "POST /inspections"
              payload: { branch_id: "${in_br}", scheduled_date: "2026-08-10", expected_branch_version: "${in_br_v}" }
              as: ComplianceAnalyst
              captures: { in_i: $.data.id }
            - call: "GET /branches/${in_br}"
              as: Any
              captures: { in_br_v2: $.data.version, in_due: $.data.next_inspection_due_date }
          assert:
            - "BranchInspection.${in_i}.status == \"SCHEDULED\" and version == 1"
            - "BranchInspection.${in_i}.open_findings_count == 0 and high_severity_open_count == 0"
            - "BranchInspection.${in_i}.started_at == null and completed_date == null"
            - "in_br_v2 == ${in_br_v} + 1 (OCC write side effect)"
            - "in_due == \"2027-08-01\" (no CLOSED inspection -> base = branch creation date 2026-08-01 + 12 months)"

      - name: get_nonexistent_branch_returns_not_found
        claim_type: not_found
        grounds: ["validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but absent UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /branches/00000000-0000-4000-8000-000000000000"
              as: Any
              captures: { nf_err: $.data.error_id }
          assert:
            - "nf_err == \"ERR_NOT_FOUND\""

  # ------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: zero_finding_close_allowed
        claim_type: valid_transition
        grounds: [state_machines.BranchInspection.IN_PROGRESS_to_CLOSED]
        distinguishing_aspect: "Empty-set edge: an IN_PROGRESS inspection with zero findings closes directly to CLOSED (no AWAITING_REMEDIATION)."
        test_recipe:
          setup: ["Branch with IN_PROGRESS inspection, no findings"]
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "Z Branch", region: "W" }
              as: FirmAdmin
              captures: { z_br: $.data.id, z_br_v: $.data.version }
            - call: "POST /inspections"
              payload: { branch_id: "${z_br}", scheduled_date: "2026-08-10", expected_branch_version: "${z_br_v}" }
              as: ComplianceAnalyst
              captures: { z_i: $.data.id }
            - call: "POST /inspections/${z_i}/start"
              as: ComplianceAnalyst
            - call: "GET /branches/${z_br}"
              as: Any
              captures: { z_br_v2: $.data.version }
          trigger:
            - call: "POST /inspections/${z_i}/close"
              payload: { expected_branch_version: "${z_br_v2}" }
              as: CompliancePrincipal
              as_user_id: "principal-a"
              captures: { z_status: $.data.status }
          assert:
            - "z_status == \"CLOSED\""
            - "BranchInspection.${z_i}.completed_date == \"2026-08-01\" (default clock date)"

      - name: guard_close_with_open_findings
        claim_type: precondition_enforcement
        grounds: [state_machines.BranchInspection.IN_PROGRESS_to_AWAITING_REMEDIATION, state_machines.BranchInspection.AWAITING_REMEDIATION_to_CLOSED, "errors[ERR_FINDINGS_STILL_OPEN]"]
        distinguishing_aspect: "Conditional close forks on aggregate child state: with open findings, close from IN_PROGRESS lands in AWAITING_REMEDIATION; a second close is blocked by ERR_FINDINGS_STILL_OPEN until findings verify."
        test_recipe:
          setup: ["Branch with IN_PROGRESS inspection and one OPEN finding"]
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "G Branch", region: "S" }
              as: FirmAdmin
              captures: { g_br: $.data.id, g_br_v: $.data.version }
            - call: "POST /inspections"
              payload: { branch_id: "${g_br}", scheduled_date: "2026-08-10", expected_branch_version: "${g_br_v}" }
              as: ComplianceAnalyst
              captures: { g_i: $.data.id }
            - call: "POST /inspections/${g_i}/start"
              as: ComplianceAnalyst
            - call: "POST /findings"
              payload: { inspection_id: "${g_i}", severity: "MEDIUM", description: "gap", due_date: "2026-09-01" }
              as: ComplianceAnalyst
              captures: { g_f: $.data.id }
            - call: "GET /branches/${g_br}"
              as: Any
              captures: { g_br_v2: $.data.version }
          trigger:
            - call: "POST /inspections/${g_i}/close"
              payload: { expected_branch_version: "${g_br_v2}" }
              as: CompliancePrincipal
              as_user_id: "principal-a"
              captures: { g_mid: $.data.status }
            - call: "POST /inspections/${g_i}/close"
              payload: { expected_branch_version: "${g_br_v2}" }
              as: CompliancePrincipal
              as_user_id: "principal-a"
              captures: { g_err: $.data.error_id }
          assert:
            - "g_mid == \"AWAITING_REMEDIATION\" (first close forks on open findings; no branch mutation, so the same expected version still matches)"
            - "g_err == \"ERR_FINDINGS_STILL_OPEN\""

      - name: terminal_lockdown_closed_inspection
        claim_type: terminal_state_lockdown
        grounds: [state_machines.BranchInspection, "errors[ERR_INSPECTION_INVALID_STATE]"]
        distinguishing_aspect: "From terminal CLOSED no transition fires: a repeat close with the CURRENT branch version (OCC passes) is rejected by the state check."
        test_recipe:
          setup: ["Branch with a CLOSED inspection"]
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "T Branch", region: "N" }
              as: FirmAdmin
              captures: { t_br: $.data.id, t_br_v: $.data.version }
            - call: "POST /inspections"
              payload: { branch_id: "${t_br}", scheduled_date: "2026-08-10", expected_branch_version: "${t_br_v}" }
              as: ComplianceAnalyst
              captures: { t_i: $.data.id }
            - call: "POST /inspections/${t_i}/start"
              as: ComplianceAnalyst
            - call: "GET /branches/${t_br}"
              as: Any
              captures: { t_br_v2: $.data.version }
            - call: "POST /inspections/${t_i}/close"
              payload: { expected_branch_version: "${t_br_v2}" }
              as: CompliancePrincipal
              as_user_id: "principal-a"
            - call: "GET /branches/${t_br}"
              as: Any
              captures: { t_br_v3: $.data.version }
          trigger:
            - call: "POST /inspections/${t_i}/close"
              payload: { expected_branch_version: "${t_br_v3}" }
              as: CompliancePrincipal
              as_user_id: "principal-a"
              captures: { t_err: $.data.error_id }
          assert:
            - "t_err == \"ERR_INSPECTION_INVALID_STATE\" (CLOSED is terminal; OCC passed first, proving the rejection is the state lockdown)"

      - name: inspection_start_then_add_finding
        claim_type: valid_transition
        grounds: [state_machines.BranchInspection.SCHEDULED_to_IN_PROGRESS, "errors[ERR_INSPECTION_INVALID_STATE]"]
        distinguishing_aspect: "Finding creation is guarded by the inspection being IN_PROGRESS: create against SCHEDULED fails with ERR_INSPECTION_INVALID_STATE; after start it succeeds."
        test_recipe:
          setup: ["Branch with a SCHEDULED inspection"]
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "S Branch", region: "E" }
              as: FirmAdmin
              captures: { s_br: $.data.id, s_br_v: $.data.version }
            - call: "POST /inspections"
              payload: { branch_id: "${s_br}", scheduled_date: "2026-08-10", expected_branch_version: "${s_br_v}" }
              as: ComplianceAnalyst
              captures: { s_i: $.data.id }
          trigger:
            - call: "POST /findings"
              payload: { inspection_id: "${s_i}", severity: "LOW", description: "early", due_date: "2026-09-01" }
              as: ComplianceAnalyst
              captures: { s_err: $.data.error_id }
            - call: "POST /inspections/${s_i}/start"
              as: ComplianceAnalyst
            - call: "POST /findings"
              payload: { inspection_id: "${s_i}", severity: "LOW", description: "on time", due_date: "2026-09-01" }
              as: ComplianceAnalyst
              captures: { s_f: $.data.id }
          assert:
            - "s_err == \"ERR_INSPECTION_INVALID_STATE\""
            - "InspectionFinding.${s_f}.status == \"OPEN\" and Inspection.${s_i}.open_findings_count == 1"

      - name: adjudicate_open_finding_rejected
        claim_type: invalid_transition
        grounds: [state_machines.InspectionFinding, "errors[ERR_FINDING_INVALID_STATE]"]
        distinguishing_aspect: "adjudicate requires REMEDIATION_SUBMITTED; VERIFY from OPEN is rejected."
        test_recipe:
          setup: ["IN_PROGRESS inspection with one OPEN finding"]
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "A Branch", region: "W" }
              as: FirmAdmin
              captures: { a_br: $.data.id, a_br_v: $.data.version }
            - call: "POST /inspections"
              payload: { branch_id: "${a_br}", scheduled_date: "2026-08-10", expected_branch_version: "${a_br_v}" }
              as: ComplianceAnalyst
              captures: { a_i: $.data.id }
            - call: "POST /inspections/${a_i}/start"
              as: ComplianceAnalyst
            - call: "POST /findings"
              payload: { inspection_id: "${a_i}", severity: "LOW", description: "x", due_date: "2026-09-01" }
              as: ComplianceAnalyst
              captures: { a_f: $.data.id }
          trigger:
            - call: "POST /findings/${a_f}/adjudicate"
              payload: { decision: "VERIFY" }
              as: CompliancePrincipal
              as_user_id: "principal-a"
              captures: { a_err: $.data.error_id }
          assert:
            - "a_err == \"ERR_FINDING_INVALID_STATE\" and the finding remains OPEN"

      - name: remediate_overdue_finding_allowed
        claim_type: valid_transition
        grounds: [state_machines.InspectionFinding.OPEN_to_OVERDUE, state_machines.InspectionFinding.OVERDUE_to_REMEDIATION_SUBMITTED]
        distinguishing_aspect: "The clock sweep moves OPEN -> OVERDUE when due_date passes; remediate remains valid from OVERDUE (late remediation is permitted)."
        test_recipe:
          setup: ["IN_PROGRESS inspection; finding due 2026-08-05; clock advanced to 2026-08-06"]
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "OD Branch", region: "S" }
              as: FirmAdmin
              captures: { od_br: $.data.id, od_br_v: $.data.version }
            - call: "POST /inspections"
              payload: { branch_id: "${od_br}", scheduled_date: "2026-08-02", expected_branch_version: "${od_br_v}" }
              as: ComplianceAnalyst
              captures: { od_i: $.data.id }
            - call: "POST /inspections/${od_i}/start"
              as: ComplianceAnalyst
            - call: "POST /findings"
              payload: { inspection_id: "${od_i}", severity: "MEDIUM", description: "late one", due_date: "2026-08-05" }
              as: ComplianceAnalyst
              captures: { od_f: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T00:00:01Z" }
              as: FirmAdmin
            - call: "GET /findings/${od_f}"
              as: Any
              captures: { od_status: $.data.status }
          trigger:
            - call: "POST /findings/${od_f}/remediate"
              payload: { remediation_note: "late fix" }
              as: ComplianceAnalyst
              captures: { od_after: $.data.status }
          assert:
            - "od_status == \"OVERDUE\" (sweep: 2026-08-05 < 2026-08-06)"
            - "od_after == \"REMEDIATION_SUBMITTED\""

      - name: sod_escalation_resolver
        claim_type: precondition_enforcement
        grounds: [state_machines.CorrespondenceItem.ESCALATED_to_APPROVED, "errors[ERR_SOD_ESCALATION_RESOLVER]"]
        distinguishing_aspect: "Segregation of duties inside one role: the principal whose opaque id equals escalated_by cannot resolve; a different principal can."
        test_recipe:
          setup: ["Correspondence item ESCALATED by principal-a"]
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "SD Branch", region: "N" }
              as: FirmAdmin
              captures: { sd_br: $.data.id }
            - call: "POST /representatives"
              payload: { crd_number: "910001", full_name: "SD Rep", branch_id: "${sd_br}", hire_date: "2021-01-01" }
              as: FirmAdmin
              captures: { sd_rep: $.data.id }
            - call: "POST /correspondence-items"
              payload: { rep_id: "${sd_rep}", channel: "EMAIL", subject: "q", lexicon_hits: 0 }
              as: ComplianceAnalyst
              captures: { sd_ci: $.data.id }
            - call: "POST /correspondence-items/${sd_ci}/review"
              payload: { decision: "ESCALATE" }
              as: CompliancePrincipal
              as_user_id: "principal-a"
          trigger:
            - call: "POST /correspondence-items/${sd_ci}/resolve-escalation"
              payload: { decision: "APPROVE" }
              as: CompliancePrincipal
              as_user_id: "principal-a"
              captures: { sd_err: $.data.error_id }
            - call: "POST /correspondence-items/${sd_ci}/resolve-escalation"
              payload: { decision: "APPROVE" }
              as: CompliancePrincipal
              as_user_id: "principal-b"
              captures: { sd_ok: $.data.status }
          assert:
            - "sd_err == \"ERR_SOD_ESCALATION_RESOLVER\""
            - "sd_ok == \"APPROVED\" and CorrespondenceItem.${sd_ci}.resolved_by == \"principal-b\""

      - name: review_approved_correspondence_rejected
        claim_type: invalid_transition
        grounds: [state_machines.CorrespondenceItem, "errors[ERR_CORRESPONDENCE_INVALID_STATE]"]
        distinguishing_aspect: "Terminal APPROVED items reject further review decisions."
        test_recipe:
          setup: ["Item reviewed to APPROVED"]
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "RC Branch", region: "E" }
              as: FirmAdmin
              captures: { rc_br: $.data.id }
            - call: "POST /representatives"
              payload: { crd_number: "910002", full_name: "RC Rep", branch_id: "${rc_br}", hire_date: "2021-01-01" }
              as: FirmAdmin
              captures: { rc_rep: $.data.id }
            - call: "POST /correspondence-items"
              payload: { rep_id: "${rc_rep}", channel: "EMAIL", subject: "ok", lexicon_hits: 0 }
              as: ComplianceAnalyst
              captures: { rc_ci: $.data.id }
            - call: "POST /correspondence-items/${rc_ci}/review"
              payload: { decision: "APPROVE" }
              as: CompliancePrincipal
              as_user_id: "principal-a"
          trigger:
            - call: "POST /correspondence-items/${rc_ci}/review"
              payload: { decision: "FLAG" }
              as: CompliancePrincipal
              as_user_id: "principal-a"
              captures: { rc_err: $.data.error_id }
          assert:
            - "rc_err == \"ERR_CORRESPONDENCE_INVALID_STATE\" and final_risk_score unchanged (0*10 + 5 = 5)"

      - name: decide_on_approved_activity_rejected
        claim_type: invalid_transition
        grounds: [state_machines.OutsideActivityRequest, "errors[ERR_ACTIVITY_NOT_PENDING_DECISION]"]
        distinguishing_aspect: "decide on a terminal APPROVED request is rejected; the machine requires SUBMITTED."
        test_recipe:
          setup: ["OBA approved"]
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "DA Branch", region: "W" }
              as: FirmAdmin
              captures: { da_br: $.data.id }
            - call: "POST /representatives"
              payload: { crd_number: "910003", full_name: "DA Rep", branch_id: "${da_br}", hire_date: "2021-01-01" }
              as: FirmAdmin
              captures: { da_rep: $.data.id }
            - call: "POST /outside-activities"
              payload: { activity_type: "OUTSIDE_BUSINESS_ACTIVITY", description: "x", compensation_expected: false, start_date: "2026-09-01" }
              as: RegisteredRep
              as_user_id: "${da_rep}"
              captures: { da_oba: $.data.id }
            - call: "POST /outside-activities/${da_oba}/decide"
              payload: { decision: "APPROVE" }
              as: CompliancePrincipal
              as_user_id: "principal-a"
          trigger:
            - call: "POST /outside-activities/${da_oba}/decide"
              payload: { decision: "REJECT" }
              as: CompliancePrincipal
              as_user_id: "principal-a"
              captures: { da_err: $.data.error_id }
          assert:
            - "da_err == \"ERR_ACTIVITY_NOT_PENDING_DECISION\" and status remains APPROVED"

      - name: oba_create_for_terminated_rep_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.OutsideActivityRequest, "errors[ERR_REP_NOT_ACTIVE]"]
        distinguishing_aspect: "Entity-backed ownership + rep state: a TERMINATED rep cannot submit new requests."
        test_recipe:
          setup: ["Rep terminated"]
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "TM Branch", region: "S" }
              as: FirmAdmin
              captures: { tm_br: $.data.id }
            - call: "POST /representatives"
              payload: { crd_number: "910004", full_name: "TM Rep", branch_id: "${tm_br}", hire_date: "2021-01-01" }
              as: FirmAdmin
              captures: { tm_rep: $.data.id }
            - call: "POST /representatives/${tm_rep}/terminate"
              as: CompliancePrincipal
              as_user_id: "principal-a"
          trigger:
            - call: "POST /outside-activities"
              payload: { activity_type: "OUTSIDE_BUSINESS_ACTIVITY", description: "late", compensation_expected: false, start_date: "2026-09-01" }
              as: RegisteredRep
              as_user_id: "${tm_rep}"
              captures: { tm_err: $.data.error_id }
          assert:
            - "tm_err == \"ERR_REP_NOT_ACTIVE\""

      - name: attest_before_meeting_held_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Attestation.PENDING_to_ATTESTED, "errors[ERR_MEETING_NOT_HELD]"]
        distinguishing_aspect: "Cross-entity precondition: attestation requires the parent meeting HELD; attesting while SCHEDULED fails (deadline is still in the future, so the temporal check passes and the constraint check fires)."
        test_recipe:
          setup: ["Meeting 2026-12-20 SCHEDULED at default clock 2026-08-01; attestation fanned out"]
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "MH Branch", region: "N" }
              as: FirmAdmin
              captures: { mh_br: $.data.id }
            - call: "POST /representatives"
              payload: { crd_number: "910005", full_name: "MH Rep", branch_id: "${mh_br}", hire_date: "2021-01-01" }
              as: FirmAdmin
              captures: { mh_rep: $.data.id }
            - call: "POST /meetings"
              payload: { year: 2026, meeting_date: "2026-12-20" }
              as: CompliancePrincipal
              as_user_id: "principal-a"
              captures: { mh_mt: $.data.id }
            - call: "GET /attestations?meeting_id=${mh_mt}"
              as: Any
              captures: { mh_att: "$.data[0].id" }
          trigger:
            - call: "POST /attestations/${mh_att}/attest"
              as: RegisteredRep
              as_user_id: "${mh_rep}"
              captures: { mh_err: $.data.error_id }
          assert:
            - "mh_err == \"ERR_MEETING_NOT_HELD\""

      - name: double_attest_rejected
        claim_type: idempotency
        grounds: [state_machines.Attestation, "errors[ERR_ATTESTATION_NOT_PENDING]"]
        distinguishing_aspect: "The same trigger twice: second attest is rejected (no double-recording)."
        test_recipe:
          setup: ["Meeting HELD; one attestation ATTESTED"]
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "DT Branch", region: "E" }
              as: FirmAdmin
              captures: { dt_br: $.data.id }
            - call: "POST /representatives"
              payload: { crd_number: "910006", full_name: "DT Rep", branch_id: "${dt_br}", hire_date: "2021-01-01" }
              as: FirmAdmin
              captures: { dt_rep: $.data.id }
            - call: "POST /meetings"
              payload: { year: 2026, meeting_date: "2026-08-01" }
              as: CompliancePrincipal
              as_user_id: "principal-a"
              captures: { dt_mt: $.data.id }
            - call: "POST /meetings/${dt_mt}/hold"
              as: CompliancePrincipal
              as_user_id: "principal-a"
            - call: "GET /attestations?meeting_id=${dt_mt}"
              as: Any
              captures: { dt_att: "$.data[0].id" }
            - call: "POST /attestations/${dt_att}/attest"
              as: RegisteredRep
              as_user_id: "${dt_rep}"
          trigger:
            - call: "POST /attestations/${dt_att}/attest"
              as: RegisteredRep
              as_user_id: "${dt_rep}"
              captures: { dt_err: $.data.error_id }
          assert:
            - "dt_err == \"ERR_ATTESTATION_NOT_PENDING\""

      - name: attest_after_deadline_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Attestation.PENDING_to_ATTESTED, "errors[ERR_ATTESTATION_DEADLINE_PASSED]", "validations[priority=6]"]
        distinguishing_aspect: "Deadline-missed attestation that was never swept (no clock-set after creation): meeting dated 2026-06-30 while the default clock is 2026-08-01, so the PENDING attestation's deadline 2026-07-30 is already past and the temporal check — not the state check — fires."
        test_recipe:
          setup: ["Meeting dated in the past relative to the default clock; attestation still PENDING (no sweep ran)"]
          setup_api_calls:
            - call: "POST /branches"
              payload: { name: "DL Branch", region: "W" }
              as: FirmAdmin
              captures: { dl_br: $.data.id }
            - call: "POST /representatives"
              payload: { crd_number: "910007", full_name: "DL Rep", branch_id: "${dl_br}", hire_date: "2021-01-01" }
              as: FirmAdmin
              captures: { dl_rep: $.data.id }
            - call: "POST /meetings"
              payload: { year: 2026, meeting_date: "2026-06-30" }
              as: CompliancePrincipal
              as_user_id: "principal-a"
              captures: { dl_mt: $.data.id }
            - call: "GET /attestations?meeting_id=${dl_mt}"
              as: Any
              captures: { dl_att: "$.data[0].id" }
          trigger:
            - call: "POST /attestations/${dl_att}/attest"
              as: RegisteredRep
              as_user_id: "${dl_rep}"
              captures: { dl_err: $.data.error_id }
          assert:
            - "dl_err == \"ERR_ATTESTATION_DEADLINE_PASSED\" (2026-08-01 > deadline 2026-07-30; attestation still PENDING because no clock-set sweep occurred)"

      - name: plan_activate_requires_sd_rep
        claim_type: precondition_enforcement
        grounds: [state_machines.HeightenedSupervisionPlan.DRAFT_to_ACTIVE, "errors[ERR_REP_NOT_STATUTORILY_DISQUALIFIED]"]
