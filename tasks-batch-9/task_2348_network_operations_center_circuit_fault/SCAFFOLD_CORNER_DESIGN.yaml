# =============================================================================
# 1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# task_2348 Network Operations Center & Circuit Fault Management
# Sections and claim_types are taken from references/claim-extraction-guide.md.
# excluded_because stubs cite §1.8 instances by name in SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: corner_carrier_create_applies_every_sla_default
        claim_type: defaults
        grounds:
          - entities.Carrier
          - endpoints["POST /carriers"]
        distinguishing_aspect: "A minimal carrier body must materialise all eight optional commercial terms at their declared defaults and all four computed ledger fields at zero/ACTIVE, with version 1."
        test_recipe:
          setup:
            - "Empty database; the logical clock is pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /carriers"
              payload: { name: "Plainfield Telecom", carrier_code: "PFT" }
              as: PlatformAdmin
              captures: { pft_id: $.data.id }
          assert:
            - "status 201 and response_type object"
            - "Carrier.${pft_id}.escalation_tier_count == 3"
            - "Carrier.${pft_id}.sla_restore_minutes_critical == 240 and sla_restore_minutes_standard == 480"
            - "Carrier.${pft_id}.credit_pct_per_breach_hour == 5.0 and credit_pct_cap == 50.0"
            - "Carrier.${pft_id}.min_claim_amount_cents == 5000 and tier_escalation_min_minutes == 60"
            - "Carrier.${pft_id}.watchlist_exposure_threshold_cents == 100000"
            - "Carrier.${pft_id}.open_credit_exposure_cents == 0, committed_upgrade_mbps == 0, chronic_circuit_count == 0, watchlist_state == ACTIVE"
            - "Carrier.${pft_id}.version == 1 and created_at == 2026-08-01T00:00:00.000Z"

      - name: corner_circuit_create_defaults_unmonitored_and_normal
        claim_type: defaults
        grounds:
          - entities.Circuit
          - endpoints["POST /circuits"]
        distinguishing_aspect: "A circuit created without monitoring_state must land UNMONITORED (not MONITORED), operationally UP, and NORMAL on both the chronic and capacity dimensions with spof_flag false."
        test_recipe:
          setup:
            - "Carrier PFT exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { name: "Plainfield Telecom", carrier_code: "PFT" }
              as: PlatformAdmin
              captures: { pft_id: $.data.id }
          trigger:
            - call: "POST /circuits"
              payload: { carrier_id: "${pft_id}", carrier_circuit_identifier: "PFT-CKT-9001", site_a_code: "CHI01", site_z_code: "MSP01", bandwidth_mbps: 500, mrc_cents: 275000 }
              as: PlatformAdmin
              captures: { cz_id: $.data.id }
          assert:
            - "status 201"
            - "Circuit.${cz_id}.monitoring_state == UNMONITORED"
            - "Circuit.${cz_id}.operational_state == UP"
            - "Circuit.${cz_id}.chronic_state == NORMAL and capacity_state == NORMAL"
            - "Circuit.${cz_id}.consecutive_high_readings == 0 and fault_count_period == 0"
            - "Circuit.${cz_id}.spof_flag == false and last_incident_at == null"
            - "Circuit.${cz_id}.version == 1"

      - name: corner_circuit_create_missing_mrc_cents_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=20]
          - errors.ERR_INVALID_REQUEST
          - endpoints["POST /circuits"]
        distinguishing_aspect: "mrc_cents has source input with no default, so omitting it must fail the priority-20 shape check rather than defaulting to zero."
        test_recipe:
          setup:
            - "Carrier PFT exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { name: "Plainfield Telecom", carrier_code: "PFT" }
              as: PlatformAdmin
              captures: { pft_id: $.data.id }
          trigger:
            - call: "POST /circuits"
              payload: { carrier_id: "${pft_id}", carrier_circuit_identifier: "PFT-CKT-9002", site_a_code: "CHI01", site_z_code: "MSP01", bandwidth_mbps: 500 }
              as: PlatformAdmin
          assert:
            - "status 422 with data.error_id == ERR_INVALID_REQUEST"
            - "no Circuit row was created: GET /carriers/${pft_id}/circuits returns total_count 0"

      - name: corner_alarm_create_unknown_severity_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.Alarm.fields.raw_severity
          - validations[priority=20]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "raw_severity is a closed enum of four members; an out-of-enum value must be refused at priority 20 before any correlation or cascade work happens."
        test_recipe:
          setup:
            - "Carrier PFT with one MONITORED circuit PFT-CKT-9001."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { name: "Plainfield Telecom", carrier_code: "PFT" }
              as: PlatformAdmin
              captures: { pft_id: $.data.id }
            - call: "POST /circuits"
              payload: { carrier_id: "${pft_id}", carrier_circuit_identifier: "PFT-CKT-9001", site_a_code: "CHI01", site_z_code: "MSP01", bandwidth_mbps: 500, mrc_cents: 275000, monitoring_state: "MONITORED" }
              as: PlatformAdmin
              captures: { cz_id: $.data.id }
          trigger:
            - call: "POST /alarms"
              payload: { alarm_type: "LOSS_OF_SIGNAL", raw_severity: "CATASTROPHIC", raised_at: "2026-08-01T00:00:00Z", source_circuit_id: "${cz_id}" }
              as: NocAnalyst
          assert:
            - "status 422 with data.error_id == ERR_INVALID_REQUEST"
            - "Circuit.${cz_id}.operational_state == UP (no cascade ran)"
            - "GET /alarms filtered on the circuit returns total_count 0 and GET /incidents returns total_count 0"

      - name: corner_get_circuit_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=10]
          - errors.ERR_CIRCUIT_NOT_FOUND
          - endpoints["GET /circuits/{id}"]
        distinguishing_aspect: "A well-formed but unknown path id must produce the entity-specific 404 error_id, not a generic failure."
        test_recipe:
          setup:
            - "Empty database apart from the clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /circuits/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: NocAnalyst
          assert:
            - "status 404 with data.error_id == ERR_CIRCUIT_NOT_FOUND"
            - "response_type == error and meta.api_request_id is present"

      - name: corner_path_segment_with_unknown_circuit_id_rejected
        claim_type: parent_relationships
        grounds:
          - validations[priority=11]
          - errors.ERR_CIRCUIT_NOT_FOUND
          - endpoints["POST /path-segments"]
        distinguishing_aspect: "Body foreign keys are validated as strictly as path parameters: an unknown circuit_id on a segment must 404 on the referenced entity rather than creating a dangling edge in the path graph."
        test_recipe:
          setup:
            - "One ApplicationPath exists; no circuit with the referenced id exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /application-paths"
              payload: { name: "Branch VPN Path", service_tier: "BRONZE", protection_scheme: "UNPROTECTED", min_surviving_legs: 1 }
              as: PlatformAdmin
              captures: { pz_id: $.data.id }
          trigger:
            - call: "POST /path-segments"
              payload: { application_path_id: "${pz_id}", leg_group: "LEG_A", sequence_index: 1, circuit_id: "00000000-0000-4000-8000-000000000000" }
              as: PlatformAdmin
          assert:
            - "status 404 with data.error_id == ERR_CIRCUIT_NOT_FOUND"
            - "ApplicationPath.${pz_id}.active_leg_count == 0 and posture == PROTECTED (a path with no segments is vacuously protected)"

      - name: corner_alarm_row_is_immutable_and_versionless
        claim_type: immutability
        grounds:
          - entities.Alarm
          - endpoints["GET /alarms/{id}"]
          - endpoints["POST /alarms/{id}/clear"]
        distinguishing_aspect: "Alarm is declared common_fields false, so it carries id and created_at only: no version and no updated_at, and the sole permitted mutation is the clear action which stamps cleared_at and correlation_state."
        test_recipe:
          setup:
            - "Carrier PFT with one MONITORED circuit; a CRITICAL alarm raised at 00:00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { name: "Plainfield Telecom", carrier_code: "PFT" }
              as: PlatformAdmin
              captures: { pft_id: $.data.id }
            - call: "POST /circuits"
              payload: { carrier_id: "${pft_id}", carrier_circuit_identifier: "PFT-CKT-9001", site_a_code: "CHI01", site_z_code: "MSP01", bandwidth_mbps: 500, mrc_cents: 275000, monitoring_state: "MONITORED" }
              as: PlatformAdmin
              captures: { cz_id: $.data.id }
            - call: "POST /alarms"
              payload: { alarm_type: "LOSS_OF_SIGNAL", raw_severity: "CRITICAL", raised_at: "2026-08-01T00:00:00Z", source_circuit_id: "${cz_id}" }
              as: NocAnalyst
              captures: { az_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:20:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /alarms/${az_id}/clear"
              payload: { cleared_at: "2026-08-01T00:20:00Z" }
              as: NocAnalyst
            - call: "GET /alarms/${az_id}"
              payload: {}
              as: NocAnalyst
          assert:
            - "the alarm representation contains id and created_at but no version and no updated_at field"
            - "Alarm.${az_id}.cleared_at == 2026-08-01T00:20:00.000Z and correlation_state == CLEARED"
            - "Alarm.${az_id}.raised_at is still 2026-08-01T00:00:00.000Z and alarm_type is still LOSS_OF_SIGNAL"
            - "Circuit.${cz_id}.operational_state == UP again after the clear"

      - name: corner_carrier_circuits_listing_paginates_with_total_count
        claim_type: listing
        grounds:
          - endpoints["GET /carriers/{id}/circuits"]
          - response_envelope.pagination_fields
        distinguishing_aspect: "Three circuits under one carrier, read with limit 2: the first page must report total_count 3 with has_more true and the second page must return the remaining row with has_more false."
        test_recipe:
          setup:
            - "Carrier PFT with exactly three circuits PFT-CKT-9001 (MONITORED), PFT-CKT-9002 (MONITORED) and PFT-CKT-9003 (default UNMONITORED)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { name: "Plainfield Telecom", carrier_code: "PFT" }
              as: PlatformAdmin
              captures: { pft_id: $.data.id }
            - call: "POST /circuits"
              payload: { carrier_id: "${pft_id}", carrier_circuit_identifier: "PFT-CKT-9001", site_a_code: "CHI01", site_z_code: "MSP01", bandwidth_mbps: 500, mrc_cents: 275000, monitoring_state: "MONITORED" }
              as: PlatformAdmin
            - call: "POST /circuits"
              payload: { carrier_id: "${pft_id}", carrier_circuit_identifier: "PFT-CKT-9002", site_a_code: "CHI01", site_z_code: "DET01", bandwidth_mbps: 500, mrc_cents: 275000, monitoring_state: "MONITORED" }
              as: PlatformAdmin
            - call: "POST /circuits"
              payload: { carrier_id: "${pft_id}", carrier_circuit_identifier: "PFT-CKT-9003", site_a_code: "CHI01", site_z_code: "STL01", bandwidth_mbps: 100, mrc_cents: 90000 }
              as: PlatformAdmin
          trigger:
            - call: "GET /carriers/${pft_id}/circuits"
              payload: { limit: 2, offset: 0 }
              as: CapacityPlanner
              as_user_id: "cp-1"
            - call: "GET /carriers/${pft_id}/circuits"
              payload: { limit: 2, offset: 2 }
              as: CapacityPlanner
              as_user_id: "cp-1"
            - call: "GET /carriers/${pft_id}/circuits"
              payload: { monitoring_state: "MONITORED" }
              as: CapacityPlanner
              as_user_id: "cp-1"
          assert:
            - "first page: 2 rows, limit 2, offset 0, total_count 3, has_more true"
            - "second page: 1 row, limit 2, offset 2, total_count 3, has_more false"
            - "the two pages together contain the three distinct circuit ids with no duplicates"
            - "the MONITORED filter returns total_count 2 and both rows have monitoring_state MONITORED"
            - "response_type == array on all three reads"

      - name: corner_carrier_ticket_create_stamps_system_fields
        claim_type: system_fields
        grounds:
          - entities.CarrierTicket.fields.opened_at
          - entities.CarrierTicket.fields.carrier_id
          - entities.CarrierTicket.fields.reported_circuit_identifier
          - endpoints["POST /carrier-tickets"]
        distinguishing_aspect: "opened_at, carrier_id, tier_entered_at and reported_circuit_identifier are all derived from the clock and the circuit rather than from the request body, so a body that supplies only the three declared inputs still yields a fully stamped ticket."
        test_recipe:
          setup:
            - "Carrier PFT with MONITORED circuit PFT-CKT-9001, one BRONZE single-leg path on it, and a CRITICAL alarm at 00:00 that drove the circuit DOWN and opened an incident."
            - "The clock is advanced to 00:45 before the ticket is opened."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { name: "Plainfield Telecom", carrier_code: "PFT" }
              as: PlatformAdmin
              captures: { pft_id: $.data.id }
            - call: "POST /circuits"
              payload: { carrier_id: "${pft_id}", carrier_circuit_identifier: "PFT-CKT-9001", site_a_code: "CHI01", site_z_code: "MSP01", bandwidth_mbps: 500, mrc_cents: 275000, monitoring_state: "MONITORED" }
              as: PlatformAdmin
              captures: { cz_id: $.data.id }
            - call: "POST /application-paths"
              payload: { name: "Branch VPN Path", service_tier: "BRONZE", protection_scheme: "UNPROTECTED", min_surviving_legs: 1 }
              as: PlatformAdmin
              captures: { pz_id: $.data.id }
            - call: "POST /path-segments"
              payload: { application_path_id: "${pz_id}", leg_group: "LEG_A", sequence_index: 1, circuit_id: "${cz_id}" }
              as: PlatformAdmin
            - call: "POST /alarms"
              payload: { alarm_type: "LOSS_OF_SIGNAL", raw_severity: "CRITICAL", raised_at: "2026-08-01T00:00:00Z", source_circuit_id: "${cz_id}" }
              as: NocAnalyst
              captures: { az_id: $.data.id, iz_id: $.data.incident_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:45:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /carrier-tickets"
              payload: { incident_id: "${iz_id}", circuit_id: "${cz_id}", carrier_reference: "PFT-TT-1" }
              as: NocAnalyst
              captures: { tz_id: $.data.id }
          assert:
            - "status 201 and CarrierTicket.${tz_id}.state == OPEN"
            - "CarrierTicket.${tz_id}.opened_at == 2026-08-01T00:45:00.000Z and tier_entered_at == 2026-08-01T00:45:00.000Z"
            - "CarrierTicket.${tz_id}.tier_level == 1 and fail_test_count == 0 and reopen_count == 0"
            - "CarrierTicket.${tz_id}.carrier_id == ${pft_id} (copied from the circuit, never supplied)"
            - "CarrierTicket.${tz_id}.reported_circuit_identifier == PFT-CKT-9001"
            - "CarrierTicket.${tz_id}.restored_at == null and confirmed_at == null and restoration_confirmed_by_user_id == null"
            - "Incident.${iz_id}.version == 2 (the ticket creation bumped it)"

      - name: corner_path_segment_junction_links_path_to_circuit_graph
        claim_type: graph
        grounds:
          - entities.PathSegment
          - endpoints["POST /path-segments"]
          - endpoints["GET /path-segments"]
          - calculations.path_posture_and_legs
        distinguishing_aspect: "PathSegment is the many-to-many junction of the topology graph: one circuit may appear in segments of two different paths, and each insert re-derives that path's leg counters independently."
        test_recipe:
          setup:
            - "Carrier PFT with one MONITORED circuit PFT-CKT-9001 and two ApplicationPaths (GOLD 'Voice' and BRONZE 'Guest')."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { name: "Plainfield Telecom", carrier_code: "PFT" }
              as: PlatformAdmin
              captures: { pft_id: $.data.id }
            - call: "POST /circuits"
              payload: { carrier_id: "${pft_id}", carrier_circuit_identifier: "PFT-CKT-9001", site_a_code: "CHI01", site_z_code: "MSP01", bandwidth_mbps: 500, mrc_cents: 275000, monitoring_state: "MONITORED" }
              as: PlatformAdmin
              captures: { cz_id: $.data.id }
            - call: "POST /application-paths"
              payload: { name: "Voice", service_tier: "GOLD", protection_scheme: "UNPROTECTED", min_surviving_legs: 1 }
              as: PlatformAdmin
              captures: { pv_id: $.data.id }
            - call: "POST /application-paths"
              payload: { name: "Guest", service_tier: "BRONZE", protection_scheme: "UNPROTECTED", min_surviving_legs: 1 }
              as: PlatformAdmin
              captures: { pq_id: $.data.id }
          trigger:
            - call: "POST /path-segments"
              payload: { application_path_id: "${pv_id}", leg_group: "LEG_A", sequence_index: 1, circuit_id: "${cz_id}" }
              as: PlatformAdmin
              captures: { sv_id: $.data.id }
            - call: "POST /path-segments"
              payload: { application_path_id: "${pq_id}", leg_group: "LEG_A", sequence_index: 1, circuit_id: "${cz_id}" }
              as: PlatformAdmin
              captures: { sq_id: $.data.id }
            - call: "GET /path-segments"
              payload: { circuit_id: "${cz_id}" }
              as: NocShiftLead
              as_user_id: "lead-1"
          assert:
            - "both segment creates return 201 with segment_state ACTIVE"
            - "PathSegment.${sv_id}.device_id == null and PathSegment.${sq_id}.device_id == null"
            - "GET /path-segments filtered on the circuit returns total_count 2 spanning two different application_path_id values"
            - "ApplicationPath.${pv_id}.active_leg_count == 1, healthy_leg_count == 1, monitored_segment_count == 1, posture == PROTECTED"
            - "ApplicationPath.${pq_id}.active_leg_count == 1, healthy_leg_count == 1, monitored_segment_count == 1, posture == PROTECTED"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: corner_incident_opens_in_detected_with_no_escalation
        claim_type: initial_state
        grounds:
          - state_machines.Incident.response_state_dimension
          - state_machines.Incident.escalation_state_dimension
          - entities.Incident.fields.alarm_count
        distinguishing_aspect: "The incident is created as a side effect of the first alarm, so its two dimensions must start at DETECTED and NONE with alarm_count 1 and every later timestamp null."
        test_recipe:
          setup:
            - "Carrier PFT with one MONITORED circuit and one BRONZE single-leg path on it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T03:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { name: "Plainfield Telecom", carrier_code: "PFT" }
              as: PlatformAdmin
              captures: { pft_id: $.data.id }
            - call: "POST /circuits"
              payload: { carrier_id: "${pft_id}", carrier_circuit_identifier: "PFT-CKT-9001", site_a_code: "CHI01", site_z_code: "MSP01", bandwidth_mbps: 500, mrc_cents: 275000, monitoring_state: "MONITORED" }
              as: PlatformAdmin
              captures: { cz_id: $.data.id }
            - call: "POST /application-paths"
              payload: { name: "Guest", service_tier: "BRONZE", protection_scheme: "UNPROTECTED", min_surviving_legs: 1 }
              as: PlatformAdmin
              captures: { pq_id: $.data.id }
            - call: "POST /path-segments"
              payload: { application_path_id: "${pq_id}", leg_group: "LEG_A", sequence_index: 1, circuit_id: "${cz_id}" }
              as: PlatformAdmin
          trigger:
            - call: "POST /alarms"
              payload: { alarm_type: "LOSS_OF_SIGNAL", raw_severity: "CRITICAL", raised_at: "2026-08-01T03:00:00Z", source_circuit_id: "${cz_id}" }
              as: NocAnalyst
              captures: { az_id: $.data.id, iz_id: $.data.incident_id }
          assert:
            - "Incident.${iz_id}.response_state == DETECTED and escalation_state == NONE"
            - "Incident.${iz_id}.detected_at == 2026-08-01T03:00:00.000Z"
            - "Incident.${iz_id}.triaged_at == null, mitigated_at == null, resolved_at == null, reopen_count == 0"
            - "Incident.${iz_id}.alarm_count == 1 and root_alarm_id == ${az_id} and primary_circuit_id == ${cz_id}"
            - "Incident.${iz_id}.impact_score == 20 and severity == SEV3 (tier_max 1*10 + path_count_term 2 + redundancy 8 + spof 0)"
            - "Incident.${iz_id}.response_due_at == 2026-08-01T05:00:00.000Z and escalation_due_at == 2026-08-01T07:00:00.000Z"
            - "Incident.${iz_id}.version == 1"

      - name: corner_claim_settle_from_draft_rejected
        claim_type: invalid_transitions
        grounds:
          - validations[priority=35]
          - errors.ERR_CLAIM_STATE_INVALID
          - state_machines.SlaCreditClaim
          - endpoints["POST /sla-credit-claims/{id}/settle"]
        distinguishing_aspect: "settle is reachable only from ACKNOWLEDGED; invoking it on a DRAFT claim must be refused on state grounds before the paid-amount comparison at priority 94 is ever considered."
        test_recipe:
          setup:
            - "Carrier NLC (defaults) with MONITORED circuit NLC-CKT-1001 (mrc_cents 920000) and a single GOLD single-leg path."
            - "Alarm at 00:00 -> incident; ticket opened 00:30; carrier reports RESTORED at 06:00; alarm cleared 06:00; restoration confirmed 06:30 by lead-1."
            - "The single GOLD path scores impact 50 / SEV1, so the applicable target is 240 minutes; the carrier clock is 330.00 (00:30 -> 06:00), the breach is 90.00 minutes -> 2 breach hours -> 10 pct, and the auto-drafted DRAFT claim carries credit_amount_cents 92000 (920000 * 4/4 * 10 pct, under the 460000 cap)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { name: "NorthLink Communications", carrier_code: "NLC" }
              as: PlatformAdmin
              captures: { nl_id: $.data.id }
            - call: "POST /circuits"
