    output: RootCauseAnalysis
    side_effects:
      - "status -> COMPLETED; completed_at = clock"
      - "If verdict == SUBSTANTIATED: Product.substantiated_count_90d recomputed; Product.posture recomputed (cascade hop 2)"
      - "increments RootCauseAnalysis.version by 1"
      - "ERR_RCA_DEADLINE_PASSED when clock is past complaint.received_at + 30 calendar days (completion exactly at the deadline succeeds)"

  # --- Remediation Decisions ---
  - method: POST
    path: "/complaint-office/complaints/{id}/remediation_decisions"
    description: "Create a RemediationDecision (DRAFT); OCC-guarded on complaint version"
    roles: [CaseHandler]
    code: 201
    input: [decision_type, line_items, expected_complaint_version]
    output: RemediationDecision
    side_effects:
      - "status=DRAFT; drafted_by_user_id = acting X-User-ID"
      - "restitution_amount_cents computed per restitution_amount (per-line floor then sum)"
      - "increments Complaint.version by 1 (drafting basis advances)"
      - "ERR_STALE_VERSION on version mismatch"

  - method: GET
    path: "/complaint-office/complaints/{id}/remediation_decisions"
    description: "List remediation decisions of a complaint (reverse reachability for RemediationDecision.complaint_id)"
    roles: [ComplaintManager, CaseHandler, QAReviewer, RemediationApprover, ExecutiveReviewer, Auditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "RemediationDecision[]"
    side_effects: []

  - method: GET
    path: "/complaint-office/remediation-decisions/{decisionId}"
    description: "Get a RemediationDecision"
    roles: [ComplaintManager, CaseHandler, QAReviewer, RemediationApprover, ExecutiveReviewer, Auditor]
    code: 200
    input: []
    output: RemediationDecision
    side_effects: []

  - method: POST
    path: "/complaint-office/remediation-decisions/{decisionId}/submit"
    description: "DRAFT -> PENDING_APPROVAL"
    roles: [CaseHandler]
    code: 200
    input: []
    output: RemediationDecision
    side_effects: ["status -> PENDING_APPROVAL", "increments RemediationDecision.version by 1", "ERR_COMPLAINT_NOT_REMEDIABLE when complaint INTAKE/TRIAGED/WITHDRAWN"]

  - method: POST
    path: "/complaint-office/remediation-decisions/{decisionId}/approve"
    description: "PENDING_APPROVAL -> APPROVED (SoD + authority cap)"
    roles: [RemediationApprover]
    code: 200
    input: []
    output: RemediationDecision
    side_effects:
      - "status -> APPROVED; approved_by_user_id set"
      - "Complaint.approved_restitution_cents recomputed (increase)"
      - "increments RemediationDecision.version by 1"
      - "Append IntakeEvent(REMEDIATION_APPROVED)"
      - "ERR_SOD_SELF_APPROVAL; ERR_RESTITUTION_OVER_AUTHORITY above cap without X-Manager-Authority: true"

  - method: POST
    path: "/complaint-office/remediation-decisions/{decisionId}/reject"
    description: "PENDING_APPROVAL -> REJECTED (SoD)"
    roles: [RemediationApprover]
    code: 200
    input: []
    output: RemediationDecision
    side_effects: ["status -> REJECTED", "increments RemediationDecision.version by 1", "ERR_SOD_SELF_APPROVAL"]

  - method: POST
    path: "/complaint-office/remediation-decisions/{decisionId}/mark_paid"
    description: "APPROVED -> PAID"
    roles: [CaseHandler]
    code: 200
    input: []
    output: RemediationDecision
    side_effects: ["status -> PAID", "Complaint.paid_restitution_cents recomputed (increase)", "increments RemediationDecision.version by 1", "Append IntakeEvent(REMEDIATION_PAID)"]

  - method: POST
    path: "/complaint-office/remediation-decisions/{decisionId}/reverse"
    description: "APPROVED -> REVERSED (compensating action)"
    roles: [RemediationApprover]
    code: 200
    input: []
    output: RemediationDecision
    side_effects: ["status -> REVERSED", "Complaint.approved_restitution_cents recomputed (decrease by restitution_amount_cents)", "increments RemediationDecision.version by 1", "Append IntakeEvent(REMEDIATION_REVERSED)"]

  # --- Quality Reviews ---
  - method: POST
    path: "/complaint-office/complaints/{id}/quality-reviews"
    description: "Claim a QA review occupying a half-open sampling window [window_start_at, window_end_at)"
    roles: [QAReviewer]
    code: 201
    input: [window_start_at, window_end_at]
    output: QualityReview
    side_effects:
      - "status=OPEN; reviewer_user_id = acting X-User-ID"
      - "ERR_REVIEW_WINDOW_OVERLAP when the acting reviewer already holds an OPEN review whose half-open interval intersects (shared endpoints allowed)"

  - method: GET
    path: "/complaint-office/complaints/{id}/quality-reviews"
    description: "List quality reviews of a complaint (reverse reachability for QualityReview.complaint_id)"
    roles: [ComplaintManager, CaseHandler, QAReviewer, ExecutiveReviewer, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "QualityReview[]"
    side_effects: []

  - method: GET
    path: "/complaint-office/quality-reviews/{reviewId}"
    description: "Get a QualityReview"
    roles: [ComplaintManager, CaseHandler, QAReviewer, ExecutiveReviewer, Auditor]
    code: 200
    input: []
    output: QualityReview
    side_effects: []

  - method: POST
    path: "/complaint-office/quality-reviews/{reviewId}/complete"
