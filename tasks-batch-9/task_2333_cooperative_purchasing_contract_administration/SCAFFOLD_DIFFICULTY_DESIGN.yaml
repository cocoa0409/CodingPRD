    instances:
      - name: net_unit_price_tier_plus_nonprofit_bonus_hits_discount_cap_then_floor
        grounds:
          - calculations.net_unit_price
          - calculations.member_usage_total
          - entities.MemberAgency.fields.member_category
          - entities.ContractLineItem.fields.price_floor_cents
          - endpoints.GET_/coop/master-contracts/{id}/price-quote
        distinguishing_aspect: |
          Four independent inputs interact in one formula: the spend-derived tier (2, 18%),
          the NONPROFIT_501C3 bonus (+3%), the MAX_TOTAL_DISCOUNT_PCT ceiling (0.2000, which
          truncates 0.21) and the per-line price_floor_cents. On JAN-DISP-500 the cap binds
          and the floor does not (net 10000, not the uncapped 9875); on JAN-CART-100 the SAME
          capped 20% discount is entirely absorbed by the floor (net 9800, not 8000). Getting
          three of the four right still produces a wrong number on at least one line.
