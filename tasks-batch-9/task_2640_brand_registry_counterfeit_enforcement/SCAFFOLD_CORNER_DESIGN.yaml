      - name: litigation_ladder_requires_an_answered_letter_then_a_second_representative
        claim_type: Priority Ordering
        grounds:
          - validations[priority=40]
          - validations[priority=44]
          - errors[ERR_CEASE_DESIST_NOT_ANSWERED]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: "Litigation is gated twice in sequence: authorizing before any letter is ERR_CEASE_DESIST_NOT_ANSWERED, and authorizing after the answer but as the representative who signed the letter is ERR_SEGREGATION_OF_DUTIES — only a different designation clears both and rolls the case up to IN_LITIGATION."
        test_recipe:
          setup:
            - "A manually opened case on an ACTIVE AMZ enrollment with two designations: rep1 SUBMIT_TAKEDOWN and rep2 AUTHORIZE_LITIGATION"
            - "The two designations hold different authority scopes, so their identical effective windows never trip the overlap rule"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T08:00:00Z" }
              as: BrandAdministrator
            - call: "POST /brand-protection/brands"
              payload: { name: "Acme Tools", owner_legal_entity: "Acme Tools LLC", home_jurisdiction: "US", authorized_msrp_cents: 10000, enforcement_budget_cents: 500000 }
              as: BrandAdministrator
              captures: { brand_id: $.data.id, brand_v: $.data.version }
            - call: "POST /brand-protection/trademark-registrations"
              payload: { brand_id: "${brand_id}", registration_number: "US-4455667", jurisdiction: "US", nice_class: 8, registration_date: "2024-03-15", expiry_date: "2034-03-15", principal_register: true, status: "REGISTERED" }
              as: BrandAdministrator
              captures: { reg_id: $.data.id }
            - call: "POST /brand-protection/enrollments"
              payload: { brand_id: "${brand_id}", asserted_registration_id: "${reg_id}", marketplace_code: "AMZ", requested_nice_class: 8, expected_brand_version: "${brand_v}" }
              as: BrandAdministrator
              captures: { enr_id: $.data.id }
            - call: "POST /brand-protection/enrollments/${enr_id}/activate"
              as: MarketplaceLiaison
            - call: "POST /brand-protection/representatives"
              payload: { enrollment_id: "${enr_id}", authority_scope: "SUBMIT_TAKEDOWN", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z", power_of_attorney_ref: "POA-1" }
              as: BrandAdministrator
              captures: { rep1_id: $.data.id }
            - call: "POST /brand-protection/representatives"
              payload: { enrollment_id: "${enr_id}", authority_scope: "AUTHORIZE_LITIGATION", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z", power_of_attorney_ref: "POA-2" }
              as: BrandAdministrator
              captures: { rep2_id: $.data.id }
            - call: "POST /brand-protection/sellers"
              payload: { marketplace_code: "AMZ", seller_ref: "A1SELLER", legal_name: "Shenzhen Trading Co", jurisdiction: "CN" }
              as: EnforcementAnalyst
              captures: { seller_id: $.data.id }
            - call: "POST /brand-protection/cases"
              payload: { brand_id: "${brand_id}", seller_id: "${seller_id}" }
              as: LegalCounsel
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /brand-protection/cases/${case_id}/authorize-litigation"
              payload: { authorization_ref: "AUTH-0" }
              as: AuthorizedRepresentative
              as_user_id: "${rep2_id}"
              captures: { err_id: $.data.error_id }
            - call: "POST /brand-protection/cases/${case_id}/cease-desist"
              payload: { letter_ref: "CD-1" }
              as: AuthorizedRepresentative
              as_user_id: "${rep1_id}"
            - call: "POST /brand-protection/cases/${case_id}/record-response"
              payload: { response_ref: "RESP-1", response_kind: "DENIAL" }
              as: LegalCounsel
            - call: "POST /brand-protection/cases/${case_id}/authorize-litigation"
              payload: { authorization_ref: "AUTH-1" }
              as: AuthorizedRepresentative
              as_user_id: "${rep1_id}"
              captures: { err2_id: $.data.error_id }
            - call: "POST /brand-protection/cases/${case_id}/authorize-litigation"
              payload: { authorization_ref: "AUTH-2" }
              as: AuthorizedRepresentative
              as_user_id: "${rep2_id}"
            - call: "POST /brand-protection/cases/${case_id}/file-suit"
              payload: { docket_ref: "2:26-cv-00815", court_code: "CACD" }
              as: LegalCounsel
            - call: "POST /brand-protection/cases/${case_id}/close"
              payload: { outcome: "SETTLED", closure_note: "consent judgment" }
              as: LegalCounsel
          assert:
            - "authorizing with correspondence_status NONE returns HTTP 409 with data.error_id == ERR_CEASE_DESIST_NOT_ANSWERED"
            - "the cease-and-desist returns HTTP 200 with correspondence_status CD_SENT, cease_desist_sent_by_rep_id == ${rep1_id}, cd_sent_at == 2026-08-05T08:00:00Z and cd_response_due_at == 2026-08-25T08:00:00Z (14 business days)"
            - "the letter's own signer authorizing returns HTTP 409 with data.error_id == ERR_SEGREGATION_OF_DUTIES and leaves litigation_status NONE and case_status OPEN"
            - "the second representative authorizing returns HTTP 200 with litigation_status AUTHORIZED, litigation_authorized_by_rep_id == ${rep2_id} and case_status IN_LITIGATION"
            - "file-suit returns HTTP 200 with litigation_status FILED and case_status still IN_LITIGATION"
            - "close SETTLED returns HTTP 200 with litigation_status SETTLED, case_status CLOSED and closure_outcome SETTLED"
            - "EnforcementCase.${case_id}.originating_takedown_id == null (the case was opened by hand, not by a cascade)"
            - "Seller.${seller_id}.cluster_strike_points == 0.00 (correspondence and litigation never attribute strike points)"

