# =============================================================================
# §1.8 Scaffold Difficulty Design — Corrugated Box Plant & Sheet Feeder
# Two instances per Difficulty Rule (§0.5). All money literals computed by
# executing the §1.3 formulas as code (Decimal, ROUND_HALF_UP).
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: order_pricing_provisional_quote_vs_final_invoice
        grounds:
          - calculations.freight_tiered_pricing
          - calculations.volume_discount_total
          - state_machines.BoxOrder.PRODUCED_to_INVOICED
        distinguishing_aspect: |
          Entity domain = BoxOrder pricing. The PROVISIONAL variant bills order.quantity (2000)
          and the FINAL variant bills order.produced_qty (2100) at the same locked unit price,
          so the same formula yields quote_total_dollars 1284.12 vs invoice_total_dollars 1348.33.
        test_recipe:
          setup:
            - "Customer Acme (120.0 mi -> LOCAL, credit 50000.00), grade 32C (ect 32)"
            - "Order ORD-1: DIE_CUT INTERNAL 29x36 in, qty 2000, min_ect 32, inks [BLACK, RED]"
            - "Quote at 60.00/MSF accepted; run [480,720) web 87 on a CORRUGATOR shift; order attached outs 3; run completed"
            - "DIE_CUTTER shift [480,960); booking [480,600) started and completed with produced_qty 2100"
          setup_api_calls:
            - { call: "POST /api/customer-accounts", payload: { account_name: "Acme Foods", ship_to_city: "Fresno", distance_miles_from_plant: 120.0, credit_limit_dollars: 50000.00 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /api/board-grades", payload: { grade_code: "32C", liner_combo: "35/23/35", flute: "C", ect_rating_lbs_per_in: 32, burst_rating_psi: 200, basis_weight_lbs_per_msf: 90.0 }, as: PlantAdmin, captures: { grade_id: $.data.id } }
            - { call: "POST /api/box-orders", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", routing_type: "DIE_CUT", board_source: "INTERNAL", quantity: 2000, blank_width_in: 29.0, blank_length_in: 36.0, min_ect_required: 32, ink_colors: ["BLACK", "RED"] }, as: SalesRep, captures: { ord_id: $.data.id, ord_v: $.data.version } }
            - { call: "POST /api/box-orders/${ord_id}/quotes", payload: { unit_price_per_msf: 60.00, expires_on: "2026-12-31", expected_order_version: "${ord_v}" }, as: SalesRep, captures: { quo_id: $.data.id } }
            - { call: "POST /api/price-quotes/${quo_id}/accept", payload: {}, as: SalesRep }
            - { call: "POST /api/work-shifts", payload: { machine_code: "CORRUGATOR", shift_date: "2026-08-10", start_minute: 480, end_minute: 960 }, as: ProductionPlanner, captures: { sh_corr: $.data.id } }
            - { call: "POST /api/corrugator-runs", payload: { work_shift_id: "${sh_corr}", board_grade_id: "${grade_id}", start_minute: 480, end_minute: 720, web_width_in: 87.0 }, as: ProductionPlanner, captures: { run_id: $.data.id } }
            - { call: "POST /api/corrugator-runs/${run_id}/orders", payload: { box_order_id: "${ord_id}", outs: 3 }, as: ProductionPlanner }
            - { call: "POST /api/corrugator-runs/${run_id}/complete", payload: {}, as: ProductionPlanner }
            - { call: "POST /api/work-shifts", payload: { machine_code: "DIE_CUTTER", shift_date: "2026-08-10", start_minute: 480, end_minute: 960 }, as: ProductionPlanner, captures: { sh_die: $.data.id } }
            - { call: "POST /api/converting-bookings", payload: { box_order_id: "${ord_id}", work_shift_id: "${sh_die}", start_minute: 480, end_minute: 600 }, as: ProductionPlanner, captures: { bk_id: $.data.id } }
            - { call: "POST /api/converting-bookings/${bk_id}/start", payload: {}, as: ProductionPlanner }
            - { call: "POST /api/converting-bookings/${bk_id}/complete", payload: { produced_qty: 2100 }, as: ProductionPlanner }
          trigger:
            - { call: "POST /api/box-orders/${ord_id}/invoice", payload: {}, as: SalesRep, captures: { inv_total: $.data.invoice_total_dollars, inv_merch: $.data.invoice_merchandise_dollars, inv_freight: $.data.invoice_freight_dollars, inv_bill: $.data.invoice_billable_msf } }
          assert:
            - "BoxOrder.${ord_id}.status == INVOICED"
            - "invoice_billable_msf == 15.225 (2100 x 7.25 / 1000, PROVISIONAL would have been 14.5)"
            - "invoice_merchandise_dollars == 1074.28 (= round2(15.225 x 63.00 x 1.12))"
            - "invoice_freight_dollars == 274.05 (= round2(15.225 x 18.00))"
            - "invoice_total_dollars == 1348.33"
            - "PriceQuote.${quo_id}.quote_total_dollars == 1284.12 and status == INVOICED"
            - "invoice_total_dollars (1348.33) != quote_total_dollars (1284.12) — same rates, different billed quantity"

      - name: claim_credit_filing_variant_vs_resolution_variant
        grounds:
          - calculations.claim_credit
          - state_machines.QualityClaim.UNDER_REVIEW_to_RESOLVED_CREDIT
        distinguishing_aspect: |
          Entity domain = QualityClaim credit (different domain from instance 1's BoxOrder pricing).
          FILING uses defective_qty_claimed (500) with no freight; RESOLUTION uses defective_qty_verified (400)
          plus capped freight (min(620.00, 500.00)), yielding provisional 255.80 vs final 704.64.
        test_recipe:
          setup:
            - "Same pipeline as order_pricing_provisional_quote_vs_final_invoice: ORD-1 INVOICED with produced_qty 2100 and invoice_merchandise_dollars 1074.28"
            - "Claim filed by CustomerService user cs-100: TRANSIT_DAMAGE, defective_qty_claimed 500"
          setup_api_calls:
            - { call: "POST /api/customer-accounts", payload: { account_name: "Acme Foods", ship_to_city: "Fresno", distance_miles_from_plant: 120.0, credit_limit_dollars: 50000.00 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /api/board-grades", payload: { grade_code: "32C", liner_combo: "35/23/35", flute: "C", ect_rating_lbs_per_in: 32, burst_rating_psi: 200, basis_weight_lbs_per_msf: 90.0 }, as: PlantAdmin, captures: { grade_id: $.data.id } }
            - { call: "POST /api/box-orders", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", routing_type: "DIE_CUT", board_source: "INTERNAL", quantity: 2000, blank_width_in: 29.0, blank_length_in: 36.0, min_ect_required: 32, ink_colors: ["BLACK", "RED"] }, as: SalesRep, captures: { ord_id: $.data.id, ord_v: $.data.version } }
            - { call: "POST /api/box-orders/${ord_id}/quotes", payload: { unit_price_per_msf: 60.00, expires_on: "2026-12-31", expected_order_version: "${ord_v}" }, as: SalesRep, captures: { quo_id: $.data.id } }
            - { call: "POST /api/price-quotes/${quo_id}/accept", payload: {}, as: SalesRep }
            - { call: "POST /api/work-shifts", payload: { machine_code: "CORRUGATOR", shift_date: "2026-08-10", start_minute: 480, end_minute: 960 }, as: ProductionPlanner, captures: { sh_corr: $.data.id } }
            - { call: "POST /api/corrugator-runs", payload: { work_shift_id: "${sh_corr}", board_grade_id: "${grade_id}", start_minute: 480, end_minute: 720, web_width_in: 87.0 }, as: ProductionPlanner, captures: { run_id: $.data.id } }
            - { call: "POST /api/corrugator-runs/${run_id}/orders", payload: { box_order_id: "${ord_id}", outs: 3 }, as: ProductionPlanner }
            - { call: "POST /api/corrugator-runs/${run_id}/complete", payload: {}, as: ProductionPlanner }
            - { call: "POST /api/work-shifts", payload: { machine_code: "DIE_CUTTER", shift_date: "2026-08-10", start_minute: 480, end_minute: 960 }, as: ProductionPlanner, captures: { sh_die: $.data.id } }
            - { call: "POST /api/converting-bookings", payload: { box_order_id: "${ord_id}", work_shift_id: "${sh_die}", start_minute: 480, end_minute: 600 }, as: ProductionPlanner, captures: { bk_id: $.data.id } }
            - { call: "POST /api/converting-bookings/${bk_id}/start", payload: {}, as: ProductionPlanner }
            - { call: "POST /api/converting-bookings/${bk_id}/complete", payload: { produced_qty: 2100 }, as: ProductionPlanner }
            - { call: "POST /api/box-orders/${ord_id}/invoice", payload: {}, as: SalesRep }
            - { call: "POST /api/quality-claims", payload: { box_order_id: "${ord_id}", claim_type: "TRANSIT_DAMAGE", defective_qty_claimed: 500 }, as: CustomerService, as_user_id: "cs-100", captures: { clm_id: $.data.id, clm_prov: $.data.provisional_credit_dollars, clm_pbox: $.data.per_box_price_dollars } }
            - { call: "POST /api/quality-claims/${clm_id}/start-review", payload: {}, as: ClaimsAdjuster, as_user_id: "adj-200" }
          trigger:
            - { call: "POST /api/quality-claims/${clm_id}/resolve", payload: { outcome: "CREDIT", defective_qty_verified: 400, actual_return_freight_dollars: 620.00 }, as: ClaimsAdjuster, as_user_id: "adj-200", captures: { clm_final: $.data.final_credit_dollars } }
          assert:
            - "per_box_price_dollars == 0.5116 (= round4(1074.28 / 2100))"
            - "provisional_credit_dollars at filing == 255.80 (= round2(500 x 0.5116), no freight)"
            - "final_credit_dollars after resolve == 704.64 (= round2(400 x 0.5116) + min(620.00, 500.00))"
            - "final_credit_dollars (704.64) != provisional_credit_dollars (255.80) — verified qty and freight cap drive the divergence"
            - "QualityClaim.${clm_id}.status == RESOLVED_CREDIT"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (different modes: (a) and (c))
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: freight_tier_routing_multiplier_color_surcharge_interaction
        grounds:
          - calculations.freight_tiered_pricing
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — distance tier selection (LOCAL at 120 mi),
          a conditional routing multiplier (DIE_CUT x1.12), and a per-color surcharge (2 inks x 1.50/MSF)
          all multiply into one merchandise total: 14.5 MSF x 63.00 x 1.12 = 1023.12, freight 14.5 x 18.00 = 261.00.
        test_recipe:
          setup:
            - "Customer Acme (120.0 mi), grade 32C; order DIE_CUT 29x36 qty 2000, inks [BLACK, RED]"
          setup_api_calls:
            - { call: "POST /api/customer-accounts", payload: { account_name: "Acme Foods", ship_to_city: "Fresno", distance_miles_from_plant: 120.0, credit_limit_dollars: 50000.00 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /api/board-grades", payload: { grade_code: "32C", liner_combo: "35/23/35", flute: "C", ect_rating_lbs_per_in: 32, burst_rating_psi: 200, basis_weight_lbs_per_msf: 90.0 }, as: PlantAdmin, captures: { grade_id: $.data.id } }
            - { call: "POST /api/box-orders", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", routing_type: "DIE_CUT", board_source: "INTERNAL", quantity: 2000, blank_width_in: 29.0, blank_length_in: 36.0, min_ect_required: 32, ink_colors: ["BLACK", "RED"] }, as: SalesRep, captures: { ord_id: $.data.id, ord_v: $.data.version } }
          trigger:
            - { call: "POST /api/box-orders/${ord_id}/quotes", payload: { unit_price_per_msf: 60.00, expires_on: "2026-12-31", expected_order_version: "${ord_v}" }, as: SalesRep, captures: { quo_bill: $.data.billable_msf, quo_merch: $.data.merchandise_total_dollars, quo_tier: $.data.freight_tier, quo_freight: $.data.freight_charge_dollars, quo_total: $.data.quote_total_dollars } }
          assert:
            - "billable_msf == 14.5 (= round4(2000 x 7.25 / 1000))"
            - "merchandise_total_dollars == 1023.12 (= round2(14.5 x (60.00 + 1.50 x 2) x 1.12))"
            - "freight_tier == LOCAL (120.0 <= 150.00)"
            - "freight_charge_dollars == 261.00 (= round2(14.5 x 18.00))"
            - "quote_total_dollars == 1284.12 (= 1023.12 - 0.00 + 261.00)"

      - name: volume_discount_tier_keyed_on_merchandise_only_pinned_order
        grounds:
          - calculations.volume_discount_total
        distinguishing_aspect: |
          Mode (c): circular-looking dependency resolved by pinned evaluation order — the discount tier is
          keyed on merchandise_total_dollars ALONE (16000.13 -> 2%), never on merchandise+freight (25400.21,
          which would wrongly select 4%) nor on the post-discount total; correct grand total 25080.21 vs
          the wrong-key total 24760.20.
        test_recipe:
          setup:
            - "Customer Beacon (500.0 mi -> NATIONAL, credit 100000.00), grade 44BC; order SLOTTED INTERNAL 20x30 qty 48000, no inks"
          setup_api_calls:
            - { call: "POST /api/customer-accounts", payload: { account_name: "Beacon Retail", ship_to_city: "Reno", distance_miles_from_plant: 500.0, credit_limit_dollars: 100000.00 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /api/board-grades", payload: { grade_code: "44BC", liner_combo: "42/26/42/26/42", flute: "BC", ect_rating_lbs_per_in: 44, burst_rating_psi: 275, basis_weight_lbs_per_msf: 120.0 }, as: PlantAdmin, captures: { grade_id: $.data.id } }
            - { call: "POST /api/box-orders", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", routing_type: "SLOTTED", board_source: "INTERNAL", quantity: 48000, blank_width_in: 20.0, blank_length_in: 30.0, min_ect_required: 40, ink_colors: [] }, as: SalesRep, captures: { ord_id: $.data.id, ord_v: $.data.version } }
          trigger:
            - { call: "POST /api/box-orders/${ord_id}/quotes", payload: { unit_price_per_msf: 80.00, expires_on: "2026-12-31", expected_order_version: "${ord_v}" }, as: SalesRep, captures: { quo_merch: $.data.merchandise_total_dollars, quo_dpct: $.data.discount_pct, quo_disc: $.data.discount_dollars, quo_freight: $.data.freight_charge_dollars, quo_total: $.data.quote_total_dollars } }
          assert:
            - "merchandise_total_dollars == 16000.13 (= round2(round4(48000 x 4.1667 / 1000) x 80.00 x 1.00))"
            - "discount_pct == 0.02 — tier read off merchandise 16000.13 in [5000, 20000), NOT off merchandise+freight 25400.21"
            - "discount_dollars == 320.00 (= round2(16000.13 x 0.02))"
            - "freight_charge_dollars == 9400.08 (= round2(200.0016 x 47.00)) — freight is never discounted"
            - "quote_total_dollars == 25080.21 (= 16000.13 - 320.00 + 9400.08)"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: inventory_program_replenishment_cycle_active_need_active
        grounds:
          - state_machines.InventoryProgram.ACTIVE_to_REPLENISHMENT_NEEDED
          - state_machines.InventoryProgram.REPLENISHMENT_NEEDED_to_ACTIVE
          - calculations.reorder_threshold_check
        distinguishing_aspect: |
          Cyclic A->B->A on InventoryProgram: shipping a release drops on_hand to/below the reorder point
          (flip into REPLENISHMENT_NEEDED), and a later receipt raising on_hand strictly above the point
          flips back to ACTIVE — a loop, not a pipeline.
        test_recipe:
          setup:
            - "Customer Acme; program (reorder_point 100, replenishment_qty 500) stocked to on_hand 400; release of 350 approved and shipped -> on_hand 50 <= 100"
          setup_api_calls:
            - { call: "POST /api/customer-accounts", payload: { account_name: "Acme Foods", ship_to_city: "Fresno", distance_miles_from_plant: 120.0, credit_limit_dollars: 50000.00 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /api/board-grades", payload: { grade_code: "32C", liner_combo: "35/23/35", flute: "C", ect_rating_lbs_per_in: 32, burst_rating_psi: 200, basis_weight_lbs_per_msf: 90.0 }, as: PlantAdmin, captures: { grade_id: $.data.id } }
            - { call: "POST /api/inventory-programs", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", program_name: "Acme RSC program", routing_type: "SLOTTED", blank_width_in: 24.0, blank_length_in: 20.0, reorder_point: 100, replenishment_qty: 500 }, as: SalesRep, captures: { prog_id: $.data.id } }
            - { call: "POST /api/inventory-programs/${prog_id}/receipts", payload: { qty: 400 }, as: ProductionPlanner }
            - { call: "POST /api/inventory-programs/${prog_id}/release-orders", payload: { qty: 350, requested_ship_date: "2026-08-12" }, as: Customer, as_user_id: "${cust_id}", captures: { rel_id: $.data.id } }
            - { call: "POST /api/release-orders/${rel_id}/approve", payload: {}, as: PlantAdmin }
            - { call: "POST /api/release-orders/${rel_id}/ship", payload: {}, as: ProductionPlanner }
          trigger:
            - { call: "POST /api/inventory-programs/${prog_id}/receipts", payload: { qty: 60 }, as: ProductionPlanner, captures: { prog_status: $.data.status, prog_onhand: $.data.on_hand_qty } }
          assert:
            - "After ship: InventoryProgram.${prog_id}.status == REPLENISHMENT_NEEDED and on_hand_qty == 50 (cycle leg 1)"
            - "After receipt of 60: status == ACTIVE and on_hand_qty == 110 (110 > 100 strictly, cycle leg 2)"
            - "The program traversed ACTIVE -> REPLENISHMENT_NEEDED -> ACTIVE without any suspend/reactivate call"

      - name: box_order_routing_fork_die_cut_vs_slotted_divergent_branches
        grounds:
          - state_machines.BoxOrder.AWAITING_CONVERTING_to_DIE_CUT_QUEUED
          - state_machines.BoxOrder.AWAITING_CONVERTING_to_SLOTTED_QUEUED
        distinguishing_aspect: |
          Branching fork on BoxOrder: from AWAITING_CONVERTING the routing_type field selects
          DIE_CUT_QUEUED (books a DIE_CUTTER shift) or SLOTTED_QUEUED (books an FFG shift) —
          divergent target machines and a divergent guard (booking a SLOTTED order on DIE_CUTTER
          fails ERR_MACHINE_TYPE_MISMATCH), both branches later joining at CONVERTING.
        test_recipe:
          setup:
            - "ORD-D: DIE_CUT INTERNAL order run through corrugator to AWAITING_CONVERTING"
            - "ORD-S: SLOTTED SHEET_FEEDER order (supplier SheetCo) accepted, then mark-sheets-received -> AWAITING_CONVERTING"
            - "One DIE_CUTTER shift and one FFG shift, both [480,960) on 2026-08-10"
          setup_api_calls:
            - { call: "POST /api/customer-accounts", payload: { account_name: "Acme Foods", ship_to_city: "Fresno", distance_miles_from_plant: 120.0, credit_limit_dollars: 50000.00 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /api/board-grades", payload: { grade_code: "32C", liner_combo: "35/23/35", flute: "C", ect_rating_lbs_per_in: 32, burst_rating_psi: 200, basis_weight_lbs_per_msf: 90.0 }, as: PlantAdmin, captures: { grade_id: $.data.id } }
            - { call: "POST /api/box-orders", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", routing_type: "DIE_CUT", board_source: "INTERNAL", quantity: 2000, blank_width_in: 29.0, blank_length_in: 36.0, min_ect_required: 32, ink_colors: ["BLACK", "RED"] }, as: SalesRep, captures: { ord_d: $.data.id, ord_d_v: $.data.version } }
            - { call: "POST /api/box-orders/${ord_d}/quotes", payload: { unit_price_per_msf: 60.00, expires_on: "2026-12-31", expected_order_version: "${ord_d_v}" }, as: SalesRep, captures: { quo_d: $.data.id } }
            - { call: "POST /api/price-quotes/${quo_d}/accept", payload: {}, as: SalesRep }
            - { call: "POST /api/work-shifts", payload: { machine_code: "CORRUGATOR", shift_date: "2026-08-10", start_minute: 480, end_minute: 960 }, as: ProductionPlanner, captures: { sh_corr: $.data.id } }
            - { call: "POST /api/corrugator-runs", payload: { work_shift_id: "${sh_corr}", board_grade_id: "${grade_id}", start_minute: 480, end_minute: 720, web_width_in: 87.0 }, as: ProductionPlanner, captures: { run_id: $.data.id } }
            - { call: "POST /api/corrugator-runs/${run_id}/orders", payload: { box_order_id: "${ord_d}", outs: 3 }, as: ProductionPlanner }
            - { call: "POST /api/corrugator-runs/${run_id}/complete", payload: {}, as: ProductionPlanner }
            - { call: "POST /api/box-orders", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", routing_type: "SLOTTED", board_source: "SHEET_FEEDER", sheet_supplier_name: "SheetCo", quantity: 4000, blank_width_in: 30.0, blank_length_in: 40.0, min_ect_required: 30, ink_colors: ["BLACK"] }, as: SalesRep, captures: { ord_s: $.data.id, ord_s_v: $.data.version } }
            - { call: "POST /api/box-orders/${ord_s}/quotes", payload: { unit_price_per_msf: 90.00, expires_on: "2026-12-31", expected_order_version: "${ord_s_v}" }, as: SalesRep, captures: { quo_s: $.data.id } }
            - { call: "POST /api/price-quotes/${quo_s}/accept", payload: {}, as: SalesRep }
            - { call: "POST /api/box-orders/${ord_s}/mark-sheets-received", payload: {}, as: ProductionPlanner }
            - { call: "POST /api/work-shifts", payload: { machine_code: "DIE_CUTTER", shift_date: "2026-08-10", start_minute: 480, end_minute: 960 }, as: ProductionPlanner, captures: { sh_die: $.data.id } }
            - { call: "POST /api/work-shifts", payload: { machine_code: "FFG", shift_date: "2026-08-10", start_minute: 480, end_minute: 960 }, as: ProductionPlanner, captures: { sh_ffg: $.data.id } }
          trigger:
            - { call: "POST /api/converting-bookings", payload: { box_order_id: "${ord_s}", work_shift_id: "${sh_die}", start_minute: 480, end_minute: 600 }, as: ProductionPlanner, captures: { err_mismatch: $.data.error_id } }
            - { call: "POST /api/converting-bookings", payload: { box_order_id: "${ord_d}", work_shift_id: "${sh_die}", start_minute: 480, end_minute: 600 }, as: ProductionPlanner, captures: { bk_d: $.data.id } }
            - { call: "POST /api/converting-bookings", payload: { box_order_id: "${ord_s}", work_shift_id: "${sh_ffg}", start_minute: 480, end_minute: 600 }, as: ProductionPlanner, captures: { bk_s: $.data.id } }
          assert:
            - "Wrong-machine attempt on the SLOTTED order fails with ERR_MACHINE_TYPE_MISMATCH (divergent branch guard)"
            - "BoxOrder.${ord_d}.status == DIE_CUT_QUEUED and ConvertingBooking.${bk_d}.work_shift_id == ${sh_die}"
            - "BoxOrder.${ord_s}.status == SLOTTED_QUEUED and ConvertingBooking.${bk_s}.work_shift_id == ${sh_ffg}"
            - "Both bookings QUEUED with ink_colors snapshotted ([BLACK, RED] vs [BLACK])"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers; depths 3 and 2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: release_ship_to_replenishment_order_three_link_cascade
        grounds:
          - state_machines.ReleaseOrder.APPROVED_to_SHIPPED
          - state_machines.InventoryProgram.ACTIVE_to_REPLENISHMENT_NEEDED
          - calculations.program_balance_rollup
          - calculations.reorder_threshold_check
        distinguishing_aspect: |
          Depth-3 chain from POST /api/release-orders/{id}/ship: link 1 = on_hand/committed decrement
          (350 shipped -> on_hand 50); link 2 = threshold crossing flips the program to
          REPLENISHMENT_NEEDED (50 <= 100); link 3 = the flip auto-creates a DRAFT replenishment
          BoxOrder of qty 500. Each link is caused by the previous one, not by the ship call.
        test_recipe:
          setup:
            - "Customer Acme; program reorder_point 100, replenishment_qty 500, stocked to 400; release 350 approved"
          setup_api_calls:
            - { call: "POST /api/customer-accounts", payload: { account_name: "Acme Foods", ship_to_city: "Fresno", distance_miles_from_plant: 120.0, credit_limit_dollars: 50000.00 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /api/board-grades", payload: { grade_code: "32C", liner_combo: "35/23/35", flute: "C", ect_rating_lbs_per_in: 32, burst_rating_psi: 200, basis_weight_lbs_per_msf: 90.0 }, as: PlantAdmin, captures: { grade_id: $.data.id } }
            - { call: "POST /api/inventory-programs", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", program_name: "Acme RSC program", routing_type: "SLOTTED", blank_width_in: 24.0, blank_length_in: 20.0, reorder_point: 100, replenishment_qty: 500 }, as: SalesRep, captures: { prog_id: $.data.id } }
            - { call: "POST /api/inventory-programs/${prog_id}/receipts", payload: { qty: 400 }, as: ProductionPlanner }
            - { call: "POST /api/inventory-programs/${prog_id}/release-orders", payload: { qty: 350, requested_ship_date: "2026-08-12" }, as: Customer, as_user_id: "${cust_id}", captures: { rel_id: $.data.id } }
            - { call: "POST /api/release-orders/${rel_id}/approve", payload: {}, as: PlantAdmin }
          trigger:
            - { call: "POST /api/release-orders/${rel_id}/ship", payload: {}, as: ProductionPlanner, captures: { rel_status: $.data.status } }
            - { call: "GET /api/box-orders", payload: { customer_id: "${cust_id}" }, as: PlantAdmin, captures: { repl_ord_id: "$.data[0].id", repl_ord_qty: "$.data[0].quantity", repl_ord_status: "$.data[0].status" } }
          assert:
            - "ReleaseOrder.${rel_id}.status == SHIPPED"
            - "Link 1: InventoryProgram.${prog_id}.on_hand_qty == 50 and committed_qty == 0"
            - "Link 2: InventoryProgram.${prog_id}.status == REPLENISHMENT_NEEDED (50 <= reorder_point 100)"
            - "Link 3: an auto-created BoxOrder exists for the customer with status DRAFT, quantity == 500, board_source INTERNAL, routing_type SLOTTED, min_ect_required 0"

      - name: work_shift_cancel_two_hop_cascade_to_orders
        grounds:
          - state_machines.WorkShift.OPEN_to_CANCELLED
          - state_machines.CorrugatorRun.SCHEDULED_to_CANCELLED
          - state_machines.BoxOrder.SCHEDULED_to_ACCEPTED
        distinguishing_aspect: |
          Depth-2 chain from POST /api/work-shifts/{id}/cancel (different trigger from instance 1's ship):
          link 1 = the SCHEDULED run on the shift is CANCELLED; link 2 = that run cancellation reverts the
          attached BoxOrder SCHEDULED -> ACCEPTED and clears corrugator_run_id.
        test_recipe:
          setup:
            - "ORD-1 accepted and attached (outs 3) to RUN-1 [480,720) on a CORRUGATOR shift; order SCHEDULED"
          setup_api_calls:
            - { call: "POST /api/customer-accounts", payload: { account_name: "Acme Foods", ship_to_city: "Fresno", distance_miles_from_plant: 120.0, credit_limit_dollars: 50000.00 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /api/board-grades", payload: { grade_code: "32C", liner_combo: "35/23/35", flute: "C", ect_rating_lbs_per_in: 32, burst_rating_psi: 200, basis_weight_lbs_per_msf: 90.0 }, as: PlantAdmin, captures: { grade_id: $.data.id } }
            - { call: "POST /api/box-orders", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", routing_type: "DIE_CUT", board_source: "INTERNAL", quantity: 2000, blank_width_in: 29.0, blank_length_in: 36.0, min_ect_required: 32, ink_colors: ["BLACK", "RED"] }, as: SalesRep, captures: { ord_id: $.data.id, ord_v: $.data.version } }
            - { call: "POST /api/box-orders/${ord_id}/quotes", payload: { unit_price_per_msf: 60.00, expires_on: "2026-12-31", expected_order_version: "${ord_v}" }, as: SalesRep, captures: { quo_id: $.data.id } }
            - { call: "POST /api/price-quotes/${quo_id}/accept", payload: {}, as: SalesRep }
            - { call: "POST /api/work-shifts", payload: { machine_code: "CORRUGATOR", shift_date: "2026-08-10", start_minute: 480, end_minute: 960 }, as: ProductionPlanner, captures: { sh_corr: $.data.id } }
            - { call: "POST /api/corrugator-runs", payload: { work_shift_id: "${sh_corr}", board_grade_id: "${grade_id}", start_minute: 480, end_minute: 720, web_width_in: 87.0 }, as: ProductionPlanner, captures: { run_id: $.data.id } }
            - { call: "POST /api/corrugator-runs/${run_id}/orders", payload: { box_order_id: "${ord_id}", outs: 3 }, as: ProductionPlanner }
          trigger:
            - { call: "POST /api/work-shifts/${sh_corr}/cancel", payload: {}, as: ProductionPlanner, captures: { sh_status: $.data.status } }
          assert:
            - "WorkShift.${sh_corr}.status == CANCELLED"
            - "Link 1: CorrugatorRun.${run_id}.status == CANCELLED"
            - "Link 2: BoxOrder.${ord_id}.status == ACCEPTED and corrugator_run_id is null"
            - "Shift scheduled_minutes == 0 and available_minutes == capacity_minutes == 480 after the cascade"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: release_create_state_error_beats_fiscal_error
        grounds:
          - validations[priority=4]
          - validations[priority=9]
          - errors[ERR_PROGRAM_NOT_RELEASABLE]
          - errors[ERR_INSUFFICIENT_PROGRAM_BALANCE]
        distinguishing_aspect: |
          Category pair = state vs business_fiscal: the release targets a SUSPENDED program AND
          requests qty 150 > available 100; the state error ERR_PROGRAM_NOT_RELEASABLE (priority 4)
          is returned, not the fiscal ERR_INSUFFICIENT_PROGRAM_BALANCE (priority 9).
        test_recipe:
          setup:
            - "Customer Acme; program stocked to on_hand 100 (available 100), then SUSPENDED by PlantAdmin"
          setup_api_calls:
            - { call: "POST /api/customer-accounts", payload: { account_name: "Acme Foods", ship_to_city: "Fresno", distance_miles_from_plant: 120.0, credit_limit_dollars: 50000.00 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /api/board-grades", payload: { grade_code: "32C", liner_combo: "35/23/35", flute: "C", ect_rating_lbs_per_in: 32, burst_rating_psi: 200, basis_weight_lbs_per_msf: 90.0 }, as: PlantAdmin, captures: { grade_id: $.data.id } }
            - { call: "POST /api/inventory-programs", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", program_name: "Acme RSC program", routing_type: "SLOTTED", blank_width_in: 24.0, blank_length_in: 20.0, reorder_point: 10, replenishment_qty: 500 }, as: SalesRep, captures: { prog_id: $.data.id } }
            - { call: "POST /api/inventory-programs/${prog_id}/receipts", payload: { qty: 100 }, as: ProductionPlanner }
            - { call: "POST /api/inventory-programs/${prog_id}/suspend", payload: {}, as: PlantAdmin }
          trigger:
            - { call: "POST /api/inventory-programs/${prog_id}/release-orders", payload: { qty: 150, requested_ship_date: "2026-08-12" }, as: Customer, as_user_id: "${cust_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_PROGRAM_NOT_RELEASABLE (state, priority 4) — NOT ERR_INSUFFICIENT_PROGRAM_BALANCE (fiscal, priority 9)"
            - "HTTP status == 409"
            - "InventoryProgram.${prog_id}.committed_qty == 0 and on_hand_qty == 100 (no partial mutation)"

      - name: order_create_safety_ect_beats_constraint_supplier
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_ECT_SPEC_NOT_MET]
          - errors[ERR_SUPPLIER_REQUIRED]
        distinguishing_aspect: |
          Category pair = business_safety vs business_constraint (different pair from instance 1):
          one request violates both the ECT safety spec (min_ect 99 > grade ect 32) and the conditional
          supplier constraint (SHEET_FEEDER without sheet_supplier_name); ERR_ECT_SPEC_NOT_MET wins.
        test_recipe:
          setup:
            - "Customer Acme and grade 32C (ect_rating 32) exist"
          setup_api_calls:
            - { call: "POST /api/customer-accounts", payload: { account_name: "Acme Foods", ship_to_city: "Fresno", distance_miles_from_plant: 120.0, credit_limit_dollars: 50000.00 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /api/board-grades", payload: { grade_code: "32C", liner_combo: "35/23/35", flute: "C", ect_rating_lbs_per_in: 32, burst_rating_psi: 200, basis_weight_lbs_per_msf: 90.0 }, as: PlantAdmin, captures: { grade_id: $.data.id } }
          trigger:
            - { call: "POST /api/box-orders", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", routing_type: "SLOTTED", board_source: "SHEET_FEEDER", quantity: 100, blank_width_in: 10.0, blank_length_in: 10.0, min_ect_required: 99 }, as: SalesRep, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_ECT_SPEC_NOT_MET (business_safety, priority 5) — NOT ERR_SUPPLIER_REQUIRED (business_constraint, priority 6)"
            - "HTTP status == 422"
            - "No BoxOrder is persisted (subsequent GET /api/box-orders returns total_count == 0)"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: freight_tier_boundary_at_exactly_150_miles
        grounds:
          - calculations.freight_tiered_pricing
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Metric = distance miles on POST /api/box-orders/{id}/quotes: 150.00 mi is LOCAL (<= 150.00
          boundary inclusive) while 150.01 mi is REGIONAL — same order spec yields freight 60.00 vs 106.67.
        test_recipe:
          setup:
            - "Customer C-150 at exactly 150.00 mi and customer C-151 at 150.01 mi; grade 32C"
            - "Identical orders on each: SLOTTED INTERNAL 24x20 qty 1000, no inks, unit price 50.00"
          setup_api_calls:
            - { call: "POST /api/customer-accounts", payload: { account_name: "Cinder Freight", ship_to_city: "Modesto", distance_miles_from_plant: 150.00, credit_limit_dollars: 50000.00 }, as: SalesRep, captures: { cust_150: $.data.id } }
            - { call: "POST /api/customer-accounts", payload: { account_name: "Edge Logistics", ship_to_city: "Merced", distance_miles_from_plant: 150.01, credit_limit_dollars: 50000.00 }, as: SalesRep, captures: { cust_151: $.data.id } }
            - { call: "POST /api/board-grades", payload: { grade_code: "32C", liner_combo: "35/23/35", flute: "C", ect_rating_lbs_per_in: 32, burst_rating_psi: 200, basis_weight_lbs_per_msf: 90.0 }, as: PlantAdmin, captures: { grade_id: $.data.id } }
            - { call: "POST /api/box-orders", payload: { customer_id: "${cust_150}", board_grade_id: "${grade_id}", routing_type: "SLOTTED", board_source: "INTERNAL", quantity: 1000, blank_width_in: 24.0, blank_length_in: 20.0, min_ect_required: 30, ink_colors: [] }, as: SalesRep, captures: { ord_150: $.data.id, v_150: $.data.version } }
            - { call: "POST /api/box-orders", payload: { customer_id: "${cust_151}", board_grade_id: "${grade_id}", routing_type: "SLOTTED", board_source: "INTERNAL", quantity: 1000, blank_width_in: 24.0, blank_length_in: 20.0, min_ect_required: 30, ink_colors: [] }, as: SalesRep, captures: { ord_151: $.data.id, v_151: $.data.version } }
          trigger:
            - { call: "POST /api/box-orders/${ord_150}/quotes", payload: { unit_price_per_msf: 50.00, expires_on: "2026-12-31", expected_order_version: "${v_150}" }, as: SalesRep, captures: { tier_150: $.data.freight_tier, fr_150: $.data.freight_charge_dollars, tot_150: $.data.quote_total_dollars } }
            - { call: "POST /api/box-orders/${ord_151}/quotes", payload: { unit_price_per_msf: 50.00, expires_on: "2026-12-31", expected_order_version: "${v_151}" }, as: SalesRep, captures: { tier_151: $.data.freight_tier, fr_151: $.data.freight_charge_dollars, tot_151: $.data.quote_total_dollars } }
          assert:
            - "At 150.00 mi: freight_tier == LOCAL, freight_charge_dollars == 60.00, quote_total_dollars == 226.67"
            - "At 150.01 mi: freight_tier == REGIONAL, freight_charge_dollars == 106.67, quote_total_dollars == 273.34"
            - "The <= 150.00 boundary is inclusive of LOCAL (not <)"

      - name: release_qty_equal_to_available_boundary
        grounds:
          - calculations.program_balance_rollup
          - validations[priority=9]
          - errors[ERR_INSUFFICIENT_PROGRAM_BALANCE]
        distinguishing_aspect: |
          Metric = release quantity on POST /api/inventory-programs/{id}/release-orders (different metric
          and endpoint from instance 1): qty exactly equal to available_qty (400) is accepted leaving
          available 0, and the very next qty of 1 is rejected — the <= comparison is inclusive.
        test_recipe:
          setup:
            - "Customer Acme; program stocked to on_hand 400 (available 400)"
          setup_api_calls:
            - { call: "POST /api/customer-accounts", payload: { account_name: "Acme Foods", ship_to_city: "Fresno", distance_miles_from_plant: 120.0, credit_limit_dollars: 50000.00 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /api/board-grades", payload: { grade_code: "32C", liner_combo: "35/23/35", flute: "C", ect_rating_lbs_per_in: 32, burst_rating_psi: 200, basis_weight_lbs_per_msf: 90.0 }, as: PlantAdmin, captures: { grade_id: $.data.id } }
            - { call: "POST /api/inventory-programs", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", program_name: "Acme RSC program", routing_type: "SLOTTED", blank_width_in: 24.0, blank_length_in: 20.0, reorder_point: 10, replenishment_qty: 500 }, as: SalesRep, captures: { prog_id: $.data.id } }
            - { call: "POST /api/inventory-programs/${prog_id}/receipts", payload: { qty: 400 }, as: ProductionPlanner }
          trigger:
            - { call: "POST /api/inventory-programs/${prog_id}/release-orders", payload: { qty: 400, requested_ship_date: "2026-08-12" }, as: Customer, as_user_id: "${cust_id}", captures: { rel_id: $.data.id } }
            - { call: "POST /api/inventory-programs/${prog_id}/release-orders", payload: { qty: 1, requested_ship_date: "2026-08-12" }, as: Customer, as_user_id: "${cust_id}", captures: { err: $.data.error_id } }
          assert:
            - "Release of exactly 400 succeeds: ReleaseOrder.${rel_id}.status == PENDING"
            - "InventoryProgram.${prog_id}.available_qty == 0 and committed_qty == 400 (equality passed)"
            - "Follow-up release of 1 fails: err == ERR_INSUFFICIENT_PROGRAM_BALANCE, HTTP 422"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: release_approve_blocked_while_program_suspended
        grounds:
          - state_machines.ReleaseOrder.PENDING_to_APPROVED
          - state_machines.InventoryProgram.ACTIVE_to_SUSPENDED
          - errors[ERR_PROGRAM_NOT_RELEASABLE]
        distinguishing_aspect: |
          Entity pair = ReleaseOrder -> InventoryProgram: the approve transition's valid firing depends
          on the parent program's status — SUSPENDED blocks it with ERR_PROGRAM_NOT_RELEASABLE, and
          reactivate makes the very same call succeed without touching the release itself.
        test_recipe:
          setup:
            - "Customer Acme; program stocked to 100; release of 10 created (PENDING); program then SUSPENDED"
          setup_api_calls:
            - { call: "POST /api/customer-accounts", payload: { account_name: "Acme Foods", ship_to_city: "Fresno", distance_miles_from_plant: 120.0, credit_limit_dollars: 50000.00 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /api/board-grades", payload: { grade_code: "32C", liner_combo: "35/23/35", flute: "C", ect_rating_lbs_per_in: 32, burst_rating_psi: 200, basis_weight_lbs_per_msf: 90.0 }, as: PlantAdmin, captures: { grade_id: $.data.id } }
            - { call: "POST /api/inventory-programs", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", program_name: "Acme RSC program", routing_type: "SLOTTED", blank_width_in: 24.0, blank_length_in: 20.0, reorder_point: 10, replenishment_qty: 500 }, as: SalesRep, captures: { prog_id: $.data.id } }
            - { call: "POST /api/inventory-programs/${prog_id}/receipts", payload: { qty: 100 }, as: ProductionPlanner }
            - { call: "POST /api/inventory-programs/${prog_id}/release-orders", payload: { qty: 10, requested_ship_date: "2026-08-12" }, as: Customer, as_user_id: "${cust_id}", captures: { rel_id: $.data.id } }
            - { call: "POST /api/inventory-programs/${prog_id}/suspend", payload: {}, as: PlantAdmin }
          trigger:
            - { call: "POST /api/release-orders/${rel_id}/approve", payload: {}, as: PlantAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /api/inventory-programs/${prog_id}/reactivate", payload: {}, as: PlantAdmin }
            - { call: "POST /api/release-orders/${rel_id}/approve", payload: {}, as: PlantAdmin, captures: { rel_status: $.data.status } }
          assert:
            - "While SUSPENDED: err == ERR_PROGRAM_NOT_RELEASABLE, HTTP 409, release stays PENDING"
            - "After reactivate: the identical approve succeeds and ReleaseOrder.${rel_id}.status == APPROVED"

      - name: booking_blocked_when_work_shift_cancelled
        grounds:
          - state_machines.BoxOrder.AWAITING_CONVERTING_to_DIE_CUT_QUEUED
          - state_machines.WorkShift.OPEN_to_CANCELLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Entity pair = ConvertingBooking -> WorkShift (different pair from instance 1's
          ReleaseOrder -> InventoryProgram): booking creation requires the shift OPEN; a CANCELLED
          shift rejects the booking with ERR_INVALID_STATE even though the order itself is correctly
          AWAITING_CONVERTING.
        test_recipe:
          setup:
            - "ORD-1 (DIE_CUT INTERNAL) run through the corrugator to AWAITING_CONVERTING"
            - "A DIE_CUTTER shift exists and is then cancelled"
          setup_api_calls:
            - { call: "POST /api/customer-accounts", payload: { account_name: "Acme Foods", ship_to_city: "Fresno", distance_miles_from_plant: 120.0, credit_limit_dollars: 50000.00 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /api/board-grades", payload: { grade_code: "32C", liner_combo: "35/23/35", flute: "C", ect_rating_lbs_per_in: 32, burst_rating_psi: 200, basis_weight_lbs_per_msf: 90.0 }, as: PlantAdmin, captures: { grade_id: $.data.id } }
            - { call: "POST /api/box-orders", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", routing_type: "DIE_CUT", board_source: "INTERNAL", quantity: 2000, blank_width_in: 29.0, blank_length_in: 36.0, min_ect_required: 32, ink_colors: ["BLACK", "RED"] }, as: SalesRep, captures: { ord_id: $.data.id, ord_v: $.data.version } }
            - { call: "POST /api/box-orders/${ord_id}/quotes", payload: { unit_price_per_msf: 60.00, expires_on: "2026-12-31", expected_order_version: "${ord_v}" }, as: SalesRep, captures: { quo_id: $.data.id } }
            - { call: "POST /api/price-quotes/${quo_id}/accept", payload: {}, as: SalesRep }
            - { call: "POST /api/work-shifts", payload: { machine_code: "CORRUGATOR", shift_date: "2026-08-10", start_minute: 480, end_minute: 960 }, as: ProductionPlanner, captures: { sh_corr: $.data.id } }
            - { call: "POST /api/corrugator-runs", payload: { work_shift_id: "${sh_corr}", board_grade_id: "${grade_id}", start_minute: 480, end_minute: 720, web_width_in: 87.0 }, as: ProductionPlanner, captures: { run_id: $.data.id } }
            - { call: "POST /api/corrugator-runs/${run_id}/orders", payload: { box_order_id: "${ord_id}", outs: 3 }, as: ProductionPlanner }
            - { call: "POST /api/corrugator-runs/${run_id}/complete", payload: {}, as: ProductionPlanner }
            - { call: "POST /api/work-shifts", payload: { machine_code: "DIE_CUTTER", shift_date: "2026-08-10", start_minute: 480, end_minute: 960 }, as: ProductionPlanner, captures: { sh_die: $.data.id } }
            - { call: "POST /api/work-shifts/${sh_die}/cancel", payload: {}, as: ProductionPlanner }
          trigger:
            - { call: "POST /api/converting-bookings", payload: { box_order_id: "${ord_id}", work_shift_id: "${sh_die}", start_minute: 480, end_minute: 600 }, as: ProductionPlanner, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE, HTTP 409 — the CANCELLED shift gates booking creation"
            - "BoxOrder.${ord_id}.status remains AWAITING_CONVERTING (no partial mutation)"
            - "GET /api/converting-bookings?box_order_id=${ord_id} returns total_count == 0"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics/resources)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: corrugator_run_half_open_pairwise_overlap_with_adjacency_allowed
        grounds:
          - validations[priority=8]
          - errors[ERR_RUN_WINDOW_OVERLAP]
          - entities.CorrugatorRun
        distinguishing_aspect: |
          Resource = CORRUGATOR shift; interval semantics = pairwise half-open [start, end) with
          adjacency allowed: [720,900) right after [480,720) is accepted (touching endpoints do not
          overlap), while [700,800) collides with both neighbors and is rejected.
        test_recipe:
          setup:
            - "Grade 32C and a CORRUGATOR shift [480,960); RUN-1 [480,720) already scheduled"
          setup_api_calls:
            - { call: "POST /api/board-grades", payload: { grade_code: "32C", liner_combo: "35/23/35", flute: "C", ect_rating_lbs_per_in: 32, burst_rating_psi: 200, basis_weight_lbs_per_msf: 90.0 }, as: PlantAdmin, captures: { grade_id: $.data.id } }
            - { call: "POST /api/work-shifts", payload: { machine_code: "CORRUGATOR", shift_date: "2026-08-10", start_minute: 480, end_minute: 960 }, as: ProductionPlanner, captures: { sh_corr: $.data.id } }
            - { call: "POST /api/corrugator-runs", payload: { work_shift_id: "${sh_corr}", board_grade_id: "${grade_id}", start_minute: 480, end_minute: 720, web_width_in: 87.0 }, as: ProductionPlanner, captures: { run_1: $.data.id } }
          trigger:
            - { call: "POST /api/corrugator-runs", payload: { work_shift_id: "${sh_corr}", board_grade_id: "${grade_id}", start_minute: 720, end_minute: 900, web_width_in: 87.0 }, as: ProductionPlanner, captures: { run_2: $.data.id } }
            - { call: "POST /api/corrugator-runs", payload: { work_shift_id: "${sh_corr}", board_grade_id: "${grade_id}", start_minute: 700, end_minute: 800, web_width_in: 87.0 }, as: ProductionPlanner, captures: { err: $.data.error_id } }
          assert:
            - "Adjacent run [720,900) is created (CorrugatorRun.${run_2}.status == SCHEDULED) — half-open adjacency is not a conflict"
            - "Overlapping run [700,800) fails: err == ERR_RUN_WINDOW_OVERLAP, HTTP 409"
            - "Shift scheduled_minutes == 420 (240 + 180; the rejected run contributes nothing)"

      - name: converting_booking_append_with_ink_changeover_gap
        grounds:
          - validations[priority=8]
          - errors[ERR_BOOKING_CHANGEOVER_CONFLICT]
          - entities.ConvertingBooking
        distinguishing_aspect: |
          Resource = DIE_CUTTER shift; interval semantics = append-after-latest with an ink-dependent
          buffer (same ink set 15 min, different 45 min) — categorically different from the corrugator's
          pairwise half-open rule: a same-ink booking at exactly prev.end+15 passes, a different-ink
          booking before prev.end+45 fails, and exactly prev.end+45 passes.
        test_recipe:
          setup:
            - "Three DIE_CUT orders (ORD-A inks [BLACK,RED], ORD-B inks [BLACK,RED], ORD-C inks [BLUE]) all attached outs 1 to one run [480,720) on web 87 and advanced to AWAITING_CONVERTING"
            - "DIE_CUTTER shift [480,960); booking for ORD-A at [480,600) already QUEUED"
          setup_api_calls:
            - { call: "POST /api/customer-accounts", payload: { account_name: "Acme Foods", ship_to_city: "Fresno", distance_miles_from_plant: 120.0, credit_limit_dollars: 50000.00 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /api/board-grades", payload: { grade_code: "32C", liner_combo: "35/23/35", flute: "C", ect_rating_lbs_per_in: 32, burst_rating_psi: 200, basis_weight_lbs_per_msf: 90.0 }, as: PlantAdmin, captures: { grade_id: $.data.id } }
            - { call: "POST /api/box-orders", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", routing_type: "DIE_CUT", board_source: "INTERNAL", quantity: 2000, blank_width_in: 29.0, blank_length_in: 36.0, min_ect_required: 32, ink_colors: ["BLACK", "RED"] }, as: SalesRep, captures: { ord_a: $.data.id, ord_a_v: $.data.version } }
            - { call: "POST /api/box-orders/${ord_a}/quotes", payload: { unit_price_per_msf: 60.00, expires_on: "2026-12-31", expected_order_version: "${ord_a_v}" }, as: SalesRep, captures: { quo_a: $.data.id } }
            - { call: "POST /api/price-quotes/${quo_a}/accept", payload: {}, as: SalesRep }
            - { call: "POST /api/box-orders", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", routing_type: "DIE_CUT", board_source: "INTERNAL", quantity: 1000, blank_width_in: 29.0, blank_length_in: 36.0, min_ect_required: 32, ink_colors: ["BLACK", "RED"] }, as: SalesRep, captures: { ord_b: $.data.id, ord_b_v: $.data.version } }
            - { call: "POST /api/box-orders/${ord_b}/quotes", payload: { unit_price_per_msf: 60.00, expires_on: "2026-12-31", expected_order_version: "${ord_b_v}" }, as: SalesRep, captures: { quo_b: $.data.id } }
            - { call: "POST /api/price-quotes/${quo_b}/accept", payload: {}, as: SalesRep }
            - { call: "POST /api/box-orders", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", routing_type: "DIE_CUT", board_source: "INTERNAL", quantity: 1000, blank_width_in: 29.0, blank_length_in: 36.0, min_ect_required: 32, ink_colors: ["BLUE"] }, as: SalesRep, captures: { ord_c: $.data.id, ord_c_v: $.data.version } }
            - { call: "POST /api/box-orders/${ord_c}/quotes", payload: { unit_price_per_msf: 60.00, expires_on: "2026-12-31", expected_order_version: "${ord_c_v}" }, as: SalesRep, captures: { quo_c: $.data.id } }
            - { call: "POST /api/price-quotes/${quo_c}/accept", payload: {}, as: SalesRep }
            - { call: "POST /api/work-shifts", payload: { machine_code: "CORRUGATOR", shift_date: "2026-08-10", start_minute: 480, end_minute: 960 }, as: ProductionPlanner, captures: { sh_corr: $.data.id } }
            - { call: "POST /api/corrugator-runs", payload: { work_shift_id: "${sh_corr}", board_grade_id: "${grade_id}", start_minute: 480, end_minute: 720, web_width_in: 87.0 }, as: ProductionPlanner, captures: { run_id: $.data.id } }
            - { call: "POST /api/corrugator-runs/${run_id}/orders", payload: { box_order_id: "${ord_a}", outs: 1 }, as: ProductionPlanner }
            - { call: "POST /api/corrugator-runs/${run_id}/orders", payload: { box_order_id: "${ord_b}", outs: 1 }, as: ProductionPlanner }
            - { call: "POST /api/corrugator-runs/${run_id}/orders", payload: { box_order_id: "${ord_c}", outs: 1 }, as: ProductionPlanner }
            - { call: "POST /api/corrugator-runs/${run_id}/complete", payload: {}, as: ProductionPlanner }
            - { call: "POST /api/work-shifts", payload: { machine_code: "DIE_CUTTER", shift_date: "2026-08-10", start_minute: 480, end_minute: 960 }, as: ProductionPlanner, captures: { sh_die: $.data.id } }
            - { call: "POST /api/converting-bookings", payload: { box_order_id: "${ord_a}", work_shift_id: "${sh_die}", start_minute: 480, end_minute: 600 }, as: ProductionPlanner, captures: { bk_a: $.data.id } }
          trigger:
            - { call: "POST /api/converting-bookings", payload: { box_order_id: "${ord_b}", work_shift_id: "${sh_die}", start_minute: 615, end_minute: 720 }, as: ProductionPlanner, captures: { bk_b: $.data.id } }
            - { call: "POST /api/converting-bookings", payload: { box_order_id: "${ord_c}", work_shift_id: "${sh_die}", start_minute: 730, end_minute: 800 }, as: ProductionPlanner, captures: { err: $.data.error_id } }
            - { call: "POST /api/converting-bookings", payload: { box_order_id: "${ord_c}", work_shift_id: "${sh_die}", start_minute: 765, end_minute: 840 }, as: ProductionPlanner, captures: { bk_c: $.data.id } }
          assert:
            - "Same-ink booking at exactly 615 (600 + 15) succeeds: ConvertingBooking.${bk_b}.status == QUEUED with ink_colors [BLACK, RED]"
            - "Different-ink booking at 730 (< 720 + 45) fails: err == ERR_BOOKING_CHANGEOVER_CONFLICT, HTTP 409"
            - "Different-ink booking at exactly 765 (720 + 45) succeeds: ConvertingBooking.${bk_c}.status == QUEUED with ink_colors [BLUE]"
            - "Shift scheduled_minutes == 120 + 105 + 75 == 300"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: program_stock_conserved_across_release_create_and_cancel
        grounds:
          - calculations.program_balance_rollup
          - state_machines.ReleaseOrder.PENDING_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity = program stock units: at every step
          on_hand_qty == available_qty + committed_qty (400 == 400+0, 400 == 250+150, 400 == 400+0);
          the forward action (release create) and its compensation (release cancel) leave on_hand
          untouched at 400.
        test_recipe:
          setup:
            - "Customer Acme; program stocked to on_hand 400"
          setup_api_calls:
            - { call: "POST /api/customer-accounts", payload: { account_name: "Acme Foods", ship_to_city: "Fresno", distance_miles_from_plant: 120.0, credit_limit_dollars: 50000.00 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /api/board-grades", payload: { grade_code: "32C", liner_combo: "35/23/35", flute: "C", ect_rating_lbs_per_in: 32, burst_rating_psi: 200, basis_weight_lbs_per_msf: 90.0 }, as: PlantAdmin, captures: { grade_id: $.data.id } }
            - { call: "POST /api/inventory-programs", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", program_name: "Acme RSC program", routing_type: "SLOTTED", blank_width_in: 24.0, blank_length_in: 20.0, reorder_point: 10, replenishment_qty: 500 }, as: SalesRep, captures: { prog_id: $.data.id } }
            - { call: "POST /api/inventory-programs/${prog_id}/receipts", payload: { qty: 400 }, as: ProductionPlanner, captures: { p0_on: $.data.on_hand_qty, p0_com: $.data.committed_qty, p0_av: $.data.available_qty } }
          trigger:
            - { call: "POST /api/inventory-programs/${prog_id}/release-orders", payload: { qty: 150, requested_ship_date: "2026-08-12" }, as: Customer, as_user_id: "${cust_id}", captures: { rel_id: $.data.id } }
            - { call: "POST /api/release-orders/${rel_id}/cancel", payload: {}, as: Customer, as_user_id: "${cust_id}", captures: { rel_status: $.data.status } }
          assert:
            - "After receipt: on_hand 400 == available 400 + committed 0"
            - "After release create: on_hand 400 == available 250 + committed 150 (GET /api/inventory-programs/${prog_id})"
            - "After cancel: ReleaseOrder.${rel_id}.status == CANCELLED and on_hand 400 == available 400 + committed 0"
            - "on_hand_qty never moved (400) across create+cancel — the pair compensates exactly"

      - name: shift_minutes_conserved_across_run_schedule_and_cancel
        grounds:
          - calculations.shift_capacity_rollup
          - state_machines.CorrugatorRun.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity = machine minutes (different quantity from instance 1's stock units):
          capacity_minutes == scheduled_minutes + available_minutes (480 == 0+480, 480 == 240+240,
          480 == 0+480) across the forward action (run create) and its compensation (run cancel).
        test_recipe:
          setup:
            - "Grade 32C; CORRUGATOR shift [480,960) -> capacity 480"
          setup_api_calls:
            - { call: "POST /api/board-grades", payload: { grade_code: "32C", liner_combo: "35/23/35", flute: "C", ect_rating_lbs_per_in: 32, burst_rating_psi: 200, basis_weight_lbs_per_msf: 90.0 }, as: PlantAdmin, captures: { grade_id: $.data.id } }
            - { call: "POST /api/work-shifts", payload: { machine_code: "CORRUGATOR", shift_date: "2026-08-10", start_minute: 480, end_minute: 960 }, as: ProductionPlanner, captures: { sh_corr: $.data.id } }
          trigger:
            - { call: "POST /api/corrugator-runs", payload: { work_shift_id: "${sh_corr}", board_grade_id: "${grade_id}", start_minute: 480, end_minute: 720, web_width_in: 87.0 }, as: ProductionPlanner, captures: { run_id: $.data.id } }
            - { call: "POST /api/corrugator-runs/${run_id}/cancel", payload: {}, as: ProductionPlanner, captures: { run_status: $.data.status } }
          assert:
            - "At creation: capacity 480 == scheduled 0 + available 480"
            - "After run create: capacity 480 == scheduled 240 + available 240 (GET /api/work-shifts/${sh_corr})"
            - "After run cancel: CorrugatorRun.${run_id}.status == CANCELLED and capacity 480 == scheduled 0 + available 480"
            - "capacity_minutes is invariant (480) — schedule+cancel conserve it exactly"
