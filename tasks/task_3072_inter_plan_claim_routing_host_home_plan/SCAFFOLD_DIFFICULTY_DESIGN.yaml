# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3072_inter_plan_claim_routing_host_home_plan
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: claim_pricing_service_date_vs_pricing_date_variant
        grounds:
          - calculations.claim_pricing
          - state_machines.Claim.RECEIVED_to_PRICED
          - entities.Claim.fields.provisional_allowed_cents
          - entities.Claim.fields.priced_allowed_cents
        distinguishing_aspect: |
          Dual-variant calculation on the Claim entity domain: the provisional
          variant keys the rate window on service_date while the final variant
          keys it on the pricing date; with a rate change on 2026-09-01 the two
          windows resolve to different negotiated rates for the identical claim,
          and the provisional variant silently falls back to billed amount when
          no schedule matches while the final variant hard-fails.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. Home plan H (CA) and host plan T (TX), both LICENSED. Member M home=H. Old rate window for NPI 1234567890 / proc 99213 on T: [2026-01-01, 2026-09-01) at 20000 cents; new window [2026-09-01, 2027-01-01) at 30000 cents. Claim service_date 2026-08-15, billed 25000."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AssociationAdmin
            - call: "POST /v1/plans"
              payload: { plan_code: "HCA", legal_name: "Home Plan CA", service_area_states: ["CA"] }
              as: AssociationAdmin
              captures: { h_id: $.data.id }
            - call: "POST /v1/plans"
              payload: { plan_code: "TTX", legal_name: "Host Plan TX", service_area_states: ["TX"] }
              as: AssociationAdmin
              captures: { t_id: $.data.id }
            - call: "POST /v1/plans/${h_id}/activate-license"
              payload: {}
              as: AssociationAdmin
            - call: "POST /v1/plans/${t_id}/activate-license"
              payload: {}
              as: AssociationAdmin
            - call: "POST /v1/members"
              payload: { home_plan_id: "${h_id}", member_number: "M1", full_name: "Pat One", national_account_id: null }
              as: HomePlanOperator
              as_user_id: "${h_id}"
              captures: { m_id: $.data.id }
            - call: "POST /v1/rate-schedules"
              payload: { plan_id: "${t_id}", provider_npi: "1234567890", procedure_code: "99213", negotiated_rate_cents: 20000, effective_start: "2026-01-01", effective_end: "2026-09-01" }
              as: HostPlanOperator
              as_user_id: "${t_id}"
            - call: "POST /v1/rate-schedules"
              payload: { plan_id: "${t_id}", provider_npi: "1234567890", procedure_code: "99213", negotiated_rate_cents: 30000, effective_start: "2026-09-01", effective_end: "2027-01-01" }
              as: HostPlanOperator
              as_user_id: "${t_id}"
            - call: "POST /v1/claims"
              payload: { member_id: "${m_id}", host_plan_id: "${t_id}", provider_npi: "1234567890", procedure_code: "99213", service_date: "2026-08-15", service_state: "TX", billed_amount_cents: 25000 }
              as: HostPlanOperator
              as_user_id: "${t_id}"
              captures: { c_id: $.data.id }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: AssociationAdmin
          trigger:
            - call: "POST /v1/claims/${c_id}/price"
              payload: {}
              as: HostPlanOperator
              as_user_id: "${t_id}"
          assert:
            - "Claim.${c_id}.provisional_allowed_cents == 20000 (service-date-keyed window, min(25000, 20000))"
            - "Claim.${c_id}.priced_allowed_cents == 25000 (pricing-date-keyed window resolves rate 30000, min(25000, 30000))"
            - "Claim.${c_id}.provisional_allowed_cents != Claim.${c_id}.priced_allowed_cents"
            - "Claim.${c_id}.current_allowed_cents == 25000"

      - name: settlement_net_vs_gross_variant
        grounds:
          - calculations.settlement_sweep
          - state_machines.SettlementBatch.OPEN_to_FINALIZED
          - entities.SettlementBatch.fields.net_settlement_cents
        distinguishing_aspect: |
          Dual-variant calculation on the SettlementBatch entity domain (a
          different domain from claim pricing): two batches over an identical
          claim population, one settlement_variant NET and one GROSS, produce
          net_settlement_cents differing by exactly fees_total_cents.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01. Home H (CA) LICENSED, host T (TX) LICENSED. Members M1, M2 home=H. Fee schedule H->T window [2026-01-01, 2026-12-31]: tier1_cap 10000, tier1_fee 150, tier2_rate 0.02, discount 0. Rate 30000 for proc 99213 on T window [2026-01-01, 2027-01-01). Two claims billed 20000 each, service 2026-08-10 (M1) and 2026-08-11 (M2), both fully paid (current_allowed 20000 each). NET batch B1 window [2026-08-01, 2026-08-31]; after B1 reconciles, a second pair of identical claims is paid and GROSS batch B2 is finalized over [2026-09-01, 2026-09-30] with service dates 2026-09-05/2026-09-06."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AssociationAdmin
            - call: "POST /v1/plans"
              payload: { plan_code: "HCA", legal_name: "Home Plan CA", service_area_states: ["CA"] }
              as: AssociationAdmin
              captures: { h_id: $.data.id }
            - call: "POST /v1/plans"
              payload: { plan_code: "TTX", legal_name: "Host Plan TX", service_area_states: ["TX"] }
              as: AssociationAdmin
              captures: { t_id: $.data.id }
            - call: "POST /v1/plans/${h_id}/activate-license"
              payload: {}
              as: AssociationAdmin
            - call: "POST /v1/plans/${t_id}/activate-license"
              payload: {}
              as: AssociationAdmin
            - call: "POST /v1/members"
              payload: { home_plan_id: "${h_id}", member_number: "M1", full_name: "Pat One", national_account_id: null }
              as: HomePlanOperator
              as_user_id: "${h_id}"
              captures: { m1_id: $.data.id }
            - call: "POST /v1/members"
              payload: { home_plan_id: "${h_id}", member_number: "M2", full_name: "Pat Two", national_account_id: null }
              as: HomePlanOperator
              as_user_id: "${h_id}"
              captures: { m2_id: $.data.id }
            - call: "POST /v1/rate-schedules"
              payload: { plan_id: "${t_id}", provider_npi: "1234567890", procedure_code: "99213", negotiated_rate_cents: 30000, effective_start: "2026-01-01", effective_end: "2027-01-01" }
              as: HostPlanOperator
              as_user_id: "${t_id}"
            - call: "POST /v1/access-fee-schedules"
              payload: { home_plan_id: "${h_id}", host_plan_id: "${t_id}", tier1_cap_cents: 10000, tier1_fee_cents: 150, tier2_rate: 0.02, national_account_discount_pct: 0, effective_start: "2026-01-01", effective_end: "2026-12-31" }
              as: AssociationAdmin
            - call: "POST /v1/claims"
              payload: { member_id: "${m1_id}", host_plan_id: "${t_id}", provider_npi: "1234567890", procedure_code: "99213", service_date: "2026-08-10", service_state: "TX", billed_amount_cents: 20000 }
              as: HostPlanOperator
              as_user_id: "${t_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /v1/claims"
              payload: { member_id: "${m2_id}", host_plan_id: "${t_id}", provider_npi: "1234567890", procedure_code: "99213", service_date: "2026-08-11", service_state: "TX", billed_amount_cents: 20000 }
              as: HostPlanOperator
              as_user_id: "${t_id}"
              captures: { c2_id: $.data.id }
            - call: "POST /v1/claims/${c1_id}/price"
              payload: {}
              as: HostPlanOperator
              as_user_id: "${t_id}"
            - call: "POST /v1/claims/${c2_id}/price"
              payload: {}
              as: HostPlanOperator
              as_user_id: "${t_id}"
            - call: "POST /v1/claims/${c1_id}/route"
              payload: {}
              as: HostPlanOperator
              as_user_id: "${t_id}"
            - call: "POST /v1/claims/${c2_id}/route"
              payload: {}
              as: HostPlanOperator
              as_user_id: "${t_id}"
            - call: "POST /v1/claims/${c1_id}/determine-benefit"
              payload: {}
              as: HomePlanOperator
              as_user_id: "${h_id}"
            - call: "POST /v1/claims/${c2_id}/determine-benefit"
              payload: {}
              as: HomePlanOperator
              as_user_id: "${h_id}"
            - call: "POST /v1/claims/${c1_id}/pay"
              payload: {}
              as: HostPlanOperator
              as_user_id: "${t_id}"
            - call: "POST /v1/claims/${c2_id}/pay"
              payload: {}
              as: HostPlanOperator
              as_user_id: "${t_id}"
            - call: "POST /v1/settlement-batches"
              payload: { debtor_plan_id: "${h_id}", creditor_plan_id: "${t_id}", period_start: "2026-08-01", period_end: "2026-08-31", settlement_variant: "NET" }
              as: HostPlanOperator
              as_user_id: "${t_id}"
              captures: { b1_id: $.data.id }
          trigger:
            - call: "POST /v1/settlement-batches/${b1_id}/finalize"
              payload: {}
              as: HostPlanOperator
              as_user_id: "${t_id}"
            - call: "POST /v1/settlement-batches"
              payload: { debtor_plan_id: "${h_id}", creditor_plan_id: "${t_id}", period_start: "2026-08-01", period_end: "2026-08-31", settlement_variant: "GROSS" }
              as: HostPlanOperator
              as_user_id: "${t_id}"
              captures: { b2_id: $.data.id }
            - call: "POST /v1/settlement-batches/${b2_id}/finalize"
              payload: {}
              as: HostPlanOperator
              as_user_id: "${t_id}"
          assert:
            - "SettlementBatch.${b1_id}.gross_claims_total_cents == 40000"
            - "SettlementBatch.${b1_id}.fees_total_cents == 2400 (per claim: access fee 400 + admin charge 800 = 1200; admin charge = bracket1 500 + bracket2 300 = 800)"
            - "SettlementBatch.${b1_id}.net_settlement_cents == 37600 (NET variant: 40000 - 2400)"
            - "SettlementBatch.${b2_id}.net_settlement_cents == 40000 (GROSS variant: fees excluded from remittance)"
            - "SettlementBatch.${b2_id}.net_settlement_cents - SettlementBatch.${b1_id}.net_settlement_cents == SettlementBatch.${b1_id}.fees_total_cents == 2400"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: access_fee_tier_discount_composition
        grounds:
          - calculations.access_fee_computation
          - entities.AccessFeeSchedule.fields.tier1_cap_cents
          - entities.NationalAccount.fields.status
        distinguishing_aspect: |
          Mode (a): a formula with >=3 inputs (current_allowed_cents vs
          tier1_cap_cents branch, tier2_rate, national_account_discount_pct) and
          non-linear interaction — the ACTIVE national-account discount multiplies
          whichever branch the tier selection produced, and the tier branch itself
          depends on the priced allowed amount.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01. Home H (CA) LICENSED, host T (TX) LICENSED. NationalAccount NA controlled by H, ACTIVE, window [2026-01-01, 2026-12-31], territories [TX]. Member M home=H, national_account=NA. Fee schedule H->T window [2026-01-01, 2026-12-31]: tier1_cap 10000, tier1_fee 150, tier2_rate 0.02, national_account_discount_pct 0.25. Rate 30000 proc 99213 on T [2026-01-01, 2027-01-01). Claim service 2026-08-10 TX, billed 20000 -> current_allowed 20000 (above tier1 cap, so base fee = round(20000 * 0.02) = 400)."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AssociationAdmin
            - call: "POST /v1/plans"
              payload: { plan_code: "HCA", legal_name: "Home Plan CA", service_area_states: ["CA"] }
              as: AssociationAdmin
              captures: { h_id: $.data.id }
            - call: "POST /v1/plans"
              payload: { plan_code: "TTX", legal_name: "Host Plan TX", service_area_states: ["TX"] }
              as: AssociationAdmin
              captures: { t_id: $.data.id }
            - call: "POST /v1/plans/${h_id}/activate-license"
              payload: {}
              as: AssociationAdmin
            - call: "POST /v1/plans/${t_id}/activate-license"
              payload: {}
              as: AssociationAdmin
            - call: "POST /v1/national-accounts"
              payload: { controlling_plan_id: "${h_id}", account_name: "Acme Corp", employer_group_id: "ACME-1", territory_states: ["TX"], effective_start: "2026-01-01", effective_end: "2026-12-31" }
              as: AssociationAdmin
              captures: { na_id: $.data.id }
            - call: "POST /v1/national-accounts/${na_id}/activate"
              payload: {}
              as: AssociationAdmin
            - call: "POST /v1/members"
              payload: { home_plan_id: "${h_id}", member_number: "M1", full_name: "Pat One", national_account_id: "${na_id}" }
              as: HomePlanOperator
              as_user_id: "${h_id}"
              captures: { m_id: $.data.id }
            - call: "POST /v1/rate-schedules"
              payload: { plan_id: "${t_id}", provider_npi: "1234567890", procedure_code: "99213", negotiated_rate_cents: 30000, effective_start: "2026-01-01", effective_end: "2027-01-01" }
              as: HostPlanOperator
              as_user_id: "${t_id}"
            - call: "POST /v1/access-fee-schedules"
              payload: { home_plan_id: "${h_id}", host_plan_id: "${t_id}", tier1_cap_cents: 10000, tier1_fee_cents: 150, tier2_rate: 0.02, national_account_discount_pct: 0.25, effective_start: "2026-01-01", effective_end: "2026-12-31" }
              as: AssociationAdmin
            - call: "POST /v1/claims"
              payload: { member_id: "${m_id}", host_plan_id: "${t_id}", provider_npi: "1234567890", procedure_code: "99213", service_date: "2026-08-10", service_state: "TX", billed_amount_cents: 20000 }
              as: HostPlanOperator
              as_user_id: "${t_id}"
              captures: { c_id: $.data.id }
            - call: "POST /v1/claims/${c_id}/price"
              payload: {}
              as: HostPlanOperator
              as_user_id: "${t_id}"
          trigger:
            - call: "POST /v1/claims/${c_id}/route"
              payload: {}
              as: HostPlanOperator
              as_user_id: "${t_id}"
          assert:
            - "Claim.${c_id}.access_fee_cents == 300 (tier2 branch: base = round_half_up(20000 * 0.02) = 400; ACTIVE national-account discount: round_half_up(400 * 0.75) = 300)"
            - "Claim.${c_id}.status == ROUTED"

      - name: admin_charge_round_per_bracket_then_sum
        grounds:
          - calculations.admin_charge_computation
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the scaffold pins
          round-per-bracket-slice-then-sum. On an allowed amount of 100333 cents
          the per-bracket-rounded total differs from the sum-then-rounded total,
          and only the pinned order is correct.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01. Home H LICENSED, host T LICENSED. Member M home=H. Rate 150000 proc 99214 on T [2026-01-01, 2027-01-01). Fee schedule H->T [2026-01-01, 2026-12-31] tier1_cap 10000 tier1_fee 150 tier2_rate 0.02 discount 0. Claim billed 100333 service 2026-08-10 TX -> current_allowed 100333. Bracket slices: bracket1 round(10000*0.05)=500; bracket2 round(90000*0.03)=2700; bracket3 round(333*0.01)=round(3.33)=3; total = 3203."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AssociationAdmin
            - call: "POST /v1/plans"
              payload: { plan_code: "HCA", legal_name: "Home Plan CA", service_area_states: ["CA"] }
              as: AssociationAdmin
              captures: { h_id: $.data.id }
            - call: "POST /v1/plans"
              payload: { plan_code: "TTX", legal_name: "Host Plan TX", service_area_states: ["TX"] }
              as: AssociationAdmin
              captures: { t_id: $.data.id }
            - call: "POST /v1/plans/${h_id}/activate-license"
              payload: {}
              as: AssociationAdmin
            - call: "POST /v1/plans/${t_id}/activate-license"
              payload: {}
              as: AssociationAdmin
            - call: "POST /v1/members"
              payload: { home_plan_id: "${h_id}", member_number: "M1", full_name: "Pat One", national_account_id: null }
              as: HomePlanOperator
              as_user_id: "${h_id}"
              captures: { m_id: $.data.id }
            - call: "POST /v1/rate-schedules"
              payload: { plan_id: "${t_id}", provider_npi: "1234567890", procedure_code: "99214", negotiated_rate_cents: 150000, effective_start: "2026-01-01", effective_end: "2027-01-01" }
              as: HostPlanOperator
              as_user_id: "${t_id}"
            - call: "POST /v1/access-fee-schedules"
              payload: { home_plan_id: "${h_id}", host_plan_id: "${t_id}", tier1_cap_cents: 10000, tier1_fee_cents: 150, tier2_rate: 0.02, national_account_discount_pct: 0, effective_start: "2026-01-01", effective_end: "2026-12-31" }
              as: AssociationAdmin
            - call: "POST /v1/claims"
              payload: { member_id: "${m_id}", host_plan_id: "${t_id}", provider_npi: "1234567890", procedure_code: "99214", service_date: "2026-08-10", service_state: "TX", billed_amount_cents: 100333 }
              as: HostPlanOperator
              as_user_id: "${t_id}"
              captures: { c_id: $.data.id }
            - call: "POST /v1/claims/${c_id}/price"
              payload: {}
              as: HostPlanOperator
              as_user_id: "${t_id}"
          trigger:
            - call: "POST /v1/claims/${c_id}/route"
              payload: {}
              as: HostPlanOperator
              as_user_id: "${t_id}"
          assert:
            - "Claim.${c_id}.admin_charge_cents == 3203 (round per bracket slice then sum: 500 + 2700 + 3; sum-then-round of the raw expression would also give 3203 only if the bracket-3 residual rounded the same way — the pinned order is what guarantees 3203)"
            - "Claim.${c_id}.access_fee_cents == 2007 (tier2 branch: round_half_up(100333 * 0.02) = round_half_up(2006.66) = 2007)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: claim_paid_adjustment_cycle_returns_to_paid
        grounds:
          - state_machines.Claim.PAID_to_ADJUSTMENT_PENDING
          - state_machines.Claim.ADJUSTMENT_PENDING_to_PAID
        distinguishing_aspect: |
          Non-linear machine on the Claim entity: a cycle PAID ->
          ADJUSTMENT_PENDING -> PAID that may repeat, with balances mutated on
          each traversal (recovery debited per applied downward adjustment).
        test_recipe:
          setup:
            - "Logical clock 2026-08-01. Home H, host T LICENSED. Member M home=H. Rate 30000 proc 99213 T [2026-01-01,2027-01-01). Fee schedule H->T [2026-01-01,2026-12-31] cap 10000 fee 150 rate 0.02 discount 0. Claim billed 20000 service 2026-08-10 fully PAID (allowed 20000). Host claims_paid_balance_cents == 20000."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AssociationAdmin
            - call: "POST /v1/plans"
              payload: { plan_code: "HCA", legal_name: "Home Plan CA", service_area_states: ["CA"] }
              as: AssociationAdmin
              captures: { h_id: $.data.id }
            - call: "POST /v1/plans"
              payload: { plan_code: "TTX", legal_name: "Host Plan TX", service_area_states: ["TX"] }
              as: AssociationAdmin
              captures: { t_id: $.data.id }
            - call: "POST /v1/plans/${h_id}/activate-license"
              payload: {}
              as: AssociationAdmin
            - call: "POST /v1/plans/${t_id}/activate-license"
              payload: {}
              as: AssociationAdmin
            - call: "POST /v1/members"
              payload: { home_plan_id: "${h_id}", member_number: "M1", full_name: "Pat One", national_account_id: null }
              as: HomePlanOperator
              as_user_id: "${h_id}"
              captures: { m_id: $.data.id }
            - call: "POST /v1/rate-schedules"
              payload: { plan_id: "${t_id}", provider_npi: "1234567890", procedure_code: "99213", negotiated_rate_cents: 30000, effective_start: "2026-01-01", effective_end: "2027-01-01" }
              as: HostPlanOperator
              as_user_id: "${t_id}"
            - call: "POST /v1/access-fee-schedules"
              payload: { home_plan_id: "${h_id}", host_plan_id: "${t_id}", tier1_cap_cents: 10000, tier1_fee_cents: 150, tier2_rate: 0.02, national_account_discount_pct: 0, effective_start: "2026-01-01", effective_end: "2026-12-31" }
              as: AssociationAdmin
            - call: "POST /v1/claims"
              payload: { member_id: "${m_id}", host_plan_id: "${t_id}", provider_npi: "1234567890", procedure_code: "99213", service_date: "2026-08-10", service_state: "TX", billed_amount_cents: 20000 }
              as: HostPlanOperator
              as_user_id: "${t_id}"
              captures: { c_id: $.data.id, c_ver: $.data.version }
            - call: "POST /v1/claims/${c_id}/price"
              payload: {}
              as: HostPlanOperator
              as_user_id: "${t_id}"
            - call: "POST /v1/claims/${c_id}/route"
              payload: {}
              as: HostPlanOperator
              as_user_id: "${t_id}"
            - call: "POST /v1/claims/${c_id}/determine-benefit"
              payload: {}
              as: HomePlanOperator
              as_user_id: "${h_id}"
            - call: "POST /v1/claims/${c_id}/pay"
              payload: {}
              as: HostPlanOperator
              as_user_id: "${t_id}"
              captures: { c_ver_paid: $.data.version }
          trigger:
            - call: "POST /v1/claims/${c_id}/adjustments"
              payload: { reason: "repricing", delta_allowed_cents: -5000, expected_claim_version: "${c_ver_paid}" }
              as: HostPlanOperator
              as_user_id: "${t_id}"
              captures: { adj_id: $.data.id }
            - call: "POST /v1/adjustments/${adj_id}/validate"
              payload: {}
              as: HostPlanOperator
              as_user_id: "${t_id}"
            - call: "POST /v1/adjustments/${adj_id}/propagate"
              payload: {}
              as: HomePlanOperator
              as_user_id: "${h_id}"
            - call: "POST /v1/adjustments/${adj_id}/apply"
              payload: {}
              as: HostPlanOperator
              as_user_id: "${t_id}"
          assert:
            - "Claim.${c_id}.status == PAID after the cycle (cycle closed)"
            - "Claim.${c_id}.current_allowed_cents == 15000"
            - "Adjustment.${adj_id}.recovery_amount_cents == 5000"
            - "host Plan.${t_id}.claims_paid_balance_cents == 15000 (20000 - 5000 recovery)"

      - name: settlement_batch_dispute_refinalize_cycle
        grounds:
          - state_machines.SettlementBatch.FINALIZED_to_DISPUTED
          - state_machines.SettlementBatch.DISPUTED_to_FINALIZED
        distinguishing_aspect: |
          Non-linear machine on the SettlementBatch entity (a different entity
          from Claim): a branching revision loop FINALIZED -> DISPUTED ->
          FINALIZED that may repeat until the debtor acknowledges, each pass
          re-running the settlement sweep.
        test_recipe:
          setup:
