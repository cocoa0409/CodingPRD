# =============================================================================
# task_2587 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Nine §0.5 rule_ids x 2 differentiated instances = 18 instances.
# Every numeric assert below was executed against the §1.3 formulas in Python.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: scope_priority_score_mode_flip_inverts_candidate_ranking
        grounds:
          - calculations.scope_priority_score
          - calculations.scope_priority_rank
          - entities.ScopeItem.fields.priority_score
          - entities.ScopeItem.fields.below_threshold_flag
          - entities.TestPlan.fields.admission_threshold
        distinguishing_aspect: |
          This dual-variant lives in the scope-selection domain (ScopeItem scored against
          TestPlan.admission_threshold): the RISK_DRIVEN and COMPLIANCE_DRIVEN weight vectors
          score the SAME two assets 89.80 / 58.00 and 72.25 / 75.50, so the priority_rank of
          both candidates swaps and asset B's below_threshold_flag flips from true to false.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Asset A: APPLICATION, criticality_tier 1, regimes [SOC2], exposure_score 88, last_tested_at 2025-10-02T00:00:00Z (334 days stale -> staleness_points 91)."
            - "Asset B: CLOUD, criticality_tier 3, regimes [PCI_DSS, HIPAA, SOX], exposure_score 40, last_tested_at null (staleness_points 100, regime_points capped at 100)."
            - "TestPlan 2026 in DRAFT, prioritization_mode RISK_DRIVEN, risk_appetite_score 40 -> admission_threshold 60."
            - "One PROPOSED ScopeItem per asset; under RISK_DRIVEN A scores 89.80 at rank 1 and B scores 58.00 at rank 2 with below_threshold_flag true."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pentest/assets"
              payload: { name: "Payments API", asset_class: "APPLICATION", criticality_tier: 1, compliance_regimes: ["SOC2"], exposure_score: 88, last_tested_at: "2025-10-02T00:00:00Z" }
              as: PlatformAdmin
              captures: { asset_a_id: $.data.id }
            - call: "POST /pentest/assets"
              payload: { name: "Analytics Lake", asset_class: "CLOUD", criticality_tier: 3, compliance_regimes: ["PCI_DSS", "HIPAA", "SOX"], exposure_score: 40 }
              as: PlatformAdmin
              captures: { asset_b_id: $.data.id }
            - call: "POST /pentest/test-plans"
              payload: { fiscal_year: 2026, risk_appetite_score: 40, planned_engagement_count: 5, prioritization_mode: "RISK_DRIVEN" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { plan_id: $.data.id, plan_v1: $.data.version }
            - call: "POST /pentest/scope-items"
              payload: { test_plan_id: "${plan_id}", asset_id: "${asset_a_id}", justification: "Annual coverage of the payments surface", requested_engagement_hours: 120, expected_test_plan_version: "${plan_v1}" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { si_a_id: $.data.id }
            - call: "GET /pentest/test-plans/${plan_id}"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { plan_v2: $.data.version }
            - call: "POST /pentest/scope-items"
              payload: { test_plan_id: "${plan_id}", asset_id: "${asset_b_id}", justification: "Cloud IAM review requested by audit", requested_engagement_hours: 60, expected_test_plan_version: "${plan_v2}" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { si_b_id: $.data.id }
          trigger:
            - call: "GET /pentest/scope-items/${si_a_id}"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { a_score_risk: $.data.priority_score, a_rank_risk: $.data.priority_rank }
            - call: "GET /pentest/scope-items/${si_b_id}"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { b_score_risk: $.data.priority_score, b_rank_risk: $.data.priority_rank, b_flag_risk: $.data.below_threshold_flag }
            - call: "POST /pentest/test-plans/${plan_id}/prioritization-mode"
              payload: { prioritization_mode: "COMPLIANCE_DRIVEN" }
              as: ProgramManager
              as_user_id: "pm-1"
          assert:
            - "${a_score_risk} == 89.80 and ${a_rank_risk} == 1"
            - "${b_score_risk} == 58.00 and ${b_rank_risk} == 2 and ${b_flag_risk} == true"
            - "ScopeItem.${si_a_id}.priority_score == 72.25 after the switch"
            - "ScopeItem.${si_b_id}.priority_score == 75.50 after the switch"
            - "ScopeItem.${si_a_id}.priority_rank == 2 and ScopeItem.${si_b_id}.priority_rank == 1 — the ranking inverted"
            - "ScopeItem.${si_b_id}.below_threshold_flag == false (75.50 >= admission_threshold 60)"
            - "ScopeItem.${si_a_id}.scored_mode == COMPLIANCE_DRIVEN and ScopeItem.${si_b_id}.scored_mode == COMPLIANCE_DRIVEN"
            - "TestPlan.${plan_id}.admission_threshold == 60"

      - name: assurance_score_provisional_and_final_diverge_on_identical_findings
        grounds:
          - calculations.engagement_assurance_score
          - entities.Engagement.fields.provisional_assurance_score
          - entities.Engagement.fields.final_assurance_score
          - state_machines.Engagement.EXECUTING_to_FIELDWORK_COMPLETE
          - state_machines.Engagement.REPORTED_to_CLOSED
        distinguishing_aspect: |
          This dual-variant lives in the engagement-assurance domain, and the two variants diverge
          by INPUT-SET FILTERING plus a closure credit rather than by weight vectors: with one open
          CRITICAL finding and one CLOSED MEDIUM finding, PROVISIONAL scores 70.00 (both deducted)
          while FINAL scores 80.00 (the CLOSED finding is excluded and earns +5 retest credit).
        test_recipe:
          setup:
            - "An EXECUTING, AUTHORIZED engagement on Asset A (tier 1, regimes [SOC2]) with tester t1 provisioned for Asset A, hours_allocated 80."
            - "Finding F1: technical_base_score 8.50, exposure_class PARTNER -> severity_score 9.20, band CRITICAL, 40 points; its CriticalAlert has been acknowledged."
            - "Finding F2: technical_base_score 4.00, exposure_class INTERNAL -> severity_score 4.50, band MEDIUM, 8 points."
            - "F1 is TRIAGED; F2 has been driven all the way to CLOSED through remediation, EVIDENCE_ONLY verification and closure sign-off."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pentest/assets"
              payload: { name: "Payments API", asset_class: "APPLICATION", criticality_tier: 1, compliance_regimes: ["SOC2"], exposure_score: 88, last_tested_at: "2025-10-02T00:00:00Z" }
              as: PlatformAdmin
              captures: { asset_a_id: $.data.id }
            - call: "POST /pentest/test-plans"
              payload: { fiscal_year: 2026, risk_appetite_score: 40, planned_engagement_count: 5, prioritization_mode: "RISK_DRIVEN" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { plan_id: $.data.id, plan_v1: $.data.version }
            - call: "POST /pentest/scope-items"
              payload: { test_plan_id: "${plan_id}", asset_id: "${asset_a_id}", justification: "Annual coverage of the payments surface", requested_engagement_hours: 120, expected_test_plan_version: "${plan_v1}" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { si_a_id: $.data.id }
            - call: "POST /pentest/scope-items/${si_a_id}/decision"
              payload: { decision: "APPROVE", note: "In scope for FY2026" }
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /pentest/test-plans/${plan_id}/activate"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /pentest/engagements"
              payload: { test_plan_id: "${plan_id}", scope_item_id: "${si_a_id}", engagement_type: "APPLICATION_TEST", window_start: "2026-09-05T00:00:00Z", window_end: "2026-09-30T23:59:59Z", hours_allocated: 80 }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { eng_id: $.data.id }
            - call: "POST /pentest/rules-of-engagement"
              payload: { engagement_id: "${eng_id}", exclusions: ["prod-db-01"], allowed_techniques: ["SQLI", "XSS", "AUTHZ_BYPASS"], emergency_stop_procedure: "Halt traffic and call the escalation contact", escalation_contact: "soc@example.com" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { roe_id: $.data.id }
            - call: "POST /pentest/authorized-targets"
              payload: { roe_id: "${roe_id}", asset_id: "${asset_a_id}", window_start: "2026-09-05T00:00:00Z", window_end: "2026-09-30T23:59:59Z", technique_allowlist: ["SQLI", "XSS"] }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { tgt_a_id: $.data.id }
            - call: "POST /pentest/rules-of-engagement/${roe_id}/sign"
              payload: { signature_note: "Authorized for FY2026 window" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /pentest/testers"
              payload: { full_name: "Tester One", certifications: ["OSCP", "GPEN"], clearance_expires_at: "2027-01-01T00:00:00Z", max_concurrent_engagements: 2 }
              as: PlatformAdmin
              captures: { t1_id: $.data.id }
            - call: "POST /pentest/testers/${t1_id}/background-check"
              payload: { result: "CLEARED" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T08:00:00Z" }
              as: PlatformAdmin
            - call: "GET /pentest/engagements/${eng_id}"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { eng_v_a: $.data.version }
            - call: "POST /pentest/tester-assignments"
              payload: { engagement_id: "${eng_id}", tester_id: "${t1_id}", assignment_role: "LEAD", interval_start: "2026-09-07T09:00:00Z", interval_end: "2026-09-14T09:00:00Z", requested_hours: 40, granted_asset_ids: ["${asset_a_id}"], expected_engagement_version: "${eng_v_a}" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { asg1_id: $.data.id }
            - call: "POST /pentest/tester-assignments/${asg1_id}/access"
              payload: { action: "PROVISION" }
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /pentest/engagements/${eng_id}/execution"
              payload: { action: "START" }
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T10:00:00Z" }
              as: PlatformAdmin
            - call: "GET /pentest/engagements/${eng_id}"
              payload: {}
              as: Tester
              as_user_id: "${t1_id}"
              captures: { eng_v_b: $.data.version }
            - call: "POST /pentest/findings"
              payload: { engagement_id: "${eng_id}", asset_id: "${asset_a_id}", title: "Authorization bypass on refund endpoint", reproduction_steps: "1. Authenticate as clerk 2. POST /refunds with another tenant id", business_impact_narrative: "Cross-tenant refunds are possible, exposing card settlement funds", technical_base_score: 8.50, exposure_class: "PARTNER", root_cause_theme: "ACCESS_CONTROL", expected_engagement_version: "${eng_v_b}" }
              as: Tester
              as_user_id: "${t1_id}"
              captures: { f1_id: $.data.id }
            - call: "GET /pentest/critical-alerts"
              payload: { finding_id: "${f1_id}" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { alert1_id: "$.data[0].id" }
            - call: "POST /pentest/critical-alerts/${alert1_id}/acknowledge"
              payload: { containment_action: "Refund endpoint disabled at the gateway" }
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "GET /pentest/engagements/${eng_id}"
              payload: {}
              as: Tester
              as_user_id: "${t1_id}"
              captures: { eng_v_c: $.data.version }
            - call: "POST /pentest/findings"
              payload: { engagement_id: "${eng_id}", asset_id: "${asset_a_id}", title: "Verbose stack traces in error responses", reproduction_steps: "1. POST malformed JSON 2. Observe stack trace in body", business_impact_narrative: "Internal class paths leak, easing further attacks", technical_base_score: 4.00, exposure_class: "INTERNAL", root_cause_theme: "INPUT_VALIDATION", expected_engagement_version: "${eng_v_c}" }
              as: Tester
              as_user_id: "${t1_id}"
              captures: { f2_id: $.data.id }
            - call: "POST /pentest/findings/${f1_id}/triage"
              payload: { action: "ACCEPT", note: "Confirmed by platform team" }
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /pentest/findings/${f2_id}/triage"
              payload: { action: "ACCEPT", note: "Confirmed" }
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /pentest/remediations"
              payload: { finding_id: "${f2_id}", owner_user_id: "owner-1", validation_requirement: "EVIDENCE_ONLY", remediation_plan: "Disable debug error handler in production profile" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { rem2_id: $.data.id }
            - call: "POST /pentest/remediations/${rem2_id}/submit"
              payload: { evidence_uri: "s3://evidence/rem2/config-diff.txt" }
              as: RemediationOwner
              as_user_id: "owner-1"
            - call: "POST /pentest/retest-verifications"
              payload: { remediation_id: "${rem2_id}", evidence_uri: "s3://evidence/rem2/retest.har", outcome: "PASS" }
              as: ComplianceOfficer
              as_user_id: "co-2"
              captures: { rv2_id: $.data.id }
            - call: "POST /pentest/retest-verifications/${rv2_id}/sign-off"
              payload: { closure_note: "Stack traces no longer returned" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /pentest/engagements/${eng_id}/execution"
              payload: { action: "COMPLETE_FIELDWORK" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { prov_score: $.data.provisional_assurance_score }
            - call: "POST /pentest/engagements/${eng_id}/execution"
              payload: { action: "REPORT" }
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /pentest/engagements/${eng_id}/execution"
              payload: { action: "CLOSE" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { final_score: $.data.final_assurance_score }
          assert:
            - "${prov_score} == 70.00 (100.00 - 25 for the CRITICAL F1 - 5 for the CLOSED MEDIUM F2)"
            - "${final_score} == 80.00 (100.00 - 25 for F1, F2 excluded because CLOSED, + retest_credit 5)"
            - "Engagement.${eng_id}.provisional_assurance_score == 70.00 and Engagement.${eng_id}.final_assurance_score == 80.00 — the two variants differ by 10.00 on identical finding data"
            - "Finding.${f1_id}.severity_score == 9.20 and Finding.${f1_id}.severity_band == CRITICAL"
            - "Finding.${f2_id}.severity_score == 4.50 and Finding.${f2_id}.severity_band == MEDIUM and Finding.${f2_id}.status == CLOSED"
            - "Engagement.${eng_id}.execution_state == CLOSED and TestPlan.${plan_id}.status == CLOSED (bubble-up, it was the plan's only engagement)"

  - rule_id: combinatorial_formula
    instances:
      - name: severity_multiplier_binds_only_to_technical_base_score
        grounds:
          - calculations.finding_severity_rating
          - entities.Finding.fields.severity_score
          - entities.Finding.fields.severity_band
          - entities.Finding.fields.severity_points
          - calculations.plan_risk_point_ledger
        distinguishing_aspect: |
          Mode (a): four interacting inputs (technical_base_score, exposure_class, the asset's
          criticality_tier and its regime count) combine non-linearly because EXPOSURE_MULT binds
          to technical_base_score ALONE and the regime term is itself a min(). Mis-associating the
          multiplier over the whole sum yields 10.00 instead of 9.90 for the first finding and 4.47
          instead of 4.50 for the second, so both asserts falsify the wrong grouping.
        test_recipe:
          setup:
            - "Asset A: APPLICATION, criticality_tier 1, compliance_regimes [SOC2], exposure_score 88 -> TIER_BONUS 0.50 and regime bonus min(0.60, 0.20*1) = 0.20."
            - "An EXECUTING, AUTHORIZED engagement on Asset A with tester t1 provisioned and Asset A granted; logical clock at 2026-09-08T10:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pentest/assets"
              payload: { name: "Payments API", asset_class: "APPLICATION", criticality_tier: 1, compliance_regimes: ["SOC2"], exposure_score: 88, last_tested_at: "2025-10-02T00:00:00Z" }
              as: PlatformAdmin
              captures: { asset_a_id: $.data.id }
            - call: "POST /pentest/test-plans"
              payload: { fiscal_year: 2026, risk_appetite_score: 40, planned_engagement_count: 5, prioritization_mode: "RISK_DRIVEN" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { plan_id: $.data.id, plan_v1: $.data.version }
            - call: "POST /pentest/scope-items"
              payload: { test_plan_id: "${plan_id}", asset_id: "${asset_a_id}", justification: "Annual coverage of the payments surface", requested_engagement_hours: 120, expected_test_plan_version: "${plan_v1}" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { si_a_id: $.data.id }
            - call: "POST /pentest/scope-items/${si_a_id}/decision"
              payload: { decision: "APPROVE", note: "In scope for FY2026" }
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /pentest/test-plans/${plan_id}/activate"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /pentest/engagements"
              payload: { test_plan_id: "${plan_id}", scope_item_id: "${si_a_id}", engagement_type: "APPLICATION_TEST", window_start: "2026-09-05T00:00:00Z", window_end: "2026-09-30T23:59:59Z", hours_allocated: 80 }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { eng_id: $.data.id }
            - call: "POST /pentest/rules-of-engagement"
              payload: { engagement_id: "${eng_id}", exclusions: ["prod-db-01"], allowed_techniques: ["SQLI", "XSS", "AUTHZ_BYPASS"], emergency_stop_procedure: "Halt traffic and call the escalation contact", escalation_contact: "soc@example.com" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { roe_id: $.data.id }
            - call: "POST /pentest/authorized-targets"
              payload: { roe_id: "${roe_id}", asset_id: "${asset_a_id}", window_start: "2026-09-05T00:00:00Z", window_end: "2026-09-30T23:59:59Z", technique_allowlist: ["SQLI", "XSS"] }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { tgt_a_id: $.data.id }
            - call: "POST /pentest/rules-of-engagement/${roe_id}/sign"
              payload: { signature_note: "Authorized for FY2026 window" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /pentest/testers"
              payload: { full_name: "Tester One", certifications: ["OSCP", "GPEN"], clearance_expires_at: "2027-01-01T00:00:00Z", max_concurrent_engagements: 2 }
              as: PlatformAdmin
              captures: { t1_id: $.data.id }
            - call: "POST /pentest/testers/${t1_id}/background-check"
              payload: { result: "CLEARED" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T08:00:00Z" }
              as: PlatformAdmin
            - call: "GET /pentest/engagements/${eng_id}"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { eng_v_a: $.data.version }
            - call: "POST /pentest/tester-assignments"
              payload: { engagement_id: "${eng_id}", tester_id: "${t1_id}", assignment_role: "LEAD", interval_start: "2026-09-07T09:00:00Z", interval_end: "2026-09-14T09:00:00Z", requested_hours: 40, granted_asset_ids: ["${asset_a_id}"], expected_engagement_version: "${eng_v_a}" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { asg1_id: $.data.id }
