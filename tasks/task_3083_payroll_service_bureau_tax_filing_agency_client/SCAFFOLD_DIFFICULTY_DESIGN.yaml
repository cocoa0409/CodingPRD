            - call: "POST /payroll-runs/${run_c}/initiate-impound"
              payload: { expected_client_version: "${cl_sh_v3}" }
              as: ClientPayrollAdmin
              as_user_id: "${cl_sh}"
              captures: { imp_c: $.data.id }
            - call: "POST /impounds/${imp_c}/settle"
              payload: {}
              as: BureauTreasury
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-05T00:00:00Z" }
              as: BureauCompliance
            - call: "GET /clients/${cl_sh}"
              payload: {}
              as: BureauCompliance
              captures: { cl_sh_v4: $.data.version }
            - call: "POST /returns"
              payload: { client_id: "${cl_sh}", jurisdiction_id: "${j_ca}", period: "2026-Q3", expected_client_version: "${cl_sh_v4}" }
              as: BureauTaxFiler
              captures: { ret_sh: $.data.id }
          trigger:
            - call: "POST /returns/${ret_sh}/file"
              payload: {}
              as: BureauTaxFiler
              as_user_id: "filer-alpha"
              captures: { liab_sh: $.data.expected_liability_cents, pen_sh: $.data.shortfall_penalty_exposure_cents }
          assert:
            - "liab_sh == 900000  (three SETTLED runs x 300000 — bureau-books variant includes all settled runs)"
            - "pen_sh == 0  (confirmed deposits 300000 >= threshold 250000 — safe harbor applies even though liability exceeds deposits)"
            - "pen_sh != 12000  (a naive (liability - deposits) * tier1 would give (900000-300000)*0.02 = 12000; the pinned evaluation order checks the threshold FIRST)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: registration_rejection_resubmit_cycle
        grounds:
          - state_machines.JurisdictionRegistration.PENDING_to_REJECTED
          - state_machines.JurisdictionRegistration.REJECTED_to_PENDING
          - state_machines.JurisdictionRegistration.PENDING_to_VERIFIED
          - entities.JurisdictionRegistration.fields.status
        distinguishing_aspect: |
          Entity: JurisdictionRegistration — a true cycle PENDING -> REJECTED
          -> PENDING -> VERIFIED (re-onboarding after agency rejection), on a
          different entity than the deposit failure loop.
        test_recipe:
          setup:
            - "Clock at default. Jurisdiction NY-NYS45 (MONTHLY). Client ONBOARDING with a PENDING NY registration."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "NY-NYS45", name: "NY NYS-45", deposit_frequency: "MONTHLY", penalty_tier1_rate: 0.02, penalty_tier2_rate: 0.05, penalty_tier3_rate: 0.10, underpayment_threshold_cents: 100000 }
              as: BureauCompliance
              captures: { j_ny: $.data.id }
            - call: "POST /clients"
              payload: { legal_name: "Cycle Corp", ein: "33-3333333" }
              as: BureauOnboarder
              captures: { cl_cy: $.data.id }
            - call: "POST /clients/${cl_cy}/begin-onboarding"
              payload: {}
