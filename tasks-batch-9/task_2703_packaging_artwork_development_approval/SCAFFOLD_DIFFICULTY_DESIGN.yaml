scaffold_difficulty_design:

  # ==========================================================================
  # RULE 1 — dual_variant_calc
  # Two calculations carry `variants:` in §1.3: cost_recovery_amount
  # (PROVISIONAL vs FINAL, money domain) and runout_projection
  # (FORWARD_LOOKING vs CHRONOLOGICAL, date domain).
  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: recovery_provisional_vs_final_diverge_on_per_line_rounding
        grounds:
          - calculations.cost_recovery_amount
          - entities.ErrorEscape.fields.provisional_recovery_cents
          - entities.ErrorEscape.fields.final_recovery_cents
          - entities.ErrorEscape.fields.recovery_variance_cents
          - entities.ArtworkAsset.fields.standard_unit_cost_cents
          - state_machines.ErrorEscape.ROOT_CAUSE_ASSIGNED_to_RECOVERY_CLAIMED
          - state_machines.ErrorEscape.RECOVERY_CLAIMED_to_SETTLED
          - validations[priority=56]
        distinguishing_aspect: |
          The PROVISIONAL variant estimates the exposure from
          ArtworkAsset.standard_unit_cost_cents with a zero freight line and
          clamps to the printer's liability cap, while the FINAL variant sums
          the three actual invoice amounts and refuses to clamp; on the same
          escape the two therefore land on 495625 and 721521 cents, and the
          FINAL figure additionally proves per-line rounding (721521) rather
          than sum-then-round (721520).
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Brief SKU-1001 APPROVED under FDA_FOOD, market_codes [US], language_codes [en], all seven mandatory element codes required."
            - "ArtworkAsset with component_type CARTON, so standard_unit_cost_cents == 42, market_code US, language_codes [en], not brand-critical, substrate_class COATED_PAPER, plate_budget_cents 500000."
            - "ArtworkVersion v1 verified with all seven elements passing (compliance_score 100.0), routed through all three stages with four APPROVED decisions, then RELEASED_TO_PRINT behind a PROOF_APPROVED proof."
            - "Printer 'Cascade Print Co' with color_standard G7_MASTER, certified_substrates [COATED_PAPER, FILM], recovery_liability_cap_cents 5000000, certification_status CERTIFIED, performance_score 100.0."
            - "ErrorEscape on v1 against that printer, defect ALLERGEN_STATEMENT_OMITTED, discovered_stage MARKET (a LATE_DISCOVERY_STAGES member, so investigation_fee_cents == 150000), units_affected 12500, root cause SHARED at printer_share_pct 0.65, state ROOT_CAUSE_ASSIGNED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u_admin"
            - call: "POST /briefs"
              payload:
                sku_code: "SKU-1001"
                product_name: "Northgate Cocoa Carton 340g"
                regulatory_scheme: "FDA_FOOD"
                market_codes: ["US"]
                language_codes: ["en"]
                required_element_codes: ["NET_CONTENTS", "INGREDIENT_STATEMENT", "ALLERGEN_STATEMENT", "DATE_CODE_ZONE", "BARCODE", "RECYCLING_MARK", "ADDRESS_BLOCK"]
                structural_spec: { component_type: "CARTON", dimensions_mm: { l: 120, w: 60, h: 200 }, substrate_class: "COATED_PAPER", print_process: "OFFSET_LITHO" }
                net_contents_declaration: { metric_value: 340, metric_uom: "g", us_value: 12, us_uom: "oz" }
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { brief_id: "$.data.id" }
            - call: "POST /briefs/${brief_id}/decision"
              payload: { decision: "APPROVED", review_note: "Scheme and net contents confirmed." }
              as: RegulatoryReviewer
              as_user_id: "u_reg"
            - call: "POST /artwork-assets"
              payload:
                brief_id: "${brief_id}"
                market_code: "US"
                language_codes: ["en"]
                component_type: "CARTON"
                substrate_class: "COATED_PAPER"
                brand_critical_color: false
                plate_budget_cents: 500000
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { asset_id: "$.data.id", asset_v1: "$.data.version" }
            - call: "POST /artwork-assets/${asset_id}/versions"
              payload:
                expected_artwork_asset_version: "${asset_v1}"
                reason_for_change_code: "NEW_LAUNCH"
                change_description: "Initial US carton artwork."
                mandatory_elements:
                  net_contents: { metric_value: 340, metric_uom: "g", us_value: 12, us_uom: "oz" }
                  ingredient_statement: { text: "WATER, SUGAR, COCOA, MILK POWDER, SALT", descending_order: true }
                  allergen_statement: { text: "CONTAINS MILK", allergen_emphasis: true }
                  date_code_zone: { zone_mm2: 240, position: "BACK_PANEL_LOWER_RIGHT" }
                  barcode: { gtin14: "00012345678905" }
                  recycling_mark: { present: true }
                  address_block: { text: "Northgate Foods, Portland OR 97209" }
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { v1_id: "$.data.id" }
            - call: "POST /artwork-versions/${v1_id}/verify-elements"
              payload: { verification_note: "First verification run." }
              as: PackagingCoordinator
              as_user_id: "u_coord"
            - call: "POST /artwork-versions/${v1_id}/submit"
              payload: { submit_note: "Route for brand, regulatory, legal and quality." }
              as: PackagingCoordinator
              as_user_id: "u_coord"
            - call: "GET /review-routes"
              payload: { artwork_version_id: "${v1_id}" }
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { r1_id: "$.data[0].id" }
            - call: "GET /review-tasks"
              payload: { review_route_id: "${r1_id}", discipline: "BRAND" }
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { t1_brand: "$.data[0].id" }
            - call: "GET /review-tasks"
              payload: { review_route_id: "${r1_id}", discipline: "REGULATORY" }
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { t1_reg: "$.data[0].id" }
            - call: "GET /review-tasks"
              payload: { review_route_id: "${r1_id}", discipline: "LEGAL" }
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { t1_legal: "$.data[0].id" }
            - call: "GET /review-tasks"
              payload: { review_route_id: "${r1_id}", discipline: "QUALITY" }
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { t1_qa: "$.data[0].id" }
            - call: "POST /review-tasks/${t1_brand}/decision"
              payload: { decision: "APPROVED", comment: "Brand identity approved." }
              as: BrandReviewer
              as_user_id: "u_brand"
            - call: "POST /review-tasks/${t1_reg}/decision"
              payload: { decision: "APPROVED", comment: "Regulatory copy approved." }
              as: RegulatoryReviewer
              as_user_id: "u_reg"
            - call: "POST /review-tasks/${t1_legal}/decision"
              payload: { decision: "APPROVED", comment: "No legal exposure." }
              as: LegalReviewer
              as_user_id: "u_legal"
            - call: "POST /review-tasks/${t1_qa}/decision"
              payload: { decision: "APPROVED", comment: "Quality sign-off." }
              as: QualityReviewer
              as_user_id: "u_qa"
            - call: "POST /printers"
              payload:
                name: "Cascade Print Co"
                color_standard: "G7_MASTER"
                certified_substrates: ["COATED_PAPER", "FILM"]
                recovery_liability_cap_cents: 5000000
              as: PlatformAdmin
              as_user_id: "u_admin"
              captures: { printer_id: "$.data.id" }
            - call: "POST /printer-proofs"
              payload: { artwork_version_id: "${v1_id}", printer_id: "${printer_id}", substrate_code: "COATED_PAPER", proof_note: "Contract proof, run 1." }
              as: PrinterRep
              as_user_id: "${printer_id}"
              captures: { proof_id: "$.data.id" }
            - call: "POST /printer-proofs/${proof_id}/color-decision"
              payload: { measured_delta_e_max: 1.2 }
              as: QualityReviewer
              as_user_id: "u_qa"
            - call: "POST /printer-proofs/${proof_id}/substrate-decision"
              payload: { decision: "SUBSTRATE_APPROVED" }
              as: QualityReviewer
              as_user_id: "u_qa"
            - call: "POST /artwork-versions/${v1_id}/release-to-print"
              payload: { release_note: "Released against approved proof." }
              as: PackagingCoordinator
              as_user_id: "u_coord"
            - call: "POST /error-escapes"
              payload:
                artwork_version_id: "${v1_id}"
                printer_id: "${printer_id}"
                defect_code: "ALLERGEN_STATEMENT_OMITTED"
                discovered_stage: "MARKET"
                units_affected: 12500
                discovery_note: "Retail complaint escalated from two banners."
              as: QualityReviewer
              as_user_id: "u_qa"
              captures: { escape_id: "$.data.id" }
            - call: "POST /error-escapes/${escape_id}/root-cause"
              payload: { root_cause_party: "SHARED", printer_share_pct: 0.65, investigation_note: "Plate revision applied one cycle late by the printer; brief change landed late from brand." }
              as: QualityReviewer
              as_user_id: "u_qa"
              captures: { escape_v_after_rc: "$.data.version" }
          trigger:
            - call: "POST /error-escapes/${escape_id}/recovery-claim"
              payload: { expected_error_escape_version: "${escape_v_after_rc}" }
              as: QualityReviewer
              as_user_id: "u_qa"
            - call: "POST /error-escapes/${escape_id}/settle"
              payload:
                resolution: "SETTLED"
                actual_reprint_cost_cents: 800010
                actual_scrap_cost_cents: 100010
                actual_expedite_freight_cents: 60010
                settlement_note: "Printer invoices reconciled."
              as: PlatformAdmin
              as_user_id: "u_admin"
          assert:
            - "ErrorEscape.${escape_id}.investigation_fee_cents == 150000"
            - "ErrorEscape.${escape_id}.provisional_recovery_cents == 495625"
            - "ErrorEscape.${escape_id}.liability_cap_applied == false"
            - "ErrorEscape.${escape_id}.final_recovery_cents == 721521"
            - "ErrorEscape.${escape_id}.final_recovery_cents != 721520 (721520 is the sum-then-round result and is wrong)"
            - "ErrorEscape.${escape_id}.recovery_variance_cents == 225896"
            - "ErrorEscape.${escape_id}.state == SETTLED"
            - "ErrorEscape.${escape_id}.resolution == SETTLED"
            - "Printer.${printer_id}.recovery_balance_cents == 721521"

      - name: runout_forward_looking_vs_chronological_date_divergence
        grounds:
          - calculations.runout_projection
          - entities.InventoryRunout.fields.projected_runout_date
          - entities.InventoryRunout.fields.actual_runout_date
          - entities.InventoryRunout.fields.trailing_avg_usage_qty
          - entities.InventoryRunout.fields.remaining_qty
          - state_machines.InventoryRunout.PLANNED_to_MONITORING
        distinguishing_aspect: |
          Both variants read the same InventoryRunout row but answer in the
          date domain rather than the money domain: FORWARD_LOOKING keys only
          on weekly_usage_qty 1200 and yields 2026-09-07, while CHRONOLOGICAL
          replays the four actual weekly records and extrapolates from the
          trailing-3-week mean 690, yielding 2026-09-28; projected_runout_date
