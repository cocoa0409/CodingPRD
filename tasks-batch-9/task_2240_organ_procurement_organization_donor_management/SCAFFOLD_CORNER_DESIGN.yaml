          assert:
            - "${error_admin} == ERR_FORBIDDEN_ROLE with HTTP 403 and DonorCase.${case_id}.organ_count == 0 at that point"
            - "${error_coord} == ERR_FORBIDDEN_ROLE with HTTP 403 and only one HospitalPartner exists"
            - "the DonorCoordinator call returns HTTP 201 with ${organ_status} == PENDING_EVAL, so the endpoint itself was never the obstacle"
            - "GET /opo/hospital-partners/${hosp_id} succeeds for OpoAdmin: reads stay shared even where writes are exclusive"

      - name: risk_assessor_cannot_also_rule_on_eligibility
        claim_type: segregation_of_duties
        grounds:
          - validations[priority 58]
          - errors.ERR_SEGREGATION_OF_DUTIES
          - entities.EligibilityScreening.fields.risk_assessed_by_user_id
        distinguishing_aspect: |
          The bar is on the X-User-ID, not the role: the same person may legitimately hold both the
          ReferralCoordinator and MedicalDirector roles, but once user u-1 is stamped into
          risk_assessed_by_user_id the decision from u-1 is refused while u-2's identical decision is
          accepted.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-09T08:00:00Z."
            - "A PENDING screening whose risk assessment was submitted by user u-1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-09T08:00:00Z" }
              as: OpoAdmin
            - call: "POST /opo/hospital-partners"
              payload: { name: "Mercy General", hospital_code: "MERCY", timely_referral_window_minutes: 60 }
              as: OpoAdmin
              captures: { hosp_id: $.data.id }
            - call: "POST /opo/death-referrals"
              payload: { hospital_partner_id: "${hosp_id}", patient_mrn: "MRN-7801", age_years: 40, ventilated: true, gcs_score: 3, cause_of_death_category: "ANOXIA", trigger_event_at: "2026-09-09T07:30:00Z" }
              as: ReferralCoordinator
              captures: { ref_id: $.data.id }
            - call: "POST /opo/death-referrals/${ref_id}/screenings"
              payload: {}
              as: ReferralCoordinator
              captures: { scr_id: $.data.id, scr_v: $.data.version }
            - call: "POST /opo/eligibility-screenings/${scr_id}/risk-assessment"
              payload: { risk_factors: ["TATTOO_UNREGULATED_12MO"], informant_reliability: "PRIMARY_NEXT_OF_KIN", expected_screening_version: "${scr_v}" }
              as: ReferralCoordinator
              as_user_id: "u-1"
              captures: { assessor: $.data.risk_assessed_by_user_id, score: $.data.risk_score }
          trigger:
            - call: "POST /opo/eligibility-screenings/${scr_id}/decision"
              payload: { decision: "CLEARED" }
              as: MedicalDirector
              as_user_id: "u-1"
              captures: { error_sod: $.data.error_id }
            - call: "GET /opo/eligibility-screenings/${scr_id}"
              payload: {}
              as: MedicalDirector
              captures: { status_after_error: $.data.status }
            - call: "POST /opo/eligibility-screenings/${scr_id}/decision"
              payload: { decision: "CLEARED" }
              as: MedicalDirector
              as_user_id: "u-2"
              captures: { status_final: $.data.status, decider: $.data.decided_by_user_id }
          assert:
            - "${assessor} == u-1 and ${score} == 1.50"
            - "${error_sod} == ERR_SEGREGATION_OF_DUTIES with HTTP 403"
            - "${status_after_error} == PENDING: the refused decision left the screening untouched"
            - "${status_final} == CLEARED with ${decider} == u-2 and DeathReferral.${ref_id}.status == SCREEN_CLEARED"

      - name: consent_recorder_cannot_also_finalize_the_packet
        claim_type: segregation_of_duties
        grounds:
