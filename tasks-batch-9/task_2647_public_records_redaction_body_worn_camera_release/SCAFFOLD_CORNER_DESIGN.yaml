            - { call: "POST /records/requests/${req_id}/responsive-records", payload: { video_asset_id: "${asset_id}" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { rec_id: $.data.id } }
            - { call: "POST /records/responsive-records/${rec_id}/inclusion", payload: { inclusion_status: "RESPONSIVE" }, as: RecordsClerk, as_user_id: "clerk-1" }
            - { call: "POST /records/responsive-records/${rec_id}/redaction-tasks", payload: { target_type: "FACE", clip_start_ms: 0, clip_end_ms: 3600000, assigned_technician_id: "${tech_id}" }, as: RedactionTechnician, as_user_id: "${tech_id}", captures: { task_id: $.data.id } }
            - { call: "POST /records/redaction-tasks/${task_id}/submit-qa", payload: { logged_labor_minutes: 20, qa_reviewer_id: "${reviewer_id}", qa_window_start_at: "2026-08-02T09:00:00Z", qa_window_end_at: "2026-08-02T09:30:00Z" }, as: RedactionTechnician, as_user_id: "${tech_id}" }
            - { call: "POST /records/redaction-tasks/${task_id}/qa-outcome", payload: { outcome: "PASS" }, as: QualityReviewer, as_user_id: "${reviewer_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-05T14:30:00Z" }, as: RecordsClerk, as_user_id: "clerk-1" }
            - { call: "POST /records/depicted-individuals/${dep_id}/notification", payload: { notice_method: "FIRST_CLASS_MAIL" }, as: RecordsClerk, as_user_id: "clerk-1" }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-10T09:00:00Z" }, as: RecordsClerk, as_user_id: "clerk-1" }
            - { call: "POST /records/requests/${req_id}/release-packages", payload: { media_type: "DIGITAL_DOWNLOAD" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { e_obj: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-15T14:30:00Z" }, as: RecordsClerk, as_user_id: "clerk-1" }
            - { call: "POST /records/requests/${req_id}/release-packages", payload: { media_type: "DIGITAL_DOWNLOAD" }, as: RecordsClerk, as_user_id: "clerk-1", captures: { pkg_id: $.data.id } }
          assert:
            - "before the first trigger call: RedactionTask.${task_id}.status == APPROVED, PublicRecordsRequest.${req_id}.processing_status == RELEASE_READY, billable_labor_minutes == 20 and DepictedIndividual.${dep_id}.objection_deadline_at == 2026-08-15T14:30:00Z"
            - "second trigger response: HTTP 409 and ${e_obj} == ERR_OBJECTION_UNRESOLVED — the window is still open at 2026-08-10T09:00:00Z"
            - "after the refusal DepictedIndividual.${dep_id}.notification_status == NOTIFIED, ResponsiveRecord.${rec_id}.inclusion_status == RESPONSIVE and PublicRecordsRequest.${req_id}.processing_status == RELEASE_READY — the refused call swept nothing"
            - "fourth trigger response: HTTP 201, ReleasePackage.${pkg_id}.waived_notification_count == 1 and package_kind == FINAL"
            - "ReleasePackage.${pkg_id}: included_record_count == 1, produced_minutes == 60, disc_count == 0, production_cost_cents == 0, released_at == 2026-08-15T14:30:00Z"
            - "DepictedIndividual.${dep_id}.notification_status == WAIVED and PublicRecordsRequest.${req_id}.open_notification_count == 0"
            - "PublicRecordsRequest.${req_id}.processing_status == RELEASED and ResponsiveRecord.${rec_id}.inclusion_status == RELEASED with released_at == 2026-08-15T14:30:00Z"
      - name: readiness_gate_outranks_the_unpaid_deposit_gate
        claim_type: Priority conflict
        grounds:
          - validations.priority_9
          - validations.priority_30
        distinguishing_aspect: |
          A request that is both not release-ready and carrying an unpaid deposit reports
          ERR_REQUEST_NOT_RELEASE_READY, never ERR_DEPOSIT_UNPAID.
        excluded_because:
          difficulty_instance: release_readiness_state_beats_unpaid_deposit_fiscal
          rationale: |
            The §1.8 instance already drives both violations simultaneously and pins the
            state gate as the winner; a second recipe over the same two priorities would
            assert the identical response.
      - name: blocked_record_reports_the_posture_before_the_clip_overlap
        claim_type: Priority conflict
        grounds:
          - validations.priority_12
          - validations.priority_21
        distinguishing_aspect: |
          A task request that both targets a BLOCKED record and overlaps a live clip
          interval reports ERR_RECORD_RELEASE_BLOCKED.
        excluded_because:
          difficulty_instance: blocked_posture_safety_beats_clip_overlap_constraint
          rationale: |
            §1.8 constructs exactly this doubly-violating create call, so the corner test
            would duplicate its setup and its expected error verbatim.
      - name: objection_filed_on_the_deadline_instant_is_still_in_time
        claim_type: Temporal validation
        grounds:
          - validations.priority_28
          - calculations.objection_deadline
        distinguishing_aspect: |
          An objection posted at exactly objection_deadline_at is accepted while one
          microsecond later is ERR_WINDOW_CLOSED.
        excluded_because:
          difficulty_instance: objection_window_inclusive_deadline_instant
          rationale: |
            The inclusive-boundary pair is the whole subject of the §1.8 instance, which
            already tests the deadline instant and the instant after it.
        # The corner-side coverage of the objection window lives in
        # unexpired_victim_notice_blocks_release_then_the_sweep_waives_it, which probes the
        # release sweep rather than the objection endpoint's own window check.
      - name: qa_pass_is_refused_while_the_cited_claim_is_still_asserted
        claim_type: Cross-entity validation
        grounds:
          - validations.priority_13
          - errors.ERR_UNADJUDICATED_CLAIM
        distinguishing_aspect: |
          A PASS verdict on a task whose exemption_claim_id still points at an ASSERTED
          claim is ERR_UNADJUDICATED_CLAIM, and succeeds once the claim is sustained.
        excluded_because:
          difficulty_instance: qa_pass_requires_sustained_exemption_claim
          rationale: |
            §1.8 already runs the refused-then-permitted pair on the same task, so a corner
            instance would restate the cross-entity guard with no new boundary.

  # ===========================================================================
  # Section 5 — Endpoints (§1.5). Every write endpoint's declared side_effects
  # must be observed somewhere; these instances take the endpoints whose side
  # effects are not already pinned by an earlier section.
  # ===========================================================================
  - section: endpoints
    instances:
      - name: interim_package_covers_only_the_record_with_an_approved_task
        claim_type: Conditional action
        grounds:
          - endpoints."POST /records/requests/{id}/release-packages"
          - calculations.release_eligible_set
          - calculations.media_production_cost
          - state_machines.PublicRecordsRequest.processing_status.RELEASE_READY_to_PARTIALLY_RELEASED
        distinguishing_aspect: |
          Condition 4 of release_eligible_set demands at least one APPROVED task, so a
          RESPONSIVE record whose only task was cancelled by an OVERRULED claim is left
          behind and the package comes back INTERIM rather than FINAL.
        test_recipe:
          setup:
            - "Two 60-minute and 30-minute ROUTINE recordings of INC-2026-0651 are both ruled RESPONSIVE on one request."
            - "Record A carries one FACE task that passed QA, so it has an APPROVED task."
            - "Record B carries one FACE task linked to a PERSONAL_PRIVACY claim; overruling that claim cancelled the task, leaving B RESPONSIVE with posture OPEN, zero unadjudicated claims and no APPROVED task."
            - "Every task on the request is therefore terminal, which carried processing_status REDACTION -> RELEASE_READY."
            - "No FeeEstimate exists, so deposit_required_cents is 0 and the fiscal gate at priority 30 passes."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: RecordsSupervisor, as_user_id: "supv-1" }
