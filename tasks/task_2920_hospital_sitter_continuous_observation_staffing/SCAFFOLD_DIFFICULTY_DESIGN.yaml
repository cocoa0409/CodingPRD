  - rule_id: compensating_invariant
    instances:
      - name: void_reverses_the_provisional_charge_leaving_the_unit_ledger_at_zero
        conserved_quantity: "monetary — Unit.observed_cost_to_date_cents, the denormalised sum of POSTED CostEntry.amount_cents"
        grounds:
          - state_machines.SitterAssignment.watch_status.SCHEDULED_to_VOIDED
          - calculations.unit_cost_ledger_head
          - entities.CostEntry.fields.status
        distinguishing_aspect: |
          The conserved quantity is money. A void must compensate the PROVISIONAL charge exactly, so the
          unit ledger head returns to its pre-assignment value of 0 with no residue and no drift, and it
          must do so by flipping the entry's status rather than editing amount_cents — the reversed row
          still reads 19200, which is what makes the compensation auditable rather than destructive. The
          unit's status is explicitly NOT re-derived downward by a reversal.
        test_recipe:
          setup:
            - "Unit UNIT-R budget 500000, video disabled, ledger head 0 before anything is scheduled; admitted patient age 60 with an ACTIVE FALL-only order."
            - "One INTERNAL_FLOAT sitter at 2400 cents/hour scheduled 2026-08-01T08:00Z -> 16:00Z, which posts a PROVISIONAL of 2400 * (480/60) * 1.00 == 19200 and lifts the head to 19200."
            - "The watch is never started, so no FINAL_SEGMENT entry can exist."
            - "The clock is advanced to 2026-08-01T07:00:00Z before the void so reversed_at is distinguishable from posted_at."
          setup_api_calls:
            - call: "POST /observation/units"
              payload: { unit_code: "UNIT-R", name: "Observation Unit R", observation_cost_budget_cents: 500000, video_monitoring_enabled: false }
              as: NurseManager
              captures: { unit_r: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${unit_r}", mrn: "MRN-9801", full_name: "Pat Twentyfive", age_years: 60 }
              as: NurseManager
              captures: { p20: $.data.id }
            - call: "POST /observation/staff"
              payload: { home_unit_id: "${unit_r}", full_name: "Sitter Arr", source_pool: "INTERNAL_FLOAT", hourly_rate_cents: 2400, competency_level: "ADVANCED", deescalation_cert_expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { s20: $.data.id }
            - call: "POST /observation/orders"
              payload: { patient_id: "${p20}", ordering_provider_user_id: "prov-1", risk_categories: ["FALL"], required_modality: "ONE_TO_ONE_SITTER", clinical_rationale: "Fall precautions pending mobility review" }
              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { o20: $.data.id, o20_v1: $.data.version }
            - call: "POST /observation/sitter-assignments"
              payload: { order_id: "${o20}", staff_id: "${s20}", shift_start_at: "2026-08-01T08:00:00Z", shift_end_at: "2026-08-01T16:00:00Z", expected_order_version: "${o20_v1}" }
              as: StaffingCoordinator
              captures: { a20: $.data.id }
            - call: "POST /observation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T07:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /observation/sitter-assignments/${a20}/void"
              payload: {}
              as: NurseManager
              as_user_id: "mgr-1"
          assert:
            - "BEFORE: Unit.${unit_r}.observed_cost_to_date_cents == 19200 and SitterAssignment.${a20}.provisional_cost_cents == 19200"
            - "AFTER: Unit.${unit_r}.observed_cost_to_date_cents == 0 — the head is back to its pre-assignment value exactly, with no rounding residue"
            - "SitterAssignment.${a20}.watch_status == VOIDED, voided_at == 2026-08-01T07:00:00Z, documentation_status == WAIVED"
            - "SitterAssignment.${a20}.provisional_cost_cents is still 19200 (the field records what was charged; it is not zeroed)"
            - "SitterAssignment.${a20}.final_cost_cents == 0, watch_segment_count == 0, watched_minutes == 0"
            - "GET /observation/sitter-assignments/${a20}/cost-entries returns exactly 1 row: entry_kind PROVISIONAL, amount_cents still 19200, status REVERSED, posted_at 2026-08-01T00:00:00Z, reversed_at 2026-08-01T07:00:00Z"
            - "No FINAL_SEGMENT CostEntry exists for ${a20}"
            - "Unit.${unit_r}.status == OPEN (a reversal never re-derives the unit status)"
            - "Staff.${s20}.status == AVAILABLE and ObservationOrder.${o20}.coverage_gap_flag == false"

      - name: feed_release_restores_station_occupancy_and_span_limit_without_drift
        conserved_quantity: "occupancy — MonitoringStation.active_feed_count, active_acuity_weight and the derived effective_span_limit"
        grounds:
          - calculations.station_effective_span_limit
          - state_machines.VideoFeed.status.ACTIVE_to_RELEASED
          - state_machines.MonitoringStation.status.ACTIVE_MONITORING_to_IDLE
        distinguishing_aspect: |
          A non-monetary conserved quantity of a different type: a console's occupancy triple. Two feeds
          are admitted and then released in reverse order, and every counter must retrace its path
          exactly — count 0 -> 1 -> 2 -> 1 -> 0, weight 0.0 -> 1.0 -> 4.0 -> 1.0 -> 0.0 and the derived
          effective_span_limit 3 -> 3 -> 2 -> 3 -> 3. The mid-sequence limit dip to 2 proves the limit is
          re-derived from the live weight rather than decremented and re-incremented, and the station
          only returns to IDLE when the count actually reaches zero, not on the first release.
        test_recipe:
          setup:
            - "Video-enabled unit UNIT-S budget 500000; two admitted patients age 60 with their own VIDEO_MONITORING orders: T1 [FALL] weight 1.0 (score 1.5) and T2 [FALL, ELOPEMENT] weight 3.0 (score 4.0)."
            - "Console CONSOLE-S1 declared_max_span 3, observer S_S (ADVANCED, unexpired certification), starting at count 0, weight 0.0, effective_span_limit 3, status IDLE."
            - "Feed windows overlap: F1 [08:00, 12:00) and F2 [09:00, 13:00). Both admissions clear the span rule (occupancy 1 and 2 against the pre-candidate limit 3)."
            - "The clock is left at the startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /observation/units"
              payload: { unit_code: "UNIT-S", name: "Remote Hub Unit S", observation_cost_budget_cents: 500000, video_monitoring_enabled: true }
              as: NurseManager
              captures: { unit_s: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${unit_s}", mrn: "MRN-9901", full_name: "Pat Twentysix", age_years: 60 }
              as: NurseManager
              captures: { p21: $.data.id }
            - call: "POST /observation/patients"
              payload: { unit_id: "${unit_s}", mrn: "MRN-9902", full_name: "Pat Twentyseven", age_years: 60 }
              as: NurseManager
              captures: { p22: $.data.id }
            - call: "POST /observation/staff"
              payload: { home_unit_id: "${unit_s}", full_name: "Observer Ess", source_pool: "INTERNAL_FLOAT", hourly_rate_cents: 2000, competency_level: "ADVANCED", deescalation_cert_expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { s_s: $.data.id }
            - call: "POST /observation/monitoring-stations"
              payload: { observer_staff_id: "${s_s}", station_label: "CONSOLE-S1", declared_max_span: 3 }
              as: StaffingCoordinator
              captures: { st_s: $.data.id }
            - call: "POST /observation/orders"
              payload: { patient_id: "${p21}", ordering_provider_user_id: "prov-1", risk_categories: ["FALL"], required_modality: "VIDEO_MONITORING", clinical_rationale: "Remote fall watch, low acuity" }
              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { t1: $.data.id }
            - call: "POST /observation/orders"
              payload: { patient_id: "${p22}", ordering_provider_user_id: "prov-1", risk_categories: ["FALL", "ELOPEMENT"], required_modality: "VIDEO_MONITORING", clinical_rationale: "Remote combined watch, higher acuity" }
              as: AttendingProvider
              as_user_id: "prov-1"
              captures: { t2: $.data.id }
          trigger:
            - call: "POST /observation/video-feeds"
              payload: { station_id: "${st_s}", order_id: "${t1}", monitor_start_at: "2026-08-01T08:00:00Z", monitor_end_at: "2026-08-01T12:00:00Z" }
              as: RemoteObserver
              as_user_id: "${s_s}"
              captures: { fs1: $.data.id }
            - call: "POST /observation/video-feeds"
              payload: { station_id: "${st_s}", order_id: "${t2}", monitor_start_at: "2026-08-01T09:00:00Z", monitor_end_at: "2026-08-01T13:00:00Z" }
              as: RemoteObserver
              as_user_id: "${s_s}"
              captures: { fs2: $.data.id }
            - call: "POST /observation/video-feeds/${fs2}/release"
              payload: {}
              as: RemoteObserver
              as_user_id: "${s_s}"
            - call: "POST /observation/video-feeds/${fs1}/release"
              payload: {}
              as: RemoteObserver
              as_user_id: "${s_s}"
          assert:
            - "STEP 1 (F1 admitted): MonitoringStation.${st_s}.active_feed_count == 1, active_acuity_weight == 1.0, effective_span_limit == 3, status == ACTIVE_MONITORING, Staff.${s_s}.status == ON_ASSIGNMENT"
            - "STEP 2 (F2 admitted): active_feed_count == 2, active_acuity_weight == 4.0, effective_span_limit == 2 (max(1, 3 - 1) at the >= 4.0 penalty tier)"
            - "STEP 3 (F2 released): active_feed_count == 1, active_acuity_weight == 1.0, effective_span_limit == 3 again — the limit is re-derived from the live weight, and the station is STILL ACTIVE_MONITORING with Staff.${s_s}.status == ON_ASSIGNMENT"
            - "STEP 4 (F1 released): active_feed_count == 0, active_acuity_weight == 0.0, effective_span_limit == 3, status == IDLE, Staff.${s_s}.status == AVAILABLE"
            - "The occupancy triple after step 4 is identical to the triple at station creation: (0, 0.0, 3) — no drift"
            - "VideoFeed.${fs1}.status == RELEASED and VideoFeed.${fs2}.status == RELEASED, both with release_reason == OBSERVER_RELEASE and released_at == 2026-08-01T00:00:00Z"
            - "VideoFeed.${fs1}.acuity_weight is still 1.0 and VideoFeed.${fs2}.acuity_weight is still 3.0 (the frozen weights are not cleared on release)"
            - "GET /observation/monitoring-stations/${st_s}/video-feeds returns exactly 2 rows, both RELEASED"
            - "Unit.${unit_s}.observed_cost_to_date_cents == 0 throughout"
