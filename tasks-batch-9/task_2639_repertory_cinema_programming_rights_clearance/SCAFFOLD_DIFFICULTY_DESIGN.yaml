            - call: "GET /bookings/${b_id}/offers"
              payload: {}
              as: Programmer
            - call: "POST /bookings/${b_id}/confirm"
              payload: {}
              as: ExecutiveDirector
              as_user_id: "u-ed-1"
          assert:
            - "After the first counter, Booking.${b_id}.status == COUNTERED and round_count == 2 (OFFERED -> COUNTERED)."
            - "After the cinema's answering offer, Booking.${b_id}.status == OFFERED and round_count == 3 - the cycle walked back to a state it had already occupied."
            - "After the second counter, Booking.${b_id}.status == COUNTERED and round_count == 4 (the COUNTERED -> COUNTERED self-loop reached via OFFERED)."
            - "GET /bookings/${b_id}/offers returns exactly 4 rows with round_index 1, 2, 3, 4 and proposed_by CINEMA, DISTRIBUTOR, CINEMA, DISTRIBUTOR in that order."
            - "BookingOffer.${off2_id}.outcome == COUNTERED and BookingOffer.${off3_id}.outcome == COUNTERED (each superseded by the next round)."
            - "BookingOffer.${off4_id}.outcome == ACCEPTED after confirm, and Booking.${b_id}.status == CONFIRMED with house_nut_cents == 13500 and distributor_share_pct == 0.38 and min_run_days == 4 and guarantee_cents == 3800 copied from the accepted round."

      - name: showtime_three_parallel_status_dimensions_evolve_independently
        grounds:
          - state_machines.Showtime.DRAFT_to_ON_SALE
          - state_machines.Showtime.KEY_PENDING_to_PLAYBACK_VERIFIED
          - state_machines.Showtime.ON_SALE_to_SALES_CLOSED
          - entities.Showtime.fields.status
          - entities.Showtime.fields.sale_status
          - entities.Showtime.fields.playback_status
        distinguishing_aspect: |
          Showtime carries three orthogonal dimensions - status, sale_status and playback_status - and
          a transition on one leaves the other two untouched. Issuing a KDM moves playback_status
          UNVERIFIED -> KEY_PENDING while sale_status stays DRAFT; open-sales moves sale_status
          DRAFT -> ON_SALE while playback_status stays KEY_PENDING; verify-playback then moves
          playback_status to PLAYBACK_VERIFIED without touching ON_SALE; and close-sales moves
          sale_status to SALES_CLOSED while playback_status stays PLAYBACK_VERIFIED. Throughout,
          status remains SCHEDULED - no combined state variable exists.
