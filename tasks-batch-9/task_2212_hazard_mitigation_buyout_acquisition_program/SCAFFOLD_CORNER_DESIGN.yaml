  - section: endpoints
    instances:

      - name: the_clock_endpoint_pins_the_logical_now_used_by_every_later_write
        claim_type: action_endpoint
        grounds:
          - endpoints.POST__clock_set_current_utc
          - global_constants.DEFAULT_LOGICAL_CLOCK_UTC
          - entities.MitigationProject.common_fields
        distinguishing_aspect: |
          The clock endpoint is the only endpoint with no authentication or role restriction and only
          ERR_INVALID_REQUEST in its catalog: it echoes the pinned instant, every subsequently created
          row stamps created_at from it, and a malformed instant is rejected without moving the clock,
          so the previously pinned value still governs the next write.
        test_recipe:
          setup:
            - "Empty database; the clock has never been set, so it holds the default DEFAULT_CLOCK_UTC."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-03-15T12:00:00Z" }
              as: ComplianceMonitor
              as_user_id: "cm-1"
          trigger:
            - call: "POST /mitigation-projects"
              payload: { project_code: "EP-CLOCK-1", grant_program: "FMA", subrecipient_name: "City of Riverbend", total_federal_share_cap_cents: 500000000, period_of_performance_end_date: "2030-12-31" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { proj: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "not-an-instant" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "POST /mitigation-projects/${proj}/parcels"
              payload: { project_id: "${proj}", apn: "APN-EP-CLOCK-1", site_address: "3801 River Rd", acreage: 0.34, occupancy_type: "VACANT", structure_type: "NONE" }
              as: SubrecipientCoordinator
              as_user_id: "${proj}"
              captures: { p1: "$.data.id" }
          assert:
            - "the setup call returns 200 with data.current_utc == 2027-03-15T12:00:00Z even though the caller is a ComplianceMonitor"
            - "trigger call 1 returns 201 with MitigationProject.${proj}.created_at == 2027-03-15T12:00:00Z and updated_at == created_at"
            - "trigger call 2 returns 422 with data.error_id == ERR_INVALID_REQUEST"
            - "trigger call 3 returns 201 with Parcel.${p1}.created_at == 2027-03-15T12:00:00Z, proving the failed clock write did not move the clock"

      - name: offer_creation_and_offer_presentation_read_two_different_participation_gates
        claim_type: conditional_action
        grounds:
          - validations.priority_50
          - validations.priority_51
          - endpoints.POST_parcels_parcel_id_purchase_offers
          - endpoints.POST_purchase_offers_offer_id_present
