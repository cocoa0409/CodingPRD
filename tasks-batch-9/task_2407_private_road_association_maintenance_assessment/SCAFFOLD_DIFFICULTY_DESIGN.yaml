# =============================================================================
# 1.8 Scaffold Difficulty Design — task 2407 Private Road Association
# Maintenance & Assessment
#
# Nine §0.5 difficulty rules, 21 instances (>= 2 per rule). Every chain starts
# from an empty database and uses only endpoints declared in §1.5 of
# SCAFFOLD.yaml. The logical clock reads 2026-08-01T00:00:00Z before the first
# POST /_clock/set_current_utc call, so every chain sets it explicitly.
#
# Recurring fixtures (each chain spells them out in full; these notes only
# explain WHY the literals are what they are):
#
#   SINGLE_4M  one association (reserve_target_cents 1000000, quorum_bps 5000,
#              PER_PARCEL, STATUTORY), one COMPLIANT segment (2400 ft, 22 ft
#              wide, 9% grade, 2 turnouts, turnaround, no bridge), one parcel
#              (290 ft, RESIDENTIAL_YEAR_ROUND, 6 trips), one verified member,
#              and an FY2027 FRONTAGE_WEIGHTED roll for 4000000 cents.
#              Certification clamps the lone parcel to the per-parcel cap
#              1600000 = floor(0.40 * 4000000) and records
#              unallocated_residual_cents 2400000. Levy credits
#              round_half_up(4000000 * 0.15) = 600000, which lands exactly on
#              the inclusive ADEQUATE boundary (600000 * 100 == 1000000 * 60)
#              and stamps due_date 2026-11-15 (levied 2026-10-01 + 45 days).
#              Delinquency becomes available on 2026-12-15 (due + 30 grace).
#
#   FULL_3     the same association and segment with three parcels —
#              P1 290 ft RESIDENTIAL_YEAR_ROUND 6 trips, P2 400 ft SEASONAL
#              3 trips, P3 250 ft AGRICULTURAL 6 trips — and an FY2027
#              FRONTAGE_WEIGHTED roll for 4000000 cents. Frontage share units
#              are 290 / 240 / 200 (U = 730) and no parcel touches the cap or
#              the floor, so the charges are 1589041 / 1315068 / 1095890,
#              total_levied_cents 3999999 and unallocated_residual_cents 1.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: annual_roll_method_variant_divergence_frontage_vs_trip
        grounds:
          - "calculations.annual_assessment_allocation"
          - "entities.AssessmentRoll.fields.method_variant"
          - "entities.AssessmentRoll.fields.unallocated_residual_cents"
          - "entities.Parcel.fields.frontage_share_units"
          - "entities.Parcel.fields.trip_share_units"
        distinguishing_aspect: >
          The same three parcels and the same 4000000-cent budget produce
          1589041 / 1315068 / 1095890 under FRONTAGE_WEIGHTED but
          1477798 / 1101243 / 1420959 under TRIP_GENERATION_WEIGHTED, because
          the trip variant never applies USAGE_MULTIPLIER: the SEASONAL 0.60
          discount and the AGRICULTURAL 0.80 discount vanish and are replaced by
          trips_per_day * 25 + frontage_feet * 0.20. The divergence is signed,
          not a uniform scale factor (P1 and P2 fall, P3 rises by 325069), and
          the two variants even leave different unallocated residuals (1 cent
          versus 0) because 4000000 splits evenly over 563 trip units but not
          over 730 frontage units.
        test_recipe:
          setup: |
            Build FULL_3 and levy the FY2027 FRONTAGE_WEIGHTED roll, then open a
            second, non-overlapping FY2028 roll over the same parcel set with
            method_variant TRIP_GENERATION_WEIGHTED and certify it. Both rolls
            now carry ANNUAL charges for the same three parcels, so the per-
            parcel amounts can be compared side by side, and
            GET /assessment-rolls/{roll_id}/method-comparison reports the
            divergence without mutating anything.
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: AssociationSecretary
            - call: "POST /associations"
              payload: { name: "Pine Hollow Road Association", reserve_target_cents: 1000000, default_voting_basis: "PER_PARCEL", delinquency_interest_basis: "STATUTORY", quorum_bps: 5000 }
              as: AssociationSecretary
              captures: { assoc_id: "$.data.id" }
            - call: "POST /road-segments"
              payload: { association_id: "${assoc_id}", name: "Pine Hollow Road", length_feet: 2400, width_feet: 22, max_grade_pct: 9, surface_type: "GRAVEL", turnout_count: 2, turnaround_present: true, bridge_present: false, culvert_count: 3 }
              as: RoadCommissioner
              captures: { seg_id: "$.data.id" }
            - call: "POST /parcels"
              payload: { road_segment_id: "${seg_id}", deed_book_page: "DB120-P41", frontage_feet: 290, usage_class: "RESIDENTIAL_YEAR_ROUND", trips_per_day: 6, covenant_recorded: true }
              as: AssociationSecretary
              captures: { p1_id: "$.data.id" }
            - call: "POST /parcels"
              payload: { road_segment_id: "${seg_id}", deed_book_page: "DB120-P42", frontage_feet: 400, usage_class: "SEASONAL", trips_per_day: 3, covenant_recorded: true }
              as: AssociationSecretary
              captures: { p2_id: "$.data.id" }
            - call: "POST /parcels"
              payload: { road_segment_id: "${seg_id}", deed_book_page: "DB120-P43", frontage_feet: 250, usage_class: "AGRICULTURAL", trips_per_day: 6, covenant_recorded: true }
              as: AssociationSecretary
              captures: { p3_id: "$.data.id" }
            - call: "POST /members"
              payload: { parcel_id: "${p1_id}", owner_name: "Ada Reyes", deed_book_page: "DB120-P41", deed_recorded_date: "2019-04-12" }
              as: AssociationSecretary
              captures: { m1_id: "$.data.id" }
            - call: "POST /members/${m1_id}/verify-deed"
              payload: { verified_deed_book_page: "DB120-P41" }
              as: AssociationSecretary
            - call: "POST /members"
              payload: { parcel_id: "${p2_id}", owner_name: "Boone Falk", deed_book_page: "DB120-P42", deed_recorded_date: "2020-06-30" }
              as: AssociationSecretary
              captures: { m2_id: "$.data.id" }
            - call: "POST /members/${m2_id}/verify-deed"
              payload: { verified_deed_book_page: "DB120-P42" }
              as: AssociationSecretary
            - call: "POST /members"
              payload: { parcel_id: "${p3_id}", owner_name: "Cyra Nolde", deed_book_page: "DB120-P43", deed_recorded_date: "2018-02-08" }
              as: AssociationSecretary
              captures: { m3_id: "$.data.id" }
            - call: "POST /members/${m3_id}/verify-deed"
              payload: { verified_deed_book_page: "DB120-P43" }
              as: AssociationSecretary
            - call: "POST /assessment-rolls"
              payload: { association_id: "${assoc_id}", fiscal_year: 2027, fy_start_date: "2026-10-01", fy_end_date: "2027-09-30", budget_requirement_cents: 4000000, method_variant: "FRONTAGE_WEIGHTED" }
              as: AssessmentClerk
              captures: { roll1_id: "$.data.id" }
            - call: "POST /assessment-rolls/${roll1_id}/certify"
              payload: {}
              as: AssessmentClerk
            - call: "POST /assessment-rolls/${roll1_id}/levy"
              payload: {}
              as: BoardTreasurer
            - call: "POST /assessment-rolls"
              payload: { association_id: "${assoc_id}", fiscal_year: 2028, fy_start_date: "2027-10-01", fy_end_date: "2028-09-30", budget_requirement_cents: 4000000, method_variant: "TRIP_GENERATION_WEIGHTED" }
              as: AssessmentClerk
              captures: { roll2_id: "$.data.id" }
          trigger:
            - call: "POST /assessment-rolls/${roll2_id}/certify"
              payload: {}
              as: AssessmentClerk
              captures: { roll2_units: "$.data.total_share_units", roll2_total: "$.data.total_levied_cents" }
            - call: "GET /assessment-charges?roll_id=${roll2_id}&parcel_id=${p1_id}"
              payload: {}
              as: AssessmentClerk
            - call: "GET /assessment-charges?roll_id=${roll2_id}&parcel_id=${p2_id}"
              payload: {}
              as: AssessmentClerk
            - call: "GET /assessment-charges?roll_id=${roll2_id}&parcel_id=${p3_id}"
              payload: {}
              as: AssessmentClerk
            - call: "GET /assessment-rolls/${roll2_id}/method-comparison"
              payload: {}
              as: AssessmentClerk
            - call: "GET /assessment-rolls/${roll1_id}"
              payload: {}
              as: AssessmentClerk
          assert:
            - "the FY2028 certify response has total_share_units == 563 (208 + 155 + 200) and status == CERTIFIED"
            - "FY2028 charge for P1 has amount_cents == 1477798 and share_units_snapshot == 208"
            - "FY2028 charge for P2 has amount_cents == 1101243 and share_units_snapshot == 155"
            - "FY2028 charge for P3 has amount_cents == 1420959 and share_units_snapshot == 200"
            - "FY2028 roll has total_levied_cents == 4000000 and unallocated_residual_cents == 0"
            - "FY2027 roll still has total_share_units == 730, total_levied_cents == 3999999 and unallocated_residual_cents == 1"
            - "the FY2027 charges are unchanged at 1589041 (P1), 1315068 (P2) and 1095890 (P3)"
            - "method-comparison returns frontage_weighted_total_cents == 3999999 and trip_generation_weighted_total_cents == 4000000"
            - "method-comparison returns frontage_weighted_unallocated_residual_cents == 1 and trip_generation_weighted_unallocated_residual_cents == 0"
            - "method-comparison returns divergent_parcel_count == 3 and max_absolute_divergence_cents == 325069 (P3 pays 325069 cents more under the trip variant)"
            - "per-parcel divergences are -111243 for P1, -213825 for P2 and +325069 for P3, so the variants are not related by any single scale factor"

      - name: lien_payoff_statutory_vs_association_policy_divergence
        grounds:
          - "calculations.lien_payoff_amount"
          - "entities.Association.fields.delinquency_interest_basis"
          - "entities.DelinquencyAction.fields.payoff_amount_cents"
          - "state_machines.DelinquencyAction.INITIATED_to_EFFECTIVE"
        distinguishing_aspect: >
          Two associations that differ in nothing but
          delinquency_interest_basis freeze the identical lien principal
          1589041 and quote different payoffs on the same 30th delinquent day:
          STATUTORY yields 1604714 (simple interest 1589041 * 0.12 * 30 / 365
          = 15673 after round_half_up, filing cost never added) while
          ASSOCIATION_POLICY yields 1621560 (filing cost added first, then
          compounded over floor(30 / 30) = 1 whole month:
          round_half_up((1589041 + 12500) * 1.0125)). The 16846-cent gap is not
          a rate difference alone — the policy branch steps on whole 30-day
          months, so on day 29 it would still quote the un-compounded base.
        test_recipe:
          setup: |
            Register association A with delinquency_interest_basis STATUTORY and
            association B with ASSOCIATION_POLICY, each with one segment, one
            290-ft RESIDENTIAL_YEAR_ROUND parcel and one verified member. Give
            each an FY2027 roll for 3972604 cents: the lone parcel is clamped to
            the per-parcel cap floor(0.40 * 3972604) = 1589041, so both
            associations end up with an identical charge principal. Levy on
            2026-10-01 (due_date 2026-11-15), advance the clock to 2026-12-15
            (30 days delinquent, exactly the end of the 30-day grace), and
            initiate a LIEN_FILING on each charge with treasurer bt-user-1.
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: AssociationSecretary
            - call: "POST /associations"
              payload: { name: "Statutory Ridge Road Association", reserve_target_cents: 1000000, default_voting_basis: "PER_PARCEL", delinquency_interest_basis: "STATUTORY", quorum_bps: 5000 }
              as: AssociationSecretary
              captures: { assoc_a: "$.data.id" }
            - call: "POST /associations"
              payload: { name: "Bluff Lane Road Association", reserve_target_cents: 1000000, default_voting_basis: "PER_PARCEL", delinquency_interest_basis: "ASSOCIATION_POLICY", quorum_bps: 5000 }
              as: AssociationSecretary
              captures: { assoc_b: "$.data.id" }
            - call: "POST /road-segments"
              payload: { association_id: "${assoc_a}", name: "Statutory Ridge", length_feet: 2400, width_feet: 22, max_grade_pct: 9, surface_type: "GRAVEL", turnout_count: 2, turnaround_present: true, bridge_present: false, culvert_count: 3 }
              as: RoadCommissioner
              captures: { seg_a: "$.data.id" }
            - call: "POST /road-segments"
              payload: { association_id: "${assoc_b}", name: "Bluff Lane", length_feet: 2400, width_feet: 22, max_grade_pct: 9, surface_type: "GRAVEL", turnout_count: 2, turnaround_present: true, bridge_present: false, culvert_count: 3 }
              as: RoadCommissioner
              captures: { seg_b: "$.data.id" }
            - call: "POST /parcels"
              payload: { road_segment_id: "${seg_a}", deed_book_page: "DB200-P11", frontage_feet: 290, usage_class: "RESIDENTIAL_YEAR_ROUND", trips_per_day: 6, covenant_recorded: true }
              as: AssociationSecretary
              captures: { pa_id: "$.data.id" }
            - call: "POST /parcels"
              payload: { road_segment_id: "${seg_b}", deed_book_page: "DB300-P11", frontage_feet: 290, usage_class: "RESIDENTIAL_YEAR_ROUND", trips_per_day: 6, covenant_recorded: true }
              as: AssociationSecretary
              captures: { pb_id: "$.data.id" }
            - call: "POST /members"
              payload: { parcel_id: "${pa_id}", owner_name: "Dov Achterberg", deed_book_page: "DB200-P11", deed_recorded_date: "2019-04-12" }
              as: AssociationSecretary
              captures: { ma_id: "$.data.id" }
            - call: "POST /members/${ma_id}/verify-deed"
              payload: { verified_deed_book_page: "DB200-P11" }
              as: AssociationSecretary
            - call: "POST /members"
              payload: { parcel_id: "${pb_id}", owner_name: "Elke Brandt", deed_book_page: "DB300-P11", deed_recorded_date: "2019-04-12" }
              as: AssociationSecretary
              captures: { mb_id: "$.data.id" }
            - call: "POST /members/${mb_id}/verify-deed"
              payload: { verified_deed_book_page: "DB300-P11" }
              as: AssociationSecretary
            - call: "POST /assessment-rolls"
              payload: { association_id: "${assoc_a}", fiscal_year: 2027, fy_start_date: "2026-10-01", fy_end_date: "2027-09-30", budget_requirement_cents: 3972604, method_variant: "FRONTAGE_WEIGHTED" }
              as: AssessmentClerk
              captures: { roll_a: "$.data.id" }
            - call: "POST /assessment-rolls/${roll_a}/certify"
              payload: {}
              as: AssessmentClerk
            - call: "POST /assessment-rolls/${roll_a}/levy"
              payload: {}
              as: BoardTreasurer
            - call: "POST /assessment-rolls"
              payload: { association_id: "${assoc_b}", fiscal_year: 2027, fy_start_date: "2026-10-01", fy_end_date: "2027-09-30", budget_requirement_cents: 3972604, method_variant: "FRONTAGE_WEIGHTED" }
              as: AssessmentClerk
              captures: { roll_b: "$.data.id" }
            - call: "POST /assessment-rolls/${roll_b}/certify"
              payload: {}
              as: AssessmentClerk
            - call: "POST /assessment-rolls/${roll_b}/levy"
              payload: {}
              as: BoardTreasurer
            - call: "GET /assessment-charges?roll_id=${roll_a}"
              payload: {}
              as: AssessmentClerk
              captures: { charge_a: "$.data[0].id" }
            - call: "GET /assessment-charges?roll_id=${roll_b}"
              payload: {}
              as: AssessmentClerk
              captures: { charge_b: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-15T00:00:00Z" }
              as: BoardTreasurer
            - call: "POST /assessment-charges/${charge_a}/delinquency-actions"
              payload: { action_type: "LIEN_FILING" }
              as: BoardTreasurer
              as_user_id: "bt-user-1"
              captures: { action_a: "$.data.id" }
            - call: "POST /assessment-charges/${charge_b}/delinquency-actions"
              payload: { action_type: "LIEN_FILING" }
              as: BoardTreasurer
              as_user_id: "bt-user-1"
              captures: { action_b: "$.data.id" }
          trigger:
            - call: "POST /delinquency-actions/${action_a}/effectuate"
              payload: {}
              as: BoardTreasurer
              as_user_id: "bt-user-2"
            - call: "POST /delinquency-actions/${action_b}/effectuate"
              payload: {}
              as: BoardTreasurer
              as_user_id: "bt-user-2"
          assert:
            - "both charges were certified at amount_cents == 1589041 (the cap floor(0.40 * 3972604)) with the roll reporting unallocated_residual_cents == 2383563"
            - "action A becomes EFFECTIVE with lien_amount_cents == 1589041 and payoff_amount_cents == 1604714"
            - "action B becomes EFFECTIVE with lien_amount_cents == 1589041 and payoff_amount_cents == 1621560"
            - "the two payoffs differ by exactly 16846 cents even though principal, days delinquent and clock are identical"
            - "the STATUTORY payoff excludes LIEN_FILING_COST_CENTS: 1604714 - 1589041 == 15673, which is not 12500 plus any interest"
            - "both members reach standing_status LIEN_FILED with encumbered_principal_cents == 1589041 and access_status UNRESTRICTED"

      - name: proposal_voting_basis_per_parcel_adopts_assessed_share_rejects
        grounds:
          - "calculations.member_voting_weight"
          - "calculations.vote_threshold_resolution"
          - "entities.SpecialAssessmentProposal.fields.voting_basis"
          - "state_machines.SpecialAssessmentProposal.BALLOTING_to_ADOPTED"
          - "state_machines.SpecialAssessmentProposal.BALLOTING_to_REJECTED"
        distinguishing_aspect: >
          The identical pair of ballots — P2's owner YES, P1's owner NO, P3's
          owner silent — adopts a PER_PARCEL proposal and rejects an
          ASSESSED_SHARE one. Under PER_PARCEL every membership weighs 1, so
          counted 2 and yes 1 satisfies the 5000-bps test at exact equality
          (1 * 10000 == 2 * 5000). Under ASSESSED_SHARE the weights become the
          newest certified annual charge in whole dollars — 15890 / 13150 /
          10958 — and the yes voter is the lighter of the two participants, so
          13150 * 10000 = 131500000 falls short of 29040 * 5000 = 145200000.
          A single voting_basis field, not the votes, decides the outcome.
        test_recipe:
          setup: |
            Build FULL_3 and levy the FY2027 roll so every member has a
            certified annual charge to weigh. Draft two GRADING proposals on the
            segment, each for 1500000 cents (below ESCALATION_COST_CENTS, and
            the post-levy reserve of 600000 is ADEQUATE, so both freeze
            required_threshold_bps at 5000) with cost_allocation_method
            EQUAL_SHARE; give proposal PA voting_basis PER_PARCEL and proposal
            PB voting_basis ASSESSED_SHARE. Open balloting on both with
            balloting_closes_at 2026-10-15T00:00:00Z, then have P2's owner vote
            YES and P1's owner vote NO on each, reading the proposal's version
            immediately before every cast so the OCC field is always fresh.
            Finally advance the clock to the close instant.
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: AssociationSecretary
            - call: "POST /associations"
              payload: { name: "Pine Hollow Road Association", reserve_target_cents: 1000000, default_voting_basis: "PER_PARCEL", delinquency_interest_basis: "STATUTORY", quorum_bps: 5000 }
              as: AssociationSecretary
              captures: { assoc_id: "$.data.id" }
            - call: "POST /road-segments"
              payload: { association_id: "${assoc_id}", name: "Pine Hollow Road", length_feet: 2400, width_feet: 22, max_grade_pct: 9, surface_type: "GRAVEL", turnout_count: 2, turnaround_present: true, bridge_present: false, culvert_count: 3 }
              as: RoadCommissioner
              captures: { seg_id: "$.data.id" }
            - call: "POST /parcels"
              payload: { road_segment_id: "${seg_id}", deed_book_page: "DB120-P41", frontage_feet: 290, usage_class: "RESIDENTIAL_YEAR_ROUND", trips_per_day: 6, covenant_recorded: true }
              as: AssociationSecretary
              captures: { p1_id: "$.data.id" }
            - call: "POST /parcels"
              payload: { road_segment_id: "${seg_id}", deed_book_page: "DB120-P42", frontage_feet: 400, usage_class: "SEASONAL", trips_per_day: 3, covenant_recorded: true }
              as: AssociationSecretary
              captures: { p2_id: "$.data.id" }
            - call: "POST /parcels"
              payload: { road_segment_id: "${seg_id}", deed_book_page: "DB120-P43", frontage_feet: 250, usage_class: "AGRICULTURAL", trips_per_day: 6, covenant_recorded: true }
              as: AssociationSecretary
              captures: { p3_id: "$.data.id" }
            - call: "POST /members"
              payload: { parcel_id: "${p1_id}", owner_name: "Ada Reyes", deed_book_page: "DB120-P41", deed_recorded_date: "2019-04-12" }
              as: AssociationSecretary
              captures: { m1_id: "$.data.id" }
            - call: "POST /members/${m1_id}/verify-deed"
              payload: { verified_deed_book_page: "DB120-P41" }
              as: AssociationSecretary
            - call: "POST /members"
              payload: { parcel_id: "${p2_id}", owner_name: "Boone Falk", deed_book_page: "DB120-P42", deed_recorded_date: "2020-06-30" }
              as: AssociationSecretary
              captures: { m2_id: "$.data.id" }
            - call: "POST /members/${m2_id}/verify-deed"
              payload: { verified_deed_book_page: "DB120-P42" }
              as: AssociationSecretary
            - call: "POST /members"
              payload: { parcel_id: "${p3_id}", owner_name: "Cyra Nolde", deed_book_page: "DB120-P43", deed_recorded_date: "2018-02-08" }
              as: AssociationSecretary
              captures: { m3_id: "$.data.id" }
            - call: "POST /members/${m3_id}/verify-deed"
              payload: { verified_deed_book_page: "DB120-P43" }
              as: AssociationSecretary
            - call: "POST /assessment-rolls"
              payload: { association_id: "${assoc_id}", fiscal_year: 2027, fy_start_date: "2026-10-01", fy_end_date: "2027-09-30", budget_requirement_cents: 4000000, method_variant: "FRONTAGE_WEIGHTED" }
              as: AssessmentClerk
              captures: { roll_id: "$.data.id" }
            - call: "POST /assessment-rolls/${roll_id}/certify"
              payload: {}
              as: AssessmentClerk
            - call: "POST /assessment-rolls/${roll_id}/levy"
              payload: {}
              as: BoardTreasurer
            - call: "POST /special-assessment-proposals"
              payload: { road_segment_id: "${seg_id}", project_type: "GRADING", title: "Regrade the hollow", estimated_cost_cents: 1500000, cost_allocation_method: "EQUAL_SHARE", voting_basis: "PER_PARCEL" }
              as: BoardTreasurer
              captures: { pa_id: "$.data.id" }
            - call: "POST /special-assessment-proposals"
              payload: { road_segment_id: "${seg_id}", project_type: "GRADING", title: "Regrade the hollow, assessed-share vote", estimated_cost_cents: 1500000, cost_allocation_method: "EQUAL_SHARE", voting_basis: "ASSESSED_SHARE" }
              as: BoardTreasurer
              captures: { pb_id: "$.data.id" }
            - call: "POST /special-assessment-proposals/${pa_id}/open-balloting"
              payload: { balloting_closes_at: "2026-10-15T00:00:00Z" }
              as: BoardTreasurer
            - call: "POST /special-assessment-proposals/${pb_id}/open-balloting"
              payload: { balloting_closes_at: "2026-10-15T00:00:00Z" }
              as: BoardTreasurer
            - call: "GET /special-assessment-proposals/${pa_id}"
              payload: {}
              as: BoardTreasurer
              captures: { pa_v1: "$.data.version", pa_eligible: "$.data.eligible_weight_total" }
            - call: "POST /ballots"
              payload: { proposal_id: "${pa_id}", member_id: "${m2_id}", choice: "YES", expected_proposal_version: "${pa_v1}" }
              as: MemberOwner
              as_user_id: "${m2_id}"
            - call: "GET /special-assessment-proposals/${pa_id}"
              payload: {}
              as: BoardTreasurer
              captures: { pa_v2: "$.data.version" }
            - call: "POST /ballots"
              payload: { proposal_id: "${pa_id}", member_id: "${m1_id}", choice: "NO", expected_proposal_version: "${pa_v2}" }
              as: MemberOwner
