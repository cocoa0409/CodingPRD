            - "end1 == 2027-06-30T00:00:00Z and nce1 == 1"
            - "rs2 == true and st2 == SPONSOR_REVIEW  (nce_count >= 1 forces sponsor route)"
            - "st3 == APPROVED and end2 == 2027-09-30T00:00:00Z and nce2 == 2"

      - name: closeout_happy_path_with_residual_deobligation
