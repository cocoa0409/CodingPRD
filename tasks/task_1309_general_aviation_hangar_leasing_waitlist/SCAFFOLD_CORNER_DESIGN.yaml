              payload: { airport_id: "${ap_sa}", size_class: "T_HANGAR", monthly_rate_cents: 90000, effective_from: "2026-07-01T00:00:00Z", effective_to: "OPEN"  }
              as: AirportManager
            - call: "POST /hangars"
              payload: { airport_id: "${ap_sa}", hangar_code: "T-140", size_class: "T_HANGAR", door_type: "SLIDING"  }
              as: AirportManager
              captures: { h_sa: $.data.id }
