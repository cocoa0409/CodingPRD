# =============================================================================
# Task 1709 — Financial Literacy Workshop & Coaching Nonprofit (financial
# empowerment center). Seed tables: §1.0–§1.7.
# =============================================================================

scenario: |
  Financial Literacy Workshop & Coaching Nonprofit (financial empowerment center): curriculum module & workshop calendar, participant registration & attendance-based incentives, one-on-one coaching intake & budget/credit goal plan, credit score & savings outcome tracking over time, matched savings program administration, referral network to lenders & assistance programs, funder outcome reporting, coach certification & caseload

domain_name: financial-empowerment-center
api_prefix: ""

complexity_profile:
  primary_archetype: quota_allocation        # workshop seats + matched-savings pool funds
  secondary_archetype: compliance_audit      # coach certification gating, funder reporting windows
  complexity_layers:
    - optimistic_concurrency                 # OCC on CoachingCase.version and Workshop.version
    - cascading_side_effects                 # coach-suspend depth-3 chain; cancel-promotion chain
    - rate_threshold_triggers                # no-show strike limit; completion-bonus threshold
    - derived_field_reconciliation           # confirmed_count, active_caseload, pool fund splits
  entity_topology: flat                      # peer entities with FK references, no nested URL paths
  state_machine_shape: branching             # CoachingCase forks/reverts/cycles; Coach is cyclic
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: hierarchical_override          # ProgramAdmin superset; Coach & Participant peer scopes
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology; FKs carry canonical prefix)
# =============================================================================
entities:
  - name: CurriculumModule
    parent: null
    common_fields: true
    fields:
      - { name: module_code, type: string, source: input, description: "Unique module code, e.g. BF-101", constraints: "unique across all modules (ERR_MODULE_CODE_TAKEN)" }
      - { name: title, type: string, source: input, description: "Module title" }
      - { name: session_count, type: integer, source: input, description: "Number of sessions in the full module series", constraints: ">= 1" }
      - { name: incentive_cents_per_hour, type: integer, source: input, description: "Attendance incentive rate per workshop hour, in cents", constraints: ">= 0" }
      - { name: completion_bonus_cents, type: integer, source: input, description: "One-time bonus when a participant reaches completion_threshold attended sessions of this module", constraints: ">= 0" }
      - { name: completion_threshold, type: integer, source: input, description: "Attended sessions of this module needed to earn the completion bonus", constraints: ">= 1 and <= session_count" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED", default: ACTIVE }

  - name: Coach
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Coach full name" }
      - { name: email, type: string, source: input, description: "Coach email", constraints: "unique (ERR_DUPLICATE_EMAIL)" }
      - { name: max_caseload, type: integer, source: input, description: "Maximum number of open (non-terminal) coaching cases the coach may hold", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "CANDIDATE | CERTIFIED | SUSPENDED | LAPSED" }
      - { name: certification_expires_at, type: datetime, source: system, description: "Set to certification time + 365 days on certify/reinstate; null while CANDIDATE" }
      - { name: active_caseload, type: integer, source: computed, description: "Count of CoachingCase with coach_id == this coach and status IN {INTAKE, PLAN_DRAFT, PLAN_ACTIVE, ON_HOLD}" }

  - name: Participant
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Participant full name" }
      - { name: email, type: string, source: input, description: "Participant email", constraints: "unique (ERR_DUPLICATE_EMAIL)" }
      - { name: annual_income_cents, type: integer, source: input, description: "Annual household income in cents; drives match-rate tier", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RESTRICTED | EXITED", default: ACTIVE }
      - { name: no_show_count, type: integer, source: system, description: "Cumulative NO_SHOW marks; reaching NO_SHOW_LIMIT (3) flips status to RESTRICTED", default: 0 }

  - name: Workshop
    parent: null
    common_fields: true
    fields:
      - { name: module_id, type: string, source: input, description: "FK -> CurriculumModule.id; module must be status ACTIVE" }
      - { name: coach_id, type: string, source: input, description: "FK -> Coach.id; coach must be status CERTIFIED at creation" }
      - { name: location, type: string, source: input, description: "Room / venue label" }
      - { name: start_at, type: datetime, source: input, description: "Session start (ISO8601 UTC)" }
      - { name: end_at, type: datetime, source: input, description: "Session end; must be strictly after start_at (ERR_INVALID_REQUEST)" }
      - { name: capacity, type: integer, source: input, description: "Maximum REGISTERED registrations", constraints: ">= 1" }
      - { name: confirmed_count, type: integer, source: computed, description: "Count of registrations with status REGISTERED on this workshop", default: 0 }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CANCELLED", default: SCHEDULED }

  - name: Registration
    parent: null
    common_fields: true
    fields:
      - { name: workshop_id, type: string, source: input, description: "FK -> Workshop.id" }
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id" }
      - { name: status, type: enum, source: system, description: "REGISTERED | WAITLISTED | ATTENDED | NO_SHOW | CANCELLED" }
      - { name: waitlist_position, type: integer, source: system, description: "Assigned when status becomes WAITLISTED: max(existing waitlist_position on this workshop, default 0) + 1; null while REGISTERED; cleared on promotion; promotion selects lowest waitlist_position" }
      - { name: incentive_earned_cents, type: integer, source: computed, description: "Set on ATTENDED: round_half_up(module.incentive_cents_per_hour x workshop duration in hours); client input ignored", default: 0 }

  - name: CoachingCase
    parent: null
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id" }
      - { name: coach_id, type: string, source: input, description: "FK -> Coach.id; must be CERTIFIED with caseload room at creation" }
      - { name: intake_date, type: string, source: input, description: "Intake date (YYYY-MM-DD); anchors funder-report cohort membership" }
      - { name: status, type: enum, source: system, description: "INTAKE | PLAN_DRAFT | PLAN_ACTIVE | ON_HOLD | PLAN_STALLED | COMPLETED | EXITED" }

  - name: GoalPlan
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> CoachingCase.id; case must be PLAN_DRAFT at creation" }
      - { name: monthly_savings_goal_cents, type: integer, source: input, description: "Budget-plan monthly savings target", constraints: "> 0" }
      - { name: credit_score_target, type: integer, source: input, description: "Credit-score goal", constraints: "300..850" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | FROZEN | SUPERSEDED | ACHIEVED" }
      - { name: plan_sequence, type: integer, source: system, description: "1 + count of prior GoalPlans for the case; monotonic per case" }

  - name: OutcomeSnapshot
    parent: null
    common_fields: false   # append-only event log: id + created_at only; no version/updated_at
    fields:
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id" }
      - { name: recorded_at, type: datetime, source: input, description: "When the measurement was taken (ISO8601 UTC); drives chronological ordering" }
      - { name: credit_score, type: integer, source: input, description: "Credit score 300..850; optional, but at least one of credit_score / savings_balance_cents required", constraints: "300..850" }
      - { name: savings_balance_cents, type: integer, source: input, description: "Observed savings balance; optional", constraints: ">= 0" }

  - name: MatchPool
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Pool name (program cohort label)" }
      - { name: total_funded_cents, type: integer, source: input, description: "Total funds ever committed to the pool; constant after creation", constraints: "> 0" }
      - { name: income_threshold_cents, type: integer, source: input, description: "Participants with annual_income_cents BELOW this get match_ratio_below; at-or-above get match_ratio_above" }
      - { name: match_ratio_below, type: number, source: input, description: "Match multiplier for below-threshold income tier (e.g. 0.5)" }
      - { name: match_ratio_above, type: number, source: input, description: "Match multiplier for at-or-above-threshold tier (e.g. 0.25)" }
      - { name: per_participant_cap_cents, type: integer, source: input, description: "Maximum match any single enrollment may accrue", constraints: "> 0" }
      - { name: uncommitted_cents, type: integer, source: computed, description: "total_funded_cents - accrued outstanding - paid_out_cents; debited by deposit accrual, credited by forfeit", default: "equals total_funded_cents at creation" }
      - { name: paid_out_cents, type: integer, source: computed, description: "Cumulative match dollars paid out", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE | CLOSED", default: ACTIVE }

  - name: MatchEnrollment
    parent: null
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id" }
      - { name: pool_id, type: string, source: input, description: "FK -> MatchPool.id; pool must be ACTIVE with uncommitted_cents >= per_participant_cap_cents" }
      - { name: goal_plan_id, type: string, source: input, description: "FK -> GoalPlan.id; plan must be status ACTIVE at creation (ERR_PLAN_NOT_ACTIVE)" }
      - { name: savings_goal_cents, type: integer, source: input, description: "Participant savings goal; GOAL_MET when total_deposited_cents >= savings_goal_cents", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | MATCH_PAUSED | GOAL_MET | PAID_OUT | FORFEITED" }
      - { name: total_deposited_cents, type: integer, source: computed, description: "Sum of accepted deposit amount_cents", default: 0 }
      - { name: accrued_unpaid_cents, type: integer, source: computed, description: "Match accrued but not yet paid/forfeited", default: 0 }

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id" }
      - { name: coach_id, type: string, source: input, description: "FK -> Coach.id; the referring coach" }
      - { name: partner_name, type: string, source: input, description: "Lender or assistance-program name" }
      - { name: partner_type, type: enum, source: input, description: "LENDER | ASSISTANCE_PROGRAM" }
      - { name: status, type: enum, source: system, description: "SENT | ACCEPTED | DECLINED | COMPLETED | EXPIRED" }
      - { name: sent_at, type: datetime, source: system, description: "Logical-clock time at creation" }
      - { name: expires_at, type: datetime, source: computed, description: "sent_at + 30 days (REFERRAL_TTL_DAYS)" }

  - name: FunderReport
    parent: null
    common_fields: false   # computed once at creation; immutable snapshot
    fields:
      - { name: period_start, type: string, source: input, description: "Report period start date (YYYY-MM-DD, inclusive)" }
      - { name: period_end, type: string, source: input, description: "Report period end date (YYYY-MM-DD, exclusive); must be after period_start" }
      - { name: variant, type: enum, source: input, description: "COHORT | ROLLING — selects the inclusion set (see funder_outcome_aggregation)" }
      - { name: participants_measured, type: integer, source: computed, description: "Qualifying participants with >= 2 in-period credit snapshots (or savings snapshots for savings average)" }
      - { name: avg_credit_delta_points, type: number, source: computed, description: "Mean per-participant credit delta over the inclusion set; 1 decimal, round_half_up; null when empty" }
      - { name: avg_savings_delta_cents, type: integer, source: computed, description: "Mean per-participant savings delta; round_half_up to integer cents; null when empty" }
      - { name: completions_count, type: integer, source: computed, description: "CoachingCases whose COMPLETED transition fell inside [period_start, period_end) per the logical clock at transition time" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: CurriculumModule
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /curriculum-modules/{id}/retire"
        actor: ProgramAdmin
        preconditions: ["module status == ACTIVE (else ERR_INVALID_STATE)"]
        side_effects: ["Existing workshops unaffected; new workshops referencing this module rejected (ERR_MODULE_RETIRED)"]

  - entity: Coach
    initial_state: CANDIDATE
    terminal_states: []
    transitions:
      - from: CANDIDATE
        to: CERTIFIED
        trigger: "POST /coaches/{id}/certify"
        actor: ProgramAdmin
        preconditions: ["coach status == CANDIDATE (else ERR_INVALID_STATE)"]
        side_effects: ["certification_expires_at = logical_now + 365 days"]
      - from: CERTIFIED
        to: SUSPENDED
        trigger: "POST /coaches/{id}/suspend"
        actor: ProgramAdmin
        preconditions: ["coach status == CERTIFIED (else ERR_INVALID_STATE)"]
        side_effects:
          - "LINK 1: every CoachingCase with coach_id == this coach and status IN {INTAKE, PLAN_DRAFT, PLAN_ACTIVE} transitions to PLAN_STALLED"
          - "LINK 2: each CoachingCase entering PLAN_STALLED transitions its GoalPlan (goal_plan.case_id == case.id AND status == ACTIVE) to FROZEN"
          - "LINK 3: each GoalPlan entering FROZEN transitions the MatchEnrollment with goal_plan_id == plan.id and status == ACTIVE to MATCH_PAUSED (deposits rejected while paused)"
          - "coach.active_caseload recomputed (PLAN_STALLED excluded, so it drops by the number of stalled cases)"
      - from: CERTIFIED
        to: LAPSED
        trigger: "system (lazy sweep: applied when the coach is read or written and logical_now >= certification_expires_at)"
        actor: system
        preconditions: ["coach status == CERTIFIED", "logical_now >= certification_expires_at"]
        side_effects: ["Same LINK 1-3 cascade as CERTIFIED -> SUSPENDED"]
      - from: SUSPENDED
        to: CERTIFIED
        trigger: "POST /coaches/{id}/reinstate"
        actor: ProgramAdmin
        preconditions: ["coach status IN {SUSPENDED, LAPSED} (else ERR_INVALID_STATE)"]
        side_effects: ["certification_expires_at = logical_now + 365 days", "PLAN_STALLED cases are NOT auto-restored; they require explicit reassignment via case transition to INTAKE with new_coach_id"]
      - from: LAPSED
        to: CERTIFIED
        trigger: "POST /coaches/{id}/reinstate"
        actor: ProgramAdmin
        preconditions: ["coach status IN {SUSPENDED, LAPSED} (else ERR_INVALID_STATE)"]
        side_effects: ["certification_expires_at = logical_now + 365 days"]

  - entity: Participant
    initial_state: ACTIVE
    terminal_states: [EXITED]
    transitions:
      - from: ACTIVE
        to: RESTRICTED
        trigger: "system (automatic when no_show_count reaches NO_SHOW_LIMIT = 3 after a NO_SHOW mark)"
        actor: system
        preconditions: ["no_show_count >= 3"]
        side_effects: ["New registrations for this participant rejected with ERR_PARTICIPANT_RESTRICTED; existing registrations unaffected"]
      - from: RESTRICTED
        to: ACTIVE
        trigger: "POST /participants/{id}/clear-restriction"
        actor: ProgramAdmin
        preconditions: ["participant status == RESTRICTED (else ERR_INVALID_STATE)"]
        side_effects: ["no_show_count reset to 0"]
      - from: ACTIVE
        to: EXITED
        trigger: "POST /participants/{id}/exit"
        actor: ProgramAdmin
        preconditions: ["participant status IN {ACTIVE, RESTRICTED}"]
        side_effects: ["Open CoachingCases (non-terminal) transition to EXITED"]
      - from: RESTRICTED
        to: EXITED
        trigger: "POST /participants/{id}/exit"
        actor: ProgramAdmin
        preconditions: ["participant status IN {ACTIVE, RESTRICTED}"]
        side_effects: ["Open CoachingCases (non-terminal) transition to EXITED"]

  - entity: Workshop
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /workshops/{id}/cancel"
        actor: ProgramAdmin
        preconditions: ["workshop status == SCHEDULED (else ERR_INVALID_STATE)"]
        side_effects:
          - "Every registration with status REGISTERED or WAITLISTED transitions to CANCELLED; confirmed_count recomputed to 0"
          - "No waitlist promotion runs (the workshop itself is gone)"

  - entity: Registration
    initial_state: REGISTERED   # or WAITLISTED when the workshop is full at creation
    terminal_states: [ATTENDED, NO_SHOW, CANCELLED]
    transitions:
      - from: REGISTERED
        to: CANCELLED
        trigger: "POST /registrations/{id}/cancel"
        actor: "ProgramAdmin, or Participant owning the registration"
        preconditions: ["registration status IN {REGISTERED, WAITLISTED} (else ERR_INVALID_STATE)"]
        side_effects:
          - "LINK 1: workshop.confirmed_count -= 1 (seat freed)"
          - "LINK 2 (promotion, caused by LINK 1's freed seat): if the workshop is still SCHEDULED and logical_now < workshop.start_at, the WAITLISTED registration on this workshop with the LOWEST waitlist_position whose participant is status ACTIVE and passes the buffered-overlap check transitions to REGISTERED (waitlist_position cleared); workshop.confirmed_count += 1. Ineligible entries are skipped (stay WAITLISTED); scan continues to the next-lowest position."
      - from: WAITLISTED
        to: CANCELLED
        trigger: "POST /registrations/{id}/cancel"
        actor: "ProgramAdmin, or Participant owning the registration"
        preconditions: ["registration status IN {REGISTERED, WAITLISTED} (else ERR_INVALID_STATE)"]
        side_effects: ["No confirmed_count change; remaining waitlist positions unchanged (positions are not renumbered)"]
      - from: WAITLISTED
        to: REGISTERED
        trigger: "system (promotion caused by a REGISTERED cancellation freeing a seat)"
        actor: system
        preconditions: ["lowest eligible waitlist_position on the workshop", "workshop SCHEDULED", "logical_now < workshop.start_at"]
        side_effects: ["waitlist_position cleared", "workshop.confirmed_count += 1"]
      - from: REGISTERED
        to: ATTENDED
        trigger: "POST /registrations/{id}/mark-attendance with outcome=ATTENDED"
        actor: "ProgramAdmin, or Coach assigned to the workshop"
        preconditions: ["registration status == REGISTERED (else ERR_INVALID_STATE)", "workshop status == SCHEDULED (else ERR_INVALID_STATE)", "logical_now >= workshop.start_at (else ERR_WORKSHOP_NOT_STARTED)"]
        side_effects: ["incentive_earned_cents = round_half_up(module.incentive_cents_per_hour x (workshop.end_at - workshop.start_at) in hours); see session_incentive"]
      - from: REGISTERED
        to: NO_SHOW
        trigger: "POST /registrations/{id}/mark-attendance with outcome=NO_SHOW"
        actor: "ProgramAdmin, or Coach assigned to the workshop"
        preconditions: ["registration status == REGISTERED (else ERR_INVALID_STATE)", "workshop status == SCHEDULED (else ERR_INVALID_STATE)", "logical_now >= workshop.start_at (else ERR_WORKSHOP_NOT_STARTED)"]
        side_effects:
          - "participant.no_show_count += 1"
          - "if no_show_count reaches NO_SHOW_LIMIT (3): participant transitions ACTIVE -> RESTRICTED"

  - entity: CoachingCase
    initial_state: INTAKE
    terminal_states: [COMPLETED, EXITED]
    transitions:
      - from: INTAKE
        to: PLAN_DRAFT
        trigger: "POST /coaching-cases/{id}/transition {target_state: PLAN_DRAFT}"
        actor: "ProgramAdmin, or Coach owning the case"
        preconditions: ["case status == INTAKE (else ERR_INVALID_TRANSITION)", "assigned coach status == CERTIFIED (else ERR_COACH_NOT_CERTIFIED)"]
        side_effects: []
      - from: PLAN_DRAFT
        to: INTAKE
        trigger: "POST /coaching-cases/{id}/transition {target_state: INTAKE}"
        actor: "ProgramAdmin, or Coach owning the case"
        preconditions: ["case status == PLAN_DRAFT (else ERR_INVALID_TRANSITION)"]
        side_effects: ["Existing DRAFT GoalPlans remain DRAFT (revision loop)"]
      - from: PLAN_DRAFT
        to: PLAN_ACTIVE
        trigger: "POST /coaching-cases/{id}/transition {target_state: PLAN_ACTIVE}"
        actor: "ProgramAdmin, or Coach owning the case"
        preconditions: ["case status == PLAN_DRAFT (else ERR_INVALID_TRANSITION)", "a GoalPlan with case_id == case.id and status == DRAFT exists (else ERR_PLAN_REQUIRED)"]
        side_effects: ["That GoalPlan transitions DRAFT -> ACTIVE"]
      - from: PLAN_ACTIVE
        to: ON_HOLD
        trigger: "POST /coaching-cases/{id}/transition {target_state: ON_HOLD}"
        actor: "ProgramAdmin, or Coach owning the case"
        preconditions: ["case status == PLAN_ACTIVE (else ERR_INVALID_TRANSITION)"]
        side_effects: ["Case's ACTIVE GoalPlan transitions to FROZEN; that freeze transitions the linked MatchEnrollment (goal_plan_id == plan.id, status ACTIVE) to MATCH_PAUSED"]
      - from: ON_HOLD
        to: PLAN_ACTIVE
        trigger: "POST /coaching-cases/{id}/transition {target_state: PLAN_ACTIVE}"
        actor: "ProgramAdmin, or Coach owning the case"
        preconditions: ["case status == ON_HOLD (else ERR_INVALID_TRANSITION)", "assigned coach status == CERTIFIED (else ERR_COACH_NOT_CERTIFIED)"]
        side_effects: ["Case's FROZEN GoalPlan transitions to ACTIVE; that activation transitions the linked MatchEnrollment (status MATCH_PAUSED) back to ACTIVE"]
      - from: PLAN_STALLED
        to: INTAKE
        trigger: "POST /coaching-cases/{id}/transition {target_state: INTAKE, new_coach_id: <coachId>}"
        actor: "ProgramAdmin, or Coach taking over the case"
        preconditions: ["case status == PLAN_STALLED (else ERR_INVALID_TRANSITION)", "new_coach_id present (else ERR_INVALID_REQUEST)", "new coach status == CERTIFIED (else ERR_COACH_NOT_CERTIFIED)", "new coach active_caseload < max_caseload (else ERR_CASELOAD_FULL)"]
        side_effects: ["coach_id reassigned to new_coach_id", "FROZEN GoalPlan stays FROZEN until the case again reaches PLAN_ACTIVE"]
      - from: PLAN_ACTIVE
        to: COMPLETED
        trigger: "POST /coaching-cases/{id}/transition {target_state: COMPLETED}"
        actor: "ProgramAdmin, or Coach owning the case"
        preconditions: ["case status == PLAN_ACTIVE (else ERR_INVALID_TRANSITION)", "at least one OutcomeSnapshot exists for the participant (else ERR_OUTCOME_REQUIRED)"]
        side_effects: ["Case's ACTIVE GoalPlan transitions to ACHIEVED"]
      - from: INTAKE
        to: EXITED
        trigger: "POST /coaching-cases/{id}/transition {target_state: EXITED}"
        actor: "ProgramAdmin, or Coach owning the case"
        preconditions: ["case status IN {INTAKE, PLAN_DRAFT, PLAN_ACTIVE, ON_HOLD, PLAN_STALLED} (else ERR_INVALID_TRANSITION)"]
        side_effects: ["ACTIVE/FROZEN GoalPlan transitions to SUPERSEDED; linked non-terminal MatchEnrollment unchanged"]
      - from: PLAN_DRAFT
        to: EXITED
        trigger: "POST /coaching-cases/{id}/transition {target_state: EXITED}"
        actor: "ProgramAdmin, or Coach owning the case"
        preconditions: ["case status IN {INTAKE, PLAN_DRAFT, PLAN_ACTIVE, ON_HOLD, PLAN_STALLED} (else ERR_INVALID_TRANSITION)"]
        side_effects: ["Same as INTAKE -> EXITED"]
      - from: PLAN_ACTIVE
        to: EXITED
        trigger: "POST /coaching-cases/{id}/transition {target_state: EXITED}"
        actor: "ProgramAdmin, or Coach owning the case"
        preconditions: ["case status IN {INTAKE, PLAN_DRAFT, PLAN_ACTIVE, ON_HOLD, PLAN_STALLED} (else ERR_INVALID_TRANSITION)"]
        side_effects: ["Same as INTAKE -> EXITED"]
      - from: ON_HOLD
        to: EXITED
        trigger: "POST /coaching-cases/{id}/transition {target_state: EXITED}"
        actor: "ProgramAdmin, or Coach owning the case"
        preconditions: ["case status IN {INTAKE, PLAN_DRAFT, PLAN_ACTIVE, ON_HOLD, PLAN_STALLED} (else ERR_INVALID_TRANSITION)"]
        side_effects: ["Same as INTAKE -> EXITED"]
      - from: PLAN_STALLED
        to: EXITED
        trigger: "POST /coaching-cases/{id}/transition {target_state: EXITED}"
        actor: "ProgramAdmin, or Coach owning the case"
        preconditions: ["case status IN {INTAKE, PLAN_DRAFT, PLAN_ACTIVE, ON_HOLD, PLAN_STALLED} (else ERR_INVALID_TRANSITION)"]
        side_effects: ["Same as INTAKE -> EXITED"]
      - from: INTAKE
        to: PLAN_STALLED
        trigger: "system (cascade from assigned coach losing certification: SUSPENDED or LAPSED)"
        actor: system
        preconditions: ["assigned coach transitioned to SUSPENDED or LAPSED", "case status IN {INTAKE, PLAN_DRAFT, PLAN_ACTIVE}"]
        side_effects: ["ACTIVE GoalPlan -> FROZEN; that freeze pauses the linked MatchEnrollment (ACTIVE -> MATCH_PAUSED)"]
      - from: PLAN_DRAFT
        to: PLAN_STALLED
        trigger: "system (cascade from assigned coach losing certification)"
        actor: system
        preconditions: ["assigned coach transitioned to SUSPENDED or LAPSED", "case status IN {INTAKE, PLAN_DRAFT, PLAN_ACTIVE}"]
        side_effects: ["Same as INTAKE -> PLAN_STALLED"]
      - from: PLAN_ACTIVE
        to: PLAN_STALLED
        trigger: "system (cascade from assigned coach losing certification)"
        actor: system
        preconditions: ["assigned coach transitioned to SUSPENDED or LAPSED", "case status IN {INTAKE, PLAN_DRAFT, PLAN_ACTIVE}"]
        side_effects: ["Same as INTAKE -> PLAN_STALLED"]

  - entity: GoalPlan
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, ACHIEVED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "system (case transition PLAN_DRAFT -> PLAN_ACTIVE)"
        actor: system
        preconditions: ["owning case entering PLAN_ACTIVE"]
        side_effects: []
      - from: ACTIVE
        to: FROZEN
        trigger: "system (case -> ON_HOLD or -> PLAN_STALLED)"
        actor: system
        preconditions: ["owning case entering ON_HOLD or PLAN_STALLED"]
        side_effects: ["Linked MatchEnrollment (goal_plan_id == plan.id, status ACTIVE) transitions to MATCH_PAUSED"]
      - from: FROZEN
        to: ACTIVE
        trigger: "system (case ON_HOLD -> PLAN_ACTIVE)"
        actor: system
        preconditions: ["owning case resuming from ON_HOLD"]
        side_effects: ["Linked MatchEnrollment (status MATCH_PAUSED) transitions back to ACTIVE"]
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (a new GoalPlan is created for the same case)"
        actor: system
        preconditions: ["new GoalPlan created for the case"]
        side_effects: []
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (case EXITED)"
        actor: system
        preconditions: ["owning case transitions to EXITED"]
        side_effects: []
      - from: FROZEN
        to: SUPERSEDED
        trigger: "system (case EXITED)"
        actor: system
        preconditions: ["owning case transitions to EXITED"]
        side_effects: []
      - from: ACTIVE
        to: ACHIEVED
        trigger: "system (case -> COMPLETED)"
        actor: system
        preconditions: ["owning case entering COMPLETED"]
        side_effects: []

  - entity: MatchEnrollment
    initial_state: ACTIVE
    terminal_states: [PAID_OUT, FORFEITED]
    transitions:
      - from: ACTIVE
        to: GOAL_MET
        trigger: "system (after a deposit, when total_deposited_cents >= savings_goal_cents)"
        actor: system
        preconditions: ["deposit accepted", "total_deposited_cents >= savings_goal_cents"]
        side_effects: []
      - from: ACTIVE
        to: MATCH_PAUSED
        trigger: "system (linked GoalPlan ACTIVE -> FROZEN)"
        actor: system
        preconditions: ["linked plan froze"]
        side_effects: ["Deposits rejected with ERR_ENROLLMENT_NOT_ACTIVE while paused"]
      - from: MATCH_PAUSED
        to: ACTIVE
        trigger: "system (linked GoalPlan FROZEN -> ACTIVE)"
        actor: system
        preconditions: ["linked plan reactivated"]
        side_effects: []
      - from: GOAL_MET
        to: PAID_OUT
        trigger: "POST /match-enrollments/{id}/payout"
        actor: ProgramAdmin
        preconditions: ["enrollment status == GOAL_MET (else ERR_GOAL_NOT_MET)"]
        side_effects: ["pool.paid_out_cents += accrued_unpaid_cents", "accrued_unpaid_cents = 0", "Conservation: pool.total_funded_cents == uncommitted_cents + sum(accrued_unpaid_cents over non-terminal enrollments) + paid_out_cents is preserved"]
      - from: ACTIVE
        to: FORFEITED
        trigger: "POST /match-enrollments/{id}/forfeit"
        actor: ProgramAdmin
        preconditions: ["enrollment status IN {ACTIVE, MATCH_PAUSED, GOAL_MET} (else ERR_INVALID_STATE)"]
        side_effects: ["pool.uncommitted_cents += accrued_unpaid_cents", "accrued_unpaid_cents = 0", "Conservation formula preserved (accrual moves back to uncommitted)"]
      - from: MATCH_PAUSED
        to: FORFEITED
        trigger: "POST /match-enrollments/{id}/forfeit"
        actor: ProgramAdmin
        preconditions: ["enrollment status IN {ACTIVE, MATCH_PAUSED, GOAL_MET} (else ERR_INVALID_STATE)"]
        side_effects: ["Same as ACTIVE -> FORFEITED"]
      - from: GOAL_MET
        to: FORFEITED
        trigger: "POST /match-enrollments/{id}/forfeit"
        actor: ProgramAdmin
        preconditions: ["enrollment status IN {ACTIVE, MATCH_PAUSED, GOAL_MET} (else ERR_INVALID_STATE)"]
        side_effects: ["Same as ACTIVE -> FORFEITED"]

  - entity: MatchPool
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /match-pools/{id}/close"
        actor: ProgramAdmin
        preconditions: ["pool status == ACTIVE (else ERR_INVALID_STATE)", "no enrollments in status ACTIVE, MATCH_PAUSED, or GOAL_MET (else ERR_POOL_HAS_OPEN_ENROLLMENTS)"]
        side_effects: ["No new enrollments against this pool"]

  - entity: Referral
    initial_state: SENT
    terminal_states: [DECLINED, COMPLETED, EXPIRED]
    transitions:
      - from: SENT
        to: ACCEPTED
        trigger: "POST /referrals/{id}/transition {target_state: ACCEPTED}"
        actor: "ProgramAdmin, or Coach who created the referral"
        preconditions: ["referral status == SENT (else ERR_INVALID_TRANSITION)", "logical_now < expires_at (else lazy-swept to EXPIRED first)"]
        side_effects: []
      - from: SENT
        to: DECLINED
        trigger: "POST /referrals/{id}/transition {target_state: DECLINED}"
        actor: "ProgramAdmin, or Coach who created the referral"
        preconditions: ["referral status == SENT (else ERR_INVALID_TRANSITION)"]
        side_effects: []
      - from: SENT
        to: EXPIRED
        trigger: "system (lazy sweep: applied when the referral is read or written and logical_now >= expires_at)"
        actor: system
        preconditions: ["referral status == SENT", "logical_now >= expires_at"]
        side_effects: []
      - from: ACCEPTED
        to: COMPLETED
        trigger: "POST /referrals/{id}/transition {target_state: COMPLETED}"
        actor: "ProgramAdmin, or Coach who created the referral"
        preconditions: ["referral status == ACCEPTED (else ERR_INVALID_TRANSITION)"]
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only; all other write-write conflicts reduce
# to state preconditions in §1.2 / §1.4)
# =============================================================================
concurrency_rules:
  - rule_id: goal-plan-create-stale-case
    parent_entity: CoachingCase
    write_endpoint: "POST /goal-plans"
    occ_field: expected_case_version
    description: |
      Creating a GoalPlan against a CoachingCase whose version has advanced
      since the client last observed it is rejected. A new plan legitimately
      supersedes the case's prior DRAFT plan, so a writer holding a stale
      case version must re-read before superseding.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: workshop-reschedule-stale-version
    parent_entity: Workshop
    write_endpoint: "PATCH /workshops/{id}"
    occ_field: expected_workshop_version
    description: |
      Rescheduling or re-capacitating a Workshop whose version has advanced
      since the client last observed it is rejected. A reschedule is always
      state-legal while the workshop is SCHEDULED, so the only guard against
      editing from a stale view is the OCC version check.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: session_incentive
    trigger: "registration ATTENDED transition; GET /participants/{id}/incentive-summary"
    algorithm: aggregation
    formula: |
      duration_hours = (workshop.end_at - workshop.start_at) / 3600   # exact rational
      per_session = round_half_up(module.incentive_cents_per_hour * duration_hours)   # integer cents
      earned_cents   = SUM(per_session) over the participant's ATTENDED registrations
                     + SUM(module.completion_bonus_cents) over modules where
                       count(ATTENDED registrations of that module) >= module.completion_threshold   # bonus once per module
      # ROUNDING ORDER IS PINNED: round each per-session line to integer cents FIRST,
      # then sum. Sum-then-round is a different (wrong) algorithm.
    input_set: "Registrations of the participant with status ATTENDED (earned) — terminal CANCELLED/NO_SHOW excluded"
    constants:
      NO_SHOW_LIMIT: 3
    precision: "integer cents, round_half_up per session line before summing"
    variants:
      - name: earned
        when: "default; chronologically accrued incentives only"
        difference: "Includes only ATTENDED registrations and already-earned completion bonuses"
      - name: provisional
        when: "incentive-summary provisional_cents field; forward-looking projection"
        difference: "earned_cents + SUM(per_session) over status REGISTERED registrations + projected completion_bonus_cents for modules where (attended_count + registered_count) >= completion_threshold and the bonus is not yet earned; WAITLISTED/NO_SHOW/CANCELLED excluded"

  - name: match_accrual
    trigger: "POST /match-enrollments/{id}/deposits (accepted deposit)"
    algorithm: tiered_pricing
    formula: |
      ratio = pool.match_ratio_below  if participant.annual_income_cents <  pool.income_threshold_cents
              pool.match_ratio_above  if participant.annual_income_cents >= pool.income_threshold_cents
      candidate = round_half_up(ratio * deposit.amount_cents)         # integer cents
      cap_remaining = pool.per_participant_cap_cents - enrollment.accrued_unpaid_cents
      if candidate > cap_remaining:        reject whole deposit with ERR_MATCH_CAP_EXCEEDED
      if candidate > pool.uncommitted_cents: reject whole deposit with ERR_POOL_INSUFFICIENT
      # accept:
      enrollment.total_deposited_cents += amount_cents
      enrollment.accrued_unpaid_cents  += candidate
      pool.uncommitted_cents           -= candidate
      if enrollment.total_deposited_cents >= enrollment.savings_goal_cents:
          enrollment.status -> GOAL_MET
    input_set: "Single deposit on an ACTIVE enrollment; pool and participant read at acceptance time"
    constants: {}
    precision: "integer cents, round_half_up once (after ratio multiplication, before guard comparisons)"

  - name: funder_outcome_aggregation
    trigger: "POST /funder-reports"
    algorithm: aggregation
    formula: |
      For each qualifying participant p:
        credit_delta(p)  = latest_in_period(credit_score)  - earliest_in_period(credit_score)
        savings_delta(p) = latest_in_period(savings_balance_cents) - earliest_in_period(savings_balance_cents)
        where in-period snapshots are OutcomeSnapshots of p with recorded_at's date in [period_start, period_end),
        ordered by recorded_at ASC, tie-break created_at ASC; snapshots lacking the metric are skipped for that metric.
        A participant enters a metric's average only with >= 2 in-period snapshots carrying that metric.
      avg_credit_delta_points  = round_half_up(mean(credit_delta), 1 decimal)   # null if no participant qualifies
      avg_savings_delta_cents  = round_half_up(mean(savings_delta), 0 decimals) # null if no participant qualifies
      completions_count = count of CoachingCases whose transition to COMPLETED occurred at a logical-clock time
                          whose date falls in [period_start, period_end)
    input_set: "Variant-dependent; see variants"
    constants: {}
    precision: "credit average: 1 decimal, round_half_up; savings average: integer cents, round_half_up"
    variants:
      - name: COHORT
        when: "variant == COHORT — new-entrant reporting"
        difference: "Only participants whose EARLIEST CoachingCase (by intake_date) has intake_date in [period_start, period_end)"
      - name: ROLLING
        when: "variant == ROLLING — all-served reporting"
        difference: "All participants with >= 1 CoachingCase (any status) whose intake_date < period_end"

  - name: waitlist_promotion
    trigger: "a REGISTERED registration is cancelled (LINK 2 of the cancel transition)"
    algorithm: chronological
    formula: |
      candidates = registrations with workshop_id == freed workshop AND status == WAITLISTED
      scan candidates ordered by waitlist_position ASC (positions are unique per workshop, assigned at waitlisting):
        skip (leave WAITLISTED) if participant.status != ACTIVE
        skip if the promotion would violate participant_schedule_overlap against that participant's
             other status==REGISTERED registrations
        else promote first non-skipped candidate: status -> REGISTERED, waitlist_position = null,
             workshop.confirmed_count += 1; stop scanning.
    input_set: "WAITLISTED registrations on the freed workshop only"
    constants: {}
    precision: "n/a (selector: waitlist_position ASC; never uses id or randomness)"

  - name: coach_schedule_overlap
    trigger: "POST /workshops, PATCH /workshops/{id} (when start_at/end_at/coach_id change)"
    algorithm: interval_merge
    formula: |
      Conflict iff another workshop W2 exists with W2.coach_id == coach_id, W2.status == SCHEDULED,
      W2.id != this workshop, and start_at < W2.end_at AND W2.start_at < end_at.
      HALF-OPEN semantics: [start_at, end_at) — back-to-back sessions (end_at == other.start_at) do NOT conflict.
    input_set: "SCHEDULED workshops of the same coach"
    constants: {}
    precision: "n/a"

  - name: participant_schedule_overlap
    trigger: "POST /registrations; waitlist promotion eligibility check"
    algorithm: interval_merge
    formula: |
      BUFFER = 30 minutes (TRAVEL_BUFFER_MINUTES)
      Conflict iff the participant holds another registration R2 with R2.status == REGISTERED whose
      workshop W2 satisfies: new.start_at < W2.end_at + BUFFER AND W2.start_at < new.end_at + BUFFER.
      BUFFERED semantics: each existing workshop's [start, end] is effectively extended 30 minutes
      past its end and 30 minutes before its start — a gap of exactly 30 minutes does NOT conflict
      (strict <), any smaller positive gap DOES conflict.
    input_set: "The participant's registrations with status REGISTERED (WAITLISTED/ATTENDED/NO_SHOW/CANCELLED excluded)"
    constants:
      TRAVEL_BUFFER_MINUTES: 30
    precision: "n/a"

  - name: caseload_count
    trigger: "coaching-case create; PLAN_STALLED -> INTAKE reassignment; GET /coaches/{id}"
    algorithm: aggregation
    formula: |
      active_caseload = count(CoachingCase where coach_id == coach AND status IN {INTAKE, PLAN_DRAFT, PLAN_ACTIVE, ON_HOLD})
      Gate: case creation / reassignment requires active_caseload < max_caseload (ERR_CASELOAD_FULL).
      PLAN_STALLED, COMPLETED, EXITED are excluded — a stalled case frees a seat immediately.
    input_set: "CoachingCases of the coach in the four open statuses"
    constants: {}
    precision: "integer count"

  - name: pool_fund_conservation
    trigger: "invariant checked after every deposit, payout, and forfeit"
    algorithm: waterfall_allocation
    formula: |
      pool.total_funded_cents == pool.uncommitted_cents
        + SUM(enrollment.accrued_unpaid_cents over enrollments with status IN {ACTIVE, MATCH_PAUSED, GOAL_MET})
        + pool.paid_out_cents
      Deposit accrual moves uncommitted -> accrued; payout moves accrued -> paid_out;
      forfeit moves accrued -> uncommitted. total_funded_cents NEVER changes after pool creation.
    input_set: "All enrollments of the pool in non-terminal statuses"
    constants: {}
    precision: "integer cents; the equality MUST hold exactly after every mutation"

  - name: workshop_seat_conservation
    trigger: "invariant checked after every registration create/cancel/promotion"
    algorithm: aggregation
    formula: |
      workshop.confirmed_count == count(Registration where workshop_id == workshop AND status == REGISTERED)
      and 0 <= confirmed_count <= workshop.capacity at all times.
      A register (+1) paired with a later cancel (-1) leaves confirmed_count unchanged;
      a cancel that triggers a promotion nets to 0 (cancel -1, promote +1).
    input_set: "Registrations of the workshop"
    constants: {}
    precision: "integer count"

  - name: no_show_restriction
    trigger: "registration NO_SHOW transition"
    algorithm: threshold
    formula: |
      participant.no_show_count += 1
      if participant.no_show_count >= NO_SHOW_LIMIT (3): participant.status ACTIVE -> RESTRICTED
      RESTRICTED blocks POST /registrations for the participant (ERR_PARTICIPANT_RESTRICTED).
      Boundary: exactly 3 flips; 2 does not.
    input_set: "The marked registration's participant"
    constants:
      NO_SHOW_LIMIT: 3
    precision: "integer count; >= comparison"

  - name: referral_expiry
    trigger: "referral creation; lazy sweep on referral read/write"
    algorithm: threshold
    formula: |
      expires_at = sent_at + REFERRAL_TTL_DAYS days (30)
      SENT referral with logical_now >= expires_at transitions to EXPIRED (lazy sweep, applied before
      processing any request that reads or writes the referral).
    input_set: "Referrals with status SENT"
    constants:
      REFERRAL_TTL_DAYS: 30
    precision: "datetime comparison, >= expires_at expires"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role permitted for the endpoint; entity-backed ownership: Participant may act only on own registrations/deposits/self reads (participant_id == X-User-ID); Coach may mark attendance only on own workshops, manage only own cases/referrals/goal-plans (coach_id == X-User-ID)", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: business_constraint, check: "Request well-formed: required fields present, types correct, enum values valid, end_at > start_at, amount_cents > 0, credit_score in 300..850, period_end > period_start, completion_threshold <= session_count, new_coach_id present for PLAN_STALLED -> INTAKE", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 4, category: existence, check: "Path ids and body FK references resolve, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all resource endpoints" }
  - { priority: 5, category: state, check: "OCC: expected_<parent>_version matches the parent's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /goal-plans, PATCH /workshops/{id}" }
  - { priority: 6, category: state, check: "Target entity in a valid state for the operation: transition target reachable from current state; workshop SCHEDULED for registration/attendance; enrollment ACTIVE for deposits; module enrollment state rules", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "state transition endpoints, POST /registrations, deposits" }
  - { priority: 7, category: state, check: "Transition endpoint target_state not reachable from current state", error_id: ERR_INVALID_TRANSITION, http_status: 409, applies_to: "POST /coaching-cases/{id}/transition, POST /referrals/{id}/transition" }
  - { priority: 8, category: state, check: "Deposit requires enrollment status ACTIVE", error_id: ERR_ENROLLMENT_NOT_ACTIVE, http_status: 409, applies_to: "POST /match-enrollments/{id}/deposits" }
  - { priority: 9, category: state, check: "Payout requires enrollment status GOAL_MET", error_id: ERR_GOAL_NOT_MET, http_status: 409, applies_to: "POST /match-enrollments/{id}/payout" }
  - { priority: 10, category: business_safety, check: "Certification gate: coach must be CERTIFIED for workshop creation, case creation, INTAKE->PLAN_DRAFT, ON_HOLD->PLAN_ACTIVE, PLAN_STALLED reassignment", error_id: ERR_COACH_NOT_CERTIFIED, http_status: 409, applies_to: "POST /workshops, POST /coaching-cases, case transitions" }
  - { priority: 11, category: business_temporal, check: "Registration requires logical_now < workshop.start_at", error_id: ERR_WORKSHOP_STARTED, http_status: 409, applies_to: "POST /registrations" }
  - { priority: 12, category: business_temporal, check: "Attendance marking requires logical_now >= workshop.start_at", error_id: ERR_WORKSHOP_NOT_STARTED, http_status: 409, applies_to: "POST /registrations/{id}/mark-attendance" }
  - { priority: 13, category: business_temporal, check: "Coach half-open interval overlap on SCHEDULED workshops", error_id: ERR_COACH_SCHEDULE_CONFLICT, http_status: 409, applies_to: "POST /workshops, PATCH /workshops/{id}" }
  - { priority: 14, category: business_temporal, check: "Participant buffered (30-minute) interval overlap against existing REGISTERED registrations", error_id: ERR_PARTICIPANT_SCHEDULE_CONFLICT, http_status: 409, applies_to: "POST /registrations" }
  - { priority: 14, category: business_constraint, check: "PATCH capacity may not be lowered below the workshop's current confirmed_count", error_id: ERR_CAPACITY_BELOW_CONFIRMED, http_status: 409, applies_to: "PATCH /workshops/{id}" }
  - { priority: 15, category: business_constraint, check: "Participant already holds a REGISTERED or WAITLISTED registration on this workshop", error_id: ERR_ALREADY_REGISTERED, http_status: 409, applies_to: "POST /registrations" }
  - { priority: 16, category: business_constraint, check: "Participant already has a CoachingCase in a non-terminal status {INTAKE, PLAN_DRAFT, PLAN_ACTIVE, ON_HOLD, PLAN_STALLED}", error_id: ERR_OPEN_CASE_EXISTS, http_status: 409, applies_to: "POST /coaching-cases" }
  - { priority: 17, category: business_constraint, check: "Participant status RESTRICTED blocks new registrations", error_id: ERR_PARTICIPANT_RESTRICTED, http_status: 409, applies_to: "POST /registrations" }
  - { priority: 18, category: business_constraint, check: "email unique per Coach / per Participant; module_code unique", error_id: ERR_DUPLICATE_EMAIL, http_status: 409, applies_to: "POST /coaches, POST /participants" }
  - { priority: 19, category: business_constraint, check: "module_code already in use", error_id: ERR_MODULE_CODE_TAKEN, http_status: 409, applies_to: "POST /curriculum-modules" }
  - { priority: 20, category: business_referential, check: "Referenced module must be ACTIVE for workshop creation", error_id: ERR_MODULE_RETIRED, http_status: 409, applies_to: "POST /workshops" }
  - { priority: 21, category: business_referential, check: "Case PLAN_DRAFT -> PLAN_ACTIVE requires an existing DRAFT GoalPlan", error_id: ERR_PLAN_REQUIRED, http_status: 409, applies_to: "POST /coaching-cases/{id}/transition" }
  - { priority: 22, category: business_referential, check: "Enrollment creation requires the referenced GoalPlan status == ACTIVE; case completion requires >= 1 OutcomeSnapshot for the participant", error_id: ERR_PLAN_NOT_ACTIVE, http_status: 409, applies_to: "POST /match-enrollments" }
  - { priority: 23, category: business_referential, check: "Case completion requires >= 1 OutcomeSnapshot for the participant", error_id: ERR_OUTCOME_REQUIRED, http_status: 409, applies_to: "POST /coaching-cases/{id}/transition" }
  - { priority: 24, category: business_fiscal, check: "Coach active_caseload < max_caseload at case creation / reassignment", error_id: ERR_CASELOAD_FULL, http_status: 409, applies_to: "POST /coaching-cases, case transition reassignment" }
  - { priority: 25, category: business_fiscal, check: "Deposit accrual candidate <= pool.uncommitted_cents", error_id: ERR_POOL_INSUFFICIENT, http_status: 402, applies_to: "POST /match-enrollments/{id}/deposits" }
  - { priority: 26, category: business_fiscal, check: "Deposit accrual candidate <= per-participant cap remaining", error_id: ERR_MATCH_CAP_EXCEEDED, http_status: 409, applies_to: "POST /match-enrollments/{id}/deposits" }
  - { priority: 27, category: business_fiscal, check: "Enrollment creation requires pool ACTIVE and pool.uncommitted_cents >= pool.per_participant_cap_cents", error_id: ERR_POOL_INSUFFICIENT, http_status: 402, applies_to: "POST /match-enrollments" }
  - { priority: 28, category: business_fiscal, check: "Pool close requires no open enrollments", error_id: ERR_POOL_HAS_OPEN_ENROLLMENTS, http_status: 409, applies_to: "POST /match-pools/{id}/close" }

# =============================================================================
# §1.5 API Endpoint Table (flat; filtered lists give FK reverse-reachability)
# =============================================================================
endpoints:
  # --- test-driving clock ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock. Default at server start is exactly 2026-08-01T00:00:00Z; the clock NEVER falls back to wall-clock time. Lazy sweeps (coach lapse, referral expiry) evaluate against this clock.", roles: [ProgramAdmin], code: 200, input: [to_iso8601], output: { current_utc: datetime }, side_effects: ["Applies due lazy auto-transitions (Coach CERTIFIED->LAPSED, Referral SENT->EXPIRED, including their cascades)"] }

  # --- CurriculumModule ---
  - { method: POST, path: "/curriculum-modules", description: "Create a curriculum module", roles: [ProgramAdmin], code: 201, input: [module_code, title, session_count, incentive_cents_per_hour, completion_bonus_cents, completion_threshold], output: CurriculumModule, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/curriculum-modules/{id}", description: "Get a module", roles: [ProgramAdmin, Coach, Participant], code: 200, input: [], output: CurriculumModule, side_effects: [] }
  - { method: POST, path: "/curriculum-modules/{id}/retire", description: "Retire a module", roles: [ProgramAdmin], code: 200, input: [], output: CurriculumModule, side_effects: ["status -> RETIRED"] }

  # --- Coach ---
  - { method: POST, path: "/coaches", description: "Create a coach (starts CANDIDATE)", roles: [ProgramAdmin], code: 201, input: [full_name, email, max_caseload], output: Coach, side_effects: ["status=CANDIDATE, active_caseload=0"] }
  - { method: GET, path: "/coaches/{id}", description: "Get a coach (applies certification lazy sweep first)", roles: [ProgramAdmin, Coach, Participant], code: 200, input: [], output: Coach, side_effects: ["Lazy sweep may transition CERTIFIED -> LAPSED with cascade"] }
  - { method: POST, path: "/coaches/{id}/certify", description: "Certify a CANDIDATE coach", roles: [ProgramAdmin], code: 200, input: [], output: Coach, side_effects: ["status -> CERTIFIED, certification_expires_at = now + 365d"] }
  - { method: POST, path: "/coaches/{id}/suspend", description: "Suspend a CERTIFIED coach; runs the depth-3 stall cascade", roles: [ProgramAdmin], code: 200, input: [], output: Coach, side_effects: ["Coach CERTIFIED -> SUSPENDED; LINK 1 cases -> PLAN_STALLED; LINK 2 ACTIVE GoalPlans -> FROZEN; LINK 3 linked ACTIVE MatchEnrollments -> MATCH_PAUSED; active_caseload recomputed"] }
  - { method: POST, path: "/coaches/{id}/reinstate", description: "Reinstate a SUSPENDED or LAPSED coach to CERTIFIED (new 365-day expiry)", roles: [ProgramAdmin], code: 200, input: [], output: Coach, side_effects: ["status -> CERTIFIED, certification_expires_at refreshed"] }

  # --- Participant ---
  - { method: POST, path: "/participants", description: "Create a participant", roles: [ProgramAdmin], code: 201, input: [full_name, email, annual_income_cents], output: Participant, side_effects: ["status=ACTIVE, no_show_count=0"] }
  - { method: GET, path: "/participants/{id}", description: "Get a participant (Participant role: self only)", roles: [ProgramAdmin, Coach, Participant], code: 200, input: [], output: Participant, side_effects: [] }
  - { method: POST, path: "/participants/{id}/clear-restriction", description: "Clear a no-show restriction (RESTRICTED -> ACTIVE, strikes reset)", roles: [ProgramAdmin], code: 200, input: [], output: Participant, side_effects: ["status -> ACTIVE, no_show_count = 0"] }
  - { method: POST, path: "/participants/{id}/exit", description: "Exit a participant from the program", roles: [ProgramAdmin], code: 200, input: [], output: Participant, side_effects: ["status -> EXITED; open CoachingCases -> EXITED"] }
  - { method: GET, path: "/participants/{id}/incentive-summary", description: "Computed read: earned vs provisional incentive accrual (session_incentive variants)", roles: [ProgramAdmin, Coach, Participant], code: 200, input: [], output: { earned_cents: integer, provisional_cents: integer, attended_sessions: integer, registered_sessions: integer, completion_bonuses_earned_cents: integer }, side_effects: [] }

  # --- Workshop ---
  - { method: POST, path: "/workshops", description: "Schedule a workshop (module ACTIVE, coach CERTIFIED, coach overlap check)", roles: [ProgramAdmin], code: 201, input: [module_id, coach_id, location, start_at, end_at, capacity], output: Workshop, side_effects: ["status=SCHEDULED, confirmed_count=0"] }
  - { method: GET, path: "/workshops", description: "List workshops with filters", roles: [ProgramAdmin, Coach, Participant], code: 200, input: ["module_id?", "coach_id?", "status?", "limit?", "offset?"], output: "Workshop[]", side_effects: [] }
  - { method: GET, path: "/workshops/{id}", description: "Get a workshop", roles: [ProgramAdmin, Coach, Participant], code: 200, input: [], output: Workshop, side_effects: [] }
  - { method: PATCH, path: "/workshops/{id}", description: "Reschedule / re-capacitate a SCHEDULED workshop; OCC-guarded", roles: [ProgramAdmin], code: 200, input: ["start_at?", "end_at?", "capacity?", expected_workshop_version], output: Workshop, side_effects: ["increments Workshop.version by 1", "coach overlap re-check when times change", "capacity may not be lowered below current confirmed_count (ERR_CAPACITY_BELOW_CONFIRMED)"] }
  - { method: POST, path: "/workshops/{id}/cancel", description: "Cancel a workshop; cancels all non-terminal registrations without promotion", roles: [ProgramAdmin], code: 200, input: [], output: Workshop, side_effects: ["status -> CANCELLED; REGISTERED/WAITLISTED registrations -> CANCELLED; confirmed_count = 0"] }

  # --- Registration ---
  - { method: POST, path: "/registrations", description: "Register a participant for a workshop; REGISTERED if confirmed_count < capacity else WAITLISTED (position assigned)", roles: [ProgramAdmin, Participant], code: 201, input: [workshop_id, participant_id], output: Registration, side_effects: ["If REGISTERED: workshop.confirmed_count += 1; If WAITLISTED: waitlist_position = max existing + 1"] }
  - { method: GET, path: "/registrations", description: "List registrations with filters", roles: [ProgramAdmin, Coach, Participant], code: 200, input: ["workshop_id?", "participant_id?", "status?", "limit?", "offset?"], output: "Registration[]", side_effects: [] }
  - { method: GET, path: "/registrations/{id}", description: "Get a registration", roles: [ProgramAdmin, Coach, Participant], code: 200, input: [], output: Registration, side_effects: [] }
  - { method: POST, path: "/registrations/{id}/cancel", description: "Cancel a REGISTERED or WAITLISTED registration; freeing a seat promotes the lowest eligible waitlist_position", roles: [ProgramAdmin, Participant], code: 200, input: [], output: Registration, side_effects: ["status -> CANCELLED; if was REGISTERED: confirmed_count -= 1 then waitlist_promotion runs (promoted registration -> REGISTERED, confirmed_count += 1)"] }
  - { method: POST, path: "/registrations/{id}/mark-attendance", description: "Mark attendance outcome for a REGISTERED registration once the workshop has started", roles: [ProgramAdmin, Coach], code: 200, input: [outcome], output: Registration, side_effects: ["ATTENDED: incentive_earned_cents computed per session_incentive; NO_SHOW: participant.no_show_count += 1, possible ACTIVE -> RESTRICTED"] }

  # --- CoachingCase ---
  - { method: POST, path: "/coaching-cases", description: "Open a coaching case (intake) for a participant with a CERTIFIED coach who has caseload room", roles: [ProgramAdmin, Coach], code: 201, input: [participant_id, coach_id, intake_date], output: CoachingCase, side_effects: ["status=INTAKE", "coach.active_caseload += 1 (recomputed)"] }
  - { method: GET, path: "/coaching-cases", description: "List coaching cases with filters", roles: [ProgramAdmin, Coach, Participant], code: 200, input: ["participant_id?", "coach_id?", "status?", "limit?", "offset?"], output: "CoachingCase[]", side_effects: [] }
  - { method: GET, path: "/coaching-cases/{id}", description: "Get a coaching case", roles: [ProgramAdmin, Coach, Participant], code: 200, input: [], output: CoachingCase, side_effects: [] }
  - { method: POST, path: "/coaching-cases/{id}/transition", description: "Drive the case state machine (target_state in {INTAKE, PLAN_DRAFT, PLAN_ACTIVE, ON_HOLD, COMPLETED, EXITED}; new_coach_id required from PLAN_STALLED)", roles: [ProgramAdmin, Coach], code: 200, input: [target_state, "new_coach_id?"], output: CoachingCase, side_effects: ["Per CoachingCase state machine: plan activation/freeze, enrollment pause/resume, reassignment; increments CoachingCase.version by 1"] }

  # --- GoalPlan ---
  - { method: POST, path: "/goal-plans", description: "Create a budget/credit goal plan for a PLAN_DRAFT case; supersedes any existing DRAFT plan; OCC-guarded on the case", roles: [ProgramAdmin, Coach], code: 201, input: [case_id, monthly_savings_goal_cents, credit_score_target, expected_case_version], output: GoalPlan, side_effects: ["status=DRAFT, plan_sequence = prior count + 1", "existing DRAFT plans for the case -> SUPERSEDED", "increments CoachingCase.version by 1"] }
  - { method: GET, path: "/goal-plans", description: "List goal plans with filters", roles: [ProgramAdmin, Coach, Participant], code: 200, input: ["case_id?", "status?", "limit?", "offset?"], output: "GoalPlan[]", side_effects: [] }
  - { method: GET, path: "/goal-plans/{id}", description: "Get a goal plan", roles: [ProgramAdmin, Coach, Participant], code: 200, input: [], output: GoalPlan, side_effects: [] }

  # --- OutcomeSnapshot ---
  - { method: POST, path: "/outcome-snapshots", description: "Append a credit-score and/or savings-balance measurement (append-only; at least one metric required)", roles: [ProgramAdmin, Coach], code: 201, input: [participant_id, recorded_at, "credit_score?", "savings_balance_cents?"], output: OutcomeSnapshot, side_effects: [] }
  - { method: GET, path: "/outcome-snapshots", description: "List snapshots (chronological: recorded_at ASC, tie-break created_at ASC)", roles: [ProgramAdmin, Coach, Participant], code: 200, input: ["participant_id?", "limit?", "offset?"], output: "OutcomeSnapshot[]", side_effects: [] }
  - { method: GET, path: "/outcome-snapshots/{id}", description: "Get a single snapshot", roles: [ProgramAdmin, Coach, Participant], code: 200, input: [], output: OutcomeSnapshot, side_effects: [] }

  # --- MatchPool ---
  - { method: POST, path: "/match-pools", description: "Create a matched-savings pool", roles: [ProgramAdmin], code: 201, input: [name, total_funded_cents, income_threshold_cents, match_ratio_below, match_ratio_above, per_participant_cap_cents], output: MatchPool, side_effects: ["status=ACTIVE, uncommitted_cents = total_funded_cents, paid_out_cents = 0"] }
  - { method: GET, path: "/match-pools/{id}", description: "Get a pool", roles: [ProgramAdmin, Coach], code: 200, input: [], output: MatchPool, side_effects: [] }
  - { method: POST, path: "/match-pools/{id}/close", description: "Close a pool with no open enrollments", roles: [ProgramAdmin], code: 200, input: [], output: MatchPool, side_effects: ["status -> CLOSED"] }

  # --- MatchEnrollment ---
  - { method: POST, path: "/match-enrollments", description: "Enroll a participant in a pool against an ACTIVE goal plan", roles: [ProgramAdmin, Coach], code: 201, input: [participant_id, pool_id, goal_plan_id, savings_goal_cents], output: MatchEnrollment, side_effects: ["status=ACTIVE, totals = 0"] }
  - { method: GET, path: "/match-enrollments", description: "List enrollments with filters", roles: [ProgramAdmin, Coach, Participant], code: 200, input: ["participant_id?", "pool_id?", "goal_plan_id?", "status?", "limit?", "offset?"], output: "MatchEnrollment[]", side_effects: [] }
  - { method: GET, path: "/match-enrollments/{id}", description: "Get an enrollment", roles: [ProgramAdmin, Coach, Participant], code: 200, input: [], output: MatchEnrollment, side_effects: [] }
  - { method: POST, path: "/match-enrollments/{id}/deposits", description: "Record a savings deposit; accrues match per match_accrual (rejects whole deposit on cap/pool breach)", roles: [ProgramAdmin, Coach, Participant], code: 201, input: [amount_cents, "deposited_at?"], output: MatchEnrollment, side_effects: ["total_deposited_cents += amount; accrued_unpaid_cents += accrual; pool.uncommitted_cents -= accrual; AUTO: -> GOAL_MET when total_deposited_cents >= savings_goal_cents"] }
  - { method: POST, path: "/match-enrollments/{id}/payout", description: "Pay out accrued match once GOAL_MET", roles: [ProgramAdmin], code: 200, input: [], output: MatchEnrollment, side_effects: ["status -> PAID_OUT; pool.paid_out_cents += accrued; accrued_unpaid_cents = 0"] }
  - { method: POST, path: "/match-enrollments/{id}/forfeit", description: "Forfeit accrued match back to the pool", roles: [ProgramAdmin], code: 200, input: [], output: MatchEnrollment, side_effects: ["status -> FORFEITED; pool.uncommitted_cents += accrued; accrued_unpaid_cents = 0"] }

  # --- Referral ---
  - { method: POST, path: "/referrals", description: "Refer a participant to a lender or assistance program", roles: [ProgramAdmin, Coach], code: 201, input: [participant_id, coach_id, partner_name, partner_type], output: Referral, side_effects: ["status=SENT, sent_at = logical now, expires_at = sent_at + 30d"] }
  - { method: GET, path: "/referrals", description: "List referrals with filters (applies expiry lazy sweep first)", roles: [ProgramAdmin, Coach, Participant], code: 200, input: ["participant_id?", "coach_id?", "status?", "limit?", "offset?"], output: "Referral[]", side_effects: [] }
  - { method: GET, path: "/referrals/{id}", description: "Get a referral (applies expiry lazy sweep first)", roles: [ProgramAdmin, Coach, Participant], code: 200, input: [], output: Referral, side_effects: [] }
  - { method: POST, path: "/referrals/{id}/transition", description: "Drive the referral state machine (ACCEPTED | DECLINED | COMPLETED)", roles: [ProgramAdmin, Coach], code: 200, input: [target_state], output: Referral, side_effects: ["Per Referral state machine"] }

  # --- FunderReport ---
  - { method: POST, path: "/funder-reports", description: "Compute an immutable outcome report for a period and variant (COHORT | ROLLING)", roles: [ProgramAdmin], code: 201, input: [period_start, period_end, variant], output: FunderReport, side_effects: ["funder_outcome_aggregation computed once and frozen"] }
  - { method: GET, path: "/funder-reports/{id}", description: "Get a report", roles: [ProgramAdmin], code: 200, input: [], output: FunderReport, side_effects: [] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for endpoint, or entity-backed ownership check failed (Participant acting on another's resource; Coach not assigned to the workshop/case/referral)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed request: missing required field, bad type, invalid enum, end_at <= start_at, amount_cents <= 0, credit_score outside 300..850, period_end <= period_start, completion_threshold > session_count, missing new_coach_id on reassignment" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or referenced FK does not resolve" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity in wrong state for the operation (workshop CANCELLED, enrollment terminal, module RETIRED reads-as-state, etc.)" }
  - { id: ERR_INVALID_TRANSITION, http: 409, condition: "target_state not reachable from the entity's current state" }
  - { id: ERR_ENROLLMENT_NOT_ACTIVE, http: 409, condition: "Deposit attempted on an enrollment not in ACTIVE status (MATCH_PAUSED/GOAL_MET/terminal)" }
  - { id: ERR_GOAL_NOT_MET, http: 409, condition: "Payout attempted before enrollment reached GOAL_MET" }
  - { id: ERR_COACH_NOT_CERTIFIED, http: 409, condition: "Operation requires a CERTIFIED coach (workshop scheduling, case open/advance/reassign)" }
  - { id: ERR_WORKSHOP_STARTED, http: 409, condition: "Registration attempted at or after workshop start_at" }
  - { id: ERR_WORKSHOP_NOT_STARTED, http: 409, condition: "Attendance marking attempted before workshop start_at" }
  - { id: ERR_COACH_SCHEDULE_CONFLICT, http: 409, condition: "Coach already assigned a SCHEDULED workshop whose half-open interval overlaps" }
  - { id: ERR_PARTICIPANT_SCHEDULE_CONFLICT, http: 409, condition: "Participant holds a REGISTERED registration within the 30-minute buffered window" }
  - { id: ERR_ALREADY_REGISTERED, http: 409, condition: "Participant already REGISTERED or WAITLISTED on this workshop" }
  - { id: ERR_OPEN_CASE_EXISTS, http: 409, condition: "Participant already has a non-terminal CoachingCase" }
  - { id: ERR_PARTICIPANT_RESTRICTED, http: 409, condition: "Participant is RESTRICTED (3+ no-shows) and may not register" }
  - { id: ERR_DUPLICATE_EMAIL, http: 409, condition: "Email already in use by another Coach (for coach create) or Participant (for participant create)" }
  - { id: ERR_MODULE_CODE_TAKEN, http: 409, condition: "module_code already exists" }
  - { id: ERR_MODULE_RETIRED, http: 409, condition: "Workshop creation against a RETIRED module" }
  - { id: ERR_PLAN_REQUIRED, http: 409, condition: "PLAN_DRAFT -> PLAN_ACTIVE requires an existing DRAFT GoalPlan" }
  - { id: ERR_PLAN_NOT_ACTIVE, http: 409, condition: "Match enrollment requires the referenced GoalPlan to be ACTIVE" }
  - { id: ERR_OUTCOME_REQUIRED, http: 409, condition: "Case completion requires at least one OutcomeSnapshot for the participant" }
  - { id: ERR_CASELOAD_FULL, http: 409, condition: "Coach active_caseload >= max_caseload" }
  - { id: ERR_POOL_INSUFFICIENT, http: 402, condition: "Pool uncommitted_cents cannot cover the deposit accrual candidate or a new enrollment's per-participant cap" }
  - { id: ERR_MATCH_CAP_EXCEEDED, http: 409, condition: "Deposit accrual candidate exceeds the enrollment's per-participant cap remaining" }
  - { id: ERR_POOL_HAS_OPEN_ENROLLMENTS, http: 409, condition: "Pool close attempted with enrollments in ACTIVE/MATCH_PAUSED/GOAL_MET" }
  - { id: ERR_CAPACITY_BELOW_CONFIRMED, http: 409, condition: "PATCH would lower workshop capacity below current confirmed_count" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "Nonprofit program administrator; unrestricted operational superset"
    identity: opaque
    exclusive_operations:
      - "POST /curriculum-modules, POST /curriculum-modules/{id}/retire"
      - "POST /coaches, POST /coaches/{id}/certify, POST /coaches/{id}/suspend, POST /coaches/{id}/reinstate"
      - "POST /participants, POST /participants/{id}/clear-restriction, POST /participants/{id}/exit"
      - "POST /workshops, PATCH /workshops/{id}, POST /workshops/{id}/cancel"
      - "POST /match-pools, POST /match-pools/{id}/close"
      - "POST /match-enrollments/{id}/payout, POST /match-enrollments/{id}/forfeit"
      - "POST /funder-reports"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints; POST /registrations, POST /registrations/{id}/cancel, POST /registrations/{id}/mark-attendance, POST /coaching-cases, POST /coaching-cases/{id}/transition, POST /goal-plans, POST /outcome-snapshots, POST /match-enrollments, POST /match-enrollments/{id}/deposits, POST /referrals, POST /referrals/{id}/transition"
  - name: Coach
    description: "Certified financial coach; manages own workshops' attendance, own cases, plans, referrals, snapshots"
    identity: "entity_backed:Coach"
    exclusive_operations:
      - "POST /outcome-snapshots (shared with ProgramAdmin); POST /referrals (shared with ProgramAdmin) — exclusive in the sense that Participant may never call them"
    shared_operations:
      - "POST /registrations/{id}/mark-attendance (only when coach_id == workshop.coach_id)"
      - "POST /coaching-cases (coach_id must equal X-User-ID), POST /coaching-cases/{id}/transition (own cases), POST /goal-plans (own cases)"
      - "POST /match-enrollments, POST /match-enrollments/{id}/deposits"
      - "GET endpoints (all except GET /funder-reports/{id}, GET /match-pools/{id} is allowed)"
  - name: Participant
    description: "Program participant; self-service registration, own deposits, own reads"
    identity: "entity_backed:Participant"
    exclusive_operations: []
    shared_operations:
      - "POST /registrations (participant_id must equal X-User-ID), POST /registrations/{id}/cancel (own registrations)"
      - "POST /match-enrollments/{id}/deposits (own enrollments)"
      - "GET /participants/{id} and GET /participants/{id}/incentive-summary (self only); GET lists/detail for workshops, registrations, coaching-cases, goal-plans, outcome-snapshots, match-enrollments, referrals (own data)"
