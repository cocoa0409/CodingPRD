    - errors[ERR_STALE_VERSION]
    distinguishing_aspect: 'OCC on SeedLot.version: batch A created against version 1 succeeds and bumps the lot to version 2; batch B submitted with the stale version 1 is rejected with 412 ERR_STALE_VERSION
      — deterministic across two sequential requests.'
