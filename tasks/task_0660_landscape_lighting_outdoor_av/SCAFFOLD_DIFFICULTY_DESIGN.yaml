  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: transformer_load_conserved_under_fail_then_replace
        grounds:
          - state_machines.Fixture.INSTALLED_to_FAILED
          - state_machines.Fixture.FAILED_to_INSTALLED
          - calculations.transformer_committed_load
          - entities.Transformer.fields.committed_load_va
        distinguishing_aspect: |
          Conserved quantity #1 = Transformer.committed_load_va (VA). A warranty claim drops the
          fixture's wattage out of committed_load_va (FAILED), and the compensating approve action
          re-energizes it (INSTALLED), restoring committed_load_va to its exact pre-claim value 80.
          Invariant: committed_load_va_after_approve == committed_load_va_before_claim == 80.
        test_recipe:
          setup:
            - "Installed project, one INSTALLED 80W fixture in a zone on a 300VA transformer; committed_load_va == 80; clock 2026-04-15."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Owner I9a", email: "i9a@x.com" }
              as: OperationsAdmin
              captures: { cust_i9a: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust_i9a}", property_address: "I9a St" }
              as: OperationsAdmin
              captures: { proj_i9a: $.data.id }
            - call: "POST /transformers"
              payload: { project_id: "${proj_i9a}", model_code: "TX-300", rated_capacity_va: 300 }
              as: LightingDesigner
              captures: { tx_i9a: $.data.id, tx_i9a_v: $.data.version }
            - call: "POST /projects/${proj_i9a}/zones"
              payload: { transformer_id: "${tx_i9a}", label: "Z" }
