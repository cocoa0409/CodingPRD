# Scaffold Corner Design (SKILL.md 1.9) for task_2338 identity verification and age assurance.
# Section / claim_type taxonomy follows references/claim-extraction-guide.md.
scaffold_corner_design:
- section: entities
  instances:
  - name: client_creation_returns_sandbox_posture_with_a_full_review_credit_pool
    claim_type: creation
    grounds:
    - entities.Client.fields.integration_state
    - entities.Client.fields.available_review_credits
    - "endpoints[POST /idv/clients]"
    - calculations.review_credit_pool
    distinguishing_aspect: "A brand new Client must come back with integration_state SANDBOX (never LIVE) and with the whole grant sitting in available_review_credits, so the pool invariant reserved + available\
      \ == granted already holds at creation."
    test_recipe:
      setup:
      - "The logical clock is pinned to 2026-08-01T00:00:00Z and the database holds no Client."
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: "2026-08-01T00:00:00Z"
        as: PlatformAdmin
        as_user_id: admin-1
      trigger:
      - call: POST /idv/clients
        payload: {name: Northwind Bank, home_jurisdiction_code: US, biometric_retention_mode: RETAIN_90_DAYS, daily_session_quota: 25, granted_review_credits: 3}
        as: PlatformAdmin
        as_user_id: admin-1
        captures: {client_id: $.data.id}
      assert:
      - response status is 201 and $.response_type == object
      - $.data.integration_state == SANDBOX
      - "$.data.granted_review_credits == 3, reserved_review_credits == 0 and available_review_credits == 3"
      - "$.data.consumed_review_count == 0, stored_template_count == 0 and pending_stepup_count == 0"
      - "$.data.version == 1 and $.data.created_at == 2026-08-01T00:00:00.000Z with three fractional digits"
      - $.data.id is a bare UUID with no type prefix
  - name: client_retrieval_returns_the_stored_configuration_unchanged
    claim_type: retrieval
    grounds:
    - "endpoints[GET /idv/clients/{id}]"
    - entities.Client.fields.daily_session_quota
    distinguishing_aspect: "GET /idv/clients/{id} must echo exactly the configuration stored by the create call, including the retention mode and quota that later drive retention and quota decisions."
    test_recipe:
      setup:
      - "Client Northwind Bank was created with RETAIN_90_DAYS, quota 25 and 3 review credits and has not been patched."
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: "2026-08-01T00:00:00Z"
        as: PlatformAdmin
        as_user_id: admin-1
      - call: POST /idv/clients
        payload: {name: Northwind Bank, home_jurisdiction_code: US, biometric_retention_mode: RETAIN_90_DAYS, daily_session_quota: 25, granted_review_credits: 3}
        as: PlatformAdmin
        as_user_id: admin-1
        captures: {client_id: $.data.id}
      trigger:
      - call: "GET /idv/clients/${client_id}"
        payload: {}
        as: PlatformAdmin
        as_user_id: admin-1
      assert:
      - response status is 200
      - "$.data.id == ${client_id} and $.data.name == Northwind Bank"
      - $.data.home_jurisdiction_code == US and $.data.biometric_retention_mode == RETAIN_90_DAYS
      - $.data.daily_session_quota == 25 and $.data.granted_review_credits == 3
      - $.data.integration_state == SANDBOX and $.data.version == 1
  - name: policy_listing_paginates_with_total_count_and_has_more
    claim_type: listing
    grounds:
    - "endpoints[GET /idv/verification-policies]"
    - response_envelope.pagination_fields
    distinguishing_aspect: "Three DRAFT policies of one client must paginate: limit 2 offset 0 returns 2 rows with total_count 3 and has_more true, and offset 2 returns the last row with has_more false."
    test_recipe:
      setup:
      - "Client Paginate Co exists (SANDBOX is sufficient because policy drafting does not require a LIVE posture) and holds three DRAFT policies with policy_version 1, 2 and 3."
      setup_api_calls:
      - call: POST /idv/clients
        payload: {name: Paginate Co, home_jurisdiction_code: US, biometric_retention_mode: DELETE_ON_COMPLETE, daily_session_quota: 50, granted_review_credits: 1}
        as: PlatformAdmin
        as_user_id: admin-1
        captures: {client_id: $.data.id}
      - call: POST /idv/verification-policies
        payload:
          client_id: "${client_id}"
          policy_version: 1
          allowed_method_codes: [DOCUMENT_SCAN]
          min_assurance_score: 40
        as: ClientIntegrator
        as_user_id: "${client_id}"
        captures: {policy1_id: $.data.id}
      - call: POST /idv/verification-policies
        payload:
          client_id: "${client_id}"
          policy_version: 2
          allowed_method_codes: [DOCUMENT_SCAN]
          min_assurance_score: 40
        as: ClientIntegrator
        as_user_id: "${client_id}"
        captures: {policy2_id: $.data.id}
      - call: POST /idv/verification-policies
        payload:
          client_id: "${client_id}"
          policy_version: 3
          allowed_method_codes: [DOCUMENT_SCAN, DATABASE_CHECK]
          min_assurance_score: 40
        as: ClientIntegrator
        as_user_id: "${client_id}"
        captures: {policy3_id: $.data.id}
      trigger:
      - call: "GET /idv/verification-policies?client_id=${client_id}&limit=2&offset=0"
        payload: {}
        as: ComplianceOfficer
        as_user_id: co-1
      - call: "GET /idv/verification-policies?client_id=${client_id}&limit=2&offset=2"
        payload: {}
        as: ComplianceOfficer
        as_user_id: co-1
      assert:
      - "the first page returns status 200 with $.response_type == array, total_count == 3, has_more == true and exactly 2 rows"
      - "the second page returns total_count == 3, has_more == false and exactly 1 row"
      - "every returned row has state == DRAFT and client_id == ${client_id}"
      - "the three ids ${policy1_id}, ${policy2_id} and ${policy3_id} appear exactly once across the two pages"
  - name: client_patch_with_unknown_id_returns_not_found
    claim_type: not_found
    grounds:
    - "validations[priority=3]"
    - "errors[ERR_CLIENT_NOT_FOUND]"
    distinguishing_aspect: "A PATCH addressed to a UUID that was never minted must fail with ERR_CLIENT_NOT_FOUND (404), not create a Client and not report a schema error."
    test_recipe:
      setup: [The database holds exactly one unrelated Client.]
      setup_api_calls:
      - call: POST /idv/clients
        payload: {name: Other Co, home_jurisdiction_code: US, biometric_retention_mode: DELETE_ON_COMPLETE, daily_session_quota: 50, granted_review_credits: 1}
        as: PlatformAdmin
        as_user_id: admin-1
        captures: {client_id: $.data.id}
      trigger:
      - call: PATCH /idv/clients/11111111-1111-4111-8111-111111111111
        payload: {daily_session_quota: 9}
        as: PlatformAdmin
        as_user_id: admin-1
        captures: &id001 {err: $.data.error_id}
      assert:
      - response status is 404 and $.data.error_id == ERR_CLIENT_NOT_FOUND
      - "Client.${client_id}.daily_session_quota is still 50 and version is still 1"
  - name: session_creation_missing_subject_jurisdiction_code_is_rejected
    claim_type: required_fields
    grounds:
    - "validations[priority=13]"
    - "endpoints[POST /idv/verification-sessions]"
    - entities.VerificationSession.fields.subject_jurisdiction_code
    distinguishing_aspect: "subject_jurisdiction_code has source input with no default, so omitting it must produce ERR_INVALID_REQUEST (422) before any risk scoring or quota accounting happens."
    test_recipe:
      setup:
      - "PlatformAdmin admin-1 sets the clock to 2026-08-01T00:00:00Z, onboards a LIVE client and the vendor method profiles, ComplianceOfficer co-1 publishes policy v1, and the ClientIntegrator opens a\
        \ session."
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: "2026-08-01T00:00:00Z"
        as: PlatformAdmin
        as_user_id: admin-1
      - call: POST /idv/clients
        payload: {name: Acme Req, home_jurisdiction_code: US, biometric_retention_mode: DELETE_ON_COMPLETE, daily_session_quota: 50, granted_review_credits: 1}
        as: PlatformAdmin
        as_user_id: admin-1
        captures: {client_id: $.data.id}
      - call: "PATCH /idv/clients/${client_id}"
        payload: {integration_state: LIVE}
        as: PlatformAdmin
        as_user_id: admin-1
        captures: {client_v: $.data.version}
      - call: POST /idv/method-profiles
        payload: {method_code: DOCUMENT_SCAN, vendor_code: docv1, assurance_weight: 45, acceptance_floor_bps: 8000, far_bps: 30, frr_bps: 400, strong_evidence: true, cost_cents: 120}
        as: PlatformAdmin
        as_user_id: admin-1
        captures: {p_doc_id: $.data.id}
      - call: POST /idv/verification-policies
        payload:
          client_id: "${client_id}"
          policy_version: 1
          allowed_method_codes: [DOCUMENT_SCAN]
          min_assurance_score: 40
        as: ClientIntegrator
        as_user_id: "${client_id}"
        captures: {policy_id: $.data.id}
      - call: "POST /idv/verification-policies/${policy_id}/publish"
        payload:
          expected_client_version: "${client_v}"
        as: ComplianceOfficer
        as_user_id: co-1
      trigger:
      - call: POST /idv/verification-sessions
        payload:
          client_id: "${client_id}"
          external_subject_ref: subj-req
          requested_assurance_tier: BASIC
        as: ClientIntegrator
        as_user_id: "${client_id}"
        captures: *id001
      assert:
      - response status is 422 and $.data.error_id == ERR_INVALID_REQUEST
      - "GET /idv/verification-sessions?client_id=${client_id} returns total_count == 0"
  - name: policy_creation_applies_every_declared_default_for_omitted_optionals
    claim_type: defaults
    grounds: [entities.VerificationPolicy.fields.doc_authenticity_floor_bps, entities.VerificationPolicy.fields.pad_threshold_bps, entities.VerificationPolicy.fields.age_buffer_multiplier_bps, entities.VerificationPolicy.fields.step_up_max_rounds,
      entities.VerificationPolicy.fields.alternative_pathway_enabled]
    distinguishing_aspect: "A policy created with only the four required fields must materialise doc floor 8000, pad threshold 7500, required_min_age_years 0, buffer 15000, step_up_max_rounds 2 and alternative_pathway_enabled\
      \ true."
    test_recipe:
      setup: [Client Acme Def exists in SANDBOX.]
      setup_api_calls:
      - call: POST /idv/clients
        payload: {name: Acme Def, home_jurisdiction_code: US, biometric_retention_mode: DELETE_ON_COMPLETE, daily_session_quota: 50, granted_review_credits: 1}
        as: PlatformAdmin
        as_user_id: admin-1
        captures: {client_id: $.data.id}
      trigger:
      - call: POST /idv/verification-policies
        payload:
          client_id: "${client_id}"
          policy_version: 1
          allowed_method_codes: [DOCUMENT_SCAN]
          min_assurance_score: 55
        as: ClientIntegrator
        as_user_id: "${client_id}"
        captures: {policy_id: $.data.id}
      assert:
      - response status is 201 and $.data.state == DRAFT
      - $.data.doc_authenticity_floor_bps == 8000 and $.data.pad_threshold_bps == 7500
      - $.data.required_min_age_years == 0 and $.data.age_buffer_multiplier_bps == 15000
      - $.data.step_up_max_rounds == 2 and $.data.alternative_pathway_enabled == true
      - "$.data.degraded_flag == false, published_at == null, retired_at == null and version == 1"
  - name: session_creation_computes_frozen_risk_fields_and_expiry
    claim_type: computed_fields
    grounds: [calculations.session_risk_assessment, calculations.session_expiry_schedule, calculations.policy_pinning_selector, entities.VerificationSession.fields.risk_level]
    distinguishing_aspect: "risk_score, risk_level, policy_id and expires_at are all computed at creation: ENHANCED base 60 plus mid value bump 10 plus jurisdiction mismatch 20 plus no-standard-docs 10\
      \ equals exactly 100, which is HIGH, and expires_at is created_at plus 60 minutes."
    test_recipe:
      setup:
      - "PlatformAdmin admin-1 sets the clock to 2026-08-01T00:00:00Z, onboards a LIVE client and the vendor method profiles, ComplianceOfficer co-1 publishes policy v1, and the ClientIntegrator opens a\
        \ session."
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: "2026-08-01T00:00:00Z"
        as: PlatformAdmin
        as_user_id: admin-1
      - call: POST /idv/clients
        payload: {name: Acme Risk, home_jurisdiction_code: US, biometric_retention_mode: DELETE_ON_COMPLETE, daily_session_quota: 50, granted_review_credits: 1}
        as: PlatformAdmin
        as_user_id: admin-1
        captures: {client_id: $.data.id}
      - call: "PATCH /idv/clients/${client_id}"
        payload: {integration_state: LIVE}
        as: PlatformAdmin
        as_user_id: admin-1
        captures: {client_v: $.data.version}
      - call: POST /idv/method-profiles
        payload: {method_code: DOCUMENT_SCAN, vendor_code: docv1, assurance_weight: 45, acceptance_floor_bps: 8000, far_bps: 30, frr_bps: 400, strong_evidence: true, cost_cents: 120}
        as: PlatformAdmin
        as_user_id: admin-1
        captures: {p_doc_id: $.data.id}
      - call: POST /idv/verification-policies
        payload:
          client_id: "${client_id}"
          policy_version: 1
          allowed_method_codes: [DOCUMENT_SCAN]
          min_assurance_score: 40
        as: ClientIntegrator
        as_user_id: "${client_id}"
        captures: {policy_id: $.data.id}
      - call: "POST /idv/verification-policies/${policy_id}/publish"
        payload:
          expected_client_version: "${client_v}"
        as: ComplianceOfficer
        as_user_id: co-1
      trigger:
      - call: POST /idv/verification-sessions
        payload:
          client_id: "${client_id}"
          external_subject_ref: subj-risk
          requested_assurance_tier: ENHANCED
          subject_jurisdiction_code: GB
          declared_transaction_value_cents: 500000
          documentation_status: NO_STANDARD_DOCS
        as: ClientIntegrator
        as_user_id: "${client_id}"
        captures: {s_id: $.data.id}
      assert:
      - response status is 201 and $.data.risk_score == 100 with $.data.risk_level == HIGH
      - "$.data.policy_id == ${policy_id} and the caller never supplied it"
      - "$.data.expires_at == 2026-08-01T01:00:00Z"
      - $.data.identity_state == IN_PROGRESS and $.data.age_state == NOT_REQUIRED because required_min_age_years == 0
      - "$.data.assurance_score_provisional == 0, assurance_score_final == null and assurance_ceiling == 100"
      - "$.data.step_up_round == 0, fraud_signal_count == 0 and manual_override_flag == false"
  - name: method_profile_creation_mints_system_fields_and_defaults_bias_state_to_cleared
    claim_type: system_fields
    grounds: [entities.MethodProfile.fields.bias_state, entities.MethodProfile.fields.restricted_at, entities.MethodProfile.fields.estimation_mae_months, state_machines.MethodProfile.bias_state]
    distinguishing_aspect: "bias_state is a system field seeded to CLEARED with restricted_at null and cannot be supplied by the caller, and the optional estimation fields default to 0 and an empty object."
    test_recipe:
      setup: [The database holds no MethodProfile.]
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: "2026-08-01T00:00:00Z"
        as: PlatformAdmin
        as_user_id: admin-1
      trigger:
      - call: POST /idv/method-profiles
        payload: {method_code: DOCUMENT_SCAN, vendor_code: docv1, assurance_weight: 45, acceptance_floor_bps: 8000, far_bps: 30, frr_bps: 400, strong_evidence: true, cost_cents: 120}
        as: PlatformAdmin
        as_user_id: admin-1
        captures: {p_doc_id: $.data.id}
      assert:
      - response status is 201 and $.data.bias_state == CLEARED with $.data.restricted_at == null
      - "$.data.estimation_mae_months == 0 and $.data.band_accuracy_bps == {}"
      - $.data.version == 1 and $.data.created_at == $.data.updated_at
  - name: session_creation_with_a_lowercase_jurisdiction_code_is_rejected
    claim_type: type_constraints
    grounds:
    - "validations[priority=13]"
    - entities.VerificationSession.fields.subject_jurisdiction_code
    distinguishing_aspect: "subject_jurisdiction_code is constrained to exactly two uppercase letters, so the three-character lowercase value usa must be refused with ERR_INVALID_REQUEST rather than silently\
      \ uppercased."
    test_recipe:
      setup:
      - "PlatformAdmin admin-1 sets the clock to 2026-08-01T00:00:00Z, onboards a LIVE client and the vendor method profiles, ComplianceOfficer co-1 publishes policy v1, and the ClientIntegrator opens a\
        \ session."
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: "2026-08-01T00:00:00Z"
        as: PlatformAdmin
        as_user_id: admin-1
      - call: POST /idv/clients
        payload: {name: Acme Type, home_jurisdiction_code: US, biometric_retention_mode: DELETE_ON_COMPLETE, daily_session_quota: 50, granted_review_credits: 1}
        as: PlatformAdmin
        as_user_id: admin-1
        captures: {client_id: $.data.id}
      - call: "PATCH /idv/clients/${client_id}"
        payload: {integration_state: LIVE}
        as: PlatformAdmin
        as_user_id: admin-1
        captures: {client_v: $.data.version}
      - call: POST /idv/method-profiles
        payload: {method_code: DOCUMENT_SCAN, vendor_code: docv1, assurance_weight: 45, acceptance_floor_bps: 8000, far_bps: 30, frr_bps: 400, strong_evidence: true, cost_cents: 120}
        as: PlatformAdmin
        as_user_id: admin-1
        captures: {p_doc_id: $.data.id}
      - call: POST /idv/verification-policies
        payload:
          client_id: "${client_id}"
          policy_version: 1
          allowed_method_codes: [DOCUMENT_SCAN]
          min_assurance_score: 40
        as: ClientIntegrator
        as_user_id: "${client_id}"
        captures: {policy_id: $.data.id}
      - call: "POST /idv/verification-policies/${policy_id}/publish"
        payload:
          expected_client_version: "${client_v}"
        as: ComplianceOfficer
        as_user_id: co-1
      trigger:
      - call: POST /idv/verification-sessions
        payload:
          client_id: "${client_id}"
          external_subject_ref: subj-type
          requested_assurance_tier: BASIC
          subject_jurisdiction_code: usa
        as: ClientIntegrator
        as_user_id: "${client_id}"
        captures: *id001
      assert:
      - response status is 422 and $.data.error_id == ERR_INVALID_REQUEST
      - "GET /idv/verification-sessions?client_id=${client_id} returns total_count == 0"
  - name: cohort_metric_with_false_reject_count_above_attempt_count_is_rejected
    claim_type: type_constraints
    grounds:
    - "validations[priority=13]"
    - entities.CohortMetric.fields.false_reject_count
    distinguishing_aspect: "false_reject_count is constrained to 0..attempt_count, so 150 rejects out of 100 attempts must be refused with ERR_INVALID_REQUEST instead of producing an frr_bps above 10000."
    test_recipe:
      setup: [A KNOWLEDGE_BASED profile kbav1 exists and audit A1 is COLLECTING over 2026-06-01 to 2026-07-01.]
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: "2026-08-01T00:00:00Z"
        as: PlatformAdmin
        as_user_id: admin-1
      - call: POST /idv/method-profiles
        payload: {method_code: KNOWLEDGE_BASED, vendor_code: kbav1, assurance_weight: 15, acceptance_floor_bps: 6000, far_bps: 150, frr_bps: 900, strong_evidence: false, cost_cents: 20}
        as: PlatformAdmin
        as_user_id: admin-1
        captures: {p_kba_id: $.data.id}
      - call: POST /idv/bias-audits
        payload:
          method_profile_id: "${p_kba_id}"
          window_start: "2026-06-01T00:00:00Z"
          window_end: "2026-07-01T00:00:00Z"
        as: ComplianceOfficer
        as_user_id: co-1
        captures: {audit_id: $.data.id}
      trigger:
      - call: "POST /idv/bias-audits/${audit_id}/cohort-metrics"
        payload: {cohort_code: AGE_18_24, attempt_count: 100, false_reject_count: 150, false_accept_count: 2}
        as: ComplianceOfficer
        as_user_id: co-1
        captures: *id001
      assert:
      - response status is 422 and $.data.error_id == ERR_INVALID_REQUEST
      - "GET /idv/bias-audits/${audit_id}/cohort-metrics returns total_count == 0"
      - "BiasAudit.${audit_id}.included_cohort_count == 0 and state == COLLECTING"
  - name: document_capture_is_immutable_with_no_version_field_and_no_update_endpoint
    claim_type: immutability
    grounds:
    - entities.DocumentCapture
    - "endpoints[GET /idv/method-attempts/{id}/document-captures]"
    distinguishing_aspect: "DocumentCapture is declared common_fields false, so its rows carry only id and created_at, expose no version or updated_at, and no PATCH, PUT or DELETE endpoint exists for them\
      \ anywhere in the surface."
    test_recipe:
      setup:
      - "PlatformAdmin admin-1 sets the clock to 2026-08-01T00:00:00Z, onboards a LIVE client and the vendor method profiles, ComplianceOfficer co-1 publishes policy v1, and the ClientIntegrator opens a\
        \ session."
      - Attempt A1 on docv1 already carries one clean document capture.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: "2026-08-01T00:00:00Z"
        as: PlatformAdmin
        as_user_id: admin-1
      - call: POST /idv/clients
        payload: {name: Acme Immut, home_jurisdiction_code: US, biometric_retention_mode: DELETE_ON_COMPLETE, daily_session_quota: 50, granted_review_credits: 1}
        as: PlatformAdmin
        as_user_id: admin-1
        captures: {client_id: $.data.id}
      - call: "PATCH /idv/clients/${client_id}"
        payload: {integration_state: LIVE}
        as: PlatformAdmin
        as_user_id: admin-1
        captures: {client_v: $.data.version}
      - call: POST /idv/method-profiles
        payload: {method_code: DOCUMENT_SCAN, vendor_code: docv1, assurance_weight: 45, acceptance_floor_bps: 8000, far_bps: 30, frr_bps: 400, strong_evidence: true, cost_cents: 120}
        as: PlatformAdmin
        as_user_id: admin-1
        captures: {p_doc_id: $.data.id}
      - call: POST /idv/verification-policies
        payload:
          client_id: "${client_id}"
          policy_version: 1
          allowed_method_codes: [DOCUMENT_SCAN]
          min_assurance_score: 40
        as: ClientIntegrator
        as_user_id: "${client_id}"
        captures: {policy_id: $.data.id}
      - call: "POST /idv/verification-policies/${policy_id}/publish"
        payload:
          expected_client_version: "${client_v}"
        as: ComplianceOfficer
        as_user_id: co-1
      - call: POST /idv/verification-sessions
        payload:
          client_id: "${client_id}"
          external_subject_ref: subj-immut
          requested_assurance_tier: BASIC
          subject_jurisdiction_code: US
        as: ClientIntegrator
        as_user_id: "${client_id}"
        captures: {s_id: $.data.id}
      - call: "POST /idv/verification-sessions/${s_id}/method-attempts"
        payload:
          method_profile_id: "${p_doc_id}"
        as: ClientIntegrator
        as_user_id: "${client_id}"
        captures: {a1: $.data.id}
      - call: "POST /idv/method-attempts/${a1}/document-captures"
        payload: {document_type: PASSPORT, required_feature_count: 10, passed_feature_count: 10, tamper_signal_count: 0, mrz_checksum_valid: true}
        as: ClientIntegrator
        as_user_id: "${client_id}"
      trigger:
      - call: "GET /idv/method-attempts/${a1}/document-captures"
        payload: {}
        as: ClientIntegrator
        as_user_id: "${client_id}"
      assert:
      - response status is 200 with total_count == 1
