        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_DUPLICATE_AUTHORIZATION]", entities.TeacherAuthorization]
        distinguishing_aspect: "At most one TeacherAuthorization row per (teacher, course) ever: a second create fails 409 ERR_DUPLICATE_AUTHORIZATION."
