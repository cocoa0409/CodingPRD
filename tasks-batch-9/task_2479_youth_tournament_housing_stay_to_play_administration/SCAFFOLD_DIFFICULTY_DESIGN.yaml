            - "RoomBlock.${block_id}.rooms_committed == 0"

      - name: safety_beats_referential_on_rooming_list
        grounds:
          - validations[priority=30]
          - validations[priority=64]
          - errors.ERR_CHAPERONE_REQUIRED
          - errors.ERR_ROOMING_LIST_OCCUPANT_MISMATCH
