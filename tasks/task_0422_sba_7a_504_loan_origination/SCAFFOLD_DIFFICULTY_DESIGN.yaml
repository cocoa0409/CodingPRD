# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Cross-references SCAFFOLD.yaml §1.1–§1.7 against the nine §0.5 Difficulty Rules.
# 9 rules x >=2 instances = 18 instances. Every grounds[] resolves into §1.1–§1.7;
# every setup_api_calls/trigger chain is executable from empty-DB; every numeric
# assert is a literal computed from the pinned §1.3 formulas.
#
# Canonical roles & ids used throughout:
#   SbaOfficer (opaque), LoanOfficer (opaque, X-User-ID "officer-1"),
#   CreditApprover (opaque, X-User-ID "approver-1"), InvestorServicer (opaque).
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: guaranty_fee_sale_independent_on_application
        grounds:
          - calculations.guaranty_fee
          - state_machines.Application.APPROVED_to_AUTHORIZED
          - state_machines.Application.RETAINED_to_SOLD
          - entities.Application.fields.guaranty_fee_cents
        distinguishing_aspect: |
          On the Application domain, the upfront guaranty_fee_cents frozen at AUTHORIZED
          (1012500) is identical whether or not the guaranteed portion is later SOLD on
          the secondary market — the gross_fee and net_of_secondary_credit variants
          produce the SAME number, pinning that a sale never rebates the upfront fee.
        test_recipe:
          setup:
            - "A 7A loan: Application requested 50000000, guaranty_pct 0.75, maturity 240, AUTHORIZED (size-eligible, collateral 56000000 net covers 50000000)."
            - "guaranty_fee_cents frozen at 1012500, guaranteed_amount_cents at 37500000."
            - "Then a GuarantySale for 37500000 at 350bps is SETTLED so guaranty_status is SOLD."
          setup_api_calls:
            - call: "POST /sba/lenders"
              payload: { name: "First CDC", program: "7A" }
              as: SbaOfficer
              captures: { lender_id: $.data.id }
            - call: "POST /sba/borrowers"
              payload: { lender_id: "${lender_id}", legal_name: "Acme LLC", naics_code: "236220", tangible_net_worth_cents: 1000000000, avg_net_income_cents: 300000000, affiliate_employee_count: 50 }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { borrower_id: $.data.id }
            - call: "POST /sba/applications"
              payload: { borrower_id: "${borrower_id}", requested_amount_cents: 50000000, guaranty_pct: 0.75, maturity_months: 240 }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { app_id: $.data.id }
            - call: "POST /sba/proceeds"
              payload: { application_id: "${app_id}", use_category: "REAL_ESTATE", amount_cents: 50000000 }
              as: LoanOfficer
              as_user_id: "officer-1"
            - call: "POST /sba/applications/${app_id}/submit"
              payload: {}
              as: LoanOfficer
              as_user_id: "officer-1"
            - call: "POST /sba/collateral"
              payload: { application_id: "${app_id}", asset_type: "REAL_ESTATE", appraised_value_cents: 70000000 }
              as: LoanOfficer
              as_user_id: "officer-1"
            - call: "POST /sba/form-packages"
              payload: { application_id: "${app_id}", form_1919_complete: true, form_1920_complete: true, character_cleared: true }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { fp_id: $.data.id }
            - call: "POST /sba/form-packages/${fp_id}/submit"
              payload: {}
              as: LoanOfficer
              as_user_id: "officer-1"
            - call: "POST /sba/form-packages/${fp_id}/review"
              payload: {}
              as: CreditApprover
              as_user_id: "approver-1"
            - call: "POST /sba/credit-memos"
              payload: { application_id: "${app_id}", dscr: 1.35, risk_rating: 3, recommendation: "APPROVE" }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { cm_id: $.data.id }
            - call: "POST /sba/credit-memos/${cm_id}/submit"
              payload: {}
              as: LoanOfficer
              as_user_id: "officer-1"
            - call: "POST /sba/applications/${app_id}/approve"
              payload: {}
              as: CreditApprover
              as_user_id: "approver-1"
            - call: "POST /sba/applications/${app_id}/authorize"
              payload: {}
              as: SbaOfficer
              captures: { fee_before: $.data.guaranty_fee_cents, app_v: $.data.version }
            - call: "POST /sba/guaranty-sales"
              payload: { application_id: "${app_id}", investor_user_id: "inv-9", sold_principal_cents: 37500000, premium_bps: 350 }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { sale_id: $.data.id }
            - call: "POST /sba/guaranty-sales/${sale_id}/settle"
              payload: { expected_application_version: "${app_v}" }
              as: InvestorServicer
          trigger:
            - call: "GET /sba/applications/${app_id}"
              payload: {}
              as: SbaOfficer
              captures: { fee_after: $.data.guaranty_fee_cents, gstatus: $.data.guaranty_status }
          assert:
            - "Application.${app_id}.guaranty_fee_cents == 1012500"
            - "Application.${app_id}.guaranty_status == SOLD"
            - "guaranty_fee_cents is unchanged by the SETTLED sale (fee_after == fee_before == 1012500)"

      - name: guaranty_purchase_payout_repair_vs_clean
        grounds:
          - calculations.guaranty_purchase_payout
          - state_machines.Application.RETAINED_to_PURCHASED_BY_SBA
          - entities.GuarantyPurchase.fields.approved_amount_cents
          - entities.GuarantyPurchase.fields.repair_pct
        distinguishing_aspect: |
          On the GuarantyPurchase domain (a different entity from guaranty_fee's Application),
          the clean_payout variant pays min(claimed, cap)=10000000 while the repaired_payout
          variant on identical claimed/cap applies repair_pct=0.10 LAST to yield 9000000 — same
          inputs, two valid algorithms, 1000000 delta.
        test_recipe:
          setup:
            - "An AUTHORIZED, fully-disbursed (50000000) 7A loan gp 0.75, never sold, that goes DEFAULTED (last accepted report days_past_due 95)."
            - "outstanding_principal_cents is 50000000 (no principal repaid); cap = round_half_up(50000000*0.75) = 37500000."
            - "No SETTLED liquidation, so sba_recovery_credit = 0."
          setup_api_calls:
            - call: "POST /sba/lenders"
              payload: { name: "Second CDC", program: "7A" }
              as: SbaOfficer
              captures: { lender_id: $.data.id }
            - call: "POST /sba/borrowers"
              payload: { lender_id: "${lender_id}", legal_name: "Beta LLC", naics_code: "236220", tangible_net_worth_cents: 1000000000, avg_net_income_cents: 300000000, affiliate_employee_count: 50 }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { borrower_id: $.data.id }
            - call: "POST /sba/applications"
              payload: { borrower_id: "${borrower_id}", requested_amount_cents: 50000000, guaranty_pct: 0.75, maturity_months: 240 }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { app_id: $.data.id }
            - call: "POST /sba/proceeds"
              payload: { application_id: "${app_id}", use_category: "REAL_ESTATE", amount_cents: 50000000 }
              as: LoanOfficer
              as_user_id: "officer-1"
            - call: "POST /sba/applications/${app_id}/submit"
              payload: {}
              as: LoanOfficer
              as_user_id: "officer-1"
            - call: "POST /sba/collateral"
              payload: { application_id: "${app_id}", asset_type: "REAL_ESTATE", appraised_value_cents: 70000000 }
              as: LoanOfficer
              as_user_id: "officer-1"
            - call: "POST /sba/form-packages"
              payload: { application_id: "${app_id}", form_1919_complete: true, form_1920_complete: true, character_cleared: true }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { fp_id: $.data.id }
            - call: "POST /sba/form-packages/${fp_id}/submit"
              payload: {}
              as: LoanOfficer
              as_user_id: "officer-1"
            - call: "POST /sba/form-packages/${fp_id}/review"
              payload: {}
              as: CreditApprover
              as_user_id: "approver-1"
            - call: "POST /sba/credit-memos"
              payload: { application_id: "${app_id}", dscr: 1.35, risk_rating: 3, recommendation: "APPROVE" }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { cm_id: $.data.id }
            - call: "POST /sba/credit-memos/${cm_id}/submit"
              payload: {}
              as: LoanOfficer
              as_user_id: "officer-1"
            - call: "POST /sba/applications/${app_id}/approve"
              payload: {}
              as: CreditApprover
              as_user_id: "approver-1"
            - call: "POST /sba/applications/${app_id}/authorize"
              payload: {}
              as: SbaOfficer
            - call: "POST /sba/disbursements"
              payload: { application_id: "${app_id}", amount_cents: 50000000, tranche_label: "Initial", draw_window_start_day: 0, draw_window_end_day: 30 }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { disb_id: $.data.id }
            - call: "POST /sba/disbursements/${disb_id}/post"
              payload: {}
              as: LoanOfficer
              as_user_id: "officer-1"
            - call: "POST /sba/servicing-reports"
              payload: { application_id: "${app_id}", period_index: 0, period_start_month: 0, period_end_month: 0, principal_paid_cents: 0, interest_paid_cents: 100000, days_past_due: 95 }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { rpt0_id: $.data.id }
            - call: "POST /sba/servicing-reports/${rpt0_id}/accept"
              payload: {}
              as: SbaOfficer
            - call: "POST /sba/applications/${app_id}/declare-default"
              payload: {}
              as: LoanOfficer
              as_user_id: "officer-1"
            - call: "POST /sba/guaranty-purchases"
              payload: { application_id: "${app_id}", claimed_principal_cents: 10000000, repair_pct: 0.10 }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { gp_id: $.data.id }
          trigger:
            - call: "POST /sba/guaranty-purchases/${gp_id}/pay"
              payload: {}
              as: SbaOfficer
              captures: { approved: $.data.approved_amount_cents }
          assert:
            - "GuarantyPurchase.${gp_id}.approved_amount_cents == 9000000"
            - "clean would have been min(10000000, 37500000)=10000000; repaired applies 0.10 last -> floor(10000000*0.90)=9000000"
            - "Application.${app_id}.guaranty_status == PURCHASED_BY_SBA"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: secondary_premium_three_input_nonlinear_branch
        grounds:
          - calculations.secondary_market_premium
          - state_machines.Application.RETAINED_to_SOLD
          - entities.GuarantySale.fields.premium_cents
        distinguishing_aspect: |
          Mode (a): three inputs (sold_principal_cents 37500000, premium_bps 350, SBA_SPLIT)
          interact through the conditional branch at the lender-retained floor (375000), so
          premium_cents = 1312500 - floor((1312500-375000)*0.5) = 843750 (not a linear scale).
        test_recipe:
          setup:
            - "AUTHORIZED 7A loan gp 0.75, guaranteed_amount_cents 37500000, RETAINED."
            - "A GuarantySale of 37500000 at 350bps is created then SETTLED."
          setup_api_calls:
            - call: "POST /sba/lenders"
              payload: { name: "Prem CDC", program: "7A" }
              as: SbaOfficer
              captures: { lender_id: $.data.id }
            - call: "POST /sba/borrowers"
              payload: { lender_id: "${lender_id}", legal_name: "Prem LLC", naics_code: "236220", tangible_net_worth_cents: 1000000000, avg_net_income_cents: 300000000, affiliate_employee_count: 50 }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { borrower_id: $.data.id }
            - call: "POST /sba/applications"
              payload: { borrower_id: "${borrower_id}", requested_amount_cents: 50000000, guaranty_pct: 0.75, maturity_months: 240 }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { app_id: $.data.id }
            - call: "POST /sba/proceeds"
              payload: { application_id: "${app_id}", use_category: "REAL_ESTATE", amount_cents: 50000000 }
              as: LoanOfficer
              as_user_id: "officer-1"
            - call: "POST /sba/applications/${app_id}/submit"
              payload: {}
              as: LoanOfficer
              as_user_id: "officer-1"
            - call: "POST /sba/collateral"
              payload: { application_id: "${app_id}", asset_type: "REAL_ESTATE", appraised_value_cents: 70000000 }
              as: LoanOfficer
              as_user_id: "officer-1"
            - call: "POST /sba/form-packages"
              payload: { application_id: "${app_id}", form_1919_complete: true, form_1920_complete: true, character_cleared: true }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { fp_id: $.data.id }
            - call: "POST /sba/form-packages/${fp_id}/submit"
              payload: {}
              as: LoanOfficer
              as_user_id: "officer-1"
            - call: "POST /sba/form-packages/${fp_id}/review"
              payload: {}
              as: CreditApprover
              as_user_id: "approver-1"
            - call: "POST /sba/credit-memos"
              payload: { application_id: "${app_id}", dscr: 1.35, risk_rating: 3, recommendation: "APPROVE" }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { cm_id: $.data.id }
            - call: "POST /sba/credit-memos/${cm_id}/submit"
              payload: {}
              as: LoanOfficer
              as_user_id: "officer-1"
            - call: "POST /sba/applications/${app_id}/approve"
              payload: {}
              as: CreditApprover
              as_user_id: "approver-1"
            - call: "POST /sba/applications/${app_id}/authorize"
              payload: {}
              as: SbaOfficer
              captures: { app_v: $.data.version }
            - call: "POST /sba/guaranty-sales"
              payload: { application_id: "${app_id}", investor_user_id: "inv-9", sold_principal_cents: 37500000, premium_bps: 350 }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { sale_id: $.data.id }
          trigger:
            - call: "POST /sba/guaranty-sales/${sale_id}/settle"
              payload: { expected_application_version: "${app_v}" }
              as: InvestorServicer
              captures: { prem: $.data.premium_cents }
          assert:
            - "GuarantySale.${sale_id}.premium_cents == 843750"
            - "gross_premium=floor(37500000*350/10000)=1312500; lender_retained=floor(37500000*100/10000)=375000; sba_cut=floor((1312500-375000)*0.5)=468750; net=843750"

      - name: collateral_floor_per_item_then_sum_order
        grounds:
          - calculations.collateral_coverage
          - state_machines.Application.UNDERWRITING_to_PENDING_APPROVAL
          - entities.CollateralItem.fields.discounted_value_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — two EQUIPMENT items appraised
          12500001 and 12500001 floor-per-item to 6250000 each (sum 12500000), whereas
          sum-then-round of floor((12500001+12500001)*0.5)=12500001 would over-credit by 1;
          the scaffold pins round-per-item-then-sum, so coverage of 12500000 fails the 12500001 short-term requirement.
        test_recipe:
          setup:
            - "An UNDERWRITING 7A loan: requested 25000002, gp 0.75, maturity 60 (<=120 short-term)."
            - "Short-term required = floor(25000002*0.50) = 12500001."
            - "Two EQUIPMENT collateral items each appraised 12500001, prior_lien 0; floor(12500001*0.50)=6250000 each, sum 12500000 < 12500001 -> shortfall."
            - "FormPackage CLEARED so coverage is the failing check."
          setup_api_calls:
            - call: "POST /sba/lenders"
              payload: { name: "Coll CDC", program: "7A" }
              as: SbaOfficer
              captures: { lender_id: $.data.id }
            - call: "POST /sba/borrowers"
              payload: { lender_id: "${lender_id}", legal_name: "Coll LLC", naics_code: "333120", tangible_net_worth_cents: 1000000000, avg_net_income_cents: 300000000, affiliate_employee_count: 50 }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { borrower_id: $.data.id }
            - call: "POST /sba/applications"
              payload: { borrower_id: "${borrower_id}", requested_amount_cents: 25000002, guaranty_pct: 0.75, maturity_months: 60 }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { app_id: $.data.id }
            - call: "POST /sba/proceeds"
              payload: { application_id: "${app_id}", use_category: "EQUIPMENT", amount_cents: 25000002 }
              as: LoanOfficer
              as_user_id: "officer-1"
            - call: "POST /sba/applications/${app_id}/submit"
              payload: {}
              as: LoanOfficer
              as_user_id: "officer-1"
            - call: "POST /sba/collateral"
              payload: { application_id: "${app_id}", asset_type: "EQUIPMENT", appraised_value_cents: 12500001 }
              as: LoanOfficer
              as_user_id: "officer-1"
            - call: "POST /sba/collateral"
              payload: { application_id: "${app_id}", asset_type: "EQUIPMENT", appraised_value_cents: 12500001 }
              as: LoanOfficer
              as_user_id: "officer-1"
            - call: "POST /sba/form-packages"
              payload: { application_id: "${app_id}", form_1919_complete: true, form_1920_complete: true, character_cleared: true }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { fp_id: $.data.id }
            - call: "POST /sba/form-packages/${fp_id}/submit"
              payload: {}
              as: LoanOfficer
              as_user_id: "officer-1"
            - call: "POST /sba/form-packages/${fp_id}/review"
              payload: {}
              as: CreditApprover
              as_user_id: "approver-1"
            - call: "POST /sba/credit-memos"
              payload: { application_id: "${app_id}", dscr: 1.30, risk_rating: 4, recommendation: "APPROVE" }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { cm_id: $.data.id }
          trigger:
            - call: "POST /sba/credit-memos/${cm_id}/submit"
              payload: {}
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_COLLATERAL_SHORTFALL (HTTP 409)"
            - "Each CollateralItem.discounted_value_cents == 6250000; total 12500000 < required 12500001"
            - "CreditMemo.${cm_id}.status remains DRAFT; Application.${app_id}.status remains UNDERWRITING"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: application_underwriting_revision_cycle
        grounds:
          - state_machines.Application.PENDING_APPROVAL_to_REVISION
          - state_machines.Application.REVISION_to_UNDERWRITING
          - state_machines.Application.UNDERWRITING_to_PENDING_APPROVAL
        distinguishing_aspect: |
          Cyclic shape on the Application entity: UNDERWRITING -> PENDING_APPROVAL ->
          (request-revision) REVISION -> (resubmit) UNDERWRITING — the same row re-enters
          UNDERWRITING after a full loop, which a linear pipeline cannot do.
        test_recipe:
          setup:
            - "A 7A loan reaches PENDING_APPROVAL with a SUBMITTED memo (cm1)."
            - "Approver requests revision -> Application REVISION, cm1 REJECTED."
            - "Officer authors a new DRAFT memo (cm2) and resubmits -> Application back to UNDERWRITING."
          setup_api_calls:
            - call: "POST /sba/lenders"
              payload: { name: "Cycle CDC", program: "7A" }
              as: SbaOfficer
              captures: { lender_id: $.data.id }
            - call: "POST /sba/borrowers"
              payload: { lender_id: "${lender_id}", legal_name: "Cyc LLC", naics_code: "236220", tangible_net_worth_cents: 1000000000, avg_net_income_cents: 300000000, affiliate_employee_count: 50 }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { borrower_id: $.data.id }
            - call: "POST /sba/applications"
              payload: { borrower_id: "${borrower_id}", requested_amount_cents: 50000000, guaranty_pct: 0.75, maturity_months: 240 }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { app_id: $.data.id }
            - call: "POST /sba/proceeds"
              payload: { application_id: "${app_id}", use_category: "REAL_ESTATE", amount_cents: 50000000 }
              as: LoanOfficer
              as_user_id: "officer-1"
            - call: "POST /sba/applications/${app_id}/submit"
              payload: {}
              as: LoanOfficer
              as_user_id: "officer-1"
            - call: "POST /sba/collateral"
              payload: { application_id: "${app_id}", asset_type: "REAL_ESTATE", appraised_value_cents: 70000000 }
              as: LoanOfficer
              as_user_id: "officer-1"
            - call: "POST /sba/form-packages"
              payload: { application_id: "${app_id}", form_1919_complete: true, form_1920_complete: true, character_cleared: true }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { fp_id: $.data.id }
            - call: "POST /sba/form-packages/${fp_id}/submit"
              payload: {}
              as: LoanOfficer
              as_user_id: "officer-1"
            - call: "POST /sba/form-packages/${fp_id}/review"
              payload: {}
              as: CreditApprover
              as_user_id: "approver-1"
            - call: "POST /sba/credit-memos"
              payload: { application_id: "${app_id}", dscr: 1.10, risk_rating: 6, recommendation: "APPROVE" }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { cm1_id: $.data.id }
            - call: "POST /sba/credit-memos/${cm1_id}/submit"
              payload: {}
              as: LoanOfficer
              as_user_id: "officer-1"
            - call: "POST /sba/applications/${app_id}/request-revision"
              payload: {}
              as: CreditApprover
              as_user_id: "approver-1"
            - call: "POST /sba/credit-memos"
              payload: { application_id: "${app_id}", dscr: 1.40, risk_rating: 3, recommendation: "APPROVE" }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { cm2_id: $.data.id }
          trigger:
            - call: "POST /sba/applications/${app_id}/resubmit"
              payload: {}
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { st: $.data.status }
          assert:
            - "Application.${app_id}.status == UNDERWRITING (re-entered after the loop)"
            - "CreditMemo.${cm1_id}.status == REJECTED"
            - "CreditMemo.${cm2_id}.status == DRAFT"

      - name: form_package_branching_submitted_to_flagged
        grounds:
          - state_machines.FormPackage.SUBMITTED_to_CLEARED
          - state_machines.FormPackage.SUBMITTED_to_FLAGGED
          - state_machines.FormPackage.FLAGGED_to_INCOMPLETE
        distinguishing_aspect: |
          Branching fork on a DIFFERENT entity (FormPackage): SUBMITTED forks to CLEARED
          (character_cleared true) vs FLAGGED (false) with divergent side effects — the
          FLAGGED branch keeps credit-memo submit blocked and offers a FLAGGED->INCOMPLETE
          correction edge the CLEARED branch does not.
        test_recipe:
          setup:
            - "An UNDERWRITING 7A loan with a FormPackage submitted with character_cleared=false."
          setup_api_calls:
            - call: "POST /sba/lenders"
              payload: { name: "Branch CDC", program: "7A" }
              as: SbaOfficer
