              payload: {}
              as: BrandManager
            - call: "POST /messaging/accounts/${acct}/brands/${brand}/verify"
              payload: {}
              as: CarrierReviewer
            - call: "POST /messaging/accounts/${acct}/campaigns"
              payload: { brand_id: "${brand}", use_case: "MARKETING", description: "Promos", sample_messages: ["Hi"], help_message: "HELP", stop_message: "STOP", path_kind: "TEN_DLC" }
              as: CampaignManager
              captures: { camp: $.data.id }
            - call: "POST /messaging/accounts/${acct}/campaigns/${camp}/submit"
              payload: {}
              as: CampaignManager
            - call: "POST /messaging/accounts/${acct}/campaigns/${camp}/approve"
              payload: {}
              as: CarrierReviewer
            - call: "POST /messaging/accounts/${acct}/numbers"
              payload: { phone_number: "+15551234567", number_type: "TEN_DLC", country_code: "US" }
              as: NumberProvisioner
              captures: { num: $.data.id }
            - call: "POST /messaging/accounts/${acct}/numbers/${num}/activate"
              payload: {}
              as: NumberProvisioner
            - call: "GET /messaging/accounts/${acct}/campaigns/${camp}"
              payload: {}
              as: CampaignManager
              captures: { camp_v: $.data.version }
            - call: "POST /messaging/accounts/${acct}/numbers/${num}/attach"
              payload: { campaign_id: "${camp}", expected_campaign_version: "${camp_v}" }
              as: NumberProvisioner
            - call: "POST /messaging/accounts/${acct}/suspend"
