    code: 200
    input: ["agreement_id?", "status?", "limit?", "offset?"]
    output: "DataFeedBatch[]"
    side_effects: []
  - method: GET
    path: "/data-feed-batches/{id}"
    description: "Get one batch"
    roles: [PlatformAdmin, DataAcquisitionManager, PrivacyOfficer, SupplierOperator, ManufacturerClient]
    code: 200
    input: []
    output: DataFeedBatch
    side_effects: []
  - method: POST
    path: "/data-feed-batches/{id}/validate"
