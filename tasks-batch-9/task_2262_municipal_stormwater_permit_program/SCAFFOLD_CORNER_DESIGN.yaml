          trigger:
            - call: "GET /stormwater/control-measures/${mo_id}"
              payload: {}
              as: MunicipalOperationsSupervisor
              as_user_id: "ops-01"
            - call: "POST /stormwater/outfalls/${of2_id}/retire"
              payload: {}
              as: StormwaterProgramManager
              as_user_id: "mgr-01"
            - call: "GET /stormwater/control-measures/${mo_id}"
              payload: {}
              as: MunicipalOperationsSupervisor
              as_user_id: "ops-01"
            - call: "GET /stormwater/outfalls/${of2_id}"
              payload: {}
              as: MunicipalOperationsSupervisor
              as_user_id: "ops-01"
            - call: "GET /stormwater/permit-terms/${term_id}"
              payload: {}
              as: StormwaterProgramManager
              as_user_id: "mgr-01"
          assert:
            - "trigger 1: swept_lane_miles_ytd == 20.00, measurable_goal_actual == 20.0, attainment_pct == 100.00 and goal_status == MET"
            - "trigger 3: swept_lane_miles_ytd == 12.00, measurable_goal_actual == 12.0, attainment_pct == 60.00 and goal_status == BEHIND, recomputed from the live outfall set"
            - "trigger 4: Outfall.${of2_id}.status == RETIRED with swept_lane_miles_ytd still 8.00 and sweeping_runs still holding its one entry"
            - "trigger 5: behind_measure_count == 1 and compliance_posture == AT_RISK, so the retirement reached the posture through the measure"

      - name: compiling_with_a_stale_permit_term_version_is_refused
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.OCC_REPORT_COMPILE
        excluded_because:
          difficulty_instance: stale_term_version_outranks_pending_sample_block_on_compile
          rationale: "That §1.8 instance replays a superseded permit-term version on compile and shows the report staying in DRAFT."

      - name: a_suspect_screening_cascades_to_the_posture_and_the_report
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Outfall.screening_status
        excluded_because:
          difficulty_instance: suspect_screening_cascades_through_open_case_gate_to_posture_and_report
          rationale: "That §1.8 instance follows the screening cascade end to end through the case, the measure gate, the posture and the report."

      - name: the_finalize_cascade_is_verified_five_levels_deep
        claim_type: cascading_side_effects
        grounds:
          - endpoints.POST /stormwater/inspections/{id}/finalize
        excluded_because:
          difficulty_instance: inspection_finalize_cascades_five_levels_to_annual_report_invalidation
          rationale: "That §1.8 instance is the ordering-sensitive end-to-end chain for the inspection cascade."

      - name: both_billing_variants_produce_their_own_totals
        claim_type: dual_variant_calculation
        grounds:
          - calculations.credit_adjusted_net_fee.variants
        excluded_because:
          difficulty_instance: credit_pool_interim_vs_final_billing_divergence
          rationale: "That §1.8 instance runs both variants over one account set and pins the delta."

      - name: the_load_variants_diverge_on_owed_samples
        claim_type: dual_variant_calculation
        grounds:
          - calculations.outfall_annual_pollutant_load.variants
        excluded_because:
          difficulty_instance: pollutant_load_provisional_projects_owed_samples_final_does_not
          rationale: "That §1.8 instance pins the PROVISIONAL projection and the FINAL abstention on the same outfall."

      - name: the_penalty_ledger_is_reconciled_after_every_status_change
        claim_type: derived_field_reconciliation
        grounds:
          - entities.PermitTerm.fields.total_assessed_penalty_cents
        excluded_because:
          difficulty_instance: penalty_ledger_survives_rescission_without_retroactive_recomputation
          rationale: "That §1.8 instance issues, escalates, closes and rescinds and pins the ledger after each step."

      - name: the_open_case_census_is_rebuilt_on_every_resolution
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Outfall.fields.open_case_count
        excluded_because:
          difficulty_instance: open_case_census_is_rebuilt_from_live_cases_on_every_resolution
          rationale: "That §1.8 instance resolves cases one by one and pins the census at each step rather than decrementing a counter."

  - section: consistency_model
    instances:

      - name: every_cascaded_field_is_already_correct_in_the_writing_calls_own_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - response_envelope.success
          - state_machines.Outfall.screening_status
        distinguishing_aspect: "The observable is the writing call's own response body, not a later read: the POST that records a SUSPECT screening must already carry the computed screening_result, and the very next read of every touched aggregate must agree with it, with no second write and no settling period."
        test_recipe:
          setup:
            - "ACTIVE term with OF-01 and the ILLICIT_DISCHARGE measure reported fully attained"
          setup_api_calls:
            - call: "POST /stormwater/permit-terms"
              payload: { permit_number: "MS4-2026-A", term_start_date: "2026-01-01", term_end_date: "2026-12-31", tmdl_applicable: false, eru_sqft: 3000, funding_target_cents: 25000 }
              as: StormwaterProgramManager
              as_user_id: "mgr-01"
              captures: { term_id: $.data.id }
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "PUBLIC_EDUCATION", measurable_goal_target: 12, weight: 1 }
              as: StormwaterProgramManager
              as_user_id: "mgr-01"
              captures: { pe_id: $.data.id }
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "ILLICIT_DISCHARGE", measurable_goal_target: 20, weight: 3 }
              as: StormwaterProgramManager
              as_user_id: "mgr-01"
              captures: { idde_m_id: $.data.id }
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "CONSTRUCTION_RUNOFF", measurable_goal_target: 30, weight: 2 }
              as: StormwaterProgramManager
              as_user_id: "mgr-01"
              captures: { cr_id: $.data.id }
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "POST_CONSTRUCTION", measurable_goal_target: 8, weight: 2 }
              as: StormwaterProgramManager
              as_user_id: "mgr-01"
              captures: { pc_m_id: $.data.id }
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "MUNICIPAL_OPERATIONS", measurable_goal_target: 20, weight: 1, salt_storage_covered: true, fleet_wash_recycle: true }
              as: StormwaterProgramManager
              as_user_id: "mgr-01"
              captures: { mo_id: $.data.id }
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "MONITORING", measurable_goal_target: 4, weight: 1 }
              as: StormwaterProgramManager
              as_user_id: "mgr-01"
              captures: { mon_id: $.data.id }
            - call: "POST /stormwater/outfalls"
              payload: { permit_term_id: "${term_id}", outfall_code: "OF-01", receiving_water: "Mill Creek", drainage_area_acres: 45.00, priority_tier: "HIGH", baseline_concentration_mg_per_l: 0.45, design_runoff_kl: 20000, sweeping_capacity_lane_miles_per_month: 40.00 }
              as: StormwaterProgramManager
              as_user_id: "mgr-01"
              captures: { of1_id: $.data.id }
            - call: "POST /stormwater/permit-terms/${term_id}/activate"
              payload: {}
              as: StormwaterProgramManager
              as_user_id: "mgr-01"
              captures: { term_ver: $.data.version }
            - call: "POST /stormwater/control-measures/${idde_m_id}/report-progress"
              payload: { measurable_goal_actual: 20 }
              as: StormwaterProgramManager
              as_user_id: "mgr-01"
          trigger:
            - call: "POST /stormwater/outfalls/${of1_id}/observations"
              payload: { observation_type: "DRY_WEATHER_SCREENING", observed_at: "2026-08-01T08:00:00Z", dry_weather_flow_present: true, indicator_bacteria_mpn: 5000, indicator_surfactant_mg_per_l: 0.60 }
              as: IDDEInvestigator
              as_user_id: "idde-01"
              captures: { obs_id: $.data.id }
            - call: "GET /stormwater/outfalls/${of1_id}"
              payload: {}
              as: IDDEInvestigator
              as_user_id: "idde-01"
            - call: "GET /stormwater/illicit-discharge-cases"
              payload: { outfall_id: "${of1_id}", status: "OPEN" }
              as: IDDEInvestigator
              as_user_id: "idde-01"
              captures: { case1_id: "$.data[0].id" }
            - call: "GET /stormwater/control-measures/${idde_m_id}"
              payload: {}
              as: StormwaterProgramManager
              as_user_id: "mgr-01"
            - call: "GET /stormwater/outfalls/${of1_id}/observations"
              payload: { screening_result: "SUSPECT" }
              as: IDDEInvestigator
              as_user_id: "idde-01"
          assert:
            - "trigger 1's own response already carries screening_result SUSPECT, validation_status NOT_APPLICABLE, sample_load_lb null and recorded_by_user_id idde-01"
            - "trigger 2: screening_status SUSPECT, screening_count 1, open_case_count 1 and last_screened_at 2026-08-01T08:00:00Z, all visible on the first read after the write"
            - "trigger 3: one case with status OPEN, origin_observation_id ${obs_id}, opened_at 2026-08-01T00:00:00Z and tracing_attempt_count 0"
            - "trigger 4: open_case_count 1, attainment_pct 100.00 and goal_status MET, the census being live but under the gate"
            - "trigger 5: one observation, total_count 1, so the computed discriminator is filterable in the same breath"
            - "no repeated read returns a different value, there being no eventual-consistency lag anywhere in the domain"
