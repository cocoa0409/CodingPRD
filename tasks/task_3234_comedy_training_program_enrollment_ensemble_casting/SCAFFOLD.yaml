# =============================================================================
# PRD Benchmark Seed Tables — Comedy Training Program Enrollment & Ensemble
# Casting (Second City style).
# =============================================================================

scenario: |
  Comedy Training Program Enrollment & Ensemble Casting (The Second City):
  training center curriculum levels with prerequisite progression and placement
  for experienced students, class scheduling across terms with instructor
  assignment and section capacity, student showcase performances at the end of
  levels with venue and time slot allocation, conservatory and intensive
  programs with audition requirements and cohort management, ensemble casting
  for resident revues from the training pipeline and open auditions, touring
  company assembly with travel commitments and understudy coverage, alumni
  relationships and industry showcase events, tuition, refund and transfer
  policies with financial aid and diversity scholarships.

domain_name: comedy-training-ensemble
api_prefix: /

complexity_profile:
  primary_archetype: graph_constraint
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
    - scheduled_actions
  entity_topology: graph
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: hierarchical_override
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — do not modify)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: CurriculumLevel
    parent: null
    common_fields: true
    fields:
      - { name: code,            type: string,  source: input,    description: "Stable level code, e.g. L1..L5 or CONSERVATORY_Y1" }
      - { name: title,           type: string,  source: input,    description: "Human readable level name" }
      - { name: track,           type: enum,    source: input,    description: "IMPROV | SKETCH | STANDUP | CONSERVATORY", default: "IMPROV" }
      - { name: sequence_index,  type: integer, source: input,    description: "Ordering position within its track (0-based); lower unlocks earlier" }
      - { name: requires_level_code, type: string, source: input, description: "FK -> CurriculumLevel.id (by code) of the immediate prerequisite level; null for entry levels. Self-referential — the level DAG must be acyclic.", default: null }
      - { name: allows_placement_bypass, type: boolean, source: input, description: "If true, experienced students may petition a PlacementEvaluation to skip into this level", default: false }
      - { name: showcase_required, type: boolean, source: input, description: "If true, completing the level requires a graded ShowcaseEvent", default: false }
      - { name: status,          type: enum,    source: system,   description: "ACTIVE | RETIRED" , default: "ACTIVE" }

  - name: Term
    parent: null
    common_fields: true
    fields:
      - { name: name,            type: string,  source: input,    description: "Term label, e.g. 'Winter 2027'" }
      - { name: start_utc,       type: datetime, source: input,   description: "Term start instant (inclusive)" }
      - { name: end_utc,         type: datetime, source: input,   description: "Term end instant (exclusive)" }
      - { name: drop_deadline_utc, type: datetime, source: input, description: "Last instant an enrollment may be dropped with full refund; drops after this become DROPPED_LATE with partial refund" }
      - { name: status,          type: enum,    source: system,   description: "DRAFT | SCHEDULING | ENROLLMENT_OPEN | IN_SESSION | CLOSED", default: "DRAFT" }

  - name: Instructor
    parent: null
    common_fields: true
    fields:
      - { name: display_name,    type: string,  source: input,    description: "Instructor stage name" }
      - { name: home_track,      type: enum,    source: input,    description: "Primary track the instructor is certified to teach (IMPROV | SKETCH | STANDUP | CONSERVATORY)" }
      - { name: certified_tracks, type: array,  source: input,    description: "Array of enum track codes this instructor may teach" }
      - { name: max_weekly_hours, type: integer, source: input,   description: "Hard weekly cap on scheduled teaching hours", default: 20 }
      - { name: status,          type: enum,    source: system,   description: "ACTIVE | ON_LEAVE | INACTIVE", default: "ACTIVE" }

  - name: CourseSection
    parent: null
    common_fields: true
    fields:
      - { name: term_id,         type: string,  source: input,    description: "FK -> Term.id" }
      - { name: level_id,        type: string,  source: input,    description: "FK -> CurriculumLevel.id" }
      - { name: instructor_id,   type: string,  source: input,    description: "FK -> Instructor.id; may be null while DRAFT" }
      - { name: capacity,        type: integer, source: input,    description: "Max concurrent enrollments; >0" }
      - { name: tuition_cents,   type: integer, source: input,    description: "Base tuition for the section" }
      - { name: weekly_hours,    type: integer, source: input,    description: "Hours per week this section runs (drives instructor load)" }
      - { name: enrolled_count,  type: integer, source: computed, description: "Count of enrollments in REGISTERED or CONFIRMED" }
      - { name: waitlist_count,  type: integer, source: computed, description: "Count of enrollments in WAITLISTED" }
      - { name: status,          type: enum,    source: system,   description: "DRAFT | OPEN | LOCKED | RUNNING | COMPLETED | CANCELLED", default: "DRAFT" }

  - name: Student
    parent: null
    common_fields: true
    fields:
      - { name: full_name,       type: string,  source: input,    description: "Student's name" }
      - { name: email,           type: string,  source: input,    description: "Unique email" }
      - { name: is_alumni,       type: boolean, source: computed, description: "True once any enrollment reaches CREDITED" }
      - { name: is_industry_showcase_eligible, type: boolean, source: computed, description: "True when student is_alumni AND has graduated from any CohortProgram" }
      - { name: standing,        type: enum,    source: system,   description: "GOOD | FINANCIAL_HOLD | SUSPENDED", default: "GOOD" }
      - { name: completed_level_codes, type: array, source: computed, description: "Set of CurriculumLevel.code values the student has CREDITED" }
      - { name: placement_credit_codes, type: array, source: computed, description: "Set of CurriculumLevel.code values covered by GRANTED PlacementEvaluations" }

  - name: PlacementEvaluation
    parent: null
    common_fields: true
    fields:
      - { name: student_id,      type: string,  source: input,    description: "FK -> Student.id" }
      - { name: target_level_id, type: string,  source: input,    description: "FK -> CurriculumLevel.id (the level the student wishes to ENTER)" }
      - { name: track,           type: enum,    source: input,    description: "Track the evaluation covers" }
      - { name: prior_institution, type: string, source: input,   description: "Name of prior training institution (e.g. 'iO', 'UCB', 'Groundlings'); empty string triggers PORTFOLIO_REVIEW variant" }
      - { name: portfolio_score, type: integer, source: input,    description: "0..100 committee score; only used in PORTFOLIO_REVIEW variant", default: 0 }
      - { name: variant,         type: enum,    source: computed, description: "AUDITION_BYPASS | PORTFOLIO_REVIEW — derived from prior_institution membership in RECOGNIZED_INSTITUTIONS" }
      - { name: decision,        type: enum,    source: system,   description: "SUBMITTED | UNDER_REVIEW | GRANTED | DENIED | APPEALED", default: "SUBMITTED" }
      - { name: granted_level_codes, type: array, source: computed, description: "Levels the grant covers (target and below within the same track)" }

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - { name: student_id,      type: string,  source: input,    description: "FK -> Student.id" }
      - { name: section_id,      type: string,  source: input,    description: "FK -> CourseSection.id" }
      - { name: priority_tier,   type: enum,    source: input,    description: "RETURNING | NEW — influences waitlist promotion order", default: "NEW" }
      - { name: origin_enrollment_id, type: string, source: input, description: "FK -> Enrollment.id of the enrollment this one was transferred from; null for original registrations", default: null }
      - { name: status,          type: enum,    source: system,   description: "REGISTERED | CONFIRMED | WAITLISTED | DROPPED_EARLY | DROPPED_LATE | TRANSFERRED_OUT | COMPLETED | CREDITED", default: "REGISTERED" }
      - { name: graded_showcase_id, type: string, source: system, description: "FK -> ShowcaseEvent.id once a graded showcase is recorded", default: null }

  - name: ShowcaseEvent
    parent: null
    common_fields: true
    fields:
      - { name: level_id,        type: string,  source: input,    description: "FK -> CurriculumLevel.id" }
      - { name: venue_slot_id,   type: string,  source: input,    description: "FK -> VenueSlot.id; allocated when scheduled" }
      - { name: term_id,         type: string,  source: input,    description: "FK -> Term.id" }
      - { name: is_industry,     type: boolean, source: input,    description: "True for industry-facing alumni showcases", default: false }
      - { name: performer_enrollment_ids, type: array, source: input, description: "FK -> Enrollment.id list (graduating cohort)" }
      - { name: grade_by_enrollment, type: object, source: input, description: "Map enrollment_id -> PASS | FAIL — recorded at staging" }
      - { name: status,          type: enum,    source: system,   description: "PLANNED | SCHEDULED | STAGED | ARCHIVED | CANCELLED", default: "PLANNED" }

  - name: VenueSlot
    parent: null
    common_fields: true
    fields:
      - { name: venue_name,      type: string,  source: input,    description: "Stage / theater name (e.g. 'Mainstage', 'e.t.c.')" }
      - { name: start_utc,       type: datetime, source: input,   description: "Show start (inclusive)" }
      - { name: end_utc,         type: datetime, source: input,   description: "Show end (exclusive — half-open interval)" }
      - { name: capacity,        type: integer, source: input,    description: "Audience seats (not used for booking; informational)" }
      - { name: status,          type: enum,    source: system,   description: "AVAILABLE | RESERVED | BOOKED | RELEASED", default: "AVAILABLE" }

  - name: CohortProgram
    parent: null
    common_fields: true
    fields:
      - { name: kind,            type: enum,    source: input,    description: "CONSERVATORY | INTENSIVE" }
      - { name: track,           type: enum,    source: input,    description: "IMPROV | SKETCH | STANDUP | CONSERVATORY" }
      - { name: term_id,         type: string,  source: input,    description: "FK -> Term.id" }
      - { name: cohort_size,     type: integer, source: input,    description: "Maximum admitted students" }
      - { name: admitted_count,  type: integer, source: computed, description: "Number of members currently admitted" }
      - { name: requires_audition, type: boolean, source: input,  description: "If true, students must pass an Audition to join", default: true }
      - { name: min_track_level_code, type: string, source: input, description: "Minimum CurriculumLevel.code in the track required for admission (e.g. L3)" }
      - { name: status,          type: enum,    source: system,   description: "FORMING | AUDITIONING | CASTED | ACTIVE | GRADUATED | DISSOLVED", default: "FORMING" }

  - name: Audition
    parent: null
    common_fields: true
    fields:
      - { name: student_id,      type: string,  source: input,    description: "FK -> Student.id" }
      - { name: target_kind,     type: enum,    source: input,    description: "COHORT | ENSEMBLE | TOURING — what this audition feeds" }
      - { name: cohort_program_id, type: string, source: input,   description: "FK -> CohortProgram.id when target_kind=COHORT; null otherwise", default: null }
      - { name: ensemble_cast_id, type: string,  source: input,   description: "FK -> EnsembleCast.id when target_kind=ENSEMBLE or TOURING; null otherwise", default: null }
      - { name: rubric_scores,   type: object,  source: input,    description: "Map of dimension -> 0..10 (e.g. scene_work, characters, musicality, game)" }
      - { name: composite_score, type: number,  source: computed, description: "Weighted sum of rubric scores, see ensemble_composite_score" }
      - { name: outcome,         type: enum,    source: system,   description: "SCHEDULED | EVALUATED | SELECTED | WAITLISTED | REJECTED", default: "SCHEDULED" }

  - name: EnsembleCast
    parent: null
    common_fields: true
    fields:
      - { name: revue_title,     type: string,  source: input,    description: "Name of the resident revue" }
      - { name: venue_slot_id,   type: string,  source: input,    description: "FK -> VenueSlot.id of the opening night" }
      - { name: cast_size,       type: integer, source: input,    description: "Number of principal cast positions" }
      - { name: understudy_slots, type: integer, source: input,   description: "Number of understudy positions; each principal has 1 understudy requirement up to this count" }
      - { name: source_policy,   type: enum,    source: input,    description: "PIPELINE_ONLY | OPEN_CALL | MIXED — whether casting draws from conservatory pipeline, public auditions, or both", default: "MIXED" }
      - { name: principal_ids,   type: array,   source: computed, description: "FK -> Student.id list of confirmed principals" }
      - { name: understudy_ids,  type: array,   source: computed, description: "FK -> Student.id list of confirmed understudies" }
      - { name: status,          type: enum,    source: system,   description: "OPEN_ROLES | CASTING | REHEARSING | RUNNING | CLOSED", default: "OPEN_ROLES" }

  - name: TouringAssignment
    parent: null
    common_fields: true
    fields:
      - { name: ensemble_cast_id, type: string, source: input,    description: "FK -> EnsembleCast.id the tour draws from" }
      - { name: principal_student_id, type: string, source: input, description: "FK -> Student.id of the principal going on tour" }
      - { name: understudy_student_id, type: string, source: input, description: "FK -> Student.id of the understudy covering the home venue" }
      - { name: tour_start_utc,  type: datetime, source: input,   description: "Departure instant" }
      - { name: tour_end_utc,    type: datetime, source: input,   description: "Return instant" }
      - { name: travel_committed, type: boolean, source: computed, description: "True once the principal ACCEPTED and end-of-tour return is booked" }
      - { name: status,          type: enum,    source: system,   description: "PROPOSED | ACCEPTED | DECLINED | ON_TOUR | RETURNED | REPLACED", default: "PROPOSED" }

  - name: ScholarshipAward
    parent: null
    common_fields: true
    fields:
      - { name: student_id,      type: string,  source: input,    description: "FK -> Student.id" }
      - { name: kind,            type: enum,    source: input,    description: "NEED_BASED | DIVERSITY | MERIT" }
      - { name: amount_cents,    type: integer, source: input,    description: "Total award amount" }
      - { name: disbursed_cents, type: integer, source: computed, description: "Cumulative amount applied against tuition invoices" }
      - { name: status,          type: enum,    source: system,   description: "APPLIED | AWARDED | DENIED | DISBURSED | REVOKED", default: "APPLIED" }

  - name: TuitionInvoice
    parent: null
    common_fields: true
    fields:
      - { name: student_id,      type: string,  source: input,    description: "FK -> Student.id" }
      - { name: enrollment_id,   type: string,  source: input,    description: "FK -> Enrollment.id this invoice pays for" }
      - { name: base_amount_cents, type: integer, source: input,  description: "Tuition before scholarships/adjustments" }
      - { name: scholarship_applied_cents, type: integer, source: computed, description: "Amount of award applied at issuance" }
      - { name: amount_due_cents, type: integer, source: computed, description: "base - scholarship_applied - payments - refunds" }
      - { name: paid_cents,      type: integer, source: computed, description: "Cumulative payments received" }
      - { name: refunded_cents,  type: integer, source: computed, description: "Cumulative refunds issued" }
      - { name: status,          type: enum,    source: system,   description: "ISSUED | PARTIALLY_PAID | PAID | REFUNDED | TRANSFERRED | VOID", default: "ISSUED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Term
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: SCHEDULING
        trigger: POST /terms/{termId}/open-scheduling
        actor: ProgramDirector
        preconditions: ["Term must be DRAFT"]
        side_effects: ["CourseSection creation unlocked for this term"]
      - from: SCHEDULING
        to: ENROLLMENT_OPEN
        trigger: POST /terms/{termId}/open-enrollment
        actor: ProgramDirector
        preconditions:
          - "Term must be SCHEDULING"
          - "Every non-CANCELLED CourseSection in term must have an instructor assigned (ERR_SECTION_UNSTAFFED)"
        side_effects: ["All DRAFT sections in term transition DRAFT → OPEN"]
      - from: ENROLLMENT_OPEN
        to: IN_SESSION
        trigger: POST /terms/{termId}/start-session
        actor: ProgramDirector
        preconditions: ["Term must be ENROLLMENT_OPEN"]
        side_effects:
          - "All OPEN sections in term transition OPEN → LOCKED if enrolled_count >= 1 else OPEN → CANCELLED (cascade to enrollments)"
          - "All LOCKED sections with enrolled_count == capacity transition LOCKED → RUNNING"
      - from: IN_SESSION
        to: CLOSED
        trigger: POST /terms/{termId}/close
        actor: ProgramDirector
        preconditions: ["Term must be IN_SESSION"]
        side_effects:
          - "All RUNNING sections transition RUNNING → COMPLETED"
          - "All CONFIRMED enrollments on COMPLETED sections transition CONFIRMED → COMPLETED"
          - "For each section whose level.showcase_required is true, a ShowcaseEvent in PLANNED status is auto-created with performer_enrollment_ids equal to the COMPLETED enrollments"

  - entity: CourseSection
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "system (cascade on Term.open-enrollment)"
        actor: system
        preconditions: ["instructor_id is not null"]
        side_effects: []
      - from: OPEN
        to: LOCKED
        trigger: "system (cascade on Term.start-session when enrolled_count >= 1)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: CANCELLED
        trigger: "system (cascade on Term.start-session when enrolled_count == 0)"
        actor: system
        preconditions: []
        side_effects:
          - "All REGISTERED or WAITLISTED enrollments cascade to DROPPED_EARLY (full refund)"
          - "Any tuition invoices on those enrollments cascade to REFUNDED"
      - from: LOCKED
        to: RUNNING
        trigger: "system (cascade on Term.start-session when enrolled_count == capacity)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RUNNING
        to: COMPLETED
        trigger: "system (cascade on Term.close)"
        actor: system
        preconditions: []
        side_effects: ["All CONFIRMED enrollments transition CONFIRMED → COMPLETED"]
      - from: DRAFT
        to: CANCELLED
        trigger: POST /sections/{sectionId}/cancel
        actor: ProgramDirector
        preconditions: ["Section must be DRAFT or OPEN"]
        side_effects: []
      - from: OPEN
        to: CANCELLED
        trigger: POST /sections/{sectionId}/cancel
        actor: ProgramDirector
        preconditions: ["Section must be DRAFT or OPEN"]
        side_effects:
          - "All REGISTERED or WAITLISTED enrollments → DROPPED_EARLY"
          - "Tuition invoices → REFUNDED (full)"

  - entity: Enrollment
    initial_state: REGISTERED
    terminal_states: [DROPPED_EARLY, DROPPED_LATE, TRANSFERRED_OUT, CREDITED]
    transitions:
      - from: REGISTERED
        to: CONFIRMED
        trigger: POST /enrollments/{enrollmentId}/confirm
        actor: Student
        preconditions:
          - "Enrollment must be REGISTERED"
          - "Section must be OPEN or LOCKED"
          - "Section enrolled_count < capacity (else ERR_SECTION_FULL)"
        side_effects:
          - "Section.enrolled_count += 1"
          - "If enrolled_count reaches capacity, promote zero waitlist (no-op); otherwise no cascade"
      - from: REGISTERED
        to: WAITLISTED
        trigger: "system (auto on POST /enrollments when section full)"
        actor: system
        preconditions: ["Section.enrolled_count >= capacity"]
        side_effects: ["Section.waitlist_count += 1"]
      - from: WAITLISTED
        to: REGISTERED
        trigger: "system (auto on enrollment drop / cancellation creating a vacancy; see seat_allocation calculation)"
        actor: system
        preconditions: ["Section has a vacant seat"]
        side_effects:
          - "Section.waitlist_count -= 1"
          - "Section.enrolled_count unchanged until the promoted student confirms"
      - from: CONFIRMED
        to: DROPPED_EARLY
        trigger: POST /enrollments/{enrollmentId}/drop
        actor: Student
        preconditions:
          - "Enrollment must be CONFIRMED or REGISTERED"
          - "Current time <= parent Term.drop_deadline_utc"
        side_effects:
          - "Section.enrolled_count -= 1"
          - "Tuition invoice → REFUNDED (100%)"
          - "Trigger seat_allocation: promote longest-waiting WAITLISTED enrollment by selector policy"
      - from: REGISTERED
        to: DROPPED_EARLY
        trigger: POST /enrollments/{enrollmentId}/drop
        actor: Student
        preconditions: ["Current time <= parent Term.drop_deadline_utc"]
        side_effects: ["Tuition invoice → VOID (no payment was ever due)"]
      - from: CONFIRMED
        to: DROPPED_LATE
        trigger: POST /enrollments/{enrollmentId}/drop
        actor: Student
        preconditions: ["Current time > parent Term.drop_deadline_utc"]
        side_effects:
          - "Section.enrolled_count -= 1"
          - "Tuition invoice → REFUNDED with chronological refund percentage (see tuition_refund)"
          - "Trigger seat_allocation"
      - from: CONFIRMED
        to: TRANSFERRED_OUT
        trigger: POST /enrollments/{enrollmentId}/transfer
        actor: Student
        preconditions:
          - "Target section is in the same Term and same CurriculumLevel"
          - "Target section has vacant seat or accepting waitlist"
        side_effects:
          - "Source section.enrolled_count -= 1; source invoice → TRANSFERRED"
          - "A new Enrollment is created with origin_enrollment_id = this id and status REGISTERED on the target section"
          - "Trigger seat_allocation on source section"
      - from: COMPLETED
        to: CREDITED
        trigger: "system (auto on ShowcaseEvent STAGED with grade PASS for this enrollment, or directly when level.showcase_required is false at Term close)"
        actor: system
        preconditions:
          - "If level.showcase_required: linked ShowcaseEvent STAGED and grade_by_enrollment[enrollment_id] == PASS"
          - "If not level.showcase_required: parent section COMPLETED"
        side_effects:
          - "Student.completed_level_codes += section.level.code"
          - "If student now has any CREDITED enrollment: is_alumni = true"

  - entity: PlacementEvaluation
    initial_state: SUBMITTED
    terminal_states: [GRANTED, DENIED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: POST /placement-evaluations/{id}/begin-review
        actor: PlacementOfficer
        preconditions: ["Evaluation must be SUBMITTED"]
        side_effects: []
      - from: UNDER_REVIEW
        to: GRANTED
        trigger: POST /placement-evaluations/{id}/grant
        actor: PlacementOfficer
        preconditions:
          - "AUDITION_BYPASS variant: prior_institution in RECOGNIZED_INSTITUTIONS"
          - "PORTFOLIO_REVIEW variant: portfolio_score >= PORTFOLIO_PASS_THRESHOLD (70)"
          - "target_level.allows_placement_bypass == true (ERR_PLACEMENT_NOT_ALLOWED)"
        side_effects:
          - "granted_level_codes computed = target level and all prerequisite levels in the same track below it"
          - "Student.placement_credit_codes union granted_level_codes"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: POST /placement-evaluations/{id}/deny
        actor: PlacementOfficer
        preconditions: []
        side_effects: []
      - from: DENIED
        to: APPEALED
        trigger: POST /placement-evaluations/{id}/appeal
        actor: Student
        preconditions: ["Evaluation must be DENIED"]
        side_effects: []
      - from: APPEALED
        to: UNDER_REVIEW
        trigger: POST /placement-evaluations/{id}/begin-review
        actor: PlacementOfficer
        preconditions: []
        side_effects: []

  - entity: Audition
    initial_state: SCHEDULED
    terminal_states: [SELECTED, REJECTED]
    transitions:
      - from: SCHEDULED
        to: EVALUATED
        trigger: POST /auditions/{id}/evaluate
        actor: CastingDirector
        preconditions: ["Audition must be SCHEDULED"]
        side_effects: ["composite_score computed from rubric_scores"]
      - from: EVALUATED
        to: SELECTED
        trigger: "system (auto on POST /ensemble-casts/{id}/cast or POST /cohort-programs/{id}/admit)"
        actor: system
        preconditions: ["Selector policy picks this audition"]
        side_effects:
          - "On COHORT admission: CohortProgram.admitted_count += 1"
          - "On ENSEMBLE casting: EnsembleCast.principal_ids or understudy_ids += student_id"
      - from: EVALUATED
        to: WAITLISTED
        trigger: POST /auditions/{id}/waitlist
        actor: CastingDirector
        preconditions: []
        side_effects: []
      - from: EVALUATED
        to: REJECTED
        trigger: POST /auditions/{id}/reject
        actor: CastingDirector
        preconditions: []
        side_effects: []
      - from: WAITLISTED
        to: SELECTED
        trigger: "system (auto on promotion when a principal/understudy slot frees)"
        actor: system
        preconditions: []
        side_effects: ["Same as EVALUATED → SELECTED"]
      - from: WAITLISTED
        to: REJECTED
        trigger: POST /auditions/{id}/reject
        actor: CastingDirector
        preconditions: []
        side_effects: []

  - entity: CohortProgram
    initial_state: FORMING
    terminal_states: [GRADUATED, DISSOLVED]
    transitions:
      - from: FORMING
        to: AUDITIONING
        trigger: POST /cohort-programs/{id}/begin-auditions
        actor: ProgramDirector
        preconditions: []
        side_effects: []
      - from: AUDITIONING
        to: CASTED
        trigger: POST /cohort-programs/{id}/finalize-cohort
        actor: ProgramDirector
        preconditions: ["admitted_count >= 1", "admitted_count <= cohort_size"]
        side_effects: []
      - from: CASTED
        to: ACTIVE
        trigger: "system (cascade on Term.start-session for the cohort's term)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: GRADUATED
        trigger: POST /cohort-programs/{id}/graduate
        actor: ProgramDirector
        preconditions: ["Term must be CLOSED"]
        side_effects:
          - "Each admitted student's is_industry_showcase_eligible recomputed (true if also is_alumni)"
      - from: FORMING
        to: DISSOLVED
        trigger: POST /cohort-programs/{id}/dissolve
        actor: ProgramDirector
        preconditions: []
        side_effects: ["All SCHEDULED auditions targeting this cohort → REJECTED"]
      - from: AUDITIONING
        to: DISSOLVED
        trigger: POST /cohort-programs/{id}/dissolve
        actor: ProgramDirector
        preconditions: []
        side_effects: ["All non-terminal auditions targeting this cohort → REJECTED"]

  - entity: EnsembleCast
    initial_state: OPEN_ROLES
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN_ROLES
        to: CASTING
        trigger: POST /ensemble-casts/{id}/open-casting
        actor: CastingDirector
        preconditions: []
        side_effects: []
      - from: CASTING
        to: REHEARSING
        trigger: POST /ensemble-casts/{id}/lock-cast
        actor: CastingDirector
        preconditions:
          - "len(principal_ids) == cast_size"
          - "len(understudy_ids) == understudy_slots"
          - "VenueSlot.status == BOOKED for opening night"
        side_effects: []
      - from: REHEARSING
        to: RUNNING
        trigger: POST /ensemble-casts/{id}/open-revue
        actor: CastingDirector
        preconditions: []
        side_effects: []
      - from: RUNNING
        to: CLOSED
        trigger: POST /ensemble-casts/{id}/close-revue
        actor: CastingDirector
        preconditions: ["All non-terminal TouringAssignments on this cast are RETURNED or REPLACED"]
        side_effects: []

  - entity: TouringAssignment
    initial_state: PROPOSED
    terminal_states: [DECLINED, RETURNED, REPLACED]
    transitions:
      - from: PROPOSED
        to: ACCEPTED
        trigger: POST /touring-assignments/{id}/accept
        actor: Student
        preconditions:
          - "Acting student_id == principal_student_id"
          - "Understudy student's is_alumni == true OR has CREDITED enrollment in the cast's track"
        side_effects: ["travel_committed = true"]
      - from: PROPOSED
        to: DECLINED
        trigger: POST /touring-assignments/{id}/decline
        actor: Student
        preconditions: ["Acting student_id == principal_student_id"]
        side_effects: []
      - from: ACCEPTED
        to: ON_TOUR
        trigger: "system (auto when current_utc >= tour_start_utc, polled via POST /touring-assignments/{id}/sync)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ON_TOUR
        to: RETURNED
        trigger: "system (auto when current_utc >= tour_end_utc, polled via POST /touring-assignments/{id}/sync)"
        actor: system
        preconditions: []
        side_effects: ["Understudy coverage released"]
      - from: ACCEPTED
        to: REPLACED
        trigger: POST /touring-assignments/{id}/replace
        actor: CastingDirector
        preconditions: ["A replacement TouringAssignment is created in the same call"]
        side_effects:
          - "travel_committed = false"
          - "Replacement assignment enters PROPOSED with new principal"

  - entity: ShowcaseEvent
    initial_state: PLANNED
    terminal_states: [ARCHIVED, CANCELLED]
    transitions:
      - from: PLANNED
        to: SCHEDULED
        trigger: POST /showcases/{id}/schedule
        actor: ProgramDirector
        preconditions:
          - "VenueSlot.status == AVAILABLE (half-open interval conflict check)"
          - "Slot venue capacity >= len(performer_enrollment_ids)"
        side_effects: ["VenueSlot → RESERVED"]
      - from: SCHEDULED
        to: STAGED
        trigger: POST /showcases/{id}/stage
        actor: ProgramDirector
        preconditions: ["grade_by_enrollment covers every performer_enrollment_ids entry"]
        side_effects:
          - "VenueSlot → BOOKED"
          - "For each enrollment with PASS grade: enrollment COMPLETED → CREDITED (cascade into student.completed_level_codes and is_alumni)"
          - "For each enrollment with FAIL grade: enrollment stays COMPLETED (no credit)"
      - from: STAGED
        to: ARCHIVED
        trigger: POST /showcases/{id}/archive
        actor: ProgramDirector
        preconditions: []
        side_effects: ["VenueSlot → RELEASED"]
      - from: PLANNED
        to: CANCELLED
        trigger: POST /showcases/{id}/cancel
        actor: ProgramDirector
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: POST /showcases/{id}/cancel
        actor: ProgramDirector
        preconditions: []
        side_effects: ["VenueSlot → RELEASED"]

  - entity: ScholarshipAward
    initial_state: APPLIED
    terminal_states: [DENIED, REVOKED, DISBURSED]
    transitions:
      - from: APPLIED
        to: AWARDED
        trigger: POST /scholarships/{id}/award
        actor: FinanceOfficer
        preconditions: []
        side_effects: []
      - from: APPLIED
        to: DENIED
        trigger: POST /scholarships/{id}/deny
        actor: FinanceOfficer
        preconditions: []
        side_effects: []
      - from: AWARDED
        to: DISBURSED
        trigger: "system (cascade on TuitionInvoice issuance against the awarded student)"
        actor: system
        preconditions: ["Student has outstanding TuitionInvoice in ISSUED or PARTIALLY_PAID"]
        side_effects:
          - "disbursed_cents increases by amount applied"
          - "TuitionInvoice.scholarship_applied_cents increases; amount_due_cents recomputed"
      - from: AWARDED
        to: REVOKED
        trigger: POST /scholarships/{id}/revoke
        actor: FinanceOfficer
        preconditions: ["disbursed_cents == 0"]
        side_effects: []

  - entity: TuitionInvoice
    initial_state: ISSUED
    terminal_states: [PAID, REFUNDED, TRANSFERRED, VOID]
    transitions:
      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: POST /tuition-invoices/{id}/pay
        actor: Student
        preconditions: ["amount > 0", "paid + amount < amount_due"]
        side_effects: ["paid_cents += amount", "amount_due_cents recomputed"]
      - from: ISSUED
        to: PAID
        trigger: POST /tuition-invoices/{id}/pay
        actor: Student
        preconditions: ["paid + amount == amount_due"]
        side_effects: []
      - from: PARTIALLY_PAID
        to: PAID
        trigger: POST /tuition-invoices/{id}/pay
        actor: Student
        preconditions: ["paid + amount == amount_due"]
        side_effects: []
      - from: ISSUED
        to: REFUNDED
        trigger: "system (cascade on enrollment drop / section cancel)"
        actor: system
        preconditions: []
        side_effects: ["refunded_cents = paid_cents + scholarship_applied_cents (full)"]
      - from: PARTIALLY_PAID
        to: REFUNDED
        trigger: "system (cascade on enrollment drop / section cancel)"
        actor: system
        preconditions: []
        side_effects:
          - "Chronological refund per tuition_refund calculation; scholarship_applied portion is non-refundable (clawed back to award balance)"
      - from: PAID
        to: REFUNDED
        trigger: "system (cascade on enrollment drop / section cancel)"
        actor: system
        preconditions: []
        side_effects: ["Same as PARTIALLY_PAID → REFUNDED"]
      - from: ISSUED
        to: TRANSFERRED
        trigger: "system (cascade on enrollment transfer)"
        actor: system
        preconditions: []
        side_effects: ["A new invoice is issued on the new enrollment with paid_cents carried over"]
      - from: ISSUED
        to: VOID
        trigger: "system (cascade on REGISTERED enrollment drop before confirmation)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: enrollment-create-stale-section
    parent_entity: CourseSection
    write_endpoint: "POST /enrollments"
    occ_field: "expected_section_version"
    description: |
      Creating an Enrollment against a CourseSection whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just confirmed, dropped, or transferred an
      enrollment (each legitimately bumping the section's version) and the
      current writer's view of the section's enrolled_count is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: cast-lock-stale-ensemble
    parent_entity: EnsembleCast
    write_endpoint: "POST /ensemble-casts/{castId}/lock-cast"
    occ_field: "expected_cast_version"
    description: |
      Locking the cast of an EnsembleCast whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      writer has just cast an additional principal or understudy and the current
      writer's principal_ids snapshot is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: prerequisite_credit_satisfaction
    trigger: "POST /enrollments (validation), POST /placement-evaluations/{id}/grant (granted_level_codes computation)"
    algorithm: topological
    formula: |
      Build the level DAG along CurriculumLevel.requires_level_code within the
      target level's track. For enrollment into level L:
        satisfied_codes = student.completed_level_codes UNION student.placement_credit_codes
        for each prerequisite P in transitive_closure(L.requires_level_code):
          require P.code in satisfied_codes
      Cycle detection: on insertion of CurriculumLevel, walk the requires_level_code
      chain; if we revisit a node, reject with ERR_PREREQUISITE_CYCLE.
    input_set: "CurriculumLevel rows where status=ACTIVE and track matches"
    constants: {}
    precision: "n/a"

  - name: placement_credit_variant
    trigger: "PlacementEvaluation decision time"
    algorithm: threshold
    formula: |
      variant = AUDITION_BYPASS if prior_institution IN RECOGNIZED_INSTITUTIONS
                else PORTFOLIO_REVIEW
      AUDITION_BYPASS: grant if target_level.allows_placement_bypass
      PORTFOLIO_REVIEW: grant if portfolio_score >= PORTFOLIO_PASS_THRESHOLD AND target_level.allows_placement_bypass
    input_set: "Single PlacementEvaluation"
    constants:
      RECOGNIZED_INSTITUTIONS: ["iO", "UCB", "Groundlings", "Second City (other campus)"]
      PORTFOLIO_PASS_THRESHOLD: 70
    precision: "n/a"
    variants:
      - name: AUDITION_BYPASS
        when: "prior_institution recognized"
        difference: "Ignores portfolio_score; grants based on institution reputation"
      - name: PORTFOLIO_REVIEW
        when: "prior_institution not recognized"
        difference: "Requires portfolio_score >= 70"

  - name: tuition_balance
    trigger: "TuitionInvoice issuance, payment, scholarship disbursement, refund"
    algorithm: constraint_propagation
    formula: |
      amount_due_cents = base_amount_cents - scholarship_applied_cents - paid_cents + refunded_cents_when_negative
      Pin evaluation order:
        1. Compute scholarship_applied_cents (from active AWARDED/DISBURSED awards, FIFO by award.created_at)
        2. Subtract paid_cents
        3. Apply refund adjustments
      Round only at final step: round_half_up to integer cents.
    input_set: "Single TuitionInvoice + student's ScholarshipAwards"
    constants: {}
    precision: "integer cents, round_half_up at final step"

  - name: tuition_refund
    trigger: "Enrollment drop, section cancel cascade"
    algorithm: chronological
    formula: |
      Compute elapsed_fraction = (current_utc - term.start_utc) / (term.end_utc - term.start_utc).
      Variants:
        EARLY_DROP (current_utc <= term.drop_deadline_utc): refund_pct = 1.00
        LATE_DROP:
          if elapsed_fraction < 0.25: refund_pct = 0.75
          elif elapsed_fraction < 0.50: refund_pct = 0.50
          elif elapsed_fraction < 0.75: refund_pct = 0.25
          else: refund_pct = 0.00
      refunded_cents_cash = round_half_up(paid_cents * refund_pct)
      scholarship_applied_cents is NEVER refunded as cash — it is clawed back to the award.
    input_set: "Single TuitionInvoice + parent Term"
    constants: {}
    precision: "integer cents, round_half_up"
    variants:
      - name: EARLY_DROP
        when: "current_utc <= drop_deadline_utc"
        difference: "Full 100% refund of paid_cents"
      - name: LATE_DROP
        when: "current_utc > drop_deadline_utc"
        difference: "Tiered refund based on elapsed term fraction"

  - name: seat_allocation
    trigger: "Enrollment drop / transfer / cancel creates a vacancy on a CourseSection"
    algorithm: waterfall_allocation
    formula: |
      Eligibility filter: enrollments on this section with status=WAITLISTED.
      Ranking: priority_tier DESC (RETURNING > NEW), then enrollment.created_at ASC.
      Tie-break: enrollment.created_at ASC (id is forbidden).
      Promotion: pop the head of the ranking; transition WAITLISTED → REGISTERED.
      Empty pool fallback: no-op.
    input_set: "Waitlisted enrollments on this section"
    constants: {}
    precision: "n/a"

  - name: ensemble_composite_score
    trigger: "POST /auditions/{id}/evaluate"
    algorithm: weighted_scoring
    formula: |
      composite_score = sum over dimensions d of rubric_scores[d] * WEIGHTS[d]
      Missing dimensions default to 0.
      Round to 2 decimal places, round_half_up.
    input_set: "Single Audition.rubric_scores"
    constants:
      WEIGHTS:
        scene_work: 0.4
        characters: 0.25
        musicality: 0.2
        game: 0.15
    precision: "2 decimal places, round_half_up"

  - name: ensemble_casting_selector
    trigger: "POST /ensemble-casts/{id}/cast"
    algorithm: selector_policy
    formula: |
      Candidate pool: Auditions with target_kind=ENSEMBLE, ensemble_cast_id=this cast,
        outcome IN {EVALUATED, WAITLISTED}.
      Filter by source_policy:
        PIPELINE_ONLY: student must have CREDITED enrollment in a CONSERVATORY CohortProgram
        OPEN_CALL: no pipeline filter
        MIXED: no filter, but pipeline students get +0.5 bonus on composite_score
      Ranking: composite_score DESC, audition.created_at ASC (id forbidden).
      Selection: take top cast_size for principals, next understudy_slots for understudies.
      Empty pool fallback: ERR_NO_ELIGIBLE_AUDITIONS.
    input_set: "Auditions on this EnsembleCast"
    constants:
      PIPELINE_BONUS: 0.5
    precision: "n/a"

  - name: showcase_slot_allocation
    trigger: "POST /showcases/{id}/schedule"
    algorithm: interval_merge
    formula: |
      Half-open intervals: [start_utc, end_utc).
      Two slots CONFLICT if a.start_utc < b.end_utc AND b.start_utc < a.end_utc AND same venue_name.
      Adjacent slots (a.end_utc == b.start_utc) do NOT conflict.
      Buffer: require a MIN_TURNOVER_MINUTES gap on the SAME venue between
      two BOOKED/RESERVED slots — i.e. reject if 0 < (next.start - prev.end) < MIN_TURNOVER.
    input_set: "VenueSlots sharing venue_name with status RESERVED or BOOKED"
    constants:
      MIN_TURNOVER_MINUTES: 30
    precision: "n/a"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is in the RBAC matrix"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Role is authorized for this endpoint per §1.7"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Path ids exist (Student, Term, CourseSection, Enrollment, Audition, EnsembleCast, etc.)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all nested endpoints
  - priority: 4
    category: state
    check: "Target entity is in a state that permits the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: state transition endpoints
  - priority: 5
    category: business_temporal
    check: "Logical clock invariants (drop_deadline vs current_utc, tour window vs current_utc)"
    error_id: ERR_DEADLINE_PASSED
    http_status: 409
    applies_to: "enrollment drop, transfer, audition scheduling"
  - priority: 6
    category: business_safety
    check: "Prerequisite DAG satisfied for enrollment into a level (topological check)"
    error_id: ERR_PREREQUISITE_NOT_MET
    http_status: 422
    applies_to: "POST /enrollments"
  - priority: 7
    category: business_safety
    check: "No cycle introduced when adding CurriculumLevel.requires_level_code"
    error_id: ERR_PREREQUISITE_CYCLE
    http_status: 422
    applies_to: "POST /curriculum-levels, PATCH /curriculum-levels/{id}"
  - priority: 8
    category: business_constraint
    check: "Instructor certified for the section's track AND weekly load + section.weekly_hours <= max_weekly_hours"
    error_id: ERR_INSTRUCTOR_UNAVAILABLE
    http_status: 422
    applies_to: "POST /sections, PATCH /sections/{id}"
  - priority: 9
    category: business_constraint
    check: "VenueSlot conflict / turnover buffer per showcase_slot_allocation"
    error_id: ERR_VENUE_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /showcases/{id}/schedule, POST /venue-slots"
  - priority: 10
    category: business_constraint
    check: "Source policy of EnsembleCast admits this Audition (PIPELINE_ONLY vs OPEN_CALL vs MIXED)"
    error_id: ERR_SOURCE_POLICY_VIOLATION
    http_status: 422
    applies_to: "POST /ensemble-casts/{id}/cast"
  - priority: 11
    category: business_fiscal
    check: "Section has vacant seat OR accepting waitlist; else ERR_SECTION_FULL"
    error_id: ERR_SECTION_FULL
    http_status: 409
    applies_to: "POST /enrollments (confirm), POST /enrollments/{id}/transfer"
  - priority: 12
    category: business_fiscal
    check: "Scholarship disbursement does not exceed remaining award balance"
    error_id: ERR_SCHOLARSHIP_EXHAUSTED
    http_status: 422
    applies_to: "POST /tuition-invoices (when scholarship awarded)"
  - priority: 13
    category: business_referential
    check: "PlacementEvaluation target_level allows_placement_bypass == true"
    error_id: ERR_PLACEMENT_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /placement-evaluations, POST /placement-evaluations/{id}/grant"
  - priority: 14
    category: business_referential
    check: "Understudy on TouringAssignment satisfies coverage predicate (is_alumni or CREDITED in track)"
    error_id: ERR_UNDERSTUDY_INELIGIBLE
    http_status: 422
    applies_to: "POST /touring-assignments, POST /touring-assignments/{id}/accept"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server starts with clock pinned to 2026-09-01T00:00:00Z; this endpoint is the only way to advance it. Real wall-clock is never read."
    roles: [ProgramDirector]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects: ["All time-dependent transitions re-evaluated lazily on next read"]

  # --- CurriculumLevel ---
  - method: POST
    path: "/curriculum-levels"
    description: "Create a curriculum level; self-referential prerequisite via requires_level_code"
    roles: [ProgramDirector]
    code: 201
    input: [code, title, track, sequence_index, "requires_level_code?", "allows_placement_bypass?", "showcase_required?"]
    output: CurriculumLevel
    side_effects: ["Cycle detection over requires_level_code chain"]
  - method: GET
    path: "/curriculum-levels"
    description: "List curriculum levels"
    roles: [ProgramDirector, PlacementOfficer, Registrar, CastingDirector, Student, FinanceOfficer]
    code: 200
    input: ["track?", "requires_level_code?", "limit?", "offset?"]
    output: CurriculumLevel[]
    side_effects: []
  - method: GET
    path: "/curriculum-levels/{levelId}"
    description: "Get a level"
    roles: [ProgramDirector, PlacementOfficer, Registrar, CastingDirector, Student, FinanceOfficer]
    code: 200
    input: []
    output: CurriculumLevel
    side_effects: []

  # --- Term ---
  - method: POST
    path: "/terms"
    description: "Create a term"
    roles: [ProgramDirector]
    code: 201
    input: [name, start_utc, end_utc, drop_deadline_utc]
    output: Term
    side_effects: []
  - method: GET
    path: "/terms"
    description: "List terms"
    roles: [ProgramDirector, Registrar, CastingDirector, Student, FinanceOfficer, PlacementOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: Term[]
    side_effects: []
  - method: GET
    path: "/terms/{termId}"
    description: "Get a term"
    roles: [ProgramDirector, Registrar, CastingDirector, Student, FinanceOfficer, PlacementOfficer]
    code: 200
    input: []
    output: Term
    side_effects: []
  - method: POST
    path: "/terms/{termId}/open-scheduling"
    description: "DRAFT → SCHEDULING"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: Term
    side_effects: []
  - method: POST
    path: "/terms/{termId}/open-enrollment"
    description: "SCHEDULING → ENROLLMENT_OPEN; cascades DRAFT sections to OPEN"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: Term
    side_effects: ["All DRAFT sections in term → OPEN"]
  - method: POST
    path: "/terms/{termId}/start-session"
    description: "ENROLLMENT_OPEN → IN_SESSION; cascades sections to LOCKED/RUNNING/CANCELLED"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: Term
    side_effects: ["Section cascades per §1.2"]
  - method: POST
    path: "/terms/{termId}/close"
    description: "IN_SESSION → CLOSED; cascades sections and enrollments"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: Term
    side_effects: ["Section/Enrollment cascades per §1.2; ShowcaseEvent auto-creation"]

  # --- Instructor ---
  - method: POST
    path: "/instructors"
    description: "Create instructor"
    roles: [ProgramDirector]
    code: 201
    input: [display_name, home_track, certified_tracks, "max_weekly_hours?"]
    output: Instructor
    side_effects: []
  - method: GET
    path: "/instructors"
    description: "List instructors"
    roles: [ProgramDirector, Registrar]
    code: 200
    input: ["limit?", "offset?"]
    output: Instructor[]
    side_effects: []
  - method: GET
    path: "/instructors/{instructorId}"
    description: "Get instructor"
    roles: [ProgramDirector, Registrar]
    code: 200
    input: []
    output: Instructor
    side_effects: []

  # --- CourseSection ---
  - method: POST
    path: "/sections"
    description: "Create a section"
    roles: [ProgramDirector]
    code: 201
    input: [term_id, level_id, "instructor_id?", capacity, tuition_cents, weekly_hours]
    output: CourseSection
    side_effects: []
  - method: GET
    path: "/sections"
    description: "List sections"
    roles: [ProgramDirector, Registrar, Student, PlacementOfficer]
    code: 200
    input: ["term_id?", "level_id?", "instructor_id?", "limit?", "offset?"]
    output: CourseSection[]
    side_effects: []
  - method: GET
    path: "/sections/{sectionId}"
    description: "Get a section"
    roles: [ProgramDirector, Registrar, Student, PlacementOfficer]
    code: 200
    input: []
    output: CourseSection
    side_effects: []
  - method: PATCH
    path: "/sections/{sectionId}"
    description: "Update section (instructor assignment, capacity change)"
    roles: [ProgramDirector]
    code: 200
    input: ["instructor_id?", "capacity?", "weekly_hours?"]
    output: CourseSection
    side_effects: ["increments CourseSection.version by 1"]
  - method: POST
    path: "/sections/{sectionId}/cancel"
    description: "Cancel a section (DRAFT/OPEN only)"
