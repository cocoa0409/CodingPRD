            - "re-using donor_code \"D-0001\" inside the SAME registry returns 409 with error_id \"ERR_DONOR_CODE_ALREADY_EXISTS\", while the same donor_code in the OTHER registry is created with 201 - the uniqueness scope is the registry, not the system"
            - "re-using mrn \"MRN-0001\" returns 409 with error_id \"ERR_MRN_ALREADY_EXISTS\" even though every other field of the second patient differs"

      - name: typing_and_screening_refusals_are_all_triggerable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_CT_TYPING_NOT_ALLELE_LEVEL]
          - errors[ERR_TYPING_REQUEST_NOT_OPEN]
          - errors[ERR_DONOR_NOT_AVAILABLE]
          - errors[ERR_CT_ATTEMPTS_EXHAUSTED]
        distinguishing_aspect: |
          One search drives four different refusals. The allele-level rule fires on a locus reported at
          antigen resolution while every other locus is fine; a second response to an answered request is
          refused on state, not on content; a screening PASS is refused because the DONOR - not the
          candidate - is unavailable, which is only reachable after a DEFER screening; and the third typing
          request on the BACKUP candidate is refused because a BACKUP at MAX_CT_ATTEMPTS is deliberately
          left in TYPING_EXPIRED rather than auto-excluded.
