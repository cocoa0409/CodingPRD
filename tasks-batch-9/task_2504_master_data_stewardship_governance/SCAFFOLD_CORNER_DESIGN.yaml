              payload: { full_name: "Sam Steward", email: "sam@mdm.test", certification_level: "SENIOR" }
              as: GovernanceAdmin
              captures: { std_id: $.data.id }
            - call: "POST /mdm/steward-assignments"
              payload: { domain_id: "${dom_id}", steward_id: "${std_id}", steward_role: "DATA_STEWARD", effective_from: "2026-08-01T00:00:00Z", expected_domain_version: "${dom_v1}" }
              as: GovernanceAdmin
            - call: "POST /mdm/quality-rules"
              payload: { domain_id: "${dom_id}", owner_steward_id: "${std_id}", rule_code: "QR1", dimension: "COMPLETENESS", weight_points: 40, threshold_pct: 90.00, severity: "HIGH" }
              as: DataSteward
              as_user_id: "${std_id}"
            - call: "POST /mdm/quality-rules"
              payload: { domain_id: "${dom_id}", owner_steward_id: "${std_id}", rule_code: "QR2", dimension: "VALIDITY", weight_points: 40, threshold_pct: 90.00, severity: "MEDIUM" }
              as: DataSteward
              as_user_id: "${std_id}"
          trigger:
            - call: "POST /mdm/quality-rules"
              payload: { domain_id: "${dom_id}", owner_steward_id: "${std_id}", rule_code: "QR3", dimension: "TIMELINESS", weight_points: 30, threshold_pct: 90.00, severity: "LOW" }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { err: $.data.error_id }
            - call: "POST /mdm/quality-rules"
              payload: { domain_id: "${dom_id}", owner_steward_id: "${std_id}", rule_code: "QR3", dimension: "TIMELINESS", weight_points: 20, threshold_pct: 90.00, severity: "LOW" }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { qr3_id: $.data.id, ok_weight: $.data.weight_points, ok_status: $.data.status }
            - call: "PATCH /mdm/quality-rules/${qr3_id}"
              payload: { weight_points: 21 }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { err_patch: $.data.error_id }
          assert:
            - "first trigger -> HTTP 422 and ${err} == ERR_RULE_WEIGHT_BUDGET_EXCEEDED (40 + 40 + 30 == 110)"
            - "second trigger -> HTTP 201, ${ok_weight} == 20, ${ok_status} == ACTIVE (40 + 40 + 20 == 100 is inclusive)"
            - "third trigger -> HTTP 422 and ${err_patch} == ERR_RULE_WEIGHT_BUDGET_EXCEEDED - the ceiling is re-evaluated on update with the UPDATED weight substituted for the old one"

