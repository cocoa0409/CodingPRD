          The only route to a RESTRICTED posture is hop 4 of the sustained-challenge cascade, and the
          restriction is program-wide rather than scoped to the application that went stale: A3 owns the
          claim on the reclassified location and is the only application whose FINAL sheet turns STALE,
          yet the two refusals land on A1 (already SELECTED, obligation attempt) and on A2 (SCORED,
