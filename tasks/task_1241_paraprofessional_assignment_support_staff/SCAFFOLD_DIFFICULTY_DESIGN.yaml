  # ===========================================================================
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: benefit_threshold_exact_1800_is_eligible
        grounds:
          - calculations.weekly_benefit_eligibility
          - entities.StaffingPlan.fields.benefit_threshold_minutes
        distinguishing_aspect: |
