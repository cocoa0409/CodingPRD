            - "Client.${client_id}.pending_stepup_count == 1 unchanged"

  # =====================================================================================
  # RULE 6 — boundary_precision_check
  # Four instances, four different metrics on four different endpoints.
  # =====================================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: disparity_gating_ratio_exactly_at_restrict_threshold_restricts
        grounds:
          - calculations.cohort_disparity_evaluation
          - state_machines.BiasAudit.state.COLLECTING_to_REMEDIATION_REQUIRED
          - entities.BiasAudit.fields.disparity_ratio_max_to_pooled_bps
          - entities.MethodProfile.fields.bias_state
        distinguishing_aspect: |
          Metric: the MAX_TO_POOLED disparity ratio measured on POST /idv/bias-audits/{id}/evaluate.
          At exactly 12500 bps == DISPARITY_RESTRICT_BPS the profile MUST become RESTRICTED, proving
          the comparison is >= and not >; the MONITORED band starts one bps lower.
        test_recipe:
          setup:
            - "A DATABASE_CHECK profile dbv1 exists with bias_state CLEARED."
            - "A COLLECTING bias audit over 2026-07-01 -> 2026-08-01 holds three cohorts of 1000 attempts with 50 / 30 / 40 false rejects, i.e. frr 500 / 300 / 400 and pooled frr 400."
          setup_api_calls:
            - call: "POST /idv/method-profiles"
              payload: { method_code: "DATABASE_CHECK", vendor_code: "dbv1", assurance_weight: 25, acceptance_floor_bps: 6000, far_bps: 80, frr_bps: 600, strong_evidence: false, cost_cents: 40 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { p_db_id: "$.data.id" }
            - call: "POST /idv/bias-audits"
              payload: { method_profile_id: "${p_db_id}", window_start: "2026-07-01T00:00:00Z", window_end: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { audit_id: "$.data.id" }
            - call: "POST /idv/bias-audits/${audit_id}/cohort-metrics"
              payload: { cohort_code: "AGE_18_24", attempt_count: 1000, false_reject_count: 50, false_accept_count: 2 }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /idv/bias-audits/${audit_id}/cohort-metrics"
              payload: { cohort_code: "AGE_25_44", attempt_count: 1000, false_reject_count: 30, false_accept_count: 2 }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /idv/bias-audits/${audit_id}/cohort-metrics"
              payload: { cohort_code: "AGE_65_PLUS", attempt_count: 1000, false_reject_count: 40, false_accept_count: 2 }
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /idv/bias-audits/${audit_id}/evaluate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "BiasAudit.${audit_id}.max_frr_bps == 500 and BiasAudit.${audit_id}.min_frr_bps == 300 and BiasAudit.${audit_id}.pooled_frr_bps == 400"
            - "BiasAudit.${audit_id}.disparity_ratio_max_to_pooled_bps == 12500 exactly"
            - "BiasAudit.${audit_id}.disparity_ratio_max_to_min_bps == 16667"
            - "BiasAudit.${audit_id}.state == REMEDIATION_REQUIRED"
            - "MethodProfile.${p_db_id}.bias_state == RESTRICTED"
            - "BiasAudit.${audit_id}.worst_cohort_code == AGE_18_24 and BiasAudit.${audit_id}.included_cohort_count == 3"

      - name: effective_age_exactly_at_required_minimum_months_is_assured
        grounds:
          - calculations.age_assurance_decision
          - entities.AgeAssuranceResult.fields.effective_age_months
          - entities.AgeAssuranceResult.fields.buffer_months
          - state_machines.VerificationSession.age_state.PENDING_to_FAILED
          - state_machines.VerificationSession.age_state.FAILED_to_ASSURED
        distinguishing_aspect: |
          Metric: effective_age_months measured on POST /idv/verification-sessions/{id}/age-assurance-results.
          With mae 12 and multiplier 20000 the buffer is exactly 24 months, so an estimate of 239
          yields 215 and FAILS while 240 yields exactly 216 == 18 * 12 and is ASSURED, proving the
          decision comparison is >= at the month boundary.
        test_recipe:
          setup:
            - "Client Acme Age is LIVE, DELETE_ON_COMPLETE, quota 50, 1 review credit."
            - "Policy v1 allows DOCUMENT_SCAN, required_min_age_years 18, age_buffer_multiplier_bps 20000, min_assurance_score 30; PUBLISHED, so the session opens with age_state PENDING."
            - "An AGE_ESTIMATION profile agev2 documents estimation_mae_months 12 and accuracies for every band."
            - "A first ESTIMATION result of 239 months gives buffer 24 and effective age 215 -> band B16_17 -> FAILED."
          setup_api_calls:
            - call: "POST /idv/clients"
              payload: { name: "Acme Age", home_jurisdiction_code: "US", biometric_retention_mode: "DELETE_ON_COMPLETE", daily_session_quota: 50, granted_review_credits: 1 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { client_id: "$.data.id" }
            - call: "PATCH /idv/clients/${client_id}"
              payload: { integration_state: "LIVE" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { client_v: "$.data.version" }
            - call: "POST /idv/method-profiles"
              payload: { method_code: "DOCUMENT_SCAN", vendor_code: "docv1", assurance_weight: 45, acceptance_floor_bps: 8000, far_bps: 30, frr_bps: 400, strong_evidence: true, cost_cents: 120 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { p_doc_id: "$.data.id" }
            - call: "POST /idv/method-profiles"
              payload: { method_code: "AGE_ESTIMATION", vendor_code: "agev2", assurance_weight: 10, acceptance_floor_bps: 5000, far_bps: 200, frr_bps: 800, strong_evidence: false, cost_cents: 30, estimation_mae_months: 12, band_accuracy_bps: { U13: 8500, B13_15: 8800, B16_17: 9100, B18_20: 9400, A21_PLUS: 9600 } }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { p_age_id: "$.data.id" }
            - call: "POST /idv/verification-policies"
              payload: { client_id: "${client_id}", policy_version: 1, allowed_method_codes: ["DOCUMENT_SCAN"], min_assurance_score: 30, doc_authenticity_floor_bps: 8000, required_min_age_years: 18, age_buffer_multiplier_bps: 20000, step_up_max_rounds: 2 }
              as: ClientIntegrator
              as_user_id: "${client_id}"
              captures: { policy_id: "$.data.id" }
            - call: "POST /idv/verification-policies/${policy_id}/publish"
              payload: { expected_client_version: "${client_v}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /idv/verification-sessions"
              payload: { client_id: "${client_id}", external_subject_ref: "subj-r6b", requested_assurance_tier: "STANDARD", subject_jurisdiction_code: "US", declared_transaction_value_cents: 0, biometric_consent: false, documentation_status: "STANDARD_DOCS" }
              as: ClientIntegrator
              as_user_id: "${client_id}"
              captures: { s_id: "$.data.id" }
            - call: "POST /idv/verification-sessions/${s_id}/age-assurance-results"
              payload: { method: "ESTIMATION", estimation_profile_id: "${p_age_id}", estimated_age_months: 239 }
              as: ClientIntegrator
              as_user_id: "${client_id}"
          trigger:
            - call: "POST /idv/verification-sessions/${s_id}/age-assurance-results"
              payload: { method: "ESTIMATION", estimation_profile_id: "${p_age_id}", estimated_age_months: 240 }
              as: ClientIntegrator
              as_user_id: "${client_id}"
          assert:
            - "GET /idv/verification-sessions/${s_id}/age-assurance-results returns total_count == 2"
            - "data[0].buffer_months == 24, data[0].effective_age_months == 215, data[0].resolved_band == B16_17, data[0].decision == FAILED and data[0].documented_accuracy_bps == 9100"
            - "data[1].buffer_months == 24, data[1].effective_age_months == 216, data[1].resolved_band == B18_20, data[1].decision == ASSURED and data[1].documented_accuracy_bps == 9400"
            - "data[1].mae_months_snapshot == 12 and data[1].source_vendor_code == agev2"
            - "VerificationSession.${s_id}.age_state == ASSURED and VerificationSession.${s_id}.resolved_age_band == B18_20"

      - name: empty_candidate_set_on_high_risk_ladder_selection_is_rejected
        grounds:
          - calculations.method_candidate_selection
          - calculations.session_risk_assessment
          - validations[priority=41]
          - entities.MethodProfile.fields.strong_evidence
        distinguishing_aspect: |
          Metric: the cardinality of the LADDER candidate set on
          POST /idv/verification-sessions/{id}/method-attempts. At HIGH risk the strong_evidence
          filter empties an otherwise non-empty two-profile set, and cardinality 0 must raise
          ERR_NO_ELIGIBLE_METHOD instead of falling back to a weak profile.
        test_recipe:
          setup:
            - "Client Acme Empty is LIVE, DELETE_ON_COMPLETE, quota 50, 1 review credit."
            - "Policy v1 allows DATABASE_CHECK and KNOWLEDGE_BASED only, both backed by profiles with strong_evidence false; min_assurance_score 60, no age gate; PUBLISHED."
            - "Session subj-r6c is ENHANCED tier with declared_transaction_value_cents 150000 -> risk_score 70 -> HIGH, so the LADDER admits only strong_evidence profiles."
          setup_api_calls:
            - call: "POST /idv/clients"
              payload: { name: "Acme Empty", home_jurisdiction_code: "US", biometric_retention_mode: "DELETE_ON_COMPLETE", daily_session_quota: 50, granted_review_credits: 1 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { client_id: "$.data.id" }
            - call: "PATCH /idv/clients/${client_id}"
              payload: { integration_state: "LIVE" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { client_v: "$.data.version" }
            - call: "POST /idv/method-profiles"
              payload: { method_code: "DATABASE_CHECK", vendor_code: "dbv1", assurance_weight: 25, acceptance_floor_bps: 6000, far_bps: 80, frr_bps: 600, strong_evidence: false, cost_cents: 40 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { p_db_id: "$.data.id" }
            - call: "POST /idv/method-profiles"
              payload: { method_code: "KNOWLEDGE_BASED", vendor_code: "kbav1", assurance_weight: 15, acceptance_floor_bps: 6000, far_bps: 150, frr_bps: 900, strong_evidence: false, cost_cents: 20 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { p_kba_id: "$.data.id" }
            - call: "POST /idv/verification-policies"
              payload: { client_id: "${client_id}", policy_version: 1, allowed_method_codes: ["DATABASE_CHECK", "KNOWLEDGE_BASED"], min_assurance_score: 60, required_min_age_years: 0, step_up_max_rounds: 2 }
              as: ClientIntegrator
              as_user_id: "${client_id}"
              captures: { policy_id: "$.data.id" }
            - call: "POST /idv/verification-policies/${policy_id}/publish"
              payload: { expected_client_version: "${client_v}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /idv/verification-sessions"
              payload: { client_id: "${client_id}", external_subject_ref: "subj-r6c", requested_assurance_tier: "ENHANCED", subject_jurisdiction_code: "US", declared_transaction_value_cents: 150000, biometric_consent: false, documentation_status: "STANDARD_DOCS" }
              as: ClientIntegrator
              as_user_id: "${client_id}"
              captures: { s_id: "$.data.id" }
          trigger:
            - call: "POST /idv/verification-sessions/${s_id}/method-attempts"
              payload: {}
              as: ClientIntegrator
              as_user_id: "${client_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "VerificationSession.${s_id}.risk_score == 70 and VerificationSession.${s_id}.risk_level == HIGH"
            - "response status is 409 and $.data.error_id == ERR_NO_ELIGIBLE_METHOD"
            - "GET /idv/method-attempts?session_id=${s_id} returns total_count == 0"
            - "VerificationSession.${s_id}.identity_state == IN_PROGRESS unchanged"

      - name: purge_scheduled_template_deleted_at_exact_retention_expiry_instant
        grounds:
          - calculations.retention_schedule
          - state_machines.BiometricTemplate.state.STORED_to_PURGE_SCHEDULED
          - state_machines.BiometricTemplate.state.PURGE_SCHEDULED_to_DELETED
          - entities.BiometricTemplate.fields.retention_expires_at
          - entities.BiometricTemplate.fields.deletion_reason
        distinguishing_aspect: |
          Metric: the clock position relative to retention_expires_at on POST /idv/retention-sweeps.
          At exactly 2026-11-08T09:00:00Z == retention_expires_at the template MUST be DELETED with
          deletion_reason RETENTION_EXPIRED, proving the sweep comparison is clock >= expiry.
        test_recipe:
          setup:
            - "Clock is set to 2026-08-10T09:00:00Z."
            - "Client Acme Purge is LIVE with RETAIN_90_DAYS retention, quota 50, 1 review credit."
            - "Policy v1 allows BIOMETRIC_COMPARISON, pad_threshold_bps 7500, min_assurance_score 30, no age gate; PUBLISHED."
            - "Session subj-r6d has biometric_consent true and one biometric attempt with an ACTIVE pad 9000 / match 9200 capture: threshold 7250, PASS, quality 9120 -> 31 points, template STORED, attempt ACCEPTED."
            - "Completion at 2026-08-10T09:00:00Z writes assurance_score_final 31 >= 30, so the session is VERIFIED and the template becomes PURGE_SCHEDULED with retention_expires_at 2026-11-08T09:00:00Z."
            - "The clock is then advanced to exactly 2026-11-08T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T09:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /idv/clients"
              payload: { name: "Acme Purge", home_jurisdiction_code: "US", biometric_retention_mode: "RETAIN_90_DAYS", daily_session_quota: 50, granted_review_credits: 1 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { client_id: "$.data.id" }
            - call: "PATCH /idv/clients/${client_id}"
