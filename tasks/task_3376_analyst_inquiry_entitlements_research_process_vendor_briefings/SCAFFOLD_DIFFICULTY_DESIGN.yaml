      - name: sponsorship_revenue_conserved_across_activate_and_cancel
        grounds:
          - calculations.sponsor_minute_share
          - state_machines.Sponsorship.ACTIVE_to_CANCELLED
          - entities.ConferenceEvent.fields.sponsorship_revenue_cents
          - entities.Sponsorship.fields.sponsor_slot_counted
        distinguishing_aspect: "Conserved quantity B (money, not units): the identity sponsorship_revenue_cents == sum of amount_cents over ACTIVE sponsorships returns to exactly its pre-activation value after the compensating cancel, with the event version advancing on both hops."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One DRAFT event and one ACTIVE vendor."
          setup_api_calls:
            - *k_clock
            - *k_ven1
            - call: "POST /research/conference-events"
              payload: { event_name: "Symposium 2026", venue_region: "NA", start_utc: "2026-10-20T09:00:00Z", end_utc: "2026-10-22T17:00:00Z" }
              as: EventProgrammer
              captures: { ev_id: $.data.id, ev_v: $.data.version }
            - call: "POST /research/sponsorships"
              payload: { conference_event_id: "${ev_id}", vendor_id: "${ven1_id}", tier: "PLATINUM", amount_cents: 9000000, exclusivity_start_utc: "2026-10-01T00:00:00Z", exclusivity_end_utc: "2026-10-05T00:00:00Z", expected_conference_event_version: "${ev_v}" }
              as: SalesRep
              captures: { sp_id: $.data.id }
          trigger:
            - call: "POST /research/sponsorships/${sp_id}/activate"
              payload: {}
              as: EventProgrammer
            - call: "GET /research/conference-events/${ev_id}"
              payload: {}
              as: EventProgrammer
            - call: "POST /research/sponsorships/${sp_id}/cancel"
              payload: { cancel_reason: "Vendor pulled out before the agenda locked" }
              as: EventProgrammer
          assert:
            - "ConferenceEvent.${ev_id}.sponsorship_revenue_cents == 0 while the package is PENDING"
            - "after activation ConferenceEvent.${ev_id}.sponsorship_revenue_cents == 9000000 and Sponsorship.${sp_id}.sponsor_slot_counted == true"
            - "after the cancel ConferenceEvent.${ev_id}.sponsorship_revenue_cents == 0"
            - "Sponsorship.${sp_id}.status == CANCELLED and sponsor_slot_counted == false"
            - "the identity sponsorship_revenue_cents == 9000000 - 9000000 holds and the event version advanced on both the activate and the cancel"

      - name: reprint_copies_conserved_across_consume_and_return
        grounds:
          - calculations.reprint_license_fee
          - entities.VendorInclusion.fields.reprint_copies_used
          - entities.VendorInclusion.fields.reprint_copies_authorized
          - entities.VendorInclusion.fields.reprint_fee_cents
        distinguishing_aspect: "Conserved quantity C (licensed copies and the fee derived from them): a +800 consumption followed by a -800 return leaves reprint_copies_used back at 0 and reprint_fee_cents back at exactly its pre-adjustment 250000, because the volume-discount bracket is re-derived rather than accumulated."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One analyst, one ACTIVE vendor, one DRAFT document and one STANDARD reprint licence authorizing 800 copies."
          setup_api_calls:
            - *k_clock
            - *k_an1
            - *k_ven1
            - *k_doc
            - call: "POST /research/documents/${doc_id}/vendor-inclusions"
              payload: { vendor_id: "${ven1_id}", dimension_scores: [{ dimension: "PRODUCT_CAPABILITY", raw_score: 4.35, weight_pct: 0.30 }, { dimension: "MARKET_EXECUTION", raw_score: 3.80, weight_pct: 0.25 }, { dimension: "CUSTOMER_VOICE", raw_score: 4.10, weight_pct: 0.20 }, { dimension: "INNOVATION_ROADMAP", raw_score: 3.25, weight_pct: 0.15 }, { dimension: "PRICING_TRANSPARENCY", raw_score: 2.90, weight_pct: 0.10 }], inclusion_criteria_met_count: 5, expected_document_version: "${doc_v}", reprint_tier: "STANDARD", permitted_marketing_use: "FULL_REPRINT", reprint_copies_authorized: 800 }
              as: Analyst
              as_user_id: "${an1_id}"
              captures: { inc_id: $.data.id }
          trigger:
            - call: "POST /research/vendor-inclusions/${inc_id}/reprint-copy-adjustments"
              payload: { delta_copies: 800, permitted_marketing_use: "FULL_REPRINT" }
              as: VendorRep
              as_user_id: "${ven1_id}"
            - call: "POST /research/vendor-inclusions/${inc_id}/reprint-copy-adjustments"
              payload: { delta_copies: -800, permitted_marketing_use: "FULL_REPRINT" }
              as: VendorRep
              as_user_id: "${ven1_id}"
          assert:
            - "the licence fee is 250000 before any adjustment, with reprint_copies_used == 0"
            - "after consuming 800 copies reprint_copies_used == 800 and reprint_fee_cents == 468000"
            - "after returning 800 copies reprint_copies_used == 0"
            - "reprint_fee_cents == 250000 again, exactly the pre-adjustment value"
            - "the identity reprint_copies_authorized == reprint_copies_used + (800 - reprint_copies_used) holds with reprint_copies_authorized == 800"
