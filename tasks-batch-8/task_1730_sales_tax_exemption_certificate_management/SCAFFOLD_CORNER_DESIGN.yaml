              as: ComplianceOfficer
              as_user_id: "u_co1"
              captures: { cert: $.data.id }
            - call: "POST /tenants/${tid}/drop_ship_links"
              payload: { retailer_customer_id: "${cid}", ship_to_state: "CA", resale_certificate_id: "${cert}" }
              as: ComplianceOfficer
              captures: { dsl: $.data.id }
          trigger:
            - call: "POST /tenants/${tid}/drop_ship_links/${dsl}/verify"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_RESALE_CERT_NOT_APPROVED"

      - name: drop_ship_state_mismatch_when_disallowed
        claim_type: violation_to_error
        grounds: ["errors[ERR_DROP_SHIP_STATE_MISMATCH]"]
        distinguishing_aspect: "JurisdictionRule.allows_drop_ship_resale=false and resale cert is for a different state -> ERR_DROP_SHIP_STATE_MISMATCH"
        test_recipe:
          setup: ["CA rule disallows out-of-state resale; customer has APPROVED TX cert; DropShipLink ship_to=CA"]
          setup_api_calls:
            - call: "POST /tenants"
              payload: { legal_name: "T1", home_state_code: "NY" }
              as: TenantAdmin
              captures: { tid: $.data.id }
