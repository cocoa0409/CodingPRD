          assert:
            - "Omitted rate_variant: ${d_applied} == NET_OVERCHARGE (the jurisdiction default), ${d_rate} == 0.00, ${d_out} == PASS"
            - "Explicit rate_variant: ${e_applied} == GROSS_MISMATCH, ${e_rate} == 50.00, ${e_out} == FAIL (50.00 >= 25.0)"
            - "${d_gross} == ${e_gross} == 50.00 and ${d_net} == ${e_net} == 0.00 — both variants are computed and stored on both audits regardless of which one was applied"
            - "sample_size == 4, overcharge_count == 1 and undercharge_count == 1 on both audits"
            - "Store.${store_a}.failed_audit_count_30d == 1 and compliance_posture == RESTRICTED — only the GROSS_MISMATCH audit counted as failed"

