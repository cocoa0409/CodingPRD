              captures: { t_a: $.data.id }
            - call: "POST /teams"
              payload: { policy_cycle_id: "${cyc_a}", team_code: "T-B", expected_days_in_office_per_week: 4, core_collaboration_days: ["MON", "TUE", "WED", "THU"], headcount_planned: 25, signal_corroboration_required: false }
              as: WorkplaceProgramOffice
              captures: { t_b: $.data.id }
            - call: "POST /teams"
              payload: { policy_cycle_id: "${cyc_b}", team_code: "T-Z", expected_days_in_office_per_week: 3, core_collaboration_days: ["WED"], headcount_planned: 12, signal_corroboration_required: false }
              as: WorkplaceProgramOffice
              captures: { t_z: $.data.id }
