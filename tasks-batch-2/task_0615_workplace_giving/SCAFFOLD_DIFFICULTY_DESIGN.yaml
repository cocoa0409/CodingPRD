          Depth-3 chain triggered by batch settle (a different trigger than donation settle): DisbursementBatch
          LOCKED->SETTLED (A) causes each STAGED Grant->SETTLED (B), and the MATCH-source Grant's settlement (B)
          causes its MatchingGift FINALIZED->SETTLED (C). Charity.total_received is credited as part of A's
          settlement.
