  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: booth_fee_charge_conservation_across_forfeit
        grounds:
          - calculations.booth_fee_final
          - state_machines.BoothAssignment.ACTIVE_to_FORFEITED
        distinguishing_aspect: |
          Conserved quantity = sum of BoothFeeCharge.amount_cents for an
          assignment. Forward action = /pay mints FINAL charge (+X cents).
          Compensating action = /forfeit mints REFUND charge (-X cents).
          Invariant: sum(charge.amount_cents) == 0 across the assignment
          after pay-then-forfeit; PROVISIONAL row is a quote, not counted.
        test_recipe:
          setup:
            - "MakerEvent SCHEDULING; one BoothAssignment ACTIVE with FINAL charge of 5000 cents"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /maker-events"
              payload:
                name: "Conserve Fair"
                opens_at: "2026-06-01T09:00:00Z"
                closes_at: "2026-06-01T18:00:00Z"
                venue_capacity: 100
                application_window_start: "2026-05-01T00:00:00Z"
                application_window_end: "2026-05-10T00:00:00Z"
                jury_quorum: 2
                commission_pct_standard: 0.10
                commission_pct_anchor: 0.05
