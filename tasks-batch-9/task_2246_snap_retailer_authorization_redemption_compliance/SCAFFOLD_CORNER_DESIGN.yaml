            - "the store read in the same instant shows sanction_status == DETERMINED"
            - "no field lags: every read reflects the write without a second round trip"

    # ------------------------------------------------------------------------
    # §1.9 COVERAGE AUDIT
    #
    # entities (13)      Creation, Retrieval, Listing, Not Found, Required
    #                    Fields, Defaults, Computed Fields, System Fields, Type
    #                    Constraints (x2), Immutability, Parent Relationships
    #                    (x2) - all 11 claim types of the guide, plus the
    #                    `graph` topology claim (the TerminalDeployment junction).
    # state_machines (22) Valid Transition (x3), Precondition Enforcement (x3),
    #                    Side Effect Execution (x3), Invalid Transitions (x3),
    #                    Initial State, Terminal State Lockdown (x2),
    #                    Idempotency, plus 4 excluded_because stubs for the
    #                    parallel-dimension, cyclic deficiency, cascade and
    #                    depot-conservation corners owned by §1.8 (5 stubs).
    # calculations (22)  Correct Result, Input Set Filtering, Constants Applied
    #                    and Precision across all 17 §1.4 formulas, with the
    #                    threshold / aggregation / weighted_scoring /
    #                    decay_function / waterfall_allocation boundary claims;
    #                    8 stubs defer to §1.8 boundary and variant instances.
    # validations (33)   Violation -> Error and Satisfaction -> Pass for all 21
    #                    priorities, four Priority Ordering claims, the three
    #                    segregation-of-duties prohibitions, and 7 stubs for the
    #                    conflicts §1.8 already pins.
    # endpoints (10)     Standard CRUD, Action endpoint (x3), Bulk action,
    #                    Cross-reference link, Computed read, Conditional action
    #                    (x2) and the envelope/pagination contract.
    # errors (5)         All 57 §1.6 codes triggerable - see the audit table in
