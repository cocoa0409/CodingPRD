            - "After the refusal service_status is still SHUTOFF_SCHEDULED and shutoff_scheduled_for is still 2026-08-11"
            - "DEPENDENCY SATISFIED: HighBillInvestigation.${inv_id}.status == CLOSED_NO_ADJUSTMENT, shutoff_hold_active == false and ServiceAccount.${acct_b_id}.open_investigation_hold_count == 0"
