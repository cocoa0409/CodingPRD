              as: ChargeNurse
              captures: { ac2: $.data.id }
            - call: "POST /assignments/${ac2}/accept"
              as: StaffNurse
              as_user_id: "${c2}"
            - call: "POST /assignments/${ac2}/confirm"
              as: ChargeNurse
            - call: "GET /shifts/${sh}"
              as: NurseAdmin
              captures: { v3: $.data.version }
            - call: "POST /shifts/${sh}/assignments"
              payload: { nurse_id: "${g1}", expected_shift_version: "${v3}" }
              as: ChargeNurse
              captures: { ag1: $.data.id }
            - call: "POST /assignments/${ag1}/accept"
              as: StaffNurse
              as_user_id: "${g1}"
            - call: "POST /assignments/${ag1}/confirm"
              as: ChargeNurse
            - call: "GET /shifts/${sh}"
              as: NurseAdmin
              captures: { v4: $.data.version }
            - call: "POST /shifts/${sh}/assignments"
