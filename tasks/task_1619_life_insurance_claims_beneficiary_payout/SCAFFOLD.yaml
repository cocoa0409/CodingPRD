# =============================================================================
# PRD Benchmark Seed Tables — Life Insurance Claims & Beneficiary Payout
# =============================================================================

scenario: |
  Life Insurance Claims & Beneficiary Payout (life insurer claims department): claim notification & proof of death documentation, contestability period review & underwriting rescission analysis, beneficiary designation validation & competing claims, interpleader referral & legal escalation, interest on delayed payment by state statute, settlement option (lump sum/retained asset account) election, unclaimed death benefit & death master file matching, escheatment of unclaimed proceeds

domain_name: life-insurance-claims
api_prefix: ""   # flat topology: all collections live at root (e.g. /policies, /claims)

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit        # regulatory gating, SoD, escheatment deadlines, audit trail
  secondary_archetype: ledger_reconciliation # statutory interest vs payout ledger; provisional vs final yields
  complexity_layers:
    - cascading_side_effects     # rival-filing dispute cascade; payment cascade; dormancy sweep cascade
    - dual_variant_calculation   # statutory interest basis variants; RAA provisional vs final yield
    - rate_threshold_triggers    # contestability window, interest grace days, DMF score bands, dormancy
    - optimistic_concurrency     # OCC on Claim.version (election supersede) and Policy.version (designation change)
  entity_topology: flat                      # peer collections with FK references (no URL nesting except creation/list convenience)
  state_machine_shape: branching             # Claim: fork on contestability + LEGAL_HOLD branch; cycles on BeneficiaryClaim & RetainedAssetAccount
  relationship_patterns:
    - one_to_many                # Policy→Claim→{DeathDocument, BeneficiaryClaim→PayoutElection}, Policy→BeneficiaryDesignation
    - cross_aggregate            # Claim.state_code resolved against StateStatute config; EscheatmentCase links Claim or RetainedAssetAccount
  role_model: segregation_of_duties          # approver != assigned examiner; doc reviewer != uploader
  consistency_model: immediate               # every mutation + cascade visible in the same response/read

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Policy
    parent: null
    common_fields: true
    fields:
      - { name: policy_number, type: string, source: input, description: "Carrier-assigned policy number; unique across all policies", constraints: "unique" }
      - { name: insured_name, type: string, source: input, description: "Full legal name of insured; compared verbatim (exact string equality) by death-master matching" }
      - { name: insured_dob, type: string, source: input, description: "Insured date of birth, ISO date YYYY-MM-DD" }
      - { name: insured_ssn_last4, type: string, source: input, description: "Optional last-4 of insured SSN, used by death-master matching", default: null }
      - { name: insured_zip, type: string, source: input, description: "Optional insured residence ZIP, used by death-master matching", default: null }
      - { name: state_code, type: string, source: input, description: "Two-letter state of issue; resolved cross-aggregate against StateStatute.state_code at claim time (plain reference, not an FK)" }
      - { name: face_amount_cents, type: integer, source: input, description: "Policy face amount in cents; must be > 0" }
      - { name: issue_date, type: string, source: input, description: "Coverage issue date, ISO date; contestability clock starts here" }
      - { name: contestability_months, type: integer, source: input, default: 24, description: "Contestability window length in calendar months; death strictly before issue_date + this many months is contestable" }
      - { name: lapse_date, type: string, source: system, default: null, description: "ISO date policy lapsed; set by POST /policies/{id}/lapse" }
      - { name: status, type: enum, source: system, description: "ACTIVE | LAPSED" }

  - name: BeneficiaryDesignation
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: system, description: "FK -> Policy.id; set from path at creation" }
      - { name: beneficiary_name, type: string, source: input, description: "Beneficiary full legal name" }
      - { name: beneficiary_type, type: enum, source: input, description: "PRIMARY | CONTINGENT" }
      - { name: share_percent, type: number, source: input, description: "Share of proceeds, 0 < x <= 100 with at most 2 decimal places" }
      - { name: effective_date, type: string, source: input, description: "ISO date the designation takes effect; active window is the half-open interval [effective_date, date(revoked_at))" }
      - { name: revoked_at, type: datetime, source: system, default: null, description: "Set to logical clock time on revocation" }
      - { name: status, type: enum, source: system, description: "ACTIVE | REVOKED" }

  - name: Claim
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id; supplied in POST /claims body" }
      - { name: state_code, type: string, source: system, description: "Copied from Policy.state_code at creation; statute lookup key" }
      - { name: date_of_death, type: string, source: input, description: "ISO date of insured's death" }
      - { name: cause_of_death, type: string, source: input, default: null, description: "Optional cause of death" }
      - { name: notification_date, type: string, source: system, description: "ISO date claim filed (logical clock date at creation)" }
      - { name: assigned_examiner_id, type: string, source: system, description: "X-User-ID of the ClaimsExaminer who filed the claim; segregation-of-duties anchor" }
      - { name: contestability_flag, type: boolean, source: computed, description: "true iff date_of_death < issue_date + contestability_months (calendar months); strict inequality — death exactly on the boundary date is NOT contestable" }
      - { name: proof_complete_date, type: string, source: system, default: null, description: "ISO date the required-document set became fully VERIFIED; recomputed on every document review" }
      - { name: face_amount_cents, type: integer, source: system, description: "Copied from Policy.face_amount_cents at creation (snapshot)" }
      - { name: accrued_interest_cents, type: integer, source: computed, default: 0, description: "Statutory delay interest; computed at approve (as-of approve date) and recomputed at execute-payment (as-of payment date) and at refer-interpleader (frozen as-of referral date)" }
      - { name: total_payable_cents, type: integer, source: computed, default: null, description: "face_amount_cents + accrued_interest_cents; set at approve, refreshed at execute-payment" }
      - { name: hold_return_state, type: enum, source: system, default: null, description: "UNDER_REVIEW | CONTESTABILITY_REVIEW | APPROVED recorded when entering LEGAL_HOLD; cleared on release" }
      - { name: approved_at, type: string, source: system, default: null, description: "ISO date of approval; election window and claim-proceeds escheatment clock start here" }
      - { name: paid_at, type: string, source: system, default: null, description: "ISO date claim reached PAID" }
      - { name: denial_reason, type: string, source: input, default: null, description: "Required on deny" }
      - { name: rescission_reason, type: string, source: input, default: null, description: "Required on rescind" }
      - { name: court_reference, type: string, source: input, default: null, description: "Required on interpleader referral" }
      - { name: status, type: enum, source: system, description: "NOTIFIED | UNDER_REVIEW | CONTESTABILITY_REVIEW | LEGAL_HOLD | APPROVED | PAID | DENIED | RESCINDED | INTERPLEADED | ESCHEATED" }

  - name: DeathDocument
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id; set from path at creation" }
      - { name: doc_type, type: enum, source: input, description: "CERTIFIED_DEATH_CERTIFICATE | ATTENDING_PHYSICIAN_STATEMENT | FUNERAL_HOME_STATEMENT" }
      - { name: uploaded_by_id, type: string, source: system, description: "X-User-ID of uploader; reviewer must differ (segregation of duties)" }
      - { name: review_result, type: enum, source: system, description: "PENDING | VERIFIED | REJECTED" }
      - { name: reviewed_by_id, type: string, source: system, default: null, description: "X-User-ID of reviewing examiner" }
      - { name: rejection_reason, type: string, source: input, default: null, description: "Required when review_result is REJECTED" }

  - name: BeneficiaryClaim
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id; set from path at creation" }
      - { name: designation_id, type: string, source: input, default: null, description: "FK -> BeneficiaryDesignation.id; null only for ESTATE claimants" }
      - { name: claimant_name, type: string, source: input, description: "Name of party asserting rights" }
      - { name: claimant_type, type: enum, source: input, description: "NAMED_BENEFICIARY | ESTATE" }
      - { name: allocated_amount_cents, type: integer, source: computed, default: null, description: "Share of total_payable_cents per allocation waterfall; set when entering PAYABLE, refreshed at execute-payment" }
      - { name: paid_amount_cents, type: integer, source: system, default: null, description: "Amount disbursed (lump sum paid or retained-asset account funded)" }
      - { name: rejection_reason, type: string, source: input, default: null, description: "Required on reject" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | VALIDATED | DISPUTED | PAYABLE | PAID | REJECTED | WITHDRAWN | INTERPLEADED | ESCHEATED" }

  - name: PayoutElection
    parent: BeneficiaryClaim
    common_fields: true
    fields:
      - { name: beneficiary_claim_id, type: string, source: system, description: "FK -> BeneficiaryClaim.id; set from path at creation" }
      - { name: option, type: enum, source: input, description: "LUMP_SUM | RETAINED_ASSET_ACCOUNT" }
      - { name: status, type: enum, source: system, description: "ELECTED | CONFIRMED | SUSPENDED | SUPERSEDED" }
      - { name: elected_at, type: datetime, source: system, description: "Logical clock time of election" }
      - { name: confirmed_at, type: datetime, source: system, default: null, description: "Logical clock time of confirmation" }

  - name: RetainedAssetAccount
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id; claim whose proceeds fund the account" }
      - { name: beneficiary_claim_id, type: string, source: system, description: "FK -> BeneficiaryClaim.id; beneficiary whose RAA election funded the account" }
      - { name: deposited_cents, type: integer, source: system, description: "Initial deposit = BeneficiaryClaim.allocated_amount_cents at funding; immutable" }
      - { name: balance_cents, type: integer, source: system, description: "Current principal balance; decremented by withdrawals" }
      - { name: withdrawn_total_cents, type: integer, source: system, default: 0, description: "Cumulative principal withdrawn" }
      - { name: provisional_interest_cents, type: integer, source: computed, default: 0, description: "Statement estimate: simple interest on balance_cents at statute raa rate for days since creation (read-only, recomputed on every GET)" }
      - { name: interest_paid_cents, type: integer, source: system, default: 0, description: "Final compound yield posted at CLOSED or ESCHEATED" }
      - { name: last_activity_at, type: datetime, source: system, description: "Creation or last withdrawal time (logical clock); dormancy clock anchor" }
      - { name: status, type: enum, source: system, description: "OPEN | DORMANT | CLOSED | ESCHEATED" }

  - name: StateStatute
    parent: null
    common_fields: false
    fields:
      - { name: state_code, type: string, source: input, description: "Two-letter state code; unique", constraints: "unique" }
      - { name: annual_interest_rate_bp, type: integer, source: input, description: "Statutory delayed-payment interest rate in basis points (e.g. 1000 = 10%)" }
      - { name: interest_basis, type: enum, source: input, description: "DATE_OF_DEATH | PROOF_OF_LOSS_COMPLETE — accrual basis date selector" }
      - { name: grace_days, type: integer, source: input, description: "Days after basis date before interest accrues; accrual days = max(0, days_elapsed - grace_days)" }
      - { name: payment_deadline_days, type: integer, source: input, description: "Days after proof_complete_date by which payment is statutorily due (informational deadline surfaced on Claim)" }
      - { name: dormancy_years, type: integer, source: input, description: "Unclaimed-property dormancy period in calendar years (claim proceeds and retained asset accounts)" }
      - { name: raa_minimum_cents, type: integer, source: input, description: "Minimum allocated amount eligible for RETAINED_ASSET_ACCOUNT election" }
      - { name: raa_annual_interest_rate_bp, type: integer, source: input, description: "Retained asset account credit rate in basis points" }

  - name: DeathMasterMatch
    parent: Policy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: system, description: "FK -> Policy.id; set from path at creation" }
      - { name: deceased_name, type: string, source: input, description: "Name on the death master file record" }
      - { name: deceased_dob, type: string, source: input, description: "DOB on the DMF record, ISO date" }
      - { name: deceased_death_date, type: string, source: input, description: "Death date on the DMF record, ISO date; becomes Claim.date_of_death on confirmation" }
      - { name: deceased_ssn_last4, type: string, source: input, default: null, description: "Last-4 SSN on the DMF record" }
      - { name: deceased_zip, type: string, source: input, default: null, description: "ZIP on the DMF record" }
      - { name: match_score, type: integer, source: computed, description: "0-100 per dmf_match_score rule; SSN exact match short-circuits to 100" }
      - { name: generated_claim_id, type: string, source: system, default: null, description: "Claim auto-created on CONFIRMED; null if a non-terminal claim already exists on the policy" }
      - { name: status, type: enum, source: system, description: "PENDING_REVIEW | CONFIRMED | FALSE_POSITIVE" }

  - name: EscheatmentCase
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id; proceeds or account belongs to this claim" }
      - { name: account_id, type: string, source: system, default: null, description: "FK -> RetainedAssetAccount.id; set when subject_type is RETAINED_ASSET_ACCOUNT, else null" }
      - { name: subject_type, type: enum, source: system, description: "CLAIM_PROCEEDS | RETAINED_ASSET_ACCOUNT" }
      - { name: state_code, type: string, source: system, description: "Copied from Claim.state_code; governs dormancy_years" }
      - { name: amount_cents, type: integer, source: system, description: "Snapshot of unpaid proceeds (claim.total_payable_cents - sum of paid) or account balance + final interest at escheat; set at creation for CLAIM_PROCEEDS, finalized at escheat for RETAINED_ASSET_ACCOUNT" }
      - { name: trigger_date, type: string, source: system, description: "ISO date the dormancy clock started (claim approved_at for proceeds; account last_activity_at date for RAA)" }
      - { name: escheat_due_date, type: string, source: computed, description: "trigger_date + dormancy_years (calendar years)" }
      - { name: due_diligence_start_date, type: string, source: computed, description: "escheat_due_date - 120 days" }
      - { name: resolution_note, type: string, source: input, default: null, description: "Optional note on resolve" }
      - { name: status, type: enum, source: system, description: "MONITORING | DUE_DILIGENCE | ESCHEATED | RESOLVED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Policy
    initial_state: ACTIVE
    terminal_states: [LAPSED]
    transitions:
      - from: ACTIVE
        to: LAPSED
        trigger: POST /policies/{policyId}/lapse
        actor: PolicyAdministrator
        preconditions:
          - "Policy must be ACTIVE (else ERR_POLICY_NOT_ACTIVE)"
        side_effects:
          - "lapse_date = logical clock date"
          - "increments Policy.version by 1"

  - entity: BeneficiaryDesignation
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: POST /beneficiary-designations/{designationId}/revoke
        actor: PolicyAdministrator
        preconditions:
          - "Designation must be ACTIVE (else ERR_DESIGNATION_ALREADY_REVOKED)"
          - "No Claim may exist on the designation's policy (else ERR_DESIGNATION_FROZEN_AFTER_CLAIM)"
        side_effects:
          - "revoked_at = logical clock time"
          - "increments Policy.version by 1 (beneficiary structure change)"

  - entity: Claim
    initial_state: NOTIFIED
    terminal_states: [PAID, DENIED, RESCINDED, INTERPLEADED, ESCHEATED]
    transitions:
      - from: NOTIFIED
        to: UNDER_REVIEW
        trigger: POST /claims/{claimId}/begin-review
        actor: ClaimsExaminer
        preconditions:
          - "Claim must be NOTIFIED (else ERR_CLAIM_NOT_REVIEWABLE)"
          - "contestability_flag must be false (routing fork)"
        side_effects: ["increments Claim.version by 1"]
      - from: NOTIFIED
        to: CONTESTABILITY_REVIEW
        trigger: POST /claims/{claimId}/begin-review
        actor: ClaimsExaminer
        preconditions:
          - "Claim must be NOTIFIED (else ERR_CLAIM_NOT_REVIEWABLE)"
          - "contestability_flag must be true (routing fork)"
        side_effects: ["increments Claim.version by 1"]
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: POST /claims/{claimId}/approve
        actor: ClaimsApprover
        preconditions:
          - "Claim must be UNDER_REVIEW or CONTESTABILITY_REVIEW (else ERR_CLAIM_NOT_UNDER_REVIEW; from LEGAL_HOLD -> ERR_CLAIM_IN_LEGAL_HOLD)"
          - "X-User-ID != assigned_examiner_id (else ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
          - "Every required doc type has at least one VERIFIED DeathDocument (required = CERTIFIED_DEATH_CERTIFICATE, plus ATTENDING_PHYSICIAN_STATEMENT when contestability_flag is true; else ERR_REQUIRED_DOCS_INCOMPLETE)"
        side_effects:
          - "status -> APPROVED; approved_at = logical clock date"
          - "accrued_interest_cents computed as-of approve date (statutory_interest); total_payable_cents = face + interest"
          - "allocation waterfall runs (beneficiary_allocation): pool members (VALIDATED) -> PAYABLE with allocated_amount_cents; non-pool VALIDATED claims stay VALIDATED"
          - "if allocation pool is empty (no VALIDATED BeneficiaryClaim): create EscheatmentCase(subject_type=CLAIM_PROCEEDS, status=MONITORING, trigger_date=approved_at)"
          - "increments Claim.version by 1"
      - from: CONTESTABILITY_REVIEW
        to: APPROVED
        trigger: POST /claims/{claimId}/approve
        actor: ClaimsApprover
        preconditions: ["same as UNDER_REVIEW -> APPROVED (contestability cleared implicitly by approval)"]
        side_effects: ["same as UNDER_REVIEW -> APPROVED"]
      - from: UNDER_REVIEW
        to: DENIED
        trigger: POST /claims/{claimId}/deny
        actor: ClaimsApprover
        preconditions:
          - "Claim must be UNDER_REVIEW or CONTESTABILITY_REVIEW (else ERR_CLAIM_NOT_UNDER_REVIEW)"
          - "X-User-ID != assigned_examiner_id (else ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
        side_effects:
          - "denial_reason stored"
          - "all BeneficiaryClaims in SUBMITTED/VALIDATED/DISPUTED -> REJECTED with rejection_reason='CLAIM_DENIED'"
          - "increments Claim.version by 1"
      - from: CONTESTABILITY_REVIEW
        to: DENIED
        trigger: POST /claims/{claimId}/deny
        actor: ClaimsApprover
        preconditions: ["same as UNDER_REVIEW -> DENIED"]
        side_effects: ["same as UNDER_REVIEW -> DENIED"]
      - from: CONTESTABILITY_REVIEW
        to: RESCINDED
        trigger: POST /claims/{claimId}/rescind
        actor: ClaimsApprover
        preconditions:
          - "Claim must be CONTESTABILITY_REVIEW (else ERR_CLAIM_NOT_IN_CONTESTABILITY_REVIEW)"
          - "X-User-ID != assigned_examiner_id (else ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
        side_effects:
          - "rescission_reason stored"
          - "all BeneficiaryClaims in SUBMITTED/VALIDATED/DISPUTED -> REJECTED with rejection_reason='POLICY_RESCINDED'"
          - "increments Claim.version by 1"
      - from: UNDER_REVIEW
        to: LEGAL_HOLD
        trigger: "system (cascade: a BeneficiaryClaim entered DISPUTED)"
        actor: system
        preconditions: []
        side_effects:
          - "hold_return_state = UNDER_REVIEW"
          - "all PayoutElections of this claim's BeneficiaryClaims in ELECTED/CONFIRMED -> SUSPENDED"
          - "increments Claim.version by 1"
      - from: CONTESTABILITY_REVIEW
        to: LEGAL_HOLD
        trigger: "system (cascade: a BeneficiaryClaim entered DISPUTED)"
        actor: system
        preconditions: []
        side_effects:
          - "hold_return_state = CONTESTABILITY_REVIEW"
          - "all PayoutElections of this claim's BeneficiaryClaims in ELECTED/CONFIRMED -> SUSPENDED"
          - "increments Claim.version by 1"
      - from: APPROVED
        to: LEGAL_HOLD
        trigger: "system (cascade: a BeneficiaryClaim entered DISPUTED)"
        actor: system
        preconditions: []
        side_effects:
          - "hold_return_state = APPROVED"
          - "all PayoutElections of this claim's BeneficiaryClaims in ELECTED/CONFIRMED -> SUSPENDED"
          - "increments Claim.version by 1"
      - from: LEGAL_HOLD
        to: UNDER_REVIEW
        trigger: "system (automatic when no BeneficiaryClaim of this claim remains in DISPUTED, and hold_return_state == UNDER_REVIEW)"
        actor: system
        preconditions: []
        side_effects:
          - "hold_return_state cleared to null"
          - "all PayoutElections of this claim's BeneficiaryClaims in SUSPENDED -> ELECTED (re-confirmation required)"
          - "increments Claim.version by 1"
      - from: LEGAL_HOLD
        to: CONTESTABILITY_REVIEW
        trigger: "system (automatic when no DISPUTED remain, hold_return_state == CONTESTABILITY_REVIEW)"
        actor: system
        preconditions: []
        side_effects: ["same as LEGAL_HOLD -> UNDER_REVIEW"]
      - from: LEGAL_HOLD
        to: APPROVED
        trigger: "system (automatic when no DISPUTED remain, hold_return_state == APPROVED)"
        actor: system
        preconditions: []
        side_effects:
          - "same as LEGAL_HOLD -> UNDER_REVIEW (hold_return_state cleared; SUSPENDED elections -> ELECTED; version bumped)"
          - "re-run beneficiary_allocation over the VALIDATED pool -> members back to PAYABLE with recomputed allocated_amount_cents (total_payable_cents unchanged by the hold, so allocations are restored exactly)"
      - from: LEGAL_HOLD
        to: INTERPLEADED
        trigger: POST /claims/{claimId}/refer-interpleader
        actor: LegalCounsel
        preconditions:
          - "Claim must be LEGAL_HOLD (else ERR_CLAIM_NOT_IN_LEGAL_HOLD)"
        side_effects:
          - "court_reference stored; accrued_interest_cents frozen as-of referral date (accrual stops at interpleader)"
          - "all BeneficiaryClaims in DISPUTED -> INTERPLEADED"
          - "all PayoutElections of this claim in ELECTED/CONFIRMED/SUSPENDED -> SUPERSEDED"
          - "increments Claim.version by 1"
      - from: APPROVED
        to: PAID
        trigger: "system (bubble-up during POST /claims/{claimId}/execute-payment: every PAYABLE BeneficiaryClaim reached PAID and sum(paid_amount_cents) == total_payable_cents)"
        actor: system
        preconditions: []
        side_effects: ["paid_at = logical clock date", "increments Claim.version by 1"]
      - from: APPROVED
        to: ESCHEATED
        trigger: "system (cascade: its CLAIM_PROCEEDS EscheatmentCase was escheated)"
        actor: system
        preconditions: []
        side_effects:
          - "BeneficiaryClaims in VALIDATED/PAYABLE -> ESCHEATED"
          - "PayoutElections in ELECTED/CONFIRMED/SUSPENDED -> SUPERSEDED"
          - "increments Claim.version by 1"

  - entity: DeathDocument
    initial_state: PENDING
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: POST /claims/{claimId}/documents/{documentId}/review with review_result=VERIFIED
        actor: ClaimsExaminer
        preconditions:
          - "Document must be PENDING (else ERR_DOCUMENT_ALREADY_REVIEWED)"
          - "X-User-ID != uploaded_by_id (else ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
        side_effects:
          - "reviewed_by_id = X-User-ID"
          - "recompute Claim.proof_complete_date: if every required doc type now has >= 1 VERIFIED document, set to the logical clock date of the review that completed the set; else null"
      - from: PENDING
        to: REJECTED
        trigger: POST /claims/{claimId}/documents/{documentId}/review with review_result=REJECTED
        actor: ClaimsExaminer
        preconditions:
          - "Document must be PENDING (else ERR_DOCUMENT_ALREADY_REVIEWED)"
          - "X-User-ID != uploaded_by_id (else ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
          - "rejection_reason required (else ERR_INVALID_REQUEST)"
        side_effects:
          - "reviewed_by_id = X-User-ID; rejection_reason stored"
          - "recompute Claim.proof_complete_date (may clear it if a required type lost its last VERIFIED doc — note REJECTED docs never counted)"

  - entity: BeneficiaryClaim
    initial_state: SUBMITTED
    terminal_states: [PAID, REJECTED, WITHDRAWN, INTERPLEADED, ESCHEATED]
    transitions:
      - from: SUBMITTED
        to: VALIDATED
        trigger: POST /beneficiary-claims/{beneficiaryClaimId}/validate
        actor: ClaimsExaminer
        preconditions:
          - "BeneficiaryClaim must be SUBMITTED or DISPUTED (else ERR_BENEFICIARY_CLAIM_INVALID_STATE)"
          - "Parent Claim must be non-terminal (else ERR_CLAIM_NOT_FILEABLE); LEGAL_HOLD does NOT block validation (validation is the dispute-resolution path)"
          - "If designation_id present: designation must belong to the claim's policy (ERR_DESIGNATION_POLICY_MISMATCH) and must have been ACTIVE on claim.date_of_death (ERR_DESIGNATION_NOT_ACTIVE_AT_DEATH)"
          - "No other VALIDATED/PAYABLE BeneficiaryClaim on the same designation (ERR_DESIGNATION_ALREADY_CLAIMED)"
          - "Aggregate capacity: sum of shares (designation share_percent; 100 for ESTATE) over VALIDATED+PAYABLE+candidate <= 100 (ERR_ALLOCATION_CAPACITY_EXCEEDED)"
        side_effects: ["increments BeneficiaryClaim.version by 1"]
      - from: DISPUTED
        to: VALIDATED
        trigger: POST /beneficiary-claims/{beneficiaryClaimId}/validate (after rival claim resolved)
        actor: ClaimsExaminer
        preconditions: ["same as SUBMITTED -> VALIDATED"]
        side_effects:
          - "increments BeneficiaryClaim.version by 1"
          - "LEGAL_HOLD release check: if no DISPUTED remain, claim returns to hold_return_state; when that state is APPROVED, re-run beneficiary_allocation so VALIDATED pool members return to PAYABLE (amounts recomputed deterministically from unchanged total_payable_cents)"
      - from: VALIDATED
        to: DISPUTED
        trigger: "system (cascade: a rival BeneficiaryClaim was filed on the same designation with a different claimant_name)"
        actor: system
        preconditions: []
        side_effects:
          - "parent Claim -> LEGAL_HOLD (hold_return_state recorded; elections SUSPENDED)"
          - "increments BeneficiaryClaim.version by 1"
      - from: PAYABLE
        to: DISPUTED
        trigger: "system (cascade: rival filing, same as above)"
        actor: system
        preconditions: []
        side_effects:
          - "parent Claim -> LEGAL_HOLD (elections SUSPENDED)"
          - "increments BeneficiaryClaim.version by 1"
      - from: VALIDATED
        to: PAYABLE
        trigger: "system (cascade: claim approved; allocation waterfall pool membership)"
        actor: system
        preconditions: []
        side_effects:
          - "allocated_amount_cents set per beneficiary_allocation (refreshed at execute-payment)"
          - "increments BeneficiaryClaim.version by 1"
      - from: PAYABLE
        to: PAID
        trigger: "system (cascade: execute-payment with a CONFIRMED election)"
        actor: system
        preconditions: []
        side_effects:
          - "paid_amount_cents = allocated_amount_cents (final, post interest recompute)"
          - "if election option is RETAINED_ASSET_ACCOUNT: create RetainedAssetAccount(OPEN, balance=deposited=paid_amount)"
          - "increments BeneficiaryClaim.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: POST /beneficiary-claims/{beneficiaryClaimId}/reject
        actor: ClaimsExaminer
        preconditions:
          - "BeneficiaryClaim must be SUBMITTED, VALIDATED, or DISPUTED (else ERR_BENEFICIARY_CLAIM_INVALID_STATE)"
        side_effects:
          - "rejection_reason stored"
          - "if this was DISPUTED and no DISPUTED remain on the claim: release LEGAL_HOLD to hold_return_state"
      - from: VALIDATED
        to: REJECTED
        trigger: POST /beneficiary-claims/{beneficiaryClaimId}/reject
        actor: ClaimsExaminer
        preconditions: ["same as SUBMITTED -> REJECTED"]
        side_effects: ["same as SUBMITTED -> REJECTED (no hold release needed from VALIDATED)"]
      - from: DISPUTED
        to: REJECTED
        trigger: POST /beneficiary-claims/{beneficiaryClaimId}/reject
        actor: ClaimsExaminer
        preconditions: ["same as SUBMITTED -> REJECTED"]
        side_effects: ["same as SUBMITTED -> REJECTED, including LEGAL_HOLD release check"]
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: POST /beneficiary-claims/{beneficiaryClaimId}/withdraw
        actor: ClaimsExaminer
        preconditions:
          - "BeneficiaryClaim must be SUBMITTED or DISPUTED (else ERR_BENEFICIARY_CLAIM_INVALID_STATE)"
        side_effects:
          - "if this was DISPUTED and no DISPUTED remain on the claim: release LEGAL_HOLD to hold_return_state"
      - from: DISPUTED
        to: WITHDRAWN
        trigger: POST /beneficiary-claims/{beneficiaryClaimId}/withdraw
        actor: ClaimsExaminer
        preconditions: ["same as SUBMITTED -> WITHDRAWN"]
        side_effects: ["same as SUBMITTED -> WITHDRAWN, including LEGAL_HOLD release check"]
      - from: DISPUTED
        to: INTERPLEADED
        trigger: "system (cascade: claim referred to interpleader)"
        actor: system
        preconditions: []
        side_effects: []
      - from: VALIDATED
        to: ESCHEATED
        trigger: "system (cascade: claim proceeds escheated)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PAYABLE
        to: ESCHEATED
        trigger: "system (cascade: claim proceeds escheated)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PayoutElection
    initial_state: ELECTED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ELECTED
        to: CONFIRMED
        trigger: POST /payout-elections/{electionId}/confirm
        actor: ClaimsExaminer
        preconditions:
          - "Election must be ELECTED (else ERR_ELECTION_NOT_CONFIRMABLE)"
          - "Election window: logical clock date <= claim.approved_at + 30 days (else ERR_ELECTION_WINDOW_CLOSED)"
        side_effects: ["confirmed_at = logical clock time"]
      - from: ELECTED
        to: SUPERSEDED
        trigger: "system (a new PayoutElection is created for the same BeneficiaryClaim, or claim is interpleaded/escheated)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: SUPERSEDED
        trigger: "system (same as above)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ELECTED
        to: SUSPENDED
        trigger: "system (cascade: claim entered LEGAL_HOLD)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: SUSPENDED
        trigger: "system (cascade: claim entered LEGAL_HOLD)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: ELECTED
        trigger: "system (cascade: LEGAL_HOLD released; election must be re-confirmed)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: SUPERSEDED
        trigger: "system (new election created, or claim interpleaded/escheated)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: RetainedAssetAccount
    initial_state: OPEN
    terminal_states: [CLOSED, ESCHEATED]
    transitions:
      - from: OPEN
        to: DORMANT
        trigger: "system (clock sweep: logical now > last_activity_at + statute.dormancy_years, strict inequality — exactly equal stays OPEN)"
        actor: system
        preconditions: []
        side_effects:
          - "create EscheatmentCase(subject_type=RETAINED_ASSET_ACCOUNT, status=MONITORING, trigger_date=date(last_activity_at), escheat_due_date=trigger_date+dormancy_years)"
      - from: DORMANT
        to: OPEN
        trigger: POST /retained-asset-accounts/{accountId}/withdrawals (owner activity reactivates)
        actor: ClaimsApprover
        preconditions:
          - "Account must be OPEN or DORMANT (else ERR_ACCOUNT_NOT_WITHDRAWABLE)"
          - "amount_cents <= balance_cents (else ERR_INSUFFICIENT_ACCOUNT_BALANCE)"
        side_effects:
          - "balance_cents -= amount_cents; withdrawn_total_cents += amount_cents; last_activity_at = now"
          - "linked EscheatmentCase in MONITORING/DUE_DILIGENCE -> RESOLVED with resolution_note='OWNER_ACTIVITY'"
          - "if balance_cents == 0: continue with closure side effects (final interest posted, status CLOSED)"
      - from: OPEN
        to: OPEN
        trigger: POST /retained-asset-accounts/{accountId}/withdrawals (partial withdrawal)
        actor: ClaimsApprover
        preconditions: ["same as DORMANT -> OPEN"]
        side_effects:
          - "balance_cents -= amount_cents; withdrawn_total_cents += amount_cents; last_activity_at = now"
          - "if balance_cents == 0: status -> CLOSED with closure side effects"
      - from: OPEN
        to: CLOSED
        trigger: "system (withdrawal reduced balance_cents to exactly 0)"
        actor: system
        preconditions: []
        side_effects:
          - "interest_paid_cents = final compound yield (raa_final_yield on closing balance), paid out with the final withdrawal"
      - from: DORMANT
        to: CLOSED
        trigger: "system (withdrawal reduced balance_cents to exactly 0)"
        actor: system
        preconditions: []
        side_effects: ["same as OPEN -> CLOSED"]
      - from: DORMANT
        to: ESCHEATED
        trigger: "system (cascade: its RETAINED_ASSET_ACCOUNT EscheatmentCase was escheated)"
        actor: system
        preconditions: []
        side_effects:
          - "interest_paid_cents = raa_final_yield at escheat date; amount remitted = balance_cents + interest_paid_cents"

  - entity: DeathMasterMatch
    initial_state: PENDING_REVIEW
    terminal_states: [CONFIRMED, FALSE_POSITIVE]
    transitions:
      - from: PENDING_REVIEW
        to: CONFIRMED
        trigger: "system (auto at creation when match_score >= 85) OR POST /death-master-matches/{matchId}/review with review_outcome=CONFIRMED"
        actor: ComplianceOfficer
        preconditions:
          - "Manual path: match must be PENDING_REVIEW (else ERR_MATCH_NOT_PENDING_REVIEW)"
        side_effects:
          - "if no non-terminal Claim exists on the policy: create Claim(status=NOTIFIED, date_of_death=deceased_death_date, assigned_examiner_id=null, contestability_flag computed) and set generated_claim_id"
          - "else generated_claim_id stays null (auto-creation skipped)"
      - from: PENDING_REVIEW
        to: FALSE_POSITIVE
        trigger: "system (auto at creation when match_score < 60) OR POST /death-master-matches/{matchId}/review with review_outcome=FALSE_POSITIVE"
        actor: ComplianceOfficer
        preconditions:
          - "Manual path: match must be PENDING_REVIEW (else ERR_MATCH_NOT_PENDING_REVIEW)"
        side_effects: []

  - entity: EscheatmentCase
    initial_state: MONITORING
    terminal_states: [ESCHEATED, RESOLVED]
    transitions:
      - from: MONITORING
        to: DUE_DILIGENCE
        trigger: "system (clock sweep: logical now >= due_diligence_start_date)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DUE_DILIGENCE
        to: ESCHEATED
        trigger: POST /escheatment-cases/{caseId}/escheat
        actor: ComplianceOfficer
        preconditions:
          - "Case must be DUE_DILIGENCE (else ERR_CASE_NOT_ACTIONABLE)"
          - "logical clock date >= escheat_due_date (else ERR_ESCHEATMENT_NOT_DUE)"
        side_effects:
          - "CLAIM_PROCEEDS: amount_cents finalized = claim.total_payable_cents - sum(paid); claim -> ESCHEATED (cascade to BeneficiaryClaims/PayoutElections)"
          - "RETAINED_ASSET_ACCOUNT: account -> ESCHEATED with final interest posted; amount_cents = balance + interest"
      - from: MONITORING
        to: RESOLVED
        trigger: POST /escheatment-cases/{caseId}/resolve
        actor: ComplianceOfficer
        preconditions:
          - "Case must be MONITORING or DUE_DILIGENCE (else ERR_CASE_NOT_ACTIONABLE)"
        side_effects:
          - "resolution_note stored"
          - "RETAINED_ASSET_ACCOUNT subject: account DORMANT -> OPEN, last_activity_at = now"
      - from: DUE_DILIGENCE
        to: RESOLVED
        trigger: POST /escheatment-cases/{caseId}/resolve
        actor: ComplianceOfficer
        preconditions: ["same as MONITORING -> RESOLVED"]
        side_effects: ["same as MONITORING -> RESOLVED"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: election-create-stale-claim
    parent_entity: Claim
    write_endpoint: "POST /beneficiary-claims/{beneficiaryClaimId}/elections"
    occ_field: expected_claim_version
    description: |
      Creating a PayoutElection against a Claim whose version has advanced since
      the client last observed it is rejected. Creating an election legitimately
      supersedes the beneficiary's prior ELECTED/CONFIRMED election, so a writer
      holding a stale claim version would supersede a choice it never saw.
    error_id: ERR_STALE_CLAIM_VERSION
    http_status: 412
  - rule_id: designation-create-stale-policy
    parent_entity: Policy
    write_endpoint: "POST /policies/{policyId}/beneficiary-designations"
    occ_field: expected_policy_version
    description: |
      Creating a BeneficiaryDesignation against a Policy whose version has
      advanced since the client last observed it is rejected. Each designation
      creation or revocation restructures the policy's beneficiary pool
      (bumping Policy.version), so a stale writer would allocate shares against
      a pool composition it never saw.
    error_id: ERR_STALE_POLICY_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: statutory_interest
    trigger: "claim approve (as-of approve date), execute-payment (recomputed as-of payment date), refer-interpleader (frozen as-of referral date)"
    algorithm: threshold
    formula: |
      statute = StateStatute where state_code == claim.state_code
      basis_date = claim.date_of_death if statute.interest_basis == DATE_OF_DEATH
                   else claim.proof_complete_date   # PROOF_OF_LOSS_COMPLETE; if proof incomplete, accrual cannot start
      days_elapsed = (as_of_date - basis_date).days
      accrual_days = max(0, days_elapsed - statute.grace_days)   # strictly: at days_elapsed == grace_days, accrual is 0
      accrued_interest_cents = round_half_up(claim.face_amount_cents * statute.annual_interest_rate_bp / 10000 * accrual_days / 365)
    input_set: "the single claim being approved/paid/referred; no other claims included"
    constants:
      DAYS_PER_YEAR: 365
    precision: "integer cents, round_half_up (half-cent rounds up)"
    variants:
      - name: date_of_death_basis
        when: "statute.interest_basis == DATE_OF_DEATH"
        difference: "accrual clock starts at date_of_death; identical claim data yields more interest than proof basis whenever death precedes proof completion"
      - name: proof_of_loss_basis
        when: "statute.interest_basis == PROOF_OF_LOSS_COMPLETE"
        difference: "accrual clock starts at proof_complete_date; yields less interest for identical claim data"

  - name: beneficiary_allocation
    trigger: "claim approve (pool assignment + initial amounts) and execute-payment (amounts re-run if interest moved the total)"
    algorithm: waterfall_allocation
    formula: |
      1. total = claim.total_payable_cents (face + accrued interest, already integer cents)
      2. pool selection (state-filtered): among BeneficiaryClaims of this claim in VALIDATED:
             if any reference a PRIMARY designation -> pool = those
             elif any reference a CONTINGENT designation -> pool = those
             elif any ESTATE claimant exists -> pool = estate claims (share 100 each; capacity rule guarantees at most one)
             else pool = empty (proceeds unclaimed)
      3. for each pool member: raw_cents = total * share_percent / 100
                               rounded_cents = round_half_up(raw_cents)   # per-beneficiary rounding FIRST
      4. remainder = total - sum(rounded_cents)   # may be negative when rounding overshoots
      5. remainder (positive or negative) goes to the pool member with the highest share_percent;
         tie-break: earliest designation.effective_date, then designation.created_at ASC
      6. pool members -> PAYABLE with allocated_amount_cents; validated non-pool members stay VALIDATED
    input_set: "BeneficiaryClaims of this claim in status VALIDATED only; SUBMITTED/DISPUTED/REJECTED/WITHDRAWN/INTERPLEADED excluded"
    constants: {}
    precision: "integer cents; rounding order pinned: round each beneficiary share first (round_half_up), then assign the remainder — never round the total"

  - name: contestability_flag
    trigger: "claim creation (including DMF-auto-created claims)"
    algorithm: threshold
    formula: |
      boundary = issue_date + contestability_months calendar months (same day-of-month)
      contestability_flag = (date_of_death < boundary)   # strict: death exactly on boundary date => false
    input_set: "the new claim and its policy"
    constants:
      DEFAULT_CONTESTABILITY_MONTHS: 24
    precision: "date granularity"

  - name: dmf_match_score
    trigger: "POST /policies/{policyId}/death-master-matches (creation)"
    algorithm: weighted_scoring
    formula: |
      if deceased_ssn_last4 is present AND policy.insured_ssn_last4 is present
         AND deceased_ssn_last4 == policy.insured_ssn_last4:
          match_score = 100                      # SSN exact match short-circuits
      else:
          match_score = 45 * (deceased_name == policy.insured_name)
                      + 25 * (deceased_dob == policy.insured_dob)
                      + 15 * (deceased_zip is present AND deceased_zip == policy.insured_zip)
                      + 15 * (deceased_ssn_last4 present AND policy.insured_ssn_last4 present
                              AND deceased_ssn_last4 == policy.insured_ssn_last4)   # unreachable when ssn both present; kept for spec symmetry
      band: score >= 85 -> auto CONFIRMED; 60..84 -> PENDING_REVIEW; < 60 -> auto FALSE_POSITIVE
      (equality is exact-string comparison on stored fields)
    input_set: "the new DeathMasterMatch and its policy"
    constants:
      W_NAME: 45
      W_DOB: 25
      W_ZIP: 15
      W_SSN4: 15
      AUTO_CONFIRM: 85
      MANUAL_REVIEW_FLOOR: 60
    precision: "integer score"

  - name: raa_provisional_yield
    trigger: "every GET of a RetainedAssetAccount (recomputed on read)"
    algorithm: aggregation
    formula: |
      days_open = (logical_now_date - date(created_at)).days
      provisional_interest_cents = round_half_up(balance_cents * statute.raa_annual_interest_rate_bp / 10000 * days_open / 365)
    input_set: "the account; statute resolved via its claim.state_code"
    constants:
      DAYS_PER_YEAR: 365
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional_simple
        when: "read-time statement estimate"
        difference: "simple interest on current balance for actual days open"
      - name: final_compound
        when: "closure or escheatment (raa_final_yield)"
        difference: "monthly-compounded yield over complete calendar months on closing balance; provisional and final diverge for identical balances"

  - name: raa_final_yield
    trigger: "RetainedAssetAccount closure (balance hits 0 via withdrawal) or escheatment"
    algorithm: aggregation
    formula: |
      months = complete calendar months between date(created_at) and closing/escheat date
             (a month completes on the same day-of-month as creation; residual days earn nothing)
      interest_paid_cents = round_half_up(balance_cents_at_close * ((1 + raa_rate_bp/10000/12)^months - 1))
    input_set: "the account being closed/escheated"
    constants:
      COMPOUNDS_PER_YEAR: 12
    precision: "integer cents, round_half_up"

  - name: escheat_schedule
    trigger: "EscheatmentCase creation"
    algorithm: threshold
    formula: |
      escheat_due_date = trigger_date + statute.dormancy_years calendar years
      due_diligence_start_date = escheat_due_date - 120 days
    input_set: "the new case"
    constants:
      DUE_DILIGENCE_LEAD_DAYS: 120
      ELECTION_WINDOW_DAYS: 30   # also governs PayoutElection create/confirm window from claim.approved_at
    precision: "date granularity"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role recognized"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per §1.5 roles"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Request body shape: required fields present, enums in domain, integers positive where required (face_amount_cents > 0, amount_cents > 0, share_percent in (0,100] with <= 2 decimals)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all mutating endpoints
  - priority: 4
    category: existence
    check: "Path and body resource ids exist, validated left-to-right (policy -> claim -> document/beneficiary-claim; designation; election; account; match; case)"
    error_id: ERR_POLICY_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_DOCUMENT_NOT_FOUND | ERR_DESIGNATION_NOT_FOUND | ERR_BENEFICIARY_CLAIM_NOT_FOUND | ERR_ELECTION_NOT_FOUND | ERR_ACCOUNT_NOT_FOUND | ERR_MATCH_NOT_FOUND | ERR_CASE_NOT_FOUND
    http_status: 404
    applies_to: all endpoints with resource ids
  - priority: 5
    category: state
    check: "OCC: expected_claim_version == current Claim.version (elections); expected_policy_version == current Policy.version (designation create)"
    error_id: ERR_STALE_CLAIM_VERSION | ERR_STALE_POLICY_VERSION
    http_status: 412
    applies_to: "POST /beneficiary-claims/{id}/elections; POST /policies/{id}/beneficiary-designations"
  - priority: 6
    category: state
    check: "Target resource in a valid from-state for the transition (per-resource 409s; ERR_CLAIM_IN_LEGAL_HOLD takes precedence over generic review-state errors when claim is LEGAL_HOLD)"
    error_id: ERR_POLICY_NOT_ACTIVE | ERR_CLAIM_NOT_REVIEWABLE | ERR_CLAIM_NOT_UNDER_REVIEW | ERR_CLAIM_NOT_IN_CONTESTABILITY_REVIEW | ERR_CLAIM_IN_LEGAL_HOLD | ERR_CLAIM_NOT_IN_LEGAL_HOLD | ERR_CLAIM_NOT_APPROVED | ERR_CLAIM_NOT_FILEABLE | ERR_DOCUMENT_ALREADY_REVIEWED | ERR_BENEFICIARY_CLAIM_INVALID_STATE | ERR_BENEFICIARY_CLAIM_NOT_PAYABLE | ERR_ELECTION_NOT_CONFIRMABLE | ERR_ACCOUNT_NOT_WITHDRAWABLE | ERR_CASE_NOT_ACTIONABLE | ERR_MATCH_NOT_PENDING_REVIEW | ERR_DESIGNATION_ALREADY_REVOKED
    http_status: 409
    applies_to: state-transition endpoints
  - priority: 7
    category: business_safety
    check: "Segregation of duties: claim approve/deny/rescind X-User-ID != claim.assigned_examiner_id; document review X-User-ID != document.uploaded_by_id"
    error_id: ERR_SEGREGATION_OF_DUTIES_VIOLATION
    http_status: 403
    applies_to: "POST /claims/{id}/approve, /deny, /rescind; POST /claims/{id}/documents/{docId}/review"
  - priority: 8
    category: business_safety
    check: "Required proof-of-death set fully VERIFIED before approve (CERTIFIED_DEATH_CERTIFICATE; plus ATTENDING_PHYSICIAN_STATEMENT when contestability_flag)"
    error_id: ERR_REQUIRED_DOCS_INCOMPLETE
    http_status: 409
    applies_to: "POST /claims/{id}/approve"
  - priority: 9
    category: business_temporal
    check: "Temporal: date_of_death within [issue_date, logical today] (ERR_INVALID_DEATH_DATE); election create/confirm within approved_at + 30 days (ERR_ELECTION_WINDOW_CLOSED); escheat only on/after escheat_due_date (ERR_ESCHEATMENT_NOT_DUE); designation create/revoke blocked once any claim exists on the policy (ERR_DESIGNATION_FROZEN_AFTER_CLAIM)"
    error_id: ERR_INVALID_DEATH_DATE | ERR_ELECTION_WINDOW_CLOSED | ERR_ESCHEATMENT_NOT_DUE | ERR_DESIGNATION_FROZEN_AFTER_CLAIM
    http_status: 422
    applies_to: "POST /claims; election create/confirm; POST /escheatment-cases/{id}/escheat; designation create/revoke"
  - priority: 10
    category: business_constraint
    check: "Constraint: same-(policy,type,beneficiary_name) ACTIVE designation windows may not overlap — half-open [effective_date, date(revoked_at)), adjacency allowed (ERR_DESIGNATION_WINDOW_OVERLAP); sum of ACTIVE same-type shares per policy <= 100 (ERR_SHARE_TOTAL_EXCEEDED); second validation on an already-claimed designation (ERR_DESIGNATION_ALREADY_CLAIMED); aggregate validated share capacity <= 100 per claim (ERR_ALLOCATION_CAPACITY_EXCEEDED); duplicate statute state_code (ERR_STATUTE_ALREADY_EXISTS)"
    error_id: ERR_DESIGNATION_WINDOW_OVERLAP | ERR_SHARE_TOTAL_EXCEEDED | ERR_DESIGNATION_ALREADY_CLAIMED | ERR_ALLOCATION_CAPACITY_EXCEEDED | ERR_STATUTE_ALREADY_EXISTS
    http_status: 409
    applies_to: "designation create; beneficiary-claim validate; statute create"
  - priority: 11
    category: business_referential
    check: "Referential: statute configured for policy state at claim creation (ERR_STATUTE_NOT_CONFIGURED); designation belongs to claim's policy (ERR_DESIGNATION_POLICY_MISMATCH); designation ACTIVE on date_of_death (ERR_DESIGNATION_NOT_ACTIVE_AT_DEATH)"
    error_id: ERR_STATUTE_NOT_CONFIGURED | ERR_DESIGNATION_POLICY_MISMATCH | ERR_DESIGNATION_NOT_ACTIVE_AT_DEATH
    http_status: 422
    applies_to: "POST /claims; POST /claims/{id}/beneficiary-claims; POST /beneficiary-claims/{id}/validate"
  - priority: 12
    category: business_fiscal
    check: "Fiscal: RETAINED_ASSET_ACCOUNT election requires allocated_amount_cents >= statute.raa_minimum_cents (ERR_BELOW_RAA_MINIMUM); withdrawal amount_cents <= balance_cents (ERR_INSUFFICIENT_ACCOUNT_BALANCE); execute-payment requires at least one PAYABLE claim with CONFIRMED election (ERR_NO_PAYABLE_BENEFICIARIES)"
    error_id: ERR_BELOW_RAA_MINIMUM | ERR_INSUFFICIENT_ACCOUNT_BALANCE | ERR_NO_PAYABLE_BENEFICIARIES
    http_status: 422
    applies_to: "election create; POST /retained-asset-accounts/{id}/withdrawals; POST /claims/{id}/execute-payment"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- Test-driving / system ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server logical clock. Startup default is exactly 2026-08-01T00:00:00Z (never wall-clock). Setting the clock triggers the time-based sweep in order: (1) RAA OPEN->DORMANT dormancy flips (+ EscheatmentCase creation), (2) EscheatmentCase MONITORING->DUE_DILIGENCE progression."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["time-based sweep per description"]

  # --- StateStatute ---
  - method: POST
    path: "/state-statutes"
    description: "Configure a state's claims statute (one per state_code)"
    roles: [ComplianceOfficer]
    code: 201
    input: [state_code, annual_interest_rate_bp, interest_basis, grace_days, payment_deadline_days, dormancy_years, raa_minimum_cents, raa_annual_interest_rate_bp]
    output: StateStatute
    side_effects: ["ERR_STATUTE_ALREADY_EXISTS if state_code already configured"]
  - method: GET
    path: "/state-statutes"
    description: "List statutes"
    roles: [ClaimsExaminer, ClaimsApprover, PolicyAdministrator, LegalCounsel, ComplianceOfficer, SystemAdmin]
    code: 200
    input: ["state_code?", "limit?", "offset?"]
    output: "StateStatute[]"
    side_effects: []

  # --- Policy ---
  - method: POST
    path: "/policies"
    description: "Issue a policy"
    roles: [PolicyAdministrator]
    code: 201
    input: [policy_number, insured_name, insured_dob, "insured_ssn_last4?", "insured_zip?", state_code, face_amount_cents, issue_date, "contestability_months?"]
    output: Policy
    side_effects: ["status=ACTIVE", "contestability_months defaults to 24"]
  - method: GET
    path: "/policies"
    description: "List policies"
    roles: [ClaimsExaminer, ClaimsApprover, PolicyAdministrator, LegalCounsel, ComplianceOfficer, SystemAdmin]
    code: 200
    input: ["status?", "state_code?", "limit?", "offset?"]
    output: "Policy[]"
    side_effects: []
  - method: GET
    path: "/policies/{policyId}"
    description: "Get a policy"
    roles: [ClaimsExaminer, ClaimsApprover, PolicyAdministrator, LegalCounsel, ComplianceOfficer, SystemAdmin]
    code: 200
    input: []
    output: Policy
    side_effects: []
  - method: POST
    path: "/policies/{policyId}/lapse"
    description: "Lapse an active policy (lapse_date = logical clock date)"
    roles: [PolicyAdministrator]
    code: 200
    input: []
    output: Policy
    side_effects: ["status -> LAPSED", "increments Policy.version by 1"]

  # --- BeneficiaryDesignation ---
  - method: POST
    path: "/policies/{policyId}/beneficiary-designations"
    description: "Add a beneficiary designation (OCC-guarded on Policy.version; increments Policy.version)"
    roles: [PolicyAdministrator]
    code: 201
    input: [beneficiary_name, beneficiary_type, share_percent, effective_date, expected_policy_version]
    output: BeneficiaryDesignation
    side_effects:
      - "status=ACTIVE; window overlap + share-pool validations per §1.4 p10"
      - "increments Policy.version by 1"
  - method: GET
    path: "/policies/{id}/beneficiary-designations"
    description: "List designations of a policy (path id = Policy.id)"
    roles: [ClaimsExaminer, ClaimsApprover, PolicyAdministrator, LegalCounsel, ComplianceOfficer, SystemAdmin]
    code: 200
    input: ["status?", "beneficiary_type?", "limit?", "offset?"]
    output: "BeneficiaryDesignation[]"
    side_effects: []
  - method: POST
    path: "/beneficiary-designations/{designationId}/revoke"
    description: "Revoke a designation (revoked_at = logical clock; bumps Policy.version)"
    roles: [PolicyAdministrator]
    code: 200
    input: []
    output: BeneficiaryDesignation
    side_effects: ["status -> REVOKED", "increments Policy.version by 1"]

  # --- Claim ---
  - method: POST
    path: "/claims"
    description: "File a death claim (notification). assigned_examiner_id = X-User-ID; contestability_flag computed; statute must be configured for the policy's state."
    roles: [ClaimsExaminer]
    code: 201
    input: [policy_id, date_of_death, "cause_of_death?"]
    output: Claim
    side_effects: ["status=NOTIFIED", "notification_date = logical clock date", "contestability_flag computed", "face_amount_cents/state_code snapshotted from Policy"]
  - method: GET
    path: "/claims"
    description: "List claims (FK reverse lookup for Policy <- Claim)"
    roles: [ClaimsExaminer, ClaimsApprover, PolicyAdministrator, LegalCounsel, ComplianceOfficer, SystemAdmin]
    code: 200
    input: ["policy_id?", "status?", "limit?", "offset?"]
    output: "Claim[]"
    side_effects: []
  - method: GET
    path: "/claims/{claimId}"
    description: "Get a claim"
    roles: [ClaimsExaminer, ClaimsApprover, PolicyAdministrator, LegalCounsel, ComplianceOfficer, SystemAdmin]
    code: 200
    input: []
    output: Claim
    side_effects: []
  - method: POST
    path: "/claims/{claimId}/begin-review"
    description: "Route claim into review: CONTESTABILITY_REVIEW when contestability_flag else UNDER_REVIEW"
    roles: [ClaimsExaminer]
    code: 200
    input: []
    output: Claim
    side_effects: ["status fork per contestability_flag", "increments Claim.version by 1"]
  - method: POST
    path: "/claims/{claimId}/approve"
    description: "Approve claim; computes provisional interest and runs allocation waterfall"
    roles: [ClaimsApprover]
    code: 200
    input: []
    output: Claim
    side_effects: ["per Claim UNDER_REVIEW/CONTESTABILITY_REVIEW -> APPROVED transition (interest, allocation, possible EscheatmentCase)", "increments Claim.version by 1"]
  - method: POST
    path: "/claims/{claimId}/deny"
    description: "Deny claim"
    roles: [ClaimsApprover]
    code: 200
    input: [denial_reason]
    output: Claim
    side_effects: ["status -> DENIED; open BeneficiaryClaims -> REJECTED", "increments Claim.version by 1"]
  - method: POST
    path: "/claims/{claimId}/rescind"
    description: "Rescind policy from contestability review (material misrepresentation)"
    roles: [ClaimsApprover]
    code: 200
    input: [rescission_reason]
    output: Claim
    side_effects: ["status -> RESCINDED; open BeneficiaryClaims -> REJECTED", "increments Claim.version by 1"]
  - method: POST
    path: "/claims/{claimId}/refer-interpleader"
    description: "Refer competing claims to court via interpleader; interest accrual freezes at referral"
    roles: [LegalCounsel]
    code: 200
    input: [court_reference]
    output: Claim
    side_effects: ["status -> INTERPLEADED; DISPUTED BeneficiaryClaims -> INTERPLEADED; elections -> SUPERSEDED", "increments Claim.version by 1"]
  - method: POST
    path: "/claims/{claimId}/execute-payment"
    description: "Pay all PAYABLE BeneficiaryClaims holding a CONFIRMED election; recomputes final interest first; claim bubbles to PAID when fully distributed"
    roles: [ClaimsApprover]
    code: 200
    input: []
    output: Claim
    side_effects:
      - "final statutory_interest recompute as-of payment date; total_payable_cents refreshed; allocation re-run"
      - "per BeneficiaryClaim in created_at ASC: LUMP_SUM -> PAID; RETAINED_ASSET_ACCOUNT -> RetainedAssetAccount created OPEN + PAID"
      - "claim -> PAID when every PAYABLE is PAID and sum(paid) == total_payable_cents"
      - "increments Claim.version by 1"

  # --- DeathDocument ---
  - method: POST
    path: "/claims/{claimId}/documents"
    description: "Upload a proof-of-death document (uploaded_by_id = X-User-ID)"
    roles: [ClaimsExaminer]
    code: 201
    input: [doc_type]
    output: DeathDocument
    side_effects: ["review_result=PENDING"]
  - method: GET
    path: "/claims/{id}/documents"
    description: "List documents of a claim (FK reverse lookup; path id = Claim.id)"
    roles: [ClaimsExaminer, ClaimsApprover, PolicyAdministrator, LegalCounsel, ComplianceOfficer, SystemAdmin]
    code: 200
    input: ["review_result?", "doc_type?", "limit?", "offset?"]
    output: "DeathDocument[]"
    side_effects: []
  - method: POST
    path: "/claims/{claimId}/documents/{documentId}/review"
    description: "Verify or reject a document (reviewer must differ from uploader); recomputes claim.proof_complete_date"
    roles: [ClaimsExaminer]
    code: 200
    input: [review_result, "rejection_reason?"]
    output: DeathDocument
    side_effects: ["review_result -> VERIFIED/REJECTED", "Claim.proof_complete_date recomputed"]

  # --- BeneficiaryClaim ---
  - method: POST
    path: "/claims/{claimId}/beneficiary-claims"
    description: "File a beneficiary claim. State preconditions: claim must be non-terminal (else ERR_CLAIM_NOT_FILEABLE) and not LEGAL_HOLD (else ERR_CLAIM_IN_LEGAL_HOLD); designation_id, when supplied, must exist (ERR_DESIGNATION_NOT_FOUND). On success the filing itself is always accepted as SUBMITTED; if a rival BeneficiaryClaim on the same designation is VALIDATED/PAYABLE under a different claimant_name, the rival is cascaded to DISPUTED (then claim -> LEGAL_HOLD, elections -> SUSPENDED)."
    roles: [ClaimsExaminer]
    code: 201
    input: ["designation_id?", claimant_name, claimant_type]
    output: BeneficiaryClaim
    side_effects: ["status=SUBMITTED", "rival-dispute cascade when applicable"]
  - method: GET
    path: "/claims/{claimId}/beneficiary-claims"
    description: "List beneficiary claims of a claim (FK reverse lookup), ordered by created_at ASC"
    roles: [ClaimsExaminer, ClaimsApprover, PolicyAdministrator, LegalCounsel, ComplianceOfficer, SystemAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "BeneficiaryClaim[]"
    side_effects: []
  - method: GET
    path: "/beneficiary-claims"
    description: "List beneficiary claims across claims (FK reverse lookup for BeneficiaryDesignation <- BeneficiaryClaim)"
    roles: [ClaimsExaminer, ClaimsApprover, PolicyAdministrator, LegalCounsel, ComplianceOfficer, SystemAdmin]
    code: 200
    input: ["claim_id?", "designation_id?", "status?", "limit?", "offset?"]
    output: "BeneficiaryClaim[]"
    side_effects: []
  - method: GET
    path: "/beneficiary-claims/{beneficiaryClaimId}"
    description: "Get a beneficiary claim"
    roles: [ClaimsExaminer, ClaimsApprover, PolicyAdministrator, LegalCounsel, ComplianceOfficer, SystemAdmin]
    code: 200
    input: []
    output: BeneficiaryClaim
    side_effects: []
  - method: POST
    path: "/beneficiary-claims/{beneficiaryClaimId}/validate"
    description: "Validate a SUBMITTED or DISPUTED beneficiary claim"
    roles: [ClaimsExaminer]
    code: 200
    input: []
    output: BeneficiaryClaim
    side_effects: ["status -> VALIDATED"]
  - method: POST
    path: "/beneficiary-claims/{beneficiaryClaimId}/reject"
    description: "Reject a beneficiary claim (may release LEGAL_HOLD)"
    roles: [ClaimsExaminer]
    code: 200
    input: [rejection_reason]
    output: BeneficiaryClaim
    side_effects: ["status -> REJECTED", "LEGAL_HOLD release check"]
  - method: POST
    path: "/beneficiary-claims/{beneficiaryClaimId}/withdraw"
    description: "Withdraw a SUBMITTED/DISPUTED beneficiary claim (may release LEGAL_HOLD)"
    roles: [ClaimsExaminer]
    code: 200
    input: []
    output: BeneficiaryClaim
    side_effects: ["status -> WITHDRAWN", "LEGAL_HOLD release check"]

  # --- PayoutElection ---
  - method: POST
    path: "/beneficiary-claims/{beneficiaryClaimId}/elections"
    description: "Record settlement-option election (OCC on Claim.version). Supersedes the beneficiary's prior ELECTED/CONFIRMED/SUSPENDED election. Requires BeneficiaryClaim PAYABLE; window = claim.approved_at + 30 days; RAA option requires allocated_amount_cents >= statute.raa_minimum_cents."
    roles: [ClaimsExaminer]
    code: 201
    input: [option, expected_claim_version]
    output: PayoutElection
    side_effects: ["status=ELECTED", "prior non-SUPERSEDED elections of this beneficiary claim -> SUPERSEDED", "increments Claim.version by 1"]
  - method: GET
    path: "/beneficiary-claims/{id}/elections"
    description: "List elections of a beneficiary claim (FK reverse lookup; path id = BeneficiaryClaim.id)"
    roles: [ClaimsExaminer, ClaimsApprover, PolicyAdministrator, LegalCounsel, ComplianceOfficer, SystemAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "PayoutElection[]"
    side_effects: []
  - method: POST
    path: "/payout-elections/{electionId}/confirm"
    description: "Confirm an ELECTED election within the election window"
    roles: [ClaimsExaminer]
    code: 200
    input: []
    output: PayoutElection
    side_effects: ["status -> CONFIRMED", "confirmed_at set"]

  # --- RetainedAssetAccount ---
  - method: GET
    path: "/retained-asset-accounts"
    description: "List retained asset accounts (FK reverse lookups for Claim and BeneficiaryClaim)"
    roles: [ClaimsExaminer, ClaimsApprover, PolicyAdministrator, LegalCounsel, ComplianceOfficer, SystemAdmin]
    code: 200
    input: ["claim_id?", "beneficiary_claim_id?", "status?", "limit?", "offset?"]
    output: "RetainedAssetAccount[]"
    side_effects: []
  - method: GET
    path: "/retained-asset-accounts/{accountId}"
    description: "Get an account; provisional_interest_cents (simple-yield estimate) recomputed on read"
    roles: [ClaimsExaminer, ClaimsApprover, PolicyAdministrator, LegalCounsel, ComplianceOfficer, SystemAdmin]
    code: 200
    input: []
    output: RetainedAssetAccount
    side_effects: []
  - method: POST
    path: "/retained-asset-accounts/{accountId}/withdrawals"
    description: "Draft against the account. DORMANT reactivates to OPEN (and its open EscheatmentCase auto-resolves). Balance reaching exactly 0 closes the account and posts final compound interest."
    roles: [ClaimsApprover]
    code: 200
    input: [amount_cents]
    output: RetainedAssetAccount
    side_effects: ["balance/withdrawn totals updated", "last_activity_at = now", "DORMANT -> OPEN reactivation + case auto-resolve", "CLOSED + interest_paid_cents when balance hits 0"]

  # --- DeathMasterMatch ---
  - method: POST
    path: "/policies/{policyId}/death-master-matches"
    description: "Submit a DMF record for matching; score computed; auto-CONFIRMED (>=85) creates a claim, auto-FALSE_POSITIVE (<60)"
    roles: [ComplianceOfficer]
    code: 201
    input: [deceased_name, deceased_dob, deceased_death_date, "deceased_ssn_last4?", "deceased_zip?"]
    output: DeathMasterMatch
    side_effects: ["match_score computed", "status per score band", "claim auto-created when CONFIRMED and no non-terminal claim exists"]
  - method: GET
    path: "/policies/{id}/death-master-matches"
    description: "List DMF matches of a policy (FK reverse lookup; path id = Policy.id)"
    roles: [ClaimsExaminer, ClaimsApprover, PolicyAdministrator, LegalCounsel, ComplianceOfficer, SystemAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "DeathMasterMatch[]"
    side_effects: []
  - method: POST
    path: "/death-master-matches/{matchId}/review"
    description: "Manually confirm or dismiss a PENDING_REVIEW match"
    roles: [ComplianceOfficer]
    code: 200
    input: [review_outcome]
    output: DeathMasterMatch
    side_effects: ["status -> CONFIRMED/FALSE_POSITIVE", "claim auto-created on CONFIRMED when eligible"]

  # --- EscheatmentCase ---
  - method: GET
    path: "/escheatment-cases"
    description: "List escheatment cases (FK reverse lookups for Claim and RetainedAssetAccount)"
    roles: [ClaimsExaminer, ClaimsApprover, PolicyAdministrator, LegalCounsel, ComplianceOfficer, SystemAdmin]
    code: 200
    input: ["claim_id?", "account_id?", "status?", "subject_type?", "limit?", "offset?"]
    output: "EscheatmentCase[]"
    side_effects: []
  - method: GET
    path: "/escheatment-cases/{caseId}"
    description: "Get an escheatment case"
    roles: [ClaimsExaminer, ClaimsApprover, PolicyAdministrator, LegalCounsel, ComplianceOfficer, SystemAdmin]
    code: 200
    input: []
    output: EscheatmentCase
    side_effects: []
  - method: POST
    path: "/escheatment-cases/{caseId}/resolve"
    description: "Resolve a case (owner located / owner activity); RAA subject reactivates to OPEN"
    roles: [ComplianceOfficer]
    code: 200
    input: ["resolution_note?"]
    output: EscheatmentCase
    side_effects: ["status -> RESOLVED", "RAA subject: DORMANT -> OPEN"]
  - method: POST
    path: "/escheatment-cases/{caseId}/escheat"
    description: "Remit unclaimed proceeds to the state; allowed from DUE_DILIGENCE on/after escheat_due_date"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: EscheatmentCase
    side_effects: ["status -> ESCHEATED", "CLAIM_PROCEEDS: claim -> ESCHEATED cascade", "RETAINED_ASSET_ACCOUNT: account -> ESCHEATED with final interest"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/unrecognized" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum, or non-positive/overflowing numeric input" }
  - { id: ERR_POLICY_NOT_FOUND, http: 404, condition: "Policy id does not exist" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "Claim id does not exist" }
  - { id: ERR_DOCUMENT_NOT_FOUND, http: 404, condition: "DeathDocument id does not exist (within the claim)" }
  - { id: ERR_DESIGNATION_NOT_FOUND, http: 404, condition: "BeneficiaryDesignation id does not exist" }
  - { id: ERR_BENEFICIARY_CLAIM_NOT_FOUND, http: 404, condition: "BeneficiaryClaim id does not exist" }
  - { id: ERR_ELECTION_NOT_FOUND, http: 404, condition: "PayoutElection id does not exist" }
  - { id: ERR_ACCOUNT_NOT_FOUND, http: 404, condition: "RetainedAssetAccount id does not exist" }
  - { id: ERR_MATCH_NOT_FOUND, http: 404, condition: "DeathMasterMatch id does not exist" }
  - { id: ERR_CASE_NOT_FOUND, http: 404, condition: "EscheatmentCase id does not exist" }
  - { id: ERR_STALE_CLAIM_VERSION, http: 412, condition: "expected_claim_version != current Claim.version on election create" }
  - { id: ERR_STALE_POLICY_VERSION, http: 412, condition: "expected_policy_version != current Policy.version on designation create" }
  - { id: ERR_POLICY_NOT_ACTIVE, http: 409, condition: "Lapse/designation operation requires policy ACTIVE" }
  - { id: ERR_CLAIM_NOT_REVIEWABLE, http: 409, condition: "begin-review requires claim NOTIFIED" }
  - { id: ERR_CLAIM_NOT_UNDER_REVIEW, http: 409, condition: "approve/deny require UNDER_REVIEW or CONTESTABILITY_REVIEW" }
  - { id: ERR_CLAIM_NOT_IN_CONTESTABILITY_REVIEW, http: 409, condition: "rescind requires CONTESTABILITY_REVIEW" }
  - { id: ERR_CLAIM_IN_LEGAL_HOLD, http: 409, condition: "Operation blocked while claim is LEGAL_HOLD (approve, execute-payment, beneficiary filing/validation)" }
  - { id: ERR_CLAIM_NOT_IN_LEGAL_HOLD, http: 409, condition: "refer-interpleader requires LEGAL_HOLD" }
  - { id: ERR_CLAIM_NOT_APPROVED, http: 409, condition: "execute-payment/election requires claim APPROVED" }
  - { id: ERR_CLAIM_NOT_FILEABLE, http: 409, condition: "Beneficiary claim filing/validation requires a non-terminal claim" }
  - { id: ERR_DOCUMENT_ALREADY_REVIEWED, http: 409, condition: "Document already VERIFIED/REJECTED" }
  - { id: ERR_BENEFICIARY_CLAIM_INVALID_STATE, http: 409, condition: "validate/reject/withdraw from a non-allowed status" }
  - { id: ERR_BENEFICIARY_CLAIM_NOT_PAYABLE, http: 409, condition: "Election requires BeneficiaryClaim PAYABLE" }
  - { id: ERR_ELECTION_NOT_CONFIRMABLE, http: 409, condition: "confirm requires election ELECTED" }
  - { id: ERR_ACCOUNT_NOT_WITHDRAWABLE, http: 409, condition: "Withdrawal requires account OPEN or DORMANT" }
  - { id: ERR_CASE_NOT_ACTIONABLE, http: 409, condition: "resolve requires MONITORING/DUE_DILIGENCE; escheat requires DUE_DILIGENCE" }
  - { id: ERR_MATCH_NOT_PENDING_REVIEW, http: 409, condition: "Manual review requires match PENDING_REVIEW" }
  - { id: ERR_DESIGNATION_ALREADY_REVOKED, http: 409, condition: "revoke requires designation ACTIVE" }
  - { id: ERR_SEGREGATION_OF_DUTIES_VIOLATION, http: 403, condition: "Approver equals assigned examiner, or document reviewer equals uploader" }
  - { id: ERR_REQUIRED_DOCS_INCOMPLETE, http: 409, condition: "Approve requires full required-document set VERIFIED" }
  - { id: ERR_INVALID_DEATH_DATE, http: 422, condition: "date_of_death before policy issue_date or after the logical current date" }
  - { id: ERR_ELECTION_WINDOW_CLOSED, http: 409, condition: "Election create/confirm after claim.approved_at + 30 days" }
  - { id: ERR_ESCHEATMENT_NOT_DUE, http: 409, condition: "Escheat attempted before escheat_due_date" }
  - { id: ERR_DESIGNATION_FROZEN_AFTER_CLAIM, http: 409, condition: "Designation create/revoke after a claim exists on the policy" }
  - { id: ERR_DESIGNATION_WINDOW_OVERLAP, http: 409, condition: "Same-(policy,type,beneficiary_name) ACTIVE designation window overlap (half-open; adjacency allowed)" }
  - { id: ERR_SHARE_TOTAL_EXCEEDED, http: 422, condition: "Sum of ACTIVE same-type designation shares on a policy would exceed 100" }
  - { id: ERR_DESIGNATION_ALREADY_CLAIMED, http: 409, condition: "Another VALIDATED/PAYABLE beneficiary claim already holds this designation" }
  - { id: ERR_ALLOCATION_CAPACITY_EXCEEDED, http: 409, condition: "Aggregate share of VALIDATED/PAYABLE + candidate would exceed 100" }
  - { id: ERR_STATUTE_ALREADY_EXISTS, http: 409, condition: "Statute already configured for state_code" }
  - { id: ERR_STATUTE_NOT_CONFIGURED, http: 422, condition: "No StateStatute for the policy's state_code at claim creation" }
  - { id: ERR_DESIGNATION_POLICY_MISMATCH, http: 422, condition: "designation_id belongs to a different policy than the claim" }
  - { id: ERR_DESIGNATION_NOT_ACTIVE_AT_DEATH, http: 422, condition: "Designation was not ACTIVE on claim.date_of_death" }
  - { id: ERR_BELOW_RAA_MINIMUM, http: 422, condition: "RETAINED_ASSET_ACCOUNT election below statute.raa_minimum_cents" }
  - { id: ERR_INSUFFICIENT_ACCOUNT_BALANCE, http: 422, condition: "Withdrawal amount exceeds account balance" }
  - { id: ERR_NO_PAYABLE_BENEFICIARIES, http: 422, condition: "execute-payment found no PAYABLE beneficiary claim with a CONFIRMED election" }

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: ClaimsExaminer
    description: "Claims intake and review: files claims, uploads/reviews proof-of-death documents, files and validates beneficiary claims, records settlement elections"
    identity: opaque
    exclusive_operations:
      - "POST /claims"
      - "POST /claims/{claimId}/begin-review"
      - "POST /claims/{claimId}/documents"
      - "POST /claims/{claimId}/documents/{documentId}/review"
      - "POST /claims/{claimId}/beneficiary-claims"
      - "POST /beneficiary-claims/{beneficiaryClaimId}/validate"
      - "POST /beneficiary-claims/{beneficiaryClaimId}/reject"
      - "POST /beneficiary-claims/{beneficiaryClaimId}/withdraw"
      - "POST /beneficiary-claims/{beneficiaryClaimId}/elections"
      - "POST /payout-elections/{electionId}/confirm"
    shared_operations: ["all GET endpoints"]
  - name: ClaimsApprover
    description: "Claim decision authority: approves/denies/rescinds, executes payment, authorizes retained-asset withdrawals. Segregation of duties: must not be the assigned examiner of the claim (X-User-ID comparison)."
    identity: opaque
    exclusive_operations:
      - "POST /claims/{claimId}/approve"
      - "POST /claims/{claimId}/deny"
      - "POST /claims/{claimId}/rescind"
      - "POST /claims/{claimId}/execute-payment"
      - "POST /retained-asset-accounts/{accountId}/withdrawals"
    shared_operations: ["all GET endpoints"]
  - name: PolicyAdministrator
    description: "Policy and beneficiary-designation administration"
    identity: opaque
    exclusive_operations:
      - "POST /policies"
      - "POST /policies/{policyId}/lapse"
      - "POST /policies/{policyId}/beneficiary-designations"
      - "POST /beneficiary-designations/{designationId}/revoke"
    shared_operations: ["all GET endpoints"]
  - name: LegalCounsel
    description: "Legal escalation: interpleader referral for competing claims"
    identity: opaque
    exclusive_operations:
      - "POST /claims/{claimId}/refer-interpleader"
    shared_operations: ["all GET endpoints"]
  - name: ComplianceOfficer
    description: "Regulatory operations: statute configuration, death-master-file matching, escheatment"
    identity: opaque
    exclusive_operations:
      - "POST /state-statutes"
      - "POST /policies/{policyId}/death-master-matches"
      - "POST /death-master-matches/{matchId}/review"
      - "POST /escheatment-cases/{caseId}/resolve"
      - "POST /escheatment-cases/{caseId}/escheat"
    shared_operations: ["all GET endpoints"]
  - name: SystemAdmin
    description: "Test-driving operations: logical clock control"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]
