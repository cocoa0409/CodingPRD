            - {call: "POST /water-bank-accounts", payload: {claimant_id: "${cl_a}", basin_code: "SNK"}, as: WaterRightsAnalyst, captures: {acc: "$.data.id"}}
            - {call: "GET /water-bank-accounts/${acc}", as: WaterRightsAnalyst, captures: {acc_v0: "$.data.version"}}
            - {call: "POST /water-bank-accounts/${acc}/deposits", payload: {water_right_id: "${wr}", deposit_af: 10.00, expected_water_bank_account_version: "${acc_v0}"}, as: WaterRightsAnalyst}
            - {call: "POST /lease-assignments", payload: {water_bank_account_id: "${acc}", water_right_id: "${wr}", point_of_diversion_id: "${pod}", lessee_name: "Ridge Farms LLC", lease_start_date: "2026-06-15T00:00:00Z", lease_end_date: "2026-08-15T00:00:00Z", requested_af: 10.00, diversion_rate_cfs: 2.000, rental_rate_usd_per_af: 30.00, valuation_method: PRO_RATA_DAILY}, as: WaterRightsAnalyst, captures: {ls: "$.data.id"}}
