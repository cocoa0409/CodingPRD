          assert:
            - "the response status is 409 and error_id == ERR_ROFR_WINDOW_OVERLAP"
            - "ExitEvent.${exit1_id}.status == ROFR_WINDOW"
            - "ExitEvent.${exit2_id}.status == OPTION_NOTICE_ISSUED"

      - name: coverage_window_overlap_rejects_a_second_guarantee_of_the_same_type
        claim_type: Violation to Error
        grounds:
          - errors[ERR_COVERAGE_WINDOW_OVERLAP]
          - validations[priority=8]
          - entities.Guarantee.fields.coverage_start_date
        distinguishing_aspect: "Guarantee coverage intervals of the same project and type may not overlap, so a second RECAPTURE guarantee whose window intersects the first is rejected with ERR_COVERAGE_WINDOW_OVERLAP."
        test_recipe:
          setup:
            - "Project Riverside Commons already carries a RECAPTURE guarantee covering 2027-01-01 through 2032-01-01."
          setup_api_calls:
            - *c_clock
            - *c_dev
            - *c_inv
            - *c_fund
            - *c_proj_a
            - call: "POST /projects/${proj_a_id}/guarantees"
              payload: { guarantee_type: "RECAPTURE", guaranteed_amount_cents: 90000000, recapture_pct: 0.125, coverage_start_date: "2027-01-01T00:00:00Z", coverage_end_date: "2032-01-01T00:00:00Z" }
              as: AssetManager
              captures: { guar_id: $.data.id }
          trigger:
            - call: "POST /projects/${proj_a_id}/guarantees"
              payload: { guarantee_type: "RECAPTURE", guaranteed_amount_cents: 50000000, recapture_pct: 0.125, coverage_start_date: "2031-12-31T00:00:00Z", coverage_end_date: "2033-01-01T00:00:00Z" }
              as: AssetManager
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_COVERAGE_WINDOW_OVERLAP"
            - "GET /projects/${proj_a_id}/guarantees returns exactly 1 row"
            - "Guarantee.${guar_id}.remaining_capacity_cents == 90000000"
            - "Developer.${dev_id}.guarantee_exposure_cents == 90000000"

      - name: overdrawn_guarantee_is_clamped_not_rejected
        claim_type: Satisfaction to Pass
        grounds:
          - state_machines.Guarantee.transitions.ACTIVE_to_DRAWN
          - entities.Guarantee.fields.remaining_capacity_cents
          - entities.Guarantee.fields.guaranteed_amount_cents
        distinguishing_aspect: "A draw larger than the remaining capacity is clamped to the capacity rather than rejected, so a 200000000 request against 90000000 of capacity leaves drawn_amount_cents at exactly 90000000."
        test_recipe:
          setup:
            - "Project Riverside Commons carries an ACTIVE COMPLETION guarantee of 90000000 cents with one ESCALATED review."
          setup_api_calls:
            - *c_clock
            - *c_dev
            - *c_inv
            - *c_fund
            - *c_proj_a
            - call: "POST /projects/${proj_a_id}/guarantees"
              payload: { guarantee_type: "COMPLETION", guaranteed_amount_cents: 90000000, recapture_pct: 0.0, coverage_start_date: "2026-09-01T00:00:00Z", coverage_end_date: "2031-09-01T00:00:00Z" }
              as: AssetManager
              captures: { guar_id: $.data.id }
            - call: "POST /projects/${proj_a_id}/reviews"
              payload: { review_period_index: 1, review_period_end: "2026-06-30T00:00:00Z", occupancy_pct: 0.78, dscr_observed: 0.95, reserve_balance_cents: 30000000 }
              as: ComplianceOfficer
              captures: { review_id: $.data.id }
            - call: "POST /reviews/${review_id}/resolve"
              payload: { outcome: "ESCALATED" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /guarantees/${guar_id}/draw"
              payload: { requested_amount_cents: 200000000 }
              as: AssetManager
              captures: { drawn: $.data.drawn_amount_cents }
          assert:
            - "the response status is 200"
            - "Guarantee.${guar_id}.drawn_amount_cents == 90000000"
            - "Guarantee.${guar_id}.remaining_capacity_cents == 0"
            - "Guarantee.${guar_id}.status == DRAWN"

      - &x_shortfall_review
        name: review_period_open_blocks_a_noncompliant_finding
        claim_type: Violation to Error
        grounds:
          - errors[ERR_REVIEW_PERIOD_OPEN]
          - validations[priority=10]
          - state_machines.PortfolioReview.transitions.ESCALATED_to_NONCOMPLIANT
        distinguishing_aspect: "A NONCOMPLIANT finding recorded before the reviewed period closes is rejected with ERR_REVIEW_PERIOD_OPEN even though the review is already ESCALATED, which shows the temporal rule is not shadowed by the state rule."
        test_recipe:
          setup:
            - "Project Riverside Commons carries an ESCALATED review whose period ends 2027-06-30."
            - "The logical clock is 2026-09-02T00:00:00Z, well before that period end."
          setup_api_calls:
            - *c_clock
            - *c_dev
            - *c_inv
            - *c_fund
            - *c_proj_a
            - call: "POST /projects/${proj_a_id}/reviews"
              payload: { review_period_index: 1, review_period_end: "2027-06-30T00:00:00Z", occupancy_pct: 0.78, dscr_observed: 0.95, reserve_balance_cents: 30000000 }
              as: ComplianceOfficer
              captures: { review_id: $.data.id }
            - call: "POST /reviews/${review_id}/resolve"
              payload: { outcome: "ESCALATED" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /reviews/${review_id}/resolve"
              payload: { outcome: "NONCOMPLIANT" }
              as: ComplianceOfficer
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_REVIEW_PERIOD_OPEN"
            - "PortfolioReview.${review_id}.status == ESCALATED"
            - "Project.${proj_a_id}.compliance_failure_count == 0"

      - name: duplicate_subscription_on_the_same_fund_and_investor_is_rejected
        claim_type: Violation to Error
        grounds:
          - errors[ERR_DUPLICATE_SUBSCRIPTION]
          - validations[priority=8]
          - entities.FundSubscription.fields.fund_id
        distinguishing_aspect: "Only one non-DEFAULTED subscription may exist per fund and investor pair, so a second subscription for the same pair is rejected with ERR_DUPLICATE_SUBSCRIPTION."
        test_recipe:
          setup:
            - "Investor Meridian Capital Group holds a 460000000-cent subscription in fund ECP Housing Fund IV."
          setup_api_calls:
            - *c_clock
            - *c_dev
            - *c_inv
            - *c_fund
            - call: "POST /funds/${fund_id}/subscriptions"
              payload: { investor_id: "${inv_id}", committed_cents: 460000000, payin_schedule: [{ milestone: "CONSTRUCTION_START", share_pct: 1.0 }], expected_fund_version: "${fund_v}" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /funds/${fund_id}/subscriptions"
              payload: { investor_id: "${inv_id}", committed_cents: 10000000, payin_schedule: [{ milestone: "CONSTRUCTION_START", share_pct: 1.0 }], expected_fund_version: "${fund_v}" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_DUPLICATE_SUBSCRIPTION"
            - "SyndicationFund.${fund_id}.subscription_count == 1"
            - "SyndicationFund.${fund_id}.subscribed_equity_cents == 460000000"

      - name: payin_above_the_committed_amount_returns_overpayment
        claim_type: Violation to Error
        grounds:
          - errors[ERR_OVERPAYMENT]
          - validations[priority=9]
          - state_machines.FundSubscription.transitions.PLEDGED_to_SUBSCRIBED
        distinguishing_aspect: "A pay-in that would push paid_in_cents above committed_cents is rejected with ERR_OVERPAYMENT, so paying 500000000 against a 460000000 commitment leaves paid_in_cents at 460000000 only when the earlier pay-ins already summed to it."
        test_recipe:
          setup:
            - "Fund ECP Housing Fund IV reaches CLOSING because its 460000000-cent subscription clears 0.85 of the 500000000 target."
            - "Northline Mutual's 100000000-cent subscription in the same fund has paid_in_cents 0."
          setup_api_calls:
            - *c_clock
            - *c_dev
            - *c_inv
            - *c_fund
            - call: "POST /funds/${fund_id}/subscriptions"
              payload: { investor_id: "${inv_id}", committed_cents: 460000000, payin_schedule: [{ milestone: "CONSTRUCTION_START", share_pct: 1.0 }], expected_fund_version: "${fund_v}" }
              as: Investor
              as_user_id: "${inv_id}"
            - call: "POST /investors"
              payload: { name: "Northline Mutual", investor_type: "INSURANCE", committed_capacity_cents: 500000000, risk_tier: "TIER_2" }
              as: PlatformAdmin
              captures: { inv_north_id: $.data.id }
            - call: "POST /funds/${fund_id}/subscriptions"
              payload: { investor_id: "${inv_north_id}", committed_cents: 100000000, payin_schedule: [{ milestone: "CONSTRUCTION_START", share_pct: 1.0 }], expected_fund_version: "${fund_v}" }
              as: Investor
              as_user_id: "${inv_north_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/payins"
              payload: { amount_cents: 60000000 }
              as: Investor
              as_user_id: "${inv_north_id}"
          trigger:
            - call: "POST /subscriptions/${sub_id}/payins"
              payload: { amount_cents: 50000000 }
              as: Investor
              as_user_id: "${inv_north_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_OVERPAYMENT"
            - "FundSubscription.${sub_id}.paid_in_cents == 60000000"
            - "FundSubscription.${sub_id}.status == PARTIALLY_FUNDED"
            - "FundSubscription.${sub_id}.unfunded_commitment_cents == 40000000"

      - name: credit_shortfall_waterfall_pins_tier_order_and_remainder_allocation
        claim_type: Violation to Error
        grounds:
          - calculations.credit_shortfall_waterfall
          - errors[ERR_DISTRIBUTION_EXCEEDS_DELIVERED]
          - entities.FundSubscription.fields.committed_cents
        distinguishing_aspect: "The waterfall distributes a payable amount in a pinned tier-then-created_at order and hands the rounding remainder out one cent at a time in that same order, so an odd-cent payable lands on the earliest subscription in the pinned order."
        test_recipe:
          setup:
            - "Fund ECP Housing Fund IV holds three subscriptions: Meridian 300000000 at TIER_3, Northline 150000000 at TIER_2 and Arbor 50000000 at TIER_1, all PLEDGED against a 600000000 target."
            - "The project's allocation has 830000000 awarded credit dollars and 830000001 delivered credit dollars recorded."
          setup_api_calls:
            - *c_clock
            - *c_dev
            - *c_inv
            - *c_fund
            - *c_proj_a
            - call: "POST /investors"
              payload: { name: "Northline Mutual", investor_type: "INSURANCE", committed_capacity_cents: 500000000, risk_tier: "TIER_2" }
              as: PlatformAdmin
              captures: { inv_north_id: $.data.id }
            - call: "POST /investors"
              payload: { name: "Arbor Pension Trust", investor_type: "PENSION", committed_capacity_cents: 500000000, risk_tier: "TIER_1" }
              as: PlatformAdmin
              captures: { inv_arbor_id: $.data.id }
            - call: "POST /funds/${fund_id}/subscriptions"
              payload: { investor_id: "${inv_id}", committed_cents: 300000000, payin_schedule: [{ milestone: "CONSTRUCTION_START", share_pct: 1.0 }], expected_fund_version: "${fund_v}" }
              as: Investor
              as_user_id: "${inv_id}"
            - call: "POST /funds/${fund_id}/subscriptions"
              payload: { investor_id: "${inv_north_id}", committed_cents: 150000000, payin_schedule: [{ milestone: "CONSTRUCTION_START", share_pct: 1.0 }], expected_fund_version: "${fund_v}" }
              as: Investor
              as_user_id: "${inv_north_id}"
            - call: "POST /funds/${fund_id}/subscriptions"
              payload: { investor_id: "${inv_arbor_id}", committed_cents: 50000000, payin_schedule: [{ milestone: "CONSTRUCTION_START", share_pct: 1.0 }], expected_fund_version: "${fund_v}" }
              as: Investor
              as_user_id: "${inv_arbor_id}"
            - call: "POST /projects/${proj_a_id}/allocations"
              payload: { action: "CREATE", state_agency: "Oregon Housing and Community Services", awarded_credit_dollars_cents: 830000000, commitment_fee_pct: 0.014, awarded_date: "2026-08-15T00:00:00Z", placed_in_service_deadline: "2028-12-31T00:00:00Z" }
              as: Underwriter
              captures: { alloc_id: $.data.id }
            - call: "PUT /projects/${proj_a_id}"
              payload: { underwriting_action: "FINALIZE", expected_project_version: "${proj_a_version}" }
              as: Underwriter
            - call: "POST /projects/${proj_a_id}/commit"
              payload: {}
              as: Underwriter
            - call: "POST /projects/${proj_a_id}/allocations"
              payload: { action: "RECORD_DELIVERY", allocation_id: "${alloc_id}", delivered_credit_dollars_cents: 830000001 }
              as: AssetManager
          trigger:
            - call: "POST /projects/${proj_a_id}/allocations"
              payload: { action: "DISTRIBUTE", allocation_id: "${alloc_id}" }
              as: AssetManager
              captures: { distributed: $.data.delivered_credit_dollars_cents }
          assert:
            - "the payable amount is clamped to the awarded 830000000, not the 830000001 delivered"
            - "the waterfall pays 498000000 to Meridian, 249000000 to Northline and 83000000 to Arbor, exactly summing to the payable 830000000 with no remainder"
            - "Allocation.${alloc_id}.delivered_credit_dollars_cents == 830000001"

  # ===========================================================================
  - section: rbac
    instances:

      - name: platform_admin_cannot_commit_a_project
        claim_type: Rbac exclusive operation denied
        grounds:
          - roles.PlatformAdmin
          - endpoints.POST_/projects/{project_id}/commit
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "Commit is an Underwriter-exclusive operation, so an otherwise-omnipotent PlatformAdmin is rejected with 403 ERR_FORBIDDEN and the project stays UNDERWRITING."
        test_recipe:
          setup:
            - "Project Riverside Commons is fully underwritten with one AWARDED allocation."
          setup_api_calls:
            - *c_clock
            - *c_dev
            - *c_inv
            - *c_fund
            - *c_proj_a
            - call: "POST /projects/${proj_a_id}/allocations"
              payload: { action: "CREATE", state_agency: "Oregon Housing and Community Services", awarded_credit_dollars_cents: 912345678, commitment_fee_pct: 0.014, awarded_date: "2026-08-15T00:00:00Z", placed_in_service_deadline: "2028-12-31T00:00:00Z" }
              as: Underwriter
            - call: "PUT /projects/${proj_a_id}"
              payload: { underwriting_action: "FINALIZE", expected_project_version: "${proj_a_version}" }
              as: Underwriter
          trigger:
            - call: "POST /projects/${proj_a_id}/commit"
              payload: {}
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_FORBIDDEN"
            - "Project.${proj_a_id}.status == UNDERWRITING"

      - name: asset_manager_cannot_finalize_underwriting
        claim_type: Rbac exclusive operation denied
        grounds:
          - roles.AssetManager
          - endpoints.PUT_/projects/{project_id}
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "PUT /projects is Underwriter-exclusive, so an AssetManager attempting FINALIZE is rejected with 403 ERR_FORBIDDEN and underwriting_stage stays PRELIMINARY."
        test_recipe:
          setup:
            - "Project Riverside Commons exists in UNDERWRITING with underwriting_stage PRELIMINARY."
          setup_api_calls:
            - *c_clock
            - *c_dev
            - *c_inv
            - *c_fund
            - *c_proj_a
          trigger:
            - call: "PUT /projects/${proj_a_id}"
              payload: { underwriting_action: "FINALIZE", expected_project_version: "${proj_a_version}" }
              as: AssetManager
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_FORBIDDEN"
            - "Project.${proj_a_id}.underwriting_stage == PRELIMINARY"
            - "Project.${proj_a_id}.final_equity_cents is null"

      - name: compliance_officer_cannot_draw_a_guarantee
        claim_type: Rbac exclusive operation denied
        grounds:
          - roles.ComplianceOfficer
          - endpoints.POST_/guarantees/{guarantee_id}/draw
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "Guarantee draws are AssetManager-exclusive, so a ComplianceOfficer is rejected with 403 ERR_FORBIDDEN even though the guarantee is drawable on the merits."
        test_recipe:
          setup:
            - "Project Riverside Commons carries an ACTIVE COMPLETION guarantee and one ESCALATED review, so the draw preconditions all hold."
          setup_api_calls:
            - *c_clock
            - *c_dev
            - *c_inv
            - *c_fund
            - *c_proj_a
            - call: "POST /projects/${proj_a_id}/guarantees"
              payload: { guarantee_type: "COMPLETION", guaranteed_amount_cents: 90000000, recapture_pct: 0.0, coverage_start_date: "2026-09-01T00:00:00Z", coverage_end_date: "2031-09-01T00:00:00Z" }
              as: AssetManager
              captures: { guar_id: $.data.id }
            - call: "POST /projects/${proj_a_id}/reviews"
              payload: { review_period_index: 1, review_period_end: "2026-06-30T00:00:00Z", occupancy_pct: 0.78, dscr_observed: 0.95, reserve_balance_cents: 30000000 }
              as: ComplianceOfficer
              captures: { review_id: $.data.id }
            - call: "POST /reviews/${review_id}/resolve"
              payload: { outcome: "ESCALATED" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /guarantees/${guar_id}/draw"
              payload: { requested_amount_cents: 10000000 }
              as: ComplianceOfficer
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_FORBIDDEN"
            - "Guarantee.${guar_id}.drawn_amount_cents == 0"
            - "Guarantee.${guar_id}.status == ACTIVE"

      - name: investor_cannot_pay_in_against_another_investors_subscription
        claim_type: Rbac exclusive operation denied
        grounds:
          - roles.Investor
          - validations[priority=5]
          - errors[ERR_FORBIDDEN_SCOPE]
        distinguishing_aspect: "An entity_backed Investor is scoped to its own subscriptions, so Meridian paying in against Northline's subscription is rejected with 403 ERR_FORBIDDEN_SCOPE rather than being allowed as a role-level permission."
        test_recipe:
          setup:
            - "Northline Mutual holds a 100000000-cent subscription in fund ECP Housing Fund IV; Meridian Capital Group is a separate investor."
          setup_api_calls:
            - *c_clock
            - *c_dev
            - *c_inv
            - *c_fund
            - call: "POST /investors"
              payload: { name: "Northline Mutual", investor_type: "INSURANCE", committed_capacity_cents: 500000000, risk_tier: "TIER_2" }
              as: PlatformAdmin
              captures: { inv_north_id: $.data.id }
            - call: "POST /funds/${fund_id}/subscriptions"
              payload: { investor_id: "${inv_north_id}", committed_cents: 100000000, payin_schedule: [{ milestone: "CONSTRUCTION_START", share_pct: 1.0 }], expected_fund_version: "${fund_v}" }
              as: Investor
              as_user_id: "${inv_north_id}"
              captures: { sub_north_id: $.data.id }
          trigger:
            - call: "POST /subscriptions/${sub_north_id}/payins"
              payload: { amount_cents: 10000000 }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_FORBIDDEN_SCOPE"
            - "FundSubscription.${sub_north_id}.paid_in_cents == 0"

      - name: anonymous_caller_is_rejected_by_requiring_the_role_header
        claim_type: Rbac exclusive operation denied
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
          - endpoints.GET_/projects
        distinguishing_aspect: "A request carrying no X-User-Role at all is rejected with 401 ERR_UNAUTHENTICATED before any existence or state check runs."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T00:00:00Z."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /projects"
              payload: {}
              as: Anonymous
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 401 and error_id == ERR_UNAUTHENTICATED"

      - name: developer_actor_reads_only_its_own_projects
        claim_type: Rbac exclusive operation denied
        grounds:
          - roles.Developer
          - validations[priority=5]
          - endpoints.GET_/projects
        distinguishing_aspect: "An entity_backed Developer's listing is filtered by X-User-ID, so it sees its own project and not another sponsor's project in the same fund."
        test_recipe:
          setup:
            - "Cedar Ridge Communities owns Riverside Commons; Riverstone Housing Group owns Uptown Yards under the same fund."
          setup_api_calls:
            - *c_clock
            - *c_dev
            - *c_inv
            - *c_fund
            - *c_proj_a
            - call: "POST /developers"
              payload: { name: "Riverstone Housing Group", developer_type: "FOR_PROFIT", sponsor_experience_months: 60, projects_completed: 3, net_worth_cents: 2000000000, liquid_assets_cents: 40000000 }
              as: PlatformAdmin
              captures: { dev_r_id: $.data.id }
            - call: "POST /projects"
              payload: { developer_id: "${dev_r_id}", fund_id: "${fund_id}", project_name: "Uptown Yards", state_code: "OR", total_credit_dollars_cents: 600000000, construction_budget_cents: 950000000, construction_loan_cents: 400000000, operating_pro_forma_noi_cents: 70000000, debt_service_cents: 55000000, market_study_absorption_score: 0.81, sponsor_experience_months: 60, placed_in_service_deadline: "2029-12-31T00:00:00Z", compliance_period_months: 180 }
              as: Underwriter
              captures: { proj_r_id: $.data.id }
          trigger:
            - call: "GET /projects"
              payload: {}
              as: Developer
              as_user_id: "${dev_id}"
          assert:
            - "the response status is 200 and response_type is array"
            - "the listing returns exactly 1 row"
            - "the single row is Project.${proj_a_id} and not Project.${proj_r_id}"
            - "total_count == 1"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:

      - name: stale_fund_version_on_subscription_create_returns_precondition_failed
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[fund-subscription-stale-fund]
          - errors[ERR_STALE_VERSION]
          - endpoints.POST_/funds/{fund_id}/subscriptions
        distinguishing_aspect: "A subscription create carrying a fund version that a prior successful subscription already advanced is rejected with 412 ERR_STALE_VERSION, and the fund's subscribed equity reflects only the winning create."
        test_recipe:
          setup:
            - "Fund ECP Housing Fund IV is FORMING at version 1 with 500000000 cents of capacity available to the investor."
          setup_api_calls:
            - *c_clock
            - *c_dev
            - *c_inv
            - *c_fund
          trigger:
            - call: "POST /funds/${fund_id}/subscriptions"
              payload: { investor_id: "${inv_id}", committed_cents: 200000000, payin_schedule: [{ milestone: "CONSTRUCTION_START", share_pct: 1.0 }], expected_fund_version: "${fund_v}" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { sub1_id: $.data.id }
            - call: "POST /funds/${fund_id}/subscriptions"
              payload: { investor_id: "${inv_id}", committed_cents: 200000000, payin_schedule: [{ milestone: "CONSTRUCTION_START", share_pct: 1.0 }], expected_fund_version: "${fund_v} - 0" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 412 and error_id == ERR_STALE_VERSION"
            - "SyndicationFund.${fund_id}.subscribed_equity_cents == 200000000"
            - "SyndicationFund.${fund_id}.subscription_count == 1"

      - name: stale_project_version_on_underwriting_edit_returns_precondition_failed
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[project-underwriting-stale-project]
          - errors[ERR_STALE_VERSION]
          - endpoints.PUT_/projects/{project_id}
        distinguishing_aspect: "A second underwriting edit carrying the version from before the first edit is rejected with 412 ERR_STALE_VERSION, leaving the first edit's preliminary equity figure intact."
        test_recipe:
          setup:
            - "Project Riverside Commons exists in UNDERWRITING at version 1."
          setup_api_calls:
            - *c_clock
            - *c_dev
            - *c_inv
            - *c_fund
            - *c_proj_a
          trigger:
            - call: "PUT /projects/${proj_a_id}"
              payload: { construction_loan_cents: 720000000, expected_project_version: "${proj_a_version}" }
              as: Underwriter
              captures: { after_first: $.data.version }
            - call: "PUT /projects/${proj_a_id}"
              payload: { construction_loan_cents: 800000000, expected_project_version: "${proj_a_version} - 0" }
              as: Underwriter
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 412 and error_id == ERR_STALE_VERSION"
            - "Project.${proj_a_id}.construction_loan_cents == 720000000"
            - "Project.${proj_a_id}.preliminary_equity_cents == 441600000"

      - name: stale_project_version_on_capital_call_create_returns_precondition_failed
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[capital-call-stale-project]
          - errors[ERR_STALE_VERSION]
          - endpoints.POST_/projects/{project_id}/capital-calls
        distinguishing_aspect: "A capital call create carrying a project version already advanced by a prior call create is rejected with 412 ERR_STALE_VERSION, so only one call lands."
        test_recipe:
          setup:
            - "Project Riverside Commons is UNDERWRITING at version 1."
          setup_api_calls:
            - *c_clock
            - *c_dev
            - *c_inv
            - *c_fund
            - *c_proj_a
          trigger:
            - call: "POST /projects/${proj_a_id}/capital-calls"
              payload: { milestone: "CONSTRUCTION_START", scheduled_date: "2026-10-01T00:00:00Z", due_date: "2026-10-31T00:00:00Z", milestone_share: 0.2, expected_project_version: "${proj_a_version}" }
              as: AssetManager
              captures: { call_id: $.data.id }
            - call: "POST /projects/${proj_a_id}/capital-calls"
              payload: { milestone: "CONSTRUCTION_50PCT", scheduled_date: "2026-11-15T00:00:00Z", due_date: "2026-12-15T00:00:00Z", milestone_share: 0.2, expected_project_version: "${proj_a_version} - 0" }
              as: AssetManager
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 412 and error_id == ERR_STALE_VERSION"
            - "GET /projects/${proj_a_id}/capital-calls returns exactly 1 row"
            - "CapitalCall.${call_id}.status == SCHEDULED"

      - name: derived_posture_field_recomputes_on_a_write_that_never_touches_the_fund
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.fund_posture
          - entities.SyndicationFund.fields.posture
          - state_machines.Project.transitions.COMMITTED_to_DISTRESSED
        distinguishing_aspect: "The fund's posture is a denormalized aggregate over its projects, so a project status change made through the project's own review endpoint must be visible on the fund without any fund write."
        test_recipe:
          setup:
            - "Fund ECP Housing Fund IV holds one COMMITTED project, Riverside Commons, carrying a PENDING review of period 1."
          setup_api_calls:
            - *c_clock
            - *c_dev
            - *c_inv
            - *c_fund
            - *c_proj_a
            - call: "POST /projects/${proj_a_id}/allocations"
              payload: { action: "CREATE", state_agency: "Oregon Housing and Community Services", awarded_credit_dollars_cents: 912345678, commitment_fee_pct: 0.014, awarded_date: "2026-08-15T00:00:00Z", placed_in_service_deadline: "2028-12-31T00:00:00Z" }
              as: Underwriter
            - call: "PUT /projects/${proj_a_id}"
              payload: { underwriting_action: "FINALIZE", expected_project_version: "${proj_a_version}" }
              as: Underwriter
            - call: "POST /projects/${proj_a_id}/commit"
              payload: {}
              as: Underwriter
            - call: "POST /projects/${proj_a_id}/reviews"
              payload: { review_period_index: 1, review_period_end: "2026-06-30T00:00:00Z", occupancy_pct: 0.78, dscr_observed: 0.95, reserve_balance_cents: 30000000 }
              as: ComplianceOfficer
              captures: { review_id: $.data.id }
          trigger:
            - call: "GET /funds/${fund_id}"
              payload: {}
              as: Underwriter
              captures: { posture_before: $.data.posture }
            - call: "POST /reviews/${review_id}/resolve"
              payload: { outcome: "ESCALATED" }
              as: ComplianceOfficer
          assert:
            - "SyndicationFund.${fund_id}.posture was OPEN before the resolve"
            - "Project.${proj_a_id}.status == DISTRESSED after the resolve"
            - "SyndicationFund.${fund_id}.posture == WATCH after the resolve, with no write to the fund"
            - "Developer.${dev_id}.status == WATCH after the resolve"

      - name: suspended_investor_is_blocked_from_further_subscriptions
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Investor.transitions.ACTIVE_to_SUSPENDED
          - errors[ERR_INVESTOR_SUSPENDED]
          - entities.Investor.fields.status
        distinguishing_aspect: "A defaulted subscription suspends its investor as a side effect, and that suspended status is what rejects a later subscription against a different fund."
        test_recipe:
          setup:
            - "Investor Meridian Capital Group holds a subscription that has not yet defaulted; fund ECP Housing Fund V is FORMING and open."
          setup_api_calls:
            - *c_clock
            - *c_dev
            - *c_inv
            - *c_fund
            - *c_proj_a
            - call: "POST /funds"
              payload: { fund_name: "ECP Housing Fund V", target_equity_cents: 400000000, price_per_credit_dollar: 0.9050, target_yield_pct: 0.065, close_threshold_pct: 0.85, subscription_open_date: "2026-09-01T00:00:00Z", subscription_close_date: "2027-06-30T00:00:00Z" }
              as: Underwriter
              captures: { fund5_id: $.data.id, fund5_v: $.data.version }
            - call: "POST /funds/${fund_id}/subscriptions"
              payload: { investor_id: "${inv_id}", committed_cents: 460000000, payin_schedule: [{ milestone: "CONSTRUCTION_START", share_pct: 1.0 }], expected_fund_version: "${fund_v}" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/payins"
              payload: { amount_cents: 100000000 }
              as: Investor
              as_user_id: "${inv_id}"
            - call: "POST /projects/${proj_a_id}/allocations"
              payload: { action: "CREATE", state_agency: "Oregon Housing and Community Services", awarded_credit_dollars_cents: 912345678, commitment_fee_pct: 0.014, awarded_date: "2026-08-15T00:00:00Z", placed_in_service_deadline: "2028-12-31T00:00:00Z" }
              as: Underwriter
            - call: "PUT /projects/${proj_a_id}"
              payload: { underwriting_action: "FINALIZE", expected_project_version: "${proj_a_version}" }
              as: Underwriter
            - call: "POST /projects/${proj_a_id}/commit"
              payload: {}
              as: Underwriter
              captures: { pc1: $.data.version }
            - call: "POST /projects/${proj_a_id}/capital-calls"
              payload: { milestone: "CONSTRUCTION_START", scheduled_date: "2026-10-01T00:00:00Z", due_date: "2026-10-31T00:00:00Z", milestone_share: 0.2, expected_project_version: "${pc1}" }
              as: AssetManager
              captures: { call_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /capital-calls/${call_id}/transitions"
              payload: { action: "ISSUE" }
              as: AssetManager
            - call: "POST /capital-calls/${call_id}/transitions"
              payload: { action: "SETTLE", funded_amount_cents: 1000000 }
              as: Investor
              as_user_id: "${inv_id}"
          trigger:
            - call: "POST /funds/${fund5_id}/subscriptions"
              payload: { investor_id: "${inv_id}", committed_cents: 50000000, payin_schedule: [{ milestone: "CONSTRUCTION_START", share_pct: 1.0 }], expected_fund_version: "${fund5_v}" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_INVESTOR_SUSPENDED"
            - "Investor.${inv_id}.status == SUSPENDED"
            - "SyndicationFund.${fund5_id}.subscribed_equity_cents == 0"

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: fund_read_after_subscription_write_shows_consistent_counters_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - entities.SyndicationFund.fields.subscribed_equity_cents
          - entities.SyndicationFund.fields.subscription_count
        distinguishing_aspect: "The model is immediate, so the counters returned on read reflect every prior write with no lag — one subscription of 200000000 is visible as both a count of 1 and a subscribed equity of 200000000 on the very next GET."
        test_recipe:
          setup:
            - "Fund ECP Housing Fund IV is FORMING with no subscriptions."
          setup_api_calls:
            - *c_clock
            - *c_dev
            - *c_inv
            - *c_fund
            - call: "POST /funds/${fund_id}/subscriptions"
              payload: { investor_id: "${inv_id}", committed_cents: 200000000, payin_schedule: [{ milestone: "CONSTRUCTION_START", share_pct: 1.0 }], expected_fund_version: "${fund_v}" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { sub_id: $.data.id }
          trigger:
            - call: "GET /funds/${fund_id}"
              payload: {}
              as: Underwriter
              captures: { count_now: $.data.subscription_count }
          assert:
            - "SyndicationFund.${fund_id}.subscription_count == 1"
            - "SyndicationFund.${fund_id}.subscribed_equity_cents == 200000000"
            - "SyndicationFund.${fund_id}.funded_equity_cents == 0"
            - "FundSubscription.${sub_id}.status == PLEDGED"
            - "FundSubscription.${sub_id}.executed_price_per_credit_dollar == 0.9123"

