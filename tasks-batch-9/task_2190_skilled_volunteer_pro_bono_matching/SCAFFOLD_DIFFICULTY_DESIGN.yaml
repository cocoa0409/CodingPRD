      - name: unexecuted_agreement_blocks_milestone_checkin_two_hops
        grounds:
          - state_machines.Milestone.SCHEDULED_to_HELD
          - state_machines.EngagementAgreement
          - validations.priority_23.ERR_INVALID_WORK_STATE
          - validations.priority_26.ERR_MILESTONE_NOT_SCHEDULED
        distinguishing_aspect: |
          The only instance whose target row is neither the Engagement nor a child of the
          request chain but a Milestone, and the only one with a two-hop dependency:
          Milestone -> Engagement -> EngagementAgreement. The Milestone's own state field
          is SCHEDULED, which is precisely what POST /milestones/{id}/hold requires, so
          priority 26 ERR_MILESTONE_NOT_SCHEDULED passes; the temporal gate also passes
          because the clock sits at exactly Milestone.due_at - CHECKIN_GRACE_HOURS (24)
          and the band floor is inclusive; reported_cumulative_hours 0.00 satisfies the
          >= 0 rule. The check-in is refused solely because the grandparent-side
          EngagementAgreement is still SENT, which left Engagement.work_status at
          NOT_STARTED, and the Milestone machine's SCHEDULED -> HELD transition demands
          IN_PROGRESS. Note that this milestone was legitimately CREATED on the
          NOT_STARTED engagement (POST /engagements/{id}/milestones is not on priority
          23's applies_to list), which is the trap: scheduling a check-in is allowed
          before work starts, holding one is not. A naive implementer either checks only
          Milestone.checkin_status and holds the check-in - silently approving TimeLogs
          on an engagement whose IP terms were never executed - or blocks the milestone
          create instead of the hold.
