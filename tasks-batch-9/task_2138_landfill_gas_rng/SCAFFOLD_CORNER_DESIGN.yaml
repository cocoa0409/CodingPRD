scaffold_corner_design:

  - section: entities
    instances:
      - name: site_creation_initialises_every_ledger_counter_to_zero
        claim_type: creation
        grounds: [entities.LandfillSite.fields.energy_produced_mmbtu, entities.LandfillSite.fields.rin_generated_total, entities.LandfillSite.fields.compliance_posture]
        distinguishing_aspect: "POST /sites returns 201 with all four energy buckets 0.0, all four RIN counters 0, royalty_payable_usd 0.0, compliance_posture COMPLIANT and version 1."
        test_recipe:
          setup: ["Empty database; logical clock left at its 2026-08-01T00:00:00Z default."]
          setup_api_calls:
            - call: "GET /sites?limit=10&offset=0"
              as: ProjectAdmin
          trigger:
            - call: "POST /sites"
              payload: { name: "Rolling Hills Landfill", state_code: "CA", host_royalty_pct: 0.12, royalty_variant: "GROSS_REVENUE_SHARE", permit_nmoc_limit_lb_per_hr: 3.5, royalty_floor_usd_per_mmbtu: 0.25, design_collection_efficiency_pct: 85.0 }
              as: ProjectAdmin
              captures: { site_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "LandfillSite.${site_id}.energy_produced_mmbtu == 0.0"
            - "LandfillSite.${site_id}.energy_injected_mmbtu == 0.0"
            - "LandfillSite.${site_id}.energy_flared_mmbtu == 0.0"
            - "LandfillSite.${site_id}.energy_vented_mmbtu == 0.0"
            - "LandfillSite.${site_id}.rin_generated_total == 0"
            - "LandfillSite.${site_id}.rin_available_count == 0"
            - "LandfillSite.${site_id}.royalty_payable_usd == 0.0"
            - "LandfillSite.${site_id}.collected_flow_scfm == 0.0"
            - "LandfillSite.${site_id}.collection_efficiency_pct == 0.0"
            - "LandfillSite.${site_id}.compliance_posture == COMPLIANT"
            - "LandfillSite.${site_id}.version == 1"

      - name: site_optional_fields_fall_back_to_declared_defaults
        claim_type: defaults
        grounds: [entities.LandfillSite.fields.royalty_floor_usd_per_mmbtu, entities.LandfillSite.fields.design_collection_efficiency_pct]
        distinguishing_aspect: "Omitting royalty_floor_usd_per_mmbtu and design_collection_efficiency_pct yields 0.25 and 85.0 respectively, not null and not 0."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "GET /sites?limit=10&offset=0"
              as: ProjectAdmin
          trigger:
            - call: "POST /sites"
              payload: { name: "Cedar Ridge Landfill", state_code: "TX", host_royalty_pct: 0.10, royalty_variant: "NETBACK_SHARE", permit_nmoc_limit_lb_per_hr: 4.0 }
              as: ProjectAdmin
              captures: { site_id: $.data.id }
          assert:
            - "LandfillSite.${site_id}.royalty_floor_usd_per_mmbtu == 0.25"
            - "LandfillSite.${site_id}.design_collection_efficiency_pct == 85.0"
            - "LandfillSite.${site_id}.royalty_variant == NETBACK_SHARE"

      - name: site_create_missing_required_host_royalty_pct_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=40]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Dropping the required host_royalty_pct from POST /sites returns 400 ERR_VALIDATION and creates nothing."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "GET /sites?limit=10&offset=0"
              as: ProjectAdmin
          trigger:
            - call: "POST /sites"
              payload: { name: "Broken Site", state_code: "CA", royalty_variant: "GROSS_REVENUE_SHARE", permit_nmoc_limit_lb_per_hr: 3.5 }
              as: ProjectAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 400"
            - "data.error_id == 'ERR_VALIDATION'"
            - "GET /sites?limit=10&offset=0 still returns total_count == 0"

      - name: site_create_with_invalid_enum_royalty_variant_is_rejected
        claim_type: type_constraints
        grounds: ["entities.LandfillSite.fields.royalty_variant", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "royalty_variant accepts only GROSS_REVENUE_SHARE or NETBACK_SHARE; the string 'BEST_DEAL' returns 400 ERR_VALIDATION."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "GET /sites?limit=10&offset=0"
              as: ProjectAdmin
          trigger:
            - call: "POST /sites"
              payload: { name: "Bad Enum Site", state_code: "CA", host_royalty_pct: 0.12, royalty_variant: "BEST_DEAL", permit_nmoc_limit_lb_per_hr: 3.5 }
              as: ProjectAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 400"
            - "data.error_id == 'ERR_VALIDATION'"

      - name: get_unknown_gas_well_returns_well_not_found
        claim_type: not_found
        grounds: ["validations[priority=30]", "errors[ERR_WELL_NOT_FOUND]"]
        distinguishing_aspect: "A syntactically valid but unknown UUID on GET /wells/{id} returns 404 ERR_WELL_NOT_FOUND, not 400 and not an empty object."
        test_recipe:
          setup: ["One LandfillSite exists; no GasWell has the probed id."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Rolling Hills Landfill", state_code: "CA", host_royalty_pct: 0.12, royalty_variant: "GROSS_REVENUE_SHARE", permit_nmoc_limit_lb_per_hr: 3.5 }
              as: ProjectAdmin
              captures: { site_id: $.data.id }
          trigger:
            - call: "GET /wells/00000000-0000-4000-8000-000000000000"
              as: WellfieldTechnician
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 404"
            - "data.error_id == 'ERR_WELL_NOT_FOUND'"

      - name: well_create_with_unknown_site_returns_site_not_found
        claim_type: parent_relationships
        grounds: ["validations[priority=50]", "errors[ERR_SITE_NOT_FOUND]", "entities.GasWell.fields.site_id"]
        distinguishing_aspect: "The flat topology validates the body foreign key: POST /wells with a site_id that resolves to nothing returns 404 ERR_SITE_NOT_FOUND."
        test_recipe:
          setup: ["Empty database except the logical clock."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectAdmin
          trigger:
            - call: "POST /wells"
              payload: { site_id: "00000000-0000-4000-8000-000000000000", well_code: "W-99", target_flow_scfm: 500.0 }
              as: ProjectAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 404"
            - "data.error_id == 'ERR_SITE_NOT_FOUND'"

      - name: duplicate_well_code_on_same_site_is_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=120]", "errors[ERR_WELL_CODE_DUPLICATE]", "entities.GasWell.fields.well_code"]
        distinguishing_aspect: "well_code W-01 is unique among non-DECOMMISSIONED wells of one site; the second create returns 409 ERR_WELL_CODE_DUPLICATE."
        test_recipe:
          setup: ["One LandfillSite with one GasWell W-01 in ONLINE."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectAdmin
            - call: "POST /sites"
              payload: { name: "Rolling Hills Landfill", state_code: "CA", host_royalty_pct: 0.12, royalty_variant: "GROSS_REVENUE_SHARE", permit_nmoc_limit_lb_per_hr: 3.5 }
              as: ProjectAdmin
              captures: { site_id: $.data.id }
            - call: "POST /wells"
              payload: { site_id: "${site_id}", well_code: "W-01", target_flow_scfm: 500.0 }
              as: ProjectAdmin
              captures: { w1_id: $.data.id }
          trigger:
            - call: "POST /wells"
              payload: { site_id: "${site_id}", well_code: "W-01", target_flow_scfm: 400.0 }
              as: ProjectAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 409"
            - "data.error_id == 'ERR_WELL_CODE_DUPLICATE'"
            - "GET /wells?site_id=${site_id}&limit=10&offset=0 returns total_count == 1"

      - name: well_current_flow_is_computed_and_starts_at_zero
        claim_type: computed_fields
        grounds: [entities.GasWell.fields.current_flow_scfm, entities.GasWell.fields.last_quality_class, entities.GasWell.fields.last_reading_at]
        distinguishing_aspect: "A freshly created GasWell reports operating_state ONLINE, current_flow_scfm 0.0, last_quality_class NONE and last_reading_at null; only a WellTuningReading can move them."
        test_recipe:
          setup: ["One LandfillSite."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectAdmin
            - call: "POST /sites"
              payload: { name: "Rolling Hills Landfill", state_code: "CA", host_royalty_pct: 0.12, royalty_variant: "GROSS_REVENUE_SHARE", permit_nmoc_limit_lb_per_hr: 3.5 }
              as: ProjectAdmin
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /wells"
              payload: { site_id: "${site_id}", well_code: "W-01", target_flow_scfm: 500.0 }
              as: ProjectAdmin
              captures: { w1_id: $.data.id }
          assert:
            - "GasWell.${w1_id}.operating_state == ONLINE"
            - "GasWell.${w1_id}.current_flow_scfm == 0.0"
            - "GasWell.${w1_id}.last_reading_flow_scfm == 0.0"
            - "GasWell.${w1_id}.last_quality_class == NONE"
            - "GasWell.${w1_id}.last_reading_at is null"
            - "GasWell.${w1_id}.consecutive_good_readings == 0"
            - "LandfillSite.${site_id}.collected_flow_scfm == 0.0"
            - "LandfillSite.${site_id}.collection_efficiency_pct == 0.0"

      - name: wells_list_is_filterable_and_paginated
        claim_type: listing
        grounds: [endpoints, entities.GasWell.fields.site_id]
        distinguishing_aspect: "GET /wells?site_id=...&limit=2&offset=1 over three wells returns exactly 2 rows with total_count 3 and has_more false."
        test_recipe:
          setup: ["One LandfillSite with three GasWells W-01, W-02, W-03, all ONLINE with no readings."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectAdmin
            - call: "POST /sites"
              payload: { name: "Rolling Hills Landfill", state_code: "CA", host_royalty_pct: 0.12, royalty_variant: "GROSS_REVENUE_SHARE", permit_nmoc_limit_lb_per_hr: 3.5 }
              as: ProjectAdmin
              captures: { site_id: $.data.id }
            - call: "POST /wells"
              payload: { site_id: "${site_id}", well_code: "W-01", target_flow_scfm: 500.0 }
              as: ProjectAdmin
              captures: { w1_id: $.data.id }
            - call: "POST /wells"
              payload: { site_id: "${site_id}", well_code: "W-02", target_flow_scfm: 500.0 }
              as: ProjectAdmin
              captures: { w2_id: $.data.id }
            - call: "POST /wells"
              payload: { site_id: "${site_id}", well_code: "W-03", target_flow_scfm: 500.0 }
              as: ProjectAdmin
              captures: { w3_id: $.data.id }
          trigger:
            - call: "GET /wells?site_id=${site_id}&limit=2&offset=1"
              as: WellfieldTechnician
          assert:
            - "response_type == 'array' and exactly 2 GasWell rows are returned"
            - "meta/pagination reports total_count == 3, limit == 2, offset == 1, has_more == false"

      - name: pagination_limit_above_maximum_returns_invalid_request
        claim_type: type_constraints
        grounds: ["validations[priority=45]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "limit is bounded to 1..100 inclusive; limit=101 on GET /wells returns 400 ERR_VALIDATION rather than silently clamping."
        test_recipe:
          setup: ["One LandfillSite with one GasWell."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Rolling Hills Landfill", state_code: "CA", host_royalty_pct: 0.12, royalty_variant: "GROSS_REVENUE_SHARE", permit_nmoc_limit_lb_per_hr: 3.5 }
              as: ProjectAdmin
              captures: { site_id: $.data.id }
            - call: "POST /wells"
              payload: { site_id: "${site_id}", well_code: "W-01", target_flow_scfm: 500.0 }
              as: ProjectAdmin
              captures: { w1_id: $.data.id }
          trigger:
            - call: "GET /wells?site_id=${site_id}&limit=101&offset=0"
              as: WellfieldTechnician
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 400"
            - "data.error_id == 'ERR_VALIDATION'"

      - name: condensate_haul_is_an_immutable_event_without_version
        claim_type: immutability
        grounds: [entities.CondensateHaul, entities.CondensateHaul.fields.gallons, entities.WorkOrder.fields.condensate_gallons_removed]
        distinguishing_aspect: "CondensateHaul is declared common_fields:false, so its response carries id and created_at but no version and no updated_at, and no endpoint mutates it once written."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T00:00:00Z."
            - "One LandfillSite, one GasWell W-01, and one WorkOrder whose window 2026-08-09T00:00:00Z to 2026-08-11T00:00:00Z contains the clock, moved to IN_PROGRESS."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectAdmin
            - call: "POST /sites"
              payload: { name: "Rolling Hills Landfill", state_code: "CA", host_royalty_pct: 0.12, royalty_variant: "GROSS_REVENUE_SHARE", permit_nmoc_limit_lb_per_hr: 3.5 }
              as: ProjectAdmin
              captures: { site_id: $.data.id }
            - call: "POST /wells"
              payload: { site_id: "${site_id}", well_code: "W-01", target_flow_scfm: 500.0 }
              as: ProjectAdmin
              captures: { w1_id: $.data.id }
            - call: "POST /work-orders"
              payload: { well_id: "${w1_id}", work_type: "SUMP_PUMP_SERVICE", window_start: "2026-08-09T00:00:00Z", window_end: "2026-08-11T00:00:00Z" }
              as: WellfieldTechnician
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/status"
              payload: { to_status: "IN_PROGRESS" }
              as: WellfieldTechnician
          trigger:
            - call: "POST /work-orders/${wo_id}/condensate-hauls"
              payload: { gallons: 250.5, disposal_manifest_no: "MAN-4471", hauled_at: "2026-08-10T03:00:00Z", is_hazardous: false }
              as: WellfieldTechnician
              captures: { haul_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "The CondensateHaul response body contains id and created_at and contains no version field and no updated_at field"
            - "CondensateHaul.${haul_id}.gallons == 250.5"
            - "CondensateHaul.${haul_id}.is_hazardous == false"
            - "GET /work-orders/${wo_id}/condensate-hauls?limit=10&offset=0 returns total_count == 1"
            - "WorkOrder.${wo_id}.condensate_gallons_removed == 250.5"

      - name: attribute_batch_basis_defaults_to_provisional_nominated
        claim_type: defaults
        grounds: [entities.AttributeBatch.fields.basis, entities.AttributeBatch.fields.eligibility_factor]
        excluded_because:
          difficulty_instance: rin_provisional_nominated_vs_settled_metered_basis
          rationale: "The §1.8 dual-variant instance creates the first AttributeBatch with basis omitted and asserts basis == PROVISIONAL_NOMINATED and eligibility_factor == 1.0."

  - section: state_machines
    instances:
      - name: cancel_completed_work_order_returns_invalid_transition
        claim_type: invalid_transition
        grounds: ["state_machines.WorkOrder.PLANNED_to_CANCELLED", "state_machines.WorkOrder.IN_PROGRESS_to_COMPLETED", "errors[ERR_INVALID_TRANSITION]"]
        distinguishing_aspect: "CANCELLED is only reachable from PLANNED; a COMPLETED work order rejects to_status CANCELLED with 409 ERR_INVALID_TRANSITION and its status stays COMPLETED."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T00:00:00Z."
            - "One LandfillSite, one GasWell W-01, one WorkOrder with window 2026-08-09T00:00:00Z to 2026-08-11T00:00:00Z driven PLANNED -> IN_PROGRESS -> COMPLETED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectAdmin
            - call: "POST /sites"
              payload: { name: "Rolling Hills Landfill", state_code: "CA", host_royalty_pct: 0.12, royalty_variant: "GROSS_REVENUE_SHARE", permit_nmoc_limit_lb_per_hr: 3.5 }
              as: ProjectAdmin
              captures: { site_id: $.data.id }
            - call: "POST /wells"
              payload: { site_id: "${site_id}", well_code: "W-01", target_flow_scfm: 500.0 }
              as: ProjectAdmin
              captures: { w1_id: $.data.id }
            - call: "POST /work-orders"
              payload: { well_id: "${w1_id}", work_type: "HEADER_DEWATERING", window_start: "2026-08-09T00:00:00Z", window_end: "2026-08-11T00:00:00Z" }
              as: WellfieldTechnician
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/status"
              payload: { to_status: "IN_PROGRESS" }
              as: WellfieldTechnician
            - call: "POST /work-orders/${wo_id}/status"
              payload: { to_status: "COMPLETED" }
              as: WellfieldTechnician
          trigger:
            - call: "POST /work-orders/${wo_id}/status"
              payload: { to_status: "CANCELLED" }
              as: WellfieldTechnician
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 409"
            - "data.error_id == 'ERR_INVALID_TRANSITION'"
            - "WorkOrder.${wo_id}.status == COMPLETED"
            - "WorkOrder.${wo_id}.actual_end_at == '2026-08-10T00:00:00.000Z'"

      - name: voided_injection_batch_is_terminal_and_rejects_reanalysis
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.InjectionBatch.DRAFT_to_VOIDED", "entities.InjectionBatch.fields.void_reason", "errors[ERR_INVALID_TRANSITION]"]
        distinguishing_aspect: "VOIDED is a declared terminal state; pushing a VOIDED batch back to PENDING_ANALYSIS returns 409 ERR_INVALID_TRANSITION and leaves status VOIDED."
        test_recipe:
          setup:
            - "One LandfillSite and one ProcessingPlant (still STARTUP), and one InjectionBatch created in DRAFT and then VOIDED with a reason."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectAdmin
            - call: "POST /sites"
              payload: { name: "Rolling Hills Landfill", state_code: "CA", host_royalty_pct: 0.12, royalty_variant: "GROSS_REVENUE_SHARE", permit_nmoc_limit_lb_per_hr: 3.5 }
              as: ProjectAdmin
              captures: { site_id: $.data.id }
            - call: "POST /plants"
              payload: { site_id: "${site_id}", plant_code: "P1", receipt_point_code: "RP-7", receipt_point_mdq_dth_per_day: 4800.0, min_feed_scfm: 900.0 }
              as: ProjectAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /injection-batches"
              payload: { plant_id: "${plant_id}", interval_start: "2026-08-10T02:00:00Z", interval_end: "2026-08-10T05:00:00Z", hourly_volumes_mscf: [115.0, 115.0, 115.0], methane_pct: 97.4, oxygen_pct: 0.1, co2_pct: 1.4 }
              as: PlantOperator
              captures: { b1_id: $.data.id }
            - call: "POST /injection-batches/${b1_id}/status"
              payload: { to_status: "VOIDED", void_reason: "Duplicate hour block entered by the operator" }
              as: PlantOperator
          trigger:
            - call: "POST /injection-batches/${b1_id}/status"
              payload: { to_status: "PENDING_ANALYSIS" }
              as: PlantOperator
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 409"
            - "data.error_id == 'ERR_INVALID_TRANSITION'"
            - "InjectionBatch.${b1_id}.status == VOIDED"
            - "InjectionBatch.${b1_id}.void_reason == 'Duplicate hour block entered by the operator'"
            - "LandfillSite.${site_id}.energy_produced_mmbtu == 0.0"

      - name: second_confirm_on_nomination_returns_invalid_transition
        claim_type: idempotency
        grounds: ["state_machines.PipelineNomination.DRAFT_to_CONFIRMED", "errors[ERR_INVALID_TRANSITION]"]
        distinguishing_aspect: "Confirming an already CONFIRMED nomination is not a no-op; the second call returns 409 ERR_INVALID_TRANSITION."
        test_recipe:
          setup:
            - "One LandfillSite, one ProcessingPlant, one ACTIVE OfftakeContract and one PipelineNomination already moved DRAFT -> CONFIRMED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ProjectAdmin
            - call: "POST /sites"
              payload: { name: "Rolling Hills Landfill", state_code: "CA", host_royalty_pct: 0.12, royalty_variant: "GROSS_REVENUE_SHARE", permit_nmoc_limit_lb_per_hr: 3.5 }
              as: ProjectAdmin
              captures: { site_id: $.data.id }
            - call: "POST /plants"
              payload: { site_id: "${site_id}", plant_code: "P1", receipt_point_code: "RP-7", receipt_point_mdq_dth_per_day: 4800.0, min_feed_scfm: 900.0 }
              as: ProjectAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /offtake-contracts"
              payload: { site_id: "${site_id}", counterparty_name: "Bluewater Energy", contract_mdq_dth_per_day: 3000.0, price_usd_per_dth: 5.25, term_start: "2026-08-01T00:00:00Z", term_end: "2027-08-01T00:00:00Z" }
              as: CommercialScheduler
              captures: { contract_id: $.data.id }
            - call: "POST /offtake-contracts/${contract_id}/status"
              payload: { to_status: "ACTIVE" }
              as: CommercialScheduler
              captures: { ctr_v1: $.data.version }
            - call: "POST /pipeline-nominations"
              payload: { contract_id: "${contract_id}", plant_id: "${plant_id}", gas_day_start: "2026-08-11T00:00:00Z", gas_day_end: "2026-08-12T00:00:00Z", nominated_dth: 2400.0, expected_contract_version: "${ctr_v1}" }
              as: CommercialScheduler
              captures: { nom_id: $.data.id }
            - call: "POST /pipeline-nominations/${nom_id}/status"
              payload: { to_status: "CONFIRMED" }
              as: CommercialScheduler
          trigger:
            - call: "POST /pipeline-nominations/${nom_id}/status"
              payload: { to_status: "CONFIRMED" }
              as: CommercialScheduler
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 409"
            - "data.error_id == 'ERR_INVALID_TRANSITION'"
            - "PipelineNomination.${nom_id}.status == CONFIRMED"

      - name: tuning_reading_on_locked_out_well_returns_well_in_lockout
        claim_type: precondition_enforcement
        grounds: ["state_machines.GasWell.ONLINE_to_MAINTENANCE_LOCKOUT", "validations[priority=80]", "errors[ERR_WELL_IN_LOCKOUT]"]
