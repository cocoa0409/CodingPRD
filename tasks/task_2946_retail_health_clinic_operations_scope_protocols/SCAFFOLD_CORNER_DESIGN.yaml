            - call: "POST /clinics"
              payload: { name: "CA Store 64", state_code: "CA", min_clinicians_required: 1, appointment_slots_per_hour: 2, walk_in_queue_capacity: 5 }
              as: ClinicAdmin
              captures: { c64_id: $.data.id }
            - call: "POST /physicians"
              payload: { full_name: "Dr Elder", licensed_state_codes: ["CA"], max_supervised_clinicians: 3 }
              as: ClinicAdmin
              captures: { p64_id: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "NP Elder", credential: "NP", license_state_code: "CA", home_clinic_id: "${c64_id}", supervising_physician_id: "${p64_id}" }
              as: ClinicAdmin
              captures: { cl64_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Tim Timeless", date_of_birth: "1991-01-01" }
              as: FrontDeskAgent
              captures: { tim_id: $.data.id }
          trigger:
            - call: "POST /staffing-assignments"
