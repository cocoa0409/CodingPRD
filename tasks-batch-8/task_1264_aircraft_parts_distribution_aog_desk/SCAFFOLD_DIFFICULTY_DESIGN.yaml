# =============================================================================
# Task 1264 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 19 instances across the nine Difficulty Rules. All fixtures replay from
# empty-DB; logical clock default is 2026-05-01T00:00:00Z unless set.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: core_penalty_provisional_vs_final
        grounds:
          - calculations.core_return_penalty
          - entities.Quote.fields.max_penalty_cents
          - entities.CoreReturn.fields.penalty_cents
          - state_machines.CoreReturn.OPEN_to_RECEIVED
        distinguishing_aspect: |
          Same core (core_value 500000, identical quote data): the PROVISIONAL
          quote-time disclosure is the worst-case forfeiture 500000 while the
          FINAL chronological accrual at 10 days overdue is 57500 — two valid
          algorithms, different numbers, entity domain = CoreReturn.
        test_recipe:
          setup:
            - "Customer C1 ACTIVE, credit_limit 100000000"
            - "PartMaster PN-EXCH rotable, list 250000, core_value 500000, hazmat NONE, EAR99"
            - "InventoryUnit SN-E1 OVERHAULED DUAL_RELEASE AVAILABLE"
            - "Clock at default 2026-05-01T00:00:00Z"
            - "AOG request + quote (EXCHANGE line qty 1, STANDARD freight 800km/4kg) ISSUED, then accepted, allocated, compliance-cleared, shipped, delivered at 2026-05-01 (core due 2026-05-22T00:00:00Z)"
          setup_api_calls:
            - { call: "POST /aog/customers", payload: { name: "Skyline Air", country_code: "US", credit_limit_cents: 100000000 }, as: FinanceController, captures: { cust_id: $.data.id } }
            - { call: "POST /aog/parts", payload: { part_number: "PN-EXCH", description: "Rotable valve", rotable: true, list_price_cents: 250000, core_value_cents: 500000, hazmat_class: "NONE", export_control_code: "EAR99", warranty_months: 24 }, as: WarehouseOperator, captures: { part_id: $.data.id } }
            - { call: "POST /aog/inventory-units", payload: { part_id: "${part_id}", serial_number: "SN-E1", condition: "OVERHAULED", trace_doc_level: "DUAL_RELEASE", warehouse_code: "WH-LAX" }, as: WarehouseOperator, captures: { unit_id: $.data.id } }
            - { call: "POST /aog/aog-requests", payload: { customer_id: "${cust_id}", aircraft_tail: "N100SL", airport_code: "LAX", part_id: "${part_id}", quantity: 1, condition_acceptable: ["OVERHAULED", "NEW"], min_trace_doc: "FAA_8130", needed_by_utc: "2026-06-01T00:00:00Z" }, as: AogDeskAgent, captures: { aog_id: $.data.id } }
            - { call: "POST /aog/aog-requests/${aog_id}/source-search", payload: {}, as: AogDeskAgent }
            - { call: "POST /aog/quotes", payload: { aog_request_id: "${aog_id}", customer_id: "${cust_id}", lines: [ { part_id: "${part_id}", quantity: 1, sale_type: "EXCHANGE", unit_price_cents: 250000, discount_pct: 0, condition_required: "OVERHAULED" } ], validity_hours: 24, freight_mode: "STANDARD", distance_km: 800, chargeable_weight_kg: 4, destination_country: "US" }, as: AogDeskAgent, captures: { quote_id: $.data.id, prov_penalty: $.data.max_penalty_cents } }
            - { call: "POST /aog/quotes/${quote_id}/issue", payload: {}, as: AogDeskAgent, captures: { q_ver: $.data.version } }
            - { call: "POST /aog/quotes/${quote_id}/accept", payload: { expected_quote_version: "${q_ver}" }, as: CustomerContact, as_user_id: "${cust_id}" }
            - { call: "GET /aog/orders", payload: { quote_id: "${quote_id}" }, as: AogDeskAgent, captures: { order_id: "$.data[0].id" } }
            - { call: "GET /aog/order-lines", payload: { order_id: "${order_id}" }, as: AogDeskAgent, captures: { line_id: "$.data[0].id" } }
            - { call: "POST /aog/order-lines/${line_id}/allocate", payload: { unit_id: "${unit_id}" }, as: WarehouseOperator }
            - { call: "POST /aog/orders/${order_id}/compliance-decision", payload: { decision: "CLEARED" }, as: ComplianceOfficer }
            - { call: "POST /aog/shipments", payload: { order_id: "${order_id}" }, as: WarehouseOperator, captures: { ship_id: $.data.id } }
            - { call: "POST /aog/shipments/${ship_id}/tender", payload: {}, as: WarehouseOperator }
            - { call: "POST /aog/shipments/${ship_id}/deliver", payload: {}, as: WarehouseOperator }
            - { call: "GET /aog/core-returns", payload: { order_line_id: "${line_id}" }, as: AogDeskAgent, captures: { core_id: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformOps }
          trigger:
            - { call: "POST /aog/core-returns/${core_id}/receive", payload: { core_serial_number: "SN-CORE-1" }, as: WarehouseOperator, captures: { final_penalty: $.data.penalty_cents, days_over: $.data.days_overdue } }
          assert:
            - "Quote.${quote_id}.max_penalty_cents == 500000 (PROVISIONAL forfeiture disclosure)"
            - "CoreReturn.${core_id}.days_overdue == 10"
            - "CoreReturn.${core_id}.penalty_cents == 57500 (FINAL: 25000 late fee + 17500 tier-1 + 15000 tier-2)"
            - "500000 != 57500 — the two variants disagree on identical core data"
            - "CoreReturn.${core_id}.due_at == 2026-05-22T00:00:00Z"

      - name: loan_vs_lease_settlement_divergence
        grounds:
          - calculations.loan_settlement
          - entities.LoanAgreement.fields.billed_cents
          - state_machines.LoanAgreement.ACTIVE_to_RETURNED
        distinguishing_aspect: |
          Identical span (start 2026-05-10, due 2026-06-09, returned 2026-06-14,
          35 actual days, rate 25000/day): LOAN bills chronologically with a 1.5x
          late tier -> 937500; LEASE bills forward whole 30-day periods rounding
          up -> 1500000. Entity domain = LoanAgreement (distinct from the
          CoreReturn domain of the sibling instance).
        test_recipe:
          setup:
            - "Customer C2 ACTIVE, credit_limit 100000000"
            - "PartMaster PN-ROT rotable, core 100000, list 300000"
            - "Units SN-L1 and SN-L2 AVAILABLE OVERHAULED FAA_8130"
            - "Clock default 2026-05-01T00:00:00Z"
            - "Loan A: LOAN on SN-L1 [2026-05-10, 2026-06-09) rate 25000"
            - "Loan B: LEASE on SN-L2 lease_periods 1 [2026-05-10, 2026-06-09) rate 25000 (first period debited 750000 at creation)"
          setup_api_calls:
            - { call: "POST /aog/customers", payload: { name: "Polar Air", country_code: "US", credit_limit_cents: 100000000 }, as: FinanceController, captures: { cust_id: $.data.id } }
            - { call: "POST /aog/parts", payload: { part_number: "PN-ROT", description: "Rotable actuator", rotable: true, list_price_cents: 300000, core_value_cents: 100000, hazmat_class: "NONE", export_control_code: "EAR99", warranty_months: 12 }, as: WarehouseOperator, captures: { part_id: $.data.id } }
            - { call: "POST /aog/inventory-units", payload: { part_id: "${part_id}", serial_number: "SN-L1", condition: "OVERHAULED", trace_doc_level: "FAA_8130", warehouse_code: "WH-JFK" }, as: WarehouseOperator, captures: { unit1: $.data.id } }
            - { call: "POST /aog/inventory-units", payload: { part_id: "${part_id}", serial_number: "SN-L2", condition: "OVERHAULED", trace_doc_level: "FAA_8130", warehouse_code: "WH-JFK" }, as: WarehouseOperator, captures: { unit2: $.data.id } }
            - { call: "POST /aog/loans", payload: { customer_id: "${cust_id}", unit_id: "${unit1}", loan_type: "LOAN", daily_rate_cents: 25000, start_at: "2026-05-10T00:00:00Z", due_at: "2026-06-09T00:00:00Z" }, as: AogDeskAgent, captures: { loan_a: $.data.id } }
            - { call: "POST /aog/loans", payload: { customer_id: "${cust_id}", unit_id: "${unit2}", loan_type: "LEASE", daily_rate_cents: 25000, lease_periods: 1, start_at: "2026-05-10T00:00:00Z", due_at: "2026-06-09T00:00:00Z" }, as: AogDeskAgent, captures: { loan_b: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-14T00:00:00Z" }, as: PlatformOps }
          trigger:
            - { call: "POST /aog/loans/${loan_a}/return", payload: { damage_flag: false }, as: WarehouseOperator, captures: { billed_a: $.data.billed_cents, st_a: $.data.status } }
            - { call: "POST /aog/loans/${loan_b}/return", payload: { damage_flag: false }, as: WarehouseOperator, captures: { billed_b: $.data.billed_cents, st_b: $.data.status } }
          assert:
            - "LoanAgreement.${loan_a}.billed_cents == 937500 (30*25000 + round_half_up(5*25000*1.5))"
            - "LoanAgreement.${loan_b}.billed_cents == 1500000 (ceil(35/30)=2 periods * 30 * 25000)"
            - "937500 != 1500000 — identical dates, variant-dependent totals"
            - "LoanAgreement.${loan_a}.status == SETTLED and LoanAgreement.${loan_b}.status == SETTLED"

  - rule_id: combinatorial_formula
    instances:
      - name: per_line_rounding_then_sum
        grounds:
          - calculations.quote_line_pricing
          - entities.Quote.fields.subtotal_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins round-per-line-then-sum.
          Two lines of 19995 x 3 x 0.9: per-line rounding yields subtotal
          107974; sum-then-round would yield 107973 — the pinned order is the
          only acceptable answer.
        test_recipe:
          setup:
            - "Customer STANDARD tier, credit_limit 100000000"
            - "PartMaster PN-A non-rotable list 19995"
            - "AOG request OPEN"
          setup_api_calls:
            - { call: "POST /aog/customers", payload: { name: "RoundAir", country_code: "US", credit_limit_cents: 100000000 }, as: FinanceController, captures: { cust_id: $.data.id } }
            - { call: "POST /aog/parts", payload: { part_number: "PN-A", description: "Seal kit", rotable: false, list_price_cents: 19995, hazmat_class: "NONE", export_control_code: "EAR99", warranty_months: 12 }, as: WarehouseOperator, captures: { part_id: $.data.id } }
            - { call: "POST /aog/aog-requests", payload: { customer_id: "${cust_id}", aircraft_tail: "N200RA", airport_code: "SEA", part_id: "${part_id}", quantity: 6, condition_acceptable: ["NEW"], min_trace_doc: "FAA_8130", needed_by_utc: "2026-06-01T00:00:00Z" }, as: AogDeskAgent, captures: { aog_id: $.data.id } }
          trigger:
            - { call: "POST /aog/quotes", payload: { aog_request_id: "${aog_id}", customer_id: "${cust_id}", lines: [ { part_id: "${part_id}", quantity: 3, sale_type: "OUTRIGHT", unit_price_cents: 19995, discount_pct: 0.10, condition_required: "NEW" }, { part_id: "${part_id}", quantity: 3, sale_type: "OUTRIGHT", unit_price_cents: 19995, discount_pct: 0.10, condition_required: "NEW" } ], validity_hours: 24, freight_mode: "STANDARD", distance_km: 800, chargeable_weight_kg: 4, destination_country: "US" }, as: AogDeskAgent, captures: { quote_id: $.data.id, subtotal: $.data.subtotal_cents, total: $.data.total_cents, handling: $.data.handling_fee_cents, tierfee: $.data.tier_fee_cents } }
          assert:
            - "Quote.${quote_id}.subtotal_cents == 107974 (53987 + 53987; sum-then-round would give 107973)"
            - "Quote.${quote_id}.handling_fee_cents == 4500"
            - "Quote.${quote_id}.tier_fee_cents == 6748 (round_half_up(112474 * 0.06))"
            - "Quote.${quote_id}.total_cents == 119222"

      - name: handling_fee_bracket_evaluated_pre_fee
        grounds:
          - calculations.quote_total_fees
          - entities.Quote.fields.handling_fee_cents
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: the handling-fee bracket reads on
          'order value' yet the fee itself is part of order value. The scaffold
          pins evaluation on the PRE-FEE subtotal: subtotal 99500 takes the 9500
          small-order fee even though the post-fee value 109000 sits in the
          4500 bracket. Post-fee evaluation would give total 110240.
        test_recipe:
          setup:
            - "Customer STANDARD tier, credit_limit 100000000"
            - "PartMaster PN-B non-rotable"
            - "AOG request OPEN"
          setup_api_calls:
            - { call: "POST /aog/customers", payload: { name: "CircAir", country_code: "US", credit_limit_cents: 100000000 }, as: FinanceController, captures: { cust_id: $.data.id } }
            - { call: "POST /aog/parts", payload: { part_number: "PN-B", description: "Gasket", rotable: false, list_price_cents: 99500, hazmat_class: "NONE", export_control_code: "EAR99", warranty_months: 12 }, as: WarehouseOperator, captures: { part_id: $.data.id } }
            - { call: "POST /aog/aog-requests", payload: { customer_id: "${cust_id}", aircraft_tail: "N300CA", airport_code: "DEN", part_id: "${part_id}", quantity: 1, condition_acceptable: ["NEW"], min_trace_doc: "TRACE_MISSING", needed_by_utc: "2026-06-01T00:00:00Z" }, as: AogDeskAgent, captures: { aog_id: $.data.id } }
          trigger:
            - { call: "POST /aog/quotes", payload: { aog_request_id: "${aog_id}", customer_id: "${cust_id}", lines: [ { part_id: "${part_id}", quantity: 1, sale_type: "OUTRIGHT", unit_price_cents: 99500, discount_pct: 0, condition_required: "NEW" } ], validity_hours: 24, freight_mode: "STANDARD", distance_km: 800, chargeable_weight_kg: 4, destination_country: "US" }, as: AogDeskAgent, captures: { quote_id: $.data.id, handling: $.data.handling_fee_cents, total: $.data.total_cents } }
          assert:
            - "Quote.${quote_id}.subtotal_cents == 99500"
            - "Quote.${quote_id}.handling_fee_cents == 9500 (pre-fee bracket < 100000)"
            - "Quote.${quote_id}.tier_fee_cents == 6540 (round_half_up(109000 * 0.06))"
            - "Quote.${quote_id}.total_cents == 115540 (post-fee bracketing would give 110240)"

      - name: freight_combinatorial_hot_shot_hazmat_escalated
        grounds:
          - calculations.freight_cost
          - entities.Quote.fields.freight_cost_cents
        distinguishing_aspect: |
          Mode (a) >= 3 inputs with non-linear interaction: weight bracket
          (12kg -> 900c/kg) x distance multiplier (2500km -> 1.35) + HOT_SHOT
          flat premium 250000, then multiplicative hazmat 1.25 and escalation
          1.25 surcharges, single final rounding: ((900*12*1.35 + 250000) *
          1.25 * 1.25) = 413406.25 -> 413406.
        test_recipe:
          setup:
            - "Customer STANDARD tier, credit_limit 100000000"
            - "PartMaster PN-HAZ hazmat_class CLASS_3, export EAR99, non-rotable"
            - "AOG request OPEN, then escalated"
          setup_api_calls:
            - { call: "POST /aog/customers", payload: { name: "JetSet Cargo", country_code: "US", credit_limit_cents: 100000000 }, as: FinanceController, captures: { cust_id: $.data.id } }
            - { call: "POST /aog/parts", payload: { part_number: "PN-HAZ", description: "Oxygen generator", rotable: false, list_price_cents: 75000, hazmat_class: "CLASS_3", export_control_code: "EAR99", warranty_months: 6 }, as: WarehouseOperator, captures: { part_id: $.data.id } }
            - { call: "POST /aog/aog-requests", payload: { customer_id: "${cust_id}", aircraft_tail: "N400JS", airport_code: "MIA", part_id: "${part_id}", quantity: 1, condition_acceptable: ["NEW"], min_trace_doc: "FAA_8130", needed_by_utc: "2026-06-01T00:00:00Z" }, as: AogDeskAgent, captures: { aog_id: $.data.id } }
            - { call: "POST /aog/aog-requests/${aog_id}/escalate", payload: {}, as: AogDeskAgent }
          trigger:
            - { call: "POST /aog/quotes", payload: { aog_request_id: "${aog_id}", customer_id: "${cust_id}", lines: [ { part_id: "${part_id}", quantity: 1, sale_type: "OUTRIGHT", unit_price_cents: 75000, discount_pct: 0, condition_required: "NEW" } ], validity_hours: 24, freight_mode: "HOT_SHOT", distance_km: 2500, chargeable_weight_kg: 12, destination_country: "US" }, as: AogDeskAgent, captures: { quote_id: $.data.id, freight: $.data.freight_cost_cents } }
          assert:
            - "Quote.${quote_id}.freight_cost_cents == 413406"
            - "removing either surcharge or the premium changes the value (inputs interact multiplicatively/additively, not independently)"

  - rule_id: non_linear_state_machine
    instances:
      - name: quote_revision_cycle_reissue
        grounds:
          - state_machines.Quote.DRAFT_to_ISSUED
          - state_machines.Quote.ISSUED_to_REJECTED
          - state_machines.Quote.REJECTED_to_DRAFT
        distinguishing_aspect: |
          Quote is cyclic: DRAFT -> ISSUED -> REJECTED -> DRAFT -> ISSUED with
          revision_count incrementing and validity fields cleared then re-armed;
          a pure pipeline machine could not re-enter DRAFT.
        test_recipe:
          setup:
            - "Customer STANDARD, credit_limit 100000000"
            - "PartMaster PN-C non-rotable list 50000"
            - "AOG request OPEN"
          setup_api_calls:
            - { call: "POST /aog/customers", payload: { name: "CycleAir", country_code: "US", credit_limit_cents: 100000000 }, as: FinanceController, captures: { cust_id: $.data.id } }
            - { call: "POST /aog/parts", payload: { part_number: "PN-C", description: "Filter", rotable: false, list_price_cents: 50000, hazmat_class: "NONE", export_control_code: "EAR99", warranty_months: 12 }, as: WarehouseOperator, captures: { part_id: $.data.id } }
            - { call: "POST /aog/aog-requests", payload: { customer_id: "${cust_id}", aircraft_tail: "N500CY", airport_code: "ATL", part_id: "${part_id}", quantity: 1, condition_acceptable: ["NEW"], min_trace_doc: "FAA_8130", needed_by_utc: "2026-06-01T00:00:00Z" }, as: AogDeskAgent, captures: { aog_id: $.data.id } }
            - { call: "POST /aog/quotes", payload: { aog_request_id: "${aog_id}", customer_id: "${cust_id}", lines: [ { part_id: "${part_id}", quantity: 1, sale_type: "OUTRIGHT", unit_price_cents: 50000, discount_pct: 0, condition_required: "NEW" } ], validity_hours: 24, freight_mode: "STANDARD", distance_km: 800, chargeable_weight_kg: 4, destination_country: "US" }, as: AogDeskAgent, captures: { quote_id: $.data.id } }
            - { call: "POST /aog/quotes/${quote_id}/issue", payload: {}, as: AogDeskAgent }
            - { call: "POST /aog/quotes/${quote_id}/reject", payload: {}, as: CustomerContact, as_user_id: "${cust_id}", captures: { q_v3: $.data.version } }
          trigger:
            - { call: "POST /aog/quotes/${quote_id}/revise", payload: { expected_quote_version: "${q_v3}", validity_hours: 48 }, as: AogDeskAgent, captures: { q_v4: $.data.version, q_status: $.data.status, q_rev: $.data.revision_count } }
            - { call: "POST /aog/quotes/${quote_id}/issue", payload: {}, as: AogDeskAgent, captures: { q_final: $.data.status, q_exp: $.data.expires_at } }
          assert:
            - "Quote.${quote_id} completes DRAFT->ISSUED->REJECTED->DRAFT->ISSUED"
            - "Quote.${quote_id}.revision_count == 1 after the loop"
            - "Quote.${quote_id}.status == ISSUED and expires_at == 2026-05-03T00:00:00Z (48h from clock 2026-05-01; validity was re-armed to the revised 48h)"
            - "version increments on every transition (1 create, 2 issue, 3 reject, 4 revise, 5 issue)"

      - name: sales_order_parallel_dimensions_evolve_independently
        grounds:
          - state_machines.SalesOrder
          - entities.SalesOrder.fields.fulfillment_status
          - entities.SalesOrder.fields.compliance_status
          - entities.SalesOrder.fields.payment_status
        distinguishing_aspect: |
          SalesOrder carries three parallel state dimensions on one row:
          compliance CLEARED moves while fulfillment stays PENDING_ALLOCATION and
          payment stays UNBILLED; delivery advances fulfillment and payment
          together; a PAYMENT_CREDIT later moves payment alone to PAID.
        test_recipe:
          setup:
            - "Customer STANDARD credit_limit 100000000; part PN-D list 100000 non-rotable; unit SN-D1 NEW FAA_8130; full chain through quote acceptance"
          setup_api_calls:
            - { call: "POST /aog/customers", payload: { name: "ParAir", country_code: "US", credit_limit_cents: 100000000 }, as: FinanceController, captures: { cust_id: $.data.id, cust_v: $.data.version } }
            - { call: "POST /aog/parts", payload: { part_number: "PN-D", description: "Pump", rotable: false, list_price_cents: 100000, hazmat_class: "NONE", export_control_code: "EAR99", warranty_months: 12 }, as: WarehouseOperator, captures: { part_id: $.data.id } }
            - { call: "POST /aog/inventory-units", payload: { part_id: "${part_id}", serial_number: "SN-D1", condition: "NEW", trace_doc_level: "FAA_8130", warehouse_code: "WH-ORD" }, as: WarehouseOperator, captures: { unit_id: $.data.id } }
            - { call: "POST /aog/aog-requests", payload: { customer_id: "${cust_id}", aircraft_tail: "N600PA", airport_code: "ORD", part_id: "${part_id}", quantity: 1, condition_acceptable: ["NEW"], min_trace_doc: "FAA_8130", needed_by_utc: "2026-06-01T00:00:00Z" }, as: AogDeskAgent, captures: { aog_id: $.data.id } }
            - { call: "POST /aog/aog-requests/${aog_id}/source-search", payload: {}, as: AogDeskAgent }
            - { call: "POST /aog/quotes", payload: { aog_request_id: "${aog_id}", customer_id: "${cust_id}", lines: [ { part_id: "${part_id}", quantity: 1, sale_type: "OUTRIGHT", unit_price_cents: 100000, discount_pct: 0, condition_required: "NEW" } ], validity_hours: 24, freight_mode: "STANDARD", distance_km: 800, chargeable_weight_kg: 4, destination_country: "US" }, as: AogDeskAgent, captures: { quote_id: $.data.id } }
            - { call: "POST /aog/quotes/${quote_id}/issue", payload: {}, as: AogDeskAgent, captures: { q_ver: $.data.version } }
            - { call: "POST /aog/quotes/${quote_id}/accept", payload: { expected_quote_version: "${q_ver}" }, as: CustomerContact, as_user_id: "${cust_id}" }
            - { call: "GET /aog/orders", payload: { quote_id: "${quote_id}" }, as: AogDeskAgent, captures: { order_id: "$.data[0].id" } }
            - { call: "GET /aog/order-lines", payload: { order_id: "${order_id}" }, as: AogDeskAgent, captures: { line_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /aog/orders/${order_id}/compliance-decision", payload: { decision: "CLEARED" }, as: ComplianceOfficer, captures: { s1_f: $.data.fulfillment_status, s1_c: $.data.compliance_status, s1_p: $.data.payment_status } }
            - { call: "POST /aog/order-lines/${line_id}/allocate", payload: { unit_id: "${unit_id}" }, as: WarehouseOperator }
            - { call: "POST /aog/shipments", payload: { order_id: "${order_id}" }, as: WarehouseOperator, captures: { ship_id: $.data.id } }
            - { call: "POST /aog/shipments/${ship_id}/tender", payload: {}, as: WarehouseOperator }
            - { call: "POST /aog/shipments/${ship_id}/deliver", payload: {}, as: WarehouseOperator }
            - { call: "GET /aog/customers/${cust_id}", payload: {}, as: FinanceController, captures: { cust_v_now: $.data.version } }
            - { call: "POST /aog/customers/${cust_id}/credit-adjustments", payload: { entry_type: "PAYMENT_CREDIT", amount_cents: 110770, expected_customer_version: "${cust_v_now}", order_id: "${order_id}" }, as: FinanceController }
            - { call: "GET /aog/orders/${order_id}", payload: {}, as: AogDeskAgent, captures: { s2_f: $.data.fulfillment_status, s2_p: $.data.payment_status } }
          assert:
            - "after compliance-decision: compliance_status == CLEARED while fulfillment_status == PENDING_ALLOCATION and payment_status == UNBILLED (dimensions move independently)"
            - "after deliver: fulfillment_status == DELIVERED and payment_status == INVOICED, invoiced_cents == 110770"
            - "after payment credit of exactly 110770: payment_status == PAID while fulfillment_status remains DELIVERED"

  - rule_id: transitive_cascade
    instances:
      - name: delivery_cascade_invoice_to_balance
        grounds:
          - state_machines.SalesOrder.fulfillment=SHIPPED_to_fulfillment=DELIVERED
          - state_machines.Shipment.IN_TRANSIT_to_DELIVERED
          - calculations.outstanding_balance_recompute
          - entities.Customer.fields.outstanding_balance_cents
        distinguishing_aspect: |
          Depth-4 chain from POST /aog/shipments/{id}/deliver: deliver flips the
          order to DELIVERED (1); the DELIVERED transition posts INVOICE_DEBIT
          and CORE_DEPOSIT_DEBIT ledger entries (2); each posting recomputes
          Customer.outstanding_balance_cents (3); the balance change is then
          input to the next sweep's suspension evaluation (4). Each link is
          caused by the previous link, not by the original call.
        test_recipe:
          setup:
            - "Exchange order delivered at clock 2026-05-01: quote total 269770 (subtotal 250000 + handling 4500 + tier fee 15270), freight 4800, core deposit 500000"
          setup_api_calls:
            - { call: "POST /aog/customers", payload: { name: "CascadeAir", country_code: "US", credit_limit_cents: 100000000 }, as: FinanceController, captures: { cust_id: $.data.id } }
            - { call: "POST /aog/parts", payload: { part_number: "PN-CAS", description: "Rotable pump", rotable: true, list_price_cents: 250000, core_value_cents: 500000, hazmat_class: "NONE", export_control_code: "EAR99", warranty_months: 24 }, as: WarehouseOperator, captures: { part_id: $.data.id } }
            - { call: "POST /aog/inventory-units", payload: { part_id: "${part_id}", serial_number: "SN-CAS1", condition: "OVERHAULED", trace_doc_level: "DUAL_RELEASE", warehouse_code: "WH-DFW" }, as: WarehouseOperator, captures: { unit_id: $.data.id } }
            - { call: "POST /aog/aog-requests", payload: { customer_id: "${cust_id}", aircraft_tail: "N700CA", airport_code: "DFW", part_id: "${part_id}", quantity: 1, condition_acceptable: ["OVERHAULED"], min_trace_doc: "FAA_8130", needed_by_utc: "2026-06-01T00:00:00Z" }, as: AogDeskAgent, captures: { aog_id: $.data.id } }
            - { call: "POST /aog/aog-requests/${aog_id}/source-search", payload: {}, as: AogDeskAgent }
            - { call: "POST /aog/quotes", payload: { aog_request_id: "${aog_id}", customer_id: "${cust_id}", lines: [ { part_id: "${part_id}", quantity: 1, sale_type: "EXCHANGE", unit_price_cents: 250000, discount_pct: 0, condition_required: "OVERHAULED" } ], validity_hours: 24, freight_mode: "STANDARD", distance_km: 800, chargeable_weight_kg: 4, destination_country: "US" }, as: AogDeskAgent, captures: { quote_id: $.data.id } }
            - { call: "POST /aog/quotes/${quote_id}/issue", payload: {}, as: AogDeskAgent, captures: { q_ver: $.data.version } }
            - { call: "POST /aog/quotes/${quote_id}/accept", payload: { expected_quote_version: "${q_ver}" }, as: CustomerContact, as_user_id: "${cust_id}" }
            - { call: "GET /aog/orders", payload: { quote_id: "${quote_id}" }, as: AogDeskAgent, captures: { order_id: "$.data[0].id" } }
            - { call: "GET /aog/order-lines", payload: { order_id: "${order_id}" }, as: AogDeskAgent, captures: { line_id: "$.data[0].id" } }
            - { call: "POST /aog/order-lines/${line_id}/allocate", payload: { unit_id: "${unit_id}" }, as: WarehouseOperator }
            - { call: "POST /aog/orders/${order_id}/compliance-decision", payload: { decision: "CLEARED" }, as: ComplianceOfficer }
            - { call: "POST /aog/shipments", payload: { order_id: "${order_id}" }, as: WarehouseOperator, captures: { ship_id: $.data.id } }
            - { call: "POST /aog/shipments/${ship_id}/tender", payload: {}, as: WarehouseOperator }
          trigger:
            - { call: "POST /aog/shipments/${ship_id}/deliver", payload: {}, as: WarehouseOperator, captures: { ship_status: $.data.status } }
            - { call: "GET /aog/orders/${order_id}", payload: {}, as: AogDeskAgent, captures: { o_ful: $.data.fulfillment_status, o_pay: $.data.payment_status, o_inv: $.data.invoiced_cents } }
            - { call: "GET /aog/customers/${cust_id}", payload: {}, as: FinanceController, captures: { c_bal: $.data.outstanding_balance_cents } }
            - { call: "GET /aog/core-returns", payload: { order_line_id: "${line_id}" }, as: AogDeskAgent, captures: { core_due: "$.data[0].due_at", core_val: "$.data[0].core_value_cents" } }
            - { call: "GET /aog/inventory-units/${unit_id}", payload: {}, as: AogDeskAgent, captures: { u_status: $.data.status } }
            - { call: "GET /aog/aog-requests/${aog_id}", payload: {}, as: AogDeskAgent, captures: { aog_status: $.data.status } }
          assert:
            - "Shipment.${ship_id}.status == DELIVERED"
            - "SalesOrder.${order_id}: fulfillment_status == DELIVERED, payment_status == INVOICED, invoiced_cents == 269770"
            - "Customer.${cust_id}.outstanding_balance_cents == 774540 (invoice 269770 + freight 4800 + core deposit 500000)"
            - "CoreReturn created with core_value_cents == 500000 and due_at == 2026-05-22T00:00:00Z (delivery + 21d)"
            - "InventoryUnit.${unit_id}.status == SOLD (EXCHANGE outbound unit)"
            - "AogRequest.${aog_id}.status == FULFILLED (bubble-up link of the cascade)"

      - name: lease_sweep_suspension_cascade
        grounds:
          - state_machines.Customer.ACTIVE_to_SUSPENDED
          - calculations.loan_settlement
          - calculations.customer_priority_tier
          - calculations.outstanding_balance_recompute
        distinguishing_aspect: |
          Depth-3 chain from a DIFFERENT trigger (POST /_system/run-sweeps, not
          a business action): the sweep crosses a 30-day lease boundary and
          posts a LEASE_DEBIT (1); the debit recomputes
          outstanding_balance_cents to 1500000 (2); the recomputed balance
          exceeds credit_limit 1200000 and the sweep suspends the customer (3).
          Observable downstream: quote issue is then rejected with
          ERR_CUSTOMER_SUSPENDED.
        test_recipe:
          setup:
            - "Customer LEASECO ACTIVE, credit_limit 1200000"
            - "LEASE loan lease_periods 2, rate 25000/day, [2026-05-01, 2026-06-30): first period debit 750000 posted at creation (balance 750000)"
            - "Clock advanced to 2026-06-01 (past the 2026-05-31 period boundary)"
          setup_api_calls:
            - { call: "POST /aog/customers", payload: { name: "LeaseCo", country_code: "US", credit_limit_cents: 1200000 }, as: FinanceController, captures: { cust_id: $.data.id } }
            - { call: "POST /aog/parts", payload: { part_number: "PN-LEASE", description: "Rotable gen", rotable: true, list_price_cents: 900000, core_value_cents: 200000, hazmat_class: "NONE", export_control_code: "EAR99", warranty_months: 12 }, as: WarehouseOperator, captures: { part_id: $.data.id } }
            - { call: "POST /aog/inventory-units", payload: { part_id: "${part_id}", serial_number: "SN-LE1", condition: "OVERHAULED", trace_doc_level: "FAA_8130", warehouse_code: "WH-ATL" }, as: WarehouseOperator, captures: { unit_id: $.data.id } }
            - { call: "POST /aog/loans", payload: { customer_id: "${cust_id}", unit_id: "${unit_id}", loan_type: "LEASE", daily_rate_cents: 25000, lease_periods: 2, start_at: "2026-05-01T00:00:00Z", due_at: "2026-06-30T00:00:00Z" }, as: AogDeskAgent, captures: { loan_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformOps }
            - { call: "POST /aog/parts", payload: { part_number: "PN-X", description: "Widget", rotable: false, list_price_cents: 1000, hazmat_class: "NONE", export_control_code: "EAR99", warranty_months: 12 }, as: WarehouseOperator, captures: { part2_id: $.data.id } }
            - { call: "POST /aog/aog-requests", payload: { customer_id: "${cust_id}", aircraft_tail: "N800LC", airport_code: "ATL", part_id: "${part2_id}", quantity: 1, condition_acceptable: ["NEW"], min_trace_doc: "TRACE_MISSING", needed_by_utc: "2026-07-01T00:00:00Z" }, as: AogDeskAgent, captures: { aog_id: $.data.id } }
            - { call: "POST /aog/quotes", payload: { aog_request_id: "${aog_id}", customer_id: "${cust_id}", lines: [ { part_id: "${part2_id}", quantity: 1, sale_type: "OUTRIGHT", unit_price_cents: 1000, discount_pct: 0, condition_required: "NEW" } ], validity_hours: 24, freight_mode: "STANDARD", distance_km: 800, chargeable_weight_kg: 4, destination_country: "US" }, as: AogDeskAgent, captures: { quote_id: $.data.id } }
          trigger:
            - { call: "POST /_system/run-sweeps", payload: {}, as: PlatformOps, captures: { n_susp: $.data.customers_suspended, n_lease: $.data.lease_debits_posted } }
            - { call: "GET /aog/customers/${cust_id}", payload: {}, as: FinanceController, captures: { c_status: $.data.status, c_bal: $.data.outstanding_balance_cents } }
            - { call: "POST /aog/quotes/${quote_id}/issue", payload: {}, as: AogDeskAgent, captures: { err: $.data.error_id } }
          assert:
            - "sweep result: lease_debits_posted == 1 and customers_suspended == 1"
            - "Customer.${cust_id}.outstanding_balance_cents == 1500000 (750000 at creation + 750000 period-2 debit)"
            - "Customer.${cust_id}.status == SUSPENDED (1500000 > 1200000)"
            - "POST /aog/quotes/{id}/issue fails with error_id == ERR_CUSTOMER_SUSPENDED (suspension gates downstream ops)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: expired_quote_beats_credit_limit
        grounds:
          - validations[priority=4]
          - validations[priority=10]
          - errors[ERR_QUOTE_EXPIRED]
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Category pair (state, business_fiscal): the accept request violates
          both — the quote is lazily EXPIRED (clock past expires_at) AND the
          customer's exposure would exceed the credit limit. Priority 4 state
          beats priority 10 fiscal, so the response is ERR_QUOTE_EXPIRED.
        test_recipe:
          setup:
            - "Customer LIMITCO, credit_limit 1000 (any real quote exceeds it)"
            - "Quote ISSUED validity 24h at clock 2026-05-01; clock then moved to 2026-05-02T00:00:01Z (past expires_at 2026-05-02T00:00:00Z)"
          setup_api_calls:
            - { call: "POST /aog/customers", payload: { name: "LimitCo", country_code: "US", credit_limit_cents: 1000 }, as: FinanceController, captures: { cust_id: $.data.id } }
            - { call: "POST /aog/parts", payload: { part_number: "PN-EXP", description: "Valve", rotable: false, list_price_cents: 50000, hazmat_class: "NONE", export_control_code: "EAR99", warranty_months: 12 }, as: WarehouseOperator, captures: { part_id: $.data.id } }
            - { call: "POST /aog/aog-requests", payload: { customer_id: "${cust_id}", aircraft_tail: "N900EX", airport_code: "PHX", part_id: "${part_id}", quantity: 1, condition_acceptable: ["NEW"], min_trace_doc: "FAA_8130", needed_by_utc: "2026-06-01T00:00:00Z" }, as: AogDeskAgent, captures: { aog_id: $.data.id } }
            - { call: "POST /aog/quotes", payload: { aog_request_id: "${aog_id}", customer_id: "${cust_id}", lines: [ { part_id: "${part_id}", quantity: 1, sale_type: "OUTRIGHT", unit_price_cents: 50000, discount_pct: 0, condition_required: "NEW" } ], validity_hours: 24, freight_mode: "STANDARD", distance_km: 800, chargeable_weight_kg: 4, destination_country: "US" }, as: AogDeskAgent, captures: { quote_id: $.data.id } }
            - { call: "POST /aog/quotes/${quote_id}/issue", payload: {}, as: AogDeskAgent, captures: { q_ver: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T00:00:01Z" }, as: PlatformOps }
          trigger:
            - { call: "POST /aog/quotes/${quote_id}/accept", payload: { expected_quote_version: "${q_ver}" }, as: CustomerContact, as_user_id: "${cust_id}", captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_QUOTE_EXPIRED (HTTP 409), NOT ERR_CREDIT_LIMIT_EXCEEDED (HTTP 402)"
            - "Quote.${quote_id} remains ISSUED in storage until a sweep runs (lazy expiry does not mutate)"

      - name: loan_window_past_beats_overlap
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_LOAN_WINDOW_IN_PAST]
          - errors[ERR_LOAN_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Category pair (business_temporal, business_constraint): the loan
          create violates both — start_at is in the past AND the window overlaps
          an existing ACTIVE loan of the same unit. Priority 8 temporal beats
          priority 9 constraint, so the response is ERR_LOAN_WINDOW_IN_PAST.
        test_recipe:
          setup:
            - "Customer ACTIVE; rotable unit SN-OV1 AVAILABLE"
            - "Existing ACTIVE loan on SN-OV1 with window [2026-05-10, 2026-06-09)"
            - "Clock at default 2026-05-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /aog/customers", payload: { name: "OverCo", country_code: "US", credit_limit_cents: 100000000 }, as: FinanceController, captures: { cust_id: $.data.id } }
            - { call: "POST /aog/parts", payload: { part_number: "PN-OV", description: "Rotable starter", rotable: true, list_price_cents: 400000, core_value_cents: 150000, hazmat_class: "NONE", export_control_code: "EAR99", warranty_months: 12 }, as: WarehouseOperator, captures: { part_id: $.data.id } }
            - { call: "POST /aog/inventory-units", payload: { part_id: "${part_id}", serial_number: "SN-OV1", condition: "OVERHAULED", trace_doc_level: "FAA_8130", warehouse_code: "WH-IAH" }, as: WarehouseOperator, captures: { unit_id: $.data.id } }
            - { call: "POST /aog/loans", payload: { customer_id: "${cust_id}", unit_id: "${unit_id}", loan_type: "LOAN", daily_rate_cents: 10000, start_at: "2026-05-10T00:00:00Z", due_at: "2026-06-09T00:00:00Z" }, as: AogDeskAgent, captures: { loan1: $.data.id } }
          trigger:
            - { call: "POST /aog/loans", payload: { customer_id: "${cust_id}", unit_id: "${unit_id}", loan_type: "LOAN", daily_rate_cents: 10000, start_at: "2026-04-01T00:00:00Z", due_at: "2026-06-15T00:00:00Z" }, as: AogDeskAgent, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_LOAN_WINDOW_IN_PAST (HTTP 422), NOT ERR_LOAN_WINDOW_OVERLAP (HTTP 409)"
            - "no new LoanAgreement is created (GET /aog/loans?unit_id=... returns exactly 1 row)"

  - rule_id: boundary_precision_check
