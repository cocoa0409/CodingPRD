            - "FuelTaxReturn.${r2_id}.total_net_tax_due == 18.60 (-28.90 + 27.33 + 20.17 of already-rounded lines, NOT 18.59 which is what rounding the raw sum once at the end produces)"
            - "FuelTaxReturn.${r2_id}.reconstructed_mileage_ratio == 0.2857 and reconstruction_penalty_amount == 100.00"
            - "FuelTaxReturn.${r2_id}.total_amount_due == 118.60"

      - name: audit_risk_score_saturating_min_max_lands_on_inclusive_threshold
        combination_mode: a
        grounds:
          - calculations.audit_risk_score
          - calculations.carrier_unsubstantiated_mileage_ratio
          - state_machines.AuditSelection.SCORED_to_SELECTED
          - entities.AuditSelection.fields.risk_score
        distinguishing_aspect: |
          Mode a — min/max saturation, a different combination shape from the rounding-order
          instance above. Four weighted factors combine, and three of them saturate: the
          unsubstantiated ratio 0.3000 exceeds RATIO_SATURATION_RATIO 0.25 so its term clamps at
          40 instead of scaling to 48; late_filing_count 2 is under the min(3, n) cap so it
          contributes the full 10; retention_deficiency_count 4 clamps at 20; and because this
          carrier has never had a return prepared, latest_prepared_fleet_mpg is null so the MPG
          factor scores 0 rather than saturating at 25. The sum is exactly 70, which is
          AUDIT_SELECTION_THRESHOLD, and the comparison is >= so the carrier is SELECTED.
        test_recipe:
          setup:
            - "Jurisdiction IL declared; carrier c3 based in IL with one power unit and no fuel tax return ever prepared, so latest_prepared_fleet_mpg is null."
            - "Trip N1 covers 700.0 mi with no odometer gap and is left CAPTURED (never reviewed); trip N2 covers 300.0 mi and opens a 60.0 mi gap, so it lands in GAP_FLAGGED."
            - "unsubstantiated_mileage_ratio is therefore 300.0 / 1000.0 == 0.3000, above the 0.1500 audit flag ratio."
          setup_api_calls:
            - call: "POST /apportionment/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /apportionment/jurisdictions"
              payload: { jurisdiction_code: "IL", name: "Illinois", fuel_tax_rate_per_gallon: 0.6270, surcharge_rate_per_gallon: 0.0000, is_surcharge_jurisdiction: false }
              as: ComplianceOfficer
            - call: "POST /apportionment/carriers"
              payload: { legal_name: "Threshold Edge Hauling Co", usdot_number: "USDOT-2637030", base_jurisdiction_code: "IL", bond_ceiling_amount: 5000.00 }
              as: ComplianceOfficer
              captures: { c3_id: $.data.id }
            - call: "POST /apportionment/vehicles"
              payload: { carrier_id: "${c3_id}", unit_number: "U-301", vin: "1FUJA6CK21L300301", weight_group_code: "W80", factory_price_amount: 152000.00, registration_year: 2026 }
              as: ComplianceOfficer
              captures: { v3_id: $.data.id }
            - call: "POST /apportionment/trip-records"
              payload: { carrier_id: "${c3_id}", vehicle_id: "${v3_id}", trip_start_utc: "2026-04-15T06:00:00Z", trip_end_utc: "2026-04-15T18:00:00Z", start_odometer: 300000.0, end_odometer: 300700.0, legs: [{ jurisdiction_code: "IL", leg_miles: 700.0 }] }
              as: MileageAnalyst
              captures: { n1_id: $.data.id }
            - call: "POST /apportionment/trip-records"
              payload: { carrier_id: "${c3_id}", vehicle_id: "${v3_id}", trip_start_utc: "2026-05-15T06:00:00Z", trip_end_utc: "2026-05-15T14:00:00Z", start_odometer: 300760.0, end_odometer: 301060.0, legs: [{ jurisdiction_code: "IL", leg_miles: 300.0 }] }
              as: MileageAnalyst
              captures: { n2_id: $.data.id }
          trigger:
            - call: "POST /apportionment/audit-selections"
              payload: { carrier_id: "${c3_id}", selection_year: 2026, selection_quarter: 2, late_filing_count: 2, retention_deficiency_count: 4 }
              as: ComplianceOfficer
              as_user_id: "officer-2"
          assert:
            - "TripRecord.${n1_id}.trip_status == CAPTURED and TripRecord.${n2_id}.trip_status == GAP_FLAGGED with gap_miles_from_previous == 60.0"
            - "Carrier.${c3_id}.unsubstantiated_mileage_ratio == 0.3000 and Carrier.${c3_id}.audit_flag == true"
            - "Carrier.${c3_id}.latest_prepared_fleet_mpg is null"
            - "AuditSelection risk_score == 70 (40 saturated ratio term + 0 null-MPG term + 10 late filing term + 20 saturated retention term)"
            - "AuditSelection selection_status == SELECTED because 70 >= AUDIT_SELECTION_THRESHOLD (inclusive)"
            - "AuditSelection unsubstantiated_ratio_snapshot == 0.3000"
            - "re-running the same scoring with retention_deficiency_count 3 instead of 4 gives risk_score 65 and selection_status NOT_SELECTED, confirming the retention term is min(1, n/4) and not n/4 uncapped"

  - rule_id: non_linear_state_machine
    instances:
      - name: trip_reconstruction_rejection_cycles_back_to_gap_flagged
        grounds:
          - state_machines.TripRecord.GAP_FLAGGED_to_RECONSTRUCTED
          - state_machines.TripRecord.RECONSTRUCTED_to_GAP_FLAGGED
          - state_machines.TripRecord.RECONSTRUCTED_to_ACCEPTED
          - calculations.carrier_unsubstantiated_mileage_ratio
          - entities.JurisdictionMileageLeg.fields.leg_status
        distinguishing_aspect: |
          A revision cycle on TripRecord: GAP_FLAGGED -> RECONSTRUCTED -> GAP_FLAGGED ->
          RECONSTRUCTED -> ACCEPTED. The backward hop is not a no-op — it voids the submitted
          legs, resets accepted_leg_miles_total to 0.0 and clears both
          supporting_document_reference and reconstructed_by_user_id, while mileage_source stays
          MANUAL_RECONSTRUCTION, so the second pass through the loop starts from a different
          field state than the first. The trip's miles stay in the carrier's unsubstantiated
          numerator for the whole loop and only leave it on the final ACCEPT.
        test_recipe:
          setup:
            - "Jurisdictions IL and KY declared; carrier c4 based in IL with one power unit."
            - "Trip Y1 covers 700.0 mi with no gap and is ACCEPTED."
            - "Trip Y2 covers 500.0 mi and opens a 100.0 mi odometer gap, so it is created GAP_FLAGGED; the carrier's unsubstantiated_mileage_ratio is 500.0 / 1200.0 == 0.4167."
            - "Analyst analyst-1 reconstructs Y2 as IL 400.0 / KY 200.0 (600.0 == 500.0 delta + 100.0 gap) with document RECON-Y2-PASS1, and officer-1 REJECTS that reconstruction, so Y2 is back in GAP_FLAGGED with no ACTIVE legs and a null supporting_document_reference."
          setup_api_calls:
            - call: "POST /apportionment/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /apportionment/jurisdictions"
              payload: { jurisdiction_code: "IL", name: "Illinois", fuel_tax_rate_per_gallon: 0.6270, surcharge_rate_per_gallon: 0.0000, is_surcharge_jurisdiction: false }
              as: ComplianceOfficer
            - call: "POST /apportionment/jurisdictions"
              payload: { jurisdiction_code: "KY", name: "Kentucky", fuel_tax_rate_per_gallon: 0.2460, surcharge_rate_per_gallon: 0.0440, is_surcharge_jurisdiction: true }
              as: ComplianceOfficer
            - call: "POST /apportionment/carriers"
              payload: { legal_name: "Revision Loop Logistics LLC", usdot_number: "USDOT-2637040", base_jurisdiction_code: "IL", bond_ceiling_amount: 5000.00 }
              as: ComplianceOfficer
              captures: { c4_id: $.data.id }
            - call: "POST /apportionment/vehicles"
              payload: { carrier_id: "${c4_id}", unit_number: "U-401", vin: "1FUJA6CK21L300401", weight_group_code: "W80", factory_price_amount: 149000.00, registration_year: 2026 }
              as: ComplianceOfficer
              captures: { v4_id: $.data.id }
            - call: "POST /apportionment/trip-records"
              payload: { carrier_id: "${c4_id}", vehicle_id: "${v4_id}", trip_start_utc: "2026-05-02T06:00:00Z", trip_end_utc: "2026-05-02T18:00:00Z", start_odometer: 400000.0, end_odometer: 400700.0, legs: [{ jurisdiction_code: "IL", leg_miles: 700.0 }] }
              as: MileageAnalyst
              captures: { y1_id: $.data.id }
            - call: "POST /apportionment/trip-records/${y1_id}/review"
              payload: { decision: "ACCEPT" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /apportionment/trip-records"
              payload: { carrier_id: "${c4_id}", vehicle_id: "${v4_id}", trip_start_utc: "2026-06-10T06:00:00Z", trip_end_utc: "2026-06-10T16:00:00Z", start_odometer: 400800.0, end_odometer: 401300.0, legs: [{ jurisdiction_code: "IL", leg_miles: 300.0 }, { jurisdiction_code: "KY", leg_miles: 200.0 }] }
              as: MileageAnalyst
              captures: { y2_id: $.data.id }
            - call: "POST /apportionment/trip-records/${y2_id}/reconstruct"
              payload: { reconstructed_legs: [{ jurisdiction_code: "IL", leg_miles: 400.0 }, { jurisdiction_code: "KY", leg_miles: 200.0 }], supporting_document_reference: "RECON-Y2-PASS1" }
              as: MileageAnalyst
              as_user_id: "analyst-1"
            - call: "POST /apportionment/trip-records/${y2_id}/review"
              payload: { decision: "REJECT" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /apportionment/trip-records/${y2_id}/reconstruct"
              payload: { reconstructed_legs: [{ jurisdiction_code: "IL", leg_miles: 250.0 }, { jurisdiction_code: "KY", leg_miles: 350.0 }], supporting_document_reference: "RECON-Y2-PASS2" }
              as: MileageAnalyst
              as_user_id: "analyst-2"
            - call: "POST /apportionment/trip-records/${y2_id}/review"
              payload: { decision: "ACCEPT" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
          assert:
            - "after the setup REJECT, TripRecord.${y2_id}.trip_status == GAP_FLAGGED with supporting_document_reference null, reconstructed_by_user_id null, mileage_source == MANUAL_RECONSTRUCTION and accepted_leg_miles_total == 0.0"
            - "after the setup REJECT, GET /apportionment/trip-records/${y2_id}/mileage-legs?leg_status=ACTIVE returns 0 rows and ?leg_status=VOIDED returns 4 rows (the 2 telematics legs plus the 2 first-pass reconstruction legs)"
            - "after the trigger reconstruct, TripRecord.${y2_id}.trip_status == RECONSTRUCTED, supporting_document_reference == RECON-Y2-PASS2, reconstructed_by_user_id == analyst-2, accepted_leg_miles_total == 600.0"
            - "after the trigger ACCEPT, TripRecord.${y2_id}.trip_status == ACCEPTED and gap_miles_from_previous is still 100.0 (the gap record is never erased)"
            - "GET /apportionment/trip-records/${y2_id}/mileage-legs?leg_status=ACTIVE returns exactly IL 250.0 and KY 350.0"
            - "Carrier.${c4_id}.unsubstantiated_mileage_ratio == 0.4167 and audit_flag == true at every point of the loop before the final ACCEPT"
            - "Carrier.${c4_id}.unsubstantiated_mileage_ratio == 0.0000 and audit_flag == false after the final ACCEPT"

      - name: vehicle_status_and_credential_status_dimensions_move_independently
        grounds:
          - state_machines.Vehicle.dimensions.vehicle_status
          - state_machines.Vehicle.dimensions.credential_status
          - state_machines.Credential.ISSUED_to_DISTRIBUTED
          - state_machines.FleetChangeRequest.REQUESTED_to_APPROVED
          - state_machines.FleetChangeRequest.APPROVED_to_REVERSED
        distinguishing_aspect: |
          Two parallel state dimensions on the same Vehicle row, which is a different
          non-linearity from the TripRecord revision cycle: distributing credentials walks
          credential_status NONE -> ISSUED -> DISTRIBUTED while vehicle_status never leaves
          ACTIVE, and approving then reversing a mid-year ADDITION walks vehicle_status
          PENDING -> ACTIVE -> PENDING (a backward hop) while that vehicle's credential_status
          never leaves NONE. Activating a vehicle does not mint credentials and handing out
          credentials does not activate a vehicle.
        test_recipe:
          setup:
            - "Jurisdictions IL, IN, KY declared with the W80 fee chart IL 2790.00 / IN 1692.00 / KY 1410.00."
            - "Carrier c5 with driver D1 and two W80 power units V51 and V52 for 2026."
            - "An ACTUAL_DISTANCE_BASIS application for 2026 with schedule IL 60000.0 / IN 25000.0 / KY 15000.0 is submitted and INVOICED, which activates V51 and V52, then credentials are issued: three per active vehicle (DECAL_SET, CAB_CARD, IFTA_LICENSE_COPY), six in total, all ISSUED."
            - "A third unit V53 is enrolled and stays PENDING with credential_status NONE, and an ADDITION change request for it effective 2026-07-15 is filed against the application."
          setup_api_calls:
            - call: "POST /apportionment/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /apportionment/jurisdictions"
              payload: { jurisdiction_code: "IL", name: "Illinois", fuel_tax_rate_per_gallon: 0.6270, surcharge_rate_per_gallon: 0.0000, is_surcharge_jurisdiction: false }
