  - section: cross_cutting_layers
    instances:
      - name: lease_amend_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[lease-amend-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on LeaseAgreement.version: after a successful amend (version observed at approve time -> v+1), replaying the same expected_lease_version fails 412 ERR_STALE_VERSION even though the lease is still legitimately amendable."
        test_recipe:
          setup: ["ACTIVE lease; version captured from the approve response"]
          setup_api_calls:
            - { call: "POST /lessees", payload: { company_name: "L", credit_tier: "TIER_A", credit_limit_cents: 100000000, security_deposit_cents: 0 }, as: LeaseAdmin, captures: { les: "$.data.id" } }
            - { call: "POST /lease-agreements", payload: { lessee_id: "${les}", lease_type: "FULL_SERVICE", base_daily_rate_cents: 5000, car_hire_lessor_share_pct: 100, authorized_repair_cap_cents: 20000, start_date: "2026-08-01", end_date: "2027-07-31" }, as: LeaseAdmin, captures: { lea: "$.data.id" } }
            - { call: "POST /lease-agreements/${lea}/submit", payload: {}, as: LeaseAdmin }
            - { call: "POST /lease-agreements/${lea}/approve", payload: {}, as: ComplianceOfficer, captures: { lea_v: "$.data.version" } }
          trigger:
            - { call: "PATCH /lease-agreements/${lea}", payload: { base_daily_rate_cents: 5500, expected_lease_version: "${lea_v}" }, as: LeaseAdmin, captures: { lea_v2: "$.data.version" } }
            - { call: "PATCH /lease-agreements/${lea}", payload: { base_daily_rate_cents: 6000, expected_lease_version: "${lea_v}" }, as: LeaseAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "first PATCH succeeds: base_daily_rate_cents == 5500 and version == ${lea_v} + 1"
            - "second PATCH with the stale observed version: 412 ERR_STALE_VERSION; base_daily_rate_cents remains 5500"

      - name: tariff_amend_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[tariff-amend-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on TariffRate.version: an amend carrying the pre-amend version fails 412 while an amend with the fresh version succeeds."
        test_recipe:
          setup: ["tariff created, version captured"]
          setup_api_calls:
            - { call: "POST /tariff-rates", payload: { car_type: "FLAT", rate_kind: "CAR_HIRE_BASE", effective_from: "2026-01-01", effective_to: "2027-01-01", unit_rate_cents: 8000 }, as: LeaseAdmin, captures: { t: "$.data.id", t_v: "$.data.version" } }
          trigger:
            - { call: "PUT /tariff-rates/${t}", payload: { unit_rate_cents: 8500, expected_tariff_version: "${t_v}" }, as: LeaseAdmin }
            - { call: "PUT /tariff-rates/${t}", payload: { unit_rate_cents: 8700, expected_tariff_version: "${t_v}" }, as: LeaseAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "first PUT succeeds (rate 8500)"
            - "second PUT with stale version: 412 ERR_STALE_VERSION; unit_rate_cents remains 8500"

      - name: pool_commit_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[pool-commit-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on CapitalPool.version: a commitment created against version 1 succeeds (pool advances to 2); a second commitment still carrying expected_pool_version 1 fails 412 before the affordability check."
        test_recipe:
          setup: ["CapitalPool FY2026 opening 100000000, version captured at creation"]
          setup_api_calls:
            - { call: "POST /capital-pools", payload: { fiscal_year: 2026, opening_balance_cents: 100000000 }, as: SystemAdmin, captures: { pool: "$.data.id", pool_v: "$.data.version" } }
          trigger:
            - { call: "POST /capital-pools/${pool}/commitments", payload: { car_type: "BOX", unit_cost_cents: 10000000, expected_pool_version: "${pool_v}" }, as: FleetPlanner, captures: { com: "$.data.id" } }
            - { call: "POST /capital-pools/${pool}/commitments", payload: { car_type: "GONDOLA", unit_cost_cents: 10000000, expected_pool_version: "${pool_v}" }, as: FleetPlanner, captures: { err: "$.data.error_id" } }
          assert:
            - "first commit succeeds: PurchaseCommitment.${com}.status == COMMITTED"
            - "second commit with stale expected_pool_version: 412 ERR_STALE_VERSION"
            - "CapitalPool.${pool}.committed_cents == 10000000 (only the first commit applied)"

      - name: commitment_deliver_creates_replacement_railcar
        claim_type: cascading_side_effects
        grounds: ["state_machines.PurchaseCommitment.COMMITTED_to_DELIVERED", "calculations.calc_capital_pool_available"]
        distinguishing_aspect: "Cascade: delivering a commitment moves 25000000 from committed to delivered_spend (available unchanged 75000000) and registers the replacement railcar AVAILABLE."
        test_recipe:
          setup: ["pool FY2026 opening 100000000 with one COMMITTED commitment 25000000"]
          setup_api_calls:
            - { call: "POST /capital-pools", payload: { fiscal_year: 2026, opening_balance_cents: 100000000 }, as: SystemAdmin, captures: { pool: "$.data.id", pool_v: "$.data.version" } }
            - { call: "POST /capital-pools/${pool}/commitments", payload: { car_type: "COVERED_HOPPER", unit_cost_cents: 25000000, expected_pool_version: "${pool_v}" }, as: FleetPlanner, captures: { com: "$.data.id" } }
          trigger:
            - { call: "POST /capital-pools/${pool}/commitments/${com}/deliver", payload: { car_mark: "GATX1801", built_year: 2026 }, as: FleetPlanner }
            - { call: "GET /capital-pools/${pool}", payload: {}, as: FleetPlanner }
          assert:
            - "PurchaseCommitment.${com}.status == DELIVERED and delivered_car_mark == GATX1801"
            - "CapitalPool.${pool}: committed_cents == 0, delivered_spend_cents == 25000000, available_cents == 75000000"
            - "new Railcar GATX1801 exists with status AVAILABLE, car_type COVERED_HOPPER, built_year 2026 (cascade-created)"

  - section: consistency_model
    instances:
      - name: mutation_visible_in_same_response
        claim_type: immediate_visibility
        grounds: ["complexity_profile.consistency_model"]
        distinguishing_aspect: "Immediate consistency: the deliver response itself shows status ON_LEASE and actual_on_lease_date == 2026-08-01 — no re-read or wait is needed."
        test_recipe:
          setup: ["assignment SCHEDULED at default clock 2026-08-01"]
          setup_api_calls:
            - { call: "POST /tariff-rates", payload: { car_type: "COVERED_HOPPER", rate_kind: "CAR_HIRE_BASE", effective_from: "2026-01-01", effective_to: "2027-01-01", unit_rate_cents: 9000 }, as: LeaseAdmin }
            - { call: "POST /tariff-rates", payload: { car_type: "COVERED_HOPPER", rate_kind: "MILEAGE_CREDIT", effective_from: "2026-01-01", effective_to: "2027-01-01", unit_rate_cents: 55 }, as: LeaseAdmin }
            - { call: "POST /lessees", payload: { company_name: "L", credit_tier: "TIER_A", credit_limit_cents: 100000000, security_deposit_cents: 0 }, as: LeaseAdmin, captures: { les: "$.data.id" } }
            - { call: "POST /railcars", payload: { car_mark: "GATX1901", car_type: "COVERED_HOPPER", built_year: 2015 }, as: FleetPlanner, captures: { car: "$.data.id" } }
            - { call: "POST /lease-agreements", payload: { lessee_id: "${les}", lease_type: "FULL_SERVICE", base_daily_rate_cents: 5000, car_hire_lessor_share_pct: 100, authorized_repair_cap_cents: 20000, start_date: "2026-08-01", end_date: "2027-07-31" }, as: LeaseAdmin, captures: { lea: "$.data.id" } }
            - { call: "POST /lease-agreements/${lea}/submit", payload: {}, as: LeaseAdmin }
            - { call: "POST /lease-agreements/${lea}/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-assignments", payload: { lease_id: "${lea}", railcar_id: "${car}", planned_commodity: "GRAIN", scheduled_start: "2026-08-01", scheduled_end: "2026-12-31" }, as: FleetPlanner, captures: { asg: "$.data.id" } }
          trigger:
            - { call: "POST /lease-assignments/${asg}/deliver", payload: {}, as: FleetPlanner, captures: { st: "$.data.status", dt: "$.data.actual_on_lease_date" } }
          assert:
            - "deliver response: status == ON_LEASE and actual_on_lease_date == 2026-08-01 in the same response body"
            - "GET /railcars/${car} immediately after shows status == ON_LEASE"
