          assert:
            - "ParticipantRecord.${pr_id}.accounting_liability_cents == 35400142 — annual 3000012 * 118000 / 10000 has quotient 35400141.6 and rounds up"
            - "ParticipantRecord.${pr_id}.settlement_liability_cents == 37875152 — annual 3000012 * 126250 / 10000 is exactly 37875151.5 and half rounds up, never down and never to even"
            - "ParticipantRecord.${pd_id}.accounting_liability_cents == 11460000 and settlement_liability_cents == 12540000 — the deferred-vested factors 95500 and 104500 divide exactly"
            - "the settlement basis exceeds the accounting basis for both cohorts, which is what makes an insurer buyout dearer than the book liability"
            - "after DEATH_MATCH ParticipantRecord.${pr_id}.mortality_status == DECEASED_CONFIRMED with accounting_liability_cents == 0 and settlement_liability_cents == 0"
            - "ParticipantRecord.${pd_id}.accounting_liability_cents is still 11460000 — the death zeroes one record only"

      - name: funded_status_read_reports_both_bases_and_re_derives_after_a_valuation
        claim_type: precision
        grounds:
          - calculations.funded_status_measurement
          - endpoints.GET_/prt/plans/{id}/funded-status
          - constants.SETTLEMENT_BASIS_UPLIFT_BP
        distinguishing_aspect: |
          Funded status is integer basis points from a non-terminating division:
          20000000 against 30000000 is 6666.67 and must round up to 6667, while the
          settlement basis divides the same assets by the 10700 bp uplifted liability
          of 32100000 for 6231. A valuation update to 33000000 of assets must
          re-derive both figures and collapse the settlement gap to zero rather than
          reporting a negative gap. A float implementation lands on 6666 or 6230.
        test_recipe:
          setup:
            - "one PensionPlan with liability 30000000 and assets 20000000, plus one DEFERRED_VESTED participant at stated 100000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlanSponsor
              as_user_id: "sponsor-treasury-01"
            - call: "POST /prt/plans"
              payload: { sponsor_name: "Ashcroft Machining", plan_name: "Ashcroft Hourly Plan", plan_ein: "231004557", total_liability_cents: 30000000, plan_assets_cents: 20000000, service_cost_cents: 1000000, interest_cost_cents: 2000000, unrecognized_actuarial_loss_cents: 500000, discount_rate_bps: 480 }
              as: PlanSponsor
              as_user_id: "sponsor-treasury-01"
              captures: { plan_id: $.data.id, plan_v: $.data.version }
            - call: "POST /prt/plans/${plan_id}/participants"
              payload: { participant_reference: "AC-0070", cohort: "DEFERRED_VESTED", stated_monthly_benefit_cents: 100000, final_average_monthly_earnings_cents: 250000, credited_service_months: 320, date_of_birth: "1968-04-04" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { p1_id: $.data.id }
          trigger:
            - call: "GET /prt/plans/${plan_id}/funded-status"
              payload: {}
              as: Regulator
              as_user_id: "regulator-01"
              captures: { acct_bp: $.data.accounting_funded_status_bp, settle_liab: $.data.settlement_basis_liability_cents, settle_bp: $.data.settlement_funded_status_bp, gap: $.data.unfunded_settlement_gap_cents, plt: $.data.participant_liability_total_cents }
            - call: "POST /prt/plans/${plan_id}/valuation-updates"
              payload: { expected_plan_version: "${plan_v}", total_liability_cents: 30000000, plan_assets_cents: 33000000, service_cost_cents: 1000000, interest_cost_cents: 2000000, unrecognized_actuarial_loss_cents: 500000, discount_rate_bps: 480 }
              as: Actuary
              as_user_id: "actuary-01"
              captures: { plan_v2: $.data.version }
            - call: "GET /prt/plans/${plan_id}/funded-status"
              payload: {}
              as: Regulator
              as_user_id: "regulator-01"
              captures: { acct_bp2: $.data.accounting_funded_status_bp, settle_bp2: $.data.settlement_funded_status_bp, gap2: $.data.unfunded_settlement_gap_cents }
          assert:
            - "accounting_funded_status_bp == 6667 — 20000000 * 10000 / 30000000 is 6666.67 and rounds half up"
            - "settlement_basis_liability_cents == 32100000 (30000000 * 10700 / 10000)"
            - "settlement_funded_status_bp == 6231 — 20000000 * 10000 / 32100000 is 6230.53 and rounds up"
            - "unfunded_settlement_gap_cents == 12100000 (32100000 minus 20000000) and participant_liability_total_cents == 11460000, the sum over the one IN_PLAN participant"
            - "cumulative_settlement_charge_cents == 0 and deferred_settlement_charge_cents == 0 before any settlement"
            - "after the valuation update accounting_funded_status_bp == 11000 (33000000 * 10000 / 30000000, an exact quotient) and settlement_funded_status_bp == 10280"
            - "unfunded_settlement_gap_cents == 0 after the update — the gap is floored at zero and never reported negative"
            - "PensionPlan.${plan_id}.version == 2 after the valuation update"

      - name: benefit_recomputation_caps_credited_service_at_420_months
        claim_type: correct_result
        grounds:
          - calculations.benefit_recomputation
          - constants.MAX_CREDITED_SERVICE_MONTHS
          - constants.BENEFIT_ACCRUAL_RATE_BP
        distinguishing_aspect: |
          The accrual formula is capped: 480 credited months and 600 credited months
          must both recompute to the 420-month benefit of 52500, so two audits taken
          at different overrides produce the identical figure and both pass against a
          stated 52500. An implementation that uses the raw month count returns 60000
          for the first and 75000 for the second, and both audits would demand
          corrections.
        test_recipe:
          setup:
            - "one PensionPlan with a DEFERRED_VESTED participant at stated 52500, FAME 100000 and 480 credited months"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Actuary
              as_user_id: "actuary-01"
            - call: "POST /prt/plans"
              payload: { sponsor_name: "Ashcroft Machining", plan_name: "Ashcroft Salaried Plan", plan_ein: "231004556", total_liability_cents: 100000000, plan_assets_cents: 92000000, service_cost_cents: 3000000, interest_cost_cents: 9000000, unrecognized_actuarial_loss_cents: 4000000, discount_rate_bps: 500 }
              as: PlanSponsor
              as_user_id: "sponsor-treasury-01"
              captures: { plan_id: $.data.id }
            - call: "POST /prt/plans/${plan_id}/participants"
              payload: { participant_reference: "AC-LONG", cohort: "DEFERRED_VESTED", stated_monthly_benefit_cents: 52500, final_average_monthly_earnings_cents: 100000, credited_service_months: 480, date_of_birth: "1958-09-09" }
              as: PlanAdministrator
              as_user_id: "tpa-ops-01"
              captures: { p1_id: $.data.id, p1_v: $.data.version }
          trigger:
            - call: "POST /prt/participants/${p1_id}/benefit-audits"
              payload: { expected_participant_version: "${p1_v}" }
              as: Actuary
              as_user_id: "actuary-01"
              captures: { a1_id: $.data.id, a1_recomputed: $.data.recomputed_monthly_benefit_cents, a1_variance: $.data.variance_cents, a1_status: $.data.audit_status }
            - call: "POST /prt/benefit-audits/${a1_id}/resolution"
              payload: { resolution: "ACCEPT_AS_IS" }
              as: Actuary
              as_user_id: "actuary-01"
            - call: "GET /prt/participants/${p1_id}"
              payload: {}
              as: Actuary
              as_user_id: "actuary-01"
              captures: { p1_v2: $.data.version }
            - call: "POST /prt/participants/${p1_id}/benefit-audits"
              payload: { expected_participant_version: "${p1_v2}", credited_service_months: 600 }
              as: Actuary
              as_user_id: "actuary-01"
              captures: { a2_id: $.data.id, a2_recomputed: $.data.recomputed_monthly_benefit_cents, a2_variance: $.data.variance_cents, a2_status: $.data.audit_status }
          assert:
            - "BenefitAudit.${a1_id}.recomputed_monthly_benefit_cents == 52500 — 100000 * min(480, 420) * 150 / 120000, not 100000 * 480 * 150 / 120000 == 60000"
            - "variance_cents == 0 so audit_status == PASSED and the audit did not fork to CORRECTION_REQUIRED"
            - "the second audit at 600 credited months also recomputes 52500 with variance_cents == 0 — the cap makes the formula flat above 420 months"
            - "BenefitAudit.${a2_id}.audit_sequence == 2 and the first audit is SUPERSEDED"
            - "ParticipantRecord.${p1_id}.audited_monthly_benefit_cents == 52500 and accounting_liability_cents == 6016500 (annual 630000 * 95500 / 10000) after the first audit closed"

      - name: tranche_liability_sums_only_the_participants_actually_assigned
