# =============================================================================
# NEMT (Non-Emergency Medical Transport) benchmark seed tables — Expert tier
# §1.0–§1.7 (SCAFFOLD.yaml). §1.8 and §1.9 live in sibling files.
# =============================================================================

scenario: |
  Non-Emergency Medical Transport (NEMT, ModivCare style): trip request &
  eligibility (Medicaid level of service), modality (ambulatory/wheelchair/
  stretcher), broker network & driver assignment, will-call return & dwell
  time, mileage & dead-head calculation, standing orders (recurring dialysis),
  no-show/late, claim & encounter reconciliation

domain_name: nemt-medical-transport
api_prefix: /   # flat topology: all entity collections live at the root, no single nesting prefix

# -----------------------------------------------------------------------------
# Complexity profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: ledger_reconciliation        # broker Claim vs captured Encounter -> divergent allowed cost
  secondary_archetype: selector_policy             # broker network + driver assignment from a candidate pool
  complexity_layers:
    - dual_variant_calculation                     # claimed cost (forward, scheduled mileage) vs encounter cost (chronological, odometer)
    - cascading_side_effects                        # member ineligible -> trips frozen -> legs cancelled -> standing order paused
    - rate_threshold_triggers                       # no-show strike threshold, dead-head free-miles threshold
    - optimistic_concurrency                        # OCC on TripRequest.version for assignment create-supersede

  entity_topology: flat
  # Peer entities linked by foreign keys; TripRequest is the hub, Leg/Claim/
  # Encounter/Assignment reference it by id. No deep URL nesting.

  state_machine_shape: parallel
  # TripRequest carries two independent state axes: trip_status (lifecycle) and
  # billing_status (claim/encounter reconciliation). Leg has a cyclic
  # will-call sub-lifecycle. Member eligibility gates trip transitions.

  relationship_patterns:
    - one_to_many        # TripRequest -> Leg, Broker -> Driver, Member -> TripRequest
    - flat_references    # Assignment, Claim, Encounter reference TripRequest by FK
    - cross_aggregate    # StandingOrder generates TripRequest instances

  role_model: peer_roles
  # Coordinator (intake/eligibility/scheduling), Broker (assignment/dispatch),
  # Driver (entity_backed, executes legs), Auditor (claim/encounter recon).

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Member
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: medicaid_id, type: string, source: input, description: "State Medicaid identifier; unique among Members" }
      - { name: full_name, type: string, source: input, description: "Member full name" }
      - { name: mobility_level, type: enum, source: input, description: "AMBULATORY | WHEELCHAIR | STRETCHER — the highest modality the member is approved to require", constraints: "one of AMBULATORY, WHEELCHAIR, STRETCHER" }
      - { name: home_county, type: string, source: input, description: "County code used for dead-head origin radius and broker network coverage" }
      - { name: eligibility_status, type: enum, source: system, description: "ELIGIBLE | SUSPENDED | TERMINATED — derived posture aggregated from EligibilitySpan rows and the current clock", constraints: "one of ELIGIBLE, SUSPENDED, TERMINATED" }
      - { name: noshow_strike_count, type: integer, source: system, description: "Rolling count of NO_SHOW legs in the active window; starts at 0", default: 0 }
      - { name: standing_orders_paused, type: boolean, source: system, description: "True when eligibility lapse has paused recurrence generation", default: false }

  - name: EligibilitySpan
    parent: null
    common_fields: false   # id, created_at only — append-only coverage record, immutable
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the covered member" }
      - { name: level_of_service, type: enum, source: input, description: "ROUTINE | URGENT | BARIATRIC — Medicaid level of service authorized for this span", constraints: "one of ROUTINE, URGENT, BARIATRIC" }
      - { name: coverage_start, type: datetime, source: input, description: "Inclusive start of coverage (ISO 8601 UTC)" }
      - { name: coverage_end, type: datetime, source: input, description: "Exclusive end of coverage (ISO 8601 UTC); half-open interval [start, end)" }
      - { name: voided, type: boolean, source: system, description: "True if span was retroactively voided; voided spans do not contribute to eligibility", default: false }

  - name: Broker
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Broker (transportation provider network) name" }
      - { name: covered_counties, type: array, source: input, description: "List of county codes this broker serves" }
      - { name: max_modality, type: enum, source: input, description: "AMBULATORY | WHEELCHAIR | STRETCHER — the highest modality this broker can fulfill", constraints: "one of AMBULATORY, WHEELCHAIR, STRETCHER" }
      - { name: free_deadhead_miles, type: number, source: input, description: "Free dead-head allowance in miles before dead-head is billable for this broker" }
      - { name: deadhead_rate_cents_per_mile, type: integer, source: input, description: "Cents charged per billable dead-head mile" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED — suspended brokers cannot receive new assignments", constraints: "one of ACTIVE, SUSPENDED" }

  - name: Driver
    parent: null
    common_fields: true
    fields:
      - { name: broker_id, type: string, source: input, description: "FK -> Broker.id; the broker network this driver belongs to" }
      - { name: full_name, type: string, source: input, description: "Driver full name" }
      - { name: vehicle_modality, type: enum, source: input, description: "AMBULATORY | WHEELCHAIR | STRETCHER — highest modality this vehicle supports", constraints: "one of AMBULATORY, WHEELCHAIR, STRETCHER" }
      - { name: base_county, type: string, source: input, description: "County the driver garages in; dead-head origin for mileage" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | ON_TRIP | OFFLINE", constraints: "one of AVAILABLE, ON_TRIP, OFFLINE" }

  - name: RateSchedule
    parent: null
    common_fields: false   # id, created_at only — configuration, immutable once created
    fields:
      - { name: modality, type: enum, source: input, description: "AMBULATORY | WHEELCHAIR | STRETCHER — the modality this rate row applies to", constraints: "one of AMBULATORY, WHEELCHAIR, STRETCHER" }
      - { name: base_fare_cents, type: integer, source: input, description: "Flat base fare for a leg of this modality, in cents" }
      - { name: loaded_rate_cents_per_mile, type: integer, source: input, description: "Cents per loaded (member-on-board) mile" }
      - { name: dwell_free_minutes, type: integer, source: input, description: "Free will-call dwell minutes before dwell surcharge accrues" }
      - { name: dwell_cents_per_minute, type: integer, source: input, description: "Cents per billable dwell minute beyond the free allowance" }

  - name: TripRequest
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the rider" }
      - { name: standing_order_id, type: string, source: input, description: "FK -> StandingOrder.id; set only on trips generated from a recurring order, else null", default: null }
      - { name: modality, type: enum, source: input, description: "AMBULATORY | WHEELCHAIR | STRETCHER — modality required for this trip", constraints: "one of AMBULATORY, WHEELCHAIR, STRETCHER" }
      - { name: requested_level_of_service, type: enum, source: input, description: "ROUTINE | URGENT | BARIATRIC — level of service requested for this trip", constraints: "one of ROUTINE, URGENT, BARIATRIC" }
      - { name: appointment_at, type: datetime, source: input, description: "Scheduled appointment time (ISO 8601 UTC); outbound leg must arrive by this time" }
      - { name: is_round_trip, type: boolean, source: input, description: "True if a return leg is required", default: true }
      - { name: return_is_will_call, type: boolean, source: input, description: "True if the RETURN leg is a will-call (member calls when ready); carried onto the RETURN Leg at schedule time", default: false }
      - { name: trip_status, type: enum, source: system, description: "Lifecycle axis: DRAFT | SCHEDULED | ASSIGNED | IN_PROGRESS | COMPLETED | CANCELLED | NO_SHOW", constraints: "one of DRAFT, SCHEDULED, ASSIGNED, IN_PROGRESS, COMPLETED, CANCELLED, NO_SHOW" }
      - { name: billing_status, type: enum, source: system, description: "Billing axis, independent of trip_status: UNBILLED | CLAIMED | ENCOUNTERED | RECONCILED | DISPUTED", constraints: "one of UNBILLED, CLAIMED, ENCOUNTERED, RECONCILED, DISPUTED" }
      - { name: assigned_broker_id, type: string, source: system, description: "FK -> Broker.id; broker selected at assignment, else null", default: null }
      - { name: assigned_driver_id, type: string, source: system, description: "FK -> Driver.id; driver selected at assignment, else null", default: null }
      - { name: scheduled_loaded_miles, type: number, source: input, description: "Estimated loaded miles for the outbound leg at intake, used by the forward claimed-cost variant" }
      - { name: claimed_cost_cents, type: integer, source: computed, description: "Forward claimed cost computed at claim submission; 0 until claimed" }
      - { name: encounter_cost_cents, type: integer, source: computed, description: "Chronological encounter cost computed from leg actuals; 0 until encountered" }
      - { name: reconciliation_variance_cents, type: integer, source: computed, description: "encounter_cost_cents - claimed_cost_cents at reconciliation; 0 until reconciled" }

  - name: Leg
    parent: null
    common_fields: true
    fields:
      - { name: trip_id, type: string, source: input, description: "FK -> TripRequest.id; the owning trip" }
      - { name: direction, type: enum, source: system, description: "OUTBOUND | RETURN", constraints: "one of OUTBOUND, RETURN" }
      - { name: is_will_call, type: boolean, source: input, description: "True if the return leg is a will-call (member calls when ready); only meaningful for RETURN", default: false }
      - { name: leg_status, type: enum, source: system, description: "PENDING | EN_ROUTE | ARRIVED | PICKED_UP | DROPPED_OFF | NO_SHOW | CANCELLED — return will-call legs cycle PENDING<->READY", constraints: "one of PENDING, READY, EN_ROUTE, ARRIVED, PICKED_UP, DROPPED_OFF, NO_SHOW, CANCELLED" }
      - { name: ready_called_at, type: datetime, source: system, description: "When the member called ready on a will-call return leg (ISO 8601 UTC); null otherwise", default: null }
      - { name: arrived_at, type: datetime, source: system, description: "Driver arrival timestamp at pickup (ISO 8601 UTC); null until ARRIVED", default: null }
      - { name: picked_up_at, type: datetime, source: system, description: "Member boarding timestamp (ISO 8601 UTC); null until PICKED_UP", default: null }
      - { name: dropped_off_at, type: datetime, source: system, description: "Drop-off timestamp (ISO 8601 UTC); null until DROPPED_OFF", default: null }
      - { name: odometer_loaded_miles, type: number, source: input, description: "Actual loaded miles recorded at drop-off; 0 until DROPPED_OFF", default: 0 }
      - { name: dwell_minutes, type: integer, source: computed, description: "Billable dwell on a will-call return = clamp(picked_up_at - ready_called_at) minus free allowance; 0 otherwise", default: 0 }

  - name: Assignment
    parent: null
    common_fields: true
    fields:
      - { name: trip_id, type: string, source: input, description: "FK -> TripRequest.id; the trip this assignment binds" }
      - { name: broker_id, type: string, source: system, description: "FK -> Broker.id; broker chosen by the selector" }
      - { name: driver_id, type: string, source: system, description: "FK -> Driver.id; driver chosen by the selector" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUPERSEDED | RELEASED — only one ACTIVE assignment per trip", constraints: "one of ACTIVE, SUPERSEDED, RELEASED" }
      - { name: deadhead_miles, type: number, source: computed, description: "Dead-head distance from driver.base_county to member.home_county at assignment time" }

  - name: StandingOrder
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; recurring rider (e.g. dialysis)" }
      - { name: modality, type: enum, source: input, description: "AMBULATORY | WHEELCHAIR | STRETCHER for every generated trip", constraints: "one of AMBULATORY, WHEELCHAIR, STRETCHER" }
      - { name: level_of_service, type: enum, source: input, description: "ROUTINE | URGENT | BARIATRIC for every generated trip", constraints: "one of ROUTINE, URGENT, BARIATRIC" }
      - { name: weekday_mask, type: integer, source: input, description: "Bitmask of weekdays to generate on; bit 0 = Monday .. bit 6 = Sunday" }
      - { name: appointment_time_utc, type: string, source: input, description: "HH:MM:SS appointment time of day in UTC applied to each generated date" }
      - { name: scheduled_loaded_miles, type: number, source: input, description: "Loaded-mile estimate copied onto each generated TripRequest" }
      - { name: horizon_through, type: datetime, source: system, description: "Most recent date (exclusive) through which trips have been generated; null until first generation", default: null }
      - { name: status, type: enum, source: system, description: "ACTIVE | PAUSED | CANCELLED — PAUSED suppresses generation", constraints: "one of ACTIVE, PAUSED, CANCELLED" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: trip_id, type: string, source: input, description: "FK -> TripRequest.id; the billed trip" }
      - { name: broker_id, type: string, source: system, description: "FK -> Broker.id; the billing broker (copied from the trip's active assignment)" }
      - { name: billed_cents, type: integer, source: computed, description: "Forward claimed cost snapshot at submission (= TripRequest.claimed_cost_cents)" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | RECONCILED | DENIED — DENIED when no matching encounter exists at reconciliation", constraints: "one of SUBMITTED, RECONCILED, DENIED" }

  - name: Encounter
    parent: null
    common_fields: true
    fields:
      - { name: trip_id, type: string, source: input, description: "FK -> TripRequest.id; the trip whose actuals were captured" }
      - { name: captured_cents, type: integer, source: computed, description: "Chronological encounter cost from leg odometer + dwell actuals (= TripRequest.encounter_cost_cents)" }
      - { name: status, type: enum, source: system, description: "OPEN | RECONCILED — RECONCILED after matched against its claim", constraints: "one of OPEN, RECONCILED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Member eligibility posture (derived from EligibilitySpan + clock) ----
  - entity: Member
    field: eligibility_status
    initial_state: ELIGIBLE
    terminal_states: [TERMINATED]
    transitions:
      - from: ELIGIBLE
        to: SUSPENDED
        trigger: "POST /members/{id}/eligibility/recompute (no non-voided span covers the current clock)"
        actor: Coordinator
        preconditions:
          - "No non-voided EligibilitySpan has coverage_start <= now < coverage_end"
        side_effects:
          - "All TripRequest rows for this member in {SCHEDULED, ASSIGNED} -> CANCELLED (eligibility lapse cascade); see transitive_cascade"
          - "Each cascaded trip's OUTBOUND/RETURN Legs in {PENDING, READY, EN_ROUTE} -> CANCELLED"
          - "Each cascaded trip's ACTIVE Assignment -> RELEASED, assigned_driver_id's Driver ON_TRIP -> AVAILABLE"
          - "member.standing_orders_paused set true; each ACTIVE StandingOrder for this member -> PAUSED"
      - from: SUSPENDED
        to: ELIGIBLE
        trigger: "POST /members/{id}/eligibility/recompute (a non-voided span now covers the current clock)"
        actor: Coordinator
        preconditions:
          - "Some non-voided EligibilitySpan has coverage_start <= now < coverage_end"
        side_effects:
          - "member.standing_orders_paused set false; PAUSED StandingOrders are NOT auto-resumed (require explicit resume)"
      - from: ELIGIBLE
        to: TERMINATED
        trigger: "POST /members/{id}/terminate"
        actor: Coordinator
        preconditions:
          - "Member has no TripRequest in {ASSIGNED, IN_PROGRESS} (ERR_DEPENDENCY_EXISTS otherwise)"
        side_effects:
          - "All ACTIVE/PAUSED StandingOrders for this member -> CANCELLED"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /members/{id}/terminate"
        actor: Coordinator
        preconditions:
          - "Member has no TripRequest in {ASSIGNED, IN_PROGRESS}"
        side_effects:
          - "All ACTIVE/PAUSED StandingOrders for this member -> CANCELLED"

  # ---- Broker availability ----
  - entity: Broker
    field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /brokers/{id}/suspend"
        actor: Coordinator
        preconditions: []
        side_effects:
          - "TripRequest rows with assigned_broker_id == this broker and trip_status == ASSIGNED -> SCHEDULED (assignment cascade)"
          - "Each such trip's ACTIVE Assignment -> RELEASED, its Driver ON_TRIP -> AVAILABLE, trip.assigned_broker_id/assigned_driver_id cleared"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /brokers/{id}/reinstate"
        actor: Coordinator
        preconditions: []
        side_effects: []

  # ---- Driver availability ----
  - entity: Driver
    field: status
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: ON_TRIP
        trigger: "system (Assignment created ACTIVE for this driver)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ON_TRIP
        to: AVAILABLE
        trigger: "system (Assignment RELEASED/SUPERSEDED, or trip COMPLETED/CANCELLED/NO_SHOW)"
        actor: system
        preconditions: []
        side_effects: []
      - from: AVAILABLE
        to: OFFLINE
        trigger: "POST /drivers/{id}/offline"
        actor: Broker
        preconditions: []
        side_effects: []
      - from: OFFLINE
        to: AVAILABLE
        trigger: "POST /drivers/{id}/online"
        actor: Broker
        preconditions: []
        side_effects: []

  # ---- TripRequest lifecycle axis (trip_status) ----
  - entity: TripRequest
    field: trip_status
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /trips/{id}/schedule"
        actor: Coordinator
        preconditions:
          - "member.eligibility_status == ELIGIBLE (cross_entity_state_dependency: TripRequest depends on Member)"
          - "trip.modality is supported by member.mobility_level ordering (AMBULATORY < WHEELCHAIR < STRETCHER): member.mobility_level rank >= trip.modality rank"
          - "Some non-voided EligibilitySpan covers appointment_at AND its level_of_service rank >= requested_level_of_service rank (ROUTINE < URGENT < BARIATRIC)"
        side_effects:
          - "OUTBOUND Leg created in PENDING; if is_round_trip a RETURN Leg created in PENDING with is_will_call = trip.return_is_will_call"
      - from: SCHEDULED
        to: ASSIGNED
        trigger: "POST /trips/{id}/assign"
        actor: Broker
        preconditions:
          - "member.eligibility_status == ELIGIBLE"
          - "A candidate (Broker, Driver) pair exists per the broker_driver_selection policy (else ERR_NO_BROKER_AVAILABLE)"
          - "expected_trip_version matches trip.version (OCC)"
        side_effects:
          - "Assignment created ACTIVE with selected broker_id/driver_id; deadhead_miles computed (deadhead_billing)"
          - "trip.assigned_broker_id/assigned_driver_id set; selected Driver AVAILABLE -> ON_TRIP; increments TripRequest.version by 1"
      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "POST /legs/{id}/depart (first leg departs; system promotes the trip)"
        actor: Driver
        preconditions:
          - "The departing Leg belongs to this trip and is OUTBOUND in PENDING"
        side_effects:
          - "OUTBOUND Leg PENDING -> EN_ROUTE"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "system (all non-cancelled Legs of the trip reach DROPPED_OFF)"
        actor: system
        preconditions:
          - "Every non-CANCELLED Leg is DROPPED_OFF"
        side_effects:
          - "ACTIVE Assignment -> RELEASED; Driver ON_TRIP -> AVAILABLE"
      - from: IN_PROGRESS
        to: NO_SHOW
        trigger: "POST /legs/{id}/no-show (OUTBOUND leg, member absent)"
        actor: Driver
        preconditions:
          - "The leg is OUTBOUND and in ARRIVED (driver arrived, member never boarded)"
        side_effects:
          - "OUTBOUND Leg ARRIVED -> NO_SHOW; any RETURN Leg in {PENDING, READY} -> CANCELLED"
          - "member.noshow_strike_count incremented by 1 (noshow_strike_accrual); ACTIVE Assignment -> RELEASED; Driver -> AVAILABLE"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /trips/{id}/cancel"
        actor: Coordinator
        preconditions: []
        side_effects:
          - "All non-terminal Legs -> CANCELLED"
      - from: ASSIGNED
        to: CANCELLED
        trigger: "POST /trips/{id}/cancel"
        actor: Coordinator
        preconditions: []
        side_effects:
          - "All non-terminal Legs -> CANCELLED; ACTIVE Assignment -> RELEASED; Driver ON_TRIP -> AVAILABLE; assigned ids cleared"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /trips/{id}/cancel"
        actor: Coordinator
        preconditions: []
        side_effects: []

  # ---- TripRequest billing axis (billing_status) — parallel dimension ----
  - entity: TripRequest
    field: billing_status
    initial_state: UNBILLED
    terminal_states: [RECONCILED]
    transitions:
      - from: UNBILLED
        to: CLAIMED
        trigger: "POST /claims (broker submits claim for a completed trip)"
        actor: Broker
        preconditions:
          - "trip.trip_status == COMPLETED (cross_entity_state_dependency: billing axis depends on lifecycle axis of same entity)"
          - "No existing Claim for this trip"
        side_effects:
          - "Claim created SUBMITTED; trip.claimed_cost_cents computed (claimed_cost_forward); Claim.billed_cents = trip.claimed_cost_cents"
      - from: CLAIMED
        to: ENCOUNTERED
        trigger: "POST /encounters (auditor captures trip actuals)"
        actor: Auditor
        preconditions:
          - "trip.trip_status == COMPLETED"
          - "No existing Encounter for this trip"
        side_effects:
          - "Encounter created OPEN; trip.encounter_cost_cents computed (encounter_cost_chronological); Encounter.captured_cents = trip.encounter_cost_cents"
      - from: ENCOUNTERED
        to: RECONCILED
        trigger: "POST /trips/{id}/reconcile"
        actor: Auditor
        preconditions:
          - "Trip has both a SUBMITTED Claim and an OPEN Encounter"
        side_effects:
          - "trip.reconciliation_variance_cents = encounter_cost_cents - claimed_cost_cents (reconciliation_variance); Claim -> RECONCILED; Encounter -> RECONCILED"
      - from: ENCOUNTERED
        to: DISPUTED
        trigger: "POST /trips/{id}/reconcile (variance magnitude exceeds tolerance)"
        actor: Auditor
        preconditions:
          - "Trip has both a SUBMITTED Claim and an OPEN Encounter"
          - "abs(encounter_cost_cents - claimed_cost_cents) > VARIANCE_TOLERANCE_CENTS"
        side_effects:
          - "trip.reconciliation_variance_cents set; Claim stays SUBMITTED; Encounter stays OPEN (manual review)"
      - from: DISPUTED
        to: RECONCILED
        trigger: "POST /trips/{id}/reconcile/override"
        actor: Auditor
        preconditions: []
        side_effects:
          - "Claim -> RECONCILED; Encounter -> RECONCILED (variance accepted under override)"

  # ---- Leg lifecycle incl. cyclic will-call return ----
  - entity: Leg
    field: leg_status
    initial_state: PENDING
    terminal_states: [DROPPED_OFF, NO_SHOW, CANCELLED]
    transitions:
      - from: PENDING
        to: READY
        trigger: "POST /legs/{id}/ready (member calls ready on a will-call RETURN leg)"
        actor: Coordinator
        preconditions:
          - "direction == RETURN AND is_will_call == true"
          - "parent trip is IN_PROGRESS AND the OUTBOUND leg is DROPPED_OFF (resource_temporal_overlap / sequencing)"
        side_effects:
          - "ready_called_at stamped to current clock"
      - from: READY
        to: PENDING
        trigger: "POST /legs/{id}/cancel-ready (member not actually ready; will-call retracted)"
        actor: Coordinator
        preconditions:
          - "direction == RETURN AND is_will_call == true"
        side_effects:
          - "ready_called_at cleared to null (cycle READY -> PENDING)"
      - from: PENDING
        to: EN_ROUTE
        trigger: "POST /legs/{id}/depart"
        actor: Driver
        preconditions:
          - "direction == OUTBOUND (a non-will-call leg departs directly from PENDING)"
        side_effects:
          - "trip ASSIGNED -> IN_PROGRESS on the OUTBOUND first departure"
      - from: READY
        to: EN_ROUTE
        trigger: "POST /legs/{id}/depart"
        actor: Driver
        preconditions:
          - "direction == RETURN AND is_will_call == true AND ready_called_at is set"
        side_effects: []
      - from: EN_ROUTE
        to: ARRIVED
        trigger: "POST /legs/{id}/arrive"
        actor: Driver
        preconditions: []
        side_effects:
          - "arrived_at stamped to current clock"
      - from: ARRIVED
        to: PICKED_UP
        trigger: "POST /legs/{id}/pickup"
        actor: Driver
        preconditions: []
        side_effects:
          - "picked_up_at stamped to current clock; if will-call RETURN, dwell_minutes computed (will_call_dwell)"
      - from: PICKED_UP
        to: DROPPED_OFF
        trigger: "POST /legs/{id}/dropoff"
        actor: Driver
        preconditions:
          - "odometer_loaded_miles >= 0 supplied in body"
        side_effects:
          - "dropped_off_at stamped; odometer_loaded_miles recorded; if all non-CANCELLED Legs DROPPED_OFF, trip IN_PROGRESS -> COMPLETED (bubble up)"
      - from: ARRIVED
        to: NO_SHOW
        trigger: "POST /legs/{id}/no-show"
        actor: Driver
        preconditions:
          - "direction == OUTBOUND"
        side_effects:
          - "trip IN_PROGRESS -> NO_SHOW (see trip lifecycle); RETURN leg cancelled; member strike incremented"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules — OCC on TripRequest.version
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: trip-assign-stale-version
    parent_entity: TripRequest
    write_endpoint: "POST /trips/{id}/assign"
    occ_field: "expected_trip_version"
    description: |
      Assigning a (broker, driver) to a TripRequest whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has already created an ACTIVE Assignment (which
      legitimately supersedes the prior under the assignment policy) and the
      current writer's view of the trip is therefore stale, so its
      assign would silently double-book the trip.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: claimed_cost_forward
    trigger: "TripRequest billing_status UNBILLED -> CLAIMED (POST /claims)"
    algorithm: forward_looking
    formula: |
      # Forward variant: priced from the SCHEDULED estimate captured at intake,
      # NOT from leg actuals. Round once at the end (sum-then-round is the
      # pinned order — see combinatorial_formula instance claimed_round_order).
      rate = RateSchedule row WHERE modality == trip.modality   # exactly one row
      loaded_component_cents = rate.loaded_rate_cents_per_mile * trip.scheduled_loaded_miles
      # round-trip estimate doubles loaded miles for the return; will-call dwell
      # is NOT forecastable at claim time, so claimed cost excludes dwell.
      leg_multiplier = 2 if trip.is_round_trip else 1
      base_component_cents = rate.base_fare_cents * leg_multiplier
      claimed_cost_cents = round_half_up(base_component_cents
                           + loaded_component_cents * leg_multiplier)
    input_set: "Single TripRequest in trip_status == COMPLETED; uses scheduled_loaded_miles (intake estimate), not odometer."
    constants: {}
    precision: "integer cents; round_half_up applied once after summation"
    variants:
      - name: forward_scheduled
        when: "claim submission"
        difference: "Uses scheduled_loaded_miles and the forecast round-trip doubling; ignores per-leg odometer and dwell entirely."

  - name: encounter_cost_chronological
    trigger: "TripRequest billing_status CLAIMED -> ENCOUNTERED (POST /encounters)"
    algorithm: chronological
    formula: |
      # Chronological variant: replays the trip's Legs in completion order
      # (dropped_off_at ASC; tie-break created_at ASC) and accumulates ACTUAL cost
      # per leg, rounding EACH leg to whole cents before summation (round-per-leg
      # then sum — the pinned order, divergent from claimed_cost_forward).
      rate = RateSchedule row WHERE modality == trip.modality
      total = 0
      for leg in Legs(trip) WHERE leg_status == DROPPED_OFF
               ORDER BY dropped_off_at ASC, created_at ASC:
        leg_cents = round_half_up(rate.base_fare_cents
                    + rate.loaded_rate_cents_per_mile * leg.odometer_loaded_miles
                    + rate.dwell_cents_per_minute * leg.dwell_minutes)
        total = total + leg_cents
      encounter_cost_cents = total
    input_set: "Only DROPPED_OFF Legs of the trip; CANCELLED/NO_SHOW legs excluded. Dwell included for will-call returns."
    constants: {}
    precision: "integer cents; round_half_up applied per leg, then summed"
    variants:
      - name: actual_odometer
        when: "encounter capture"
        difference: "Uses each leg's odometer_loaded_miles and computed dwell_minutes; rounds per leg before summing (vs forward's single final round)."

  - name: reconciliation_variance
    trigger: "TripRequest billing_status ENCOUNTERED -> RECONCILED or -> DISPUTED (POST /trips/{id}/reconcile)"
    algorithm: aggregation
    formula: |
      reconciliation_variance_cents = trip.encounter_cost_cents - trip.claimed_cost_cents
      # Sign convention: positive => encounter exceeds claim (under-billed broker).
      # Routing: if abs(variance) > VARIANCE_TOLERANCE_CENTS -> DISPUTED, else RECONCILED.
    input_set: "The single TripRequest, after both claimed_cost_forward and encounter_cost_chronological have run."
    constants:
      VARIANCE_TOLERANCE_CENTS: 500
    precision: "integer cents; exact subtraction"

  - name: deadhead_billing
    trigger: "TripRequest trip_status SCHEDULED -> ASSIGNED (Assignment created)"
    algorithm: threshold
    formula: |
      # Dead-head = empty miles the driver drives from base to the member before
      # the loaded trip. Billable miles only accrue ABOVE the broker's free
      # allowance; boundary is strict greater-than.
      raw_deadhead = COUNTY_DISTANCE_MILES(driver.base_county, member.home_county)
      Assignment.deadhead_miles = raw_deadhead          # stored raw, billed later
      if raw_deadhead > broker.free_deadhead_miles:      # strict '>' boundary
        billable = raw_deadhead - broker.free_deadhead_miles
      else:
        billable = 0
      deadhead_charge_cents = round_half_up(billable * broker.deadhead_rate_cents_per_mile)
    input_set: "Single Assignment; driver.base_county and member.home_county resolved via the COUNTY_DISTANCE_MILES matrix."
    constants:
      COUNTY_DISTANCE_MILES: "Symmetric matrix; same-county = 0. Test-seedable via POST /_geo/county_distance."
    precision: "integer cents; round_half_up after multiplication"

  - name: will_call_dwell
    trigger: "Leg ARRIVED -> PICKED_UP on a will-call RETURN leg (POST /legs/{id}/pickup)"
    algorithm: threshold
    formula: |
      # Dwell = how long the driver waits between member calling ready and
      # actually boarding, beyond the free allowance. Free minutes are subtracted;
      # boundary is strict greater-than (exactly free_minutes => 0 billable dwell).
      rate = RateSchedule row WHERE modality == trip.modality
      raw_dwell_minutes = floor((leg.picked_up_at - leg.ready_called_at) in whole minutes)
      if raw_dwell_minutes > rate.dwell_free_minutes:    # strict '>' boundary
        leg.dwell_minutes = raw_dwell_minutes - rate.dwell_free_minutes
      else:
        leg.dwell_minutes = 0
    input_set: "Single will-call RETURN Leg; requires ready_called_at and picked_up_at both set. Non-will-call legs: dwell_minutes stays 0."
    constants: {}
    precision: "integer minutes; floor on the elapsed duration, then threshold subtraction"

  - name: noshow_strike_accrual
    trigger: "TripRequest trip_status IN_PROGRESS -> NO_SHOW (POST /legs/{id}/no-show)"
    algorithm: threshold
    formula: |
      member.noshow_strike_count = member.noshow_strike_count + 1
      # When the count CROSSES the threshold (>= boundary), the member is auto-suspended.
      if member.noshow_strike_count >= NOSHOW_SUSPEND_THRESHOLD:
        member.eligibility_status = SUSPENDED   # auto-suspend cascade fires (same as eligibility lapse)
    input_set: "Single Member; strike incremented on each OUTBOUND no-show."
    constants:
      NOSHOW_SUSPEND_THRESHOLD: 3
    precision: "integer count; '>=' boundary on suspension"

  - name: standing_order_generation
    trigger: "POST /standing-orders/{id}/generate (idempotent rolling-horizon generation)"
    algorithm: projection
    formula: |
      # Generate one DRAFT TripRequest per matching weekday in
      # [generate_from, generate_through), in ascending date order. Idempotent:
      # already-generated dates (date < horizon_through) are skipped.
      effective_from = max(generate_from, order.horizon_through or generate_from)
      for date in [effective_from, generate_through) ascending:
        if (order.status == ACTIVE) and (order is not paused via member) and
           (weekday_mask bit for date.weekday is set):
          create TripRequest(member_id, modality, level_of_service,
                             appointment_at = date @ appointment_time_utc,
                             scheduled_loaded_miles, standing_order_id, trip_status=DRAFT)
      order.horizon_through = generate_through
    input_set: "Dates in the requested half-open window not already covered by horizon_through; only when order ACTIVE and member not paused."
    constants: {}
    precision: "whole calendar dates in UTC; weekday from ISO calendar"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and is a recognized role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this operation per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every resource id in the path exists (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_referential
    check: "Every foreign-key id in the body references an existing resource"
    error_id: ERR_FK_NOT_FOUND
    http_status: 422
    applies_to: "create endpoints with FK body fields"

  - priority: 5
    category: state
    check: "Target resource is in a state from which this transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 6
    category: business_constraint
    check: "Driver acting on a Leg must be the trip's assigned_driver_id; Broker submitting a claim must be the trip's assigned_broker_id"
    error_id: ERR_NOT_OWNER
    http_status: 403
    applies_to: "leg lifecycle endpoints, POST /claims"

  - priority: 7
    category: business_safety
    check: "Member eligibility must be ELIGIBLE for schedule and assign (eligibility gate precedes everything fiscal)"
    error_id: ERR_MEMBER_INELIGIBLE
    http_status: 409
    applies_to: "POST /trips/{id}/schedule, POST /trips/{id}/assign"

  - priority: 8
    category: business_safety
    check: "Requested modality must be within member.mobility_level rank, and the covering EligibilitySpan's level_of_service rank must be >= requested_level_of_service rank"
    error_id: ERR_LOS_NOT_AUTHORIZED
    http_status: 409
    applies_to: "POST /trips/{id}/schedule"

  - priority: 9
    category: business_constraint
    check: "Selected/eligible Broker max_modality rank and Driver vehicle_modality rank must each be >= trip.modality rank, and broker covered_counties must include member.home_county"
    error_id: ERR_MODALITY_MISMATCH
    http_status: 409
    applies_to: "POST /trips/{id}/assign"

  - priority: 10
    category: business_temporal
    check: "A will-call RETURN leg may only go READY/depart after its OUTBOUND leg is DROPPED_OFF (sequencing) and the trip is IN_PROGRESS"
    error_id: ERR_LEG_SEQUENCE_VIOLATION
    http_status: 409
    applies_to: "POST /legs/{id}/ready, POST /legs/{id}/depart (RETURN will-call)"

  - priority: 11
    category: business_constraint
    check: "At most one ACTIVE Assignment per trip; creating a second without superseding the first is rejected"
    error_id: ERR_ASSIGNMENT_EXISTS
    http_status: 409
    applies_to: "POST /trips/{id}/assign"

  - priority: 12
    category: business_referential
    check: "Reconcile requires both a SUBMITTED Claim and an OPEN Encounter for the trip; claim/encounter create requires no prior same-kind record"
    error_id: ERR_RECON_INCOMPLETE
    http_status: 409
    applies_to: "POST /trips/{id}/reconcile, POST /claims, POST /encounters"

  - priority: 13
    category: business_constraint
    check: "No candidate (Broker, Driver) pair satisfies the selection policy (covered county + modality + ACTIVE/AVAILABLE)"
    error_id: ERR_NO_BROKER_AVAILABLE
    http_status: 409
    applies_to: "POST /trips/{id}/assign"

  - priority: 14
    category: business_constraint
    check: "expected_trip_version mismatch on assign (OCC stale version)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /trips/{id}/assign"

  - priority: 15
    category: business_constraint
    check: "Terminating a member or cancelling that depends on no in-flight work (no ASSIGNED/IN_PROGRESS trips)"
    error_id: ERR_DEPENDENCY_EXISTS
    http_status: 409
    applies_to: "POST /members/{id}/terminate"

  - priority: 16
    category: business_constraint
    check: "Enum field value must be a declared member of the field's allowed set"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all create/transition endpoints with enum or numeric body fields"

