      yields planned_shop_hours 1620.00 with a field crew of 8 (against 4950.00 and 4), and a 3200 mm SLOTTED zone at height
      18.0 gets thermal_movement_allowance_mm 7.30 (system factor 1.25) with deflection_limit_mm 18.29 (L/175) instead of
      5.84 and 13.33.'
    test_recipe:
      setup:
      - logical clock 2026-08-03T08:00:00Z
      - package Tower A Facade with total_area_sqm 9000.0 and design_temp_delta_c 60.0, still UNDECIDED
