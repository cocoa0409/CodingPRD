          setup:
            - "Route R1, AMBIENT zone A1, AMBIENT SKU AMB-1 at 700 cents with 100 units, and two far-future slots on R1 with total_capacity_units 10 each (one per wave, since at most one DeliveryWave may exist per delivery_slot_id)."
