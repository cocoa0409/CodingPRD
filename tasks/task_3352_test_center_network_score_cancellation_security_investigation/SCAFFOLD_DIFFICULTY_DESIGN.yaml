              payload: { full_name: "Ex FC", date_of_birth: "2001-07-07", id_document_type: "PASSPORT", id_document_number: "PFC1", id_document_expiry: "2027-06-01" }
              as: ProgramAdmin
              captures: { ex_a: $.data.id }
            - call: "GET /ets/sessions/${s_id}"
              as: ScoreAnalyst
              captures: { s_v: $.data.version }
            - call: "POST /ets/sessions/${s_id}/registrations"
