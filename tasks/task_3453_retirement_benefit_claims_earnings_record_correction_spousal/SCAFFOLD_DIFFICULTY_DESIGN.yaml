- rule_id: non_linear_state_machine
  instances:
  - name: claim_suspend_resume_cycle_accrues_drc
    grounds:
    - state_machines.BenefitClaim.ENTITLED_to_SUSPENDED
    - state_machines.BenefitClaim.SUSPENDED_to_ENTITLED
    - calculations.age_adjustment
    - concurrency_rules[claim-suspend-stale-view]
    distinguishing_aspect: 'BenefitClaim exhibits a cycle (ENTITLED -> SUSPENDED -> ENTITLED) that mutates a calculation input: 24 suspended months
      accrue 24 DRCs, lifting the factor from 1.00 to 1.16 on resume. The cycle is on BenefitClaim — a different entity than the CorrectionRequest
      loops.'
    test_recipe:
      setup:
      - 'Worker ws: born 1964-06, earnings 2019-2023 at AWI -> PIA 20880; RETIREMENT entitled 2031-06 at FRA (monthly 20880)'
      - 'Clock 2031-12: suspension (age 810, within [804, 840)); clock 2033-12: resume (age 834)'
