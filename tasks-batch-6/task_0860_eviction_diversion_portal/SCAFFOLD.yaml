# =============================================================================
# PRD Benchmark Seed Tables — Eviction Diversion & Housing-Court Portal
# Difficulty: Expert
# =============================================================================

scenario: |
  860. Eviction Diversion & Housing-Court Portal: case filing & answer, mediation
  & payment-plan agreement, legal-aid & rental-assistance referral, hearing calendar
  & continuance, judgment & stay, sheriff lockout scheduling, sealing/expungement,
  outcome tracking

domain_name: eviction-diversion-portal
api_prefix: ""   # flat topology: multiple top-level collections (/cases, /courts, /referrals, ...)

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_deferred_actions
    - optimistic_concurrency

  entity_topology: flat        # peer entities linked by FK; no nested URL paths
  state_machine_shape: branching   # plus a cyclic negotiation loop and parallel outcome dimension
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic            # a Case is referenced by many workflow artefacts across aggregates

  role_model: segregation_of_duties   # a Judge may not rule on a case they mediated; peer party roles
  consistency_model: immediate

# =============================================================================
# Table 1.0: Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Court
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Housing court name" }
      - { name: jurisdiction_code, type: string, source: input, description: "Jurisdiction identifier (e.g. state/county code)" }
      - { name: hearing_daily_capacity, type: integer, source: input, description: "Max number of SCHEDULED hearings this court may hold on a single calendar date", constraints: ">= 1" }
      - { name: hearings_scheduled_count, type: integer, source: computed, description: "Live count of Hearing rows for this court whose status == SCHEDULED (calendar-load invariant)", default: 0 }

  - name: Landlord
    parent: null
    common_fields: false
    fields:
      - { name: name, type: string, source: input, description: "Landlord / plaintiff legal name" }
      - { name: email, type: string, source: input, description: "Contact email" }

  - name: Tenant
    parent: null
    common_fields: false
    fields:
      - { name: name, type: string, source: input, description: "Tenant / respondent legal name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: household_income_cents, type: integer, source: input, description: "Monthly household income in cents (drives rental-assistance income cap)", constraints: ">= 0" }
      - { name: household_size, type: integer, source: input, description: "Number of household members (drives rental-assistance income cap)", constraints: ">= 1" }

  - name: Officer
    parent: null
    common_fields: false
    fields:
      - { name: name, type: string, source: input, description: "Enforcement officer / sheriff deputy name" }
      - { name: badge_number, type: string, source: input, description: "Officer badge number" }
      - { name: agency, type: string, source: input, description: "Sheriff or marshal agency name" }

  - name: Case
    parent: null
    common_fields: true
    fields:
      - { name: court_id, type: string, source: input, description: "FK -> Court.id; the housing court where the case is docketed" }
      - { name: landlord_id, type: string, source: input, description: "FK -> Landlord.id; the filing party (plaintiff)" }
      - { name: tenant_id, type: string, source: input, description: "FK -> Tenant.id; the respondent party" }
      - { name: filing_type, type: enum, source: input, description: "NONPAYMENT | HOLDOVER | NUISANCE", constraints: "one of NONPAYMENT, HOLDOVER, NUISANCE" }
      - { name: claimed_arrears_cents, type: integer, source: input, description: "Arrears claimed at filing, in cents (0 for HOLDOVER/NUISANCE)", default: 0, constraints: ">= 0" }
      - { name: net_arrears_cents, type: integer, source: computed, description: "Dual-variant outstanding arrears (see calculations.case_net_arrears); provisional == claimed_arrears_cents at filing, final == claimed minus PAID installments minus DISBURSED rental assistance, floored at 0" }
      - { name: answer_due_at, type: datetime, source: computed, description: "created_at + ANSWER_WINDOW_DAYS; deadline after which the tenant loses the right to answer" }
      - { name: served_at, type: datetime, source: computed, description: "Logical-clock instant the case moved FILED -> SERVED" }
      - { name: status, type: enum, source: system, description: "FILED | SERVED | ANSWERED | DEFAULTED | IN_DIVERSION | IN_LITIGATION | JUDGMENT_ENTERED | ENFORCEMENT | CLOSED_ENFORCED | DIVERSION_SATISFIED | DISMISSED" }
      - { name: outcome, type: enum, source: computed, description: "Outcome-tracking dimension, evolves independently of status: PENDING | DIVERTED | JUDGMENT_FOR_LANDLORD | DISMISSED | ENFORCED", default: PENDING }
      - { name: closed_at, type: datetime, source: computed, description: "Logical-clock instant the case first reached a terminal status (CLOSED_ENFORCED | DIVERSION_SATISFIED | DISMISSED); null while open" }
      - { name: sealed, type: boolean, source: computed, description: "True once a SealingRequest for this case is GRANTED; sealed cases are excluded from default list results", default: false }

  - name: Answer
    parent: null
    common_fields: false
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; the case being answered" }
      - { name: defenses, type: array, source: input, description: "List of asserted defenses; enum members WARRANTY_OF_HABITABILITY | IMPROPER_SERVICE | RENT_PAID | RETALIATION | DISCRIMINATION" }
      - { name: rent_withheld_cents, type: integer, source: input, description: "Amount the tenant claims was lawfully withheld, in cents", default: 0, constraints: ">= 0" }
      - { name: is_late, type: boolean, source: computed, description: "True when filed strictly after the parent Case.answer_due_at logical-clock instant" }

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; the case this referral supports" }
      - { name: referral_type, type: enum, source: input, description: "LEGAL_AID | RENTAL_ASSISTANCE", constraints: "one of LEGAL_AID, RENTAL_ASSISTANCE" }
      - { name: provider_name, type: string, source: input, description: "Name of the aid organisation or assistance program" }
      - { name: requested_amount_cents, type: integer, source: computed, description: "RENTAL_ASSISTANCE only: award computed at the APPROVED decision (see calculations.rental_assistance_award, provisional variant); 0 for LEGAL_AID", default: 0 }
      - { name: disbursed_amount_cents, type: integer, source: computed, description: "RENTAL_ASSISTANCE only: amount actually paid at DISBURSED, recomputed against the case's current net arrears (see calculations.rental_assistance_award, final variant); 0 until DISBURSED", default: 0 }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | DENIED | DISBURSED" }

  - name: MediationSession
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; the case under mediation" }
      - { name: mediator_user_id, type: string, source: input, description: "X-User-ID of the Mediator conducting the session; recorded for segregation-of-duties enforcement against Judgment" }
      - { name: scheduled_at, type: datetime, source: input, description: "Logical-clock instant the session is scheduled for" }
      - { name: outcome_notes, type: string, source: input, description: "Free-text notes captured when the session is HELD", default: "" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | HELD | AGREEMENT | IMPASSE" }

  - name: PaymentPlan
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; the case this repayment plan settles" }
      - { name: proposed_by, type: enum, source: input, description: "LANDLORD | TENANT — the party that opened this negotiation", constraints: "one of LANDLORD, TENANT" }
      - { name: total_cents, type: integer, source: input, description: "Total amount to be repaid under the plan, in cents", constraints: ">= 1" }
      - { name: installment_count, type: integer, source: input, description: "Number of equal installments (last absorbs the rounding remainder)", constraints: ">= 1" }
      - { name: first_due_date, type: datetime, source: input, description: "Logical-clock date the first installment is due" }
      - { name: current_proposer, type: enum, source: computed, description: "Party whose turn it is to respond during negotiation: LANDLORD | TENANT", default: null }
      - { name: status, type: enum, source: system, description: "PROPOSED | COUNTERED | ACCEPTED | REJECTED | WITHDRAWN | COMPLETED | DEFAULTED" }

  - name: Installment
    parent: null
    common_fields: true
    fields:
      - { name: payment_plan_id, type: string, source: input, description: "FK -> PaymentPlan.id; the plan this installment belongs to" }
      - { name: sequence, type: integer, source: computed, description: "1-based ordinal position within the plan schedule" }
      - { name: amount_cents, type: integer, source: computed, description: "Installment amount; equal share floor for all but the final installment, which absorbs the remainder (see calculations.installment_schedule)" }
      - { name: due_date, type: datetime, source: computed, description: "first_due_date + (sequence-1) * INSTALLMENT_INTERVAL_DAYS" }
      - { name: paid_at, type: datetime, source: computed, description: "Logical-clock instant the installment was paid; null while DUE or MISSED" }
      - { name: status, type: enum, source: system, description: "DUE | PAID | MISSED" }

  - name: Hearing
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; the case being heard" }
      - { name: court_id, type: string, source: input, description: "FK -> Court.id; the court whose calendar this hearing occupies" }
      - { name: hearing_type, type: enum, source: input, description: "INITIAL | TRIAL | ENFORCEMENT", constraints: "one of INITIAL, TRIAL, ENFORCEMENT" }
      - { name: scheduled_start, type: datetime, source: input, description: "Half-open interval start [scheduled_start, scheduled_end) occupying the court calendar" }
      - { name: scheduled_end, type: datetime, source: input, description: "Half-open interval end; must be strictly after scheduled_start" }
      - { name: continuance_count, type: integer, source: computed, description: "Number of times this hearing lineage has been continued (incremented on the successor created by a CONTINUED transition)", default: 0 }
      - { name: continued_from_id, type: string, source: system, description: "FK -> Hearing.id; the predecessor hearing when this one was created by a continuance, else null" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | HELD | CONTINUED | CANCELLED" }

  - name: Judgment
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; the case adjudicated" }
      - { name: judgment_type, type: enum, source: input, description: "POSSESSION | DISMISSAL | DIVERSION — the fork determining downstream side effects", constraints: "one of POSSESSION, DISMISSAL, DIVERSION" }
      - { name: money_amount_cents, type: integer, source: computed, description: "Money judgment for POSSESSION: case final net_arrears + JUDGMENT_FILING_FEE_CENTS; 0 for DISMISSAL/DIVERSION (see calculations.money_judgment_amount)", default: 0 }
      - { name: stay_until, type: datetime, source: computed, description: "Logical-clock instant until which enforcement is stayed; set on STAYED, null otherwise" }
      - { name: entered_by_user_id, type: string, source: system, description: "X-User-ID of the Judge who entered the judgment (audit + SoD)" }
      - { name: status, type: enum, source: system, description: "ENTERED | STAYED | VACATED | SATISFIED" }

  - name: LockoutOrder
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; the case being enforced" }
      - { name: judgment_id, type: string, source: input, description: "FK -> Judgment.id; the possession judgment authorising the lockout" }
      - { name: officer_id, type: string, source: computed, description: "FK -> Officer.id; the officer assigned when the order is SCHEDULED, null while REQUESTED" }
      - { name: scheduled_at, type: datetime, source: computed, description: "Logical-clock instant the lockout is scheduled for; null while REQUESTED" }
      - { name: executed_at, type: datetime, source: computed, description: "Logical-clock instant the lockout was executed; null unless EXECUTED" }
      - { name: status, type: enum, source: system, description: "REQUESTED | SCHEDULED | EXECUTED | CANCELLED" }

  - name: SealingRequest
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; the closed case whose record is to be sealed/expunged" }
      - { name: basis, type: enum, source: input, description: "DISMISSAL | DIVERSION | TIME_ELAPSED — statutory basis asserted", constraints: "one of DISMISSAL, DIVERSION, TIME_ELAPSED" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the Judge who decided the request" }
      - { name: status, type: enum, source: system, description: "REQUESTED | GRANTED | DENIED" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: Case
    initial_state: FILED
    terminal_states: [CLOSED_ENFORCED, DIVERSION_SATISFIED, DISMISSED]
    transitions:
      - from: FILED
        to: SERVED
        trigger: "POST /cases/{caseId}/transition {to_status: SERVED}"
        actor: Clerk
        preconditions: []
        side_effects:
          - "served_at = current logical-clock instant"
          - "answer_due_at already fixed at creation = created_at + ANSWER_WINDOW_DAYS"

      - from: SERVED
        to: ANSWERED
        trigger: "POST /answers (system side-effect of Answer creation)"
        actor: system
        preconditions:
          - "An Answer row is created for this case"
        side_effects:
          - "Answer.is_late = (answer.created_at > case.answer_due_at)"

      - from: SERVED
        to: DEFAULTED
        trigger: "POST /cases/{caseId}/transition {to_status: DEFAULTED}"
        actor: Clerk
        preconditions:
          - "current logical-clock instant >= answer_due_at (ERR_ANSWER_WINDOW_OPEN if earlier)"
          - "no Answer exists for this case (ERR_ALREADY_ANSWERED)"
        side_effects: []

      - from: ANSWERED
        to: IN_DIVERSION
        trigger: "POST /mediation-sessions or POST /referrals (system side-effect)"
        actor: system
        preconditions:
          - "First MediationSession or Referral for the case is created"
        side_effects:
          - "outcome remains PENDING"

      - from: ANSWERED
        to: IN_LITIGATION
        trigger: "POST /cases/{caseId}/transition {to_status: IN_LITIGATION}"
        actor: Clerk
        preconditions: []
        side_effects: []

      - from: IN_DIVERSION
        to: IN_LITIGATION
        trigger: "POST /payment-plans/{planId}/transition {to_status: DEFAULTED} (cascade) or POST /cases/{caseId}/transition"
        actor: system
        preconditions: []
        side_effects:
          - "outcome remains PENDING"

      - from: IN_LITIGATION
        to: IN_DIVERSION
        trigger: "POST /payment-plans/{planId}/respond {decision: ACCEPT} or POST /mediation-sessions/{id}/transition {to_status: AGREEMENT} (cascade)"
        actor: system
        preconditions: []
        side_effects: []

      - from: IN_DIVERSION
        to: DIVERSION_SATISFIED
        trigger: "POST /referrals/{id}/transition {to_status: DISBURSED} with net_arrears reaching 0, or POST /installments/{id}/transition {to_status: PAID} completing the final installment (cascade)"
        actor: system
        preconditions:
          - "case net_arrears_cents (final variant) == 0, OR the case's ACCEPTED PaymentPlan has all installments PAID"
        side_effects:
          - "closed_at = current logical-clock instant"
          - "outcome = DIVERTED"
          - "any SCHEDULED Hearing for the case -> CANCELLED (frees court calendar slot)"
          - "any PROPOSED or COUNTERED PaymentPlan for the case -> WITHDRAWN"

      - from: IN_LITIGATION
        to: JUDGMENT_ENTERED
        trigger: "POST /judgments {judgment_type: POSSESSION} (system side-effect)"
        actor: system
        preconditions: []
        side_effects:
          - "outcome = JUDGMENT_FOR_LANDLORD"

      - from: DEFAULTED
        to: JUDGMENT_ENTERED
        trigger: "POST /judgments {judgment_type: POSSESSION} (system side-effect)"
        actor: system
        preconditions: []
        side_effects:
          - "outcome = JUDGMENT_FOR_LANDLORD"

      - from: JUDGMENT_ENTERED
        to: ENFORCEMENT
        trigger: "POST /lockout-orders/{id}/transition {to_status: SCHEDULED} (system side-effect)"
        actor: system
        preconditions: []
        side_effects: []

      - from: JUDGMENT_ENTERED
        to: DISMISSED
        trigger: "POST /judgments/{id}/transition {to_status: VACATED} (cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "closed_at = current logical-clock instant"
          - "outcome = DISMISSED"
          - "any REQUESTED or SCHEDULED LockoutOrder for the case -> CANCELLED (frees officer)"

      - from: IN_LITIGATION
        to: DISMISSED
        trigger: "POST /judgments {judgment_type: DISMISSAL} (system side-effect)"
        actor: system
        preconditions: []
        side_effects:
          - "closed_at = current logical-clock instant"
          - "outcome = DISMISSED"

      - from: ENFORCEMENT
        to: CLOSED_ENFORCED
        trigger: "POST /lockout-orders/{id}/transition {to_status: EXECUTED} (system side-effect)"
        actor: system
        preconditions: []
        side_effects:
          - "closed_at = current logical-clock instant"
          - "outcome = ENFORCED"

  - entity: Referral
    initial_state: SUBMITTED
    terminal_states: [DENIED, DISBURSED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /referrals/{referralId}/transition {to_status: APPROVED}"
        actor: ProgramAdmin
        preconditions:
          - "parent Case is not sealed and not in a terminal status"
        side_effects:
          - "For RENTAL_ASSISTANCE: requested_amount_cents = rental_assistance_award(provisional) = min(case net_arrears now, income cap, program budget remaining)"
          - "For LEGAL_AID: requested_amount_cents stays 0"

      - from: SUBMITTED
        to: DENIED
        trigger: "POST /referrals/{referralId}/transition {to_status: DENIED}"
        actor: ProgramAdmin
        preconditions: []
        side_effects: []

      - from: APPROVED
        to: DISBURSED
        trigger: "POST /referrals/{referralId}/transition {to_status: DISBURSED}"
        actor: ProgramAdmin
        preconditions:
          - "referral_type == RENTAL_ASSISTANCE (ERR_NOT_DISBURSABLE for LEGAL_AID)"
          - "program budget remaining >= 1 cent (ERR_ASSISTANCE_BUDGET_EXCEEDED if 0)"
        side_effects:
          - "disbursed_amount_cents = rental_assistance_award(final) = min(case net_arrears now, requested_amount_cents, program budget remaining)"
          - "case net_arrears_cents recomputed downward by disbursed_amount_cents (cascade hop 1)"
          - "if resulting case net_arrears_cents == 0 and case in IN_DIVERSION -> case DIVERSION_SATISFIED (cascade hop 2 -> hop 3 cancels hearings & withdraws plans)"

  - entity: MediationSession
    initial_state: SCHEDULED
    terminal_states: [AGREEMENT]
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "POST /mediation-sessions/{sessionId}/transition {to_status: HELD}"
        actor: Mediator
        preconditions:
          - "current logical-clock instant >= scheduled_at"
        side_effects: []

      - from: HELD
        to: AGREEMENT
        trigger: "POST /mediation-sessions/{sessionId}/transition {to_status: AGREEMENT}"
        actor: Mediator
        preconditions: []
        side_effects:
          - "if case in IN_LITIGATION -> case IN_DIVERSION"

      - from: HELD
        to: IMPASSE
        trigger: "POST /mediation-sessions/{sessionId}/transition {to_status: IMPASSE}"
        actor: Mediator
        preconditions: []
        side_effects: []

      - from: IMPASSE
        to: SCHEDULED
        trigger: "POST /mediation-sessions/{sessionId}/transition {to_status: SCHEDULED, scheduled_at: <new>}"
        actor: Mediator
        preconditions: []
        side_effects:
          - "scheduled_at updated to the new instant (cyclic re-schedule after impasse)"

  - entity: PaymentPlan
    initial_state: PROPOSED
    terminal_states: [ACCEPTED, REJECTED, WITHDRAWN, COMPLETED, DEFAULTED]
    transitions:
      - from: PROPOSED
        to: COUNTERED
        trigger: "POST /payment-plans/{planId}/respond {decision: COUNTER, new_total_cents, new_installment_count}"
        actor: Landlord
        preconditions:
          - "acting party is the current_proposer's counterparty (the one whose turn it is)"
        side_effects:
          - "total_cents, installment_count updated to the countered terms"
          - "current_proposer flips to the other party"

      - from: COUNTERED
        to: PROPOSED
        trigger: "POST /payment-plans/{planId}/respond {decision: COUNTER, new_total_cents, new_installment_count}"
        actor: Tenant
        preconditions:
          - "acting party is the current_proposer's counterparty"
        side_effects:
          - "total_cents, installment_count updated; current_proposer flips (negotiation cycle continues)"

      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /payment-plans/{planId}/respond {decision: ACCEPT}"
        actor: Tenant
        preconditions:
          - "acting party is the current_proposer's counterparty"
          - "total_cents >= case net_arrears_cents (final) (ERR_PLAN_INSUFFICIENT)"
        side_effects:
          - "current_proposer = null"
          - "installment_count Installment rows generated (see calculations.installment_schedule)"
          - "if case in ANSWERED or IN_LITIGATION -> case IN_DIVERSION"

      - from: COUNTERED
        to: ACCEPTED
        trigger: "POST /payment-plans/{planId}/respond {decision: ACCEPT}"
        actor: Landlord
        preconditions:
          - "acting party is the current_proposer's counterparty"
          - "total_cents >= case net_arrears_cents (final) (ERR_PLAN_INSUFFICIENT)"
        side_effects:
          - "installment schedule generated; if case in ANSWERED or IN_LITIGATION -> case IN_DIVERSION"

      - from: PROPOSED
        to: REJECTED
        trigger: "POST /payment-plans/{planId}/respond {decision: REJECT}"
        actor: Tenant
        preconditions:
          - "acting party is the current_proposer's counterparty"
        side_effects: []

      - from: COUNTERED
        to: REJECTED
        trigger: "POST /payment-plans/{planId}/respond {decision: REJECT}"
        actor: Landlord
        preconditions:
          - "acting party is the current_proposer's counterparty"
        side_effects: []

      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /cases/{caseId}/transition {to_status: DIVERSION_SATISFIED} (cascade)"
        actor: system
        preconditions: []
        side_effects: []

      - from: COUNTERED
        to: WITHDRAWN
        trigger: "POST /cases/{caseId}/transition {to_status: DIVERSION_SATISFIED} (cascade)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ACCEPTED
        to: COMPLETED
        trigger: "POST /installments/{installmentId}/transition {to_status: PAID} completing the final DUE installment (bubble-up)"
        actor: system
        preconditions:
          - "every Installment of this plan has status PAID"
        side_effects:
          - "case -> DIVERSION_SATISFIED (cascade)"

      - from: ACCEPTED
        to: DEFAULTED
        trigger: "POST /installments/{installmentId}/transition {to_status: MISSED} (bubble-up)"
        actor: system
        preconditions:
          - "at least one Installment of this plan has status MISSED"
        side_effects:
          - "if case in IN_DIVERSION -> case IN_LITIGATION (cascade hop: plan default -> case relitigated)"

  - entity: Installment
    initial_state: DUE
    terminal_states: [PAID, MISSED]
    transitions:
      - from: DUE
        to: PAID
        trigger: "POST /installments/{installmentId}/transition {to_status: PAID}"
        actor: Tenant
        preconditions:
          - "parent PaymentPlan.status == ACCEPTED (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "paid_at = current logical-clock instant"
          - "case net_arrears_cents recomputed downward by amount_cents (final variant)"
          - "if all installments now PAID -> PaymentPlan COMPLETED (bubble-up)"

      - from: DUE
        to: MISSED
        trigger: "POST /installments/{installmentId}/transition {to_status: MISSED}"
        actor: Clerk
        preconditions:
          - "current logical-clock instant > due_date (ERR_INSTALLMENT_NOT_DUE if not yet past due)"
          - "parent PaymentPlan.status == ACCEPTED"
        side_effects:
          - "PaymentPlan DEFAULTED (bubble-up)"

  - entity: Hearing
    initial_state: SCHEDULED
    terminal_states: [HELD, CONTINUED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "POST /hearings/{hearingId}/transition {to_status: HELD}"
        actor: Judge
        preconditions:
          - "parent Case.status == IN_LITIGATION (ERR_CASE_NOT_IN_LITIGATION) — cross-entity dependency"
          - "current logical-clock instant >= scheduled_start"
        side_effects:
          - "Court.hearings_scheduled_count -= 1 (slot released)"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /hearings/{hearingId}/transition {to_status: CANCELLED}"
        actor: Clerk
        preconditions: []
        side_effects:
          - "Court.hearings_scheduled_count -= 1 (slot released)"

      - from: SCHEDULED
        to: CONTINUED
        trigger: "POST /hearings/{hearingId}/transition {to_status: CONTINUED, new_start, new_end}"
        actor: Clerk
        preconditions:
          - "new_start < new_end (ERR_INVALID_INTERVAL)"
          - "successor interval free of half-open overlap and within daily capacity on the court (ERR_HEARING_CONFLICT / ERR_CALENDAR_FULL)"
        side_effects:
          - "this Hearing.status = CONTINUED; Court.hearings_scheduled_count -= 1 for it"
          - "a successor Hearing is created SCHEDULED with new_start/new_end, continued_from_id = this.id, continuance_count = this.continuance_count + 1; Court.hearings_scheduled_count += 1 (cascade)"

  - entity: Judgment
    initial_state: ENTERED
    terminal_states: [VACATED, SATISFIED]
    transitions:
      - from: ENTERED
        to: STAYED
        trigger: "POST /judgments/{judgmentId}/transition {to_status: STAYED, stay_until}"
        actor: Judge
        preconditions:
          - "stay_until > current logical-clock instant (ERR_INVALID_INTERVAL)"
        side_effects:
          - "stay_until set; enforcement blocked until that instant"

      - from: STAYED
        to: ENTERED
        trigger: "POST /judgments/{judgmentId}/transition {to_status: ENTERED}"
        actor: Judge
        preconditions: []
        side_effects:
          - "stay_until = null (stay lifted)"

      - from: ENTERED
        to: VACATED
        trigger: "POST /judgments/{judgmentId}/transition {to_status: VACATED}"
        actor: Judge
        preconditions: []
        side_effects:
          - "case JUDGMENT_ENTERED -> DISMISSED (cascade hop 1); any REQUESTED/SCHEDULED LockoutOrder -> CANCELLED, officer freed (cascade hop 2)"

      - from: STAYED
        to: VACATED
        trigger: "POST /judgments/{judgmentId}/transition {to_status: VACATED}"
        actor: Judge
        preconditions: []
        side_effects:
          - "case -> DISMISSED (cascade); LockoutOrders CANCELLED"

      - from: ENTERED
        to: SATISFIED
        trigger: "POST /judgments/{judgmentId}/transition {to_status: SATISFIED}"
        actor: Judge
        preconditions:
          - "judgment_type == POSSESSION"
        side_effects: []

  - entity: LockoutOrder
    initial_state: REQUESTED
    terminal_states: [EXECUTED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: SCHEDULED
        trigger: "POST /lockout-orders/{lockoutId}/transition {to_status: SCHEDULED, officer_id, scheduled_at}"
        actor: Sheriff
        preconditions:
          - "referenced Judgment.judgment_type == POSSESSION and Judgment.status IN {ENTERED, STAYED} (ERR_NO_POSSESSION_JUDGMENT if VACATED/SATISFIED or non-possession) — business_referential"
          - "if Judgment.status == STAYED: scheduled_at >= Judgment.stay_until (ERR_LOCKOUT_STAY_ACTIVE) — business_temporal"
          - "assigned Officer has no other SCHEDULED lockout within LOCKOUT_BUFFER_HOURS of scheduled_at (ERR_OFFICER_UNAVAILABLE) — business_constraint"
        side_effects:
          - "officer_id, scheduled_at set; case JUDGMENT_ENTERED -> ENFORCEMENT"

      - from: SCHEDULED
        to: EXECUTED
        trigger: "POST /lockout-orders/{lockoutId}/transition {to_status: EXECUTED}"
        actor: Sheriff
        preconditions:
          - "current logical-clock instant >= scheduled_at (ERR_LOCKOUT_NOT_DUE)"
          - "referenced Judgment.status == ENTERED (ERR_NO_POSSESSION_JUDGMENT if VACATED/STAYED)"
        side_effects:
          - "executed_at set; case ENFORCEMENT -> CLOSED_ENFORCED (cascade)"

      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /lockout-orders/{lockoutId}/transition {to_status: CANCELLED}"
        actor: Sheriff
        preconditions: []
        side_effects: []

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /lockout-orders/{lockoutId}/transition {to_status: CANCELLED}"
        actor: Sheriff
        preconditions: []
        side_effects:
          - "officer freed (buffer window released)"

  - entity: SealingRequest
    initial_state: REQUESTED
    terminal_states: [GRANTED, DENIED]
    transitions:
      - from: REQUESTED
        to: GRANTED
        trigger: "POST /sealing-requests/{sealingId}/transition {to_status: GRANTED}"
        actor: Judge
        preconditions: []
        side_effects:
          - "decided_by_user_id set; parent Case.sealed = true (cascade); sealed case excluded from default GET /cases list results"

      - from: REQUESTED
        to: DENIED
        trigger: "POST /sealing-requests/{sealingId}/transition {to_status: DENIED}"
        actor: Judge
        preconditions: []
        side_effects:
          - "decided_by_user_id set"

# =============================================================================
# Table 1.2.1: Concurrency Rules (OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: plan-create-stale-case
    parent_entity: Case
    write_endpoint: "POST /payment-plans"
    occ_field: "expected_case_version"
    description: |
      Creating a PaymentPlan against a Case whose version has advanced since the
      client last observed it is rejected. A newly created plan legitimately
      supersedes the case's prior negotiation posture (arrears baseline, plan
      slot), so a create carrying a stale expected_case_version is rejected on
      the stale-version check rather than silently opening a second negotiation
      over an out-of-date arrears figure.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: case_net_arrears
    trigger: "on Case creation (provisional); on every Installment PAID and Referral DISBURSED (final recompute)"
    algorithm: aggregation
    formula: |
      # Dual-variant outstanding arrears on the Case.
      # provisional (at filing): net_arrears_cents = claimed_arrears_cents
      # final (any time after filing):
      paid = sum(Installment.amount_cents
                 for i in Installments where i.status == PAID
                 and i.payment_plan.case_id == case.id
                 and i.payment_plan.status in {ACCEPTED, COMPLETED, DEFAULTED})
      disbursed = sum(Referral.disbursed_amount_cents
                      for r in Referrals where r.case_id == case.id
                      and r.referral_type == RENTAL_ASSISTANCE
                      and r.status == DISBURSED)
      net_arrears_cents = max(0, claimed_arrears_cents - paid - disbursed)
    input_set: "PAID installments of the case's ACCEPTED/COMPLETED/DEFAULTED plan; DISBURSED rental-assistance referrals of the case"
    constants: {}
    precision: "integer cents; floor at 0"
    variants:
      - name: provisional
        when: "at Case filing, before any payment or disbursement"
        difference: "equals claimed_arrears_cents verbatim; ignores installments and referrals"
      - name: final
        when: "any read after the first PAID installment or DISBURSED referral"
        difference: "subtracts PAID installments and DISBURSED rental assistance, floored at 0; diverges from provisional whenever money has moved"

  - name: rental_assistance_award
    trigger: "Referral SUBMITTED->APPROVED (requested/provisional); Referral APPROVED->DISBURSED (disbursed/final)"
    algorithm: threshold
    formula: |
      # Nested-min over THREE independent inputs (mode-a combinatorial):
      income_cap_cents = INCOME_CAP_BASE_CENTS
                       + (tenant.household_size - 1) * INCOME_CAP_PER_MEMBER_CENTS
      budget_remaining_cents = ASSISTANCE_PROGRAM_BUDGET_CENTS
                       - sum(Referral.disbursed_amount_cents
                             for r in Referrals where r.status == DISBURSED)   # program-wide
      award = min(case.net_arrears_cents_final, income_cap_cents, budget_remaining_cents)
      # provisional variant (at APPROVED): award -> requested_amount_cents
      # final variant     (at DISBURSED): recompute award with current net_arrears
      #                                   and current budget_remaining -> disbursed_amount_cents
    input_set: "the case's current final net_arrears; the tenant's household_size; program-wide DISBURSED referrals"
    constants:
      INCOME_CAP_BASE_CENTS: 300000
      INCOME_CAP_PER_MEMBER_CENTS: 100000
      ASSISTANCE_PROGRAM_BUDGET_CENTS: 5000000
    precision: "integer cents; exact min, no rounding"
    variants:
      - name: requested
        when: "computed at the APPROVED decision"
        difference: "uses net_arrears at approval time; stored in requested_amount_cents"
      - name: disbursed
        when: "computed at the DISBURSED transition"
        difference: "re-evaluates net_arrears (which may have dropped via interim payments) and current budget; stored in disbursed_amount_cents; diverges from requested whenever arrears fell between approval and disbursement"

  - name: installment_schedule
    trigger: "PaymentPlan PROPOSED/COUNTERED -> ACCEPTED"
    algorithm: waterfall_allocation
    formula: |
      # Nested-rounding where ORDER matters (mode-b combinatorial). Pinned order:
      # floor each installment FIRST, then assign the whole remainder to the LAST.
      base = floor(total_cents / installment_count)           # per-installment floor
      remainder = total_cents - base * installment_count       # 0 <= remainder < installment_count
      for seq in 1..installment_count:
        amount_cents[seq] = base + (remainder if seq == installment_count else 0)
        due_date[seq]     = first_due_date + (seq - 1) * INSTALLMENT_INTERVAL_DAYS
      # sum(amount_cents) == total_cents exactly (conservation)
    input_set: "the plan's total_cents and installment_count at the moment of ACCEPT"
    constants:
      INSTALLMENT_INTERVAL_DAYS: 30
    precision: "integer cents; floor per line, remainder to final installment (NOT sum-then-divide)"

  - name: money_judgment_amount
    trigger: "POST /judgments with judgment_type == POSSESSION"
    algorithm: aggregation
    formula: |
      if judgment_type == POSSESSION:
        money_amount_cents = case.net_arrears_cents_final + JUDGMENT_FILING_FEE_CENTS
      else:  # DISMISSAL, DIVERSION
        money_amount_cents = 0
    input_set: "the case's final net_arrears at the instant of judgment entry"
    constants:
      JUDGMENT_FILING_FEE_CENTS: 4500
    precision: "integer cents"

  - name: court_calendar_capacity
    trigger: "on POST /hearings and on Hearing CONTINUED (successor creation)"
    algorithm: aggregation
    formula: |
      # Half-open overlap test on the SAME court:
      conflict = exists Hearing h2 where
                   h2.court_id == court.id
                   and h2.status == SCHEDULED
                   and h2.id != this.id
                   and (new_start < h2.scheduled_end and h2.scheduled_start < new_end)
      # Daily capacity on the SAME calendar date (UTC date of scheduled_start):
      day_count = count(Hearing h2 where h2.court_id == court.id
                        and h2.status == SCHEDULED
                        and date(h2.scheduled_start) == date(new_start))
      if conflict: reject ERR_HEARING_CONFLICT
      elif day_count >= court.hearing_daily_capacity: reject ERR_CALENDAR_FULL
      # hearings_scheduled_count is maintained as an invariant:
      hearings_scheduled_count == count(Hearing where court_id==court.id and status==SCHEDULED)
    input_set: "SCHEDULED hearings of the target court"
    constants: {}
    precision: "integer counts; adjacency (new_start == other.scheduled_end) is NOT an overlap"

  - name: lockout_officer_buffer
    trigger: "LockoutOrder REQUESTED -> SCHEDULED"
    algorithm: interval_merge
    formula: |
      # Buffered POINT scheduling on an Officer (distinct interval semantics from
      # the court's half-open ranges): two lockouts for one officer must be at
      # least LOCKOUT_BUFFER_HOURS apart.
      conflict = exists LockoutOrder l2 where
                   l2.officer_id == officer_id
                   and l2.status == SCHEDULED
                   and l2.id != this.id
                   and abs(scheduled_at - l2.scheduled_at) < LOCKOUT_BUFFER_HOURS hours
      if conflict: reject ERR_OFFICER_UNAVAILABLE
    input_set: "SCHEDULED lockouts of the assigned officer"
    constants:
      LOCKOUT_BUFFER_HOURS: 48
    precision: "hours; exactly LOCKOUT_BUFFER_HOURS apart is allowed (strict <)"

  - name: sealing_eligibility
    trigger: "POST /sealing-requests"
    algorithm: threshold
    formula: |
      eligible = case.status in {DISMISSED, DIVERSION_SATISFIED, CLOSED_ENFORCED}
                 and case.closed_at is not null
                 and current_clock >= case.closed_at + SEALING_WAIT_DAYS days
      if not eligible: reject ERR_SEALING_INELIGIBLE
    input_set: "the parent case's terminal status and closed_at"
    constants:
      SEALING_WAIT_DAYS: 90
    precision: "days; current_clock == closed_at + SEALING_WAIT_DAYS exactly is eligible (>=)"

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is a recognised role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /courts, POST /landlords, POST /tenants, POST /officers, POST /_clock/set_current_utc when no auth configured"

  - priority: 2
    category: auth
    check: "acting role is permitted for this operation per the RBAC matrix (and, for entity_backed roles, X-User-ID owns the resource: Landlord==case.landlord_id, Tenant==case.tenant_id, Sheriff==officer)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: state
    check: "request body well-formed: required fields present, enums in range, numeric fields >= their declared minimum, scheduled_start < scheduled_end"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: all

  - priority: 4
    category: existence
    check: "every path id and every FK in the body resolves to a live resource (left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: state
    check: "OCC: expected_case_version matches Case.version on POST /payment-plans"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /payment-plans"

  - priority: 6
    category: state
    check: "target resource is in a state from which the requested transition is legal"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all /transition and /respond endpoints, POST /answers"

  - priority: 7
    category: business_referential
    check: "referenced sibling entity is in the required state for this action (e.g. lockout schedule requires a POSSESSION judgment in {ENTERED, STAYED}; installment pay requires plan ACCEPTED; hearing HELD requires case IN_LITIGATION)"
    error_id: ERR_NO_POSSESSION_JUDGMENT
    http_status: 409
    applies_to: "POST /lockout-orders, POST /lockout-orders/{id}/transition, POST /hearings/{id}/transition"

  - priority: 8
    category: business_safety
    check: "segregation of duties: the Judge entering a judgment (X-User-ID) must not equal the mediator_user_id of any HELD/AGREEMENT MediationSession on the case; sealing eligibility (terminal + waiting period) satisfied"
    error_id: ERR_SOD_VIOLATION
    http_status: 409
    applies_to: "POST /judgments, POST /sealing-requests"

  - priority: 9
    category: business_temporal
    check: "temporal gates: answer window (default only after answer_due_at), installment/lockout not-due, stay still active vs scheduled_at, sealing waiting period"
    error_id: ERR_LOCKOUT_STAY_ACTIVE
    http_status: 409
    applies_to: "POST /cases/{id}/transition, POST /installments/{id}/transition, POST /lockout-orders/{id}/transition, POST /sealing-requests"

  - priority: 10
    category: business_constraint
    check: "resource temporal-overlap / capacity: court half-open hearing overlap, court daily capacity, officer buffer window"
    error_id: ERR_HEARING_CONFLICT
    http_status: 409
    applies_to: "POST /hearings, POST /hearings/{id}/transition, POST /lockout-orders/{id}/transition"

  - priority: 11
    category: business_fiscal
    check: "fiscal sufficiency / budget: plan total covers case net arrears; rental-assistance program budget not exhausted"
    error_id: ERR_PLAN_INSUFFICIENT
    http_status: 409
    applies_to: "POST /payment-plans/{id}/respond, POST /referrals/{id}/transition"

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID on an authenticated endpoint" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for the operation, or entity_backed user is not the resource owner" }
  - { id: ERR_VALIDATION, http: 422, condition: "Malformed body: missing required field, out-of-range enum, negative amount, or scheduled_start >= scheduled_end" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path id or body FK does not resolve to a live resource" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_case_version does not match the Case's current version on plan create" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition is not legal from the resource's current state" }
  - { id: ERR_ALREADY_ANSWERED, http: 409, condition: "Case default requested but an Answer already exists" }
  - { id: ERR_ANSWER_WINDOW_OPEN, http: 409, condition: "Case default requested before answer_due_at has passed" }
  - { id: ERR_ANSWER_WINDOW_CLOSED, http: 409, condition: "Answer filed after the case moved to DEFAULTED" }
  - { id: ERR_NO_POSSESSION_JUDGMENT, http: 409, condition: "Lockout action requires a POSSESSION judgment in ENTERED state" }
  - { id: ERR_CASE_NOT_IN_LITIGATION, http: 409, condition: "Hearing cannot be HELD unless its case is IN_LITIGATION" }
  - { id: ERR_SOD_VIOLATION, http: 409, condition: "Judge entering judgment also mediated the case (segregation of duties)" }
  - { id: ERR_SEALING_INELIGIBLE, http: 409, condition: "Case not terminal, or waiting period (SEALING_WAIT_DAYS) not elapsed since closed_at" }
  - { id: ERR_LOCKOUT_STAY_ACTIVE, http: 409, condition: "Lockout scheduled_at precedes the judgment's active stay_until" }
  - { id: ERR_LOCKOUT_NOT_DUE, http: 409, condition: "Lockout execution attempted before scheduled_at" }
  - { id: ERR_INSTALLMENT_NOT_DUE, http: 409, condition: "Installment marked MISSED before its due_date has passed" }
  - { id: ERR_OFFICER_UNAVAILABLE, http: 409, condition: "Assigned officer has a SCHEDULED lockout within LOCKOUT_BUFFER_HOURS" }
  - { id: ERR_HEARING_CONFLICT, http: 409, condition: "New/continued hearing half-open interval overlaps another SCHEDULED hearing on the court" }
  - { id: ERR_CALENDAR_FULL, http: 409, condition: "Court hearing_daily_capacity reached for the target calendar date" }
  - { id: ERR_INVALID_INTERVAL, http: 422, condition: "new_start >= new_end, or stay_until not in the future" }
  - { id: ERR_PLAN_INSUFFICIENT, http: 409, condition: "Accepted plan total_cents is less than the case's final net arrears" }
  - { id: ERR_ASSISTANCE_BUDGET_EXCEEDED, http: 409, condition: "Rental-assistance program budget is exhausted at disbursement" }
  - { id: ERR_NOT_DISBURSABLE, http: 409, condition: "Disburse attempted on a LEGAL_AID referral" }
  - { id: ERR_WRONG_PARTY_TURN, http: 409, condition: "Payment-plan response submitted by the party who is not the current counterparty" }

# =============================================================================
# Table 1.5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving: logical clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; the clock never falls back to wall-clock time. All deadline/expiry/window rules read this clock."
    roles: [Clerk]
    code: 200
    input: [to_iso8601]
    output: "null"
    side_effects: ["logical clock advances to to_iso8601"]

  # --- Court (config) ---
  - method: POST
    path: "/courts"
    description: "Register a housing court"
    roles: [Clerk]
    code: 201
    input: [name, jurisdiction_code, hearing_daily_capacity]
    output: Court
    side_effects: ["hearings_scheduled_count = 0"]
  - method: GET
    path: "/courts/{courtId}"
    description: "Fetch a court"
    roles: [Clerk, Landlord, Tenant, Mediator, Judge, ProgramAdmin, Sheriff]
    code: 200
    input: []
    output: Court
    side_effects: []

  # --- Landlord ---
  - method: POST
    path: "/landlords"
    description: "Register a landlord (plaintiff) party"
    roles: [Clerk]
    code: 201
    input: [name, email]
    output: Landlord
    side_effects: []
  - method: GET
    path: "/landlords/{landlordId}"
    description: "Fetch a landlord"
    roles: [Clerk, Landlord, Tenant, Mediator, Judge, ProgramAdmin, Sheriff]
    code: 200
    input: []
    output: Landlord
    side_effects: []

  # --- Tenant ---
  - method: POST
    path: "/tenants"
    description: "Register a tenant (respondent) party"
    roles: [Clerk]
    code: 201
    input: [name, email, household_income_cents, household_size]
    output: Tenant
    side_effects: []
  - method: GET
    path: "/tenants/{tenantId}"
    description: "Fetch a tenant"
    roles: [Clerk, Landlord, Tenant, Mediator, Judge, ProgramAdmin, Sheriff]
    code: 200
    input: []
    output: Tenant
    side_effects: []

  # --- Officer ---
  - method: POST
    path: "/officers"
    description: "Register an enforcement officer / sheriff deputy"
    roles: [Clerk]
    code: 201
    input: [name, badge_number, agency]
    output: Officer
    side_effects: []
  - method: GET
    path: "/officers/{officerId}"
    description: "Fetch an officer"
    roles: [Clerk, Landlord, Tenant, Mediator, Judge, ProgramAdmin, Sheriff]
    code: 200
    input: []
    output: Officer
    side_effects: []

  # --- Case ---
  - method: POST
    path: "/cases"
    description: "File a new eviction case (status FILED)"
    roles: [Landlord, Clerk]
    code: 201
    input: [court_id, landlord_id, tenant_id, filing_type, "claimed_arrears_cents?"]
    output: Case
    side_effects:
      - "status=FILED, outcome=PENDING, sealed=false"
      - "answer_due_at = created_at + ANSWER_WINDOW_DAYS(14)"
      - "net_arrears_cents = claimed_arrears_cents (provisional)"
  - method: GET
    path: "/cases/{caseId}"
    description: "Fetch a case (returns sealed cases when fetched by id)"
    roles: [Clerk, Landlord, Tenant, Mediator, Judge, ProgramAdmin, Sheriff]
    code: 200
    input: []
    output: Case
    side_effects: []
  - method: GET
    path: "/cases"
    description: "List cases (filtered); sealed cases excluded unless include_sealed=true"
    roles: [Clerk, Landlord, Tenant, Mediator, Judge, ProgramAdmin, Sheriff]
    code: 200
    input: ["court_id?", "landlord_id?", "tenant_id?", "status?", "include_sealed?", "limit?", "offset?"]
    output: Case[]
    side_effects: []
  - method: POST
    path: "/cases/{caseId}/transition"
    description: "Clerk-driven case status transition (SERVED, DEFAULTED, IN_LITIGATION)"
    roles: [Clerk]
    code: 200
    input: [to_status]
    output: Case
    side_effects: ["per Case state machine; served_at / DEFAULTED gating"]

  # --- Answer ---
  - method: POST
    path: "/answers"
    description: "Tenant files an answer to a served case (side-effect: case SERVED->ANSWERED)"
    roles: [Tenant]
    code: 201
    input: [case_id, defenses, "rent_withheld_cents?"]
    output: Answer
    side_effects:
      - "is_late = created_at > case.answer_due_at"
      - "case SERVED -> ANSWERED"
  - method: GET
    path: "/answers/{answerId}"
    description: "Fetch an answer"
    roles: [Clerk, Landlord, Tenant, Mediator, Judge]
    code: 200
    input: []
    output: Answer
    side_effects: []
  - method: GET
    path: "/answers"
    description: "List answers (filter by case)"
    roles: [Clerk, Landlord, Tenant, Mediator, Judge]
    code: 200
    input: ["case_id?", "limit?", "offset?"]
    output: Answer[]
    side_effects: []

  # --- Referral ---
  - method: POST
    path: "/referrals"
    description: "Submit a legal-aid or rental-assistance referral (side-effect: case ANSWERED->IN_DIVERSION)"
    roles: [Tenant, Clerk]
    code: 201
    input: [case_id, referral_type, provider_name]
    output: Referral
    side_effects: ["status=SUBMITTED", "first referral moves case ANSWERED->IN_DIVERSION"]
  - method: GET
    path: "/referrals/{referralId}"
    description: "Fetch a referral"
    roles: [Clerk, Landlord, Tenant, ProgramAdmin, Judge]
    code: 200
    input: []
    output: Referral
    side_effects: []
  - method: GET
    path: "/referrals"
    description: "List referrals (filter by case/type/status)"
    roles: [Clerk, Landlord, Tenant, ProgramAdmin, Judge]
    code: 200
    input: ["case_id?", "referral_type?", "status?", "limit?", "offset?"]
    output: Referral[]
    side_effects: []
  - method: POST
    path: "/referrals/{referralId}/transition"
    description: "Program admin decides/disburses a referral (APPROVED, DENIED, DISBURSED)"
    roles: [ProgramAdmin]
    code: 200
    input: [to_status]
    output: Referral
    side_effects: ["APPROVED sets requested_amount_cents; DISBURSED sets disbursed_amount_cents and cascades case net_arrears"]

  # --- Mediation ---
  - method: POST
    path: "/mediation-sessions"
    description: "Schedule a mediation session (side-effect: case ANSWERED->IN_DIVERSION)"
    roles: [Clerk, Mediator]
    code: 201
    input: [case_id, mediator_user_id, scheduled_at]
    output: MediationSession
    side_effects: ["status=SCHEDULED", "first session moves case ANSWERED->IN_DIVERSION"]
  - method: GET
    path: "/mediation-sessions/{sessionId}"
    description: "Fetch a mediation session"
    roles: [Clerk, Landlord, Tenant, Mediator, Judge]
    code: 200
    input: []
    output: MediationSession
    side_effects: []
  - method: GET
    path: "/mediation-sessions"
    description: "List mediation sessions (filter by case/status)"
    roles: [Clerk, Landlord, Tenant, Mediator, Judge]
    code: 200
    input: ["case_id?", "status?", "limit?", "offset?"]
    output: MediationSession[]
    side_effects: []
  - method: POST
    path: "/mediation-sessions/{sessionId}/transition"
    description: "Mediator transitions a session (HELD, AGREEMENT, IMPASSE, re-SCHEDULED)"
    roles: [Mediator]
    code: 200
    input: [to_status, "scheduled_at?", "outcome_notes?"]
    output: MediationSession
    side_effects: ["per MediationSession state machine; AGREEMENT may move case IN_LITIGATION->IN_DIVERSION"]

  # --- PaymentPlan ---
  - method: POST
    path: "/payment-plans"
    description: "Open a repayment-plan negotiation (status PROPOSED). OCC-guarded on the case."
    roles: [Landlord, Tenant]
    code: 201
    input: [case_id, proposed_by, total_cents, installment_count, first_due_date, expected_case_version]
    output: PaymentPlan
    side_effects:
      - "status=PROPOSED; current_proposer = the counterparty of proposed_by"
      - "increments Case.version by 1"
  - method: GET
    path: "/payment-plans/{planId}"
    description: "Fetch a payment plan"
    roles: [Clerk, Landlord, Tenant, Mediator, Judge]
    code: 200
    input: []
    output: PaymentPlan
    side_effects: []
  - method: GET
    path: "/payment-plans"
    description: "List payment plans (filter by case/status)"
    roles: [Clerk, Landlord, Tenant, Mediator, Judge]
    code: 200
    input: ["case_id?", "status?", "limit?", "offset?"]
    output: PaymentPlan[]
    side_effects: []
  - method: POST
    path: "/payment-plans/{planId}/respond"
    description: "Counterparty responds to a plan (ACCEPT, COUNTER, REJECT)"
    roles: [Landlord, Tenant]
    code: 200
    input: [decision, "new_total_cents?", "new_installment_count?"]
    output: PaymentPlan
    side_effects: ["per PaymentPlan state machine; ACCEPT generates installments and moves case to IN_DIVERSION"]

  # --- Installment ---
  - method: GET
    path: "/installments/{installmentId}"
    description: "Fetch an installment"
    roles: [Clerk, Landlord, Tenant, Judge]
    code: 200
    input: []
    output: Installment
    side_effects: []
  - method: GET
    path: "/installments"
    description: "List installments (filter by plan/status)"
    roles: [Clerk, Landlord, Tenant, Judge]
    code: 200
    input: ["payment_plan_id?", "status?", "limit?", "offset?"]
    output: Installment[]
    side_effects: []
  - method: POST
    path: "/installments/{installmentId}/transition"
    description: "Pay (Tenant) or mark missed (Clerk) an installment"
    roles: [Tenant, Clerk]
    code: 200
    input: [to_status]
    output: Installment
    side_effects: ["PAID recomputes case net_arrears and may complete the plan; MISSED defaults the plan"]

  # --- Hearing ---
  - method: POST
    path: "/hearings"
    description: "Schedule a hearing on a court calendar (half-open overlap + daily-capacity checked)"
    roles: [Clerk]
    code: 201
    input: [case_id, court_id, hearing_type, scheduled_start, scheduled_end]
    output: Hearing
    side_effects: ["status=SCHEDULED; Court.hearings_scheduled_count += 1"]
  - method: GET
    path: "/hearings/{hearingId}"
    description: "Fetch a hearing"
    roles: [Clerk, Landlord, Tenant, Mediator, Judge]
    code: 200
    input: []
    output: Hearing
    side_effects: []
  - method: GET
    path: "/hearings"
    description: "List hearings (filter by case/court/status/predecessor)"
    roles: [Clerk, Landlord, Tenant, Mediator, Judge]
    code: 200
    input: ["case_id?", "court_id?", "status?", "continued_from_id?", "limit?", "offset?"]
    output: Hearing[]
    side_effects: []
  - method: POST
    path: "/hearings/{hearingId}/transition"
    description: "Hold (Judge), cancel (Clerk), or continue (Clerk) a hearing"
    roles: [Clerk, Judge]
    code: 200
    input: [to_status, "new_start?", "new_end?"]
    output: Hearing
    side_effects: ["per Hearing state machine; CONTINUED frees this slot and creates a successor Hearing"]

  # --- Judgment ---
  - method: POST
    path: "/judgments"
    description: "Enter a judgment (fork: POSSESSION / DISMISSAL / DIVERSION). SoD-checked against mediators."
    roles: [Judge]
    code: 201
    input: [case_id, judgment_type]
    output: Judgment
    side_effects:
      - "status=ENTERED; entered_by_user_id = X-User-ID"
      - "POSSESSION: money_amount_cents = case final net_arrears + JUDGMENT_FILING_FEE_CENTS(4500); case -> JUDGMENT_ENTERED, outcome=JUDGMENT_FOR_LANDLORD"
      - "DISMISSAL: case -> DISMISSED, outcome=DISMISSED, closed_at set"
      - "DIVERSION: case -> IN_DIVERSION"
  - method: GET
    path: "/judgments/{judgmentId}"
    description: "Fetch a judgment"
    roles: [Clerk, Landlord, Tenant, Judge, Sheriff]
    code: 200
    input: []
    output: Judgment
    side_effects: []
  - method: GET
    path: "/judgments"
    description: "List judgments (filter by case/status)"
    roles: [Clerk, Landlord, Tenant, Judge, Sheriff]
    code: 200
    input: ["case_id?", "status?", "limit?", "offset?"]
    output: Judgment[]
    side_effects: []
  - method: POST
    path: "/judgments/{judgmentId}/transition"
    description: "Judge stays, lifts stay, vacates, or satisfies a judgment"
    roles: [Judge]
    code: 200
    input: [to_status, "stay_until?"]
    output: Judgment
    side_effects: ["per Judgment state machine; VACATED cascades case->DISMISSED and cancels lockouts"]

  # --- LockoutOrder ---
  - method: POST
    path: "/lockout-orders"
    description: "Request a sheriff lockout under a possession judgment (status REQUESTED)"
    roles: [Landlord, Clerk]
    code: 201
    input: [case_id, judgment_id]
    output: LockoutOrder
    side_effects: ["status=REQUESTED"]
  - method: GET
    path: "/lockout-orders/{lockoutId}"
    description: "Fetch a lockout order"
    roles: [Clerk, Landlord, Tenant, Judge, Sheriff]
    code: 200
    input: []
    output: LockoutOrder
    side_effects: []
  - method: GET
    path: "/lockout-orders"
    description: "List lockout orders (filter by case/judgment/officer/status)"
    roles: [Clerk, Landlord, Tenant, Judge, Sheriff]
    code: 200
    input: ["case_id?", "judgment_id?", "officer_id?", "status?", "limit?", "offset?"]
    output: LockoutOrder[]
    side_effects: []
  - method: POST
    path: "/lockout-orders/{lockoutId}/transition"
    description: "Schedule (assign officer + time), execute, or cancel a lockout"
    roles: [Sheriff, Clerk]
    code: 200
    input: [to_status, "officer_id?", "scheduled_at?"]
    output: LockoutOrder
    side_effects: ["SCHEDULED enforces stay + officer buffer, moves case to ENFORCEMENT; EXECUTED closes case"]

  # --- SealingRequest ---
  - method: POST
    path: "/sealing-requests"
    description: "Request sealing/expungement of a closed case record (eligibility checked)"
    roles: [Tenant]
    code: 201
    input: [case_id, basis]
    output: SealingRequest
    side_effects: ["status=REQUESTED"]
  - method: GET
    path: "/sealing-requests/{sealingId}"
    description: "Fetch a sealing request"
    roles: [Clerk, Tenant, Judge]
    code: 200
    input: []
    output: SealingRequest
    side_effects: []
  - method: GET
    path: "/sealing-requests"
    description: "List sealing requests (filter by case/status)"
    roles: [Clerk, Tenant, Judge]
    code: 200
    input: ["case_id?", "status?", "limit?", "offset?"]
    output: SealingRequest[]
    side_effects: []
  - method: POST
    path: "/sealing-requests/{sealingId}/transition"
    description: "Judge grants or denies a sealing request"
    roles: [Judge]
    code: 200
    input: [to_status]
    output: SealingRequest
    side_effects: ["GRANTED sets case.sealed=true"]

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: Clerk
    description: "Court clerk / operator. Administers configuration (courts, parties, officers, clock), dockets and serves cases, schedules hearings, and manages installment defaults."
    identity: opaque
    exclusive_operations:
      - "POST /courts, POST /landlords, POST /tenants, POST /officers"
      - "POST /_clock/set_current_utc"
      - "POST /cases/{id}/transition (SERVED, DEFAULTED, IN_LITIGATION)"
      - "POST /hearings (schedule)"
    shared_operations:
      - "POST /cases (with Landlord)"
      - "POST /referrals (with Tenant)"
      - "POST /mediation-sessions (with Mediator)"
      - "POST /installments/{id}/transition -> MISSED"
      - "POST /hearings/{id}/transition -> CANCELLED/CONTINUED (with Judge)"
      - "POST /lockout-orders (with Landlord), POST /lockout-orders/{id}/transition -> CANCELLED (with Sheriff)"
      - "GET reads across the portal"

  - name: Landlord
    description: "Plaintiff party. Files cases, opens/answers payment-plan negotiations on own cases, requests lockouts."
    identity: "entity_backed:Landlord"
    exclusive_operations: []
    shared_operations:
      - "POST /cases (own landlord_id)"
      - "POST /payment-plans, POST /payment-plans/{id}/respond (own case)"
      - "POST /lockout-orders (own case)"
      - "GET reads scoped to own cases"

  - name: Tenant
    description: "Respondent party. Files answers, requests referrals, negotiates payment plans, pays installments, requests sealing on own cases."
    identity: "entity_backed:Tenant"
    exclusive_operations:
      - "POST /answers (own case)"
      - "POST /sealing-requests (own case)"
      - "POST /installments/{id}/transition -> PAID (own case)"
    shared_operations:
      - "POST /referrals (own case, with Clerk)"
      - "POST /payment-plans, POST /payment-plans/{id}/respond (own case)"
      - "GET reads scoped to own cases"

  - name: Mediator
    description: "Neutral mediator. Schedules and conducts mediation sessions. May not later rule as Judge on the same case (SoD)."
    identity: opaque
    exclusive_operations:
      - "POST /mediation-sessions/{id}/transition (HELD, AGREEMENT, IMPASSE, re-SCHEDULE)"
    shared_operations:
      - "POST /mediation-sessions (with Clerk)"
      - "GET reads"

  - name: Judge
    description: "Judicial officer. Enters/stays/vacates judgments, holds/continues hearings, decides sealing. Cannot rule on a case they mediated."
    identity: opaque
    exclusive_operations:
      - "POST /judgments, POST /judgments/{id}/transition"
      - "POST /sealing-requests/{id}/transition"
      - "POST /hearings/{id}/transition -> HELD"
    shared_operations:
      - "POST /hearings/{id}/transition -> CONTINUED (with Clerk)"
      - "GET reads"

  - name: ProgramAdmin
    description: "Legal-aid / rental-assistance program administrator. Approves, denies, and disburses referrals."
    identity: opaque
    exclusive_operations:
      - "POST /referrals/{id}/transition (APPROVED, DENIED, DISBURSED)"
    shared_operations:
      - "GET reads on referrals"

  - name: Sheriff
    description: "Enforcement officer role. Schedules, executes, and cancels lockout orders."
    identity: opaque
    exclusive_operations:
      - "POST /lockout-orders/{id}/transition (SCHEDULED, EXECUTED)"
    shared_operations:
      - "POST /lockout-orders/{id}/transition -> CANCELLED (with Clerk)"
      - "GET reads on lockouts/judgments"
