              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ALLERGY_CONFLICT (business_safety priority 10 beats business_referential priority 33 for the DRAFT protocol)"
            - "HTTP status == 422"
            - "MedicationOrder.${ord_id}.drug_product_id still == the shortage drug id and substitution_pending still == true"

  # ===================================================================
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ===================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: crcl_exactly_30_inclusive_band
        grounds:
          - calculations.renal_dose_adjustment
          - entities.MedicationOrder.fields.crcl_used_ml_min
          - validations[priority=10]
        distinguishing_aspect: |
          Numeric-threshold metric on POST verify: patient fixture engineered so CrCl rounds
          to exactly 30.00 mL/min (male, age 68, height 156.82 cm -> IBW 54.00, SCr 1.8 ->
          (140-68)*54.00/(72*1.8) = 30.0000); the band edge is INCLUSIVE (30 <= crcl < 50 ->
          0.75 factor), so 800 mg -> 600.00, whereas an exclusive reading would drop to the
          0.50 tier (400.00).
        test_recipe:
          setup:
            - "Clock at default 2026-08-01T00:00:00Z; patient male DOB 1958-08-01 (age exactly 68), height 156.82 cm, weight 54.0, SCr 1.8"
            - "Drug IBW-policy, concentration 10; PO order 800 mg"
          setup_api_calls:
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Dr Bnd", staff_role: "PRESCRIBER" }
              as: PharmacyAdmin
              captures: { pres_id: $.data.id }
            - call: "POST /pharmacy/patients"
              payload: { full_name: "Pat Boundary", date_of_birth: "1958-08-01T00:00:00Z", sex: "M", height_cm: 156.82, weight_kg: 54.0, scr_mg_dl: 1.8 }
              as: PharmacyAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version, pat_ibw: $.data.ibw_kg }
            - call: "POST /pharmacy/drug-products"
              payload: { name: "DrugBnd", schedule: "NON_CONTROLLED", concentration_mg_per_ml: 10.0, vial_size_ml: 10.0, renal_dosing_policy: "IBW" }
              as: PharmacyAdmin
              captures: { drug_id: $.data.id }
            - call: "POST /pharmacy/medication-orders"
              payload: { patient_id: "${pat_id}", drug_product_id: "${drug_id}", route: "PO", ordered_dose_mg: 800.0, frequency_per_day: 1, expected_patient_version: "${pat_v}" }
              as: Prescriber
              as_user_id: "${pres_id}"
              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /pharmacy/medication-orders/${ord_id}/verify"
              payload: {}
              as: Pharmacist
              captures: { crcl: $.data.crcl_used_ml_min, adj: $.data.renal_adjusted_dose_mg }
          assert:
            - "PatientProfile.${pat_id}.ibw_kg == 54.0 and age_years == 68"
            - "crcl_used_ml_min == 30.0 exactly"
            - "renal_adjusted_dose_mg == 600.0 (0.75 tier: 30.00 satisfies 30 <= crcl < 50 INCLUSIVE lower bound)"
            - "final_dose_ml == 60.0"
      - name: restock_zero_quantity_rejected
        grounds:
          - validations[priority=17]
          - errors[ERR_INVALID_QUANTITY]
          - entities.ADCPocket.fields.on_hand_units
        distinguishing_aspect: |
          Different metric (integer unit count, not a CrCl threshold) on a different endpoint
          (POST restock, not verify): units == 0 is rejected (bound is units >= 1, exclusive
          of zero); on_hand_units and pocket version must remain unchanged.
        test_recipe:
          setup:
            - "Station + pocket (NON_CONTROLLED drug), currently empty, version 1"
          setup_api_calls:
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Tech Z", staff_role: "TECHNICIAN" }
              as: PharmacyAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /pharmacy/drug-products"
              payload: { name: "DrugZ", schedule: "NON_CONTROLLED", concentration_mg_per_ml: 10.0, vial_size_ml: 10.0 }
              as: PharmacyAdmin
              captures: { drug_id: $.data.id }
            - call: "POST /pharmacy/adc-stations"
              payload: { name: "ST-Z", zone: "CENTRAL" }
              as: PharmacyAdmin
              captures: { st_id: $.data.id }
            - call: "POST /pharmacy/adc-stations/${st_id}/pockets"
              payload: { drug_product_id: "${drug_id}", max_units: 100 }
              as: PharmacyAdmin
              captures: { pk_id: $.data.id, pk_v: $.data.version }
          trigger:
            - call: "POST /pharmacy/adc-pockets/${pk_id}/restock"
              payload: { units: 0, expected_pocket_version: "${pk_v}" }
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
            - call: "GET /pharmacy/adc-pockets/${pk_id}"
              payload: {}
              as: PharmacyTechnician
              as_user_id: "${tech_id}"
              captures: { onhand: $.data.on_hand_units, ver: $.data.version }
          assert:
            - "error_id == ERR_INVALID_QUANTITY (HTTP 400): units == 0 violates units >= 1"
            - "ADCPocket.${pk_id}.on_hand_units == 0 and version unchanged == 1 (rejection is side-effect free)"

  # ===================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: batch_start_requires_hood_session_in_use
        grounds:
          - state_machines.CompoundingBatch.DRAFT_to_IN_PROGRESS
          - entities.CompoundingBatch.fields.hood_session_id
          - errors[ERR_HOOD_SESSION_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair (CompoundingBatch -> HoodSession): batch DRAFT->IN_PROGRESS is gated on
          the linked HoodSession being IN_USE; with the session merely SCHEDULED the start is
          rejected with ERR_HOOD_SESSION_NOT_ACTIVE, and only starting the session first
          unlocks the batch transition.
        test_recipe:
          setup:
            - "Clock at default inside session window; verified IV order; batch DRAFT linked to a SCHEDULED (not started) hood session"
          setup_api_calls:
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Dr XE", staff_role: "PRESCRIBER" }
              as: PharmacyAdmin
              captures: { pres_id: $.data.id }
            - call: "POST /pharmacy/staff"
              payload: { full_name: "Tech XE", staff_role: "TECHNICIAN" }
              as: PharmacyAdmin
              captures: { tech_id: $.data.id }
