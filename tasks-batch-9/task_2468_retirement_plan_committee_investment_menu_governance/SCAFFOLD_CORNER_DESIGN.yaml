            - call: "POST /governance/motions/${motion_watch_id}/votes"
              payload: { member_id: "${mem_fin_id}", vote: "FOR" }
              as: CommitteeMember
              as_user_id: "${mem_fin_id}"
            - call: "POST /governance/motions/${motion_watch_id}/votes"
              payload: { member_id: "${mem_hr_id}", vote: "FOR" }
              as: CommitteeMember
              as_user_id: "${mem_hr_id}"
            - call: "POST /governance/motions/${motion_watch_id}/close"
              payload: {}
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
            - call: "POST /governance/committee-meetings/${meet7_id}/adjourn"
              payload: {}
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
            - call: "POST /governance/committee-meetings/${meet7_id}/minutes-approve"
              payload: { minutes_doc_ref: "MIN-2026-Q0-007" }
              as: CommitteeChair
