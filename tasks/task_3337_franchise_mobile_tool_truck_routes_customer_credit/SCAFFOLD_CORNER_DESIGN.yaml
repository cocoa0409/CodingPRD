      - name: consistency_soft_delete_shop_state_filters_technician_roster
        claim_type: immediate
        grounds: [entities.ShopLocation.fields.shop_status, entities.ShopLocation.fields.active_technician_count, entities.Technician.fields.technician_status]
        distinguishing_aspect: "A shop's ACTIVE to INACTIVE transition immediately removes it from the ACTIVE-filtered roster: the technician count drops to 0, the filtered list omits the shop, and the unfiltered list still shows it — archival does not delete the row."
        test_recipe:
          setup: ["Franchisee F CERTIFIED; route R1 IN_SERVICE with ACTIVE shop S1 and one ACTIVE technician; clock 2026-09-07"]
          setup_api_calls:
            - { call: "POST /retail/franchisees", payload: { legal_name: "Route 3337 Franchising LLC" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /retail/franchisees/${f_id}/training", payload: { action: ENROLL, training_points: 45 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/franchisees/${f_id}/routes", payload: { route_code: R1, route_tier: A, zip_codes: [75001], visit_weekday: 1, truck_label: T-01, inventory_invested_cents: 100000, mix_plan: DIAGNOSTIC_WEIGHTED, territory_model: FRANCHISEE_ASSUMED }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { r1_id: "$.data.id" } }
            - { call: "POST /retail/routes/${r1_id}/status", payload: { action: ACTIVATE }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/routes/${r1_id}/shop-locations", payload: { shop_name: "Northside Diesel", street_line: "12 Elm", zip_code: "75001" }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { s1_id: "$.data.id" } }
            - { call: "POST /retail/technicians", payload: { full_name: "Dana Reyes", current_shop_location_id: "${s1_id}", credit_line_limit_cents: 100000, months_in_trade: 100, employment_verified: true }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { t_id: "$.data.id" } }
            - { call: "POST /retail/_clock/set_current_utc", payload: { current_utc: "2026-09-07T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "GET /retail/shop-locations", payload: { shop_status: ACTIVE }, as: FranchiseOwner, captures: { active_first: "$.data[0].id", active_techs: "$.data[0].active_technician_count" } }
            - { call: "PUT /retail/shop-locations/${s1_id}", payload: { shop_status: INACTIVE }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { s1_after: "$.data.shop_status" } }
            - { call: "GET /retail/shop-locations", payload: { shop_status: ACTIVE }, as: FranchiseOwner }
            - { call: "GET /retail/shop-locations/{id}", payload: {}, as: FranchiseOwner }
          assert:
            - "before the update the ACTIVE-filtered list returns the shop with active_technician_count == 1"
            - "ShopLocation.${s1_id}.shop_status == INACTIVE after the update"
            - "the ACTIVE-filtered list is now empty, so the archived shop is excluded"
            - "the row itself is still readable by id, so archival is not deletion"
            - "Technician.${t_id}.technician_status remains ACTIVE, unaffected by the shop's archival"

      - name: excluded_immediate_cascade_route_suspend_chain_covered_by_difficulty
        claim_type: immediate
        grounds: [state_machines.Route.IN_SERVICE_to_SUSPENDED, entities.ShopLocation.fields.shop_status]
        excluded_because:
          difficulty_instance: non_linear_cyclic_loops_on_franchisee_and_route
          rationale: "The named §1.8 instance drives SUSPEND then REINSTATE on the same route and asserts ShopLocation.shop_status flips to INACTIVE and stays there, which is exactly the route-suspension cascade this consistency-model corner would re-assert."