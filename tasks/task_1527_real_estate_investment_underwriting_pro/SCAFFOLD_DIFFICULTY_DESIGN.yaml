            - call: "POST /re-underwriting/deals/${deal_id}/properties"
              payload: { address_line: "1 Main", market: "Austin", property_type: "MULTIFAMILY", units: 100, rentable_sqft: 100000, year_built: 2005 }
              as: Analyst
