        distinguishing_aspect: "Path existence (priority 40) runs before body-reference existence (priority 45): a submit naming both an unknown application id and an unknown shpo_reviewer_id returns 404 ERR_PART_APPLICATION_NOT_FOUND, never ERR_REVIEWER_NOT_FOUND."
        test_recipe:
          setup:
            - "One developer exists so the caller identity resolves; neither the application id nor the reviewer id in the request exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
