          - state_machines.ServiceCall.ON_SCENE_to_COMPLETED
        distinguishing_aspect: |
          Numeric threshold boundary: with annual_call_cap 2, the call created while
          calls_used_current_term == 1 (cap - 1) IS benefit-eligible, while the call
          created at == 2 (exactly at cap) is member-pay; the counter only advances at
          completion, so two open calls at count 1 are both eligible. Metric: call-count
          threshold on POST /motor-club/service-calls.
