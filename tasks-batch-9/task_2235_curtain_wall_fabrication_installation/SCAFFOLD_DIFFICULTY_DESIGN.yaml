        payload:
          system_type: UNITIZED
        as: CWProjectManager
      - call: POST /installation-zones
        payload:
          package_id: ${pkg}
          floor_number: 5
          elevation_label: NORTH
          area_sqm: 412.37
          height_m: 24.0
          span_mm: 3200
          anchor_type: SLOTTED
          designed_joint_mm: 22.0
          planned_panel_count: 36
          budget_crew_hours: 320.0
        as: CWProjectManager
        captures:
          z1: $.data.id
      - call: POST /installation-zones
