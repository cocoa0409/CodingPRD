        distinguishing_aspect: |
          For a lease starting 2026-07-01 the 2026-08-01 clock has crossed no anniversary, so
          years_elapsed is 0 and current_monthly_rent_cents is the un-escalated 45000, yet
          total_committed_cents is still the full 2852688 = 12 * (45000 + 46238 + 47510 + 48817 +
          50159) covering all five lease years of the 60-month term, and next_anniversary_date is
