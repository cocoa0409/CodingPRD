# =============================================================================
# PRD Benchmark Scaffold — Rebuilt Salvage Vehicle Inspection & Title Branding
# §1.0–§1.7. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8);
# corner design lives in SCAFFOLD_CORNER_DESIGN.yaml (§1.9).
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2650. Rebuilt Salvage Vehicle Inspection & Title Branding (state rebuilt vehicle inspection
  program): salvage title issuance triggers and branding rules by damage threshold and insurer
  report, rebuilder licensing and record-keeping obligations for parts sourcing, application for
  rebuilt inspection with receipts, photographs and parts documentation, physical inspection for
  stolen component identification and structural repair adequacy, vehicle identification number
  verification and replacement part traceability, inspection failure, re-inspection and appeal
  procedures, title brand assignment carried forward on subsequent transfers and interstate
  recognition, fraud referral for odometer or identity tampering

domain_name: rebuilt-salvage-title-program
api_prefix: /v1

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # graph: TitleRecord is self-referential (predecessor chain across transfers), PartsDocument
  # points sideways at a donor TitleRecord, FraudReferral fans across Vehicle/Application/
  # Inspection, and Inspection joins Application × Inspector × InspectionStation. No single
  # ownership tree exists; URL paths are flat collections under /v1 with FK bodies.

  state_machine_shape: cyclic
  # RebuiltApplication cycles FAILED -> SCHEDULED (re-inspection) and DOCS_UNDER_REVIEW -> DRAFT
  # (returned for correction); Appeal cycles REMANDED -> UNDER_REVIEW; Rebuilder cycles
  # PROBATION -> ACTIVE and SUSPENDED -> ACTIVE. TitleRecord additionally carries two
  # independent state dimensions on one row (status × recognition_state).

  relationship_patterns:
    - one_to_many          # RebuiltApplication -> PartsDocument, Inspection -> InspectionFinding
    - many_to_many         # Inspection joins RebuiltApplication × Inspector × InspectionStation
    - self_referential     # TitleRecord.predecessor_title_id -> TitleRecord.id (transfer chain)
    - cross_aggregate      # PartsDocument.donor_title_id crosses into another vehicle's title chain
    - polymorphic_scope    # FraudReferral attaches to Vehicle plus optional Application/Inspection

  role_model: segregation_of_duties
  # A re-inspection may not be conducted by the inspector who failed the prior attempt, and the
  # ProgramAdmin who suspended a rebuilder's license may not be the one who reinstates it.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 14 entities / 57 endpoints / 55 error codes / 8 calculations / 8 state machines / 43 validations.

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - name: vin
        type: string
        source: input
        description: 17-character vehicle identification number as stamped on the public VIN plate
        constraints: exactly 17 chars, uppercase A-Z0-9 excluding I/O/Q, globally unique
      - name: model_year
        type: integer
        source: input
        description: model year printed on the certification label
        constraints: 1950 <= model_year <= 2030
      - name: make
        type: string
        source: input
        description: manufacturer name
      - name: model
        type: string
        source: input
        description: model designation
      - name: body_class
        type: enum
        source: input
        description: body classification used to select required part classes at submission
        constraints: one of {SEDAN, SUV, TRUCK, MOTORCYCLE, TRAILER}
      - name: fraud_hold
        type: enum
        source: computed
        description: >-
          fraud posture of the vehicle; NONE until a FraudReferral is opened against it,
          UNDER_REFERRAL while any FraudReferral has status IN {OPEN, INVESTIGATING},
          CONFIRMED once any FraudReferral reaches SUBSTANTIATED (CONFIRMED is sticky)
        default: NONE
        constraints: one of {NONE, UNDER_REFERRAL, CONFIRMED}
      - name: active_brand_code
        type: enum
        source: computed
        description: >-
          brand_code of the TitleRecord for this vehicle whose is_current == true; NONE when the
          vehicle has no TitleRecord with status == ACTIVE
        default: NONE
        constraints: one of {NONE, SALVAGE, REBUILT, FLOOD, NON_REPAIRABLE}
      - name: brand_history
        type: array
        source: computed
        description: >-
          distinct brand_code values (excluding NONE) ever carried by any TitleRecord of this
          vehicle whose status IN {ACTIVE, SUPERSEDED, VOID, SURRENDERED}, sorted by
          BRAND_SEVERITY descending
      - name: open_application_count
        type: integer
        source: computed
        description: >-
          count of RebuiltApplication rows for this vehicle whose status NOT IN
          {TITLE_ISSUED, DENIED_FINAL, WITHDRAWN, VOID_FRAUD}
        default: 0
      - name: last_odometer_miles
        type: integer
        source: computed
        description: >-
          highest odometer_reading_miles among this vehicle's InsurerDamageReport rows and its
          TitleTransfer rows with status == RECORDED whose effective timestamp <= logical clock;
          null when no reading exists
      - name: registered_state_code
        type: string
        source: input
        description: two-letter state code of the jurisdiction holding the vehicle record
        constraints: exactly 2 uppercase letters

  - name: Rebuilder
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: licensed rebuilder's legal business name
      - name: license_number
        type: string
        source: input
        description: state rebuilder license number
        constraints: unique across Rebuilder
      - name: license_status
        type: enum
        source: system
        description: >-
          license posture driven by the Rebuilder state machine; only ACTIVE and PROBATION may
          submit applications
        default: ACTIVE
        constraints: one of {ACTIVE, PROBATION, SUSPENDED, REVOKED}
      - name: license_expires_at
        type: datetime
        source: input
        description: expiry instant of the rebuilder license (ISO 8601 UTC)
      - name: bond_amount_cents
        type: integer
        source: input
        description: surety bond posted by the rebuilder, in cents
        constraints: ">= 0"
      - name: fees_deposited_cents
        type: integer
        source: computed
        description: cumulative sum of every accepted deposit amount_cents for this rebuilder
        default: 0
      - name: fee_balance_cents
        type: integer
        source: computed
        description: >-
          unescrowed, unconsumed funds; equals fees_deposited_cents - escrowed_fee_total_cents -
          fees_consumed_cents
        default: 0
      - name: escrowed_fee_total_cents
        type: integer
        source: computed
        description: >-
          sum of fee_escrowed_cents over this rebuilder's RebuiltApplication rows whose status
          NOT IN {TITLE_ISSUED, DENIED_FINAL, WITHDRAWN, VOID_FRAUD}
        default: 0
      - name: fees_consumed_cents
        type: integer
        source: computed
        description: >-
          sum of fee_escrowed_cents captured by the program at the instant each application
          reached status IN {TITLE_ISSUED, DENIED_FINAL}
        default: 0
      - name: open_referral_count
        type: integer
        source: computed
        description: >-
          count of FraudReferral rows whose application_id belongs to this rebuilder and whose
          status IN {OPEN, INVESTIGATING}
        default: 0
      - name: substantiated_referral_count
        type: integer
        source: computed
        description: >-
          count of FraudReferral rows whose application_id belongs to this rebuilder and whose
          status == SUBSTANTIATED
        default: 0
      - name: applications_titled_count
        type: integer
        source: computed
        description: count of this rebuilder's RebuiltApplication rows with status == TITLE_ISSUED
        default: 0
      - name: recordkeeping_score_rolling
        type: number
        source: computed
        description: >-
          parts-sourcing record-keeping score over the trailing ROLLING_WINDOW_DAYS window
          (calculations.rebuilder_recordkeeping_score, variant rolling_12_month)
        constraints: 0.00 <= value <= 100.00, 2 decimals
      - name: recordkeeping_score_lifetime
        type: number
        source: computed
        description: >-
          same score computed over every PartsDocument this rebuilder ever filed
          (calculations.rebuilder_recordkeeping_score, variant lifetime_cumulative)
        constraints: 0.00 <= value <= 100.00, 2 decimals
      - name: suspended_by_user_id
        type: string
        source: system
        description: >-
          X-User-ID of the ProgramAdmin whose SUSPEND action produced the current SUSPENDED
          status; null whenever license_status != SUSPENDED
      - name: last_license_action_by_user_id
        type: string
        source: system
        description: X-User-ID of the ProgramAdmin who performed the most recent license action

  - name: Inspector
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: inspector's full name
      - name: badge_number
        type: string
        source: input
        description: state inspector badge number
        constraints: unique across Inspector
      - name: credential_expires_at
        type: datetime
        source: input
        description: instant at which the inspector's certification lapses (ISO 8601 UTC)
      - name: credential_status
        type: enum
        source: computed
        description: >-
          EXPIRED when credential_expires_at <= logical clock, otherwise CURRENT
        constraints: one of {CURRENT, EXPIRED}
      - name: certifications
        type: array
        source: input
        description: endorsement codes the inspector holds
        constraints: subset of {STRUCTURAL, FLOOD, THEFT_RECOVERY}
      - name: scheduled_inspection_count
        type: integer
        source: computed
        description: count of this inspector's Inspection rows with status IN {SCHEDULED, IN_PROGRESS}
        default: 0
      - name: home_state_code
        type: string
        source: input
        description: two-letter state code the inspector is commissioned in
        constraints: exactly 2 uppercase letters

  - name: InspectionStation
    parent: null
    common_fields: true
    fields:
      - name: station_code
        type: string
        source: input
        description: program-assigned station code
        constraints: unique across InspectionStation
      - name: bay_count
        type: integer
        source: input
        description: number of inspection bays; caps concurrent occupancy
        constraints: ">= 1"
      - name: supports_flood
        type: boolean
        source: input
        description: whether the station is equipped to inspect FLOOD-branded vehicles
        default: false
      - name: address_state_code
        type: string
        source: input
        description: two-letter state code where the station sits
        constraints: exactly 2 uppercase letters
      - name: scheduled_occupancy_count
        type: integer
        source: computed
        description: count of this station's Inspection rows with status IN {SCHEDULED, IN_PROGRESS}
        default: 0

  - name: InsurerDamageReport
    parent: null
    common_fields: false
    fields:
      - name: vehicle_id
        type: string
        source: input
        description: FK -> Vehicle.id; the vehicle this total-loss evaluation describes
      - name: insurer_name
        type: string
        source: input
        description: reporting insurance carrier
      - name: claim_number
        type: string
        source: input
        description: carrier claim number
        constraints: unique per (insurer_name, claim_number)
      - name: basis_code
        type: enum
        source: input
        description: >-
          declares which damage-threshold variant applies; GROSS_ESTIMATE divides by acv_cents,
          NET_OF_SALVAGE divides by (acv_cents - salvage_retention_cents)
        constraints: one of {GROSS_ESTIMATE, NET_OF_SALVAGE}
      - name: acv_cents
        type: integer
        source: input
        description: pre-loss actual cash value of the vehicle, in cents
        constraints: "> 0"
      - name: repair_estimate_cents
        type: integer
        source: input
        description: carrier's estimate of parts plus labor to repair, in cents
        constraints: ">= 0"
      - name: salvage_retention_cents
        type: integer
        source: input
        description: value the carrier retains by selling the wreck, in cents
        default: 0
        constraints: ">= 0 and < acv_cents"
      - name: damage_type
        type: enum
        source: input
        description: dominant loss cause
        constraints: one of {COLLISION, FLOOD, HAIL, THEFT_RECOVERY, FIRE}
      - name: flood_water_depth_cm
        type: integer
        source: input
        description: measured standing-water depth inside the passenger compartment, in cm
        default: 0
        constraints: ">= 0"
      - name: odometer_reading_miles
        type: integer
        source: input
        description: odometer reading recorded by the carrier's appraiser
        constraints: ">= 0"
      - name: report_effective_at
        type: datetime
        source: input
        description: instant the carrier's determination took effect (ISO 8601 UTC)
      - name: total_loss_declared
        type: boolean
        source: input
        description: whether the carrier declared the vehicle a total loss
      - name: damage_ratio
        type: number
        source: computed
        description: >-
          damage-to-value ratio produced by calculations.damage_threshold_evaluation under the
          variant selected by basis_code
        constraints: 4 decimals, round_half_up
      - name: recommended_brand_code
        type: enum
        source: computed
        description: >-
          brand the program must stamp on the title issued from this report
          (calculations.damage_threshold_evaluation)
        constraints: one of {NONE, SALVAGE, FLOOD, NON_REPAIRABLE}

  - name: TitleRecord
    parent: null
    common_fields: true
    fields:
      - name: vehicle_id
        type: string
        source: input
        description: FK -> Vehicle.id; the vehicle this title instrument covers
      - name: predecessor_title_id
        type: string
        source: input
        description: >-
          FK -> TitleRecord.id; the title this instrument replaces in the vehicle's title chain;
          null for the first title ever issued on the vehicle
      - name: source_damage_report_id
        type: string
        source: input
        description: >-
          FK -> InsurerDamageReport.id; the carrier report whose recommended_brand_code seeded
          this title's brand; null for titles minted by rebuilt issuance or by transfer
      - name: brand_code
        type: enum
        source: system
        description: >-
          brand stamped on the face of the title; set from recommended_brand_code at salvage
          issuance, to REBUILT at rebuilt issuance, and by
          calculations.brand_carry_forward at transfer
        constraints: one of {NONE, SALVAGE, REBUILT, FLOOD, NON_REPAIRABLE}
      - name: brand_history
        type: array
        source: computed
        description: >-
          union of predecessor_title_id chain brand codes plus this row's brand_code, excluding
          NONE, sorted by BRAND_SEVERITY descending
      - name: status
        type: enum
        source: system
        description: >-
          lifecycle dimension of the title; SUPERSEDED once a successor title is minted, VOID on
          substantiated fraud, SURRENDERED when a NON_REPAIRABLE vehicle is surrendered
        default: ACTIVE
        constraints: one of {ACTIVE, SUPERSEDED, VOID, SURRENDERED}
      - name: recognition_state
        type: enum
        source: system
        description: >-
          interstate-recognition dimension of the same row, evolving independently of status;
          RECOGNITION_PENDING while an InterstateRecognitionRequest is PENDING, RECOGNIZED or
          DOWNGRADED after decision, STALE once the title is superseded or voided while pending
        default: NOT_SUBMITTED
        constraints: one of {NOT_SUBMITTED, RECOGNITION_PENDING, RECOGNIZED, DOWNGRADED, STALE}
      - name: issuing_state_code
        type: string
        source: input
        description: two-letter state code of the issuing jurisdiction
        constraints: exactly 2 uppercase letters
      - name: issued_at
        type: datetime
        source: system
        description: logical-clock instant at which the title was issued
      - name: is_current
        type: boolean
        source: computed
        description: true iff status == ACTIVE and no other TitleRecord of the same vehicle is ACTIVE
        default: true
      - name: transfer_sequence
        type: integer
        source: computed
        description: number of TitleRecord rows in this row's predecessor chain (0 for the first title)
        default: 0
      - name: odometer_at_issue_miles
        type: integer
        source: system
        description: >-
          odometer reading carried onto the title face; taken from the source damage report at
          salvage issuance, from Vehicle.last_odometer_miles at rebuilt issuance, and from
          TitleTransfer.odometer_reading_miles at transfer
      - name: owner_name
        type: string
        source: input
        description: name printed as titled owner
      - name: brand_severity
        type: integer
        source: computed
        description: BRAND_SEVERITY value of brand_code (NONE 0, SALVAGE 30, REBUILT 40, FLOOD 50, NON_REPAIRABLE 90)
        default: 0

  - name: RebuiltApplication
    parent: null
    common_fields: true
    fields:
      - name: vehicle_id
        type: string
        source: input
        description: FK -> Vehicle.id; the vehicle presented for rebuilt inspection
      - name: rebuilder_id
        type: string
        source: input
        description: FK -> Rebuilder.id; the licensed rebuilder accountable for the repair record
      - name: salvage_title_id
        type: string
        source: input
        description: >-
          FK -> TitleRecord.id; the salvage-branded title the application seeks to convert;
          must satisfy brand_code IN {SALVAGE, FLOOD} and is_current == true at creation
      - name: status
        type: enum
        source: system
        description: application lifecycle state (see state_machines.RebuiltApplication)
        default: DRAFT
        constraints: >-
          one of {DRAFT, SUBMITTED, DOCS_UNDER_REVIEW, DOCS_ACCEPTED, SCHEDULED, IN_INSPECTION,
          PASSED, FAILED, APPEAL_PENDING, TITLE_ISSUED, DENIED_FINAL, WITHDRAWN, VOID_FRAUD}
      - name: expedite_requested
        type: boolean
        source: input
        description: whether the rebuilder pays the expedite tier on the program charge
        default: false
      - name: declared_repair_cost_cents
        type: integer
        source: input
        description: rebuilder's declared total repair cost, in cents
        constraints: ">= 0"
      - name: documented_parts_cost_cents
        type: integer
        source: computed
        description: >-
          conserved quantity; equals sum of PartsDocument.amount_cents over this application's
          documents with status == VERIFIED
        default: 0
      - name: documentation_completeness_pct
        type: number
        source: computed
        description: >-
          percentage of required part classes covered by VERIFIED documents
          (calculations.documentation_completeness)
        default: 0.00
        constraints: 0.00 <= value <= 100.00, 2 decimals
      - name: photo_view_count
        type: integer
        source: computed
        description: >-
          count of distinct photo_view_code values among this application's PartsDocument rows
          with doc_type == PHOTOGRAPH and status IN {SUBMITTED, VERIFIED}
        default: 0
      - name: assessed_fee_cents
        type: integer
        source: computed
        description: base plus surcharges (calculations.inspection_fee_assessment)
        default: 7500
      - name: total_program_charge_cents
        type: integer
        source: computed
        description: >-
          charge escrowed at submission and re-derived at each re-inspection scheduling
          (calculations.total_program_charge)
        default: 0
      - name: fee_escrowed_cents
        type: integer
        source: system
        description: >-
          funds currently held against this application; set to total_program_charge_cents on
          submit, raised on re-inspection scheduling, zeroed on withdrawal, fraud void, or
          program capture
        default: 0
      - name: attempts_completed
        type: integer
        source: computed
        description: >-
          count of this application's Inspection rows with status IN {COMPLETED_PASS, COMPLETED_FAIL}
        default: 0
      - name: attempt_limit
        type: integer
        source: system
        description: maximum inspection attempts permitted (mirrors MAX_INSPECTION_ATTEMPTS)
        default: 3
      - name: last_inspection_result
        type: enum
        source: system
        description: result of the most recently completed Inspection; null before the first completion
        constraints: one of {PASS, FAIL}
      - name: withdrawn_reason
        type: string
        source: system
        description: free-text reason captured when the rebuilder withdraws the application
      - name: terminal_at
        type: datetime
        source: system
        description: logical-clock instant the application entered a terminal status

  - name: PartsDocument
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: FK -> RebuiltApplication.id; the application this evidence belongs to
      - name: donor_title_id
        type: string
        source: input
        description: >-
          FK -> TitleRecord.id; title of the donor vehicle the used part came from; required
          when source_type == USED_DONOR, null otherwise
      - name: verified_by_inspector_id
        type: string
        source: system
        description: >-
          FK -> Inspector.id; inspector who verified or rejected this document; null while
          status == SUBMITTED
      - name: doc_type
        type: enum
        source: input
        description: kind of evidence filed
        constraints: one of {RECEIPT, PHOTOGRAPH, PARTS_INVOICE, DONOR_CERTIFICATE}
      - name: part_class
        type: enum
        source: input
        description: part family the evidence covers; PHOTO_SET is used for photographs
        constraints: >-
          one of {STRUCTURAL, RESTRAINT, POWERTRAIN, BODY_PANEL, GLAZING, LIGHTING, WHEEL, PHOTO_SET}
      - name: photo_view_code
        type: enum
        source: input
        description: required camera angle; mandatory when doc_type == PHOTOGRAPH, null otherwise
        constraints: one of {FRONT, REAR, LEFT, RIGHT, VIN_PLATE, ENGINE_BAY}
      - name: source_type
        type: enum
        source: input
        description: parts-sourcing channel, drives traceability and surcharge
        constraints: one of {NEW, USED_DONOR, RECYCLER, OWNER_SUPPLIED}
      - name: vendor_name
        type: string
        source: input
        description: supplier printed on the receipt or invoice
      - name: amount_cents
        type: integer
        source: input
        description: amount on the receipt or invoice, in cents
        default: 0
        constraints: ">= 0"
      - name: part_serial_number
        type: string
        source: input
        description: serial or casting number supporting replacement-part traceability
      - name: donor_vin
        type: string
        source: input
        description: VIN stamped on the donor vehicle the part was harvested from
      - name: status
        type: enum
        source: system
        description: verification state of the document
        default: SUBMITTED
        constraints: one of {SUBMITTED, VERIFIED, REJECTED}
      - name: rejection_reason
        type: enum
        source: system
        description: why the document was rejected; null unless status == REJECTED
        constraints: one of {STOLEN_COMPONENT, UNTRACEABLE_SOURCE, ILLEGIBLE, DUPLICATE}
      - name: traceable
        type: boolean
        source: computed
        description: true iff source_type == NEW or donor_title_id is not null
        default: false

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - name: application_id
        type: string
        source: input
        description: FK -> RebuiltApplication.id; the application being inspected
      - name: inspector_id
        type: string
        source: input
        description: FK -> Inspector.id; inspector assigned to conduct this attempt
      - name: station_id
        type: string
        source: input
        description: FK -> InspectionStation.id; station whose bay the attempt occupies
      - name: attempt_no
        type: integer
        source: system
        description: >-
          1 for the first non-cancelled attempt on the application, incremented per subsequent
          non-cancelled attempt; CANCELLED attempts do not consume a number
        default: 1
      - name: scheduled_start_at
        type: datetime
        source: input
        description: start of the booked interval (ISO 8601 UTC)
      - name: scheduled_end_at
        type: datetime
        source: input
        description: end of the booked interval (ISO 8601 UTC); must be > scheduled_start_at
      - name: effective_end_at
        type: datetime
        source: computed
        description: >-
          scheduled_end_at plus FLOOD_DECONTAMINATION_BUFFER_MINUTES when the inspected vehicle's
          active_brand_code == FLOOD, otherwise equal to scheduled_end_at; this is the end used by
          the inspector half-open overlap rule
      - name: status
        type: enum
        source: system
        description: attempt lifecycle state (see state_machines.Inspection)
        default: SCHEDULED
        constraints: one of {SCHEDULED, IN_PROGRESS, COMPLETED_PASS, COMPLETED_FAIL, CANCELLED}
      - name: result
        type: enum
        source: system
        description: adjudicated outcome; null until completion
        constraints: one of {PASS, FAIL}
      - name: adequacy_score
        type: number
        source: computed
        description: >-
          structural repair adequacy score (calculations.structural_adequacy_score); null until
          completion
        constraints: 0.00 <= value <= 100.00, 2 decimals
      - name: checkpoint_results
        type: array
        source: system
        description: >-
          the five checkpoint outcome objects {code, outcome} submitted at completion, stored
          verbatim for audit
      - name: blocking_findings_count
        type: integer
        source: computed
        description: >-
          count of this inspection's InspectionFinding rows with blocking == true and
          resolved == false
        default: 0
      - name: forced_fail
        type: boolean
        source: computed
        description: >-
          latched true the first time blocking_findings_count becomes >= 1; once true it stays
          true for this attempt and forces result FAIL regardless of adequacy_score
        default: false
      - name: vin_plate_reading
        type: string
        source: system
        description: VIN transcribed off the public VIN plate at completion; null until completion
      - name: vin_verified
        type: boolean
        source: computed
        description: true iff vin_plate_reading equals the inspected Vehicle.vin
        default: false
      - name: started_at
        type: datetime
        source: system
        description: logical-clock instant the attempt moved to IN_PROGRESS
      - name: completed_at
        type: datetime
        source: system
        description: logical-clock instant the attempt reached COMPLETED_PASS or COMPLETED_FAIL
      - name: cancellation_reason
        type: enum
        source: system
        description: why the attempt was cancelled; null unless status == CANCELLED
        constraints: one of {RESCHEDULED, FRAUD_HOLD, APPLICATION_VOIDED, CLERK_REQUEST}

  - name: InspectionFinding
    parent: null
    common_fields: false
    fields:
      - name: inspection_id
        type: string
        source: input
        description: FK -> Inspection.id; the attempt during which the defect was observed
      - name: parts_document_id
        type: string
        source: input
        description: >-
          FK -> PartsDocument.id; the parts document the finding impeaches; null when the finding
          is not tied to a specific document
      - name: category
        type: enum
        source: input
        description: defect family
        constraints: >-
          one of {STOLEN_COMPONENT, VIN_ALTERATION, STRUCTURAL_INADEQUACY, ODOMETER_DISCREPANCY,
          DOCUMENTATION_GAP}
      - name: severity
        type: enum
        source: input
        description: severity assigned by the inspector
        constraints: one of {ADVISORY, MAJOR, CRITICAL}
      - name: description
        type: string
        source: input
        description: narrative description of what was observed
      - name: blocking
        type: boolean
        source: computed
        description: >-
          true iff severity == CRITICAL or category IN {STOLEN_COMPONENT, VIN_ALTERATION}
        default: false
      - name: resolved
        type: boolean
        source: system
        description: >-
          flipped true only by a granted Appeal that cites this finding's inspection
        default: false
      - name: recorded_by_inspector_id
        type: string
        source: system
        description: >-
          X-User-ID of the Inspector who recorded the finding; always equals the inspection's
          inspector_id because only the assigned inspector may record findings

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - name: inspection_id
        type: string
        source: input
        description: FK -> Inspection.id; the failed attempt under appeal
      - name: grounds
        type: enum
        source: input
        description: statutory ground asserted by the rebuilder
        constraints: one of {SCORING_ERROR, PART_TRACEABILITY_DISPUTE, PROCEDURAL_DEFECT}
      - name: narrative
        type: string
        source: input
        description: rebuilder's written argument
      - name: status
        type: enum
        source: system
        description: appeal lifecycle state (see state_machines.Appeal)
        default: FILED
        constraints: one of {FILED, UNDER_REVIEW, GRANTED, DENIED, REMANDED}
      - name: filed_at
        type: datetime
        source: system
        description: logical-clock instant the appeal was filed
      - name: decided_at
        type: datetime
        source: system
        description: logical-clock instant of the GRANTED or DENIED decision; null otherwise
      - name: hearing_officer_user_id
        type: string
        source: system
        description: X-User-ID of the HearingOfficer who moved the appeal to UNDER_REVIEW
      - name: remand_count
        type: integer
        source: computed
        description: number of times this appeal has entered REMANDED
        default: 0
      - name: decision_note
        type: string
        source: system
        description: hearing officer's decision rationale; null before the first decision

  - name: FraudReferral
    parent: null
    common_fields: true
    fields:
      - name: vehicle_id
        type: string
        source: input
        description: FK -> Vehicle.id; the vehicle whose identity or odometer is impeached
      - name: application_id
        type: string
        source: input
        description: >-
          FK -> RebuiltApplication.id; the application in which the irregularity surfaced; null
          for referrals raised outside an application
      - name: inspection_id
        type: string
        source: input
        description: >-
          FK -> Inspection.id; the attempt whose finding produced the referral; null for
          manually filed referrals
      - name: referral_type
        type: enum
        source: input
        description: statutory referral category
        constraints: one of {ODOMETER, IDENTITY_TAMPERING, DOCUMENT_FORGERY}
      - name: origin
        type: enum
        source: system
        description: >-
          AUTO_CASCADE when the referral was synthesized by a cascade, MANUAL when filed through
          POST /v1/fraud-referrals
        default: MANUAL
        constraints: one of {AUTO_CASCADE, MANUAL}
      - name: status
        type: enum
        source: system
        description: referral lifecycle state (see state_machines.FraudReferral)
        default: OPEN
        constraints: one of {OPEN, INVESTIGATING, SUBSTANTIATED, UNSUBSTANTIATED}
      - name: evidence_summary
        type: string
        source: input
        description: summary of the evidence supporting the referral
      - name: opened_by_user_id
        type: string
        source: system
        description: >-
          X-User-ID that caused the referral to exist; the acting user for MANUAL referrals, the
          cascading inspector's id for AUTO_CASCADE referrals
      - name: investigator_user_id
        type: string
        source: system
        description: X-User-ID of the FraudInvestigator who moved the referral to INVESTIGATING
      - name: resolved_at
        type: datetime
        source: system
        description: logical-clock instant the referral reached SUBSTANTIATED or UNSUBSTANTIATED

  - name: InterstateRecognitionRequest
    parent: null
    common_fields: true
    fields:
      - name: title_record_id
        type: string
        source: input
        description: FK -> TitleRecord.id; the title submitted for out-of-state recognition
      - name: requesting_state_code
        type: string
        source: input
        description: two-letter state code asked to recognize the brand
        constraints: exactly 2 uppercase letters
      - name: submitted_brand_code
        type: enum
        source: system
        description: snapshot of the title's brand_code at request creation
        constraints: one of {NONE, SALVAGE, REBUILT, FLOOD, NON_REPAIRABLE}
      - name: mapped_brand_code
        type: enum
        source: system
        description: brand the requesting state elected to carry; null until decided
        constraints: one of {NONE, SALVAGE, REBUILT, FLOOD, NON_REPAIRABLE}
      - name: outcome
        type: enum
        source: system
        description: >-
          RECOGNIZED when mapped_brand_code equals submitted_brand_code, DOWNGRADED when its
          BRAND_SEVERITY is strictly lower but still > 0, REJECTED when the state refuses to
          carry any brand; null until decided
        constraints: one of {RECOGNIZED, DOWNGRADED, REJECTED}
      - name: status
        type: enum
        source: system
        description: request lifecycle state (see state_machines.InterstateRecognitionRequest)
        default: PENDING
        constraints: one of {PENDING, DECIDED, SUPERSEDED}
      - name: decided_at
        type: datetime
        source: system
        description: logical-clock instant the requesting state's decision was recorded

  - name: TitleTransfer
    parent: null
    common_fields: true
    fields:
      - name: from_title_id
        type: string
        source: input
        description: FK -> TitleRecord.id; the outgoing title being conveyed
      - name: to_title_id
        type: string
        source: computed
        description: >-
          FK -> TitleRecord.id; the successor title minted by this transfer with the carried
          brand; null only while the transfer row is being created
      - name: buyer_name
        type: string
        source: input
        description: name of the acquiring owner printed on the successor title
      - name: transfer_effective_at
        type: datetime
        source: input
        description: instant the conveyance takes effect (ISO 8601 UTC)
      - name: odometer_reading_miles
        type: integer
        source: input
        description: odometer disclosure recorded at conveyance
        constraints: ">= 0"
      - name: odometer_flag
        type: enum
        source: computed
        description: >-
          OK when the disclosure is consistent with the chronological replay, ROLLBACK_SUSPECTED
          when it falls below the replayed prior maximum (calculations.odometer_continuity_replay)
        default: OK
        constraints: one of {OK, ROLLBACK_SUSPECTED}
      - name: carried_brand_code
        type: enum
        source: computed
        description: brand carried onto the successor title (calculations.brand_carry_forward)
        constraints: one of {NONE, SALVAGE, REBUILT, FLOOD, NON_REPAIRABLE}
      - name: sale_price_cents
        type: integer
        source: input
        description: stated sale price, in cents
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: RECORDED on success; VOID when a substantiated fraud referral voids the chain
        default: RECORDED
        constraints: one of {RECORDED, VOID}

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: RebuiltApplication
    initial_state: DRAFT
    terminal_states: [TITLE_ISSUED, DENIED_FINAL, WITHDRAWN, VOID_FRAUD]
    transitions:
      - from: null
        to: DRAFT
        trigger: "POST /v1/applications"
        actor: Rebuilder
        preconditions:
          - "acting Rebuilder id (X-User-ID) == body rebuilder_id"
          - "Rebuilder.license_status IN {ACTIVE, PROBATION}"
          - "Vehicle.fraud_hold == NONE"
          - "TitleRecord(salvage_title_id).brand_code IN {SALVAGE, FLOOD} AND is_current == true AND status == ACTIVE"
          - "Vehicle.brand_history does NOT contain NON_REPAIRABLE"
          - "Vehicle.open_application_count == 0"
        side_effects:
          - "sets status = DRAFT, fee_escrowed_cents = 0, attempt_limit = 3"
          - "recomputes Vehicle.open_application_count (+1)"
          - "assessed_fee_cents initialised to BASE_APPLICATION_FEE_CENTS (7500)"

      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /v1/applications/{id}/submit"
        actor: Rebuilder
        preconditions:
          - "acting Rebuilder id == RebuiltApplication.rebuilder_id"
          - "Vehicle.fraud_hold == NONE"
          - "Rebuilder.license_status IN {ACTIVE, PROBATION}"
          - "documentation_completeness_pct == 100.00"
          - "photo_view_count >= REQUIRED_PHOTO_VIEWS (4)"
          - "logical clock <= TitleRecord(salvage_title_id).issued_at + SUBMISSION_WINDOW_DAYS (180)"
          - "Rebuilder.fee_balance_cents >= total_program_charge_cents (recomputed by this call)"
        side_effects:
          - "runs calculations.inspection_fee_assessment -> assessed_fee_cents"
          - "runs calculations.total_program_charge -> total_program_charge_cents"
          - "sets fee_escrowed_cents = total_program_charge_cents"
          - "recomputes Rebuilder.escrowed_fee_total_cents (+charge) and Rebuilder.fee_balance_cents (-charge)"

      - from: SUBMITTED
        to: DOCS_UNDER_REVIEW
        trigger: "POST /v1/applications/{id}/docs-review with decision = OPEN"
        actor: StateTitleClerk
        preconditions: ["status == SUBMITTED"]
        side_effects: ["records review_note; refreshes updated_at and version"]

      - from: DOCS_UNDER_REVIEW
        to: DOCS_ACCEPTED
        trigger: "POST /v1/applications/{id}/docs-review with decision = ACCEPT"
        actor: StateTitleClerk
        preconditions:
          - "status == DOCS_UNDER_REVIEW"
          - "documentation_completeness_pct == 100.00"
          - "every PartsDocument of this application with part_class != PHOTO_SET has status == VERIFIED"
        side_effects: ["records review_note; application becomes schedulable"]

      - from: DOCS_UNDER_REVIEW
        to: DRAFT
        trigger: "POST /v1/applications/{id}/docs-review with decision = RETURN"
        actor: StateTitleClerk
        preconditions: ["status == DOCS_UNDER_REVIEW"]
        side_effects:
          - "records review_note"
          - "fee_escrowed_cents is retained (no refund on return-for-correction)"
        note: "cycle DOCS_UNDER_REVIEW -> DRAFT lets the rebuilder file corrected parts documents"

      - from: DOCS_ACCEPTED
        to: SCHEDULED
        trigger: "POST /v1/applications/{id}/inspections"
        actor: StateTitleClerk
        preconditions:
          - "status IN {DOCS_ACCEPTED, SCHEDULED, FAILED}"
          - "expected_application_version == RebuiltApplication.version"
          - "attempts_completed < attempt_limit"
          - "Vehicle.fraud_hold == NONE"
          - "Inspector.credential_status == CURRENT"
          - "no inspector interval conflict (validations priority 83)"
          - "no station capacity breach (validations priority 84)"
        side_effects:
          - "creates Inspection(status = SCHEDULED, attempt_no = attempts_completed + 1)"
          - "increments RebuiltApplication.version by 1"
          - "increments Inspector.scheduled_inspection_count and InspectionStation.scheduled_occupancy_count"

      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /v1/applications/{id}/inspections (reschedule of a still-SCHEDULED attempt)"
        actor: StateTitleClerk
        preconditions:
          - "expected_application_version == RebuiltApplication.version"
          - "the prior Inspection for this application has status == SCHEDULED"
          - "same interval and capacity checks as the DOCS_ACCEPTED -> SCHEDULED transition"
        side_effects:
          - "prior Inspection: SCHEDULED -> CANCELLED with cancellation_reason = RESCHEDULED"
          - "because the prior attempt was cancelled it releases its inspector interval and station bay"
          - "creates the replacement Inspection with the same attempt_no (cancelled attempts do not consume a number)"
          - "increments RebuiltApplication.version by 1"
        note: "self-loop; the create-with-supersede shape guarded by OCC in concurrency_rules"

      - from: FAILED
        to: SCHEDULED
        trigger: "POST /v1/applications/{id}/inspections (re-inspection after failure)"
        actor: StateTitleClerk
        preconditions:
          - "expected_application_version == RebuiltApplication.version"
          - "attempts_completed < attempt_limit"
          - "body inspector_id != inspector_id of the most recent COMPLETED_FAIL Inspection of this application"
          - "no Appeal of this application has status IN {FILED, UNDER_REVIEW, REMANDED}"
        side_effects:
          - "creates Inspection with attempt_no = attempts_completed + 1"
          - "adds REINSPECTION_FEE_CENTS (4000) to the recomputed total_program_charge_cents and raises fee_escrowed_cents by the delta"
          - "because fee_escrowed_cents rose, Rebuilder.fee_balance_cents drops by the same delta"
          - "increments RebuiltApplication.version by 1"
        note: "cyclic edge: FAILED -> SCHEDULED -> IN_INSPECTION -> FAILED may repeat up to attempt_limit"

      - from: SCHEDULED
        to: IN_INSPECTION
        trigger: "POST /v1/inspections/{id}/start"
        actor: Inspector
        preconditions:
          - "acting Inspector id == Inspection.inspector_id"
          - "Inspection.status == SCHEDULED"
          - "Inspector.credential_status == CURRENT"
          - "logical clock >= Inspection.scheduled_start_at"
          - "Vehicle.fraud_hold == NONE"
        side_effects:
          - "Inspection: SCHEDULED -> IN_PROGRESS with started_at = logical clock"

      - from: IN_INSPECTION
        to: PASSED
        trigger: "POST /v1/inspections/{id}/complete producing result = PASS"
        actor: Inspector
        preconditions:
          - "Inspection.status == IN_PROGRESS"
          - "Inspection.forced_fail == false"
          - "adequacy_score >= ADEQUACY_PASS_THRESHOLD (70.00)"
          - "vin_plate_reading == Vehicle.vin"
        side_effects:
          - "runs calculations.structural_adequacy_score -> Inspection.adequacy_score"
          - "Inspection: IN_PROGRESS -> COMPLETED_PASS, result = PASS, completed_at = clock"
          - "application.attempts_completed recomputed (+1); last_inspection_result = PASS"
          - "releases the inspector interval and station bay (occupancy counters decremented)"

      - from: IN_INSPECTION
        to: FAILED
        trigger: "POST /v1/inspections/{id}/complete producing result = FAIL"
        actor: Inspector
        preconditions:
          - "Inspection.status == IN_PROGRESS"
          - "Inspection.forced_fail == true OR adequacy_score < 70.00 OR vin_plate_reading != Vehicle.vin"
        side_effects:
          - "Inspection: IN_PROGRESS -> COMPLETED_FAIL, result = FAIL, completed_at = clock"
          - "application.attempts_completed recomputed (+1); last_inspection_result = FAIL"
          - "releases the inspector interval and station bay"
        note: "branch point: PASS and FAIL diverge in side-effect set (fee capture vs re-inspection eligibility)"

      - from: FAILED
        to: APPEAL_PENDING
        trigger: "POST /v1/appeals"
        actor: Rebuilder
        preconditions:
          - "acting Rebuilder id == RebuiltApplication.rebuilder_id"
          - "Inspection.status == COMPLETED_FAIL"
          - "logical clock <= Inspection.completed_at + APPEAL_WINDOW_DAYS (30)"
          - "no other Appeal for this inspection has status IN {FILED, UNDER_REVIEW, REMANDED}"
        side_effects:
          - "creates Appeal(status = FILED, filed_at = clock)"
          - "application status -> APPEAL_PENDING (blocks re-inspection scheduling while pending)"

      - from: APPEAL_PENDING
        to: DOCS_ACCEPTED
        trigger: "POST /v1/appeals/{id}/decide with decision = GRANT"
        actor: HearingOfficer
        preconditions:
          - "Appeal.status == UNDER_REVIEW"
          - "application.status == APPEAL_PENDING"
        side_effects:
          - "Appeal -> GRANTED, decided_at = clock"
          - "because the appeal was granted, every InspectionFinding of the appealed Inspection gets resolved = true"
          - "because those findings became resolved, the appealed Inspection.blocking_findings_count drops to 0 (forced_fail stays latched for audit)"
          - "application.attempt_limit += 1 (the vacated attempt is restored) and status -> DOCS_ACCEPTED"

      - from: APPEAL_PENDING
        to: FAILED
        trigger: "POST /v1/appeals/{id}/decide with decision = DENY while attempts_completed < attempt_limit"
        actor: HearingOfficer
        preconditions:
          - "Appeal.status == UNDER_REVIEW"
          - "application.attempts_completed < application.attempt_limit"
        side_effects:
          - "Appeal -> DENIED, decided_at = clock"
          - "application status -> FAILED (re-inspection scheduling unblocked)"

      - from: APPEAL_PENDING
        to: DENIED_FINAL
        trigger: "POST /v1/appeals/{id}/decide with decision = DENY while attempts_completed >= attempt_limit"
        actor: HearingOfficer
        preconditions:
          - "Appeal.status == UNDER_REVIEW"
          - "application.attempts_completed >= application.attempt_limit"
        side_effects:
          - "Appeal -> DENIED, decided_at = clock"
          - "application status -> DENIED_FINAL, terminal_at = clock"
          - "program captures the escrow: Rebuilder.fees_consumed_cents += fee_escrowed_cents, then fee_escrowed_cents = 0"
          - "because escrow left the application, Rebuilder.escrowed_fee_total_cents drops by the same amount (fee_balance_cents unchanged)"
        note: "divergent branch from the DENY trigger: same actor, same decision value, different side-effect set"

      - from: PASSED
        to: TITLE_ISSUED
        trigger: "POST /v1/applications/{id}/issue-rebuilt-title"
        actor: StateTitleClerk
        preconditions:
          - "status == PASSED"
          - "no InspectionFinding of this application's inspections has (category == STOLEN_COMPONENT AND resolved == false)"
          - "Vehicle.fraud_hold == NONE"
          - "TitleRecord(salvage_title_id).status == ACTIVE"
        side_effects:
          - "mints TitleRecord(brand_code = REBUILT, predecessor_title_id = salvage_title_id, status = ACTIVE, issued_at = clock)"
          - "because a successor title exists, the salvage TitleRecord: ACTIVE -> SUPERSEDED and is_current -> false"
          - "because the vehicle's current title changed, Vehicle.active_brand_code -> REBUILT and brand_history gains REBUILT"
          - "program captures the escrow: Rebuilder.fees_consumed_cents += fee_escrowed_cents, then fee_escrowed_cents = 0"
          - "Rebuilder.applications_titled_count += 1"
          - "status -> TITLE_ISSUED, terminal_at = clock"

      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /v1/applications/{id}/withdraw"
        actor: Rebuilder
        preconditions:
          - "acting Rebuilder id == RebuiltApplication.rebuilder_id"
          - "status IN {DRAFT, SUBMITTED, DOCS_UNDER_REVIEW, DOCS_ACCEPTED, SCHEDULED, FAILED}"
        side_effects:
          - "refunds the escrow: Rebuilder.fee_balance_cents += fee_escrowed_cents, then fee_escrowed_cents = 0"
          - "because the application left the non-terminal set, Rebuilder.escrowed_fee_total_cents drops by the refunded amount"
          - "any Inspection of this application with status == SCHEDULED -> CANCELLED (cancellation_reason = APPLICATION_VOIDED), releasing its inspector interval and station bay"
          - "status -> WITHDRAWN, terminal_at = clock, withdrawn_reason recorded"
        note: "same edge is declared valid from SUBMITTED, DOCS_UNDER_REVIEW, DOCS_ACCEPTED, SCHEDULED and FAILED"

      - from: SCHEDULED
        to: VOID_FRAUD
        trigger: "system cascade from POST /v1/fraud-referrals/{id}/resolve with outcome = SUBSTANTIATED"
        actor: system
        preconditions:
          - "the substantiated FraudReferral's vehicle_id matches this application's vehicle_id"
          - "status NOT IN {TITLE_ISSUED, DENIED_FINAL, WITHDRAWN, VOID_FRAUD}"
        side_effects:
          - "refunds the escrow: Rebuilder.fee_balance_cents += fee_escrowed_cents, then fee_escrowed_cents = 0"
          - "any Inspection of this application with status IN {SCHEDULED, IN_PROGRESS} -> CANCELLED (cancellation_reason = FRAUD_HOLD)"
          - "status -> VOID_FRAUD, terminal_at = clock"
        note: "reachable from every non-terminal status, not only SCHEDULED"

  - entity: Inspection
    initial_state: SCHEDULED
    terminal_states: [COMPLETED_PASS, COMPLETED_FAIL, CANCELLED]
    transitions:
      - from: null
        to: SCHEDULED
        trigger: "POST /v1/applications/{id}/inspections"
        actor: StateTitleClerk
        preconditions:
          - "application.status IN {DOCS_ACCEPTED, SCHEDULED, FAILED}"
          - "scheduled_end_at > scheduled_start_at AND scheduled_start_at > logical clock"
          - "InspectionStation.supports_flood == true when Vehicle.active_brand_code == FLOOD"
        side_effects:
          - "computes effective_end_at (adds FLOOD_DECONTAMINATION_BUFFER_MINUTES for FLOOD vehicles)"
          - "increments Inspector.scheduled_inspection_count and InspectionStation.scheduled_occupancy_count"
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /v1/inspections/{id}/start"
        actor: Inspector
        preconditions:
          - "acting Inspector id == inspector_id"
          - "Inspector.credential_status == CURRENT"
          - "logical clock >= scheduled_start_at"
        side_effects:
          - "started_at = clock; application status SCHEDULED -> IN_INSPECTION"
      - from: IN_PROGRESS
        to: COMPLETED_PASS
        trigger: "POST /v1/inspections/{id}/complete"
        actor: Inspector
        preconditions:
          - "forced_fail == false AND adequacy_score >= 70.00 AND vin_plate_reading == Vehicle.vin"
        side_effects:
          - "result = PASS, completed_at = clock; application -> PASSED"
          - "decrements Inspector.scheduled_inspection_count and InspectionStation.scheduled_occupancy_count"
      - from: IN_PROGRESS
        to: COMPLETED_FAIL
        trigger: "POST /v1/inspections/{id}/complete"
        actor: Inspector
        preconditions:
          - "forced_fail == true OR adequacy_score < 70.00 OR vin_plate_reading != Vehicle.vin"
        side_effects:
          - "result = FAIL, completed_at = clock; application -> FAILED"
          - "decrements Inspector.scheduled_inspection_count and InspectionStation.scheduled_occupancy_count"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /v1/inspections/{id}/cancel"
        actor: StateTitleClerk
        preconditions:
          - "status == SCHEDULED"
        side_effects:
          - "cancellation_reason = CLERK_REQUEST; releases inspector interval and station bay"
          - "application status SCHEDULED -> DOCS_ACCEPTED when the cancelled attempt was its only SCHEDULED attempt and attempts_completed == 0"
          - "application status SCHEDULED -> FAILED when attempts_completed >= 1"
        note: "conditional cascade: the application's fallback status depends on attempts_completed"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "system cascade from POST /v1/fraud-referrals/{id}/resolve with outcome = SUBSTANTIATED"
        actor: system
        preconditions: ["the owning application is being voided by the fraud cascade"]
        side_effects:
          - "cancellation_reason = FRAUD_HOLD; releases inspector interval and station bay"

  - entity: PartsDocument
    initial_state: SUBMITTED
    terminal_states: [REJECTED]
    transitions:
      - from: null
        to: SUBMITTED
        trigger: "POST /v1/applications/{id}/parts-documents"
        actor: Rebuilder
        preconditions:
          - "acting Rebuilder id == RebuiltApplication.rebuilder_id"
          - "application.status == DRAFT"
          - "donor_title_id is non-null when source_type == USED_DONOR"
          - "photo_view_code is non-null when doc_type == PHOTOGRAPH"
        side_effects:
          - "recomputes application.photo_view_count and application.documentation_completeness_pct"
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /v1/parts-documents/{id}/verify"
        actor: Inspector
        preconditions:
          - "status == SUBMITTED"
          - "application.status IN {DRAFT, SUBMITTED, DOCS_UNDER_REVIEW}"
          - "Inspector.credential_status == CURRENT"
          - "when source_type == USED_DONOR: TitleRecord(donor_title_id).status != VOID AND brand_code != NON_REPAIRABLE"
        side_effects:
          - "verified_by_inspector_id = acting inspector id"
          - "application.documented_parts_cost_cents += amount_cents (conserved quantity)"
          - "recomputes application.documentation_completeness_pct and, when submitted, assessed_fee_cents"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /v1/parts-documents/{id}/reject"
        actor: Inspector
        preconditions:
          - "status IN {SUBMITTED, VERIFIED}"
          - "Inspector.credential_status == CURRENT"
        side_effects:
          - "rejection_reason recorded; verified_by_inspector_id = acting inspector id"
          - "recomputes application.documentation_completeness_pct"
      - from: VERIFIED
        to: REJECTED
        trigger: "POST /v1/parts-documents/{id}/reject (compensating action)"
        actor: Inspector
        preconditions: ["status == VERIFIED"]
        side_effects:
          - "application.documented_parts_cost_cents -= amount_cents, restoring the invariant documented_parts_cost_cents == sum(VERIFIED amount_cents)"
          - "recomputes application.documentation_completeness_pct"
      - from: VERIFIED
        to: REJECTED
        trigger: "system cascade from POST /v1/inspections/{id}/findings with category = STOLEN_COMPONENT"
        actor: system
        preconditions: ["the finding's parts_document_id points at this document AND status == VERIFIED"]
        side_effects:
          - "rejection_reason = STOLEN_COMPONENT"
          - "application.documented_parts_cost_cents -= amount_cents"

  - entity: TitleRecord
    initial_state: ACTIVE
    terminal_states: [VOID, SURRENDERED]
    transitions:
      - from: null
        to: ACTIVE
        trigger: "POST /v1/title-records"
        actor: StateTitleClerk
        preconditions:
          - "Vehicle exists and Vehicle.fraud_hold != CONFIRMED"
          - "when source_damage_report_id is supplied: the report's vehicle_id == body vehicle_id"
          - "no other TitleRecord of this vehicle has status == ACTIVE unless predecessor_title_id names it"
        side_effects:
          - "brand_code = source report's recommended_brand_code when source_damage_report_id is supplied, else NONE"
          - "issued_at = logical clock; is_current = true; transfer_sequence = predecessor chain length"
          - "when predecessor_title_id is supplied: that title ACTIVE -> SUPERSEDED"
          - "recomputes Vehicle.active_brand_code and Vehicle.brand_history"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /v1/applications/{id}/issue-rebuilt-title or POST /v1/title-transfers"
        actor: StateTitleClerk
        preconditions: ["status == ACTIVE", "a successor TitleRecord is being minted in the same request"]
        side_effects:
          - "is_current -> false"
          - "when recognition_state == RECOGNITION_PENDING it becomes STALE and the PENDING InterstateRecognitionRequest -> SUPERSEDED"
      - from: ACTIVE
        to: VOID
        trigger: "system cascade from POST /v1/fraud-referrals/{id}/resolve with outcome = SUBSTANTIATED"
        actor: system
        preconditions: ["Vehicle.fraud_hold became CONFIRMED in this request", "status == ACTIVE"]
        side_effects:
          - "is_current -> false; brand_history retained for audit"
          - "when recognition_state == RECOGNITION_PENDING it becomes STALE"
          - "because the vehicle's title was voided, every non-terminal RebuiltApplication of the vehicle -> VOID_FRAUD"
      - from: ACTIVE
        to: SURRENDERED
        trigger: "POST /v1/title-records/{id}/surrender"
        actor: StateTitleClerk
        preconditions:
          - "status == ACTIVE"
          - "brand_code == NON_REPAIRABLE"
          - "no RebuiltApplication of the vehicle has status NOT IN {TITLE_ISSUED, DENIED_FINAL, WITHDRAWN, VOID_FRAUD}"
        side_effects:
          - "is_current -> false; Vehicle.active_brand_code -> NONE while brand_history keeps NON_REPAIRABLE"
    note: >-
      parallel dimension on the same row: recognition_state evolves independently of status via the
      InterstateRecognitionRequest lifecycle — NOT_SUBMITTED -> RECOGNITION_PENDING on request
      creation, RECOGNITION_PENDING -> RECOGNIZED|DOWNGRADED on decision, RECOGNIZED ->
      RECOGNITION_PENDING when the title is submitted to a second state, and
      RECOGNITION_PENDING -> STALE whenever status leaves ACTIVE while a request is PENDING.

  - entity: InterstateRecognitionRequest
    initial_state: PENDING
    terminal_states: [DECIDED, SUPERSEDED]
    transitions:
      - from: null
        to: PENDING
        trigger: "POST /v1/recognition-requests"
        actor: StateTitleClerk
        preconditions:
          - "TitleRecord.status == ACTIVE"
          - "expected_title_version == TitleRecord.version"
          - "requesting_state_code != TitleRecord.issuing_state_code"
          - "TitleRecord.brand_code != NONE"
        side_effects:
          - "submitted_brand_code = TitleRecord.brand_code"
          - "any prior InterstateRecognitionRequest of this title with status == PENDING -> SUPERSEDED"
          - "TitleRecord.recognition_state -> RECOGNITION_PENDING; increments TitleRecord.version by 1"
      - from: PENDING
        to: DECIDED
        trigger: "POST /v1/recognition-requests/{id}/decide"
        actor: ProgramAdmin
        preconditions:
          - "status == PENDING"
          - "mapped_brand_code's BRAND_SEVERITY <= submitted_brand_code's BRAND_SEVERITY"
        side_effects:
          - "outcome = RECOGNIZED when mapped_brand_code == submitted_brand_code, DOWNGRADED when severity is strictly lower and > 0, REJECTED when mapped_brand_code == NONE"
          - "TitleRecord.recognition_state -> RECOGNIZED for outcome RECOGNIZED, DOWNGRADED for outcome DOWNGRADED or REJECTED"
          - "decided_at = clock"
      - from: PENDING
        to: SUPERSEDED
        trigger: "POST /v1/recognition-requests (a later request for the same title) or the title leaving ACTIVE"
        actor: system
        preconditions: ["status == PENDING"]
        side_effects: ["TitleRecord.recognition_state -> STALE when the title left ACTIVE"]

  - entity: Appeal
    initial_state: FILED
    terminal_states: [GRANTED, DENIED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /v1/appeals/{id}/review"
        actor: HearingOfficer
        preconditions: ["status IN {FILED, REMANDED}"]
        side_effects: ["hearing_officer_user_id = acting X-User-ID"]
      - from: UNDER_REVIEW
        to: GRANTED
        trigger: "POST /v1/appeals/{id}/decide with decision = GRANT"
        actor: HearingOfficer
        preconditions: ["status == UNDER_REVIEW"]
        side_effects:
          - "resolves every InspectionFinding of the appealed Inspection"
          - "application.attempt_limit += 1; application -> DOCS_ACCEPTED"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /v1/appeals/{id}/decide with decision = DENY"
        actor: HearingOfficer
        preconditions: ["status == UNDER_REVIEW"]
        side_effects:
          - "application -> FAILED when attempts_completed < attempt_limit, else DENIED_FINAL with escrow capture"
      - from: UNDER_REVIEW
        to: REMANDED
        trigger: "POST /v1/appeals/{id}/decide with decision = REMAND"
        actor: HearingOfficer
        preconditions:
          - "status == UNDER_REVIEW"
          - "remand_count < MAX_APPEAL_REMANDS (1)"
        side_effects:
          - "remand_count += 1; application stays APPEAL_PENDING"
      - from: REMANDED
        to: UNDER_REVIEW
        trigger: "POST /v1/appeals/{id}/review"
        actor: HearingOfficer
        preconditions: ["status == REMANDED"]
        side_effects: ["hearing_officer_user_id = acting X-User-ID"]
        note: "cycle REMANDED -> UNDER_REVIEW -> REMANDED bounded by MAX_APPEAL_REMANDS"

  - entity: FraudReferral
    initial_state: OPEN
    terminal_states: [SUBSTANTIATED, UNSUBSTANTIATED]
    transitions:
      - from: null
        to: OPEN
        trigger: "POST /v1/fraud-referrals, or system cascade from a blocking InspectionFinding / odometer rollback"
        actor: Inspector
        preconditions:
          - "Vehicle exists"
          - "no FraudReferral for the same (vehicle_id, referral_type) has status IN {OPEN, INVESTIGATING}"
        side_effects:
          - "opened_by_user_id recorded; origin = MANUAL for the endpoint, AUTO_CASCADE for cascades"
          - "Vehicle.fraud_hold: NONE -> UNDER_REFERRAL"
          - "because the vehicle went UNDER_REFERRAL, Rebuilder.open_referral_count += 1 when application_id is set"
      - from: OPEN
        to: INVESTIGATING
        trigger: "POST /v1/fraud-referrals/{id}/investigate"
        actor: FraudInvestigator
        preconditions: ["status == OPEN"]
        side_effects: ["investigator_user_id = acting X-User-ID"]
      - from: INVESTIGATING
        to: SUBSTANTIATED
        trigger: "POST /v1/fraud-referrals/{id}/resolve with outcome = SUBSTANTIATED"
        actor: FraudInvestigator
        preconditions:
          - "status == INVESTIGATING"
          - "acting X-User-ID != opened_by_user_id (segregation of duties)"
        side_effects:
          - "resolved_at = clock; Vehicle.fraud_hold -> CONFIRMED"
          - "because fraud_hold became CONFIRMED, the vehicle's ACTIVE TitleRecord -> VOID"
          - "because that title was voided, every non-terminal RebuiltApplication of the vehicle -> VOID_FRAUD with escrow refunded"
          - "because those applications were voided, their SCHEDULED/IN_PROGRESS Inspections -> CANCELLED"
          - "Rebuilder.substantiated_referral_count += 1; when it reaches 1 the license moves toward SUSPENDED"
      - from: INVESTIGATING
        to: UNSUBSTANTIATED
        trigger: "POST /v1/fraud-referrals/{id}/resolve with outcome = UNSUBSTANTIATED"
        actor: FraudInvestigator
        preconditions:
          - "status == INVESTIGATING"
          - "acting X-User-ID != opened_by_user_id"
        side_effects:
          - "resolved_at = clock"
          - "Vehicle.fraud_hold -> NONE when no other FraudReferral of the vehicle is OPEN/INVESTIGATING/SUBSTANTIATED"
          - "Rebuilder.open_referral_count -= 1 when application_id is set"

  - entity: Rebuilder
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: PROBATION
        trigger: "POST /v1/rebuilders/{id}/license-actions with action = PROBATION, or system cascade when open_referral_count >= PROBATION_REFERRAL_THRESHOLD (2)"
        actor: ProgramAdmin
        preconditions: ["license_status == ACTIVE"]
        side_effects: ["last_license_action_by_user_id recorded; applications may still be submitted"]
      - from: PROBATION
        to: ACTIVE
        trigger: "POST /v1/rebuilders/{id}/license-actions with action = CLEAR_PROBATION"
        actor: ProgramAdmin
        preconditions:
          - "license_status == PROBATION"
          - "open_referral_count == 0"
        side_effects: ["last_license_action_by_user_id recorded"]
        note: "cycle ACTIVE -> PROBATION -> ACTIVE"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /v1/rebuilders/{id}/license-actions with action = SUSPEND, or system cascade when substantiated_referral_count >= 1"
        actor: ProgramAdmin
        preconditions: ["license_status IN {ACTIVE, PROBATION}"]
        side_effects:
          - "suspended_by_user_id = acting X-User-ID; last_license_action_by_user_id = same"
          - "because the license is suspended, new applications and submissions are refused"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /v1/rebuilders/{id}/license-actions with action = REINSTATE"
        actor: ProgramAdmin
        preconditions:
          - "license_status == SUSPENDED"
          - "acting X-User-ID != suspended_by_user_id (segregation of duties)"
          - "recordkeeping_score_rolling >= REINSTATE_SCORE_THRESHOLD (60.00)"
        side_effects: ["suspended_by_user_id = null; last_license_action_by_user_id recorded"]
        note: "cycle ACTIVE -> SUSPENDED -> ACTIVE, gated by SoD plus the rolling-window score variant"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /v1/rebuilders/{id}/license-actions with action = REVOKE"
        actor: ProgramAdmin
        preconditions:
          - "license_status == SUSPENDED"
          - "recordkeeping_score_lifetime < REVOKE_SCORE_CEILING (40.00)"
        side_effects:
          - "last_license_action_by_user_id recorded"
          - "every non-terminal RebuiltApplication of this rebuilder keeps its escrow (revocation does not refund)"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: schedule-inspection-stale-application
    parent_entity: RebuiltApplication
    write_endpoint: "POST /v1/applications/{id}/inspections"
    occ_field: "expected_application_version"
    description: |
      Scheduling an inspection against a RebuiltApplication whose version has advanced since the
      client last read it is rejected. The product deliberately allows a later scheduling call to
      supersede a still-SCHEDULED attempt (the prior Inspection is cancelled with
      cancellation_reason = RESCHEDULED), so a stale-version writer would otherwise silently
      destroy a booking made after its own read.
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412
  - rule_id: recognition-request-stale-title
    parent_entity: TitleRecord
    write_endpoint: "POST /v1/recognition-requests"
    occ_field: "expected_title_version"
    description: |
      Submitting a title for interstate recognition when the TitleRecord's version has advanced
      since the client last read it is rejected. A second recognition request for the same still
      ACTIVE title legitimately supersedes the earlier PENDING request, so the stale-version check
      is the only thing that stops a writer holding an outdated brand snapshot from replacing a
      newer submission.
    error_id: ERR_STALE_TITLE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: damage_threshold_evaluation
    trigger: "POST /v1/damage-reports (sets InsurerDamageReport.damage_ratio and recommended_brand_code)"
    algorithm: threshold
    formula: |
      # Step 1 — ratio, under the variant named by basis_code (evaluation order is pinned)
      if basis_code == "GROSS_ESTIMATE":
          denominator = acv_cents
      else:  # basis_code == "NET_OF_SALVAGE"
          denominator = acv_cents - salvage_retention_cents      # rejected earlier when <= 0
      damage_ratio = round_half_up(repair_estimate_cents / denominator, 4)

      # Step 2 — brand ladder, evaluated top to bottom; first match wins
      if damage_type == "FLOOD" and flood_water_depth_cm >= FLOOD_DEPTH_BRAND_CM:
          recommended_brand_code = "FLOOD"
      elif damage_ratio >= NON_REPAIRABLE_RATIO_THRESHOLD:
          recommended_brand_code = "NON_REPAIRABLE"
      elif damage_ratio >= SALVAGE_RATIO_THRESHOLD:
          recommended_brand_code = "SALVAGE"
      else:
          recommended_brand_code = "NONE"
    input_set: >-
      exactly the fields of the InsurerDamageReport row being created; no other report of the same
      vehicle participates, and total_loss_declared is recorded for audit but never changes the ratio
    constants:
      SALVAGE_RATIO_THRESHOLD: 0.75
      NON_REPAIRABLE_RATIO_THRESHOLD: 1.20
      FLOOD_DEPTH_BRAND_CM: 46
    precision: "damage_ratio: 4 decimal places, round_half_up; thresholds compared with >= (inclusive)"
    variants:
      - name: gross_estimate_basis
        when: "basis_code == GROSS_ESTIMATE"
        difference: "divides repair_estimate_cents by acv_cents; salvage_retention_cents is ignored"
      - name: net_of_salvage_basis
        when: "basis_code == NET_OF_SALVAGE"
        difference: >-
          divides by (acv_cents - salvage_retention_cents), which raises the ratio for identical
          repair/ACV inputs and can move recommended_brand_code from NONE to SALVAGE without any
          change in the underlying damage

  - name: rebuilder_recordkeeping_score
    trigger: >-
      recomputed on every PartsDocument verify/reject, on POST /v1/rebuilders/{id}/license-actions,
      and on every read of GET /v1/rebuilders/{id} (writes Rebuilder.recordkeeping_score_rolling
      and Rebuilder.recordkeeping_score_lifetime)
    algorithm: weighted_scoring
    formula: |
      # window(variant): rolling_12_month keeps documents whose created_at is within
      #   [clock - ROLLING_WINDOW_DAYS, clock] inclusive on both ends;
      #   lifetime_cumulative keeps every document ever filed.
      docs = [d for d in PartsDocument
              if d.application_id in applications_of(rebuilder)
              and d.part_class != "PHOTO_SET"
              and in_window(d.created_at)]
      if len(docs) == 0:
          score = 100.00                       # empty-input-set convention
      else:
          traceable_verified   = count(d in docs if d.status == "VERIFIED" and d.traceable == true)
          untraceable_verified = count(d in docs if d.status == "VERIFIED" and d.traceable == false)
          # REJECTED and SUBMITTED documents contribute 0 points but DO enter the denominator
          points = TRACEABLE_POINTS * traceable_verified + UNTRACEABLE_POINTS * untraceable_verified
          score = clamp(round_half_up(points / len(docs), 2), 0.00, 100.00)
    input_set: >-
      PartsDocument rows belonging to applications whose rebuilder_id == this rebuilder, of every
      application status including terminal ones, excluding part_class == PHOTO_SET; the variant
      decides the created_at window
    constants:
      ROLLING_WINDOW_DAYS: 365
      TRACEABLE_POINTS: 100
      UNTRACEABLE_POINTS: 40
      REINSTATE_SCORE_THRESHOLD: 60.00
      REVOKE_SCORE_CEILING: 40.00
    precision: "2 decimal places, round_half_up, clamped to [0.00, 100.00]"
    variants:
      - name: rolling_12_month
        when: >-
          consumed by POST /v1/rebuilders/{id}/license-actions with action = REINSTATE (threshold
          >= 60.00) and published as recordkeeping_score_rolling
        difference: >-
          only documents with created_at >= clock - 365 days enter both numerator and denominator,
          so old rejections age out of the score
      - name: lifetime_cumulative
        when: >-
          consumed by POST /v1/rebuilders/{id}/license-actions with action = REVOKE (permitted only
          when the score is < 40.00) and published as recordkeeping_score_lifetime
        difference: >-
          every document the rebuilder ever filed enters the denominator, so identical data yields a
          strictly lower (or equal) score than the rolling variant whenever any pre-window document
          exists

  - name: inspection_fee_assessment
    trigger: >-
      "POST /v1/applications/{id}/submit and every re-scheduling of an inspection (writes
      RebuiltApplication.assessed_fee_cents)"
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER IS PINNED: round each donor line item to whole cents FIRST, then sum.
      # (Summing amount_cents first and rounding the product once is WRONG and yields a
      #  different value — e.g. three 12499-cent lines give 561 per-line vs 562 summed-first.)
      per_line = []
      for d in PartsDocument(application) where d.status == "VERIFIED"
                                          and d.source_type in {"USED_DONOR", "RECYCLER"}:
          per_line.append(round_half_up(d.amount_cents * DONOR_PART_SURCHARGE_RATE))   # 1) round
      donor_surcharge = sum(per_line)                                                  # 2) then sum

      structural_surcharge = STRUCTURAL_SURCHARGE_CENTS if any(
          d.status == "VERIFIED" and d.part_class == "STRUCTURAL"
          for d in PartsDocument(application)) else 0

      surcharge_total     = min(donor_surcharge + structural_surcharge, SURCHARGE_CAP_CENTS)
      assessed_fee_cents  = BASE_APPLICATION_FEE_CENTS + surcharge_total
    input_set: >-
      PartsDocument rows of this application with status == VERIFIED only; SUBMITTED and REJECTED
      documents are excluded, so a rejection that fires after submission lowers the assessment on
      the next recomputation
    constants:
      BASE_APPLICATION_FEE_CENTS: 7500
      DONOR_PART_SURCHARGE_RATE: 0.015
      STRUCTURAL_SURCHARGE_CENTS: 12500
      SURCHARGE_CAP_CENTS: 45000
    precision: "integer cents; each line item rounded half-up before summation; cap applied after summation"

  - name: total_program_charge
    trigger: >-
      "POST /v1/applications/{id}/submit and POST /v1/applications/{id}/inspections when the
      application is re-scheduled from FAILED (writes RebuiltApplication.total_program_charge_cents)"
    algorithm: tiered_pricing
    formula: |
      # EVALUATION ORDER IS PINNED. Both the expedite tier and the discount tier are keyed on
      # subtotal_cents — never on the running total — even though the total is what the rebuilder
      # ultimately pays. Keying either tier on the total is the circular reading and is WRONG.
      subtotal_cents = assessed_fee_cents + REINSPECTION_FEE_CENTS * max(0, attempts_completed)

      if   subtotal_cents <  EXPEDITE_TIER_1_CEILING: expedite_pct = 0.10
      elif subtotal_cents <  EXPEDITE_TIER_2_CEILING: expedite_pct = 0.07
      else:                                          expedite_pct = 0.05
      expedite_fee_cents = round_half_up(subtotal_cents * expedite_pct) if expedite_requested else 0

      discount_pct = VOLUME_DISCOUNT_PCT if rebuilder.applications_titled_count >= VOLUME_DISCOUNT_MIN_TITLES else 0.00
      discount_cents = round_half_up((subtotal_cents + expedite_fee_cents) * discount_pct)

      total_program_charge_cents = subtotal_cents + expedite_fee_cents - discount_cents
    input_set: >-
      the application's own assessed_fee_cents and attempts_completed (COMPLETED_PASS plus
      COMPLETED_FAIL attempts, CANCELLED attempts excluded), plus the owning rebuilder's
      applications_titled_count at the instant of the call
    constants:
      REINSPECTION_FEE_CENTS: 4000
      EXPEDITE_TIER_1_CEILING: 10000
      EXPEDITE_TIER_2_CEILING: 25000
      VOLUME_DISCOUNT_PCT: 0.05
      VOLUME_DISCOUNT_MIN_TITLES: 5
    precision: "integer cents; expedite fee rounded half-up before the discount base is formed; discount rounded half-up once"

  - name: structural_adequacy_score
    trigger: "POST /v1/inspections/{id}/complete (writes Inspection.adequacy_score and result)"
    algorithm: weighted_scoring
    formula: |
      # checkpoint_results MUST contain exactly one entry per code in CHECKPOINT_WEIGHTS
      factor = {"PASS": 1.0, "MARGINAL": 0.5, "FAIL": 0.0}
      adequacy_score = round_half_up(
          sum(CHECKPOINT_WEIGHTS[c.code] * factor[c.outcome] for c in checkpoint_results), 2)

      auto_fail = (
          any(c.outcome == "FAIL" and c.code in {"STRUCTURAL_FRAME", "VIN_INTEGRITY"} for c in checkpoint_results)
          or inspection.forced_fail == true
          or vin_plate_reading != vehicle.vin
      )
      result = "PASS" if (auto_fail == false and adequacy_score >= ADEQUACY_PASS_THRESHOLD) else "FAIL"
    input_set: >-
      exactly the five checkpoint outcomes submitted with the completion call, plus the inspection's
      own latched forced_fail flag and the transcribed vin_plate_reading
    constants:
      CHECKPOINT_WEIGHTS:
        STRUCTURAL_FRAME: 35
        RESTRAINT_SYSTEM: 20
        VIN_INTEGRITY: 20
        SUSPENSION_STEERING: 15
        LAMPS_GLAZING: 10
      ADEQUACY_PASS_THRESHOLD: 70.00
    precision: "2 decimal places, round_half_up; the pass test is >= (a score of exactly 70.00 passes)"

  - name: documentation_completeness
    trigger: >-
      "recomputed on every POST /v1/applications/{id}/parts-documents, verify and reject call
      (writes RebuiltApplication.documentation_completeness_pct)"
    algorithm: aggregation
    formula: |
      required = REQUIRED_PART_CLASSES[vehicle.body_class]      # ordered, may be empty
      if len(required) == 0:
          documentation_completeness_pct = 100.00               # empty required set is vacuously complete
      else:
          covered = count(pc in required
                          if exists PartsDocument(application) with part_class == pc
                                                             and status == "VERIFIED")
          documentation_completeness_pct = round_half_up(100 * covered / len(required), 2)
    input_set: >-
      PartsDocument rows of this application with status == VERIFIED only, matched against the
      required part-class list selected by the vehicle's body_class; PHOTO_SET documents never
      satisfy a required class (photo coverage is enforced separately by photo_view_count)
    constants:
      REQUIRED_PART_CLASSES:
        SEDAN: [STRUCTURAL, RESTRAINT, LIGHTING]
        SUV: [STRUCTURAL, RESTRAINT, LIGHTING]
        TRUCK: [STRUCTURAL, RESTRAINT, LIGHTING]
        MOTORCYCLE: [STRUCTURAL, LIGHTING]
        TRAILER: []
      REQUIRED_PHOTO_VIEWS: 4
    precision: "2 decimal places, round_half_up; the submit gate compares == 100.00"

  - name: brand_carry_forward
    trigger: >-
      "POST /v1/title-transfers (writes TitleTransfer.carried_brand_code and the successor
      TitleRecord.brand_code / brand_history / brand_severity)"
    algorithm: constraint_propagation
    formula: |
      chain_brands = set()
      t = from_title
      while t is not None:                      # walk predecessor_title_id to the root
          if t.brand_code != "NONE":
              chain_brands.add(t.brand_code)
          t = title_by_id(t.predecessor_title_id)

      if len(chain_brands) == 0:
          carried_brand_code = "NONE"
      else:
          # BRAND_SEVERITY values are distinct integers, so the maximum is unique — no tie-break needed
          carried_brand_code = argmax(chain_brands, key = BRAND_SEVERITY)

      successor.brand_code    = carried_brand_code
      successor.brand_history = sorted(chain_brands, key = BRAND_SEVERITY, reverse = True)
      successor.brand_severity = BRAND_SEVERITY[carried_brand_code]
    input_set: >-
      the outgoing title plus every ancestor reachable through predecessor_title_id, regardless of
      each ancestor's status (SUPERSEDED and VOID ancestors still contribute their brand); sibling
      titles of the same vehicle that are not in the chain are excluded
    constants:
      BRAND_SEVERITY:
        NONE: 0
        SALVAGE: 30
        REBUILT: 40
        FLOOD: 50
        NON_REPAIRABLE: 90
    precision: "exact enum selection; severity comparison is strict integer comparison"

  - name: odometer_continuity_replay
    trigger: "POST /v1/title-transfers (writes TitleTransfer.odometer_flag)"
    algorithm: chronological
    formula: |
      events = []
      for r in InsurerDamageReport where r.vehicle_id == vehicle.id:
          events.append((r.report_effective_at, r.created_at, r.odometer_reading_miles))
      for x in TitleTransfer where title_of(x.from_title_id).vehicle_id == vehicle.id
                               and x.status == "RECORDED":
          events.append((x.transfer_effective_at, x.created_at, x.odometer_reading_miles))

      # sort key: effective timestamp ASC, then created_at ASC as the tie-break (never id)
      events.sort(key = lambda e: (e[0], e[1]))
      prior = [e for e in events if e[0] <= new_transfer.transfer_effective_at]

      if len(prior) == 0:
          odometer_flag = "OK"
      else:
          prior_max = max(e[2] for e in prior)
          odometer_flag = "ROLLBACK_SUSPECTED" if (
              new_transfer.odometer_reading_miles < prior_max - ODOMETER_TOLERANCE_MILES) else "OK"
    input_set: >-
      every InsurerDamageReport of the vehicle plus every TitleTransfer of the vehicle with
      status == RECORDED whose effective timestamp is <= the new transfer's transfer_effective_at;
      VOID transfers are excluded
    constants:
      ODOMETER_TOLERANCE_MILES: 0
    precision: "integer miles; strict < comparison against (prior_max - tolerance)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lowest number wins)
# =============================================================================
validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 20
    category: auth
    check: "the acting X-User-Role appears in the endpoint's §1.5 roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 30
    category: existence
    check: "path-segment resources exist, validated left to right"
    error_id: ERR_VEHICLE_NOT_FOUND | ERR_REBUILDER_NOT_FOUND | ERR_INSPECTOR_NOT_FOUND | ERR_STATION_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_PARTS_DOCUMENT_NOT_FOUND | ERR_INSPECTION_NOT_FOUND | ERR_FINDING_NOT_FOUND | ERR_APPEAL_NOT_FOUND | ERR_TITLE_NOT_FOUND | ERR_REFERRAL_NOT_FOUND | ERR_RECOGNITION_REQUEST_NOT_FOUND | ERR_DAMAGE_REPORT_NOT_FOUND | ERR_TRANSFER_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 35
    category: existence
    check: "foreign keys supplied in the request body resolve to existing rows, validated in the body-field order declared by the endpoint's input list"
    error_id: ERR_VEHICLE_NOT_FOUND | ERR_REBUILDER_NOT_FOUND | ERR_TITLE_NOT_FOUND | ERR_INSPECTOR_NOT_FOUND | ERR_STATION_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_INSPECTION_NOT_FOUND | ERR_PARTS_DOCUMENT_NOT_FOUND | ERR_DAMAGE_REPORT_NOT_FOUND
    http_status: 404
    applies_to: "all POST endpoints carrying FK fields"

  - priority: 40
    category: business_constraint
    check: >-
      request body is well formed — required fields present, enum members legal, integers
      non-negative where constrained, scheduled_end_at > scheduled_start_at, limit within
      [1, 100], offset >= 0, VIN exactly 17 legal characters, and checkpoint_results carrying
      exactly one entry per CHECKPOINT_WEIGHTS code
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 45
    category: business_constraint
    check: >-
      uniqueness of natural keys — Vehicle.vin, Rebuilder.license_number, Inspector.badge_number,
      InspectionStation.station_code, and (insurer_name, claim_number) on InsurerDamageReport
    error_id: ERR_DUPLICATE_NATURAL_KEY
    http_status: 409
    applies_to: "POST /v1/vehicles, /v1/rebuilders, /v1/inspectors, /v1/inspection-stations, /v1/damage-reports"

  - priority: 50
    category: auth
    check: >-
      entity-backed ownership — the acting Rebuilder's X-User-ID equals the target
      RebuiltApplication.rebuilder_id (or the body rebuilder_id on creation), and the acting
      Inspector's X-User-ID equals the target Inspection.inspector_id
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: >-
      "POST /v1/applications, /v1/applications/{id}/submit, /v1/applications/{id}/parts-documents,
      /v1/applications/{id}/withdraw, /v1/appeals, /v1/inspections/{id}/start,
      /v1/inspections/{id}/findings, /v1/inspections/{id}/complete"

  - priority: 55
    category: state
    check: "expected_application_version equals RebuiltApplication.version"
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412
    applies_to: "POST /v1/applications/{id}/inspections"

  - priority: 56
    category: state
    check: "expected_title_version equals TitleRecord.version"
    error_id: ERR_STALE_TITLE_VERSION
    http_status: 412
    applies_to: "POST /v1/recognition-requests"

  - priority: 60
    category: state
    check: "RebuiltApplication.status == DRAFT"
    error_id: ERR_APPLICATION_NOT_DRAFT
    http_status: 409
    applies_to: "POST /v1/applications/{id}/submit, POST /v1/applications/{id}/parts-documents"

  - priority: 61
    category: state
    check: >-
      RebuiltApplication.status is in the transition's declared from-set — {SUBMITTED,
      DOCS_UNDER_REVIEW} for docs-review, {DOCS_ACCEPTED, SCHEDULED, FAILED} for scheduling,
      {PASSED} for rebuilt-title issuance, {DRAFT, SUBMITTED, DOCS_UNDER_REVIEW, DOCS_ACCEPTED,
      SCHEDULED, FAILED} for withdrawal
    error_id: ERR_INVALID_APPLICATION_STATE
    http_status: 409
    applies_to: >-
      "POST /v1/applications/{id}/docs-review, /v1/applications/{id}/inspections,
      /v1/applications/{id}/issue-rebuilt-title, /v1/applications/{id}/withdraw"

  - priority: 62
    category: state
    check: "Inspection.status == SCHEDULED"
    error_id: ERR_INSPECTION_NOT_SCHEDULED
    http_status: 409
    applies_to: "POST /v1/inspections/{id}/start, POST /v1/inspections/{id}/cancel"

  - priority: 63
    category: state
    check: "Inspection.status == IN_PROGRESS"
    error_id: ERR_INSPECTION_NOT_IN_PROGRESS
    http_status: 409
    applies_to: "POST /v1/inspections/{id}/findings, POST /v1/inspections/{id}/complete"

  - priority: 64
    category: state
    check: "PartsDocument.status is in the transition's from-set — {SUBMITTED} for verify, {SUBMITTED, VERIFIED} for reject"
    error_id: ERR_PARTS_DOCUMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /v1/parts-documents/{id}/verify, POST /v1/parts-documents/{id}/reject"

  - priority: 65
    category: state
    check: "TitleRecord.status == ACTIVE and is_current == true"
    error_id: ERR_TITLE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /v1/title-transfers, POST /v1/recognition-requests, POST /v1/title-records/{id}/surrender"

  - priority: 66
    category: state
    check: "Appeal.status is in the transition's from-set — {FILED, REMANDED} for review, {UNDER_REVIEW} for decide"
    error_id: ERR_APPEAL_STATE_INVALID
    http_status: 409
    applies_to: "POST /v1/appeals/{id}/review, POST /v1/appeals/{id}/decide"

  - priority: 67
    category: state
    check: "FraudReferral.status is in the transition's from-set — {OPEN} for investigate, {INVESTIGATING} for resolve"
    error_id: ERR_REFERRAL_STATE_INVALID
    http_status: 409
    applies_to: "POST /v1/fraud-referrals/{id}/investigate, POST /v1/fraud-referrals/{id}/resolve"

  - priority: 68
    category: state
    check: "Rebuilder.license_status is in the requested action's from-set (see state_machines.Rebuilder)"
    error_id: ERR_LICENSE_ACTION_INVALID
    http_status: 409
    applies_to: "POST /v1/rebuilders/{id}/license-actions"

  - priority: 69
    category: state
    check: "InterstateRecognitionRequest.status == PENDING"
    error_id: ERR_RECOGNITION_ALREADY_DECIDED
    http_status: 409
    applies_to: "POST /v1/recognition-requests/{id}/decide"

  - priority: 70
    category: business_safety
    check: >-
      the subject Vehicle's fraud_hold == NONE (UNDER_REFERRAL and CONFIRMED both block the
      operation)
    error_id: ERR_VEHICLE_FRAUD_HOLD
    http_status: 409
    applies_to: >-
      "POST /v1/applications, /v1/applications/{id}/submit, /v1/applications/{id}/inspections,
      /v1/applications/{id}/issue-rebuilt-title, /v1/inspections/{id}/start, /v1/title-transfers"

  - priority: 71
    category: business_safety
    check: >-
      the Vehicle's brand_history does not contain NON_REPAIRABLE and the referenced title's
      brand_code != NON_REPAIRABLE
    error_id: ERR_NON_REPAIRABLE_BRAND
    http_status: 409
    applies_to: "POST /v1/applications, POST /v1/title-transfers"

  - priority: 72
    category: business_safety
    check: >-
      no InspectionFinding of the application's inspections has category == STOLEN_COMPONENT with
      resolved == false
    error_id: ERR_STOLEN_COMPONENT_UNRESOLVED
    http_status: 409
    applies_to: "POST /v1/applications/{id}/issue-rebuilt-title"

  - priority: 73
    category: business_safety
    check: >-
      the acting user is not the user who created the state being reviewed — the re-inspection's
      body inspector_id differs from the inspector_id of the application's most recent
      COMPLETED_FAIL Inspection, and a REINSTATE action is not performed by
      Rebuilder.suspended_by_user_id, and a fraud resolution is not performed by
      FraudReferral.opened_by_user_id
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: >-
      "POST /v1/applications/{id}/inspections, POST /v1/rebuilders/{id}/license-actions,
      POST /v1/fraud-referrals/{id}/resolve"

  - priority: 75
    category: business_referential
    check: "Rebuilder.license_status IN {ACTIVE, PROBATION}"
    error_id: ERR_REBUILDER_LICENSE_INACTIVE
    http_status: 403
    applies_to: "POST /v1/applications, POST /v1/applications/{id}/submit"

  - priority: 76
    category: business_referential
    check: "Inspector.credential_status == CURRENT (credential_expires_at > logical clock)"
    error_id: ERR_INSPECTOR_CREDENTIAL_EXPIRED
    http_status: 409
    applies_to: >-
      "POST /v1/applications/{id}/inspections, /v1/inspections/{id}/start,
      /v1/parts-documents/{id}/verify, /v1/parts-documents/{id}/reject"

  - priority: 77
    category: business_referential
    check: >-
      the referenced salvage TitleRecord has brand_code IN {SALVAGE, FLOOD}, status == ACTIVE and
      is_current == true, and its vehicle_id equals the application's vehicle_id
    error_id: ERR_SALVAGE_TITLE_REQUIRED
    http_status: 409
    applies_to: "POST /v1/applications"

  - priority: 78
    category: business_referential
    check: >-
      replacement-part traceability — a PartsDocument with source_type == USED_DONOR carries a
      donor_title_id whose TitleRecord has status != VOID and brand_code != NON_REPAIRABLE
    error_id: ERR_DONOR_TITLE_NOT_TRACEABLE
    http_status: 422
    applies_to: "POST /v1/applications/{id}/parts-documents, POST /v1/parts-documents/{id}/verify"

  - priority: 79
    category: business_referential
    check: >-
      a FLOOD-branded vehicle may only occupy a station whose supports_flood == true, and the
      assigned Inspector's certifications contain STRUCTURAL
    error_id: ERR_STATION_NOT_FLOOD_CAPABLE
    http_status: 409
    applies_to: "POST /v1/applications/{id}/inspections"

  - priority: 80
    category: business_constraint
    check: "the vehicle has no other RebuiltApplication whose status is non-terminal"
    error_id: ERR_DUPLICATE_ACTIVE_APPLICATION
    http_status: 409
    applies_to: "POST /v1/applications"

  - priority: 81
    category: business_constraint
    check: "RebuiltApplication.documentation_completeness_pct == 100.00"
    error_id: ERR_DOCUMENTATION_INCOMPLETE
    http_status: 422
    applies_to: "POST /v1/applications/{id}/submit, POST /v1/applications/{id}/docs-review with decision = ACCEPT"

  - priority: 82
    category: business_constraint
    check: "RebuiltApplication.photo_view_count >= REQUIRED_PHOTO_VIEWS (4)"
    error_id: ERR_PHOTO_SET_INCOMPLETE
    http_status: 422
    applies_to: "POST /v1/applications/{id}/submit"

  - priority: 83
    category: business_constraint
    check: >-
      attempts_completed < attempt_limit (MAX_INSPECTION_ATTEMPTS 3 plus attempts restored by
      granted appeals)
    error_id: ERR_ATTEMPT_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /v1/applications/{id}/inspections"

  - priority: 84
    category: business_constraint
    check: >-
      no Appeal of the application has status IN {FILED, UNDER_REVIEW, REMANDED} while a
      re-inspection is being scheduled
    error_id: ERR_APPEAL_PENDING_BLOCKS_SCHEDULING
    http_status: 409
    applies_to: "POST /v1/applications/{id}/inspections"

  - priority: 85
    category: business_temporal
    check: >-
      inspector interval exclusivity — the requested [scheduled_start_at, effective_end_at)
      half-open interval must not intersect any existing Inspection of the same inspector_id with
      status IN {SCHEDULED, IN_PROGRESS}; touching endpoints (existing effective_end_at ==
      requested scheduled_start_at) do NOT collide, and the FLOOD decontamination buffer of 30
      minutes is added to the EXISTING inspection's end before the comparison
    error_id: ERR_INSPECTOR_INTERVAL_CONFLICT
    http_status: 409
    applies_to: "POST /v1/applications/{id}/inspections"

  - priority: 86
    category: business_constraint
    check: >-
      station aggregate capacity — the count of the station's Inspection rows with status IN
      {SCHEDULED, IN_PROGRESS} whose CLOSED interval [scheduled_start_at, scheduled_end_at]
      intersects the requested CLOSED interval (touching endpoints DO count as intersecting) must
      be < InspectionStation.bay_count
    error_id: ERR_STATION_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /v1/applications/{id}/inspections"

  - priority: 87
    category: business_temporal
    check: "logical clock <= TitleRecord(salvage_title_id).issued_at + SUBMISSION_WINDOW_DAYS (180)"
    error_id: ERR_SUBMISSION_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /v1/applications/{id}/submit"

  - priority: 88
    category: business_temporal
    check: "scheduled_start_at > logical clock"
    error_id: ERR_INSPECTION_SLOT_IN_PAST
    http_status: 422
    applies_to: "POST /v1/applications/{id}/inspections"

  - priority: 89
    category: business_temporal
    check: >-
      logical clock <= Inspection.completed_at + APPEAL_WINDOW_DAYS (30) and the inspection has
      status == COMPLETED_FAIL
    error_id: ERR_APPEAL_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /v1/appeals"

  - priority: 90
    category: business_temporal
    check: "transfer_effective_at >= TitleRecord(from_title_id).issued_at"
    error_id: ERR_TRANSFER_PREDATES_TITLE
    http_status: 422
    applies_to: "POST /v1/title-transfers"

  - priority: 91
    category: business_constraint
    check: >-
      VIN verification — the transcribed vin_plate_reading equals Vehicle.vin, unless an
      InspectionFinding with category == VIN_ALTERATION already exists on this inspection (in
      which case the mismatch is the documented defect and the completion proceeds to a FAIL)
    error_id: ERR_VIN_MISMATCH
    http_status: 422
    applies_to: "POST /v1/inspections/{id}/complete"

  - priority: 92
    category: business_constraint
    check: >-
      brand monotonicity on interstate recognition — mapped_brand_code's BRAND_SEVERITY must be
      <= submitted_brand_code's BRAND_SEVERITY (a state may downgrade or refuse a brand, never
      escalate one)
    error_id: ERR_BRAND_ESCALATION_FORBIDDEN
    http_status: 422
    applies_to: "POST /v1/recognition-requests/{id}/decide"

  - priority: 95
    category: business_fiscal
    check: "Rebuilder.fee_balance_cents >= the total_program_charge_cents computed by this call"
    error_id: ERR_INSUFFICIENT_FEE_BALANCE
    http_status: 402
    applies_to: "POST /v1/applications/{id}/submit, POST /v1/applications/{id}/inspections (re-inspection delta)"

  - priority: 96
    category: business_fiscal
    check: >-
      license reinstatement requires recordkeeping_score_rolling >= 60.00; revocation requires
      recordkeeping_score_lifetime < 40.00
    error_id: ERR_RECORDKEEPING_SCORE_BLOCKS_ACTION
    http_status: 422
    applies_to: "POST /v1/rebuilders/{id}/license-actions"

