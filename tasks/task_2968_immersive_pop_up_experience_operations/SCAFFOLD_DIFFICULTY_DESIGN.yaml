  # ===========================================================================
  # Rule 3 - non_linear_state_machine (three different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: venue_permit_conditions_cycle_and_three_way_decision_branch
        grounds:
          - state_machines.PopupVenue.DRAFT_to_PERMIT_UNDER_REVIEW
          - state_machines.PopupVenue.PERMIT_UNDER_REVIEW_to_PERMIT_CONDITIONS
          - state_machines.PopupVenue.PERMIT_CONDITIONS_to_PERMIT_UNDER_REVIEW
          - state_machines.PopupVenue.PERMIT_UNDER_REVIEW_to_PERMIT_ISSUED
          - state_machines.PopupVenue.PERMIT_UNDER_REVIEW_to_PERMIT_DENIED
          - entities.PopupVenue.fields.permit_submission_round
          - entities.PopupVenue.fields.permit_conditions_note
          - entities.PopupVenue.fields.permit_denial_reason
          - errors[ERR_PERMIT_ROUND_CAP]
          - errors[ERR_VENUE_INVALID_STATE]
        distinguishing_aspect: |
          PopupVenue is cyclic AND branching on one dimension: PERMIT_UNDER_REVIEW forks three ways
          (CONDITIONS, ISSUED, DENIED) with different side-effect sets, and the CONDITIONS arm loops
          back to PERMIT_UNDER_REVIEW while incrementing permit_submission_round, so the same
          endpoint pair is legal three times and refused the fourth. Only the ISSUED arm writes
          permitted_occupancy_load, only the DENIED arm writes permit_denial_reason, and DENIED is
          terminal - a linear DRAFT -> REVIEW -> ISSUED reading of the machine fails every arm here.
        test_recipe:
          setup:
            - "Three DRAFT venues, each with requested_occupancy_load 180 and egress_width_cm 400 (egress_capacity 197), so the occupancy precondition never blocks the submission."
            - "Venue A is used for the CONDITIONS loop, venue B for the DENIED arm, venue C for the ISSUED arm."
            - "PERMIT_ROUND_CAP is 3, so venue A may submit three packages and no more."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOpsManager
            - call: "POST /venues"
