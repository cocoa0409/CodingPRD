              as_user_id: "${p_id}"
            - call: "POST /market/operating-days/${d_id}/performance-events"
              payload: { start_interval: 1, end_interval: 2 }
              as: IsoOperator
              captures: { ev_id: $.data.id }
            - { call: "POST /market/events/${ev_id}/activate", as: IsoOperator }
            - { call: "POST /market/events/${ev_id}/complete", as: IsoOperator }
            - { call: "POST /market/operating-days/${d_id}/close-real-time", payload: { rt_node_prices_prelim: [] }, as: IsoOperator }
            - { call: "POST /market/operating-days/${d_id}/run-preliminary-settlement", as: IsoOperator }
            - { call: "POST /market/operating-days/${d_id}/run-final-settlement", payload: { rt_node_prices_final: [] }, as: IsoOperator }
            - call: "POST /market/participants/${p_id}/postings"
              payload: { amount_cents: 300000, instrument_type: "CASH" }
              as: CreditOfficer
              as_user_id: "${p_id}"
              captures: { cp_x: $.data.id }
            - call: "POST /market/participants/${p_id}/postings"
              payload: { amount_cents: 100000, instrument_type: "LETTER_OF_CREDIT" }
              as: CreditOfficer
              as_user_id: "${p_id}"
              captures: { cp_y: $.data.id }
          trigger:
            - { call: "POST /market/postings/${cp_y}/release", as: CreditOfficer, as_user_id: "${p_id}", captures: { y_st: $.data.status } }
            - call: "GET /market/participants/${p_id}"
              as: IsoOperator
              captures: { p_posted: $.data.posted_collateral_cents, p_st: $.data.status }
            - call: "POST /market/postings/${cp_x}/release"
              as: CreditOfficer
              as_user_id: "${p_id}"
              captures: { e: $.data.error_id }
          assert:
            - "Releasing Y leaves posted 300000 == effective_requirement 300000 → allowed (equality): Y RELEASED, participant ACTIVE, no new margin call"
            - "Releasing X next would leave 0 < 300000 → ERR_COLLATERAL_SHORTFALL (409); X remains POSTED"

