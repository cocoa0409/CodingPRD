  condition: Dispute id does not exist
- id: ERR_MARKET_SUSPENDED
  http: 409
  condition: Market is SUSPENDED; new share orders, leads, and listings rejected
- id: ERR_INVALID_STATE
  http: 409
  condition: Target resource in a state that forbids this transition (generic state violation)
- id: ERR_ALREADY_TERMINAL
  http: 409
  condition: Entity already in a terminal state; no further transitions
- id: ERR_AGENT_SUSPENDED
  http: 409
  condition: Agent is SUSPENDED or DEACTIVATED and cannot perform this action
- id: ERR_TEAM_DISSOLVED
  http: 409
  condition: TeamAccount is DISSOLVED
- id: ERR_STALE_MARKET_VERSION
  http: 412
  condition: expected_market_version does not match current Market.version (OCC)
- id: ERR_STALE_LEAD_VERSION
  http: 412
  condition: expected_lead_version does not match current Lead.version (OCC)
- id: ERR_LICENSE_STATE_MISMATCH
  http: 422
  condition: Agent license_state does not match market.state_code for purchase or routing
- id: ERR_LISTING_DISPLAY_VIOLATION
  http: 422
  condition: Listing violates the market participation agreement display rules (display_rule_check)
- id: ERR_SHARE_CAPACITY_EXCEEDED
  http: 422
  condition: Aggregate ACTIVE share_bps would exceed 10000 in market at activation or resume
- id: ERR_OFFER_EXPIRED
  http: 422
  condition: LeadAssignment expires_at <= now at accept time
- id: ERR_NOT_A_CANDIDATE
  http: 422
  condition: Acting agent is not in the assignment's candidate_agent_ids
- id: ERR_DUPLICATE_LEAD
  http: 422
  condition: Same consumer_key in market within 30 days (anchor not REJECTED_DUPLICATE) or same consumer_key + listing_agent_id
- id: ERR_TEAM_MEMBERSHIP_INVALID
  http: 422
  condition: Team membership missing/inactive, duplicate active membership, team dissolved, or team/order market mismatch
- id: ERR_NOT_TEAM_LEAD
  http: 422
  condition: Acting agent is not the team's lead_agent_id
- id: ERR_PAYMENT_AMOUNT_MISMATCH
  http: 422
  condition: amount_cents does not equal required deposit (activation) or outstanding balance (settlement)
- id: ERR_CREDIT_CLAIM_INVALID
  http: 422
  condition: Lead not in a finalized chargeable status, already credited, or claimant is not the accepted agent
- id: ERR_NO_ELIGIBLE_CANDIDATES
  http: 422
  condition: 'Manual assign: no eligible covering order for the assignee in this market'
- id: ERR_RATING_OUT_OF_RANGE
  http: 422
  condition: Rating score outside 1..5
- id: ERR_CONNECTION_NOT_BRIDGING
  http: 409
  condition: LiveConnection not in BRIDGING status for record
- id: ERR_DISPUTE_TYPE_MISMATCH
  http: 422
  condition: Dispute missing required reference for its type (listing_id or lead_id/requested_agent_id) or resolution invalid for type
roles:
- name: Agent
  description: Licensed real-estate agent advertiser; buys zip share, receives and works leads, files credit claims
  identity: entity_backed:Agent
  exclusive_operations:
  - POST /team-accounts
  - POST /team-memberships
  - POST /team-memberships/{id}/remove
  - POST /team-accounts/{id}/dissolve
  - POST /share-orders
  - POST /share-orders/{id}/payments
  - POST /share-orders/{id}/pause
  - POST /share-orders/{id}/resume
  - POST /share-orders/{id}/cancel
  - POST /lead-assignments/{id}/accept
  - POST /live-connections
  - POST /live-connections/{id}/record
  - POST /leads/{id}/close
  - POST /credit-claims
  - POST /agents/{id}/deactivate
  shared_operations:
  - POST /leads
  - all GET endpoints
- name: BrokerageUser
  description: Brokerage staff; ingests listings and files participation/attribution disputes
  identity: entity_backed:Brokerage
  exclusive_operations:
  - POST /listings
  - POST /disputes
  shared_operations:
  - all GET endpoints
- name: MarketplaceOps
  description: Marketplace operator; runs sweeps, moderates markets/agents/listings, resolves claims and disputes
  identity: opaque
  exclusive_operations:
  - POST /_clock/set_current_utc
  - POST /ops-runs
  - POST /markets
  - POST /markets/{id}/suspend
  - POST /markets/{id}/reopen
  - POST /brokerages
  - POST /agents
  - POST /agents/{id}/suspend
  - POST /agents/{id}/unsuspend
  - POST /leads/{id}/assign
  - POST /leads/{id}/cancel
  - POST /ratings
  - POST /credit-claims/{id}/resolve
  - POST /listings/{id}/review
  - POST /listings/{id}/withdraw
  - POST /disputes/{id}/resolve
  shared_operations:
  - POST /leads
  - POST /listings
  - all GET endpoints
- name: PlatformAdmin
  description: Platform superuser with full access to every endpoint
  identity: opaque
  exclusive_operations: []
  shared_operations:
  - all operations
