            - call: "POST /society/schools/${h_id}/dues-payments"
              payload: { period_start: "2026-09-01", period_end: "2027-09-01", amount_cents: 1500000 }
              as: SocietyAdmin
              captures: { h_v: $.data.version }
            - call: "POST /society/classrooms"
              payload: { school_id: "${h_id}", name: "H1", age_level: "EARLY_CHILDHOOD", declared_age_span_years: 3, enrolled_student_count: 1500, assistant_count: 100 }
              as: SchoolAdmin
              as_user_id: "${h_id}"
              captures: { h1_id: $.data.id }
            - call: "POST /society/school-applications"
              payload: { school_id: "${h_id}", type: "AFFILIATION", expected_school_version: "${h_v}" }
              as: SchoolAdmin
              as_user_id: "${h_id}"
              captures: { ha1: $.data.id }
            - call: "POST /society/school-applications/${ha1}/submit"
              payload: {}
              as: SchoolAdmin
              as_user_id: "${h_id}"
            - call: "POST /society/school-applications/${ha1}/review"
