              as: BudgetAnalyst
              captures: { fc_id: $.data.id }
            - call: "POST /fiscal/revenue-forecasts/${fc_id}/adopt"
              payload: {}
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "EXECUTIVE_PREP" }
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/certify-balance"
              payload: {}
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "LEGISLATIVE" }
              as: BudgetDirector
            - call: "POST /fiscal/appropriations"
              payload: { budget_cycle_id: "${cyc_id}", agency_id: "${ag_id}", fund_type: "GENERAL", program_code: "P100", introduced_amount_cents: 2000000000 }
              as: LegislativeFiscalOfficer
              captures: { appr_id: $.data.id }
            - call: "POST /fiscal/appropriations/${appr_id}/enact"
              payload: {}
              as: LegislativeFiscalOfficer
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "ENACTED" }
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "EXECUTION" }
              as: BudgetDirector
            - call: "POST /fiscal/allotments"
              payload: { appropriation_id: "${appr_id}", quarter: 1, requested_cents: 440000000 }
              as: BudgetAnalyst
              captures: { alt_id: $.data.id }
            - call: "POST /fiscal/allotments/${alt_id}/prepare"
              payload: {}
              as: BudgetAnalyst
              as_user_id: "analyst-1"
            - call: "POST /fiscal/allotments/${alt_id}/approve"
              payload: {}
              as: BudgetDirector
              as_user_id: "dir-1"
            - call: "POST /fiscal/allotments/${alt_id}/release"
              payload: {}
              as: StateController
            - call: "POST /fiscal/expenditures"
              payload: { appropriation_id: "${appr_id}", quarter: 1, amount_cents: 100000000, object_code: "OC100", vendor_reference: "INV-1" }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
            - call: "GET /fiscal/appropriations/${appr_id}"
              payload: {}
              as: BudgetAnalyst
              captures: { appr_v_before: $.data.version }
          trigger:
            - call: "GET /fiscal/appropriations/${appr_id}/balance-summary"
              payload: {}
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
            - call: "GET /fiscal/appropriations/${appr_id}/balance-summary"
              payload: {}
              as: StateController
            - call: "GET /fiscal/appropriations/${appr_id}"
              payload: {}
              as: BudgetAnalyst
          assert:
            - "the summary returns appropriation_id == ${appr_id}, authority_cents == 2000000000, released_cents == 440000000, expended_cents == 100000000"
            - "available_cash_cents == 340000000 (440000000 - 100000000) and available_authority_cents == 1900000000 (2000000000 + 0 - 0 - 100000000)"
            - "basis_delta_cents == 1560000000, the difference between the two bases and equal to the unreleased authority"
            - "both reads return identical payloads and response_type == object"
            - "Appropriation.${appr_id}.version equals ${appr_v_before} after both reads, so the computed read has no side effects"

      - name: emergency_appropriation_is_only_available_in_the_execution_phase
        claim_type: Conditional action
        grounds:
          - endpoints[POST /fiscal/appropriations/emergency]
          - state_machines.Appropriation.EMERGENCY_to_AUTHORITY_ENACTED
          - validations[priority=10]
          - entities.Appropriation.fields.is_emergency
          - calculations.emergency_appropriation_capacity
        distinguishing_aspect: |
          A create endpoint that is legal in exactly one phase: the same emergency request is
          refused with ERR_CYCLE_PHASE_INVALID in LEGISLATIVE and accepted in EXECUTION,
          where it lands directly in authority_status ENACTED with is_emergency true —
          bypassing the PENDING plus committee-action route that ordinary appropriations must
          take — and charges the cycle's emergency_granted_cents.
        test_recipe:
          setup:
            - "Agency DOH; BudgetCycle 2027 with reserve_balance_cents 500000000 and ADOPTED GENERAL revenue of 10000000000 cents, advanced to phase LEGISLATIVE"
            - "GENERAL Appropriation P100 enacted 2000000000 so the cycle can reach ENACTED and then EXECUTION"
          setup_api_calls:
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DOH", name: "Department of Health", agency_type: "EXECUTIVE" }
              as: SystemAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /fiscal/budget-cycles"
              payload: { fiscal_year: 2027, fiscal_year_start_date: "2026-07-01", reserve_balance_cents: 500000000, constitutional_reserve_pct: 0.05 }
              as: SystemAdmin
              captures: { cyc_id: $.data.id, cyc_v: $.data.version }
            - call: "POST /fiscal/revenue-forecasts"
              payload: { budget_cycle_id: "${cyc_id}", source_code: "SALES_TAX", fund_type: "GENERAL", forecast_round: "CONSENSUS_SPRING", amount_cents: 10000000000, effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_budget_cycle_version: "${cyc_v}" }
              as: BudgetAnalyst
              captures: { fc_id: $.data.id }
            - call: "POST /fiscal/revenue-forecasts/${fc_id}/adopt"
              payload: {}
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "EXECUTIVE_PREP" }
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/certify-balance"
              payload: {}
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "LEGISLATIVE" }
              as: BudgetDirector
            - call: "POST /fiscal/appropriations"
              payload: { budget_cycle_id: "${cyc_id}", agency_id: "${ag_id}", fund_type: "GENERAL", program_code: "P100", introduced_amount_cents: 2000000000 }
              as: LegislativeFiscalOfficer
              captures: { appr_id: $.data.id }
            - call: "POST /fiscal/appropriations/${appr_id}/enact"
              payload: {}
              as: LegislativeFiscalOfficer
          trigger:
            - call: "POST /fiscal/appropriations/emergency"
              payload: { budget_cycle_id: "${cyc_id}", agency_id: "${ag_id}", program_code: "E900", requested_amount_cents: 100000000, justification: "wildfire response" }
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "ENACTED" }
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "EXECUTION" }
              as: BudgetDirector
            - call: "POST /fiscal/appropriations/emergency"
              payload: { budget_cycle_id: "${cyc_id}", agency_id: "${ag_id}", program_code: "E900", requested_amount_cents: 100000000, justification: "wildfire response" }
              as: BudgetDirector
              captures: { emg_id: $.data.id }
            - call: "GET /fiscal/appropriations"
              payload: { budget_cycle_id: "${cyc_id}" }
              as: BudgetDirector
          assert:
            - "the LEGISLATIVE-phase emergency request returns HTTP 409 with error_id == ERR_CYCLE_PHASE_INVALID and creates nothing"
            - "the EXECUTION-phase request returns HTTP 201 with Appropriation.${emg_id}.authority_status == ENACTED, is_emergency == true and enacted_amount_cents == 100000000"
            - "Appropriation.${emg_id}.introduced_amount_cents == 100000000 and committee_balance_cents == 100000000 with no CommitteeAction rows"
            - "BudgetCycle.${cyc_id}.emergency_granted_cents == 100000000"
            - "the list for the cycle returns total_count == 2, the ordinary line plus the emergency line"

      - name: every_response_carries_the_meta_envelope_and_a_response_type
        claim_type: Standard CRUD
        grounds:
          - response_envelope.success
          - response_envelope.error
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          Envelope claim across all three response shapes in one instance: a single-object
          create carries response_type object, a collection read carries response_type array
          plus the four pagination fields, and a rejected call carries response_type error
          with error_id and message inside data — and all three carry a fresh api_request_id
          and api_request_timestamp in meta.
        test_recipe:
          setup:
            - "Exactly one unrelated Agency DOE exists so the collection read has something to return"
          setup_api_calls:
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DOE", name: "Department of Education", agency_type: "EXECUTIVE" }
              as: SystemAdmin
              captures: { ag_seed_id: $.data.id }
          trigger:
            - call: "POST /fiscal/budget-cycles"
              payload: { fiscal_year: 2027, fiscal_year_start_date: "2026-07-01", reserve_balance_cents: 500000000, constitutional_reserve_pct: 0.05 }
              as: SystemAdmin
              captures: { cyc_id: $.data.id }
            - call: "GET /fiscal/appropriations"
              payload: { budget_cycle_id: "${cyc_id}" }
              as: BudgetAnalyst
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DOE", name: "Duplicate Department of Education", agency_type: "EXECUTIVE" }
              as: SystemAdmin
          assert:
            - "the create returns response_type == object with the new row under data and a non-empty meta.api_request_id plus an ISO 8601 meta.api_request_timestamp"
            - "the collection read returns response_type == array with limit == 10, offset == 0, total_count == 0 and has_more == false"
            - "the duplicate create returns HTTP 409 with response_type == error and data containing error_id == ERR_DUPLICATE_CODE and a non-empty message"
            - "the error response carries the same meta shape as the success responses"
            - "meta.api_request_id differs between the three responses"

      - name: corner_action_endpoint_mutates_state_and_returns_the_row
        claim_type: Action endpoint
        grounds:
          - endpoints[POST /fiscal/allotments/{id}/prepare]
          - calculations.allotment_release_ceiling
        excluded_because:
          difficulty_instance: boundary_precision_check / allotment_ceiling_tie_at_quarter_cap_then_one_cent_over
          rationale: "That §1.8 instance drives the prepare action at the cap and one cent above it and asserts the returned row and its computed fields."

      - name: corner_cross_reference_link_endpoint_binds_two_parents
        claim_type: Cross-reference link
        grounds:
          - endpoints[POST /fiscal/match-commitments]
          - entities.MatchCommitment.fields.appropriation_id
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / match_commitment_creation_gated_by_pledged_appropriation_authority_status
          rationale: "That §1.8 instance creates the link row that binds a FederalGrant to an Appropriation and asserts both parents' derived fields afterwards."

  # ===========================================================================
  # Section 6 — Errors (§1.6)
  # ===========================================================================
  - section: errors
    instances:
      - name: pagination_bounds_and_unknown_enum_filters_return_invalid_request
        claim_type: Error Triggerability
        grounds:
          - validations[priority=6]
          - errors[ERR_INVALID_REQUEST]
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          Triggerability of the query-parameter branch of ERR_INVALID_REQUEST, which no other
          instance reaches: limit 101 is above the declared maximum, limit 0 is below the
          declared minimum, offset -1 is negative and an unknown status enum member is not a
          legal value — while limit 100 and offset 0 sit exactly on the accepted bounds.
        test_recipe:
          setup:
            - "Only one unrelated Agency DOT and one BudgetCycle 2027 exist; no AgencyRequest rows"
          setup_api_calls:
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DOT", name: "Department of Transportation", agency_type: "EXECUTIVE" }
              as: SystemAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /fiscal/budget-cycles"
              payload: { fiscal_year: 2027, fiscal_year_start_date: "2026-07-01", reserve_balance_cents: 500000000, constitutional_reserve_pct: 0.05 }
              as: SystemAdmin
              captures: { cyc_id: $.data.id }
          trigger:
            - call: "GET /fiscal/agency-requests"
              payload: { limit: 101 }
              as: BudgetAnalyst
            - call: "GET /fiscal/agency-requests"
              payload: { limit: 0 }
              as: BudgetAnalyst
            - call: "GET /fiscal/agency-requests"
              payload: { offset: -1 }
              as: BudgetAnalyst
            - call: "GET /fiscal/agency-requests"
              payload: { status: "NOT_A_STATUS" }
              as: BudgetAnalyst
            - call: "GET /fiscal/agency-requests"
              payload: { limit: 100, offset: 0 }
              as: BudgetAnalyst
          assert:
            - "limit 101 returns HTTP 400 with error_id == ERR_INVALID_REQUEST"
            - "limit 0 returns HTTP 400 with error_id == ERR_INVALID_REQUEST"
            - "offset -1 returns HTTP 400 with error_id == ERR_INVALID_REQUEST"
            - "the unknown status enum returns HTTP 400 with error_id == ERR_INVALID_REQUEST"
            - "limit 100 with offset 0 returns HTTP 200 with total_count == 0 and has_more == false"

  # ===========================================================================
  # Section 7 — RBAC (§1.7)
  # ===========================================================================
  - section: rbac
    instances:
      - name: each_role_can_perform_its_own_exclusive_operation
        claim_type: exclusive_operations
        grounds:
          - roles.SystemAdmin.exclusive_operations
          - roles.AgencyBudgetOfficer.exclusive_operations
          - roles.BudgetAnalyst.exclusive_operations
          - roles.BudgetDirector.exclusive_operations
          - roles.LegislativeFiscalOfficer.exclusive_operations
          - roles.StateController.exclusive_operations
        distinguishing_aspect: |
          Positive coverage of all six roles in one pass: the natural lifecycle from agency
          registration to cash release requires every role's exclusive operations in turn, so
          a single successful walk proves each role is granted what the matrix promises —
          including the SystemAdmin-only logical clock endpoint.
        setup_note: "Setup registers the agency and the cycle (SystemAdmin exclusive operations); the trigger walks the remaining five roles."
        test_recipe:
          setup:
            - "Agency DOH and BudgetCycle 2027 registered by SystemAdmin; the cycle is in phase DEVELOPMENT"
          setup_api_calls:
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DOH", name: "Department of Health", agency_type: "EXECUTIVE" }
              as: SystemAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /fiscal/budget-cycles"
              payload: { fiscal_year: 2027, fiscal_year_start_date: "2026-07-01", reserve_balance_cents: 500000000, constitutional_reserve_pct: 0.05 }
              as: SystemAdmin
              captures: { cyc_id: $.data.id, cyc_v: $.data.version }
          trigger:
            - call: "POST /fiscal/agency-requests"
              payload: { budget_cycle_id: "${cyc_id}", agency_id: "${ag_id}", base_budget_cents: 1000000000 }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
              captures: { req_id: $.data.id }
            - call: "POST /fiscal/revenue-forecasts"
              payload: { budget_cycle_id: "${cyc_id}", source_code: "SALES_TAX", fund_type: "GENERAL", forecast_round: "CONSENSUS_SPRING", amount_cents: 10000000000, effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_budget_cycle_version: "${cyc_v}" }
              as: BudgetAnalyst
              captures: { fc_id: $.data.id }
            - call: "POST /fiscal/revenue-forecasts/${fc_id}/adopt"
              payload: {}
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "EXECUTIVE_PREP" }
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/certify-balance"
              payload: {}
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "LEGISLATIVE" }
              as: BudgetDirector
            - call: "POST /fiscal/appropriations"
              payload: { budget_cycle_id: "${cyc_id}", agency_id: "${ag_id}", fund_type: "GENERAL", program_code: "P100", introduced_amount_cents: 2000000000 }
              as: LegislativeFiscalOfficer
              captures: { appr_id: $.data.id }
            - call: "POST /fiscal/committee-actions"
              payload: { appropriation_id: "${appr_id}", chamber: "HOUSE", committee_name: "Appropriations", action_type: "INCREASE", amount_cents: 100000000, sequence_number: 1 }
              as: LegislativeFiscalOfficer
            - call: "POST /fiscal/appropriations/${appr_id}/enact"
              payload: {}
              as: LegislativeFiscalOfficer
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "ENACTED" }
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "EXECUTION" }
              as: BudgetDirector
            - call: "POST /fiscal/allotments"
              payload: { appropriation_id: "${appr_id}", quarter: 1, requested_cents: 400000000 }
              as: BudgetAnalyst
              captures: { alt_id: $.data.id }
            - call: "POST /fiscal/allotments/${alt_id}/prepare"
              payload: {}
              as: BudgetAnalyst
              as_user_id: "analyst-1"
            - call: "POST /fiscal/allotments/${alt_id}/approve"
              payload: {}
              as: BudgetDirector
              as_user_id: "dir-1"
            - call: "POST /fiscal/allotments/${alt_id}/release"
              payload: {}
              as: StateController
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: SystemAdmin
          assert:
            - "every call in the trigger returns a 2xx status: no ERR_FORBIDDEN_ROLE is raised anywhere in the six-role walk"
            - "AgencyRequest.${req_id}.status == DRAFT, RevenueForecast.${fc_id}.status == ADOPTED"
            - "Appropriation.${appr_id}.authority_status == ENACTED with enacted_amount_cents == 2100000000 after the committee INCREASE"
            - "Allotment.${alt_id}.status == RELEASED with released_cents == 400000000, below the 462000000 quarter-1 cap"
            - "the clock call returns current_utc == 2026-09-15T00:00:00Z, still inside quarter 1"

      - name: cross_role_exclusive_operations_are_forbidden_for_other_roles
        claim_type: exclusive_operations
        grounds:
          - validations[priority=2]
          - errors[ERR_FORBIDDEN_ROLE]
          - roles.SystemAdmin.exclusive_operations
          - roles.BudgetDirector.exclusive_operations
        distinguishing_aspect: |
          Negative coverage of the matrix: five roles each attempt exactly one operation that
          the matrix reserves for a different role, and all five return ERR_FORBIDDEN_ROLE at
          403 with nothing persisted. This also shows the role check at priority 2 fires
          before the body-shape check at priority 6, since two of the attempts carry payloads
          that would themselves be invalid.
        test_recipe:
          setup:
            - "Agency DOH and BudgetCycle 2027 in phase DEVELOPMENT, registered by SystemAdmin"
          setup_api_calls:
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DOH", name: "Department of Health", agency_type: "EXECUTIVE" }
              as: SystemAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /fiscal/budget-cycles"
              payload: { fiscal_year: 2027, fiscal_year_start_date: "2026-07-01", reserve_balance_cents: 500000000, constitutional_reserve_pct: 0.05 }
              as: SystemAdmin
              captures: { cyc_id: $.data.id, cyc_v: $.data.version }
          trigger:
            - call: "POST /fiscal/budget-cycles"
              payload: { fiscal_year: 2028, fiscal_year_start_date: "2027-07-01", reserve_balance_cents: 500000000 }
              as: AgencyBudgetOfficer
              as_user_id: "${ag_id}"
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DOT", name: "Department of Transportation", agency_type: "EXECUTIVE" }
              as: BudgetDirector
            - call: "POST /fiscal/appropriations"
              payload: { budget_cycle_id: "${cyc_id}", agency_id: "${ag_id}", fund_type: "GENERAL", program_code: "P100", introduced_amount_cents: 0 }
              as: BudgetAnalyst
            - call: "POST /fiscal/revenue-forecasts"
              payload: { budget_cycle_id: "${cyc_id}", source_code: "SALES_TAX", fund_type: "GENERAL", forecast_round: "CONSENSUS_SPRING", amount_cents: 0, effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_budget_cycle_version: "${cyc_v}" }
              as: LegislativeFiscalOfficer
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "EXECUTIVE_PREP" }
              as: StateController
            - call: "GET /fiscal/budget-cycles/${cyc_id}"
              payload: {}
              as: StateController
          assert:
            - "all five write attempts return HTTP 403 with error_id == ERR_FORBIDDEN_ROLE"
            - "the appropriation attempt returns ERR_FORBIDDEN_ROLE and not ERR_INVALID_AMOUNT, despite introduced_amount_cents 0"
            - "the forecast attempt returns ERR_FORBIDDEN_ROLE and not ERR_INVALID_AMOUNT, despite amount_cents 0"
            - "no second BudgetCycle, no Agency DOT, no Appropriation and no RevenueForecast exist afterwards"
            - "BudgetCycle.${cyc_id}.phase is still DEVELOPMENT and the trailing read by StateController returns HTTP 200, since GETs are shared"

      - name: every_role_can_read_through_the_shared_get_endpoints
        claim_type: shared_operations
        grounds:
          - roles.SystemAdmin.shared_operations
          - roles.AgencyBudgetOfficer.shared_operations
          - roles.StateController.shared_operations
          - endpoints[GET /fiscal/agencies/{id}]
        distinguishing_aspect: |
          "every GET endpoint" is a shared operation for all six roles without exception, and
          it is not narrowed by the agency-scope rule at priority 5: an AgencyBudgetOfficer
          whose X-User-ID is agency B still reads agency A's row successfully, because the
          scope rule is declared only over write endpoints.
        test_recipe:
          setup:
            - "Agencies DOH and DOT registered by SystemAdmin"
          setup_api_calls:
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DOH", name: "Department of Health", agency_type: "EXECUTIVE" }
              as: SystemAdmin
              captures: { ag_a_id: $.data.id }
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DOT", name: "Department of Transportation", agency_type: "EXECUTIVE" }
              as: SystemAdmin
              captures: { ag_b_id: $.data.id }
          trigger:
            - call: "GET /fiscal/agencies/${ag_a_id}"
              payload: {}
              as: SystemAdmin
            - call: "GET /fiscal/agencies/${ag_a_id}"
              payload: {}
              as: AgencyBudgetOfficer
              as_user_id: "${ag_b_id}"
            - call: "GET /fiscal/agencies/${ag_a_id}"
              payload: {}
              as: BudgetAnalyst
            - call: "GET /fiscal/agencies/${ag_a_id}"
              payload: {}
              as: BudgetDirector
            - call: "GET /fiscal/agencies/${ag_a_id}"
              payload: {}
              as: LegislativeFiscalOfficer
            - call: "GET /fiscal/agencies/${ag_a_id}"
              payload: {}
              as: StateController
          assert:
            - "all six reads return HTTP 200 with identical data payloads"
            - "the AgencyBudgetOfficer read of the other agency's row is not refused with ERR_AGENCY_SCOPE_VIOLATION"
            - "each response reports agency_code == DOH and federal_compliance_flag == CLEAR"

      - name: missing_role_header_returns_unauthenticated_before_the_role_check
        claim_type: exclusive_operations
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: |
          Priority 1 outranks priority 2: a request with no X-User-Role header at all returns
          ERR_UNAUTHENTICATED at 401 rather than ERR_FORBIDDEN_ROLE at 403, on both a write
          and a read endpoint, and it does so even when the body is malformed — so
          authentication precedes both authorisation and body validation.
        test_recipe:
          setup:
            - "One Agency DOH registered by SystemAdmin"
          setup_api_calls:
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DOH", name: "Department of Health", agency_type: "EXECUTIVE" }
              as: SystemAdmin
              captures: { ag_id: $.data.id }
          trigger:
            - call: "POST /fiscal/budget-cycles"
              payload: { fiscal_year: 2027, fiscal_year_start_date: "2026-07-01", reserve_balance_cents: 500000000 }
              as: Anonymous
            - call: "GET /fiscal/agencies/${ag_id}"
              payload: {}
              as: Anonymous
            - call: "POST /fiscal/budget-cycles"
              payload: { fiscal_year: "not-a-year", fiscal_year_start_date: "2026-07-01", reserve_balance_cents: 500000000 }
              as: Anonymous
          assert:
            - "the write with no X-User-Role header returns HTTP 401 with error_id == ERR_UNAUTHENTICATED"
            - "the read with no X-User-Role header returns HTTP 401 with error_id == ERR_UNAUTHENTICATED"
            - "the malformed write with no header returns ERR_UNAUTHENTICATED, not ERR_INVALID_REQUEST"
            - "no BudgetCycle row exists afterwards"

      - name: transfer_approval_by_its_own_proposer_is_rejected
        claim_type: Segregation of duties
        grounds:
          - validations[priority=15]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - state_machines.BudgetTransfer.PROPOSED_to_APPROVED
          - entities.BudgetTransfer.fields.proposed_by_user_id
        distinguishing_aspect: |
          The second segregation-of-duties surface, on a different entity from the allotment
          case: the BudgetDirector who proposed the transfer is refused at 403 while another
          BudgetDirector approves the identical row, and the refusal leaves the row PROPOSED
          with approved_by_user_id null and both appropriations' transfer counters at zero.
        setup_note: "Eleven-call chain to phase EXECUTION with two GENERAL appropriations of the same agency, then one PROPOSED transfer of 100000000 by BudgetDirector dir-1."
        test_recipe:
          setup:
            - "Agency DOH; BudgetCycle 2027 in phase EXECUTION with ADOPTED GENERAL revenue of 10000000000 cents"
            - "GENERAL Appropriations P100 and P200, both enacted 1000000000"
            - "PROPOSED BudgetTransfer of 100000000 from P100 to P200, transfer_type INTRA_AGENCY, proposed by BudgetDirector dir-1"
          setup_api_calls:
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DOH", name: "Department of Health", agency_type: "EXECUTIVE" }
              as: SystemAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /fiscal/budget-cycles"
              payload: { fiscal_year: 2027, fiscal_year_start_date: "2026-07-01", reserve_balance_cents: 500000000, constitutional_reserve_pct: 0.05 }
              as: SystemAdmin
              captures: { cyc_id: $.data.id, cyc_v: $.data.version }
            - call: "POST /fiscal/revenue-forecasts"
              payload: { budget_cycle_id: "${cyc_id}", source_code: "SALES_TAX", fund_type: "GENERAL", forecast_round: "CONSENSUS_SPRING", amount_cents: 10000000000, effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_budget_cycle_version: "${cyc_v}" }
              as: BudgetAnalyst
              captures: { fc_id: $.data.id }
            - call: "POST /fiscal/revenue-forecasts/${fc_id}/adopt"
              payload: {}
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "EXECUTIVE_PREP" }
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/certify-balance"
              payload: {}
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "LEGISLATIVE" }
              as: BudgetDirector
            - call: "POST /fiscal/appropriations"
              payload: { budget_cycle_id: "${cyc_id}", agency_id: "${ag_id}", fund_type: "GENERAL", program_code: "P100", introduced_amount_cents: 1000000000 }
              as: LegislativeFiscalOfficer
              captures: { src_id: $.data.id }
            - call: "POST /fiscal/appropriations/${src_id}/enact"
              payload: {}
              as: LegislativeFiscalOfficer
            - call: "POST /fiscal/appropriations"
              payload: { budget_cycle_id: "${cyc_id}", agency_id: "${ag_id}", fund_type: "GENERAL", program_code: "P200", introduced_amount_cents: 1000000000 }
              as: LegislativeFiscalOfficer
              captures: { tgt_id: $.data.id }
            - call: "POST /fiscal/appropriations/${tgt_id}/enact"
              payload: {}
              as: LegislativeFiscalOfficer
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "ENACTED" }
              as: BudgetDirector
            - call: "POST /fiscal/budget-cycles/${cyc_id}/advance-phase"
              payload: { to_phase: "EXECUTION" }
              as: BudgetDirector
            - call: "GET /fiscal/appropriations/${src_id}"
              payload: {}
              as: BudgetAnalyst
              captures: { src_v: $.data.version }
            - call: "POST /fiscal/budget-transfers"
              payload: { source_appropriation_id: "${src_id}", target_appropriation_id: "${tgt_id}", amount_cents: 100000000, transfer_type: "INTRA_AGENCY", justification: "rebalance programs", expected_source_appropriation_version: "${src_v}" }
              as: BudgetDirector
              as_user_id: "dir-1"
              captures: { xfer_id: $.data.id }
          trigger:
            - call: "POST /fiscal/budget-transfers/${xfer_id}/approve"
              payload: {}
              as: BudgetDirector
              as_user_id: "dir-1"
            - call: "POST /fiscal/budget-transfers/${xfer_id}/approve"
              payload: {}
              as: BudgetDirector
              as_user_id: "dir-2"
          assert:
            - "the self-approval returns HTTP 403 with error_id == ERR_SEGREGATION_OF_DUTIES"
            - "BudgetTransfer.${xfer_id}.status is still PROPOSED with approved_by_user_id null after the refusal"
            - "the second approval returns HTTP 200 with status == APPROVED and approved_by_user_id == dir-2"
            - "Appropriation.${src_id}.transfers_out_cents == 0 and Appropriation.${tgt_id}.transfers_in_cents == 0, because approval alone moves no authority"
            - "BudgetTransfer.${xfer_id}.proposed_by_user_id is still dir-1"

      - name: agency_officer_cannot_act_for_another_agency
        claim_type: peer_roles
        grounds:
          - validations[priority=5]
          - errors[ERR_AGENCY_SCOPE_VIOLATION]
          - roles.AgencyBudgetOfficer.identity
        distinguishing_aspect: |
          Peer isolation between two holders of the same role: officer B may not create a
          request for agency A, may not submit agency A's existing request and may not attach
          a decision package to it, each refused with ERR_AGENCY_SCOPE_VIOLATION at 403 —
          while officer A performs the identical calls successfully. The scope is resolved
          through the referenced AgencyRequest, not just from the request body.
        test_recipe:
          setup:
            - "Agencies DOH (agency A) and DOT (agency B); BudgetCycle 2027 in phase DEVELOPMENT"
            - "One DRAFT AgencyRequest belonging to agency A"
          setup_api_calls:
            - call: "POST /fiscal/agencies"
              payload: { agency_code: "DOH", name: "Department of Health", agency_type: "EXECUTIVE" }
              as: SystemAdmin
              captures: { ag_a_id: $.data.id }
            - call: "POST /fiscal/agencies"
