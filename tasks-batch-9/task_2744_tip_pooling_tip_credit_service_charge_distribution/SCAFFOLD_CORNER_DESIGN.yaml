            - call: "POST /pay-periods/${period_id}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "op_comp_1"
            - call: "GET /pay-lines?pay_period_id=${period_id}&employee_id=${ana_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { ana_line_id: "$.data[0].id" }
            - call: "GET /pay-lines/${ana_line_id}"
              payload: {}
              as: Employee
              as_user_id: "${bea_id}"
              captures: { err_read_line: $.data.error_id }
            - call: "GET /pay-lines/${ana_line_id}"
              payload: {}
              as: Employee
              as_user_id: "${ana_id}"
            - call: "POST /disputes"
              payload: { pay_line_id: "${ana_line_id}", raised_by_employee_id: "${ana_id}", category: "TIP_CREDIT", claimed_amount_cents: 500 }
              as: Employee
              as_user_id: "${bea_id}"
              captures: { err_dispute_impersonate: $.data.error_id }
            - call: "POST /disputes"
              payload: { pay_line_id: "${ana_line_id}", raised_by_employee_id: "${bea_id}", category: "TIP_CREDIT", claimed_amount_cents: 500 }
              as: Employee
              as_user_id: "${bea_id}"
              captures: { err_dispute_other_line: $.data.error_id }
            - call: "POST /disputes"
              payload: { pay_line_id: "${ana_line_id}", raised_by_employee_id: "${ana_id}", category: "TIP_CREDIT", claimed_amount_cents: 500 }
              as: Employee
              as_user_id: "${ana_id}"
              captures: { dispute_id: $.data.id }
          assert:
            - "trigger 1 returns HTTP 403 with data.error_id == ERR_NOT_RESOURCE_OWNER: Bea may declare on her own shift but not on Ana's, and GET /shifts/${ana_shift_id} still reports declaration_status == UNDECLARED"
            - "trigger 2 returns HTTP 200 with declared_cash_tips_cents == 15000 and declaration_status == DECLARED"
            - "trigger 3 returns HTTP 403 with data.error_id == ERR_NOT_RESOURCE_OWNER, not 404 and not 200: an acting Employee's read scope is their own employee_id"
            - "trigger 4 returns HTTP 403 with data.error_id == ERR_NOT_RESOURCE_OWNER: Cid's employee row lives at the Austin unit, so a ShiftManager acting as Cid cannot read a Dallas shift"
            - "trigger 5 returns HTTP 200: the same request acting as Bea, whose employee row lives at Dallas, is inside the manager's unit scope even though the shift belongs to Ana — the manager scope is the unit, the employee scope is the person"
            - "trigger 6 returns HTTP 422 with data.error_id == ERR_EMPLOYEE_LOCATION_MISMATCH: Cid's employee row is at Austin while the shift and period are at Dallas"
            - "trigger 8 returns HTTP 200 and GET /pay-lines?pay_period_id=${period_id} reports total_count == 2, one line per employee, each FINAL"
            - "GET /pay-lines/${ana_line_id} reports employee_id == ${ana_id}, straight_cash_cents == 1704, minimum_wage_obligation_cents == 5800, tips_available_cents == 15000, tip_credit_cents == 4096, total_gross_cents == 1704"
            - "trigger 10 returns HTTP 403 with data.error_id == ERR_NOT_RESOURCE_OWNER and trigger 11 returns HTTP 200 with the same body a PayrollAdmin would receive"
            - "trigger 12 returns HTTP 403 with data.error_id == ERR_NOT_RESOURCE_OWNER: raised_by_employee_id names Ana while X-User-ID names Bea"
            - "trigger 13 also returns HTTP 403 with data.error_id == ERR_NOT_RESOURCE_OWNER, not ERR_EMPLOYEE_LOCATION_MISMATCH: raised_by_employee_id now matches X-User-ID but the pay line does not belong to Bea, and priority 6 covers both mismatch shapes before priority 32 is consulted"
            - "trigger 14 returns HTTP 201 with status == OPEN, and GET /disputes?pay_line_id=${ana_line_id} reports total_count == 1"

      - name: segregation_of_duties_blocks_the_same_operator_at_both_steps
        claim_type: segregation_of_duties
        grounds:
          - validations.priority_7
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - roles.PayrollPreparer.shared_operations
          - roles.ComplianceOfficer.shared_operations
          - entities.PayPeriod.fields.computed_by_user_id
          - entities.BackWageCorrection.fields.issued_by_user_id
        distinguishing_aspect: >-
          Segregation is by X-User-ID, not by role: the same human holding two role headers is still
          blocked, while two different humans sharing one role are allowed. Approving as the operator
          who computed the period is a 403 even though the approver presents the correct
          ComplianceOfficer role, and applying a correction as its issuer is a 403 even though
          ComplianceOfficer legitimately shares the apply operation with PayrollPreparer.
        test_recipe:
          setup:
            - "Clock at 2026-08-10T12:00:00Z."
            - "A Texas unit, a SERVER role, Ana with an acknowledged assignment, period P1 with one 480-minute CLOSED shift on 2026-08-04 declaring 15000 cash tips."
            - "op_prep_1 computes the period."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
