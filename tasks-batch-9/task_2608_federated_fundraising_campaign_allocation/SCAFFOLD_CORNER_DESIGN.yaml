      - name: pledge_collected_designated_amount_scales_across_partial_and_full_collection
        claim_type: aggregation
        grounds:
          - calculations.pledge_designation_fee_allocation
          - state_machines.Pledge.PENDING_to_PARTIAL
          - state_machines.Pledge.PARTIAL_to_COLLECTED
          - entities.PledgeDesignation.fields.collected_designated_amount
          - entities.Agency.fields.designated_passthrough_ytd
        distinguishing_aspect: |
          The collection-ratio scaling is a running total that is re-derived, not incremented: on
          a 400.00 pledge whose single 300.00 line nets 278.25, a first 100.00 remittance scales
          the line to round_half_up(278.25 * 0.25) = 69.56 and the agency ledger to 69.56; the
          closing 300.00 remittance re-derives the line at the full 278.25 (not 69.56 + 208.69),
          and uncollected_amount lands on 0.00.
        test_recipe:
          setup:
            - "One GOOD_STANDING agency, one OPEN campaign, one CONFIRMED 400.00 payroll pledge with a single 300.00 designation line (processing_fee 21.75, net 278.25)."
          setup_api_calls:
            - call: "POST /fundraising/agencies"
              payload: { legal_name: "Redwood Elder Services", ein: "610000005", primary_priority_area: "HEALTH" }
              as: UnitedFundAdmin
              captures: { ag: $.data.id }
            - call: "POST /fundraising/agencies/${ag}/reviews"
              payload: { fiscal_year: 2025, program_expense_ratio: 0.7800, admin_expense_ratio: 0.1900, months_operating_reserve: 4.00, governance_checklist_passed_count: 8, audit_opinion: "UNQUALIFIED" }
              as: FinanceReviewer
              captures: { rev: $.data.id }
            - call: "POST /fundraising/agencies/${ag}/reviews/${rev}/certify"
              payload: { audited_program_expense_ratio: 0.7800, audited_admin_expense_ratio: 0.1900, audited_months_operating_reserve: 4.00 }
              as: FinanceReviewer
            - call: "POST /fundraising/employers"
              payload: { legal_name: "Vantage Logistics", employee_count: 260 }
              as: UnitedFundAdmin
              captures: { emp: $.data.id }
            - call: "POST /fundraising/employers/${emp}/activate"
              payload: {}
              as: UnitedFundAdmin
            - call: "POST /fundraising/campaigns"
              payload: { employer_id: "${emp}", campaign_year: 2026, solicitation_start_date: "2026-07-01", solicitation_end_date: "2026-09-30" }
              as: UnitedFundAdmin
              captures: { camp: $.data.id }
            - call: "POST /fundraising/campaigns/${camp}/open"
              payload: {}
              as: UnitedFundAdmin
            - call: "POST /fundraising/campaigns/${camp}/pledges"
              payload: { donor_reference: "R-001", giving_method: "PAYROLL_DEDUCTION", gross_amount: 400.00, designations: [ { agency_id: "${ag}", designated_amount: 300.00 } ] }
              as: UnitedFundAdmin
              captures: { pl: $.data.id }
            - call: "POST /fundraising/pledges/${pl}/confirm"
              payload: {}
              as: UnitedFundAdmin
          trigger:
            - call: "POST /fundraising/pledges/${pl}/collections"
              payload: { amount: 100.00, remitted_on: "2026-08-01" }
              as: FinanceReviewer
              captures: { cs1: $.data.collection_status, col1: $.data.collected_amount }
            - call: "GET /fundraising/agencies/${ag}"
              payload: {}
              as: FinanceReviewer
              captures: { yt1: $.data.designated_passthrough_ytd }
            - call: "POST /fundraising/pledges/${pl}/collections"
              payload: { amount: 300.00, remitted_on: "2026-08-15" }
              as: FinanceReviewer
              captures: { cs2: $.data.collection_status, unc2: $.data.uncollected_amount }
            - call: "GET /fundraising/agencies/${ag}"
              payload: {}
              as: FinanceReviewer
              captures: { yt2: $.data.designated_passthrough_ytd }
          assert:
            - "After the first remittance: Pledge.${pl}.collection_status == PARTIAL, collected_amount == 100.00, uncollected_amount == 300.00"
            - "The ACTIVE designation line's collected_designated_amount == 69.56"
            - "${yt1} == 69.56"
            - "After the closing remittance: Pledge.${pl}.collection_status == COLLECTED, collected_amount == 400.00, uncollected_amount == 0.00"
            - "The ACTIVE designation line's collected_designated_amount == 278.25"
            - "${yt2} == 278.25"
            - "Pledge.${pl}.designation_status is still CONFIRMED (collections never touch the designation axis)"

      - name: panel_composite_trimmed_mean_drops_one_high_and_one_low_at_five_eligible_scores
        claim_type: weighted_scoring
        grounds:
          - calculations.request_panel_composite_score
          - entities.PanelScore.fields.eligible
          - entities.AllocationRequest.fields.composite_score
          - state_machines.AllocationRequest.UNDER_PANEL_REVIEW_to_PANEL_APPROVED
          - endpoints.POST /fundraising/allocation-requests/{id}/finalize-review
        distinguishing_aspect: |
          Five eligible scores cross TRIM_MIN_COUNT, so the aggregation switches from plain mean to
          trimmed mean: weighted scores 81.50, 80.00, 70.00, 60.00 and 100.00 lose exactly one
          maximum (100.00) and one minimum (60.00), the surviving pool averages
          round_half_up(231.50 / 3) = 77.17, the request's priority_area BASIC_NEEDS differs from
          the cycle's focus HEALTH so the multiplier is 1.00, and 77.17 >= 72.00 approves the
          request. The plain mean of all five would be 78.30 - a different number.
        test_recipe:
          setup:
            - "One GOOD_STANDING agency with a BASIC_NEEDS request; the cycle's focus_priority_area is HEALTH so FOCUS_MULTIPLIER never applies."
            - "Five conflict-free panelists seated on the cycle, each filing one score."
            - "Raw triples: P1 90/80/70 -> 81.50, P2 80/80/80 -> 80.00, P3 70/70/70 -> 70.00, P4 60/60/60 -> 60.00, P5 100/100/100 -> 100.00."
