          trigger:
            - call: "GET /accrual-ledgers"
              payload: { participant_id: "${ac_p}", calendar_year: 2024 }
              as: PlanAdministrator
              as_user_id: admin1
          assert:
            - "AccrualLedger for (${ac_p},2024).accrued_grant_value_cents == 117000"
            - "AccrualLedger for (${ac_p},2024).remaining_capacity_cents == 2383000"

      - name: lookback_disabled_flag_changes_pricing
        claim_type: conditional_feature_flags
        grounds:
          - "entities.Plan.fields.lookback_enabled"
          - "calculations.lookback_purchase_price"
        excluded_because:
          difficulty_instance: dual_variant_calc / lookback_price_min_vs_purchase_only_on_purchase
          rationale: "The lookback_enabled flag toggling the pricing base is the §1.8 dual-variant pricing instance."

      - name: run_purchase_cascade_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - "state_machines.PurchasePeriod.CERTIFIED_to_PURCHASED"
        excluded_because:
          difficulty_instance: transitive_cascade / run_purchase_charges_ledger_closes_offering_completes_enrollment_depth3
          rationale: "The end-to-end run-purchase cascade is the §1.8 depth-3 cascade instance."

  # =====================================================================
  # Consistency Model
  # =====================================================================
  - section: consistency_model
    instances:
      - name: contribution_accumulator_visible_immediately
        claim_type: immediate
        grounds:
          - "entities.Enrollment.fields.accumulated_contribution_cents"
          - "calculations.contribution_withholding"
        distinguishing_aspect: "Two contributions (50000c + 30000c) make enrollment.accumulated_contribution_cents 80000 visible on the immediately following GET (same-request consistency)."
        test_recipe:
          setup: ["An ENROLLED enrollment at rate 10%"]
          setup_api_calls:
            - call: "POST /plans"
              payload: { company_name: "ImmiCo", max_contribution_rate_pct: 15 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { im2_plan: $.data.id }
            - call: "POST /participants"
              payload: { email: "immi@x.com", full_name: "Immi P", employee_id: "EIMMI" }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { im2_p: $.data.id }
            - call: "POST /offering-periods"
              payload: { plan_id: "${im2_plan}", grant_date: "2024-01-01T00:00:00.000Z", duration_months: 12, grant_date_fmv_cents: 1000 }
              as: PlanAdministrator
              as_user_id: admin1
              captures: { im2_off: $.data.id }
            - call: "POST /enrollments"
              payload: { participant_id: "${im2_p}", offering_period_id: "${im2_off}", contribution_rate_pct: 10 }
              as: Participant
              as_user_id: "${im2_p}"
              captures: { im2_enr: $.data.id }
            - call: "POST /contributions"
              payload: { enrollment_id: "${im2_enr}", pay_date: "2024-02-01T00:00:00.000Z", gross_pay_cents: 500000 }
              as: PlanAdministrator
              as_user_id: admin1
            - call: "POST /contributions"
              payload: { enrollment_id: "${im2_enr}", pay_date: "2024-03-01T00:00:00.000Z", gross_pay_cents: 300000 }
              as: PlanAdministrator
              as_user_id: admin1
          trigger:
            - call: "GET /enrollments/${im2_enr}"
              payload: {}
              as: PlanAdministrator
              as_user_id: admin1
              captures: { im2_acc: $.data.accumulated_contribution_cents }
          assert:
            - "Enrollment.${im2_enr}.accumulated_contribution_cents == 80000"
