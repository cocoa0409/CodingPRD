              as: ElectionsDirector
            - call: "POST /elections"
              payload: { jurisdiction_code: "ST-06", election_name: "2026 General Election", election_date: "2026-11-03", certification_deadline_at: "2026-11-24T17:00:00Z" }
              as: ElectionsDirector
