      - name: mentorship_supersede_leaves_single_active
        claim_type: side_effect_execution
        grounds: ["state_machines.MentorshipAssignment.ACTIVE_to_SUPERSEDED"]
        distinguishing_aspect: "Creating a second assignment for the same case supersedes the first: exactly one ACTIVE assignment remains and the old one is queryable in SUPERSEDED state."
