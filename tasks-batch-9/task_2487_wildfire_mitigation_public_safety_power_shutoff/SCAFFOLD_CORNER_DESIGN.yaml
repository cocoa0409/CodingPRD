              as: GridPlanner
              captures: { mp_ic_id: $.data.id }
            - call: "POST /mitigation-projects"
              payload: { project_code: "MP-UG", circuit_id: "${delta_id}", program_type: "UNDERGROUNDING", plan_year: 2026, planned_miles: 3.0, unit_cost_per_mile_cents: 9000000 }
              as: GridPlanner
              captures: { mp_ug_id: $.data.id }
            - call: "POST /mitigation-projects"
              payload: { project_code: "MP-FT", circuit_id: "${bravo_id}", program_type: "FAST_TRIP_SETTING", plan_year: 2026, planned_miles: 3.0, unit_cost_per_mile_cents: 180000 }
