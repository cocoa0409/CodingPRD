              as: PlatformAdmin
              captures: { lc_id: $.data.id }
            - call: "POST /portfolios/${pid}/leases"
              payload: { premises_label: "WH-18", rentable_square_feet: 10000, base_rent_cents_per_rsf_year: 5000, commencement_date: "2026-01-01T00:00:00Z", expiration_date: "2026-12-31T00:00:00Z", holdover_tier1_pct: 150, holdover_tier2_pct: 200 }
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { lid: $.data.id }
            - call: "POST /portfolios/${pid}/leases/${lid}/activate"
              payload: {}
              as: AssetManager
              as_user_id: "${am_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /portfolios/${pid}/leases/${lid}/amendments"
              payload: { kind: "HOLDOVER_SETTLEMENT", new_expiration_date: "2028-12-31T00:00:00Z", new_base_rent_cents_per_rsf_year: 5200 }
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { aid: $.data.id }
            - call: "GET /portfolios/${pid}/leases/${lid}"
              payload: {}
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { l_ver_ho: $.data.version }
            - call: "POST /portfolios/${pid}/leases/${lid}/amendments/${aid}/propose"
              payload: { expected_lease_version: "${l_ver_ho}" }
              as: AssetManager
              as_user_id: "${am_id}"
            - call: "GET /portfolios/${pid}/leases/${lid}"
              payload: {}
              as: AssetManager
              as_user_id: "${am_id}"
              captures: { l_ver_p: $.data.version }
            - call: "POST /portfolios/${pid}/leases/${lid}/amendments/${aid}/agree"
              payload: {}
              as: LandlordCounsel
              as_user_id: "${lc_id}"
          trigger:
            - call: "POST /portfolios/${pid}/leases/${lid}/amendments/${aid}/execute"
              payload: { expected_lease_version: "${l_ver_p}" }
              as: AssetManager
              as_user_id: "${am_id}"
          assert:
            - "Lease.${lid}.status == ACTIVE (HOLDOVER exited)"
            - "Lease.${lid}.accrued_holdover_rent_cents == 0 (reset after settlement)"
            - "Ledger contains exactly one AMENDMENT_SETTLEMENT entry with amount_cents == 6164370 (30 days × tier1_daily 205479)"
            - "Lease.${lid}.expiration_date == 2028-12-31T00:00:00Z and base_rent_cents_per_rsf_year == 5200"
