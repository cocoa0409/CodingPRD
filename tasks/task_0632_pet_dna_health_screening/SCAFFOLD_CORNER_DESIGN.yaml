              as_user_id: "${acc}"
          trigger:
            - call: "GET /dna/accounts/${acc}"
              payload: {}
              as: Account
              as_user_id: "${acc}"
              captures: { pc: $.data.pet_count }
          assert:
            - "Account.${acc}.pet_count == 2"

