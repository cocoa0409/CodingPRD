        distinguishing_aspect: "Two unnamed dispatches expose both keys of the selector in one fixture: the first breaks a 0-vs-0 tie in favour of the earlier-created technician (T2 over T3, never by id), and the second — once T2 also carries 120 minutes — is decided outright by the committed_minutes key in favour of T3."
