          assert:
            - "The first release returns 409 ERR_STEEL_HEAT_NOT_VERIFIED — priority 11 wins over the priority 13 lubrication rule"
            - "After the heat is VERIFIED the same release returns 422 ERR_LUBRICATION_INSUFFICIENT"
            - "WireLot.${wire_bad}.status is still DRAWN and inspected_at is still null after both refusals"
            - "Releasing ${wire_late} returns 409 ERR_STEEL_HEAT_NOT_VERIFIED: its status is DRAWN (the counterfeit cascade predates it) so priority 10 passes and priority 11 decides"

      - name: plating_cannot_be_scheduled_before_heat_treatment_passes
        claim_type: Error triggerable
        grounds:
