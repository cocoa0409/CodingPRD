    applies_to: ["POST /closing-records/{closing_id}/fund"]
    note: "CROSS-ENTITY STATE DEPENDENCY: federal relocation law bars funding a closing while a displacee claim is unresolved."

  - priority: 59
    category: business_referential
    condition: "POST /relocation-cases/{case_id}/submit-claim where RelocationCase.displacee_type == TENANT_UNDER_90_DAY"
    error_id: ERR_TENANT_INELIGIBLE
    http_status: 422
    applies_to: ["POST /relocation-cases/{case_id}/submit-claim"]

  - priority: 60
    category: business_referential
    condition: "POST /closing-records/{closing_id}/record where Parcel.acquisition_status != DEMOLISHED"
    error_id: ERR_DEMOLITION_NOT_COMPLETE
    http_status: 409
    applies_to: ["POST /closing-records/{closing_id}/record"]
    note: "The open-space deed restriction may only be recorded once the structure is gone."

  - priority: 61
    category: business_referential
    condition: "POST /parcels/{parcel_id}/participation with participation_decision == WITHDRAW where Parcel.acquisition_status IN {CLOSED, DEMOLISHED, OPEN_SPACE_RECORDED}"
    error_id: ERR_OPEN_SPACE_RESTRICTION_ACTIVE
    http_status: 409
    applies_to: ["POST /parcels/{parcel_id}/participation"]
    note: "Resale prohibition / perpetual encumbrance - once title has passed the owner cannot back out."

  - priority: 62
    category: business_constraint
    condition: "POST /parcels/{parcel_id}/purchase-offers where offer_basis == PRE_EVENT_FMV and the source Appraisal.valuation_basis != PRE_EVENT, or offer_basis == POST_EVENT_FMV and the source Appraisal.valuation_basis != POST_EVENT"
    error_id: ERR_VALUATION_BASIS_MISMATCH
    http_status: 422
    applies_to: ["POST /parcels/{parcel_id}/purchase-offers"]

  - priority: 63
    category: business_constraint
    condition: "POST /appraisals/{appraisal_id}/submit from RETURNED_FOR_REVISION where Appraisal.revision_count > MAX_APPRAISAL_REVISIONS"
    error_id: ERR_APPRAISAL_REVISION_LIMIT
    http_status: 409
    applies_to: ["POST /appraisals/{appraisal_id}/submit"]
    note: "BOUNDARY: revision_count == 2 still PASSES; revision_count == 3 fails."

  - priority: 64
    category: business_constraint
    condition: "POST /relocation-cases/{case_id}/appeal where RelocationCase.appeal_count >= MAX_RELOCATION_APPEALS"
    error_id: ERR_APPEAL_LIMIT_REACHED
    http_status: 409
    applies_to: ["POST /relocation-cases/{case_id}/appeal"]

  - priority: 65
    category: business_constraint
    condition: "POST /deed-restrictions/{restriction_id}/terminate where termination_authorization_reference does not start with OPEN_SPACE_TERMINATION_AUTH_PREFIX"
    error_id: ERR_TERMINATION_NOT_AUTHORIZED
    http_status: 422
    applies_to: ["POST /deed-restrictions/{restriction_id}/terminate"]

  - priority: 66
    category: business_constraint
    condition: |
      POST /deed-restrictions/{restriction_id}/monitoring-inspections with
      finding == PROHIBITED_USE_OBSERVED where DeedRestriction.status == VIOLATION_OPEN and
      prohibited_use_code != DeedRestriction.open_violation_code. A re-observation of the SAME
      open violation code is permitted (it refreshes nothing and creates another inspection row);
      a SECOND, different prohibited use may not be opened while the first is still uncured.
    error_id: ERR_PROHIBITED_USE_UNRESOLVED
    http_status: 409
    applies_to: ["POST /deed-restrictions/{restriction_id}/monitoring-inspections"]

  - priority: 67
    category: business_constraint
    condition: "POST /mitigation-projects where project_code already exists on another MitigationProject"
    error_id: ERR_DUPLICATE_PROJECT_CODE
    http_status: 409
    applies_to: ["POST /mitigation-projects"]

  - priority: 68
    category: business_constraint
    condition: "POST /mitigation-projects/{project_id}/parcels where apn already exists on another Parcel with the same project_id"
    error_id: ERR_DUPLICATE_APN
    http_status: 409
    applies_to: ["POST /mitigation-projects/{project_id}/parcels"]

  - priority: 69
    category: business_constraint
    condition: "POST /parcel-adjacencies where a ParcelAdjacency already links the same unordered pair {parcel_a_id, parcel_b_id} (the reversed pair is the same edge)"
    error_id: ERR_DUPLICATE_ADJACENCY
    http_status: 409
    applies_to: ["POST /parcel-adjacencies"]

  - priority: 70
    category: business_constraint
    condition: "POST /demolition-work-orders/{work_order_id}/utility-disconnections where a UtilityDisconnection with the same utility_type already exists on this work_order_id"
    error_id: ERR_DUPLICATE_UTILITY_TYPE
    http_status: 409
    applies_to: ["POST /demolition-work-orders/{work_order_id}/utility-disconnections"]

  - priority: 71
    category: business_constraint
    condition: "POST /parcels/{parcel_id}/relocation-cases where a RelocationCase with the same household_reference already exists on THIS parcel_id"
    error_id: ERR_DUPLICATE_HOUSEHOLD_REFERENCE
    http_status: 409
    applies_to: ["POST /parcels/{parcel_id}/relocation-cases"]
endpoints:
  # Every list endpoint accepts limit? / offset? and returns the fixed response_envelope pagination
  # block. Every FK declared in entities is reverse-reachable through a filtered list endpoint whose
  # input names the FK field, or through the sub-resource collection under its parent.
  # Default sort on every list endpoint is created_at ASC unless stated otherwise.

  - method: POST
    path: /mitigation-projects
    description: "Register a hazard mitigation buyout project."
    roles: [ProgramAdministrator]
    input: [project_code, grant_program, "disaster_declaration_number?", subrecipient_name, "cost_share_federal_pct?", total_federal_share_cap_cents, period_of_performance_end_date]
    output: MitigationProject
    side_effects:
      - "creates MitigationProject with status DRAFT, version 1, federal_obligated_cents 0, program_income_balance_cents 0, protected_open_space_acres 0, all parcel counts 0, largest_component_parcel_ids [], neighborhood_viability_ratio 0, viability_status NONVIABLE"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_DUPLICATE_PROJECT_CODE]

  - method: GET
    path: /mitigation-projects
    description: "List mitigation projects."
    roles: [ProgramAdministrator, SubrecipientCoordinator, StaffAppraiser, ReviewAppraiser, RelocationSpecialist, ComplianceMonitor]
    input: ["status?", "grant_program?", "viability_status?", "limit?", "offset?"]
    output: MitigationProject[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]

  - method: GET
    path: /mitigation-projects/{project_id}
    description: "Retrieve one mitigation project including all reconciled derived totals."
    roles: [ProgramAdministrator, SubrecipientCoordinator, StaffAppraiser, ReviewAppraiser, RelocationSpecialist, ComplianceMonitor]
    input: [project_id]
    output: MitigationProject
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_PROJECT_NOT_FOUND]

  - method: POST
    path: /mitigation-projects/{project_id}/submit
    description: "Submit the project application with its benefit-cost analysis and hazard risk documentation."
    roles: [SubrecipientCoordinator]
    input: [project_id]
    output: MitigationProject
    side_effects:
      - "MitigationProject DRAFT -> SUBMITTED; version += 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_PROJECT_NOT_FOUND, ERR_INVALID_PROJECT_STATE]

  - method: POST
    path: /mitigation-projects/{project_id}/return
    description: "Return a submitted application to the subrecipient for correction."
    roles: [ProgramAdministrator]
    input: [project_id, return_reason]
    output: MitigationProject
    side_effects:
      - "MitigationProject SUBMITTED -> DRAFT; version += 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_PROJECT_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_PROJECT_STATE]

  - method: POST
    path: /mitigation-projects/{project_id}/approve
    description: "Approve or deny the project. APPROVE requires a VALIDATED benefit-cost analysis at or above the threshold and a different administrator from the one who validated it (SoD-2). DENY cascades three levels."
    roles: [ProgramAdministrator]
    input: [project_id, decision, "decision_note?"]
    output: MitigationProject
    side_effects:
      - "on APPROVE: MitigationProject SUBMITTED -> APPROVED; recompute participating_parcel_count, holdout_parcel_count, contiguous_open_space_parcel_count, largest_component_parcel_ids, neighborhood_viability_ratio, viability_status; version += 1"
      - "on DENY: MitigationProject SUBMITTED -> DENIED; every pre-closing Parcel -> ACQUISITION_CANCELLED; every DRAFT/PRESENTED PurchaseOffer on those parcels -> WITHDRAWN; federal_obligated_cents recomputed; version += 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_SEGREGATION_OF_DUTIES, ERR_PROJECT_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_PROJECT_STATE, ERR_BCR_BELOW_THRESHOLD]

  - method: POST
    path: /mitigation-projects/{project_id}/closeout
    description: "Initiate or finalize project closeout. INITIATE checks that every parcel is settled, no deed restriction is in violation or overdue for monitoring, and the neighborhood is viable. FINALIZE requires a zero program income balance."
    roles: [ProgramAdministrator]
    input: [project_id, decision]
    output: MitigationProject
    side_effects:
      - "on INITIATE: MitigationProject APPROVED -> CLOSEOUT_PENDING; recompute program_income_balance_cents and protected_open_space_acres; version += 1"
      - "on FINALIZE: MitigationProject CLOSEOUT_PENDING -> CLOSED_OUT; version += 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_PROJECT_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_PROJECT_STATE, ERR_MONITORING_OVERDUE, ERR_NEIGHBORHOOD_NONVIABLE, ERR_PROGRAM_INCOME_OUTSTANDING]

  - method: POST
    path: /mitigation-projects/{project_id}/benefit-cost-analyses
    description: "Attach a benefit-cost analysis with hazard risk documentation. Computes pv_annuity_factor, npv_benefits_cents and bcr under the variant selected by analysis_method."
    roles: [SubrecipientCoordinator]
    input: [project_id, analysis_method, hazard_type, sfha_zone, "repetitive_loss_flag?", annualized_loss_avoided_cents, project_useful_life_years, "discount_rate_pct?", mitigation_cost_cents]
    output: BenefitCostAnalysis
    side_effects:
      - "creates BenefitCostAnalysis with status SUBMITTED, version 1"
      - "computes pv_annuity_factor, npv_benefits_cents and bcr per calculations.benefit_cost_ratio"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_PROJECT_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_PROJECT_STATE]

  - method: GET
    path: /benefit-cost-analyses
    description: "List benefit-cost analyses, optionally scoped to one project."
    roles: [ProgramAdministrator, SubrecipientCoordinator, ComplianceMonitor]
    input: ["project_id?", "analysis_method?", "status?", "limit?", "offset?"]
    output: BenefitCostAnalysis[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]
    note: "Reverse reachability for BenefitCostAnalysis.project_id."

  - method: GET
    path: /benefit-cost-analyses/{bca_id}
    description: "Retrieve one benefit-cost analysis."
    roles: [ProgramAdministrator, SubrecipientCoordinator, ComplianceMonitor]
    input: [bca_id]
    output: BenefitCostAnalysis
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_BCA_NOT_FOUND]

  - method: POST
    path: /benefit-cost-analyses/{bca_id}/validate
    description: "Validate or reject a benefit-cost analysis. Validation copies bcr, analysis_method and the acting user onto the project, seeding the SoD-2 bar on project approval."
    roles: [ProgramAdministrator]
    input: [bca_id, decision, "review_note?"]
    output: BenefitCostAnalysis
    side_effects:
      - "on VALIDATE: BenefitCostAnalysis SUBMITTED -> VALIDATED; MitigationProject.validated_bcr, validated_bca_method and validated_by_user_id set; both versions += 1"
      - "on REJECT: BenefitCostAnalysis SUBMITTED -> REJECTED; version += 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_BCA_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_PROJECT_STATE, ERR_INVALID_BCA_STATE]

  - method: POST
    path: /mitigation-projects/{project_id}/parcels
    description: "Add a candidate parcel with its hazard damage documentation."
    roles: [SubrecipientCoordinator]
    input: [project_id, apn, site_address, acreage, occupancy_type, structure_type, "substantial_damage_pct?"]
    output: Parcel
    side_effects:
      - "creates Parcel with participation_status NOT_CONTACTED, acquisition_status NOT_STARTED, dob_deduction_total_cents 0, version 1"
      - "recompute MitigationProject.participating_parcel_count and neighborhood_viability_ratio; MitigationProject.version += 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_PROJECT_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_PROJECT_STATE, ERR_DUPLICATE_APN]

  - method: GET
    path: /parcels
    description: "List parcels, optionally scoped to one project and filtered on either parallel state dimension."
    roles: [ProgramAdministrator, SubrecipientCoordinator, StaffAppraiser, ReviewAppraiser, RelocationSpecialist, ComplianceMonitor]
    input: ["project_id?", "participation_status?", "acquisition_status?", "occupancy_type?", "limit?", "offset?"]
    output: Parcel[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]
    note: "Reverse reachability for Parcel.project_id."

  - method: GET
    path: /parcels/{parcel_id}
    description: "Retrieve one parcel with both parallel state dimensions and the current duplication-of-benefits total."
    roles: [ProgramAdministrator, SubrecipientCoordinator, StaffAppraiser, ReviewAppraiser, RelocationSpecialist, ComplianceMonitor]
    input: [parcel_id]
    output: Parcel
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_PARCEL_NOT_FOUND]

  - method: POST
    path: /parcels/{parcel_id}/pre-event-value
    description: "Record the pre-event fair market value determination. Required before voluntary participation can be confirmed."
    roles: [StaffAppraiser]
    input: [parcel_id, pre_event_fmv_cents, pre_event_value_basis]
    output: Parcel
    side_effects:
      - "Parcel.pre_event_fmv_cents, pre_event_value_basis and pre_event_value_determined_at set; version += 1"
      - "re-determination is permitted while participation_status IN {NOT_CONTACTED, INTERESTED} and overwrites the previous determination"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_PARCEL_NOT_FOUND, ERR_INVALID_REQUEST, ERR_PROJECT_NOT_APPROVED]

  - method: POST
    path: /parcels/{parcel_id}/participation
    description: "Advance the voluntary participation dimension. CONFIRM_VOLUNTARY requires a pre-event value determination and a signed acknowledgement. DECLINE creates a holdout parcel and cascades three levels. WITHDRAW is barred once title has passed."
    roles: [SubrecipientCoordinator]
    input: [parcel_id, participation_decision, "voluntary_acknowledgement_signed_on?", "decision_note?"]
    output: Parcel
    side_effects:
      - "Parcel.participation_status transitions per state_machines.Parcel dimension 1; version += 1"
      - "on DECLINE or WITHDRAW: pre-closing acquisition_status -> ACQUISITION_CANCELLED; DRAFT/PRESENTED offers -> WITHDRAWN; federal_obligated_cents recomputed"
      - "on WITHDRAW: every non-terminal RelocationCase on the parcel -> CLAIM_DENIED_FINAL"
      - "on DECLINED -> INTERESTED: acquisition_status ACQUISITION_CANCELLED -> NOT_STARTED"
      - "recompute MitigationProject.participating_parcel_count, holdout_parcel_count, contiguous_open_space_parcel_count, largest_component_parcel_ids, neighborhood_viability_ratio, viability_status; MitigationProject.version += 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_PARCEL_NOT_FOUND, ERR_INVALID_REQUEST, ERR_PROJECT_NOT_APPROVED, ERR_PRE_EVENT_VALUE_NOT_DETERMINED, ERR_OPEN_SPACE_RESTRICTION_ACTIVE]

  - method: POST
    path: /parcel-adjacencies
    description: "Record a shared boundary between two parcels of the same project. Undirected graph edge used by the neighborhood viability calculation."
    roles: [SubrecipientCoordinator]
    input: [project_id, parcel_a_id, parcel_b_id, shared_boundary_feet]
    output: ParcelAdjacency
    side_effects:
      - "creates ParcelAdjacency (immutable, no version field)"
      - "recompute MitigationProject.contiguous_open_space_parcel_count, largest_component_parcel_ids, neighborhood_viability_ratio, viability_status; MitigationProject.version += 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_PROJECT_NOT_FOUND, ERR_PARCEL_NOT_FOUND, ERR_INVALID_REQUEST, ERR_ADJACENCY_SELF_REFERENCE, ERR_PARCEL_PROJECT_MISMATCH, ERR_PROJECT_NOT_APPROVED, ERR_DUPLICATE_ADJACENCY]

  - method: GET
    path: /parcel-adjacencies
    description: "List adjacency edges, filterable by project or by either endpoint."
    roles: [ProgramAdministrator, SubrecipientCoordinator, ComplianceMonitor]
    input: ["project_id?", "parcel_a_id?", "parcel_b_id?", "limit?", "offset?"]
    output: ParcelAdjacency[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]
    note: "Reverse reachability for ParcelAdjacency.project_id, parcel_a_id and parcel_b_id."

  - method: GET
    path: /parcel-adjacencies/{adjacency_id}
    description: "Read one adjacency edge. ParcelAdjacency is immutable (common_fields: false) so this is a read-only projection with no version field in the response."
    roles: [ProgramAdministrator, SubrecipientCoordinator, ComplianceMonitor]
    input: [adjacency_id]
    output: ParcelAdjacency
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_ADJACENCY_NOT_FOUND]

  - method: POST
    path: /parcels/{parcel_id}/appraisals
    description: "Create an appraisal in DRAFT. INITIAL appraisals are authored by a StaffAppraiser; REVIEW appraisals are authored by a ReviewAppraiser and must name the INITIAL appraisal under review."
    roles: [StaffAppraiser, ReviewAppraiser]
    input: [parcel_id, appraisal_type, valuation_basis, appraiser_license_no, effective_date, indicated_value_cents, "reviewed_appraisal_id?"]
    output: Appraisal
    side_effects:
      - "creates Appraisal with status DRAFT, revision_count 0, appraiser_user_id = acting X-User-ID, version 1"
      - "Parcel.acquisition_status NOT_STARTED -> APPRAISAL_IN_PROGRESS when appraisal_type == INITIAL; Parcel.version += 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_PARCEL_NOT_FOUND, ERR_APPRAISAL_NOT_FOUND, ERR_INVALID_REQUEST, ERR_PARCEL_PROJECT_MISMATCH, ERR_PROJECT_NOT_APPROVED, ERR_REVIEW_APPRAISAL_REQUIRED]
    note: "appraisal_type == INITIAL invoked by ReviewAppraiser, or appraisal_type == REVIEW invoked by StaffAppraiser, is ERR_UNAUTHORIZED."

  - method: GET
    path: /appraisals
    description: "List appraisals, filterable by parcel, by the appraisal they review, by type and by status."
    roles: [ProgramAdministrator, SubrecipientCoordinator, StaffAppraiser, ReviewAppraiser, ComplianceMonitor]
    input: ["parcel_id?", "reviewed_appraisal_id?", "appraisal_type?", "status?", "limit?", "offset?"]
    output: Appraisal[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]
    note: "Reverse reachability for Appraisal.parcel_id and Appraisal.reviewed_appraisal_id."

  - method: GET
    path: /appraisals/{appraisal_id}
    description: "Retrieve one appraisal including its computed half-open validity window."
    roles: [ProgramAdministrator, SubrecipientCoordinator, StaffAppraiser, ReviewAppraiser, ComplianceMonitor]
    input: [appraisal_id]
    output: Appraisal
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_APPRAISAL_NOT_FOUND]

  - method: POST
    path: /appraisals/{appraisal_id}/submit
    description: "Submit or resubmit an appraisal for review. Computes validity_end_date and enforces the half-open INITIAL-appraisal window overlap rule and the revision limit."
    roles: [StaffAppraiser, ReviewAppraiser]
    input: [appraisal_id, "effective_date?", "indicated_value_cents?"]
    output: Appraisal
    side_effects:
      - "Appraisal DRAFT or RETURNED_FOR_REVISION -> SUBMITTED; validity_end_date recomputed per calculations.appraisal_validity_window; version += 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_APPRAISAL_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_APPRAISAL_STATE, ERR_APPRAISAL_WINDOW_OVERLAP, ERR_APPRAISAL_REVISION_LIMIT]
    note: "Only the author (X-User-ID == Appraisal.appraiser_user_id) may submit; anyone else is ERR_UNAUTHORIZED."

  - method: POST
    path: /appraisals/{appraisal_id}/review-decision
    description: "Review appraisal decision: ACCEPT, RETURN or REJECT. The reviewer may be neither the author nor, for a REVIEW appraisal, the author of the INITIAL appraisal under review (SoD-1). Accepting a REVIEW appraisal establishes the parcel value."
    roles: [ReviewAppraiser]
    input: [appraisal_id, decision, "review_note?"]
    output: Appraisal
    side_effects:
      - "on ACCEPT: Appraisal -> ACCEPTED; when appraisal_type == REVIEW, Parcel.acquisition_status APPRAISAL_IN_PROGRESS -> VALUE_ESTABLISHED and Parcel.version += 1"
      - "on RETURN: Appraisal SUBMITTED -> RETURNED_FOR_REVISION; revision_count += 1"
      - "on REJECT: Appraisal -> REJECTED"
      - "Appraisal.version += 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_SEGREGATION_OF_DUTIES, ERR_APPRAISAL_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_APPRAISAL_STATE, ERR_REVIEW_APPRAISAL_REQUIRED]

  - method: POST
    path: /parcels/{parcel_id}/dob-records
    description: "Record a prior disaster benefit that must be deducted from the offer. Recomputes the parcel's duplication-of-benefits total with per-record rounding."
    roles: [SubrecipientCoordinator]
    input: [parcel_id, benefit_source, amount_cents, "repair_documented_cents?", received_on]
    output: DuplicationOfBenefitsRecord
    side_effects:
      - "creates DuplicationOfBenefitsRecord with status ACTIVE, version 1; deductible_cents computed per calculations.dob_deduction_total"
      - "recompute Parcel.dob_deduction_total_cents; Parcel.version += 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_PARCEL_NOT_FOUND, ERR_INVALID_REQUEST, ERR_PROJECT_NOT_APPROVED]

  - method: GET
    path: /dob-records
    description: "List duplication-of-benefits records, filterable by parcel and status."
    roles: [ProgramAdministrator, SubrecipientCoordinator, ComplianceMonitor]
    input: ["parcel_id?", "benefit_source?", "status?", "limit?", "offset?"]
    output: DuplicationOfBenefitsRecord[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]
    note: "Reverse reachability for DuplicationOfBenefitsRecord.parcel_id."

  - method: GET
    path: /dob-records/{dob_record_id}
    description: "Retrieve one duplication-of-benefits record with its per-record deductible."
    roles: [ProgramAdministrator, SubrecipientCoordinator, ComplianceMonitor]
    input: [dob_record_id]
    output: DuplicationOfBenefitsRecord
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_DOB_RECORD_NOT_FOUND]

  - method: POST
    path: /dob-records/{dob_record_id}/reverse
    description: "Reverse a duplication-of-benefits record found not to duplicate. The record leaves the deduction sweep and the parcel total returns to exactly its prior value."
    roles: [ProgramAdministrator]
    input: [dob_record_id, reversal_reason]
    output: DuplicationOfBenefitsRecord
    side_effects:
      - "DuplicationOfBenefitsRecord.status ACTIVE -> REVERSED; reversal_reason set; deductible_cents frozen for audit; version += 1"
      - "recompute Parcel.dob_deduction_total_cents; Parcel.version += 1"
      - "PurchaseOffer rows already created keep their snapshotted dob_deduction_cents - the reversal never rewrites a created offer"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_DOB_RECORD_NOT_FOUND, ERR_INVALID_REQUEST, ERR_ALREADY_REVERSED]

  - method: POST
    path: /parcels/{parcel_id}/purchase-offers
    description: "Develop a purchase offer in DRAFT from an ACCEPTED review appraisal, deducting duplication of benefits and adding the owner-occupant incentive. OCC-guarded on the parcel; supersedes any prior DRAFT, DECLINED or EXPIRED offer on the parcel."
    roles: [SubrecipientCoordinator]
    input: [parcel_id, source_appraisal_id, offer_basis, expected_parcel_version]
    output: PurchaseOffer
    side_effects:
      - "creates PurchaseOffer with status DRAFT, version 1; base_value_cents, dob_deduction_cents, pre_incentive_net_cents, incentive_cents and net_offer_cents computed per calculations.net_offer_amount"
      - "every existing PurchaseOffer on this parcel with status IN {DRAFT, DECLINED, EXPIRED} -> SUPERSEDED with superseded_by_offer_id set to the new offer id; each of those versions += 1"
      - "Parcel.version += 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_PARCEL_NOT_FOUND, ERR_APPRAISAL_NOT_FOUND, ERR_INVALID_REQUEST, ERR_PARCEL_PROJECT_MISMATCH, ERR_STALE_PARCEL_VERSION, ERR_PROJECT_NOT_APPROVED, ERR_PARTICIPATION_NOT_VOLUNTARY, ERR_REVIEW_APPRAISAL_REQUIRED, ERR_DOB_EXCEEDS_BASE_VALUE, ERR_VALUATION_BASIS_MISMATCH]

  - method: GET
    path: /purchase-offers
    description: "List purchase offers, filterable by parcel, by source appraisal, by superseding offer and by status."
    roles: [ProgramAdministrator, SubrecipientCoordinator, RelocationSpecialist, ComplianceMonitor]
    input: ["parcel_id?", "source_appraisal_id?", "superseded_by_offer_id?", "status?", "limit?", "offset?"]
    output: PurchaseOffer[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]
    note: "Reverse reachability for PurchaseOffer.parcel_id, source_appraisal_id and superseded_by_offer_id."

  - method: GET
    path: /purchase-offers/{offer_id}
    description: "Retrieve one purchase offer with the full offer build-up."
    roles: [ProgramAdministrator, SubrecipientCoordinator, RelocationSpecialist, ComplianceMonitor]
    input: [offer_id]
    output: PurchaseOffer
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_OFFER_NOT_FOUND]

  - method: POST
    path: /purchase-offers/{offer_id}/present
    description: "Present the offer to the owner. Obligates the federal share and starts the offer validity clock. Requires confirmed voluntary participation."
    roles: [SubrecipientCoordinator]
    input: [offer_id]
    output: PurchaseOffer
    side_effects:
      - "PurchaseOffer DRAFT -> PRESENTED; presented_at = clock_now; expires_at = clock_now + OFFER_VALIDITY_DAYS; version += 1"
      - "Parcel.acquisition_status VALUE_ESTABLISHED -> OFFER_OUTSTANDING; Parcel.version += 1"
      - "recompute MitigationProject.federal_obligated_cents; MitigationProject.version += 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_OFFER_NOT_FOUND, ERR_INVALID_OFFER_STATE, ERR_PARTICIPATION_NOT_VOLUNTARY, ERR_FEDERAL_SHARE_CAP_EXCEEDED]

  - method: POST
    path: /purchase-offers/{offer_id}/owner-response
    description: "Record the owner's ACCEPT or DECLINE within the offer validity window."
    roles: [SubrecipientCoordinator]
    input: [offer_id, response, "response_note?"]
    output: PurchaseOffer
    side_effects:
      - "on ACCEPT: PurchaseOffer PRESENTED -> ACCEPTED; Parcel.acquisition_status OFFER_OUTSTANDING -> OFFER_ACCEPTED; obligation retained"
      - "on DECLINE: PurchaseOffer PRESENTED -> DECLINED; Parcel.acquisition_status OFFER_OUTSTANDING -> VALUE_ESTABLISHED; federal_obligated_cents recomputed downward"
      - "PurchaseOffer.version += 1; Parcel.version += 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_OFFER_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_OFFER_STATE, ERR_OFFER_EXPIRED, ERR_PARTICIPATION_NOT_VOLUNTARY]

  - method: POST
    path: /purchase-offers/{offer_id}/expire
    description: "Expire a presented offer whose validity window has passed, reverting the parcel and releasing the obligation."
    roles: [ProgramAdministrator]
    input: [offer_id]
    output: PurchaseOffer
    side_effects:
      - "PurchaseOffer PRESENTED -> EXPIRED; Parcel.acquisition_status OFFER_OUTSTANDING -> VALUE_ESTABLISHED; federal_obligated_cents recomputed downward; all three versions += 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_OFFER_NOT_FOUND, ERR_INVALID_OFFER_STATE, ERR_OFFER_NOT_YET_EXPIRED]

  - method: POST
    path: /purchase-offers/{offer_id}/withdraw
    description: "Withdraw a draft or presented offer. The compensating action for present - the federal obligation returns to exactly its pre-present value."
    roles: [SubrecipientCoordinator]
    input: [offer_id, withdrawal_reason]
    output: PurchaseOffer
    side_effects:
      - "PurchaseOffer DRAFT or PRESENTED -> WITHDRAWN; withdrawal_reason set; version += 1"
      - "from PRESENTED: Parcel.acquisition_status OFFER_OUTSTANDING -> VALUE_ESTABLISHED and federal_obligated_cents recomputed downward; both versions += 1"
      - "from DRAFT: no parcel or ledger movement"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_OFFER_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_OFFER_STATE]
  - method: POST
    path: /parcels/{parcel_id}/relocation-cases
    description: "Open a relocation case for a displaced owner-occupant, tenant or business under federal relocation law."
    roles: [RelocationSpecialist]
    input: [parcel_id, displacee_type, household_reference, rhp_method, rental_assistance_start_date, "current_rent_cents?", "current_utility_cents?", "comparable_rent_cents?", "comparable_utility_cents?", "monthly_gross_income_cents?", "comparable_dwelling_price_cents?", "actual_purchase_price_cents?", "moving_expense_cents?"]
    output: RelocationCase
    side_effects:
      - "creates RelocationCase with status OPENED, appeal_count 0, all computed benefit fields 0, version 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_PARCEL_NOT_FOUND, ERR_INVALID_REQUEST, ERR_DUPLICATE_HOUSEHOLD_REFERENCE]

  - method: GET
    path: /relocation-cases
    description: "List relocation cases, filterable by parcel, displacee type and status."
    roles: [ProgramAdministrator, SubrecipientCoordinator, RelocationSpecialist, ComplianceMonitor]
    input: ["parcel_id?", "displacee_type?", "status?", "household_reference?", "limit?", "offset?"]
    output: RelocationCase[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]
    note: "Reverse reachability for RelocationCase.parcel_id."

  - method: GET
    path: /relocation-cases/{case_id}
    description: "Retrieve one relocation case with the full benefit computation."
    roles: [ProgramAdministrator, SubrecipientCoordinator, RelocationSpecialist, ComplianceMonitor]
    input: [case_id]
    output: RelocationCase
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_RELOCATION_CASE_NOT_FOUND]

  - method: POST
    path: /relocation-cases/{case_id}/determine-eligibility
    description: "Determine relocation eligibility and compute the replacement housing payment, rental assistance and total benefit. Requires an ACCEPTED purchase offer on the parcel and a non-overlapping rental-assistance period for the household."
    roles: [RelocationSpecialist]
    input: [case_id]
    output: RelocationCase
    side_effects:
      - "RelocationCase OPENED -> ELIGIBILITY_DETERMINED; version += 1"
      - "acquisition_price_cents snapshotted from the ACCEPTED PurchaseOffer; rental_assistance_months, rental_assistance_end_date, replacement_housing_payment_cents, rental_assistance_cents and total_relocation_benefit_cents computed per calculations.replacement_housing_payment and calculations.rental_assistance_payment"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_RELOCATION_CASE_NOT_FOUND, ERR_INVALID_CASE_STATE, ERR_RELOCATION_PERIOD_OVERLAP, ERR_OFFER_NOT_FOUND]
    note: "ERR_OFFER_NOT_FOUND is raised when no PurchaseOffer on the parcel has reached ACCEPTED."

  - method: POST
    path: /relocation-cases/{case_id}/submit-claim
    description: "Submit or resubmit the relocation claim. Tenants displaced fewer than 90 days are ineligible."
    roles: [RelocationSpecialist]
    input: [case_id, "claim_note?"]
    output: RelocationCase
    side_effects:
      - "RelocationCase ELIGIBILITY_DETERMINED or APPEALED -> CLAIM_SUBMITTED; version += 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_RELOCATION_CASE_NOT_FOUND, ERR_INVALID_CASE_STATE, ERR_TENANT_INELIGIBLE]

  - method: POST
    path: /relocation-cases/{case_id}/resolve-claim
    description: "Pay or deny the relocation claim. Payment obligates the federal share of the total relocation benefit; denial from APPEALED is final."
    roles: [ProgramAdministrator]
    input: [case_id, decision, "denial_reason?"]
    output: RelocationCase
    side_effects:
      - "on PAY: RelocationCase -> CLAIM_PAID; recompute MitigationProject.federal_obligated_cents; both versions += 1"
      - "on DENY from CLAIM_SUBMITTED: RelocationCase -> CLAIM_DENIED with denial_reason; version += 1"
      - "on DENY from APPEALED: RelocationCase -> CLAIM_DENIED_FINAL with denial_reason; version += 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_RELOCATION_CASE_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_CASE_STATE, ERR_FEDERAL_SHARE_CAP_EXCEEDED]

  - method: POST
    path: /relocation-cases/{case_id}/appeal
    description: "Record the displacee's appeal of a denied claim, bounded by MAX_RELOCATION_APPEALS."
    roles: [RelocationSpecialist]
    input: [case_id, appeal_basis]
    output: RelocationCase
    side_effects:
      - "RelocationCase CLAIM_DENIED -> APPEALED; appeal_basis set; appeal_count += 1; version += 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_RELOCATION_CASE_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_CASE_STATE, ERR_APPEAL_LIMIT_REACHED]

  - method: POST
    path: /parcels/{parcel_id}/closing-records
    description: "Schedule the closing against the accepted offer."
    roles: [SubrecipientCoordinator]
    input: [parcel_id, accepted_offer_id, scheduled_closing_date, settlement_cost_cents]
    output: ClosingRecord
    side_effects:
      - "creates ClosingRecord with status SCHEDULED, version 1; purchase_price_cents snapshotted from the accepted offer's net_offer_cents"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_PARCEL_NOT_FOUND, ERR_OFFER_NOT_FOUND, ERR_INVALID_REQUEST, ERR_PARCEL_PROJECT_MISMATCH, ERR_INVALID_OFFER_STATE]

  - method: GET
    path: /closing-records
    description: "List closing records, filterable by parcel, by the offer they fund and by status."
    roles: [ProgramAdministrator, SubrecipientCoordinator, ComplianceMonitor]
    input: ["parcel_id?", "accepted_offer_id?", "status?", "limit?", "offset?"]
    output: ClosingRecord[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]
    note: "Reverse reachability for ClosingRecord.parcel_id and accepted_offer_id."

  - method: GET
    path: /closing-records/{closing_id}
    description: "Retrieve one closing record."
    roles: [ProgramAdministrator, SubrecipientCoordinator, ComplianceMonitor]
    input: [closing_id]
    output: ClosingRecord
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_CLOSING_NOT_FOUND]

  - method: POST
    path: /closing-records/{closing_id}/fund
    description: "Fund the closing and pass title. Barred while any relocation claim on the parcel is unresolved or the closing falls outside the period of performance."
    roles: [ProgramAdministrator]
    input: [closing_id]
    output: ClosingRecord
    side_effects:
      - "ClosingRecord SCHEDULED -> FUNDED; funded_at = clock_now; funded_by_user_id = acting X-User-ID; version += 1"
      - "Parcel.acquisition_status OFFER_ACCEPTED -> CLOSED; Parcel.version += 1"
      - "recompute MitigationProject.federal_obligated_cents, contiguous_open_space_parcel_count, largest_component_parcel_ids, neighborhood_viability_ratio, viability_status; MitigationProject.version += 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_CLOSING_NOT_FOUND, ERR_INVALID_CLOSING_STATE, ERR_PERIOD_OF_PERFORMANCE_EXPIRED, ERR_FEDERAL_SHARE_CAP_EXCEEDED, ERR_RELOCATION_NOT_SETTLED]

  - method: POST
    path: /closing-records/{closing_id}/record
    description: "Record the deed with the perpetual open-space restriction. Requires the structure to be demolished. Creates the DeedRestriction and cascades three levels to the project's protected open space total."
    roles: [SubrecipientCoordinator]
    input: [closing_id, recording_reference, maintenance_responsible_party]
    output: ClosingRecord
    side_effects:
      - "ClosingRecord FUNDED -> RECORDED; recording_reference and recorded_at set; version += 1"
      - "creates DeedRestriction with status RECORDED, restriction_type OPEN_SPACE_PERPETUAL, prohibited_uses = PROHIBITED_USE_CODES, monitoring_interval_months = MONITORING_INTERVAL_MONTHS, next_monitoring_due_date per calculations.monitoring_schedule, version 1"
      - "Parcel.acquisition_status DEMOLISHED -> OPEN_SPACE_RECORDED; Parcel.version += 1"
      - "recompute MitigationProject.protected_open_space_acres; MitigationProject.version += 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_CLOSING_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_CLOSING_STATE, ERR_DEMOLITION_NOT_COMPLETE]

  - method: POST
    path: /demolition-contractors
    description: "Register a demolition contractor with its asbestos certification and buffered-window capacity."
    roles: [ProgramAdministrator]
    input: [name, license_no, "asbestos_certified?", "max_concurrent_work_orders?"]
    output: DemolitionContractor
    side_effects:
      - "creates DemolitionContractor with status ACTIVE, active_work_order_count 0, version 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]

  - method: GET
    path: /demolition-contractors
    description: "List demolition contractors."
    roles: [ProgramAdministrator, SubrecipientCoordinator, ComplianceMonitor]
    input: ["status?", "asbestos_certified?", "limit?", "offset?"]
    output: DemolitionContractor[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]

  - method: GET
    path: /demolition-contractors/{contractor_id}
    description: "Retrieve one demolition contractor with its live work order count."
    roles: [ProgramAdministrator, SubrecipientCoordinator, ComplianceMonitor]
    input: [contractor_id]
    output: DemolitionContractor
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_CONTRACTOR_NOT_FOUND]

  - method: POST
    path: /demolition-contractors/{contractor_id}/status
    description: "Suspend or reinstate a contractor. Suspension blocks future work order starts without touching existing work orders."
    roles: [ProgramAdministrator]
    input: [contractor_id, status, "status_reason?"]
    output: DemolitionContractor
    side_effects:
      - "DemolitionContractor.status ACTIVE <-> SUSPENDED; version += 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_CONTRACTOR_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_CONTRACTOR_STATE]

  - method: POST
    path: /parcels/{parcel_id}/demolition-work-orders
    description: "Issue a demolition work order for a parcel. The buffered window is checked against the contractor's aggregate capacity. The parcel's acquisition_status is NOT gated here - a work order may be issued at any time - but the CLOSED -> DEMOLISHED cascade on completion only fires when the parcel has actually reached CLOSED."
    roles: [SubrecipientCoordinator]
    input: [parcel_id, contractor_id, "asbestos_survey_status?", scheduled_start, scheduled_end]
    output: DemolitionWorkOrder
    side_effects:
      - "creates DemolitionWorkOrder with status ISSUED, failed_inspection_count 0, required_utility_types = REQUIRED_UTILITY_TYPES, confirmed_utility_types [], version 1"
      - "buffered_start and buffered_end computed per calculations.demolition_buffered_window"
      - "recompute DemolitionContractor.active_work_order_count; DemolitionContractor.version += 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_PARCEL_NOT_FOUND, ERR_CONTRACTOR_NOT_FOUND, ERR_INVALID_REQUEST, ERR_DEMOLITION_WINDOW_CONFLICT]

  - method: GET
    path: /demolition-work-orders
    description: "List demolition work orders, filterable by parcel, contractor and status."
    roles: [ProgramAdministrator, SubrecipientCoordinator, ComplianceMonitor]
    input: ["parcel_id?", "contractor_id?", "status?", "limit?", "offset?"]
    output: DemolitionWorkOrder[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]
    note: "Reverse reachability for DemolitionWorkOrder.parcel_id and contractor_id."

  - method: GET
    path: /demolition-work-orders/{work_order_id}
    description: "Retrieve one work order with its derived utility readiness lists and buffered window."
    roles: [ProgramAdministrator, SubrecipientCoordinator, ComplianceMonitor]
    input: [work_order_id]
    output: DemolitionWorkOrder
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_WORK_ORDER_NOT_FOUND]

  - method: POST
    path: /demolition-work-orders/{work_order_id}/start
    description: "Mobilize the demolition. Requires a cleared or abated asbestos survey, an ACTIVE contractor and every required utility disconnection confirmed. The parcel's acquisition_status is not checked here."
    roles: [SubrecipientCoordinator]
    input: [work_order_id]
    output: DemolitionWorkOrder
    side_effects:
      - "DemolitionWorkOrder READY or FAILED_INSPECTION -> IN_PROGRESS; version += 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_WORK_ORDER_NOT_FOUND, ERR_INVALID_WORK_ORDER_STATE, ERR_ASBESTOS_SURVEY_MISSING, ERR_CONTRACTOR_SUSPENDED, ERR_DEMOLITION_REWORK_LIMIT, ERR_UTILITY_DISCONNECT_INCOMPLETE]

  - method: POST
    path: /demolition-work-orders/{work_order_id}/complete
    description: "Complete the demolition with debris disposal reporting. The diversion percentage gate is waived only for a zero-tonnage work order."
    roles: [SubrecipientCoordinator]
    input: [work_order_id, total_debris_tons, recycled_tons, disposal_manifest_no, disposal_facility_type]
    output: DemolitionWorkOrder
    side_effects:
      - "DemolitionWorkOrder IN_PROGRESS -> COMPLETED; debris fields and diversion_pct set per calculations.debris_diversion_pct; version += 1"
      - "Parcel.acquisition_status CLOSED -> DEMOLISHED; Parcel.version += 1"
      - "recompute DemolitionContractor.active_work_order_count, releasing the buffered window capacity; DemolitionContractor.version += 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_WORK_ORDER_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_WORK_ORDER_STATE, ERR_DEBRIS_DIVERSION_BELOW_MINIMUM]

  - method: POST
    path: /demolition-work-orders/{work_order_id}/fail-inspection
    description: "Record a failed clearance inspection, sending the work order back for rework."
    roles: [ComplianceMonitor]
    input: [work_order_id, inspection_note]
    output: DemolitionWorkOrder
    side_effects:
      - "DemolitionWorkOrder IN_PROGRESS -> FAILED_INSPECTION; failed_inspection_count += 1; version += 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_WORK_ORDER_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_WORK_ORDER_STATE]

  - method: POST
    path: /demolition-work-orders/{work_order_id}/utility-disconnections
    description: "Order a utility disconnection for the work order. The first child moves the compound parent from ISSUED to UTILITY_HOLD."
    roles: [SubrecipientCoordinator]
    input: [work_order_id, utility_type, provider_name]
    output: UtilityDisconnection
    side_effects:
      - "creates UtilityDisconnection with status PENDING, failed_attempt_count 0, version 1"
      - "DemolitionWorkOrder ISSUED -> UTILITY_HOLD on the first child; DemolitionWorkOrder.version += 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_WORK_ORDER_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_WORK_ORDER_STATE, ERR_DUPLICATE_UTILITY_TYPE]

  - method: GET
    path: /utility-disconnections
    description: "List utility disconnections, filterable by work order, utility type and status."
    roles: [ProgramAdministrator, SubrecipientCoordinator, ComplianceMonitor]
    input: ["work_order_id?", "utility_type?", "status?", "limit?", "offset?"]
    output: UtilityDisconnection[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]
    note: "Reverse reachability for UtilityDisconnection.work_order_id."

  - method: GET
    path: /utility-disconnections/{disconnection_id}
    description: "Retrieve one utility disconnection."
    roles: [ProgramAdministrator, SubrecipientCoordinator, ComplianceMonitor]
    input: [disconnection_id]
    output: UtilityDisconnection
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_DISCONNECTION_NOT_FOUND]

  - method: POST
    path: /utility-disconnections/{disconnection_id}/resolve
    description: "Record the provider's outcome. CONFIRMED can complete the parent's readiness; a FAILED outcome on a previously CONFIRMED disconnection revokes readiness and bubbles the parent back to UTILITY_HOLD."
    roles: [SubrecipientCoordinator]
    input: [disconnection_id, outcome, "confirmation_reference?"]
    output: UtilityDisconnection
    side_effects:
      - "UtilityDisconnection.status set to CONFIRMED or FAILED; resolved_at = clock_now; failed_attempt_count += 1 on every FAILED outcome; version += 1"
      - "DemolitionWorkOrder.confirmed_utility_types recomputed; UTILITY_HOLD -> READY when complete, READY -> UTILITY_HOLD when a confirmation is revoked; DemolitionWorkOrder.version += 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_DISCONNECTION_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_DISCONNECTION_STATE]

  - method: GET
    path: /deed-restrictions
    description: "List perpetual open-space deed restrictions, filterable by parcel, by the closing that created them and by compliance status."
    roles: [ProgramAdministrator, SubrecipientCoordinator, ComplianceMonitor]
    input: ["parcel_id?", "closing_record_id?", "status?", "limit?", "offset?"]
    output: DeedRestriction[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]
    note: "Reverse reachability for DeedRestriction.parcel_id and closing_record_id. DeedRestriction rows are created only as a side effect of POST /closing-records/{closing_id}/record - there is no direct create endpoint."

  - method: GET
    path: /deed-restrictions/{restriction_id}
    description: "Retrieve one deed restriction with its prohibited uses, monitoring schedule, open violation and maintenance responsibility."
    roles: [ProgramAdministrator, SubrecipientCoordinator, ComplianceMonitor]
    input: [restriction_id]
    output: DeedRestriction
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_DEED_RESTRICTION_NOT_FOUND]

  - method: POST
    path: /deed-restrictions/{restriction_id}/monitoring-inspections
    description: "Record a monitoring site visit. A COMPLIANT finding re-anchors the monitoring interval; a PROHIBITED_USE_OBSERVED finding opens a violation with a cure deadline."
    roles: [ComplianceMonitor]
    input: [restriction_id, inspection_date, finding, "prohibited_use_code?", narrative]
    output: MonitoringInspection
    side_effects:
      - "creates MonitoringInspection (immutable, no version field) with inspector_user_id = acting X-User-ID"
      - "on COMPLIANT: DeedRestriction -> IN_COMPLIANCE; next_monitoring_due_date re-anchored per calculations.monitoring_schedule"
      - "on PROHIBITED_USE_OBSERVED: DeedRestriction -> VIOLATION_OPEN; open_violation_code, violation_reported_by_user_id and corrective_deadline_date set"
      - "DeedRestriction.version += 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_DEED_RESTRICTION_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_RESTRICTION_STATE, ERR_FUTURE_DATED_FINDING, ERR_PROHIBITED_USE_UNRESOLVED]

  - method: GET
    path: /monitoring-inspections
    description: "List monitoring inspections, filterable by restriction and finding."
    roles: [ProgramAdministrator, SubrecipientCoordinator, ComplianceMonitor]
    input: ["deed_restriction_id?", "finding?", "limit?", "offset?"]
    output: MonitoringInspection[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]
    note: "Reverse reachability for MonitoringInspection.deed_restriction_id."

  - method: GET
    path: /monitoring-inspections/{inspection_id}
    description: "Read one monitoring inspection. MonitoringInspection is immutable (common_fields: false); the response carries no version field."
    roles: [ProgramAdministrator, SubrecipientCoordinator, ComplianceMonitor]
    input: [inspection_id]
    output: MonitoringInspection
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INSPECTION_NOT_FOUND]

  - method: POST
    path: /deed-restrictions/{restriction_id}/cure
    description: "Record the cure of a prohibited use. The monitor recording the cure may not be the monitor who reported the violation (SoD-3)."
    roles: [ComplianceMonitor]
    input: [restriction_id, cure_date, cure_narrative]
    output: DeedRestriction
    side_effects:
      - "DeedRestriction VIOLATION_OPEN -> CURED; cured_on set; open_violation_code and corrective_deadline_date cleared; next_monitoring_due_date re-anchored on cure_date; version += 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_SEGREGATION_OF_DUTIES, ERR_DEED_RESTRICTION_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_RESTRICTION_STATE, ERR_FUTURE_DATED_FINDING]

  - method: POST
    path: /deed-restrictions/{restriction_id}/terminate
    description: "Terminate the perpetual restriction under a federal authorization. Removes the parcel's acreage from the project's protected open space."
    roles: [ProgramAdministrator]
    input: [restriction_id, termination_authorization_reference]
    output: DeedRestriction
    side_effects:
      - "DeedRestriction RECORDED, IN_COMPLIANCE or CURED -> TERMINATED; termination_authorization_reference set; version += 1"
      - "recompute MitigationProject.protected_open_space_acres; MitigationProject.version += 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_DEED_RESTRICTION_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_RESTRICTION_STATE, ERR_TERMINATION_NOT_AUTHORIZED]

  - method: POST
    path: /mitigation-projects/{project_id}/program-income-entries
    description: "Post a program income credit or an eligible expenditure debit. OCC-guarded on the project because the federal share is computed against the project's live cost share."
    roles: [SubrecipientCoordinator]
    input: [project_id, entry_type, amount_cents, posted_on, "applied_to_parcel_id?", expected_project_version]
    output: ProgramIncomeLedgerEntry
    side_effects:
      - "creates ProgramIncomeLedgerEntry with status ACTIVE (immutable, no version field); federal_share_cents computed per calculations.program_income_federal_share"
      - "recompute MitigationProject.program_income_balance_cents; MitigationProject.version += 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_PROJECT_NOT_FOUND, ERR_PARCEL_NOT_FOUND, ERR_LEDGER_ENTRY_NOT_FOUND, ERR_INVALID_REQUEST, ERR_PARCEL_PROJECT_MISMATCH, ERR_STALE_PROJECT_VERSION, ERR_INVALID_PROJECT_STATE, ERR_PROGRAM_INCOME_OVERDRAWN]

  - method: GET
    path: /program-income-entries
    description: "List program income ledger entries, filterable by project, attributed parcel, reversed entry and status."
    roles: [ProgramAdministrator, SubrecipientCoordinator, ComplianceMonitor]
    input: ["project_id?", "applied_to_parcel_id?", "reverses_entry_id?", "entry_type?", "status?", "limit?", "offset?"]
    output: ProgramIncomeLedgerEntry[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]
    note: "Reverse reachability for ProgramIncomeLedgerEntry.project_id, applied_to_parcel_id and reverses_entry_id. Default sort is posted_on ASC then created_at ASC."

  - method: GET
    path: /program-income-entries/{entry_id}
    description: "Read one program income ledger entry. ProgramIncomeLedgerEntry is immutable (common_fields: false); status flips to REVERSED only through the reverse endpoint and the response carries no version field."
    roles: [ProgramAdministrator, SubrecipientCoordinator, ComplianceMonitor]
    input: [entry_id]
    output: ProgramIncomeLedgerEntry
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_LEDGER_ENTRY_NOT_FOUND]

  - method: POST
    path: /program-income-entries/{entry_id}/reverse
    description: "Reverse a posted program income entry. Creates the opposite-signed reversing entry, marks the target REVERSED, and returns the balance to exactly its pre-target value."
    roles: [ProgramAdministrator]
    input: [entry_id, "reversal_note?"]
    output: ProgramIncomeLedgerEntry
    side_effects:
      - "target ProgramIncomeLedgerEntry.status ACTIVE -> REVERSED"
      - "creates a reversing ProgramIncomeLedgerEntry with reverses_entry_id = entry_id, status REVERSED, the opposite sign and the same magnitude"
      - "recompute MitigationProject.program_income_balance_cents; MitigationProject.version += 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_LEDGER_ENTRY_NOT_FOUND, ERR_ALREADY_REVERSED]
    note: "The response is the reversing entry. Both the target and the reversal are excluded from the ACTIVE input set, so no rounding residue survives."

  - method: POST
    path: /_clock/set_current_utc
    description: |
      TEST-DRIVING ENDPOINT. Sets the logical clock that every other endpoint reads as clock_now.
      The logical clock starts at 2026-08-01T00:00:00Z on a cold service and only this endpoint
      moves it. Required because purchase-offer expiry (OFFER_VALIDITY_DAYS), the appraisal validity
      window (APPRAISAL_VALIDITY_MONTHS), the monitoring interval (MONITORING_INTERVAL_MONTHS), the
      cure window (CURE_WINDOW_DAYS) and the period of performance cannot otherwise be advanced
      through any business endpoint, so their preconditions would be unreachable.
    roles: [ProgramAdministrator, SubrecipientCoordinator, StaffAppraiser, ReviewAppraiser, RelocationSpecialist, ComplianceMonitor]
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects:
      - "sets the logical clock to current_utc; no entity is created or mutated and no version is bumped"
    errors: [ERR_INVALID_REQUEST]
    note: "Any authenticated role may move the clock; the endpoint is outside the business surface so no segregation-of-duties bar applies. Moving the clock backwards is permitted."
