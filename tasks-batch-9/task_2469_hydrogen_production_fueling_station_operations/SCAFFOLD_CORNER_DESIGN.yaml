        grounds:
          - state_machines.DispenseSession.initial_state
          - entities.DispenseSession.fields.fill_status
          - entities.DispenseSession.fields.billing_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / dispense_session_parallel_fill_and_billing_axes_advance_independently
          rationale: |
            That instance asserts the freshly created session is exactly (PRECOOLING, PENDING) and
            then walks both axes, so the initial-state claim is a strict subset of its assertions.

      - name: delivery_offload_guarded_by_lot_release_state
        claim_type: guarded_transitions
        grounds:
          - state_machines.Delivery.ARRIVED_to_ACCEPTED
          - validations[priority=130]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / delivery_offload_blocked_until_production_lot_reaches_released
          rationale: |
            The cross-entity guard "ARRIVED -> ACCEPTED only if the ProductionLot is RELEASED" is
            exactly that instance's subject, including the retry that succeeds once the lot is
            released.

      - name: station_freeze_cascades_down_to_in_flight_sessions
        claim_type: cascade_down
        grounds:
          - state_machines.Station.OPEN_to_FROZEN
          - state_machines.DispenseSession.PRECOOLING_to_ABORTED
        excluded_because:
          difficulty_instance: transitive_cascade / critical_leak_freezes_station_then_aborts_fill_then_voids_billing_depth_4
          rationale: |
            That instance walks the full four-hop cascade (event -> subsystem field -> posture ->
            in-flight sessions ABORTED -> billing VOIDED) and asserts that only non-terminal
            sessions are touched, which subsumes the cascade-down pattern claim.

      - name: meter_void_reverses_the_meter_correction_entry
        claim_type: compensation
        grounds:
          - state_machines.DispenseSession.METERED_to_VOIDED
          - entities.InventoryLedgerEntry.fields.reason
        excluded_because:
          difficulty_instance: compensating_invariant / meter_void_reversal_conserves_hydrogen_mass_in_kg_across_the_ledger
          rationale: |
            That instance asserts the METER_VOID_REVERSAL row exactly negates the METER_CORRECTION
            row and that onsite_inventory_kg returns to its pre-settlement value with no drift.

  # ===========================================================================
  - section: calculations
    instances:
      - name: purity_verdict_at_and_just_above_the_carbon_monoxide_limit
        claim_type: threshold
        grounds:
          - calculations.purity_verdict
          - calculations.purity_verdict.constants.LIMIT_CARBON_MONOXIDE_PPM
          - entities.PurityTest.fields.verdict
          - entities.PurityTest.fields.purity_margin_pct
          - entities.PurityTest.fields.failing_analytes
          - state_machines.ProductionLot.PRODUCED_to_REJECTED
        distinguishing_aspect: |
          The fuel-cell-grade limit is inclusive: a lot measured EXACTLY at every limit passes with
          purity_margin_pct 0.000, while raising carbon monoxide by one thousandth of a ppm
          (0.200 -> 0.201) flips the verdict to FAIL, drives purity_margin_pct negative (-0.500) and
          drops the lot into the terminal REJECTED state. 0.000 versus -0.500 is the falsifier for
          a ">= limit fails" misreading.
        test_recipe:
          setup:
            - "One PEM_ELECTROLYSIS asset with a covering power contract; clock at 2026-08-01T00:00:00Z."
            - "Two lots produced 2026-07-20 to 2026-07-21, both PRODUCED with qa_status PENDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /production-assets"
              payload: { asset_code: "PA-C1-1", pathway: "PEM_ELECTROLYSIS", nameplate_kg_per_day: 1200.000, ccs_capture_rate: 0.0000, operator_org: "Harbor H2 Production" }
              as: ProductionEngineer
              captures: { asset_id: "$.data.id" }
            - call: "POST /production-assets/${asset_id}/power-supply-contracts"
              payload: { contract_code: "PSC-C1-1", grid_ci_gco2e_per_mwh: 385000.00, annual_renewable_pct: 50.000, hourly_matched_renewable_pct: 50.000, hourly_matching_enabled: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ProductionEngineer
            - call: "POST /production-lots"
              payload: { production_asset_id: "${asset_id}", lot_code: "LOT-C1-AT", mass_kg: 300.000, energy_consumed_kwh: 15600.0, feedstock_consumed_mmbtu: 0.000, carryover_kg: 0.000, production_start_at: "2026-07-20T00:00:00Z", production_end_at: "2026-07-21T00:00:00Z" }
              as: ProductionEngineer
              captures: { lot_at: "$.data.id" }
            - call: "POST /production-lots"
              payload: { production_asset_id: "${asset_id}", lot_code: "LOT-C1-OVER", mass_kg: 300.000, energy_consumed_kwh: 15600.0, feedstock_consumed_mmbtu: 0.000, carryover_kg: 0.000, production_start_at: "2026-07-20T00:00:00Z", production_end_at: "2026-07-21T00:00:00Z" }
              as: ProductionEngineer
              captures: { lot_over: "$.data.id" }
          trigger:
            - call: "POST /production-lots/${lot_at}/purity-tests"
              payload: { sampled_at: "2026-07-21T06:00:00Z", total_hydrocarbons_ppm: 2.000, water_ppm: 5.000, oxygen_ppm: 5.000, nitrogen_ppm: 100.000, carbon_monoxide_ppm: 0.200, carbon_dioxide_ppm: 2.000, total_sulfur_ppm: 0.004, ammonia_ppm: 0.100, helium_ppm: 300.000 }
              as: QualityAnalyst
              as_user_id: "QA-1"
              captures: { verdict_at: "$.data.verdict", margin_at: "$.data.purity_margin_pct" }
            - call: "POST /production-lots/${lot_over}/purity-tests"
              payload: { sampled_at: "2026-07-21T06:00:00Z", total_hydrocarbons_ppm: 1.000, water_ppm: 2.500, oxygen_ppm: 2.500, nitrogen_ppm: 50.000, carbon_monoxide_ppm: 0.201, carbon_dioxide_ppm: 1.000, total_sulfur_ppm: 0.002, ammonia_ppm: 0.050, helium_ppm: 150.000 }
              as: QualityAnalyst
              as_user_id: "QA-1"
              captures: { verdict_over: "$.data.verdict", margin_over: "$.data.purity_margin_pct", failing: "$.data.failing_analytes" }
          assert:
            - "${verdict_at} == PASS and ${margin_at} == 0.000 (every analyte exactly at its limit passes)"
            - "ProductionLot.${lot_at}.qa_status == PASSED and status == PRODUCED"
            - "${verdict_over} == FAIL and ${margin_over} == -0.500 ((0.2 - 0.201) / 0.2 * 100)"
            - "${failing} == [carbon_monoxide_ppm] — only the breaching analyte is listed, in ANALYTE_ORDER"
            - "ProductionLot.${lot_over}.qa_status == FAILED and status == REJECTED (terminal)"
            - "A second purity test on ${lot_over} is refused with ERR_INVALID_STATE_TRANSITION (409) because REJECTED is terminal"

      - name: purity_verdict_indeterminate_when_optional_helium_is_omitted
        claim_type: input_set_filtering
        grounds:
          - calculations.purity_verdict
          - entities.PurityTest.fields.helium_ppm
          - entities.PurityTest.fields.verdict
          - entities.ProductionLot.fields.qa_status
        distinguishing_aspect: |
          The margin is computed over the MEASURED analytes only: omitting helium_ppm keeps the
          margin at 50.000 (helium contributes nothing rather than defaulting to 0 or to its limit)
          while the verdict becomes INDETERMINATE, so qa_status stays PENDING and the lot is neither
          releasable nor rejected.
        test_recipe:
          setup:
            - "One PEM_ELECTROLYSIS asset with a covering power contract; one PRODUCED lot."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /production-assets"
              payload: { asset_code: "PA-C2-1", pathway: "PEM_ELECTROLYSIS", nameplate_kg_per_day: 1200.000, ccs_capture_rate: 0.0000, operator_org: "Harbor H2 Production" }
              as: ProductionEngineer
              captures: { asset_id: "$.data.id" }
            - call: "POST /production-assets/${asset_id}/power-supply-contracts"
              payload: { contract_code: "PSC-C2-1", grid_ci_gco2e_per_mwh: 385000.00, annual_renewable_pct: 50.000, hourly_matched_renewable_pct: 50.000, hourly_matching_enabled: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ProductionEngineer
            - call: "POST /production-lots"
              payload: { production_asset_id: "${asset_id}", lot_code: "LOT-C2-1", mass_kg: 300.000, energy_consumed_kwh: 15600.0, feedstock_consumed_mmbtu: 0.000, carryover_kg: 0.000, production_start_at: "2026-07-20T00:00:00Z", production_end_at: "2026-07-21T00:00:00Z" }
              as: ProductionEngineer
              captures: { lot_id: "$.data.id" }
          trigger:
            - call: "POST /production-lots/${lot_id}/purity-tests"
              payload: { sampled_at: "2026-07-21T06:00:00Z", total_hydrocarbons_ppm: 1.000, water_ppm: 2.500, oxygen_ppm: 2.500, nitrogen_ppm: 50.000, carbon_monoxide_ppm: 0.100, carbon_dioxide_ppm: 1.000, total_sulfur_ppm: 0.002, ammonia_ppm: 0.050 }
              as: QualityAnalyst
              as_user_id: "QA-1"
              captures: { verdict: "$.data.verdict", margin: "$.data.purity_margin_pct", failing: "$.data.failing_analytes" }
          assert:
            - "HTTP 201; ${verdict} == INDETERMINATE and ${failing} == []"
            - "${margin} == 50.000 (every measured analyte sits at half its limit; the omitted helium is excluded from the MIN)"
            - "ProductionLot.${lot_id}.qa_status == PENDING (INDETERMINATE neither passes nor fails the lot)"
            - "ProductionLot.${lot_id}.status == PRODUCED"
            - "A release attempt is refused with ERR_QA_NOT_PASSED (422) while qa_status is PENDING"

      - name: required_precool_band_boundary_and_mc_formula_relief
        claim_type: constants_applied
        grounds:
          - calculations.required_precool_temperature
          - calculations.required_precool_temperature.constants.PRECOOL_H70_MILD_C
          - calculations.required_precool_temperature.constants.PRECOOL_H70_HOT_C
          - calculations.required_precool_temperature.constants.MC_FORMULA_RELIEF_C
          - entities.DispenseSession.fields.required_precool_c
        distinguishing_aspect: |
          The ambient bands are half-open at the top: ambient 30.0 is MILD (-33.0 for H70) and only
          30.1 crosses into HOT (-40.0), while MC_FORMULA adds exactly +5.0 of relief to whatever
          the table produced (-33.0 -> -28.0). Three sessions differing only in ambient_temp_c and
          fill_protocol isolate the band edge from the protocol adder.
        test_recipe:
          setup:
            - "Station STN-C3: HIGH 600 L at 950.00 bar (posture OPEN, high bank 36.000), nozzle_count 4, max_pressure_class H70, two current EMERGENCY_RESPONSE certifications."
            - "Three H70 LIGHT_DUTY sessions of 5.000 kg each; available_kg 45.600 covers all three reservations."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /funding-agreements"
              payload: { agreement_code: "FA-C3", funder_name: "State Clean Transport Fund", min_uptime_pct: 99.000, penalty_per_point_cents: 250000, initial_holdback_cents: 500000, uptime_method: "NOZZLE_WEIGHTED" }
              as: PlatformAdmin
              captures: { fa_id: "$.data.id" }
            - call: "POST /stations"
              payload: { funding_agreement_id: "${fa_id}", code: "STN-C3", name: "Precool Station", nozzle_count: 4, offload_bay_count: 2, storage_capacity_kg: 900.000, reserve_floor_kg: 20.000, max_pressure_class: "H70", setback_compliant: true }
              as: PlatformAdmin
              captures: { st_id: "$.data.id" }
            - call: "POST /stations/${st_id}/pressure-vessels"
              payload: { bank_tier: "HIGH", water_volume_l: 600.0, mawp_bar: 1000.00, min_residual_bar: 200.00, initial_pressure_bar: 950.00, next_inspection_due_date: "2027-06-30" }
              as: SafetyOfficer
              captures: { v_high: "$.data.id" }
            - call: "POST /stations/${st_id}/responder-certifications"
              payload: { responder_ref: "RSP-C3-1", cert_type: "EMERGENCY_RESPONSE", valid_from: "2026-01-01", expires_on: "2027-01-01" }
              as: SafetyOfficer
            - call: "POST /stations/${st_id}/responder-certifications"
              payload: { responder_ref: "RSP-C3-2", cert_type: "EMERGENCY_RESPONSE", valid_from: "2026-01-01", expires_on: "2027-01-01" }
              as: SafetyOfficer
          trigger:
            - call: "GET /stations/${st_id}"
              payload: {}
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { st_v1: "$.data.version" }
            - call: "POST /dispense-sessions"
              payload: { station_id: "${st_id}", vehicle_class: "LIGHT_DUTY", target_pressure_class: "H70", fill_protocol: "SAE_J2601_TABLE", planned_kg: 5.000, ambient_temp_c: 30.0, expected_station_version: "${st_v1}" }
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { s_mild: "$.data.id", precool_mild: "$.data.required_precool_c" }
            - call: "GET /stations/${st_id}"
              payload: {}
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { st_v2: "$.data.version" }
            - call: "POST /dispense-sessions"
              payload: { station_id: "${st_id}", vehicle_class: "LIGHT_DUTY", target_pressure_class: "H70", fill_protocol: "SAE_J2601_TABLE", planned_kg: 5.000, ambient_temp_c: 30.1, expected_station_version: "${st_v2}" }
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { s_hot: "$.data.id", precool_hot: "$.data.required_precool_c" }
            - call: "GET /stations/${st_id}"
              payload: {}
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { st_v3: "$.data.version" }
            - call: "POST /dispense-sessions"
              payload: { station_id: "${st_id}", vehicle_class: "LIGHT_DUTY", target_pressure_class: "H70", fill_protocol: "MC_FORMULA", planned_kg: 5.000, ambient_temp_c: 30.0, expected_station_version: "${st_v3}" }
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { s_mc: "$.data.id", precool_mc: "$.data.required_precool_c" }
          assert:
            - "${precool_mild} == -33.0 (ambient 30.0 is NOT greater than 30.0, so the band is MILD)"
            - "${precool_hot} == -40.0 (ambient 30.1 crosses into HOT)"
            - "${precool_mc} == -28.0 (MILD -33.0 plus MC_FORMULA_RELIEF_C 5.0)"
            - "all three sessions are (PRECOOLING, PENDING) and ${st_v3} == ${st_v1} + 2"
            - "Station.${st_id}.reserved_kg == 15.000 and available_kg == 30.600"

      - name: metering_error_at_the_meter_tolerance_boundary_flips_the_flag
        claim_type: precision
        grounds:
          - calculations.dispense_metered_mass_correction
          - calculations.dispense_metered_mass_correction.constants.METER_TOLERANCE_PCT
          - calculations.dispense_metered_mass_correction.constants.TEMP_COEFF_PER_C
          - entities.DispenseSession.fields.density_correction_factor
          - entities.DispenseSession.fields.metering_within_tolerance
        distinguishing_aspect: |
          density_correction_factor carries NO intermediate rounding while corrected_kg and
          metering_error_pct round to 3 places, and the error is measured against the ROUNDED
          corrected mass: ambient -18.0 C yields -1.498 (within the 1.5 percent tolerance) and
          ambient -18.1 C yields -1.502 (outside), a 0.1 degree difference that only the exact
          factor plus round-half-up sequence reproduces.
        test_recipe:
          setup:
            - "Station STN-C4: HIGH 600 L at 950.00 bar and LOW 5000 L at 300.00 bar, max_pressure_class H35, nozzle_count 2, two current responder certifications; onsite 165.600."
            - "Two sequential H35 sessions of planned 24.000 kg, metered 24.000 kg, avg_dispense_pressure_bar 700.00 (so the pressure term is exactly zero)."
            - "precool_temp_achieved_c -20.0 satisfies the H35 COLD requirement of -17.0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /funding-agreements"
              payload: { agreement_code: "FA-C4", funder_name: "State Clean Transport Fund", min_uptime_pct: 99.000, penalty_per_point_cents: 250000, initial_holdback_cents: 500000, uptime_method: "NOZZLE_WEIGHTED" }
              as: PlatformAdmin
              captures: { fa_id: "$.data.id" }
            - call: "POST /stations"
              payload: { funding_agreement_id: "${fa_id}", code: "STN-C4", name: "Meter Boundary Station", nozzle_count: 2, offload_bay_count: 2, storage_capacity_kg: 900.000, reserve_floor_kg: 20.000, max_pressure_class: "H35", setback_compliant: true }
              as: PlatformAdmin
              captures: { st_id: "$.data.id" }
            - call: "POST /stations/${st_id}/pressure-vessels"
              payload: { bank_tier: "HIGH", water_volume_l: 600.0, mawp_bar: 1000.00, min_residual_bar: 200.00, initial_pressure_bar: 950.00, next_inspection_due_date: "2027-06-30" }
              as: SafetyOfficer
              captures: { v_high: "$.data.id" }
            - call: "POST /stations/${st_id}/pressure-vessels"
              payload: { bank_tier: "LOW", water_volume_l: 5000.0, mawp_bar: 1000.00, min_residual_bar: 100.00, initial_pressure_bar: 300.00, next_inspection_due_date: "2027-06-30" }
              as: SafetyOfficer
              captures: { v_low: "$.data.id" }
            - call: "POST /stations/${st_id}/responder-certifications"
              payload: { responder_ref: "RSP-C4-1", cert_type: "EMERGENCY_RESPONSE", valid_from: "2026-01-01", expires_on: "2027-01-01" }
              as: SafetyOfficer
            - call: "POST /stations/${st_id}/responder-certifications"
              payload: { responder_ref: "RSP-C4-2", cert_type: "EMERGENCY_RESPONSE", valid_from: "2026-01-01", expires_on: "2027-01-01" }
              as: SafetyOfficer
            - call: "GET /stations/${st_id}"
              payload: {}
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { st_v1: "$.data.version" }
            - call: "POST /dispense-sessions"
              payload: { station_id: "${st_id}", vehicle_class: "TRANSIT_BUS", target_pressure_class: "H35", fill_protocol: "SAE_J2601_TABLE", planned_kg: 24.000, ambient_temp_c: -18.0, expected_station_version: "${st_v1}" }
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { s1: "$.data.id" }
            - call: "POST /dispense-sessions/${s1}/fuel"
              payload: { precool_temp_achieved_c: -20.0 }
              as: StationOperator
              as_user_id: "${st_id}"
          trigger:
            - call: "POST /dispense-sessions/${s1}/complete"
              payload: { metered_kg: 24.000, avg_dispense_pressure_bar: 700.00, final_pressure_bar: 438.00 }
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { dcf1: "$.data.density_correction_factor", corr1: "$.data.corrected_kg", err1: "$.data.metering_error_pct", within1: "$.data.metering_within_tolerance" }
            - call: "GET /stations/${st_id}"
              payload: {}
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { st_v2: "$.data.version" }
            - call: "POST /dispense-sessions"
              payload: { station_id: "${st_id}", vehicle_class: "TRANSIT_BUS", target_pressure_class: "H35", fill_protocol: "SAE_J2601_TABLE", planned_kg: 24.000, ambient_temp_c: -18.1, expected_station_version: "${st_v2}" }
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { s2: "$.data.id" }
            - call: "POST /dispense-sessions/${s2}/fuel"
              payload: { precool_temp_achieved_c: -20.0 }
              as: StationOperator
              as_user_id: "${st_id}"
            - call: "POST /dispense-sessions/${s2}/complete"
              payload: { metered_kg: 24.000, avg_dispense_pressure_bar: 700.00, final_pressure_bar: 438.00 }
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { dcf2: "$.data.density_correction_factor", corr2: "$.data.corrected_kg", err2: "$.data.metering_error_pct", within2: "$.data.metering_within_tolerance" }
          assert:
            - "${dcf1} == 1.0152 exactly (1 + (20.0 - (-18.0)) * 0.0004 + (700.00 - 700.0) * -0.00002)"
            - "${corr1} == 24.365 (24.000 * 1.0152 = 24.3648 rounded half up) and ${err1} == -1.498"
            - "${within1} == true (1.498 <= METER_TOLERANCE_PCT 1.5)"
            - "${dcf2} == 1.01524 exactly and ${corr2} == 24.366 (24.36576 rounded half up)"
            - "${err2} == -1.502 and ${within2} == false"
            - "the two sessions differ ONLY in ambient_temp_c, so the flag flip is attributable to the 0.1 degree step"
            - "Station.${st_id}.onsite_inventory_kg == 117.600 (165.600 - 24.000 - 24.000 via two DISPENSE_DRAW rows)"

      - name: carbon_intensity_smr_ccs_applies_capture_rate_and_feedstock_constant
        claim_type: correct_result
        grounds:
          - calculations.production_lot_carbon_intensity
          - calculations.production_lot_carbon_intensity.constants.NG_TOTAL_G_PER_MMBTU
          - calculations.production_lot_carbon_intensity.constants.COMPRESSION_ADDER_G_PER_KG
          - entities.ProductionAsset.fields.ccs_capture_rate
          - entities.ProductionLot.fields.ci_variant_applied
        distinguishing_aspect: |
          The reforming pathway exercises the feedstock term that electrolysis leaves at zero:
          160.000 MMBtu * 61260.0 g/MMBtu * (1 - 0.9000) = 980160 g dominates the 770000 g of grid
          electricity and the 300000 g compression adder, giving 17.08 gCO2e/MJ; with
          hourly_matching_enabled false the certified value EQUALS the provisional one and
          ci_variant_applied is ANNUAL_AVERAGE.
        test_recipe:
          setup:
            - "One SMR_CCS asset with ccs_capture_rate 0.9000 and a contract with annual_renewable_pct 0.000, hourly_matching_enabled false."
            - "One lot of mass_kg 1000.000, energy 2000.0 kWh, feedstock 160.000 MMBtu, no carryover."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /production-assets"
              payload: { asset_code: "PA-C5-SMR", pathway: "SMR_CCS", nameplate_kg_per_day: 5000.000, ccs_capture_rate: 0.9000, operator_org: "Harbor H2 Reforming" }
              as: ProductionEngineer
              captures: { asset_id: "$.data.id" }
            - call: "POST /production-assets/${asset_id}/power-supply-contracts"
              payload: { contract_code: "PSC-C5-1", grid_ci_gco2e_per_mwh: 385000.00, annual_renewable_pct: 0.000, hourly_matched_renewable_pct: 90.000, hourly_matching_enabled: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: ProductionEngineer
              captures: { psc_id: "$.data.id" }
            - call: "POST /production-lots"
              payload: { production_asset_id: "${asset_id}", lot_code: "LOT-C5-1", mass_kg: 1000.000, energy_consumed_kwh: 2000.0, feedstock_consumed_mmbtu: 160.000, carryover_kg: 0.000, production_start_at: "2026-07-20T00:00:00Z", production_end_at: "2026-07-21T00:00:00Z" }
              as: ProductionEngineer
              captures: { lot_id: "$.data.id", ci_prov: "$.data.ci_provisional_gco2e_per_mj" }
          trigger:
            - call: "POST /production-lots/${lot_id}/certify-ci"
              payload: {}
              as: ComplianceAdmin
              as_user_id: "CA-1"
              captures: { ci_cert: "$.data.ci_certified_gco2e_per_mj", variant: "$.data.ci_variant_applied" }
          assert:
            - "${ci_prov} == 17.08 and ${ci_cert} == 17.08 (electricity 770000 g + feedstock 980160 g + compression 300000 g over 120000 MJ = 17.0846...)"
            - "${variant} == ANNUAL_AVERAGE (hourly_matching_enabled is false, so the 90.000 hourly share is deliberately NOT used)"
            - "ProductionLot.${lot_id}.selected_power_contract_id == ${psc_id}"
            - "ProductionLot.${lot_id}.ci_status == CERTIFIED and status == PRODUCED"

      - name: cascade_waterfall_fills_high_bank_first_then_makes_up_in_reverse_order
        claim_type: waterfall_allocation
        grounds:
          - calculations.cascade_fill_allocation
          - calculations.cascade_fill_allocation.constants.TERMINAL_BAR_H35
          - entities.DispenseSession.fields.cascade_plan
          - entities.DispenseSession.fields.direct_cascade_kg
          - entities.DispenseSession.fields.compressor_makeup_kg
        distinguishing_aspect: |
          Pass 1 empties the HIGH bank down to the FILL TERMINAL pressure (438.00 for H35, above the
          vessel's own 200.00 residual) and pass 2 then draws in the OPPOSITE tier order down to the
          vessel's own residual: the first 24.000 kg session comes entirely from HIGH, while the
          second splits 0.576 kg from HIGH plus 23.424 kg of LOW-bank compressor makeup. A
          single-pass or same-order implementation cannot produce that split.
        test_recipe:
          setup:
            - "Station STN-C6: HIGH 600 L at 950.00 bar (kg per bar 0.048) and LOW 5000 L at 300.00 bar (kg per bar 0.400), max_pressure_class H35, nozzle_count 2, two current responder certifications."
            - "Both sessions use ambient_temp_c 20.0 and avg_dispense_pressure_bar 700.00 so density_correction_factor is exactly 1 and metering never interferes."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /funding-agreements"
              payload: { agreement_code: "FA-C6", funder_name: "State Clean Transport Fund", min_uptime_pct: 99.000, penalty_per_point_cents: 250000, initial_holdback_cents: 500000, uptime_method: "NOZZLE_WEIGHTED" }
              as: PlatformAdmin
              captures: { fa_id: "$.data.id" }
            - call: "POST /stations"
              payload: { funding_agreement_id: "${fa_id}", code: "STN-C6", name: "Cascade Station", nozzle_count: 2, offload_bay_count: 2, storage_capacity_kg: 900.000, reserve_floor_kg: 20.000, max_pressure_class: "H35", setback_compliant: true }
              as: PlatformAdmin
              captures: { st_id: "$.data.id" }
            - call: "POST /stations/${st_id}/pressure-vessels"
              payload: { bank_tier: "HIGH", water_volume_l: 600.0, mawp_bar: 1000.00, min_residual_bar: 200.00, initial_pressure_bar: 950.00, next_inspection_due_date: "2027-06-30" }
              as: SafetyOfficer
              captures: { v_high: "$.data.id" }
            - call: "POST /stations/${st_id}/pressure-vessels"
              payload: { bank_tier: "LOW", water_volume_l: 5000.0, mawp_bar: 1000.00, min_residual_bar: 100.00, initial_pressure_bar: 300.00, next_inspection_due_date: "2027-06-30" }
              as: SafetyOfficer
              captures: { v_low: "$.data.id" }
            - call: "POST /stations/${st_id}/responder-certifications"
              payload: { responder_ref: "RSP-C6-1", cert_type: "EMERGENCY_RESPONSE", valid_from: "2026-01-01", expires_on: "2027-01-01" }
              as: SafetyOfficer
            - call: "POST /stations/${st_id}/responder-certifications"
              payload: { responder_ref: "RSP-C6-2", cert_type: "EMERGENCY_RESPONSE", valid_from: "2026-01-01", expires_on: "2027-01-01" }
              as: SafetyOfficer
            - call: "GET /stations/${st_id}"
              payload: {}
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { st_v1: "$.data.version" }
            - call: "POST /dispense-sessions"
              payload: { station_id: "${st_id}", vehicle_class: "TRANSIT_BUS", target_pressure_class: "H35", fill_protocol: "SAE_J2601_TABLE", planned_kg: 24.000, ambient_temp_c: 20.0, expected_station_version: "${st_v1}" }
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { s1: "$.data.id" }
            - call: "POST /dispense-sessions/${s1}/fuel"
              payload: { precool_temp_achieved_c: -30.0 }
              as: StationOperator
              as_user_id: "${st_id}"
          trigger:
            - call: "POST /dispense-sessions/${s1}/complete"
              payload: { metered_kg: 24.000, avg_dispense_pressure_bar: 700.00, final_pressure_bar: 438.00 }
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { plan1: "$.data.cascade_plan", direct1: "$.data.direct_cascade_kg", makeup1: "$.data.compressor_makeup_kg" }
            - call: "GET /stations/${st_id}"
              payload: {}
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { st_v2: "$.data.version" }
            - call: "POST /dispense-sessions"
              payload: { station_id: "${st_id}", vehicle_class: "TRANSIT_BUS", target_pressure_class: "H35", fill_protocol: "SAE_J2601_TABLE", planned_kg: 24.000, ambient_temp_c: 20.0, expected_station_version: "${st_v2}" }
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { s2: "$.data.id" }
            - call: "POST /dispense-sessions/${s2}/fuel"
              payload: { precool_temp_achieved_c: -30.0 }
              as: StationOperator
              as_user_id: "${st_id}"
            - call: "POST /dispense-sessions/${s2}/complete"
              payload: { metered_kg: 24.000, avg_dispense_pressure_bar: 700.00, final_pressure_bar: 438.00 }
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { plan2: "$.data.cascade_plan", direct2: "$.data.direct_cascade_kg", makeup2: "$.data.compressor_makeup_kg" }
          assert:
            - "session 1: ${direct1} == 24.000, ${makeup1} == 0.000, ${plan1} == [{bank_tier: HIGH, vessel_id: ${v_high}, kg: 24.000, pressure_after_bar: 450.00}]"
            - "after session 1: PressureVessel.${v_high}.current_pressure_bar == 450.00, PressureVessel.${v_low}.current_pressure_bar == 300.00 (LOW untouched)"
            - "session 2: ${direct2} == 0.576 (only 450.00 - 438.00 = 12.00 bar of HIGH headroom remained above the H35 terminal) and ${makeup2} == 23.424"
            - "${plan2} == [{HIGH, ${v_high}, 0.576, 438.00}, {LOW, ${v_low}, 23.424, 241.44}] — pass 2 draws LOW first, down to its own 100.00 residual"
            - "Station.${st_id}.high_bank_deliverable_kg == 11.424 after session 2, so safety_posture stays OPEN"
            - "Station.${st_id}.onsite_inventory_kg == 117.600 and total_deliverable_kg == 67.848"
            - "Station.${st_id}.corrected_kg_mtd == 0.000 while both sessions remain billing_status PENDING"

      - name: onsite_inventory_projection_replays_the_ledger_after_a_vent
        claim_type: projection
        grounds:
          - calculations.onsite_inventory_reconciliation
          - entities.InventoryLedgerEntry.fields.resulting_onsite_kg
        excluded_because:
          difficulty_instance: transitive_cascade / vessel_condemnation_vents_inventory_then_restricts_station_depth_3
          rationale: |
            That instance appends an INSPECTION_VENT row of -stored_mass_kg and asserts the replayed
            onsite_inventory_kg plus every dependent aggregate, which is the projection claim in a
            harder setting.

      - name: meter_settlement_reconciles_corrected_against_metered_mass
        claim_type: reconciliation
        grounds:
          - state_machines.DispenseSession.PENDING_to_METERED
          - calculations.onsite_inventory_reconciliation
        excluded_because:
          difficulty_instance: compensating_invariant / meter_void_reversal_conserves_hydrogen_mass_in_kg_across_the_ledger
          rationale: |
            The METER_CORRECTION delta of -(corrected_kg - metered_kg) and its exact reversal are
            asserted there as a conservation law, which strictly contains the reconciliation claim.

      - name: delivery_loss_variant_selected_by_transport_mode
        claim_type: variant_selection
        grounds:
          - calculations.delivery_net_receipt.variants
          - entities.Delivery.fields.mode
        excluded_because:
          difficulty_instance: dual_variant_calc / delivery_loss_tube_trailer_heel_versus_liquid_tanker_boiloff
          rationale: |
            That instance books one delivery in each mode from the same station and asserts that
            heel applies only to TUBE_TRAILER and boil-off only to LIQUID_TANKER.

      - name: lot_carbon_intensity_variants_diverge_on_the_same_inputs
        claim_type: variant_divergence
        grounds:
          - calculations.production_lot_carbon_intensity.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / lot_carbon_intensity_annual_average_versus_hourly_matched
          rationale: |
            Same lot, two renewable shares, both results and their 35.87 delta are asserted there.

      - name: uptime_downtime_intervals_are_merged_before_weighting
        claim_type: interval_merge
        grounds:
          - calculations.station_uptime_pct
          - entities.UptimeReport.fields.full_outage_minutes
        excluded_because:
          difficulty_instance: compensating_invariant / report_amendment_conserves_holdback_cents_against_the_agreement
          rationale: |
            That instance builds overlapping and adjacent outage intervals, asserts the merged
            full_outage_minutes and both uptime variants, then amends the report; the merge claim is
            a proper subset.

      - name: incentive_admin_fee_tier_boundaries_are_keyed_on_gross_credits
        claim_type: tiered_pricing
        grounds:
          - calculations.incentive_credit_netting.constants.ADMIN_TIER_MID_MT
          - entities.IncentiveClaim.fields.admin_fee_rate
        excluded_because:
          difficulty_instance: combinatorial_formula / incentive_admin_fee_tier_keyed_on_gross_not_net_mode_c
          rationale: |
            The tier is selected on gross_credits_mt exactly at ADMIN_TIER_MID_MT there, with the
            forbidden net-keyed alternative spelled out as a falsifier.

      - name: metering_rollup_rounds_each_session_before_summation
        claim_type: aggregation
        grounds:
          - calculations.metering_accuracy_rollup
          - entities.Station.fields.corrected_kg_mtd
        excluded_because:
          difficulty_instance: combinatorial_formula / metering_rollup_rounds_per_session_before_summing_mode_b
          rationale: |
            Three sessions with per-session rounding before summation are asserted there, together
            with the forbidden sum-then-round values.

      - name: safety_posture_propagates_until_it_reaches_a_fixed_point
        claim_type: constraint_propagation
        grounds:
          - calculations.station_safety_posture
          - entities.Station.fields.high_bank_deliverable_kg
        excluded_because:
          difficulty_instance: boundary_precision_check / high_bank_deliverable_exactly_at_min_keeps_posture_open
          rationale: |
            The posture band evaluation is driven to its fixed point there by a cascade draw that
            lands high_bank_deliverable_kg exactly on 10.000 and then 0.100 kg below it.

  # ===========================================================================
  - section: validations
    instances:
      - name: precool_shortfall_violates_the_fill_protocol_and_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_140
          - errors.ERR_FILL_PROTOCOL_VIOLATION
          - state_machines.DispenseSession.PRECOOLING_to_FUELING
        distinguishing_aspect: |
          A precool temperature that is WARMER than required (-30.0 against a required -33.0) is a
          protocol violation even though it is a large negative number; the session must stay in
          PRECOOLING so the operator can chill further and retry, and no ledger row or reservation
          change may occur.
        test_recipe:
          setup:
            - "Station STN-V1: HIGH 600 L at 950.00 bar, max_pressure_class H70, nozzle_count 4, two current EMERGENCY_RESPONSE certifications, posture OPEN."
            - "One H70 LIGHT_DUTY session at ambient 30.0 C, so required_precool_c is -33.0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /funding-agreements"
              payload: { agreement_code: "FA-V1", funder_name: "State Clean Transport Fund", min_uptime_pct: 99.000, penalty_per_point_cents: 250000, initial_holdback_cents: 500000, uptime_method: "NOZZLE_WEIGHTED" }
              as: PlatformAdmin
              captures: { fa_id: "$.data.id" }
            - call: "POST /stations"
              payload: { funding_agreement_id: "${fa_id}", code: "STN-V1", name: "Protocol Station", nozzle_count: 4, offload_bay_count: 2, storage_capacity_kg: 900.000, reserve_floor_kg: 20.000, max_pressure_class: "H70", setback_compliant: true }
              as: PlatformAdmin
              captures: { st_id: "$.data.id" }
            - call: "POST /stations/${st_id}/pressure-vessels"
              payload: { bank_tier: "HIGH", water_volume_l: 600.0, mawp_bar: 1000.00, min_residual_bar: 200.00, initial_pressure_bar: 950.00, next_inspection_due_date: "2027-06-30" }
              as: SafetyOfficer
            - call: "POST /stations/${st_id}/responder-certifications"
              payload: { responder_ref: "RSP-V1-1", cert_type: "EMERGENCY_RESPONSE", valid_from: "2026-01-01", expires_on: "2027-01-01" }
              as: SafetyOfficer
            - call: "POST /stations/${st_id}/responder-certifications"
              payload: { responder_ref: "RSP-V1-2", cert_type: "EMERGENCY_RESPONSE", valid_from: "2026-01-01", expires_on: "2027-01-01" }
              as: SafetyOfficer
            - call: "GET /stations/${st_id}"
              payload: {}
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { st_v1: "$.data.version" }
            - call: "POST /dispense-sessions"
              payload: { station_id: "${st_id}", vehicle_class: "LIGHT_DUTY", target_pressure_class: "H70", fill_protocol: "SAE_J2601_TABLE", planned_kg: 5.000, ambient_temp_c: 30.0, expected_station_version: "${st_v1}" }
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { s1: "$.data.id", req: "$.data.required_precool_c" }
          trigger:
            - call: "POST /dispense-sessions/${s1}/fuel"
              payload: { precool_temp_achieved_c: -30.0 }
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "${req} == -33.0"
            - "HTTP 422 and ${err} == ERR_FILL_PROTOCOL_VIOLATION (-30.0 > -33.0)"
            - "DispenseSession.${s1}.fill_status == PRECOOLING and precool_temp_achieved_c is null"
            - "Station.${st_id}.version is unchanged by the rejected call and reserved_kg stays 5.000"
            - "no InventoryLedgerEntry row was appended"

      - name: precool_exactly_at_the_requirement_satisfies_the_fill_protocol
        claim_type: satisfaction_to_pass
        grounds:
          - validations.priority_140
          - state_machines.DispenseSession.PRECOOLING_to_FUELING
        distinguishing_aspect: |
          The rule is <= with equality COMPLYING: achieving exactly the required -33.0 must advance
          the fill axis to FUELING. An implementation that used strict < would reject the physically
          conforming fill, so the equality case is the discriminating input.
        test_recipe:
          setup:
            - "Same station and session shape as the violation case: required_precool_c -33.0 at ambient 30.0 C."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /funding-agreements"
              payload: { agreement_code: "FA-V2", funder_name: "State Clean Transport Fund", min_uptime_pct: 99.000, penalty_per_point_cents: 250000, initial_holdback_cents: 500000, uptime_method: "NOZZLE_WEIGHTED" }
              as: PlatformAdmin
              captures: { fa_id: "$.data.id" }
            - call: "POST /stations"
              payload: { funding_agreement_id: "${fa_id}", code: "STN-V2", name: "Protocol Station", nozzle_count: 4, offload_bay_count: 2, storage_capacity_kg: 900.000, reserve_floor_kg: 20.000, max_pressure_class: "H70", setback_compliant: true }
              as: PlatformAdmin
              captures: { st_id: "$.data.id" }
            - call: "POST /stations/${st_id}/pressure-vessels"
              payload: { bank_tier: "HIGH", water_volume_l: 600.0, mawp_bar: 1000.00, min_residual_bar: 200.00, initial_pressure_bar: 950.00, next_inspection_due_date: "2027-06-30" }
              as: SafetyOfficer
            - call: "POST /stations/${st_id}/responder-certifications"
              payload: { responder_ref: "RSP-V2-1", cert_type: "EMERGENCY_RESPONSE", valid_from: "2026-01-01", expires_on: "2027-01-01" }
              as: SafetyOfficer
            - call: "POST /stations/${st_id}/responder-certifications"
              payload: { responder_ref: "RSP-V2-2", cert_type: "EMERGENCY_RESPONSE", valid_from: "2026-01-01", expires_on: "2027-01-01" }
              as: SafetyOfficer
            - call: "GET /stations/${st_id}"
              payload: {}
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { st_v1: "$.data.version" }
            - call: "POST /dispense-sessions"
              payload: { station_id: "${st_id}", vehicle_class: "LIGHT_DUTY", target_pressure_class: "H70", fill_protocol: "SAE_J2601_TABLE", planned_kg: 5.000, ambient_temp_c: 30.0, expected_station_version: "${st_v1}" }
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { s1: "$.data.id" }
          trigger:
            - call: "POST /dispense-sessions/${s1}/fuel"
              payload: { precool_temp_achieved_c: -33.0 }
              as: StationOperator
              as_user_id: "${st_id}"
              captures: { fs: "$.data.fill_status", ach: "$.data.precool_temp_achieved_c" }
          assert:
            - "HTTP 200; ${fs} == FUELING and ${ach} == -33.0 (equality complies)"
            - "DispenseSession.${s1}.billing_status is still PENDING (the billing axis is untouched)"
            - "Station.${st_id}.reserved_kg == 5.000 and available_kg == 31.000"

      - name: missing_role_header_is_rejected_before_role_body_and_schema_checks
        claim_type: priority_ordering
        grounds:
          - validations.priority_10
          - validations.priority_20
          - validations.priority_50
          - validations.priority_60
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: |
          One request violates FOUR rules at once - no X-User-Role header, a role that would not be
          permitted, a missing required planned_kg, and an unknown station_id - and the response must
          be the priority-10 ERR_UNAUTHENTICATED (401), not the 403, 400 or 404 that a
          schema-validation-first framework would emit.
        test_recipe:
          setup:
            - "Empty database; clock at the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /dispense-sessions"
              payload: { station_id: "11111111-1111-4111-8111-111111111111", vehicle_class: "LIGHT_DUTY", target_pressure_class: "H70", fill_protocol: "SAE_J2601_TABLE", ambient_temp_c: 20.0 }
              as: "(no X-User-Role header sent)"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 401 and ${err} == ERR_UNAUTHENTICATED"
            - "the body's missing planned_kg (priority 50), unknown station_id (priority 60) and non-permitted role (priority 20) are NOT reported"
            - "response_type == error and the envelope carries only error_id and message"

      - name: role_denial_is_rejected_before_the_body_reference_lookup
        claim_type: priority_ordering
        grounds:
          - validations.priority_20
          - validations.priority_60
          - errors.ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: |
          A StationOperator booking a delivery names three unknown ids in the body; priority 20 must
          answer 403 ERR_ROLE_NOT_PERMITTED rather than any of the 404s, proving authorization is
          decided before existence.
        test_recipe:
          setup:
            - "Empty database; POST /deliveries is restricted to LogisticsDispatcher."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /deliveries"
              payload: { station_id: "11111111-1111-4111-8111-111111111111", production_lot_id: "22222222-2222-4222-8222-222222222222", receiving_vessel_id: "33333333-3333-4333-8333-333333333333", mode: "LIQUID_TANKER", planned_kg: 100.000, window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T12:00:00Z", departed_at: "2026-08-02T04:00:00Z" }
              as: StationOperator
              as_user_id: "11111111-1111-4111-8111-111111111111"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 403 and ${err} == ERR_ROLE_NOT_PERMITTED"
            - "not ERR_STATION_NOT_FOUND / ERR_PRODUCTION_LOT_NOT_FOUND / ERR_PRESSURE_VESSEL_NOT_FOUND"
            - "no Delivery row was created"

      - name: delivery_arrival_at_window_end_is_rejected_while_window_start_is_accepted
        claim_type: temporal
        grounds:
          - validations.priority_150
          - errors.ERR_ARRIVAL_OUTSIDE_WINDOW
          - calculations.delivery_net_receipt
        distinguishing_aspect: |
          The window is HALF-OPEN: at one single clock instant (2026-08-02T12:00:00Z) the delivery
          whose window ENDS then is outside it, while the delivery whose window STARTS then is inside
          it. Both edges are probed with the same clock value, so an inclusive-end or exclusive-start
          reading fails on exactly one of the two calls.
        test_recipe:
          setup:
            - "Station STN-V5 with offload_bay_count 2 and one LOW vessel; one PRODUCED lot (release is not required to arrive)."
            - "Delivery D1 window [2026-08-02T08:00:00Z, 2026-08-02T12:00:00Z); Delivery D2 window [2026-08-02T12:00:00Z, 2026-08-02T16:00:00Z); both TUBE_TRAILER, planned 20.000 kg, trailer 1000.0 L at 100.00 bar, departed 2026-08-02T04:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /funding-agreements"
              payload: { agreement_code: "FA-V5", funder_name: "State Clean Transport Fund", min_uptime_pct: 99.000, penalty_per_point_cents: 250000, initial_holdback_cents: 500000, uptime_method: "NOZZLE_WEIGHTED" }
              as: PlatformAdmin
              captures: { fa_id: "$.data.id" }
            - call: "POST /stations"
