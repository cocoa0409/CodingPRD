            - "LAST BLOCKED INSTANT: at clock 2026-09-20T00:00:00Z (exactly the inclusive upper bound) a second MANDATORY_PURCHASE notice -> 409 ERR_NOTICE_WINDOW_ACTIVE"
            - "DIFFERENT RESOURCE: at the SAME clock 2026-09-20 a FORCE_PLACEMENT_WARNING notice succeeds with 201, ComplianceNotice.${n2_id}.response_deadline_at == 2026-10-20T00:00:00Z (30-day window for that type)"
            - "FIRST FREE INSTANT: at clock 2026-09-21T00:00:00Z the identical MANDATORY_PURCHASE payload succeeds, ComplianceNotice.${n3_id}.status == SENT and .response_deadline_at == 2026-11-05T00:00:00Z"
            - "the rejected call wrote nothing: immediately after it LoanFolio.${f_a_id}.open_notice_count == 1 (only ${n1_id})"
            - "final cardinality: LoanFolio.${f_a_id}.open_notice_count == 3 and all of ${n1_id}, ${n2_id}, ${n3_id} are status SENT - the cooldown limits issuance rate, it does not close prior notices"
            - "posture at the end is FORCE_PLACE_ELIGIBLE, not NOTICE_PENDING: posture rule 5 matches first because ${n1_id} is SENT with response_deadline_at 2026-09-15 < clock 2026-09-21, even though ${n3_id}'s deadline is still in the future"
            - "the cooldown reads the earlier notice's window and never the folio's version, so LoanFolio.${f_a_id}.version is unchanged by the rejected attempt"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: escrow_cash_conserved_across_force_placement_and_replacement
        grounds:
          - calculations.escrow_settlement
          - calculations.force_place_premium
          - entities.LoanFolio.initial_escrow_balance_cents
          - state_machines.LoanFolio.FORCE_PLACED_to_BORROWER_PROVIDED
        distinguishing_aspect: |
          Conserved quantity: MONEY - escrow_balance_cents +
          cumulative_earned_premium_cents == initial_escrow_balance_cents, before
          the forward action, in the force-placed interim, and after the
          compensating action, with zero rounding drift even though the earned
          split is a rounded pro-rata. The other instance conserves an integer
          CARDINALITY instead of cash.
        test_recipe:
          setup:
            - "base FL chain; folio escrow_balance_cents 500000 -> initial_escrow_balance_cents 500000, policy_anniversary_date 2027-03-15"
            - "MANDATORY_PURCHASE notice sent 2026-08-01 at annual_premium_rate_cents 288000 -> response_deadline_at 2026-09-15"
            - "clock 2026-09-16 (one day past the deadline) so priority 13 passes and force placement is allowed"
            - "force placement draws the chronological_actual premium: days = (2027-03-15 - 2026-09-16) = 180, premium = round_half_up(288000 * 180 / 365) = 142027"
            - "clock 2026-10-16: exactly 30 of the 180 covered days have run when the borrower's own policy is reported"
          setup_api_calls:
            - call: "POST /flood-zone/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAnalyst
            - call: "POST /flood-zone/communities"
              payload: { community_id_code: "125129", name: "Coastal County FL", state_code: "FL" }
              as: ProviderAnalyst
              captures: { c_fl_id: $.data.id }
            - call: "POST /flood-zone/lenders"
              payload: { name: "First Coastal Bank", contact_email: "ops@firstcoastal.example", force_placement_authorized_flag: true, escrow_servicing_flag: true }
              as: ProviderAnalyst
              captures: { lender_id: $.data.id }
            - call: "POST /flood-zone/map-panels"
              payload: { community_id: "${c_fl_id}", map_panel_number: "12086C0312K", revision_sequence: 1, zone_code: "AE", base_flood_elevation_ft: 7.75, effective_date: "2020-06-05T00:00:00Z" }
              as: AgencyOfficer
              captures: { p1_id: $.data.id }
            - call: "POST /flood-zone/properties"
              payload: { community_id: "${c_fl_id}", street_address: "11 Bayfront Rd", city: "Miami", postal_code: "33101", map_panel_number: "12086C0312K", latitude: 25.7617, longitude: -80.1918, geocode_method: "ROOFTOP", geocode_confidence_score: 0.95 }
              as: ProviderAnalyst
              captures: { pr_a_id: $.data.id }
            - call: "POST /flood-zone/structures"
              payload: { property_id: "${pr_a_id}", structure_label: "Main dwelling", occupancy_type: "SINGLE_FAMILY", foundation_type: "SLAB", replacement_cost_cents: 32000000, sfha_offset_ft: -12.0 }
              as: ProviderAnalyst
              captures: { st_a_id: $.data.id }
            - call: "POST /flood-zone/loan-folios"
              payload: { lender_id: "${lender_id}", property_id: "${pr_a_id}", loan_number: "LN-4401", borrower_user_id: "borrower-a", principal_balance_cents: 28000000, policy_anniversary_date: "2027-03-15T00:00:00Z", escrow_balance_cents: 500000 }
              as: Lender
              as_user_id: "${lender_id}"
              captures: { f_a_id: $.data.id, f_a_version: $.data.version, f_a_initial_escrow: $.data.initial_escrow_balance_cents }
            - call: "POST /flood-zone/determinations"
              payload: { loan_folio_id: "${f_a_id}", structure_id: "${st_a_id}", determination_type: "ORIGINATION", expected_loan_folio_version: "${f_a_version}" }
              as: ProviderAnalyst
              as_user_id: "analyst-1"
              captures: { det_a_id: $.data.id }
            - call: "POST /flood-zone/compliance-notices"
              payload: { loan_folio_id: "${f_a_id}", determination_id: "${det_a_id}", notice_type: "MANDATORY_PURCHASE", annual_premium_rate_cents: 288000 }
              as: Lender
              as_user_id: "${lender_id}"
              captures: { n1_id: $.data.id, n1_estimate: $.data.estimated_force_place_premium_cents }
            - call: "POST /flood-zone/_clock/set_current_utc"
              payload: { current_utc: "2026-09-16T00:00:00Z" }
              as: ProviderAnalyst
          trigger:
            - call: "POST /flood-zone/loan-folios/${f_a_id}/force-placements"
              payload: {}
              as: Lender
              as_user_id: "${lender_id}"
              captures: { fp_escrow: $.data.escrow_balance_cents, fp_premium: $.data.force_placed_premium_cents, fp_days: $.data.force_placed_coverage_days }
            - call: "POST /flood-zone/_clock/set_current_utc"
              payload: { current_utc: "2026-10-16T00:00:00Z" }
              as: ProviderAnalyst
            - call: "POST /flood-zone/loan-folios/${f_a_id}/insurance-reports"
              payload: { reported_coverage_cents: 25000000 }
              as: Lender
              as_user_id: "${lender_id}"
              captures: { settled_escrow: $.data.escrow_balance_cents, settled_earned: $.data.cumulative_earned_premium_cents }
          assert:
            - "BEFORE: LoanFolio.${f_a_id}.initial_escrow_balance_cents == 500000, .escrow_balance_cents == 500000, .cumulative_earned_premium_cents == 0 -> invariant 500000 + 0 == 500000"
            - "FORWARD ACTION: LoanFolio.${f_a_id}.force_placed_coverage_days == 180, .force_placed_premium_cents == 142027, .force_placed_at == 2026-09-16T00:00:00Z, .escrow_balance_cents == 357973, .insurance_status == FORCE_PLACED"
            - "INTERIM: 357973 + 0 == 357973 != 500000 - during force placement the drawn 142027 is deliberately unearned cash in flight, held OUTSIDE both conserved buckets, which is exactly what the compensating action must resolve"
            - "COMPENSATING ACTION at 2026-10-16 (days_in_force == 30 of 180): earned == round_half_up(142027 * 30 / 180) == 23671 and refund == 142027 - 23671 == 118356"
            - "AFTER: LoanFolio.${f_a_id}.escrow_balance_cents == 476329 (357973 + 118356) and .cumulative_earned_premium_cents == 23671"
            - "INVARIANT RESTORED EXACTLY: 476329 + 23671 == 500000 == LoanFolio.${f_a_id}.initial_escrow_balance_cents, with no off-by-one from the pro-rata rounding (142027 splits exactly into 23671 + 118356)"
            - "the compensation also clears the in-flight markers: LoanFolio.${f_a_id}.force_placed_premium_cents == 0, .force_placed_coverage_days == 0, .force_placed_at == null, .insurance_status == BORROWER_PROVIDED, .uninsured_exposure_cents == 0"
            - "the forward-looking estimate is NOT the conserved figure and is never used in the settlement arithmetic: ComplianceNotice.${n1_id}.estimated_force_place_premium_cents == 144000 while the settled cash math is driven entirely by 142027"
            - "Lender.${lender_id}.open_force_placement_count == 1 after the forward action and 0 after the compensating action"
            - "ComplianceNotice.${n1_id}.status == EXPIRED after the force placement and SUPERSEDED is NOT applied twice: closed_at stays 2026-09-16T00:00:00Z after the insurance report"

      - name: open_notice_cardinality_returns_to_zero_after_acknowledgement
        grounds:
          - calculations.open_notice_count_reconciliation
          - state_machines.ComplianceNotice.SENT_to_ACKNOWLEDGED
          - calculations.compliance_posture
        distinguishing_aspect: |
          Conserved quantity: OBLIGATION CARDINALITY - open_notice_count is
          defined as a full re-count of SENT notices and must return to its exact
          pre-issuance value (0) after the acknowledgement, and compliance_posture
          must return to the same value it had before the notice existed. No money
          moves anywhere in this chain, unlike the escrow instance.
        test_recipe:
          setup:
            - "base FL chain; folio principal 28000000, escrow 500000, ORIGINATION determination -> required_coverage_cents 25000000, reported_coverage_cents 0"
            - "clock held at 2026-08-01 for the whole chain so no deadline can lapse and posture rule 5 can never match"
            - "pre-state recorded before any notice exists: open_notice_count 0, compliance_posture NOTICE_DUE"
          setup_api_calls:
            - call: "POST /flood-zone/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAnalyst
            - call: "POST /flood-zone/communities"
              payload: { community_id_code: "125129", name: "Coastal County FL", state_code: "FL" }
              as: ProviderAnalyst
              captures: { c_fl_id: $.data.id }
            - call: "POST /flood-zone/lenders"
              payload: { name: "First Coastal Bank", contact_email: "ops@firstcoastal.example" }
              as: ProviderAnalyst
              captures: { lender_id: $.data.id }
            - call: "POST /flood-zone/map-panels"
              payload: { community_id: "${c_fl_id}", map_panel_number: "12086C0312K", revision_sequence: 1, zone_code: "AE", base_flood_elevation_ft: 7.75, effective_date: "2020-06-05T00:00:00Z" }
              as: AgencyOfficer
              captures: { p1_id: $.data.id }
            - call: "POST /flood-zone/properties"
              payload: { community_id: "${c_fl_id}", street_address: "11 Bayfront Rd", city: "Miami", postal_code: "33101", map_panel_number: "12086C0312K", latitude: 25.7617, longitude: -80.1918, geocode_method: "ROOFTOP", geocode_confidence_score: 0.95 }
              as: ProviderAnalyst
              captures: { pr_a_id: $.data.id }
            - call: "POST /flood-zone/structures"
              payload: { property_id: "${pr_a_id}", structure_label: "Main dwelling", occupancy_type: "SINGLE_FAMILY", foundation_type: "SLAB", replacement_cost_cents: 32000000, sfha_offset_ft: -12.0 }
              as: ProviderAnalyst
              captures: { st_a_id: $.data.id }
            - call: "POST /flood-zone/loan-folios"
              payload: { lender_id: "${lender_id}", property_id: "${pr_a_id}", loan_number: "LN-4401", borrower_user_id: "borrower-a", principal_balance_cents: 28000000, policy_anniversary_date: "2027-03-15T00:00:00Z", escrow_balance_cents: 500000 }
              as: Lender
              as_user_id: "${lender_id}"
              captures: { f_a_id: $.data.id, f_a_version: $.data.version }
            - call: "POST /flood-zone/determinations"
              payload: { loan_folio_id: "${f_a_id}", structure_id: "${st_a_id}", determination_type: "ORIGINATION", expected_loan_folio_version: "${f_a_version}" }
              as: ProviderAnalyst
              as_user_id: "analyst-1"
              captures: { det_a_id: $.data.id }
            - call: "GET /flood-zone/loan-folios/${f_a_id}"
              payload: {}
              as: Lender
              as_user_id: "${lender_id}"
              captures: { pre_open_count: $.data.open_notice_count, pre_posture: $.data.compliance_posture }
          trigger:
            - call: "POST /flood-zone/compliance-notices"
              payload: { loan_folio_id: "${f_a_id}", determination_id: "${det_a_id}", notice_type: "MANDATORY_PURCHASE", annual_premium_rate_cents: 288000 }
              as: Lender
              as_user_id: "${lender_id}"
              captures: { n1_id: $.data.id }
            - call: "POST /flood-zone/compliance-notices/${n1_id}/acknowledgement"
              payload: {}
              as: Borrower
              as_user_id: "borrower-a"
              captures: { n1_status: $.data.status, n1_ack_role: $.data.acknowledged_by_role }
          assert:
            - "PRE: LoanFolio.${f_a_id}.open_notice_count == 0 and LoanFolio.${f_a_id}.compliance_posture == NOTICE_DUE (posture rule 7: required 25000000 > reported 0 and no notice exists)"
            - "FORWARD ACTION: LoanFolio.${f_a_id}.open_notice_count == 1 and .compliance_posture == NOTICE_PENDING (posture rule 6: SENT with response_deadline_at 2026-09-15 >= clock 2026-08-01)"
            - "COMPENSATING ACTION: ComplianceNotice.${n1_id}.status == ACKNOWLEDGED, .acknowledged_at == 2026-08-01T00:00:00Z, .acknowledged_by_role == Borrower, .closed_at == 2026-08-01T00:00:00Z"
            - "INVARIANT RESTORED: LoanFolio.${f_a_id}.open_notice_count == 0 - exactly the pre-issuance value, produced by a full re-count of SENT rows rather than by a decrement"
            - "posture also returns to its pre-issuance value: LoanFolio.${f_a_id}.compliance_posture == NOTICE_DUE (an ACKNOWLEDGED notice matches neither posture rule 5 nor rule 6)"
            - "the row is preserved, not deleted: GET /flood-zone/compliance-notices?loan_folio_id=${f_a_id} returns total_count 1 with that single ACKNOWLEDGED row, so the count conservation is over SENT status and not over row existence"
            - "no money moved: LoanFolio.${f_a_id}.escrow_balance_cents == 500000, .cumulative_earned_premium_cents == 0, .force_placed_premium_cents == 0, .insurance_status == NONE"
            - "second acknowledgement of ${n1_id} -> 409 ERR_INVALID_NOTICE_STATE, and the invariant is unaffected: open_notice_count stays 0 (the compensating action is not itself repeatable)"
            - "issuing and acknowledging a second MANDATORY_PURCHASE notice is blocked by priority 24 while the cooldown window is active, so cardinality conservation is verified once per window rather than by repeated cycling"
