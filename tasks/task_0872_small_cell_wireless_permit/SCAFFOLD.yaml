  - method: GET
    path: "/applications/{id}/fee-invoice"
    description: "fetch the application's invoice as a list (FK reverse: FeeInvoice.application_id; 0 or 1)"
    roles: [PlatformAdmin, Applicant]
    code: 200
    input: ["limit?", "offset?"]
    output: FeeInvoice[]
    side_effects: []

  - method: POST
    path: "/applications/{id}/appeal"
    description: "applicant appeals a denial / partial grant"
    roles: [Applicant]
    code: 201
    input: [grounds]
    output: Appeal
    side_effects: ["application DENIED/PARTIALLY_GRANTED -> UNDER_APPEAL; create Appeal(FILED)", "increments PermitApplication.version by 1"]

  - method: GET
    path: "/applications/{id}/appeals"
    description: "list appeals of an application (FK reverse: Appeal.application_id)"
    roles: [PlatformAdmin, Applicant, Approver]
    code: 200
    input: ["limit?", "offset?"]
    output: Appeal[]
    side_effects: []

  - method: POST
    path: "/appeals/{id}/decision"
    description: "Approver overturns or upholds an appeal (four-eyes SoD enforced)"
    roles: [Approver]
    code: 200
    input: [uphold, "decision_notes?"]
    output: Appeal
    side_effects: ["uphold=false -> OVERTURNED (denied nodes -> PERMITTED, FeeInvoice FINAL recompute); uphold=true -> UPHELD", "increments Appeal.version by 1"]

  - method: POST
    path: "/applications/{id}/withdraw"
    description: "applicant withdraws/surrenders an application; cascades node withdrawal, slot release and fee refund"
    roles: [Applicant]
    code: 200
    input: []
    output: PermitApplication
    side_effects: ["nodes -> WITHDRAWN; release reserved slots; PENDING rentals -> VOID; refund net collected", "increments PermitApplication.version by 1"]

  - method: POST
    path: "/_clock/set_current_utc"
    description: "set the server logical clock. Startup default is 2026-05-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["advance the logical clock used for all timestamps, shot-clock and moratorium math"]

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/unknown X-User-Role or missing X-User-ID"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted for this operation"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "missing required field, bad enum value, or non-positive amount where a positive integer is required"
  - id: ERR_APPLICANT_NOT_FOUND
    http: 404
    condition: "applicant id in path does not exist"
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "application id in path does not exist"
  - id: ERR_NODE_NOT_FOUND
    http: 404
    condition: "node id in path does not exist"
  - id: ERR_SUPPORT_STRUCTURE_NOT_FOUND
    http: 404
    condition: "support_structure_id references a missing structure"
  - id: ERR_ROW_SEGMENT_NOT_FOUND
    http: 404
    condition: "row_segment_id references a missing segment"
  - id: ERR_FEE_INVOICE_NOT_FOUND
    http: 404
    condition: "fee invoice id in path does not exist"
  - id: ERR_RENTAL_NOT_FOUND
    http: 404
    condition: "rental id in path does not exist"
  - id: ERR_APPEAL_NOT_FOUND
    http: 404
    condition: "appeal id in path does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "resource not in a valid from-state for the requested transition (e.g., add node to non-DRAFT, review node not IN_REVIEW, activate non-PERMITTED, appeal non-denied)"
  - id: ERR_MASTER_AGREEMENT_REQUIRED
    http: 422
    condition: "submit attempted before the applicant signed the ROW master agreement"
  - id: ERR_NO_NODES
    http: 422
    condition: "submit attempted with zero nodes or a node missing structure/segment/construction date"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "acting Approver is also a node reviewer on this application (four-eyes violation)"
  - id: ERR_NODES_PENDING_REVIEW
    http: 409
    condition: "decision requested while at least one node is still IN_REVIEW"
  - id: ERR_STRUCTURE_NOT_ACTIVE
    http: 409
    condition: "design review against a non-ACTIVE support structure"
  - id: ERR_PAVEMENT_MORATORIUM
    http: 409
    condition: "NEW_POLE node's proposed_construction_date falls within the segment pavement moratorium window"
  - id: ERR_STRUCTURE_CAPACITY_EXCEEDED
    http: 409
    condition: "design PASS would exceed the structure's max_collocations (reserved + active already at capacity)"
  - id: ERR_RENTAL_PERIOD_OVERLAP
    http: 409
    condition: "requested rental period overlaps an existing non-VOID period for the same node"
  - id: ERR_INSPECTION_NOT_PASSED
    http: 409
    condition: "activate attempted without a passing latest inspection"
  - id: ERR_INVOICE_UNPAID
    http: 402
    condition: "activate attempted while the application invoice has a non-zero outstanding balance"
  - id: ERR_INVALID_PAYMENT_AMOUNT
    http: 422
    condition: "payment amount is non-positive or exceeds the outstanding balance"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_support_structure_version / expected_fee_invoice_version does not match the current parent version"
  - id: ERR_SHOT_CLOCK_NOT_EXPIRED
    http: 409
    condition: "evaluate-deadline called when current clock <= shot_clock_deadline"
  - id: ERR_APPEAL_NOT_ALLOWED
    http: 409
    condition: "appeal filed against an application not in DENIED/PARTIALLY_GRANTED"

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: Applicant
    description: "wireless provider; owns applications, nodes, payments, appeals"
    identity: "entity_backed:Applicant"
    exclusive_operations:
      - "POST /applicants/{id}/sign-master-agreement (own record)"
      - "POST /applications"
      - "POST /applications/{id}/nodes"
      - "POST /applications/{id}/submit"
      - "POST /applications/{id}/cure"
      - "POST /applications/{id}/appeal"
      - "POST /applications/{id}/withdraw"
      - "POST /fee-invoices/{id}/payments"
    shared_operations:
      - "POST /support-structures (own proposed new poles; shared with PlatformAdmin)"
      - "GET reads on own applications, nodes, invoices, rentals, appeals"

  - name: ROWReviewer
    description: "ROW / design-standard reviewer; runs completeness and design reviews"
    identity: opaque
    exclusive_operations:
      - "POST /applications/{id}/completeness-review"
      - "POST /nodes/{id}/design-review"
    shared_operations:
      - "GET reads on applications, nodes, structures, segments"

  - name: AestheticReviewer
    description: "aesthetic / historic-district reviewer"
    identity: opaque
    exclusive_operations:
      - "POST /nodes/{id}/aesthetic-review"
    shared_operations:
      - "GET reads on applications, nodes"

  - name: Approver
    description: "issues batch and appeal decisions; must not have reviewed any node (four-eyes)"
    identity: opaque
    exclusive_operations:
      - "POST /applications/{id}/decision"
      - "POST /appeals/{id}/decision"
    shared_operations:
      - "GET reads on applications, nodes, appeals"

  - name: Inspector
    description: "records inspections and activates permitted nodes"
    identity: opaque
    exclusive_operations:
      - "POST /nodes/{id}/inspection"
      - "POST /nodes/{id}/activate"
    shared_operations:
      - "GET reads on nodes, inspections, rentals"

  - name: PlatformAdmin
    description: "seeds providers, structures, segments; runs deadline sweeps, rental renewals and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /applicants"
      - "POST /row-segments"
      - "POST /applications/{id}/evaluate-deadline"
      - "POST /rentals/{id}/renew"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /support-structures (shared with Applicant)"
      - "GET reads across all resources"
