              as: CaseManager
              captures: { v2: $.data.version }
            - call: "POST /settlement-offers"
              payload: { judgment_id: "${jud_id}", offered_by: "DEBTOR", kind: "LUMP_SUM", amount_cents: 3100000, expires_at: "2026-12-01T00:00:00Z", responds_to_offer_id: "${o1}", expected_judgment_version: "${v2}" }
              as: Debtor
              as_user_id: "${dbt_id}"
              captures: { o2: $.data.id }
            - call: "GET /judgments/${jud_id}"
              payload: {}
              as: CaseManager
              captures: { v3: $.data.version }
            - call: "POST /settlement-offers"
              payload: { judgment_id: "${jud_id}", offered_by: "CREDITOR", kind: "LUMP_SUM", amount_cents: 4200000, expires_at: "2026-12-01T00:00:00Z", responds_to_offer_id: "${o2}", expected_judgment_version: "${v3}" }
              as: CaseManager
              captures: { o3: $.data.id }
            - call: "GET /judgments/${jud_id}"
              payload: {}
              as: CaseManager
              captures: { v4: $.data.version }
            - call: "POST /settlement-offers"
