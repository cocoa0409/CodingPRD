# =============================================================================
# §1.9 Scaffold Corner Design — breadth coverage of §1.1-§1.7 claims
# not already exercised by §1.8. Logical clock default: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: client_creation_defaults_and_system_fields
        claim_type: creation
        grounds: [entities.Client]
        distinguishing_aspect: "Omitting eligibility_tier applies STANDARD; status starts ACTIVE; version starts at 1; counters start at 0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /closet/volunteers", payload: { full_name: "Vol One", is_lead: false }, as: ProgramAdmin, captures: { v1_id: $.data.id } }
          trigger:
            - { call: "POST /closet/clients", payload: { full_name: "C", household_size: 3 }, as: Volunteer, as_user_id: "${v1_id}", captures: { tier: $.data.eligibility_tier, st: $.data.status, ver: $.data.version, v30: $.data.visits_in_30d, i30: $.data.items_in_30d, lco: $.data.last_checkout_at } }
          assert:
            - "tier == STANDARD (default applied)"
            - "st == ACTIVE and ver == 1"
            - "v30 == 0 and i30 == 0 and lco == null"

      - name: client_create_missing_required_household_size
        claim_type: required_fields
        grounds: [entities.Client, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "household_size is required input; omitting it returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /closet/volunteers", payload: { full_name: "Vol One", is_lead: false }, as: ProgramAdmin, captures: { v1_id: $.data.id } }
          trigger:
            - { call: "POST /closet/clients", payload: { full_name: "C" }, as: Volunteer, as_user_id: "${v1_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: volunteer_get_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Volunteer, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but unknown volunteer id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /closet/volunteers/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: ProgramAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: item_create_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.Item]
        distinguishing_aspect: "Client-supplied status / storage_zone_id / id on item creation are ignored; the item starts PENDING_STOCK with null zone."
        test_recipe:
          setup: ["sorting staff checked in; batch IN_SORT declared 1"]
          setup_api_calls:
            - { call: "POST /closet/volunteers", payload: { full_name: "Vol One", is_lead: false }, as: ProgramAdmin, captures: { v1_id: $.data.id } }
            - { call: "POST /closet/shifts", payload: { start_at: "2026-07-31T22:00:00Z", end_at: "2026-08-01T04:00:00Z", role_type: SORTING, capacity_volunteers: 1 }, as: ProgramAdmin, captures: { sh_id: $.data.id } }
            - { call: "POST /closet/shifts/${sh_id}/signups", payload: { volunteer_id: "${v1_id}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { su_id: $.data.id } }
            - { call: "POST /closet/shifts/${sh_id}/signups/${su_id}/check-in", payload: {}, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/donation-batches", payload: { donor_name: "D", item_count_declared: 1 }, as: Volunteer, as_user_id: "${v1_id}", captures: { b_id: $.data.id } }
            - { call: "POST /closet/donation-batches/${b_id}/start-sorting", payload: {}, as: Volunteer, as_user_id: "${v1_id}" }
          trigger:
            - { call: "POST /closet/donation-batches/${b_id}/items", payload: { category: ADULT_TOPS, season: SUMMER, quality_grade: GOOD, status: RECYCLED, storage_zone_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2" }, as: Volunteer, as_user_id: "${v1_id}", captures: { ist: $.data.status, izone: $.data.storage_zone_id, igrade: $.data.graded_by_user_id } }
          assert:
            - "ist == PENDING_STOCK (injected RECYCLED ignored)"
            - "izone == null (injected zone ignored)"
            - "igrade == ${v1_id} (server-stamped grader)"

      - name: item_create_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Item, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "category must be one of the six declared enum members; HATS is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["sorting staff checked in; batch IN_SORT declared 1"]
          setup_api_calls:
            - { call: "POST /closet/volunteers", payload: { full_name: "Vol One", is_lead: false }, as: ProgramAdmin, captures: { v1_id: $.data.id } }
            - { call: "POST /closet/shifts", payload: { start_at: "2026-07-31T22:00:00Z", end_at: "2026-08-01T04:00:00Z", role_type: SORTING, capacity_volunteers: 1 }, as: ProgramAdmin, captures: { sh_id: $.data.id } }
            - { call: "POST /closet/shifts/${sh_id}/signups", payload: { volunteer_id: "${v1_id}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { su_id: $.data.id } }
            - { call: "POST /closet/shifts/${sh_id}/signups/${su_id}/check-in", payload: {}, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/donation-batches", payload: { donor_name: "D", item_count_declared: 1 }, as: Volunteer, as_user_id: "${v1_id}", captures: { b_id: $.data.id } }
            - { call: "POST /closet/donation-batches/${b_id}/start-sorting", payload: {}, as: Volunteer, as_user_id: "${v1_id}" }
          trigger:
            - { call: "POST /closet/donation-batches/${b_id}/items", payload: { category: HATS, season: SUMMER, quality_grade: GOOD }, as: Volunteer, as_user_id: "${v1_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: items_list_pagination_envelope
        claim_type: listing
        grounds: [entities.Item, response_envelope]
        distinguishing_aspect: "List endpoint honors limit/offset and reports total_count/has_more per the fixed envelope (defaults limit 10)."
        test_recipe:
          setup: ["3 items created in one batch"]
          setup_api_calls:
            - { call: "POST /closet/volunteers", payload: { full_name: "Vol One", is_lead: false }, as: ProgramAdmin, captures: { v1_id: $.data.id } }
            - { call: "POST /closet/shifts", payload: { start_at: "2026-07-31T22:00:00Z", end_at: "2026-08-01T04:00:00Z", role_type: SORTING, capacity_volunteers: 1 }, as: ProgramAdmin, captures: { sh_id: $.data.id } }
            - { call: "POST /closet/shifts/${sh_id}/signups", payload: { volunteer_id: "${v1_id}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { su_id: $.data.id } }
            - { call: "POST /closet/shifts/${sh_id}/signups/${su_id}/check-in", payload: {}, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/donation-batches", payload: { donor_name: "D", item_count_declared: 3 }, as: Volunteer, as_user_id: "${v1_id}", captures: { b_id: $.data.id } }
            - { call: "POST /closet/donation-batches/${b_id}/start-sorting", payload: {}, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/donation-batches/${b_id}/items", payload: { category: ADULT_TOPS, season: ALL_SEASON, quality_grade: GOOD }, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/donation-batches/${b_id}/items", payload: { category: ADULT_TOPS, season: ALL_SEASON, quality_grade: GOOD }, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/donation-batches/${b_id}/items", payload: { category: ADULT_TOPS, season: ALL_SEASON, quality_grade: GOOD }, as: Volunteer, as_user_id: "${v1_id}" }
          trigger:
            - { call: "GET /closet/items", payload: { limit: 2, offset: 0 }, as: ProgramAdmin, captures: { page1: $.data } }
            - { call: "GET /closet/items", payload: { limit: 2, offset: 2 }, as: ProgramAdmin, captures: { page2: $.data } }
          assert:
            - "page1.total_count == 3 and page1.has_more == true and len(page1.items) == 2"
            - "page2.has_more == false and len(page2.items) == 1"

  - section: state_machines
    instances:
      - name: batch_auto_sorted_when_declared_reached
        claim_type: valid_transition
        grounds: [state_machines.DonationBatch.IN_SORT_to_SORTED]
        distinguishing_aspect: "The IN_SORT -> SORTED transition is system-automatic: it fires exactly when items_created_count reaches item_count_declared, on the 2nd item create."
        test_recipe:
          setup: ["batch declared 2, IN_SORT"]
          setup_api_calls:
            - { call: "POST /closet/volunteers", payload: { full_name: "Vol One", is_lead: false }, as: ProgramAdmin, captures: { v1_id: $.data.id } }
            - { call: "POST /closet/shifts", payload: { start_at: "2026-07-31T22:00:00Z", end_at: "2026-08-01T04:00:00Z", role_type: SORTING, capacity_volunteers: 1 }, as: ProgramAdmin, captures: { sh_id: $.data.id } }
            - { call: "POST /closet/shifts/${sh_id}/signups", payload: { volunteer_id: "${v1_id}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { su_id: $.data.id } }
            - { call: "POST /closet/shifts/${sh_id}/signups/${su_id}/check-in", payload: {}, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/donation-batches", payload: { donor_name: "D", item_count_declared: 2 }, as: Volunteer, as_user_id: "${v1_id}", captures: { b_id: $.data.id, st0: $.data.status } }
            - { call: "POST /closet/donation-batches/${b_id}/start-sorting", payload: {}, as: Volunteer, as_user_id: "${v1_id}", captures: { st1: $.data.status } }
          trigger:
            - { call: "POST /closet/donation-batches/${b_id}/items", payload: { category: ADULT_TOPS, season: ALL_SEASON, quality_grade: GOOD }, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/donation-batches/${b_id}/items", payload: { category: ADULT_TOPS, season: ALL_SEASON, quality_grade: FAIR }, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "GET /closet/donation-batches/${b_id}", payload: {}, as: ProgramAdmin, captures: { st2: $.data.status, cnt: $.data.items_created_count } }
          assert:
            - "st0 == RECEIVED (initial state)"
            - "st1 == IN_SORT"
            - "st2 == SORTED and cnt == 2 (auto-transition on reaching declared count)"

      - name: batch_item_create_rejected_when_not_in_sort
        claim_type: invalid_transition
        grounds: [state_machines.DonationBatch, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Item creation is only legal from IN_SORT; a RECEIVED batch rejects with ERR_INVALID_STATE."
        test_recipe:
          setup: ["batch RECEIVED (never sorted)"]
          setup_api_calls:
            - { call: "POST /closet/volunteers", payload: { full_name: "Vol One", is_lead: false }, as: ProgramAdmin, captures: { v1_id: $.data.id } }
            - { call: "POST /closet/donation-batches", payload: { donor_name: "D", item_count_declared: 1 }, as: Volunteer, as_user_id: "${v1_id}", captures: { b_id: $.data.id } }
          trigger:
            - { call: "POST /closet/donation-batches/${b_id}/items", payload: { category: ADULT_TOPS, season: ALL_SEASON, quality_grade: GOOD }, as: Volunteer, as_user_id: "${v1_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: batch_close_sod_and_second_lead
        claim_type: precondition_enforcement
        grounds: [state_machines.DonationBatch.SORTED_to_CLOSED, "errors[ERR_SOD_SORTER_CANNOT_CLOSE]"]
        distinguishing_aspect: "Segregation of duties: the lead who started sorting cannot close the same batch; a different lead closes it successfully."
        test_recipe:
          setup: ["two leads; lead1 sorted the batch to SORTED"]
          setup_api_calls:
            - { call: "POST /closet/volunteers", payload: { full_name: "Lead One", is_lead: true }, as: ProgramAdmin, captures: { l1_id: $.data.id } }
            - { call: "POST /closet/volunteers", payload: { full_name: "Lead Two", is_lead: true }, as: ProgramAdmin, captures: { l2_id: $.data.id } }
            - { call: "POST /closet/shifts", payload: { start_at: "2026-07-31T22:00:00Z", end_at: "2026-08-01T04:00:00Z", role_type: SORTING, capacity_volunteers: 2 }, as: ProgramAdmin, captures: { sh_id: $.data.id } }
            - { call: "POST /closet/shifts/${sh_id}/signups", payload: { volunteer_id: "${l1_id}" }, as: VolunteerLead, as_user_id: "${l1_id}", captures: { su_id: $.data.id } }
            - { call: "POST /closet/shifts/${sh_id}/signups/${su_id}/check-in", payload: {}, as: VolunteerLead, as_user_id: "${l1_id}" }
            - { call: "POST /closet/donation-batches", payload: { donor_name: "D", item_count_declared: 1 }, as: VolunteerLead, as_user_id: "${l1_id}", captures: { b_id: $.data.id } }
            - { call: "POST /closet/donation-batches/${b_id}/start-sorting", payload: {}, as: VolunteerLead, as_user_id: "${l1_id}" }
            - { call: "POST /closet/donation-batches/${b_id}/items", payload: { category: ADULT_TOPS, season: ALL_SEASON, quality_grade: GOOD }, as: VolunteerLead, as_user_id: "${l1_id}" }
          trigger:
            - { call: "POST /closet/donation-batches/${b_id}/close", payload: {}, as: VolunteerLead, as_user_id: "${l1_id}", captures: { err: $.data.error_id } }
            - { call: "POST /closet/donation-batches/${b_id}/close", payload: {}, as: VolunteerLead, as_user_id: "${l2_id}", captures: { bst: $.data.status, cb: $.data.closed_by_user_id } }
          assert:
            - "err == ERR_SOD_SORTER_CANNOT_CLOSE"
            - "bst == CLOSED and cb == ${l2_id}"

      - name: voucher_revoke_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Voucher, "errors[ERR_INVALID_STATE]", "errors[ERR_VOUCHER_NOT_REDEEMABLE]"]
        distinguishing_aspect: "REVOKED is terminal: a second revoke fails ERR_INVALID_STATE and a redemption attempt fails ERR_VOUCHER_NOT_REDEEMABLE."
        test_recipe:
          setup: ["partner with quota 5; client; one ISSUED voucher"]
          setup_api_calls:
            - { call: "POST /closet/volunteers", payload: { full_name: "Vol One", is_lead: false }, as: ProgramAdmin, captures: { v1_id: $.data.id } }
            - { call: "POST /closet/referral-partners", payload: { name: "Agency", base_voucher_quota: 5 }, as: ProgramAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /closet/clients", payload: { full_name: "C", household_size: 2 }, as: Volunteer, as_user_id: "${v1_id}", captures: { c_id: $.data.id } }
            - { call: "POST /closet/referral-partners/${p_id}/vouchers", payload: { client_id: "${c_id}", bonus_items: 2, expires_at: "2026-12-01T00:00:00Z" }, as: ReferralPartner, as_user_id: "${p_id}", captures: { vo_id: $.data.id } }
          trigger:
            - { call: "POST /closet/vouchers/${vo_id}/revoke", payload: {}, as: ReferralPartner, as_user_id: "${p_id}", captures: { st: $.data.status } }
            - { call: "POST /closet/vouchers/${vo_id}/revoke", payload: {}, as: ReferralPartner, as_user_id: "${p_id}", captures: { err2: $.data.error_id } }
            - { call: "POST /closet/clients/${c_id}/visits", payload: { voucher_id: "${vo_id}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { err3: $.data.error_id } }
          assert:
            - "st == REVOKED"
            - "err2 == ERR_INVALID_STATE (terminal lockdown)"
            - "err3 == ERR_VOUCHER_NOT_REDEEMABLE"

      - name: visit_void_releases_reservations
        claim_type: side_effect_execution
        grounds: [state_machines.ClientVisit.CHECKED_IN_to_VOIDED, state_machines.Item.RESERVED_to_STOCKED]
        distinguishing_aspect: "Void cascade: ACTIVE lines go RELEASED, their items return RESERVED -> STOCKED, and the redeemed voucher stays REDEEMED (no un-redemption)."
        test_recipe:
          setup: ["client checked in with a voucher; 1 stocked item reserved on the visit"]
          setup_api_calls:
            - { call: "POST /closet/volunteers", payload: { full_name: "Vol One", is_lead: false }, as: ProgramAdmin, captures: { v1_id: $.data.id } }
            - { call: "POST /closet/shifts", payload: { start_at: "2026-07-31T22:00:00Z", end_at: "2026-08-01T04:00:00Z", role_type: SORTING, capacity_volunteers: 1 }, as: ProgramAdmin, captures: { sh_id: $.data.id } }
            - { call: "POST /closet/shifts/${sh_id}/signups", payload: { volunteer_id: "${v1_id}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { su_id: $.data.id } }
            - { call: "POST /closet/shifts/${sh_id}/signups/${su_id}/check-in", payload: {}, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/referral-partners", payload: { name: "Agency", base_voucher_quota: 5 }, as: ProgramAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /closet/clients", payload: { full_name: "C", household_size: 2 }, as: Volunteer, as_user_id: "${v1_id}", captures: { c_id: $.data.id } }
            - { call: "POST /closet/referral-partners/${p_id}/vouchers", payload: { client_id: "${c_id}", bonus_items: 2, expires_at: "2026-12-01T00:00:00Z" }, as: ReferralPartner, as_user_id: "${p_id}", captures: { vo_id: $.data.id } }
            - { call: "POST /closet/storage-zones", payload: { zone_code: "ZV", season_policy: ALL_SEASON, capacity_items: 5 }, as: ProgramAdmin, captures: { z_id: $.data.id } }
            - { call: "POST /closet/donation-batches", payload: { donor_name: "D", item_count_declared: 1 }, as: Volunteer, as_user_id: "${v1_id}", captures: { b_id: $.data.id } }
            - { call: "POST /closet/donation-batches/${b_id}/start-sorting", payload: {}, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/donation-batches/${b_id}/items", payload: { category: ADULT_TOPS, season: ALL_SEASON, quality_grade: GOOD }, as: Volunteer, as_user_id: "${v1_id}", captures: { i1: $.data.id } }
            - { call: "POST /closet/items/${i1}/stock", payload: { storage_zone_id: "${z_id}" }, as: Volunteer, as_user_id: "${v1_id}" }
            - { call: "POST /closet/clients/${c_id}/visits", payload: { voucher_id: "${vo_id}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { vs_id: $.data.id } }
            - { call: "POST /closet/visits/${vs_id}/lines", payload: { item_id: "${i1}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { ln1: $.data.id } }
          trigger:
            - { call: "POST /closet/visits/${vs_id}/void", payload: {}, as: ProgramAdmin, captures: { vst: $.data.status } }
            - { call: "GET /closet/distribution-lines/${ln1}", payload: {}, as: ProgramAdmin, captures: { lst: $.data.status } }
            - { call: "GET /closet/items/${i1}", payload: {}, as: ProgramAdmin, captures: { ist: $.data.status } }
            - { call: "GET /closet/vouchers/${vo_id}", payload: {}, as: ProgramAdmin, captures: { vost: $.data.status } }
          assert:
            - "vst == VOIDED"
            - "lst == RELEASED and ist == STOCKED (reservation released)"
            - "vost == REDEEMED (void does not un-redeem)"

      - name: checkout_empty_visit_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.ClientVisit.CHECKED_IN_to_CHECKED_OUT, "errors[ERR_EMPTY_VISIT_CHECKOUT]"]
        distinguishing_aspect: "Checkout requires >= 1 ACTIVE line; an empty visit returns ERR_EMPTY_VISIT_CHECKOUT and stays CHECKED_IN."
        test_recipe:
          setup: ["client checked in, no lines"]
          setup_api_calls:
            - { call: "POST /closet/volunteers", payload: { full_name: "Vol One", is_lead: false }, as: ProgramAdmin, captures: { v1_id: $.data.id } }
            - { call: "POST /closet/clients", payload: { full_name: "C", household_size: 2 }, as: Volunteer, as_user_id: "${v1_id}", captures: { c_id: $.data.id } }
            - { call: "POST /closet/clients/${c_id}/visits", payload: {}, as: Volunteer, as_user_id: "${v1_id}", captures: { vs_id: $.data.id } }
          trigger:
            - { call: "POST /closet/visits/${vs_id}/checkout", payload: {}, as: Volunteer, as_user_id: "${v1_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_EMPTY_VISIT_CHECKOUT"

      - name: shift_complete_no_show_cascade
        claim_type: side_effect_execution
        grounds: [state_machines.VolunteerShift.OPEN_to_COMPLETED, state_machines.ShiftSignup]
        distinguishing_aspect: "Complete cascades per-signup: SIGNED_UP -> NO_SHOW and CHECKED_IN -> COMPLETED; the shift lands COMPLETED."
        test_recipe:
          setup: ["shift 2026-08-01 00:00-02:00 capacity 2; v1 signed up only; v2 checked in at 00:00"]
          setup_api_calls:
            - { call: "POST /closet/volunteers", payload: { full_name: "Vol One", is_lead: false }, as: ProgramAdmin, captures: { v1_id: $.data.id } }
            - { call: "POST /closet/volunteers", payload: { full_name: "Vol Two", is_lead: false }, as: ProgramAdmin, captures: { v2_id: $.data.id } }
            - { call: "POST /closet/shifts", payload: { start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-01T02:00:00Z", role_type: FLOOR, capacity_volunteers: 2 }, as: ProgramAdmin, captures: { sh_id: $.data.id } }
            - { call: "POST /closet/shifts/${sh_id}/signups", payload: { volunteer_id: "${v1_id}" }, as: Volunteer, as_user_id: "${v1_id}", captures: { su1: $.data.id } }
            - { call: "POST /closet/shifts/${sh_id}/signups", payload: { volunteer_id: "${v2_id}" }, as: Volunteer, as_user_id: "${v2_id}", captures: { su2: $.data.id } }
            - { call: "POST /closet/shifts/${sh_id}/signups/${su2}/check-in", payload: {}, as: Volunteer, as_user_id: "${v2_id}" }
            - { call: "POST /closet/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T03:00:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /closet/shifts/${sh_id}/complete", payload: {}, as: ProgramAdmin, captures: { shst: $.data.status } }
            - { call: "GET /closet/volunteers/${v1_id}/signups", payload: {}, as: ProgramAdmin, captures: { su1_list: $.data } }
            - { call: "GET /closet/volunteers/${v2_id}/signups", payload: {}, as: ProgramAdmin, captures: { su2_list: $.data } }
          assert:
            - "shst == COMPLETED"
            - "su1_list[0].status == NO_SHOW (signed up, never checked in)"
            - "su2_list[0].status == COMPLETED (was checked in)"

      - name: rotation_execute_outside_window_rejected
        claim_type: invalid_transition
        grounds: [state_machines.SeasonalRotation, "errors[ERR_ROTATION_OUTSIDE_WINDOW]"]
        distinguishing_aspect: "Execute outside [window_start, window_end] fails ERR_ROTATION_OUTSIDE_WINDOW; cancel remains legal and lands CANCELLED."
        test_recipe:
          setup: ["rotation window 2026-09-01..2026-09-02; clock at default 2026-08-01"]
          setup_api_calls:
            - { call: "POST /closet/seasonal-rotations", payload: { target_season: WINTER, window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-02T00:00:00Z" }, as: ProgramAdmin, captures: { r_id: $.data.id } }
          trigger:
            - { call: "POST /closet/seasonal-rotations/${r_id}/execute", payload: {}, as: ProgramAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /closet/seasonal-rotations/${r_id}/cancel", payload: {}, as: ProgramAdmin, captures: { rst: $.data.status } }
          assert:
            - "err == ERR_ROTATION_OUTSIDE_WINDOW"
            - "rst == CANCELLED"

      - name: drive_lazy_status_advancement
        claim_type: valid_transition
        grounds: [state_machines.SpecialDrive]
        distinguishing_aspect: "Drive status is clock-derived and lazily advanced on reads: UPCOMING before start_at, ACTIVE inside [start_at, end_at], CLOSED after end_at."
        test_recipe:
          setup: ["drive 2026-08-05..2026-08-10 created at default clock"]
          setup_api_calls:
            - { call: "POST /closet/drives", payload: { drive_type: WINTER_COATS, target_category: COATS, start_at: "2026-08-05T00:00:00Z", end_at: "2026-08-10T00:00:00Z", bonus_items_per_client: 1 }, as: ProgramAdmin, captures: { d_id: $.data.id, st0: $.data.status } }
          trigger:
            - { call: "GET /closet/drives/${d_id}", payload: {}, as: ProgramAdmin, captures: { st1: $.data.status } }
            - { call: "POST /closet/_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T00:00:00Z" }, as: ProgramAdmin }
            - { call: "GET /closet/drives/${d_id}", payload: {}, as: ProgramAdmin, captures: { st2: $.data.status } }
            - { call: "POST /closet/_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T00:00:00Z" }, as: ProgramAdmin }
            - { call: "GET /closet/drives/${d_id}", payload: {}, as: ProgramAdmin, captures: { st3: $.data.status } }
          assert:
            - "st0 == UPCOMING and st1 == UPCOMING (start_at not reached)"
            - "st2 == ACTIVE"
            - "st3 == CLOSED (now > end_at)"

      - name: client_suspend_blocks_checkin
        claim_type: cross_entity_validation
        grounds: [state_machines.Client, "errors[ERR_CLIENT_NOT_ACTIVE]"]
        distinguishing_aspect: "Client cyclic machine ACTIVE -> SUSPENDED -> ACTIVE: while SUSPENDED, check-in fails ERR_CLIENT_NOT_ACTIVE; after reinstate it succeeds."
        test_recipe:
          setup: ["client registered"]
          setup_api_calls:
            - { call: "POST /closet/volunteers", payload: { full_name: "Vol One", is_lead: false }, as: ProgramAdmin, captures: { v1_id: $.data.id } }
            - { call: "POST /closet/clients", payload: { full_name: "C", household_size: 2 }, as: Volunteer, as_user_id: "${v1_id}", captures: { c_id: $.data.id } }
          trigger:
