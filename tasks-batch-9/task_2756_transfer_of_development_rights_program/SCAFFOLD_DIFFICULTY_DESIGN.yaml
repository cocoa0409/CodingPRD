  - rule_id: cross_entity_state_dependency
    instances:

      - name: parcel_enrollment_gated_by_sending_area_status
        grounds:
          - validations.priority_26_ERR_SENDING_AREA_NOT_ACTIVE
          - state_machines.SendingArea.DRAFT_to_ACTIVE
          - entities.SendingParcel.fields.sending_area_id
          - calculations.parcel_baseline_allocation
        distinguishing_aspect: |
          Entity pair: SendingParcel depends on SendingArea. The parcel write is refused
          purely because of the OTHER entity's status (DRAFT), not because of anything wrong
          with the parcel payload — the byte-identical payload succeeds once the area is
          activated, and only then is the baseline allocation computed.
